source:
  edition: WLC
  text: אַחַ֣/י אַתֶּ֔ם עַצְמִ֥/י וּ/בְשָׂרִ֖/י אַתֶּ֑ם וְ/לָ֧/מָּה תִהְי֛וּ אַחֲרֹנִ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'my kinsmen'; literally, 'my brothers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my bone and my flesh,' an idiom for close blood relationship.
    reason: cultural_note
  - marker: c
    text: David speaks of himself in the third person as 'the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 내 형제들입니다[a]. 여러분은 나의 뼈와 살입니다[b]. 그러니 왕을 다시 모셔 오는 일에 여러분이 어찌하여 가장 마지막이 되겠습니까[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 형제들’입니다. 문맥상 더 넓게는 친족·동족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 가까운 혈연관계를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 다윗이 자신을 ‘왕’이라 3인칭으로 가리키는 표현을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: אַחַי
  english_pob_choice: my brothers
  chosen_korean: 내 형제들
  alternatives_korean:
  - 내 친족들
  - 내 형제들이자 친족들
  lexicon: HALOT
  rationale: 직역상 ‘형제들’이지만, 문맥상 다윗이 유다의 장로들을 가까운 혈연적 연대로 부르는 표현이므로 한국어에서도 직접적으로 ‘내 형제들’로 살렸습니다. 포괄적 친족 의미는 다음 절의 ‘뼈와 살’이 보강합니다.
- source_word: עַצְמִי וּבְשָׂרִי
  english_pob_choice: my own bone and flesh
  chosen_korean: 나의 뼈와 살
  alternatives_korean:
  - 내 뼈와 살
  - 나의 뼈와 내 살
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 유지하기 위해 한국어에서도 관용적이면서도 직설적인 ‘뼈와 살’을 사용했습니다. 소유격 ‘나의’로 혈연적 친밀성을 분명히 했습니다.
- source_word: תִהְיוּ אַחֲרֹנִים
  english_pob_choice: should you be the last
  chosen_korean: 가장 나중이 되어야 하겠습니까
  alternatives_korean:
  - 맨 마지막이 되겠습니까
  - 뒤늦게 해야 하겠습니까
  lexicon: HALOT
  rationale: 동사의 미완료형은 단순 미래보다 권면·수사의 뉘앙스가 강하므로, 한국어에서는 ‘되어야 하겠습니까’로 권유성 질문을 살렸습니다.
- source_word: אֶת הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕을
  alternatives_korean:
  - 그 왕을
  - 다윗 왕을
  lexicon: HALOT
  rationale: 히브리어는 3인칭 자기 지시를 유지하므로, 한국어도 ‘왕을’로 옮겨 원문의 서술적 자기호칭을 보존했습니다.
theological_decisions:
- issue: 다윗의 자기지시를 1인칭으로 바꾸지 않을지
  chosen_reading: ‘왕을’로 유지하여 다윗이 스스로를 3인칭으로 가리키는 형식을 보존했습니다.
  alternative_readings:
  - ‘나를’로 옮겨 자연스럽게 만들기
  - ‘나, 왕을’로 풀어쓰기
  rationale: 본문은 왕권의 위엄과 수사적 거리감을 드러내는 3인칭 자기지시를 사용합니다. 이를 1인칭으로 바꾸면 원문의 표현 효과가 약해집니다.
  doctrine_reference: 본문 수사와 서술 관점 보존
- issue: 혈연 표현을 완전히 중립화할지
  chosen_reading: ‘형제들’과 ‘뼈와 살’을 함께 두어 직접적 혈연·동족 의식을 살렸습니다.
  alternative_readings:
  - ‘친족들’만 사용
  - ‘가까운 사이’로 완화
  rationale: 히브리어의 친족 호칭과 관용구가 함께 쓰여 관계의 강도를 강화합니다. 이를 지나치게 중립화하면 설득의 근거가 약해집니다.
  doctrine_reference: 구약의 언약적 친족 수사
