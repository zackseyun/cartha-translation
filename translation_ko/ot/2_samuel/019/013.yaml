  verdict: revise
  source_fidelity: 핵심 어휘와 구문은 대체로 충실합니다. ‘내 형제들,’ ‘나의 뼈와 살,’ 그리고 다윗의 3인칭 자기지시인 ‘왕’을 잘 보존했습니다. 다만 וְלָמָה의 앞 절에 근거한 추론적 연결은 ‘그런데’보다 ‘그러니’가 더 정확하며, ‘가장 나중이 되어야 하겠습니까’는 한국어에서 다소 부자연스럽고 불필요하게 당위성을 강화합니다.
  naturalness: 합쇼체는 일관되고 적절합니다. ‘왕을 다시 모셔 오는 일에 … 가장 마지막이 되겠습니까?’로 하면 현대 표준어에서 더 자연스럽고, 행동의 순서에서 뒤처진다는 원문의 수사적 질문도 명료해집니다.
  terminology: ‘형제들’은 אַחַי의 직역을 유지하며, 각주가 문맥상의 친족 의미를 적절히 안내합니다. ‘뼈와 살’도 혈연적 친밀성을 나타내는 히브리어 관용구의 이미지를 보존합니다. ‘왕’은 다윗의 3인칭 자기지시를 충실히 반영합니다.
