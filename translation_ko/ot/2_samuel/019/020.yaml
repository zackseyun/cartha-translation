  text: וַ/יֹּ֣אמֶר אֶל הַ/מֶּ֗לֶךְ אַל יַחֲשָׁב לִ֣/י אֲדֹנִ/י֮ עָוֺן֒ וְ/אַל תִּזְכֹּ֗ר אֵ֚ת אֲשֶׁ֣ר הֶעֱוָ֣ה עַבְדְּ/ךָ֔ בַּ/יּ֕וֹם אֲשֶׁר יָׄצָ֥ׄאׄ אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ מִ/ירֽוּשָׁלִָ֑ם לָ/שׂ֥וּם הַ/מֶּ֖לֶךְ אֶל לִבּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
  footnotes:
  - marker: a
    text: Or “do not count iniquity to me”; the Hebrew idiom is literally forensic in form.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “set it on his heart,” an idiom meaning to take something seriously or hold it against someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 왕에게 말했습니다. “제 주님께서 이 종의 죄를 죄로 여기지 마시고, 제 종이 제 주님 왕께서 예루살렘에서 나가시던 날에 저지른 잘못을 기억하지 마십시오. 왕께서 그것을 마음에 두지 마시게 하려는 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “죄를 나에게 계산하지 마십시오”라는 법정적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그것을 그의 마음 위에 두다”라는 관용구로, 어떤 일을 마음에 두고 심각하게 여기거나 불리하게 기억한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַחֲשָׁב לִי עָוֺן
  english_pob_choice: count me guilty
  chosen_korean: 이 종의 죄를 죄로 여기지 마시고
  alternatives_korean:
  - 저를 죄인으로 여기지 마시고
  - 이 종에게 죄를 돌리지 마시고
  - 이 종의 죄를 계산하지 마시고
  lexicon: HALOT
  rationale: 히브리어는 법정적 표현으로 ‘죄/악을 나에게 계산하다’는 뜻이므로, 한국어에서는 자연스럽게 ‘죄로 여기다/돌리다’로 옮겨 유죄 판정을 거부하는 뜻을 살렸습니다.
- source_word: תִּזְכֹּר
  english_pob_choice: remember
  chosen_korean: 기억하지 마십시오
  alternatives_korean:
  - 상기하지 마십시오
  - 마음에 두지 마십시오
  - 잊으십시오
  lexicon: HALOT
  rationale: 단순한 ‘기억하다’이지만 문맥상 기억하여 불리하게 여기지 말라는 청원이라, 직접적인 금지를 유지하면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: הֶעֱוָה
  english_pob_choice: did wrong
  chosen_korean: 저지른 잘못
  alternatives_korean:
  - 악을 행한
  - 죄를 지은
  - 비뚤어지게 한
  lexicon: HALOT
  rationale: 히필형의 잘못된 행위를 뜻하므로, 도덕적 비난을 과도하게 키우지 않으면서도 책임을 분명히 하는 표현을 선택했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 제 종
  alternatives_korean:
  - 당신의 종
  - 당신의 노예
  - 이 종
  lexicon: HALOT
  rationale: 왕 앞의 겸손한 자기지칭으로서 ‘종’이 가장 자연스럽고, 여기서는 bonded-status를 전면화할 문맥이 아니므로 ‘노예’ 대신 사용했습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 제 주님 왕께서
  alternatives_korean:
  - 나의 주 왕께서
  - 주인이신 왕께서
  - 내 주 왕께서
  lexicon: HALOT
  rationale: אדני는 인간 왕에게 대한 존칭이므로 ‘주님’보다 서술 속에서는 ‘주님 왕’으로 풀어 예우를 유지했고, 직역의 딱딱함은 줄였습니다.
theological_decisions:
- issue: 왕에게 대한 존칭과 신적 호칭의 구분
  chosen_reading: 인간 왕에게는 ‘제 주님’/‘제 주님 왕’으로 번역하고, 신적 호칭이 아닌 것으로 분명히 했습니다.
  alternative_readings:
  - ‘주님’만 사용하기
  - ‘주’로 축약하기
  rationale: 히브리어 אֲדֹנִי는 여기서 여호와가 아니라 왕에 대한 경칭이므로, 한국어 독자가 신적 호칭으로 오해하지 않도록 문맥상 인간 대상 존칭을 유지했습니다.
  doctrine_reference: 역사-문법적 문맥 구분
