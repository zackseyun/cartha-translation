  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
  footnotes:
  - marker: a
    text: Hebrew 'with the man of Judah'; the expression is understood collectively here as 'with the men of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시므이, 게라의 아들, 베냐민 사람으로서 바후림 출신인 그가 서둘러 유다 사람들과 함께 내려와 다윗 왕을 맞으러 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘유다 사람’(단수)이나, 문맥상 집합적으로 ‘유다 사람들’로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
