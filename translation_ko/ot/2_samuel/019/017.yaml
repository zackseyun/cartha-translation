  rationale: 본문은 지파 소속과 왕권을 서술적으로 드러내므로, 한국어에서도 그 표지를 분명히 유지하는 편이 본문의 의미를 잘 전달합니다.
  doctrine_reference: 서사 본문의 역사적·정치적 표지 보존
- issue: 단수형 집합 표현 처리
  chosen_reading: ‘유다 사람들과 함께’로 집합적 의미를 반영했습니다.
  alternative_readings:
  - ‘유다 사람 한 명과 함께’
  - ‘유다 사람과 함께’
  rationale: 히브리어의 집합적 단수 관용구를 문자적으로 유지하면 한국어 의미가 어색해질 수 있어, 본문이 의도한 동행의 집합성을 우선했습니다.
