  chosen_reading: 선과 악을 분별할 수 있겠습니까?
  alternative_readings:
  - 좋음과 나쁨을 가릴 수 있겠습니까?
  - 선과 악을 알 수 있겠습니까?
  rationale: 본문은 윤리적 대조를 반복 공식처럼 쓰지만, 여기서는 나이와 감각 저하가 중심이므로 도덕 교리화보다 판단력 약화를 드러내는 번역이 적절합니다.
  doctrine_reference: 인간의 노쇠와 한계에 대한 일반적 성경 인식
