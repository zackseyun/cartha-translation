  - severity: low
    issue: ‘소리’의 수식 관계
    rationale: ‘남자 가수와 여자 가수의 소리’도 이해되지만, 사람의 קול에 대응하는 ‘목소리’가 현대 한국어에서 더 명료하고 자연스럽습니다.
