base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
  footnotes:
  - marker: a
    text: Or 'Can I discern between good and evil?' The Hebrew expression can denote moral or practical discernment; here the context of age and failing senses favors the broader sense of diminished judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 오늘로 팔십 살입니다[a]. 제가 아직도 선과 악을 분별할 수 있겠습니까? 당신의 종이 먹는 것과 마시는 것을 맛볼 수 있겠습니까? 제가 아직도 남자 가수와 여자 가수의 소리를 들을 수 있겠습니까? 그런데 어찌하여 당신의 종이 아직도 내 주 왕에게 짐이 되겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '제가 아직도 선과 악을 분별할 수 있겠습니까?' 히브리어 표현은 도덕적 분별이나 실용적 판단 모두를 가리킬 수 있으며, 여기서는 나이와 감각 저하의 문맥이 더 넓은 판단력 약화를 가리키는 쪽을 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה / הַיּוֹם
  english_pob_choice: eighty years old today
  chosen_korean: 오늘로 팔십 살입니다
  alternatives_korean:
  - 저는 오늘 팔십 살입니다
  - 오늘이 팔십 살입니다
  lexicon: HALOT
  rationale: 나이를 나타내는 히브리어 관용구를 한국어의 자연스러운 연령 표현으로 옮겼고, הַיּוֹם의 시점성을 '오늘로'로 살렸습니다.
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  english_pob_choice: Can I still distinguish between good and bad?
  chosen_korean: 제가 아직도 선과 악을 분별할 수 있겠습니까?
  alternatives_korean:
  - 제가 아직도 선과 악을 알 수 있겠습니까?
  - 제가 아직도 좋고 나쁨을 분간할 수 있겠습니까?
  lexicon: HALOT
  rationale: ידע בין의 분별/식별 의미를 살리되, POB의 문맥 판단처럼 노쇠로 인한 인지 저하를 자연스럽게 드러내도록 '분별하다'를 택했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 시종
  lexicon: HALOT
  rationale: 왕 앞의 공손한 자기 지칭으로는 한국어에서 '종'이 가장 자연스럽고, 본문의 핵심은 신분의 구속성보다 겸양 표현이므로 '노예'는 피했습니다.
- source_word: שָׁרִים וְשָׁרוֹת
  english_pob_choice: male singers and female singers
  chosen_korean: 남자 가수와 여자 가수
  alternatives_korean:
  - 남성들과 여성들
  - 노래하는 남자들과 노래하는 여자들
  lexicon: HALOT
  rationale: 히브리어의 성별 구분을 지우지 않기 위해 남녀를 모두 드러냈고, 청각적 맥락에 맞게 '가수'를 사용했습니다.
- source_word: לְמַשָּׂא
  english_pob_choice: a burden
  chosen_korean: 짐
  alternatives_korean:
  - 부담
  - 짐짝
  lexicon: HALOT
  rationale: 비유적 'burden'을 한국어의 직접적이고 자연스러운 표현인 '짐'으로 옮겨 왕에게 거추장스러운 존재라는 뉘앙스를 살렸습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 나의 주 왕
  - 내 주, 왕이신 분
  lexicon: HALOT
  rationale: 인간 왕에게 대한 궁정 호칭을 유지하면서도, 문맥상 과도한 관어를 피하고 한국어 호칭 순서에 맞게 압축했습니다.
theological_decisions:
