  to: 그때 왕이 돌아와 요단까지 이르렀고, 유다[a]는 왕을 맞이하고 왕을 요단강을 건너 모시기 위해 길갈로 왔습니다.
  rationale: ‘요단까지’로 עַד의 경계 의미를 드러내고, 유다가 길갈에 온 두 목적을 ‘왕을 맞이하고 왕을 요단강을 건너 모시기 위해’로 표현했습니다. 이에 따라 원문에 없는 ‘하려 했다’의 미수·의도 뉘앙스를 제거했습니다. 집합적 ‘유다’에 관한 각주는 해당 낱말 바로 뒤에 배치했습니다.
