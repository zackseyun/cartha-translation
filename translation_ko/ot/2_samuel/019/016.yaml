id: 2SA.19.16
reference: 2 Samuel 19:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣שָׁב הַ/מֶּ֔לֶךְ וַ/יָּבֹ֖א עַד הַ/יַּרְדֵּ֑ן וִ/יהוּדָ֞ה בָּ֣א הַ/גִּלְגָּ֗לָ/ה לָ/לֶ֨כֶת֙ לִ/קְרַ֣את הַ/מֶּ֔לֶךְ לְ/הַעֲבִ֥יר אֶת הַ/מֶּ֖לֶךְ אֶת הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
  footnotes:
  - marker: a
    text: Or 'the men of Judah had come to Gilgal.' The Hebrew uses 'Judah' collectively for the people/tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 돌아와 요단에 이르렀고, 유다는 왕을 맞이하려고 길갈로 왔으며, 왕을 요단강 건너편으로 모시고 가려 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들’이 길갈로 왔다는 뜻일 수 있습니다. 히브리어는 ‘유다’를 집합적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב הַמֶּלֶךְ
  english_pob_choice: Then the king returned
  chosen_korean: 왕이 돌아와
  alternatives_korean:
  - 왕이 되돌아와
  - 왕이 다시 돌아와
  lexicon: HALOT
  rationale: שׁוב의 서사적 진행을 자연스럽게 살리되, 왕의 귀환이라는 맥락을 과장 없이 간결하게 반영했습니다.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  english_pob_choice: came as far as the Jordan
  chosen_korean: 요단에 이르렀고
  alternatives_korean:
  - 요단까지 왔고
  - 요단강에 도착했고
  lexicon: HALOT
  rationale: עַד가 나타내는 ‘~까지’의 경계를 살리되, 한국어에서는 ‘이르렀다’가 가장 자연스럽고 의미를 보존합니다.
- source_word: וִיהוּדָה בָּא הַגִּלְגָּלָה
  english_pob_choice: Judah came to Gilgal
  chosen_korean: 유다는 … 길갈로 왔으며
  alternatives_korean:
  - 유다가 길갈로 왔으며
  - 유다 사람들이 길갈로 왔으며
  lexicon: HALOT
  rationale: 히브리어가 단순히 ‘유다’를 집합적으로 사용하므로 본문은 간결하게 유지하고, 집합적 의미는 문맥이 드러내도록 했습니다.
- source_word: לָלֶכֶת לִקְרַאת הַמֶּלֶךְ
  english_pob_choice: to go to meet the king
  chosen_korean: 왕을 맞이하려고
  alternatives_korean:
  - 왕을 만나러 가려고
  - 왕을 맞으러 가려고
  lexicon: HALOT
  rationale: 두 부정사구의 목적성을 한국어 한 구로 압축해 자연스럽게 표현하되, ‘meet’의 단순 대면보다 왕을 향해 나아가는 의도를 살렸습니다.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  english_pob_choice: to bring the king across the Jordan
  chosen_korean: 왕을 요단강 건너편으로 모시고 가려 했습니다
  alternatives_korean:
  - 왕을 요단을 건너게 하려 했습니다
  - 왕을 요단강을 건너 모시려 했습니다
  lexicon: HALOT
  rationale: העביר의 사역적 의미를 ‘건너게 하다’로 풀 수 있지만, 한국어에서는 왕에게 대한 공손한 행위와 이동의 결과를 함께 드러내는 ‘모시고 가다’가 더 적절합니다.
theological_decisions:
- issue: 유다가 집합명사로 쓰인 표현
  chosen_reading: ‘유다’는 지파/백성을 가리키는 집합적 표현으로 두었습니다.
  alternative_readings:
  - ‘유다 사람들’로 풀어 씀
  - ‘유다 지파가’로 명시
  rationale: 본문의 간결한 집합적 용법을 보존하고, 해석을 본문 밖으로 과도하게 확장하지 않기 위함입니다.
  doctrine_reference: 본문-문법 일치 원칙
