  lexicon: HALOT
  rationale: ב형태의 서술 진행을 한국어 서사 흐름에 맞게 ‘그때’로 옮기고, distributive 표현은 ‘모든 사람’으로 살려 집합적 응답을 드러냈습니다.
- source_word: עַל אִישׁ יִשְׂרָאֵל
  english_pob_choice: the man of Israel
  chosen_korean: 이스라엘 사람에게
  alternatives_korean:
  - 이스라엘 사람에게 맞서
  - 이스라엘 사람에게 대하여
  lexicon: HALOT
  rationale: עַל+ענה는 논쟁/응답의 상대를 가리킬 수 있으므로, 자연스러운 한국어 조사 ‘-에게’로 대응해 대결적 뉘앙스를 과장하지 않으면서도 응답 관계를 유지했습니다.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  english_pob_choice: Because the king is a close relative to me
  chosen_korean: 왕은 내게 가까운 친족입니다
  alternatives_korean:
  - 왕은 내게 가깝습니다
  - 왕은 내게 가까운 사람입니다
  lexicon: HALOT
  rationale: קָרוֹב+אֶל은 단순 거리보다 친족적/관계적 근접을 뜻하므로, ‘가까운 친족’으로 구체화해 유다의 정당화 논리를 드러냈습니다.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ … אִם נִשֵּׂאת נִשָּׂא לָנוּ
  english_pob_choice: Have we eaten at all at the king’s expense? Or has he given us any gift?
  chosen_korean: 우리가 왕에게서 무엇을 조금이나마 먹었습니까? 아니면 그가 우리에게 무슨 선물을 주었습니까?
  alternatives_korean:
  - 우리가 왕의 것을 조금이라도 먹었습니까? 아니면 그가 우리에게 무슨 선물을 주었습니까?
  - 우리가 왕에게서 먹은 것이 있습니까? 아니면 그가 우리에게 무슨 선물을 주었습니까?
  lexicon: HALOT
  rationale: 첫째 절은 ‘먹다’의 강조형을 살리되 한국어로는 ‘조금이나마’로 중첩 강세를 자연화했고, קשה한 마지막 절은 POB의 최종 판단을 따라 ‘선물을 주었습니까’로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 ‘왕’과 ‘친족’ 진술의 의미
  chosen_reading: 유다가 다윗과의 혈연/지파적 근접성을 근거로 자신들의 우선권을 주장하는 말로 읽었습니다.
  alternative_readings:
  - 단순한 지리적 근접 주장으로 읽는 것
  - 단순한 호의나 개인적 친밀감으로 약화해 읽는 것
  rationale: 히브리어 קָרוֹב + אֵלַי와 문맥상 분쟁 대응 논리는 관계적·족속적 근접을 가리키는 쪽이 가장 자연스럽습니다.
  doctrine_reference: 문맥 주해/담화 의미
