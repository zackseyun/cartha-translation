base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
  footnotes:
  - marker: a
    text: Hebrew literally, 'the king is close to me'; the sense here is likely kinship or tribal closeness.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Have we eaten any of the king’s food? Or has anything been given to us?' The Hebrew of the final clause is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 유다의 모든 사람이 이스라엘 사람에게 대답했습니다. “왕은 내게 가까운 친족입니다[a]. 그런데 어찌하여 이 일로 당신이 화가 났습니까? 우리가 왕에게서 조금이라도 얻어먹은 것이 있습니까? 아니면 그가 우리에게 무슨 선물을 주었습니까?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘왕이 내게 가깝다’이지만, 여기서는 친족 관계나 지파적 근접을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 히브리어는 어렵습니다. 뜻은 ‘우리가 왕의 음식을 조금이라도 먹었습니까? 혹은 그가 우리에게 무엇이든 주었습니까?’ 정도일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן כָּל אִישׁ יְהוּדָה
  english_pob_choice: Then every man of Judah answered
