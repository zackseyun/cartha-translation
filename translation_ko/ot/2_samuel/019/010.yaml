reference: 2 Samuel 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
  footnotes:
  - marker: a
    text: Or “were debating” or “were in dispute.” The Hebrew suggests widespread contention among the tribes, not merely casual conversation.
    reason: lexical_alternative
  - marker: b
    text: Literally “from the hand of our enemies” and “from the hand of the Philistines,” a Hebrew idiom for deliverance from another’s power.
    reason: lexical_alternative
  - marker: c
    text: Or “from before Absalom” / “on account of Absalom.” The Hebrew expression is idiomatic for fleeing away because of him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 백성은 이스라엘의 모든 지파 가운데에서 다투며 말했습니다. “왕께서 우리를 원수들의 손에서 구해 주셨고, 또 블레셋 사람들의 손에서 건져 주셨는데, 이제는 압살롬 때문에 이 땅에서 도망하셨습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이스라엘의 모든 지파 가운데에서”입니다. 이 표현은 단순한 대화가 아니라 지파들 사이에 널리 퍼진 논란을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어의 “손에서”는 여기서 상대의 권세나 지배에서 벗어남을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 표현은 “압살롬 앞에서”에 가까우나, 여기서는 그로 인한 도피를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  english_pob_choice: were disputing
  chosen_korean: 다투며
  alternatives_korean:
  - 논의하며
  - 의논하며
  - 논쟁하며
  lexicon: HALOT
  rationale: 공적이고 넓게 퍼진 갈등의 뉘앙스를 살리되, 한국어에서 자연스럽고 현대적인 표현으로 ‘다투며’를 택했습니다.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: throughout all the tribes of Israel
  chosen_korean: 이스라엘의 모든 지파 가운데에서
  alternatives_korean:
  - 이스라엘의 모든 지파 안에서
  - 이스라엘의 모든 지파 사이에서
  lexicon: HALOT
  rationale: 문맥상 분쟁이 이스라엘 전체의 지파들 사이에 널리 퍼졌음을 드러내기 위해 범위 표현으로 옮겼습니다.
- source_word: מִכַּף אֹיְבֵינוּ / מִכַּף פְּלִשְׁתִּים
  english_pob_choice: from the hand of our enemies / from the hand of the Philistines
  chosen_korean: 원수들의 손에서 / 블레셋 사람들의 손에서
  alternatives_korean:
  - 원수들의 권세에서 / 블레셋 사람들의 권세에서
  - 원수의 손아귀에서 / 블레셋 사람들의 손아귀에서
  lexicon: HALOT
  rationale: ‘손’이라는 히브리어 관용구를 그대로 살려 권세 아래 있음을 드러냈고, 블레셋은 집단명으로 자연스럽게 ‘블레셋 사람들’로 옮겼습니다.
- source_word: מֵעַל אַבְשָׁלוֹם
  english_pob_choice: because of Absalom
  chosen_korean: 압살롬 때문에
  alternatives_korean:
  - 압살롬으로 말미암아
  - 압살롬 때문에 이 땅을 떠나
  lexicon: HALOT
  rationale: ‘압살롬 때문에’는 도피의 원인을 현대 한국어로 가장 자연스럽게 전달하면서도, 원문의 원인적 관용 표현을 과도하게 해석하지 않습니다.
theological_decisions:
- issue: 왕의 과거 구원과 현재 도피 사이의 대비
  chosen_reading: 백성의 말은 다윗 왕이 과거에 구원자였던 사실과 현재 압살롬 때문에 도피하는 처지를 강하게 대비합니다.
  alternative_readings:
  - 단순한 정치적 상황 묘사로만 읽는 것
  - 압살롬의 정당성에 대한 판단을 암시하는 것
  rationale: 히브리어 본문은 백성의 인식 속 역설을 드러내므로, 대비를 분명히 살려 번역하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 서사 문맥에서의 왕권과 섭리 이해
