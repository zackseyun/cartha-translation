revisions:
- from: 그리고 온 백성은 이스라엘의 모든 지파 가운데에서 다투며 말했습니다. “왕께서 우리를 원수들의 손에서 구해 주셨고, 또 블레셋 사람들의 손에서 건져 주셨는데, 이제는 압살롬 때문에 이 땅에서 도망하셨습니다.”[a][b][c]
  to: 이스라엘의 모든 지파에서 온 백성이 서로 논쟁하며 이렇게 말했습니다. “왕께서 우리를 원수들의 손에서[a] 구해 주셨고, 또 블레셋 사람들의 손에서[a] 건져 주셨는데, 이제는 압살롬 때문에[b] 이 땅에서 도망하셨습니다.”
  rationale: 논쟁의 범위를 ‘이스라엘의 모든 지파에서’로 명료하게 하고, נָדוֹן의 공적 논쟁 의미를 자연스러운 현대 한국어로 옮겼습니다. 각주를 해당 관용 표현에 직접 연결했으며, 압살롬 관련 전치사구의 방향적·원인적 뉘앙스를 주석에서 보존했습니다. 의미나 신학적 해석은 추가하지 않았습니다.
