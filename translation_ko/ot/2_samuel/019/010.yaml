  - severity: medium
    issue: ‘다투며’와 문장 연결의 자연스러움
    rationale: ‘다투며 말했습니다’는 다소 부자연스럽고 물리적 다툼도 연상시킬 수 있습니다. נָדוֹן의 공적 논쟁·논의를 ‘서로 논쟁하며 이렇게 말했습니다’로 옮기는 것이 더 명료합니다.
