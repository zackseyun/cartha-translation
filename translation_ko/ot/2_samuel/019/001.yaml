base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
  footnotes:
  - marker: a
    text: Or, more formally, 'the upper room of the gate.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''Who will give...?'' expressing a wish; that is, ''If only'' or ''Would that.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 몹시 동요했습니다. 그는 성문 위층 방으로 올라가[a] 울었습니다. 그가 가면서 이렇게 말했습니다. “내 아들 압살롬아! 내 아들, 내 아들 압살롬아! 내가 너 대신 죽었더라면![b] 압살롬아, 내 아들, 내 아들아!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 “성문의 위층 방”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 직역하면 “누가 …하게 해 주겠느냐?”이며, 이루어지기를 바라는 소망을 나타냅니다. 곧 “오, 내가 너 대신 죽었더라면” 또는 “내가 너 대신 죽었더라면 좋았을 것을”이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  english_pob_choice: was deeply shaken
  chosen_korean: 몹시 흔들렸고
  alternatives_korean:
  - 크게 동요했고
  - 몹시 격동되었고
  - 떨렸고
  lexicon: HALOT
  rationale: רגז는 단순한 감정이 아니라 심한 내적 동요와 떨림을 아울러 가리킬 수 있어, 장례적 맥락에서 자연스러운 "몹시 흔들렸고"로 옮겼습니다.
- source_word: עֲלִיַּת הַשַּׁעַר
  english_pob_choice: the chamber over the gate
  chosen_korean: 성문 위 누각
  alternatives_korean:
  - 성문 위 방
  - 성문 위 다락방
  - 성문 위의 누각
  lexicon: HALOT
  rationale: עֲלִיָּה는 위층 공간을 뜻하고, הַשַּׁעַר와 결합하면 성문 구조물 위의 상부 공간이므로, 한국어로는 간결한 건축 용어인 "성문 위 누각"이 가장 자연스럽습니다.
- source_word: מִי יִתֵּן מוּתִי אֲנִי תַחְתֶּיךָ
  english_pob_choice: If only I had died instead of you
  chosen_korean: 내가 너를 대신해 죽었더라면 얼마나 좋았겠느냐
  alternatives_korean:
  - 내가 너 대신 죽었더라면
  - 내가 너보다 먼저 죽었더라면
  - 내가 너 대신 죽기를 바랐노라
  lexicon: HALOT
  rationale: 히브리어 관용구 "누가 주겠느냐"는 소망의 표현이므로, 그 기능을 살려 애도와 후회의 뉘앙스를 드러내는 조건문으로 옮겼습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 내 아들아
  - 내 자식아
  lexicon: HALOT
  rationale: 반복되는 בְּנִי는 애통의 핵심이므로 매번 동일하게 "내 아들"을 유지해 정서적 반복을 보존했습니다.
