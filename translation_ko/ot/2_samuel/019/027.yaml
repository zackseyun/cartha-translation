reference: 2 Samuel 19:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמַ֕ר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ עַבְדִּ֣/י רִמָּ֑/נִי כִּֽי אָמַ֨ר עַבְדְּ/ךָ֜ אֶחְבְּשָׁה לִּ/י֩ הַ/חֲמ֨וֹר וְ/אֶרְכַּ֤ב עָלֶ֨י/הָ֙ וְ/אֵלֵ֣ךְ אֶת הַ/מֶּ֔לֶךְ כִּ֥י פִסֵּ֖חַ עַבְדֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
  footnotes:
  - marker: a
    text: Or 'has deceived me' or 'has betrayed me.' The Hebrew verb can denote misleading or treacherous dealing; 'has slandered me' is chosen here because the context centers on false report to the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 내 주 왕께 당신의 종을 중상하였습니다. 당신의 종이 말하기를 ‘내가 나를 위해 나귀에 안장을 얹고, 그것을 타고 왕과 함께 가겠습니다’ 하였기 때문입니다. 그런데 당신의 종은 절뚝거립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רִמָּנִי
  english_pob_choice: has slandered me
  chosen_korean: 중상하였습니다
  alternatives_korean:
  - 속였습니다
  - 배신하였습니다
  lexicon: HALOT
  rationale: 문맥이 왕 앞에서의 허위 진술과 그로 인한 불이익을 가리키므로, 단순한 ‘속이다’보다 공개적 비방·왜곡을 드러내는 ‘중상하다’가 더 가깝습니다.
- source_word: עַבְדִּי / עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 시종
  lexicon: HALOT
  rationale: 왕에게 대한 겸손한 자기호칭을 살리면서도, 이 장면에서는 단순한 신분표지보다 예속적 자기비하가 분명하므로 ‘종’이 가장 자연스럽습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 나의 주 왕
  - 내 주님이신 왕
  lexicon: HALOT
  rationale: 히브리어의 예우 표현을 한국어 왕실 호칭으로 옮기되, ‘주님’은 종교적 뉘앙스가 강하므로 여기서는 ‘내 주 왕’이 더 정확합니다.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  english_pob_choice: I will saddle the donkey for myself
  chosen_korean: 내가 나를 위해 나귀에 안장을 얹고
  alternatives_korean:
  - 내가 나귀에 안장을 얹고
  - 내가 나귀를 준비하고
  lexicon: HALOT
  rationale: חבש는 나귀를 탈 수 있게 ‘안장을 얹다/준비하다’는 뜻이므로, 동작의 구체성을 살려 직역에 가깝게 옮겼습니다.
- source_word: וְאֶרְכַּב עָלֶיהָ
  english_pob_choice: so that I may ride on it
  chosen_korean: 그것을 타고
  alternatives_korean:
  - 그 위에 올라타고
  - 내가 그것을 타게 되어
  lexicon: HALOT
  rationale: 목적/의도의 연쇄를 한국어에서는 자연스럽게 이어 주는 표현이 필요해 ‘그것을 타고’로 간결하게 처리했습니다.
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  english_pob_choice: and go with the king
  chosen_korean: 왕과 함께 가겠습니다
  alternatives_korean:
  - 왕과 동행하겠습니다
  - 왕을 따라가겠습니다
  lexicon: HALOT
  rationale: אֶת이 단순 목적어가 아니라 동행을 나타내므로, ‘함께 가다’가 가장 정확합니다.
- source_word: פִסֵּחַ
  english_pob_choice: lame
  chosen_korean: 절뚝거립니다
  alternatives_korean:
  - 절름거립니다
  - 다리를 절고 있습니다
  lexicon: HALOT
  rationale: 끝의 이유절이 현재의 신체 상태를 설명하므로, 현대 한국어에서 가장 자연스러운 현재 서술형으로 옮겼습니다.
theological_decisions:
- issue: 예우 호칭의 한국어 재현
  chosen_reading: 왕에게는 ‘내 주 왕’으로, 자기 지칭은 ‘당신의 종’으로 유지했습니다.
  alternative_readings:
  - ‘주님이신 왕’
  - ‘나의 왕’
  rationale: 본문의 권력 관계와 겸손의 수위를 보존하기 위해, 종교적 호칭보다 궁정적 예우 표현을 우선했습니다.
  doctrine_reference: 서술적 번역의 사회적 화용 유지
