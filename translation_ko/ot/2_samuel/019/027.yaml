revisions:
- from: 그리고 그가 내 주 왕께 당신의 종을 중상하였습니다. 당신의 종이 말하기를 ‘내가 나를 위해 나귀에 안장을 얹고, 그것을 타고 왕과 함께 가겠습니다’ 하였기 때문입니다. 그런데 당신의 종은 절뚝거립니다.
  to: 그가 말하였습니다. “내 주 왕이시여, 제 종이 저를 속였습니다[a]. 왕의 종이 다리를 절기 때문에, ‘제가 나귀에 안장을 얹고 그것을 타고 왕과 함께 가겠습니다’라고 말하였기 때문입니다.”
  rationale: 히브리어의 직접 발화 구조, 화자와 왕의 관계를 드러내는 서로 다른 ‘종’ 표현, 그리고 רִמָּנִי의 직접 목적어를 복원했습니다. 영어 POB의 ‘has slandered your servant to my lord the king’은 문맥적 해석을 반영하지만 WLC의 현 구문과 일치하지 않으므로, 해당 가능성은 본문이 아니라 주석에 한정했습니다. 코호르타티브 연쇄는 한국어의 미래 의지 표현 ‘가겠습니다’로 자연스럽게 유지했습니다.
  reviewer_model: gpt-5.6-terra
