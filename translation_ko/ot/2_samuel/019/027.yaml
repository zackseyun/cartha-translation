  source_fidelity: 현 번역은 히브리어의 발화 도입부(וַיֹּאמַר, “그가 말하였다”)와 호칭(“내 주 왕이시여”)을 누락하였고, עַבְדִּי(“내 종”)를 ‘당신의 종’으로 바꾸었습니다. 또한 רִמָּנִי는 이 절의 직접 목적어가 ‘나’이므로 우선적으로 ‘저를 속였습니다’로 옮겨야 합니다. ‘왕께 당신의 종을 중상하였다’는 영어 POB 감사 기록의 문맥적 해석이나, 현 히브리어 본문의 문법적 표현을 그대로 반영하지 못합니다.
  naturalness: ‘내 주 왕께 당신의 종을’ 및 ‘내가 나를 위해’는 현대 표준 한국어에서 부자연스럽습니다. 직접 발화의 틀을 복원하고, 왕에게 하는 겸양 표현은 ‘왕의 종’, 자신의 수행원은 ‘제 종’으로 구별하면 자연스럽고 관계도 분명해집니다.
  terminology: 궁정적 호칭은 ‘내 주 왕이시여’로, 화자의 겸양적 자기 지칭 עַבְדְּךָ는 ‘왕의 종’으로 옮겼습니다. 피סח은 지속적 신체 상태를 가리키므로 ‘다리를 절다’가 ‘절뚝거리다’보다 적절합니다. רמה의 문맥상 ‘중상하다’라는 해석 가능성은 주석으로 보존하되, 본문은 직접 목적어를 갖는 기본 의미인 ‘속이다’를 채택합니다.
