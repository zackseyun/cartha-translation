  - 므비보셋
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사 מְפִיבֹשֶׁת을 현대 외래어 표기 관행에 맞춰 음역했습니다.
- source_word: אֶל הַמֶּלֶךְ
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 그 왕에게
  - 다윗 왕에게
  lexicon: HALOT
  rationale: 본문은 고유명사보다 관사 있는 직함을 사용하므로, 문맥의 왕을 자연스럽게 살려 ‘왕에게’로 옮겼습니다.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  english_pob_choice: Let him even take it all
  chosen_korean: 그에게 전부 다 가져가게 하십시오
  alternatives_korean:
  - 그가 그것을 다 가져가게 하십시오
  - 그에게라도 전부 다 가져가게 하십시오
  lexicon: HALOT
  rationale: 허용/양보의 뉘앙스를 살려 명령형 권유로 옮겼고, גַּם의 강조는 ‘전부 다’로 반영했습니다.
- source_word: אַחֲרֵי אֲשֶׁר בָּא
  english_pob_choice: since my lord the king has come
  chosen_korean: …왕께서 … 돌아오셨으니 말입니다
  alternatives_korean:
  - 왕께서 … 돌아오신 이후에
  - 왕께서 … 오셨으니
  lexicon: HALOT
  rationale: אַחֲרֵי אֲשֶׁר를 단순한 시간 부사절보다 이유를 내는 연결로 읽어, 자연스러운 한국어 인과 표현으로 처리했습니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: safely
  chosen_korean: 안전하게
  alternatives_korean:
  - 평안히
  - 평안 중에
  lexicon: HALOT
  rationale: '직역 ‘평안히/평안 중에’도 가능하지만, 돌아옴의 결과적 안전을 분명히 드러내는 ‘안전하게’를 본문에 두었습니다. '
theological_decisions:
- issue: 왕에 대한 정중한 호칭과 발화의 존칭 처리
  chosen_reading: 메시아적·신학적 고유어가 아니라 궁정 대화이므로, 인물 발화는 합쇼체를 유지하되 ‘내 주 왕’으로 공손한 호칭을 살렸습니다.
  alternative_readings:
  - ‘내 주님 왕’
  - 더 평이한 ‘우리 왕’
  rationale: 히브리어 אֲדֹנִי הַמֶּלֶךְ는 궁정적 예우를 담고 있어, 한국어에서도 위계와 존칭을 유지하는 것이 원문의 화용론에 부합합니다.
  doctrine_reference: 예우 표현 / 담화 화용
