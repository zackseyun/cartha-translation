id: 2SA.19.34
reference: 2 Samuel 19:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל בַּרְזִלָּ֑י אַתָּה֙ עֲבֹ֣ר אִתִּ֔/י וְ/כִלְכַּלְתִּ֥י אֹתְ/ךָ֛ עִמָּדִ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
  footnotes:
  - marker: a
    text: Or, “I will sustain you” or “I will support you.” The Hebrew verb carries the sense of providing for someone's needs.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 바르실래에게 말했습니다. 「당신은 나와 함께 건너오십시오. 그러면 내가 예루살렘에서 당신을 부양하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 필요를 채워 주겠습니다”, “당신을 지탱하겠습니다”. 히브리어 동사는 누군가의 필요를 공급하고 유지한다는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그러자 말했습니다
  lexicon: HALOT
  rationale: 서사 전개를 자연스럽게 살리되, 한국어에서는 앞선 사건을 잇는 과도한 접속사보다 담백한 서술형이 더 매끄럽습니다.
- source_word: עֲבֹר
  english_pob_choice: cross over
  chosen_korean: 건너오십시오
  alternatives_korean:
  - 건너십시오
  - 건너오세요
  lexicon: HALOT
  rationale: 여기서는 단순 이동보다 강이 있는 서사 맥락의 ‘건너다’가 더 구체적이며, 왕의 직접 요청이므로 공손한 명령형을 썼습니다.
- source_word: וְכִלְכַּלְתִּי
  english_pob_choice: I will provide for
  chosen_korean: 부양하겠습니다
  alternatives_korean:
  - 먹여 살리겠습니다
  - 돌보겠습니다
  - 공급하겠습니다
  lexicon: HALOT
  rationale: כלכל의 핵심 뜻인 지속적 생계 보장을 반영하려고 했습니다. ‘부양하다’는 현대 한국어에서 필요를 책임지고 공급한다는 의미를 비교적 정확히 담습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: HALOT
  rationale: 전치사 ב의 장소 의미를 한국어 조사로 자연스럽게 옮겼습니다. 왕의 거처가 아닌 활동·체류의 장소로 읽혀 ‘에서’가 적절합니다.
theological_decisions:
- issue: 왕의 약속 표현의 강도
  chosen_reading: 재정적·생활적 책임을 지는 실제적 보장으로 옮겼습니다.
  alternative_readings:
  - 위로 차원의 배려로 완화
  - 일반적 호의로 축소
  rationale: 본문의 כלכל은 단순 친절보다 필요를 채우고 유지하는 지원을 뜻하므로, 왕의 제안을 약하게 만들지 않도록 했습니다.
  doctrine_reference: 본문의 역사 서술과 어휘 의미에 관한 번역 판단
