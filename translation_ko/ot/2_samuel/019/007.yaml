  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: ko
  text: 왕께서는 왕을 미워하는 자들을 사랑하시고 왕을 사랑하는 자들을 미워하십니다. 오늘 왕께서는 장수들과 신하들이 왕께 아무것도 아니라는 것을[a] 드러내셨습니다. 오늘 저는, 아브살롬이 살아 있고 우리 모두가 오늘 죽어 있었다면[b], 그것이 왕께서 보시기에 옳았을 것임을 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, ‘왕께는 장수들과 신하들이 없습니다.’ 히브리어의 이 표현은 그들이 실제로 존재하지 않는다는 뜻이 아니라, 왕의 판단에서 아무것도 아닌 듯 여겨진다는 질책입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘아브살롬이 살아 있고 우리 모두가 오늘 죽어 있었다면 좋았을 것입니다.’ 요압의 말은 다윗이 실제로 그렇게 말했다는 보고가 아니라, 충성한 이들이 죽는 대가를 치르더라도 아브살롬이 살아 있기를 바랐을 것이라는 날카로운 반사실적 비난입니다.
    reason: alternative_reading
