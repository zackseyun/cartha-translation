  terminology: '''장수''는 שָׂרִים의 군사적 문맥에 적절합니다. עֲבָדִים는 여기서 왕을 섬기는 이들을 폭넓게 가리키므로 현대 한국어에서 지나치게 예속적 의미를 띠는 ''종들''보다 ''신하들''이 자연스럽습니다. ''왕께서 보시기에 옳았을 것''은 יָשָׁר בְּעֵינֶיךָ의 판단 관용구를 보존합니다.'
