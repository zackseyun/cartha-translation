base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
  footnotes:
  - marker: a
    text: Hebrew literally, “ten hands to me in the king,” an idiom meaning ten shares or portions—likely referring to the ten northern tribes’ claim over against Judah.
    reason: cultural_note
  - marker: b
    text: Or, “in David also I have a greater claim than you.” The Hebrew is elliptical but expresses comparative claim or stake.
    reason: lexical_alternative
  - marker: c
    text: Or, “Was not my proposal first to bring back my king?”
    reason: alternative_reading
  - marker: d
    text: Or, “the words of the men of Judah were stronger/fiercer than the words of the men of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 이스라엘 사람이 유다 사람에게 대답하여 말했습니다[a]. “나는 왕에 대한 열 몫의 권리가 있고, 다윗에 대해서도 내 몫은 너보다 더 큽니다[b]. 그런데 왜 나를 얕보았습니까? 내 말이 내 왕을 다시 모셔 오는 일에서 먼저였던 것이 아니었습니까[c]?” 그러나 유다 사람들의 말이 이스라엘 사람들의 말보다 더 거셌습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 대표 단수형 ‘이스라엘 사람/유다 사람’을 사용하지만, 대화의 화자는 각 진영을 대표하는 인물입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘다윗 안에서도 내가 너보다 더 …’라는 생략된 비교를 담고 있습니다. 문맥상 다윗에 대한 몫 또는 권리를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, “내 제안이 내 왕을 다시 모셔 오는 일에서 먼저였던 것이 아니었습니까?”
    reason: alternative_reading
  - marker: d
    text: 또는, “유다 사람들의 말이 이스라엘 사람들의 말보다 더 강했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  english_pob_choice: the man of Israel / the man of Judah
  chosen_korean: 이스라엘 사람 / 유다 사람
  alternatives_korean:
