source:
  edition: WLC
  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
  footnotes:
  - marker: a
    text: Hebrew literally, “ten hands to me in the king,” an idiom meaning ten shares or portions—likely referring to the ten northern tribes’ claim over against Judah.
    reason: cultural_note
  - marker: b
    text: Or, “in David also I have a greater claim than you.” The Hebrew is elliptical but expresses comparative claim or stake.
    reason: lexical_alternative
  - marker: c
    text: Or, “Was not my proposal first to bring back my king?”
    reason: alternative_reading
  - marker: d
    text: Or, “the words of the men of Judah were stronger/fiercer than the words of the men of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 이스라엘 사람이 유다 사람에게 대답하여 말했습니다[a]. “내게는 왕에게 열 몫이 있고, 다윗에게도 너보다 내가 더 몫이 있습니다[b]. 그런데 왜 나를 얕보았습니까? 내 말이 먼저 아니었습니까—내 왕을 다시 데려오는 일에[c]? 그러나 유다 사람의 말이 이스라엘 사람의 말보다 더 거셌습니다[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 대표 단수형 ‘이스라엘 사람/유다 사람’을 사용하지만, 대화의 화자는 각 진영을 대표하는 인물입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘다윗 안에서도 내가 너보다 더 …’라는 생략된 비교를 담고 있어, 문맥상 ‘몫’으로 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, “내 제안이 먼저였던 것 아니었습니까? 내 왕을 다시 데려오는 일에?”
    reason: alternative_reading
  - marker: d
    text: 또는, “유다 사람들의 말이 이스라엘 사람들의 말보다 더 강했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  english_pob_choice: the man of Israel / the man of Judah
  chosen_korean: 이스라엘 사람 / 유다 사람
  alternatives_korean:
  - 이스라엘의 한 사람 / 유다의 한 사람
  - 이스라엘 남자 / 유다 남자
  lexicon: HALOT
  rationale: 히브리어 단수형 אִישׁ을 대표 발화자로 살리되, 한국어에서는 자연스럽게 ‘사람’으로 옮겨 각 진영의 대표가 대답하는 장면을 드러냈습니다.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  english_pob_choice: I have ten shares in the king
  chosen_korean: 내게는 왕에게 열 몫이 있고
  alternatives_korean:
  - 내게는 왕에게 열 부분이 있고
  - 내게는 왕 안에서 열 손이 있고
  lexicon: HALOT
  rationale: 직역하면 ‘열 손’이지만, 관용적 의미는 몫/분깃이므로 ‘열 몫’으로 옮겨 이스라엘의 권리 주장과 경쟁 구도를 분명히 했습니다.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  english_pob_choice: and in David also I have more than you
  chosen_korean: 다윗에게도 너보다 내가 더 몫이 있습니다
  alternatives_korean:
  - 다윗에게도 너보다 내가 더 큰 몫이 있습니다
  - 다윗에게도 내가 너보다 더 큰 주장권이 있습니다
  lexicon: HALOT
  rationale: 문장이 생략적이어서 비교의 대상이 분명하지 않지만, 문맥상 다윗에 대한 몫/권리를 말하므로 ‘더 몫이 있습니다’로 자연스럽게 풀었습니다.
- source_word: הֱקִלֹּתַנִי
  english_pob_choice: did you treat me lightly
  chosen_korean: 나를 얕보았습니까
  alternatives_korean:
  - 나를 하찮게 여겼습니까
  - 나를 업신여겼습니까
  lexicon: HALOT
  rationale: קלל의 사역형은 ‘가볍게 여기다, 경시하다’의 뉘앙스를 가지므로, 관계를 과도하게 확대하지 않으면서도 모욕감을 드러내는 ‘얕보다’를 택했습니다.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  english_pob_choice: the word of the men of Judah was harsher than the word of the men of Israel
  chosen_korean: 유다 사람의 말이 이스라엘 사람의 말보다 더 거셌습니다
  alternatives_korean:
  - 유다 사람의 말이 이스라엘 사람의 말보다 더 강했습니다
  - 유다 사람의 말이 이스라엘 사람의 말보다 더 험했습니다
  lexicon: HALOT
  rationale: קשׁה는 단순한 세기보다 거칠고 강경한 말투를 가리킬 수 있어, 대화의 긴장감을 살리는 ‘거셌습니다’로 옮겼습니다.
