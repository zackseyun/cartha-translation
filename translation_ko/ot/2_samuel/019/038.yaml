base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
  footnotes:
  - marker: a
    text: Hebrew literally, 'with the grave of my father and my mother'; the sense is likely 'near/by the grave,' referring to burial in the family place.
    reason: lexical_alternative
  - marker: b
    text: Or 'what seems good to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: “부디 당신의 종이 돌아가게 해 주십시오. 그러면 내가 내 고향에서, 내 아버지와 내 어머니의 무덤 곁에서 죽겠습니다. 그런데 보십시오, 당신의 종 김함이 여기 있습니다. 그가 내 주 왕과 함께 건너가게 하시고, 당신의 눈에 좋은 대로 그를 위해 해 주십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew literally, 'with the grave of my father and my mother'; the sense is likely 'near/by the grave,' referring to burial in the family place.
    reason: lexical_alternative
  - marker: b
    text: Or 'what seems good to you.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא / עַבְדְּךָ
  english_pob_choice: Please let your servant return
  chosen_korean: 부디 당신의 종이 돌아가게 해 주십시오
  alternatives_korean:
  - 당신의 종이 돌아가게 하십시오
  - 부디 당신의 종이 돌아가기를 바랍니다
  lexicon: HALOT
  rationale: נָא의 공손한 요청을 ‘부디’와 ‘-게 해 주십시오’로 옮기고, עַבְדְּךָ는 왕에게 하는 겸양적 자칭으로 자연스러운 ‘당신의 종’이 적절합니다.
- source_word: בְּעִירִי עִם קֶבֶר אָבִי וְאִמִּי
  english_pob_choice: in my own city, by the grave of my father and my mother
  chosen_korean: 내 고향에서, 내 아버지와 내 어머니의 무덤 곁에서
  alternatives_korean:
  - 내 도시에서, 내 아버지와 내 어머니의 무덤 곁에서
  - 내 성읍에서, 내 아버지와 내 어머니의 무덤 가까이에서
  lexicon: HALOT
  rationale: ‘내 고향’은 העיר의 소속감과 귀환의 정서를 살리면서 현대 한국어에서 자연스럽고, עִם은 장지 문맥에서 ‘곁에서’가 ‘with’의 직역보다 의미를 더 정확히 드러냅니다.
- source_word: כִמְהָם / יַעֲבֹר עִם אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: Kimham; let him cross over with my lord the king
  chosen_korean: 김함이 여기 있습니다. 그가 내 주 왕과 함께 건너가게 하시고
  alternatives_korean:
  - 김함이 있습니다. 그가 내 주 왕과 함께 건너가게 하시고
  - 김함이 여기 있으니, 그가 내 주 왕과 함께 넘어가게 하시고
  lexicon: HALOT
  rationale: כִמְהָם은 통용 음역인 ‘김함’을 따랐고, ‘건너가다’는 요단을 건너는 서사의 반복 모티프를 살립니다. אֲדֹנִי הַמֶּלֶךְ는 공손한 호칭으로 ‘내 주 왕’이 적절합니다.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  english_pob_choice: what is good in your eyes
  chosen_korean: 당신의 눈에 좋은 대로
  alternatives_korean:
  - 당신 보시기에 좋은 대로
  - 당신의 눈에 좋게 여겨지는 대로
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 평탄화하지 않고 ‘눈에 좋은’ 구조를 살려, 왕의 재량과 판단을 원문처럼 드러냅니다.
