reference: 2 Samuel 19:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ לֹ֨א הָיָ֜ה כָּל בֵּ֣ית אָבִ֗/י כִּ֤י אִם אַנְשֵׁי מָ֨וֶת֙ לַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/תָּ֨שֶׁת֙ אֶֽת עַבְדְּ/ךָ֔ בְּ/אֹכְלֵ֖י שֻׁלְחָנֶ֑/ךָ וּ/מַה יֶּשׁ לִ֥/י עוֹד֙ צְדָקָ֔ה וְ/לִ/זְעֹ֥ק ע֖וֹד אֶל הַ/מֶּֽלֶךְ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
  footnotes:
  - marker: a
    text: Or 'men of death,' that is, men liable to death or deserving execution.
    reason: lexical_alternative
  - marker: b
    text: '''Right'' translates Hebrew tsedaqah here in the sense of a just claim or entitlement, not primarily personal moral righteousness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제 아버지의 온 집안은 내 주 왕 앞에서 죽어 마땅한 사람들뿐이었는데[a], 왕께서는 이 종을 왕의 식탁에서 음식을 먹는 사람들 가운데 두셨습니다. 그러니 제가 더 왕께 부르짖을 무슨 권리가 있겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽어 마땅한 사람들’은 문자적으로는 ‘죽음의 사람들’에 가깝지만, 문맥상 사형에 해당하거나 죽음을 받아 마땅한 자들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘권리’는 여기서 צְדָקָה를 도덕적 ‘의’가 아니라 왕에게 주장할 수 있는 정당한 청구권이라는 뜻으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  english_pob_choice: For ... were nothing but
  chosen_korean: “...이었는데”와 뒤이은 반전으로 처리
  alternatives_korean:
  - '...일 뿐이었는데'
  - '...외에는 아무것도 아니었는데'
  lexicon: HALOT
  rationale: 히브리어의 강한 제한·대조 구문을 한국어에서도 앞절을 깔고 뒤절에서 반전을 주는 방식으로 살려, ‘모두 죽어 마땅한 사람들’이라는 요지를 자연스럽게 드러냈습니다.
- source_word: אַנְשֵׁי מָוֶת
  english_pob_choice: men deserving death
  chosen_korean: 죽어 마땅한 사람들
  alternatives_korean:
  - 사형당해 마땅한 사람들
  - 죽을 자들
  lexicon: HALOT
  rationale: 이 표현은 단순히 ‘죽을 사람들’이 아니라 법적·도덕적으로 죽음에 해당하는 사람들을 가리키므로, 의미를 분명히 하는 ‘죽어 마땅한 사람들’로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 이 종
  alternatives_korean:
  - 이 종을
  - 당신의 종
  lexicon: HALOT
  rationale: 왕 앞에서의 겸양적 자기지칭을 살리되, 현대 한국어에서 너무 경어체적으로 들리지 않도록 ‘이 종’으로 옮겼습니다.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  english_pob_choice: among those who eat at your table
  chosen_korean: 왕의 식탁에서 먹는 사람들 가운데
  alternatives_korean:
  - 왕의 상에서 먹는 사람들 가운데
  - 왕의 식탁을 함께 먹는 사람들 가운데
  lexicon: HALOT
  rationale: 왕의 식탁에 참여한다는 특권적 포함을 한국어에서도 ‘...먹는 사람들 가운데’로 살려 사회적 지위를 드러냈습니다.
- source_word: צְדָקָה
  english_pob_choice: right
  chosen_korean: 권리
  alternatives_korean:
  - 정당한 주장
  - 의로움
  - 자격
  lexicon: HALOT
  rationale: 이곳의 צְדָקָה는 추상적 ‘의’보다 왕에게 호소할 수 있는 정당한 청구권을 뜻하므로, POB의 ‘right’에 맞춰 ‘권리’로 옮겼습니다.
theological_decisions:
- issue: 왕 앞의 자기 비하와 은혜의 강조
  chosen_reading: 메비보셋의 발언은 자신의 공로가 아니라 왕의 호의로 식탁에 앉게 되었다는 점을 강조하는 고백으로 읽었습니다.
  alternative_readings:
  - 단순한 예의 표현으로만 읽기
  - 정치적 충성 선언으로만 읽기
  rationale: 문맥상 핵심은 ‘죽어 마땅함’과 ‘식탁에 앉힘’의 대비이며, 이후의 ‘권리 없음’은 왕의 은혜에 대한 응답으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 은혜와 겸손의 응답
- issue: לִזְעֹק אֶל הַמֶּלֶךְ의 화행
  chosen_reading: ‘부르짖다’는 법정적 호소와 절박한 탄원을 함께 살리는 표현으로 유지했습니다.
  alternative_readings:
  - 호소하다
  - 외치다
  rationale: 단순한 말하기가 아니라 왕에게 억울함을 호소하는 절박한 발화이므로, 히브리어 זעק의 강도를 보존하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 본문의 수사와 청원 행위
