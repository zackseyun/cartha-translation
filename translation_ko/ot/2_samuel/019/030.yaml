base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
  footnotes:
  - marker: a
    text: Or more literally, “I said.”
    reason: lexical_alternative
  - marker: b
    text: Or “the field.”
    reason: lexical_alternative
translation:
  language: ko
  text: '그때 왕이 그에게 말했습니다. “어찌하여 아직도 네 사정에 대해 말하느냐? 내가 말한다: 너와 시바가 그 땅을 나누어 가지라.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내가 말했다”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 밭을”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  english_pob_choice: Then the king said
  chosen_korean: 그때 왕이 말했습니다
  alternatives_korean:
  - 그리고 왕이 말했습니다
  - 그래서 왕이 말했습니다
  lexicon: BHS/WLC; narrative waw-consecutive
  rationale: 서술 진행을 자연스럽게 옮기되, 원문의 사건 전개와 왕의 발화를 분명히 드러내기 위해 ‘그때’와 평서형 발화를 사용했습니다.
- source_word: דְּבָרֶיךָ
  english_pob_choice: your affairs
  chosen_korean: 네 사정
  alternatives_korean:
  - 네 말
  - 네 일
  - 네 사건
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 ‘말’보다 분쟁·청원의 내용 전체를 가리키는 뜻이어서, 한국어로는 간결하게 ‘사정’이 가장 자연스럽습니다.
- source_word: אָמַרְתִּי
  english_pob_choice: I have decided
  chosen_korean: 내가 말한다
  alternatives_korean:
  - 내가 말했다
  - 내가 결정했다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘내가 말했다’이지만, 왕의 판결 선언으로 기능하므로 한국어에서는 단정적 선언으로 들리게 옮겼습니다. 더 직접적인 과거형은 각주로 남길 수 있습니다.
- source_word: תַּחְלְקוּ אֶת הַשָּׂדֶה
  english_pob_choice: you and Ziba shall divide the land
  chosen_korean: 너와 시바가 그 땅을 나누어 가지라
  alternatives_korean:
  - 너와 시바가 그 땅을 나누라
  - 너와 시바가 그 땅을 분배하라
  lexicon: HALOT
  rationale: 분쟁 재산에 대한 왕의 판결문이므로 명령형/판결형으로 옮겼고, ‘나누어 가지라’가 한국어 법정 발화처럼 자연스럽습니다. ‘땅’은 문맥상 소유지 전체를 가리킵니다.
theological_decisions:
- issue: 왕의 발화 형식과 판결적 어조
  chosen_reading: 왕의 질문과 판결을 현대 한국어 법정·재판 어조에 가깝게 유지했습니다.
  alternative_readings:
  - 단순 서술형으로 완화
  - 설명형으로 풀어쓰기
  rationale: 본문은 단순 대화가 아니라 분쟁에 대한 권위 있는 판결이므로, 의미를 약화시키지 않도록 단정적 어조를 유지했습니다.
  doctrine_reference: 본문 해석의 문맥적 판결 기능
