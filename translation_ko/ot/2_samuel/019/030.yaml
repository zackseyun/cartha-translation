  text: 그때 왕이 그에게 말했습니다. “왜 아직도 네 사정에 대하여 말하느냐? 내가 결정하였다[a]. 너와 시바는 그 땅을 나누어 가져라.[b]”
  philosophy: optimal-equivalence
  footnotes:
