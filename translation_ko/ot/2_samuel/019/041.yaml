  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
  footnotes:
  - marker: a
    text: Or 'brought the king across' / 'caused the king to cross' for 'escorted the king across.' The Hebrew verb can carry a causative sense with a direct object in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 왕은 길갈로 건너갔고, 김함도 그와 함께 건너갔습니다. 유다의 모든 백성이 왕을 건너가도록 인도했고[a], 이스라엘 백성의 절반도 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕을 건너가도록 인도했고’는 히브리어 동사 עבר가 목적어와 함께 쓰인 사역적 용법을 반영한 것입니다. 직역하면 ‘왕을 건너게 했다’이며, 문맥상 왕을 호송하여 건너도록 도왔다는 뜻입니다.
    reason: lexical_alternative
