theological_decisions:
- issue: 왕의 이동을 ‘가다/건너다’로 어떻게 표현할지
  chosen_reading: 지명과 사역적 동사를 살려, 왕이 길갈로 실제로 건너가는 장면과 백성이 그를 인도하는 장면을 함께 보이도록 했습니다.
  alternative_readings:
  - 왕이 길갈에 도착했습니다
  - 백성이 왕을 모셨습니다
  rationale: 이 절은 신학적 난점보다 서술적 정확성이 핵심이므로, 본문이 말하는 이동과 동행의 사실성을 가장 직접적으로 드러내는 쪽을 택했습니다.
