base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
  footnotes:
  - marker: a
    text: Or 'brought the king across' / 'caused the king to cross' for 'escorted the king across.' The Hebrew verb can carry a causative sense with a direct object in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 왕은 길갈로 건너갔고, 기르함도 그와 함께 건너갔습니다. 유다의 모든 백성이 왕을 건너가게 했고, 이스라엘 백성의 절반도 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘건너가게 했고’는 히브리어 동사 עבר의 목적어 동반 사역적 용법을 반영한 번역입니다. 직역하면 ‘왕을 건너게 했다’ 또는 ‘왕을 건너가게 했다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: crossed over
  chosen_korean: 건너갔습니다
  alternatives_korean:
  - 건너왔습니다
  - 지나갔습니다
  lexicon: HALOT
  rationale: עבר은 이 문맥에서 강을/경계를 건너는 움직임을 가리키므로, 자연스러운 현대 한국어인 ‘건너가다’로 옮겨 이동과 횡단의 뜻을 살렸습니다.
- source_word: הַגִּלְגָּלָה
  english_pob_choice: to Gilgal
  chosen_korean: 길갈로
  alternatives_korean:
  - 길갈 쪽으로
  - 길갈로 향해
  lexicon: HALOT
  rationale: 지명에 붙은 방향성 ה는 목적지를 나타내므로, 한국어 조사 ‘-로’로 간결하게 반영했습니다.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  english_pob_choice: escorted the king across
  chosen_korean: 왕을 건너가게 했고
  alternatives_korean:
  - 왕을 건너가도록 했고
  - 왕을 건너게 했고
  lexicon: HALOT
  rationale: 동사 עבר가 목적어와 함께 쓰여 ‘건너가게 하다/인도하다’의 사역적 의미를 띠므로, 문맥상 왕을 동반·인도한 뜻을 드러내는 표현을 택했습니다.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  english_pob_choice: half the people of Israel
  chosen_korean: 이스라엘 백성의 절반
  alternatives_korean:
  - 이스라엘 사람들의 절반
  - 이스라엘 백성 절반
  lexicon: HALOT
  rationale: 수량 표현을 그대로 살리면서 유다와의 대비가 분명하도록 ‘백성의 절반’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 이동을 ‘가다/건너다’로 어떻게 표현할지
  chosen_reading: 지명과 사역적 동사를 살려, 왕이 길갈로 실제로 건너가는 장면과 백성이 그를 인도하는 장면을 함께 보이도록 했습니다.
  alternative_readings:
  - 왕이 길갈에 도착했습니다
  - 백성이 왕을 모셨습니다
  rationale: 이 절은 신학적 난점보다 서술적 정확성이 핵심이므로, 본문이 말하는 이동과 동행의 사실성을 가장 직접적으로 드러내는 쪽을 택했습니다.
  doctrine_reference: 서술 본문의 역사적-문맥적 읽기
