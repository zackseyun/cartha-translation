id: 2SA.19.19
reference: 2 Samuel 19:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבְרָ֣ה הָ/עֲבָרָ֗ה לַֽ/עֲבִיר֙ אֶת בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/לַ/עֲשׂ֥וֹת הַ/טּ֖וֹב ב/עינ/ו וְ/שִׁמְעִ֣י בֶן גֵּרָ֗א נָפַל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ בְּ/עָבְר֖/וֹ בַּ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
  footnotes:
  - marker: a
    text: Or 'the ferry' or 'the crossing boat'; the Hebrew term refers to the means of crossing the river.
    reason: lexical_alternative
  - marker: b
    text: '''The king’s household'' refers to the people of the royal house or retinue, not the palace building.'
    reason: cultural_note
  - marker: c
    text: 'Hebrew: ''to do the good in his eyes,'' an idiom meaning to do what pleased him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나룻배가 건너가 왕의 집안을 건너편으로 옮기고 그의 눈에 좋은 일을 하도록 했으며, 스아의 아들 시므이가 요단을 건너는 왕 앞에 엎드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲבָרָה / וְעָבְרָה
  english_pob_choice: the ferryboat crossed over
  chosen_korean: 나룻배가 건너가
  alternatives_korean:
  - 나룻배가 건넜습니다
  - 도선선이 건넜습니다
  - 나룻배가 건너편으로 갔습니다
  lexicon: HALOT
  rationale: עֲבָרָה는 강을 건너는 수단을 가리키므로, 문맥상 구체적인 배의 이미지를 살려 ‘나룻배’로 옮겼습니다. 동작은 ‘건너가’로 자연스럽게 표현했습니다.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  english_pob_choice: to bring the king’s household across
  chosen_korean: 왕의 집안을 건너편으로 옮기고
  alternatives_korean:
  - 왕의 집을 건너게 하고
  - 왕의 왕실 식구들을 건너편으로 데려가고
  - 왕의 집안 사람들을 건너게 하고
  lexicon: HALOT
  rationale: בֵּית הַמֶּלֶךְ는 건물이 아니라 왕의 가족과 수행원을 뜻하므로 ‘집안’으로 풀었습니다. ‘옮기고’는 히필 부정사구의 사역적 뉘앙스를 살립니다.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  english_pob_choice: and to do what was good in his sight
  chosen_korean: 그의 눈에 좋은 일을 하도록 했으며
  alternatives_korean:
  - 그의 눈에 좋은 것을 하도록 했으며
  - 그가 좋게 여기는 일을 하도록 했으며
  - 그의 눈앞에서 좋은 일을 하도록 했으며
  lexicon: HALOT
  rationale: ‘그의 눈에 좋은’은 히브리어 관용구로, 한국어에서는 ‘좋게 여기는’으로도 풀 수 있지만 원문 이미지와 평가 의미를 함께 살리기 위해 ‘그의 눈에 좋은’을 유지했습니다.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: fell before the king
  chosen_korean: 왕 앞에 엎드렸습니다
  alternatives_korean:
  - 왕 앞에 쓰러졌습니다
  - 왕 앞에 엎드러졌습니다
  - 왕 앞에 무릎을 꿇었습니다
  lexicon: HALOT
  rationale: 이 표현은 단순한 낙상이 아니라 굴복과 간구의 자세를 뜻하므로, 그 함의를 직접 드러내는 ‘엎드렸습니다’를 택했습니다.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  english_pob_choice: as he was crossing the Jordan
  chosen_korean: 요단을 건너는
  alternatives_korean:
  - 요단을 건너고 있을 때
  - 요단을 건너던
  - 요단을 건너는 동안
  lexicon: HALOT
  rationale: 부정사구는 왕의 이동 시점을 가리키므로, ‘건너는’으로 현재 진행형처럼 자연스럽게 옮겼습니다.
