  text: וַ/יַּ֨עַן אֲבִישַׁ֤י בֶּן צְרוּיָה֙ וַ/יֹּ֔אמֶר הֲ/תַ֣חַת זֹ֔את לֹ֥א יוּמַ֖ת שִׁמְעִ֑י כִּ֥י קִלֵּ֖ל אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
  footnotes:
  - marker: a
    text: Or, “because of this” / “in return for this.” The Hebrew idiom asks whether this act should bring about Shimei’s execution.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 스루야의 아들 아비새가 대답하여 말했습니다[a]. “이 일로 시므이가 처형되어야 하지 않겠습니까? 그가 야훼의 기름부음 받은 이를 저주했기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일 때문에” / “이 일에 대한 보응으로.” 히브리어 관용구는 이 행동 때문에 시므이가 처형되어야 하는지를 묻습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하며
  alternatives_korean:
  - 대답하여
  - 응답하며
  lexicon: HALOT
  rationale: 서사에서 이어지는 발화 도입어로 자연스러운 ‘대답하다’를 택해, 바로 뒤의 “말했습니다”와 함께 응답 행위를 분명히 드러냈습니다.
- source_word: בֶּן צְרוּיָה
  english_pob_choice: Abishai son of Zeruiah
  chosen_korean: 스루야의 아들
  alternatives_korean:
  - 스루야의 아들인
  - 스루야의 아들 아비새
  lexicon: HALOT
  rationale: 히브리어의 친족 표지를 살리기 위해 ‘스루야의 아들’을 유지했고, 인명은 한국어 성경에서 널리 통용되는 ‘아비새’를 썼습니다.
- source_word: הֲתַחַת זֹאת
  english_pob_choice: for this
  chosen_korean: 이 일로
  alternatives_korean:
  - 이 때문에
  - 이 일에 대해
  lexicon: HALOT
  rationale: 이 표현은 단순한 시간/장소가 아니라 처벌의 원인이 되는 사건을 가리키므로, 한국어에서는 ‘이 일로’가 질문의 의미를 가장 자연스럽게 전달합니다.
- source_word: מְשִׁיחַ יְהוָה
  english_pob_choice: Yahweh’s anointed
  chosen_korean: 야훼의 메시아
  alternatives_korean:
  - 야훼의 기름부음 받은 자
  - 야훼의 기름부음 받은 이
  lexicon: HALOT
  rationale: מְשִׁיחַ의 기본 뜻인 ‘기름부음 받은 자’를 직역하면 길어지므로, POB의 ‘Messiah’ 선택을 따라 제목적 의미를 살린 ‘메시아’를 사용했습니다. יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름과 왕권 표지인 ‘메시아’의 결합
  chosen_reading: ‘야훼의 메시아’로 옮겨, 단순한 왕칭호가 아니라 야훼께 속한 기름부음 받은 왕이라는 신학적 무게를 드러냈습니다.
  alternative_readings:
  - ‘야훼의 기름부음 받은 자’
  - ‘주님의 기름부음 받은 자’
  rationale: 본문의 비난은 다윗 개인이 아니라 야훼가 세우신 왕권을 거슬렀다는 점에 초점이 있으므로, 그 신학적 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: '2 Samuel 19:22; DOCTRINE.md contested terms: יְהוָה YHWH'
