language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מְפִבֹ֨שֶׁת֙ בֶּן שָׁא֔וּל יָרַ֖ד לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וְ/לֹא עָשָׂ֨ה רַגְלָ֜י/ו וְ/לֹא עָשָׂ֣ה שְׂפָמ֗/וֹ וְ/אֶת בְּגָדָי/ו֙ לֹ֣א כִבֵּ֔ס לְ/מִן הַ/יּוֹם֙ לֶ֣כֶת הַ/מֶּ֔לֶךְ עַד הַ/יּ֖וֹם אֲשֶׁר בָּ֥א בְ/שָׁלֽוֹם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
  footnotes:
  - marker: a
    text: Hebrew literally, 'had not done his feet.' The expression refers to neglecting normal grooming or care for the feet.
    reason: lexical_alternative
  - marker: b
    text: Or 'nor cared for his mustache.' The Hebrew term refers specifically to the upper-lip facial hair area, not necessarily the whole beard.
    reason: lexical_alternative
  - marker: c
    text: Or 'until the day he came in peace' or 'arrived safely.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 아들 므비보셋이 왕을 만나러 내려왔습니다. 그는 왕이 떠난 날부터 왕이 평안히 왔던 날까지 발을 손질하지 않았고[a], 콧수염도 다듬지 않았으며[b], 옷도 빨지 않았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 발을 하지 않았다’입니다. 이 표현은 일상적인 발 단장이나 발 관리를 소홀히 했음을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘콧수염을 돌보지 않았다’. 히브리어는 윗입술의 털 부위를 가리키며, 반드시 수염 전체를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕이 무사히 왔던 날까지’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד / לִקְרַאת הַמֶּלֶךְ
  english_pob_choice: came down to meet the king
  chosen_korean: 왕을 만나러 내려왔습니다
  alternatives_korean:
  - 왕을 맞으러 내려왔습니다
  - 왕을 만나러 갔습니다
  lexicon: HALOT
  rationale: יָרַד의 기본 의미인 ‘내려오다’와 לקראת의 ‘마중 나가다/맞이하다’라는 방향성을 함께 살려, 이동의 하강과 만남의 목적을 자연스럽게 드러냈습니다.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  english_pob_choice: He had not cared for his feet
  chosen_korean: 발을 손질하지 않았습니다
  alternatives_korean:
  - 발을 돌보지 않았습니다
  - 발을 관리하지 않았습니다
  lexicon: HALOT
  rationale: 직역하면 ‘발을 하지 않았다’는 관용법이어서, POB의 해석을 따라 기본 몸단장이나 위생을 소홀히 했다는 뜻이 드러나도록 ‘손질하다’로 옮겼습니다.
- source_word: וְלֹא עָשָׂה שְׂפָמ֗וֹ
  english_pob_choice: nor trimmed his mustache
  chosen_korean: 콧수염도 다듬지 않았으며
  alternatives_korean:
  - 윗입술 털도 손질하지 않았으며
  - 수염도 깎지 않았으며
  lexicon: HALOT
  rationale: שָׂפָם은 ‘입술 위의 털’, 곧 콧수염 부위를 가리키므로, 의미를 구체적으로 살려 ‘콧수염’으로 번역했습니다.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  english_pob_choice: nor washed his clothes
  chosen_korean: 옷도 빨지 않았습니다
  alternatives_korean:
  - 옷도 세탁하지 않았습니다
  - 의복도 빨지 않았습니다
  lexicon: HALOT
  rationale: כִבֵּס는 의복을 씻다/빨다라는 뜻이므로, 현대 한국어에서 자연스럽고 직관적인 ‘빨다’를 사용했습니다.
- source_word: בְשָׁלוֹם
  english_pob_choice: came in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 안전하게
  - 평화롭게
  lexicon: HALOT
  rationale: בְשָׁלוֹם의 핵심은 단순한 무사귀환보다 샬롬의 상태이므로, POB의 해석을 따라 ‘평안히’로 옮겼습니다.
