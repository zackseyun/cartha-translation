  source_fidelity: 원문의 כִּי는 이유를, מְעַט은 동행하여 건너는 일이 짧거나 제한적임을 나타냅니다. '저는 왕과 함께 요단강을 조금만 건너가면 될 터인데'는 이러한 제한과 공손한 거절의 문맥을 자연스럽게 보존합니다. 후반부는 왕이 화자에게 보답하려는 것을 묻는 수사 의문문으로 정확히 옮겼습니다.
  naturalness: 초안의 '당신의 종'은 현대 한국어에서 왕에게 직접 말하는 장면에 다소 부자연스럽고, '이 보답으로 저에게 갚으셔야'는 한국어의 결합과 의미가 매끄럽지 않습니다. '왕의 종인 저는' 및 '이러한 보답을 제게 베푸시려 합니까'가 현대 합쇼체에서 자연스럽습니다.
  terminology: '''종''은 왕 앞에서 자신을 낮추는 עַבְדְּךָ의 관습적 표현을 유지합니다. גמל 계열은 본문에서 ''보답''으로 자연스럽게 옮기고, 동사·명사의 동근 반복은 각주에서 투명하게 설명합니다.'
