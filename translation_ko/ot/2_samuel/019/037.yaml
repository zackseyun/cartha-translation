base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
  footnotes:
  - marker: a
    text: Or 'reward me with this recompense.' The Hebrew uses a verb and cognate noun from the same root (גמל), emphasizing repayment or recompense.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 종인 저는 왕과 함께 요단강을 조금만 건너가면 될 터인데, 어찌하여 왕께서 이러한 보답을 제게 베푸시려 합니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보답하다’와 ‘보답’을 같은 어근(גמל)으로 함께 써서, 보답 또는 보상의 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט יַעֲבֹר
  english_pob_choice: would only cross the Jordan a little way
  chosen_korean: 요단강을 조금만 건너갈 뿐이었을 것입니다
  alternatives_korean:
  - 요단강을 조금만 건넜을 것입니다
  - 요단강을 조금만 건너가려 했을 것입니다
  lexicon: HALOT
  rationale: כִּי+מְעַט의 이유/제한 뜻을 살려, 왕과 동행하되 거리와 시간이 아주 짧았다는 점을 자연스러운 합쇼체로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 왕의 종
  lexicon: HALOT
  rationale: 여기서는 왕 앞의 겸손한 자기 호칭이지만, מקור의 기본 뜻을 유지해 '종'으로 옮겼습니다. 다만 직접 호칭 상황이므로 '당신의'를 붙였습니다.
- source_word: אֶת הַיַּרְדֵּן אֶת הַמֶּלֶךְ
  english_pob_choice: across the Jordan ... with the king
  chosen_korean: 왕과 함께 요단강을
  alternatives_korean:
  - 왕과 함께 요단을
  - 왕과 더불어 요단강을
  lexicon: HALOT
  rationale: אֶת가 여기서는 목적격이 아니라 동반을 나타내는 전치사로 보이므로, '왕과 함께'로 처리해 동행의 의미를 분명히 했습니다.
- source_word: יִגְמְלֵנִי הַגְּמוּלָה הַזֹּאת
  english_pob_choice: repay me with this reward
  chosen_korean: 이 보답으로 저에게 갚으셔야 합니까
  alternatives_korean:
  - 이 보답으로 저에게 보상하시려 합니까
  - 이 보답을 저에게 베푸셔야 합니까
  lexicon: HALOT
  rationale: 동사 גמל과 같은 어근의 명사 גְּמוּלָה가 함께 쓰여 '보답/갚음'의 중복 효과가 있습니다. 이를 살려 '보답'과 '갚으셔야 합니까'로 옮겼습니다.
theological_decisions:
- issue: 왕에게 드리는 공손한 거절의 수사
  chosen_reading: 직접적인 거절을 완곡한 반문으로 살리고, 왕에 대한 높임을 유지했습니다.
  alternative_readings:
  - 더 직설적인 거절문
  - 평서형으로 완화한 표현
  rationale: 원문은 보상을 사양하는 정중한 수사 의문문이므로, 현대 한국어에서도 반문 형식을 유지하는 것이 말투와 의미를 가장 잘 보존합니다.
  doctrine_reference: 문맥적 화행 보존
- issue: '''종''의 번역'
  chosen_reading: 전통적 교회문체의 '종'을 유지하되, '노예'로 과도하게 강화하지 않았습니다.
  alternative_readings:
  - 노예
  - 시종
  rationale: 본문은 왕 앞의 겸양 표현으로 기능하므로, 여기서 사회적 속박을 전면화하는 '노예'는 문맥을 넘습니다. 동시에 소스의 기본 어휘는 유지해야 하므로 '종'이 적절합니다.
  doctrine_reference: 어휘-문맥 일치
