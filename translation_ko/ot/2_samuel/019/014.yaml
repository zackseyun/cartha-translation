  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''all the days,'' an idiom for ongoing tenure or continual service.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아마사에게는 이렇게 말하십시오. “당신이 내 뼈요 내 살이 아니오? 하나님께서 내게 이같이 하시고 그보다 더 하시기를 바라노니, 당신이 요압 대신 내 앞에서 늘 군대의 지휘관이 되지 않으면 그러하리라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘모든 날들’은 여기서 지속적 직무나 계속되는 복무를 가리키는 관용구입니다.
    reason: lexical_alternative
