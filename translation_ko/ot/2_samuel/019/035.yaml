base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
  footnotes:
  - marker: a
    text: Or, more literally, 'How many are the days of the years of my life...?'
    reason: lexical_alternative
translation:
  language: ko
  text: 바르실래이가 왕에게 말했습니다. 「제가 살아갈 날이 얼마나 남았기에 왕과 함께 예루살렘으로 올라가겠습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서술문의 wayyiqtol אמר는 한국어에서 자연스러운 서술 동사인 ‘말했습니다’로 옮겨 담담한 대화체를 살렸습니다.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיַּי
  english_pob_choice: How many are the days of the years of my life
  chosen_korean: 내 삶의 햇수의 날들이 얼마나 남았기에
  alternatives_korean:
  - 내 생애의 날들이 얼마나 남았기에
  - 내 삶의 햇수가 얼마나 되기에
  lexicon: HALOT
  rationale: 겹겹이 쌓인 히브리어 표현을 너무 풀지 않고, ‘햇수의 날들’로 원문의 중첩된 어법을 살리되 한국어 문맥상 남은 생애의 짧음을 드러내도록 옮겼습니다.
- source_word: אֶעֱלֶה אֶת הַמֶּלֶךְ
  english_pob_choice: I should go up with the king
  chosen_korean: 내가 왕과 함께 … 올라가겠습니까
  alternatives_korean:
  - 내가 왕과 함께 … 가겠습니까
  - 내가 왕을 따라 올라가겠습니까
  lexicon: HALOT
  rationale: עלה의 ‘올라가다’는 예루살렘으로의 상승 이미지를 유지해야 하므로 직역적 동사를 살렸고, 문맥상 동반 의미를 자연스럽게 표현했습니다.
- source_word: אֶל הַמֶּלֶךְ
  english_pob_choice: to the king
  chosen_korean: 왕에게
  alternatives_korean:
  - 그 왕에게
  - 다윗 왕에게
  lexicon: HALOT
  rationale: 히브리어는 보통명사+정관사 형태이므로 ‘다윗’은 덧붙이지 않고, 직접 화법의 수신자를 자연스럽게 ‘왕에게’로 옮겼습니다.
theological_decisions:
- issue: 예루살렘으로 ‘올라가다’의 표현 유지
  chosen_reading: 예루살렘으로 올라가겠습니까
  alternative_readings:
  - 예루살렘으로 가겠습니까
  - 예루살렘에 가겠습니까
  rationale: 예루살렘을 향한 지리적 상승이라는 성서적 관용을 보존하는 것이 원문의 뉘앙스를 가장 잘 전달합니다.
  doctrine_reference: 성경 지리·서사 표현의 관용 유지
