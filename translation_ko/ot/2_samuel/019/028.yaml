  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: ko
  text: 그가 당신의 종을 내 주 왕에게 험담하였지만, 내 주 왕은 하나님의 사자와 같으십니다. 그러니 당신의 눈에 좋은 대로 행하십시오.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘하나님의 사자’는 히브리어 מַלְאַךְ הָאֱלֹהִים의 직역에 가깝습니다.
    reason: source_note
  - marker: b
    text: ‘눈에 좋은 대로’는 히브리어 관용구 ‘당신의 눈에 좋은 것’(בְּעֵינֶיךָ)을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּעַבְדְּךָ / your servant
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 하인
  - 당신의 노예
  lexicon: עֶבֶד
  rationale: 왕 앞에서 자신을 낮추는 말로서 ‘종’이 원문의 신분적 겸손을 가장 자연스럽게 살립니다. ‘노예’는 이 문맥의 직접적 뉘앙스보다 강하고, ‘하인’은 너무 완화됩니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ / my lord the king
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕
  alternatives_korean:
  - 나의 주 왕
  - 주군 왕
  lexicon: אֲדֹנִי
  rationale: 히브리어의 호칭 구조를 살려 ‘주’와 ‘왕’을 함께 유지했습니다. 한국어에서는 ‘내 주 왕’이 가장 압축적이고 격식 있는 대응입니다.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים / like the angel of God
  english_pob_choice: like the angel of God
  chosen_korean: 하나님의 사자와 같으십니다
  alternatives_korean:
  - 하나님의 천사와 같으십니다
  - 하나님의 사신과 같으십니다
  lexicon: מַלְאָךְ
  rationale: 문맥상 단순한 천사 표상보다 ‘하나님의 사자’가 왕의 분별과 권위 있는 대리성을 더 잘 드러냅니다. ‘사신’도 가능하지만, 본문에서 널리 이해되는 ‘사자’를 택했습니다.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ / do what is good in your eyes
  english_pob_choice: so do what is good in your eyes
  chosen_korean: 그러니 당신의 눈에 좋은 대로 행하십시오
  alternatives_korean:
  - 그러므로 당신의 보기에 좋은 일을 하십시오
  - 당신의 눈에 좋다고 여겨지는 대로 하십시오
  lexicon: הַטּוֹב בְּעֵינֶיךָ
  rationale: 히브리어 관용구 ‘눈에 좋다’를 직역에 가깝게 살리면서, 한국어 문장으로는 자연스럽게 ‘좋은 대로 행하십시오’로 옮겼습니다. POB의 ‘so do’도 결과/권고의 연결을 유지하는 데 반영했습니다.
theological_decisions:
- issue: 왕을 향한 극존칭과 자기비하의 화용
  chosen_reading: 화자는 자신을 ‘종’으로 낮추고 왕을 ‘내 주 왕’으로 높이는 식으로, 궁정 체면과 충성을 분명히 드러내는 말투를 유지했습니다.
  alternative_readings:
  - 보다 중립적인 현대어로 평준화
  - ‘왕이시여’ 중심의 일반적 존칭으로 정리
  rationale: 본문의 수사적 긴장—자기 비하와 왕의 위상 고양—이 메시지의 핵심이므로, 현대어로도 그 위계를 보존했습니다.
  doctrine_reference: 궁정 서사 맥락의 화용 보존
