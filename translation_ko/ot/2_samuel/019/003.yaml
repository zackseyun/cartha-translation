source:
  edition: WLC
  text: וַ/תְּהִ֨י הַ/תְּשֻׁעָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא לְ/אֵ֖בֶל לְ/כָל הָ/עָ֑ם כִּֽי שָׁמַ֣ע הָ/עָ֗ם בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר נֶעֱצַ֥ב הַ/מֶּ֖לֶךְ עַל בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
  footnotes:
  - marker: a
    text: Or 'the deliverance on that day became mourning.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the people heard, saying,' an idiom for hearing a report or hearing it said.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날의 승리는 온 백성에게 애도로 바뀌었습니다[a]. 이는 그날 백성이 “왕이 자기 아들을 두고 슬퍼하고 있다”는 말을 들었기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּשׁוּעָה는 여기서 전투에서 얻은 승리 또는 구출을 가리킬 수 있습니다. ‘구원’ 또는 ‘구출’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘백성이 듣고, 말하기를’에 가깝습니다. 곧 어떤 말이 전해지는 것을 들었다는 보고 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  english_pob_choice: the victory
  chosen_korean: 승리
  alternatives_korean:
  - 구원
  - 구출
  lexicon: HALOT
  rationale: 전투 직후의 문맥에서 תְּשׁוּעָה는 전쟁의 성패를 가리키므로, 한국어로는 신학적 뉘앙스의 ‘구원’보다 ‘승리’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: וַתְּהִי ... לְאֵבֶל
  english_pob_choice: was turned into mourning
  chosen_korean: 슬픔이 되었다
  alternatives_korean:
  - 애도가 되었다
  - 애통이 되었다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘애도로 되다’에 가깝지만, 한국어에서는 결과적 전환을 담는 ‘슬픔이 되었다’가 가장 간결하고 자연스럽습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 군중
  lexicon: HALOT
  rationale: 문맥상 다윗 편의 공동체 전체를 가리키므로, ‘백성’이 원문의 집합적 의미를 살리면서도 한국어로 자연스럽습니다.
- source_word: נֶעֱצַב ... עַל בְּנוֹ
  english_pob_choice: is grieved over his son
  chosen_korean: 자기 아들 때문에 괴로워하고 있다
  alternatives_korean:
  - 아들을 두고 슬퍼하고 있다
  - 아들 때문에 근심하고 있다
  lexicon: HALOT
  rationale: נֶעֱצַב은 단순한 감정 묘사보다 ‘괴로워하다/근심하다’에 가까워, 왕의 깊은 고통을 드러내는 표현을 택했습니다. ‘때문에’는 עַל의 원인·대상 관계를 한국어로 자연스럽게 옮긴 것입니다.
theological_decisions:
- issue: 보고된 말의 형식과 직접 인용 처리
  chosen_reading: “왕이 자기 아들 때문에 괴로워하고 있다”는 말을 들었습니다.
  alternative_readings:
  - “왕이 자기 아들을 두고 슬퍼한다”는 말을 들었습니다.
  - “왕이 아들 때문에 마음이 아프다”는 말을 들었습니다.
  rationale: 히브리어 שָׁמַע + לֵאמֹר는 단순 청취보다 ‘그런 말이 들렸다’는 보고 관용구이므로, 이를 드러내는 번역을 택했습니다.
  doctrine_reference: 서사 본문의 보고 관용구 보존
- issue: תְּשׁוּעָה의 의미 범위
  chosen_reading: 승리
  alternative_readings:
  - 구원
  - 구출
  rationale: 본문은 신학적 ‘구원’ 일반이 아니라 전투 결과의 역전을 말하므로, 역사적·서사적 의미를 우선한 ‘승리’가 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: 본문 장르와 문맥 우선 원칙
