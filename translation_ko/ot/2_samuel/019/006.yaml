id: 2SA.19.6
reference: 2 Samuel 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
  footnotes:
  - marker: a
    text: Or 'you have shamed all your servants' faces'; Hebrew preserves the concrete expression 'the faces of.'
    reason: lexical_alternative
  - marker: b
    text: '''The house'' likely refers to the royal residence or palace.'
    reason: cultural_note
  - marker: c
    text: Hebrew 'life' / 'lives' (nephesh), here meaning physical life rather than 'soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요압이 왕이 있는 집으로 들어가 말했습니다. "오늘 당신은 오늘 당신의 생명을 구해 낸 당신의 모든 종들의 얼굴을 부끄럽게 했습니다. 그리고 당신의 아들들과 딸들의 생명, 당신의 아내들과 첩들의 생명도 그러했습니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘당신의 모든 종들의 얼굴’입니다. 한국어에서는 이 관용구를 자연스럽게 풀어 ‘얼굴을’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘집’은 왕궁 또는 왕실 거처를 가리키는 말일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 네페쉬는 여기서 ‘영혼’이 아니라 실제 생명, 목숨을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל הַמֶּלֶךְ הַבָּיִת
  english_pob_choice: Then Joab came into the house to the king
  chosen_korean: 요압이 왕이 있는 집으로 들어가
  alternatives_korean:
  - 요압이 왕궁으로 들어가
  - 요압이 왕에게 있는 집으로 들어가
  lexicon: HALOT
  rationale: הַבָּיִת을 단순히 ‘집’으로 옮기되, 문맥상 왕이 있는 장소임을 풀어 자연스럽게 표현했습니다. ‘왕궁’은 의미는 분명하지만 원문의 ‘집’보다 해석이 강합니다.
- source_word: הֹבַשְׁתָּ
  english_pob_choice: you have put to shame
  chosen_korean: 부끄럽게 했습니다
  alternatives_korean:
  - 수치를 주었습니다
  - 창피를 주었습니다
  lexicon: HALOT
  rationale: 동사의 사역적 의미를 살리면서도 한국어에서 공적 수치를 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: פְּנֵי
  english_pob_choice: the faces of
  chosen_korean: 얼굴을
  alternatives_korean:
  - 얼굴들을
  - 면전(面前)을
  lexicon: HALOT
  rationale: POB의 ‘the faces of’에 맞춰 신체적·관계적 수치의 이미지를 살렸습니다. 한국어에서는 복수 표지를 억지로 드러내기보다 집합적으로 ‘얼굴을’이라고 하는 편이 자연스럽습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: life / lives
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 혼
  lexicon: HALOT
  rationale: 이 문맥의 נֶפֶשׁ는 영혼이 아니라 죽음에서 구해진 실제 생명을 가리키므로 ‘생명’이 가장 정확합니다. 반복되는 ‘생명’을 유지해 원문의 수사적 병렬을 반영했습니다.
- source_word: פִּלַגְשֶׁיךָ
  english_pob_choice: your concubines
  chosen_korean: 첩들
  alternatives_korean:
  - 후궁들
  - 첩
  lexicon: HALOT
  rationale: 고대 왕실의 사회적 범주를 드러내는 용어로, 표준 한국어 성경어법에 맞으면서도 원문의 낮은 지위 관계를 보존하는 ‘첩들’을 택했습니다.
theological_decisions:
- issue: 공적인 수치와 가족 보존의 긴장
  chosen_reading: 요압의 책망은 다윗이 자신을 구한 이들의 공적 수고를 모욕한 것으로 제시됩니다.
  alternative_readings:
  - 단순한 감정적 비난으로 약화하는 읽기
  - 가족의 안전만을 강조하는 읽기
  rationale: 본문은 왕의 체면이 아니라 ‘종들’이 생명을 구해 준 사실과 그 공적 수치가 충돌함을 드러냅니다. 그래서 ‘부끄럽게 했습니다’로 공적-관계적 책임을 유지했습니다.
  doctrine_reference: 서사 본문의 공적 윤리와 언약 공동체의 충성에 대한 서술
