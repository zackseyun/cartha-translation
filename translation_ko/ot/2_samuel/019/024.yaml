  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל שִׁמְעִ֖י לֹ֣א תָמ֑וּת וַ/יִּשָּׁ֥בַֽע ל֖/וֹ הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
  footnotes:
  - marker: a
    text: Or, more interpretively, “You shall not be put to death.” The Hebrew literally says, “You shall not die,” which may function here as a royal promise of pardon from execution.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 시므이에게 말했습니다. “당신은 죽지 않을 것입니다.” 왕이 그에게 맹세했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “당신은 죽지 않을 것입니다”라고 말하지만, 문맥상 왕이 처형을 면하게 해 주겠다는 사면 선언일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕이
  alternatives_korean:
  - 그 왕이
  - 임금이
  lexicon: HALOT
  rationale: 문맥상 특정 왕을 가리키므로 자연스러운 현대 한국어로 ‘왕’이라 옮겼습니다.
- source_word: שִׁמְעִי
  english_pob_choice: Shimei
  chosen_korean: 시므이
  alternatives_korean:
  - 쉬므이
  - 시메이
  lexicon: 표준 음역 관행
  rationale: 히브리어 איש명은 통용되는 성경 음역인 ‘시므이’를 따랐습니다.
- source_word: לֹא תָמוּת
  english_pob_choice: You shall not die
  chosen_korean: 당신은 죽지 않을 것입니다
  alternatives_korean:
  - 당신은 죽지 않을 것입니다
  - 당신은 죽임을 당하지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 문장을 살려 ‘죽지 않을 것입니다’로 옮기되, 왕의 사면 약속이라는 함의를 본문에 더하지 않았습니다.
- source_word: וַיִּשָּׁבַע ל֖וֹ
  english_pob_choice: And the king swore to him
  chosen_korean: 왕이 그에게 맹세했습니다
  alternatives_korean:
  - 왕이 그에게 맹세했습니다
  - 왕이 그에게 맹세를 했습니다
  lexicon: HALOT
  rationale: 동사의 맹세 행위를 간결하게 드러내는 현대적 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕의 선언과 맹세의 관계
  chosen_reading: 왕의 말은 단순한 감정적 위로가 아니라, 이어지는 맹세로 공적 효력을 가진 약속입니다.
  alternative_readings:
  - 단순한 개인적 약속
  - 형식적 축복
  rationale: 히브리어는 말한 뒤 곧바로 ‘맹세했다’고 덧붙여, 왕의 발언이 서원/보증의 성격을 갖는다는 점을 강조합니다.
  doctrine_reference: 서원과 맹세의 언어는 본문 서술의 법적·왕권적 성격을 반영합니다.
