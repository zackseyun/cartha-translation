base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
  footnotes:
  - marker: a
    text: Or, 'and he went back to his place.' The subject of 'returned' is most naturally Barzillai, though English readers may need the antecedent clarified from context.
    reason: alternative_reading
translation:
  language: ko
  text: 모든 백성이 요르단을 건넜고, 왕도 건넜습니다. 왕은 바르질래에게 입맞추고 그를 축복했습니다. 그리고 그는 자기가 있던 곳으로 돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서는 마지막 동사의 주어가 명시되지 않습니다. 문맥상 바르질래로 이해하는 것이 가장 자연스럽지만, 왕으로 읽을 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר ... אֶת הַיַּרְדֵּן
  english_pob_choice: crossed ... the Jordan
  chosen_korean: 요르단을 건넜고
  alternatives_korean:
  - 요르단을 건넜습니다
  - 요르단을 건너갔습니다
  lexicon: HALOT
  rationale: עבר은 강을 ‘건너다’라는 구체적 이동을 가리키므로, 자연스러운 현대 한국어로 ‘건너다’를 택했습니다.
- source_word: וַיִּשַּׁק
  english_pob_choice: kissed
  chosen_korean: 입맞추고
  alternatives_korean:
  - 키스하고
  - 입을 맞추고
  lexicon: HALOT
  rationale: נשק의 기본 의미를 직접 살려, 관계의 친밀함과 작별 제스처를 과도하게 풀이하지 않고 표현했습니다.
- source_word: וַיְבָרֲכֵהוּ
  english_pob_choice: blessed him
  chosen_korean: 그를 축복했으며
  alternatives_korean:
  - 그에게 복을 빌었으며
  - 그에게 축복했으며
  lexicon: HALOT
  rationale: ברך는 본문에 명시된 동사이므로, 작별 인사로 완화하지 않고 ‘축복하다’로 유지했습니다.
- source_word: לִמְקֹמוֹ
  english_pob_choice: to his own place
  chosen_korean: 자기 자리로
  alternatives_korean:
  - 자기 곳으로
  - 자기 처소로
  - 자기 장소로
  lexicon: HALOT
  rationale: מקום의 직역을 살리되, 한국어에서 어색한 ‘장소’보다 문맥상 더 자연스러운 ‘자리’로 옮겼습니다.
theological_decisions:
- issue: ‘그는 돌아갔다’의 주어 지시
  chosen_reading: 마지막 절의 ‘그’는 가장 가까운 선행사인 바르질래를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 주어를 왕으로 읽는 해석
  - 주어를 문맥상 모호하게 두는 해석
  rationale: 영어 POB의 주석처럼 히브리어 문맥상 가장 자연스러운 지시 대상은 바르질래이며, 이를 본문 안에서 한국어로도 모호하지 않게 유지했습니다.
  doctrine_reference: 문맥-지시대상 해석
