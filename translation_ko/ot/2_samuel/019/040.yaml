  terminology: ‘요르단’, ‘왕’, ‘바르질래’, ‘입맞추다’, ‘축복하다’는 적절합니다. ‘자기 자리’는 מקום의 문맥상 의미를 좁히거나 오해시킬 수 있어 ‘자기가 있던 곳’으로 고칩니다.
