  text: וּ/בַרְזִלַּי֙ הַ/גִּלְעָדִ֔י יָרַ֖ד מֵ/רֹגְלִ֑ים וַ/יַּעֲבֹ֤ר אֶת הַ/מֶּ֨לֶךְ֙ הַ/יַּרְדֵּ֔ן לְ/שַׁלְּח֖/וֹ אֶת ב/ירדן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
  footnotes:
  - marker: a
    text: Or 'came down from Rogelim and crossed with the king over the Jordan to escort him.' The Hebrew allows slightly different ways of expressing Barzillai's accompaniment of the king at the river.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 길르앗 사람 바르실래가 로겔림에서 내려와 왕과 함께 요단을 건너 그를 요단에서 배웅하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕과 함께 요단을 건너’는 אֶת의 동반 의미를 반영한 번역이며, 문맥상 ‘왕을 배웅하다’와 함께 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּלְעָדִי
  english_pob_choice: the Gileadite
  chosen_korean: 길르앗 사람
  alternatives_korean:
  - 길르앗 사람인
  - 길르앗 출신의 사람
  lexicon: HALOT
  rationale: 히브리어 gentilic 형용사는 출신 지역을 나타내므로, 자연스러운 한국어로는 ‘길르앗 사람’이 간결하고 정확합니다.
- source_word: יָרַד
  english_pob_choice: had come down
  chosen_korean: 내려와
  alternatives_korean:
  - 내려왔고
  - 내려온
  lexicon: HALOT
  rationale: 로겔림에서 요단 방면으로 이동하는 하향 운동을 살려 ‘내려와’로 옮겼습니다.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ
  english_pob_choice: he crossed with the king
  chosen_korean: 왕과 함께 요단을 건너
  alternatives_korean:
  - 왕과 함께 건너
  - 왕과 동행하여 건너
  lexicon: HALOT
  rationale: אֶת이 여기서는 목적어 표지라기보다 동반 의미로 쓰인 문맥이므로, ‘왕과 함께’로 관계를 드러내고 ‘요단을 건너’로 사건을 자연스럽게 표현했습니다.
- source_word: לְשַׁלְּחוֹ
  english_pob_choice: to send him off
  chosen_korean: 그를 … 배웅하였습니다
  alternatives_korean:
  - 그를 … 떠나보내려고 했습니다
  - 그를 … 전송하려고 했습니다
  lexicon: HALOT
  rationale: שלח의 기본 의미를 지나치게 직역하지 않고, 작별·동행의 문맥을 살려 ‘배웅하다’로 옮겼습니다.
theological_decisions:
- issue: 왕에 대한 경어 사용
  chosen_reading: 서술문에서는 ‘왕’으로 유지하고, 직접 화법이 아니므로 추가적 존칭 동사형은 쓰지 않았습니다.
  alternative_readings:
  - 왕님과 함께
  - 왕을 배웅하였습니다
  rationale: 히브리어 서사문은 인물 관계를 담담하게 기술하므로, 한국어에서도 과도한 존칭을 덧붙이지 않고 사실적 서술을 유지했습니다.
  doctrine_reference: 서사체 문체와 인물 호칭의 일관성
