base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
  footnotes:
  - marker: a
    text: Or “wrapped his face” or “veiled his face.” The Hebrew verb suggests covering the face in grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 얼굴을 가렸고[a] 왕은 큰 소리로 외쳤습니다. “내 아들 압살롬! 압살롬, 내 아들, 내 아들!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 얼굴을 슬픔 속에서 가리거나 덮는 동작을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט + אֶת פָּנָיו
  english_pob_choice: covered his face
  chosen_korean: 얼굴을 가렸고
  alternatives_korean:
  - 얼굴을 덮었고
  - 얼굴을 가리고
  lexicon: HALOT
  rationale: 맹목적으로 ‘덮다’로 고정하기보다, 슬픔 속에서 얼굴을 가리는 동작을 자연스럽게 드러내는 ‘가리다’가 가장 간결하고 문맥에 맞습니다.
- source_word: וַיִּזְעַק
  english_pob_choice: cried out
  chosen_korean: 큰 소리로 외쳤습니다
  alternatives_korean:
  - 외쳤습니다
  - 부르짖었습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 발화보다 강한 절규를 나타내므로, 슬픔의 격렬함을 살리는 ‘큰 소리로 외치다’가 적절합니다.
- source_word: קוֹל גָּדוֹל
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 크게
  lexicon: HALOT
  rationale: 히브리어 관용구의 의미를 살리되 한국어에서 자연스러운 부사형으로 옮겼습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 나의 아들
  - 내 자식
  lexicon: HALOT
  rationale: 아들의 관계를 직접적으로 드러내는 표현이 원문의 애통함과 반복을 가장 잘 전달합니다.
theological_decisions:
- issue: 반복되는 호칭을 얼마나 그대로 보존할지
  chosen_reading: “내 아들 압살롬! 압살롬, 내 아들, 내 아들!”로 반복을 그대로 살렸습니다.
  alternative_readings:
  - “내 아들 압살롬! 압살롬! 내 아들, 내 아들!”
  - 반복을 줄여 자연스럽게 다듬는 방식
  rationale: 히브리어는 이름과 호칭의 반복으로 애통을 극대화하므로, 한국어도 이를 축약하지 않고 보존해야 본문의 정서가 살아납니다.
  doctrine_reference: 본문 정서와 수사 보존 원칙
