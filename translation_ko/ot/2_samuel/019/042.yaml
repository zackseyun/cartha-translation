  naturalness: ‘보십시오’와 ‘빼돌려’를 사용하면 현대 표준어의 격식 있는 서술 및 직접 화법에 더 자연스럽습니다. ‘건너가게 했습니까?’는 요단을 ‘건너게 하다’라는 히브리어 사역형을 명료하게 반영합니다.
