  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֛ה כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בָּאִ֣ים אֶל הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֣וּ אֶל הַ/מֶּ֡לֶךְ מַדּוּעַ֩ גְּנָב֨וּ/ךָ אַחֵ֜י/נוּ אִ֣ישׁ יְהוּדָ֗ה וַ/יַּעֲבִ֨רוּ אֶת הַ/מֶּ֤לֶךְ וְ/אֶת בֵּית/וֹ֙ אֶת הַ/יַּרְדֵּ֔ן וְ/כָל אַנְשֵׁ֥י דָוִ֖ד עִמּֽ/וֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
  footnotes:
  - marker: a
    text: Or “taken you secretly” / “stolen you.” The Hebrew uses the ordinary verb for stealing as a metaphor for Judah’s acting without the participation of the other Israelites.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “all the men of Israel” and “the men of Judah,” using masculine collective language for the groups represented.
    reason: cultural_note
translation:
  language: ko
  text: 보라, 이스라엘의 모든 사람들이 왕에게 와서 왕에게 말하였습니다. 「우리 형제들, 곧 유다 사람들은 어찌하여 왕과 왕의 집안을 요단 강 건너로 몰래 데려가고, 다윗의 모든 사람들까지 그와 함께 데려갔습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이곳에서 ‘훔치다’의 일반 동사를 비유적으로 사용하여, 유다가 다른 이스라엘 사람들의 참여 없이 왕을 데려갔다는 불만을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 담화 표지로서 서술 흐름을 살리기 위해 감탄형 명령인 ‘보라’를 택했습니다.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  english_pob_choice: all the men of Israel
  chosen_korean: 이스라엘의 모든 사람들
  alternatives_korean:
  - 이스라엘의 모든 남자들
  - 온 이스라엘
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 자연스러운 한국어로 옮기되, 남성 집합 지칭의 뉘앙스는 문맥상 ‘사람들’로 보존했습니다.
- source_word: גְּנָבוּךָ
  english_pob_choice: stolen you away
  chosen_korean: 몰래 데려가고
  alternatives_korean:
  - 훔쳐 가고
  - 도둑질하듯 데려가고
  - 은밀히 데려가고
  lexicon: HALOT
  rationale: 직역하면 ‘훔치다’이지만, 이곳은 정치적 비난의 비유이므로 ‘몰래 데려가다’로 옮겨 비유성과 은밀성을 함께 살렸습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his household
  chosen_korean: 왕의 집안
  alternatives_korean:
  - 왕의 집안사람들
  - 왕의 가문
  lexicon: HALOT
  rationale: 건물이 아니라 왕의 동반자·식솔을 가리키므로 ‘집안’으로 자연스럽게 번역했습니다.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  english_pob_choice: and all David’s men with him
  chosen_korean: 다윗의 모든 사람들까지 그와 함께
  alternatives_korean:
  - 다윗의 모든 부하들까지 그와 함께
  - 다윗의 모든 사람들 또한 그와 함께
  lexicon: HALOT
  rationale: 마지막 עִמּוֹ의 반복을 살리면서도 한국어에서 부자연스러운 중복을 줄이기 위해 ‘그와 함께’로 정리했습니다.
theological_decisions:
- issue: 이스라엘과 유다의 대립을 드러내는 집합 표현
  chosen_reading: 민족 내부의 항의 발화로 읽히도록, 집합명사와 직접 화법의 긴장을 보존했습니다.
  alternative_readings:
  - 단순한 행정적 분쟁으로 완화
  - 부드러운 서술로 재구성
  rationale: 본문은 정치적 갈등이면서도 형제 호칭을 쓰는 내부 분쟁이므로, 그 긴장을 약화시키지 않는 표현을 유지했습니다.
  doctrine_reference: 서사 문맥과 화자 의도 보존 원칙
- issue: גְּנָב의 은유성
  chosen_reading: ‘몰래 데려가다’로 옮겨 실제 절도보다 ‘무단으로 빼돌림’의 비난을 드러냈습니다.
  alternative_readings:
  - ‘훔쳤다’로 직역
  - ‘은밀히 데려갔다’로 순화
  rationale: 히브리어의 직설적 ‘훔치다’ 비유를 너무 약화시키지 않으면서도 한국어 독자가 정치적 맥락을 이해하도록 했습니다.
  doctrine_reference: 문맥 기반 은유 유지 원칙
