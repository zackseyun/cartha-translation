base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
  footnotes:
  - marker: a
    text: Or “when all Israel’s proposal/message had reached the king at his house.” The Hebrew phrase 'the word of all Israel' is broad and may refer to the report, proposal, or appeal from the tribes to bring David back.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 왕이 제사장 사독과 아비아달에게 전갈을 보내어 말했습니다. “유다의 장로들에게 말하십시오. ‘왕을 그의 집으로 돌아오게 하는 일에 어찌하여 맨 나중이 되려 하십니까? 온 이스라엘의 말[a]이 이미 왕에게, 곧 그의 집에까지 이르렀는데 말입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘온 이스라엘의 말’은 넓은 표현으로, 이스라엘 지파들의 보고, 제안, 또는 다윗을 다시 데려오자는 호소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ דָּוִד
  english_pob_choice: King David
  chosen_korean: 다윗 왕
  alternatives_korean:
  - 왕 다윗
  - 다윗
  lexicon: HALOT
  rationale: 히브리어의 관용적인 왕호+인명 결합을 한국어 자연어로 옮기되, 왕의 지위를 분명히 드러내기 위해 ‘다윗 왕’으로 렌더링했습니다.
- source_word: שָׁלַח אֶל
  english_pob_choice: sent to
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 전하여
  lexicon: HALOT
  rationale: 직접 인용 앞에서 ‘to’의 대상이 제사장들에게 향한 파견임을 분명히 하되, 한국어에서는 ‘사람을 보내어’가 자연스럽고 문맥에 맞습니다.
- source_word: דַּבְּרוּ אֶל זִקְנֵי יְהוּדָה
  english_pob_choice: Speak to the elders of Judah
  chosen_korean: 유다의 장로들에게 말하십시오
  alternatives_korean:
  - 유다의 장로들에게 말하라
  - 유다 장로들에게 전하십시오
  lexicon: HALOT
  rationale: 명령형의 직접성을 살리면서도 현대 한국어 합쇼체에 맞게 ‘말하십시오’로 옮겼습니다.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים לְהָשִׁיב
  english_pob_choice: Why should you be the last ... to bring back
  chosen_korean: 어찌하여 맨 나중이 되려 하십니까
  alternatives_korean:
  - 어찌하여 가장 늦으려 하십니까
  - 왜 맨 뒤가 되려 하십니까
  lexicon: HALOT
  rationale: אַחֲרֹנִים의 순서상 지연을 한국어 관용으로 풀어 ‘맨 나중이 되다’로 옮겨 수사적 책망의 뉘앙스를 살렸습니다.
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  english_pob_choice: the word of all Israel
  chosen_korean: 온 이스라엘의 말
  alternatives_korean:
  - 온 이스라엘의 제안
  - 온 이스라엘의 소식
  lexicon: HALOT
  rationale: דָּבָר의 의미 범위를 좁히지 않기 위해 ‘말’로 두어, 회중의 제의/메시지/보고라는 여지를 보존했습니다.
theological_decisions:
- issue: ‘the word of all Israel’의 의미 범위
  chosen_reading: 특정한 한 가지로 고정하지 않고 ‘온 이스라엘의 말’로 두어, 공동체의 요청·제안·보고를 모두 열어 둡니다.
  alternative_readings:
  - ‘온 이스라엘의 제안’
  - ‘온 이스라엘의 소식’
  rationale: 히브리어 דָּבָר는 문맥상 넓은 의미를 가지며, 본문은 다윗에게 전달된 집단적 요청의 성격을 복합적으로 보여 줍니다.
  doctrine_reference: 원문 어휘의 의미 범위 보존
- issue: 수신자들에게 대한 명령문 등록
  chosen_reading: 사독과 아비아달에게 전달되는 왕의 지시를 현대 합쇼체로 옮겼습니다.
  alternative_readings:
  - 평서형 서술
  - 더 직설적인 명령체
  rationale: 서술은 역사 내러티브이지만 직접 발화는 명령문이므로, 한국어 독자는 구두 지시의 긴박함을 느끼되 과도하게 고어화되지 않도록 했습니다.
  doctrine_reference: 서사체와 직접화법의 등록 일치
