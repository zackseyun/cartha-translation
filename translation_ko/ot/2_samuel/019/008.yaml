  - marker: a
    text: 'Hebrew: ''speak to the heart of your servants,'' an idiom meaning to speak kindly, reassuringly, or persuasively.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 일어나 나가서 당신의 종들의 마음을 다독이십시오. 나는 야훼의 이름으로 맹세합니다. 당신이 나가지 않으면, 오늘 밤 당신과 함께 머무는 사람이 한 사람도 없을 것이며, 이 일은 지금까지 당신에게 닥친 모든 재난보다 당신에게 더 나쁠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 “당신의 종들의 마음에 말하다”이며, 뜻은 위로하거나 안심시키거나 설득하는 것입니다.
    reason: lexical_alternative
