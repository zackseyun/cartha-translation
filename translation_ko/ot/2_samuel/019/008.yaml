  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
  footnotes:
  - marker: a
    text: 'Hebrew: ''speak to the heart of your servants,'' an idiom meaning to speak kindly, reassuringly, or persuasively.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 일어나 나가셔서 왕의 신하들에게 마음을 다독이는 말씀을 하십시오. 야훼를 두고 맹세합니다. 왕께서 나가지 않으시면 오늘 밤에는 한 사람도 왕과 함께 머물지 않을 것이며, 그 일은 왕께서 젊은 시절부터 지금까지 겪으신 모든 재난보다 왕께 더 큰 재앙이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 직역하면 “왕의 신하들의 마음에 말하다”이며, 위로하고 안심시키며 설득력 있게 말한다는 뜻입니다.
    reason: lexical_alternative
