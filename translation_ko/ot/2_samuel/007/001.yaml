base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: Now when the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
  footnotes:
  - marker: a
    text: Or 'in his palace.' Hebrew 'in his house'; 'house' is retained here, also anticipating the wordplay later in the chapter.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왕이 그의 집에 거주하고 있을 때, 야훼께서 그의 사방의 모든 원수에게서 그에게 안식을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 집’입니다. 여기서는 ‘집’을 유지해, 이어지는 문맥의 ‘집’ 말놀이를 미리 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: Now when
  chosen_korean: 이제 …할 때
  alternatives_korean:
  - 그리고 …할 때
  - 그때 …할 때
  lexicon: HALOT
  rationale: 서사 전환 공식의 기능을 살려 현대 한국어에서 자연스러운 시간 절로 옮겼습니다.
- source_word: יָשַׁב
  english_pob_choice: was living
  chosen_korean: 거주하고 있을 때
  alternatives_korean:
  - 살고 있을 때
  - 머물고 있을 때
  - 앉아 있을 때
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘앉다’가 아니라 정착 거주를 뜻하므로, 왕의 현재 상태를 드러내는 표현으로 옮겼습니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: in his house
  chosen_korean: 그의 집에
  alternatives_korean:
  - 그의 궁전에
  - 그의 거처에
  lexicon: HALOT
  rationale: 히브리어의 ‘집’을 그대로 살려 뒤의 ‘집’ 어휘와 이어지는 문맥적 말놀이를 보존했습니다.
- source_word: הֵנִיחַ לוֹ מִסָּבִיב מִכָּל אֹיְבָיו
  english_pob_choice: had given him rest on every side from all his enemies
  chosen_korean: 그의 사방의 모든 원수에게서 그에게 안식을 주셨습니다
  alternatives_korean:
  - 그를 사방의 모든 원수에게서 쉬게 하셨습니다
  - 그의 모든 원수로부터 그에게 평안을 주셨습니다
  lexicon: HALOT
  rationale: 하나님이 원수들로부터 평정을 ‘주시는’ causative 의미를 살려 ‘안식을 주셨습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 직접 나타난 신명사 טetragrammaton을 프로젝트 기본값에 따라 ‘야훼’로 옮겨 원문 식별성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: בַּיִת의 의미층
  chosen_reading: 집
  alternative_readings:
  - 궁전
  - 거처
  rationale: 왕궁 맥락이지만 히브리어 표면형 ‘집’을 유지해 뒤의 ‘집’ 주제어와의 수사적 연결을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
