  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: Now when the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
  footnotes:
  - marker: a
    text: Or 'in his palace.' Hebrew 'in his house'; 'house' is retained here, also anticipating the wordplay later in the chapter.
