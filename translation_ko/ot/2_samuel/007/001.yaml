  source_fidelity: 수정이 필요합니다. וַיְהִי כִּי는 별도의 ‘이제’를 요구하지 않는 서사적 시간 도입이며, 최신 영어 감사 기록도 선행 ‘Now’를 제거했습니다. 또한 הֵנִיחַ לוֹ는 ‘그에게 안식을 주셨다’ 또는 ‘그를 쉬게 하셨다’라는 사역적 의미를 보존해야 합니다.
  naturalness: 초안의 ‘그의 사방의 모든 원수에게서 그에게’는 소유·여격의 중복으로 현대 한국어에서 부자연스럽습니다. ‘사방의 모든 원수에게서 그에게 안식을 주셨을 때’로 정리하면 원문의 의미와 절의 미완결 연결을 자연스럽게 유지합니다.
  terminology: ‘야훼’, ‘안식’, ‘집’은 적절합니다. 왕의 거처를 ‘집’으로 유지하여 본장 후반의 בַּיִת 어휘 반복을 보존합니다.
