source:
  edition: WLC
  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
  footnotes:
  - marker: a
    text: Or 'were their God.' The Hebrew can be rendered statively, but 'became their God' better reflects the covenant-establishing sense in this context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서는 자신의 백성 이스라엘을 자신을 위한 백성으로 영원히 세우셨으며, 야훼께서는 그들의 하나님이 되셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 하나님이셨습니다.’ 히브리어 동사는 상태를 나타내는 뜻으로도 옮길 수 있으나, 여기서는 언약 관계의 성립이라는 문맥을 따라 ‘되셨습니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 신성 4문자 YHWH를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכ֣וֹנֵֽן
  english_pob_choice: established
  chosen_korean: 세우셨으며
  alternatives_korean:
  - 확립하셨으며
  - 견고하게 하셨으며
  lexicon: HALOT
  rationale: כּוּן의 ‘견고하게 하다/세우다’ 의미를 살리면서, 언약적 관계를 자연스럽게 드러내는 동사로 ‘세우셨다’를 선택했습니다.
- source_word: לְךָ / עַמְּךָ / לְךָ לְעָם
  english_pob_choice: for yourself / your people / to be your people
  chosen_korean: 당신의 백성 이스라엘을 당신의 백성으로
  alternatives_korean:
  - 이스라엘을 당신을 위한 백성으로
  - 이스라엘을 당신의 백성으로 삼아
  lexicon: HALOT
  rationale: 반복된 לְךָ와 לְעָם이 소유와 언약적 귀속을 강조하므로, 이를 ‘당신의 백성’으로 옮겨 관계의 방향을 분명히 했습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: עוֹלָם의 지속성과 언약의 영속성을 현대 한국어로 자연스럽게 전달하는 기본 표현으로 ‘영원히’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 영어 초안의 대체 표기 ‘Yahweh’는 본문에서 호칭형으로 직접 부르는 말투와 충돌할 수 있어, 한국어 문맥에서는 직접 호칭 ‘주님’으로 처리했습니다.
theological_decisions:
- issue: הָיִיתָ לָהֶם לֵאלֹהִים의 관계성 표현
  chosen_reading: 주님께서는 그들의 하나님이 되셨습니다
  alternative_readings:
  - 주님께서는 그들의 하나님이셨습니다
  - 주님께서는 그들에게 하나님이 되셨습니다
  rationale: 히브리어 היה + ל는 단순 정체 진술보다 언약적 관계의 성립을 나타내므로, ‘되셨습니다’로 옮겨 관계 형성을 보존했습니다.
  doctrine_reference: 언약 공식(창 17:7, 출 6:7의 समान 구조)
