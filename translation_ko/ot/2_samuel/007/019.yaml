- from: 이것도 주님이 보시기에는 너무 작은 일이었습니다. 주님, 야훼여, 주의 종의 집에 대해서도 먼 훗날까지 말씀하셨으니, 이것이 사람의 율법입니다. 주님, 야훼여.[a][b][c]
