id: 2SA.7.19
reference: 2 Samuel 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקְטַן֩ ע֨וֹד זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֣/י יְהוִ֔ה וַ/תְּדַבֵּ֛ר גַּ֥ם אֶל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵֽ/רָח֑וֹק וְ/זֹ֛את תּוֹרַ֥ת הָ/אָדָ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
  footnotes:
  - marker: a
    text: Or 'for the distant future.' The phrase refers to what lies far ahead in time.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house,' which can mean household or dynasty.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew of the final clause is difficult. It may also mean 'this is the charter for humanity' or 'this is the law/custom of man.'
    reason: alternative_reading
translation:
  language: ko
  text: 이것도 주님이 보시기에는 너무 작은 일이었습니다. 주님, 야훼여, 주의 종의 집에 대해서도 먼 훗날까지 말씀하셨으니, 이것이 사람의 율법입니다. 주님, 야훼여.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼 훗날까지’. 이 표현은 시간적으로 아주 먼 미래를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘집’. 가문이나 왕조를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절의 히브리어는 매우 어렵습니다. ‘이것이 인류의 헌장입니다’ 또는 ‘이것이 사람의 법/관습입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן
  english_pob_choice: was too small
  chosen_korean: 너무 작은 일이었습니다
  alternatives_korean:
  - 작은 일이었습니다
  - 보시기에는 작았습니다
  lexicon: HALOT
  rationale: 작다의 상태를 살리되, 문맥상 ‘충분하지 않다/하찮다’는 평가를 한국어로 자연스럽게 드러내기 위해 ‘너무 작은 일’로 옮겼습니다.
- source_word: בְּעֵינֶיךָ
  english_pob_choice: in your eyes
  chosen_korean: 주님이 보시기에는
  alternatives_korean:
  - 주님의 눈에는
  - 주님 앞에서는
  lexicon: HALOT
  rationale: 히브리어의 평가 관용구를 직역에 가깝게 살리면서도 한국어로 자연스러운 ‘보시기에는’으로 옮겼습니다.
- source_word: לְמֵרָחוֹק
  english_pob_choice: for a long time to come
  chosen_korean: 먼 훗날까지
  alternatives_korean:
  - 아주 먼 미래까지
  - 오래도록
  lexicon: HALOT
  rationale: ‘먼 곳/멀리’의 시간적 관용법을 살려, 앞으로의 긴 시간대를 가리키는 의미를 간결하게 표현했습니다.
- source_word: תּוֹרַת הָאָדָם
  english_pob_choice: the law of man
  chosen_korean: 사람의 율법
  alternatives_korean:
  - 사람의 규례
  - 인간의 법
  - 사람에 대한 율법
  lexicon: HALOT
  rationale: תּוֹרָה의 핵심을 여기서는 ‘율법’으로 유지하되, אָדָם을 ‘사람’으로 두어 난해한 표현의 긴장을 보존했습니다.
theological_decisions:
- issue: וְזֹאת תּוֹרַת הָאָדָם의 난해한 결말
  chosen_reading: 이것이 사람의 율법입니다
  alternative_readings:
  - 이것이 인류의 헌장입니다
  - 이것이 사람의 관습입니다
  - 이것이 사람을 위한 율법입니다
  rationale: 본문의 모호성을 해소하지 않고, 원문의 단어 구성에 가장 가깝게 유지했습니다. 다만 한국어 독자를 위해 너무 추상적이지 않도록 ‘사람의 율법’으로 옮겼습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it); Contested terms table for אָדָם
