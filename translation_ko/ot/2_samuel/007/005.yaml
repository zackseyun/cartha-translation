source:
  edition: WLC
  text: לֵ֤ךְ וְ/אָֽמַרְתָּ֙ אֶל עַבְדִּ֣/י אֶל דָּוִ֔ד כֹּ֖ה אָמַ֣ר יְהוָ֑ה הַ/אַתָּ֛ה תִּבְנֶה לִּ֥/י בַ֖יִת לְ/שִׁבְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
  footnotes:
  - marker: a
    text: Or, “Are you the one who would build me a house to dwell in?” The Hebrew question is emphatic and rhetorical.
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 내 종 다윗에게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 네가 내가 거할 집을 지으려 하느냐?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 나를 위해 집을 지으려 하느냐?’ 히브리어 질문은 강한 강조를 띤 수사적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 신하
  - 나의 종
  lexicon: HALOT
  rationale: 다윗을 향한 왕적·언약적 호칭으로서의 עבד는 한국어에서도 ‘종’이 자연스럽고, POB의 ‘my servant’ 의미를 직접 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사는 제목이 아니라 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨야 합니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하시기를 이렇게 하십니다
  - 이와 같이 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식은 한국어에서도 공적이고 엄숙한 현재형으로 살리되, 문어체의 직설적 화법을 유지했습니다.
- source_word: בַּיִת
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 집
  - 성전
  lexicon: HALOT
  rationale: 이 문맥의 בַּיִת은 야훼를 위한 거처이지만, 주변의 ‘집’/‘가문’ 말놀이를 살리기 위해 ‘성전’보다 ‘집’을 우선했습니다.
- source_word: לְשִׁבְתִּי
  english_pob_choice: to dwell in
  chosen_korean: 내가 그 안에 거하려고
  alternatives_korean:
  - 내가 거하려고
  - 내가 거주하려고
  lexicon: HALOT
  rationale: 목적을 나타내는 לשׁבתּי는 ‘거하다’로 살리고, 한국어에서는 자연스러운 목적 구문으로 풀어 의미를 분명히 했습니다.
theological_decisions:
- issue: 하나님의 이름을 본문에서 어떻게 표시할지
  chosen_reading: 본문에 ‘야훼’를 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 신명사 יְהוָה를 직접 사용하므로, 이를 존칭 대체어로 바꾸지 않고 고유명사로 보존하는 것이 source-direct 원칙에 맞습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 히브리어 수사문을 한국어에서 어떻게 처리할지
  chosen_reading: ‘네가 내를 위해 집을 지으려고 하느냐?’로 수사적 질문을 살렸습니다.
  alternative_readings:
  - 내를 위해 집을 지을 수 있느냐?
  - 네가 내를 위해 집을 지을 것인가?
  rationale: 본문은 단순 질문이 아니라 다윗에게 던지는 반어적·수사적 질문이므로, 의문형을 유지해 하나님의 의도를 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
