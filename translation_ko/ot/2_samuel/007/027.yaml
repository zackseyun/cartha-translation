source:
  edition: WLC
  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
  footnotes:
  - marker: a
    text: Literally, 'have uncovered the ear of your servant,' a Hebrew idiom meaning 'have revealed this to your servant.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will build a house for you.' The word 'house' also carries covenantal overtones of dynasty in this context.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'your servant has found his heart,' that is, has found the courage or resolve.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님이시여, 주께서 주의 종에게 알려 주시고[a] ‘내가 너를 위해 집을 세우겠다’[b] 하고 말씀하셨으므로, 주의 종이 이 기도를 주께 드릴 마음을 품게 되었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주의 종의 귀를 드러내셨다’입니다. 이는 어떤 일을 알려 주거나 계시한다는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 이 문맥에서 건물을 뜻할 수도 있고, 다윗의 왕조를 가리키는 함의도 지닙니다.
    reason: theological_note
  - marker: c
    text: 직역하면 ‘그의 마음을 찾았다’입니다. 여기서는 기도할 결심이나 용기를 얻게 되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: O Yahweh of hosts
  chosen_korean: 만군의 야훼이시여
  alternatives_korean:
  - 만군의 여호와이시여
  - 만군의 주님이시여
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת는 하나님의 군대적·우주적 주권을 살려 만군으로 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 하인
  lexicon: HALOT
  rationale: 여기서는 왕의 겸손한 기도문 맥락이므로 bonded status를 부각하는 노예보다 표준적인 종이 자연스럽고, 하나님께 드리는 관계를 잘 드러냅니다.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  english_pob_choice: have revealed this to your servant
  chosen_korean: 당신의 종에게 말씀하여
  alternatives_korean:
  - 당신의 종의 귀를 열어
  - 당신의 종에게 드러내어
  lexicon: HALOT
  rationale: 직역하면 ‘종의 귀를 드러내다’라는 관용구이지만, 한국어 본문에서는 그 의미를 살려 하나님이 말씀으로 계시하셨다는 뜻을 자연스럽게 표현했습니다.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  english_pob_choice: I will build you a house
  chosen_korean: 내가 너에게 집을 세우겠다
  alternatives_korean:
  - 내가 너를 위하여 집을 짓겠다
  - 내가 너에게 성전을 세우겠다
  lexicon: HALOT
  rationale: house의 이중의미를 유지하기 위해 집을 택했고, 문맥상 다윗 언약의 왕조적 울림을 해치지 않도록 좁혀 번역하지 않았습니다.
- source_word: מָצָא ... אֶת לִבּוֹ
  english_pob_choice: has found it in his heart
  chosen_korean: 마음을 얻었습니다
  alternatives_korean:
  - 용기를 얻었습니다
  - 결심하게 되었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 내적 결단과 용기이며, 한국어로는 ‘마음을 얻다’보다 ‘드릴 마음을 얻다’가 더 자연스러워 문맥을 살렸습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼를 본문에 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 언약명 YHWH를 분명히 드러내기 위해 음역을 유지했습니다.
  doctrine_reference: Translation philosophy / divine-name policy
- issue: ‘집’의 신학적 이중성
  chosen_reading: ‘집’을 그대로 유지하여 물리적 건물과 왕조의 함의를 함께 남겼습니다.
  alternative_readings:
  - 성전
  - 왕조
  rationale: 본문이 일부러 열어 둔 의미층을 한국어에서도 좁히지 않고 보존하는 것이 다윗 언약 문맥에 더 충실합니다.
  doctrine_reference: Translation philosophy §3
