id: 2SA.7.10
reference: 2 Samuel 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
  footnotes:
  - marker: a
    text: 'Or ''evildoers'' or ''wicked men.'' Hebrew: ''sons of wickedness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성 이스라엘을 위하여 한 곳을 정하고 그들을 심어, 그들이 자기 자리에서 살며 다시는 흔들리지 않을 것입니다. 그리고 악행의 아들들[a]이 전처럼 그들을 더 이상 괴롭히지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악을 행하는 자들’ 또는 ‘악한 사람들’. 직역하면 ‘불의의 아들들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  english_pob_choice: I will appoint a place
  chosen_korean: 한 곳을 정하고
  alternatives_korean:
  - 자리를 마련하고
  - 거처를 세우고
  - 장소를 지정하고
  lexicon: HALOT
  rationale: שׂוּם + מָקוֹם은 단순한 ‘놓다’보다 ‘자리를 정하다/지정하다’의 의미가 자연스럽습니다. ‘한 곳을 정하고’가 하나님의 주권적 배정을 드러내면서도 한국어 문맥에 자연스럽습니다.
- source_word: וּנְטַעְתִּיו
  english_pob_choice: and plant them
  chosen_korean: 그들을 심어
  alternatives_korean:
  - 그들을 세워
  - 그들을 심으시어
  - 그들을 정착시키고
  lexicon: HALOT
  rationale: נטע의 비유는 농경적 이미지가 핵심이므로 ‘정착시키다’로만 풀기보다 ‘심다’를 살리는 편이 원문 감각을 더 잘 보존합니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in their own place
  chosen_korean: 자기 자리에서
  alternatives_korean:
  - 제자리에
  - 자기 땅에서
  - 자기 처소에서
  lexicon: HALOT
  rationale: 이 표현은 단순한 공간 아래가 아니라 ‘배정된 자리/안전한 거처’의 관용적 뜻이어서, ‘자기 자리에서’가 가장 무리 없이 그 뜻을 전달합니다.
- source_word: בְנֵי עַוְלָה
  english_pob_choice: sons of wickedness
  chosen_korean: 악행의 아들들
  alternatives_korean:
  - 악한 자들
  - 불의의 아들들
  - 악인들
  lexicon: HALOT
  rationale: 직역형 관용구를 살려 원문의 남성적·관용적 표현을 보존했습니다. ‘악인들’은 의미는 쉽지만 히브리어 표현의 날카로움이 약해집니다.
- source_word: לְעַנּוֹתֹו
  english_pob_choice: afflict them
  chosen_korean: 괴롭히지 못할 것입니다
  alternatives_korean:
  - 압제하지 못할 것입니다
  - 학대하지 못할 것입니다
  - 고통 주지 못할 것입니다
  lexicon: HALOT
  rationale: ענה의 폭넓은 의미 가운데, 여기서는 적대적 압박과 괴롭힘의 뜻이 중심이므로 ‘괴롭히다’가 자연스럽고 문맥상 적절합니다.
theological_decisions:
- issue: 이스라엘을 가리키는 집합적 단수의 처리
  chosen_reading: 복수 대명사/복수 동사를 자연스럽게 사용하되, 집합적 의미는 유지했습니다.
  alternative_readings:
  - 전 과정을 단수로 인격화하여 번역함
  - ‘그’를 일관되게 사용함
  rationale: 히브리어는 민족 전체를 단수처럼 다루지만, 한국어에서는 복수 표현이 의미를 더 분명하게 전달합니다. 이는 신학적 변경이 아니라 문법적 대응입니다.
  doctrine_reference: Translation philosophy §5-6
