  - 주
  rationale: 본문은 Tetragrammaton을 직접 사용하므로, 본 프로젝트의 기준에 따라 신적 고유명사를 제목어 ‘주’로 바꾸지 않고 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
