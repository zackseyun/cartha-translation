  source_fidelity: 히브리어는 ‘그 밤에’라는 시간 표현 뒤에, 야훼의 말씀이 나단에게 임하여 다음 절의 발화를 도입하는 예언 공식(‘말하여/이르시기를’)을 사용합니다. 초안은 ‘말씀이 … 말씀하셨습니다’라고 하여 ‘말씀’이 발화의 주체가 되는 어색함이 있고, 다음 절로 이어지는 발화 도입도 충분히 드러나지 않습니다.
