lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  english_pob_choice: But that night
  chosen_korean: 그날 밤에
  alternatives_korean:
  - 그 밤에
  - 그날 밤
  lexicon: HALOT
  rationale: 히브리어의 시간 표현은 사건 전개를 이어 주는 서두이므로, 한국어에서는 자연스러운 서술형인 ‘그날 밤에’로 옮겨 시간의 특정성을 살렸습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  lexicon: HALOT
  rationale: 예언적 계시 공식인 ‘여호와의 말씀’을 source-direct하게 반영하되, POB의 이름 원칙에 따라 ‘야훼의 말씀’으로 옮겼습니다.
- source_word: אֶל נָתָן
  english_pob_choice: to Nathan
  chosen_korean: 나단에게
  alternatives_korean:
  - 나단을 향해
  - 나단에게로
  lexicon: HALOT
  rationale: 계시의 수신 대상을 나타내는 전치사 אֶל은 한국어에서 가장 자연스러운 여격 ‘-에게’로 처리했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 ‘말하여 이르다’ 공식은 한국어에서 반복을 줄이면서도 신적 발화의 시작을 드러내는 ‘말씀하셨습니다’로 자연스럽게 전달할 수 있습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
