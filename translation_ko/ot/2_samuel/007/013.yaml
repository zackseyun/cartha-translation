id: 2SA.7.13
reference: 2 Samuel 7:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
  footnotes:
  - marker: a
    text: Or 'a temple for my name.' The Hebrew reads 'a house for my name,' preserving the chapter's wordplay between a temple and a dynasty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내 이름을 위하여 집을 지을 것이며, 나는 그의 나라의 왕좌를 영원히 굳게 세울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 이름을 위한 성전’. 히브리어 본문은 ‘내 이름을 위한 집’이라고 하며, 이 장에서 성전과 왕조를 가리키는 ‘집’의 말놀이를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  english_pob_choice: a house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 집
  lexicon: HALOT
  rationale: 히브리어 기본어휘의 직역성을 살리면서, 이 문맥의 성전/왕조 말놀이를 한국어에서도 보존하기 위해 ‘집’을 택했습니다.
- source_word: לִשְׁמִי
  english_pob_choice: for my name
  chosen_korean: 내 이름을 위한
  alternatives_korean:
  - 내 이름을 위해
  - 내 이름을 위하여
  - 내 이름을 위한
  lexicon: HALOT
  rationale: ‘이름’을 목적어로 둔 ל 구문을 과도하게 해설하지 않고, 하나님 이름에 속한/관련된 목적을 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: וְכֹנַנְתִּי
  english_pob_choice: and I will establish
  chosen_korean: 나는 … 굳게 세울 것입니다
  alternatives_korean:
  - 나는 … 세울 것입니다
  - 나는 … 확립할 것입니다
  - 나는 … 굳게 세울 것입니다
  lexicon: HALOT
  rationale: 왕좌를 ‘establish’하는 왕권 문맥을 살리기 위해 단순한 ‘세우다’보다 ‘굳게 세우다’를 사용해 안정성과 확정성을 드러냈습니다.
- source_word: כִּסֵּא מַמְלַכְתּוֹ
  english_pob_choice: the throne of his kingdom
  chosen_korean: 그의 왕국의 왕좌
  alternatives_korean:
  - 그의 나라의 왕좌
  - 그의 왕권의 왕좌
  - 그의 왕국의 왕좌
  lexicon: HALOT
  rationale: כִּסֵּא는 왕좌로 직역하고, מַמְלָכָה는 ‘왕국’으로 옮겨 왕좌와 왕권 영역의 결합을 분명하게 했습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원까지
  - 영구히
  - 영원히
  lexicon: HALOT
  rationale: 언약적 지속을 약화시키지 않도록 한국어의 가장 직접적이고 강한 상응어인 ‘영원히’를 사용했습니다.
theological_decisions:
- issue: בַּיִת의 의미를 ‘성전’으로 좁힐지, ‘집’으로 유지할지
  chosen_reading: ‘집’으로 유지했습니다.
  alternative_readings:
  - 성전
  - 집
  rationale: 본문은 실제 성전만이 아니라 다윗 언약의 ‘집’(가문/왕조)과 성전의 이중 의미를 지니므로, 해석을 좁히지 않고 원문 말놀이를 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, original-language primacy; §3, preserve theological tension.
- issue: עַד עוֹלָם의 시간 강도
  chosen_reading: ‘영원히’로 강하게 옮겼습니다.
  alternative_readings:
  - 오랫동안
  - 장구히
  - 영원히
  rationale: 다윗 언약의 약속 강도를 약화시키지 않기 위해, 단순한 장기 지속이 아니라 영속성을 나타내는 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §3; covenant promise continuity.
