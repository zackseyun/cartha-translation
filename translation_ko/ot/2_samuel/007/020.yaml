    rationale: 원문의 ‘주 아도나이 야훼여’는 직접 호칭입니다. 이를 문두에 두고 ‘주님께서는 주님의 종을’이라고 하면 호칭과 소유 관계가 명료하고 자연스럽습니다.
  - severity: low
