  text: וּ/מַה יּוֹסִ֥יף דָּוִ֛ד ע֖וֹד לְ/דַבֵּ֣ר אֵלֶ֑י/ךָ וְ/אַתָּ֛ה יָדַ֥עְתָּ אֶֽת עַבְדְּ/ךָ֖ אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/020.yaml
  text: And what more can David say to you? You know your servant[a], Lord GOD.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord YHWH'' (אֲדֹנָי יְהוִה); rendered ''Lord GOD'' in English to avoid ''Lord LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 다윗이 주님께 더 무슨 말씀을 드릴 수 있겠습니까? 주님은 주의 종을 아십니다, 주 야훼여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘주 야훼’(אֲדֹנָי יְהוִה)라고 되어 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וּמַה יּוֹסִיף ... לְדַבֵּר
  english_pob_choice: And what more can David say to you?
  chosen_korean: 그런데 다윗이 주님께 더 무슨 말씀을 드릴 수 있겠습니까?
  alternatives_korean:
  - 그리고 다윗이 주님께 무엇을 더 말할 수 있겠습니까?
  - 그런데 다윗이 주님께 더 무엇을 덧붙여 말할 수 있겠습니까?
  lexicon: HALOT
  rationale: יסף + לְדַבֵּר의 관용적 의미를 한국어에서 자연스러운 반문으로 옮기되, ‘더’로 עוֹד의 강조를 살렸습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 종된 자
  - 주의 노예
  lexicon: HALOT
  rationale: 왕 앞이 아니라 하나님께 드리는 겸손한 자기 지칭이므로, 본문 기능에 맞는 ‘종’으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼여
  alternatives_korean:
  - 주 하나님이여
  - 주 여호와여
  lexicon: HALOT
  rationale: 아도나이와 YHWH의 결합을 한국어에서 중복 없이 드러내기 위해 ‘주’와 고유명 ‘야훼’를 함께 쓰고, 직접 호칭을 살리기 위해 호격 ‘-여’를 붙였습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 언약적 신명은 ‘야훼’로 옮겨 본문의 고유한 신적 호칭을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 하나님께 드리는 직접 호칭의 문체
  chosen_reading: 주 야훼여
  alternative_readings:
  - 주 야훼
  - 야훼여
  rationale: 문맥이 다윗의 기도이므로, 한국어 기도체의 직접 호칭을 반영해 호격을 사용했습니다.
  doctrine_reference: 'Korean target style: direct address to God uses honorific verb endings and prayer formulas'
