id: 2SA.7.22
reference: 2 Samuel 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord YHWH.'' English versions commonly render this compound title as ''Lord GOD'' to reflect the divine name without saying ''Lord LORD.'''
    reason: cultural_note
  - marker: b
    text: Or 'and there is no god except you' / 'apart from you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼여, 주님은 위대하십니다. 우리가 귀로 들은 모든 것에 비추어 볼 때, 주님과 같은 분은 없고 주님 외에는 하나님이 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘주님 외에 신은 없습니다’ / ‘주님 외에는 하나님이 없습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 따라서
  lexicon: HALOT
  rationale: 앞선 기도와 하나님의 행위를 근거로 하는 결론을 자연스럽게 연결하는 표지로, 현대 한국어에서는 ‘그러므로’가 가장 간결하고 문맥에 맞습니다.
- source_word: גָּדַ֖לְתָּ
  english_pob_choice: you are great
  chosen_korean: 주님은 위대하십니다
  alternatives_korean:
  - 주님은 크십니다
  - 주님은 위대해지셨습니다
  lexicon: HALOT
  rationale: 완료형이지만 문맥상 결과 상태를 진술하는 찬양이므로, 한국어에서는 현재적 선언인 ‘위대하십니다’로 옮기는 것이 자연스럽습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼, 주님
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  - 주 하나님, 주님
  lexicon: HALOT
  rationale: 아도나이와 야훼가 결합된 복합 호칭을 살리되, 본문 흐름에서는 호칭의 중복을 피하기 위해 앞에서 ‘주 야훼’로, 이어서 동일 대상을 ‘주님’으로 받았습니다.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  english_pob_choice: according to all that we have heard with our ears
  chosen_korean: 우리가 귀로 들은 모든 것에 비추어
  alternatives_korean:
  - 우리가 귀로 들은 모든 바에 따라
  - 우리가 귀로 들은 모든 것 안에서
  lexicon: HALOT
  rationale: 직역투를 지나치게 늘이지 않으면서도, 들은 증언을 근거로 삼는다는 뜻을 살리기 위해 ‘~에 비추어’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 언약적 신명은 ‘야훼’로 옮겨, 전통 교회어 ‘여호와’보다 원문 가시성을 높였습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה / YHWH → 야훼'
- issue: ‘주 야훼’ 호칭의 한국어 재현
  chosen_reading: 주 야훼, 주님
  alternative_readings:
  - 주 야훼
  - 주 하나님
  rationale: 히브리어 복합 호칭의 긴장감을 보존하면서도, 뒤이어 반복되는 대명적 호칭을 한국어 문장 안에서 자연스럽게 받기 위해 약간의 호칭 재구성을 허용했습니다.
  doctrine_reference: 'DOCTRINE.md: Maintain lexical/theological tension in divine titles'
