  naturalness: ‘주 야훼여, 주님은 위대하십니다’는 한국어 합쇼체 기도·찬양 문맥에서 자연스럽고, ‘우리가 귀로 들은 모든 것에 비추어 볼 때’를 앞세우면 수식 관계도 명확해집니다. ‘하나님도 없습니다’의 보조사 ‘도’는 이 문맥에서 부자연스러우므로 삭제하는 편이 좋습니다.
  terminology: ‘야훼’는 제공된 프로젝트 결정을 따르며, אֱלֹהִים은 본문의 유일신 고백 문맥상 ‘하나님’으로 유지할 수 있습니다. זולתך의 대안은 각주에서 ‘신’과 ‘하나님’을 모두 포함해 완결된 문장으로 제시하는 것이 좋습니다.
