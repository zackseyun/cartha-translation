  source_fidelity: 수사 의문문, ‘땅 위의 한 민족’, 하나님께서 ‘가셔서’ 속량하신다는 동작, ‘자신을 위하여 이름을’이라는 목적이 초안에서 약화되거나 바뀌었습니다. 또한 초안의 ‘자기들을 위하여 구속하신’은 לְּךָ(‘주를 위하여’)의 귀속 대상을 잘못 옮겼고, 난해한 종결구를 ‘가운데서’로 풀어 의미 관계를 확정했습니다. 개정문은 이 요소들을 회복하고 종결구의 불확실성은 각주로 보존합니다.
