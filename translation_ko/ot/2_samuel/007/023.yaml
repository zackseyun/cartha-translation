reference: 2 Samuel 7:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
  footnotes:
  - marker: a
    text: Or 'great and awesome things.' The Hebrew term can denote deeds that inspire awe, dread, or fear.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult in Hebrew; alternatively, 'from Egypt, the nations and its god' or 'from Egypt, nations and gods.'
    reason: alternative_reading
translation:
  language: ko
  text: “주께서 주의 백성, 곧 이스라엘처럼 땅 위의 그 어떤 민족도 없으니, 하나님께서 그들을 한 백성으로 자기 자신을 위하여 구속하시고, 자기 이름을 위하여 세우시며, 주의 땅을 위하여 주의 백성 앞에서 크고 두려운 일들을 행하셨습니다. 주께서 애굽에서, 곧 민족들과 그들의 신들 가운데서, 자기들을 위하여 구속하신 백성을 말입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְּיִשְׂרָאֵל
  english_pob_choice: And who is like your people, like Israel
  chosen_korean: “주께서 주의 백성, 곧 이스라엘처럼… 없으니”
  alternatives_korean:
  - “누가 주의 백성 이스라엘처럼…”
  - “주의 백성, 이스라엘과 같은 이는 누구입니까”
  lexicon: HALOT
  rationale: 히브리어 수사 의문문과 비교 구조를 한국어에서 자연스러운 감탄·부정형으로 옮겨, 이스라엘의 비견 불가능성을 살렸습니다.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  english_pob_choice: the one nation on the earth
  chosen_korean: “땅 위의 그 어떤 민족도 없으니”
  alternatives_korean:
  - “땅 위의 유일한 민족이니”
  - “땅에서 하나뿐인 민족이니”
  lexicon: HALOT
  rationale: ‘한 민족’의 배타적 유일성을 강조하되, 현대 한국어에서는 ‘그 어떤…도 없으니’가 비교 강조를 더 자연스럽게 드러냅니다.
- source_word: לִפְדּוֹת לוֹ לְעָם / אֲשֶׁר פָּדִיתָ לְּךָ
  english_pob_choice: to redeem for himself as a people / whom you redeemed for yourself
  chosen_korean: “자기 자신을 위하여 구속하시고… 자기들을 위하여 구속하신”
  alternatives_korean:
  - “자기 백성으로 속량하시고… 주를 위하여 속량하신”
  - “자기 백성으로 구원하시고… 주를 위하여 구원하신”
  lexicon: HALOT
  rationale: פדה의 구속·속량 의미를 살리기 위해 ‘구속하시다’를 택했고, לְ/לְּךָ의 소유·귀속성을 ‘자기 자신을 위하여 / 자기들을 위하여’로 반영했습니다.
- source_word: וְלַעֲשׂוֹת לָכֶם הַגְּדוּלָּה וְנֹרָאוֹת
  english_pob_choice: and to do for you great and fearsome things
  chosen_korean: “주의 땅을 위하여 주의 백성 앞에서 크고 두려운 일들을 행하셨습니다”
  alternatives_korean:
  - “주의 땅을 위하여 주의 백성 앞에서 크고 경외로운 일들을 행하셨습니다”
  - “주의 땅을 위해 주의 백성 앞에서 크고 놀라운 일들을 행하셨습니다”
  lexicon: HALOT
  rationale: ‘두려운’은 נֹרָאוֹת의 경외와 두려움을 함께 담습니다. לָכֶם을 ‘주께서’의 서술 속에서 자연스럽게 한국어 목적어 관계로 살렸습니다.
- source_word: מִפְּנֵי עַמְּךָ אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם גּוֹיִם וֵאלֹהָיו
  english_pob_choice: before your people, whom you redeemed for yourself from Egypt, from nations and their gods
  chosen_korean: “주께서 애굽에서, 곧 민족들과 그들의 신들 가운데서, 자기들을 위하여 구속하신 백성을 말입니다”
  alternatives_korean:
  - “애굽에서, 곧 민족들과 그들의 신들 가운데서…”
  - “애굽으로부터, 민족들과 그들의 신들로부터…”
  lexicon: HALOT
  rationale: 끝부분의 압축된 구문을 한국어에서 매끄럽게 풀되, ‘민족들과 그들의 신들’이라는 난해한 병렬을 보존했습니다.
theological_decisions:
- issue: הָלְכוּ אֱלֹהִים의 주어와 신격 표현
  chosen_reading: ‘하나님께서’로 단수 주어를 취해 이스라엘의 하나님이 구속 행위를 하신 것으로 읽었습니다.
  alternative_readings:
  - ‘신들’로 복수 해석
  - 주어를 생략한 무인칭식 번역
  rationale: 문맥상 이스라엘의 하나님을 가리키는 것이 분명하며, 복수형 외형이 신학적 다신론을 뜻하지 않도록 단수로 옮겨야 합니다.
  doctrine_reference: 하나님의 단일성
