translation:
  language: ko
  text: 왕이 나단 예언자에게 말했습니다. 「보십시오, 저는 백향목으로 지은 집에 살고 있는데, 하나님의 궤는 장막 휘장 안에 머물러 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
