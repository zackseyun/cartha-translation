  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
  footnotes:
  - marker: a
    text: Or “within a curtain”; the Hebrew term refers to a tent curtain or hanging, likely evoking the tabernacle coverings.
