  - 장막 안에 있습니다
  lexicon: HALOT
  rationale: יְרִיעָה는 일반적인 '장막'보다 장막의 휘장/덮개를 가리키므로, 성막적 이미지가 사라지지 않도록 '장막 휘장'을 채택했습니다.
theological_decisions:
- issue: 언약궤의 거처 묘사
  chosen_reading: 본문의 대비를 살려 왕의 '백향목 집'과 하나님의 궤의 '장막 휘장'을 병렬로 두어, 후기 성전 신학을 본문에 앞당겨 넣지 않았습니다.
  alternative_readings:
  - 하나님의 궤는 장막 안에 있습니다
  - 하나님의 궤는 휘장 안에 있습니다
  rationale: 히브리어는 일시적이고 성막적인 거처 이미지를 유지하므로, 본문이 말하는 대비의 힘을 보존하는 것이 중요합니다.
  doctrine_reference: 번역 원칙 §§1, 5
