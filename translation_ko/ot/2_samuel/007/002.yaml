base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
  footnotes:
  - marker: a
    text: Or “within a curtain”; the Hebrew term refers to a tent curtain or hanging, likely evoking the tabernacle coverings.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 나단 예언자에게 말했습니다. 「보십시오, 저는 백향목으로 지은 집에 살고 있는데, 하나님의 궤는 장막 휘장 안에 있습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “휘장 안에”; 히브리어 용어는 장막의 휘장이나 늘어진 천을 가리키며, 성막 덮개를 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그때 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스러운 한국어로 옮기되, 히브리어 wayyiqtol의 단순한 사건 전개를 과도하게 해석하지 않도록 했습니다.
- source_word: נָתָן הַנָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 나단 예언자
  alternatives_korean:
  - 예언자 나단
  - 나단, 예언자
  lexicon: HALOT
  rationale: 인명과 직함의 병치를 한국어의 자연스러운 전면 배치로 옮기면서, 직함은 원문의 식별 기능을 유지하도록 예언자로 처리했습니다.
- source_word: בְּבֵית אֲרָזִים
  english_pob_choice: in a house of cedar
  chosen_korean: 백향목으로 지은 집
  alternatives_korean:
  - 백향목 집
  - 백향목으로 된 집
  lexicon: HALOT
  rationale: 구문상 재료를 나타내는 구성구이므로, 단순한 소유격보다 건축 재료를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: יֹשֵׁב בְּתוֹךְ הַיְרִיעָה
  english_pob_choice: dwells within curtains
  chosen_korean: 장막 휘장 안에 있습니다
  alternatives_korean:
  - 휘장 안에 있습니다
  - 장막 안에 있습니다
  lexicon: HALOT
  rationale: יְרִיעָה는 일반적인 '장막'보다 장막의 휘장/덮개를 가리키므로, 성막적 이미지가 사라지지 않도록 '장막 휘장'을 채택했습니다.
theological_decisions:
- issue: 언약궤의 거처 묘사
  chosen_reading: 본문의 대비를 살려 왕의 '백향목 집'과 하나님의 궤의 '장막 휘장'을 병렬로 두어, 후기 성전 신학을 본문에 앞당겨 넣지 않았습니다.
  alternative_readings:
  - 하나님의 궤는 장막 안에 있습니다
  - 하나님의 궤는 휘장 안에 있습니다
  rationale: 히브리어는 일시적이고 성막적인 거처 이미지를 유지하므로, 본문이 말하는 대비의 힘을 보존하는 것이 중요합니다.
  doctrine_reference: 번역 원칙 §§1, 5
