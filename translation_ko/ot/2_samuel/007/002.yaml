  rationale: 인명과 직함의 병치를 한국어의 자연스러운 전면 배치로 옮기면서, 직함은 원문의 식별 기능을 유지하도록 예언자로 처리했습니다.
- source_word: בְּבֵית אֲרָזִים
  english_pob_choice: in a house of cedar
  chosen_korean: 백향목으로 지은 집
  alternatives_korean:
