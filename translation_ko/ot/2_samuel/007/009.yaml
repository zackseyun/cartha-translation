source:
  edition: WLC
  text: וָ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥תָ/ה אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤תִֽי לְ/ךָ֙ שֵׁ֣ם גָּד֔וֹל כְּ/שֵׁ֥ם הַ/גְּדֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
  footnotes:
  - marker: a
    text: Or 'great renown.' Hebrew 'name' often carries the sense of reputation or fame, but the main text preserves the biblical idiom.
    reason: lexical_alternative
  - marker: b
    text: Or 'like the name of the great men who are on the earth.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 네가 다닌 모든 곳에서 너와 함께 있었고, 네 앞에서 네 모든 원수를 끊어 버렸습니다. 또 내가 땅에 있는 위대한 이들의 이름과 같은 큰 이름을 네게 만들어 주겠습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 명성’. 히브리어 ‘이름’은 종종 명성이나 평판을 가리키지만, 본문은 성경적 관용구를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에 있는 위대한 사람들의 이름과 같은’.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ בְּכֹל אֲשֶׁר הָלַכְתָּ
  english_pob_choice: I was with you wherever you went
  chosen_korean: 내가 네가 가는 모든 곳에 함께 있었고
  alternatives_korean:
  - 내가 네가 어디를 가든지 함께 있었고
  - 내가 네가 다닌 모든 곳에 함께 있었고
  lexicon: HALOT
  rationale: 히브리어의 반복적 과거 서술을 살리면서, 합쇼체 문맥에 맞게 ‘함께 있었다’로 자연스럽게 옮겼습니다. ‘wherever you went’의 포괄성을 ‘네가 가는 모든 곳에’로 보존했습니다.
- source_word: וָאַכְרִתָה אֶת כָּל אֹיְבֶיךָ מִפָּנֶיךָ
  english_pob_choice: I cut off all your enemies from before you
  chosen_korean: 네 모든 원수를 네 앞에서 끊어 버렸습니다
  alternatives_korean:
  - 네 모든 원수를 네 앞에서 멸했습니다
  - 네 모든 원수를 네 앞에서 없애 버렸습니다
  lexicon: HALOT
  rationale: כרת의 구체적 이미지인 ‘끊다’를 살렸고, 결과의 단호함을 위해 ‘끊어 버렸습니다’로 옮겼습니다. ‘from before you’는 ‘네 앞에서’로 직역에 가깝게 유지했습니다.
- source_word: שֵׁם גָּדוֹל כְּשֵׁם הַגְּדֹלִים
  english_pob_choice: a great name, like the name of the great ones
  chosen_korean: 큰 이름을 지어 주겠습니다 — 땅에 있는 위대한 이들의 이름처럼
  alternatives_korean:
  - 큰 명성을 지어 주겠습니다 — 땅에 있는 위대한 이들의 명성처럼
  - 큰 이름을 주겠습니다 — 땅에 있는 위대한 이들의 이름처럼
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’이 명성까지 함축하지만, 본문 이미지를 유지하려고 ‘이름’을 살렸습니다. 비교 구조도 반복하여 ‘위대한 이들의 이름처럼’으로 대응시켰습니다.
theological_decisions:
- issue: 'וְעָשִׂיתִי의 시제 처리: 서술적 완료인가, 약속적 미래인가'
  chosen_reading: ‘나는 네게 큰 이름을 지어 주겠습니다’로 약속적 미래로 옮겼습니다.
  alternative_readings:
  - ‘나는 네게 큰 이름을 지었습니다’로 완료형처럼 옮김
  rationale: 문맥이 이미 행하신 일을 회고한 뒤 언약적 약속으로 이어지므로, 한국어에서는 미래로 옮겨야 발화의 힘이 살아납니다. 1역대상 17:8의 대응 구절과도 조화를 이룹니다.
  doctrine_reference: 언약 약속의 담화 흐름
