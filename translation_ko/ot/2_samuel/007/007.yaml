source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
  footnotes:
  - marker: a
    text: 'Hebrew: ''one of the tribes of Israel''; the parallel in 1 Chronicles 17:6 reads ''judges of Israel,'' which likely reflects the leaders charged to shepherd the people.'
    reason: textual_variant
translation:
  language: ko
  text: 내가 이스라엘의 모든 자손 사이에 걸어 다닌 모든 곳에서, 이스라엘의 한 지파에게 내가 한마디라도 말한 적이 있었느냐? 그 지파는 내가 내 백성 이스라엘을 먹이고 돌보라고 명령한 자들이다. 내가 말하기를, ‘너희가 어찌하여 나를 위하여 백향목 집을 짓지 않았느냐?’ 하였느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘이스라엘의 지파들 중 하나’로 되어 있습니다. 역대상 17:6의 병행구는 ‘이스라엘의 재판관들’로 읽어, 지도자들을 가리키는 해석을 시사합니다.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  english_pob_choice: have walked
  chosen_korean: 걸어 다닌
  alternatives_korean:
  - 다닌
  - 거닐던
  lexicon: HALOT
  rationale: 하나님이 백성 가운데서 임재하며 이동하시는 구체적 이미지를 살리기 위해 ‘걸어 다닌’을 택했습니다.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: In all the places where ... among all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손 사이에 걸어 다닌 모든 곳에서
  alternatives_korean:
  - 이스라엘의 모든 자손 가운데 다닌 모든 곳에서
  - 이스라엘의 모든 자손 사이를 두루 다닌 모든 곳에서
  lexicon: HALOT
  rationale: ‘모든 곳’과 ‘사이에’의 병렬을 살리면서, 하나님의 임재가 백성 가운데 있었다는 점을 유지했습니다.
- source_word: אֶת עַמִּי אֶת יִשְׂרָאֵל
  english_pob_choice: my people Israel
  chosen_korean: 내 백성 이스라엘
  alternatives_korean:
  - 내 백성, 이스라엘
  - 나의 백성 이스라엘
  lexicon: HALOT
  rationale: 소유와 동일시를 함께 나타내는 병렬 구조이므로 자연스럽게 ‘내 백성 이스라엘’로 옮겼습니다.
- source_word: לִרְעוֹת
  english_pob_choice: to shepherd
  chosen_korean: 먹이고 돌보라고
  alternatives_korean:
  - 목양하라고
  - 양 떼를 치라고
  lexicon: HALOT
  rationale: ‘목자-통치’ 비유를 한국어에서 바로 드러내기 위해 ‘먹이고 돌보다’로 옮겨, 단순 통치보다 돌봄의 함의를 살렸습니다.
- source_word: בֵּית אֲרָזִים
  english_pob_choice: a house of cedar
  chosen_korean: 백향목 집
  alternatives_korean:
  - 백향목으로 된 집
  - 삼나무 집
  lexicon: HALOT
  rationale: 성소/왕궁 문맥에서 통용되는 재료 표현을 살려 ‘백향목 집’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: אַחַד שִׁבְטֵי יִשְׂרָאֵל의 의미
  chosen_reading: 이스라엘의 한 지파
  alternative_readings:
  - 이스라엘의 한 통치자
  - 이스라엘의 한 지도자
  rationale: 마소라 본문은 ‘지파’라고 읽으므로 본문형을 우선했고, 역대상 병행의 지도자적 뉘앙스는 다음 절의 목양 명령으로 충분히 드러난다고 보았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: 언약적 질문의 수사학
  chosen_reading: 내가 한마디라도 말한 적이 있었느냐?
  alternative_readings:
  - 내가 말한 적이 있었느냐?
  - 내가 무슨 말이라도 한 적이 있었느냐?
  rationale: 히브리어의 부정 의문문과 강조를 살려, 하나님이 이스라엘 어느 지파에게도 그런 요구를 하지 않으셨음을 강하게 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
