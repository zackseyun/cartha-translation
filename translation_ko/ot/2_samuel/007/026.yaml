  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
  footnotes:
  - marker: a
    text: Or 'may your name be made great forever.'
    reason: lexical_alternative
  - marker: b
    text: '''House'' here refers to David''s household or dynasty, not merely a physical building.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 주님의 이름이 영원히 높여지게 하십시오[a]. ‘만군의 야훼께서 이스라엘의 하나님이십니다’라고 말하게 하십시오[b]. 그리고 주님의 종 다윗의 집이 주 앞에 견고하게 서게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 이름이 영원히 크게 되게 하십시오.’
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 여기서 단순한 건물보다 다윗의 가문 또는 왕조를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל שִׁמְךָ
  english_pob_choice: may your name be magnified
  chosen_korean: 주님의 이름이 영원히 높여지게 하십시오
  alternatives_korean:
  - 주님의 이름이 영원히 크게 되게 하십시오
  - 주님의 이름이 영원히 영화롭게 되게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 기원·소망 표현을 한국어 청유형으로 살리고, ‘이름’의 명예·현시된 위상을 자연스럽게 ‘높여지다’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 라고 말하게 하십시오
  alternatives_korean:
  - 하며 말하게 하십시오
  - 이르기를
  lexicon: HALOT
  rationale: 뒤따르는 고백문을 도입하는 인용 표지로 기능하므로, 한국어에서도 직접 인용을 이끄는 표현을 유지했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로, צְבָאוֹת은 하나님의 군대/군세를 포괄하는 호칭으로 ‘만군의’를 붙여 옮겼습니다.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  english_pob_choice: is God over Israel
  chosen_korean: 이스라엘의 하나님이십니다
  alternatives_korean:
  - 이스라엘 위에 계신 하나님이십니다
  - 이스라엘을 다스리시는 하나님이십니다
  lexicon: HALOT
  rationale: עַל의 지배·주권 뉘앙스는 문맥상 분명하지만, 한국어 신앙언어에서 굳이 ‘위에’로 직역하기보다 ‘이스라엘의 하나님’으로 유지해도 주권 고백이 보존됩니다.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  english_pob_choice: and may the house of your servant David
  chosen_korean: 그리고 주님의 종 다윗의 집이
  alternatives_korean:
  - 그리고 주님의 종 다윗의 가문이
  - 그리고 주님의 종 다윗의 왕조가
  lexicon: HALOT
  rationale: ‘집’의 기본 의미를 유지하되 2사무엘 7장의 왕조적 함의를 한국어 독자가 읽어낼 수 있도록 문맥을 살렸습니다.
- source_word: יִהְיֶה נָכוֹן
  english_pob_choice: be established
  chosen_korean: 견고하게 서게 하십시오
  alternatives_korean:
  - 세워지게 하십시오
  - 확고하게 되게 하십시오
  lexicon: HALOT
  rationale: 동적이되 과도하게 해석하지 않도록, ‘견고함/확립됨’의 의미를 한국어 관용구 ‘견고하게 서다’로 표현했습니다.
theological_decisions:
- issue: YHWH(יְהוָה)와 호칭 번역
  chosen_reading: ‘야훼’로 옮기고, 인용문 안에서도 동일하게 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 고유명사를 직접 사용하므로, 전통적 대체 호칭보다 소스 직접성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘house’의 의미
  chosen_reading: ‘집’을 유지하되 다윗 왕조의 의미를 문맥으로 드러내도록 했습니다.
  alternative_readings:
  - 가문
  - 왕조
  rationale: 2사무엘 7장의 언어유희와 약속 구조를 보존하기 위해 기본어휘를 남기면서도, 독자가 혈통/왕조 의미를 이해하도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; original-language primacy'
