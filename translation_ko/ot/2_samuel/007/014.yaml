id: 2SA.7.14
reference: 2 Samuel 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'with human blows.' The Hebrew reads 'with the blows of the sons of man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그에게 아버지가 되고, 그는 내게 아들이 될 것입니다. 그가 죄를 범하면, 나는 사람의 막대기와 인생의 매질로 그를 징계할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인생의 매질’은 히브리어의 ‘사람의 아들들의 타격들’에 해당하는 더 관용적인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  english_pob_choice: I will be a father to him
  chosen_korean: 나는 그에게 아버지가 되고
  alternatives_korean:
  - 나는 그의 아버지가 되고
  - 나는 그에게 아버지로 있을 것이고
  lexicon: HALOT
  rationale: ל + 명사 구조의 관계적 표현을 살려 ‘~에게 아버지가 되다’로 옮기되, 한국어로 자연스럽게 읽히도록 했습니다.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  english_pob_choice: and he will be a son to me
  chosen_korean: 그는 내게 아들이 될 것입니다
  alternatives_korean:
  - 그는 내 아들이 될 것입니다
  - 그는 내게 아들로 있을 것입니다
  lexicon: HALOT
  rationale: 앞 구절과 평행을 이루는 관계적·언약적 표현을 반영하면서도 한국어 문장으로 매끄럽게 유지했습니다.
- source_word: וְהֹכַחְתִּיו
  english_pob_choice: I will discipline him
  chosen_korean: 나는 … 그를 징계할 것입니다
  alternatives_korean:
  - 나는 … 그를 교정할 것입니다
  - 나는 … 그를 책망할 것입니다
  - 나는 … 그를 훈계할 것입니다
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 꾸짖음보다 교정적 징계를 가리키므로 ‘징계하다’가 가장 가깝습니다.
- source_word: בְּשֵׁבֶט אֲנָשִׁים / וּבְנִגְעֵי בְּנֵי אָדָם
  english_pob_choice: with the rod of men and with the blows of the sons of man
  chosen_korean: 사람의 막대기와 인생의 매질로
  alternatives_korean:
  - 사람의 지팡이와 사람의 타격으로
  - 사람들의 막대기와 사람의 매질로
  - 인간의 회초리와 인간의 채찍질로
  lexicon: HALOT
  rationale: שֵׁבֶט과 נגע를 각각 징계 도구와 타격의 이미지로 살렸고, בְּנֵי אָדָם은 관용적으로 ‘인생’으로 옮겨 현대 한국어에서 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ‘아들’ 표현의 범위와 장차의 메시아적 적용
  chosen_reading: 본문의 1차적 의미인 다윗 왕조의 아들/후손에 대한 언약적 관계를 그대로 두고, 메시아적 해석은 본문 자체에 덧붙이지 않았습니다.
  alternative_readings:
  - 직접 메시아 예언으로 풀어 쓰기
  - 후대 적용을 본문 번역에 반영하기
  rationale: 히브리어 본문은 다윗 언약의 맥락에서 말하며, 번역은 그 의미를 보존해야 하므로 신학적 확장은 주석의 영역으로 남겨 두었습니다.
  doctrine_reference: 원문 우선 원칙; 본문-주석 구분 유지
