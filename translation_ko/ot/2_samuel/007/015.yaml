id: 2SA.7.15
reference: 2 Samuel 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
  footnotes:
  - marker: a
    text: Or 'my lovingkindness' or 'my covenant loyalty.' The Hebrew term carries the sense of loyal, steadfast love within a covenant relationship.
    reason: lexical_alternative
  - marker: b
    text: Literally 'whom I removed from before you.' This may refer to Saul's removal from his position in relation to David, not merely physical departure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내 인애는 그에게서 떠나지 않을 것입니다[a]. 내가 사울에게서 그것을 제거한 것처럼[b], 내가 당신 앞에서 제거한 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인애’는 히브리어 חֶסֶד의 번역으로, 문맥상 언약 안에서의 변함없는 사랑과 신실함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 사울에게서 제거한 자’를 뜻합니다. 이는 단순한 공간적 이동보다 사울의 지위와 관련된 제거를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַסְדִּי
  english_pob_choice: my steadfast love
  chosen_korean: 내 인애
  alternatives_korean:
  - 내 변함없는 사랑
  - 내 언약적 사랑
  - 내 자비
  lexicon: HALOT
  rationale: חֶסֶד는 단순한 감정보다 언약 안에서의 신실한 사랑을 가리키므로, 한국어로는 전통적이지만 본문 의미를 잘 담는 ‘인애’를 택했습니다.
- source_word: לֹא יָסוּר
  english_pob_choice: will not depart
  chosen_korean: 떠나지 않을 것입니다
  alternatives_korean:
  - 물러나지 않을 것입니다
  - 벗어나지 않을 것입니다
  - 사라지지 않을 것입니다
  lexicon: HALOT
  rationale: סור의 기본 의미인 ‘떠나다/벗어나다’를 자연스러운 현대 한국어로 옮겨, 앞의 ‘인애’가 그에게서 지속적으로 멀어지지 않음을 분명히 했습니다.
- source_word: מִלְּפָנֶיךָ
  english_pob_choice: from before you
  chosen_korean: 당신 앞에서
  alternatives_korean:
  - 당신의 앞에서
  - 당신의 임재 앞에서
  - 당신 앞에서 물러나
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘~의 앞에서’는 보존하되, 한국어에서는 ‘당신 앞에서’가 가장 간결하고 문맥상 자연스럽습니다.
theological_decisions:
- issue: חֶסֶד의 한국어 용어 선택
  chosen_reading: ‘인애’로 옮겨 언약적 신실함과 사랑의 결을 함께 살렸습니다.
  alternative_readings:
  - 은혜
  - 자비
  - 사랑
  rationale: 이 절은 사울에게서의 제거와 대비되는 다윗 언약의 지속성을 말하므로, 단순한 감정적 사랑이나 일반적 자비보다 언약적 충실성을 내포한 ‘인애’가 더 적절합니다.
  doctrine_reference: 번역 철학 §§1, 5, 6
- issue: ‘from before you’의 처리
  chosen_reading: ‘당신 앞에서 제거한 사람’처럼, 제거의 관계적·왕권적 배경은 드러내되 본문의 여운은 보존했습니다.
  alternative_readings:
  - 당신의 임재에서
  - 당신 앞에서 물러난 자
  rationale: 히브리어는 사울이 다윗 앞에서 제거되었다는 관계를 암시하지만, 이를 과도하게 풀어 쓰면 본문의 압축성과 긴장이 약해집니다.
  doctrine_reference: 번역 철학 §§1, 3
