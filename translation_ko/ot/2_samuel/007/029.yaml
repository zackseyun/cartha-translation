base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
  footnotes:
  - marker: a
    text: Or 'be pleased' or 'consent' for 'please be willing.'
    reason: lexical_alternative
  - marker: b
    text: '''House'' may also carry the sense of ''household'' or ''dynasty'' in this context.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'Lord GOD' represents the title-name combination 'Adonai YHWH'; elsewhere YHWH is rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제 기꺼이[a] 당신의 종의 집[b]에 복을 베푸시고, 그 집이 영원히 당신 앞에 있게 하소서. 주 야훼[c]여, 주께서 말씀하셨으니, 당신의 복으로 당신의 종의 집이 영원히 복을 받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기꺼이’는 히브리어 הוֹאֵל의 청원적 뉘앙스를 옮긴 것입니다. ‘기쁘게 여기시다’, ‘허락하시다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 이 문맥에서 문자적인 집뿐 아니라 가문이나 왕조를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘야훼’는 히브리어 יְהוָה의 음역입니다. 여기서는 아도나이와 결합된 칭호-이름 표현(אֲדֹנָי יְהוִה)입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹאֵל
  english_pob_choice: please be willing
  chosen_korean: 이제 주십시오
  alternatives_korean:
  - 기쁘게 여기십시오
  - 허락해 주십시오
  - 마음 내어 주십시오
  lexicon: HALOT
  rationale: 문맥상 청원형의 정중한 요청으로서, 한국어에서는 ‘이제 주십시오’가 하나님의 자발적 동의를 구하는 뉘앙스를 간결하게 살립니다.
- source_word: וּבָרֵךְ
  english_pob_choice: and bless
  chosen_korean: 복을 주셔서
  alternatives_korean:
  - 축복해 주셔서
  - 복 주셔서
  lexicon: HALOT
  rationale: 히브리어 בָּרַךְ의 직접적 의미를 따라 ‘복을 주시다’로 옮겨, 기도문에서의 간청을 자연스럽게 표현했습니다.
- source_word: בֵּית עַבְדְּךָ
  english_pob_choice: the house of your servant
  chosen_korean: 당신의 종의 집
  alternatives_korean:
  - 당신의 종의 가문
  - 당신의 종의 집안
  - 당신의 종의 가계
  lexicon: HALOT
  rationale: ‘집’은 문자적 집을 넘어서 가문/왕조까지 아우르는 중의성이 있으므로, 해석을 고정하지 않고 그대로 살렸습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼님
  alternatives_korean:
  - 주 하나님
  - 주 여호와님
  lexicon: HALOT
  rationale: YHWH는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אֲדֹנָי와 결합된 경칭은 한국어에서 호격적 존칭 ‘주 …님’으로 처리했습니다.
- source_word: מִבִּרְכָתְךָ
  english_pob_choice: by your blessing
  chosen_korean: 당신의 복으로
  alternatives_korean:
  - 당신의 축복으로
  - 당신의 복에서
  lexicon: HALOT
  rationale: מִן의 출처·수단 뉘앙스를 살려, 다윗의 집이 지속적으로 복을 받는 근거가 하나님의 복임을 분명히 했습니다.
- source_word: יְבֹרַךְ
  english_pob_choice: will be blessed
  chosen_korean: 복을 받게 하소서
  alternatives_korean:
  - 복을 받을 것입니다
  - 복되게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 수동 미완료를 기도의 청원형으로 자연스럽게 옮겨, 단순 भविष्य 진술보다 간구의 힘을 드러냈습니다.
theological_decisions:
- issue: YHWH의 한국어 표기와 אֲדֹנָי יְהוִה의 결합 처리
  chosen_reading: 주 야훼님
  alternative_readings:
  - 주님
  - 주 하나님
  rationale: 본문은 아도나이와 YHWH의 결합형을 사용하므로, 야훼를 보존하되 한국어 경칭으로 직접 기도하는 어조를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: ‘집’의 다의성 보존
  chosen_reading: 당신의 종의 집
  alternative_readings:
  - 당신의 종의 가문
  - 당신의 종의 왕조
  rationale: 이 구절은 다윗 언약 맥락에서 왕조를 가리키지만, 히브리어 자체는 ‘집’을 유지하므로 해석을 과잉 명시하지 않고 문학적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, preserve theological tension rather than resolve it'
