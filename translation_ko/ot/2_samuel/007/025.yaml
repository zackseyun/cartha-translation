id: 2SA.7.25
reference: 2 Samuel 7:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
  footnotes:
  - marker: a
    text: Or 'the promise that you have spoken.'
    reason: lexical_alternative
  - marker: b
    text: '''His house'' here carries the sense of his royal house or dynasty, not merely his physical household.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼 하나님, 당신의 종과 그의 집에[b] 관하여 말씀하신 말씀을[a] 영원히 굳게 세우시고, 말씀하신 대로 행하여 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀’은 히브리어 דָּבָר의 기본 의미를 살린 표현이며, 문맥상 ‘약속’으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘집’은 단순한 가정이 아니라 다윗의 왕가 또는 왕조를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 여호와 하나님
  lexicon: HALOT
  rationale: יהוה는 POB 원칙에 따라 고유명사로 야훼를 유지하고, אֱלֹהִים은 직접 호칭에서 일반적 신칭인 하나님으로 옮겼습니다.
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 그 말씀
  alternatives_korean:
  - 그 약속
  - 그 일
  lexicon: HALOT
  rationale: 직역상 '말씀/말'의 의미를 유지하되, 한국어 기도문 맥락에서 자연스럽고 공손한 표현인 '그 말씀'으로 옮겼습니다. 이는 POB가 본문 의미의 긴장을 '약속'으로 미리 확정하지 않으려는 선택과도 맞습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 종자
  lexicon: HALOT
  rationale: 이 문맥은 왕 앞의 겸손한 기도 용법이므로 '종'이 가장 자연스럽고, POB의 영어 선택도 'servant'를 유지합니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his house
  chosen_korean: 그의 집
  alternatives_korean:
  - 그의 왕가
  - 그의 왕조
  - 그의 가문
  lexicon: HALOT
  rationale: 본문의 핵심 관용구인 '집'을 살렸습니다. 2사무엘 7장의 문맥상 왕조적 의미가 있지만, 본문에는 '집'이 먼저 나오므로 본문에서는 관용을 유지합니다.
- source_word: הָקֵם
  english_pob_choice: confirm
  chosen_korean: 굳게 세우시고
  alternatives_korean:
  - 확증하시고
  - 세우시고
  - 견고하게 하시고
  lexicon: HALOT
  rationale: 히필 명령형의 '서게 하다/세우다' 의미를 반영하면서, 약속을 견고히 한다는 뉘앙스를 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: 2사무엘 7장의 בית를 '왕조'로 명시할지 여부
  chosen_reading: 본문에는 '집'을 유지하고, 의미는 문맥이 드러내도록 둡니다.
  alternative_readings:
  - 그의 왕조
  - 그의 왕가
  rationale: 이 절은 다윗 언약의 왕조적 의미를 지니지만, 번역 본문은 핵심 어휘를 보존하는 편이 소스-충실성이 높습니다. 다만 한국어 독자가 오해하지 않도록 '집'을 유지한 채 문맥에 맡깁니다.
  doctrine_reference: 'Translation philosophy: 원문 우선, 문맥이 신학적 의미를 형성하게 두기'
- issue: 직접 호칭 기도문에서의 존칭 표현
  chosen_reading: 하나님께 대한 직접 청원은 '세우시고', '행해 주십시오'처럼 높임 종결을 사용합니다.
  alternative_readings:
  - 세우소서
  - 행하소서
  rationale: 합쇼체 본문 흐름을 유지하되, 하나님께 드리는 직접 청원은 한국어 존칭 종결로 처리했습니다. 이는 현대 공용 번역의 가독성을 높이면서도 기도문의 경건성을 보존합니다.
  doctrine_reference: 'Korean style note: direct address to God uses honorific endings'
