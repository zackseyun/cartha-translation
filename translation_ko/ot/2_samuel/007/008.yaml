source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
  footnotes:
  - marker: a
    text: Or 'from the sheepfold.' The Hebrew noun can refer to a pastureland or a place where flocks dwell.
    reason: lexical_alternative
  - marker: b
    text: Or 'leader' or 'prince' for 'ruler.' The Hebrew term denotes one appointed to govern, not necessarily using the specific title 'king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 네가 내 종 다윗에게 이렇게 말해야 합니다. “만군의 야훼께서 이렇게 말씀하십니다. 내가 너를 풀밭에서, 양 떼를 따르던 자리에서 데려다가 내 백성 이스라엘 위의 통치자가 되게 하였습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양우리에서’. 히브리어 명사는 목초지나 양 떼가 머무는 곳을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지도자’, ‘군주’. 히브리어 용어는 다스리도록 임명된 자를 뜻하며, 반드시 특정 왕호를 가리키는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה / כֹּה תֹאמַר
  english_pob_choice: Now therefore, this is what you shall say
  chosen_korean: 그러므로 이제 네가 … 이렇게 말해야 합니다
  alternatives_korean:
  - 이제 그러므로 네가 … 이렇게 말하십시오
  - 이제 너는 … 이렇게 말해야 합니다
  lexicon: HALOT
  rationale: 시간 전환과 전달 지시의 이중 기능을 살려, 한국어에서는 자연스러운 명령형보다는 전달 명령을 나타내는 표현으로 옮겼습니다.
- source_word: לְעַבְדִּי לְדָוִד
  english_pob_choice: to my servant David
  chosen_korean: 내 종 다윗에게
  alternatives_korean:
  - 내 종, 다윗에게
  - 내 종인 다윗에게
  lexicon: HALOT
  rationale: עבד는 여기서 다윗에 대한 언약적 호칭으로 기능하므로 ‘종’이 본문 의미를 가장 직접적으로 드러냅니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: 신명은 프로젝트 기본값에 따라 야훼로, צְבָאוֹת은 관용적인 신적 칭호인 ‘만군의’로 옮겨 제목성을 유지했습니다.
- source_word: מִן הַנָּוֶה
  english_pob_choice: from the pasture
  chosen_korean: 풀밭에서
  alternatives_korean:
  - 목초지에서
  - 양우리에서
  - 초원에서
  lexicon: HALOT
  rationale: נָוֶה는 목초지/초지 또는 양 떼가 머무는 곳을 가리킬 수 있으므로, 문맥상 목자 이미지가 살아나는 간결한 표현으로 옮겼습니다.
- source_word: מֵאַחַר הַצֹּאן
  english_pob_choice: from following the flock
  chosen_korean: 양 떼를 따르던 자리에서
  alternatives_korean:
  - 양 떼 뒤를 따르던 곳에서
  - 양 떼를 치던 자리에서
  lexicon: HALOT
  rationale: 직역하면 ‘양 떼 뒤에서’이지만, 한국어에서는 목자 생활의 배경을 자연스럽게 드러내는 방식으로 옮기되 ‘따르던’의 행위를 보존했습니다.
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지도자
  - 다스리는 자
  - 군주
  lexicon: HALOT
  rationale: נגיד은 왕호 자체보다 임명된 통치·지도 직분을 가리키므로, ‘통치자’가 위계와 권한을 가장 직접적으로 전달합니다.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  english_pob_choice: over my people, over Israel
  chosen_korean: 내 백성 이스라엘 위의
  alternatives_korean:
  - 내 백성, 곧 이스라엘 위의
  - 내 백성 위에, 이스라엘 위에
  lexicon: HALOT
  rationale: 히브리어의 반복된 עַל을 한국어에서 완전히 반복하면 다소 부자연스러워서, ‘위의’로 압축하되 지배·권위의 감각은 유지했습니다.
theological_decisions:
- issue: 야훼의 칭호와 언약적 호칭의 보존
  chosen_reading: ‘만군의 야훼’로 번역해 신명과 군사적 주권의 칭호를 함께 드러냈습니다.
  alternative_readings:
  - ‘만군의 주님’
  - ‘여호와 만군의 하나님’
  rationale: 본문은 신명 יְהוָה와 칭호 צְבָאוֹת을 결합해 하나님의 권위를 강조하므로, 이를 흐리지 않고 직접적으로 재현했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
