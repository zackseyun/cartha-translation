  rationale: 시간 전환과 전달 지시의 이중 기능을 살려, 한국어에서는 자연스러운 명령형보다는 전달 명령을 나타내는 표현으로 옮겼습니다.
- source_word: לְעַבְדִּי לְדָוִד
  english_pob_choice: to my servant David
