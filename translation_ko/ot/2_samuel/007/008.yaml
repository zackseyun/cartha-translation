  lexicon: HALOT
  rationale: נגיד은 왕호 자체보다 임명된 통치·지도 직분을 가리키므로, ‘통치자’가 위계와 권한을 가장 직접적으로 전달합니다.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
