id: 2SA.7.11
reference: 2 Samuel 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
  footnotes:
  - marker: a
    text: Or 'build you a house.' Here 'house' likely carries the sense of a royal dynasty, while also echoing David's desire to build a house (temple) for the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 내 백성 이스라엘 위에 재판관들을 세운 날부터. 내가 당신을 모든 원수에게서 쉬게 하였습니다. 야훼께서 또한 당신에게 알려 주십니다. 야훼께서 당신을 위해 집을 지으실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 건물만이 아니라 다윗 왕조를 가리킬 수 있습니다. 이는 다윗이 야훼를 위해 지으려 한 ‘집’(성전)과도 말장난을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  english_pob_choice: and from the day
  chosen_korean: 그리고 … 날부터입니다
  alternatives_korean:
  - 그리고 … 날부터
  - … 날부터입니다
  lexicon: HALOT
  rationale: 출발 시점을 나타내는 연결 표현과 시간 부사를 살려, 앞 절과 이어지는 맥락을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: צִוִּיתִי שֹׁפְטִים
  english_pob_choice: I appointed judges
  chosen_korean: 재판관들을 세운
  alternatives_korean:
  - 재판관들을 임명한
  - 재판관들을 명한
  lexicon: HALOT
  rationale: 문맥상 ‘명령하다’보다 통치자를 세워 직무를 맡기다의 뜻이므로, 행정·사법적 임명을 드러내는 ‘세운’으로 옮겼습니다.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  english_pob_choice: and I have given you rest from all your enemies
  chosen_korean: 내가 당신에게 당신의 모든 원수들에게서 쉼을 주었습니다
  alternatives_korean:
  - 내가 당신에게 모든 원수들에게서 평안을 주었습니다
  - 내가 당신을 모든 원수들에게서 쉬게 하였습니다
  lexicon: HALOT
  rationale: נוח의 사역형은 단순한 휴식보다 ‘쉼/안식’을 주시는 하나님의 행위를 나타내므로, 동사를 살린 직역형을 택했습니다.
- source_word: וְהִגִּיד לְךָ יְהוָה
  english_pob_choice: The LORD also declares to you
  chosen_korean: 야훼께서 또한 당신에게 말씀하십니다
  alternatives_korean:
  - 야훼께서 당신에게 말씀하십니다
  - 야훼께서 당신에게 선포하십니다
  lexicon: HALOT
  rationale: וְ의 연결감을 반영하기 위해 ‘또한’을 살렸고, נגד의 ‘알리다/선포하다’는 의미를 공적 발화인 ‘말씀하십니다’로 자연스럽게 옮겼습니다.
- source_word: בַּיִת
  english_pob_choice: a house
  chosen_korean: 집
  alternatives_korean:
  - 집
  - 왕조
  - 가문
  lexicon: HALOT
  rationale: 이 구절의 בַּיִת은 다윗의 ‘집’과 왕조의 중의성을 지니지만, 한국어 본문에서는 기본어 ‘집’을 두어 독자가 문맥 속 이중 의미를 읽어 내도록 했습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: YHWH를 야훼로 옮김
  alternative_readings:
  - 주
  - 여호와
  rationale: 프로젝트 기본 원칙에 따라 신적 고유명사를 제목어 ‘주’로 대체하지 않고, 계약 이름의 직접 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH → 야훼'
- issue: בַּיִת의 신학적 중의성
  chosen_reading: 집으로 번역하되 왕조 의미를 열어 둠
  alternative_readings:
  - 왕조
  - 왕실
  - 성전
  rationale: 다윗이 성전-집을 지으려는 맥락과, 하나님이 다윗에게 ‘집’ 곧 왕조를 세우시는 약속이 겹치므로, 한쪽으로 뜻을 확정하지 않고 중의성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Preserve theological tension rather than resolve it'
