base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
  footnotes:
  - marker: a
    text: Or “the Israelites” or traditional “the children of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “have not dwelt in a house … but have gone about in a tent and in a dwelling place/tabernacle.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이스라엘 자손을 이집트에서 데리고 올라온 날부터 오늘까지 집에 살지 않았습니다. 그러나 천막과 성막 안에서 이리저리 다니며 지내 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 ‘이스라엘의 아들들’ 또는 ‘이스라엘 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성막’은 문맥에 따라 ‘거처’ 또는 ‘거하는 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  english_pob_choice: have not lived / dwelt
  chosen_korean: 살지 않았고
  alternatives_korean:
  - 거하지 않았고
  - 머물지 않았고
  lexicon: HALOT
  rationale: 주거의 지속 상태를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘살다’이며, 고어적인 ‘거하다’보다 현대 독자가 이해하기 쉽습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성어를 반영하면서도 한국어 성경에서 널리 통용되는 표현을 유지했습니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: out of Egypt
  chosen_korean: 이집트에서 끌어올린
  alternatives_korean:
  - 이집트에서부터 인도해 낸
  - 이집트에서 데리고 올라온
  lexicon: HALOT
  rationale: עלה의 출애굽 관용구를 살려 ‘끌어올리다’로 옮기면, 단순한 이동이 아니라 해방과 인도 행위가 분명해집니다.
- source_word: מִתְהַלֵּךְ
  english_pob_choice: moving about
  chosen_korean: 여기저기 다니며 지내 왔습니다
  alternatives_korean:
  - 이리저리 다니며 지내 왔습니다
  - 움직이며 지내 왔습니다
  lexicon: HALOT
  rationale: 미정착적·유동적 상태를 한국어로 자연스럽게 표현했습니다. 단순한 ‘걷다’보다 상황 전체를 더 잘 드러냅니다.
- source_word: בְּאֹהֶל וּבְמִשְׁכָּן
  english_pob_choice: in a tent and in a tabernacle
  chosen_korean: 천막과 성막 안에서
  alternatives_korean:
  - 장막과 성막 안에서
  - 천막과 장막 안에서
  lexicon: HALOT
  rationale: אֹהֶל은 일반적인 ‘천막’, מִשְׁכָּן은 예배 맥락의 ‘성막’이므로 구별해 옮겼습니다. 두 표현을 병렬로 유지해 원문의 대비를 살렸습니다.
theological_decisions:
- issue: 이동성 있는 거처를 설명하는 두 명사(אֹהֶל / מִשְׁכָּן)의 관계
  chosen_reading: ‘천막과 성막’으로 구별해 옮기고, 원문의 비정착적 하나님의 임재 배경을 유지했습니다.
  alternative_readings:
  - ‘천막과 장막’
  - ‘천막과 거처’
  rationale: 문맥은 다윗에게 하나님이 영구한 집에 거하지 않으셨음을 말하므로, 일반 천막과 예배용 성막의 병렬이 신학적 대비를 가장 분명히 드러냅니다.
  doctrine_reference: 삼하 7장 문맥상 언약궤/성막 배경
- issue: ‘이스라엘 자손’의 성중립화 여부
  chosen_reading: ‘이스라엘 자손’을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어 המקרא적 형식을 과도하게 중성화하지 않고, 원문 구조를 보존하는 쪽이 본문의 음성을 더 정확히 전달합니다.
  doctrine_reference: '번역 원칙: 원문 형식 보존'
