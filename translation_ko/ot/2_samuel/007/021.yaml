id: 2SA.7.21
reference: 2 Samuel 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/עֲב֤וּר דְּבָֽרְ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הוֹדִ֖יעַ אֶת עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
  footnotes:
  - marker: a
    text: Or 'for the sake of your word' or 'because of your promise.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'according to your heart,' that is, according to your own intention or will.
    reason: lexical_alternative
  - marker: c
    text: Hebrew singular, 'all this greatness'; some translations render 'these great things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 주님의 말씀과 주님의 마음에 따라 이 모든 큰 일을 행하셔서, 주님의 종에게 그것을 알게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주님의 말씀 때문에’에 가깝습니다. 문맥상 ‘주님의 약속 때문에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘주님의 마음에 따라’는 곧 주님의 내적 의도나 뜻을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단수형으로 ‘이 모든 큰 일’을 말합니다. 일부 번역은 자연스럽게 ‘이 모든 큰 일들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  english_pob_choice: Because of your word
  chosen_korean: 주님의 말씀 때문에
  alternatives_korean:
  - 주님의 말씀으로 말미암아
  - 주님의 약속 때문에
  - 주님의 말씀을 인하여
  lexicon: HALOT
  rationale: בַּעֲבוּר는 원인·근거를 나타내므로 한국어에서도 인과를 분명히 살렸고, דָּבָר는 이 언약 문맥에서 ‘말씀’으로 옮겨 하나님의 발화된 약속적 말씀을 자연스럽게 드러냈습니다.
- source_word: וּכְלִבְּךָ
  english_pob_choice: and according to your heart
  chosen_korean: 그리고 주님의 마음에 따라
  alternatives_korean:
  - 그리고 주님의 뜻에 따라
  - 그리고 주님의 소원에 따라
  lexicon: HALOT
  rationale: לֵב은 여기서 내적 의도와 뜻을 가리키지만, 원문의 비유를 살려 ‘마음’으로 두고 한국어에서는 ‘~에 따라’로 자연스럽게 연결했습니다.
- source_word: הַגְּדוּלָּה הַזֹּאת
  english_pob_choice: all this greatness
  chosen_korean: 이 모든 큰 일
  alternatives_korean:
  - 이 모든 위대함
  - 이 큰 일들 모두
  lexicon: HALOT
  rationale: 히브리어 단수 명사와 관용적 표현을 살리면서, 한국어에서는 하나님의 행위를 가리키는 자연한 표현인 ‘큰 일’로 옮겨 통일된 하나의 عظ大한 행위를 드러냈습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 노예
  - 주님의 신하
  lexicon: HALOT
  rationale: 이곳은 다윗의 겸손한 왕실 기도 표현이므로 기본어휘인 ‘종’이 적절하며, 여기서는 지위 상실을 강조하는 ‘노예’보다 기도체의 예를 살리는 표현이 원문 기능에 맞습니다.
theological_decisions:
- issue: 원문의 ‘말씀’과 ‘마음’의 병렬을 어떻게 살릴지
  chosen_reading: ‘주님의 말씀’과 ‘주님의 마음’이라는 원문 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘주님의 약속’과 ‘주님의 뜻’으로 해석해 옮기기
  rationale: 문맥상 약속과 뜻을 함축할 수 있으나, 본문은 그런 신학적 해석어보다 직접적으로 ‘말씀’과 ‘마음’을 말하므로 그 긴장을 보존하는 번역이 더 투명합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘큰 일’/‘위대함’의 표현 선택
  chosen_reading: 하나님의 행위를 한 덩어리의 ‘이 모든 큰 일’로 옮겼습니다.
  alternative_readings:
  - ‘이 모든 위대한 일들’
  - ‘이 모든 위대함’
  rationale: 히브리어 단수 표현이 하나님의 통합된 행위를 가리키므로, 한국어에서도 사건의 총체성을 살리되 과도한 추상화는 피했습니다.
  doctrine_reference: Translation philosophy §1
