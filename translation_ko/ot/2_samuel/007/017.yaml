language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הַ/חִזָּי֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
  footnotes:
  - marker: a
    text: Or 'revelation' for 'vision.' The Hebrew term refers to prophetic revelation, often received in visionary form.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 말씀과 이 모든 환상에 따라, 나단은 다윗에게 그와 같이 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계시’로 옮길 수 있습니다. 이 히브리어는 종종 환상 형식으로 주어지는 예언적 계시를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל / וּכְכֹל
  english_pob_choice: According to all / and according to all
  chosen_korean: 이 모든 말씀과 이 모든 환상에 따라
  alternatives_korean:
  - 이 모든 말씀과 이 모든 환상에 따라
  - 이 모든 말씀과 이 모든 환상에 맞추어
  lexicon: HALOT
  rationale: 반복되는 כְ 계열 표현의 대응성과 병행을 살리기 위해 ‘...에 따라’로 옮기고, הַדְּבָרִים는 ‘말씀들’로, הַחִזָּיוֹן은 ‘환상’으로 구분해 표현했습니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 모든 말씀
  alternatives_korean:
  - 이 말씀들
  - 이 일들
  lexicon: HALOT
  rationale: 예언 전달의 맥락에서 דְּבָרִים는 단순한 ‘일들’보다 ‘말씀’이 원문의 발화성을 더 직접적으로 드러냅니다.
- source_word: הַחִזָּיוֹן הַזֶּה
  english_pob_choice: this vision
  chosen_korean: 이 환상
  alternatives_korean:
  - 이 계시
  - 이 예언적 환상
  lexicon: HALOT
  rationale: חִזָּיוֹן의 기본 의미를 살려 ‘환상’으로 두었고, 본문이 말하는 예언적 수여의 성격은 문맥에서 드러나므로 본문에는 과도한 확장을 덧붙이지 않았습니다.
- source_word: כֵּן דִּבֶּר
  english_pob_choice: so Nathan spoke
  chosen_korean: 나단은 ... 그와 같이 말하였습니다
  alternatives_korean:
  - 나단은 ... 그렇게 말하였습니다
  - 나단은 ... 이와 같이 말하였습니다
  lexicon: HALOT
  rationale: כֵּן의 결론적 대응을 ‘그와 같이’로 옮겨 앞의 두 병행구절과의 일치성을 유지했고, דִּבֶּר는 서술체에 맞게 ‘말하였습니다’로 자연스럽게 렌더링했습니다.
theological_decisions:
- issue: הַחִזָּיוֹן을 계시로 풀어쓸지 여부
  chosen_reading: 본문에는 ‘환상’을 유지하고, 예언적 계시라는 성격은 문맥과 주석에서 설명합니다.
  alternative_readings:
  - 계시
  - 예언적 계시
  rationale: 히브리어는 विशন/환상 어휘를 직접 사용하므로, 본문에서 이를 ‘계시’로 일반화하면 원문의 구체적 표현이 희석됩니다. POB의 영어 본문처럼 본문은 ‘vision’에 해당하는 직접어를 살리고, 의미 해설은 각주로 처리하는 편이 더 투명합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
