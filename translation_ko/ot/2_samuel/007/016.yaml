translation:
  language: ko
  text: 당신의 집과 당신의 왕국은 영원히 당신 앞에서 견고히 설 것입니다[a][b]. 당신의 왕좌는 영원히 굳게 세워질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘당신 앞에서’라고 읽습니다. 일부 본문 증거는 ‘내 앞에서’라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ‘집’은 왕실 가문, 곧 왕조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתְךָ
  english_pob_choice: your house
  chosen_korean: 당신의 집
  alternatives_korean:
  - 당신의 왕조
  - 당신의 가문
  lexicon: HALOT
  rationale: 왕실 약속 문맥에서 ‘집’은 단순한 건물이 아니라 다윗의 왕조를 가리킬 수 있으므로, 본문 용어를 살리면서도 한국어에서 자연스럽게 읽히는 ‘집’을 유지했습니다.
- source_word: וּמַמְלַכְתְּךָ
  english_pob_choice: and your kingdom
  chosen_korean: 당신의 왕국
  alternatives_korean:
  - 당신의 통치
  - 당신의 왕권
  lexicon: HALOT
  rationale: 히브리어 명사는 통치권/왕국을 뜻하며, ‘왕국’이 ‘집’과 짝을 이루는 약속 문맥을 가장 직접적으로 전달합니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 당신 앞에서
  - 내 면전에서
  lexicon: HALOT
  rationale: 제시된 히브리어 자음본문은 2인칭이지만, 본문 전승의 일부는 ‘내 앞에서’를 읽으므로, 영어 POB의 본문과 주석을 따라 한국어 본문은 다듬어진 전승 읽기를 반영했습니다.
- source_word: כִּסְאֲךָ
  english_pob_choice: your throne
  chosen_korean: 당신의 왕좌
  alternatives_korean:
  - 당신의 보좌
  - 당신의 왕위
  lexicon: HALOT
  rationale: 왕권을 상징하는 좌석이라는 의미를 살리되, 현대 한국어에서 ‘왕좌’가 가장 직접적이고 이해하기 쉽습니다.
- source_word: יִהְיֶה נָכוֹן
  english_pob_choice: shall be established
  chosen_korean: 확고하게 세워질 것입니다
  alternatives_korean:
  - 세워질 것입니다
  - 굳게 설 것입니다
  lexicon: HALOT
  rationale: ‘나콘’의 핵심은 단순한 존재가 아니라 견고함과 확립됨이므로, 앞의 ‘견고하게 될 것입니다’와 구별되도록 ‘확고하게 세워질 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘before me’ 대 ‘before you’의 본문 전승 차이
  chosen_reading: 본문에는 ‘내 앞에서’를 두고, 각주로 다른 전승 가능성을 표시합니다.
  alternative_readings:
  - 당신 앞에서
  - 본래 자음본문의 직접 읽기인 ‘당신 앞에서’
  rationale: 다윗 언약의 맥락과 제시된 전승 주석을 함께 반영하기 위해, 본문은 전승상 널리 읽히는 형태를 따르고 차이는 각주로 투명하게 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
