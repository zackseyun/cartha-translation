  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord YHWH''; English ''Lord GOD'' avoids the awkward repetition that would result from rendering both elements as ''Lord.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'your words will be true' or 'your words are trustworthy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 주 하나님이시여, 주님은 하나님이십니다. 주님의 말씀은 참되며, 주님께서는 이 좋은 일을 종에게 말씀하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘주 야훼’에 해당하는 복합 호칭입니다. 한국어 본문에서는 반복을 피하려고 ‘주 하나님’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֱמֶת은 ‘진리, 참됨, 신뢰성’의 뜻을 가집니다. 여기서는 ‘참되며’로 옮겨 말씀의 신실성을 함께 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님이시여
  alternatives_korean:
  - 주 야훼이시여
  - 주님 하나님이시여
  - 주 여호와이시여
  lexicon: HALOT
  rationale: 히브리어의 이중 호칭(주 + 야훼)을 한국어에서 자연스럽게 살리되, 반복을 피하기 위해 ‘주 하나님이시여’로 옮겼습니다. ‘야훼’를 본문에 넣는 방식도 가능하지만, 이 문맥의 직접 호칭에서는 ‘주 하나님’이 더 읽기 자연스럽습니다.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  english_pob_choice: you are God
  chosen_korean: 주님은 하나님이십니다
  alternatives_korean:
  - 주님은 하나님이십니다
  - 주님이 하나님이십니다
  - 주님은 그 하나님이십니다
  lexicon: HALOT
  rationale: 강조 구조를 그대로 직역해 ‘주님은 하나님이십니다’로 처리했습니다. ‘그 하나님’은 문법상 가능하지만 한국어에서 다소 부자연스럽고, 본문의 고백적 단정이 약해질 수 있습니다.
- source_word: דְבָרֶיךָ ... אֱמֶת
  english_pob_choice: your words are true
  chosen_korean: 주님의 말씀은 참되며
  alternatives_korean:
  - 주님의 말씀은 진리이며
  - 주님의 말씀은 참입니다
  - 주님의 말씀은 진실하며
  lexicon: HALOT
  rationale: 히브리어의 복수형 ‘말씀들/말씀’과 술어명사 ‘진리’를 함께 살리기 위해 ‘말씀은 참되며’로 옮겼습니다. ‘참입니다’보다 서술적이고, ‘진리’보다 한국어 문장 흐름이 자연스럽습니다.
- source_word: אֶל עַבְדְּךָ
  english_pob_choice: to your servant
  chosen_korean: 종에게
  alternatives_korean:
  - 종에게
  - 주의 종에게
  - 당신의 종에게
  lexicon: HALOT
  rationale: עֶבֶד는 기본적으로 ‘종’이므로, 여기서는 왕이 하나님께 자신을 낮추는 직접적 표현을 살려 ‘종에게’로 옮겼습니다. ‘주의 종’은 관용적으로 자연스럽지만 원문이 가진 단순 호칭을 덧붙여 확장할 수 있어 보수적으로 처리했습니다.
- source_word: הַטּוֹבָה הַזֹּאת
  english_pob_choice: this good thing
  chosen_korean: 이 좋은 일
  alternatives_korean:
  - 이 좋은 일
  - 이 선한 일
  - 이 좋은 것
  lexicon: HALOT
  rationale: 구체적 명사보다 포괄적 표현인 ‘good thing’에 맞추어 ‘이 좋은 일’로 옮겼습니다. 여기서는 방금 하신 약속을 가리키는 문맥이므로 ‘일’이 가장 무난합니다.
theological_decisions:
- issue: 야훼/주 하나님/주님의 말씀의 연결을 한국어에서 어떻게 드러낼 것인가
  chosen_reading: ‘주 하나님이시여’와 ‘주님의 말씀’으로 나누어, 신적 호칭과 말씀의 신뢰성을 동시에 드러냈습니다.
  alternative_readings:
  - ‘주 야훼이시여’로 직접 표기
  - ‘주 여호와이시여’로 전통 교회 용어 사용
  rationale: 이 절은 다윗의 기도적 고백으로, 하나님의 이름을 직접 표기하는 방식보다 한국어 예배 언어의 자연스러운 직호격을 우선하되, 본문이 말하는 하나님의 인격적 신실성을 유지하는 편이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
