  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
  footnotes:
  - marker: a
    text: Or 'your descendant'; Hebrew 'your seed/offspring,' which can function collectively or as a representative singular.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from your inward parts,' an idiom meaning from your own body—that is, your biological offspring.
    reason: cultural_note
translation:
  language: ko
  text: 네 날이 차서 네가 네 조상들과 누울 때, 내가 네 뒤에 네 씨를 일으키리니 — 그것은 네 몸에서 나올 자이며 — 내가 그의 왕국을 세우겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 후손’. 히브리어 ‘네 씨/후손’은 집합적으로도, 대표적 단수로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 내장으로부터’입니다. 여기서는 네 몸에서 나는 생물학적 자손을 뜻하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  english_pob_choice: When your days are fulfilled
  chosen_korean: 네 날이 차서
  alternatives_korean:
  - 네 날이 다하여
  - 네 날이 채워져
  lexicon: HALOT
  rationale: עתיד적 시간절의 의미를 살리면서 히브리어의 ‘날이 차다’ 이미지를 자연스러운 한국어로 옮겼습니다.
- source_word: וְשָׁכַבְתָּ אֶת אֲבֹתֶיךָ
  english_pob_choice: and you lie down with your fathers
  chosen_korean: 네가 네 조상들과 누울 때
  alternatives_korean:
  - 네가 네 조상들과 함께 잠들 때
  - 네가 네 조상들과 함께 죽을 때
  lexicon: HALOT
  rationale: 죽음을 뜻하는 관용구를 직설적으로 풀어쓰지 않고, 원문의 비유를 유지하되 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 자손
  - 네 후손
  - 네 자식
  lexicon: HALOT
  rationale: 히브리어 זֶרַע의 집합적·대표적 의미를 살리기 위해 ‘씨’를 택했습니다. 한국어 교회 용어보다 원문의 종자 이미지를 더 직접적으로 보존합니다.
- source_word: מִמֵּעֶיךָ
  english_pob_choice: from your own body
  chosen_korean: 네 몸에서 나올 자
  alternatives_korean:
  - 네 내장에서 나올 자
  - 네 허리에서 나올 자
  - 네 몸에서 나올 자손
  lexicon: HALOT
  rationale: ‘네 몸에서’라는 신체적 출생의 의미를 분명히 하면서, 현대 한국어에서 지나치게 생소한 ‘내장/허리’ 표현을 피했습니다.
- source_word: מַמְלַכְתּוֹ
  english_pob_choice: his kingdom
  chosen_korean: 그의 왕국
  alternatives_korean:
  - 그의 나라
  - 그의 통치
  lexicon: HALOT
  rationale: מַמְלָכָה의 왕권/왕국 의미를 직접 반영했습니다. 다윗 계열의 왕조 약속이라는 문맥을 분명히 드러냅니다.
theological_decisions:
- issue: זַרְעֲךָ의 범위와 다윗 언약의 후대적 의미
  chosen_reading: ‘네 씨’로 번역해 솔로몬의 직접적 계승과 더 넓은 왕조적/메시아적 가능성을 동시에 열어 둡니다.
  alternative_readings:
  - ‘네 자손’으로 단수적 후계를 분명히 함
  - ‘네 후손’으로 집합적 의미를 약화시켜 일반화함
  rationale: 히브리어 본문은 집합적이면서 대표적 단수로도 읽힐 수 있으므로, 해석을 미리 닫지 않고 원문의 긴장을 유지하는 것이 바람직합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
