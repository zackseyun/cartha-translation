  - 제 집안
  - 제 가족
  lexicon: HALOT
  rationale: 문맥상 단순한 주거보다 다윗의 가문/왕조까지 포괄하지만, 한국어 본문에서는 은유를 유지하기 위해 ‘집’을 살렸습니다.
- source_word: עַד הֲלֹם
  english_pob_choice: this far
  chosen_korean: 여기까지
  alternatives_korean:
  - 이만큼
  - 이 지점까지
  - 이렇게까지
  lexicon: HALOT
  rationale: 현재 시점까지 이르게 하신 하나님의 행위를 자연스러운 현대 한국어로 압축해 표현했습니다.
theological_decisions:
- issue: יהוה와 אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: 본문의 여호와는 ‘여호와’로, 호격 결합은 ‘주 하나님이시여’로 구분해 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주 여호와이시여
  rationale: 이 절은 직접적인 호칭 기도이므로, 본문 내 신명과 호격을 구분해 읽히도록 했습니다. 동시에 한국어 예배 언어의 호격성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: ‘my house’의 범위
  chosen_reading: 본문에는 ‘제 집’을 두어 다윗의 가문/왕조를 암시하게 했습니다.
  alternative_readings:
  - 제 가문
  - 제 왕조
  - 제 집안
  rationale: 사무엘하 7장의 ‘집’은 반복되는 핵심어이므로, 한국어에서도 같은 어휘를 유지해 본문의 문학적·신학적 연결을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5 (consistency of key terms, or documented exception)'
