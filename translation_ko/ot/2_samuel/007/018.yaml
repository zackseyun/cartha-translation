  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
  footnotes:
  - marker: a
    text: Or 'what is my family/household'; 'house' here likely carries the broader sense of David's household and emerging dynasty, echoing the chapter's repeated use of 'house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗 왕이 들어가 야훼 앞에 앉아 말했습니다. “주 야훼시여, 제가 누구이며 제 집이 무엇이기에 주께서 저를 여기까지 이르게 하셨습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 집’은 문자적으로는 집이지만, 이 문맥에서는 다윗의 가문과 왕조를 포함하는 더 넓은 의미를 가질 수 있습니다.
    reason: lexical_alternative
