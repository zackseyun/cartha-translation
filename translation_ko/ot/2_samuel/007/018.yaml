  lexicon: HALOT
  rationale: ישב의 기본 의미를 그대로 살려 물리적으로 ‘앉다’로 옮겼고, לִפְנֵי는 ‘앞에’로 간결하게 표현했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님이시여
  alternatives_korean:
  - 주 여호와여
  - 주 하나님
  lexicon: HALOT
  rationale: 아도나이+יהוה의 결합은 직접 호격으로 옮겨야 하므로, 합쇼체 기도·탄원 어법에 맞는 ‘주 하나님이시여’를 택했습니다.
- source_word: בֵיתִי
  english_pob_choice: my house
  chosen_korean: 제 집
  alternatives_korean:
