  rationale: 문맥상 단순한 주거보다 다윗의 가문/왕조까지 포괄하지만, 한국어 본문에서는 은유를 유지하기 위해 ‘집’을 살렸습니다.
- source_word: עַד הֲלֹם
  english_pob_choice: this far
  chosen_korean: 여기까지
  alternatives_korean:
