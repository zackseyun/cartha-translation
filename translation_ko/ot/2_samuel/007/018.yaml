  lexicon: HALOT
  rationale: בוא의 서사적 이동을 한국어에서 자연스럽게 살리되, 왕호와 이름을 앞에 두어 본문의 서술 흐름을 보존했습니다.
- source_word: וַיֵּשֶׁב לִפְנֵי יְהוָה
  english_pob_choice: sat before Yahweh
  chosen_korean: 여호와 앞에 앉아
  alternatives_korean:
