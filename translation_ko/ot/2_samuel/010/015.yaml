  text: 아람이 이스라엘 앞에서 패배했음을 보고, 함께 모였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아람’은 단수형 고유명사이지만, 여기서는 아람 사람들 전체를 가리키는 집합적 용법입니다.
