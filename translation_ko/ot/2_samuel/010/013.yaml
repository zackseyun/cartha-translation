  rationale: 군사적 문맥에서 단순한 ‘가까이 감’보다 전투를 향한 전진을 드러내는 말로 옮겼습니다.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  english_pob_choice: and the people who were with him
  chosen_korean: 그와 함께한 백성
  alternatives_korean:
  - 그와 함께한 사람들
  - 그와 함께한 군대
  - 그와 함께한 병사들
  lexicon: HALOT
  rationale: 히브리어 עָם의 기본값인 ‘백성’을 살리되, 문맥상 조력 병력을 가리키는 점도 자연스럽게 드러냈습니다.
- source_word: בַּאֲרָם
  english_pob_choice: against Aram
  chosen_korean: 아람과의 전투를 향해
  alternatives_korean:
  - 아람을 향해
  - 아람과 싸우기 위해
  - 아람에 대항하여
  lexicon: HALOT
  rationale: 전치사 구조와 전투 맥락을 함께 반영해, ‘아람을 상대로 한 전투’라는 의미가 드러나도록 했습니다.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  english_pob_choice: they fled before him
  chosen_korean: 그들이 그의 앞에서 도망쳤습니다
  alternatives_korean:
  - 그의 앞에서 달아났습니다
  - 그 앞에서 도망했습니다
  - 그의 면전에서 달아났습니다
  lexicon: HALOT
  rationale: נוּס의 강한 ‘도망치다/달아나다’ 의미를 살리고, 관용구 ‘from before him’을 한국어의 자연스러운 ‘그의 앞에서’로 옮겼습니다.
