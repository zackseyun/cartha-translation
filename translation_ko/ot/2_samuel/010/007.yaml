reference: 2 Samuel 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֖ע דָּוִ֑ד וַ/יִּשְׁלַח֙ אֶת יוֹאָ֔ב וְ/אֵ֥ת כָּל הַ/צָּבָ֖א הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/007.yaml
  text: When David heard[a], he sent Joab and all the army of the mighty men.
  footnotes:
  - marker: a
    text: Or "and all the army of the mighty men"; the Hebrew can be read with "the mighty men" in apposition to "the army" or as a genitival-like specification.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 듣고 요압과 온 군대, 곧 용사들을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “용사들의 온 군대”로도 읽을 수 있습니다. 히브리어는 ‘용사들’이 ‘군대’를 동격으로 설명하는 것으로도, ‘군대’의 소속을 나타내는 식으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: When David heard
  chosen_korean: 다윗이 듣고
  alternatives_korean:
  - 다윗이 들었고
  - 다윗이 들었습니다
  lexicon: HALOT
  rationale: 연속된 서술 동사의 흐름을 살리면서, 한국어에서는 자연스럽게 앞선 상황을 받아 ‘듣고’로 옮겼습니다.
- source_word: וַיִּשְׁלַח
  english_pob_choice: he sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 보내셨습니다
  lexicon: HALOT
  rationale: 전쟁 문맥이지만 기본 동사 의미가 ‘보내다’이므로 직역 성향을 유지했습니다.
- source_word: הַצָּבָא הַגִּבֹּרִים
  english_pob_choice: all the army of the mighty men
  chosen_korean: 온 군대, 곧 용사들
  alternatives_korean:
  - 모든 용사의 군대
  - 온 군대, 곧 용사들의 군대
  - 온 군대, 곧 무사들
  lexicon: HALOT
  rationale: 히브리어는 ‘군대’와 ‘용사들’의 관계가 밀접해, 본문 의미를 풀어 ‘곧’으로 apposition 가능성을 드러냈습니다. ‘용사들’은 전통적 ‘mighty men’을 현대 한국어로 자연스럽게 옮긴 표현입니다.
theological_decisions:
- issue: הַגִּבֹּרִים의 관계를 apposition으로 볼지, 군대의 소속적 수식으로 볼지
  chosen_reading: 본문의 문법적 모호성을 유지하되 한국어에서는 ‘온 군대, 곧 용사들’로 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘용사들의 군대’로 소속 관계를 더 분명히 하기
  - ‘용사들인 온 군대’로 apposition을 더 직접적으로 드러내기
  rationale: 영어 POB도 같은 모호성을 각주로 보존하므로, 한국어 본문에서도 한쪽으로 단정하지 않고 의미 범위를 열어 두는 것이 원문에 충실합니다.
  doctrine_reference: 본문 문법의 애매성 보존
- issue: דָּוִד과 יוֹאָב의 이름 표기
  chosen_reading: 다윗, 요압을 사용했습니다.
  alternative_readings:
  - 데이비드, 조압
  - 다비드, 요아브
  rationale: 성경 인명으로 널리 정착된 한국어 형태를 따르되, 음역보다 독자 인지도를 우선했습니다.
  doctrine_reference: 고유명사 관례
