  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנֻ֨סוּ֙ מִ/פְּנֵ֣י אֲבִישַׁ֔י וַ/יָּבֹ֖אוּ הָ/עִ֑יר וַ/יָּ֣שָׁב יוֹאָ֗ב מֵ/עַל֙ בְּנֵ֣י עַמּ֔וֹן וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the Ammonites' for 'the sons of Ammon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Arameans'; Hebrew 'Aram.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'from against the sons of Ammon' means Joab withdrew from fighting them.
    reason: cultural_note
translation:
  language: ko
  text: 암몬 자손이 아람이 달아난 것을 보고 아비새 앞에서 도망하여 그 성읍으로 들어갔습니다. 그러자 요압은 암몬 자손을 치고 있던 자리에서 물러나 예루살렘으로 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역적 친족 표현을 살리되, 한국어에서는 자연스럽고 성경적 표현인 ‘자손’으로 옮겨 집단명과 계보감을 함께 드러냈습니다.
- source_word: נָס / וַיָּנֻסוּ
  english_pob_choice: had fled / they fled
  chosen_korean: 달아난 것을 보고 / 도망하여
  alternatives_korean:
  - 도망한 것을 보고 / 도망하여
  - 달아난 것을 알아보고 / 달아나
  lexicon: HALOT
  rationale: 연속된 ‘도망’ 동사를 반복해 군사적 패주를 분명히 드러냈고, ‘달아난 것을 보고’로 인과를 자연스럽게 표현했습니다.
- source_word: מִפְּנֵי אֲבִישַׁי
  english_pob_choice: before Abishai
  chosen_korean: 아비새 앞에서
  alternatives_korean:
  - 아비새 앞에서 물러나
  - 아비새의 앞을 피해
  lexicon: HALOT
  rationale: מִפְּנֵי의 ‘~의 앞에서/앞을 향해’라는 방향성과 패퇴의 뉘앙스를 살리기 위해 ‘앞에서’로 옮겼습니다.
- source_word: מֵעַל בְּנֵי עַמּוֹן
  english_pob_choice: from against the sons of Ammon
  chosen_korean: 암몬 자손을 치고 있던 자리에서 물러나
  alternatives_korean:
  - 암몬 자손에게서 물러나
  - 암몬 자손과 맞서 있던 자리에서 물러나
  lexicon: HALOT
  rationale: 단순한 ‘~에게서’보다 전투 중 접전을 그만두고 물러난 뜻이 분명하도록, 영어 POB의 주석이 지적한 의미를 한국어 동작구로 풀어냈습니다.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  english_pob_choice: came to Jerusalem
  chosen_korean: 예루살렘으로 왔습니다
  alternatives_korean:
  - 예루살렘에 이르렀습니다
  - 예루살렘으로 돌아왔습니다
  lexicon: HALOT
  rationale: 히브리어 בוא의 기본적 이동 의미를 살려 자연스러운 서술체로 옮겼고, ‘돌아왔습니다’는 원문에 없는 반복을 피했습니다.
