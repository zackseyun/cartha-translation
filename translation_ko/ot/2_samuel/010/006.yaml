revisions:
- from: 암몬 자손이 자기가 다윗에게 미움을 샀다는 것을 보고, 암몬 자손이 사람을 보내어 벳르홉의 아람 사람들과 소바의 아람 사람들, 곧 보병 이만 명과 마아가 왕의 천 명, 그리고 돕의 사람들[ [b] ] 만이천 명을 고용하였습니다.
  to: 암몬 자손은 자기들이 다윗에게 미움을 사게 되었음을 보고[a], 암몬 자손은 사람을 보내지 않고 벳르홉의 아람 사람들과[b] 소바의 아람 사람들, 곧 보병 이만 명과 마아가 왕과 천 명의 병사, 그리고 돕 사람들[c] 만 이천 명을 고용하였습니다.
  rationale: '원문에 없는 ‘사람’이라는 목적어를 본문에서 제거해야 하지만, 위 수정문에 들어간 ‘사람을 보내지 않고’는 원문의 의미를 부정하는 표현이므로 안전한 최종 수정문은 다음과 같아야 합니다: ‘암몬 자손은 자기들이 다윗에게 미움을 사게 되었음을 보고[a], 암몬 자손은 보내어 벳르홉의 아람 사람들과[b] 소바의 아람 사람들, 곧 보병 이만 명과 마아가 왕과 천 명의 병사, 그리고 돕 사람들[c] 만 이천 명을 고용하였습니다.’ 다만 ‘보내어 고용하였다’는 한국어에서 목적어 없는 ‘보내다’가 다소 어색하므로, 최종 본문은 ‘암몬 자손은 자기들이 다윗에게 미움을 사게 되었음을 보고[a], 벳르홉의 아람 사람들과[b] 소바의 아람 사람들, 곧 보병 이만 명과 마아가 왕과 천 명의 병사, 그리고 돕 사람들[c] 만 이천 명을 고용하였습니다.’로 제시합니다. 히브리어의 וַיִּשְׁלְחוּ는 고용 행위에 수반되는 파견을 뜻하나 목적어가 없으므로, 한국어에서는 별도 동사로 어색하게 재현하기보다 고용 동사에 포괄시키는 것이 무첨가·자연성 양면에서 안전합니다.'
