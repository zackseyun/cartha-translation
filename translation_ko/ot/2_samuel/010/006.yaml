id: 2SA.10.6
reference: 2 Samuel 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
  footnotes:
  - marker: a
    text: Or more literally, 'they had become a stench to David.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Aram'; traditionally 'Syria/Syrians.'
    reason: lexical_alternative
  - marker: c
    text: Or possibly 'Ish-tob,' taken as a place or clan name; here rendered 'the men of Tob.'
    reason: alternative_reading
translation:
  language: ko
  text: 암몬 자손이 자기가 다윗에게 미움을 샀다는 것을 보고, 암몬 자손이 사람을 보내어 벳르홉의 아람 사람들과 소바의 아람 사람들, 곧 보병 이만 명과 마아가 왕의 천 명, 그리고 돕의 사람들[ [b] ] 만이천 명을 고용하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 ‘아람’입니다. 전통적으로는 ‘시리아’로도 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ ... כִּי נִבְאֲשׁוּ בְּדָוִד
  english_pob_choice: saw that they had become odious to David
  chosen_korean: 자기가 다윗에게 미움을 샀다는 것을 보고
  alternatives_korean:
  - 다윗에게 역겨운 존재가 되었다는 것을 보고
  - 다윗에게 악취가 나는 존재가 되었다는 것을 보고
  lexicon: HALOT
  rationale: נבאשׁ의 핵심은 ‘악취가 나다’에서 나온 비유적 의미이지만, 한국어 본문에서는 뜻을 자연스럽게 전달하기 위해 ‘미움을 샀다’로 옮겼습니다. 완곡한 ‘싫어하게 되었다’보다 관계 악화의 강도를 살릴 수 있습니다.
- source_word: אֲרַם בֵּית רְחוֹב / אֲרַם צוֹבָא
  english_pob_choice: the Arameans of Beth-rehob / the Arameans of Zobah
  chosen_korean: 벳르홉의 아람 사람들 / 소바의 아람 사람들
  alternatives_korean:
  - 벳르홉의 시리아 사람들 / 소바의 시리아 사람들
  - 아람-벳르홉 / 아람-소바
  lexicon: HALOT
  rationale: 히브리어의 민족명 אֲרַם을 따르기 위해 ‘아람 사람들’로 옮기고, 지명은 음역하여 본문의 군사 동맹 구성을 보존했습니다.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  english_pob_choice: twenty thousand foot soldiers
  chosen_korean: 보병 이만 명
  alternatives_korean:
  - 이만 명의 보병
  - 이만 명의 도보 병사
  lexicon: HALOT
  rationale: רַגְלִי는 보병을 뜻하므로 한국어 군사 용어로 간결하게 ‘보병’이라 옮겼습니다. 숫자 표현은 자연스러운 어순을 위해 명사 앞에 두었습니다.
- source_word: אִישׁ טוֹב
  english_pob_choice: the men of Tob
  chosen_korean: 돕의 사람들
  alternatives_korean:
  - 이쉬-돕
  - 돕 사람들
  lexicon: HALOT
  rationale: 문맥과 병행구인 1역대상 19:6을 따라 지명/집단명으로 이해하여 ‘돕의 사람들’로 번역했습니다. 이는 인명처럼 보일 수 있는 자음을 본문 문맥으로 해석한 선택입니다.
- source_word: וַיִּשְׂכְּרוּ
  english_pob_choice: hired
  chosen_korean: 고용하였습니다
  alternatives_korean:
  - 용병으로 고용하였습니다
  - 돈을 주고 사들였습니다
  lexicon: HALOT
  rationale: 군사 원조를 금전으로 확보하는 의미를 한국어에서 분명히 드러내되, 영어 ‘hired’와 같은 거래적 뉘앙스를 살리기 위해 ‘고용하다’를 택했습니다.
theological_decisions:
- issue: Aram/‘Syria’ rendering
  chosen_reading: 본문의 אֲרַם은 역사적·언어학적으로 ‘아람’으로 옮기고, 전통적 ‘시리아’는 쓰지 않았습니다.
  alternative_readings:
  - 시리아
  - 시리아 사람들
  rationale: 히브리어 원어의 민족명과 지명 구조를 직접 드러내는 번역이므로, 후대 지리명에 기대는 전통 번역보다 स्रोत-직역을 우선했습니다.
  doctrine_reference: 원문 민족명 보존 원칙
