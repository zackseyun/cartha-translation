  source_fidelity: 초안은 암몬 자손이 다윗에게 관계상 혐오스러운 존재가 되었음을 알아차리고 아람 세력과 마아가 왕 및 돕의 사람들을 고용했다는 기본 의미와 병력 수를 대체로 보존합니다. 그러나 ‘사람을 보내어’는 히브리어에 명시되지 않은 목적어를 보태며, ‘마아가 왕의 천 명’은 원문의 병력 관계를 자연스럽고 정확하게 전달하지 못합니다. ‘돕’ 구절의 본문상 가능한 대안 독법도 주석으로 보존하는 것이 적절합니다.
  naturalness: ‘자기가’는 집단 주어와 호응이 어색하고, ‘마아가 왕의 천 명’은 현대 한국어에서 소유 관계처럼 들립니다. 또한 본문의 각 고용 대상과 병력 수를 병렬적으로 제시하면 더 명료하고 자연스럽습니다. 수정문은 표준어 현대 합쇼체를 유지합니다.
