id: 2SA.10.8
reference: 2 Samuel 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּֽצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הַ/שָּׁ֑עַר וַ/אֲרַ֨ם צוֹבָ֤א וּ/רְחוֹב֙ וְ/אִֽישׁ ט֣וֹב וּ/מַֽעֲכָ֔ה לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
  footnotes:
  - marker: a
    text: Or 'the Ammonites came out.' The Hebrew reads 'the sons of Ammon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and the Arameans of Zobah and Rehob and the men of Ish-tob and Maacah.' The Hebrew אִישׁ טוֹב may be rendered 'men of Tob' or understood as the place-name 'Ish-tob.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 암몬 자손이 나와서 성문 어귀에서 전열을 갖추어 싸웠고, 소바의 아람과 르홉과 도브 사람들과 마아가 사람들은 따로 들에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘암몬의 자손들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이쉬-돕 사람들’로 이해할 수 있습니다. 히브리어 אִישׁ טוֹב은 ‘돕 사람들’로도, 지명 ‘이쉬-돕’으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역형인 ‘sons of Ammon’ 구조를 살리면서도 한국어에서 자연스러운 민족 표지로 옮겼습니다.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  english_pob_choice: drew up for battle
  chosen_korean: 전열을 갖추어 싸웠고
  alternatives_korean:
  - 전투를 위해 진을 갖추었고
  - 싸우기 위해 전열을 짰고
  lexicon: HALOT
  rationale: מִלְחָמָה와 함께 쓰인 군사 관용구로서, 단순히 ‘싸우다’보다 ‘전열을 갖추다’가 배치의 의미를 더 분명히 드러냅니다.
- source_word: פֶּתַח הַשָּׁעַר
  english_pob_choice: at the entrance of the gate
  chosen_korean: 성문 어귀에서
  alternatives_korean:
  - 성문 입구에서
  - 문 어귀에서
  lexicon: HALOT
  rationale: 도시 성문 주변의 전투 배치를 가리키므로, ‘성문 어귀’가 장소감과 간결성을 함께 살립니다.
- source_word: לְבַדָּם בַּשָּׂדֶה
  english_pob_choice: were by themselves in the field
  chosen_korean: 따로 들에 있었습니다
  alternatives_korean:
  - 그들끼리 들에 있었습니다
  - 따로 들판에 있었습니다
  lexicon: HALOT
  rationale: לְבַדָּם의 분리·독립 상태를 ‘따로’로 옮기고, בַּשָּׂדֶה는 군사적 대조를 살리되 과도한 해석을 피하려고 ‘들’로 옮겼습니다.
theological_decisions:
- issue: אִישׁ טוֹב의 처리
  chosen_reading: ‘도브 사람들’로 두어, 본문이 가리키는 지명/집단의 모호성을 그대로 보존했습니다.
  alternative_readings:
  - ‘돕 사람들’
  - ‘이쉬-돕 사람들’
  rationale: 영어 POB도 ‘men of Tob’과 ‘Ish-tob’ 가능성을 함께 남기고 있어, 한국어 본문에서는 한 가지로 단정하지 않고 지명형을 택해 긴장을 보존했습니다.
  doctrine_reference: 본문 비평/해석상 모호성 보존
