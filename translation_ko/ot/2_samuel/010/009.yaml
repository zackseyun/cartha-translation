  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֤ה אֵלָי/ו֙ פְּנֵ֣י הַ/מִּלְחָמָ֔ה מִ/פָּנִ֖ים וּ/מֵֽ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כֹּל֙ בְּחוּרֵ֣י ב/ישראל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
  footnotes:
  - marker: a
    text: Or more formally, 'he chose from all the picked men of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Aram'' refers to the Aramean forces.'
    reason: cultural_note
translation:
  language: ko
  text: 요압은 전투 전선이 자기 앞과 뒤에서 자신을 향해 형성되어 있는 것을 보고, 이스라엘의 모든 정예병 가운데서 뽑아 아람에 맞서도록 배치했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘아람’은 아람 군대를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보아
  - 알고
  lexicon: WLC/HALOT
  rationale: ראה의 기본 의미인 시각적 인식을 살리되, 전투 상황을 파악했다는 뉘앙스를 자연스럽게 드러내기 위해 '보고'로 옮겼습니다.
- source_word: פְּנֵי הַמִּלְחָמָה
  english_pob_choice: the battle line
  chosen_korean: 전쟁이 자기 앞과 뒤에서 맞서 있는 것
  alternatives_korean:
  - 전쟁의 얼굴이
  - 전투선이
  lexicon: WLC/HALOT
  rationale: 직역하면 '전쟁의 얼굴'이지만 군사적 관용구로서 앞선과 포위를 가리키므로, 한국어에서는 전투가 앞뒤에서 압박해 오는 상황을 풀어 담았습니다.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  english_pob_choice: he chose from all the choice men of Israel
  chosen_korean: 이스라엘의 모든 정예병들 가운데서 뽑아
  alternatives_korean:
  - 이스라엘의 모든 선택된 용사들 가운데서 뽑아
  - 이스라엘의 모든 뽑힌 자들 가운데서 뽑아
  lexicon: WLC/HALOT
  rationale: בְּחוּרִים은 선발된 전투 병력을 가리키므로, '정예병들'로 옮겨 선택성과 군사적 성격을 함께 살렸습니다.
- source_word: לִקְרַאת אֲרָם
  english_pob_choice: to meet Aram
  chosen_korean: 아람을 맞서게 배치했습니다
  alternatives_korean:
  - 아람을 맞게 배치했습니다
  - 아람을 대적하도록 배치했습니다
  lexicon: WLC/HALOT
  rationale: לקראת는 단순한 '만나다'보다 전투에서 정면으로 맞서는 뜻이 강하므로, 군사적 문맥을 반영해 '맞서게 배치했습니다'로 번역했습니다.
theological_decisions:
- issue: 아람의 표기
  chosen_reading: 고유명사 אֲרָם은 음역하여 '아람'으로 유지했습니다.
  alternative_readings:
  - 아람 사람들
  - 시리아
  rationale: 본문은 민족·지명적 고유명사를 사용하므로, 후대 지리명이나 설명적 표현보다 원형을 보존하는 것이 source-direct합니다.
  doctrine_reference: 고유명사 처리 원칙
