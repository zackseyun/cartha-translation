base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
  footnotes:
  - marker: a
    text: Or 'in your eyes.'
    reason: lexical_alternative
  - marker: b
    text: '''Comforters'' refers to envoys sent to console Hanun after his father''s death.'
    reason: cultural_note
  - marker: c
    text: Or 'to investigate the city, to spy it out, and to overturn it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 암몬 사람들의 고관들이 그들의 군주 한눈에게 말했습니다. “다윗이 당신에게 위로하는 이들을[b] 보냈다고 해서, 당신이 보기에[a] 당신의 아버지를 공경하는 것이겠습니까? 다윗이 자기 신하들을 당신에게 보낸 것은 그 성을 살펴보고, 정탐하고, 뒤엎기[c] 위한 것이 아니었겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 눈에’.
    reason: lexical_alternative
  - marker: b
    text: ‘위로하는 이들’은 아버지가 죽은 뒤 한눈을 위로하려고 보낸 사자들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그 성을 조사하고, 정탐하고, 뒤엎기 위하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  english_pob_choice: the princes of the Ammonites
  chosen_korean: 암몬 자손의 고관들
  alternatives_korean:
  - 암몬 사람들의 지도자들
  - 암몬 사람들의 방백들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥상 궁정·정치적 지위를 가리키므로 ‘고관들’이 위계와 상황을 자연스럽게 드러냅니다.
- source_word: אֲדֹנֵיהֶם
  english_pob_choice: their lord
  chosen_korean: 그들의 주 한눈
  alternatives_korean:
  - 그들의 주인 한눈
  - 그들의 군주 한눈
  lexicon: HALOT
  rationale: 인간 통치자에 대한 호칭이므로 ‘주’로 옮기되, 인명 ‘한눈’을 붙여 왕족의 호칭임을 살렸습니다.
- source_word: בְּעֵינֶיךָ
  english_pob_choice: in your sight
  chosen_korean: 당신의 눈에
  alternatives_korean:
  - 당신의 보기에
  - 당신의 앞에서
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘눈’이 원문의 관용구를 더 분명히 드러내므로 본문에는 ‘당신의 눈에’를 택했습니다.
- source_word: מְנַחֲמִים
  english_pob_choice: comforters
  chosen_korean: 위로하는 사람들
  alternatives_korean:
  - 위로자들
  - 조문객들
  lexicon: HALOT
  rationale: 죽은 아버지를 애도하도록 보낸 사자들이므로, 기능을 드러내는 ‘위로하는 사람들’이 가장 자연스럽습니다.
- source_word: וּלְהָפְכָהּ
  english_pob_choice: to overthrow it
  chosen_korean: 무너뜨리기 위한
  alternatives_korean:
  - 뒤엎기 위한
  - 전복하기 위한
  lexicon: HALOT
  rationale: 문맥상 도시를 군사적으로 파괴·전복하려는 의도이므로 ‘무너뜨리다’가 현대 한국어에서 가장 선명합니다.
theological_decisions:
- issue: 의도된 수사적 반문 유지
  chosen_reading: 화자가 실제 사실을 진술하는 것이 아니라, 의심과 비난을 담은 반문으로 그대로 옮겼습니다.
  alternative_readings:
  - 평서문처럼 단정적으로 옮기는 방식
  rationale: 본문은 한눈의 조언자들이 제기한 의혹이며, 서술자가 그 판단을 승인하지 않습니다. 따라서 반문의 긴장을 유지해야 합니다.
  doctrine_reference: 서술자와 화자의 관점을 구분하는 번역 원칙
