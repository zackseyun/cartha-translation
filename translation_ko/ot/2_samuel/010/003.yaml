revisions:
- from: 암몬 자손의 고관들이 그들의 주 한눈에게 말하였습니다. “다윗이 왜 당신의 아버지를 당신의 눈에 높이 여깁니까? 당신에게 위로하는 사람들을 보냈기 때문입니까? 다윗이 자기의 종들을 당신에게 보낸 것은 그 성을 살펴보고, 정탐하고, 무너뜨리기 위한 것이 아니었습니까?”[a][b][c]
  to: 암몬 사람들의 고관들이 그들의 군주 한눈에게 말했습니다. “다윗이 당신에게 위로하는 이들을[b] 보냈다고 해서, 당신이 보기에[a] 당신의 아버지를 공경하는 것이겠습니까? 다윗이 자기 신하들을 당신에게 보낸 것은 그 성을 살펴보고, 정탐하고, 뒤엎기[c] 위한 것이 아니었겠습니까?”
  rationale: 원문의 두 수사적 반문을 유지하되, 첫 반문의 ‘…했다고 해서’ 구조를 회복했습니다. ‘당신이 보기에’는 한눈의 평가라는 בְּעֵינֶיךָ의 관용적 기능을 반영합니다. 통치자·궁정 문맥의 용어를 현대 격식체로 정리하고, 각주 표지를 해당 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:07Z'
