id: 2SA.10.16
reference: 2 Samuel 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח הֲדַדְעֶ֗זֶר וַ/יֹּצֵ֤א אֶת אֲרָם֙ אֲשֶׁר֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וַ/יָּבֹ֖אוּ חֵילָ֑ם וְ/שׁוֹבַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
  footnotes:
  - marker: a
    text: That is, from beyond the Euphrates River.
    reason: cultural_note
  - marker: b
    text: Or 'Shobach,' a common alternative transliteration of the name.
    reason: lexical_alternative
  - marker: c
    text: '''Before them'' likely means he was leading them or at their head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하닷에셀이 보내어 강 건너편에 있는 아람 사람들을 끌어내자, 그들이 헬람에 이르렀고, 하닷에셀의 군대 사령관 쇼박도 그들 앞에 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 유브라데 강 건너편을 가리키는 말입니다.
    reason: cultural_note
  - marker: b
    text: ‘쇼박’은 영어권에서 흔한 대체 음역인 ‘Shobach’로도 적습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들 앞에’는 그가 그들을 이끌거나 선두에 섰다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보내어
  alternatives_korean:
  - 보냈고
  - 파견하여
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 잇는 연결형으로 처리하되, 기본 의미인 ‘보내다’를 유지했습니다.
- source_word: וַיֹּצֵא אֶת אֲרָם
  english_pob_choice: brought out the Arameans
  chosen_korean: 아람 사람들을 끌어내자
  alternatives_korean:
  - 아람 사람들을 데려오자
  - 아람 사람들을 이끌어 내자
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 ‘끌어내다’로 옮겨, 하닷에셀이 그들을 전장으로 불러내는 뉘앙스를 반영했습니다.
- source_word: מֵעֵבֶר הַנָּהָר
  english_pob_choice: from beyond the River
  chosen_korean: 강 건너편에 있는
  alternatives_korean:
  - 강 너머에 있는
  - 강을 건너 저편에 있는
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘강 건너편’이므로 이를 살렸고, 영어 POB의 각주처럼 구체적으로는 유브라데 강을 가리키는 표현입니다.
- source_word: וַיָּבֹאוּ חֵילָם
  english_pob_choice: they came to Helam
  chosen_korean: 그들이 헬람에 이르렀고
  alternatives_korean:
  - 그들이 헬람에 왔고
  - 그들은 헬람에 도착했고
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고, 서술형 동사 ‘이르다’로 공식 문체에 맞게 옮겼습니다.
- source_word: וְשׁוֹבַךְ
  english_pob_choice: Shobak
  chosen_korean: 쇼박
  alternatives_korean:
  - 쇼바크
  - 쇼박(쇼바흐)
  lexicon: HALOT
  rationale: 현대 외래어 표기 관행에 맞춰 음역했으며, 영어 POB가 제시한 대체 표기 Shobach는 본문이 아닌 각주에서 처리할 수 있습니다.
theological_decisions:
- issue: לִפְנֵיהֶם의 군사적 위치 표현
  chosen_reading: 그들 앞에 있었습니다
  alternative_readings:
  - 그들 앞에서 이끌고 있었습니다
  - 그들의 선두에 있었습니다
  rationale: 히브리어의 문자적 표현을 유지하되, 군사 문맥상 지휘·선두의 함의를 자연스럽게 드러냈습니다.
  doctrine_reference: 문맥상 서술적 위치 표현
