revisions:
- from: 힘을 내십시오[a], 그리고 우리 백성을 위해, 우리 하나님의 도시들을 위해 우리도 힘을 내어야 합니다[b]. 그리고 야훼께서 그의 눈에 좋은 일을 하시기를 바랍니다.
  to: 힘을 내십시오. 우리 백성과 우리 하나님의 성읍들을 위해 우리도 힘을 냅시다[a]. 야훼께서 보시기에 좋은 일을 하시기를 바랍니다[b].
  rationale: The revision restores the cohortative force with ‘우리도 힘을 냅시다,’ uses the idiomatic biblical term ‘성읍들,’ and relocates both notes to the Hebrew forms they explain. ‘보시기에 좋은 일’ is a natural Korean rendering of the Hebrew idiom while preserving its reference to Yahweh’s own judgment.
