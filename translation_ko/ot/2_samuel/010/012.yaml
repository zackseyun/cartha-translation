source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
  footnotes:
  - marker: a
    text: Or 'and let us be strong' or 'and let us strengthen ourselves.' The Hebrew verb is reflexive and carries the sense of showing strength or strengthening oneself.
    reason: lexical_alternative
  - marker: b
    text: Or 'and the LORD will do what is good in his eyes.' The Hebrew form may be read as a simple future, though here it is rendered as a wish of submission to the LORD's will.
    reason: alternative_reading
translation:
  language: ko
  text: 힘을 내십시오[a], 그리고 우리 백성을 위해, 우리 하나님의 도시들을 위해 우리도 힘을 내어야 합니다[b]. 그리고 야훼께서 그의 눈에 좋은 일을 하시기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 반사형으로, ‘강해지다’보다는 ‘스스로 힘을 내다/힘을 내다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단순 미래로도 읽을 수 있으나, 여기서는 야훼의 뜻에 자신을 맡기는 소망의 어조로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  english_pob_choice: Be strong
  chosen_korean: 힘을 내십시오
  alternatives_korean:
  - 강해지십시오
  - 용기를 내십시오
  lexicon: HALOT
  rationale: 직접적인 2인칭 남성 단수 명령형으로서의 격려를 한국어 합쇼체로 자연스럽게 옮겼습니다. 전투 직전의 권면이라는 문맥상 ‘힘을 내십시오’가 가장 간결하고 자연스럽습니다.
- source_word: וְנִתְחַזַּק
  english_pob_choice: and let us be strong
  chosen_korean: 그리고 우리도 힘을 내어야 합니다
  alternatives_korean:
  - 그리고 우리도 강해져야 합니다
  - 그리고 우리도 스스로를 강하게 해야 합니다
  lexicon: HALOT
  rationale: hitpael의 반사·자기격려 뉘앙스를 살리되, 한국어에서 어색한 직역 대신 공동체적 결의로 읽히는 표현을 택했습니다. ‘우리도 힘을 내어야 합니다’는 반사성을 완전히 지우지 않으면서도 문맥에 맞습니다.
- source_word: בְּעַד עַמֵּנוּ וּבְעַד עָרֵי אֱלֹהֵינוּ
  english_pob_choice: for our people and for the cities of our God
  chosen_korean: 우리 백성을 위해, 우리 하나님의 도시들을 위해
  alternatives_korean:
  - 우리 백성을 위하여, 우리 하나님의 성읍들을 위하여
  - 우리 국민을 위해, 우리 하나님의 도시들을 위해
  lexicon: HALOT
  rationale: בְּעַד의 ‘위하여/위해’ 의미를 살려 반복 구조를 유지했습니다. עַמֵּנוּ는 군대가 아니라 ‘백성’이 기본 뜻이므로 그렇게 옮기고, עָרֵי אֱלֹהֵינוּ는 속격 구조를 보존해 ‘우리 하나님의 도시들’로 옮겼습니다.
- source_word: וַיהוָה יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  english_pob_choice: may Yahweh do what is good in his eyes
  chosen_korean: 야훼께서 그의 눈에 좋은 일을 하시기를 바랍니다
  alternatives_korean:
  - 야훼께서 그의 눈에 좋다고 여겨지는 일을 하시기를 바랍니다
  - 주님께서 보시기에 좋은 일을 하시기를 바랍니다
  lexicon: HALOT
  rationale: 신적 이름 יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다. ‘הַטּוֹב בְּעֵינָיו’는 관용적으로 ‘그의 눈에 좋은 일’로 살려, 하나님의 주권적 선호를 과도하게 풀지 않았습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - LORD
  rationale: 원문에 직접 나타난 언약 이름을 보존하기 위해 음역형 ‘야훼’를 사용했습니다. 이는 본 프로젝트의 표준 용례와도 일치합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
- issue: 문장 끝의 yiqtol를 간구/소망으로 처리
  chosen_reading: ‘야훼께서 … 하시기를 바랍니다’
  alternative_readings:
  - ‘야훼께서 … 하실 것입니다’
  - ‘야훼께서 … 하십시오’
  rationale: 문맥상 전투를 앞둔 신뢰와 위탁의 어조이므로, 단순 미래보다 소망·위탁의 뉘앙스를 살리는 것이 적절합니다.
  doctrine_reference: English POB note on yiqtol as wish/submission
