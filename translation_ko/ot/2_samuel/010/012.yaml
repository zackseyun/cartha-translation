    text: 히브리어 동사는 단순 미래로도 읽을 수 있습니다. 여기서는 야훼의 뜻에 자신을 맡기는 소망의 어조로 옮겼습니다.
    reason: alternative_reading
  revision_rationale: The revision restores the cohortative force with ‘우리도 힘을 냅시다,’ uses the idiomatic biblical term ‘성읍들,’ and relocates both notes to the Hebrew forms they explain. ‘보시기에 좋은 일’ is a natural Korean rendering of the Hebrew idiom while preserving its reference to Yahweh’s own judgment.
