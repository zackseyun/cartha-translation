source:
  edition: WLC
  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: ko
  text: 그때 하닷에셀의 종들인 모든 왕들이 그들이 이스라엘 앞에서 패배한 것을 보았습니다. 그래서 그들은 이스라엘과 화친하고 그들을 섬겼습니다. 그러자 아람은 다시는 암몬 자손을 구원하려 하지 않았습니다.
  philosophy: formal
lexical_decisions:
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 신하들
  - 시종들
  - 종
  lexicon: Heb. עֶבֶד / עַבְדֵי
  rationale: 하닷에셀에게 속한 관계를 나타내는 말이므로 ‘신하들’보다 종속성과 소속을 더 직접적으로 드러내는 ‘종들’이 적절합니다.
- source_word: וַיַּשְׁלִמוּ
  english_pob_choice: they made peace
  chosen_korean: 화친하고
  alternatives_korean:
  - 평화를 이루고
  - 평화 조약을 맺고
  - 평화롭게 하고
  lexicon: Heb. שׁלם
  rationale: 동사의 어근은 단순한 정서적 평화보다 적대 관계의 종결과 화평의 성립을 가리키므로, ‘화친하다’가 본문의 외교적 의미를 가장 간결하게 살립니다.
- source_word: וַיַּעַבְדוּם
  english_pob_choice: served them
  chosen_korean: 그들을 섬겼습니다
  alternatives_korean:
  - 그들에게 복종했습니다
  - 그들의 종이 되었습니다
  lexicon: Heb. עבד
  rationale: 앞선 ‘종들’과 어근이 연결되지만 여기서는 새 종속 관계의 형성을 말하므로, 직접적이고 중립적인 ‘섬기다’가 문맥에 맞습니다.
- source_word: לְהוֹשִׁיעַ
  english_pob_choice: to save
  chosen_korean: 구원하려 하지 않았습니다
  alternatives_korean:
  - 도우려 하지 않았습니다
  - 구출하려 하지 않았습니다
  lexicon: Heb. יָשַׁע
  rationale: POB의 수정에서 ‘to save’를 유지했으므로, 단순 지원보다 구출·구원의 적극성을 반영하는 ‘구원하다’를 살렸습니다.
theological_decisions:
- issue: 아람의 반응 표현
  chosen_reading: ‘다시는 … 구원하려 하지 않았습니다’로 번역해, 군사적 원조 포기의 결과를 분명히 했습니다.
  alternative_readings:
  - ‘도우려 하지 않았습니다’
  - ‘구출하려 하지 않았습니다’
  rationale: לְהוֹשִׁיעַ는 단순한 도움보다 위기에서 건져내는 의미가 강하므로, 본문이 말하는 아람의 후퇴를 더 정확히 드러냅니다.
  doctrine_reference: 서사 본문 해석의 정확성
