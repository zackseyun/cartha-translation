  to: 그 일이 다윗에게 알려지자, 그는 온 이스라엘을 모아 요단 강을 건너 헬람에 이르렀습니다. 그러자 아람이 다윗에게 맞서 전열을 갖추고 그와 싸웠습니다.
  rationale: 전투 배치의 대상인 다윗을 나타내는 조사를 ‘을’에서 ‘에게’로 바로잡았습니다. 그 밖의 표현은 원문의 서술 순서, 집합명사 ‘아람’, 그리고 עִם을 사용한 전투 관용구의 의미를 적절히 보존하므로 유지했습니다.
