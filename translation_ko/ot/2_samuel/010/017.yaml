id: 2SA.10.17
reference: 2 Samuel 10:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
  footnotes:
  - marker: a
    text: Or 'and fought against him.' The Hebrew literally says 'fought with him,' an idiom for engaging in battle with an opponent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일이 다윗에게 알려지자, 그는 온 이스라엘을 모아 요단 강을 건너 헬람에 이르렀습니다. 그러자 아람이 다윗을 맞서 전열을 갖추고 그와 싸웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  english_pob_choice: When it was reported to David
  chosen_korean: 그 일이 다윗에게 알려지자
  alternatives_korean:
  - 다윗에게 보고되자
  - 다윗이 그 말을 듣자
  lexicon: HALOT
  rationale: 사역 없는 피동적 보고를 자연스럽게 살리면서, 누가 전했는지 밝히지 않는 히브리어의 비인칭성을 유지했습니다.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  english_pob_choice: he gathered all Israel
  chosen_korean: 온 이스라엘을 모아
  alternatives_korean:
  - 온 이스라엘을 집결시켜
  - 온 이스라엘을 불러모아
  lexicon: HALOT
  rationale: '''모으다/소집하다''의 뜻을 살리되, 히브리어가 ''이스라엘'' 전체를 포괄적으로 말하는 점을 반영했습니다.'
- source_word: וַיַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד
  english_pob_choice: Then Aram drew up in battle formation to meet David
  chosen_korean: 그러자 아람이 다윗을 맞서 전열을 갖추고
  alternatives_korean:
  - 그러자 아람이 다윗을 향해 전열을 갖추고
  - 그러자 아람이 다윗과 맞서 진을 치고
  lexicon: HALOT
  rationale: עָרַךְ의 군사적 의미를 '전열을 갖추다'로 옮겨 전투 배치를 분명히 했고, לִקְרַאת의 대립적 뉘앙스를 '맞서'로 드러냈습니다.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  english_pob_choice: and fought with him
  chosen_korean: 그와 싸웠습니다
  alternatives_korean:
  - 그와 전투를 벌였습니다
  - 그를 상대로 싸웠습니다
  lexicon: HALOT
  rationale: '''함께''로 오해될 수 있는 직역형을 피하면서, POB가 밝힌 대로 적대적 전투 관계를 한국어에서 자연스럽게 표현했습니다.'
theological_decisions:
- issue: 전투 서술의 방향성(עִמּוֹ vs 'against')
  chosen_reading: 문맥상 적대적 의미를 분명히 하되, 본문에 없는 'against'에 해당하는 해석어를 과도하게 덧붙이지 않고 '그와 싸웠습니다'로 옮겼습니다.
  alternative_readings:
  - 그를 대항하여 싸웠습니다
  - 그와 맞서 싸웠습니다
  rationale: 히브리어 관용구가 전투 상대를 뜻함은 분명하지만, 서술의 압축성과 직접성을 보존하는 편이 본문에 더 가깝습니다.
  doctrine_reference: Narrative fidelity / idiom preservation
