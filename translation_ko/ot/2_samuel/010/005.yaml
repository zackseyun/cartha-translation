base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
  footnotes:
  - marker: a
    text: Or 'deeply ashamed' or 'very disgraced.' The Hebrew term emphasizes being publicly shamed or humiliated.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'he sent to meet them'; the text implies that David sent representatives, but does not explicitly say 'messengers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 다윗에게 알리자, 그는 그들을 맞이하러 사람을 보냈습니다. 그 사람들이 매우 수치를 당하였기 때문입니다. 왕이 말했습니다. “여리고에 머물러 있다가 너희 수염이 자랄 때까지 있다가, 그 뒤에 돌아오십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수치를 당하다’는 히브리어가 담고 있는 공개적 모욕과 명예 훼손의 강한 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을 맞이하러 사람을 보냈습니다’는 ‘보내어 맞이하게 하다’는 관용구를 풀어 옮긴 것으로, 본문은 파견된 사람을 명시하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  english_pob_choice: they told
  chosen_korean: 알리자
  alternatives_korean:
  - 말하자
  - 보고하자
  lexicon: HALOT
  rationale: 히필 נגד의 기본 의미인 ‘알리다/전하다’를 자연스러운 서술로 옮겼습니다.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  english_pob_choice: he sent to meet them
  chosen_korean: 그들을 맞이하러 사람을 보냈습니다
  alternatives_korean:
  - 그들을 만나게 하려고 보냈습니다
  - 그들을 맞이하도록 사람을 보냈습니다
  lexicon: HALOT
  rationale: 직역하면 ‘맞이하러 보냈다’가 문맥상 자연스럽고, 영어 POB처럼 ‘보낸 대상’은 명시하지 않되 파생적으로 ‘사람’을 보완했습니다.
- source_word: נִכְלָמִים מְאֹד
  english_pob_choice: greatly humiliated
  chosen_korean: 매우 수치를 당하였기 때문입니다
  alternatives_korean:
  - 크게 부끄러움을 당하였기 때문입니다
  - 심히 수치스러워하였기 때문입니다
  lexicon: HALOT
  rationale: כָּלַם의 수동적 의미는 단순한 내적 ‘부끄러움’보다 공개적으로 ‘수치를 당함’이 더 정확합니다.
- source_word: שְׁבוּ בִירֵחוֹ
  english_pob_choice: Stay at Jericho
  chosen_korean: 여리고에 머물러
  alternatives_korean:
  - 여리고에 머무십시오
  - 여리고에 계속 있으십시오
  lexicon: HALOT
  rationale: ישׁב의 명령형을 임시 체류의 뜻인 ‘머물다’로 옮겼고, 도시명은 장소 부사구로 자연스럽게 처리했습니다.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  english_pob_choice: until your beards have grown
  chosen_korean: 너희 수염이 자랄 때까지
  alternatives_korean:
  - 너희 수염이 다시 자랄 때까지
  - 너희 수염이 자라날 때까지
  lexicon: HALOT
  rationale: צמח의 ‘자라다/돋다’ 의미를 반영했고, 본문은 단순히 ‘다시’ 자란다고 명시하지 않으므로 그 표현은 넣지 않았습니다.
- source_word: וְשַׁבְתֶּם
  english_pob_choice: and then return
  chosen_korean: 그 뒤에 돌아오십시오
  alternatives_korean:
  - 그리고 돌아오십시오
  - 그 후에 돌아오십시오
  lexicon: HALOT
  rationale: 시간 순서를 살리되, 한국어 명령문으로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 왕의 직접 명령의 한국어 높임말 수준
  chosen_reading: 서술문은 합쇼체로, 왕의 직접 발화는 평서형 명령과 공손한 종결형을 섞어 현대적 문어체로 유지했습니다.
  alternative_readings:
  - 직접명령형만 일괄 사용
  - 더 전통적인 성경체로 격상
  rationale: 히브리어 원문의 왕권적 발화를 과장하지 않으면서도 한국어 독자에게 자연스러운 문체를 유지하기 위함입니다.
  doctrine_reference: 문체/등록 결정
- issue: 수치/모욕의 의미 강도
  chosen_reading: ‘부끄러움’보다 ‘수치를 당함’을 택해 공개적 모욕의 뉘앙스를 보존했습니다.
  alternative_readings:
  - 부끄러워하였다
  - 몹시 창피하였다
  rationale: 문맥은 내면 감정보다 공적 수치화에 초점이 있으므로, 본문의 사회적·명예적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 수치-명예 담론
