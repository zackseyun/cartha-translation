base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
  footnotes:
  - marker: a
    text: Or 'deeply ashamed' or 'very disgraced.' The Hebrew term emphasizes being publicly shamed or humiliated.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'he sent to meet them'; the text implies that David sent representatives, but does not explicitly say 'messengers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 다윗에게 알리자, 그는 그들을 맞이하도록 보냈습니다. 그 사람들이 매우 수치를 당했기 때문입니다.[a] 왕이 말했습니다. “여리고에 머물러 너희 수염이 자랄 때까지 기다렸다가, 그 뒤에 돌아오십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수치를 당하다’는 히브리어가 담고 있는 공개적 모욕과 명예 훼손의 강한 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을 맞이하도록 보냈습니다’는 히브리어의 ‘그들을 맞이하러 보냈다’라는 표현을 자연스럽게 옮긴 것입니다. 본문은 파견된 사람을 명시하지 않습니다.
    reason: lexical_alternative
