lexical_decisions:
- source_word: וַֽיְהִי אַֽחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일이 있은 후에
  alternatives_korean:
  - 그 후에
  - 그 일이 있은 뒤에
  lexicon: אַחֲרֵי כֵן
  rationale: 히브리어 관용구를 시간 순서만 드러내는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  english_pob_choice: the king of the Ammonites
  chosen_korean: 암몬 자손의 왕
  alternatives_korean:
  - 암몬 사람들의 왕
  - 암몬 족속의 왕
  lexicon: מֶלֶךְ + בְּנֵי עַמּוֹן
  rationale: בְּנֵי עַמּוֹן은 집합적 혈연 표현이므로, 본문 의미를 살려 ‘암몬 자손’으로 옮겼습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: became king in his place
  chosen_korean: 그 자리를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 뒤를 이어 다스렸습니다
  - 그를 대신하여 왕이 되었습니다
  lexicon: וַיִּמְלֹךְ ... תַּחְתָּיו
  rationale: 직접적인 통치 개시를 나타내는 동사를 ‘왕이 되다’로, 대체 관계를 ‘그 자리를 이어’로 드러냈습니다.
