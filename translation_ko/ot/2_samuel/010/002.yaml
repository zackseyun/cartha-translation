base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
  footnotes:
  - marker: a
    text: Or 'to console him about his father.' The Hebrew expression likely refers to offering condolences over his father's death.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. “나는 나하스의 아들 한눈에게 은혜를 베풀겠습니다. 그의 아버지가 내게 은혜를 베푼 것과 같이 말입니다.” 그래서 다윗은 그의 종들의 손을 통해 그를 그의 아버지에 관해 위로하려고 사람을 보냈고, 다윗의 종들은 암몬 자손의 땅에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘위로하려고’는 문맥상 아버지의 죽음에 대한 조문과 애도의 뜻을 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: kindness
  chosen_korean: 은혜를 베풀겠습니다
  alternatives_korean:
  - 자비를 베풀겠습니다
  - 친절을 베풀겠습니다
  - 신의를 보이겠습니다
  lexicon: HALOT
  rationale: 이 절의 חֶסֶד는 정치적·관계적 호의로 쓰였으므로, 전형적 교회어휘인 ‘인애’보다 관계적 호의와 베풂을 드러내는 ‘은혜를 베풀다’가 원문의 기능을 잘 살립니다.
- source_word: עָשָׂה ... חֶסֶד
  english_pob_choice: showed kindness
  chosen_korean: 은혜를 베푼 것
  alternatives_korean:
  - 친절을 보인 것
  - 자비를 베푼 것
  - 신의를 나타낸 것
  lexicon: HALOT
  rationale: 히브리어 동사+명사 결합을 한국어에서도 자연스러운 서술로 옮기되, 반복되는 חֶסֶד의 대응을 유지하기 위해 같은 표현을 사용했습니다.
- source_word: בְּיַד עֲבָדָיו
  english_pob_choice: sent by the hand of his servants
  chosen_korean: 그의 종들의 손을 통해
  alternatives_korean:
  - 그의 종들을 통해
  - 그의 종들의 손으로
  - 그의 종들을 보내어
  lexicon: HALOT
  rationale: ‘손을 통해’는 히브리어 관용구의 매개·대리 의미를 드러내며, POB의 ‘by the hand of’라는 주석적 정확성을 한국어로 보존합니다.
- source_word: לְנַחֲמוֹ ... אֶל אָבִיו
  english_pob_choice: to comfort him concerning his father
  chosen_korean: 그를 그의 아버지에 관해 위로하려고
  alternatives_korean:
  - 그의 아버지에 대해 위로하려고
  - 아버지의 일로 위로하려고
  - 아버지의 죽음에 대해 조문하려고
  lexicon: HALOT
  rationale: 문맥상 단순 위로가 아니라 아버지의 죽음에 대한 조문/애도의 성격이 있으나, 본문 자체가 이를 명시적으로 풀어 말하지 않으므로 ‘관해 위로하다’로 절제했습니다.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  english_pob_choice: the land of the Ammonites
  chosen_korean: 암몬 자손의 땅
  alternatives_korean:
  - 암몬 사람들의 땅
  - 암몬인의 땅
  - 암몬 자손들의 땅
  lexicon: HALOT
  rationale: 히브리어 בני עמון을 직역하면 ‘암몬 자손’이며, 이 사료적 표현을 유지하는 편이 본문의 민족명 구조를 더 분명히 보여 줍니다.
theological_decisions:
- issue: לְנַחֲמוֹ와 조문 의미의 범위
  chosen_reading: 본문은 한눈의 아버지에 대해 위로/애도를 전하려는 외교적 사절 파견으로 읽고, 장례 조문으로 단정하지는 않았습니다.
  alternative_readings:
  - 장례 조문을 위한 사절 파견
  - 단순 위로 방문
  rationale: 히브리어 נחם은 상황상 애도 위로를 뜻할 가능성이 크지만, 본문이 죽음을 직접 서술하지 않으므로 문맥적 가능성은 주석에만 남기고 번역문은 과도하게 해석하지 않았습니다.
  doctrine_reference: 문맥 우선의 역사서 번역 원칙
- issue: 다윗의 חֶסֶד 표현
  chosen_reading: 다윗의 행위는 개인적 친절을 넘어 외교적 호의이지만, 본문이 언약 용어로 고정하지 않으므로 ‘은혜를 베풀다’로 번역했습니다.
  alternative_readings:
  - 언약적 인애
  - 충성스러운 호의
  - 친절
  rationale: 이 절은 상호 호의의 정치적 맥락이 강해 ‘언약적 인애’로 좁히면 의미를 과잉신학화할 수 있습니다.
  doctrine_reference: 히브리어 חֶסֶד의 문맥적 의미
