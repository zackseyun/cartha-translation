revisions:
- from: 다윗이 말했습니다. “나는 나하스의 아들 한눈에게 은혜를 베풀겠습니다. 그의 아버지가 내게 은혜를 베푼 것과 같이 말입니다.” 그래서 다윗은 그의 종들의 손을 통해 그를 그의 아버지에 관해 위로하려고 사람을 보냈고, 다윗의 종들은 암몬 자손의 땅에 이르렀습니다.[a]
  to: 다윗이 말했습니다. “나는 나하스의 아들 하눈에게 호의를 베풀겠습니다. 그의 아버지가 내게 호의를 보인 것처럼 말입니다.” 그래서 다윗은 그의 아버지의 일로 그를 위로하려고[a] 자기 종들을 보내었습니다. 다윗의 종들은 암몬 사람들의 땅에 이르렀습니다.
  rationale: 인명 오기를 바로잡고, 사절을 보내는 행위를 원문대로 ‘자기 종들을 보내었습니다’로 명시했습니다. חֶסֶד의 상호적·외교적 성격은 ‘호의’로 일관되게 옮겼습니다. 아버지의 죽음은 본문이 직접 진술하지 않으므로 번역문에 단정적으로 넣지 않고, נחם의 문맥적 함의를 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:37:06Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 인명 חָנוּן은 통상 ‘하눈’으로 옮겨야 하며, ‘한눈’은 오기입니다. 또한 וַיִּשְׁלַח ... בְּיַד עֲבָדָיו는 다윗이 자신의 종들을 대리인으로 보내었다는 뜻인데, 초안의 ‘사람을 보냈고’는 원문에 없는 일반 명사를 보태고 종들을 보내는 행위를 불분명하게 합니다. ‘그의 아버지의 일로 그를 위로하려고’는 אֶל אָבִיו의 관계를 자연스럽게 보존하며, 아버지의 죽음은 문맥상 강하게 시사되지만 본문에 명시되지 않았으므로 각주에만 남겼습니다.
  naturalness: ‘그의 종들의 손을 통해’와 ‘그의 아버지에 관해 위로하려고’는 현대 표준 한국어 문장으로 어색합니다. ‘자기 종들을 보내어’ 및 ‘그의 아버지의 일로 그를 위로하려고’가 합쇼체 서술 속에서 자연스럽습니다. 민족명은 ‘암몬 사람들의 땅’이 일반 독자에게 가장 자연스럽고 의미도 충분히 보존합니다.
  terminology: חֶסֶד는 이 외교적 상호 관계에서 신학적으로 특수화된 ‘은혜’보다 ‘호의’가 적절합니다. 두 용례를 ‘호의를 베풀다/호의를 보이다’로 대응시켜 반복을 유지했습니다. ‘하눈’, ‘나하스’, ‘암몬’은 통용되는 성서 인명·지명 표기를 따랐습니다.
  issues:
  - severity: high
    issue: 인명 ‘한눈’
    rationale: חָנוּן(Hanun)의 표준 한국어 음역은 ‘하눈’입니다. ‘한눈’은 다른 일반어와도 겹치며 인명 표기로 부정확합니다.
  - severity: medium
    issue: ‘사람을 보냈고’라는 추가 표현
    rationale: 원문은 다윗이 ‘자기 종들의 손으로’, 곧 종들을 대리인으로 보내었다고 합니다. ‘사람’은 원문에 없고, 종들이 사절이라는 핵심을 흐립니다.
  - severity: medium
    issue: חֶסֶד를 ‘은혜’로 번역
    rationale: ‘은혜’는 현대 한국어 성서 문맥에서 신적 은총 또는 상하 관계의 베풂을 강하게 연상시킬 수 있습니다. 여기서는 상호적인 외교·관계적 호의이므로 ‘호의’가 더 중립적이고 정확합니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주는 ‘위로’의 문맥적 의미를 설명하므로 절 끝이 아니라 해당 표현 바로 뒤에 두는 편이 앵커가 명확합니다.
