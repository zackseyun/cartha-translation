id: 2SA.10.10
reference: 2 Samuel 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
  footnotes:
  - marker: a
    text: 'Or ''the Ammonites.'' Hebrew: ''the sons of Ammon.'''
    reason: lexical_alternative
  - marker: b
    text: Literally 'gave into the hand of Abishai,' an idiom for entrusting troops to his authority.
    reason: lexical_alternative
  - marker: c
    text: Or 'he arranged them' / 'he set the battle line.' The Hebrew verb refers to drawing up troops in battle formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 남은 백성은 그의 형제 아비새의 손에 맡기고, 그가 그들을 암몬 자손과 맞서도록 전열을 갖추었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 사람들’. 히브리어는 ‘암몬의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아비새의 손에 주었다’로, 군대를 그의 권한 아래 맡겼다는 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 그들을 배치하였습니다’ / ‘그가 전열을 세웠습니다’. 히브리어 동사는 전투 대형으로 정렬하는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  english_pob_choice: the rest of the people
  chosen_korean: 남은 백성
  alternatives_korean:
  - 남은 사람들
  - 나머지 군대
  - 남은 군사들
  lexicon: HALOT
  rationale: יֶתֶר는 ‘남은 것, 나머지’를 뜻하고, הָעָם은 문자적으로 ‘백성’이지만 여기서는 전투에 참여할 남은 집단을 가리키므로 한국어에서는 간결하게 ‘남은 백성’으로 옮겼습니다.
- source_word: נָתַן בְּיַד
  english_pob_choice: put under the command of
  chosen_korean: …의 손에 맡기다
  alternatives_korean:
  - …의 지휘 아래 두다
  - …에게 넘겨 맡기다
  - …의 손에 주다
  lexicon: HALOT
  rationale: 문자적으로는 ‘손에 주다’이지만, 전투 지휘를 위탁하는 관용구이므로 한국어에서도 소유·통제의 이미지를 살린 ‘손에 맡기다’로 처리했습니다.
- source_word: וַיַּעֲרֹךְ
  english_pob_choice: he drew them up
  chosen_korean: 전열을 갖추었습니다
  alternatives_korean:
  - 그들을 배치하였습니다
  - 그들을 전투 대형으로 세웠습니다
  - 그가 그들을 정렬하였습니다
  lexicon: HALOT
  rationale: 군사 문맥의 ערך는 ‘전열을 짜다, 전투 대형을 갖추다’의 뜻이므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘전열을 갖추다’를 선택했습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬의 아들들
  - 암몬 사람들
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘암몬의 아들들’이지만, 성경 한국어에서 익숙하면서도 원문 구조를 비교적 잘 보존하는 ‘암몬 자손’을 사용했습니다.
