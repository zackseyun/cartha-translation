base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
  footnotes:
  - marker: a
    text: Or 'up to their seat' or 'up to their private area'; the Hebrew term is rare, and the exact anatomical reference is debated. The sense is that Hanun exposed them shamefully by cutting their garments very short.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 하눈이 다윗의 종들을 붙들고 그들의 수염 반을 깎고 그들의 옷을 가운데서 — 곧 엉덩이까지 — 잘라 버린 뒤 그들을 돌려보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 희귀한 신체 지시어는 정확한 해부학적 대상을 단정하기 어렵지만, 문맥상 공적 수치를 드러내기 위해 옷을 매우 짧게 잘랐다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: עַבְדֵי דָוִד
  english_pob_choice: David’s servants
  chosen_korean: 다윗의 종들
  alternatives_korean:
  - 다윗의 신하들
  - 다윗의 종/신하들
  lexicon: HALOT
  rationale: עבד는 문맥에 따라 ‘종’, ‘노예’, ‘신하’로 갈 수 있지만, 이들은 다윗의 공식 사절로서도 왕의 소속 인물로 이해되므로 ‘종들’이 원문과 POB의 기본 선택을 가장 직접적으로 반영합니다.
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 붙들고
  alternatives_korean:
  - 데려가고
  - 잡고
  lexicon: HALOT
  rationale: 이 서사에서 단순한 ‘취하다’보다 상대를 강제로 붙잡아 모욕을 가하는 뉘앙스가 드러나므로, 문맥상 ‘붙들고’가 자연스럽습니다.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  english_pob_choice: shaved off half of their beards
  chosen_korean: 그들의 수염 반을 깎고
  alternatives_korean:
  - 그들의 수염 절반을 깎고
  - 그들의 수염의 반을 밀어 버리고
  lexicon: HALOT
  rationale: ‘깎다’는 면도·삭발의 의미를 모두 포괄하면서도 수염을 절반만 제거하는 수치를 분명하게 드러냅니다.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי עַד שְׁתוֹתֵיהֶם
  english_pob_choice: cut off their garments in the middle up to their buttocks
  chosen_korean: 그들의 옷을 가운데서 — 곧 엉덩이까지 — 잘라 버린 뒤
  alternatives_korean:
  - 그들의 옷을 가운데서 — 곧 엉덩이까지 — 끊어 버린 뒤
  - 그들의 옷을 가운데서 — 곧 엉덩이 부위까지 — 잘라 버린 뒤
  lexicon: HALOT
  rationale: 희귀한 신체 지시어 שְׁתוֹתֵיהֶם는 POB의 주석처럼 정확한 해부학적 범주가 불확실하지만, 공개적 수치를 분명히 해야 하므로 ‘엉덩이까지’로 옮겼습니다.
- source_word: וַיְשַׁלְּחֵם
  english_pob_choice: sent them away
  chosen_korean: 그들을 돌려보냈습니다
  alternatives_korean:
  - 그들을 보내 버렸습니다
  - 그들을 떠나보냈습니다
  lexicon: HALOT
  rationale: 상대에게 모욕을 준 뒤 되돌려 보내는 동작을 한국어 서사체로 자연스럽게 전달합니다.
theological_decisions:
- issue: 공개적 수치와 모욕의 강도
  chosen_reading: 옷을 ‘가운데서 — 곧 엉덩이까지 — 잘라’ 공개적으로 수치심을 주는 장면으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘아랫부분까지 잘라’로 완화하기
  - 신체 노출을 약하게 처리하기
  rationale: 원문과 POB 주석은 단순한 절단이 아니라 공개적 수치와 모욕을 강조하므로, 그 긴장을 약화하지 않는 표현을 유지했습니다.
  doctrine_reference: 문맥적 서술의 직역성과 성적/사회적 수치 표현의 보존
