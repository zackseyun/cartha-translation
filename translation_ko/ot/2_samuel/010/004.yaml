  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
  footnotes:
  - marker: a
    text: Or 'up to their seat' or 'up to their private area'; the Hebrew term is rare, and the exact anatomical reference is debated. The sense is that Hanun exposed them shamefully by cutting their garments very short.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 하눈은 다윗의 신하들을 데려다가 그들의 수염의 절반을 깎고, 그들의 옷을 가운데에서 엉덩이까지 잘라 내고 그들을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 희귀한 말은 ‘엉덩이’, ‘앉는 부위’, 또는 ‘은밀한 부위’로 이해될 수 있어 정확한 해부학적 지시 대상은 논쟁적입니다. 문맥상 옷을 매우 짧게 잘라 그들을 공개적으로 수치스럽게 했다는 뜻입니다.
    reason: lexical_alternative
