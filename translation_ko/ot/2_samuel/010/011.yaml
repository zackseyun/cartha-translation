id: 2SA.10.11
reference: 2 Samuel 10:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
  footnotes:
  - marker: a
    text: Or “If Aram prevails against me … if the Ammonites prevail against you.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “you shall be to me for deliverance” … “I will go to deliver you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a]. 「아람이 내게 너무 강하면, 당신이 내게 도움을 주십시오. 그러나 암몬 자손이 당신에게 너무 강하면, 내가 가서 당신을 도우겠습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아람이 내게서 이기면 … 암몬 자손이 당신에게서 이기면.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔נִּי
  english_pob_choice: If Aram is too strong for me
  chosen_korean: 아람이 내게 너무 강하면
  alternatives_korean:
  - 아람이 나보다 강하면
  - 아람이 내게서 우세하면
  - 아람이 나를 압도하면
  lexicon: HALOT
  rationale: חזק은 이 전투 문맥에서 ‘강하다/우세하다’의 뜻이므로, 자연스러운 한국어로 ‘너무 강하면’이 조건적 우세를 잘 드러냅니다.
- source_word: וְהָיִתָה לִּי לִישׁוּעָה
  english_pob_choice: you shall help me
  chosen_korean: 당신이 내게 도움을 주십시오
  alternatives_korean:
  - 당신이 내게 구원이 되십시오
  - 당신은 내게 구원이 될 것입니다
  - 당신이 내게 구출이 되어 주십시오
  lexicon: HALOT
  rationale: לִישׁוּעָה는 본문 상황상 군사적 구출/지원의 의미이므로, 교리적 어감을 덧씌우지 않고 ‘도움’으로 옮겼습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬인들
  - 암몬 족속
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘sons of Ammon’을 한국어 성경에서 통용되는 민족 명칭으로 옮겼습니다.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  english_pob_choice: I will go to help you
  chosen_korean: 내가 가서 당신을 도우겠습니다
  alternatives_korean:
  - 내가 가서 당신을 구원하겠습니다
  - 내가 가서 당신을 구해 주겠습니다
  - 내가 가서 당신을 돕겠습니다
  lexicon: HALOT
  rationale: הלך + 목적 부정사는 ‘가서 ~하다’의 목적 이동을 나타내며, 여기서는 전투 지원의 의미가 가장 자연스럽습니다.
theological_decisions:
- issue: לִישׁוּעָה의 신학적 어감
  chosen_reading: 여기서는 ‘구원’보다 ‘도움’으로 번역해 군사 협력의 직접 의미를 살렸습니다.
  alternative_readings:
  - 구원
  - 구출
  - 해방
  rationale: 문맥이 전쟁 협정이므로, 뒤늦은 신학적 연상을 피하고 본문의 실용적 의미를 보존하는 것이 더 정확합니다.
  doctrine_reference: 문맥 우선 원칙
