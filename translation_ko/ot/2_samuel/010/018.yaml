  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
  footnotes:
  - marker: a
    text: Hebrew 'seven hundred chariot/chariotry.' The exact referent may be the chariot force, hence 'charioteers.' 1 Chronicles 19:18 has 'seven thousand chariots.'
    reason: textual_variant
  - marker: b
    text: Or 'the commander of his army.' The Hebrew suffix is singular.
    reason: lexical_alternative
translation:
  language: ko
  text: 아람이 이스라엘 앞에서 도망하였고, 다윗이 아람의 칠백 병거와 사만 명의 기병을 죽였습니다. 또 그들의 군대의 지휘관 쇼박을 쳤는데, 그가 거기에서 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רֶכֶב은 문자적으로 ‘병거/전차’이며, 전투 대상이 차량 집단인지 병거병인지 분명하지 않습니다. 영어 POB는 이를 ‘charioteers’로 처리했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 접미사는 단수로 보일 수 있어 ‘그의 군대’로도 옮길 수 있습니다. 영어 POB는 이를 ‘their army’로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  english_pob_choice: Aram fled from before Israel
  chosen_korean: 아람이 이스라엘 앞에서 도망하였고
  alternatives_korean:
  - 아람이 이스라엘 앞에서 달아났고
  - 아람이 이스라엘을 피해 도망하였고
  lexicon: HALOT
  rationale: מִפְּנֵי는 직역하면 ‘앞에서’이므로, 전투 앞에서의 퇴각이라는 이미지를 살리기 위해 ‘이스라엘 앞에서 도망하다’로 옮겼습니다.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  english_pob_choice: seven hundred charioteers
  chosen_korean: 칠백 병거
  alternatives_korean:
  - 칠백 전차
  - 칠백 병거병
  - 칠백 전차병
  lexicon: HALOT
  rationale: רֶכֶב은 문자적으로 ‘병거/전차’이며, 여기서는 전투 손실 대상을 차량으로 보는 편이 원문에 더 가깝습니다. 영어 POB의 ‘charioteers’ 취지를 반영하되, 한국어에서는 자연스러운 군사 표현인 ‘병거’로 유지했습니다.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  english_pob_choice: forty thousand horsemen
  chosen_korean: 사만 명의 기병
  alternatives_korean:
  - 사만 기병
  - 사만 명의 말탄 자
  - 사만의 기병
  lexicon: HALOT
  rationale: פָּרָשִׁים은 기병/말탄 병사를 뜻하므로, 현대 한국어 군사 용례에 맞는 ‘기병’으로 옮겼습니다. 수사와 단위를 분명히 하기 위해 ‘명’을 넣었습니다.
- source_word: שַׂר צְבָאֹו
  english_pob_choice: the commander of their army
  chosen_korean: 그들의 군대의 지휘관
  alternatives_korean:
  - 그 군대의 지휘관
  - 그의 군대의 지휘관
  - 군대의 지휘관
  lexicon: HALOT
  rationale: שַׂר는 ‘지휘관’이 자연스럽고, צְבָא는 군사 집단을 가리키므로 ‘군대의 지휘관’으로 옮겼습니다. 대명사 접미사의 모호함을 살리되 한국어에서는 ‘그들의’로 가장 자연스럽게 풀었습니다.
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳤는데
  alternatives_korean:
  - 쳐서
  - 내려쳤는데
  - 무찔렀는데
  lexicon: HALOT
  rationale: נכה의 폭넓은 의미를 유지하면서도, 바로 뒤의 ‘죽었습니다’와 함께 읽힐 때 과도한 해석을 피하려고 ‘쳤다’로 간결하게 처리했습니다.
theological_decisions:
- issue: 야훼 전승 인용 여부
  chosen_reading: 이 구절은 직접적인 야훼 칭호 인용이 없으므로, 본문에는 야훼를 드러내지 않았습니다.
  alternative_readings:
  - 구약 전쟁 서술의 신학적 개입을 더 분명히 드러내는 방식
  rationale: 히브리어 본문은 전투 결과를 서술할 뿐이며, 여호와/야훼 호칭이 나타나지 않습니다. 따라서 본문은 역사 서술의 문면을 보존하는 것이 적절합니다.
  doctrine_reference: 본문주의
