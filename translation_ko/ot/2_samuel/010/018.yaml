  to: 아람이 이스라엘 앞에서 도망하였습니다. 다윗은 아람의 병거병 칠백 명[a]과 기병 사만 명을 죽였습니다. 또 다윗은 그의 군대의 지휘관 쇼박을 쳐서, 그가 거기서 죽었습니다.[b]
