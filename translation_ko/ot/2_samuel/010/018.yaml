    rationale: רֶכֶב은 문자적으로 병거/병거 부대일 수 있으나, 이 전투 사상 문맥에서 한국어 ‘병거를 죽였다’는 차량을 죽였다는 뜻이 됩니다. 병거병이라는 인원 지시 해석을 본문에 쓰고 각주로 문자적 모호성을 보존하는 것이 안전합니다.
