    issue: ‘짐을 실은 안장한 나귀’가 חֲבֻשִׁים의 의미를 부정확하게 처리합니다.
    rationale: 히브리어는 나귀들이 ‘안장이 얹힌/채비된’ 상태임을 말합니다. 짐과 물품은 이어지는 ‘그 위에’라는 절에서 제시되므로, ‘짐을 실은’을 앞에 추가하지 않는 편이 원문 구조와 정보를 보존합니다.
  - severity: medium
    issue: c 주석의 대상이 본문의 c 표지 및 영어 POB 주석과 일치하지 않습니다.
