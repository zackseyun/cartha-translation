  lexicon: HALOT
  rationale: 어근상 말린 포도 무리를 가리키므로, POB의 ‘clusters’에 맞춰 ‘송이’를 택해 덩어리감과 묶음의 이미지를 살렸습니다.
- source_word: קַיִץ
  english_pob_choice: summer fruits
  chosen_korean: 여름 과일
  alternatives_korean:
  - 여름 열매
  - 여름 과실
  - 무화과
  lexicon: HALOT
  rationale: 히브리어가 구체 품목보다 넓은 범위를 가리키므로, 본문이 허용하는 범위를 넘지 않도록 일반적인 ‘여름 과일’로 옮겼습니다.
- source_word: נֵבֶל יָיִן
  english_pob_choice: a skin of wine
  chosen_korean: 포도주 한 가죽 부대
  alternatives_korean:
