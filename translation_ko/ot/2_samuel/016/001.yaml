  - 포도주 한 부대
  - 포도주 한 물통
  lexicon: HALOT
  rationale: נֵבֶל은 그릇이 아니라 가죽 용기이므로, 재료를 드러내는 ‘가죽 부대’로 옮겨 물성의 차이를 보존했습니다.
