  lexicon: HALOT
  rationale: רֹאשׁ은 지형 문맥에서 ‘머리’가 아니라 ‘꼭대기/정상’을 뜻하므로, 자연스러운 한국어로 위치 관계를 살려 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
