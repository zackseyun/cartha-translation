reference: 2 Samuel 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דָוִ֗ד עָבַ֤ר מְעַט֙ מֵֽ/הָ/רֹ֔אשׁ וְ/הִנֵּ֥ה צִיבָ֛א נַ֥עַר מְפִי בֹ֖שֶׁת לִ/קְרָאת֑/וֹ וְ/צֶ֨מֶד חֲמֹרִ֜ים חֲבֻשִׁ֗ים וַ/עֲלֵי/הֶם֩ מָאתַ֨יִם לֶ֜חֶם וּ/מֵאָ֧ה צִמּוּקִ֛ים וּ/מֵ֥אָה קַ֖יִץ וְ/נֵ֥בֶל יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
  footnotes:
  - marker: a
    text: Or 'a little past the top.' The Hebrew literally says 'a little from the head,' with 'head' used for the summit of the hill or mount.
    reason: lexical_alternative
  - marker: b
    text: '''Servant'' could also be rendered ''young man'' or ''attendant''; here the context favors Ziba''s role as Mephibosheth''s servant.'
    reason: lexical_alternative
  - marker: c
    text: '''Summer fruits'' may refer more specifically to figs, but the Hebrew term is broader.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 언덕 꼭대기에서 조금 지나갔을 때, 보십시오, 므비보셋의 종 시바가 그를 맞으러 와 있었는데, 짐을 실은 안장한 나귀 두 필과 그 위에 빵 이백 개, 건포도 백 송이, 여름 과일 백 개, 그리고 포도주 한 가죽 부대가 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘언덕 꼭대기에서 조금 지나갔을 때’는 히브리어의 문자적 ‘머리에서 조금’이라는 표현을 지형적 의미로 풀어 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘종’은 כאן נַעַר의 문맥상 의미를 반영한 번역입니다. 이 단어는 ‘젊은이’나 ‘시종/하인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘건포도’는 히브리어의 더 넓은 표현을 한국어에서 자연스럽게 드러낸 번역이며, 더 구체적으로는 말린 포도 송이들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  english_pob_choice: a little beyond the summit
  chosen_korean: 언덕 꼭대기에서 조금 지나갔을 때
  alternatives_korean:
  - 정상에서 조금 지난 데서
  - 꼭대기에서 조금 더 나아갔을 때
  - 머리에서 조금 떨어진 데서
  lexicon: HALOT
  rationale: רֹאשׁ은 지형 문맥에서 ‘머리’가 아니라 ‘꼭대기/정상’을 뜻하므로, 자연스러운 한국어로 위치 관계를 살려 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그때
  - 문득
  lexicon: HALOT
  rationale: 갑작스러운 등장과 시각적 강조를 나타내는 담화 표지이므로, 서사적 긴박감을 살리는 감탄형으로 옮겼습니다.
- source_word: נַעַר מְפִי בֹשֶׁת
  english_pob_choice: the servant of Mephibosheth
  chosen_korean: 므비보셋의 종
  alternatives_korean:
  - 므비보셋의 젊은이
  - 므비보셋의 시종
  - 므비보셋의 하인
  lexicon: HALOT
  rationale: נַעַר는 ‘젊은이’일 수도 있지만, 여기서는 시바의 신분과 역할을 나타내므로 ‘종’이 관계를 가장 분명하게 드러냅니다.
- source_word: צֶמֶד חֲמֹרִים חֲבֻשִׁים
  english_pob_choice: a pair of saddled donkeys
  chosen_korean: 짐을 실은 안장한 나귀 두 필
  alternatives_korean:
  - 안장한 나귀 한 쌍
  - 안장된 나귀 두 마리
  - 짐 싣도록 준비한 나귀 두 필
  lexicon: HALOT
  rationale: צֶמֶד은 ‘한 쌍’이지만 한국어에서는 동물 수량을 ‘두 필’로 자연스럽게 나타내고, חֲבֻשִׁים은 문맥상 ‘안장한/준비한’ 뜻을 반영했습니다.
- source_word: צִמּוּקִים
  english_pob_choice: clusters of raisins
  chosen_korean: 건포도 백 송이
  alternatives_korean:
  - 건포도 백 묶음
  - 말린 포도 백 송이
  - 건포도 백 덩이
  lexicon: HALOT
  rationale: 어근상 말린 포도 무리를 가리키므로, POB의 ‘clusters’에 맞춰 ‘송이’를 택해 덩어리감과 묶음의 이미지를 살렸습니다.
- source_word: קַיִץ
  english_pob_choice: summer fruits
  chosen_korean: 여름 과일
  alternatives_korean:
  - 여름 열매
  - 여름 과실
  - 무화과
  lexicon: HALOT
  rationale: 히브리어가 구체 품목보다 넓은 범위를 가리키므로, 본문이 허용하는 범위를 넘지 않도록 일반적인 ‘여름 과일’로 옮겼습니다.
- source_word: נֵבֶל יָיִן
  english_pob_choice: a skin of wine
  chosen_korean: 포도주 한 가죽 부대
  alternatives_korean:
  - 포도주 한 가죽부대
  - 포도주 한 부대
  - 포도주 한 물통
  lexicon: HALOT
  rationale: נֵבֶל은 그릇이 아니라 가죽 용기이므로, 재료를 드러내는 ‘가죽 부대’로 옮겨 물성의 차이를 보존했습니다.
theological_decisions:
- issue: 서사적 강조 표지 וְהִנֵּה의 처리
  chosen_reading: ‘보십시오’로 번역해 장면의 급작스러운 출현과 독자 주목을 살렸습니다.
  alternative_readings:
  - ‘그런데’
  - ‘문득’
  - 생략
  rationale: 이 표지는 단순 연결사가 아니라 서술의 긴장과 돌발성을 강화하므로, 한국어에서도 그 효과를 보존하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 서사 전달의 담화 기능
