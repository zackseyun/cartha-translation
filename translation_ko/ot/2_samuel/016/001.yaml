  source_fidelity: 수정이 필요합니다. 초안의 ‘짐을 실은’은 חֲבֻשִׁים(‘안장이 얹힌/채비된’)에 없는 내용을 앞당겨 덧붙이며, 물품이 나귀들 위에 있었다는 정보는 뒤의 וַעֲלֵיהֶם으로 충분히 표현됩니다. 또한 צִמּוּקִים의 수량 단위는 영어 POB의 ‘clusters’와 일치하게 ‘송이’로 유지할 수 있으나, 주석은 이 단어의 가능한 의미를 정확히 설명해야 합니다.
  naturalness: ‘안장한 나귀’는 누가 나귀에게 안장을 했다는 능동 표현처럼 들리므로 ‘안장을 얹은 나귀’가 자연스럽습니다. ‘다윗이 … 지나갔을 때에’와 ‘그 위에는’의 구조가 현대 한국어 서사에서 명료합니다. ‘보십시오’는 וְהִנֵּה의 주목·돌발 기능을 합쇼체로 보존합니다.
  terminology: ‘므비보셋’, ‘시바’, ‘종’, ‘나귀’, ‘포도주’는 적절합니다. קַיִץ는 특정 무화과로 한정하지 않고 ‘여름 과일’로 옮기는 것이 안전합니다. 기존 c 주석은 본문 표지 및 영어 POB 감사 기록과 달리 건포도를 설명하므로, c를 ‘여름 과일’의 범위에 대한 주석으로 바로잡아야 합니다.
  issues:
