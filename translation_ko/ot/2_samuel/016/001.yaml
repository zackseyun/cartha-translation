  lexicon: HALOT
  rationale: נַעַר는 ‘젊은이’일 수도 있지만, 여기서는 시바의 신분과 역할을 나타내므로 ‘종’이 관계를 가장 분명하게 드러냅니다.
- source_word: צֶמֶד חֲמֹרִים חֲבֻשִׁים
  english_pob_choice: a pair of saddled donkeys
  chosen_korean: 짐을 실은 안장한 나귀 두 필
  alternatives_korean:
  - 안장한 나귀 한 쌍
  - 안장된 나귀 두 마리
  - 짐 싣도록 준비한 나귀 두 필
  lexicon: HALOT
  rationale: צֶמֶד은 ‘한 쌍’이지만 한국어에서는 동물 수량을 ‘두 필’로 자연스럽게 나타내고, חֲבֻשִׁים은 문맥상 ‘안장한/준비한’ 뜻을 반영했습니다.
- source_word: צִמּוּקִים
  english_pob_choice: clusters of raisins
  chosen_korean: 건포도 백 송이
  alternatives_korean:
  - 건포도 백 묶음
  - 말린 포도 백 송이
