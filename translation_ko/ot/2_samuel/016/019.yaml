reference: 2 Samuel 16:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/שֵּׁנִ֗ית לְ/מִי֙ אֲנִ֣י אֶֽעֱבֹ֔ד הֲ/ל֖וֹא לִ/פְנֵ֣י בְנ֑/וֹ כַּ/אֲשֶׁ֤ר עָבַ֨דְתִּי֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כֵּ֖ן אֶהְיֶ֥ה לְ/פָנֶֽי/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
  footnotes:
  - marker: a
    text: Hebrew literally, 'before his son ... before your father ... before you,' a courtly idiom for serving in the presence of or under a king.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 둘째로, 내가 누구를 섬기겠습니까? 그의 아들 앞에서가 아니겠습니까? 제가 당신의 아버지 앞에서 섬겼던 것처럼, 그렇게 저는 당신 앞에 있겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 '앞에서/앞에'는 왕의 면전에서 또는 그를 섬기며 곁에 서는 궁정 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  english_pob_choice: And secondly
  chosen_korean: 그리고 둘째로
  alternatives_korean:
  - 그리고 두 번째로
  - 그리고 둘째
  lexicon: HALOT
  rationale: 도입부의 담화 표지를 한국어 구어체가 아닌 현대 문어체 합쇼체로 자연스럽게 살리면서, 논증의 두 번째 항목임을 분명히 했습니다.
- source_word: לְמִי ... אֲנִי אֶעֱבֹד
  english_pob_choice: whom should I serve
  chosen_korean: 내가 누구를 섬기겠습니까
  alternatives_korean:
  - 제가 누구에게 봉사하겠습니까
  - 누구를 섬겨야 하겠습니까
  lexicon: HALOT
  rationale: עבד의 궁정적 의미를 '섬기다'로 옮겨 충성/봉사의 뉘앙스를 유지했고, 수사 의문문을 한국어 자연문으로 처리했습니다.
- source_word: לִפְנֵי בְנוֹ / לִפְנֵי אָבִיךָ / לְפָנֶיךָ
  english_pob_choice: before his son ... before your father ... before you
  chosen_korean: 그의 아들 앞에서가 아니겠습니까 … 당신의 아버지 앞에서 … 당신 앞에
  alternatives_korean:
  - 그의 아들 앞에서가 아니겠습니까
  - 그의 아들 앞에서 섬기지 않겠습니까
  - 그의 아들의 면전에서
  lexicon: HALOT
  rationale: 반복되는 לִפְנֵי/לְפָנֶיךָ를 POB의 관찰대로 '앞에서/앞에'로 일관되게 옮겨, 왕 앞에서 시중드는 궁정 관용구를 보존했습니다.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  english_pob_choice: so I will be before you
  chosen_korean: 그렇게 저는 당신 앞에 있겠습니다
  alternatives_korean:
  - 그러므로 저는 당신 앞에서 섬기겠습니다
  - 그리하면 저는 당신 앞에 있겠습니다
  lexicon: HALOT
  rationale: 동사가 עבד에서 היה로 바뀌므로 '섬기겠습니다'를 반복하지 않고, '있겠습니다'로 형식을 살려 앞선 문장과의 평행을 유지했습니다.
theological_decisions:
- issue: 궁정 예절을 나타내는 'before'의 처리
  chosen_reading: '''앞에서/앞에''를 반복해 왕 앞에서의 봉사라는 궁정적 관용구를 드러냈습니다.'
  alternative_readings:
  - '''섬기겠습니다''로 풀어 쓰는 방법'
  - '''면전에서''로 더 강하게 격식화하는 방법'
  rationale: 본문의 핵심은 단순한 장소가 아니라 왕 앞에서의 충성된 대기이므로, 관용구를 희석하지 않고 한국어로 추적 가능하게 옮겼습니다.
  doctrine_reference: 사무엘하 16:19의 서술 맥락과 왕권 예절
- issue: 히브리어의 수사 의문문
  chosen_reading: 직설적 진술보다 수사 의문을 유지해 설득의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 평서문으로 바꾸어 '나는 그의 아들 앞에서 섬길 것입니다'
  - 의문을 약화해 '그의 아들 앞에서 섬기는 것이 아니겠습니까'
  rationale: 후사이의 발언은 다윗에게 충성의 방향을 설득하는 말이므로, 질문 형식을 유지해야 논리적 압박과 공손함이 함께 살아납니다.
  doctrine_reference: 서사 대화의 수사 구조
