lexical_decisions:
- source_word: וַיֹּאמֶר אַבְשָׁלוֹם אֶל אֲחִיתֹפֶל
  english_pob_choice: Then Absalom said to Ahithophel
  chosen_korean: 그때 압살롬이 아히도벨에게 말했습니다
  alternatives_korean:
  - 그리고 압살롬이 아히도벨에게 말했습니다
  - 압살롬이 아히도벨에게 말했습니다
  lexicon: 고유명사 음역
  rationale: 히브리어 서술형 ‘말하다’를 자연스럽게 옮기되, 압살롬과 아히도벨은 통용되는 성경식 음역을 유지했습니다.
- source_word: הָבוּ לָכֶם עֵצָה
  english_pob_choice: Give your advice
  chosen_korean: 조언을 주십시오
  alternatives_korean:
  - 계책을 내십시오
  - 의논하십시오
  lexicon: עֵצָה
  rationale: עֵצָה는 단순한 ‘말’보다 실제로 판단과 계획을 제시하는 뜻이 강하므로, POB의 ‘advice’를 따라 ‘조언’으로 옮겼습니다.
- source_word: מַה נַּעֲשֶׂה
  english_pob_choice: What should we do?
  chosen_korean: 우리가 어떻게 해야 합니까?
  alternatives_korean:
  - 우리가 무엇을 해야 합니까?
  - 우리가 무엇을 하겠습니까?
  lexicon: 문장 전체
  rationale: 히브리어의 의문문을 한국어의 자연스러운 질문형으로 옮겨, 결정을 묻는 뉘앙스를 살렸습니다.
