  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּטּ֧וּ לְ/אַבְשָׁל֛וֹם הָ/אֹ֖הֶל עַל הַ/גָּ֑ג וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל פִּֽלַגְשֵׁ֣י אָבִ֔י/ו לְ/עֵינֵ֖י כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
  footnotes:
  - marker: a
    text: Or 'before all Israel' or 'in full view of all Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 압살롬을 위해 지붕 위에 장막을 쳤고, 압살롬은 온 이스라엘이 보는 앞에서 자기 아버지의 첩들에게 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 이스라엘 앞에서’, ‘온 이스라엘이 보는 가운데’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  english_pob_choice: they pitched
  chosen_korean: 장막을 쳤고
  alternatives_korean:
  - 장막을 펴고
  - 장막을 세우고
  lexicon: HALOT
  rationale: נטה의 이 문맥은 천막을 설치하는 뜻이므로, 현대 한국어에서 가장 자연스럽고 관용적인 ‘장막을 치다’를 사용했습니다.
- source_word: הָאֹהֶל
  english_pob_choice: the tent
  chosen_korean: 장막
  alternatives_korean:
  - 천막
  - 그 장막
  lexicon: HALOT
  rationale: 정관사로 특정된 대상이므로 문맥상 준비된 그 구조물을 가리키는 말로 ‘장막’을 택했습니다.
- source_word: וַיָּבֹא ... אֶל
  english_pob_choice: went in to
  chosen_korean: 들어갔습니다
  alternatives_korean:
  - 동침했습니다
  - 관계를 가졌습니다
  lexicon: HALOT
  rationale: 히브리어의 성관계 완곡어법을 살리되, 한국어에서 지나치게 직설적이거나 현대적 설명체로 바꾸지 않기 위해 ‘들어가다’를 유지했습니다.
- source_word: פִּלַגְשֵׁי אָבִי/ו
  english_pob_choice: his father's concubines
  chosen_korean: 자기 아버지의 첩들
  alternatives_korean:
  - 아버지의 후궁들
  - 아버지의 첩
  lexicon: HALOT
  rationale: פּלגש의 기본 의미를 한국어 성경 어휘에서 통용되는 ‘첩’으로 옮겨, 왕권 찬탈과 수치의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 공개성 표현 לְעֵינֵי כָּל יִשְׂרָאֵל
  chosen_reading: ‘온 이스라엘이 보는 앞에서’로 옮겨, 행위의 공개성과 목격성을 분명히 했습니다.
  alternative_readings:
  - 온 이스라엘 앞에서
  - 온 이스라엘이 보는 가운데
  rationale: 직역하면 ‘모든 이스라엘의 눈에’이지만, 한국어에서는 공개적 목격을 드러내는 표현이 가장 자연스럽고 본문의 수치스러운 공공성을 잘 전달합니다.
  doctrine_reference: 서술 본문의 역사-윤리적 뉘앙스 보존
