base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/009.yaml
  text: Then Abishai son of Zeruiah said to the king[a], “Why should this dead dog curse my lord the king? Please let me go over and take off his head.”
  footnotes:
  - marker: a
    text: Or, more literally, “and remove his head.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 스루야의 아들 아비새가 왕에게 말했습니다. “어찌하여 이 죽은 개가 저의 주군이신 왕을 저주해야 합니까? 제가 건너가 그의 머리를 베게[a] 해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 머리를 제거하게 해 주십시오”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속이 앞선 서술을 이어 주는 기능이므로, 한국어에서는 자연스러운 순차 표지인 ‘그러자’로 옮겼습니다.
- source_word: הַכֶּלֶב הַמֵּת הַזֶּה
  english_pob_choice: this dead dog
  chosen_korean: 이 죽은 개
  alternatives_korean:
  - 이 쓸모없는 개
  - 이 비천한 개
  lexicon: HALOT
  rationale: 경멸적 비유를 완화하지 않고 그대로 살리기 위해 직역에 가깝게 ‘이 죽은 개’로 옮겼습니다.
- source_word: אֶעְבְּרָה נָּא
  english_pob_choice: Please let me go over
  chosen_korean: 제가 건너가서 ... 해 주십시오
  alternatives_korean:
  - 제가 건너가게 해 주십시오
  - 부디 제가 건너가겠습니다
  lexicon: HALOT
  rationale: 청유형과 נא의 공손한 요청을 한국어의 정중한 부탁 표현으로 옮기되, 문맥상 이동의 목적이 드러나도록 처리했습니다.
- source_word: וְאָסִירָה אֶת רֹאשׁוֹ
  english_pob_choice: and take off his head
  chosen_korean: 그의 머리를 베게 해 주십시오
  alternatives_korean:
  - 그의 머리를 없애게 해 주십시오
  - 그의 머리를 잘라 버리게 해 주십시오
  lexicon: HALOT
  rationale: 직역은 ‘머리를 떼어 내다’이지만 한국어에서는 참수의 뜻이 분명한 관용적 표현 ‘머리를 베다’가 원문의 폭력성을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 아비새의 왕 호칭인 אֲדֹנִי הַמֶּלֶךְ의 한국어 존칭 수준
  chosen_reading: ‘내 주 왕’으로 옮겨 왕에 대한 극존대와 종속적 호칭을 함께 드러냈습니다.
  alternative_readings:
  - ‘나의 주군 왕’
  - ‘내 주인 왕’
  rationale: 궁정 예법의 존칭을 살리면서도, 현대 한국어에서 자연스럽고 본문의 정치적 긴장을 흐리지 않는 표현을 선택했습니다.
  doctrine_reference: 출 20:12 / 삼하 15–16장의 왕권-충성 맥락
