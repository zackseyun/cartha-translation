  edition: WLC
  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד וַ/אֲנָשָׁ֖י/ו בַּ/דָּ֑רֶךְ וְ/שִׁמְעִ֡י הֹלֵךְ֩ בְּ/צֵ֨לַע הָ/הָ֜ר לְ/עֻמָּת֗/וֹ הָלוֹךְ֙ וַ/יְקַלֵּ֔ל וַ/יְסַקֵּ֤ל בָּֽ/אֲבָנִים֙ לְ/עֻמָּת֔/וֹ וְ/עִפַּ֖ר בֶּ/עָפָֽרס׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
  footnotes:
  - marker: a
    text: Or 'on the side of the hill opposite him.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats the idea of ongoing movement: ''going along and cursing.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'pelting him with stones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗과 그의 부하들이 길을 가는 동안, 시므이는 다윗의 맞은편 산비탈을 따라가며[a] 계속 저주하고[b], 그를 향해 돌을 던지며[c] 먼지를 날렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 맞은편’이라는 공간 관계를 두 번 언급합니다. 첫 번째는 시므이가 다윗과 마주한 산비탈을 따라간 위치를 나타냅니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘가다’라는 표현을 겹쳐 써서, 시므이가 이동하면서 계속 저주했음을 나타냅니다.
    reason: source_note
  - marker: c
    text: 또는 ‘돌로 치며’. 여기서는 공식적인 처형이 아니라, 다윗을 향해 돌을 던지는 적대 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדָּרֶךְ
  english_pob_choice: on the road
  chosen_korean: 길을
  alternatives_korean:
  - 도로를 따라
  - 길 위를
  lexicon: HALOT
  rationale: דֶּרֶךְ는 여기서 이동 경로를 가리키므로, 현대 한국어에서는 자연스럽게 ‘길을 가다’로 옮겨 지리적 상황을 살렸습니다.
- source_word: בְּצֵלַע הָהָר
  english_pob_choice: on the hillside
  chosen_korean: 산비탈을 따라
  alternatives_korean:
  - 산허리에서
  - 산기슭 쪽을 따라
  lexicon: HALOT
  rationale: צֵלַע는 ‘옆, 비탈, 측면’의 뜻이므로, 시므이가 다윗의 길과 평행하게 높은 쪽 비탈을 따른다는 대비를 ‘산비탈을 따라’로 드러냈습니다.
- source_word: לְעֻמָּתוֹ
  english_pob_choice: opposite him
  chosen_korean: 그 맞은편
  alternatives_korean:
  - 그와 마주하여
  - 그 반대편으로
  lexicon: HALOT
  rationale: 이 표현이 두 번 반복되어 공간적 대조를 강조하므로, 한 번은 ‘맞은편’으로 살리고 두 번째도 ‘그 맞은편으로’로 유지해 반복 효과를 보존했습니다.
- source_word: וַיְקַלֵּל
  english_pob_choice: cursing
  chosen_korean: 저주하고
  alternatives_korean:
  - 욕하고
  - 저주를 퍼붓고
  lexicon: HALOT
  rationale: קלל의 Piel은 단순한 욕설보다 강한 ‘저주’의 행위이므로, 다윗을 향한 적대적 행동을 분명히 하기 위해 ‘저주하다’를 택했습니다.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  english_pob_choice: throwing stones
  chosen_korean: 돌을 던지고
  alternatives_korean:
  - 돌을 맞히고
  - 돌을 퍼부으며
  lexicon: HALOT
  rationale: 여기서는 사법적 ‘돌로 치다’가 아니라 조롱과 공격의 동작이므로, 과도한 형벌 뉘앙스를 피하고 구체적 행위를 그대로 살렸습니다.
- source_word: וְעִפַּר בֶּעָפָר
  english_pob_choice: flinging dust
  chosen_korean: 먼지를 날렸습니다
  alternatives_korean:
  - 흙을 뿌렸습니다
  - 먼지를 퍼부었습니다
  lexicon: HALOT
  rationale: עפר는 먼지/흙가루를 가리키며, 동사도 그걸 흩뜨리는 행위이므로, 한국어에서 생생한 조롱의 몸짓을 드러내는 ‘날리다’를 사용했습니다.
theological_decisions:
- issue: 시므이의 행동을 단순한 언쟁이 아니라 공개적 저주와 모욕의 행위로 어떻게 드러낼지
  chosen_reading: ‘가는 내내 저주하고… 돌을 던지고… 먼지를 날렸습니다’로 연속 동작을 살려 적대적 공격성을 분명히 했습니다.
  alternative_readings:
  - ‘계속 욕하며’로 완화
  - ‘돌을 퍼부으며’로 일반화
  rationale: 히브리어의 진행형·반복적 표현은 지속적인 적대 행위를 강조하므로, 이를 약화하지 않고 한국어에서도 연속 동작으로 보존했습니다.
  doctrine_reference: 본문 의미 보존과 서술적 강도 유지
