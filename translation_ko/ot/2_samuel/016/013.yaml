  source_fidelity: 핵심 동작과 지속성은 대체로 충실합니다. 그러나 두 번째 לְעֻמָּתוֹ를 ‘그 맞은편으로 돌을 던지고’라고 옮긴 것은 한국어에서 돌을 던지는 방향 또는 표적을 불명확하게 하며 부자연스럽습니다. 이 문맥에서는 다윗과 마주한 위치에서 그를 향하여 돌을 던졌다는 뜻으로 자연스럽게 풀어야 합니다.
  naturalness: ‘그 맞은편으로 돌을 던지고’는 현대 표준 한국어의 결합으로 어색합니다. 또한 ‘다윗과 그의 사람들이’보다 ‘다윗과 그의 부하들이’가 이 문맥의 אֲנָשָׁיו에 더 자연스럽습니다. 수정문은 합쇼체를 유지하면서 히브리어의 연속적·적대적 행동을 명료하게 전달합니다.
  terminology: ‘저주하다’, ‘돌을 던지다’, ‘먼지를 날리다’는 적절합니다. אֲנָשָׁיו는 ‘부하들’로, 반복되는 לְעֻמָּתוֹ는 첫째는 공간 관계를 나타내는 ‘다윗의 맞은편’, 둘째는 한국어 관용에 맞춘 ‘그를 향해’로 옮깁니다. 이는 반복 자체를 삭제하는 것이 아니라 두 번째 표현의 문맥상 공격 대상 기능을 자연스럽게 반영한 것입니다.
