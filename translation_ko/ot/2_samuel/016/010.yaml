source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
  footnotes:
  - marker: a
    text: Or, 'For he is cursing, because the LORD has said to him, “Curse David.”' The Hebrew particles can also be taken more explanatorily than conditionally.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 왕이 말했습니다. "스루야의 아들들아, 내가 너희와 무슨 상관이 있느냐? 그가 저주하는 것이 야훼께서 그에게 '다윗을 저주하여라' 하셨기 때문이라면, 누가 '어찌하여 그렇게 하였느냐?' 하고 말할 수 있겠느냐?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 저주하는 것은 야훼께서 그에게 “다윗을 저주하여라” 하셨기 때문이라면.’ 히브리어의 입자들은 조건적으로도, 설명적으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  english_pob_choice: What have I to do with you
  chosen_korean: 내가 너희와 무슨 상관이 있느냐
  alternatives_korean:
  - 내가 너희와 무슨 관계가 있느냐
  - 내가 너희와 무슨 일이 있느냐
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 정보 질문이 아니라 거리두기와 책망의 뜻이므로, 한국어에서도 ‘무슨 상관이 있느냐’로 그 단절감을 살렸습니다.
- source_word: בְּנֵי צְרֻיָה
  english_pob_choice: sons of Zeruiah
  chosen_korean: 스루야의 아들들
  alternatives_korean:
  - 스루야의 아들들이여
  - 스루야의 자녀들
  lexicon: HALOT
  rationale: 조합형 표현을 직역해 요압과 아비새를 어머니 이름으로 지칭하는 인물을 그대로 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 신적 이름 יהוה를 가리키므로 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭어 ‘주’로 완화하지 않았습니다.
- source_word: יְקַלֵּל / קַלֵּל
  english_pob_choice: is cursing / Curse
  chosen_korean: 저주하는 / 저주하여라
  alternatives_korean:
  - 욕하는 / 욕하여라
  - 저주를 퍼붓는 / 저주를 퍼부어라
  lexicon: HALOT
  rationale: 같은 어근의 현재분사와 명령형을 한국어에서도 같은 ‘저주하다’로 맞추어, 본문의 어휘 연결과 강도를 유지했습니다.
- source_word: וּמִי יֹאמַר
  english_pob_choice: then who can say
  chosen_korean: 누가 … 하고 말할 수 있겠느냐
  alternatives_korean:
  - 누가 … 말하겠느냐
  - 누가 …라고 말할 수 있느냐
  lexicon: HALOT
  rationale: 수사 의문문이므로 단순 미래가 아니라 반문적 불가능성을 드러내는 ‘말할 수 있겠느냐’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 개입을 어떻게 표현할 것인가
  chosen_reading: ‘그가 저주하는 것이 야훼께서 그에게 … 하셨기 때문이라면’으로 옮겨, 허용만이 아니라 본문이 제기하는 직접적 발화 가능성을 그대로 남겼습니다.
  alternative_readings:
  - ‘야훼께서 그를 허락하셔서’로 완화하기
  - ‘야훼께서 분명히 그에게 명령하셨다면’으로 단정하기
  rationale: 히브리어와 영어 POB 모두 신적 발화를 조건/설명 구조 안에 두어 긴장을 유지하므로, 한국어도 그 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: 신적 주권과 인간 행위의 긴장 보존; YHWH의 직접 발화 가능성 유지
