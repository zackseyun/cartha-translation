source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וְ/אַיֵּ֖ה בֶּן אֲדֹנֶ֑י/ךָ וַ/יֹּ֨אמֶר צִיבָ֜א אֶל הַ/מֶּ֗לֶךְ הִנֵּה֙ יוֹשֵׁ֣ב בִּ/ירוּשָׁלִַ֔ם כִּ֣י אָמַ֔ר הַ/יּ֗וֹם יָשִׁ֤יבוּ לִ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל אֵ֖ת מַמְלְכ֥וּת אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
  footnotes:
  - marker: a
    text: Or 'is remaining in Jerusalem.' The Hebrew participle can denote continued residence or staying in place, not only literal sitting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 말했습니다. “네 주인의 아들은 어디 있느냐?” 시바가 왕에게 말했습니다. “보십시오, 그가 예루살렘에 머물고 있습니다. 그가 말하기를, ‘오늘 이스라엘 집이 내 아버지의 왕국을 내게 돌려줄 것이다’ 했기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 יוֹשֵׁב은 문자적으로 ‘앉아 있음’보다 ‘머무름/체류함’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  english_pob_choice: Then the king said
  chosen_korean: 그때 왕이 말했습니다
  alternatives_korean:
  - 그리고 왕이 말했습니다
  - 왕이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서사 진행을 한국어의 자연스러운 시간 표지로 옮겼습니다.
- source_word: וְאַיֵּה
  english_pob_choice: And where is
  chosen_korean: 어디 있느냐
  alternatives_korean:
  - 그리고 어디 있느냐
  - 어디에 있느냐
  lexicon: HALOT
  rationale: 질문의 핵심은 위치를 묻는 것이므로 간결한 한국어로 살렸고, 앞의 연결어는 문맥상 자연스럽게 흡수했습니다.
- source_word: בֶּן אֲדֹנֶיךָ
  english_pob_choice: your master's son
  chosen_korean: 네 주인의 아들
  alternatives_korean:
  - 당신의 주인의 아들
  - 네 상전의 아들
  lexicon: HALOT
  rationale: אדון은 이 문맥에서 사회적 주인/주군을 뜻하므로 ‘주인’으로 직역해 관계의 긴장을 유지했습니다.
- source_word: יוֹשֵׁב
  english_pob_choice: is staying
  chosen_korean: 머물고 있습니다
  alternatives_korean:
  - 앉아 있습니다
  - 거주하고 있습니다
  - 남아 있습니다
  lexicon: HALOT
  rationale: 히브리어 분사는 단순한 앉음을 뜻하지 않고 계속 머무름/체류를 나타내므로, POB의 선택을 따라 ‘머물고 있습니다’로 옮겼습니다.
- source_word: בִּירוּשָׁלִַם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에
  alternatives_korean:
  - 예루살렘 안에
  - 예루살렘에서
  lexicon: HALOT
  rationale: 지명과 전치사의 기본 대응을 따랐습니다.
- source_word: יָשִׁיבוּ לִי
  english_pob_choice: will restore to me
  chosen_korean: 내게 돌려줄 것이다
  alternatives_korean:
  - 내게 회복시킬 것이다
  - 내게 되돌려줄 것이다
  lexicon: HALOT
  rationale: 히필형 שוב는 ‘돌려주다/회복시키다’의 의미이므로, 왕권을 되돌리는 동작을 자연스럽게 표현했습니다.
- source_word: אֵת מַמְלְכוּת אָבִי
  english_pob_choice: the kingdom of my father
  chosen_korean: 내 아버지의 왕국
  alternatives_korean:
  - 내 아버지의 나라
  - 내 아버지의 왕권
  lexicon: HALOT
  rationale: ממלכה는 ‘왕국/나라’이지만, POB의 목표 의미에 맞게 동적이면서도 왕권의 회복을 분명히 하는 표현을 선택했습니다.
theological_decisions:
- issue: 시바의 발언과 메피보셋에 대한 고발의 진술 방식
  chosen_reading: 시바의 말을 별도 표지 없이 직접 인용으로 옮겨, 화자의 주장이 본문에서 사실로 확정되지 않도록 했습니다.
  alternative_readings:
  - ‘시바가 주장하기를’처럼 거리두기 표현을 추가함
  - 서술자 주석으로 진위 불확실성을 명시함
  rationale: 히브리어 본문은 단순 보고문이며, 이 절만으로는 화자의 말의 진위를 판정하지 않습니다. 따라서 본문의 긴장을 그대로 유지했습니다.
  doctrine_reference: 본문의 보고와 해석을 구분하고, 내러티브가 드러내는 긴장을 보존함
