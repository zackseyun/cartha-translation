  lexicon: HALOT
  rationale: הֵשִׁיב의 사역적 뉘앙스와 עלֶיךָ의 ‘위에/에게 닥쳐옴’을 함께 살리면서, 원문의 보응·귀결 의미를 한국어로 자연스럽게 드러냅니다.
- source_word: כֹּל דְּמֵי בֵית שָׁאוּל
