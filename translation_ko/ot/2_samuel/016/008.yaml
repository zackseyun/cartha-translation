  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
  footnotes:
  - marker: a
    text: Or 'all the bloodshed of the house of Saul' or 'all the bloodguilt of Saul's house.' The Hebrew literally says 'all the bloods of the house of Saul.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you are in your evil.' The Hebrew term can mean either moral evil or calamity/disaster; here it likely refers to the disaster that has come upon David.
    reason: lexical_alternative
  - marker: c
    text: '''A man of bloodshed'' may also be rendered ''a man of blood'' or ''a bloody man,'' an idiom for one marked by bloodguilt or violence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울을 대신하여 왕이 된 당신에게, 야훼께서 사울 집안의 모든 피를 돌려주셨습니다[a]. 야훼께서 왕국을 당신의 아들 압살롬의 손에 넘기셨습니다. 보십시오, 이제 당신에게 재앙이 닥쳤습니다[b]. 당신이 유혈을 일삼는 사람이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사울 집안의 모든 유혈’ 또는 ‘사울 집안의 모든 피의 책임’으로 옮길 수 있습니다. 히브리어는 문자적으로 ‘사울 집안의 모든 피들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 악 가운데’라고 옮길 수 있습니다. 이 낱말은 도덕적 악 또는 재앙·불행을 뜻할 수 있으며, 여기서는 다윗에게 닥친 재앙을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘피의 사람’, ‘피에 물든 사람’으로 옮길 수 있습니다. 피의 책임이나 폭력으로 특징지어진 사람을 가리키는 관용구입니다.
    reason: lexical_alternative
