  chosen_korean: 사울 집안의 모든 피값
  alternatives_korean:
  - 사울 집안의 모든 피
  - 사울 집안의 모든 피흘림
  - 사울 집안의 모든 피의 책임
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘피들’은 단순한 물질적 피보다 유혈과 피의 책임을 함께 가리킬 수 있어, 한국어에서는 문맥상 ‘피값’으로 옮겨 혈흔과 책임의 뉘앙스를 압축했습니다.
- source_word: בְּרָעָתֶךָ
