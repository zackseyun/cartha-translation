  chosen_korean: 당신의 재앙 가운데
  alternatives_korean:
  - 당신의 악 가운데
  - 당신의 불행 가운데
  - 당신의 재난 가운데
  lexicon: HALOT
  rationale: רעה는 도덕적 악과 재앙/불행을 모두 가질 수 있으나, 여기서는 압살롬의 반역으로 닥친 현재의 파국을 가리키므로 ‘재앙’이 문맥상 가장 직접적입니다.
- source_word: אִישׁ דָּמִים
