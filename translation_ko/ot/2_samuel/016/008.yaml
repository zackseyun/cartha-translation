revisions:
- from: 야훼께서 당신에게 사울 집안의 모든 피값을 되갚으셨습니다[a]—당신이 그 자리를 이어 왕이 되었던 그 집의 피값을 말입니다. 야훼께서 왕국을 당신의 아들 압살롬의 손에 넘기셨습니다. 보십시오, 당신은 지금 당신의 재앙[b] 가운데 있습니다. 당신은 피를 흘린 사람[c]이기 때문입니다.
  to: 사울을 대신하여 왕이 된 당신에게, 야훼께서 사울 집안의 모든 피를 돌려주셨습니다[a]. 야훼께서 왕국을 당신의 아들 압살롬의 손에 넘기셨습니다. 보십시오, 이제 당신에게 재앙이 닥쳤습니다[b]. 당신이 유혈을 일삼는 사람이기 때문입니다[c].
  rationale: 원문의 사역형 ‘되돌아오게 하다’의 보응적 어감을 ‘돌려주셨습니다’로 살리되, ‘피값’이 더하는 대가의 의미는 제거했습니다. 또한 사울이 왕위 계승의 기준점임을 명확히 했고, 재앙의 문맥적 의미와 유혈의 성격 규정을 현대적 합쇼체로 자연스럽게 다듬었습니다.
