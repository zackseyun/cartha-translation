base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Now Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all the people, every man of Israel' or 'all the people, the men of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 압살롬과 이스라엘의 모든 사람, 곧 이스라엘의 남자들이 예루살렘에 이르렀고, 아히도벨도 그와 함께 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 사람, 곧 이스라엘의 남자들’ 또는 ‘모든 사람, 이스라엘의 남자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבְשָׁלוֹם
  english_pob_choice: Now Absalom
  chosen_korean: 이제 압살롬
  alternatives_korean:
  - 그리고 압살롬
  - 그때 압살롬
  lexicon: WLC
  rationale: 서술 전환의 ו를 한국어에서는 자연스러운 장면 전환 표지인 ‘이제’로 옮겨 흐름을 살렸습니다.
- source_word: וְכָל הָעָם אִישׁ יִשְׂרָאֵל
  english_pob_choice: and all the people, the men of Israel
  chosen_korean: 이스라엘의 모든 사람, 곧 이스라엘의 남자들
  alternatives_korean:
  - 이스라엘의 모든 백성, 곧 이스라엘 사람들
  - 이스라엘의 모든 군중, 곧 이스라엘의 남자들
  lexicon: WLC
  rationale: 히브리어의 ‘모든 사람’과 ‘이스라엘의 남자들’이라는 병치를 살리기 위해, POB 각주가 밝힌 이중적 의미를 반영하여 두 표현을 병렬·동격으로 옮겼습니다.
- source_word: בָּאוּ יְרוּשָׁלִָם
  english_pob_choice: came to Jerusalem
  chosen_korean: 예루살렘에 이르렀고
  alternatives_korean:
  - 예루살렘에 왔고
  - 예루살렘으로 들어왔고
  lexicon: WLC
  rationale: בוא의 도착 의미를 자연스럽게 살리되, 문맥상 행렬의 도착을 드러내는 ‘이르렀고’로 옮겼습니다.
- source_word: וַאֲחִיתֹפֶל אִתּוֹ
  english_pob_choice: and Ahithophel was with him
  chosen_korean: 아히도벨도 그와 함께 있었습니다
  alternatives_korean:
  - 그리고 아히도벨이 그와 함께 있었습니다
  - 아히도벨도 그와 동행했습니다
  lexicon: WLC
  rationale: 히브리어의 무동사적 병렬을 한국어에서는 ‘함께 있었습니다’로 풀어 주었고, 대명사 ‘그’는 앞절의 압살롬을 가리키는 것으로 이해했습니다.
