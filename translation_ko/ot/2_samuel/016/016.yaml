  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר בָּ֞א חוּשַׁ֧י הָ/אַרְכִּ֛י רֵעֶ֥ה דָוִ֖ד אֶל אַבְשָׁל֑וֹם וַ/יֹּ֤אמֶר חוּשַׁי֙ אֶל אַבְשָׁלֹ֔ם יְחִ֥י הַ/מֶּ֖לֶךְ יְחִ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
  footnotes:
  - marker: a
    text: Or, “May the king live!” The Hebrew is a royal acclamation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗의 친구인 아르키 사람 후새가 압살롬에게 이르자, 후새가 압살롬에게 말했습니다. “임금님 만세! 임금님 만세!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “임금이 살기를!”; 히브리어는 왕실 환호문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא / וַיֹּאמֶר
  english_pob_choice: came / said
  chosen_korean: 이르자 / 말했습니다
  alternatives_korean:
  - 왔을 때 / 말하였습니다
  - 도착하자 / 이르렀습니다
  lexicon: HALOT
  rationale: 서사 전개는 '왔을 때'보다 더 자연스러운 '이르자'로 살리고, 직접화법 도입은 표준적인 '말했습니다'로 옮겨 자연스러운 현대 한국어 흐름을 유지했습니다.
- source_word: חוּשַׁי הָאַרְכִּי
  english_pob_choice: Hushai the Archite
  chosen_korean: 아르키 사람 후새
  alternatives_korean:
  - 아르키 사람 후사이
  - 아르기 사람 후새
  lexicon: HALOT
  rationale: 고유명사는 통용되는 한국어 음역을 따르되, gentilic הָאַרְכִּי는 직역형인 '아르키 사람'으로 옮겨 출신 표지를 분명히 했습니다.
- source_word: רֵעֶה דָוִד
  english_pob_choice: David’s friend
  chosen_korean: 다윗의 친구
  alternatives_korean:
  - 다윗의 벗
  - 다윗의 동무
  lexicon: HALOT
  rationale: 관계 구문은 직설적으로 '다윗의 친구'로 옮겨, 정치적·개인적 친밀성을 모두 드러내도록 했습니다.
- source_word: יְחִי הַמֶּלֶךְ
  english_pob_choice: Long live the king!
  chosen_korean: 임금님 만세!
  alternatives_korean:
  - 임금이시여, 오래 사십시오!
  - 임금님이 오래 사시기를!
  lexicon: HALOT
  rationale: 히브리어의 왕실 환호문은 한국어에서 관용적인 경축 구호인 '만세'가 가장 대응력이 높아, 명령형의 직역보다 호격적 환호의 힘을 살렸습니다.
theological_decisions:
- issue: 압살롬 앞에서의 후새의 왕실 환호가 지닌 서사적 긴장
  chosen_reading: 의도적 아이러니를 풀어 쓰지 않고, 표준적인 왕실 환호로 그대로 유지했습니다.
  alternative_readings:
  - 배신이나 계략을 암시하는 표현을 덧붙이는 읽기
  - 풍자적 뉘앙스를 드러내는 번역
  rationale: 본문 자체는 정치적 모호성을 설명하지 않고 왕에게 바치는 통상적 환호를 제시하므로, 해석을 앞서 넣지 않고 본문의 긴장을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
