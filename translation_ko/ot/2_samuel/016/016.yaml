  lexicon: HALOT
  rationale: 고유명사는 통용되는 한국어 음역을 따르되, gentilic הָאַרְכִּי는 직역형인 '아르키 사람'으로 옮겨 출신 표지를 분명히 했습니다.
- source_word: רֵעֶה דָוִד
