base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
  footnotes:
  - marker: a
    text: Or, more literally, 'for the LORD has said to him.' The Hebrew does not state the content of what was said, but the context implies the cursing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 아비새와 자기 모든 종들에게 말했습니다. 「보십시오, 내 몸에서 나온 내 아들이 내 생명을 찾고 있는데, 하물며 이제 이 베냐민 사람은 더 그렇지 않겠습니까? 그를 내버려 두고, 저주하게 하십시오. 야훼께서 그에게 그렇게 말씀하셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 다윗은 시므이의 저주를 야훼의 말씀과 연결해 말합니다. 히브리어는 ‘그에게 말씀하셨다’고만 적고, 그 내용은 직접 제시하지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주의를 환기하는 지시어로서 자연스러운 현대 한국어 명령형을 쓰되, 다윗의 담화체에 맞춰 공손한 복수/청중 호소로 처리했습니다.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  english_pob_choice: my son, who came out from my own body
  chosen_korean: 내 몸에서 나온 내 아들
  alternatives_korean:
  - 내 배에서 나온 내 아들
  - 내 몸 밖으로 나온 내 아들
  lexicon: HALOT
  rationale: 남성인 다윗의 말이므로 ‘womb’ 계열을 피하고, 출생의 친연성과 육체적 긴밀함을 살리는 직역에 가깝게 옮겼습니다.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  english_pob_choice: is seeking my life
  chosen_korean: 내 생명을 찾고 있는데
  alternatives_korean:
  - 내 생명을 구하고 있는데
  - 내 목숨을 노리고 있는데
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리면서도 한국어에서 자연스럽고 분명하게 읽히도록 ‘생명’을 택했습니다.
- source_word: בֶּן הַיְמִינִי
  english_pob_choice: this Benjaminite
  chosen_korean: 이 베냐민 사람
  alternatives_korean:
  - 이 베냐민 지파 사람
  - 이 베냐민인
  lexicon: HALOT
  rationale: 지파 소속을 뜻하는 표현이므로 한국어에서 가장 직관적인 민족·지파 표지로 옮겼습니다.
- source_word: הַנִּחוּ לוֹ וִיקַלֵּל
  english_pob_choice: Leave him alone, and let him curse
  chosen_korean: 그를 내버려 두고, 저주하게 하십시오
  alternatives_korean:
  - 그를 그냥 두고 저주하게 하십시오
  - 그에게 간섭하지 말고, 저주하게 하십시오
  lexicon: HALOT
  rationale: 복수 명령과 허용을 함께 반영하되, 한국어에서 군더더기 없이 자연스럽게 들리는 허용형으로 정리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문이 지닌 고유명사성을 유지했습니다.
theological_decisions:
- issue: 다윗이 시므이의 저주를 야훼의 직접적 발화로 돌리는 진술의 강도
  chosen_reading: ‘야훼께서 그에게 그렇게 말씀하셨기 때문입니다’로 옮겨, 본문이 드러내는 직접 귀속을 완화하지 않았습니다.
  alternative_readings:
  - 야훼께서 그를 허락하셨기 때문입니다
  - 야훼께서 그에게 말하셨기 때문에 저주하게 하십시오
  rationale: 히브리어는 다윗의 입에서 야훼의 발화를 분명히 제시하므로, 원문이 가진 신학적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; YHWH -> 야훼
