base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
  footnotes:
  - marker: a
    text: Or, more literally, 'for the LORD has said to him.' The Hebrew does not state the content of what was said, but the context implies the cursing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 아비새와 자기의 모든 신하에게 말했습니다. 「보십시오, 내 몸에서 난 내 아들이 내 목숨을 노리고 있는데, 하물며 이제 이 베냐민 사람이야 더하지 않겠습니까? 그를 내버려 두고, 그가 저주하도록 하십시오. 야훼께서 그에게 말씀하셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야훼께서 그에게 말씀하셨기 때문이다’입니다. 말씀하신 내용은 직접 밝히지 않지만, 문맥상 시므이가 저주하는 일과 관련됩니다.
    reason: lexical_alternative
