theological_decisions:
- issue: 다윗이 시므이의 저주를 야훼의 직접적 발화로 돌리는 진술의 강도
  chosen_reading: ‘야훼께서 그에게 그렇게 말씀하셨기 때문입니다’로 옮겨, 본문이 드러내는 직접 귀속을 완화하지 않았습니다.
  alternative_readings:
  - 야훼께서 그를 허락하셨기 때문입니다
  - 야훼께서 그에게 말하셨기 때문에 저주하게 하십시오
  rationale: 히브리어는 다윗의 입에서 야훼의 발화를 분명히 제시하므로, 원문이 가진 신학적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; YHWH -> 야훼
