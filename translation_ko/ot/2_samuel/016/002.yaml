source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל צִיבָ֖א מָה אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּ֣אמֶר צִ֠יבָא הַ/חֲמוֹרִ֨ים לְ/בֵית הַ/מֶּ֜לֶךְ לִ/רְכֹּ֗ב ו/ל/ה/לחם וְ/הַ/קַּ֨יִץ֙ לֶ/אֱכ֣וֹל הַ/נְּעָרִ֔ים וְ/הַ/יַּ֕יִן לִ/שְׁתּ֥וֹת הַ/יָּעֵ֖ף בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
  footnotes:
  - marker: a
    text: Or, 'What do you mean by these?' The Hebrew idiom literally asks, 'What are these to/for you?'
    reason: lexical_alternative
  - marker: b
    text: Or, 'summer produce.' The Hebrew term can refer broadly to fruit gathered in the summer season.
    reason: lexical_alternative
  - marker: c
    text: Or, 'the attendants' or 'the servants' for 'the young men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 시바에게 말했습니다. “이것들은 무엇을 위한 것입니까?” 시바가 대답했습니다. “나귀들은 왕의 집안 사람들이 타도록 한 것이고, 빵과 여름 열매는 젊은이들이 먹도록 한 것이며, 포도주는 광야에서 지친 사람이 마시도록 한 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  english_pob_choice: What are these for?
  chosen_korean: 이것들은 무엇입니까?
  alternatives_korean:
  - 이것들은 무엇을 위한 것입니까?
  - 이것들로 무엇을 하겠습니까?
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 소유가 아니라 용도이므로, 한국어에서는 간결하게 질문형으로 옮기되 문맥상 의미가 드러나도록 했습니다.
- source_word: לְבֵית הַמֶּלֶךְ
  english_pob_choice: for the king’s household
  chosen_korean: 왕의 집안이
  alternatives_korean:
  - 왕의 집이
  - 왕의 가문이
  lexicon: HALOT
  rationale: בַּיִת는 단순한 건물보다 왕의 일가·수행 무리를 포함한 집안을 가리킬 수 있어, 문맥에 맞게 "집안"으로 옮겼습니다.
- source_word: הַקַּיִץ
  english_pob_choice: summer fruit
  chosen_korean: 여름 열매
  alternatives_korean:
  - 여름철 산물
  - 여름 과일
  lexicon: HALOT
  rationale: 구체적 과실 종류가 특정되지 않으므로, 계절적 수확물을 폭넓게 살리면서도 자연스러운 "여름 열매"를 선택했습니다.
- source_word: הַנְּעָרִים
  english_pob_choice: the young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 소년들
  - 시종들
  lexicon: HALOT
  rationale: 원문은 나이대가 젊은 무리를 가리키는 표현이지만, 문맥상 수행 인원까지 포괄할 수 있어 한국어에서는 자연스럽게 "젊은이들"로 옮겼습니다.
- source_word: הַיָּעֵף
  english_pob_choice: the weary
  chosen_korean: 지친 사람
  alternatives_korean:
  - 피곤한 사람
  - 지친 자
  lexicon: HALOT
  rationale: 단수 형용사가 일반화된 의미로 쓰였으므로, 특정 개인이 아니라 광야에서 지친 사람 일반을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 광야의 위기 속에서의 식량·음료의 목적 표현
  chosen_reading: 빵과 여름 열매는 젊은이들이 먹도록, 그리고 광야에서 지친 사람이 마시도록 준비한 것입니다.
  alternative_readings:
  - 빵과 여름 열매는 젊은이들이 먹기 위한 것이고, 포도주는 광야에서 지친 사람을 위한 것입니다.
  - 빵과 여름 열매는 젊은이들의 먹을 것이고, 포도주는 광야에서 피로한 자들의 마실 것입니다.
  rationale: 히브리어의 목적 표현을 보존하면서도, 시바의 답변이 왕에게 제공된 실용적 지원임을 분명히 드러내도록 했습니다.
  doctrine_reference: 서사 맥락 보존
