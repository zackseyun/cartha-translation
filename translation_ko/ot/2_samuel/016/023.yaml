id: 2SA.16.23
reference: 2 Samuel 16:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲצַ֣ת אֲחִיתֹ֗פֶל אֲשֶׁ֤ר יָעַץ֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם כַּ/אֲשֶׁ֥ר יִשְׁאַל בִּ/דְבַ֣ר הָ/אֱלֹהִ֑ים כֵּ֚ן כָּל עֲצַ֣ת אֲחִיתֹ֔פֶל גַּם לְ/דָוִ֖ד גַּ֥ם לְ/אַבְשָׁלֹֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: Now the counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
  footnotes:
  - marker: a
    text: Or 'as when one inquires of a word from God.' The Hebrew comparison emphasizes how highly Ahithophel’s counsel was regarded.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아히도벨이 내놓은 조언은 마치 하나님께 물어보는 것 같았습니다[a]. 아히도벨의 모든 조언은 다윗에게나 압살롬에게나 다 그랬습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 말씀을 묻는 것 같았습니다’. 히브리어 비교는 아히도벨의 조언이 얼마나 높이 평가되었는지를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת / יָעַץ
  english_pob_choice: counsel / he gave
  chosen_korean: 조언은 / 내놓은
  alternatives_korean:
  - 권고는 / 한
  - 계책은 / 베푼
  lexicon: HALOT
  rationale: עֲצָה는 단순한 ‘의견’보다 격식 있는 조언·참모적 판단에 가깝고, 한국어에서는 앞절에서 반복되는 명사성을 살리면서도 ‘내놓은’으로 자연스럽게 동사를 받는 것이 좋습니다.
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: in those days
  chosen_korean: 그때
  alternatives_korean:
  - 그 시절에
  - 그 날들에
  lexicon: HALOT
  rationale: 시간 부사구로서 간결하고 자연스러운 표준어 표현을 택하되, 지나치게 문어적인 고어감을 피했습니다.
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  english_pob_choice: as if one inquired of God
  chosen_korean: 마치 하나님께 물어보는 것 같았습니다
  alternatives_korean:
  - 마치 하나님의 말씀을 묻는 것 같았습니다
  - 마치 하나님께 문의하는 것 같았습니다
  lexicon: HALOT
  rationale: 히브리어의 비교법을 그대로 살려 ‘마치 … 것 같았습니다’로 옮겼고, בִּדְבַר הָאֱלֹהִים는 ‘하나님께 물어보다’로 의역해 예언적/신탁적 문의의 뜻을 드러냈습니다.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  english_pob_choice: both to David and to Absalom
  chosen_korean: 다윗에게나 압살롬에게나 다
  alternatives_korean:
  - 다윗에게도 압살롬에게도
  - 다윗에게나 압살롬에게나
  lexicon: HALOT
  rationale: 반복된 גַּם … גַּם의 병렬을 한국어의 ‘-에게나 … -에게나’로 살리면서, 뒤의 ‘다’로 전체 포괄성을 분명히 했습니다.
theological_decisions:
- issue: 아히도벨의 조언을 하나님의 계시와 동일시하지 않는 비교 표현의 처리
  chosen_reading: ‘마치 하나님께 물어보는 것 같았습니다’로 번역해, 조언의 권위와 신뢰성이 매우 높았음을 말하되 계시 자체와 동일시하지는 않았습니다.
  alternative_readings:
  - ‘하나님께 묻는 것처럼 여겨졌습니다’
  - ‘하나님의 말씀을 묻는 것 같았습니다’
  rationale: 히브리어는 동일시가 아니라 비교(כַּאֲשֶׁר)입니다. 따라서 과장된 신탁성으로 단정하지 않으면서도, 본문이 의도한 강한 평가를 그대로 드러내는 것이 옳습니다.
  doctrine_reference: 비교법 보존; 신탁적 권위의 과장/동일시 구별
