translation:
  language: ko
  text: 압살롬이 후새에게 말했습니다. “이것이 당신의 친구에게 보이는 충성[a]입니까? 왜 당신의 친구와 함께 가지 않았습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד는 문맥에 따라 ‘친절’, ‘인자’, ‘신실한 사랑’ 또는 ‘충성’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  english_pob_choice: your loyalty
  chosen_korean: 충성
  alternatives_korean:
  - 인자
  - 친절
  - 신실한 사랑
  lexicon: HALOT
  rationale: 문맥상 압살롬이 후새의 정치적·관계적 의리를 추궁하고 있으므로, חֶסֶד의 여러 의미 가운데 ‘충성’이 ‘loyalty’를 가장 자연스럽게 반영합니다.
- source_word: רֵעֶךָ
  english_pob_choice: your friend
  chosen_korean: 네 친구
  alternatives_korean:
  - 네 동료
  - 네 동무
  - 네 가까운 사람
  lexicon: HALOT
  rationale: 히브리어 רֵעַ는 친구, 동료, 동반자를 뜻할 수 있지만, 여기서는 압살롬이 다윗을 가리키며 되묻는 표현이므로 ‘친구’가 가장 직설적이고 대조 효과도 살립니다.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  english_pob_choice: Why did you not go with your friend?
  chosen_korean: 왜 네 친구와 함께 가지 않았느냐
  alternatives_korean:
  - 왜 네 친구를 따라가지 않았느냐
  - 왜 네 친구와 동행하지 않았느냐
  lexicon: HALOT
  rationale: הלך + אֶת은 단순한 이동이 아니라 ‘함께 가다/동행하다’의 뜻이므로, 한국어도 자연스러운 ‘함께 가지 않았느냐’로 옮겨 원문의 간결함을 유지했습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서사 동사 וַיֹּאמֶר는 표준적으로 ‘말하다’이므로, 현대 합쇼체 서술에 맞게 가장 자연스러운 ‘말했습니다’를 선택했습니다.
theological_decisions:
- issue: 압살롬의 질책 어조와 직접화법의 재현
  chosen_reading: 직접화법 안에서 압살롬의 날카로운 질문 어조를 그대로 살려, 원문의 비난을 완곡하게 누그러뜨리지 않았습니다.
  alternative_readings:
  - 부드럽게 풀어 쓴 의문문
  - 설명적 문장으로 재구성
  rationale: 본문은 후새의 충성 여부를 시험하는 정치적 질책이므로, 질문 형식을 유지해야 긴장감과 의도된 책망이 전달됩니다.
  doctrine_reference: 본문 서술의 수사적 기능 보존
- issue: 친족·우정보다 ‘의리’/‘충성’의 관계적 함의
  chosen_reading: ‘충성’으로 옮겨 후새가 다윗에게 보여야 할 관계적 의무를 강조했습니다.
  alternative_readings:
  - 친절
  - 사랑
  - 정성
  rationale: חֶסֶד의 의미가 단순 호의보다 더 강한 관계적 충실성을 가리키므로, 이 장면에서는 한국어 ‘충성’이 가장 적절합니다.
  doctrine_reference: 어휘의 문맥적 범위
