base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
  footnotes:
  - marker: a
    text: Or 'he kept coming out and cursing.' The Hebrew intensifies the verb 'came out' (participle + infinitive absolute), likely expressing repeated or sustained action.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 왕이 바후림에 이르렀을 때, 보십시오, 사울 집안의 한 씨족에 속한 한 사람이 거기서 나오고 있었습니다. 그의 이름은 게라의 아들 시므이였습니다. 그는 계속해서 나오며 저주했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 계속해서 나오면서 저주했습니다.’ 히브리어는 ‘나오다’ 동사를 분사와 부정사 절대형으로 강화하여 반복적 또는 지속적인 동작을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ דָּוִד
  english_pob_choice: King David
  chosen_korean: 다윗 왕
  alternatives_korean:
  - 왕 다윗
  - 왕인 다윗
  lexicon: HALOT
  rationale: אָנכפosition 구조를 한국어에서도 자연스럽게 살리되, 왕의 칭호와 인명을 함께 분명히 드러내기 위해 ‘다윗 왕’으로 옮겼습니다.
- source_word: עַד בַּחוּרִים
  english_pob_choice: to Bahurim
  chosen_korean: 바후림에 이르렀을 때
  alternatives_korean:
  - 바후림까지
  - 바후림에
  lexicon: HALOT
  rationale: עַד의 도달 의미를 살리면서 다음 장면의 배경 설정을 위해 시간적 종속절처럼 풀어 자연스럽게 표현했습니다.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  english_pob_choice: from the clan of the house of Saul
  chosen_korean: 사울 집안의 한 씨족에 속한
  alternatives_korean:
  - 사울 집안의 가족에 속한
  - 사울 집안의 한 가문에 속한
  lexicon: HALOT
  rationale: מִשְׁפָּחָה의 친족 집단 의미를 ‘씨족’으로 살리고, בֵּית의 왕조/가문 뉘앙스를 ‘집안’으로 옮겨 두 층위를 모두 보존했습니다.
- source_word: יֹצֵא יָצוֹא וּמְקַלֵּל
  english_pob_choice: he came out continually, cursing as he came
  chosen_korean: 그는 계속해서 나와 가며 저주했습니다
  alternatives_korean:
  - 그는 계속 나와 저주하면서
  - 그는 나오고 또 나오며 저주했습니다
  lexicon: HALOT
  rationale: 분사+절대부정사로 강화된 반복/지속 동작을 ‘계속해서 나와 가며’로, 동반 행위를 ‘저주했습니다’로 간결하게 반영했습니다.
theological_decisions:
- issue: וְהִנֵּה의 장면 전환 효과
  chosen_reading: ‘보십시오’로 옮겨 급작스럽고 눈앞에 펼쳐지는 서술 효과를 살렸습니다.
  alternative_readings:
  - 그리고
  - 그런데
  rationale: 단순 접속보다 독자를 현장으로 끌어들이는 지시적 뉘앙스가 강하므로, 서사적 충격을 유지하는 표현이 더 적절합니다.
  doctrine_reference: 서사 담화 분석
- issue: ‘저주하다’의 직접성
  chosen_reading: 완곡화하지 않고 ‘저주했습니다’로 직역적 강도를 유지했습니다.
  alternative_readings:
  - 욕했습니다
  - 험담했습니다
  rationale: 본문은 단순 불평이 아니라 공개적 저주를 가리키므로, 의미를 약화시키지 않는 것이 필요합니다.
  doctrine_reference: 본문 의미 보존
