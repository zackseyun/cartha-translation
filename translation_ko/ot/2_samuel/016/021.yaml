  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
  footnotes:
  - marker: a
    text: Hebrew 'go in to,' a common euphemism for sexual relations.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have become odious to your father'; Hebrew literally evokes becoming foul or offensive.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the hands of all who are with you will be strengthened,' an idiom for being encouraged or emboldened.
    reason: lexical_alternative
translation:
  language: ko
  text: 아히도벨이 압살롬에게 말했습니다. 「아버지의 첩들, 곧 그가 집을 지키도록 남겨 둔 이들에게로 들어가십시오.[a] 그러면 온 이스라엘이 당신이 아버지에게 혐오스러운 사람이 되었다는 것을 들을 것이고,[b] 당신과 함께 있는 모든 사람의 손에 힘이 생길 것입니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘들어가다’는 여기서 성관계를 가리키는 완곡어법입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘아버지에게 혐오스럽거나 가증스러운 존재가 되다’는 뜻을 띱니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구로, ‘…의 손에 힘이 생기다’는 곧 용기와 결의가 북돋워진다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  english_pob_choice: Go in to
  chosen_korean: 들어가십시오
  alternatives_korean:
  - 관계를 가지십시오
  - 잠자리를 같이하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 성적 의미를 드러내되, 한국어에서 과도하게 노골적이지 않은 직접 표현으로 옮겼습니다. 여기서는 상황이 이미 분명하므로 의미를 숨기지 않는 것이 중요합니다.
- source_word: פִּלַגְשֵׁי
  english_pob_choice: concubines
  chosen_korean: 첩들
  alternatives_korean:
  - 후궁들
  - 첩
  lexicon: HALOT
  rationale: 왕실/가문 맥락의 פילגש는 한국어 성서어휘에서 통용되는 '첩'이 가장 직접적입니다. '후궁'도 가능하지만, 본문이 가리키는 가정적·정치적 관계를 '첩'이 더 분명하게 전달합니다.
- source_word: נִבְאַשְׁתָּ
  english_pob_choice: you have become odious
  chosen_korean: 아버지에게서 미움을 받게 된 것
  alternatives_korean:
  - 아버지에게 가증스러워진 것
  - 아버지에게 역겨운 존재가 된 것
  lexicon: HALOT
  rationale: 어근의 '역겨움/혐오스러움'을 한국어에서 자연스럽게 전달하기 위해, POB의 'odious'를 곧장 옮기기보다 관계적 결과가 드러나는 '미움을 받게 된 것'으로 옮겼습니다.
- source_word: וְחָזְקוּ יְדֵי
  english_pob_choice: the hands of ... will be strengthened
  chosen_korean: 손이 힘을 얻을 것입니다
  alternatives_korean:
  - 용기가 생길 것입니다
  - 기세가 올 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지를 보존하면서도 한국어에서 이해 가능한 표현으로 옮겼습니다. '손'을 유지해 원문의 비유를 살렸습니다.
theological_decisions:
- issue: 아버지의 첩들과 관계를 갖는 행위의 노골성과 완곡법
  chosen_reading: 완곡법의 의미를 유지하되, 문맥이 분명하므로 성적 행위가 암시됨을 분명히 하는 '들어가십시오'를 사용했습니다.
  alternative_readings:
  - 관계를 가지십시오
  - 잠자리를 같이하십시오
  rationale: 본문은 정치적 모욕과 단절을 의도한 성적 행위를 가리키므로, 지나치게 완곡하거나 현대적 구어체로 약화시키지 않으면서도 합쇼체 성경 문체를 유지해야 합니다.
  doctrine_reference: 'translation philosophy: optimal equivalence; source sense and rhetorical force preserved'
