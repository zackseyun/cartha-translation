id: 2SA.16.12
reference: 2 Samuel 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
  footnotes:
  - marker: a
    text: Or, following the written form, 'my iniquity.'
    reason: textual_variant
translation:
  language: ko
  text: 「어쩌면 야훼께서 내 고난을[a] 보시고, 야훼께서 이 날 그의 저주 대신 나에게 좋은 것으로 갚아 주실지도 모릅니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 기록형(케티브)을 따르면, ‘내 죄악.’
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַ֛י
  english_pob_choice: Perhaps
  chosen_korean: 어쩌면
  alternatives_korean:
  - 혹시
  - 아마도
  lexicon: HALOT
  rationale: 희망이 섞인 불확실성을 현대 한국어로 자연스럽게 옮기되, 다윗의 신중한 기대감을 과장하지 않기 위해 선택했습니다.
- source_word: יִרְאֶ֥ה יְהוָ֖ה
  english_pob_choice: Yahweh will look on
  chosen_korean: 야훼께서 … 보시고
  alternatives_korean:
  - 야훼께서 … 살피시고
  - 야훼께서 … 바라보시고
  lexicon: HALOT
  rationale: רָאָה는 단순 시각보다 ‘주목하여 보심’의 뜻이 강하므로, ‘보시고’로 옮겨 하나님의 주목을 간결하게 살렸습니다.
- source_word: בְעָוְנִי
  english_pob_choice: my affliction
  chosen_korean: 내 고난을
  alternatives_korean:
  - 내 죄를
  - 내 불행을
  - 내 환난을
  lexicon: HALOT
  rationale: 본문 맥락에서 다윗은 시므이의 저주 아래 있는 자신의 억눌림과 고통을 가리키므로, 주된 의미는 ‘고난’으로 반영했습니다.
- source_word: וְהֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה
  english_pob_choice: Yahweh will repay me with good
  chosen_korean: 야훼께서 … 나에게 좋은 것으로 갚아 주실지도 모릅니다
  alternatives_korean:
  - 야훼께서 … 나에게 선을 돌려주실지도 모릅니다
  - 야훼께서 … 나에게 좋은 것을 되돌려 주실지도 모릅니다
  lexicon: HALOT
  rationale: הֵשִׁיב의 보응/보상적 용법을 살려 ‘갚아 주다’로 옮겼고, טוֹבָה는 추상명사보다 ‘좋은 것으로’가 한국어에서 자연스럽습니다.
- source_word: תַּ֥חַת קִלְלָת֖וֹ
  english_pob_choice: in place of his cursing
  chosen_korean: 그의 저주 대신
  alternatives_korean:
  - 그의 저주를 대신하여
  - 그의 저주를 맞바꾸어
  lexicon: HALOT
  rationale: תַּחַת의 대체/교환 의미를 간결하게 반영하기 위해 ‘대신’으로 옮겼습니다. קִלְלָה는 반복되는 저주 행위를 드러내는 ‘저주’로 처리했습니다.
theological_decisions:
- issue: בְעָוְנִי의 본문-낭독 긴장 보존
  chosen_reading: 본문은 ‘내 고난’으로 두되, 주해상으로는 문자형이 ‘내 죄/악’의 가능성을 품는다는 긴장을 유지합니다.
  alternative_readings:
  - 내 죄
  - 내 악행
  rationale: 이 구절은 필사 형태와 전승된 낭독 사이의 긴장이 있는 곳이므로, 번역문은 문맥상 적합한 ‘고난’을 택하되 해석의 여지를 지워버리지 않도록 했습니다.
  doctrine_reference: 원문 우선 및 본문 비평의 긴장 보존
