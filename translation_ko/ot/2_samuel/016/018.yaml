source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
  footnotes:
  - marker: a
    text: Or, “whomever the LORD, this people, and all the men of Israel choose.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “and every man of Israel.”
    reason: lexical_alternative
  - marker: c
    text: Or, “with him I will stay.”
    reason: lexical_alternative
translation:
  language: ko
  text: 후새가 압살롬에게 말했습니다. “아닙니다. 야훼와 이 백성과 이스라엘의 모든 남자가 택한 분의 사람이 되어, 그분과 함께 머물겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  english_pob_choice: No, for
  chosen_korean: 아니요,
  alternatives_korean:
  - 아니요, 그러나
  - 아니, 오히려
  lexicon: HALOT
  rationale: 강한 부정 뒤에 이어지는 반박의 뉘앙스를 한국어에서는 짧은 부정형으로 살리고, 뒤의 이유절이 그 기능을 담당하도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 전통적 대체어가 아니라 고유명사로 드러내는 것이 원문과 주석 전통에 부합하므로, POB 기본값인 ‘야훼’를 유지했습니다.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  english_pob_choice: and all the men of Israel
  chosen_korean: 이스라엘의 모든 사람
  alternatives_korean:
  - 이스라엘의 모든 남자
  - 이스라엘의 모든 이
  lexicon: HALOT
  rationale: 히브리어의 ‘모든 사람’ 분포성을 살리면서도 한국어에서는 부자연스러운 반복을 줄이기 위해 집합적 표현으로 옮겼습니다.
- source_word: לֹא אֶהְיֶה
  english_pob_choice: I will be his
  chosen_korean: 제가 서고
  alternatives_korean:
  - 제가 그의 것이 되고
  - 제가 그 편이 되며
  lexicon: HALOT
  rationale: 히브리어는 문맥상 소속/충성의 의미를 띠므로, 한국어에서는 ‘~의 편에 서다’로 자연스럽게 풀어 주되 의미를 약화하지 않았습니다.
- source_word: וְאִתּוֹ אֵשֵׁב
  english_pob_choice: and with him I will remain
  chosen_korean: 그와 함께 머물겠습니다
  alternatives_korean:
  - 그와 함께 있겠습니다
  - 그와 함께 계속 머물겠습니다
  lexicon: HALOT
  rationale: ‘앉다’의 직역보다 관계의 지속을 나타내는 ‘머물다’가 문맥상 더 정확하며, 합쇼체 미래형으로 약속의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 야훼 이름의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨 하나님의 고유한 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 선택을 말하는 문맥이므로, 칭호로 바꾸기보다 이름 자체를 보존하는 것이 원문의 힘을 더 직접적으로 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
