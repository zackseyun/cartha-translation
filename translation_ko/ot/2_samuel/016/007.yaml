reference: 2 Samuel 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
  footnotes:
  - marker: a
    text: Or 'man of blood' / 'bloody man.' The Hebrew idiom literally uses 'bloods' and refers to bloodguilt or bloodshed.
    reason: lexical_alternative
  - marker: b
    text: Or 'wicked man.' Hebrew 'man of belial' is an idiom for a worthless or base person, not necessarily the proper name 'Belial.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 시므이가 그를 저주하면서 말했습니다. 「물러가라, 물러가라, 피를 흘린 사람아, 그리고 무가치한 사람아!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘피들’은 혈채나 유혈 살인을 가리키는 관용구이므로, 문자적으로는 ‘피의 사람’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘벨리알’은 고유명사보다 ‘무가치한/악한 사람’이라는 일반적 모욕으로 이해하는 것이 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַ֥ר
  english_pob_choice: And Shimei said
  chosen_korean: 그때 시므이가 … 말했습니다
  alternatives_korean:
  - 그리고 시므이가 … 말했습니다
  - 시므이가 … 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 서술 도입은 문맥상 단순한 발화 표지이므로, 한국어에서는 자연스러운 서사 연결인 ‘그때’와 ‘말했습니다’로 옮겨 흐름을 살렸습니다.
- source_word: בְּ/קַֽלְל/וֹ
  english_pob_choice: as he cursed him
  chosen_korean: 그를 저주하면서
  alternatives_korean:
  - 그를 저주하는 동안
  - 그를 저주하는 중에
  lexicon: HALOT
  rationale: 동시 진행의 뉘앙스를 한국어 부사절로 자연스럽게 반영했습니다. 대상 대명사는 문맥상 다윗이므로 ‘그를’로 처리했습니다.
- source_word: צֵ֥א צֵ֛א
  english_pob_choice: Get out, get out
  chosen_korean: 물러가라, 물러가라
  alternatives_korean:
  - 나가라, 나가라
  - 꺼져라, 꺼져라
  lexicon: HALOT
  rationale: 반복 명령의 격한 추방·배척의 힘을 살리되, 한국어 공개 본문에 맞게 지나치게 속어적인 표현은 피했습니다.
- source_word: הַ/דָּמִ֖ים
  english_pob_choice: man of bloodshed
  chosen_korean: 피를 흘린 사람아
  alternatives_korean:
  - 피의 사람아
  - 피 흘린 자여
  - 피를 부른 사람아
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘피들’은 혈죄/유혈의 관용구이므로, 한국어에서는 ‘피를 흘린’으로 번역해 혈채와 살상 행위를 드러냈습니다.
- source_word: הַ/בְּלִיָּעַל
  english_pob_choice: worthless man
  chosen_korean: 무가치한 사람아
  alternatives_korean:
  - 악한 사람아
  - 비천한 사람아
  - 벨리알아
  lexicon: HALOT
  rationale: 여기서는 고유명사 ‘벨리알’이 아니라 사람에 대한 경멸적 관용구로 쓰였으므로, 의미 범위를 따라 ‘무가치한 사람’으로 옮겼습니다.
theological_decisions:
- issue: הַבְּלִיָּעַל의 성격
  chosen_reading: 고유명사화하지 않고, 경멸적 일반 표현으로 읽었습니다.
  alternative_readings:
  - ‘벨리알’
  - ‘악한 사람’
  rationale: 본문은 후기 악마화된 인물명을 요구하지 않으며, 서술 맥락상 인격적 비난 표현으로 충분합니다. 따라서 원문의 조롱 강도를 유지하면서도 후대 신학적 이미지를 덧씌우지 않았습니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문이 말하지 않는 후대 인격화 개념을 주입하지 않음.
