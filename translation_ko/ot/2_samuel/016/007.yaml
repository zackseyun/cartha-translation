- source_word: הַ/דָּמִ֖ים
  english_pob_choice: man of bloodshed
  chosen_korean: 피를 흘린 사람아
  alternatives_korean:
  - 피의 사람아
  - 피 흘린 자여
  - 피를 부른 사람아
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘피들’은 혈죄/유혈의 관용구이므로, 한국어에서는 ‘피를 흘린’으로 번역해 혈채와 살상 행위를 드러냈습니다.
- source_word: הַ/בְּלִיָּעַל
  english_pob_choice: worthless man
  chosen_korean: 무가치한 사람아
  alternatives_korean:
