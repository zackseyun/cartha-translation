  source_fidelity: 핵심 표현들은 대체로 충실합니다. ‘그를 저주하면서’는 בְּקַלְלוֹ의 동시성을, ‘피를 흘린 사람’은 אִישׁ הַדָּמִים의 유혈·혈죄 함의를, ‘무가치한 사람’은 אִישׁ הַבְּלִיַּעַל의 일반적 모욕 표현을 적절히 전달합니다. 그러나 וְכֹה אָמַר은 시간 부사 ‘그때’를 명시하지 않고 ‘이렇게 말하였다’라는 발화 도입을 나타내므로, ‘그때’는 삭제하고 ‘이렇게’를 보완하는 편이 정확합니다.
  naturalness: 서술의 ‘말했습니다’와 직접 인용 속 반복 명령 ‘물러가라’는 현대 한국어 성경 문체에서 자연스럽습니다. 다만 ‘이렇게 말했습니다’가 히브리어의 도입 표현을 더 자연스럽고 정확하게 반영합니다.
  terminology: 시므이, 저주, 피를 흘린 사람, 무가치한 사람은 적절합니다. 각주 a의 ‘피들’은 한국어로 다소 부자연스러우므로, 히브리어 복수형이 혈죄 또는 유혈을 뜻하는 관용 표현임을 명료하게 설명하도록 다듬습니다. ‘벨리알’을 후대의 인격화된 고유명사로 번역하지 않은 판단도 적절합니다.
