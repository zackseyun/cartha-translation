base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: ko
  text: 그러자 왕이 시바에게 말했습니다. “보십시오, 므비보셋에게 속한 모든 것이 당신의 것입니다.” 시바가 말했습니다. “내가 절하나이다. 내 주 왕이시여, 당신의 눈에 은혜를 입게 하여 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  - 여기 보십시오
  lexicon: הִנֵּה
  rationale: 대화문에서 주의를 환기하는 용법을 반영하되, 현대 합쇼체에 맞게 자연스럽고 직접적인 호소로 옮겼습니다.
- source_word: כֹּ֖ל אֲשֶׁ֣ר לִ/מְפִי בֹ֑שֶׁת
  english_pob_choice: all that belongs to Mephibosheth
  chosen_korean: 므비보셋에게 속한 모든 것
  alternatives_korean:
  - 므비보셋의 모든 소유
  - 므비보셋에게 있는 모든 것
  lexicon: מְפִיבֹשֶׁת
  rationale: ‘belongs to’의 소유 관계를 분명히 하면서도, 법적·재산적 뉘앙스를 지나치게 풀어쓰지 않도록 간결하게 처리했습니다.
- source_word: אֶמְצָא חֵן בְּ/עֵינֶי/ךָ
  english_pob_choice: may I find favor in your eyes
  chosen_korean: 당신의 눈에 은혜를 입게 하여 주십시오
  alternatives_korean:
  - 당신 보시기에 은혜를 입게 하여 주십시오
  - 당신의 눈에 호의를 얻게 하여 주십시오
  lexicon: חֵן
  rationale: 직역의 ‘은혜’를 유지하면서도 한국어에서 자연스러운 청유형으로 옮겨, 왕에게 드리는 겸손한 요청의 뉘앙스를 살렸습니다.
- source_word: אֲדֹנִ֥/י הַ/מֶּֽלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 주 왕이시여
  alternatives_korean:
  - 나의 주 왕이시여
  - 내 주여, 왕이시여
  lexicon: אֲדֹנִי
  rationale: 히브리어 호칭의 존대와 왕호를 함께 드러내기 위해 ‘내 주’와 ‘왕이시여’를 결합했습니다.
