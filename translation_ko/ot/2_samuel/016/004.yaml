revisions:
- from: 그러자 왕이 시바에게 말했습니다. “보십시오, 므비보셋에게 속한 모든 것이 당신의 것입니다.” 시바가 말했습니다. “내가 절하나이다. 내 주 왕이시여, 당신의 눈에 은혜를 입게 하여 주십시오.”
  to: 그러자 왕이 시바에게 말했습니다. “보십시오, 므비보셋에게 속한 모든 것이 당신의 것입니다.” 시바가 말했습니다. “제가 절합니다. 내 주 왕이시여, 제가 왕께 은총을 입기를 바랍니다.”
  rationale: 시바의 마지막 발화를 현대 합쇼체로 자연화하면서, 히브리어의 소망 표현을 직접적인 요청으로 바꾸지 않도록 수정했습니다. 나머지 문장은 원문의 소유 선언과 호칭을 충실히 반영하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
