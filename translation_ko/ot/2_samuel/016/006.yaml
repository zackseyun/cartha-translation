source:
  edition: WLC
  text: וַ/יְסַקֵּ֤ל בָּֽ/אֲבָנִים֙ אֶת דָּוִ֔ד וְ/אֶת כָּל עַבְדֵ֖י הַ/מֶּ֣לֶךְ דָּוִ֑ד וְ/כָל הָ/עָם֙ וְ/כָל הַ/גִּבֹּרִ֔ים מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
  footnotes:
  - marker: a
    text: Or, 'he stoned David and all the servants of King David.' The Hebrew verb can be rendered more literally this way, but in English that wording may suggest a formal execution by stoning rather than hostile pelting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 돌로 다윗과 다윗 왕의 모든 종들에게 돌을 던졌습니다. 그때 모든 백성과 모든 용사들은 그의 오른쪽과 그의 왼쪽에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 돌로 쳤다’로도 옮길 수 있으나, 한국어에서는 이것이 종종 공식적 처형인 ‘돌로 침’으로 들릴 수 있어, 여기서는 실제 공격 동작을 드러내는 표현을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  english_pob_choice: he threw stones at
  chosen_korean: 돌을 던졌습니다
  alternatives_korean:
  - 그를 돌로 쳤습니다
  - 돌로 쳤습니다
  - 돌을 던져 쳤습니다
  lexicon: HALOT
  rationale: סקל의 기본 동작은 돌로 치거나 돌을 던지는 것이며, 여기서는 처형이 아니라 적대적 조롱과 공격의 맥락이므로 ‘돌을 던졌습니다’가 가장 직접적입니다.
- source_word: עַבְדֵי הַמֶּלֶךְ דָּוִד
  english_pob_choice: the servants of King David
  chosen_korean: 다윗 왕의 모든 종들
  alternatives_korean:
  - 다윗 왕의 모든 신하들
  - 다윗 왕의 모든 하인들
  - 다윗 왕의 모든 종자들
  lexicon: HALOT
  rationale: עבד는 문맥상 왕실에 속한 사람들을 가리키지만, 이 구절은 왕의 수행원을 폭넓게 포함하므로 ‘종들’이 원문의 직접성을 유지하면서도 신분적 종속을 과도하게 좁히지 않습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 사람들
  - 온 무리
  - 모든 군중
  lexicon: HALOT
  rationale: עם은 여기서 다윗을 따르던 집단 전체를 가리키므로, 군사로 한정하지 않고 ‘모든 백성’으로 옮기는 것이 자연스럽습니다.
- source_word: הַגִּבֹּרִים
  english_pob_choice: the mighty men
  chosen_korean: 모든 용사들
  alternatives_korean:
  - 모든 장사들
  - 모든 강한 자들
  - 모든 전사들
  lexicon: HALOT
  rationale: גִּבּוֹרִים은 다윗의 정예 전사들을 가리키는 관용적 표현이므로, 한국어 성경에서 통용되는 ‘용사들’이 군사적 뉘앙스를 잘 살립니다.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  english_pob_choice: at his right hand and at his left
  chosen_korean: 그의 오른쪽과 그의 왼쪽
  alternatives_korean:
  - 그의 오른편과 그의 왼편
  - 그 오른쪽과 그 왼쪽
  - 좌우에
  lexicon: HALOT
  rationale: 전후 문맥상 배치 상태를 말하므로 한국어에서는 관용구를 덜 쓰고 직역에 가까운 ‘그의 오른쪽과 그의 왼쪽’이 가장 분명합니다.
