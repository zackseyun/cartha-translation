  text: 왕과 그와 함께한 모든 백성은 지친 채 이르렀고, 왕은 거기서 숨을 돌렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕과 그와 함께한 모든 백성은 와서, 왕은 거기서 쉬었습니다.’
