  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
  footnotes:
  - marker: a
    text: Or 'came ... and rested there.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew verb is singular (''he refreshed himself''), though some understand it collectively: ''they refreshed themselves.'''
    reason: alternative_reading
translation:
  language: ko
  text: 왕과 그와 함께한 모든 백성이 피곤한 채로 이르렀고, 거기서 몸을 쉬었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '와서 거기서 쉬었습니다.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 단수형으로, '그가 몸을 쉬었습니다'로도 이해할 수 있지만, 문맥상 집합적으로 '그들이 몸을 쉬었습니다'로 보는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: arrived
  chosen_korean: 이르렀고
  alternatives_korean:
  - 왔고
  - 도착했고
  lexicon: HALOT
  rationale: 여기서는 단순한 이동보다 목적지에 이른 결과가 강조되므로, 문어체에서 자연스럽고 종결감을 살리는 '이르렀다'를 택했습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 왕이신 분
  lexicon: HALOT
  rationale: 히브리어는 특정 인물명을 쓰지 않고 직함을 유지하므로, 본문 호칭을 그대로 살려 '왕'으로 옮겼습니다.
- source_word: עֲיֵפִים
  english_pob_choice: weary
  chosen_korean: 피곤한
  alternatives_korean:
  - 지친
  - 쇠한
  lexicon: HALOT
  rationale: 이 형용사는 신체적 피로를 가리키므로, 현대 한국어에서 자연스럽고 과장되지 않는 '피곤한'으로 옮겼습니다.
- source_word: וַיִּנָּפֵשׁ
  english_pob_choice: he refreshed himself
  chosen_korean: 몸을 쉬었습니다
  alternatives_korean:
  - 그가 스스로를 새롭게 했습니다
  - 그는 쉬었습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 회복·숨돌림의 뜻이 있어, 직역의 어색함을 피하면서도 'rested there'의 의미를 담는 '몸을 쉬다'로 처리했습니다.
theological_decisions:
- issue: 단수 동사와 집합적 주어의 대응
  chosen_reading: 본문의 동사 형태는 단수로 보되, 한국어에서는 전체 무리가 함께 쉰다는 자연스러운 집합적 의미를 살려 복수 주어에 어울리는 서술로 옮겼습니다.
  alternative_readings:
  - '''그가 거기서 몸을 쉬었습니다'''
  - '''그들이 거기서 몸을 쉬었습니다'''
  rationale: 영어 POB 주석도 단수형과 집합적 이해 가능성을 함께 제시하므로, 한국어는 의미를 해치지 않으면서도 문맥상 자연스러운 집합적 서술을 택했습니다.
  doctrine_reference: 문법적 일치보다 서술 초점과 문맥적 의미 보존을 우선하는 번역 원리
