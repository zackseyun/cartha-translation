  - marker: b
    text: 히브리어 동사는 단수형으로, ‘왕은 거기서 숨을 돌렸습니다’로 옮길 수 있습니다. 그러나 일부는 이를 집합적으로 이해하여 ‘그들은 거기서 숨을 돌렸습니다’로 번역합니다.
    reason: alternative_reading
