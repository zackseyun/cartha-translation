  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''How will the ark of the LORD come to me?'' The wording may express either practical uncertainty or a sense of unworthiness/fear after Uzzah''s death.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 다윗은 야훼를 두려워했습니다. 그는 말했습니다. “야훼의 궤가 어떻게 내게 올 수 있습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 “야훼의 궤가 어떻게 내게 올까?”입니다. 이 표현은 실제로 어떻게 해야 할지에 대한 난처함을 나타낼 수도 있고, 웃사의 죽음 뒤에 느낀 부적합함이나 두려움을 드러낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  english_pob_choice: feared
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 경외하여
  lexicon: HALOT
  rationale: 문맥상 웃사의 죽음 직후에 나타난 다윗의 즉각적 반응이므로, 단순한 경외보다 실제적인 두려움을 드러내는 ‘두려워하여’가 가장 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 원문이 여호와 신명기적 대치어가 아니라 하나님의 고유명 יְהוָה를 쓰므로, 프로젝트 기본값대로 ‘야훼’로 옮겨 이름성을 보존했습니다.
- source_word: אֵיךְ יָבֹא אֵלַי
  english_pob_choice: How can ... come to me?
  chosen_korean: 어떻게 내게 올 수 있습니까?
  alternatives_korean:
  - 어떻게 내게 올까요?
  - 어떻게 내게 오겠습니까?
  lexicon: HALOT
  rationale: אֵיךְ는 단순 미래보다 가능성의 곤란함을 묻는 말이어서, 공손한 현재형 가능 질문인 ‘올 수 있습니까?’로 다윗의 난처함을 살렸습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 표기하여 언약적 고유명을 드러냅니다.
  alternative_readings:
  - ‘주’ 또는 ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 이 절은 주어와 발화 모두에서 יְהוָה를 직접 가리키므로, 본문이 말하는 신적 이름을 일반 호칭으로 바꾸지 않는 것이 소스 충실성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
