  text: וַ/יְחַלֵּ֨ק לְ/כָל הָ/עָ֜ם לְ/כָל הֲמ֣וֹן יִשְׂרָאֵל֮ לְ/מֵ/אִ֣ישׁ וְ/עַד אִשָּׁה֒ לְ/אִ֗ישׁ חַלַּ֥ת לֶ֨חֶם֙ אַחַ֔ת וְ/אֶשְׁפָּ֣ר אֶחָ֔ד וַ/אֲשִׁישָׁ֖ה אֶחָ֑ת וַ/יֵּ֥לֶךְ כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
  footnotes:
  - marker: a
    text: Or 'one measure/portion'; the Hebrew word אֶשְׁפָּר is rare. Many understand it here as a portion of meat, especially in light of the parallel account in 1 Chronicles 16:3.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from man to woman,' an idiom meaning the entire gathered people, both male and female.
    reason: cultural_note
translation:
  language: ko
  text: 그는 온 백성, 곧 이스라엘의 온 무리에게—남자부터 여자까지[b]—사람마다 빵 한 덩이와 고기 한몫[a]과 건포도 떡 하나씩 나누어 주었습니다. 그러자 온 백성이 각기 자기 집으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고기 한몫’은 희귀한 히브리어 אֶשְׁפָּר의 가능한 뜻을 따른 것입니다. 이 단어를 고기의 한 분량으로 이해하는 견해가 있으며, 역대상 16:3의 평행 본문이 이를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘남자부터 여자까지’는 남녀 모두를 포함하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַלֵּק
  english_pob_choice: He distributed
  chosen_korean: 나누어 주었습니다
  alternatives_korean:
  - 분배했습니다
  - 배분했습니다
  lexicon: HALOT
  rationale: 제사적·행정적 분배가 아니라 군중에게 음식을 건네는 구체적 행위를 자연스럽게 드러내면서, 분량을 사람들에게 고르게 건네는 동작을 살렸습니다.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  english_pob_choice: to all the people, to the whole multitude of Israel
  chosen_korean: 온 백성, 곧 이스라엘의 온 무리
  alternatives_korean:
  - 모든 백성, 곧 이스라엘의 모든 무리
  - 이스라엘의 전체 무리
  lexicon: HALOT
  rationale: 두 표현의 중복·강조를 살려 ‘온 백성’과 ‘온 무리’를 함께 두었습니다. 뒤의 ‘곧’은 apposition 관계를 한국어에서 분명히 해 줍니다.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  english_pob_choice: from man to woman
  chosen_korean: 남자에서 여자에 이르기까지
  alternatives_korean:
  - 남녀를 막론하고
  - 남자부터 여자까지
  lexicon: HALOT
  rationale: 히브리어 관용구가 전체 인원을 포괄한다는 뜻이므로, 성별 양끝을 드러내는 직역에 가깝게 옮겼습니다. 이는 이어지는 분배가 남녀 모두에게 이뤄졌음을 보존합니다.
- source_word: חַלַּת לֶחֶם אַחַת / אֶשְׁפָּר אֶחָד / אֲשִׁישָׁה אֶחָת
  english_pob_choice: one loaf of bread / one portion of meat / one raisin cake
  chosen_korean: 빵 한 덩이와 고기 한 몫과 건포도 떡 하나
  alternatives_korean:
  - 빵 한 개와 고기 한 몫과 건포도 떡 하나
  - 빵 한 덩어리와 고기 한 몫과 건포도 떡 하나
  lexicon: HALOT
  rationale: חלה는 현대 한국어에서 ‘빵 한 덩이’가 가장 자연스럽고, אֶשְׁפָּר는 희귀어이므로 POB의 판단을 따라 ‘고기 한 몫’으로 처리해 과도한 단정은 피했습니다. אֲשִׁישָׁה는 한국어 성경 관용을 참고하되 본문의 음식 항목으로 분명하게 ‘건포도 떡’으로 옮겼습니다.
theological_decisions:
- issue: 남녀 포괄 관용구의 처리
  chosen_reading: ‘남자에서 여자에 이르기까지’로 옮겨, 분배가 공동체 전체에 미쳤음을 드러냈습니다.
  alternative_readings:
  - ‘남녀 모두에게’로 완전히 의역
  - ‘모든 사람에게’로 성별 표지를 삭제
  rationale: 본문은 단순한 총인원을 넘어서 성별 양끝을 명시하므로, 그 긴장을 보존하는 쪽이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 본문 주해 차원의 포괄성 표현
- issue: 희귀어 אֶשְׁפָּר의 보수적 처리
  chosen_reading: ‘고기 한 몫’으로 옮기고, 지나친 구체화는 피했습니다.
  alternative_readings:
  - ‘한 분량’으로 모호하게 처리
  - ‘한 조각의 고기’로 구체화
  rationale: 평행본문과 문맥은 식품 분배를 가리키지만, 어휘 자체는 희귀하므로 POB처럼 가능한 의미 범위를 유지하는 것이 가장 안전합니다.
  doctrine_reference: 본문 비평/어휘 주해
