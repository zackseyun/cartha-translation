id: 2SA.6.11
reference: 2 Samuel 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Gittite,'' that is, a man associated with Gath.'
    reason: cultural_note
  - marker: b
    text: Or 'all his house.' The Hebrew can refer broadly to his household or domestic establishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 궤가 가드 사람 오벧에돔의 집에 석 달 동안 머물렀고, 야훼께서 오벧에돔과 그의 온 집을 복 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가드 사람’은 히브리어 지명 형용사 ‘깃 사람’을 풀어 쓴 것입니다.
    reason: cultural_note
  - marker: b
    text: ‘그의 온 집’은 ‘그의 집/집안 전체’까지 포함할 수 있는 히브리어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: remained
  chosen_korean: 머물렀고
  alternatives_korean:
  - 머물렀습니다
  - 있었습니다
  - 거하였습니다
  lexicon: HALOT
  rationale: אַרון이 일정 기간 계속 그곳에 있었음을 자연스럽게 나타내는 동사로, 단순한 ‘앉다’보다 문맥에 맞는 지속 상태를 살렸습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 야훼의 언약궤
  - 여호와의 궤
  lexicon: HALOT
  rationale: אֲרוֹן은 여기서 ‘궤’가 가장 직접적이며, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַגִּתִּי
  english_pob_choice: the Gittite
  chosen_korean: 가드 사람
  alternatives_korean:
  - 깃 사람
  - 가드 출신 사람
  lexicon: HALOT
  rationale: 지명 형용사는 한국어에서 이해가 쉬운 출신 표지로 풀어 ‘가드 사람’이라 했고, 주석 없이도 의미가 분명하게 드러납니다.
- source_word: בֵּית
  english_pob_choice: the house of / household
  chosen_korean: 집
  alternatives_korean:
  - 가정
  - 가문
  - 집안
  lexicon: HALOT
  rationale: 첫 번째 בֵּית는 궤가 실제로 머문 장소이므로 ‘집’이 적절합니다. 뒤의 כָּל בֵּיתוֹ는 문맥상 동일한 집안 전체를 가리킵니다.
- source_word: וְאֶת כָּל בֵּיתוֹ
  english_pob_choice: all his household
  chosen_korean: 그의 온 집
  alternatives_korean:
  - 그의 온 가정
  - 그의 집안 전체
  - 그의 온 가족
  lexicon: HALOT
  rationale: 히브리어의 넓은 범위—가족과 가정 운영 전반—를 담으면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 복 주셨습니다
  alternatives_korean:
  - 축복하셨습니다
  - 복을 내리셨습니다
  - 복 주셨습니다
  lexicon: HALOT
  rationale: ברך의 기본 의미를 그대로 살리되, 현대 한국어에서 구어적이면서도 성경 문체에 맞는 ‘복 주다’를 사용했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문 전체에서 יהוה를 ‘야훼’로 일관되게 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 원문의 신명(神名)을 제목이 아닌 고유명으로 드러내려는 프로젝트 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
