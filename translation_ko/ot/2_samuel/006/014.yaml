  text: וְ/דָוִ֛ד מְכַרְכֵּ֥ר בְּ/כָל עֹ֖ז לִ/פְנֵ֣י יְהוָ֑ה וְ/דָוִ֕ד חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
  footnotes:
  - marker: a
    text: Or 'was whirling' or 'was leaping about'; the Hebrew depicts energetic celebratory movement.
    reason: lexical_alternative
  - marker: b
    text: An ephod was a distinctive priestly or cultic garment; here David is described as wearing one made of linen.
    reason: cultural_note
translation:
  language: ko
  text: 다윗은 야훼 앞에서 온 힘을 다해 춤을 추고 있었으며[a], 아마로 만든 에봇을 입고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빙빙 돌고 있었다’ 또는 ‘펄쩍펄쩍 뛰고 있었다’로 옮길 수 있습니다. 히브리어는 축제의 격렬한 몸짓을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 에봇은 제사장이나 제의와 관련된 특수 의복입니다. 여기서는 다윗이 아마로 만든 에봇을 입고 있었음을 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  english_pob_choice: was dancing
  chosen_korean: 춤을 추었고
  alternatives_korean:
  - 빙빙 돌았고
  - 펄쩍펄쩍 뛰었고
  lexicon: HALOT
  rationale: 문맥상 기쁨의 격렬한 몸짓을 가리키므로, 현대 한국어에서 가장 자연스럽고 의미를 포괄하는 ‘춤을 추다’를 택했습니다.
- source_word: בְּכָל עֹז
  english_pob_choice: with all his might
  chosen_korean: 온 힘을 다해
  alternatives_korean:
  - 전력을 다해
  - 모든 힘으로
  lexicon: HALOT
  rationale: 총력과 강도의 뉘앙스를 살리면서도 합쇼체 서술문에 자연스럽게 맞는 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: DOCTRINE.md contested terms
  rationale: 본문 주해 용례와 한국어 성경의 가독성을 고려해 ‘여호와’를 사용했습니다. 영어 POB의 ‘Yahweh’는 한국어 본문에서는 통상적으로 대응되는 고유명사 표기로 처리했습니다.
- source_word: אֵפוֹד בָּד
  english_pob_choice: a linen ephod
  chosen_korean: 아마 에봇
  alternatives_korean:
  - 세마포 에봇
  - 마포 에봇
  lexicon: HALOT
  rationale: ‘에봇’은 기술적 용어라 음역을 유지했고, בָּד는 재질을 분명히 하되 현대 한국어에서 간결한 ‘아마’로 옮겼습니다. ‘아마 에봇’은 소재 정보와 용어 보존을 함께 충족합니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 본문에는 한국어 관용에 따라 ‘여호와’로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문은 신명기적 고유명사 יְהוָה를 사용하므로 별도의 주석 없이 고유명사를 살리되, 한국어 독자에게 가장 즉시 인지되는 전통 표기를 채택했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH'
- issue: 다윗의 격렬한 움직임
  chosen_reading: ‘춤을 추었습니다’는 단순한 우아한 춤보다 감정이 실린 열광적 몸짓을 포함합니다.
  alternative_readings:
  - 빙빙 돌았습니다
  - 펄쩍펄쩍 뛰었습니다
  rationale: 히브리어 동사는 찬양/환희의 강한 신체적 표현을 가리키므로, 동작의 종류보다 예배적 열정과 강도를 전달하는 쪽이 본문 취지에 더 가깝습니다.
  doctrine_reference: 2 Samuel 6 문맥
