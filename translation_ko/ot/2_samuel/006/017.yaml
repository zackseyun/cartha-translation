base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
  footnotes:
  - marker: a
    text: Or 'peace offerings,' alternatively 'fellowship offerings' or 'offerings of well-being' for Hebrew שְׁלָמִים.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼의 궤를 들여와, 다윗이 그것을 위해 쳐 둔 장막 안의 제자리에 두었습니다. 다윗은 야훼 앞에서 번제와 화목제[a]를 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화 제물’, ‘친교 제물’, 또는 ‘안녕 제물’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 야훼의 언약궤
  - 여호와의 궤
  lexicon: HALOT
  rationale: אֲרוֹן은 예배 문맥에서 ‘궤’가 자연스럽고, יְהוָה는 본문의 신명 표기를 살려 ‘야훼’로 옮겼습니다.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  english_pob_choice: and set it in its place
  chosen_korean: 그를 위해 ... 그 제자리에 두었습니다
  alternatives_korean:
  - 그것을 제자리에 두었습니다
  - 그것을 그 자리에 놓았습니다
  lexicon: HALOT
  rationale: אֹתוֹ와 בִּמְקוֹמוֹ를 함께 살려 ‘그 제자리에’로 옮겼고, 궤를 가리키는 대명사 흐름을 자연스러운 한국어로 처리했습니다.
- source_word: וּשְׁלָמִים
  english_pob_choice: peace offerings
  chosen_korean: 화목제
  alternatives_korean:
  - 평화 제물
  - 교제 제물
  lexicon: HALOT
  rationale: שְׁלָמִים은 제사 용어로 한국어 성경에서 널리 쓰이는 ‘화목제’가 원어의 제의적 의미를 가장 직접적으로 전달합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 면전에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 뜻을 살려 예배 행위가 야훼의 현존 앞에서 이루어졌음을 분명히 했습니다.
theological_decisions:
- issue: 신명 표기 יְהוָה의 처리
  chosen_reading: 본문 전체에서 ‘야훼’로 일관되게 옮겼습니다.
  alternative_readings:
