  source_fidelity: 히브리어의 사건 순서와 핵심 제의 용어는 대체로 충실합니다. 다만 אֹתוֹ(궤)를 받는 한국어 대명사와 장막을 ‘그를 위해’ 쳤다는 표현은 무생물인 궤에 부자연스럽고 지시 대상이 잠시 흐려집니다.
  naturalness: ‘그를 위해’는 현대 표준 한국어에서 궤를 가리키기에 어색합니다. 또한 각주 표지는 대안 번역의 대상어인 ‘화목제’에 직접 붙이는 편이 독자에게 명확합니다.
  terminology: ‘야훼의 궤’, ‘번제’, ‘화목제’는 본문과 한국어 성서 제의 용례에 적절합니다. שְׁלָמִים의 각주 대안 가운데 ‘번영 제물’은 ‘well-being’의 뜻을 지나치게 경제적 번영으로 좁힐 수 있으므로 더 중립적인 표현으로 조정합니다.
