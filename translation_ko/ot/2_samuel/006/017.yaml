    rationale: 히브리어 לוֹ는 문맥상 궤를 가리키지만, 한국어에서 궤를 ‘그’로 받으면 사람을 연상시키고 문장이 부자연스럽습니다. ‘그것을 위해’라고 명시하면 원문의 지시 관계를 보존합니다.
