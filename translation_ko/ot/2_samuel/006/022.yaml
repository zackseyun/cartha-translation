  rationale: 첫 동사를 자발적인 자기-낮춤으로 명시하여 원문의 문맥상 뉘앙스와 영어 POB의 핵심 결정을 보존했습니다. 이어지는 ‘제 눈에도’는 자기 평가를 명확히 했고, ‘여종들’과 ‘존중받을’은 사회적 낮음과 명예의 대비를 유지했습니다. 각주는 독자에게 필요한 어휘 대안과 신분 의미만 간결하게 제시하도록 수정했습니다.
