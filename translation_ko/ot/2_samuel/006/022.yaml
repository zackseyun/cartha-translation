review_pass:
  verdict: revise
  source_fidelity: 첫 절의 וּנְקַלֹּתִי는 문맥상 다윗이 자신을 더욱 낮추거나 천하게 여기도록 내맡기겠다는 자발적·재귀적 뉘앙스를 지닙니다. 초안의 ‘천대받을’은 타인에게 부당하게 대우받는 수동적 뜻으로 기울어 이 뉘앙스를 충분히 반영하지 못합니다. 나머지 구절은 원문의 비교, 자기 평가, 여성 종들의 낮은 신분, 존중의 대조를 대체로 충실히 전달합니다.
  naturalness: ‘제 눈에도 천하게 보일 것입니다’는 한국어에서 무엇이 천하게 보이는지 다소 모호합니다. ‘제 눈에도 낮은 사람이 될 것입니다’가 자기 평가라는 히브리어 관용구를 더 명료하고 자연스럽게 전달합니다. ‘여종들과 함께라면’은 עִמָּם의 ‘그들과 함께’라는 범위를 보존합니다.
  terminology: אָמָהוֹת는 ‘여종들’로 옮겨 여성 종의 낮은 사회적 지위를 적절히 나타냈습니다. כבד의 명예·위신 의미는 ‘존중받을 것입니다’로 무난하게 보존됩니다. 각주에는 영어 번역 선택을 언급하기보다 히브리어 어휘의 의미와 가능한 번역어를 제시하는 편이 적절합니다.
  issues:
