  - severity: low
    issue: ‘제 눈에도 천하게 보일 것입니다’
    rationale: 히브리어 בְּעֵינַי는 ‘내가 보기에/내 자신의 평가에서’를 뜻합니다. 현 표현은 관찰 대상이 모호하므로 자기 평가를 분명히 해야 합니다.
  - severity: low
