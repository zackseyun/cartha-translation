source:
  edition: WLC
  text: וּ/נְקַלֹּ֤תִי עוֹד֙ מִ/זֹּ֔את וְ/הָיִ֥יתִי שָׁפָ֖ל בְּ/עֵינָ֑/י וְ/עִם הָֽ/אֲמָהוֹת֙ אֲשֶׁ֣ר אָמַ֔רְתְּ עִמָּ֖/ם אִכָּבֵֽדָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the slave girls of whom you have spoken, with them I will be honored.
  footnotes:
  - marker: a
    text: Or 'maidservants' / 'female servants.' The Hebrew refers to women of low household status.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 이보다도 더 스스로를 천하게 할 것이며, 제 눈에도 낮은 사람이 될 것입니다. 그러나 당신이 말씀하신 그 여종들과 함께라면, 저는 존중받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여자 종들’. 히브리어는 가정 안에서 낮은 신분에 있던 여성 종들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  english_pob_choice: I will make myself even more contemptible
  chosen_korean: 저는 이보다도 더욱 천대받을 것이며
  alternatives_korean:
  - 저는 이보다도 더욱 경멸받을 것이며
  - 저는 이보다도 더욱 천하게 여겨질 것이며
  - 저는 이보다도 더욱 스스로를 낮출 것이며
  lexicon: HALOT
  rationale: 니팔형의 수동·귀결적 의미를 살려, 다윗이 스스로 받아들이는 사회적 저하를 ‘천대받을’로 옮겼습니다. ‘스스로를 낮출’은 내적 태도에 치우치고, ‘경멸받을’은 감정 반응이 강해 균형이 다소 달라집니다.
- source_word: שָׁפָל בְּעֵינַי
  english_pob_choice: I will be lowly in my own eyes
  chosen_korean: 제 눈에도 천하게 보일 것입니다
  alternatives_korean:
  - 제 눈에도 낮게 보일 것입니다
  - 제 자신에게도 낮은 사람으로 여겨질 것입니다
  - 제 눈에는 겸손하게 보일 것입니다
  lexicon: HALOT
  rationale: ‘בְּעֵינַי’의 관용구를 직역해 자기 평가의 관점을 살렸습니다. ‘겸손하게’는 도덕적 미덕으로 좁혀질 수 있어, 여기서는 지위·평가의 낮아짐을 드러내는 ‘천하게’가 더 가깝습니다.
- source_word: הָאֲמָהוֹת
  english_pob_choice: the slave girls
  chosen_korean: 그 여종들과
  alternatives_korean:
  - 그 종녀들과
  - 그 여종들
  - 그 노예 여자들과
  lexicon: HALOT
  rationale: אָמה는 낮은 가정 신분의 여성 종을 가리키므로, 본문이 가진 사회적 위계를 유지하면서도 한국어 문맥에서 지나치게 거칠지 않은 ‘여종’으로 옮겼습니다. 영어 POB의 ‘slave girls’가 강조한 신분성을 반영합니다.
- source_word: אִכָּבֵדָה
  english_pob_choice: I will be honored
  chosen_korean: 저는 존중받을 것입니다
  alternatives_korean:
  - 저는 존경받을 것입니다
  - 저는 영예를 얻을 것입니다
  - 저는 존중을 받을 것입니다
  lexicon: HALOT
  rationale: כבד의 니팔은 ‘영예/존중을 받다’의 뜻이므로, 한국어에서는 관계적·사회적 위신을 살리는 ‘존중받다’가 가장 자연스럽습니다. 여기서는 신학적 ‘영화되다’보다 honor/shame 대비를 살리는 번역이 적절합니다.
theological_decisions:
- issue: 본문의 수치-존중 대비를 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘천대받을’–‘존중받을’의 대비로 사회적 수치와 명예를 분명히 드러냈습니다.
  alternative_readings:
  - ‘경멸받을’–‘영예를 얻을’
  - ‘낮아질’–‘높임받을’
  rationale: 이 절은 다윗의 겸비와 회복되는 명예를 맞세우는 문맥이므로, 단순한 내면 겸손이 아니라 공개적 신분/명예의 반전을 드러내야 합니다. 한국어에서도 이 대조를 분명히 보여 주는 것이 원문의 힘을 가장 잘 보존합니다.
  doctrine_reference: 역사서의 honor-shame 문맥; 번역 원칙 §1
