source:
  edition: WLC
  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH.'' Rendered ''the LORD'' following the project''s default for the divine name; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 다윗 왕에게 다음과 같이 보고되었습니다. “야훼[a]께서 하나님의 궤 때문에 오벧에돔의 집과 그에게 속한 모든 것에 복을 주셨습니다.” 그러자 다윗은 가서 하나님의 궤를 오벧에돔의 집에서 다윗의 성으로 기뻐하며 옮겨 올렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여호와의 이름 יְהוָה를 사용합니다. 프로젝트 기준에 따라 본문에는 ‘야훼’로 옮겼습니다.
    reason: divine_name
lexical_decisions:
- source_word: וַיֻּגַּד
  english_pob_choice: it was reported
  chosen_korean: 보고되었습니다
  alternatives_korean:
  - 알려졌습니다
  - 전해졌습니다
  lexicon: HALOT
  rationale: 주체를 밝히지 않는 수동적 보고를 살려, 단순한 구어체인 ‘누가 말했다’보다 공적 전달 느낌의 ‘보고되었습니다’로 옮겼습니다.
- source_word: בֵּרַךְ יְהוָה
  english_pob_choice: The LORD has blessed / Yahweh
  chosen_korean: 야훼께서 … 복 주셨습니다
  alternatives_korean:
  - 주께서 … 복 주셨습니다
  - 여호와께서 … 복 주셨습니다
  lexicon: HALOT
  rationale: 이 절의 מקור어는 여호와의 이름을 직접 사용하므로, 프로젝트 기준에 따라 ‘야훼’로 옮기고, 완료된 축복 행위를 한국어 자연문으로 표현했습니다.
- source_word: בֵּית עֹבֵד אֱדֹם
  english_pob_choice: the house of Obed-edom
  chosen_korean: 오벧에돔의 집
  alternatives_korean:
  - 오벧에돔의 가문
  - 오벧에돔의 집안
  lexicon: HALOT
  rationale: 히브리어 ‘집’은 거주 공간과 가구 전체를 함께 가리킬 수 있어, 서술의 구체성을 유지하는 ‘집’을 택했습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님의 궤짝
  lexicon: HALOT
  rationale: 기본 표제어를 따라 ‘궤’로 옮기되, 본문이 언약궤를 지칭하는 전통적 표현으로 굳어 있더라도 원문 단어 자체를 직접 반영했습니다.
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  english_pob_choice: brought up the ark of God
  chosen_korean: 메어 올렸습니다
  alternatives_korean:
  - 올려 가져왔습니다
  - 들어 올렸습니다
  lexicon: HALOT
  rationale: עלה는 단순한 ‘가져오다’보다 상징적·공간적 상승을 포함하므로, 이동과 상승을 함께 드러내는 ‘메어 올리다’를 선택했습니다.
- source_word: בְּשִׂמְחָה
  english_pob_choice: with rejoicing
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 즐거움으로
  - 기뻐하며
  lexicon: HALOT
  rationale: 명사형 기쁨을 살리면서도 행위의 분위기를 자연스럽게 전달하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 여호와 신명기의 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’으로 대체 표기
  - ‘여호와’로 음역
  rationale: 프로젝트 기준이 신명사의 직접 음역을 요구하므로, 제목적 대체어를 쓰지 않고 인격적 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
