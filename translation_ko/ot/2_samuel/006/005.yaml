  rationale: 본문이 신명기적 대명사가 아니라 언약명 자체를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
