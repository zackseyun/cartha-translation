  text: וְ/דָוִ֣ד וְ/כָל בֵּ֣ית יִשְׂרָאֵ֗ל מְשַֽׂחֲקִים֙ לִ/פְנֵ֣י יְהוָ֔ה בְּ/כֹ֖ל עֲצֵ֣י בְרוֹשִׁ֑ים וּ/בְ/כִנֹּר֤וֹת וּ/בִ/נְבָלִים֙ וּ/בְ/תֻפִּ֔ים וּ/בִ/מְנַֽעַנְעִ֖ים וּֽ/בְ/צֶלְצֶלִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
  footnotes:
  - marker: a
    text: Hebrew literally, 'with all woods of cypresses'; the phrase likely refers to various musical instruments made of cypress wood.
    reason: lexical_alternative
  - marker: b
    text: Or 'were playing/rejoicing before the LORD.' The Hebrew verb can denote festive, playful celebration.
    reason: lexical_alternative
  - marker: c
    text: The exact identification of 'rattles' is uncertain; possibly 'sistra' or another shaken percussion instrument.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗과 이스라엘 온 집안이 야훼 앞에서 향나무로 된 각종 악기[a]와 수금, 비파, 소고, 흔드는 악기[c][b], 그리고 제금으로 즐거워하며 놀고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘향나무들의 모든 나무들’에 가깝습니다. 문맥상 향나무 재질의 여러 악기를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘놀다/즐기다/축제하다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 단어는 정확한 악기 종류가 확실하지 않으며, 흔들어서 소리를 내는 악기일 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  english_pob_choice: were celebrating
  chosen_korean: 즐거워하며 놀고 있었습니다
  alternatives_korean:
  - 기뻐하며 있었습니다
  - 즐기며 있었습니다
  - 놀고 있었습니다
  lexicon: HALOT
  rationale: 문맥은 단순한 놀이가 아니라 예배 행렬 속의 축제적 환희를 가리키므로, ‘즐거워하며 놀다’로 기쁨과 행동을 함께 살렸습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 임재 앞에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 옮기되, 본문이 지시하는 장소감과 방향성을 그대로 보존했습니다.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  english_pob_choice: with all kinds of cypress wood instruments
  chosen_korean: 향나무로 된 각종 악기
  alternatives_korean:
  - 각종 향나무 악기
  - 향나무 악기들
  - 모든 향나무 재질의 악기
  lexicon: HALOT
  rationale: 직역하면 ‘향나무들의 모든 나무들’처럼 매우 압축된 표현이므로, 악기라는 함의를 드러내면서도 POB의 해석을 반영해 읽히는 한국어로 옮겼습니다.
- source_word: מְנַעַנְעִים
  english_pob_choice: rattles
  chosen_korean: 흔드는 악기
  alternatives_korean:
  - 딸랑이
  - 딸랑악기
  - 소리나는 흔들개
  lexicon: HALOT
  rationale: 정확한 식별이 불확실한 희귀어이므로, 특정 기종을 단정하지 않고 ‘흔드는’ 기능을 드러내는 중립적 표현을 택했습니다.
