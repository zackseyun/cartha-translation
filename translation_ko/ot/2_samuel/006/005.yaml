base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
  footnotes:
  - marker: a
    text: Hebrew literally, 'with all woods of cypresses'; the phrase likely refers to various musical instruments made of cypress wood.
    reason: lexical_alternative
  - marker: b
    text: Or 'were playing/rejoicing before the LORD.' The Hebrew verb can denote festive, playful celebration.
    reason: lexical_alternative
  - marker: c
    text: The exact identification of 'rattles' is uncertain; possibly 'sistra' or another shaken percussion instrument.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗과 이스라엘 온 집안은 야훼 앞에서 각종 향나무 악기[a]와 수금과 비파와 소고와 흔드는 악기[c]와 제금으로 축제를 벌이고 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 향나무 목재로’에 가깝습니다. 이 난해한 표현은 문맥상 향나무 재질의 여러 악기를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘놀다’, ‘즐거워하다’, ‘축제하다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 단어는 정확한 악기 종류가 확실하지 않으며, 흔들어서 소리를 내는 악기일 가능성이 있습니다.
    reason: lexical_alternative
