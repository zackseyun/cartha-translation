translation:
  language: ko
  text: 다윗은 야훼께서 웃사에게서 불쑥 치고 나오셔서 생긴 그 벌어진 일 때문에 화가 났고, 그가 그곳을 오늘까지 페레스웃사라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 פָּרַץ(‘터지다/돌파하다’)와 פֶּרֶץ(‘돌파, 벌어진 틈’)를 겹쳐 써서 웃사에 대한 하나님의 급작스러운 심판을 말장난처럼 강조합니다.
    reason: lexical_alternative
