translation:
  language: ko
  text: 다윗은 야훼께서 웃사를 치고 나아가셨기 때문에 분노하였고, 그곳을 오늘까지 페레스웃사라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘터져 나오다, 돌파하다’라는 뜻의 동사 파라츠와 ‘터짐, 파열’이라는 뜻의 명사 페레츠를 함께 써서 말놀이를 이룹니다. ‘페레스웃사’라는 지명도 이 명사와 연결됩니다.
    reason: lexical_alternative
