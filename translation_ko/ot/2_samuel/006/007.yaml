id: 2SA.6.7
reference: 2 Samuel 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
  footnotes:
  - marker: a
    text: Or 'because of the error,' 'because of his rash act,' or possibly 'because he reached out his hand.' The Hebrew phrase is difficult and has been understood in several ways.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 분노가 웃사를 향하여 타올랐고, 하나님께서 그를 거기에서 그 잘못 때문에 치시니, 그가 거기에서 하나님의 궤 곁에서 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 잘못 때문에’, ‘그의 성급한 행동 때문에’, 혹은 ‘그가 손을 내밀었기 때문에’일 수 있습니다. 히브리어 구절은 어렵고 여러 방식으로 이해되어 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  english_pob_choice: the anger of Yahweh burned
  chosen_korean: 야훼의 분노가 … 타올랐고
  alternatives_korean:
  - 야훼의 진노가 … 일어났고
  - 야훼의 노여움이 … 타올랐고
  lexicon: HALOT
  rationale: 히브리어 관용구의 불타는 이미지를 살리되, 한국어에서는 ‘분노가 타올랐다’가 자연스럽고 직접적입니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him
  chosen_korean: 그를 … 치시니
  alternatives_korean:
  - 그를 … 치셨고
  - 그를 … 치셨으니
  lexicon: HALOT
  rationale: נכה의 기본 의미를 살려 ‘치다’로 옮기고, 뒤이어 죽음이 따로 나오므로 fatality를 미리 과도하게 강요하지 않았습니다.
- source_word: עַל הַשַּׁל
  english_pob_choice: for the error
  chosen_korean: 그 잘못 때문에
  alternatives_korean:
  - 그 오류 때문에
  - 그 무례함 때문에
  - 그 허물 때문에
  lexicon: HALOT
  rationale: 희귀하고 난해한 표현의 불확실성을 보존하면서도, 본문이 웃자의 잘못에 대한 심판임을 드러내는 가장 중립적인 한국어를 택했습니다.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  english_pob_choice: beside the ark of God
  chosen_korean: 하나님의 궤 곁에서
  alternatives_korean:
  - 하나님의 궤 옆에서
  - 하나님의 궤 곁에
  - 하나님의 궤와 함께
  lexicon: HALOT
  rationale: עִם을 장소 부사로 받아 ‘곁에서’로 옮겨, 동행이 아니라 위치를 나타내는 의미를 분명히 했습니다.
theological_decisions:
- issue: והוה֙/יהוה의 번역
  chosen_reading: 본문의 신명기를 가리키는 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 원칙에 따라 신적 고유명은 대체 호칭이 아니라 이름 자체를 드러내는 표기를 유지했습니다.
  doctrine_reference: 신적 이름의 가시성 보존 및 원문 우선 원칙
- issue: עַל הַשַּׁל의 난해한 원인 표현
  chosen_reading: 주본문에는 ‘그 잘못 때문에’로 두고, 해석을 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 그 무례함 때문에
  - 그의 성급한 행동 때문에
  - 손을 내민 것 때문에
  rationale: 희귀한 표현의 의미가 학자들 사이에서 갈리므로, 본문은 책임의 원인을 말하되 구체적 해석은 지나치게 단정하지 않도록 했습니다.
  doctrine_reference: 해석적 긴장 보존 및 주해 투명성
