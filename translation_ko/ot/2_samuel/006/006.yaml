source:
  edition: WLC
  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
  footnotes:
  - marker: a
    text: Or possibly 'the threshing floor of Nachon' or, less likely, 'the fixed/established threshing floor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the oxen slipped' or 'the oxen nearly upset it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 나곤의 타작마당[a]에 이르렀을 때, 웃사가 하나님의 궤에 손을 내밀어 그것을 붙들었습니다. 이는 소들이 비틀거렸기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나콘의 타작마당’으로 볼 수 있으며, 드물게는 ‘정해진/견고한 타작마당’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소들이 미끄러졌기 때문입니다’ 또는 ‘소들이 그것을 거의 넘어뜨릴 뻔했기 때문입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן נָכוֹן
  english_pob_choice: Nacon’s threshing floor
  chosen_korean: 나곤의 타작마당
  alternatives_korean:
  - 나콘의 타작마당
  - 나곤 타작마당
  - 정한/견고한 타작마당
  lexicon: HALOT
  rationale: גֹּרֶן은 타작마당이 자연스러운 대응이며, נָכוֹן은 POB처럼 고유명사로 읽는 것이 문맥상 가장 매끄러워 ‘나곤의’로 옮겼습니다.
- source_word: וַיִּשְׁלַח
  english_pob_choice: reached out
  chosen_korean: 손을 내밀어
  alternatives_korean:
  - 손을 뻗어
  - 내밀어
  lexicon: HALOT
  rationale: 궤를 향한 신체 동작이므로 ‘보내다’보다 ‘손을 내밀다’가 히브리어의 동작성을 자연스럽게 드러냅니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 법궤
  - 궤
  lexicon: HALOT
  rationale: 히브리어의 정체성을 그대로 보존하기 위해 ‘궤’를 유지하고, 소유격을 반영해 ‘하나님의 궤’로 옮겼습니다.
- source_word: וַיֹּאחֶז בּוֹ
  english_pob_choice: took hold of it
  chosen_korean: 그것을 붙들었습니다
  alternatives_korean:
  - 그것을 잡았습니다
  - 그것을 움켜쥐었습니다
  lexicon: HALOT
  rationale: אחז는 단순한 접촉을 넘어 붙잡는 행위를 나타내므로, 과도한 폭력성을 덜한 ‘붙들다’가 문맥에 적절합니다.
- source_word: שָׁמְטוּ
  english_pob_choice: stumbled
  chosen_korean: 비틀거렸기 때문입니다
  alternatives_korean:
  - 미끄러졌기 때문입니다
  - 놓칠 뻔했기 때문입니다
  - 거의 넘어뜨릴 뻔했기 때문입니다
  lexicon: HALOT
  rationale: 이 동사는 ‘미끄러지다/놓치다’의 여지가 있지만, 소들이 수레의 균형을 위협하는 상황을 한국어로 가장 자연스럽게 보여 주는 표현은 ‘비틀거리다’입니다.
theological_decisions:
- issue: 웃사의 행동을 유발한 즉각적 사유
  chosen_reading: 소들이 비틀거리는 바람에 궤가 위험해 보이자 웃사가 손을 내밀어 붙들었습니다.
  alternative_readings:
  - 소들이 궤를 미끄러뜨렸기 때문에 웃사가 붙들었습니다
  - 소들이 거의 궤를 넘어뜨릴 뻔했기 때문에 웃사가 붙들었습니다
  rationale: 히브리어는 소들이 주어인 원인절만 제시하므로, 한국어도 사건의 긴장을 살리되 과도한 설명을 추가하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
