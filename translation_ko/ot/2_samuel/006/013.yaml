translation:
  language: ko
  text: 야훼의 궤를 멘 사람들이 여섯 걸음[a]을 걸었을 때, 그가 수소 한 마리와 살진 송아지[b] 한 마리를 제물로 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여섯 발짝’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘살진 동물’로도 옮길 수 있으나, 여기서는 전통적으로 ‘살진 송아지’로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 야훼의 언약궤
  - 주님의 궤
  lexicon: HALOT
  rationale: אֲרוֹן은 제의적 용례의 ‘궤’로 옮기고, יְהוָה는 본문 그대로 ‘야훼’로 옮겨 POB의 신명 처리 원칙을 따랐습니다.
- source_word: נֹשְׂאֵי
  english_pob_choice: those carrying
  chosen_korean: 멘 사람들이
  alternatives_korean:
  - 운반하는 사람들
  - 나르는 사람들
  lexicon: HALOT
  rationale: 분사형을 자연스러운 현대 한국어로 풀어 ‘멤/멘 사람들’로 옮겨, 궤를 실제로 운반하는 행위를 분명히 드러냈습니다.
- source_word: שִׁשָּׁה צְעָדִים
  english_pob_choice: six steps
  chosen_korean: 여섯 걸음
  alternatives_korean:
  - 여섯 걸음씩
  - 여섯 발짝
  lexicon: HALOT
  rationale: 수량 표현은 직역에 가깝게 ‘여섯 걸음’으로 두었고, 본문 의미상 짧은 이동 거리를 자연스럽게 전달합니다.
- source_word: וַיִּזְבַּח שׁוֹר וּמְרִיא
  english_pob_choice: he sacrificed an ox and a fattened calf
  chosen_korean: 수소 한 마리와 살진 송아지 한 마리를 제물로 바쳤습니다
  alternatives_korean:
  - 황소 한 마리와 살진 송아지 한 마리를 제물로 바쳤습니다
  - 수소 한 마리와 살진 짐승 한 마리를 제물로 바쳤습니다
  lexicon: HALOT
  rationale: זבח은 제의적 ‘제물을 바치다’로 옮기고, שׁוֹר는 문맥상 제사용 수소로, מְרִיא는 ‘살진 송아지’로 옮겨 독자가 희생 제의의 구체성을 이해하게 했습니다.
