base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
  footnotes:
  - marker: a
    text: 'Hebrew: ''leaping and whirling''; the verbs depict exuberant, celebratory movement before the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 궤가 다윗 성으로 들어오고 있을 때, 사울의 딸 미갈이 창문으로 내다보다가 다윗 왕이 야훼 앞에서 뛰며 빙빙 도는 것을[a] 보고 마음속으로 그를 멸시했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘뛰며 빙빙 도는’으로, 야훼 앞에서의 활기차고 축하하는 움직임을 묘사합니다.
    reason: lexical_alternative
