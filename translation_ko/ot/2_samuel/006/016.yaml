  text: 야훼의 궤가 다윗 성으로 들어올 때, 사울의 딸 미갈은 창문으로 내다보다가 다윗 왕이 야훼 앞에서 뛰고 빙빙 도는 것을 보고 마음속으로 그를 멸시했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
