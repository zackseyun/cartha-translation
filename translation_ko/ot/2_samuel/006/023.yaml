  text: וּ/לְ/מִיכַל֙ בַּת שָׁא֔וּל לֹֽא הָ֥יָה לָ֖/הּ יָ֑לֶד עַ֖ד י֥וֹם מוֹתָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
  footnotes:
  - marker: a
    text: Or 'offspring'; the Hebrew noun can refer to a child generically, not necessarily a son.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울의 딸 미갈에게는 죽는 날까지 자녀가 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자손’; 이 히브리어 명사는 일반적으로 자녀를 가리킬 수 있으며, 반드시 아들을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  english_pob_choice: And Michal
  chosen_korean: 미갈에게는
  alternatives_korean:
  - 미갈은
  - 그리고 미갈은
  - 미갈에게
  lexicon: WLC; HALOT
  rationale: 문두의 접두사 결합은 히브리어 서술 전환을 이끄는 표현으로, 한국어에서는 주제를 드러내는 '-에게는'이 가장 자연스럽고 원문의 연결감을 살립니다.
- source_word: בַּת שָׁא֔וּל
  english_pob_choice: the daughter of Saul
  chosen_korean: 사울의 딸
  alternatives_korean:
  - 사울의 딸인
  - 사울의 딸 미갈
  - 사울 딸
  lexicon: HALOT
  rationale: 지칭 관계를 간단히 드러내는 소유격 구조가 원문의 친족 표지를 가장 직접적으로 반영합니다.
- source_word: לֹֽא הָ֥יָה לָ֖/הּ יָ֑לֶד
  english_pob_choice: had no child
  chosen_korean: 자녀가 없었습니다
  alternatives_korean:
  - 아이를 낳지 못했습니다
  - 자식이 없었습니다
  - 아들이 없었습니다
  lexicon: HALOT
  rationale: יָלֶד은 이 절에서 특정 성별을 고정하지 않는 일반적 의미로 읽히므로, POB의 'child' 취지를 살려 '자녀'로 옮겼습니다.
- source_word: עַ֖ד י֥וֹם מוֹתָֽ/הּ
  english_pob_choice: until the day of her death
  chosen_korean: 죽는 날까지
  alternatives_korean:
  - 그 죽는 날까지
  - 죽음의 날까지
  - 죽을 때까지
  lexicon: HALOT
  rationale: 히브리어의 표준적인 시간 표현을 간결한 한국어로 옮기되, 평생 무자녀였다는 지속성을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 평생 무자녀라는 진술의 처리
  chosen_reading: 문장을 그대로 따라, 미갈이 생애 동안 자녀가 없었다는 사실만 서술하고 그 이상의 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 불임의 신학적 의미를 강조하는 번역
  - 사후적 가능성을 열어 두는 완곡한 표현
  rationale: 본문은 시간적 범위를 분명히 제시할 뿐이므로, 해석을 확장하지 않고 서술 자체의 무게를 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
