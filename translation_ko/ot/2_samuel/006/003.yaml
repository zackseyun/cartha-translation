base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
  footnotes:
  - marker: a
    text: Or 'which was at Gibeah,' taking the phrase as a place name rather than a topographical description.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 하나님의 궤를 새 수레에 실어 언덕 위에 있던 아비나답의 집[a]에서 옮겼습니다. 그리고 아비나답의 아들 웃사와 아히요는 그 새 수레를 몰고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기브아에 있던 아비나답의 집’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ אֶת אֲרוֹן הָאֱלֹהִים אֶל עֲגָלָה חֲדָשָׁה
  english_pob_choice: They set the ark of God on a new cart
  chosen_korean: 하나님의 궤를 새 수레에 실어
  alternatives_korean:
  - 하나님의 궤를 새 수레 위에 올려
  - 하나님의 궤를 새 수레에 얹어
  lexicon: HALOT
  rationale: רכב의 사역적 용법을 한국어로 자연스럽게 옮기되, ‘실어’로 수레 위에 두는 구체적 동작을 살렸습니다.
- source_word: מִבֵּית אֲבִינָדָב
  english_pob_choice: from the house of Abinadab
  chosen_korean: 아비나답의 집에서
  alternatives_korean:
  - 아비나답 집에서
  lexicon: HALOT
  rationale: 구문 구조를 살려 소유격으로 옮겼으며, 본문 정보만으로 충분한 평이한 표현을 택했습니다.
- source_word: אֲשֶׁר בַּגִּבְעָה
  english_pob_choice: which was on the hill[a]
  chosen_korean: 그 집은 언덕 위에 있었고
  alternatives_korean:
  - 그것은 기브아에 있었고
  - 그 집은 기브아에 있었고
  lexicon: HALOT
  rationale: 히브리어는 지형 묘사로도, 지명 ‘기브아’로도 읽힐 수 있어 본문에는 지형 의미를 두고, 대안 독법은 각주로 보존했습니다.
- source_word: נֹהֲגִים
  english_pob_choice: were driving
  chosen_korean: '...를 몰고 있었습니다'
  alternatives_korean:
  - '...를 인도하고 있었습니다'
  - '...를 끌고 있었습니다'
  lexicon: HALOT
  rationale: 수레를 대상으로 한 נהג의 용법에 맞춰 ‘몰다’를 택해, 능동적으로 수레를 조종하는 장면을 분명히 했습니다.
