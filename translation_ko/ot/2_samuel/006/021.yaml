  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
  footnotes:
  - marker: a
    text: Or, “I danced before the LORD.” The Hebrew verb here is broader than a dance-specific term and can denote celebratory or playful action.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 미갈에게 말했습니다. “여호와 앞에서 한 일입니다. 그분은 당신의 아버지와 그의 온 집보다 나를 택하시고, 여호와의 백성, 곧 이스라엘 위에 통치자로 세우셨습니다. 나는 여호와 앞에서 기뻐하며 뛰놀았습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “나는 여호와 앞에서 춤추었습니다.” 이 히브리어 동사는 춤에만 한정되지 않으며, 축제적이거나 유희적인 행동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 여호와 앞에서
  alternatives_korean:
  - 여호와의 임재 앞에서
  - 여호와 앞에
  lexicon: HALOT
  rationale: לִפְנֵי는 단순한 공간보다 ‘~앞에서/면전에서’의 관계를 나타내므로, 반복되는 구절의 강조를 살리면서도 자연스러운 한국어인 ‘여호와 앞에서’로 옮겼습니다.
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  english_pob_choice: who chose me above your father and above all his house
  chosen_korean: 당신의 아버지와 그의 온 집보다 나를 택하셔서
  alternatives_korean:
  - 당신의 아버지와 그의 온 집 대신 나를 택하셔서
  - 당신의 아버지와 그의 온 집보다 나를 선택하셔서
  lexicon: HALOT
  rationale: בחר 뒤의 מן은 비교/분리의 뜻을 띠므로, 단순한 ‘대신’보다 비교를 드러내는 ‘보다’가 원문의 대조를 더 잘 보존합니다.
- source_word: לְצַוֹּת אֹתִי נָגִיד
  english_pob_choice: to appoint me ruler
  chosen_korean: 나를 통치자로 세우신
  alternatives_korean:
  - 나를 지도자로 임명하신
  - 나를 다스리는 자로 세우신
  lexicon: HALOT
  rationale: צוה는 여기서 ‘명령하다’보다 직분 부여의 뉘앙스를 가지므로 ‘세우다’로 옮겼고, נָגִיד는 권위를 가진 통치자를 가리켜 ‘통치자’가 가장 직접적입니다.
- source_word: וְשִׂחַקְתִּי
  english_pob_choice: I celebrated
  chosen_korean: 기뻐하며 몸을 움직였습니다
  alternatives_korean:
  - 춤추었습니다
  - 놀며 기뻐했습니다
  - 축하했습니다
  lexicon: HALOT
  rationale: שׂחק은 춤에만 한정되지 않는 더 넓은 즐거운/유희적 행동을 가리키므로, 앞선 춤 관련 동사들과 구별되도록 ‘기뻐하며 몸을 움직였습니다’로 번역해 축제적 행동의 넓은 의미를 살렸습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 여호와 대신 본문에는 ‘여호와’로 옮기되, 이 항목의 번역은 POB의 기존 영어 관행과 달리 한국어 성경 독자 친화적 표기를 따랐습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 한국어 성경 수용사에서 가장 널리 인지된 표기를 사용하되, 본문의 반복되는 하나님의 이름을 제목이 아니라 고유명으로 인식하게 하려는 번역 의도를 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: וְשִׂחַקְתִּי의 의미 범위
  chosen_reading: ‘기뻐하며 몸을 움직였습니다’로 넓게 번역하여, 춤으로만 좁히지 않았습니다.
  alternative_readings:
  - 춤추었습니다
  - 춤을 췄습니다
  - 즐겁게 행동했습니다
  rationale: 본문의 동사는 앞절의 춤 전용 동사들과 다르므로, 의미를 과도하게 특정하지 않고 의도된 기쁨의 공개적 표현을 보존하는 쪽이 원문 긴장을 더 잘 살립니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve tension rather than over-resolve'
