  to: 다윗이 미갈에게 말했습니다. “여호와 앞에서 한 일입니다. 그분은 당신의 아버지와 그의 온 집보다 나를 택하시고, 여호와의 백성, 곧 이스라엘 위에 통치자로 세우셨습니다. 나는 여호와 앞에서 기뻐하며 뛰놀았습니다[a].”
