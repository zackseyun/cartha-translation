source:
  edition: WLC
  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the slave girls of his slaves[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
  footnotes:
  - marker: a
    text: Or 'How glorious the king of Israel was today'—the Hebrew wording is overtly sarcastic in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'maidservants' for 'slave girls.' The Hebrew refers to female household dependents of low status.
    reason: lexical_alternative
  - marker: c
    text: Or 'as one of the worthless fellows shamelessly exposes himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗은 자기 집안을 축복하러 돌아왔습니다. 그런데 사울의 딸 미갈이 다윗을 맞으러 나와 말했습니다. 「오늘 이스라엘 왕이 얼마나 존귀하셨습니까! 오늘 자기 몸을 드러내어, 자기 노예들의 종들의 여종들 앞에서, 한낱 천한 사람들 가운데 하나처럼 몸을 드러내셨군요!」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오늘 이스라엘 왕이 얼마나 영광스러우셨습니까’—히브리어 표현은 문맥상 노골적인 비꼼입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여종들’. 히브리어는 낮은 신분의 여성 종속자를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘한낱 천한 자들 가운데 하나처럼 수치스럽게 몸을 드러내셨군요’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבָרֵךְ / בֵּיתוֹ
  english_pob_choice: to bless his household
  chosen_korean: 자기 집안을 축복하러
  alternatives_korean:
  - 자기 집을 축복하러
  - 자기 가족에게 축복을 빌러
  lexicon: HALOT
  rationale: בֵּיתוֹ는 물리적 집보다 집안/가족 구성원을 가리킬 수 있어, ‘집안’을 택해 다윗이 돌아가 가족과 집에 복을 빌려는 장면을 자연스럽게 살렸습니다.
- source_word: מִיכַל בַּת שָׁאוּל
  english_pob_choice: Michal daughter of Saul
  chosen_korean: 사울의 딸 미갈
  alternatives_korean:
  - 미갈, 사울의 딸
  - 사울의 딸인 미갈
  lexicon: HALOT
  rationale: 앱포지션을 한국어에서 가장 자연스럽게 살리기 위해 ‘사울의 딸 미갈’로 옮겼습니다. 사울 가문 정체성도 그대로 드러납니다.
- source_word: מַה נִּכְבַּד הַיּוֹם
  english_pob_choice: How honored ... was today
  chosen_korean: 오늘 이스라엘 왕이 얼마나 존귀하셨습니까
  alternatives_korean:
  - 오늘 이스라엘 왕이 얼마나 영광스러우셨습니까
  - 오늘 이스라엘 왕이 얼마나 높임을 받으셨습니까
  lexicon: HALOT
  rationale: כבד의 기본값인 ‘존귀하다/영광스럽다’를 살리되, 문맥상 비꼬는 말투가 드러나도록 감탄형으로 처리했습니다.
- source_word: נִגְלָה / כְּהִגָּלוֹת נִגְלוֹת
  english_pob_choice: uncovering himself ... shamelessly uncovers himself
  chosen_korean: 자기 몸을 드러내어 ... 몸을 드러내셨군요
  alternatives_korean:
  - 자기 몸을 드러내어 ... 천하게 벗으셨군요
  - 자기 몸을 드러내어 ... 수치스럽게 노출하셨군요
  lexicon: HALOT
  rationale: נִגְלָה의 핵심은 ‘드러내다/벗다’이지만, 본문 전체의 수치스러운 뉘앙스를 살리기 위해 ‘몸을 드러내다’로 옮겼습니다. 과도하게 해석적인 ‘노출하다’보다 원문에 가깝습니다.
- source_word: אַמְהוֹת עֲבָדָיו
  english_pob_choice: the slave girls of his slaves
  chosen_korean: 자기 노예들의 종들의 여종들
  alternatives_korean:
  - 자기 노예들의 여종들
  - 자기 종들의 여종들
  lexicon: HALOT
  rationale: אַמְהוֹת는 여종/여노예이고, עֲבָדָיו는 ‘그의 종들’이 아니라 POB가 지적하듯 ‘그의 노예들’입니다. 다만 ‘노예들의 종들의 여종들’은 한국어에서 중첩이 매우 어색하므로, 계층적 종속 관계를 최대한 보존하면서도 읽히도록 구성했습니다.
- source_word: אַחַד הָרֵקִים
  english_pob_choice: one of the vulgar fellows
  chosen_korean: 한낱 천한 사람들 가운데 하나처럼
  alternatives_korean:
  - 한낱 무가치한 자들 가운데 하나처럼
  - 천박한 사람들 가운데 하나처럼
  lexicon: HALOT
  rationale: ריקים는 ‘텅 빈 자들/무가치한 사람들’의 조롱어이므로, 한국어에서는 ‘천한 사람들’과 ‘한낱’으로 경멸을 살렸습니다. 파괴적 속어보다 문어적 모욕어가 적합합니다.
theological_decisions:
- issue: 노예/종의 사회적 위계 보존
  chosen_reading: אַמְהוֹת와 עֲבָדָיו를 각각 ‘여종’과 ‘노예들/종들’로 드러내어, 미갈의 조롱이 낮은 신분의 여성들 앞에서의 수치를 겨냥한다는 점을 보존했습니다.
  alternative_readings:
  - 여종들
  - 시녀들
  - 하인들
  rationale: 이 본문은 신분 차이를 조롱의 핵심으로 사용하므로, 완화된 표현보다 사회적 종속성을 드러내는 번역이 원문 의도에 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-status terminology policy
