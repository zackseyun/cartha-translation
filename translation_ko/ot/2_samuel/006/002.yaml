  rationale: 다윗의 ‘일어나 갔다’와 궤를 ‘끌어올리려고 했다’는 동작 관계를 원문대로 회복했습니다. 이어지는 명명 공식을 하나님의 궤에 직접 연결하고 ‘그 위에’를 남겨, 히브리어의 압축성과 문법적 지시를 과도하게 해소하지 않았습니다. 각주도 해당 표현 바로 뒤에 배치하고, b 각주의 비원문적 ‘곳’을 제거했습니다.
