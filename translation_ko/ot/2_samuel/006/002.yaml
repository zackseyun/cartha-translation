  terminology: ‘야훼’, ‘만군’, ‘하나님의 궤’, ‘그룹들’은 프로젝트 용어 정책 및 원문과 양립합니다. ‘그룹들 위에 좌정하시는’은 영어 감사본의 해석을 따르되, ‘그 위에 이름이 불리는’으로 히브리어의 명명 공식을 보존했습니다.
