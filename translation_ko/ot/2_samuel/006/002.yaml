base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
  footnotes:
  - marker: a
    text: Or “from Baalah of Judah.” The Hebrew form here is unusual and may reflect a place associated with Kiriath-jearim.
    reason: alternative_reading
  - marker: b
    text: Or “over which the name of the LORD of hosts is called.” The Hebrew naming formula is compressed and can be rendered more literally this way.
    reason: lexical_alternative
  - marker: c
    text: 'Traditional rendering: “the LORD of hosts.”'
    reason: lexical_alternative
  - marker: d
    text: Or “who dwells between the cherubim.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 일어나서 자기와 함께 있던 모든 백성과 함께 바알레유다에서 올라가 하나님 궤를 그곳에서 가져오려 하였는데, 그 궤는 이름으로 불리는 것, 곧 그룹들 위에 좌정하시는 야훼 만군의 이름으로 불리는 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형식은 이곳의 지명을 이례적으로 표기하며, 기럇여아림과 관련된 ‘바알라(유다)’를 가리킬 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “그 이름이 불리는 곳/위에 야훼 만군의 이름이 불리는 곳”의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: '전통적 번역: “만군의 여호와.”'
    reason: lexical_alternative
  - marker: d
    text: 또는 “그룹들 사이에 거하시는.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  english_pob_choice: arose and went
  chosen_korean: 일어나서 … 올라가
  alternatives_korean:
  - 일어나서 갔다
  - 일어나서 출발했다
  lexicon: HALOT
  rationale: 히브리어 연속 동작을 살리되, 문맥상 언약궤를 옮기러 가는 이동을 자연스럽게 드러내기 위해 ‘일어나서’와 ‘올라가’를 함께 살렸습니다.
- source_word: מִבַּעֲלֵי יְהוּדָה
  english_pob_choice: from Baale-judah
  chosen_korean: 바알레유다
  alternatives_korean:
  - 바알라 유다
  - 유다의 바알들
  lexicon: HALOT
  rationale: 이 표현은 여기서 지명으로 읽는 것이 가장 자연스러우므로 고유명사 형태를 유지했습니다. 영어 주석이 제시한 바알라/기럇여아림 가능성은 각주로 반영했습니다.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님 궤
  alternatives_korean:
  - 하나님의 궤
  - 언약궤
  lexicon: HALOT
  rationale: ‘하나님 궤’는 원문의 소유격 관계를 충분히 살리면서도 간결합니다. ‘언약궤’는 본절에 직접 없는 해석적 용어이므로 피했습니다.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  english_pob_choice: which is called by the Name
  chosen_korean: 이름으로 불리는 것
  alternatives_korean:
  - 그 이름이 불리는 것
  - 이름이 불려진 것
  lexicon: HALOT
  rationale: 압축된 명명 공식을 한국어로 너무 풀지 않으면서, 거룩한 ‘이름’의 표지를 보존했습니다.
- source_word: שֵׁם יְהוָה צְבָאוֹת
  english_pob_choice: the name of Yahweh of Armies
  chosen_korean: 야훼 만군의 이름
  alternatives_korean:
  - 야훼 군대들의 이름
  - 여호와 만군의 이름
  lexicon: HALOT
  rationale: 여호와를 피하고 야훼를 사용했으며, צְבָאוֹת은 전통어 ‘만군’을 택해 신학적 밀도와 한국어 관용을 함께 살렸습니다.
- source_word: יֹשֵׁב הַכְּרֻבִים
  english_pob_choice: who is enthroned above the cherubim
  chosen_korean: 그룹들 위에 좌정하시는
  alternatives_korean:
  - 그룹들 사이에 거하시는
  - 그룹들 위에 앉아 계시는
  lexicon: HALOT
  rationale: יֹשֵׁב은 단순 거주보다 왕좌의 이미지가 강하므로 ‘좌정하시는’으로 옮겼고, כְּרוּבִים는 성경적 관용에 따라 ‘그룹들’로 번역했습니다.
theological_decisions:
- issue: יהוה / YHWH의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본어를 따르되, 본절의 명시적 신명은 가리기보다 드러내는 쪽이 원문의 언약적 강조를 더 잘 전달합니다.
  doctrine_reference: project glossary — יהוה / YHWH
- issue: 거룩한 이름 공식의 압축성
  chosen_reading: 이름으로 불리는 것, 곧 그룹들 위에 좌정하시는 야훼 만군의 이름으로 불리는 것입니다
  alternative_readings:
  - 이름이 불려 있는 것
  - 그 이름이 불려진 것
  rationale: 히브리어의 압축된 신명 공식은 소유나 단순 표지가 아니라 언약적 현존과 권위를 가리키므로, 한국어에서도 그 신학적 중량을 유지했습니다.
  doctrine_reference: Translation philosophy §3
