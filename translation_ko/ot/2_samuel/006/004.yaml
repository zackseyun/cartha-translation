  source_fidelity: ‘메고 왔으며’는 נשׂא의 운반 의미를 전달하지만, 물건을 몸에 지고 운반했다는 방식을 덧붙입니다. 특히 앞 절의 새 수레 맥락을 고려하면 이를 피하는 것이 안전합니다. 또한 본문의 3남성 단수 목적어와 ‘하나님의 궤와 함께’라는 다소 난해한 결합은 한국어에서도 해소하거나 동일시하지 않는 편이 원문에 충실합니다. גִּבְעָה의 일반명사/지명 양의성은 본문과 각주로 보존됩니다.
  naturalness: 원문의 삽입식 반복인 ‘아비나답의 집에서 — 곧 언덕 위에 있는 집에서 —’는 한국어로 부자연스럽고 불필요하게 반복됩니다. ‘언덕에 있는 아비나답의 집’으로 자연스럽게 옮기고, 각주 표지는 해당 어구 바로 뒤에 둡니다. ‘그 궤’보다 ‘궤’가 앞의 명사를 자연스럽게 이어 줍니다.
  terminology: ‘하나님의 궤’, ‘아비나답’, ‘아히오’, ‘기브아’는 적절합니다. ‘운반하다’는 운반 방식을 과도하게 특정하지 않으면서 문맥에 맞습니다.
