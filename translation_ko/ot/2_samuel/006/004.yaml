source:
  edition: WLC
  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
  footnotes:
  - marker: a
    text: Or 'which was in Gibeah.' The Hebrew גִּבְעָה can be read as the common noun 'hill' or as the place name 'Gibeah.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 하나님의 궤와 함께 아비나답의 집에서 — 곧 언덕 위에 있는 집에서 — 그것을 메고 왔으며, 아히오는 궤 앞에서 걸어가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּבְעָה는 흔히 ‘언덕’으로도, ‘기브아’라는 지명으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  english_pob_choice: They carried it
  chosen_korean: 그들은 … 그것을 메고 왔으며
  alternatives_korean:
  - 그들은 … 그것을 실어 나왔으며
  - 그들은 … 그것을 옮겼으며
  lexicon: HALOT
  rationale: נשא의 이동 의미를 살리되, 궤를 운반하는 맥락에서 한국어로는 ‘메고 왔습니다’가 가장 자연스럽고 구체적인 이동 표현입니다.
- source_word: מִבֵּית אֲבִינָדָב אֲשֶׁר בַּגִּבְעָה
  english_pob_choice: from the house of Abinadab, which was on the hill
  chosen_korean: 아비나답의 집에서 — 곧 언덕 위에 있는 집에서 —
  alternatives_korean:
  - 아비나답의 집에서
  - 아비나답의 집에서 — 곧 기브아에 있는 집에서 —
  lexicon: HALOT
  rationale: גִּבְעָה를 공통명사 ‘언덕’으로 본 본문 해석을 반영하되, 지명 ‘기브아’ 가능성도 문맥상 보존하기 위해 설명형 삽입구를 넣었습니다.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  english_pob_choice: with the ark of God
  chosen_korean: 하나님의 궤와 함께
  alternatives_korean:
  - 하나님의 궤를 따라
  - 하나님의 궤와 더불어
  lexicon: HALOT
  rationale: עִם의 동반 의미를 직역에 가깝게 살려, 왕도행렬의 동시 진행을 드러내는 ‘와 함께’를 선택했습니다.
- source_word: וְאַחְיוֹ הֹלֵךְ לִפְנֵי הָאָרוֹן
  english_pob_choice: and Ahio was walking before the ark
  chosen_korean: 아히오는 궤 앞에서 걸어가고 있었습니다
  alternatives_korean:
  - 아히오는 궤 앞에서 걷고 있었습니다
  - 아히오는 궤 앞을 걸어가고 있었습니다
  lexicon: HALOT
  rationale: הלך의 진행상을 살리기 위해 ‘걸어가고 있었습니다’를 택했고, לפני는 공간 관계를 분명히 하는 ‘앞에서’로 옮겼습니다.
