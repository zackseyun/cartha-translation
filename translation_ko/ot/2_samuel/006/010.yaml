  source_fidelity: ‘언약궤’는 문맥상 가리키는 대상을 분명히 하지만 원문의 אֲרוֹן(‘궤’)에 없는 ‘언약’을 보태므로, 여기서는 ‘야훼의 궤’가 더 직접적입니다. וַיַּטֵּהוּ는 단순히 ‘돌려서’가 아니라 궤의 행선지를 다른 곳으로 돌린 행위를 뜻하므로 ‘돌려 옮겼습니다’로 명시하는 편이 충실합니다.
