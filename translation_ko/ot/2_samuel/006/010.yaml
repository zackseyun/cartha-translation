source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֣ה דָוִ֗ד לְ/הָסִ֥יר אֵלָ֛י/ו אֶת אֲר֥וֹן יְהוָ֖ה עַל עִ֣יר דָּוִ֑ד וַ/יַּטֵּ֣/הוּ דָוִ֔ד בֵּ֥ית עֹבֵֽד אֱד֖וֹם הַ/גִּתִּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
  footnotes:
  - marker: a
    text: Or 'up to the City of David.' The Hebrew preposition can suggest movement upward/toward as well as simple destination.
    reason: lexical_alternative
  - marker: b
    text: Or 'the man from Gath' for 'the Gittite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 야훼의 궤를 자기에게로, 곧 다윗 성읍으로[a] 가져오기를 원하지 않았습니다. 그래서 다윗은 그것을 가드 사람 오벧에돔의 집으로[b] 돌려 옮겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다윗 성읍으로’로 옮긴 히브리어 전치사 עַל은 ‘~쪽으로’ 또는 ‘~위로’의 방향을 나타낼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가드 사람’은 ‘깃 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  english_pob_choice: was not willing
  chosen_korean: 원하지 않았습니다
  alternatives_korean:
  - 마음이 없었습니다
  - 허락하지 않았습니다
  - 거절했습니다
  lexicon: HALOT
  rationale: אָבָה는 단순한 감정적 비호감보다 의사·승낙의 문제를 나타내므로, ‘원하지 않았습니다’가 reluctance의 뉘앙스를 비교적 자연스럽게 살립니다.
- source_word: לְהָסִיר אֵלָיו
  english_pob_choice: to bring ... to himself
  chosen_korean: 자기에게로 가져오기를
  alternatives_korean:
  - 자기에게로 옮기기를
  - 자기에게로 가져가기를
  - 자기에게로 옮겨 오기를
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘비켜 옮기다/돌리다’보다, 여기서는 궤를 다윗의 거처 쪽으로 들여오는 방향성이 핵심이므로 ‘가져오다’로 자연스럽게 옮겼습니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 궤
  - 여호와의 궤
  - 주님의 궤
  lexicon: HALOT
  rationale: 아론/언약궤는 한국어 성경에서 ‘언약궤’가 의미를 가장 분명히 드러내므로 채택했고, YHWH는 본 번역 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: עַל עִיר דָּוִד
  english_pob_choice: into the City of David
  chosen_korean: 다윗 성읍으로
  alternatives_korean:
  - 다윗 성읍 안으로
  - 다윗 성읍 위로
  - 다윗 성읍까지
  lexicon: HALOT
  rationale: עַל의 방향성은 ‘~로/~쪽으로’가 자연스럽고, 문맥상 목적지는 다윗의 성읍이므로 간결하게 처리했습니다.
- source_word: הַגִּתִּי
  english_pob_choice: the Gittite
  chosen_korean: 깃 사람
  alternatives_korean:
  - 깃 사람
  - 가드 사람
  - 깃 사람(가드 출신)
  lexicon: HALOT
  rationale: 지명형 형용사는 한국어 성경 관용에 맞춰 ‘~사람’으로 풀되, 본문의 지리적 출신을 드러내기 위해 ‘깃 사람’을 택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
