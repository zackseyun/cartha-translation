id: 2SA.6.15
reference: 2 Samuel 6:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דָוִד֙ וְ/כָל בֵּ֣ית יִשְׂרָאֵ֔ל מַעֲלִ֖ים אֶת אֲר֣וֹן יְהוָ֑ה בִּ/תְרוּעָ֖ה וּ/בְ/ק֥וֹל שׁוֹפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
  footnotes:
  - marker: a
    text: Or 'with a shout of joy'; the Hebrew term can denote jubilant acclamation.
    reason: lexical_alternative
  - marker: b
    text: Or 'with the sound of the trumpet'; the Hebrew shofar refers to a horn, often a ram's horn.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 다윗과 이스라엘 온 집안은 환호와 뿔나팔 소리와 함께 야훼의 궤를 올려가고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기쁨의 외침’. 히브리어는 환호성이나 기쁨의 함성을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나팔 소리’. 히브리어 쇼파르는 뿔나팔, 흔히 숫양의 뿔로 만든 나팔을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָוִד֙ וְ/כָל בֵּ֣ית יִשְׂרָאֵ֔ל
  english_pob_choice: So David and all the house of Israel
  chosen_korean: 그렇게 다윗과 온 이스라엘의 집합
  alternatives_korean:
  - 다윗과 이스라엘의 모든 집안
  - 다윗과 온 이스라엘
  lexicon: HALOT
  rationale: בֵּית יִשְׂרָאֵל은 문자적으로는 ‘이스라엘의 집’이지만, 한국어에서는 그 집합적 의미를 살려 ‘온 이스라엘의 집합’으로 옮겼습니다. ‘집’만 직역하면 어색하고, 단순히 ‘온 이스라엘’로 풀면 원문의 집합적 표현이 약해집니다.
- source_word: מַעֲלִים
  english_pob_choice: were bringing up
  chosen_korean: 궤를 메고 올라가고 있었습니다
  alternatives_korean:
  - 올려가고 있었습니다
  - 메고 올리고 있었습니다
  lexicon: HALOT
  rationale: 히필 분사형의 진행성을 살려 ‘-고 있었습니다’로 옮겼고, 언약궤 운반 문맥에 맞게 ‘메고 올라가다’라는 자연스러운 한국어 표현을 택했습니다. 단순 과거보다 진행 중인 행위를 드러냅니다.
- source_word: תְּרוּעָה
  english_pob_choice: with shouting
  chosen_korean: 외침
  alternatives_korean:
  - 환호
  - 기쁨의 외침
  - 함성
  lexicon: HALOT
  rationale: תְּרוּעָה는 단순한 소리보다 함성·환호를 아우르는 소리이므로, 너무 해설적인 ‘기쁨의 외침’보다 중립적인 ‘외침’을 택했습니다. 앞뒤 문맥에서 이미 축제적 분위기는 드러납니다.
- source_word: ק֥וֹל שׁוֹפָר
  english_pob_choice: with the sound of the horn
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 뿔나팔 소리
  - 숫양 뿔의 소리
  - 쇼파르 소리
  lexicon: HALOT
  rationale: שׁוֹפָר는 고대 이스라엘의 뿔나팔이므로, 현대 한국어 독자에게 바로 이해되는 ‘나팔 소리’로 옮겼습니다. ‘뿔나팔’은 더 근접하지만 다소 설명적이어서 본문 흐름을 고려해 간결하게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 방침에 따라 신명은 전통적 대체어가 아니라 음역 ‘야훼’로 유지했습니다. 원문의 고유한 언약명을 드러내기 위한 선택입니다.
theological_decisions:
- issue: 언약궤 운반 동작의 지속성
  chosen_reading: ‘메고 올라가고 있었습니다’로 진행 상황을 드러냈습니다.
  alternative_readings:
  - ‘메고 올랐습니다’
  - ‘메고 올라갔습니다’
  rationale: 히브리어 분사 מַעֲלִים은 서술 시점의 진행을 나타내므로, 단회 완료형보다 지속적 진행을 표현하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 문법-시제/상(aspect) 보존 원칙
- issue: תְּרוּעָה의 음성적 성격
  chosen_reading: ‘외침’으로 옮겨 인간의 환호성을 살렸습니다.
  alternative_readings:
  - ‘나팔 소리’
  - ‘환호’
  rationale: 본문은 곧바로 ‘나팔 소리’를 덧붙이므로, 앞의 תְּרוּעָה를 같은 종류의 악기 소리로 중복시키지 않고 사람의 외침으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 어휘 중복 최소화와 문맥 우선 원칙
