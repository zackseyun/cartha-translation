  - 드리기를 마치고
  lexicon: HALOT
  rationale: 완료 동작을 나타내는 כלה와 제사 문맥의 עלה를 자연스럽게 살려, 앞선 제사 행위가 끝난 뒤 다음 동작이 이어짐을 한국어 서술로 분명히 했습니다.
- source_word: הָעֹלָה
