  lexicon: HALOT
  rationale: עֹלָה는 제사 용어로 한국어 성경에서 널리 쓰이는 번제를 사용해 의미를 분명히 했습니다.
- source_word: וְהַשְּׁלָמִים
  english_pob_choice: the peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 화목제
  - 평화제물
  - 교제제물
  lexicon: HALOT
  rationale: שְׁלָמִים의 의미 범위를 살리되, 제물로 드려지는 대상을 분명히 하기 위해 복수 개념을 한국어 단수 집합명사인 화목제물로 옮겼습니다.
- source_word: יְהוָה צְבָאֽוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 야훼의 이름
  alternatives_korean:
