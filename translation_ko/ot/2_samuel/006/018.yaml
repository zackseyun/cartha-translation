  - 야훼 만군의 이름
  lexicon: HALOT
  rationale: 문맥상 בְּשֵׁם은 ‘이름으로/권위로’를 뜻하므로 핵심 의미를 살려 ‘야훼의 이름으로’로 옮겼고, צְבָאוֹת는 소리값만 붙이기보다 본문이 전달하는 호칭 전체를 주석에서 보완하는 편이 더 직접적입니다.
