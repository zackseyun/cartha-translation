  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל ... מֵהַעֲלוֹת
  english_pob_choice: had finished offering
  chosen_korean: 드리는 일을 마친 뒤
  alternatives_korean:
