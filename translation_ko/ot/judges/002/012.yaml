source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
  footnotes:
  - marker: a
    text: Or, 'from the gods of the surrounding peoples.' The Hebrew phrase may be understood more generally of the gods worshiped by the peoples around Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 조상들의 하나님 야훼를 버렸습니다. 그는 그들을 이집트 땅에서 이끌어 내신 분인데, 그들은 다른 신들을 따랐습니다. 곧 그들 주변에 있는 민족들의 신들 가운데서 나온 것들입니다. 그들은 그것들에게 엎드려 절했고, 야훼를 격노하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들 주변 민족들이 섬기던 신들 가운데서’. 히브리어 표현은 더 일반적으로 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  english_pob_choice: abandoned
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 떠났습니다
  - 저버렸습니다
  lexicon: HALOT
  rationale: עזב는 단순 이동이 아니라 언약적·관계적 단절을 뜻하므로, 현대 한국어에서 그 긴장을 살리기 위해 ‘버렸습니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기 יְהוָה는 POB 방침에 따라 титула가 아닌 고유명으로 ‘야훼’로 옮겼습니다.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: who had brought them out from the land of Egypt
  chosen_korean: 그들을 이집트 땅에서 이끌어 내신 분인데
  alternatives_korean:
  - 그들을 이집트 땅에서 데리고 나오신 분인데
  - 그들을 이집트 땅에서 인도하여 내신 분인데
  lexicon: HALOT
  rationale: 분사구는 야훼를 출애굽 행위로 규정하는 수식절이므로, 완료된 구원 행위를 드러내는 ‘이끌어 내신 분’으로 옮겼습니다.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  english_pob_choice: went after
  chosen_korean: 따랐습니다
  alternatives_korean:
  - 뒤따랐습니다
  - 갔습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 충성의 방향 전환을 뜻하므로, 현대어로 자연스러우면서도 대상 추종의 의미를 드러내는 ‘따랐습니다’가 적절합니다.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  english_pob_choice: from among the gods of the peoples who were around them
  chosen_korean: 그들 주변에 있는 민족들의 신들 가운데서 나온 것들입니다
  alternatives_korean:
  - 그들 주변 민족들의 신들 가운데서
  - 그들을 둘러싼 민족들의 신들 가운데서
  lexicon: HALOT
  rationale: מִן의 부분적 용법을 살려 ‘가운데서 나온 것들’로 옮겨, 주변 민족들의 신들 중 일부를 취했다는 뉘앙스를 반영했습니다.
- source_word: וַיִּשְׁתַּחֲוּוּ לָהֶם
  english_pob_choice: they bowed down to them
  chosen_korean: 그것들에게 엎드려 절했고
  alternatives_korean:
  - 그것들에게 절했고
  - 그것들 앞에 엎드렸고
  lexicon: HALOT
  rationale: 동사는 육체적 굴복을 뜻하며 우상숭배의 행위로 연결되므로, ‘엎드려 절했고’로 구체성을 살렸습니다.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  english_pob_choice: provoked Yahweh to anger
  chosen_korean: 야훼를 격노하게 했습니다
  alternatives_korean:
  - 야훼를 화나게 했습니다
  - 야훼의 분노를 샀습니다
  lexicon: HALOT
  rationale: כעס의 히필형은 ‘분노하게 하다/격노하게 하다’의 원인적 의미이므로, 보다 강한 결과를 드러내는 ‘격노하게 했습니다’를 선택했습니다.
theological_decisions:
- issue: 야훼의 이름과 이스라엘의 언약 파기 표현
  chosen_reading: 본문은 ‘버렸습니다’와 ‘격노하게 했습니다’로, 관계 단절과 언약적 충돌을 직접 드러내되 해설을 덧붙이지 않습니다.
  alternative_readings:
  - 단순히 ‘떠났습니다’로 완화하기
  - ‘언약을 깨뜨렸습니다’라고 명시적으로 풀어 쓰기
  rationale: 히브리어 동사의 강도와 서술의 신학적 무게를 유지하는 것이 중요하므로, 본문 자체가 말하는 배교의 실재를 직접 드러내는 방향으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
