  rationale: 본문은 하나님을 지칭하는 일반 칭호가 아니라 언약적 고유명사 יְהוָה를 사용하므로, 대체 칭호보다 이름 자체를 드러내는 번역이 소스의 힘을 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy'
- issue: עשתרות의 복수성
  chosen_reading: 한국어 본문은 '아스다롯'으로 자연스럽게 옮기고, 히브리어 복수형의 해석 여지는 본문 밖 설명으로 남깁니다.
  alternative_readings:
  - 아스다롯들
  - 아스다르트들
  - 아슈타롯
  rationale: 히브리어 복수형은 중요한 관찰이지만, 한국어 본문에서 억지스러운 복수 표지로 읽기 부담을 늘리기보다 표준 음역을 사용하고, 필요 시 주석에서 복수형 정보를 보완하는 편이 자연스럽습니다.
  doctrine_reference: Translation philosophy §3, §5
