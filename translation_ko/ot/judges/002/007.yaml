  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the great work'' could also be rendered ''the great deed'' or ''the great act.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 백성이 여호와를 여호수아의 모든 날 동안과, 여호수아 뒤에 오래 살아남은 장로들의 모든 날 동안 섬겼습니다. 그들은 여호와께서 이스라엘을 위해 행하신 그 모든 큰 행위를 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 큰 행위’는 ‘그 큰 일’ 또는 ‘그 큰 행동’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  english_pob_choice: served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 봉사했습니다
  - 예배했습니다
  lexicon: HALOT
  rationale: 여호와를 목적어로 한 עבד는 단순한 예배보다 더 넓은 언약적 섬김을 뜻하므로, 그 폭을 살리는 ‘섬기다’가 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 이 구절의 본문과 기존 POB 기준을 따라 신명기를 제외한 서사 문맥에서는 전통적으로 널리 인식되는 ‘여호와’를 사용했습니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 노인들
  - 지도자들
  lexicon: HALOT
  rationale: 단순한 연령이 아니라 이스라엘 공동체의 공적 지도층을 가리키므로, 한국어 성경에서 자연스러운 ‘장로들’이 적합합니다.
- source_word: מַעֲשֵׂה הַגָּדוֹל
  english_pob_choice: the great work
  chosen_korean: 그 모든 큰 행위
  alternatives_korean:
  - 그 모든 큰 일
  - 그 모든 위대한 행위
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 ‘일/행위’의 폭을 가지며, האנגלית POB의 ‘work’가 가리키는 집합적 의미를 한국어에서는 ‘행위’로 옮겨 하나님의 구원 행사를 분명히 했습니다.
theological_decisions:
- issue: 여호와의 이름을 어떻게 옮길지
  chosen_reading: 본문의 하나님의 언약 이름을 ‘여호와’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 주어가 제목이 아닌 고유한 언약 이름 יְהוָה이므로, 익숙한 교회적 호칭보다 이름 자체를 드러내는 번역이 본문의 식별성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
