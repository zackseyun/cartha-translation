translation:
  language: ko
  text: 백성은 여호수아가 살아 있는 모든 날 동안, 그리고 여호수아가 죽은 뒤에도 오래 살았으며 야훼께서 이스라엘을 위해 행하신 모든 큰 일을 보았던 장로들이 살아 있는 모든 날 동안 야훼를 섬겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘큰 일’은 ‘큰 행위’ 또는 ‘큰 활동’으로도 옮길 수 있습니다.
    reason: lexical_alternative
