  source_fidelity: 수정이 필요합니다. 원문의 관계절은 ‘여호수아 뒤에 오래 살았던 장로들’을 수식하며, 그 장로들이 여호와의 큰 일을 보았다고 말합니다. 초안의 ‘그들은’은 선행사가 모호합니다. 또한 מַעֲשֵׂה는 단수 집합명사이므로 ‘그 모든 큰 행위’보다 ‘모든 큰 일’이 더 자연스럽고 본문에 가깝습니다.
