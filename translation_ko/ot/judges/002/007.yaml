- from: 백성이 여호와를 여호수아의 모든 날 동안과, 여호수아 뒤에 오래 살아남은 장로들의 모든 날 동안 섬겼습니다. 그들은 여호와께서 이스라엘을 위해 행하신 그 모든 큰 행위를 보았습니다.[a]
  to: 백성은 여호수아가 살아 있는 모든 날 동안, 그리고 여호수아가 죽은 뒤에도 오래 살았으며 야훼께서 이스라엘을 위해 행하신 모든 큰 일을 보았던 장로들이 살아 있는 모든 날 동안 야훼를 섬겼습니다.[a]
