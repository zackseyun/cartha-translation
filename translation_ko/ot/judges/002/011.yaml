source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' Literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'worshiped the Baals.' The Hebrew verb can denote service rendered in worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 야훼 보시기에 악한 일을 행했고, 바알들을 섬겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘섬겼습니다’는 여기서 ‘예배했습니다’로 옮길 수도 있으나, 원어의 넓은 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: WLC; HALOT
  rationale: 히브리어의 직역 구조를 살리되, 한국어에서는 ‘자손’이 관용적으로도 자연스럽고 남성 중심의 계보 표현을 유지합니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에서
  - 야훼 앞에서
  lexicon: WLC; HALOT
  rationale: ‘눈에’라는 히브리어 관용을 한국어의 ‘보시기에’로 옮겨, 하나님의 평가라는 의미를 자연스럽게 드러냈습니다.
- source_word: וַיַּעַבְדוּ
  english_pob_choice: served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 예배했습니다
  - 봉사했습니다
  lexicon: WLC; HALOT
  rationale: 우상 숭배 문맥이지만, 영어 POB의 ‘served’처럼 원어의 넓은 의미를 유지하기 위해 ‘섬기다’를 택했습니다. ‘예배하다’는 의미를 과도하게 좁힐 수 있습니다.
- source_word: הַבְּעָלִים
  english_pob_choice: the Baals
  chosen_korean: 바알들을
  alternatives_korean:
  - 바알 신들을
  - 바알들
  lexicon: WLC; HALOT
  rationale: 히브리어 복수형을 그대로 반영해, 지역적·다원적 바알 숭배의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명문을 번역어로 가리지 않고 고유명사로 드러내는 POB 원칙을 따랐습니다.
  doctrine_reference: Contested terms — YHWH → Yahweh
- issue: עבד의 의미 범위
  chosen_reading: 섬겼습니다
  alternative_readings:
  - 예배했습니다
  - 종노릇했습니다
  rationale: 문맥상 우상 숭배를 가리키지만, 히브리어 עבד의 기본 의미와 언약적 대조(야훼를 섬김 vs. 다른 신을 섬김)를 보존하기 위해 ‘섬기다’를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
