source:
  edition: WLC
  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
  footnotes:
  - marker: a
    text: Joshua 24:30 reads 'Timnath-serah' instead of 'Timnath-heres.' The difference is preserved here as a place-name variation in parallel burial notices.
    reason: textual_variant
translation:
  language: ko
  text: 그들은 그의 기업의 경계 안에 있는 팀낫헤레스, 에브라임 산지, 곧 가아스 산의 북쪽에 그를 장사하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘기업’은 분배받은 땅, 곧 상속 유산의 뉘앙스를 살린 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  english_pob_choice: And they buried
  chosen_korean: 그들은 … 장사하였습니다
  alternatives_korean:
  - 그들은 … 묻었습니다
  - 그들은 … 매장하였습니다
  lexicon: WLC
  rationale: 서술 진행형의 wayyiqtol을 한국어 과거 서술로 옮기되, 장례 맥락에서는 ‘장사하다’가 인물의 매장을 자연스럽고 격식 있게 전달합니다.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  english_pob_choice: within the territory of his inheritance
  chosen_korean: 그의 기업의 경계 안에
  alternatives_korean:
  - 그의 상속 땅 경계 안에
  - 그의 분깃의 경계 안에
  lexicon: HALOT
  rationale: גְּבוּל과 נַחֲלָה의 결합은 단순한 ‘땅’보다 언약적 분배지를 가리키므로, ‘기업’으로 그 유산·분깃의 뉘앙스를 살렸습니다.
- source_word: בְּתִמְנַת חֶרֶס
  english_pob_choice: in Timnath-heres
  chosen_korean: 팀낫헤레스
  alternatives_korean:
  - 팀낫헤레스에
  - 팀낫헤레스에서
  lexicon: HALOT
  rationale: 지명은 음역을 유지하되, 한국어에서는 격조사를 뒤에 붙여 자연스러운 문장 흐름을 만들 수 있어도 본문은 간결하게 처리했습니다.
- source_word: בְּהַר אֶפְרָיִם
  english_pob_choice: in the hill country of Ephraim
  chosen_korean: 에브라임 산지
  alternatives_korean:
  - 에브라임의 산지
  - 에브라임 산지에
  lexicon: HALOT
  rationale: הַר는 이 표현에서 단일 산이 아니라 산지를 뜻하므로, 관용적으로 쓰이는 ‘산지’가 지리적 의미를 정확히 반영합니다.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  english_pob_choice: north of Mount Gaash
  chosen_korean: 곧 가아스 산의 북쪽에
  alternatives_korean:
  - 가아스 산 북쪽에
  - 가아스 산의 북편에
  lexicon: HALOT
  rationale: מִצְּפוֹן은 상대적 위치를 나타내므로 ‘북쪽에’로 옮기고, 뒤의 지명을 연결하는 ‘곧’을 넣어 원문의 지시 관계를 분명히 했습니다.
theological_decisions:
- issue: יעבד burial notice and place-name variation in parallel tradition
  chosen_reading: 본문을 역사 서술로 읽고, 지명은 다른 전승과의 변이 가능성을 본문 안에서 보존합니다.
  alternative_readings:
  - 조화시켜 동일 지명으로 통일함
  - 주석 없이 단순한 지명 차이로 넘김
  rationale: 이 절은 예수아의 매장 장소를 전하는 간단한 장례 기록이며, 지명 변이는 병행 본문 비교에서 중요한 자료이므로 본문 번역에서는 그대로 유지하는 편이 더 정직합니다.
  doctrine_reference: 본문비평과 역사서 읽기
