  source_fidelity: 원문의 두 동작(여호수아가 백성을 떠나보냄; 이스라엘 자손이 각자의 기업으로 감)과 목적 부정사 ‘그 땅을 차지하기 위해’를 모두 보존해야 합니다. 현 문안의 ‘가서 … 차지하러 갔습니다’는 목적 표현과 이동 동작을 중복하여 원문의 구문 관계를 흐립니다.
  naturalness: ‘이스라엘의 아들들’은 한국어에서 자연스러운 집단 명칭으로 잘 기능하지 않아 실제 혈연상 남성 자녀만을 가리키는 듯 들릴 수 있습니다. 성서 한국어에서 정착되어 있고 원문의 집단적 관용구를 자연스럽게 전달하는 ‘이스라엘 자손’이 적절합니다. 또한 문장을 나누고 목적절을 앞세우면 현대 표준어 합쇼체로 명료합니다.
