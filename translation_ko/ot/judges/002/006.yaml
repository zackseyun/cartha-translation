  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' Literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호수아가 백성을 떠나보냈고, 이스라엘의 아들들은 각각 자기 기업으로 가서 그 땅을 차지하러 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 문자적으로는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  english_pob_choice: sent ... away
  chosen_korean: 떠나보냈고
  alternatives_korean:
  - 보냈고
  - 해산시켰고
  - 돌려보냈고
  lexicon: HALOT
  rationale: 문맥상 단순 발신이 아니라 사람들을 떠나가게 하는 의미이므로, 자연스러운 합쇼체로 ‘떠나보냈고’가 원문의 사역성과 POB의 ‘sent ... away’를 잘 살립니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 원문의 남성 복수 표지를 살리기 위해 성중립화하지 않고 직역에 가까운 ‘이스라엘의 아들들’을 택했습니다.
- source_word: לְנַחֲלָתוֹ
  english_pob_choice: to his inheritance
  chosen_korean: 자기 기업으로
  alternatives_korean:
  - 자기 상속분으로
  - 자기 몫으로
  - 자기 유업으로
  lexicon: HALOT
  rationale: 여기서 נחלה는 가나안 땅의 언약적 분배 몫을 가리키므로, 한국어 성경에서 익숙하면서도 그 의미를 유지하는 ‘기업’이 가장 적절합니다.
- source_word: לָרֶשֶׁת
  english_pob_choice: to take possession of
  chosen_korean: 그 땅을 차지하러
  alternatives_korean:
  - 그 땅을 점유하러
  - 그 땅을 소유하러
  - 그 땅을 얻으러
  lexicon: HALOT
  rationale: 동사는 단순 소유가 아니라 실제로 점유·정복하여 차지하는 동작을 가리키므로, 목적 표현으로 ‘차지하러’가 가장 직접적입니다.
theological_decisions:
- issue: 가나안 땅 분배의 언약적 표현
  chosen_reading: 기업
  alternative_readings:
  - 상속분
  - 몫
  - 소유
  rationale: ‘기업’은 단순 재산보다 이스라엘이 하나님으로부터 받은 분배 몫이라는 언약적 뉘앙스를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #1, #5'
