- from: 그때 여호수아가 백성을 떠나보냈고, 이스라엘의 아들들은 각각 자기 기업으로 가서 그 땅을 차지하러 갔습니다.[a]
  to: 그때 여호수아가 백성을 떠나보냈습니다. 이스라엘 자손은 그 땅을 차지하기 위해 각자 자기 기업으로 갔습니다.[a]
  rationale: 문장을 두 개로 나누어 서술 사건을 분명히 하고, 목적 부정사 לָרֶשֶׁת를 ‘그 땅을 차지하기 위해’로 옮겨 ‘갔다’의 목적을 명료하게 했습니다. ‘이스라엘 자손’은 원문의 집단적 성서 관용구를 현대 한국어에서 자연스럽고 충실하게 전달하며, 문자적 ‘아들들’은 각주에 보존했습니다.
