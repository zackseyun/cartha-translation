  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּתְּנֵ/ם֙ בְּ/יַד שֹׁסִ֔ים וַ/יָּשֹׁ֖סּוּ אוֹתָ֑/ם וַֽ/יִּמְכְּרֵ֞/ם בְּ/יַ֤ד אֽוֹיְבֵי/הֶם֙ מִ/סָּבִ֔יב וְ/לֹֽא יָכְל֣וּ ע֔וֹד לַ/עֲמֹ֖ד לִ/פְנֵ֥י אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
  footnotes:
  - marker: a
    text: Or 'the anger of the LORD was kindled against Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of,' an idiom meaning into the power of.
    reason: cultural_note
  - marker: c
    text: Or 'their enemies on every side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 분노가 이스라엘을 향해 타올랐습니다. 야훼께서는 그들을 약탈자들의 손에[a] 넘기셨고, 약탈자들은 그들을 약탈했습니다. 또 그들을 사방에 있는 원수들의 손에 파셨으므로, 그들은 그 원수들 앞에 더 이상 설 수 없었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘약탈자들의 손에’입니다. 이 절에서 ‘손에’는 히브리어 관용으로, 누군가의 권세나 통제 아래로 넘겨졌다는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘사방에 있는 원수들’입니다. 둘러싸고 있는 원수들을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: the anger ... burned
  chosen_korean: 분노가 ... 타올랐습니다
  alternatives_korean:
  - 분노가 ... 불탔습니다
  - 진노하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘코/분노가 타다’라는 관용을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 계약 이름 יְהוָה를 제목어로 바꾸지 않고 고유명으로 보존하기 위해 ‘야훼’를 사용했습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에 넘기셨고
  alternatives_korean:
  - 손에 주셨고
  - 권세 아래 두셨고
  lexicon: HALOT
  rationale: ‘손에’는 지배권/통제권 안으로 넘겨짐을 뜻하는 히브리어 관용을 보존하며, 한국어에서는 ‘넘기다’가 가장 자연스럽습니다.
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  english_pob_choice: plunderers / who plundered them
  chosen_korean: 약탈자들 / 그들이 그들을 약탈했습니다
  alternatives_korean:
  - 노략하는 자들 / 그들이 노략질했습니다
  - 침략자들 / 그들이 그들을 노략했습니다
  lexicon: HALOT
  rationale: 동일 어근의 명사-동사 연결을 한국어에서도 유지해, 징계의 구체성을 드러내도록 ‘약탈’로 통일했습니다.
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  english_pob_choice: their enemies all around
  chosen_korean: 사방의 원수들
  alternatives_korean:
  - 주변의 원수들
  - 에워싼 원수들
  lexicon: HALOT
  rationale: ‘미싸빕’의 포위·둘러쌈을 간결하게 드러내는 표현으로 ‘사방의’가 자연스럽고, 원수들의 둘러싼 상태를 보존합니다.
theological_decisions:
- issue: 하나님의 분노를 의인화한 표현의 보존
  chosen_reading: ‘분노가 ... 타올랐습니다’로 옮겨, 단순히 ‘화내셨습니다’로 완화하지 않았습니다.
  alternative_readings:
  - ‘야훼께서 이스라엘에게 화를 내셨습니다’
  - ‘야훼의 진노가 이스라엘을 향해 일어났습니다’
  rationale: 본문은 강한 의인화 이미지를 사용하므로, 그 힘을 유지하는 번역이 원문의 심판 선언을 더 정확히 전달합니다.
  doctrine_reference: Source-first translation; preserve anthropopathic imagery unless the source itself softens it.
