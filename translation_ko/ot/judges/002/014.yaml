    rationale: 원문의 약탈자들을 명시해 한국어 문장의 명료성과 자연스러움을 확보할 수 있습니다.
  - severity: low
    issue: ‘손에’ 관용구를 설명하는 각주가 문장 끝에만 놓여 두 용례와의 연결이 약합니다.
