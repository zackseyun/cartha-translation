revisions:
- from: 그러자 야훼의 분노가 이스라엘을 향해 타올랐습니다. 그는 그들을 약탈자들의 손에 넘기셨고, 그들이 그들을 약탈했습니다. 그는 그들을 사방의 원수들의 손에 넘기셨으므로, 그들은 더 이상 원수들 앞에 설 수 없었습니다.[a][b]
  to: 그러자 야훼의 분노가 이스라엘을 향해 타올랐습니다. 야훼께서는 그들을 약탈자들의 손에[a] 넘기셨고, 약탈자들은 그들을 약탈했습니다. 또 그들을 사방에 있는 원수들의 손에 파셨으므로, 그들은 그 원수들 앞에 더 이상 설 수 없었습니다.[b]
  rationale: 둘째 동사를 ‘파셨으므로’로 바로잡아 원문의 어휘적 대조를 보존했습니다. 약탈의 주체를 명시하고, ‘사방에 있는 원수들’ 및 ‘그 원수들 앞에’로 지시 관계를 분명히 했습니다. 원문의 접속 흐름은 ‘또’와 ‘-으므로’로 자연스럽게 드러냈으며, 각주 앵커는 해당 관용구와 대안 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
