review_pass:
  verdict: revise
  source_fidelity: 둘째 심판 동사 וַיִּמְכְּרֵם은 문자적으로 ‘파셨습니다’인데, 초안은 앞선 וַיִּתְּנֵם과 같이 ‘넘기셨고’로 옮겨 ‘팔다’의 구체적 비유를 소실했습니다. 또한 שֹׁסִים의 행위 주체를 ‘그들이’로만 받으면 한국어에서 지시 대상이 불필요하게 모호합니다.
  naturalness: ‘약탈자들은 그들을 약탈했습니다’로 주어를 밝혀 반복되는 대명사의 모호성을 없앴습니다. ‘그 원수들 앞에 더 이상 설 수 없었습니다’는 원문의 ‘맞서 버티다’라는 의미를 보존하면서도 현대 표준 한국어에서 자연스럽습니다.
  terminology: ‘야훼’, ‘분노가 ... 타올랐습니다’, ‘약탈자들/약탈했습니다’를 유지했습니다. ‘사방에 있는 원수들’은 מִסָּבִיב의 범위를 자연스럽고 충실하게 나타냅니다. ‘손에’ 관용구는 두 번 모두 보존하고, 각주 하나가 두 용례를 포괄하도록 앵커를 배치했습니다.
  issues:
  - severity: high
    issue: וַיִּמְכְּרֵם의 ‘팔다’ 비유가 ‘넘기셨고’로 평준화되었습니다.
    rationale: 본문은 ‘넘기다’(וַיִּתְּנֵם)와 ‘팔다’(וַיִּמְכְּרֵם)를 의도적으로 구별합니다. 한국어에서도 ‘파셨으므로’를 사용하여 이 차이와 심판의 강한 이미지를 보존해야 합니다.
  - severity: medium
