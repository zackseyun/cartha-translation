revisions:
- from: 그때 야훼의 천사가 길갈에서 보김으로 올라와 말했습니다. 「내가 너희를 이집트에서 올라오게 했고, 너희 조상들에게 맹세한 땅으로 너희를 데려왔으며, 너희와 맺은 내 언약을 영원히 깨뜨리지 않겠다고 말했습니다.”[a][b]
  to: 그때 야훼의 천사[b]가 길갈에서 보김[a]으로 올라가서 말씀하셨습니다. “내가 너희를 이집트에서 데리고 올라왔고, 너희 조상들에게 맹세한 땅으로 너희를 데려왔으며, 또 말하였다. ‘나는 너희와 맺은 내 언약을 결코 깨뜨리지 않겠다.’”
  rationale: 인용부호와 각주 표지의 구조를 바로잡았습니다. ‘올라가서 말씀하셨습니다’로 원문의 이동과 발화를 자연스럽게 연결했고, ‘데리고 올라왔고’로 이집트 탈출을 회고하는 히브리어 사역 동사의 의미를 보존했습니다. 직접 인용 안의 ‘또 말하였다’는 원문의 연속된 과거 발화(וָאֹמַר)를 반영하며, 언약을 결코 깨뜨리지 않겠다는 약속의 지속적 부정을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:27Z'
