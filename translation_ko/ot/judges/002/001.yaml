  terminology: ‘야훼의 천사’와 ‘언약’은 적절합니다. 대안 번역 각주는 한국어에서 더 통용되고 원어의 의미 범위를 보존하는 ‘야훼의 사자’로 제시했습니다. 천사가 야훼의 1인칭 말씀을 전하는 본문의 긴장은 해석적으로 해소하지 않았습니다.
