id: JDG.2.1
reference: Judges 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
  footnotes:
  - marker: a
    text: Bochim likely means 'weepers' or refers to a place of weeping.
    reason: cultural_note
  - marker: b
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가 길갈에서 보김으로 올라와 말했습니다. 「내가 너희를 이집트에서 올라오게 했고, 너희 조상들에게 맹세한 땅으로 너희를 데려왔으며, 너희와 맺은 내 언약을 영원히 깨뜨리지 않겠다고 말했습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보김은 ‘우는 자들’ 또는 ‘통곡의 곳’을 뜻하는 지명일 가능성이 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘야훼의 메신저’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초자연적 존재를 가리키는 ‘천사’가 자연스럽고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיַּעַל ... מִן הַגִּלְגָּל אֶל הַבֹּכִים
  english_pob_choice: went up from Gilgal to Bochim
  chosen_korean: 길갈에서 보김으로 올라와
  alternatives_korean:
  - 길갈에서 보김으로 갔다
  - 길갈에서 보김으로 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 공간 이동을 ‘올라오다’로 살려 원문의 상향 이동 뉘앙스를 보존했고, 지명은 음역을 유지했습니다.
- source_word: הַבֹּכִים
  english_pob_choice: Bochim
  chosen_korean: 보김
  alternatives_korean:
  - 우는 자들
  - 울음의 곳
  lexicon: HALOT
  rationale: 본문의 지명은 고유명사로 유지하고, 의미 투명성은 각주로 처리하는 것이 원문의 서술과 잘 맞습니다.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  english_pob_choice: I will never break my covenant with you
  chosen_korean: 너희와 맺은 내 언약을 영원히 깨뜨리지 않겠다고
  alternatives_korean:
  - 너희와 맺은 내 언약을 결코 깨뜨리지 않겠다고
  - 너희와 맺은 내 언약을 어기지 않겠다고
  lexicon: HALOT
  rationale: הפר를 언약 문맥의 관용적 의미인 ‘깨뜨리다’로 살렸고, לְעוֹלָם은 ‘영원히’로 옮겨 지속성과 부정을 함께 드러냈습니다.
theological_decisions:
- issue: 야훼의 천사와 직접 화자의 관계
  chosen_reading: 본문의 초월적 사자와 1인칭 신적 발화를 모두 드러내되, 그 정체를 본문 밖에서 단정하지 않았습니다.
  alternative_readings:
  - 피조된 천사로 한정
  - 야훼 자신이 현현한 것으로 단정
  rationale: 원문은 사자가 말하지만 내용은 야훼의 직접 발화이므로, 한국어도 이 긴장을 보존하는 편이 본문 충실도가 높습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
