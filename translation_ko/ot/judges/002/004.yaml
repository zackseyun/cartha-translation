base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
  footnotes:
  - marker: a
    text: Or 'to all the Israelites'; literally, 'to all the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼의 천사가 이 말씀들을 온 이스라엘 자손에게 말했을 때, 백성이 소리를 높여 울었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들 모두에게’; 문자적으로는 ‘이스라엘의 모든 아들들에게’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 사자’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 ‘천사’가 가장 자연스럽고, יְהוָה는 도식적 대체어 대신 고유명사 ‘야훼’로 옮겼습니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말씀들을
  alternatives_korean:
  - 이 말들을
  - 이런 말씀들
  lexicon: HALOT
  rationale: 직전의 발화를 가리키므로 ‘말씀들’이 말의 내용성과 공식성을 함께 살립니다.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to all the sons of Israel
  chosen_korean: 온 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 모든 아들들에게
  - 모든 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’ 직역을 유지하되, 현대 한국어에서는 자연스러운 집합명사 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  english_pob_choice: the people raised their voices
  chosen_korean: 소리를 높여
  alternatives_korean:
  - 목소리를 높여
  - 소리를 들어
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘목소리를 들다’는 한국어에서 ‘소리를 높이다/높여 울다’로 자연스럽게 대응됩니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 표기할지
  chosen_reading: ‘야훼’로 직역적 고유명사 표기를 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 이름을 직접 사용하므로, 칭호로 바꾸지 않고 고유명사성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
