  source_fidelity: ‘남겨 두셔서, 곧바로 쫓아내지 않으셨고’는 히브리어의 ‘남겨 두셨다—빨리 쫓아내지 않으셨다’라는 병렬/수단 관계를 한국어에서 인과 관계처럼 들리게 할 수 있습니다. 부정 구문을 ‘빨리 쫓아내지 않고’로 앞세워 원문의 관계를 더 정확히 드러내는 것이 안전합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘여호수아의 손에 넘기다’는 한국어에서 다소 문자적이지만, 원문의 권세/지배 관용구를 보존하며 문맥상 이해 가능합니다.
  terminology: ‘야훼’, ‘민족들’, ‘여호수아’는 원문 및 POB 용어 선택에 부합합니다. 각주도 גּוֹיִם의 가능한 의미 범위를 간결하고 자연스럽게 제시하도록 다듬었습니다.
