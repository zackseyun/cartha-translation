base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
  footnotes:
  - marker: a
    text: Or 'left these peoples'; the Hebrew verb can mean 'allowed to remain' or 'left in place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 야훼께서는 이 민족들을 빨리 쫓아내지 않고 남겨 두셨으며, 그들을 여호수아의 손에 넘기지 않으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 백성들’. 히브리어 גּוֹיִם은 ‘민족들’ 또는 ‘백성들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명기적 고유명사를 보존하기 위해 직함인 ‘주님’이 아니라 고유음역 ‘야훼’를 사용했습니다.
- source_word: הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: these nations
  chosen_korean: 이 민족들
  alternatives_korean:
  - 이 나라들
  - 이 백성들
  lexicon: HALOT
  rationale: 가나안에 남아 있는 주변 집단을 가리키므로, 현대 한국어에서 자연스럽고 범주도 맞는 ‘민족들’로 옮겼습니다.
- source_word: לְבִלְתִּי הוֹרִישָׁם מַהֵר
  english_pob_choice: not driving them out quickly
  chosen_korean: 곧바로 쫓아내지 않으셨고
  alternatives_korean:
  - 서둘러 쫓아내지 않으셨고
  - 빨리 몰아내지 않으셨고
  lexicon: HALOT
  rationale: 부정 목적/결과 구문을 한국어에서 자연스럽게 처리하면서, 군사적·토지 상실 맥락의 ‘drive out’를 ‘쫓아내다’로 표현했습니다.
- source_word: בְּיַד יְהוֹשֻׁעַ
  english_pob_choice: into the hand of Joshua
  chosen_korean: 여호수아의 손에 넘기지 않으셨습니다
  alternatives_korean:
  - 여호수아에게 넘기지 않으셨습니다
  - 여호수아의 권세 아래 두지 않으셨습니다
  lexicon: HALOT
  rationale: ‘손’은 권능/지배의 관용구이므로, 이미지를 살리되 한국어 독자에게도 분명하게 ‘넘기다’로 옮겼습니다.
theological_decisions:
- issue: 여호수아의 정복이 완결되지 않은 이유를 어떻게 드러낼지
  chosen_reading: 야훼께서 의도적으로 이 민족들을 완전히 몰아내지 않으신 것으로 읽었습니다.
  alternative_readings:
  - 단순히 상황상 쫓아내지 못하신 것으로 읽을 수 있습니다.
  - 이스라엘의 군사적 한계를 강조하는 것으로 읽을 수 있습니다.
  rationale: 히브리어 동사들과 문맥상 주어는 야훼이며, 본문은 정복의 미완성을 하나님의 주권 아래 놓습니다.
  doctrine_reference: 수 2:23 / 삿 2장의 문맥적 신학
