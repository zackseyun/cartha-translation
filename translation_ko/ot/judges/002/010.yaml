base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
  footnotes:
  - marker: a
    text: Hebrew 'were gathered to their fathers,' an idiom for dying and joining one's forebears.
    reason: cultural_note
  - marker: b
    text: Or 'did not acknowledge the LORD'; the Hebrew can denote relational or covenantal knowledge, not only factual awareness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 세대는 모두 그들의 조상에게로 모였고, 그들 뒤에 다른 세대가 일어났습니다. 그 세대는 야훼를 알지 못했고, 이스라엘을 위해 그가 행하신 일도 알지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 조상들에게로 모이다’는 죽어 선조들과 합류한다는 관용구입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘야훼를 인정하지 않았다’로 옮길 수도 있습니다. 히브리어는 단순한 사실 인식뿐 아니라 관계적·언약적 앎을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  english_pob_choice: And all that generation also
  chosen_korean: 그리고 그 세대는 모두
  alternatives_korean:
  - 그리고 그 온 세대도
  - 그 세대 전체도
  lexicon: HALOT
  rationale: וְגַם의 덧붙임과 הַדּוֹר הַהוּא의 특정 세대를 함께 살려, 앞문맥에 이어지는 동일 세대를 자연스럽게 나타냈습니다.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  english_pob_choice: were gathered to their fathers
  chosen_korean: 그들의 조상에게로 모였고
  alternatives_korean:
  - 그들의 조상에게로 거두어졌고
  - 조상들과 함께 죽었고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 옮겨 죽음과 선조들에게로의 합류라는 표현의 맛을 보존했습니다.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  english_pob_choice: and another generation arose after them
  chosen_korean: 그들 뒤에 다른 세대가 일어났습니다
  alternatives_korean:
  - 그 뒤에 다른 세대가 생겼습니다
  - 그들 다음에 다른 세대가 나타났습니다
  lexicon: HALOT
  rationale: וַיָּקָם의 서사적 발생을 ‘일어났습니다’로 살리고, אַחֲרֵיהֶם의 순차성을 ‘그들 뒤에’로 분명히 했습니다.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  english_pob_choice: who did not know Yahweh
  chosen_korean: 야훼를 알지 못했고
  alternatives_korean:
  - 야훼를 인정하지 않았고
  - 야훼를 알지 못했으며
  lexicon: HALOT
  rationale: יָדַע의 관계적·언약적 앎의 여지를 좁히지 않기 위해 단순한 ‘모르다’보다 포괄적인 ‘알지 못하다’를 유지했습니다.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  english_pob_choice: or even the work that he had done for Israel
  chosen_korean: 이스라엘을 위해 그가 행하신 일도 알지 못했습니다
  alternatives_korean:
  - 이스라엘을 위해 그가 하신 일도 알지 못했습니다
  - 이스라엘을 위해 하신 그 일도 알지 못했습니다
  lexicon: HALOT
  rationale: מַעֲשֶׂה를 추상적으로 ‘일’로 옮기고, לְיִשְׂרָאֵל을 ‘이스라엘을 위해’로 처리해 구원의 목적성을 드러냈습니다.
theological_decisions:
- issue: ‘야훼를 알지 못했다’의 의미 범위
  chosen_reading: 단순한 정보 부족과 언약적 무지의 긴장을 모두 남겨 둡니다.
  alternative_readings:
  - 야훼의 존재를 몰랐다는 뜻으로 좁히는 해석
  - 야훼에 대한 언약적 인정이 없었다는 뜻으로 한정하는 해석
  rationale: 본문이 야훼를 알지 못함과 그의 행사를 알지 못함을 병렬로 두므로, 한쪽으로만 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: 여호와/야훼 표기
  chosen_reading: 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 YHWH를 아카데믹 표기인 야훼로 표기했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
