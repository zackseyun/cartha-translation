  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
  footnotes:
  - marker: a
    text: Hebrew 'sides.' Some ancient versions and parallel passages read or interpret this as 'thorns in your sides.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 나도 말했습니다. ‘나는 그들을 너희 앞에서 쫓아내지 않겠습니다. 그들은 너희에게 대적이 되고, 그들의 신들은 너희에게 올무가 될 것입니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘옆/측면들’입니다. 일부 고대 역본과 평행 본문은 이를 ‘너희 옆의 가시들’로 읽거나 풀이합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְגַם / אָמַרְתִּי
  english_pob_choice: So I also said
  chosen_korean: 그러므로 나도 말했습니다
  alternatives_korean:
  - 나도 또한 말했습니다
  - 또 내가 말했습니다
  lexicon: HALOT
  rationale: 앞선 문맥과의 연속 및 결과성을 자연스럽게 살리기 위해 ‘그러므로’로 연결하고, פשוט한 서술을 유지하기 위해 ‘말했습니다’를 택했습니다.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם מִפְּנֵיכֶם
  english_pob_choice: I will not drive them out from before you
  chosen_korean: 나는 그들을 너희 앞에서 쫓아내지 않겠습니다
  alternatives_korean:
  - 나는 그들을 너희 앞에서 몰아내지 않겠습니다
  - 나는 그들을 너희 면전에서 쫓아내지 않겠습니다
  lexicon: HALOT
  rationale: גָּרַשׁ은 ‘쫓아내다/몰아내다’가 자연스럽고, מִפְּנֵיכֶם은 관용구를 살려 ‘너희 앞에서’로 옮겼습니다.
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  english_pob_choice: they will become adversaries to you
  chosen_korean: 그들은 너희에게 대적이 되고
  alternatives_korean:
  - 그들은 너희의 옆구리가 되고
  - 그들은 너희 곁의 가시가 되고
  lexicon: HALOT
  rationale: 히브리어 본문은 직역하면 ‘옆/측면들’이라는 난해한 독법이지만, 문맥상 적대적 압박의 의미가 분명하므로 한국어에서는 ‘대적’으로 옮기고 POB의 난점을 반영했습니다.
- source_word: וֵאלֹהֵיהֶם יִהְיוּ לָכֶם לְמוֹקֵשׁ
  english_pob_choice: and their gods will become a snare to you
  chosen_korean: 그들의 신들은 너희에게 올무가 될 것입니다
  alternatives_korean:
  - 그들의 신들은 너희에게 덫이 될 것입니다
  - 그들의 신들은 너희에게 함정이 될 것입니다
  lexicon: HALOT
  rationale: מוֹקֵשׁ는 사람을 걸리게 하는 덫/올무의 뜻이어서, 우상숭배의 위험을 살리는 ‘올무’가 가장 적절합니다.
theological_decisions:
- issue: לְצִדִּים의 난해한 마소라 본문 처리
  chosen_reading: 본문의 난해함을 그대로 드러내되, 의미는 ‘대적’으로 풀어 읽었습니다.
  alternative_readings:
  - ‘너희 옆의 가시가 될 것입니다’
  - ‘너희의 옆구리가 될 것입니다’
  rationale: 본문 자모는 ‘옆/측면들’이라는 뜻을 가리키지만, 한국어 독자가 문맥의 경고를 즉시 이해하도록 적대 관계를 드러내는 표현을 사용했습니다. 이는 본문의 어려움을 지우지 않으면서도 의미를 전달하려는 선택입니다.
  doctrine_reference: Translation philosophy §1, §3, §5
