  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
  footnotes:
  - marker: a
    text: Or 'I will no longer drive out before them even one of the nations that Joshua left, and then died.' The Hebrew more literally has 'and he died'; 'when he died' expresses the temporal sense in smoother English.
    reason: lexical_alternative
translation:
  language: ko
  text: 나도 그들 앞에서 여호수아가 죽을 때 남겨 둔 민족들 가운데서 한 민족도 더는 몰아내지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 여호수아가 남겨 두고 죽은 민족들 가운데서 한 민족도 더는 몰아내지 않겠습니다.” 히브리어는 문자적으로 “그리고 그는 죽었다”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  english_pob_choice: I also
  chosen_korean: 나도
  alternatives_korean:
  - 나 역시
  - 나 또한
  lexicon: HALOT
  rationale: 독립대명사와 함께 쓰인 גַּם의 강조를 자연스럽게 살리면서, 하나님의 첫인칭 화법을 한국어로 간결하게 유지했습니다.
- source_word: לֹא אוֹסִיף
  english_pob_choice: will no longer continue
  chosen_korean: 더는
  alternatives_korean:
  - 다시는
  - 이제 더 이상
  lexicon: HALOT
  rationale: יסף의 부정형이 나타내는 중단의 의미를 한국어에서 가장 자연스럽게 드러내는 방식은 '더는'입니다. '계속'을 덧붙이는 것은 문장에 불필요한 중복이 되므로 본문 의미를 압축해 살렸습니다.
- source_word: לְהוֹרִישׁ אִישׁ מִפְּנֵיהֶם
  english_pob_choice: to drive out before them any of the nations
  chosen_korean: 몰아내지 않겠습니다
  alternatives_korean:
  - 쫓아내지 않겠습니다
  - 추방하지 않겠습니다
  lexicon: HALOT
  rationale: 정복 문맥의 הוֹרִישׁ은 점유자들을 그 자리에 남겨 두지 않고 제거하는 뜻이므로 '몰아내다'가 현대 한국어에서 가장 직접적입니다. '한 민족도'는 אִישׁ의 분배적 용법을 반영합니다.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ וַיָּמֹת
  english_pob_choice: that Joshua left when he died
  chosen_korean: 여호수아가 죽을 때 남겨 둔
  alternatives_korean:
  - 여호수아가 남겨 두고 죽은
  - 여호수아가 남겨 두었던
  lexicon: HALOT
  rationale: עָזַב의 '남겨 두다'와 וַיָּמֹת의 시간 관계를 한국어에서 가장 자연스럽게 연결했습니다. '죽을 때'는 영어 POB의 시간 부사절 처리와 대응하면서도 히브리어의 순서를 지나치게 풀지 않습니다.
theological_decisions:
- issue: 하나님 화자의 직접 발화와 주어 보충
  chosen_reading: 본문의 1인칭 발화를 유지하고 '여호와'나 '주님'을 괄호식으로 덧붙이지 않았습니다.
  alternative_readings:
  - 여호와께서 나도…라고 명시
  - 주님이 나도…라고 명시
  rationale: 히브리어 본문은 이 절에서 이미 설정된 신적 화자를 다시 명시하지 않고 1인칭으로 말합니다. 그러므로 번역문도 본문의 직접성을 유지하는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 원문 우선 원칙; 문맥에 이미 확립된 화자 재지시를 임의로 확대하지 않음
