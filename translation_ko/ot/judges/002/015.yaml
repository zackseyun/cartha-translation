id: JDG.2.15
reference: Judges 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
  footnotes:
  - marker: a
    text: Or 'Whenever they went out,' possibly with the sense of going out to battle or on campaign.
    reason: lexical_alternative
  - marker: b
    text: Or 'for disaster' or 'for evil'; the Hebrew רָעָה here refers to calamity or harm, not necessarily moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 어디로 나가든지[a], 야훼의 손이 그들에게 재앙[b]이 되었습니다. 이것은 야훼께서 말씀하신 대로이고, 또 야훼께서 그들에게 맹세하신 대로였습니다. 그들은 몹시 괴로워했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나갈 때마다’로 옮길 수 있습니다. 출정하거나 원정을 떠나는 뜻을 포함할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘해악’ 또는 ‘재난’. 히브리어 רָעָה는 여기서 반드시 도덕적 악을 뜻하지 않고 재앙이나 해를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  english_pob_choice: Wherever they went out
  chosen_korean: 그들이 어디로 나가든지
  alternatives_korean:
  - 그들이 나가는 모든 곳에서
  - 그들이 출정하든지
  lexicon: HALOT
  rationale: 히브리어 관용구는 이동·원정의 모든 경우를 포괄하므로, 한국어에서는 자연스럽게 ‘어디로 나가든지’로 넓은 범위를 살렸습니다.
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 야훼의 손길
  - 야훼의 능력
  lexicon: HALOT
  rationale: ‘손’이라는 신체 은유를 그대로 살려 하나님의 적극적 개입과 대적하심을 드러냈습니다.
- source_word: הָיְתָה בָּם לְרָעָה
  english_pob_choice: was against them for harm
  chosen_korean: 그들에게 재앙을 내리기 위해 그들 위에 있었으니
  alternatives_korean:
  - 그들에게 해를 끼치기 위해 그들 위에 있었으니
  - 그들에게 재난이 되도록 그들 위에 있었으니
  lexicon: HALOT
  rationale: רָעָה는 도덕적 ‘악’보다 ‘재앙/해로움’의 뜻이므로, ‘재앙’을 택해 심판의 결과를 분명히 했습니다.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  english_pob_choice: and they were greatly distressed
  chosen_korean: 그래서 그들은 크게 곤고해졌습니다
  alternatives_korean:
  - 그래서 그들은 매우 괴로워했습니다
  - 그래서 그들은 심한 고통을 겪었습니다
  lexicon: HALOT
  rationale: 동사의 결과를 한국어에서 상태 변화로 옮겨, 극심한 압박과 고통의 뉘앙스를 ‘곤고하다’로 간결하게 전달했습니다.
theological_decisions:
- issue: 여호와의 손이 ‘그들에게 재앙을 내린다’는 표현의 신학적 긴장
  chosen_reading: 야훼의 손이 그들에게 재앙을 내리기 위해 그들 위에 있었습니다.
  alternative_readings:
  - 야훼의 손이 그들에게 해를 끼치기 위해 그들 위에 있었습니다.
  - 야훼의 손이 그들에게 재난이 되도록 그들 위에 있었습니다.
  rationale: 본문은 언약적 심판으로서의 하나님의 적극적 행위를 말하지만, 도덕적 ‘악’을 하나님에게 돌리는 표현은 피해야 합니다. ‘재앙’으로 번역해 심판의 실제성을 살리면서도 신학적 오해를 줄였습니다.
  doctrine_reference: 언약적 심판과 하나님의 거룩하심을 함께 보존
- issue: 예언적/서사적 회고에서 과거 완료의 연결
  chosen_reading: 이는 야훼께서 말씀하신 대로이며 또 야훼께서 그들에게 맹세하신 대로였습니다.
  alternative_readings:
  - 이는 야훼께서 말씀하신 바와 같고 또 야훼께서 그들에게 맹세하신 바와 같습니다.
  rationale: ‘말씀하셨다/맹세하셨다’의 회고적 성격을 살려, 이미 선포된 경고와 언약의 이행이라는 구조를 분명히 했습니다.
  doctrine_reference: 언약 성취의 회고적 서술
