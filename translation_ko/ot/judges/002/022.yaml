source:
  edition: WLC
  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
  footnotes:
  - marker: a
    text: Or 'through them' for 'by them.' The Hebrew pronoun refers to the nations left in the land (see the preceding context).
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 그들을 통하여 이스라엘을 시험하시어, 그들이 그들의 조상들이 지킨 것처럼 야훼의 길을 지켜 그 길을 걸을 것인지, 그렇지 않을 것인지를 보려 하신 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들을 통하여’의 ‘그들’은 앞 문맥에서 땅에 남겨 둔 민족들을 가리킵니다. 히브리어는 이들을 이스라엘을 시험하는 수단으로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן נַסּוֹת
  english_pob_choice: in order to test
  chosen_korean: 시험하여
  alternatives_korean:
  - 테스트하여
  - 검증하여
  - 살피려 하셔서
  lexicon: HALOT
  rationale: 목적을 나타내는 לְמַעַן과 ‘to test’를 자연스럽게 한 번에 살리기 위해 ‘시험하여’를 썼습니다.
- source_word: בָּם
  english_pob_choice: by them
  chosen_korean: 그것으로
  alternatives_korean:
  - 그들로
  - 그들을 통해
  - 그들로 말미암아
  lexicon: HALOT
  rationale: 대명사가 앞 문맥의 남은 민족들을 가리키므로, 도구적 의미를 살리면서 한국어에서 매끄럽게 읽히는 ‘그것으로’를 택했습니다.
- source_word: דֶּרֶךְ יְהוָה
  english_pob_choice: the way of Yahweh
  chosen_korean: 야훼의 길
  alternatives_korean:
  - 여호와의 길
  - 주님의 길
  - 야훼의 길을
  lexicon: HALOT
  rationale: 성호 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 관용구 ‘the way of Yahweh’는 직역형인 ‘야훼의 길’로 유지했습니다.
- source_word: לָלֶכֶת בָּם
  english_pob_choice: by walking in it
  chosen_korean: 그 안에서 걷는지
  alternatives_korean:
  - 그 안에서 행하는지
  - 그 길로 걷는지
  - 그 안에서 살아가는지
  lexicon: HALOT
  rationale: 히브리어의 ‘걷다’ 이미지를 보존하되, 한국어에서 ‘길 안에서 걷다’의 자연스러움을 위해 ‘그 안에서 걷는지’로 옮겼습니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들이
  alternatives_korean:
  - 그들의 아버지들이
  - 그들의 선조들이
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 용어를 유지하되, 현대 한국어에서 문맥상 분명한 ‘조상들’로 풀어 읽기 쉽게 했습니다.
theological_decisions:
- issue: 문장 끝의 평가적 대비인 אִם לֹא־־־
  chosen_reading: ‘아니면 그렇지 않은지를’로 대조를 분명히 했습니다.
  alternative_readings:
  - ‘아니면 아닌지를’
  - ‘그렇지 않은지’만 두는 방식
  rationale: 본문의 질문은 순종 여부를 시험하는 대비 구조이므로, ‘or not’의 대조를 명시해 시험의 의미를 선명하게 드러냈습니다.
  doctrine_reference: 구조 보존 원칙
- issue: 남은 민족들을 통한 시험의 도구성
  chosen_reading: ‘그것으로’로 도구성을 간명하게 표현했습니다.
  alternative_readings:
  - ‘그들로’
  - ‘그들을 통해’
  rationale: 바로 앞 문맥의 민족들을 지시하는 대명사의 도구적 기능을 유지하면서도, 한국어에서 어색하지 않게 시험의 매개를 드러내려는 선택입니다.
  doctrine_reference: 문맥 지시대명사 처리
