id: JDG.2.2
reference: Judges 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
  footnotes:
  - marker: a
    text: Hebrew literally, 'cut a covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 이 땅의 주민들과 언약을 맺지 말아야 했고[a], 그들의 제단을 허물어야 했습니다. 그러나 너희는 내 음성을 듣지 않았습니다. 너희가 무슨 일을 한 것입니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘언약을 자르다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  english_pob_choice: make a covenant
  chosen_korean: 언약을 맺어서는 안 됩니다
  alternatives_korean:
  - 조약을 맺어서는 안 됩니다
  - 언약을 세워서는 안 됩니다
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘언약을 자르다’이지만, 한국어에서는 ‘언약을 맺다’가 가장 자연스럽고 성경적 범주를 유지합니다. ‘조약’은 정치·외교적 뉘앙스가 강해 본문의 언약적 금지를 약화시킬 수 있습니다.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  english_pob_choice: with the inhabitants of this land
  chosen_korean: 이 땅의 주민들과
  alternatives_korean:
  - 이 땅에 거주하는 사람들과
  - 이 땅의 거주자들과
  lexicon: HALOT
  rationale: 요셉이 아니라 ‘거주하는 자들’이라는 분사적 명사를 한국어에서 간결하게 ‘주민들’로 옮겼습니다. ‘이 땅’은 지시어의 힘을 살려 현재의 금지 대상을 분명히 합니다.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  english_pob_choice: you were to tear down their altars
  chosen_korean: 그들의 제단을 허물어야 했습니다
  alternatives_korean:
  - 그들의 제단을 무너뜨려야 했습니다
  - 그들의 제단을 헐어야 했습니다
  lexicon: HALOT
  rationale: נתץ는 구조물을 ‘부수다/허물다/무너뜨리다’는 뜻인데, 제단에 대해서는 ‘허물다’가 가장 자연스럽고 명령의 파괴성을 잘 드러냅니다. 영어 POB처럼 과거 의무 표현으로 옮겨, 이미 주어진 명령을 상기시키는 책망의 어조를 살렸습니다.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  english_pob_choice: But you have not listened to my voice
  chosen_korean: 그러나 너희는 내 음성을 듣지 않았습니다
  alternatives_korean:
  - 그러나 너희는 내 말을 듣지 않았습니다
  - 그런데도 너희는 내 음성에 귀를 기울이지 않았습니다
  lexicon: HALOT
  rationale: שמע בְּקוֹל은 단순 청취보다 ‘듣고 따르다’의 함의를 지니지만, 히브리어 표현 자체를 살리기 위해 ‘내 음성’을 유지했습니다. 문맥상 불순종이 분명하므로 추가 해설 없이도 책망의 의미가 전달됩니다.
theological_decisions:
- issue: 언약 금지의 성격
  chosen_reading: 이 땅의 주민들과 언약을 맺어서는 안 됩니다
  alternative_readings:
  - 이 땅의 주민들과 조약을 맺어서는 안 됩니다
  - 이 땅의 주민들과 동맹을 맺어서는 안 됩니다
  rationale: 본문은 단순한 정치 협정이 아니라 이스라엘이 가나안 주민들과 맺어서는 안 되는 언약을 가리키므로, 성경적 범주인 ‘언약’을 유지했습니다. 이는 본문의 신학적 무게를 보존합니다.
  doctrine_reference: 언약 신학 / 가나안 분리 명령
- issue: 책망의 화법
  chosen_reading: 그들의 제단을 허물어야 했습니다
  alternative_readings:
  - 그들의 제단을 허물어야 합니다
  - 그들의 제단을 무너뜨려야 했습니다
  rationale: 히브리어의 미완료형이 과거의 명령을 회상하며 현재의 불순종을 질책하는 구조이므로, 한국어도 과거 의무로 옮겨 책망의 효과를 살렸습니다.
  doctrine_reference: 본문의 회상적 책망 구조
