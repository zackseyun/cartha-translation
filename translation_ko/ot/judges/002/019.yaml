  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
  footnotes:
  - marker: a
    text: Or 'They did not abandon any of their practices or their stubborn way.' The Hebrew literally says they 'did not drop' them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사사가 죽을 때가 되면, 그들은 다시 돌아서서 자기 조상들보다 더 악을 행하며, 다른 신들을 따라가 그들을 섬기고 그들에게 절했습니다. 그들은 자기들의 행위 하나도, 자기들의 완고한 길도 버리지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적 뜻은 ‘그들의 행위나 그들의 완고한 길에서 하나도 떨어뜨리지 않았다’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: בְּמוֹת הַשּׁוֹפֵט
  english_pob_choice: when the judge died
  chosen_korean: 그 사사가 죽을 때가 되면
  alternatives_korean:
  - 그 사사가 죽으면
  - 재판관이 죽을 때가 되면
  lexicon: HALOT
  rationale: 사사기의 용례를 따라 הַשּׁוֹפֵט를 ‘사사’로 옮기고, 시간 부사절은 자연스러운 한국어로 풀어 합쇼체 서술 흐름을 살렸습니다.
- source_word: יָשֻׁבוּ וְהִשְׁחִיתוּ
  english_pob_choice: they turned back and acted more corruptly
  chosen_korean: 그들은 다시 돌아서서 자기 조상들보다 더 악을 행하며
  alternatives_korean:
  - 그들은 돌아가서 더 부패하게 행하며
  - 그들은 다시 돌아가서 더 타락했습니다
  lexicon: HALOT
  rationale: יָשׁוּבוּ의 ‘되돌아감’과 הִשְׁחִיתוּ의 도덕적 타락을 함께 살리되, 한국어에서 자연스러운 ‘악을 행하다’로 풀어 비교 의미를 분명히 했습니다.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם וּמִדַּרְכָּם הַקָּשָׁה
  english_pob_choice: They did not drop any of their deeds or their stubborn way
  chosen_korean: 그들은 자기들의 행위 하나도, 자기들의 완고한 길도 버리지 않았습니다.
  alternatives_korean:
  - 그들은 자기들의 행위에서 하나도 놓지 않았습니다
  - 그들은 자기들의 행실과 완고한 길에서 손을 떼지 않았습니다
  lexicon: HALOT
  rationale: הִפִּילוּ의 문자적 이미지인 ‘떨어뜨리다/내려놓다’를 한국어 관용에 맞게 ‘버리지 않다’로 옮겨, 반복되는 악습을 끊지 않았다는 뜻을 보존했습니다.
theological_decisions:
- issue: אֱלֹהִים אֲחֵרִים의 번역
  chosen_reading: 다른 신들
  alternative_readings:
