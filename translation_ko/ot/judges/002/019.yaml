  - 다른 신격들
  rationale: 본문은 야훼 외의 신들을 따르는 배교를 말하므로, 민족적 뉘앙스를 덧붙이지 않는 직설적 표현이 가장 적절합니다.
  doctrine_reference: 신명기적 배교 서술, 언약 신앙 대조
