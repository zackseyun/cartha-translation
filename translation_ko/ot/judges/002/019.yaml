- from: 그 사사가 죽을 때가 되면, 그들은 다시 돌아서서 자기 조상들보다 더 악을 행하며, 다른 신들을 따라가 그들을 섬기고 그들에게 절했습니다. 그들은 자기들의 행위 하나도, 자기들의 완고한 길도 버리지 않았습니다.[a]
  to: 그 사사가 죽으면, 그들은 다시 돌아가 자기들의 조상들보다 더 악하게 행하여, 다른 신들을 따라가 그들을 섬기고 그들에게 절했습니다. 그들은 자기들의 행위도 자기들의 완고한 길도 버리지 않았습니다.[a]
  rationale: 시간 절에서 불필요한 임박성 뉘앙스를 제거하고, 원문의 ‘돌아가다—더 악하게 행하다’의 진행을 자연스럽게 유지했습니다. 마지막 절은 히브리어의 부정과 두 병렬 목적어를 한국어 부정 병렬 구조로 옮겼으며, 각주에서 נפל의 문자적 ‘떨어뜨리다’ 이미지를 보존했습니다.
