  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
  footnotes:
  - marker: a
    text: Bochim sounds like the Hebrew word for 'weepers' or 'those who weep.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳의 이름을 보김[a]이라 부르고, 거기서 야훼께 제사를 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보김’은 히브리어로 ‘우는 자들’ 또는 ‘우는 사람들’과 관련된 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  english_pob_choice: they called the name
  chosen_korean: 이름을 …이라 부르고
  alternatives_korean:
  - 이름을 …이라 이름하고
  - …이라 불렀고
  lexicon: HALOT
  rationale: 히브리어의 ‘이름을 부르다’ 관용을 살리되, 현대 한국어에서는 ‘…이라 부르다’가 가장 자연스럽습니다. '이름을'을 유지해 원문 구조도 드러냈습니다.
- source_word: בֹּכִים
  english_pob_choice: Bochim
  chosen_korean: 보김
  alternatives_korean:
  - 보힘
  - 보침
  lexicon: HALOT
  rationale: 지명은 음역하는 원칙에 따라 옮겼습니다. 본문의 의미가 ‘우는 자들/우는 사람들’과 연결된다는 점은 주석으로 남기는 것이 적절합니다.
- source_word: וַיִּזְבְּחוּ
  english_pob_choice: they sacrificed
  chosen_korean: 제사를 드렸습니다
  alternatives_korean:
  - 희생제물을 바쳤습니다
  - 제사를 바쳤습니다
  lexicon: HALOT
  rationale: זבח는 단순한 ‘바치다’보다 제사 행위를 분명히 드러내므로, 한국어 성경체에서 자연스러운 ‘제사를 드리다’를 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: project default
  rationale: 원문의 언약명 יהוה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 여격 조사 ‘-께’로 예배 대상임을 살렸습니다.
theological_decisions:
- issue: 지명 보김의 처리
  chosen_reading: 본문은 음역된 지명 ‘보김’을 유지하고, 의미는 주석으로 보완합니다.
  alternative_readings:
  - 의미를 살려 ‘우는 자들’로 번역
  - ‘우는 사람들’로 번역
  rationale: 이곳은 장소 이름으로 기능하므로 이름은 보존하고, 히브리어 어감은 각주에서 설명하는 편이 본문 충실성과 가독성을 함께 지킵니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #2: Translate titles; transliterate names'
- issue: 여호와/야훼 표기
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절의 신명은 직접 표기된 언약명으로서, 프로젝트 기준에 따라 ‘야훼’가 가장 원문 가시성을 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
