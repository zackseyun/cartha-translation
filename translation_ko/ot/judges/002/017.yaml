  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
  footnotes:
  - marker: a
    text: Or, 'they played the prostitute after other gods.' The Hebrew uses a sexual-infidelity metaphor for idolatry and covenant unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 자기 재판관들에게도 듣지 않았습니다. 그들은 다른 신들을 따라 음행하였고 그들에게 절하였습니다. 그들은 자기 조상들이 야훼의 명령에 순종하며 걸었던 그 길에서 곧바로 벗어났습니다. 그들은 그렇게 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음행하였다’는 히브리어가 우상숭배와 언약 불충실을 가리키는 성적 불성실 은유를 사용하기 때문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Yet ... even
  chosen_korean: 그러나 ...도
  alternatives_korean:
  - 그리고 또한
  - 그런데도
  lexicon: HALOT
  rationale: 앞 절과의 대비를 살리면서 ‘even’의 강조를 한국어의 '-도'로 반영했습니다.
- source_word: אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  english_pob_choice: they did not listen even to their judges
  chosen_korean: 자기 재판관들에게도 듣지 않았습니다
  alternatives_korean:
  - 자기 재판관들에게도 순종하지 않았습니다
  - 자기 재판관들의 말을 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל의 관용을 ‘듣다’로 유지해 거절의 태도를 드러내되, 문맥상 불순종의 뜻도 함께 전달되도록 했습니다.
- source_word: זָנוּ אַחֲרֵי
  english_pob_choice: they prostituted themselves after
  chosen_korean: 음행하였고
  alternatives_korean:
  - 자신을 파는 음행을 하였고
  - 창기처럼 따랐고
  lexicon: HALOT
  rationale: 히브리어의 성적 불성실 은유를 한국어의 ‘음행하다’로 옮겨 우상숭배와 언약 불충실의 도덕적 강도를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 신명기의 고유명 표기인 ‘야훼’를 사용했습니다.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  english_pob_choice: in obeying the commandments of Yahweh
  chosen_korean: 야훼의 명령에 순종하며
  alternatives_korean:
  - 야훼의 계명을 지키며
  - 야훼의 명령을 듣고
  lexicon: HALOT
  rationale: לִשְׁמֹעַ를 여기서는 ‘순종하다’로 옮겨, 조상들이 걸었던 길의 성격이 단순 청취가 아니라 복종임을 드러냈습니다.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  english_pob_choice: They quickly turned aside from the way
  chosen_korean: 곧바로 벗어났습니다
  alternatives_korean:
  - 속히 길에서 벗어났습니다
  - 재빨리 그 길에서 돌아섰습니다
  lexicon: HALOT
  rationale: ‘길’의 은유를 과도하게 설명하지 않으면서 מַהֵר의 속도감을 ‘곧바로’로 살렸습니다.
theological_decisions:
- issue: 우상숭배를 가리키는 성적 불성실 은유
  chosen_reading: ‘음행하였습니다’로 직역에 가깝게 유지해 우상숭배의 언약 배반성을 드러냈습니다.
  alternative_readings:
  - ‘부정하였습니다’
  - ‘그들을 배반하였습니다’
  rationale: 본문은 단순한 종교적 오답이 아니라 신실함의 파괴를 성적 은유로 말하므로, 그 긴장을 완화하지 않는 번역이 적합합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ‘재판관들’에 대한 불순종과 ‘명령’에 대한 순종의 대비
  chosen_reading: ‘재판관들에게도 듣지 않았다’와 ‘야훼의 명령에 순종하며’의 대비를 유지했습니다.
  alternative_readings:
  - ‘지도자들에게도 복종하지 않았다’
  - ‘야훼의 율법에 순종하며’
  rationale: שֹׁפְטִים은 이 시대의 역사적 직무 명칭이므로 일반화하지 않았고, מִצְוֺת는 여기서 율법 전체보다 ‘명령들’로 좁게 옮기는 것이 문맥에 더 정확합니다.
  doctrine_reference: 역사서 직무 명칭 / מִצְוֺת 어휘 범위
