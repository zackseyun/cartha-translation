  text: 눈의 아들 여호수아, 야훼의 종[a]이 백십 세에 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 노예’. ‘종’으로 옮긴 히브리어 단어는 둘 다 뜻할 수 있지만, 여기서는 여호수아에게 쓰인 존칭입니다.
    reason: lexical_alternative
