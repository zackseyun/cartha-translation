  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
  footnotes:
  - marker: a
    text: Or, 'the LORD relented' or 'the LORD had compassion'; the Hebrew verb can express a change of disposition or compassionate response.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그들을 위하여 재판관들을 세우실 때마다, 야훼께서는 그 재판관과 함께 계셨고 그 재판관이 있는 모든 날 동안 그들의 원수의 손에서 그들을 구원하셨습니다. 이는 야훼께서 그들을 압제하고 학대하는 자들로 인한 그들의 신음 때문에 그들을 불쌍히 여기셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 뜻을 돌이키셨다’, ‘야훼께서 연민을 느끼셨다’. 히브리어 동사는 태도의 변화 또는 자비로운 반응을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  english_pob_choice: judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 판관들
  - 사사들
  - 지도자들
  lexicon: HALOT
  rationale: 열왕기/사사기 문맥의 전통적 기능을 살리면서도 현대 한국어에서 ‘judge’의 제도적 의미를 가장 분명하게 드러내기 위해 ‘재판관들’을 택했습니다.
- source_word: הֵקִים
  english_pob_choice: raised up
  chosen_korean: 세우시면
  alternatives_korean:
  - 일으키시면
  - 세워 주시면
  - 임명하시면
  lexicon: HALOT
  rationale: 하나님이 주도적으로 지도자를 일으키신다는 관용적 표현을 한국어의 ‘세우다’로 옮겨, 단순 임명보다 더 강한 신적 주권의 뉘앙스를 살렸습니다.
- source_word: וְהוֹשִׁיעָם
  english_pob_choice: saved them
  chosen_korean: 그들을 구원하셨습니다
  alternatives_korean:
  - 그들을 구하셨습니다
  - 그들을 건지셨습니다
  - 그들을 구출하셨습니다
  lexicon: HALOT
  rationale: 연속된 구출 행위를 단순한 도움보다 강하게 드러내기 위해 ‘구원하다’를 사용했습니다. 문맥상 전쟁적 해방과 신적 구원의 의미를 함께 담습니다.
- source_word: יָחֵם / יִנָּחֵם
  english_pob_choice: was moved to pity
  chosen_korean: 마음 아파하셨습니다
  alternatives_korean:
  - 불쌍히 여기셨습니다
  - 마음을 돌이키셨습니다
  - 연민을 느끼셨습니다
  lexicon: HALOT
  rationale: POB의 ‘was moved to pity’에 맞춰 하나님의 반응을 회개나 오류의 철회가 아니라 고통받는 백성을 향한 감정적 응답으로 표현했습니다. ‘마음 아파하다’는 이 정서를 자연스럽게 전달합니다.
- source_word: לֹחֲצֵי/הֶם וְ/דֹחֲקֵי/הֶם
  english_pob_choice: those who oppressed and afflicted them
  chosen_korean: 그들을 압제하고 학대하는 자들
  alternatives_korean:
  - 그들을 억압하고 괴롭히는 자들
  - 그들을 짓누르고 핍박하는 자들
  - 그들을 압박하고 핍박하는 자들
  lexicon: HALOT
  rationale: 두 분사 모두 지속적 가해를 가리키므로, ‘압제하다’와 ‘학대하다’로 각각 구분해 중첩된 폭력성을 드러냈습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길 것인가
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  - the LORD
  rationale: 이 절은 신명기적 역사 서술 안에서 하나님의 고유한 언약 이름을 직접 사용하므로, 제목형 대체어보다 이름 자체를 보존하는 것이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: יִנָּחֵם יְהוָה의 신학적 뉘앙스
  chosen_reading: ‘마음 아파하셨습니다’로 하나님의 긍휼한 반응을 나타냈습니다.
  alternative_readings:
  - 뜻을 돌이키셨습니다
  - 후회하셨습니다
  - 불쌍히 여기셨습니다
  rationale: 이 표현은 하나님께 도덕적 오류를 돌리는 것이 아니라, 압제받는 백성의 탄식에 대한 진정한 감정적 응답을 말합니다. 한국어에서는 ‘마음 아파하다’가 그 긴장을 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
