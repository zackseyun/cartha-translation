  source_fidelity: 초안은 야훼께서 재판관들을 세우시고, 그 재판관과 함께 계시며, 원수들에게서 이스라엘을 구원하셨다는 핵심을 충실히 반영합니다. 그러나 ‘그들이 탄식하는 소리를 들으시고’는 원문의 ‘그들의 신음 때문에’에 없는 ‘들으시고’를 첨가합니다. 또한 ‘세우시면’은 뒤의 과거 서술과 시제가 어울리지 않으므로 반복적 과거를 분명히 해야 합니다.
  naturalness: ‘세우실 때마다 … 계셨고 … 구원하셨습니다’가 반복되는 역사 서술을 자연스럽고 일관되게 표현합니다. 원인 관계는 ‘그들을 압제하고 학대하는 자들로 인한 그들의 신음 때문에’로 옮기면 원문의 두 겹의 인과관계를 보존하면서도 자연스럽습니다.
