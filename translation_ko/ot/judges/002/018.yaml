revisions:
- from: 그때마다 야훼께서 그들에게 재판관들을 세우시면, 야훼께서 그 재판관과 함께 계시며 그들의 원수의 손에서 그들을 구원하셨습니다. 이것은 야훼께서 그들이 탄식하는 소리를 들으시고—그들을 압제하고 학대하는 자들 때문에—마음 아파하셨기 때문입니다.[a]
  to: 야훼께서 그들을 위하여 재판관들을 세우실 때마다, 야훼께서는 그 재판관과 함께 계셨고 그 재판관이 있는 모든 날 동안 그들의 원수의 손에서 그들을 구원하셨습니다. 이는 야훼께서 그들을 압제하고 학대하는 자들로 인한 그들의 신음 때문에 그들을 불쌍히 여기셨기 때문입니다.[a]
  rationale: 반복적 시간 표현을 자연스러운 과거 서술로 고치고, 원문에 없는 ‘들으시고’를 제거했습니다. 또한 야훼의 반응이 ‘신음 때문에’ 일어났고 그 신음은 압제자들과 학대자들 때문이라는 원문의 인과관계를 보존했습니다.
