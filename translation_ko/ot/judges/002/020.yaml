source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
  footnotes:
  - marker: a
    text: Or 'has broken my covenant.' The Hebrew verb literally means 'crossed over' and in covenant context carries the sense of violating or transgressing.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have not obeyed my voice.' The Hebrew idiom 'listen to my voice' often includes the sense of obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 야훼께서 이스라엘에게 진노하셔서 말씀하셨습니다. “이 민족이 내가 그들의 조상들에게 명령한 나의 언약을 어기고, 내 음성에 귀를 기울이지 않았기 때문이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘언약을 어겼다’는 뜻으로도 옮길 수 있습니다. 히브리어 동사는 문자적으로는 ‘건너가다’이며, 언약 문맥에서는 위반하거나 넘어선다는 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 음성에 순종하지 않았다’로도 옮길 수 있습니다. ‘음성에 듣다’라는 히브리어 관용구에는 종종 순종의 뜻이 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף / יְהוָה
  english_pob_choice: the anger of Yahweh burned
  chosen_korean: 야훼께서 … 진노하셔서
  alternatives_korean:
  - 야훼의 진노가 타올랐습니다
  - 야훼께서 … 노하셨습니다
  lexicon: WLC; HALOT
  rationale: 히브리어 관용구는 ‘분노가 뜨거워지다/타오르다’의 이미지이지만, 한국어에서는 ‘진노하셔서’가 자연스럽고 원문의 강한 정서를 유지합니다.
- source_word: הַגּוֹי הַזֶּה
  english_pob_choice: this nation
  chosen_korean: 이 민족
  alternatives_korean:
  - 이 나라
  - 이 백성
  lexicon: HALOT
  rationale: גוֹי의 기본값은 ‘민족/나라’이지만, 이 문맥에서는 이스라엘을 가리키는 집단 명칭으로서 ‘이 민족’이 가장 무난하게 원문 구분을 살립니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 나의 언약
  alternatives_korean:
  - 내 언약
  - 나의 계약
  lexicon: HALOT
  rationale: בְּרִית는 성경적·신학적 용례상 ‘언약’이 표준이며, 한국어 교회 용어도 이를 따르되 소유격을 앞세워 문맥의 강조를 살렸습니다.
- source_word: שָׁמְעוּ לְקוֹלִי
  english_pob_choice: they have not listened to my voice
  chosen_korean: 내 음성에 귀를 기울이지 않았기 때문이다
  alternatives_korean:
  - 내 목소리를 듣지 않았기 때문이다
  - 내 음성에 순종하지 않았기 때문이다
  lexicon: HALOT
  rationale: ‘듣다’와 ‘순종하다’가 겹치는 관용구이므로, 직역을 지나치게 굳히지 않으면서도 ‘음성’과 ‘귀를 기울이다’로 청종의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기를 직접 가리키는 고유명사를 제목적 표현으로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 언약 파기의 죄책과 청종의 결여
  chosen_reading: 언약을 어기고, 내 음성에 귀를 기울이지 않았습니다
  alternative_readings:
  - 언약을 깨고, 내 말을 듣지 않았습니다
  - 언약을 범하고, 내 음성에 순종하지 않았습니다
  rationale: 이 절은 단순한 불복종이 아니라 언약 위반과 하나님의 음성 거절을 함께 고발하므로, 두 표현을 모두 살려 신학적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
