  naturalness: ‘이에’와 ‘진노하셨습니다’는 현대 표준어 합쇼체 서사에 자연스럽습니다. ‘내가 그들의 조상들에게 명령한 내 언약’은 원문의 압축된 구문을 자연스럽게 재현합니다. 인용문 끝을 ‘않았으므로,’로 처리하면 다음 절과의 연결도 분명해집니다.
  terminology: יהוה는 프로젝트 원칙에 따라 ‘야훼’로 유지하고, בְּרִית는 ‘언약’, גּוֹי는 원문의 표지를 살려 ‘민족’으로 유지합니다. שָׁמַע לְקוֹל은 직역적 청종의 표현인 ‘음성에 귀를 기울이다’로 유지하되, 각주에서 ‘순종하다’의 함의를 제시합니다.
