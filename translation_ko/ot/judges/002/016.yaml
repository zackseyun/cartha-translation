  - marker: a
    text: Or 'they delivered them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 사사들을 일으키셨습니다. 그들은 그들을 약탈하는 자들의 손에서 그들을 구해 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 그들을 구출했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기 יְהוָה를 고유명사로 살려, POB의 ‘Yahweh’에 맞춰 ‘야훼’로 옮겼습니다.
- source_word: שֹׁפְטִים
  english_pob_choice: judges
  chosen_korean: 사사들
  alternatives_korean:
  - 재판관들
  - 지도자들
  - 구원자들
  lexicon: HALOT
  rationale: 이 책의 전통적 용어이면서도 히브리어 שֹׁפְטִים의 직접 대응인 ‘사사들’을 유지해 직분과 본문 용례를 함께 보존했습니다.
- source_word: וַיּוֹשִׁיעוּם
  english_pob_choice: they saved them
  chosen_korean: 그들은 그들을 구해 주었습니다
  alternatives_korean:
  - 그들은 그들을 구원했습니다
  - 그들은 그들을 건져 주었습니다
  - 그들은 그들을 구출했습니다
  lexicon: HALOT
  rationale: ישׁע의 핵심 의미인 구출/구원을 자연스러운 현대 한국어로 전달하되, 종교적 과잉 해석을 피하기 위해 ‘구해 주었습니다’로 옮겼습니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: ~의 손에서
  alternatives_korean:
  - ~의 권세에서
  - ~의 손아귀에서
  - ~의 힘에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려, 지배와 통제의 비유를 한국어에서도 유지했습니다.
- source_word: שֹׁסֵיהֶם
  english_pob_choice: those who plundered them
  chosen_korean: 그들을 약탈하는 자들
  alternatives_korean:
  - 그들을 노략질하는 자들
  - 그들을 짓밟는 자들
  - 그들을 압제하는 자들
  lexicon: HALOT
  rationale: שסה의 약탈·노략 의미를 분명히 드러내면서, ‘압제하는 자들’처럼 의미를 넓혀 흐리지 않도록 했습니다.
theological_decisions:
- issue: 사사들의 역할을 직분과 구출 행위 중 어디에 무게를 둘지
  chosen_reading: ‘사사들’이라는 직분 명칭을 본문에 유지하되, 뒤의 동사로 그들이 실제로 이스라엘을 구해 준 행동을 분명히 드러냈습니다.
  alternative_readings:
  - ‘구원자들’로 바꾸어 번역
  - ‘지도자들’로 완화
  rationale: 히브리어 본문은 직분명과 기능을 함께 말하므로, 둘 중 하나로 축소하지 않는 것이 본문 충실성에 더 맞습니다.
  doctrine_reference: Translation philosophy §5
