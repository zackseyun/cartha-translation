  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
  footnotes:
  - marker: a
    text: Or “crossing places.” The Hebrew refers to the river fords, the shallow places used to cross the Jordan.
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗이 요단 강의 나루들을 에브라임을 상대로 점령하였습니다. 그러면 에브라임의 도망자들이 “제가 건너가게 해 주십시오”라고 말하면 길르앗 사람들은 그에게 “당신은 에브라임 사람이 아닙니까?”라고 물었고, 그가 “아닙니다”라고 하면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나루들’은 히브리어의 강을 건너는 얕은 지점(=fords)을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד ... אֶת מַעְבְּרוֹת
  english_pob_choice: captured the fords
  chosen_korean: 나루들을 ... 점령하였습니다
  alternatives_korean:
  - 나루들을 ... कब्ज하였습니다
  - 나루를 ... 장악하였습니다
  lexicon: HALOT
  rationale: מַעְבְּרוֹת는 강을 건너는 얕은 지점인 ‘fords’에 해당하므로, 한국어에서는 자연스럽고 구체적인 ‘나루들’이 적절합니다. וַיִּלְכֹּד는 군사적 점거를 뜻하므로 ‘점령하다’가 문맥을 가장 잘 살립니다.
- source_word: לְאֶפְרָיִם
  english_pob_choice: against Ephraim
  chosen_korean: 에브라임을 상대로
  alternatives_korean:
  - 에브라임에 대하여
  - 에브라임에게 맞서
  lexicon: HALOT
  rationale: 여기서 ל는 단순한 방향이 아니라 에브라임을 차단하는 적대적 용법이므로, ‘에브라임을 상대로’로 옮겨 방어·봉쇄의 뉘앙스를 드러냈습니다.
- source_word: פְּלִיטֵי אֶפְרַיִם
  english_pob_choice: the fugitives of Ephraim
  chosen_korean: 에브라임의 도망자들
