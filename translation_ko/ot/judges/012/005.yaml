  rationale: 히브리어의 정체 확인 질문을 한국어 의문문으로 자연스럽게 옮겼습니다. 여기서는 상대를 심문하는 장면이므로 공손한 직설형보다 판별 질문의 뉘앙스를 살렸습니다.
