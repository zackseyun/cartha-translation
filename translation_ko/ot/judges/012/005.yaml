  - 에브라임의 탈주자들
  lexicon: HALOT
  rationale: פּליט은 전투에서 빠져나온 사람을 가리킬 수 있으므로, 상황상 ‘도망자들’이 가장 자연스럽고 직접적입니다.
- source_word: אֶעֱבֹרָה
  english_pob_choice: Let me cross over
  chosen_korean: 제가 건너가게 해 주십시오
