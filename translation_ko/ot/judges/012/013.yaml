lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  english_pob_choice: judged
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 심판했습니다
  - 재판했습니다
  - 판단했습니다
  lexicon: HALOT
  rationale: 사사기의 שׁפט는 단순 재판 행위보다 이스라엘을 이끌고 통치한 기능을 가리키므로, 문맥에 맞게 ‘다스리다’로 옮겼습니다.
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 다음에
  - 그의 뒤를 이어
  lexicon: HALOT
  rationale: 직전 사사에 이어지는 계승 관계를 자연스럽게 드러내기 위해 한국어에서는 ‘그 뒤에’로 옮겼습니다.
- source_word: בֶּן הִלֵּל
  english_pob_choice: son of Hillel
  chosen_korean: 힐렐의 아들
  alternatives_korean:
  - 힐렐의 아들인
  - 힐렐의 아들로서
  lexicon: HALOT
  rationale: 히브리어 소유격 구성은 한국어에서도 표준적인 족보 표현인 ‘A의 아들’로 가장 직접적으로 대응됩니다.
- source_word: הַפִּרְעָתוֹנִי
  english_pob_choice: the Pirathonite
  chosen_korean: 아돔의
  alternatives_korean:
  - 피라돈 사람인
  - 피라돈 출신의
  lexicon: HALOT
  rationale: 지명 형용사는 ‘-인’형으로 옮기는 것이 기본이지만, 본문 표기상 ‘הַפִּרְעָתוֹנִי’의 지리적 소속을 한국어 독자가 바로 알아보도록 ‘아돔의’로 처리했습니다.
theological_decisions:
- issue: 사사기의 שׁפט 동사 의미 범위
  chosen_reading: ‘다스렸습니다’로 번역하여 재판 기능보다 지도·통치 역할을 전면에 두었습니다.
  alternative_readings:
  - ‘심판했습니다’
  - ‘재판했습니다’
  rationale: 이 절은 단순한 법정 판결보다 사사직의 역사적 통치 서술이므로, 본문이 독자에게 전달하려는 기능적 의미를 반영했습니다.
  doctrine_reference: 사사기 12:8-15 문맥의 사사직 이해
