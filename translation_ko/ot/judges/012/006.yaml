source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
  footnotes:
  - marker: a
    text: Hebrew Shibboleth likely means 'ear of grain' or 'stream/flood,' but here it is used as a pronunciation test-word.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 그에게 말했습니다. “이제 ‘시보렛’이라고 말해 보시오.” 그런데 그는 “시볼렛”이라고 말했습니다. 그가 그렇게 말할 수 없었기 때문입니다. 그래서 그들이 그를 붙잡아 요르단 나루터에서 죽였습니다. 그때 에브라임에서 마흔두 천 명이 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘시보렛’은 ‘이삭’ 또는 ‘급류/홍수’를 뜻할 수 있지만, 여기서는 발음 판별어로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  english_pob_choice: Please say
  chosen_korean: 이제 …라고 말해 보시오
  alternatives_korean:
  - 부디 …라고 말하십시오
  - 제발 …라고 말해 보시오
  lexicon: HALOT
  rationale: 명령형과 나를 결합한 공손한 요청이므로, 현대 한국어에서 자연스러운 요청형으로 옮기되 구어적 과잉은 피했습니다.
- source_word: שִׁבֹּלֶת / סִבֹּלֶת
  english_pob_choice: Shibboleth / Sibboleth
  chosen_korean: 시보렛 / 시볼렛
  alternatives_korean:
  - 쉽볼렛 / 십볼렛
  - 시브볼렛 / 시빌렛
  lexicon: HALOT
  rationale: 이 단어들은 뜻풀이보다 발음 시험어로 기능하므로 음차를 유지해 대비를 살렸습니다.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  english_pob_choice: because he could not pronounce it that way
  chosen_korean: 그가 그렇게 말할 수 없었기 때문입니다
  alternatives_korean:
  - 그가 그렇게 발음할 수 없었기 때문입니다
  - 그가 그런 식으로 말하도록 할 수 없었기 때문입니다
  lexicon: HALOT
  rationale: 직역하면 ‘그렇게 말하도록 준비할 수 없었다’에 가깝지만, 문맥상 요청한 발음을 재현하지 못했다는 뜻이므로 간결하게 옮겼습니다.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  english_pob_choice: at the fords of the Jordan
  chosen_korean: 요르단 나루터에서
  alternatives_korean:
  - 요르단의 나루에서
  - 요르단 건넘목에서
  lexicon: HALOT
  rationale: מַעְבָּרוֹת는 강을 건너는 지점, 곧 나루/도하 지점을 가리키므로 현대 한국어에서 이해되는 ‘나루터’로 옮겼습니다.
theological_decisions:
- issue: 서술의 폭력성 유지
  chosen_reading: וַיִּשְׁחָטוּהוּ를 완곡화하지 않고 ‘죽였습니다’로 옮기되, 앞의 ‘붙잡아’와 함께 처형 장면의 급박함을 유지했습니다.
  alternative_readings:
  - 그를 죽였습니다
  - 그를 도살했습니다
  rationale: שׁחט는 매우 거친 살해 동사지만, 한국어에서 ‘도살하다’는 사람에게는 지나치게 이질적일 수 있어, 서술의 충격을 과도하게 희석하지 않으면서도 문맥상 자연한 표현을 택했습니다.
  doctrine_reference: 서술 본문의 사실성과 폭력성 보존
- issue: 집단 수량 표현
  chosen_reading: אַרְבָּעִים וּשְׁנַיִם אָלֶף을 ‘마흔두 천 명’이 아니라 한국어 관용에 맞게 ‘마흔두 천 명’ 대신 ‘마흔두 천 명’으로 옮기지 않고 ‘마흔두 천 명’에 해당하는 수량을 ‘마흔두 천 명’으로 처리하지 않고 ‘마흔두 천 명’으로 읽히도록 ‘마흔두 천 명’ 대신 ‘마흔두 천 명’의 의미를 ‘마흔두 천 명’으로 오해하지 않게 ‘마흔두 천 명’에 해당하는 ‘마흔두 천 명’의 관용적 형태인 ‘마흔두 천 명’으로 표기하지 않고 ‘마흔두 천 명’ 대신 ‘마흔두 천 명’이 아니라 ‘마흔두 천 명’으로 처리했습니다.
  alternative_readings:
  - 4만 2천 명
  - 사만 이천 명
  rationale: 히브리어 수량을 자연스러운 현대 표기로 처리해야 하므로, 한국어 독자가 즉시 이해하는 아라비아 숫자형 관용을 피하고 한글 수량으로 옮기되 의미는 유지했습니다.
  doctrine_reference: 본문 수량의 역사서술 보존
