  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ט אַֽחֲרָי/ו֙ אֶת יִשְׂרָאֵ֔ל אֵיל֖וֹן הַ/זְּבֽוּלֹנִ֑י וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל עֶ֥שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/011.yaml
  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: ko
  text: 그 뒤에 엘론, 스불론 사람은 이스라엘을 다스린 지 십 년이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  english_pob_choice: judged
  chosen_korean: 다스린 지
  alternatives_korean:
  - 판단했습니다
  - 재판했습니다
  - 다스렸습니다
  lexicon: HALOT
  rationale: 사사기에서 שׁפט는 이스라엘을 이끈 사사직의 통상 표현이므로, 한국어에서는 문맥에 맞는 통치·다스림의 의미를 살려 자연스럽게 옮겼습니다.
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 다음에
  - 그 뒤에 그가
  lexicon: HALOT
  rationale: 대명사 ‘그’의 지시 대상을 앞선 사사로 유지하면서, 한국어에서는 간결하고 자연스러운 시간 연결 표현으로 옮겼습니다.
- source_word: אֵילוֹן הַזְּבוּלֹנִי
  english_pob_choice: Elon the Zebulunite
  chosen_korean: 엘론, 스불론 사람
  alternatives_korean:
  - 엘론, 스불론 지파 사람
  - 스불론 사람 엘론
  - 엘론, 스불론 출신
  lexicon: HALOT
  rationale: יַליד/지파 소속을 나타내는 형용사형을 한국어에서는 ‘스불론 사람’으로 풀어, 지파 소속을 분명히 하면서도 본문의 간결함을 보존했습니다.
- source_word: עֶשֶׂר שָׁנִים
  english_pob_choice: ten years
  chosen_korean: 십 년이었습니다
  alternatives_korean:
  - 열 해였습니다
  - 십 년 동안이었습니다
  - 열 해 동안 다스렸습니다
  lexicon: HALOT
  rationale: 기간 표현은 한국어에서 ‘십 년’으로 자연스럽게 옮겼고, 본문의 통치 기간 진술을 매끄럽게 하기 위해 서술어를 보완했습니다.
theological_decisions:
- issue: 사사기에서 שׁפט의 의미
  chosen_reading: ‘judged’를 단순히 재판 행위로 좁히지 않고, 이스라엘을 ‘다스린’ 사사적 통치로 이해했습니다.
  alternative_readings:
  - ‘재판했습니다’처럼 사법 행위로만 제한하는 번역
  - ‘통치했습니다’로 더 직접적으로 옮기는 번역
  rationale: 사사기의 반복 공식은 개인의 법정 활동보다 이스라엘 위에서의 지도·구원 역할을 가리키므로, 문맥상 그 기능을 드러내는 표현이 필요합니다.
  doctrine_reference: 사사기 2:16-18의 사사 개념, 사사기의 서술 관습
