    rationale: 이는 ‘다스리기 시작한 뒤 십 년이 지났다’는 뜻으로 읽히며, 엘론이 십 년 동안 이스라엘을 다스렸다는 본문의 진술을 자연스럽고 정확하게 전달하지 못합니다.
