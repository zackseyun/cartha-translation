  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: ko
  text: 입다는 길르앗의 모든 사람을 모아 에브라임과 싸웠습니다. 길르앗 사람들이 에브라임을 쳤습니다. 이는 그들이 말하기를, “너희 길르앗 사람들은 에브라임의 도망자들이며, 에브라임 가운데와 므낫세 가운데에 있다” 하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 모욕 표현은 구문이 어렵습니다. 달리 옮기면, “너희는 에브라임의 도망자들이다, 길르앗아, 에브라임 가운데와 므낫세 가운데에서.”
    reason: alternative_reading
