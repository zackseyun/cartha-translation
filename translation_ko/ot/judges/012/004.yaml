  to: 입다는 길르앗의 모든 사람을 모아 에브라임과 싸웠습니다. 길르앗 사람들이 에브라임을 쳤습니다. 이는 그들이 말하기를, “너희 길르앗 사람들은 에브라임의 도망자들이며, 에브라임 가운데와 므낫세 가운데에 있다” 하였기 때문입니다.[a]
  rationale: 인명 오기를 바로잡고, ‘치다’로 원문의 군사적 폭력을 유지하되 죽임을 단정하지 않았습니다. 마지막 직접화법은 히브리어의 압축된 어순과 소유격의 여지를 가능한 한 보존했으며, 논쟁적인 대안은 각주에 제시했습니다. 전체 문체는 현대 표준어 합쇼체로 통일했습니다.
