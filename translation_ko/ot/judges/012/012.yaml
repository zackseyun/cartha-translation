source:
  edition: WLC
  text: וַ/יָּ֖מָת אֵל֣וֹן הַ/זְּבֽוּלֹנִ֑י וַ/יִּקָּבֵ֥ר בְּ/אַיָּל֖וֹן בְּ/אֶ֥רֶץ זְבוּלֻֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
  footnotes:
  - marker: a
    text: Or 'in the territory of Zebulun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘론, 스불론 사람[a]이 죽었고, 그가 스불론 땅의 아얄론에 묻혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스불론 영토의 사람’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: Then ... died
  chosen_korean: 그때 ... 죽었고
  alternatives_korean:
  - 그리고 ... 죽었고
  - 그리하여 ... 죽었고
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 wayyiqtol의 순차성을 살리면서, 한국어에서는 자연스러운 사건 전개를 위해 ‘그때’와 연결했습니다.
- source_word: הַזְּבוּלֹנִי
  english_pob_choice: the Zebulunite
  chosen_korean: 스불론 사람
  alternatives_korean:
  - 스불론인
  - 스불론 지파 사람
  lexicon: HALOT
  rationale: 지파/지역 소속을 나타내는 gentilic을 한국어에서 간결하고 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: וַיִּקָּבֵר
  english_pob_choice: and he was buried
  chosen_korean: 묻혔습니다
  alternatives_korean:
  - 장사되었습니다
  - 매장되었습니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 기본 의미를 따라, 공적인 매장 사실을 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: בְּאַיָּלוֹן
  english_pob_choice: in Aijalon
  chosen_korean: 아얄론에
  alternatives_korean:
  - 아이얄론에
  - 아얄론에서
  lexicon: HALOT
  rationale: 지명은 음역을 따르되, 전통적으로 통용되는 성서 표기를 고려해 ‘아얄론’을 채택했습니다.
theological_decisions:
- issue: 지명 보충어의 범위
  chosen_reading: ‘스불론 땅’으로 옮겨, burial location이 그 영토 안에 있음을 분명히 했습니다.
  alternative_readings:
  - ‘스불론 지역’
  - ‘스불론의 영토’
  rationale: בְּאֶרֶץ זְבוּלֻן은 단순한 행정구역보다 ‘땅/영토’라는 공간적 귀속을 드러내므로, 서술의 의도를 가장 सीधे하게 전달합니다.
  doctrine_reference: 지리 서술의 정확성
