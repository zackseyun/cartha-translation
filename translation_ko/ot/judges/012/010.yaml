lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: Then ... died
  chosen_korean: 그런 다음 ... 죽어
  alternatives_korean:
  - 그리고 ... 죽어
  - '... 죽었습니다'
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어에서는 자연스러운 순차 표현인 ‘그런 다음’으로 살렸습니다. ‘죽었다’의 서술 과거보다, 이어지는 동작감을 유지하는 ‘죽어’를 택했습니다.
- source_word: אִבְצָן
  english_pob_choice: Ibzan
  chosen_korean: 이브산
  alternatives_korean:
  - 입산
  - 이븐산
  lexicon: 표준 음역
  rationale: 고유명사는 음역하되, 한국어 관용 표기 가능성을 고려해 읽기 쉬운 현대식 표기를 사용했습니다.
- source_word: וַיִּקָּבֵר
  english_pob_choice: was buried
  chosen_korean: 장사되었습니다
  alternatives_korean:
  - 묻혔습니다
  - 매장되었습니다
  lexicon: HALOT
  rationale: 수동 의미를 살리면서도 장례·매장 맥락을 드러내는 공손한 서술체를 선택했습니다.
- source_word: בְּבֵית לָחֶם
  english_pob_choice: in Bethlehem
  chosen_korean: 베들레헴에
  alternatives_korean:
  - 베들레헴에서
  - 베들레헴 안에
  lexicon: HALOT
  rationale: 장소 전치사 בְּ의 기본 위치 의미를 한국어 여격/처소 조사 ‘-에’로 자연스럽게 옮겼습니다.
