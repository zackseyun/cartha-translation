lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: Then ... died
  chosen_korean: 그런 다음 ... 죽어
  alternatives_korean:
  - 그리고 ... 죽어
  - '... 죽었습니다'
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어에서는 자연스러운 순차 표현인 ‘그런 다음’으로 살렸습니다. ‘죽었다’의 서술 과거보다, 이어지는 동작감을 유지하는 ‘죽어’를 택했습니다.
- source_word: אִבְצָן
  english_pob_choice: Ibzan
  chosen_korean: 이브산
