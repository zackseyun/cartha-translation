  rationale: 본문은 실제 살해 위협까지 내포할 수 있는 격한 협박이므로, 독자가 본문의 긴장과 폭력을 그대로 인식하도록 유지했습니다.
  doctrine_reference: 본문 서술의 역사적·문학적 정직성
- issue: 직접화법의 존대 수준
  chosen_reading: 입다에게 하는 말은 한국어에서 자연스러운 대립·협박의 대화체로 처리하되, 고어체는 피했습니다.
  alternative_readings:
  - 현대적 반말
  - 지나치게 공손한 문어체
  rationale: 원문은 적대적 항의이므로, 과도한 공손함보다 대화의 공격성을 살리는 것이 본문 기능에 더 부합합니다.
