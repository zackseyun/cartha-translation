- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  english_pob_choice: We will burn your house down over you with fire
  chosen_korean: 우리는 당신 위에 불로 당신 집을 불태우겠소
  alternatives_korean:
  - 우리는 불로 당신 집을 당신 위에 불태우겠소
