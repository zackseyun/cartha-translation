  rationale: צָפוֹנָה는 지명일 수도 있지만 여기서는 방향 부사로 이해하는 전통이 강해, 본문 흐름에 맞게 ‘북쪽으로’로 옮겼습니다.
- source_word: לָלֶכֶת עִמָּךְ
