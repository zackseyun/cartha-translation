base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
  footnotes:
  - marker: a
    text: Or 'northward' if צָפוֹנָה is taken as a directional adverb rather than the place name Zaphon.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew literally has ''man of Ephraim,'' but the surrounding verbs indicate a collective sense: the Ephraimites as a group.'
    reason: lexical_alternative
  - marker: c
    text: The threat likely means, 'We will burn your house with you in it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에브라임 사람들이 소집되어 북쪽으로 건너가서 입다에게 말했습니다. “어찌하여 당신은 암몬 자손과 싸우러 건너가면서 우리를 부르지 않아 함께 가게 하지 않았소? 우리는 당신 위에 불로 당신 집을 불태우겠소.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘북쪽으로’는 צָפוֹנָה를 지명 ‘사פון’이 아니라 방향 부사로 본 번역입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘에브라임 사람’이지만, 문맥상 집단 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 이 위협은 ‘당신이 집 안에 있는 채로 불태우겠다’는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  english_pob_choice: the men of Ephraim were called together
  chosen_korean: 에브라임 사람들이 소집되어
  alternatives_korean:
  - 에브라임의 한 사람이 소리쳐
  - 에브라임 사람들이 소리쳐
  lexicon: HALOT
  rationale: אִישׁ가 형태상 단수이지만 뒤의 복수 동사와 문맥상 집단을 가리키므로, ‘소집되어’로 집단적 동원을 자연스럽게 살렸습니다.
- source_word: וַֽיַּעֲבֹר צָפוֹנָה
  english_pob_choice: they crossed over to Zaphon
  chosen_korean: 북쪽으로 건너가서
  alternatives_korean:
  - 사פון으로 건너가서
  - 북으로 건너가서
  lexicon: HALOT
  rationale: צָפוֹנָה는 지명일 수도 있지만 여기서는 방향 부사로 이해하는 전통이 강해, 본문 흐름에 맞게 ‘북쪽으로’로 옮겼습니다.
- source_word: לָלֶכֶת עִמָּךְ
  english_pob_choice: to go with you
  chosen_korean: 함께 가게 하지 않았소
  alternatives_korean:
  - 당신과 함께 가게 하지 않았소
  - 당신과 같이 가도록 부르지 않았소
  lexicon: HALOT
  rationale: 직역보다 한국어에서 자연스러운 요구·불만의 표현인 ‘함께 가게 하지 않았소’로 옮겨, 호출하여 동참시키지 않았다는 의미를 드러냈습니다.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  english_pob_choice: We will burn your house down over you with fire
  chosen_korean: 우리는 당신 위에 불로 당신 집을 불태우겠소
  alternatives_korean:
  - 우리는 불로 당신 집을 당신 위에 불태우겠소
  - 우리는 당신이 있는 집에 불을 지르겠소
  lexicon: HALOT
  rationale: ‘당신 위에’는 집이 그를 덮치는 위협적 이미지를 살리기 위한 표현이며, ‘불로’는 원문의 באש을 직접 반영합니다.
theological_decisions:
- issue: 위협 문구의 폭력성 표현
  chosen_reading: 원문의 과격한 위협을 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
