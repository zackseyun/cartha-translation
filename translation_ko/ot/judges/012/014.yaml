  text: וַ/יְהִי ל֞/וֹ אַרְבָּעִ֣ים בָּנִ֗ים וּ/שְׁלֹשִׁים֙ בְּנֵ֣י בָנִ֔ים רֹכְבִ֖ים עַל שִׁבְעִ֣ים עֲיָרִ֑ם וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: ko
  text: 그에게는 마흔 명의 아들과 서른 명의 손자가 있었는데, 그들은 일흔 마리의 나귀를 타고 다녔습니다. 그는 이스라엘을 팔 년 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנִים
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 아들
  - 자녀들
  lexicon: בֵּן
  rationale: 명시적으로 남성 후손을 가리키므로, 영어 POB의 sons에 맞춰 ‘아들들’로 옮겼습니다.
- source_word: בְּנֵי בָנִים
  english_pob_choice: grandsons
  chosen_korean: 손자들
  alternatives_korean:
  - 손자
  - 후손들
  lexicon: בֵּן + בֵּן
  rationale: 직역하면 ‘아들의 아들들’이지만 한국어 관용에 맞게 손자들로 자연스럽게 옮겼습니다.
- source_word: רֹכְבִים עַל שִׁבְעִים עֲיָרִם
  english_pob_choice: riding on seventy donkeys
  chosen_korean: 일흔 마리의 나귀를 타고 다녔습니다
  alternatives_korean:
  - 일흔 마리의 나귀를 탔습니다
  - 일흔 마리 나귀 위에 있었습니다
  lexicon: רָכַב + עַיִר
  rationale: 현재분사 רֹכְבִים은 지속적 상태를 나타내므로, 단회 사건보다 ‘타고 다녔습니다’가 더 잘 반영합니다.
- source_word: וַיִּשְׁפֹּט
  english_pob_choice: he judged
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 재판했습니다
  - 판단했습니다
  - 통치했습니다
  lexicon: שָׁפַט
  rationale: 사사기의 문맥에서 שָׁפַט는 단순 판결보다 이스라엘을 사사로서 다스린다는 기능을 가리키므로, POB의 ‘judged’ 의미를 한국어로 ‘다스렸습니다’로 옮겼습니다.
theological_decisions:
- issue: שָׁפַט의 사사직 표현
  chosen_reading: ‘다스렸습니다’는 사사의 공적 통치를 가리키며, 개인적 재판 행위로 축소하지 않습니다.
  alternative_readings:
  - ‘심판했습니다’
  - ‘재판했습니다’
  rationale: 본문은 사사로서의 재임 기간을 말하므로, 기능적 의미를 드러내는 번역이 문맥상 더 정확합니다.
  doctrine_reference: 사사기 12:7-15 문맥
