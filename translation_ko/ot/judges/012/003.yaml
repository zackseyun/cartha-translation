  source_fidelity: 개정이 필요합니다. 히브리어의 2인칭 단수(אֵינְךָ, עֲלִיתֶם의 본문상 복수 여부는 후자는 복수 형태이나 문맥상 에브라임 사람들에 대한 복수 호칭이며, 앞의 '네가'는 단수로 왕에게 말하는 영어 감사 추적과 긴장이 있습니다). WLC 본문은 אֵינְךָ 단수이나 עֲלִיתֶם은 복수이므로 한국어에서도 앞부분은 단수, 마지막 질문은 복수로 보존해야 합니다. 초안은 앞부분의 단수 대상을 복수로 바꾸어 놓았습니다. 또한 '구원하지 아니함'에는 목적어가 불분명하게 생략되어 있어 '우리를'을 보충하는 편이 적절합니다.
  naturalness: 초안의 '-매', '-은즉', '하느냐'는 현대 표준어 합쇼체 요구와 맞지 않습니다. 현대적인 정중 문장인 '-았습니다/-습니까'로 고쳤습니다. '내 생명을 내 손에 붙이고'는 한국어에서 부자연스러우므로 관용 의미를 살린 '목숨을 걸고'로 옮기고, 원문의 손 이미지와 관용적 의미는 각주로 밝혔습니다.
