- from: 그에게는 아들 서른 명과 딸 서른 명이 있었는데, 딸들은 밖으로 시집보냈고, 아들들을 위해서는 밖에서 서른 딸을 데려왔습니다. 그리고 그는 이스라엘을 칠 년 동안 다스렸습니다.[a]
  to: 그에게는 아들 서른 명과 딸 서른 명이 있었는데, 딸 서른 명은 밖으로 내보내고, 아들들을 위해 밖에서 딸 서른 명을 데려왔습니다.[a] 그리고 그는 이스라엘을 칠 년 동안 다스렸습니다.
  rationale: 본문에서는 שׁלח와 החוצה의 기본 의미인 ‘밖으로 내보내다’를 유지하고, 혼인으로 이해되는 문맥적 함의는 주석에만 제시했습니다. 두 번 나오는 ‘딸’과 각기 다른 이동 방향도 그대로 보존했습니다. ‘다스렸습니다’는 사사기에서 이스라엘에 대한 שׁפט의 기능을 자연스러운 한국어로 전달합니다.
  reviewer_model: gpt-5.6-terra
