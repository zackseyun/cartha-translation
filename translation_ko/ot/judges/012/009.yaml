  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי ל֞/וֹ שְׁלֹשִׁ֣ים בָּנִ֗ים וּ/שְׁלֹשִׁ֤ים בָּנוֹת֙ שִׁלַּ֣ח הַ/ח֔וּצָ/ה וּ/שְׁלֹשִׁ֣ים בָּנ֔וֹת הֵבִ֥יא לְ/בָנָ֖י/ו מִן הַ/ח֑וּץ וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל שֶׁ֥בַע שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'he married off thirty daughters outside his clan/household, and brought in thirty women from outside for his sons.' The Hebrew literally says 'daughters' in both clauses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 아들 서른 명과 딸 서른 명이 있었는데, 딸 서른 명은 밖으로 내보내고, 아들들을 위해 밖에서 딸 서른 명을 데려왔습니다.[a] 그리고 그는 이스라엘을 칠 년 동안 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 구절에서 모두 문자적으로 ‘딸들’이라고 합니다. 문맥상 그는 딸들을 혼인시켜 밖으로 보내고, 아들들을 위해 밖에서 여성들을 데려온 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  english_pob_choice: He had
  chosen_korean: 그에게는 …이 있었는데
  alternatives_korean:
  - 그는 …을 가졌는데
  - 그에게 …이 있었고
  lexicon: HALOT
  rationale: 히브리어 היה + לֹו는 소유를 나타내므로, 한국어에서는 자연스러운 소유 표현으로 옮겼습니다.
- source_word: שִׁלַּח הַחוּצָה
  english_pob_choice: he sent away
  chosen_korean: 밖으로 시집보냈고
  alternatives_korean:
  - 내보냈고
  - 밖으로 보냈고
  lexicon: HALOT
  rationale: 문자적으로는 ‘내보내다/보내다’이지만, 문맥상 딸들의 혼인 배치를 가리키는 것으로 보이므로 너무 우회하지 않되 한국어에서 의미가 분명한 표현을 택했습니다.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  english_pob_choice: and he brought in thirty daughters from outside for his sons
  chosen_korean: 아들들을 위해서는 밖에서 서른 딸을 데려왔습니다
  alternatives_korean:
  - 아들들을 위해 밖에서 서른 딸을 들여왔습니다
  - 아들들을 위해 바깥에서 서른 딸을 데려왔습니다
  lexicon: HALOT
  rationale: 히브리어가 여기서도 ‘딸들’이라고 반복하는 점을 살리되, 한국어에서는 혼인 맥락이 드러나도록 ‘아들들을 위해’와 ‘데려왔습니다’를 사용했습니다.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  english_pob_choice: And he judged Israel
  chosen_korean: 그리고 그는 이스라엘을 … 다스렸습니다
  alternatives_korean:
  - 그리고 그는 이스라엘을 심판했습니다
  - 그리고 그는 이스라엘을 재판했습니다
  lexicon: HALOT
  rationale: 사사기에서 שׁפט는 단순한 재판 행위가 아니라 사사로서의 통치/판결 직무를 가리키므로, 본문 맥락상 ‘다스리다’로 옮겨 기능을 드러냈습니다.
theological_decisions:
- issue: 사사기 본문의 שׁפט 의미
  chosen_reading: ‘심판하다’보다 사사로서의 통치 기능을 살리는 ‘다스리다’를 본문에 사용했습니다.
  alternative_readings:
  - 심판하다
  - 재판하다
  - 판결하다
  rationale: 이 장르에서는 שׁפט가 반복적으로 ‘사사로서 이스라엘을 이끎’을 뜻하므로, 독자가 사건의 역사적 기능을 오해하지 않도록 했습니다.
  doctrine_reference: 사사기 12장 내 서술 관용
- issue: ‘딸들’의 반복과 혼인 함의
  chosen_reading: 히브리어의 문자적 반복을 살리면서도, 한국어에서는 ‘시집보냈고/데려왔습니다’로 혼인 배치를 암시했습니다.
  alternative_readings:
  - 딸들을 밖으로 보냈고
  - 딸들을 밖에서 데려왔습니다
  - 딸들을 시집보냈고
  rationale: 원문이 실제로 ‘딸들’이라고 말하므로 이를 지우지 않되, 문맥상 혼인 배치라는 암시를 과도하게 단정하지 않도록 균형을 잡았습니다.
  doctrine_reference: 본문의 문자성 보존과 문맥적 의미 전달
