revisions:
- from: 기드온이 그에게 말했습니다. 「부디, 내 주인이시여, 야훼께서 우리와 함께 계시다면, 왜 이 모든 일이 우리에게 일어났습니까? 또 우리 조상들이 ‘야훼께서 우리를 이집트에서 올라오게 하지 않으셨느냐’ 하고 우리에게 들려준 그분의 모든 놀라운 일은 어디에 있습니까? 그런데 이제 야훼께서는 우리를 버리시고 미디안의 손에 넘기셨습니다.」[a][b][c]
  to: 기드온이 그에게 말했습니다. 「부디[a], 나리, 야훼께서 우리와 함께 계시다면, 어찌하여 이 모든 일이 우리에게 닥쳤습니까? 또 우리 조상들이 우리에게 들려주며 ‘야훼께서 우리를 이집트에서 올라오게 하지 않으셨느냐’라고 말한 그분의 모든 놀라운 일들[b]은 어디에 있습니까? 그런데 이제 야훼께서는 우리를 버리시고 미디안의 손[c]에 넘기셨습니다.」
  rationale: 「나리」는 이 대목에서 אֲדֹנִי가 나타내는 비신격적이고 공손한 호칭을 ‘주인’의 소유 의미 없이 전달합니다. 문장의 핵심 의미는 유지하면서 복수형, 재난이 ‘닥침’의 의미, 그리고 각주 표지의 연결을 명확히 했습니다.
