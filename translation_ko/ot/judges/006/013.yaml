source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
  footnotes:
  - marker: a
    text: Or, “Pardon me, my lord.” The Hebrew is a polite form of address.
    reason: lexical_alternative
  - marker: b
    text: Or “his wondrous deeds” or “his miracles.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: “into the hand of Midian,” an idiom meaning into Midian’s power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기드온이 그에게 말했습니다. 「부디, 내 주인이시여, 야훼께서 우리와 함께 계시다면, 왜 이 모든 일이 우리에게 일어났습니까? 또 우리 조상들이 ‘야훼께서 우리를 이집트에서 올라오게 하지 않으셨느냐’ 하고 우리에게 들려준 그분의 모든 놀라운 일은 어디에 있습니까? 그런데 이제 야훼께서는 우리를 버리시고 미디안의 손에 넘기셨습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「부디」는 히브리어 בִּי의 공손한 완곡 표현을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נִפְלְאֹתָיו는 문자적으로는 “그의 놀라운 일들”이며, 문맥상 하나님의 경이로운 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: “미디안의 손”은 미디안의 권세 아래 들어갔다는 히브리어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  english_pob_choice: Please, my lord
  chosen_korean: 부디, 내 주인이시여
  alternatives_korean:
  - 부디, 내 주님
  - 용서하십시오, 선생님
  - 부디, 나의 주인이시여
  lexicon: HALOT
  rationale: בִּי는 공손한 완곡 표현이므로 「부디」로 살리고, אֲדֹנִי는 이 장면의 인간 상대에 대한 존칭으로 보아 「내 주인이시여」로 옮겨 예의와 격식을 함께 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명사 יְהוָה는 POB 원칙에 따라 일반 호칭이 아니라 신명 자체를 보존하는 「야훼」로 옮겼습니다.
- source_word: נִפְלְאֹתָיו
  english_pob_choice: his wonders
  chosen_korean: 그분의 모든 놀라운 일
  alternatives_korean:
  - 그분의 놀라운 일들
  - 그분의 기이한 일들
  - 그분의 기적들
  lexicon: HALOT
  rationale: נִפְלְאוֹת는 하나님의 경이로운 구원 행위를 가리키므로, 지나치게 특정화한 「기적」보다 「놀라운 일」이 어휘 폭을 더 잘 보존합니다.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  english_pob_choice: and given us into the hand of Midian
  chosen_korean: 미디안의 손에 넘기셨습니다
  alternatives_korean:
  - 미디안의 손에 우리를 주셨습니다
  - 미디안의 권세 아래 넘기셨습니다
  - 미디안에게 넘기셨습니다
  lexicon: HALOT
  rationale: 「손에」라는 히브리어 관용구를 유지해 지배·종속의 이미지를 살리고, 한국어에서는 자연스럽게 「넘기셨습니다」로 풀어 의미를 전달했습니다.
theological_decisions:
- issue: Gideon의 아드로닉 표현 אֲדֹנִי의 대상
  chosen_reading: 여기서는 신적 칭호가 아니라 사람에게 드리는 공손한 호칭으로 처리했습니다.
  alternative_readings:
  - 주님(신적 호칭)
  - 선생님과 같은 일반 존칭
  rationale: 대화의 즉각적 맥락에서 기드온은 나타난 존재를 아직 완전히 규정하지 않은 상태이므로, 신학적 결론을 앞당기지 않고 인간 존칭으로 번역하는 것이 본문의 진행을 더 정확히 반영합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
