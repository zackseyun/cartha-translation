translation:
  language: ko
  text: 미디안의 손이 이스라엘을 압도하였습니다. 미디안을 피하여 이스라엘 자손은 산에 있는 굴과 동굴과 요새를 자신들을 위해 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’이라고 말합니다.
    reason: source_note
lexical_decisions:
- source_word: וַתָּעָז יַד מִדְיָן עַל יִשְׂרָאֵל
  english_pob_choice: And the hand of Midian prevailed against Israel
  chosen_korean: 미디안의 손이 이스라엘을 압도하였습니다
  alternatives_korean:
  - 미디안의 손이 이스라엘 위에 강해졌습니다
  - 미디안의 손이 이스라엘을 이겼습니다
  lexicon: HALOT
  rationale: ‘손’은 권세/지배의 관용구이므로 보존했고, מצב에 맞게 단순한 ‘강해졌다’보다 적대적 우세를 드러내는 ‘압도하다’를 택했습니다.
- source_word: מִפְּנֵי מִדְיָן
  english_pob_choice: Because of Midian
  chosen_korean: 미디안을 피하여
  alternatives_korean:
  - 미디안 때문에
  - 미디안을 두려워하여
  lexicon: HALOT
  rationale: 문맥상 미디안의 위협을 피해 은신처를 마련한 것이므로 원인과 회피의 뉘앙스를 함께 살렸습니다.
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  english_pob_choice: the dens that are in the mountains
  chosen_korean: 산에 있는 굴
  alternatives_korean:
  - 산속의 굴
  - 산에 있는 은신처
  lexicon: HALOT
  rationale: 희귀어를 한국어의 자연스러운 지형 표현인 ‘굴’로 옮기되, ‘산에 있는’으로 위치 정보를 보존했습니다.
- source_word: הַמְּעָרוֹת
  english_pob_choice: the caves
  chosen_korean: 동굴
  alternatives_korean:
  - 굴
  - 동굴들
  lexicon: HALOT
  rationale: 앞 항목의 ‘굴’과 완전히 겹치지 않게 하면서도 더 일반적이고 분명한 지형어인 ‘동굴’을 사용했습니다.
- source_word: הַמְּצָדוֹת
  english_pob_choice: the strongholds
  chosen_korean: 요새
  alternatives_korean:
