  source_fidelity: 첫 절의 ‘미디안의 손’은 권세·지배를 뜻하는 히브리어 관용 표현이므로, 한국어에서는 ‘미디안의 세력’으로 옮기는 것이 의미를 정확하면서도 자연스럽게 전달합니다. מִפְּנֵי는 ‘미디안을 피하여’보다 직접적으로 ‘미디안 때문에’가 적절합니다. 희귀어 הַמִּנְהָרוֹת는 정확한 뜻이 논쟁적이므로 단정적인 지형어보다 ‘은신처’로 옮기고 주석으로 불확실성을 밝혀야 합니다.
  naturalness: ‘산에 있는 굴과 동굴’은 현대 한국어에서 사실상 동의어가 나란히 놓여 부자연스럽고, 원문의 서로 다른 명사를 효과적으로 구별하지 못합니다. ‘산에 있는 은신처와 동굴과 요새’가 자연스럽고 항목 간 구별도 유지합니다. ‘자신들을 위하여’는 לָהֶם의 수혜적 의미를 보존합니다.
  terminology: ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל의 형태를 보존하는 적절한 번역입니다. ‘요새’는 הַמְּצָדוֹת에 적합합니다. 희귀어에 대해서는 특정 해석을 본문에서 과도하게 확정하지 않도록 주석을 추가합니다.
