  - 산성
  lexicon: HALOT
  rationale: 방어 가능한 피난처를 가리키므로 현대 한국어에서 가장 직관적인 ‘요새’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 자손의 남성 복수 표현
  chosen_reading: ‘이스라엘 자손’으로 직역성을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 백성’
  rationale: 히브리어가 분명히 ‘이스라엘의 아들들’이라 하므로, 성별 표지를 지우기보다 원문 형식을 보존하는 편이 본문 증언에 충실합니다.
  doctrine_reference: source-form transparency
