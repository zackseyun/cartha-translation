  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
  footnotes:
  - marker: a
    text: Or 'was brought very low' or 'became impoverished.' The Hebrew verb can denote being reduced, weakened, or brought low under oppression.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 이스라엘은 미디안 때문에 매우 약해졌습니다[a]. 그러자 이스라엘 자손[b]은 야훼께[c] 부르짖었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘낮아지다’, ‘약해지다’, 또는 ‘궁핍해지다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 이스라엘 백성을 가리키는 표준적인 언약 공동체 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה는 전통적으로 ‘여호와’ 또는 ‘주’로 옮깁니다.
    reason: alternative_reading
