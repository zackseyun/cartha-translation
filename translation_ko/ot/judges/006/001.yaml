id: JDG.6.1
reference: Judges 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'in the sight of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'into the hand of Midian,' an idiom meaning under Midian's power or control.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손이 야훼[a][b] 보시기에 악한 일을 행하였고, 야훼께서 그들을 미디안의 손에 넘기셔서 칠 년 동안 그들에게서 벗어나지 못하게 하셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 눈에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘손에’는 여기서 Midian의 권세 아래 있게 됨을 뜻하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘이스라엘의 아들들’이라는 집합 표현을 살리되, 한국어에서는 가장 자연스럽고 성경적 용례도 넓은 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 옳지 않은 일
  lexicon: HALOT
  rationale: עשה와 함께 쓰인 관용구로 단순히 ‘악’을 하기보다 행위성을 드러내는 ‘악한 일’이 원문의 도덕적 평가를 더 잘 전달합니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가의 관용구를 한국어에서 자연스럽게 살리기 위해 ‘보시기에’를 택했고, יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
- source_word: בְּיַד מִדְיָן
  english_pob_choice: into the hand of Midian
  chosen_korean: 미디안의 손에 넘기셔서
  alternatives_korean:
  - 미디안의 손 아래로
  - 미디안의 권세 아래에
  lexicon: HALOT
  rationale: ‘손’은 단순 신체 부위가 아니라 권세/지배의 관용구이므로, 한국어에서는 그 함의를 드러내는 ‘손에 넘기셔서’로 옮겨 원문의 종속 의미를 분명히 했습니다.
- source_word: שֶׁבַע שָׁנִים
  english_pob_choice: for seven years
  chosen_korean: 칠 년 동안
  alternatives_korean:
  - 7년 동안
  - 일곱 해 동안
  lexicon: HALOT
  rationale: 지속 기간을 자연스러운 문어체로 표현하면서도 원문의 기간 표시를 그대로 전달하기 위해 ‘칠 년 동안’을 사용했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신명기적 서술에서 언약명 יְהוָה를 직접 사용하므로, 전통적 대체어 ‘주님’보다 고유 신명 ‘야훼’를 살리는 것이 원문과 POB 정책에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘미디안의 손’ 관용구
  chosen_reading: 권세 아래의 종속 상태를 한국어 동사구 ‘손에 넘기셔서’로 표현합니다.
  alternative_readings:
  - 그들의 손에 주셨습니다
  - 그들을 미디안에게 넘기셨습니다
  rationale: 히브리어 관용구의 지배·굴복 의미를 약화시키지 않기 위해, 단순 전달보다 ‘넘기시다’로 종속을 드러내는 표현을 선택했습니다.
  doctrine_reference: '번역 원칙: source-direct idiom preservation'
