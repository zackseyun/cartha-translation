  to: 이스라엘 자손이[a] 야훼 보시기에[b] 악한 일을 행하였고, 야훼께서는 그들을 칠 년 동안 미디안의 손에 넘기셨습니다[c].
  rationale: 원문에 없는 ‘벗어나지 못하게 하셨습니다’를 삭제하여, 야훼께서 이스라엘 자손을 미디안의 지배 아래 넘기신 행위와 그 기간만을 번역했습니다. 또한 각주 표지를 해당 표현에 맞게 재배치하고 각주 안의 고유명사를 한국어 표기로 통일했습니다.
