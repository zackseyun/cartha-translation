    rationale: ‘이스라엘 자손’ 관련 각주 a는 해당 표현 뒤에, ‘야훼 보시기에’ 관련 각주 b는 해당 관용구 뒤에 두는 것이 적절합니다. 한국어 각주에서는 ‘Midian’을 ‘미디안’으로 통일해야 합니다.
