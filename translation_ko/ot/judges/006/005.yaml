  to: 그들은 가축과 함께 올라오곤 했고, 그들의 장막도[a] 메뚜기 떼처럼 수없이 몰려오곤 했습니다. 그들과 그들의 낙타는 셀 수 없이 많았으며, 그들은 그 땅을 황폐하게 하려고 들어오곤 했습니다.
