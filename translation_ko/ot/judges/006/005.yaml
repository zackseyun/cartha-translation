review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the repeated incursions, the livestock, the tents, the innumerable invaders and camels, and the destructive purpose. However, its verbal aspect is inconsistent, and '멸망시키려' overstates שׁחת in this agricultural-raiding context. The revision consistently expresses the customary past action and renders the final purpose as ravaging/laying waste.
  naturalness: The draft’s sequence of mixed present-like forms ('올라오고 ... 오며') followed by the archaic past-polite ending '하였나이다' is not natural modern formal-polite Korean. The revision uses consistent modern 합쇼체 and preserves the vivid, deliberately unusual image of tents arriving, with a clarifying note.
  terminology: '''가축,'' ''장막,'' ''낙타,'' and ''메뚜기 떼'' are appropriate. ''황폐하게 하다'' is a more proportionate contextual rendering of לְשַׁחֲתָהּ than ''멸망시키다.'''
  issues:
  - severity: medium
    issue: Inconsistent tense and register
    rationale: The Hebrew imperfects describe repeated past action in the narrative. The draft’s connective present-like forms combined with '하였나이다' neither convey that iterative sense consistently nor maintain modern 합쇼체.
  - severity: medium
    issue: Overtranslation of the final destructive purpose
    rationale: '''멸망시키려'' can imply total annihilation, whereas שׁחת here describes devastating or ravaging the land. ''황폐하게 하려고'' better fits the source and context.'
  - severity: low
    issue: Unexplained tent metonymy
    rationale: The source explicitly makes 'their tents' the grammatical subject. Retaining that image is faithful, but a note helps readers understand it as the invading encampments.
  revised_text: 그들은 가축과 함께 올라오곤 했고, 그들의 장막도[a] 메뚜기 떼처럼 수없이 몰려오곤 했습니다. 그들과 그들의 낙타는 셀 수 없이 많았으며, 그들은 그 땅을 황폐하게 하려고 들어오곤 했습니다.
  revised_footnotes:
