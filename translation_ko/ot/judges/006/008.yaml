base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
  footnotes:
  - marker: a
    text: Or “to the Israelites” or “to the children of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “from the house of slavery.” The Hebrew is literally “from the house of slaves.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 한 사람, 곧 예언자를 이스라엘 자손에게[a] 보내셨습니다. 그가 그들에게 말했습니다. 「이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. 내가 너희를 이집트에서 데리고 올라왔고, 너희를 종살이의 집에서[b] 데리고 나왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들에게” 또는 “이스라엘의 자녀들에게.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “종들의 집에서”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기는 고유명사로 처리하여 전통적 대체어인 ‘여호와’나 호칭적 ‘주님’이 아니라 ‘야훼’로 옮겼습니다.
- source_word: אִישׁ נָבִיא
  english_pob_choice: a man, a prophet
  chosen_korean: 한 사람, 한 예언자
  alternatives_korean:
  - 한 예언자
  - 예언자 한 사람
  lexicon: HALOT
  rationale: 두 명사를 병렬로 유지해, 단순히 ‘예언자’로 축약하지 않고 파송된 인물이 사람이며 동시에 예언자라는 점을 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 관용적 집단 명칭을 살리면서 한국어에서도 자연스럽고 성경적인 표현인 ‘이스라엘 자손’을 선택했습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 종들의 집
  alternatives_korean:
  - 노예들의 집
  - 종살이의 집
  - 노예제의 집
  lexicon: HALOT
  rationale: 직역적 이미지를 살려 ‘집’과 ‘종들’을 함께 유지했습니다. 이는 관용적 ‘종살이/노예제’보다 원문의 구체성을 더 직접적으로 반영합니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 언약의 이름을 직접 사용하므로, 호칭이 아니라 고유한 신명으로 드러내는 번역이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 연설 서두의 예언자적 선포 형식
  chosen_reading: 「…말씀하십니다」
  alternative_readings:
  - 「…말합니다」
  - 「…이렇게 말씀하셨습니다」
  rationale: 예언자적 메시지 공식을 한국어에서 자연스럽게 살리기 위해 현재형 선포체를 사용했습니다. 이는 인용된 하나님의 직접 말씀이라는 점을 분명히 합니다.
  doctrine_reference: POB prophetic citation style
