  - 그리고 이스라엘이 씨를 뿌리면
  lexicon: HALOT
  rationale: 반복되는 서술 구조를 한국어에서 가장 자연스럽게 살리기 위해 조건문의 반복적 시간 의미를 ‘~할 때마다’로 옮겼습니다.
- source_word: זָרַע
  english_pob_choice: sowed
  chosen_korean: 씨를 뿌릴
  alternatives_korean:
  - 파종할
  - 심을
  lexicon: HALOT
  rationale: זָרַע는 곡식을 ‘씨를 뿌리다’의 의미이므로, 농경 행위를 직접 드러내는 표현을 택했습니다.
- source_word: וְעָלָה ... עָלָיו
  english_pob_choice: would come up against him
  chosen_korean: 올라와 그를 치곤 했습니다
  alternatives_korean:
  - 올라와 그를 대적하곤 했습니다
  - 올라와 그를 공격하곤 했습니다
  lexicon: HALOT
  rationale: עלה의 ‘올라오다’와 hostile advance의 뉘앙스를 함께 살리면서, 한국어 동사 ‘치다’로 군사적 압박을 간결하게 나타냈습니다.
- source_word: וּבְנֵי קֶדֶם
