  to: 이스라엘이 씨를 뿌릴 때마다 미디안과 아말렉과 동쪽 사람들은 이스라엘을 대적하여 올라오곤 했습니다.[a]
  rationale: 원문의 반복적 시간 의미와 ‘올라오다’의 방향성, 그리고 על의 적대적 용법을 보존하도록 ‘이스라엘을 대적하여 올라오곤 했습니다’로 고쳤습니다. 히브리어의 단수 접미사는 한국어 본문에서 부자연스러운 ‘그를’로 재현하지 않고, 각주에서 투명하게 밝혔습니다.
  reviewer_model: gpt-5.6-terra
