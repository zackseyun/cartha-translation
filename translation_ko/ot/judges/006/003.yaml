  - 동쪽의 백성들
  lexicon: HALOT
  rationale: 직역인 ‘동방의 아들들’은 한국어에서 부자연스러워서, 집단명으로서의 지역적 의미를 살린 ‘동쪽 사람들’을 택했습니다.
theological_decisions:
