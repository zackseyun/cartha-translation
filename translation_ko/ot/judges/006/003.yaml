base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
  footnotes:
  - marker: a
    text: Hebrew 'against him,' with singular suffix, referring collectively to Israel; some translations smooth this to 'against them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 씨를 뿌릴 때마다 미디안과 아말렉과 동쪽 사람들은 이스라엘을 대적하여 올라오곤 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 집합적으로 이스라엘을 가리키는 3인칭 남성 단수 접미사를 사용하여, 직역하면 ‘그를 대적하여’입니다.
    reason: source_note
lexical_decisions:
- source_word: וְהָיָה אִם
  english_pob_choice: And whenever
  chosen_korean: 씨를 뿌릴 때마다
  alternatives_korean:
  - 그리고 매번
  - 그리고 이스라엘이 씨를 뿌리면
  lexicon: HALOT
  rationale: 반복되는 서술 구조를 한국어에서 가장 자연스럽게 살리기 위해 조건문의 반복적 시간 의미를 ‘~할 때마다’로 옮겼습니다.
- source_word: זָרַע
  english_pob_choice: sowed
  chosen_korean: 씨를 뿌릴
  alternatives_korean:
  - 파종할
  - 심을
  lexicon: HALOT
  rationale: זָרַע는 곡식을 ‘씨를 뿌리다’의 의미이므로, 농경 행위를 직접 드러내는 표현을 택했습니다.
- source_word: וְעָלָה ... עָלָיו
  english_pob_choice: would come up against him
  chosen_korean: 올라와 그를 치곤 했습니다
  alternatives_korean:
  - 올라와 그를 대적하곤 했습니다
  - 올라와 그를 공격하곤 했습니다
  lexicon: HALOT
  rationale: עלה의 ‘올라오다’와 hostile advance의 뉘앙스를 함께 살리면서, 한국어 동사 ‘치다’로 군사적 압박을 간결하게 나타냈습니다.
- source_word: וּבְנֵי קֶדֶם
  english_pob_choice: the people of the East
  chosen_korean: 동쪽 사람들
  alternatives_korean:
  - 동방 사람들
  - 동쪽의 백성들
  lexicon: HALOT
  rationale: 직역인 ‘동방의 아들들’은 한국어에서 부자연스러워서, 집단명으로서의 지역적 의미를 살린 ‘동쪽 사람들’을 택했습니다.
theological_decisions:
- issue: 히브리어 3인칭 단수 접미사의 집합적 지시
  chosen_reading: 그를
  alternative_readings:
  - 그들을
  rationale: 원문은 ישראל를 집합적으로 가리키는 단수 접미사를 유지하므로, 평이화하여 복수로 풀기보다 원문의 형태를 살려 ‘그를’로 두었습니다.
  doctrine_reference: source-form fidelity / collective singular
