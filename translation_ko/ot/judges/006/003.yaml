review_pass:
  verdict: revise
  source_fidelity: 반복적 상황을 나타내는 ‘~할 때마다’와 농경 의미의 ‘씨를 뿌리다’는 원문에 충실합니다. 다만 ‘그를 치곤 했습니다’는 히브리어의 עלה ... על(‘~을 대적하여 올라오다’)가 나타내는 적대적 진군을 실제 타격 행위로 다소 좁히므로, 이를 직접 반영하는 표현으로 고치는 것이 안전합니다.
  naturalness: ‘이스라엘을 대적하여 올라오곤 했습니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 반복되는 침공의 상황을 분명히 전달합니다. ‘동쪽 사람들’도 이해하기 쉬운 현대어입니다.
  terminology: 미디안, 아말렉, 이스라엘은 적절합니다. ‘동쪽 사람들’은 בְנֵי־קֶדֶם의 집단적·지역적 지시를 자연스럽게 옮깁니다. 각주에서는 히브리어 단수 접미사를 설명하되, 한국어에서 어색한 단수 대명사를 본문에 강제하지 않습니다.
  issues:
  - severity: medium
    issue: ‘올라와 그를 치곤 했습니다’가 원문의 적대적 접근을 실제 공격 행위로 좁힙니다.
    rationale: וְעָלוּ עָלָיו는 문자적으로 ‘그를 대적하여 올라오다’이며, 이 절 자체는 공격의 결과보다 적대적으로 올라오는 움직임을 서술합니다. ‘대적하여 올라오다’가 방향성과 적대성을 모두 보존합니다.
  revised_text: 이스라엘이 씨를 뿌릴 때마다 미디안과 아말렉과 동쪽 사람들은 이스라엘을 대적하여 올라오곤 했습니다.[a]
