id: JDG.6.14
reference: Judges 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
  footnotes:
  - marker: a
    text: Or “with this strength of yours.” The Hebrew phrase may be understood instrumentally or locatively, with the demonstrative adding emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the hand of Midian,” an idiom for deliverance from Midian’s power or control.
    reason: cultural_note
translation:
  language: ko
  text: 그때 야훼께서 그에게로 돌아서서 말씀하셨습니다[a]. “이 너의 힘으로 가서 미디안의 손에서 이스라엘을 구하라[b]. 내가 너를 보내지 않았느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 너의 힘을 가지고.” 히브리어 표현은 도구적 의미나 장소적 의미로도 이해될 수 있으며, 지시대명사는 강조를 더합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “미디안의 손에서”라고 되어 있으며, 이는 미디안의 권세나 통제에서의 구출을 뜻하는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: English POB가 하나님의 고유명을 Yahweh로 유지한 것에 맞추어, 한국어도 전통적 대체어보다 학술적 음역인 야훼를 사용해 언약적 고유성을 보존했습니다.
- source_word: וַיִּפֶן אֵלָיו
  english_pob_choice: turned to him
  chosen_korean: 그에게로 돌아서서
  alternatives_korean:
  - 그를 향해
  - 그에게로 돌이켜
  lexicon: HALOT
  rationale: פנה는 단순 시선보다 방향 전환을 나타내므로, ‘돌아서서’로 행동의 전환을 살리고 אֵלָיו의 방향성을 ‘그에게로’로 반영했습니다.
- source_word: בְּכֹחֲךָ זֶה
  english_pob_choice: in this strength of yours
  chosen_korean: 이 너의 힘으로
  alternatives_korean:
  - 너의 이 힘으로
  - 이 힘을 가지고
  lexicon: HALOT
  rationale: ב의 도구적/국면적 뉘앙스와 זֶה의 지시 강조를 함께 살리기 위해 ‘이 너의 힘으로’로 옮겨, 단순한 소유보다 지금 주어진 힘의 강조를 드러냈습니다.
- source_word: מִכַּף מִדְיָן
  english_pob_choice: from the hand of Midian
  chosen_korean: 미디안의 손에서
  alternatives_korean:
  - 미디안의 권세에서
  - 미디안의 손아귀에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하여 ‘손’ 이미지를 유지하되, 한국어 조사로 ‘에서’를 붙여 압박과 지배의 상태에서의 구출이라는 의미를 드러냈습니다.
theological_decisions:
- issue: 명령과 예고가 결합된 파송 문장
  chosen_reading: ‘가서… 구하라’로 명령형 흐름을 유지했습니다.
  alternative_readings:
  - ‘가라… 구원할 것이다’처럼 미래적 선언으로 완화
  - ‘가서… 구원하리라’처럼 약속문으로 전환
  rationale: 원문은 파송의 권위를 지닌 연속 명령으로 들리므로, 한국어도 지시-사명 구조를 유지해 기드온의 능력보다 야훼의 파송 권위를 전면에 두었습니다.
  doctrine_reference: '본문 서사 신학: 소명과 파송의 권위'
