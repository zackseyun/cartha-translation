    rationale: 번역의 서술문은 ‘말씀하셨습니다’인데 직접 인용은 ‘구하라’, ‘않았느냐’로 평서체입니다. 요청된 현대 formal-polite 합쇼체에 맞추어 ‘구하십시오’, ‘않았습니까’로 통일합니다.
