base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
  footnotes:
  - marker: a
    text: Or 'under the oak.' The Hebrew word likely refers to a terebinth tree, though 'oak' is a traditional rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'brought it near' / 'set it before him.' The Hebrew verb means 'brought near' or 'presented.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 기드온은 들어가 어린 염소 한 마리와 고운 가루 한 에바로 무교병을 만들었습니다. 그는 고기는 광주리에, 국물은 솥에 담아, 테레빈트나무[a] 아래에 있는 그에게 가져가 그 앞에 내어놓았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 הָאֵלָה는 전통적으로 ‘참나무’로도 옮겨 왔지만, 대체로 테레빈트나무를 가리키는 말로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘가까이 가져오다’ 또는 ‘제시하다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא / וַיַּגַּשׁ
  english_pob_choice: went in / presented them
  chosen_korean: 들어가서 / 가져다가 바쳤습니다
  alternatives_korean:
  - 가서 / 내어놓았습니다
  - 들어가서 / 가져왔습니다
  lexicon: HALOT
  rationale: 기드온이 밖의 방문객에게서 잠시 물러나 준비한 뒤 다시 가져오는 흐름을 자연스럽게 살리되, 마지막 동작은 단순 이동보다 상대에게 ‘가져다가 바치다’로 옮겨 제시의 뉘앙스를 담았습니다.
- source_word: גְּדִי עִזִּים
  english_pob_choice: a young goat
  chosen_korean: 어린 염소 한 마리
  alternatives_korean:
  - 젖먹이 염소 한 마리
  - 염소 새끼 한 마리
  lexicon: HALOT
  rationale: צעיר함을 드러내는 구성으로, 현대 한국어에서 가장 자연스럽고 분명한 ‘어린 염소’로 옮겼습니다.
- source_word: אֵיפַת קֶמַח מַצּוֹת
  english_pob_choice: an ephah of flour / unleavened bread
  chosen_korean: 고운 가루 한 에바로 무교병을 만들었습니다
  alternatives_korean:
  - 가루 한 에바로 무교병을 만들었습니다
  - 고운 가루 한 에바와 무교병을 준비했습니다
  lexicon: HALOT
  rationale: ‘에바’는 구체적 계량을 보존하고, 무교병은 빵의 종류를 직접 지시하는 본문에 맞게 유지했습니다. 동사의 문맥상 ‘만들었습니다’가 음식 준비의 자연스러운 한국어입니다.
- source_word: הַבָּשָׂר / הַמָּרַק / סַּל / פָּרוּר
  english_pob_choice: the meat / the broth / basket / pot
  chosen_korean: 고기를 광주리에 담고 국물을 솥에 담아
  alternatives_korean:
  - 고기를 바구니에 담고 국을 솥에 담아
  - 고기를 광주리에 넣고 국물을 냄비에 담아
  lexicon: HALOT
  rationale: 음식 문맥에서 ‘고기’, ‘국물’이 가장 직접적이며, ‘광주리’는 운반용 바구니의 현실감을 살립니다. פָּרוּר는 조리용 그릇을 가리키므로 ‘솥’이 가장 적절합니다.
- source_word: תַּחַת הָאֵלָה
  english_pob_choice: under the terebinth
  chosen_korean: 상수리나무 아래
  alternatives_korean:
  - 테레빈트나무 아래
  - 참나무 아래
  lexicon: HALOT
  rationale: POB의 원문 주석이 지적하듯 이 표지는 전통적 ‘oak’보다 ‘terebinth’에 가깝지만, 한국어에서는 독자가 바로 이해할 수 있는 자연명칭을 택해 본문 가독성을 확보했습니다.
theological_decisions:
- issue: 마지막 동작의 성격—환대/제시인지 제사인지
  chosen_reading: 이 절 자체는 음식의 준비와 ‘바침’을 말하며, 명시적 제사 언어로 확정하지 않았습니다.
  alternative_readings:
  - 제사로 드렸습니다
  - 제물로 바쳤습니다
  rationale: 히브리어 동사들은 준비하고 가져와 ‘가까이 두는/제시하는’ 흐름을 말하므로, 다음 절에서 전개될 수 있는 제사적 함의를 미리 단정하지 않고 본문의 긴장을 그대로 두었습니다.
  doctrine_reference: 서사 본문은 명시된 표현을 우선하며, 뒤 절의 전개를 앞서 확정하지 않습니다.
