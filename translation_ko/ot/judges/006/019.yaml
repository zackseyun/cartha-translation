revisions:
- from: 그러자 기드온이 들어가서 어린 염소 한 마리와 고운 가루 한 에바로 무교병을 만들었습니다. 그는 고기를 광주리에 담고 국물을 솥에 담아 그에게로, 곧 상수리나무 아래로 가져다가 바쳤습니다.[a][b]
  to: 그러자 기드온은 들어가 어린 염소 한 마리와 고운 가루 한 에바로 무교병을 만들었습니다. 그는 고기는 광주리에, 국물은 솥에 담아, 테레빈트나무[a] 아래에 있는 그에게 가져가 그 앞에 내어놓았습니다.[b]
  rationale: 식물 명칭을 원문에 더 가까운 ‘테레빈트나무’로 바로잡고, 장소구가 수식하는 관계를 자연스러운 한국어 문장 구조로 명확히 했습니다. 또한 마지막 동사를 제사로 단정하지 않는 중립적 제시 표현으로 고쳐 원문의 서사적 긴장을 보존했습니다. 각 주석 표지는 해당 어휘 또는 동작 표현 바로 뒤에 배치했습니다.
