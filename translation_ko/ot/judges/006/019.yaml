    rationale: אֵלָה는 일반적으로 테레빈트나무를 가리키며, 전통적 ‘참나무’ 번역에는 논의의 여지가 있습니다. 상수리나무라는 특정 한국 수종으로 단정하면 원문의 식물 명칭을 부정확하게 만듭니다.
