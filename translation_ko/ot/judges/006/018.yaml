  text: אַל נָ֨א תָמֻ֤שׁ מִ/זֶּה֙ עַד בֹּאִ֣/י אֵלֶ֔י/ךָ וְ/הֹֽצֵאתִי֙ אֶת מִנְחָתִ֔/י וְ/הִנַּחְתִּ֖י לְ/פָנֶ֑י/ךָ וַ/יֹּאמַ֕ר אָנֹכִ֥י אֵשֵׁ֖ב עַ֥ד שׁוּבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
  footnotes:
  - marker: a
    text: Or "my gift" or "my tribute"; the Hebrew term can refer broadly to a presented gift and in some contexts to an offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 기드온이 말했습니다. 「부디 여기서 떠나지 말아 주십시오. 제가 당신께 가서 제 예물을 가져와 당신 앞에 놓을 때까지요.」 그러자 그가 말했습니다. 「당신이 돌아올 때까지 내가 머물겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예물’로 번역한 히브리어 מִנְחָה는 넓게는 드리는 예물을 뜻하며, 문맥에 따라 ‘선물’이나 ‘공물’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא תָמֻשׁ מִזֶּה
  english_pob_choice: Please do not depart from here
  chosen_korean: “부디 여기서 떠나지 마시고”
  alternatives_korean:
  - 여기서 물러나지 마시고
  - 여기서 가시지 마시고
  - 이곳을 떠나지 마시고
  lexicon: HALOT
  rationale: תָמֻשׁ는 이 문맥에서 ‘떠나다/물러나다’의 뜻이며, 나아가신 위치를 유지해 달라는 정중한 요청이므로 합쇼체의 간명한 표현으로 옮겼습니다.
- source_word: מִנְחָתִי
  english_pob_choice: my offering
  chosen_korean: “제 예물”
  alternatives_korean:
  - 제 헌물
  - 제 제물
  - 제 드리는 예물
  lexicon: HALOT
  rationale: מִנְחָה는 ‘예물/헌물/공물/제물’ 범위를 가지며, 여기서는 곡식제의로 좁히기보다 POB의 주석처럼 넓은 ‘예물’로 두는 편이 원문의 유연성을 보존합니다.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  english_pob_choice: and set it before you
  chosen_korean: “당신 앞에 놓을 때까지”
  alternatives_korean:
  - 당신 앞에 두겠습니다
  - 당신 앞에 놓겠습니다
  - 당신 앞에 바치겠습니다
  lexicon: HALOT
  rationale: ‘앞에 놓다/두다’는 히브리어 관용구를 자연스럽게 살리며, 단순한 배치 이상의 공적 제시 뉘앙스를 유지합니다.
- source_word: אָנֹכִי אֵשֵׁב עַד שׁוּבֶךָ
  english_pob_choice: I will stay until you return
  chosen_korean: “내가 당신이 돌아올 때까지 기다리겠습니다”
  alternatives_korean:
  - 내가 당신이 돌아올 때까지 있겠습니다
  - 내가 당신이 돌아올 때까지 머물겠습니다
  - 당신이 돌아올 때까지 앉아 있겠습니다
  lexicon: HALOT
  rationale: ישב는 문자적으로 ‘앉다’이지만 여기서는 ‘머물다/기다리다’의 뜻이므로, 행동의 의미를 분명히 하는 ‘기다리겠습니다’를 택했습니다.
theological_decisions:
- issue: מִנְחָה의 제의적 뉘앙스 보존
  chosen_reading: 제물을 단순한 선물이 아니라 ‘예물’로 옮기되, 제의적/헌납적 뉘앙스를 열어 둡니다.
  alternative_readings:
  - 선물
  - 공물
  - 제물
  rationale: 문맥상 손님 접대용 음식 준비를 가리키지만, 서술은 이어지는 신적 수용 장면을 향하므로 의미를 너무 일상화하지 않고 넓은 제의적 어휘를 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
