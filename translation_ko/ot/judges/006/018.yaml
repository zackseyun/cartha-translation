revisions:
- from: 「부디 여기서 떠나지 마시고, 제가 당신께 가서 제 예물을 가져와 당신 앞에 놓을 때까지 기다려 주십시오」라고 하니, 그가 말했습니다. 「내가 당신이 돌아올 때까지 기다리겠습니다」.[a]
  to: 기드온이 말했습니다. 「부디 여기서 떠나지 말아 주십시오. 제가 당신께 가서 제 예물을 가져와 당신 앞에 놓을 때까지요.」 그러자 그가 말했습니다. 「당신이 돌아올 때까지 내가 머물겠습니다.」[a]
  rationale: The revision preserves the broad sense of מִנְחָה, more directly represents the prohibition not to depart, and renders אָנֹכִי אֵשֵׁב as ‘머물겠습니다,’ retaining the source verb's contextual sense. The footnote remains anchored to ‘예물’ and preserves the lexical alternatives without imposing a specific cultic classification.
  reviewer_model: gpt-5.6-terra
