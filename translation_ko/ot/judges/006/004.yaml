  text: וַ/יַּחֲנ֣וּ עֲלֵי/הֶ֗ם וַ/יַּשְׁחִ֨יתוּ֙ אֶת יְב֣וּל הָ/אָ֔רֶץ עַד בּוֹאֲ/ךָ֖ עַזָּ֑ה וְ/לֹֽא יַשְׁאִ֤ירוּ מִֽחְיָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/שֶׂ֥ה וָ/שׁ֖וֹר וַ/חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
  footnotes:
  - marker: a
    text: Hebrew literally, 'as far as your approach to Gaza,' an idiom meaning the extent reached toward Gaza.
    reason: lexical_alternative
  - marker: b
    text: Or 'sustenance' or 'livelihood' for 'means of survival.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들을 향해 진을 치고 땅의 소산을 가자까지[a] 파괴하여, 이스라엘에는 먹고 살 것[b]은 물론 양이나 소나 나귀도 남기지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신이 가자에 이르기까지’라는 관용구로, 도달 범위를 나타냅니다.
    reason: source_note
  - marker: b
    text: 또는 ‘생계 수단’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  english_pob_choice: They would encamp against them
  chosen_korean: 그들을 향해 진을 치고
  alternatives_korean:
  - 그들에 맞서 진을 치고
  - 그들 앞에 진을 치고
  lexicon: HALOT
  rationale: חנה는 ‘진을 치다’이며, עַל + 대명사 목적어는 적대적 방향을 나타내므로 ‘그들을 향해’로 옮겼습니다.
- source_word: יְבוּל הָאָרֶץ
  english_pob_choice: the produce of the land
  chosen_korean: 땅의 소산
  alternatives_korean:
  - 땅의 생산물
  - 땅의 수확물
  lexicon: HALOT
  rationale: יְבוּל은 농경적 ‘산물/소산’의 뜻이어서, ‘땅의 소산’이 자연스럽고 본문 범위를 과도하게 좁히지 않습니다.
- source_word: עַד בּוֹאֲךָ עַזָּה
  english_pob_choice: as far as Gaza
  chosen_korean: 가자까지[a]
  alternatives_korean:
  - 가자에 이르기까지
  - 가자 앞까지
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘네가 가자에 이르기까지’라는 관용구이지만, 한국어에서는 장소 한계를 자연스럽게 드러내는 ‘가자까지’로 옮기되 각주로 관용구 성격을 보완했습니다.
- source_word: מִחְיָה
  english_pob_choice: sustenance
  chosen_korean: 먹고 살 것[b]
  alternatives_korean:
  - 생계 수단
  - 유지할 양식
  - 양식
  lexicon: HALOT
  rationale: מִחְיָה는 단순한 음식보다 ‘삶을 지탱하는 생계/유지 수단’의 폭이 있어, 서술의 경제적·생존적 의미를 드러내는 ‘먹고 살 것’을 택했습니다.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  english_pob_choice: nor sheep, ox, or donkey
  chosen_korean: 양도, 소도, 나귀도
  alternatives_korean:
  - 양이나 소나 나귀도
  - 양, 소, 또는 나귀도
  lexicon: HALOT
  rationale: 세 명사 모두 단수형이지만 집합적으로 쓰였으므로, 한국어에서는 열거를 살리면서도 부자연스러운 번역을 피하기 위해 ‘도’ 반복 구조로 옮겼습니다.
