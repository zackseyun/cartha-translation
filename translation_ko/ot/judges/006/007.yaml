translation:
  language: ko
  text: 이스라엘 자손이 미디안 때문에 야훼께 부르짖었을 때, 그런 일이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘미디안에 대하여.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: And it happened that / when
  chosen_korean: 그런 일이 있었습니다. …했을 때
  alternatives_korean:
  - 그때 …이 있었습니다
  - 그리고 …했을 때
  lexicon: HALOT
  rationale: 히브리어 서술 도입어 וַיְהִי는 단순 시간 부사가 아니라 새 사건 전개의 표지이므로, 한국어에서는 자연스러운 서술 흐름을 살려 ‘그런 일이 있었습니다’로 옮기고 뒤의 시간절로 연결했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: POB의 영어는 직역성보다 형태를 보존한 표현을 따르므로, 히브리어 관용구를 그대로 반영하는 ‘이스라엘 자손’을 택했습니다.
- source_word: זָעֲקוּ
  english_pob_choice: cried out
  chosen_korean: 부르짖었을
  alternatives_korean:
  - 외쳐 도움을 청했을
  - 소리쳤을
  lexicon: HALOT
  rationale: זעק은 단순한 발화가 아니라 위기 속 도움 요청의 외침을 뜻하므로, 한국어에서도 구원 요청의 뉘앙스를 살리는 ‘부르짖다’가 가장 적절합니다.
- source_word: אֶל יְהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 이 절의 본문은 하나님의 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지하고 여격 조사로 기도·호소의 방향을 드러냈습니다.
- source_word: עַל אֹדוֹת מִדְיָן
  english_pob_choice: because of Midian
  chosen_korean: 미디안 때문에
  alternatives_korean:
  - 미디안으로 인해
  - 미디안에 관하여
  lexicon: HALOT
  rationale: עַל אֹדוֹת는 여기서 원인을 나타내므로, 한국어에서는 가장 자연스럽고 직접적인 원인 표현인 ‘때문에’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 전통 교회어인 ‘여호와’나 일반 호칭 ‘주님’ 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB contested terms: YHWH'
- issue: 서술 도입과 시간절의 결합
  chosen_reading: ‘그런 일이 있었습니다. …했을 때’
  alternative_readings:
  - ‘그때 …했습니다’
  - ‘…했을 때 그런 일이 있었습니다’
  rationale: 히브리어의 וַיְהִי כִּי는 사건 도입과 시간 종속을 함께 표시하므로, 한국어에서도 두 기능을 모두 드러내어 문장의 전개감을 보존했습니다.
  doctrine_reference: Hebrew narrative discourse convention
