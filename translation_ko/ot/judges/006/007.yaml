lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: And it happened that / when
  chosen_korean: 그런 일이 있었습니다. …했을 때
  alternatives_korean:
  - 그때 …이 있었습니다
  - 그리고 …했을 때
  lexicon: HALOT
  rationale: 히브리어 서술 도입어 וַיְהִי는 단순 시간 부사가 아니라 새 사건 전개의 표지이므로, 한국어에서는 자연스러운 서술 흐름을 살려 ‘그런 일이 있었습니다’로 옮기고 뒤의 시간절로 연결했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: POB의 영어는 직역성보다 형태를 보존한 표현을 따르므로, 히브리어 관용구를 그대로 반영하는 ‘이스라엘 자손’을 택했습니다.
- source_word: זָעֲקוּ
  english_pob_choice: cried out
  chosen_korean: 부르짖었을
  alternatives_korean:
  - 외쳐 도움을 청했을
  - 소리쳤을
