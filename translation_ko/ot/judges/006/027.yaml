  source_fidelity: 수정이 필요합니다. 초안의 ‘그것을 낮에 행하는 것을 두려워하므로’는 기드온이 낮에 하는 행위 자체를 두려워한 것처럼 읽히지만, 히브리어는 아버지의 집안과 성읍의 남자들을 두려워했기 때문에 낮에 하지 못했다는 뜻입니다. 또한 מֵעֲבָדָיו의 부분적 의미를 ‘종들 가운데서’로 반영하는 것이 적절합니다.
  naturalness: ‘자기에게’는 지시 대상이 잠시 모호할 수 있고, ‘행하였더라’는 현대 표준어 합쇼체 문체보다 다소 고풍스럽습니다. ‘그에게’, ‘행하였습니다’를 사용하고 원인의 범위를 분명히 하는 문장이 자연스럽습니다.
  terminology: ‘여호와’는 제시된 한국어 성경 전통의 신명 표기와 일관됩니다. בֵּית אָבִיו는 물리적 집보다 사회적 단위이므로 ‘아버지의 집안’으로, אַנְשֵׁי הָעִיר는 남성 복수를 보존하여 ‘성읍의 남자들’로 옮겼습니다.
