id: JDG.6.39
reference: Judges 6:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
  footnotes:
  - marker: a
    text: Or, 'Do not be angry with me.' The Hebrew idiom is literally, 'Do not let your anger burn against me.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Please let me try just this once with the fleece.'
    reason: lexical_alternative
  - marker: c
    text: '''Ground'' could also be rendered ''land'' or ''earth''; here it refers to the area around the fleece in contrast with the fleece itself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기드온이 하나님께 말씀드렸습니다. “제게 화를 내지 마십시오.[a] 제가 이번 한 번만 더 말씀드리게 해 주십시오. 부디 제가 양털로 이번 한 번만 시험하게 해 주십시오.[b] 양털만 마르게 해 주시고, 온 땅에는 이슬이 있게 해 주십시오.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 분노가 제게 타오르지 않게 하십시오.” 히브리어 관용구는 직역하면 “당신의 코가 제게 타오르지 않게 하십시오”입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양털로’는 이 시험에 사용되는 수단 또는 매개를 가리키는 표현입니다.
    reason: source_note
  - marker: c
    text: 여기서 ‘땅’은 양털과 대비되는 주변 지면을 가리키며, ‘땅바닥’ 또는 ‘지면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  english_pob_choice: Do not let your anger burn against me
  chosen_korean: 제게 화를 내지 마십시오
  alternatives_korean:
  - 진노하지 마십시오
  - 제게 분노가 타오르지 않게 해 주십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘노가 타오르다’ 이미지는 한국어에서 자연스럽지 않아, 의미를 직접 드러내는 공손한 청원형으로 옮기되, 과도하게 완화하지는 않았습니다.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  english_pob_choice: and let me speak just this once
  chosen_korean: 제가 이번 한 번만 더 말씀드리게 해 주십시오
  alternatives_korean:
  - 제가 이 한 번만 말씀드리게 해 주십시오
  - 제가 이번 한 번만 말하게 해 주십시오
  lexicon: HALOT
  rationale: cohortative의 청유·요청 뉘앙스를 살려 ‘말하게 해 주십시오’로 옮기고, אַךְ הַפָּעַם의 제한성을 ‘이번 한 번만 더’로 반영했습니다.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  english_pob_choice: Please let me test just this once with the fleece
  chosen_korean: 제발 제가 이번 한 번만 양털로 시험하게 해 주십시오
  alternatives_korean:
  - 제발 제가 이번 한 번만 양털로 시험해 보게 해 주십시오
  - 제발 제가 이번 한 번만 양털을 시험해 보게 해 주십시오
  lexicon: HALOT
  rationale: נָסָה는 여기서 ‘시험하다/검증하다’의 뜻이므로 ‘시험하게 해 주십시오’로 옮겼습니다. ‘양털로’는 수단·매개를 자연스럽게 드러냅니다.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  english_pob_choice: let there be dryness on the fleece alone
  chosen_korean: 양털만 마르게 해 주십시오
  alternatives_korean:
  - 양털만 마른 상태가 되게 해 주십시오
  - 양털에만 건조함이 있게 해 주십시오
  lexicon: HALOT
  rationale: חֹרֶב의 핵심은 ‘건조함/마름’이므로, 간결하고 한국어다운 표현으로 압축하되 ‘만’으로 לבדהּ의 배타성을 살렸습니다.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  english_pob_choice: and on all the ground let there be dew
  chosen_korean: 온 땅에는 이슬이 있게 해 주십시오
  alternatives_korean:
  - 모든 땅에는 이슬이 있게 해 주십시오
  - 온 지면에는 이슬이 있게 해 주십시오
  lexicon: HALOT
  rationale: הָאָרֶץ는 문맥상 전 세계가 아니라 양털과 대비되는 주변 지면이어서, POB의 ‘ground’에 맞춰 ‘온 땅’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 기드온의 요청을 신학적으로 어떻게 톤 조절할지
  chosen_reading: 하나님께 드리는 조심스러운 재청으로 유지하고, 승인이나 비난을 번역문에 덧붙이지 않았습니다.
  alternative_readings:
  - 기드온의 불손한 시험을 더 강하게 드러내는 번역
  - 겸손한 믿음의 청원을 더 부드럽게 만드는 번역
  rationale: 본문은 ‘노하지 마십시오’와 ‘한 번만 더 시험하게 해 주십시오’를 함께 제시해 긴장을 유지합니다. 번역도 그 긴장을 보존해야 하며, 해석을 미리 확정하지 않아야 합니다.
  doctrine_reference: 본문의 신학적 긴장 보존
- issue: 하나님께 직접 말하는 요청문의 높임말 처리
  chosen_reading: 서술문은 합쇼체로, 하나님께 드리는 직접 화법은 존대 요청형으로 처리했습니다.
  alternative_readings:
  - 전 구절을 중립적 서술체로 통일
  - 직접 화법에서도 비격식체 사용
  rationale: 한국어 성경의 문체와 예배적 맥락을 고려하되, 본문이 요청하는 공손함을 살리기 위해 ‘제발 … 해 주십시오’와 ‘말씀드리게 해 주십시오’를 사용했습니다.
  doctrine_reference: 한국어 성서 문체와 경어 처리
