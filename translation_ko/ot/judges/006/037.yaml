  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
  footnotes:
  - marker: a
    text: Or 'all the land' or 'all the earth'; the Hebrew word can refer to the ground locally or to the land more broadly. Here it likely means the surrounding ground in the setting of the sign.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제가 타작마당에 양털 한 뭉치를 놓아두겠습니다. 만일 양털에만 이슬이 있고 온 땅[a]이 말라 있으면, 말씀하신 대로 제 손으로 이스라엘을 구원하실 것을 제가 알겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הָאָרֶץ는 여기서 주변의 땅이나 지면을 가리킬 수도 있고, 더 넓게는 온 땅을 가리킬 수도 있습니다. 이 표징의 장면에서는 양털과 대비되는 주변 지면을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 이목을 끄는 지시 표현을 현대 한국어로 자연스럽게 옮기되, 단순 생략하지 않고 화자의 청유적 주의를 살렸습니다.
- source_word: גִּזַּת הַצֶּמֶר
  english_pob_choice: a fleece of wool
  chosen_korean: 양털 한 뭉치
  alternatives_korean:
  - 양털 깎은 한 깃
  - 털가죽 한 뭉치
  lexicon: HALOT
  rationale: 히브리어는 양털 양털 다발/양털 덩이를 가리키므로, 한국어에서는 더 자연스럽고 그림이 분명한 ‘양털 한 뭉치’로 옮겼습니다.
- source_word: בַּגֹּרֶן
  english_pob_choice: on the threshing floor
  chosen_korean: 타작마당에
  alternatives_korean:
  - 타작마당 위에
  - 타작판에
  lexicon: HALOT
  rationale: גֹּרֶן의 통상적 의미를 살려 장소 표지로 자연스럽게 처리했습니다.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  english_pob_choice: and dryness on all the ground
  chosen_korean: 온 땅은 마른다면
  alternatives_korean:
  - 온 땅은 건조하다면
  - 주변 땅은 메마르고
  lexicon: HALOT
  rationale: 여기서 חֹרֶב은 ‘마름/건조함’이므로 형용사적으로 옮겨 조건절의 대조를 분명히 했습니다. הָאָרֶץ는 문맥상 주변의 땅/지면을 가리키므로 ‘온 땅’으로 두되 너무 우주적 의미로 확대하지 않았습니다.
- source_word: בְּיָדִי
  english_pob_choice: by my hand
  chosen_korean: 제 손으로
  alternatives_korean:
  - 제 손을 통해
  - 제 손으로 말미암아
  lexicon: HALOT
  rationale: 히브리어 관용구의 행위 주체성을 살리면서 한국어에서 가장 직접적이고 읽기 쉬운 표현으로 옮겼습니다.
theological_decisions:
- issue: 기드온의 표징 요청에서 הָאָרֶץ의 범위
  chosen_reading: 주변의 지면/땅을 가리키는 낮은 범위로 이해하되 번역은 ‘온 땅’으로 유지했습니다.
  alternative_readings:
  - 전 땅
  - 이스라엘 땅 전체
  rationale: 이 장면은 양털과 타작마당의 물리적 대비를 묻는 표징이므로, 본문 의미는 지역적 지면을 향합니다. 다만 한국어 본문에서는 대조를 또렷하게 하기 위해 ‘온 땅’으로 옮기고, 문맥상 과도한 확대 해석은 피했습니다.
  doctrine_reference: 문맥적 의미론과 서사적 표지 요청
