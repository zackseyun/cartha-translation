base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
  footnotes:
  - marker: a
    text: Or “as if one man” / “like a single man.” The Hebrew idiom emphasizes unified or decisive action against Midian.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그에게 말씀하셨습니다. “내가 반드시 너와 함께 있을 것이니, 너는 미디안을 한 사람처럼 칠 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘마치 한 사람인 것처럼’ 또는 ‘한 사람을 대하듯이’로 옮길 수 있습니다. 미디안 전체를 한 사람처럼 칠 것이라는 비유적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה를 직역하지 않고 음역으로 살려, 본문이 가진 언약적 하나님의 이름을 보존했습니다.
- source_word: כִּי אֶהְיֶה עִמָּךְ
  english_pob_choice: Surely I will be with you
  chosen_korean: 내가 반드시 너와 함께 있을 것이니
  alternatives_korean:
  - 내가 너와 함께 있을 것이니
  - 확실히 내가 너와 함께 있을 것이니
  lexicon: HALOT
  rationale: כִּי의 보증·강조 기능을 한국어의 ‘반드시’로 옮겨, 약속의 확정성을 분명히 했습니다.
- source_word: וְהִכִּיתָ אֶת מִדְיָן
  english_pob_choice: and you will strike Midian
  chosen_korean: 네가 미디안을 칠 것이다
  alternatives_korean:
  - 네가 미디안을 치게 될 것이다
  - 네가 미디안을 무찌를 것이다
  lexicon: HALOT
  rationale: נכה의 기본 의미를 살려 ‘치다’로 옮기되, 영어의 ‘defeat’처럼 해석을 더하지 않았습니다.
- source_word: כְּאִישׁ אֶחָד
  english_pob_choice: as one man
  chosen_korean: 한 사람처럼
  alternatives_korean:
  - 한 사람으로
  - 한 사람같이
  lexicon: HALOT
  rationale: 히브리어 관용구의 통일된 집행/행동의 의미를 유지하면서도, 한국어에서 자연스럽게 읽히는 비교 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름을 직역 관습 대신 음역으로 옮김
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 칭호가 아니라 고유한 언약 სახელ명입니다. 따라서 전통적 대체 번역보다 음역을 택해 신학적·본문적 구분을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: כְּאִישׁ אֶחָד의 남성 단수 이미지를 보존함
  chosen_reading: 한 사람처럼
  alternative_readings:
  - 한 사람으로
  - 한 사람같이
  rationale: 본문은 미디안에 대한 단일하고 결연한 타격을 비유적으로 말하며, 남성 단수 이미지를 일반화하지 않고 유지하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §4, Gender-accurate over gender-neutral'
