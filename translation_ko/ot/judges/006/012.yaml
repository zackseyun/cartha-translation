id: JDG.6.12
reference: Judges 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
  footnotes:
  - marker: a
    text: Or “the messenger of the LORD.” The Hebrew word can mean either “messenger” or “angel,” though “angel” best fits this appearance scene.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: “mighty man of valor.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 천사가 그에게 나타나서 그에게 말했습니다. 「야훼께서 너와 함께 계십니다, 용맹한 전사여」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 מַלְאַךְ는 ‘천사’ 또는 ‘사자/메신저’로도 옮길 수 있습니다. 이 출현 장면에서는 ‘천사’가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: '전통 번역: ‘용맹한 군사’ 또는 ‘용감한 용사’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְּאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: 환상적 출현 장면에서 מַלְאַךְ는 문맥상 ‘천사’가 가장 자연스러우며, 관계를 분명히 하기 위해 소유격으로 야훼와 연결했습니다.
- source_word: וַיֵּרָא
  english_pob_choice: appeared
  chosen_korean: 나타나서
  alternatives_korean:
  - 보였는데
  - 드러나서
  lexicon: HALOT
  rationale: 신적/천적 존재의 출현을 서술하는 서사 관용을 살려, 결과보다 ‘출현’의 사건성을 드러내는 ‘나타나다’를 선택했습니다.
- source_word: יְהוָה עִמְּךָ
  english_pob_choice: Yahweh is with you
  chosen_korean: 야훼께서 너와 함께 계십니다
  alternatives_korean:
  - 야훼가 너와 함께 있습니다
  - 야훼께서 너와 함께 하십니다
  lexicon: HALOT
  rationale: 직설적 선언이므로 축복문이 아니라 현재적 진술로 옮겼고, 2인칭 직접 화법에서 공손체를 유지했습니다.
- source_word: גִּבּוֹר הֶחָיִל
  english_pob_choice: mighty warrior
  chosen_korean: 용맹한 전사여
  alternatives_korean:
  - 힘센 전사여
  - 용사여
  - 용맹한 용사여
  lexicon: HALOT
  rationale: 전통적 ‘용맹한 군사’보다 현대 한국어에서 자연스럽고 전투적 힘을 분명히 하는 ‘전사’로 옮겼으며, 호격 어미를 살렸습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할지
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트 기본 원칙에 따라 신적 고유명사를 대체 칭호로 바꾸지 않고, המקרא의 개인 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘야훼의 천사’의 해석을 본문에서 풀어 쓸지
  chosen_reading: 본문은 존재의 출현을 그대로 유지하고, 신학적 동일시나 추가 설명은 넣지 않았습니다.
  alternative_readings:
  - ‘여호와의 사자’로 관용화
  - 그리스도 현현으로 해석
  rationale: מַלְאַךְ יְהוָה의 문맥적 긴장을 보존하기 위해, 본문에서는 어휘적 번역만 제시하고 해석적 동일시는 유보했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
