source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
  footnotes:
  - marker: a
    text: Or, 'and they went up to meet him'—the Hebrew could be understood as referring to Gideon, though the plural suffix more naturally points to the opposing forces.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 온갖 므낫세에 사자들을 보내자, 그도 따라 일어났습니다. 또 그는 아셀과 스불론과 납달리에 사자들을 보내자, 그들이 올라가 그들과 맞섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 맞으러 올라갔다’ — 히브리어는 기드온을 가리킬 수도 있으나, 복수 접미사는 더 자연스럽게 대적 세력을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 군사적 소집 문맥에서 천사가 아니라 사람 사자들을 가리키므로, 표준적이면서도 직역에 가까운 ‘사자들’로 옮겼습니다.
- source_word: בְּכָל מְנַשֶּׁה
  english_pob_choice: throughout all Manasseh
  chosen_korean: 온갖 므낫세
  alternatives_korean:
  - 므낫세 전역에
  - 므낫세 온 지역에
  lexicon: HALOT
  rationale: 지파/영역 전체를 가로질러 소집 사자가 갔다는 뜻을 살리기 위해 범위를 드러내는 표현을 택했습니다.
- source_word: וַיִּזָּעֵק
  english_pob_choice: was summoned
  chosen_korean: 따라 일어났습니다
  alternatives_korean:
  - 소집되었습니다
  - 부름을 받았습니다
  - 호응하여 모였습니다
  lexicon: HALOT
  rationale: 히브리어의 수동·소집 뉘앙스를 한국어에서 자연스럽게 살리기 위해 ‘따라 일어나다’의 군사적 집결 의미를 살렸습니다.
- source_word: לִקְרָאתָם
  english_pob_choice: to meet them
  chosen_korean: 그들과 맞섰습니다
  alternatives_korean:
  - 그들을 맞으러 갔습니다
  - 그들과 만나러 갔습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 만남보다 전투적 대치가 더 분명하므로, ‘맞서다’로 역동성을 반영했습니다.
theological_decisions:
- issue: לִקְרָאתָם의 대상을 어떻게 드러낼지
  chosen_reading: 대상은 본문처럼 암시적으로 두어, 회집된 세력과 맞서는 군사적 장면으로 읽히게 했습니다.
  alternative_readings:
  - 그들과 맞서기 위해 올라갔습니다
  - 기드온과 그의 군대에게 맞서려고 올라갔습니다
  rationale: 히브리어의 복수 접미사는 대상이 분명히 명시되지 않으므로, 한국어 본문에서는 해석을 과도하게 고정하지 않고 군사적 긴장만 드러내는 쪽이 원문에 충실합니다.
  doctrine_reference: Interpretive ambiguity should be preserved where the source does not specify a referent explicitly.
