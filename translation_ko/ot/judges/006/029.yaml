  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֥י עָשָׂ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּדְרְשׁוּ֙ וַ/יְבַקְשׁ֔וּ וַ/יֹּ֣אמְר֔וּ גִּדְעוֹן֙ בֶּן יוֹאָ֔שׁ עָשָׂ֖ה הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
  footnotes:
  - marker: a
    text: Or “one man to another.” The Hebrew idiom literally reads “a man to his neighbor.”
    reason: lexical_alternative
  - marker: b
    text: Or “this deed” or “this act.” Hebrew דָּבָר here refers to the action that had been done.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들은 서로에게[a] “누가 이 일을[b] 했습니까?” 하고 말했습니다. 그들은 조사하고 찾아보았으며, “요아스의 아들 기드온이 이 일을 했습니다” 하고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 사람이 다른 사람에게”라고 할 수 있습니다. 히브리어 관용구는 문자적으로 “한 사람이 그의 이웃에게”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이 행위” 또는 “이 행동”이라고 옮길 수 있습니다. 여기서 히브리어 דָּבָר는 실제로 벌어진 행동을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  english_pob_choice: each man ... to his neighbor
  chosen_korean: 사람마다 이웃에게
  alternatives_korean:
  - 각 사람이 서로에게
  - 한 사람씩 다른 사람에게
  lexicon: HALOT
  rationale: 히브리어 관용구의 분배적 의미를 살리면서도, 현대 한국어에서는 자연스럽게 ‘사람마다 이웃에게’로 옮기는 것이 가장 매끄럽습니다.
- source_word: מִי עָשָׂה הַדָּבָר הַזֶּה
  english_pob_choice: Who has done this thing?
  chosen_korean: 누가 이 일을 했습니까?
  alternatives_korean:
  - 누가 이 일을 했습니다?
  - 누가 이 일을 저질렀습니까?
  lexicon: HALOT
  rationale: דָּבָר는 여기서 구체적 ‘일/행동’을 가리키므로 ‘일’이 자연스럽고, 조사 질문이므로 한국어에서는 ‘했습니까?’가 가장 직접적입니다.
- source_word: וַיִּדְרְשׁוּ וַיְבַקְשׁוּ
  english_pob_choice: they inquired and searched
  chosen_korean: 알아보고 찾아본 뒤에
  alternatives_korean:
  - 조사하고 수소문한 뒤에
  - 묻고 찾아본 뒤에
  lexicon: HALOT
  rationale: דרשׁ와 בקשׁ의 연속을 한국어에서 서로 겹치지 않게, 첫 동사는 확인·조사의 뜻으로, 둘째는 적극적으로 추적하는 뜻으로 구분했습니다.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  english_pob_choice: Gideon son of Joash
  chosen_korean: 기드온, 요아스의 아들
  alternatives_korean:
  - 기드온 요아스의 아들
  - 기드온, 요아스의 아들
  lexicon: HALOT
  rationale: 고유명사는 현대 표기법에 따라 음역하고, 히브리어 족보관계는 ‘의’로 자연스럽게 드러냈습니다.
