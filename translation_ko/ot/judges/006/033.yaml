base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
  footnotes:
  - marker: a
    text: Hebrew 'sons of the east,' an idiom for eastern peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 미디안과 아말렉과 동쪽 사람들[a]이 모두 함께 모여 건너가 이스르엘 골짜기에 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘동쪽의 아들들’은 동방 민족을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  english_pob_choice: all Midian
  chosen_korean: 미디안
  alternatives_korean:
  - 온 미디안
  - 미디안 족속 전체
  lexicon: HALOT
  rationale: 히브리어는 집합적 지명을 그대로 쓰고 있으므로, 한국어도 집합명사로 처리해 '미디안'을 유지했습니다.
- source_word: וַ/עֲמָלֵק
  english_pob_choice: and Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 족속
  - 아말렉 사람들
  lexicon: HALOT
  rationale: 원문은 민족명/집합명으로 쓰였으므로, 익숙한 음역형 '아말렉'을 유지해 압축성과 원문성을 살렸습니다.
- source_word: וּ/בְנֵי קֶדֶם
  english_pob_choice: and the people of the East
  chosen_korean: 동쪽 사람들
  alternatives_korean:
  - 동방 사람들
  - 동방의 민족들
  - 동쪽의 아들들
  lexicon: HALOT
  rationale: בני קדם은 관용적으로 '동쪽 사람들/동방 사람들'을 뜻하므로, 직역투의 '아들들'보다 의미를 바로 드러내는 표현을 택했습니다.
- source_word: נֶאֶסְפוּ יַחְדָּו
  english_pob_choice: gathered together
  chosen_korean: 모여
  alternatives_korean:
  - 함께 모여
  - 집결하여
  - 한데 모여
  lexicon: HALOT
  rationale: נאסף의 수동적 집합 의미를 한국어의 자연스러운 서술로 옮겨, 전투 문맥의 집결을 간결하게 나타냈습니다.
- source_word: וַ/יַּעַבְרוּ
  english_pob_choice: crossed over
  chosen_korean: 요단을 건너서
  alternatives_korean:
  - 건너서
  - 건너가서
  - 건너와서
  lexicon: HALOT
  rationale: עבר은 여기서 지리적 이동을 뜻하므로, 문맥상 암시된 요단을 보충해 한국어가 이해하기 쉽게 옮겼습니다.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  english_pob_choice: in the Valley of Jezreel
  chosen_korean: 이스르엘 골짜기
  alternatives_korean:
  - 이스르엘 계곡
  - 이스르엘 평야
  - 이스르엘 분지
  lexicon: HALOT
  rationale: עמק은 '골짜기/계곡'의 의미이므로, 지명으로 굳어진 '이스르엘 골짜기'를 사용했습니다.
