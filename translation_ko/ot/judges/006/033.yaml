  lexicon: HALOT
  rationale: בני קדם은 관용적으로 '동쪽 사람들/동방 사람들'을 뜻하므로, 직역투의 '아들들'보다 의미를 바로 드러내는 표현을 택했습니다.
- source_word: נֶאֶסְפוּ יַחְדָּו
