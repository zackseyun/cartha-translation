source:
  edition: WLC
  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'angel' or 'messenger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 기드온은 그것이 야훼의 천사임을 깨닫고, 기드온이 말했습니다. 「아, 주 야훼님! 내가 야훼의 천사를 얼굴과 얼굴을 맞대고 보았습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사’는 ‘사자’로도 옮길 수 있습니다. 히브리어 מַלְאָךְ는 ‘천사’와 ‘메신저/사신’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 사신
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초월적 존재를 가리키므로 기본값인 ‘천사’를 살렸고, יְהוָה는 약속된 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיַּרְא ... כִּי
  english_pob_choice: Then Gideon saw that ...
  chosen_korean: 그때 기드온은 ...임을 깨닫고
  alternatives_korean:
  - 그때 기드온은 ...를 보고
  - 기드온은 ...라는 것을 보고
  lexicon: HALOT
  rationale: רָאָה는 단순 시각보다 인식의 전환을 포함하므로, 이어지는 내용과 함께 ‘깨닫다’로 옮겨 인지 변화가 드러나게 했습니다.
- source_word: אֲהָהּ
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 아하
  - 아아
  lexicon: HALOT
  rationale: 놀람과 두려움을 담은 짧은 감탄사이므로, 현대 한국어에서 자연스럽고 과장되지 않은 ‘아’로 압축했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼님
  alternatives_korean:
  - 주 하나님이시여
  - 주 하나님
  lexicon: HALOT
  rationale: 아도나이와 신성명 결합을 한국어에서 중복 없이 드러내기 위해 ‘주’와 고유명 ‘야훼’를 함께 두고, 직접 호칭이므로 존칭 어미를 반영했습니다.
- source_word: פָּנִים אֶל פָּנִים
  english_pob_choice: face to face
  chosen_korean: 얼굴과 얼굴을 맞대고
  alternatives_korean:
  - 얼굴과 얼굴로
  - 대면하여
  lexicon: HALOT
  rationale: 관용구의 직역성을 유지하면서도 현대 한국어에서 자연스럽게 읽히도록 ‘얼굴과 얼굴을 맞대고’로 풀었습니다.
theological_decisions:
- issue: 야훼의 천사와 하나님의 현현 긴장
  chosen_reading: ‘야훼의 천사’라고 분명히 옮기되, 본문이 허용하는 신현적 긴장을 그대로 유지했습니다.
  alternative_readings:
  - ‘야훼의 사자’로 완화
  - ‘주님의 천사’로 전통화
  rationale: 본문은 단순 전달자가 아니라 야훼와의 직접 대면에 준하는 두려움을 강조하므로, 전통적 완화보다 원문 긴장을 살리는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
