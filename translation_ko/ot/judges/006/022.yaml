  source_fidelity: 원문의 וַיַּרְא ... כִּי가 나타내는 기드온의 인식과 מַלְאַךְ יְהוָה, אֲדֹנָי יְהוִה, פָּנִים אֶל־פָּנִים의 주요 요소는 대체로 반영했습니다. 다만 ‘얼굴과 얼굴을 맞대고’는 실제로 얼굴을 접촉한다는 뜻으로 읽힐 수 있어, 직접 대면이라는 히브리어 관용구의 뜻에 맞게 고쳐야 합니다.
  naturalness: ‘그때 기드온은 ... 깨닫고, 기드온이 말했습니다’는 주어가 불필요하게 반복되고 접속 구성이 매끄럽지 않습니다. ‘알아차리고 말했습니다’로 고치면 현대 표준 한국어 합쇼체 서술로 자연스럽습니다. 직접 호칭의 ‘주 야훼여’는 ‘주 야훼님’보다 간결하며 히브리어의 호격을 더 잘 드러냅니다.
  terminology: ‘야훼의 천사’와 ‘야훼’는 제시된 번역 원칙 및 원문에 부합합니다. מַלְאָךְ의 대안은 각주에서 ‘사자’로 제시하는 것이 자연스럽고, ‘메신저/사신’ 같은 병기는 불필요하게 현대적이거나 중복됩니다.
  issues:
