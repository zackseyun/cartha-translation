    rationale: 어휘 대안 각주는 해당 어휘인 첫 ‘천사’ 뒤에 붙이는 편이 앵커가 명확합니다. ‘사자’만 제시하면 원문의 유효한 어휘 대안을 충분히 전달합니다.
