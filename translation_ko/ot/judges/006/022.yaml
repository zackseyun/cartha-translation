revisions:
- from: 그때 기드온은 그것이 야훼의 천사임을 깨닫고, 기드온이 말했습니다. 「아, 주 야훼님! 내가 야훼의 천사를 얼굴과 얼굴을 맞대고 보았습니다.」[a]
  to: 그때 기드온은 그가 야훼의 천사[a]임을 알아차리고 말했습니다. 「아, 주 야훼여! 내가 야훼의 천사를 얼굴을 마주하여 보았습니다.」
  rationale: 문장의 주어 반복과 부자연스러운 연결을 바로잡고, ‘얼굴과 얼굴을 맞대고’를 히브리어 관용구의 직접 대면 의미를 보존하는 ‘얼굴을 마주하여’로 수정했습니다. 신명과 ‘야훼의 천사’라는 핵심 용어 및 본문의 신학적 긴장은 유지했습니다.
