base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
  footnotes:
  - marker: a
    text: Or, 'the Spirit of the LORD came upon Gideon'; literally, 'the Spirit of the LORD clothed Gideon.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew shofar, a horn used for signaling.
    reason: cultural_note
  - marker: c
    text: Or, 'Abiezer was summoned after him' or 'Abiezer rallied behind him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 영이 기드온을 입으셨고, 그가 나팔을 불자, 아비에셀이 그를 따라 소집되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘야훼의 영이 기드온에게 임하셨다’ 곧 문자적으로는 ‘야훼의 영이 기드온을 입으셨다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 쇼파르(shofar)로, 신호에 쓰는 뿔나팔입니다.
    reason: cultural_note
  - marker: c
    text: 또는, ‘아비에셀이 그를 따라 소집되었다’ 혹은 ‘아비에셀이 그를 따라 결집하였다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ר֣וּחַ יְהוָ֔ה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 רוח
  - 야훼의 바람
  lexicon: HALOT
  rationale: רוּחַ는 문맥상 ‘영’이 분명하므로 ‘영’으로 옮기고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לָבְשָׁ֖ה אֶת גִּדְע֑וֹן
  english_pob_choice: clothed Gideon
  chosen_korean: 기드온을 입으셨고
  alternatives_korean:
  - 기드온에게 임하셨고
  - 기드온을 두르셨고
  lexicon: HALOT
  rationale: לבשׁ의 직역 이미지를 살려 ‘입다’의 능동적 은유를 보존했으며, 영어 POB의 ‘clothed’에 대응해 ‘임하다’보다 원문 감각을 더 가깝게 살렸습니다.
- source_word: וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר
  english_pob_choice: he blew the trumpet
  chosen_korean: 나팔을 불자
  alternatives_korean:
  - 뿔나팔을 불자
  - 쇼파르를 불자
  lexicon: HALOT
  rationale: שׁוֹפָר는 문화적으론 특별한 뿔나팔이지만, 본문 흐름에서 기능상 신호 악기이므로 간결한 ‘나팔’로 옮겼습니다.
- source_word: וַ/יִזָּעֵ֥ק
  english_pob_choice: Abiezer was summoned after him
  chosen_korean: 소집되었습니다
  alternatives_korean:
  - 불려 모였습니다
  - 그를 따라 모여들었습니다
  lexicon: HALOT
  rationale: נזעק의 수동적 집결 의미를 살려, 군사적·공동체적 동원 뉘앙스가 드러나는 ‘소집되다’를 택했습니다.
theological_decisions:
- issue: 야훼의 영이 기드온을 ‘입으셨고’라는 은유의 보존
  chosen_reading: 성령의 내주나 단순한 외적 감동으로 완화하지 않고, 원문의 몸-의복 은유를 그대로 살렸습니다.
  alternative_readings:
  - 야훼의 영이 기드온에게 임하셨고
  - 야훼의 영이 기드온 위에 임하셨고
  rationale: 히브리어 לבשׁ은 인격/능력 부여를 의복 이미지로 표현하므로, 본문의 힘과 문학적 긴장을 약화시키지 않기 위해 직설적 은유를 유지했습니다.
  doctrine_reference: WLC 창작 은유 보존 원칙; DOCTRINE.md contested terms on source-direct rendering
