  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
  footnotes:
  - marker: a
    text: Or 'on all the land there was dew.' The Hebrew אֶרֶץ can mean 'ground,' 'land,' or 'earth'; here 'ground' best fits the immediate setting of Gideon's sign.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그 밤에 그렇게 하셨습니다. 양털만 말라 있었고, 온 지면에는 이슬이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅에는 이슬이 있었습니다.’ 히브리어 אֶרֶץ는 ‘지면’, ‘땅’, 또는 ‘땅의 넓은 영역’을 뜻할 수 있습니다. 여기서는 기드온의 표징이라는 가까운 문맥상 ‘지면’이 가장 잘 맞습니다.
    reason: lexical_alternative
