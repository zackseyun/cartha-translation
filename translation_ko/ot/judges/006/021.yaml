  rationale: 이 절은 히브리어 본문에 יְהוָה가 직접 나오므로, 번역 원칙에 따라 고유한 언약명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
