  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'flesh'; here it refers to the prepared meat of the offering.
    reason: lexical_alternative
  - marker: c
    text: Or 'departed from before him'; Hebrew literally 'went from his eyes,' meaning he was no longer visible to Gideon.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 천사[a]가 손에 든 지팡이 끝을 내밀어 고기[b]와 무교병을 만졌습니다. 그러자 불이 바위에서 올라와 고기와 무교병을 태웠습니다. 그러고 나서 야훼의 천사는 기드온의 시야에서 떠났습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘살’; 여기서는 준비된 제물의 고기를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 앞에서 떠났다’; 히브리어로는 문자적으로 ‘그의 눈에서 갔다’로, 기드온의 눈에 더 이상 보이지 않게 되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초자연적 존재를 가리키므로 한국어에서는 ‘천사’가 자연스럽고, יְהוָה는 본문 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  english_pob_choice: the tip of the staff
  chosen_korean: 지팡이 끝
  alternatives_korean:
  - 막대기 끝
  - 지팡이의 끝
  lexicon: HALOT
  rationale: קָצֶה와 מִשְׁעֶנֶת의 구체적 이미지를 살리되, ‘지팡이 끝’이 현대 한국어에서 가장 자연스럽고 짧습니다.
- source_word: בָּשָׂר
  english_pob_choice: meat
  chosen_korean: 고기
  alternatives_korean:
  - 육체
  - 살
  lexicon: HALOT
  rationale: 여기서는 제물로 준비된 음식의 의미이므로, 오해를 피하기 위해 ‘고기’로 옮겼습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무교절 떡
  lexicon: HALOT
  rationale: 율법적 제의 맥락을 드러내는 전문 용어를 유지하기 위해 ‘무교병’을 택했고, 본문 흐름상 음식 항목으로 그대로 읽히도록 했습니다.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר וַתֹּאכַל
  english_pob_choice: fire went up from the rock and consumed
  chosen_korean: 바위에서 불이 올라와 …을 삼켜 버렸습니다
  alternatives_korean:
  - 바위에서 불이 올라와 …을 먹어 버렸습니다
  - 바위에서 불이 일어나 …을 소멸시켰습니다
  lexicon: HALOT
  rationale: 불이 ‘올라오다’와 ‘삼키다’의 연속 동작을 살리되, 한국어에서는 불의 작용을 자연스럽게 표현하는 ‘삼켜 버렸습니다’가 적절합니다.
- source_word: הָלַךְ מֵעֵינָיו
  english_pob_choice: went away from his sight
  chosen_korean: 그의 눈앞에서 사라졌습니다
  alternatives_korean:
  - 그의 시야에서 떠났습니다
  - 그의 눈에서 떠났습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그의 눈으로부터 갔다’이지만, 의미는 더 이상 보이지 않게 되었다는 뜻이므로 한국어 관용 표현을 사용했습니다.
theological_decisions:
