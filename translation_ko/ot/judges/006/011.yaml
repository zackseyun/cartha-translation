  source_fidelity: 개정이 필요합니다. 초안의 ‘아비엘의 아들 요아스’는 히브리어 אֲבִי הָעֶזְרִי(아비에스리/아비에셀 계통 사람)를 인명 ‘아비엘’과 부자 관계로 잘못 처리했습니다. 또한 אֵלָה는 느티나무가 아니라 상수리나무 또는 테레빈스나무로 옮기는 것이 적절하며, מִפְּנֵי מִדְיָן은 ‘미디안 사람 앞에서’가 아니라 미디안의 위협으로부터 곡식을 감추려는 뜻입니다.
