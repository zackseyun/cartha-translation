reference: Judges 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לָ/כֶ֗ם אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם לֹ֤א תִֽירְאוּ֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יוֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קוֹלִֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
  footnotes:
  - marker: a
    text: Or, 'you shall not fear' or 'do not fear.' The Hebrew expresses a prohibition.
    reason: lexical_alternative
  - marker: b
    text: '''Listened to my voice'' can also be understood as ''obeyed my voice.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게 말했습니다. ‘나는 야훼, 너희의 하나님입니다. 너희가 살고 있는 아모리 사람들의 땅에서 그들의 신들을 두려워하지 마십시오.[a] 그러나 너희는 내 목소리를 듣지 않았습니다.[b]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 금지 명령의 형태로, ‘두려워하지 말라’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 목소리를 듣지 않았다’는 ‘내 말에 순종하지 않았다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  english_pob_choice: And I said
  chosen_korean: 내가 너희에게 말하였노라
  alternatives_korean:
  - 내가 너희에게 말했습니다
  - 그리고 내가 너희에게 말하였습니다
  lexicon: HALOT
  rationale: 하나님의 이전 발화를 이어 주는 서술이므로 ‘말하였노라’로 직접적이고 선언적인 어조를 살렸고, 너희를 향한 발화 방향도 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유명사 יְהוָה를 대체 тит울이 아니라 신명 표기로 옮겨, POB 기준에 따라 ‘야훼’를 사용했습니다.
- source_word: לֹא תִירְאוּ
  english_pob_choice: do not fear
  chosen_korean: 두려워해서는 안 됩니다
  alternatives_korean:
  - 두려워하지 마십시오
  - 두려워하지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어 부정 명령의 금지 כוח를 현대 한국어에서 가장 자연스럽게 드러내기 위해 금지형으로 옮겼습니다.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  english_pob_choice: the gods of the Amorites
  chosen_korean: 아모리 사람들의 신들
  alternatives_korean:
  - 아모리 족속의 신들
  - 아모리 사람의 신들
  lexicon: HALOT
  rationale: 집합명사적 민족명과 그들의 신들을 가리키는 구조를 살려, 복수 신들을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  english_pob_choice: you have not listened to my voice
  chosen_korean: 내 목소리를 듣지 않았습니다
  alternatives_korean:
  - 내 음성을 듣지 않았습니다
  - 내 말에 순종하지 않았습니다
  lexicon: HALOT
  rationale: שמע בקול의 관용구를 우선 직역해 ‘듣다’의 이미지를 유지했고, ‘순종하다’는 해석적 의미는 너무 앞세우지 않았습니다.
theological_decisions:
- issue: 야훼의 직접 인용 속 명령의 한국어 명령/금지 어조
  chosen_reading: ‘두려워해서는 안 됩니다’로 금지의 힘을 유지하되, 문장 전체는 현대 공문체에 가까운 합쇼체로 정리했습니다.
  alternative_readings:
  - 두려워하지 마십시오
  - 두려워하지 말아야 합니다
  rationale: 원문은 단순한 권고가 아니라 금지 명령이므로, 한국어에서도 도덕적 권면보다 명령의 힘이 분명히 느껴지도록 했습니다.
  doctrine_reference: 히브리어 부정명령 לֹא + 미완료형의 금지 기능
- issue: נשמעה בקולי의 처리
  chosen_reading: ‘내 목소리를 듣지 않았습니다’로 번역해, 순종의 의미를 함의하되 핵심 이미지는 유지했습니다.
  alternative_readings:
  - 내 목소리에 순종하지 않았습니다
  - 내 말을 듣지 않았습니다
  rationale: 본문은 청취와 복종의 관용적 연결을 지니지만, 한국어 본문에서는 일단 ‘듣다’의 직접적 이미지가 더 원문에 가깝습니다.
  doctrine_reference: 히브리어 관용구 שמע בקול
