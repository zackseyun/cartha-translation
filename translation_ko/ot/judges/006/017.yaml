base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: ko
  text: 그가 그에게 말했습니다. “이제 제가 당신의 눈에 호의를 얻었다면, 당신이 저와 말하고 있다는 표징을 제게 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָ֥אתִי חֵ֖ן בְּעֵינֶ֑יךָ
  english_pob_choice: I have found favor in your eyes
  chosen_korean: 주님의 눈에 은혜를 입었다면
  alternatives_korean:
  - 주님의 눈에서 은총을 찾았다면
  - 주님의 눈에 호의를 얻었다면
  lexicon: חֵן
  rationale: 관용구 ‘눈에 은혜를 입다’는 히브리어의 ‘호의를 얻다’라는 의미를 자연스럽게 살리면서, POB의 ‘favor’에 대응하는 ‘은혜’를 사용해 은혜-호의의 뉘앙스를 유지했습니다.
- source_word: א֔וֹת
  english_pob_choice: a sign
  chosen_korean: 표
  alternatives_korean:
  - 징조
  - 증거
  - 표적
  lexicon: אוֹת
  rationale: 문맥상 기적적 ‘표적’보다 요청된 확인 신호의 성격이 강하므로, 보다 중립적인 ‘표’를 택해 원문의 일반성을 살렸습니다.
- source_word: שָׁ/אַתָּ֖ה מְדַבֵּ֥ר עִמִּֽי
  english_pob_choice: that you are the one speaking with me
  chosen_korean: 당신이 저와 말씀하고 계시는 바로 그분이라는
  alternatives_korean:
  - 당신이 저에게 말하고 계신 바로 그분이라는
  - 당신이 제게 말씀하시는 분이라는
  lexicon: דִּבֵּר
  rationale: 직역처럼 단순히 ‘말하다’로만 처리하기보다, 존칭 화법이 필요한 대상에게는 ‘말씀하다’가 한국어 의미를 더 정확히 전달합니다. 다만 원문의 현재 진행형과 지시성은 ‘말씀하고 계시는 바로 그분’으로 살렸습니다.
theological_decisions:
- issue: ‘you are the one’의 지시 대상 처리
  chosen_reading: ‘바로 그분’으로 처리해, 대화 상대가 단순한 정보 전달자가 아니라 실제로 임재하여 말씀하시는 분임을 드러냈습니다.
  alternative_readings:
  - ‘당신이 말씀하고 계신 분입니다’
  - ‘말씀하고 계시는 것이 당신임을’
  rationale: 히브리어는 상대가 ‘말하고 있는 바로 그 대상’임을 확인하는 구조이므로, 한국어에서도 지시성을 분명히 해야 장면의 긴장이 유지됩니다.
  doctrine_reference: 본문 서사 이해
