  source_fidelity: 히브리어 אַנְשֵׁי הָעִיר는 ‘성읍의 남자들’인데, 초안의 ‘그 성읍의 사람들’은 성별 표지를 중화합니다. 또한 עָלָיו는 기본적으로 ‘그 위에’를 뜻하므로, 문맥적 추정으로 ‘그 곁에’라고 본문에서 바꾸기보다 공간 관계를 그대로 보존해야 합니다.
  naturalness: ‘보십시오’는 현대 한국어 성경 서술에서 독자에게 직접 명령하는 듯하여 다소 부자연스럽습니다. ‘일어나 보니’는 וְהִנֵּה가 나타내는 뜻밖의 발견을 자연스럽고 정확하게 전달합니다. ‘베어져’는 아세라가 목재로 된 제의 대상이라는 문맥에 잘 맞습니다.
