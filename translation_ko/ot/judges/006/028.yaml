language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
  footnotes:
  - marker: a
    text: Or 'the Asherah pole'; Hebrew 'the Asherah.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 남자들이 아침 일찍 일어나 보니, 바알의 제단은 헐려 있었고 그 위에 있던 아세라는 베어져 있었으며, 둘째 수소는 세워진 제단 위에 바쳐져 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  english_pob_choice: rose early
  chosen_korean: 아침 일찍 일어났는데
  alternatives_korean:
  - 일찍 일어났는데
  - 아침에 일찍 일어났는데
  lexicon: HALOT
  rationale: wayyiqtol + Hiphil의 이른 기상 의미를 자연스러운 현대 한국어로 살리되, 서사의 시간 전개를 부드럽게 연결했습니다.
- source_word: אַנְשֵׁי הָעִיר
  english_pob_choice: the men of the city
  chosen_korean: 그 성읍의 사람들이
  alternatives_korean:
  - 그 성읍의 남자들이
  - 그 도시의 남자들이
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘성읍의 남자들’이지만, 한국어에서는 성별을 전면화하면 어색해질 수 있어 집단 주어로 옮기되 원문의 사회적 주체를 유지했습니다.
- source_word: הָאֲשֵׁרָה
  english_pob_choice: the Asherah
  chosen_korean: 아세라
  alternatives_korean:
  - 아세라 목상
  - 아세라 상
  lexicon: HALOT
  rationale: 본문이 사용한 용어 자체를 보존해, 대상이 단순한 ‘막대’인지 숭배 대상/상징인지 열어 두었습니다.
- source_word: אֲשֶׁר עָלָיו
  english_pob_choice: that was on it
  chosen_korean: 그 곁에 있던
  alternatives_korean:
  - 그 위에 있던
  - 그 위에 달려 있던
  lexicon: HALOT
  rationale: 문맥상 아세라가 제단과 결부된 설치물로 보이므로, 한국어에서는 ‘곁에 있던’으로 자연스럽게 옮기되 원문의 관계는 주석으로 확인할 수 있게 했습니다.
- source_word: הֹעֲלָה
  english_pob_choice: had been offered up
  chosen_korean: 바쳐져 있었습니다
  alternatives_korean:
  - 드려져 있었습니다
  - 제물로 올려져 있었습니다
  lexicon: HALOT
  rationale: 제의적 상승/봉헌의 의미를 살리면서, 한국어의 수동 표현으로 제단 위 희생 제의의 완료 상태를 나타냈습니다.
theological_decisions:
- issue: 아세라의 번역 처리
  chosen_reading: 음역 ‘아세라’를 본문에 두고, 그 의미 범위를 주석으로 남김
  alternative_readings:
  - 아세라 목상
  - 아세라 상
  rationale: 원문 용어 자체가 무엇을 가리키는지 본문이 더 구체화하지 않으므로, 해석을 본문에 과도하게 주입하지 않고 독자가 원문 대상을 추적할 수 있도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve source ambiguity unless context compels narrowing'
- issue: ‘그 곁에 있던’의 관계 해석
  chosen_reading: 공간적 인접성으로 순화하여 제단과 결부된 물건임을 드러냄
  alternative_readings:
  - 그 위에 있던
  - 그 위에 달려 있던
  rationale: עָלָיו를 기계적으로 ‘위에’로만 옮기면 한국어에서 부자연스럽고, 문맥상 제단 주변의 우상 상징을 가리키는 기능을 더 잘 전달합니다.
  doctrine_reference: Optimal equivalence; maintain probable sense without flattening the Hebrew
