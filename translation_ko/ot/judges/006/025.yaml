  - severity: medium
    issue: ‘아세라상을 찍어 부수라’
    rationale: הָאֲשֵׁרָה는 반드시 ‘상’으로 특정할 수 없으며, תִּכְרֹת은 보통 베어 내는 행위를 가리킵니다. 음역과 ‘베어 내라’가 원문의 종교사적·어휘적 모호성을 더 잘 보존합니다.
