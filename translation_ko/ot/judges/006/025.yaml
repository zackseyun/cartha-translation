  source_fidelity: ‘이레 된’은 ‘일곱 살 된’을 뜻하는 히브리어 שֶׁבַע שָׁנִים을 잘못 옮겼습니다. 또한 תִּכְרֹת은 아세라를 ‘찍어 부수다’보다 ‘베어 내다/잘라 내다’로 옮기는 것이 적절합니다. עָלָיו는 ‘그 위에’로 유지하여 위치 관계의 여지를 보존할 수 있습니다.
  naturalness: 전반적으로 현대 한국어 합쇼체에 맞지만, ‘그에게 말씀하시되’는 다소 문어적입니다. ‘그에게 말씀하셨습니다’와 직접 인용을 쓰면 현대적이면서도 격식 있는 문장이 됩니다.
  terminology: 여호와, 바알, 아세라는 적절합니다. הָאֲשֵׁרָה는 그 정확한 대상이 논쟁적이므로 ‘아세라’로 음역하여 모호성을 보존하는 편이 ‘아세라상’보다 낫습니다.
