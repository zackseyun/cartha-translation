  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH shalom''; traditionally transliterated ''Yahweh-shalom.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 기드온은 그곳에 야훼를 위하여 제단을 쌓고, 그것을 「야훼는 평화이시다」라고 불렀습니다.[a] 그 제단은 오늘까지 아비에셀 사람들의 오브라에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH shalom’; 전통적으로 ‘야훼-샬롬’으로 음역합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 쌓고
  alternatives_korean:
  - 세우고
  - 건축하고
  lexicon: HALOT
  rationale: 제단을 만드는 문맥에서는 한국어로 자연스러운 동작인 ‘쌓다’가 히브리어 בנה의 공사적 의미를 잘 드러냅니다.
- source_word: מִזְבֵּחַ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 제사단
  - 단
  lexicon: HALOT
  rationale: 예배·제의 맥락의 표준어로 ‘제단’이 가장 직접적이며, 문맥상 다른 의미 확장 없이 대응됩니다.
- source_word: יְהוָה שָׁלוֹם
  english_pob_choice: Yahweh Is Peace
  chosen_korean: 「야훼는 평강이시다」
  alternatives_korean:
  - 「야훼 평강」
  - 「야훼는 평안이시다」
  - 「여호와는 평강이시다」
  lexicon: HALOT
  rationale: 이것은 제단의 기념 이름이므로 원문의 명명식을 살려 ‘야훼는 평강이시다’로 옮겼습니다. ‘평강’은 שָׁלוֹם의 핵심 의미를 유지하면서도 성경적 어감을 보존합니다.
- source_word: אֲבִי הָעֶזְרִי
  english_pob_choice: of the Abiezrites
  chosen_korean: 아비에셀 사람들의
  alternatives_korean:
  - 아비에셀 자손들의
  - 아비에셀 족속의
  lexicon: HALOT
  rationale: 지명 뒤에 붙는 집단명은 한국어에서 ‘~사람들’이 가장 자연스럽고, ‘Abiezrites’의 족속/씨족 의미를 무리 없이 반영합니다.
theological_decisions:
- issue: 여호와/야훼의 고유신명 처리
  chosen_reading: 본문과 제단 이름 모두에서 ‘야훼’로 일관해 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 יְהוָה가 직접 나오므로, 프로젝트 기본 원칙에 따라 전통 교회어 대신 신명 본래형을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
