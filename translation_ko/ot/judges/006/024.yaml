  naturalness: ‘오늘까지도 아직도’는 현대 한국어에서 중복적입니다. 또한 제단의 이름인 ‘야훼는 평강이시다’는 이해 가능하나, 표준 현대어 합쇼체 번역에서는 ‘평화’가 더 자연스럽습니다.
  terminology: ‘야훼’, ‘제단’, ‘오브라’, ‘아비에셀 사람들’은 적절합니다. שָׁלוֹם은 이 명명식에서 ‘평화’로 옮겨 간결하면서도 원문의 의미를 보존할 수 있습니다. 각주는 이름의 히브리어 형태와 전통적 음역을 적절히 설명합니다.
