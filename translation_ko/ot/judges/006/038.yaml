theological_decisions:
- issue: 기드온의 표징이 실제로 이루어졌다는 확인 문장 처리
  chosen_reading: ‘그렇게 되었습니다’로 표징의 성취를 단정적으로 확인합니다.
  alternative_readings:
  - ‘그 일이 그대로 되었습니다’
  - ‘그리하여 그렇게 되었습니다’
  rationale: 본문은 기드온의 요청에 대한 응답이 실제로 일어났음을 간결하게 확인하는 서술이므로, 과장 없이 결과의 사실성을 분명히 드러냈습니다.
  doctrine_reference: 섭리와 표징의 성취에 대한 서술적 본문
- issue: 두 개의 연속 동사를 한국어에서 어떻게 분리해 보일지
  chosen_reading: ‘양털을 짰습니다. 그러자 양털에서 이슬이 짜여 나왔습니다’로 분리해 인과를 보이되, 원문의 연속성을 유지합니다.
  alternative_readings:
  - 한 문장으로 길게 연결
  - ‘짰더니 이슬이 나왔습니다’로 축약
  rationale: 히브리어의 동작 연쇄를 살리면서도 한국어 문장 흐름을 자연스럽게 하기 위해 절을 나누었습니다.
  doctrine_reference: 서사 문체의 충실한 재현
