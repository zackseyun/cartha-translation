    text: 또는 ‘양털을 눌러 짰습니다’, ‘양털을 비틀어 짰습니다’. 히브리어는 양털을 압착하는 동작과 그 양털에서 이슬을 빼내는 동작을 연속된 두 동사로 표현합니다.
