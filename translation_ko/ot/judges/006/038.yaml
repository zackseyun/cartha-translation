  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
  footnotes:
  - marker: a
    text: Or 'pressed the fleece' / 'wrung out the fleece.' The Hebrew uses two verbs in sequence to describe compressing the fleece and extracting dew from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그대로 되었습니다. 그는 이튿날 아침 일찍 일어나 양털을 짰습니다.[a] 그리고 양털에서 이슬을 짜냈는데, 물이 한 그릇 가득했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양털을 눌러 짰습니다’, ‘양털을 비틀어 짰습니다’. 히브리어는 양털을 압착하는 동작과 그 양털에서 이슬을 빼내는 동작을 연속된 두 동사로 표현합니다.
    reason: lexical_alternative
