id: JDG.6.20
reference: Judges 6:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
  footnotes:
  - marker: a
    text: Or “the messenger of God.” The Hebrew word can mean either a human messenger or an angelic messenger; here the context favors a supernatural envoy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 하나님의 천사[a]가 그에게 말했습니다. “고기와 무교병을 가져다가 이 바위 위에 놓고, 국물을 부으십시오.” 그가 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 사자”. 히브리어 מַלְאָךְ는 사람의 사자일 수도 있고 천사일 수도 있으나, 여기서는 문맥상 초자연적 전령이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  english_pob_choice: the angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 사자
  - 하나님의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 ‘사자/전령’과 ‘천사’ 둘 다 가능하지만, 이 문맥에서는 초자연적 존재로 전개되므로 한국어에서도 ‘천사’가 자연스럽고 본문의 신학적 무게를 잘 드러냅니다.
- source_word: הַבָּשָׂר
  english_pob_choice: the meat
  chosen_korean: 이 고기
  alternatives_korean:
  - 이 살
  - 이 육
  lexicon: HALOT
  rationale: 먹는 대상의 문맥이므로 직역적인 ‘살’보다 ‘고기’가 현대 한국어에서 정확하고 자연스럽습니다.
- source_word: הַמַּצּוֹת
  english_pob_choice: the unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무교떡
  lexicon: HALOT
  rationale: 제의적·서사적 문맥에서 מַצּוֹת의 관용적 대응은 ‘무교병’이 가장 간결하며, 빵의 종류라는 의미도 유지합니다.
- source_word: הַנַּח אֶל הַסֶּלַע הַלָּז
  english_pob_choice: set them on this rock
  chosen_korean: 이 바위 위에 놓고
  alternatives_korean:
  - 이 바위에 두고
  - 이 바위 위에 두십시오
  lexicon: HALOT
  rationale: נוח의 히필 명령은 ‘놓다/두다’의 뜻이므로, 한국어에서는 위치를 분명히 하는 ‘위에 놓고’가 원문의 동작을 잘 살립니다.
- source_word: הַמָּרַק
  english_pob_choice: the broth
  chosen_korean: 국물
  alternatives_korean:
  - 육수
  - 수프
  lexicon: HALOT
  rationale: מָרַק은 고기 삶은 물/국물의 뜻이므로, 제물과 함께 놓인 액체를 가장 자연스럽게 가리키는 ‘국물’이 적절합니다.
- source_word: וַיַּעַשׂ כֵּן
  english_pob_choice: And he did so
  chosen_korean: 그가 그렇게 했습니다
  alternatives_korean:
  - 그리하였습니다
  - 그렇게 하였습니다
  lexicon: HALOT
  rationale: 순종의 결과를 간결하게 보고하는 관용구이므로, 현대 합쇼체에서는 ‘그렇게 했습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: שילוב of supernatural messenger terminology in a theophanic scene
  chosen_reading: 하나님의 천사
  alternative_readings:
  - 하나님의 사자
  rationale: 히브리어 מַלְאַךְ는 본질적으로 ‘사자’일 수 있지만, 사사기 6장의 전개에서는 초자연적 현현의 성격이 분명해지므로 ‘천사’로 옮겨 본문의 신학적 긴장을 유지합니다.
  doctrine_reference: Translation philosophy §1, §3
