  naturalness: 전반적으로 자연스럽지만, 합쇼체 목표에 맞추어 천사의 직접 명령도 ‘부으십시오’로 통일하는 편이 일관되고 현대적인 공적 문체에 맞습니다.
  terminology: ‘하나님의 천사’, ‘무교병’, ‘국물’은 문맥과 한국어 성서 용례에 잘 맞습니다. מַלְאַךְ의 대안 번역을 제시한 각주는 유지할 수 있습니다.
