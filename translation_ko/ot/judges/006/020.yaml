revisions:
- from: 그러자 하나님의 천사가 그에게 말했습니다. 「이 고기와 무교병을 가져다가 이 바위 위에 놓고, 국물을 부어라.」 그가 그렇게 했습니다.[a]
  to: 그러자 하나님의 천사[a]가 그에게 말했습니다. “고기와 무교병을 가져다가 이 바위 위에 놓고, 국물을 부으십시오.” 그가 그렇게 했습니다.
  rationale: 합쇼체의 문체 일관성을 위해 직접 명령을 ‘부으십시오’로 고치고, 어휘 대안 각주를 ‘하나님의 천사’에 직접 연결했습니다. 또한 원문의 정관사에 불필요한 근접 지시성을 더하지 않도록 ‘이 고기’를 ‘고기’로 조정했습니다. 그 밖의 표현은 원문의 의미와 서사적 문맥을 적절히 반영하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:09:48Z'
