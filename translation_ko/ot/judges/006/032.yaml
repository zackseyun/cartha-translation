base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
  footnotes:
  - marker: a
    text: Jerubbaal sounds like a name built on the verb 'contend'; the explanation is, 'Let Baal contend against him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'May Baal contend against him'; the Hebrew verb may be heard as a jussive wish. Some take it as indicative, 'Baal will contend against him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그날 기드온은 그를 여룹바알이라 불렀습니다[a]. “바알이 그와 다투게 하십시오[b]. 그가 바알의 제단을 허물었기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여룹바알’은 ‘다투다’라는 동사와 연결된 이름이며, 뒤의 설명구가 그 뜻을 풀어 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바알이 그와 다투게 하십시오’입니다. 히브리어 동사는 청유형으로도, 서술형으로도 들릴 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  english_pob_choice: he called him
  chosen_korean: 그를 …이라 불렀습니다
  alternatives_korean:
  - 그를 …이라 이름 붙였습니다
  - 그를 …이라 불렀습니다
  lexicon: HALOT
  rationale: קרא + 목적어 표지는 ‘~이라 부르다/이름하다’의 자연스러운 서술이므로, 간결한 서술체로 옮겨 이름 부여 행위를 드러냈습니다.
- source_word: יְרֻבַּעַל
  english_pob_choice: Jerubbaal
  chosen_korean: 여룹바알
  alternatives_korean:
  - 예룹바알
  - 여루바알
  lexicon: 프로젝트 외래어 표기
  rationale: 인명은 표기 정책에 따라 음역하되, 뒤의 ‘다투다’라는 설명구와의 말놀이를 보존하기 위해 본문에서는 해설을 별도로 두었습니다.
- source_word: יָרֶב בּוֹ הַבַּעַל
  english_pob_choice: Let Baal contend against him
  chosen_korean: 바알이 그와 다투게 하십시오
  alternatives_korean:
  - 바알이 그와 다투게 하소서
  - 바알이 그와 다투기를 바랍니다
  - 바알이 그와 논쟁하게 하십시오
  lexicon: HALOT
  rationale: ריב은 ‘다투다/송사하다/변론하다’의 폭이 있으나, 여기서는 이름의 어원 설명과 적대적 뉘앙스를 함께 살려 ‘다투다’로 옮겼습니다. 청유형은 한국어에서 가장 직접적으로 대응되는 ‘-게 하십시오’로 표기했습니다.
- source_word: נָתַץ אֶת מִזְבְּחוֹ
  english_pob_choice: he tore down his altar
  chosen_korean: 그가 바알의 제단을 허물었기 때문입니다
  alternatives_korean:
  - 그가 그의 제단을 허물었기 때문입니다
  - 그가 바알의 제단을 무너뜨렸기 때문입니다
  lexicon: HALOT
  rationale: נתץ는 구조물을 ‘허물다/무너뜨리다’는 뜻이므로 ‘허물다’를 택했습니다. 대명사 ‘그의’는 문맥상 바알을 가리키므로, 혼동을 줄이기 위해 ‘바알의 제단’으로 풀어 썼습니다.
theological_decisions:
- issue: 바알 이름과 청유형의 종교적 공격성 보존
  chosen_reading: ‘바알이 그와 다투게 하십시오’로 옮겨, 단순 설명이 아니라 우상 바알에게 책임을 돌리는 조롱 섞인 명명 행위를 드러냈습니다.
  alternative_readings:
  - ‘바알이 그를 대적하게 하십시오’
  - ‘바알이 그와 논쟁하게 하십시오’
  rationale: 본문은 기드온의 행위를 정당화하는 설명이면서 동시에 바알의 무력함을 드러내는 이름놀이입니다. 이를 완화하지 않고 청유형과 직접적 동사로 살려야 본문의 수사와 신학적 긴장이 유지됩니다.
  doctrine_reference: 우상 비판 / 여호와 신앙의 공적 증언
- issue: בַּעַל의 표기
  chosen_reading: 고유명사로서 ‘바알’을 유지했습니다.
  alternative_readings:
  - ‘주인’
  - ‘주’
  rationale: 여기서 בעל은 일반 명사 ‘주인’이 아니라 가나안 신의 고유명사이므로, 보편 명사로 풀면 우상 숭배에 대한 본문의 표적성이 약해집니다.
  doctrine_reference: 우상 숭배 금지
