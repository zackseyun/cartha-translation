  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם כָּ/זֹ֣ה וְ/כָ/זֶ֔ה עָ֥שָׂה לִ֖/י מִיכָ֑ה וַ/יִּשְׂכְּרֵ֕/נִי וָ/אֱהִי ל֖/וֹ לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
  footnotes:
  - marker: a
    text: Or “thus and thus”; the Hebrew idiom summarizes previously described actions without repeating them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다[a], 「미가가 나에게 이러저러한 일을 했고, 나를 삯주었으며, 내가 그의 제사장이 되었습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「이러저러한」. 히브리어 관용구는 앞서 묘사된 행동을 반복하지 않고 요약합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  english_pob_choice: He said to them
  chosen_korean: 그가 그들에게 말했습니다
  alternatives_korean:
  - 그가 그들에게 말하였습니다
  - 그가 그들에게 대답했습니다
  lexicon: HALOT
  rationale: 직접 화답의 서두이므로 합쇼체의 자연스러운 서술로 옮기되, אָנשׁ의 연결어감은 한국어에서 과도하게 드러내지 않았습니다.
- source_word: כָּזֹה וְכָזֶה
  english_pob_choice: such and such
  chosen_korean: 이러저러한
  alternatives_korean:
  - 이러저러한 것과 저러저러한 것
  - 이러쿵저러쿵한
  lexicon: HALOT
  rationale: 히브리어 관용구가 앞선 내용의 개요적 요약을 뜻하므로, 반복을 피하면서도 불특정한 요약감을 주는 표현으로 옮겼습니다.
- source_word: וַיִּשְׂכְּרֵנִי
  english_pob_choice: he hired me
  chosen_korean: 나를 삯주었으며
  alternatives_korean:
  - 나를 고용했으며
  - 나에게 품삯을 주었으며
  lexicon: HALOT
  rationale: שׂכר의 고용/삯의 뉘앙스를 살리기 위해 「삯주다」를 택했고, 단순 고용보다 보수 관계를 더 분명히 드러냅니다.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  english_pob_choice: and I became his priest
  chosen_korean: 내가 그의 제사장이 되었습니다
  alternatives_korean:
  - 그리고 나는 그의 제사장이 되었습니다
  - 나는 그의 제사장이 되었습니다
  lexicon: HALOT
  rationale: היה의 결과 상태를 살려 「되다」로 옮겼고, לְכֹהֵן은 직역적으로 「제사장」으로 유지해 개인 소속과 제의 직무를 함께 드러냈습니다.
theological_decisions:
- issue: 사적인 고용 관계로서의 제사장 직분
  chosen_reading: 「그의 제사장」이라는 표현을 그대로 유지해 미가와 레위인 사이의 개인적 종속 관계를 드러냈습니다.
  alternative_readings:
  - 「그를 위한 제사장」
  - 「미가의 사제」
  rationale: 본문은 이 제의 질서의 비정상성을 해소하지 않고 서술하므로, 관계의 긴장을 완화하지 않는 번역이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 본문의 역사-서술적 긴장 보존
