  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
  footnotes:
  - marker: a
    text: Or “valiant men” or “men of valor” for “capable men.”
    reason: lexical_alternative
  - marker: b
    text: Or “to search it out” / “investigate it” for “to explore it.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “the house of Micah,” which may refer to Micah’s household compound.
    reason: cultural_note
translation:
  language: ko
  text: 단의 자손들이 그들의 씨족에서, 곧 그들 가운데서 다섯 사람, 곧 유능한 사람들을 소라와 에스다올에서 보내어 그 땅을 정탐하고[a] 살펴보게[b] 하였습니다. 그들이 그들에게 말하였습니다. “가서 그 땅을 살펴보라.” 그래서 그들은 에브라임 산지에 이르러 미가의 집까지[c] 갔으며, 그곳에서 밤을 지냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정탐하다’는 לְרַגֵּל의 기본 의미를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살펴보다’는 חקר의 면밀한 조사·탐구 의미를 반영한 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘미가의 집’은 문자적으로는 집이지만, 가문이나 거주 구역을 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  english_pob_choice: the sons of Dan
  chosen_korean: 단의 자손들
  alternatives_korean:
  - 단 사람들
  - 단 자손들
  lexicon: HALOT
  rationale: 히브리어의 족속-자손 표현을 살리되, 한국어에서 자연스러운 성경체인 ‘자손들’을 사용해 부족 정체성을 보존했습니다.
- source_word: מִמִּשְׁפַּחְתָּם / מִקְצוֹתָם
  english_pob_choice: from their clan / from among their number
  chosen_korean: 자기 종족 가운데서
  alternatives_korean:
  - 자기 가족에서
  - 자기 지파 가운데서
  - 그들 가운데서
  lexicon: HALOT
  rationale: מִשְׁפָּחָה와 מִקְצוֹתָם의 선택·부분적 취지를 함께 담기 위해, 넓게는 종족/씨족 단위를 암시하는 ‘자기 종족 가운데서’로 옮겼습니다.
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  english_pob_choice: valiant men / capable men
  chosen_korean: 용맹한 사람들
  alternatives_korean:
  - 능력 있는 사람들
  - 용사들
  - 싸움꾼들
  lexicon: HALOT
  rationale: 이 표현은 단순한 능력보다 ‘힘 있고 유능한’ 사람들을 가리키므로, 정탐 맥락을 해치지 않으면서도 POB의 수정 방향에 맞춰 ‘용맹한 사람들’로 옮겼습니다.
- source_word: לְרַגֵּל ... וּלְחָקְרָהּ / חִקְרוּ
  english_pob_choice: to spy out ... to explore it / explore the land
  chosen_korean: 그 땅을 정탐하고 살펴보게
  alternatives_korean:
  - 그 땅을 정탐하고 조사하게
  - 그 땅을 염탐하고 탐색하게
  lexicon: HALOT
  rationale: לְרַגֵּל의 정보수집적 의미는 ‘정탐’으로, חקר의 면밀한 조사 의미는 ‘살펴보다’로 구분해 두 동사의 긴장을 유지했습니다.
- source_word: הַר אֶפְרַיִם
  english_pob_choice: the hill country of Ephraim
  chosen_korean: 에브라임 산지
  alternatives_korean:
  - 에브라임의 산지
  - 에브라임 고원지대
  lexicon: HALOT
  rationale: 지리 용례상 특정 산이 아니라 고지대를 가리키므로, 한국어 성경에서 널리 쓰이면서도 직역에 가까운 ‘산지’를 택했습니다.
- source_word: בֵּית מִיכָה
  english_pob_choice: the house of Micah
  chosen_korean: 미가의 집
  alternatives_korean:
  - 미가의 집안
  - 미가의 거처
  lexicon: HALOT
  rationale: 직역상 ‘집’이지만, 영어 POB의 문화적 주석처럼 집안/거처를 포함할 수 있어도 본문에는 가장 직접적인 ‘미가의 집’을 유지했습니다.
theological_decisions:
- issue: 정탐 행위의 서술 방식
  chosen_reading: 본절의 לְרַגֵּל을 ‘정탐하다’로, חקר를 ‘살펴보다’로 구분해 행위의 목적성을 드러냈습니다.
  alternative_readings:
  - 모두 ‘탐색하다’로 통일
  - 모두 ‘조사하다’로 통일
  rationale: 히브리어는 단순 이동이 아니라 정보 수집과 면밀한 검토를 함께 묘사하므로, 두 동사를 구분해 본문의 긴장을 보존하는 편이 소스에 더 충실합니다.
  doctrine_reference: 본문 서사 이해와 어휘 구분
- issue: 직설 인용의 말투
  chosen_reading: 「가서 그 땅을 살펴보라」처럼 명령형을 한국어 자연스러운 직설 명령으로 옮겼습니다.
  alternative_readings:
  - 공손한 청유형으로 완화
  - 서술형으로 풀어쓰기
  rationale: 원문은 파견된 자들에게 주어진 직접 명령이므로, 의미를 약화시키지 않기 위해 명령형을 유지했습니다.
  doctrine_reference: 서사문체 보존
