revisions:
- from: 단의 자손들이 자기 종족 가운데서 다섯 사람, 곧 용맹한 사람들을 소라와 에스다올에서 뽑아 그 땅을 정탐하고 살펴보게 하였습니다. 그들이 그들에게 말하기를 「가서 그 땅을 살펴보라」 하였습니다. 그래서 그들은 에브라임 산지에 이르러 미가의 집에까지 갔고, 거기서 밤을 지냈습니다.[a][b][c]
  to: 단의 자손들이 그들의 씨족에서, 곧 그들 가운데서 다섯 사람, 곧 유능한 사람들을 소라와 에스다올에서 보내어 그 땅을 정탐하고[a] 살펴보게[b] 하였습니다. 그들이 그들에게 말하였습니다. “가서 그 땅을 살펴보라.” 그래서 그들은 에브라임 산지에 이르러 미가의 집까지[c] 갔으며, 그곳에서 밤을 지냈습니다.
  rationale: 원문의 핵심 동사 ‘보냈다’를 회복하고, 씨족 단위와 그 안에서의 부분 선택이라는 두 표현을 각각 보존했습니다. 직접 인용의 도입을 현대적 합쇼체로 다듬고, 지시 대상과 이동의 범위를 명료하게 했습니다. 각주 표지도 해당 본문 어휘에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:11:04Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘뽑아’는 וַיִּשְׁלְחוּ(‘보냈습니다’)를 ‘선발했다’로 바꾸므로 본문의 직접 서술을 정확히 반영하지 못합니다. 또한 מִמִּשְׁפַּחְתָּם과 מִקְצוֹתָם의 두 부분 표현이 ‘자기 종족 가운데서’ 하나로 합쳐져 약화되었습니다. ‘그들의 씨족에서, 곧 그들 가운데서’로 두 표현을 보존하는 것이 적절합니다. עַד בֵּית־מִיכָה는 ‘미가의 집까지’로 옮기는 것이 자연스럽고 충실합니다.
  naturalness: ‘그들이 그들에게 말하기를’은 현대 표준 한국어 서사에서 부자연스럽습니다. ‘그들에게 말하였습니다’로 고치고 직접 인용문을 이어 주는 편이 자연스럽습니다. ‘자기 종족’보다 ‘그들의 씨족’이 지시 대상도 더 명료합니다.
  terminology: בְּנֵי־חַיִל은 문맥상 용맹만이 아니라 역량·강건함을 포함하므로 ‘유능한 사람들’이 무리 없이 포괄합니다. 지명과 지리 명칭인 ‘소라’, ‘에스다올’, ‘에브라임 산지’ 및 ‘미가의 집’은 적절합니다. 주석 표지는 해당 낱말 또는 구절 바로 뒤에 두어야 합니다.
  issues:
  - severity: medium
    issue: ‘뽑아’가 ‘보냈습니다’를 대체함
    rationale: 원문의 주동사는 וַיִּשְׁלְחוּ, 즉 ‘보냈다’입니다. 선발의 뉘앙스는 מִקְצוֹתָם에 있을 수 있으나, ‘뽑아’가 본문의 ‘보냄’을 대체해서는 안 됩니다.
  - severity: medium
    issue: 씨족과 부분 선택의 표현이 합쳐짐
    rationale: מִמִּשְׁפַּחְתָּם(그들의 씨족에서)과 מִקְצוֹתָם(그들 가운데서/그들의 일부에서)은 별개의 표현입니다. 둘을 번역에 드러내야 합니다.
  - severity: low
    issue: 직접 인용 도입부의 문체가 부자연스러움
    rationale: ‘그들이 그들에게 말하기를’은 고전적인 번역투입니다. 합쇼체 현대 서사에는 ‘그들에게 말하였습니다’가 자연스럽습니다.
  - severity: low
    issue: 각주 표지의 위치가 부정확함
    rationale: 정탐·살펴보다·미가의 집에 관한 각주가 모두 문장 끝에 몰려 있어 해당 어휘와의 연결이 불명확합니다.
