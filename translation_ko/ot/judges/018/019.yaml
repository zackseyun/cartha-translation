  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
  footnotes:
  - marker: a
    text: Or 'Be silent.' The Hebrew imperative can be rendered 'be quiet,' 'keep silent,' or 'be silent.'
    reason: lexical_alternative
  - marker: b
    text: '''Father'' here is a title of social or religious leadership, not a biological relationship.'
    reason: cultural_note
  - marker: c
    text: Or 'family' for 'clan'; the Hebrew term refers to a kinship group within a tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. “조용히 하십시오. 손으로 입을 막고, 우리와 함께 가서, 우리에게 아버지와 제사장이 되십시오. 한 사람의 집의 제사장이 되는 것이 더 낫습니까, 아니면 이스라엘의 한 지파와 한 씨족의 제사장이 되는 것이 더 낫습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲרֵשׁ
  english_pob_choice: Be quiet
  chosen_korean: 조용히 하십시오
  alternatives_korean:
  - 잠잠하십시오
  - 침묵하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형의 ‘말을 멈추라’는 뜻을 현대 한국어의 자연스러운 금지·요청 표현으로 옮겼습니다.
- source_word: שִׂים יָדְךָ עַל פִּיךָ
  english_pob_choice: put your hand over your mouth
  chosen_korean: 손으로 입을 막고
  alternatives_korean:
  - 손을 입에 대고
  - 손을 입 위에 올리고
  lexicon: HALOT
  rationale: 침묵을 뜻하는 몸짓을 한국어 관용에 맞게 간결하게 살리되, 동작의 의미가 분명하도록 옮겼습니다.
- source_word: לְאָב וּלְכֹהֵן
  english_pob_choice: be to us a father and a priest
  chosen_korean: 우리에게 아버지와 제사장이 되십시오
  alternatives_korean:
  - 우리의 아버지와 제사장이 되십시오
  - 우리에게 아버지이자 제사장이 되십시오
  lexicon: HALOT
  rationale: ‘아버지’는 혈연이 아니라 사회·종교적 지도자 직함이므로, 직역을 유지해 그 제목성을 드러냈습니다.
- source_word: לְבֵית אִישׁ אֶחָד
  english_pob_choice: to the house of one man
  chosen_korean: 한 사람의 집의
  alternatives_korean:
  - 한 사람의 가문의
  - 한 사람의 집안의
  lexicon: HALOT
  rationale: בַּיִת의 기본적 가정/가구 의미를 살리기 위해 ‘집’을 유지했고, 소유 관계는 한국어 속격으로 반영했습니다.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  english_pob_choice: to a tribe and a clan in Israel
  chosen_korean: 이스라엘의 한 지파와 한 씨족의
  alternatives_korean:
  - 이스라엘의 한 지파와 한 가족의
  - 이스라엘의 한 지파와 한 가문의
  lexicon: HALOT
  rationale: שֵׁבֶט는 ‘지파’, מִשְׁפָּחָה는 지파 아래의 친족 집단이므로 ‘씨족’이 ‘가족’보다 구조를 더 정확히 드러냅니다.
theological_decisions:
- issue: ‘아버지’의 직함 의미
  chosen_reading: 생물학적 아버지가 아니라 보호자·지도자 성격의 호칭으로 그대로 ‘아버지’를 유지했습니다.
  alternative_readings:
  - 지도자
  - 후견인
  - 보호자
  rationale: 본문은 ‘아버지’와 ‘제사장’을 병렬로 두어 사회·종교적 권위를 함께 요청하므로, 해석어로 좁히지 않고 원어의 직함성을 보존하는 편이 투명합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
