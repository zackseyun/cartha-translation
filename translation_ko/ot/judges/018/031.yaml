  rationale: שׂים의 설치·배치 의미를 살리되, 우상에 대한 문맥에서는 ‘세워 놓다’가 예배용으로 설치했다는 뉘앙스를 자연스럽게 드러냅니다.
- source_word: פֶּסֶל
  english_pob_choice: carved image
  chosen_korean: 새긴 우상
  alternatives_korean:
  - 조각한 형상
  - 새긴 형상
  lexicon: HALOT
  rationale: פֶּסֶל은 단순한 형상보다 우상적 기능을 띠는 조형물을 가리키므로, POB의 ‘carved image’를 따라 ‘새긴 우상’으로 옮겨 구체성과 기능을 함께 살렸습니다.
- source_word: אֲשֶׁר עָשָׂה
  english_pob_choice: that he had made
  chosen_korean: 그가 만든 것이었습니다
  alternatives_korean:
