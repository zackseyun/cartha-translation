  lexicon: HALOT
  rationale: 히브리어 표현을 가장 सीधे하게 반영해 ‘하나님의 집’으로 옮겼고, 제도화된 성전 해석을 덧붙이지 않아 본문이 지닌 긴장을 유지했습니다.
theological_decisions:
- issue: 실로의 מרכז 예배처를 지칭하는 בֵּית הָאֱלֹהִים의 번역
  chosen_reading: 하나님의 집
  alternative_readings:
  - 하나님의 성소
  - 하나님의 집(성소)
  rationale: 본문은 단지 합법적 예배처의 존재를 진술할 뿐이므로, 해석을 과도하게 덧붙이지 않고 원문 표현을 그대로 살렸습니다. 이는 단 지파의 우상 숭배와 실로의 정당한 예배처가 병치되는 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
