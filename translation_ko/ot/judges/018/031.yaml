    text: 또는 ‘우상’. 히브리어는 새긴 예배 형상을 가리킵니다. ‘새긴 형상’은 그 구체적인 조형적 의미를 보존하고, ‘우상’은 그 기능을 더 분명히 드러냅니다.
    reason: lexical_alternative
