  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
  footnotes:
  - marker: a
    text: Or 'idol.' The Hebrew term refers to a carved cult image; 'carved image' preserves the concrete sense, while 'idol' makes the function more explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하나님의 집이 실로에 있는 동안 내내 미가가 만든 새긴 형상을 자기들을 위해 세워 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
