  - 그가 만든 것인데
  lexicon: HALOT
  rationale: 관계절을 자연스러운 종결형으로 풀어 한국어의 서술 흐름에 맞추되, 미가가 먼저 만든 뒤 그것을 세웠다는 선후 관계는 유지했습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
