  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
  footnotes:
  - marker: a
    text: Or 'idol.' The Hebrew term refers to a carved cult image; 'carved image' preserves the concrete sense, while 'idol' makes the function more explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 미가의 새긴 우상을 자기들을 위해 세워 놓았는데, 그것은 그가 만든 것이었습니다. 그들이 하나님의 집이 실로에 있는 동안 내내 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상.’ 히브리어는 새긴 예배 형상을 가리키며, ‘새긴 우상’은 그 구체적 형상을 살리고 ‘우상’은 기능을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  english_pob_choice: they set up for themselves
  chosen_korean: 자기들을 위해 세워 놓았는데
  alternatives_korean:
  - 자기들을 위해 세웠는데
  - 자기들을 위해 두었는데
