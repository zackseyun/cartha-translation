  language: ko
  text: 땅을 정탐하러 갔던 그 다섯 사람이 올라가 그곳에 이르러, 새긴 신상과 에봇과 드라빔[1]과 부어 만든 신상[2]을 가져갔습니다. 제사장은 전쟁 무기를 갖춘 육백 명과 함께 성문 어귀에 서 있었습니다.
