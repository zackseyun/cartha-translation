  terminology: פסל은 ‘새긴 신상’, תרפים은 음역 ‘드라빔’(각주로 설명), מסכה는 제작 방식을 드러내는 ‘부어 만든 신상’으로 옮기는 것이 각각의 물건을 구별하는 원문에 더 충실합니다. ‘에봇’은 유지합니다.
