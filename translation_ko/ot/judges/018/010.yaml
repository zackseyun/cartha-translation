source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
  footnotes:
  - marker: a
    text: Or 'a people dwelling securely' or 'an unsuspecting people.' The Hebrew describes a people living in a sense of safety.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'broad of hands,' a Hebrew idiom for a spacious land.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 들어가면 안전하게 사는 백성을[a] 만나게 될 것이며, 그 땅은 넓습니다.[b] 하나님께서 그것을 너희 손에 주셨으니, 그곳은 그 땅에 있는 어떤 것도 부족하지 않은 곳입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평안히 사는 백성’ 또는 ‘경계하지 않는 백성’. 히브리어는 안전하다고 여기며 사는 백성을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손이 넓은’. 히브리어 관용구로 넓은 땅을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/בֹאֲ/כֶם ... תָּבֹאוּ
  english_pob_choice: When you go, you will come
  chosen_korean: 너희가 들어가면
  alternatives_korean:
  - 너희가 갈 때 너희는 이르러
  - 너희가 가면 너희는 들어가
  lexicon: HALOT
  rationale: 원문의 ‘갈 때/들어갈 때’와 ‘이르다’의 진행·도착 감각을 자연스럽게 살리되, 한국어에서는 중복을 줄여 간결하게 옮겼습니다.
- source_word: עַם בֹּטֵחַ
  english_pob_choice: a secure people
  chosen_korean: 안전하게 사는 백성
  alternatives_korean:
  - 안전한 백성
  - 평안히 사는 백성
  - 경계하지 않는 백성
  lexicon: HALOT
  rationale: בֹּטֵחַ는 단순한 ‘믿음’보다 안전과 안심의 상태를 가리키므로, 문맥에 맞게 ‘안전하게 사는’으로 풀어 옮겼습니다.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  english_pob_choice: and the land is broad
  chosen_korean: 그 땅은 넓습니다
  alternatives_korean:
  - 그 땅은 광활합니다
  - 그 땅은 손이 넓습니다
  - 그 땅은 공간이 넉넉합니다
  lexicon: HALOT
  rationale: ‘넓은 손’의 관용구는 직역보다 의미가 분명한 ‘넓다’가 적절하므로, 이미지 과잉 없이 자연스러운 현대 한국어로 처리했습니다.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  english_pob_choice: for God has given it into your hand
  chosen_korean: 하나님께서 그것을 너희 손에 주셨으니
  alternatives_korean:
  - 하나님께서 그것을 너희 손에 이미 주셨으니
  - 하나님께서 그것을 너희의 손 안에 주셨으니
  lexicon: HALOT
  rationale: 완료형의 확정성을 살려 ‘주셨으니’로 옮겼고, ידכם의 관용 표현은 한국어에서도 ‘너희 손에’로 자연스럽게 유지했습니다.
- source_word: אֲשֶׁר אֵין שָׁם מַחְסוֹר כָּל דָּבָר ... בָּאָרֶץ
  english_pob_choice: a place where there is no lack of anything that is in the land
  chosen_korean: 그 땅에 있는 어떤 것도 부족함이 없는 곳입니다
  alternatives_korean:
  - 그곳에는 땅에 있는 어떤 것 하나도 부족함이 없습니다
  - 그곳에는 그 땅의 어떤 것도 모자람이 없습니다
  lexicon: HALOT
  rationale: מַחְסוֹר의 ‘부족/결핍’ 의미를 살리되, 반복을 줄여 한 문장으로 매끄럽게 정리했습니다. ‘그 땅에 있는’은 문맥상 특정 영토를 가리키는 뜻을 유지합니다.
