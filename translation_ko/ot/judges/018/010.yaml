  - 하나님들
  rationale: 여기서는 단수 동사와 함께 섭리적 행위의 주체로 쓰이므로, 한국어에서도 단수 신칭인 ‘하나님’이 문맥에 맞습니다.
  doctrine_reference: 원어 우선 원칙; 문맥상 단수 신칭 유지
