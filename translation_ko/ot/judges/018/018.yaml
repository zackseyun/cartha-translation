  - severity: medium
    issue: פֶּסֶל의 제작 방식이 누락됨
    rationale: 단순한 ‘우상’ 대신 ‘새긴 우상’으로 옮겨 פֶּסֶל과 주조상 מַסֵּכָה의 구별을 보존해야 합니다.
