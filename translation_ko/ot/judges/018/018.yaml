- from: 그들이 미가의 집에 들어가 우상과 에봇과 집신상과 부조상을 취하매 제사자가 그들에게 말하되 너희가 무엇을 하느냐 하매
  to: 그 사람들이 미가의 집에 들어가서 새긴 우상과 에봇과 드라빔[a]과 부어 만든 우상을 가져갔습니다. 그러자 제사장이 그들에게 말했습니다. “너희는 무엇을 하고 있습니까?”
