id: JDG.18.9
reference: Judges 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ ק֚וּמָ/ה וְ/נַעֲלֶ֣ה עֲלֵי/הֶ֔ם כִּ֤י רָאִ֨ינוּ֙ אֶת הָ/אָ֔רֶץ וְ/הִנֵּ֥ה טוֹבָ֖ה מְאֹ֑ד וְ/אַתֶּ֣ם מַחְשִׁ֔ים אַל תֵּעָ֣צְל֔וּ לָ/לֶ֥כֶת לָ/בֹ֖א לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: ko
  text: 그들이 말했습니다. “일어나서 그들에게로 올라갑시다. 우리가 그 땅을 보았는데, 보십시오, 매우 좋습니다. 그런데 여러분은 잠자코 있습니다. 가서, 들어가서, 그 땅을 차지하는 데 게으르지 마십시오.”
  philosophy: formal
lexical_decisions:
- source_word: קוּמָה
  english_pob_choice: Rise up
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나십시오
  - 일어서십시오
  lexicon: WLC imperative
  rationale: 출발을 촉구하는 명령형으로, 문맥상 단순한 기상보다 행동 개시를 드러내는 ‘일어나서’가 자연스럽습니다.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  english_pob_choice: let us go up against them
  chosen_korean: 그들에게로 올라갑시다
  alternatives_korean:
  - 그들에게 올라갑시다
  - 그들을 치러 올라갑시다
  lexicon: WLC עלה + על
  rationale: עלה의 ‘올라가다’와 대상을 향한 접근을 살려 직역하되, 전투적 뉘앙스는 문맥이 충분히 드러내므로 과도하게 보강하지 않았습니다.
- source_word: מַחְשִׁים
  english_pob_choice: keeping silent
  chosen_korean: 잠자코 있습니다
  alternatives_korean:
  - 가만히 있습니다
  - 침묵하고 있습니다
  lexicon: WLC חשׁה
  rationale: ‘침묵하다’의 상태를 자연스러운 현대 한국어로 옮겨, 책망의 뉘앙스를 유지했습니다.
- source_word: אַל תֵּעָצְל֔וּ
  english_pob_choice: do not be sluggish
  chosen_korean: 게으르지 마십시오
  alternatives_korean:
  - 주저하지 마십시오
  - 나태해지지 마십시오
  lexicon: WLC עצל
  rationale: 게으름/나태함의 직접적 경고를 살려, 행동 지연에 대한 책망을 분명히 했습니다.
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ
  english_pob_choice: to take possession of the land
  chosen_korean: 그 땅을 차지하는 데
  alternatives_korean:
  - 그 땅을 차지하기 위해
  - 그 땅을 소유하는 데
  lexicon: WLC ירשׁ
  rationale: ירשׁ는 단순 소유보다 ‘차지하다/상속받다’의 강한 점유 의미가 있어, 문맥상 ‘차지하다’가 가장 직접적입니다.
theological_decisions:
- issue: 정복/점유 명령의 강한 군사적 어조
  chosen_reading: 문맥의 공격성과 촉구를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 부드럽게 ‘가서 얻으라’로 완화
  - ‘진격하라’처럼 군사 용어를 명시
  rationale: 본절은 정찰 보고 뒤의 집단적 진군 촉구로, 원문의 긴박성과 점유 명령을 그대로 드러내는 것이 본문 의도에 충실합니다.
  doctrine_reference: 서술 본문 해석 원칙
- issue: ‘그들에게로 올라갑시다’의 전투적 방향성
  chosen_reading: עלה의 기본 방향 의미를 유지하고, 전투성은 문맥에서 읽히도록 두었습니다.
  alternative_readings:
  - ‘그들을 치러 올라갑시다’로 명시
  - ‘그들에게 공격하러 가자’로 풀어씀
  rationale: 히브리어 동사의 핵심 의미를 보존하면서도, 이미 앞뒤 문맥이 정복/공격 상황이므로 과잉 해설을 피했습니다.
  doctrine_reference: 원문 밀착 번역 원칙
