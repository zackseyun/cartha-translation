  source_fidelity: 핵심 서술과 물품 목록은 대체로 원문에 충실합니다. 다만 פֶּסֶל과 מַסֵּכָה에 모두 ‘우상’을 덧붙이면 ‘형상’이라는 원문의 구체적 조형물 명칭에 해석을 더하게 됩니다. 또한 마지막 권고는 ‘무엇을 하실지 아십시오’보다 원문의 2인칭 복수 명령을 자연스럽게 보존하는 표현으로 고칠 필요가 있습니다.
  naturalness: ‘대답하며 … 말했습니다’와 ‘무엇을 하실지 아십시오’는 현대 한국어에서 다소 부자연스럽습니다. ‘대답하여 말했습니다’와 ‘무엇을 할지 알아 두십시오’가 합쇼체 문체에서 더 자연스럽습니다.
