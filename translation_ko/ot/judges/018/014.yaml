  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
  footnotes:
  - marker: a
    text: Or 'teraphim'; the Hebrew term refers to household cult images or household gods.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'molten image' for 'cast image.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 라이스 땅을 정탐하러 갔던 다섯 사람이 대답하며 자기 형제들에게 말했습니다. “이 집들에 에봇과 드라빔과 새긴 우상과 부어 만든 우상이 있는 것을 아십니까? 그러니 이제 무엇을 하실지 아십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  english_pob_choice: answered and said
  chosen_korean: 대답하며 ... 말했습니다
  alternatives_korean:
  - 응답하며 ... 말했습니다
  - 대답하여 ... 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 공식인 ‘대답하다/말하다’의 연속을 살리면서, 현대 한국어에서는 자연스러운 연결형으로 옮겼습니다.
- source_word: אֶל אֲחֵיהֶם
  english_pob_choice: to their brothers
  chosen_korean: 자기 형제들에게
  alternatives_korean:
  - 자기 형제들에게
  - 그들의 형제들에게
  - 동족들에게
  lexicon: HALOT
  rationale: 직역상 ‘형제들’이 맞고, 문맥상 같은 무리의 남자들을 가리키므로 완곡한 집합어보다 직접적인 표현을 택했습니다.
- source_word: תְּרָפִים
  english_pob_choice: teraphim
  chosen_korean: 드라빔
  alternatives_korean:
  - 테라핌
  - 가정 우상
  lexicon: HALOT
  rationale: 히브리어 고유 용어를 음역하되, 한국어 성경 전통과 현대 표기를 함께 고려해 ‘드라빔’으로 옮겼습니다. 본문의 구체적 물건 목록을 흐리지 않기 위해 의미 확장 번역은 피했습니다.
- source_word: פֶּסֶל
  english_pob_choice: a carved image
  chosen_korean: 새긴 우상
  alternatives_korean:
  - 조각한 형상
  - 새긴 형상
  - 조각 우상
  lexicon: HALOT
  rationale: פֶּסֶל은 손으로 새겨 만든 형상을 가리키므로, ‘형상’보다 예배 금지 맥락이 드러나는 ‘우상’을 붙여 문맥 의미를 살렸습니다.
- source_word: מַסֵּכָה
  english_pob_choice: a cast image
  chosen_korean: 부어 만든 우상
  alternatives_korean:
  - 주조한 우상
  - 녹여 만든 우상
  - 부어 만든 형상
  lexicon: HALOT
  rationale: 전통적 ‘부어 만든’ 표현은 다소 고전적이지만, 히브리어의 ‘주조/붓다’ 의미를 직접 드러내며 본문 상의 다른 형상들과 구별해 줍니다.
- source_word: מַה תַּעֲשׂוּ
  english_pob_choice: what you will do
  chosen_korean: 무엇을 하실지
  alternatives_korean:
  - 무엇을 하실지
  - 어떻게 하실지
  - 무엇을 할지
  lexicon: HALOT
  rationale: 명령형적 권고를 한국어에서는 상대 높임으로 자연스럽게 옮겼습니다. 문맥상 실제 명령이라기보다 결단을 촉구하는 말투이므로 ‘하실지’를 택했습니다.
theological_decisions:
- issue: 본절의 우상 목록을 어떻게 옮길지
  chosen_reading: ‘에봇과 드라빔과 새긴 우상과 부어 만든 우상’처럼 서로 다른 히브리어 용어를 구분해 유지했습니다.
  alternative_readings:
  - ‘에봇, 가정 우상, 새긴 우상, 부어 만든 우상’
  - ‘에봇, 드라빔, 조각 우상, 주조 우상’
  rationale: 본문은 미가 집의 예배용 물품들을 구체적으로 열거하므로, 하나로 뭉개지지 않도록 각 항목의 구별을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 자기 형제들에게라는 직접 호칭의 문체
  chosen_reading: 남성 무리 안의 대화로 보고 ‘자기 형제들에게’로 직역했습니다.
  alternative_readings:
  - 그들의 동료들에게
  - 그들의 일행에게
  rationale: 문맥상 다섯 정탐꾼이 동료 남성들에게 말하는 장면이므로, 성별과 친족 관계를 완화하지 않고 그대로 드러내는 편이 원문 이해에 더 가깝습니다.
  doctrine_reference: Translation philosophy §4
