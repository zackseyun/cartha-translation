translation:
  language: ko
  text: 그리고 군사 장비를 갖춘 육백 명의 남자가 있었는데, 그들은 성문 어귀에 서 있었습니다. 이들은 단의 자손들 가운데서 나온 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘단의 자손들 가운데서 나온 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  english_pob_choice: And six hundred men
  chosen_korean: 육백 명의 남자
  alternatives_korean:
  - 육백 명의 사람
  - 육백 명의 용사
  lexicon: HALOT
  rationale: 숫자 뒤의 אִישׁ는 집합적으로 사람들을 가리키므로 자연스러운 현대 한국어인 ‘남자’를 택했으며, 전쟁 서사 맥락에서 ‘용사’는 해석을 덧붙일 수 있어 피했습니다.
- source_word: חֲגוּרִים כְּלֵי מִלְחַמְתָּם
  english_pob_choice: armed with their weapons of war
  chosen_korean: 군사 장비를 갖춘
  alternatives_korean:
  - 전쟁 무기를 띠고 있는
  - 전쟁 무장을 갖춘
  lexicon: HALOT
  rationale: 직역하면 ‘띠를 두른/무장한’이지만, 여기서는 무기와 전투 장비를 갖춘 상태를 가리키므로 현대 독자가 바로 이해할 수 있게 군사적 준비 상태를 드러냈습니다.
- source_word: נִצָּבִים פֶּתַח הַשָּׁעַר
  english_pob_choice: were standing at the entrance of the gate
  chosen_korean: 성문 어귀에 서 있었습니다
  alternatives_korean:
  - 문 어귀에 서 있었습니다
  - 성문 입구에 서 있었습니다
  lexicon: HALOT
  rationale: פֶּתַח는 ‘입구/어귀’이므로 ‘어귀’로 살렸고, הַשָּׁעַר는 도시의 성문을 가리키는 문맥상 ‘성문’이 가장 분명합니다.
- source_word: אֲשֶׁר מִ/בְּנֵי דָן
  english_pob_choice: these were from the sons of Dan
  chosen_korean: 이들은 단의 자손들 가운데서 나온 사람들이었습니다
  alternatives_korean:
  - 이들은 단 자손이었습니다
  - 이들은 단의 자손들로서
  lexicon: HALOT
  rationale: 히브리어의 יחס절은 단순 동족 표지이므로 ‘가운데서 나온 사람들’로 풀어 원문의 출신 표시를 살리되, POB의 ‘sons of Dan’에 대응해 ‘단의 자손들’을 유지했습니다.
theological_decisions:
- issue: 단 지파 소속 표지의 번역
  chosen_reading: ‘단의 자손들 가운데서 나온 사람들’로 번역해 혈통/소속 표지를 그대로 드러냈습니다.
  alternative_readings:
  - ‘단 사람들’
  - ‘단인들’
  rationale: 본문은 군대의 정체를 지리적·민족적 표지가 아니라 족속 소속으로 밝히므로, 전통적 교회 용어로 평준화하지 않고 출신 표지를 보존했습니다.
  doctrine_reference: 서사적 족보/지파 표지의 보존 원칙
