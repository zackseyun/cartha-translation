  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ בְּנֵי דָ֔ן אַל תַּשְׁמַ֥ע קוֹלְ/ךָ֖ עִמָּ֑/נוּ פֶּֽן יִפְגְּע֣וּ בָ/כֶ֗ם אֲנָשִׁים֙ מָ֣רֵי נֶ֔פֶשׁ וְ/אָסַפְתָּ֥ה נַפְשְׁ/ךָ֖ וְ/נֶ֥פֶשׁ בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
  footnotes:
  - marker: a
    text: Or 'fierce men,' 'desperate men,' or 'men of bitter spirit' for 'men bitter of soul.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Do not let your voice be heard among us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 단 사람들이 그에게 말했습니다. 「우리 가운데서 네 목소리가 들리지 않게 하십시오. 그렇지 않으면 사나운 마음을 지닌 사람들이 너희에게 달려들어, 네 목숨과 네 집안의 생명을 잃게 될 것입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 목소리가 우리 가운데 들리지 않게 하라’입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּנֵי דָן
  english_pob_choice: the sons of Dan
  chosen_korean: 단 사람들
  alternatives_korean:
  - 단의 아들들
  - 단 지파 사람들
  lexicon: HALOT
  rationale: 히브리어 친족표현을 그대로 옮기되, 한국어에서 자연스럽고 지파 소속을 분명히 드러내는 표현으로 처리했습니다.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  english_pob_choice: Do not let your voice be heard among us
  chosen_korean: 우리 가운데서 네 목소리가 들리지 않게 하십시오
  alternatives_korean:
  - 우리 가운데서 네 소리가 들리지 않게 하십시오
  - 우리 가운데서 네 말을 하지 마십시오
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘목소리가 들리다’를 살리면서, 한국어 경고문으로 자연스럽게 들리도록 옮겼습니다.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  english_pob_choice: men bitter of soul
  chosen_korean: 사나운 마음을 지닌 사람들
  alternatives_korean:
  - 마음이 쓰린 사람들
  - 영이 격한 사람들
  - 한 맺힌 사람들
  lexicon: HALOT
  rationale: 직역상 ‘영혼이 쓰다’는 한국어에서 어색하므로, 위험하고 격앙된 사람들을 가리키는 뜻을 살려 옮겼습니다. POB의 해석 여지를 반영했습니다.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ וְנֶפֶשׁ בֵּיתֶךָ
  english_pob_choice: and you lose your life and the lives of your household
  chosen_korean: 네 목숨과 네 집안의 생명을 잃게 될 것입니다
  alternatives_korean:
  - 네 생명과 네 집안의 생명을 잃게 될 것입니다
  - 네 목숨과 네 집안 식구들의 목숨을 잃게 될 것입니다
  lexicon: HALOT
  rationale: אַסַף + נֶפֶשׁ의 관용적 의미를 따라 ‘목숨을 잃다’로 옮겼고, 집합적 표현인 ‘집안의 생명’을 자연스럽게 풀었습니다.
