source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
  footnotes:
  - marker: a
    text: Or 'to their kinsmen'; Hebrew 'their brothers' can refer to fellow clan or tribal relatives, not only literal siblings.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew question is very brief and elliptical, literally 'What, you?'—an idiomatic inquiry likely asking for their report or situation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 소라와 에스다올에 있는 자기들의 형제들에게 갔습니다. 그러자 자기들의 형제들이 그들에게 말했습니다. “무슨 일입니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 이곳에서 문자적 형제만이 아니라 같은 지파의 친족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 질문은 매우 간단한 엘립시스 표현으로, 문맥상 그들의 소식이나 사정을 묻는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֲחֵיהֶם
  english_pob_choice: to their brothers
  chosen_korean: 자기들의 형제들에게
  alternatives_korean:
  - 자기들의 친족들에게
  - 자기들의 동족들에게
  lexicon: HALOT
  rationale: אָח는 문자 그대로 형제를 뜻하지만, 이 문맥에서는 지파 내 친족을 가리킬 수 있으므로 POB의 영어 선택을 따라 직역성을 살리되 한국어에서는 자연스럽게 '형제들'로 옮겼습니다.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  english_pob_choice: Zorah and Eshtaol
  chosen_korean: 소라와 에스다올
  alternatives_korean:
  - 조라와 에스다올
  - 소라와 에스드올
  lexicon: 실명 표기 관례
  rationale: 지명은 의미 번역보다 음역이 적절하므로 한국어 성경에서 널리 쓰이는 표기를 반영했습니다.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם מָה אַתֶּם
  english_pob_choice: and their brothers said to them, “What is with you?”
  chosen_korean: 그러자 자기들의 형제들이 그들에게 말했습니다. “무슨 일입니까?”
  alternatives_korean:
  - 그러자 자기들의 형제들이 그들에게 말했습니다. “당신들은 어떻습니까?”
  - 그러자 자기들의 형제들이 그들에게 말했습니다. “무슨 일이 있습니까?”
  lexicon: HALOT
  rationale: מָה אַתֶּם은 매우 짧고 생략적인 질문이므로, 한국어에서는 문맥상 상황 보고를 요구하는 뜻을 살려 '무슨 일입니까?'로 옮겼습니다. 영어 POB의 'What is with you?'가 반영한 엘립시스도 유지합니다.
