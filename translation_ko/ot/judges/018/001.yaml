revisions:
- from: 그때 이스라엘에는 왕이 없었습니다[a]. 그때 단 지파는 거주할 유업을 자신들을 위해 찾고 있었는데[b], 그때까지 이스라엘의 지파들 가운데서 그들에게는 아직 유업이 하나도 떨어지지 않았기 때문입니다.
  to: 그 무렵 이스라엘에는 왕이 없었습니다. 그 무렵 단 지파는 자기들이 거주할 유업을 찾고 있었습니다[a]. 그때까지 이스라엘 지파들 가운데서 유업으로 받을 땅이 아직 그들에게 돌아가지 않았기 때문입니다.
  rationale: 잘못된 대안 각주를 삭제하고, 남은 각주를 ‘유업’의 문맥상 의미를 설명하도록 정정했습니다. 본문은 반복 시간 표지, 진행 중인 탐색, 그리고 토지 유업이 아직 배정되지 않았다는 인과관계를 현대 표준 합쇼체로 자연스럽게 보존하도록 다듬었습니다.
