base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
  footnotes:
  - marker: a
    text: Or 'the tribe of Dan.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'no inheritance had fallen to it,' an idiom referring to the allotment of tribal land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무렵 이스라엘에는 왕이 없었습니다. 그 무렵 단 지파는 자기들이 거주할 유업을 찾고 있었습니다[a]. 그때까지 이스라엘 지파들 가운데서 유업으로 받을 땅이 아직 그들에게 돌아가지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유업’은 여기서 지파에 배정되는 토지의 몫을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ
  english_pob_choice: there was no king
  chosen_korean: 왕이 없었습니다
  alternatives_korean:
  - 왕이 있지 않았습니다
  - 그 나라에는 왕이 없었습니다
  lexicon: HALOT
  rationale: 존재 부정의 직접적 진술을 한국어 자연문으로 옮기되, 원문의 간결한 정치적 진술을 유지했습니다.
- source_word: שֵׁבֶט הַדָּנִי
  english_pob_choice: the tribe of the Danites
  chosen_korean: 단 지파
  alternatives_korean:
