  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
  footnotes:
  - marker: a
    text: Or 'the tribe of Dan.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'no inheritance had fallen to it,' an idiom referring to the allotment of tribal land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘에는 왕이 없었습니다[a]. 그때 단 지파는 거주할 유업을 자신들을 위해 찾고 있었는데[b], 그때까지 이스라엘의 지파들 가운데서 그들에게는 아직 유업이 하나도 떨어지지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '단 지파에는 왕이 없었습니다.'
    reason: alternative_reading
  - marker: b
    text: 직역하면 '거할 유업을 찾고 있었습니다'이며, כאן의 유업은 지파의 땅 분배를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ
  english_pob_choice: there was no king
  chosen_korean: 왕이 없었습니다
  alternatives_korean:
  - 왕이 있지 않았습니다
  - 그 나라에는 왕이 없었습니다
  lexicon: HALOT
  rationale: 존재 부정의 직접적 진술을 한국어 자연문으로 옮기되, 원문의 간결한 정치적 진술을 유지했습니다.
- source_word: שֵׁבֶט הַדָּנִי
  english_pob_choice: the tribe of the Danites
  chosen_korean: 단 지파
  alternatives_korean:
  - 단 사람들의 지파
  - 단의 지파
  lexicon: HALOT
  rationale: 지파 집단을 가리키는 관용적 표현으로 간명하게 옮겼고, 영어 POB의 집합적 의미도 유지했습니다.
- source_word: מְבַקֶּשׁ ל֤וֹ נַחֲלָה לָשֶׁבֶת
  english_pob_choice: was seeking for itself an inheritance to dwell in
  chosen_korean: 거주할 유업을 자신들을 위해 찾고 있었는데
  alternatives_korean:
  - 살아갈 몫을 찾고 있었는데
  - 거할 땅을 구하고 있었는데
  lexicon: HALOT
  rationale: נַחֲלָה를 지파 분배 맥락의 '유업'으로 살리고, לָשֶׁבֶת의 정착 의미를 '거주할'로 반영했습니다.
- source_word: כִּי לֹא נָפְלָה לּוֹ
  english_pob_choice: because ... no inheritance had fallen to it
  chosen_korean: 아직 유업이 하나도 떨어지지 않았기 때문입니다
  alternatives_korean:
  - 아직 유업을 받지 못했기 때문입니다
  - 아직 몫이 주어지지 않았기 때문입니다
  lexicon: HALOT
  rationale: '''떨어지다''는 히브리어 נפל이 유업/분깃이 ''떨어지다''는 관용을 살려, 분배된 땅의 몫이 아직 주어지지 않았다는 뜻을 드러냅니다.'
theological_decisions:
- issue: 반복되는 공식 '이스라엘에는 왕이 없었습니다'의 의미
  chosen_reading: 역사·정치적 진술로 그대로 살리고, 왕정 부재에 대한 해석을 번역문에 덧붙이지 않았습니다.
  alternative_readings:
  - 암묵적 비판을 더 강하게 드러내는 번역
  - 단순한 연대기적 메모로만 처리하는 번역
  rationale: 사사기의 반복 공식이 가진 긴장을 보존해야 하므로, 본문 자체가 말하는 것 이상으로 신학적 판단을 앞서 결론내리지 않았습니다.
  doctrine_reference: 본문의 신학적 긴장 보존
