  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֥מָּה הִרְחִ֖יקוּ מִ/בֵּ֣ית מִיכָ֑ה וְ/הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר בַּ/בָּתִּים֙ אֲשֶׁר֙ עִם בֵּ֣ית מִיכָ֔ה נִֽזְעֲק֔וּ וַ/יַּדְבִּ֖יקוּ אֶת בְּנֵי דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
  footnotes:
  - marker: a
    text: Or 'raised the alarm' for 'were called together.' The Hebrew verb can suggest either a cry of alarm or the gathering that results from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 미가의 집에서 좀 떨어져 갔을 때, 미가의 집 근처의 집들에 있던 사람들이 모여들었고, 그들이 단 지파 사람들을 따라잡았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִרְחִיקוּ
  english_pob_choice: had gone some distance
  chosen_korean: 좀 떨어져 갔을 때
  alternatives_korean:
  - 멀리 갔을 때
  - 거리를 두고 갔을 때
  lexicon: HALOT
  rationale: 거리 이동의 결과를 자연스러운 한국어 진행 표현으로 살리되, 원문의 ‘멀어짐’ 의미를 유지했습니다.
- source_word: נִזְעֲקוּ
  english_pob_choice: were called together
  chosen_korean: 모여들었고
  alternatives_korean:
  - 소집되었고
  - 경보를 울렸고
  lexicon: HALOT
  rationale: 이 동사는 경보의 외침과 그에 따른 집결을 함께 함축하므로, 이 문맥에서는 이웃들이 급히 모여든 결과를 간결하게 드러냈습니다.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  english_pob_choice: who were in the houses near Micah’s house
  chosen_korean: 미가의 집 근처의 집들에 있던 사람들
  alternatives_korean:
  - 미가의 집과 함께 있는 집들에 있던 사람들
  - 미가의 집 주변 집들에 있던 사람들
  lexicon: HALOT
  rationale: 직역하면 다소 어색한 구조라서, 인접성 관계를 나타내는 ‘근처의 집들’로 옮겨 문맥상의 뜻을 분명히 했습니다.
- source_word: וַיַּדְבִּיקוּ
  english_pob_choice: and they overtook
  chosen_korean: 따라잡았습니다
  alternatives_korean:
  - 추격하여 붙잡았습니다
  - 뒤쫓아 따라붙었습니다
  lexicon: HALOT
  rationale: ‘따라잡다’가 추격 끝에 뒤쫓는 대상에 이르는 의미를 가장 자연스럽게 전달합니다.
