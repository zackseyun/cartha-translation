  source_fidelity: 초안은 이동 거리, 미가의 집 주변에 있던 사람들, 그리고 단 자손들을 따라잡은 사건의 순서를 대체로 충실히 옮겼습니다. 그러나 נִזְעֲקוּ는 단순히 자발적으로 ‘모여들었다’기보다 소집되었거나 외쳐 경보를 발한 것으로도 해석될 수 있으므로, 본문에서는 수동적 집결을 나타내고 주석으로 대안을 보존하는 편이 더 적절합니다.
