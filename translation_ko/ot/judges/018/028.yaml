  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: ko
  text: 그들을 구해 줄 자가 없었습니다. 그 성이 시돈에서 멀리 떨어져 있었고, 그들은 누구와도 교류하지 않았습니다. 그 성은 벧르홉에 속한 골짜기에 있었습니다[a]. 그들은 그 성을 다시 세우고 그곳에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벧르홉 근처의 골짜기’. 히브리어 표현은 타원적이며, 전치사는 소속뿐 아니라 근접을 나타낼 수도 있습니다.
    reason: 히브리어 אֲשֶׁר לְבֵית־רְחוֹב의 전치사 לְ는 소속 관계 또는 근접 관계로 이해될 수 있어, 본문의 지리적 관계에 대한 대안적 해석을 보존합니다.
