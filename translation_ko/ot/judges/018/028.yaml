  source_fidelity: 초안은 시돈에서 멀었다는 점과 구원자가 없었다는 큰 흐름을 담고 있으나, וְדָבָר אֵין לָהֶם עִם אָדָם(‘그들이 누구와도 교류/거래가 없었다’)를 ‘그들과 함께 할 사람이 없었다’로 옮겨 의미가 달라졌습니다. 또한 ‘벧레호브 골짜기’는 ‘벧르홉에 속한 골짜기’라는 히브리어의 관계를 충분히 반영하지 못합니다.
