  to: 그들을 구해 줄 자가 없었습니다. 그 성이 시돈에서 멀리 떨어져 있었고, 그들은 누구와도 교류하지 않았습니다. 그 성은 벧르홉에 속한 골짜기에 있었습니다[a]. 그들은 그 성을 다시 세우고 그곳에 살았습니다.
