base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: ko
  text: 그때 단 자손들이 자기들의 길을 갔습니다. 미가는 그들이 자기보다 강하다는 것을 보고 몸을 돌려 자기 집으로 돌아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  english_pob_choice: the sons of Dan
  chosen_korean: 단 자손들
  alternatives_korean:
  - 단 사람들
  - 단 지파 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족적·지파적 표현을 살려 직역에 가깝게 옮겼습니다. '단 자손들'은 POB의 'sons of Dan'을 한국어로 투명하게 반영합니다.
- source_word: לְדַרְכָּם
  english_pob_choice: went on their way
  chosen_korean: 자기들의 길을 갔습니다
  alternatives_korean:
  - 길을 따라 갔습니다
  - 계속 길을 갔습니다
  lexicon: HALOT
  rationale: '''길/דרך''의 이미지를 살리면서도 현대 한국어로 자연스럽게 이어지도록 옮겼습니다.'
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  english_pob_choice: they were stronger than he was
  chosen_korean: 그들이 자기보다 강하다는 것을
  alternatives_korean:
  - 그들이 자기보다 더 강하다는 것을
  - 그가 그들보다 약하다는 것을
  lexicon: HALOT
  rationale: 비교 구문을 '강하다'로 직접 살리고, 'מן'의 비교 관계를 한국어 '보다'로 표현했습니다. 미가의 상대적 열세를 분명히 드러냅니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his house
  chosen_korean: 자기 집
  alternatives_korean:
  - 그의 집
  - 집
  lexicon: HALOT
  rationale: '''집''이 בית의 기본 대응어이므로 이를 유지했습니다. 문맥상 ''자기 집''이 가장 자연스럽고, 소유 관계도 분명합니다.'
