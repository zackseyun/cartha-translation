  source_fidelity: 현 초안은 화자의 핵심 동작과 수식 관계를 충실히 옮기지 못했습니다. 히브리어는 단 지파의 한 씨족에 속하며 소라와 에스다올에서 온 육백 명의 남자가 ‘그곳에서 떠났다’고 말하고, 이들은 전쟁용 무기로 무장해 있었습니다. 초안의 ‘무기를 갖춘 자로 말미암아’는 원문에 없는 인과 관계를 만들며, ‘행진하매’도 וַיִּסְעוּ(떠나다/출발하다)를 부정확하게 처리합니다.
  naturalness: ‘그 곳’, ‘여섯 백 명’, ‘행진하매’는 현대 표준어 합쇼체 문체에 맞지 않거나 지나치게 고풍스럽습니다. ‘그곳’, ‘육백 명’, ‘떠났습니다’로 다듬고, 수식어를 명사구 안에 자연스럽게 배치했습니다.
  terminology: מִשְׁפַּחַת는 지파 전체보다 작은 친족 집단이므로 ‘씨족’으로 옮겼습니다. חָגוּר כְּלֵי מִלְחָמָה는 문자적으로 전쟁 도구를 ‘차고/두른’ 상태이나 문맥상 ‘전쟁용 무기로 무장한’이 자연스럽고 충실합니다. 지명은 ‘소라’, ‘에스다올’로 음역했습니다.
