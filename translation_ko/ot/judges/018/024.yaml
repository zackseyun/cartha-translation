  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
  footnotes:
  - marker: a
    text: Or 'my god(s)' or 'my divine images.' The Hebrew word can be singular or plural in some contexts, but here the broader context favors 'my gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “여러분은 내가 만든 내 신들[a]과 그 제사장을 가져가고 떠나 버렸습니다. 이제 내게 무엇이 남았습니까? 그런데 어째서 나에게 ‘무슨 일이 있습니까?’ 하고 말합니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 신(들)’ 혹은 ‘내 신상들’로 옮길 수 있습니다. 히브리어는 문맥에 따라 단수나 복수로 이해될 수 있지만, 여기서는 더 넓은 문맥이 ‘내 신들’의 뜻을 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  english_pob_choice: my gods
  chosen_korean: 내 신들
  alternatives_korean:
  - 내 신
  - 나의 신상들
  - 내 우상들
  lexicon: HALOT
  rationale: 문맥상 미가의 집안 제의물들을 가리키므로, 단수적 ‘하나님’보다 복수 의미를 살린 ‘내 신들’이 영어 POB의 선택을 가장 잘 반영합니다.
- source_word: לְקַחְתֶּם
  english_pob_choice: you have taken
  chosen_korean: 빼앗아 갔고
  alternatives_korean:
  - 가져갔고
  - 취했고
  - 빼앗았고
  lexicon: HALOT
  rationale: 이 동사는 단순 소유 이동보다 강한 상실감을 주는 항의의 맥락이어서, 한국어에서는 결과성과 침탈감을 함께 드러내는 ‘빼앗아 갔고’가 적절합니다.
- source_word: וּמַה לִּי עוֹד
  english_pob_choice: What do I have left now?
  chosen_korean: 이제 내게 남은 것이 무엇이겠습니까?
  alternatives_korean:
  - 이제 내게 무엇이 남았습니까?
  - 내게 이제 남은 것이 무엇입니까?
  lexicon: HALOT
  rationale: 관용구적 상실 표현이므로 직역보다 현재의 공허함을 드러내는 질문형으로 옮겼습니다.
- source_word: מַה לָּךְ
  english_pob_choice: What is the matter with you?
  chosen_korean: 무슨 일이냐?
  alternatives_korean:
  - 무엇이 문제냐?
  - 무슨 일이 있느냐?
  lexicon: HALOT
  rationale: 문맥상 상대를 꾸짖는 관용적 표현이므로, 너무 설명적인 표현보다 짧고 직접적인 한국어 질문이 원문의 날 선 톤을 살립니다.
theological_decisions:
- issue: אֱלֹהַי를 ‘내 신들’로 복수 처리할지, 단수적 ‘내 신’으로 완화할지
  chosen_reading: 복수 의미를 살려 ‘내 신들’로 번역했습니다.
  alternative_readings:
  - 내 신
  - 내 우상들
  rationale: 본문은 사람이 만든 제의물을 가리키며, 영어 POB도 문맥상 plural sense를 택합니다. ‘우상들’은 해석을 미리 고정하므로 본문이 가진 아이러니를 유지하는 ‘내 신들’이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
