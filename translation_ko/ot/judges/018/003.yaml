  - severity: medium
    issue: 각주 b의 대안 표현
    rationale: ‘여기서 무슨 일이 있습니까?’는 무슨 사건이 일어났는지를 묻는 한국어 표현으로 읽혀 מַה־לְךָ פֹה의 ‘여기서 무슨 용무/관련이 있습니까?’라는 관용적 의미를 충분히 전달하지 못합니다.
