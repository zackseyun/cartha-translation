revisions:
- from: 그들이 미가의 집 근처에 있었는데, 젊은 레위인의 목소리를 알아보았습니다. 그래서 그들은 그곳으로 돌아서서 그에게 말했습니다. “누가 당신을 여기로 데려왔습니까? 당신은 이곳에서 무엇을 하고 있습니까? 또 여기서 무엇을 가지고 있습니까?”[a][b]
  to: 그들이 미가의 집 근처에 있었는데, 젊은 레위인의 목소리를 알아보았습니다. 그래서 그들은 그곳으로 길을 돌려 그에게 말했습니다. “누가 당신을 여기로 데려왔습니까? 당신은 이곳에서 무엇을 하고 있습니까?”[a] “또 여기에 당신에게 무엇이 있습니까?”[b]
  rationale: 원문의 이동 동작과 마지막 관용적 질문의 의미 범위를 더 정확하고 자연스러운 한국어로 반영했습니다. 각주 b는 한국어에서 사건 발생 여부를 묻는 뜻으로 오해될 수 있는 기존 표현을, 원문의 ‘용무/관련’ 의미를 드러내는 표현으로 교체했습니다. 각주 표지도 해당 질문 뒤로 옮겼습니다.
