  text: הֵ֚מָּה עִם בֵּ֣ית מִיכָ֔ה וְ/הֵ֣מָּה הִכִּ֔ירוּ אֶת ק֥וֹל הַ/נַּ֖עַר הַ/לֵּוִ֑י וַ/יָּס֣וּרוּ שָׁ֗ם וַ/יֹּ֤אמְרוּ ל/וֹ֙ מִֽי הֱבִיאֲ/ךָ֣ הֲלֹ֔ם וּ/מָֽה אַתָּ֥ה עֹשֶׂ֛ה בָּ/זֶ֖ה וּ/מַה לְּ/ךָ֥ פֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
  footnotes:
  - marker: a
    text: Or, “What are you doing here?” The Hebrew literally says, “What are you doing in this?”
    reason: lexical_alternative
  - marker: b
    text: Or, “What is your business here?” for “what do you have here?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 미가의 집 근처에 있었는데, 젊은 레위인의 목소리를 알아보았습니다. 그래서 그들은 그곳으로 길을 돌려 그에게 말했습니다. “누가 당신을 여기로 데려왔습니까? 당신은 이곳에서 무엇을 하고 있습니까?”[a] “또 여기에 당신에게 무엇이 있습니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여기서 무엇을 하고 있습니까?” 히브리어는 문자적으로 “이것 안에서 무엇을 하고 있습니까?”라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “여기서 무슨 용무가 있습니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  english_pob_choice: While they were near Micah’s house
  chosen_korean: 미가의 집 근처에 있었는데
  alternatives_korean:
  - 미가의 집과 함께 있었는데
  - 미가의 집에 있었는데
  lexicon: HALOT
  rationale: עִם은 여기서 동행보다 위치의 근접성을 나타내므로, 서술 흐름에 맞게 ‘근처에’로 옮겼습니다.
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  english_pob_choice: recognized the voice of the young Levite
  chosen_korean: 젊은 레위인의 목소리를 알아보았습니다
  alternatives_korean:
  - 젊은 레위인의 소리를 알아보았습니다
  - 젊은 레위인의 목소리를 식별했습니다
  lexicon: HALOT
  rationale: נכר의 의미는 ‘알아보다/인식하다’가 자연스럽고, קוֹל은 말소리 인지의 맥락에서 ‘목소리’가 가장 직접적입니다.
- source_word: וַיָּסוּרוּ שָׁם
  english_pob_choice: So they turned aside there
  chosen_korean: 그래서 그들은 그곳으로 돌아서서
  alternatives_korean:
  - 그래서 그들은 그리로 비켜서
  - 그래서 그들은 그쪽으로 돌아서서
  lexicon: HALOT
  rationale: סור는 길에서 벗어나 ‘돌아서다/비켜서다’의 뜻이므로, 방향 전환을 살리되 한국어 서술로 자연스럽게 만들었습니다.
- source_word: וּמַה לְּךָ פֹה
  english_pob_choice: And what do you have here?
  chosen_korean: 또 여기서 무엇을 가지고 있습니까?
  alternatives_korean:
  - 또 당신에게는 여기서 무엇이 있습니까?
  - 또 여기서 무슨 일이 있으십니까?
  lexicon: HALOT
  rationale: מה לך פה는 단순 소유보다 ‘여기서 무엇이 당신에게 속하느냐/무슨 일이 있느냐’의 물음을 포함하므로, 본문 표현을 살리면서도 한국어로는 소유·관련성의 뉘앙스를 드러냈습니다.
