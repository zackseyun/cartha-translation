base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
  footnotes:
  - marker: a
    text: Hebrew 'with the mouth of the sword,' an idiom meaning 'with the edge of the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 미가가 만든 것과 그에게 속한 제사장을 함께 가지고 라이스로 가서, 조용하고 안전한 백성을 치고 칼날로 그들을 쳤으며, 그 성읍을 불로 태웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 '칼의 입으로'이지만, 관용적으로 '칼날로'라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  english_pob_choice: So they
  chosen_korean: 그들은
  alternatives_korean:
  - 그러므로 그들은
  - 이에 그들은
  lexicon: BDB
  rationale: 히브리어 독립 대명사는 서사의 흐름과 주어 강조를 더합니다. 한국어에서는 과도한 접속어보다 단순한 주어 반복이 자연스럽고 원문 기능을 잘 살립니다.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  english_pob_choice: what Micah had made
  chosen_korean: 미가가 만든 것
  alternatives_korean:
  - 미가가 만들어 놓은 것들
  - 미가가 만든 물건들
  lexicon: BDB
  rationale: 문맥상 미가가 만든 우상/신상 관련 물건들을 가리키지만, 히브리어는 포괄적으로 '그가 만든 것'이라고 말합니다. 한국어도 그 범위를 유지해 구체화를 과도하게 하지 않았습니다.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  english_pob_choice: along with the priest who belonged to him
  chosen_korean: 그에게 속한 제사장
  alternatives_korean:
  - 그의 제사장
  - 그와 함께 있던 제사장
  lexicon: BDB
  rationale: היה לו는 단순 소유라기보다 미가 집안/성소에 딸린 관계를 나타냅니다. '속한'은 그 관계를 살리면서도 노예적 소유처럼 오해되지 않게 합니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼끝으로
  lexicon: BDB
  rationale: 히브리어의 직역은 '칼의 입으로'이지만, 한국어에서는 관용적 대응인 '칼날로'가 원문의 폭력성과 구체성을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: לָקְחוּ ... אֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ의 소유성 표현
  chosen_reading: '''그에게 속한 제사장''으로 옮겨 관계성을 드러내되, 소유 개념을 지나치게 강하게 만들지 않았습니다.'
  alternative_readings:
  - '''그의 제사장'''
  - '''그가 데리고 있던 제사장'''
  rationale: 본문은 제사장이 미가와 결속된 상태를 말하지만, 이를 현대 한국어의 물리적 소유로 단정하면 뉘앙스가 좁아집니다. 관계적 종속성을 유지하는 표현이 본문에 더 충실합니다.
  doctrine_reference: 서사문맥의 관계성/소유성 구분
- issue: וַיַּכּוּ אוֹתָם과 לְפִי חָרֶב의 결합
  chosen_reading: '''칼날로 그들을 쳤다''로 유지해 살상 여부를 직접 덧붙이지 않았습니다.'
  alternative_readings:
  - '''그들을 죽였습니다'''
  - '''그들을 쓰러뜨렸습니다'''
  rationale: 동사 נכה는 문맥에 따라 '치다/쓰러뜨리다/죽이다'까지 넓지만, 이어지는 표현이 이미 공격 수단을 명시합니다. 한국어는 원문의 열린 의미를 유지하는 쪽이 더 정확합니다.
  doctrine_reference: 서사 동사의 의미 범위 보존
