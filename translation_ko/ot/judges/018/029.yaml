revisions:
- from: 그들은 그 성의 이름을 단으로 불렀습니다[a]. 그것은 그들의 조상 단의 이름을 따른 것이었는데, 그는 이스라엘에게서 태어났습니다. 그러나 그 성의 이름은 본래 라이스였습니다.
  to: 그들은 이스라엘에게서 태어난 그들의 아버지 단[a]의 이름을 따라 그 성의 이름을 단이라 하였습니다. 그러나 그 성의 이름은 원래 라이스였습니다.
  rationale: ‘아버지’를 본문에 보존하여 אֲבִיהֶם의 직접적인 표현을 반영하고, ‘조상’이라는 넓은 계보적 의미는 해당 단어에 붙인 각주에서 제시했습니다. 또한 명명 행위와 그 근거를 한 문장으로 결합하고, לָרִאשֹׁנָה는 문맥상 이전 명칭을 뜻하는 ‘원래’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:07Z'
