id: JDG.18.29
reference: Judges 18:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
  footnotes:
  - marker: a
    text: Or 'their ancestor'; Hebrew 'their father' can denote a forefather, not only an immediate parent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 성의 이름을 단으로 불렀습니다[a]. 그것은 그들의 조상 단의 이름을 따른 것이었는데, 그는 이스라엘에게서 태어났습니다. 그러나 그 성의 이름은 본래 라이스였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 조상’. 히브리어 ‘그들의 아버지’는 직계 부모뿐 아니라 선조를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  english_pob_choice: they called the name of the city
  chosen_korean: 그들은 그 성의 이름을 단으로 불렀습니다
  alternatives_korean:
  - 그들은 그 성을 단이라 이름하였습니다
  - 그들은 그 성의 이름을 단이라고 지었습니다
  lexicon: HALOT
  rationale: קרא + שֵׁם의 이름 붙이기 관용을 살리되, 현대 한국어에서는 ‘이름을 …로 부르다’가 가장 자연스럽고 원문 구조도 비교적 잘 드러냅니다.
- source_word: בְּשֵׁם דָּן
  english_pob_choice: after the name of Dan
  chosen_korean: 단의 이름을 따른 것이었는데
  alternatives_korean:
  - 단의 이름으로
  - 단의 이름을 따라
  lexicon: HALOT
  rationale: בְּשֵׁם은 단순한 ‘by’보다 ‘~의 이름을 따라/따서’의 의미가 강해, 도시의 명명 근거를 자연스럽게 드러내기 위해 이렇게 옮겼습니다.
- source_word: אֲבִיהֶם
  english_pob_choice: their father
  chosen_korean: 그들의 조상 단
  alternatives_korean:
  - 그들의 아버지 단
  - 그들의 선조 단
  lexicon: HALOT
  rationale: 히브리어 ‘아버지’가 직계부모가 아니라 선조를 뜻할 수 있으므로, 본문 의미를 오해 없이 전달하는 쪽으로 ‘조상’으로 옮겼습니다.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  english_pob_choice: who was born to Israel
  chosen_korean: 그는 이스라엘에게서 태어났습니다
  alternatives_korean:
  - 그는 이스라엘에게서 났습니다
  - 그는 이스라엘에게서 태어난 자였습니다
  lexicon: HALOT
  rationale: 수동형 ילד의 출생 관계를 한국어에서 자연스럽게 풀어, ‘이스라엘’이 본문 그대로 남도록 하면서도 문장이 매끄럽게 읽히도록 했습니다.
- source_word: לָרִאשֹׁנָה
  english_pob_choice: formerly
  chosen_korean: 본래
  alternatives_korean:
  - 전에
  - 처음에는
  - 원래
  lexicon: HALOT
  rationale: 새 이름을 붙인 뒤의 대조를 간결하게 살리는 표현으로, 도시의 이전 명칭을 가리키는 맥락에 맞습니다.
theological_decisions:
- issue: אֲבִיהֶם의 친족 범위
  chosen_reading: ‘그들의 조상’으로 옮겨, 직계 아버지보다 넓은 선조 의미를 살렸습니다.
  alternative_readings:
  - 그들의 아버지
  - 그들의 선조
  rationale: 본문의 계보적·역사적 문맥상 ‘아버지’는 직접 부친이 아니라 부족의 시조를 가리킬 수 있으므로, 오해를 줄이면서도 원문의 친족 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
