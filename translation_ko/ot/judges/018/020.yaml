  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
  footnotes:
  - marker: a
    text: Or 'the teraphim.' The Hebrew term refers to household cult objects or household gods.
    reason: lexical_alternative
  - marker: b
    text: Or 'idol' or 'graven image.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그제야 제사장의 마음이 좋아졌습니다. 그는 에봇과 집안 우상들과 새긴 우상[a]을 가져다가 사람들 가운데로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘테라핌’입니다. 히브리어 용어는 집안의 제의용 물건 또는 집안 우상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב
  english_pob_choice: the priest’s heart was glad
  chosen_korean: 제사장의 마음이 좋아졌습니다
  alternatives_korean:
  - 제사장의 마음이 기뻐졌습니다
  - 제사장이 만족해했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음이 좋다/좋아지다’를 자연스럽게 살리면서, 상태 변화의 뉘앙스를 한국어로 전달했습니다.
- source_word: הָאֵפוֹד
  english_pob_choice: the ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에봇복
  - 제사장복
  lexicon: HALOT
  rationale: 제의 용어는 뜻풀이보다 음역이 더 정확하고, 한국어 성경에서 널리 쓰이는 ‘에봇’을 유지했습니다.
- source_word: הַתְּרָפִים
  english_pob_choice: the household idols
  chosen_korean: 집안 우상들
  alternatives_korean:
  - 드라빔
  - 가정 수호신들
  lexicon: HALOT
  rationale: ‘테라핌’의 가정용 우상/가정신 개념을 현대 한국어로 투명하게 풀어, 단순한 고유명사화보다 의미를 드러냈습니다.
- source_word: הַפָּסֶל
  english_pob_choice: the carved image
  chosen_korean: 새긴 우상
  alternatives_korean:
  - 조각한 형상
  - 새긴 형상
  - 새긴 신상
  lexicon: HALOT
  rationale: פסל의 물질적·제작적 성격을 살려 ‘새긴’으로 옮기고, 우상이라는 성격을 분명히 했습니다.
theological_decisions:
- issue: ‘마음이 좋아졌다’의 정서적 강도
  chosen_reading: 제사장이 물질적 이익이나 제의적 목적에 마음이 끌려 긍정적으로 반응한 것으로, 단순한 감정 묘사 이상을 암시하는 표현을 유지했습니다.
  alternative_readings:
  - 제사장이 기뻐했습니다
  - 제사장이 만족해했습니다
  rationale: 히브리어 원문은 마음의 상태가 ‘좋아짐’으로 표현되어, 윤리적·서사적 긴장감을 약화시키지 않도록 직역에 가까운 관용구를 선택했습니다.
  doctrine_reference: 서사 문맥의 인물 심리 묘사
