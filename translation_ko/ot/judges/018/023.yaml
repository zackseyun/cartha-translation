revisions:
- from: 그들이 단 자손들에게 외치자, 그들이 돌아서서 미가에게 말했습니다. "당신에게 무슨 일이 있기에, 이렇게 외치십니까?"[a][b]
  to: 그들이 단 자손들에게[a] 외치자, 그들이 돌아서서 미가에게 말했습니다. “무슨 일이기에[b] 그렇게 외칩니까?”
  rationale: 직접 화법에서 원문에 없는 존대 표지를 제거하고, 히브리어 관용구와 כִּי의 연결을 자연스러운 합쇼체로 반영했습니다. 두 복수 주어의 지시 대상은 본절만으로 명시하지 않아 원문의 문맥 의존성과 잠재적 모호성을 보존했습니다. 각주도 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:10Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 두 연속 복수 주어는 지시 대상이 문맥으로 정해지지만, 본절 자체의 표현은 모두 ‘그들’로 되어 있습니다. 초안은 이를 유지했으나, 직접 인용문의 ‘당신에게 … 외치십니까’는 원문의 단수 2인칭 질문을 한국어 존대법상 불필요하게 높여 표현합니다. 또한 כִּי가 이끄는 ‘무슨 일이기에/왜’의 관계를 더 자연스럽게 반영할 수 있습니다.
  naturalness: ‘그들이 … 그들이’의 반복은 원문의 지시 대상 अस्पষ্ট성을 보존하는 안전한 처리입니다. 다만 ‘당신에게 무슨 일이 있기에’는 현대 한국어 대화에서 다소 번역투이며, ‘이렇게’는 원문에 없는 강조입니다. ‘무슨 일이기에 그렇게 외칩니까?’가 현대적이고 자연스러운 합쇼체입니다.
  terminology: ‘단 자손들’은 בְּנֵי־דָן의 친족 표현을 보존하는 적절한 번역입니다. 미가도 표준적인 인명 표기입니다. ‘외치다’는 קרא 및 נזעקת의 문맥상 소리 내어 부름/항의함을 무리 없이 전달합니다.
  issues:
  - severity: medium
    issue: 직접 인용문의 불필요한 주체 존대
    rationale: ‘외치십니까’의 -시-는 미가를 높이는 한국어 문법 표지이나, 히브리어에는 존대의 의미가 없습니다. 합쇼체의 공적 문체는 유지하되 ‘외칩니까’로 옮기는 것이 중립적입니다.
  - severity: low
    issue: ‘이렇게’의 추가 강조와 관용구의 번역투
    rationale: 원문은 ‘무슨 일이기에/왜 네가 외쳤느냐’라는 질문입니다. ‘이렇게’는 원문에 없는 정도 강조이고, ‘당신에게 무슨 일이 있기에’보다 ‘무슨 일이기에’가 자연스럽습니다.
  - severity: low
    issue: 각주 표지의 본문 위치
    rationale: 각주는 해당 어구 바로 뒤에 두어야 합니다. 단 자손들에 대한 주석은 그 명사구 뒤에, מַה־לְךָ 관용구에 대한 주석은 번역된 질문 어구 뒤에 붙이는 것이 명확합니다.
