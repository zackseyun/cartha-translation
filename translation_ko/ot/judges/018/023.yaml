    text: Or “you have cried out” / “you have raised an outcry.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “to the sons of Dan”; that is, to the Danites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 단 자손들에게[a] 외치자, 그들이 돌아서서 미가에게 말했습니다. “무슨 일이기에[b] 그렇게 외칩니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 “단의 아들들에게.” 곧 단 지파 사람들에게.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “네게 무엇이 있기에.” 상대가 외치는 이유나 사정을 묻는 관용적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  english_pob_choice: They called out
  chosen_korean: 외치자
  alternatives_korean:
  - 불렀습니다
  - 소리쳤습니다
  lexicon: HALOT
  rationale: 이 문맥의 קרא는 단순한 ‘부르다’보다 큰소리로 부르는 행위를 가리키므로, 한국어에서는 자연스럽고 즉각적인 반응을 살리는 ‘외치다’가 가장 가깝습니다.
- source_word: אֶל בְּנֵי דָן
  english_pob_choice: to the sons of Dan
  chosen_korean: 단 자손들에게
  alternatives_korean:
  - 단 사람들에게
  - 단 사람들인 자손들에게
  lexicon: HALOT
  rationale: 히브리어의 ‘~의 아들들’ 표현을 살려 직역하되, 현대 한국어에서 이해 가능한 ‘자손들’로 옮겼습니다. 이는 POB의 ‘sons of Dan’에 대응하는 직접적인 표현입니다.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  english_pob_choice: they turned around
  chosen_korean: 돌아서서
  alternatives_korean:
  - 얼굴을 돌려
  - 몸을 돌려
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 얼굴을 돌리다’이지만, 현대 한국어에서는 ‘돌아서다’가 동일한 동작을 가장 자연스럽게 전달합니다.
- source_word: מַה לְּךָ
  english_pob_choice: What is the matter with you
  chosen_korean: 당신에게 무슨 일이 있기에
  alternatives_korean:
  - 무슨 문제입니까
  - 당신이 왜 그러십니까
  lexicon: HALOT
  rationale: 이 관용구는 단순한 정보 질문이 아니라 상대의 처지나 사정을 묻는 말이므로, ‘무슨 일이 있기에’로 옮겨 원문의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 미가에게 하는 직접 화법의 존대 수준
  chosen_reading: 서술문은 합쇼체로 유지하고, 질문 말미의 직접 인용은 정중한 존대 표현으로 처리했습니다.
  alternative_readings:
  - 직접 인용 전체를 평서체로 낮추는 방식
  - 전체를 일관되게 합쇼체로 만드는 방식
  rationale: 원문은 인용문 안에서 화자의 태도를 드러내는 구어체 질문입니다. 한국어에서는 대화체의 자연스러움을 유지하되, 출판용 성경 문체에 맞게 존대형 질문으로 정리했습니다.
  doctrine_reference: 문체/화행 처리
