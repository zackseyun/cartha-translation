revisions:
- from: 그러자 단 자손이 자기들을 위해 우상을 세웠습니다. 그리고 게르솜의 아들, 모세의 아들 요나단과 그의 아들들은 그 땅의 포로가 되는 날까지 단 지파를 위해 제사장들이었습니다.[a]
  to: 그러자 단 자손들은 자신들을 위하여 그 새긴 형상을 세웠습니다. 게르솜의 아들이며 모세의 아들인 요나단[a]과 그의 아들들은 그 땅이 유배되는 날까지 단 지파를 위하여 제사장들이었습니다.
  rationale: פֶּסֶל의 구체적 의미를 ‘그 새긴 형상’으로 보존하고, גְּלוֹת הָאָרֶץ의 이례적이며 역사적으로 특정하기 어려운 표현을 ‘그 땅이 유배되는 날’로 옮겼습니다. 요나단의 계보는 본문에서 ‘모세’를 따르되, 마소라의 매달린 nun과 전통적 ‘므낫세’ 독법을 각주에 명시하여 본문 전승의 긴장을 보존했습니다. 각주 표지는 해당 이름 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:33Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. הַפָּסֶל은 구체적으로 ‘새긴 형상/조각한 형상’이며, גְּלוֹת הָאָרֶץ는 ‘그 땅의 포로가 되는’이라기보다 땅의 유배(추방)를 말하는 특이하고 다소 모호한 표현입니다. 또한 모세/므낫세 관련 각주는 매달린 글자 nun을 정확히 설명해야 합니다.
  naturalness: 합쇼체 문장은 대체로 자연스럽지만, ‘그 땅의 포로가 되는 날’은 땅 자체가 포로가 된다는 의미로 부자연스럽고 원문의 ‘유배/추방’ 표현도 충분히 반영하지 못합니다. ‘그 땅이 유배되는 날’은 원문의 의인화되고 모호한 표현을 보존하면서도 자연스럽습니다.
  terminology: פֶּסֶל은 ‘우상’보다 ‘새긴 형상’이 원어의 제작 방식과 정관사를 더 잘 보존합니다. ‘제사장들’과 인명 표기는 적절합니다. 본문 독법은 ‘모세’로 유지하고, 각주에서 전통적 ‘므낫세’ 독법을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: הַפָּסֶל을 ‘우상’으로 일반화함
    rationale: ‘우상’은 문맥상 가능하지만, פֶּסֶל이 뜻하는 ‘새긴 형상’을 평평하게 만듭니다. 최적 등가 번역에서는 ‘그 새긴 형상’이 더 충실합니다.
  - severity: high
    issue: גְּלוֹת הָאָרֶץ를 ‘그 땅의 포로가 되는 날’로 번역함
    rationale: 원문은 ‘땅의 유배/추방’이라는 특이한 명사구이며, 제시된 번역은 포로가 되는 주체와 사건의 성격을 부정확하게 바꿉니다. 특정 역사적 사건을 단정하지 않는 표현으로 유지해야 합니다.
  - severity: medium
    issue: 각주의 ‘떠받침점’ 설명이 부정확하고 비자연적임
    rationale: 문제의 마소라 표기는 ‘매달린 글자’(suspended nun)입니다. 이를 정확히 설명하면서 전통적 ‘므낫세’ 독법을 밝혀야 합니다.
  revised_text: 그러자 단 자손들은 자신들을 위하여 그 새긴 형상을 세웠습니다. 게르솜의 아들이며 모세의 아들인 요나단[a]과 그의 아들들은 그 땅이 유배되는 날까지 단 지파를 위하여 제사장들이었습니다.
