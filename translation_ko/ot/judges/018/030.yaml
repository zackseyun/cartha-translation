  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Moses''; the Masoretic tradition includes a suspended letter, yielding the traditional reading ''Manasseh.'''
    reason: textual_variant
translation:
  language: ko
  text: 그러자 단 자손들은 자신들을 위하여 그 새긴 형상을 세웠습니다. 게르솜의 아들이며 모세의 아들인 요나단[a]과 그의 아들들은 그 땅이 유배되는 날까지 단 지파를 위하여 제사장들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘모세’. 마소라 본문에는 매달린 글자 nun이 있어 전통적으로 ‘므낫세’로 읽습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ לָהֶם
  english_pob_choice: set up for themselves
  chosen_korean: 자기들을 위해 … 세웠습니다
  alternatives_korean:
  - 자기들을 위해 … 설치했습니다
  - 자기들을 위해 … 세워 두었습니다
  lexicon: HALOT
  rationale: הקים는 여기서 우상을 ‘세우다/설치하다’의 뜻이므로, 현대 한국어에서는 자연스럽게 ‘세웠습니다’로 옮기고 לָהֶם의 자기지시적 뉘앙스를 ‘자기들을 위해’로 드러냈습니다.
- source_word: הַפָּסֶל
  english_pob_choice: the carved image
  chosen_korean: 우상
  alternatives_korean:
  - 새긴 형상
  - 조각상
  lexicon: HALOT
  rationale: פֶּסֶל의 문자적 의미는 ‘새긴 형상’이지만, 본문 문맥에서 우상 숭배 대상을 가리키므로 한국어 독자가 즉시 이해할 수 있도록 ‘우상’으로 옮겼습니다.
- source_word: בֶּן מְהוּא
  english_pob_choice: son of Moses
  chosen_korean: 모세의 아들
  alternatives_korean:
  - 므낫세의 아들
  lexicon: HALOT
  rationale: 마소라 전승의 점표시는 문헌상 긴장을 보존하므로, 본문은 영어 POB와 같이 ‘모세의 아들’을 따르고 전통적 대안은 각주로 남겼습니다.
- source_word: לְשֵׁבֶט הַדָּנִי
  english_pob_choice: for the tribe of the Danites
  chosen_korean: 단 지파를 위해
  alternatives_korean:
  - 단 자손의 지파를 위해
  - 단 사람들의 지파를 위해
  lexicon: HALOT
  rationale: לְ는 봉사 대상/귀속을 나타내므로 ‘~를 위해’로 옮겼고, הַדָּנִי는 한국어 성경 관용에 맞게 ‘단 지파’로 간결하게 표현했습니다.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  english_pob_choice: until the day of the exile of the land
  chosen_korean: 그 땅의 포로가 되는 날까지
  alternatives_korean:
  - 그 땅이 유배되는 날까지
  - 그 땅의 추방의 날까지
  lexicon: HALOT
  rationale: 직역하면 ‘땅의 유배’이지만 한국어에서는 주체가 살아 있는 듯한 표현보다 ‘그 땅의 포로가 되는 날’이 자연스럽고, 사건의 종말점을 보존합니다.
theological_decisions:
- issue: 모세/므낫세 계열의 계보 긴장 보존
  chosen_reading: 본문에는 ‘모세의 아들’로 두고, 전통적 대안은 각주로 처리합니다.
  alternative_readings:
  - 므낫세의 아들
  rationale: 문자 전승이 의도적으로 남긴 긴장을 본문에서 평평하게 만들지 않기 위해, 한국어 본문도 성급히 조정하지 않고 원문 기반의 기본 독법을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
