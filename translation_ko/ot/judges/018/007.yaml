  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
  footnotes:
  - marker: a
    text: Or 'after the manner of the Sidonians.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew is difficult: ''and there was no one humiliating a thing in the land, possessing authority.'' The sense is likely that no ruler or oppressor was present to shame or dominate them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they had no alliance/dealings with anyone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 다섯 사람이 길을 떠나 라이스에 이르러 보니, 그 안의 백성이 시돈 사람들의 관습대로 안전하게 살고 있었습니다. 그곳에는 그들을 어떤 일에서도 수치스럽게 하거나, 권세를 가진 이도 없었고, 그들은 시돈 사람들로부터 멀리 떨어져 있었으며, 아무와도 아무런 관계가 없었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시돈 사람들의 방식대로’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 난해합니다. 직역하면 ‘그 땅에서 어떤 일을 수치스럽게 하는 자도, 권세를 가진 자도 없었다’에 가깝습니다. 여기서는 수치나 지배를 가하는 통치자의 부재로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아무와도 동맹이나 교류가 없었다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  english_pob_choice: Laish
  chosen_korean: 라이스
  alternatives_korean:
  - 레셈
  lexicon: HALOT
  rationale: 고유지명은 본문 상황의 표기를 따르는 것이 적절하므로 라이스로 옮겼습니다.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  english_pob_choice: according to the custom of the Sidonians
  chosen_korean: 시돈 사람들의 관습대로
  alternatives_korean:
  - 시돈 사람들의 방식대로
  - 시돈 사람들의 법도에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 판결이 아니라 관습적 생활양식을 가리키므로, 자연스러운 한국어인 관습대로를 택했습니다.
- source_word: שֹׁקֵט וּבֹטֵחַ / לָבֶטַח
  english_pob_choice: quiet and secure
  chosen_korean: 안전하게 살고 있었습니다
  alternatives_korean:
  - 조용하고 안전하게 살고 있었습니다
  - 평온하고 안전하게 살고 있었습니다
  lexicon: HALOT
  rationale: 두 표현이 겹쳐 안전과 평온의 상태를 강조하므로, 한국어에서는 중복을 과도하게 늘리지 않고 상태를 자연스럽게 압축했습니다.
- source_word: מַכְלִים דָּבָר / יוֹרֵשׁ עֶצֶר
  english_pob_choice: to humiliate them in anything; possessing authority
  chosen_korean: 어떤 일에서도 수치스럽게 하거나, 권세를 가진 이도 없었고
  alternatives_korean:
  - 어떤 일에서도 그들을 부끄럽게 할 자도, 지배하는 자도 없었고
  - 그 어떤 일로도 그들을 수치 주는 자나 통치자도 없었고
  lexicon: HALOT
  rationale: 난해한 구문이므로 POB의 의미 판단을 따라 '수치'와 '권세/지배'의 결핍을 함께 드러내되, 본문이 암시하는 억압 부재를 한국어로 표현했습니다.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  english_pob_choice: they had no dealings with anyone
  chosen_korean: 아무와도 아무런 관계가 없었습니다
  alternatives_korean:
  - 아무와도 아무런 왕래가 없었습니다
  - 아무와도 아무런 거래가 없었습니다
  lexicon: HALOT
  rationale: 관용구의 핵심은 사회적·외교적 접촉 부재이므로, 가장 포괄적인 관계가 없었습니다로 옮겼습니다.
