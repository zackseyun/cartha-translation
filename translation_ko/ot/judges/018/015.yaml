reference: Judges 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּס֣וּרוּ שָׁ֔מָּ/ה וַ/יָּבֹ֛אוּ אֶל בֵּֽית הַ/נַּ֥עַר הַ/לֵּוִ֖י בֵּ֣ית מִיכָ֑ה וַ/יִּשְׁאֲלוּ ל֖/וֹ לְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
  footnotes:
  - marker: a
    text: Or, 'and greeted him' or 'and asked him if all was well.' The Hebrew idiom literally refers to inquiring concerning peace/well-being.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그곳으로 돌아서서 젊은 레위인의 집, 곧 미가의 집에 이르러 그에게 평안한지 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 인사했다’ 혹은 ‘그의 형편이 어떤지 물었다.’ 히브리어 관용구는 문자적으로는 평안/안녕에 관해 묻는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  english_pob_choice: They turned aside there
  chosen_korean: 그곳으로 돌아서서
  alternatives_korean:
  - 그곳으로 비켜 가서
  - 그곳에 들러
  lexicon: HALOT
  rationale: סוּר의 이동상 ‘방향을 바꾸어 벗어나다’는 뜻을 살려, 단순한 방문보다 경로 이탈의 뉘앙스를 드러냈습니다.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  english_pob_choice: the house of the young Levite
  chosen_korean: 젊은 레위인의 집
  alternatives_korean:
  - 젊은 레위 청년의 집
  - 레위인 청년의 집
  lexicon: HALOT
  rationale: נַעַר와 הַלֵּוִי를 함께 반영해 ‘젊은’과 ‘레위인’을 모두 살렸고, 한국어에서는 소유구를 자연스럽게 압축해 표현했습니다.
- source_word: בֵּית מִיכָה
  english_pob_choice: the house of Micah
  chosen_korean: 미가의 집
  alternatives_korean:
  - 미가 집
  - 미가의 집안
  lexicon: HALOT
  rationale: 동일한 집 표현이 apposition처럼 반복되어 위치를 특정하므로, 소유격으로 자연스럽게 옮겼습니다.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  english_pob_choice: asked him about his welfare
  chosen_korean: 그에게 평안한지 물었습니다
  alternatives_korean:
  - 그의 평안을 물었습니다
  - 안부를 물었습니다
  - 그에게 평안을 묻고 인사했습니다
  lexicon: HALOT
  rationale: לְשָׁלוֹם의 관용구를 단순 인사로 약화하지 않고, ‘평안한지 묻다’로 옮겨 안부 확인의 의미를 보존했습니다.
