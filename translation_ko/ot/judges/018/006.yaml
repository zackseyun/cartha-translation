  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
  footnotes:
  - marker: a
    text: Or, 'Your way is before the LORD,' that is, your journey is in his sight. The phrase does not necessarily state explicit divine approval.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장이 그들에게 말했습니다. 「평안히 가십시오. 여러분이 가는 길은 야훼 앞에 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여러분의 길은 야훼 앞에 있습니다’입니다. 곧 여러분의 여정이 그분의 눈앞에 있다는 뜻입니다. 이 표현은 반드시 야훼의 분명한 승인을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And the priest said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 제사장이 ... 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 진행을 자연스럽게 살리되, 합쇼체 문체에 맞게 담백한 과거 서술로 옮겼습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: Go in peace
  chosen_korean: 평안히 가십시오
  alternatives_korean:
