  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
  footnotes:
  - marker: a
    text: Or, 'Your way is before the LORD,' that is, your journey is in his sight. The phrase does not necessarily state explicit divine approval.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제사장이 그들에게 말했습니다. 「평안히 가십시오. 여러분이 가는 길은 야훼 앞에 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 길이 야훼 앞에 있습니다’라는 뜻으로, 곧 여러분의 여정이 그분의 눈앞에 있다는 의미입니다. 이 표현은 반드시 분명한 하나님의 승인을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And the priest said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 제사장이 ... 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 진행을 자연스럽게 살리되, 합쇼체 문체에 맞게 담백한 과거 서술로 옮겼습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: Go in peace
  chosen_korean: 평안히 가십시오
  alternatives_korean:
  - 평안 가운데 가십시오
  - 평안으로 가십시오
  lexicon: HALOT
  rationale: 출발을 축복하는 관용구로서의 힘을 살리면서, 현대 한국어로 자연스럽게 표현했습니다.
- source_word: נֹכַח יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼의 눈앞에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 장소적·관계적 의미를 유지하여, 행위가 야훼의 면전/감시 앞에 놓여 있음을 드러냈습니다. 또한 יהוה는 관례에 따라 야훼로 옮겼습니다.
- source_word: דַּרְכְּכֶם אֲשֶׁר תֵּלְכוּ בָהּ
  english_pob_choice: The journey on which you are going
  chosen_korean: 여러분이 가는 길
  alternatives_korean:
  - 여러분의 길
  - 여러분이 가고 있는 여정
  lexicon: HALOT
  rationale: 직역의 '길/여정' 이미지를 살리되, 한국어에서 가장 자연스러운 서술로 다듬었습니다.
theological_decisions:
- issue: נֹכַח יְהוָה의 신학적 강도
  chosen_reading: ‘야훼 앞에 있습니다’로 옮겨, 그 길이 야훼의 면전/감시 아래 있다는 뜻은 살리되, 명시적 승인이나 성공 보장은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘야훼께서 그 길을 인정하십니다’
  - ‘야훼께서 여러분의 길을 복 주십니다’
  rationale: 문맥상 제사장의 말은 야훼의 승인 선언이라기보다, 그들이 가는 길이 야훼 앞에 놓여 있음을 말합니다. 원문의 긴장을 보존하기 위해 긍정적 보증으로 확대하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
