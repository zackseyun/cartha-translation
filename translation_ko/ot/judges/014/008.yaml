source:
  edition: WLC
  text: וַ/יָּ֤שָׁב מִ/יָּמִים֙ לְ/קַחְתָּ֔/הּ וַ/יָּ֣סַר לִ/רְא֔וֹת אֵ֖ת מַפֶּ֣לֶת הָ/אַרְיֵ֑ה וְ/הִנֵּ֨ה עֲדַ֧ת דְּבוֹרִ֛ים בִּ/גְוִיַּ֥ת הָ/אַרְיֵ֖ה וּ/דְבָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: ko
  text: 며칠 뒤에 그는 그녀를 맞이하려고 돌아왔습니다. 그는 사자의 사체를 보려고 옆으로 돌아갔습니다. 그런데 보니, 사자의 사체 안에 벌 떼와 꿀이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  english_pob_choice: After some days
  chosen_korean: 며칠 후에
  alternatives_korean:
  - 몇 날이 지난 뒤에
  - 시간이 좀 지난 뒤에
  lexicon: מִן + יָמִים
  rationale: 히브리어 관용구를 자연스러운 한국어 시간 표현으로 옮기되, 본문이 특정한 긴 기간보다 ‘며칠’ 정도의 경과를 말하는 점을 유지했습니다.
- source_word: לְקַחְתָּהּ
  english_pob_choice: to take her
  chosen_korean: 그녀를 데려오려고
  alternatives_korean:
  - 그녀를 맞이하려고
  - 그녀를 취하려고
  lexicon: לקח
  rationale: 결혼 맥락에서 단순 ‘취하다’보다 한국어로는 ‘데려오다’가 관계적·서술적으로 더 자연스럽고, 원문의 동사 의미도 과도하게 완화하지 않습니다.
- source_word: וַיָּסַר לִרְאוֹת
  english_pob_choice: and he turned aside to see
  chosen_korean: 옆길로 비켜섰는데
  alternatives_korean:
  - 돌아서서 보았는데
  - 옆으로 가서 보았는데
  lexicon: סר + ראה
  rationale: ‘돌아보다’보다 본문이 강조하는 방향 전환과 사체를 확인하려는 행동을 살려, ‘옆길로 비켜서다’로 옮겼습니다.
- source_word: עֲדַת דְּבוֹרִים ... וּדְבָשׁ
  english_pob_choice: a swarm of bees ... and honey
  chosen_korean: 벌 떼가 있고 꿀이 있었습니다
  alternatives_korean:
  - 벌 떼가 있었고 꿀도 있었습니다
  - 벌 떼와 꿀이 있었습니다
  lexicon: עֲדָה + דְבוֹרִים + דְבָשׁ
  rationale: ‘벌 떼’와 ‘꿀’은 직역을 유지했고, 본문의 두 명사구를 나란히 살려 사자의 몸속이라는 기이한 장면을 분명히 드러냈습니다.
theological_decisions:
- issue: 사자의 시체 안에 있는 벌 떼와 꿀이라는 기이한 묘사
  chosen_reading: 기적적 상징을 덧붙이지 않고, 서술된 사실 자체를 담담하게 제시했습니다.
  alternative_readings:
  - 상징적 의미를 암시하는 번역
  - 해석을 덧붙인 의역
  rationale: 본문은 사건의 관찰을 기록할 뿐 해석을 주지 않으므로, 독자가 본문의 긴장을 직접 보도록 유지하는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 서술 본문은 본문 자체의 관찰을 우선함
- issue: 대상 대명사와 서술 시점
  chosen_reading: ‘그녀’를 유지해 독자가 결혼 상대를 떠올리게 했습니다.
  alternative_readings:
  - 이 여자
  - 신부
  rationale: 히브리어 대명사는 앞선 문맥의 여성 인물을 가리키며, 본문 자체는 그녀의 신분을 다시 설명하지 않으므로 과도한 명사화는 피했습니다.
  doctrine_reference: 문맥 지시 대명사의 자연스러운 유지
