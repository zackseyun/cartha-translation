  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
  footnotes:
  - marker: a
    text: Or 'thirty linen cloths' for 'thirty linen garments'; the Hebrew term can denote fine linen items, but here likely refers to wearable articles in parallel with 'changes of clothes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신들이 그것을 내게 말할 수 없으면, 당신들은 내게 삼십 개의 세마포 옷과 삼십 벌의 갈아입을 옷을 주어야 합니다.” 그들이 그에게 말했습니다. “당신의 수수께끼를 내어 보시오. 우리가 듣겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סְדִינִים은 세마포 천이나 세마포 옷을 가리킬 수 있습니다. 여기서는 ‘갈아입을 옷’과 병렬을 이루므로 입는 물건으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם לֹ֣א תוּכְלוּ לְ/הַגִּ֣יד לִ/י
  english_pob_choice: But if you cannot tell me
  chosen_korean: 그러나 당신들이 그것을 내게 말할 수 없으면
  alternatives_korean:
