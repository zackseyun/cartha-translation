  - 당신들은 내게 삼십 개의 세마포 천을 주어야 합니다
  lexicon: HALOT
  rationale: סְדִינִים은 문맥상 입는 물건으로 보이므로 ‘세마포 옷’으로 옮겨, 단순 천조각처럼 들릴 수 있는 표현을 피했습니다.
- source_word: וּ/שְׁלֹשִׁ֖ים חֲלִיפ֣וֹת בְּגָדִ֑ים
  english_pob_choice: and thirty changes of clothes
  chosen_korean: 삼십 벌의 갈아입을 옷
