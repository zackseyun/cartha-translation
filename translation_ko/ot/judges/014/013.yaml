  text: 그러나 당신들이 그 답을 내게 말할 수 없으면, 당신들은 내게 세마포 옷 서른 벌[a]과 갈아입을 옷 서른 벌을 주어야 합니다.” 그들이 그에게 말했습니다. “당신의 수수께끼를 내십시오. 우리가 들어 봅시다.”
  philosophy: optimal-equivalence
  footnotes:
