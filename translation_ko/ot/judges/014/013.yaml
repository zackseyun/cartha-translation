  lexicon: HALOT
  rationale: יכל은 능력의 부정을 나타내므로 ‘할 수 없으면’으로 옮기고, לְהַגִּיד는 ‘말하다/알리다’의 의미를 살려 수수께끼의 답을 가리키는 ‘그것’을 보충했습니다.
- source_word: וּ/נְתַתֶּ֨ם אַתֶּ֥ם לִ/י שְׁלֹשִׁ֣ים סְדִינִ֔ים
  english_pob_choice: then you must give me thirty linen garments
  chosen_korean: 당신들은 내게 삼십 개의 세마포 옷을 주어야 합니다
