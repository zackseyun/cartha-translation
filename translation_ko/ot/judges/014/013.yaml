  lexicon: HALOT
  rationale: חֲלִיפוֹת בְּגָדִים는 교체용 의복, 곧 갈아입을 옷의 묶음을 뜻하므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ח֥וּדָ/ה חִידָתְ/ךָ֖
  english_pob_choice: Tell your riddle
  chosen_korean: 당신의 수수께끼를 내어 보시오
