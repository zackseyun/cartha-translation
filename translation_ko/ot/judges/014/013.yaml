    text: 히브리어 סְדִינִים은 세마포 천이나 세마포 옷을 가리킬 수 있습니다. 여기서는 ‘갈아입을 옷’과 병렬을 이루므로 입는 물건으로 옮겼습니다.
    reason: lexical_alternative
