base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
  footnotes:
  - marker: a
    text: Or 'scooped it out' or 'took it out'; the Hebrew verb suggests removing the honey by hand from within the carcass.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그것을 손바닥에 긁어 담아 길을 가면서 먹었습니다. 그 뒤에 아버지와 어머니에게 가서 그 꿀을 그들에게 주었더니, 그들이 먹었습니다. 그러나 그는 사자의 사체에서 그 꿀을 긁어냈다는 것을 그들에게 알리지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  english_pob_choice: He scraped it
  chosen_korean: 그것을 자기 손에 긁어 담고
  alternatives_korean:
  - 그것을 자기 손에 떠 담고
  - 그것을 자기 손으로 꺼내고
  lexicon: HALOT
  rationale: רדה는 여기서 꿀을 사자 사체에서 손으로 분리해 내는 동작을 가리키므로, 단순한 ‘꺼내다’보다 ‘긁어 담다’가 물리적 감각을 더 잘 살립니다.
- source_word: אֶל כַּפָּיו
  english_pob_choice: into his hands
  chosen_korean: 자기 손에
  alternatives_korean:
  - 자기 손바닥에
  - 자기 두 손에
  lexicon: HALOT
  rationale: כַּף는 손바닥/손을 뜻하지만, 한국어에서는 자연스럽고 간결한 ‘손에’가 가장 무리 없이 동작의 방향을 전달합니다.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  english_pob_choice: went on, eating as he went
  chosen_korean: 먹으면서 계속 가다가
  alternatives_korean:
  - 가면서 먹으며
  - 걸어가며 먹고
  lexicon: HALOT
  rationale: הלך의 반복과 동작 진행을 함께 살리기 위해 ‘먹으면서 계속 가다가’로 옮겨, 지속적 행위를 자연스러운 한국어로 표현했습니다.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  english_pob_choice: the carcass of the lion
  chosen_korean: 그 사자가 죽은 몸
  alternatives_korean:
  - 사자의 사체
  - 사자의 시체
  lexicon: HALOT
  rationale: גְּוִיָּה는 죽은 몸/시체를 가리키며, 동물에 대해서는 ‘죽은 몸’이 지나치게 노골적이지 않으면서도 불쾌한 구체성을 보존합니다.
theological_decisions:
- issue: 사자의 사체에서 나온 꿀이라는 불쾌하고 의례적으로 부정한 상황의 전달
  chosen_reading: ‘사자가 죽은 몸에서 그 꿀을 긁어냈다’고 직설적으로 밝혀, 이야기의 기이함과 불편함을 약화하지 않았습니다.
  alternative_readings:
  - ‘사자 몸에서 나온 꿀’처럼 완곡하게 표현
  - ‘사자에서 꿀을 뺐다’로 일반화
  rationale: 본문은 꿀의 출처를 숨기지 않고 오히려 충격적으로 제시하므로, 한국어도 그 긴장을 유지하는 편이 원문 의도에 충실합니다.
  doctrine_reference: source-text transparency
