- from: 그것을 자기 손에 긁어 담고 먹으면서 계속 가다가, 자기 아버지와 어머니에게 가서 그것을 그들에게 주었더니 그들이 먹었습니다. 그러나 그는 그 사자가 죽은 몸에서 그 꿀을 긁어냈다는 사실을 그들에게 알리지 않았습니다.
  to: 그는 그것을 손바닥에 긁어 담아 길을 가면서 먹었습니다. 그 뒤에 아버지와 어머니에게 가서 그 꿀을 그들에게 주었더니, 그들이 먹었습니다. 그러나 그는 사자의 사체에서 그 꿀을 긁어냈다는 것을 그들에게 알리지 않았습니다.
  rationale: 사자의 죽은 몸을 뜻하는 גְּוִיָּה를 ‘사자의 사체’로 바로 옮기고, 이동하며 먹는 행위와 부모에게 가는 다음 행위를 분리하여 원문의 서술 순서와 현대 한국어의 자연스러운 흐름을 함께 살렸습니다. 의미상 암시된 꿀은 ‘그 꿀’로 밝혀 주되, 본문에 없는 추가 해석은 넣지 않았습니다.
