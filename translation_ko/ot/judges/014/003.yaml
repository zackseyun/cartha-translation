revisions:
- from: 그러자 그의 아버지와 그의 어머니가 그에게 말했습니다. “네 형제들의 딸들 가운데나 내 모든 백성 가운데에 여자가 없느냐? 그런데 네가 왜 할례받지 않은 블레셋 사람들 가운데서 아내를 데려가려 하느냐?” 삼손이 그의 아버지에게 말했습니다. “그 여자를 나에게 데려오십시오. 그녀가 내 눈에 옳기 때문입니다.”[a][b]
  to: 그의 아버지와 어머니가 그에게 말했습니다. “네 형제들의 딸들[a] 가운데나 내 모든 백성 가운데에 여자가 없어서, 네가 할례받지 않은 블레셋 사람들 가운데서 아내를 맞이하려 하느냐?” 삼손이 그의 아버지에게 말했습니다. “그 여자를 제게 데려와 주십시오. 그 여자가 내 눈에 옳습니다[b].”
  rationale: 원문에 없는 ‘왜’와 접속의 대비를 제거하고, 부모의 수사적 질문을 현대 합쇼체로 일관되게 옮겼습니다. ‘내 모든 백성’의 단수 1인칭과 ‘할례받지 않은’이라는 표현을 유지했으며, ‘내 눈에 옳다’의 직역적 표현과 의미상의 폭을 모두 보존했습니다. 각주 표지는 각 해당 표현 바로 뒤로 옮겼습니다.
