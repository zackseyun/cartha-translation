base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
  footnotes:
  - marker: a
    text: Or, “she is pleasing in my eyes” or “she seems right to me.” The Hebrew idiom can express personal approval or attractiveness; the main text preserves the wording that echoes a recurring theme in Judges.
    reason: lexical_alternative
  - marker: b
    text: “The daughters of your brothers” likely refers broadly to women from Samson’s kin group or people, not only to the literal daughters of his immediate brothers.
    reason: cultural_note
translation:
  language: ko
  text: 그의 아버지와 어머니가 그에게 말했습니다. “네 형제들의 딸들[a] 가운데나 내 모든 백성 가운데에 여자가 없어서, 네가 할례받지 않은 블레셋 사람들 가운데서 아내를 맞이하려 하느냐?” 삼손이 그의 아버지에게 말했습니다. “그 여자를 제게 데려와 주십시오. 그 여자가 내 눈에 옳습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘형제들’은 여기서 직계 형제만이 아니라 더 넓은 친족 집단이나 같은 백성을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘내 눈에 옳다’는 ‘내게 좋다’, ‘내 마음에 든다’ 또는 ‘내게 적합해 보인다’라는 뜻을 나타낼 수 있습니다. ‘자기 눈에 옳은 대로’라는 판관기의 반복 표현과도 어휘상 울림이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  english_pob_choice: Is there not
  chosen_korean: …없느냐?
  alternatives_korean:
  - …없지 않느냐?
  - …없느냐
  lexicon: HALOT
  rationale: 수사적 부정 의문을 한국어 자연문으로 옮기되, 부모의 항변조의 뉘앙스를 살리기 위해 간결한 반말형 질문을 사용했습니다.
- source_word: בִּבְנוֹת אַחֶיךָ וּבְכָל עַמִּי
  english_pob_choice: among the daughters of your brothers or among all my people
  chosen_korean: 네 형제들의 딸들 가운데나 내 모든 백성 가운데에
  alternatives_korean:
  - 네 친족의 딸들 가운데나 내 백성 가운데에
  - 네 형제들의 딸들 또는 내 모든 백성 가운데에
  lexicon: HALOT
  rationale: 히브리어의 친족·백성 표현을 본문대로 살려 직역에 가깝게 유지했습니다. 영어 각주가 말하듯 ‘형제들’은 넓은 친족 집단을 가리킬 수 있으나, 본문은 그 표현을 보존하는 것이 적절합니다.
- source_word: אִשָּׁה / אִשָּׁה
  english_pob_choice: a woman / a wife
  chosen_korean: 여자 / 아내
  alternatives_korean:
  - 여인 / 아내
  - 여자 / 부인
  lexicon: HALOT
  rationale: 첫 번째 אִשָּׁה는 수사적 질문에서 적합한 ‘여자’로, 두 번째는 결혼 맥락이 분명하므로 ‘아내’로 구분했습니다.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  english_pob_choice: from the uncircumcised Philistines
  chosen_korean: 할례받지 않은 블레셋 사람들 가운데서
  alternatives_korean:
  - 할례받지 않은 블레셋인들 가운데서
  - 무할례 블레셋 사람들 가운데서
  lexicon: HALOT
  rationale: ‘할례받지 않은’은 이스라엘의 언약적 경계표지에 대한 경멸적 호칭이므로 완화하지 않았고, 민족명은 표준 표기인 ‘블레셋 사람들’로 옮겼습니다.
- source_word: אוֹתָהּ קַח לִי
  english_pob_choice: Get her for me
  chosen_korean: 그 여자를 나에게 데려오십시오
  alternatives_korean:
  - 그 여자를 나를 위해 데려오십시오
  - 그 여자를 내게 가져오십시오
  lexicon: HALOT
  rationale: 삼손의 요청은 아버지에게 혼인 중개를 요구하는 말로 자연스럽게 들리도록 하되, 명령의 힘을 유지했습니다.
- source_word: יָשְׁרָה בְעֵינַי
  english_pob_choice: she is right in my eyes
  chosen_korean: 그녀가 내 눈에 옳기 때문입니다
  alternatives_korean:
  - 그녀가 내 눈에 좋기 때문입니다
  - 그녀가 내게 옳게 보이기 때문입니다
  lexicon: HALOT
  rationale: 판관기에 반복되는 ‘자기 눈에 옳은 것’이라는 문구와의 연결을 살리기 위해 ‘내 눈에 옳다’를 보존했습니다. 영어 POB의 각주처럼 이는 단순 호감만이 아니라 평가적·서사적 함의를 가집니다.
theological_decisions:
- issue: ‘내 눈에 옳다’라는 표현의 판관기 주제적 반복 보존
  chosen_reading: 그녀가 내 눈에 옳기 때문입니다
  alternative_readings:
  - 그녀가 내게 좋기 때문입니다
  - 그녀가 마음에 들기 때문입니다
  rationale: 이 구절은 외형적 선호를 넘어서 판관기 전체의 ‘자기 눈에 옳은 대로 행함’이라는 주제와 맞닿아 있으므로, 의미를 풀어버리기보다 서사적 울림이 남도록 직역형 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
