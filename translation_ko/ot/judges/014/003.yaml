review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘그런데 네가 왜’는 히브리어의 כִּי אַתָּה הוֹלֵךְ לָקַחַת를 이유를 묻는 ‘왜’의 질문으로 강화합니다. 원문은 부모의 수사적 질문 안에서 ‘네가 ... 아내를 맞이하려 하느냐’라고 말할 뿐입니다. 또한 각주는 해당 표현에 직접 붙어야 합니다.
  naturalness: 합쇼체 대상 본문에 ‘없느냐?’가 섞여 있어 높임 종결을 일관되게 적용해야 합니다. ‘내게 데려와 주십시오’는 혼인 마련을 아버지에게 요청하는 문맥에서 자연스럽습니다.
  terminology: ‘할례받지 않은 블레셋 사람들’, ‘내 모든 백성’, ‘내 눈에 옳다’는 원문의 어휘와 판관기 내 반복 표현을 적절히 보존합니다. 단, ‘내 눈에 옳다’의 의미를 각주에서 단정적으로 주제화하지 않고, 호감·적합성이라는 가능한 의미와 서사적 울림을 함께 제시하는 편이 안전합니다.
  issues:
  - severity: medium
    issue: ‘그런데 네가 왜’가 원문의 문장 관계와 질문의 초점을 바꿉니다.
    rationale: 히브리어는 ‘여자가 없느냐, 네가 할례받지 않은 블레셋 사람들에게서 아내를 맞이하려 하느냐?’라는 수사적 항변입니다. ‘왜’는 원문에 없는 인과 의문을 추가합니다.
  - severity: medium
    issue: 본문의 ‘없느냐?’는 지정된 현대 합쇼체와 일치하지 않습니다.
    rationale: 같은 발화 안에서 ‘하려 하느냐?’로 통일하면 현대 표준어의 공식적 높임말 문체를 유지할 수 있습니다.
