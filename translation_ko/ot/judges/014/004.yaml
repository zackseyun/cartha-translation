id: JDG.14.4
reference: Judges 14:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
  footnotes:
  - marker: a
    text: Or, 'for He was seeking an occasion against the Philistines,' with 'He' understood as the LORD. The Hebrew permits this, though the context more likely points to Samson.
    reason: alternative_reading
  - marker: b
    text: Or 'a pretext' or 'an opportunity' for action against the Philistines.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지와 어머니는 그것이 야훼에게서 나온 것인 줄 알지 못했습니다. 그가 블레셋 사람들을 상대로 틈을 찾고 있었기 때문입니다.[a] 그때 블레셋 사람들이 이스라엘을 다스리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘틈’은 행동을 위한 기회나 구실을 뜻할 수 있습니다. 여기서 ‘그’는 야훼로 이해할 수도 있습니다. 히브리어는 이 가능성을 허용하지만, 문맥상으로는 삼손을 가리키는 쪽이 더 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서 나온 것
  alternatives_korean:
  - 야훼로부터 온 것
  - 주님에게서 나온 것
  lexicon: WLC / project default
  rationale: יהוה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 문맥상 사건의 출처를 나타내는 표현으로 자연스럽게 풀었습니다.
- source_word: תֹאֲנָה
  english_pob_choice: an occasion
  chosen_korean: 틈
  alternatives_korean:
  - 기회
  - 구실
  - 전례
  lexicon: HALOT
  rationale: 이 단어는 단순한 ‘기회’보다 공격이나 충돌을 위한 ‘틈/구실’의 뉘앙스를 담을 수 있어, 문맥상 더 선명한 ‘틈’을 택했습니다.
- source_word: מְבַקֵּשׁ
  english_pob_choice: he was seeking
  chosen_korean: 찾고 있었기
  alternatives_korean:
  - 구하고 있었기
  - 모색하고 있었기
  lexicon: HALOT
  rationale: 분사형의 지속적 동작을 살려 ‘찾고 있었기’로 옮겼습니다. 앞뒤 문맥에서 이는 블레셋 사람들과의 충돌 계기를 찾는다는 뜻입니다.
- source_word: מִפְּלִשְׁתִּים
  english_pob_choice: against the Philistines
  chosen_korean: 블레셋 사람들에게서
  alternatives_korean:
  - 블레셋 사람들에 맞서
  - 블레셋 사람들을 향한
  lexicon: HALOT
  rationale: 히브리어 전치사 מִן을 따라 ‘-에게서’의 방향성을 살리되, ‘틈을 찾다’와 결합해 결과적으로 적대적 행위를 위한 대상임을 드러냈습니다. 영어 주석의 대안인 ‘against’는 본문 설명으로 처리했습니다.
theological_decisions:
- issue: ‘그것’의 지시 대상과 신적 주권
  chosen_reading: 본문은 삼손의 결혼 사건/상황이 야훼에게서 나온 것이라고 말하면서도, 인간 행위의 진행을 그대로 유지합니다.
  alternative_readings:
  - 야훼가 삼손의 욕망을 직접 조종하셨다는 강한 예정론적 읽기
  - 야훼는 단지 나중에 인간 결정을 사용하셨다는 약한 섭리 읽기
  rationale: 히브리어는 하나님의 주권과 인간의 의도/행동을 함께 제시하므로, 그 긴장을 해소하지 않고 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘그가’의 지시 대상
  chosen_reading: ‘그가’는 서술 흐름상 삼손을 가리키는 것으로 이해해 번역했습니다.
  alternative_readings:
  - ‘그가’는 야훼를 가리킨다
  rationale: 가까운 문맥에서는 삼손의 결혼 서사가 계속되고, 문맥 전체도 블레셋과의 갈등을 준비하는 삼손의 행위를 설명합니다. 다만 히브리어의 가능성은 각주로 남겼습니다.
  doctrine_reference: Translation philosophy §3
