  text: 야훼의 영이 그에게 세차게 임하셨습니다[a]. 그는 손에 아무것도 없었지만, 어린 염소를 찢듯이 그 사자를 찢어 버렸습니다[b]. 그러나 그는 자신이 한 일을 아버지와 어머니에게 알리지 않았습니다.
