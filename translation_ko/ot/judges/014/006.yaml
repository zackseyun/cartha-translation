  to: 야훼의 영이 그에게 세차게 임하셨습니다[a]. 그는 손에 아무것도 없었지만, 어린 염소를 찢듯이 그 사자를 찢어 버렸습니다[b]. 그러나 그는 자신이 한 일을 아버지와 어머니에게 알리지 않았습니다.
  rationale: 원문의 절차를 유지하여, 야훼의 영이 삼손에게 강력히 임한 일, 무기 없이 사자를 어린 염소처럼 찢은 일, 그 일을 부모에게 알리지 않은 일을 현대 합쇼체로 옮겼습니다. ‘하지만’을 사용하여 무기 부재가 원인이 아니라 놀라운 상황임을 드러냈으며, 문맥상 선행절의 사자를 ‘그 사자’로 명시했습니다.
