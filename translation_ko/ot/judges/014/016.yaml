review_pass:
  verdict: revise
  source_fidelity: 히브리어의 화자는 삼손의 아내이며, 그녀가 삼손 앞에서 울고 그에게 직접 항의하는 구조를 유지해야 합니다. 초안의 ‘주께서’는 하나님께 쓰는 존칭으로 원문에 없으며, 삼손을 향한 호칭으로는 부정확합니다. 마지막 문장은 ‘내 부모에게도 말하지 않았는데 어찌 네게 말하겠느냐’라는 수사 의문으로 옮겼습니다.
  naturalness: 초안은 ‘말하기를 … 하매’, ‘아니하심이라’, ‘하였더라’ 등 현대 표준어 합쇼체와 맞지 않는 고어체·성경번역체가 두드러집니다. 현대적 격식체의 서술과 직접화법으로 정리했습니다.
  terminology: ‘수수께끼’는 חִידָה에 적절합니다. לִבְנֵי עַמִּי의 남성형을 문맥상 자연스러운 ‘내 백성의 남자들’로 번역하고, 문자적 표현은 각주로 보존했습니다. ‘당신’과 ‘-습니다’는 원문의 2인칭 단수 및 직접 대화에 맞는 현대 격식체입니다.
