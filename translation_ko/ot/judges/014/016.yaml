  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: ko
  text: 삼손의 아내가 그 앞에서 울며 말했습니다. “당신은 나를 미워할 뿐, 사랑하지 않으십니다. 당신은 내 백성의 남자들에게[a] 수수께끼를 내셨지만, 내게는 말씀하지 않으셨습니다.” 그러자 삼손이 그녀에게 말했습니다. “보십시오, 나는 내 아버지와 어머니에게도 말하지 않았는데, 어찌 당신에게 말하겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “내 백성의 아들들에게.” 히브리어는 남성형이며, 이 문맥에서는 그녀의 백성 가운데 수수께끼를 들은 남자들을 가리키는 듯합니다.
