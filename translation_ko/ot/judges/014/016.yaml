  to: 삼손의 아내가 그 앞에서 울며 말했습니다. “당신은 나를 미워할 뿐, 사랑하지 않으십니다. 당신은 내 백성의 남자들에게[a] 수수께끼를 내셨지만, 내게는 말씀하지 않으셨습니다.” 그러자 삼손이 그녀에게 말했습니다. “보십시오, 나는 내 아버지와 어머니에게도 말하지 않았는데, 어찌 당신에게 말하겠습니까?”
