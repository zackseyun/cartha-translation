base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
  footnotes:
  - marker: a
    text: Or “your father’s house.” The Hebrew expression can refer either to the physical house or, more broadly, to the father’s household/family.
    reason: lexical_alternative
  - marker: b
    text: Or “to impoverish us” / “to take possession of what is ours.” The Hebrew verb can carry the sense of dispossessing or taking possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱째 날에 그들이 삼손의 아내에게 말했습니다. “당신의 남편을 꾀어서 그가 그 수수께끼를 우리에게 알려 주게 하십시오. 그렇지 않으면 우리가 당신과 당신 아버지의 집을 불태우겠습니다[a]. 우리의 것을 빼앗으려고 우리를 초대한 것입니까[b]? 그렇지 않습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신 아버지의 집안” 또는 “당신 아버지의 가족”입니다. 히브리어 ‘아버지의 집’은 물리적인 집을 가리킬 수도 있고, 아버지의 가구나 가족 전체를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리를 무산하게 하려고” 또는 “우리에게서 차지하려고”입니다. 히브리어 동사는 소유를 차지하다, 빼앗다, 또는 내쫓아 소유를 잃게 하다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לְאֵשֶׁת שִׁמְשׁוֹן
  english_pob_choice: they said to Samson’s wife
  chosen_korean: 그들이 삼손의 아내에게 말했습니다
  alternatives_korean:
  - 삼손의 아내에게 이르렀습니다
  - 삼손의 아내에게 말하였습니다
  lexicon: WLC / context
  rationale: לְאֵשֶׁת שִׁמְשׁוֹן은 관계 표지를 가진 자연스러운 호칭이므로 한국어에서도 직역에 가깝게 ‘삼손의 아내’로 옮겼습니다.
- source_word: פַּתִּי
  english_pob_choice: Entice
  chosen_korean: 꾀어
  alternatives_korean:
  - 설득하여
  - 유혹하여
  - 부추겨
  lexicon: HALOT
  rationale: 피엘 명령형의 강한 조종·회유 뉘앙스를 살리기 위해, 부드러운 ‘설득’보다 의도적으로 압박감이 있는 ‘꾀어’를 선택했습니다.
- source_word: הַחִידָה
  english_pob_choice: the riddle
  chosen_korean: 수수께끼
  alternatives_korean:
  - 수수께끼 같은 말
  - 이 수수께끼
  lexicon: HALOT
  rationale: חִידָה는 문맥상 전형적인 ‘수수께끼’이므로, 현대 한국어에서 가장 자연스럽고 분명한 대응어를 사용했습니다.
- source_word: בֵּית אָבִיךְ
  english_pob_choice: your father’s household
  chosen_korean: 당신 아버지의 집
  alternatives_korean:
  - 당신 아버지의 가문
  - 당신 아버지의 집안
  - 당신 아버지의 가족
  lexicon: HALOT
  rationale: 히브리어 ‘집’은 물리적 건물과 가족/가구를 함께 가리킬 수 있어, 본문의 불태우겠다는 위협을 살리면서도 한국어에서 가장 직접적인 ‘집’을 택했습니다.
- source_word: הֲלֹא
  english_pob_choice: Is that not so?
  chosen_korean: 그렇지 않습니까?
  alternatives_korean:
  - 그렇지요?
  - 아닙니까?
  lexicon: HALOT
  rationale: 상대의 동의를 전제하는 반문이므로, 한국어에서는 확인·추궁의 어조를 가진 ‘그렇지 않습니까?’가 가장 적절합니다.
- source_word: וְיַגֶּד לָנוּ
  english_pob_choice: so that he may tell us
  chosen_korean: 그가 우리에게 ... 말하게 하십시오
  alternatives_korean:
  - 그가 우리에게 ... 알리게 하십시오
  - 그가 우리에게 ... 말하도록 하십시오
  lexicon: HALOT
  rationale: 명령 뒤 목적을 나타내는 구조를 한국어에서는 목적절로 풀어, ‘말하게 하십시오’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 위협적 명령문의 한국어 어조
  chosen_reading: 직설적 협박을 약화하지 않고, ‘불사르겠습니다’처럼 분명한 위협으로 옮겼습니다.
  alternative_readings:
  - ‘태우겠습니다’처럼 완화
  - ‘불에 태워 죽이겠습니다’처럼 확장
  rationale: 본문은 단순한 경고가 아니라 구체적 폭력 협박이므로, 원문의 위협성을 그대로 드러내되 과도한 확장은 피했습니다.
  doctrine_reference: 본문의 서사적 긴장 보존
