  source_fidelity: 전반적으로 마소라 본문(WLC)을 충실히 반영합니다. ‘일곱째 날,’ ‘남편을 꾀어,’ 수수께끼를 알리게 하라는 목적, 그리고 불태우겠다는 위협은 적절합니다. 다만 לְיָרְשֵׁנוּ는 ‘우리를 빼앗다’라고 하면 한국어에서 목적어 관계가 불분명하고 부자연스럽습니다. 문맥상 그들의 재산을 빼앗거나 그들을 무산하게 하려 한다는 비난이므로 ‘우리의 것을 빼앗으려고’로 옮기고 대안을 주석으로 보존하는 것이 안전합니다.
  naturalness: 합쇼체는 일관됩니다. 그러나 ‘우리를 빼앗으려고 초대한 것입니까?’는 현대 표준 한국어에서 의미가 선명하지 않습니다. 또한 ‘수수께끼를 말하게 하십시오’보다 ‘그 수수께끼를 우리에게 알려 주게 하십시오’가 해당 문맥에서 자연스럽습니다.
