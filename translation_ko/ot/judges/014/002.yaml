base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
  footnotes:
  - marker: a
    text: Or, more literally, “from the daughters of the Philistines.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 올라가서 자기 아버지와 어머니에게 알리고 말했습니다. 「내가 딤나에서 블레셋 사람들의 딸들 가운데[a] 한 여자를 보았습니다. 그러니 이제 그 여자를 제 아내로 얻어 주십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “블레셋 사람들의 딸들로부터”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: Then he went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 가서
  - 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다’를 살려 지형적 이동과 서사 흐름을 함께 반영했습니다.
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 알리고
  alternatives_korean:
  - 말하고
  - 전하고
  lexicon: HALOT
  rationale: נגד의 ‘알리다/전하다’ 의미를 자연스럽게 살렸고, 이어지는 직접화법과도 잘 맞습니다.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  english_pob_choice: from the daughters of the Philistines
  chosen_korean: 블레셋 사람들의 딸들 가운데 한 여자를
  alternatives_korean:
  - 블레셋 사람들의 딸들 가운데서
  - 블레셋 사람들의 딸들 중 한 여자를
  lexicon: HALOT
  rationale: 히브리어의 부분적 표현을 살리되, 한국어에서는 자연스럽게 ‘가운데 한 여자’로 풀어 읽을 수 있게 했습니다.
- source_word: קְחוּ אוֹתָהּ לִּי לְאִשָּׁה
  english_pob_choice: get her for me as a wife
  chosen_korean: 그 여자를 내 아내로 맞이해 주십시오
  alternatives_korean:
  - 그 여자를 제 아내로 얻어 주십시오
  - 그 여자를 내게 아내로 데려와 주십시오
  lexicon: HALOT
  rationale: 혼인 요청 관용구를 직역보다 자연스럽게 옮기면서도, ‘여자를 취하라’는 행위 요구를 과하게 완화하지 않도록 했습니다.
theological_decisions:
- issue: 직접화법의 정중한 요청 어조
  chosen_reading: 「... 맞이해 주십시오」
  alternative_readings:
  - 「... 데려와 주십시오」
  - 「... 얻어 주십시오」
  rationale: 삼손이 부모에게 요구하는 장면이므로 현대 한국어에서 공손한 명령/요청형으로 옮겨 서사적 관계를 보존했습니다.
  doctrine_reference: 서사 내 인물 관계와 발화 태도
- issue: 블레셋 사람들의 딸들 가운데 한 여자의 부분적 의미
  chosen_reading: ‘가운데 한 여자’
  alternative_readings:
  - ‘블레셋 사람들의 딸들 중 한 여자’
  - ‘블레셋 사람들로부터 온 여자’
  rationale: 히브리어 전치사 מן의 부분적 뉘앙스를 살리면서, 단순 출신 표지로만 약화되지 않게 했습니다.
  doctrine_reference: 본문의 수사적·문법적 뉘앙스
