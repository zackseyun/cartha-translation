base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
  footnotes:
  - marker: a
    text: Literally, “before the sun came in,” an idiom meaning before sunset.
    reason: lexical_alternative
  - marker: b
    text: Literally, “If you had not plowed with my heifer.” Samson uses a metaphor for his wife, accusing them of using her to solve the riddle.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 일곱째 날[a], 해가 지기 전에 그에게 말했습니다. “꿀보다 더 단 것은 무엇이며, 사자보다 더 강한 것은 무엇입니까?” 그러자 그가 그들에게 말했습니다. “내 암소[b]와 함께 갈아보지 않았더라면, 너희는 내 수수께끼를 풀지 못했을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “해가 들어오기 전에”입니다. 여기서는 일몰 전에라는 관용적 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “내 암소”입니다. 삼손이 아내를 가리키는 비유적이고 모욕적인 표현으로, 본문은 그 이미지를 그대로 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  english_pob_choice: the men of the city
  chosen_korean: 그들이
  alternatives_korean:
  - 성읍 사람들
  - 그 도시의 남자들
  lexicon: HALOT
  rationale: 문맥상 앞서 언급된 성읍 사람들을 가리키므로 지시어로 자연스럽게 처리하되, 영어 POB의 남성 복수 뉘앙스를 해치지 않도록 일반적 집단명으로 옮겼습니다.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: on the seventh day
  chosen_korean: 일곱째 날
  alternatives_korean:
  - 일곱 번째 날
  lexicon: HALOT
  rationale: 시간표현으로 자연스럽고 간결한 한국어를 택했습니다.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  english_pob_choice: before the sun went down
  chosen_korean: 해가 지기 전에
  alternatives_korean:
  - 해가 들어오기 전에
  - 해가 지기 직전에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 통용 표현으로 옮기되, 일몰 이전이라는 시간 의미를 분명하게 드러냈습니다.
- source_word: בְּעֶגְלָתִי
  english_pob_choice: with my heifer
  chosen_korean: 내 암소
  alternatives_korean:
  - 내 송아지 암소
  - 내 어린 암소
  - 내 아내
  lexicon: HALOT
  rationale: 직역 이미지를 보존해 삼손의 비꼬는 비유를 살렸습니다. 영어 POB처럼 실제 지시대상은 각주로 밝히는 것이 적절합니다.
- source_word: חִידָתִי
  english_pob_choice: my riddle
  chosen_korean: 내 수수께끼
  alternatives_korean:
  - 내 난제
  - 내 수수께끼 문제
  lexicon: HALOT
  rationale: 사사기 내러티브에서 가장 자연스럽고 널리 통용되는 대응어입니다.
theological_decisions:
- issue: 삼손의 반어적·모욕적 표현 보존
  chosen_reading: “내 암소”라는 직역 이미지를 본문에 유지했습니다.
  alternative_readings:
  - “내 아내”로 의역
  - “내 어린 암소”로 완곡화
  rationale: 원문은 पत्नी를 직접 가리키기보다 가축 비유를 사용해 상대를 책망하므로, 그 공격성과 수사적 긴장을 약화시키지 않도록 직역을 유지했습니다.
  doctrine_reference: 본문 수사와 번역 투명성 원칙
- issue: 직접화법의 반말/존대 처리
  chosen_reading: 대화 상대에게는 이야기체 과거와 평서형을 유지하고, 질문부는 공손한 종결을 사용했습니다.
  alternative_readings:
  - 전부 평서형
  - 전부 해요체
  rationale: 서사문은 합쇼체로 유지하되, 인용문 안에서는 원문의 직접대화 성격을 살려 자연스러운 현대 한국어 질문으로 처리했습니다.
  doctrine_reference: 번역 문체 일관성
