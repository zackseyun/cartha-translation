  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אַנְשֵׁ֨י הָ/עִ֜יר בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י בְּ/טֶ֨רֶם֙ יָבֹ֣א הַ/חַ֔רְסָ/ה מַה מָּת֣וֹק מִ/דְּבַ֔שׁ וּ/מֶ֥ה עַ֖ז מֵ/אֲרִ֑י וַ/יֹּ֣אמֶר לָ/הֶ֔ם לוּלֵא֙ חֲרַשְׁתֶּ֣ם בְּ/עֶגְלָתִ֔/י לֹ֥א מְצָאתֶ֖ם חִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
  footnotes:
  - marker: a
    text: Literally, “before the sun came in,” an idiom meaning before sunset.
    reason: lexical_alternative
  - marker: b
    text: Literally, “If you had not plowed with my heifer.” Samson uses a metaphor for his wife, accusing them of using her to solve the riddle.
    reason: cultural_note
translation:
  language: ko
  text: 성읍 사람들이 일곱째 날[a], 해가 지기 전에 그에게 말했습니다. “꿀보다 더 단 것이 무엇이며, 사자보다 더 강한 것이 무엇입니까?” 그러자 그가 그들에게 말했습니다. “내 암송아지[b]로 밭을 갈지 않았더라면, 너희는 내 수수께끼를 풀지 못했을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “해가 들어오기 전에”입니다. 여기서는 일몰 전이라는 관용적 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “내 암송아지”입니다. 삼손은 자신의 아내를 가리키는 비유적이고 모욕적인 표현으로 말하며, 그들이 아내를 이용하여 수수께끼를 풀었다고 비난합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  english_pob_choice: the men of the city
  chosen_korean: 그들이
  alternatives_korean:
