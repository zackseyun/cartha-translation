    issue: אָחוּדָה נָא의 청유·허락 요청이 ‘제발 내가 … 내게 해 주십시오’로 어색하게 표현됨
    rationale: 원문은 삼손이 수수께끼를 제시하겠다는 공손한 제안입니다. ‘제가 … 내도 되겠습니까?’가 현대 합쇼체에서 자연스럽고 원문의 화행을 잘 살립니다.
  - severity: medium
    issue: 연회/잔치 대안이 본문에 대괄호로 삽입되고 각주 a의 내용이 원문의 ‘일곱 날’ 범위를 충분히 반영하지 못함
    rationale: 번역 본문에는 하나의 표현만 두고, 대안 번역은 ‘잔치의 일곱 날 안에’ 전체를 대상으로 각주에서 제시해야 합니다.
  - severity: medium
