source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אָחֽוּדָה נָּ֥א לָ/כֶ֖ם חִידָ֑ה אִם הַגֵּ֣ד תַּגִּידוּ֩ אוֹתָ֨/הּ לִ֜/י שִׁבְעַ֨ת יְמֵ֤י הַ/מִּשְׁתֶּה֙ וּ/מְצָאתֶ֔ם וְ/נָתַתִּ֤י לָ/כֶם֙ שְׁלֹשִׁ֣ים סְדִינִ֔ים וּ/שְׁלֹשִׁ֖ים חֲלִפֹ֥ת בְּגָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
  footnotes:
  - marker: a
    text: Or “during the seven days of the banquet.”
    reason: lexical_alternative
  - marker: b
    text: Literally “find it”; that is, solve the riddle.
    reason: lexical_alternative
  - marker: c
    text: The exact kinds of garments are uncertain; the Hebrew refers to linen garments and sets of clothing.
    reason: cultural_note
translation:
  language: ko
  text: 삼손이 그들에게 말했습니다[a]. 「제발 내가 수수께끼 하나를 내게 해 주십시오. 여러분이 연회[혹은 잔치]의 일곱 날 안에 그것을 내게 말하고[b] 풀어내면[c], 내가 여러분에게 삼십 벌의 세마포 옷과 삼십 벌의 갈아입을 옷을 드리겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잔치 동안.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “그것을 나에게 말하다”입니다.
    reason: source_note
  - marker: c
    text: 직역하면 “찾아내면”이며, 여기서는 수수께끼의 해답을 푼다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  english_pob_choice: Please let me put
  chosen_korean: 제발 내가 수수께끼 하나를 내게 해 주십시오
  alternatives_korean:
  - 제발 내가 수수께끼를 내보게 해 주십시오
  - 부디 제가 수수께끼를 하나 내겠습니다
  lexicon: HALOT
  rationale: 수수께끼를 ‘내다’는 의미를 살리면서, נָא의 공손한 청유를 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: חִידָה
  english_pob_choice: a riddle
  chosen_korean: 수수께끼
  alternatives_korean:
  - 수수께끼 하나
  - 난제
  lexicon: HALOT
  rationale: 문맥상 퍼즐이 아니라 말로 내는 수수께끼이므로 표준적인 ‘수수께끼’가 가장 정확합니다.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  english_pob_choice: within the seven days of the feast
  chosen_korean: 연회의 일곱 날 안에
  alternatives_korean:
  - 잔치의 일곱 날 동안
  - 잔치의 일곱 날 안에
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 여기서 혼인 잔치/연회의 의미이므로 ‘연회’로 옮기고, 기한을 분명히 하기 위해 ‘안에’를 넣었습니다.
- source_word: וּמְצָאתֶם
  english_pob_choice: and solve it
  chosen_korean: 풀어내면
  alternatives_korean:
  - 찾아내면
  - 풀면
  lexicon: HALOT
  rationale: 직역하면 ‘찾다’이지만 수수께끼 문맥에서는 ‘해답을 풀다’의 뜻이므로 자연스럽게 ‘풀어내다’로 옮겼습니다.
- source_word: שְׁלֹשִׁים סְדִינִים / שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  english_pob_choice: thirty linen garments and thirty changes of clothes
  chosen_korean: 삼십 벌의 세마포 옷과 삼십 벌의 갈아입을 옷
  alternatives_korean:
  - 삼십 벌의 린넨 옷과 삼십 벌의 옷갈이
  - 삼십 벌의 세마포 옷과 삼십 벌의 옷갈이
  lexicon: HALOT
  rationale: 세마포 옷은 מקור의 סְדִינִים가 가리키는 직물의 성격을 살린 표현이고, חֲלִפֹת בְּגָדִים은 완전한 의복 한 벌씩의 교환을 뜻하므로 ‘갈아입을 옷’으로 옮겼습니다.
theological_decisions:
- issue: 삼손의 말투와 청유 표현
  chosen_reading: 삼손의 직접 발화는 현대 합쇼체로 옮기되, נָא의 공손한 요청을 살려 정중한 청유로 표현했습니다.
  alternative_readings:
  - 반말형 직설
  - 더 고풍스러운 기도체/성경체
  rationale: 본문은 화자가 사람들에게 제안을 하는 장면이므로, 원문의 공손한 요청과 내러티브의 긴장을 모두 살리기 위해 합쇼체 정중 표현을 선택했습니다.
  doctrine_reference: 문체/화행 결정
