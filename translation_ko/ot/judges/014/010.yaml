base_translation:
  language: en
  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
  footnotes:
  - marker: a
    text: Or 'a banquet' or 'a drinking feast.' The Hebrew מִשְׁתֶּה often refers to a celebratory meal that includes drinking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지는 그 여자에게 내려갔고, 삼손은 거기서 잔치를 베풀었습니다.[a] 이는 젊은 남자들이 관례적으로 하던 일이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁתֶּה는 축하 식사나 잔치를 뜻하며, 종종 음주를 동반합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  english_pob_choice: went down
  chosen_korean: 내려갔고
  alternatives_korean:
  - 갔고
  - 내려가고
  lexicon: HALOT
  rationale: 히브리어 ירד의 방향성을 살려 단순히 '갔다'보다 '내려갔고'로 옮겼습니다.
- source_word: אֲבִיהוּ
  english_pob_choice: his father
  chosen_korean: 그의 아버지가
  alternatives_korean:
  - 아버지가
  - 그 아버지가
  lexicon: HALOT
  rationale: 문맥상 삼손의 아버지를 가리키므로 소유 관계를 분명히 드러내는 '그의 아버지'로 옮겼습니다.
- source_word: מִשְׁתֶּה
  english_pob_choice: a feast
  chosen_korean: 잔치를 베풀었습니다
  alternatives_korean:
  - 잔치를 마련했습니다
  - 연회를 열었습니다
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 단순한 식사보다 축하의 자리와 음주를 포함할 수 있는 잔치를 가리키므로, 한국어 관용을 살려 '잔치를 베풀었습니다'로 옮겼습니다.
- source_word: הַבַּחוּרִים
  english_pob_choice: the young men
  chosen_korean: 젊은이들이
  alternatives_korean:
  - 젊은 남자들이
  - 청년들이
  lexicon: HALOT
  rationale: בָּחוּר의 기본 의미를 자연스럽게 담되, 혼인 맥락에서 지나치게 좁지 않게 '젊은이들'로 옮겼습니다.
