  source_fidelity: 전반적으로 히브리어의 순서와 핵심 의미를 충실히 반영합니다. 다만 כֵּן יַעֲשׂוּ의 관습적·일반적 진술은 ‘관례적으로 하던 일’로 드러내는 것이 더 분명하며, הַבַּחוּרִים은 성별이 특정된 ‘젊은 남자들’로 옮기는 편이 정확합니다.
  naturalness: ‘그것은 젊은이들이 하는 일이었습니다’는 현재형 관형절과 과거 서술이 결합되어 다소 어색하고, 원문의 관습적 설명도 약해집니다. ‘이는 젊은 남자들이 관례적으로 하던 일이었습니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘잔치를 베풀었습니다’는 מִשְׁתֶּה에 적절합니다. 해당 어휘를 설명하는 각주는 ‘잔치’에 직접 붙여야 앵커가 명확합니다.
  issues:
