  lexicon: HALOT
  rationale: מִשְׁתֶּה는 단순한 식사보다 축하의 자리와 음주를 포함할 수 있는 잔치를 가리키므로, 한국어 관용을 살려 '잔치를 베풀었습니다'로 옮겼습니다.
- source_word: הַבַּחוּרִים
  english_pob_choice: the young men
  chosen_korean: 젊은이들이
  alternatives_korean:
  - 젊은 남자들이
  - 청년들이
  lexicon: HALOT
  rationale: בָּחוּר의 기본 의미를 자연스럽게 담되, 혼인 맥락에서 지나치게 좁지 않게 '젊은이들'로 옮겼습니다.
