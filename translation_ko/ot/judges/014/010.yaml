  - severity: low
    issue: הַבַּחוּרִים의 성별 표현
    rationale: 이 명사는 남성 복수이므로, 한국어의 성별 비특정 표현인 ‘젊은이들’보다 ‘젊은 남자들’이 원문에 더 가깝습니다.
  - severity: low
