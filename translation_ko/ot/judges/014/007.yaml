  rationale: 히브리어 동사 ירד의 기본 의미인 ‘내려가다’를 살리되, 서술 흐름에 맞게 연결어미 ‘-서’로 자연스럽게 옮겼습니다.
- source_word: וַיְדַבֵּר לָאִשָּׁה
