- source_word: וַתִּישַׁר
  english_pob_choice: she was pleasing
  chosen_korean: 좋게 보였습니다
  alternatives_korean:
  - 마음에 들었습니다
  - 기뻐 보였습니다
  - 옳게 보였습니다
  lexicon: HALOT
  rationale: ישר의 여기서의 뜻은 단순한 미감보다 ‘삼손의 판단에 맞고 좋게 여겨짐’에 가깝기 때문에, 평가적 뉘앙스를 살려 ‘좋게 보였습니다’로 옮겼습니다.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  english_pob_choice: in Samson’s eyes
  chosen_korean: 삼손의 눈에
  alternatives_korean:
