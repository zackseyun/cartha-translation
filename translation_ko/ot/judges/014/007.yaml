  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에’의 이미지를 보존하여 평가의 기준이 삼손 자신에게 있음을 드러냈습니다.
theological_decisions:
- issue: ‘좋게 보였습니다’가 단순한 호감인지, 판단/분별의 언어인지
  chosen_reading: 호감과 판단을 함께 담는 평가 표현으로 유지했습니다.
  alternative_readings:
  - ‘마음에 들었습니다’로 더 감각적으로 옮김
  - ‘옳게 보였습니다’로 판단 의미를 더 강하게 옮김
  rationale: 사사기의 문맥상 개인의 주관적 판단이 강조되므로, 히브리어 관용구의 평가성을 유지하면서도 지나치게 도덕판정으로 고정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
