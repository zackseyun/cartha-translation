lexical_decisions:
- source_word: וַיֵּרֶד
  english_pob_choice: Then he went down
  chosen_korean: 내려가서
  alternatives_korean:
  - 내려갔습니다
  - 그리고 내려갔습니다
  lexicon: HALOT
  rationale: 히브리어 동사 ירד의 기본 의미인 ‘내려가다’를 살리되, 서술 흐름에 맞게 연결어미 ‘-서’로 자연스럽게 옮겼습니다.
- source_word: וַיְדַבֵּר לָאִשָּׁה
  english_pob_choice: spoke to the woman
  chosen_korean: 그 여자에게 말하자
  alternatives_korean:
  - 그 여자에게 말했습니다
  - 그 여자와 이야기했습니다
  lexicon: HALOT
  rationale: לְ가 붙은 ‘말하다’의 대상을 살려 ‘-에게’로 옮겼고, 히브리어 서술의 진행감을 위해 ‘말하자’로 연결했습니다.
- source_word: וַתִּישַׁר
  english_pob_choice: she was pleasing
  chosen_korean: 좋게 보였습니다
  alternatives_korean:
  - 마음에 들었습니다
  - 기뻐 보였습니다
  - 옳게 보였습니다
  lexicon: HALOT
  rationale: ישר의 여기서의 뜻은 단순한 미감보다 ‘삼손의 판단에 맞고 좋게 여겨짐’에 가깝기 때문에, 평가적 뉘앙스를 살려 ‘좋게 보였습니다’로 옮겼습니다.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  english_pob_choice: in Samson’s eyes
  chosen_korean: 삼손의 눈에
  alternatives_korean:
  - 삼손에게
  - 삼손의 보기에
  - 삼손 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에’의 이미지를 보존하여 평가의 기준이 삼손 자신에게 있음을 드러냈습니다.
theological_decisions:
- issue: ‘좋게 보였습니다’가 단순한 호감인지, 판단/분별의 언어인지
  chosen_reading: 호감과 판단을 함께 담는 평가 표현으로 유지했습니다.
  alternative_readings:
  - ‘마음에 들었습니다’로 더 감각적으로 옮김
  - ‘옳게 보였습니다’로 판단 의미를 더 강하게 옮김
  rationale: 사사기의 문맥상 개인의 주관적 판단이 강조되므로, 히브리어 관용구의 평가성을 유지하면서도 지나치게 도덕판정으로 고정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
