  naturalness: 합쇼체 서술로 자연스럽고, ‘그의 분노가 타올랐으며’도 히브리어의 관용적 불타는 분노 이미지를 무리 없이 살립니다. 지명 ‘아스글론’과 ‘갈아입을 옷’도 자연스럽습니다.
  terminology: YHWH는 제공된 영어 POB의 명시적 표기 방침에 따라 ‘야훼’로 통일하는 것이 필요합니다. 또한 현 각주는 본문이 이미 ‘그들의 옷’이라고 번역했는데도 ‘또는 그들의 옷’이라고 하여 대안 기능을 하지 못하므로 고쳐야 합니다.
