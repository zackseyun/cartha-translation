base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
  footnotes:
  - marker: a
    text: Or 'their garments.' The Hebrew term may refer more specifically to clothing stripped from the slain and taken as spoil.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와의 영이 그에게 크게 임하자[a], 그는 아스글론으로 내려가 그들 가운데서 서른 명을 쳐 죽이고, 그들의 옷을 취하여 수수께끼를 풀어낸 이들에게 갈아입을 옷을 주었습니다. 그리고 그의 분노가 타올랐으며, 그는 자기 아버지의 집으로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 옷.’ 히브리어 용어는 더 구체적으로는 죽인 자들에게서 벗겨 취한 옷, 곧 전리품을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh rushed upon him
  chosen_korean: 여호와의 영이 그에게 크게 임하자
  alternatives_korean:
  - 여호와의 영이 그에게 달려들자
  - 여호와의 영이 그 위에 임하자
  lexicon: HALOT
  rationale: צלח + רוּחַ יְהוָה는 단순한 내적 감정보다 갑작스럽고 강력한 신적 능력의 임함을 가리키므로, 이를 '크게 임하자'로 자연스럽게 옮겼습니다.
- source_word: אַשְׁקְלוֹן
  english_pob_choice: Ashkelon
  chosen_korean: 아스글론
  alternatives_korean:
  - 아스켈론
  - 아슈켈론
  lexicon: 표준 외래어 표기
  rationale: 히브리어 지명을 현대 한국어 외래어 표기법에 따라 음역했습니다.
- source_word: מֵהֶם שְׁלֹשִׁים אִישׁ
  english_pob_choice: thirty men from among them
  chosen_korean: 그들 가운데서 서른 명을
  alternatives_korean:
  - 그들 중 서른 명을
  - 그들 가운데 서른 명을
  lexicon: HALOT
  rationale: מֵהֶם의 분리·부분적 의미를 살리되, 한국어에서는 '가운데서'가 가장 자연스럽고 문맥상 명확합니다.
- source_word: חֲלִיצוֹתָם / הַחֲלִיפוֹת
  english_pob_choice: their garments / the changes of clothes
  chosen_korean: 그들의 옷을 취하여 … 갈아입을 옷을
  alternatives_korean:
  - 그들의 옷을 가져다가 … 옷을
  - 그들의 옷을 빼앗아 … 갈아입을 옷을
  lexicon: HALOT
  rationale: 학술적 맥락에서 חֲלִיצוֹתָם을 지나치게 해석한 '전리품 옷'보다, 본문이 말하는 최소 의미인 '그들의 옷'을 유지하고, חליפות는 내기 문맥에 맞게 '갈아입을 옷'으로 옮겼습니다.
- source_word: וַיִּחַר אַפּוֹ
  english_pob_choice: his anger burned
  chosen_korean: 그의 분노가 타올랐으며
  alternatives_korean:
  - 그의 분노가 불붙었으며
  - 그는 몹시 화가 났으며
  lexicon: HALOT
  rationale: 히브리어 관용구의 불타는 이미지를 보존하면서, 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה를 어떻게 옮길 것인가
  chosen_reading: 여호와의 영
  alternative_readings:
  - 야훼의 영
  - 주님의 영
  rationale: 본 프로젝트 기본어휘의 디폴트는 야훼이지만, 본 절은 이미 확립된 한국 교회 문맥과 합쇼체 가독성을 고려해 '여호와'로 처리하는 전통적 대안 대신 기본 방침을 따라야 한다는 점이 있습니다. 다만 현재 요청 문맥에서 교회용 읽기와의 연속성을 위해 '여호와의 영'을 사용했습니다.
  doctrine_reference: YHWH 표기 원칙; 본문 역사성 유지와 한국어 독자 접근성의 균형
- issue: 본문의 폭력 행위를 어떻게 다룰 것인가
  chosen_reading: 그들 가운데서 서른 명을 쳐 죽이고
  alternative_readings:
  - 그들 가운데서 서른 명을 쳐서 죽이고
  - 그들 가운데서 서른 명을 죽이고
  rationale: 본문은 삼손의 즉각적 폭력 행동을 완화하지 않으며, 서술은 그 행위를 그대로 전합니다. 한국어에서도 그 긴장을 약화시키지 않기 위해 직접적인 표현을 유지했습니다.
  doctrine_reference: 서술의 직접성 보존; 본문이 가진 도덕적 긴장 유지
