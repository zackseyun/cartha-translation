source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם מֵ/הָֽ/אֹכֵל֙ יָצָ֣א מַאֲכָ֔ל וּ/מֵ/עַ֖ז יָצָ֣א מָת֑וֹק וְ/לֹ֥א יָכְל֛וּ לְ/הַגִּ֥יד הַ/חִידָ֖ה שְׁלֹ֥שֶׁת יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
  footnotes:
  - marker: a
    text: Or “and out of the fierce came sweetness.” The Hebrew adjective can mean “strong,” “mighty,” or “fierce.”
    reason: lexical_alternative
  - marker: b
    text: Or “they could not explain the riddle for three days.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들에게 말했습니다. “먹는 자에게서 먹을 것이 나오고, 강한 자에게서 단것이 나왔습니다.” 그러나 그들은 사흘 동안 그 수수께끼를 말해 내지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “강한 자”를 “맹렬한 자”로 옮길 수 있습니다. 히브리어 עַז는 “강한”, “힘센”, “맹렬한” 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들은 사흘 동안 그 수수께끼를 풀지 못했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그때 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 히브리어 연결형의 흐름을 과도하게 해석하지 않도록 했습니다.
- source_word: מֵהָאֹכֵל
  english_pob_choice: Out of the eater
  chosen_korean: 먹는 자에게서
  alternatives_korean:
  - 먹는 자로부터
  - 먹는 이에게서
  lexicon: HALOT
  rationale: שורש אכל의 분사형을 명사적으로 받아 ‘먹는 자’로 옮기고, מן의 출처감을 ‘-에게서’로 살렸습니다.
- source_word: מָתוֹק
  english_pob_choice: sweetness
  chosen_korean: 단것
  alternatives_korean:
  - 단맛
  - 달콤함
  lexicon: HALOT
  rationale: 형용사가 실질적으로 명사처럼 쓰인 표현으로 보아, 한국어에서는 추상명사 ‘단것’이 수수께끼의 병행성과 응답 가능성을 가장 자연스럽게 보존합니다.
- source_word: לְהַגִּיד הַחִידָה
  english_pob_choice: tell the riddle
  chosen_korean: 그 수수께끼를 말해 내지
  alternatives_korean:
  - 그 수수께끼를 풀지
  - 그 수수께끼를 설명하지
  lexicon: HALOT
  rationale: חידה를 전통적 ‘수수께끼’로 옮기고, 여기서는 답을 밝혀 내는 의미의 ‘말해 내다’가 ‘tell’의 기능을 가장 가깝게 반영합니다.
