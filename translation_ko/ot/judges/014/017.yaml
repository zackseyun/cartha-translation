revisions:
- from: 그가 머무는 그 일곱 날 동안 그녀는 그에게 매달려 울었습니다[a]. 그리고 일곱째 날에 그가 그녀에게 말했는데, 그녀가 그를 몹시 압박했기 때문입니다. 그러자 그녀는 그 수수께끼를 자기 민족의 아들들에게 말했습니다[b].
  to: 그들에게 잔치가 있던 일곱 날 동안 그녀는 그에게 매달려 울었습니다[a]. 일곱째 날에, 그녀가 그를 몹시 압박하자 그가 그녀에게 그 수수께끼를 알려 주었습니다. 그러자 그녀는 그 수수께끼를 자기 민족의 남자들에게 말했습니다[b].
  rationale: ‘잔치가 있던’으로 אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה를 충실히 복원했습니다. 압박의 원인을 ‘그녀가 그를 몹시 압박하자’로 자연스럽게 연결하고, 삼손이 알려 준 내용인 수수께끼를 한국어에서 명시하여 뒤 문장과의 연결을 분명히 했습니다. 마지막 대상은 남성 복수의 문맥적 의미를 보존하면서 자연스러운 한국어로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:00Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘그가 머무는 그 일곱 날 동안’은 히브리어 אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה(‘그들에게 잔치가 있었던’)를 ‘그가 머물렀다’라는 뜻으로 바꾸므로 수정이 필요합니다. 또한 ‘말했는데, ... 때문입니다’는 히브리어의 인과관계는 반영하지만 한국어 문장 연결이 부자연스럽습니다.
  naturalness: ‘그들에게 잔치가 있던 일곱 날 동안’, ‘그녀가 그를 몹시 압박하자’로 옮기면 현대 표준 한국어 합쇼체에서 자연스럽고, 서사 흐름도 명료합니다. ‘자기 민족의 남자들’은 직역투인 ‘아들들’보다 자연스러우면서 남성 복수 בני를 문맥에 맞게 보존합니다.
  terminology: מִשְׁתֶּה는 ‘잔치’로, חִידָה는 ‘수수께끼’로 유지했습니다. עַל־의 압박적 뉘앙스는 ‘그에게 매달려 울었습니다’와 각주로 보존했습니다. לִבְנֵי עַמָּהּ는 문맥상 그녀의 동족 남성들을 가리키므로 ‘자기 민족의 남자들’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘그가 머무는 그 일곱 날’
    rationale: 원문은 삼손이 머문 기간을 말하지 않고, ‘그들에게 잔치가 있었던 일곱 날’을 수식합니다. 현 번역은 잔치라는 핵심 정보를 누락하고 주어·의미를 변경합니다.
  - severity: medium
    issue: ‘그가 그녀에게 말했는데, 그녀가 그를 몹시 압박했기 때문입니다’
    rationale: 인과절이 독립된 ‘때문입니다’ 종결로 이어져 서사문으로 부자연스럽습니다. 히브리어의 인과관계를 자연스러운 종속 연결로 표현하는 것이 좋습니다.
  - severity: low
    issue: ‘자기 민족의 아들들에게’
    rationale: 직역의 장점은 있으나 현대 한국어에서는 부자연스럽습니다. 문맥상 남성 집단을 분명히 하는 ‘자기 민족의 남자들에게’가 자연스럽고 원문의 성별 표지도 보존합니다.
