reference: Judges 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֤בְךְּ עָלָי/ו֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים אֲשֶׁר הָיָ֥ה לָ/הֶ֖ם הַ/מִּשְׁתֶּ֑ה וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יַּגֶּד לָ/הּ֙ כִּ֣י הֱצִיקַ֔תְ/הוּ וַ/תַּגֵּ֥ד הַ/חִידָ֖ה לִ/בְנֵ֥י עַמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
  footnotes:
  - marker: a
    text: Or 'She wept before him' or 'She cried to him.' The Hebrew idiom literally says she 'wept on him,' conveying sustained emotional pressure.
    reason: lexical_alternative
  - marker: b
    text: '''The sons of her people'' may refer more specifically to the men of her own people, likely the Philistine companions in the immediate context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 잔치가 있던 일곱 날 동안 그녀는 그에게 매달려 울었습니다[a]. 일곱째 날에, 그녀가 그를 몹시 압박하자 그가 그녀에게 그 수수께끼를 알려 주었습니다. 그러자 그녀는 그 수수께끼를 자기 민족의 남자들에게 말했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 위에 울었다’는 뜻의 히브리어 관용구로, 그에게 지속적으로 정서적 압박을 가하며 울었다는 뉘앙스를 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘자기 민족의 남자들’은 문맥상 그녀와 같은 민족에 속한 남성들, 곧 가까운 동료들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּ֤בְךְּ עָלָי/ו֙
  english_pob_choice: She wept on him
  chosen_korean: 그에게 매달려 울었습니다
  alternatives_korean:
  - 그 앞에서 울었습니다
  - 그에게 울부짖었습니다
  - 그 위에 울었습니다
  lexicon: HALOT
  rationale: עַל + 대명사와 결합한 ‘울다’는 단순한 장소가 아니라 지속적으로 압박을 가하는 울음을 뜻하므로, 한국어로는 ‘매달려 울다’가 그 강도를 가장 잘 살립니다.
- source_word: שִׁבְעַ֣ת הַ/יָּמִ֔ים
  english_pob_choice: the seven days
  chosen_korean: 그 일곱 날 동안
  alternatives_korean:
  - 일곱 날 동안
  - 그 일곱 날 내내
  lexicon: HALOT
  rationale: 정관사 있는 기간 표현은 서술상 전체 기간을 가리키므로, 자연스러운 한국어인 ‘그 일곱 날 동안’으로 옮겼습니다.
- source_word: הֱצִיקַ֔תְ/הוּ
  english_pob_choice: she pressed him hard
  chosen_korean: 그를 몹시 압박했기 때문입니다
  alternatives_korean:
  - 그를 심하게 졸랐기 때문입니다
  - 그를 강하게 재촉했기 때문입니다
  - 그를 괴롭혔기 때문입니다
  lexicon: HALOT
  rationale: צוק의 히필은 단순 요청이 아니라 상대를 짓누르는 강한 압박을 뜻하므로, ‘몹시 압박하다’로 긴장감을 살렸습니다.
- source_word: לִ/בְנֵ֥י עַמָּֽ/הּ
  english_pob_choice: the sons of her people
  chosen_korean: 자기 민족의 아들들에게
  alternatives_korean:
  - 자기 백성에게
  - 그 민족의 남자들에게
  - 자기 민족의 남자들에게
  lexicon: HALOT
  rationale: 직역은 ‘민족의 아들들’이지만, 한국어에서는 ‘자기 민족의 아들들’이 문맥상 남성 집단을 유지하면서도 자연스럽습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘wept on him’의 압박성 보존
  chosen_reading: 부드러운 ‘그 앞에서 울었습니다’보다 관계적 압박을 드러내는 ‘그에게 매달려 울었습니다’를 본문에 채택했습니다.
  alternative_readings:
  - 그 앞에서 울었습니다
  - 그에게 울부짖었습니다
  rationale: 본문은 단순한 감정 표출이 아니라 반복적이고 강한 정서적 압력을 강조하므로, 그 뉘앙스를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: source-language fidelity
