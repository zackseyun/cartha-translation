translation:
  language: ko
  text: 그들이 그를 보았을 때, 서른 명의 동반자를 택하여 그와 함께 있게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동반자’는 ‘친구’로도 옮길 수 있으며, 문맥상 혼인 잔치의 수행자나 신랑 들러리를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ...
  chosen_korean: 그들이 그를 보았을 때
  alternatives_korean:
  - 그 일이 일어났습니다
  - 그리고
  lexicon: HALOT
  rationale: 히브리어 서술 도입부를 한국어의 자연스러운 시간 부사절로 풀어, 단순한 접속 이상의 서사 진행을 살렸습니다.
- source_word: כִּרְאוֹתָם
  english_pob_choice: when they saw
  chosen_korean: 그들이 그를 보았을 때
  alternatives_korean:
  - 그를 보자
  - 그를 보는 즉시
  lexicon: HALOT
  rationale: כ + 부정사구의 시간적 의미를 살려 ‘~을 보았을 때’로 옮겼습니다.
- source_word: מֵרֵעִים
  english_pob_choice: companions
  chosen_korean: 동무
  alternatives_korean:
  - 동반자
  - 동료
  - 친구들
  lexicon: HALOT
  rationale: 관계적으로 함께하는 사람들을 가리키므로 ‘동무’로 옮겼고, ‘친구들’보다 서사 문맥의 느슨한 동반 관계를 더 잘 드러냅니다.
- source_word: וַיִּהְיוּ אִתּוֹ
  english_pob_choice: and they were with him
  chosen_korean: 그들은 그와 함께 있었습니다
  alternatives_korean:
  - 그들은 그와 동행했습니다
  - 그들은 그와 같이 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 평이한 진술을 그대로 살려, 지나친 해석을 더하지 않고 ‘~와 함께 있었습니다’로 직역했습니다.
