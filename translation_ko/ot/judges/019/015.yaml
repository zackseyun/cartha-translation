id: JDG.19.15
reference: Judges 19:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּסֻ֣רוּ שָׁ֔ם לָ/ב֖וֹא לָ/ל֣וּן בַּ/גִּבְעָ֑ה וַ/יָּבֹ֗א וַ/יֵּ֨שֶׁב֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/אֵ֥ין אִ֛ישׁ מְאַסֵּֽף אוֹתָ֥/ם הַ/בַּ֖יְתָ/ה לָ/לֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
  footnotes:
  - marker: a
    text: Or 'in the street of the city'; the Hebrew term can denote a broad public place or square.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'no man,' meaning no resident offered them hospitality.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그곳으로 비켜 들어가 기브아에서 밤을 지내려 하였습니다[a]. 그가 안으로 들어가 그 도시의 열린 광장[b]에 앉았는데, 자기 집으로 그들을 거두어 밤을 지내게 하는 사람이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 도시의 거리에서'; 히브리어는 넓은 공공장소나 광장을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '사람이 없었으니'라는 뜻으로, 주민이 환대를 제공하지 않았음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  english_pob_choice: They turned aside
  chosen_korean: 비켜 들어가
  alternatives_korean:
  - 돌아섰습니다
  - 들렀습니다
  lexicon: HALOT
  rationale: 여행 길에서 벗어나 그곳으로 방향을 틀어 들어가는 동작을 자연스럽게 살리되, 단순한 '들르다'보다 이동 방향의 변화가 분명하게 드러나도록 했습니다.
- source_word: לָבֹוא לָלוּן
  english_pob_choice: to go in and spend the night
  chosen_korean: 들어가 ... 밤을 지내려 하였습니다
  alternatives_korean:
  - 들어가 ... 묵으려 하였습니다
  - 들어가 ... 하룻밤 머물려 하였습니다
  lexicon: HALOT
  rationale: לָבוֹא와 לָלוּן의 연속 동작을 살려 '들어가'와 '밤을 지내다'로 옮겼습니다. '밤을 지내다'는 숙박의 구체성을 유지하면서도 현대 한국어에서 자연스럽습니다.
- source_word: בִּרְחוֹב הָעִיר
  english_pob_choice: in the open square of the city
  chosen_korean: 그 도시의 열린 광장
  alternatives_korean:
  - 그 도시의 거리
  - 그 도시의 마을 광장
  lexicon: HALOT
  rationale: רְחוֹב은 좁은 '거리'보다 넓은 공개 공간을 가리킬 수 있으므로, POB의 주해 취지를 따라 '열린 광장'으로 옮겨 공적인 장소의 뉘앙스를 살렸습니다.
- source_word: מְאַסֵּף אוֹתָם
  english_pob_choice: gathering them into his house
  chosen_korean: 자기 집으로 그들을 거두어
  alternatives_korean:
  - 자기 집으로 그들을 모아
  - 자기 집으로 맞아들여
  lexicon: HALOT
  rationale: אַסֵּף는 단순한 '받아들이다'보다 '거두다/모으다'의 수집·인도 뉘앙스가 있어, 환대의 맥락을 살리면서도 동사의 의미를 유지했습니다.
theological_decisions:
- issue: 히브리어 אִישׁ의 성별 표지와 관용적 일반 의미
  chosen_reading: '''사람이 없었습니다''가 아니라 ''자기 집으로 그들을 거두어 밤을 지내게 하는 사람이 없었습니다''로 옮겨, 남성 단수 표현이 지닌 원문 형태를 과도하게 중화하지 않되 문맥상 일반적 거절의 의미를 전달했습니다.'
  alternative_readings:
  - 아무도 없었습니다
  - 어떤 사람도 그들을 집으로 들이지 않았습니다
  rationale: 원문은 אִישׁ를 사용해 구체적 남성형을 드러내지만, 문맥상 환대 제공의 부재를 말하므로 의미를 직설적으로 전달하는 것이 중요합니다.
  doctrine_reference: 문자적·문맥적 의미 보존 원칙
