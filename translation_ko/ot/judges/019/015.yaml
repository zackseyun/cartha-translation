revisions:
- from: 그들은 그곳으로 비켜 들어가 기브아에서 밤을 지내려 하였습니다[a]. 그가 안으로 들어가 그 도시의 열린 광장[b]에 앉았는데, 자기 집으로 그들을 거두어 밤을 지내게 하는 사람이 없었습니다.
  to: 그들은 기브아에 들어가 밤을 지내려고 그곳으로 방향을 돌렸습니다. 그는 들어가 그 도시의 넓은 광장[a]에 앉았습니다. 그러나 그들을 자기 집으로 거두어들여 밤을 지내게 할 사람이 없었습니다[b].
  rationale: 각주 표지를 실제로 설명하는 본문 어휘인 '넓은 광장'과 '사람이 없었습니다'에 각각 연결했습니다. 본문은 히브리어의 복수에서 단수로의 전환을 유지하고, 길에서 벗어나 기브아로 향한 목적과 숙박 환대의 부재를 자연스러운 합쇼체로 옮겼습니다.
