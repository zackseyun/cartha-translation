  source_fidelity: 본문의 기본 의미는 대체로 보존하지만, 각주 표지가 해당 어휘와 연결되지 않아 반드시 바로잡아야 합니다. 또한 וַיָּסֻרוּ의 여행 경로 이탈은 '비켜 들어가'보다 '방향을 돌렸습니다'가 더 명료하며, בִּרְחוֹב הָעִיר는 문맥상 '넓은 광장'이 자연스럽습니다.
  naturalness: '''그곳으로 비켜 들어가''와 ''열린 광장''은 현대 표준 한국어에서 다소 어색합니다. ''그곳으로 방향을 돌렸습니다''와 ''넓은 광장''으로 다듬고, 마지막 절은 ''거두어들여''를 사용하면 원문의 환대 맥락과 한국어 어법을 함께 살릴 수 있습니다.'
  terminology: 기브아는 통용되는 지명 표기이며 유지할 수 있습니다. '밤을 지내다'와 '자기 집으로 거두어들이다'는 각각 לון 및 אסף의 의미와 서사적 환대 맥락을 적절히 반영합니다.
