- from: 그들이 계속 지나가며 자기 길을 갔습니다. 해가 그들 위에 지고, 베냐민에 속한 기브아 근처에 이르렀습니다.
  to: 그들은 지나 계속 길을 갔습니다. 베냐민에 속한 기브아 가까이에서 해가 저물었습니다.
  rationale: 해가 여행자들에게 닥쳤다는 히브리어 관용구를 한국어의 자연스러운 시간·장소 서술로 옮겼습니다. 두 이동 동사, 기브아의 베냐민 소속, 그리고 기브아 근처라는 지리적 정보를 유지했습니다.
