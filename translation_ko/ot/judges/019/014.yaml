translation:
  language: ko
  text: 그들이 계속 지나가며 자기 길을 갔습니다. 해가 그들 위에 지고, 베냐민에 속한 기브아 근처에 이르렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  english_pob_choice: they passed on
  chosen_korean: 계속 지나가며
  alternatives_korean:
  - 지나갔습니다
  - 지나가며
  lexicon: HALOT
  rationale: 연속 서술의 동사 עבר를 한국어에서 자연스럽게 살리되, 다음 동사와 겹치지 않게 ‘계속 지나가며’로 옮겼습니다.
- source_word: וַיֵּלֵכוּ
  english_pob_choice: went their way
  chosen_korean: 자기 길을 갔습니다
  alternatives_korean:
  - 가던 길을 갔습니다
  - 계속 갔습니다
  lexicon: HALOT
  rationale: הלך의 일반적 이동을 반영하면서도 앞 동사의 반복을 피하고, 서술 흐름상 독립된 두 번째 이동 동사임을 드러냈습니다.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  english_pob_choice: the sun set on them
  chosen_korean: 해가 그들 위에 지고
  alternatives_korean:
  - 해가 그들에게 졌고
  - 해가 그들 위에 내려
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘해가 그들 위에 지고’로 두어, 밤이 여행자들에게 닥쳐온다는 히브리어 관용 표현을 보존했습니다.
- source_word: אֲשֶׁר לְבִנְיָמִן
  english_pob_choice: which belongs to Benjamin
  chosen_korean: 베냐민에 속한
  alternatives_korean:
  - 베냐민의
  - 베냐민 지역에 있는
  lexicon: HALOT
  rationale: 지파/영역적 소속을 나타내므로, 단순한 위치보다 ‘속한’이 소속과 연관성을 더 정확히 드러냅니다.
