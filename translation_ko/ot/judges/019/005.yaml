  lexicon: HALOT
  rationale: 작은 양의 구체성을 살리되, 현대 한국어에서 가장 자연스러운 음식 표현으로 옮겼습니다.
- source_word: וְאַחַר תֵּלֵכוּ / and afterward you may go
