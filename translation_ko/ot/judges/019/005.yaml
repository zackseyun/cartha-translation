theological_decisions:
- issue: 호의의 관용구를 직역할지 의역할지
  chosen_reading: 원문의 '마음을'을 살리되, 식사로 힘을 회복하라는 관용적 의미를 드러내는 '마음을 새롭게 하십시오'로 옮겼습니다.
  alternative_readings:
  - 마음을 강하게 하십시오
  - 힘을 보충하십시오
  rationale: 본문의 환대 표현은 단순한 음식 권유를 넘어 기력을 회복하게 하려는 말이므로, 한국어에서도 그 기능이 드러나야 합니다.
  doctrine_reference: '번역 원칙: 원문 관용구의 의미 보존'
- issue: 복수 동사의 지시 대상
  chosen_reading: 직접 화법은 사위에게 향하지만, 끝의 복수형은 동행한 일행 전체를 가리킬 수 있으므로 한국어는 단수 정중형으로 처리하되 의미상 복수 가능성은 각주로 남겼습니다.
  alternative_readings:
  - 사위 한 사람만을 가리키는 것으로 읽기
  - 일행 전체를 가리키는 것으로 읽기
  rationale: 히브리어 문법과 문맥을 함께 반영해야 하며, 한국어 본문은 지나치게 어색한 이중 호칭을 피하는 것이 적절합니다.
  doctrine_reference: 문법-문맥 조정 원칙
