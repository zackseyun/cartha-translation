base_translation:
  language: en
  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
  footnotes:
  - marker: a
    text: Or 'pressed him' / 'entreated him strongly'; the Hebrew verb conveys persistent urging.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자가 떠나려고 일어났습니다. 그런데 그의 장인이 그를 재촉하므로, 그는 되돌아가 그곳에서 밤을 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 강하게 재촉했다’ / ‘간청했다’. 히브리어 동사는 끈질긴 압박과 설득을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָאִישׁ לָלֶכֶת
  english_pob_choice: Then the man got up to go
  chosen_korean: 그 남자가 떠나려고 일어났습니다
  alternatives_korean:
  - 그 남자가 가려고 일어났습니다
  - 그 남자가 떠나기 위해 일어났습니다
  lexicon: HALOT
  rationale: קום의 서사적 진행과 לָלֶכֶת의 목적 의미를 함께 살리되, 현대 한국어에서는 ‘떠나려고 일어났습니다’가 가장 자연스럽고 간결합니다.
- source_word: וַיִּפְצַר בּוֹ
  english_pob_choice: urged him
  chosen_korean: 그를 재촉하므로
  alternatives_korean:
  - 그를 강하게 간청하므로
  - 그를 계속 졸라대므로
  lexicon: HALOT
  rationale: פצר는 단순 권유보다 끈질긴 압박과 재촉을 나타내므로, ‘재촉하다’가 그 긴박감을 비교적 정확하게 전달합니다.
- source_word: חֹתְנוֹ
  english_pob_choice: his father-in-law
  chosen_korean: 그의 장인
  alternatives_korean:
  - 그의 장인어른
  - 그의 처가 아버지
  lexicon: HALOT
  rationale: 히브리어 친족 용어를 한국어의 표준 친족 표현으로 옮기면 ‘장인’이 가장 직역에 가깝고 자연스럽습니다.
- source_word: וַיָּשָׁב וַיָּלֶן שָׁם
  english_pob_choice: he turned back and spent the night there
  chosen_korean: 그는 되돌아가 그곳에서 밤을 지냈습니다
  alternatives_korean:
  - 그는 돌아서서 거기서 밤을 보냈습니다
  - 그는 되돌아가 그곳에 묵었습니다
  lexicon: HALOT
  rationale: שׁוב의 방향 전환을 ‘되돌아가’로 살리고, לון의 숙박 의미는 ‘밤을 지냈습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 서사적 행위의 연속 표현
  chosen_reading: 연결된 동사들을 한국어에서도 순차적으로 살려, 떠나려는 의도와 장인의 재촉, 그리고 되돌아감의 전환을 드러냈습니다.
  alternative_readings:
  - 문장을 더 압축해 한 번에 요약하는 방식
  - ‘돌아섰다’로만 옮겨 전환을 약화시키는 방식
  rationale: 이 절은 사건의 흐름이 핵심이므로, 동작의 순서를 보존하는 번역이 독자가 본문 전개를 따라가기에 유리합니다.
  doctrine_reference: 서사 본문 해석 원칙
