  to: 그 무렵[a], 이스라엘에는 왕이 없었습니다. 에브라임 산지의 외딴 지역에 한 레위 사람이 살고 있었는데, 그는 유다의 베들레헴 출신인 한 여인, 곧 첩[b]을 자기에게 맞아들였습니다.
