  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: ko
  text: 그 무렵[a], 이스라엘에는 왕이 없었습니다. 에브라임 산지의 외딴 지역에 한 레위 사람이 살고 있었는데, 그는 유다의 베들레헴 출신인 한 여인, 곧 첩[b]을 자기에게 맞아들였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 무렵, 이스라엘에는 왕이 없었습니다.” 히브리어에서는 이 절이 앞 절과 나란히 이어져 있어, 독립된 진술로도 시간적 배경을 나타내는 절로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘첩’은 당시 아내보다 낮은 사회적 지위를 지닌, 인정된 결합 관계의 여성을 가리키며, 단순한 비공식적 상대를 뜻하지는 않습니다.
    reason: cultural_note
