  verdict: revise
  source_fidelity: 전반적으로 히브리어의 사건 순서와 핵심 어휘를 잘 따릅니다. 그러나 מִתְדַּפְּקִים의 계속·반복 동작에 ‘두드리기 시작했습니다’라고 옮기면 원문에 없는 시작의 의미가 더해집니다. 또한 וְנֵדָעֶנּוּ는 청원/의도 표현이므로 ‘우리가 그를 알겠습니다’보다 ‘우리가 그를 알게 하십시오’가 문법적 기능을 더 잘 반영합니다.
  naturalness: ‘보십시오’는 현대 한국어 서술문에서 다소 부자연스럽고 독자에게 직접 말을 거는 듯합니다. 문맥 전환을 나타내는 ‘그런데’가 자연스럽습니다. ‘그 성읍의 사람들이—무뢰한들이—’도 삽입 표기보다 ‘그 성읍의 무뢰한들이’가 현대 문장에 자연스럽습니다.
  terminology: ‘무뢰한들’은 אַנְשֵׁי בְנֵי בְלִיַּעַל의 무법하고 타락한 성격을 간결하게 나타내므로 유지할 수 있습니다. ‘알다’는 본문에서 완곡어법으로 보존하고, 성적 폭력의 뜻은 각주에서 밝혀야 합니다.
