  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
  footnotes:
  - marker: a
    text: Or, more literally, “sons of worthlessness”; that is, lawless or wicked men.
    reason: lexical_alternative
  - marker: b
    text: “Know him” is a sexual euphemism here, meaning they intended to sexually violate him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 즐거이 지내고 있을 때, 그런데 그 성읍의 무뢰한들이 그 집을 에워싸고 문을 두드리고 있었습니다. 그들은 그 집 주인인 노인에게 말했습니다. “당신의 집에 들어온 그 사람을 내보내십시오. 우리가 그를 알게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그를 알다’라는 완곡어법을 사용하며, 여기서는 그에게 성적 폭력을 가하려는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  english_pob_choice: making their hearts merry
  chosen_korean: 마음을 즐겁게 하고 있을 때에
  alternatives_korean:
  - 마음을 기쁘게 하고 있을 때에
  - 즐겁게 지내고 있을 때에
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘마음을 좋게 하다’는 뜻을 자연스러운 한국어로 옮기되, 연회 분위기의 즐거움을 살리기 위해 ‘즐겁게 하고’로 번역했습니다.
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  english_pob_choice: worthless men
  chosen_korean: 무뢰한들
  alternatives_korean:
  - 무가치한 사람들
  - 사악한 사람들
  - 불량한 사람들
  lexicon: HALOT
  rationale: ‘벨리알의 아들들’은 도덕적으로 무법한 자들을 가리키는 관용 표현이므로, 한국어에서 그 성격을 압축적으로 드러내는 ‘무뢰한들’이 적절합니다.
- source_word: וְנֵדָעֶנּוּ
  english_pob_choice: so that we may know him
  chosen_korean: 우리가 그를 알겠습니다
  alternatives_korean:
  - 우리가 그와 성관계를 맺겠습니다
  - 우리가 그를 욕보이겠습니다
  lexicon: HALOT
  rationale: 본문의 ‘알다’라는 동사를 그대로 살리면서도, 주석 없이도 공격적 의도를 드러내는 문맥을 유지했습니다. 영어 POB의 절제된 처리에 맞춰 본문은 직역을 따릅니다.
theological_decisions:
- issue: וְנֵדָעֶנּוּ의 성적 함의 처리
  chosen_reading: 본문에는 ‘그를 알겠습니다’로 두고, 노골적 해석은 본문 밖에서 처리하지 않았습니다.
  alternative_readings:
  - 그와 성관계를 맺겠습니다
  - 그를 성적으로 욕보이겠습니다
  rationale: 히브리어 ידע의 성적 완곡어법을 그대로 보존해 제노바 19장과의 문학적 울림을 살렸습니다. 본문 차원에서는 과도한 확대해석을 피하고, 독자가 문맥으로 긴장을 느끼게 하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3
