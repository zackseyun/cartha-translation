revisions:
- from: 그들이 마음을 즐겁게 하고 있을 때에, 보십시오, 그 성읍의 사람들이—무뢰한들이—집을 에워싸고 문을 두드리기 시작했습니다. 그들은 집 주인인 늙은 사람에게 말했습니다. "당신의 집에 들어온 그 사람을 밖으로 내보내십시오. 우리가 그를 알겠습니다."[a]
  to: 그들이 즐거이 지내고 있을 때, 그런데 그 성읍의 무뢰한들이 그 집을 에워싸고 문을 두드리고 있었습니다. 그들은 그 집 주인인 노인에게 말했습니다. “당신의 집에 들어온 그 사람을 내보내십시오. 우리가 그를 알게 하십시오.”[a]
  rationale: 서술의 자연스러움을 높이면서도, 히브리어의 돌발적 전환, 무뢰한들의 적대적 행동, 그리고 ‘알다’라는 성적 완곡어법을 유지했습니다. ‘두드리기 시작했다’의 첨가 의미를 제거하고, 요구문의 목적을 나타내는 원문의 문법 기능을 한국어에서 더 정확히 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:37Z'
