    rationale: וְנֵדָעֶנּוּ는 그 사람을 내보내 달라는 요구의 목적/의도를 나타냅니다. 단순 미래 진술인 ‘알겠습니다’보다 허용을 요구하는 형태가 원문 기능에 가깝습니다.
  - severity: low
    issue: ‘보십시오’와 대시 삽입
    rationale: 히브리어 וְהִנֵּה의 돌발적 전환은 살려야 하나, ‘보십시오’는 현대 한국어 서술에서 부자연스럽습니다. 또한 대시로 된 동격 삽입은 불필요하게 번역투입니다.
