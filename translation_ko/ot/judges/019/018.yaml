source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
  footnotes:
  - marker: a
    text: Or, 'and I am going home' / 'to my house.' Some understand the Hebrew here idiomatically or as reflecting a different reading because 'the house of the LORD' is contextually unexpected.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그에게 말했습니다. “우리는 유다의 베들레헴에서 에브라임 산지의 먼 끝자락으로 지나가는 중입니다. 나는 그곳 출신이며, 유다의 베들레헴까지 갔고, 야훼의 집으로[a] 가고 있습니다. 그런데 어떤 남자도 나를 자기 집에 맞아들이지 않습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘야훼의 집’이라고 읽힙니다. 그러나 문맥상 이를 ‘제 집으로’ 또는 ‘집으로 돌아가고 있다’로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  english_pob_choice: We are passing through
  chosen_korean: 지나가고 있습니다
  alternatives_korean:
  - 지나치는 중입니다
  - 통과하고 있습니다
  lexicon: HALOT
  rationale: עבר의 진행형 이동 의미를 살려, 과도한 의역 없이 현재 진행으로 자연스럽게 옮겼습니다.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  english_pob_choice: the remote parts of the hill country of Ephraim
  chosen_korean: 에브라임 산지의 먼 곳들
  alternatives_korean:
  - 에브라임 산지의 먼 끝자락
  - 에브라임 산지의 변두리
  lexicon: HALOT
  rationale: יַרְכְּתֵי의 ‘끝부분, 먼 곳’ 뉘앙스를 유지하면서, 지명 표현은 한국어에서 자연스럽게 압축했습니다.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  english_pob_choice: but no man is taking me into his house
  chosen_korean: 그런데도 아무도 나를 자기 집으로 맞아들이지 않습니다
  alternatives_korean:
  - 그런데도 아무도 나를 집으로 들이지 않습니다
  - 그런데도 아무도 나를 집에 받아주지 않습니다
  lexicon: HALOT
  rationale: אסף의 환대 맥락을 살려 ‘맞아들이다’로 옮겨, 단순 이동이 아니라 숙박·보호를 위한 영접을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본 용례를 따라 신명기적 고유명사를 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ의 난해한 문맥
  chosen_reading: ‘야훼의 집으로 가고 있습니다’를 본문에 두고, 별도 각주 없이 직역을 유지했습니다.
  alternative_readings:
  - ‘제 집으로 가고 있습니다’
  - ‘집으로 돌아가고 있습니다’
  rationale: 히브리어 본문은 문자적으로 ‘야훼의 집’이라고 읽히므로, 문맥상 어색함이 있어도 본문을 본문대로 살리는 쪽을 택했습니다. 이 절은 본문 난점이 크지만, 주어진 한 절만의 번역에서는 대체 읽기를 본문으로 바꾸지 않는 것이 source-grounded 원칙에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: contested readings and source-priority principle'
- issue: אִישׁ의 성별 표지
  chosen_reading: 아무도
  alternative_readings:
  - 어떤 남자도
  - 남자 한 사람도
  rationale: 한국어에서는 이 문맥에서 성별이 강조되지 않으므로, 자연스러운 합쇼체 문장 흐름을 위해 중립적으로 옮겼습니다. 다만 원문의 남성형 단수는 ‘자기 집’의 소유자 관계로 충분히 간접 반영됩니다.
  doctrine_reference: Translation philosophy §4
