  to: 그가 그에게 말했습니다. “우리는 유다의 베들레헴에서 에브라임 산지의 먼 끝자락으로 지나가는 중입니다. 나는 그곳 출신이며, 유다의 베들레헴까지 갔고, 야훼의 집으로[a] 가고 있습니다. 그런데 어떤 남자도 나를 자기 집에 맞아들이지 않습니다.”
  rationale: 마소라 본문의 ‘야훼의 집’을 본문에 그대로 유지하고, 문맥적으로 제기되는 대안 이해는 해당 어구에 연결한 각주로 보존했습니다. אִישׁ의 남성 표지는 ‘어떤 남자도’로 반영했으며, 지리적 표현과 환대 표현은 현대 한국어에서 자연스럽도록 다듬었습니다.
