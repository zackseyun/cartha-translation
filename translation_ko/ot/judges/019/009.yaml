  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤קָם הָ/אִישׁ֙ לָ/לֶ֔כֶת ה֥וּא וּ/פִילַגְשׁ֖/וֹ וְ/נַעֲר֑/וֹ וַ/יֹּ֣אמֶר ל֣/וֹ חֹתְנ֣/וֹ אֲבִ֣י הַֽ/נַּעֲרָ֡ה הִנֵּ֣ה נָא֩ רָפָ֨ה הַ/יּ֜וֹם לַ/עֲרֹ֗ב לִֽינוּ נָ֞א הִנֵּ֨ה חֲנ֤וֹת הַ/יּוֹם֙ לִ֥ין פֹּה֙ וְ/יִיטַ֣ב לְבָבֶ֔/ךָ וְ/הִשְׁכַּמְתֶּ֤ם מָחָר֙ לְ/דַרְכְּ/כֶ֔ם וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: Then the man rose to go[a], he and his concubine and his young man; but his father-in-law, the young woman’s father, said to him, “Look now, the day is waning toward evening. Please stay the night. Look, the day is drawing to a close. Spend the night here, and let your heart be glad. Then tomorrow you may rise early for your journey[c][b], and go to your tent.”
  footnotes:
  - marker: a
    text: Or, 'the day is declining toward evening.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the day has encamped'; that is, it is drawing to a close.
    reason: lexical_alternative
  - marker: c
    text: Or, 'go home.' Literally, 'go to your tent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자가 그의 첩과 그의 젊은 종과 함께 떠나려고 일어나자, 그의 장인 곧 그 젊은 여자의 아버지가 그에게 말했습니다. “자, 이제 날이 저물어 저녁이 되어 갑니다. 부디 이 밤을 여기서 보내십시오. 보십시오, 날이 저물어 갑니다. 여기서 밤을 보내고, 당신의 마음이 즐거우면 좋겠습니다. 그러면 내일 일찍 일어나 길을 떠나고, 당신의 장막으로 가십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저녁을 향해 날이 기울고 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘날이 진을 쳤다’는 뜻으로, 곧 저물어 간다는 말입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 집으로 가십시오.’ 직역하면 ‘당신의 장막으로 가십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 남자
  alternatives_korean:
  - 그 사람
  - 그 남편
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 기본 의미를 살려 ‘남자’로 옮기되, 문맥상 특정 인물을 가리키므로 ‘그’로 지시성을 살렸습니다. ‘남편’은 본문에 없는 관계를 앞당겨 넣을 수 있어 피했습니다.
- source_word: פִילַגְשׁוֹ
  english_pob_choice: his concubine
  chosen_korean: 그의 첩
  alternatives_korean:
  - 그의 후처
  - 그의 부차적 아내
  lexicon: HALOT
  rationale: 사회-법적 지위를 드러내는 표준어인 ‘첩’을 사용했습니다. 본문의 긴장을 약화시키는 ‘아내’ 중심 표현은 피했습니다.
- source_word: נַעֲרוֹ
  english_pob_choice: his young man
  chosen_korean: 그의 젊은 종
  alternatives_korean:
  - 그의 하인
  - 그의 시종
  lexicon: HALOT
  rationale: נַעַר의 범위 중 여기서는 동행하는 수행 인물로 보이므로, ‘젊은’의 문자성과 ‘종’의 기능을 함께 살렸습니다. 단순히 ‘젊은 남자’로만 옮기면 역할이 모호해질 수 있습니다.
- source_word: חֹתְנוֹ / אֲבִי הַנַּעֲרָה
  english_pob_choice: his father-in-law, the young woman’s father
  chosen_korean: 그의 장인 곧 그 젊은 여자의 아버지
  alternatives_korean:
  - 그의 처가 쪽 아버지
  - 그 젊은 여자의 아버지
  lexicon: HALOT
  rationale: 두 표현이 병렬로 붙어 있어 동일 인물을 풀어 설명하는 구조를 따라 ‘장인 곧 … 아버지’로 옮겼습니다. ‘여자’보다 ‘젊은 여자’가 נַעֲרָה의 뜻을 더 정확히 반영합니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 자, 이제
  alternatives_korean:
  - 보십시오
  - 보아라
  lexicon: HALOT
  rationale: 호소와 주의를 환기하는 담화 표지이므로, 현대 한국어에서 자연스러운 권유·주의 환기 표현인 ‘자, 이제’로 처리했습니다.
- source_word: רָפָה הַיּוֹם לַעֲרֹב / חֲנוֹת הַיּוֹם
  english_pob_choice: the day is waning toward evening / the day is drawing to a close
  chosen_korean: 날이 저물어 저녁이 되어 갑니다 / 날이 저물어 갑니다
  alternatives_korean:
  - 해가 기울어 저녁이 됩니다
  - 하루가 끝나 갑니다
  lexicon: HALOT
  rationale: 두 절은 서로 다른 이미지지만 같은 방향을 가리키므로, 반복을 유지하되 현대 한국어로 ‘저물다’와 ‘되어 가다’로 자연스럽게 살렸습니다. ‘저물다’는 히브리어의 쇠약·기울어짐의 뉘앙스를 비교적 잘 담습니다.
- source_word: לִינוּ נָא / לִין פֹּה
  english_pob_choice: Please stay the night / Spend the night here
  chosen_korean: 부디 이 밤을 여기서 보내십시오 / 여기서 밤을 보내고
  alternatives_korean:
  - 부디 여기서 묵으십시오
  - 여기서 주무십시오
  lexicon: HALOT
  rationale: לון의 숙박 의미를 살리되 현대 독자에게 분명하도록 ‘밤을 보내다’로 옮겼습니다. 두 번째 명령은 첫 번째를 변주한 것이므로 같은 어휘군을 유지했습니다.
- source_word: וְיִיטַב לְבָבֶךָ
  english_pob_choice: let your heart be glad
  chosen_korean: 당신의 마음이 즐거우면 좋겠습니다
  alternatives_korean:
  - 당신의 마음이 기쁘면 좋겠습니다
  - 마음이 즐거워지십시오
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 좋게 되다’이지만, 권유 문맥에서 자연스럽고 품위 있게 들리도록 ‘즐거우면 좋겠습니다’로 옮겼습니다.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  english_pob_choice: Then tomorrow you may rise early
  chosen_korean: 그러면 내일 일찍 일어나
  alternatives_korean:
  - 그러면 내일 새벽에 일어나
  - 그러면 내일 일찍 떠나
  lexicon: HALOT
  rationale: 복수형 명령/허용 표현을 한국어로 자연스럽게 ‘일찍 일어나’로 풀었습니다. 다음 구절의 ‘길을 떠나다’와 함께 전체 동작이 이어지도록 했습니다.
- source_word: לְדַרְכְּכֶם
  english_pob_choice: for your journey
  chosen_korean: 길을 떠나
  alternatives_korean:
  - 여정을 위해
  - 여행을 위해
  lexicon: HALOT
  rationale: ‘길’은 히브리어 דרך의 기본적인 이미지이며, 한국어 관용 ‘길을 떠나다’가 본문의 이동 의미를 가장 자연스럽게 전달합니다.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  english_pob_choice: and go to your tent
  chosen_korean: 당신의 장막으로 가십시오
  alternatives_korean:
  - 당신의 천막으로 가십시오
  - 당신의 집으로 가십시오
  lexicon: HALOT
  rationale: 본문의 구체적 고대 배경을 보존하기 위해 ‘장막’을 유지했습니다. 관용적으로 ‘집’으로 바꾸면 원문 이미지가 희석됩니다.
theological_decisions:
- issue: 여행자의 귀가/거처 표현
  chosen_reading: ‘당신의 장막으로 가십시오’로 옮겨 고대 유목적 배경을 유지했습니다.
  alternative_readings:
  - ‘집으로 가십시오’로 의역
  - ‘거처로 가십시오’로 일반화
  rationale: 본문은 실제로 ‘장막’이라는 구체 이미지를 사용하므로, 이를 보존하는 편이 서사의 시대감과 공간감을 더 정확히 드러냅니다.
  doctrine_reference: 성경 본문의 역사적-서사적 구체성 보존
