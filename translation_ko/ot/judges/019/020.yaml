  to: 그 노인이 말했습니다. 「평안하십시오. 당신에게 필요한 것은 모두 제가 책임지겠습니다. 다만 광장에서[a] 밤을 지내지는 마십시오.」
  rationale: 현대 표준어 합쇼체의 자연스러움을 위해 인물 지칭과 인사 공식을 다듬고, ‘필요’와 책임의 환대 의미를 명료하게 옮겼습니다. 광장에 대한 어휘 각주는 해당 단어에 직접 연결했습니다. 원문의 의미와 경고의 강도는 변경하지 않았습니다.
