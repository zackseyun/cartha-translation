base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
  footnotes:
  - marker: a
    text: Or “in the street.” The Hebrew term refers more specifically to a public open area or square within the town.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 노인이 말했습니다. 「평안하십시오. 당신에게 필요한 것은 모두 제가 책임지겠습니다. 다만 광장에서[a] 밤을 지내지는 마십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거리에서.” 히브리어 낱말은 더 구체적으로 마을 안의 공공의 열린 장소 또는 광장을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  english_pob_choice: The old man
  chosen_korean: 그 늙은 사람
  alternatives_korean:
  - 그 노인
  - 그 나이 든 사람
  lexicon: HALOT
  rationale: 히브리어의 명사+형용사 구조를 자연스럽게 옮기되, 서술적 맥락에 맞게 평이한 ‘늙은 사람’으로 처리했습니다.
- source_word: שָׁלוֹם לָךְ
  english_pob_choice: Peace to you
  chosen_korean: 평화가 당신에게 있습니다
  alternatives_korean:
  - 평화가 당신에게 있기를 바랍니다
  - 평안하십시오
  lexicon: HALOT
  rationale: shalom의 인사/안심 표현을 직역에 가깝게 살리면서도 한국어로는 상태 진술형으로 자연스럽게 옮겼습니다.
- source_word: כָּל מַחְסוֹרְךָ
  english_pob_choice: all your needs
  chosen_korean: 당신의 모든 부족함
  alternatives_korean:
  - 당신의 모든 필요
  - 당신이 부족한 모든 것
  lexicon: HALOT
  rationale: מַחְסוֹר의 핵심 의미인 ‘부족, 결핍’에 맞춰, 호의적 문맥을 해치지 않으면서도 직접적으로 표현했습니다.
- source_word: עָלַי
  english_pob_choice: be my responsibility
  chosen_korean: 제가 책임지겠습니다
  alternatives_korean:
  - 제게 맡기십시오
  - 제게 달려 있습니다
  lexicon: HALOT
  rationale: 직역상 ‘내 위에’이지만, 여기서는 부담을 떠맡는 책임의 의미가 분명하므로 현대 한국어에서 가장 분명한 책임 표현을 선택했습니다.
- source_word: בָּרְחוֹב
  english_pob_choice: in the open square
  chosen_korean: 광장에서
  alternatives_korean:
  - 거리에서
  - 공개된 장소에서
  lexicon: HALOT
  rationale: 영어 POB가 주석으로 밝혔듯이 단순한 거리보다 공공의 열린 공간을 가리키므로, 도시 맥락에서 가장 자연스러운 ‘광장’으로 옮겼습니다.
