  source_fidelity: 히브리어의 환대 제안(‘당신에게 필요한 것은 모두 내 책임이다’)과 광장에서 숙박하지 말라는 경고를 충실히 반영합니다. רַק의 두 용례는 한국어에서 각각 ‘모두’와 ‘다만’으로 자연스럽게 드러내되, 부자연스러운 반복은 피하는 편이 좋습니다.
  naturalness: ‘그 늙은 사람’과 ‘평화가 당신에게 있습니다’는 현대 표준 한국어 서사와 대화에서 다소 어색하거나 거칠게 들립니다. ‘그 노인’ 및 ‘평안하십시오’가 현대적이고 정중한 합쇼체에 더 적합합니다. ‘모든 부족함’도 이 문맥에서는 ‘필요한 것은 모두’가 더 자연스럽습니다.
  terminology: ‘광장’은 רְחוֹב의 마을 안 공공 열린 공간이라는 문맥에 적절합니다. 대안인 ‘거리’는 각주로 유지하는 것이 좋습니다. 신학적 전문 용어 문제는 없습니다.
