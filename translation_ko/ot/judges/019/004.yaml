  text: וַ/יֶּחֱזַק בּ֤/וֹ חֹֽתְנ/וֹ֙ אֲבִ֣י הַֽ/נַּעֲרָ֔ה וַ/יֵּ֥שֶׁב אִתּ֖/וֹ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/יֹּאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַ/יָּלִ֖ינוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
  footnotes:
  - marker: a
    text: Or 'prevailed upon him,' 'pressed him,' or 'detained him.' The Hebrew idiom literally says his father-in-law 'was strong with/against him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 장인, 곧 그 젊은 여자의 아버지가 그에게 머물도록 간곡히 권하였고, 그는 사흘 동안 그와 함께 머물렀습니다. 그들은 먹고 마시고 거기에서 밤을 지냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  english_pob_choice: urged him to stay
  chosen_korean: 그를 붙잡아 두었고
  alternatives_korean:
  - 그를 타일렀고
  - 그에게 간청했고
  - 그를 억지로 붙들었고
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘그에게 강하게 대했다’는 뜻이지만, 문맥상 떠나지 못하게 강하게 만류하거나 붙드는 압박을 나타냅니다. 한국어에서는 이 사회적 압력을 직접 드러내는 ‘붙잡아 두다’가 가장 자연스럽습니다.
- source_word: חֹתְנוֹ
  english_pob_choice: his father-in-law
  chosen_korean: 그의 장인
  alternatives_korean:
  - 그의 처갓아버지
  - 그의 사돈
  lexicon: HALOT
  rationale: 관계 표지를 현대 한국어의 자연스러운 친족어로 옮겼습니다. ‘장인’은 남편의 입장에서의 친족 관계를 바로 드러냅니다.
- source_word: אֲבִי הַנַּעֲרָה
  english_pob_choice: the young woman's father
  chosen_korean: 그 젊은 여자의 아버지
  alternatives_korean:
  - 그 처녀의 아버지
  - 그 소녀의 아버지
  lexicon: HALOT
  rationale: נַעֲרָה는 이 문맥에서 어린 소녀보다 결혼 맥락의 젊은 여성을 가리키므로, ‘젊은 여자’가 가장 무난합니다. 앞의 ‘장인’과 동격임을 분명히 하도록 병기했습니다.
- source_word: וַיֵּשֶׁב אִתּוֹ
  english_pob_choice: he remained with him
  chosen_korean: 그는 사흘 동안 그와 함께 머물렀습니다
  alternatives_korean:
  - 그와 함께 지냈습니다
  - 그와 함께 있었습니다
  - 그와 함께 머물렀습니다
  lexicon: HALOT
  rationale: ישב는 여기서 ‘앉다’보다 ‘머무르다/지내다’의 의미가 자연스럽습니다. ‘사흘 동안’과 결합해 체류의 지속성을 살렸습니다.
- source_word: וַיָּלִינוּ שָׁם
  english_pob_choice: and spent the nights there
  chosen_korean: 거기에서 밤을 지냈습니다
  alternatives_korean:
  - 거기에서 묵었습니다
  - 거기에서 유숙했습니다
  - 거기에서 밤마다 지냈습니다
  lexicon: HALOT
  rationale: לון은 밤을 보내다, 묵다의 뜻이므로 숙박의 의미를 살렸습니다. 복수의 밤을 암시하는 문맥이지만 한국어에서는 자연스럽게 ‘밤을 지냈습니다’로 처리했습니다.
