    issue: ‘그를 붙잡아 두었고’가 물리적 또는 강제적 억류를 암시할 수 있음
    rationale: וַיֶּחֱזַק בּוֹ는 문자적으로 ‘그에게 강하게 하다’인 관용구이며, 문맥상 그가 더 머물도록 강하게 권하거나 설득한 것을 뜻합니다. 한국어 ‘붙잡아 두다’는 원문이 명시하지 않는 물리적 구금 또는 강제를 과도하게 시사할 수 있습니다.
