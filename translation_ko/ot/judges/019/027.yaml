  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨קָם אֲדֹנֶ֜י/הָ בַּ/בֹּ֗קֶר וַ/יִּפְתַּח֙ דַּלְת֣וֹת הַ/בַּ֔יִת וַ/יֵּצֵ֖א לָ/לֶ֣כֶת לְ/דַרְכּ֑/וֹ וְ/הִנֵּ֧ה הָ/אִשָּׁ֣ה פִֽילַגְשׁ֗/וֹ נֹפֶ֨לֶת֙ פֶּ֣תַח הַ/בַּ֔יִת וְ/יָדֶ֖י/הָ עַל הַ/סַּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
  footnotes:
  - marker: a
    text: Or, more literally, 'was fallen at the entrance of the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 주인은 아침에 일어나 집의 문들을 열고 자기 길로 나가려고 나갔습니다. 그런데 보십시오, 그의 첩인 여자가 집 입구에 쓰러져 있었고, 그녀의 두 손은 문지방 위에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘집 입구에 쓰러져 있었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  english_pob_choice: her master
  chosen_korean: 그의 주인
  alternatives_korean:
  - 그의 주인님
  - 그의 남편
  lexicon: HALOT
  rationale: 아ֲדוֹן+3fs는 여기서 소유·지배 관계를 드러내므로, 상호성 뉘앙스가 있는 ‘남편’보다 ‘주인’이 원문과 더 가깝습니다.
- source_word: דַּלְתוֹת הַבַּיִת
  english_pob_choice: the doors of the house
  chosen_korean: 집의 문들
  alternatives_korean:
  - 집의 문
  - 집 문짝들
  lexicon: HALOT
  rationale: 히브리어 복수형을 살려 ‘문들’로 옮겼고, הבית은 구체적 공간으로서 ‘집’이 자연스럽습니다.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  english_pob_choice: went out to go on his way
  chosen_korean: 자기 길로 나가려고 나갔습니다
  alternatives_korean:
  - 자기 여정을 계속하려고 나갔습니다
  - 떠나려고 나갔습니다
  lexicon: HALOT
  rationale: 목적을 나타내는 동사구를 한국어의 ‘-려고’로 살리되, POB의 관용구 ‘go on his way’에 해당하는 ‘자기 길’로 뜻을 보존했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그런데
  lexicon: HALOT
  rationale: 이 서술 표지는 놀라운 장면을 환기하는 담화 표지이므로, 현대 한국어에서 그 효과를 살리는 ‘보십시오’로 옮겼습니다.
- source_word: נֹפֶלֶת פֶּתַח הַבַּיִת
  english_pob_choice: was lying at the entrance of the house
  chosen_korean: 집 입구에 쓰러져 있었습니다
  alternatives_korean:
  - 집 입구에 누워 있었습니다
  - 집 문 앞에 쓰러져 있었습니다
  lexicon: HALOT
  rationale: 분사 נֹפֶלֶת은 상태를 나타내므로 결과 상태를 드러내는 ‘쓰러져 있었습니다’가 가장 적절하며, פֶּתַח는 ‘입구’로 옮겨 장면을 선명하게 했습니다.
- source_word: וְיָדֶיהָ עַל הַסַּף
  english_pob_choice: with her hands on the threshold
  chosen_korean: 그녀의 두 손은 문지방 위에 있었습니다
  alternatives_korean:
  - 그녀의 손은 문턱에 있었습니다
  - 두 손이 문지방 위에 놓여 있었습니다
  lexicon: HALOT
  rationale: סַף는 ‘문지방/문턱’ 중 문맥상 물리적 경계선의 이미지를 잘 드러내는 ‘문지방’이 적절하며, 병렬적 부가절을 한국어에서 명시적으로 풀었습니다.
theological_decisions:
- issue: פִילַגְשׁוֹ의 관계 호칭을 어떻게 처리할지
  chosen_reading: ‘그의 첩’으로 직역해 관계의 비대칭성과 서사의 불편한 현실을 그대로 드러냈습니다.
  alternative_readings:
  - ‘그의 두 번째 아내’
  - ‘그의 동거녀’
  rationale: 원문은 제도적/사회적 위계를 가진 פִילֶגֶשׁ을 사용하므로, 완화적 표현보다 원문의 긴장을 보존하는 번역이 본문 이해에 더 충실합니다.
  doctrine_reference: 서사 본문 해석의 직역 원칙
