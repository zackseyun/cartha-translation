- source_word: מֵהַר אֶפְרַיִם
  english_pob_choice: from the hill country of Ephraim
  chosen_korean: 에브라임 산지 출신
  alternatives_korean:
  - 에브라임 산지에서 온
  - 에브라임 산지 사람
  lexicon: HALOT
  rationale: 지리 표지를 현대 한국어에서 가장 분명하게 전달하기 위해 ‘산지’를 택했고, 출신 표기로 원문의 출처/소속 감각을 살렸습니다.
