  naturalness: ‘그리고 보십시오. 한 늙은이가’는 현대 표준 한국어의 정중한 서사 문체로 다소 부자연스럽습니다. ‘보십시오, 한 노인이’와 ‘저녁에 들에서 일을 하고 들어오고 있었습니다’가 더 자연스럽고 본문의 진행성을 유지합니다.
