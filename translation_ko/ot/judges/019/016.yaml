  alternatives_korean:
  - 기브아에 살고 있었습니다
  - 기브아에 거주하고 있었습니다
  lexicon: HALOT
  rationale: גור의 체류·잠시 머묾 뉘앙스를 살리기 위해 ‘머물다’를 사용했고, 계속 진행형으로 상태를 드러냈습니다.
theological_decisions:
- issue: 지리와 거주 상태의 대비
  chosen_reading: 에브라임 산지 출신이면서도 기브아에 머물고 있었다는 대비를 분명히 드러냈습니다.
  alternative_readings:
  - 에브라임 산지 사람으로 기브아에 살고 있었다
  - 에브라임 산지에서 왔고 기브아에 거주하고 있었다
  rationale: 이 절의 핵심 정보는 사람의 출신과 현재 체류지가 함께 제시되는 점이므로, 둘의 대비가 흐려지지 않도록 유지했습니다.
  doctrine_reference: 본문 서술 관찰
