  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
  footnotes:
  - marker: a
    text: Or, more literally, 'the man was from Mount Ephraim.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb for 'was staying' can also mean 'was residing' or 'was sojourning,' suggesting he was living in Gibeah though not originally from there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오. 한 늙은이가 자기 일을 마치고 들에서 저녁 무렵에 들어오고 있었습니다. 그 사람은 에브라임 산지 출신이었고, 기브아에 머물고 있었습니다[a]. 그런데 그곳 사람들은 베냐민 사람들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַר אֶפְרַיִם은 직역하면 ‘에브라임 산’이지만, 문맥상 ‘에브라임 산지’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보라
  lexicon: HALOT
  rationale: 서술의 전환을 알리는 감탄·지시 표현을 살려, 단순한 접속사보다 독자의 주의를 끄는 효과를 보존했습니다.
- source_word: אִישׁ זָקֵן
  english_pob_choice: an old man
  chosen_korean: 한 늙은이
  alternatives_korean:
  - 한 노인
  - 어느 늙은 사람
  lexicon: HALOT
  rationale: ‘늙은이’가 연령을 직접 드러내며 히브리어의 간결한 명사+형용사 구성을 자연스럽게 옮깁니다.
- source_word: מֵהַר אֶפְרַיִם
  english_pob_choice: from the hill country of Ephraim
  chosen_korean: 에브라임 산지 출신
  alternatives_korean:
  - 에브라임 산지에서 온
  - 에브라임 산지 사람
  lexicon: HALOT
  rationale: 지리 표지를 현대 한국어에서 가장 분명하게 전달하기 위해 ‘산지’를 택했고, 출신 표기로 원문의 출처/소속 감각을 살렸습니다.
- source_word: וְהוּא גָר בַּגִּבְעָה
  english_pob_choice: and he was staying in Gibeah
  chosen_korean: 기브아에 머물고 있었습니다
  alternatives_korean:
  - 기브아에 살고 있었습니다
  - 기브아에 거주하고 있었습니다
  lexicon: HALOT
  rationale: גור의 체류·잠시 머묾 뉘앙스를 살리기 위해 ‘머물다’를 사용했고, 계속 진행형으로 상태를 드러냈습니다.
theological_decisions:
- issue: 지리와 거주 상태의 대비
  chosen_reading: 에브라임 산지 출신이면서도 기브아에 머물고 있었다는 대비를 분명히 드러냈습니다.
  alternative_readings:
  - 에브라임 산지 사람으로 기브아에 살고 있었다
  - 에브라임 산지에서 왔고 기브아에 거주하고 있었다
  rationale: 이 절의 핵심 정보는 사람의 출신과 현재 체류지가 함께 제시되는 점이므로, 둘의 대비가 흐려지지 않도록 유지했습니다.
  doctrine_reference: 본문 서술 관찰
