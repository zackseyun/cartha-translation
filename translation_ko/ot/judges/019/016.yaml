  to: 보십시오, 한 노인이 저녁에 들에서 일을 하고 들어오고 있었습니다. 그는 에브라임 산지 출신이었고 기브아에 머물고 있었습니다[a]. 그런데 그곳 사람들은 베냐민 사람들이었습니다.
