  source_fidelity: 초안은 사건의 기본 흐름을 대체로 옮겼으나, לִשְׁמֹעַ לוֹ의 대명사 목적어(‘그의 말을’)가 한국어 본문에서 빠져 있고, וַיִּתְעַלְּלוּ בָהּ의 지속적·가해적 의미는 ‘능욕하다’보다 ‘학대하다’가 더 분명합니다. וַיֵּדְעוּ אֹתָהּ는 원문의 완곡어법을 본문에서 보존하되 주석으로 문맥상 의미를 밝혀야 합니다.
  naturalness: 원문의 단일한 긴 문장을 현대 한국어 합쇼체의 두 문장으로 나누고, ‘그들이 있던 밖으로 내보냈습니다’로 הַחוּץ와 ‘그들에게’의 방향을 자연스럽게 반영했습니다. 종결도 현대 합쇼체로 통일했습니다.
  terminology: ‘첩’은 פִילֶגֶשׁ의 통상적 성서 한국어 대응어로 유지했습니다. ‘알았다’는 성적 행위를 가리키는 히브리어 완곡어법을 보존하며, 문맥상 강제적인 성폭력을 뜻함을 주석에서 명시합니다. ‘학대하다’는 התעללו의 모욕적이고 가혹한 행위를 현대어로 무리 없이 전달합니다.
  issues:
  - severity: medium
    issue: ‘듣기를 거절하므로’가 לִשְׁמֹעַ לוֹ의 목적어를 생략함
