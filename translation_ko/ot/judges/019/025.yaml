  language: ko
  text: 그 사람들이 그의 말을 들으려 하지 않자, 그 사람이 자기 첩을 붙잡아 그들이 있던 밖으로 내보냈습니다. 그들은 그 여자를 알았고[a] 밤새도록 그녀를 학대하다가, 새벽이 밝을 때에 그녀를 놓아주었습니다.
