  - severity: medium
    issue: 성적 완곡어법에 대한 주석 부재
    rationale: ‘그 여자를 알았다’는 이 문맥에서 성폭력을 가리키는 히브리어 관용 표현입니다. 본문은 원문의 완곡성을 유지하되, 독자가 뜻을 오해하지 않도록 주석이 필요합니다.
  - severity: low
    issue: ‘능욕하다’의 현대어 자연성과 의미 범위
    rationale: ‘능욕하다’는 다소 문어적이고 성적 모욕으로 좁게 들릴 수 있습니다. ‘밤새도록 그녀를 학대하다’는 지속적인 가혹행위와 모욕을 더 자연스럽고 넓게 전달합니다.
