source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה הָ/אִישׁ֙ לָ/ל֔וּן וַ/יָּ֣קָם וַ/יֵּ֗לֶךְ וַ/יָּבֹא֙ עַד נֹ֣כַח יְב֔וּס הִ֖יא יְרוּשָׁלִָ֑ם וְ/עִמּ֗/וֹ צֶ֤מֶד חֲמוֹרִים֙ חֲבוּשִׁ֔ים וּ/פִילַגְשׁ֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
  footnotes:
  - marker: a
    text: Or 'to the vicinity of Jebus' or 'to a point facing Jebus.' The Hebrew expression indicates a location opposite or before the city rather than clearly inside it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 남자는 밤을 지내려 하지 않았습니다. 그는 일어나 길을 떠나 여부스, 곧 예루살렘 맞은편에 이르렀습니다.[a] 그와 함께 안장을 얹은 나귀 두 마리와 그의 첩이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여부스의 주변까지’ 혹은 ‘여부스를 마주 보는 지점까지’로도 옮길 수 있습니다. 히브리어 표현은 성 안으로 들어갔다기보다 성 앞이나 맞은편의 위치를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אָבָה
  english_pob_choice: was not willing
  chosen_korean: 밤을 지내려 하지 않았습니다
  alternatives_korean:
  - 머물기를 원하지 않았습니다
  - 머무르려 하지 않았습니다
  - 밤을 보내려 하지 않았습니다
  lexicon: HALOT
  rationale: אָבָה는 단순한 감정보다 의지의 거절을 나타내므로, ‘하지 않았습니다’로 의지적 거부를 드러내면서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  english_pob_choice: He rose and went and came
  chosen_korean: 그는 일어나서 가다가, ... 이르렀는데
  alternatives_korean:
  - 그는 일어나서 가고 와서
  - 그는 일어나서 가서 왔는데
  - 그는 일어나서 가다가 이르렀습니다
  lexicon: HALOT
  rationale: 연속 동작을 나타내는 서술 흐름을 살리되, 한국어에서는 과도한 직역을 피하고 자연스러운 진행형 서술로 재현했습니다.
- source_word: עַד נֹכַח יְבוּס
  english_pob_choice: came opposite Jebus
  chosen_korean: 예루살렘인 여부스 맞은편에
  alternatives_korean:
  - 여부스 맞은편에
  - 여부스 앞쪽에
  - 여부스 근처에
  lexicon: HALOT
  rationale: עַד נֹכַח는 도시 안으로 들어갔다는 뜻이 아니라 ‘맞은편/정면에 이른’ 공간 관계를 뜻하므로, 위치 관계를 분명히 하는 ‘맞은편에’로 옮겼습니다.
- source_word: יְבֻס הִיא יְרוּשָׁלִָם
  english_pob_choice: Jebus (that is, Jerusalem)
  chosen_korean: 예루살렘인 여부스
  alternatives_korean:
  - 여부스, 곧 예루살렘
  - 여부스(곧 예루살렘)
  - 여부스, 즉 예루살렘
  lexicon: HALOT
  rationale: 동격 설명을 살려 고대 지명과 익숙한 지명을 함께 제시했습니다. ‘예루살렘인’은 본문이 지닌 식별 기능을 한국어에서 간결하게 드러냅니다.
- source_word: פִילַגְשׁוֹ
  english_pob_choice: his concubine
  chosen_korean: 그의 첩
  alternatives_korean:
  - 그의 후궁
  - 그의 첩녀
  lexicon: HALOT
  rationale: פִילֶגֶשׁ는 혼인 관계와 구별되는 첩을 가리키므로, 관용적으로 정착된 ‘첩’을 유지했습니다.
theological_decisions:
- issue: 지명 주석에서 ‘여부스’와 ‘예루살렘’의 관계를 어떻게 드러낼지
  chosen_reading: 본문 안에서 동격 관계를 드러내어 독자가 같은 장소를 식별하도록 했습니다.
  alternative_readings:
  - 주석으로만 처리한다
  - 여부스만 번역한다
  rationale: 히브리어는 설명적 동격을 통해 옛 지명과 현재식 명칭의 대응을 알려 주므로, 본문 내에 반영하는 편이 원문의 기능을 가장 잘 보존합니다.
  doctrine_reference: 본문 식별성/역사 지리
