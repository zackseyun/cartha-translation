  yaml_path: translation/ot/judges/019/021.yaml
  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
  footnotes:
  - marker: a
    text: Or, more literally, 'mixed feed for the donkeys.'
    reason: lexical_alternative
  - marker: b
    text: Foot-washing was a customary act of hospitality in the ancient Near East.
    reason: cultural_note
translation:
  language: ko
  text: 그는 그를 자기 집으로 데리고 들어가 나귀들에게 먹이를 주었습니다[a]. 그들은 발을 씻고[b] 먹고 마셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘나귀들을 위해 섞은 사료’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 발을 씻는 것은 고대 근동의 환대 관습이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ לְבֵיתוֹ
  english_pob_choice: he brought him into his house
  chosen_korean: 그를 자기 집으로 데리고 들어가서
  alternatives_korean:
  - 그를 자기 집 안으로 데리고 가서
  - 그를 자기 집에 데려가서
  lexicon: HALOT
  rationale: בוא의 히필은 ‘데리고 오다/들이다’의 뜻이므로, 이동의 완료와 집 안으로의 진입을 자연스럽게 살려 옮겼습니다.
- source_word: וַיָּבָול לַחֲמוֹרִים
  english_pob_choice: fed the donkeys
  chosen_korean: 나귀들에게 먹이를 주었습니다
  alternatives_korean:
  - 나귀들을 먹였습니다
  - 나귀들을 위해 먹이를 섞어 주었습니다
  lexicon: HALOT
  rationale: בלל의 ‘섞다’에서 나온 관용적 표현이지만, 문맥상 가축에게 사료를 마련해 주는 뜻이므로 현대 한국어에서는 ‘먹이를 주다’가 가장 자연스럽고 의미를 분명히 합니다.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  english_pob_choice: they washed their feet
  chosen_korean: 그들은 발을 씻고
  alternatives_korean:
  - 그들은 발을 씻은 뒤
  - 그들은 발을 씻었습니다
  lexicon: HALOT
  rationale: 고대 근동의 환대 관습을 반영하는 직역에 가깝게 유지하되, 한국어에서는 사건의 연속을 살려 간결하게 표현했습니다.
theological_decisions:
- issue: 환대 관습의 표현 방식
  chosen_reading: ‘발을 씻고’로 옮겨 고대 근동의 환대 행위를 드러내면서도 본문 의미를 과장하지 않았습니다.
  alternative_readings:
  - ‘발을 씻었습니다’
  - ‘발 씻는 예를 행했습니다’
  rationale: 이 행위는 설명적 주석 없이도 본문 안에서 이해될 수 있으므로, 본문에는 간결하게 두고 문화적 배경은 주석으로 처리하는 것이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
