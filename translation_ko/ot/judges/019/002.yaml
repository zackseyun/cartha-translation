revisions:
- from: 그의 첩은 그에게 불성실하였고[a], 아버지의 집으로, 유다의 베들레헴으로 떠나 갔습니다. 그리고 그곳에 넉 달 동안 있었습니다.
  to: 그의 첩이 그에게 음행을 저질렀고[a], 그를 떠나 아버지의 집, 곧 유다의 베들레헴으로 갔습니다. 그리고 그곳에서 넉 달 동안 지냈습니다.
  rationale: 수정문은 זנה의 통상적 성적 부정 의미를 ‘음행을 저질렀고’로 드러내고, מֵאִתּוֹ의 분리 의미를 ‘그를 떠나’로 명시했습니다. 아버지의 집과 유다의 베들레헴의 관계는 ‘곧’으로 자연스럽게 연결했으며, 고대의 다른 해석 가능성은 각주에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:00Z'
review_pass:
  verdict: revise
  source_fidelity: ‘불성실하였고’는 관계상의 불충실을 나타낼 수 있으나, זנה의 통상적이고 마소라 본문이 지지하는 성적 부정의 의미를 충분히 드러내지 못합니다. 또한 ‘그에게’는 뒤의 ‘떠나 갔습니다’와 결합할 때 מֵאִתּוֹ(그에게서/그를 떠나)를 명시적으로 반영하지 못합니다.
  naturalness: ‘그에게 불성실하였고’와 ‘그에게 맞서 창기 노릇을 하였다’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘그에게 음행을 저질렀고’ 및 ‘그를 떠나’가 의미와 문장 연결을 더 분명하게 합니다.
  terminology: ‘첩’은 פילגש에 대한 관례적이고 적절한 대응어입니다. זנה는 본문에서 성적 부정을 뜻하는 표현으로 본문에 반영하되, 고대의 다른 이해는 각주로 보존하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: זנה의 성적 의미가 본문에서 약화됨
    rationale: ‘불성실하였고’는 성적이지 않은 일반적 불성실도 의미할 수 있습니다. 히브리어 동사의 일반적 의미와 영어 POB의 선택을 따라 성적 부정을 본문에 더 명시하는 것이 안전합니다.
  - severity: medium
    issue: מֵאִתּוֹ의 분리 의미가 불명확함
    rationale: 초안의 ‘그에게’는 앞 절의 여격으로 읽히며, ‘그에게서/그를 떠나’라는 출발·분리의 의미를 전달하지 못합니다.
  - severity: low
    issue: 각주의 직역 표현이 어색함
    rationale: ‘그에게 맞서 창기 노릇을 하였다’보다 ‘그에게 대하여 음행하였다’가 עלָיו의 방향성을 보존하면서 한국어로 더 자연스럽습니다.
  revised_text: 그의 첩이 그에게 음행을 저질렀고[a], 그를 떠나 아버지의 집, 곧 유다의 베들레헴으로 갔습니다. 그리고 그곳에서 넉 달 동안 지냈습니다.
  revised_footnotes:
