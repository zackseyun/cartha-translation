id: JDG.19.2
reference: Judges 19:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
  footnotes:
  - marker: a
    text: Or, more literally, 'played the prostitute against him.' Some ancient interpreters understood the clause differently, such as 'she became angry with him' or 'quarreled with him.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 첩이 그에게 음행을 저질렀고[a], 그를 떠나 아버지의 집, 곧 유다의 베들레헴으로 갔습니다. 그리고 그곳에서 넉 달 동안 지냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘그에게 대하여 음행하였다.’ 일부 고대 해석자들은 이 구절을 ‘그녀가 그에게 화를 냈다’ 또는 ‘그와 다투었다’로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  english_pob_choice: was unfaithful
  chosen_korean: 불성실하였고
  alternatives_korean:
  - 음행하였고
  - 창기를 하였고
  - 그에게 반역하였고
  lexicon: HALOT, BDB
  rationale: זנה의 기본 의미를 직접 반영하면서도, 현대 한국어에서 관계적·도덕적 불충실을 자연스럽게 드러내는 표현으로 옮겼습니다. '음행'은 지나치게 성적 행위에만 좁혀질 수 있어, 본문의 관계적 배반성을 함께 담는 '불성실하다'를 택했습니다.
- source_word: פִּילַגְשׁוֹ
  english_pob_choice: his concubine
  chosen_korean: 그의 첩
  alternatives_korean:
  - 그의 후궁
  - 그의 부인
  - 그의 동거녀
  lexicon: HALOT, BDB
  rationale: 필리게쉬는 본문이 전제하는 낮은 지위의 혼인·성적 관계를 가리키는 표준 대응어로 '첩'이 가장 직접적입니다. '후궁'은 왕실 용례로 오해될 수 있어 피했습니다.
- source_word: מֵאִתּוֹ
  english_pob_choice: from him
  chosen_korean: 그에게
  alternatives_korean:
  - 그로부터
  - 그에게서
  lexicon: BDB
  rationale: 분리의 방향을 한국어 동사구 '떠나 가다'로 살리기 위해, 출발점은 '그에게서'보다 간결한 '그에게'로 처리했습니다. 본문의 핵심은 관계적 이탈이므로, 동사와 함께 읽힐 때 자연스럽습니다.
- source_word: אֶל בֵּית אָבִיהָ / אֶל בֵּית לֶחֶם יְהוּדָה
  english_pob_choice: to her father's house, to Bethlehem in Judah
  chosen_korean: 아버지의 집으로, 유다의 베들레헴으로
  alternatives_korean:
  - 아버지의 집으로, 유다에 있는 베들레헴으로
  - 아버지의 집인 유다 베들레헴으로
  lexicon: BDB
  rationale: 두 개의 אֶל 구문을 병렬로 살려 이동의 종착지를 순서대로 제시했습니다. '유다의 베들레헴'은 지명 구분을 현대 한국어에서 가장 간명하게 드러냅니다.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  english_pob_choice: for four months
  chosen_korean: 넉 달 동안
  alternatives_korean:
  - 네 달 동안
  - 사 개월 동안
  - 네 달을
  lexicon: HALOT, BDB
  rationale: 히브리어의 시간 관용구를 한국어의 자연스러운 기간 표현으로 옮겼습니다. '넉 달'은 서술문에서 유려하면서도 의미를 정확히 전달합니다.
theological_decisions:
- issue: זנה의 의미를 성적 부정과 관계적 불성실 사이에서 어떻게 드러낼지
  chosen_reading: '''불성실하였고''로 옮겨 본문이 암시하는 도덕적·관계적 배반을 폭넓게 살렸습니다.'
  alternative_readings:
  - '''음행하였고''로 더 직접적으로 성적 의미를 드러내는 번역'
  - '''창기를 하였고''로 더 노골적인 표현'
  rationale: 마소라 본문의 נקוד와 일반 어휘 용례는 성적 부정행위를 지지하지만, 한국어에서 지나치게 구체화하면 서술의 폭이 좁아집니다. 따라서 POB의 주석적 긴장을 유지하면서도, 본문 자체는 관계적 불신실성을 자연스럽게 읽히도록 했습니다.
  doctrine_reference: Translation philosophy §3 (theological tension should be preserved rather than prematurely resolved)
