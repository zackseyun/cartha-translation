base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
  footnotes:
  - marker: a
    text: Or “the Israelites” or “the children of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 본 사람마다 이렇게 말했습니다. “이와 같은 일은 이스라엘 자손[a]이 이집트 땅에서 올라온 날부터 오늘까지 일어난 적도 없고 목격된 적도 없습니다. 이 일을 깊이 생각하고, 의논하고, 말하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָרֹאֶה
  english_pob_choice: everyone who saw it
  chosen_korean: 그것을 본 모든 사람
  alternatives_korean:
  - 모든 목격자
  - 그것을 본 이들
  lexicon: HALOT
  rationale: 보는 행위의 분사적 표현을 자연스럽게 풀어, 사건의 목격자 전체를 가리키는 포괄성을 살렸습니다.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  english_pob_choice: Nothing like this has happened or been seen
  chosen_korean: 이런 일은 … 일어난 적도, 보인 적도 없습니다
  alternatives_korean:
  - 이런 일은 일어난 적도, 보인 적도 없습니다
  - 이런 것과 같은 일은 존재한 적도, 보인 적도 없습니다
  lexicon: HALOT
  rationale: היה와 ראה의 이중 표현을 각각 '일어나다'와 '보이다'로 대응시켜, 전례 없음의 강한 강조를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 원문의 남성 복수 표지를 살리면서도 한국어 성경에서 널리 이해되는 관용 표현을 유지했습니다.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  english_pob_choice: Consider it
  chosen_korean: 그것을 마음에 두고
  alternatives_korean:
  - 깊이 생각하고
  - 마음에 새기고
  lexicon: HALOT
  rationale: 직역형 관용구보다, 충격적인 사건을 두고 숙고하라는 촉구를 한국어에서 자연스럽게 전달했습니다.
theological_decisions:
- issue: 결론부 삼중 명령의 어조
  chosen_reading: “그것을 마음에 두고, 상의하고, 말하십시오.”로 받아, 공동체적 숙고와 공개 발화를 촉구하는 명령형을 살렸습니다.
  alternative_readings:
  - “생각하고, 의논하고, 말하십시오.”
  - “깊이 생각해 보고, 상의하고, 말하십시오.”
  rationale: 본문은 단순한 감상 요구가 아니라 공동체적 판단을 촉구하는 강한 권고이므로, 명령형의 연속을 유지했습니다.
  doctrine_reference: 본문의 윤리적·서사적 기능에 관한 번역 원칙
- issue: ‘일어난 적도, 보인 적도 없습니다’의 이중 부정
  chosen_reading: 전례 없음의 과장을 완화하지 않고, 두 동사를 모두 반영했습니다.
  alternative_readings:
  - ‘이런 일은 한 번도 없었습니다’
  - ‘이런 일은 본 적도 들은 적도 없습니다’
  rationale: 히브리어의 병렬 구조는 사건의 유례없음을 강하게 강조하므로, 한 번의 표현으로 축약하지 않았습니다.
  doctrine_reference: 원문 수사 구조 보존 원칙
