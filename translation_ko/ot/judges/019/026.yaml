  source_fidelity: 초안은 시간 표현과 ‘주인’의 권위 관계를 대체로 보존합니다. 그러나 וַתִּפֹּל(‘쓰러지다/넘어지다’)을 ‘엎드렸는데’로 옮긴 것은 자발적 자세나 경배의 뉘앙스를 낳을 수 있어 원문의 갑작스러운 쓰러짐을 충분히 반영하지 못합니다. 또한 ‘그 집 남자의 입구’는 히브리어의 ‘그 남자의 집 문간’을 잘못 묶어 매우 부자연스럽게 만듭니다. ‘빛이 날 때까지’도 한국어 관용상 ‘날이 밝을 때까지’가 적절합니다.
