source:
  edition: WLC
  text: וַ/תָּבֹ֥א הָ/אִשָּׁ֖ה לִ/פְנ֣וֹת הַ/בֹּ֑קֶר וַ/תִּפֹּ֞ל פֶּ֧תַח בֵּית הָ/אִ֛ישׁ אֲשֶׁר אֲדוֹנֶ֥י/הָ שָּׁ֖ם עַד הָ/אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
  footnotes:
  - marker: a
    text: Or 'toward morning' or 'before dawn.' The Hebrew idiom literally refers to the turning of morning.
    reason: lexical_alternative
  - marker: b
    text: Or 'her lord.' The Hebrew says 'her master,' a term of authority rather than explicitly 'her husband.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인은 아침이 밝아 올 무렵에[a] 와서, 자기 주인이 있던 그 남자의 집 문간에 쓰러졌으며, 날이 밝을 때까지 그곳에 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침이 다가올 무렵에’, ‘동틀 무렵에’. 히브리어 관용구는 문자적으로 아침이 ‘돌아오는’ 때를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주인’은 히브리어가 가진 권위 관계를 반영한 표현이며, 여기서 곧바로 ‘남편’으로 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  english_pob_choice: As morning was dawning
  chosen_korean: 아침이 밝아 오려 할 때에
  alternatives_korean:
  - 새벽 무렵에
  - 동틀 무렵에
  - 아침이 돌기 시작할 때에
  lexicon: HALOT
  rationale: בֹּקֶר와 פנה의 관용적 결합이 가리키는 ‘아침의 전환/다가옴’을 한국어의 자연스러운 시간 표현으로 옮겼습니다. ‘아침이 밝아 오려 할 때에’는 문맥의 시점과 이미지 둘 다를 살립니다.
- source_word: וַתִּפֹּל
  english_pob_choice: fell
  chosen_korean: 엎드렸는데
  alternatives_korean:
  - 쓰러졌는데
  - 넘어졌는데
  - 떨어졌는데
  lexicon: HALOT
  rationale: 기본 동사값은 ‘떨어지다/넘어지다’이지만, 여기서는 문 앞에 주저앉거나 쓰러진 비극적 자세를 한국어로 더 직접적으로 드러내기 위해 ‘엎드렸는데’를 택했습니다. 다만 원문의 급박함을 살려 서술 연결은 간결하게 유지했습니다.
- source_word: פֶּתַח בֵּית הָאִישׁ
  english_pob_choice: at the entrance of the house of the man
  chosen_korean: 그 집 남자의 입구에서
  alternatives_korean:
  - 그 집의 문간에서
  - 그 집의 현관에서
  - 그 남자의 집 어귀에서
  lexicon: HALOT
  rationale: פֶּתַח는 ‘문’보다 넓은 ‘입구/문간’의 뜻이어서 이를 반영했습니다. ‘그 집 남자’는 원문의 단순한 אישׁ을 살리되, 문맥상 같은 인물을 가리키는 점을 자연스럽게 전달합니다.
- source_word: אֲדוֹנֶיהָ
  english_pob_choice: her master
  chosen_korean: 그녀의 주인
  alternatives_korean:
  - 그녀의 주인님
  - 그녀의 남편
  - 그녀의 주군
  lexicon: HALOT
  rationale: 원문은 소유격이 붙은 אֲדוֹן으로, 관계를 ‘남편’으로 특정하지 않고 권위 관계를 드러냅니다. 한국어에서도 ‘주인’이 그 위계적 의미를 가장 직접적으로 보존합니다.
theological_decisions:
- issue: 본문이 여성의 죽음 직전 장면을 서술하는 방식과 인물 관계를 어떻게 드러낼지
  chosen_reading: 관계 호칭은 ‘주인’으로 유지하고, 성별·혼인관계를 덧붙여 해석하지 않았습니다.
  alternative_readings:
  - ‘남편’으로 순화
  - ‘주군’처럼 더 고어적 표현 사용
  rationale: 원문은 אֲדוֹן을 사용해 권위 관계를 표시할 뿐, 여기서 혼인관계를 명시하지 않습니다. POB의 주석 취지를 따라 위계적 긴장을 유지하는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 원문 의미 보존과 서술적 절제
- issue: וַתִּפֹּל의 신체적 상태를 한국어에서 얼마나 강하게 드러낼지
  chosen_reading: ‘엎드렸는데’로 번역해 단순 이동이 아니라 쓰러짐/주저앉음의 비극성을 드러냈습니다.
  alternative_readings:
  - ‘떨어졌는데’
  - ‘쓰러졌는데’
  rationale: 이 장면은 단순한 ‘도착’보다 절망적 붕괴를 암시합니다. 한국어에서 ‘엎드리다’는 문맥상 쓰러짐의 형상을 살리면서도 지나친 해석을 덜어 줍니다.
  doctrine_reference: 서사적 긴장과 문맥적 의미
