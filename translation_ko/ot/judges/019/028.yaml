base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and there was no answerer' or 'and there was no one answering.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Then he took her onto the donkey.' The Hebrew verb is literally 'took,' here in the sense of placing or lifting her onto the animal.
    reason: lexical_alternative
  - marker: c
    text: 'Or, ''went to his home.'' Hebrew: ''to his place.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 말했습니다. 「일어나서 갑시다。」 그러나 대답이 없었습니다. 그래서 그는 그녀를 나귀 위에 태웠고, 그 남자는 일어나 자기 곳으로 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘대답하는 자가 없었다’ 또는 ‘대답하는 이가 없었다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀를 나귀에 올렸다.’ 히브리어 동사는 문자적으로 ‘취하다/데려가다’이지만, 여기서는 나귀 위에 올려 태우는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기 집으로 갔다.’ 히브리어는 문자적으로 ‘자기 곳으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּמִי
  english_pob_choice: Get up
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나라
  - 일어나
  lexicon: HALOT
  rationale: 여성 단수 명령형의 직접성을 살리되, 현대 한국어에서는 다음 동작과 자연스럽게 이어지도록 부사절 형태로 옮겼습니다.
- source_word: וְנֵלֵ֖כָה
  english_pob_choice: and let us go
  chosen_korean: 갑시다
  alternatives_korean:
  - 가자
  - 가겠습니다
  lexicon: HALOT
  rationale: 첫 사람 공통수 복수의 권유·결의를 한국어의 포괄적 청유형으로 옮겼습니다.
- source_word: וְ/אֵ֣ין עֹנֶ֑ה
  english_pob_choice: But there was no answer
  chosen_korean: 그러나 대답이 없었습니다
  alternatives_korean:
  - 그러나 아무도 대답하지 않았습니다
  - 대답하는 사람이 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 무응답 표현을 자연스럽게 풀어, 전후 문맥의 단절감을 유지했습니다.
- source_word: וַ/יִּקָּחֶ֨/הָ֙ עַֽל הַ/חֲמ֔וֹר
  english_pob_choice: Then he put her on the donkey
  chosen_korean: 그래서 그는 그녀를 나귀 위에 태웠고
  alternatives_korean:
  - 그리고 그는 그녀를 나귀에 올렸고
  - 그는 그녀를 나귀 위에 실었고
  lexicon: HALOT
  rationale: לקח의 기본 의미는 ‘데려가다/취하다’이지만, 목적어와 전치사구의 결합상 실제 동작은 ‘올려 태우다’에 가깝기 때문에 한국어로 구체화했습니다.
- source_word: לִ/מְקֹמֽ/וֹ
  english_pob_choice: to his place
  chosen_korean: 자기 곳으로
  alternatives_korean:
  - 자기 집으로
  - 자기 자리로
  lexicon: HALOT
  rationale: מקום의 넓은 의미를 보존해, 영어 POB처럼 ‘집’으로 좁히지 않고 ‘곳’으로 직역성을 유지했습니다.
theological_decisions:
- issue: 무응답 뒤의 서술 톤
  chosen_reading: 직접 발화 뒤에 서술자가 사건을 건조하게 이어 가는 문체를 유지했습니다.
  alternative_readings:
  - 감정적 표현을 보태는 방식
  - 문맥을 완화해 부드럽게 쓰는 방식
  rationale: 이 절은 인물의 반응보다 행위의 연쇄를 보여 주므로, 원문의 냉정하고 압축된 서술 리듬을 보존하는 것이 중요합니다.
  doctrine_reference: 본문 서술의 문체 보존
- issue: ‘to his place’의 처리
  chosen_reading: ‘자기 곳’으로 번역해 장소의 비특정성을 살렸습니다.
  alternative_readings:
  - ‘자기 집’으로 의역
  - ‘고향으로’로 해석
  rationale: 히브리어 מקום은 반드시 ‘집’이나 ‘고향’을 뜻하지 않으므로, 본문이 말하는 최소한의 의미를 유지했습니다.
  doctrine_reference: 어휘 의미 범위 보존
