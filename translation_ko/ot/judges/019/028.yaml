  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and there was no answerer' or 'and there was no one answering.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Then he took her onto the donkey.' The Hebrew verb is literally 'took,' here in the sense of placing or lifting her onto the animal.
    reason: lexical_alternative
  - marker: c
    text: 'Or, ''went to his home.'' Hebrew: ''to his place.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 여자에게 말했습니다. 「일어나서 갑시다.」 그러나 대답이 없었습니다.[a] 그 뒤 그는 그 여자를 나귀 위에 태웠습니다.[b] 그 남자는 일어나 자기 곳으로 갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘대답하는 자가 없었다’ 또는 ‘대답하는 이가 없었다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 여자를 나귀 위에 올렸다.’ 히브리어 동사는 문자적으로 ‘취했다’이지만, 여기서는 그 여자를 나귀 위에 올려 태우는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기 집으로 갔다.’ 히브리어는 문자적으로 ‘자기 곳으로’입니다.
    reason: lexical_alternative
