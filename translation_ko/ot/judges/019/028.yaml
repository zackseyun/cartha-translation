theological_decisions:
- issue: 무응답 뒤의 서술 톤
  chosen_reading: 직접 발화 뒤에 서술자가 사건을 건조하게 이어 가는 문체를 유지했습니다.
  alternative_readings:
  - 감정적 표현을 보태는 방식
  - 문맥을 완화해 부드럽게 쓰는 방식
  rationale: 이 절은 인물의 반응보다 행위의 연쇄를 보여 주므로, 원문의 냉정하고 압축된 서술 리듬을 보존하는 것이 중요합니다.
  doctrine_reference: 본문 서술의 문체 보존
- issue: ‘to his place’의 처리
  chosen_reading: ‘자기 곳’으로 번역해 장소의 비특정성을 살렸습니다.
  alternative_readings:
  - ‘자기 집’으로 의역
  - ‘고향으로’로 해석
  rationale: 히브리어 מקום은 반드시 ‘집’이나 ‘고향’을 뜻하지 않으므로, 본문이 말하는 최소한의 의미를 유지했습니다.
  doctrine_reference: 어휘 의미 범위 보존
