- from: 그러나 그의 주인이 그에게 말했습니다. “우리는 이방 도시로 들르지 않겠습니다. 그곳은 이스라엘 자손에게 속한 곳이 아니기 때문입니다. 오히려 우리는 계속 가서 기브아까지 가겠습니다.”[a]
  to: 그러나 그의 주인이 그에게 말했습니다. “우리는 이스라엘 자손[a]이 아닌 사람들이 사는 이방 성읍으로는 들르지 않고, 기브아까지 더 가겠습니다.”
  rationale: 인과를 덧붙이지 않고 히브리어 관계절의 의미를 유지했습니다. 도시를 직접 ‘이스라엘 자손에게 속한 곳’이라고 하는 어색한 소유 표현 대신, 문맥상 암시된 주민을 자연스러운 한국어로 밝혔습니다. ‘들르지 않고’는 여행 중 숙박을 위해 길을 벗어나지 않겠다는 נָסוּר의 문맥적 뜻을 보존하며, ‘더 가겠습니다’는 기브아까지 계속 진행하겠다는 וְעָבַרְנוּ를 간결하게 전달합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:18Z'
