  naturalness: ‘이방 성읍’과 ‘기브아까지 더 가겠습니다’는 현대의 격식 있는 합쇼체 서사 문맥에서 자연스럽습니다. 관계절을 ‘이스라엘 자손이 아닌 사람들이 사는’으로 처리하면 원문의 의미와 한국어 문장 흐름을 함께 살릴 수 있습니다.
