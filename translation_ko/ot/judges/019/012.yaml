  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the sons of Israel.'' This is the standard Israelite ethnic expression; ''Israelites'' is a possible smoother rendering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 주인이 그에게 말했습니다. “우리는 이방 도시로 들르지 않겠습니다. 그곳은 이스라엘 자손에게 속한 곳이 아니기 때문입니다. 오히려 우리는 계속 가서 기브아까지 가겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이방’은 지리적 외국이라기보다 이스라엘 공동체 밖의 성격을 드러내는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָיו
  english_pob_choice: his master
  chosen_korean: 그의 주인
  alternatives_korean:
  - 그의 주인님
  - 그의 상전
  lexicon: HALOT
  rationale: 사람 사이의 지배-복종 관계를 가리키므로, 신적 호칭이 아닌 사회적 상급자를 자연스럽게 드러내는 ‘주인’을 택했습니다.
- source_word: נָסוּר
  english_pob_choice: we will not turn aside
  chosen_korean: 들르지 않겠습니다
  alternatives_korean:
  - 돌아서지 않겠습니다
  - 우회하지 않겠습니다
  lexicon: HALOT
  rationale: 여행 중 숙박을 위해 경로를 벗어나지 않겠다는 뜻이므로, 한국어에서는 ‘들르다’가 가장 자연스럽게 그 뉘앙스를 전달합니다.
- source_word: עִיר נָכְרִי
  english_pob_choice: a foreign city
  chosen_korean: 이방 도시
  alternatives_korean:
  - 외국 도시
  - 낯선 도시
  lexicon: HALOT
  rationale: 지리적 ‘외국’보다 언약 공동체 바깥의 타자성을 강조하는 표현이어서, ‘이방’이 원문의 사회-종교적 대비를 더 잘 살립니다.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  english_pob_choice: which is not of the sons of Israel
  chosen_korean: 그곳은 이스라엘 자손에게 속한 곳이 아니기 때문입니다
  alternatives_korean:
  - 그곳 주민들이 이스라엘 자손이 아니기 때문입니다
  - 이스라엘 자손의 성읍이 아니기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 도시를 가리키며 그 구성원을 집합적으로 말합니다. 따라서 문법적 주어를 ‘그곳’으로 유지하되, 소속 부정을 한국어로 분명하게 옮겼습니다.
- source_word: וְעָבַרְנוּ
  english_pob_choice: we will go on
  chosen_korean: 계속 가서
  alternatives_korean:
  - 그냥 지나가서
  - 가던 길을 계속해서
  lexicon: HALOT
  rationale: ‘עבר’의 이동 지속 의미를 살리되, 한국어 문맥에서는 목적지까지 여정을 이어 간다는 뜻을 가장 간결하게 전달합니다.
theological_decisions:
- issue: 이방 도시와 이스라엘 자손의 대비
  chosen_reading: 여행 중 숙소 선택을 둘러싼 공동체 경계 의식이 드러나는 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 지리적 외국 도시 구별
  - 도덕적 우월감의 표현
  rationale: 본문은 어디에서 묵을지에 대한 실용적 판단 속에서 이스라엘 내부/외부의 구분을 드러냅니다. 그래서 지나친 도덕화 없이 공동체 경계의 의미를 유지했습니다.
  doctrine_reference: 구약의 언약 공동체 이해
- issue: 직접화법의 문체
  chosen_reading: 화자의 결의가 분명히 드러나도록 직접 인용은 평서형 합쇼체로 유지했습니다.
  alternative_readings:
  - 더 부드러운 서술체로 완화
  - 격식을 낮춘 구어체
  rationale: 본문의 단호한 여행 결정과 서사 리듬을 보존하기 위해, 한국어도 정중하지만 결단이 살아 있는 합쇼체를 사용했습니다.
  doctrine_reference: 번역 문체 원칙
