base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
  footnotes:
  - marker: a
    text: Or “Go, and let us approach one of the places.”
    reason: lexical_alternative
  - marker: b
    text: “His young man” may also be rendered “his servant” or “his attendant.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기 청년[a]에게 말했습니다. 「자, 우리가 이곳들 가운데 한 곳으로 가서 기브아나 라마에서 밤을 지냅시다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 청년’은 문맥에 따라 ‘자기 종’ 또는 ‘자기 시종’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  english_pob_choice: to his young man
  chosen_korean: 자기 청년에게
  alternatives_korean:
  - 자기 종에게
  - 자기 시종에게
  lexicon: HALOT
  rationale: נַעַר는 여기서 동행하는 남자 하인을 가리킬 수 있으므로, 계층적 의미를 과도하게 고정하지 않는 ‘청년’이 영어 POB의 ‘young man’과 가장 잘 맞습니다.
- source_word: לְךָ
  english_pob_choice: Come
  chosen_korean: 오십시오
  alternatives_korean:
  - 가십시오
  - 가자
  lexicon: HALOT
  rationale: 동행을 요청하는 직접 화법이므로, 현대 한국어에서는 함께 움직이자는 권유로 자연스러운 ‘오십시오’가 적절합니다.
- source_word: וְנִקְרְבָה
  english_pob_choice: and let us draw near
  chosen_korean: 우리가 … 가까이 가서
  alternatives_korean:
  - 우리가 … 접근해서
  - 우리가 … 나아가서
  lexicon: HALOT
  rationale: קרב의 이동 뉘앙스를 살리면서도 한국어에서 문맥상 자연한 표현으로 옮겼습니다. 영어 POB의 ‘draw near’에 대응해 거리 축소를 분명히 드러냅니다.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  english_pob_choice: to one of these places
  chosen_korean: 이곳들 가운데 하나에
  alternatives_korean:
  - 이 장소들 가운데 하나에
  - 그곳들 가운데 하나에
  lexicon: HALOT
  rationale: 지시성 있는 복수 표현이므로, 화자 시점의 근처 후보지를 가리키는 ‘이곳들’로 살렸습니다. 동작 방향은 앞뒤 동사로 충분히 드러납니다.
- source_word: וְלַנּוּ
  english_pob_choice: and spend the night
  chosen_korean: 밤을 지냅시다
  alternatives_korean:
  - 묵읍시다
  - 잠을 잡시다
  lexicon: HALOT
  rationale: לון의 숙박/야숙 의미를 현대 한국어에서 자연스럽게 풀어 ‘밤을 지냅시다’로 옮겼습니다. ‘묵다’보다 구어체지만, 여기서는 권유형 대화에 맞습니다.
