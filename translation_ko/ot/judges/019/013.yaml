  source_fidelity: 히브리어의 명령형 לְךָ와 청유형 וְנִקְרְבָה·וְלַנּוּ의 진행 및 숙박 의미, 그리고 지명 기브아와 라마는 대체로 충실히 반영되었습니다. 다만 ‘가까이 가서’는 뒤의 ‘기브아나 라마에서 밤을 지냅시다’와 결합될 때 실제로 그곳에 가서 묵는다는 뜻을 다소 어색하게 만듭니다.
  naturalness: ‘오십시오. 우리가 … 지냅시다’는 한 발화 안에서 상대에게 하는 높임 명령과 화자-청자 공동 청유가 부자연스럽게 교차합니다. ‘자, 우리가 … 갑시다’가 현대 표준어 합쇼체의 공동 이동 권유로 자연스럽습니다. 또한 각주 표지는 해당 어휘 바로 뒤에 두는 편이 명확합니다.
