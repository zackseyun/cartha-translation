base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
  footnotes:
  - marker: a
    text: Or “the wayfarer” or “the guest.” The Hebrew term refers to one who is traveling and, by extension in hospitality contexts, a guest.
    reason: lexical_alternative
  - marker: b
    text: Or “in the street of the city.” The Hebrew more specifically denotes a broad public place or square.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 눈을 들어 도시의 넓은 광장[a]에 있는 그 나그네를 보았습니다. 그 늙은 사람이 말했습니다. “어디로 가십니까? 또 어디에서 오셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רְחוֹב는 보통 좁은 ‘거리’보다 넓은 공공 장소나 광장을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  english_pob_choice: He looked up
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 올려
  - 눈을 들어 올려
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘눈을 들어’이므로 한국어에서도 이를 살리되, 자연스러운 서술로 옮겼습니다.
- source_word: הָאִישׁ הָאֹרֵחַ
  english_pob_choice: the traveler
  chosen_korean: 그 나그네
  alternatives_korean:
  - 그 여행자
  - 그 길손
  - 그 손님
  lexicon: HALOT
  rationale: אֹרֵחַ는 이동 중인 사람을 가리키며, 문맥상 낯선 나그네/길손의 뉘앙스가 있어 ‘나그네’가 가장 직접적입니다.
- source_word: בִּרְחֹב הָעִיר
  english_pob_choice: in the open square of the city
  chosen_korean: 성벽 없는 도시의 넓은 공터
  alternatives_korean:
  - 도시의 넓은 광장
  - 도시의 큰 길
  - 도시의 거리
  lexicon: HALOT
  rationale: רְחוֹב는 좁은 ‘거리’보다 넓은 공개 공간을 뜻하므로, 공공성이 드러나는 ‘넓은 공터’로 옮겼습니다.
- source_word: אָנָה תֵלֵךְ וּמֵאַיִן תָּבֹוא
  english_pob_choice: Where are you going, and where do you come from?
  chosen_korean: 어디로 가십니까? 또 어디에서 오셨습니까?
  alternatives_korean:
  - 어디로 가십니까? 또 어디서 오셨습니까?
  - 어디로 가려 하십니까? 또 어디에서 오셨습니까?
  lexicon: HALOT
  rationale: 목적지와 출발지를 묻는 이중 질문을 한국어의 자연스러운 예의체로 옮겼습니다.
theological_decisions:
- issue: 낯선 사람을 부르는 호칭과 대화체의 예절 수준
  chosen_reading: 본문의 직접 화법은 공손한 질문형으로 유지하되, 히브리어의 평이한 서술을 과도하게 격식화하지 않았습니다.
  alternative_readings:
  - 더 구어적인 반말체
  - 더 고어적인 성서 문체
  rationale: 장면은 환대 상황의 일상 대화이므로 현대 표준어 합쇼체가 원문의 의미를 가장 무리 없이 전달합니다.
  doctrine_reference: n/a
