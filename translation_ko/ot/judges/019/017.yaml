  text: 그가 눈을 들어 성벽 없는 도시의 넓은 공터에 있는 그 나그네를 보았습니다. 그러자 그 늙은 사람이 말했습니다. “어디로 가십니까? 또 어디에서 오셨습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
