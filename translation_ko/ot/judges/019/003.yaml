base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to speak to her heart,'' an idiom for speaking tenderly or persuasively.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew form in 'to bring ... back' is textually difficult; context indicates that he intended to bring the woman back.
    reason: textual_variant
translation:
  language: ko
  text: 그의 남편은 일어나 그녀를 따라가서 그녀에게 마음을 열고 그녀를 데려오려 했습니다[a]. 그의 젊은 종도 그와 함께했고, 나귀 두 마리도 있었습니다. 그녀는 그를 자기 아버지의 집으로 데려갔고, 그 젊은 여자의 아버지는 그를 보고 그를 맞으러 기뻐했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음’을 뜻하는 히브리어 관용 표현을 반영한 번역입니다. 다정하게 또는 설득력 있게 말한다는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서는 히브리어 동사 형태가 다소 어려우나, 문맥상 아버지가 그를 맞으러 기뻐했다는 뜻으로 이해됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 그의 남편
  alternatives_korean:
  - 그 여자의 남편
  - 그의 사람
  lexicon: HALOT
  rationale: 문맥상 결혼 관계를 가리키므로 직역적 ‘그의 남자’보다 자연스럽고 정확한 ‘남편’이 맞습니다.
- source_word: לְדַבֵּר עַל לִבָּהּ
  english_pob_choice: to speak to her heart
  chosen_korean: 그녀에게 마음을 열고
  alternatives_korean:
  - 그녀의 마음에 말하고
  - 그녀를 달래고
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되 한국어로는 ‘마음을 열고’로 옮겨, 다정하고 설득하는 말투라는 의미를 드러냈습니다.
- source_word: לַהֲשִׁיבוֹ
  english_pob_choice: and bring her back
  chosen_korean: 그녀를 데려오려 했습니다
  alternatives_korean:
  - 그녀를 다시 돌려오려 했습니다
  - 그녀를 회복시키려 했습니다
  lexicon: HALOT
  rationale: 본문의 의도는 여인을 다시 데려오는 것으로 보이므로, 문맥상 주체의 계획을 드러내는 ‘데려오려 했습니다’로 옮겼습니다.
- source_word: צֶמֶד חֲמֹרִים
  english_pob_choice: a pair of donkeys
  chosen_korean: 나귀 두 마리
  alternatives_korean:
  - 나귀 한 쌍
  - 한 쌍의 나귀
  lexicon: HALOT
  rationale: ‘쌍’의 형식을 유지할 수도 있으나 한국어 서술에서는 수량을 직접 드러내는 ‘두 마리’가 가장 자연스럽습니다.
