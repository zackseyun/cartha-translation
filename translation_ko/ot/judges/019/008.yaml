base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
  footnotes:
  - marker: a
    text: Hebrew literally, 'strengthen your heart.' This is an idiom for taking food and regaining strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다섯째 날 아침에 떠나려고 일찍 일어났지만, 그 젊은 여자의 아버지가 말했습니다. 「부디 마음을 조금 음식으로 힘내게 하고, 해가 기울 때까지 기다리십시오.」 그래서 두 사람은 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘마음을 강하게 하라’입니다. 음식 섭취를 통해 기력을 회복하라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  english_pob_choice: He got up early in the morning
  chosen_korean: 일찍 일어났지만
  alternatives_korean:
  - 아침 일찍 일어났지만
  - 이른 아침에 일어났지만
  lexicon: HALOT
  rationale: שׁכם의 ‘일찍 일어나다’라는 시간 강조를 살리되, 한국어에서는 ‘아침에’가 뒤 문맥에 이미 드러나므로 자연스럽게 압축했습니다.
- source_word: סְעָד נָא לְבָבְךָ
  english_pob_choice: Please strengthen your heart with a morsel of food
  chosen_korean: 부디 마음을 조금 음식으로 힘내게 하고
  alternatives_korean:
  - 부디 마음을 음식 한입으로 북돋우고
  - 부디 마음을 조금 먹고 힘내십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘마음/마음을 강하게 하다’를 유지하면서, 실제 의미가 음식 섭취임을 드러내기 위해 ‘조금 음식으로’라고 옮겼습니다.
- source_word: וְהִתְמַהְמְהוּ
  english_pob_choice: and wait
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 지체하십시오
  - 머무르십시오
  lexicon: HALOT
  rationale: 화자의 요청은 출발을 늦추라는 뜻이므로, 현대 한국어에서 가장 직접적인 ‘기다리다’를 선택했습니다.
- source_word: עַד נְטוֹת הַיּוֹם
  english_pob_choice: until the day declines
  chosen_korean: 해가 기울 때까지
  alternatives_korean:
  - 날이 기울 때까지
  - 해 질 때까지
  lexicon: HALOT
  rationale: ‘날이 기울다’의 시간 이미지를 살리면서, 한국어 관용 표현으로는 ‘해가 기울다’가 가장 자연스럽고 시적입니다.
theological_decisions:
- issue: 직접화법의 공손한 재현
  chosen_reading: 아버지의 권유를 합쇼체 명령형으로 옮겨, 화자가 상대에게 공손하게 권면하는 어조를 유지했습니다.
  alternative_readings:
