  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
  footnotes:
  - marker: a
    text: Or 'rape them.' The Hebrew verb can denote sexual violation/humiliation in this context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'what is good in your eyes,' an idiom meaning what seems good or pleasing to you.
    reason: cultural_note
  - marker: c
    text: Or 'this vile thing' or 'this disgraceful act.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 여기 제 처녀 딸과 그의 첩이 있습니다. 청하오니 내가 그들을 내어드리겠습니다. 그들을 욕보이고, 여러분 눈에 좋은 대로 그들에게 하십시오. 그러나 이 사람에게는 이 같은 몹쓸 짓을 하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 긴박하게 주의를 환기하는 감탄사로, 현대 합쇼체에서는 ‘보십시오’가 경고성과 정중함을 함께 살립니다.
- source_word: בִתִּי הַבְּתוּלָה
  english_pob_choice: my virgin daughter
  chosen_korean: 제 처녀 딸
  alternatives_korean:
  - 제 딸, 처녀인
  - 미혼인 딸
  lexicon: HALOT
  rationale: בְּתוּלָה의 핵심인 성적 미경험을 직접 드러내되, 단순히 사회적 신분인 ‘미혼’으로 약화시키지 않기 위해 ‘처녀 딸’로 옮겼습니다.
- source_word: וּפִילַגְשֵׁהוּ
  english_pob_choice: his concubine
  chosen_korean: 그의 첩
  alternatives_korean:
  - 그의 후처
  - 그의 부인
  lexicon: HALOT
  rationale: פִּילֶגֶשׁ의 통상적이고 가장 직접적인 대응어는 ‘첩’이며, 본문의 가족 질서를 흐리지 않으면서도 사회적 위계를 보존합니다.
- source_word: וְעַנּוּ אוֹתָם
  english_pob_choice: violate them
  chosen_korean: 그들을 욕보이고
  alternatives_korean:
  - 그들을 강간하고
  - 그들을 학대하고
  - 그들을 굴욕스럽게 하고
  lexicon: HALOT
  rationale: 동사 ענה는 여기서 성적 폭력과 모욕의 뜻을 띠므로, 한국어에서는 특정 형법 용어로 과도하게 좁히기보다 ‘욕보이다’로 그 폭력성과 수치를 함께 살렸습니다.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  english_pob_choice: do to them what is good in your eyes
  chosen_korean: 여러분 눈에 좋은 대로 그들에게 하십시오
  alternatives_korean:
  - 여러분이 좋게 여기는 대로 그들에게 하십시오
  - 마음대로 그들을 다루십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스럽게 이해되도록 ‘눈에 좋은 대로’로 옮겨, 가해자들의 자의적 판단을 드러냈습니다.
- source_word: הַנְּבָלָה
  english_pob_choice: outrageous thing
  chosen_korean: 몹쓸 짓
  alternatives_korean:
  - 망측한 일
  - 수치스러운 짓
  - 악랄한 짓
  lexicon: HALOT
  rationale: נְבָלָה는 단순한 실수나 무지를 넘어선 도덕적 추악함을 가리키므로, 현대 한국어에서 강한 윤리적 비난을 담는 ‘몹쓸 짓’이 가장 적절합니다.
theological_decisions:
- issue: 수치와 성폭력을 담은 동사 ענה의 한국어 강도
  chosen_reading: ‘욕보이고’로 옮겨 성적 폭력과 굴욕의 이중 의미를 유지합니다.
  alternative_readings:
  - 강간하고
  - 학대하고
  - 굴욕을 주고
  rationale: 본문은 끔찍한 성폭력 제안을 말하지만, 원어 동사가 법률적 용어 하나로만 고정되지는 않으므로, 의미를 과잉 특정하지 않으면서도 폭력성을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: נְבָלָה의 윤리적 판단 강도
  chosen_reading: ‘몹쓸 짓’으로 번역해 단순한 예절 위반이 아니라 극도의 도덕적 추악함을 나타냅니다.
  alternative_readings:
  - 수치스러운 일
  - 악한 일
  - 망측한 일
  rationale: 이 단어는 지적 어리석음보다 공동체적·윤리적 파괴를 가리키므로, 한국어에서도 강한 도덕 평가가 살아 있는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 6
