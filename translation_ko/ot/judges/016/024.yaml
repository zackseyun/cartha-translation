    rationale: 원문은 원수를 ‘우리 땅을 황폐하게 한 자’와 ‘우리의 죽은 자들을 많이 낸 자’로 병렬적으로 수식합니다. 수정문은 이 관계와 ‘죽은 자들/전사자들’의 의미를 명확히 합니다.
