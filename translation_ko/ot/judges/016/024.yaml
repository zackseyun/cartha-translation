  source_fidelity: 초안의 ‘우리 죽임을 당하게 한’은 히브리어 חֲלָלֵינוּ(‘우리의 죽은 자들/전사자들’)를 부자연스럽게 처리하여, 원수가 낸 희생자들이라는 뜻을 충분히 드러내지 못합니다. 또한 ‘황폐케’는 현대 표준어 문체에 맞지 않습니다. 수정문은 원수가 땅을 황폐하게 하고 그들의 죽은 자들을 많이 낸 자라는 병렬 수식을 보존합니다.
  naturalness: 현대 한국어 합쇼체에 맞추어 문장을 나누고, 직접 인용을 자연스럽게 처리했습니다. ‘자기들의 신’은 블레셋 백성의 발화를 가리키는 문맥에서 적절합니다.
  terminology: ‘찬양하다’, ‘우리 손에 넘겨주셨습니다’는 각각 הָלַל 및 נָתַן בְּיָד의 문맥상 뜻을 자연스럽게 반영합니다. ‘우리의 죽은 자들’은 교단적 해석을 더하지 않고 חֲלָלֵינוּ의 의미를 보존합니다.
  issues:
