  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
  footnotes:
  - marker: a
    text: Or, “like any other man.”
    reason: lexical_alternative
translation:
  language: ko
  text: 삼손이 그 여자에게 말했습니다. “만일 그들이 마르지 않은 새 활시위 일곱 개로 나를 묶으면, 나는 약해지고 사람들 가운데 한 사람처럼 될 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다른 보통 사람처럼.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  english_pob_choice: And Samson said to her
  chosen_korean: 삼손이 그 여자에게 말했습니다
  alternatives_korean:
  - 그때 삼손이 그녀에게 말했습니다
  - 그리고 삼손이 그녀에게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 이야기체 wayyiqtol을 자연스러운 한국어 서술로 옮기되, 이어지는 대화의 수신자를 분명히 하기 위해 ‘그 여자에게’로 표현했습니다.
- source_word: יְתָרִים
  english_pob_choice: bowstrings
  chosen_korean: 활시위
  alternatives_korean:
  - 줄
  - 끈
  lexicon: HALOT
  rationale: 문맥상 삼손 이야기의 매개물은 일반적인 끈이 아니라 활시위이므로, 영어 POB의 구체성을 따라 가장 정확한 한국어를 선택했습니다.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  english_pob_choice: fresh ... that have not dried
  chosen_korean: 마르지 않은 새
  alternatives_korean:
  - 촉촉한
  - 젖어 있는
  - 마르지 않은
  lexicon: HALOT
  rationale: 직역하면 ‘축축한’ 계열이지만 활시위와 함께 쓰일 때는 ‘마르지 않은 새’가 의미를 가장 자연스럽고 분명하게 전달합니다.
- source_word: וְחָלִיתִי
  english_pob_choice: then I will become weak
  chosen_korean: 나는 약해지고
  alternatives_korean:
  - 나는 약해질 것이고
  - 나는 기운이 빠지고
  lexicon: HALOT
  rationale: חלה의 ‘약해지다, 병약해지다’ 뜻을 살려 결과의 진행을 드러내되, 한국어에서는 미래적 결과를 자연스럽게 표현했습니다.
- source_word: כְּאַחַד הָאָדָם
  english_pob_choice: like one of the men
  chosen_korean: 사람들 가운데 한 사람처럼
  alternatives_korean:
  - 다른 보통 사람처럼
  - 평범한 사람처럼
  lexicon: HALOT
  rationale: 히브리어의 비교 표현을 살리면서도 한국어에서 부자연스러운 ‘한 사람의 인간’식 표현을 피하고, 평범한 인간으로서의 대비를 전달했습니다.
theological_decisions:
- issue: אָדָם 비교구의 성별-포함 표현
  chosen_reading: 사람들 가운데 한 사람처럼
  alternative_readings:
  - 보통 남자처럼
  - 평범한 사람처럼
  rationale: 문맥은 삼손의 비범한 힘과 대비되는 ‘보통 인간’의 상태를 말하지만, 한국어에서는 성별을 과도하게 고정하지 않으면서도 집합적 의미를 유지하는 표현이 가장 안정적입니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral; Contested terms table for אָדָם'
