translation:
  language: ko
  text: 삼손이 그녀에게 말했습니다. “만일 사람들이 아직 마르지 않은 활시위 일곱 개로 나를 묶으면, 나는 약해져서 보통 사람처럼[a] 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
