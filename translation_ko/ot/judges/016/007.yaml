revisions:
- from: 삼손이 그 여자에게 말했습니다. “만일 그들이 마르지 않은 새 활시위 일곱 개로 나를 묶으면, 나는 약해지고 사람들 가운데 한 사람처럼 될 것입니다.”[a]
  to: 삼손이 그녀에게 말했습니다. “만일 사람들이 아직 마르지 않은 활시위 일곱 개로 나를 묶으면, 나는 약해져서 보통 사람처럼[a] 될 것입니다.”
  rationale: ‘아직 마르지 않은’으로 לַחִים 및 뒤따르는 ‘마르지 않은’의 의미를 정확히 반영하고, ‘새’가 불러오는 신품의 함의를 제거했습니다. 비교구는 본문에서 자연스러운 ‘보통 사람처럼’으로 옮기되, 히브리어의 더 가까운 표현은 각주에 보존했습니다. 각주 표지도 해당 비교구에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:32Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 לַחִים은 ‘새’(new)라기보다 ‘아직 마르지 않은, 신선한’이라는 뜻이므로 ‘새 활시위’는 불필요하게 ‘신품’의 의미를 더할 수 있습니다. 또한 부정적 복수 주어는 한국어에서 ‘사람들이’로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘사람들 가운데 한 사람처럼’은 문법상 가능하지만 현대 한국어 성경 문체로는 다소 직역투입니다. 문맥의 ‘비범한 삼손과 대비되는 보통 인간’이라는 의미를 ‘보통 사람처럼’으로 자연스럽게 전달할 수 있습니다. 각주 표지는 해당 비교 표현에 직접 붙이는 편이 적절합니다.
  terminology: ‘삼손’, ‘활시위’, ‘약해져서’는 적절합니다. 수신자를 가리키는 אֵלֶיהָ는 문맥상 ‘그녀에게’가 자연스럽고 충실합니다. אָדָם은 여기서 보통 인간을 뜻하는 집합적 용법이므로 본문에서는 ‘보통 사람’으로, 각주에서는 더 가까운 비교 표현으로 보완합니다.
  issues:
  - severity: medium
    issue: ‘마르지 않은 새 활시위’의 ‘새’
    rationale: 히브리어 לַחִים은 ‘축축한/신선한, 아직 마르지 않은’을 뜻합니다. ‘새’는 한국어에서 새로 만든 물건이라는 의미를 추가할 수 있으므로 삭제하는 것이 안전합니다.
  - severity: low
    issue: ‘사람들 가운데 한 사람처럼’의 직역투
    rationale: כְּאַחַד הָאָדָם의 비교 의미는 보통 인간이라는 대비입니다. ‘보통 사람처럼’이 현대 표준 한국어에서 더 자연스럽고 문맥에 맞으며, 대안은 각주로 보존할 수 있습니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 어휘 대안이 비교구에 관한 것이므로 문장 끝이 아니라 해당 표현 바로 뒤에 두는 편이 앵커 범위를 명확히 합니다.
