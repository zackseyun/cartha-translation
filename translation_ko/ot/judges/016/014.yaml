  text: וַ/תִּתְקַע֙ בַּ/יָּתֵ֔ד וַ/תֹּ֣אמֶר אֵלָ֔י/ו פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּיקַץ֙ מִ/שְּׁנָת֔/וֹ וַ/יִּסַּ֛ע אֶת הַ/יְתַ֥ד הָ/אֶ֖רֶג וְ/אֶת הַ/מַּסָּֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
  footnotes:
  - marker: a
    text: Or 'with the peg.' The Hebrew term can denote a peg or pin; in this weaving context, 'pin' best fits the sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'pulled out' or 'tore away.' The Hebrew verb can denote forceful removal.
    reason: lexical_alternative
  - marker: c
    text: Or 'the woven fabric.' The Hebrew term refers to the woven material on the loom.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 그것을 핀으로 고정하고 그에게 말했습니다. 「블레셋 사람들이 당신 위에 있습니다, 삼손!」 그가 잠에서 깨어나서 베틀의 핀과 날실을 잡아당겨 떼어냈습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말뚝으로.’ 히브리어는 말뚝이나 핀을 가리킬 수 있으나, 이 직조 문맥에서는 ‘핀’이 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잡아당겨’ 또는 ‘뜯어내어.’ 히브리어 동사는 힘을 주어 떼어내는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘짠 천.’ 히브리어는 베틀에서 짜인 재료를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע בַּיָּתֵד
  english_pob_choice: she fastened it with the pin
  chosen_korean: 그녀는 그것을 핀으로 고정하고
  alternatives_korean:
  - 말뚝으로 박고
  - 핀으로 꽂고
  - 고정하고
  lexicon: HALOT
  rationale: תקע는 ‘박다/고정하다’의 범위를 가지며, 직조 맥락에서는 머리카락을 베틀에 붙들어 두는 동작이므로 ‘핀으로 고정하다’가 자연스럽고 원문 의미를 잘 반영합니다.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  english_pob_choice: The Philistines are upon you
  chosen_korean: 블레셋 사람들이 당신 위에 있습니다
  alternatives_korean:
  - 블레셋 사람들이 당신에게 들이닥칩니다
  - 블레셋 사람들이 당신을 공격합니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 경보 표현을 직역적으로 살려 긴박함을 유지했습니다. 한국어에서는 ‘~위에 있습니다’가 다소 낯설 수 있으나, 원문의 관용성을 보존하기 위해 유지했습니다.
- source_word: הַיְתַד הָאֶרֶג
  english_pob_choice: the pin of the loom
  chosen_korean: 베틀의 핀
  alternatives_korean:
  - 직조용 핀
  - 베틀 말뚝
  lexicon: HALOT
  rationale: 문맥상 직조 도구를 가리키므로 ‘베틀’로 옮기고, יָתֵד는 여기서 ‘핀’이 가장 자연스럽습니다. 영어 POB의 직조 맥락을 반영하되 과도하게 설명적이지 않게 했습니다.
- source_word: וַיִּסַּע אֶת ...
  english_pob_choice: pulled away
  chosen_korean: 잡아당겨 떼어냈습니다
  alternatives_korean:
  - 끌어냈습니다
  - 잡아뜯었습니다
  - 떼어냈습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 힘을 주어 분리하는 동작이므로, ‘잡아당겨 떼어내다’가 원문의 물리적 힘과 결과를 함께 전달합니다.
- source_word: הַמַּסָּכֶת
  english_pob_choice: the web
  chosen_korean: 날실
  alternatives_korean:
  - 직조한 천
  - 베틀의 짜임
  lexicon: HALOT
  rationale: 이 단어는 직조된 재료를 가리키므로 직조 맥락에서 의미를 살려 번역했습니다. 다만 한국어 독자에게는 기술적일 수 있어, 본문에서는 간결성을 위해 ‘날실’로 제시했습니다.
theological_decisions:
- issue: 삼손이 깨어나는 장면의 서술 톤
  chosen_reading: 평이한 서술체로 유지하고, 드라마적 긴박함은 관용구와 동사 선택으로 살렸습니다.
  alternative_readings:
  - 더 감탄조로 옮기기
  - 현대 구어체로 강하게 다듬기
  rationale: 이 절은 서사 진행이 핵심이므로 과장된 표현보다 원문의 사건성과 리듬을 보존하는 것이 적절합니다.
  doctrine_reference: 서사문 번역 원칙
