  source_fidelity: ‘날실’은 경사(날실)라는 특정 직조 요소를 뜻하여, 짜인 재료를 가리키는 הַמַּסָּכֶת의 범위보다 지나치게 좁습니다. 또한 פְּלִשְׁתִּים עָלֶיךָ를 ‘당신 위에 있습니다’로 옮긴 것은 한국어 관용에 맞지 않아 경보의 의미가 불분명합니다. 이를 관용적인 긴급 경보 표현으로 수정했습니다.
  naturalness: 합쇼체 서술과 대화의 격식은 유지하되, ‘당신 위에 있습니다’를 ‘당신에게 들이닥쳤습니다’로 고쳐 현대 표준 한국어에서 자연스럽고 긴급한 표현이 되게 했습니다. 각 주석 표지는 해당 어휘 바로 뒤에 배치했습니다.
  terminology: יָתֵד는 직조 문맥상 ‘핀’으로 유지했습니다. הַמַּסָּכֶת는 ‘날실’ 대신 직조 결과물의 범위를 보존하는 ‘짠 천’으로 옮겼습니다.
