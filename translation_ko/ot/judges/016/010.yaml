id: JDG.16.10
reference: Judges 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הִנֵּה֙ הֵתַ֣לְתָּ בִּ֔/י וַ/תְּדַבֵּ֥ר אֵלַ֖/י כְּזָבִ֑ים עַתָּה֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה תֵּאָסֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
  footnotes:
  - marker: a
    text: Or 'you have made a fool of me'; the Hebrew verb can convey mocking or trifling with someone through deception.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 들릴라가 삼손에게 말했습니다. “보십시오, 당신은 저를 우롱했고 저에게 거짓말을 했습니다. 이제 부디 당신이 무엇으로 묶일 수 있는지 말해 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ...가 말했습니다
  alternatives_korean:
  - 그리고 ...가 말했습니다
  - 그때 ...가 말했습니다
  lexicon: WLC/HALOT
  rationale: 와ו 연속의 서술 진행을 한국어 자연스러운 순서 진행 표현으로 옮겼습니다.
- source_word: הֵתַלְתָּ בִּי
  english_pob_choice: you have mocked me
  chosen_korean: 저를 놀려 왔고
  alternatives_korean:
  - 저를 조롱했고
  - 저를 속였고
  - 저를 우롱했고
  lexicon: HALOT
  rationale: 문맥상 단순 조롱보다 속임수를 동반한 ‘놀리다/우롱하다’의 뉘앙스가 있어, POB의 ‘mocked me’에 가깝게 자연스럽게 옮겼습니다.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  english_pob_choice: spoken lies to me
  chosen_korean: 저에게 거짓말을 했습니다
  alternatives_korean:
  - 저에게 거짓들을 말했습니다
  - 저에게 거짓을 말했습니다
  - 저에게 거짓말들을 했습니다
  lexicon: HALOT
  rationale: ‘말하다 + 거짓들’의 구조를 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼고, 단수·복수의 반복적 거짓 진술을 포괄합니다.
- source_word: בַּמֶּה תֵּאָסֵר
  english_pob_choice: what you may be bound with
  chosen_korean: 무엇으로 묶일 수 있는지
  alternatives_korean:
  - 무엇으로 결박될 수 있는지
  - 어떤 것에 의해 묶일 수 있는지
  - 무엇에 묶이게 될지
  lexicon: HALOT
  rationale: בַּמֶּה의 도구격 ‘무엇으로’와 니팔 ‘묶이다’를 반영하되, 문맥상 덤불한 추궁을 살려 자연스러운 간접의문으로 처리했습니다.
