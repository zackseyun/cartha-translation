  to: 그러자 들릴라가 삼손에게 말했습니다. “보십시오, 당신은 저를 우롱했고 저에게 거짓말을 했습니다. 이제 부디 당신이 무엇으로 묶일 수 있는지 말해 주십시오.”
  rationale: 'A limited revision removes the unsupported continuative nuance in ''놀려 왔고.'' The revised ''우롱했고'' retains the contextually deceptive and humiliating sense of התל while maintaining the distinction from the subsequent charge that Samson spoke lies. No footnote is necessary: the rendering is suitably broad, and the Korean draft contains no footnote anchor requiring repair.'
  reviewer_model: gpt-5.6-terra
