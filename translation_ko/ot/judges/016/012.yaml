  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
  footnotes:
  - marker: a
    text: Or 'cords' for 'ropes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the one lying in wait was in the inner room.' The Hebrew uses a singular participle for the hidden watcher/ambush.
    reason: lexical_alternative
  - marker: c
    text: '''Inner room'' may also be rendered ''chamber.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 들릴라는 새 밧줄들[a]을 가져다가 그것들로 그를 묶고 그에게 말했습니다. “블레셋 사람들이 당신에게 달려듭니다, 삼손!” 그때 매복한 자는 안쪽 방[b][c]에 앉아 있었는데, 그는 그 밧줄들을 그의 팔에서 실처럼 끊어 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밧줄들’은 히브리어 עֲבֹתִים의 일반적 의미를 반영한 것입니다. ‘끈들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘매복한 자’는 히브리어의 단수 분사를 반영한 표현입니다. 문맥상 숨은 자들이나 복병 무리 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘안쪽 방’은 히브리어 חֶדֶר의 가능한 번역입니다. ‘방’이나 ‘방실’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים חֲדָשִׁים
  english_pob_choice: new ropes
  chosen_korean: 새 밧줄들
  alternatives_korean:
  - 새 끈들
  - 새 동아줄들
  lexicon: HALOT
  rationale: עֲבֹתִים은 가는 끈보다 두껍게 묶는 밧줄류를 가리키므로, 현대 한국어에서는 ‘밧줄들’이 가장 자연스럽고 본문 대비(실처럼)도 잘 드러냅니다.
- source_word: וַתַּאַסְרֵהוּ
  english_pob_choice: bound him
  chosen_korean: 그를 묶고
  alternatives_korean:
  - 그를 결박하고
  - 그를 동여매고
  lexicon: HALOT
  rationale: אסר의 기본 의미를 살리면서도, 서사 문맥에서 과도하게 법정적이거나 군사적인 느낌을 주지 않는 일반적인 표현으로 옮겼습니다.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  english_pob_choice: The Philistines are upon you
  chosen_korean: 블레셋 사람들이 당신에게 들이닥쳤습니다
  alternatives_korean:
  - 블레셋 사람들이 당신 위에 있습니다
  - 블레셋 사람들이 당신에게 달려듭니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 긴박함을 살리되, 한국어에서는 ‘들이닥쳤습니다’가 급습의 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: וְהָאֹרֵב יֹשֵׁב בֶּחָדֶר
  english_pob_choice: the ambush was sitting in the inner room
  chosen_korean: 매복한 자는 안쪽 방에 앉아 있었는데
  alternatives_korean:
  - 매복자는 안방에 숨어 있었는데
  - 복병은 안쪽 방에 앉아 있었는데
  lexicon: HALOT
  rationale: 단수 분사형을 살려 ‘매복한 자’로 옮겼고, חֶדֶר은 숨을 수 있는 실내를 뜻하므로 ‘안쪽 방’이 ‘inner room’의 의미를 무난하게 반영합니다.
- source_word: וַיְנַתְּקֵם מֵעַל זְרֹעֹתָיו כַּחוּט
  english_pob_choice: he snapped them from off his arms like a thread
  chosen_korean: 그는 그것들을 팔에서 실처럼 끊어 버렸습니다
  alternatives_korean:
  - 그는 그것들을 팔에서 실마냥 끊어 버렸습니다
  - 그는 그것들을 팔에서 실처럼 끊었습니다
  lexicon: HALOT
  rationale: 너무 문자적인 ‘팔에서 떨어뜨리다’보다 끊어내는 동작을 분명히 드러내는 ‘끊어 버렸습니다’가 서사와 비교구문을 함께 살립니다.
theological_decisions:
- issue: 매복한 자(단수 분사)의 표현 방식
  chosen_reading: 본문의 단수 분사형을 반영해 ‘매복한 자’로 옮겼습니다.
  alternative_readings:
  - ‘복병’처럼 집단적 표현으로 처리
  - ‘매복’이라는 추상명사로 처리
  rationale: 히브리어는 단수 분사를 사용하므로, 숨은 공격자 집단을 뜻하더라도 단수 감각을 유지하는 편이 원문 관찰에 더 충실합니다.
  doctrine_reference: 문맥 충실성 / 히브리어 문법
- issue: 직접화법의 긴박한 경고 어조
  chosen_reading: ‘블레셋 사람들이 당신에게 들이닥쳤습니다’로 급박한 외침을 살렸습니다.
  alternative_readings:
  - ‘블레셋 사람들이 당신 위에 있습니다’
  - ‘블레셋 사람들이 당신에게 달려듭니다’
  rationale: 이 장면은 단순 정보 전달이 아니라 기습 경고이므로, 한국어에서도 즉시성을 주는 동사를 선택하는 것이 서사 효과를 보존합니다.
  doctrine_reference: 서사 수사 보존
