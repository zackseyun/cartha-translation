  text: וַ/תֹּ֨אמֶר דְּלִילָ֜ה אֶל שִׁמְשׁ֗וֹן עַד הֵ֜נָּה הֵתַ֤לְתָּ בִּ/י֙ וַ/תְּדַבֵּ֤ר אֵלַ/י֙ כְּזָבִ֔ים הַגִּ֣ידָ/ה לִּ֔/י בַּ/מֶּ֖ה תֵּאָסֵ֑ר וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם תַּאַרְגִ֗י אֶת שֶׁ֛בַע מַחְלְפ֥וֹת רֹאשִׁ֖/י עִם הַ/מַּסָּֽכֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
  footnotes:
  - marker: a
    text: Or, “If you weave the seven braids of my hair with the loom,” or “into the woven fabric.” The Hebrew weaving term is somewhat specialized.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 들릴라가 삼손에게 말했습니다. “지금까지 당신은 저를 우롱하고 제게 거짓말을 했습니다. 무엇으로 당신이 묶일 수 있는지 제게 말해 주십시오.” 삼손이 그녀에게 말했습니다. “내 머리의 일곱 가닥을 베틀에 걸린 천과 함께[a] 짜면…”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 머리의 일곱 가닥을 베틀에 걸린 천 속에 짜 넣으면”이라고 옮길 수 있습니다. 히브리어 직조 용어는 전문적이며, 정확한 직조 방식은 불확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  english_pob_choice: you have mocked me
  chosen_korean: 저를 놀리고
  alternatives_korean:
  - 저를 조롱하고
  - 저를 속이고
  lexicon: HALOT
  rationale: 문맥상 단순한 농담이 아니라 속이면서 우롱하는 뉘앙스가 있어, ‘놀리다’를 써서 영어 POB의 ‘mocked me’와 같은 효과를 살렸습니다.
- source_word: כְּזָבִים
  english_pob_choice: lies
  chosen_korean: 거짓말만
  alternatives_korean:
  - 거짓말들
  - 거짓됨만
  lexicon: HALOT
  rationale: 복수 명사이지만 한국어에서는 자연스럽게 ‘거짓말만’으로 옮기면 앞절의 반복성과 함께 읽기 좋습니다.
- source_word: בַּמֶּה תֵּאָסֵר
  english_pob_choice: what you may be bound with
  chosen_korean: 무엇으로 당신을 묶을 수 있는지
  alternatives_korean:
  - 어떻게 당신을 묶을 수 있는지
  - 무엇으로 당신이 결박될 수 있는지
  lexicon: HALOT
  rationale: 히브리어의 도구격 ‘~으로’를 살려 ‘무엇으로’를 유지했고, 피동 가능성을 ‘묶을 수 있는지’로 자연스럽게 표현했습니다.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  english_pob_choice: the seven locks of my head
  chosen_korean: 내 머리의 일곱 가닥 머리털
  alternatives_korean:
  - 내 머리의 일곱 머리카락 땋은 것
  - 내 머리의 일곱 땋은 머리
  lexicon: HALOT
  rationale: מַחְלְפוֹת는 머리카락의 ‘가닥/땋은 머리’ 의미가 있어, 너무 해석을 좁히지 않으면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: עִם הַמַּסָּכֶת
  english_pob_choice: with the web
  chosen_korean: 베틀실과 함께 짠다면
  alternatives_korean:
  - 그 직물과 함께
  - 베틀과 함께
  lexicon: HALOT
  rationale: 이 어휘는 직조 문맥의 전문 용법으로, 영어 POB의 보류된 여지를 한국어에서도 살리기 위해 ‘베틀실’과 ‘짠다면’을 사용해 과도한 구체화를 피했습니다.
