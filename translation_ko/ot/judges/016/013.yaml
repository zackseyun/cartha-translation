  source_fidelity: ‘베틀실’은 הַמַּסָּכֶת(직조된 천·베틀에 걸린 날실/직물)를 정확히 가리키지 않으며, ‘무엇으로 당신을 묶을 수 있는지’는 원문의 피동 표현보다 행위자의 능력에 초점을 둡니다. 이를 각각 ‘베틀에 걸린 천과 함께’와 ‘무엇으로 당신이 묶일 수 있는지’로 고쳤습니다. 원문이 조건절만으로 끝나는 미완결 표현인 점은 말줄임표로 보존했습니다.
  naturalness: 합쇼체는 대체로 적절하나, ‘베틀실과 함께 짠다면’은 한국어에서 무엇을 어떻게 짜는지 어색하고 직조 용어의 지시 대상도 불분명합니다. ‘내 머리의 일곱 가닥을 베틀에 걸린 천과 함께 짜면’이 자연스럽습니다. ‘우롱하고’는 이 문맥의 기만적으로 희롱한다는 뜻과 현대의 격식 있는 서술에 더 잘 맞습니다.
  terminology: 들릴라, 삼손은 통용 표기이며 적절합니다. מַחְלְפוֹת는 머리카락의 가닥 또는 땋은 가닥을 뜻할 수 있으므로 본문에서는 ‘일곱 가닥’으로 번역하고, 각주에서 직조 방식의 불확실성을 밝혔습니다. 마쎄케트의 정확한 기술적 지시는 논쟁의 여지가 있어 본문과 각주 모두 과도하게 단정하지 않았습니다.
