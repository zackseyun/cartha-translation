language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֣ גָד֑וֹל וּ/בַ/מֶּ֥ה תֵאָסֵ֖ר לְ/עַנּוֹתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
  footnotes:
  - marker: a
    text: Or 'and by what means you could be bound to subdue you.' The Hebrew verb can mean 'afflict,' 'humble,' or in context 'subdue/overpower.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 들릴라가 삼손에게 말했습니다. 「부디 당신의 큰 힘이 어디에 있는지, 또 어떻게 하면 당신을 묶어 괴롭힐 수 있는지 저에게 말해 주십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ענה는 문맥에 따라 ‘괴롭히다, 억누르다, 낮추다’로 옮길 수 있습니다. 여기서는 삼손을 제압하려는 의미를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그때 ... 말했습니다
  - 그리고 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우연속의 흐름을 자연스러운 한국어로 살려, 앞뒤 사건의 연속성을 드러내는 「그러자」로 옮겼습니다.
- source_word: הַגִּידָה נָּא לִי
  english_pob_choice: Please tell me
  chosen_korean: 부디 ... 저에게 말해 주십시오
  alternatives_korean:
  - 제발 ... 말해 주십시오
  - 알려 주십시오
  lexicon: HALOT
  rationale: נא의 간청·정중한 요청을 현대 합쇼체에서 가장 자연스럽게 드러내는 표현으로 「부디」와 「말해 주십시오」를 사용했습니다.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  english_pob_choice: where your great strength lies
  chosen_korean: 당신의 큰 힘이 어디에 있는지
  alternatives_korean:
  - 당신의 큰 힘이 무엇인지
  - 당신의 힘이 어디서 큰지
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 מקור문의 질문 구조를 유지하기 위해, 힘의 ‘근거/소재’를 묻는 의미를 「어디에 있는지」로 옮겼습니다.
- source_word: וּבַמֶּה תֵאָסֵר לְעַנּוֹתֶךָ
  english_pob_choice: and how you could be bound to afflict you
  chosen_korean: 또 어떻게 하면 당신을 묶어 괴롭힐 수 있는지
  alternatives_korean:
  - 또 어떻게 하면 당신을 묶어 afflict할 수 있는지
  - 또 어떻게 하면 당신을 묶어 학대할 수 있는지
  lexicon: HALOT
  rationale: תֵאָסֵר의 ‘묶이다’와 לְעַנּוֹתֶךָ의 문맥상 ‘괴롭히다/억누르다’ 가능성을 살리되, 한국어에서 의미가 자연스럽게 이어지도록 했습니다.
theological_decisions:
- issue: לְעַנּוֹתֶךָ의 의미 범위
  chosen_reading: 문맥상 ‘괴롭히다’로 옮겨, 단순한 감정적 ‘괴롭힘’이 아니라 삼손을 제압하기 위한 실제적 학대·억압의 뉘앙스를 열어 두었습니다.
  alternative_readings:
  - 억누르다
  - 학대하다
  - 굴복시키다
  rationale: 히브리어 ענה는 ‘괴롭히다, 압제하다, 낮추다’까지 폭이 넓습니다. 본문에서는 삼손을 어떻게 결박하여 무력화할 수 있는지를 묻는 흐름이므로, 해석을 과도하게 좁히지 않는 표현을 선택했습니다.
  doctrine_reference: 문맥상 의미 범위 보존
- issue: 간청의 문체
  chosen_reading: 들릴라의 유혹적 요청을 부드러운 정중체로 재현해, 본문의 심리적 긴장을 살렸습니다.
  alternative_readings:
  - 직설적 명령형
  - 더 중립적인 서술체
  rationale: נא가 담는 간청의 뉘앙스를 한국어 합쇼체에서 반영하는 것이 원문의 대화 톤에 더 충실합니다.
  doctrine_reference: 서사적 발화 양식
