  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: ko
  text: 딜릴라는 삼손이 자기에게 마음속의 모든 것을 말한 것을 보고, 사람을 보내어 블레셋 방백들[b]을 불러 말했습니다. “이번에는 올라오십시오. 그가 그녀에게[a] 마음속의 모든 것을 말했습니다.” 그러자 블레셋 방백들은 딜릴라에게 올라와 손에 은[c]을 들고 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 직접 화법 가운데서도 “그녀에게”라고, 여성 단수 3인칭을 사용합니다. 문맥상 “나에게”가 기대될 수 있으나, 번역은 전승된 히브리어 본문을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 또는 “블레셋 통치자들.”
    reason: lexical_alternative
  - marker: c
    text: 그들이 대가로 가져온 은을 가리킵니다.
    reason: cultural_note
