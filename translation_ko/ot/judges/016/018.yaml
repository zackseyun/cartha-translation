review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses or obscures crucial referents: Samson told Delilah, not “him,” and the Philistine rulers went up to Delilah, not “him.” It also omits the force of Delilah’s sending before summoning them and does not preserve the received Hebrew’s unusual third-person feminine pronoun in her direct speech. The revision retains this pronoun explicitly and explains it in a note.'
  naturalness: The draft is largely in archaic biblical Korean (for example, “말하였노라,” “하매,” and “가지고 올라가니라”) rather than the required modern formal-polite 합쇼체. “그 모든 마음” is also unnatural in Korean. The revision uses natural formal-polite narration and renders the Hebrew idiom as “마음속의 모든 것.”
  terminology: “블레셋 방백들” is a suitable formal rendering of Philistine political leaders; a lexical-alternative note gives “블레셋 통치자들.” “은” is retained rather than generalized to money, with a cultural note identifying it as payment.
  issues:
  - severity: high
    issue: Key pronoun referents are inaccurate or ambiguous.
    rationale: The opening must identify Samson as the one who disclosed himself to Delilah, and the rulers must come up to Delilah. The draft’s “그에게” in both places does not convey the Hebrew referents.
  - severity: high
    issue: The direct speech does not preserve the received Hebrew’s third-person feminine pronoun.
    rationale: In the quotation the Masoretic Hebrew reads that he told “her” all his heart, although “me” would be contextually expected. This should be retained rather than silently harmonized.
  - severity: medium
    issue: The sequence “she sent and called” is reduced to only calling.
    rationale: Both Hebrew verbs should be represented; “사람을 보내어 ... 불렀습니다” preserves the sequence naturally.
  - severity: medium
    issue: Register is not modern formal-polite Korean.
    rationale: Archaic narrative forms conflict with the specified modern 합쇼체 target.
