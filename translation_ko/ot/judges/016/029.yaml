  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
  footnotes:
  - marker: a
    text: Or 'leaned against them.' The Hebrew verb can denote leaning or supporting oneself on something; 'braced himself against them' reflects the likely physical sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the two central pillars.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 삼손이 집이 의지하고 있던 가운데 두 기둥을 붙잡고, 오른손으로 하나를, 왼손으로 하나를 짚고 버텼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 기대었다.’ 히브리어 동사는 기대거나 몸을 지탱하는 뜻을 모두 가질 수 있는데, 문맥상 여기서는 몸을 지탱하는 동작이 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가운데 두 기둥.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  english_pob_choice: grasped
  chosen_korean: 붙잡고
  alternatives_korean:
  - 움켜잡고
  - 붙들고
  lexicon: HALOT
  rationale: 동사의 핵심은 강하게 손으로 잡는 동작이므로, 현대 한국어에서 자연스럽고 힘 있는 ‘붙잡고’로 옮겼습니다.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  english_pob_choice: the two middle pillars
  chosen_korean: 가운데 두 기둥
  alternatives_korean:
  - 두 중앙 기둥
  - 한가운데 두 기둥
  lexicon: HALOT
  rationale: ‘가운데’는 הַתָּוֶךְ의 중간/내부 의미를 간결하게 살리며, ‘기둥’은 עַמּוּדֵי에 정확히 대응합니다.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  english_pob_choice: he braced himself against them
  chosen_korean: 버텼습니다
  alternatives_korean:
  - 몸을 기대었습니다
  - 의지했습니다
  lexicon: HALOT
  rationale: 문맥상 단순히 기대는 것이 아니라 무게를 실어 지탱하는 동작이므로, 결과적 자세를 드러내는 ‘버텼습니다’가 가장 적절합니다.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  english_pob_choice: one with his right hand and one with his left
  chosen_korean: 오른손으로 하나를, 왼손으로 하나를
  alternatives_korean:
  - 오른쪽에 하나, 왼쪽에 하나를
  - 오른손에 하나, 왼손에 하나를
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 그대로 살리면서, 두 손 각각에 하나씩 놓였다는 뜻을 한국어로 자연스럽게 표현했습니다.
