    rationale: 본문이 이미 ‘가운데 두 기둥’인데 각주 b도 동일한 ‘가운데 두 기둥’을 제시하여 어휘 대안 기능을 하지 못합니다. ‘두 중앙 기둥’으로 고쳐야 합니다.
