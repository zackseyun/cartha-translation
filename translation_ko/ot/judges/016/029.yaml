- from: 그러자 삼손이 집이 의지하고 있던 가운데 두 기둥을 붙잡고, 오른손으로 하나를, 왼손으로 하나를 짚고 버텼습니다.[a][b]
  to: 그러자 삼손은 집을 떠받치고 있던 가운데 두 기둥을[b] 붙잡고, 오른손으로는 하나를, 왼손으로는 다른 하나를 짚어 그것들에 몸을 지탱했습니다.[a]
  rationale: ‘집을 떠받치고 있던’으로 기둥과 집의 구조적 관계를 명료하게 했고, סמך의 신체 동작은 ‘그것들에 몸을 지탱했습니다’로 옮겼습니다. ‘다른 하나’를 보충하여 두 기둥에 하나씩 대응한다는 분배적 의미를 한국어에서 명확히 했습니다. 각주 내용과 표지 위치도 각각의 원어 어구에 맞추어 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:11:02Z'
