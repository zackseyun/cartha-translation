  - severity: medium
    issue: ‘삼손이 하는 것을’이라는 표현
    rationale: 원문의 어휘적 범위를 보존하려는 의도는 타당하지만, 한국어에서는 무엇을 한다는 것인지 지나치게 불명확하고 어색합니다. 문맥상 오락을 위한 행위를 나타내는 ‘공연하는 모습’이 더 자연스럽고 충실합니다.
