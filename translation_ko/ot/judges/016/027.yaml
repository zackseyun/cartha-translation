source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת מָלֵ֤א הָֽ/אֲנָשִׁים֙ וְ/הַ/נָּשִׁ֔ים וְ/שָׁ֕מָּ/ה כֹּ֖ל סַרְנֵ֣י פְלִשְׁתִּ֑ים וְ/עַל הַ/גָּ֗ג כִּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ אִ֣ישׁ וְ/אִשָּׁ֔ה הָ/רֹאִ֖ים בִּ/שְׂח֥וֹק שִׁמְשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: Now the house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
  footnotes:
  - marker: a
    text: Or 'watching Samson perform' or more formally, 'watching Samson at sport.' The Hebrew expression uses the root שׂחק, which can denote laughing, playing, sporting, or entertaining.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 집은 남자들과 여자들로 가득 차 있었고, 블레셋의 모든 통치자들도 այնտեղ 있었습니다. 지붕 위에는 남자들과 여자들 약 삼천 명이 삼손이 공연하는 모습을[a] 지켜보고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘삼손의 놀이/오락 중에’라는 뜻입니다. 이 표현에 쓰인 어근은 웃다, 놀다, 희롱하다, 오락을 제공하다 등의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 건물
  - 그 집
  lexicon: HALOT
  rationale: 이 문맥에서는 특정 건물을 가리키지만, 히브리어가 단지 '집'이라고만 말하므로 과도한 구체화 없이 자연스럽게 옮겼습니다.
- source_word: סַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the lords of the Philistines
  chosen_korean: 블레셋의 모든 군주들
  alternatives_korean:
  - 블레셋의 모든 통치자들
  - 블레셋의 모든 족장들
  lexicon: HALOT
  rationale: סַרְנִים은 블레셋의 특유한 통치자 칭호이므로, 관습적이되 위계감을 살릴 수 있는 '군주들'을 선택했습니다.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  english_pob_choice: about three thousand
  chosen_korean: 약 삼천 명
  alternatives_korean:
  - 대략 삼천 명
  - 세천 명가량
  lexicon: HALOT
  rationale: 앞의 כִּ는 근사치를 나타내므로 '약'으로 처리했고, 수량 표현은 현대 한국어에 맞게 '명'을 보태었습니다.
- source_word: הָרֹאִים
  english_pob_choice: watching
  chosen_korean: 보고 있었습니다
  alternatives_korean:
  - 지켜보고 있었습니다
  - 바라보고 있었습니다
  lexicon: HALOT
  rationale: 분사형으로 진행 중인 동작을 나타내므로 현재 진행의 '보고 있었습니다'가 문맥상 가장 자연스럽습니다.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  english_pob_choice: as he performed
  chosen_korean: 삼손이 하는 것을
  alternatives_korean:
  - 삼손이 희롱당하는 것을
  - 삼손이 놀이는 것을
  lexicon: HALOT
  rationale: שׂחק는 '웃다/놀다/희롱하다/흥을 돋우다'까지 포괄하므로, 공연의 대상이 된 삼손의 동작을 직접 단정하지 않고 원문의 모호성을 살렸습니다.
theological_decisions:
- issue: 삼손이 무엇을 '하는지'를 한국어에서 얼마나 구체화할 것인가
  chosen_reading: 원문이 허용하는 범위 안에서 동작을 특정하지 않고 '삼손이 하는 것을'이라고 남겼습니다.
  alternative_readings:
  - 삼손이 공연하는 것을
  - 삼손이 흥을 돋우는 것을
  - 삼손이 그들 앞에서 놀리는 것을
  rationale: 히브리어 בִּשְׂחוֹק은 문맥상 조롱과 오락의 요소를 지니지만, 정확한 행위 내용은 명시되지 않으므로 이를 과도하게 해석하지 않았습니다.
  doctrine_reference: 본문의 서술적 모호성 보존 원칙
