  source_fidelity: 초두의 ‘이제’는 히브리어 본문에 대응하는 표현이 아니므로 삭제해야 합니다. 또한 בִּשְׂחוֹק שִׁמְשׁוֹן은 삼손이 오락거리로 행동하는 장면을 가리키며, ‘삼손이 하는 것을’은 한국어로 지나치게 불명확합니다. ‘공연하는 모습’은 문맥에 맞으면서도 행위의 세부를 과도하게 특정하지 않습니다.
  naturalness: ‘그 집은 남자들과 여자들로 가득 차 있었고’ 및 ‘지붕 위에는 … 지켜보고 있었습니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘블레셋의 모든 통치자들’은 이 문맥의 복수 정치 지도자들을 ‘군주들’보다 명료하게 전달합니다.
  terminology: הַבַּיִת는 ‘그 집’으로, סַרְנֵי פְלִשְׁתִּים은 ‘블레셋의 모든 통치자들’로 옮겼습니다. ‘공연하다’에는 שׂחק의 오락·놀이 의미를 반영하되, 본문의 정확한 행위 방식과 관객을 문장에 덧붙이지 않았습니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
