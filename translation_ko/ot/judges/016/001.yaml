  chosen_reading: 한국어 본문은 완곡어법을 보존한 ‘그에게로 들어갔습니다’로 두었습니다.
  alternative_readings:
  - 그와 성관계를 가졌습니다
  - 그와 관계를 맺었습니다
  rationale: 원문은 노골적 진술이 아니라 통용되는 완곡표현을 사용하므로, 본문에서 의미를 과도하게 높이지 않고 독자가 문맥상 성적 의미를 읽어낼 수 있게 하는 편이 원문에 더 충실합니다.
  doctrine_reference: 번역 철학 §1, §3, §6
