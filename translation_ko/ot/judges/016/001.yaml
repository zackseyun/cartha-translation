  source_fidelity: 가사로 간 것, 그곳에서 성매매 여성을 본 것, 그리고 בוא אל의 성적 완곡표현을 보존하려는 번역 방향은 원문과 영어 POB의 결정을 잘 따릅니다. 그러나 본문과 각주에서 여성 선행사 אִשָּׁה를 남성 대명사 ‘그’로 받았으므로, 원문의 성별 지시를 잘못 옮겼습니다.
  naturalness: ‘창녀’는 현대 한국어에서 다소 경멸적이고 낙인이 강한 말입니다. 이 문맥에서 직업·신분을 중립적으로 지시하는 ‘성매매 여성’이 더 자연스럽고 정확합니다. ‘그녀에게로 들어갔습니다’는 현대 일상어로는 낯설지만, 원문의 관용적 완곡어법을 대응시키는 번역으로 기능하며 각주가 의미를 밝혀 줍니다.
  terminology: ‘가사’와 ‘삼손’은 표준 성서 지명·인명으로 적절합니다. זוֹנָה에는 ‘성매매 여성’을 사용하고, 성적 행위를 본문에서 더 노골적으로 만들지 않도록 ‘그녀에게로 들어갔습니다’를 유지합니다.
