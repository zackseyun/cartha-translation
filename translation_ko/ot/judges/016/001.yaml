  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
  footnotes:
  - marker: a
    text: Or 'and he had sexual relations with her.' The Hebrew says literally, 'and he went in to her,' a common euphemistic expression in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 삼손이 가사로 갔습니다.[a] 거기서 그는 한 창녀를 보고 그에게로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 성관계를 가졌습니다.’ 히브리어는 문자적으로는 ‘그에게로 들어갔다’라고 되어 있으며, 이 문맥에서 흔한 성적 완곡어법입니다.
    reason: lexical_alternative
lexical_decisions:
