  english_pob_choice: went
  chosen_korean: 갔습니다
  alternatives_korean:
  - 가 버렸습니다
  - 여행했습니다
  lexicon: HALOT
  rationale: נarrative의 일반적인 이동 동사로서 단순한 ‘가다’가 가장 자연스럽고 원문 과장을 피합니다.
