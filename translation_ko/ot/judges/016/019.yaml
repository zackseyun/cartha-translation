  source_fidelity: 원문에서 주어는 들릴라(여성 단수)인데, 초안은 첫머리를 ‘그가’로 시작하여 주어가 바뀌었습니다. 또한 לָאִישׁ은 남자를 부르는 말인데 ‘한 여자’를 불렀다고 하여 의미가 반대가 되었습니다. 수정문은 여성 주어, ‘한 남자’, 일곱 가닥의 머리카락, 괴롭히기 시작함, 힘이 떠남이라는 원문의 순서와 의미를 충실히 반영합니다.
  naturalness: 초안의 ‘그에게 괴로움을 시작하매’는 현대 표준 한국어로 부자연스럽고 합쇼체 문체에도 맞지 않습니다. ‘그를 괴롭히기 시작했고’와 ‘떠났습니다’는 자연스러운 현대 합쇼체입니다.
  terminology: ‘무릎 위’는 עַל בִּרְכֶּיהָ의 직역적 표현을 유지합니다. מַחְלְפוֹת는 문맥상 머리카락의 가닥을 가리키므로 ‘머리카락 일곱 가닥’으로 옮겼습니다. ענה의 구체적 방식은 본문이 밝히지 않으므로 ‘괴롭히다’로 넓게 유지했습니다.
