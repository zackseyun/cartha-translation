  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
  footnotes:
  - marker: a
    text: Or, “with which no work has been done.”
    reason: lexical_alternative
  - marker: b
    text: Or, “be like any man,” that is, like an ordinary human being without unusual strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 말했습니다. “만일 그들이 나를 아직 한 번도 일에 쓰지 않은 새 밧줄로 묶으면[a], 나는 약해져서 보통 사람들 가운데 한 사람과 같아질 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “그것들로 아무 일도 하지 않은.”
    reason: lexical_alternative
  - marker: b
    text: 또는, “보통 사람 누구와도 같아질 것입니다.” 즉, 비범한 힘이 없는 보통 사람과 같아진다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  english_pob_choice: He said to her
  chosen_korean: 그가 그녀에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그녀에게 말했습니다
  - 그가 그 여자에게 말했습니다
  lexicon: WLC
  rationale: 서술 진행을 자연스럽게 살리되, 히브리어의 단순한 발화 도입을 과도하게 늘리지 않고 옮겼습니다.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  english_pob_choice: If they bind me
  chosen_korean: 만일 그들이 나를 … 묶으면
  alternatives_korean:
  - 만일 그들이 나를 묶으면
  - 만일 그들이 나를 단단히 묶으면
  lexicon: WLC
  rationale: אִם + 동사 반복의 조건문을 그대로 살려 ‘만일’로 옮겼고, 본문이 명시하지 않는 ‘단단히’는 넣지 않았습니다.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  english_pob_choice: with new ropes
  chosen_korean: 새 밧줄로
  alternatives_korean:
  - 새 밧줄들로
  - 새 끈으로
  - 새 로프로
  lexicon: HALOT
  rationale: עֲבֹתִים은 현대 한국어에서 가장 자연스럽고 문맥상 적절한 ‘밧줄’로 옮겼습니다.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  english_pob_choice: that have never been used for work
  chosen_korean: 아직 한 번도 일에 쓰지 않은
  alternatives_korean:
  - 일이 행해진 적이 없는
  - 어떤 일에도 사용되지 않은
  lexicon: WLC
  rationale: 직역보다 자연한 한국어로, ‘그 밧줄로 어떤 일도 한 적이 없다’는 미사용의 뜻을 분명히 했습니다.
- source_word: וְחָלִיתִי
  english_pob_choice: then I will become weak
  chosen_korean: 나는 기운이 쇠하여
  alternatives_korean:
  - 나는 약해져
  - 나는 쇠약해져
  - 나는 기력이 떨어져
  lexicon: HALOT
  rationale: חלה의 ‘약해지다/병들다’ 의미를 문맥에 맞게 ‘기운이 쇠하다’로 옮겨 삼손의 힘 상실을 드러냈습니다.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  english_pob_choice: and be like one of the men
  chosen_korean: 다른 사람 한 사람과 같아질 것입니다
  alternatives_korean:
  - 한 사람의 남자와 같아질 것입니다
  - 보통 사람 한 사람과 같아질 것입니다
  - 사람들 가운데 한 사람과 같아질 것입니다
  lexicon: HALOT
  rationale: הָאָדָם은 여기서 삼손과 대비되는 ‘보통의 인간’을 가리키므로, 남성적 대조를 살리면서도 한국어 자연성을 위해 ‘다른 사람 한 사람’으로 옮겼습니다.
theological_decisions:
- issue: הָאָדָם의 성별-대조 표현
  chosen_reading: ‘다른 사람 한 사람’으로 옮겨, 삼손이 초인적 힘을 잃으면 평범한 인간과 다르지 않게 된다는 대비를 살렸습니다.
  alternative_readings:
  - ‘한 남자와 같아질 것입니다’
  - ‘보통 남자 하나와 같아질 것입니다’
  - ‘어떤 사람과도 같아질 것입니다’
  rationale: 본문의 핵심은 인류 일반이 아니라 삼손과 ‘평범한 사람’의 대비이므로, 의미를 유지하면서도 한국어에서 부자연스러운 직역은 피했습니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral; contextual rendering of אָדָם'
