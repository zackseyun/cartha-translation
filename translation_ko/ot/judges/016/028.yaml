translation:
  language: ko
  text: 그때 삼손이 야훼께 부르짖으며 말했습니다. 「주 하나님, 부디 저를 기억해 주시고, 부디 이번 한 번만 저에게 힘을 주십시오. 하나님, 제가 블레셋 사람들에게 제 두 눈을 위하여 한 번의 복수로 복수하게 해 주십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 두 눈을 위하여’라고 하며, 블레셋 사람들이 삼손의 눈을 뽑아버린 일을 가리킵니다.
    reason: lexical_alternative
