revisions:
- from: 그때 블레셋의 방백들이 그녀에게 올라와 말했습니다. 「그를 유혹하여 그의 큰 힘이 어디에 있는지, 또 우리가 어떤 방법으로 그를 이길 수 있는지 보십시오. 그러면 우리가 그를 묶어 괴롭게 하겠습니다. 그리고 우리는 각기 당신에게 은 천백 개를 주겠습니다.」[a]
  to: 그때 블레셋의 방백들이 그녀에게 찾아와 말했습니다. 「그를 꾀어 그의 큰 힘이 어디에 있는지, 또 우리가 어떻게 그를 이겨 묶어 괴롭게 할 수 있는지 알아보십시오. 그러면 우리는 저마다 당신에게 은 천백 개를[a] 주겠습니다.」
  rationale: 접근 동사를 현대 한국어에 맞게 다듬고, 기만적으로 정보를 알아내라는 명령을 ‘꾀어’로 옮겼습니다. 또한 그를 이기고 묶어 괴롭게 하려는 연속된 목적을 한 문장 안에서 보존했으며, 액수의 불명시적 단위는 본문에서 과도하게 특정하지 않고 각주로 설명했습니다.
