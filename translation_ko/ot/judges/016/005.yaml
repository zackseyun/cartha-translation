  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'eleven hundred silver.' This likely refers to eleven hundred pieces or shekels of silver from each Philistine lord.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 블레셋의 방백들이 그녀에게 올라와 말했습니다. 「그를 유혹하여 그의 큰 힘이 어디에 있는지, 또 우리가 어떤 방법으로 그를 이길 수 있는지 보십시오. 그러면 우리가 그를 묶어 괴롭게 하겠습니다. 그리고 우리는 각기 당신에게 은 천백 개를 주겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘은 천백’입니다. 여기서는 블레셋의 각 방백이 은을 천백 개씩 주겠다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the lords of the Philistines
  chosen_korean: 블레셋의 방백들
  alternatives_korean:
  - 블레셋의 통치자들
  - 블레셋의 군주들
  lexicon: HALOT
  rationale: סרן은 블레셋 도시국가의 통치자를 가리키는 관용적 칭호라서, 한국어로는 전통적이면서도 위계가 드러나는 ‘방백들’이 가장 자연스럽습니다.
- source_word: פַּתִּי
  english_pob_choice: Entice
  chosen_korean: 유혹하여
  alternatives_korean:
  - 꾀어
  - 설득하여
  - 유인하여
  lexicon: HALOT
  rationale: 명령형 פַּתִּי는 삼손을 속여 비밀을 끌어내게 하라는 뜻이므로, 단순 설득보다 기만적 뉘앙스를 살리는 ‘유혹하여’가 적절합니다.
- source_word: בַּמֶּה כֹּחוֹ גָדֹל
  english_pob_choice: in what his great strength lies
  chosen_korean: 그의 큰 힘이 어디에 있는지
  alternatives_korean:
  - 그의 큰 힘의 근원이 무엇인지
  - 그의 큰 힘이 무엇으로 말미암는지
  lexicon: HALOT
  rationale: במה는 ‘무엇 안에/어디에’라는 탐문의 성격이 있어, 힘의 비밀이나 근거를 묻는 표현을 한국어 자연어로 옮겼습니다.
- source_word: וּבַמֶּה נוּכַל לוֹ
  english_pob_choice: by what means we may prevail against him
  chosen_korean: 우리가 어떤 방법으로 그를 이길 수 있는지
  alternatives_korean:
  - 우리가 어떤 방식으로 그를 제압할 수 있는지
  - 우리가 무엇으로 그를 이길 수 있는지
  lexicon: HALOT
  rationale: יכל ל의 문맥상 의미는 상대를 능가하거나 이기는 것이어서, ‘이기다’가 직관적이면서도 본문의 적대적 의도를 잘 전달합니다.
- source_word: לְעַנֹּתוֹ
  english_pob_choice: to afflict him
  chosen_korean: 괴롭게 하겠습니다
  alternatives_korean:
  - 고통을 주겠습니다
  - 학대하겠습니다
  - 괴롭히겠습니다
  lexicon: HALOT
  rationale: ענה의 핵심은 단순 억압을 넘어 실제로 고통을 주는 데 있으므로, 결과절에서는 한국어의 자연스러운 종결형으로 ‘괴롭게 하겠습니다’라고 옮겼습니다.
theological_decisions:
- issue: 블레셋 방백들의 집단 발언을 한국어에서 어떻게 처리할지
  chosen_reading: 대화 전체를 한 문장으로 매끄럽게 유지하되, 직접화법은 그대로 살려 삼손을 속이려는 집단적 의도를 분명히 드러냈습니다.
  alternative_readings:
  - 문장들을 둘로 나누어 더 설명적으로 옮김
  - 직접화법을 간접화법으로 바꿈
  rationale: 본문은 전략적 회유와 협박이 이어지는 장면이므로, 수사적 긴장감을 유지하는 것이 해석상 중요합니다.
  doctrine_reference: 서사 본문의 화행과 의도 보존
