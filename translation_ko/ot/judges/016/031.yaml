source:
  edition: WLC
  text: וַ/יֵּרְד֨וּ אֶחָ֜י/ו וְ/כָל בֵּ֣ית אָבִי/הוּ֮ וַ/יִּשְׂא֣וּ אֹת/וֹ֒ וַֽ/יַּעֲל֣וּ וַ/יִּקְבְּר֣וּ אוֹת֗/וֹ בֵּ֤ין צָרְעָה֙ וּ/בֵ֣ין אֶשְׁתָּאֹ֔ל בְּ/קֶ֖בֶר מָנ֣וֹחַ אָבִ֑י/ו וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל עֶשְׂרִ֥ים שָׁנָֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
  footnotes:
  - marker: a
    text: Or, 'Now he had judged Israel twenty years.' The Hebrew can be understood as a retrospective summary.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 형제들과 그의 아버지의 온 집안이 내려와 그의 시신을 가지고 올라가, 소라와 에스다올 사이, 그의 아버지 마노아의 무덤에 그를 장사하였습니다. 그리고 그는 이스라엘을 이십 년 동안 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 이미 이스라엘을 이십 년 동안 다스렸습니다.’ 히브리어는 회고적 요약으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  lexicon: HALOT
  rationale: 히브리어 אחים은 보통 혈연상 형제들을 뜻하므로, 문맥상 확장하지 않고 직접적으로 옮겼습니다.
- source_word: כָּל בֵּית אָבִיהוּ
  english_pob_choice: all his father’s household
  chosen_korean: 그의 아버지의 온 집안
  alternatives_korean:
  - 그의 아버지의 집
  - 그의 아버지의 모든 식구
  lexicon: HALOT
  rationale: ‘아버지의 집’이라는 관용구를 한국어에서 자연스럽게 풀어, 가족/가문 단위를 드러내는 ‘온 집안’으로 옮겼습니다.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  english_pob_choice: carried him away
  chosen_korean: 그의 시신을 가지고
  alternatives_korean:
  - 그를 옮기고
  - 그를 메고
  lexicon: HALOT
  rationale: 장례 맥락에서 נשא는 시신을 운구하는 뜻이므로, 한국어에서는 명시적으로 ‘시신’을 보완해 의미를 분명히 했습니다.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  english_pob_choice: between Zorah and Eshtaol
  chosen_korean: 소라와 에스다올 사이
  alternatives_korean:
  - 조라와 에스다올 사이
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 음역했고, ‘between’은 단순한 위치 관계로 그대로 살렸습니다.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  english_pob_choice: in the tomb of Manoah his father
  chosen_korean: 그의 아버지 마노아의 무덤에
  alternatives_korean:
  - 그의 아버지 마노아의 묘에
  - 마노아 그의 아버지의 무덤에
  lexicon: HALOT
  rationale: קבר는 여기서 가족 매장지를 가리키므로 ‘무덤’으로 옮겼고, 한국어 어순에 맞게 ‘그의 아버지 마노아의’로 정리했습니다.
- source_word: וְהוּא שָׁפַט אֶת יִשְׂרָאֵל
  english_pob_choice: And he judged Israel
  chosen_korean: 그리고 그는 이스라엘을 이십 년 동안 다스렸습니다
  alternatives_korean:
  - 그리고 그는 이스라엘을 이십 년 동안 심판했습니다
  - 그리고 그는 이스라엘을 이십 년 동안 재판했습니다
  lexicon: HALOT
  rationale: 사사기의 שפט는 단순 재판보다 사사/통치의 역할을 가리키므로, 한국어에서는 기능을 드러내는 ‘다스리다’를 선택했습니다.
theological_decisions:
- issue: שָׁפַט의 사사직 기능을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘심판하다’보다 ‘다스리다’로 옮겨, 장례 후의 결론적 요약과 사사로서의 공적 역할을 함께 보이게 했습니다.
  alternative_readings:
  - 심판했습니다
  - 판결했습니다
  rationale: 문맥상 법정행위가 아니라 사사로서 이스라엘을 이끈 총괄적 역할이므로, 독자가 직분적 의미를 오해하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, source-directed role rendering
- issue: 이 구절의 종결문이 회고적 요약인지 여부
  chosen_reading: 현재 서술형으로 유지해, 장례 서술 뒤에 붙는 결론적 요약의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - 그는 이스라엘을 이십 년 동안 다스렸습니다(회고적 의미로 읽음)
  - 그때까지 이스라엘을 이십 년 동안 다스렸습니다
  rationale: 히브리어는 회고적 뉘앙스를 가질 수 있지만, 이를 한국어에서 과도하게 해설하지 않고 본문 흐름을 따라 간결하게 유지했습니다.
  doctrine_reference: Translation philosophy §3, preserve tension rather than resolve it
