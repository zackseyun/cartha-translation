review_pass:
  verdict: revise
  source_fidelity: 초안은 블레셋 사람들이 삼손을 붙잡고 눈을 훼손하며 가자로 데려가 금속 구속구로 결박한 뒤 감옥에서 맷돌을 돌린다는 핵심을 대체로 담고 있습니다. 그러나 '끌어내어'는 가자로의 하향 이동(ויורידו)을 한국어에서 반대 방향으로 암시할 수 있고, '맷돌을 돌리게 하였더라'는 본문의 '그가 맷돌을 돌리고 있었다'라는 서술을 사역으로 바꿉니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 문장을 두 문장으로 나누고, '놋'은 현대적인 '청동'으로, 종결은 '-습니다'로 정리했습니다.
  terminology: נקר의 구체적 훼손 의미는 '눈을 뽑고'로, נחשׁתים의 금속 구속구는 '청동 족쇄'로 옮겼습니다. '감옥'은 자연스러운 본문 번역이며, 직역적 표현은 주석에서 보완했습니다.
  issues:
  - severity: medium
    issue: '''가자로 끌어내어''의 방향 표현'
    rationale: 히브리어 הוריד는 '아래로 데려가다'를 뜻합니다. 한국어 '끌어내다'는 흔히 밖으로 데리고 나오는 방향을 암시하므로 '끌어내려'로 고쳐 하향 의미를 보존하는 편이 안전합니다.
  - severity: medium
    issue: '''맷돌을 돌리게 하였더라''의 사역화'
    rationale: ויהי טוחן은 삼손이 맷돌질을 하고 있는 상태를 서술합니다. 본문에 없는 사역 구문을 피하여 '돌리고 있었습니다'로 옮깁니다.
  - severity: low
    issue: '''놋 사슬''의 현대성 및 구속구 의미'
    rationale: נחשׁתים은 청동으로 된 족쇄·차꼬 같은 구속구를 가리킵니다. '청동 족쇄'가 현대어로 더 자연스럽고 구체적입니다.
