translation:
  language: ko
  text: 블레셋의 고관들[a]이 그들의 신 다곤에게 큰 제사를 드리고 기뻐하기 위해 모였으며, 이렇게 말했습니다. “우리의 신이 우리의 원수 삼손을 우리 손에[b] 넘겨주셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
