    text: 또는 “블레셋의 영주들.”
    reason: סַרְנֵי는 블레셋 도시 국가들의 지도층 관리를 가리키며, '영주들'도 가능한 번역이다.
  - marker: b
    text: 히브리어 “우리 손에.” 누군가를 자신의 권세나 지배 아래 넘긴다는 뜻의 관용 표현이다.
