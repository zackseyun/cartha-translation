revisions:
- from: 그가 말하기를 블레셋 사람들이 너를 치노라 삼손아 하매 그가 잠에서 깨어 말하기를 내가 전과 같이 나가서 스스로를 떨치리라 하였으나 여호와께서 그에게서 떠나신 줄을 알지 못하더라
  to: 그 여자가 “삼손, 블레셋 사람들이 당신에게 들이닥쳤습니다!” 하고 말하자, 그는 잠에서 깨어 “전처럼 나가서 몸을 떨쳐 벗어나겠다[a]” 하고 말하였습니다. 그러나 야훼께서 그에게서 떠나신 것을 그는 알지 못하였습니다.
  rationale: 여성 화자를 바로잡고, 직접화법을 현대 표준어 합쇼체로 다듬었습니다. ‘전처럼 나가서’는 원문의 행동과 반복성 표현을 유지합니다. ‘몸을 떨쳐 벗어나겠다’는 문맥상 자연스럽지만 원문의 표현 폭을 보존하도록 각주에 더 직역적인 대안을 제시했습니다. 야훼의 떠나심은 그 성격이나 결과를 해설하지 않고 원문대로 옮겼습니다.
