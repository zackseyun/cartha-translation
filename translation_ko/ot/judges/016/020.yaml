review_pass:
  verdict: revise
  source_fidelity: 원문의 화자는 여성 단수(‘그 여자가 말하였다’)인데 초안은 ‘그가 말하기를’로 옮겨 화자와 성별이 바뀌었습니다. 또한 יְהוָה는 제공된 번역 원칙에 따라 ‘야훼’로 옮기는 것이 맞습니다. ‘나가서’와 반복적 과거 상황을 가리키는 ‘전처럼’은 보존하되, וְאִנָּעֵר의 ‘스스로 떨치다/벗어나다’라는 뉘앙스는 각주로 보완하였습니다.
  naturalness: 초안의 반복된 ‘말하기를 … 하매/하였으나’와 인용부호 없는 직접화법은 현대 표준 한국어 합쇼체 서술로 다소 부자연스럽습니다. 직접화법과 ‘그 여자가 … 말하자’를 사용하면 자연스럽고 명료합니다.
  terminology: ‘블레셋 사람들’, ‘삼손’, ‘야훼’는 적절합니다. ‘야훼께서 그에게서 떠나신 것’은 סָר מֵעָלָיו를 지나치게 신학적으로 해설하지 않고 충실히 재현합니다.
  issues:
