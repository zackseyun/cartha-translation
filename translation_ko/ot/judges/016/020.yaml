  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: ko
  text: 그 여자가 “삼손, 블레셋 사람들이 당신에게 들이닥쳤습니다!” 하고 말하자, 그는 잠에서 깨어 “전처럼 나가서 몸을 떨쳐 벗어나겠다[a]” 하고 말하였습니다. 그러나 야훼께서 그에게서 떠나신 것을 그는 알지 못하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “몸을 떨겠다.” 히브리어 표현은 문맥상 이전처럼 자신을 떨쳐 자유롭게 하겠다는 뜻일 수 있습니다.
    reason: וְאִנָּעֵר의 기본적 ‘자신을 떨다’라는 표현과 문맥상 ‘떨쳐 벗어나다’라는 의미 가능성을 함께 보존합니다.
