base_translation:
  language: en
  yaml_path: translation/ot/judges/016/022.yaml
  text: But the hair of his head began to grow again after it had been shaved[a][b].
  footnotes:
  - marker: a
    text: Or, 'began to grow'—the Hebrew verb itself does not explicitly include 'again'; the sense is supplied by the context of the prior shaving.
    reason: lexical_alternative
  - marker: b
    text: Or, 'when it had been shaved' or 'after he had been shaved.' The Hebrew permits slightly different ways of expressing the temporal clause and its implied referent.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그의 머리털이, 깎인 뒤에 다시 자라기 시작했습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 자라기 시작했습니다’. 히브리어 동사 자체는 ‘다시’를 직접 말하지 않으며, 그 의미는 앞선 삭발 문맥에서 보충됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깎인 뒤에’/‘깎였을 때’. 히브리어는 시간절의 관계를 약간 다르게 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  english_pob_choice: began
  chosen_korean: 자라기 시작했습니다
  alternatives_korean:
  - 시작했습니다
  - 자라기 시작하였습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘시작하다’의 의미를 가지므로, 한국어에서는 뒤의 ‘자라다’와 자연스럽게 결합해 ‘자라기 시작하다’로 옮겼습니다.
- source_word: שְׂעַר רֹאשׁוֹ
  english_pob_choice: the hair of his head
  chosen_korean: 그의 머리털이
  alternatives_korean:
  - 그의 머리의 털이
  - 머리의 머리털이
  lexicon: HALOT
  rationale: 직역 구조를 살리면서도 한국어에서 자연스러운 표현인 ‘머리털’로 옮겼습니다. ‘머리의 털’보다 의미가 분명하고 문장 흐름이 좋습니다.
- source_word: לְצַמֵּחַ
  english_pob_choice: to grow again
  chosen_korean: 다시 자라기
  alternatives_korean:
  - 자라기
  - 다시 자라나기
  lexicon: HALOT
  rationale: 영어 POB의 설명처럼 동사 자체에 ‘다시’가 명시되지는 않지만, 앞선 삭발 문맥이 그 의미를 요구하므로 한국어 본문에는 ‘다시’보다 자연스러운 위치에 두어 표현했습니다.
- source_word: כַּאֲשֶׁר גֻּלָּח
  english_pob_choice: after it had been shaved
  chosen_korean: 깎인 뒤에
  alternatives_korean:
  - 깎인 후에
  - 그가 깎인 뒤에
  - 깎였을 때
  lexicon: HALOT
  rationale: 시간 관계를 분명히 드러내는 ‘뒤에’로 옮겼습니다. 수동형의 주어를 너무 길게 반복하지 않으면서, 앞 문맥상 머리털이 제거된 상황을 자연스럽게 반영합니다.
theological_decisions:
- issue: ‘again’의 명시 여부
  chosen_reading: ‘다시’는 동사 본문에 직접 대응하지 않지만, 문맥상 회복된 성장의 의미를 드러내기 위해 본문에 포함했습니다.
  alternative_readings:
  - ‘자라기 시작했습니다’
  - ‘자라기 시작하였습니다’
  rationale: 히브리어는 ‘다시’라는 부사를 직접 말하지 않지만, 앞선 삭발 사건을 전제하므로 독자가 의미를 오해하지 않도록 문맥상 보충이 필요합니다.
  doctrine_reference: 본문 의미의 명시와 문맥 보충 원칙
- issue: 수동절의 참조 대상
  chosen_reading: ‘깎인 뒤에’로 옮겨 머리털의 상태 변화를 강조했습니다.
  alternative_readings:
  - ‘그가 깎인 뒤에’
  - ‘깎였을 때’
  rationale: 히브리어는 머리털을 직접 이어 받는 구조이므로, 한국어에서도 대상이 머리털임을 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 문법-의미 일치 원칙
