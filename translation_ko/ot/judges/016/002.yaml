  to: 가자 사람들에게 “삼손이 여기 왔습니다” 하고 전해졌습니다. 그러자 그들은 그를 에워싸고 밤새도록 성문에서 그를 매복하여 기다렸습니다. 그들은 밤새도록 잠잠히 있으면서 “아침 빛이 비칠 때에 그를 죽이자” 하고 말하였습니다.
