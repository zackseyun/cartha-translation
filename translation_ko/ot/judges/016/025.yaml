  edition: WLC
  text: וַֽ/יְהִי֙ כי טוב לִבָּ֔/ם וַ/יֹּ֣אמְר֔וּ קִרְא֥וּ לְ/שִׁמְשׁ֖וֹן וִ/ישַֽׂחֶק לָ֑/נוּ וַ/יִּקְרְא֨וּ לְ/שִׁמְשׁ֜וֹן מִ/בֵּ֣ית ה/אסירים וַ/יְצַחֵק֙ לִ/פְנֵי/הֶ֔ם וַ/יַּעֲמִ֥ידוּ אוֹת֖/וֹ בֵּ֥ין הָ/עַמּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
  footnotes:
  - marker: a
    text: Or 'so that he may perform for us' or 'so that he may make sport for us.' The Hebrew verb can denote amusement, mockery, or public performance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the house of the prisoners,' that is, from the prison house.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 마음이 흥겨워졌을 때[a] 그들이 말했습니다. 「삼손을 불러서 그가 우리를 즐겁게 하게 하시오.」 그래서 그들이 삼손을 죄수의 집에서 불러냈고, 그는 그들 앞에서 그들을 즐겁게 했습니다[b]. 그들은 그를 기둥들 사이에 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 공연하게 하라’ 혹은 ‘우리에게 놀림거리가 되게 하라’. 히브리어 동사는 오락, 조롱, 공개 공연을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘죄수들의 집에서’라는 뜻으로, 곧 감옥에서라는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  english_pob_choice: when their hearts were merry
  chosen_korean: 그들의 마음이 흥겨워졌을 때
  alternatives_korean:
  - 그들의 마음이 즐거웠을 때
  - 그들이 기분이 좋았을 때
  - 그들의 마음이 들떴을 때
  lexicon: HALOT
  rationale: 히브리어의 관용구인 ‘마음이 좋다’를 한국어의 자연스러운 상태 표현으로 옮기되, 단순한 기분 좋음보다 연회의 들뜬 분위기를 살렸습니다.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  english_pob_choice: Call for Samson
  chosen_korean: 삼손을 불러서
  alternatives_korean:
  - 삼손을 부르시오
  - 삼손을 소환하시오
  - 삼손을 불러오시오
  lexicon: HALOT
  rationale: ל + 인물의 용례를 따라 단순 호출보다 ‘불러서/불러오다’의 시중드는 뉘앙스를 살렸습니다.
- source_word: וִישַׂחֶק לָנוּ / וַיְצַחֵק לִפְנֵיהֶם
  english_pob_choice: so that he may entertain us / and he entertained them
  chosen_korean: 우리를 즐겁게 하게 하시오 / 그들을 즐겁게 했습니다
  alternatives_korean:
  - 우리를 웃기게 하게 하시오 / 그들을 웃기게 했습니다
  - 우리를 위해 공연하게 하시오 / 그들 앞에서 공연했습니다
  - 우리를 놀리게 하게 하시오 / 그들 앞에서 놀림거리가 되었습니다
  lexicon: HALOT
  rationale: שׂחק/צחק의 폭넓은 의미를 반영해 단순한 ‘웃김’보다 문맥상 공연·조롱이 섞인 공개적 오락의 성격을 ‘즐겁게 하다’로 옮겼습니다.
- source_word: מִבֵּית הָאֲסִירִים
  english_pob_choice: from the prison house
  chosen_korean: 죄수의 집에서
  alternatives_korean:
  - 감옥에서
  - 수감자의 집에서
  - 죄수들의 집에서
  lexicon: HALOT
  rationale: 직역에 가까운 ‘집’ 이미지를 살리되, 한국어에서 이해가 자연스럽도록 ‘죄수의 집’으로 옮겨 prison house의 구체성을 보존했습니다.
- source_word: וַיַּעֲמִידוּ אוֹתוֹ בֵּין הָעַמּוּדִים
  english_pob_choice: And they made him stand between the pillars
  chosen_korean: 그들은 그를 기둥들 사이에 세웠습니다
  alternatives_korean:
  - 그들은 그를 기둥들 사이에 두었습니다
  - 그들은 그를 기둥들 사이에 세워 두었습니다
  - 그들은 그를 기둥들 사이에 서게 했습니다
  lexicon: HALOT
  rationale: 히필의 강제적 사역을 보존하기 위해 ‘세웠습니다’로 옮겨, 삼손을 조종하는 전시적·굴욕적 장면을 드러냈습니다.
theological_decisions:
- issue: ‘즐겁게 하다/놀리다’의 의미 범위
  chosen_reading: 본문의 요청과 실행 모두를 공개 오락이자 조롱의 가능성을 가진 행위로 이해하고, 본문에서는 중립적으로 ‘즐겁게 하다’로 번역했습니다.
  alternative_readings:
  - ‘놀리다’로 강하게 번역
  - ‘공연하다’로 번역
  rationale: 히브리어 שׂחק/צחק은 문맥에 따라 오락, 희롱, 조롱을 모두 가질 수 있으므로, 본문 자체의 폭을 유지하면서도 문맥상 굴욕성을 독자가 읽어낼 수 있게 했습니다.
  doctrine_reference: 본문 해석의 범위와 문맥적 뉘앙스에 관한 번역 원칙
