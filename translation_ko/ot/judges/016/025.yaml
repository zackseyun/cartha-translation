theological_decisions:
- issue: ‘즐겁게 하다/놀리다’의 의미 범위
  chosen_reading: 본문의 요청과 실행 모두를 공개 오락이자 조롱의 가능성을 가진 행위로 이해하고, 본문에서는 중립적으로 ‘즐겁게 하다’로 번역했습니다.
  alternative_readings:
  - ‘놀리다’로 강하게 번역
  - ‘공연하다’로 번역
  rationale: 히브리어 שׂחק/צחק은 문맥에 따라 오락, 희롱, 조롱을 모두 가질 수 있으므로, 본문 자체의 폭을 유지하면서도 문맥상 굴욕성을 독자가 읽어낼 수 있게 했습니다.
  doctrine_reference: 본문 해석의 범위와 문맥적 뉘앙스에 관한 번역 원칙
