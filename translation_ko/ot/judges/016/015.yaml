source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אֵ֚יךְ תֹּאמַ֣ר אֲהַבְתִּ֔י/ךְ וְ/לִבְּ/ךָ֖ אֵ֣ין אִתִּ֑/י זֶ֣ה שָׁלֹ֤שׁ פְּעָמִים֙ הֵתַ֣לְתָּ בִּ֔/י וְ/לֹא הִגַּ֣דְתָּ לִּ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֥ גָדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
  footnotes:
  - marker: a
    text: Or 'you have toyed with me,' 'you have deceived me,' or 'you have made a fool of me.' The Hebrew verb carries the sense of trifling with someone through deceptive mockery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그녀가 그에게 말했습니다. “어떻게 저를 사랑한다고 말할 수 있습니까? 당신의 마음은 나와 함께 있지 않습니다. 이번까지 세 번이나 당신은 저를 우롱했고[a], 당신의 큰 힘이 무엇인지 제게 알려 주지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 ‘조롱하다’보다, 속임수로 상대를 희롱하거나 우롱하는 뜻을 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How can
  chosen_korean: 어떻게 ... 할 수 있습니까
  alternatives_korean:
  - 어찌 ... 할 수 있습니까
  - 어떻게 ... 말할 수 있습니까
  lexicon: HALOT
  rationale: 놀람과 따짐이 섞인 수사 의문문이므로, 자연스러운 합쇼체로는 ‘어떻게 ... 할 수 있습니까’가 가장 직접적으로 압박감을 살립니다.
- source_word: אֲהַבְתִּיךְ
  english_pob_choice: I love you
  chosen_korean: 사랑한다고
  alternatives_korean:
  - 사랑했습니다
  - 사랑해 왔다고
  lexicon: HALOT
  rationale: 히브리어 완료형은 여기서 현재적 진술처럼 들리므로, 한국어도 직접화법 안에서 현재 의미를 유지하는 간접 인용으로 옮겼습니다.
- source_word: לִבְּךָ אֵין אִתִּי
  english_pob_choice: your heart is not with me
  chosen_korean: 당신의 마음은 나와 함께 있지 않습니다
  alternatives_korean:
  - 당신의 마음은 내게 있지 않습니다
  - 당신의 마음은 제 곁에 있지 않습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 충성/내적 헌신의 의미를 살리되, 소유화하지 않고 ‘함께 있다’는 표현으로 자연스럽게 옮겼습니다.
- source_word: הֵתַלְתָּ בִּי
  english_pob_choice: you have mocked me
  chosen_korean: 당신은 저를 속였고
  alternatives_korean:
  - 당신은 저를 조롱했고
  - 당신은 저를 가지고 놀았고
  lexicon: HALOT
  rationale: 이 동사는 단순 조롱보다 속임이 섞인 희롱을 뜻하므로, 한국어는 ‘속였고’로 번역해 반복된 기만의 성격을 드러냈습니다.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  english_pob_choice: in what your great strength lies
  chosen_korean: 당신의 큰 힘이 무엇인지
  alternatives_korean:
  - 당신의 큰 힘이 어디에 있는지
  - 당신의 큰 힘의 비밀이 무엇인지
  lexicon: HALOT
  rationale: 힘의 ‘근원/내용’을 묻는 질문이므로, 위치보다 실체를 묻는 한국어 구조로 옮기되 과도한 해석인 ‘비밀’은 피했습니다.
theological_decisions:
- issue: 히브리어 반복 강조를 한국어에서 어떻게 살릴지
  chosen_reading: “이번이 세 번째입니다”로 반복성을 분명히 드러냈습니다.
  alternative_readings:
  - “세 번이나”
  - “이것이 세 번째입니다”
  rationale: 단순한 수량 정보가 아니라 반복된 배신감의 누적을 강조하는 문맥이므로, 문장 안에서 자연스럽게 누적감을 주는 표현을 택했습니다.
  doctrine_reference: 서사 맥락의 정서·수사 보존
