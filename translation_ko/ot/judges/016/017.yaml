revisions:
- from: 그러자 그는 자기의 마음을 다 털어놓고 그 여자에게 말했습니다. 「내 머리에는 아직 한 번도 면도칼이 올라온 적이 없습니다. 나는 어머니의 태에서부터 하나님께 바쳐진 나실인입니다. 내가 깎이면 내 힘이 내게서 떠나고, 나는 약해져서 다른 모든 사람과 같아질 것입니다.」[a][b][c]
  to: 그러자 그는 자기 속마음을 모두 털어놓고[a] 그녀에게 말했습니다. 「내 머리에는 한 번도 면도칼이 댄 적이 없습니다. 나는 어머니의 태에서부터 하나님께 바쳐진 나실인입니다[b]. 내 머리카락이 깎이면 내 힘이 내게서 떠나고, 나는 약해져서 다른 모든 사람과 같아질 것입니다[c].」
  rationale: The revision replaces an unnatural calque of the Hebrew razor idiom with idiomatic Korean while preserving its meaning. It also improves the opening idiom’s fluency, makes the passive shaving condition explicit as applying to Samson’s hair, and relocates all footnote markers to the exact phrases they explain. No theological interpretation has been added.
