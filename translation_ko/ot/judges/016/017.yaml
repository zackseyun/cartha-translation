base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
  footnotes:
  - marker: a
    text: Or, “he told her all that was in his heart.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “a Nazirite of God,” a technical term for one specially dedicated to God.
    reason: cultural_note
  - marker: c
    text: Or, “like any other man.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 자기 속마음을 모두 털어놓고[a] 그녀에게 말했습니다. 「내 머리에는 한 번도 면도칼이 댄 적이 없습니다. 나는 어머니의 태에서부터 하나님께 바쳐진 나실인입니다[b]. 내 머리카락이 깎이면 내 힘이 내게서 떠나고, 나는 약해져서 다른 모든 사람과 같아질 것입니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 자기 마음속에 있는 것을 모두 그녀에게 말했다.”
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘나실인’은 하나님께 특별히 구별된 사람을 가리키는 기술용어입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “어떤 다른 사람처럼.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֶּד ... אֶת כָּל לִבּוֹ
  english_pob_choice: he told her his whole heart
  chosen_korean: 자기의 마음을 다 털어놓고
  alternatives_korean:
  - 자기의 마음을 모두 말하고
  - 속마음을 전부 털어놓고
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘마음’ 이미지를 살리면서, 한국어에서 자연스럽고 본문의 ‘전적 고백’ 뉘앙스를 드러내기 위해 ‘마음을 다 털어놓고’로 옮겼습니다.
- source_word: מוֹרָה
  english_pob_choice: razor
  chosen_korean: 면도칼
  alternatives_korean:
  - 칼날
  - 면도기
  lexicon: HALOT
  rationale: 여기서는 나실인 머리에 닿아서는 안 되는 도구를 가리키므로, 현대 한국어에서 가장 직관적인 ‘면도칼’이 적절합니다.
- source_word: נְזִיר אֱלֹהִים
  english_pob_choice: Nazirite of God
  chosen_korean: 하나님께 바쳐진 나실인
  alternatives_korean:
  - 하나님의 나실인
  - 하나님께 속한 나실인
  lexicon: HALOT
  rationale: ‘나실인’은 기술용어이므로 유지하고, 문맥상 헌신/구별의 뜻을 드러내기 위해 ‘하나님께 바쳐진’으로 풀어 옮겼습니다.
- source_word: כְּכָל הָאָדָם
  english_pob_choice: like every other man
  chosen_korean: 다른 모든 사람과 같아질 것입니다
  alternatives_korean:
  - 다른 모든 남자와 같아질 것입니다
  - 어떤 다른 사람과도 같아질 것입니다
  lexicon: HALOT
  rationale: 삼손의 비범한 힘이 사라져 보통 사람의 상태가 된다는 대비를 자연스럽게 드러내기 위해 ‘다른 모든 사람’으로 옮겼습니다.
theological_decisions:
- issue: נְזִיר אֱלֹהִים의 번역 방식
  chosen_reading: 하나님께 바쳐진 나실인
  alternative_readings:
