review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse’s principal sense accurately: Samson discloses all that is in his heart, states that no razor has touched his head, identifies himself as a Nazirite of God from his mother’s womb, and describes the consequence of being shaved. However, ‘면도칼이 올라온’ is an overly literal and unnatural rendering of the Hebrew idiom ‘has come upon my head.’ The footnote markers are also all placed at the end rather than anchored to their respective words or clauses.'
  naturalness: ‘자기의 마음을 다 털어놓고’ is understandable but less natural than ‘속마음을 모두 털어놓고.’ ‘내 머리에 면도칼이 대지 않았습니다’ is clear, idiomatic modern Korean and accurately communicates the contextual force of the Hebrew expression. ‘다른 모든 사람과 같아질 것입니다’ is retained as a natural rendering of the contrast with ordinary men.
  terminology: ‘나실인’ appropriately preserves the technical term נְזִיר. ‘하나님께 바쳐진 나실인’ is a defensible Korean explicitation of the genitive ‘of God’ without losing the technical designation. The explanatory footnote correctly identifies it as a technical term.
  issues:
  - severity: medium
    issue: 'Unnatural literal idiom: ‘내 머리에는 아직 한 번도 면도칼이 올라온 적이 없습니다.’'
    rationale: Korean does not naturally say that a razor ‘comes up onto’ a head. The Hebrew idiom should be rendered by its contextual meaning, namely that a razor has never touched or been used on his head. ‘아직’ is also unnecessary, since ‘한 번도 … 적이 없습니다’ already expresses ‘never.’
  - severity: medium
    issue: Footnote anchors are placed collectively after the quotation rather than at their relevant textual locations.
    rationale: Marker a concerns the disclosure idiom, b concerns ‘나실인,’ and c concerns the final comparison. Placing each marker at its referent improves usability and ensures correct anchoring.
  revised_text: 그러자 그는 자기 속마음을 모두 털어놓고[a] 그녀에게 말했습니다. 「내 머리에는 한 번도 면도칼이 댄 적이 없습니다. 나는 어머니의 태에서부터 하나님께 바쳐진 나실인입니다[b]. 내 머리카락이 깎이면 내 힘이 내게서 떠나고, 나는 약해져서 다른 모든 사람과 같아질 것입니다[c].」
