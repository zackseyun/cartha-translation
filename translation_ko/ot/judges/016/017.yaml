  rationale: ‘나실인’은 제도적·서사적 전문 용어이므로 보존해야 하고, 동시에 본문은 출생부터의 구별된 헌신을 강조하므로 그 의미를 한국어로 분명히 풀어 주는 것이 적절합니다.
