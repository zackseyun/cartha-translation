  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
  footnotes:
  - marker: a
    text: Or, more literally, “Let my soul die with the Philistines.” Here “my soul” is an idiomatic way of referring to Samson himself.
    reason: lexical_alternative
  - marker: b
    text: Or “the lords” of the Philistines.
    reason: lexical_alternative
  - marker: c
    text: Or “the building”; the Hebrew is the ordinary word for “house.”
    reason: lexical_alternative
translation:
  language: ko
  text: 삼손이 말했습니다. 「블레셋 사람들과 함께 죽게 하십시오。」 그러고는 온 힘을 다해 몸을 기울였고, 집이 통치자들과 그 안에 있던 모든 백성 위로 무너졌습니다. 그래서 그가 죽으면서 죽인 자들이 그의 생전에 죽인 자들보다 더 많았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 「내 영혼이 블레셋 사람들과 함께 죽게 하십시오」입니다. 여기서 ‘영혼’은 삼손 자신을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「주인들」로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「건물」입니다. 히브리어는 평범한 ‘집’이라는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי עִם פְּלִשְׁתִּים
  english_pob_choice: Let me die with the Philistines
  chosen_korean: 「블레셋 사람들과 함께 죽게 하십시오」
  alternatives_korean:
  - 「블레셋 사람들과 함께 죽게 해주십시오」
  - 「블레셋 사람들과 함께 제가 죽게 하십시오」
  lexicon: HALOT
  rationale: נפשׁ를 문자적으로 ‘영혼’으로 옮기기보다, 인물 자신을 가리키는 관용적 표현으로 이해하여 자연스럽게 ‘죽게 하십시오’로 옮겼습니다. 청유·소망의 뉘앙스를 살리면서도 한국어에서 과도한 신학적 분화를 만들지 않도록 했습니다.
- source_word: וַיֵּט בְּכֹחַ
  english_pob_choice: he bent with all his strength
  chosen_korean: 온 힘을 다해 몸을 기울였고
  alternatives_korean:
  - 힘껏 몸을 기울였고
  - 온 힘으로 몸을 굽혔고
  lexicon: HALOT
  rationale: נטה의 기본 뜻인 ‘기울이다/굽히다’를 살리되, 기둥을 밀어 무너뜨리는 문맥에서 한국어로 가장 자연스러운 동작 묘사를 택했습니다. בְכֹחַ는 ‘온 힘을 다해’로 옮겨 강도를 분명히 했습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 건물
  - 집 안
  lexicon: HALOT
  rationale: 히브리어의 보통 명사 ‘집’을 그대로 반영했습니다. 문맥상 집회 장소의 건물이지만, 해석어인 ‘건물’보다 원어의 평이한 어감을 유지하는 것이 더 적절합니다.
- source_word: הַסְּרָנִים
  english_pob_choice: the rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 주인들
  - 관리들
  - 영주들
  lexicon: HALOT
  rationale: 블레셋 지도층을 가리키는 말로서 신분과 권력을 드러내는 현대적 표현을 택했습니다. 전통적인 ‘방백들’보다 의미가 분명하고, 영어 POB의 ‘rulers’와도 맞습니다.
theological_decisions:
- issue: נפשׁ의 번역이 인간 내부의 ‘영혼’ 교리를 암시할 가능성
  chosen_reading: 인물 자신을 가리키는 관용 표현으로 보고 ‘죽게 하십시오’로 번역했습니다.
  alternative_readings:
  - ‘내 영혼이 블레셋 사람들과 함께 죽게 하십시오’
  - ‘제가 블레셋 사람들과 함께 죽게 하십시오’
  rationale: 본문은 삼손의 자기희생적 결의를 드러내는 서술이며, 여기서 נפשׁ는 분리된 영혼 개념을 가르치기보다 ‘나 자신’을 가리키는 관용적 표현입니다. 따라서 독자에게 불필요한 인류학적 오해를 주지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
