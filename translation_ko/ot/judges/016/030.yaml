revisions:
- from: 삼손이 말했습니다. 「블레셋 사람들과 함께 죽게 하십시오。」 그러고는 온 힘을 다해 몸을 기울였고, 집이 통치자들과 그 안에 있던 모든 백성 위로 무너졌습니다. 그래서 그가 죽으면서 죽인 자들이 그의 생전에 죽인 자들보다 더 많았습니다.[a][b][c]
  to: 삼손이 말했습니다[a]. 「블레셋 사람들과 함께 죽게 하십시오.」 그러고는 온 힘을 다해 몸을 기울였고, 그 집[c]이 통치자들[b]과 그 안에 있던 모든 백성 위로 무너졌습니다. 그래서 그가 죽을 때 죽인 사람들은 그가 살아 있는 동안 죽인 사람들보다 더 많았습니다.
  rationale: 의미는 유지하면서 각주 표지를 해당 설명 대상에 직접 연결했습니다. 마지막 비교절은 히브리어의 ‘그가 죽을 때’와 ‘그가 살아 있는 동안’의 대조를 한국어에서 명확히 보이도록 다듬었습니다. ‘군주들’은 ‘주인들’보다 블레셋 지도자들의 직위를 정확하고 자연스럽게 전달합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:05Z'
review_pass:
  verdict: revise
  source_fidelity: 본문 번역은 전반적으로 히브리어의 의미를 충실히 반영합니다. 다만 각주 표지가 해당 어휘가 아니라 문장 끝에 한꺼번에 놓여 있어, 각주가 무엇을 설명하는지 불분명합니다. 표지를 ‘말했습니다’, ‘집’, ‘통치자들’에 각각 붙여야 합니다.
  naturalness: ‘블레셋 사람들과 함께 죽게 하십시오’는 히브리어의 소망·결의의 표현을 보존하는 현대 한국어 합쇼체로 사용 가능합니다. ‘그가 죽으면서 죽인 자들’도 자연스럽지만, ‘그가 죽을 때 죽인 사람들’이 비교 구조를 더 명료하고 매끄럽게 드러냅니다.
  terminology: ‘블레셋 사람들’, ‘통치자들’, ‘집’은 적절합니다. סְרָנִים의 대안으로 ‘주인들’은 현대 한국어에서 소유자를 뜻하기 쉬우므로, 역사적 지도자를 가리키는 ‘군주들’이 더 적절합니다. נפשׁ 관련 각주는 본문이 영혼의 분리된 실체를 주장하는 것으로 오해되지 않게 설명해야 합니다.
