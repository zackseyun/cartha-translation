  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: ko
  text: 삼손이 자기 손을 붙들고 있던 소년[a]에게 말했습니다. “저를 쉬게 해 주시고, 집이 서 있는 기둥들까지 저를 이끌어 주십시오. 그러면 제가 그 기둥들에 기대겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “젊은이”. 히브리어 נַעַר는 연령보다 지위와 역할을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 소년
  alternatives_korean:
  - 젊은이
  - 청년
  - 하인
  lexicon: נַעַר
  rationale: 문맥상 삼손을 인도하는 수행원에 가까운 의미이며, 한국어로는 나이보다 지위와 상황을 살리는 ‘소년’이 가장 자연스럽고 간결합니다.
- source_word: הַמַּחֲזִיק בְּיָדוֹ
  english_pob_choice: who was holding his hand
  chosen_korean: 자기 손을 붙들고 있던
  alternatives_korean:
  - 그의 손을 잡고 있던
  - 손을 이끌고 있던
  lexicon: חָזַק + יָד
  rationale: 히브리어는 단순한 동행보다 실제로 손을 붙들어 인도하는 장면을 나타내므로, 동작을 직접적으로 드러냈습니다.
- source_word: הַנִּיחָה אוֹתִי ו/הימשני
  english_pob_choice: Let me rest, and guide me to
  chosen_korean: 잠시 쉬게 해 주고, 내가 … 닿을 수 있게 이끌어 다오
  alternatives_korean:
  - 그만 좀 쉬게 하고, 나를 …로 데려다다오
  - 잠깐 쉬게 하고, 나를 …로 인도해 다오
  lexicon: נוח / משׁך
  rationale: 본문의 동사들은 ‘쉬다’와 ‘끌어/이끌다’의 물리적 움직임을 함께 담으므로, 요청의 두 요소를 모두 살려 번역했습니다.
- source_word: הָעַמֻּדִים
  english_pob_choice: the pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 주춧기둥들
  - 기둥
  - 버팀기둥들
  lexicon: עַמּוּד
  rationale: 건물을 지탱하는 구조물이라는 뜻을 직접 살려, 문맥에 맞는 복수형 ‘기둥들’로 옮겼습니다.
theological_decisions:
- issue: 삼손의 마지막 요청 표현
  chosen_reading: ‘잠시 쉬게 해 주고’와 ‘기둥들에 기대겠습니다’로, 쇠약한 상태에서 마지막 힘을 모으려는 실제 행동을 살렸습니다.
  alternative_readings:
  - ‘내가 쉬게 하고’로 더 축약
  - ‘기둥들에 몸을 기대겠습니다’로 완화
  rationale: 본문은 단순 휴식 요청이 아니라 기둥에 몸을 의지해 실제로 버티려는 장면이므로, 행동성을 약화시키지 않았습니다.
  doctrine_reference: 내러티브의 행위 묘사 보존
