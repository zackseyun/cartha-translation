  - severity: medium
    issue: ‘집이 기대고 서 있는 기둥들’이 부자연스럽고 원문의 구조를 흐립니다.
    rationale: 원문은 집이 기둥들 위에 굳게/서 있게 되어 있음을 말합니다. ‘집이 서 있는 기둥들’이 간결하고 정확합니다.
