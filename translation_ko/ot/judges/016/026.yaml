- from: 삼손이 자기 손을 붙들고 있던 소년에게 말했습니다. “잠시 쉬게 해 주고, 내가 집이 기대고 서 있는 기둥들에 닿을 수 있게 이끌어 다오. 그러면 내가 그 기둥들에 기대겠습니다.”[a]
  to: 삼손이 자기 손을 붙들고 있던 소년[a]에게 말했습니다. “저를 쉬게 해 주시고, 집이 서 있는 기둥들까지 저를 이끌어 주십시오. 그러면 제가 그 기둥들에 기대겠습니다.”
  rationale: 원문 및 영어 POB의 ‘Let me rest, and guide me to the pillars on which the house stands’를 따라 휴식과 인도라는 두 요청을 보존했습니다. 원문에 없는 시간 한정을 제거하고, 집과 기둥의 관계를 자연스러운 한국어로 바로잡았으며, 합쇼체 문체와 각주 표지의 연결을 정비했습니다.
