  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
  footnotes:
  - marker: a
    text: Or 'tore them out with the bar.' The Hebrew verb can denote pulling out or uprooting from place.
    reason: lexical_alternative
  - marker: b
    text: Or 'the hill that faces Hebron.' The Hebrew idiom literally says 'upon the face of Hebron.'
    reason: lexical_alternative
translation:
  language: ko
  text: 삼손은 한밤중까지 누워 있었습니다[a]. 그러다가 한밤중에 일어나 성문 문짝들과 두 문설주를 붙잡고, 빗장과 함께 그것들을 뽑아 올렸습니다[b]. 그는 그것들을 자기 어깨에 메고 헤브론 맞은편에 있는 산의 꼭대기까지 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한밤중까지 누워 있었습니다.’ 히브리어 동사는 단순히 눕는 동작을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들을 빗장과 함께 뽑아 내었습니다.’ 히브리어는 제자리를 벗겨 내는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay
  chosen_korean: 누워 있었습니다
  alternatives_korean:
  - 누워 있었습니다
  - 잠들어 있었습니다
  - 누웠습니다
  lexicon: HALOT
  rationale: וַיִּשְׁכַּב은 단순히 ‘눕다’의 의미를 담을 수 있으므로, 잠들었는지까지 단정하지 않도록 ‘누워 있었습니다’로 옮겼습니다.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  english_pob_choice: the doors of the city gate
  chosen_korean: 성문 문짝들
  alternatives_korean:
  - 성문 문짝들
  - 성문의 문들
  - 성문짝들
  lexicon: HALOT
  rationale: 도시 성문의 짝지은 문짝을 가리키므로, 구조를 드러내는 ‘성문 문짝들’이 가장 자연스럽습니다.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  english_pob_choice: and the two doorposts
  chosen_korean: 두 문설주
  alternatives_korean:
  - 두 문설주
  - 두 기둥
  - 두 문기둥
  lexicon: HALOT
  rationale: מְזוּזוֹת는 문이나 문간의 옆기둥/문설주를 가리키므로, 현대 한국어에서 이해가 분명한 ‘문설주’를 택했습니다.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  english_pob_choice: pulled them up with the bar
  chosen_korean: 빗장과 함께 그것들을 뽑아 올렸습니다
  alternatives_korean:
  - 빗장과 함께 그것들을 뽑아 올렸습니다
  - 빗장째 떼어 내었습니다
  - 빗장째 뽑아 올렸습니다
  lexicon: HALOT
  rationale: נסע는 이 문맥에서 제자리를 ‘뽑아내다/옮겨내다’의 힘 있는 동작을 나타내므로, 성문 부속물 전체를 들려는 느낌을 살려 ‘뽑아 올렸습니다’로 옮겼습니다.
- source_word: אֶל רֹאשׁ הָהָר אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  english_pob_choice: to the top of the hill that is opposite Hebron
  chosen_korean: 헤브론 맞은편에 있는 산의 꼭대기
  alternatives_korean:
  - 헤브론 맞은편에 있는 산의 꼭대기
  - 헤브론을 마주한 산꼭대기
  - 헤브론 앞에 있는 산의 정상
  lexicon: HALOT
  rationale: עַל פְּנֵי חֶבְרוֹן은 ‘맞은편/마주한’의 지리적 관계를 나타내므로, 이를 분명히 드러내는 ‘헤브론 맞은편에 있는’으로 옮겼습니다.
theological_decisions:
- issue: 본절의 폭력적 동작을 어떻게 전달할지
  chosen_reading: 성문을 ‘붙잡고’ ‘뽑아 올렸다’고 직역에 가깝게 옮겨 삼손의 비범한 힘을 약화하지 않았습니다.
  alternative_readings:
  - 성문을 떼어 내었다
  - 성문을 들어 올렸다
  rationale: 본문은 단순한 이동보다 제자리를 힘으로 제거하는 장면을 보여 주므로, 동사의 강도를 유지하는 표현이 필요합니다.
  doctrine_reference: 본문 서사 이해
