  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
  footnotes:
  - marker: a
    text: Or 'tore them out with the bar.' The Hebrew verb can denote pulling out or uprooting from place.
    reason: lexical_alternative
  - marker: b
    text: Or 'the hill that faces Hebron.' The Hebrew idiom literally says 'upon the face of Hebron.'
    reason: lexical_alternative
translation:
  language: ko
  text: 삼손은 한밤중까지 누워 있었습니다[a]. 그러다가 한밤중에 일어나 성문의 문짝들과 두 문설주를 붙잡고, 빗장과 함께 그것들을 뽑아 냈습니다[b]. 그는 그것들을 자기 어깨에 메고 헤브론 맞은편에 있는 산꼭대기까지 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잠들어 있었습니다.’ 히브리어 동사는 단순히 누워 있거나 잠든 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들을 빗장째 뽑아 냈습니다.’ 히브리어 동사는 제자리에서 뽑아 내거나 떼어 내는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay
  chosen_korean: 누워 있었습니다
  alternatives_korean:
