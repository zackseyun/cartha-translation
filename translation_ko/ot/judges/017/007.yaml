  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: Now there was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
  footnotes:
  - marker: a
    text: Or 'from the family of Judah.' The Hebrew term can denote a family group or clan; 'clan' is used here for specificity.
    reason: lexical_alternative
  - marker: b
    text: Or 'was sojourning there' or 'was residing there.' The Hebrew verb often refers to living somewhere as a temporary resident.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다의 베들레헴[a]에서 온 한 젊은이가 있었는데, 그는 레위 사람이었고[b] 거기서 머물고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 가족(씨족)에서 온’이라는 뜻일 수 있습니다. 히브리어 용어는 가족 집단이나 씨족을 가리킬 수 있으므로, 여기서는 더 구체적으로 ‘유다의 베들레헴’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거기서 나그네로 머물고 있었습니다’라는 뜻일 수 있습니다. 히브리어 동사는 대개 임시 거주를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now there was
  chosen_korean: 그때 …이 있었습니다
  alternatives_korean:
  - 그리고 …이 있었습니다
  - 그때 …이 있었습니다
  lexicon: HALOT
  rationale: 새 인물을 도입하는 서술용 와우 연속형을 한국어 서사에 자연스럽게 옮기기 위해 ‘그때’로 장면을 여는 표현을 썼습니다.
- source_word: נַעַר
  english_pob_choice: young man
  chosen_korean: 젊은이
  alternatives_korean:
  - 젊은 남자
  - 소년
  - 청년
  lexicon: HALOT
  rationale: 이 문맥에서는 나이감만 제시될 뿐 종속 관계가 아니므로, 현대 한국어에서 자연스럽고 범위가 과도하게 좁지 않은 ‘젊은이’가 적절합니다.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  english_pob_choice: from Bethlehem in Judah
  chosen_korean: 유다의 베들레헴
  alternatives_korean:
  - 유다에 있는 베들레헴
  - 베들레헴 유다
  lexicon: HALOT
  rationale: 지명 수식구를 한국어의 일반적인 표기 순서로 옮겨, 다른 베들레헴과 구별되는 유다 지역의 베들레헴이라는 뜻을 살렸습니다.
- source_word: לֵוִי
  english_pob_choice: a Levite
  chosen_korean: 레위 사람이었고
  alternatives_korean:
  - 레위 사람이었고
  - 레위인이었고
  lexicon: HALOT
  rationale: 레위 지파 소속을 가리키는 명사로, 교회적 직분을 암시하는 표현보다 혈통·소속을 드러내는 ‘레위 사람’이 더 직접적입니다.
- source_word: גָר שָׁם
  english_pob_choice: was staying there
  chosen_korean: 거기서 머물고 있었습니다
  alternatives_korean:
  - 거기서 나그네로 살고 있었습니다
  - 거기서 거주하고 있었습니다
  - 거기서 체류하고 있었습니다
  lexicon: HALOT
  rationale: גָר의 임시 체류·거주 뉘앙스를 살리되, 현대 한국어에서 지나치게 전문적이거나 어색한 ‘나그네로’보다 ‘머물고 있었습니다’가 자연스럽습니다.
theological_decisions:
- issue: 유다 베들레헴 출신과 레위인이라는 정체성의 긴장
  chosen_reading: 두 진술을 그대로 병렬하여 유지하고, 조화시키지 않았습니다.
  alternative_readings:
  - ‘유다의 가족/씨족’으로 완화하여 계보적 긴장을 희석함
  - 출신 표지를 단순 지리 정보로만 처리함
  rationale: 히브리어 본문은 출신 표지와 레위인 신분을 나란히 제시하므로, 번역도 그 긴장을 보존하는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 'Translation philosophy: preserve source-level tension rather than resolve it.'
