source:
  edition: WLC
  text: וַ/יָּ֥שֶׁב אֶת הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תִּקַּ֣ח אִמּ/וֹ֩ מָאתַ֨יִם כֶּ֜סֶף וַ/תִּתְּנֵ֣/הוּ לַ/צּוֹרֵ֗ף וַֽ/יַּעֲשֵׂ֨/הוּ֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽיְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
  footnotes:
  - marker: a
    text: Or 'two hundred silver shekels'; the Hebrew says simply 'two hundred silver' without stating the unit explicitly in this verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'a graven image and a molten image.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew uses a singular verb ('and it was') after 'a carved image and a cast image,' likely treating the made object or set as a unit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 은을 자기 어머니에게 돌려주었습니다[a]. 어머니는 은 이백을 받아 은세공인에게 주었고, 그가 그것으로 새긴 우상과 주조한 우상[b]을 만들었습니다[c]. 그것은 미가의 집에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은 이백 세겔’. 히브리어는 여기서 단위를 분명히 밝히지 않고 단지 ‘은 이백’이라고만 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘새긴 형상과 주조한 형상’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘새긴 우상과 주조한 우상’ 뒤에 단수 동사 ‘있었다’를 사용하여, 만들어진 것들을 하나의 묶음으로 보는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת הַכֶּסֶף
  english_pob_choice: returned the silver
  chosen_korean: 은을 ... 돌려주었습니다
  alternatives_korean:
  - 은을 돌려주었습니다
  - 그 은을 다시 주었습니다
  lexicon: HALOT
  rationale: שׁוּב의 사역형 서술로, 돈을 원래 주인에게 되돌리는 뜻이므로 ‘돌려주다’가 자연스럽고 restitutive한 뉘앙스를 잘 살립니다.
- source_word: מָאתַיִם כֶּסֶף
  english_pob_choice: two hundred pieces of silver
  chosen_korean: 은 이백
  alternatives_korean:
  - 은 이백 세겔
  - 은 이백 개
  lexicon: HALOT
  rationale: 히브리어는 단위어 없이 ‘이백’과 ‘은’만 제시하므로, 본문 범위를 넘어서 ‘세겔’을 단정하지 않고 한국어도 단위 비확정성을 유지했습니다.
- source_word: לַצּוֹרֵף
  english_pob_choice: to the silversmith
  chosen_korean: 은세공인에게
  alternatives_korean:
  - 세공인에게
  - 금속 세공인에게
  - 정련공에게
  lexicon: HALOT
  rationale: 은이 대상이므로 ‘은세공인’이 가장 구체적이고 자연스럽게 מקצוע을 드러냅니다.
- source_word: פֶּסֶל וּמַסֵּכָה
  english_pob_choice: a carved image and a cast image
  chosen_korean: 새긴 우상과 주조한 우상
  alternatives_korean:
  - 새긴 형상과 주조한 형상
  - 조각한 우상과 부어 만든 우상
  - 새긴 상과 주조한 상
  lexicon: HALOT
  rationale: פֶּסֶל과 מַסֵּכָה의 제조 방식 차이를 살리되, 한국어에서 우상성도 분명히 보이도록 ‘우상’을 유지했습니다.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  english_pob_choice: and it was in the house of Micah
  chosen_korean: 그것은 미가의 집에 있었습니다
  alternatives_korean:
  - 그것들은 미가의 집에 있었습니다
  - 그것이 미가의 집에 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 앞의 복수 개념 뒤에 단수 동사를 쓰는 특이한 구문이지만, 한국어에서는 집합적 대상에 대한 단수 ‘그것’을 사용해 문법적 긴장을 과도하게 풀지 않았습니다.
theological_decisions:
- issue: פֶּסֶל וּמַסֵּכָה를 설명적으로 ‘우상’으로 풀어도 되는지
  chosen_reading: 형태와 제작 방식을 드러내는 동시에 ‘우상’을 붙여, 본문이 암시하는 배교적 성격을 분명히 했습니다.
  alternative_readings:
  - 새긴 형상과 주조한 형상
  - 새긴 상과 주조한 상
  - 우상과 우상
  rationale: 본문은 단순한 장식품이 아니라 제의적 대상을 묘사하므로, 원어의 제조 방식과 우상성을 함께 보여 주는 번역이 source-direct하면서도 독자가 문맥적 의미를 파악하는 데 유익합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension while rendering source text directly.'
