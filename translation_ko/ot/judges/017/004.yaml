revisions:
- from: 그는 은을 자기 어머니에게 돌려주었습니다[a]. 어머니는 은 이백을 받아 은세공인에게 주었고, 그가 그것으로 새긴 우상과 주조한 우상[b]을 만들었습니다[c]. 그것은 미가의 집에 있었습니다.
  to: 그는 그 은을 자기 어머니에게 돌려주었습니다. 어머니는 그 은 가운데 이백[a]을 떼어 은세공인에게 주었고, 그는 그 은으로 새긴 형상과 주조한 형상[b]을 만들었습니다. 그것은 미가의 집에 있었습니다[c].
  rationale: 어머니의 행위를 ‘받다’에서 ‘그 은 가운데 이백을 떼어’로 고쳐 히브리어 동사의 의미를 반영했습니다. 형상들을 ‘우상’이라 부르는 해석적 확장을 제거하고, פֶּסֶל과 מַסֵּכָה의 제작 방식 차이를 ‘새긴 형상’과 ‘주조한 형상’으로 보존했습니다. 각주 앵커도 각각 단위 표현과 단수 서술어에 맞추어 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:01Z'
