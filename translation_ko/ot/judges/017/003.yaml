base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
  footnotes:
  - marker: a
    text: Or “a molten image.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from my hand,” an idiom expressing personal possession or agency.
    reason: cultural_note
translation:
  language: ko
  text: 그가 은 천백 세겔을 그의 어머니에게 돌려드리자, 그의 어머니가 말했습니다. “나는 이 은을 내 손에서 내 아들을 위하여 야훼께 엄숙히 바쳤다. 이것으로 새긴 우상과 부어 만든 우상을 만들려고 한 것이니, 이제 내가 그것을 너에게 돌려주겠다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת
  english_pob_choice: returned
  chosen_korean: 돌려드리자
  alternatives_korean:
  - 돌려주자
  - 반환하자
  lexicon: HALOT
  rationale: שׁוב의 사역적 용법을 자연스럽게 살려, 단순 이동이 아니라 원래 주인에게 되돌려 주는 의미를 표현했습니다. 존대가 아닌 서술이므로 어머니에게는 겸양의 ‘드리다’를 썼습니다.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  english_pob_choice: the eleven hundred pieces of silver
  chosen_korean: 은 천백 세겔
  alternatives_korean:
  - 은 천백 개
  - 천백 은돈
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘은 천백’이므로, 문맥상 통용되는 화폐 단위인 ‘세겔’을 보충해 한국어에서 자연스럽고 명료하게 옮겼습니다.
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  english_pob_choice: I had solemnly dedicated
  chosen_korean: 엄숙히 바쳤다
  alternatives_korean:
  - 엄숙히 봉헌했다
  - 정말로 바쳤다
  lexicon: HALOT
  rationale: 강조형(무한대명사+완료형)의 중첩을 ‘엄숙히’로 살리고, 예배적/서원적 의미는 ‘바치다’로 담았습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: 본 프로젝트 기본 용례
  rationale: 원문이 יהוה를 직접 쓰므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이는 본문이 지닌 고유한 신명 표지를 보존합니다.
- source_word: פֶּסֶל וּמַסֵּכָה
  english_pob_choice: a carved image and a cast image
  chosen_korean: 새긴 우상과 부어 만든 우상
  alternatives_korean:
  - 새긴 형상과 부어 만든 형상
  - 조각상과 주조상
  lexicon: HALOT
  rationale: פֶּסֶל과 מַסֵּכָה는 우상 제작 맥락의 구체적 물건을 가리키므로, 전통적이되 본문 의미를 분명히 드러내는 ‘우상’을 유지했습니다. ‘부어 만든’은 cast의 제작 방식을 직접 반영합니다.
- source_word: מִיָּדִי
  english_pob_choice: from my hand
  chosen_korean: 내 손에서
  alternatives_korean:
  - 내 손으로부터
  - 내 손을 떠나
  lexicon: HALOT
  rationale: 관용적 표현을 직역에 가깝게 살려, 소유와 처분의 주체성을 함께 드러냈습니다.
theological_decisions:
- issue: 야훼께 바쳤다는 말과 우상 제작 목적의 긴장
  chosen_reading: “나는 이 은을 내 손에서 내 아들을 위하여 야훼께 엄숙히 바쳤다. 이것으로 새긴 우상과 부어 만든 우상을 만들려고 한 것이니...”
  alternative_readings:
  - ‘...야훼께 바쳤다’ 대신 ‘하나님께 바쳤다’
  - 의미를 조정해 ‘헌납했다’로 완화
  rationale: 본문은 봉헌 언어와 우상 제작 목적을 함께 제시하므로, 둘 사이의 신학적 긴장을 해소하지 않고 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
