  to: 그가 은 천백 개를 어머니에게 돌려주었습니다. 그러자 어머니가 말했습니다. “나는 이 은을 내 손에서[a] 내 아들을 위하여 야훼께 엄숙히 바쳤습니다. 새긴 형상과 부어 만든 형상을 만들기 위해서였습니다. 이제 내가 그것을 너에게 돌려주겠습니다.”
