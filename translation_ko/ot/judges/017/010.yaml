source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
  footnotes:
  - marker: a
    text: Hebrew literally 'ten silver'; the unit is not specified, so 'ten shekels of silver' is a common interpretive rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'an allowance of clothing.'
    reason: lexical_alternative
  - marker: c
    text: Or simply 'the Levite went'; the Hebrew verb is 'went,' though in context it may imply that he entered Micah's household.
    reason: lexical_alternative
translation:
  language: ko
  text: 미가가 그에게 말했습니다. 「나와 함께 머물고, 나에게 아버지와 제사장이 되십시오. 그러면 나는 해마다 은 열 개와 옷 한 벌과 네 생활비를 주겠습니다.」 그러자 레위인이 들어갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘은 열 개’라고만 하며, 단위는 명시하지 않습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘옷에 대한 수당’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 단순히 ‘레위인이 갔다’로도 옮길 수 있습니다. 동사는 ‘갔다’이지만, 문맥상 미가의 집으로 들어간 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  english_pob_choice: Stay with me
  chosen_korean: 나와 함께 머물고
  alternatives_korean:
  - 나와 함께 살고
  - 나와 함께 거하고
  lexicon: HALOT
  rationale: 히브리어 명령형은 함께 거주하며 지내라는 뜻이므로, 현대 한국어에서 자연스러운 ‘머물다’로 관계성과 동거의 뉘앙스를 살렸습니다.
- source_word: לְאָב וּלְכֹהֵן
  english_pob_choice: a father and a priest
  chosen_korean: 아버지와 제사장
  alternatives_korean:
  - 아버지이자 제사장
  - 아버지와 제사장이
  lexicon: HALOT
  rationale: ‘아버지’는 문자적 부성보다 보호자/조언자 역할의 은유이므로, 본문의 직설성을 유지해 그대로 옮겼습니다.
- source_word: עֲשֶׂרֶת כֶּסֶף לַיָּמִים
  english_pob_choice: ten pieces of silver a year
  chosen_korean: 해마다 은 열 개
  alternatives_korean:
  - 해마다 은 열 세겔
  - 매년 은 열 개
  lexicon: HALOT
  rationale: 본문은 단위를 명시하지 않고 ‘은 열 개’라고만 말하므로, 한국어도 그 불특정성을 유지했습니다. ‘해마다’는 לַיָּמִים의 관용적 연간 지급 뜻을 반영합니다.
- source_word: וְעֵרֶךְ בְּגָדִים
  english_pob_choice: a set of clothes
  chosen_korean: 옷 한 벌
  alternatives_korean:
  - 의복 한 벌
  - 의복 지급
  lexicon: HALOT
  rationale: 표현은 옷의 공급/가치를 뜻하므로, 자연스럽고 구체적인 ‘옷 한 벌’이 원문의 실용적 의미를 잘 전달합니다.
- source_word: וּמִחְיָתֶךָ
  english_pob_choice: and your living
  chosen_korean: 네 생활비
  alternatives_korean:
  - 네 생계
  - 네 먹을 것
  lexicon: HALOT
  rationale: מִחְיָה는 단순한 식량보다 생계 유지 수단 전체를 가리키므로, 현대 독자에게 가장 분명한 ‘생활비’로 옮겼습니다.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  english_pob_choice: So the Levite went in
  chosen_korean: 그러자 레위인이 들어갔습니다
  alternatives_korean:
  - 그러자 레위인이 갔습니다
  - 그러자 레위인이 들어가게 되었습니다
  lexicon: HALOT
  rationale: 동사는 기본적으로 ‘가다’이지만, 앞선 초청 맥락상 미가의 집으로 ‘들어갔다’는 의미가 자연스럽게 함축되므로 그 함의를 살렸습니다.
theological_decisions:
- issue: ‘아버지’와 ‘제사장’의 결합이 주는 종교적·사회적 역할
  chosen_reading: 문자적 은유를 유지해 미가가 레위인을 종교적 조언자이자 가족적 보호자로 요구하는 장면을 그대로 드러냈습니다.
  alternative_readings:
  - 영적 아버지
  - 사제적 보호자
  - 조언자
  rationale: 본문은 특이하고 불건전한 사적 성소 상황을 완화하지 않고 보여 줍니다. 따라서 교회적 용어로 순화하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 은의 수량과 단위
  chosen_reading: 주어진 히브리어처럼 단위를 밝히지 않고 ‘은 열 개’로 처리했습니다.
  alternative_readings:
  - 은 열 세겔
  - 은화 열 개
  rationale: 원문은 단위를 명시하지 않으므로, 후대 관습적 단위를 본문에 보태지 않는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §1
