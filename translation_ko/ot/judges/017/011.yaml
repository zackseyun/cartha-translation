base_translation:
  language: en
  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
  footnotes:
  - marker: a
    text: Or 'was willing to stay with the man.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the young man was to him like one of his sons,' expressing that Micah treated the Levite as a member of his household.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 레위인은 그 사람과 함께 살기로 승낙했고, 그 젊은이는 그에게 아들들 중 하나처럼 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 사람과 함께 살기를 기꺼이 받아들였습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 젊은이는 그에게 그의 아들들 중 하나처럼 되었다’라고 합니다. 이는 미가가 그 레위인을 자기 집안의 한 식구처럼 대했음을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  english_pob_choice: agreed
  chosen_korean: 동의했고
  alternatives_korean:
  - 기꺼이 머물렀고
  - 머물기로 응했고
  - 머물기로 승낙했고
  lexicon: HALOT
  rationale: יאל의 히필은 의사적 동의와 수락을 나타내므로, 현대 한국어에서는 자연스럽게 ‘동의하다’로 옮기는 것이 원문에 가깝습니다.
- source_word: לָשֶׁבֶת אֶת הָאִישׁ
  english_pob_choice: to stay with the man
  chosen_korean: 그 사람과 함께 머물기로
  alternatives_korean:
  - 그 사람과 함께 살기로
  - 그 사람과 함께 거주하기로
  - 그 사람에게 붙어 지내기로
  lexicon: HALOT
  rationale: ישב는 여기서 단순 체류보다 동거·거주에 가까우므로, 관계를 분명히 드러내는 ‘함께 머물다’가 가장 자연스럽습니다.
- source_word: כְּאַחַד מִבָּנָיו
  english_pob_choice: like one of his sons
  chosen_korean: 아들들 가운데 하나처럼
  alternatives_korean:
  - 아들들 중 하나처럼
  - 그의 아들들 중 한 사람처럼
  - 아들 하나처럼
  lexicon: HALOT
  rationale: ‘~의 아들들 가운데 하나’라는 비교구조를 살리되, 한국어에서는 소속감을 드러내는 ‘아들들 가운데 하나처럼’이 원문의 가정적 편입 의미를 잘 전합니다.
theological_decisions:
- issue: 가문의 일원으로 받아들여졌다는 함의
  chosen_reading: ‘그 젊은이는 그에게 아들들 가운데 하나처럼 되었습니다’로 옮겨, 단순 고용 관계를 넘어 가족 구성원처럼 대우받았음을 드러냈습니다.
  alternative_readings:
  - 그 젊은이는 그의 아들들 중 하나가 되었습니다
  - 그 젊은이는 그에게 아들처럼 여겨졌습니다
  rationale: 히브리어는 신분 상승이 아니라 비유적 가족 편입을 말하므로, 한국어도 ‘처럼’으로 비유를 보존해야 합니다.
  doctrine_reference: 가정/후원 관계의 서술을 문자적 혈연으로 오해하지 않도록 하는 해석 원칙
