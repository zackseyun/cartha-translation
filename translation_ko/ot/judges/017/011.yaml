  - severity: low
    issue: ‘아들들 가운데 하나처럼’의 어법
    rationale: 원문의 비교 의미는 보존되어 있으나, ‘아들들 중 하나처럼’이 현대 표준어에서 더 자연스럽습니다.
  - severity: low
    issue: 각주 a의 내용과 분류
    rationale: 초안의 각주 a는 체류·방문의 대조를 설명하지만 영어 감사 기록의 해당 각주는 וַיּוֹאֶל의 어휘적 대안을 다룹니다. 본문 의미를 바꾸지 않고 이 대안을 반영하도록 정리했습니다.
