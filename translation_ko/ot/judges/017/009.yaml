  rationale: 출신·기원을 묻는 자연스러운 현대 한국어로 옮기되, 단순한 현재 위치 질문으로 약화되지 않게 했습니다.
- source_word: לֵוִי אָנֹכִי
  english_pob_choice: I am a Levite
