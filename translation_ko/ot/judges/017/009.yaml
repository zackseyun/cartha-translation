  lexicon: HALOT
  rationale: רֶוִי/레위파 소속의 정체성을 한국어 성경에서 익숙한 ‘레위인’으로 표현했습니다.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  english_pob_choice: from Bethlehem in Judah
  chosen_korean: 유다의 베들레헴 출신
  alternatives_korean:
  - 유다에 있는 베들레헴 출신
