  lexicon: HALOT
  rationale: 지명 관계를 명확히 하면서, 히브리어의 지역 지정 기능을 자연스러운 출신 표현으로 옮겼습니다.
- source_word: לָגוּר
  english_pob_choice: to sojourn / reside temporarily
  chosen_korean: 거류하려고
  alternatives_korean:
  - 잠시 머무르려고
  - 나그네로 살려고
  - 거주하려고
  lexicon: HALOT
  rationale: לָגוּר가 지닌 ‘잠시 거주하다, 외지인으로 머물다’의 뉘앙스를 살리기 위해 ‘거류하다’를 택했습니다.
theological_decisions:
- issue: 레위인의 자기소개에서 ‘거류하다’의 사회적 위치 뉘앙스
  chosen_reading: 단순한 이동이 아니라, 정착권을 전제하지 않는 외지 체류를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 그냥 ‘머무르다’로 평이하게 처리
  - ‘거주하다’로 중립화
  rationale: 본문의 לָגוּר는 일시 체류와 외부인성을 내포하므로, 그 긴장을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 서사 본문의 사회사적 맥락 보존
