  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
  footnotes:
  - marker: a
    text: Or, 'to sojourn wherever I may find [a place].' The verb carries the sense of residing temporarily, often as an outsider or dependent resident.
    reason: lexical_alternative
translation:
  language: ko
  text: 미가가 그에게 말했습니다. “어디서 오셨습니까?” 그러자 그가 그에게 말했습니다. “저는 유다의 베들레헴 출신 레위인입니다. 그리고 저는 제가 찾는 곳 어디든 거류하려고 갑니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 찾는 곳 어디든 거류하려고’로 볼 수 있습니다. 이 동사는 일시적으로 머무는, 곧 외지인이나 부양받는 거주자의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  english_pob_choice: Where do you come from
  chosen_korean: 어디서 오셨습니까
  alternatives_korean:
  - 어디서 오셨습니까?
  - 어디에서 오시게 되었습니까?
  lexicon: HALOT
  rationale: 출신·기원을 묻는 자연스러운 현대 한국어로 옮기되, 단순한 현재 위치 질문으로 약화되지 않게 했습니다.
- source_word: לֵוִי אָנֹכִי
  english_pob_choice: I am a Levite
  chosen_korean: 저는 … 레위인입니다
  alternatives_korean:
  - 저는 레위 사람입니다
  - 저는 레위 지파 사람입니다
  lexicon: HALOT
  rationale: רֶוִי/레위파 소속의 정체성을 한국어 성경에서 익숙한 ‘레위인’으로 표현했습니다.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  english_pob_choice: from Bethlehem in Judah
  chosen_korean: 유다의 베들레헴 출신
  alternatives_korean:
  - 유다에 있는 베들레헴 출신
  - 유다의 베들레헴에서 온
  lexicon: HALOT
  rationale: 지명 관계를 명확히 하면서, 히브리어의 지역 지정 기능을 자연스러운 출신 표현으로 옮겼습니다.
- source_word: לָגוּר
  english_pob_choice: to sojourn / reside temporarily
  chosen_korean: 거류하려고
  alternatives_korean:
  - 잠시 머무르려고
  - 나그네로 살려고
  - 거주하려고
  lexicon: HALOT
  rationale: לָגוּר가 지닌 ‘잠시 거주하다, 외지인으로 머물다’의 뉘앙스를 살리기 위해 ‘거류하다’를 택했습니다.
theological_decisions:
- issue: 레위인의 자기소개에서 ‘거류하다’의 사회적 위치 뉘앙스
  chosen_reading: 단순한 이동이 아니라, 정착권을 전제하지 않는 외지 체류를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 그냥 ‘머무르다’로 평이하게 처리
  - ‘거주하다’로 중립화
  rationale: 본문의 לָגוּר는 일시 체류와 외부인성을 내포하므로, 그 긴장을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 서사 본문의 사회사적 맥락 보존
