  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
  footnotes:
  - marker: a
    text: Or, 'to sojourn wherever I may find [a place].' The verb carries the sense of residing temporarily, often as an outsider or dependent resident.
    reason: lexical_alternative
translation:
  language: ko
  text: 미가가 그에게 말했습니다. “어디서 오셨습니까?” 그러자 그가 그에게 말했습니다. “저는 유다의 베들레헴 출신 레위인입니다. 저는 제가 찾게 되는 곳이면 어디든지 머물러 살려고[a] 가고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류하려고’로 옮길 수 있습니다. 이 동사는 일시적으로 머물며 사는 것, 흔히 외지인이나 의존적인 거주자로 사는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  english_pob_choice: Where do you come from
  chosen_korean: 어디서 오셨습니까
  alternatives_korean:
