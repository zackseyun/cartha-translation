  text: וְ/הָ/אִ֣ישׁ מִיכָ֔ה ל֖/וֹ בֵּ֣ית אֱלֹהִ֑ים וַ/יַּ֤עַשׂ אֵפוֹד֙ וּ/תְרָפִ֔ים וַ/יְמַלֵּ֗א אֶת יַ֤ד אַחַד֙ מִ/בָּנָ֔י/ו וַ/יְהִי ל֖/וֹ לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: Now the man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
  footnotes:
  - marker: a
    text: Or 'a shrine.' The Hebrew is literally 'a house of gods'; some take it as a private shrine.
    reason: lexical_alternative
  - marker: b
    text: Literally 'filled the hand of,' an idiom for installing or consecrating someone to priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 미가라는 사람은 신들의 집[a]을 가지고 있었고, 에봇과 집안 우상들을 만들었으며, 자기 아들들 가운데 하나를 제사장으로 세웠습니다[b]. 그 아들은 미가의 제사장이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘신들의 집’입니다. 이를 사설 성소로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손을 채우다’라는 관용구로, 제사장 직분에 임명하거나 성별하는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  english_pob_choice: a house of gods
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 신들의 집
  - 성소
  - 하나님 집
  lexicon: HALOT
  rationale: 히브리어는 אֱלֹהִים의 형태상 복수성을 지니지만, POB의 영어 본문은 이 절의 우상적 문맥에도 불구하고 의미를 절충해 'a house of gods'로 처리했습니다. 한국어는 본문 가독성과 '집'의 종교적 기능을 살려 '하나님의 집'으로 옮기되, 주석 없이도 문맥상 비정상적인 개인 성소라는 점은 그대로 드러납니다.
- source_word: אֵפוֹד
  english_pob_choice: an ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에폿
  - 제사복
  - 제의용 앞치마
  lexicon: HALOT
  rationale: 전례적·문화적 특수성이 강한 용어이므로 음역을 유지하는 것이 원문의 구체성을 가장 잘 보존합니다.
- source_word: תְרָפִים
  english_pob_choice: household idols
  chosen_korean: 집안 우상들
  alternatives_korean:
  - 가정의 우상들
  - 드라빔
  - 가정 신상
  lexicon: HALOT
  rationale: 문맥상 가정용 우상 형상을 가리키므로, 영어 POB의 기능적 번역을 따라 현대 한국어로 의미를 분명히 했습니다.
- source_word: וַיְמַלֵּא אֶת יַד
  english_pob_choice: he ordained
  chosen_korean: 제사장으로 세웠습니다
  alternatives_korean:
  - 임직시켰습니다
  - 손을 채웠습니다
  - 성별했습니다
  lexicon: HALOT
  rationale: 직역 관용구 '손을 채우다'는 한국어에서 자연스럽지 않으므로, 제사장 직분 부여라는 결과를 드러내는 동사로 풀었습니다. POB가 이 표현을 'ordained'로 처리한 관찰을 반영합니다.
- source_word: לְכֹהֵן
  english_pob_choice: his priest
  chosen_korean: 그의 제사장
  alternatives_korean:
  - 그의 사제
  - 그의 제관
  - 그의 종교인
  lexicon: HALOT
  rationale: כֹהֵן의 기본 직능을 살려 '제사장'을 유지했습니다. 문맥상 미가 개인의 사적 종교 체계 안에서의 직무를 뜻합니다.
theological_decisions:
- issue: בֵּית אֱלֹהִים의 문맥상 우상적 성격을 한국어에서 얼마나 드러낼 것인가
  chosen_reading: '''하나님의 집''으로 옮기되, 뒤따르는 에봇·집안 우상·사설 제사장 임명으로 비정상적 개인 성소라는 문맥을 유지합니다.'
  alternative_readings:
  - '''신들의 집'''
  - '''성소'''
  - '''하나님의 집''을 ''하나님 집''으로 축소'
  rationale: 히브리어 표현과 영어 POB의 유동성을 고려하면, 한국어에서 노골적으로 다신교적 느낌만 강화하는 번역은 과도할 수 있습니다. 반대로 전통적 교회어인 '성소'는 정당한 성전 이미지를 유발할 위험이 있어 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: וַיְמַלֵּא אֶת יַד의 제사장 취임 관용구를 어떻게 처리할 것인가
  chosen_reading: 의례적 '손을 채우다'를 직역하지 않고 '제사장으로 세웠습니다'로 자연스럽게 풀어, 본문의 설치/위임 의미를 전달합니다.
  alternative_readings:
  - '''손을 채웠습니다'''
  - '''임직시켰습니다'''
  - '''성별했습니다'''
  rationale: 한국어 독자는 관용구 자체보다 제사장직 부여의 결과를 우선 이해해야 하므로, 직역보다 의미 중심 표현이 적절합니다. 다만 원문 관용의 흔적은 영어 POB의 주석과 함께 보존됩니다.
  doctrine_reference: Translation philosophy §§1, 5
