revisions:
- from: 이제 미가라는 사람에게는 하나님의 집이 있었고, 그는 에봇과 집안 우상들을 만들었으며, 자기 아들들 가운데 하나를 제사장으로 세웠습니다. 그러자 그가 그의 제사장이 되었습니다.[a][b]
  to: 미가라는 사람은 신들의 집[a]을 가지고 있었고, 에봇과 집안 우상들을 만들었으며, 자기 아들들 가운데 하나를 제사장으로 세웠습니다[b]. 그 아들은 미가의 제사장이 되었습니다.
  rationale: 원문의 복수형 표현과 영어 POB의 어휘 선택을 반영하여 ‘하나님의 집’을 ‘신들의 집’으로 수정했습니다. 원문에 없는 ‘이제’를 삭제하고, 마지막 절은 대명사의 모호성을 피하면서도 원문의 결과적 관계를 보존하도록 ‘그 아들은 미가의 제사장이 되었습니다’로 수정했습니다. 각주 표지는 해당 본문 표현에 붙였습니다.
