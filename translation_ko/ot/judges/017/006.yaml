  lexicon: HALOT
  rationale: 히브리어 단수 ‘אִישׁ’의 대표성을 살리되 한국어에서는 성별을 불필요하게 강조하지 않고, POB의 ‘each man’에 해당하는 분배적 의미를 ‘각 사람’으로 자연스럽게 전달했습니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 옳은
  alternatives_korean:
  - 올바른
  - 바른
  lexicon: HALOT
  rationale: ‘straight/right/upright’의 평가적 의미를 한국어에서 가장 직접적으로 드러내는 ‘옳은’을 택해, 관습적 종교어보다 본문의 판단성을 살렸습니다.
