translation:
  language: ko
  text: 그때 이스라엘에는 왕이 없었습니다[a]. 각 사람은 자기 눈에 옳은 대로 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람이 자기 눈에 옳은 대로 행했습니다.’ 히브리어는 대표적 의미로 남성 단수 ‘사람’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그때
  alternatives_korean:
  - 그 시절에
  - 그때에
  lexicon: HALOT
  rationale: 서사적 시간 표지로 기능하므로, 한국어에서는 간결한 회상 표현인 ‘그때’가 자연스럽고 문맥의 회고성을 유지합니다.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  english_pob_choice: there was no king in Israel
  chosen_korean: 이스라엘에는 왕이 없었습니다
  alternatives_korean:
  - 이스라엘에 왕이 없었습니다
  - 이스라엘에는 왕이 없었습니다
  lexicon: HALOT
  rationale: 존재 부정을 평이하게 옮겨 ‘왕이 없었다’로 표현하되, 조사 ‘에는’으로 장면의 범위를 자연스럽게 드러냈습니다.
- source_word: אִישׁ הַיָּשָׁר בְּעֵינָיו
  english_pob_choice: each man did what was right in his own eyes
  chosen_korean: 각 사람은 자기 눈에 옳은 대로
  alternatives_korean:
  - 각 남자는 자기 눈에 옳은 대로
  - 모든 사람이 자기 눈에 옳은 대로
  lexicon: HALOT
  rationale: 히브리어 단수 ‘אִישׁ’의 대표성을 살리되 한국어에서는 성별을 불필요하게 강조하지 않고, POB의 ‘each man’에 해당하는 분배적 의미를 ‘각 사람’으로 자연스럽게 전달했습니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 옳은
  alternatives_korean:
  - 올바른
  - 바른
  lexicon: HALOT
  rationale: ‘straight/right/upright’의 평가적 의미를 한국어에서 가장 직접적으로 드러내는 ‘옳은’을 택해, 관습적 종교어보다 본문의 판단성을 살렸습니다.
theological_decisions:
- issue: 절의 평가적 뉘앙스를 정치체제 논평으로 과도하게 확장하지 않기
  chosen_reading: 문장은 왕의 부재를 사실로 진술하면서도, ‘자기 눈에 옳은 대로’라는 표현으로 혼란과 자기판단의 문제를 드러내도록 그대로 옮겼습니다.
  alternative_readings:
  - 왕이 없어서 모두가 혼란스러웠다는 해석을 본문에 덧붙이는 번역
  - 왕정의 필요성을 직접 교훈화하는 번역
  rationale: 사사기의 반복 후렴은 서술과 평가가 함께 작동하지만, 본문이 말하는 범위를 넘어서 왕정 신학을 명시적으로 확장하지 않는 것이 source-grounded 원칙에 맞습니다.
  doctrine_reference: 본문의 긴장을 유지하고, 본문 밖의 교리화를 피함
