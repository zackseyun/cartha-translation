    rationale: 히브리어는 정관사 있는 הַלֵּוִי를 사용합니다. 앞 문맥에서 소개된 인물을 가리킬 수 있으므로 본문에 ‘그’를 반영하고, 해석 가능성은 각주로 밝혔습니다.
