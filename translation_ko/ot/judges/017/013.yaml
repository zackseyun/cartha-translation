  source_fidelity: ‘복을 주실’은 יֵיטִיב(‘선을 베풀다/잘 대해 주다’)보다 의미를 좁히며, 여호와라는 표기는 제시된 원문 및 POB 방침의 신명 ‘Yahweh’와 일치하지 않습니다. 또한 정관사 הַלֵּוִי의 특정성은 번역 또는 각주에서 반영하는 편이 좋습니다.
  naturalness: 초안의 ‘이르되’, ‘알았노라’, ‘두었음이라’는 현대 표준어 합쇼체에 맞지 않는 고어적 문체입니다. 현대적인 존대 서술과 인용문으로 다듬었습니다.
  terminology: יְהוָה는 ‘야훼’로, יֵיטִיב은 ‘선을 베푸실’로 옮겼습니다. לְכֹהֵן은 ‘제사장으로 두었기’로 자연스럽게 반영했습니다.
