base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
  footnotes:
  - marker: a
    text: Or, 'about which you swore an oath'; the Hebrew verb can refer to an oath or a curse, but the context here favors 'uttered a curse.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Blessed be my son to/by the LORD'; the expression is a compact blessing formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 어머니에게 그가 말했습니다. 「열한백 은, 곧 당신에게서 빼앗긴 그 은과, 당신이 저주를 내리고 또 내 귀에 말한 그것이—보십시오, 그 은이 제게 있습니다. 제가 그것을 가져갔습니다.」 그러자 그의 어머니가 말했습니다. 「야훼께 복이 있기를, 내 아들아.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘맹세하다’ 또는 ‘저주하다’를 가리킬 수 있으나, 이 문맥은 ‘저주를 내리다’ 쪽을 더 강하게 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼께/에게 내 아들이 복되기를’이라는 압축된 축복 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  english_pob_choice: the eleven hundred pieces of silver
  chosen_korean: 열한백 은
  alternatives_korean:
  - 열한백은
  - 은 천백 개
  - 열한백 세겔
  lexicon: HALOT
  rationale: 히브리어는 수량과 금속명만 제시하며 단위어를 명시하지 않으므로, ‘은’으로 두고 과도한 구체화는 피했습니다. 한국어에서는 ‘열한백’이 다소 낯설 수 있지만, 원문의 수량 표현을 더 직접적으로 보존합니다.
- source_word: וְאַתִּי אָלִית
  english_pob_choice: about which you uttered a curse
  chosen_korean: 당신이 저주를 내리고
  alternatives_korean:
  - 당신이 맹세하고
  - 당신이 저주를 퍼붓고
  lexicon: HALOT
  rationale: אָלָה는 맹세와 저주를 모두 가리킬 수 있으나, 문맥상 분실한 은과 관련된 발화는 저주로 이해하는 것이 자연스럽습니다. ‘저주를 내리고’는 결과적 뉘앙스를 살리면서도 과도하게 해석하지 않습니다.
- source_word: בְּאָזְנַי
  english_pob_choice: in my hearing
  chosen_korean: 내 귀에 말한 그것이
  alternatives_korean:
  - 내가 들을 수 있게 말한 그것이
  - 내 귀에 한 말이
  lexicon: HALOT
  rationale: 직역하면 ‘내 귀에’이지만, 한국어에서는 ‘내 귀에 말한’ 또는 ‘내 귀에 한 말’이 관용적으로 자연스럽습니다. 여기서는 앞의 ‘저주를 내리고’와 병렬을 살리기 위해 간결하게 처리했습니다.
- source_word: הִנֵּה
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의 환기 표지로서 ‘보십시오’가 현대 합쇼체에서 자연스럽고, 서술의 급박한 전환을 잘 드러냅니다.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  english_pob_choice: Blessed be my son by Yahweh
  chosen_korean: 야훼께 복이 있기를, 내 아들아
  alternatives_korean:
  - 야훼로 말미암아 내 아들이 복되기를
  - 야훼께서 내 아들을 복 주시기를
  lexicon: HALOT
  rationale: 히브리어 축복 공식은 짧은 감탄형 구문이라, 한국어에서도 동사형으로 풀기보다 축복 선언의 형식을 살렸습니다. ‘-께 복이 있기를’은 source-direct하면서도 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자 그대로의 신명사는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이는 칭호 ‘주’로 대체하지 않고 고유 이름을 보존합니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 고유명사인 테트라그람마톤을 직접 사용하므로, 제목어 ‘주’가 아니라 이름 자체를 보존하는 ‘야훼’를 택했습니다. 이는 독자가 축복 발화의 대상이 누구인지 분명히 인식하게 합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אָלָה의 의미
  chosen_reading: 저주로 이해하여 번역
  alternative_readings:
  - 맹세로 이해하여 번역
  - 맹세와 저주를 함께 암시하는 중립 번역
  rationale: 이 이야기의 흐름은 잃어버린 은에 대한 분노와 뒤이어지는 회복 선언으로 이어지므로, यहाँ의 발화를 ‘저주’로 읽는 것이 문맥에 가장 잘 맞습니다. 다만 동사의 양의성은 ‘저주를 내리고’로 번역해 완전히 평준화하지 않았습니다.
  doctrine_reference: Source-context lexical choice rather than doctrinal issue
