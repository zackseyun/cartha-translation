  text: 에브라임 산지에서 온 한 사람이 있었는데, 그의 이름은 미가야후였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 형태는 전통적인 ‘미가’가 아니라 ‘미가야후’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now there was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었습니다 — 그래서 새로운 서술 단락을 여는 말입니다
  - 그곳에 있었습니다
  lexicon: HALOT
  rationale: 와ו-연속형 היה는 새 이야기 단락을 여는 서술 공식이므로, 한국어에서는 자연스럽게 장면을 여는 ‘있었습니다’로 옮겼습니다.
- source_word: מֵהַר אֶפְרָיִם
  english_pob_choice: from the hill country of Ephraim
  chosen_korean: 에브라임 산지에서 온
  alternatives_korean:
  - 에브라임의 산지에서 온
  - 에브라임 산악지대에서 온
  lexicon: HALOT
  rationale: 이 표현은 단일 ‘산’이 아니라 에브라임과 관련된 구릉 지대를 가리키므로, 지리적으로 자연스럽고 정확한 ‘산지’로 옮겼습니다.
- source_word: וּשְׁמ֥וֹ
  english_pob_choice: and his name was
  chosen_korean: 그의 이름은
  alternatives_korean:
  - 그리고 그의 이름은
  - 그 이름은
  lexicon: HALOT
  rationale: 히브리어의 단순한 서술 연결을 한국어에서도 유지하되, 문장 흐름을 살려 ‘그의 이름은’으로 자연스럽게 처리했습니다.
- source_word: מִיכָיְהוּ
  english_pob_choice: Mikayhu
  chosen_korean: 미가야후
  alternatives_korean:
  - 미카
  - 미가야
  lexicon: HALOT
  rationale: 전통적 한국어 성경 인명 대신 히브리어 음가를 반영해 음역했고, 영어 POB의 철자 지향 선택과도 맞추어 ‘미가야후’로 옮겼습니다.
