base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
  footnotes:
  - marker: a
    text: Or, 'to go on his way' or 'while making his journey.' The Hebrew idiom is literally 'to make his way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자가 그 도시, 곧 유다의 베들레헴에서 나가, 어디서든 머무를 곳을 찾으려고 나그네로 살다가 에브라임 산지에 이르러 미가의 집까지 갔습니다. 그는 거기서 자기 길을 계속 가려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 길을 가려고’ 혹은 ‘여정을 계속하면서’. 히브리어 관용구는 문자적으로 ‘자기 길을 하다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 나가
  alternatives_korean:
  - 갔습니다
  - 떠났습니다
  - 길을 떠났습니다
  lexicon: HALOT
  rationale: 단순한 이동보다 앞선 장소를 떠나는 흐름이 분명하므로, 자연스러운 서술 속에서 ‘나가’로 옮겨 이동의 출발을 드러냈습니다.
- source_word: לָגוּר
  english_pob_choice: to sojourn
  chosen_korean: 나그네로 살다
  alternatives_korean:
  - 객으로 머물다
  - 체류하다
  - 잠시 살다
  lexicon: HALOT
  rationale: גור는 일시적·외부인적 거주를 뜻하므로, 정착보다 임시성에 초점을 둔 ‘나그네로 살다’가 소스 의미를 잘 보존합니다.
- source_word: בַּאֲשֶׁר יִמְצָא
  english_pob_choice: wherever he might find a place
  chosen_korean: 어디서든 머무를 곳을 찾으려고
  alternatives_korean:
  - 어디서든 찾을 수 있는 곳에서
  - 어디서든 찾아낼 곳을
  - 어디서든 발견하는 곳에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘찾다’와 암묵적 목적어(거처/장소)를 살려, 자연스럽게 ‘머무를 곳’을 보충했습니다.
- source_word: הַר אֶפְרַיִם
  english_pob_choice: the hill country of Ephraim
  chosen_korean: 에브라임 산지
  alternatives_korean:
  - 에브라임의 산지
  - 에브라임 산지 지방
  - 에브라임 산지 지역
  lexicon: HALOT
  rationale: 지리적 구획을 가리키는 통상적 표현이므로 ‘산지’로 간명하게 옮겼습니다.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  english_pob_choice: to continue his journey
  chosen_korean: 자기 길을 계속 가려고
  alternatives_korean:
  - 자기 길을 가려고
  - 길을 가기 위해
  - 여정을 계속하려고
  lexicon: HALOT
  rationale: 직역하면 ‘자기 길을 하다’라는 관용구이므로, 의미를 살리되 과도한 의역을 피한 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘그 도시’와 ‘유다의 베들레헴’의 관계
  chosen_reading: 본문의 עיר를 ‘도시’로 두고, 이어지는 지명으로 ‘유다의 베들레헴’이 그 출발지임을 유지했습니다.
  alternative_readings:
  - ‘그 마을’로 완화
  - ‘베들레헴 성읍’으로 전통화
  rationale: 원문의 일반 명사 עיר를 지명 수식과 함께 그대로 드러내는 편이, 특정 규모를 단정하지 않으면서 서술 흐름을 보존합니다.
  doctrine_reference: source transparency principle
