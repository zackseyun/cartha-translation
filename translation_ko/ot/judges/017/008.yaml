theological_decisions:
- issue: ‘그 도시’와 ‘유다의 베들레헴’의 관계
  chosen_reading: 본문의 עיר를 ‘도시’로 두고, 이어지는 지명으로 ‘유다의 베들레헴’이 그 출발지임을 유지했습니다.
  alternative_readings:
  - ‘그 마을’로 완화
  - ‘베들레헴 성읍’으로 전통화
  rationale: 원문의 일반 명사 עיר를 지명 수식과 함께 그대로 드러내는 편이, 특정 규모를 단정하지 않으면서 서술 흐름을 보존합니다.
  doctrine_reference: source transparency principle
