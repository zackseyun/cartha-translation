  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
  footnotes:
  - marker: a
    text: Or, 'to go on his way' or 'while making his journey.' The Hebrew idiom is literally 'to make his way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자는 유다의 베들레헴 성읍을 떠나, 어디서든 머무를 곳을 찾아 나그네로 살려고 했습니다. 그는 길을 가던 중[a] 에브라임 산지에 이르러 미가의 집까지 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 길을 가려고’ 또는 ‘여행을 계속하려고’. 히브리어 관용구는 문자적으로 ‘자기 길을 하다’입니다.
    reason: lexical_alternative
lexical_decisions:
