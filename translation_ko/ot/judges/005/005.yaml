  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
  footnotes:
  - marker: a
    text: Or, more literally, 'from before the presence of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''Flowed down'' renders a verb meaning to stream or drip; many translations interpret the image as ''melted.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 산들이 야훼 앞에서 흘러내렸습니다—이것이 시내입니다—이스라엘의 하나님 야훼 앞에서 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘임재 앞에서’.
    reason: lexical_alternative
  - marker: b
    text: ‘흘러내렸습니다’는 ‘흐르다, 흘러가다’의 뜻을 살린 번역입니다. 많은 번역본은 이를 ‘녹았다’로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  english_pob_choice: the mountains
  chosen_korean: 산들이
  alternatives_korean:
  - 산들
  - 그 산들
  lexicon: HALOT
  rationale: 히브리어는 정관적 복수로, 한국어에서는 자연스러운 복수 주어로 옮기되 문맥상 특정한 산들임을 암시하는 데 집중했습니다.
- source_word: נָזְלוּ
  english_pob_choice: flowed down
  chosen_korean: 흘러내렸습니다
  alternatives_korean:
  - 녹았습니다
  - 떨었습니다
  - 흘렀습니다
  lexicon: HALOT
  rationale: 동사는 기본적으로 ‘흘러가다/흘러내리다’의 뜻이므로, 시내현현의 시적 이미지에 맞게 ‘흘러내렸습니다’로 옮겨 영어 POB의 선택을 반영했습니다.
- source_word: מִפְּנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 존전에
  - 임재 앞에서
  - 앞에
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴/임재 앞에서’이지만, 시적 한국어에서는 ‘앞에서’가 가장 간결하게 임재를 드러냅니다. 필요하면 본문 내 반복으로 압박감을 살릴 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서 기본값에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 유지했습니다. 이는 호칭 ‘주님’으로 평준화하지 않고 언약적 이름을 드러냅니다.
- source_word: זֶה סִינַי
  english_pob_choice: this Sinai
  chosen_korean: 이것이 시내입니다
  alternatives_korean:
  - 이 시내입니다
  - 바로 시내입니다
  - 시내입니다
  lexicon: HALOT
  rationale: 히브리어의 돌출적인 지시어와 동일성을 살리기 위해 설명을 덧붙이지 않고 ‘이것이 시내입니다’로 직접적으로 옮겼습니다. 산을 가리키는 동일시 구조를 보존합니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님 야훼
  alternatives_korean:
  - 이스라엘의 하나님
  - 이스라엘의 하나님이신 야훼
  lexicon: HALOT
  rationale: 이 구는 앞선 야훼를 다시 지시하며 이스라엘의 하나님으로 규정하므로, 한국어에서는 동일한 주어를 반복해 시적 평행을 살렸습니다.
theological_decisions:
- issue: 시적 동일시 구문 זֶה סִינַי의 처리
  chosen_reading: ‘이것이 시내입니다’로 옮겨 산/산지의 동일시를 직접 드러냈습니다.
  alternative_readings:
  - ‘이 시내입니다’
  - ‘바로 시내입니다’
  rationale: 본문은 단순한 위치표시가 아니라 시내 자체를 지시하는 압축된 시적 동일시입니다. 한국어에서도 설명적 완화보다 직접적 동일시가 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: source-text primacy and preservation of poetic force'
- issue: 야훼의 반복
  chosen_reading: 첫 번째와 마지막에 모두 ‘야훼’를 유지했습니다.
  alternative_readings:
  - 첫 번째만 ‘야훼’, 마지막은 ‘주님’
  - 둘 다 ‘주님’
  rationale: 히브리어는 같은 신적 이름을 반복하여 임재의 압박을 강화합니다. 한국어에서 호칭을 바꾸면 반복 효과가 약해지므로, 고유명사를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
