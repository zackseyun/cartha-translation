  rationale: ‘시내’를 고유명 ‘시나이’로 바로잡고, 독립적인 ‘이것이 …입니다’ 문장을 원문의 시적 병행에 맞는 ‘이 시나이도’ 구문으로 고쳤습니다. 한국어에서 자연스러운 완결 문장을 위해 둘째 절에 앞 절의 동사를 보충했으며, 이는 히브리어의 생략과 의미를 바꾸지 않습니다. 야훼의 이름과 ‘이스라엘의 하나님’이라는 동격적 규정은 모두 보존했습니다.
