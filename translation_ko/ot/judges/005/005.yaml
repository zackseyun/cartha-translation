  source_fidelity: 동사 נָזְלוּ의 기본 이미지인 ‘흘러내리다’와 מִפְּנֵי 및 야훼의 반복은 대체로 보존되었습니다. 그러나 זֶה סִינַי는 서술문 ‘이것이 시내입니다’가 아니라, 앞 절의 동사를 이어받는 돌출적·시적인 지시 구문입니다. 또한 고유명 סִינַי를 일반명사 ‘시내’로 적은 것은 중대한 오류입니다.
  naturalness: 현 초안의 대시 사이 ‘이것이 시내입니다’는 문맥상 부자연스럽고, ‘시내’는 한국어에서 물줄기를 우선 연상시켜 혼동을 낳습니다. ‘이 시나이도 … 흘러내렸습니다’는 원문의 생략된 동사를 한국어 문장으로 자연스럽게 보충하면서 시적 병행을 유지합니다.
  terminology: יְהוָה는 ‘야훼’로, אֱלֹהֵי יִשְׂרָאֵל은 ‘이스라엘의 하나님’으로 옮기는 것이 적절합니다. סִינַ이는 통상적 고유명 표기인 ‘시나이’로 바로잡아야 합니다.
