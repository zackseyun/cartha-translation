id: JDG.5.8
reference: Judges 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִבְחַר֙ אֱלֹהִ֣ים חֲדָשִׁ֔ים אָ֖ז לָחֶ֣ם שְׁעָרִ֑ים מָגֵ֤ן אִם יֵֽרָאֶה֙ וָ/רֹ֔מַח בְּ/אַרְבָּעִ֥ים אֶ֖לֶף בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
  footnotes:
  - marker: a
    text: Or, more literally, 'He/one chose new gods.' The Hebrew verb is singular, but the sense is commonly understood collectively of Israel.
    reason: alternative_reading
  - marker: b
    text: The Hebrew of this line is difficult; alternatively, 'then fighting was at the gates' or similar.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 새 신들을 택하였고[a], 그때 성문에서 전쟁이 있었습니다[b]. 방패나 창이 이스라엘의 사만 명 가운데서 보였습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, ‘그가/누군가가 새 신들을 택하였다’입니다. 히브리어 동사는 단수형이지만, 문맥상 이스라엘 전체를 가리키는 집합적 표현으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 이 줄의 히브리어는 난해합니다. 달리, ‘그때 성문에서 싸움이 있었다’ 또는 비슷하게 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר / אֱלֹהִים חֲדָשִׁים
  english_pob_choice: They chose new gods
  chosen_korean: 그들이 새 신들을 택하였으니
  alternatives_korean:
  - 그가 새 신들을 택하였으니
  - 새 신들을 택하였으니
  lexicon: WLC + HALOT
  rationale: 히브리어 동사는 형태상 단수이지만 문맥상 이스라엘 전체를 가리키는 집합적 주어로 이해하는 POB의 해석을 따라, 주어를 복수로 풀어 자연스럽게 옮겼습니다. '새 신들'은 우상적 이방 신들을 직접적으로 드러냅니다.
- source_word: לָחֶם שְׁעָרִים
  english_pob_choice: war was at the gates
  chosen_korean: 전쟁이 성문에 이르렀습니다
  alternatives_korean:
  - 성문에서 싸움이 있었습니다
  - 전쟁이 성문 앞에 있었습니다
  lexicon: HALOT
  rationale: 어려운 압축 표현을 문자적으로만 옮기기보다, 문맥이 요구하는 위기 상황을 살려 '전쟁'과 '성문'의 긴장을 드러냈습니다. '이르렀습니다'는 공격이 도시 문턱까지 닿았다는 함의를 담습니다.
- source_word: מָגֵן ... וָרֹמַח
  english_pob_choice: shield ... spear
  chosen_korean: 방패나 창
  alternatives_korean:
  - 방패와 창
  - 방패 또는 창
  lexicon: HALOT
  rationale: 대표적인 군사 무기쌍을 표준 한국어로 옮겼고, 반문 구조를 위해 '나'를 사용해 둘 중 하나라도 보였는지 묻는 뉘앙스를 살렸습니다.
- source_word: בְּאַרְבָּעִים אֶלֶף בְּיִשְׂרָאֵל
  english_pob_choice: among forty thousand in Israel
  chosen_korean: 이스라엘의 사만 명 가운데서
  alternatives_korean:
  - 이스라엘 가운데 사만 명 중에서
  - 이스라엘 안의 사만 명 가운데서
  lexicon: HALOT
  rationale: ב의 범위감을 살려 '가운데서'로 옮겼으며, 수사적 질문의 대상 범위를 분명하게 했습니다. 고유명사 '이스라엘'은 국적/공동체 범위를 나타내는 것으로 처리했습니다.
theological_decisions:
- issue: 열린 주어의 처리
  chosen_reading: 초반 동사의 주어를 이스라엘 공동체로 읽어 '그들이'로 번역했습니다.
  alternative_readings:
  - 그가
  - 하나님이
  rationale: 문맥상 이스라엘의 배교와 그에 따른 위기를 고발하는 노래이므로, 하나님을 주어로 읽는 것은 신학적으로도 문맥적으로도 맞지 않습니다. POB의 집합적/부정칭 해석을 한국어에서 자연스럽게 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 성문 전쟁의 비유적 압축
  chosen_reading: '''전쟁이 성문에 이르렀습니다''로 풀어, 성문이 도시 침공의 전선임을 드러냈습니다.'
  alternative_readings:
  - 성문에서 싸움이 있었습니다
  - 성문에 전투가 있었습니다
  rationale: 히브리어의 압축성과 난해함을 유지하되, 독자가 위기와 무장 해제의 상실을 즉시 이해하도록 했습니다. 이는 무기 부재에 대한 다음 반문과도 긴밀히 연결됩니다.
  doctrine_reference: Translation philosophy §3
