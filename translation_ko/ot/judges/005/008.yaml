    rationale: לָחֶם שְׁעָרִים의 정확한 구문과 의미는 논쟁적입니다. ‘성문에서 전쟁이 있었습니다’는 가능한 해석을 제시하면서도 ‘성문에 이르다’가 암시하는 진행 방향을 추가하지 않습니다.
