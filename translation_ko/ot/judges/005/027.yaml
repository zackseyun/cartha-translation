base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
  footnotes:
  - marker: a
    text: Or 'at her feet' instead of the more literal 'between her feet.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew repeats a sequence of short verbs ('sank, fell, lay ... sank, fell') for poetic emphasis.
    reason: cultural_note
  - marker: c
    text: Or 'destroyed' / 'violently slain' for 'devastated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 발 사이에서 그가 주저앉아, 넘어지고, 누워 있었습니다. 그녀의 발 사이에서 그가 주저앉아, 넘어졌습니다. 그가 주저앉은 바로 거기에서, 그는 넘어져 쓰러졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 발에’로도 옮길 수 있습니다. 원문은 더 문자적으로는 ‘발 사이에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 짧은 동사들을 반복해 시적 강조를 이룹니다.
    reason: source_note
  - marker: c
    text: ‘쓰러졌습니다/멸망했습니다’로도 이해할 수 있으나, 여기서는 원문의 단일 형용사적 표현을 살려 ‘쓰러졌습니다’로 옮겼습니다.
    reason: lexical_alternative
