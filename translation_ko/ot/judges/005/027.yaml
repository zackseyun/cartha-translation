base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
  footnotes:
  - marker: a
    text: Or 'at her feet' instead of the more literal 'between her feet.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew repeats a sequence of short verbs ('sank, fell, lay ... sank, fell') for poetic emphasis.
    reason: cultural_note
  - marker: c
    text: Or 'destroyed' / 'violently slain' for 'devastated.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 발 사이에서 그는 주저앉았습니다, 쓰러졌습니다, 누웠습니다. 그녀의 발 사이에서 그는 주저앉았습니다, 쓰러졌습니다. 그가 주저앉은 곳에서, 바로 그곳에서 그는 쓰러져 패망했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 발에’로 옮길 수 있습니다. 원문은 더 문자적으로 ‘그녀의 발 사이에서’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 짧은 동사들을 반복하여 시적으로 강조합니다.
    reason: source_note
  - marker: c
    text: ‘패망했습니다’는 원문의 단일 형용사적 표현을 옮긴 것입니다. ‘파괴되었습니다’, ‘완전히 망했습니다’ 또는 문맥상 ‘죽임을 당했습니다’로도 이해할 수 있습니다.
    reason: lexical_alternative
