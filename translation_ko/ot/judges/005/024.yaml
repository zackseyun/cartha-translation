id: JDG.5.24
reference: Judges 5:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּבֹרַךְ֙ מִ/נָּשִׁ֔ים יָעֵ֕ל אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י מִ/נָּשִׁ֥ים בָּ/אֹ֖הֶל תְּבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
  footnotes:
  - marker: a
    text: Or 'Blessed above women is Jael … above the women in the tent.' The Hebrew uses a comparative construction that can be rendered either 'among' or 'above.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the tent.' This may idiomatically evoke women of the tent, that is, tent-dwelling women, but the Hebrew is singular.
    reason: cultural_note
translation:
  language: ko
  text: 여인들 가운데[a] 가장 복된 이는 겐 사람 헤벨의 아내 야엘입니다. 천막 안의[b] 여인들 가운데 가장 복된 이는 그녀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여인들보다 더 복된 이는 야엘 … 천막 안의 여인들보다 더 복된 이는 그녀입니다.’ 히브리어는 ‘가운데’ 또는 ‘보다 더’로 옮길 수 있는 비교 구문을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘천막 안에서’입니다. 문맥상 천막 생활을 하는 여성들을 가리키는 표현일 수 있지만, 히브리어는 단수형입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  english_pob_choice: Most blessed
  chosen_korean: 가장 복되신
  alternatives_korean:
  - 복되신
  - 복을 받으신
  - 가장 복되신 분
  lexicon: HALOT
  rationale: 피엘 수동형의 축복 선언을 한국어에서 자연스럽고 격조 있게 살리기 위해 ‘복되신’에 최상급을 더했습니다. 반복되는 두 번째 절에서는 호응을 위해 명사화 없이 다시 한 번 동일 어휘를 유지했습니다.
- source_word: מִ/נָּשִׁ֔ים
  english_pob_choice: among women
  chosen_korean: 여인들 가운데
  alternatives_korean:
  - 여인들 중
  - 여인들 위에
  - 여인들보다
  lexicon: HALOT
  rationale: מין의 비교 용법을 살리되, 한국어에서는 ‘가운데’가 ‘among/amongst’와 비교의 뉘앙스를 함께 자연스럽게 전달합니다. POB의 ‘among’ 선택을 반영하면서도 시적 문맥을 해치지 않습니다.
- source_word: אֵ֖שֶׁת חֶ֣בֶר הַ/קֵּינִ֑י
  english_pob_choice: the wife of Heber the Kenite
  chosen_korean: 겐 사람 헤벨의 아내
  alternatives_korean:
  - 헤벨 겐 사람의 아내
  - 헤벨의 아내이며 겐 사람인
  - 겐 사람 헤벨의 부인
  lexicon: HALOT
  rationale: 히브리어의 친족·소속 연결구를 그대로 살려 이름과 부족 표지를 함께 제시했습니다. ‘아내’는 본문의 관계를 직설적으로 드러내며, ‘부인’보다 원문 밀착도가 높습니다.
- source_word: בָּ/אֹ֖הֶל
  english_pob_choice: in the tent
  chosen_korean: 천막에 사는
  alternatives_korean:
  - 천막 안의
  - 천막에서
  - 천막에 있는
  lexicon: HALOT
  rationale: 단수 ‘천막’의 문자적 의미를 유지하면서, POB 각주가 지적하듯 천막 생활과 연관된 여성들을 암시하는 관용적 배경을 한국어에서 약간 반영했습니다. 다만 본문은 해석을 과도하게 확장하지 않도록 ‘여인들’과 연결해 절제했습니다.
theological_decisions:
- issue: 축복 선언의 화법과 반복 구조
  chosen_reading: 반복되는 ‘가장 복되신’ 표현을 유지해 야엘에 대한 시적 축복의 중첩을 드러냈습니다.
  alternative_readings:
  - 두 번째 절을 ‘복되십니다’로 단순화
  - ‘복을 받으셨습니다’로 완화
  rationale: 히브리어는 동일 동사를 반복해 비교·강조 효과를 만듭니다. 한국어에서도 반복을 유지해야 본문의 찬양적 강세와 수사적 대칭이 보존됩니다.
  doctrine_reference: 시적 축복/찬양의 반복 강조
- issue: ‘천막’의 문화적 함의
  chosen_reading: ‘천막에 사는 여인들’이라는 이해를 본문에는 직접 삽입하지 않고, 번역은 ‘천막에 사는’으로 절제해 반영했습니다.
  alternative_readings:
  - 그냥 ‘천막에서’
  - ‘천막의 여인들’
  rationale: 원문은 단수 ‘천막’이지만, POB 각주처럼 문화적 배경상 천막 생활을 암시할 수 있습니다. 본문은 원문의 단수와 비교 구조를 보존하고, 암시는 번역 안에서 과도하게 풀지 않았습니다.
  doctrine_reference: 본문-배경 구분 원칙
