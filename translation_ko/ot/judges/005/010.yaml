id: JDG.5.10
reference: Judges 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹכְבֵי֩ אֲתֹנ֨וֹת צְחֹר֜וֹת יֹשְׁבֵ֧י עַל מִדִּ֛ין וְ/הֹלְכֵ֥י עַל דֶּ֖רֶךְ שִֽׂיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
  footnotes:
  - marker: a
    text: Or 'sit on saddlecloths' or 'sit on carpets/rugs'; the Hebrew term is rare and uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'tell of it' / 'recount' for 'speak'; the Hebrew verb can carry the sense of speaking out or recounting.
    reason: lexical_alternative
translation:
  language: ko
  text: 흰 암나귀를 타는 이들이여, 깔개 위에 앉는 이들이여[a], 길을 걷는 이들이여, 말하시오![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안장 깔개’, ‘카펫’, 또는 ‘러그’로 옮길 수 있습니다. 이 히브리어 단어는 드물게 쓰여 뜻이 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 말하라’ 또는 ‘전하여 말하라’로 옮길 수 있습니다. 이 히브리어 동사는 말해 알리거나 전해 말하는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי אֲתֹנוֹת צְחֹרוֹת
  english_pob_choice: you who ride on white donkeys
  chosen_korean: 흰 암나귀를 타는 이들이여
  alternatives_korean:
  - 흰 나귀를 타는 이들이여
  - 흰 암나귀를 탄 사람들아
  lexicon: HALOT
  rationale: רֹכְבֵי는 호격처럼 부르는 분사구이고, אֲתֹנוֹת은 암나귀를 가리키므로 ‘타는 이들이여’와 ‘암나귀’로 살려 사회적 위상을 드러냈습니다.
- source_word: מִדִּין
  english_pob_choice: carpets
  chosen_korean: 무늬 있는 깔개
  alternatives_korean:
  - 안장 깔개
  - 깔개
  - 안장천
  lexicon: HALOT
  rationale: 희귀어라 확정이 어렵지만, 문맥상 앉는 물건을 가리키므로 ‘깔개’로 옮기되, 영어 주석의 불확실성을 반영해 ‘무늬 있는’으로 장식성을 살렸습니다.
- source_word: שִׂיחוּ
  english_pob_choice: speak
  chosen_korean: 말하시오
  alternatives_korean:
  - 말하라
  - 전하시오
  - 이야기하시오
  lexicon: HALOT
  rationale: 명령형 복수 שִׂיחוּ는 단순 발화만이 아니라 전하고 이야기하는 뜻도 있지만, 시적 소명문에서는 직접적인 ‘말하시오’가 가장 자연스럽습니다.
theological_decisions:
- issue: 시적 소명문의 직접 호칭과 명령 어조
  chosen_reading: 세 부류를 직접 부르며 마지막에 공적 발화를 명령하는 형식을 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 묘사형으로 바꾸는 읽기
  - ‘기억하라’처럼 의미를 좁히는 읽기
  rationale: 드보라의 승전가에서 화자는 특정 계층과 이동자들을 향해 공개적으로 응답을 요구하므로, 한국어에서도 호격과 명령형을 분명히 드러내는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 시적 본문 해석과 담화 기능
- issue: 마지막 동사의 의미 범위
  chosen_reading: ‘말하시오’로 두되, POB 영어 주석이 제시한 ‘tell of it/recount’의 가능성은 본문 맥락이 유지하도록 열어 두었습니다.
  alternative_readings:
  - 전하시오
  - 이야기하시오
  - 기억해 말하시오
  rationale: 이 구절은 야훼의 승리를 공적으로 선포하는 자리이므로, 단순 대화가 아니라 증언·전파의 뉘앙스가 있으나, 한국어 본문은 과도하게 해석을 고정하지 않는 것이 좋습니다.
  doctrine_reference: 본문 의미 범위 보존
