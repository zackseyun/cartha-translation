review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘마을의 삶이 사라졌습니다’는 난해한 פְרָזוֹן을 ‘마을 생활’로 이해한 선택으로 가능하며, חדל의 반복도 대체로 반영하려 합니다. 그러나 ‘그것이 사라지기까지’는 עַד의 범위를 잘못 연결하여, 마을 생활이 사라지는 시점까지 데보라가 일어났다는 뜻이 됩니다. 원문은 그 상태가 데보라가 일어날 때까지 계속되었다는 뜻입니다. 또한 אֵם בְּיִשְׂרָאֵל은 ‘이스라엘의 어머니’보다 ‘이스라엘 가운데 어머니’가 전치사 בְּ의 의미를 더 충실히 보존합니다.
  naturalness: 수정문은 한국어 시문으로 자연스럽게 읽히며, ‘그쳤습니다’의 반복과 ‘~때까지’의 병행을 통해 히브리어의 강조를 살립니다. ‘나 드보라가’는 노래의 자기 지시를 간결하게 보존하는 문학적 표현입니다.
  terminology: ‘드보라’는 통용되는 인명 표기입니다. ‘마을 생활’은 본문의 난해한 명사에 대한 절제된 번역이며, 대안은 각주에 유지합니다. ‘이스라엘 가운데 어머니’는 은유적 표현을 해설로 과도하게 만들지 않으면서 원문의 ‘in Israel’을 반영합니다.
  issues:
  - severity: high
    issue: ‘그것이 사라지기까지’의 시간 관계가 원문과 다릅니다.
    rationale: עַד שַׁקַּמְתִּי는 ‘내가 일어날 때까지’ 앞의 ‘그침’ 상태가 지속되었음을 나타냅니다. 초안은 ‘사라짐’ 자체를 시간 경계로 만들어 뜻을 바꿉니다.
  - severity: medium
    issue: ‘이스라엘의 어머니’가 בְּיִשְׂרָאֵל의 전치사 의미를 약화합니다.
    rationale: 원문은 ‘이스라엘의 어머니’(mother of Israel)가 아니라 ‘이스라엘 가운데 어머니’(a mother in Israel)라고 합니다. 한국어에서 ‘가운데’를 사용하면 자연스러우면서도 이 차이를 보존할 수 있습니다.
  revised_text: 이스라엘에서 마을 생활이 그쳤습니다. 나 드보라가 일어날 때까지, 내가 이스라엘 가운데 어머니로 일어날 때까지 그쳤습니다.[a]
