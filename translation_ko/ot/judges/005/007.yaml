  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
  footnotes:
  - marker: a
    text: Or 'the villagers ceased in Israel,' or 'the rural population ceased in Israel.' The Hebrew noun is difficult and may refer to village dwellers or to village life more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘에서 마을의 삶이 사라졌습니다. 그것이 사라지기까지 저는, 드보라가 일어났습니다—이스라엘의 어머니로 일어날 때까지 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘에서 마을 사람들이 사라졌습니다’ 혹은 ‘이스라엘에서 농촌 인구가 사라졌습니다’. 히브리어 명사는 뜻이 어려우며, 마을에 사는 사람들 또는 더 넓게는 마을 생활 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ פְרָזוֹן
  english_pob_choice: Village life ceased
  chosen_korean: 마을의 삶이 사라졌습니다
  alternatives_korean:
  - 마을 사람들이 사라졌습니다
  - 시골 생활이 중단되었습니다
  - 마을이 끊어졌습니다
  lexicon: HALOT
  rationale: 프라존은 단순한 지리적 ‘마을’보다 마을 공동체의 삶과 농촌적 일상을 가리킬 수 있어, 한국어에서는 사회적 붕괴의 뉘앙스를 살리는 ‘마을의 삶’이 가장 자연스럽고 원문에 가깝습니다.
- source_word: חָדֵלּוּ
  english_pob_choice: it ceased
  chosen_korean: 사라졌습니다
  alternatives_korean:
  - 그쳤습니다
  - 멈췄습니다
  - 끊어졌습니다
  lexicon: HALOT
  rationale: 반복되는 חדל의 종결감을 살리면서도, 시의 맥락상 단순 정지보다 공동체적 상실을 드러내는 표현으로 옮겼습니다.
- source_word: עַד שַׁקַּמְתִּי
  english_pob_choice: until I arose
  chosen_korean: 그것이 사라지기까지 저는…일어났습니다
  alternatives_korean:
  - 제가 일어날 때까지
  - 제가 일어나기 전까지
  - 제가 일어나기까지
  lexicon: HALOT
  rationale: עַד의 시간 경계와 קום의 시적 ‘일어나다’를 함께 살리기 위해 ‘-기까지’ 구조를 유지했습니다.
- source_word: אֵם בְּיִשְׂרָאֵל
  english_pob_choice: as a mother in Israel
  chosen_korean: 이스라엘의 어머니로
  alternatives_korean:
  - 이스라엘 안의 어머니로
  - 이스라엘의 어머니로서
  - 이스라엘의 어머니
  lexicon: HALOT
  rationale: 히브리어의 ‘in Israel’을 유지하면서도, 데보라의 보호자·지도자 역할을 드러내는 비유적 용법을 한국어 조사 ‘-로’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 데보라의 자기 묘사 אֵם בְּיִשְׂרָאֵל의 의미
  chosen_reading: 데보라는 자신이 이스라엘의 ‘어머니로’ 일어났다고 말하며, 이는 혈연적 모성이 아니라 보호하고 이끄는 지도성을 비유적으로 표현합니다.
  alternative_readings:
  - 이스라엘의 어머니라는 직함으로 보는 읽기
  - 문자적으로만 어머니 역할로 제한하는 읽기
  rationale: 원문의 전치사 ‘בְּ’는 ‘of’가 아니라 ‘in’이므로, 호칭을 과도하게 확장하지 않으면서도 은유적 권위를 살리는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4, 5
