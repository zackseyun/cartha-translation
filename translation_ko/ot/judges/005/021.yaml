  naturalness: 기존의 ‘그 옛 강, 기손 강입니다’는 본문의 시적 동격 반복을 한국어 서술문으로 과도하게 풀어 다소 부자연스럽습니다. 동격구를 유지한 ‘옛 급류, 기손의 급류’가 더 자연스럽고 시적인 한국어입니다. ‘내 영혼아, 힘차게 나아가십시오’는 요청된 현대 합쇼체를 일관되게 따릅니다.
