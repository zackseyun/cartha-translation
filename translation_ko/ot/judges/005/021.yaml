id: JDG.5.21
reference: Judges 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַ֤חַל קִישׁוֹן֙ גְּרָפָ֔/ם נַ֥חַל קְדוּמִ֖ים נַ֣חַל קִישׁ֑וֹן תִּדְרְכִ֥י נַפְשִׁ֖/י עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
  footnotes:
  - marker: a
    text: Or 'the torrent of old' or 'the primeval torrent' for 'the ancient torrent.' The Hebrew קְדוּמִים can carry the sense of antiquity, and some hear an intensified poetic description rather than a simple chronological label.
    reason: lexical_alternative
  - marker: b
    text: Or 'Tread on, my soul, in strength' or 'Trample, my soul, with might.' The Hebrew is terse and poetic, and the verb can suggest treading or trampling as well as marching.
    reason: lexical_alternative
translation:
  language: ko
  text: 기손 강물이 그들을 쓸어가 버렸습니다— 그 옛 강, 기손 강입니다. 내 영혼아, 힘으로 나아가십시오![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛 강’ 또는 ‘태고의 강’으로도 옮길 수 있습니다. 히브리어 קְדוּמִים은 단순한 시간적 ‘옛날’뿐 아니라 시적 강조를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 영혼아, 힘으로 디디며 나아가십시오’ 또는 ‘내 영혼아, 힘차게 밟으십시오’로도 옮길 수 있습니다. 히브리어 동사는 디디다/밟다의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל קִישׁוֹן
  english_pob_choice: the torrent of Kishon
  chosen_korean: 기손 강물
  alternatives_korean:
  - 기손 시내
  - 기손 개울
  - 기손 강
  lexicon: HALOT
  rationale: נַחַל은 이 전투 시의 홍수 같은 힘을 살려 ‘강물’로 풀었고, 고유명사 קִישׁוֹן은 음역하여 자연스러운 한국어 시어로 만들었습니다.
- source_word: גְּרָפָם
  english_pob_choice: swept them away
  chosen_korean: 그들을 쓸어가 버렸습니다
  alternatives_korean:
  - 그들을 휩쓸어 갔습니다
  - 그들을 물어갔습니다
  - 그들을 쓸어갔습니다
  lexicon: HALOT
  rationale: גרף의 ‘쓸어가다/씻어내다’ 이미지를 살리되, 한국어에서 유려하고 폭력적인 수몰 장면을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: נַחַל קְדוּמִים
  english_pob_choice: the ancient torrent
  chosen_korean: 그 옛 강
  alternatives_korean:
  - 옛 강
  - 태고의 강
  - 옛날 강
  lexicon: HALOT
  rationale: קְדוּמִים의 고대성·옛됨을 직역적으로만 굳히지 않고, 시적 병치에 맞게 ‘그 옛 강’으로 압축해 반복과 운율을 살렸습니다.
- source_word: תִּדְרְכִי נַפְשִׁי עֹז
  english_pob_choice: March on, my soul, with strength!
  chosen_korean: 내 영혼아, 힘으로 나아가십시오!
  alternatives_korean:
  - 내 영혼아, 힘차게 밟으십시오!
  - 내 영혼아, 힘으로 걸으십시오!
  - 내 영혼아, 힘 있게 나아가십시오!
  lexicon: HALOT
  rationale: דרך의 ‘디디다/나아가다’의 폭을 살리면서도, 한국어 시적 명령으로는 ‘나아가십시오’가 가장 자연스러워 직접적 호소를 유지했습니다.
theological_decisions:
- issue: 화자 자신의 영혼에 대한 직접 호소의 존대 수준
  chosen_reading: ‘내 영혼아’로 부르면서 명령형은 ‘나아가십시오’의 합쇼체를 사용했습니다.
  alternative_readings:
  - 내 영혼아, 나아가라
  - 내 영혼아, 나아가십시오
  rationale: 히브리 시의 자기호출을 현대 한국어 공예배/독서체에 맞추되, 시적 긴장을 유지하기 위해 호칭은 친밀하게, 명령은 격식 있게 처리했습니다.
  doctrine_reference: 시적 자기호소의 문체 재현
