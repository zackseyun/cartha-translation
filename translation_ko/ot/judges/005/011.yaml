revisions:
- from: 화살 쏘는 자들의 소리와 물 길어 오는 곳들 사이에서, 그곳에서 그들은 야훼의 의로운 행위들, 곧 이스라엘의 그의 마을 사람들에 대한 의로운 행위들을 전합니다. 그때 야훼의 백성이 성문들로 내려갔습니다.[a][b][c]
  to: 물 긷는 곳들 사이에서 궁수들의 소리가 들리는 곳에서[a], 그들은 거기에서 야훼의 의로운 일들, 곧 이스라엘에서 그분의 마을 주민들을 위하여 행하신 의로운 일들을 되풀이하여 말합니다.[b] 그때 야훼의 백성이 성문들로 내려갔습니다.[c]
  rationale: 첫 구절은 본질적으로 난해하므로 한 가지 해석을 본문에서 지나치게 단정하지 않도록, 물 긷는 장소와 궁수들의 소리가 관련된 장소라는 최소한의 문맥적 한국어로 옮기고 대안들을 각주에 명시했습니다. 두 번째 ‘의로운 일들’은 히브리어의 반복을 보존하면서도 פִּרְזֹנוֹ의 문맥상 수혜 관계를 한국어로 분명히 했습니다. 모든 각주 표지는 설명 대상 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
