id: JDG.5.11
reference: Judges 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
  footnotes:
  - marker: a
    text: Or 'At the sound of archers by the watering places.' The opening phrase is difficult, and some understand it as describing the place where the song is heard rather than separation from the sound.
    reason: alternative_reading
  - marker: b
    text: The Hebrew term rendered 'villagers' is difficult and has also been understood as 'unwalled settlements,' 'rural folk,' or, less likely, 'rulers.'
    reason: lexical_alternative
  - marker: c
    text: The 'gates' were the public gathering places of a town, associated with civic life, judgment, and security.
    reason: cultural_note
translation:
  language: ko
  text: 물 긷는 곳들 사이에서 궁수들의 소리가 들리는 곳에서[a], 그들은 거기에서 야훼의 의로운 일들, 곧 이스라엘에서 그분의 마을 주민들을 위하여 행하신 의로운 일들을 되풀이하여 말합니다.[b] 그때 야훼의 백성이 성문들로 내려갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘궁수들의 소리로부터, 물 긷는 곳들 사이에서’입니다. 이 시적 첫 구절은 해석이 어렵습니다. 일부는 궁수들의 소리에서 벗어난 곳을 뜻한다고 보며, 일부는 물 긷는 곳들에서 들리는 소리 또는 그곳에서 노래가 들리는 상황을 가리킨다고 봅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 פִּרְזֹנוֹ는 뜻이 어려운 낱말입니다. 여기서는 야훼께서 이스라엘의 마을 주민들을 위하여 행하신 일이라는 문맥으로 옮겼습니다. 이 낱말은 ‘마을 주민들’, ‘시골 사람들’, ‘성벽 없는 정착지들’, 드물게는 ‘통치자들’로도 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: ‘성문들’은 고대 도시에서 공적 모임, 재판, 방어와 관련된 장소였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַֽצְצִים
  english_pob_choice: From the sound of archers
  chosen_korean: 화살 쏘는 자들의 소리
  alternatives_korean:
  - 궁수들의 소리
  - 쏘는 자들의 소리
  lexicon: HALOT
  rationale: 문맥상 전투 장면의 ‘archers’를 가리키므로, 한국어에서는 자연스럽게 ‘화살 쏘는 자들’로 옮겨 소리의 주체를 드러냈습니다.
- source_word: בֵּין מַשְׁאַבִּים
  english_pob_choice: among the watering places
  chosen_korean: 물 길어 오는 곳들 사이에서
  alternatives_korean:
  - 물 긷는 곳들 가운데
  - 우물들 사이에서
  lexicon: HALOT
  rationale: מַשְׁאַבִּים은 물을 길어 오는 장소들을 가리키므로, 시적 표현을 살리면서도 의미를 분명히 하기 위해 ‘물 길어 오는 곳들’로 번역했습니다.
- source_word: צִדְקֹת יְהוָה
  english_pob_choice: the righteous acts of Yahweh
  chosen_korean: 야훼의 의로운 행위들
  alternatives_korean:
  - 야훼의 의로운 일들
  - 야훼의 구원의 행위들
  lexicon: HALOT
  rationale: צִדְקוֹת은 단순한 추상적 ‘의’보다 실제로 드러난 행위들을 가리키므로, 문맥의 승리 찬양을 살리되 어휘적으로는 ‘의로운 행위들’이 가장 직접적입니다.
- source_word: צִדְקֹת פִּרְזֹנֹו
  english_pob_choice: the righteous acts of his villagers
  chosen_korean: 이스라엘의 그의 마을 사람들에 대한 의로운 행위들
  alternatives_korean:
  - 이스라엘의 그의 시골 사람들에 대한 의로운 행위들
  - 이스라엘의 그의 울타리 없는 정착지들에 대한 의로운 행위들
  lexicon: HALOT
  rationale: פִּרְזֹנוֹ는 뜻이 어려워 영어 POB처럼 ‘villagers’ 계열을 따라가되, 한국어에서는 직역보다 의미를 드러내는 ‘마을 사람들’로 두고, 소유격·대상 관계는 문맥에 따라 풀어썼습니다.
- source_word: לַשְּׁעָרִים
  english_pob_choice: to the gates
  chosen_korean: 성문들로
  alternatives_korean:
  - 성문으로
  - 성문들로
  lexicon: HALOT
  rationale: ‘gates’는 고대 이스라엘의 공적 모임·재판 장소를 뜻하므로, 한국어에서는 기능을 드러내는 ‘성문들’이 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 여호와 대체어가 아니라 하나님의 고유 이름 יְהוָה를 직접 사용하므로, 본문의 이름성을 보존하기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: צִדְקוֹת의 의미 범위
  chosen_reading: 의로운 행위들
  alternative_readings:
  - 구원의 행위들
  - 승리들
  rationale: 이 시적 맥락에는 구원과 승리의 함의가 있지만, 번역은 그 해석을 앞서기보다 원어가 직접 가리키는 ‘의로운 행위들’을 유지하는 것이 더 투명합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
