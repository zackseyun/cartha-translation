  lexicon: HALOT
  rationale: 히브리어의 구체적 신체어를 자연스러운 한국어로 살리되, 뒤의 ‘오른손’과 평행을 이루도록 간결하게 옮겼습니다.
- source_word: לַיָּתֵד
  english_pob_choice: for the tent peg
  chosen_korean: 텐트 말뚝으로
