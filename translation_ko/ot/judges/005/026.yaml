source:
  edition: WLC
  text: יָדָ/הּ֙ לַ/יָּתֵ֣ד תִּשְׁלַ֔חְנָה וִֽ/ימִינָ֖/הּ לְ/הַלְמ֣וּת עֲמֵלִ֑ים וְ/הָלְמָ֤ה סִֽיסְרָא֙ מָחֲקָ֣ה רֹאשׁ֔/וֹ וּ/מָחֲצָ֥ה וְ/חָלְפָ֖ה רַקָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
  footnotes:
  - marker: a
    text: Or 'for the hammer of laborers' / 'for a workmen’s mallet.' The Hebrew expression לְהַלְמוּת עֲמֵלִים is somewhat uncommon, and the exact nuance of the striking tool may be rendered in more than one way.
    reason: lexical_alternative
  - marker: b
    text: Or 'she crushed his head' instead of 'she shattered his head.' The Hebrew uses a sequence of forceful verbs to heighten the violence poetically.
    reason: lexical_alternative
  - marker: c
    text: Or 'she transfixed his temple' / 'she passed through his temple.' The final verb likely conveys piercing through.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 손을 텐트 말뚝으로 뻗고, 오른손을 일하는 사람들의 망치로 뻗었습니다. 그러고는 시스라를 쳐서 그의 머리를 산산이 부수고, 그의 관자놀이를 꿰뚫었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 도구 표현은 다소 드물어서, ‘일하는 사람들의 망치’와 같이 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 머리를 산산이 부수고’ 대신 ‘그의 머리를 부수고’로 옮길 수도 있습니다. 히브리어는 힘센 동사들을 연속으로 써서 폭력을 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 관자놀이를 꿰뚫었습니다’는 ‘관자놀이를 관통했습니다’ 또는 ‘관자놀이를 찔렀습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ
  english_pob_choice: her hand
  chosen_korean: 그녀는 손을
  alternatives_korean:
  - 그녀의 손을
  - 손을
  lexicon: HALOT
  rationale: 히브리어의 구체적 신체어를 자연스러운 한국어로 살리되, 뒤의 ‘오른손’과 평행을 이루도록 간결하게 옮겼습니다.
- source_word: לַיָּתֵד
  english_pob_choice: for the tent peg
  chosen_korean: 텐트 말뚝으로
  alternatives_korean:
  - 텐트 못으로
  - 말뚝으로
  lexicon: HALOT
  rationale: 문맥상 야엘의 천막 도구이므로 ‘텐트 말뚝’이 대상을 가장 분명하게 드러냅니다.
- source_word: לְהַלְמוּת עֲמֵלִים
  english_pob_choice: for the workmen’s hammer
  chosen_korean: 일하는 사람들의 망치로
  alternatives_korean:
  - 일꾼들의 망치로
  - 노동자들의 망치로
  lexicon: HALOT
  rationale: 낯선 히브리어 표현의 도구성을 살리면서도, 한국어에서는 속격보다 ‘~들의 망치’가 더 자연스럽고 원문의 다중 의미를 과도하게 좁히지 않습니다.
- source_word: מָחֲקָה רֹאשׁוֹ
  english_pob_choice: she shattered his head
  chosen_korean: 그의 머리를 산산이 부수고
  alternatives_korean:
  - 그의 머리를 부수고
  - 그의 머리를 산산조각 내고
  lexicon: HALOT
  rationale: 연속된 강한 동사들의 폭력성을 한국어의 관용적 강세로 살리면서, ‘shattered’의 파괴감을 유지했습니다.
- source_word: וְחָלְפָה רַקָּתוֹ
  english_pob_choice: she pierced his temple
  chosen_korean: 그의 관자놀이를 꿰뚫었습니다
  alternatives_korean:
  - 그의 관자놀이를 찔렀습니다
  - 그의 관자놀이를 관통했습니다
  lexicon: HALOT
  rationale: 마지막 동사는 통과/관통의 뉘앙스를 가지므로, 살상 장면의 결과를 분명히 하는 ‘꿰뚫었습니다’가 적절합니다.
theological_decisions:
- issue: 시스라에게 가해진 폭력의 연속 동사들
  chosen_reading: 히브리어의 동사 연쇄를 순화하지 않고 폭력의 강도를 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 줄여 ‘쳐서 죽였습니다’로 옮김
  - 각 동사를 약화시켜 일반적 타격으로 처리
  rationale: 본문은 시적 과장 속에서 매우 구체적이고 강한 폭력을 누적하여 묘사하므로, 의미를 완화하지 않는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 원문 서사와 시적 수사 존중
- issue: ‘관자놀이’의 해부학적 명시
  chosen_reading: רַקָּה를 ‘관자놀이’로 옮겨 상처 부위의 정확성을 유지했습니다.
  alternative_readings:
  - ‘머리 옆’으로 일반화
  - ‘옆머리’로 완화
  rationale: 시스라의 최종 치명상을 가리키는 신체 부위를 분명하게 해야 하므로, 전통적이면서도 정확한 해부학 용어를 사용했습니다.
  doctrine_reference: 본문의 구체성 보존
