base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
  footnotes:
  - marker: a
    text: Or 'for the hammer of laborers' / 'for a workmen’s mallet.' The Hebrew expression לְהַלְמוּת עֲמֵלִים is somewhat uncommon, and the exact nuance of the striking tool may be rendered in more than one way.
    reason: lexical_alternative
  - marker: b
    text: Or 'she crushed his head' instead of 'she shattered his head.' The Hebrew uses a sequence of forceful verbs to heighten the violence poetically.
    reason: lexical_alternative
  - marker: c
    text: Or 'she transfixed his temple' / 'she passed through his temple.' The final verb likely conveys piercing through.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 텐트 말뚝을 향해 손을 뻗고, 일꾼들의 망치를 향해 오른손을 뻗었습니다. 그러고는 시스라를 쳤고, 그의 머리를 산산이 부수었으며, 그의 관자놀이를 짓찧어 꿰뚫었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일꾼들의 망치’는 ‘일꾼들의 쇠망치’ 또는 ‘일꾼들의 망치’로도 옮길 수 있습니다. 히브리어의 이 도구 표현은 다소 드물며, 정확한 도구의 뉘앙스에는 여러 번역 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 머리를 산산이 부수었으며’는 ‘그의 머리를 으스러뜨렸으며’로도 옮길 수 있습니다. 히브리어는 힘센 동사들을 연속으로 사용하여 폭력성을 시적으로 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 관자놀이를 짓찧어 꿰뚫었습니다’는 ‘그의 관자놀이를 부수고 관통했습니다’ 또는 ‘그의 관자놀이를 꿰찔렀습니다’로도 옮길 수 있습니다. 마지막 동사는 관통하거나 지나감을 나타낼 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ
  english_pob_choice: her hand
  chosen_korean: 그녀는 손을
  alternatives_korean:
