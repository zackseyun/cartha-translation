  rationale: 문맥상 야엘의 천막 도구이므로 ‘텐트 말뚝’이 대상을 가장 분명하게 드러냅니다.
- source_word: לְהַלְמוּת עֲמֵלִים
  english_pob_choice: for the workmen’s hammer
  chosen_korean: 일하는 사람들의 망치로
  alternatives_korean:
  - 일꾼들의 망치로
  - 노동자들의 망치로
  lexicon: HALOT
  rationale: 낯선 히브리어 표현의 도구성을 살리면서도, 한국어에서는 속격보다 ‘~들의 망치’가 더 자연스럽고 원문의 다중 의미를 과도하게 좁히지 않습니다.
- source_word: מָחֲקָה רֹאשׁוֹ
  english_pob_choice: she shattered his head
  chosen_korean: 그의 머리를 산산이 부수고
  alternatives_korean:
  - 그의 머리를 부수고
  - 그의 머리를 산산조각 내고
  lexicon: HALOT
  rationale: 연속된 강한 동사들의 폭력성을 한국어의 관용적 강세로 살리면서, ‘shattered’의 파괴감을 유지했습니다.
- source_word: וְחָלְפָה רַקָּתוֹ
  english_pob_choice: she pierced his temple
  chosen_korean: 그의 관자놀이를 꿰뚫었습니다
  alternatives_korean:
  - 그의 관자놀이를 찔렀습니다
  - 그의 관자놀이를 관통했습니다
  lexicon: HALOT
  rationale: 마지막 동사는 통과/관통의 뉘앙스를 가지므로, 살상 장면의 결과를 분명히 하는 ‘꿰뚫었습니다’가 적절합니다.
theological_decisions:
- issue: 시스라에게 가해진 폭력의 연속 동사들
  chosen_reading: 히브리어의 동사 연쇄를 순화하지 않고 폭력의 강도를 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 줄여 ‘쳐서 죽였습니다’로 옮김
  - 각 동사를 약화시켜 일반적 타격으로 처리
  rationale: 본문은 시적 과장 속에서 매우 구체적이고 강한 폭력을 누적하여 묘사하므로, 의미를 완화하지 않는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 원문 서사와 시적 수사 존중
- issue: ‘관자놀이’의 해부학적 명시
  chosen_reading: רַקָּה를 ‘관자놀이’로 옮겨 상처 부위의 정확성을 유지했습니다.
  alternative_readings:
  - ‘머리 옆’으로 일반화
  - ‘옆머리’로 완화
  rationale: 시스라의 최종 치명상을 가리키는 신체 부위를 분명하게 해야 하므로, 전통적이면서도 정확한 해부학 용어를 사용했습니다.
  doctrine_reference: 본문의 구체성 보존
