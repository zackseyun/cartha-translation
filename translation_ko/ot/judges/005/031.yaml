revisions:
- from: 그와 같이 주님이시여, 당신의 모든 원수는 멸망하게 하소서. 그러나 당신을 사랑하는 이들은 해가 그 힘으로 떠오를 때와 같게 하소서. 그리고 그 땅은 사십 년 동안 평안을 누렸습니다.
  to: 야훼여, 당신의 모든 원수들이 이처럼 멸망하게 하소서. 그러나 그를 사랑하는 이들은 해가 힘을 다하여 떠오를 때처럼 되게 하소서. 그리고 그 땅은 사십 년 동안 평온을 누렸습니다.
  rationale: 신명을 칭호로 치환하지 않고 ‘야훼여’로 바로 옮겼으며, ‘그를 사랑하는 이들’로 히브리어의 2인칭 호격과 3인칭 지시의 전환을 보존했습니다. כֵּן의 결구적 기원 기능, 해가 강력하게 떠오르는 비유, 그리고 전쟁 후 평화라는 사사기의 종결 공식을 자연스러운 현대 합쇼체로 반영했습니다. 영어 감사본의 각주 표지는 해당 영어 문장 안에서 서로 어긋나 있으나, 한국어 본문에는 각주 표지가 없고 번역상 별도 각주가 반드시 필요하지 않으므로 각주를 추가하지 않았습니다.
