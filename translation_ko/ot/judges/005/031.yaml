  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּ֠ן יֹאבְד֤וּ כָל אוֹיְבֶ֨י/ךָ֙ יְהוָ֔ה וְ/אֹ֣הֲבָ֔י/ו כְּ/צֵ֥את הַ/שֶּׁ֖מֶשׁ בִּ/גְבֻרָת֑/וֹ וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
  footnotes:
  - marker: a
    text: Or, more literally, 'those who love him [are] like the going forth of the sun in its might.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the land was quiet'; the expression in Judges commonly denotes a period of peace or rest after conflict.
    reason: cross_reference
translation:
  language: ko
  text: 그와 같이 주님이시여, 당신의 모든 원수는 멸망하게 하소서. 그러나 당신을 사랑하는 이들은 해가 그 힘으로 떠오를 때와 같게 하소서. 그리고 그 땅은 사십 년 동안 평안을 누렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹאבְדוּ
  english_pob_choice: perish
  chosen_korean: 멸망하게 하소서
  alternatives_korean:
  - 사라지게 하소서
  - 망하게 하소서
  lexicon: HALOT
  rationale: 미완료형의 기원/저주적 용법을 한국어 청유·간구형으로 살리면서, 단순한 죽음보다 강한 소멸의 뉘앙스를 보존했습니다.
- source_word: כָל אוֹיְבֶיךָ
  english_pob_choice: all your enemies
  chosen_korean: 당신의 모든 원수는
  alternatives_korean:
  - 당신의 모든 적은
  - 당신의 원수 모두는
  lexicon: HALOT
  rationale: 히브리어 소유접미사와 총칭을 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님이시여
  alternatives_korean:
  - 야훼여
  - 주님
  lexicon: HALOT
  rationale: 본문은 야훼를 가리키지만, 이 절의 직접 호칭은 한국어 예배체에서 자연스러운 '주님이시여'로 처리해 호격을 살렸습니다.
- source_word: וְאֹהֲבָיו
  english_pob_choice: but those who love him
  chosen_korean: 그러나 당신을 사랑하는 이들은
  alternatives_korean:
  - 그리고 그를 사랑하는 이들은
  - 그러나 그를 사랑하는 이들은
  lexicon: HALOT
  rationale: 접속사 וְ의 대비 관계를 '그러나'로 드러내고, 3인칭 접미사의 지시 대상은 앞선 야훼로 이해하여 2인칭 호칭과 문맥상 자연스럽게 맞췄습니다.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ
  english_pob_choice: be like the rising of the sun in its strength
  chosen_korean: 해가 그 힘으로 떠오를 때와 같게 하소서
  alternatives_korean:
  - 해가 그 강함 속에서 떠오를 때와 같게 하소서
  - 해가 그 위력으로 떠오를 때와 같게 하소서
  lexicon: HALOT
  rationale: '''ה태양의 나감/떠오름''은 자연스러운 한국어로 ''해가 떠오를 때''로 옮기고, בִּגְבֻרָתוֹ의 힘·위력 이미지는 ''그 힘으로''로 압축해 보존했습니다.'
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  english_pob_choice: And the land had rest
  chosen_korean: 그리고 그 땅은 … 평안을 누렸습니다
  alternatives_korean:
  - 그리고 그 땅은 쉬었습니다
  - 그리고 그 땅은 잠잠했습니다
  lexicon: HALOT
  rationale: 사사기 반복 공식의 종결을 단순한 정적보다 전쟁 종식 후의 평화 상태로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 야훼의 호칭을 직접 부를 때의 한국어 처리
  chosen_reading: 본문의 יְהוָה는 의미상 야훼이지만, 한국어 시적 호격에서는 '주님이시여'로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 야훼여
  - 주님
  rationale: 찬가/축복의 결구에서 직접 호격은 한국어 예배어법상 '주님이시여'가 가장 자연스럽고, 본문 의미를 훼손하지 않으면서 화행을 보존합니다.
  doctrine_reference: 'POB Korean style: divine address and vocative naturalization'
- issue: 지시대명사와 호격의 인칭 전환
  chosen_reading: '''당신을 사랑하는 이들''은 앞선 주님을 가리키는 3인칭 접미사를 한국어 문맥에서 2인칭 호칭과 연결해 읽었습니다.'
  alternative_readings:
  - 그를 사랑하는 이들
  - 주님을 사랑하는 이들
  rationale: 히브리어는 직접 호격('주님이시여')과 3인칭 소유접미사('그를')를 함께 쓰지만, 한국어는 이 전환을 그대로 유지하면 어색해지므로 문맥상 동일 지시자를 살려 자연스럽게 조정했습니다.
  doctrine_reference: Hebrew discourse deixis in worship poetry
