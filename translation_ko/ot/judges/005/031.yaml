  source_fidelity: 수정이 필요합니다. יְהוָה는 POB의 확정 방침 및 영어 감사본에 따라 고유한 신명인 ‘야훼’로 옮겨야 하며, וְאֹהֲבָיו의 3인칭 접미사는 호격과의 인칭 전환을 보존하여 ‘그를 사랑하는 이들’로 번역하는 것이 원문에 더 충실합니다. ‘그와 같이’는 כֵּן의 결구적 기원 용법을 한국어에서 자연스럽게 드러내지 못하므로 ‘이처럼’과 기원문 구조로 정리했습니다.
  naturalness: ‘야훼여, 당신의 모든 원수들이 이처럼 멸망하게 하소서’는 시적 기원문으로 자연스럽고 현대 한국어 합쇼체에 맞습니다. 해의 비유는 ‘힘을 다하여 떠오를 때처럼’으로 하여 בִּגְבֻרָתוֹ의 힘·위력의 이미지를 자연스럽게 전달했습니다. 사사기의 평화 공식은 ‘평온을 누렸습니다’로 유지했습니다.
  terminology: ‘야훼’는 יְהוָה의 고유명 번역을 보존합니다. ‘원수’, ‘멸망’, ‘평온’은 문맥 및 사사기의 관용적 종결에 적절합니다. 원문이 직접 호격 후 3인칭으로 전환하는 점을 ‘당신’/‘그’의 전환으로 보존했습니다.
