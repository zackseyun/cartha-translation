    text: 또는 ‘그의 힘센 말들이 달음질하고 또 달음질한 탓이었습니다’ 또는 ‘그의 용사들이 달음질하고 또 달음질한 탓이었습니다.’ 히브리어 표현은 힘센 말들을 가리킬 수도 있고, 그 말들과 관련된 전사들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
