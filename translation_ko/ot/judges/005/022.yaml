  rationale: The revision retains the poetic repetition of the Hebrew galloping expression without inserting ‘sound’ as its lexical content, improves Korean syntax, and preserves the referential ambiguity of אַבִּירָיו. The footnote records the principal contextual alternatives without choosing either one.
