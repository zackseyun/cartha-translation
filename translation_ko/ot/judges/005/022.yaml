  text: אָ֥ז הָלְמ֖וּ עִקְּבֵי ס֑וּס מִֽ/דַּהֲר֖וֹת דַּהֲר֥וֹת אַבִּירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
  footnotes:
  - marker: a
    text: Or 'the galloping of his stallions' or 'the galloping of his mighty warriors.' The Hebrew expression may refer to powerful horses or to the warriors associated with them.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 말발굽이 달음질 소리 때문에 쿵쿵 울렸습니다 — 그의 힘센 자들의 달음질 소리 때문이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 시간적 전환을 자연스럽게 살리면서 시적 문맥에 맞는 간결한 한국어로 옮겼습니다.
- source_word: הָלְמוּ
  english_pob_choice: pounded
  chosen_korean: 쿵쿵 울렸습니다
  alternatives_korean:
  - 두드렸습니다
  - 쾅쾅 쳤습니다
  - 울렸습니다
  lexicon: HALOT
  rationale: 말발굽의 강한 충돌감과 소리의 울림을 함께 드러내기 위해, 단순한 ‘쳤습니다’보다 청각적 뉘앙스가 강한 표현을 택했습니다.
- source_word: עִקְּבֵי סוּס
  english_pob_choice: the horses’ hoofs
  chosen_korean: 말발굽
  alternatives_korean:
  - 말의 발굽
  - 말굽
  lexicon: HALOT
  rationale: 문맥상 말의 뒤쪽 발굽을 가리키므로, 한국어에서는 자연스러운 합성어 ‘말발굽’으로 옮겼습니다.
- source_word: מִדַּהֲרוֹת דַּהֲר֥וֹת
  english_pob_choice: from the galloping, the galloping
  chosen_korean: 달음질 소리 때문에 … 달음질 소리
  alternatives_korean:
  - 질주 때문에 … 질주
  - 달리는 소리 때문에 … 달리는 소리
  lexicon: HALOT
  rationale: 겹쳐진 어근의 반복을 한국어에서도 반복으로 살리되, 소리와 원인을 함께 드러내기 위해 ‘달음질 소리’로 옮겼습니다.
- source_word: אַבִּירָיו
  english_pob_choice: his mighty ones / his mighty steeds
  chosen_korean: 그의 힘센 자들
  alternatives_korean:
  - 그의 힘센 말들
  - 그의 용사들
  - 그의 준마들
  lexicon: HALOT
  rationale: 히브리어는 전사/말 둘 다를 암시할 수 있는 시적 모호성을 지니므로, 한쪽으로 단정하지 않고 인칭 소유와 강함의 뜻을 살린 중립 표현을 택했습니다.
theological_decisions:
- issue: אַבִּירָיו의 지시 대상 모호성
  chosen_reading: ‘그의 힘센 자들’로 두어 말과 전사의 가능성을 열어 둠
  alternative_readings:
  - ‘그의 힘센 말들’로 구체화
  - ‘그의 용사들’로 구체화
  rationale: 본문은 시적 압축을 통해 적군의 위세를 묘사하며, 원문이 허용하는 양가성을 한국어에서도 보존하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve ambiguity and textual tension rather than over-resolving it.'
