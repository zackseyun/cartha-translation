  source_fidelity: ‘한 태, 두 태’는 רַחַם רַחֲמָתַיִם(‘한 자궁, 두 자궁’)의 직역으로 보기 어렵습니다. 현대 한국어의 ‘태’는 주로 태아 또는 태반을 뜻하므로, 원문의 신체적·대상화적 표현을 다른 뜻으로 바꿉니다. 또한 לְצַוְּארֵי שָׁלָל은 난해하지만, ‘노획물의 목들’은 한국어에서 의미 관계가 지나치게 불명확합니다. 본문에서는 노획된 사람들의 목이라는 가능한 의미를 제시하고 주석에서 원문의 난점과 대안을 밝혀야 합니다.
  naturalness: 수정안은 현대 표준어 합쇼체의 수사 의문과 시적 열거를 유지합니다. ‘자궁’은 의도적으로 거칠고 불편한 직역이며, 본문이 묘사하는 비인간화를 완곡하게 바꾸지 않습니다. 직물 열거는 히브리어의 반복과 이중 표현을 보존하면서도 한국어 문장으로 읽히도록 최소한으로 정리했습니다.
  terminology: שָׁלָל은 ‘노획물’, צְבָעִים은 ‘염색한 옷감’, רִקְמָה는 ‘수놓은 천’으로 일관되게 옮겼습니다. 시스라(סִיסְרָא)는 통용 표기를 유지했습니다. ‘남자 한 사람마다’는 לְרֹאשׁ גֶּבֶר의 분배적 용법을 자연스럽게 반영합니다.
