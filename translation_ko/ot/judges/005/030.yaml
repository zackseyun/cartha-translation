id: JDG.5.30
reference: Judges 5:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
  footnotes:
  - marker: a
    text: Hebrew literally, “a womb, two wombs,” a harsh metonymy for women taken as sexual spoil.
    reason: lexical_alternative
  - marker: b
    text: Or “for the necks of the captives / those taken as spoil.” The Hebrew of the final phrase is difficult and may refer to embroidered cloths worn by captive women.
    reason: alternative_reading
translation:
  language: ko
  text: “그들이 노획물을 찾아 나누고 있지 않겠습니까? 남자 한 사람마다 한 자궁, 두 자궁을 주고, 시스라에게는 염색한 옷감의 노획물, 염색한 옷감의 노획물, 수놓은 천, 두 겹으로 수놓은 염색 옷감을—노획된 자들의 목에.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “한 자궁, 두 자궁”입니다. 이는 포로 여성을 성적 전리품처럼 취급하는 거친 환유입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 마지막 구절은 매우 난해합니다. 문자적으로는 “노획물의 목들을 위하여”이며, “포로들의 목을 위하여” 또는 포로 여성의 목에 걸칠 수놓은 옷감을 가리킨다는 이해가 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  english_pob_choice: Are they not finding and dividing
  chosen_korean: “그들이 찾아서 나누지 않겠습니까?”
  alternatives_korean:
  - “그들이 찾고 나누지 않겠습니까?”
  - “그들이 찾아서 분배하지 않겠습니까?”
  lexicon: HALOT
  rationale: 반어적 기대를 나타내는 수사 의문으로 읽어, 한국어도 자연스러운 질문형으로 옮겼습니다. יִמְצְאוּ와 יְחַלְּקוּ의 연속 동작은 ‘찾아서 나누다’로 간결하게 살렸습니다.
- source_word: שָׁלָל
  english_pob_choice: spoil
  chosen_korean: 노획물
  alternatives_korean:
  - 전리품
  - 약탈물
  lexicon: HALOT
  rationale: 전쟁에서 취한 물건이라는 기본 의미를 살리면서도 현대 한국어에서 자연스럽고 중립적인 군사 용어인 ‘노획물’을 택했습니다.
- source_word: רַחַם רַחֲמָתַיִם
  english_pob_choice: A womb, two wombs
  chosen_korean: 한 태, 두 태
  alternatives_korean:
  - 한 자궁, 두 자궁
  - 한 여인, 두 여인
  - 한 여자, 두 여자
  lexicon: HALOT
  rationale: 직역하면 ‘태/자궁’이지만, 한국어에서는 ‘태’가 본문이 의도한 잔혹한 대상화와 숫자 대비를 비교적 압축적으로 드러냅니다. 영문 POB의 문맥적 경고를 반영해 완곡화하지 않았습니다.
- source_word: צְבָעִים / רִקְמָה / צֶבַע רִקְמָתַיִם
  english_pob_choice: dyed cloths / embroidered cloth / dyed cloth, two embroideries
  chosen_korean: 염색한 옷감 / 수놓은 천 / 염색한 옷감, 두 수놓은 것
  alternatives_korean:
  - 물들인 옷감
  - 자수 놓은 천
  - 염색한 옷감, 두 자수
  lexicon: HALOT
  rationale: 색이 들어간 직물과 수놓은 직물을 가리키는 연속 어휘를 유지하되, 한국어에서 이해 가능한 직물 표현으로 옮겼습니다. 마지막 반복과 이중형은 매끈하게 합치지 않고 남겨 원문의 압축성을 보존했습니다.
- source_word: לְצַוְּארֵי שָׁלָל
  english_pob_choice: for the necks of the spoil
  chosen_korean: 노획물의 목들을 위하여
  alternatives_korean:
  - 포로들의 목을 위하여
  - 노획된 자들의 목을 위하여
  lexicon: HALOT
  rationale: 히브리어의 축약되고 난해한 구조를 본문에서 과감히 풀지 않고, 원문 어순에 가깝게 남겼습니다. 이렇게 해야 해석상 불확실성이 드러나며, POB의 주석적 경고도 살릴 수 있습니다.
theological_decisions:
- issue: 시스라의 어머니가 기대하는 전리품 목록에 포함된 성적 대상화 표현의 처리
  chosen_reading: ‘한 태, 두 태’로 직역하여 잔혹한 대상화와 전쟁 전리품의 성적 함의를 완곡화하지 않았습니다.
  alternative_readings:
  - ‘한 여자, 두 여자’
  - ‘한 여성, 두 여성’
  rationale: 이 표현은 서술자의 윤리가 아니라 시스라 집안의 오만한 기대를 드러내는 말이므로, 완곡화하면 본문이 주는 도덕적 충격이 약해집니다.
  doctrine_reference: Translation philosophy §1, §3, §4
- issue: 마지막 구절의 난해한 어순과 의미
  chosen_reading: ‘노획물의 목들을 위하여’처럼 본문에 가까운 형태를 유지하고, 해석을 과도하게 확정하지 않았습니다.
  alternative_readings:
  - ‘포로들의 목을 위하여’
  - ‘노획된 자들의 목을 위하여’
  rationale: 본문의 문법적 압축성과 해석 가능성을 보존하는 것이, 확정적이지만 근거가 약한 매끈한 번역보다 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §5
