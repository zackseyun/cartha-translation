  source_fidelity: 첫 문장은 מִן שָׁמַיִם과 ‘별들이 싸웠다’를 충실히 옮깁니다. 후반의 ‘시스라와 싸웠습니다’는 한국어에서 시스라와 함께 싸웠다는 협력의 뜻으로도 자연스럽게 읽힐 수 있어, 전투 문맥에서 상대를 뜻하는 עִם의 의미를 본문에서 충분히 드러내지 못합니다. ‘시스라를 상대로’로 명시하는 것이 원문의 전투 의미와 영어 POB의 ‘against Sisera’를 정확히 반영합니다.
  naturalness: ‘그들의 궤도에서 그들은’은 한국어에서 주어 반복이 다소 무겁습니다. 두 번째 ‘그들은’을 생략하면 시적 병행을 유지하면서도 더 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자에게 명확합니다.
  terminology: ‘별들’, ‘하늘’, ‘시스라’는 적절합니다. ‘궤도’는 별들의 하늘길이라는 문맥상 가능한 번역이며, 길/경로라는 어휘적 폭은 각주로 보완하는 것이 적절합니다. ‘시스라를 상대로’는 교리적 해석을 덧붙이지 않고 전투 관용구의 방향성을 전달합니다.
