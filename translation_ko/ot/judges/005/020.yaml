source:
  edition: WLC
  text: מִן שָׁמַ֖יִם נִלְחָ֑מוּ הַ/כּֽוֹכָבִים֙ מִ/מְּסִלּוֹתָ֔/ם נִלְחֲמ֖וּ עִם סִיסְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
  footnotes:
  - marker: a
    text: Or 'from their paths' or 'from their tracks'; the Hebrew term can denote roads or courses, here likely the stars' appointed paths in the sky.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with Sisera'; in battle contexts this idiom commonly means 'against Sisera.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘에서 별들이 싸웠습니다. 그들의 궤도에서 그들은 시스라와 싸웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘궤도’는 여기서 별들의 하늘길, 곧 정해진 진행 경로를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시스라와’는 전투 문맥에서 ‘시스라를 상대로/시스라에게 맞서’의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַ֖יִם
  english_pob_choice: From heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘에서부터
  lexicon: HALOT
  rationale: מִן + שָׁמַיִם의 출발점 의미를 자연스러운 한국어 조사로 옮겼습니다. 시적 문맥에서 ‘하늘에서’가 가장 간결하고 직역에 가깝습니다.
- source_word: הַכּוֹכָבִים
  english_pob_choice: the stars
  chosen_korean: 별들이
  alternatives_korean:
  - 그 별들이
  - 천체들이
  lexicon: HALOT
  rationale: כּוֹכָבִים은 기본적으로 ‘별들’이므로 이를 그대로 살렸습니다. 주어를 자연스럽게 드러내기 위해 복수 주격 조사 ‘-들이’를 붙였습니다.
- source_word: מִמְּסִלּוֹתָם
  english_pob_choice: from their courses
  chosen_korean: 그들의 궤도에서
  alternatives_korean:
  - 그들의 길에서
  - 그들의 길 위에서
  - 그들의 경로에서
  lexicon: HALOT
  rationale: מְסִלּוֹת은 도로, 큰길, 길, 궤적을 뜻할 수 있지만 별들과 평행을 이루는 문맥에서는 하늘의 ‘궤도’가 가장 적절합니다. 영어 POB의 ‘courses’가 지닌 천문학적 뉘앙스를 반영했습니다.
- source_word: עִם סִיסְרָא
  english_pob_choice: against Sisera
  chosen_korean: 시스라와
  alternatives_korean:
  - 시스라를 향하여
  - 시스라를 상대로
  lexicon: HALOT
  rationale: עִם은 기본적으로 ‘함께’이지만 전투 동사와 결합할 때는 상대편을 가리키는 관용이 될 수 있습니다. 한국어에서는 병렬과 대결의 함의를 살리기 위해 ‘시스라와 싸웠습니다’로 옮겼습니다.
theological_decisions:
- issue: 별들이 실제로 어떤 방식으로 싸웠는지
  chosen_reading: 시적 진술 자체를 유지하고, 별들이 싸웠다고만 번역했습니다.
  alternative_readings:
  - 물리적 천체 현상으로 설명하기
  - 천사적/천상의 군대 이미지로 구체화하기
  - 섭리적 자연력에 대한 비유로 풀이하기
  rationale: 드보라의 노래는 고양된 시적 언어로 하나님의 구원을 묘사합니다. 본문은 별들의 전투 참여를 말하지만 그 메커니즘은 규정하지 않으므로, 번역에서도 그 긴장을 풀지 않고 그대로 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
