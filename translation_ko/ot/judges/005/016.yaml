  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
  footnotes:
  - marker: a
    text: Or 'By the streams of Reuben there were great searchings of heart.' The Hebrew term can mean 'divisions' or 'watercourses/streams.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 너는 양 우리들 사이에 앉아, 양 떼를 부르는 휘파람 소리를 들으려 하였습니까? 르우벤의 분파들[a]에는 마음의 큰 숙고가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르우벤의 시내들에는 마음의 큰 숙고가 있었습니다.’ 히브리어 용어는 ‘분파들’ 또는 ‘물줄기/시내들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 원문의 수사적 질문을 자연스러운 현대 한국어로 옮기되, 단순 정보 질문이 아니라 책망의 뉘앙스를 살리기 위해 ‘어찌하여’를 택했습니다.
- source_word: יָשַׁבְתָּ
  english_pob_choice: did you sit
  chosen_korean: 앉아 있었습니까
  alternatives_korean:
  - 머물러 있었습니까
  - 그 자리에 있었습니까
  lexicon: HALOT
  rationale: 직역적인 ‘앉다’의 구체성을 유지하면서, 시적 책망에서의 지속 상태를 한국어 완료/지속 표현으로 자연스럽게 나타냈습니다.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  english_pob_choice: among the sheepfolds
  chosen_korean: 양 우리들 사이에
  alternatives_korean:
  - 양 우리들 가운데
  - 양 우리 사이에
  lexicon: HALOT
  rationale: 목축적 장면을 분명히 드러내는 ‘양 우리’로 옮기고, 전치사의 기본 공간 관계를 살려 ‘사이에’로 표현했습니다.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  english_pob_choice: For the divisions of Reuben
  chosen_korean: 르우벤의 여러 분파에는
  alternatives_korean:
  - 르우벤의 여러 지파에는
  - 르우벤의 분열에는
  - 르우벤의 여러 갈래에는
  lexicon: HALOT
  rationale: 히브리어 명사가 ‘분파/분할’의 의미를 가질 수 있어, 단순 지리적 ‘시내’보다 집단 내부의 갈라짐과 망설임을 드러내는 ‘분파’를 택했습니다.
- source_word: חִקְרֵי לֵב
  english_pob_choice: searchings of heart
  chosen_korean: 마음의 큰 탐구
  alternatives_korean:
  - 마음의 큰 궁구
  - 마음의 깊은 성찰
  - 마음의 큰 살핌
  lexicon: HALOT
  rationale: 히브리어의 시적 관용구를 보존하면서 내적 숙고와 검토의 의미를 살리기 위해 ‘탐구’를 사용했고, 형용사 ‘큰’으로 강도를 반영했습니다.
theological_decisions:
- issue: Reuben의 상태를 묘사하는 후기 구절의 의미 범위
  chosen_reading: 지리적 ‘시내’보다 공동체 내부의 ‘분파/분열’과 그로 인한 내적 망설임을 본문 의미의 중심으로 옮겼습니다.
  alternative_readings:
  - 르우벤의 시내들에는
  - 르우벤의 물줄기들에는
  rationale: 문맥상 이 구절은 르우벤의 소극성과 분산된 결정을 책망하는 시적 진술이므로, 본문의 함의를 한국어 독자가 즉시 읽을 수 있게 반영했습니다.
  doctrine_reference: 시적·역사적 문맥 해석
