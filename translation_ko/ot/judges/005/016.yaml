translation:
  language: ko
  text: 어찌하여 너는 양 우리들[a] 사이에 앉아 있었습니까? 양 떼를 위한 휘파람 소리를 들으려고 말입니다. 르우벤의 여러 분파에는 마음의 큰 탐구가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르우벤의 시내들에는’. 히브리어 용어는 ‘분파들’ 또는 ‘물줄기/시내들’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
