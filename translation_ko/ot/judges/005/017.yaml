source:
  edition: WLC
  text: גִּלְעָ֗ד בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ שָׁכֵ֔ן וְ/דָ֕ן לָ֥/מָּה יָג֖וּר אֳנִיּ֑וֹת אָשֵׁ֗ר יָשַׁב֙ לְ/ח֣וֹף יַמִּ֔ים וְ/עַ֥ל מִפְרָצָ֖י/ו יִשְׁכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
  footnotes:
  - marker: a
    text: Or 'why did he sojourn by ships?' The Hebrew verb can mean 'reside' or 'sojourn'; 'linger' is chosen here to reflect the song's tone of reproach.
    reason: lexical_alternative
  - marker: b
    text: Or 'at his inlets/bays.' The Hebrew term refers to openings or breaks and in this coastal context likely means harbors or inlets.
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗은 요단 저편에 머물렀고, 단은 왜 배들 곁에서 떠돌았습니까? 아셀은 바닷가에 앉아 자기의 항만 곁에 머물렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배들 곁에서 체류했습니까?’ 히브리어 동사는 ‘거주하다’ 또는 ‘체류하다’의 뜻이 있어, 여기서는 시의 책망 어조를 살리기 위해 보다 날카로운 표현을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 만/들목들 곁에.’ 히브리어는 해안의 틈이나 열린 부분을 가리키며, 이 해안 문맥에서는 항만이나 만을 뜻할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד / בְּעֵבֶר הַיַּרְדֵּן
  english_pob_choice: Gilead stayed beyond the Jordan
  chosen_korean: 길르앗은 요단 저편에 머물렀고
  alternatives_korean:
  - 요단 건너편에 머물렀고
  - 요단 저편에 살았고
  lexicon: HALOT
  rationale: ‘요단 저편’은 지리적 대립을 간결하게 살리며, שָׁכֵן의 문맥상 무위와 체류를 함께 보여 주기 위해 ‘머물렀다’를 택했습니다.
- source_word: יָגוּר אֳנִיּוֹת
  english_pob_choice: did he sojourn by the ships
  chosen_korean: 배들 곁에서 떠돌았습니까
  alternatives_korean:
  - 배들 곁에 체류했습니까
  - 배들 곁에 머물렀습니까
  lexicon: HALOT
  rationale: יָגוּר는 단순한 거주보다 ‘객지에서 머물다/체류하다’의 뉘앙스가 있어, 책망하는 수사의 힘을 살리기 위해 ‘떠돌다’를 사용했습니다.
- source_word: לְחוֹף יַמִּים / מִפְרָצָיו
  english_pob_choice: by the seashore ... by his harbors
  chosen_korean: 바닷가에 ... 자기의 항만 곁에
  alternatives_korean:
  - 해안가에 ... 자기의 만과 들목 곁에
  - 해변에 ... 자기의 항구 곁에
  lexicon: HALOT
  rationale: חוֹף는 ‘바닷가/해안’이 자연스럽고, מִפְרָצָיו는 해안의 틈·만·들목을 가리키므로 문맥상 ‘항만’으로 옮겨 해안지대의 정황을 살렸습니다.
- source_word: יָשַׁב
  english_pob_choice: sat
  chosen_korean: 앉아
  alternatives_korean:
  - 머물며
  - 거주하며
  lexicon: HALOT
  rationale: 동사의 문자적 의미와 더불어 시적 비난이 드러나도록 ‘앉아’로 옮겨, 가만히 지켜보기만 한 듯한 이미지를 유지했습니다.
theological_decisions:
- issue: 이 절의 수사적 책망을 한국어에서 얼마나 강하게 드러낼지
  chosen_reading: 질문형을 유지하되 ‘왜 ... 떠돌았습니까?’로 옮겨 비판의 어조를 분명히 했습니다.
  alternative_readings:
  - ‘왜 ... 체류했습니까?’처럼 중립적으로 완화
  - 직설문으로 바꾸어 비난을 강화
  rationale: 사사기 5장의 시는 전쟁 참여를 회피한 지파들을 책망하는 맥락이므로, 문법상 질문을 유지하면서도 책망의 뉘앙스를 약화시키지 않았습니다.
  doctrine_reference: 사사기 5장 문맥과 시적 책망의 수사
- issue: ‘그들의 항만’의 소유격 처리
  chosen_reading: ‘자기의 항만 곁에’로 처리해 원문의 3인칭 소유를 자연스럽게 반영했습니다.
  alternative_readings:
  - ‘그의 항만 곁에’
  - ‘그곳의 항만 곁에’
  rationale: 히브리어 대명사 접미사는 해안 지대에 대한 소유/귀속을 나타내며, 한국어에서는 ‘자기의’가 가장 덜 어색하고 문맥상 적절합니다.
  doctrine_reference: 히브리어 소유 대명사 처리
