base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: ko
  text: 이스라엘에서 지도자들이 앞장설 때, 백성이 스스로 나설 때, 야훼를 찬양하십시오![a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘잡아당김/해방’의 이미지가 있으나, 문맥상 지도자들이 앞장서는 상황을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  english_pob_choice: When leaders took the lead
  chosen_korean: “지도자들이 앞장설 때”
  alternatives_korean:
  - “통치자들이 다스릴 때”
  - “질서가 회복될 때”
  lexicon: פָּרַע / פְּרֹעַ
  rationale: 영어 POB의 해석을 따라 단순한 ‘풀림’보다 공동체를 이끄는 ‘지도자들이 앞장섬’이라는 의미를 살려, 시가적 문맥에 맞는 자연스러운 한국어로 옮겼습니다.
- source_word: בְּהִתְנַדֵּב עָם
  english_pob_choice: when the people volunteered
  chosen_korean: “백성이 스스로 나설 때”
  alternatives_korean:
  - “백성이 자원할 때”
  - “백성이 자발적으로 나설 때”
  lexicon: הִתְנַדֵּב
  rationale: 히트나데브는 단순한 감정이 아니라 자발적 헌신과 참여를 가리키므로, ‘스스로 나서다’로 옮겨 자원성과 적극성을 함께 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: “야훼”
  alternatives_korean:
  - “주님”
  - “여호와”
  lexicon: YHWH
  rationale: WLC의 신명 표기를 한국어 학술 음역인 ‘야훼’로 직접 반영해 원문 계열을 보존했습니다.
theological_decisions:
- issue: 호칭 표현의 처리
  chosen_reading: 마지막 명령형은 한국어 예배문 관습을 따르기보다 원문의 직접 찬양 촉구를 살려 “야훼를 찬양하십시오!”로 옮겼습니다.
  alternative_readings:
  - “야훼를 송축하십시오!”
  - “야훼를 찬미하십시오!”
  rationale: 본문은 회중에게 직접적인 찬양 명령을 주므로, 과도하게 완화하지 않고 현대 합쇼체의 명령형으로 유지했습니다.
  doctrine_reference: 공적 찬양의 직접성 및 야훼 신명 보존
