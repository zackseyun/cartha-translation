  text: וְ/שָׂרַ֤/י בְּ/יִשָּׂשכָר֙ עִם דְּבֹרָ֔ה וְ/יִשָּׂשכָר֙ כֵּ֣ן בָּרָ֔ק בָּ/עֵ֖מֶק שֻׁלַּ֣ח בְּ/רַגְלָ֑י/ו בִּ/פְלַגּ֣וֹת רְאוּבֵ֔ן גְּדֹלִ֖ים חִקְקֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
  footnotes:
  - marker: a
    text: Or 'chiefs of Issachar' or 'leaders of Issachar.' The Hebrew expression is poetic and may function idiomatically rather than as a strict possessive.
    reason: lexical_alternative
  - marker: b
    text: Literally 'at his feet,' that is, following closely behind him.
    reason: lexical_alternative
  - marker: c
    text: Or 'great resolutions of heart' or 'great deliberations of heart.' The Hebrew phrase is difficult; in context it likely highlights Reuben's inward debate instead of action.
    reason: alternative_reading
translation:
  language: ko
  text: 잇사갈의 방백들은 드보라와 함께 있었고, 잇사갈도 그와 마찬가지로 바락과 함께하였으며, 골짜기로는 그 발치에 보내졌습니다. 르우벤의 여러 분파들 사이에서는 마음을 크게 살피는 일이 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 시적이며, 엄밀한 소유격이라기보다 ‘잇사갈의 방백들/지도자들’이라는 관용적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 발치에’로, 바락을 바짝 뒤따르며 함께 나아갔다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘마음의 큰 결심’ 또는 ‘마음의 큰 숙고’로도 옮길 수 있으나, 문맥상 르우벤의 내적 망설임을 강조하는 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי
  english_pob_choice: princes of
  chosen_korean: 방백들
  alternatives_korean:
  - 지도자들
  - 족장들
  lexicon: HALOT
  rationale: 시적인 문맥에서 지위가 있는 인물들을 가리키는 말로 읽히므로, 현대 한국어에서 격조를 유지하면서도 본문의 높임을 살리는 「방백들」을 택했습니다.
- source_word: בְּרַגְלָיו
  english_pob_choice: at his feet
  chosen_korean: 그 발치에
  alternatives_korean:
  - 그의 발 앞에
  - 그를 바짝 따라
  lexicon: HALOT
  rationale: 직역상 ‘발에/발치에’이지만, 문맥상 바락을 바짝 뒤따르는 군사적 동행을 뜻하므로 본문에는 투명성을 살려 ‘그 발치에’로 두었습니다.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  english_pob_choice: among the divisions of Reuben
  chosen_korean: 르우벤의 여러 분파들 사이에서는
  alternatives_korean:
  - 르우벤의 여러 구분들 사이에서는
  - 르우벤의 지파 갈래들 가운데서는
  lexicon: HALOT
  rationale: פְּלַגּוֹת은 문자적으로 ‘나뉜 부분들, 분파들’의 뜻이므로, 단순한 ‘지파’보다 내부의 갈라짐과 주저를 드러내는 표현을 선택했습니다.
- source_word: חִקְקֵי לֵב
  english_pob_choice: searchings of heart
  chosen_korean: 마음을 크게 살피는 일
  alternatives_korean:
  - 마음의 깊은 궁리
  - 마음의 큰 헤아림
  lexicon: HALOT
  rationale: 구절의 핵심은 결단보다 내적 숙고와 갈등이므로, 관용적이면서도 의미를 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘바락과 함께하였다’의 병행과 ‘그 발치에 보내졌다’의 군사적 이미지
  chosen_reading: 잇사갈이 드보라 및 바락 편에 서서 실제로 전투에 동참한 모습을 살렸습니다.
  alternative_readings:
  - 단순한 동행 표현
  - 비유적으로만 지지한 뜻
  rationale: 본문은 단순 호의가 아니라 전투 참여의 구체성을 강조하므로, 동행과 파견의 동적 이미지를 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 본문 주해/문맥상 의미
- issue: 르우벤에 대한 마지막 구절의 해석
  chosen_reading: ‘마음을 크게 살피는 일’로 번역해, 결단 대신 내적 분별과 망설임이 드러나게 했습니다.
  alternative_readings:
  - ‘마음의 큰 결심’
  - ‘마음의 깊은 숙고’
  rationale: 히브리어가 난해하고, 앞뒤 문맥이 르우벤의 미온성과 갈등을 비판적으로 보여 주므로, 결과보다 내적 갈등을 드러내는 번역이 적절합니다.
  doctrine_reference: 본문 주해/문맥상 의미
