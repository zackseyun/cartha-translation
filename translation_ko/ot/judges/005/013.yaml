source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
  footnotes:
  - marker: a
    text: Or 'Then a survivor came down to the nobles'; the Hebrew of this poetic line is difficult, and the prepositions may also be read in a non-hostile sense ('to,' 'for,' or 'with').
    reason: alternative_reading
  - marker: b
    text: Hebrew 'for me'; likely Deborah's poetic self-reference.
    reason: cultural_note
translation:
  language: ko
  text: 그때 남은 이들이 권세 있는 자들에게로 내려왔습니다.[a] 야훼의 백성이 나를 위하여[b] 용사들에게로 내려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 생존자가 권세 있는 자들에게 내려왔다’. 이 시구의 히브리어는 해석하기 어렵습니다. 전치사들은 ‘~에게’, ‘~을 위하여’, ‘~와 함께’처럼 비적대적으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘나를 위하여’. 아마도 드보라의 시적 자기 언급일 것입니다.
    reason: cultural_note
