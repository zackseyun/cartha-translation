    rationale: '[a][b]가 절 전체의 끝에 함께 놓여 있어, 전치사 해석 주석과 ‘나를 위하여’에 관한 주석이 각각 어느 표현을 설명하는지 분명하지 않습니다.'
  - severity: low
    issue: ‘귀족들’의 의미가 다소 협소함
    rationale: אַדִּירִים는 귀족에 한정되지 않고 위세 있거나 권세 있는 이들을 가리킬 수 있으므로, 난해한 시구에서 더 넓은 표현이 적절합니다.
  revised_text: 그때 남은 이들이 권세 있는 자들에게로 내려왔습니다.[a] 야훼의 백성이 나를 위하여[b] 용사들에게로 내려왔습니다.[a]
