  alternatives_korean:
  - 남은 자들
  - 잔존자들
  lexicon: HALOT
  rationale: 군사적 시가 문맥에서 단순한 ‘남은 무리’보다 생존의 뉘앙스를 살리되, 한국어에서 덜 경직되게 옮겼습니다.
- source_word: לְאַדִּירִים
  english_pob_choice: against the nobles
