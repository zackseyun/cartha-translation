  lexicon: HALOT
  rationale: English audit가 이 전치사의 방향성을 다소 유동적으로 보지만, 한국어 본문에서는 직접적인 대립을 과도하게 확정하지 않기 위해 중립적 방향 표현을 택했습니다.
- source_word: עָם יְהוָה
  english_pob_choice: the people of Yahweh
  chosen_korean: 야훼의 백성
  alternatives_korean:
