  - 야훼의 사람들
  lexicon: HALOT
  rationale: 언약 소속을 분명히 하면서도 한국어 성경체에서 자연스러운 소유 구문을 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: Tetragrammaton을 관례적 대체어가 아니라 고유 신명으로 직접 옮겨, 본문이 가진 계시적·언약적 힘을 보존합니다.
- source_word: לִי
  english_pob_choice: for me
  chosen_korean: 나를 위하여
  alternatives_korean:
  - 나에게
  - 내 편에
  - 나와 함께
  lexicon: HALOT
  rationale: 발화자(드보라)의 시적 자기 언급을 한국어에서 자연스럽게 드러내며, 단순 방향성보다 목적·대리성의 여지를 넓게 남깁니다.
- source_word: בַּגִּבּוֹרִים
  english_pob_choice: against the mighty
  chosen_korean: 용사들에게로
  alternatives_korean:
  - 강한 자들에게로
  - 능한 자들에게로
  - 용사들에 맞서
  lexicon: HALOT
  rationale: 문맥상 전투 시구이지만, 한국어에서는 전치사의 폭을 과도하게 좁히지 않고 병행구의 운동감을 살리는 방향 표현을 사용했습니다.
theological_decisions:
- issue: 히브리어 전치사 ל의 방향성(대립적/비대립적)
  chosen_reading: 한국어 본문은 ‘-에게로’/‘나를 위하여’로 옮겨, 원문이 허용하는 방향·관계의 유동성을 열어 둡니다.
  alternative_readings:
  - ‘귀족들을 향해’/‘용사들을 향해’
  - ‘귀족들에게 맞서’/‘용사들에게 맞서’
  rationale: 영어 POB도 이 구절의 전치사들이 반드시 적대만 뜻하지 않을 수 있음을 주석 처리합니다. 따라서 한국어는 전투 시가의 추진력은 유지하되, 본문 자체가 가진 해석 여지를 닫지 않는 것이 바람직합니다.
  doctrine_reference: 'POB translation principle: preserve documented ambiguity where the source is difficult'
- issue: ‘야훼’ 표기 사용
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮깁니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신적 칭호가 아니라 언약 이름 자체를 사용하므로, 대체 표기보다 직접 음역이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
