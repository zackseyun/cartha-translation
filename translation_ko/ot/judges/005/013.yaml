theological_decisions:
- issue: 히브리어 전치사 ל의 방향성(대립적/비대립적)
  chosen_reading: 한국어 본문은 ‘-에게로’/‘나를 위하여’로 옮겨, 원문이 허용하는 방향·관계의 유동성을 열어 둡니다.
  alternative_readings:
  - ‘귀족들을 향해’/‘용사들을 향해’
  - ‘귀족들에게 맞서’/‘용사들에게 맞서’
  rationale: 영어 POB도 이 구절의 전치사들이 반드시 적대만 뜻하지 않을 수 있음을 주석 처리합니다. 따라서 한국어는 전투 시가의 추진력은 유지하되, 본문 자체가 가진 해석 여지를 닫지 않는 것이 바람직합니다.
  doctrine_reference: 'POB translation principle: preserve documented ambiguity where the source is difficult'
- issue: ‘야훼’ 표기 사용
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮깁니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신적 칭호가 아니라 언약 이름 자체를 사용하므로, 대체 표기보다 직접 음역이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
