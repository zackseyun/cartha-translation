base_translation:
  language: en
  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: ko
  text: 가장 지혜로운 그의 공주들이 그에게 대답합니다. 참으로 그가 몸소 자기 말을 되풀이합니다.
  philosophy: formal
lexical_decisions:
- source_word: חַכְמ֥וֹת
  english_pob_choice: wisest
  chosen_korean: 가장 지혜로운
  alternatives_korean:
  - 지혜로운
  - 가장 슬기로운
  lexicon: חָכָם
  rationale: 비교급/최상급 뉘앙스를 살려 단순한 ‘지혜로운’보다 ‘가장 지혜로운’으로 옮겼습니다.
- source_word: שָׂרוֹתֶ֖י/הָ
  english_pob_choice: princesses
  chosen_korean: 그의 공주들이
  alternatives_korean:
  - 그의 귀부인들이
  - 그의 여공들이
  lexicon: שָׂרָה / שַׂר
  rationale: 문맥상 여성 귀족층을 가리키는 표현으로, 영어 POB의 ‘princesses’를 따라 ‘공주들’로 직역하되 소유격은 문맥에 맞게 ‘그의’로 처리했습니다.
- source_word: תַּעֲנֶ֑ינָּה
  english_pob_choice: answer
  chosen_korean: 대답합니다
  alternatives_korean:
  - 응답합니다
  - 말합니다
  lexicon: ענה
  rationale: 대화의 응답 행위를 가장 직접적으로 드러내는 ‘대답하다’를 사용했습니다.
- source_word: אֲמָרֶ֖י/הָ
  english_pob_choice: her words
  chosen_korean: 자기 말
  alternatives_korean:
  - 그녀의 말
  - 그의 말
  lexicon: אמר
  rationale: ‘말/발언’의 반복을 자연스럽게 살리기 위해 ‘자기 말’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 반복 동작 표현
  chosen_reading: ‘she herself repeats her words to herself’의 반복성과 자기 지시성을 살려 옮겼습니다.
  alternative_readings:
  - ‘그녀가 자기 말을 다시 대답합니다’
  - ‘그녀 자신이 자기 말에 응답합니다’
  rationale: 히브리어의 אַף הִיא와 תָּשִׁיב אֲמָרֶיהָ לָהּ는 단순 응답보다 자기 말의 되풀이/반향을 강조하므로, POB의 최종 판독을 반영해 ‘되풀이합니다’로 표현했습니다.
  doctrine_reference: 서술 시학의 의미 보존
