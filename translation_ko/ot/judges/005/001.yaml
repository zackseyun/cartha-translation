translation:
  language: ko
  text: '그날 드보라와 아비노암의 아들 바락이 노래하며 이렇게 말했습니다[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성 단수 동사 ‘드보라가 노래했다’ 뒤에 ‘그리고 바락’을 덧붙입니다. 문맥상 드보라와 바락이 함께 노래한 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  english_pob_choice: sang
  chosen_korean: 노래하여
  alternatives_korean:
  - 노래했습니다
  - 노래하며
  lexicon: HALOT
  rationale: 히브리어 동사 שׁיר의 기본 의미를 살려 ‘노래하다’로 옮겼고, 이어지는 인용 도입을 자연스럽게 연결하기 위해 서술적 연결형 ‘노래하여’로 표현했습니다.
- source_word: דְּבוֹרָה וּבָרָק
  english_pob_choice: Deborah and Barak
  chosen_korean: 드보라와 ... 바락
  alternatives_korean:
  - 드보라와 바락
  - 드보라와 바락이
  lexicon: 고유명사 표기
  rationale: 인물명은 현대 외래어 표기법에 따라 ‘드보라’, ‘바락’으로 옮기고, 영어 POB의 합동 주어 이해를 따라 두 사람이 함께 노래한 것으로 자연스럽게 읽히도록 했습니다.
- source_word: בֶּן אֲבִינֹעַם
  english_pob_choice: son of Abinoam
  chosen_korean: 아비노암의 아들
  alternatives_korean:
  - 아비노암의 아들인
  - 아비노암의 아들 바락
  lexicon: HALOT
  rationale: 히브리어 친족관계 표현을 한국어 소유격 구문으로 직역해, 바락의 신분 표지를 분명히 했습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날
  alternatives_korean:
  - 그때
  - 그 날에
  lexicon: HALOT
  rationale: 특정 승리의 날을 가리키는 시간 부사구로, 한국어에서는 ‘그날’이 가장 간결하고 자연스럽습니다.
- source_word: לֵאמֹר
  english_pob_choice: 'saying:'
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어 인용 도입어를 한국어 담화 표지로 풀어, 뒤에 이어질 노래/말씀의 시작을 분명히 했습니다.
theological_decisions:
- issue: 히브리어 단수 동사와 복수 주어의 관계
  chosen_reading: 본문의 동사 형태는 드보라를 먼저 받지만, 문맥상 드보라와 바락이 함께 노래한 것으로 이해해 자연스러운 합동 주어로 옮겼습니다.
  alternative_readings:
  - ‘드보라가 노래했습니다’처럼 단수 동사에 맞추는 읽기
  - 단수성을 드러내는 주석적 번역
  rationale: 영어 POB의 주석과 같은 방향으로, 서술의 자연스러움과 문맥 의미를 함께 반영했습니다.
  doctrine_reference: 본문 문법과 서사 문맥의 조화
- issue: 인용 도입의 마침표 처리
  chosen_reading: ‘말했습니다[a]’로 마무리해 이어지는 노래 본문이 시작됨을 예고했습니다.
  alternative_readings:
  - ‘말하여’
  - ‘이르며’
  rationale: 히브리어 לֵאמֹר의 기능은 다음에 오는 직접 화법을 여는 것이므로, 한국어에서도 간결한 인용 표지로 처리했습니다.
  doctrine_reference: 서사-화법 전환
