base_translation:
  language: en
  yaml_path: translation/ot/judges/005/001.yaml
  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
  footnotes:
  - marker: a
    text: Hebrew has a singular verb, 'and Deborah sang,' followed by 'and Barak'; the sense in context is that Deborah and Barak sang together.
