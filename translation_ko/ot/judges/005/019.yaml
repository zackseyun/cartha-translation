id: JDG.5.19
reference: Judges 5:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֤אוּ מְלָכִים֙ נִלְחָ֔מוּ אָ֤ז נִלְחֲמוּ֙ מַלְכֵ֣י כְנַ֔עַן בְּ/תַעְנַ֖ךְ עַל מֵ֣י מְגִדּ֑וֹ בֶּ֥צַע כֶּ֖סֶף לֹ֥א לָקָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
  footnotes:
  - marker: a
    text: Or 'gain of silver' or 'profit of silver.' The Hebrew expression can denote material gain more generally, but in this battle context 'plunder of silver' best fits.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕들이 와서 싸웠습니다. 그때 가나안의 왕들이 다안[a]에서, 므깃도 물가에서 싸웠으나 은의 노획물은 취하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다낙’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  english_pob_choice: Kings came
  chosen_korean: 왕들이 와서
  alternatives_korean:
  - 왕들이 왔습니다
  - 왕들이 도착하여
  lexicon: HALOT
  rationale: 히브리어의 짧은 서술 연쇄를 살려 먼저 이동을, 이어 싸움을 배치하는 간결한 시적 호흡으로 옮겼습니다.
- source_word: נִלְחָמוּ
  english_pob_choice: they fought
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 전쟁을 벌였습니다
  - 전투를 벌였습니다
  lexicon: HALOT
  rationale: נלחם의 기본적인 전투 행위를 자연스러운 현대 한국어로 압축해 시구의 긴박함을 유지했습니다.
- source_word: בְּתַעְנַךְ
  english_pob_choice: at Taanach
  chosen_korean: 다안에서
  alternatives_korean:
  - 다나크에서
  - 다안에
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기법에 따라 음역했고, 전투 장소를 나타내는 ב를 '에서'로 옮겼습니다.
- source_word: בֶּצַע כֶּסֶף
  english_pob_choice: plunder of silver
  chosen_korean: 은의 노획물
  alternatives_korean:
  - 은의 이익
  - 은의 소득
  - 은의 전리품
  lexicon: HALOT
  rationale: betsaʿ는 일반적 '이익'보다 전투 맥락의 전리품/노획물이 더 적절하므로, silver를 수식하는 구조를 살려 '은의 노획물'로 옮겼습니다.
- source_word: לֹא לָקָחוּ
  english_pob_choice: they took no
  chosen_korean: 취하지 않았습니다
  alternatives_korean:
  - 받지 않았습니다
  - 가져가지 않았습니다
  lexicon: HALOT
  rationale: לָקַח의 기본 의미를 반영하되, 전리품 문맥에서 '취하다'가 가장 간결하고 문맥에 맞습니다.
