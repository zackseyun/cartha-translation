  naturalness: 합쇼체 문장으로 자연스럽고 시의 간결한 병렬도 대체로 유지됩니다. ‘다안에서, 므깃도 물가에서’의 쉼표는 불필요하므로 장소구를 연이어 쓰는 편이 더 매끄럽습니다.
  terminology: ‘가나안’, ‘므깃도’, ‘왕들’, ‘노획물’은 적절합니다. 지명 תַּעְנַךְ는 표준적인 성서 한국어 음역인 ‘다아낙’으로 고쳐야 합니다. 기존 각주의 ‘다낙’은 원문 지명의 적절한 대안 표기가 아니며, 각주 내용도 본문의 표지 위치와 맞지 않습니다.
