source:
  edition: WLC
  text: עוּרִ֤י עוּרִי֙ דְּבוֹרָ֔ה ע֥וּרִי ע֖וּרִי דַּבְּרִי שִׁ֑יר ק֥וּם בָּרָ֛ק וּֽ/שֲׁבֵ֥ה שֶׁבְיְ/ךָ֖ בֶּן אֲבִינֹֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
  footnotes:
  - marker: a
    text: Or 'sing a song.' The Hebrew verb is literally 'speak,' which may intentionally preserve the poetic force of the summons.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'take captive your captives,' a Hebrew idiom for triumph over enemies by seizing them as prisoners.
    reason: lexical_alternative
translation:
  language: ko
  text: “깨어나라, 깨어나라, 드보라여! 깨어나라, 깨어나라, 노래를 부르라! 일어나라, 바락아, 그리고 네 포로들을 사로잡아라, 아비노암의 아들아.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘말하다’이지만, 시적 문맥에서는 ‘노래를 부르다’로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 포로들을 사로잡아라’는 히브리어의 반복 어법으로, 원문은 적을 포로로 삼아 완전한 승리를 선언하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי / עוּרִי
  english_pob_choice: Awake, awake
  chosen_korean: 깨어나라, 깨어나라
  alternatives_korean:
