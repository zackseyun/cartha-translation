  lexicon: HALOT
  rationale: 히브리어의 ‘사로잡다/포로’ 반복을 한국어에서 과도하게 어색하지 않게 살리면서, 승리의 전투적 뉘앙스를 유지했습니다.
- source_word: בֶּן אֲבִינֹעַם
  english_pob_choice: son of Abinoam
  chosen_korean: 아비노암의 아들
  alternatives_korean:
