  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로 ‘말하다’이지만, 한국어에서는 ‘노래를 부르라’가 시구의 요구를 가장 자연스럽게 전달하므로 본문에 두었습니다.
- source_word: קוּם
  english_pob_choice: Rise up
  chosen_korean: 일어나라
  alternatives_korean:
  - 일어서라
  - 떨쳐 일어나라
  lexicon: HALOT
  rationale: 바락에게 주어진 남성 단수 명령을 짧고 직접적으로 옮겼습니다.
- source_word: וּשֲׁבֵה שֶׁבְיְךָ
  english_pob_choice: take captive your captives
  chosen_korean: 네 포로들을 사로잡아라
