id: JDG.5.6
reference: Judges 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
  footnotes:
  - marker: a
    text: Or 'the roads ceased'—that is, normal travel on the main routes stopped.
    reason: lexical_alternative
  - marker: b
    text: '''Crooked paths'' likely refers to indirect side routes taken for safety rather than moral crookedness.'
    reason: cultural_note
translation:
  language: ko
  text: 아낫의 아들 삼갈의 때에, 야엘의 때에, 큰길들의 통행이 끊어졌고[a] 길을 다니는 이들은 굽은 길로 다녔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰길들이 그쳤다’—즉, 큰길에서의 정상적인 통행이 멈추었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘굽은 길’은 도덕적 굽음보다 안전을 위해 택한 우회적인 길을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: ~의 때에
  alternatives_korean:
  - ~의 날들에
  - 그 시기에
  lexicon: HALOT
  rationale: 히브리어 관용구의 시대 표지를 한국어에서 자연스럽게 살려, 특정 인물들이 지배적으로 연관된 시기를 나타내는 표현으로 옮겼습니다.
- source_word: שַׁמְגַּר בֶּן עֲנָת
  english_pob_choice: Shamgar son of Anath
  chosen_korean: 샴가르의 아들 아낫
  alternatives_korean:
  - 샴가르, 아낫의 아들
  - 샴가르 벤 아낫
  lexicon: 고유명사 표기 관례
  rationale: 히브리어의 친족 관계를 반영하되, 한국어 독자가 읽기 쉬운 순서로 옮겼습니다. POB의 영어 처럼 'son of' 관계를 유지했습니다.
- source_word: חָדְלוּ אֳרָחוֹת
  english_pob_choice: the highways were deserted
  chosen_korean: 큰길들이 끊어졌고
  alternatives_korean:
  - 큰길들이 폐쇄되었고
  - 큰길 사용이 멈추었고
  lexicon: HALOT
  rationale: חָדְלוּ는 '그쳤다/멈췄다'의 뜻이므로 단순 폐쇄보다 도로의 정상적 통행이 멎은 상태를 드러내는 동사로 옮겼습니다. אֳרָחוֹת는 주요 통행로이므로 '큰길들'로 잡았습니다.
- source_word: הֹלְכֵי נְתִיבוֹת יֵלְכ֕וּ אֳרָחוֹת עֲקַלְקַלּוֹת
  english_pob_choice: travelers went by roundabout paths
  chosen_korean: 길 가는 사람들은 굽은 길로 다녔습니다
  alternatives_korean:
  - 길손들은 우회로로 다녔습니다
  - 길 가는 사람들은 돌아가는 길로 다녔습니다
  lexicon: HALOT
  rationale: '''길 가는 사람들''은 ''paths를 걷는 자들''을 자연스럽게 옮긴 말이고, 뒤의 아ֳרָחוֹת과 נְתִיבוֹת의 두 길 대비를 흐리지 않도록 같은 문장 안에서 ''굽은 길''로 옮겨 우회·불안전한 통행의 이미지를 살렸습니다.'
theological_decisions:
- issue: '''굽은''의 윤리적 함의 여부'
  chosen_reading: 여기서는 도덕적 비유보다 안전을 위해 돌아가야 했던 실제 통행 경로의 굴곡을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 도덕적으로 '삐뚤어진 길'로 읽는 해석
  - 단순히 '우회로'로만 읽는 해석
  rationale: POB의 문화적 주석처럼, 문맥상 안전 문제로 인한 비정상적 이동을 말하며 윤리적 '악함'으로 과잉 해석할 근거는 약합니다.
  doctrine_reference: 문맥 우선 원칙; 시가의 관용 표현 해석
