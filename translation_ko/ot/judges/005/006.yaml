source:
  edition: WLC
  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
  footnotes:
  - marker: a
    text: Or 'the roads ceased'—that is, normal travel on the main routes stopped.
    reason: lexical_alternative
  - marker: b
    text: '''Crooked paths'' likely refers to indirect side routes taken for safety rather than moral crookedness.'
    reason: cultural_note
translation:
  language: ko
  text: 샴가르의 아들 아낫의 때에, 야엘의 때에, 큰길들이 끊어졌고, 길 가는 사람들은 굽은 길로 다녔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '길들이 그쳤다'—즉, 큰길에서의 정상적인 통행이 멈추었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '''굽은 길''은 도덕적 굽음보다 안전을 위해 택한 우회적 길을 가리킬 가능성이 큽니다.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: ~의 때에
  alternatives_korean:
  - ~의 날들에
  - 그 시기에
  lexicon: HALOT
  rationale: 히브리어 관용구의 시대 표지를 한국어에서 자연스럽게 살려, 특정 인물들이 지배적으로 연관된 시기를 나타내는 표현으로 옮겼습니다.
