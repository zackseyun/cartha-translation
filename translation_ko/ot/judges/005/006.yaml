  source_fidelity: 수정이 필요합니다. 히브리어 בֶּן עֲנָת은 ‘아낫의 아들’이라는 뜻이므로, 현행 ‘샴가르의 아들 아낫’은 부자 관계와 인물 이름을 반대로 옮겼습니다. 또한 אֳרָחוֹת와 נְתִיבוֹת의 길 관련 어휘는 문맥상 통행로와 그 길을 이용하는 사람들을 가리키며, ‘큰길’과 ‘길을 다니는 이들’로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘아낫의 아들 삼갈의 때에’와 ‘길을 다니는 이들은 굽은 길로 다녔습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘삼갈’은 한국어 성경의 일반적 고유명사 표기를 따릅니다.
  terminology: 고유명사는 ‘아낫의 아들 삼갈’, ‘야엘’로 정정합니다. חָדְלוּ는 도로 자체의 물리적 단절보다 정상 통행의 중단을 뜻하므로 ‘큰길들의 통행이 끊어졌고’로 명확히 합니다. עֲקַלְקַלּוֹת는 윤리적 의미를 덧붙이지 않고 ‘굽은 길’로 옮깁니다.
