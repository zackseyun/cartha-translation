translation:
  language: ko
  text: 내 마음은 이스라엘의 지도자들과 함께합니다[a]. 그들이 백성 가운데서 자원하였기 때문입니다. 야훼를 찬양하십시오!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음은 이스라엘의 법을 세우는 자들, 곧 백성 가운데서 기꺼이 몸을 바친 자들과 함께합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  english_pob_choice: My heart
  chosen_korean: 내 마음은
  alternatives_korean:
  - 내 마음이
  - 내 마음은 내게
  lexicon: HALOT
  rationale: 1인칭 소유 접미사가 붙은 ‘마음’을 한국어에서 자연스럽게 살려, 내적 지향과 연대의 표현을 유지했습니다.
- source_word: לְחוֹקְקֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of Israel
  chosen_korean: 이스라엘의 지도자들
  alternatives_korean:
  - 이스라엘의 입법자들
  - 이스라엘의 법을 세우는 자들
  - 이스라엘의 통치자들
  lexicon: HALOT
  rationale: 어근이 ‘새기다/규정하다’와 연관되지만, 본문 맥락에서는 현대적 의미의 입법자보다 공동체를 이끄는 책임자들이라는 뜻이 자연스럽습니다. 영어 POB의 ‘leaders’를 따라 ‘지도자들’로 옮겼습니다.
- source_word: הַמִּתְנַדְּבִים
  english_pob_choice: who volunteered
  chosen_korean: 자원하였기 때문입니다
  alternatives_korean:
  - 기꺼이 몸을 바쳤기 때문입니다
  - 자발적으로 나섰기 때문입니다
  - 기꺼이 자신을 내놓았기 때문입니다
  lexicon: HALOT
  rationale: 히트파엘 분사는 강제되지 않은 자발적 참여를 나타내므로, 현대 한국어의 ‘자원하다’로 간결하게 살렸습니다.
- source_word: בָּעָם
  english_pob_choice: among the people
  chosen_korean: 백성 가운데서
  alternatives_korean:
  - 사람들 가운데서
  - 백성 속에서
  - 민중 가운데서
  lexicon: HALOT
  rationale: 단순히 ‘사람들’보다 이스라엘 공동체 전체를 가리키는 ‘백성’이 문맥에 더 잘 맞고, 전치사 בְּ의 관계도 ‘가운데서’로 자연스럽게 반영됩니다.
- source_word: בָּרֲכוּ
  english_pob_choice: Bless
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 복을 빌어주십시오
  - 복 주십시오
  - 축복하십시오
  lexicon: HALOT
  rationale: 직접 명령형이지만 한국어에서는 하나님께 드리는 반응으로 ‘찬양하십시오’가 가장 자연스럽습니다. 다만 원문의 ‘복을 빌다/축복하다’ 의미는 각주로 보완합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 하나님의 고유명사를 칭호로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: בָּרֲכוּ의 한국어 공적 표현
  chosen_reading: ‘찬양하십시오’는 문맥상 하나님께 향하는 호응을 자연스럽게 드러내는 표현으로 본문에 두고, 동사의 축복/복 빌기 의미는 각주로 보완합니다.
  alternative_readings:
  - 복을 빌어주십시오
  - 축복하십시오
  - 야훼를 송축하십시오
  rationale: 히브리어 ברך는 ‘축복하다/복을 빌다/찬양하다’의 범위를 가지며, 한국어 예배 언어로는 ‘찬양하다’가 가장 읽기 자연스럽습니다. 그러나 원문 동사의 의미 폭을 지우지 않기 위해 주석을 둡니다.
  doctrine_reference: 히브리어 ברך의 의미 범위
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약명 יְהוָה를 직접 사용하므로, 호칭으로 대체하지 않고 고유명사로 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
