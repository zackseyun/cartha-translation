id: JDG.7.12
reference: Judges 7:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִדְיָ֨ן וַ/עֲמָלֵ֤ק וְ/כָל בְּנֵי קֶ֨דֶם֙ נֹפְלִ֣ים בָּ/עֵ֔מֶק כָּ/אַרְבֶּ֖ה לָ/רֹ֑ב וְ/לִ/גְמַלֵּי/הֶם֙ אֵ֣ין מִסְפָּ֔ר כַּ/ח֛וֹל שֶׁ/עַל שְׂפַ֥ת הַ/יָּ֖ם לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Now Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons of the East.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'had fallen' / 'were spread out' in the valley; the Hebrew participle literally means 'falling/fallen' and here describes the army lying encamped.
    reason: lexical_alternative
translation:
  language: ko
  text: 미디안과 아말렉과 모든 동방 사람들이 골짜기에 메뚜기[a]처럼 누워 있었고, 그들의 낙타는 헤아릴 수 없이 많았으니[b], 마치 바닷가의 모래처럼 많았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘동방의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진에 쓰러져 있었습니다’ / ‘펼쳐져 있었습니다’. 히브리어 분사형은 문자적으로는 ‘떨어지는/떨어진’ 뜻이지만, 여기서는 진을 친 군대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק וְכָל בְּנֵי קֶדֶם
  english_pob_choice: Now Midian and Amalek and all the people of the East
  chosen_korean: 미디안과 아말렉과 모든 동방 사람들
  alternatives_korean:
  - 미디안과 아말렉과 모든 동방의 백성
  - 미디안과 아말렉과 동방의 모든 사람들
  lexicon: HALOT
  rationale: בְּנֵי קֶדֶם는 문자적으로는 ‘동방의 아들들’이지만, 집단 표지로서 ‘동방 사람들’이 자연스럽고 본문이 가리키는 민족·지역적 범주를 잘 드러냅니다.
- source_word: נֹפְלִים
  english_pob_choice: were lying
  chosen_korean: 누워 있었고
  alternatives_korean:
  - 엎드려 있었고
  - 쓰러져 있었고
  lexicon: HALOT
  rationale: 동사 נפל의 기본 뜻은 ‘떨어지다/쓰러지다’이지만, 전쟁 진영 맥락에서는 진을 치고 드러누운 상태를 가리키므로 ‘누워 있었고’가 이미지와 상황을 함께 살립니다.
- source_word: כָּאַרְבֶּה לָרֹב
  english_pob_choice: as numerous as locusts
  chosen_korean: 메뚜기처럼
  alternatives_korean:
  - 메뚜기 떼처럼
  - 메뚜기처럼 수많이
  lexicon: HALOT
  rationale: 비교의 핵심은 압도적인 다수이므로, 한국어에서는 앞부분의 ‘메뚜기처럼’으로 시각적 비유를 살리고 뒤의 ‘헤아릴 수 없이 많았으니’로 수량의 강조를 보완했습니다.
- source_word: אֵין מִסְפָּר
  english_pob_choice: were without number
  chosen_korean: 헤아릴 수 없이 많았으니
  alternatives_korean:
  - 셀 수 없을 만큼 많았으니
  - 무수하였으니
  lexicon: HALOT
  rationale: 직역하면 ‘숫자가 없다’이지만, 한국어에서는 수를 셀 수 없음의 의미를 자연스럽게 드러내는 표현이 적절합니다.
theological_decisions:
- issue: 반복적 과장법의 보존
  chosen_reading: 낙타의 수를 ‘헤아릴 수 없이 많았으니’라고 옮겨, 모래 비유와 함께 중첩된 다수 강조를 유지했습니다.
  alternative_readings:
  - 낙타는 셀 수 없었습니다
  - 낙타는 무수했습니다
  rationale: 본문은 메뚜기 비유와 바닷가 모래 비유를 겹쳐 사용해 적군의 압도적 규모를 강조하므로, 그 수사적 과장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 본문 수사 구조 보존
