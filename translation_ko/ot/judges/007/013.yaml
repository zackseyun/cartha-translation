source:
  edition: WLC
  text: וַ/יָּבֹ֣א גִדְע֔וֹן וְ/הִ֨נֵּה אִ֔ישׁ מְסַפֵּ֥ר לְ/רֵעֵ֖/הוּ חֲל֑וֹם וַ/יֹּ֜אמֶר הִנֵּ֧ה חֲל֣וֹם חָלַ֗מְתִּי וְ/הִנֵּ֨ה צלול לֶ֤חֶם שְׂעֹרִים֙ מִתְהַפֵּךְ֙ בְּ/מַחֲנֵ֣ה מִדְיָ֔ן וַ/יָּבֹ֣א עַד הָ֠/אֹהֶל וַ/יַּכֵּ֧/הוּ וַ/יִּפֹּ֛ל וַ/יַּהַפְכֵ֥/הוּ לְ/מַ֖עְלָ/ה וְ/נָפַ֥ל הָ/אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
  footnotes:
  - marker: a
    text: Or “a cake of barley bread” or “a barley loaf.” The Hebrew term translated “round loaf” is rare, and likely refers to a round cake or loaf.
    reason: lexical_alternative
translation:
  language: ko
  text: 기드온이 이르렀을 때, 보라, 한 사람이 자기 동무에게 꿈 이야기를 하고 있었습니다. 그는 말했습니다. “보십시오, 내가 꿈을 꾸었습니다. 보라, 보리 떡 한 덩이가 미디안 진영 안에서 굴러다니다가 장막 앞으로 와서 그것을 쳐서 쓰러뜨렸습니다. 그는 그것을 뒤집어 놓았고, 장막은 무너졌습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보리 떡 한 덩이’는 히브리어의 희귀한 표현을 반영한 번역입니다. 정확한 형태는 둥근 떡 또는 빵 덩이일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: When Gideon came
  chosen_korean: 기드온이 이르렀을 때
  alternatives_korean:
  - 그리고 기드온이 왔을 때
  - 기드온이 오자마자
  lexicon: HALOT
  rationale: 문맥상 다음 사건의 배경을 여는 시간절로 처리해 한국어에서 자연스러운 종속절로 옮겼습니다.
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  english_pob_choice: was telling a dream to his companion
  chosen_korean: 자기 동무에게 꿈 이야기를 하고 있었습니다
  alternatives_korean:
  - 자기 동료에게 꿈을 말하고 있었습니다
  - 자기 친구에게 꿈을 이야기하고 있었습니다
  lexicon: HALOT
  rationale: רֵעַ는 여기서 군영 맥락의 동료를 가리키므로 ‘동무’가 지나친 친밀화 없이 관계를 잘 드러냅니다.
- source_word: צלול לֶחֶם שְׂעֹרִים
  english_pob_choice: a round loaf of barley bread
  chosen_korean: 보리 떡 한 덩이
  alternatives_korean:
  - 둥근 보리떡 한 덩이
  - 보리빵 한 덩이
  lexicon: HALOT
  rationale: 희귀어라 형태를 단정하기 어려우므로, 핵심 의미인 보리로 된 떡을 살리되 ‘한 덩이’로 덩어리감과 부피를 표현했습니다.
- source_word: בְּמַחֲנֵה מִדְיָן
  english_pob_choice: in the camp of Midian
  chosen_korean: 미디안 진영 안에서
  alternatives_korean:
  - 미디안 진영에서
  - 미디안 진영 속에서
  lexicon: HALOT
  rationale: הבְּ는 기본적으로 ‘안에서’의 의미를 가지므로, 진영 내부의 장면성을 살려 옮겼습니다.
- source_word: מִתְהַפֵּךְ
  english_pob_choice: was rolling around
  chosen_korean: 굴러다니다가
  alternatives_korean:
  - 구르다가
  - 뒤집히며
  lexicon: HALOT
  rationale: 히트파엘의 반복적 회전/구름을 한국어 동작상으로 살리면서, 다음 절의 충돌로 이어지는 흐름을 자연스럽게 했습니다.
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה
  english_pob_choice: He turned it upside down
  chosen_korean: 그것을 뒤집어 놓았고
  alternatives_korean:
  - 그것을 거꾸로 뒤집었고
  - 그것을 뒤집어 올렸고
  lexicon: HALOT
  rationale: 직역보다 사건의 결과를 명확히 보여 주는 표현을 택하되, 원문의 ‘뒤집음’ 이미지는 유지했습니다.
- source_word: וְנָפַל הָאֹהֶל
  english_pob_choice: the tent collapsed
  chosen_korean: 장막은 무너졌습니다
  alternatives_korean:
  - 장막이 쓰러졌습니다
  - 장막이 넘어졌습니다
  lexicon: HALOT
  rationale: 마지막 결과절은 단순히 ‘떨어졌다’보다 구조가 무너지는 이미지를 주는 ‘무너졌다’가 원문의 파괴적 종결을 잘 반영합니다.
theological_decisions:
- issue: 꿈의 상징성과 서술 톤
  chosen_reading: 본문은 해석을 덧붙이지 않고, 보리 떡이 장막을 무너뜨리는 꿈의 장면 자체를 생생하게 전달합니다.
  alternative_readings:
  - 상징을 미리 풀어 주는 의역
  - 표현을 약화시켜 단순한 우연한 꿈처럼 보이게 하는 번역
  rationale: 이 절은 예언적 해석의 도입부이므로, 상징의 힘을 유지하고 독자가 다음 문맥에서 의미를 읽도록 두는 것이 소스에 충실합니다.
  doctrine_reference: 서사 문맥 보존
- issue: 직접화법의 문체
  chosen_reading: 꿈 이야기 부분은 보고체에서 직접화법으로 자연스럽게 전환해, 깨어 있는 증언처럼 들리도록 했습니다.
  alternative_readings:
  - 전체를 평서문으로 평탄화
  - 인용부를 낮춘 간접화법
  rationale: 히브리어의 생생한 화법을 살려 장면 전환과 긴박감을 전달하는 편이 원문의 수사와 맞습니다.
  doctrine_reference: 서사 수사 보존
