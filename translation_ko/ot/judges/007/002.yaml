source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
  footnotes:
  - marker: a
    text: Or 'into their hands.' Hebrew idiom often uses singular 'hand' for power or control.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliver me.' The Hebrew verb can mean 'save' or 'deliver.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 기드온에게 말씀하셨습니다. 「너와 함께한 백성이 너무 많아서 내가 그들의 손에 미디안을 넘겨줄 수 없다. 그렇지 않으면 이스라엘이 나를 거슬러 자랑하며 ‘내 손이 나를 구원했다’ 하고 말할 것이다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘손’은 복수로도 이해될 수 있지만, 본문은 단수 ‘손’ 관용구를 사용합니다.
    reason: alternative_reading
  - marker: b
    text: 동사는 ‘구원하다’와 ‘구해내다/건져내다’의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms; transliteration of the divine name
  rationale: 본문의 고유 신명은 번역어가 아니라 음역으로 살려야 하므로, POB의 기준에 따라 야훼로 옮겼습니다.
- source_word: רַב הָעָם
  english_pob_choice: The people who are with you are too many
  chosen_korean: 너와 함께한 백성이 너무 많아서
  alternatives_korean:
  - 너와 함께한 백성이 많아서
  - 너와 함께한 사람들이 너무 많아서
  lexicon: HALOT
  rationale: 직역의 ‘많다’보다, 뒤따르는 목적/결과절과 함께 수량이 과도하다는 뜻을 드러내는 ‘너무 많아서’가 본문의 논리를 잘 살립니다.
- source_word: בְּיָדָם
  english_pob_choice: into their hand
  chosen_korean: 그들의 손에
  alternatives_korean:
  - 그들의 손 안에
  - 그들의 손으로
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 관용구를 보존하되, 한국어에서는 자연스럽게 ‘손에’로 옮겨 권세와 통제의 의미를 살렸습니다.
- source_word: יִתְפָּאֵר עָלַי
  english_pob_choice: boast against me
  chosen_korean: 나를 거슬러 자랑하며
  alternatives_korean:
  - 나를 거슬러 뽐내며
  - 내게 맞서 자랑하며
  lexicon: HALOT
  rationale: 동사의 자랑/자기과시 의미와 עַל의 대립 방향을 함께 살리기 위해, 단순한 ‘자랑하다’보다 ‘나를 거슬러 자랑하다’로 옮겼습니다.
- source_word: הוֹשִׁיעָה לִּי
  english_pob_choice: has saved me
  chosen_korean: 나를 구원했다
  alternatives_korean:
  - 나를 구해냈다
  - 나를 구했다
  lexicon: HALOT
  rationale: ישׁע의 구원/구출 의미를 반영하되, 이 구절의 신학적 대비를 살리기 위해 ‘구원했다’를 택했습니다.
theological_decisions:
- issue: 이스라엘의 단수 집합 표현
  chosen_reading: ‘이스라엘이 … 말할 것이다’로 단수형을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 사람들이 … 말할 것이다’
  - ‘이스라엘 백성이 … 말할 것이다’
  rationale: 히브리어는 이스라엘을 단수 집합명사처럼 다루므로, 주어와 발화의 단수성을 유지해 본문의 시각을 보존했습니다.
  doctrine_reference: 원문 우선 및 신학적 긴장 보존 원칙
