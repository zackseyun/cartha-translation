  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
  footnotes:
  - marker: a
    text: Or “by En-harod.” The Hebrew name literally includes the word for “spring.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여루바알—곧 기드온—과 그와 함께한 모든 백성이 일찍 일어나 하롯 샘 가에 진을 쳤습니다. 미디안 진은 그의 북쪽, 곧 골짜기에 있는 모레 언덕 곁에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “엔하롯 곁.” 히브리어 지명에는 문자적으로 ‘샘’이라는 말이 포함되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어났습니다
  - 일찍 일어났습니다
  lexicon: HALOT
  rationale: 히필 완료형의 관용적 의미인 ‘일찍 일어나다’를 자연스러운 현대 한국어로 살렸습니다.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  english_pob_choice: Jerubbaal (that is, Gideon)
  chosen_korean: 여루바알—곧 기드온—
  alternatives_korean:
  - 여루바알(즉 기드온)
  - 여루바알, 곧 기드온
  lexicon: HALOT
  rationale: 설명적 동격을 한국어에서 흔한 ‘곧’으로 옮겨 두 이름의 동일 인물을 분명히 했습니다.
- source_word: עַל עֵין חֲרֹד
  english_pob_choice: by the spring of Harod
  chosen_korean: 하롯 샘 가
  alternatives_korean:
  - 하롯 샘 곁
  - 하롯 우물 가
  lexicon: HALOT
  rationale: עֵין의 ‘샘’ 의미를 살리고, 지명 요소를 보존하되 한국어에서 자연스러운 위치 표현으로 ‘가’를 사용했습니다.
- source_word: הָיָה לוֹ / מִצָּפוֹן
  english_pob_choice: was north of him
  chosen_korean: 그의 북쪽
  alternatives_korean:
  - 그들 북쪽
  - 그의 북편
  lexicon: HALOT
  rationale: 히브리어 단수 לוֹ를 그대로 반영해 ‘그의’로 두었고, 관계를 간결하게 드러내기 위해 ‘북쪽’으로 옮겼습니다.
- source_word: מִגִּבְעַת הַמּוֹרֶה בָּעֵמֶק
  english_pob_choice: by the hill of Moreh in the valley
  chosen_korean: 골짜기에 있는 모레 언덕 곁
  alternatives_korean:
  - 골짜기의 모레 언덕 곁
  - 골짜기 안 모레 언덕 곁
  lexicon: HALOT
  rationale: 지형 설명의 순서를 한국어 어순에 맞춰 정리하되, ‘in the valley’를 ‘골짜기에 있는’으로 명시해 위치 관계를 보존했습니다.
theological_decisions:
- issue: לוֹ의 지시 대상과 단수 유지
  chosen_reading: ‘그의’는 기드온을 대표 인물로 삼는 히브리어 단수 지시를 따라 유지했습니다.
  alternative_readings:
  - ‘그들의’로 집합적으로 완화
  - ‘그들’로 주어 전체에 맞춰 조정
  rationale: 본문은 단수 לוֹ를 사용하므로, 군대 전체를 가리키는 식으로 평탄화하지 않고 대표 인물 기드온에 결속된 공간 관계를 살렸습니다.
  doctrine_reference: 본문 문법/서술 시점의 정확성
