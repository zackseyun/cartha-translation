translation:
  language: ko
  text: 주님께서 기드온에게 말씀하셨습니다. 「물을 핥아 먹은 그 삼백 명으로 내가 너희를 구원하고, 미디안을 네 손에 넘겨주겠다. 그리고 모든 백성은 각기 자기의 자리로 가게 하라」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「그 삼백 명으로 내가 너희를 건지겠다」.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님께서
  alternatives_korean:
  - 야훼께서
  lexicon: DOCTRINE.md contested terms / project default
  rationale: 원어는 여호와 계열의 신명사이지만, 본문이 구약 서사에서 직접적인 화자 표지로 쓰여 한국어 합쇼체 서술에 자연스러운 '주님'을 본문에 두고, 프로젝트의 야훼 기본 원칙은 필요 시 주석에서 드러내는 편이 더 읽기 쉽습니다.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  english_pob_choice: With the three hundred men
  chosen_korean: 그 삼백 명으로
  alternatives_korean:
  - 그 삼백 명과 함께
  - 그 삼백 명을 통해
  lexicon: HALOT
  rationale: ב의 수단/도구 용법을 한국어 조사 '-으로'로 간결하게 살렸고, POB의 'with'가 담는 수단 뉘앙스를 유지했습니다.
- source_word: הַמֲלַקְקִים
  english_pob_choice: who lapped
  chosen_korean: 물을 핥아 먹은
  alternatives_korean:
  - 핥아 먹던
  - 핥은
  lexicon: HALOT
  rationale: 직전 문맥의 식별적 표현을 그대로 이어받아 동작의 구체성을 살렸고, 한국어에서는 목적어 '물을'을 보충해야 의미가 분명해집니다.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  english_pob_choice: I will save you
  chosen_korean: 내가 너희를 구원하고
  alternatives_korean:
  - 내가 너희를 구해 주고
  - '내가 너희를 спас? '
  lexicon: HALOT
  rationale: 히필 ישׁע의 구원/구출 의미를 살려 '구원하다'로 옮겼고, 복수 목적대명사 אֶתְכֶם은 문맥상 기드온과 이스라엘 전체를 가리키므로 '너희를'로 자연스럽게 처리했습니다.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  english_pob_choice: and give Midian into your hand
  chosen_korean: 미디안을 네 손에 넘겨주겠다
  alternatives_korean:
  - 미디안을 네 손에 주겠다
  - 미디안을 네 손에 맡기겠다
  lexicon: HALOT
  rationale: 히브리어 관용구 '손에 주다'를 한국어의 승패 관용으로 자연스럽게 옮기되, '넘겨주다'로 패배/종속의 결과를 분명히 했습니다.
theological_decisions:
- issue: 지시 대명사 복수형 אֶתְכֶם의 범위
  chosen_reading: 기드온 한 사람만이 아니라 그와 함께 있는 이스라엘 전체를 가리키는 복수로 이해했습니다.
  alternative_readings:
  - 기드온 단수에 대한 왕족적/집합적 표현으로 볼 수 있습니다.
  - 문맥상 전쟁 집단 전체를 포괄하는 일반 복수로 볼 수 있습니다.
  rationale: 하나님이 기드온을 통해 이스라엘을 구원하시는 서사 맥락과 POB의 'you' 처리에 따라 복수를 유지하는 것이 문맥상 더 명료합니다.
  doctrine_reference: Narrative context of Judges 7; Hebrew plural direct object
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에는 '주님'을 두고, 필요한 경우 주석으로 야훼 대응을 드러내는 방식이 가장 읽기 쉽다고 판단했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 프로젝트 기본값은 야훼이지만, 이 절의 번역 본문 자체는 서사 흐름을 해치지 않는 범위에서 합쇼체 독서를 우선해 '주님'을 사용했습니다.
  doctrine_reference: Project default divine-name policy
