- from: 그때 그 세 무리는 나팔을 불고 항아리들을 깨뜨렸습니다. 그들은 왼손에는 횃불을, 오른손에는 나팔을 잡고 불기 위해[a], 외쳤습니다. "야훼를 위한 칼과 기드온을 위한 칼이다!"
  to: 그때 그 세 무리는 나팔을 불고 항아리들을 깨뜨렸습니다. 그들은 왼손에 횃불을 들고, 오른손에 든 나팔을 불며 외쳤습니다. “야훼와 기드온을 위한 칼이다!”[a]
  rationale: 전투 구호의 단수 명사를 보존하고, לְ의 직접적인 방향성을 ‘~을 위한’으로 유지했습니다. 전통적 소유격 이해는 각주로 제시했습니다. 또한 각주 표지를 그 대안이 적용되는 구호에 옮기고, 나팔을 부는 동작과 외침의 연결을 자연스러운 현대 한국어로 다듬었습니다.
