  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
  footnotes:
  - marker: a
    text: Or, “The sword of the LORD and of Gideon!”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 그 세 무리는 나팔을 불고 항아리들을 깨뜨렸습니다. 그들은 왼손에는 횃불을, 오른손에는 나팔을 잡고 불기 위해[a], 외쳤습니다. "야훼를 위한 칼과 기드온을 위한 칼이다!"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 칼은 야훼와 기드온의 것이다!”
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  english_pob_choice: the three companies
  chosen_korean: 그 세 무리
  alternatives_korean:
  - 세 부대
  - 세 구역
  lexicon: HALOT
  rationale: 전투 문맥에서 רָאשִׁים는 문자적인 ‘머리들’이 아니라 기드온이 나눈 세 집단을 가리키므로, 한국어에서는 자연스럽고 군사적 뉘앙스를 살리는 ‘무리’가 적절합니다.
- source_word: שׁוֹפָרוֹת
  english_pob_choice: trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 쇼파르
  - 뿔나팔
  lexicon: HALOT
  rationale: 여기서는 신호를 위한 악기라는 기능이 핵심이므로, 직역 음역보다 한국어 성경 문맥에서 자연스러운 ‘나팔’을 사용했습니다.
- source_word: וַיַּחֲזִיקוּ
  english_pob_choice: They held
  chosen_korean: 잡고
  alternatives_korean:
  - 붙들고
  - 쥐고
  lexicon: HALOT
  rationale: 동사의 핵심은 손에 든 채 유지하는 동작이므로, 과도한 힘의 뉘앙스를 더하지 않는 ‘잡고’가 가장 자연스럽습니다.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  english_pob_choice: A sword for Yahweh and for Gideon!
  chosen_korean: 야훼를 위한 칼과 기드온을 위한 칼이다!
  alternatives_korean:
  - 야훼의 칼과 기드온의 칼이다!
  - 야훼를 위한 칼이요 기드온을 위한 칼이다!
  lexicon: HALOT
  rationale: 히브리어는 생략된 서술 구조의 전투 구호이므로, לְ의 방향성을 살려 ‘~를 위한 칼’로 옮겨 구호의 압축성과 급박함을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이 본문에서 신명은 титular ‘주’로 완화하지 않고 고유명사로 드러내는 것이 원문에 더 가깝기 때문에, 프로젝트 기본값인 ‘야훼’를 따랐습니다.
theological_decisions:
- issue: 전투 구호 חֶרֶב לַיהוָה וּלְגִדְעוֹן의 압축된 의미
  chosen_reading: “야훼를 위한 칼과 기드온을 위한 칼이다!”
  alternative_readings:
  - “야훼의 칼과 기드온의 칼이다!”
  - “야훼와 기드온의 칼이다!”
  rationale: 히브리어의 짧고 단호한 외침을 살리되, לְ를 소유격으로 풀어버리면 구호의 방향성과 긴장감이 약해질 수 있어 ‘위한’으로 유지했습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; YHWH rendering policy'
