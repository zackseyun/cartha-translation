  lexicon: HALOT
  rationale: 핵심은 무릎을 꿇지 않고 손으로 물을 떠 입으로 가져오는 동작 대비이므로, ‘손으로… 물을 떠서 핥는’으로 신체 동작의 생생함을 살렸습니다.
