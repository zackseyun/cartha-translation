  source_fidelity: 본문의 대조 구조와 수량, 그리고 ‘물을 마시려고 무릎을 꿇었다’는 목적 표현은 대체로 충실합니다. 그러나 현행 ‘자기 입에 물을 떠서 핥는’은 물을 입 안으로 ‘뜨는’ 듯한 어색한 결합이 되어, 손으로 물을 떠 입으로 가져가는 동작을 더 분명히 표현하는 편이 좋습니다.
  naturalness: 합쇼체와 전반적 문체는 적절합니다. 다만 ‘손으로 자기 입에 물을 떠서 핥는 사람’은 현대 한국어에서 다소 부자연스럽습니다. ‘손으로 물을 떠 입으로 가져가 핥아 마신 사람들’이 동작의 순서와 대조를 자연스럽게 드러냅니다.
  terminology: ‘백성’, ‘삼백 명’, ‘무릎을 꿇었습니다’는 문맥과 격식에 맞습니다. 각주에서 ‘직역하면’이라고 하면서 ‘그들의 손에서 그들의 입으로’를 제시한 것은 히브리어 전치사 בְ의 가능한 해석 중 하나를 직역으로 단정하는 표현이므로, 대안 번역으로 제시해야 합니다.
