  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
  footnotes:
  - marker: a
    text: Or, 'from their hand to their mouth.' The Hebrew phrase emphasizes that they brought the water up by hand rather than kneeling to drink directly.
    reason: lexical_alternative
translation:
  language: ko
  text: 손으로 자기 입에 물을 떠서 핥는 사람의 수는 삼백 명이었고, 나머지 모든 백성은 물을 마시려고 무릎을 꿇었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 손에서 그들의 입으로’로도 옮길 수 있습니다. 히브리어 표현은 무릎을 꿇어 직접 마시지 않고 손으로 물을 떠 입으로 가져오는 동작을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  english_pob_choice: the number of
  chosen_korean: 사람의 수는
  alternatives_korean:
  - 수는
  - 인원은
  lexicon: HALOT
  rationale: 행동 주체를 세는 표현이므로 자연스럽고 공식적인 ‘사람의 수는’으로 옮겨 수량 정보를 분명히 했습니다.
- source_word: הַמֲלַקְקִים בְּיָדָם אֶל פִּי־הֶם
  english_pob_choice: those lapping with their hand to their mouth
  chosen_korean: 손으로 자기 입에 물을 떠서 핥는
  alternatives_korean:
  - 손으로 입에 물을 떠서 핥는
  - 손으로 자기 입으로 핥아 마시는
  lexicon: HALOT
  rationale: 핵심은 무릎을 꿇지 않고 손으로 물을 떠 입으로 가져오는 동작 대비이므로, ‘손으로… 물을 떠서 핥는’으로 신체 동작의 생생함을 살렸습니다.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  english_pob_choice: three hundred men
  chosen_korean: 삼백 명이었고
  alternatives_korean:
  - 삼백 사람이었고
  - 삼백 남자였고
  lexicon: HALOT
  rationale: 군사적 문맥에서 ‘명’이 가장 자연스럽고, 뒤의 ‘백성’과도 어색하지 않게 맞습니다.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  english_pob_choice: knelt on their knees
  chosen_korean: 무릎을 꿇었습니다
  alternatives_korean:
  - 무릎을 꿇고
  - 무릎에 꿇어
  lexicon: HALOT
  rationale: 히브리어의 자세 동작을 직접적으로 옮기되, 한국어에서 중복감이 큰 ‘무릎 위에’는 생략하고 간결하게 표현했습니다.
- source_word: לִשְׁתּוֹת מָיִם
  english_pob_choice: to drink water
  chosen_korean: 물을 마시려고
  alternatives_korean:
  - 물을 마시기 위해
  - 물을 마시도록
  lexicon: HALOT
  rationale: 목적의 부정사 기능을 자연스러운 한국어 목적 표현으로 옮겼고, ‘물’은 본문에 있는 구체성을 유지했습니다.
