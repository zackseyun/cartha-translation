  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣א גִ֠דְעוֹן וּ/מֵאָה אִ֨ישׁ אֲשֶׁר אִתּ֜/וֹ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה רֹ֚אשׁ הָ/אַשְׁמֹ֣רֶת הַ/תִּֽיכוֹנָ֔ה אַ֛ךְ הָקֵ֥ם הֵקִ֖ימוּ אֶת הַ/שֹּֽׁמְרִ֑ים וַֽ/יִּתְקְעוּ֙ בַּ/שּׁ֣וֹפָר֔וֹת וְ/נָפ֥וֹץ הַ/כַּדִּ֖ים אֲשֶׁ֥ר בְּ/יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
  footnotes:
  - marker: a
    text: Or 'the middle night watch' or 'the second watch.' The Hebrew refers to a division of the night.
    reason: lexical_alternative
  - marker: b
    text: Or 'they had just set the watchmen' or 'they had stationed the guards.' The Hebrew construction emphasizes the action of posting the watch.
    reason: lexical_alternative
  - marker: c
    text: Hebrew shofarot, traditionally 'trumpets,' more specifically horns used for signaling.
    reason: cultural_note
translation:
  language: ko
  text: 기드온과 그와 함께한 백 명은 진영 가장자리로 갔는데, 바로 중간 경계의 시작 때였고 — 마침 그들이 파수꾼들을 세워 두었을 때였습니다[a][b]. 그들이 나팔을 불고 손에 들고 있던 항아리들을 깨뜨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 밤을 나눈 경계의 한 구간을 가리킵니다. ‘중간 경계’는 이를 직역한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘세워 두었을 때’는 ‘그들이 파수꾼들을 세웠다’는 완료 배경을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  english_pob_choice: to the edge of the camp
  chosen_korean: 진영 가장자리로
  alternatives_korean:
  - 진영 끝으로
  - 진영 바깥쪽으로
  - 진영 가장자리까지
  lexicon: HALOT
  rationale: קָצֶה는 ‘끝, 가장자리’의 뜻이므로 군사적 맥락에서 ‘진영 가장자리’가 가장 자연스럽고 원문 공간감을 잘 살립니다.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  english_pob_choice: at the beginning of the middle watch
  chosen_korean: 중간 경계의 시작 때
  alternatives_korean:
  - 중간 보초의 시작 때
  - 가운데 경계의 시작 무렵
  - 중간 야경의 시작 때
  lexicon: HALOT
  rationale: אַשְׁמֹרֶת은 밤의 순번 경계를 가리키므로 ‘경계’로 옮기고, רֹאשׁ의 시간적 용법은 ‘시작 때’로 풀어 원문의 시점 표시를 유지했습니다.
- source_word: הָקֵם הֵקִימוּ אֶת הַשֹּׁמְרִים
  english_pob_choice: they had posted the watchmen
  chosen_korean: 그들이 파수꾼들을 세워 두었을 때
  alternatives_korean:
  - 그들이 파수꾼들을 배치해 두었을 때
  - 그들이 보초들을 세워 놓았을 때
  - 그들이 경비들을 세웠을 때
  lexicon: HALOT
  rationale: 동사의 강조형 구조는 ‘이미 세워 둔’ 배경 동작을 나타내므로, 완료 배경을 드러내는 ‘세워 두었을 때’로 옮겼습니다. '파수꾼'은 שׁמר의 감시·보초 의미를 살립니다.
- source_word: שׁוֹפָרוֹת
  english_pob_choice: trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 뿔나팔
  - 뿔
  - 트럼펫
  lexicon: HALOT
  rationale: שׁוֹפָר은 신호용 뿔이지만 한국어 성경에서 기능적으로는 ‘나팔’이 가장 자연스럽고 읽기 쉽습니다. 다만 원문의 신호 악기라는 점은 유지됩니다.
