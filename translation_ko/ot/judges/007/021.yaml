revisions:
- from: 그가 자기 자리에 서서 진영 사방에 있었고, 온 진영은 달려들며 소리치고 도망쳤습니다.[a]
  to: 각 사람은 자기 자리에서 진영을 둘러싸고 서 있었고, 진영 전체가 달리고 소리치며[a] 도망쳤습니다.
  rationale: 분배적 표현 ‘각 사람’을 복원하고, 이들이 진영 둘레에서 각자의 위치를 지킨 공간 관계를 자연스럽게 옮겼습니다. ‘달려들며’를 중립적인 ‘달리고’로 고쳐 원문의 רוץ를 보존했습니다. ‘소리치며’는 전투 함성과 공포의 외침 사이의 어휘적 중의성을 유지하며, 관련 각주를 해당 어휘에 직접 연결했습니다.
