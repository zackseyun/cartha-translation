  naturalness: ‘각 사람이 자기 자리에 서서 진영 둘레에 있었고’는 한국어에서 다소 겹치고 어색합니다. ‘각 사람은 자기 자리에서 진영을 둘러싸고 서 있었고’가 공간 관계와 문장 흐름을 자연스럽게 드러냅니다.
  terminology: ‘진영’은 מַחֲנֶה에 적절합니다. ריע의 의미 범위를 보존하기 위해 ‘소리치며’를 유지하고, 전투 함성 또는 공포의 외침일 수 있음을 각주로 밝힙니다.
