source:
  edition: WLC
  text: וַ/יַּֽעַמְדוּ֙ אִ֣ישׁ תַּחְתָּ֔י/ו סָבִ֖יב לַֽ/מַּחֲנֶ֑ה וַ/יָּ֧רָץ כָּל הַֽ/מַּחֲנֶ֛ה וַ/יָּרִ֖יעוּ ו/יניסו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/021.yaml
  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
  footnotes:
  - marker: a
    text: Or 'they raised a war cry and fled.' The verb translated 'shouted' can refer to a loud cry in battle or panic.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 사람은 자기 자리에서 진영을 둘러싸고 서 있었고, 진영 전체가 달리고 소리치며[a] 도망쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁 함성을 올리며’. ‘소리치며’로 번역한 동사는 전투의 함성이나 공포에 질린 외침을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ / אִישׁ תַּחְתָּיו
  english_pob_choice: each man stood in his place
  chosen_korean: 그가 자기 자리에 서서
  alternatives_korean:
  - 각 사람이 자기 자리에 서서
  - 각자 제자리에 서서
  lexicon: HALOT
  rationale: אִישׁ תַּחְתָּיו의 관용적 뜻인 ‘자기 자리/자기 위치’를 한국어로 자연스럽게 살리되, 분산된 각 사람의 위치감을 유지했습니다.
- source_word: סָבִיב לַמַּחֲנֶה
  english_pob_choice: around the camp
  chosen_korean: 진영 사방에
  alternatives_korean:
  - 진영을 둘러
  - 진영 둘레에
  lexicon: HALOT
  rationale: סָבִיב의 ‘주위를 에워싼’ 공간적 이미지를 간결하게 표현했습니다.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  english_pob_choice: the whole camp ran
  chosen_korean: 온 진영은 달려들며
  alternatives_korean:
  - 온 진영이 달렸고
  - 온 진영이 뛰어다녔고
  lexicon: HALOT
  rationale: רץ의 기본 의미를 살리되, 이 구절의 혼란스러운 상황을 반영해 단순한 이동보다 급박한 돌진의 뉘앙스를 담았습니다.
- source_word: וַיָּרִיעוּ
  english_pob_choice: they shouted
  chosen_korean: 소리치고
  alternatives_korean:
  - 함성을 지르고
  - 전쟁 함성을 외치고
  lexicon: HALOT
  rationale: רוע/ריע의 의미 범위가 전투 함성부터 공포의 외침까지 넓으므로, POB의 의도대로 그 긴장을 열어 두는 일반적 표현을 택했습니다.
theological_decisions:
- issue: 전쟁 함성인지 공포의 외침인지의 중의성
  chosen_reading: ‘소리치고 도망쳤습니다’로 옮겨, 외침의 성격을 단정하지 않고 본문이 의도하는 공황을 드러냈습니다.
  alternative_readings:
  - ‘전쟁 함성을 지르고 도망쳤습니다’
  - ‘비명을 지르고 도망쳤습니다’
  rationale: 영문 POB가 ‘shouted’로 번역하면서 주석에서 전투 함성과 공황의 양쪽 가능성을 열어 두었으므로, 본문도 같은 긴장을 보존해야 합니다.
  doctrine_reference: 본문 서술의 역사성 유지와 어휘적 중의성 보존
- issue: ‘모든 진영’의 집단적 붕괴 묘사
  chosen_reading: ‘온 진영’으로 집단 전체의 동시적 붕괴를 간명하게 살렸습니다.
  alternative_readings:
  - ‘진영 전체가’
  - ‘모든 군대가’
  rationale: 히브리어의 총칭적 표현을 그대로 살리면서도, 이야기 흐름에 맞는 간결한 한국어로 옮겼습니다.
  doctrine_reference: 서사 본문의 집단적 행동 묘사
