source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''into your hand,'' an idiom meaning into your power or control.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 밤, 야훼께서 그에게 말씀하셨습니다. “일어나 그 진영으로 내려가십시오. 내가 그 진영을 네 손에[a] 넘겨주었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘네 손에’는 어떤 대상을 자신의 힘이나 통제 아래에 두는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽ/יְהִי֙
  english_pob_choice: And it happened
  chosen_korean: 그날 밤에
  alternatives_korean:
  - 그리고 그것이 일어났습니다
  - 그날 밤에 그런 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 서술 도입 기능은 한국어에서 자연스러운 시간 부사구로 옮기는 것이 가장 매끄러워, 서술 전환을 살리면서도 불필요한 직역투를 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유 신명은 관례적 대체어가 아니라 음역인 야훼로 옮겨, 본문이 지닌 인격적 이름의 성격을 보존했습니다.
- source_word: קוּם רֵד
  english_pob_choice: Arise, go down
  chosen_korean: 일어나 … 내려가라
  alternatives_korean:
  - 일어나 … 가라
  - 일어나 … 내려오라
  lexicon: HALOT
  rationale: 급박한 신적 명령의 연속성을 살리기 위해 동사 두 개를 분리해 표현했고, רֵד의 하향 이동은 ‘내려가라’가 가장 직접적입니다.
- source_word: בַּמַּחֲנֶה
  english_pob_choice: into the camp
  chosen_korean: 그 진영으로
  alternatives_korean:
  - 진영 안으로
  - 그 군대로
  lexicon: HALOT
  rationale: 전치사 ב의 방향성을 한국어의 목적격 이동 표현으로 자연스럽게 살리되, 군사적 맥락을 드러내는 ‘진영’을 유지했습니다.
- source_word: נְתַתִּיו בְּיָדֶךָ
  english_pob_choice: I have given it into your hand
  chosen_korean: 내가 그것을 네 손에 넘겨주었다
  alternatives_korean:
  - 내가 그것을 네 권세 아래 두었다
  - 내가 그것을 네 손에 주었다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리 관용구는 주권과 지배권을 뜻하므로, 직역을 유지하되 한국어에서 그 의미가 분명하도록 ‘넘겨주었다’를 더했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신적 칭호가 아니라 고유한 언약명을 직접 사용하므로, 대체 번역보다 야훼가 원문 대비를 가장 분명하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘네 손에’ 관용구의 의미 처리
  chosen_reading: 권세/통제의 의미를 암시하되 본문에는 관용구를 유지함
  alternative_readings:
  - 그냥 ‘네 손에’로만 두기
  - 의미만 풀어 ‘네 권세에’로 바꾸기
  rationale: 히브리어의 신학적·수사적 관용구를 보존하면서도, 한국어 독자가 실제 의미를 오해하지 않도록 본문과 주석 기능의 균형을 맞췄습니다.
  doctrine_reference: 'POB translation principle: maintain source idiom while making auditable meaning explicit'
