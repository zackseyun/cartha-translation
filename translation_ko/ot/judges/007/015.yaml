  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: ko
  text: 기드온이 꿈 이야기와 그 해석을 듣고, 엎드려 경배했습니다. 그런 다음 그는 이스라엘의 진영으로 돌아와 말했습니다. “일어나십시오. 야훼께서 미디안 진영을 여러분의 손에 넘기셨습니다.”
  philosophy: formal
lexical_decisions:
- source_word: וַיִּשְׁתָּחוּ
  english_pob_choice: he bowed down in worship
  chosen_korean: 엎드려 경배했습니다
  alternatives_korean:
  - 절했습니다
  - 경배했습니다
  lexicon: השתחוה
  rationale: 단순한 ‘절하다’보다 예배적 굴복과 경배를 함께 드러내는 표현이므로, POB의 ‘bowed down in worship’을 한국어로 직접 반영했습니다.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  english_pob_choice: the camp of Israel
  chosen_korean: 이스라엘의 진영
  alternatives_korean:
  - 이스라엘 진영
  - 이스라엘의 진
  lexicon: מחנה
  rationale: 군사적 야영지라는 구체성을 살려 ‘진영’으로 옮겼습니다.
- source_word: קוּמוּ
  english_pob_choice: Get up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나라
  - 일어나십시오
  lexicon: קום
  rationale: 문맥상 즉각적 행동을 촉구하는 명령이며, 공개 발화의 합쇼체로 자연스럽게 전달하기 위해 ‘일어나십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 히브리어 고유명사 יהוה를 직접 반영하는 프로젝트 기본값을 따랐습니다.
theological_decisions:
- issue: 기드온의 경배 행위의 성격
  chosen_reading: 기드온은 단순한 경례가 아니라, 꿈의 해석을 듣고 하나님 앞에 엎드려 경배한 것으로 옮겼습니다.
  alternative_readings:
  - 그가 단지 몸을 굽혔다고만 옮김
  - 그가 감사의 표시를 했다고 완화하여 옮김
  rationale: 동사가 가진 예배적 함의를 약화하지 않고, 서사 속에서 야훼의 개입을 인식하는 반응으로 보이게 했습니다.
  doctrine_reference: 하나님의 주권과 응답으로서의 경배
- issue: 야훼의 직접 발화에서의 호칭과 명령
  chosen_reading: 본문의 ‘the LORD’는 야훼로 옮기고, 명령문은 청중에게 직접 주는 촉구로 ‘일어나십시오’로 처리했습니다.
  alternative_readings:
  - the LORD를 주님으로 둠
  - 명령을 평서형으로 완화함
  rationale: 원문 서술의 긴박성과 신적 권위가 드러나도록, 히브리어 고유명사와 명령형의 힘을 보존했습니다.
  doctrine_reference: 언약 하나님이 전쟁의 승리를 주시는 주권
