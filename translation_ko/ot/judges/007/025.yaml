  source_fidelity: 개정이 필요합니다. 초안의 ‘오렙은 … 죽였고, 스엡은 … 죽였습니다’는 한국어 문법상 오렙과 스엡이 다른 이를 죽인 것처럼 읽힐 수 있으나, 히브리어는 그들이 오렙과 스엡을 죽였다고 말합니다. 마지막 전치사구는 기드온의 위치를 수식할 가능성도 있으므로 이를 본문과 각주에서 보존해야 합니다.
  naturalness: ‘오렙을 … 죽이고 스엡을 … 죽였습니다’가 행위자와 피행위자를 명료하게 하면서 자연스럽습니다. ‘포도즙 틀’보다 ‘포도주 틀’이 יֶקֶב(포도 압착 시설)를 가리키는 현대 한국어 성경 문맥에서 더 자연스럽습니다.
  terminology: ‘방백’은 שָׂרֵי의 높은 지위를 반영할 수 있어 유지 가능합니다. 인명 ‘오렙’과 ‘스엡’도 일관되게 유지합니다. 영어 감사 기록의 요단 관련 대안은 한국어 각주로 반영합니다.
  issues:
  - severity: high
    issue: 오렙과 스엡을 죽인 주체가 문법적으로 뒤바뀌어 보임
