source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
  footnotes:
  - marker: a
    text: Oreb is related to the Hebrew word for 'raven,' and Zeeb to the word for 'wolf,' but both are rendered as personal names in the main text.
    reason: lexical_alternative
  - marker: b
    text: Or 'from beyond the Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 미디안의 두 방백 오렙과 스엡을 사로잡았습니다. 오렙은 오렙 바위에서 죽였고, 스엡은 스엡의 포도즙 틀에서 죽였습니다. 그들은 미디안을 추격하였고, 오렙과 스엡의 머리를 요단 건너에서 기드온에게 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오렙’과 ‘스엡’은 각각 ‘까마귀’와 ‘늑대’와 어원적으로 관련되지만, 본문에서는 인명으로 처리합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  english_pob_choice: princes
  chosen_korean: 방백
  alternatives_korean:
  - 지도자들
  - 통치자들
  - 관리들
  lexicon: HALOT
  rationale: שַׂר는 단순한 ‘지도자’보다 높은 지위의 통치·군사 엘리트를 가리킬 수 있으므로, 한국어에서는 문맥에 맞는 격식을 살린 ‘방백’이 적절합니다.
- source_word: וַיִּלְכְּדוּ
  english_pob_choice: captured
  chosen_korean: 사로잡았습니다
  alternatives_korean:
  - 붙잡았습니다
  - 생포했습니다
  - 잡았습니다
  lexicon: HALOT
  rationale: 군사적 상황에서 לָכַד의 ‘capture’ 의미를 드러내기 위해, 평이한 ‘잡다’보다 ‘사로잡다/생포하다’ 계열이 더 정확합니다.
- source_word: בְּצוּר עֹרֵב / בְיֶקֶב זְאֵב
  english_pob_choice: at the rock of Oreb / at the winepress of Zeeb
  chosen_korean: 오렙 바위 / 스엡의 포도즙 틀
  alternatives_korean:
  - 오렙의 바위
  - 오렙 바위에서
  - 스엡의 포도틀
  - 스엡의 술틀
  lexicon: HALOT
  rationale: 지명화된 מקום표현을 자연스럽게 살리기 위해 ‘오렙 바위’, ‘스엡의 포도즙 틀’로 옮겼습니다. ‘포도즙 틀’은 יֶקֶב의 압착용 시설 의미를 비교적 직접적으로 드러냅니다.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  english_pob_choice: from across the Jordan
  chosen_korean: 요단 건너에서
  alternatives_korean:
  - 요단 저편에서
  - 요단 강 건너편에서
  - 요단 건너편에서
  lexicon: HALOT
  rationale: 이 표현은 위치 관점을 유지하는 관용구이므로, 비교적 간결하고 자연스러운 ‘요단 건너에서’로 옮겼습니다.
