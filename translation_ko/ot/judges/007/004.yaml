base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: ko
  text: 그때 야훼께서 기드온에게 말씀하셨습니다. “아직도 백성이 너무 많다. 그들을 물가로 내려보내라. 거기서 내가 너를 위해 그들을 시험하겠다. 내가 너에게 ‘이 사람은 너와 함께 갈 것이다’라고 말하는 사람은 너와 함께 갈 것이지만, 내가 너에게 ‘이 사람은 너와 함께 가지 않을 것이다’라고 말하는 사람은 너와 함께 가지 않을 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 신명칭 יהוה를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: 원문 신명칭을 직접 반영해야 하므로, 프로젝트 기본값에 따라 학술적 표기인 ‘야훼’를 사용했습니다. 대문자 LORD의 관습적 번역인 ‘주님’은 원문 고유명성보다 완곡합니다.
- source_word: הָעָם רָב
  english_pob_choice: The people are still too many
  chosen_korean: 아직도 백성이 너무 많다
  alternatives_korean:
  - 백성이 아직도 많다
  - 백성이 여전히 너무 많다
  lexicon: עם / רב
  rationale: 문맥상 군사의 수가 과다하다는 뜻을 간결하게 살려 ‘아직도 … 너무 많다’로 옮겼습니다. ‘백성’은 집합적 군중을 자연스럽게 담습니다.
- source_word: הוֹרֵד אֹתָם אֶל הַמַּיִם
  english_pob_choice: Bring them down to the water
  chosen_korean: 그들을 물가로 내려보내라
  alternatives_korean:
  - 그들을 물로 데려가라
  - 그들을 물가로 데리고 내려가라
  lexicon: ירד + מים
  rationale: 동사 ירד의 하강 이미지를 살리되, 한국어에서 자연스럽게 읽히도록 ‘물가로 내려보내라’로 옮겼습니다. 단순히 ‘물로’보다 장소성과 이동 방향이 드러납니다.
- source_word: וְאֶצְרְפֶנּוּ לְךָ שָׁם
  english_pob_choice: there I will test them for you
  chosen_korean: 거기서 내가 너를 위해 그들을 시험하겠다
  alternatives_korean:
  - 거기서 내가 그들을 너를 위해 시험하겠다
  - 거기서 내가 너를 위하여 그것들을 걸러내겠다
  lexicon: צרף
  rationale: צרף는 ‘시험하다/정련하다’의 의미역이 있지만, 여기서는 사람을 선별하는 맥락이므로 POB의 ‘test’에 맞춰 ‘시험하겠다’를 유지했습니다. ‘너를 위해’는 לְךָ의 이익/목적 방향을 반영합니다.
- source_word: זֶה יֵלֵךְ אִתָּךְ ... זֶה לֹא יֵלֵךְ עִמָּךְ
  english_pob_choice: This one shall go with you ... This one shall not go with you
  chosen_korean: 이 사람은 너와 함께 갈 것이다 ... 이 사람은 너와 함께 가지 않을 것이다
  alternatives_korean:
  - 이 사람은 너와 동행할 것이다 ... 이 사람은 너와 동행하지 않을 것이다
  - 이 자는 너와 함께 갈 것이다 ... 이 자는 너와 함께 가지 않을 것이다
  lexicon: הלך + עם
  rationale: 반복되는 선별 문구를 평이하고 직역에 가깝게 살렸습니다. ‘동행하다’는 다소 문어적·추상적이어서, 원문의 단순한 이동/동반을 드러내는 ‘함께 가다’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 신명칭 표기
  chosen_reading: 원문 יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 원문 직결 원칙에 따라 고유 신명칭을 숨기지 않고 드러내는 표기를 채택했습니다. 본문에서 구별되는 인격적 발화 주체를 유지하는 데 도움이 됩니다.
  doctrine_reference: 출 3:15; 신 6:4
- issue: ‘시험하다’와 ‘정련하다’의 긴장
  chosen_reading: 사람을 물가에서 선별하는 맥락을 따라 ‘시험하겠다’로 옮겼습니다.
  alternative_readings:
  - 정련하겠다
  - 걸러내겠다
  rationale: צרף는 금속 정련의 이미지를 지니지만, 여기서는 전투 인원을 가려내는 서술입니다. 따라서 독자가 사건의 기능을 바로 이해하도록 ‘시험하다’를 유지하되, 정련적 배경을 과도하게 신학화하지 않았습니다.
  doctrine_reference: 삿 7:4-7
