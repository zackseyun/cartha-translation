  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מִמֶּ֥/נִּי תִרְא֖וּ וְ/כֵ֣ן תַּעֲשׂ֑וּ וְ/הִנֵּ֨ה אָנֹכִ֥י בָא֙ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֔ה וְ/הָיָ֥ה כַ/אֲשֶׁר אֶעֱשֶׂ֖ה כֵּ֥ן תַּעֲשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
  footnotes:
  - marker: a
    text: Or “Look at me and do the same.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다[a]. 「나를 보십시오. 그리고 그대로 하십시오. 보십시오, 내가 진영 끝으로 갈 때, 내가 하는 대로 여러분도 그렇게 하십시오」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 보고 그대로 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמֶּנִּי תִרְא֖וּ
  english_pob_choice: Watch me
  chosen_korean: 나를 보십시오
  alternatives_korean:
  - 저를 보십시오
  - 나를 지켜보십시오
  lexicon: HALOT
  rationale: ראה와 מן이 결합한 지시문맥으로, 단순한 시선보다 뒤따라 할 행동의 본보기를 보라는 뜻이므로 자연스러운 명령형으로 옮겼습니다.
- source_word: וְכֵן תַּעֲשׂ֑וּ
  english_pob_choice: and do likewise
  chosen_korean: 그리고 그대로 하십시오
  alternatives_korean:
  - 그리고 그렇게 하십시오
  - 그리고 똑같이 하십시오
  lexicon: HALOT
  rationale: כֵן의 ‘그렇게/그와 같이’라는 방식 강조를 살려, 후속 모방 명령이라는 점이 드러나도록 옮겼습니다.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  english_pob_choice: to the edge of the camp
  chosen_korean: 진영 끝으로
  alternatives_korean:
  - 진영 가장자리로
  - 진영의 끝으로
  lexicon: HALOT
  rationale: קצה는 ‘끝, 가장자리’를 뜻하므로, 군사적 상황에 맞는 간결한 표현으로 ‘진영 끝’이 적절합니다.
- source_word: כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  english_pob_choice: as I do, so you shall do
  chosen_korean: 내가 하는 대로 여러분도 그렇게 하십시오
  alternatives_korean:
  - 내가 하는 것처럼 여러분도 하십시오
  - 내가 하는 대로, 그렇게 여러분도 하십시오
  lexicon: HALOT
  rationale: 히브리어의 대응 구조를 한국어 자연문으로 풀되, 지도자의 행동을 그대로 모방하라는 명령의 힘을 유지했습니다.
theological_decisions:
- issue: 지휘 명령의 어조
  chosen_reading: 기드온이 부하들에게 본보기-모방 구조로 지시하는 장면으로 보고, 한국어도 직접적 명령형을 유지했습니다.
  alternative_readings:
  - 완곡한 권유형으로 완화
  - 설명문 중심으로 재구성
  rationale: 본문은 전투 전 행동 지시이므로, 명령의 긴박감과 집단 동작의 일치성을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 서사 본문의 의미 보존 원칙
