    text: 또는 “나를 보고 그대로 하십시오.”
    reason: lexical_alternative
  revision_rationale: 의미는 유지하면서 진영 가장자리라는 위치 표현을 명확히 하고, 한국어 직접 인용문의 문장부호를 바로잡았습니다. הִנֵּה의 주의 환기와 본문에 반복되는 모방 명령도 그대로 보존했습니다.
