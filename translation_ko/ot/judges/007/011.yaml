  text: “그들이 무엇을 말하는지 들어라. 그러면 네 손이 강해질 것이니, 너는 진영으로 내려가라.” 그리하여 그와 그의 종[a] 푸라는 진영에 있는 무장한 자들[b]의 가장자리로 내려갔습니다.
