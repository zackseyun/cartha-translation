  source_fidelity: 원문의 주어는 ‘삼백 명’ 자체라기보다 문맥상 그들이 분 ‘삼백 개의 쇼파르(나팔)’이며, 야훼께서 각 사람의 칼이 동료와 온 진영을 향하게 하신 결과를 말합니다. 초안은 ‘온 진영에 두시매’가 한국어에서 목적과 의미 관계가 불명확하고, 도피 경로의 전치사적 관계도 충분히 반영하지 못합니다.
  naturalness: 초안의 ‘불매’, ‘두시매’, ‘도망하매’는 현대 표준 한국어 합쇼체 문장으로 부자연스럽고 문장이 미완결입니다. 현대적이면서도 원문의 인과 관계를 보존하도록 고쳤습니다.
  terminology: 신명은 영어 POB의 ‘Yahweh’에 맞추어 ‘야훼’로 옮겼습니다. 지명은 음역하고, שְׂפַת의 넓은 지리적 의미는 ‘경계’로 유지하되 각주에서 대안을 제시했습니다.
  issues:
  - severity: high
    issue: 문장이 합쇼체 종결 없이 끝나며, 현대 한국어 문장으로 완결되지 않습니다.
    rationale: 목표 변종이 현대 formal-polite 합쇼체이므로 문장은 ‘-습니다’로 완결되어야 합니다.
  - severity: high
    issue: ‘각 사람의 칼을 그 이웃과 온 진영에 두시매’는 한국어에서 칼을 어디에 ‘둔다’는 뜻으로 읽혀, 서로 칼을 겨누게 하신 원문의 의미를 전달하지 못합니다.
    rationale: וַיָּשֶׂם ... חֶרֶב ... בְּרֵעֵהוּ는 각 사람이 동료에게 칼을 향하게 된 혼란을 뜻합니다.
  - severity: medium
    issue: ‘삼백 명이 나팔을 불매’는 원문의 ‘삼백 나팔’을 직접 반영하지 않습니다.
    rationale: 문맥상 삼백 명이 불었음은 가능하지만, 본문에는 삼백 개의 쇼파르가 강조되어 있으므로 ‘그 삼백 명이 나팔 삼백 개를 불자’가 더 충실합니다.
  - severity: medium
    issue: 지명 음역과 도피 경로의 관계가 부정확하거나 불명확합니다.
    rationale: 베트싯다/스레라, 아벨므홀라/답밧의 지명 표기와 ‘~쪽으로’, ‘~근처까지’의 관계를 원문의 방향성과 불확실성을 보존하는 방식으로 정리해야 합니다.
  revised_text: 그 삼백 명이 나팔 삼백 개를 불자, 야훼께서 각 사람이 자기 동료와 온 진영을 향해 칼을 들게 하셨습니다. 그러자 진영은 벧싯다, 곧 스레라 쪽까지, 또 답밧 근처의 아벨므홀라 경계까지 달아났습니다.
