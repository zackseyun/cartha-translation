base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
  footnotes:
  - marker: a
    text: Or, “you shall place him by himself”; the verb can mean to set or station someone separately.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그는 백성을 물가로 데리고 내려갔습니다. 그러자 야훼께서 기드온에게 말씀하셨습니다. “개가 핥듯이 자기 혀로 물[a]을 핥는 사람은 모두 따로 세워 두십시오. 무릎을 꿇고 마시는 사람도 모두 따로 세워 두십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물’을 조금, 곧 물의 일부를 취한다는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  english_pob_choice: brought ... down
  chosen_korean: 내려가게 했습니다
  alternatives_korean:
  - 데리고 내려갔습니다
  - 내려보냈습니다
  lexicon: HALOT
  rationale: 히필형 ירד의 사역적 의미를 살려, 백성이 스스로 간 것이 아니라 그가 내려가게 했음을 분명히 했습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 군중
  lexicon: HALOT
  rationale: 군사 문맥이지만 히브리어는 일반 집합명사이므로, 문맥을 과도하게 좁히지 않는 ‘백성’이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명사를 ‘야훼’로 옮겨, 본문이 제목이 아니라 이름을 사용한다는 점을 보존했습니다.
- source_word: תַּצִּיג אוֹת/וֹ לְבָד
  english_pob_choice: you shall set apart by himself
  chosen_korean: 그 사람은 따로 세우십시오
  alternatives_korean:
  - 그를 따로 두십시오
  - 그를 분리하여 세우십시오
  lexicon: HALOT
  rationale: יצג의 ‘세우다/배치하다’ 의미와 לְבָד의 분리 뜻을 함께 살려, 선별하여 따로 두라는 지시를 간결하게 표현했습니다.
theological_decisions:
- issue: 두 번째 분류 명령의 반복 명령 형식
  chosen_reading: “무릎을 꿇고 마시는 사람도 모두 그렇게 하십시오”로 옮겨, 앞절의 분리 명령에 맞는 병렬 구조를 드러냈습니다.
  alternative_readings:
  - “무릎을 꿇고 마시는 사람은 따로 세우십시오”
  - “무릎을 꿇고 마시는 자들도 별도로 두십시오”
  rationale: 히브리어는 앞의 부류와 같은 처리로 둘째 부류도 선별하라는 병렬 명령이므로, 한국어에서도 동일한 지시 구조가 드러나도록 했습니다.
  doctrine_reference: source-structure / discourse parallelism
- issue: 직접인용 내부의 화법 수준
  chosen_reading: 하나님 말씀을 직접인용으로 유지하되, 한국어에서는 명령문으로 자연스럽게 처리했습니다.
  alternative_readings:
  - 설명문으로 완화
  - 간접화법으로 전환
  rationale: 원문의 직접화법과 긴급한 선별 명령의 어조를 보존하기 위해, 평서문으로 약화하지 않았습니다.
  doctrine_reference: source discourse / quotation fidelity
