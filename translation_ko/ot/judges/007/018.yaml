  naturalness: ‘내가 나와 함께 있는 모든 사람과 함께’는 현대 표준 한국어로 비문에 가깝습니다. 또한 전투 구호를 ‘말하십시오’라고만 하면 다소 부자연스러우므로, 원문의 אמר가 명시하지 않는 ‘외치다’를 본문에 넣지 않고 문장 구조를 정돈해 ‘이렇게 말하십시오’로 처리했습니다.
