id: JDG.7.18
reference: Judges 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
  footnotes:
  - marker: a
    text: Traditional English versions often read, 'The sword of the LORD and of Gideon,' influenced by the nearby wording in Judges 7:20. The Hebrew of this verse itself reads simply, 'For the LORD and for Gideon.'
    reason: alternative_reading
  - marker: b
    text: Hebrew שׁוֹפָר refers to a horn, often a ram’s horn, rather than a metal trumpet.
    reason: cultural_note
translation:
  language: ko
  text: 내가 나와 함께 있는 모든 사람과 함께 나팔을 불면, 너희도 또한 온 진영의 사방에서 나팔들을 불고, ‘야훼를 위하여, 기드온을 위하여!’라고 말하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוֹפָר는 일반적으로 금속 나팔보다 양의 뿔에 가까운 악기를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 일부 전통 번역은 이 구절을 ‘야훼의 칼과 기드온의 칼’로 옮기지만, 이 절의 히브리어 본문은 단지 ‘야훼를 위하여, 기드온을 위하여’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  english_pob_choice: blow
  chosen_korean: 불면 / 불고
  alternatives_korean:
  - 소리 내면
  - 불어 울리면
  lexicon: HALOT
  rationale: שׁוֹפָר와 함께 쓰인 תקע는 나팔을 ‘불다/불어 울리다’의 뜻이므로, 한국어에서도 구체적 행위를 살리는 동사를 택했습니다.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  english_pob_choice: ram’s horn / horns
  chosen_korean: 나팔
  alternatives_korean:
  - 양각나팔
  - 숫양의 뿔
  lexicon: HALOT
  rationale: 본문은 현대 독자가 바로 이해할 수 있도록 ‘나팔’로 옮겼습니다. 본절 자체는 금속 나팔을 뜻하지 않는다는 점이 중요하지만, 한국어 본문에는 간결성을 우선해 일반 명사로 처리했습니다.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  english_pob_choice: I and all who are with me
  chosen_korean: 내가 나와 함께 있는 모든 사람과 함께
  alternatives_korean:
  - 나와 함께 있는 모든 사람과 내가
  - 나와 함께한 모든 사람들
  lexicon: HALOT
  rationale: 기드온과 동행한 사람들을 가리키는 표현이므로, 한국어에서는 주어를 자연스럽게 풀어 ‘나와 함께 있는 모든 사람’으로 옮겼습니다.
- source_word: לַיהוָה וּלְגִדְעוֹן
  english_pob_choice: For Yahweh and for Gideon!
  chosen_korean: ‘야훼를 위하여, 기드온을 위하여!’
  alternatives_korean:
  - ‘여호와를 위하여, 기드온을 위하여!’
  - ‘야훼와 기드온을 위하여!’
  lexicon: HALOT
  rationale: ל의 전투 구호적 용법을 살려 ‘~을 위하여’로 옮겼고, 여호와 대신 본문 원칙에 따라 ‘야훼’를 사용했습니다. 기드온 앞의 ל도 동일하게 처리해 대칭 구조를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 히브리어 본문이 직접 하나님의 이름을 쓰므로, 프로젝트 원칙에 따라 신적 칭호가 아닌 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
