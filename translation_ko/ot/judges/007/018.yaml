  to: 나와 함께 있는 모든 사람이 뿔나팔을 불 때에, 너희도 온 진영을 둘러싸고 뿔나팔을 부십시오.[a] 그리고 이렇게 말하십시오.[b] ‘야훼를 위하여, 기드온을 위하여!’
  rationale: 병렬 주어를 자연스러운 한국어로 바로잡고, שׁוֹפָר의 구체적 의미를 본문에서 보존했습니다. ‘온 진영을 둘러싸고’는 סְבִיבוֹת כָּל־הַמַּחֲנֶה의 포위·주변 의미를 자연스럽게 반영합니다. 구호는 원문의 일반 동사 אמר를 넘어서지 않도록 ‘이렇게 말하십시오’로 유지했으며, 각주 표지를 해당 표현 가까이에 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:09:47Z'
