  - 손에 들었습니다
  lexicon: HALOT
  rationale: ‘손에’라는 구체적 이미지를 살리되, 한국어로는 소지·휴대를 자연스럽게 드러내기 위해 ‘잡았습니다’로 다듬었습니다.
- source_word: שׁוֹפְרֹתֵיהֶם
  english_pob_choice: their trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 뿔나팔
  - 숫양 뿔
  - 경적
  lexicon: HALOT
  rationale: שׁוֹפָר는 신호용 뿔이지만, 한국어 성경 문맥에서는 ‘나팔’이 기능을 가장 잘 전달합니다. 다만 본문 의미가 단순 금관악기가 아니라 신호 도구임을 주석상 유지합니다.
- source_word: שִׁלַּח ... אִישׁ לְאֹהָלָיו
  english_pob_choice: he sent every man of Israel, each to his tent
  chosen_korean: 이스라엘의 모든 사람을, 곧 각기 자기의 장막으로 돌려보냈으나
  alternatives_korean:
  - 이스라엘의 모든 남자를 각자 자기 장막으로 보냈으나
