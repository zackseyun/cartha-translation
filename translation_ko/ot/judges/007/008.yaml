base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
  footnotes:
  - marker: a
    text: Or “their horns” or “their rams’ horns”; the Hebrew term refers to a horn used as a signaling instrument.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 백성의 양식과 자기들의 나팔[a]을 손에 들었습니다. 그는 이스라엘의 모든 사람을 각기 자기 장막으로 돌려보냈으나, 삼백 명은 남겨 두었습니다. 미디안의 진영은 기드온 아래쪽 골짜기에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוֹפָר는 신호용 뿔을 가리킬 수 있습니다. 따라서 ‘나팔’은 ‘뿔나팔’ 또는 ‘숫양 뿔’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
