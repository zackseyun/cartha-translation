base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
  footnotes:
  - marker: a
    text: Or “their horns” or “their rams’ horns”; the Hebrew term refers to a horn used as a signaling instrument.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 백성의 양식과 자기들의 나팔을 손에 잡았습니다. 그리고 그는 이스라엘의 모든 사람을, 곧 각기 자기의 장막으로 돌려보냈으나, 삼백 명의 사람은 붙들어 두었습니다. 미디안의 진영은 그 아래 골짜기에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוֹפָר는 신호용 뿔을 가리킬 수 있어, 문맥상 ‘나팔’이거나 ‘뿔나팔/숫양 뿔’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵדָה
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 보급품
  - 식량
  - 여행 양식
  lexicon: HALOT
  rationale: 군사적 이동 문맥에서 넓은 의미의 ‘provisions’를 한국어로는 자연스럽게 ‘양식’으로 옮길 수 있으며, 필요한 공급을 넓게 포괄합니다.
- source_word: בְּיָדָם
  english_pob_choice: in their hands
  chosen_korean: 손에 잡았습니다
  alternatives_korean:
  - 그들의 손에
  - 손안에
  - 손에 들었습니다
  lexicon: HALOT
  rationale: ‘손에’라는 구체적 이미지를 살리되, 한국어로는 소지·휴대를 자연스럽게 드러내기 위해 ‘잡았습니다’로 다듬었습니다.
- source_word: שׁוֹפְרֹתֵיהֶם
  english_pob_choice: their trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 뿔나팔
  - 숫양 뿔
  - 경적
  lexicon: HALOT
  rationale: שׁוֹפָר는 신호용 뿔이지만, 한국어 성경 문맥에서는 ‘나팔’이 기능을 가장 잘 전달합니다. 다만 본문 의미가 단순 금관악기가 아니라 신호 도구임을 주석상 유지합니다.
- source_word: שִׁלַּח ... אִישׁ לְאֹהָלָיו
  english_pob_choice: he sent every man of Israel, each to his tent
  chosen_korean: 이스라엘의 모든 사람을, 곧 각기 자기의 장막으로 돌려보냈으나
  alternatives_korean:
  - 이스라엘의 모든 남자를 각자 자기 장막으로 보냈으나
  - 이스라엘의 모든 사람을 각기 자기 장막으로 보냈으나
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 살리면서, 군사적 해산의 뉘앙스를 한국어 동사 ‘돌려보냈다’로 자연스럽게 표현했습니다.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  english_pob_choice: but retained the three hundred men
  chosen_korean: 삼백 명의 사람은 붙들어 두었습니다
  alternatives_korean:
  - 삼백 명은 붙잡아 두었습니다
  - 삼백 명의 사람을 남겨 두었습니다
  - 삼백 명을 유지했습니다
  lexicon: HALOT
  rationale: הֶחֱזִיק의 ‘붙들다/붙잡다’ 계열 의미를 살리되, 이 문맥에서는 선발된 300명을 계속 곁에 둔 뜻이므로 ‘붙들어 두었습니다’가 가장 적절합니다.
theological_decisions:
- issue: 미디안 진영의 위치를 나타내는 공간 표현
  chosen_reading: ‘그 아래 골짜기에 있었습니다’로 옮겨, 히브리어의 아래쪽/낮은 지형 대비를 유지했습니다.
  alternative_readings:
  - ‘그 아래에 있었습니다’
  - ‘아래쪽 골짜기에 있었습니다’
  rationale: 본문은 단순 위치 정보가 아니라 기드온 쪽과 적진의 지세 대비를 보여 주므로, ‘골짜기’와 ‘그 아래’를 함께 살려 시각적 대비를 보존했습니다.
  doctrine_reference: 서사적 지형 묘사 보존
- issue: ‘나팔’의 도구 성격
  chosen_reading: 본문 본문에는 ‘나팔’로 두되, 의미상 신호용 뿔 도구라는 점을 유지합니다.
  alternative_readings:
  - ‘뿔나팔’
  - ‘숫양 뿔’
  rationale: 한국어에서 ‘나팔’이 가장 자연스럽지만, מקור의 שׁוֹפָר가 단순 악기가 아니라 전투 신호 도구라는 의미를 흐리지 않도록 했습니다.
  doctrine_reference: 본문 의미의 기능적 보존
