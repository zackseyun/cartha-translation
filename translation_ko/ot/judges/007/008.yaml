  - 식량
  - 여행 양식
  lexicon: HALOT
  rationale: 군사적 이동 문맥에서 넓은 의미의 ‘provisions’를 한국어로는 자연스럽게 ‘양식’으로 옮길 수 있으며, 필요한 공급을 넓게 포괄합니다.
- source_word: בְּיָדָם
