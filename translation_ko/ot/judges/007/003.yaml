  naturalness: ‘백성의 귀에 선포하십시오’는 히브리어 관용구를 지나치게 직역하여 현대 한국어로 부자연스럽습니다. ‘백성이 듣는 데서 선포하십시오’가 공적인 청취 상황과 합쇼체 명령을 자연스럽게 전달합니다. 인용문 안의 공표 내용은 직접 명령형 ‘떠나라’가 적절합니다.
  terminology: ‘길르앗 산’은 지명으로 적절합니다. ‘두렵고 떨리는 자’보다 ‘두려워 떨리는 사람’이 현대 표준어에서 자연스럽고, 원문의 두려움 강조도 유지합니다.
