base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Now please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
  footnotes:
  - marker: a
    text: The Hebrew verb rendered 'depart' (וְיִצְפֹּר) is uncommon and debated; it may imply 'leave early' or 'slip away.'
    reason: lexical_alternative
  - marker: b
    text: '''Mount Gilead'' is the plain rendering of the Hebrew, though the geographical reference is difficult in this context; some understand it more broadly as the hill country of Gilead.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 백성의 귀에 선포하십시오[a]. ‘누구든지 두렵고 떨리는 자는 돌아가서 길르앗 산에서 떠나가라.’ 그러자 백성 가운데 이만이천 명이 돌아갔고, 만 명은 남았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 וְיִצְפֹּר는 드물고 해석이 논쟁적이어서, ‘일찍 떠나가다’ 또는 ‘슬며시 물러나다’로 이해할 여지가 있습니다.
    reason: lexical_alternative
lexical_decisions:
