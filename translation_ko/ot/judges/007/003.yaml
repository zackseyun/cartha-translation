  text: וְ/עַתָּ֗ה קְרָ֨א נָ֜א בְּ/אָזְנֵ֤י הָ/עָם֙ לֵ/אמֹ֔ר מִֽי יָרֵ֣א וְ/חָרֵ֔ד יָשֹׁ֥ב וְ/יִצְפֹּ֖ר מֵ/הַ֣ר הַ/גִּלְעָ֑ד וַ/יָּ֣שָׁב מִן הָ/עָ֗ם עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים נִשְׁאָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Now please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
  footnotes:
  - marker: a
    text: The Hebrew verb rendered 'depart' (וְיִצְפֹּר) is uncommon and debated; it may imply 'leave early' or 'slip away.'
    reason: lexical_alternative
  - marker: b
    text: '''Mount Gilead'' is the plain rendering of the Hebrew, though the geographical reference is difficult in this context; some understand it more broadly as the hill country of Gilead.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 백성이 듣는 데서 선포하십시오. 이렇게 말하십시오. ‘누구든지 두려워 떨리는 사람은 돌아가서 길르앗 산을 떠나라[a][b].’ 그러자 백성 가운데 이만 이천 명이 돌아갔고, 만 명이 남았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 וְיִצְפֹּר는 드물고 해석이 논쟁적입니다. ‘일찍 떠나다’ 또는 ‘슬며시 물러나다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘길르앗 산’을 뜻하지만, 이 문맥에서의 지리적 지시는 어렵습니다. 일부는 이를 더 넓게 ‘길르앗 산지’로 이해합니다.
    reason: cultural_note
