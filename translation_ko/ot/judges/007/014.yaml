base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
  footnotes:
  - marker: a
    text: Or, “This is nothing but the sword of Gideon son of Joash.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “into his hand,” an idiom meaning into his power or control.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 동무가 대답하며 말했습니다. “이것은 다름 아니라 기드온, 요아스의 아들, 이스라엘 사람의 칼입니다. 하나님께서 미디안과 온 진영을 그의 손에 넘기셨습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것은 다름 아닌 기드온, 요아스의 아들, 이스라엘 사람의 칼입니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 “그의 손에”는 곧 그를 지배하거나 통제하는 권세 안에 넘겨졌다는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעֵהוּ
  english_pob_choice: his companion
  chosen_korean: 그의 동무
  alternatives_korean:
  - 그의 동료
  - 그의 친구
  - 그의 벗
  lexicon: HALOT
  rationale: 전쟁 진영의 대화 맥락에서 친밀한 ‘친구’보다 관계적이면서도 자연스러운 ‘동무’가 적절하며, 히브리어의 동행자 뉘앙스를 살립니다.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  english_pob_choice: This is nothing other than
  chosen_korean: 이것은 다름 아니라
  alternatives_korean:
  - 이것은 다름 아닌
  - 이것은 그저
  - 이것은 오직
  lexicon: HALOT
  rationale: 부정과 배제의 강한 관용구를 현대 한국어의 자연스러운 확정 표현으로 옮겨, 단순한 설명이 아니라 ‘오직 이것뿐’이라는 단정성을 살렸습니다.
- source_word: אִישׁ יִשְׂרָאֵל
  english_pob_choice: a man of Israel
  chosen_korean: 이스라엘 사람
  alternatives_korean:
  - 이스라엘의 남자
  - 이스라엘 사람 한 명
  - 이스라엘인
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 איש를 노출하되, 한국어에서는 ‘남자’가 과도하게 강조될 수 있어 ‘이스라엘 사람’으로 옮겨 인물 식별 기능을 유지했습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: into his hand
  chosen_korean: 그의 손에
  alternatives_korean:
  - 그의 권세 아래
  - 그의 통제 아래
  - 그의 권력 안으로
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에’는 권세·지배를 뜻하는데, 본문이 말하는 넘겨짐의 이미지를 살리기 위해 직역적 표현을 유지했습니다.
theological_decisions:
- issue: 야훼 이름 대신 하나님의 호칭 사용
  chosen_reading: 하나님께서
  alternative_readings:
  - 야훼께서
  - 주님께서
  rationale: 본문의 הָאֱלֹהִים은 일반 명칭 ‘하나님’이 직접 지시 대상이며, 여기에는 YHWH 표기나 시편 인용의 야훼 치환 근거가 없으므로 표준적으로 번역했습니다.
  doctrine_reference: DOCTRINE.md §Source-grounded divine name policy
- issue: ‘손’ 관용구의 보존
  chosen_reading: 그의 손에 넘기셨습니다
  alternative_readings:
  - 그를 굴복시키셨습니다
  - 그의 권세 아래 두셨습니다
  rationale: 전승된 히브리어 승리 공식의 핵심 이미지가 ‘손’에 있으므로, 의미를 풀어쓰되 관용구 자체를 보존해 본문의 전투적·주권적 뉘앙스를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Idioms and metaphor
