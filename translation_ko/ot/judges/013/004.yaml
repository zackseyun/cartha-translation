translation:
  language: ko
  text: 이제 부디 조심하십시오[a]. 포도주나 독주[b]를 마시지 말고, 부정한 것은 아무것도 먹지 마십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이제 스스로 조심하십시오.’
    reason: lexical_alternative
  - marker: b
    text: ‘독주’는 포도주 외의 취하게 하는 술을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘어떤 부정한 것도 먹지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환을 나타내는 시간 부사로, 현대 한국어에서는 ‘이제’가 가장 자연스럽고 간결합니다.
- source_word: הִשָּׁמְרִי נָא
  english_pob_choice: please be careful
  chosen_korean: 부디 조심하십시오
  alternatives_korean:
  - 부디 주의하십시오
  - 조심하십시오
  - 부디 살피십시오
  lexicon: HALOT
  rationale: 재귀적/주의 촉구 의미의 שׁמר를 한국어의 직접적인 권고로 옮기되, נָא의 간청 뉘앙스를 ‘부디’로 살렸습니다.
- source_word: שֵׁכָר
  english_pob_choice: strong drink
  chosen_korean: 독주
  alternatives_korean:
  - 강한 술
  - 취하게 하는 술
  - 강독주
  lexicon: HALOT
  rationale: 단순한 포도주가 아닌 취하게 하는 음료를 가리키므로, 의미를 분명히 드러내는 ‘독주’를 선택했습니다.
- source_word: כָּל טָמֵא
  english_pob_choice: anything unclean
  chosen_korean: 부정한 것은 아무것도
  alternatives_korean:
  - 부정한 것은 아무것도
  - 부정한 어떤 것이라도
  - 부정한 것을
  lexicon: HALOT
  rationale: קָל/כָּל과 형용사 טָמֵא의 결합을 식품·의례적 부정 범주로 유지하면서, 한국어에서는 ‘아무것도’로 부정의 전면성을 살렸습니다.
theological_decisions:
- issue: טָמֵא의 의미 범주
  chosen_reading: 의례적으로 부정한 것
  alternative_readings:
  - 도덕적으로 더러운 것
  - 위생적으로 더러운 것
  rationale: 문맥이 삼손의 출생과 나실인 관련 지시이므로, 이 표현은 도덕이나 위생보다 율법적/의례적 부정 범주로 이해하는 것이 적절합니다.
  doctrine_reference: 레위기 정결 규례와 민수기 나실인 규례(민 6장)
