  source_fidelity: 히브리어의 부정 관용구(‘더 이상/다시는 나타나지 않았다’), 두 대상(마노아와 그의 아내), 그리고 마노아의 사후 인식을 전반적으로 충실히 반영합니다. 그러나 인격적 존재를 가리키는 הוּא를 ‘그것’으로 옮긴 것은 부정확하며, 프로젝트의 신명 표기 결정에도 맞추어야 합니다.
