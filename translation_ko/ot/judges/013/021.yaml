  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'messenger' or 'angel'; in this context it refers to a supernatural figure.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 천사[a]는 다시는 마노아와 그의 아내에게 나타나지 않았습니다. 그러자 마노아는 그가 야훼의 천사인 줄 알게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘천사’ 또는 ‘사자’로 옮길 수 있습니다. 이 문맥에서는 초자연적인 존재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 여호와의 천사
  alternatives_korean:
  - 여호와의 사자
  - 여호와의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥에 따라 ‘사자/메신저’도 될 수 있지만, 이 서사에서는 초자연적 존재를 가리키므로 한국어도 관용적이면서도 본문에 충실한 ‘천사’로 옮겼습니다.
- source_word: יָסַף עוֹד ... לְהֵרָאֹה
  english_pob_choice: did not appear again
  chosen_korean: 다시는 ... 나타나지 않았습니다
  alternatives_korean:
  - 더 이상 ... 나타나지 않았습니다
  - 다시 나타나지 않았습니다
  lexicon: HALOT
  rationale: ‘또/다시’의 반복과 중단을 자연스럽게 살리기 위해, 한국어에서는 부정과 결합한 ‘다시는 ... 나타나지 않았습니다’로 압축해 옮겼습니다.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  english_pob_choice: to Manoah and to his wife
  chosen_korean: 마노아와 그의 아내에게
  alternatives_korean:
  - 마노아와 그의 아내에게로
  - 마노아와 아내에게
  lexicon: HALOT
  rationale: 히브리어의 반복된 전치사 구조를 한국어에서는 자연스럽게 한 번의 조사로 처리하되, 대상이 둘임을 분명히 했습니다.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  english_pob_choice: that he was the angel of Yahweh
  chosen_korean: 그것이 여호와의 천사인 줄
  alternatives_korean:
  - 그가 여호와의 천사인 줄
  - 그분이 여호와의 천사인 줄
  lexicon: HALOT
  rationale: 히브리어의 הוּא는 앞선 현현한 존재를 가리키므로, 한국어에서는 문맥상 자연한 지시어 ‘그것’으로 받아 주되, 인격적 존재임을 끝절에서 다시 명시했습니다.
theological_decisions:
- issue: 여호와의 천사의 정체를 얼마나 명확히 할 것인가
  chosen_reading: ‘여호와의 천사’로 번역해 인물의 초자연적·신적 긴장을 그대로 유지했습니다.
  alternative_readings:
  - ‘여호와의 사자’로 완화해 번역하는 방식
  - 정체를 주석에서 단정적으로 해소하는 방식
  rationale: 본문은 마노아가 그 존재가 ‘여호와의 천사’임을 알아차렸다고만 말하며, 정체를 해설하지 않습니다. 따라서 번역도 긴장을 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
