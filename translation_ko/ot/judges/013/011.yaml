base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
  footnotes:
  - marker: a
    text: Or, “following his wife.” The Hebrew literally says “after his wife.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the woman,” not “my wife.”
    reason: lexical_alternative
  - marker: c
    text: Or, “I am he.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 마노아가 일어나 자기 아내[a]를 따라가 그 사람에게 이르러 말했습니다. “그 여자[b]에게 말한 사람이 당신입니까?” 그가 말했습니다. “내가 그 사람입니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 아내를 뒤따라서.” 히브리어는 문자적으로 “자기 아내 뒤에”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “내 아내”가 아니라 “그 여자”라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 단지 “나”입니다. 또는 “그렇습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  english_pob_choice: arose and went
  chosen_korean: 일어나 … 따라가
  alternatives_korean:
  - 일어나 갔습니다
  - 일어나 걸어갔습니다
  lexicon: WLC / HALOT
  rationale: 연속 동작을 자연스럽게 살리면서, 단순한 이동보다 뒤따라감의 뉘앙스를 드러내기 위해 ‘따라가’를 택했습니다.
- source_word: אַחֲרֵי אִשְׁתּוֹ
  english_pob_choice: after his wife
  chosen_korean: 자기 아내[a]를 따라가
  alternatives_korean:
  - 아내 뒤를 따라가
  - 아내를 뒤따라가
  lexicon: WLC / HALOT
  rationale: 히브리어의 직역인 ‘after his wife’를 한국어에서 가장 자연스럽게 옮기면 ‘아내를 따라가’입니다. 관계를 명시하기 위해 ‘자기 아내’로 풀었습니다.
- source_word: הָאִישׁ
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: WLC / HALOT
  rationale: 본문은 이후의 계시적 정체를 미리 밝히지 않고 단지 ‘사람/남자’로 지칭하므로, 서술 관점을 보존해 ‘그 사람’으로 옮겼습니다.
- source_word: הַאַתָּה הָאִישׁ אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  english_pob_choice: Are you the man who spoke to the woman?
  chosen_korean: 당신이 그 여자에게 말한 그 사람이십니까?
  alternatives_korean:
  - 당신이 그 여자에게 말씀하신 그 분이십니까?
  - 당신이 그 여자에게 말한 그 남자입니까?
  lexicon: WLC / HALOT
  rationale: 질문 구조를 유지하면서, 히브리어의 ‘그 여자’(הָאִשָּׁה)를 그대로 살려 ‘아내’로 바꾸지 않았습니다. ‘사람이십니까’는 문맥상 인물 확인 질문을 자연스럽게 전달합니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 아내
  - 여인
  lexicon: WLC / HALOT
  rationale: 히브리어는 ‘내 아내’가 아니라 단지 ‘그 여자’라고 말하므로, 관계를 보정하지 않고 원문 표현을 유지했습니다.
- source_word: אָנִי
  english_pob_choice: I am
  chosen_korean: 내가 바로 나입니다
  alternatives_korean:
  - 제가 그입니다
  - 내가 나입니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 자기동일 응답을 현대 한국어로 자연스럽게 옮기되, 원문의 단정성을 살리기 위해 ‘바로’로 강조했습니다.
theological_decisions:
- issue: 미지의 방문자를 지칭하는 방식
  chosen_reading: ‘그 사람’으로 유지해, 본절에서 천사/사자로 해석을 앞서서 삽입하지 않았습니다.
  alternative_readings:
  - 그 천사
  - 그 사자
  rationale: 문맥 전체에서는 여호와의 사자가 드러나지만, 본절의 표면 텍스트는 אִישׁ(사람)입니다. 서술 시점을 보존하는 것이 원문이 청자에게 주는 점진적 인식을 더 잘 반영합니다.
  doctrine_reference: 서술 관점 보존 / 점진적 계시
- issue: 마노아의 질문과 대답의 존대
  chosen_reading: 마노아의 정중한 질문과 상대의 단정적 응답을 합쇼체로 유지했습니다.
  alternative_readings:
  - 보다 중립적인 해요체
  - 직설적 반말
  rationale: 히브리어 대화의 예의 있는 질문과 간명한 응답을 한국어 공번역 문체에 맞게 재현하기 위해 합쇼체를 사용했습니다.
  doctrine_reference: 문체 일관성
