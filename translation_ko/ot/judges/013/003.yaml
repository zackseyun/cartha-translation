revisions:
- from: 야훼의 천사가 그 여자에게 나타나 그에게 말했습니다. 「보십시오, 부탁합니다. 당신은 임신하지 못하는 여자이며 아직 아이를 낳지 못했습니다. 그러나 당신은 잉태하여 아들을 낳을 것입니다」.[a]
  to: 야훼의 천사가 그 여인에게 나타나 그 여인에게 말했습니다. 「보십시오, 당신은 불임이고 아이를 낳지 못했지만, 잉태하여 아들을 낳을 것입니다.」[a]
  rationale: 불임 상태와 과거의 무출산, 그리고 장차 잉태와 아들 출산이라는 원문의 대조를 보존했습니다. 불필요한 시간적 함의인 ‘아직’을 제거하고, נָא에 대한 단정적인 ‘부탁합니다’ 번역과 주석을 문맥상 자연스러운 표현 및 제한적인 설명으로 바로잡았습니다.
