    rationale: ‘임신하지 못하는 여자’는 원문의 불임 상태를 지나치게 임신 능력에만 한정합니다. 또한 ‘아직’은 단순히 ‘낳지 못했다’는 완료 진술에 없는 시간적 기대를 첨가합니다.
