  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: ko
  text: 야훼의 천사가 그 여인에게 나타나 그 여인에게 말했습니다. 「보십시오, 당신은 불임이고 아이를 낳지 못했지만, 잉태하여 아들을 낳을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הִנֵּה נָא는 주의를 환기하는 표현입니다. נָא는 문맥에 따라 ‘이제’ 또는 공손함을 더하는 말로 이해될 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of the LORD
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 여호와의 천사
  - 주님의 천사
  lexicon: 말라크 + יהוה
  rationale: 원문과 POB의 LORD 선택을 반영해 신명(야훼)을 유지했으며, 천사를 ‘야훼의 천사’로 직역해 소유격 관계를 분명히 했습니다.
- source_word: אֶל הָאִשָּׁה / אֵלֶיהָ
  english_pob_choice: to the woman / to her
  chosen_korean: 그 여자에게 / 그에게
  alternatives_korean:
  - 그 여자에게 / 그녀에게
  - 여인에게 / 그녀에게
  lexicon: אל + feminine pronominal object
  rationale: 두 번의 지시 대상이 모두 동일한 여성을 가리키므로, 한국어에서는 문맥상 자연스럽게 ‘그 여자에게’, 뒤에서는 지시대명사 ‘그에게’로 정리했습니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Look, please
  chosen_korean: 보십시오, 부탁합니다
  alternatives_korean:
  - 보라, 이제
  - 자, 부탁드리니
  lexicon: הנה + נא
  rationale: 감탄·주의 환기와 청유를 함께 살리기 위해 ‘보십시오’와 ‘부탁합니다’를 결합해 공손하지만 과도하게 성경체화되지 않도록 했습니다.
- source_word: עֲקָרָה וְלֹא יָלַדְתְּ ... וְהָרִית וְיַלַדְתְּ בֵּן
  english_pob_choice: you are barren and have not borne children, but you will conceive and bear a son
  chosen_korean: 임신하지 못하는 여자이며 아직 아이를 낳지 못했습니다. 그러나 당신은 잉태하여 아들을 낳을 것입니다
  alternatives_korean:
  - 아이를 낳지 못하는 여자이며
  - 불임이며 아이를 낳지 못했습니다
  lexicon: עקרה + ילד + הרה
  rationale: ‘עֲקָרָה’는 단순 무자녀가 아니라 출산 불능 상태를 가리켜, 한국어에서도 그 의미가 드러나도록 ‘임신하지 못하는 여자’로 옮겼고, 이후 ‘잉태하여 아들을 낳을 것입니다’로 약속의 대비를 유지했습니다.
theological_decisions:
- issue: 야훼의 천사 표기
  chosen_reading: 신명은 POB 기본 원칙에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와의 천사
  - 주님의 천사
  rationale: 본문의 יהוה를 신학적으로 흐리지 않고 원문-기반 표기로 유지하는 것이 이 구절의 대표적 신호를 보존합니다.
  doctrine_reference: OT divine-name policy / source transparency
