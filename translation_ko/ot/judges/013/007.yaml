source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ֔/י הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/עַתָּ֞ה אַל תִּשְׁתִּ֣י יַ֣יִן וְ/שֵׁכָ֗ר וְ/אַל תֹּֽאכְלִי֙ כָּל טֻמְאָ֔ה כִּֽי נְזִ֤יר אֱלֹהִים֙ יִהְיֶ֣ה הַ/נַּ֔עַר מִן הַ/בֶּ֖טֶן עַד י֥וֹם מוֹתֽ/וֹ־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''Look, you are pregnant and bearing a son''; the wording can be rendered more literally that way, though the context supports the predictive sense ''you will conceive and bear a son.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'a Nazirite of God.' The Hebrew uses the technical term for one specially consecrated to God.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 내게 말했습니다[a]. ‘보십시오, 당신은 임신하여 아들을 낳을 것입니다. 그러니 이제 포도주나 독주를 마시지 말고, 어떤 부정한 것도 먹지 마십시오[b]. 그 아이는 태에서부터 죽는 날까지 하나님께 바쳐진 나실인이 될 것이기 때문입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘보십시오, 당신은 임신했고 아들을 낳고 있습니다’에 가깝지만, 문맥상 예고의 의미가 분명하므로 미래형으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나실인으로’. 히브리어는 하나님께 특별히 구별된 사람을 가리키는 기술적 용어를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  english_pob_choice: For he said to me
  chosen_korean: 그가 내게 말했습니다
  alternatives_korean:
  - 그리고 내게 말했습니다
  - 내게 말씀하셨습니다
  lexicon: HALOT
  rationale: 보고 발화 동사를 자연스럽게 옮기되, 전후 문맥상 직접 인용을 도입하는 서술로 처리했습니다. ‘내게’는 히브리어의 간접목적을 그대로 반영합니다.
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  english_pob_choice: Look, you will conceive and bear a son
  chosen_korean: 보십시오, 당신은 임신하여 아들을 낳을 것입니다
  alternatives_korean:
  - 보십시오, 당신은 임신했고 아들을 낳습니다
  - 보십시오, 아들을 잉태하고 낳을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 현재형 형용사 표현을 문맥상 예고로 이해하여 미래로 옮겼습니다. ‘임신하여’는 상태를, ‘아들을 낳을 것입니다’는 출산 예고를 분명히 합니다.
- source_word: וְאַל תֹּאכְלִי כָּל טֻמְאָה
  english_pob_choice: and do not eat anything unclean
  chosen_korean: 어떤 부정한 것도 먹지 마십시오
  alternatives_korean:
  - 부정한 것은 아무것도 먹지 마십시오
  - 어떤 더러운 것도 먹지 마십시오
  lexicon: HALOT
  rationale: טֻמְאָה는 단순한 위생적 ‘더러움’이 아니라 의례적 부정의 범주이므로 ‘부정한 것’으로 옮겼습니다. 금지 범위를 자연스럽게 보이기 위해 ‘어떤 …도’ 구조를 사용했습니다.
- source_word: נְזִיר אֱלֹהִים
  english_pob_choice: a Nazirite of God
  chosen_korean: 하나님께 바쳐진 나실인
  alternatives_korean:
  - 하나님의 나실인
  - 하나님께 속한 나실인
  lexicon: HALOT
  rationale: נְזִיר은 기술적 용어이므로 ‘나실인’으로 음역을 유지했습니다. 소유격보다 봉헌 관계가 핵심이어서 ‘하나님께 바쳐진’으로 풀어 의미를 분명히 했습니다.
- source_word: מִן הַבֶּטֶן עַד יוֹם מוֹתוֹ
  english_pob_choice: from the womb until the day of his death
  chosen_korean: 태에서부터 죽는 날까지
  alternatives_korean:
  - 태에서부터 그의 죽는 날까지
  - 태에서부터 죽는 날까지 그의 전 생애 동안
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘태’와 종결 시점을 이루는 ‘죽는 날’을 살리되, 한국어에서는 ‘부터/까지’가 가장 자연스럽습니다. ‘그의’는 문맥상 아들을 가리키므로 생략해도 의미가 유지됩니다.
theological_decisions:
- issue: 나실인 규정의 번역 방식
  chosen_reading: 하나님께 바쳐진 나실인
  alternative_readings:
  - 하나님의 나실인
  - 하나님께 속한 나실인
  rationale: 본문은 단순한 도덕적 헌신이 아니라 특정한 서원/구별 상태를 가리키므로, 기술 용어 ‘나실인’을 유지하고 봉헌성을 드러내는 표현을 덧붙였습니다. 이는 전승적 교회 용어로 완화하지 않고 소스의 법적·서원적 성격을 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 보는 시점에서의 발화 재현
  chosen_reading: 보십시오, 당신은 임신하여 아들을 낳을 것입니다
  alternative_readings:
  - 보십시오, 당신은 임신했고 아들을 낳습니다
  - 보십시오, 아들을 잉태하고 낳을 것입니다
  rationale: 사건이 아직 발생하지 않은 예고이므로 현재 상태 진술보다 예언적 미래로 옮기는 것이 문맥에 더 충실합니다. 이는 서술의 선포성을 유지하면서도 한국어 독자가 자연스럽게 이해하도록 합니다.
  doctrine_reference: Translation philosophy §1, §6
