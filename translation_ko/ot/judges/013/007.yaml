  source_fidelity: 나실인(נְזִיר)이라는 기술 용어와 태에서부터 죽는 날까지라는 시간 범위는 대체로 잘 보존했습니다. 다만 ‘하나님께 바쳐진 나실인’은 히브리어의 연계 관계를 해설적으로 확정하는 면이 있으므로, 본문에서는 더 직접적인 ‘하나님의 나실인’을 쓰고 설명은 각주로 처리하는 편이 안전합니다. 또한 현행 각주 a는 וְיֹלַדְתְּ를 ‘아들을 낳고 있습니다’라고 설명하여 원문의 형태 및 문맥상 예고와 맞지 않습니다.
  naturalness: 합쇼체는 일관되고, ‘포도주나 독주’, ‘태에서부터 죽는 날까지’는 자연스럽습니다. ‘부정한 것은 아무것도 먹지 마십시오’가 ‘어떤 부정한 것도’보다 현대 한국어에서 더 매끄러우며 의례적 부정의 의미도 유지합니다.
