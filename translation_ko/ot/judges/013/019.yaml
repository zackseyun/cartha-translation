id: JDG.13.19
reference: Judges 13:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
  footnotes:
  - marker: a
    text: Or, 'and the angel of the LORD did something wondrous.' The Hebrew is compressed and does not restate the subject explicitly, though the context points to the messenger of the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 마노아는 염소 새끼와 곡식 제물을 가져다가 반석 위에서 야훼께 드렸습니다. 그리고 그가 놀라운 일을 행하는 동안[a] 마노아와 그의 아내는 지켜보고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자가 놀라운 일을 행하는 동안.’ 히브리어는 주어를 다시 말하지 않는 압축된 표현이며, 문맥은 야훼의 사자를 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  english_pob_choice: the young goat
  chosen_korean: 염소 새끼
  alternatives_korean:
  - 어린 염소
  - 염소 새끼를
  lexicon: HALOT
  rationale: 제사 맥락의 צעיר한 염소를 자연스러운 현대 한국어로 옮겼으며, 제물의 종류를 분명히 드러냅니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식 제물
  alternatives_korean:
  - 소제
  - 곡식 예물
  - 제물
  lexicon: HALOT
  rationale: 제사 용어 מִנְחָה를 맥락상 곡물 제사로 이해해 의미를 직접 드러냈고, 전통 교회어인 ‘소제’보다 현대 독자가 이해하기 쉽도록 했습니다.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  english_pob_choice: offered them on the rock to Yahweh
  chosen_korean: 반석 위에서 야훼께 드렸습니다
  alternatives_korean:
  - 반석 위에 바쳤습니다
  - 반석에서 야훼께 올려 드렸습니다
  lexicon: HALOT
  rationale: עלה의 제사적 용법을 ‘드리다’로 옮겼고, יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  english_pob_choice: and he did a wondrous thing
  chosen_korean: 그가 놀라운 일을 행하는 동안
  alternatives_korean:
  - 그가 놀랍게 행하는 동안
  - 그가 경이로운 일을 하는 동안
  lexicon: HALOT
  rationale: 히브리어의 압축된 분사구를 한국어 부사절로 풀어, 주어를 과도하게 특정하지 않으면서도 פלא의 강한 ‘놀라운/경이로운’ 의미를 살렸습니다.
- source_word: רֹאִים
  english_pob_choice: were watching
  chosen_korean: 지켜보고 있었습니다
  alternatives_korean:
  - 보고 있었습니다
  - 바라보고 있었습니다
  lexicon: HALOT
  rationale: 진행형의 지속적 관찰을 담아 ‘지켜보고 있다’로 옮겼습니다.
theological_decisions:
- issue: וּמַפְלִא לַעֲשׂוֹת의 주어를 본문이 직접 다시 말하지 않는 문제
  chosen_reading: 주어를 ‘그가’로 두되, 본문이 명시하지 않은 대상을 한국어 본문에서 덧붙여 특정하지는 않았습니다.
  alternative_readings:
  - ‘여호와의 사자가 놀라운 일을 행하는 동안’처럼 명시적으로 풀기
  - ‘놀라운 일이 일어나는 동안’처럼 비인칭으로 처리하기
  rationale: 문맥상 여호와의 사자를 가리키는 가능성이 크지만, 히브리어는 주어를 생략한 압축 구문이므로 그 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 본문의 문맥적 암시는 살리되, 본문이 말하지 않는 것을 본문처럼 확정하지 않습니다.
