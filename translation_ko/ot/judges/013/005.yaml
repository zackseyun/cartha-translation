  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
  footnotes:
  - marker: a
    text: Or 'to deliver Israel.' The Hebrew verb can mean 'save' or 'deliver' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 당신은 임신하여 아들을 낳을 것입니다. 그 머리에는 면도칼이 올라오지 못할 것입니다. 그 아이는 태중에서부터 하나님께 바친 나실인이 될 것이며, 블레셋 사람의 손에서 이스라엘을 구원하기 시작할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 건져낼.’ 히브리어 동사는 문맥에 따라 ‘구원하다’ 또는 ‘건져내다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적·선포적 주의를 환기하는 감탄/지시 표현으로, 현대 한국어에서는 ‘보십시오’가 공적 선언의 긴장감을 가장 자연스럽게 살립니다.
- source_word: הָרָה
  english_pob_choice: pregnant
  chosen_korean: 임신하여
  alternatives_korean:
  - 임신한
  - 아이를 밴
  lexicon: HALOT
  rationale: 히브리어는 현재 상태를 나타내는 서술형이므로, 미래형으로 옮기지 않고 현재적 상태를 드러내는 ‘임신하여’로 처리했습니다.
- source_word: נְזִיר אֱלֹהִים
  english_pob_choice: a Nazirite of God
  chosen_korean: 하나님께 바친 나실인
  alternatives_korean:
  - 하나님의 나실인
  - 하나님께 속한 나실인
  lexicon: HALOT
  rationale: ‘나실인’은 기술적 용어를 유지하고, genitive를 한국어로 자연스럽게 풀어 ‘하나님께 바친’으로 옮겨 봉헌적 성격을 분명히 했습니다.
- source_word: לְהוֹשִׁיעַ
  english_pob_choice: to save
  chosen_korean: 구원할
  alternatives_korean:
  - 구출할
  - 건져낼
  lexicon: HALOT
  rationale: 본문의 구원 행위는 전형적인 언약적·군사적 구원 맥락이므로, POB의 ‘save’를 따라 ‘구원할’로 옮겼습니다.
theological_decisions:
- issue: 삼손의 소명 범위
  chosen_reading: 블레셋 사람의 손에서 이스라엘을 구원하기 시작할 것입니다
  alternative_readings:
  - 이스라엘을 구원할 것입니다
  - 이스라엘을 건져낼 것입니다
  rationale: יָחֵל은 ‘시작하다’의 뉘앙스를 분명히 하므로, 삼손이 완결이 아니라 시작 단계의 구원을 수행한다는 본문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 태중부터의 봉헌
  chosen_reading: 태중에서부터 하나님께 바친 나실인
  alternative_readings:
  - 태어날 때부터 하나님께 바친 나실인
  - 태중에서부터 거룩하게 구별된 나실인
  rationale: ‘미ן הַבָּטֶן’의 태중 강조와 기술적 용어 ‘나실인’을 함께 살려, 출생 이전의 봉헌이라는 본문 의도를 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
