source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' Hebrew 'the sons of Israel' is a corporate designation for the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of the Philistines,' an idiom meaning into their power.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 다시 야훼 보시기에 악한 일을 행하였고, 야훼께서 그들을 블레셋 사람들의 손에 사십 년 동안 넘겨주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘블레셋 사람들의 손에’입니다. 이는 그들의 권세 아래로 넘겨졌다는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 공동체 전체를 가리키는 히브리어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  english_pob_choice: again did
  chosen_korean: 다시 … 행하였고
  alternatives_korean:
  - 계속해서 … 행하였고
  - 또 … 하였고
  lexicon: HALOT
  rationale: יסף의 반복·재개 의미를 살려, 재차 같은 악을 저질렀다는 순환적 문맥을 자연스럽게 드러내기 위해 ‘다시’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 친족적·공동체적 표현을 유지하면서도 현대 한국어에서 자연스럽게 읽히는 표준적 성구 번역형을 택했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: ‘눈/eyes’의 비유를 한국어 관용으로 살리되, 평가·판단의 기준이라는 뜻이 분명하도록 ‘보시기에’로 옮겼습니다.
- source_word: בְּיַד פְּלִשְׁתִּים
  english_pob_choice: into the hand of the Philistines
  chosen_korean: 블레셋 사람들의 손에
  alternatives_korean:
  - 블레셋 사람들의 권세 아래
  - 블레셋 사람들에게
  lexicon: HALOT
  rationale: ‘손’이라는 히브리어 관용을 보존해 지배·통제의 이미지를 유지했고, 한국어에서도 자연스러운 수동적 종속 표현으로 처리했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 신명기적 서술 속에서 하나님의 고유명 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 칭호 ‘주’가 아니라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 이스라엘 자손의 공동체 지칭
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 남성 복수 형태를 공동체 전체의 지칭으로 이해하면서도, 히브리어 형식을 평탄화하지 않고 보존하는 방향을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
