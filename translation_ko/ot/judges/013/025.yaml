  source_fidelity: 초안은 ‘단 진’과 ‘소라와 에스다올 사이에 있는 곳’을 별개의 장소처럼 연결하여 בְּמַחֲנֵה־דָן(마하네단)이라는 지명 및 그 뒤의 위치 설명을 정확히 반영하지 못합니다. 또한 ‘시작하여 그에게 감동하시니라’는 ‘그를 움직이기 시작하셨습니다’라는 히브리어의 구문과 어순을 흐립니다. 개정문은 야훼의 영이 마하네단에서 삼손을 움직이기 시작했다는 의미를 보존합니다.
  naturalness: 현대 표준어 합쇼체로 ‘야훼의 영께서 … 시작하셨습니다’가 자연스럽습니다. ‘그를 움직이기’는 여기서 신적 충동·추동을 뜻하며, 원문의 넓은 의미를 과도하게 좁히지 않습니다.
