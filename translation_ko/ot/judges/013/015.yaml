  rationale: 이 절의 신명 표지는 단순한 호칭이 아니라 히브리어 원문 요소이므로, 본문에는 야훼를 유지해 원천 텍스트의 가시성을 보존합니다.
  doctrine_reference: 출 3:15; 원문-본문 대응 원칙
