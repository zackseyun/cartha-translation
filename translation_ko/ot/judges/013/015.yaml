lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of the LORD
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 주님의 천사
  - 여호와의 천사
  lexicon: 야훼
  rationale: 본문의 יְהוָה는 야훼로 옮기는 것이 원문 직접성에 가장 가깝고, POB의 주의회피 번역 관행보다 원천어 표지를 살립니다.
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  english_pob_choice: Please let us detain you
  chosen_korean: 부디 당신을 붙잡아 두십시오
  alternatives_korean:
  - 부디 당신을 머물게 하십시오
  - 부디 당신을 억류하십시오
  lexicon: 붙잡아 두다
  rationale: 동사 עצר의 기본 의미인 ‘붙들다/멈추게 하다’를 살리되, 예의와 요청의 뉘앙스를 해치지 않도록 ‘부디’와 함께 자연스럽게 옮겼습니다.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ גְּדִי עִזִּים
  english_pob_choice: and we will prepare a young goat for you
  chosen_korean: 우리가 당신 앞에서 어린 염소를 준비하겠습니다
  alternatives_korean:
  - 우리가 당신을 위해 어린 염소를 준비하겠습니다
  - 우리가 당신 앞에 어린 염소를 차리겠습니다
  lexicon: 당신 앞에서
  rationale: לְפָנֶיךָ는 단순한 수혜(‘for you’)보다 ‘면전에서/앞에서’의 공간적 표지가 더 직접적이어서, 예식적·대면적 장면을 반영했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
