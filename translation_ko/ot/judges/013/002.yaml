  text: Now there was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
  footnotes:
  - marker: a
    text: Or, 'and had borne no children.' The Hebrew literally says, 'and she had not borne.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 소라[a]에서 나온 한 사람이 있었는데, 그는 단 사람들의 씨족에 속하였고 이름은 마노아였습니다. 그의 아내는 불임이었고 자녀를 낳지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소라에서’, 히브리어는 단지 ‘그리고 그녀는 낳지 않았다’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִצָּרְעָה
  english_pob_choice: from Zorah
  chosen_korean: 소라에서 나온
  alternatives_korean:
