  - 자녀를 출산하지 못했습니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '낳지 않았다'이므로, 한국어에서는 자연스럽게 결과를 표현하되 복수 여부를 과하게 특정하지 않도록 했습니다.
