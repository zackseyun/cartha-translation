base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: Now there was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
  footnotes:
  - marker: a
    text: Or, 'and had borne no children.' The Hebrew literally says, 'and she had not borne.'
    reason: lexical_alternative
translation:
  language: ko
  text: 소라 출신으로 단 사람들의 씨족에 속한 한 사람이 있었는데, 그의 이름은 마노아였습니다. 그의 아내는 불임이었고, 아이를 낳은 적이 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצָּרְעָה
  english_pob_choice: from Zorah
  chosen_korean: 소라에서 나온
  alternatives_korean:
  - 소라 출신의
  - 소라에서
  lexicon: HALOT
  rationale: מִן은 출처를 나타내므로, 장소 기원을 분명히 드러내는 표현으로 옮겼습니다. 고유명사는 통용 음역을 따랐습니다.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  english_pob_choice: from the clan of the Danites
  chosen_korean: 단 사람들의 씨족에 속하였고
  alternatives_korean:
  - 단 지파의 가문에 속하였고
  - 단 사람들의 가족에 속하였고
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파보다 작은 친족 집단이므로 '씨족'이 더 정확합니다. הַדָּנִי는 집합적으로 '단 사람들'로 옮겼습니다.
- source_word: וּשְׁמוֹ מָנוֹחַ
  english_pob_choice: and his name was Manoah
  chosen_korean: 이름은 마노아였습니다
  alternatives_korean:
  - 그의 이름은 마노아였습니다
  - 마노아라는 이름이었습니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 인명 제시 공식을 자연스러운 한국어 서술로 풀어, 인물 소개의 흐름을 살렸습니다.
- source_word: עֲקָרָה
  english_pob_choice: barren
  chosen_korean: 불임이었고
  alternatives_korean:
  - 아이를 낳지 못하는 상태였고
  - 아이를 갖지 못했고
  lexicon: HALOT
  rationale: עֲקָרָה는 단순한 '아이 없음'보다 생식 불능 상태를 가리키므로, 직설적이고 현대적인 '불임'을 선택했습니다.
- source_word: וְלֹא יָלָדָה
  english_pob_choice: had not borne children
  chosen_korean: 자녀를 낳지 못했습니다
  alternatives_korean:
  - 아이를 낳지 못했습니다
  - 자녀를 출산하지 못했습니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '낳지 않았다'이므로, 한국어에서는 자연스럽게 결과를 표현하되 복수 여부를 과하게 특정하지 않도록 했습니다.
theological_decisions:
- issue: 불임 서술의 기능
  chosen_reading: 이 표현은 단순한 의학적 정보가 아니라 뒤이어 오는 출생 약속 이야기의 긴장과 준비를 형성하는 서두로 옮겼습니다.
  alternative_readings:
  - 단순 배경 설명으로만 처리
  - 완곡하게 처리
  rationale: 사사기 13장의 도입부에서 불임과 출산 불가능은 본문 전개의 신학적 대비를 여는 핵심 장치이므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: 서사적 출생-약속 본문
