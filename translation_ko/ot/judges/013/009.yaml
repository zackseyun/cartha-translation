  edition: WLC
  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: ko
  text: 하나님께서 마노아의 음성을 들으시고, 하나님의 천사가 다시 그 여인에게 오셨습니다. 그 여인은 들에 앉아 있었고, 남편 마노아는 그녀와 함께 있지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  english_pob_choice: listened to the voice of
  chosen_korean: “마노아의 음성을 들으시고”
  alternatives_korean:
  - 마노아의 소리를 들으시고
  - 마노아의 요청을 들으시고
  lexicon: HALOT
  rationale: שמע בקול은 단순 청취보다 응답을 포함한 ‘들어 주심’의 뜻이어서, 영어 POB의 ‘listened to’에 맞춰 “들으시고”로 옮겼습니다.
- source_word: מַלְאַךְ הָאֱלֹהִים
  english_pob_choice: the angel of God
  chosen_korean: “하나님의 천사”
  alternatives_korean:
  - 하나님의 사자
  - 하나님께 속한 천사
  lexicon: HALOT
  rationale: 문맥상 초자연적 전달자인 מַלְאַךְ는 ‘천사’가 자연스럽고, 속격 구조는 표준적으로 “하나님의 천사”로 옮기는 것이 가장 직접적입니다.
- source_word: עוֹד
  english_pob_choice: again
  chosen_korean: “다시”
  alternatives_korean:
  - 한 번 더
  - 또
  lexicon: HALOT
  rationale: עוֹד는 재방문을 나타내므로, 간결하고 서술에 맞는 “다시”가 가장 자연스럽습니다.
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  english_pob_choice: while she was sitting in the field
  chosen_korean: “그때 그녀는 들에 앉아 있었고”
  alternatives_korean:
  - 그녀가 들에 앉아 있는 동안
  - 그녀는 들판에 앉아 있었고
  lexicon: HALOT
  rationale: 분사구는 배경 상황을 제시하므로 한국어에서는 “-고”로 이어지는 진행 배경으로 풀어 주었습니다.
- source_word: אִישָׁהּ אֵין עִמָּהּ
  english_pob_choice: her husband was not with her
  chosen_korean: “마노아 그의 남편은 그녀와 함께 있지 않았습니다”
  alternatives_korean:
  - 마노아는 그녀와 함께 있지 않았습니다
  - 그의 남편 마노아는 그녀와 함께 있지 않았습니다
  lexicon: HALOT
  rationale: אִישָׁהּ는 이 문맥에서 ‘그녀의 남편’이므로 관계를 분명히 드러냈고, עִם의 부재를 “함께 있지 않았습니다”로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: הָאֱלֹהִים의 한국어 표기
  chosen_reading: “하나님”
  alternative_readings:
  - 신들
  - 신
  rationale: 단수 동사와 서사 전체의 문맥이 이 표현을 이스라엘의 하나님으로 분명히 가리키므로, 다신론적 오독을 피하고 표준적으로 “하나님”이라 옮겼습니다.
  doctrine_reference: 문맥 우선의 단수 신 지칭
