base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
  footnotes:
  - marker: a
    text: Or, “who came to me the other day.” The Hebrew expression is literally “who came to me on the day,” referring back to the earlier visit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인은 서둘러 달려가서 자기 남편에게 알리고, 그에게 말했습니다. "보십시오, 그날 나에게 왔던 그 사람이 나에게 나타났습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그날에 나에게 왔던 사람”입니다. 이 표현은 앞선 방문을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  english_pob_choice: hurried
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 재빨리
  lexicon: HALOT
  rationale: מהר의 긴박감을 자연스러운 현대 한국어로 옮기되, 다음 동사 ‘달려가다’와 중복되지 않게 했습니다.
- source_word: וַתָּרָץ
  english_pob_choice: ran
  chosen_korean: 달려가서
  alternatives_korean:
  - 뛰어서
  - 달려
  lexicon: HALOT
  rationale: רוץ의 물리적 움직임을 분명히 살리기 위해 ‘달려가서’로 옮겨, 앞의 ‘서둘러’와 함께 이중의 급박함을 보존했습니다.
- source_word: לְאִישָׁהּ
  english_pob_choice: her husband
  chosen_korean: 자기 남편에게
  alternatives_korean:
  - 그 남편에게
  - 남편에게
  lexicon: HALOT
  rationale: אישׁ + 3인칭 여성 접미사는 이 문맥에서 관용적으로 ‘남편’을 뜻하므로, 서술의 자연스러움과 관계적 의미를 함께 살렸습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의 환기 표지를 한국어 직접화법에서 자연스럽고 공손하게 살렸습니다.
- source_word: נִרְאָה אֵלַי
  english_pob_choice: has appeared to me
  chosen_korean: 나에게 나타났습니다
  alternatives_korean:
  - 내게 나타났습니다
  - 내게 보였습니다
  lexicon: HALOT
  rationale: נראה의 수동/비능동 의미를 ‘나타나다’로 옮겨, 단순 ‘보였다’보다 인격적 현현의 뉘앙스를 유지했습니다.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  english_pob_choice: who came to me that day
  chosen_korean: 그날 나에게 왔던
  alternatives_korean:
  - 그날 나에게 온
  - 그날 내게 찾아왔던
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘그날에 나에게 온’이지만, 한국어에서는 시간 부사 ‘그날’과 과거 회상형 ‘왔던’을 써서 이전 방문을 가리키는 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 이 구절에서 화자가 정체를 어떻게 부르는가
  chosen_reading: 그 사람이
  alternative_readings:
  - 그 천사가
  - 하나님의 사자가
  rationale: 문맥 전체의 정체는 더 넓게 드러나더라도, 이 절에서 여인은 그 존재를 단지 ‘그 사람’으로 말하므로 화자의 시점을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
