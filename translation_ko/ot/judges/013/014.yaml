  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from all that comes out of the vine of wine,'' that is, anything derived from the grapevine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 포도나무에서 나온 것은 무엇이든 먹어서는 안 되고, 포도주와 독주를 마셔서도 안 되며, 어떤 부정한 것도 먹어서는 안 됩니다. 그녀는 내가 명령한 모든 것을 지켜야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘포도주의 포도나무에서 나오는 모든 것’이며, 곧 포도나무에서 유래한 모든 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  english_pob_choice: anything that comes from the grapevine
  chosen_korean: 포도나무에서 나온 것은 무엇이든
  alternatives_korean:
  - 포도나무에서 나오는 모든 것
  - 포도나무에서 나온 것이라면 무엇이든
  - 포도나무의 소산은 무엇이든
  lexicon: HALOT
  rationale: יֵצֵא의 ‘나오다/나가다’라는 동사를 살리면서, Hebrew imagery를 무리 없이 전달하기 위해 ‘포도나무에서 나온 것’으로 옮겼습니다.
- source_word: יַיִן וְשֵׁכָר
  english_pob_choice: wine or strong drink
  chosen_korean: 포도주와 독주
  alternatives_korean:
  - 포도주와 강한 술
  - 포도주와 진한 술
  - 포도주와 술독한 음료
  lexicon: HALOT
  rationale: יַיִן은 ‘포도주’가 가장 자연스럽고, שֵׁכָר는 전통적으로 ‘독주’로 옮겨 폭넓은 알코올 음료를 가리키는 뜻을 살렸습니다.
- source_word: כָל טֻמְאָה
  english_pob_choice: anything unclean
  chosen_korean: 어떤 부정한 것도
  alternatives_korean:
  - 부정한 것은 아무것도
  - 어떤 더러운 것도
  - 어떤 부정한 것
  lexicon: HALOT
  rationale: טֻמְאָה의 성경적 정결 범주를 유지하기 위해 ‘부정한 것’으로 옮기되, 부정어와 결합해 금지의 포괄성을 드러냈습니다.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ תִּשְׁמֹר
  english_pob_choice: She must keep all that I commanded her
  chosen_korean: 내가 명령한 모든 것을 지켜야 합니다
  alternatives_korean:
  - 내가 명령한 모든 것을 지켜야 합니다
  - 내가 그에게 명령한 모든 것을 지켜야 합니다
  - 내가 명령한 것을 모두 지켜야 합니다
  lexicon: HALOT
  rationale: שׁמר는 여기서 ‘지키다/준수하다’의 뜻이므로 ‘지켜야 합니다’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 샘손 출생 예고에 나타난 금지 목록의 범위
  chosen_reading: 포도나무에서 나온 것 전체를 포괄하는 금지로 읽어 본문을 옮겼습니다.
  alternative_readings:
  - 포도나무의 열매만 금지로 읽는 번역
  - 포도 제품에 한정하는 번역
  rationale: 히브리어 표현은 유래물을 포괄하는 방식으로 넓게 말하므로, 본문이 요구하는 분리와 절제의 강도를 약화시키지 않기 위해 넓은 범위를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: טֻמְאָה의 번역 어조
  chosen_reading: ‘부정한 것’을 사용해 정결/부정 범주의 성경적 등록을 유지했습니다.
  alternative_readings:
  - ‘더러운 것’
  - ‘불결한 것’
  - ‘불순한 것’
  rationale: 이 용어는 도덕적 혐오보다 언약적·의례적 부정을 가리키므로, 교회적 완곡어보다 본문 범주를 보존하는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
