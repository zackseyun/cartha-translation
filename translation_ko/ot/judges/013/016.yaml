  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, “I will not eat your bread.” Here “bread” likely means food or a meal more generally.
    reason: lexical_alternative
  - marker: b
    text: Or “If you make a burnt offering, you must offer it to the LORD.” The Hebrew uses one verb for making/preparing the offering and another for offering it up.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 천사가 마노아에게 말했습니다. “당신이 저를 붙잡아 두셔도, 저는 당신이 마련한 음식[a]을 먹지 않겠습니다. 그러나 번제물을 준비하시면, 그것을 야훼께 드리십시오[b].” 마노아는 그가 야훼의 천사인 줄 몰랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로 “당신의 빵”입니다. 여기서 לֶחֶם은 실제 빵보다 음식이나 식사를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “번제물을 만들면, 그것을 야훼께 올려 드리십시오”입니다. 히브리어는 제물을 ‘만들다/준비하다’와 ‘올려 드리다’에 서로 다른 동사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 주님의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초자연적 전달자를 가리키므로 '천사'로 옮기고, יְהוָה는 프로젝트 기본값에 따라 '야훼'로 유지했습니다.
- source_word: תַּעְצְרֵנִי
  english_pob_choice: you detain me
  chosen_korean: 나를 붙잡아 두더라도
  alternatives_korean:
  - 나를 붙들더라도
  - 나를 머물게 하더라도
  lexicon: HALOT
  rationale: עצר의 '붙잡다/억제하다/머물게 하다'의 뜻을 살려, 손님을 머물게 하려는 정황을 자연스럽게 드러내면서도 원문의 제지감을 유지했습니다.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  english_pob_choice: I will not eat your food
  chosen_korean: 나는 당신의 음식을 먹지 않겠습니다
  alternatives_korean:
  - 나는 당신의 빵을 먹지 않겠습니다
  - 나는 당신의 식사를 먹지 않겠습니다
  lexicon: HALOT
  rationale: לֶחֶם의 문자적 '빵'보다 문맥상 일반 음식/식사를 뜻하는 관용법이므로, 현대 한국어에서 자연스러운 '음식'으로 옮겼습니다.
- source_word: תַּעֲשֶׂה עֹלָה ... תַּעֲלֶנָּה
  english_pob_choice: you prepare a burnt offering ... offer it up
  chosen_korean: 번제물[a]을 준비하면, 그것을 ... 드리십시오[b]
  alternatives_korean:
  - 번제물을 만들면, 그것을 ... 올리십시오
  - 번제물을 바치려 하면, 그것을 ... 바치십시오
  lexicon: HALOT
  rationale: 첫 동사 עשה는 제물을 '만들다/준비하다'의 의미를 살리고, 뒤의 העלה는 별도의 제의 행위로서 '드리다'로 구분해 두 동사의 차이를 보존했습니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 번제 제물
  lexicon: HALOT
  rationale: עֹלָה는 전체를 불태워 드리는 제사 제물을 가리키므로, 현대 한국어에서 명사화된 '번제물'이 가장 직접적입니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼로 음역하여 하나님의 고유한 이름을 보존했습니다.
  alternative_readings:
