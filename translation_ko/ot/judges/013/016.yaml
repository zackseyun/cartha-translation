  rationale: 본문은 신성 칭호가 아니라 언약의 이름 יְהוָה를 사용하므로, 프로젝트 기본값에 따라 '야훼'를 유지해 본문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
