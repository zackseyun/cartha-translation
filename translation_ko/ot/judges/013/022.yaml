  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
  footnotes:
  - marker: a
    text: Or “a god” or “a divine being.” The Hebrew אֱלֹהִים can in some contexts refer more broadly to a divine being, but here the context favors “God.”
