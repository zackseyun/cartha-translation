source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
  footnotes:
  - marker: a
    text: Or “a god” or “a divine being.” The Hebrew אֱלֹהִים can in some contexts refer more broadly to a divine being, but here the context favors “God.”
    reason: lexical_alternative
translation:
  language: ko
  text: 마노아가 자기 아내에게 말했습니다. “우리는 반드시 죽습니다. 우리가 하나님을 보았기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서사적 הבא/와우 연속의 단순 과거를 자연스러운 현대 서술로 옮기되, 한국어에서는 접속사보다 동사 중심 구성이 더 매끄럽습니다.
- source_word: אֶל אִשְׁתּוֹ
  english_pob_choice: to his wife
  chosen_korean: 자기 아내에게
  alternatives_korean:
  - 그의 아내에게
  - 아내에게
  lexicon: HALOT
  rationale: 소유 접미사의 관계를 한국어에서 자연스럽게 드러내는 표현으로, 본문의 가족 관계를 분명히 합니다.
- source_word: מוֹת נָמוּת
  english_pob_choice: We will surely die
  chosen_korean: 우리는 반드시 죽습니다
  alternatives_korean:
  - 우리는 틀림없이 죽습니다
  - 우리는 정말로 죽게 됩니다
  - 죽고 말 것입니다
  lexicon: HALOT
  rationale: 부정사 절대형과 미완료형의 강조를 한국어 부사 '반드시'로 살려, 단순 예고가 아니라 필연적 죽음의 확신을 전달합니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하늘의 존재
  - 하나님 같은 분
  lexicon: HALOT
  rationale: 문맥상 마노아가 두려워하는 대상은 단순한 '신적 존재'가 아니라 참된 하나님이므로, POB의 영어 선택을 따라 '하나님'으로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 의미를 '하나님'으로 둘지 '신/신적 존재'로 넓게 둘지
  chosen_reading: 하나님
  alternative_readings:
  - 신
  - 신적 존재
  - 하나의 신
  rationale: 본문은 여호와의 사자와의 만남 속에서 죽음 공포를 표현하며, 서사의 신학적 긴장을 유지하려면 '하나님'이 가장 적절합니다.
  doctrine_reference: 본문의 신학적 긴장을 번역에서 해소하지 않고 유지함
