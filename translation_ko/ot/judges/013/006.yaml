id: JDG.13.6
reference: Judges 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
  footnotes:
  - marker: a
    text: Or, 'an angel of God.' The Hebrew can be understood as a comparison to a divine messenger without requiring the woman to have fully identified him at this point.
    reason: alternative_reading
  - marker: b
    text: '''Very fearsome'' may also be rendered ''very awesome'' or ''very terrifying''; the Hebrew expresses an appearance that inspired intense awe and fear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 와서 자기 남편에게 말했습니다. “하나님의 사람이 제게 왔는데, 그의 모습은 하나님의 천사의 모습과 같았으며 매우 두려운 모습이었습니다. 저는 그가 어디에서 왔는지 묻지 않았고, 그도 자기 이름을 제게 알려 주지 않았습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 여인
  - 아내
  lexicon: HALOT
  rationale: 본문은 이미 등장한 인물을 다시 가리키므로 자연스럽고 직역에 가까운 ‘그 여자’가 적절합니다. ‘아내’로 풀면 관계를 미리 명시해 본문의 서술 흐름을 바꿀 수 있습니다.
- source_word: לְאִישָׁהּ
  english_pob_choice: to her husband
  chosen_korean: 자기 남편에게
  alternatives_korean:
  - 그의 남자에게
  - 그 남편에게
  lexicon: HALOT
  rationale: 3인칭 여성 단수 접미사가 붙은 אִישׁ는 이 혼인 문맥에서 ‘남편’을 뜻하므로, 한국어에서도 관계를 분명히 하는 ‘자기 남편에게’가 가장 정확합니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: a man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님 사람
  - 하나님의 남자
  lexicon: HALOT
  rationale: 히브리어의 관용적 칭호를 그대로 살려 ‘하나님의 사람’으로 옮겼습니다. 이는 단순한 종교적 표현이 아니라 인물의 정체성을 암시하는 제목이므로 유지하는 것이 좋습니다.
- source_word: מַלְאַךְ הָאֱלֹהִים
  english_pob_choice: the angel of God / an angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 사자
  - 하나님의 메신저
  lexicon: HALOT
  rationale: 이 장면에서는 초자연적 방문자를 가리키는 표현이므로 ‘천사’가 가장 자연스럽습니다. 다만 본문은 아직 그 정체를 완전히 해명하지 않으므로, 문맥이 허용하는 범위 안에서만 옮겼습니다.
- source_word: נוֹרָא מְאֹד
  english_pob_choice: very fearsome
  chosen_korean: 매우 두려웠습니다
  alternatives_korean:
  - 매우 두려운 모습이었습니다
  - 매우 경외스러웠습니다
  - 매우 무서웠습니다
  lexicon: HALOT
  rationale: נוֹרָא는 두려움과 경외를 함께 담는 말이지만, 여기서는 외형이 주는 충격을 강조하므로 ‘매우 두려웠습니다’가 합당합니다. ‘경외스럽다’는 현대 한국어에서 다소 추상적일 수 있습니다.
- source_word: אֵי מִזֶּה הוּא
  english_pob_choice: where he was from
  chosen_korean: 어디에서 왔는지
  alternatives_korean:
  - 어느 곳 출신인지
  - 어디 출신인지
  lexicon: HALOT
  rationale: 이 관용구는 출신이나 기원을 묻는 표현이므로, 한국어에서는 대화체로 자연스러운 ‘어디에서 왔는지’가 적절합니다.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  english_pob_choice: and he did not tell me his name
  chosen_korean: 자기 이름을 내게 알려 주지 않았습니다
  alternatives_korean:
  - 그의 이름을 내게 말하지 않았습니다
  - 자기 이름을 내게 말해 주지 않았습니다
  lexicon: HALOT
  rationale: הִגִּיד는 ‘말하다/알려 주다’의 뜻을 가지므로, 단순한 발화보다 정보 전달을 살리는 ‘알려 주다’가 좋습니다. 남편에게 전하는 보고체 문맥에도 잘 맞습니다.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים의 정체를 얼마나 확정적으로 표현할지
  chosen_reading: ‘하나님의 천사’로 옮기되, 본문 자체가 아직 완전한 신분 확정을 요구하지는 않는다고 본다
  alternative_readings:
  - ‘하나님의 사자’
  - ‘하나님의 메신저’
  - ‘하나님의 천사’ 대신 더 중립적으로 처리
  rationale: 히브리어는 분명 초월적 존재를 가리키지만, 이 절의 화자는 그를 아직 충분히 식별하지 못한 상태입니다. 따라서 한국어에서도 정체를 지나치게 해명하지 않고, 본문이 유지하는 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
