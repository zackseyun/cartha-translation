  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
  footnotes:
  - marker: a
    text: Or 'implored' / 'prayed to'; the Hebrew verb conveys earnest supplication.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the man of God'; Manoah speaks from his present understanding, without yet identifying the visitor more specifically.
    reason: alternative_reading
  - marker: c
    text: 'Or ''for the child who will be born.'' The Hebrew is masculine: ''for the boy who is to be born.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 마노아가 야훼께 간구하며 말했습니다[a]. 「부디, 주님[b], 당신이 보내신 하나님의 사람을 다시 우리에게 오게 하시고, 태어날 그 소년[c]에게 우리가 어떻게 해야 할지 가르쳐 주십시오」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간청하며’ / ‘기도하며’. 히브리어 동사는 간절한 청원을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘하나님의 사람’. 마노아는 아직 그 방문자를 더 구체적으로 식별하지 못한 채 말합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘태어날 아이’. 히브리어는 남성형으로 ‘태어날 그 소년’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  english_pob_choice: entreated
  chosen_korean: 간구하며
  alternatives_korean:
  - 간청하며
  - 애원하며
  - 기도하며
  lexicon: HALOT
  rationale: עוּר/עתר 계열의 강한 청원 행위로, 단순히 말한 것이 아니라 하나님께 절박하게 매달린 뉘앙스를 살리기 위해 ‘간구하다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명사 יְהוָה를 한국어 음역으로 직접 살려, 호칭 대체가 아닌 하나님의 이름 자체를 드러냈습니다.
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  - 주님이시여
  lexicon: HALOT
  rationale: 하나님께 드리는 공손한 부름으로서 한국어 기도/간청 문맥에 자연스러운 ‘주님’을 사용했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 남자
  - 하나님의 종
  - 하나님의 사자
  lexicon: HALOT
  rationale: 히브리어 표현을 직역에 가깝게 옮기되, 마노아의 현재 인식이라는 서사적 긴장을 유지하기 위해 ‘하나님의 사람’으로 두었습니다.
- source_word: לַנַּעַר הַיּוּלָּד
  english_pob_choice: for the boy who is to be born
  chosen_korean: 태어날 그 소년
  alternatives_korean:
  - 태어날 아이
  - 태어날 남자아이
  - 출생할 그 아이
  lexicon: HALOT
  rationale: 히브리어의 남성형 나아르와 ‘태어날’의 미래성 모두를 살려, 성별을 흐리지 않도록 ‘소년’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה와 제목 אֲדֹנָי의 구분
  chosen_reading: 본문의 יְהוָה는 ‘야훼’, 직접 호칭 אֲדֹנָי 는 ‘주님’으로 분리했습니다.
  alternative_readings:
  - 둘 다 주님으로 통일
  - 둘 다 야훼로 처리
  rationale: 히브리어 원문에서 신명사와 호칭이 구별되므로, 독자가 마노아의 기도 대상과 정중한 부름을 함께 보도록 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘하나님의 사람’에 내재한 인물 정체성의 긴장 유지
  chosen_reading: 마노아의 말은 아직 그 인물을 ‘하나님의 사람’으로 부르며, 더 구체적 해석을 본문에 앞당겨 넣지 않았습니다.
  alternative_readings:
  - 하나님의 사자
  - 천사
  - 주님의 사자
  rationale: 서술자의 나중 계시를 현재 발화에 미리 반영하면 본문의 인식 차이가 사라지므로, 원문의 서사적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: לַנַּעַר의 남성형 보존
  chosen_reading: ‘소년’으로 옮겨 남성 표지를 유지했습니다.
  alternative_readings:
  - 아이
  - 어린이
  rationale: 본문은 장차 태어날 남자아이를 가리키며, 성별 정보를 중화하지 않는 것이 원문의 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4: Gender-accurate over gender-neutral'
