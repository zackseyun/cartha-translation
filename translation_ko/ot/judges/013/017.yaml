  naturalness: ‘당신의 말씀이 이루어질 때 우리가 당신을 공경하려는 것입니다’는 현대 한국어 합쇼체 대화로 자연스럽지 않습니다. 목적 관계를 ‘…공경할 수 있도록’으로 명시하면 자연하고 원문의 문장 연결도 보존됩니다.
  terminology: ‘야훼의 천사’는 문맥상 가능한 번역이며, מַלְאָךְ의 다른 어휘 가능성은 각주로 처리하는 것이 적절합니다. 각주 표지는 해당 어구 바로 뒤에 두어야 합니다. כבד는 여기서 ‘공경하다’로 적절합니다.
