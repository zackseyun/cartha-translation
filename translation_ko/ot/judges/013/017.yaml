  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 마노아가 야훼의 천사[a]에게 말했습니다. 「당신의 이름이 무엇입니까? 당신의 말이 이루어질 때 우리가 당신을 공경할 수 있도록 말입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 천사’는 직역형이며, 문맥에 따라 ‘야훼의 사자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of the LORD
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초자연적 존재를 가리키므로 ‘천사’가 자연스럽고, יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
- source_word: מִי שְׁמֶךָ
  english_pob_choice: What is your name
  chosen_korean: 당신의 이름이 무엇입니까
  alternatives_korean:
  - 당신의 이름이 무엇입니까
  - 이름이 무엇입니까
  lexicon: HALOT
  rationale: 히브리어 관용구는 이름을 묻는 표현이므로, 한국어에서도 직설적이고 자연한 질문형으로 옮겼습니다.
- source_word: יָבֹא דְבָרֶיךָ
  english_pob_choice: your words come to pass
  chosen_korean: 당신의 말씀이 이루어질 때
  alternatives_korean:
  - 당신의 말이 성취될 때
  - 당신의 말씀이 실현될 때
  lexicon: HALOT
  rationale: דְבָרֶיךָ의 복수형을 살리면서도, 예언 성취의 뜻을 한국어 관용으로 자연스럽게 드러내기 위해 ‘이루어질 때’로 옮겼습니다.
- source_word: וְכִבַּדְנוּךָ
  english_pob_choice: we may honor you
  chosen_korean: 우리가 당신을 공경하려는 것입니다
  alternatives_korean:
  - 우리가 당신을 존중하려는 것입니다
  - 우리가 당신께 영광을 돌리려는 것입니다
  lexicon: HALOT
  rationale: כבד의 기본 의미인 ‘존귀하게 여기다/공경하다’를 반영했습니다. 여기서는 하나님께 드리는 ‘영광’보다, 약속 성취 후 그 존재를 높여 대하려는 뜻이므로 ‘공경’이 더 정확합니다.
theological_decisions:
- issue: 야훼의 천사 호칭 처리
  chosen_reading: ‘야훼의 천사’로 본문에 두고, ‘사자/메신저’는 대안으로만 기록합니다.
  alternative_readings:
  - 야훼의 사자
  - 야훼의 메신저
  rationale: 본문은 단순 전달자보다 초자연적 인물을 암시하므로, 서사적 기능을 보존하는 ‘천사’가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: מַלְאַךְ יְהוָה'
- issue: 이루어질 때”의 목적/결과 뉘앙스
  chosen_reading: ‘당신의 말씀이 이루어질 때 우리가 당신을 공경하려는 것입니다’로 결과 목적을 함께 살렸습니다.
  alternative_readings:
  - 당신의 말씀이 이루어질 때 우리가 당신을 공경할 것입니다
  - 당신의 말씀이 이루어질 때 우리가 당신을 공경하게 하소서
  rationale: כִּי는 여기서 단순한 이유보다 결과/목적 연결을 띠므로, 한국어에서 자연한 ‘-려는 것입니다’로 연결했습니다.
  doctrine_reference: HALOT on כִּי
