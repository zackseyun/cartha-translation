  text: וַ/יְהִי֩ בַ/עֲל֨וֹת הַ/לַּ֜הַב מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ הַ/שָּׁמַ֔יְמָ/ה וַ/יַּ֥עַל מַלְאַךְ יְהוָ֖ה בְּ/לַ֣הַב הַ/מִּזְבֵּ֑חַ וּ/מָנ֤וֹחַ וְ/אִשְׁתּ/וֹ֙ רֹאִ֔ים וַ/יִּפְּל֥וּ עַל פְּנֵי/הֶ֖ם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'angel' or 'messenger.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'fell on their faces to the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제단에서 불꽃이 하늘 쪽으로 올라갈 때, 야훼의 천사가 제단의 불꽃 가운데서 올라갔습니다.[a] 노아와 그의 아내는 보고 있었으며, 곧 그들은 얼굴을 땅에 대고 엎드렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 사자’. 히브리어는 ‘천사’와 ‘사자/메신저’ 둘 다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들은 얼굴을 땅에 대고 쓰러졌다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 초자연적 존재를 가리키는 것이 자연스러워 ‘천사’로 옮기되, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בַּעֲלוֹת ... הַשָּׁמַיְמָה
  english_pob_choice: went up ... toward heaven
  chosen_korean: 하늘 쪽으로 올라갈 때
  alternatives_korean:
  - 하늘로 올라갈 때
  - 하늘을 향해 올라갈 때
  lexicon: HALOT
  rationale: 사건의 배경을 여는 시간 절로 처리해 영어의 ‘And when’에 해당하는 장면 설정을 살리면서, 방향성은 ‘하늘 쪽으로’로 자연스럽게 표현했습니다.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  english_pob_choice: in the flame of the altar
  chosen_korean: 제단의 불꽃 속으로
  alternatives_korean:
  - 제단의 불꽃 가운데로
  - 제단의 불꽃 안으로
  lexicon: HALOT
  rationale: ב의 위치/도구적 뉘앙스를 살려, 천사가 제단 불꽃 ‘속으로’ 올라갔다는 시각적 장면을 자연스럽게 표현했습니다.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  english_pob_choice: they fell on their faces to the ground
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 넘어졌습니다
  - 얼굴을 땅에 대고 엎드렸습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역만 하지 않고, 경외와 두려움의 자세를 드러내는 한국어 관용 표현인 ‘얼굴을 땅에 대고 엎드리다’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 본문의 신성명은 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 히브리어 신성명은 학술적 음역인 ‘야훼’를 유지하여 원문 식별성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 만남의 종말적 현상 묘사
  chosen_reading: 천사가 제단 불꽃 속으로 올라가는 장면을 기적적 현상으로 그대로 번역했습니다.
  alternative_readings:
  - 환상적 표상으로 완화
  - 상징적 표현으로 해석
  rationale: 본문은 현상 자체를 서술하며 해석을 미루므로, 번역에서도 그 긴장과 시각적 충격을 약화시키지 않았습니다.
  doctrine_reference: Narrative descriptive theology in Judges 13
