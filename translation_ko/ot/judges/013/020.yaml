  source_fidelity: 본문의 사건 순서와 주요 어휘는 대체로 충실합니다. 다만 בְּלַהַב הַמִּזְבֵּחַ는 천사가 불꽃을 향해 들어갔다는 뜻이라기보다 제단의 불꽃 가운데서/불꽃과 함께 위로 올라간 모습을 나타냅니다. 따라서 ‘불꽃 속으로 올라갔습니다’는 이동의 목적지를 ‘불꽃 내부’로 오해하게 할 수 있습니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘제단의 불꽃 가운데서 올라갔습니다’가 원문의 장면을 더 자연스럽고 정확하게 전달합니다.
  terminology: ‘야훼의 천사’는 מַלְאַךְ יְהוָה의 문맥상 적절한 번역이며, 대안적 의미는 각주에서 보존할 수 있습니다. ‘얼굴을 땅에 대고 엎드렸습니다’도 히브리어 관용구를 자연스럽게 옮깁니다.
