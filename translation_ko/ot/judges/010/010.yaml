  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: ko
  text: 그때 이스라엘 자손이 야훼께 부르짖어 말했습니다. “우리가 주께 죄를 지었습니다. 이는 우리가 우리의 하나님을 버리고 바알들을 섬겼기 때문입니다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 본문은 “바알들”(복수형)을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּזְעֲקוּ ... אֶל יְהוָה
  english_pob_choice: cried out to the LORD
  chosen_korean: 야훼께 부르짖어
  alternatives_korean:
  - 야훼께 외쳐
  - 주께 부르짖어
  lexicon: זעק
  rationale: 강한 호소와 구조 요청의 의미를 살려 “부르짖어”로 옮겼습니다. 본문이 YHWH를 가리키므로 본문 표기 원칙에 따라 야훼를 사용했습니다.
- source_word: חָטָאנוּ לָךְ
  english_pob_choice: We have sinned against you
  chosen_korean: 우리가 주께 죄를 지었습니다
  alternatives_korean:
  - 우리가 주께 죄를 범했습니다
  - 우리가 당신께 죄를 지었습니다
  lexicon: חטא + ל
  rationale: 직역적이면서도 현대 한국어에서 자연스러운 “죄를 지었습니다”를 택했습니다. הנמען이 야훼이므로 “주께”로 존대 호칭을 유지했습니다.
- source_word: עָזַבְנוּ אֶת אֱלֹהֵינוּ
  english_pob_choice: we have forsaken our God
  chosen_korean: 우리가 우리의 하나님을 버리고
  alternatives_korean:
  - 우리가 우리 하나님을 떠나고
  - 우리가 우리의 하나님을 저버리고
  lexicon: עזב
  rationale: 관계 단절의 적극성을 살려 “버리고”로 옮겼습니다. “우리의 하나님”은 소유격을 유지하여 언약적 배반을 드러냅니다.
- source_word: וַנַּעֲבֹד אֶת הַבְּעָלִים
  english_pob_choice: have served the Baals
  chosen_korean: 바알들을 섬겼기 때문입니다
  alternatives_korean:
  - 바알들을 섬겼습니다
  - 바알들을 섬겨왔기 때문입니다
  lexicon: עבד + הבעלים
  rationale: 복수형 관사형 명사 הַבְּעָלִים의 수를 살려 “바알들을”로 옮겼습니다. “섬겼기 때문입니다”는 앞 절의 “왜/이유”를 자연스럽게 받습니다.
theological_decisions:
- issue: 야훼 표기와 인칭 호칭의 구분
  chosen_reading: 서술 문맥의 신명(神名)은 야훼로 두고, 직접 호소의 대상은 “주”로 번역했습니다.
  alternative_readings:
  - 야훼께 ... 죄를 지었습니다
  - 주께 ... 죄를 지었습니다
  rationale: 본절은 YHWH를 직접 부르지만, 고백문 안에서는 한국어 기도 관용을 따라 존대 호칭 “주”를 유지하는 것이 문체상 더 자연스럽습니다. 다만 본문 식별 표지는 야훼로 보존했습니다.
  doctrine_reference: 출 3:15; 시 8:1의 신명 호칭 관례
