review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그 후에’는 אַחֲרָיו(그의 뒤를 이어)의 인칭 계승 관계를 일반적인 시간 부사로 약화합니다. 또한 ‘이스라엘을 심판한 지 이십이 년이 되었더라’는 וַיִּשְׁפֹּט ... עֶשְׂרִים וּשְׁתַּיִם שָׁנָה의 단순 과거 서술과 기간 표현을 ‘~한 지 ... 되다’라는 경과 표현으로 바꾸어 의미와 문법 관계를 바꿉니다.
  naturalness: 현대 표준어 합쇼체에서는 ‘이십이 년’보다 ‘22년’ 또는 ‘이십이 년 동안’이 자연스럽습니다. ‘심판한 지 ... 되었더라’는 이 문맥에서 부자연스럽고, ‘사사로서 ... 다스렸습니다’가 사사기의 שפט 용례를 자연스럽게 전달합니다.
  terminology: 인명과 지명은 ‘야일’, ‘길르앗’으로 유지합니다. שפט는 현대 한국어의 법정·종말론적 의미가 강한 ‘심판하다’보다, 사사기의 지도자 역할을 드러내는 ‘사사로서 ... 다스리다’로 옮기는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그 후에’가 ‘그의 뒤를 이어’를 대체함
    rationale: אַחֲרָיו는 선행 인물을 가리키는 대명사 접미사를 포함하므로, 단순한 시간적 ‘그 후에’보다 개인적 계승을 밝혀야 합니다.
  - severity: high
    issue: ‘심판한 지 이십이 년이 되었더라’라는 기간 표현
    rationale: 원문은 야일이 이스라엘을 22년 동안 판단/통치했다는 서술이지, 심판을 시작한 뒤 22년이 경과했다는 표현이 아닙니다. 또한 한국어 ‘심판하다’는 이 문맥에서 오해될 수 있습니다.
  - severity: low
    issue: 합쇼체 불일치
    rationale: ‘되었더라’는 고전 성경체로, 지정된 현대 정중체 합쇼체와 맞지 않습니다.
  revised_text: 3. 그의 뒤를 이어 길르앗 사람 야일이 일어나 사사로서 이스라엘을 이십이 년 동안 다스렸습니다.
