  to: 그들은 그 해에 이스라엘 자손을 산산이 부수고 짓눌렀습니다[a]. 그들은 십팔 년 동안 요단 저편, 곧 길르앗에 있는 아모리 사람의 땅에 있던 모든 이스라엘 자손을 괴롭혔습니다[b].
