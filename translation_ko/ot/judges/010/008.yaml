  source_fidelity: 개정이 필요합니다. 초안은 첫 절의 강한 두 동사를 일반적인 ‘괴롭히고 학대하여’로 평준화하고, ‘그 해에’를 불필요하게 반복합니다. 히브리어의 강렬한 병렬 표현과 이어지는 십팔 년의 기간을 구별해 옮겨야 합니다. 또한 원문의 ‘아모리 사람의 땅’을 보존해야 합니다.
  naturalness: 초안의 ‘그 해에 … 그 해에 십팔 년 동안’은 현대 한국어에서 부자연스럽고 문장 구조가 불명확합니다. 두 문장으로 나누고, 서술을 합쇼체 과거형으로 정리하면 자연스럽습니다.
  terminology: ‘이스라엘 자손’, ‘요단 저편’, ‘길르앗’, ‘아모리 사람’은 원문의 반복과 지리적 표현을 적절히 보존합니다. ‘산산이 부수고 짓눌렀습니다’는 רָעַץ/רָצַץ의 폭력적이고 강조적인 병렬을 반영합니다.
