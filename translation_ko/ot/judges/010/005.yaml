- source_word: בְּקָמוֹן
  english_pob_choice: in Kamon
  chosen_korean: 가몬에
  alternatives_korean:
  - 가몬에서
  lexicon: HALOT
  rationale: 전치사 ב의 기본적인 위치 표지를 한국어 처소 조사 ‘-에’로 옮겨, 매장 장소를 직설적으로 나타냈습니다.
