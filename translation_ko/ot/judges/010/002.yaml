  source_fidelity: 초안의 ‘심판한 지 … 되매’는 וַיִּשְׁפֹּט의 통치·사사 활동을 ‘심판’으로 좁히고, 히브리어에 없는 ‘~한 지 … 되매’의 시간 구문을 더합니다. ‘이스라엘을 이십삼 년 동안 다스렸습니다’는 사사기에 반복되는 שׁפט의 기능을 자연스럽게 보존합니다. 와우 연속형의 순서는 ‘그 뒤’로 나타내고, 수동형 ‘묻혔습니다’는 장사한 주체를 보태지 않습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 나누어 자연스럽게 다듬었습니다. ‘이십삼 년’은 성경 번역 문체에 맞으며, ‘묻혔습니다’는 현대 독자에게 ‘장사되었더라’보다 자연스럽습니다.
  terminology: 지명 שָׁמִיר은 통상 음역인 ‘사밀’로 옮겼습니다. 초안의 ‘삼미르’는 히브리어 자음 및 일반적인 한국어 성경 지명 표기와 맞지 않습니다. שׁפט는 이 문맥에서 ‘다스리다’로 번역하되 특정 교파적 직제 해석을 덧붙이지 않았습니다.
