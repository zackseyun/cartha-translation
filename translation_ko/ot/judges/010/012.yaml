id: JDG.10.12
reference: Judges 10:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
  footnotes:
  - marker: a
    text: Or 'the Amalekites.' The Hebrew reads 'Amalek,' which may stand for the people as a whole.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Maonites.' The Hebrew reads 'Maon,' likely referring to a people-group associated with Maon.
    reason: lexical_alternative
translation:
  language: ko
  text: 시돈 사람들과 아말렉[a]과 마온[b]이 여러분을 압제하였고, 여러분이 내게 부르짖었고, 나는 그들의 손에서 여러분을 구원하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 집단명으로도 읽을 수 있는 고유명사 형태를 사용하므로, ‘아말렉 사람들’로 풀어 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 지명 ‘마온’을 적고 있어, 사람 집단을 뜻하는 ‘마온 사람들’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  english_pob_choice: The Sidonians
  chosen_korean: 시돈 사람들
  alternatives_korean:
  - 시돈인들
  - 시돈 사람들
  lexicon: HALOT
  rationale: 히브리어는 시돈의 주민 집단을 가리키는 복수형이므로, 고유명사만 옮기기보다 사람들로 풀어 집단성을 드러냈습니다.
- source_word: עֲמָלֵק
  english_pob_choice: Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 사람들
  - 아말렉
  lexicon: HALOT
  rationale: 본문은 고유명사 형태로 되어 있어, POB의 선택을 따라 이름 자체를 보존했습니다. 문맥상 백성 전체를 가리킬 수 있지만 본문 표면형을 우선했습니다.
- source_word: מָעוֹן
  english_pob_choice: Maon
  chosen_korean: 마온
  alternatives_korean:
  - 마온 사람들
  - 마온
  lexicon: HALOT
  rationale: 히브리어는 지명/고유명사 형태를 유지하므로 음역을 따랐습니다. 필요하면 집단을 뜻하는 해석을 각주로 보완할 수 있습니다.
- source_word: לָחֲצוּ
  english_pob_choice: oppressed
  chosen_korean: 압제하였고
  alternatives_korean:
  - 억압하였고
  - 괴롭혔고
  - 압박하였고
  lexicon: HALOT
  rationale: 단순한 압박보다 적대적 지배와 고통을 포함하는 동사이므로, 현대 한국어에서 그 힘을 살릴 수 있는 ‘압제하다’를 택했습니다.
- source_word: וַתִּצְעֲקוּ אֵלַי
  english_pob_choice: you cried out to me
  chosen_korean: 여러분이 나에게 부르짖자
  alternatives_korean:
  - 여러분이 나에게 외치자
  - 여러분이 나에게 부르짖자
  lexicon: HALOT
  rationale: 절박한 구원 요청의 관용구를 살리기 위해 ‘부르짖다’를 사용했고, 직접목적 대상을 자연스럽게 연결했습니다.
- source_word: וָאוֹשִׁיעָה
  english_pob_choice: I saved
  chosen_korean: 내가 … 여러분을 구원하였습니다
  alternatives_korean:
  - 내가 … 여러분을 구하였습니다
  - 내가 … 여러분을 구원하였습니다
  lexicon: HALOT
  rationale: ישע의 구원/건져냄 의미를 살려 ‘구원하다’로 옮겼습니다. ‘구하다’보다 신학적·서사적 연관성이 더 분명합니다.
- source_word: מִיָּדָם
  english_pob_choice: from their hand
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들의 손에서
  - 그들의 권세에서
  lexicon: HALOT
  rationale: ‘손에서’는 히브리어 관용구를 그대로 드러내는 표현으로, 권세/지배에서의 해방을 간접적으로 보존합니다.
