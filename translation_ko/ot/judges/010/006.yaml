source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
  footnotes:
  - marker: a
    text: Or 'continued to do what was evil in the eyes of the LORD.' The Hebrew verb can express repetition or continuation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the gods of the sons of Ammon'; that is, the gods worshiped by the Ammonites.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 다시 야훼[a]의 눈에 악한 일을 행하여, 바알들과 아스다롯들과 아람의 신들, 시돈의 신들, 모압의 신들, 암몬 자손의 신들, 블레셋 사람들의 신들을 섬겼습니다. 그들은 야훼를 버리고 그를 섬기지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계속하여 야훼의 눈에 악한 일을 행하였다.’ 히브리어 동사는 반복이나 계속을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִ֣פוּ
  english_pob_choice: again did
  chosen_korean: 다시 … 행하여
  alternatives_korean:
  - 계속 … 행하여
  - 또 … 행하여
  - 다시 … 하여
  lexicon: HALOT
  rationale: 반복·계속의 뉘앙스를 살리면서 한국어 문맥에 자연스럽게 맞추기 위해 ‘다시’로 옮겼습니다.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֗ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 반복되는 서사적 표현을 보존하기 위해 직역에 가까운 ‘이스라엘 자손’을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 주석 원칙에 따라 여호와 대신 고유명사 전사인 ‘야훼’를 사용해 언약 სახელ을 드러냈습니다.
- source_word: וַיַּעַבְד֣וּ
  english_pob_choice: they served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 봉사했습니다
  - 예배했습니다
  - 섬겼습니다
  lexicon: HALOT
  rationale: 우상숭배 맥락의 ‘섬기다’는 단순 예배보다 충성·복종의 의미를 함께 담아 뒤의 ‘그를 섬기지 않았습니다’와 대조를 유지합니다.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  english_pob_choice: what was evil in the eyes of Yahweh
  chosen_korean: 야훼의 눈에 악한 일
  alternatives_korean:
  - 야훼 보시기에 악한 일
  - 야훼 앞에서 악한 일
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 눈에’(평가 기준)를 살려 ‘야훼의 눈에 악한 일’로 옮겼습니다.
theological_decisions:
- issue: 우상 숭배를 ‘섬김’으로 유지할지 ‘예배’로 완화할지
  chosen_reading: ‘섬겼습니다’와 ‘그를 섬기지 않았습니다’로 동일 어근을 유지해 언약적 충성의 파기를 드러냅니다.
  alternative_readings:
  - 우상들을 예배했습니다
  - 그를 경배하지 않았습니다
  rationale: 본문은 նույն 동사 עבד를 반복해 대조를 이루므로, 한국어도 같은 동사군을 유지해야 의미 대비가 분명해집니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5: Consistency of key terms, or documented exception'
