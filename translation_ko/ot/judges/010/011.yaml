  naturalness: ‘암몬 자손에게서’는 현대 한국어에서 암몬의 후손 일반을 뜻하는 듯하여 민족명으로 부자연스럽습니다. ‘아모리 사람들’과 ‘암몬 사람들’이 통용되는 자연스러운 민족명입니다. 목적어를 나열 앞에 두어 한국어 문장 구조도 명료하게 다듬었습니다.
