  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Israel.'' Many English versions render this more idiomatically as ''the Israelites.'''
    reason: lexical_alternative
  - marker: b
    text: The Hebrew clause is elliptical in this verse and is completed by the surrounding context; the English supplies 'that I delivered you' for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼께서 이스라엘 자손에게 말씀하셨습니다. “내가 이집트에서, 아모리인에게서, 암몬 자손에게서, 그리고 블레셋 사람들에게서 너희를 건져 내지 않았느냐?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוָה
  english_pob_choice: And Yahweh said
  chosen_korean: 그리고 야훼께서 말씀하셨습니다
  alternatives_korean:
  - 그리고 야훼께서 말씀하셨다
  - 그때 야훼께서 말씀하셨습니다
  lexicon: WLC + POB audit trail
  rationale: 서사 도입의 wayyiqtol은 한국어에서 자연스럽게 연결하여 옮기고, יְהוָה는 프로젝트 기본값대로 '야훼'를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘 사람들에게
  - 이스라엘의 아들들에게
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되 한국어 관용에 맞게 조사만 조정했고, 남성형 집단표현을 평이한 '자손'으로 옮겼습니다.
- source_word: הֲלֹא
  english_pob_choice: Was it not
  chosen_korean: 내가 … 건져 내지 않았느냐
  alternatives_korean:
  - 내가 … 구원하지 않았느냐
  - 내가 …에서 너희를 건져 내지 않았느냐
  lexicon: HALOT
  rationale: 수사적 반문으로서의 הֲלֹא를 한국어 반문형으로 살렸고, 문맥상 생략된 행위는 앞뒤 문맥이 요구하는 '건져 내다'로 보완했습니다.
- source_word: מִמִּצְרַיִם וּמִן הָאֱמֹרִי וּמִן בְּנֵי עַמּוֹן וּמִן פְּלִשְׁתִּים
  english_pob_choice: from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines
  chosen_korean: 이집트에서, 아모리인에게서, 암몬 자손에게서, 그리고 블레셋 사람들에게서
  alternatives_korean:
  - 이집트에서, 아모리 족속에게서, 암몬 사람들에게서, 블레셋에게서
  - 이집트에서, 아모리인과 암몬 자손과 블레셋 사람들에게서
  lexicon: HALOT
  rationale: מן의 출처 의미를 일관되게 살려 나열 구조를 유지했고, יעד의 민족명은 한국어에서 통용되는 집단명으로 옮겼습니다.
theological_decisions:
- issue: 생략된 동사 보완
  chosen_reading: ‘건져 내지 않았느냐’로 보완하여 완전한 반문으로 옮김
  alternative_readings:
  - ‘구원하지 않았느냐’로 옮김
  - 동사를 명시하지 않고 ‘…에서’ 구조만 유지
  rationale: 히브리어 원문은 주변 문맥에 기대는 축약형이므로, 한국어에서는 문장의 완결성을 위해 문맥이 가리키는 구출 동사를 보완하는 것이 가장 정직합니다.
  doctrine_reference: POB translation philosophy §1, §6
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 신적 고유명을 제목화된 ‘주’로 대체하지 않고, 원문이 드러내는 언약적 고유성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
