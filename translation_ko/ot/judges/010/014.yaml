id: JDG.10.14
reference: Judges 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
  footnotes:
  - marker: a
    text: Or, 'they will save you.' The Hebrew form can be rendered as a simple future, but in context it functions as an ironic challenge.
    reason: alternative_reading
translation:
  language: ko
  text: 가서 너희가 선택한 그 신들에게 부르짖어 보십시오[a]. 그들이 너희가 환난을 당할 때에 너희를 구원하게 해 보십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 너희를 구원할 것이다.’ 히브리어 형태는 단순 미래로도 옮길 수 있지만, 문맥에서는 반어적 도전으로 기능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가 보십시오
  - 어서 가십시오
  lexicon: HALOT
  rationale: 히브리어 복수 명령형 הלך의 직접적인 명령을 살리되, 한국어에서는 자연스럽고 단호한 퇴거/도전의 뉘앙스를 담는 ‘가서’가 가장 간결합니다.
- source_word: וְזַעֲקוּ
  english_pob_choice: and cry out
  chosen_korean: 부르짖어 보십시오
  alternatives_korean:
  - 외쳐 보십시오
  - 부르짖으십시오
  - 소리쳐 보십시오
  lexicon: HALOT
  rationale: זעק은 단순 발화가 아니라 절박한 도움 요청의 큰 부르짖음을 뜻하므로, ‘부르짖다’를 쓰되 도전적 억양을 드러내기 위해 ‘보십시오’를 덧붙였습니다.
- source_word: אֶל הָאֱלֹהִים
  english_pob_choice: to the gods
  chosen_korean: 그 신들에게
  alternatives_korean:
  - 그 신들께
  - 여러 신들에게
  - 신들에게
  lexicon: HALOT
  rationale: 문맥상 이스라엘이 선택한 이방 신들을 가리키므로 복수 의미를 분명히 하는 ‘신들’을 택했습니다.
- source_word: יוֹשִׁיעוּ
  english_pob_choice: let them save you
  chosen_korean: 그들이 너희를 구원하게 하십시오
  alternatives_korean:
  - 그들이 너희를 구원할 것입니다
  - 그들이 너희를 건져 주게 하십시오
  - 그들이 너희를 구원하라
  lexicon: HALOT
  rationale: 히브리어 형태는 미래형으로도 보일 수 있지만, 문맥상 야훼의 조롱 섞인 도전이므로 한국어에서는 간접명령형으로 그 수사적 힘을 살렸습니다.
- source_word: צָרַתְכֶם
  english_pob_choice: your distress
  chosen_korean: 너희의 환난
  alternatives_korean:
  - 너희의 고통
  - 너희의 곤경
  - 너희의 재난
  lexicon: HALOT
  rationale: צָרָה의 위기·압박 상황을 반영하면서, 회중에게 익숙하지만 문맥의 절박함을 유지하는 ‘환난’이 적절합니다.
theological_decisions:
- issue: יוֹשִׁיעוּ의 담화 기능
  chosen_reading: 구원의 약속이 아니라 우상 숭배를 향한 조롱 섞인 도전으로 읽어, 한국어도 간접명령으로 처리했습니다.
  alternative_readings:
  - 단순 미래로 읽어 ‘그들이 너희를 구원할 것입니다’라고 번역
  - 문자형 명령으로 ‘그들이 너희를 구원하라’라고 번역
  rationale: 이 절은 하나님께서 이스라엘의 선택한 신들에게 도움을 구해 보라고 비꼬는 자리이므로, 예측 진술보다 반어적 도전의 힘을 보존하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
