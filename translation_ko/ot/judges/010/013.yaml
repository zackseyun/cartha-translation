id: JDG.10.13
reference: Judges 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
  footnotes:
  - marker: a
    text: Or 'deliver you' or 'rescue you.' The Hebrew verb can denote deliverance from enemies as well as saving more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 나를 버리고 다른 신들을 섬겼습니다[a]. 그러므로 나는 더 이상 여러분을 구원하지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출하다’, ‘건져주다’. 히브리어 동사는 적으로부터의 구출과 더 넓은 구원을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  english_pob_choice: But you
  chosen_korean: 그러나 여러분은
  alternatives_korean:
  - 그리고 여러분은
  - 그런데 여러분은
  lexicon: WLC
  rationale: 문맥상 대조와 책망의 뉘앙스가 분명하므로, 단순한 접속보다 역접을 드러내는 ‘그러나’가 원문 기능을 잘 살립니다.
- source_word: עֲזַבְתֶּם אוֹתִי
  english_pob_choice: have forsaken me
  chosen_korean: 나를 버리고
  alternatives_korean:
  - 나를 떠나고
  - 나를 저버리고
  lexicon: HALOT
  rationale: עזב는 관계를 끊는 ‘버리다/저버리다’의 뜻이 강하므로, 언약적 관계의 파기를 드러내는 ‘버리다’를 선택했습니다.
- source_word: וַ/תַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  english_pob_choice: and served other gods
  chosen_korean: 다른 신들을 섬겼습니다
  alternatives_korean:
  - 다른 신들을 예배했습니다
  - 다른 신들의 종이 되었습니다
  lexicon: HALOT
  rationale: עבד는 우상 숭배 문맥에서 ‘섬기다/예배하다’로 번역될 수 있으나, 한국어에서 가장 직접적이고 넓은 뜻을 유지하는 ‘섬기다’를 택했습니다.
- source_word: לְ/הוֹשִׁיעַ
  english_pob_choice: save
  chosen_korean: 구원하지 않겠습니다
  alternatives_korean:
  - 구해주지 않겠습니다
  - 건져주지 않겠습니다
  lexicon: HALOT
  rationale: 여기서는 전쟁·압제로부터의 구출이 직접적이지만, POB의 ‘save’처럼 더 넓은 구원 어휘를 살리기 위해 ‘구원하다’를 사용했습니다.
theological_decisions:
- issue: 하나님의 거절 선언을 현대 한국어에서 얼마나 직접적으로 표현할지
  chosen_reading: ‘나는 더 이상 여러분을 구원하지 않겠습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘더 이상 여러분을 구해주지 않겠습니다’
  - ‘더 이상 여러분을 건져주지 않겠습니다’
  rationale: 원문의 לֹא אוֹסִיף는 ‘이제 더는 계속하지 않겠다’는 중단 선언이므로, 완곡하게 흐리지 않고 단호한 거절을 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
