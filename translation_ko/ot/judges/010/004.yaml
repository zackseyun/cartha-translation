  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: ko
  text: 그에게는 아들 서른 명이 있었고, 그들은 나귀 서른 마리를 탔으며, 그들에게는 성읍 서른 곳이 있었습니다. 오늘날까지 그것들은 길르앗 땅에 있는 하봇야일이라 불립니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: “하봇야일”은 히브리어 지명 חַוֺּת יָאִיר의 음역입니다.
    reason: source_note
lexical_decisions:
- source_word: שְׁלֹשִׁים בָּנִים
  english_pob_choice: thirty sons
  chosen_korean: 아들 서른 명
  alternatives_korean:
  - 서른 아들
  - 삼십 명의 아들들
  lexicon: בֵּן
  rationale: 자연스러운 현대 한국어 어순으로 수량과 명사를 분리해 옮기되, 원문의 자녀 수를 분명히 드러내기 위해 ‘아들 서른 명’으로 렌더링했습니다.
- source_word: רֹכְבִים עַל שְׁלֹשִׁים עֲיָרִים
  english_pob_choice: riding on thirty donkeys
  chosen_korean: 그들은 나귀 서른 마리를 탔으며
  alternatives_korean:
  - 서른 마리의 나귀를 타고 있었으며
  - 나귀 서른 마리를 타고 다녔으며
  lexicon: עַיִר / רָכַב
  rationale: 원문의 ‘타고 있는’ 상태를 살리면서도 한국어에서 자연스러운 서술형으로 옮겼습니다. ‘나귀’는 POB의 기본 대응을 따랐습니다.
- source_word: וּשְׁלֹשִׁים עֲיָרִים לָהֶם
  english_pob_choice: and they had thirty towns
  chosen_korean: 그들에게는 성읍 서른 곳이 있었습니다
  alternatives_korean:
  - 그들은 성읍 서른 곳을 가졌습니다
  - 그들에게 서른 개의 성읍이 있었습니다
  lexicon: עִיר
  rationale: 문맥상 단순한 ‘도시’보다 고대 지리·정치 단위인 ‘성읍’이 더 정확하여 이를 택했고, 소유 관계도 자연스럽게 살렸습니다.
- source_word: חַוֺּת יָאִיר
  english_pob_choice: Havvoth-jair
  chosen_korean: 하봇야일
  alternatives_korean:
  - 하봇-야일
  - 하봇 야일
  lexicon: חַוֺּת יָאִיר
  rationale: 지명 고유명사는 표준적인 음역형으로 옮겼습니다. 하이픈 여부는 한국어 관행상 붙여 쓰는 형태를 택했습니다.
