  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
  footnotes:
  - marker: a
    text: Or 'Israel was in very great distress.'
    reason: lexical_alternative
translation:
  language: ko
  text: 암몬 자손은 또 유다와 베냐민과 에브라임 가문에 맞서 싸우려고 요단을 건넜고, 이스라엘은 크게 괴로워졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ ... אֶת הַיַּרְדֵּן
  english_pob_choice: crossed the Jordan
  chosen_korean: 요단을 건너
  alternatives_korean:
  - 요단강을 건너
  - 요단강을 넘어
  lexicon: HALOT
  rationale: עבר의 이동 의미를 살려, 전쟁 목적의 실제 도하를 간결하게 표현했습니다. 한국어에서는 ‘요단’을 목적어처럼 두는 표현이 자연스럽고 성경체에도 잘 맞습니다.
- source_word: בְנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬인들
  lexicon: HALOT
  rationale: 족속 표지를 살리면서도 한국어 성경에서 익숙한 민족명 표현을 택했습니다. ‘자손’은 히브리어 בני의 계보적 뉘앙스를 어느 정도 보존합니다.
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  english_pob_choice: against Judah, Benjamin, and the house of Ephraim
  chosen_korean: 유다와 베냐민과 에브라임의 집
  alternatives_korean:
  - 유다와 베냐민과 에브라임 집안
  - 유다와 베냐민과 에브라임
  lexicon: HALOT
  rationale: 전쟁 동사와 결합한 전치사의 대상을 한국어에서는 ‘-와 ... 싸우려고’로 자연스럽게 풀었습니다. בֵּית는 ‘집’으로 유지해 에브라임의 가문/집단 표지를 보존했습니다.
- source_word: וַתֵּצֶר ... מְאֹד
  english_pob_choice: was greatly distressed
  chosen_korean: 크게 괴로워졌습니다
  alternatives_korean:
  - 몹시 고통받았습니다
  - 극심한 곤경에 빠졌습니다
  lexicon: HALOT
  rationale: וַתֵּצֶר의 압박·곤경 의미를 단순한 감정이 아니라 국가적 위기 상태로 옮겼습니다. ‘크게’는 מְאֹד의 강도를 자연스럽게 반영합니다.
