review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 사건 순서와 의미를 잘 반영합니다. 다만 ‘들어왔고’는 וַיַּעַבְרוּ(요단을 건너다)에 별도의 ‘들어오다’ 동작을 더하며, 목적을 나타내는 לְהִלָּחֵם의 연결도 다소 불분명하게 만듭니다.
  naturalness: ‘유다와 베냐민과 에브라임의 집과도 싸우려고 들어왔고’는 ‘-와 싸우다’ 및 ‘-와도’의 결합이 약간 부자연스럽습니다. ‘또 … 맞서 싸우려고 요단을 건넜습니다’로 하면 현대 표준 한국어에서 목적과 추가의 의미가 명확합니다.
  terminology: ‘암몬 자손’, ‘요단’, ‘유다’, ‘베냐민’, ‘에브라임’은 적절합니다. בֵּית אֶפְרַיִם은 단순 지명으로 축소하지 않고 ‘에브라임 가문’으로 옮겨 집단·가문 표지를 보존할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘들어왔고’가 원문에 없는 별도 이동을 암시하고, ‘싸우려고’의 목적어 연결을 흐립니다.
    rationale: 히브리어는 암몬 자손이 요단을 ‘건너’ 유다·베냐민·에브라임의 집에 맞서 싸우려 했다고 말합니다. ‘요단을 건너 … 싸우려고’로 직접 연결하는 편이 정확합니다.
  - severity: low
    issue: ‘에브라임의 집과도 싸우려고’의 조사 결합이 다소 어색합니다.
    rationale: 전쟁의 대상을 ‘에브라임 가문에 맞서’로 표현하면 בֵּית(집/가문)의 표지를 보존하면서도 자연스럽습니다.
  revised_text: 암몬 자손은 또 유다와 베냐민과 에브라임 가문에 맞서 싸우려고 요단을 건넜고, 이스라엘은 크게 괴로워졌습니다.
