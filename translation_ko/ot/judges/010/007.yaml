  source_fidelity: 초안의 ‘붙이시니’는 וַיִּמְכְּרֵם(그들을 팔았다)의 반복되는 심판 은유를 약화합니다. 또한 신명 YHWH는 프로젝트 방침과 영어 감사 기록에 따라 ‘야훼’로 옮겨야 합니다. 수정문은 ‘손에’의 두 차례 반복과 블레셋 및 암몬이라는 두 집단을 유지합니다.
  naturalness: ‘진노하셔서’와 ‘팔아넘기셨습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 심판 행위를 분명히 나타냅니다. ‘블레셋 사람들’과 ‘암몬 자손들’은 한국어에서 자연스러운 집단 표현입니다.
  terminology: יְהוָה는 ‘야훼’, פְּלִשְׁתִּים은 ‘블레셋 사람들’, בְּנֵי עַמּוֹן은 원문의 어휘를 보존하여 ‘암몬 자손들’로 번역했습니다. מָכַר의 은유는 ‘팔아넘기셨습니다’로 보존했습니다.
