    rationale: וַיֵּאָסְפוּ는 단순히 ‘모였다/집결했다’이며, 상호 동시성이나 첨가를 뜻하는 명시적 부사가 없습니다. 전쟁 준비라는 문맥상 암시될 수는 있어도 본문에 보태지 않는 편이 최적 등가에 맞습니다.
