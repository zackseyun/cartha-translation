  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
  footnotes:
  - marker: a
    text: Or 'Then the Ammonites cried out and camped in Gilead'; the Hebrew verb can mean 'cry out,' though in this context it likely refers to being mustered or summoned for battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 암몬 자손이 소집되어 길르앗에 진을 쳤고, 이스라엘 자손도 함께 모여 미스바에 진을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소집되어’는 전쟁 문맥에서 ‘부르짖다’보다 ‘불려 모이다’는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  english_pob_choice: were summoned
  chosen_korean: 소집되어
  alternatives_korean:
  - 불려 모여
  - 부르짖어
  - 집결하여
  lexicon: HALOT
  rationale: 전쟁 문맥에서 단순한 ‘부르짖음’보다 군사적으로 불러 모은 결과를 드러내는 말이 더 적절하므로, POB의 ‘were summoned’를 따라 ‘소집되어’로 옮겼습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  lexicon: HALOT
  rationale: 히브리어 직역 구조인 ‘암몬의 자손’을 살리되, 한국어에서 자연스럽고도 계보적 뉘앙스를 유지하는 ‘암몬 자손’을 선택했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 쳤고
  alternatives_korean:
  - 캠프를 쳤고
  - 캠핑했고
  - 진쳤고
  lexicon: HALOT
  rationale: חנה는 군사적 ‘진을 치다/주둔하다’의 뜻이므로, 현대 한국어에서 가장 분명한 ‘진을 쳤고’를 사용했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 지정된 표현을 그대로 반영해 가부장적 계보 호칭이 본문에 실제로 있음을 드러내면서도, 한국어 성경에서 널리 이해되는 관용형을 유지했습니다.
theological_decisions:
- issue: 두 진영의 대칭적 군사 집결 표현
  chosen_reading: 암몬 자손과 이스라엘 자손이 각각 소집·집결하여 서로 대치하는 장면으로 읽었습니다.
  alternative_readings:
  - 암몬 자손이 단순히 소리쳐 반응한 장면
  - 이스라엘이 우연히 모인 장면
  rationale: 문맥상 양측의 전쟁 준비가 핵심이므로, 동사들을 모두 군사적 집결로 읽는 것이 서술 의도를 가장 잘 보존합니다.
  doctrine_reference: 서사 문맥 해석
