  source_fidelity: 첫 절반은 원문에 충실합니다. 다만 וַתִּקְצַר נַפְשׁוֹ의 관용적 표현은 ‘더 이상 참기 어려워하셨습니다’보다 ‘더는 견디지 못하셨습니다’가 ‘더 이상 감당할 수 없게 되다’라는 원문의 강도와 완료된 서술을 더 직접적으로 드러냅니다. בַּעֲמַל יִשְׂרָאֵל은 이스라엘의 고난/곤고를 가리키며, ‘이스라엘의 고난을’로 자연스럽게 연결할 수 있습니다.
  naturalness: ‘자기들 가운데서’는 가능하지만 서사문에서는 ‘그들 가운데서’가 더 중립적이고 격식 있는 표준어입니다. ‘외국 신들’도 이해되나, 성서 문맥에서 אֱלֹהֵי הַנֵּכָר를 가리키는 통상적이고 자연스러운 표현은 ‘이방 신들’입니다. 기존의 ‘참기 어려워하셨습니다’는 다소 우회적이므로 간결한 서술형으로 고쳤습니다.
  terminology: יַהוָה는 프로젝트 용례에 따라 ‘야훼’로 유지했습니다. עָבַד는 ‘섬겼습니다’가 적절합니다. אֱלֹהֵי הַנֵּכָר는 특정 현대 국가의 신이라는 뉘앙스를 피하고 성서적 용례를 살려 ‘이방 신들’로 옮겼습니다. 각주에서는 נַפְשׁוֹ를 한국어의 자연스러운 직역 설명으로 ‘그분의 마음이 … 짧아졌다’라고 제시하되, 이것이 히브리어 관용구임을 밝혔습니다.
