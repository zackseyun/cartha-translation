source:
  edition: WLC
  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
  footnotes:
  - marker: a
    text: Or, 'he could bear Israel’s misery no longer.' The Hebrew literally says, 'his soul grew short over the misery of Israel,' an idiom expressing impatience or inability to endure further.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들 가운데서 이방 신들을 제거하고 야훼를 섬겼습니다. 그러자 그분은 이스라엘의 고난을 더는 견디지 못하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 이스라엘의 고난 때문에 더는 참지 못하셨다.’ 히브리어는 문자적으로 ‘그분의 마음이 이스라엘의 고난으로 말미암아 짧아졌다’라고 하며, 더는 참거나 견딜 수 없게 되었음을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ אֶת אֱלֹהֵי הַנֵּכָר מִקִּרְבָּם
  english_pob_choice: removed the foreign gods from among them
  chosen_korean: 자기들 가운데서 외국 신들을 제거하고
  alternatives_korean:
  - 자기들 가운데서 외국 신들을 없애고
  - 그들 가운데서 낯선 신들을 치워 버리고
  lexicon: HALOT
  rationale: סוּר의 히필은 ‘멀리 치우다/제거하다’의 뜻이어서, 우상 철거의 구체성을 살려 ‘제거하다’로 옮겼습니다. אֱלֹהֵי הַנֵּכָר는 비이스라엘 신들을 가리키므로 ‘외국 신들’이 자연스럽고 분명합니다.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  english_pob_choice: served Yahweh
  chosen_korean: 야훼를 섬겼습니다
  alternatives_korean:
  - 야훼를 경배했습니다
  - 야훼께 봉사했습니다
  lexicon: HALOT
  rationale: עָבַד는 하나님을 향해 ‘섬기다’라는 언약적 충성의 의미를 갖기 때문에, 단순한 예배보다 넓은 뜻을 살려 ‘섬기다’로 옮겼습니다. 본 프로젝트의 기준에 따라 יהוה는 ‘야훼’로 표기했습니다.
- source_word: וַתִּקְצַר נַפְשׁוֹ בַּעֲמַל יִשְׂרָאֵל
  english_pob_choice: he became impatient over the misery of Israel
  chosen_korean: 그분은 이스라엘의 고난 때문에 더 이상 참기 어려워하셨습니다
  alternatives_korean:
  - 그분의 영혼이 이스라엘의 고난 때문에 짧아지셨습니다
  - 그분은 이스라엘의 고난을 더는 견디지 못하셨습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 혼이 짧아졌다’이지만, 한국어에서는 자연스럽지 않으므로 관용구의 힘을 살려 ‘더 이상 참기 어려워하셨습니다’로 옮겼습니다. בַּעֲמַל은 여기서 이스라엘의 고통/곤고를 가리키므로 ‘고난’이 무난합니다.
theological_decisions:
- issue: יַהוָה를 ‘야훼’로 표기하는 문제
  chosen_reading: 본문에는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트의 기본 용례와 source-grounded 표기 원칙에 따라 신명은 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH = 야훼'
- issue: נַפְשׁוֹ의 의인화 표현 보존
  chosen_reading: ‘그분은 … 더 이상 참기 어려워하셨습니다’로 옮겨, 히브리어의 강한 반응 표현을 완화하되 삭제하지는 않았습니다.
  alternative_readings:
  - 그분의 혼이 짧아지셨습니다
  - 그분은 이스라엘의 고난을 더는 견디지 못하셨습니다
  rationale: 본문은 하나님의 반응을 생생한 인격적 언어로 묘사하므로, 그 긴장을 과도하게 신학적으로 평탄화하지 않는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
