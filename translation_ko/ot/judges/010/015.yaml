- from: 그리고 이스라엘 자손이 야훼께 말했습니다. “우리가 죄를 지었습니다. 당신 보시기에 좋은 대로 우리에게 행하십시오. 다만, 오늘 우리를 구해 주십시오.”[a][b][c]
  to: 그러자 이스라엘 자손[c]이 야훼께 말했습니다. “우리가 죄를 지었습니다. 우리에게 보시기에 좋은 대로[a] 행하십시오. 다만 오늘 우리를 구해 주십시오.[b]”
  rationale: 의미를 바꾸지 않고 한국어의 자연스러운 존중 표현을 위해 ‘당신’을 생략하고, 히브리어 서사 접속을 자연스럽게 반영하여 ‘그러자’를 사용했습니다. 또한 모든 각주 표지를 해당 설명 대상에 직접 연결했습니다. ‘우리에게 … 행하십시오’는 עֲשֵׂה אַתָּה לָנוּ의 대인적 행위를 보존하며, ‘보시기에 좋은 대로’는 כְּכָל הַטּוֹב בְּעֵינֶיךָ의 관용적 뜻을 자연스럽게 전달합니다.
