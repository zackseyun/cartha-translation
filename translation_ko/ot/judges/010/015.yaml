source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
  footnotes:
  - marker: a
    text: Or “the Israelites.”
    reason: lexical_alternative
  - marker: b
    text: Literally “according to all the good in your eyes”; that is, whatever seems good to you.
    reason: lexical_alternative
  - marker: c
    text: Or “save us” or “rescue us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손이 야훼께 말했습니다. “우리가 죄를 지었습니다. 당신 보시기에 좋은 대로 우리에게 행하십시오. 다만, 오늘 우리를 구해 주십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신 보시기에 좋은 모든 것에 따라”라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “구원해 주십시오”, “건져 주십시오”.
    reason: lexical_alternative
  - marker: c
    text: 또는 “이스라엘 사람들”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 반영하되, 한국어에서는 ‘자손’이 자연스럽고 성별을 과도하게 풀지 않으면서도 원문의 집단 지칭을 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유신명 YHWH를 제목어가 아닌 고유명으로 드러내기 위해 공용 규범에 맞춰 ‘야훼’로 옮겼습니다.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  english_pob_choice: whatever is good in your eyes
  chosen_korean: 당신 보시기에 좋은 대로
  alternatives_korean:
  - 당신 눈에 좋은 모든 것에 따라
  - 당신 보시기에 좋은 모든 것대로
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘눈에 좋다’를 유지하면서도 한국어에서 자연스럽고, ‘대로’로 אָכֵן/כְּכָל의 기준성을 드러냈습니다.
- source_word: הַצִּילֵנוּ
  english_pob_choice: deliver us
  chosen_korean: 구해 주십시오
  alternatives_korean:
  - 건져 주십시오
  - 구원해 주십시오
  lexicon: HALOT
  rationale: 여기서는 압박 상황에서의 간청이므로 ‘구하다/구해 주다’가 가장 직접적입니다. ‘건지다’는 다소 문어적이고, ‘구원하다’는 신학적 색채가 더 강합니다.
theological_decisions:
- issue: 죄 고백과 간청의 어조
  chosen_reading: “우리가 죄를 지었습니다… 다만, 오늘 우리를 구해 주십시오.”
  alternative_readings:
  - “우리가 죄를 지었습니다… 오늘 우리를 구원해 주십시오.”
  - “우리가 죄를 지었습니다… 오늘 우리를 건져 주십시오.”
  rationale: 본문은 완전한 자기복종과 함께 즉각적 구출을 구하는 기도문이므로, 명령형이 아닌 간청형을 유지하고 ‘다만’으로 אַךְ의 제한적 뉘앙스를 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
