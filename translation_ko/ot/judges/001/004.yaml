base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
  footnotes:
  - marker: a
    text: Or 'the Canaanite and the Perizzite,' with the singular forms used collectively for the peoples.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into their hand,' an idiom meaning into their power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다가 올라갔습니다. 야훼께서 가나안 사람들과 브리스 사람들을 그들의 손에 넘겨주셨고, 그들은 베섹에서 만 명을 쳐죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 손에’는 관용적으로 ‘그들의 권세/지배 아래에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘오르다/올라가다’를 살리면서, 전투 문맥의 이동도 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה는 본문의 고유한 신명으로서, 프로젝트 기본값에 따라 ‘야훼’로 옮겨야 합니다.
- source_word: הַכְּנַעֲנִי / הַפְּרִזִּי
  english_pob_choice: the Canaanites / the Perizzites
  chosen_korean: 가나안 사람들 / 브리스 사람들
  alternatives_korean:
  - 가나안 족속과 브리스 족속
  - 가나안 사람과 브리스 사람
  lexicon: HALOT
  rationale: 히브리어 단수형 집합명사를 한국어에서는 복수 집합으로 자연스럽게 옮겨, 민족 집단을 가리키는 뜻을 분명히 했습니다.
- source_word: בְּיָדָם
  english_pob_choice: into their hand
  chosen_korean: 그들의 손에 넘겨주셨고
  alternatives_korean:
  - 그들의 손에
  - 그들의 권세 아래에
  lexicon: HALOT
  rationale: ‘손에’라는 관용구를 유지하되, 한국어에서는 의미가 분명해지도록 ‘넘겨주셨다’로 풀어 전투 승리의 주체가 하나님이심을 드러냈습니다.
- source_word: וַיַּכּוּם
  english_pob_choice: they struck down
  chosen_korean: 쳐죽였습니다
  alternatives_korean:
  - 쳐눕혔습니다
  - 쳐부쉈습니다
  - 무찔렀습니다
  lexicon: HALOT
  rationale: 전투와 함께 수적 결과가 제시되므로 단순한 패배보다 실제 살상 강도가 있는 표현이 원문에 더 가깝습니다.
theological_decisions:
- issue: 하나님의 주권과 인간의 전투 행위의 병렬
  chosen_reading: 야훼께서 적들을 넘겨주신 뒤, 유다 사람들이 실제로 공격을 수행했다는 구조를 그대로 유지했습니다.
  alternative_readings:
  - 하나님이 직접 전투하신 것처럼 합치기
  - 유다의 승리만 강조해 하나님의 행위를 약화하기
  rationale: 본문은 승리의 원인을 야훼의 넘겨주심에 두면서도, 실행 주체는 유다의 군사 행동으로 분명히 구분합니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
