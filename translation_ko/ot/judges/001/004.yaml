- from: 그때 유다가 올라갔습니다. 야훼께서 가나안 사람들과 브리스 사람들을 그들의 손에 넘겨주셨고, 그들은 베섹에서 만 명을 쳐죽였습니다.[a]
  to: 그때 유다가 올라갔습니다. 야훼께서 가나안 사람들과 브리스 사람들을 그들의 손에[a] 넘겨주셨고, 그들은 베섹에서 만 명을 쳐서 쓰러뜨렸습니다.
