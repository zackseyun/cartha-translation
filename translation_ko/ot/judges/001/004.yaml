  terminology: ‘야훼’, ‘가나안 사람들’, ‘브리스 사람들’, ‘베섹’은 적절합니다. 집합적 단수인 유다를 ‘유다’로 두고 뒤에서 복수 대명사를 쓰는 것은 군사 집단을 가리키는 원문의 전환을 자연스럽게 반영합니다.
  issues:
