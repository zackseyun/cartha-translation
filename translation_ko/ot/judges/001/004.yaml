  source_fidelity: ‘쳐죽였습니다’는 נכה(치다, 타격을 가하다, 쓰러뜨리다)가 반드시 죽임을 뜻한다고 단정하여 원문의 의미 범위를 좁힙니다. ‘쳐서 쓰러뜨렸습니다’는 전투적 타격과 만 명이라는 결과를 보존하면서도 살해를 명시하지 않는 원문 및 영어 POB의 ‘struck down’에 더 충실합니다.
