- source_word: גֻּלֹּת מָיִם / גֻּלֹּת עִלִּית / גֻּלֹּת תַּחְתִּית
  english_pob_choice: springs of water / the upper springs / the lower springs
  chosen_korean: 물 샘 / 위쪽 샘 / 아래쪽 샘
  alternatives_korean:
  - 샘물 / 위의 샘 / 아래의 샘
  - 물의 샘 / 상부 샘 / 하부 샘
  lexicon: HALOT
  rationale: 문맥상 물 공급원으로서의 샘을 가리키므로 ‘샘’으로 통일했고, 상하 대조는 자연스러운 한국어 방향 표현인 ‘위쪽/아래쪽’으로 유지했습니다.
theological_decisions:
- issue: 여성이 요청하는 ‘복’의 성격
  chosen_reading: 가문 안에서 아버지에게 구하는 실제적 유익과 토지에 대한 추가 은혜를 함께 가리키는 표현으로 처리했습니다.
  alternative_readings:
  - 형식적 축복 기원으로만 이해
  - 단순한 재산 요청으로만 이해
  rationale: 히브리어 בְרָכָה는 여기서 종교적 선언보다 구체적 선물 요청의 성격이 강하므로, ‘복’이라는 원형을 유지하되 문맥상 실제적 유익을 드러내는 방식이 적절합니다.
  doctrine_reference: 문맥 우선 원칙; 어휘의 다의성 보존
