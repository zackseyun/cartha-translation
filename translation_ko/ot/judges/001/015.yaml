  lexicon: HALOT
  rationale: 청유적 요청의 뉘앙스를 살리기 위해 단순 명령형보다 공손한 호소인 ‘부디’를 넣고, 본문 전체의 합쇼체에 맞게 옮겼습니다.
- source_word: בְרָכָה
