id: JDG.1.16
reference: Judges 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
  footnotes:
  - marker: a
    text: Or 'Moses’ relative by marriage'; the Hebrew term can be broader than 'father-in-law,' though 'father-in-law' is the most common sense here.
    reason: lexical_alternative
  - marker: b
    text: '''City of Palms'' is commonly understood to refer to Jericho.'
    reason: cross_reference
  - marker: c
    text: 'The Hebrew shifts to singular: ''then he went and settled.'' This may refer to the Kenite clan as a collective singular, though some interpreters understand a plural sense.'
    reason: textual_variant
  - marker: d
    text: Or 'among the people.' Some ancient witnesses read 'with Amalek' instead of 'with the people.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 켄 사람들, 곧 모세의 장인의 후손들이 종려나무 성읍에서 올라와 유다의 후손들과 함께 유다 광야, 곧 아랏의 네겝에 있는 곳으로 갔습니다. 그리고 그는 가서 그 백성 가운데 정착했습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘케인 사람들’은 족속명으로, 히브리어는 문자적으로 ‘케인의 후손들’입니다.
    reason: source_note
  - marker: b
    text: ‘종려나무 성읍’은 일반적으로 여리고를 가리키는 것으로 이해됩니다.
    reason: cross_reference
  - marker: c
    text: 히브리어는 단수형으로 전환되어 ‘그는 가서 정착했습니다’라고 말합니다. 이는 집단을 집합적 단수로 본 표현일 수 있습니다.
    reason: textual_variant
  - marker: d
    text: ‘그 백성 가운데’로 옮겼습니다. 일부 고대 증인들은 ‘아말렉 가운데’로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  english_pob_choice: And the descendants of the Kenite
  chosen_korean: 케인 사람들, 곧 … 후손들
  alternatives_korean:
  - 케닌 사람들
  - 케인 족속
  lexicon: HALOT
  rationale: 족속/후손의 계보적 의미를 살리되, 표준 한국어에서 자연스러운 집단명으로 옮겼습니다.
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: Moses’ father-in-law
  chosen_korean: 모세의 장인
  alternatives_korean:
  - 모세의 인척
  - 모세의 혼인 친족
  lexicon: HALOT
  rationale: חֹתֵן의 가장 일반적인 의미인 ‘장인’을 본문에 두고, 더 넓은 친족 가능성은 불필요하게 본문에 반영하지 않았습니다.
- source_word: מֵעִיר הַתְּמָרִים
  english_pob_choice: from the City of Palms
  chosen_korean: 종려나무 성읍에서
  alternatives_korean:
  - 종려성에서
  - 여리고에서
  lexicon: HALOT
  rationale: 히브리어의 별칭을 그대로 살렸고, 여리고로의 식별은 본문이 아니라 별도 주석 사항이므로 본문에는 넣지 않았습니다.
- source_word: אֶת בְּנֵי יְהוּדָה
  english_pob_choice: with the descendants of Judah
  chosen_korean: 유다의 후손들과 함께
  alternatives_korean:
  - 유다 자손과 함께
  - 유다 사람들과 함께
  lexicon: HALOT
  rationale: אֶת를 동반의 의미로 읽어 ‘함께’로 옮기고, בְּנֵי는 족속/혈통 문맥에 맞게 ‘후손들’로 옮겼습니다.
- source_word: וַיֵּשֶׁב אֶת הָעָם
  english_pob_choice: and settled with the people
  chosen_korean: 그 백성 가운데 정착했습니다
  alternatives_korean:
  - 그 백성과 함께 살았습니다
  - 그 백성 가운데 거주했습니다
  lexicon: HALOT
  rationale: יָשַׁב의 정주 의미를 현대적으로 풀되, ‘가운데’로 공동체 안에 머묾을 드러냈습니다. POB의 ‘with the people’은 한국어에서 어색한 병치를 피하려고 자연스럽게 정리했습니다.
theological_decisions:
- issue: אנשי קיני의 이동과 정착을 얼마나 직접적으로 표현할지
  chosen_reading: 지리 이동 동사를 살려 ‘올라와 … 갔습니다 … 정착했습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 의미 중심으로 ‘떠나 … 이주했습니다’
  - 더 완화하여 ‘살게 되었습니다’
  rationale: 서술의 진행과 정주라는 사건성을 유지하는 것이 본문의 역사서적 톤에 더 충실합니다.
  doctrine_reference: 성경 본문의 역사적 서술성과 서사적 진행 보존
