  rationale: חֹתֵן의 가장 일반적인 의미인 ‘장인’을 본문에 두고, 더 넓은 친족 가능성은 불필요하게 본문에 반영하지 않았습니다.
- source_word: מֵעִיר הַתְּמָרִים
  english_pob_choice: from the City of Palms
  chosen_korean: 종려나무 성읍에서
  alternatives_korean:
  - 종려성에서
  - 여리고에서
  lexicon: HALOT
  rationale: 히브리어의 별칭을 그대로 살렸고, 여리고로의 식별은 본문이 아니라 별도 주석 사항이므로 본문에는 넣지 않았습니다.
- source_word: אֶת בְּנֵי יְהוּדָה
  english_pob_choice: with the descendants of Judah
  chosen_korean: 유다의 후손들과 함께
  alternatives_korean:
  - 유다 자손과 함께
  - 유다 사람들과 함께
  lexicon: HALOT
  rationale: אֶת를 동반의 의미로 읽어 ‘함께’로 옮기고, בְּנֵי는 족속/혈통 문맥에 맞게 ‘후손들’로 옮겼습니다.
- source_word: וַיֵּשֶׁב אֶת הָעָם
  english_pob_choice: and settled with the people
  chosen_korean: 그 백성 가운데 정착했습니다
  alternatives_korean:
  - 그 백성과 함께 살았습니다
  - 그 백성 가운데 거주했습니다
  lexicon: HALOT
  rationale: יָשַׁב의 정주 의미를 현대적으로 풀되, ‘가운데’로 공동체 안에 머묾을 드러냈습니다. POB의 ‘with the people’은 한국어에서 어색한 병치를 피하려고 자연스럽게 정리했습니다.
theological_decisions:
- issue: אנשי קיני의 이동과 정착을 얼마나 직접적으로 표현할지
  chosen_reading: 지리 이동 동사를 살려 ‘올라와 … 갔습니다 … 정착했습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 의미 중심으로 ‘떠나 … 이주했습니다’
  - 더 완화하여 ‘살게 되었습니다’
  rationale: 서술의 진행과 정주라는 사건성을 유지하는 것이 본문의 역사서적 톤에 더 충실합니다.
  doctrine_reference: 성경 본문의 역사적 서술성과 서사적 진행 보존
