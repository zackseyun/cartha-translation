translation:
  language: ko
  text: 요셉 집안도 그들도 베델로 올라갔고, 야훼께서 그들과 함께하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ‘올라가다’는 문자적으로는 ‘올라갔다’이지만, 이 군사적 문맥에서는 특정 도시를 향해 진군하거나 공격하러 갔다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יוֹסֵף
  english_pob_choice: The house of Joseph
  chosen_korean: 요셉 집안
  alternatives_korean:
  - 요셉의 집
  - 요셉 가문
  - 요셉의 자손들
  lexicon: HALOT
  rationale: 사사기의 지파·씨족 표지를 자연스럽게 살리면서도, ‘집안’이 혈연 집단을 드러내어 원문의 공식성을 보존합니다.
- source_word: גַּם הֵם
  english_pob_choice: also
  chosen_korean: 그들도
  alternatives_korean:
  - 또
  - 또한
  - 그들도 역시
  lexicon: HALOT
  rationale: 앞선 집단들의 행동에 요셉 집안이 더해진다는 의미를 한국어에서 자연스럽게 드러내기 위해 ‘그들도’로 옮겼습니다.
- source_word: וַיַּעֲלוּ ... בֵית אֵל
  english_pob_choice: went up against Bethel
  chosen_korean: 베델로 올라갔고
  alternatives_korean:
  - 베델을 향해 올라갔고
  - 베델을 공격하러 올라갔고
  - 베델을 치러 올라갔고
  lexicon: HALOT
  rationale: 히브리어 עלה의 직역 ‘올라가다’를 살리되, 이 절에서의 전투적 맥락은 전치사 ‘-로’만으로도 충분히 드러나므로 과잉 해석을 줄였습니다.
- source_word: וַֽיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께서
  alternatives_korean:
  - 여호와께서
  - 주님께서
  lexicon: HALOT
  rationale: 원문의 여호와/יהוה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 조사 ‘께서’는 주어 표지와 주어의 존엄성을 함께 자연스럽게 표현합니다.
theological_decisions:
- issue: 야훼의 임재 표현
  chosen_reading: ‘야훼께서 그들과 함께하셨습니다’는 단순한 동행이 아니라 전투의 성공을 뒷받침하는 언약적 지지의 의미를 담습니다.
  alternative_readings:
  - 야훼께서 그들 편에 계셨습니다
  - 야훼께서 그들 가운데 계셨습니다
  rationale: עִם + pronominal suffix는 기본적으로 ‘~와 함께’이지만, 문맥상 승리를 돕는 하나님의 ներկայ/지지를 포함할 수 있습니다. 다만 본문이 명시하는 것은 ‘함께하심’이므로 그 표현을 유지했습니다.
  doctrine_reference: Narrative theology of divine presence
