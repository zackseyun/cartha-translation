  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
  footnotes:
  - marker: a
    text: Or 'subjected the Canaanites to labor tribute' or 'corvée labor.' The Hebrew term refers to compulsory labor imposed by a ruling power.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'did not drive him out,' with singular object referring collectively to the Canaanite population; English renders the sense as 'them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 강해졌을 때, 그들은 가나안 사람들에게 강제 노동을 시켰으나[a], 그들을[b] 완전히 쫓아내지는 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강제 노동’은 히브리어 מַס의 의미를 풀어 옮긴 것입니다. 이 말은 통치 권력이 부과하는 강제 노역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 목적어 형태로 ‘그를’이라고 되어 있으나, 문맥상 가나안 민족 전체를 가리키므로 한국어에서는 ‘그들을’로 옮겼습니다.
    reason: lexical_alternative
