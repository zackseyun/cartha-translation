  lexicon: HALOT
  rationale: 부정절의 강조를 ‘완전히’로 반영했고, 정복 문맥의 ‘drive out’는 한국어 성경어법상 ‘쫓아내다’가 가장 직접적입니다.
theological_decisions:
- issue: 가나안 사람들에 대한 이스라엘의 처분 방식
  chosen_reading: 본문은 이스라엘이 가나안 사람들을 단순히 조공 대상으로 둔 것이 아니라, 강제 노동에 종속시켰다고 말합니다.
  alternative_readings:
  - 가벼운 세금이나 공물로 완화해 읽는 해석
  rationale: 히브리어 לָמַס는 부담금보다 강제 노역의 성격이 강하므로, 본문의 억압적 현실을 약화하지 않도록 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
