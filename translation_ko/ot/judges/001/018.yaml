  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
  footnotes:
  - marker: a
    text: Or 'its border' for each occurrence of 'its territory'; the Hebrew term can denote a boundary or the territory bounded by it.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 가사와 그 영토[a], 아스글론과 그 영토, 에그론과 그 영토를 점령했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 경계’입니다. 히브리어는 각 경우에 경계선 자체나 그 경계로 둘러싸인 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령했습니다
  alternatives_korean:
  - 함락시켰습니다
  - 사로잡았습니다
  - 빼앗았습니다
  lexicon: HALOT
  rationale: 성읍과 영토를 무력으로 차지하는 군사적 맥락을 살려, 단순한 ‘갖다/취하다’보다 결과가 분명한 ‘점령하다’를 선택했습니다.
- source_word: יְהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다 지파
