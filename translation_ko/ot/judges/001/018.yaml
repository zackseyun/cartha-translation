  rationale: 히브리어는 개인명이 아니라 집단 주체를 가리키므로, 본문에 없는 ‘지파’를 덧붙이지 않고 고유명사로 옮겼습니다.
- source_word: גְּבוּלָהּ
  english_pob_choice: its territory
  chosen_korean: 그 영토
  alternatives_korean:
  - 그 경계
  - 그 지경
  - 그 변경
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계’도 뜻하지만 정복 목록에서는 경계로 둘러싸인 관할 구역까지 포함하는 의미가 자연스러워 ‘영토’로 옮겼습니다.
- source_word: עַזָּה / אַשְׁקְלוֹן / עֶקְרוֹן
  english_pob_choice: Gaza / Ashkelon / Ekron
  chosen_korean: 가자 / 아스글론 / 에그론
  alternatives_korean:
  - 가사 / 아스켈론 / 에그론
  lexicon: HALOT
  rationale: 표준 현대 한글 음역을 따르되, 지명 인지도와 일관성을 고려해 통용되는 형태로 옮겼습니다.
