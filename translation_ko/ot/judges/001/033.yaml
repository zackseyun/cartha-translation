source:
  edition: WLC
  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
  footnotes:
  - marker: a
    text: Or 'became subject to corvée labor for them.' The Hebrew מַס refers to compulsory labor service, not merely payment of tribute.
    reason: lexical_alternative
translation:
  language: ko
  text: 납달리는 벧세메스 주민들과 벧아낫 주민들을 쫓아내지 못했습니다. 그래서 그는 가나안 사람들 곧 그 땅의 주민들 가운데 살았습니다. 벧세메스와 벧아낫 주민들은 그들에게 강제 노역을 하게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 부역을 하게 되었습니다.’ 히브리어 מַס는 단순한 공물보다 강제 노동을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  english_pob_choice: drive out
  chosen_korean: 쫓아내다
  alternatives_korean:
  - 몰아내다
  - 축출하다
  lexicon: HALOT
  rationale: 사사기 문맥에서 점유하던 주민을 제거하는 군사·정착 맥락을 한국어로 자연스럽게 살리기 위해 ‘쫓아내다’를 택했습니다.
- source_word: יֹשְׁבֵי
  english_pob_choice: inhabitants
  chosen_korean: 주민들
  alternatives_korean:
  - 사는 사람들
  - 거주자들
  lexicon: HALOT
  rationale: 반복되는 מקום-거주 صيغة를 현대 한국어에서 간결하게 전달하면서도 반복성을 유지하는 표현입니다.
- source_word: בֵית שֶׁמֶשׁ / בֵית עֲנָת
  english_pob_choice: Beth-shemesh / Beth-anath
  chosen_korean: 벧세메스 / 벧아낫
  alternatives_korean:
  - 벧쉐메스 / 벧아나트
  - 베스세메스 / 베스아낫
  lexicon: translation policy
  rationale: 지명은 통용되는 음역을 따르되, 한국어 독자가 즉시 알아볼 수 있는 성서 지명 형태를 유지했습니다.
- source_word: הָיוּ לָהֶם לָמַס
  english_pob_choice: became forced labor for them
  chosen_korean: 그들에게 강제 노역을 하게 되었습니다
  alternatives_korean:
  - 그들에게 강제 노역이 되었습니다
  - 그들에게 부역이 되었습니다
  lexicon: HALOT
  rationale: מַס는 단순 조세가 아니라 강제 동원 노동을 뜻하므로, 그 뉘앙스를 살려 ‘강제 노역’으로 옮겼습니다.
theological_decisions:
- issue: 정복 실패와 종속의 병렬 서술
  chosen_reading: 납달리가 주민들을 쫓아내지 못한 결과, 그들 가운데 거주하게 되었고, 이후 그 주민들이 오히려 강제 노역이 되었다는 역전 구조를 그대로 드러냈습니다.
  alternative_readings:
  - 정복 실패만 강조하는 평평한 서술
  - ‘조공’ 중심으로 약화된 서술
  rationale: 본문은 단순한 공존이 아니라 미완의 점유와 그 결과로서의 종속을 함께 말하므로, 두 절반의 대비를 흐리지 않았습니다.
  doctrine_reference: 사사기 1장의 정복/불순종 서술 구조
