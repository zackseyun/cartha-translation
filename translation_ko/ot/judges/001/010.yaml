source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוּדָ֗ה אֶל הַֽ/כְּנַעֲנִי֙ הַ/יּוֹשֵׁ֣ב בְּ/חֶבְר֔וֹן וְ/שֵׁם חֶבְר֥וֹן לְ/פָנִ֖ים קִרְיַ֣ת אַרְבַּ֑ע וַ/יַּכּ֛וּ אֶת שֵׁשַׁ֥י וְ/אֶת אֲחִימַ֖ן וְ/אֶת תַּלְמָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
  footnotes:
  - marker: a
    text: Or “went to the Canaanite”; the Hebrew uses a singular form that likely functions collectively here, hence “the Canaanites.”
    reason: lexical_alternative
  - marker: b
    text: Or “Hebron was formerly called Kiriath-arba.”
    reason: lexical_alternative
  - marker: c
    text: “Struck down” could also be rendered “defeated” or “killed” in this military context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다는 헤브론에 살고 있던 가나안 사람들에게 나아가 그들을 쳤습니다. 헤브론의 옛 이름은 기럇아르바였고, 그들은 세새와 아히만과 달매를 쳐죽였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안 사람에게로 갔다’로도 옮길 수 있습니다. 히브리어는 여기서 집합적으로 쓰인 단수형일 가능성이 크므로, 본문에서는 ‘가나안 사람들’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘헤브론은 옛날에 기럇아르바라고 불렸습니다.’
    reason: alternative_reading
  - marker: c
    text: 이 전투 문맥에서는 ‘쳤습니다’가 ‘패배시켰습니다’나 ‘죽였습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אֶל
  english_pob_choice: went against
  chosen_korean: 나아가
  alternatives_korean:
  - 갔습니다
  - 공격하러 갔습니다
  - 맞서 갔습니다
  lexicon: HALOT
  rationale: וַיֵּלֶךְ는 기본적으로 ‘가다’이지만, כאן은 적대적 대상을 향한 군사 서술이므로 단순 이동보다 공격 의도가 드러나는 표현이 필요합니다. ‘나아가’는 과도한 해석 없이 대치·접근의 뉘앙스를 살립니다.
- source_word: הַכְּנַעֲנִי
  english_pob_choice: the Canaanites
  chosen_korean: 가나안 사람들
  alternatives_korean:
  - 가나안 사람
  - 가나안 족속
  - 가나안인들
  lexicon: HALOT
  rationale: 형태는 단수형이지만 집합적 용법이므로 한국어에서는 복수 집단명으로 옮기는 것이 자연스럽습니다. POB의 영어 선택과도 맞물리도록 ‘가나안 사람들’로 처리했습니다.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  english_pob_choice: living in Hebron
  chosen_korean: 헤브론에 살고 있던
  alternatives_korean:
  - 헤브론에 거주하던
  - 헤브론에 거하던
  - 헤브론에 살던
  lexicon: HALOT
  rationale: 현재분사형은 지속적 거주를 나타내므로 ‘살고 있던’이 자연스럽고 서술의 흐름도 매끈합니다.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  english_pob_choice: Hebron’s former name was Kiriath-arba
  chosen_korean: 헤브론의 옛 이름은 기럇아르바였고
  alternatives_korean:
  - 헤브론은 옛날에 기럇아르바라고 불렸고
  - 헤브론의 이전 이름은 기럇아르바였고
  lexicon: HALOT
  rationale: לְפָנִים은 ‘이전/옛날에’의 관용적 시간 부사이므로 ‘옛 이름’으로 자연스럽게 풀었습니다. 지명은 현대 외래어 표기 관례에 따라 음역했습니다.
- source_word: וַיַּכּוּ
  english_pob_choice: they struck down
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 쳐서 쓰러뜨렸습니다
  - 격파했습니다
  - 죽였습니다
  lexicon: HALOT
  rationale: נכה는 전투 문맥에서 ‘치다/타격하다’가 기본이며, 결과를 단정적으로 ‘죽였다’고 좁히기보다 한국어의 ‘쳤습니다’가 원문의 폭을 더 잘 보존합니다.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  english_pob_choice: Sheshai, Ahiman, and Talmai
  chosen_korean: 세새와 아히만과 달매
  alternatives_korean:
  - 세새, 아히만, 달매
  - 세새와 아히만과 탈매
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 성경에서 통용되는 형태를 우선했습니다. 마지막 이름은 표기 관례상 ‘달매’로 옮겼습니다.
theological_decisions:
- issue: 전투 동사의 구체성
  chosen_reading: ‘쳤습니다’로 두어 전투적 타격을 드러내되, 결과를 ‘죽였습니다’로 과잉 규정하지는 않았습니다.
  alternative_readings:
  - 죽였습니다
  - 격파했습니다
  - 쳐서 쓰러뜨렸습니다
  rationale: 히브리어 נכה는 이 맥락에서 결정적 군사 타격을 뜻하지만, 본문 자체는 개별 대상의 사망 여부를 문법적으로 명시하지 않습니다. 따라서 원문의 힘을 유지하면서도 의미 범위를 좁히지 않는 표현을 선택했습니다.
  doctrine_reference: 본문 의미 보존과 과잉해석 회피
