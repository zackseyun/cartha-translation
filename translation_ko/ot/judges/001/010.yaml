  to: 그때 유다는 헤브론에 거주하던 가나안 사람들에게 나아갔습니다.[a] 헤브론의 옛 이름은 기럇 아르바였습니다.[b] 유다는 세새와 아히만과 달매를 쳤습니다.[c]
  rationale: 원문의 사건 순서를 회복하기 위해 가나안 사람들을 친다는 중복 절을 삭제하고, 세 인물을 친 행위의 주어를 집합적 의미의 ‘유다’로 명시했습니다. נכה의 의미 범위를 보존하도록 ‘쳐죽였습니다’를 ‘쳤습니다’로 고쳤으며, 각주 표지를 해당 표현에 배치했습니다.
