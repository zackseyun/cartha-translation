  source_fidelity: 초안은 집합명사인 유다와 가나안 사람들을 적절히 처리하고 지명·인명도 대체로 충실히 음역했습니다. 그러나 첫 문장의 ‘그들을 쳤습니다’는 원문에 없는 가나안 사람들을 향한 별도의 타격을 삽입하며, 뒤의 세 인물을 친 사건을 중복시킵니다. 또한 마지막 ‘쳐죽였습니다’는 נכה의 의미를 ‘죽이다’로 불필요하게 한정합니다.
