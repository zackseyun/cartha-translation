  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ הַ/שָּׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
  footnotes:
  - marker: a
    text: Or, “she persuaded him” or “she incited him.” The Hebrew verb can carry a range from urging to inciting; here the context favors a neutral sense of urging.
    reason: lexical_alternative
  - marker: b
    text: Or, “she alighted from the donkey” or “she dropped down from the donkey.”
    reason: lexical_alternative
  - marker: c
    text: The Hebrew idiom literally reads, “What is to you?” meaning “What do you want?” or “What is the matter?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 오자 그녀는 그에게 아버지에게 밭을 달라고 권했습니다. 그러고 나서 그녀는 나귀에서 내려오자, 갈렙이 그녀에게 말했습니다. 「무엇을 원합니까?」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘권했습니다’는 여기서 중립적인 요청 조장/재촉의 뜻으로 읽은 것입니다. 원어는 경우에 따라 ‘부추기다’까지도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내려오자’는 원문의 ‘나귀에서 내려옴/떨어짐’의 동작을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구는 직역하면 ‘당신에게 무엇이 있습니까?’로, 곧 ‘무엇을 원합니까?’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּסִיתֵהוּ
  english_pob_choice: she urged him
  chosen_korean: 그에게 ... 달라고 권했습니다
  alternatives_korean:
  - 그를 부추겼습니다
  - 그를 권유했습니다
  - 그를 설득했습니다
  lexicon: HALOT
  rationale: 이 동사는 상황에 따라 ‘부추기다/선동하다/권하다’까지 넓게 가지만, 아버지에게 밭을 요청하도록 재촉하는 문맥이어서 중립적인 ‘권했습니다’가 가장 자연스럽습니다.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  english_pob_choice: to ask her father for the field
  chosen_korean: 아버지에게 밭을 달라고
  alternatives_korean:
  - 아버지에게 그 밭을 요청하도록
  - 아버지에게 밭을 구하도록
  - 아버지로부터 그 밭을 청하도록
  lexicon: HALOT
  rationale: שאל + מֵאֵת는 청원/요청의 방향을 나타내므로, 한국어에서는 ‘달라고’로 자연스럽게 요청의 대상을 드러내는 것이 원문 기능을 잘 살립니다.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  english_pob_choice: she dismounted from the donkey
  chosen_korean: 그녀는 나귀에서 내려오자
  alternatives_korean:
  - 그녀는 나귀에서 내렸습니다
  - 그녀는 나귀에서 내려섰습니다
  - 그녀는 나귀에서 몸을 내렸습니다
  lexicon: HALOT
  rationale: צנח는 ‘떨어지다/내려오다’의 뉘앙스를 가질 수 있어, 서사 흐름을 해치지 않으면서 동작을 전달하는 ‘내려오자’가 적절합니다.
- source_word: מַה לָּךְ
  english_pob_choice: What do you want?
  chosen_korean: 무엇을 원합니까?
  alternatives_korean:
  - 무슨 일이십니까?
  - 무엇이 있습니까?
  - 무엇이 문제입니까?
  lexicon: HALOT
  rationale: 직역하면 ‘무엇이 당신에게 있습니까’이지만, 바로 앞의 청원 장면에서는 상대의 요청 의도를 묻는 말이므로 ‘무엇을 원합니까?’가 관용적 기능을 가장 잘 전달합니다.
theological_decisions:
- issue: 갈렙의 말투와 장면의 분위기
  chosen_reading: 갈렙의 질문을 공손한 평서·의문체로 옮겨, 장면의 가족적이고 실용적인 분위기를 유지했습니다.
  alternative_readings:
  - 더 친근한 반말체
  - 더 엄격한 심문체
  rationale: 원문은 갈렙의 감정적 강도보다 요청의 의도를 확인하는 대화에 가깝기 때문에, 과도한 정서화나 위압감을 피하는 것이 문맥에 부합합니다.
  doctrine_reference: 서사 문맥 보존
