- from: 그러나 아모리 사람들은 헤레스 산과 아이얄론과 사알빔에 계속 살았습니다. 그때 요셉 가문의 손이 무거워졌고, 그들은 강제 노역 아래 놓이게 되었습니다.[a][b]
  to: 그러나 아모리 사람들은 헤레스 산과 아이얄론과 사알빔에 살기를 고집했습니다. 그때 요셉 가문의 손이 무거워졌고[a], 그들은 강제 노역을 하게 되었습니다.[b]
  rationale: 각주 표지를 실제 주석 대상 바로 뒤로 옮겨 구조적 연결을 바로잡았습니다. 또한 ‘살기를 고집했습니다’로 וַיּוֹאֶל의 문맥상 완강한 지속 의지를 살렸고, 강제 노동 결과는 자연스러운 현대 한국어로 직접 표현했습니다. ‘손이 무거워졌다’는 원문의 비유를 보존하되 즉시 연결되는 각주로 의미 범위를 밝혔습니다.
