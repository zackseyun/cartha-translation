  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וַיּוֹאֶל은 단순히 ‘계속 살았다’보다 그곳에 살기를 고집하거나 완강히 지속했다는 뉘앙스를 지니므로 이를 드러내는 편이 낫습니다. 또한 מַס는 아모리 사람들이 요셉 가문에 부역/강제 노역을 하게 된 상태를 가리킵니다.
  naturalness: 초안의 문체는 합쇼체에 맞지만, ‘손이 무거워졌고’는 한국어에서 매우 낯선 직역입니다. 본문에서는 원문의 비유를 보존할 수 있으나, 각주를 해당 표현 바로 뒤에 두어 이해를 도와야 합니다. ‘강제 노역 아래 놓이게 되었습니다’는 자연스럽지만, ‘강제 노역을 하게 되었습니다’가 원문의 결과 상태를 더 직접적으로 표현합니다.
  terminology: ‘아모리 사람들’, ‘헤레스 산’, ‘아이얄론’, ‘사알빔’, ‘요셉 가문’은 일관되고 무난합니다. מַס는 ‘강제 노역’으로 옮길 수 있으며, 각주에서 ‘부역’ 및 ‘강제 동원 노동자’ 대안을 제시하는 것이 적절합니다.
