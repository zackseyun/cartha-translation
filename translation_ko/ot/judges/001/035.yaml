  rationale: ‘손이 무겁다’는 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서도 의미가 통하도록 ‘무거워졌다’로 유지했습니다.
- source_word: וַיִּהְיוּ לָמַס
