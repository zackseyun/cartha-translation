  rationale: 본문은 물리적 무게 이미지와 지배력 증대를 함께 담고 있어, 의미를 평탄화하지 않고 관용구를 보존하는 것이 소스 충실도에 맞습니다.
  doctrine_reference: 서술 본문 해석 원칙
