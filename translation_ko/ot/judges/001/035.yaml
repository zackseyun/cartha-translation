base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
  footnotes:
  - marker: a
    text: Or 'the hand of the house of Joseph prevailed,' literally 'grew heavy.' The Hebrew idiom can express increasing strength or oppressive power.
    reason: lexical_alternative
  - marker: b
    text: Or 'they were put to forced labor' or 'they became tributary laborers.' The Hebrew term refers to compulsory labor service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아모리 사람들은 헤레스 산과 아이얄론과 사알빔에 살기를 고집했습니다. 그때 요셉 가문의 손이 무거워졌고[a], 그들은 강제 노역을 하게 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요셉 가문의 손이 우세해졌고’의 뜻입니다. 히브리어 관용구는 힘의 증대나 압박적 권세를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 부역하게 되었습니다’ 또는 ‘그들은 강제 동원 노동자가 되었습니다’의 뜻입니다. 히브리어 용어는 강제 노동 봉사를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל הָאֱמֹרִי לָשֶׁבֶת
  english_pob_choice: the Amorites persisted in dwelling
  chosen_korean: 아모리 사람들은 … 계속 살았습니다
  alternatives_korean:
  - 아모리 사람들이 … 거주하기를 고집했습니다
  - 아모리 사람들이 … 살기를 원했습니다
  - 아모리 사람들이 … 머물기를 시작했습니다
  lexicon: HALOT
  rationale: וַיּוֹאֶל은 단순한 시작보다 ‘기꺼이/고집하여 계속하다’의 뉘앙스가 있어, 문맥상 지속적 거주를 드러내는 ‘계속 살았습니다’로 옮겼습니다.
- source_word: בְּהַר חֶרֶס / בְּאַיָּלֹון / וּבְשַׁעַלְבִים
  english_pob_choice: in Mount Heres, in Aijalon, and in Shaalbim
  chosen_korean: 헤레스 산과 아이얄론과 사알빔
  alternatives_korean:
  - 헤레스 산지와 아이얄론과 사알빔
  - 헤레스 산과 아얄론과 샤알빔
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역을 따르되, הַר חֶרֶס는 ‘산/산지’의 문맥을 살려 ‘헤레스 산’으로 유지했습니다.
- source_word: וַתִּכְבַּד יַד
  english_pob_choice: the hand of the house of Joseph grew heavy
  chosen_korean: 요셉 가문의 손이 무거워졌고
  alternatives_korean:
  - 요셉 가문의 손이 강해졌고
  - 요셉 가문의 손이 그들을 압박했고
  - 요셉 가문의 손이 우세해졌고
  lexicon: HALOT
  rationale: ‘손이 무겁다’는 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서도 의미가 통하도록 ‘무거워졌다’로 유지했습니다.
- source_word: וַיִּהְיוּ לָמַס
  english_pob_choice: they became subject to forced labor
  chosen_korean: 그들은 강제 노역 아래 놓이게 되었습니다
  alternatives_korean:
  - 그들은 강제 노역에 종속되었습니다
  - 그들은 부역하게 되었습니다
  - 그들은 강제 노역을 하게 되었습니다
  lexicon: HALOT
  rationale: מַס는 단순한 세금보다 강제 동원된 노동을 가리키므로, POB의 ‘forced labor’ 의미를 분명히 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 헤브라이어 관용구 ‘손이 무거워지다’의 의미 보존
  chosen_reading: 직역 이미지를 유지하되, 결과는 권세/압박의 증대로 읽히도록 번역했습니다.
  alternative_readings:
  - ‘요셉 가문의 힘이 강해졌습니다’
  - ‘요셉 가문의 세력이 우세해졌습니다’
  rationale: 본문은 물리적 무게 이미지와 지배력 증대를 함께 담고 있어, 의미를 평탄화하지 않고 관용구를 보존하는 것이 소스 충실도에 맞습니다.
  doctrine_reference: 서술 본문 해석 원칙
