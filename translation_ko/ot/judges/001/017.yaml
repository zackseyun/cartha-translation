  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: ko
  text: 유다가 자기 형제 시므온과 함께 가서 스밧에 사는 가나안 사람들을 쳐서 그 성을 진멸에 바쳤습니다[a]. 그래서 유다가 그 성의 이름을 호르마라고 불렀습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진멸에 바쳤습니다’는 히브리어 헤렘(ḥerem) 관련 표현입니다. 어떤 것을 되돌릴 수 없게 하나님께 바치는 것을 가리키며, 이 문맥에서는 흔히 파괴를 수반합니다.
    reason: technical_term
  - marker: b
    text: 히브리어는 ‘그가 불렀다’라는 단수형입니다. 여기서는 유다를 집단적 또는 대표적 주어로 가리키는 것으로 볼 수 있습니다. ‘호르마’는 ‘진멸에 바침’과 관련된 히브리어 말과 소리가 비슷합니다.
    reason: alternative_reading
