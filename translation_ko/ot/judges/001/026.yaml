  text: וַ/יֵּ֣לֶךְ הָ/אִ֔ישׁ אֶ֖רֶץ הַ/חִתִּ֑ים וַ/יִּ֣בֶן עִ֗יר וַ/יִּקְרָ֤א שְׁמָ/הּ֙ ל֔וּז ה֣וּא שְׁמָ֔/הּ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'named it Luz.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 헷 사람들의 땅으로 가서 성을 건축하고 그 이름을 루스로 불렀습니다. 그것이 오늘날까지 그 이름입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게, ‘그것을 루스라 이름하였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָאִישׁ
  english_pob_choice: the man went
  chosen_korean: 그 사람이 … 가서
  alternatives_korean:
  - 그 사람이 갔습니다
  - 그 남자가 갔습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리면서 גם הלך의 기본 의미를 그대로 반영하기 위해 ‘가서’를 썼습니다. ‘그 사람’은 앞선 문맥의 특정 인물을 가리킵니다.
- source_word: אֶרֶץ הַחִתִּים
  english_pob_choice: the land of the Hittites
  chosen_korean: 헷 사람들의 땅
  alternatives_korean:
  - 헷 족속의 땅
  - 헷 사람들의 나라
  lexicon: HALOT
  rationale: 직역된 지리적·민족적 표현을 유지하되, 한국어에서 자연스러운 관용인 ‘헷 사람들’을 사용했습니다. ‘나라’는 본문보다 정치적 의미를 더할 수 있어 피했습니다.
- source_word: וַיִּבֶן עִיר
  english_pob_choice: built a city
  chosen_korean: 성을 건축하고
  alternatives_korean:
  - 도시를 세우고
  - 성을 지었고
  lexicon: HALOT
  rationale: ‘성’은 문맥상 도시/거주지를 가리키는 일반적 고어적 표현이지만, 현대 한국어에서는 ‘도시’보다 과도한 현대화 없이 본문의 거주지 건립 의미를 유지할 수 있습니다. 동작 동사 ‘건축하다’는 בנה의 건설적 뉘앙스를 살립니다.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  english_pob_choice: called its name Luz
  chosen_korean: 그 이름을 루스로 불렀습니다
  alternatives_korean:
  - 그것을 루스라 이름하였습니다
  - 이름을 루스라고 불렀습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘그 이름을 … 부르다’를 한국어에서 가장 자연스럽게 풀었습니다. POB의 ‘named it Luz’에 해당하는 의미를 유지하되, 인칭대명사 ‘그것’보다 한국어 문맥상 ‘그 이름’을 살리는 편이 덜 어색합니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이 날까지
  - 오늘까지
  lexicon: HALOT
  rationale: 히브리어 시간 부사구의 관용적 의미를 현대 한국어에서 가장 안정적으로 전달하는 표현입니다.
theological_decisions:
- issue: 지명 루스의 음역과 기존 성서 관용의 균형
  chosen_reading: 루스
  alternative_readings:
  - 루즈
  - 루스스
  rationale: 본절의 לוּז는 고유지명으로, 원형의 음가를 보존하는 음역이 필요합니다. 한국어 성서 전통과 현대 독자성을 함께 고려해 ‘루스’를 채택했습니다.
  doctrine_reference: 고유명사 처리 원칙
