base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
  footnotes:
  - marker: a
    text: Or, “show us the way into the city.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew hesed; often rendered “kindness,” “loyalty,” or “steadfast love,” depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 파수꾼들이 성읍에서 나오는 한 사람을 보았습니다. 그들은 그에게 말했습니다. 「부디 성읍으로 들어가는 길을 보여 주십시오.[a] 그러면 우리가 당신에게 호의를 베풀겠습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍으로 들어가는 길을 보여 주십시오.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 헤세드; 문맥에 따라 ‘호의’, ‘충성’, ‘인애’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  english_pob_choice: the watchers
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 감시자들
  - 지키는 사람들
  - 경계하던 사람들
  lexicon: HALOT
  rationale: 성읍 밖에서 움직임을 살피는 이들이라는 기능을 살려 ‘파수꾼들’로 옮겼습니다. ‘경비병들’보다 직무를 지나치게 군사화하지 않으면서도 감시의 뉘앙스를 유지합니다.
- source_word: מְבוֹא
  english_pob_choice: the entrance
  chosen_korean: 성읍으로 들어가는 길
  alternatives_korean:
  - 입구
  - 들어가는 곳
  - 진입로
  lexicon: HALOT
  rationale: 문자적으로는 ‘입구’가 가능하지만, 히브리어가 가리키는 접근 경로의 구체성을 살려 ‘성읍으로 들어가는 길’로 풀었습니다. 이는 영어 주석의 대안인 ‘the way into the city’도 함께 반영합니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청컨대
  - 부탁드립니다
  lexicon: HALOT
  rationale: 정중한 요청을 나타내는 입자로서 현대 한국어에서는 ‘부디’가 가장 자연스럽고 문체상도 공손합니다.
- source_word: חָסֶד
  english_pob_choice: we will deal kindly with you
  chosen_korean: 호의를 베풀겠습니다
  alternatives_korean:
  - 친절하게 대하겠습니다
  - 은혜를 베풀겠습니다
  - 인자하게 대하겠습니다
  lexicon: HALOT
  rationale: 이 장면에서 חֶסֶד는 언약적 표어보다 협상 속의 호의/선의에 가깝습니다. ‘호의를 베풀겠습니다’는 약속의 성격을 살리면서도 본문이 강하게 말하지 않는 신학적 의미를 덧씌우지 않습니다.
theological_decisions:
- issue: חֶסֶד의 신학적 무게
  chosen_reading: 협상 맥락의 호의로 처리
  alternative_readings:
  - 언약적 신실함
  - 인자
  - 자애
  rationale: 본문은 정보를 얻기 위한 거래 제안이며, 여기서 חֶסֶד를 언약 신학 용어로 격상하면 장면의 직접적 의미를 넘어서게 됩니다. 따라서 독자가 즉시 이해할 수 있는 호의/선의로 번역하는 것이 본문 충실도에 더 적합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
