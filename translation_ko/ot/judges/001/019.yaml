  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
  footnotes:
  - marker: a
    text: Or 'the inhabitants of the plain' or 'lowland'; the Hebrew term can refer to a broad valley region.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 유다와 함께 계셨으므로 그가 산지를 차지하였으나, 그들은 철 병거를 가지고 있었기 때문에 골짜기 주민들을 쫓아내지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’는 넓은 저지대나 평야를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 고유 신명사
  rationale: 이 절의 한국어 본문은 일반 교회 독자에게 익숙한 고유 신명사 형태를 따르되, 영어 POB의 YHWH 표기와 원문 대응은 유지했습니다.
- source_word: אֶתּ יְהוּדָה
  english_pob_choice: with Judah
  chosen_korean: 유다와 함께
  alternatives_korean:
  - 유다와 동행하여
  - 유다 편에
  lexicon: HALOT
  rationale: 여기서 אֵת는 목적어 표지가 아니라 동반을 나타내므로, ‘함께’로 자연스럽게 옮겼습니다.
- source_word: וַיֹּרֶשׁ
  english_pob_choice: he took possession of
  chosen_korean: 차지하였으므로
  alternatives_korean:
  - 소유하게 되었으므로
  - 점유하였으므로
  lexicon: HALOT
  rationale: הִפְעִיל형 ירש의 성격을 반영해 ‘소유권을 얻다/차지하다’의 뜻을 살렸고, 뒤의 ‘쫓아내다’와 구분되도록 했습니다.
- source_word: הָעֵמֶק
  english_pob_choice: the valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 낮은 땅
  lexicon: HALOT
  rationale: 기본 의미를 따라 ‘골짜기’로 옮겼습니다. 이 단어가 넓은 저지대까지 가리킬 수 있다는 점은 본문 주석으로 충분합니다.
theological_decisions:
- issue: 여호와께서 함께 계심에도 불구하고 이어지는 실패의 진술
  chosen_reading: 첫 절의 ‘여호와께서 유다와 함께 계셨으므로’와 뒤의 ‘…쫓아내지 못했습니다’를 모두 살려, 신학적 긴장을 완화하지 않았습니다.
  alternative_readings:
  - 실패를 완화하여 ‘쫓아내지 못하게 되었습니다’처럼 돌림
  - 원인을 흐리게 하여 단순한 서술로 처리
  rationale: 원문은 여호와의 임재와 군사적 실패를 나란히 제시합니다. 번역에서 둘 사이의 긴장을 해소하지 않고 그대로 드러내는 것이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
