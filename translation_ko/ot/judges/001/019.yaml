  source_fidelity: 원문의 접속 וַ/는 인과관계보다 사건의 연결을 나타내므로, 첫 절의 ‘으므로’는 ‘여호와께서 함께 계셨기 때문에 유다가 산지를 차지했다’라는 명시적 인과를 덧붙입니다. 또한 원문의 문맥상 산지를 차지하고 주민들을 쫓아내지 못한 주체는 유다이며, 이를 명시하면 한국어의 대명사 지시가 분명해집니다.
  naturalness: ‘여호와께서 유다와 함께 계셨고, 유다는 …’이라는 병렬 서술은 현대 표준 한국어 합쇼체에서 자연스럽고, 뒤 절의 대조와 실패의 긴장을 명료하게 전달합니다.
