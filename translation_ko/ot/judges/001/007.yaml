source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “with their thumbs and big toes cut off.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew אֱלֹהִים is morphologically plural but takes a singular verb here; thus “God” rather than “the gods.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아도니베섹이 말했습니다. “일흔 명의 왕들이 손의 엄지손가락과 발의 엄지발가락이 잘린 채[a] 내 식탁 아래에서 부스러기를 주워 먹곤 했습니다. 내가 한 것처럼 하나님께서[b] 내게 그대로 갚으셨습니다.” 그들이 그를 예루살렘으로 데려갔고, 그는 거기서 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들의 손의 엄지들과 발의 엄지들이 잘린 채”라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֱלֹהִים은 형태상 복수형이지만, 여기서는 단수 동사와 함께 쓰여 “하나님”으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  english_pob_choice: Adoni-bezek
  chosen_korean: 아도니베섹
  alternatives_korean:
  - 베섹의 주인
  - 아도니-베섹
  lexicon: HALOT
  rationale: 고유명사로 처리해 음역했고, 한국어 표기에서는 읽기 자연성을 위해 하이픈 없이 붙여 썼습니다.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  english_pob_choice: the thumbs of their hands and their feet
  chosen_korean: 손과 발의 엄지발가락이 잘린
  alternatives_korean:
  - 손의 엄지와 발의 엄지발가락이 잘린
  - 엄지와 엄지발가락이 잘린
  lexicon: HALOT
  rationale: 히브리어가 손과 발을 모두 명시하므로, 손/발의 대응을 살리면서 자연스러운 한국어로 ‘엄지발가락’까지 밝혔습니다.
- source_word: הָיוּ מְלַקְּטִים
  english_pob_choice: used to gather scraps
  chosen_korean: 부스러기를 주워 먹곤 했습니다
  alternatives_korean:
  - 부스러기를 주워 모으곤 했습니다
  - 주워 먹었습니다
  lexicon: HALOT
  rationale: 반복·습관의 뉘앙스를 ‘-곤 했습니다’로 살렸고, 굴욕적 상황에 맞게 ‘부스러기’와 ‘주워 먹다’를 결합했습니다.
- source_word: שִׁלַּם לִי אֱלֹהִים
  english_pob_choice: God has repaid me
  chosen_korean: 하나님께서 내게 그대로 갚으셨습니다
  alternatives_korean:
  - 하나님께서 내게 갚으셨습니다
  - 신들께서 내게 갚으셨습니다
  lexicon: HALOT
  rationale: 형태상 복수형 אֱלֹהִים이지만 단수 동사가 이어지므로 ‘하나님’으로 옮기고, ‘As I have done, so’의 대응을 ‘그대로’로 드러냈습니다.
theological_decisions:
- issue: אֱלֹהִים의 의미 범주
  chosen_reading: 하나님
  alternative_readings:
  - 신들
  rationale: 단수 동사 שִׁלַּם이 강하게 지시하므로 복수 ‘신들’보다 단수 ‘하나님’이 원문 문법과 더 잘 맞습니다. 다만 본문 자체는 아도니베섹의 재앙 해석을 간결히 전할 뿐, 그의 신앙 고백 수준까지 확장하지는 않았습니다.
  doctrine_reference: 원문 문법 우선, 신학적 해석 과잉 방지
