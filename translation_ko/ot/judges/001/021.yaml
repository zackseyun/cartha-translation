source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the Jebusite ... dwelt with the sons of Benjamin'; the singular functions collectively for the people group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 베냐민 자손은 예루살렘에 살고 있던 여부스 사람들을 쫓아내지 않았습니다[a]. 그리하여 여부스 사람들은 오늘날까지 예루살렘에서 베냐민 자손과 함께 살고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여부스 사람이 … 베냐민 자손과 함께 살았다’라고 말하며, 단수형이 집단 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 하지만
  lexicon: HALOT
  rationale: 앞뒤 정복 서술과의 대비를 살리기 위해 단순 연결보다 역접인 ‘그러나’가 자연스럽습니다.
- source_word: הַיְבוּסִי
  english_pob_choice: the Jebusites
  chosen_korean: 여부스 사람들
  alternatives_korean:
  - 여부스인들
  - 여부스 사람
  lexicon: HALOT
  rationale: 히브리어는 단수 집합형이지만, 한국어에서는 민족 집단을 복수적 집합으로 풀어 ‘여부스 사람들’이 가장 분명합니다.
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  english_pob_choice: who were living in Jerusalem
  chosen_korean: 예루살렘에 살고 있던
  alternatives_korean:
  - 예루살렘에 거주하던
  - 예루살렘에 거하고 있던
  lexicon: HALOT
  rationale: 지속적 거주를 나타내는 분사이므로 현재적 상태를 드러내는 ‘살고 있던’이 문맥에 맞습니다.
- source_word: הוֹרִישׁוּ
  english_pob_choice: did not drive out
  chosen_korean: 쫓아내지 못했습니다
  alternatives_korean:
  - 몰아내지 못했습니다
  - 축출하지 못했습니다
  lexicon: HALOT
  rationale: 정복-정착 문맥의 ‘drive out’를 현대 한국어로 자연스럽게 옮기면서, 실제로 성취하지 못한 뜻을 분명히 했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이 날까지
  - 이때까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 지속성을 한국어 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: 정복 실패와 공동거주의 역사적 서술
  chosen_reading: 본문은 베냐민 지파의 미정복과 여부스 사람들의 지속적 공존을 사실적으로 진술합니다.
  alternative_readings:
  - 신학적 평가를 덧붙여 ‘벌을 받았다’처럼 해석하는 읽기
  - ‘함께 살게 되었다’를 중립보다 긍정적으로 완화하는 읽기
  rationale: 히브리어 서술은 원인 해석보다 결과 사실에 초점을 두므로, 평가를 덧붙이지 않고 그대로 유지하는 것이 가장 충실합니다.
  doctrine_reference: 역사서의 서술적 문맥과 본문 우선 원칙
