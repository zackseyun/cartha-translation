  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
  footnotes:
  - marker: a
    text: Or “the one who strikes Kiriath-sepher and captures it.”
    reason: lexical_alternative
translation:
  language: ko
  text: 갈렙이 말했습니다. “누구든지 기럇세벨을 쳐서 그것을 함락시키는 사람에게, 내가 내 딸 악사를 아내로 주겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “기럇세벨을 쳐서 그것을 함락시키는 사람에게”
    reason: ‘누구든지’에 대한 명사구 형태의 대안적 번역
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서사 진행의 순차성을 살리되, 현대 표준어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: אֲשֶׁר יַכֶּה ... וּלְכָדָהּ
  english_pob_choice: Whoever strikes ... and captures it
  chosen_korean: 누구든지 ... 쳐서 그것을 함락시키는 자
  alternatives_korean:
  - 그 성을 쳐서 점령하는 자
  - 그것을 공격하여 사로잡는 자
  lexicon: HALOT
  rationale: 일반적 ‘쳐서’와 군사적 결과를 드러내는 ‘함락시키는 자’로, 히브리어의 공격과 포획의 이중 동사를 함께 살렸습니다.
- source_word: קִרְיַת סֵפֶר
  english_pob_choice: Kiriath-sepher
  chosen_korean: 기럇세벨
  alternatives_korean:
  - 기럇세페르
  - 기럇서페르
  lexicon: 관용 지명 표기
  rationale: 히브리어 지명의 통용형을 따라 음역하고, 한국어 성경 전통에서 널리 쓰이는 형태를 우선했습니다.
- source_word: אֶת עַכְסָה בִתִּי לְאִשָּׁה
  english_pob_choice: I will give him my daughter Achsah as a wife
  chosen_korean: 내 딸 악사를 아내로 주겠습니다
  alternatives_korean:
  - 내 딸 악사를 그에게 아내로 주겠습니다
  - 내 딸 악사를 그의 아내로 주겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘아내로’라는 결합을 한국어에서는 목적어+보어 구조로 자연스럽게 풀어, 결혼 제안의 의미를 분명히 했습니다.
theological_decisions:
- issue: 서술의 직설적 약속 표현
  chosen_reading: 갈렙의 발언을 조건부 보상 약속으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘주겠노라’로 옮김
  - 의미를 풀어 ‘혼인시켜 주겠다’로 옮김
  rationale: 본문은 성읍 함락을 전제로 딸을 아내로 주겠다는 공적 약속이므로, 조건과 보상의 긴장감을 흐리지 않도록 직접적으로 번역했습니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: 대상 지명 음역의 보존
  chosen_reading: 기럇세벨을 지명으로 유지했습니다.
  alternative_readings:
  - 뜻풀이로 ‘책의 성읍’이라 옮김
  rationale: 본문의 초점은 지명의 뜻풀이가 아니라 전투 대상의 특정성에 있으므로, 음역을 유지해 서술 기능을 보존했습니다.
  doctrine_reference: 고유명사 처리 원칙
