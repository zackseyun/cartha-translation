base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Judah.'' The phrase refers to the Judahite tribal group; ''sons'' is retained to reflect the source wording.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fought in Jerusalem,' though the context strongly favors 'fought against Jerusalem.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 유다 자손이 예루살렘과 싸워 그것을 점령하고[a], 칼날로 그것을 쳤으며[b], 그 성읍에 불을 질렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘유다의 자손들’입니다. 이는 개인적 아들이 아니라 유다 지파 전체를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘칼의 입/날로’입니다. 한국어에서는 관용적으로 ‘칼날로’라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יְהוּדָה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다 자손
  alternatives_korean:
  - 유다 사람들
  - 유다의 아들들
  lexicon: HALOT
  rationale: 직역의 ‘sons’를 살리되, 한국어 성경에서 자연스럽고 혈연·집단적 의미를 함께 전달하는 ‘자손’으로 옮겼습니다.
- source_word: בִּירוּשָׁלִַם / וַיִּלָּחֲמוּ
  english_pob_choice: fought against Jerusalem
  chosen_korean: 예루살렘과 싸워
  alternatives_korean:
  - 예루살렘 안에서 싸워
  - 예루살렘을 치러 싸워
  lexicon: HALOT
  rationale: 전쟁 문맥에서 ב가 공격 대상을 가리키는 점을 반영하여, 단순한 장소 ‘안에서’가 아니라 예루살렘을 향한 적대 행위로 읽히도록 했습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼끝으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지인 ‘칼의 입/날’을 살리되, 현대 한국어에서 자연스럽고 간결한 ‘칼날로’로 옮겼습니다.
- source_word: שִׁלְּחוּ בָאֵשׁ
  english_pob_choice: they set the city on fire
  chosen_korean: 그 성읍에 불을 질렀습니다
  alternatives_korean:
  - 그 성읍을 불태웠습니다
  - 그 성읍을 불에 넘겼습니다
  lexicon: HALOT
  rationale: שלח + באש의 관용적 의미를 ‘불을 지르다’로 표현해, 단순 소각이 아니라 의도적 방화를 드러냈습니다.
theological_decisions:
- issue: 정복 서술의 폭력성 표현
  chosen_reading: ‘점령하고… 칼날로… 불을 질렀습니다’처럼 군사적 행위를 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - ‘차지하고’로 완화
  - ‘무찔렀습니다’로 일반화
  rationale: 본문은 실제 전투·점령·파괴를 연속적으로 묘사하므로, 역사 서술의 강도를 유지하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: 본문 충실성; 역사 서술의 직접성
- issue: 유다 지파를 지칭하는 집단 표현
  chosen_reading: ‘유다 자손’으로 번역해 족속/지파 집단을 드러냈습니다.
  alternative_readings:
  - ‘유다 사람들’
  - ‘유다 지파’
  rationale: 히브리어의 혈연적 표현을 유지하면서도, 문맥상 개인이 아니라 집단적 행위자임을 분명히 하기 위한 선택입니다.
  doctrine_reference: 집단 명칭의 원문 형상 보존
