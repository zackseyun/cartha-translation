  text: 그때 유다 자손이 예루살렘을 상대로 싸워[c] 그것을 점령하고[a], 칼날로 그것을 쳤으며[b], 그 도시를 불태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘유다의 자손들’입니다. 여기서는 유다 지파에 속한 사람들을 집합적으로 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘칼의 입으로’입니다. 이는 칼날이나 칼의 날을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘예루살렘에서 싸워’. 히브리어 전치사는 장소를 뜻할 수도 있으나, 이어지는 점령과 파괴의 문맥은 예루살렘을 공격 대상으로 이해하는 것을 강하게 뒷받침합니다.
    reason: alternative_reading
