base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
  footnotes:
  - marker: a
    text: Or, possibly, “Othniel son of Kenaz, the younger brother of Caleb,” or “the younger kinsman of Caleb.” The Hebrew most naturally reads “brother of Caleb, younger than him,” but some understand the kinship term more broadly.
    reason: alternative_reading
translation:
  language: ko
  text: 옷니엘, 그나스의 아들, 갈렙의 더 어린 동생이 그것을 점령했습니다. 그리고 그가 자기 딸 악사를 아내로 그에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그나스의 아들 옷니엘, 갈렙의 더 어린 동생’ 혹은 ‘갈렙의 더 어린 친족’으로도 볼 수 있습니다. 히브리어는 가장 자연스럽게 ‘갈렙의 형제, 그보다 더 어린 자’로 읽히지만, 친족 관계를 더 넓게 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  english_pob_choice: captured it
  chosen_korean: 그것을 점령했습니다
  alternatives_korean:
  - 그것을 포로로 삼았습니다
  - 그것을 차지했습니다
  lexicon: HALOT
  rationale: 성읍을 전쟁으로 ‘사로잡다/점령하다’는 뜻을 살리되, 현대 한국어에서 자연스럽고 군사적 결과를 분명히 보이도록 했습니다.
- source_word: עָתְנִיאֵל
  english_pob_choice: Othniel
  chosen_korean: 옷니엘
  alternatives_korean:
  - 오드니엘
  lexicon: 표준 음역 관행
  rationale: 인명은 한국어 성경에서 널리 쓰이는 음역인 옷니엘을 따랐습니다.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  english_pob_choice: Caleb’s younger brother
  chosen_korean: 갈렙의 더 어린 동생
  alternatives_korean:
  - 갈렙의 젊은 형제
  - 갈렙보다 더 어린 형제
  - 갈렙의 더 어린 친족
  lexicon: HALOT
  rationale: אֲחִי의 기본 의미인 ‘형제/동생’과 비교구문 ‘그보다 더 작다/어리다’를 살려, 자연스러운 현대 한국어로 관계와 연령 비교를 함께 드러냈습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로서
  - 혼인하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 직접 옮겨, 딸을 ‘아내로’ 주었다는 혼인 성격을 분명히 했습니다.
theological_decisions:
- issue: 갈렙과 옷니엘의 친족 관계 해석
  chosen_reading: 본문의 가장 자연스러운 읽기대로 옷니엘을 갈렙의 ‘더 어린 동생’으로 옮겼습니다.
  alternative_readings:
  - 갈렙의 더 어린 친족
  - 갈렙의 조카
  rationale: 히브리어는 친족 관계를 넓게 볼 여지도 있지만, 기본 문법은 ‘갈렙의 형제, 그보다 어린’으로 읽히므로 본문은 그 직해를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
