revisions:
- from: 옷니엘, 그나스의 아들, 갈렙의 더 어린 동생이 그것을 점령했습니다. 그리고 그가 자기 딸 악사를 아내로 그에게 주었습니다.[a]
  to: 그나스의 아들 옷니엘, 곧 갈렙보다 어린 동생이 그 성읍을 점령했습니다. 갈렙은 자기 딸 악사를 그의 아내로 주었습니다.[a]
  rationale: 문맥상 갈렙인 둘째 절의 주어를 명시하여 한국어 대명사 지시의 모호성을 제거했습니다. 성읍을 가리키는 여성 목적어도 ‘그 성읍’으로 드러냈습니다. 친족 관계의 본문 직해와 각주의 대안은 유지하되, 한국어 표현과 각주의 대비를 다듬었습니다.
