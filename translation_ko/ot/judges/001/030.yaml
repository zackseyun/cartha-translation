    issue: ‘살게 되었고’가 וַיֵּשֶׁב의 상을 과도하게 변화·결과 상태로 옮깁니다.
    rationale: 본문은 가나안 사람들이 스불론 ‘가운데 살았다’고 서술한 뒤, 그들이 강제 노역자가 되었다고 말합니다. 변화의 결과는 후자의 וַיִּהְיוּ에 명시되어 있습니다.
  - severity: low
    issue: 나할롤의 대체 지명형과 집합적 단수 주석의 앵커가 영어 감사 추적과 대응되지 않습니다.
    rationale: 히브리어 본문형 ‘나할롤’을 유지하되 관련 전승형 ‘나할랄’을 지명에 직접 연결하고, 집합적 단수 관련 설명은 해당 절 끝에 연결하면 주석의 지시 대상이 분명해집니다.
