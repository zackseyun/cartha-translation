source:
  edition: WLC
  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
  footnotes:
  - marker: a
    text: Or 'Nahalal'; English tradition and related passages sometimes preserve that place-name form.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the Canaanite lived in his/its midst,' using a collective singular for the people and a singular suffix likely referring to Zebulun as a tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 스불론은 기드론 주민들과 나할롤[a] 주민들을 쫓아내지 않았습니다. 그 결과 가나안 사람들은 그들 가운데 살았고, 강제 노역을 하게 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나할랄’로도 읽습니다. 영어 전통과 관련 본문에는 이 지명 형태가 보존되기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 집합적 단수 ‘가나안 사람’과 단수 접미사를 사용합니다. 이 단수 접미사는 스불론 지파를 하나의 집단으로 가리키는 것으로 보입니다.
    reason: source_note
lexical_decisions:
- source_word: הוֹרִישׁ
  english_pob_choice: drive out
  chosen_korean: 쫓아내다
  alternatives_korean:
  - 몰아내다
  - 내쫓다
  - 축출하다
  lexicon: HALOT
  rationale: 정복·정착 문맥에서 기존 주민을 거주지에서 제거하는 뜻을 자연스럽게 옮기며, 지나치게 기술적인 표현인 ‘축출하다’는 피했습니다.
- source_word: יוֹשְׁבֵי
  english_pob_choice: inhabitants of
  chosen_korean: 주민들
  alternatives_korean:
  - 거주자들
  - 사는 사람들
  - 거민들
  lexicon: HALOT
  rationale: תח지명 앞의 분사구는 해당 장소에 사는 사람들을 가리키므로, 현대 한국어에서는 ‘주민들’이 가장 간결하고 자연스럽습니다.
- source_word: נַהֲלֹל
  english_pob_choice: Nahalol
  chosen_korean: 나할롤
  alternatives_korean:
  - 나할랄
  lexicon: 번역 관례
  rationale: 히브리어 모음형을 반영해 ‘나할롤’로 옮기되, 전통적 영어형과의 대응 가능성은 본문 흐름에서 유지됩니다.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  english_pob_choice: the Canaanites lived among them
  chosen_korean: 가나안 사람들은 그들 가운데 살게 되었고
  alternatives_korean:
  - 가나안 사람들은 그들 가운데 살았습니다
  - 가나안 사람이 그들 가운데 살게 되었고
  lexicon: HALOT
  rationale: 히브리어는 집합적 단수 ‘가나안 사람’과 집합적 지시를 쓰지만, 한국어에서는 복수 집합을 드러내는 ‘가나안 사람들’이 문맥상 더 분명합니다.
- source_word: לָמַס
  english_pob_choice: forced labor
  chosen_korean: 강제 노역
  alternatives_korean:
  - 부역
  - 강제 노동
  - 노역
  lexicon: HALOT
  rationale: 단순한 세금이나 공물보다 강제성을 드러내는 의미이므로, 현대 독자가 이해하기 쉬운 ‘강제 노역’으로 옮겼습니다.
- source_word: וַיִּהְי֖וּ לָ/מַס
  english_pob_choice: became forced laborers
  chosen_korean: 강제 노역을 하게 되었습니다
  alternatives_korean:
  - 강제 노역에 종사하게 되었습니다
  - 강제 노역 대상이 되었습니다
  lexicon: HALOT
  rationale: 히브리어는 결과 상태를 나타내므로, ‘노역을 하게 되었습니다’로 옮겨 종속된 상태와 수행을 함께 드러냈습니다.
theological_decisions:
- issue: 집합적 단수 표현의 한국어 처리
  chosen_reading: ‘가나안 사람들은 그들 가운데 살게 되었고’로 집합적 의미를 복수 표현으로 풀어 옮겼습니다.
  alternative_readings:
  - ‘가나안 사람이 그들 가운데 살았고’
  - ‘가나안 사람이 그들 한가운데 살았고’
  rationale: 히브리어의 단수형은 민족/집단 전체를 가리키는 용법이므로, 한국어에서는 오해를 줄이기 위해 복수 집합으로 자연화했습니다.
  doctrine_reference: 번역 원칙 §6 (가독성 있는 현대어)
