revisions:
- from: 스불론은 기드론 주민들과 나할롤 주민들을 쫓아내지 않았습니다. 그래서 가나안 사람들은 그들 가운데 살게 되었고, 강제 노역을 하게 되었습니다.[a]
  to: 스불론은 기드론 주민들과 나할롤[a] 주민들을 쫓아내지 않았습니다. 그 결과 가나안 사람들은 그들 가운데 살았고, 강제 노역을 하게 되었습니다.[b]
  rationale: ‘살게 되었고’를 ‘살았고’로 고쳐 히브리어 וַיֵּשֶׁב의 단순 거주 서술을 보존했습니다. 강제 노역의 결과 상태는 유지했습니다. 또한 지명 이형과 집합적 단수에 관한 주석을 각각 관련 어구에 앵커로 연결하여 원문 및 영어 POB 감사 추적을 반영했습니다.
