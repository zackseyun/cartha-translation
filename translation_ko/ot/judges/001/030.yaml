  lexicon: HALOT
  rationale: 히브리어는 집합적 단수 ‘가나안 사람’과 집합적 지시를 쓰지만, 한국어에서는 복수 집합을 드러내는 ‘가나안 사람들’이 문맥상 더 분명합니다.
