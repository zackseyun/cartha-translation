  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
  footnotes:
  - marker: a
    text: Or 'the Shephelah' for 'the lowland,' the Judean foothill region between the hill country and the coastal plain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후 유다의 아들들이 산지와 네게브와 저지대에 거주하는 가나안 사람들과 싸우려고 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저지대’는 유다의 산지와 해안 평야 사이에 있는 유다 저지대(쉐펠라)를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  english_pob_choice: Afterward
  chosen_korean: 그 후
  alternatives_korean:
  - 이후
  - 그 뒤에
  lexicon: HALOT
  rationale: 시간의 순서를 나타내는 קשר사를 현대 한국어 서술에 자연스럽게 옮기면서도, 사건의 연속성을 유지했습니다.
- source_word: יָֽרְדוּ
  english_pob_choice: went down
  chosen_korean: 내려갔습니다
  alternatives_korean:
  - 갔습니다
  - 내려왔습니다
  lexicon: HALOT
  rationale: 히브리어의 물리적 하강 뉘앙스를 살려 단순한 ‘갔습니다’로 약화시키지 않았습니다.
- source_word: בְּנֵ֣י יְהוּדָ֔ה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다의 아들들
  alternatives_korean:
  - 유다 사람들
  - 유다 지파 사람들
  lexicon: HALOT
  rationale: 직역형을 유지해 혈연·지파 소속을 드러내되, 한국어에서 자연스럽게 읽히도록 구성했습니다.
- source_word: הַ/שְּׁפֵלָֽה
  english_pob_choice: the lowland
  chosen_korean: 저지대
  alternatives_korean:
  - 저지
  - 쉐펠라
  lexicon: HALOT
  rationale: 지리 용어의 의미를 풀어 옮겨 독자가 지역적 대비를 바로 이해하도록 했습니다.
theological_decisions:
- issue: 지명 목록의 범위 전달
  chosen_reading: 산지, 네게브, 저지대를 지리적 구역의 병렬 목록으로 보존했습니다.
  alternative_readings:
  - 산간지방, 남방, 평야
  - 산지와 남부와 낮은 곳
  rationale: 본문은 전쟁 대상의 지리적 범위를 나열하므로, 각 지역명을 과도하게 해석하지 않고 병렬 구조를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 본문 문맥상 지리·서술 문제이며 교리적 함의는 없습니다.
