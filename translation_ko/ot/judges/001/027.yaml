language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
  footnotes:
  - marker: a
    text: Hebrew 'its daughters,' meaning the smaller towns or settlements dependent on the main city.
    reason: cultural_note
  - marker: b
    text: Or 'the Canaanite was determined to dwell in this land.' The Hebrew verb can convey willingness or determination; the main text renders the contextual sense idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 므낫세는 벧스안과 그 딸 마을들[a], 다아낙과 그 딸 마을들, 돌의 주민들과 그 딸 마을들, 이블르암의 주민들과 그 딸 마을들, 므깃도의 주민들과 그 딸 마을들을 쫓아내지 못했습니다[b]. 그리고 가나안 사람들은 이 땅에 거주하는 것을 고집했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그 딸들’은 본성도시 아래에 딸린 소도시나 부속 정착지를 가리키는 관용 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘가나안 사람이 이 땅에 거주하기로 결심했습니다’로도 옮길 수 있습니다. 히브리어 동사는 의지나 결심의 뉘앙스를 가질 수 있어, 본문은 맥락상 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  english_pob_choice: did not dispossess
  chosen_korean: 쫓아내지 못했습니다
  alternatives_korean:
  - 몰아내지 못했습니다
  - 쫓아내어 소유를 빼앗지 못했습니다
  lexicon: HALOT
  rationale: 이 문맥의 הִפְעִיל형은 단순한 추방보다 그 땅의 점유권을 빼앗아 내쫓는 뜻이어서, 한국어에서는 간결하게 ‘쫓아내지 못했습니다’로 옮기되 ‘dispossess’의 실패라는 핵심을 살렸습니다.
- source_word: בְּנוֹתֶיהָ
  english_pob_choice: its daughter towns
  chosen_korean: 그 딸 마을들
  alternatives_korean:
  - 그 딸 성읍들
  - 부속 마을들
  - 위성 마을들
  lexicon: HALOT
  rationale: 직역상 ‘그 딸들’이라는 관용 표현을 살리면서, 본문의 상위 도시와 종속 정착지를 가리키는 뜻이 드러나도록 ‘마을들’을 붙였습니다.
- source_word: יוֹשְׁבֵי
  english_pob_choice: the inhabitants of
  chosen_korean: 주민들
  alternatives_korean:
  - 거주자들
  - 사는 사람들
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 특정 장소에 ‘사는 자들’이므로, 한국어에서는 자연스럽고 집단성을 드러내는 ‘주민들’로 옮겼습니다.
- source_word: וַיּוֹאֶל הַכְּנַעֲנִי לָשֶׁבֶת
  english_pob_choice: the Canaanites persisted in dwelling
  chosen_korean: 가나안 사람들은 이 땅에 거주하는 것을 고집했습니다
  alternatives_korean:
  - 가나안 사람들은 이 땅에 살기로 했습니다
  - 가나안 사람들은 이 땅에 머무르기로 뜻했습니다
  lexicon: HALOT
  rationale: וַיּוֹאֶל은 ‘기꺼이 하다/결심하다’에서 문맥상 ‘고집하다, 고수하다’의 뉘앙스를 가질 수 있어, 계속 거주하려는 태도를 드러내는 ‘고집했습니다’로 옮겼습니다.
theological_decisions:
- issue: 가나안 사람들의 계속 거주 의지 표현
  chosen_reading: ‘persisted in dwelling’의 서술적 의미를 따라, 도덕적 평가를 직접 삽입하지 않고 지속 의지를 드러내는 표현을 채택했습니다.
  alternative_readings:
  - ‘계속 살았습니다’
  - ‘그 땅에 머물기를 원했습니다’
  rationale: 히브리어 동사의 의미 범위가 ‘원하다/결심하다/고집하다’까지 가능하므로, 본문이 실제로 말하는 것은 그들의 지속적 거주 의지이지 후대적 해석을 단정하는 것이 아닙니다.
  doctrine_reference: 본문 문맥 주해
