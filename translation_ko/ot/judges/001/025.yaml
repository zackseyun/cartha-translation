translation:
  language: ko
  text: 그가 그들에게 성으로 들어가는 길을 보여 주었고[a], 그들은 칼날로 성을 쳤습니다[b]. 그러나 그들은 그 사람과 그의 온 집안을 놓아주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְבוֹא는 ‘들어감’, ‘입구’, 또는 ‘들어가는 길’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘칼의 입’은 ‘칼날로’라는 뜻입니다.
    reason: lexical_alternative
