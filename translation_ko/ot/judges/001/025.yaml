  lexicon: HALOT
  rationale: ראה의 사역적 의미를 따라 단순한 ‘보다’가 아니라 접근 경로를 알려 주는 뜻으로 옮겼습니다.
- source_word: מְבוֹא הָעִיר / the entrance to the city
  english_pob_choice: the entrance to the city
  chosen_korean: 성으로 들어가는 길
  alternatives_korean:
