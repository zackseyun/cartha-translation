base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
  footnotes:
  - marker: a
    text: 'Hebrew: ''with the mouth of the sword,'' an idiom meaning ''with the edge of the sword.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'all his household' or 'all his clan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 성으로 들어가는 길을 보여 주었고[a], 그들은 칼날로 성을 쳤습니다[b]. 그러나 그들은 그 사람과 그의 온 집안을 놓아주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘성의 입’이지만, 여기서는 ‘성으로 들어가는 길/입구’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘칼의 입’은 ‘칼날로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם / he showed them
  english_pob_choice: he showed them
  chosen_korean: 그들에게 … 길을 보여 주었고
  alternatives_korean:
  - 그들에게 …를 가르쳐 주었고
  - 그들에게 …를 보게 하였고
  lexicon: HALOT
  rationale: ראה의 사역적 의미를 따라 단순한 ‘보다’가 아니라 접근 경로를 알려 주는 뜻으로 옮겼습니다.
- source_word: מְבוֹא הָעִיר / the entrance to the city
  english_pob_choice: the entrance to the city
  chosen_korean: 성으로 들어가는 길
  alternatives_korean:
  - 성의 입구
  - 성으로 들어가는 입구
  lexicon: HALOT
  rationale: מְבוֹא는 단순한 문짝보다 진입로·들어가는 길의 의미가 살아 있어, 전투 상황에 맞게 자연스럽게 옮겼습니다.
- source_word: לְפִי חָרֶב / with the edge of the sword
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 끝으로
  - 검날로
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘칼의 입/날’의 이미지를 살리면서도, 한국어에서는 가장 자연스럽고 압축된 대응인 ‘칼날로’를 택했습니다.
- source_word: וְאֶת כָּל מִשְׁפַּחְתּוֹ / and all his family
  english_pob_choice: all his family
  chosen_korean: 그의 온 집안
  alternatives_korean:
  - 그의 모든 가족
  - 그의 온 가족
  - 그의 집안 전체
  lexicon: HALOT
  rationale: מִשְׁפָּחָה가 가족을 넘어 가문·가족 공동체를 넓게 가리킬 수 있으므로, 문맥에 맞는 넓은 의미를 담는 ‘온 집안’을 사용했습니다.
theological_decisions:
- issue: 학살을 나타내는 전투 동사의 강도
  chosen_reading: 그들은 칼날로 성을 쳤습니다
  alternative_readings:
  - 그들은 성을 공격했습니다
  - 그들은 성 사람들을 칼로 죽였습니다
  rationale: וַיַּכּוּ는 단순 공격보다 ‘치다/쳐부수다’의 강한 타격감을 주며, 뒤의 칼 관용구와 함께 전면적 살육의 문맥을 드러냅니다.
  doctrine_reference: 본문의 역사 서술을 약화시키지 않고 원문의 폭력성을 그대로 반영하는 번역 원칙
