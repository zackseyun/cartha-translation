  lexicon: HALOT
  rationale: 히브리어 관용구 ‘칼의 입/날’의 이미지를 살리면서도, 한국어에서는 가장 자연스럽고 압축된 대응인 ‘칼날로’를 택했습니다.
- source_word: וְאֶת כָּל מִשְׁפַּחְתּוֹ / and all his family
  english_pob_choice: all his family
  chosen_korean: 그의 온 집안
  alternatives_korean:
  - 그의 모든 가족
  - 그의 온 가족
  - 그의 집안 전체
  lexicon: HALOT
  rationale: מִשְׁפָּחָה가 가족을 넘어 가문·가족 공동체를 넓게 가리킬 수 있으므로, 문맥에 맞는 넓은 의미를 담는 ‘온 집안’을 사용했습니다.
