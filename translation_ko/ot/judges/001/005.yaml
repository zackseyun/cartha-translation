base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
  footnotes:
  - marker: a
    text: Adoni-bezek could be understood etymologically as 'lord of Bezek,' but here it is rendered as a personal name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 베섹에서 아도니베섹[a]을 찾았습니다. 그들은 그와 싸워 가나안 사람들과 브리스 사람들을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아도니베섹은 어원상 ‘베섹의 주인’으로도 이해할 수 있지만, 여기서는 인명으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  english_pob_choice: they found
  chosen_korean: 찾아냈습니다
  alternatives_korean:
  - 찾았습니다
  - 발견했습니다
  lexicon: HALOT
  rationale: 서사 진행의 단순한 ‘find’보다, 대상과 조우해 포착했다는 뉘앙스를 살리면서도 지나치게 해석하지 않는 표현입니다.
- source_word: אֲדֹנִי בֶזֶק
  english_pob_choice: Adoni-bezek
  chosen_korean: 아도니베섹
  alternatives_korean:
  - 베섹의 군주
  - 아도니-베섹
  lexicon: HALOT
  rationale: POB가 이를 인명으로 처리하므로 음역을 따르되, ‘베섹의 군주’라는 어원적 해석은 본문 주해를 흔들 수 있어 본문에는 넣지 않았습니다.
- source_word: וַיַּכּוּ
  english_pob_choice: struck down
  chosen_korean: 쳐부수었습니다
  alternatives_korean:
  - 쳐서 쓰러뜨렸습니다
  - 격파했습니다
  - 쳤습니다
  lexicon: HALOT
  rationale: 군사적 문맥에서 단순한 ‘치다’보다 패배와 제압을 분명히 드러내는 말로, ‘struck down’의 강도를 자연스럽게 옮겼습니다.
- source_word: הַכְּנַעֲנִי / הַפְּרִזִּי
  english_pob_choice: the Canaanites / the Perizzites
  chosen_korean: 가나안 사람들 / 브리스 사람들
  alternatives_korean:
  - 가나안 족속 / 브리스 족속
  - 가나안인들 / 브리스인들
  lexicon: HALOT
  rationale: 집단적 민족명으로 기능하므로 복수로 옮겼고, ‘브리스’는 표준적인 음역 관행을 따랐습니다.
