  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
  footnotes:
  - marker: a
    text: Or, more literally, 'the Amorite pressed the sons of Dan toward the hill country, for he did not allow him to go down to the valley.' The Hebrew uses collective singular forms for the people group, while the sense in context is plural.
    reason: lexical_alternative
translation:
  language: ko
  text: 아모리 사람이 단 자손을 산지로 밀어붙였습니다[a]. 그들이 골짜기로 내려가도록 허락하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 아모리 사람을 집단 단수처럼, 단 자손을 집단 전체처럼 표현합니다. 문맥상 의미는 복수입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  english_pob_choice: pressed ... back
  chosen_korean: 밀어붙였습니다
  alternatives_korean:
  - 압박했습니다
  - 몰아붙였습니다
  - 밀어냈습니다
  lexicon: HALOT
  rationale: לָחַץ는 압박하거나 강제로 몰아넣는 뜻이므로, 산지 쪽으로 몰린 상황을 자연스럽게 드러내는 ‘밀어붙였습니다’가 가장 잘 맞습니다.
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람
  alternatives_korean:
  - 아모리 족속
  - 아모리인
  lexicon: HALOT
  rationale: 히브리어는 단수형처럼 보이지만 집단 명칭으로 쓰이므로, 한국어에서는 집단성을 살린 ‘아모리 사람’으로 옮겼습니다.
- source_word: בְּנֵי דָן
  english_pob_choice: the sons of Dan
  chosen_korean: 단 자손
  alternatives_korean:
  - 단 사람들
  - 단 지파
  lexicon: HALOT
  rationale: 직역에 가까운 가족·지파 표현을 유지해 원문 구조를 보존했습니다. ‘단 지파’는 의미상 가능하지만 본문의 표현을 덜 직접적으로 반영합니다.
- source_word: הָהָרָה
  english_pob_choice: into the hill country
  chosen_korean: 산지로
  alternatives_korean:
  - 산악지대로
  - 산으로
  - 산지 쪽으로
  lexicon: HALOT
  rationale: 방향성 있는 이동을 나타내므로 ‘산지로’가 간결하고, 뒤의 ‘골짜기’와의 지리적 대조도 분명하게 살립니다.
theological_decisions:
- issue: 집단 단수 형태와 한국어 복수 처리
  chosen_reading: 아모리 사람이 단 자손을... 그들이... 허락하지 않았기 때문입니다
  alternative_readings:
  - 아모리 사람이... 그가... 허락하지 않았기 때문입니다
  - 아모리 사람들이... 그들이...
  rationale: 히브리어는 집단을 단수형으로도 묘사하지만, 문맥의 의미는 복수적 집단 행동입니다. 한국어에서는 독자가 자연스럽게 이해하도록 집단 의미를 드러내되, 단수/복수의 원문 긴장은 주석 없이 과도하게 흐리지 않았습니다.
  doctrine_reference: source-language syntax and collective singular usage
