  source_fidelity: ‘아모리 사람’과 ‘단 자손’은 문맥상 각각 집단을 가리키며, 산지와 골짜기의 지형적 대조 및 내려가는 이동은 잘 반영되어야 합니다. 초안의 의미는 대체로 맞지만, 단수형 ‘아모리 사람’ 뒤에 복수 대명사 ‘그들이’를 쓰면 한국어에서 수 일치와 지시 대상이 다소 불안정합니다. 후반부의 허락 행위가 아모리 사람들에게, 내려가는 행위가 단 자손들에게 속함을 명시하는 편이 안전합니다.
  naturalness: ‘단 자손’은 직역적이지만 본문 문체 안에서 이해 가능합니다. 다만 두 집단이 모두 복수적 의미를 지니는 상황에서 대명사만으로 이어지면 자연스럽지 않고 모호해질 수 있습니다. 집단적 복수로 자연스럽게 표기하고 후반절에서 양측을 반복해 밝혔습니다.
  terminology: ‘아모리 사람들’, ‘단 자손들’, ‘산지’, ‘골짜기’는 현대 한국어의 격식 있는 성경 번역 문체에 적합하며 원문의 민족명·지파 표현과 지형 대조를 유지합니다. 주석은 히브리어의 관련 단수형을 정확히 한정하여 설명하도록 고쳤습니다.
