  source_fidelity: 히브리어의 집단 단수는 복수의 집단 의미로 적절히 옮겼고, '살다', '가운데', '그 땅의 주민', '쫓아내다'도 본문의 의미를 잘 반영합니다. 다만 두 번째 문장의 연속된 대명사('그들이 그들을')는 한국어에서 지시 대상이 불필요하게 흐려질 수 있습니다.
