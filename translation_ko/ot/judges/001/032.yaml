  edition: WLC
  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
  footnotes:
  - marker: a
    text: 'Hebrew literally uses collective singular forms: ''the Asherite ... the Canaanite ... he did not dispossess him.'' The English renders the intended collective sense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 아셀 사람들은 그 땅의 주민인 가나안 사람들 가운데서 살았습니다. 이는 그들이 그들을 쫓아내지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 지파와 민족을 단수형으로 말하지만, 문맥상 집단 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: ישׁב는 ‘앉다/거주하다/살다’의 뜻이 있으며, 여기서는 집단의 거주 상태를 자연스러운 현대 한국어로 옮겨 ‘살았습니다’가 가장 적절합니다.
- source_word: הָאָשֵׁרִי
  english_pob_choice: the Asherites
  chosen_korean: 아셀 사람들은
  alternatives_korean:
  - 아셀 지파는
  - 아셀은
  lexicon: HALOT
  rationale: 히브리어의 관사 붙은 단수 친족형이 집단 전체를 가리키므로, 문맥에 맞게 지파 집단을 나타내는 ‘아셀 사람들’로 옮겼습니다.
- source_word: בְּקֶרֶב
  english_pob_choice: among
  chosen_korean: 가운데서
  alternatives_korean:
  - 중에
  - 한복판에서
  lexicon: HALOT
  rationale: בְּקֶרֶב은 어떤 집단 ‘한가운데/사이에 있음’을 나타내므로, 한국어에서는 ‘가운데서’가 가장 자연스럽고 의미도 분명합니다.
- source_word: יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: the inhabitants of the land
  chosen_korean: 그 땅의 주민인
  alternatives_korean:
  - 그 땅에 사는
  - 그 땅의 거주자들인
  lexicon: HALOT
  rationale: 분사구가 앞의 ‘가나안 사람들’을 동격으로 풀어 설명하므로, 관계를 살려 ‘그 땅의 주민인’으로 옮겼습니다.
- source_word: לֹא הוֹרִישׁוֹ
  english_pob_choice: they did not drive them out
  chosen_korean: 그들을 쫓아내지 않았기 때문입니다
  alternatives_korean:
  - 그들을 몰아내지 않았기 때문입니다
  - 그들을 내쫓지 않았기 때문입니다
  lexicon: HALOT
  rationale: הוריש는 이 문맥에서 단순한 ‘물려주다’가 아니라 거주민을 ‘몰아내다/쫓아내다’는 뜻이므로, 재앙처럼 생긴 정복 문맥을 반영해 ‘쫓아내지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 집단 단수 표현
  chosen_reading: ‘아셀 사람들’과 ‘가나안 사람들’로 집단 의미를 살려 자연스럽게 옮겼습니다.
  alternative_readings:
  - ‘아셀이 가나안 사람 가운데 살았습니다’처럼 단수형을 더 직접 반영하는 번역
  rationale: 히브리어는 민족·지파를 단수 형태로 말하지만, 실제 의미는 집단 전체입니다. 한국어에서 이를 단수로 두면 한 개인처럼 오해될 수 있어, 문맥의 집단 의미를 분명히 했습니다.
  doctrine_reference: '번역 원리: 최적 대응(집단적 문맥 보존)'
