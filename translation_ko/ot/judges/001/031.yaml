  terminology: 악고·시돈·악십·헬바·르홉은 적절합니다. 한국어 성경 지명 관례와 히브리어 음역에 맞추어 אַחְלָב와 אֲפִיק은 ‘아할랍’과 ‘아빅’으로 쓰는 것이 더 적절합니다.
