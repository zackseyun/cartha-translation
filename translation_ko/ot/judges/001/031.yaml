source:
  edition: WLC
  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
  footnotes:
  - marker: a
    text: Or 'did not dispossess' or 'did not expel.' The Hebrew verb refers to removing prior occupants from possession of the land.
    reason: lexical_alternative
  - marker: b
    text: Acco is the ancient coastal city later known as Acre.
    reason: cultural_note
translation:
  language: ko
  text: 아셀은 악고의 주민들과 시돈의 주민들, 아흘랍과 악십과 헬바와 아벡과 르홉의 주민들을 쫓아내지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쫓아내다’는 이 동사의 정복 문맥을 현대 한국어로 풀어 옮긴 것입니다. 문자적으로는 ‘소유에서 몰아내다/축출하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 악고는 고대 해안 도시로, 후대에는 아크레로 알려졌습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  english_pob_choice: did not drive out
  chosen_korean: 쫓아내지 못했습니다
  alternatives_korean:
  - 몰아내지 못했습니다
  - 축출하지 못했습니다
  - 내쫓지 못했습니다
  lexicon: HALOT
  rationale: 정복 문맥의 הוֹרִישׁ는 단순한 이동이 아니라 기존 거주자를 거주지에서 제거하는 뜻이므로, 현대 한국어에서는 ‘쫓아내다’가 가장 자연스럽고 의미도 가깝습니다.
- source_word: יֹשְׁבֵי
  english_pob_choice: the inhabitants of
  chosen_korean: 주민들
  alternatives_korean:
  - 거주자들
  - 사는 사람들
  - 거민들
  lexicon: HALOT
  rationale: ‘거주하는 이들’의 집합적 의미를 살리면서도 지명 나열문에서 자연스럽게 읽히는 표현으로 ‘주민들’을 택했습니다.
- source_word: עַכּוֹ
  english_pob_choice: Acco
  chosen_korean: 악고
  alternatives_korean:
  - 아코
  - 악코
  - 아크레
  lexicon: HALOT
  rationale: 고유지명은 음역으로 옮기되, 한국어 성경에서 통용 가능한 현대 음역형을 사용했습니다. later city name인 ‘아크레’는 본문의 고대 지명에 맞지 않습니다.
- source_word: צִידוֹן
  english_pob_choice: Sidon
  chosen_korean: 시돈
  alternatives_korean:
  - 시돈 도시
  - 시돈 지역
  lexicon: HALOT
  rationale: 널리 정착된 성경 지명 음역을 따랐습니다.
- source_word: חֶלְבָּה
  english_pob_choice: Helbah
  chosen_korean: 헬바
  alternatives_korean:
  - 헬바흐
  - 헤르바
  lexicon: HALOT
  rationale: 히브리어 자음형에 따라 음역했으며, 영어 POB의 설명처럼 같은 지명의 전통적 변이형보다 이 본문의 형태를 우선했습니다.
theological_decisions:
- issue: 부정문 뒤의 열거 연결
  chosen_reading: ‘쫓아내지 못했습니다’로 시작해 지명들을 쉼표로 나열했습니다.
  alternative_readings:
  - ‘쫓아내지 않았습니다’
  - ‘쫓아내지 못하고…’
  rationale: 본문의 핵심은 아셀 지파의 미이행/실패를 진술하는 것이므로, 능력·결과의 부재를 드러내는 표현이 원문의 서술 효과를 가장 잘 반영합니다.
  doctrine_reference: 수 13–19 및 삿 1의 정복/불완전 점유 서술
- issue: 지명 나열의 처리
  chosen_reading: 모든 지명을 고유명사로 유지해 역사·지리적 구체성을 보존했습니다.
  alternative_readings:
  - 일부를 통칭 지명으로 풀어쓰기
  - 현대 지명으로 환치
  rationale: 본문은 특정 도시들의 열거를 통해 아셀 지파의 미정복 영역을 보여주므로, 지명 자체를 보존하는 것이 서술 의도에 충실합니다.
  doctrine_reference: 구약 역사서의 지리적-서사적 진술
