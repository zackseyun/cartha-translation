  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
  footnotes:
  - marker: a
    text: Or "the three descendants of Anak" or "the three Anakites." The Hebrew says "sons of Anak," which may refer to clan descent rather than immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모세가 말한 대로 헤브론을 갈렙에게 주었고, 그는 거기서 아낙의 세 아들을 쫓아냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아낙의 세 후손”이나 “아낙 족속의 세 사람”일 수 있습니다. 히브리어는 “아낙의 아들들”이라고 하며, 이는 직계 아들보다 족속 계승을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  english_pob_choice: They gave Hebron to Caleb
  chosen_korean: 헤브론을 갈렙에게 주었고
  alternatives_korean:
  - 헤브론을 갈렙에게 넘겨주었고
  - 헤브론을 갈렙에게 주었고
  lexicon: HALOT
  rationale: נתן의 서술형 완료 의미를 자연스러운 합쇼체로 옮기되, 단순 전달 행위를 분명히 하기 위해 ‘주다’를 기본으로 삼았습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  english_pob_choice: as Moses had said
  chosen_korean: 모세가 말한 대로
  alternatives_korean:
  - 모세가 말한 것처럼
  - 모세가 말했듯이
  lexicon: HALOT
  rationale: כַּאֲשֶׁר의 비교/준거 의미를 살려 ‘-한 대로’로 옮겼고, דִּבֶּר는 강한 ‘약속하다’보다 기본 의미인 ‘말하다’를 유지했습니다.
- source_word: וַיּוֹרֶשׁ
  english_pob_choice: he drove out
  chosen_korean: 쫓아냈습니다
  alternatives_korean:
  - 몰아냈습니다
  - 축출했습니다
  - 그곳을 차지했습니다
  lexicon: HALOT
  rationale: 히필 ירש는 점유를 위해 내쫓는 의미가 문맥상 분명하므로, 현대 한국어에서 직관적인 ‘쫓아내다’로 번역했습니다.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  english_pob_choice: the three sons of Anak
  chosen_korean: 아낙의 세 아들
  alternatives_korean:
  - 아낙의 세 후손
  - 아낙 족속의 세 사람
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’ 형식을 그대로 살리되, 족속/후손 가능성은 본문 각주로 남겨 해석의 여지를 보존했습니다.
theological_decisions:
- issue: יָרַשׁ/וַיּוֹרֶשׁ의 전투-점유 의미
  chosen_reading: ‘쫓아냈습니다’로 옮겨, 단순한 상속이 아니라 그 땅을 차지하기 위한 추방 행위를 드러냈습니다.
  alternative_readings:
  - ‘차지했습니다’
  - ‘점유하게 했습니다’
  rationale: 이 절은 헤브론의 수여와 함께 그곳 거주자 축출을 말하므로, 문맥상 전투적 추방 의미를 살리는 것이 더 정확합니다.
  doctrine_reference: 문맥 우선 번역 원칙
