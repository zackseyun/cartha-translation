translation:
  language: ko
  text: 에브라임은 게셀에 사는 가나안 사람들을 몰아내지 않았습니다. 그리고 가나안 사람들은 게셀에서 그들 가운데 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 가운데’입니다. 여기서 단수 대명사는 에브라임 지파 전체를 가리키므로, 한국어에서는 집합적 의미를 살려 ‘그들 가운데’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  english_pob_choice: drive out
  chosen_korean: 몰아내지 않았습니다
  alternatives_korean:
  - 쫓아내지 않았습니다
  - 내쫓지 않았습니다
  - 축출하지 않았습니다
  lexicon: HALOT
  rationale: 정복 문맥에서 주민을 거주지에서 제거하지 못했다는 뜻을 자연스럽게 살리면서도, ‘dispossess’처럼 기술적이거나 ‘축출하다’처럼 딱딱한 표현은 피했습니다.
- source_word: הַכְּנַעֲנִי
  english_pob_choice: the Canaanites
  chosen_korean: 가나안 사람들
  alternatives_korean:
  - 가나안 족속
  - 가나안인
  lexicon: HALOT
  rationale: 히브리어는 형태상 단수지만 집합적으로 쓰였으므로, 한국어에서는 사람 집단으로 자연스럽게 풀어 ‘가나안 사람들’로 옮겼습니다.
- source_word: בְּגָזֶר
  english_pob_choice: in Gezer
  chosen_korean: 게셀에
  alternatives_korean:
  - 게셀에서
  - 게셀 안에
  lexicon: HALOT
  rationale: 거주 위치를 나타내는 מקום 표현이므로, 도시 안에 거주함을 가장 자연스럽게 드러내는 ‘게셀에’로 옮겼습니다.
- source_word: בְּקִרְבּוֹ
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 한복판에
  - 그 안에
  - 그 가운데
  lexicon: HALOT
  rationale: 직역하면 ‘그의 가운데’이지만, 여기서 단수 접미사는 에브라임 지파 전체를 가리키므로 한국어에서는 집합적 의미를 살려 ‘그들 가운데’로 옮겼습니다.
theological_decisions:
- issue: 에브라임 지파를 단수 대명사로 받는 표현
  chosen_reading: ‘그들 가운데’로 풀어, 지파 전체를 하나의 집단으로 본 히브리어의 집합적 시각을 드러냈습니다.
  alternative_readings:
  - ‘그 가운데’
  - ‘그 안에’
  rationale: 히브리어의 단수 소유격은 에브라임을 공동체 단위로 지칭합니다. 한국어에서 이를 그대로 단수로 남기면 의미가 모호해질 수 있어, 집합적 의미를 살려 번역했습니다.
  doctrine_reference: 문법·담화 관찰
