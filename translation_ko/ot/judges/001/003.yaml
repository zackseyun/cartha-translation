  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
  footnotes:
  - marker: a
    text: Hebrew 'my lot' and 'your lot'; that is, the territory assigned by lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 자기 형제인 시므온에게 말했습니다. “나와 함께 내가 제비로 받은 땅으로 올라가 가나안 사람들과 싸웁시다. 나도 시므온과 함께 시므온이 제비로 받은 땅으로 가겠습니다.” 그래서 시므온이 유다와 함께 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 제비’와 ‘네 제비’는 제비로 배정된 각 지파의 영토를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁמְעוֹן אָחִיו
  english_pob_choice: to Simeon his brother
  chosen_korean: 그의 형제 시므온에게
  alternatives_korean:
  - 시므온에게, 그의 형제에게
  - 형제 시므온에게
  lexicon: HALOT
  rationale: 히브리어의 직접 호칭 구조를 살리되, 한국어에서는 ‘그의 형제 시므온’보다 ‘그의 형제 시므온에게’가 더 자연스럽고, 부족 간 혈연 관계도 함께 드러냅니다.
- source_word: בְּגוֹרָלִי / בְּגוֹרָלֶךָ
  english_pob_choice: into my allotted territory / into your allotted territory
  chosen_korean: 내 몫으로 / 네 몫으로
  alternatives_korean:
  - 내가 받은 땅으로 / 네가 받은 땅으로
  - 내가 분배받은 몫으로 / 네가 분배받은 몫으로
  lexicon: HALOT
  rationale: גּוֹרָל은 문자적으로 ‘제비, 몫’이지만 이 절에서는 제비로 배당된 지파의 영역을 가리키므로, ‘몫’으로 옮겨 배당의 개념을 간결하게 살렸습니다.
- source_word: עֲלֵה אִתִּי
  english_pob_choice: Come up with me
  chosen_korean: 나와 함께 올라와서
  alternatives_korean:
  - 함께 올라가자
  - 나와 같이 올라오라
  lexicon: HALOT
  rationale: עלה의 상향 이동 이미지를 유지하되, 한국어 대화체에서는 초청·동행의 뉘앙스를 ‘나와 함께 올라와서’로 자연스럽게 전달합니다.
- source_word: וְנִלָּחֲמָה בַּכְּנַעֲנִי
  english_pob_choice: and let us fight against the Canaanites
  chosen_korean: 가나안 사람들과 싸우자
  alternatives_korean:
  - 가나안 사람들을 치자
  - 가나안 사람들과 전쟁하자
  lexicon: HALOT
  rationale: cohortative의 공동 결단을 한국어 명령 제안형 ‘싸우자’로 옮겼고, בַּ를 전투 상대를 나타내는 ‘-와/-들과’로 자연스럽게 반영했습니다.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  english_pob_choice: So Simeon went with him
  chosen_korean: 그래서 시므온이 그와 함께 갔습니다
  alternatives_korean:
  - 그리고 시므온이 그와 함께 갔습니다
  - 시므온이 그와 함께 갔습니다
  lexicon: HALOT
  rationale: 서사 진행의 결과를 드러내는 결론으로 ‘그래서’를 사용해 앞선 약속에 대한 응답임을 자연스럽게 보여 줍니다.
