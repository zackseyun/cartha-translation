revisions:
- from: 유다가 그의 형제 시므온에게 말했습니다. 「내 몫으로 올라와서 가나안 사람들과 싸우자. 그러면 나도 너와 함께 네 몫으로 가겠다」. 그래서 시므온이 그와 함께 갔습니다.[a]
  to: 유다가 자기 형제인 시므온에게 말했습니다. “나와 함께 내가 제비로 받은 땅으로 올라가 가나안 사람들과 싸웁시다. 나도 시므온과 함께 시므온이 제비로 받은 땅으로 가겠습니다.” 그래서 시므온이 유다와 함께 갔습니다.[a]
  rationale: 원문의 이동 목적지와 상호 지원 약속을 정확히 반영하도록 ‘몫’을 ‘제비로 받은 땅’으로 명료화하고, 원문에 없는 조건 관계를 제거했습니다. 인물 반복은 한국어에서 2인칭 대명사를 피하면서도 소유 관계를 명확히 하기 위한 것입니다.
