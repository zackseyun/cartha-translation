translation:
  language: ko
  text: 야훼께서 말씀하셨습니다. “유다가 올라가야 합니다. 보십시오, 내가 이 땅을 유다의 손에 넘겨주었습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 원문 고유명사 יהוה는 본 프로젝트 기본값에 따라 야훼로 옮겨, 일반적인 호칭인 주님과 구별했습니다.
- source_word: יְהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유대
  - 유다 지파
  lexicon: Judah
  rationale: 지명/인명으로서의 유다를 간단히 옮겼고, 문맥상 지파를 가리키는 의미는 동사와 함께 자연스럽게 드러납니다.
- source_word: יַעֲלֶה
  english_pob_choice: shall go up
  chosen_korean: 올라가야 합니다
  alternatives_korean:
  - 올라갈 것입니다
  - 올라가십시오
  lexicon: עלה
  rationale: 미래적 명령/지시의 뉘앙스를 살려 단순 미래보다 지시적 의미가 분명한 표현으로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: הִנֵּה
  rationale: POB의 'Look'을 반영하되, 현대 한국어에서 자연스러운 주의 환기 표현으로 '보십시오'를 택했습니다.
- source_word: נָתַתִּי ... בְּיָדֹו
  english_pob_choice: I have given ... into his hand
  chosen_korean: 내가 이 땅을 그의 손에 넘겨 주었습니다
  alternatives_korean:
  - 내가 이 땅을 그의 손에 주었습니다
  - 내가 이 땅을 그의 손아래 두었습니다
  lexicon: נתן + יד
  rationale: 히브리어 관용구 '손에 주다'를 한국어에서 의미가 분명한 '손에 넘겨 주다'로 옮겨 점유·승리를 암시하는 강한 뜻을 살렸습니다.
theological_decisions:
- issue: 야훼의 직접 발화에서의 한국어 높임말 처리
  chosen_reading: 서술문은 합쇼체로 유지하되, 하나님을 직접 높여 말하는 문맥이므로 '말씀하셨습니다'를 사용했습니다.
  alternative_readings:
  - 말하셨습니다
  - 말씀하셨다
  rationale: 내러티브는 현대 문어체를 유지하되, 하나님 발화의 위엄을 한국어 높임말로 반영했습니다.
  doctrine_reference: divine speech register
- issue: '''the land into his hand''의 전쟁/정복 함의'
  chosen_reading: '''이 땅을 그의 손에 넘겨 주었습니다''로 번역해 소유 이전과 승리의 함의를 드러냈습니다.'
  alternative_readings:
  - 이 땅을 그의 손에 주었습니다
  - 이 땅을 그의 수중에 주었습니다
  rationale: 원문은 단순한 인도보다 정복과 수여를 함께 내포하므로, 한국어에서도 그 힘을 약화시키지 않았습니다.
  doctrine_reference: narrative conquest semantics
