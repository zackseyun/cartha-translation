id: JDG.1.11
reference: Judges 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֔ם אֶל יוֹשְׁבֵ֖י דְּבִ֑יר וְ/שֵׁם דְּבִ֥יר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
  footnotes:
  - marker: a
    text: Or 'to the inhabitants of Debir.' The Hebrew preposition can be rendered more literally as 'to/toward,' but here it introduces a hostile movement in a conquest narrative, hence 'against.'
    reason: lexical_alternative
  - marker: b
    text: Kiriath-sepher is the earlier name of Debir; the name may mean 'City of the Book' or 'City of Scribe(s),' but the place name is transliterated in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 그는 드빌 주민들을 치러 나아갔습니다[a]. (드빌의 옛 이름은 기럇세벨이었습니다[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드빌 주민들에게’ 또는 ‘드빌 주민들을 향해.’ 히브리어 전치사 אֶל은 더 문자적으로 ‘~에게’ 또는 ‘~을 향해’라는 뜻이지만, 여기서는 정복 서술의 문맥에서 그들을 치러 가는 적대적 진군을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 기럇세벨은 드빌의 이전 이름입니다. 이 이름은 ‘책의 성읍’ 또는 ‘서기관들의 성읍’이라는 뜻일 수 있지만, 본문에서는 지명으로 음역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  english_pob_choice: From there he went
  chosen_korean: 그곳에서 그는 ... 나아갔습니다
  alternatives_korean:
  - 그곳에서 그는 갔습니다
  - 그곳에서 그는 진군했습니다
  lexicon: HALOT
  rationale: 단순한 이동을 나타내는 הלך을 기본적으로 살리되, 전투적 문맥에서의 방향성을 반영해 너무 군사적으로 과장되지 않는 ‘나아가다’로 옮겼습니다.
- source_word: אֶל יוֹשְׁבֵי
  english_pob_choice: against the inhabitants of
  chosen_korean: 드빌의 주민들에게로
  alternatives_korean:
  - 드빌의 주민들을 향해
  - 드빌의 거주자들에게
  lexicon: HALOT
  rationale: אֶל의 기본값은 ‘~에게/~을 향해’이지만, 본문이 정복 서술이므로 한국어에서는 대상을 향한 공격적 진로를 담되 ‘against’를 직역하지 않고 자연스럽게 표현했습니다.
- source_word: דְּבִיר
  english_pob_choice: Debir
  chosen_korean: 드빌
  alternatives_korean:
  - 데빗
  - 데비르
  lexicon: Korean transliteration
  rationale: 지명은 현대 외래어 표기 관행에 따라 ‘드빌’로 음역했습니다.
- source_word: וְשֵׁם דְּבִיר לְפָנִים קִרְיַת סֵפֶר
  english_pob_choice: The former name of Debir was Kiriath-sepher.
  chosen_korean: 드빌의 옛 이름은 기럇세벨이었습니다
  alternatives_korean:
  - 드빌은 옛날에 기럇세벨이라 불렸습니다
  - 드빌의 이전 이름은 기럇세벨이었습니다
  lexicon: HALOT
  rationale: לְפָנִים을 ‘옛/이전’으로 풀어 이름의 변경을 분명히 했고, 고유지명 קִרְיַת סֵפֶר은 주석 처리 없이 본문에서 음역해 토포님으로 보존했습니다.
theological_decisions:
- issue: 전투 문맥에서 אֶל의 방향성
  chosen_reading: 직역 가능한 ‘~에게’보다 한국어의 서술 자연성을 살려 ‘~에게로 나아갔습니다’로 번역했습니다.
  alternative_readings:
  - 드빌 주민들을 향해 갔습니다
  - 드빌 주민들에게 갔습니다
  rationale: 이 구절은 평범한 이동이 아니라 정복 서술의 진행을 나타내므로, 원문의 적대적 진행을 약화시키지 않으면서도 한국어 문장으로는 과장 없이 전달하는 것이 적절합니다.
  doctrine_reference: 서사 본문의 행위 방향성 보존
- issue: 기럇세벨의 의미를 본문에 풀지 않음
  chosen_reading: 지명은 본문에서 음역만 하고 어원적 뜻은 주석에만 둘 수 있게 했습니다.
  alternative_readings:
  - ‘책의 성읍’으로 번역
  - ‘서기관의 성읍’으로 번역
  rationale: 본문은 장소의 옛 이름을 알려 주는 기능이 중심이므로, 어원 해석을 본문에 넣기보다 음역으로 보존하는 편이 서사 흐름과 지명 기능을 더 잘 유지합니다.
  doctrine_reference: 고유명사 보존 원칙
