  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
  footnotes:
  - marker: a
    text: Hebrew 'the sons of Israel'; many English versions have 'the Israelites.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Canaanite' is singular in form but collective in sense; thus 'the Canaanites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 죽은 뒤에 이런 일이 있었습니다. 이스라엘 자손이 야훼께 여쭈었습니다. “누가 우리를 위하여 먼저 가나안 사람들[a]을 맞서 싸우러 올라가겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘가나안 사람’은 형태는 단수이지만 집합적인 뜻으로 쓰였으므로, 여기서는 ‘가나안 사람들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  english_pob_choice: And it happened after the death of Joshua
  chosen_korean: 여호수아가 죽은 뒤에
  alternatives_korean:
  - 그리고 여호수아의 죽음 뒤에
  - 여호수아가 죽은 후에
  lexicon: HALOT
  rationale: 새 사건을 여는 הזמן 표현을 한국어 자연문으로 옮기되, ‘뒤에’로 אחרי의 시간적 선행 관계를 간결하게 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 남성 복수의 직역 가능성을 유지하면서도 한국어 성경 어법에서 자연스러운 ‘자손’을 택했습니다.
- source_word: בַּיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: DOCTRINE.md Contested terms
  rationale: 원문의 신명문을 보존하기 위해 ‘야훼’를 사용하고, שאל의 목적어로서 조사 ‘께’를 붙였습니다.
- source_word: וַיִּשְׁאֲלוּ ... לֵאמֹר
  english_pob_choice: asked ... saying
  chosen_korean: 여쭈어 말했습니다
  alternatives_korean:
  - 물어 말했습니다
  - 여쭈며 말했습니다
  lexicon: HALOT
  rationale: 여호와께 드리는 문의라는 문맥을 반영해 단순 ‘묻다’보다 공손하고 문맥상 적절한 ‘여쭈다’를 택했습니다.
- source_word: מִי יַעֲלֶה לָּנוּ אֶל הַכְּנַעֲנִי
  english_pob_choice: Who will go up for us first against the Canaanites
  chosen_korean: 누가 우리를 위해 먼저 올라가 가나안 사람들과
  alternatives_korean:
  - 누가 우리를 위해 먼저 올라가 가나안 사람들을
  - 누가 우리를 위해 가나안 사람들에게 올라가
  lexicon: HALOT
  rationale: ‘올라가다’는 전투적 진군을 살리고, ‘가나안 사람들’로 집합적 의미를 한국어 복수로 자연스럽게 드러냈습니다.
- source_word: לְהִלָּחֶם בּוֹ
  english_pob_choice: to fight against them
  chosen_korean: 싸우겠습니까?
  alternatives_korean:
  - 그들과 싸우겠습니까?
  - 그들을 치겠습니까?
  lexicon: HALOT
  rationale: 문맥상 목적이 이미 앞절의 ‘가나안 사람들’에 의해 분명하므로, 한국어에서는 종결부를 간결하게 처리했습니다.
theological_decisions:
- issue: YHWH 신명 처리
  chosen_reading: 야훼
  alternative_readings:
