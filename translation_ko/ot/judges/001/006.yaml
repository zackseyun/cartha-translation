  - marker: a
    text: Hebrew literally, 'the thumbs of his hands and his feet,' that is, his thumbs and big toes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아도니-베섹은 도망쳤고[a], 그들은 그를 추격하여 붙잡은 뒤 그의 손가락과 발가락을 잘라 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '그의 손의 엄지와 그의 발의 엄지'를 뜻합니다. 즉, 그의 엄지손가락과 엄지발가락입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  english_pob_choice: fled
  chosen_korean: 도망쳤고
  alternatives_korean:
  - 달아났고
  - 피했지만
  lexicon: HALOT
  rationale: 히브리어 נוּס의 서술형 전개를 자연스러운 서사체로 살리면서도, 뒤이어 포로가 되는 상황과 맞물리도록 '도망쳤고'로 옮겼습니다.
- source_word: אֲדֹנִי בֶזֶק
  english_pob_choice: Adoni-bezek
  chosen_korean: 아도니-베섹
  alternatives_korean:
  - 베섹의 주인
  - 아도니베섹
  lexicon: HALOT
  rationale: 문맥상 고유명사로 기능하므로 뜻풀이보다 음역을 따랐고, 하이픈은 영어 POB의 이름 표기를 반영해 식별성을 높였습니다.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו וַיֹּאחֲזוּ אֹתוֹ
  english_pob_choice: they pursued him, seized him
  chosen_korean: 그들은 그를 추격하여 붙잡은 뒤
  alternatives_korean:
  - 그들은 그의 뒤를 쫓아 붙잡았고
  - 그들은 그를 쫓아가 붙들었고
  lexicon: HALOT
  rationale: רדף + אַחַר와 אחז의 연속 동작을 한국어 서사에서 가장 자연스럽게 이어 주는 '추격하여 붙잡은 뒤'로 옮겨, 포획의 강도를 보존했습니다.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  english_pob_choice: his thumbs and big toes
  chosen_korean: 그의 손가락과 발가락
  alternatives_korean:
  - 그의 엄지손가락과 엄지발가락
  - 그의 손의 엄지와 발의 엄지
  lexicon: HALOT
  rationale: 히브리어는 손과 발의 בֹּהֶן을 가리키지만, 한국어에서는 '엄지손가락/엄지발가락'보다 의미가 넓은 '손가락과 발가락'이 본문이 전달하려는 신체 훼손의 핵심을 간결하게 드러냅니다.
