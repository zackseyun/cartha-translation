    text: 히브리어는 문자적으로 '그의 손들의 엄지들과 그의 발들의 엄지들'이라고 합니다. 곧 그의 엄지손가락과 엄지발가락을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
