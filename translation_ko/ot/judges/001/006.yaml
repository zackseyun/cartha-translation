  english_pob_choice: his thumbs and big toes
  chosen_korean: 그의 손가락과 발가락
  alternatives_korean:
  - 그의 엄지손가락과 엄지발가락
  - 그의 손의 엄지와 발의 엄지
  lexicon: HALOT
  rationale: 히브리어는 손과 발의 בֹּהֶן을 가리키지만, 한국어에서는 '엄지손가락/엄지발가락'보다 의미가 넓은 '손가락과 발가락'이 본문이 전달하려는 신체 훼손의 핵심을 간결하게 드러냅니다.
