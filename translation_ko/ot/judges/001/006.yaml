translation:
  language: ko
  text: 아도니베섹은 달아났으나, 그들은 그를 뒤쫓아 붙잡고 그의 엄지손가락과 엄지발가락을 잘라 냈습니다[a].
  philosophy: optimal-equivalence
  footnotes:
