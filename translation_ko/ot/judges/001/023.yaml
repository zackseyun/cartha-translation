lexical_decisions:
- source_word: וַיָּתִירוּ
  english_pob_choice: spied out
  chosen_korean: 살펴보았습니다
  alternatives_korean:
  - 정탐했습니다
  - 수색했습니다
  - 정찰했습니다
  lexicon: HALOT
  rationale: 문맥상 군사적 정탐의 의미가 강하지만, 현대 한국어에서는 너무 군사적으로 좁히지 않으면서도 ‘spied out’의 관찰·탐색 뜻을 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: בֵית יוֹסֵף
  english_pob_choice: the house of Joseph
  chosen_korean: 요셉의 집안
  alternatives_korean:
  - 요셉의 집
  - 요셉 집안의 사람들
  - 요셉의 자손들
  lexicon: HALOT
  rationale: 히브리어의 집단 표지를 살리면서도 한국어에서 더 자연스럽고 출처가 되는 집단성을 드러내기 위해 ‘집안’을 선택했습니다.
- source_word: בְּבֵית אֵל
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  - 베델 성읍
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관례에 따라 ‘베델’로 옮겼고, 본문 문맥상 전치사는 한국어에서 별도로 드러내지 않았습니다.
- source_word: לְפָנִים
  english_pob_choice: formerly
  chosen_korean: 이전에
  alternatives_korean:
  - 옛날에는
  - 전에
  - 과거에는
  lexicon: HALOT
  rationale: ‘formerly’의 시간적 대조를 간결하게 살리면서, 도시의 옛 이름을 소개하는 설명문체에 맞게 자연스럽게 표현했습니다.
