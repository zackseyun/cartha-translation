  - 베델 성읍
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관례에 따라 ‘베델’로 옮겼고, 본문 문맥상 전치사는 한국어에서 별도로 드러내지 않았습니다.
- source_word: לְפָנִים
  english_pob_choice: formerly
  chosen_korean: 이전에
  alternatives_korean:
  - 옛날에는
  - 전에
  - 과거에는
  lexicon: HALOT
  rationale: ‘formerly’의 시간적 대조를 간결하게 살리면서, 도시의 옛 이름을 소개하는 설명문체에 맞게 자연스럽게 표현했습니다.
