  text: וַ/יֹּ֣אמְר֔וּ יְרֻשַּׁ֥ת פְּלֵיטָ֖ה לְ/בִנְיָמִ֑ן וְ/לֹֽא יִמָּחֶ֥ה שֵׁ֖בֶט מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
  footnotes:
  - marker: a
    text: Or “a remnant for Benjamin” or “an inheritance for Benjamin’s survivors.” The Hebrew juxtaposes “inheritance” and “survivors/remnant” compactly, and the exact relationship between the two nouns may be expressed in more than one natural way in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “베냐민의 생존자들에게는 상속받을 몫이 있어야 합니다. 그래야 이스라엘에서 한 지파가 사라지지 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘베냐민을 위한 생존자들의 상속 몫’과 같이 옮길 수 있습니다. 히브리어는 ‘상속 몫’, ‘생존자’, ‘베냐민’을 압축적으로 연결하므로, 그 상속 몫이 베냐민의 생존자들을 위한 것인지 그들의 것인지를 한국어에서 한 가지 방식으로만 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그리고 그들이 말했습니다
  alternatives_korean:
  - 그리하여 그들이 말했습니다
  - 그들이 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 וַ-계열 완료형을 자연스러운 한국어 연결어로 옮기되, 단순 과거 서술을 유지했습니다.
- source_word: יְרֻשַּׁת
  english_pob_choice: An inheritance
  chosen_korean: 한 유산
  alternatives_korean:
  - 상속된 몫
  - 기업
  lexicon: HALOT
  rationale: 문맥상 베냐민 지파의 지속을 위해 남겨질 몫을 가리키므로, 현대 한국어에서 자연스럽고 중립적인 ‘유산’을 택했습니다.
- source_word: פְּלֵיטָה
  english_pob_choice: the survivors
  chosen_korean: 생존자들
  alternatives_korean:
  - 남은 자들
  - 도망쳐 살아남은 자들
  lexicon: HALOT
  rationale: פְּלֵיטָה는 ‘도망쳐 살아남은 자/생존자’의 뜻이므로, 이 장면의 베냐민 생존자들을 분명하게 드러내는 표현을 사용했습니다.
- source_word: וְלֹא יִמָּחֶה
  english_pob_choice: so that a tribe may not be blotted out
  chosen_korean: 지워지지 않아야 합니다
  alternatives_korean:
  - 말소되지 않아야 합니다
  - 도말되지 않아야 합니다
  lexicon: HALOT
  rationale: מחה의 수동 의미를 살리면서도 현대 한국어에서 자연스러운 ‘지워지다’로 옮겨, 공동체에서 완전히 제거되는 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 이스라엘에서 한 지파가 사라지는 것에 대한 표현
  chosen_reading: ‘한 지파가 지워지지 않아야 합니다’로 번역해, 단순한 행정적 소멸이 아니라 언약 공동체의 지파적 지속이 위협받는 상황을 드러냈습니다.
  alternative_readings:
  - ‘한 지파가 없어지지 않아야 합니다’
  - ‘한 지파가 말소되지 않아야 합니다’
  rationale: 본문은 베냐민 지파의 존속 문제를 말하므로, 지파의 소멸을 강하게 느끼게 하는 표현을 유지하는 것이 문맥과 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: 언약 백성의 보존과 지파 정체성
