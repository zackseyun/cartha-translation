  - marker: b
    text: Or 'for the survivors.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the LORD'; alternatively 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 우리가 그 남은 자들을 위해, 곧 아내를 얻기 위해 무엇을 해야 합니까? 우리는 그들에게 우리의 딸들을 아내로 주지 않기로 야훼로 맹세했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아내들을 위해’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘생존자들’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어의 신적 이름은 ‘야훼’입니다.
    reason: source_note
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  english_pob_choice: What shall we do
  chosen_korean: 우리가 … 무엇을 해야 합니까?
  alternatives_korean:
  - 우리가 … 어떻게 해야 합니까?
  - 우리가 … 무엇을 하겠습니까?
  lexicon: HALOT
  rationale: 의논·결의 상황에서의 1인칭 복수 의문을 한국어의 자연스러운 합쇼체로 옮겼습니다.
- source_word: לַנּוֹתָרִים
  english_pob_choice: for those who remain
  chosen_korean: 그 남은 자들
  alternatives_korean:
  - 남아 있는 자들
  - 생존자들
  lexicon: HALOT
  rationale: נותר의 분사적 의미를 살려 ‘남은 자들’로 옮겼고, 문맥상 베냐민 지파의 생존자들을 가리킵니다.
- source_word: לְנָשִׁים
  english_pob_choice: to get wives
  chosen_korean: 아내를 얻기 위해
  alternatives_korean:
  - 아내로 삼기 위해
  - 아내들을 위하여
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아내를 위해’라는 생략된 표현이므로, 문맥상 의도된 목적을 한국어에서 분명히 드러냈습니다.
- source_word: בַיהוָה
  english_pob_choice: by Yahweh
  chosen_korean: 야훼로
  alternatives_korean:
  - 야훼의 이름으로
  - 주님으로
  lexicon: HALOT
  rationale: 맹세 공식의 ב를 ‘~로’로 자연스럽게 살렸고, 본 프로젝트 기본값에 따라 신적 이름은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: YHWH(יהוה) 표기
  chosen_reading: 본문의 맹세 대상은 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - the LORD
  - 여호와
  rationale: 히브리어 원문에 직접 나오는 신적 이름을 보존하여, 맹세의 언약적 무게를 한국어 본문에서도 드러내기 위해서입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
