review_pass:
  verdict: revise
  source_fidelity: 첫 절의 לָהֶם과 לַנּוֹתָרִים는 ‘그들’, 즉 ‘남은 이들’을 가리키며, לְנָשִׁים은 아내를 마련하는 문제라는 문맥적 목적을 타당하게 나타낼 수 있습니다. 그러나 현 초안의 ‘그 남은 자들을 위해, 곧 아내를 얻기 위해’는 두 ‘위해’ 구가 서로 동격인 듯 연결되어, ‘아내를 얻는 주체’가 남은 이들이라는 점이 불분명합니다. 또한 맹세의 ב는 한국어 관용상 ‘야훼를 두고 맹세하다’가 가장 자연스럽고 정확합니다. מִבְּנוֹתֵינוּ의 부분적 뉘앙스도 ‘우리 딸들 가운데 누구도’로 반영하는 것이 좋습니다.
  naturalness: 개정문은 의논하는 의문문의 합쇼체를 유지하면서도, 아내를 얻을 사람이 ‘남은 이들’임을 분명히 합니다. ‘야훼로 맹세했습니다’보다 ‘야훼를 두고 맹세했습니다’가 현대 표준 한국어에서 맹세 공식으로 자연스럽습니다.
  terminology: יהוה는 프로젝트 방침 및 원문에 따라 ‘야훼’로 유지했습니다. נותרים은 ‘남은 이들’로 옮기고, 대안인 ‘생존자들’은 각주에서 제시했습니다. ‘아내로 주다’는 혼인시키는 뜻을 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: 첫 문장의 수식 관계가 불분명합니다.
    rationale: ‘그 남은 자들을 위해, 곧 아내를 얻기 위해’는 ‘아내를 얻기 위해’가 ‘남은 자들을 위해’의 동격 설명처럼 읽힐 수 있습니다. 원문의 문맥상 남은 이들이 아내를 얻도록 방안을 찾는다는 관계를 명시하는 편이 안전합니다.
  - severity: low
    issue: 맹세 공식 ‘야훼로 맹세했습니다’가 다소 부자연스럽습니다.
    rationale: בַיהוָה는 맹세의 근거·호명을 나타내며, 한국어에서는 ‘야훼를 두고 맹세했습니다’가 자연스러운 대응입니다.
  - severity: low
    issue: 각주 표지가 해당 표현에 직접 붙어 있지 않습니다.
    rationale: a, b, c가 모두 문장 끝에 모여 있어 각각의 ‘아내를 얻도록’, ‘남은 이들’, ‘야훼’와의 연결이 약합니다. 해당 단어 뒤에 배치합니다.
  revised_text: 그들, 곧 남은 이들이 아내를 얻도록[a] 우리는 무엇을 해야 합니까? 우리는 야훼를 두고[c] 우리 딸들 가운데 누구도 그들에게 아내로 주지 않기로 맹세했습니다.
  revised_footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아내들을 위해’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘생존자들’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어의 신적 이름은 ‘야훼’입니다.
    reason: source_note
  revision_rationale: 문장의 의미 관계와 맹세 공식을 바로잡고, מִבְּנוֹתֵינוּ의 부분적 의미를 반영했습니다. 다만 b 각주는 ‘남은 이들’에 붙어야 하므로 완전한 본문에서는 해당 위치에 표지를 배치했습니다.
