source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
  footnotes:
  - marker: a
    text: Or 'come to complain to us' or 'come to bring a case against us.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'be gracious to us concerning them'; the plea is for leniency toward the speakers regarding the women.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew is terse: ''we did not take each man his wife in the battle,'' likely meaning that not enough wives had been obtained in war for the men of Benjamin.'
    reason: cultural_note
  - marker: d
    text: Or 'you did not give the women to them'; the Hebrew repeats pronouns compactly.
    reason: lexical_alternative
  - marker: e
    text: The final clause is difficult Hebrew. The sense is that because the women were not formally given by their families, the families would not be held guilty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 일이 이렇게 될 것입니다. 그들의 아버지나 형제들이 우리에게 와서 우리와 다투게 되면,[a] 우리가 그들에게 이렇게 말할 것입니다. ‘그 여자들에 관하여 우리에게 은혜를 베풀어 주십시오.[b] 우리가 전쟁에서 각 사람을 위하여 그의 아내를 취하지 못했기 때문입니다.[c] 너희가 그때 그 여자들을 그들에게 준 것이 아니므로,[d] [그렇지 않았다면] 이제 너희가 죄책을 지게 되었을 것입니다.[e]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리에게 와서 항의하면’ 또는 ‘우리에게 사건을 제기하면’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그들에 관하여 우리에게 은혜를 베풀라’입니다. 여기서 ‘그들’은 문맥상 여자들을 가리키며, 여자들의 일에 관해 화자들에게 관용을 베풀어 달라는 청원입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘우리가 전쟁에서 각 사람의 아내를 취하지 않았다’라고 압축하여 말합니다. 문맥상 베냐민 사람들 각자에게 줄 아내를 전쟁으로 얻지 못했다는 뜻으로 이해됩니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘너희가 그 여자들을 그들에게 주지 않았으므로’로 옮길 수 있습니다. 히브리어는 여자들과 베냐민 남자들을 가리키는 대명사를 압축적으로 반복합니다.
    reason: lexical_alternative
  - marker: e
    text: 마지막 구절은 히브리어가 난해합니다. 직역에 가깝게는 ‘그때 너희가 죄책을 지게 될 것이다’입니다. 문맥상 여자들을 가족들이 정식으로 준 것이 아니라는 이유로, ‘그렇지 않았다면 이제 너희가 죄책을 지게 되었을 것이다’라는 반사실적 뜻으로 흔히 이해됩니다. 대괄호의 말은 히브리어에 명시되어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרִיב / come to contend with us
  english_pob_choice: come to contend with us
  chosen_korean: 우리에게 와서 다투면
  alternatives_korean:
  - 우리에게 와서 항의하면
  - 우리에게 와서 소송을 제기하면
  lexicon: HALOT
  rationale: ריב의 대립·분쟁 의미를 살리면서도, 법정화보다 넓은 ‘다투다’로 자연스럽게 옮겼습니다.
- source_word: חָנּוּנוּ אֹתָם / Show us favor concerning them
  english_pob_choice: Show us favor concerning them
  chosen_korean: 우리에게 그들에 대해 호의를 베푸십시오
  alternatives_korean:
  - 우리에게 그들에 대해 은혜를 베푸십시오
  - 그들에 대해 우리를 너그러이 봐주십시오
  lexicon: HALOT
  rationale: חנן의 ‘은혜를 베풀다/호의를 베풀다’ 의미를 살리되, 대상이 붙는 구조를 한국어로 자연스럽게 풀었습니다.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  english_pob_choice: we did not take for each man his wife in the battle
  chosen_korean: 우리는 전투에서 각각 자기 아내를 취하지 않았습니다
  alternatives_korean:
  - 우리는 전쟁에서 각 사람의 아내를 취하지 않았습니다
  - 우리는 전투에서 한 사람마다 자기 아내를 얻지 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 따라 ‘각각 자기 아내’를 유지해, 본문의 어색하지만 분명한 구조를 보존했습니다.
- source_word: תֶּאְשָׁמוּ / you should incur guilt
  english_pob_choice: so that you should incur guilt
  chosen_korean: 너희가 이제 죄책을 지게 되지 않을 것입니다
  alternatives_korean:
  - 너희가 이제 죄를 지게 되지 않을 것입니다
  - 너희가 이제 죄책을 지게 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 결말은 책임 전가가 아니라 ‘죄책을 피하게 됨’을 뜻하므로, 결과를 한국어에서 분명히 드러내기 위해 부정형으로 옮겼습니다.
theological_decisions:
- issue: 이 절의 마지막 절구가 형식적으로는 ‘죄책을 지게 됨/지 않음’의 방향이 해석상 모호합니다.
  chosen_reading: 문맥에 따라 ‘여기서 공식적으로 여자들을 주지 않았으므로, 그들이 죄책을 지지 않게 될 것’이라는 뜻으로 풀이했습니다.
  alternative_readings:
  - ‘그렇지 않으면 너희가 이제 죄책을 지게 될 것이다’
  - ‘그리하여 너희가 지금 죄책을 면하게 된다’
  rationale: 영어 POB의 주석과 히브리어 문맥 모두, 가족이 법적·의례적으로 여자들을 건네지 않았기 때문에 책임에서 벗어나는 취지로 읽게 합니다.
  doctrine_reference: 본문 주해/문맥 판단
