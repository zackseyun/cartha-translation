revisions:
- from: 그래서 베냐민 자손이 그대로 행하여, 숫자대로 춤추는 여자들 가운데서 아내들을 데려갔습니다. 그런 다음 그들은 떠나 자기들의 기업으로 돌아가 성읍들을 다시 세우고 그곳에 살았습니다.[a][b]
  to: 그래서 베냐민 자손들은 그렇게 하여, 그들이 빼앗은 춤추는 여자들 가운데서 자기들의 수에 맞추어 아내로 삼아 데려갔습니다.[a] 그들은 떠나 자기들의 상속지로 돌아가 도시들을 다시 세우고 그곳에 살았습니다.[b]
  rationale: 관계절 ‘그들이 빼앗은’을 복원하여 원문의 강제적 의미와 영어 POB의 감사 결정을 보존했습니다. 이에 맞추어 기존의 부정확한 분사 각주를 강탈 동사에 대한 각주로 교체했습니다. ‘다시 세우고’는 원문의 기본 동사 ‘세우다’ 자체를 과도하게 확정하지 않도록 문맥적 번역임을 각주에서 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:17Z'
