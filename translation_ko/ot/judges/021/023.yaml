  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
  footnotes:
  - marker: a
    text: Or 'from the dancing women.' The Hebrew participle is feminine plural.
    reason: lexical_alternative
  - marker: b
    text: Or 'whom they had snatched away' or 'carried off.' The Hebrew verb denotes taking by force.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'built the cities'; 'rebuilt' reflects the context of Benjamin's devastated towns in the preceding narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 베냐민 자손이 그대로 행하여, 숫자대로 춤추는 여자들 가운데서 아내들을 데려갔습니다. 그런 다음 그들은 떠나 자기들의 기업으로 돌아가 성읍들을 다시 세우고 그곳에 살았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 여성복수는 '춤추는 여자들'을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 단순히 '세우다'이지만, 앞 문맥상 '다시 세우다'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민 사람들
  - 베냐민 지파 사람들
  lexicon: HALOT
  rationale: 가문·지파적 표현을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표준 표현으로 옮겼습니다.
- source_word: וַיִּשְׂאוּ נָשִׁים
  english_pob_choice: took wives
  chosen_korean: 아내들을 데려갔습니다
  alternatives_korean:
  - 아내들을 취했습니다
  - 아내로 맞았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 결혼 취득 의미를 살리되, 본문이 담고 있는 강제성과 서사 흐름을 드러내기 위해 '데려갔습니다'를 택했습니다.
- source_word: מִן הַמְּחֹלְלוֹת אֲשֶׁר גָּזָלוּ
  english_pob_choice: from the dancers whom they had seized
  chosen_korean: 춤추는 여자들 가운데서
  alternatives_korean:
  - 춤추는 여자들 중에서
  - 춤추는 여자들 가운데서 그들이 빼앗은 사람들
  lexicon: HALOT
  rationale: 분사 여성복수의 의미를 따라 '춤추는 여자들'로 옮겼고, 문맥상 강제성을 암시하되 한국어 문장 흐름을 위해 관계절을 본문에 과도하게 늘이지 않았습니다.
- source_word: אֶל נַחֲלָתָם
  english_pob_choice: to their inheritance
  chosen_korean: 자기들의 기업으로
  alternatives_korean:
  - 자기들의 상속지로
  - 자기들의 분깃 땅으로
  lexicon: HALOT
  rationale: 지파적 토지 분배의 뉘앙스를 살리기 위해 전통적으로 성경 한국어에서 널리 쓰이는 '기업'을 사용했습니다.
- source_word: וַ/יִּבְנוּ אֶת הֶעָרִים
  english_pob_choice: rebuilt the cities
  chosen_korean: 성읍들을 다시 세우고
  alternatives_korean:
  - 성읍들을 건축하고
  - 성읍들을 재건하고
  lexicon: HALOT
  rationale: 히브리어 동사 자체는 '세우다/짓다'이지만, 앞선 전쟁 파괴 정황을 반영하여 POB의 'rebuilt' 취지를 살린 '다시 세우고'로 옮겼습니다.
theological_decisions:
- issue: 여성들을 데려간 행위의 폭력성과 도덕적 불편함을 어떻게 드러낼지
  chosen_reading: 직역을 완화하지 않고 '데려갔습니다'와 '춤추는 여자들 가운데서'로 남겨, 본문이 지닌 강제적 뉘앙스를 읽히게 했습니다.
  alternative_readings:
  - 아내를 맞았습니다
  - 아내들을 취했습니다
  rationale: 본문은 승인보다 사실 서술에 가깝고, 강제 취득의 여운을 지우면 히브리어의 윤리적 긴장이 약해집니다.
  doctrine_reference: 번역 원칙 1, 3
