  source_fidelity: 수정이 필요합니다. 초안은 גָּזָלוּ(강제로 빼앗다)의 관계절을 본문에서 빠뜨렸습니다. ‘데려갔습니다’만으로는 이 동사의 강제적 의미가 충분히 보존되지 않으며, 영어 POB 감사 기록의 핵심 결정과도 맞지 않습니다. 또한 ‘춤추는 여자들’은 가능성 표현이 아니라 본문의 여성 복수 분사가 가리키는 대상입니다.
  naturalness: 수정문은 현대 표준 한국어와 합쇼체에 맞습니다. ‘아내로 삼아 데려갔습니다’는 히브리어의 ‘아내들을 취하다’라는 혼인 관용구를 자연스럽게 옮기면서, ‘빼앗은’이 나타내는 강제성을 유지합니다. ‘상속지’와 ‘도시’는 이 문맥에서 각각 ‘기업’과 ‘성읍’보다 현대 독자에게 더 투명합니다.
  terminology: ‘베냐민 자손들’은 בְּנֵי בִנְיָמִן의 지파적 표현을 보존합니다. ‘상속지’는 נחלה의 상속받은 토지라는 뜻을, ‘다시 세우고’는 문맥에 근거한 rebuilt를 반영합니다. גָּזָלוּ는 ‘빼앗은’으로 명시해 폭력적 취득을 완화하지 않았습니다.
