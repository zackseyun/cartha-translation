source:
  edition: WLC
  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: ko
  text: 그러므로 회중은 그곳에 용맹한 자손 가운데서 만 이천 명을 보내고, 그들에게 명령하여 말했습니다. 「가서 야베스-길르앗 주민들을 칼날로 치되, 여자들과 어린아이들까지 포함하라.」[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘회중’은 여기서 ‘집회’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֵדָה
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 집회
  - 공동체
  lexicon: עֵדָה
  rationale: 군중이 아니라 공동체적으로 모인 집단을 가리키므로, POB의 ‘assembly’를 한국어 성경 문체에 맞게 ‘회중’으로 옮겼습니다.
- source_word: מִבְּנֵי הֶחָיִל
  english_pob_choice: from the sons of valor
  chosen_korean: 용맹한 자손 가운데서
  alternatives_korean:
  - 용사들의 자손 가운데서
  - 무사한 자손 가운데서
  lexicon: חַיִל
  rationale: 직역하면 ‘용맹/힘’의 자손들이며, 단순히 신체적 힘보다 전투적 능력을 드러내는 표현이어서 ‘용맹한 자손’으로 자연스럽게 살렸습니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼끝으로
  - 칼의 날로
  lexicon: לְפִי חֶרֶב
  rationale: 히브리어 관용구를 한국어에서도 공격 수단과 치명성을 함께 드러내는 짧은 표현으로 옮겼습니다.
- source_word: וְהַנָּשִׁים וְהַטָּף
  english_pob_choice: including the women and the little ones
  chosen_korean: 여자들과 어린아이들까지 포함하라
  alternatives_korean:
  - 여자들과 어린아이들도
  - 여자들과 어린것들도
  lexicon: נָשִׁים / טַף
  rationale: 문맥상 전멸 명령의 범위를 분명히 드러내야 하므로, ‘including’의 의미를 살려 여성과 유아/어린이를 함께 포함시키는 표현으로 옮겼습니다.
theological_decisions:
- issue: 전멸 명령의 서술을 완화하지 않을 것
  chosen_reading: 본문의 폭력성을 그대로 드러내어 ‘치되… 포함하라’로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘공격하라’로 약화
  - ‘죽이라’ 대신 ‘쳐부수라’로 일반화
  rationale: 히브리어 명령과 POB의 ‘strike… including…’는 본문의 심각성을 숨기지 않으므로, 독자가 역사서의 도덕적 긴장을 그대로 인식하도록 유지했습니다.
  doctrine_reference: 구약 내 거룩한 전쟁/심판 서술의 정직한 번역
