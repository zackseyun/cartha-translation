  text: 이스라엘 자손은 그들의 형제 베냐민을 두고 슬퍼했습니다[a]. 그리고 이렇게 말했습니다. 「오늘 이스라엘에서 한 지파가 끊어졌습니다.」
  philosophy: optimal-equivalence
  footnotes:
