    text: 히브리어 נחם은 문맥에 따라 ‘슬퍼하다’, ‘연민을 느끼다’, 또는 ‘마음을 돌리다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  english_pob_choice: grieved over
  chosen_korean: 마음 아파하며
  alternatives_korean:
  - 슬퍼하며
  - 가엾게 여기며
  - 마음이 상하여
  lexicon: HALOT
  rationale: 이 동사의 문맥상 의미는 단순한 위로가 아니라 베냐민의 처지를 두고 느끼는 슬픔과 연민이므로, 자연스러운 합쇼체로 ‘마음 아파하며’가 가장 잘 맞습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손은
  alternatives_korean:
  - 이스라엘 사람들은
  - 이스라엘의 아들들은
  lexicon: HALOT
  rationale: 히브리어의 친족-공동체 표현을 살려 직역에 가까운 ‘이스라엘 자손’으로 옮기되, 한국어 문장 흐름에 맞게 주어를 자연스럽게 처리했습니다.
- source_word: אֶל בִּנְיָמִן אָחִיו
  english_pob_choice: over Benjamin their brother
  chosen_korean: 자기들의 형제 베냐민을 두고
  alternatives_korean:
  - 형제 베냐민 때문에
  - 형제 베냐민에 대하여
  lexicon: HALOT
  rationale: אֶל은 여기서 대상/관련을 나타내므로, 영어 POB의 ‘over’처럼 슬픔의 대상을 드러내는 ‘두고’가 가장 무난하고 한국어스럽습니다.
- source_word: נִגְדַּע ... שֵׁבֶט אֶחָד מִיִּשְׂרָאֵל
  english_pob_choice: one tribe has been cut off from Israel
  chosen_korean: 이스라엘에서 한 지파가 끊어졌습니다
  alternatives_korean:
  - 이스라엘에서 한 지파가 잘려 나갔습니다
  - 이스라엘에서 한 지파가 사라졌습니다
  lexicon: HALOT
  rationale: גדע의 절단 이미지를 살려 ‘끊어졌습니다’로 옮기면 단순 소멸보다 공동체에서 잘려 나간 비극성이 더 분명해집니다.
theological_decisions:
- issue: 이스라엘 공동체의 상실을 나타내는 표현
  chosen_reading: ‘한 지파가 끊어졌습니다’로 공동체에서의 절단과 상실을 그대로 드러냈습니다.
  alternative_readings:
  - ‘한 지파가 없어졌습니다’
  - ‘한 지파가 멸망했습니다’
  rationale: 본문은 단순한 감소보다 언약 공동체 안에서 한 지파가 절단된 비극을 말하므로, 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 구약의 지파-언약 공동체 이해
