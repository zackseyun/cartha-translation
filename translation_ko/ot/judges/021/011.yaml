  source_fidelity: 핵심 의미와 חרם의 기술적 뉘앙스는 대체로 충실합니다. 다만 יֹדַעַת מִשְׁכַּב זָכָר의 완료된 성적 경험을 나타내는 표현으로 ‘남자와의 잠자리를 아는’은 한국어에서 부자연스럽고 의미가 불명확할 수 있습니다. ‘남자와 잠자리를 가진’이 히브리어의 완곡 표현과 의미를 더 정확히 전달합니다.
  naturalness: 합쇼체와 지시문의 형식은 적절합니다. ‘남자와 잠자리를 가진 모든 여자’가 현대 표준 한국어에서 자연스럽고 명료합니다. 또한 어휘 대안 각주는 해당 구절 바로 뒤에 두어야 독자가 가리키는 대상을 분명히 알 수 있습니다.
  terminology: ‘멸망에 바치십시오’는 תַּחֲרִימוּ(헤렘)의 단순 살해 이상의 ‘파멸에 바침/금령’이라는 의미를 보존하는 안전한 번역입니다. 각주의 ‘금령 아래’도 이 기술적 의미를 적절히 설명합니다.
