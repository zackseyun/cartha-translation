  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
  footnotes:
  - marker: a
    text: Or more explicitly, 'every woman who has had sexual relations with a man.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'devote to destruction' refers to placing someone under the ban for destruction, not merely ordinary killing.
    reason: cultural_note
translation:
  language: ko
  text: '그리고 이것이 여러분이 할 일입니다: 남자마다, 그리고 남자와의 잠자리를 아는 여자마다, 여러분은 멸망에 바치십시오.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명하게, ‘남자와 성관계를 가진 여자마다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘멸망에 바치다’는 단순한 살인이 아니라, 파멸을 위해 금령 아래 두는 것을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  english_pob_choice: And this is what you shall do
  chosen_korean: 그리고 이것이 여러분이 할 일입니다
  alternatives_korean:
  - 그리고 이것은 여러분이 해야 할 일입니다
  - 이것이 여러분이 행할 일입니다
  lexicon: HALOT
  rationale: 히브리어의 지시문을 자연스러운 합쇼체 명령/지시문으로 옮기되, 앞의 접속사와 후속 명령의 흐름을 살렸습니다.
- source_word: כָּל זָכָר
  english_pob_choice: every male
  chosen_korean: 남자마다
  alternatives_korean:
  - 모든 남자
  - 남성마다
  lexicon: HALOT
  rationale: זָכָר는 성별을 가리키므로 ‘남자’로 옮기되, 집합적 전면성을 위해 ‘마다’를 붙였습니다.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  english_pob_choice: who has known the bed of a male
  chosen_korean: 남자와의 잠자리를 아는 여자
  alternatives_korean:
  - 남자와 잠자리를 가진 여자
  - 남자와 성관계를 한 여자
  lexicon: HALOT
  rationale: ידע와 ‘침상/잠자리’의 완곡어법을 살려 직역에 가깝게 옮기되, 한국어에서 이해 가능하도록 ‘남자와의 잠자리’로 자연화했습니다.
- source_word: תַּחֲרִימוּ
  english_pob_choice: you shall devote to destruction
  chosen_korean: 멸망에 바치십시오
  alternatives_korean:
  - 멸절에 바치십시오
  - 진멸하십시오
  - 멸망시키십시오
  lexicon: HALOT
  rationale: חרם의 기술적 의미를 살리기 위해 단순한 ‘죽이다/없애다’보다 ‘멸망에 바치다’를 선택해, 파멸로 구별하여 바치는 금령의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: חרם의 번역이 단순 살육인지, 금령 아래의 파멸인지
  chosen_reading: 멸망에 바치십시오
  alternative_readings:
  - 진멸하십시오
  - 멸절에 바치십시오
  - 완전히 죽이십시오
  rationale: 본문은 일반적 살해가 아니라 ‘바쳐진 파멸’이라는 법적·예배적 성격의 חרם을 나타내므로, 그 긴장을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
