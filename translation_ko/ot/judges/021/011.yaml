- source_word: כָּל זָכָר
  english_pob_choice: every male
  chosen_korean: 남자마다
  alternatives_korean:
  - 모든 남자
  - 남성마다
  lexicon: HALOT
  rationale: זָכָר는 성별을 가리키므로 ‘남자’로 옮기되, 집합적 전면성을 위해 ‘마다’를 붙였습니다.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  english_pob_choice: who has known the bed of a male
  chosen_korean: 남자와의 잠자리를 아는 여자
  alternatives_korean:
  - 남자와 잠자리를 가진 여자
  - 남자와 성관계를 한 여자
  lexicon: HALOT
  rationale: ידע와 ‘침상/잠자리’의 완곡어법을 살려 직역에 가깝게 옮기되, 한국어에서 이해 가능하도록 ‘남자와의 잠자리’로 자연화했습니다.
- source_word: תַּחֲרִימוּ
  english_pob_choice: you shall devote to destruction
  chosen_korean: 멸망에 바치십시오
  alternatives_korean:
  - 멸절에 바치십시오
  - 진멸하십시오
  - 멸망시키십시오
  lexicon: HALOT
  rationale: חרם의 기술적 의미를 살리기 위해 단순한 ‘죽이다/없애다’보다 ‘멸망에 바치다’를 선택해, 파멸로 구별하여 바치는 금령의 뉘앙스를 유지했습니다.
theological_decisions:
