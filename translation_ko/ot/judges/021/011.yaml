- from: '그리고 이것이 여러분이 할 일입니다: 남자마다, 그리고 남자와의 잠자리를 아는 여자마다, 여러분은 멸망에 바치십시오.[a][b]'
  to: '그리고 이것이 여러분이 할 일입니다: 모든 남자와 남자와 잠자리를 가진 모든 여자[a]를 여러분은 멸망에 바치십시오.[b]'
  rationale: 성관계를 뜻하는 히브리어 완곡 표현을 현대 한국어에서 자연스럽고 분명한 ‘남자와 잠자리를 가진’으로 고쳤습니다. 또한 대안 번역 각주의 앵커를 해당 표현 뒤로 옮겼습니다. חרם의 기술적 의미를 반영한 ‘멸망에 바치십시오’와 그 설명 각주는 유지했습니다.
