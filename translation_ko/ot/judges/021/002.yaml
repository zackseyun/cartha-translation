base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
  footnotes:
  - marker: a
    text: Or 'wept a great weeping'; the Hebrew uses a cognate expression for intensified mourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 백성이 베델에 이르러 그곳에서 저녁까지 하나님 앞에 앉아 있다가, 목소리를 높여 큰 울음으로 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘울다’와 같은 어근의 명사를 함께 써서 울음의 강도를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֵל
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  lexicon: HALOT
  rationale: 지명 표기는 현대 외래어 표기와 본문 일관성을 고려해 ‘베델’로 옮겼습니다. 전통 교회 표기 ‘벧엘’도 가능하지만, 이 항목에서는 표준화된 음역을 택했습니다.
- source_word: לִפְנֵי הָאֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에
  alternatives_korean:
  - 하나님 앞에서
  - 하나님 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 관계 표지를 자연스러운 한국어 위치·대면 표현으로 살려 ‘하나님 앞에’로 옮겼습니다. 영어 POB가 ‘God’로 유지한 점도 반영했습니다.
- source_word: וַיִּשְׂאוּ קוֹלָם
  english_pob_choice: raised their voices
  chosen_korean: 목소리를 높여
  alternatives_korean:
  - 소리를 높여
  - 목소리를 들고
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘외쳐 울부짖다’는 동작을 한국어에서 자연스럽게 드러내기 위해 ‘목소리를 높여’로 옮겼습니다.
- source_word: בְּכִי גָדוֹל
  english_pob_choice: wept with great weeping
  chosen_korean: 크게 울었습니다
  alternatives_korean:
  - 큰 울음으로 울었습니다
  - 매우 크게 울었습니다
  lexicon: HALOT
  rationale: 중첩형 강조를 한국어에서 과도하게 어색하지 않게 전달하기 위해 ‘크게 울었습니다’로 처리했습니다. 영어 POB가 유지한 강조 의미는 보존하되, 한국어 문장성을 우선했습니다.
theological_decisions:
- issue: 하나님 이름을 위한 לִפְנֵי הָאֱלֹהִים 처리
  chosen_reading: ‘하나님 앞에’로 유지하고 ‘주님’이나 ‘야훼’로 바꾸지 않았습니다.
  alternative_readings:
  - 주님 앞에
  - 야훼 앞에
  rationale: 본문은 YHWH가 아니라 הָאֱלֹהִים을 사용하므로, 원문 차이를 지우지 않기 위해 일반 명사 ‘하나님’을 유지했습니다. 영어 POB의 신학적 선택도 이를 지지합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; Contested terms table for יְהוָה
