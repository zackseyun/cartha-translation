  source_fidelity: 히브리어의 복수 주어(‘그들이’), 명령 대상, 직접 인용의 복수 명령, 그리고 ‘포도원들에서/안에서 매복하다’라는 핵심 의미는 대체로 반영되었습니다. 그러나 ‘명하며 말했습니다’는 לֵאמֹר를 기계적으로 중복 번역하여 한국어 문장 구조와 완료 서술의 의미를 훼손합니다. בְּנֵי בִנְיָמִן은 문맥상 지파 구성원을 가리키지만, 원문의 혈연 집단 표현을 보존하는 ‘베냐민 자손’이 더 적절합니다.
  naturalness: ‘그들이 … 명하며 말했습니다’는 연결형 ‘명하며’와 과거 종결형 ‘말했습니다’가 부자연스럽게 결합되고, ‘명하다’와 ‘말하다’가 불필요하게 중복됩니다. ‘그들은 … 명령했습니다’로 직접 인용을 도입하면 현대 합쇼체에서 자연스럽습니다. 장소 표현은 한국어에서 집합명사로 자연스러운 ‘포도원에’를 사용했습니다.
  terminology: ‘베냐민 자손’은 בְּנֵי בִנְיָמִן의 친족·집단 표현을 충실히 반영하면서도 현대 한국어 성경 문체에 자연스럽습니다. ארב는 ‘숨어 기다리다’로 옮길 수 있으며, ‘매복하다’라는 대안은 각주로 제시할 수 있습니다.
