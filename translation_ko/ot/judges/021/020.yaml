lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: And they commanded
  chosen_korean: 명하며
  alternatives_korean:
  - 명령하며
  - 지시하며
  - 명하였습니다
  lexicon: HALOT
  rationale: 히브리어 צוה의 핵심 의미인 ‘명하다, 명령하다’를 살리되, 앞선 서술과 자연스럽게 이어지도록 동사 연결형으로 처리했습니다.
- source_word: אֶת בְּנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 지파
  alternatives_korean:
  - 베냐민의 아들들
  - 베냐민 자손
  - 베냐민 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘베냐민의 아들들’이지만, 한국어에서는 집단 지칭으로 더 자연스러운 ‘베냐민 지파’를 택해 원문의 혈연 표현을 의미상 보존했습니다.
- source_word: וַאֲרַבְתֶּם
  english_pob_choice: and lie in wait
  chosen_korean: 숨어 기다리십시오
  alternatives_korean:
  - 매복하십시오
  - 매복해 있으십시오
  - 기습할 태세를 갖추십시오
  lexicon: HALOT
  rationale: ארב는 ‘매복하다, 숨어 기다리다’의 뜻이므로, 군사적 은폐와 대기 상태를 함께 드러내는 표현으로 옮겼습니다.
- source_word: בַּכְּרָמִים
  english_pob_choice: in the vineyards
  chosen_korean: 포도원들 가운데
  alternatives_korean:
  - 포도원 안에
  - 포도밭에
  - 포도원들에서
  lexicon: HALOT
  rationale: 전치사의 공간적 뉘앙스를 살리면서, 매복 장소라는 장면성을 살리기 위해 ‘가운데’로 풀었습니다.
theological_decisions:
- issue: 직접 명령형의 한국어 높임 수준
  chosen_reading: 직접 인용문에서는 군사적 지시를 자연스럽게 전달하기 위해 ‘가서 … 기다리십시오’로 정중한 명령형을 사용했습니다.
  alternative_readings:
  - 가서 … 기다리라
  - 가서 … 기다리십시오
  rationale: 서술문은 합쇼체를 유지하되, 인용된 명령은 현대 한국어 성경문체에서 어색하지 않은 명령형으로 처리했습니다.
  doctrine_reference: 문체/화행 일관성
