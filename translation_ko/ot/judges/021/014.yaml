base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
  footnotes:
  - marker: a
    text: Or, more literally, 'but they did not find so for them.' The Hebrew expression is elliptical, meaning that there were not enough women for them by this means.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 베냐민 사람들이 돌아왔습니다. 그러자 그들에게 야베스-길르앗의 여자들 가운데서 살려 둔 여자들을 주었으나, 그것으로는 그들에게 충분하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב בִּנְיָמִן
  english_pob_choice: So Benjamin returned
  chosen_korean: 베냐민 사람들이 돌아왔습니다
  alternatives_korean:
  - 베냐민이 돌아왔습니다
  - 베냐민이 되돌아왔습니다
  lexicon: HALOT
  rationale: 히브리어의 단수형 고유명사 ‘베냐민’은 문맥상 지파 전체를 가리키므로 복수적 집단 의미를 드러내어 옮겼습니다.
- source_word: וַיִּתְּנוּ לָהֶם הַנָּשִׁים
  english_pob_choice: and they gave them the women
  chosen_korean: 그들에게 … 여자들을 주었으나
  alternatives_korean:
  - 그들에게 … 여인들을 주었으나
  - 그들에게 … 아내들을 주었으나
  lexicon: HALOT
  rationale: 원문은 구체적으로 ‘아내들’이 아니라 ‘여자들’이라고 말하므로, 문맥상 혼인 관계를 암시하더라도 기본 명사를 유지했습니다.
- source_word: אֲשֶׁר חִיּוּ
  english_pob_choice: whom they had kept alive
  chosen_korean: 살려 둔
  alternatives_korean:
  - 살려 놓은
  - 살아 있게 한
  lexicon: HALOT
  rationale: 피엘형의 생존 보존 의미를 한국어 관용 표현인 ‘살려 두다’로 자연스럽게 살렸습니다.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  english_pob_choice: but they did not find enough for them that way
  chosen_korean: 그것으로는 그들에게 충분하지 않았습니다
  alternatives_korean:
  - 그렇게는 그들에게 충분하지 않았습니다
  - 그 방법으로는 그들에게 충분한 수를 찾지 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 축약된 표현은 ‘그 방식으로는 충분치 않았다’는 뜻이므로, 결과 의미를 분명하게 드러내되 원문의 부족함을 유지했습니다.
theological_decisions:
- issue: 문장 속 인칭과 집단 지칭
  chosen_reading: ‘베냐민’은 개인 이름이 아니라 지파 전체를 가리키는 집단명으로 처리했습니다.
  alternative_readings:
  - ‘베냐민’이라는 단수형을 그대로 유지
  - ‘베냐민 지파가’로 명시
  rationale: 문맥상 생존한 베냐민 사람들의 귀환을 말하므로, 한국어에서도 독자가 집단 의미를 즉시 이해하도록 했습니다.
  doctrine_reference: 문맥 해석과 집단명 처리
- issue: ‘여자들’과 혼인 함의
  chosen_reading: 원문 표현을 따라 ‘여자들’을 유지하고, 혼인 관계는 문맥이 받쳐 주는 범위에서만 암시되게 두었습니다.
  alternative_readings:
  - ‘아내들’로 명시
  - ‘처녀들’로 한정
  rationale: 히브리어 본문은 여기서 더 좁은 명칭을 쓰지 않으므로, 과도한 해석을 피하는 것이 본문 충실도에 맞습니다.
  doctrine_reference: 본문 우선 원칙
