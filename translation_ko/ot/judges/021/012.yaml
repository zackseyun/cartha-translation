  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: ko
  text: 길르앗의 야베스 주민들 가운데서 젊은 여자 네백 명, 곧 처녀로서 남자와 동침하여 남자를 알지 못한 이들을 찾아서, 그들을 가나안 땅에 있는 실로의 진영으로 데려왔습니다.
  philosophy: formal
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  english_pob_choice: from the inhabitants of Jabesh-gilead
  chosen_korean: 길르앗의 야베스 주민들 가운데서
  alternatives_korean:
  - 길르앗 야베스의 거주자들 가운데서
  - 야베스-길르앗 주민들 가운데서
  lexicon: יֹשֵׁב / 주민
  rationale: מִן의 출처 관계를 자연스럽게 살리되, 한국어에서는 ‘~가운데서’가 ‘from among’의 선별 뉘앙스를 잘 드러냅니다.
- source_word: אַרְבַּע מֵאוֹת נַעֲרָה בְתוּלָה
  english_pob_choice: four hundred young women, virgins
  chosen_korean: 젊은 여자 네백 명, 곧 처녀
  alternatives_korean:
  - 네백 명의 젊은 처녀
  - 젊은 처녀 네백 명
  lexicon: נַעֲרָה / בְתוּלָה
  rationale: POB의 ‘young women’을 반영해 나이어린 여성성을 우선 살리고, בְתוּלָה는 ‘처녀’로 옮겨 별도 동격 표지를 덧붙였습니다.
- source_word: לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  english_pob_choice: who had not known a man by lying with a male
  chosen_korean: 남자와 동침하여 남자를 알지 못한 이들
  alternatives_korean:
  - 남자와 함께 눕는 것으로 남자를 알지 못한 이들
  - 남자와 잠자리를 함께하여 남자를 알지 못한 이들
  lexicon: יָדַע + מִשְׁכַּב זָכָר
  rationale: 히브리어 관용구를 직설적으로 옮겨 성적 경험이 없음을 분명히 하되, 문맥이 허용하는 범위 안에서 현대 한국어로 완화 없이 표현했습니다.
- source_word: וַיָּבִיאוּ ... אֶל הַמַּחֲנֶה שִׁלֹה
  english_pob_choice: and they brought them to the camp at Shiloh
  chosen_korean: 그들을 가나안 땅에 있는 실로의 진영으로 데려왔습니다
  alternatives_korean:
  - 그들을 실로 진영으로 데려왔습니다
  - 그들을 실로의 군막에 데려왔습니다
  lexicon: מַחֲנֶה / שִׁלֹה
  rationale: ‘진영’은 군사적 야영지 의미를 보존하고, 위치 정보를 뒤에 덧붙여 후행 절의 지리 설명을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 성적 표현을 현대어로 어느 정도 직설적으로 보존할지
  chosen_reading: ‘남자와 동침하여 남자를 알지 못한’으로, 본문의 법적·서사적 의미를 흐리지 않게 유지했습니다.
  alternative_readings:
  - ‘남자와 함께 눕지 않은’
  - ‘성관계를 하지 않은’
  rationale: 본문은 단순한 순결 수사가 아니라 전쟁 전리품 선별의 서술이므로, 관용구의 직접성을 유지하는 편이 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: '서사 본문 번역 원칙: 본문이 드러내는 사실 진술과 사회사적 의미를 보존'
