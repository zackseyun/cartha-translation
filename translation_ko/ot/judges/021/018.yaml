  rationale: 히브리어는 יכול의 직접 부정이지만, 이어지는 이유절이 서원을 제시하므로 한국어에서는 그 제약의 실질을 자연스럽게 드러내는 것이 좋습니다.
  doctrine_reference: 서원과 공동체적 책임에 대한 성경적 이해
