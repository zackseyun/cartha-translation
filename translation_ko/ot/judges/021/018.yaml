translation:
  language: ko
  text: 그런데 우리는 우리 딸들 가운데서 그들에게 아내들을 줄 수 없습니다. 이스라엘 자손이 ‘베냐민[a]에게 아내를 주는 자는 저주받은 자이다’라고 맹세했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 지파 이름 ‘베냐민’을 직접 사용합니다. 문맥상 ‘베냐민 지파에게’ 또는 ‘베냐민 사람에게’로 풀어 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
