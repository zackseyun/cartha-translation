  lexicon: HALOT
  rationale: 히브리어가 지파명을 직접 쓰므로, 본문 의미를 보존하면서 한국어 문장에서는 대상 표지를 분명히 했습니다.
theological_decisions:
- issue: 서원으로 인한 금지의 표현
  chosen_reading: ‘줄 수 없습니다’로 번역해 단순 능력 부정이 아니라 공동체적 서원 때문에 실제로 허용되지 않는 상황을 드러냈습니다.
  alternative_readings:
  - ‘줄 수 없습니다’보다 ‘줄 수 없게 되었습니다’
  - ‘주어서는 안 됩니다’
  rationale: 히브리어는 יכול의 직접 부정이지만, 이어지는 이유절이 서원을 제시하므로 한국어에서는 그 제약의 실질을 자연스럽게 드러내는 것이 좋습니다.
  doctrine_reference: 서원과 공동체적 책임에 대한 성경적 이해
