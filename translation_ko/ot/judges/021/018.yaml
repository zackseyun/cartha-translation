  text: 그런데 우리는 우리 딸들 중에서 그들에게 아내를 줄 수 없습니다[a]. 이스라엘 자손이 ‘베냐민에게 아내를 주는 자는 저주를 받을 것이다’라고 맹세했기 때문입니다.
