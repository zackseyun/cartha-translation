revisions:
- from: 그러자 온 회중이 사람을 보내고, 베냐민 자손에게 말하였습니다. 그들은 림몬의 바위에 있었습니다. 그리고 그들에게 평화를 선언하였습니다.[a]
  to: 그러자 온 회중은 림몬의 바위에 있는 베냐민 자손에게 전갈을 보내고 그들에게 말을 건네어 평화를 선포하였습니다.[a]
  rationale: 파견 대상을 ‘사람’으로 특정한 표현을 제거하고, 원문의 관계절을 베냐민 자손에 직접 연결했습니다. 또한 대안적 지명 해석을 설명하는 각주를 더 정확하고 자연스럽게 다듬었습니다. 본문의 평화 선언이라는 공적·관계적 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
