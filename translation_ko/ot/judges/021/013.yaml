id: JDG.21.13
reference: Judges 21:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יְדַבְּרוּ֙ אֶל בְּנֵ֣י בִנְיָמִ֔ן אֲשֶׁ֖ר בְּ/סֶ֣לַע רִמּ֑וֹן וַ/יִּקְרְא֥וּ לָ/הֶ֖ם שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/013.yaml
  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
  footnotes:
  - marker: a
    text: Or 'who were in Sela-rimmon'; the Hebrew may be understood either as a descriptive phrase, 'the rock of Rimmon,' or as a more fixed place-name.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 온 회중은 림몬의 바위에 있는 베냐민 자손에게 전갈을 보내고 그들에게 말을 건네어 평화를 선포하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세라-림몬에 있는’; 히브리어는 ‘림몬의 바위’라는 설명적 표현으로도, 더 고정된 지명인 ‘세라-림몬’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הָעֵדָה
  english_pob_choice: the whole congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 공동체
  lexicon: HALOT
  rationale: עֵדָה는 이스라엘의 집합된 공동체를 가리키므로, 교회 제도보다 중립적인 ‘회중’이 적절합니다. כָּל은 ‘온’으로 자연스럽게 반영했습니다.
- source_word: וַיִּשְׁלְחוּ
  english_pob_choice: sent word
  chosen_korean: 사람을 보내고
  alternatives_korean:
  - 말을 보내고
  - 전갈을 보내고
  lexicon: HALOT
  rationale: 이 동사는 단순한 발송보다 의사소통을 위한 파견을 암시하므로, 한국어에서는 자연스럽게 ‘사람을 보내고’로 풀어 옮겼습니다. 본문이 이후 곧바로 ‘말하였습니다’라고 이어져 그 기능을 드러냅니다.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  english_pob_choice: who were at the rock of Rimmon
  chosen_korean: 림몬의 바위에 있었습니다
  alternatives_korean:
  - 세라-림몬에 있었습니다
  - 세라 림몬에 있었습니다
  lexicon: HALOT
  rationale: סֶלַע는 ‘바위/절벽’이므로 기본 의미를 살려 ‘바위’로 옮겼습니다. רִמּוֹן은 지명 요소로 보아 ‘림몬의 바위’가 본문의 표면 의미를 가장 잘 드러냅니다.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  english_pob_choice: proclaimed peace to them
  chosen_korean: 그들에게 평화를 선언하였습니다
  alternatives_korean:
  - 그들에게 평화를 외쳤습니다
  - 그들에게 평화를 선포하였습니다
  - 그들에게 평화를 말하였습니다
  lexicon: HALOT
  rationale: קרא + שָׁלוֹם은 단순 대화보다 공식적인 평화 선언의 뉘앙스가 있어 ‘선언하다’로 옮겼습니다. 여기서 שָׁלוֹם은 내적 안녕보다 적대 종료와 화해의 의미가 강하므로 ‘평화’가 적절합니다.
theological_decisions:
- issue: 민족 내부 갈등 속에서의 שָׁלוֹם의 성격
  chosen_reading: 여기서 ‘평화’는 감정적 평온이 아니라 적대 관계를 멈추고 화해를 제안하는 공적 선언입니다.
  alternative_readings:
  - ‘평안’으로 옮겨 내면화된 상태를 강조하는 읽기
  - ‘화평’으로 교회적 어감을 주는 읽기
  rationale: 문맥상 베냐민 지파 생존자에게 보내는 공식 접촉이므로, 관계 회복의 제안이라는 본문 기능을 드러내야 합니다.
  doctrine_reference: 성경의 평화(שָׁלוֹם)는 관계적·언약적 차원을 포함합니다.
