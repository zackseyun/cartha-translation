  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
  footnotes:
  - marker: a
    text: Or 'everyone did what was right in his own eyes.' The Hebrew has the masculine singular 'each man,' used distributively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 이스라엘에 왕이 없었고[a], 각 사람은 자기 눈에 옳은 대로 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람이 자기 눈에 옳은 대로 행했습니다.’ 히브리어는 분배적으로 쓰인 남성 단수 ‘각 사람’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그때에는
  alternatives_korean:
  - 그 시절에는
  - 그 당시에는
  lexicon: HALOT
  rationale: 히브리어의 회상적 시간 표지를 자연스러운 현대 한국어로 옮기되, 문맥의 역사적 거리감을 유지하기 위해 ‘그때에는’으로 렌더링했습니다.
- source_word: אֵין מֶלֶךְ
  english_pob_choice: there was no king
  chosen_korean: 왕이 없었고
  alternatives_korean:
  - 왕이 없었습니다
  - 왕이 없었으므로
  lexicon: HALOT
  rationale: 존재 부정의 간단한 진술을 한국어의 평이한 서술로 살렸고, 문장 연결을 위해 뒤의 절과 이어 주는 ‘-었고’를 썼습니다.
- source_word: אִישׁ הַיָּשָׁר
  english_pob_choice: each man did what was right
  chosen_korean: 각 사람은 … 옳은 대로 행했습니다
  alternatives_korean:
  - 각 남자는 … 옳다고 여기는 대로 행했습니다
  - 사람마다 … 옳은 것을 행했습니다
  lexicon: HALOT
  rationale: 히브리어의 분배적 יח単수 ‘אִישׁ’는 영어 POB의 ‘each man’처럼 대표적 의미를 가지므로, 성별 중립화보다는 분배성을 살린 ‘각 사람’으로 옮겼습니다.
- source_word: בְּעֵינָיו יַעֲשֶׂה
  english_pob_choice: did what was right in his own eyes
  chosen_korean: 자기 눈에 옳은 대로 행했습니다
  alternatives_korean:
  - 자기 보기에는 옳은 일을 했습니다
  - 자기 생각에 옳은 대로 했습니다
  lexicon: HALOT
  rationale: ‘눈에’는 주관적 판단을 나타내는 관용구이므로 직역적 이미지를 유지한 채 한국어에서 자연한 ‘자기 눈에 옳은 대로’로 옮겼습니다.
theological_decisions:
- issue: 분배적 단수 אִישׁ의 한국어 처리
  chosen_reading: ‘각 사람’으로 옮겨, 단수형이면서도 공동체 전체를 가리키는 분배적 의미를 보존했습니다.
  alternative_readings:
  - 모든 사람
  - 사람마다
  rationale: 본문은 일반화된 공동체 묘사이지만, 히브리어는 남성 단수 대표어를 사용합니다. 이에 따라 성중립화보다 원문의 대표성을 보존하는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 본문의 평가를 해석으로 덧붙이지 않음
  chosen_reading: ‘옳은 대로 행했습니다’만 제시하고, ‘제멋대로’ 같은 평가적 강화는 넣지 않았습니다.
  alternative_readings:
  - 각자 좋을 대로 했습니다
  - 제멋대로 행했습니다
  rationale: 이 구절은 흔히 부정적 신학적 평가로 읽히지만, 히브리어 표면 의미는 각 사람이 자기 눈에 옳다고 여기는 일을 했다는 진술입니다. 그러므로 원문 이상의 해석을 얹지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
