  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
  footnotes:
  - marker: a
    text: Hebrew literally, 'since from Benjamin a woman has been destroyed,' using the singular 'woman' collectively for the women of Benjamin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 회중의 장로들이 말했습니다. 「남아 있는 사람들을 위해 우리가 아내를 어떻게 마련해야 합니까? 베냐민의 여인들은 이미 멸망했기 때문입니다」[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘베냐민에서 한 여인이 멸망했다’에 가깝지만, 여기서는 단수 ‘여인’을 집합적으로 써서 베냐민의 여인들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  english_pob_choice: the elders of the congregation
  chosen_korean: 회중의 장로들
  alternatives_korean:
  - 총회의 장로들
  - 공동체의 장로들
  lexicon: HALOT
  rationale: זִקְנֵי는 ‘장로들’이고 הָעֵדָה는 모인 공동체를 가리키므로, 교회 제도 용어보다 집합적 의미가 살아 있는 ‘회중’이 적절합니다.
- source_word: מַה נַּעֲשֶׂה
  english_pob_choice: What shall we do
  chosen_korean: 우리가 아내를 어떻게 마련해야 합니까
  alternatives_korean:
  - 우리가 무엇을 해야 합니까
  - 우리가 어떻게 해야 합니까
  lexicon: HALOT
  rationale: 단순한 행동 질문이 아니라 남은 자들을 위한 결혼 상대를 ‘어떻게 마련할지’ 묻는 맥락이므로, 의미를 분명히 하는 표현으로 옮겼습니다.
- source_word: לַנּוֹתָרִים לְנָשִׁים
  english_pob_choice: for wives for those who remain
  chosen_korean: 남아 있는 사람들을 위해 아내를
  alternatives_korean:
  - 남은 자들을 위해 아내를
  - 남아 있는 자들에게 아내를
  lexicon: HALOT
  rationale: לְנָשִׁים은 여기서 단순한 ‘여인들’이 아니라 결혼 상대인 ‘아내들’의 뜻이므로, 그 관계를 드러내는 것이 본문의 의도에 더 가깝습니다.
- source_word: מִבִּנְיָמִן אִשָּׁה
  english_pob_choice: the women of Benjamin
  chosen_korean: 베냐민의 여인들은
  alternatives_korean:
  - 베냐민에서 한 여인이
  - 베냐민의 여자는
  lexicon: HALOT
  rationale: 히브리어는 단수 ‘여인’으로 집합적 의미를 나타내지만, 한국어에서는 복수 집합을 자연스럽게 드러내는 ‘여인들’이 뜻을 잘 전달합니다.
theological_decisions:
- issue: 베냐민의 여인들이 ‘멸망했다’는 표현의 강도
  chosen_reading: 이미 멸망했기 때문입니다
  alternative_readings:
  - 이미 없어졌기 때문입니다
  - 이미 끊어졌기 때문입니다
  rationale: שׁמד의 수동형은 단순한 부재보다 파괴·전멸의 뉘앙스가 강하므로, 이를 약화하지 않고 유지했습니다.
  doctrine_reference: 본문 서술의 역사적·심판적 강도 보존
