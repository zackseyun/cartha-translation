  - severity: medium
    issue: ‘야베스 길르앗에서 온 한 사람도’의 수식 관계가 불명확함
    rationale: 원문은 ‘야베스 길르앗에서 진영/집회로 온 사람이 없었다’는 뜻입니다. 기존 표현은 ‘온’이 야베스 길르앗을 수식하는 듯 읽힐 수 있습니다.
  - severity: low
    issue: קָהָל의 ‘회중’ 선택
    rationale: 의미상 가능하지만, 이 문맥의 공적 집결을 교회적 연상 없이 나타내는 ‘집회’가 더 자연스럽고 중립적입니다.
