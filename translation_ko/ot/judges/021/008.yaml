id: JDG.21.8
reference: Judges 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
  footnotes:
  - marker: a
    text: Or 'before the LORD at Mizpah.' The Hebrew can be understood as appearing before Yahweh at the assembly site.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'not a man'; the singular masculine form emphasizes that no individual from Jabesh-gilead was present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “이스라엘 지파들 가운데 야훼께, 곧 미스바로 올라가지 않은 어느 지파가 있습니까?”[a] 그런데 보십시오. 야베스 길르앗 사람은 한 사람도 진영, 곧 집회에 오지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘미스바에서 야훼 앞에’로도 이해될 수 있습니다. 이 표현은 집회 장소인 미스바에서 야훼 앞에 나아가는 것을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘한 사람도 오지 않았다’입니다. 부정문에 쓰인 단수 남성 명사는 야베스 길르앗 출신의 개인이 한 명도 없었음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그들이 말했고
  - 그들이 말하였습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 현대 합쇼체로 옮기기 위해 평이한 과거 표현을 택했습니다.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: Which one of the tribes of Israel
  chosen_korean: 이스라엘 지파들 가운데 ... 누구입니까
  alternatives_korean:
  - 이스라엘 지파들 중 누구입니까
  - 이스라엘의 어느 지파입니까
  lexicon: HALOT
  rationale: מִן의 선택적 의미를 살려 '가운데'로 옮기고, 단수적 질문의 초점을 '누구'로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: 프로젝트 기본어휘에 따라 신명은 학술 음역 '야훼'를 사용해 원문 고유명을 보존했습니다.
- source_word: לֹא בָא אִישׁ
  english_pob_choice: not a man had come
  chosen_korean: 한 사람도 ... 오지 않았습니다
  alternatives_korean:
  - 사람 한 명도 오지 않았습니다
  - 어느 남자도 오지 않았습니다
  lexicon: HALOT
  rationale: 부정문 속 단수 명사 אִישׁ의 강조를 살리면서 한국어에서는 자연스럽게 '한 사람도'로 표현했습니다.
- source_word: הַמַּחֲנֶה / הַקָּהָל
  english_pob_choice: the camp, to the assembly
  chosen_korean: 진영, 곧 회중
  alternatives_korean:
  - 진영, 곧 모임
  - 진영, 곧 집회
  lexicon: HALOT
  rationale: מַחֲנֶה는 군사적·공동체적 '진영'으로, קָהָל은 교회적 뉘앙스를 피한 공적 모임인 '회중'으로 옮겼습니다.
theological_decisions:
- issue: 야훼께 올라가다의 방향성
  chosen_reading: '''야훼께 ... 올라가지 않은''으로 직역해 제의적 ''상경/출석''의 의미를 보존했습니다.'
  alternative_readings:
  - '''야훼 앞에 나아가지 않은'''
  - '''야훼께 예배하러 가지 않은'''
  rationale: 히브리어 אֶל יְהוָה는 단순 이동보다 언약적 회집에 참여하는 방향을 가리키므로, 이를 약화시키지 않도록 직접적으로 살렸습니다.
  doctrine_reference: Judges 21:8 source-language syntax
- issue: 거룩한 회집의 번역
  chosen_reading: קָהָל을 '회중'으로 옮겨 종교 기관명보다 모인 공동체 자체를 드러냈습니다.
  alternative_readings:
  - 교회
  - 공동체
  rationale: 본문은 후대 교회 제도보다 이스라엘의 공적 집회를 가리키므로, '회중'이 가장 무난하게 원문의 집합성을 전달합니다.
  doctrine_reference: 'POB glossary: ἐκκλησία / קָהָל rendering policy'
