translation:
  language: ko
  text: 이스라엘 남자들은 미스바에서 맹세하여 말했습니다. “우리 가운데 누구도 자기 딸을 베냐민에게[a] 아내로 주어서는 안 됩니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘베냐민에게’는 ‘베냐민 지파에게’ 또는 ‘베냐민 사람에게’를 뜻할 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  english_pob_choice: Now the men of Israel
  chosen_korean: 이스라엘의 남자들은
  alternatives_korean:
  - 이스라엘 백성은
  - 이스라엘 사람들은
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 자연스러운 복수로 옮기되, 맹세를 한 남성 집단이라는 문맥을 살려 ‘남자들’로 번역했습니다.
- source_word: נִשְׁבַּע
  english_pob_choice: had sworn
  chosen_korean: 맹세하여
  alternatives_korean:
  - 맹세했습니다
  - 서약했습니다
  lexicon: HALOT
  rationale: 동사 자체보다 맹세 행위의 결과를 앞세우는 한국어 구문이 더 자연스러워, 서술과 인용을 잇는 방식으로 처리했습니다.
- source_word: בַּמִּצְפָּה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바에서
  alternatives_korean:
  - 미스바에서
  - 미스바에
  lexicon: HALOT
  rationale: 장소 전치사는 한국어에서 보통 ‘-에서’가 가장 자연스럽고, 맹세가 이루어진 장소를 분명히 드러냅니다.
- source_word: אִישׁ מִמֶּנּוּ לֹא יִתֵּן בִּתּוֹ לְבִנְיָמִן לְאִשָּׁה
  english_pob_choice: No man among us shall give his daughter to Benjamin as a wife.
  chosen_korean: 우리 가운데 누구도 자기 딸을 베냐민에게 아내로 주어서는 안 됩니다
  alternatives_korean:
  - 우리 가운데 아무도 자기 딸을 베냐민에게 주어서는 안 됩니다
  - 우리 가운데 누구도 자기 딸을 베냐민 사람에게 아내로 주어서는 안 됩니다
  lexicon: HALOT
  rationale: ‘give...as a wife’의 혼인 관용구를 살려 ‘아내로 주다’로 옮겼고, 히브리어의 부족명 ‘베냐민’을 그대로 유지해 문맥상의 지파 지칭을 드러냈습니다.
