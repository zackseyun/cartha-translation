translation:
  language: ko
  text: 그리고 그들이 말했습니다. 「왜, 야훼, 이스라엘의 하나님이시여, 이 일이 이스라엘에서 일어났습니까? 오늘 이스라엘에서 한 지파가 빠지게 되었기 때문입니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘에서 이 일이 있었습니까’이며, 관용적으로는 ‘이 일이 이스라엘에서 일어났습니까’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘오늘 이스라엘에서 한 지파가 빠지게 되었기 때문입니다’.
    reason: lexical_alternative
