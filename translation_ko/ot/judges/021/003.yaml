revisions:
- from: 그리고 그들이 말했습니다. 「왜, 야훼, 이스라엘의 하나님이시여, 이 일이 이스라엘에서 일어났습니까? 오늘 이스라엘에서 한 지파가 빠지게 되었기 때문입니다」[a][b]
  to: 그들은 말했습니다. “왜, 야훼, 이스라엘의 하나님이시여, 이런 일이 이스라엘에서 일어나[a] 오늘 이스라엘에서 한 지파가 없어지게 되었습니까?[b]”
  rationale: 원문의 질문 구조를 보존하도록 후반절의 인과 표현을 제거하고, ‘왜’가 ‘이런 일이 일어나 오늘 한 지파가 없어지게 되었는가’ 전체를 묻도록 고쳤습니다. ‘없어지게 되다’는 נִפְעַל 동사의 공동체로부터의 부재·결여 의미를 자연스럽게 전달하며, 특정 신학적 해석을 더하지 않습니다. 각주 표지도 해당 표현 뒤에 배치하고, 중복된 각주 b를 실제 번역 대안으로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:11Z'
