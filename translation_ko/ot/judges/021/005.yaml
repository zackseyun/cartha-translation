  to: 이스라엘 자손이 말했습니다. “이스라엘의 모든 지파 가운데 야훼께로 올라가 회중에 참여하지 않은 사람이 누구입니까?” 이는 미스바에서 야훼께로 올라오지 않은 사람에 대하여 큰 맹세가 있었기 때문입니다. “그는 반드시 죽임을 당할 것입니다.”
  rationale: 원문의 두 절 구조를 유지했습니다. 첫째, 이스라엘 자손이 모든 지파 중 회중에 참여하지 않은 자를 묻습니다. 둘째, 그러한 자, 곧 미스바에서 야훼께로 올라오지 않은 자에게 적용된 큰 맹세의 사형 조항을 제시합니다. ‘올라가 회중에 참여하다’는 한국어 문장 안에서 עלה, קהל, אֶל יְהוָה의 관계를 가능한 한 명료하게 반영한 표현입니다.
