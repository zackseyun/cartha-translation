  text: 이스라엘 자손이 말했습니다. “이스라엘의 모든 지파 가운데 야훼께로 올라가 회중에 참여하지 않은 사람이 누구입니까?” 이는 미스바에서 야훼께로 올라오지 않은 사람에 대하여 큰 맹세가 있었기 때문입니다. “그는 반드시 죽임을 당할 것입니다.”
