  text: וַ/יִּתְפָּקֵ֖ד הָ/עָ֑ם וְ/הִנֵּ֤ה אֵֽין שָׁם֙ אִ֔ישׁ מִ/יּוֹשְׁבֵ֖י יָבֵ֥שׁ גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
  footnotes:
  - marker: a
    text: Or, 'there was no one there from the inhabitants of Jabesh-gilead.' The Hebrew more literally says, 'there was not a man there,' using masculine language that likely reflects the representative or military context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성이 소집되었는데, 보십시오, 그곳에 길르앗 야베스 주민 가운데 한 사람도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “길르앗 야베스 주민 가운데 아무도 없었습니다.” 히브리어는 문자적으로 “거기에 남자가 없었습니다”라고 말하며, 남성형 표현은 대표적·군사적 맥락을 반영할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  english_pob_choice: were mustered
  chosen_korean: 소집되었는데
  alternatives_korean:
  - 계수되었는데
  - 점호되었는데
  - 소집되어 조사되었는데
  lexicon: HALOT
  rationale: פקד의 이 문맥은 단순한 숫자 셈보다 군사적·공동체적 소집/점검의 뉘앙스가 강하므로, 한국어에서는 ‘소집되다’가 가장 자연스럽고 본문의 흐름도 잘 드러냅니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 군대
  - 회중
  lexicon: HALOT
  rationale: 문맥상 이스라엘의 집합체를 가리키지만, 영어 POB의 ‘the people’을 살려 ‘백성’으로 옮기면 과도한 군사화 없이 공동체 전체를 나타낼 수 있습니다.
- source_word: אֵין שָׁם אִישׁ
  english_pob_choice: there was not a man there
  chosen_korean: 한 사람도 없었습니다
  alternatives_korean:
  - 남자가 하나도 없었습니다
  - 사람이 하나도 없었습니다
  - 거기에 남자가 없었습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘남자’(אִישׁ)를 쓰지만, 여기서는 존재 부정의 결과를 자연스럽게 전달하는 한국어가 필요하므로 본문 의미를 해치지 않는 범위에서 ‘한 사람도 없었습니다’로 옮겼습니다.
- source_word: מִיּוֹשְׁבֵי יָבֵשׁ גִּלְעָד
  english_pob_choice: from the inhabitants of Jabesh-gilead
  chosen_korean: 길르앗 야베스 주민 가운데
  alternatives_korean:
  - 길르앗 야베스의 거주자들 가운데
  - 길르앗 야베스에 사는 사람들 가운데
  lexicon: HALOT
  rationale: מִן + 분사는 ‘~중에서’의 범위를 나타내므로 ‘주민 가운데’가 가장 간결하고 정확합니다. 지명은 한국어 성서 관용에 따라 ‘길르앗 야베스’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 남성 명사 אִישׁ의 처리
  chosen_reading: 본문의 남성형을 직역으로 과도하게 밀지 않고, 한국어에서는 대표적·군사적 맥락을 살린 포괄 표현으로 옮겼습니다.
  alternative_readings:
  - 남자가 없었습니다
  - 남자 한 명도 없었습니다
  rationale: 영어 POB 주석이 지적하듯 이 남성어는 대표성/군사적 맥락을 반영할 가능성이 크므로, 한국어에서는 성별 정보를 불필요하게 부각하기보다 출석 부재라는 서술 기능을 살리는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 성경 번역의 문맥 충실성 및 성별 표지 처리 원칙
- issue: 소집/점검의 군사적 뉘앙스
  chosen_reading: ‘소집되었는데’로 옮겨 군사적 점호와 공동체적 확인의 이중 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 계수되었는데
  - 점호되었는데
  rationale: 사사기 21장의 문맥은 전투와 관련된 공동체적 조사이므로, 단순한 수치 계산보다 인원 확인을 암시하는 표현이 본문 흐름에 더 적합합니다.
  doctrine_reference: 본문 문맥과 서사 기능 보존
