revisions:
- from: 그리고 보십시오. 시लो의 딸들이 춤추는 춤판으로 나올 때, 포도원에서 나와 각자 시לו의 딸들 가운데서 자기 아내를 붙잡아 가지고 베냐민 땅으로 가십시오.[a]
  to: 잘 살펴보십시오. 만일 실로의 딸들이 춤추러 나오면, 포도원에서 나와 각자 실로의 딸들 가운데서 한 사람씩 붙잡아 데려가십시오[a]. 그리고 그들을 아내로 삼고 베냐민 땅으로 가십시오.
  rationale: 원문의 조건문(אִם), 주의 환기, 포도원에서 나오는 동작, 각 사람에게 하나씩 해당하는 분배성, חטף의 강제적 취함, 그리고 베냐민 땅으로 가라는 명령 순서를 보존했습니다. ‘그들을 아내로 삼고’는 히브리어 ‘각자 자기 아내를’이 이 문맥에서 나타내는 결과를 자연스러운 한국어로 명료화한 것이며, 교리적 해석을 추가하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:20Z'
