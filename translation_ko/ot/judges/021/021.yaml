  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
  footnotes:
  - marker: a
    text: Or 'snatch' or 'carry off'; the Hebrew verb denotes forceful taking.
    reason: lexical_alternative
translation:
  language: ko
  text: 잘 살펴보십시오. 만일 실로의 딸들이 춤추러 나오면, 포도원에서 나와 각자 실로의 딸들 가운데서 한 사람씩 붙잡아 데려가십시오[a]. 그리고 그들을 아내로 삼고 베냐민 땅으로 가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빼앗아’, ‘납치하여’로 옮길 수 있습니다. 히브리어 동사는 강제로 붙잡아 취하는 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְאִיתֶם וְהִנֵּה
  english_pob_choice: Watch, and behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보십시오, 보십시오
  lexicon: HALOT
  rationale: 두 동사는 청자에게 주의를 환기하는 연속 명령이므로, 한국어에서는 자연스럽게 합쳐 ‘그리고 보십시오’로 옮겨 긴박한 경고·지시의 효과를 살렸습니다.
- source_word: יֵצְאוּ ... לָחוּל בַּמְּחֹלוֹת
  english_pob_choice: come out to dance in the dances
  chosen_korean: 춤추는 춤판으로 나올 때
  alternatives_korean:
  - 춤추기 위해 나올 때
  - 춤으로 나올 때
  - 춤판에 나올 때
  lexicon: HALOT
  rationale: 문맥상 단순한 이동이 아니라 집단적 춤의 장면이므로, 동작과 장면성을 함께 드러내는 표현으로 옮겼습니다.
- source_word: וַחֲטַפְתֶּם
  english_pob_choice: seize
  chosen_korean: 붙잡아 가지고
  alternatives_korean:
  - 붙잡아
  - 빼앗아
  - 납치하여
  lexicon: HALOT
  rationale: 히브리어는 강제적 탈취를 뜻하지만, 본문 흐름상 한국어 본문에는 지나친 법률 용어를 넣지 않고 힘을 드러내는 ‘붙잡아 가지고’를 택했습니다. 더 강한 뉘앙스는 주석 없이도 원문의 폭력성을 보존합니다.
- source_word: אִישׁ אִשְׁתּוֹ מִבְּנוֹת שִׁילוֹ
  english_pob_choice: each man his wife from the daughters of Shiloh
  chosen_korean: 각자 시לו의 딸들 가운데서 자기 아내를
  alternatives_korean:
  - 각 사람 시לו의 딸들 가운데서 자기 아내를
  - 각 남자 자기 아내를 시לו의 딸들 가운데서
  lexicon: HALOT
  rationale: 히브리어의 분배적 구조를 살리기 위해 ‘각자 … 자기 아내’로 옮겼고, ‘딸들 가운데서’로 선택의 출처를 분명히 했습니다.
theological_decisions:
- issue: 본문의 폭력적 행위 서술을 어떻게 드러낼 것인가
  chosen_reading: ‘붙잡아 가지고’로 본문 본연의 강제성을 드러내되, 현대 법률·윤리 범주인 ‘납치’는 본문 본문 텍스트에 직접 삽입하지 않았습니다.
  alternative_readings:
  - 납치하여
  - 강제로 데려가
  - 데려가
  rationale: 히브리어 חטף의 강제적 취지는 보존해야 하지만, 번역 본문은 원문이 말하는 행위를 넘어서 해설적으로 규정하지 않아야 합니다.
  doctrine_reference: 'Translation philosophy: source-direct rendering and lexical audibility'
