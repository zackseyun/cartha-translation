source:
  edition: WLC
  text: וַ/יֹּאמַ֕ר אַחַ֥/י בְּנֵֽי אִמִּ֖/י הֵ֑ם חַי יְהוָ֗ה ל֚וּ הַחֲיִתֶ֣ם אוֹתָ֔/ם לֹ֥א הָרַ֖גְתִּי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
  footnotes:
  - marker: a
    text: Or, “I would not have killed you.” The Hebrew counterfactual can be represented this way in English.
    reason: lexical_alternative
  - marker: b
    text: “The sons of my mother” means his full brothers, not merely kinsmen.
    reason: cultural_note
translation:
  language: ko
  text: 그가 말했습니다. 「그들은 내 어머니의 아들들, 곧 내 형제들이었습니다. 야훼께서 살아 계심을 두고 맹세하건대, 여러분이 그들을 살려 두었더라면 저는 여러분을 죽이지 않았을 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “내 어머니의 아들들”은 단순한 친족이 아니라 친형제를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 반사실 조건을 나타내며, 한국어로는 ‘-았더라면 … -지 않았을 것입니다’로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 말하였습니다
  - 그가 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 와우 연속의 평범한 발화 도입으로, 한국어에서는 자연스러운 과거 서술로 옮겼습니다.
- source_word: אַחַי בְּנֵֽי אִמִּי הֵם
  english_pob_choice: They were my brothers, the sons of my mother
  chosen_korean: 그들은 내 어머니의 아들들, 곧 내 형제들이었습니다
  alternatives_korean:
  - 그들은 내 어머니의 아들들입니다
  - 그들은 내 형제들, 내 어머니의 아들들이었습니다
  lexicon: HALOT
  rationale: ‘내 어머니의 아들들’이 곧 친형제임을 드러내기 위해 설명적 동격으로 풀되, 친족 관계의 강한 강조를 살렸습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세하건대
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 삶을 두고
  lexicon: HALOT
  rationale: 히브리어의 전형적 맹세 공식이므로 단순 진술보다 한국어의 서약 표현으로 옮겨 그 엄숙한 기능을 살렸습니다.
- source_word: לוּ ... לֹא
  english_pob_choice: if you had let them live ... I would not have killed you
  chosen_korean: 여러분이 그들을 살려 두었더라면 저는 여러분을 죽이지 않았을 것입니다
  alternatives_korean:
  - 여러분이 그들을 살려 두었더라면 저는 여러분을 죽이지 않을 것입니다
  - 여러분이 그들을 살려 두었더라면 저는 여러분을 죽이지 않았겠습니다
  lexicon: HALOT
  rationale: לוּ가 이끄는 반사실 조건과 뒤따르는 결과절을 한국어의 ‘-았더라면 … -지 않았을 것입니다’로 자연스럽게 재현했습니다.
