  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
  footnotes:
  - marker: a
    text: 'Or ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 야훼 그들의 하나님을 기억하지 않았습니다. 그분은 그들을 사방에 있는 모든 원수의 손에서 구원하신 분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역이며, 더 관용적인 뜻은 ‘이스라엘 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא זָכְרוּ
  english_pob_choice: And the sons of Israel did not remember
  chosen_korean: 기억하지 않았습니다
  alternatives_korean:
  - 생각해 내지 않았습니다
  - 기억해 내지 않았습니다
  lexicon: HALOT
  rationale: זכר는 단순한 회상이 아니라 언약적 기억의 결여를 뜻하므로, 현대 한국어에서는 가장 직접적인 ‘기억하지 않았다’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 살리되, 한국어에서는 관용적으로도 자연스러운 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 언약 이름을 직역 관행 대신 음역형 ‘야훼’로 반영했습니다.
- source_word: הַמַּצִּיל
  english_pob_choice: who had delivered
  chosen_korean: 구원하신 분
  alternatives_korean:
  - 건져 주신 분
  - 구해 주신 분
  - 구원하시는 분
  lexicon: HALOT
  rationale: 분사형은 야훼를 그의 구원 행위로 규정하므로, 한국어에서는 관계절보다 명사화된 ‘구원하신 분’이 문맥상 더 압축적이고 분명합니다.
- source_word: מִיַּד כָּל אֹיְבֵיהֶם מִסָּבִיב
  english_pob_choice: from the hand of all their enemies all around
  chosen_korean: 사방에 있는 모든 원수의 손에서
  alternatives_korean:
  - 둘러싼 모든 원수의 손에서
  - 모든 적의 손아귀에서
  lexicon: HALOT
  rationale: ‘손’ 이미지를 유지해 억압·통제의 비유를 살렸고, מִסָּבִיב는 자연스러운 현대어로 ‘사방에 있는’으로 풀었습니다.
theological_decisions:
- issue: YHWH의 번역어
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 인칭 이름 יְהוָה를 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 고유명사로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 기억하지 않음의 신학적 함의
  chosen_reading: 언약적 기억의 상실을 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 망각
  - 인지 실패
  rationale: 문맥상 출애굽·구원 행위를 잊는 것은 관계적 불충실을 함축하므로, 이를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 헤세드/기억 모티프에 대한 서술적 주해 원리
