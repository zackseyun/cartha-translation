  - severity: low
    issue: 관계 분사구문의 문장 분리
    rationale: ‘그분은 … 구원하신 분입니다’도 의미상 가능하지만, 원문의 ‘그들을 구원하신 그들의 하나님 야훼’를 한 문장으로 연결하면 야훼를 규정하는 히브리어 분사구문의 기능을 더 잘 보존합니다.
  - severity: low
