base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
  footnotes:
  - marker: a
    text: Or, 'We will surely give' or 'We will certainly give.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the cloak' (or 'garment'), spread out to receive the rings.
    reason: cultural_note
  - marker: c
    text: '''Earring'' could more generally be ''ring''; in some contexts the Hebrew term can refer to a nose-ring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “우리는 반드시 주겠습니다.” 그들은 그 겉옷[b]을 펼쳐 놓았고, 각 사람이 자기 전리품 가운데서 귀고리[c] 하나를 그곳에 던졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 유한동사를 함께 써서, 단순한 미래 표현보다 강한 강조를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 겉옷’ 또는 ‘그 외투’라고 되어 있습니다. 이것을 펼쳐 고리들을 받았습니다.
    reason: cultural_note
  - marker: c
    text: ‘귀고리’는 더 넓게는 ‘고리’를 뜻할 수 있으며, 문맥에 따라서는 ‘코고리’를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  english_pob_choice: We will surely give them
  chosen_korean: 우리는 반드시 주겠습니다
  alternatives_korean:
  - 우리는 틀림없이 주겠습니다
  - 우리는 꼭 주겠습니다
  - 주기를 주겠습니다
  lexicon: HALOT
  rationale: 부정사 절대형과 동사의 결합이 강조를 나타내므로, 한국어에서는 의미를 과장하지 않으면서도 확정적 약속을 드러내는 ‘반드시’로 옮겼습니다.
- source_word: הַשִּׂמְלָה
  english_pob_choice: the cloak
  chosen_korean: 그 옷감
  alternatives_korean:
  - 그 망토
  - 그 겉옷
  - 그 옷
  lexicon: HALOT
  rationale: שִׂמְלָה는 일반적으로 옷감/겉옷을 가리키며, 여기서는 물건을 받기 위해 펼쳐 놓는 용도이므로 기능을 살린 ‘옷감’을 택했습니다.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  english_pob_choice: threw there
  chosen_korean: 거기에 ... 던졌습니다
  alternatives_korean:
  - 거기에 ... 던져 넣었습니다
  - 거기에 ... 던졌습니다
  - 거기에 ... 내던졌습니다
  lexicon: HALOT
  rationale: שלך는 단순히 놓는 것이 아니라 던지거나 내던지는 동작이므로, ‘던졌습니다’로 직역에 가깝게 유지했습니다.
- source_word: נֶזֶם
  english_pob_choice: an earring
  chosen_korean: 귀고리
  alternatives_korean:
  - 귀걸이
  - 코걸이
  - 반지
  lexicon: HALOT
  rationale: 이 문맥은 기드온의 앞선 요구와 전리품 맥락상 귀에 다는 장신구를 뜻하므로, 오늘날 한국어에서 가장 자연스러운 ‘귀고리’를 사용했습니다.
