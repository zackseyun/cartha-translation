base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Now Gideon had seventy sons[a], his own offspring, because he had many wives.
  footnotes:
  - marker: a
    text: Literally, 'those who came out of his loins,' an idiom for his biological offspring.
    reason: lexical_alternative
translation:
  language: ko
  text: 기드온에게는 일흔 아들, 곧 그의 허리에서 나온 자들이 있었습니다. 그에게는 많은 아내들이 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘허리에서 나온 자들’이라는 뜻이며 생물학적 자녀를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן / הָיוּ
  english_pob_choice: Now Gideon had
  chosen_korean: 기드온에게는 … 있었습니다
  alternatives_korean:
  - 그리고 기드온에게는 … 있었습니다
  - 기드온에게는 … 있었습니다
  lexicon: HALOT
  rationale: ל + היה의 소유 표현을 한국어 소유구문으로 자연스럽게 옮기되, 담화 연결감은 문맥상 충분히 유지됩니다.
- source_word: שִׁבְעִים בָּנִים
  english_pob_choice: seventy sons
  chosen_korean: 일흔 아들
  alternatives_korean:
  - 일흔 자녀
  - 일흔 아들들
  lexicon: HALOT
  rationale: בנים은 여기서 성별이 분명한 ‘아들’이므로, 일반적인 ‘자녀’보다 원문 의미를 더 정확히 반영합니다.
- source_word: יֹצְאֵי יְרֵכוֹ
  english_pob_choice: his own offspring
  chosen_korean: 그의 허리에서 나온 자들
  alternatives_korean:
  - 그의 몸에서 나온 자들
  - 그의 생물학적 자손
  lexicon: HALOT
  rationale: 직역하면 ‘그의 넓적다리/허리에서 나온 자들’이라는 관용구로, 혈연적 자녀를 뜻하는 표현입니다. 한국어에서는 의미를 살리면서도 자연스러운 ‘허리에서 나온 자들’을 택했습니다.
- source_word: נָשִׁים רַבּוֹת
  english_pob_choice: many wives
  chosen_korean: 많은 아내들
  alternatives_korean:
  - 많은 여자들
  - 여러 아내들
  lexicon: HALOT
  rationale: 문맥상 נשים은 단순한 ‘여자들’이 아니라 결혼 관계의 ‘아내들’입니다. 수량도 원문처럼 복수의 다수를 드러내기 위해 ‘많은’을 유지했습니다.
theological_decisions:
- issue: 기드온의 다처/다배우자 상태를 어떻게 처리할 것인가
  chosen_reading: 서술적으로만 옮기고, 평가나 윤리적 해설은 덧붙이지 않았습니다.
  alternative_readings:
  - 암시적으로 비판적 표현을 추가함
  - 완곡하게 ‘여자들’로 바꿈
  rationale: 본문은 기드온의 가정 상황을 사실로 보고할 뿐 명시적 평가를 제시하지 않습니다. 번역은 원문이 말하는 범위를 넘어서지 않아야 합니다.
  doctrine_reference: 'Translation philosophy: source text''s plain sense without importing unstated judgment.'
