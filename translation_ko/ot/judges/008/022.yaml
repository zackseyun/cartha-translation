translation:
  language: ko
  text: 그때 이스라엘 사람들이 기드온에게 말했습니다. “당신과 당신의 아들, 그리고 당신의 손자까지 우리를 다스리십시오. 당신이 미디안의 손에서 우리를 구하셨기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신, 당신의 아들, 그리고 당신의 아들의 아들까지도’입니다. 히브리어는 연속된 세대를 분명히 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
