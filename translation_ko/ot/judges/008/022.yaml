  lexicon: HALOT
  rationale: 이 표현은 단수형처럼 보이지만 집합적으로 쓰였으므로, 현대 한국어에서는 의미를 자연스럽게 살린 복수 집합 표현이 적절합니다.
- source_word: מְשָׁל בָּנוּ
  english_pob_choice: Rule over us
  chosen_korean: 우리를 다스리십시오
