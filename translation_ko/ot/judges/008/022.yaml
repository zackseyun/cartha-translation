  lexicon: HALOT
  rationale: מָשַׁל의 문맥상 요청은 정치적 통치 요청이므로, 위계와 명령성을 함께 담는 ‘다스리십시오’가 가장 자연스럽습니다.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  english_pob_choice: you, your son, and your grandson as well
  chosen_korean: 당신과 당신의 아들, 그리고 당신의 손자까지
  alternatives_korean:
  - 당신과 당신의 아들, 그리고 당신의 아들의 아들까지
  - 당신과 당신의 아들, 그리고 당신의 손자 또한
  lexicon: HALOT
  rationale: 반복된 גַּם은 세대가 이어지는 추가를 강조하므로, ‘까지’로 범위를 넓히는 느낌을 살리되 혈통의 연속을 분명히 했습니다.
- source_word: מִיַּד מִדְיָן
  english_pob_choice: from the hand of Midian
  chosen_korean: 미디안의 손에서
  alternatives_korean:
  - 미디안의 권세에서
  - 미디안의 손아귀에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려, 구출의 대상이 된 권세/지배의 이미지를 유지했습니다.
theological_decisions:
- issue: 기드온의 역할 요청이 단순한 지도력이 아니라 세습적 통치를 뜻하는지
  chosen_reading: 본문의 ‘우리를 다스리십시오’는 기드온 개인뿐 아니라 아들, 손자까지 포함하는 지속적 통치 요청으로 읽었습니다.
  alternative_readings:
  - 일시적인 군사 지도 요청으로 완화하는 읽기
  rationale: 히브리어의 통치 명령과 이어지는 세대 열거가 함께 작동해, 일시적 리더십보다 세습적 정치 권위를 요청하는 의미가 드러납니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
