  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: WLC / narrative waw-consecutive
  rationale: 와우 연속형은 서사를 이어 주는 기능이므로, 한국어에서도 시간적 전개를 자연스럽게 드러내는 ‘그때’로 옮겼습니다.
