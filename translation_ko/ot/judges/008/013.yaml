language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֛שָׁב גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ מִן הַ/מִּלְחָמָ֑ה מִֽ/לְ/מַעֲלֵ֖ה הֶ/חָֽרֶס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/013.yaml
  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
  footnotes:
  - marker: a
    text: Or possibly, 'from the ascent of the sun.' The Hebrew phrase is difficult, and הֶחָרֶס may be understood as a place name ('Heres') or as 'the sun.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 기드온—요아스의 아들—이 전투에서 헤레스의 오르막길로부터 돌아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘태양의 오르막길에서’일 수 있습니다. 히브리어 구절은 어려우며, הֶחָרֶס는 지명 ‘헤레스’로도, ‘태양’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: Then ... returned
  chosen_korean: 그때 … 돌아왔습니다
  alternatives_korean:
  - 그리고 … 돌아왔습니다
  - 그다음 … 돌아왔습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 자연스러운 한국어 과거 서사로 옮기기 위해 ‘그때’를 붙여 흐름을 살리고, 기본 동작은 ‘돌아왔습니다’로 직역에 가깝게 살렸습니다.
- source_word: בֶּן יוֹאָשׁ
  english_pob_choice: son of Joash
  chosen_korean: 요아스의 아들
  alternatives_korean:
  - 요아스의 아들인
  - 요아스의 아들입니다
  lexicon: 문법적 친족관계 표현
  rationale: 히브리어의 부자 관계를 한국어 소유격 구조로 직접 옮겨 인물 식별 기능을 보존했습니다.
- source_word: מִן הַמִּלְחָמָה
  english_pob_choice: from the battle
  chosen_korean: 전투에서
  alternatives_korean:
  - 전쟁에서
  - 전쟁터에서
  lexicon: HALOT
  rationale: 문맥상 일반적 ‘전쟁’보다 특정한 전투 상황이므로 ‘전투’가 더 정확하며, מִן은 출발점을 드러내는 조사로 자연스럽게 처리했습니다.
- source_word: מִלְמַעֲלֵה הֶחָרֶס
  english_pob_choice: by the ascent of Heres
  chosen_korean: 헤레스의 오르막길로부터
  alternatives_korean:
  - 헤레스의 오르막길을 통해
  - 헤레스의 비탈에서
  lexicon: HALOT
  rationale: 지형·경로 표현을 살리기 위해 ‘오르막길’로 옮기고, 본문의 지명 가능성을 따라 ‘헤레스’를 음역했습니다.
theological_decisions:
- issue: הֶחָרֶס의 지명 여부와 ‘태양’ 가능성
  chosen_reading: 본문은 ‘헤레스’라는 지명으로 두되, 대안 해석인 ‘태양’은 각주로 보존합니다.
  alternative_readings:
  - ‘태양에서/태양의 오르막길에서’로 이해
  - 지명 대신 일반 명사로 해석
  rationale: 히브리어 형태는 지명과 일반 명사 ‘태양’ 둘 다 가능해 번역 본문에서 하나로 단정하지 않고, POB의 축약 각주 방식으로 의미 긴장을 유지했습니다.
  doctrine_reference: 텍스트 비평/해석학적 불확실성 보존
