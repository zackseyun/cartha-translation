    rationale: 원문은 기드온이 광야의 가시와 바르코님을 처벌의 도구로 사용하여 상대의 살을 ‘타작한다’는 뜻입니다. 한국어에서는 도구격 조사 ‘-로’를 써야 행위자와 수단의 관계가 보존됩니다.
