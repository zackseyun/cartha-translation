base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
  footnotes:
  - marker: a
    text: Or “with brambles”; the precise plant named by the Hebrew term is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 기드온이 말했습니다. 「그러므로 야훼께서 세바와 살문나를 내 손에 넘겨주실 때, 나는 광야의 가시와 들풀이 너희의 살을 타작하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들풀’은 히브리어의 불확정적 가시 식물을 포괄적으로 옮긴 것입니다. 정확한 식물명은 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그렇기 때문에
  lexicon: HALOT
  rationale: 앞선 거절에 대한 기드온의 대응이라는 결론적·연결적 의미를 살리기 위해, 문어체에서 자연스러운 ‘그러므로’를 택했습니다.
- source_word: בְּתֵת יְהוָה
  english_pob_choice: when Yahweh gives
  chosen_korean: 야훼께서 … 넘겨주실 때
  alternatives_korean:
  - 야훼께서 … 주실 때
  - 야훼가 … 주실 때
  lexicon: HALOT
  rationale: 미래의 조건절을 한국어답게 풀어 ‘~주실 때’로 옮기되, 단순한 소유 이전이 아니라 적에게 넘어가는 의미가 강하므로 ‘넘겨주실 때’로 구체화했습니다.
- source_word: בְּיָדִי
  english_pob_choice: into my hand
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 손 안에
  - 내 권세 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 한국어에서도 ‘손에’가 권력·지배의 관용적 의미를 유지합니다.
- source_word: וְדַשְׁתִּי
  english_pob_choice: I will thresh
  chosen_korean: 타작하겠습니다
  alternatives_korean:
  - 짓밟겠습니다
  - 부서뜨리겠습니다
  lexicon: HALOT
  rationale: 동사의 본래 농경적 이미지를 살려 ‘타작하다’를 유지하면, 단순한 폭행보다 더 잔혹한 은유가 드러납니다.
- source_word: קוֹצֵי הַמִּדְבָּר וְאֶת הַבַּרְקֳנִים
  english_pob_choice: the thorns of the wilderness and with briers
  chosen_korean: 광야의 가시와 들풀
  alternatives_korean:
  - 광야의 가시와 찔레
  - 광야의 가시덤불과 가시나무
  lexicon: HALOT
  rationale: 히브리어의 두 식물명은 모두 날카롭고 해로운 잡초 계열로, 세부 종을 단정하기보다 상처를 주는 식생이라는 공통 효과를 살려 ‘가시와 들풀’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: YHWH를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 번역 프로젝트의 기본 원칙에 따라 신명기적 언약명인 יהוה를 음역해, 익숙한 교회용 대치어보다 원문 표지를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 기드온의 발화 등록
  chosen_reading: 직접 인용문 안에서는 예언적/서사적 위협의 말투를 유지했습니다.
  alternative_readings:
  - 완곡한 서술체로 재진술
  - 현대적 비격식체
  rationale: 히브리어의 강한 협박적 어조를 약화하지 않기 위해, 한국어에서도 단호한 예고형 표현을 유지했습니다.
  doctrine_reference: Source rhetoric preservation
