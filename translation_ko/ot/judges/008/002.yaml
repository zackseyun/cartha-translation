  rationale: 통용되는 성경 지명을 따라 음역했습니다.
- source_word: מִבְצִיר אֲבִיעֶזֶר
  english_pob_choice: the grape harvest of Abiezer
  chosen_korean: 아비에셀의 포도 수확
  alternatives_korean:
  - 아비에셀의 포도추수
