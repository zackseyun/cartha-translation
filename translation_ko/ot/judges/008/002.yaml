  text: 그러나 그가 그들에게 말했습니다. “내가 지금 여러분과 비교해 무엇을 했습니까? 에브라임의 이삭줍는 것이 아비에셀의 포도 수확보다 더 낫지 않습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에브라임의 이삭줍는 것이 아비에셀의 포도 수확보다 더 낫지 않습니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  english_pob_choice: But he said to them
  chosen_korean: 그러나 그가 그들에게 말했습니다
  alternatives_korean:
  - 그가 그들에게 말했습니다
  - 그리고 그가 그들에게 말했습니다
  lexicon: WLC + narrative discourse
  rationale: 대화의 긴장 속에서 역접을 살리기 위해 ‘그러나’를 두었고, וַיֹּאמֶר의 서사 진행은 자연스러운 과거 서술로 처리했습니다.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  english_pob_choice: What have I done now compared to you?
  chosen_korean: 내가 지금 여러분과 비교해 무엇을 했습니까?
  alternatives_korean:
  - 내가 지금 여러분처럼 무엇을 했습니까?
  - 내가 지금 여러분에 비해 무엇을 했습니까?
  lexicon: HALOT
  rationale: כָּכֶם의 비교 의미를 살려 ‘비교해’로 옮겼고, 수사적 질문의 어감을 유지했습니다.
- source_word: עֹלְלוֹת
  english_pob_choice: gleanings
  chosen_korean: 이삭줍는 것
  alternatives_korean:
  - 이삭줍은 것
  - 남은 열매
  lexicon: HALOT
  rationale: 포도밭 문맥에서 남은 열매를 거두는 뜻을 살리되, 현대 한국어에서 즉시 이해되도록 ‘이삭줍는 것’으로 옮겼습니다.
- source_word: אֶפְרַיִם
  english_pob_choice: Ephraim
  chosen_korean: 에브라임
  alternatives_korean:
