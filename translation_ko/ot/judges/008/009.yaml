  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
  footnotes:
  - marker: a
    text: Or “safely” / “successful and unharmed”; Hebrew “in peace.”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “the men of Penuel,” likely referring to the town's male leaders or representatives, not necessarily every inhabitant.
    reason: cultural_note
  - marker: c
    text: “Tower” may refer to a defensive stronghold or fortified tower within Penuel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 또한 브누엘의 사람들에게[a] 말했습니다. "내가 평안히[b] 돌아오면, 이 탑을[c] 헐어 버리겠습니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘브누엘의 사람들’이라고 합니다. 문맥상 도시의 남성 대표자들을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 “평안 가운데”입니다. 여기서는 무사한 귀환의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘탑’은 방어용 망대나 요새화된 탑을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: also
  chosen_korean: 또한
  alternatives_korean:
  - 도
  - 그리고
  lexicon: HALOT
  rationale: 앞선 대상에 말을 더하는 연결 관계를 자연스럽게 살리면서, 서술문에서 문체를 해치지 않는 표준어 표현으로 옮겼습니다.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  english_pob_choice: to the men of Penuel
  chosen_korean: 브누엘의 사람들에게
  alternatives_korean:
  - 브누엘의 남자들에게
  - 브누엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘사람들/남자들’의 집단 지시를 살리되, 한국어에서는 성별을 지나치게 전면화하지 않는 표현으로 옮겼습니다. 문맥상 도시 대표자들을 가리킬 수 있어 이를 함축했습니다.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  english_pob_choice: when I return in peace
  chosen_korean: 내가 평안히 돌아오면
  alternatives_korean:
  - 내가 평안 가운데 돌아오면
  - 내가 무사히 돌아오면
  lexicon: HALOT
  rationale: ‘돌아오다’의 시간 조건을 분명히 드러내면서, שָׁלוֹם의 안전·무사·평강의 함의를 한국어 부사 ‘평안히’로 압축했습니다.
- source_word: אֶתֹּץ אֶת הַמִּגְדָּל הַזֶּה
  english_pob_choice: I will tear down this tower
  chosen_korean: 이 탑을 헐어 버리겠습니다
  alternatives_korean:
  - 이 탑을 무너뜨리겠습니다
  - 이 망대를 헐어 버리겠습니다
  lexicon: HALOT
  rationale: נתץ의 파괴·철거 의미를 살려 ‘헐다’로 옮겼고, 완료적 결의와 강한 의지를 한국어의 ‘-어 버리겠다’로 반영했습니다. מִגְדָּל은 기본 의미인 ‘탑’을 유지했습니다.
theological_decisions:
- issue: 브누엘의 대상 호칭
  chosen_reading: ‘브누엘의 사람들’로 옮겨, 히브리어의 남성 복수 표현을 유지하되 한국어에서 현대적 문체로 과도한 성별 고정을 피했습니다.
  alternative_readings:
  - ‘브누엘의 남자들’
  - ‘브누엘의 남성 대표들’
  rationale: 문맥상 도시 전체 주민이 아니라 대표적 시민층을 가리킬 가능성이 있지만, 본문 자체는 ‘사람들/남자들’이라는 집단 지시를 말하므로 이를 너무 좁히지 않고 번역했습니다.
  doctrine_reference: 본문의 사회적 지시 대상 해석
- issue: ‘평안히’의 의미 범위
  chosen_reading: ‘평안히’는 단순한 정서적 평안보다 전투 귀환의 안전·무사함을 함께 담는 표현으로 사용했습니다.
  alternative_readings:
  - ‘무사히’
  - ‘안전하게’
  rationale: 영문 audit trail이 지적하듯 שָׁלוֹם은 여기서 귀환의 안전을 가리킬 가능성이 크므로, 한국어 본문에는 직역적 어감을 남기면서도 의미는 충분히 전달하는 표현을 택했습니다.
  doctrine_reference: 히브리어 שָׁלוֹם의 문맥적 의미
