reference: Judges 8:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יֶ֣תֶר בְּכוֹר֔/וֹ ק֖וּם הֲרֹ֣ג אוֹתָ֑/ם וְ/לֹא שָׁלַ֨ף הַ/נַּ֤עַר חַרְבּ/וֹ֙ כִּ֣י יָרֵ֔א כִּ֥י עוֹדֶ֖/נּוּ נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
  footnotes:
  - marker: a
    text: Or 'the boy' / 'the youth' for Hebrew naʿar; the term can cover a range from boyhood to young adulthood. Here 'young man' was chosen because he carries a sword and is addressed as capable of execution.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 자기 맏아들 여델에게 말했습니다. 「일어나 그들을 죽여라.」 그러나 그 젊은이는 칼을 뽑지 않았습니다. 그가 두려워했기 때문입니다. 그는 아직 젊은이였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַעַר는 소년부터 젊은 성인까지 아우를 수 있습니다. 여기서는 칼을 지녔고 처형을 수행할 수 있는 인물로 묘사되므로 ‘젊은이’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְיֶתֶר בְּכוֹרֹו
  english_pob_choice: to Jether his firstborn
  chosen_korean: 자기 맏아들 여델에게
  alternatives_korean:
  - 여델에게 그의 맏아들에게
  - 여델, 그의 첫째 아들에게
  lexicon: HALOT
  rationale: בְּכוֹרֹו는 단순한 ‘첫째 아들’보다 출생 순서와 지위를 함께 드러내는 ‘맏아들’이 자연스럽고 정확합니다. 인명은 현대 음역 관례에 따라 여델로 옮겼습니다.
- source_word: קוּם
  english_pob_choice: Get up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나라
  - 어서 일어나
  lexicon: HALOT
  rationale: 명령형 קוּם은 구어적이지만 직접적인 한국어 명령으로 ‘일어나’가 가장 자연스럽습니다.
- source_word: הֲרֹג אוֹתָם
  english_pob_choice: kill them
  chosen_korean: 그들을 죽여라
  alternatives_korean:
  - 그들을 쳐 죽여라
  - 그들을 죽이십시오
  lexicon: HALOT
  rationale: הרג는 일반적인 ‘죽이다’의 강한 명령이므로, 완곡하게 낮추지 않고 직접적으로 옮겼습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 소년
  - 그 청년
  lexicon: HALOT
  rationale: נַעַר는 연령 범위가 넓지만, 문맥상 칼을 쥘 수 있고 처형 명령을 받는 존재이므로 ‘젊은이’가 본문 의도에 가장 잘 맞습니다.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  english_pob_choice: for he was still a young man
  chosen_korean: 그가 아직 젊은이였기 때문입니다
  alternatives_korean:
  - 그가 아직 소년이었기 때문입니다
  - 그가 아직 젊었기 때문입니다
  lexicon: HALOT
  rationale: עוֹדֶנּוּ는 ‘아직/여전히’의 지속을, נַעַר의 반복은 앞의 표현을 다시 확인합니다. 이를 중복 없이 자연스럽게 살리기 위해 ‘아직 젊은이’로 옮겼습니다.
theological_decisions:
- issue: 직설적 폭력 명령의 문체
  chosen_reading: 명령과 서술을 모두 직접적으로 유지해 서사의 거친 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - ‘쳐 죽여라’처럼 완곡하거나 관용적인 표현으로 바꾸는 것
  - ‘죽이라’처럼 성경식 간명체로 바꾸는 것
  rationale: 본문은 전투 후 처형을 지시하는 매우 직접적인 장면이므로, 현대 한국어에서도 그 직설성을 보존하는 것이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 서사 본문 번역의 투명성 원칙
- issue: ‘young man’의 연령 뉘앙스
  chosen_reading: ‘젊은이’로 번역해 נער의 넓은 연령 범위를 유지하되, 문맥상 성인에 가까운 수행 능력도 함께 드러냈습니다.
  alternative_readings:
  - ‘소년’으로 제한하는 것
  - ‘청년’으로 고정하는 것
  rationale: 이 단어는 나이만이 아니라 사회적/기능적 성숙도를 포함할 수 있으므로, 본문이 허용하는 범위 안에서 과도한 축소를 피했습니다.
  doctrine_reference: 어휘 범위 보존
