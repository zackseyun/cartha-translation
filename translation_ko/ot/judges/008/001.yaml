revisions:
- from: 그때 에브라임 사람들이 그에게 말했습니다. “당신이 우리를 부르지 않은 채 미디안을 치러 갔을 때, 우리에게 무슨 일을 한 것입니까?” 그들은 그와 매우 격렬하게 다투었습니다.[a][b]
  to: 그때 에브라임 사람들[a]이 그에게 말했습니다. “우리를 부르지 않고 미디안과 싸우러 가신 것은 우리에게 무슨 일을 하신 것입니까?” 그들은 그와 격렬하게 다투었습니다.[b]
  rationale: The revision clarifies that the failure to call the Ephraimites before Gideon went to battle is the action being challenged, removes the pragmatically marked pronoun “당신,” and places each footnote marker at its proper anchor. It retains the Hebrew’s collective subject, rhetorical question, hostile engagement with Midian, and emphatic contention.
  reviewer_model: gpt-5.6-terra
