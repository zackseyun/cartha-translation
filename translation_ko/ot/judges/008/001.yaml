  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ אֶפְרַ֗יִם מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/בִלְתִּי֙ קְרֹ֣אות לָ֔/נוּ כִּ֥י הָלַ֖כְתָּ לְ/הִלָּחֵ֣ם בְּ/מִדְיָ֑ן וַ/יְרִיב֥וּ/ן אִתּ֖/וֹ בְּ/חָזְקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
  footnotes:
  - marker: a
    text: Or “the Ephraimites.” The Hebrew literally reads “the men of Ephraim,” a collective expression for the tribe.
    reason: lexical_alternative
  - marker: b
    text: Or “they quarreled with him strongly / vehemently.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에브라임 사람들[a]이 그에게 말했습니다. “우리를 부르지 않고 미디안과 싸우러 가신 것은 우리에게 무슨 일을 하신 것입니까?” 그들은 그와 격렬하게 다투었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “에브라임의 남자들”이라고 되어 있으며, 지파 전체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그와 거세게 다투었습니다” 또는 “그와 격렬하게 논쟁했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  english_pob_choice: the men of Ephraim
  chosen_korean: 에브라임 사람들
  alternatives_korean:
  - 에브라임의 남자들
  - 에브라임 지파 사람들
  - 에브라임 사람들
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 한국어로는 자연스럽게 부족/지파 집단을 가리키는 말로 옮기는 것이 가장 투명합니다. ‘에브라임 사람들’은 plural 주어를 살리면서도 매끄럽습니다.
- source_word: מָה הַדָּבָר הַזֶּה
  english_pob_choice: What is this thing
  chosen_korean: 무슨 일을 한 것입니까
  alternatives_korean:
  - 이 일이 무엇입니까
  - 이 무슨 일입니까
  - 무슨 일을 하셨습니까
  lexicon: HALOT
  rationale: 직역의 ‘이 일이 무엇입니까’보다 한국어 질문 관용에 맞게 분노 섞인 항의를 드러내는 표현으로 옮겼습니다. 다만 내용상 ‘thing/matter’의 비난성을 유지하기 위해 ‘일’을 사용했습니다.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  english_pob_choice: they contended with him strongly
  chosen_korean: 그들은 그와 매우 격렬하게 다투었습니다
  alternatives_korean:
  - 그들은 그와 강하게 다투었습니다
  - 그들은 그에게 거세게 따졌습니다
  - 그들은 그와 격렬히 논쟁했습니다
  lexicon: HALOT
  rationale: ריב는 단순한 말다툼보다 ‘다투다/논쟁하다’가 적절하고, בְּחָזְקָה는 강도의 부사로 ‘매우 격렬하게’가 의미를 잘 살립니다.
theological_decisions:
- issue: 집단 표현의 번역
  chosen_reading: 개별 인물보다 에브라임 지파 전체를 대표하는 집단 발화로 이해해 ‘에브라임 사람들’로 옮겼습니다.
  alternative_readings:
  - ‘에브라임의 남자들’처럼 문자성을 더 드러내는 번역
  - ‘에브라임 지파 사람들’처럼 설명적으로 푸는 번역
  rationale: 본문의 복수 동사와 문맥상 이 발화는 한 사람의 말이 아니라 지파 집단의 항의입니다. 한국어에서도 집단 주어로 읽히게 해야 서술의 힘이 보존됩니다.
  doctrine_reference: 서술 문맥 및 집합명사 처리
