    reason: lexical_alternative
  revision_rationale: The revision clarifies that the failure to call the Ephraimites before Gideon went to battle is the action being challenged, removes the pragmatically marked pronoun “당신,” and places each footnote marker at its proper anchor. It retains the Hebrew’s collective subject, rhetorical question, hostile engagement with Midian, and emphatic contention.
