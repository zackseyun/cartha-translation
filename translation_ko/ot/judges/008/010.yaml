  text: Now Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
  footnotes:
  - marker: a
    text: 'Or ''the entire camp of the easterners.'' Hebrew: ''the camp of the sons of the east.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 세바와 살문나는 그르곳에 있었고, 그들과 함께한 그들의 진영은 약 만오천 명이었으며, 이는 동방의 모든 진영 가운데서 남은 자들이었습니다. 그리고 쓰러진 자들은 칼을 빼 든 용사 십이만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동방 사람들의 모든 진영’. 히브리어는 ‘동방의 아들들의 진영’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקַּרְקֹר
  english_pob_choice: in Karkor
  chosen_korean: 그르곳에
  alternatives_korean:
  - 그르곳에서
  - 카르코르에
  lexicon: HALOT
  rationale: 장소명은 현대 한국어 음역을 쓰되, 전치사 ב의 위치 의미를 살려 ‘-에’로 옮겼습니다.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  english_pob_choice: their camps were with them
  chosen_korean: 그들과 함께한 그들의 진영
  alternatives_korean:
  - 그들의 진영이 그들과 함께 있었습니다
  - 그들의 군대가 그들과 함께 있었습니다
  lexicon: HALOT
  rationale: 히브리어 복수형 מַחֲנֵיהֶם을 살려 ‘진영들/진영’의 복수성을 노출하되, 한국어에서는 자연스럽게 집합적 의미로 읽히도록 했습니다.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  english_pob_choice: about fifteen thousand
  chosen_korean: 약 만오천 명
  alternatives_korean:
  - 약 1만 5천 명
  - 대략 만오천 명
  lexicon: HALOT
  rationale: 앞의 כ가 나타내는 근사 의미를 ‘약’으로 분명히 표시했습니다.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  english_pob_choice: from all the camp of the sons of the east
  chosen_korean: 동방의 모든 진영 가운데서 남은 자들
  alternatives_korean:
  - 동방 사람들의 모든 진영 가운데서 남은 자들
  - 동방의 모든 진영에서 살아남은 자들
  lexicon: HALOT
  rationale: בְנֵי קֶדֶם은 직역상 ‘동방의 아들들’이지만, 한국어에서는 관용적으로 이해되도록 ‘동방’으로 옮기되, ‘남은 자들’로 잔존 의미를 분명히 했습니다.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  english_pob_choice: men drawing the sword
  chosen_korean: 칼을 빼 든 용사
  alternatives_korean:
  - 칼을 뽑는 사람
  - 무기를 든 사람
  lexicon: HALOT
  rationale: ‘칼을 빼다’는 히브리어 전투 관용구의 생동감을 살리는 한국어 표현이며, 수효 문맥상 ‘용사’가 자연스럽습니다.
