- from: 그때 세바와 살문나는 그르곳에 있었고, 그들과 함께한 그들의 진영은 약 만오천 명이었으며, 이는 동방의 모든 진영 가운데서 남은 자들이었습니다. 그리고 쓰러진 자들은 칼을 빼 든 용사 십이만 명이었습니다.[a]
