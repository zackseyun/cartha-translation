  text: Now Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
  footnotes:
  - marker: a
    text: 'Or ''the entire camp of the easterners.'' Hebrew: ''the camp of the sons of the east.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 세바와 살문나는 갈갈에 있었고, 그들의 진영이 그들과 함께 있었는데, 그 수는 동방 사람들의 온 진영에서 남은 자들, 약 만오천 명이었습니다. 칼을 빼 든 사람으로서 쓰러진 이들은 십이만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동방의 아들들의 진영’.
    reason: lexical_alternative
