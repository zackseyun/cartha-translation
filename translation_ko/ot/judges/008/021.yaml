source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
  footnotes:
  - marker: a
    text: Or, “Rise yourself and kill us,” with וּפְגַע בָּנוּ understood more explicitly as a lethal blow in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew, “for as the man is, so is his strength,” a proverbial way of saying that a man's strength matches his stature or valor.
    reason: cultural_note
  - marker: c
    text: Or, “the crescents” or “moon-shaped ornaments.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 세바와 살문나는 말했습니다. 「당신이 일어나 우리를 치십시오. 사람의 모습이 어떠하면 그의 힘도 그러합니다.」 그래서 기드온이 일어나 세바와 살문나를 죽이고, 그들의 낙타 목에 달린 초승달 장식들을 가져갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “일어나 우리를 치라”이지만, 문맥상 치명적 타격을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 속담으로, 사람의 체격이나 전사적 기량에 따라 힘도 그에 걸맞다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: “초승달들” 또는 “달 모양 장식들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע
  english_pob_choice: Then Zebah and Zalmunna said
  chosen_korean: 그러자 세바와 살문나는 말했습니다
  alternatives_korean:
  - 세바와 살문나가 말했습니다
  - 그리고 세바와 살문나가 말했습니다
  lexicon: WLC + POB audit trail
  rationale: 히브리어 단수 동사와 복수 주어의 관용적 결합을 한국어에서는 자연스러운 복수 서술로 옮기되, 서사적 진행은 '그러자'로 살렸습니다.
- source_word: קוּם אַתָּה וּפְגַע בָּנוּ
  english_pob_choice: Rise yourself and strike us down
  chosen_korean: 당신이 일어나 우리를 치십시오
  alternatives_korean:
  - 일어나 우리를 쳐서 죽이십시오
  - 당신이 일어나 우리를 죽이십시오
  lexicon: HALOT
  rationale: קוּם의 강조는 주어를 밝힌 명령으로 반영하고, פגע는 문맥상 치명적 공격을 가리키지만 한국어에서는 과잉 해석을 피하며 '치십시오'로 유지했습니다.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  english_pob_choice: for as the man is, so is his strength
  chosen_korean: 사람의 모습이 어떠하면 그의 힘도 그러합니다
  alternatives_korean:
  - 남자가 어떠하면 그의 힘도 그러합니다
  - 사람의 기세가 어떠하면 그의 힘도 그러합니다
  lexicon: HALOT
  rationale: 히브리어 속담의 비교 구조를 살리면서도 한국어에서 다소 부자연스러운 직역을 피했습니다. 다만 남성 전사들의 맥락은 '사람'으로 포괄적으로 드러나게 했습니다.
- source_word: הַשַּׂהֲרֹנִים
  english_pob_choice: the crescent ornaments
  chosen_korean: 초승달 장식들
  alternatives_korean:
  - 초승달 모양 장식들
  - 초승달 귀걸이들
  - 초승달들
  lexicon: HALOT
  rationale: 어근이 가리키는 초승달 모양의 장신구를 한국어로 자연스럽고 정확하게 옮겼습니다. '장식들'은 물건의 기능을, '초승달'은 형상을 보존합니다.
theological_decisions:
- issue: ורוד narrative violence in a taunt
  chosen_reading: 세바와 살문나의 요구는 체면과 전사적 강함을 겨루는 조롱 섞인 말로, 기드온의 직접 처형으로 이어집니다.
  alternative_readings:
  - 단순한 처형 요청으로만 읽기
  - 자살 또는 명예살인의 뉘앙스로 완화해 읽기
  rationale: 문맥상 이 말은 '강한 자가 죽이라'는 조롱 섞인 요구이며, 이어지는 '기드온이 ... 죽이고'가 그 문맥을 확정합니다. 따라서 살해의 강도를 약화하지 않았습니다.
  doctrine_reference: '번역 원칙: 문맥이 지시하는 폭력성 보존'
