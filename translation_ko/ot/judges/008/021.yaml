  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
  footnotes:
  - marker: a
    text: Or, “Rise yourself and kill us,” with וּפְגַע בָּנוּ understood more explicitly as a lethal blow in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew, “for as the man is, so is his strength,” a proverbial way of saying that a man's strength matches his stature or valor.
    reason: cultural_note
  - marker: c
    text: Or, “the crescents” or “moon-shaped ornaments.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 세바와 살문나가 말했습니다. “당신이 일어나 우리를 치십시오.[a] 사람이 어떠하면 그 힘도 그러하기 때문입니다.[b]” 그래서 기드온이 일어나 세바와 살문나를 죽이고, 그들의 낙타 목에 달린 초승달 장식들[c]을 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “일어나 우리를 치라”이며, 문맥에서는 치명적인 타격을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 속담적 표현입니다. 사람의 힘이 그 사람에 상응한다는 뜻이며, 문맥상 체격이나 전사로서의 기량을 암시할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: “초승달들” 또는 “달 모양 장식들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע
  english_pob_choice: Then Zebah and Zalmunna said
  chosen_korean: 그러자 세바와 살문나는 말했습니다
  alternatives_korean:
