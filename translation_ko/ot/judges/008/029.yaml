base_translation:
  language: en
  yaml_path: translation/ot/judges/008/029.yaml
  text: Then Jerubbaal son of Joash went and lived in his house[a].
  footnotes:
  - marker: a
    text: Or 'went and settled in his house' or 'went and dwelt in his house.' The Hebrew verb can denote dwelling or settling, not merely physical sitting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 여룹바알, 요아스의 아들,은 자기 집에 가서 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가서 자기 집에 정착했습니다’, ‘가서 자기 집에 거주했습니다’. 히브리어 동사는 단순한 물리적 ‘앉음’보다 거주·정착의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 떠났습니다
  - 되돌아갔습니다
  lexicon: HALOT
  rationale: 와우-연속 서술의 첫 동사를 한국어에서는 자연스러운 서술 흐름인 ‘가서’로 옮겨, 이동과 다음 동작의 연결을 살렸습니다.
- source_word: יְרֻבַּעַל
  english_pob_choice: Jerubbaal
  chosen_korean: 여룹바알
  alternatives_korean:
  - 기드온
  lexicon: HALOT
  rationale: 히브리어 본문에 실제로 나온 이름을 따라 음역했으며, 익숙한 다른 이름으로 바꾸지 않았습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 머물렀습니다
  - 살아 있었습니다
  lexicon: HALOT
  rationale: 이 동사는 단순히 ‘앉다’보다 거주·정착의 뜻이므로, 현대 한국어에서 분명한 ‘살았습니다’로 옮겼습니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: in his house
  chosen_korean: 자기 집에
  alternatives_korean:
  - 그의 집에
  - 자기 집 안에
  - 집에서
  lexicon: HALOT
  rationale: 직역의 ‘그의 집에’도 가능하지만, 소유 관계를 자연스럽게 드러내는 ‘자기 집에’가 한국어로 가장 명료합니다.
theological_decisions:
- issue: 인물명 표기와 서술의 비신학적 성격
  chosen_reading: 본문의 인물명 여룹바알을 그대로 쓰고, 별도의 해석적 보충 없이 단순한 귀가·거주 서술로 처리했습니다.
  alternative_readings:
  - 기드온으로 대체
  - ‘집에 머물렀다’로 완화
  rationale: 이 절은 신학적 논증보다 서사 진행이 핵심이므로, 본문에 있는 이름과 동작을 가장 직접적으로 반영했습니다.
  doctrine_reference: 본문의 서사적 문맥과 고유명사 보존 원칙
