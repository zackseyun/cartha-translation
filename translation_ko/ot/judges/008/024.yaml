  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: ko
  text: 기드온이 그들에게 말했습니다. 「한 가지 청을 드리겠습니다. 너희는 각자 자기 전리품에서 귀고리 하나씩을 나에게 주십시오.」 그들이 금 귀고리를 가지고 있었기 때문입니다. 그들은 이스마엘 사람들입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘청’을 택한 것은 히브리어 שְׁאֵלָה의 반복과 요청의 뉘앙스를 살리기 위해서입니다.
    reason: source_note
