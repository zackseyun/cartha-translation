  text: וַ/יֹּ֨אמֶר֙ לְ/אַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָ/עָ֖ם אֲשֶׁ֣ר בְּ/רַגְלָ֑/י כִּי עֲיֵפִ֣ים הֵ֔ם וְ/אָנֹכִ֗י רֹדֵ֛ף אַחֲרֵ֛י זֶ֥בַח וְ/צַלְמֻנָּ֖ע מַלְכֵ֥י מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
  footnotes:
  - marker: a
    text: Literally, “the people who are at my feet,” an idiom for those accompanying or following him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 숙곳 사람들에게 말했습니다. 「부디 제 곁에 있는 사람들에게 빵을 조금 주십시오. 그들은 지쳤고, 저는 미디안의 왕들인 제바와 살문나를 뒤쫓고 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현을 직역하면 “내 발치에 있는 사람들”이며, 여기서는 함께 동행하는 사람들을 가리키는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  english_pob_choice: to the men of Succoth
  chosen_korean: 숙곳 사람들에게
  alternatives_korean:
  - 숙곳의 남자들에게
  - 숙곳의 사람들에게
  lexicon: HALOT
  rationale: אַנְשֵׁי는 ‘~의 사람들/남자들’의 남성 복수형이므로, 마을 전체보다 그곳의 남성 대표들을 가리키는 뉘앙스를 살려 옮겼습니다.
- source_word: תְּנוּ נָא
  english_pob_choice: Please give
  chosen_korean: 부디 … 주십시오
  alternatives_korean:
  - 제발 … 주십시오
  - 부디 … 주세요
  lexicon: HALOT
  rationale: 명령형에 נָא가 붙어 정중하면서도 절박한 요청이므로, 현대 합쇼체에서 자연스러운 공손 요청으로 옮겼습니다.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  english_pob_choice: the people who are with me
  chosen_korean: 제 곁에 있는 사람들
  alternatives_korean:
  - 제 발치에 있는 사람들
  - 저를 따르는 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘내 발치에 있는 사람들’이지만, 한국어에서는 그 관용구가 낯설어 현재 문맥의 ‘동행자들’이라는 뜻을 자연스럽게 드러내되, 과도한 해석어는 피했습니다.
- source_word: עֲיֵפִים
  english_pob_choice: weary
  chosen_korean: 지쳤고
  alternatives_korean:
  - 피곤하고
  - 지쳐 있습니다
  lexicon: HALOT
  rationale: 전투와 추격의 맥락에서 육체적 소진을 가리키므로, 상태를 간결하게 나타내는 ‘지쳤고’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 관용구 בְּרַגְלָי의 처리
  chosen_reading: ‘제 곁에 있는 사람들’로 풀어, 추상적이지 않게 동행 관계를 드러냈습니다.
  alternative_readings:
  - ‘제 발치에 있는 사람들’의 직역
  - ‘저를 따르는 사람들’의 해석적 번역
  rationale: 본문의 핵심은 종속적 위치가 아니라 기드온을 동행하는 자들을 가리키는 것이므로, 한국어 독자가 즉시 이해할 수 있는 범위에서 관용구를 풀어 옮겼습니다.
  doctrine_reference: source semantics and idiom
- issue: ‘미디안의 왕들’의 어순
  chosen_reading: ‘미디안의 왕들인 제바와 살문나’로, 칭호를 먼저 밝히고 이름을 덧붙였습니다.
  alternative_readings:
  - ‘제바와 살문나, 미디안의 왕들’
  - ‘미디안 왕들 제바와 살문나’
  rationale: 히브리어의 명사구 관계를 유지하면서도 한국어에서 자연스럽게 두 인물의 신분을 분명히 하는 방식입니다.
  doctrine_reference: source syntax
