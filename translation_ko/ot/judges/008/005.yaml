  source_fidelity: 대체로 충실합니다. 다만 כִּכְּרוֹת לֶחֶם은 복수의 빵 덩이/빵들을 가리키므로 ‘빵을 조금’보다 ‘빵 몇 덩이’를 쓰는 편이 수량성과 구체성을 더 잘 보존합니다. בְּרַגְלַי의 관용적 의미는 ‘저와 함께 있는 사람들’로 자연스럽게 옮길 수 있으며, 각주로 직역을 보완하는 방식이 적절합니다.
  naturalness: 합쇼체 문장과 대화체는 자연스럽습니다. ‘제 곁에 있는 사람들’은 한국어에서 단순한 물리적 근접을 뜻할 수 있으므로, 추격에 동행하는 무리를 뜻하는 문맥에는 ‘저와 함께 있는 사람들’이 더 명료하고 자연스럽습니다.
  terminology: 숙곳, 미디안, 제바, 살문나는 통용되는 음역이며 적절합니다. ‘미디안의 왕들인 제바와 살문나’도 히브리어의 동격 관계를 자연스럽게 전달합니다.
