base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
  footnotes:
  - marker: a
    text: Or 'in the grave of Joash his father.' The Hebrew קֶבֶר can denote either a grave or a tomb/burial place.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Ophrah of the Abiezrite,' meaning Ophrah belonging to the Abiezrite clan.
    reason: cultural_note
translation:
  language: ko
  text: 요아스의 아들 기드온은 좋은 노년에 죽었고, 그의 아버지 요아스의 무덤에[a] 묻혔습니다. 그곳은 아비에셀 사람들의 오브라였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קֶבֶר는 ‘무덤’뿐 아니라 ‘묘지’나 ‘매장지’를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아비에셀 사람들의 오브라’라고 하며, 아비에셀 씨족에 속한 오브라를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었고
  alternatives_korean:
  - 세상을 떠났고
  - 별세하였고
  lexicon: HALOT
  rationale: 히브리어 מות의 기본 의미를 직접 반영하여, 죽음 표현을 완곡하게 누그러뜨리지 않았습니다.
- source_word: בְּשֵׂיבָה טוֹבָה
  english_pob_choice: at a good old age
  chosen_korean: 좋은 노년의 나이에
  alternatives_korean:
  - 평안한 노년에
  - 충만한 노년에
  lexicon: HALOT
  rationale: שֵׂיבָה의 ‘노년/백발’ 의미와 טוֹבָה의 긍정적 수식을 살리면서, 한국어에서 자연스러운 시점 표현으로 옮겼습니다.
- source_word: בְּקֶבֶר יוֹאָשׁ אָבִיו
  english_pob_choice: in the tomb of Joash his father
  chosen_korean: 그의 아버지 요아스의 무덤에
  alternatives_korean:
  - 아버지 요아스의 묘에
  - 요아스 그의 아버지의 무덤에
  lexicon: HALOT
  rationale: קֶבֶר는 ‘무덤/묘/장지’ 모두 가능하므로, POB의 ‘tomb’ 선택을 따라 가족 매장지를 가리키는 ‘무덤’으로 옮겼습니다.
- source_word: אֲבִי הָעֶזְרִי
  english_pob_choice: of the Abiezrites
  chosen_korean: 아비에셀 사람들의
  alternatives_korean:
  - 아비에셀 지파의
  - 아비에셀 가문의
  lexicon: HALOT
  rationale: אָבִיעֶזֶר 계열의 집단명칭을 한국어 복수 관형으로 풀어, 오브라가 속한 씨족 정체성을 드러냈습니다.
