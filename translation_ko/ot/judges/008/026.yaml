theological_decisions:
- issue: 전리품 목록의 반복 구조를 한국어에서 어떻게 살릴지
  chosen_reading: ‘…이었으며…도 있었습니다’로 나누어, 금 귀고리의 총량과 별개의 장식품들을 차례대로 열거했습니다.
  alternative_readings:
  - 하나의 긴 나열문으로 이어 번역
  - 의미상 묶어서 간략화
  rationale: 본문은 총량과 추가 전리품을 구분하는 열거 구조를 가지므로, 한국어에서도 ‘그 밖에’와 ‘도 있었습니다’로 구분해 원문의 누적적 효과를 보존했습니다.
  doctrine_reference: 서사 본문의 사실 진술과 목록 구조 보존
