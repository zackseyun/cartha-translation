  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
  footnotes:
  - marker: a
    text: Hebrew literally, '1,700 gold'; 'shekels' is supplied as the understood unit of weight in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'earrings' for 'rings'; the Hebrew term can denote a ring worn in the ear or nose.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 요구한 금 귀고리의 무게는 금 천칠백 세겔이었으며[a], 그 밖에 미디안 왕들의 몸에 있던 초승달 장식[b]과 펜던트와 자주색 옷과 그들의 낙타 목에 있던 목걸이도 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘금 1,700’이지만, 문맥상 무게 단위인 세겔이 생략된 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 몸의 어느 부위에 착용했는지 명시하지 않으므로, POB의 ‘rings’처럼 넓게 ‘장식’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  english_pob_choice: weight
  chosen_korean: 무게
  alternatives_korean:
  - 중량
  - 양
  lexicon: HALOT
  rationale: 측정된 분량을 가리키는 명사이므로, 단순 수량보다 ‘무게’가 원문의 의미를 가장 직접적으로 살립니다.
- source_word: נִזְמֵי הַזָּהָב
  english_pob_choice: the gold rings
  chosen_korean: 금 귀고리
  alternatives_korean:
