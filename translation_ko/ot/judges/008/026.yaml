  - 금 고리
  lexicon: HALOT
  rationale: נזם은 귀나 코에 끼우는 장식을 가리킬 수 있으므로, POB의 ‘rings’보다 한국어에서는 몸에 착용한 장식임을 드러내는 ‘귀고리’가 오해를 줄입니다.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  english_pob_choice: 1,700 shekels of gold
  chosen_korean: 금 천칠백 세겔
  alternatives_korean:
  - 금 1,700세겔
  - 금 천칠백
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘금 천칠백’이지만, 문맥상 무게 단위가 생략된 표현이므로 POB의 보충을 따라 ‘세겔’을 밝혔습니다.
- source_word: הַשַּׂהֲרֹנִים
  english_pob_choice: the crescent ornaments
  chosen_korean: 초승달 장식
  alternatives_korean:
  - 초승달 모양 장식
  - 달 모양 장식
  lexicon: HALOT
  rationale: 형태를 지시하는 장신구이므로, 문자성을 살리면서도 자연스러운 ‘초승달 장식’으로 옮겼습니다.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  english_pob_choice: that were on the necks of their camels
  chosen_korean: 그들의 낙타 목에 있던
  alternatives_korean:
  - 그들의 낙타 목에 걸린
  - 그들의 낙타 목에 달린
  lexicon: HALOT
  rationale: 전치사 בְּ와 복수형 ‘목들’은 물건의 위치를 가리키므로, 장식이 실제로 매달려 있던 이미지를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 전리품 목록의 반복 구조를 한국어에서 어떻게 살릴지
  chosen_reading: ‘…이었으며…도 있었습니다’로 나누어, 금 귀고리의 총량과 별개의 장식품들을 차례대로 열거했습니다.
  alternative_readings:
  - 하나의 긴 나열문으로 이어 번역
  - 의미상 묶어서 간략화
  rationale: 본문은 총량과 추가 전리품을 구분하는 열거 구조를 가지므로, 한국어에서도 ‘그 밖에’와 ‘도 있었습니다’로 구분해 원문의 누적적 효과를 보존했습니다.
  doctrine_reference: 서사 본문의 사실 진술과 목록 구조 보존
