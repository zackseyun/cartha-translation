  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
  footnotes:
  - marker: a
    text: Or 'while the camp was secure.' The Hebrew term can denote a state of confidence or security; here it likely implies that the camp was off guard.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 기드온은 노바와 욕브하 동쪽에 있는, 장막에 사는 사람들이 다니는 길을 따라 올라가 진영을 쳤습니다. 그 진영은 방심하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진영이 안전한 상태에 있었습니다’ 또는 ‘안심하고 있었습니다.’ 히브리어는 확신이나 안전의 상태를 가리킬 수 있으며, 여기서는 그로 인해 경계를 늦춘 상태를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 나아가서
  - 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘오르다/올라가다’를 살리면서 한국어 서술 흐름에 맞게 연결형으로 옮겼습니다.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  english_pob_choice: by the route of those who dwell in tents
  chosen_korean: 장막에 거주하는 사람들의 길을 따라
  alternatives_korean:
  - 장막에 사는 사람들의 길로
  - 장막 거주자들의 길을 따라
  lexicon: HALOT
  rationale: 문자적으로는 ‘장막에 거주하는 사람들’이므로, ‘유목민’처럼 해석을 앞서지 않고 경로 표현을 자연스럽게 살렸습니다.
- source_word: וַיַּךְ אֶת הַמַּחֲנֶה
  english_pob_choice: struck the camp
  chosen_korean: 진영을 치니
  alternatives_korean:
  - 진영을 쳤습니다
  - 진영을 공격하니
  lexicon: HALOT
  rationale: נכה의 직접적이고 폭넓은 뜻을 따라 ‘치다’를 유지해, 공격의 강도와 결과를 지나치게 설명하지 않았습니다.
- source_word: בֶטַח
  english_pob_choice: unsuspecting
  chosen_korean: 안전하다고 여기고 있었습니다
  alternatives_korean:
  - 안심하고 있었습니다
  - 경계하지 않고 있었습니다
  - 안전하다고 여겼습니다
  lexicon: HALOT
  rationale: בֶטַח는 ‘안전/확신’의 상태를 가리킬 수 있으므로, 전투 상황에서는 ‘안전하다고 여김’이라는 내적 상태와 무방비함을 함께 드러내도록 옮겼습니다.
theological_decisions:
- issue: מִקֶּדֶם의 지리적 관계 표현
  chosen_reading: ‘노바와 욕브하의 동쪽에서’로 옮겨, 위치 관계를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘노바와 욕브하 동쪽으로부터’
  - ‘노바와 욕브하 동편에서’
  rationale: 전치사적 지리 표현이므로 방향보다 위치를 중심으로 읽히게 하여, 본문의 이동 경로와 지형 정보를 분명히 했습니다.
  doctrine_reference: 본문 지리 정보의 명료성
