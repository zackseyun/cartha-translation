    rationale: 히브리어 단어를 가리키는 한국어 주석으로 ‘여기서 사용된 히브리어 זנה’가 자연스럽고 정확합니다.
  - severity: low
    issue: 두 각주가 절 끝에 함께 놓여 있어 각주 내용과 본문 어휘의 연결이 약합니다.
    rationale: 에봇 설명은 ‘에봇’ 뒤에, זנה 설명은 ‘음행하였고’ 뒤에 두면 각주 앵커가 명확해집니다.
