  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ אוֹת֨/וֹ גִדְע֜וֹן לְ/אֵפ֗וֹד וַ/יַּצֵּ֨ג אוֹת֤/וֹ בְ/עִיר/וֹ֙ בְּ/עָפְרָ֔ה וַ/יִּזְנ֧וּ כָֽל יִשְׂרָאֵ֛ל אַחֲרָ֖י/ו שָׁ֑ם וַ/יְהִ֛י לְ/גִדְע֥וֹן וּ/לְ/בֵית֖/וֹ לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
  footnotes:
  - marker: a
    text: Or 'played the prostitute after it'; the Hebrew uses sexual-infidelity imagery for Israel's idolatry.
    reason: lexical_alternative
  - marker: b
    text: An 'ephod' was a cultic object associated with priestly use; here the exact form or function is not fully specified by the text.
    reason: cultural_note
translation:
  language: ko
  text: 기드온은 그것을 에봇으로 만들어[a] 자기 성읍 오브라에 세웠습니다. 온 이스라엘은 거기에서 그것을 따라 음행하였고[b], 그것은 기드온과 그의 집안에 올무가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에봇’은 제의와 관련된 물건이지만, 여기서는 그 정확한 형태나 기능이 본문만으로 완전히 규정되지는 않습니다.
    reason: cultural_note
  - marker: b
    text: ‘음행하다’는 여기서 사용된 히브리어 זנה가 지닌 언약적 불신실성의 성적 이미지를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  english_pob_choice: into an ephod
  chosen_korean: 에봇으로
  alternatives_korean:
  - 에봇이 되도록
  - 에봇으로 만든
  lexicon: HALOT
  rationale: לְ와 עשה의 결합을 결과적으로 이해하여, 금이 특정한 종교적 물건인 에봇이 되었음을 직접 드러냈습니다.
- source_word: וַיַּצֵּג
  english_pob_choice: set it up
  chosen_korean: 세워 두었습니다
  alternatives_korean:
  - 세웠습니다
  - 설치했습니다
  lexicon: HALOT
  rationale: וַיַּצֵּג는 단순히 놓는 것보다 공적·제의적 배치를 시사하므로, ‘세워 두다’로 공공 설치의 뉘앙스를 살렸습니다.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  english_pob_choice: prostituted themselves after it
  chosen_korean: 그 뒤를 따라 음행하였고
  alternatives_korean:
  - 그것을 따라 음행하였고
  - 그것을 따라 간음하였고
  - 그것을 따라 신실하지 않았고
  lexicon: HALOT
  rationale: זנה의 언약적·우상숭배적 불신앙 이미지를 한국어로 과도하게 완곡화하지 않으면서도, 현대 독자가 읽을 수 있는 표현으로 옮겼습니다.
- source_word: לְמוֹקֵשׁ
  english_pob_choice: a snare
  chosen_korean: 올무가 되었습니다
  alternatives_korean:
  - 함정이 되었습니다
  - 덫이 되었습니다
  lexicon: HALOT
  rationale: מוֹקֵשׁ의 비유적 위험을 살리되, 한국어 성경 문맥에서 자연스러운 ‘올무’로 옮겼습니다.
theological_decisions:
- issue: 에봇의 정확한 형태와 기능
  chosen_reading: 본문이 말하는 범위 안에서만 ‘에봇’으로 옮기고, 그것을 더 구체적인 우상/제사복으로 규정하지 않았습니다.
  alternative_readings:
  - 제사장의 겉옷
  - 우상
  - 신탁용 물건
  rationale: 히브리어는 물건의 이름은 주지만 그 정확한 형태와 기능을 완전히 규정하지 않으므로, 번역에서도 그 모호함을 유지했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 이스라엘의 반응을 나타내는 זנה의 이미지
  chosen_reading: ‘음행하다’로 옮겨 우상숭배의 성적 불충실 이미지를 유지했습니다.
  alternative_readings:
  - 불신실하다
  - 우상을 따르다
  - 길을 벗어나다
  rationale: 본문의 신학적 무게는 단순한 ‘실수’가 아니라 언약 파기에 있으므로, 그 강한 비유를 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 6
