  source_fidelity: 히브리어의 이동 동사 ‘올라가다’, 펜우엘에서의 발화, 그리고 숙곳 사람들의 앞선 응답과 같은 방식의 응답이라는 비교 구문은 대체로 반영되었습니다. 그러나 초안의 ‘숙곳 사람들을 답한’은 목적격 조사와 동사 결합이 잘못되어 뜻과 문장 구조를 훼손합니다.
