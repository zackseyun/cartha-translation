  text: וַ/יַּ֤עַל מִ/שָּׁם֙ פְּנוּאֵ֔ל וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם כָּ/זֹ֑את וַ/יַּעֲנ֤וּ אוֹת/וֹ֙ אַנְשֵׁ֣י פְנוּאֵ֔ל כַּ/אֲשֶׁ֥ר עָנ֖וּ אַנְשֵׁ֥י סֻכּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
  footnotes:
  - marker: a
    text: Or, more literally, 'and spoke to them thus.' The Hebrew points back to the same kind of request or speech reported in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Penuel is also spelled 'Peniel' elsewhere.
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에서 그는 펜우엘로 올라갔습니다. 그리고 그들에게 같은 방식으로 말했습니다[a]. 펜우엘 사람들은 숙곳 사람들이 대답했던 것과 똑같이 그에게 대답했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들에게 이렇게/이같이 말하였다’에 가깝습니다. 여기서는 직전 절의 요청을 다시 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  english_pob_choice: he went up / from there
  chosen_korean: 그곳에서 그가 …로 올라가
  alternatives_korean:
  - 그곳에서 그가 …로 가서
  - 그곳에서 그가 …로 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 방향성인 ‘올라가다’를 살리되, 한국어에서는 장소 이동을 자연스럽게 풀어썼습니다.
- source_word: פְּנוּאֵל
  english_pob_choice: Penuel
  chosen_korean: 펜우엘
  alternatives_korean:
  - 페누엘
  - 피누엘
  lexicon: 고유명사 음역
  rationale: 본문의 지명은 음역하는 것이 적절하며, 현대 표기 기준에 따라 펜우엘로 옮겼습니다.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  english_pob_choice: and spoke to them in the same way
  chosen_korean: 그들에게 같은 식으로 말하자
  alternatives_korean:
  - 그들에게 이렇게 말하자
  - 그들에게 똑같이 말하자
  lexicon: HALOT
  rationale: 직전 절의 발언을 가리키는 지시적 표현이므로, 반복 대신 ‘같은 식으로’로 그 연관성을 드러냈습니다.
- source_word: אַנְשֵׁי פְנוּאֵל / אַנְשֵׁי סֻכּוֹת
  english_pob_choice: the men of Penuel / the men of Succoth
  chosen_korean: 펜우엘 사람들 / 숙곳 사람들
  alternatives_korean:
  - 펜우엘의 남자들 / 숙곳의 남자들
  - 펜우엘의 사람들 / 숙곳의 사람들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘~의 사람들/남자들’이지만, 한국어에서는 관용적으로 지명 소속 집단을 ‘~사람들’로 옮기면 자연스럽고 본문의 사회적 지칭을 유지할 수 있습니다.
