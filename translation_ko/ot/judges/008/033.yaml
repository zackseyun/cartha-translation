language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
  footnotes:
  - marker: a
    text: Baal-berith likely means 'Baal of the covenant' or 'Lord of the covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'played the prostitute after the Baals'; the Hebrew uses sexual imagery for idolatrous unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 기드온이 죽은 뒤에 이스라엘 자손은 돌아서서 바알들을 따라 음행하였고, 바알브릿을 자기들의 신으로 삼았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 바알브릿은 ‘언약의 바알’ 또는 ‘언약의 주’라는 뜻일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 우상숭배의 불충실함을 성적 이미지로 표현합니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And it happened that, when
  chosen_korean: ~한 뒤에
  alternatives_korean:
  - 그리고 …할 때
  - 그런데 …하였을 때
  lexicon: WLC narrative formula
  rationale: 히브리어의 서사 도입 공식을 한국어에서 과도하게 직역하지 않고, 자연스러운 시간 전환인 ‘~한 뒤에’로 옮겨 문맥 흐름을 살렸습니다.
- source_word: וַיָּשׁוּבוּ
  english_pob_choice: turned back
  chosen_korean: 돌아서서
  alternatives_korean:
  - 되돌아가
  - 다시 돌아와
  lexicon: HALOT
  rationale: 단순한 물리적 이동이 아니라 이전의 신앙에서 이탈해 되돌아가는 뉘앙스를 살리기 위해 ‘돌아서서’를 택했습니다.
- source_word: וַיִּזְנוּ אַחֲרֵי הַבְּעָלִים
  english_pob_choice: prostituted themselves after the Baals
  chosen_korean: 바알들을 따라 음행하였고
  alternatives_korean:
  - 바알들을 따라 창녀처럼 행하였고
  - 바알들을 따라 음란하게 행하였고
  - 바알들을 따라 간음하였고
  lexicon: HALOT
  rationale: 우상숭배를 가리키는 성적 은유를 완화하지 않기 위해 ‘음행하다’를 유지했고, 한국어에서 가장 자연스러운 현대 표현으로 정리했습니다.
- source_word: בַּעַל בְּרִית
  english_pob_choice: Baal-berith
  chosen_korean: 바알브릿
  alternatives_korean:
  - 바알-브릿
  - 언약의 바알
  - 언약의 주
  lexicon: HALOT
  rationale: 문맥상 고유한 제의명칭이므로 음역을 유지했습니다. 구성 요소의 뜻은 본문이 아니라 주석에서 처리하는 편이 source-direct입니다.
- source_word: לֵאלֹהִים
  english_pob_choice: their god
  chosen_korean: 자기들의 신으로
  alternatives_korean:
  - 자기들의 하나님으로
  - 그들의 신으로
  - 신으로
  lexicon: HALOT
  rationale: 이스라엘이 참 하나님 대신 우상을 신으로 삼았다는 의미를 드러내기 위해 ‘신으로 삼다’라는 지정 표현을 사용했습니다.
theological_decisions:
- issue: 우상숭배를 성적 은유로 유지할지 여부
  chosen_reading: 바알들을 따라 음행하였고
  alternative_readings:
  - 바알들을 따라 불충실하였고
  - 바알들을 따르며 우상숭배하였고
  rationale: 히브리어 זנה의 노골적인 언약 배반 이미지를 보존해야 본문의 신학적 경고가 약화되지 않습니다. 한국어에서도 관용적 완곡어보다 직설적 은유를 유지했습니다.
  doctrine_reference: Translation philosophy §6
