  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 그러나 וַיָּשׁוּבוּ의 재발·회귀 의미가 ‘돌아서서’만으로는 충분히 드러나지 않으므로 ‘다시’로 명시하는 것이 더 정확합니다. 또 각주 표지는 해당 어구에 바로 붙여야 합니다.
  naturalness: ‘이스라엘 자손’과 ‘자기들의 신으로 삼았습니다’는 현대 표준어 합쇼체에 자연스럽습니다. ‘기드온이 죽자’는 히브리어의 시간적 전환을 간결하고 자연스럽게 전달합니다.
  terminology: ‘바알들’, ‘음행하다’, ‘바알브릿’은 원문의 복수형, 성적 은유, 고유 제의명을 적절히 보존합니다. 바알브릿의 뜻과 음행 은유는 각각 해당 표지의 각주에서 밝혀야 합니다.
