    rationale: 히브리어 אֶת־שְׁמוֹ에서 접미사는 새로 태어난 아들의 이름을 가리킵니다. 한국어 ‘그의 이름’은 직전 주어인 아버지의 이름으로도 이해될 수 있으므로 ‘그 아이의 이름’으로 밝혀 주는 것이 안전합니다.
