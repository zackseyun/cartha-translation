translation:
  language: ko
  text: 그리고 세겜에 있던 그의 첩도 아들을 낳았고, 그가 그의 이름을 아비멜렉이라 지었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  english_pob_choice: And his concubine
  chosen_korean: 그의 첩도
  alternatives_korean:
  - 그의 후궁도
  - 그의 여첩도
  lexicon: HALOT
  rationale: פִּילֶגֶשׁ은 지위가 구별되는 관계를 가리키므로, 이를 완화하지 않고 표준적인 ‘첩’으로 옮겼습니다. 앞의 וּ는 문맥상 ‘그리고/또’의 연결로 자연스럽게 반영했습니다.
- source_word: אֲשֶׁר בִּשְׁכֶם
  english_pob_choice: who was in Shechem
  chosen_korean: 세겜에 있던
  alternatives_korean:
  - 세겜에 있는
  - 세겜에 살던
  lexicon: HALOT
  rationale: 관계절의 מקום 표지는 ‘~에 있던’으로 옮기면 본문의 위치 정보만을 자연스럽게 드러내면서, 거주 여부를 과도하게 단정하지 않습니다.
- source_word: יָלְדָה לּוֹ גַם הִיא בֵּן
  english_pob_choice: also bore him a son
  chosen_korean: 아들을 낳았고
  alternatives_korean:
  - 그에게도 아들을 낳았고
  - 그도 아들을 낳았고
  lexicon: HALOT
  rationale: 히브리어는 ‘그에게/그를 위하여’라는 이중목적 느낌이 있지만, 한국어에서는 ‘아들을 낳다’가 가장 자연스럽고 의미를 보존합니다. ‘도’는 이미 앞 문맥과 결합해 ‘also’의 강조를 충분히 담습니다.
- source_word: וַיָּשֶׂם אֶת שְׁמוֹ
  english_pob_choice: and he named him
  chosen_korean: 그가 그의 이름을 …이라 지었습니다
  alternatives_korean:
  - 그가 그의 이름을 …이라 불렀습니다
  - 그가 그의 이름을 …이라 했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘이름을 두다/세우다’는 한국어에서는 ‘이름을 …이라 짓다’가 가장 직접적입니다. 인칭 대명사 반복도 본문의 소유관계를 유지하려고 살렸습니다.
- source_word: אֲבִימֶלֶךְ
  english_pob_choice: Abimelek
  chosen_korean: 아비멜렉
  alternatives_korean:
  - 아비멜레크
  - 아비멜렉
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 ‘아비멜렉’으로 표기했습니다. EN POB의 Abimelek과도 대응되며, 히브리어 어형을 무리 없이 반영합니다.
