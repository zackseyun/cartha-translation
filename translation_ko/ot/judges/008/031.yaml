  source_fidelity: 히브리어의 핵심 의미(세겜에 있던 기드온의 첩이 그에게 아들을 낳았고, 그가 그 아이를 아비멜렉이라 이름함)는 대체로 반영되었습니다. 다만 יָלְדָה לּוֹ의 수여 대상 ‘그에게’가 한국어 본문에서는 명시되지 않았고, אֶת־שְׁמוֹ의 아이를 가리키는 소유 관계가 ‘그의 이름’으로 표현되어 선행사 혼동의 여지가 있습니다.
  naturalness: ‘그가 그의 이름을’은 현대 한국어에서 대명사가 중복되고 ‘그의’가 아버지를 가리킬 수도 있어 다소 부자연스럽습니다. ‘그는 그 아이의 이름을’이 자연스럽고 의미도 분명합니다.
  terminology: ‘첩’은 פִּילֶגֶשׁ의 사회적 지위 구별을 직접적으로 반영하는 적절한 표준어입니다. ‘세겜’, ‘아비멜렉’도 적절합니다.
