  language: ko
  text: 그들은 여룹바알의 집 — 곧 기드온에게 — 그가 이스라엘을 위해 한 모든 선한 일에 맞갖게 친절을 베풀지 않았습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
