  source_fidelity: 초안은 수곳 사람 가운데 한 젊은이를 붙잡아 물었다는 첫 부분과 지도자들의 수가 일흔일곱 명이라는 점을 대체로 반영합니다. 그러나 히브리어에서 기록하는 주체는 붙잡힌 젊은이인데, 초안은 문법상 기드온이 기록하여 젊은이에게 준 것으로 읽힙니다. 또한 אֵלָיו는 젊은이가 기드온을 위해/그에게 기록해 준다는 뜻입니다.
