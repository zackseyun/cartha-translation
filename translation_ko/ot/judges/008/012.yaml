  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
  footnotes:
  - marker: a
    text: Or, 'and he terrified the whole camp' or 'and he routed the whole camp.' The Hebrew verb can denote causing trembling or panic, with military implications in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 세바와 살문나는 도망하였고, 기드온이 그들을 추격하여 미디안의 두 왕 세바와 살문나를 사로잡았으며, 온 진영을 혼란에 빠뜨렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 진영을 두렵게 했다’, ‘온 진영을 패주시켰다’. 히브리어 동사는 떨게 하거나 공포에 빠뜨리게 하는 뜻을 가질 수 있으며, 문맥상 군사적 혼란을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  english_pob_choice: fled
  chosen_korean: 도망하였고
  alternatives_korean:
  - 달아났고
  - 도주하였고
  lexicon: HALOT
  rationale: נוּס의 기본 의미는 달아나거나 도망하는 것이므로, 서술체에 자연스러운 ‘도망하다’를 택했습니다.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  english_pob_choice: he pursued them
  chosen_korean: 그들을 추격하여
  alternatives_korean:
  - 그들을 뒤쫓아
  - 그들을 추적하여
  lexicon: HALOT
  rationale: רדף + אחרי의 군사적 뉘앙스를 살리기 위해 단순한 ‘쫓다’보다 ‘추격하다’가 더 정확합니다.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  english_pob_choice: the two kings of Midian
  chosen_korean: 미디안의 두 왕
  alternatives_korean:
  - 두 미디안 왕
  - 미디안의 두 임금
  lexicon: HALOT
  rationale: 히브리어의 소유·소속 관계를 그대로 살려 ‘미디안의 두 왕’으로 옮겼습니다.
- source_word: הֶחֱרִיד
  english_pob_choice: he threw the whole camp into panic
  chosen_korean: 온 진영을 혼란에 빠뜨렸습니다
  alternatives_korean:
  - 온 진영을 두렵게 했습니다
  - 온 진영을 떨게 했습니다
  lexicon: HALOT
  rationale: חרד의 사역형은 단순한 감정적 두려움보다 군사적 동요와 혼란을 포함하므로, ‘혼란에 빠뜨리다’가 문맥에 맞습니다.
theological_decisions:
- issue: 마지막 동사의 강도 재현
  chosen_reading: ‘혼란에 빠뜨렸다’로 옮겨 전투 맥락에서의 집단적 동요를 드러냈습니다.
  alternative_readings:
  - ‘두렵게 했다’
  - ‘공포에 떨게 했다’
  rationale: 본문은 단순한 심리 상태보다 적진 전체의 붕괴와 패주를 암시하므로, 약화시키지 않기 위해 군사적 결과를 드러내는 표현을 선택했습니다.
  doctrine_reference: 서사 본문의 전투 묘사 보존 원칙
