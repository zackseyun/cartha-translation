  text: וַ/יָּבֹא֙ אֶל אַנְשֵׁ֣י סֻכּ֔וֹת וַ/יֹּ֕אמֶר הִנֵּ֖ה זֶ֣בַח וְ/צַלְמֻנָּ֑ע אֲשֶׁר֩ חֵרַפְתֶּ֨ם אוֹתִ֜/י לֵ/אמֹ֗ר הֲ֠/כַף זֶ֣בַח וְ/צַלְמֻנָּ֤ע עַתָּה֙ בְּ/יָדֶ֔/ךָ כִּ֥י נִתֵּ֛ן לַ/אֲנָשֶׁ֥י/ךָ הַ/יְּעֵפִ֖ים לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
  footnotes:
  - marker: a
    text: Or, “with whom you reproached me” or “concerning whom you mocked me.” The Hebrew verb carries the sense of scornful reproach.
    reason: lexical_alternative
  - marker: b
    text: Literally, “Are the hand/palm of Zebah and Zalmunna now in your hand...?”—an idiom meaning, “Have you already captured them?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 기드온이 숙곳 사람들에게 가서 말했습니다. 「보십시오, 너희가 ‘네 손에 벌써 세바와 살문나가 있느냐? 그러니 우리가 네 지친 사람들에게 떡을 주어야 하겠느냐?’ 하며 나를 조롱했던 바로 그 세바와 살문나가 여기 있습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “너를 꾸짖은” “너를 조롱한”으로도 옮길 수 있습니다. 히브리어 동사는 멸시 섞인 책망의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “세바와 살문나의 손바닥이 지금 네 손에 있느냐…?”라는 관용구로, “이미 그들을 사로잡았느냐?”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אַנְשֵׁי סֻכּוֹת
  english_pob_choice: Then he came to the men of Succoth
  chosen_korean: 기드온이 숙곳 사람들에게 가서
  alternatives_korean:
  - 숙곳의 남자들에게 가서
  - 숙곳의 사람들에게 가서
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘사람들/남자들’이지만, 문맥상 기드온이 직접 대면한 숙곳의 주민들을 가리키므로 자연스러운 ‘숙곳 사람들’로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Here are
  chosen_korean: 보십시오
  alternatives_korean:
  - 여기 있습니다
  - 보라
  lexicon: HALOT
  rationale: הִנֵּה의 지시적·주의 환기 기능을 살리되, 현대 한국어에서 가장 자연스럽게 상대의 시선을 끄는 표현으로 ‘보십시오’를 택했습니다.
- source_word: אֲשֶׁר חֵרַפְתֶּם אֹתִי
  english_pob_choice: about whom you taunted me
  chosen_korean: 너희가 … 하며 나를 조롱했던
  alternatives_korean:
  - 너희가 … 하며 나를 비난했던
  - 너희가 … 하며 나를 모욕했던
  lexicon: HALOT
  rationale: חֵרַפְתֶּם은 단순한 비난보다 조롱과 멸시의 성격이 강하므로, POB의 ‘taunted’에 맞춰 ‘조롱하다’로 옮겼습니다.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע עַתָּה בְּיָדֶךָ
  english_pob_choice: Are Zebah and Zalmunna already in your hand
  chosen_korean: 네 손에 벌써 세바와 살문나가 있느냐
  alternatives_korean:
  - 세바와 살문나의 손바닥이 지금 네 손에 있느냐
  - 세바와 살문나를 이미 네가 붙잡았느냐
  lexicon: HALOT
  rationale: ‘손에 있다’는 히브리어 관용구를 그대로 살리면서, 한국어에서는 ‘벌써’로 עַתָּה의 시제·수사적 뉘앙스를 드러냈습니다.
- source_word: נִתֵּן לַאֲנָשֶׁיךָ הַיְּעֵפִים לָחֶם
  english_pob_choice: that we should give bread to your weary men
  chosen_korean: 그러니 우리가 네 지친 사람들에게 떡을 주어야 하겠느냐
  alternatives_korean:
  - 그러니 우리가 네 피곤한 사람들에게 빵을 주어야 하겠느냐
  - 그래서 우리가 네 지친 군사들에게 떡을 주어야 하겠느냐
  lexicon: HALOT
  rationale: לָחֶם은 기본적으로 ‘떡/빵’이지만, 이 문맥의 관용적 거절 발언을 현대 한국어로 자연스럽게 살려 ‘떡’을 택했습니다.
