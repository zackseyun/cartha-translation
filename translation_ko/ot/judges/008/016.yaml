id: JDG.8.16
reference: Judges 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּח֙ אֶת זִקְנֵ֣י הָ/עִ֔יר וְ/אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִ֑ים וַ/יֹּ֣דַע בָּ/הֶ֔ם אֵ֖ת אַנְשֵׁ֥י סֻכּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
  footnotes:
  - marker: a
    text: Or 'and with them he disciplined the men of Succoth'; the Hebrew expression is difficult, and some understand it more forcefully as punitive treatment rather than instruction in the ordinary sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 그가 그 성읍의 장로들과 광야의 가시와 찔레를 취하여, 그것으로 숙곳 사람들을 징계했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것으로 숙곳 사람들을 가르쳤습니다’. 히브리어 표현은 난해하며, 문맥상 더 강한 징벌 행위로 이해하는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  english_pob_choice: the elders of the city
  chosen_korean: 그 성읍의 장로들
  alternatives_korean:
  - 그 성읍의 지도자들
  lexicon: HALOT
  rationale: זִקְנֵי는 문자적으로 ‘장로들’이며, 여기서는 성읍의 대표자들을 가리키므로 직역을 살려 사회적 직함을 보존했습니다.
- source_word: קוֹצֵי הַמִּדְבָּר
  english_pob_choice: thorns of the wilderness
  chosen_korean: 광야의 가시
  alternatives_korean:
  - 광야의 가시덤불
  - 사막의 가시
  lexicon: HALOT
  rationale: קוֹצִים은 구체적인 가시/가시식물을 가리키므로, 이미지와 소유 관계를 그대로 드러내는 ‘광야의 가시’로 옮겼습니다.
- source_word: הַבַּרְקֳנִים
  english_pob_choice: briers
  chosen_korean: 찔레
  alternatives_korean:
  - 가시나무
  - 찔레덤불
  lexicon: HALOT
  rationale: 해당 어휘는 가시가 많은 식물을 가리키며, 현대 한국어에서 자연스럽고 고통스러운 도구 이미지를 살릴 수 있는 ‘찔레’를 택했습니다.
- source_word: וַיֹּדַע בָּהֶם
  english_pob_choice: and with them he disciplined
  chosen_korean: 그것으로 ... 징계했습니다
  alternatives_korean:
  - 그것으로 ... 알게 했습니다
  - 그것으로 ... 가르쳤습니다
  - 그것으로 ... 혼내주었습니다
  lexicon: HALOT
  rationale: 히필 형태의 ידע는 여기서 단순한 ‘알게 하다’보다 숙곳 사람들에게 가한 징벌적 조치를 가리키는 관용적 표현으로 보이므로, 문맥에 맞는 ‘징계하다’를 채택했습니다.
- source_word: אַנְשֵׁי סֻכּוֹת
  english_pob_choice: the men of Succoth
  chosen_korean: 숙곳 사람들
  alternatives_korean:
  - 숙곳의 남자들
  - 숙곳의 사람들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘사람들/남자들’이지만, 문맥상 공동체 전체를 가리키는 표현이므로 한국어에서는 자연스럽게 ‘숙곳 사람들’로 옮겼습니다.
theological_decisions:
- issue: 히필 ידע의 의미를 ‘가르치다/알리다’로 둘지, 징벌적 의미로 둘지
  chosen_reading: 문맥상 폭력적 처벌을 가리키는 표현으로 보고 ‘징계했습니다’로 번역했습니다.
  alternative_readings:
  - 그것으로 숙곳 사람들을 가르쳤습니다
  - 그것으로 숙곳 사람들을 알게 했습니다
  rationale: 가시와 찔레를 도구로 삼는 서술은 교육이나 통지보다 처벌을 분명히 시사하므로, 원문의 난해함을 숨기지 않으면서도 독자가 의도를 이해하도록 했습니다.
  doctrine_reference: 사사기 8장 서술의 문맥적 해석
