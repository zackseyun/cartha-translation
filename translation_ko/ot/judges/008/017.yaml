  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת מִגְדַּ֥ל פְּנוּאֵ֖ל נָתָ֑ץ וַֽ/יַּהֲרֹ֖ג אֶת אַנְשֵׁ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/017.yaml
  text: He tore down the tower of Penuel and killed the men of the city[a].
  footnotes:
  - marker: a
    text: 'Penuel: traditionally also spelled ''Peniel.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그는 브누엘[a]의 망대를 헐고 그 성읍의 남자들을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '브누엘: 전통적으로 ‘브니엘’로도 표기합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדַּל
  english_pob_choice: tower
  chosen_korean: 망대
  alternatives_korean:
  - 탑
  - 성루
  lexicon: HALOT
  rationale: 성곽 안팎의 높은 방어 구조물을 가리키는 말이므로, 평이한 ‘망대’가 ‘tower’를 가장 직접적으로 옮깁니다.
- source_word: נָתָץ
  english_pob_choice: tore down
  chosen_korean: 헐어버리고
  alternatives_korean:
  - 무너뜨리고
  - 파괴하고
  lexicon: HALOT
  rationale: 건축물을 아래로 끌어내려 허무는 동작을 자연스럽게 살리면서, 단순한 파괴보다 구조물 해체의 뉘앙스를 유지합니다.
- source_word: אַנְשֵׁי הָעִיר
  english_pob_choice: the men of the city
  chosen_korean: 그 성읍의 사람들
  alternatives_korean:
  - 그 성읍의 남자들
  - 그 성읍의 주민들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘성읍의 남자들’이지만, 한국어에서는 전쟁 문맥의 집단 표지를 자연스럽게 살리기 위해 ‘사람들’로 옮기되, 성별 표지는 본문 의미를 과도하게 바꾸지 않는 범위에서 완화했습니다.
theological_decisions:
- issue: 고유명사 Penuel의 음역
  chosen_reading: Penuel을 그대로 음역해 표기했습니다.
  alternative_readings:
  - 페니엘
  - 브누엘
  rationale: 본문의 인명/지명은 표준 음역보다 מקור형의 자모 배열을 보존하는 쪽이 주석 가능성이 높아, 영어 POB의 Penuel을 따랐습니다.
  doctrine_reference: 고유명사 표기 일관성
- issue: 보복 행위의 서술 강도
  chosen_reading: ‘헐어버리고 … 죽였습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 무너뜨리고 … 처형했습니다
  - 파괴하고 … 살해했습니다
  rationale: 히브리어 נָתָץ와 וַיַּהֲרֹג의 직접적이고 거친 행위를 약화하지 않도록, 완곡한 해석어보다 동작을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 본문의 서사적 직설성 보존
