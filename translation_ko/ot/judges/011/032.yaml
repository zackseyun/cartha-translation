  source_fidelity: 초안은 입다가 암몬과 싸우러 갔고 여호와께서 암몬 사람들을 그의 손에 넘기셨다는 기본 의미를 전달합니다. 그러나 문장이 미완결된 채 끝나며, 신명 표기가 감사 추적의 ‘Yahweh’ 결정과 일치하지 않습니다.
  naturalness: ‘싸우매 … 붙이시니’는 현대 표준어 합쇼체 문장으로는 고풍스럽고 종결되지 않은 형태입니다. 두 개의 완결된 과거 서술문으로 다듬는 것이 자연스럽습니다.
  terminology: יִפְתָּח은 ‘입다’, בְּנֵי עַמּוֹן은 문맥상 ‘암몬 자손’으로 옮길 수 있습니다. יְהוָה는 감사 추적에 따라 ‘야훼’로 표기합니다. ‘손에 넘겨주셨습니다’는 ‘그의 손에 주셨다’라는 전쟁 관용구를 자연스럽게 보존합니다.
