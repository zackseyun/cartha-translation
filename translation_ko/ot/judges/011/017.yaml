source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
  footnotes:
  - marker: a
    text: Hebrew 'Please let me pass' uses a first-person singular form, with Israel speaking corporately as a single entity; some English translations render it 'let us pass.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he refused' / 'he did not consent' for 'he was unwilling.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘이 에돔 왕에게 사신들을 보내며 말했습니다. 「부디 당신의 땅을 지나가게 해 주십시오.」 그러나 에돔 왕은 듣지 않았습니다. 이스라엘은 모압 왕에게도 보냈으나 그는 응하지 않았습니다. 그래서 이스라엘은 가데스에 머물렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 1인칭 단수 청원형은 이스라엘 공동체가 한 몸처럼 말하는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘응하지 않았습니다’는 אָבָה의 ‘기꺼이 받아들이다/동의하다’라는 뜻을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח / שָׁלַח
  english_pob_choice: sent
  chosen_korean: 보내다
  alternatives_korean:
  - 파견하다
  - 발송하다
  lexicon: HALOT
  rationale: 외교적 맥락의 שׁלח을 한국어 서술문에서 가장 자연스럽게 풀면 ‘보내다’가 되며, 문맥의 단순한 파견 동작을 잘 드러냅니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신
  alternatives_korean:
  - 전령
  - 메신저
  - 천사
  lexicon: HALOT
  rationale: 인간 사이의 교섭을 다루므로 ‘천사’는 배제하고, 외교적 뉘앙스를 가진 ‘사신’이 원문의 의미를 가장 잘 살립니다.
- source_word: אֶעְבְּרָה נָּא בְאַרְצֶךָ
  english_pob_choice: Please let us pass through your land
  chosen_korean: 부디 당신의 땅을 지나가게 해 주십시오
  alternatives_korean:
  - 부디 우리를 당신의 땅으로 지나가게 해 주십시오
  - 부디 당신의 땅을 통과하게 해 주십시오
  lexicon: HALOT
  rationale: cohortative와 נָא의 정중한 요청을 살려 공손한 청원문으로 옮겼고, עבר의 이동 의미는 ‘지나가다’로 표현했습니다.
- source_word: וְלֹא שָׁמַע
  english_pob_choice: did not listen
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 귀를 기울이지 않았습니다
  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 단순 청각보다 요청을 받아들이는 태도를 가리키지만, 여기서는 과도한 해석을 피하고 ‘듣지 않았다’로 간결하게 옮겼습니다.
- source_word: וְלֹא אָבָה
  english_pob_choice: he was unwilling
  chosen_korean: 응하지 않았습니다
  alternatives_korean:
  - 원하지 않았습니다
  - 마지않았습니다
  - 거부했습니다
  lexicon: HALOT
  rationale: אָבָה의 핵심은 ‘뜻하여 응하다/마음이 내키다’이므로, 강한 거절보다 수락하지 않음을 드러내는 ‘응하지 않았다’가 적절합니다.
- source_word: וַיֵּשֶׁב בְּקָדֵשׁ
  english_pob_choice: remained at Kadesh
  chosen_korean: 가데스에 머물렀습니다
  alternatives_korean:
  - 가데스에 남아 있었습니다
  - 가데스에 거주했습니다
  lexicon: HALOT
  rationale: 임시 체류의 뉘앙스를 살려 ‘머물렀습니다’로 옮겼고, 지명은 통상적으로 ‘가데스’로 표기했습니다.
theological_decisions:
- issue: 본문의 이스라엘 공동체 화법과 단수 동사 형태
  chosen_reading: 공동체 전체가 한 사람처럼 말하는 요청으로 이해해 한국어에서는 복수적 의미를 드러내되, 직접 화법은 정중한 단수형 요청으로 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘우리’를 명시하여 공동체 발화로 드러내기
  - 문자적으로 단수형 요청을 유지하기
  rationale: 히브리어의 1인칭 단수 cohortative는 집단을 대표하는 화법이므로, 한국어에서는 독자의 오해를 피하면서도 원문의 대표성 효과를 유지해야 합니다.
  doctrine_reference: 공동체 대표 발화(collective singular)와 서술 맥락 보존
