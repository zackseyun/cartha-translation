id: JDG.11.20
reference: Judges 11:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
  footnotes:
  - marker: a
    text: Or 'did not believe Israel' or, by implication, 'did not trust Israel enough to let them pass through.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all his people'; the text does not explicitly say 'army,' though the context is military.
    reason: lexical_alternative
  - marker: c
    text: Or 'fought against Israel.' Hebrew literally says 'fought with Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 시혼은 이스라엘이 자기 영토를 지나가는 것을 신뢰하지 않았습니다[a]. 그래서 시혼은 자기 모든 사람을 모으고, 그들은 야하스에 진을 쳤으며[b][c], 이스라엘과 싸웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 믿지 않았다’ 혹은, 함의상, ‘이스라엘이 지나가도록 허락할 만큼 믿지 않았다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 모든 사람들’이라고 하며, 본문은 ‘군대’라고 직접 말하지 않습니다. 다만 문맥은 군사적입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야하스에서.’ 장소명 앞의 전치사는 군사적 진영 위치를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  english_pob_choice: did not trust
  chosen_korean: 신뢰하지 않았습니다
  alternatives_korean:
  - 믿지 않았습니다
  - 허락하지 않았습니다
  lexicon: HALOT
  rationale: Hiphil of אמן here는 단순한 지적 동의보다 신뢰/확신을 두는 의미이므로, 한국어도 ‘신뢰하다’로 옮겨 거절의 동기를 드러내는 것이 source-direct합니다.
- source_word: בִּגְבֻלוֹ
  english_pob_choice: through his territory
  chosen_korean: 자기 영토를 지나가는
  alternatives_korean:
  - 자기 경계를 지나가는
  - 자기 경계 안을 통과하는
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계’도 될 수 있지만, 여기서는 통행 요청의 맥락상 ‘영토’가 자연스럽고, 목적어 구조를 살려 ‘지나가는’으로 표현했습니다.
- source_word: כָּל עַמּוֹ
  english_pob_choice: all his people
  chosen_korean: 자기 모든 사람을
  alternatives_korean:
  - 자기 온 백성을
  - 자기 모든 군사를
  lexicon: HALOT
  rationale: 히브리어는 ‘군대’가 아니라 ‘백성/사람들’이라고 말하므로, 군사적으로 보이더라도 원문 범위를 좁히지 않고 ‘모든 사람’으로 보존했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: they camped
  chosen_korean: 진을 쳤으며
  alternatives_korean:
  - 캠프를 쳤으며
  - 주둔했으며
  lexicon: HALOT
  rationale: 복수 주어에 맞는 군사적 집결을 자연스럽게 드러내면서도, 히브리어의 ‘진 치다/주둔하다’ 의미를 살리기 위해 ‘진을 쳤다’를 선택했습니다.
theological_decisions:
- issue: עִם יִשְׂרָאֵל의 전치사 뉘앙스
  chosen_reading: ‘이스라엘과 싸웠습니다’로 옮겨 적대 관계를 명확히 하되, 원문의 ‘with’ 구조를 과도하게 문자화하지 않았습니다.
  alternative_readings:
  - 이스라엘과 싸웠습니다
  - 이스라엘을 상대로 싸웠습니다
  rationale: 한국어에서는 ‘싸웠습니다’가 이미 대립 관계를 내포하므로, 본문 의도를 자연스럽게 전달하는 쪽을 택했습니다.
  doctrine_reference: 서술적 역사 본문에서의 자연스러운 의미 전달
