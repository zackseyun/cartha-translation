  source_fidelity: 후반의 목적어는 아모리 족속 자체가 아니라 그들이 점유하던 땅을 가리킵니다. 초안의 “그것”은 한국어에서 지시 대상이 불분명하므로 “그 땅”으로 밝혀 주는 편이 원문의 의미를 정확히 전달합니다. 또한 הוֹרִישׁ은 단순한 축출뿐 아니라 점유를 잃게 함을 뜻하므로 이를 반영했습니다.
  naturalness: “이스라엘의 하나님 야훼께서”와 “당신이 그 땅을 차지하시겠습니까?”는 현대 표준어 합쇼체에서 자연스럽고, 외교적 논박이라는 문맥의 수사적 압박도 유지합니다.
  terminology: יהוה는 번역 방침 및 영어 POB에 맞추어 “야훼”로 유지했습니다. ירש 계열의 대조(아모리 족속을 점유지에서 잃게 함 / 그 땅을 차지함)는 “그 땅을 빼앗으시고”와 “그 땅을 차지하시겠습니까”로 드러냈습니다.
