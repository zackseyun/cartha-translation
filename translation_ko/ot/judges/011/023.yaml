base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
  footnotes:
  - marker: a
    text: Or 'to inherit it' / 'to take possession of it.' The Hebrew verb can denote receiving or taking possession of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이스라엘의 하나님 야훼께서 아모리 족속을 자기 백성 이스라엘 앞에서 내쫓아 그 땅을 빼앗으셨는데, 당신이 그 땅을 차지하시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “차지하다”로 옮긴 히브리어 동사 ירש는 땅을 ‘상속받다’, ‘소유하게 되다’, 또는 ‘점유하다’라는 뜻으로도 쓰입니다.
    reason: lexical_alternative
