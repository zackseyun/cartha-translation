base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
  footnotes:
  - marker: a
    text: Or 'to inherit it' / 'to take possession of it.' The Hebrew verb can denote receiving or taking possession of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼, 이스라엘의 하나님께서 아모리 족속을 자기 백성 이스라엘 앞에서 몰아내셨는데, 당신이 그것을 차지하려고 하십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “차지하다”는 כאן הירש(ירש)의 의미를 넓게 옮긴 것으로, 문맥상 ‘상속받다’ 또는 ‘소유하게 되다’의 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 고유한 언약 이름을 살리기 위해 직역적 대체어인 주님보다 음역형 야훼를 택했습니다.
- source_word: הוֹרִישׁ
