  - 쫓아내어 차지하지 못하게 하셨는데
  lexicon: HALOT
  rationale: 땅을 빼앗겨 소유를 잃게 하는 뜻을 한국어로 자연스럽게 드러내되, 단순 이동보다 전거 상의 점유 상실을 반영했습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
