  lexicon: HALOT
  rationale: אנ용격 관계를 자연스럽게 풀어 이스라엘이 야훼의 소유 백성임을 분명히 했습니다.
- source_word: תִּירָשֶׁנּוּ
  english_pob_choice: to possess it
  chosen_korean: 차지하려고 하십니까
  alternatives_korean:
  - 소유하려고 하십니까
  - 물려받으려고 하십니까
  - 점유하려고 하십니까
  lexicon: HALOT
  rationale: 의문형 수사 질문의 압박을 살리면서, 땅/영토를 대상으로 한 차지의 뉘앙스를 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름과 절의 논박적 수사
  chosen_reading: 야훼를 고유명으로 유지하고, 후반은 정중한 수사 의문문으로 옮겼습니다.
  alternative_readings:
  - 주님께서… 하셨는데
  - 당신이 그것을 차지하겠습니까?
  rationale: 본문은 전쟁 승리의 근거를 야훼의 행위로 제시하는 논박이므로, 신명화하지 않고 고유 이름을 드러내는 것이 문맥의 힘을 보존합니다. 또한 사사기 11장의 대화체는 예의형을 유지하되, 반박의 강도를 잃지 않아야 합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
