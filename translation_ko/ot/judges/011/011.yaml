revisions:
- from: 그리하여 입다는 길르앗의 장로들과 함께 갔습니다. 그러자 백성이 그를 자기들 위에 우두머리와 지휘관으로 세웠습니다. 그리고 입다는 미스바에서 야훼 앞에 자기 모든 말을 전했습니다.[a][b]
  to: 그리하여 입다는 길르앗의 장로들과 함께 갔습니다. 그러자 백성이 그를 자기들 위에 우두머리와 지휘관으로[a] 세웠습니다. 그리고 입다는 미스바에서 야훼 앞에 자기가 한 모든 말을 말했습니다.[b]
  rationale: 말하다를 뜻하는 원문의 동사를 ‘말했습니다’로 옮겨 해석적 보충을 피했습니다. 또한 ‘모든 말’을 ‘조건’으로 축소하지 않고, 가능한 문맥적 뉘앙스는 각주에서 대안으로만 제시했습니다. 각주 a는 원문의 능동 주어를 유지하고, 표지는 각각 관련 어구에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:09:48Z'
