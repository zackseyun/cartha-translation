  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יִפְתָּח֙ עִם זִקְנֵ֣י גִלְעָ֔ד וַ/יָּשִׂ֨ימוּ הָ/עָ֥ם אוֹת֛/וֹ עֲלֵי/הֶ֖ם לְ/רֹ֣אשׁ וּ/לְ/קָצִ֑ין וַ/יְדַבֵּ֨ר יִפְתָּ֧ח אֶת כָּל דְּבָרָ֛י/ו לִ/פְנֵ֥י יְהוָ֖ה בַּ/מִּצְפָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
  footnotes:
  - marker: a
    text: Or 'the people appointed him head and ruler over them.' The Hebrew term rendered 'commander' can also mean 'ruler' or 'captain.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Jephthah repeated all his terms before the LORD at Mizpah.' The Hebrew literally says 'spoke all his words.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 입다는 길르앗의 장로들과 함께 갔습니다. 그러자 백성이 그를 자기들 위에 우두머리와 지휘관으로[a] 세웠습니다. 그리고 입다는 미스바에서 야훼 앞에 자기가 한 모든 말을 말했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성이 그를 자기들 위에 우두머리와 통치자로 세웠습니다.’ 히브리어 קָצִין은 ‘지휘관’ 외에 ‘통치자’ 또는 ‘대장’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘입다가 미스바에서 야훼 앞에 자기가 한 모든 말을 되풀이했습니다.’ 히브리어는 문자적으로 ‘그의 모든 말을 말했다’라고 되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ עִם
  english_pob_choice: went with
  chosen_korean: 함께 갔습니다
  alternatives_korean:
  - 가서 함께했습니다
  - 동행했습니다
  lexicon: HALOT
  rationale: 동반 관계를 자연스럽게 드러내면서도, 히브리어의 단순한 서술 진행을 과장하지 않도록 했습니다.
- source_word: וַיָּשִׂימוּ ... לְרֹאשׁ וּלְקָצִין
  english_pob_choice: made him head and commander over them
  chosen_korean: 우두머리와 지휘관으로 세웠습니다
  alternatives_korean:
  - 머리와 지휘관으로 세웠습니다
  - 지도자와 사령관으로 세웠습니다
  lexicon: HALOT
  rationale: לְרֹאשׁ의 비유적 ‘머리’와 קָצִין의 통치·군사적 직분을 살리되, 한국어에서는 ‘우두머리’와 ‘지휘관’이 공적 임명과 지휘 역할을 비교적 직접적으로 드러냅니다.
- source_word: וַיְדַבֵּר ... אֶת כָּל דְּבָרָיו
  english_pob_choice: spoke all his words
  chosen_korean: 자기 모든 말을 전했습니다
  alternatives_korean:
  - 자기 모든 말을 말했습니다
  - 자기 모든 말을 했습니다
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조를 유지하면서도, 한국어에서 ‘전하다’가 공적인 진술·제시의 뉘앙스를 자연스럽게 담을 수 있어 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신성명은 ‘야훼’로 옮겨, 원문 고유명을 가리고 통상적 종교어로 완화하지 않도록 했습니다.
theological_decisions:
- issue: 입다가 야훼 앞에서 ‘자기 모든 말’을 전한 구절의 성격
  chosen_reading: “자기 모든 말”을 유지해, 단순한 서약의 재진술인지 공적 합의의 확인인지 확정하지 않았습니다.
  alternative_readings:
  - ‘자기 조건’을 전했습니다
  - ‘자기 제안을 반복했습니다’
  rationale: 히브리어는 표현을 넓게 유지하며, 문맥상 법적 확인·의례적 진술·협상 재확인 가능성을 모두 열어 둡니다. 번역도 이 긴장을 보존했습니다.
  doctrine_reference: 'POB 번역 원칙: 해석적 축소보다 원문의 의미 가능 범위를 보존'
