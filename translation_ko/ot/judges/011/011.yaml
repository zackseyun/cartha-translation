  - severity: low
    issue: 각주 a가 수동태로 되어 있어 원문의 명시적 행위 주체인 ‘백성’을 흐립니다.
    rationale: 대안 번역에서도 ‘백성이 그를 세웠다’라는 능동 구문을 유지할 수 있습니다.
