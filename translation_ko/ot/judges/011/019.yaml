source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
  footnotes:
  - marker: a
    text: Or “to my own place,” with Israel speaking as a collective singular. Compare the parallel request in Numbers 21:22, which reads “to my place” in the Hebrew tradition here reflected.
    reason: cross_reference
  - marker: b
    text: “Messengers” could also be rendered “envoys” in this diplomatic setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘이 사자를 아모리 사람의 왕이며 헤스본의 왕인 시혼에게 보내어, 이스라엘이 그에게 말했습니다. 「부디 당신의 땅을 지나 제 자리까지 가게 해주십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 자리’로 읽을 수 있어, 이스라엘이 집합적 단수로 말하는 표현일 가능성이 있습니다. 민수기 21:22의 평행 요청도 비교해 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자
  alternatives_korean:
  - 전령
  - 사신
  - 천사
  lexicon: HALOT
  rationale: 외교적 문맥에서 사람 대표를 가리키므로 하늘 존재인 ‘천사’를 배제하고, 자연스러운 공문체 표현인 ‘사자’를 택했습니다.
- source_word: סִיחוֹן מֶלֶךְ הָאֱמֹרִי מֶלֶךְ חֶשְׁבּוֹן
  english_pob_choice: Sihon king of the Amorites, king of Heshbon
  chosen_korean: 아모리 사람의 왕이며 헤스본의 왕인 시혼
  alternatives_korean:
  - 아모리 사람의 왕 시혼, 헤스본의 왕
  - 아모리인의 왕이며 헤스본 왕인 시혼
  lexicon: HALOT
  rationale: 히브리어의 연속된 관형 구조를 그대로 드러내어 시혼의 민족적·정치적 직함을 함께 보존했습니다.
- source_word: נַעְבְּרָה נָּא בְאַרְצְךָ
  english_pob_choice: Please let us pass through your land
  chosen_korean: 부디 당신의 땅을 지나
  alternatives_korean:
  - 부디 당신의 땅을 통과하게 해주십시오
  - 제발 당신의 땅을 지나가게 해주십시오
  lexicon: HALOT
  rationale: 과거지향적 이동 요청인 עבר를 ‘지나’로 옮기고, נָא의 공손한 청유를 ‘부디’로 살렸습니다.
- source_word: עַד מְקוֹמִי
  english_pob_choice: to my place
  chosen_korean: 제 자리까지
  alternatives_korean:
  - 제 곳까지
  - 제 땅까지
  - 우리 자리까지
  lexicon: HALOT
  rationale: 원문은 단수 ‘my place’이므로 집합적 화자를 자연스럽게 드러내되, POB가 보존한 단수 뉘앙스를 반영해 ‘제 자리’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘의 집합적 단수 표현
  chosen_reading: 본문의 마지막 목적지는 단수 ‘제 자리’로 유지했습니다.
  alternative_readings:
  - 우리 자리
  - 우리의 자리
  - 우리 땅
  rationale: 히브리어가 복수 화자를 집합적 단수로 말하는 가능성을 그대로 남겨, 사본 및 평행본문의 긴장을 평준화하지 않았습니다.
