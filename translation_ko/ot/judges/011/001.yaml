source:
  edition: WLC
  text: וְ/יִפְתָּ֣ח הַ/גִּלְעָדִ֗י הָיָה֙ גִּבּ֣וֹר חַ֔יִל וְ/ה֖וּא בֶּן אִשָּׁ֣ה זוֹנָ֑ה וַ/יּ֥וֹלֶד גִּלְעָ֖ד אֶת יִפְתָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Now Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
  footnotes:
  - marker: a
    text: Or, more formally, 'a mighty man of valor.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the son of a prostitute'; older English versions often have 'harlot.'
    reason: lexical_alternative
  - marker: c
    text: Gilead here is the personal name of Jephthah's father, not merely a reference to the region.
    reason: cultural_note
translation:
  language: ko
  text: 길르앗 사람 입다는 큰 용사였습니다[a]. 그는 창녀의 아들이었고[b][c], 길르앗이 입다를 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘용맹의 큰 사람’ 또는 보다 형식적으로 ‘용맹한 용사’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘창녀의 아들’이라고 말합니다. 오래된 번역은 ‘음녀/기생’으로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘길르앗’은 지역명이 아니라 입다의 아버지 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ
  english_pob_choice: Now
  chosen_korean: 그리고 / 문맥상 새 장면 도입
  alternatives_korean:
  - 그런데
  - 이제
  lexicon: 문맥 전환
  rationale: 서두의 연결사는 히브리어 서사의 장면 전환 기능을 가지므로, 본문에서는 자연스럽게 사건을 여는 표현으로 처리했습니다.
- source_word: הַגִּלְעָדִי
  english_pob_choice: the Gileadite
  chosen_korean: 길르앗 사람
  alternatives_korean:
  - 길르앗인
  - 길르앗 출신
  lexicon: HALOT
  rationale: 형용사적 지파/지역 표지는 한국어에서 ‘~사람’이 가장 자연스럽고, 인명식 별칭을 유지합니다.
- source_word: גִּבּוֹר חַיִל
  english_pob_choice: a mighty warrior
  chosen_korean: 큰 용사
  alternatives_korean:
  - 용맹한 전사
  - 능력 있는 사람
  - 용맹한 사람
  lexicon: HALOT
  rationale: 전투적·영웅적 역량을 가리키는 결합어로서, 현대 한국어에서 간결하고 힘 있는 ‘큰 용사’가 문맥에 맞습니다.
- source_word: בֶּן אִשָּׁה זוֹנָה
  english_pob_choice: the son of a prostitute
  chosen_korean: 창녀의 아들
  alternatives_korean:
  - 매춘부의 아들
  - 음란한 여인의 아들
  lexicon: HALOT
  rationale: זוֹנָה는 직업적·사회적 함의를 가진 말이므로, 완곡한 표현보다 직설적인 ‘창녀’가 원문의 강도를 더 정확히 드러냅니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 생부가 되었습니다
  lexicon: HALOT
  rationale: 계보 문맥에서 생물학적 부성을 나타내므로, 가장 직접적인 한국어 동사 ‘낳다’를 사용했습니다.
theological_decisions:
- issue: 사회적 낙인 표현의 직설성
  chosen_reading: ‘창녀의 아들’이라는 직접 표현을 유지했습니다.
  alternative_readings:
  - 완곡한 표현으로 약화
  - 전통적 교회어휘로 순화
  rationale: 본문은 입다의 출생 배경이 지닌 수치와 긴장을 숨기지 않으므로, 독자가 그 충격을 그대로 인식하도록 직설을 유지하는 것이 본문 충실성에 부합합니다.
  doctrine_reference: 서사 본문의 역사적·문학적 정직성
- issue: ‘길르앗’의 인명 여부
  chosen_reading: 뒤의 ‘길르앗’은 지역이 아니라 사람 이름으로 읽었습니다.
  alternative_readings:
  - 단순히 지명으로 이해
  - 설명 없이 지역 표지로만 처리
  rationale: 히브리어 문맥상 ‘길르앗이 입다를 낳았다’는 계보 진술이므로, 같은 표면형이라도 인명으로 읽어야 문장의 의미가 성립합니다.
  doctrine_reference: 문법·서사 맥락
