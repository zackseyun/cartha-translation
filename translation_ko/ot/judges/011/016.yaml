  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
  footnotes:
  - marker: a
    text: Or 'Sea of Reeds' for 'Red Sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이집트에서 올라올 때에 이스라엘은 광야를 지나 홍해까지 가서 가데스에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대 바다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  english_pob_choice: when they came up from Egypt
  chosen_korean: 그들이 이집트에서 올라올 때에
  alternatives_korean:
  - 그들이 이집트에서 올라왔을 때에
  - 그들이 이집트에서 올라오는 동안
  lexicon: HALOT
  rationale: בְּ + 부정사구는 시간 배경을 나타내므로, 한국어도 ‘~할 때에’로 옮겨 사건의 배경 시점을 자연스럽게 드러냈습니다.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  english_pob_choice: Israel went through the wilderness
  chosen_korean: 이스라엘은 광야를 지나
  alternatives_korean:
  - 이스라엘은 광야에서 갔고
  - 이스라엘은 광야를 여행했고
  lexicon: HALOT
  rationale: הלך는 단순 ‘가다’이지만, 문맥상 이동 경로를 강조하므로 ‘광야를 지나’로 옮겨 길을 따라 이동한 뜻을 살렸습니다.
- source_word: עַד יַם סוּף
  english_pob_choice: as far as the Red Sea
  chosen_korean: 홍해까지
  alternatives_korean:
  - 홍해에 이르기까지
  - 갈대 바다까지
  lexicon: HALOT
  rationale: עַד은 도달 범위를 나타내므로 ‘-까지’가 적절합니다. יַם סוּף은 전통적으로 한국어 성경에서 널리 쓰이는 ‘홍해’를 본문에 두고, 대안 독해는 주석으로 보존했습니다.
- source_word: וַיָּבֹא קָדֵשָׁה
  english_pob_choice: came to Kadesh
  chosen_korean: 가데스에 이르렀습니다
  alternatives_korean:
  - 가데스로 왔습니다
  - 가데스에 도착했습니다
  lexicon: HALOT
  rationale: בוא는 ‘오다/이르다/도착하다’의 뜻이므로, 서술의 연속성과 격식을 함께 살릴 수 있는 ‘이르렀습니다’를 선택했습니다.
