revisions:
- from: 그녀가 그에게 말했습니다. “내 아버지여, 아버지는 야훼께 입을 열어 맹세하셨습니다. 아버지의 입에서 나온 대로 저에게 행하십시오. 야훼께서 아버지를 위하여 아버지의 원수들, 곧 암몬 자손에게 복수하셨기 때문입니다.”[a][b]
  to: 그녀가 그에게 말했습니다. “내 아버지여, 아버지께서 야훼께 입을 여셨으니[a], 제게 아버지의 입에서 나온 대로 하십시오. 야훼께서 아버지를 위하여 아버지의 원수들, 곧 암몬 자손에게[b] 복수하셨기 때문입니다.”
  rationale: 히브리어의 ‘입을 열다’와 이어지는 ‘입에서 나온 대로’라는 반복을 본문에서 보존하고, 서원·맹세의 함의는 각주로 처리했습니다. ‘제게 … 하십시오’로 자연스러운 합쇼체를 사용했으며, 야훼의 보복이 입다를 위한 것이고 대상이 그의 원수들인 암몬 자손이라는 구문 관계를 유지했습니다. 서원의 구체적 이행 방식에 관한 어떠한 해석도 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:09:54Z'
