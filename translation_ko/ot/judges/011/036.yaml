  source_fidelity: ‘입을 열어 맹세하셨습니다’는 히브리어의 ‘입을 열다’ 관용구를 본문에서 해석적으로 풀어 쓴 표현입니다. 또한 ‘저에게 행하십시오’는 직역적이나 현대 한국어에서 다소 부자연스럽습니다. 야훼께서 입다를 위하여 그의 원수들인 암몬 자손에게 보복하셨다는 관계는 유지되어야 합니다.
  naturalness: ‘야훼께 입을 여셨으니’는 원문의 반복되는 ‘입’ 이미지를 보존하며, 각주가 관용적 의미를 설명합니다. ‘제게 아버지의 입에서 나온 대로 하십시오’는 합쇼체를 유지하면서 더 자연스럽습니다. 각주 표지도 해당 표현 바로 뒤에 배치했습니다.
  terminology: ‘야훼’, ‘암몬 자손’, ‘복수하다’는 원문의 신명, 집단 명칭, 보복 의미를 적절히 반영합니다. 이 절은 서원의 이행 결과를 특정하지 않으므로 그 애매성을 그대로 보존합니다.
