  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אָבִ/י֙ פָּצִ֤יתָה אֶת פִּ֨י/ךָ֙ אֶל יְהוָ֔ה עֲשֵׂ֣ה לִ֔/י כַּ/אֲשֶׁ֖ר יָצָ֣א מִ/פִּ֑י/ךָ אַחֲרֵ֡י אֲשֶׁ֣ר עָשָׂה֩ לְ/ךָ֙ יְהוָ֧ה נְקָמ֛וֹת מֵ/אֹיְבֶ֖י/ךָ מִ/בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
  footnotes:
  - marker: a
    text: 'Or “against the Ammonites.” Hebrew: “from/on the sons of Ammon.”'
    reason: lexical_alternative
  - marker: b
    text: “You have opened your mouth to the LORD” is a Hebrew idiom for making a solemn spoken vow.
    reason: cultural_note
translation:
  language: ko
  text: 그녀가 그에게 말했습니다. “내 아버지여, 아버지께서 야훼께 입을 여셨으니[a], 제게 아버지의 입에서 나온 대로 하십시오. 야훼께서 아버지를 위하여 아버지의 원수들, 곧 암몬 자손에게[b] 복수하셨기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 엄숙한 서원이나 맹세를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 ‘암몬의 아들들/자손들로부터’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת פִּיךָ
  english_pob_choice: you have opened your mouth
  chosen_korean: 입을 열어
  alternatives_korean:
  - 말씀하셨습니다
  - 맹세하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리되 한국어에서는 자연스럽게 ‘입을 열어’로 옮기고, 이어지는 문맥에서 그 뜻이 맹세임을 드러내게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유 신명은 관례적 대체어보다 음역형 ‘야훼’를 사용해 원문 고유성을 보존했습니다.
- source_word: עֲשֵׂה לִי
  english_pob_choice: do to me
  chosen_korean: 저에게 행하십시오
  alternatives_korean:
  - 저를 대하십시오
  - 저에게 해주십시오
  lexicon: HALOT
  rationale: 직접목적어의 수동적 수용 의미를 살리면서도 한국어에서 자연스러운 명령/청유형으로 옮겼습니다.
- source_word: נְקָמֹת
  english_pob_choice: taken vengeance
  chosen_korean: 복수하셨기 때문입니다
  alternatives_korean:
  - 원수를 갚으셨기 때문입니다
  - 징벌하셨기 때문입니다
  lexicon: HALOT
  rationale: 복수 행위의 결과를 나타내는 복수형 명사를 한국어에서는 원인절로 풀어, 야훼의 행위와 그 결과를 분명히 했습니다.
- source_word: מִבְּנֵי עַמּוֹן
  english_pob_choice: on the sons of Ammon
  chosen_korean: 암몬 자손에게
  alternatives_korean:
  - 암몬 사람들에게
  - 암몬의 아들들에게
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되 한국어 성경에서 이해 가능한 민족명 표현인 ‘암몬 자손’을 유지했습니다.
theological_decisions:
- issue: 이 구절의 ‘입을 열어’ 관용구 처리
  chosen_reading: 맹세의 관용구를 직설적으로 드러내되, 한국어 본문에서는 ‘입을 열어 맹세하셨습니다’로 연결했습니다.
  alternative_readings:
  - ‘말씀하셨습니다’로 완화
  - ‘서원하셨습니다’로 해석
  rationale: 본문은 단순 발화가 아니라 야훼께 대한 엄숙한 서원의 언어를 전제하므로, 관용구의 엄중함을 유지하는 쪽이 원문의 힘을 보존합니다.
  doctrine_reference: 서원/맹세의 언어 보존
- issue: ‘복수’의 주체와 대상
  chosen_reading: 야훼께서 아버지를 위하여 원수들에게 복수하셨다는 의미를 분명히 했습니다.
  alternative_readings:
  - ‘보복하셨습니다’
  - ‘원수를 갚으셨습니다’
  rationale: 원문은 야훼의 행위를 강조하며, 딸의 말은 그 행위를 근거로 아버지의 서원 이행을 요청합니다. 따라서 주체-대상 관계를 흐리지 않도록 옮겼습니다.
  doctrine_reference: 야훼의 공의로운 행위
- issue: 본문의 애매성 유지
  chosen_reading: 이 구절만으로는 서원의 구체적 결과를 단정하지 않았습니다.
  alternative_readings:
  - 인신제사로 명시
  - 평생 봉헌으로 명시
  rationale: 원문은 딸의 수용을 말할 뿐 서원의 성격을 이 구절에서 해석적으로 확정하지 않으므로, 논쟁적 해석을 번역에 주입하지 않았습니다.
  doctrine_reference: 해석상 긴장 보존
