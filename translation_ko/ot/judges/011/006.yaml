  source_fidelity: ‘그러면’은 입다가 지휘관이 되는 일을 암몬과의 전쟁의 명시적 조건 또는 결과로 만듭니다. 히브리어의 접속사와 1인칭 복수 청유형은 그러한 조건 관계를 명시하지 않고, ‘와서 우리의 지휘관이 되어 주십시오. 우리가 … 싸우겠습니다’라는 요청과 결의를 이어 놓습니다. ‘암몬 자손’은 원문의 직역에 가깝지만 현대 표준 한국어에서는 민족 집단을 가리킬 때 ‘암몬 사람들’이 더 자연스럽습니다. 각주에서 원문의 문자적 표현을 보존할 수 있습니다.
