  terminology: ‘입다’는 한국어 성경 전통에 맞는 이름입니다. ‘지휘관’은 전쟁 문맥의 קָצִין을 적절히 나타냅니다. 본문은 ‘암몬 사람들’로, 각주는 ‘암몬의 아들들’이라는 히브리어 민족 명칭을 설명하도록 조정합니다.
