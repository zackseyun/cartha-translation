  verdict: revise
  source_fidelity: ‘형제들 앞에서’는 מִפְּנֵי אֶחָיו의 문맥상 의미인 형제들을 피하여/형제들로부터 도피한 것을 나타내지 못합니다. 또한 본문은 돕 땅이라고만 하며 길앗이라는 지명은 포함하지 않습니다. רֵיקִים은 물질적으로 가난한 사람들만을 뜻하지 않는 관용적 표현입니다.
  naturalness: ‘값없는 사람들’은 현대 표준 한국어에서 대체로 무료이거나 가격이 없다는 뜻으로 이해되어 부자연스럽고 원문의 사회적·도덕적 평가를 전달하지 못합니다. ‘형제들을 피해’, ‘돕 땅’, ‘쓸모없는 사람들’은 합쇼체 서사문에서 자연스럽습니다.
  terminology: 입다와 돕의 음역은 적절합니다. ‘쓸모없는 사람들’은 רֵיקִים의 경멸적이되 구체적으로 범죄자라고 단정하지 않는 표현을 유지합니다.
