revisions:
- from: 그러자 입다는 형제들 앞에서 도망쳐 길앗 땅의 돕에 살았고, 값없는 사람들[a]이 입다에게 모여들어 그와 함께 나갔습니다.
  to: 그러자 입다는 형제들을 피해 도망쳐 돕 땅에 살았습니다. 쓸모없는 사람들[a]이 입다에게 모여들어 그와 함께 나갔습니다.
