  text: וַ/יִּבְרַ֤ח יִפְתָּח֙ מִ/פְּנֵ֣י אֶחָ֔י/ו וַ/יֵּ֖שֶׁב בְּ/אֶ֣רֶץ ט֑וֹב וַ/יִּֽתְלַקְּט֤וּ אֶל יִפְתָּח֙ אֲנָשִׁ֣ים רֵיקִ֔ים וַ/יֵּצְא֖וּ עִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
  footnotes:
  - marker: a
    text: Or 'empty men'; the Hebrew idiom refers to men of low character or standing, not merely men lacking possessions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 입다는 형제들을 피해 도망쳐 돕 땅에 살았습니다. 쓸모없는 사람들[a]이 입다에게 모여들어 그와 함께 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘빈 사람들’입니다. 이 관용구는 단지 재산이 없는 사람들이 아니라, 쓸모없거나 행실이 좋지 않다고 여겨진 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  english_pob_choice: fled
  chosen_korean: 도망쳐
  alternatives_korean:
  - 달아나
  - 도망갔습니다
  lexicon: HALOT
  rationale: ברח는 강제적 도피를 나타내므로, 현대 한국어에서 자연스럽고 긴박감을 살리는 ‘도망쳐’로 옮겼습니다.
- source_word: מִפְּנֵי אֶחָיו
  english_pob_choice: from his brothers
  chosen_korean: 형제들 앞에서
  alternatives_korean:
  - 형제들로부터
  - 형제들의 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘앞에서/얼굴 앞에서’이지만, 문맥상 형제들의 압력 아래 떠난 의미이므로 관계와 대립을 드러내는 ‘형제들 앞에서’로 옮겼습니다.
- source_word: אֲנָשִׁים רֵיקִים
  english_pob_choice: worthless men
  chosen_korean: 값없는 사람들
  alternatives_korean:
  - 빈 사람들
  - 쓸모없는 사람들
  - 무가치한 사람들
  lexicon: HALOT
  rationale: רֵיקִים는 문자적으로 ‘빈’이지만 이 관용구는 사회적·도덕적으로 비천한 무리를 가리키므로, POB의 어조를 살리면서도 한국어에서 노골적 낙인에 치우치지 않는 ‘값없는 사람들’로 옮겼습니다.
- source_word: וַיֵּצְאוּ עִמּוֹ
  english_pob_choice: went out with him
  chosen_korean: 그와 함께 나갔습니다
  alternatives_korean:
  - 그와 함께 다녔습니다
  - 그와 함께 출정했습니다
  lexicon: HALOT
  rationale: יצא의 기본 의미를 따라 ‘나갔습니다’로 두어, 함께 다녔는지 전쟁에 나갔는지 본문이 열어 둔 범위를 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 이 구절의 인물 묘사 강도
  chosen_reading: ‘값없는 사람들’로 번역해 히브리어 관용구가 지닌 낮은 신분·품행의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 단순히 ‘빈 사람들’로 옮김
  - ‘악한 사람들’로 도덕적 평가를 강화함
  rationale: 본문은 물질적 결핍보다 인격적·사회적 천함을 시사하므로, 그 긴장을 유지하는 번역이 문맥에 더 충실합니다.
  doctrine_reference: 사무엘상 22:2, 사사기 9:4의 유사 용례
