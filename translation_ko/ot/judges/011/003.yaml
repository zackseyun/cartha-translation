    rationale: 현대 한국어에서 ‘값없는’은 ‘무료의’ 또는 ‘가격이 없는’이라는 뜻으로 통상 이해됩니다. רֵיקִים의 관용적 사회·도덕적 비칭을 전달하지 못합니다.
