language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
  footnotes:
  - marker: a
    text: Or 'when you are in trouble.' The Hebrew clause כַּאֲשֶׁר צַר לָכֶם expresses being in straits or distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 입다가 길르앗의 장로들에게 말했습니다. "당신들은 나를 미워하여 내 아버지의 집에서 쫓아내지 않았습니까? 그런데 당신들이 곤경에 빠졌을 때 어찌하여 지금 내게 왔습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곤경에 빠졌을 때’는 히브리어 כַּאֲשֶׁר צַר לָכֶם의 압박·궁지의 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서사형 wayyiqtol אמר를 자연스러운 과거 서술로 옮겼고, 직접 인용문을 여는 문맥에 맞게 평이한 ‘말했습니다’를 선택했습니다.
- source_word: זִקְנֵי גִלְעָד
  english_pob_choice: the elders of Gilead
  chosen_korean: 길르앗의 장로들
  alternatives_korean:
  - 길르앗의 어른들
  - 길르앗의 지도자들
  lexicon: HALOT
  rationale: זָקֵן의 복수는 공동체의 연장자이자 공적 대표자를 가리키므로, 한국어 성경 관용에 맞으면서도 직책적 의미를 살리는 ‘장로들’이 적절합니다.
- source_word: שְׂנֵאתֶם
  english_pob_choice: hate
  chosen_korean: 미워하여
  alternatives_korean:
  - 증오하여
  - 싫어하여
  lexicon: HALOT
  rationale: 단순한 관계적 적대감을 뜻하는 기본 의미를 따라 과장하지 않고 ‘미워하다’로 옮겼습니다.
- source_word: וַתְּגָרְשׁוּנִי מִבֵּית אָבִי
  english_pob_choice: drive me out from my father’s house
  chosen_korean: 내 아버지의 집에서 쫓아내지
  alternatives_korean:
  - 내 아버지의 집에서 내쫓지
  - 내 아버지의 집에서 몰아내지
  lexicon: HALOT
  rationale: גרשׁ의 강한 축출 의미를 살리되, 현대 한국어에서 가장 자연스럽고 힘 있는 표현인 ‘쫓아내다’를 택했습니다.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  english_pob_choice: when you are in distress
  chosen_korean: 당신들이 곤경에 빠졌을 때
  alternatives_korean:
  - 당신들이 환난에 처했을 때
  - 당신들이 위기에 놓였을 때
  lexicon: HALOT
  rationale: צַר לָ의 ‘좁아짐/곤궁’에서 오는 압박감을 살리면서, 한국어로는 상황의 난처함을 드러내는 ‘곤경에 빠지다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 입다가 원수 같은 관계를 상기시키는 수사적 질문의 톤
  chosen_reading: 질문형을 유지해 상대의 모순을 직접 드러내는 공격적 수사를 살렸습니다.
  alternative_readings:
  - 완곡한 서술문으로 바꾸는 방식
  - 의문을 약화한 해설적 번역
  rationale: 본문은 단순 정보 전달이 아니라 정당성 없는 접근을 꾸짖는 반문이므로, 한국어에서도 반문 구조를 유지해야 합니다.
  doctrine_reference: 서사적 발화의 화행 보존
- issue: ‘곤경’의 해석 범위
  chosen_reading: ‘곤경에 빠졌을 때’로 번역해 distress의 압박과 위기감을 동시에 보존했습니다.
  alternative_readings:
  - ‘어려움에 처했을 때’
  - ‘환난 중일 때’
  rationale: 히브리어 צַר לָכֶם은 단순한 불편보다 ‘궁지/압박’의 뉘앙스가 있어, 지나치게 약한 표현은 피했습니다.
  doctrine_reference: 어휘의 감정적 강도 보존
