  to: 그가 광야를 지나 에돔 땅과 모압 땅을 돌아가서, 해 뜨는 쪽에서 모압 땅에 이르렀고[a] 그들은 아르논 건너편에[b] 진을 쳤습니다. 그러나 그들은 모압의 경계 안으로는 들어가지 않았습니다. 아르논이 모압의 경계였기 때문입니다.
