  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
  footnotes:
  - marker: a
    text: Hebrew literally, 'came from the sunrise to the land of Moab,' an idiom meaning they approached Moab from the east/east side.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the other side of the Arnon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 광야를 지나 에돔 땅과 모압 땅을 돌아가서, 해 뜨는 쪽에서 모압 땅에 이르렀고[a] 그들은 아르논 건너편에[b] 진을 쳤습니다. 그러나 그들은 모압의 경계 안으로는 들어가지 않았습니다. 아르논이 모압의 경계였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘해 뜨는 쪽에서 모압 땅에 이르렀다’이며, 관용적으로는 모압 땅의 동쪽에서 접근했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아르논 저편에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר
  english_pob_choice: the wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 광야를
  - 들판을
  lexicon: HALOT
  rationale: בַּמִּדְבָּר는 사막보다 넓은 비거주 지대를 가리키므로, 성경 문체에 자연스러운 ‘광야’가 가장 정확합니다.
- source_word: וַיָּסָב אֶת
  english_pob_choice: went around
  chosen_korean: 돌아가서
  alternatives_korean:
  - 둘러가서
  - 우회해서
  lexicon: HALOT
  rationale: 여기서 סבב는 직행이 아니라 에돔과 모압을 피해 경로를 우회한 뜻이므로, 간결한 ‘돌아가서’가 이동 방향을 잘 살립니다.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  english_pob_choice: came to the east side of
  chosen_korean: 해 뜨는 쪽에서
  alternatives_korean:
  - 동쪽에서
  - 해 돋는 편에서
  lexicon: HALOT
  rationale: 직역하면 ‘해의 떠오름으로부터’이지만, 지리 관용구로서 동쪽 접근을 뜻하므로 ‘해 뜨는 쪽’이 원문 비유를 보존합니다.
- source_word: בְּעֵבֶר אַרְנוֹן
  english_pob_choice: beyond the Arnon
  chosen_korean: 아르논 건너편
  alternatives_korean:
  - 아르논 저편
  - 아르논 건너쪽
  lexicon: HALOT
  rationale: עֵבֶר는 상대적 ‘건너편/저편’을 가리키며, 한국어 지리 표현으로는 ‘건너편’이 가장 자연스럽습니다.
- source_word: בִּגְבוּל מוֹאָב
  english_pob_choice: the territory of Moab
  chosen_korean: 모압의 경계 안
  alternatives_korean:
  - 모압의 경계
  - 모압 땅
  lexicon: HALOT
  rationale: גבול은 단순한 선형 경계뿐 아니라 경계 안의 영역도 가리킬 수 있어, ‘경계 안’으로 옮기면 ‘들어가지 않았다’는 동작과 더 정확히 맞습니다.
theological_decisions:
- issue: 모압 경계에 들어가지 않았다는 서술의 강조
  chosen_reading: 이스라엘의 이동은 모압 영토 침범이 아니라 경계 밖을 따라간 합법적 경로였다고 분명히 밝힙니다.
  alternative_readings:
  - 단순한 지리 정보로만 읽기
  - 군사적 회피로만 읽기
  rationale: 문맥상 본문은 아모리 땅 점거의 정당성을 변호하는 역사적 회고의 일부이므로, 경계 준수를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 민 21장과 삿 11장의 역사적-법적 맥락
