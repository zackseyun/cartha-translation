source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁר נִלְחֲמ֥וּ בְנֵֽי עַמּ֖וֹן עִם יִשְׂרָאֵ֑ל וַ/יֵּֽלְכוּ֙ זִקְנֵ֣י גִלְעָ֔ד לָ/קַ֥חַת אֶת יִפְתָּ֖ח מֵ/אֶ֥רֶץ טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
  footnotes:
  - marker: a
    text: Or 'to take Jephthah from the land of Tob.' The Hebrew verb often means 'take,' but here it refers to going to retrieve him and bring him back.
    reason: lexical_alternative
translation:
  language: ko
  text: 암몬 자손이 이스라엘과 싸울 때에, 길르앗의 장로들은 돕 땅에서 입다를 데려오러 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִלְחֲמוּ
  english_pob_choice: fought
  chosen_korean: 싸울 때에
  alternatives_korean:
  - 전쟁을 벌일 때에
  - 전투를 벌일 때에
  lexicon: HALOT
  rationale: נלחם는 여기서 실제 전투를 벌이는 상황을 가리키므로, 자연스럽고 간결한 ‘싸울 때에’로 옮겼습니다.
- source_word: בְנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되 한국어 성경에서 통용되는 민족 표지로 옮겼습니다.
- source_word: לָקַחַת
  english_pob_choice: to bring
  chosen_korean: 데려오러 갔습니다
  alternatives_korean:
  - 데려오려고 갔습니다
  - 가져오러 갔습니다
  lexicon: HALOT
  rationale: 문맥상 ‘입다를 다시 불러와 함께 데려오는’ 의미이므로, 단순한 ‘데려오다’보다 이동의 목적을 드러내는 표현이 더 정확합니다.
- source_word: מֵאֶרֶץ טוֹב
  english_pob_choice: from the land of Tob
  chosen_korean: 돕 땅에서
  alternatives_korean:
  - 돕 지역에서
  - 돕의 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 지명과 결합한 ‘땅’의 의미이므로, 고유지명인 돕과 함께 자연스럽게 ‘돕 땅’으로 옮겼습니다.
