  - “우리 아버지 집에서 기업을 얻지 못할 것이다”
  rationale: 문맥상 단순 상속 분쟁이 아니라 가족 공동체에서의 법적 배제와 수치 부여가 핵심이므로, 현대 독자가 이해할 수 있는 법적 표현을 택했습니다.
  doctrine_reference: 가족-상속 공동체에서의 배제와 언약 백성 내 소속 문제
- issue: 직접화법의 조롱성
  chosen_reading: 직접 인용부호를 유지해 형제들의 배척 발언이 갖는 공격성을 드러냈습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 서술체로 평탄화
  rationale: 원문은 단순 정보가 아니라 입다의 정체성을 근거로 한 공개적 거절을 제시하므로, 발화의 날카로움을 보존하는 것이 중요합니다.
  doctrine_reference: 서사 내 수치-배제 표현의 보존
