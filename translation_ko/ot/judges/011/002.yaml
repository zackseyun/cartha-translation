  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: ko
  text: 길르앗의 아내가 그에게서 아들들을 낳았습니다. 아내의 아들들이 자라나자, 그들은 입다를 쫓아내며 그에게 말했습니다. “너는 우리 아버지 집에서 상속을 받지 못할 것이다. 너는 다른 여자에게서 난 아들이기 때문이다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 직역은 “아내의 아들들”입니다. 여기서는 자연스러운 한국어로 “아내의 아들들”보다 “아내의 아들들”의 소유 관계를 풀어 “아내의 아들들이”로 옮겼습니다.
    reason: source_note
