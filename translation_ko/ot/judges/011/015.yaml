source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֖ה אָמַ֣ר יִפְתָּ֑ח לֹֽא לָקַ֤ח יִשְׂרָאֵל֙ אֶת אֶ֣רֶץ מוֹאָ֔ב וְ/אֶת אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
  footnotes:
  - marker: a
    text: 'Or “the land of the Ammonites.” Hebrew: “the land of the sons of Ammon.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말하였습니다. 「이와 같이 입다가 말합니다. 이스라엘은 모압 땅도 암몬 자손의 땅도 차지하지 않았습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “암몬 사람들의 땅”. 히브리어는 “암몬의 자손의 땅”이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ
  english_pob_choice: And he said to him
  chosen_korean: 그에게 말하였습니다
  alternatives_korean:
  - 그에게 말했습니다
  - 그에게 일러 주었습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리면서도, 이어지는 직접 화법을 여는 기본 동사로 ‘말하다’를 택했습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이와 같이 … 말합니다
  alternatives_korean:
  - 이와 같이 … 이릅니다
  - 이같이 … 말합니다
  lexicon: HALOT
  rationale: 히브리어의 사자 문구를 과거형으로 평평하게 만들지 않고, 선언문의 현재적·공식적 어감을 살리기 위해 ‘이와 같이 … 말합니다’로 옮겼습니다.
- source_word: לֹא לָקַח
  english_pob_choice: did not take
  chosen_korean: 차지하지 않았습니다
  alternatives_korean:
  - 취하지 않았습니다
  - 가져가지 않았습니다
  lexicon: HALOT
  rationale: 이 문맥에서 단순한 ‘가져가다’보다 영토를 점유한다는 의미가 분명하므로, 한국어에서는 ‘차지하다’가 가장 정확합니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬의 자손
  alternatives_korean:
  - 암몬 족속
  - 암몬 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지하되 한국어에서 자연스럽게 읽히도록 ‘암몬의 자손’으로 옮겼습니다. 본문 의미상 대체역인 ‘암몬 족속’도 가능하지만, 원형의 친족표현을 보존했습니다.
theological_decisions:
- issue: 사자 문구 כֹּה אָמַר의 시제와 화법
  chosen_reading: ‘이와 같이 입다가 말합니다’처럼 현재형 선언문으로 처리했습니다.
  alternative_readings:
  - ‘이와 같이 입다가 말했다’
  - ‘입다가 이같이 말합니다’
  rationale: 예언·사자 문구의 공식성을 살리기 위해, 단순 과거 서술보다 현재형 선언이 본문 기능을 더 잘 드러냅니다.
  doctrine_reference: 공식 선포/사자 문구의 수사적 관습
- issue: 영토 점유 동사 לָקַח의 의미 범위
  chosen_reading: 전쟁적 ‘점령’보다 영토 획득을 드러내는 ‘차지하다’를 택했습니다.
  alternative_readings:
  - 점령하다
  - 빼앗다
  rationale: 본문은 외교적 항변의 일부로, 폭력성보다 소유권 주장에 초점이 있습니다. 따라서 한국어에서도 중립적이면서도 영토성을 드러내는 표현이 적절합니다.
  doctrine_reference: 문맥 우선의 의미 판정
