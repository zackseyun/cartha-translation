base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
  footnotes:
  - marker: a
    text: Or “If you surely give the Ammonites into my hand.” The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 입다가 야훼께 서원을 드리고 말했습니다. 「만일 주께서 암몬 자손을 내 손에 반드시 넘겨주신다면」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 유한동사를 함께 써서 강조합니다. 따라서 “반드시”의 뉘앙스가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  english_pob_choice: made a vow / a vow
  chosen_korean: 서원을 드리고
  alternatives_korean:
  - 서원했습니다
  - 맹세를 했습니다
  lexicon: HALOT
  rationale: 히브리어의 동사-명사 결합을 한국어에서도 자연스럽게 살리기 위해 ‘서원을 드리고’로 옮겼습니다. ‘서원’은 종교적 서약의 의미를 정확히 반영합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문이 여호와의 고유명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 음역형 ‘야훼께’로 반영했습니다.
- source_word: נָתוֹן תִּתֵּן
  english_pob_choice: you indeed give
  chosen_korean: 반드시 넘겨주신다면
  alternatives_korean:
  - 정말로 넘겨주신다면
  - 분명히 넘겨주신다면
  - 주께서 주신다면
  lexicon: HALOT
  rationale: 부정사 절대형+유한동사의 강조를 한국어의 ‘반드시’로 살려, 단순 조건보다 강한 확실성/강조를 드러냈습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  lexicon: HALOT
  rationale: 히브리어 표현을 직역에 가깝게 유지하면서도 한국어 성경에서 널리 이해되는 민족명으로 옮겼습니다.
- source_word: בְּיָדִי
  english_pob_choice: into my hand
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 권세 아래
  - 내 힘 안에
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구를 가장 직접적으로 보존하는 표현으로, 상대를 자기 처분 아래 두는 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 야훼의 고유명과 서원 문맥
  chosen_reading: 본문의 서원은 야훼께 드리는 직접적 종교 행위로, 예배적·언약적 뉘앙스를 분명히 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 주께
  - 여호와께
  rationale: 히브리어 המקרא의 고유명 사용을 흐리지 않기 위해 ‘야훼’ 표기를 채택했습니다. 이는 서원의 대상이 일반적 ‘주님’이 아니라 언약의 하나님임을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
