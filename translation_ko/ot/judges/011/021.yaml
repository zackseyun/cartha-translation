source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
  footnotes:
  - marker: a
    text: 'Hebrew: ''into the hand of Israel,'' an idiom meaning into Israel''s power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 이스라엘의 하나님께서 시혼과 그의 모든 백성을 이스라엘의 손에[a] 넘기셨고, 이스라엘 사람들은 그들을 쳤습니다. 그래서 이스라엘은 그 땅에 살던 아모리 사람들의 모든 땅을 차지했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘이스라엘의 손에’는 ‘이스라엘의 권세 아래’ 또는 ‘이스라엘의 통제 아래’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 고유한 언약명 יְהוָה를 제목어로 돌리지 않고 음역해 드러내기 위해 ‘야훼’를 썼습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 신
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 소유 관계를 자연스러운 한국어로 옮기되, 이스라엘과의 언약적 소속을 분명히 했습니다.
- source_word: בְּיַד יִשְׂרָאֵל
  english_pob_choice: into the hand of Israel
  chosen_korean: 이스라엘의 손에 넘기셨습니다
  alternatives_korean:
  - 이스라엘의 손에 주셨습니다
  - 이스라엘의 권세 아래 넘기셨습니다
  lexicon: HALOT
  rationale: ‘손’의 관용구를 유지하면서도 한국어에서 이해되는 ‘넘기다’로 옮겨, 단순한 전달이 아니라 적대자에 대한 통제권 이양을 드러냈습니다.
- source_word: וַיַּכּוּם
  english_pob_choice: they struck them down
  chosen_korean: 그들을 쳐 죽였고
  alternatives_korean:
  - 그들을 쳤고
  - 그들을 쳐서 무찔렀고
  lexicon: HALOT
  rationale: 전투 맥락의 נכה를 완곡하게 ‘패배시키다’로 약화하지 않고, 결과적 폭력성을 분명히 하는 방향으로 옮겼습니다.
- source_word: וַיִּירַשׁ
  english_pob_choice: took possession of
  chosen_korean: 차지했습니다
  alternatives_korean:
  - 소유하게 되었습니다
  - 점유했습니다
  lexicon: HALOT
  rationale: ירש의 점유·차지의 결과를 한국어 동사 ‘차지하다’로 간결하게 살렸습니다.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  english_pob_choice: all the land of the Amorites
  chosen_korean: 아모리 사람들의 온 땅
  alternatives_korean:
  - 아모리 사람들의 모든 땅
  - 아모리의 온 땅
  lexicon: HALOT
  rationale: 히브리어 집합명사를 한국어 관용에 맞게 ‘아모리 사람들’로 옮겨 지명 소유 관계를 분명히 했습니다.
theological_decisions:
- issue: 여호와 신명(יְהוָה) 표기
  chosen_reading: ‘야훼’로 음역해 고유명을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문이 하나님의 고유 이름을 직접 사용하므로, 직함으로 바꾸지 않고 POB 기준에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
