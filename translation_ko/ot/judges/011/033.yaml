  source_fidelity: 히브리어의 지명 범위, ‘스무 성읍’, 큰 군사적 타격, 그리고 암몬과 이스라엘의 친족 집단 표현을 대체로 충실히 반영했습니다. 다만 현행 문장의 ‘곧 스무 성읍, 그리고’는 한국어 통사상 부자연스럽고, ‘살육을 가했습니다’는 목적어 관계도 매끄럽지 않습니다. מַכָּה는 전쟁 문맥에서 심각한 패배나 타격을 뜻할 수 있으나 반드시 살육 자체를 뜻하지는 않으므로, 본문에서는 의미를 과도하게 한정하지 않는 ‘매우 큰 타격’이 안전합니다.
  naturalness: ‘민닛의 입구까지, 곧 스무 성읍, 그리고’라는 나열은 현대 한국어에서 문장 성분 관계가 불명확합니다. ‘스무 성읍에 걸쳐’로 처리하면 지리적·군사적 범위를 자연스럽게 나타내면서 원문의 압축된 지리 서술을 무리 없이 보존합니다. ‘민닛의 어귀’는 지명에 이르는 입구·접근 지점이라는 의미를 자연스럽게 전달합니다.
