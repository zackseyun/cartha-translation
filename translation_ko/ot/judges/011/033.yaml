  lexicon: HALOT
  rationale: נכה의 기본적 물리 행위인 ‘치다/쳐서’의 이미지를 살리면서, 전투 문맥의 결과는 뒤의 서술로 드러나게 했습니다.
- source_word: בּוֹאֲךָ מִנִּית
  english_pob_choice: the entrance to Minnith
  chosen_korean: 민닛의 입구
  alternatives_korean:
  - 민닛의 접근로
  - 민닛까지
  lexicon: HALOT
  rationale: 영어 POB의 ‘entrance’에 맞추되, 지리적 도착점보다 진입 지점을 가리키는 표현으로 옮겼습니다.
- source_word: עֶשְׂרִים עִיר
  english_pob_choice: twenty cities
