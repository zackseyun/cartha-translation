  lexicon: HALOT
  rationale: מַכָּה의 ‘치명적 타격’ 의미를 전쟁 맥락에서 구체화하되, 영어 POB가 택한 강도를 한국어로도 분명히 드러냈습니다.
- source_word: בְּנֵי עַמּוֹן / בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Ammon / the sons of Israel
  chosen_korean: 암몬의 아들들 / 이스라엘의 아들들
  alternatives_korean:
  - 암몬 족속 / 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어 친족 표현을 그대로 살려, 문맥의 병렬성과 원문 질감을 유지했습니다.
