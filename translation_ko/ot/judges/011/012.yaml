  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
  footnotes:
  - marker: a
    text: Or, “What do I have to do with you?” The Hebrew idiom expresses hostility or dispute between parties.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 입다는 사신들을 암몬 왕에게 보내며 말했습니다. “나와 당신 사이에 무슨 관계가 있기에, 당신이 내 땅에서 나를 치러 왔습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나와 당신이 무슨 상관이 있습니까?” 이 히브리어 관용구는 당사자 사이의 적대나 분쟁을 나타냅니다.
    reason: lexical_alternative
