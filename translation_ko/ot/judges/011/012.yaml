    rationale: 사신을 보내는 행위와 그 사신을 통해 전달되는 발화를 나타내는 문맥에서 ‘-며 말했습니다’는 입다가 동시에 직접 발화한 것처럼 들리며 문장도 어색합니다. ‘보내어 이렇게 말했습니다’가 원문의 구조와 한국어 문법에 맞습니다.
