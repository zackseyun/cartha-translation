    rationale: 히브리어 לָהּ는 여기서 ‘그녀에게/그녀를 대상으로’이지 ‘그녀에게서’가 아닙니다. 또한 a는 서원 이행 절에, b는 ‘남자를 알지 못하였다’는 절에 붙어야 독자가 각 주석의 대상을 분명히 알 수 있습니다.
