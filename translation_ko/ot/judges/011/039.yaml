source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
  footnotes:
  - marker: a
    text: Or, 'he carried out on her the vow that he had made.' Interpreters differ on whether this means Jephthah sacrificed her or dedicated her to lifelong virginity; the Hebrew wording itself does not explicitly resolve the question here.
    reason: alternative_reading
  - marker: b
    text: Literally, 'she had not known a man,' a Hebrew idiom indicating that she had not had sexual relations.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 달이 끝날 무렵에 그녀는 아버지에게 돌아왔고, 그는 자기 서원대로 그녀에게 행하였습니다. 그녀는 남자를 알지 못하였습니다. 그리고 이것은 이스라엘의 규례가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그가 그녀에게서 자신의 서원을 행했다/이행했다’는 뜻일 수 있으며, 입다의 서원이 희생 제사였는지 평생의 처녀성 헌신이었는지는 여기서 본문이 분명히 정하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그녀는 남자를 알지 못하였다’입니다. 이는 성관계가 없었다는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַ֣יִם חֳדָשִׁ֗ים
  english_pob_choice: at the end of two months
  chosen_korean: 두 달이 끝날 무렵에
  alternatives_korean:
  - 두 달 후에
  - 두 달이 끝난 뒤에
  lexicon: HALOT
  rationale: 기간의 경계가 드러나는 מִקֵּץ의 의미를 살려, 단순한 경과보다 ‘끝날 무렵’으로 옮겼습니다.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  english_pob_choice: she returned to her father
  chosen_korean: 그녀는 아버지에게 돌아왔고
  alternatives_korean:
  - 그녀는 아버지께 되돌아왔고
  - 그녀는 아버지에게로 돌아왔고
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미를 따라 ‘돌아오다’로 옮기되, 도착 대상을 분명히 하려고 ‘아버지에게’를 유지했습니다.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  english_pob_choice: he did to her according to his vow that he had vowed
  chosen_korean: 그는 자기 서원대로 그녀에게 행하였습니다
  alternatives_korean:
  - 그는 자신이 서원한 것을 그녀에게 행하였습니다
  - 그는 그녀에게 서원을 이행하였습니다
  lexicon: HALOT
  rationale: 히브리어의 직설적이고 난해한 표현을 지나치게 해석하지 않기 위해 ‘행하다’를 살렸고, נדר의 반복은 ‘서원’으로 일관되게 옮겼습니다.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  english_pob_choice: Now she had not known a man
  chosen_korean: 그녀는 남자를 알지 못하였습니다
  alternatives_korean:
  - 그녀는 남자와 성관계를 가진 적이 없었습니다
  - 그녀는 처녀였습니다
  lexicon: HALOT
  rationale: ‘알다 + 남자’의 관용구를 그대로 반영하여, 본문의 완곡한 표현과 서술의 여지를 유지했습니다.
- source_word: חֹק בְּיִשְׂרָאֵל
  english_pob_choice: a statute in Israel / a custom in Israel
  chosen_korean: 이스라엘의 규례가 되었습니다
  alternatives_korean:
  - 이스라엘의 관례가 되었습니다
  - 이스라엘의 법규가 되었습니다
  lexicon: HALOT
  rationale: חֹק의 문맥상 사회적으로 정착된 관행인지 형식 법규인지가 논쟁적이므로, ‘규례’로 옮겨 두 의미 가능성을 비교적 중립적으로 남겼습니다.
theological_decisions:
- issue: Jephthah가 서원을 어떻게 이행했는지의 모호성
  chosen_reading: 본문의 모호성을 해소하지 않고, ‘자기 서원대로 그녀에게 행하였습니다’라는 직설적 표현으로 남겼습니다.
  alternative_readings:
  - 그녀를 번제로 바쳤다
  - 그녀를 평생의 처녀성으로 바쳤다
  rationale: 히브리어 자체가 구체적 실행 방식을 명시하지 않으므로, 본문이 허용하는 긴장과 논쟁 지점을 보존하는 것이 번역상 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
