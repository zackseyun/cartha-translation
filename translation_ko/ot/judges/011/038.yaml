base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
  footnotes:
  - marker: a
    text: Or “for her virginity” / “because of her virginity.” The Hebrew states explicitly that the object of her lament was her virginity, a detail central to interpretations of the wider passage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 "가라"라고 말했습니다. 그래서 그녀를 두 달 동안 보내 주었습니다. 그녀는 그녀의 동료들과 함께 가서, 산들에서 자신의 처녀성을 두고 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자신의 처녀성을 위하여” / “자신의 처녀성 때문에”로도 옮길 수 있습니다. 히브리어는 그녀가 애도한 대상이 분명히 그녀의 처녀성임을 직접 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  english_pob_choice: Go
  chosen_korean: 가라
  alternatives_korean:
  - 가십시오
  - 떠나십시오
  lexicon: HALOT
  rationale: 2인칭 여성 단수 명령형의 짧고 직접적인 어조를 살려, 본문의 간단한 명령을 자연스럽게 옮겼습니다.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  english_pob_choice: he sent her away
  chosen_korean: 그녀를 두 달 동안 보내 주었습니다
  alternatives_korean:
  - 그녀를 보내었습니다
  - 그녀를 떠나게 했습니다
  lexicon: HALOT
  rationale: שלח의 해제·파견 의미를 살리되, 이어지는 기간 표현과 함께 한국어에서는 '보내 주었습니다'가 가장 자연스럽고, 그녀에게 허락된 귀가의 뉘앙스를 전달합니다.
- source_word: וַתֵּבְךְּ עַל בְּתוּלֶיהָ
  english_pob_choice: wept over her virginity
  chosen_korean: 자신의 처녀성을 두고 울었습니다
  alternatives_korean:
  - 자신의 처녀성 때문에 울었습니다
  - 자신의 처녀성을 슬퍼하며 울었습니다
  lexicon: HALOT
  rationale: 본문이 울음의 대상로 '처녀성'을 직접 제시하므로, 그 긴장을 지우지 않기 위해 '두고 울었습니다'로 직역성을 유지했습니다.
- source_word: עַל הֶהָרִים
  english_pob_choice: on the mountains
  chosen_korean: 산들에서
  alternatives_korean:
  - 산 위에서
  - 산들 위에서
  lexicon: HALOT
  rationale: 히브리어 전치사 עַל의 공간적 이미지를 살리면서도 한국어에서는 장소 부사어로 자연스럽게 읽히도록 '산들에서'로 옮겼습니다.
theological_decisions:
- issue: 그녀가 '처녀성'을 두고 운다는 표현의 신학적·해석학적 긴장
  chosen_reading: 본문의 표면 의미를 따라, 그녀가 자신의 처녀성을 애도했다는 표현을 그대로 유지하고 더 넓은 해석은 결론내리지 않았습니다.
  alternative_readings:
  - 임박한 죽음을 애도한 것으로 설명
  - 평생 결혼·출산의 상실을 애도한 것으로 설명
  rationale: 이 절은 애도의 대상이 무엇인지 명시하므로, 번역문에서 해석을 앞서 제시하면 본문의 긴장을 해소해 버립니다. 따라서 POB의 소스 직결 원칙에 따라 그대로 두었습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
