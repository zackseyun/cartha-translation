  lexicon: HALOT
  rationale: 본문의 귀속·헌정 의미를 살리되, 다음 절의 번제 표현과 긴장 관계를 무리하게 풀지 않기 위해 ‘것이 되다’로 옮겼습니다. POB 영어의 소유·귀속 뉘앙스도 반영합니다.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  english_pob_choice: and I will offer it up as a burnt offering
  chosen_korean: 내가 그것을 번제물로 드리겠습니다
  alternatives_korean:
  - 내가 그것을 번제로 바치겠습니다
  - 내가 그것을 번제물로 올리겠습니다
  - 내가 그것을 번제헌물로 드리겠습니다
  lexicon: HALOT
  rationale: עלה + עולה의 제의적 관용구를 한국어 성경체로 분명히 드러냈습니다. 목적어를 ‘그것’으로 유지해 앞부분의 의도적 모호성을 이어 갑니다.
theological_decisions:
- issue: ‘여호와의 것이 되며’와 ‘번제물로 드리겠습니다’의 관계
  chosen_reading: 본문의 연결을 그대로 살려 하나의 서원으로 번역했습니다.
  alternative_readings:
  - ‘여호와의 것이 되거나, 번제물로 드리겠습니다’처럼 분리하는 읽기
  - ‘여호와께 바치며 번제물로 드리겠습니다’처럼 순화하는 읽기
  rationale: 히브리어 접속사 ו를 기본값인 ‘그리고/며’로 옮겨 본문의 긴장을 보존했습니다. 이 서원이 실제로 헌납인지 희생 제사인지의 해석 논쟁은 본문에서 해결하지 않고 주석 여지로 남깁니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
