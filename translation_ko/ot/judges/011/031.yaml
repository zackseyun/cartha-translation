base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
  footnotes:
  - marker: a
    text: Or, 'shall be the LORD’s, or I will offer it up as a burnt offering.' Some interpreters take the Hebrew conjunction here in a disjunctive sense, yielding two possible outcomes depending on what came out to meet Jephthah.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 내 집 문들에서 나를 맞으러 나오는 것은, 내가 암몬 자손에게서 평안히 돌아올 때 여호와의 것이 되며[a], 내가 그것을 번제물로 드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘여호와의 것이 되리라, 혹은 번제물로 드리리라.’ 어떤 해석자들은 이 히브리어 접속사를 선택적 의미로 보아, 누구 또는 무엇이 맞으러 나오는지에 따라 두 가지 결과가 갈라진다고 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  english_pob_choice: whatever comes out
  chosen_korean: 나오는 것은
  alternatives_korean:
  - 무엇이든지 나오는 것은
  - 누구든지 나오는 것은
  - 나와서 맞으러 오는 것은
  lexicon: HALOT
  rationale: 출현 주체를 사람이나 동물로 미리 한정하지 않기 위해 한국어에서도 포괄적인 표현을 택했습니다. 반복 구조의 불확정성을 살리는 것이 핵심입니다.
- source_word: מִדַּלְתֵי בֵיתִי
  english_pob_choice: from the doors of my house
  chosen_korean: 내 집 문들에서
  alternatives_korean:
  - 내 집의 문에서
  - 내 집 어귀에서
  - 내 집 출입문에서
  lexicon: HALOT
  rationale: ‘문들’의 복수형을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다. 출입 지점을 넓게 가리키는 효과도 유지됩니다.
- source_word: וְהָיָה לַיהוָה
  english_pob_choice: shall be Yahweh’s
  chosen_korean: 여호와의 것이 되며
  alternatives_korean:
  - 야훼의 것이 되며
  - 여호와께 속하게 되며
  - 여호와께 바쳐지며
  lexicon: HALOT
  rationale: 본문의 귀속·헌정 의미를 살리되, 다음 절의 번제 표현과 긴장 관계를 무리하게 풀지 않기 위해 ‘것이 되다’로 옮겼습니다. POB 영어의 소유·귀속 뉘앙스도 반영합니다.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  english_pob_choice: and I will offer it up as a burnt offering
  chosen_korean: 내가 그것을 번제물로 드리겠습니다
  alternatives_korean:
  - 내가 그것을 번제로 바치겠습니다
  - 내가 그것을 번제물로 올리겠습니다
  - 내가 그것을 번제헌물로 드리겠습니다
  lexicon: HALOT
  rationale: עלה + עולה의 제의적 관용구를 한국어 성경체로 분명히 드러냈습니다. 목적어를 ‘그것’으로 유지해 앞부분의 의도적 모호성을 이어 갑니다.
theological_decisions:
- issue: ‘여호와의 것이 되며’와 ‘번제물로 드리겠습니다’의 관계
  chosen_reading: 본문의 연결을 그대로 살려 하나의 서원으로 번역했습니다.
  alternative_readings:
  - ‘여호와의 것이 되거나, 번제물로 드리겠습니다’처럼 분리하는 읽기
  - ‘여호와께 바치며 번제물로 드리겠습니다’처럼 순화하는 읽기
  rationale: 히브리어 접속사 ו를 기본값인 ‘그리고/며’로 옮겨 본문의 긴장을 보존했습니다. 이 서원이 실제로 헌납인지 희생 제사인지의 해석 논쟁은 본문에서 해결하지 않고 주석 여지로 남깁니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
