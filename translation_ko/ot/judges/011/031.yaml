  rationale: 대조를 뜻하는 도입어를 제거하여 히브리어 서원문의 흐름을 회복하고, ‘나와 나를 맞이하는 것은 무엇이든지’로 선행사의 사람/동물 가능성과 문법적 포괄성을 보존했습니다. 본문은 ו를 기본 의미인 ‘그리고/며’로 유지했으며, 분리적으로 읽는 견해는 각주에만 제시했습니다.
