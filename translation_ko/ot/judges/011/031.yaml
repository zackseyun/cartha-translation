base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
  footnotes:
  - marker: a
    text: Or, 'shall be the LORD’s, or I will offer it up as a burnt offering.' Some interpreters take the Hebrew conjunction here in a disjunctive sense, yielding two possible outcomes depending on what came out to meet Jephthah.
    reason: alternative_reading
translation:
  language: ko
  text: 내 집의 문들에서 나와 나를 맞이하는 것은 무엇이든지, 내가 암몬 자손에게서 평안히 돌아오면 여호와의 것이 될 것이며[a], 내가 그것을 번제로 드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘여호와의 것이 될 것이거나, 내가 그것을 번제로 드리겠습니다.’ 어떤 해석자들은 여기의 히브리어 접속사를 분리적 의미로 이해하여, 입다가 맞이하러 나온 것이 누구 또는 무엇이냐에 따라 두 가지 결과 가운데 하나가 적용된다고 봅니다.
    reason: alternative_reading
