  lexicon: HALOT
  rationale: 출현 주체를 사람이나 동물로 미리 한정하지 않기 위해 한국어에서도 포괄적인 표현을 택했습니다. 반복 구조의 불확정성을 살리는 것이 핵심입니다.
- source_word: מִדַּלְתֵי בֵיתִי
