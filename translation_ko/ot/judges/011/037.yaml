source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אָבִ֔י/הָ יֵעָ֥שֶׂה לִּ֖/י הַ/דָּבָ֣ר הַ/זֶּ֑ה הַרְפֵּ֨ה מִמֶּ֜/נִּי שְׁנַ֣יִם חֳדָשִׁ֗ים וְ/אֵֽלְכָה֙ וְ/יָרַדְתִּ֣י עַל הֶֽ/הָרִ֔ים וְ/אֶבְכֶּה֙ עַל בְּתוּלַ֔/י אָנֹכִ֖י ו/רעית/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
  footnotes:
  - marker: a
    text: Or “give me leave” / “let me alone” for two months.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “weep over my virginity”; the text emphasizes her unmarried state and childlessness, without here resolving the wider interpretive question in the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그녀가 아버지에게 말했습니다. 「이 일을 저를 위해 해 주십시오. 두 달 동안 저를 놓아 주셔서, 제가 가서 산들에 올라 헤매며 제 처녀성을 두고 울게 해 주십시오. 저와 제 동무들도 함께 말입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로는 ‘제게서 물러나게 해 주십시오’, ‘저를 놓아 주십시오’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘제 처녀성’을 말합니다. 본문은 여기서 그녀의 미혼 상태와 자녀 없음의 상실을 드러내지만, 더 넓은 해석 쟁점은 이 절에서 확정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל אָבִיהָ
  english_pob_choice: And she said to her father
  chosen_korean: 그녀가 아버지에게 말했습니다
  alternatives_korean:
  - 그리고 그녀가 아버지에게 말했습니다
  - 그녀가 자기 아버지에게 말했습니다
  lexicon: WLC
  rationale: 히브리어의 단순 서술을 자연스러운 현대 한국어로 옮겼으며, 문맥상 지시가 분명하므로 ‘자기’를 덧붙이지 않았습니다.
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  english_pob_choice: Let this thing be done for me
  chosen_korean: 이 일을 저를 위해 해 주십시오
  alternatives_korean:
  - 이 일이 저를 위해 이루어지게 해 주십시오
  - 이 일을 저에게 허락해 주십시오
  lexicon: HALOT
  rationale: 피엘/니팔적 수동-청유 뉘앙스를 한국어의 공손한 요청으로 살렸고, ‘이 일’로 히브리어의 지시 표현을 유지했습니다.
- source_word: הַרְפֵּה מִמֶּנִּי
  english_pob_choice: leave me alone
  chosen_korean: 저를 놓아 주셔서
  alternatives_korean:
  - 저를 내버려 두셔서
  - 저에게서 물러나 주셔서
  - 저에게 허락해 주셔서
  lexicon: HALOT
  rationale: 관용구의 핵심은 일정 기간 떨어져 있게 해 달라는 요청이므로, 한국어로는 ‘놓아 주다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  english_pob_choice: that I may go and wander on the mountains
  chosen_korean: 제가 가서 산들에 올라 헤매며
  alternatives_korean:
  - 제가 가서 산들로 내려가 헤매며
  - 제가 가서 산들에서 떠돌며
  lexicon: HALOT
  rationale: 히브리어의 이동 동사를 한 번은 ‘가서’로, 관용적 공간표현은 ‘산들에 올라’로 옮겨 산지로 들어가는 동작을 살렸습니다.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  english_pob_choice: and weep over my virginity
  chosen_korean: 제 처녀성을 두고 울게 해 주십시오
  alternatives_korean:
  - 제 처녀성을 두고 애통하게 해 주십시오
  - 제 처녀성 때문에 울게 해 주십시오
  - 제 처녀성을 슬퍼하며 울게 해 주십시오
  lexicon: HALOT
  rationale: בְּתוּלִים의 핵심 의미인 처녀성/미혼 상태를 직접 반영하되, 본문이 죽음을 명시하지 않으므로 해석을 덧붙이지 않았습니다.
- source_word: וְרֵעוֹתָי
  english_pob_choice: I and my companions
  chosen_korean: 저와 제 동무들도 함께
  alternatives_korean:
  - 저와 제 동무들
  - 저와 제 여자 동무들
  - 저와 제 동료들
  lexicon: HALOT
  rationale: 여성 복수형이 분명하므로 성별을 드러낼 수 있으나, 한국어에서는 과도한 설명보다 자연스러운 ‘동무들’이 문맥상 충분합니다.
theological_decisions:
- issue: 입다의 딸이 무엇을 애도하는지에 대한 해석
  chosen_reading: 본문이 직접 말하는 ‘제 처녀성’을 그대로 살리고, 죽음·영구적 헌신·출산 불능의 문제를 번역문에서 해결하지 않았습니다.
  alternative_readings:
  - 다가오는 죽음과 자녀 없음까지 함께 애도한다고 볼 수 있습니다
  - 평생 처녀로 지내게 될 운명을 애도한다고 볼 수 있습니다
  rationale: 이 절은 애도의 대상이 처녀성임을 전면에 두므로, 번역이 신학적 결론을 앞서 제시하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
