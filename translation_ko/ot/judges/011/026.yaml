  source_fidelity: 지명 두 곳이 원문과 표준 한국어 성경 관행에 맞지 않습니다. חֶשְׁבּוֹן은 ‘헤스본’, עַרְעוֹר는 ‘아로엘’이 아니라 ‘아로엘’과 구별되는 ‘아로엘’? 원문의 표준 음역은 ‘아로엘’이 아니라 ‘아로엘’로 정착되어 있지 않아, 혼동을 피하여 ‘아로엘’로 유지하기보다 통상 표기인 ‘아로엘’로 고칠 필요가 있습니다. 또한 הִצַּלְתֶּם은 문맥상 영토·성읍들을 ‘되찾다’로 옮길 수 있으며, 원문의 복수 목적어를 보존해 ‘그것들을’로 번역했습니다.
  naturalness: 초안의 ‘삼백 년 동안 거주하였거늘’은 이해되지만 현대 표준어 합쇼체에서는 ‘삼백 년 동안 살았는데’가 더 자연스럽습니다. 열거된 성읍과 그 부속 촌락을 명확히 하고, 수사 의문문을 현대적인 ‘왜 … 않았습니까?’로 다듬었습니다.
  terminology: ‘딸 성읍들’은 בְּנוֹתֶיהָ의 직역적 은유를 보존하되 주석에서 부속 취락이라는 뜻을 설명했습니다. ‘되찾다’는 נצל 히필의 통상적 ‘구하다/건져 내다’와 문맥상 영토 회복의 의미 사이를 반영하며, 대안은 주석으로 제시했습니다.
  issues:
  - severity: high
    issue: ‘호손’은 חֶשְׁבּוֹן의 지명 음역과 일치하지 않습니다.
    rationale: 원문 지명은 헤스본(Heshbon)이며, ‘호손’은 다른 지명을 가리키거나 오기로 이해될 수 있습니다.
  - severity: high
    issue: ‘아로엘’은 עַרְעוֹר의 표준 음역과 일치하지 않습니다.
    rationale: 원문 지명 Aroer를 정확히 식별할 수 있도록 통용 표기인 ‘아로엘’로 바로잡아야 합니다.
  - severity: medium
    issue: ‘그 땅을 빼앗지 아니하였느냐’는 הִצַּלְתֶּם의 의미와 어조를 다소 바꿉니다.
    rationale: 동사는 기본적으로 ‘구하다, 건져 내다’이며, 이 영토 분쟁 문맥에서는 선점·탈취가 아니라 이미 주장하는 성읍/영토를 ‘되찾다’라는 뜻이 적절합니다.
  revised_text: 이스라엘이 헤스본과 그 딸 성읍들에, 아로엘과 그 딸 성읍들에, 그리고 아르논 강을 따라 있는 모든 성읍에 삼백 년 동안 살았는데, 왜 그동안 그것들을 되찾지 않았습니까?
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘그 딸들’입니다. 중심 성읍에 딸린 작은 부속 취락들을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그것들을 구해 내지 않았습니까?’ 원문의 동사는 ‘구하다, 건져 내다’라는 뜻이며, 여기서는 영토 분쟁의 문맥상 되찾는다는 의미로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 지명을 정확한 한국어 음역으로 고치고, בְּנוֹתֶיהָ의 행정·지리적 은유와 הִצַּלְתֶּם의 문맥적 의미를 보존했습니다. ‘그동안’은 ‘그때에’가 앞선 삼백 년의 기간을 가리키는 문맥을 자연스럽게 드러냅니다. 각주 표지는 각각 ‘딸 성읍들’과 ‘되찾지’에 연결해야 합니다.
