source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
  footnotes:
  - marker: a
    text: Or, 'we have returned to you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Ammon,' that is, the Ammonites.
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗의 장로들이 입다에게 말했습니다. 「그렇기 때문에 우리가 이제 당신에게 돌아온 것입니다. 당신은 우리와 함께 가서 암몬 자손과 싸우고, 길르앗의 모든 주민 위에 우두머리가 될 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 당신에게 돌아왔습니다’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘암몬의 아들들’, 곧 암몬 자손입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  english_pob_choice: the elders of Gilead
  chosen_korean: 길르앗의 장로들
  alternatives_korean:
  - 길르앗의 원로들
  - 길르앗의 지도자들
  lexicon: HALOT
  rationale: זִקְנֵי는 공동체의 공인된 장로층을 가리키므로, 교회적 색채가 강한 표현보다 사회·정치적 역할을 드러내는 ‘장로들’이 가장 직접적입니다.
- source_word: לָכֵן עַתָּה שַׁבְנוּ אֵלֶיךָ
  english_pob_choice: That is why we have now come back to you
  chosen_korean: 그렇기 때문에 우리가 이제 당신에게 돌아온 것입니다
  alternatives_korean:
  - 그러므로 우리가 이제 당신에게 돌아왔습니다
  - 그래서 우리가 지금 당신에게 돌아온 것입니다
  lexicon: HALOT
  rationale: לָכֵן과 עַתָּה의 논리적·시점적 결합을 살려, 이전 거절 뒤에 다시 찾아온 이유를 자연스럽게 연결했습니다.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  english_pob_choice: fight against the Ammonites
  chosen_korean: 암몬 자손과 싸우고
  alternatives_korean:
  - 암몬 사람들과 싸우고
  - 암몬 자손을 대적하여 싸우고
  lexicon: HALOT
  rationale: 히브리어의 직설적 민족 표지를 유지하기 위해 ‘암몬 자손’을 택했고, 동사 נלחם의 대립 관계는 ‘와 싸우다’로 옮겼습니다.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  english_pob_choice: you will be head over all the inhabitants of Gilead
  chosen_korean: 길르앗의 모든 주민 위에 우두머리가 될 것입니다
  alternatives_korean:
  - 길르앗의 모든 주민 위에 머리가 될 것입니다
  - 길르앗의 모든 주민의 지도자가 될 것입니다
  lexicon: HALOT
  rationale: רֹאשׁ의 은유를 한국어에서도 살리되, 오늘 독자가 이해하기 쉬운 권위 표현인 ‘우두머리’로 옮겨 지배적·대표적 의미를 드러냈습니다.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  english_pob_choice: over all the inhabitants of Gilead
  chosen_korean: 길르앗의 모든 주민
  alternatives_korean:
  - 길르앗에 사는 모든 사람들
  - 길르앗의 모든 거주자들
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 어떤 장소에 ‘거주하는 자들’이라는 집합 표현이므로, 문맥상 자연스러운 ‘주민’으로 옮겼습니다.
theological_decisions:
- issue: 입다에게 약속된 권한의 범위
  chosen_reading: 장로들은 입다에게 전투 지휘만이 아니라 길르앗 전체 주민 위에 서는 공적 지도권을 약속합니다.
  alternative_readings:
  - 임시적인 군사 지휘만을 뜻할 수 있습니다
  rationale: וְהָיִיתָ לָּנוּ לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד는 전투 요청을 넘어 더 넓은 통치적·대표적 지위를 가리키므로, 그 범위를 살려 번역했습니다.
  doctrine_reference: 공동체 지도권과 공적 권위의 범위를 문맥대로 읽어야 합니다.
