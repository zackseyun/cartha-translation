id: JDG.11.29
reference: Judges 11:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִ֤י עַל יִפְתָּח֙ ר֣וּחַ יְהוָ֔ה וַ/יַּעֲבֹ֥ר אֶת הַ/גִּלְעָ֖ד וְ/אֶת מְנַשֶּׁ֑ה וַֽ/יַּעֲבֹר֙ אֶת מִצְפֵּ֣ה גִלְעָ֔ד וּ/מִ/מִּצְפֵּ֣ה גִלְעָ֔ד עָבַ֖ר בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
  footnotes:
  - marker: a
    text: Or, 'he crossed over to the Ammonites.' The Hebrew verb can denote passing through, crossing over, or advancing onward, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 영이 입다에게 임하셨습니다. 그는 길르앗과 므낫세를 지나갔고, 길르앗 미스바를 지나, 길르앗 미스바에서 암몬 자손에게로 나아갔습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 암몬 자손에게로 건너갔습니다.’ 이 히브리어 동사는 문맥에 따라 지나가다, 건너가다, 나아가다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ יְהוָ֔ה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 רוח
  - 야훼의 바람
  lexicon: HALOT
  rationale: 문맥상 רוח는 바람이나 숨이 아니라 사람을 사역과 행동으로 이끄는 하나님의 영이므로, POB의 직접적 인식을 따라 ‘영’으로 옮겼습니다.
- source_word: וַ/תְּהִ֤י עַל
  english_pob_choice: came upon
  chosen_korean: 임하셨습니다
  alternatives_korean:
  - 그 위에 계셨습니다
  - 그에게 내리셨습니다
  lexicon: HALOT
  rationale: ‘was upon’보다 사건성을 살리는 표현으로, 하나님의 능력 주심과 덮어 오심의 뉘앙스를 자연스럽게 드러냅니다.
- source_word: וַ/יַּעֲבֹ֥ר
  english_pob_choice: he passed through
  chosen_korean: 지나고
  alternatives_korean:
  - 통과하고
  - 건너가고
  lexicon: HALOT
  rationale: 뒤따르는 지명들이 여러 지역이므로, ‘지나가다’가 영토를 가로지르는 이동을 가장 자연스럽게 나타냅니다.
- source_word: מִצְפֵּ֣ה גִלְעָ֔ד
  english_pob_choice: Mizpah of Gilead
  chosen_korean: 길르앗 미스바
  alternatives_korean:
  - 길르앗의 미스바
  - 미스바-길르앗
  lexicon: HALOT
  rationale: 고유 지명으로 보아 뜻풀이(‘망대’)보다 음역을 따르되, 한국어 지명 관용에 맞게 소속 관계를 앞에 두어 표현했습니다.
theological_decisions:
- issue: 야훼의 영이 입다에게 임하는 표현의 신학적 힘
  chosen_reading: 입다를 전투와 지도 행동으로 능력 있게 하시는 하나님의 영의 임재를 그대로 드러냈습니다.
  alternative_readings:
  - 단순한 내적 감동
  - 덜 인격적인 바람/기운
  rationale: 사사기에서 이 관용구는 지도자를 위한 하나님의 실제적 권능 부여를 가리키므로, 그 신학적 무게를 약화하지 않도록 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 원칙에 따라 언약적 고유명사를 유지해, 일반 호칭으로 완화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
