  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
  footnotes:
  - marker: a
    text: Or, 'came out to meet him with tambourines and dancing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his only one'; that is, his only child.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 입다가 미스바[a]에서 자기 집으로 왔습니다. 그런데 보니, 그의 딸이 북을 치며 춤추면서 그를 맞으러 나오고 있었습니다. 그런데 그녀는 그의 외동딸[b]이었습니다. 그에게는 그녀 외에는 아들이나 딸이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 ‘북과 춤으로 그를 맞으러 나왔다’일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 하나뿐인 자녀’, 곧 외동을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 왔습니다
  alternatives_korean:
  - 그리고 ... 왔습니다
  - 그래서 ... 왔습니다
  lexicon: HALOT
  rationale: 와우-연속의 서술 진행을 자연스러운 한국어 순서 표현으로 살리되, 단순한 이동 동사 ‘오다’를 유지했습니다.
- source_word: הַמִּצְפָּה
  english_pob_choice: to Mizpah
  chosen_korean: 미스바에서
  alternatives_korean:
  - 미스바로
  - 그 미스바에서
  lexicon: HALOT
  rationale: 고유지명은 표준 음역을 따르되, 동작의 출발·도착이 포함된 문맥상 한국어에서는 ‘~에서’로 정리하는 편이 자연스럽습니다.
- source_word: בְתֻפִּים וּבִמְחֹלוֹת
  english_pob_choice: with tambourines and with dances
  chosen_korean: 북을 치며 춤추면서
  alternatives_korean:
  - 탬버린과 춤으로
  - 북과 춤으로
  lexicon: HALOT
  rationale: ‘탬버린’보다 원의 장면성을 더 직접적으로 드러내는 ‘북’을 택했고, 복수 명사 ‘춤들/춤판’보다 행위 중심의 ‘춤추면서’가 문맥에 맞습니다.
- source_word: יְחִידָה
  english_pob_choice: his only child
  chosen_korean: 외동딸
  alternatives_korean:
  - 유일한 자녀
  - 그의 외동
  - 외동 자녀
  lexicon: HALOT
  rationale: 문맥이 곧바로 아들이나 딸이 없었다고 풀어 주므로, 한국어에서는 ‘외동딸’이 ‘only child’를 가장 압축적이면서도 분명하게 전달합니다.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  english_pob_choice: besides her he had neither son nor daughter
  chosen_korean: 그에게는 그녀 외에는 아들이나 딸이 없었습니다
  alternatives_korean:
  - 그는 그녀 말고는 아들도 딸도 없었습니다
  - 그에게는 그녀 외에 아들이나 딸이 없었습니다
  lexicon: HALOT
  rationale: 중복 부정을 한국어의 자연스러운 평서문으로 정리하면서도, 그녀만이 유일한 자녀라는 점을 분명히 보존했습니다.
theological_decisions:
- issue: 입다의 딸의 상태를 어떻게 처리할지
  chosen_reading: 이 절은 딸이 입다의 유일한 자녀였고 축하하며 나왔다는 사실만 서술하고, 뒤의 논쟁적 해석은 보류했습니다.
  alternative_readings:
  - 이 절을 바탕으로 후속 맥락을 미리 해석해 희생 또는 평생 처녀 상태를 암시할 수 있음
  rationale: 본문 자체가 확정하는 정보 이상으로 해석을 밀어 넣지 않고, 본문이 남겨 둔 신학적 긴장을 유지하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 본문 우선, 논쟁 지점은 문맥 전체에서 판단
