base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
  footnotes:
  - marker: a
    text: Or, 'came out to meet him with tambourines and dancing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his only one'; that is, his only child.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 입다가 미스바에 있는 자기 집에 이르렀습니다. 그런데 보니, 그의 딸이 소고를 치고 춤추며 그를 맞으러 나오고 있었습니다[a]. 그 딸은 그의 외동딸[b]이었습니다. 그에게는 그녀 외에 아들도 딸도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소고를 치고 춤추며 그를 맞으러 나왔습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 하나뿐인 자녀’, 곧 외동을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
