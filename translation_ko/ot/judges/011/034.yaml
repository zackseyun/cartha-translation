  - severity: medium
    issue: 각주 a의 앵커가 ‘미스바’에 붙어 있으나 각주 내용은 딸이 나와 맞이한 동작의 대안 번역입니다.
    rationale: 각주 앵커를 ‘나오고 있었습니다’에 붙여야 각주가 지시하는 본문 구절과 일치합니다.
