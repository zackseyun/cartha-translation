  - 보자마자
  lexicon: HALOT
  rationale: 히브리어의 서술 전환과 시간 부사적 구조를 한국어에서는 자연스러운 조건·시간 표현으로 옮겼습니다.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  english_pob_choice: he tore his clothes
  chosen_korean: 그의 옷을 찢으며
  alternatives_korean:
  - 그의 옷을 찢고
  - 그의 옷을 찢었습니다
  lexicon: HALOT
  rationale: 슬픔과 통탄을 나타내는 관용적 행위를 자연스럽게 살리면서, 뒤의 발화와 연결되는 진행형으로 처리했습니다.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  english_pob_choice: You have brought me very low
  chosen_korean: 네가 나를 크게 낮추었고
  alternatives_korean:
  - 네가 나를 아주 낮추었고
  - 네가 나를 심히 꺾었고
  lexicon: HALOT
  rationale: 강조형(부정사 절대형+동사)의 격렬함을 살리되, 한국어에서 과도하게 해석적인 ‘무너뜨리다’보다 ‘크게 낮추다’가 본문 감정의 강도를 적절히 전달합니다.
- source_word: וְאַתְּ הָיִיתְ בְעֹכְרָי
  english_pob_choice: and you have become the cause of my trouble
  chosen_korean: 나의 괴로움의 원인이 되었구나
  alternatives_korean:
  - 나를 괴롭히는 자가 되었구나
  - 나의 trouble의 원인이 되었구나
  lexicon: HALOT
  rationale: עכר의 ‘괴로움/고통을 일으키다’라는 뜻을 살려, 관계를 직접 비난하는 어조를 지나치게 강화하지 않으면서 인과를 분명히 했습니다.
- source_word: וְלֹא אוּכַל לָשׁוּב
  english_pob_choice: and I cannot turn back
  chosen_korean: 나는 돌이킬 수 없다
  alternatives_korean:
  - 나는 되돌릴 수 없다
  - 나는 취소할 수 없다
  lexicon: HALOT
  rationale: שוב의 ‘되돌아가다/되돌리다’ 의미를 한국어 관용구 ‘돌이킬 수 없다’로 옮겨, 맹세의 불가역성을 자연스럽게 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명사 יהוה를 번역 관습상 표준적인 음역 ‘야훼’로 유지하여, 호칭이 아니라 하나님의 이름이라는 점을 보존했습니다.
theological_decisions:
- issue: ‘입을 열었다’의 의미를 본문에서 얼마나 명시할지
  chosen_reading: 본문은 관용구를 유지하되, 한국어에서는 뒤 문맥으로 맹세의 성격이 드러나도록 했습니다.
  alternative_readings:
  - 야훼께 서원했습니다
  - 야훼께 맹세했습니다
  rationale: 히브리어는 문자적으로 ‘입을 열다’라고 말하며, 문맥상 서원의 의미가 분명하지만 본문 자체는 그 표현을 직접 유지합니다. 너무 풀어 쓰면 원문의 엄숙하고 간접적인 표현이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 딸에게 돌리는 비탄의 강도를 어떻게 반영할지
  chosen_reading: ‘크게 낮추었고, 나의 괴로움의 원인이 되었구나’로 옮겨 강한 비탄은 살리되 도덕적 비난을 과도하게 덧씌우지 않았습니다.
  alternative_readings:
  - 나를 망쳤구나
  - 나를 파멸시켰구나
  rationale: 본문은 아버지의 격렬한 슬픔을 보여 주지만, 한국어에서 더 강한 표현은 딸에게 직접적인 책임을 과도하게 부과할 수 있습니다. 따라서 원문이 허용하는 범위 내에서 감정의 압박만 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
