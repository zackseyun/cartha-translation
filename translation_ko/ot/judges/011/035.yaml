  source_fidelity: 대체로 원문에 충실합니다. 다만 וַיִּקְרַע…וַיֹּאמֶר의 연속 동작은 ‘찢으며 말했습니다’보다 ‘찢고 말했습니다’가 더 정확합니다. 또한 עֹכְרָי는 단순한 추상적 ‘괴로움의 원인’보다 ‘나를 괴롭게 하는 자’처럼 사람을 가리키는 표현을 살리는 편이 좋습니다.
