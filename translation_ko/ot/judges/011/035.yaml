- from: 그가 그녀를 보자, 그의 옷을 찢으며 말했습니다. 「아, 내 딸아! 네가 나를 크게 낮추었고, 나의 괴로움의 원인이 되었구나. 내가 야훼께 입을 열었으니, 나는 돌이킬 수 없다」.[a]
  to: 그가 딸을 보자 자기 옷을 찢고 말했습니다. 「아아, 내 딸아! 네가 나를 몹시 꺾었고, 나를 괴롭게 하는 자가 되었구나. 나는 야훼께 입을 열었으니[a], 돌이킬 수 없구나.」
  rationale: 원문의 시간 절, 옷을 찢는 애도 행위, 딸을 향한 격한 탄식, ‘입을 열다’라는 서원 관용구, 그리고 되돌릴 수 없다는 진술을 유지했습니다. 문법적으로 연속된 두 동작을 ‘찢고 말했습니다’로 고치고, 사람을 가리키는 עֹכְרָי의 뉘앙스를 자연스러운 한국어로 반영했습니다.
