base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
  footnotes:
  - marker: a
    text: Or, more explicitly, “I have made a vow to the LORD.” The Hebrew reads literally, “I have opened my mouth to the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 딸을 보자 자기 옷을 찢고 말했습니다. 「아아, 내 딸아! 네가 나를 몹시 꺾었고, 나를 괴롭게 하는 자가 되었구나. 나는 야훼께 입을 열었으니[a], 돌이킬 수 없구나.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나는 야훼께 내 입을 열었다’입니다. 문맥상 야훼께 서원했다는 뜻을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ
  english_pob_choice: And when he saw
  chosen_korean: 그가 그녀를 보자
  alternatives_korean:
