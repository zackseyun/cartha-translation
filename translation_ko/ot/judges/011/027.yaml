source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
  footnotes:
  - marker: a
    text: Or, 'between the Israelites and the Ammonites.' The Hebrew reads literally, 'between the sons of Israel and the sons of Ammon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신에게 죄를 짓지 않았습니다. 그러나 당신은 나와 싸워 나에게 악을 행하고 있습니다. 심판자이신 야훼께서 오늘 이스라엘 자손과 암몬 자손 사이에서 심판하시기를 바랍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들과 암몬 사람들 사이에서.” 히브리어는 문자적으로 “이스라엘의 아들들과 암몬의 아들들 사이에서”라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  english_pob_choice: I have not sinned against you
  chosen_korean: 나는 당신에게 죄를 짓지 않았습니다
  alternatives_korean:
  - 나는 당신을 해치지 않았습니다
  - 나는 당신에게 잘못하지 않았습니다
  lexicon: HALOT
  rationale: חטא는 여기서 도덕적·법적 과오를 뜻하므로, ‘죄를 짓다’가 원문의 책임 부정을 가장 직접적으로 살립니다.
- source_word: עֹשֶׂה אִתִּי רָעָה
  english_pob_choice: are doing me wrong
  chosen_korean: 나에게 전쟁을 일으켜 나를 해치고 있습니다
  alternatives_korean:
  - 나에게 악을 행하고 있습니다
  - 나를 부당하게 대하고 있습니다
  lexicon: HALOT
  rationale: 문맥상 개인적 악행보다 국가 간 분쟁의 부당함이 핵심이어서, 뒤의 ‘전쟁을 일으켜’와 연결해 분쟁의 성격을 드러냈습니다.
- source_word: לְהִלָּחֶם בִּי
  english_pob_choice: by making war against me
  chosen_korean: 전쟁을 일으켜
  alternatives_korean:
  - 나와 싸우려고
  - 나를 상대로 전쟁을 벌여
  lexicon: HALOT
  rationale: 히브리어 부정사구는 앞 절의 ‘해치고 있습니다’의 방식/결과를 설명하므로, 한국어에서는 자연스럽게 ‘전쟁을 일으켜’로 옮겼습니다.
- source_word: יְהוָה הַשֹּׁפֵט
  english_pob_choice: Yahweh, the Judge
  chosen_korean: 심판하시는 야훼
  alternatives_korean:
  - 야훼, 그 심판자
  - 재판장이신 야훼
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 야훼로 옮기고, 관사 없는 분사 הַשֹּׁפֵט의 칭호는 ‘심판하시는’으로 처리해 현재적 행위를 살렸습니다.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  english_pob_choice: between the sons of Israel and the sons of Ammon
  chosen_korean: 이스라엘 자손과 암몬 자손 사이에서
  alternatives_korean:
  - 이스라엘의 아들들과 암몬의 아들들 사이에서
  - 이스라엘 사람들과 암몬 사람들 사이에서
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of’ 표현을 그대로 살리되, 한국어 성경 문체에 맞게 ‘자손’으로 옮겨 족속 간 대립 구조를 보존했습니다.
theological_decisions:
- issue: 여호와 대체 여부와 심판 호칭
  chosen_reading: ‘야훼’와 ‘심판하시는’으로 직역해 하나님의 이름과 칭호를 모두 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - ‘재판장’으로 일반화
  rationale: 본문은 단순한 일반 판사가 아니라 언약명의 하나님이 양 진영 사이의 정당성을 판결하시는 장면이므로, 이름과 칭호를 함께 보존하는 편이 원문의 신학적 힘을 살립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘죄를 짓지 않았다’와 ‘해치다’의 대비
  chosen_reading: 첫 절의 도덕적 책임 부정과 뒤 절의 전쟁 개시를 대조적으로 살렸습니다.
  alternative_readings:
  - 둘 다 ‘잘못하다’로 평탄화
  - 둘 다 ‘해치다’로 통일
  rationale: 이 문장은 제의적·법적 항변의 성격이 강하므로, 같은 수준의 ‘잘못’으로 평준화하기보다 ‘죄’와 ‘해치다/전쟁’의 대비를 유지하는 것이 화자의 항변을 더 분명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: Preserve rhetorical force'
