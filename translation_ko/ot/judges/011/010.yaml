translation:
  language: ko
  text: 그때 길르앗의 장로들이 입다에게 말했습니다. “야훼께서는 우리가 당신의 말대로 행하지 않는다면 우리 사이에서 증인이 되실 것입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘야훼께서 우리 사이에서 들으실 것입니다.’ 히브리어의 ‘듣다’는 두 당사자 사이에서 증인 또는 재판관으로 들으신다는 뜻입니다.
    reason: lexical_alternative
