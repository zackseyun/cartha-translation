  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
  footnotes:
  - marker: a
    text: Or, more literally, 'May the LORD be hearing between us'—that is, hearing as witness or judge between the two parties.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 길르앗의 장로들이 입다에게 말했습니다. “야훼께서 우리 사이에서 증인이 되셔서, 우리가 당신의 말대로 하지 않으면 하십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘주께서 우리 사이에서 들으시기를’로도 옮길 수 있습니다. 이는 두 당사자 사이에서 증인 또는 재판관으로 들으시는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  english_pob_choice: the elders of Gilead
  chosen_korean: 길르앗의 장로들
  alternatives_korean:
  - 길르앗 장로들
  - 길르앗의 원로들
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 드러내는 속격 구조로 옮기되, 회중 지도층을 가리키는 표준적인 ‘장로들’을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 언약명 יהוה를 번역 관행상 제목으로 대체하지 않고, 프로젝트 기본값에 따라 고유명 ‘야훼’로 옮겼습니다.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  english_pob_choice: be a witness between us
  chosen_korean: 우리 사이에서 증인이 되셔서
  alternatives_korean:
  - 우리 사이에서 들으셔서
  - 우리 사이에서 들으시는 증인이 되셔서
  lexicon: HALOT
  rationale: 직역상 ‘듣다’이지만, 맹세·분쟁 문맥에서 재판적 증언/판결의 기능이 있어 ‘증인이 되다’로 자연스럽게 렌더링했습니다.
- source_word: כִדְבָרְךָ
  english_pob_choice: according to your word
  chosen_korean: 당신의 말대로
  alternatives_korean:
  - 당신의 말씀대로
  - 당신의 말에 따라
  lexicon: HALOT
  rationale: 입다의 제안과 조건을 가리키는 ‘당신의 말’을 한국어로 가장 직관적으로 살렸습니다. 경어 체계는 인물 간 대화를 반영해 ‘당신’으로 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 맹세 공식의 한국어화
  chosen_reading: ‘야훼께서 우리 사이에서 증인이 되셔서’로 옮겨, 신적 이름과 재판적 맹세 기능을 함께 드러냈습니다.
  alternative_readings:
  - ‘주님이 우리 사이에서 증인이 되셔서’
  - ‘야훼께서 우리 사이에서 듣고 계시도록’
  rationale: 히브리어는 단순한 미래가 아니라 맹세적 선언을 담고 있으므로, ‘증인이 되다’로 의미를 살리면서도 이름은 야훼로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
