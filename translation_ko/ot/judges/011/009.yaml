  to: 입다가 길르앗의 장로들에게 말했습니다. “만일 여러분이 나를 돌아오게 하여 암몬 사람들과 싸우게 하고, 야훼께서 그들을 내 앞에 넘겨주신다면, 제가 여러분의 수장이 되겠습니다.”
