review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the verse, including Jephthah, the elders of Gilead, combat with the Ammonites, Yahweh’s action, and Jephthah’s resulting leadership. However, '나를 불러' does not adequately represent the causative 'bring/restore me back' (מְשִׁיבִים), and '내 앞에 붙이시면' is not idiomatic for Yahweh giving the enemy before Jephthah.
  naturalness: The draft uses archaic narrative and quotation forms ('이르되', '되겠노라') rather than the requested modern formal-polite 합쇼체. The revision uses natural contemporary formal Korean while retaining the directness of the Hebrew.
  terminology: Use '야훼' for יהוה in accordance with the supplied English POB policy. '수장' naturally conveys לְרֹאשׁ ('as head/chief') in this political-military context without awkwardly using the body-part sense of '머리.'
  issues:
  - severity: medium
    issue: '''나를 불러'' omits the return/restoration sense of מְשִׁיבִים.'
    rationale: The Hiphil of שוב means causing Jephthah to return; the context is the elders asking back the man who had been driven away.
  - severity: medium
    issue: The register is archaic rather than modern formal-polite.
    rationale: '''이르되'' and ''되겠노라'' do not meet the stated 합쇼체 target.'
  - severity: low
    issue: '''내 앞에 붙이시면'' is unnatural in modern Korean for וְנָתַן ... לְפָנַי.'
    rationale: '''내 앞에 넘겨주신다면'' clearly expresses Yahweh’s giving the opponents over before Jephthah without adding ''into my hand.'''
  revised_text: 입다가 길르앗의 장로들에게 말했습니다. “만일 여러분이 나를 돌아오게 하여 암몬 사람들과 싸우게 하고, 야훼께서 그들을 내 앞에 넘겨주신다면, 제가 여러분의 수장이 되겠습니다.”
