id: JDG.11.25
reference: Judges 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
  footnotes:
  - marker: a
    text: Or, 'are you any better than Balak son of Zippor, king of Moab?' The Hebrew uses an emphatic repetition ('good, good') to intensify the comparison.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Did he ever dispute with Israel, or did he ever wage war against them?' The first verb can denote legal contention or quarrel, while the second specifically denotes fighting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이제, 당신이 십볼의 아들 발락, 곧 모압 왕보다 정말 더 낫습니까?[a] 그가 이스라엘과 다툰 적이 있습니까, 아니면 그들과 싸운 적이 있습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서는 ‘좋다’라는 말의 반복으로 비교를 강조합니다.
    reason: source_note
  - marker: b
    text: 첫 번째 동사는 법적 다툼이나 논쟁을 비롯한 넓은 의미의 다툼을, 두 번째 동사는 실제 싸움이나 전투를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그런데 이제
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 전환 접속 וְ와 시간 부사 עַתָּה가 만드는 논박의 흐름을 살려, 반박·전환의 뉘앙스가 있는 ‘그런데 이제’로 옮겼습니다.
- source_word: הֲטוֹב טוֹב אַתָּה
  english_pob_choice: are you really better
  chosen_korean: 더 나은 사람입니까
  alternatives_korean:
  - 정말 더 나은 사람입니까
  - 당신이 정말 더 낫습니까
  lexicon: HALOT
  rationale: ‘좋다/더 낫다’의 반복적 강조를 한국어에서 자연스럽게 반영하기 위해, 수사적 비교 질문으로 간결하게 처리했습니다.
- source_word: הֲרֹב רָב עִם יִשְׂרָאֵל
  english_pob_choice: Did he ever contend with Israel
  chosen_korean: 이스라엘과 다툰 적이 있습니까
  alternatives_korean:
  - 이스라엘과 논쟁한 적이 있습니까
  - 이스라엘과 맞선 적이 있습니까
  lexicon: HALOT
  rationale: ריב의 폭넓은 의미를 ‘다투다’로 옮겨, 법적 논쟁과 일반적 충돌 사이의 긴장을 너무 일찍 한쪽으로 좁히지 않았습니다.
- source_word: נִלְחֹם נִלְחַם בָּם
  english_pob_choice: did he ever fight against them
  chosen_korean: 그들과 싸운 적이 있습니까
  alternatives_korean:
  - 그들과 전쟁한 적이 있습니까
  - 그들을 상대로 싸운 적이 있습니까
  lexicon: HALOT
  rationale: לחם의 분명한 전투 의미를 살리되, 한국어에서는 ‘전쟁하다’보다 수사적 평행이 살아나는 ‘싸우다’를 택했습니다.
theological_decisions:
- issue: Balak와의 비교가 암시하는 도덕적/정치적 논증 구조
  chosen_reading: 입다는 바락을 예로 들어, 암몬의 요구가 정당한 분쟁이나 전쟁의 전제가 될 수 없음을 수사적으로 드러냅니다.
  alternative_readings:
  - 단순한 역사 비교
  - 외교적 예시
  rationale: 본문은 정보 전달보다 반박 논증에 초점이 있으므로, 질문 형식의 도전성을 유지하는 번역이 필요합니다.
  doctrine_reference: 본문 문맥의 수사학적 기능
