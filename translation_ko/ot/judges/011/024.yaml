source:
  edition: WLC
  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
  footnotes:
  - marker: a
    text: Or 'inherit' / 'take possession of' for the repeated Hebrew verb ירשׁ; the term refers to possessing territory, often by dispossessing prior occupants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'what Chemosh your god causes you to possess'; the verb can carry the sense of gaining possession by dispossessing others.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 당신의 신 그모스가 당신에게 차지하게 해 준 것을 차지하지 않겠습니까?[b] 야훼, 우리 하나님께서 우리 앞에서 몰아내신 모든 것을 우리는 차지할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘차지하다’는 반복되는 히브리어 동사 ירשׁ의 영토 점유 의미를 옮긴 것입니다. 문맥에 따라 ‘상속하다’ 또는 ‘소유하다’로도 옮길 수 있으며, 종종 이전 거주자를 내쫓고 점유하는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘차지하게 해 주다’는 히브리어 히필형 ירשׁ의 사역적 의미를 옮긴 것입니다. 이 동사는 다른 이가 차지하도록 하며, 문맥에 따라 이전 점유자를 내쫓는 뜻을 내포할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Will you not
  chosen_korean: 차지하지 않겠느냐?
  alternatives_korean:
  - 차지하지 않겠습니까?
  - 정말 차지하지 않겠느냐?
  lexicon: HALOT
  rationale: 반어적 수사 의문문으로, 상대가 당연히 그렇다고 인정하도록 압박하는 뉘앙스를 살려 한국어에서도 의문형으로 옮겼습니다.
- source_word: יוֹרִישְׁךָ
  english_pob_choice: causes you to possess
  chosen_korean: 주어 차지하게 한
  alternatives_korean:
  - 차지하게 하신
  - 네게 상속하게 한
  lexicon: HALOT
  rationale: 히필 ירשׁ의 인과적 의미를 살려 단순한 ‘주다’보다 ‘차지하게 하다’로 옮겼고, 영토 점유의 결과를 분명히 했습니다.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  english_pob_choice: Chemosh your god
  chosen_korean: 네 신 그모스
  alternatives_korean:
  - 그모스 네 신
  - 그모스 너의 신
  lexicon: HALOT
  rationale: 고유명사는 음역하고, ‘네 신’이라는 호격적 소유 관계를 직접 살려 상대편의 주장된 신을 그대로 드러냈습니다.
- source_word: הוֹרִישׁ ... מִפָּנֵינוּ
  english_pob_choice: has dispossessed ... before us
  chosen_korean: 우리 앞에서 몰아내신
  alternatives_korean:
  - 우리 앞에서 쫓아내신
  - 우리 앞에서 빼앗아 내신
  lexicon: HALOT
  rationale: 히필 ירשׁ의 핵심이 ‘점유하게 하다/내쫓다’라는 점을 반영해, 기존 주민을 제거하는 정복의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: נִירָשׁ
  english_pob_choice: we will possess
  chosen_korean: 우리가 차지할 것입니다
  alternatives_korean:
  - 우리가 상속받을 것입니다
  - 우리가 차지하겠습니다
  lexicon: HALOT
  rationale: 앞 절의 ‘차지하다’와 대응시키되, 한국어에서 영토 점유를 가장 자연스럽게 표현하는 동사를 유지했습니다.
theological_decisions:
- issue: 여기서 그모스를 ‘네 신’이라고 부르는 표현
  chosen_reading: 화자 제법을 그대로 유지하여, 본문이 상대편의 주장과 논리를 인용하는 것으로 읽되 서술자가 그 신성을 승인하는 것으로 만들지 않았습니다.
  alternative_readings:
  - 따옴표나 각주로 거리를 더 두기
  - ‘소위 네 신’처럼 해설적으로 처리하기
  rationale: 히브리어는 단순히 상대의 논증을 보고하므로, 해석을 덧붙여 본문의 수사적 힘을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: Affirmations; translation philosophy §1 and §3
