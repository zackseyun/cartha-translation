  source_fidelity: 개정이 필요합니다. 초안의 ‘곡식 밭에 놓아’는 횃불을 밭에 놓은 것으로 읽히기 쉬우나, 히브리어 וַיְשַׁלַּח는 앞절의 동물들을 풀어 보낸 행동을 가리킵니다. 또한 בְּקָמוֹת은 일반적인 ‘곡식 밭’보다 ‘서 있는 곡식 가운데’를 뜻합니다. מִגָּדִישׁ은 ‘곡식 단’이라기보다 수확하여 쌓아 둔 곡식 더미/곡식 쌓은 것에 가깝습니다.
  naturalness: ‘그것들을 … 풀어 놓아’는 앞절의 선행사를 자연스럽게 이어 주며, 현대 표준어 합쇼체로 읽힙니다. ‘올리브 과수원’은 כֶּרֶם זָיִת의 재배지를 자연스럽고 구체적으로 나타냅니다.
  terminology: 고유명사 פְּלִשְׁתִּים은 표준 성경 한국어 용례에 맞추어 ‘블레셋 사람들’로 고칩니다. 농경 용어는 ‘서 있는 곡식’과 ‘곡식 더미’를 구별하여 원문의 대조를 보존합니다.
