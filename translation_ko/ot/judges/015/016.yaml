source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֔וֹן בִּ/לְחִ֣י הַ/חֲמ֔וֹר חֲמ֖וֹר חֲמֹרָתָ֑יִם בִּ/לְחִ֣י הַ/חֲמ֔וֹר הִכֵּ֖יתִי אֶ֥לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/016.yaml
  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
  footnotes:
  - marker: a
    text: 'Hebrew uses a wordplay: the same consonants behind ''donkey'' sound like the term rendered ''heaps.'' Traditional renderings such as ''a heap, two heaps'' attempt to preserve the pun more literally.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 삼손이 말했습니다. 「당나귀의 턱뼈로—한 무더기, 두 무더기—당나귀의 턱뼈로 내가 천 명을 쳐죽였습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '당나귀'와 비슷한 자음 배열을 가진 '무더기/더미' 계열 단어를 사용한 말장난을 담고 있습니다. 한국어 본문에서는 의미를 살리고, 장난의 효과는 이 주석으로 보완했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 이때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속으로 이어지는 서술 진행을 한국어의 자연스러운 순서 표현으로 옮겼습니다.
- source_word: בִּלְחִי הַחֲמוֹר
  english_pob_choice: With the jawbone of a donkey
  chosen_korean: 당나귀의 턱뼈로
  alternatives_korean:
  - 당나귀의 턱뼈로써
  - 당나귀 턱뼈로
  lexicon: HALOT
  rationale: בְּ는 도구를 나타내므로 한국어 조사 '로'로 옮겼고, לְחִי는 무기로 쓰인 '턱뼈'의 뜻을 살렸습니다.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  english_pob_choice: a heap, two heaps
  chosen_korean: 한 무더기, 두 무더기
  alternatives_korean:
  - 무더기, 두 무더기
  - 한 더미, 두 더미
  lexicon: HALOT
  rationale: 히브리어의 말장난을 보존하면서도 한국어에서 의미가 통하는 '무더기'를 택해, 당나귀와 음이 겹치는 장난은 주석으로 처리하는 편이 가장 투명합니다.
- source_word: הִכֵּיתִי
  english_pob_choice: I have struck down
  chosen_korean: 내가 쳐죽였습니다
  alternatives_korean:
  - 내가 쳤습니다
  - 내가 쳐부수었습니다
  lexicon: HALOT
  rationale: נכה의 기본값인 '치다/쳐서 쓰러뜨리다'를 유지하되, 문맥상 죽음에 이른 승전 선언이므로 결과를 드러내는 '쳐죽였습니다'가 가장 직접적입니다.
theological_decisions:
- issue: 전투 승전 선언의 과장된 시적 말투
  chosen_reading: 본문의 반복과 병렬을 시적 승전 외침으로 그대로 살리고, 현대 한국어에서도 구호처럼 들리도록 처리했습니다.
  alternative_readings:
  - 평이한 서술문으로 완화함
  - 의미를 풀어 설명함
  rationale: 이 절은 정보 전달보다 승리의 외침과 운율이 핵심이므로, 문장의 압축성과 반복을 보존하는 편이 저자의 의도에 가깝습니다.
  doctrine_reference: 문학적 장르와 본문 수사 보존
- issue: '''일천 명''의 군사적 의미'
  chosen_reading: '''천 명''을 그대로 유지하여 수량과 전과를 직접적으로 드러냈습니다.'
  alternative_readings:
  - '''많은 사람''으로 완화함'
  - '''천 사람''으로 중화함'
  rationale: 히브리어 אֶלֶף אִישׁ는 수량을 분명히 말하므로, 과장처럼 느껴지더라도 숫자를 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 원문 수사와 수량 보존
