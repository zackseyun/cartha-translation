  source_fidelity: 히브리어의 사건 순서와 핵심 어휘는 대체로 충실히 반영했습니다. 그러나 טְרִיָּה를 본문에서 ‘새’로 옮기면 한국어에서 ‘new’로만 읽히기 쉽고, 각주의 대안도 본문과 동일하여 원문의 ‘신선한/아직 마르지 않은’과 ‘새로운’ 사이의 어휘적 여지를 제대로 제시하지 못합니다. 또한 נכה는 문맥상 치명적 결과를 시사하지만, 동사 자체를 ‘쳐죽였습니다’로 단정하기보다 ‘쳐서 쓰러뜨렸습니다’가 ‘struck down’ 및 원문의 표현 범위에 더 가깝습니다.
  naturalness: ‘나귀의 새 턱뼈’는 현대 한국어에서 다소 어색하고 ‘새로 만든 턱뼈’처럼 들릴 수 있습니다. ‘아직 마르지 않은 나귀 턱뼈’는 무기로 쓰인 뼈의 상태를 자연스럽고 구체적으로 전달합니다. ‘손을 내밀어 그것을 잡아’는 가능하지만 ‘손을 내밀어 그것을 집어 들고’가 서술 흐름에 더 자연스럽습니다.
  terminology: ‘나귀’와 ‘턱뼈’는 לְחִי חֲמוֹר에 적절합니다. טְרִיָּה의 본문 번역은 ‘아직 마르지 않은’으로 하고, ‘새’는 각주 대안으로 남기는 것이 적절합니다. 폭력 행위는 원문이 직접 사용하는 ‘치다’의 의미를 유지하면서 문맥상 결과를 ‘쳐서 쓰러뜨렸습니다’로 표현합니다.
