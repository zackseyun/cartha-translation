    reason: lexical_alternative
lexical_decisions:
- source_word: לְחִי חֲמוֹר
  english_pob_choice: jawbone of a donkey
  chosen_korean: 나귀의 턱뼈
  alternatives_korean:
  - 나귀의 턱뼈
  - 나귀의 턱
  - 당나귀의 턱뼈
  lexicon: HALOT
  rationale: לְחִי는 여기서 실제 무기로 쓰이는 턱뼈를 가리키므로, 자연스러운 현대 한국어로는 ‘턱뼈’가 가장 직접적입니다.
- source_word: טְרִיָּה
  english_pob_choice: fresh
  chosen_korean: 새
  alternatives_korean:
  - 새
  - 신선한
  - 아직 마르지 않은
  lexicon: HALOT
  rationale: 형용사 טְרִיָּה의 핵심은 ‘새로 얻은/마르지 않은’ 상태이므로, 간결하게 ‘새’로 옮기면 문맥상 유효한 ‘fresh’의 뉘앙스를 살릴 수 있습니다.
- source_word: וַיַּךְ בָּהּ
  english_pob_choice: with it he struck down
  chosen_korean: 그것으로 천 명을 쳐죽였습니다
  alternatives_korean:
  - 그것으로 천 명을 쳤습니다
  - 그것으로 천 명을 죽였습니다
  - 그것으로 천 명을 쳐눕혔습니다
  lexicon: HALOT
  rationale: נכה는 단순 타격보다 전투 맥락에서 치명적 결과를 포함할 수 있으므로, 영어 POB의 ‘struck down’을 반영해 ‘쳐죽였습니다’로 번역했습니다.
theological_decisions:
- issue: 전투 서술에서 הנכה의 결과를 어떻게 한국어로 드러낼지
  chosen_reading: ‘쳐죽였습니다’로 옮겨 실제로 상대를 쓰러뜨리는 치명성을 분명히 했습니다.
  alternative_readings:
  - ‘쳤습니다’
  - ‘쳐눕혔습니다’
  rationale: 이 절은 삼손의 승리를 강조하는 서술이므로, 단순한 타격보다 결과를 드러내는 번역이 원문의 내러티브 힘을 더 잘 전달합니다.
  doctrine_reference: 본문 내 서술적 강조
