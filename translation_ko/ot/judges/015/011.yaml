revisions:
- from: 그러자 유다의 삼천 명이 에담 바위의 갈라진 틈으로 내려가 삼손에게 말했습니다. 「블레셋 사람이 우리를 지배하고 있는 줄을 알지 못하느냐? 그런데 어찌하여 이런 일을 우리에게 저질렀느냐?」 삼손이 그들에게 말했습니다. 「그들이 내게 한 그대로, 나도 그들에게 했습니다.」[a]
  to: 그러자 유다 사람 삼천 명이 에담 바위의 갈라진 틈[a]으로 내려가 삼손에게 말했습니다. “블레셋 사람들이 우리를 지배하고 있는 줄을 알지 못하느냐? 우리에게 이런 일을 한 것이냐?” 삼손이 그들에게 말했습니다. “그들이 내게 한 그대로 나도 그들에게 했습니다.”
  rationale: The revision removes added causal and condemnatory force from Judah’s question, retains the Hebrew complaint’s ambiguity, makes the counted male group explicit in idiomatic Korean, and moves the lexical footnote anchor to the expression it explains. No theological interpretation has been added to Samson’s statement.
