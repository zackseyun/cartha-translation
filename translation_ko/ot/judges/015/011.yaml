review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the descent, the number, Philistine rule, the complaint’s reference to consequences borne by Judah, and Samson’s reciprocal reply. However, ‘어찌하여’ changes the Hebrew’s ‘what is this ...?’ complaint into a direct question about motive, and ‘저질렀느냐’ adds a stronger condemnatory nuance than עָשִׂיתָ (‘you have done’).
  naturalness: The Korean is generally clear and appropriately formal-polite. ‘우리에게 이런 일을 하였느냐?’ is more natural and source-close than ‘어찌하여 이런 일을 우리에게 저질렀느냐?’ in this context. The alternative-reading footnote should be anchored to the topographical expression it concerns, not at the end of Samson’s speech.
  terminology: ‘블레셋 사람’, ‘삼손’, ‘유다’, and ‘에담’ are appropriate. ‘유다 사람 삼천 명’ makes the source’s explicit male-person designation clearer than the potentially broader ‘유다의 삼천 명.’ ‘에담 바위의 갈라진 틈’ adequately represents the cleft of the rock of Etam.
  issues:
  - severity: medium
    issue: The rendering ‘어찌하여 이런 일을 우리에게 저질렀느냐?’ introduces a causal ‘why’ question and the evaluative verb ‘commit/perpetrate.’
    rationale: וּמַה זֹּאת עָשִׂיתָ לָּנוּ is literally, ‘And what is this that you have done to us?’ It expresses their complaint without explicitly asking Samson’s motive or using a morally intensified verb.
  - severity: low
    issue: Footnote marker [a] is placed after Samson’s final speech rather than after ‘에담 바위의 갈라진 틈.’
    rationale: The footnote supplies a lexical alternative for סְעִיף, the topographical term, so its anchor should immediately follow that expression.
  - severity: low
    issue: ‘유다의 삼천 명’ is somewhat less explicit than the source regarding the group as men.
    rationale: אִישׁ in the counted expression identifies the group as male persons; ‘유다 사람 삼천 명’ is natural Korean and retains this specification.
  revised_text: 그러자 유다 사람 삼천 명이 에담 바위의 갈라진 틈[a]으로 내려가 삼손에게 말했습니다. “블레셋 사람들이 우리를 지배하고 있는 줄을 알지 못하느냐? 우리에게 이런 일을 한 것이냐?” 삼손이 그들에게 말했습니다. “그들이 내게 한 그대로 나도 그들에게 했습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘에담 바위의 틈새’로 옮길 수 있습니다.
    reason: סְעִיף의 지형어적 의미에 대한 어휘적 대안입니다.
  revision_rationale: The revision removes added causal and condemnatory force from Judah’s question, retains the Hebrew complaint’s ambiguity, makes the counted male group explicit in idiomatic Korean, and moves the lexical footnote anchor to the expression it explains. No theological interpretation has been added to Samson’s statement.
