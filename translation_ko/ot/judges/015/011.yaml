source:
  edition: WLC
  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
  footnotes:
  - marker: a
    text: Or 'fissure of the rock of Etam.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 유다 사람 삼천 명이 에담 바위의 갈라진 틈[a]으로 내려가 삼손에게 말했습니다. “블레셋 사람들이 우리를 지배하고 있는 줄을 알지 못하느냐? 우리에게 이런 일을 한 것이냐?” 삼손이 그들에게 말했습니다. “그들이 내게 한 그대로 나도 그들에게 했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에담 바위의 틈새’로 옮길 수 있습니다.
    reason: סְעִיף의 지형어적 의미에 대한 어휘적 대안입니다.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  english_pob_choice: went down
  chosen_korean: 내려가
  alternatives_korean:
  - 갔습니다
  - 내려왔습니다
  lexicon: HALOT
  rationale: ירד의 기본 의미인 아래로의 이동을 살려 지형적 하강을 자연스럽게 표현했습니다.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  english_pob_choice: three thousand men of Judah
  chosen_korean: 유다의 삼천 명
  alternatives_korean:
  - 유다 사람 삼천 명
  - 유다에서 온 삼천 명
  lexicon: HALOT
  rationale: ‘삼천 명’이라는 계수 구조를 간결하게 유지하고, מִיהוּדָה는 소속을 나타내는 ‘유다의’로 옮겼습니다.
- source_word: סְעִיף סֶלַע עֵיטָם
  english_pob_choice: the cleft of the rock of Etam
  chosen_korean: 에담 바위의 갈라진 틈
  alternatives_korean:
  - 에담 바위의 갈라진 갈라짐
  - 에담 바위의 틈새
  lexicon: HALOT
  rationale: סְעִיף의 ‘갈라진 틈/분기된 틈’ 의미를 살리고, סֶלַע는 이 지형 문맥에서 ‘바위’로 옮겨 자연스러운 한국어 지명구를 만들었습니다.
- source_word: מֹשְׁלִים בָּנוּ
  english_pob_choice: are ruling over us
  chosen_korean: 우리를 지배하고 있는
  alternatives_korean:
  - 우리 위에 다스리고 있는
  - 우리의 통치자 노릇을 하고 있는
  lexicon: HALOT
  rationale: מֹשְׁלִים의 진행적 지배/통치를 한국어 현재 진행으로 살려 압박적 통치의 뉘앙스를 보존했습니다.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  english_pob_choice: As they did to me, so I have done to them
  chosen_korean: 그들이 내게 한 그대로, 나도 그들에게 했습니다
  alternatives_korean:
  - 그들이 내게 한 것처럼, 나도 그들에게 했습니다
  - 그들이 내게 했듯이, 나도 그들에게 했습니다
  lexicon: HALOT
  rationale: 대응 구조와 보복의 간결한 진술을 살리면서, 완곡한 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: 삼손의 답변에 대한 평가를 번역문이 미리 해석할지 여부
  chosen_reading: 서술형 진술로만 두어 정당화나 비난을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘정당하게 갚아 준 것’처럼 해석을 덧붙임
  - ‘개인적 복수’라는 평가를 암시함
  rationale: 본문은 삼손의 이유를 보고할 뿐 그 도덕적 판정을 직접 제시하지 않으므로, 신학적 긴장을 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
