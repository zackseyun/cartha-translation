review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Judah's collective speakers and the retaliatory purpose. However, '우리를 치러' makes the hostile implication of עָלָה עַל explicit as an attack, whereas the Hebrew more literally says they 'came up against' Judah. More significantly, '삼손을 우리에게 결박하여' incorrectly makes 'us' the complement of 'bind'; the Hebrew says 'to bind Samson,' followed by a separate 'to do to him as he did to us.'
  naturalness: The proposed revision uses natural contemporary standard Korean and formal-polite direct speech. It also avoids the archaic mixed register of '이르되/함이니라 하니라,' which does not match the specified modern 합쇼체 target.
  terminology: '''유다 사람들'' appropriately renders the collective singular איש יהודה. ''삼손'' is the standard Korean form. ''묶고'' faithfully conveys לאסור without importing a more specific legal or punitive sense.'
  issues:
  - severity: medium
    issue: '''우리를 치러 올라왔느냐'' overstates the first question.'
    rationale: עלה על denotes coming/going up against and has an adversarial context, but it does not itself explicitly state 'attack.' '우리에게 맞서 올라오다' preserves the adversative force without narrowing it to an overt attack.
  - severity: high
    issue: '''삼손을 우리에게 결박하여'' misattaches the pronoun ''our/us'' to the act of binding.'
    rationale: The first infinitive is simply 'to bind Samson.' The following 'to do to him just as he did to us' supplies the respective objects. The draft can imply binding Samson to or for Judah.
  - severity: low
    issue: The draft's narration and dialogue use an archaic, non-uniform register despite the requested modern formal-polite style.
    rationale: Modern reporting verbs and quotation speech in 합쇼체 better meet the target-language specification while retaining the source's direct-speech structure.
  revised_text: 유다 사람들이 말했습니다. “왜 우리에게 맞서 올라오셨습니까?” 그러자 그들이 대답했습니다. “우리는 삼손을 묶고, 그가 우리에게 한 그대로 그에게 하려고 올라왔습니다.”
  revised_footnotes: []
