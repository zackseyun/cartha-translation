  to: 유다 사람들이 말했습니다. “왜 우리에게 맞서 올라오셨습니까?” 그러자 그들이 대답했습니다. “우리는 삼손을 묶고, 그가 우리에게 한 그대로 그에게 하려고 올라왔습니다.”
