  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
  footnotes:
  - marker: a
    text: En-hakkore likely means 'Spring of the Caller' or 'Spring of the one who called,' referring to Samson's cry to God.
    reason: lexical_alternative
  - marker: b
    text: Or, according to another reading of the scene, 'God split open the hollow in the jawbone, and water came out of it.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 하나님께서 레히에 있는 그 웅덩이를 가르셨고, 거기에서 물이 나왔습니다. 그가 마시자 그의 영이 돌아오고 그가 소생하였습니다. 그래서 그는 그 샘의 이름을 엔학고레[a]라 불렀는데, 그것이 오늘날까지 레히에 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 엔학고레는 아마도 '부르는 자의 샘' 또는 '부르짖은 자의 샘'이라는 뜻이며, 삼손이 하나님께 부르짖은 장면을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 다른 읽기에서는 '하나님께서 레히의 턱뼈에 있는 웅덩이를 가르셨고, 거기에서 물이 나왔다'고 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְקַע / split open
  english_pob_choice: split open
  chosen_korean: 가르셨고
  alternatives_korean:
  - 열어젖히셨고
  - 쪼개셨고
  lexicon: HALOT
  rationale: 물길이 나오는 강한 분열 동작을 한국어로 압축하면서도, 단순한 '열다'보다 더 힘 있는 동작을 나타내기 위해 '가르다'를 택했습니다.
- source_word: הַמַּכְתֵּשׁ / the hollow place
  english_pob_choice: the hollow place
  chosen_korean: 그 웅덩이
  alternatives_korean:
  - 그 빈 곳
  - 그 함몰된 곳
  lexicon: HALOT
  rationale: 문맥상 물이 솟는 지형적 움푹한 곳을 가리키므로, household-object 느낌의 '절구' 계열보다 지형을 드러내는 '웅덩이'가 더 자연스럽습니다.
- source_word: רוּחוֹ / his spirit
  english_pob_choice: his spirit returned
  chosen_korean: 그의 영이 돌아오고
  alternatives_korean:
  - 그의 숨이 돌아오고
  - 그의 기운이 돌아오고
  lexicon: HALOT
  rationale: רוּחַ는 '영/숨/기운'의 범위를 가지지만, 본문은 쇠약 후 생명력의 회복을 말하므로 '영'을 기본으로 하되 한국어에서도 생동감을 살렸습니다.
- source_word: וַיֶּחִי / he revived
  english_pob_choice: he revived
  chosen_korean: 그가 소생하였습니다
  alternatives_korean:
  - 그가 회복하였습니다
  - 그가 다시 살아났습니다
  lexicon: HALOT
  rationale: 죽음에서의 부활이 아니라 기력이 되돌아오는 회복을 뜻하므로, 의료적 회복 뉘앙스가 있는 '소생하다'가 적절합니다.
- source_word: עֵין הַקּוֹרֵא / En-hakkore
  english_pob_choice: En-hakkore
  chosen_korean: 엔학고레
  alternatives_korean:
  - 엔하코레
  - 부르짖는 자의 샘
  lexicon: HALOT
  rationale: 고유명사는 음역을 유지하고, 의미는 주석으로 보완하는 방식이 원문의 이름 짓기 기능을 보존합니다.
theological_decisions:
- issue: בַּלֶּחִי의 지시 대상
  chosen_reading: 본문은 레히를 장소명으로 두고, 물이 나온 곳을 레히에 있는 웅덩이로 표현했습니다.
  alternative_readings:
  - 턱뼈의 웅덩이
  - 레히의 턱뼈 속 빈 곳
  rationale: 마지막의 '오늘날까지 레히에'가 지리적 표지를 분명히 하므로, 본문 흐름을 따라 장소명으로 읽는 것이 자연스럽습니다. 다만 다른 이해 가능성은 주석으로 남겼습니다.
  doctrine_reference: 본문 해석/지리적 지시
