  text: וַ/יֹּ֣אמֶר אָבִ֗י/הָ אָמֹ֤ר אָמַ֨רְתִּי֙ כִּי שָׂנֹ֣א שְׂנֵאתָ֔/הּ וָ/אֶתְּנֶ֖/נָּה לְ/מֵרֵעֶ֑/ךָ הֲ/לֹ֨א אֲחֹתָ֤/הּ הַ/קְּטַנָּה֙ טוֹבָ֣ה מִמֶּ֔/נָּה תְּהִי נָ֥א לְ/ךָ֖ תַּחְתֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
  footnotes:
  - marker: a
    text: Or “to your friend”; the Hebrew term can refer broadly to an associate or companion, and in this wedding context some understand it as the man who attended Samson as his companion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지가 말했습니다[a], “내가 정말로 네가 그를 완전히 미워하는 줄 알았기 때문에 그를 네 동무에게 주었습니다. 그의 여동생이 그보다 낫지 않습니까? 이제 그녀를 그의 대신 네 아내로 삼으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 친구에게’; 히브리어 מֵרֵעַ는 넓게는 동료나 동반자를 가리킬 수 있으며, 이 혼인 맥락에서는 삼손의 동무를 뜻한다고 보는 이들도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיהָ
  english_pob_choice: her father
  chosen_korean: 그의 아버지
  alternatives_korean:
  - 그녀의 아버지
  - 그 여자아이의 아버지
  lexicon: HALOT
  rationale: 문맥상 앞선 여인을 가리키는 소유격이지만, 한국어에서는 이어지는 대화의 주어를 자연스럽게 살려 ‘그의 아버지’로 옮기면 문장 흐름이 더 매끄럽습니다.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  english_pob_choice: you utterly hated her
  chosen_korean: 네가 그를 완전히 미워하는
  alternatives_korean:
  - 네가 그를 몹시 미워하는
  - 네가 그를 정말 미워하는
  lexicon: HALOT
  rationale: 히브리어의 강조용 부정사절+완료형 중첩을 ‘완전히 미워하는’으로 옮겨 강한 강조를 유지했습니다.
- source_word: לְמֵרֵעֶךָ
  english_pob_choice: to your companion
  chosen_korean: 네 동무에게
  alternatives_korean:
  - 네 친구에게
  - 네 동반자에게
  lexicon: HALOT
  rationale: מֵרֵעַ는 친구보다 넓은 ‘동료/동무/동반자’의 뜻이 있어, 결혼 맥락의 특정 역할을 과도하게 좁히지 않는 ‘동무’가 적절합니다.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  english_pob_choice: her younger sister
  chosen_korean: 그의 여동생
  alternatives_korean:
  - 그녀의 어린 동생
  - 그녀의 막내 동생
  lexicon: HALOT
  rationale: 문맥상 자매 관계이므로 ‘여동생’이 가장 자연스럽고, הַקְּטַנָּה의 연소함도 기본적으로 포함합니다.
- source_word: תְּהִי נָא לְךָ תַּחְתֶּיהָ
  english_pob_choice: Please let her be yours instead of her
  chosen_korean: 이제 그녀를 그의 대신 네 아내로 삼으십시오
  alternatives_korean:
  - 부디 그녀를 그녀 대신 네 사람으로 삼으십시오
  - 그녀를 대신하여 네게 속하게 하십시오
  lexicon: HALOT
  rationale: נָא의 청유성과 תַּחַת의 대체 의미를 살리되, 한국어에서는 관계 맥락이 분명하도록 ‘아내로 삼으십시오’로 구체화했습니다. 다만 원문에 없는 결혼 용어를 덧붙이는 긴장을 줄이기 위해 직역형도 검토했습니다.
theological_decisions:
- issue: 대화체의 공손함과 청유 표현
  chosen_reading: 아버지의 말은 정중한 요청이므로, 본문 전체를 합쇼체로 유지하고 청유는 ‘삼으십시오’로 처리했습니다.
  alternative_readings:
  - 중립적 명령형으로 옮김
  - 더 완곡한 ‘받아 주십시오’로 옮김
  rationale: 히브리어의 나(נָא)와 청유형은 단순 명령보다 완곡한 요청에 가깝기 때문에, 한국어에서도 공손한 요청체를 유지하는 것이 적절합니다.
  doctrine_reference: 역할 화행의 문체 보존
