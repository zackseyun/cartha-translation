  to: 그 여자의 아버지가 말했습니다. “내가 네가 그 여자를 몹시 미워한다고 정말 생각했기 때문에, 그 여자를 네 친구에게[a] 주었습니다. 그 여자의 여동생이 그 여자보다 낫지 않습니까? 부디 그 여동생을 그 여자 대신 네게 주십시오.”
