  - 블레셋 사람들 가운데의
  lexicon: HALOT
  rationale: 민족명은 현대 한국어 성경 관용에 맞게 ‘블레셋 사람들’로 옮기되, 소유격 구조를 유지해 원문의 ‘~의 시대’와 연결했습니다.
theological_decisions:
- issue: שׁפט의 범위
  chosen_reading: ‘판사로 재판했다’로 좁히지 않고 사사로서의 통치·지도 기능을 포괄하는 ‘다스렸습니다’로 옮겼습니다.
  alternative_readings:
  - 판단했습니다
  - 재판했습니다
  - 인도했습니다
  rationale: 이 문맥은 사사기의 요약 공식이므로, משפט의 법정적 의미만 남기면 본문의 인물상과 책 전체의 반복 용례가 약해집니다. ‘다스리다’는 사사로서의 공적 역할을 한국어로 가장 균형 있게 드러냅니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; consistency of key terms'
