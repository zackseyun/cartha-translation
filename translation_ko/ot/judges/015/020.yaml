translation:
  language: ko
  text: 그는 블레셋 사람들의 시대에 이스라엘을 이십 년 동안 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이십 년 동안 이스라엘을 이끌었다’로도 옮길 수 있습니다. 히브리어 동사는 재판 행위만이 아니라 더 넓은 통치 활동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  english_pob_choice: judged
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 판단하셨습니다
  - 재판하셨습니다
  - 지도했습니다
  lexicon: HALOT
  rationale: 삿기에서 שׁפט는 단순한 재판 행위보다 사사로서의 통치·지도 기능까지 포괄하므로, 한국어에서는 그 넓은 기능을 자연스럽게 담는 ‘다스리다’가 가장 적절합니다.
- source_word: אֶת יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘을
  alternatives_korean:
  - 이스라엘 백성을
  - 이스라엘 사람들을
  lexicon: HALOT
  rationale: 직접목적어가 고유명사 ‘이스라엘’이므로, 고유명사 형태를 유지해 원문 구조를 그대로 살렸습니다.
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: ~의 시대에
  alternatives_korean:
  - ~ 동안
  - ~의 때에
  - ~ 시대에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 자연스럽게 풀어, 단순한 시간표시보다 역사적 국면을 나타내는 뉘앙스를 살렸습니다.
- source_word: פְלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들의
  alternatives_korean:
  - 블레셋의
  - 블레셋 사람들 가운데의
  lexicon: HALOT
  rationale: 민족명은 현대 한국어 성경 관용에 맞게 ‘블레셋 사람들’로 옮기되, 소유격 구조를 유지해 원문의 ‘~의 시대’와 연결했습니다.
theological_decisions:
- issue: שׁפט의 범위
  chosen_reading: ‘판사로 재판했다’로 좁히지 않고 사사로서의 통치·지도 기능을 포괄하는 ‘다스렸습니다’로 옮겼습니다.
  alternative_readings:
  - 판단했습니다
  - 재판했습니다
  - 인도했습니다
  rationale: 이 문맥은 사사기의 요약 공식이므로, משפט의 법정적 의미만 남기면 본문의 인물상과 책 전체의 반복 용례가 약해집니다. ‘다스리다’는 사사로서의 공적 역할을 한국어로 가장 균형 있게 드러냅니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; consistency of key terms'
