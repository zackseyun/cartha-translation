  source_fidelity: 히브리어 וַיִּשְׁפֹּט은 사사기의 반복 요약 표현으로, 법정에서 재판했다는 좁은 뜻보다 이스라엘의 사사로서 행사한 지도·통치 기능을 가리킵니다. 초안의 ‘다스렸습니다’는 그 범위를 대체로 전달하지만, 핵심 용어인 ‘사사’를 전혀 드러내지 않아 책의 용례와 원문의 표현을 다소 평평하게 만듭니다. בִּימֵי פְלִשְׁתִּים은 블레셋 사람들이 활동하거나 우세하던 시기를 가리키며, ‘블레셋 사람들의 시대’는 한국어에서 다소 부자연스럽고 지나치게 넓은 역사 시대를 암시할 수 있습니다.
  naturalness: ‘블레셋 사람들이 있던 때에’는 현대 한국어로 자연스럽고, 원문의 시간 표현을 과도하게 해석하지 않습니다. ‘사사로 다스렸습니다’는 합쇼체 문체에 맞으며, 사사의 직무와 다스림의 넓은 의미를 함께 드러냅니다.
  terminology: ‘사사’는 Judges의 שׁפט 계열을 한국어 성경 독자가 인식할 수 있도록 하는 핵심 용어입니다. ‘이스라엘’과 ‘블레셋 사람들’은 표준적인 명칭입니다. 각주도 본문의 ‘사사로 다스렸다’에 맞추어, 이 동사가 재판에 한정되지 않는다는 점을 밝혀야 합니다.
