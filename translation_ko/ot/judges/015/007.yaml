  verdict: revise
  source_fidelity: The draft correctly identifies Samson as speaker and conveys retaliation followed by cessation, but '너희를 갚고' is not idiomatic Korean for taking vengeance on someone and can obscure the Hebrew נִקַּמְתִּי בָכֶם ('I take vengeance on you'). The emphatic/oath-like force of כִּי אִם is also left underrepresented.
  naturalness: The draft uses archaic narrative and speech forms ('이르되', '그치리라 하니라') rather than the requested modern formal-polite 합쇼체. The revised wording is natural modern Korean while retaining the direct, forceful speech.
  terminology: '''복수하다'' appropriately renders the personal retaliatory sense here without importing a doctrinal interpretation. ''반드시'' represents the emphatic force without over-specifying the debated oath-formula nuance.'
  issues:
  - severity: medium
    issue: The expression '너희를 갚고' is semantically and idiomatically inadequate.
    rationale: In contemporary Korean, one repays a debt or favor 'to/for' someone; for vengeance against persons, '너희에게 복수하다' is clear and directly reflects the Hebrew preposition בְּ ('against/on you').
  - severity: medium
    issue: Register is not modern formal-polite 합쇼체.
    rationale: The requested target variant calls for forms such as '말했습니다' and '그치겠습니다,' not archaic '-되/-리라 하니라.'
  - severity: low
    issue: The Hebrew emphatic construction is not expressed.
    rationale: '''반드시'' conveys the force of כִּי אִם while avoiding a stronger interpretive expansion than the source requires.'
