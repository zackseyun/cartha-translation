id: JDG.15.13
reference: Judges 15:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ לֵ/אמֹ֗ר לֹ֚א כִּֽי אָסֹ֤ר נֶֽאֱסָרְ/ךָ֙ וּ/נְתַנּ֣וּ/ךָ בְ/יָדָ֔/ם וְ/הָמֵ֖ת לֹ֣א נְמִיתֶ֑/ךָ וַ/יַּאַסְרֻ֗/הוּ בִּ/שְׁנַ֨יִם֙ עֲבֹתִ֣ים חֲדָשִׁ֔ים וַֽ/יַּעֲל֖וּ/הוּ מִן הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
  footnotes:
  - marker: a
    text: Or “deliver you into their power.” The Hebrew idiom is literally “hand you over into their hand.”
    reason: lexical_alternative
  - marker: b
    text: Or “from the crag/cliff.” Hebrew סלע can refer to a rocky height or crag, not only a single rock.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그에게 말했습니다. 「아니라, 우리는 너를 반드시 묶어 그들의 손에 넘겨주겠지만, 너를 죽이지는 않겠다.」 그래서 그들은 두 개의 새 밧줄로 그를 묶고 그를 바위에서 끌어올렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 “그들의 손 안에”입니다.
    reason: source_note
  - marker: b
    text: סלע는 여기서 단일한 바위뿐 아니라 바위 지대나 바위턱을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  english_pob_choice: No, but
  chosen_korean: 아니라
  alternatives_korean:
  - 아니요, 그러나
  - 아니요, 대신
  lexicon: HALOT
  rationale: 부정 뒤의 정정을 나타내는 대응으로, 한국어에서는 간결한 「아니라」가 대조를 가장 자연스럽게 살립니다.
- source_word: אָסֹר נֶאֱסָרְךָ
  english_pob_choice: we will surely bind you
  chosen_korean: 너를 반드시 묶어
  alternatives_korean:
  - 너를 확실히 묶어
  - 너를 단단히 묶어
  lexicon: HALOT
  rationale: 히브리어의 강조형을 한국어 부사 「반드시」로 옮겨 결의와 확실성을 살렸습니다.
- source_word: וּנְתַנּוּךָ בְיָדָם
  english_pob_choice: hand you over into their hand
  chosen_korean: 그들의 손에 넘겨주겠지만
  alternatives_korean:
  - 그들의 권세 아래 넘겨주겠지만
  - 그들의 손안에 넘겨주겠지만
  lexicon: HALOT
  rationale: 직역 이미지인 「손」을 보존하되, 한국어에서는 「넘겨주다」가 관용적 의미를 가장 분명히 전달합니다.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  english_pob_choice: with two new ropes
  chosen_korean: 두 개의 새 밧줄로
  alternatives_korean:
  - 두 개의 새 줄로
  - 두 개의 새 동아줄로
  lexicon: HALOT
  rationale: עֲבֹתִים은 굵은 줄/밧줄을 가리키므로 현대 한국어에서는 「밧줄」이 가장 적절하며, 「새」로 ‘new’의 서술적 의미를 살렸습니다.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  english_pob_choice: brought him up from the rock
  chosen_korean: 그를 바위에서 끌어올렸습니다
  alternatives_korean:
  - 그를 바위에서 데려올렸습니다
  - 그를 바위에서 끌어냈습니다
  lexicon: HALOT
  rationale: העלה의 상향 이동을 「끌어올리다」로 자연스럽게 반영했고, סלע는 문맥상 특정 지형물보다 일반적인 「바위」가 무난합니다.
theological_decisions:
- issue: 직접화법의 어조
  chosen_reading: 직접화법은 공적인 결의에 가까운 단정적 어조로 옮겼습니다.
  alternative_readings:
  - 더 구어적인 약속체
  - 더 강한 협박조
  rationale: 본문은 삼손을 넘겨주려는 집단의 합의 진술이므로, 과장하지 않되 결의의 단호함을 드러내는 합쇼체가 적절합니다.
  doctrine_reference: 본문 내 서사적 발화의 담화 기능
