  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
  footnotes:
  - marker: a
    text: Or 'I am innocent of the Philistines,' that is, 'I am free from blame in regard to the Philistines.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'do them evil.' Here 'harm' conveys hostile injury in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 삼손이 그들에게 말했습니다. “이번에는 내가 블레셋 사람들에게 해를 끼쳐도[b] 내게는 책임이 없습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 블레셋 사람들에 대하여 무죄다’, 곧 ‘블레셋 사람들에게 해를 끼치는 일에 대해 내게는 비난받을 책임이 없다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그들에게 악을 행한다’입니다. 여기서는 문맥상 ‘해를 끼치다’가 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And Samson said
  chosen_korean: 삼손이 말했습니다
  alternatives_korean:
  - 그리고 삼손이 말했습니다
  - 삼손이 그들에게 말했습니다
  lexicon: BHS/WLC narrative wayyiqtol
  rationale: 히브리어 서술 진행을 자연스럽게 옮기되, 한국어에서는 ‘그리고’보다 간결한 서술형이 더 자연스러워 ‘말했습니다’로 처리했습니다.
- source_word: נִקֵּיתִי
  english_pob_choice: I am blameless
  chosen_korean: 내가 … 책임이 없습니다
  alternatives_korean:
  - 내가 … 무죄입니다
  - 내가 … 결백합니다
  - 내가 … 책임이 없습니다
  lexicon: HALOT
  rationale: 문맥상 משפט적/도덕적 무죄 선언이라기보다 ‘그 일에 대해 내가 책임이 없다’는 자기 변호의 뜻이어서, 한국어로는 ‘책임이 없습니다’가 가장 분명합니다.
- source_word: מִפְּלִשְׁתִּים
  english_pob_choice: with respect to the Philistines
  chosen_korean: 블레셋 사람들에게
  alternatives_korean:
  - 블레셋 사람들에 대하여
  - 블레셋 사람들에게서
  lexicon: HALOT
  rationale: נקה와 결합한 מִן은 상대방에 대한 책임/비난의 면제를 나타내므로, 관계 표지를 살린 ‘블레셋 사람들에게’가 가장 자연스럽습니다.
- source_word: עֹשֶׂה אֲנִי ... רָעָה
  english_pob_choice: when I do them harm
  chosen_korean: 해를 끼쳐도
  alternatives_korean:
  - 그들에게 악을 행해도
  - 그들에게 해를 입혀도
  - 그들에게 해를 끼쳐도
  lexicon: HALOT
  rationale: רָעָה를 단순한 도덕적 ‘악’보다 구체적 피해인 ‘해’로 옮겨, 복수 행위의 폭력성을 드러냈습니다.
theological_decisions:
- issue: 삼손의 자기 선언을 어떻게 전달할 것인가
  chosen_reading: ‘내가 … 책임이 없습니다’로 옮겨, 삼손이 자신의 보복 행위를 정당화하는 발화를 드러냈습니다.
  alternative_readings:
  - ‘내가 … 무죄입니다’
  - ‘내가 … 결백합니다’
  rationale: 히브리어의 핵심은 삼손의 도덕적 자기평가보다 상대방에 대한 책임 면제 주장에 있으므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 문맥 해석(법적/도덕적 책임 진술)
