  lexicon: HALOT
  rationale: נכה의 폭력적 결과를 살려 단순한 ‘쳤다’보다 더 강한 ‘쳐부수다’로 옮겨, 문맥상의 격렬한 타격과 제압을 드러냈습니다.
- source_word: שׁוֹק עַל יָרֵךְ
  english_pob_choice: hip and thigh
  chosen_korean: 엉덩이와 넓적다리 사이로
