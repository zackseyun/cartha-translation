  - 큰 타격으로
  - 크게 무찌르고
  lexicon: HALOT
  rationale: מַכָּה가 단순한 ‘때림’보다 전투 문맥의 참패·대파를 뜻하는 점을 살려, 한국어에서 결과를 가장 분명히 드러내는 표현으로 옮겼습니다.
- source_word: בִּסְעִיף סֶלַע
  english_pob_choice: in the cleft of the rock
  chosen_korean: 에담 바위의 갈라진 틈에
  alternatives_korean:
  - 에담 바위의 틈새에
  - 에담 바위의 협곡에
  - 에담 반석의 갈라진 곳에
  lexicon: HALOT
  rationale: סעיף과 סלע의 지형적 이미지를 살려 ‘갈라진 틈’으로 옮기고, 고유지명 ‘에담’은 음역하여 장소성을 보존했습니다.
