  - 완전히
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 유지하되, 한국어에서 자연스럽게 읽히도록 ‘사이로’를 보탰고, 본문각주로 관용구 가능성을 남겼습니다.
- source_word: מַכָּה גְדוֹלָה
  english_pob_choice: with a great slaughter
  chosen_korean: 크게 쳐부수고
  alternatives_korean:
