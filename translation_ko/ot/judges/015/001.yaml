base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
  footnotes:
  - marker: a
    text: Or “into the chamber.” The Hebrew likely refers to an inner room; in context it implies the private marital room.
    reason: lexical_alternative
translation:
  language: ko
  text: 며칠 후, 곧 밀 수확기 동안에 삼손이 염소 새끼를 가지고 자기 아내를 찾아갔습니다. 그는 “내 아내에게, 그 안쪽 방으로 들어가게 하십시오”라고 말했습니다. 그러나 그녀의 아버지는 그가 들어가는 것을 허락하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안쪽 방’은 히브리어의 방/내실 표현을 옮긴 것으로, 문맥상 사적인 혼인 공간을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  english_pob_choice: And after some days
  chosen_korean: 며칠 후
  alternatives_korean:
  - 어느 날이 지난 뒤
  - 잠시 후
  lexicon: HALOT
  rationale: 시간 경과를 나타내는 관용구로, 한국어에서는 간결한 ‘며칠 후’가 자연스럽고 서술 흐름도 잘 살립니다.
- source_word: בִּימֵי קְצִיר חִטִּים
  english_pob_choice: in the days of the wheat harvest
  chosen_korean: 밀 수확기 동안에
  alternatives_korean:
  - 밀 추수 기간에
  - 밀을 거두는 때에
  lexicon: HALOT
  rationale: 계절 표지를 한국어로 자연스럽게 옮기되, 곡식의 종류는 ‘밀’로 구체화해 원문의 특정성을 살렸습니다.
- source_word: הֶחָדְרָה
  english_pob_choice: into the inner room
  chosen_korean: 그 안쪽 방으로
  alternatives_korean:
  - 그 내실로
  - 안쪽 방으로
  lexicon: HALOT
  rationale: 본문의 공간적 표현을 살리면서도 ‘침실’처럼 지나치게 특정하지 않도록 ‘안쪽 방’으로 옮겼습니다.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  english_pob_choice: But her father would not allow him to go in
  chosen_korean: 그가 들어가는 것을 허락하지 않았습니다
  alternatives_korean:
  - 그가 들어오게 두지 않았습니다
  - 그가 들어가도록 허용하지 않았습니다
  lexicon: HALOT
  rationale: 거절의 의미를 분명히 하되, 한국어에서는 ‘허락하지 않았습니다’가 가장 자연스럽고 문맥상 강한 제지를 드러냅니다.
