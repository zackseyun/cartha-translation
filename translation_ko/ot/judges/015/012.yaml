id: JDG.15.12
reference: Judges 15:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֶ/אֱסָרְ/ךָ֣ יָרַ֔דְנוּ לְ/תִתְּ/ךָ֖ בְּ/יַד פְּלִשְׁתִּ֑ים וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן הִשָּׁבְע֣וּ לִ֔/י פֶּֽן תִּפְגְּע֥וּ/ן בִּ֖/י אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: ko
  text: 그들이 그에게 말했습니다. “우리가 내려온 것은 당신을 묶어 블레셋 사람들의 손에 넘기려는 것입니다.” 삼손이 그들에게 말했습니다. “너희 자신들이 나를 공격하지 않겠다고 내게 맹세하십시오.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “블레셋 사람들의 손에 너를 주려는 것이다”입니다.
    reason: source_note
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  english_pob_choice: to bind you
  chosen_korean: 당신을 묶어
  alternatives_korean:
  - 당신을 결박하여
  - 당신을 포박하여
  lexicon: אסר
  rationale: 히브리어 동사 אסר의 기본 의미는 '묶다/결박하다'이므로, 과도하게 군사적이거나 법정적인 뉘앙스를 덧씌우지 않는 '묶어'를 택했습니다.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  english_pob_choice: to hand you over into the hand of the Philistines
  chosen_korean: 블레셋 사람들의 손에 넘기려는 것입니다
  alternatives_korean:
  - 블레셋 사람들의 손에 넘겨주려는 것입니다
  - 블레셋 사람들의 권세 아래 넘기려는 것입니다
  lexicon: נתן + בְּיַד
  rationale: '''손에 넘기다''는 히브리어 관용구 בְּיַד의 통상적 지배/처분 관계를 자연스럽게 드러내며, POB의 ''hand you over into the hand of''를 충실히 반영합니다.'
- source_word: הִשָּׁבְעוּ לִי
  english_pob_choice: Swear to me
  chosen_korean: 내게 맹세하십시오
  alternatives_korean:
  - 나에게 맹세하십시오
  - 내게서 맹세하십시오
  lexicon: שׁבע
  rationale: שׁבע는 서약을 요구하는 표현이므로, 한국어 성경문맥에서 가장 직접적인 '맹세하십시오'로 옮겼습니다.
- source_word: פֶּן תִּפְגְּעוּן בִּי אַתֶּם
  english_pob_choice: that you yourselves will not attack me
  chosen_korean: 너희 자신들이 나를 공격하지 않겠다고
  alternatives_korean:
  - 너희가 나를 치지 않겠다고
  - 너희가 직접 나를 해치지 않겠다고
  lexicon: פגע
  rationale: פּגע는 '치다/해치다/공격하다'의 폭이 있어, 문맥상 사사기 15장의 폭력적 접촉을 분명히 하는 '공격하다'를 채택했고, '너희 자신들이'로 강조된 אַתֶּם을 살렸습니다.
theological_decisions:
- issue: 삼손의 요청이 단순한 안전 보장이 아니라 직접적 신체 공격 금지의 서약인지 여부
  chosen_reading: '''너희 자신들이 나를 공격하지 않겠다고''로 옮겨, 삼손이 최소한 그들의 직접 가해를 막기 위해 맹세를 요구하는 장면으로 읽었습니다.'
  alternative_readings:
  - '''너희가 나를 해치지 않겠다고'''
  - '''너희가 나에게 손을 대지 않겠다고'''
  rationale: 히브리어는 '너희 자신들이'를 강조하면서 פגע 동사를 사용하므로, 원문의 직접성과 긴급성을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 문맥 주해/서사 정확성
