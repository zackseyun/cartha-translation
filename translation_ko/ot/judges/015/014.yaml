  terminology: 야훼, 야훼의 영, 블레셋, 레히는 일관되고 적절합니다. ‘아마 섬유’는 פִשְׁתִּים의 일반적인 한국어 대응어이며, ‘결박’은 금속 족쇄를 함의하지 않아 אֱסוּרָיו에 적합합니다.
