source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
  footnotes:
  - marker: a
    text: Lehi is a place name; the Hebrew word is also related to 'jawbone,' an important motif in the surrounding narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 레히에 이르렀을 때, 블레셋 사람들이 그를 맞으러 나오며 소리를 질렀습니다. 그때 야훼의 영이 그에게 세차게 임했습니다. 그의 팔에 있던 밧줄들은 불에 타 버린 아마 섬유처럼 되었고, 그의 결박은 그의 손에서 녹아 풀렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 레히는 지명입니다. 그러나 히브리어 단어는 ‘턱뼈’와도 관련되어 있어, 주변 이야기의 중요한 모티프와 연결됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  english_pob_choice: Lehi
  chosen_korean: 레히
  alternatives_korean:
  - 턱뼈
  - 레히(지명)
  lexicon: HALOT
  rationale: POB가 이를 주변 문맥의 지명으로 읽었으므로, 한국어 본문도 지명 기능을 살려 ‘레히’로 옮겼습니다. 본문 안에서는 괄호 설명을 붙이지 않고, 주석으로 지명-어휘 연관성을 처리하는 편이 더 자연스럽습니다.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  english_pob_choice: shouted as they came to meet him
  chosen_korean: 그를 맞으러 나오며 소리를 질렀습니다
  alternatives_korean:
  - 그를 향해 함성을 질렀습니다
  - 그와 맞닥뜨리며 함성을 올렸습니다
  lexicon: HALOT
  rationale: ‘헤리우’의 함성/외침과 ‘그를 맞으러’의 대면 동작을 함께 살리되, ‘전투 함성’으로 지나치게 좁히지 않도록 했습니다.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh rushed upon him
  chosen_korean: 야훼의 영이 그에게 갑자기 임하자
  alternatives_korean:
  - 야훼의 영이 그에게 힘차게 임하자
  - 야훼의 영이 그에게 급히 덮치자
  lexicon: HALOT
  rationale: ‘צָלַח’의 급작스럽고 강력한 작용을 한국어 동사 ‘임하다’로 옮기되, 부사 ‘갑자기’로 그 돌발성을 보강했습니다. ‘영’은 여기서 하나님의 영이므로 ‘성령’보다 본문의 범위를 좁히지 않는 ‘영’이 적절합니다.
- source_word: כַּפִּשְׁתִּים אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  english_pob_choice: like flax that has been burned in the fire
  chosen_korean: 불에 탄 삼실처럼
  alternatives_korean:
  - 불에 탄 아마처럼
  - 불붙어 탄 삼실처럼
  lexicon: HALOT
  rationale: ‘פִשְׁתִּים’은 아마/삼 계열의 섬유를 가리키므로, 한국어 독자에게도 섬유의 타서 부스러지는 이미지를 즉각 전달하는 ‘삼실’로 옮겼습니다. 본문의 비유 핵심은 섬유가 불에 의해 맥없이 무너지는 장면입니다.
- source_word: וַיִּמַּסּוּ אֱסוּרָיו מֵעַל יָדָיו
  english_pob_choice: his bonds melted off his hands
  chosen_korean: 그의 손에서 그의 결박이 녹아 내렸습니다
  alternatives_korean:
  - 그의 손에서 그의 묶임이 풀려났습니다
  - 그의 손에서 그의 사슬이 녹아 내렸습니다
  lexicon: HALOT
  rationale: ‘אֱסוּרָיו’는 금속 족쇄보다 넓은 ‘결박’이 더 정확하며, ‘녹다’의 이미지를 살려 결과의 비가시적 파괴력을 드러냈습니다. ‘손에서’는 히브리어의 ‘손 위에서’에 대응하는 자연스러운 한국어 표현입니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 מופיע한 신명은 번역 관습보다 원천언어의 가시성을 우선해 ‘야훼’로 옮겼습니다. 이는 본문 자체의 언약명 사용을 드러내는 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘영’의 범위
  chosen_reading: 야훼의 영
  alternative_readings:
  - 성령
  - 야훼의 성령
  rationale: 사사기 문맥의 רוּחַ יְהוָה는 후대의 교리적 범주를 미리 고정하기보다, 본문이 말하는 하나님의 역동적 임재를 그대로 전달하는 것이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense; readable modern English'
