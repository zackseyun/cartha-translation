  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
  footnotes:
  - marker: a
    text: Or 'deployed themselves at Lehi.' The Hebrew verb can suggest spreading out in a military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 블레셋 사람들이 올라와 유다에 진을 치고 레히에 널리 퍼졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레히에서 군사적으로 전개되었습니다.’ 히브리어 동사는 군사적 의미로 ‘퍼져 배치되다’라는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: went up
  chosen_korean: 올라와
  alternatives_korean:
  - 올라갔습니다
  - 쳐올라왔습니다
  lexicon: HALOT
  rationale: עלה의 지리적·서사적 이동을 자연스럽게 살리되, 군사적 이동의 흐름을 유지하기 위해 ‘올라와’로 옮겼습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 치고
  alternatives_korean:
  - 야영하고
  - 진을 두고
  lexicon: HALOT
  rationale: חנה는 단순 야영보다 군사적 주둔의 뉘앙스가 강하므로, 전투 맥락에 맞는 ‘진을 치고’가 더 정확합니다.
- source_word: וַיִּנָּטְשׁוּ
  english_pob_choice: spread out
  chosen_korean: 널리 퍼져 있었습니다
  alternatives_korean:
  - 펼쳐졌습니다
  - 배치되었습니다
  - 분산되었습니다
  lexicon: HALOT
  rationale: 이 동사는 군사적으로 ‘퍼져 배치되다’는 뜻을 가질 수 있어, 직역적 ‘배치되었습니다’보다 위치 확장을 드러내는 표현을 택했습니다.
- source_word: בַּלֶּחִי
  english_pob_choice: at Lehi
  chosen_korean: 레히에
  alternatives_korean:
  - 레히에서
  - 레히 근처에
  lexicon: HALOT
  rationale: 레히는 지명으로 보아, 위치 표시를 자연스럽게 살리기 위해 조사 ‘에’를 사용했습니다.
