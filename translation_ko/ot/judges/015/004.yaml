- from: 그리하여 삼손은 가서 삼백 마리의 여우를 잡았고, 횃불들을 가져다가 그것들을 꼬리끼리 마주 대게 했으며, 각 꼬리 사이 가운데에 횃불 하나를 놓았습니다.[a]
  to: 그리하여 삼손은 가서 삼백 마리의 여우를 잡았습니다.[a] 그리고 횃불들을 가져다가 그 여우들을 꼬리끼리 마주 대게 하고, 각 쌍의 꼬리 사이 한가운데에 횃불 하나를 놓았습니다.
