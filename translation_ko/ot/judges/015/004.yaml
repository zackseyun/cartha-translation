base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
  footnotes:
  - marker: a
    text: Or 'jackals.' The Hebrew שׁוּעָלִים can refer to foxes or similar canids; 'foxes' is retained as the main rendering because it is the most common sense and fits the narrative tradition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 삼손은 가서 삼백 마리의 여우를 잡았고, 횃불들을 가져다가 그것들을 꼬리끼리 마주 대게 했으며, 각 꼬리 사이 가운데에 횃불 하나를 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוּעָלִים은 여우나 유사한 개과 동물을 가리킬 수 있습니다. 본문에서는 가장 일반적인 의미인 '여우'를 본문에 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּעָלִים
  english_pob_choice: foxes
  chosen_korean: 여우
  alternatives_korean:
  - 자칼
  - 승냥이
  lexicon: HALOT
  rationale: 영어 POB가 기본 의미를 따라 'foxes'를 유지한 만큼, 한국어도 가장 직접적인 대응인 '여우'를 채택했습니다. 본문 자체는 canid 계열의 가능성을 열어 두지만, 주석으로 처리할 정도의 대안이므로 본문은 일반적 의미를 살립니다.
- source_word: לַפִּדִים / לַפִּיד
  english_pob_choice: torches
  chosen_korean: 횃불
  alternatives_korean:
  - 불붙인 막대기
  - 불쏘시개
  lexicon: HALOT
  rationale: 불타는 막대/횃불의 뜻이므로 현대 한국어에서 가장 자연스럽고 명확한 '횃불'로 옮겼습니다.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  english_pob_choice: turned them tail to tail
  chosen_korean: 꼬리끼리 마주 대게 했으며
  alternatives_korean:
  - 꼬리끼리 돌렸으며
  - 꼬리 대 꼬리로 했으며
  lexicon: HALOT
  rationale: 히브리어 פנה는 '돌리다/향하게 하다'의 뜻이므로, 실제로 '묶었다'는 정보를 덧붙이지 않고 배열 동작만 드러내는 표현을 택했습니다. '마주 대게'는 두 꼬리를 서로 향하게 했다는 의미를 자연스럽게 전달합니다.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  english_pob_choice: between each pair of tails, in the middle
  chosen_korean: 각 꼬리 사이 가운데에
  alternatives_korean:
  - 두 꼬리 사이에
  - 한 쌍의 꼬리 사이에
  lexicon: HALOT
  rationale: 반복되는 동작이므로 '각'을 통해 매 쌍마다 횃불을 넣는다는 점을 살렸고, '가운데에'로 בַּתָּוֶךְ의 위치감을 반영했습니다.
theological_decisions:
- issue: '서술의 구체성: ''묶다''를 넣을지 여부'
  chosen_reading: 본문은 단지 꼬리들을 서로 마주 대게 하고 그 사이에 횃불을 놓았다고만 말하므로, '묶다'는 넣지 않았습니다.
  alternative_readings:
  - 꼬리를 묶어
  - 꼬리와 꼬리를 묶어
  rationale: 히브리어 동사들과 영어 POB 모두 배열과 배치만을 말하며 결박 여부는 명시하지 않습니다. 본문이 말하지 않은 세부를 보태지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: source fidelity / narration precision
