base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
  footnotes:
  - marker: a
    text: Or “gave her to his friend.” The Hebrew term can denote a companion or friend; some understand it more specifically in the wedding context as a groomsman or best man.
    reason: lexical_alternative
  - marker: b
    text: Literally “burned her and her father with fire.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 블레셋 사람들이 「누가 이런 일을 했느냐?」라고 말했습니다. 그들이 말하기를 「딤나 사람의 사위 삼손이니, 그가 자기 아내를 데려다가 그의 동무에게 주었기 때문이다」라고 했습니다. 그러자 블레셋 사람들이 올라가서 그녀와 그녀의 아버지를 불에 태웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 친구에게 주었다.” 히브리어는 동무·친구를 뜻할 수 있으며, 혼인 맥락에서는 신랑 들러리나 들러리 역할로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그녀와 그녀의 아버지를 불로 태웠다”입니다.
    reason: lexical_alternative
