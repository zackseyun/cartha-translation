  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
  footnotes:
  - marker: a
    text: Or 'at night.' The Hebrew adverbial expression indicates nighttime action without necessarily specifying 'tonight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'set an ambush' / 'ambush.' The Hebrew verb means to lie in wait, often with ambush in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 밤에 일어나십시오. 당신과 당신과 함께 있는 백성이 들에서 매복하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לַיְלָה는 ‘밤에’라는 시간 부사로, 반드시 ‘오늘 밤’처럼 당일성을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ארב는 ‘매복하다, 숨어 기다리다’의 뜻으로, 단순한 공격보다 매복 태세를 가리킬 수 있습니다.
    reason: lexical_alternative
