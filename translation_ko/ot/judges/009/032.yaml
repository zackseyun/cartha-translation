    text: 히브리어 לַיְלָה는 ‘밤에’라는 시간 부사로, 반드시 ‘오늘 밤’처럼 당일성을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ארב는 ‘매복하다, 숨어 기다리다’의 뜻으로, 단순한 공격보다 매복 태세를 가리킬 수 있습니다.
    reason: lexical_alternative
