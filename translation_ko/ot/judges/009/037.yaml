  lexicon: HALOT
  rationale: ‘배꼽’의 직역은 은유를 살리지만 현대 독자가 바로 이해하기 어려워, 지리적 의미를 드러내는 ‘땅의 중심’으로 옮겼습니다.
- source_word: וְרֹאשׁ אֶחָד
  english_pob_choice: one company
  chosen_korean: 한 무리
  alternatives_korean:
  - 한 떼
  - 한 부대
