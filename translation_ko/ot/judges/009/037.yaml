  edition: WLC
  text: וַ/יֹּ֨סֶף ע֣וֹד גַּעַל֮ לְ/דַבֵּר֒ וַ/יֹּ֕אמֶר הִנֵּה עָם֙ יֽוֹרְדִ֔ים מֵ/עִ֖ם טַבּ֣וּר הָ/אָ֑רֶץ וְ/רֹאשׁ אֶחָ֣ד בָּ֔א מִ/דֶּ֖רֶךְ אֵל֥וֹן מְעוֹנְנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'the navel of the land,' an idiom for the central part of the land.
    reason: lexical_alternative
  - marker: b
    text: Or 'the terebinth of the diviners' / 'the oak of Meonenim.' The final place-name element is uncertain and may refer to soothsayers or augurers.
    reason: alternative_reading
translation:
  language: ko
  text: 가알이 다시 말하며 말했습니다. 「보십시오, 사람들이 땅의 중심에서 내려오고 있습니다. 그리고 한 무리가 엘론 므오님 길로 오고 있습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘땅의 배꼽’이지만, 지리적으로는 ‘땅의 중심’이라는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 마지막 지명 요소는 불확실하며, ‘점쟁이들의 상수리나무/떡갈나무’ 또는 ‘므오님’이라는 지명으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  english_pob_choice: spoke again
  chosen_korean: 다시 말하며 말했습니다
  alternatives_korean:
  - 말을 계속하며 말했습니다
  - 거듭 말했습니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 ‘다시 덧붙여 말하다’는 반복 개시를 뜻하므로, 자연스러운 서술로 ‘다시 말하며 말했습니다’라고 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 담화 표지이므로, 현대 한국어에서 자연스럽고 직접적인 ‘보십시오’를 택했습니다.
- source_word: טַבּוּר הָאָרֶץ
  english_pob_choice: the center of the land
  chosen_korean: 땅의 중심
  alternatives_korean:
  - 땅의 배꼽
  - 땅 한가운데
  lexicon: HALOT
  rationale: ‘배꼽’의 직역은 은유를 살리지만 현대 독자가 바로 이해하기 어려워, 지리적 의미를 드러내는 ‘땅의 중심’으로 옮겼습니다.
- source_word: וְרֹאשׁ אֶחָד
  english_pob_choice: one company
  chosen_korean: 한 무리
  alternatives_korean:
  - 한 떼
  - 한 부대
  - 한 집단
  lexicon: HALOT
  rationale: ‘머리 하나’는 여기서 선두 집단/분견대를 가리키므로, 과도하게 군사화하지 않으면서도 구분되는 집단을 뜻하는 ‘한 무리’로 옮겼습니다.
- source_word: אֵלוֹן מְעוֹנְנִים
  english_pob_choice: the Oak of the Soothsayers
  chosen_korean: 엘론 므오님
  alternatives_korean:
  - 점쟁이들의 상수리나무
  - 점치던 자들의 떡갈나무
  - 메오님 나무
  lexicon: HALOT; proper noun
  rationale: 이 표현은 지명으로 기능하는 불확실한 고유명사이므로, 본문에는 음역을 두고 의미 설명은 주석으로 처리하는 편이 원문과 더 가깝습니다.
theological_decisions:
- issue: 지명 어휘의 불확실성 처리
  chosen_reading: 본문은 ‘엘론 므오님’으로 음역하고, 의미 해석은 열어 두었습니다.
  alternative_readings:
  - ‘점쟁이들의 상수리나무’로 의미역
  - ‘점치는 자들의 떡갈나무’로 해석역
  rationale: 히브리어 말미가 지명인지 묘사인지 확정하기 어려우므로, 본문에서 해석을 고정하지 않고 원문 불확실성을 보존했습니다.
  doctrine_reference: source integrity / textual restraint
