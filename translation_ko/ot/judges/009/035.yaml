source:
  edition: WLC
  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
  footnotes:
  - marker: a
    text: Or 'came out' for 'went out.' The Hebrew verb simply marks movement outward.
    reason: lexical_alternative
  - marker: b
    text: Or 'rose up from the place of ambush.' The Hebrew noun can denote either the ambush itself or the ambush-position.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 가알, 에벳의 아들이 나가 성문 어귀에 서고, 아비멜렉과 그와 함께한 백성은 매복지에서 일어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가
  alternatives_korean:
  - 나왔습니다
  - 나갔습니다
  lexicon: HALOT
  rationale: יצא의 기본 방향성인 ‘밖으로 나감’을 자연스러운 서술문으로 옮겼습니다. 문맥상 단순 이동이므로 과도한 뉘앙스는 피했습니다.
- source_word: פֶּתַח שַׁעַר הָעִיר
  english_pob_choice: at the entrance of the city gate
  chosen_korean: 성문 어귀에
  alternatives_korean:
  - 성문 입구에
  - 도시 성문의 입구에
  lexicon: HALOT
  rationale: פתח는 ‘문어귀/입구’의 의미를 가지며, שער העיר는 관용적으로 ‘성문’을 뜻하므로 간결하게 ‘성문 어귀’로 옮겼습니다.
- source_word: וַיָּקָם ... מִן הַמַּאְרָב
  english_pob_choice: rose from the ambush
  chosen_korean: 매복지에서 일어났습니다
  alternatives_korean:
  - 매복에서 일어났습니다
  - 매복 자리에서 일어났습니다
  lexicon: HALOT
  rationale: מארב는 ‘매복’ 자체이면서 그 위치를 가리킬 수 있어, 한국어에서는 문맥을 드러내는 ‘매복지’로 옮겨 장소 감각을 분명히 했습니다.
