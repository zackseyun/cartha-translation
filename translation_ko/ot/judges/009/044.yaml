- source_word: וַ/יַּ֣עַמְד֔וּ פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר
  english_pob_choice: stood at the entrance of the city gate
  chosen_korean: 성문 어귀에 섰고
  alternatives_korean:
  - 성문 입구에 서 있었고
  - 성문 문간에 섰고
  lexicon: HALOT
  rationale: פֶּתַח שַׁעַר הָעִיר는 도시 성문의 ‘어귀/입구’를 가리키며, 전투 배치의 결과를 간결하게 살리기 위해 ‘섰고’로 옮겼습니다.
- source_word: וּ/שְׁנֵ֣י הָֽ/רָאשִׁ֗ים
  english_pob_choice: the two other companies
  chosen_korean: 다른 두 집단은
  alternatives_korean:
  - 다른 두 지도자는
  - 남은 두 무리는
  lexicon: WLC/HALOT
  rationale: 문자적으로는 ‘두 우두머리들’이지만, 직전 문맥의 세 갈래 편제를 이어받는 표현으로 보아 실제 의미는 남은 두 군사 분단이므로 ‘집단’이 적절합니다.
- source_word: וַ/יַּכּֽוּ/ם
  english_pob_choice: struck them down
  chosen_korean: 그들을 쳐죽였습니다
  alternatives_korean:
  - 그들을 쳤습니다
  - 그들을 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: נכה는 문맥에 따라 ‘치다/쓰러뜨리다/죽이다’까지 갈 수 있는데, 여기서는 전투 결과의 치명성을 분명히 해야 하므로 ‘쳐죽였습니다’로 옮겼습니다.
