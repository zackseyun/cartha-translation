  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the two leaders.' In context, this likely refers to the two remaining companies or divisions from the three groups mentioned in the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비멜렉과 그와 함께한 지도자들은 앞으로 돌진하여 성문 어귀에 섰고, 다른 두 집단은 들판에 있는 모든 사람에게로 돌진하여 그들을 쳐죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘두 지도자들’입니다. 문맥상 이는 앞 절에서 언급된 세 무리 가운데 남은 두 집단을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶ֗לֶךְ וְ/הָ/רָאשִׁים֙ אֲשֶׁ֣ר עִמּ֔/וֹ
  english_pob_choice: And Abimelech and the leaders who were with him
  chosen_korean: 아비멜렉과 그와 함께한 지도자들은
  alternatives_korean:
  - 아비멜렉과 그와 함께한 우두머리들은
  - 아비멜렉과 그와 함께한 장관들은
  lexicon: WLC/HALOT
  rationale: הָרָאשִׁים의 기본 의미는 ‘머리들/우두머리들’이지만, 군사적 문맥에서 동행한 지휘 집단을 가리키므로 ‘지도자들’이 자연스럽고 의미를 보존합니다.
- source_word: פָּשְׁטוּ
  english_pob_choice: rushed forward
  chosen_korean: 돌진하여
  alternatives_korean:
  - 급히 나아가
  - 앞으로 나아가
  lexicon: HALOT
  rationale: 전투 상황에서 단순한 이동보다 급속한 공격적 전진을 뜻하므로 ‘돌진하여’가 동작의 긴박함을 잘 드러냅니다.
- source_word: וַ/יַּ֣עַמְד֔וּ פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר
  english_pob_choice: stood at the entrance of the city gate
  chosen_korean: 성문 어귀에 섰고
  alternatives_korean:
  - 성문 입구에 서 있었고
  - 성문 문간에 섰고
  lexicon: HALOT
  rationale: פֶּתַח שַׁעַר הָעִיר는 도시 성문의 ‘어귀/입구’를 가리키며, 전투 배치의 결과를 간결하게 살리기 위해 ‘섰고’로 옮겼습니다.
- source_word: וּ/שְׁנֵ֣י הָֽ/רָאשִׁ֗ים
  english_pob_choice: the two other companies
  chosen_korean: 다른 두 집단은
  alternatives_korean:
  - 다른 두 지도자는
  - 남은 두 무리는
  lexicon: WLC/HALOT
  rationale: 문자적으로는 ‘두 우두머리들’이지만, 직전 문맥의 세 갈래 편제를 이어받는 표현으로 보아 실제 의미는 남은 두 군사 분단이므로 ‘집단’이 적절합니다.
- source_word: וַ/יַּכּֽוּ/ם
  english_pob_choice: struck them down
  chosen_korean: 그들을 쳐죽였습니다
  alternatives_korean:
  - 그들을 쳤습니다
  - 그들을 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: נכה는 문맥에 따라 ‘치다/쓰러뜨리다/죽이다’까지 갈 수 있는데, 여기서는 전투 결과의 치명성을 분명히 해야 하므로 ‘쳐죽였습니다’로 옮겼습니다.
