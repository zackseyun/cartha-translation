  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the two leaders.' In context, this likely refers to the two remaining companies or divisions from the three groups mentioned in the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비멜렉과 그와 함께한 지도자들은 앞으로 돌진하여 성문 입구에 섰고, 다른 두 집단은 들판에 있는 모든 사람을 향해 돌진하여 그들을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘두 우두머리’입니다. 문맥상 이는 앞 절에서 언급된 세 무리 가운데 남은 두 집단을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶ֗לֶךְ וְ/הָ/רָאשִׁים֙ אֲשֶׁ֣ר עִמּ֔/וֹ
  english_pob_choice: And Abimelech and the leaders who were with him
  chosen_korean: 아비멜렉과 그와 함께한 지도자들은
  alternatives_korean:
