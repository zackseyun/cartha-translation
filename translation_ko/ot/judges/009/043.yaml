revisions:
- from: 그가 백성을 데리고 가서 세 무리로 나누고, 들에 매복하였습니다. 그가 사람들이 도시에서 나오는 것을 보고는 그들에게 맞서 일어나 그들을 쳐죽였습니다.[a]
  to: 그가 백성을 데리고 세 부대로[a] 나누어 들판에 매복하였습니다. 그가 보니, 보십시오, 백성이 성읍에서 나오고 있었습니다. 그가 그들에게 맞서 일어나 그들을 쳤습니다.
  rationale: 원문의 동작 순서와 ‘보십시오’(וְהִנֵּה)가 주는 관찰의 생동감을 유지했습니다. ‘쳐죽였습니다’를 ‘쳤습니다’로 고쳐 원문이 명시하지 않는 사망을 단정하지 않았으며, 각주 표지를 설명 대상인 ‘세 부대’에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:09:46Z'
review_pass:
  verdict: revise
  source_fidelity: ‘백성을 데리고 가서’는 וַיִּקַּח(‘데리고/취하여’)에 없는 이동 의미를 더합니다. 또한 וַיַּכֵּם은 문맥상 공격을 가리키지만 ‘쳐죽였습니다’처럼 살해를 단정하지는 않습니다. 본문은 ‘쳤습니다’로 두어 어휘적 범위를 보존하는 것이 적절합니다.
  naturalness: ‘들판에 매복하였습니다’, ‘성읍에서 나오는 것을 보고’, ‘그들에게 맞서 일어나’는 현대 표준 한국어 합쇼체에서 자연스럽고 서사 문맥에도 맞습니다. ‘세 부대’는 군사적 문맥에서 ‘세 무리’보다 분명하면서도 과도한 세부화를 피합니다.
  terminology: עָם은 양쪽 모두 ‘백성’으로 옮겨 원문의 반복을 보존했습니다. עִיר는 고대 서사 배경에 맞추어 ‘성읍’으로 옮겼습니다. רָאשִׁים의 관용적 군사 구획은 ‘부대’로 번역하고, 각주는 해당 표현 바로 뒤에 둡니다.
  issues:
  - severity: medium
    issue: ‘데리고 가서’가 원문에 없는 이동을 추가합니다.
    rationale: וַיִּקַּח은 사람들을 취하거나 데리고 하는 행위를 말할 뿐, 이 절에서 ‘가다’라는 이동 동작을 명시하지 않습니다.
  - severity: high
    issue: ‘쳐죽였습니다’가 וַיַּכֵּם의 의미를 살해로 과도하게 한정합니다.
    rationale: נכה는 ‘치다, 공격하다, 무찌르다’ 등 넓은 뜻을 가지며, 이 동사만으로 사망을 명시하지 않습니다. 영어 감사 기록도 이를 명시적으로 경계합니다.
  - severity: low
    issue: 각주 표지가 ‘세 무리’가 아니라 절 끝에 놓여 있습니다.
    rationale: 각주 내용이 רָאשִׁים/‘세 부대’의 관용을 설명하므로 해당 번역어 직후에 표지를 두어야 합니다.
  revised_text: 그가 백성을 데리고 세 부대로[a] 나누어 들판에 매복하였습니다. 그가 보니, 보십시오, 백성이 성읍에서 나오고 있었습니다. 그가 그들에게 맞서 일어나 그들을 쳤습니다.
