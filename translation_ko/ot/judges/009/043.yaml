  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
  footnotes:
  - marker: a
    text: Or 'divided them into three groups/bands'; literally 'into three heads,' a Hebrew idiom for divisions or companies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 백성을 데리고 가서 세 무리로 나누고, 들에 매복하였습니다. 그가 사람들이 도시에서 나오는 것을 보고는 그들에게 맞서 일어나 그들을 쳐죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세 무리’는 히브리어의 문자적 표현인 ‘세 머리들’에서 온 관용으로, 분대·부대의 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  english_pob_choice: He took the people
  chosen_korean: 백성을 데리고 가서
  alternatives_korean:
  - 백성을 데리고 갔습니다
  - 그 사람들을 데리고 갔습니다
  - 백성을 취하였습니다
  lexicon: HALOT
  rationale: עָם을 기본적으로 ‘백성/사람들’로 옮기되, 군사적 문맥에 맞게 이동 동작을 자연스럽게 풀어 ‘데리고 가서’로 표현했습니다.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  english_pob_choice: divided them into three companies
  chosen_korean: 세 무리로 나누고
  alternatives_korean:
  - 세 부대로 나누고
  - 세 집단으로 나누고
  - 세 편으로 나누고
  lexicon: HALOT
  rationale: ‘세 머리들’이라는 히브리어 관용은 한국어에서 직역보다 ‘세 무리’가 의미를 가장 자연스럽게 드러냅니다.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  english_pob_choice: and lay in wait in the field
  chosen_korean: 들에 매복하였습니다
  alternatives_korean:
  - 들판에 숨어 기다렸습니다
  - 들에서 매복하였습니다
  - 들에 숨어 있었습니다
  lexicon: HALOT
  rationale: ארב의 핵심은 ‘매복하다’이므로 군사적 긴장을 살리는 표준어 표현을 택했습니다.
- source_word: וַיָּקָם עֲלֵיהֶם
  english_pob_choice: he rose up against them
  chosen_korean: 그들에게 맞서 일어나
  alternatives_korean:
  - 그들을 향해 일어나
  - 그들에게 일어나
  - 그들에게 대항하여 일어나
  lexicon: HALOT
  rationale: קום על은 단순 기립이 아니라 공격적 개시를 뜻하므로 ‘맞서 일어나’로 옮겨 동작과 대립을 함께 살렸습니다.
- source_word: וַיַּכֵּם
  english_pob_choice: and struck them down
  chosen_korean: 그들을 쳐죽였습니다
  alternatives_korean:
  - 그들을 쳐서 쓰러뜨렸습니다
  - 그들을 치고 무찔렀습니다
  - 그들을 쳤습니다
  lexicon: HALOT
  rationale: 문맥상 단순 타격보다 치명적 폭력을 가리키므로, 영어 POB의 해석을 반영해 결과를 분명히 했습니다.
theological_decisions:
- issue: 군사 서술의 과도한 완곡화 여부
  chosen_reading: ‘매복하였습니다’, ‘맞서 일어나’, ‘쳐죽였습니다’처럼 전투의 폭력성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘숨어 있었습니다’, ‘공격했습니다’, ‘쳤습니다’
  rationale: 본문은 은유적이거나 완화된 서술이 아니라 실제 매복과 살상을 묘사하므로, 독자가 서사의 잔혹성을 놓치지 않게 해야 합니다.
  doctrine_reference: 서사 본문 해석 원칙
