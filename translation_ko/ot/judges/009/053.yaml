translation:
  language: ko
  text: 그런데 한 여인이 맷돌의 윗짝을 던져 아비멜렉의 머리에 떨어뜨려 그의 두개골을 부수었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맷돌의 윗짝 한 조각’; 히브리어 표현은 윗돌의 한 부분이나 파편을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשָּׁה אַחַת
  english_pob_choice: a certain woman
  chosen_korean: 한 여인
  alternatives_korean:
  - 어떤 여인
  - 한 여자
  lexicon: HALOT
  rationale: 히브리어의 부정수사적 표현을 살리되, 현대 한국어 서술에서는 자연스럽고 품위 있는 ‘한 여인’이 가장 적절합니다.
- source_word: פֶּלַח רֶכֶב
  english_pob_choice: an upper millstone
  chosen_korean: 맷돌의 윗짝
  alternatives_korean:
  - 윗맷돌
  - 맷돌 윗돌
  - 맷돌의 윗돌
  lexicon: HALOT
  rationale: רֶכֶב은 윗돌/윗짝을 가리키므로, ‘맷돌의 윗짝’으로 구체적이고 이해하기 쉬우면서도 어휘적 정확성을 유지합니다.
- source_word: וַתָּרִץ אֶת גֻּלְגָּלְתּוֹ
  english_pob_choice: crushed his skull
  chosen_korean: 그의 두개골을 부수었습니다
  alternatives_korean:
  - 그의 머리를 으깨었습니다
  - 그의 두개골을 으깨었습니다
  lexicon: HALOT
  rationale: גֻּלְגֹּלֶת은 단순한 ‘머리’보다 해부학적으로 ‘두개골’이 더 정확하며, רצץ의 강한 파괴 의미를 ‘부수다’로 살렸습니다.
- source_word: וַ/תַּשְׁלֵ֞ךְ
  english_pob_choice: threw
  chosen_korean: 던져
  alternatives_korean:
  - 내던져
  - 집어던져
  lexicon: HALOT
  rationale: שׁלך의 기본 동작은 ‘던지다’이며, 서술 흐름에 맞게 간결한 능동 표현으로 옮겼습니다.
