base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
  footnotes:
  - marker: a
    text: Or 'the thornbush.' The Hebrew אָטָד refers to a thorny shrub; 'bramble' is a natural English rendering in this fable context.
    reason: lexical_alternative
  - marker: b
    text: '''Take refuge'' can also be rendered ''seek shelter.'' The wording may carry ironic force, since a bramble offers little real shade.'
    reason: lexical_alternative
  - marker: c
    text: Or 'fire will come out from the bramble.' The Hebrew verb may be understood as a jussive-like wish or as a predictive statement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 가시덤불[a]이 나무들에게 말했습니다. 「정말로 너희가 나를 너희의 왕으로 기름부으려 한다면, 와서 내 그늘 아래에서 피신하십시오[b]. 그러나 그렇지 않다면, 가시덤불에서 불이 나와 레바논의 백향목들을 사를 것입니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가시덤불’은 히브리어 אָטָד의 자연스러운 현대 한국어 번역입니다. ‘가시나무’ 또는 ‘가시 관목’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘피신하십시오’는 보호와 피난처를 구한다는 뜻입니다. 가시덤불이 실제로는 거의 그늘을 제공하지 못한다는 점에서 아이러니가 드러납니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 ‘불이 나와 … 사를 것입니다’라는 예언적 진술로, 또는 ‘불이 나와 … 사르게 하십시오’라는 저주·소망의 말로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָטָד
  english_pob_choice: the bramble
  chosen_korean: 가시덤불
  alternatives_korean:
  - 찔레나무
  - 덤불
  - 가시나무
  lexicon: HALOT
  rationale: אָטָד는 가시가 있는 관목을 가리키므로, 비유의 대비를 살리면서도 현대 한국어에서 자연스러운 「가시덤불」로 옮겼습니다.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  english_pob_choice: anointing me as king
  chosen_korean: 나를 너희의 왕으로 기름부으려 한다면
  alternatives_korean:
  - 나를 왕으로 세우려 한다면
  - 나를 왕으로 임명하려 한다면
  lexicon: HALOT
  rationale: מָשַׁח의 핵심 이미지는 단순한 임명이 아니라 「기름부음」이므로, 왕권 수여의 상징성을 보존했습니다.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  english_pob_choice: come, take refuge in my shade
  chosen_korean: 와서 내 그늘 아래로 피하십시오
  alternatives_korean:
  - 와서 내 그늘에 숨으십시오
  - 와서 내 그늘에서 피난하십시오
  lexicon: HALOT
  rationale: חסה는 단순한 쉼보다 보호를 구하는 의미가 강하므로 「피하십시오」로 자연스럽게 옮기되, 그늘의 아이러니도 살렸습니다.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד וְתֹאכַל
  english_pob_choice: let fire come out from the bramble and consume
  chosen_korean: 가시덤불에서 불이 나와 … 사를 것입니다
  alternatives_korean:
  - 가시덤불에서 불이 나와 … 삼킬 것입니다
  - 가시덤불에서 불이 나와 … 태울 것입니다
  lexicon: HALOT
  rationale: 불이 나와 대상을 삼키는 표현은 심판적 파괴를 나타내므로, 현대 한국어에서 가장 자연스럽고 강한 「사르다」를 택했습니다.
theological_decisions:
- issue: 조건절과 결말절의 예언적/저주적 뉘앙스
  chosen_reading: 마지막 절은 단순 미래보다는 경고성·저주성 발화로 읽히므로, 「불이 나와 … 사를 것입니다」로 옮겨 발화의 위협성을 드러냈습니다.
  alternative_readings:
  - 불이 나와 … 사를 것입니다
  - 불이 나와 … 사르도록 하십시오
  rationale: 히브리어 동사는 문맥상 jussive-like한 힘을 띠며, 요담의 비유에서 조건 불이행에 대한 경고가 핵심이기 때문입니다.
  doctrine_reference: 문맥 주도적 시제/법 해석
- issue: 왕으로 기름붓는 표현의 상징성
  chosen_reading: 왕위 수여를 단순 임명으로 낮추지 않고 「기름부으려 한다」로 유지했습니다.
  alternative_readings:
  - 왕으로 삼으려 한다
  - 왕으로 세우려 한다
  rationale: 히브리어 왕권 표현의 제의적·역사적 함의를 보존해야 비유의 정치적 풍자가 약화되지 않습니다.
  doctrine_reference: 구약 왕권 용어의 상징성
