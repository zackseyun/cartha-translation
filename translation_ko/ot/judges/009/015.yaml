  source_fidelity: 히브리어의 주요 어휘와 구문은 대체로 충실합니다. אָטָד는 ‘가시덤불’, מָשַׁח는 ‘기름부으려 한다면’, אַרְזֵי הַלְּבָנוֹן은 ‘레바논의 백향목들’로 적절히 옮겼습니다. 다만 חָסָה는 위험을 피하여 도망한다는 뜻보다 보호를 구해 피신한다는 뜻이므로, 기존 ‘내 그늘 아래로 피하십시오’는 목적지와 동사의 결합이 다소 어색하고 ‘피하다’로 오해될 여지가 있습니다. 마지막 미완료형은 예언적 진술 또는 저주·소망의 어조로 이해될 수 있으므로, 본문에서는 자연스러운 예언적 표현을 유지하고 각주에서 양 가능성을 밝혀 두는 것이 안전합니다.
  naturalness: ‘와서 내 그늘 아래에서 피신하십시오’는 현대 표준 한국어에서 자연스럽고, 두 명령형의 연속과 보호를 구하는 뜻을 명료하게 드러냅니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 편이 독자의 이해와 주석 연결에 더 적절합니다.
