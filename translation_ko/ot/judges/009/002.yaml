base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''your bone and your flesh,'' meaning ''your own flesh and blood'' or close kin.'
    reason: lexical_alternative
translation:
  language: ko
  text: “부디 모든 세겜의 지도자들의 귀에 말하십시오. 당신들에게 더 좋은 것이 무엇입니까? 칠십 명, 곧 여룹바알의 모든 아들이 당신들을 다스리는 것입니까, 아니면 한 사람이 당신들을 다스리는 것입니까? 그리고 기억하십시오. 나는 당신들의 뼈요 살입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘자신의 살과 피’, 곧 가까운 친족을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  english_pob_choice: Please speak
  chosen_korean: 부디 … 말하십시오
  alternatives_korean:
  - 말해 주십시오
  - 말씀하십시오
  lexicon: HALOT
  rationale: 복수 명령형과 간청의 נא를 한국어 공손 표현으로 살리되, 본문의 공개적 호소에 맞게 직접적인 요청 형태를 유지했습니다.
- source_word: בְּ/אָזְנֵ֨י
  english_pob_choice: in the hearing of
  chosen_korean: …의 귀에
  alternatives_korean:
  - …가 듣는 데에
  - …에게
  lexicon: HALOT
  rationale: 히브리어 관용구를 지나치게 완화하지 않고, 공적 발언이 ‘들리도록’ 한다는 감각을 살려 직역에 가깝게 옮겼습니다.
- source_word: בַּעֲלֵי שְׁכֶם
  english_pob_choice: the leaders of Shechem
  chosen_korean: 세겜의 지도자들
  alternatives_korean:
  - 세겜의 주인들
  - 세겜의 유력자들
  lexicon: HALOT
  rationale: 문맥상 정치·사회적 영향력을 가진 사람들을 가리키므로, 한국어로는 자연스럽고 기능적으로 ‘지도자들’이 가장 적절합니다.
- source_word: עַצְמֵ/כֶם וּ/בְשַׂר/כֶם
  english_pob_choice: your bone and your flesh
  chosen_korean: 당신들의 뼈요 살입니다
  alternatives_korean:
  - 당신들의 뼈와 살입니다
  - 당신들의 친족입니다
  lexicon: HALOT
  rationale: 가족·혈연 관계를 뜻하는 히브리 관용구를 보존하기 위해 직설적 표현을 유지했고, 한국어에서는 연결조사 ‘-요’로 두 명사를 병렬했습니다.
theological_decisions:
- issue: 형제/친족 관용구의 처리
  chosen_reading: ‘뼈요 살’이라는 구체적 이미지를 본문에 유지했습니다.
  alternative_readings:
  - ‘친족입니다’로 뜻만 옮김
  - ‘피붙이입니다’로 관용화
  rationale: 문학적·수사적 힘을 보존하고, 아비멜렉의 호소가 혈연적 동일성을 내세운다는 점을 독자가 직접 보게 하기 위해서입니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
