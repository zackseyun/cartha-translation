  lexicon: HALOT
  rationale: עלה의 기본적인 이동 방향을 자연스러운 현대 한국어로 살리면서, 서술 문맥에 맞게 간결하게 옮겼습니다.
- source_word: הַר צַלְמוֹן / Mount Zalmon
