base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
  footnotes:
  - marker: a
    text: Or “a bough of trees,” “a thicket of wood,” or “a bundle of brushwood”; the Hebrew term is rare and refers to a mass of branches or brushwood.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아비멜렉은 그와 함께한 모든 사람과 함께 살몬 산으로 올라갔습니다. 아비멜렉은 손에 도끼들을 잡고 나무가지를 잘라 내어 그것을 들어 자기 어깨에 메었습니다. 그리고 그와 함께한 사람들에게 말했습니다. “내가 하는 것을 너희가 보았으니, 서둘러 나를 따라 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 희귀하여, ‘나무가지’ 외에도 ‘가지 더미’, ‘덤불’ 등으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל / went up
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올랐습니다
  - 산을 올랐습니다
  lexicon: HALOT
  rationale: עלה의 기본적인 이동 방향을 자연스러운 현대 한국어로 살리면서, 서술 문맥에 맞게 간결하게 옮겼습니다.
- source_word: הַר צַלְמוֹן / Mount Zalmon
  english_pob_choice: Mount Zalmon
  chosen_korean: 살몬 산
  alternatives_korean:
  - 살몬 산맥
  - 살몬 산지
  lexicon: HALOT
  rationale: 지명은 음역을 따르되, הַר + 고유명사의 구조를 한국어에서 자연스럽게 반영해 ‘산’으로 옮겼습니다.
- source_word: הַקַּרְדֻּמּוֹת / the axes
  english_pob_choice: the axes
  chosen_korean: 도끼들을
  alternatives_korean:
  - 도끼를
  - 도끼들
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 도구들의 수량감을 살렸고, 문맥상 군집적 복수 표현이 자연스럽습니다.
- source_word: שׂוֹכַת עֵצִים / a bundle of branches
  english_pob_choice: a bundle of branches
  chosen_korean: 나무가지
  alternatives_korean:
  - 나뭇가지 더미
  - 가지 묶음
  - 덤불
  lexicon: HALOT
  rationale: 이 드문 표현은 가지들의 집합을 가리키므로, 지나치게 특정하지 않으면서도 들고 옮길 수 있는 재료라는 점을 살려 ‘나무가지’로 옮겼습니다.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ / lifted it ... put it on his shoulder
  english_pob_choice: lifted it ... put it on his shoulder
  chosen_korean: 그것을 들어 자기 어깨에 메었습니다
  alternatives_korean:
  - 그것을 들어 어깨에 올렸습니다
  - 그것을 들어 자기 어깨에 얹었습니다
  lexicon: HALOT
  rationale: ‘들다’와 ‘메다’의 연속 동작을 한국어에서 자연스럽게 연결해, 들어 올린 뒤 어깨에 얹는 동작을 분명히 했습니다.
- source_word: מָה רְאִיתֶם עָשִׂיתִי ... עֲשׂוּ כָמוֹנִי / What you have seen me do ... do as I have done
  english_pob_choice: What you have seen me do ... do as I have done
  chosen_korean: 내가 하는 것을 너희가 보았으니, 서둘러 나를 따라 하십시오
  alternatives_korean:
  - 내가 한 것을 보았으니, 속히 나처럼 하십시오
  - 내가 한 것을 보았으니, 서둘러 그대로 하십시오
  lexicon: HALOT
  rationale: 히브리어의 압축된 명령형을 한국어로 풀어, ‘본 것을 근거로 즉시 모방하라’는 의미를 살렸습니다. ‘따라 하십시오’는 כָמוֹנִי의 모방 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 아비멜렉의 명령 문체
  chosen_reading: 직접 명령을 합쇼체로 옮겨, 군중에게 내리는 지시의 권위와 긴박함을 유지했습니다.
  alternative_readings:
  - 반말형 명령
  - 더 부드러운 권고형 표현
  rationale: 본문은 단순 설명이 아니라 즉각적 실행을 촉구하는 명령이므로, 공손하지만 긴박한 현대 한국어 명령형이 적절합니다.
  doctrine_reference: 서술체 인용의 화행 보존
