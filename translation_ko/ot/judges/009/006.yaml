base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
  footnotes:
  - marker: a
    text: Or "by the oak of the pillar/standing stone"; the Hebrew phrase is difficult, and the exact sense of מֻצָּב is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Beth-millo may mean "the house of Millo," but the expression likely functions here as a place or clan name.
    reason: cultural_note
translation:
  language: ko
  text: 그때 세겜의 모든 지도자와 밀로의 온 집안이 함께 모여, 세겜에 있는 돌기둥이 딸린 상수리나무 곁에서 아비멜렉을 왕으로 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌기둥이 딸린 상수리나무’는 히브리어 표현이 어려워 정확한 세부 의미가 확정되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘밀로의 온 집안’은 직역형이지만, 여기서는 장소명 또는 집단명으로 기능하는 것으로 볼 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  english_pob_choice: the leaders of Shechem
  chosen_korean: 세겜의 모든 지도자
  alternatives_korean:
  - 세겜의 모든 주인들
  - 세겜의 모든 귀인들
  - 세겜의 모든 시민
  lexicon: HALOT
  rationale: בעלים는 문자적으로는 ‘주인들/지배자들’이지만, 이 문맥에서는 도시의 정치적 실권자들을 가리키므로 ‘지도자들’이 자연스럽고 의미를 정확히 드러냅니다.
- source_word: בֵּית מִלּוֹא
  english_pob_choice: Beth-millo
  chosen_korean: 밀로의 온 집안
  alternatives_korean:
  - 벧밀로
  - 밀로의 집
  - 밀로 가문
  lexicon: HALOT
  rationale: 이 표현은 고유명사적 지칭으로 보이지만 정확한 실체가 불확실하므로, 영어 POB의 판단을 따라 장소/집단명 성격을 살려 음역보다 의미적 표현을 택했습니다.
- source_word: אֵלוֹן מֻצָּב
  english_pob_choice: the oak pillar
  chosen_korean: 돌기둥이 딸린 상수리나무
  alternatives_korean:
  - 상수리나무 기둥
  - 상수리나무의 표석
  - 상수리나무 곁의 세워진 기둥
  lexicon: HALOT
  rationale: אֵלוֹן은 큰 나무를 가리키며, מֻצָּב은 ‘세워진/설치된 것’이라는 뜻이므로, 두 요소를 함께 살려 ‘돌기둥이 딸린 상수리나무’로 옮겼습니다. 이는 위치표시를 넘어 기념물적 성격을 암시합니다.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  english_pob_choice: made Abimelech king
  chosen_korean: 아비멜렉을 왕으로 세웠습니다
  alternatives_korean:
  - 아비멜렉을 왕으로 만들었습니다
  - 아비멜렉을 왕으로 선포했습니다
  - 아비멜렉에게 왕위를 주었습니다
  lexicon: HALOT
  rationale: 히필형 מלך는 ‘왕이 되게 하다/세우다’의 뜻이므로, 즉위의 행위를 담백하게 드러내는 ‘왕으로 세웠습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 제왕 즉위의 주체와 정당성
  chosen_reading: 본문은 세겜의 정치 엘리트들이 주도하여 아비멜렉을 왕으로 세운 장면으로 읽습니다.
  alternative_readings:
  - 단순한 추대 행사
  - 공식적인 통치 승인
  rationale: 히브리어 동사와 문맥상 공동체의 자발적 정치 행위가 강조되며, 정당성 여부는 서술하지 않고 독자가 이어지는 문맥에서 판단하도록 두는 것이 적절합니다.
  doctrine_reference: 문맥적 서술 원칙
