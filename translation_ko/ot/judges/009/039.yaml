lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가
  alternatives_korean:
  - 나왔습니다
  - 밖으로 나갔습니다
  lexicon: HALOT
  rationale: 서사 동사 יצא의 기본 의미를 자연스러운 현대 한국어 서사체로 옮겼습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에
  alternatives_korean:
  - 앞장서서
  - 면전에서
  - 앞에서
  lexicon: HALOT
  rationale: 문맥상 단순한 위치 표시를 넘어서 지휘·선두의 뉘앙스가 있으므로, 직역 성격을 유지하면서도 한국어로는 ‘앞에’가 가장 무난합니다.
- source_word: בַּעֲלֵי שְׁכֶם
  english_pob_choice: the leaders of Shechem
  chosen_korean: 세겜의 지도자들
  alternatives_korean:
  - 세겜의 주인들
  - 세겜의 백성들
  - 세겜의 남자들
  lexicon: HALOT
  rationale: בעלים은 도시의 유력자·지도층을 가리키는 뜻으로 쓰였으므로, 오해를 줄이는 ‘지도자들’이 적절합니다.
- source_word: וַיִּלָּחֶם בַּאֲבִימֶלֶךְ
  english_pob_choice: fought against Abimelech
  chosen_korean: 아비멜렉과 싸웠습니다
  alternatives_korean:
  - 아비멜렉을 상대로 싸웠습니다
  - 아비멜렉과 전쟁했습니다
  lexicon: HALOT
  rationale: לחם 뒤의 ב는 상대방을 표시하므로 한국어에서는 대립 관계를 자연스럽게 나타내는 ‘~과 싸우다’가 적합합니다.
