  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''as your hand finds,'' meaning according to what is within your power or opportunity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아침에 해가 뜨자마자 일찍 일어나 성을 향해 진격하십시오. 보십시오, 그와 그와 함께 있는 사람들이 당신에게 나올 때, 할 수 있는 대로[a] 그에게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘당신의 손이 찾는 대로’라는 관용구이며, 능력이나 기회가 미치는 대로라는 뜻입니다.
    reason: lexical_alternative
