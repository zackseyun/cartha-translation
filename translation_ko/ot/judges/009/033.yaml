  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''as your hand finds,'' meaning according to what is within your power or opportunity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 아침에, 해가 뜨자마자 일찍 일어나 성을 향해 퍼져 나가십시오. 그리고 보십시오. 그와 그와 함께 있는 사람들이 당신에게 나올 때, 당신은 손이 닿는 대로 그에게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘손이 찾는 대로’이지만 실제 뜻은 ‘능력이나 기회가 미치는 대로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּבֹּקֶר
  english_pob_choice: Then in the morning
  chosen_korean: 그러므로 아침에
  alternatives_korean:
  - 그리고 아침에
  - 그때 아침에
  lexicon: WLC, HALOT
  rationale: 절 시작의 וְהָיָה는 단순 존재보다 다음 지시로 이어지는 흐름을 여는 용법이어서, 한국어에서는 ‘그러므로’로 명령의 연결감을 살렸습니다.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ תַּשְׁכִּים
  english_pob_choice: as soon as the sun rises, you must get up early
  chosen_korean: 해가 뜨자마자 일찍 일어나
  alternatives_korean:
  - 해가 뜰 때 곧바로 일어나
  - 해 뜰 무렵 일찍 일어나
  lexicon: WLC, HALOT
  rationale: ‘해가 뜨자마자’로 זמן의 긴박함을 살리고, תַּשְׁכִּים의 조기 기상 의미는 ‘일찍 일어나’로 자연스럽게 옮겼습니다.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  english_pob_choice: spread out against the city
  chosen_korean: 성을 향해 퍼져 나가십시오
  alternatives_korean:
  - 성을 향해 진격하십시오
  - 성을 향해 펼쳐 나가십시오
  - 성을 향해 공격하십시오
  lexicon: WLC, HALOT
  rationale: פשט는 군사적 문맥에서 진격·급습의 폭넓은 움직임을 가리킬 수 있어, 이미지를 과도하게 특정하지 않으면서도 전진 배치를 드러내는 ‘퍼져 나가십시오’를 택했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And look
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 보십시오
  lexicon: WLC, HALOT
  rationale: 주의 환기 표지로서의 וְהִנֵּה를 살리기 위해, 현대적이면서도 직접적인 ‘그리고 보십시오’로 옮겼습니다.
- source_word: יֹצְאִים אֵלֶיךָ
  english_pob_choice: come out to you
  chosen_korean: 당신에게 나올 때
  alternatives_korean:
  - 당신을 향해 나올 때
  - 당신에게 맞서 나올 때
  lexicon: WLC, HALOT
  rationale: אֵלֶיךָ의 기본 방향성은 ‘당신에게’이므로, 문맥상 적대성이 암시되더라도 본문이 직접 말하는 방향성을 우선해 보존했습니다.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  english_pob_choice: you shall do to him as your hand finds
  chosen_korean: 손이 닿는 대로 그에게 하십시오
  alternatives_korean:
  - 힘이 미치는 만큼 그에게 하십시오
  - 당신의 손이 찾는 대로 그에게 하십시오
  lexicon: WLC, HALOT
  rationale: ‘your hand finds’의 히브리어 관용구는 능력·기회 범위를 뜻하므로, 한국어 관용으로 의미를 드러내면서도 과도한 해석을 피하는 표현을 택했습니다.
theological_decisions:
- issue: 히브리어 관용구 כַּאֲשֶׁר תִּמְצָא יָדֶךָ 의 처리
  chosen_reading: 직역 요소를 일부 남기되 의미는 ‘능력/기회에 따른다’로 이해되도록 했습니다.
  alternative_readings:
  - ‘힘 닿는 대로’
  - ‘기회가 닿는 대로’
  - ‘할 수 있는 대로’
  rationale: 이 구절은 후대 독자가 읽을 때 손 자체보다 행위의 범위를 뜻하는 관용구임을 알아야 하므로, 본문 투명성과 이해 가능성을 함께 확보하는 방향을 택했습니다.
  doctrine_reference: 문맥상 전쟁 명령의 관용 표현에 대한 번역 원칙
