  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
  footnotes:
  - marker: a
    text: 'Or, more formally, ''Who would give this people into my hand? Then I would remove Abimelek.'' The Hebrew uses an idiom of wish: ''Who will give...?'''
    reason: lexical_alternative
  - marker: b
    text: The challenge 'Increase your army and come out' is likely a taunt directed at Abimelek, whether spoken directly or rhetorically.
    reason: cultural_note
translation:
  language: ko
  text: 만약 이 백성이 내 손에 있다면[a], 곧 내가 아비멜렉을 쫓아내겠습니다. 그리고 아비멜렉에게 말했습니다[b]. “네 군대를 늘리고 나와 보아라!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 “누가 이 백성을 내 손에 주겠습니까? 그러면 내가 아비멜렉을 쫓아내겠습니다.”라는 뜻의 바람 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 도전은 아비멜렉에게 직접 던진 말일 수도 있고, 수사적으로 한 말일 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  english_pob_choice: If only
  chosen_korean: 만약 …이라면
  alternatives_korean:
  - 오직 …라면
  - 누가 주겠습니까
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 질문이 아니라 바람의 표현이므로, 한국어에서는 자연스러운 조건적 탄원으로 옮겼습니다.
- source_word: בְּיָדִי
  english_pob_choice: in my hand
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 권세 아래
  - 내 통제 아래
  lexicon: HALOT
  rationale: 직역 이미지를 살리되 한국어에서도 곧바로 이해되는 권세의 은유로 유지했습니다.
- source_word: וְאָסִירָה אֶת אֲבִימֶלֶךְ
  english_pob_choice: I would remove Abimelek
  chosen_korean: 내가 아비멜렉을 쫓아내겠습니다
  alternatives_korean:
  - 내가 아비멜렉을 제거하겠습니다
  - 내가 아비멜렉을 물러나게 하겠습니다
  lexicon: HALOT
  rationale: סוּר의 사역형은 '치워 버리다/제거하다'의 폭을 가지지만, 문맥상 위협과 축출의 뉘앙스가 강하므로 과도한 해석 없이 '쫓아내다'로 옮겼습니다.
- source_word: רַבֶּה צְבָאֲךָ וָצֵאָה
  english_pob_choice: Increase your army and come out!
  chosen_korean: 네 군대를 늘리고 나와 보아라!
  alternatives_korean:
  - 네 군세를 늘리고 나와라
  - 군대를 불리고 나와 보아라
  lexicon: HALOT
  rationale: צָבָא를 '군대'로, רַבֶּה와 יצא의 도전적 명령을 한국어 전투 맥락에 맞게 자연스럽고 직접적인 조롱으로 살렸습니다.
theological_decisions:
- issue: 아비멜렉에게 한 말의 화행
  chosen_reading: 직접적인 명령문으로 보되, 실제 대화인지 조롱 섞인 도전인지 열어 둡니다.
  alternative_readings:
  - 수사적 독백
  - 직접 연설
  rationale: 영어 POB 주석처럼 히브리어는 아비멜렉에게 던지는 도전으로도, 수사적 발화로도 읽힐 수 있어 해석을 과도하게 단정하지 않았습니다.
  doctrine_reference: 서사시의 화행 보존
