revisions:
- from: 만약 이 백성이 내 손에 있다면[a], 곧 내가 아비멜렉을 쫓아내겠습니다. 그리고 아비멜렉에게 말했습니다[b]. “네 군대를 늘리고 나와 보아라!”
  to: 누가 이 백성을 내 손에 넘겨주기만 한다면[a], 그러면 내가 아비멜렉을 없애겠습니다. 그리고 그는 아비멜렉에게 말했습니다[b]. “네 군대를 늘려서 나오십시오!”
