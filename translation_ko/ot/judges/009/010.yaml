base_translation:
  language: en
  yaml_path: translation/ot/judges/009/010.yaml
  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: ko
  text: 그때 나무들이 무화과나무에게 말했습니다. “오십시오, 당신이 우리를 다스리십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “네가 와서 우리를 다스려라”에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어의 자연스러운 시간 순서 표현인 ‘그때’로 옮겨, 이야기의 다음 동작이 이어짐을 드러냈습니다.
- source_word: הָעֵצִים
  english_pob_choice: the trees
  chosen_korean: 나무들이
  alternatives_korean:
  - 그 나무들이
  - 수목들이
  lexicon: HALOT
  rationale: 의인화된 비유에서 의사소통 주체인 ‘나무들’을 직역해 유지했습니다.
- source_word: לַתְּאֵנָה
  english_pob_choice: to the fig tree
  chosen_korean: 무화과나무에게
  alternatives_korean:
  - 무화과나무에게로
  - 무화과나무한테
  lexicon: HALOT
  rationale: תְּאֵנָה는 여기서 열매가 아니라 나무를 가리키므로, 목적어 표지는 한국어 조사 ‘에게’로 자연스럽게 살렸습니다.
- source_word: לְכִי אַתְּ
  english_pob_choice: You come
  chosen_korean: 오십시오, 당신이
  alternatives_korean:
  - 와라, 네가
  - 오라, 네가
  lexicon: HALOT
  rationale: 여성 단수 명령형과 이어지는 독립 대명사의 강조를 살리기 위해, 명령은 공손한 직접 요청형 ‘오십시오’로, 강조는 ‘당신이’로 반영했습니다.
- source_word: מָלְכִי עָלֵינוּ
  english_pob_choice: reign over us
  chosen_korean: 우리를 다스리십시오
  alternatives_korean:
  - 우리를 통치하십시오
  - 우리 위에 왕이 되십시오
  lexicon: HALOT
  rationale: מלך의 통치 의미를 한국어 동사 ‘다스리다’로 옮기되, ‘over us’의 지배 관계는 목적어 구조로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 의인화된 비유 언어를 어떻게 보존할지
  chosen_reading: 나무들이 무화과나무에게 말하는 장면을 그대로 유지했습니다.
  alternative_readings:
  - 비유적 의미를 풀어 설명하는 번역
  - ‘나무들’ 대신 ‘숲의 나무들’로 완화하는 번역
  rationale: 본문은 우화적 대화 형식을 통해 왕정 요청을 풍자하므로, 설명을 덧붙이지 않고 장면 자체를 보존하는 것이 수사와 의미를 가장 잘 전달합니다.
  doctrine_reference: 성경 본문 해석의 문학적 장르 보존
