id: JDG.9.51
reference: Judges 9:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִגְדַּל עֹז֮ הָיָ֣ה בְ/תוֹךְ הָ/עִיר֒ וַ/יָּנֻ֨סוּ שָׁ֜מָּ/ה כָּל הָ/אֲנָשִׁ֣ים וְ/הַ/נָּשִׁ֗ים וְ/כֹל֙ בַּעֲלֵ֣י הָ/עִ֔יר וַֽ/יִּסְגְּר֖וּ בַּעֲדָ֑/ם וַֽ/יַּעֲל֖וּ עַל גַּ֥ג הַ/מִּגְדָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
  footnotes:
  - marker: a
    text: Or 'a fortified tower.' The Hebrew phrase literally combines 'tower' with 'strength,' emphasizing its defensive character.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the principal men of the city.' The Hebrew 'owners/masters of the city' is an idiom for the city's leading men, not necessarily every inhabitant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 성읍 한가운데에 견고한 망대가 있었습니다.[a] 모든 남자와 여자와 성읍의 모든 지도자들이[b] 그곳으로 달아나, 안에 들어가 문을 닫아걸고, 망대의 지붕으로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요새화된 망대’. 히브리어는 ‘망대’와 ‘힘/견고함’을 결합하여 그 방어적 성격을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성읍의 모든 유력자들’. 히브리어 ‘성읍의 주인들’은 문자적으로는 ‘주인/소유자들’이지만, 이 문맥에서는 성읍의 지도층을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  english_pob_choice: a strong tower
  chosen_korean: 견고한 망대
  alternatives_korean:
  - 강한 망대
  - 튼튼한 망대
  - 요새화된 망대
  lexicon: HALOT
  rationale: מִגְדַּל은 망대, עֹז는 힘·견고함을 뜻하므로 ‘견고한 망대’가 방어적 성격을 자연스럽게 살립니다.
- source_word: בְּתוֹךְ הָעִיר
  english_pob_choice: in the middle of the city
  chosen_korean: 성읍 한가운데에
  alternatives_korean:
  - 성읍 안에
  - 성읍 내부에
  lexicon: HALOT
  rationale: בְּתוֹךְ는 ‘가운데/한복판’의 공간감을 가지므로, 단순한 ‘안에’보다 ‘한가운데에’가 원문에 더 가깝습니다.
- source_word: בַּעֲלֵי הָעִיר
  english_pob_choice: all the leaders of the city
  chosen_korean: 성읍의 모든 주인들
  alternatives_korean:
  - 성읍의 모든 지도자들
  - 성읍의 모든 원로들
  - 성읍의 모든 유력자들
  lexicon: HALOT
  rationale: בַּעֲלֵי는 문자적으로 ‘주인들/소유자들’이지만, 지닌 사람들의 지위가 아니라 성읍의 주도적 인물들을 가리키는 관용이므로 직설적으로 ‘주인들’로 옮겨 원뜻의 긴장을 보존했습니다.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  english_pob_choice: shut themselves in
  chosen_korean: 안으로 몸을 가두었고
  alternatives_korean:
  - 스스로를 가두었고
  - 닫아 걸어 잠갔고
  - 문을 닫아걸었고
  lexicon: HALOT
  rationale: ‘그들 뒤로/그들을 위해 닫다’는 뜻을 한국어로는 자가-폐쇄를 드러내는 표현이 적절하므로, 해석을 과도하게 더하지 않으면서도 결과를 분명히 하는 ‘안으로 몸을 가두었다’로 옮겼습니다.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  english_pob_choice: they went up onto the roof of the tower
  chosen_korean: 망대 지붕으로 올라갔습니다
  alternatives_korean:
  - 망대 꼭대기로 올라갔습니다
  - 망대 옥상으로 올라갔습니다
  lexicon: HALOT
  rationale: גַּג은 건물의 ‘지붕’이므로, ‘꼭대기’보다 건축적 세부를 살린 ‘지붕’이 적합합니다.
