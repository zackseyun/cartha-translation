revisions:
- from: 그런데 성읍 한가운데에 견고한 망대가 있었는데, 모든 남자와 여자와 성읍의 모든 주인들이 그리로 달아나 안으로 몸을 가두었고, 망대 지붕으로 올라갔습니다.[a][b]
  to: 그런데 성읍 한가운데에 견고한 망대가 있었습니다.[a] 모든 남자와 여자와 성읍의 모든 지도자들이[b] 그곳으로 달아나, 안에 들어가 문을 닫아걸고, 망대의 지붕으로 올라갔습니다.
  rationale: 문맥상 관용어인 בַּעֲלֵי הָעִיר을 ‘지도자들’로 옮겨 의미를 정확히 하고, 문자적 표현 가능성은 각주에 남겼습니다. 자가 폐쇄를 나타내는 동사구는 자연스러운 한국어로 다듬되, 문을 닫아 안에 머문다는 원문의 의미를 유지했습니다. 각주 표지도 해당 번역어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:09:47Z'
