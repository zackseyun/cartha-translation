  terminology: ‘견고한 망대’, ‘성읍’, ‘망대의 지붕’은 적절합니다. בַּעֲלֵי הָעִיר은 이 문맥에서 ‘주인들’보다 ‘지도자들’이 적합하며, 대안 번역은 각주에서 보존합니다.
