base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
  footnotes:
  - marker: a
    text: Or 'drove Ga'al and his brothers out so that they could not dwell in Shechem.' The Hebrew infinitive construction expresses exclusion from residing there.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비멜렉은 아루마에 머물렀고, 스불은 가알과 그의 형제들을 세겜에서 살지 못하게 쫓아냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가알과 그의 형제들을 세겜에서 내쫓았습니다.’ 히브리어 부정사 구문은 그들이 세겜에 거주하지 못하도록 배제되었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: stayed
  chosen_korean: 머물렀고
  alternatives_korean:
  - 있었고
  - 거주했고
  - 머물렀습니다
  lexicon: HALOT
  rationale: 전투 이후의 서술 맥락에서 단순한 정주보다 일시적 체류의 뉘앙스를 살려 ‘머물렀고’로 옮겼습니다.
- source_word: בָּאָרוּמָה
  english_pob_choice: in Arumah
  chosen_korean: 아루마에
  alternatives_korean:
  - 아루마에서
  - 아루마 안에
  lexicon: 지명 음역
  rationale: 지명은 음역하고, 전치사는 한국어 자연스러운 부사격 조사 ‘-에’로 처리했습니다.
- source_word: וַיְגָרֶשׁ
  english_pob_choice: drove ... out
  chosen_korean: 내쫓았습니다
  alternatives_korean:
  - 쫓아냈습니다
  - 추방했습니다
  - 몰아냈습니다
  lexicon: HALOT
  rationale: גרשׁ의 제거·축출 의미를 살리면서도 현대 한국어에서 자연스럽고 강한 동작으로 표현했습니다.
- source_word: מִשֶּׁבֶת בִּשְׁכֶם
  english_pob_choice: from dwelling in Shechem
  chosen_korean: 세겜에 거주하지 못하도록
  alternatives_korean:
  - 세겜에 살지 못하게
  - 세겜에 머물지 못하도록
  - 세겜에서 거주하지 못하도록
  lexicon: HALOT
  rationale: 히브리어 부정 부정사 구문이 ‘거주 금지/배제’의 결과를 나타내므로, 단순한 이동이 아니라 거주 자체를 막는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 가알과 그의 형제들을 ‘내쫓다’의 의미 강도
  chosen_reading: 단순 이동이 아니라 세겜 거주권에서 배제된 상황으로 읽었습니다.
  alternative_readings:
  - 그저 떠나게 된 것으로 약화시키는 읽기
  - 법적 추방으로 과도하게 규정하는 읽기
  rationale: 히브리어의 גרשׁ와 ‘from dwelling’ 구문은 실제 거주 배제를 가리키므로, 서술의 강도를 유지하되 법적 절차까지는 덧붙이지 않았습니다.
  doctrine_reference: 서술 본문 해석 원칙
