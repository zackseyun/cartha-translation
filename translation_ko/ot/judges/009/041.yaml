    text: 또는 ‘가알과 그의 형제들을 세겜에 거주하지 못하도록 내쫓았습니다.’ 히브리어 부정사 구문은 그곳에 사는 것을 배제함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
