theological_decisions:
- issue: 가알과 그의 형제들을 ‘내쫓다’의 의미 강도
  chosen_reading: 단순 이동이 아니라 세겜 거주권에서 배제된 상황으로 읽었습니다.
  alternative_readings:
  - 그저 떠나게 된 것으로 약화시키는 읽기
  - 법적 추방으로 과도하게 규정하는 읽기
  rationale: 히브리어의 גרשׁ와 ‘from dwelling’ 구문은 실제 거주 배제를 가리키므로, 서술의 강도를 유지하되 법적 절차까지는 덧붙이지 않았습니다.
  doctrine_reference: 서술 본문 해석 원칙
