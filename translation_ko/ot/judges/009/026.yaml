  source_fidelity: 히브리어 עֶבֶד는 ‘에벳’이며, 초안의 ‘게델’은 인명 표기가 잘못되었습니다. וַיַּעַבְרוּ בִּשְׁכֶם의 이동 의미도 단순히 ‘이르렀고’보다 ‘스겜으로 들어왔습니다’가 더 잘 드러냅니다. בַּעֲלֵי שְׁכֶם은 도시의 유력자·지도자들을 가리키므로 ‘스겜의 지도자들’은 적절합니다.
  naturalness: ‘신뢰를 두었더라’는 현대 표준어 합쇼체에 맞지 않고 다소 부자연스럽습니다. ‘그를 신뢰했습니다’가 자연스럽고 문체 요구에도 맞습니다.
  terminology: 가알, 에벳, 스겜의 음역을 사용했습니다. ‘지도자들’은 בַּעֲלֵי의 사회정치적 의미를 현대 한국어로 자연스럽게 전달합니다.
