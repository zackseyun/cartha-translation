  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: ko
  text: 사사기 9:26 에벳의 아들 가알이 그의 형제들과 함께[a] 와서 스겜으로 들어왔습니다[b]. 스겜의 지도자들은 그를 신뢰했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그리고 그의 형제들’입니다. 히브리어 접속사는 단순히 ‘그리고’이지만, 문맥상 ‘그의 형제들과 함께’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘스겜을 지나갔습니다’ 또는 ‘스겜으로 건너 들어왔습니다’. 히브리어 동사는 ‘건너다, 지나가다’를 뜻할 수 있으며, 여기서 정확한 이동의 뉘앙스는 논의됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘스겜의 영주들’. 히브리어는 직역하면 ‘스겜의 바알림(בעלי)’이며, 그 도시의 유력자들 또는 권력자들을 가리킵니다.
    reason: lexical_alternative
