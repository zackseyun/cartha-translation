id: JDG.9.25
reference: Judges 9:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ ל/וֹ֩ בַעֲלֵ֨י שְׁכֶ֜ם מְאָרְבִ֗ים עַ֚ל רָאשֵׁ֣י הֶ/הָרִ֔ים וַ/יִּגְזְל֗וּ אֵ֛ת כָּל אֲשֶׁר יַעֲבֹ֥ר עֲלֵי/הֶ֖ם בַּ/דָּ֑רֶךְ וַ/יֻּגַּ֖ד לַ/אֲבִימֶֽלֶךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
  footnotes:
  - marker: a
    text: Or 'the citizens of Shechem' or 'the lords of Shechem.' The Hebrew expression literally means 'the בעלי of Shechem' and can denote the city's leading men or power-holders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 세겜의 우두머리들이 그를 치려고 산꼭대기들에 매복병들을 두었고, 길에서 그들 위로 지나가는 모든 사람을 약탈하였으며, 그것이 아비멜렉에게 알려졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세겜의 우두머리들’은 히브리어 ‘세겜의 바알들(בעלי)’에 해당하며, 도시의 지도층 또는 권력자들을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  english_pob_choice: the leaders of Shechem
  chosen_korean: 세겜의 우두머리들
  alternatives_korean:
  - 세겜의 지도자들
  - 세겜의 주인들
  - 세겜의 시민들
  lexicon: HALOT
  rationale: בַּעֲלֵי는 문자적으로는 ‘~의 주인들/소유자들’이지만, 문맥상 도시의 권력자들을 가리키므로 한국어에서는 사회·정치적 힘을 드러내는 ‘우두머리들’로 옮겼습니다.
- source_word: וַיָּשִׂימוּ לוֹ ... מְאָרְבִים
  english_pob_choice: set men in ambush for him
  chosen_korean: 그를 치려고 ... 매복병들을 두었고
  alternatives_korean:
  - 그를 향해 매복자들을 배치하였고
  - 그를 노리고 숨어 있는 사람들을 두었고
  lexicon: HALOT
  rationale: שׂים + 목적어 + מְאָרְבִים은 ‘매복을 놓다/매복하다’의 관용적 표현이므로, 자연스러운 한국어로 풀어 ‘매복병들을 두다’로 옮겼습니다.
- source_word: עַל רָאשֵׁי הֶהָרִים
  english_pob_choice: on the tops of the mountains
  chosen_korean: 산꼭대기들에
  alternatives_korean:
  - 산들의 꼭대기에
  - 산정상들에
  - 산마루에
  lexicon: HALOT
  rationale: 직역하면 ‘산들의 머리 위에’이지만, 지형적 높은 지점을 가리키는 표현이므로 간결하고 자연한 ‘산꼭대기들에’로 옮겼습니다.
- source_word: וַיִּגְזְלוּ
  english_pob_choice: they robbed
  chosen_korean: 약탈하였으며
  alternatives_korean:
  - 강탈하였으며
  - 빼앗았으며
  - 탈취하였으며
  lexicon: HALOT
  rationale: גזל은 폭력적으로 빼앗는 행위를 가리키며, 길손들을 대상으로 한 공격적 착취를 드러내기 위해 ‘약탈하다’를 선택했습니다.
theological_decisions:
- issue: 수동형 보고 표현 וַיֻּגַּד לַאֲבִימֶלֶךְ
  chosen_reading: 그것이 아비멜렉에게 알려졌습니다
  alternative_readings:
  - 아비멜렉에게 보고되었습니다
  - 아비멜렉이 전해 들었습니다
  rationale: 히브리어 수동형은 행위자를 밝히지 않으므로, 한국어에서도 비인칭 수동인 ‘알려졌습니다’로 처리해 서술의 흐름을 보존했습니다.
  doctrine_reference: 서사 문맥의 비인칭 수동 유지
