- from: 그때 세겜의 우두머리들이 그를 치려고 산꼭대기들에 매복병들을 두었고, 길에서 그들 위로 지나가는 모든 사람을 약탈하였으며, 그것이 아비멜렉에게 알려졌습니다.[a]
  to: 그때 세겜의 우두머리들[a]이 그를 치려고 산들의 꼭대기에 매복병들을 배치했고, 길을 따라 그들 곁을 지나가는 모든 사람을 약탈했으며, 이 일이 아비멜렉에게 알려졌습니다.
  rationale: 원문의 서술 순서와 비인칭 수동 보고 표현을 유지하되, עֲלֵיהֶם의 문맥상 이동 관계를 자연스러운 한국어로 명확히 했습니다. 또한 산의 복수 표현과 지시어를 다듬고, 어휘 각주 표지를 설명 대상 바로 뒤로 옮겼습니다.
