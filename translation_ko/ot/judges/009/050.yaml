base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
  footnotes:
  - marker: a
    text: Or 'encamped in Thebez'; the Hebrew preposition can be rendered more literally that way, but in this military context it likely means he set camp against the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아비멜렉은 데베스로 가서 데베스를 향해 진을 치고 그 성읍을 함락시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘데베스에 진을 치고’ 또는 ‘데베스 안에 진을 치고’입니다. 히브리어 전치사는 이러한 뜻도 될 수 있으나, 이 군사 문맥에서는 성읍을 향해 진을 친 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 행군했습니다
  lexicon: HALOT
  rationale: 서술 연속을 자연스럽게 잇는 동사로 처리하되, 원문의 단순한 이동 동사를 과장하지 않기 위해 ‘가서’를 택했습니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -을 향해
  alternatives_korean:
  - 에게
  - 을/로
  lexicon: HALOT
  rationale: 목적지 방향을 분명히 하면서도 뒤의 포위·공격 문맥과 어울리도록 ‘-을 향해’로 옮겼습니다.
- source_word: וַיִּחַן בְּ/תֵבֵץ
  english_pob_choice: camped against Thebez
  chosen_korean: 데베스에 진을 치고
  alternatives_korean:
  - 데베스 안에 진을 치고
  - 데베스에 주둔하고
  lexicon: HALOT
  rationale: 히브리어 בְּ는 여기서 성읍 내부보다 군사적 포위 태세를 드러내므로, 한국어에서는 ‘진을 치고’로 간결하게 반영했습니다.
- source_word: וַיִּלְכְּדָהּ
  english_pob_choice: captured it
  chosen_korean: 그것을 함락시켰습니다
  alternatives_korean:
  - 그것을 점령했습니다
  - 그것을 사로잡았습니다
  lexicon: HALOT
  rationale: 성읍을 대상으로 한 לָכַד의 군사적 결과를 한국어 독자에게 분명히 보이기 위해 ‘함락시키다’를 사용했습니다.
