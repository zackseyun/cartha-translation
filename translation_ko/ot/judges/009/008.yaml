translation:
  language: ko
  text: 나무들이 한 번 왕을 세우기 위해 자기들 위에 기름을 부으러 가서, 감람나무에게 말했습니다. 「너는 우리를 다스리라」[a]
  philosophy: optimal-equivalence
  footnotes:
