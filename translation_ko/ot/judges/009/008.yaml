    text: 히브리어는 ‘가서 가다’의 강조적 표현을 사용합니다. 한국어에서는 이를 ‘한 번’으로 자연스럽게 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹוךְ הָלְכוּ
  english_pob_choice: once went
  chosen_korean: 한 번 … 가서
  alternatives_korean:
