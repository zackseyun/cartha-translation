  lexicon: WLC/구문상 강조
  rationale: 히브리어의 부정사 절대형+동사형 반복으로 나타나는 강조를 한국어에서는 “한 번”으로 자연스럽게 살려, 서술의 시작을 과장 없이 강조했습니다.
