  lexicon: HALOT
  rationale: 의인화된 화자에게 말하는 장면이므로 한국어 성경의 자연스러운 식물명인 ‘감람나무’로 옮겼습니다.
- source_word: מְלֹכָה עָלֵינוּ
  english_pob_choice: Reign over us
  chosen_korean: 너는 우리를 다스리라
