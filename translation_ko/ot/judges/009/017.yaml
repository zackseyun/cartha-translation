id: JDG.9.17
reference: Judges 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
  footnotes:
  - marker: a
    text: Literally, 'threw his life in front,' an idiom meaning he exposed himself to deadly danger.
    reason: lexical_alternative
  - marker: b
    text: Or 'rescued you from the power of Midian.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아버지가 너희를 위하여 싸우고[a], 자기 생명을 내던져 앞에 두었으며[b], 미디안의 손에서 너희를 건져내었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘생명을 앞에 던졌다’는 뜻으로, 자신을 죽음의 위험에 노출시켰다는 관용입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘미디안의 권세에서 너희를 건져내었기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 왜냐하면
  - ~한 까닭입니다
  lexicon: HALOT
  rationale: 문맥상 앞선 고발을 뒷받침하는 이유를 제시하므로, 단순한 관계절보다 원인·이유를 드러내는 한국어가 적절합니다.
- source_word: נִלְחַם עֲלֵיכֶם
  english_pob_choice: fought for you
  chosen_korean: 너희를 위하여 싸우고
  alternatives_korean:
  - 너희 편에서 싸우고
  - 너희를 위해 전쟁하고
  lexicon: HALOT
  rationale: עַל의 여기서의 방향성은 ‘~을 위해/편에서’의 이익 관계이므로, 자연스러운 현대 한국어로 옮기되 대리·편들기의 뉘앙스를 살렸습니다.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  english_pob_choice: cast his life in front of him
  chosen_korean: 자기 생명을 내던져 앞에 두었으며
  alternatives_korean:
  - 자기 생명을 앞에 던졌으며
  - 자기 생명을 내어 던졌으며
  - 생명을 걸었으며
  lexicon: HALOT
  rationale: 직역하면 ‘생명을 앞에 던지다’이지만, 한국어에서는 위험에 자신을 노출시키는 관용을 반영해 의미를 살리면서도 원문의 이미지가 보이도록 옮겼습니다.
- source_word: מִיַּד מִדְיָן
  english_pob_choice: from the hand of Midian
  chosen_korean: 미디안의 손에서
  alternatives_korean:
  - 미디안의 권세에서
  - 미디안의 손아귀에서
  lexicon: HALOT
  rationale: ‘손’은 히브리어의 지배·권세 관용구이므로, 본문 이미지를 유지하는 쪽을 택했습니다.
theological_decisions:
- issue: 문장의 종결과 인용 처리
  chosen_reading: 히브리어 본문의 연결 구조를 따라 이유절을 한국어 종결형으로 자연스럽게 마무리했습니다.
  alternative_readings:
  - ‘~한 자입니다’ 식의 명사절 처리
  - 앞절과 더 강하게 결합한 종속절 처리
  rationale: 본절은 이전 맥락을 받는 설명문이므로, 현대 합쇼체에서 읽기 자연스럽게 이유를 드러내는 종결을 사용했습니다.
  doctrine_reference: 문맥·담화 구조 우선 원칙
- issue: ‘생명을 내던져 앞에 두다’의 의미 범위
  chosen_reading: 원문 관용을 과도하게 풀이하지 않고, 죽음의 위험을 무릅쓴 헌신을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘목숨을 걸다’로 완전 의역
  - ‘죽음에 내주다’로 강화
  rationale: POB의 영어가 지닌 관용적 직역성을 한국어에서도 일정 부분 보존해, 기드온의 자기희생을 약화시키지 않으면서도 이해 가능하게 했습니다.
  doctrine_reference: 원문 이미지 보존 원칙
