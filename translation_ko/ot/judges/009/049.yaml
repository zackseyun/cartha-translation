id: JDG.9.49
reference: Judges 9:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
  footnotes:
  - marker: a
    text: Or 'stronghold' for 'inner chamber'; the Hebrew term likely refers to the enclosed refuge within the tower rather than the tower itself.
    reason: lexical_alternative
  - marker: b
    text: Literally 'each man his branch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 모든 백성도 저마다 나뭇가지를 하나씩[a] 베어 아비멜렉을 따라갔습니다. 그들은 그것들을 그 내부 피신처[b] 위에 놓고, 그들 위에 있는 그 피신처에 불을 질렀습니다. 그리하여 세겜 망루의 모든 사람도, 곧 남자와 여자 약 천 명이 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘각 사람이 자기 가지’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הַצְּרִיחַ는 뒤의 ‘망루’(מִגְדַּל)와 구별되며, 탑 전체보다 그 안의 폐쇄된 방어용 피신처를 가리킬 가능성이 큽니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... אִישׁ שׂוֹכֹה
  english_pob_choice: cut down a branch each
  chosen_korean: 저마다 가지를 하나씩 베어 가지고
  alternatives_korean:
  - 각자 가지 하나를 베어
  - 한 사람씩 가지를 잘라
  lexicon: HALOT
  rationale: 히브리어는 분배적 표현으로 각 사람이 가지 하나를 베는 장면을 말하므로, 한국어에서도 ‘저마다/하나씩’으로 그 분배성을 살렸습니다.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  english_pob_choice: they went after Abimelech
  chosen_korean: 아비멜렉을 따라가서
  alternatives_korean:
  - 아비멜렉 뒤를 따라가서
  - 아비멜렉을 뒤따라
  lexicon: HALOT
  rationale: 직역의 ‘뒤를 따라가다’보다 군사적 맥락에서 자연스러운 ‘따라가다’가 원문의 진행 방향을 잘 드러냅니다.
- source_word: הַצְּרִיחַ
  english_pob_choice: the inner chamber
  chosen_korean: 망루
  alternatives_korean:
  - 내부 방
  - 내실
  - 강한 요새
  lexicon: HALOT
  rationale: 이 문맥의 הַצְּרִיחַ는 탑 자체와 구별되는 방어용 구조물/내부 피신처를 가리키므로, 한국어에서는 독자가 즉시 이해할 수 있는 ‘망루’를 본문에 두고, 구조의 세부는 본문 흐름에서 보완했습니다.
- source_word: וַיַּצִּיתוּ ... בָּאֵשׁ
  english_pob_choice: set the inner chamber on fire over them
  chosen_korean: 그 위에 불을 놓아 망루에 붙였으므로
  alternatives_korean:
  - 그들 위로 망루에 불을 질렀으므로
  - 그들 위에서 망루를 불태웠으므로
  lexicon: HALOT
  rationale: 불을 붙여 그 구조물이 사람들 위로 덮치게 되는 장면이므로, ‘불을 놓다/붙이다’의 동작과 결과를 함께 드러냈습니다.
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  english_pob_choice: about a thousand men and women
  chosen_korean: 남자와 여자 약 천 명이 함께
  alternatives_korean:
  - 남녀 약 천 명
  - 남자와 여자 약 천 명
  lexicon: HALOT
  rationale: 끝의 ‘남자와 여자’는 성별을 함께 집계하는 표현이므로, 한국어에서도 성별 구분을 유지하되 ‘약 천 명’으로 개략 수치를 살렸습니다.
theological_decisions:
- issue: 폭력 서술의 직설성
  chosen_reading: 본문의 처형/소각 장면을 완화하지 않고, 사건의 잔혹성을 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - ‘불에 타 죽었습니다’처럼 완곡하게 처리
  - 사람들이 죽은 결과만 요약
  rationale: 사사기 9장의 서술은 폭력의 사실성을 통해 아비멜렉의 폭주와 세겜의 종말을 보여주므로, 본문의 충격을 덜어내지 않는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 사사기 9장의 서사적 심판 묘사
