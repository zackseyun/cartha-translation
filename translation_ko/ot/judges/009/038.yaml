  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
  footnotes:
  - marker: a
    text: Hebrew literally, “Where is your mouth now?”—an idiom mocking his earlier bold talk.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 스불이 그에게 말했습니다. “지금은 네 입이 어디 있느냐? ‘아비멜렉이 누구이기에 우리가 그를 섬기겠느냐?’라고 네가 말하지 않았느냐? 네가 업신여긴 저 백성이 바로 저 사람들이 아니냐? 이제 나가서 그들과 싸우라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “지금 네 입이 어디 있느냐?”라고 하며, 앞선 큰소리를 조롱하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא
  english_pob_choice: Where is your mouth now
  chosen_korean: 지금은 네 입이 어디 있느냐?
  alternatives_korean:
  - 그러면 네 입이 어디 있느냐?
  - 도대체 네 입이 어디 있느냐?
  lexicon: HALOT
  rationale: 히브리어의 조롱하는 관용구를 살리되, 한국어에서는 직역만으로 어색해질 수 있어 ‘지금은’으로 현재의 허세가 사라졌다는 뉘앙스를 살렸습니다.
- source_word: פִּיךָ
  english_pob_choice: your mouth
  chosen_korean: 네 입
  alternatives_korean:
  - 네 말
  - 네 허풍
  lexicon: HALOT
  rationale: 원문의 구체적 이미지인 ‘입’을 유지해 조롱의 날카로움을 보존했습니다.
- source_word: מָאַסְתָּה בּוֹ
  english_pob_choice: whom you despised
  chosen_korean: 네가 업신여긴
  alternatives_korean:
  - 네가 멸시한
  - 네가 거절한
  lexicon: HALOT
  rationale: 문맥상 단순한 거절보다 경멸과 조롱의 감정을 드러내는 ‘업신여기다’가 가장 가깝습니다.
- source_word: צֵא נָא עַתָּה וְהִלָּחֶם בּוֹ
  english_pob_choice: Go out now and fight against them
  chosen_korean: 이제 나가서 그들과 싸우라
  alternatives_korean:
  - 지금 나가서 그들과 싸우라
  - 이제 나가 그들과 전투를 벌이라
  lexicon: HALOT
  rationale: 군사적 명령을 자연스러운 현대 한국어 명령문으로 옮겼습니다. 히브리어의 ‘나가서 싸우다’라는 직설성을 유지했습니다.
