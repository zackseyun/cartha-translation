  source_fidelity: 히브리어의 ‘입’이라는 조롱의 이미지와 ‘업신여기다’의 뜻은 잘 반영했습니다. 그러나 הֲלֹא זֶה הָעָם는 ‘이 백성’이며, 현행의 ‘저 백성이 바로 저 사람들이’는 지시어와 집합명사의 수를 불필요하게 바꿉니다. 또한 마지막 בּוֹ는 단수이므로, 문맥상 아비멜렉을 가리키는 ‘그와’로 옮기는 것이 원문에 더 가깝습니다.
  naturalness: ‘저 백성이 바로 저 사람들이’는 ‘백성’과 ‘사람들’을 중복하여 어색합니다. ‘네가 업신여긴 이 백성이 아닙니까?’가 자연스럽고 직접적입니다. 지정된 현대 합쇼체에 맞추어 인용문의 종결도 ‘-습니까/-십시오’로 통일했습니다.
  terminology: 스불, 아비멜렉 및 ‘섬기다’는 적절합니다. ‘업신여긴’은 מָאַסְתָּ의 문맥상 경멸을 자연스럽게 드러냅니다.
