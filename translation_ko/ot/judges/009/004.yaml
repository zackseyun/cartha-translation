id: JDG.9.4
reference: Judges 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנוּ ל/וֹ֙ שִׁבְעִ֣ים כֶּ֔סֶף מִ/בֵּ֖יתּ בַ֣עַל בְּרִ֑ית וַ/יִּשְׂכֹּ֨ר בָּ/הֶ֜ם אֲבִימֶ֗לֶךְ אֲנָשִׁ֤ים רֵיקִים֙ וּ/פֹ֣חֲזִ֔ים וַ/יֵּלְכ֖וּ אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
  footnotes:
  - marker: a
    text: Or 'from the temple of Baal-berith.' The Hebrew says 'house,' which in a cultic setting can refer to a shrine or temple.
    reason: lexical_alternative
  - marker: b
    text: Or 'seventy silver shekels.' The Hebrew says literally 'seventy silver,' a monetary amount expressed by weight.
    reason: lexical_alternative
  - marker: c
    text: Literally 'empty and reckless men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바알브릿의 집[a]에서 은 일흔 개[b]를 그에게 주었습니다. 아비멜렉은 그것으로 무가치하고 경솔한 사람들[c]을 고용하였고, 그들은 그를 따랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바알브릿의 신전에서'. 히브리어의 '집'은 예배 맥락에서 신전이나 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '은 일흔 세겔'. 히브리어는 문자적으로 '은 일흔'이라고 하며, 무게로 표현된 화폐량입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '비어 있고 경솔한 사람들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֵּית בַּעַל בְּרִית
  english_pob_choice: from the house of Baal-berith
  chosen_korean: 바알브릿의 집에서
  alternatives_korean:
  - 바알브릿의 신전에서
  - 바알브릿의 성소에서
  lexicon: HALOT
  rationale: בַּיִת는 예배 맥락에서 신전/성소를 가리킬 수 있지만, 히브리어의 직설적 이미지를 살려 '집'을 유지했습니다.
- source_word: שִׁבְעִים כֶּסֶף
  english_pob_choice: seventy pieces of silver
  chosen_korean: 은 서른 개
  alternatives_korean:
  - 은 일흔 개
  - 은 일흔 세겔
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 '은'이며 금액을 뜻할 수 있으므로, 본문이 말하는 화폐량을 자연스럽게 드러내는 표현을 택했습니다. 다만 표준적으로는 '은 일흔 개'가 더 직역에 가깝습니다.
- source_word: אֲנָשִׁים רֵיקִים וּפֹחֲזִים
  english_pob_choice: worthless and reckless men
  chosen_korean: 무가치하고 경솔한 사람들
  alternatives_korean:
  - 쓸모없고 경솔한 사람들
  - 무가치하고 난폭한 사람들
  - 헛되고 경솔한 사람들
  lexicon: HALOT
  rationale: רֵיקִים의 '비어 있음'은 인물 평가로는 무가치함을, פֹחֲזִים은 성급하고 통제되지 않은 태도를 가리키므로 '경솔한'으로 옮겼습니다.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  english_pob_choice: and they followed him
  chosen_korean: 그들은 그를 따랐습니다
  alternatives_korean:
  - 그들은 그 뒤를 따랐습니다
  - 그들은 그를 뒤따랐습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 '그의 뒤를 갔다'는 단순한 이동보다 추종 관계를 뜻하므로, 한국어에서는 '따르다'가 가장 분명합니다.
theological_decisions:
- issue: 아비멜렉의 모집 수단이 되는 은의 기능
  chosen_reading: 본문은 은이 단순한 보상금이 아니라 폭력적 추종 세력을 만드는 수단으로 제시합니다.
  alternative_readings:
  - 단순 고용 계약의 대가로 볼 수 있음
  rationale: 문맥상 '무가치하고 경솔한 사람들'을 고용해 그를 따르게 만드는 장치이므로, 금액의 성격보다 그 결과를 드러내는 번역이 본문의 힘을 보존합니다.
  doctrine_reference: 본문 문맥 관찰
