    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ / Then ... said
  english_pob_choice: Then the trees said
  chosen_korean: 그때 나무들이 말했습니다
  alternatives_korean:
  - 그리고 나무들이 말했습니다
  - 그러자 나무들이 말했습니다
  lexicon: WLC narrative waw-consecutive / HALOT
  rationale: 서술 진행을 나타내는 וַ- 연속형을 한국어 서사에 자연스러운 「그때」로 옮겨 사건의 순서를 분명히 했습니다.
- source_word: הָעֵצִים
  english_pob_choice: the trees
  chosen_korean: 나무들이
  alternatives_korean:
  - 그 나무들이
  - 수목들이
  lexicon: HALOT
  rationale: 비유 속 인격화된 עֵצִים는 이 문맥에서 단순히 ‘나무들’이 가장 자연스럽고 직역에 가깝습니다.
- source_word: לַגָּפֶן
  english_pob_choice: to the vine
  chosen_korean: 포도나무에게
  alternatives_korean:
  - 덩굴나무에게
  - 포도덩굴에게
  lexicon: HALOT
  rationale: גֶּפֶן은 일반적으로 포도나무/포도덩굴을 가리키며, 비유의 대상이므로 한국어 성경체에서 익숙한 「포도나무」를 택했습니다.
- source_word: לְכִי ... מְלֹכִי
  english_pob_choice: Come, reign over us
  chosen_korean: 와서, 우리를 다스리십시오
  alternatives_korean:
  - 오십시오, 우리를 다스리십시오
  - 가서, 우리를 다스리십시오
  - 와서, 우리를 왕으로 다스리십시오
  lexicon: HALOT
  rationale: 히브리어의 հր정/초청 표현 לְכִי를 한국어에서는 「와서」로 옮기고, מְלֹכִי의 왕적 통치를 자연스럽게 「다스리십시오」로 표현했습니다. ‘왕이 되십시오’보다 원문의 통치 명령을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 비유적 인격화의 직접성
  chosen_reading: 나무들이 포도나무에게 실제로 말을 건네는 비유적 서술을 그대로 살렸습니다.
  alternative_readings:
  - 의인화된 나무들이라는 점을 완곡하게 처리함
  - ‘나무들이 묻습니다’처럼 의미를 약화함
  rationale: 이 본문은 여드담의 우화적 대화를 그대로 전달하는 장면이므로, 비유의 생동감을 약화시키지 않도록 직접화법을 유지했습니다.
  doctrine_reference: 문맥상 우화 서술의 보존
