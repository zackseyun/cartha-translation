  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
  footnotes:
  - marker: a
    text: Or, “You see the shadow of the mountains like men.”
    reason: lexical_alternative
translation:
  language: ko
  text: 갈이 그 무리를 보고 제불에게 말했습니다. “보십시오, 사람들이 산꼭대기에서 내려오고 있습니다.” 그러자 제불이 그에게 말했습니다. “당신은 산들의 그림자를 사람들로 보고 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았습니다
  - 바라보았습니다
  lexicon: HALOT
  rationale: 서사문의 וַיַּרְא는 기본적으로 ‘보다’의 직접적인 과거 서술이므로, 자연스러운 현대 한국어로 ‘보고’라고 옮겼습니다.
- source_word: הָעָם / עָם
  english_pob_choice: people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 군중
  - 군대
  lexicon: HALOT
  rationale: 히브리어 עָם은 여기서 특정 병력명보다 일반 집단을 가리키므로, 문맥상 중립적인 ‘백성’이 가장 가깝습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 직접 발화의 주의를 끄는 감탄사이므로, 현대 합쇼체에 맞게 ‘보십시오’로 옮겼습니다.
- source_word: צֵל הֶהָרִים
  english_pob_choice: the shadow of the mountains
  chosen_korean: 산들의 그림자
  alternatives_korean:
  - 산그늘
  - 산의 그림자
  lexicon: HALOT
  rationale: צֵל은 시각적 오인 대상이 되는 ‘그림자’가 자연스럽고, 복수형 ‘산들’은 원문의 복수 구성을 반영합니다.
theological_decisions:
- issue: 제불의 발화가 착시를 지적하는 방식
  chosen_reading: 제불은 산의 그림자를 실제 사람들처럼 보인다고 반박합니다.
  alternative_readings:
  - 산그늘이 사람처럼 보인다고 말합니다
  - 사람으로 착각한 것이라고 말합니다
  rationale: 본문의 핵심은 객관적 실재가 아니라 시각적 오해이므로, ‘그림자를 사람들처럼 보고 있다’는 표현으로 오인을 그대로 살렸습니다.
  doctrine_reference: 본문 서사와 관찰 인식의 차이
