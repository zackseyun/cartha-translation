  source_fidelity: ‘자기 자리’는 מָקוֹם(곳, 장소)을 충분히 반영하지 못하고 한국어에서 자리·좌석·지위로 이해될 수 있습니다. 또한 אִישׁ יִשְׂרָאֵל의 집합적 남성 지시를 ‘이스라엘 사람들’로 옮기면 성별 지시가 다소 약화됩니다. ‘이스라엘의 남자들’과 ‘저마다 자기 곳’은 집합적 주어와 분배적 단수를 모두 보존합니다.
  naturalness: ‘이스라엘의 남자들이 아비멜렉이 죽은 것을 보고, 저마다 자기 곳으로 갔습니다’는 현대 표준 한국어의 격식 있는 성경 서술로 자연스럽습니다. ‘자기 곳’은 다소 문어적이지만 원문의 비특정적인 ‘place’를 보존하는 데 적절합니다.
  terminology: 아비멜렉은 통용되는 음역이며 적절합니다. ‘죽은 것을 보고’는 מֵת의 상태 표현과 וַיִּרְאוּ의 단순 인지를 충실히 반영합니다.
