  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
  footnotes:
  - marker: a
    text: Or 'the thornbush.' The Hebrew אָטָד refers to a thorny shrub; 'bramble' is chosen as an idiomatic English rendering in this fable.
