translation:
  language: ko
  text: 그때 모든 나무가 가시덤불에게 말했습니다. “당신이 와서 우리를 다스리십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: אָטָד는 가시 돋친 관목을 가리키며, 이 문맥에서는 우화적 성격에 맞게 ‘가시덤불’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그리하여 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 전개를 한국어에서 자연스러운 시간 연결인 ‘그때’로 살리면서, 과도하게 직역된 연결을 피했습니다.
- source_word: הָעֵצִים
  english_pob_choice: all the trees
  chosen_korean: 모든 나무가
  alternatives_korean:
  - 나무들 모두가
  - 모든 나무들이
  lexicon: HALOT
  rationale: 집합적 주어를 자연스러운 한국어로 옮겼으며, 서사 흐름상 주격 조사까지 포함해 매끄럽게 처리했습니다.
- source_word: הָאָטָד
  english_pob_choice: the bramble
  chosen_korean: 가시덤불
  alternatives_korean:
  - 브램블
  - 가시나무덤불
  lexicon: HALOT
  rationale: אָטָד는 가시 돋친 관목을 가리키므로, 한국어에서 비유적 우화 문맥에 자연스러운 ‘가시덤불’을 택했습니다.
- source_word: לֵךְ אַתָּה
  english_pob_choice: You come
  chosen_korean: 당신이 와서
  alternatives_korean:
  - 오십시오
  - 와라, 네가
  lexicon: HALOT
  rationale: 직역된 ‘가라’보다 우화 속 초청/소환의 힘을 살리는 방향으로, 강조된 2인칭 אַתָּה를 ‘당신이’로 반영했습니다.
- source_word: מְלָךְ עָלֵינוּ
  english_pob_choice: reign over us
  chosen_korean: 우리를 다스리십시오
  alternatives_korean:
  - 우리 위에 군림하십시오
  - 우리의 왕이 되십시오
  lexicon: HALOT
  rationale: מְלָךְ는 왕권 행사를 뜻하므로 ‘다스리다’로 옮기되, 한국어에서 자연스러운 존대 명령형으로 마무리했습니다.
theological_decisions:
- issue: 우화적 왕권 요청의 어조
  chosen_reading: 가시덤불이 왕이 되어 자기들 위에 군림하는 우화적 역설을, 한국어에서도 직접적 명령과 존대형으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘지도하십시오’로 순화
  - ‘왕이 되십시오’로 직역
  rationale: 문맥상 이 발화는 식물 우화의 풍자적 초청이므로, 왕권 의미를 약화시키지 않으면서도 한국어 자연성을 확보해야 합니다.
  doctrine_reference: Judges 9:14의 우화적 풍자 구조
