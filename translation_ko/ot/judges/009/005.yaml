  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: ko
  text: 그는 자기 아버지의 집이 있는 오브라로 가서, 여룹바알의 아들들인 자기 형제 칠십 명을 한 돌 위에서[a] 죽였습니다. 그러나 여룹바알의 막내아들 요담은 몸을 숨겼으므로 남았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 돌 위에’입니다. 이 말은 칠십 명이 한곳에서, 한 돌과 관련된 장소에서 죽임을 당했음을 가리킬 수 있습니다.
    reason: cultural_note
