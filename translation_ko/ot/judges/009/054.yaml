  to: 그러자 그는 급히 자기 무기를 나르는 젊은이[a]를 불러 그에게 말했습니다. “네 칼을 뽑아 나를 죽여라. 사람들이 나를 두고 ‘여자가 그를 죽였다’고 말하지 않게 하여라.” 그러자 그의 무기 운반자인 젊은이가 그를 찔렀고, 그는 죽었습니다.
