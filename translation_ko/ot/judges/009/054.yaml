id: JDG.9.54
reference: Judges 9:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “his armor-bearer” for “the young man who carried his weapons” / “his young man.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 급히 자기 무기를 나르는 젊은이[a]를 불러 그에게 말했습니다. “네 칼을 뽑아 나를 죽여라. 사람들이 나를 두고 ‘여자가 그를 죽였다’고 말하지 않게 하여라.” 그러자 그의 무기 운반자인 젊은이가 그를 찔렀고, 그는 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 무기를 나르는 젊은이’입니다. 문맥상 ‘그의 무기 운반자’ 또는 ‘그의 병기 잡은 자’를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  english_pob_choice: Then he quickly called
  chosen_korean: 급히 불렀습니다
  alternatives_korean:
  - 서둘러 불렀습니다
  - 빠르게 불렀습니다
  lexicon: HALOT
  rationale: 서술 진행을 살리면서 מְהֵרָה의 속도감을 자연스러운 한국어로 옮겼습니다.
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  english_pob_choice: the young man who carried his weapons
  chosen_korean: 무기를 들고 있던 젊은 사람
  alternatives_korean:
  - 그의 무기 حامل(보유자)인 젊은 사람
  - 무기 운반자인 젊은 사람
  lexicon: HALOT
  rationale: 직역적인 '무기를 운반하는 자'보다 문맥이 분명한 '무기를 들고 있던 젊은 사람'이 מקור의 의미를 덜 해치면서도 한국어로 읽힙니다.
- source_word: שְׁלֹף חַרְבְּךָ
  english_pob_choice: Draw your sword
  chosen_korean: 네 칼을 뽑아
  alternatives_korean:
  - 네 칼을 꺼내
  - 네 칼을 빼
  lexicon: HALOT
  rationale: שְׁלֹף의 검을 칼집에서 빼내는 동작을 표준적인 '뽑다'로 옮겼습니다.
- source_word: וּמוֹתְתֵנִי
  english_pob_choice: and kill me
  chosen_korean: 나를 죽여라
  alternatives_korean:
  - 나를 목숨 끊어라
  - 나를 죽게 하라
  lexicon: HALOT
  rationale: 청유/명령의 직접성을 살리기 위해 가장 직설적인 표현을 택했습니다.
- source_word: יֹאמְרוּ לִי אִשָּׁה הֲרָגָתְהוּ
  english_pob_choice: lest they say of me, ‘A woman killed him.’
  chosen_korean: 사람들이 나를 두고 ‘여자가 그를 죽였다’고 말하지 못하게 하려는 것이다
  alternatives_korean:
  - 사람들이 나를 두고 ‘여자가 그를 죽였다’고 말하지 않게 하려는 것이다
  - 사람들이 나에 대해 ‘여자가 그를 죽였다’고 말하지 못하게 하려는 것이다
  lexicon: HALOT
  rationale: 수치의 뉘앙스를 유지하기 위해 직설화법을 보존했고, לִי는 한국어 관용에 맞게 '나를 두고'로 풀었습니다.
- source_word: וַיִּדְקְרֵהוּ
  english_pob_choice: So his young man pierced him through
  chosen_korean: 그의 젊은 사람이 그를 창으로 찔렀고
  alternatives_korean:
  - 그의 젊은 사람이 그를 찔러 죽였고
  - 그의 젊은 사람이 그를 꿰뚫었고
  lexicon: HALOT
  rationale: 찌름/관통의 폭력성을 살리면서 한국어에서 자연스럽게 읽히는 '창으로 찔렀다'로 옮겼습니다.
theological_decisions:
- issue: 보편적 성별 수치의 표현
  chosen_reading: ‘여자가 그를 죽였다’라는 말이 수치의 이유로 제시된 점을 그대로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘여인에게 죽었다’로 낮추는 읽기
  - 수치적 뉘앙스를 약화시켜 단순 사실만 전달하는 읽기
  rationale: 본문은 전투 패배 자체보다 ‘여자에게 죽임을 당했다’는 수치를 강조하므로, 그 문화적 긴장감을 흐리지 않도록 직설 표현을 유지했습니다.
  doctrine_reference: 본문 해석상 사회적 수치와 명예의 문제
- issue: 주어 지시의 유지
  chosen_reading: ‘그의 젊은 사람’이라는 반복을 살려 첫 번째와 같은 인물을 가리키는 흐름을 유지했습니다.
  alternative_readings:
  - ‘그의 병기 잡은 자’로 한 번에 해석하는 읽기
  - ‘종’으로 일반화하는 읽기
  rationale: 히브리어의 반복을 따라가야 서술의 연속성과 화행이 분명해지므로, 동일 인물을 가리키는 반복을 번역에서도 보존했습니다.
  doctrine_reference: 서사 문맥의 지시어 일관성
