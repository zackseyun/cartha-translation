    rationale: פֶּן יֹאמְרוּ는 ‘사람들이 … 말하지 않게’라는 목적을 나타냅니다. ‘하려는 것이다’는 화자의 동기를 해설적으로 덧붙이며, 직접 명령의 흐름을 약화합니다.
