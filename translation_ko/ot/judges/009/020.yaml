id: JDG.9.20
reference: Judges 9:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
  footnotes:
  - marker: a
    text: Or 'the lords of Shechem.' The Hebrew expression refers to the ruling men or notable leaders of the city.
    reason: lexical_alternative
  - marker: b
    text: Beth-millo may also be rendered 'the house of Millo,' likely a place or ruling group associated with Shechem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그렇지 않다면, 불이 아비멜렉에게서 나와 세겜의 지도자들[a]과 벧밀로[b]를 삼키고, 불이 세겜의 지도자들과 벧밀로에게서 나와 아비멜렉을 삼키기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지도자들’로 옮긴 히브리어 표현은 세겜의 통치자나 유력자들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벧밀로’는 ‘밀로의 집’으로도 옮길 수 있으며, 세겜과 관련된 장소 또는 통치 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  english_pob_choice: But if not
  chosen_korean: 그러나 그렇지 않다면
  alternatives_korean:
  - 그런데 만일 그렇지 않다면
  - 그러나 아니면
  lexicon: HALOT
  rationale: 앞 절의 저주를 이어 받는 대조적 조건을 현대 한국어로 자연스럽게 살리되, וְ의 전환감과 부정 조건을 함께 반영했습니다.
- source_word: תֵּצֵא אֵשׁ / וְתֹאכַל
  english_pob_choice: let fire come out ... and consume
  chosen_korean: 불이 ... 나와 ... 삼키고
  alternatives_korean:
  - 불이 ... 나오게 하여 ... 먹어치우고
  - 불이 ... 나와 ... 집어삼키고
  lexicon: HALOT
  rationale: יִצא와 אכל의 결합은 저주 공식의 생생한 이미지를 유지하는 것이 핵심이므로, ‘불이 나와’와 ‘삼키다’를 사용해 파괴의 직접성을 살렸습니다.
- source_word: בַּעֲלֵי שְׁכֶם
  english_pob_choice: the leaders of Shechem
  chosen_korean: 세겜의 지도자들
  alternatives_korean:
  - 세겜의 주인들
  - 세겜의 권세자들
  lexicon: HALOT
  rationale: בַּעֲלֵי는 단순한 주민이 아니라 도시를 지배하는 유력자들을 가리키므로, 현대 독자가 사회·정치적 권위를 이해할 수 있게 ‘지도자들’로 옮겼습니다.
- source_word: בֵּית מִלּוֹא
  english_pob_choice: Beth-millo
  chosen_korean: 밀로의 집
  alternatives_korean:
  - 베스-밀로
  - 벧 밀로
  lexicon: HALOT
  rationale: 영어 POB의 주석이 이 표현을 ‘house of Millo’로도 읽을 수 있다고 설명하므로, 본문에는 의미를 드러내는 ‘밀로의 집’을 두고, 필요 시 고유명으로도 읽을 수 있는 여지를 남겼습니다.
theological_decisions:
- issue: 저주 속 ‘불’의 성격
  chosen_reading: 본문의 ‘불’을 본문 안에서 곧바로 상징화하거나 하나님의 직접적 심판으로 단정하지 않고, 상호 파괴를 예고하는 저주의 생생한 이미지로 유지했습니다.
  alternative_readings:
  - 비유적 전쟁/폭력의 상징으로 해석
  - 하나님의 즉각적 심판으로 해석
  rationale: 히브리어는 구체적 이미지인 ‘불’을 사용하며, 번역은 그 긴장을 풀어버리지 말고 독자가 문맥 속에서 판단하도록 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
