source:
  edition: WLC
  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
  footnotes:
  - marker: a
    text: Hebrew 'their blood be laid on,' an idiom for assigning guilt or responsibility for bloodshed.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lords of Shechem'; the Hebrew refers to the leading men or power-holders of the city.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'strengthened his hands,' that is, supported or backed him.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 여룹바알의 아들 일흔 명에게 가해진 폭력이 돌아오고, 그들의 피가[a] 그들을 죽인 그들의 형제 아비멜렉과, 그가 자기 형제들을 죽이도록 그의 손을 강하게 해 준 세겜의 지도자들에게[b][c] 돌아가게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 피가 … 위에 놓이게 하다’는, 그들이 흘린 피에 대한 책임이 그들에게 돌아가게 한다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세겜의 주인들’. 히브리어는 그 도시의 유력자들 또는 권력자들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘그의 손을 강하게 하다’는 그를 지지하거나 뒷받침했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבֹוא חֲמַס
  english_pob_choice: the violence done to ... might come
  chosen_korean: 이루신 일이 ... 나아가게 하시고
  alternatives_korean:
  - 그 폭력이 오게 하시고
  - 그 해악이 임하게 하시고
  - 그 폭력이 찾아오게 하시고
  lexicon: HALOT
  rationale: 히브리어는 ‘폭력/해악이 오다’라는 보복·응보적 관용구를 사용하지만, 한국어에서는 자연스럽고 공개적으로 읽히는 방식으로 ‘일이 나아가게 하시고’로 옮겨 결과가 드러나게 하는 뉘앙스를 살렸습니다.
- source_word: וְדָמָם לָשׂוּם עַל
  english_pob_choice: and their blood be laid on
  chosen_korean: 그 죄를 돌리시고
  alternatives_korean:
  - 그들의 피를 그 위에 두시고
  - 그들의 피가 그에게 돌려지게 하시고
  - 그들의 피값을 그에게 돌리시고
  lexicon: HALOT
  rationale: ‘피를 그 위에 두다’라는 히브리어 관용구는 혈죄의 책임을 귀속시키는 뜻이므로, 한국어에서는 의미를 분명히 하되 본문의 사법적 책임 전가를 살려 ‘죄를 돌리시고’로 옮겼습니다.
- source_word: בַּעֲלֵי שְׁכֶם
  english_pob_choice: the leaders of Shechem
  chosen_korean: 세겜의 지도자들
  alternatives_korean:
  - 세겜의 주인들
  - 세겜의 군주들
  - 세겜의 권력자들
  lexicon: HALOT
  rationale: בעלי는 도시의 전 주민이 아니라 지배층·유력자들을 가리키므로, 한국어에서는 오해가 적은 ‘지도자들’을 택했습니다.
- source_word: חִזְּקוּ אֶת יָדָיו
  english_pob_choice: strengthened his hands
  chosen_korean: 그의 손을 굳게 붙들어 주었습니다
  alternatives_korean:
  - 그의 손을 강하게 하였습니다
  - 그를 지지하였습니다
  - 그를 도왔습니다
  lexicon: HALOT
  rationale: ‘손을 강하게 하다’라는 히브리어 관용구를 직역에 가깝게 살리면서도, 한국어에서는 지원·동조의 의미가 분명히 드러나도록 옮겼습니다.
theological_decisions:
- issue: 혈죄 책임의 귀속을 어떻게 드러낼지
  chosen_reading: ‘그 죄를 돌리시고’로 옮겨, 살해의 책임이 아비멜렉과 세겜 지도자들에게 귀속된다는 משפט적·언약적 의미를 드러냈습니다.
  alternative_readings:
  - ‘그들의 피가 그에게 돌아가게 하시고’
  - ‘그들의 피값이 그에게 돌아가게 하시고’
  rationale: 본문은 단순한 처벌 예고가 아니라 무죄한 피에 대한 책임 부과를 말하므로, 피 자체보다 책임의 귀속이 이해되도록 하면서도 혈죄의 긴장을 유지했습니다.
  doctrine_reference: 혈죄/응보의 언약적 책임 개념
- issue: ‘야훼’의 사용
  chosen_reading: 본문 화자인 기드온의 선언을 따라, 언약명 야훼를 본문에 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 하나님의 언약적 이름을 쓰고 있으므로, POB 기본 용례에 따라 야훼를 유지해 본문의 소명성과 책임 귀속의 신학적 무게를 살렸습니다.
  doctrine_reference: YHWH 표기 원칙
