  edition: WLC
  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
  footnotes:
  - marker: a
    text: 'Hebrew: ''his nose burned,'' an idiom meaning ''he became angry'' or ''his anger burned.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍의 지도자 세불은 에벳의 아들 가알의 말을 듣고 분노가 타올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그의 코가 불탔다’이며, ‘그가 화가 났다’ 또는 ‘그의 분노가 타올랐다’라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다
  - 들어
  lexicon: HALOT
  rationale: 서사 진행의 완료 동작을 자연스럽게 살리기 위해 ‘듣다’의 서술형으로 옮겼습니다. 문맥상 단순 청취가 아니라 가알의 발언을 접한 것을 가리킵니다.
- source_word: שַׂר הָעִיר
  english_pob_choice: the ruler of the city
  chosen_korean: 지방의 수장
  alternatives_korean:
  - 그 도시의 통치자
  - 그 도시의 감독자
  - 그 도시의 관리
  lexicon: HALOT
  rationale: שַׂר는 단순 행정직보다 ‘우두머리/수장’의 폭이 넓어, 도시 권위를 자연스럽게 드러내는 한국어로 옮겼습니다. ‘지방’은 성읍 전체를 다스리는 공적 권위를 조금 더 현대적으로 풀어 준 표현입니다.
- source_word: גַּעַל בֶּן עָבֶד
  english_pob_choice: Gaal son of Ebed
  chosen_korean: 가알, 에벳의 아들
  alternatives_korean:
  - 가알, 에벳의 아들
  - 에벳의 아들 가알
  lexicon: 고유명사 표기 관례
  rationale: 고유명사는 음역하고, 히브리어의 부계 표지를 보존하기 위해 ‘에벳의 아들’ 구조를 유지했습니다.
- source_word: וַיִּחַר אַפּוֹ
  english_pob_choice: his anger burned
  chosen_korean: 그의 분노가 타올랐습니다
  alternatives_korean:
  - 그의 분노가 타올랐습니다
  - 그는 분노했습니다
  - 그의 코가 탔습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 불붙는 이미지를 살리면서도 한국어에서 자연스럽고 공적 문체에 맞는 ‘타올랐습니다’를 선택했습니다.
