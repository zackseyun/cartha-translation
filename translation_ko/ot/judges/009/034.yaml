  lexicon: HALOT
  rationale: 시간 부사구로서 야간 행위를 간결하게 전달하는 표준적인 현대 한국어를 택했습니다.
- source_word: עַל שְׁכֶם
  english_pob_choice: against Shechem
  chosen_korean: 세겜을 향해
  alternatives_korean:
  - 세겜을 향해
  - 세겜에 대항하여
  - 세겜을 향하여
  lexicon: HALOT
  rationale: עַל이 매복 문맥에서 적대적 목표를 나타내므로, 단순 위치보다 공격 방향을 드러내는 표현으로 옮겼습니다.
- source_word: אַרְבָּעָה רָאשִׁים
  english_pob_choice: in four companies
  chosen_korean: 네 무리로
  alternatives_korean:
  - 네 무리로
  - 네 대로
  - 네 분대로
  lexicon: HALOT
  rationale: 직역하면 ‘네 머리들’이지만 관용적으로 네 집단을 뜻하므로, 군사적 맥락을 해치지 않으면서도 현대 독자가 이해하기 쉬운 ‘무리’로 옮겼습니다.
