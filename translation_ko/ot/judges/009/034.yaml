translation:
  language: ko
  text: 그러자 아비멜렉과 그와 함께 있던 모든 사람들이 밤에 일어나 세겜을 향해 네 무리로 매복했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: got up
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어났습니다
  - 일어나 움직였습니다
  - 출발했습니다
  lexicon: HALOT
  rationale: 서술적 진행을 나타내는 wayyiqtol을 자연스럽게 살려, 단순한 ‘출발’보다 먼저 ‘일어남’이라는 구체적 동작을 반영했습니다.
- source_word: לָיְלָה
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
