base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
  footnotes:
  - marker: a
    text: Or “they are making the city hostile to you.” The Hebrew verb here is difficult; some understand it more literally as “they are besieging the city,” but in context the sense is more likely that Gaal and his group are inciting Shechem against Abimelek.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 비밀리에 아비멜렉에게 전령들을 보내며 말했습니다. “보십시오, 에벳의 아들 가알과 그의 형제들이 세겜에 와 있고, 보십시오, 그들이 당신에 맞서 그 성읍을 압박하고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 צור의 뜻이 이 문맥에서 어렵습니다. 전통적 의미로는 “포위하다”가 가능하지만, 여기서는 성읍을 압박하여 아비멜렉에 맞서게 만든다는 의미로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתָרְמָה
  english_pob_choice: secretly
  chosen_korean: 비밀리에
  alternatives_korean:
  - 은밀히
  - 몰래
  lexicon: HALOT
  rationale: 전달 행위의 숨은 성격을 현대 한국어로 자연스럽게 드러내면서도, 지나치게 도덕화된 뉘앙스를 피하기 위해 ‘비밀리에’를 택했습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 전령들
  alternatives_korean:
  - 사자들
  - 사신들
  lexicon: HALOT
  rationale: 전쟁·정치 맥락에서 사람을 통한 전달자를 가리키므로, ‘전령들’이 기능을 가장 분명하게 살립니다.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  english_pob_choice: they are stirring up the city against you
  chosen_korean: 그들이 당신에 맞서 그 성읍을 압박하고 있습니다
  alternatives_korean:
  - 그들이 그 성읍을 포위하고 있습니다
  - 그들이 그 성읍을 당신에게 적대적으로 만들고 있습니다
  - 그들이 그 성읍을 당신에 대항하여 몰아붙이고 있습니다
  lexicon: HALOT
  rationale: 히브리어 צור의 이 문맥은 단순한 군사 포위보다 ‘압박하여 대항하게 함/공격적으로 몰아붙임’의 뜻이 더 자연스러워, 직접적이면서도 의미의 긴장을 유지하는 표현을 선택했습니다.
- source_word: הִנֵּה / וְהִנָּם
  english_pob_choice: Look / and look
  chosen_korean: 보십시오 / 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 보십시오, 그리고 보십시오
  lexicon: HALOT
  rationale: 보고를 강조하는 주의 환기 표현이므로, 현대 합쇼체의 직접 호소로 반복을 살렸습니다.
theological_decisions:
- issue: 화자의 보고체와 직접 인용의 존중
  chosen_reading: 아비멜렉에게 보내는 비밀 보고를 서술문으로 유지하고, 직접 인용 안에서는 주의를 끄는 반복을 그대로 살렸습니다.
  alternative_readings:
  - 보고체를 평서문으로 완전히 평탄화함
  - 직접 인용의 반복을 하나로 줄임
  rationale: 이 절은 정보 전달과 긴박감을 동시에 전달하므로, 서술과 인용의 구조를 유지하는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 서사 문맥 보존
