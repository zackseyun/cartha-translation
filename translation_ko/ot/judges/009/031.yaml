  naturalness: ‘전령들을 보내며 말했습니다’는 두 동작의 동시성을 다소 부자연스럽게 암시합니다. ‘전령들을 보내어 이렇게 전했습니다’가 전달 행위와 인용문의 관계를 현대 한국어 합쇼체로 더 자연스럽게 나타냅니다. ‘보십시오’의 반복은 원문의 주의 환기 표현을 잘 살립니다.
  terminology: ‘아비멜렉’, ‘에벳’, ‘가알’, ‘세겜’, ‘전령들’, ‘성읍’은 일관되고 적절합니다. 문제 구절은 ‘성읍을 압박하다’가 도시 자체에 대한 물리적 압박으로 읽혀 ‘당신에 맞서’와의 관계를 충분히 드러내지 못하므로 ‘성읍을 부추겨 당신에게 맞서게 하다’로 수정합니다.
