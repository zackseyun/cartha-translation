source:
  edition: WLC
  text: וַ/יָּ֣שֶׁב אֱלֹהִ֔ים אֵ֖ת רָעַ֣ת אֲבִימֶ֑לֶךְ אֲשֶׁ֤ר עָשָׂה֙ לְ/אָבִ֔י/ו לַ/הֲרֹ֖ג אֶת שִׁבְעִ֥ים אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
  footnotes:
  - marker: a
    text: Or 'returned upon Abimelech the evil.' The Hebrew idiom speaks of causing his evil to come back on him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 하나님께서는 아비멜렉이 자기 아버지에게 행한 악—곧 자기의 일흔 형제들을 죽인 그 일—을 그에게 되돌리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 ‘악이 그에게 돌아오게 하다’는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  english_pob_choice: repaid
  chosen_korean: 되돌리셨습니다
  alternatives_korean:
  - 갚으셨습니다
  - 보응하셨습니다
  - 돌려보내셨습니다
  lexicon: HALOT
  rationale: 히필형 שוב의 원인적 의미를 살리면서, 악을 아비멜렉에게 ‘되돌리는’ 보응의 뉘앙스를 자연스럽게 드러냅니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님께서는
  alternatives_korean:
  - 하나님이
  - 신께서는
  lexicon: HALOT
  rationale: 동사에 대한 주어로서 이스라엘의 하나님을 직접 가리키므로 표준 번역어 ‘하나님’을 사용했습니다.
- source_word: רָעַת
  english_pob_choice: the evil
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 사악함
  - 해악
  lexicon: HALOT
  rationale: 이 문맥은 단순한 결과가 아니라 아비멜렉의 도덕적 악을 가리키므로, 윤리적 강도를 유지하는 ‘악’이 가장 적절합니다.
- source_word: לַהֲרֹג אֶת שִׁבְעִים אֶחָיו
  english_pob_choice: by killing his seventy brothers
  chosen_korean: 곧 자기의 일흔 형제들을 죽인 그 일
  alternatives_korean:
  - 곧 그의 일흔 형제를 죽인 일
  - 곧 일흔 형제들을 살해한 일
  lexicon: HALOT
  rationale: 원문의 부정사구가 ‘아버지에게 행한 악’의 내용 설명이므로, 한국어에서는 설명적 삽입인 ‘곧 … 그 일’로 풀어 연결했습니다.
theological_decisions:
- issue: 하나님의 보응 주체성
  chosen_reading: 하나님께서 아비멜렉의 악을 직접 그에게 되돌리시는 বিচার적 행위를 하십니다.
  alternative_readings:
  - 하나님께서 그 악이 저절로 돌아오게 하셨습니다
  - 하나님께서 단지 허용하셨습니다
  rationale: 히브리어 동사와 문장 구조는 하나님을 능동적 주체로 제시하므로, 그 심판적 행위를 약화시키지 않고 드러내야 합니다.
  doctrine_reference: Translation philosophy §1, §3
