  source_fidelity: 히브리어는 하나님께서 아비멜렉이 자기 아버지에게 저지른 악을 그에게 되돌려 갚으셨다고 말하며, 그 악의 구체적 내용은 그의 일흔 형제를 죽인 일입니다. 초안은 이 관계와 하나님의 능동적 보응을 대체로 충실히 전달합니다. 다만 ‘악을 그에게 되돌리셨습니다’는 한국어에서 다소 어색하고, ‘자기의 일흔 형제들’보다 ‘아비멜렉의 일흔 형제들’이 지시 대상을 더 분명히 합니다.
  naturalness: ‘되갚으셨습니다’는 보응과 귀환의 의미를 자연스럽게 전달합니다. ‘곧 … 죽인 일’은 쉼표로 이어 더 간결하고 현대적인 문장이 됩니다.
  terminology: ‘하나님’, ‘아비멜렉’, ‘악’, ‘일흔 형제들’은 적절합니다. 합쇼체 존대 종결도 유지합니다.
