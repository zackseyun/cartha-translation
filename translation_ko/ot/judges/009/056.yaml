revisions:
- from: 그리하여 하나님께서는 아비멜렉이 자기 아버지에게 행한 악—곧 자기의 일흔 형제들을 죽인 그 일—을 그에게 되돌리셨습니다.[a]
  to: 그리하여 하나님께서는 아비멜렉이 자기 아버지에게 저지른 악, 곧 아비멜렉의 일흔 형제들을 죽인 일을 아비멜렉에게 되갚으셨습니다.[a]
  rationale: 수정문은 하나님이 심판의 능동적 주체이심과 아비멜렉의 악이 그에게 돌아왔다는 히브리어 관용적 표현을 ‘되갚으셨습니다’로 자연스럽게 옮겼습니다. 또한 형제들이 아비멜렉의 형제들임을 명시하고, 각주에서 문자적 표현을 제시하여 원문의 어휘적 뉘앙스를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:09:45Z'
review_pass:
