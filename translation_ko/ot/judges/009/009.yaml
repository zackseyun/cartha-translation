id: JDG.9.9
reference: Judges 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
  footnotes:
  - marker: a
    text: Or, 'by which God and men are honored.' Many translations take אֱלֹהִים here as referring to the true God, since olive oil was used in worship; the Hebrew form itself is plural.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'my fatness,' a figurative expression for the olive tree's rich produce.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 감람나무가 그들에게 말했습니다. “내 기름진 산물을 내는 일을 그만두고, 그것으로 신들[a]과 사람들을 존귀하게 하기를 그치고, 나무들 위에서 흔들리러 가야 하겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형 אֱלֹהִים이며, 여기서는 ‘신들’로 옮겼습니다. 전통적으로는 감람기름의 예배 용도를 고려하여 ‘하나님’으로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַזַּיִת
  english_pob_choice: the olive tree
  chosen_korean: 감람나무
  alternatives_korean:
  - 올리브나무
  - 올리브
  lexicon: HALOT
  rationale: 의인화된 화자이므로 한국어에서는 식물명보다 나무 자체를 드러내는 ‘감람나무’가 자연스럽고, 본문의 우화적 장면을 잘 살립니다.
- source_word: דִּשְׁנִי
  english_pob_choice: my richness / my oil
  chosen_korean: 내 기름진 결실
  alternatives_korean:
  - 내 기름
  - 내 풍성함
  - 내 풍요
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘내 비옥함/기름짐’의 뉘앙스이며, 문맥상 감람나무의 산물인 기름을 가리키지만 단순히 ‘기름’으로만 좁히면 비유성이 약해집니다. 그래서 생산물의 풍성함을 드러내는 표현을 택했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님
  - 신
  - 신적 존재들
  lexicon: HALOT
  rationale: 히브리어 복수형과 우화의 장면을 따라 본문 흐름을 우선하면 복수 의미가 가장 직접적이므로 ‘신들’로 옮겼습니다. 전통적 단수 읽기는 주석적 대안으로 처리하는 편이 원문 긴장을 보존합니다.
- source_word: וַאֲנָשִׁים
  english_pob_choice: and men
  chosen_korean: 사람들
  alternatives_korean:
  - 인간들
  - 사람
  - 남자들
  lexicon: HALOT
  rationale: ‘신들’과 병렬되는 일반 মানব 범주이므로 표준적이고 성중립적인 ‘사람들’이 가장 자연스럽습니다.
- source_word: לָנוּעַ עַל הָעֵצִים
  english_pob_choice: to sway over the trees
  chosen_korean: 나무들 위에 흔들리며 군림하러
  alternatives_korean:
  - 나무들 위로 흔들리러
  - 나무들 위를 흔들며 다스리러
  - 나무들 위에 군림하러
  lexicon: HALOT
  rationale: לנוע는 문자적으로 ‘흔들리다/움직이다’이고, על הָעֵצִים는 다른 나무들 위에 있는 지위를 암시합니다. 우화의 반어를 살려 ‘흔들리며 군림하다’로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 의미를 ‘하나님’으로 단수화할지, ‘신들’로 유지할지
  chosen_reading: ‘신들’로 유지합니다.
  alternative_readings:
  - ‘하나님’
  - ‘하나님과 사람들’
  rationale: 본문은 왕을 세우려는 나무들의 우화적 연설이며, 히브리어 복수형과 동사 복수형이 함께 나타나므로 단수 신학적 조정보다 원문 형태를 보존하는 편이 더 책임 있습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy), §3 (preserve tension)
