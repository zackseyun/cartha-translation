    issue: '본문의 각주 표기가 구조적으로 잘못되었습니다: ‘사람들[ [a] ]’.'
    rationale: 대괄호가 중복되어 있으며, 각주 표지는 해당 대안 독법이 걸리는 ‘신들’에 직접 붙어야 합니다.
  - severity: medium
    issue: ‘가서 나무들 위에 흔들리며 군림하러 가야 하겠습니까?’에 ‘가다’가 중복됩니다.
    rationale: וְהָלַכְתִּי는 ‘가다’이지만, 한국어에서는 ‘…하러 가다’ 구조로 한 번만 표현해야 자연스럽습니다.
  - severity: low
