id: JDG.9.45
reference: Judges 9:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
  footnotes:
  - marker: a
    text: Or 'attacked the city.' The Hebrew verb is literally 'fought' and, with the preposition used here, likely means military action against the city.
    reason: lexical_alternative
  - marker: b
    text: '''Sowed it with salt'' is a symbolic act of devastation and curse, marking the city''s ruin.'
    reason: cultural_note
translation:
  language: ko
  text: 아비멜렉은 그날 온종일 그 성읍과 싸워서[a] 그 성읍을 점령하고, 그 안에 있던 사람들을 죽였습니다. 그리고 그 성읍을 허물고 소금을 뿌렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 성읍과 싸워서’는 히브리어의 ‘전쟁하다/싸우다’ 동사를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소금을 뿌렸습니다’는 성읍을 황폐화하고 저주하는 상징적 행위를 자연스럽게 옮긴 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  english_pob_choice: fought against the city
  chosen_korean: 그 성읍과 싸워서
  alternatives_korean:
  - 그 성읍을 공격해서
  - 그 성읍 안에서 싸워서
  lexicon: HALOT
  rationale: לָחַם의 전쟁적 의미를 살리면서, 전치사 בְּ가 כאן에서는 ‘~와 싸우다’로 자연스럽게 옮기는 것이 가장 직접적입니다.
- source_word: וַיִּלְכֹּד
  english_pob_choice: he captured
  chosen_korean: 점령하고
  alternatives_korean:
  - 붙잡고
  - 사로잡고
  lexicon: HALOT
  rationale: 도시를 대상으로 한 군사적 동작이므로 ‘점령하다’가 한국어로 가장 분명합니다.
- source_word: וַיִּתֹּץ
  english_pob_choice: he tore down
  chosen_korean: 허물고
  alternatives_korean:
  - 무너뜨리고
  - 파괴하고
  lexicon: HALOT
  rationale: נתץ는 구조물을 헐어버리는 뜻이므로, 도시 파괴의 동작을 자연스럽게 드러내는 ‘허물다’가 적절합니다.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  english_pob_choice: sowed it with salt
  chosen_korean: 소금을 뿌렸습니다
  alternatives_korean:
  - 소금을 뿌려 심었습니다
  - 소금으로 뿌렸습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘씨 뿌리다’ 이미지는 의도적 황폐화의 상징이지만, 한국어에서는 직역보다 ‘소금을 뿌리다’가 그 상징행위를 과도한 어색함 없이 전달합니다.
theological_decisions:
- issue: 성읍에 소금을 뿌리는 행위의 상징성
  chosen_reading: 본문의 파괴 행위를 문자적 사료로 옮기되, 별도의 해설은 달지 않았습니다.
  alternative_readings:
  - 저주를 상징하는 의례로 풀이하기
  - 단순한 농경 행위로 약화해 번역하기
  rationale: 문맥상 성읍의 완전한 황폐화와 저주를 나타내는 상징행위이므로, 본문이 가진 힘을 유지하는 쪽이 적절합니다.
  doctrine_reference: 본문 내 상징행위에 대한 서술적 번역 원칙
