base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
  footnotes:
  - marker: a
    text: Or “all the lords of Shechem” or “all the leading men of Shechem.” The Hebrew expression refers to the influential men of the city.
    reason: lexical_alternative
  - marker: b
    text: Or “all these things.” The Hebrew word can mean either spoken words or matters/events, but here likely points to the proposal just reported.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 어머니의 형제들이 그에 관하여 세겜의 모든 지도자들의 귀에 이 모든 말을 하자, 그들의 마음이 아비멜렉을 따르도록 기울어졌습니다. 이는 그들이 말하기를 “그는 우리의 형제입니다”라고 했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “세겜의 모든 주인들”, “세겜의 모든 유력자들”로 옮길 수 있습니다. 히브리어 표현은 도시의 영향력 있는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이 모든 일들”이라고도 할 수 있습니다. 히브리어 דברים는 말뿐 아니라 일/사건을 뜻할 수 있지만, 여기서는 앞에서 보고된 제안을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחֵי אִמּוֹ
  english_pob_choice: his mother’s brothers
  chosen_korean: 그의 어머니의 형제들
  alternatives_korean:
  - 외삼촌들
  - 모계 친족들
  lexicon: HALOT
  rationale: 직역하면 모계 쪽 남자 형제들을 가리키므로, 한국어에서도 가장 직접적인 대응인 ‘어머니의 형제들’로 옮겼습니다.
- source_word: בְּאָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: 귀에
  alternatives_korean:
  - 들리는 곳에서
  - 듣는 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 귀에’는 청중에게 들리게 말한다는 뜻이므로, 본문을 유지하면서도 자연스럽게 ‘귀에’로 살렸습니다.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  english_pob_choice: all the leaders of Shechem
  chosen_korean: 세겜의 모든 지도자들
  alternatives_korean:
  - 세겜의 모든 주인들
  - 세겜의 모든 유력자들
  lexicon: HALOT
  rationale: בעלי는 여기서 도시의 영향력 있는 사람들을 가리키므로, 한국어에서는 기능을 분명히 드러내는 ‘지도자들’이 가장 적절합니다.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 일
  - 이 모든 사정
  lexicon: HALOT
  rationale: 문맥상 앞절의 제안 내용을 가리키는 말이어서, דברים의 말/사건 가능성은 남기되 담화 연결을 살리는 ‘이 모든 말’로 옮겼습니다.
- source_word: וַיֵּט לִבָּם
  english_pob_choice: their hearts turned
  chosen_korean: 그들의 마음이 … 기울어졌습니다
  alternatives_korean:
  - 그들의 마음이 돌아섰습니다
  - 그들의 마음이 … 향했습니다
  lexicon: HALOT
  rationale: לב의 방향성 비유를 자연스러운 한국어로 옮기기 위해 ‘기울어지다’를 택했고, ‘따르도록’으로 목적 방향을 분명히 했습니다.
theological_decisions:
- issue: 아비멜렉에 대한 충성 표현
  chosen_reading: ‘아비멜렉을 따르도록 기울어졌습니다’로 번역해 단순한 감정 변화가 아니라 정치적·관계적 지지로 드러냈습니다.
  alternative_readings:
  - ‘아비멜렉 쪽으로 마음이 바뀌었습니다’
  - ‘아비멜렉에게 마음이 갔습니다’
  rationale: 히브리어 ‘마음이 … אחרי’는 단순 호감이 아니라 추종/충성을 뜻하는 방향성을 가지므로, 그 함의를 보존해야 합니다.
  doctrine_reference: 서사 문맥의 충성/추종 표현
