    rationale: 원문의 על은 아비멜렉이 세겜의 유력자들 위에서 통치하게 되었다는 뜻이나, 현 문구는 한국어에서 어색합니다. ‘지도자들을 다스릴 왕으로’가 자연스럽고 의미도 보존합니다.
  - severity: low
    issue: ‘그의 여종의 아들’의 선행사 불명확성
    rationale: 히브리어 소유 접미사는 ‘내 아버지’를 가리킵니다. 한국어에서는 ‘내 아버지의 여종’이라고 명시하여 독자가 선행사를 혼동하지 않도록 하는 편이 안전합니다.
