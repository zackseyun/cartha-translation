revisions:
- from: 그러나 오늘 당신들은 일어나 내 아버지의 집을 치고, 그의 아들 칠십 명을 한 돌 위에서 죽였으며, 그의 여종의 아들 아비멜렉을 세겜의 지도자들 위에 왕으로 세웠습니다. 그는 당신들의 형제이기 때문입니다.[a]
  to: 그러나 오늘 여러분은 내 아버지의 집안을 거슬러 일어나, 그의 아들 칠십 명을 한 돌 위에서 죽였으며, 내 아버지의 여종의 아들 아비멜렉을 세겜의 지도자들을 다스릴 왕으로 세웠습니다. 그가 여러분의 형제이기 때문입니다.[a]
  rationale: 본문의 적대적 관용구는 ‘집안을 거슬러 일어나’로, בֵּית אָבִי의 가문적 의미는 ‘내 아버지의 집안’으로 반영했습니다. 통치 대상과 관계를 자연스러운 한국어로 나타내기 위해 ‘세겜의 지도자들을 다스릴 왕으로’로 고쳤습니다. 여종의 소유자가 아버지임을 본문에서 명시하되, 각주에서는 히브리어 표현 자체가 ‘그의 여종’임을 보존했습니다.
