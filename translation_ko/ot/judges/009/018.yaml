  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 בֵּית אָבִי는 건물 자체보다 아버지의 가문·집안을 뜻하며, עַל בַּעֲלֵי שְׁכֶם은 세겜 지도자들을 다스리는 왕으로 세웠다는 관계를 나타냅니다. 이를 한국어에서 더 분명히 드러낼 필요가 있습니다.
  naturalness: ‘세겜의 지도자들 위에 왕으로 세웠습니다’는 직역투여서 현대 표준 한국어로 다소 부자연스럽습니다. ‘세겜의 지도자들을 다스릴 왕으로 세웠습니다’가 자연스럽고 원문의 통치 관계도 보존합니다. ‘내 아버지의 집안’을 사용하면 한국어에서 가족·가문의 뜻이 명확해집니다.
  terminology: ‘여종의 아들’은 אֲמָתוֹ의 기본 어휘 의미를 적절히 반영합니다. 다만 한국어 대명사 ‘그의’의 선행사가 흐려질 수 있으므로 ‘내 아버지의 여종의 아들’로 밝혀 주는 것이 좋습니다. 아비멜렉과 세겜은 통용 표기를 유지합니다.
  issues:
  - severity: medium
    issue: ‘내 아버지의 집을 치고’
    rationale: 히브리어 ‘내 아버지의 집’은 이 문맥에서 물리적 건물보다 기드온의 가문·가족을 가리킵니다. ‘집안’을 사용하면 원문의 사회적·가문적 지시 대상이 한국어에서 더 정확해집니다.
  - severity: medium
