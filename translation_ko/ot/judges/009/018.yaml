  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
  footnotes:
  - marker: a
    text: Or 'the son of his slave woman,' or more interpretively, 'the son of his concubine.' The Hebrew says 'the son of his female servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 오늘 여러분은 내 아버지의 집안을 거슬러 일어나, 그의 아들 칠십 명을 한 돌 위에서 죽였으며, 내 아버지의 여종의 아들 아비멜렉을 세겜의 지도자들을 다스릴 왕으로 세웠습니다. 그가 여러분의 형제이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 노예 여인의 아들’로 옮길 수 있습니다. 더 해석적으로는 ‘그의 첩의 아들’로도 옮길 수 있습니다. 히브리어는 ‘그의 여종의 아들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתֶּם עַל
  english_pob_choice: have risen up against
  chosen_korean: 일어나 …을 치다
  alternatives_korean:
  - 일어나 …을 대적하다
  - 일어나 …을 공격하다
  lexicon: HALOT
  rationale: 히브리어 관용구 קום על의 적대적/반항적 뉘앙스를 살리면서, 현대 한국어에서는 ‘치다’가 가장 자연스럽게 대립 행위를 드러냅니다.
- source_word: בֵּית אָבִי
  english_pob_choice: my father's house
  chosen_korean: 내 아버지의 집
  alternatives_korean:
  - 내 아버지의 가문
  - 내 아버지의 집안
  lexicon: HALOT
  rationale: 단순 건물보다 가족·가문 전체를 가리키는 표현이므로, 직설적으로 ‘내 아버지의 집’으로 옮겼습니다.
- source_word: בֶּן אֲמָתוֹ
  english_pob_choice: the son of his female servant
  chosen_korean: 그의 여종의 아들
  alternatives_korean:
  - 그의 여종의 아들
  - 그의 종의 아들
  - 그의 노예 여인의 아들
  lexicon: HALOT
  rationale: אֲמָה의 기본 뜻을 반영해 ‘여종’으로 옮겼고, 본문이 아비멜렉의 출신 신분을 낮추어 대비시키는 효과를 보존했습니다.
- source_word: בַּעֲלֵי שְׁכֶם
  english_pob_choice: the leaders of Shechem
  chosen_korean: 세겜의 지도자들
  alternatives_korean:
  - 세겜의 주인들
  - 세겜의 귀인들
  - 세겜의 남자들
  lexicon: HALOT
  rationale: בַּעֲלֵי는 여기서 도시의 유력자·주도층을 가리키므로, 현대 독자에게 분명한 ‘지도자들’로 풀었습니다.
theological_decisions:
- issue: 아비멜렉의 모친 지칭과 사회적 뉘앙스
  chosen_reading: 본문의 lexical sense를 따라 ‘여종의 아들’로 두고, 해석어인 ‘첩’은 본문에 넣지 않았습니다.
  alternative_readings:
  - 노예 여인의 아들
  - 첩의 아들
  rationale: 히브리어는 אֲמָה(여종/여종노예)를 사용하며, 본문 자체는 신분의 낮음을 강조합니다. ‘첩’은 사회사적 해석을 더 강하게 반영하므로 본문에는 넣지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
