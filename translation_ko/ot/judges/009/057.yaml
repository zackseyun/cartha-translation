  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: ko
  text: 하나님께서 세겜 사람들의 온갖 악을 그들의 머리 위로 되돌리셨고, 여룹바알의 아들 요담의 저주가 그들에게 임했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  english_pob_choice: repaid
  chosen_korean: 되돌리셨고
  alternatives_korean:
  - 갚으셨고
  - 되갚으셨고
  - 돌려주셨고
  lexicon: HALOT
  rationale: 히필 동사 שוב의 사법적 보응 의미를 살려, 단순한 ‘반환’보다 하나님의 적극적 심판을 드러내는 동사로 옮겼습니다.
- source_word: רָעַת
  english_pob_choice: evil
  chosen_korean: 온갖 악
  alternatives_korean:
  - 악
  - 악행
  - 불의
  lexicon: HALOT
  rationale: 세겜 사람들의 도덕적 악을 가리키므로, 행위성도 드러나게 ‘온갖 악’으로 옮겨 전면적 악행의 뉘앙스를 살렸습니다.
- source_word: בְּרֹאשָׁם
  english_pob_choice: on their own heads
  chosen_korean: 그들의 머리 위로
  alternatives_korean:
  - 그들의 머리로
  - 그들 위에
  - 자기 머리 위에
  lexicon: HALOT
  rationale: 히브리어 관용구의 형상과 개인적 책임의 귀결을 보존하기 위해 직역에 가깝게 옮겼습니다.
- source_word: קִלֲלַת
  english_pob_choice: the curse
  chosen_korean: 저주
  alternatives_korean:
  - 저주의 말
  - 저주의 선언
  - 저주받음
  lexicon: HALOT
  rationale: 요담의 앞선 발화를 가리키는 명사이므로, 한국어에서는 가장 자연스러운 ‘저주’가 문맥과 정확히 맞습니다.
theological_decisions:
- issue: 하나님의 보응 행위의 적극성
  chosen_reading: 하나님께서 세겜 사람들의 악을 실제로 그들에게 되돌리신 것으로 표현했습니다.
  alternative_readings:
  - 하나님께서 그들의 악이 그들에게 돌아가도록 허용하셨습니다.
  - 그들의 악의 결과가 자연스럽게 돌아왔습니다.
  rationale: 원문은 하나님을 주어로 하여 보응의 행위를 직접 서술하므로, 이를 허용만으로 약화하지 않고 심판적 행위로 보존했습니다.
  doctrine_reference: 원문 우선 원칙, 신적 심판의 직접성 보존
