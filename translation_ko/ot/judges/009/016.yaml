id: JDG.9.16
reference: Judges 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
  footnotes:
  - marker: a
    text: Or 'according to what his hands deserved.' The Hebrew idiom refers to treatment corresponding to a person's deeds.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그러니, 여러분이 아비멜렉을 왕으로 세울 때에 진실과 온전함으로 행하였고, 또 여룹바알과 그의 집에 선하게 행하였으며, 또 그의 손이 마땅히 받은 보응대로 그에게 행하였는지 보십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 손이 마땅히 받은 보응대로’는 히브리어 관용구로, 사람의 행위에 상응하는 대우를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 이제 그러니
  alternatives_korean:
  - 이제 따라서
  - 그러므로 이제
  lexicon: HALOT
  rationale: 담화 전환과 논증적 연결을 함께 살려, 단순한 시간 부사인 ‘이제’보다 추론적 흐름이 드러나도록 옮겼습니다.
- source_word: בֶּאֱמֶת וּבְתָמִים
  english_pob_choice: in truth and integrity
  chosen_korean: 진실과 온전함으로
  alternatives_korean:
  - 진리와 성실로
  - 참됨과 온전함으로
  lexicon: HALOT
  rationale: 두 اخلاق적 용어의 병렬을 유지하되, ‘온전함’으로 תָמִים의 도덕적 완전성과 통전성을 살렸습니다.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  english_pob_choice: you have dealt well with
  chosen_korean: 선하게 행하였으며
  alternatives_korean:
  - 잘 대우하였으며
  - 좋게 행하였으며
  lexicon: HALOT
  rationale: ‘~과 함께 선하게 행하다’라는 히브리어 관용을 한국어에서 자연스럽게 풀어, 평가적 의미를 유지했습니다.
- source_word: כִּגְמוּל יָדָיו
  english_pob_choice: according to the recompense of his hands
  chosen_korean: 그의 손이 마땅히 받은 보응대로
  alternatives_korean:
  - 그의 손의 보응대로
  - 그 행위에 상응하는 대가대로
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘손’을 보존하면서도, 관용구의 뜻인 행위에 상응하는 보응을 이해 가능하게 드러냈습니다.
theological_decisions:
- issue: 재판적 도발을 띠는 연속 조건문의 어조
  chosen_reading: 반복되는 ‘만일’ 구조를 ‘~하였는지 보십시오’로 옮겨, 요담의 도전적 검증 요청을 드러냈습니다.
  alternative_readings:
  - 그렇다면
  - 만일 ... 하였다면
  rationale: 이 절은 중립적 서술이 아니라 청자에게 행위의 정당성을 따져 묻는 수사적 심문이므로, 한국어에서도 그 긴장을 유지하는 표현이 필요합니다.
  doctrine_reference: 수사적 문맥 보존
- issue: ‘그의 손’이라는 신체 이미지의 보존
  chosen_reading: 보응의 주체를 추상화하지 않고 ‘그의 손’ 이미지를 유지했습니다.
  alternative_readings:
  - 그의 행위대로
  - 그가 한 일에 따라
  rationale: 히브리어 관용구의 구체적 표현을 지워버리면 원문의 도덕적·법적 생동감이 약해지므로, 이미지와 뜻을 함께 살렸습니다.
  doctrine_reference: 히브리어 관용구 보존
