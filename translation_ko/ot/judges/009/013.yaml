  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
  footnotes:
  - marker: a
    text: Or, 'which gladdens God and men.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 포도나무가 그들에게 말했습니다. ‘내가 내 새 포도주를 그치고, 신들과 사람들을 기쁘게 하는 그것을 두고, 가서 나무들 위에 군림하라는 말입니까?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘하나님과 사람들을 기쁘게 하는.’
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן
  english_pob_choice: the vine
  chosen_korean: 포도나무
  alternatives_korean:
  - 덩굴나무
  - 포도덩굴
  lexicon: HALOT
  rationale: 이 우화적 화자에 해당하는 식물을 한국어로 자연스럽게 드러내면서도 원문의 비유적 이미지를 유지합니다.
- source_word: הֶחֳדַלְתִּי
  english_pob_choice: Should I stop producing
  chosen_korean: 내가 … 그치고
  alternatives_korean:
  - 내가 … 멈추고
  - 내가 … 그만두고
  lexicon: HALOT
  rationale: 질문형의 ‘그치다’는 행위를 중단한다는 원문의 뉘앙스를 살리며, POB가 본 동사상의 뉘앙스를 한국어에 간결하게 옮깁니다.
- source_word: תִּירוֹשִׁי
  english_pob_choice: my new wine
  chosen_korean: 내 새 포도주
  alternatives_korean:
  - 내 신포도주
  - 내 포도주
  lexicon: HALOT
  rationale: תִּירוֹשׁ의 ‘새/신 포도주’ 의미를 살리되, 현대 한국어에서 가장 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: הַמְשַׂמֵּחַ אֱלֹהִים וַאֲנָשִׁים
  english_pob_choice: which gladdens gods and men
  chosen_korean: 신들과 사람들을 기쁘게 하는
  alternatives_korean:
  - 하나님과 사람들을 기쁘게 하는
  - 신적 존재들과 사람들을 기쁘게 하는
  lexicon: HALOT
  rationale: 이 문맥의 אֱלֹהִים는 형태상 복수이므로 ‘신들’로 두어 POB의 문맥적 결정을 반영했고, מְשַׂמֵּחַ는 ‘기쁘게 하는’으로 자연스럽게 옮겼습니다.
- source_word: לָנוּעַ עַל הָעֵצִים
  english_pob_choice: to sway over the trees
  chosen_korean: 나무들 위에 군림하라는
  alternatives_korean:
  - 나무들 위에서 흔들리라는
  - 나무들 위를 이리저리 움직이라는
  lexicon: HALOT
  rationale: לָנוּעַ의 물리적 ‘움직이다/흔들리다’와 우화 속 통치적 함의를 함께 살려, ‘군림하다’로 비유의 핵심을 드러냈습니다.
theological_decisions:
- issue: אֱלֹהִים의 번역에서 복수형 유지 여부
  chosen_reading: 우화의 문맥에 따라 ‘신들’로 번역해 원문의 복수형과 고대 근동적 비유성을 보존했습니다.
  alternative_readings:
  - 하나님
  - 신적 존재들
  rationale: 형태론적으로 복수형이며, 본문은 이스라엘의 하나님에 대한 직접 진술이 아니라 포도주의 기쁨을 말하는 우화적 표현이므로, 단수화하지 않고 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 원문 형태와 우화 문맥을 우선하여 신학적 평탄화를 피합니다.
