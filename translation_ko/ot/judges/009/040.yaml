  text: וַ/יִּרְדְּפֵ֣/הוּ אֲבִימֶ֔לֶךְ וַ/יָּ֖נָס מִ/פָּנָ֑י/ו וַֽ/יִּפְּל֛וּ חֲלָלִ֥ים רַבִּ֖ים עַד פֶּ֥תַח הַ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
  footnotes:
  - marker: a
    text: Or 'many casualties fell' / 'many were struck down, as far as the gateway.' The Hebrew keeps the vivid battle idiom 'fell' with 'slain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아비멜렉이 그를 추격하였고, 그는 그 앞에서 도망하였으며, 많은 사람이 죽임을 당하여 성문 어귀까지 쓰러졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  english_pob_choice: pursued him
  chosen_korean: 그를 추격하였고
  alternatives_korean:
  - 그를 쫓았고
  - 그를 뒤쫓았고
  lexicon: HALOT
  rationale: רָדַף는 적을 뒤쫓는 추격을 뜻하므로, 전투 맥락을 살린 ‘추격하다’가 가장 직접적입니다.
- source_word: וַיָּנָס מִפָּנָיו
  english_pob_choice: he fled before him
  chosen_korean: 그는 그 앞에서 도망하였으며
  alternatives_korean:
  - 그 앞에서 달아났으며
  - 그 얼굴 앞에서 도망하였으며
  lexicon: HALOT
  rationale: ‘before him’의 관용적 의미를 한국어로 자연스럽게 살려 ‘그 앞에서 도망하다’로 옮겼습니다.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  english_pob_choice: many slain fell
  chosen_korean: 많은 사람이 죽임을 당하여 … 쓰러졌습니다
  alternatives_korean:
  - 많은 전사자가 쓰러졌습니다
  - 많은 죽은 자가 쓰러졌습니다
  lexicon: HALOT
  rationale: חֲלָלִים는 전투에서 죽임을 당한 자들을 가리키므로, ‘죽임을 당한’으로 그 상태를 드러내되 ‘쓰러졌다’의 전투적 이미지는 유지했습니다.
- source_word: עַד פֶּתַח הַשָּׁעַר
  english_pob_choice: as far as the entrance of the gate
  chosen_korean: 성문 어귀까지
  alternatives_korean:
  - 성문 입구까지
  - 성문의 문지방까지
  lexicon: HALOT
  rationale: פֶּתַח הַשַּׁעַר는 ‘문/성문의 입구’를 가리키므로, 간결하고 자연스러운 ‘성문 어귀’가 원문의 공간 이미지를 잘 살립니다.
