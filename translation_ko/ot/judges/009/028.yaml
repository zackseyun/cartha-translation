  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
  footnotes:
  - marker: a
    text: Or, 'Who is Abimelek, and what is Shechem...?' The Hebrew names 'Shechem' directly, likely referring metonymically to the city or its ruling community.
    reason: lexical_alternative
  - marker: b
    text: '''His officer'' may also be rendered ''his deputy'' or ''his appointed official.'''
    reason: lexical_alternative
  - marker: c
    text: That is, the people descended from or associated with Hamor, remembered as the father/founder of Shechem; compare Genesis 34.
    reason: cross_reference
translation:
  language: ko
  text: 가알, 에벳의 아들이 말했습니다[a]. “아비멜렉이 누구이며, 세겜이 누구이기에 우리가 그를 섬겨야 합니까? 그는 여룹바알의 아들이고, 스불은 그의 관리가 아니냐[b]? 세겜의 아버지인 하몰의 사람들을 섬기십시오[c]! 그런데 우리가 왜 그를 섬겨야 합니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘아비멜렉이 누구이며, 세겜이 무엇입니까...?’ 히브리어는 ‘세겜’이라는 이름을 직접 말하며, 도시나 그 통치 집단을 환유적으로 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 관리’는 ‘그의 대리’ 또는 ‘그가 임명한 관원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 하몰에게서 나온 사람들이나 하몰과 관련된 사람들을 가리킵니다. 하몰은 세겜의 아버지로 언급되며, 창세기 34장을 참조하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who is
  chosen_korean: 누구이며
  alternatives_korean:
  - 무엇입니까
  - 누구입니까
  lexicon: HALOT
  rationale: 사람과 권위를 깎아내리는 수사적 질문이므로 ‘누구’가 적절하며, 앞뒤를 자연스럽게 잇기 위해 ‘누구이며’로 옮겼습니다.
- source_word: שְׁכֶם
  english_pob_choice: Shechem
  chosen_korean: 세겜
  alternatives_korean:
  - 세겜 사람들
  - 세겜 성읍
  lexicon: HALOT
  rationale: 히브리어가 지명을 직접 말하므로 이름을 그대로 유지했습니다. 문맥상 공동체/성읍을 가리키는 메토님은 독자가 파악할 수 있게 두었습니다.
- source_word: פְּקִידוֹ
  english_pob_choice: his officer
  chosen_korean: 그의 관리
  alternatives_korean:
  - 그의 대리
  - 그의 임명된 관원
  - 그의 감독
  lexicon: HALOT
  rationale: 임명된 하급 행정관이라는 뜻을 살리면서도 현대 한국어에서 지나치게 군사적이거나 교회적인 뉘앙스를 피하기 위해 ‘관리’를 택했습니다.
- source_word: עִבְדוּ
  english_pob_choice: Serve
  chosen_korean: 섬기십시오
  alternatives_korean:
  - 복종하십시오
  - 섬기세요
  - 종사하십시오
  lexicon: HALOT
  rationale: 정치적 예속의 뉘앙스를 가지지만, 한국어에서 대상을 향한 충성·복속의 경멸적 명령을 가장 자연스럽게 드러내는 표현은 ‘섬기십시오’입니다.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  english_pob_choice: the men of Hamor, the father of Shechem
  chosen_korean: 세겜의 아버지 함몰의 사람들
  alternatives_korean:
  - 세겜의 아버지 함몰의 후손들
  - 함몰의 사람들, 세겜의 아버지의
  lexicon: HALOT
  rationale: ‘사람들’로 직역해 히브리어의 소속 구문을 보존했고, ‘세겜의 아버지’라는 설명적 apposition도 유지했습니다. 인명은 히브리어 המקרא적 이름인 חֲמוֹר를 음역해 ‘함몰’로 옮겼습니다.
- source_word: וּמַדּוּעַ
  english_pob_choice: But why
  chosen_korean: 그런데 우리가 왜
  alternatives_korean:
  - 그런데 왜
  - 왜 그러면
  lexicon: HALOT
  rationale: 새로운 도전과 반문을 여는 접속감을 살리기 위해 ‘그런데’로 이어 주고, 주어 ‘우리가’를 앞세워 히브리어의 강조를 반영했습니다.
theological_decisions:
- issue: 조롱하는 수사적 질문의 어조
  chosen_reading: 직접적인 경멸과 도전의 어조를 유지했습니다.
  alternative_readings:
  - 완곡한 질문조
  - 중립적인 설명문조
  rationale: 이 절은 권위의 정당성을 부정하며 조롱하는 발화이므로, 한국어도 공격성을 약화시키지 않고 반문과 명령의 날을 살렸습니다.
  doctrine_reference: 서술 맥락 보존 원칙
