base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
  footnotes:
  - marker: a
    text: Or, 'the Spirit of the LORD was upon him.' The Hebrew idiom can be rendered more statically, though the narrative context favors 'came upon him.'
    reason: lexical_alternative
  - marker: b
    text: Aram is the Hebrew name often rendered 'Syria' in older English translations.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 영이 그에게 임하셨습니다[a]. 그는 이스라엘을 다스렸고, 전쟁터로 나갔습니다. 야훼께서 아람 왕 구산 리사다임을 그의 손에 넘기셨고[b], 그의 손이 구산 리사다임 위에서 강해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 영이 그 위에 계셨습니다.’ 히브리어 관용구는 더 정적인 표현도 가능하지만, 서사 문맥은 ‘임하셨다’는 동적인 의미를 더 잘 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 히브리어 지명이며, 옛 번역에서 흔한 ‘시리아’는 해석이 개입된 대응입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה
  english_pob_choice: The Spirit of Yahweh came upon him
  chosen_korean: 야훼의 영이 그에게 임하셨습니다
  alternatives_korean:
  - 야훼의 영이 그 위에 계셨습니다
  - 야훼의 영이 그에게 임했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 정적 ‘있다’보다 임하여 능력을 주는 뉘앙스를 가지므로, 문맥에 맞게 ‘임하셨습니다’로 옮겼습니다. ‘영’은 POB의 원문 우선 원칙에 따라 사용했습니다.
- source_word: וַ/יִּשְׁפֹּט אֶת יִשְׂרָאֵל
  english_pob_choice: he judged Israel
  chosen_korean: 그는 이스라엘을 다스렸고
  alternatives_korean:
  - 그는 이스라엘을 재판했습니다
  - 그는 이스라엘을 심판했습니다
  - 그는 이스라엘의 재판관이었습니다
  lexicon: HALOT
  rationale: 사사기의 שׁפט은 단순 재판 행위보다 통치·구원 기능을 포함하므로, 여기서는 문맥을 반영해 ‘다스렸고’로 옮겼습니다. 다만 본문의 직설적 동사를 살리기 위해 완전히 해설적으로 바꾸지는 않았습니다.
- source_word: וַ/יִּתֵּן יְהוָה בְּ/יָד֔/וֹ אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם
  english_pob_choice: Yahweh gave Cushan-rishathaim king of Aram into his hand
  chosen_korean: 야훼께서 아람 왕 구산 리사다임을 그의 손에 넘기셨고
  alternatives_korean:
  - 야훼께서 아람 왕 구산 리사다임을 그의 손에 주셨고
  - 야훼께서 아람 왕 구산 리사다임을 그의 손 안에 넘기셨고
  lexicon: HALOT
  rationale: בְּיָדוֹ는 적을 ‘그의 손에’ 주어 권세 아래 두는 관용구이므로, 한국어에서는 자연스럽게 ‘넘기셨고’로 표현했습니다. ‘아람’은 원문 지명을 따라 보존했습니다.
- source_word: וַ/תָּ֣עָז יָד֔/וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם
  english_pob_choice: his hand prevailed over Cushan-rishathaim
  chosen_korean: 그의 손이 구산 리사다임 위에서 강해졌습니다
  alternatives_korean:
  - 그의 손이 구산 리사다임을 이겼습니다
  - 그의 손이 구산 리사다임보다 우세해졌습니다
  - 그의 손이 구산 리사다임을 압도했습니다
  lexicon: HALOT
  rationale: עזז יד על은 손/힘의 강세와 우위를 나타내는 관용구이므로, ‘강해졌습니다’로 직역적 이미지를 살리면서 승리의 결과를 전달했습니다. ‘위에서’는 Hebrew 전치사의 관계를 반영한 표현입니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에서는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - the LORD
  - 여호와
  rationale: 프로젝트 기본값에 따라 신명기는 고유명사 ‘야훼’로 옮겨, 주어지는 권능의 주체가 단순 호칭이 아니라 언약적 이름임을 드러냈습니다.
  doctrine_reference: 'PROJECT_GLOSSARY: YHWH -> 야훼'
- issue: 사사기의 שׁפט 의미 범위
  chosen_reading: ‘다스렸고’로 옮겨 재판 기능만으로 좁히지 않았습니다.
  alternative_readings:
  - 재판했습니다
  - 심판했습니다
  rationale: 사사기에서 ‘사사하다’는 법정 판결보다 구원자·지도자의 통치 기능을 함께 포함하므로, 본문 문맥에 맞게 통치적 의미를 드러냈습니다.
  doctrine_reference: Judges narrative role of שׁפט
