lexical_decisions:
- source_word: וַיִּשְׁלַח אֵהוּד אֶת יַד שְׂמֹאלוֹ
  english_pob_choice: Then Ehud reached with his left hand
  chosen_korean: 에훗은 왼손을 내밀어
  alternatives_korean:
  - 에훗은 왼손으로 뻗어
  - 에훗은 왼손을 뻗어
  lexicon: HALOT
  rationale: 동작의 핵심은 손을 앞으로 뻗는 움직임이므로, 현대 한국어에서는 ‘내밀어’가 가장 자연스럽게 그 긴박한 신체 동작을 살립니다.
- source_word: הַחֶרֶב
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 그 칼
  - 검
  lexicon: HALOT
  rationale: 히브리어는 일반적으로 ‘칼/검’을 가리키지만, 이 장면의 무기는 짧은 무기라는 문맥상 ‘칼’이 한국어 독자에게 가장 자연스럽고 장면에 맞습니다.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  english_pob_choice: from his right thigh
  chosen_korean: 오른쪽 넓적다리에서
  alternatives_korean:
  - 오른쪽 허벅지에서
  - 오른쪽 넓적다리 위에서
  lexicon: HALOT
  rationale: 무기가 몸의 오른쪽 허벅지에 매달려 있던 위치를 구체적으로 살리되, 한국어에서는 ‘넓적다리’가 가장 표준적이고 분명합니다.
- source_word: וַיִּתְקָעֶהָ בְּבִטְנוֹ
  english_pob_choice: and thrust it into his belly
  chosen_korean: 그의 배를 찔렀습니다
  alternatives_korean:
  - 그의 배에 찔러 넣었습니다
  - 그의 복부를 찔렀습니다
  lexicon: HALOT
  rationale: 동사의 폭력적이고 단번의 관통 행위를 살리면서도, ‘배’가 본문의 직접적이고 생생한 신체 표현을 가장 잘 전달합니다.
theological_decisions:
