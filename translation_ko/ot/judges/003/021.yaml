  source_fidelity: 히브리어의 동작 순서와 핵심 요소(왼손을 뻗음, 오른쪽 넓적다리에서 칼을 취함, 그의 배에 찔러 넣음)는 대체로 잘 반영되어 있습니다. 다만 ‘그의 배를 찔렀습니다’는 칼을 배 속으로 밀어 넣는 וַיִּתְקָעֶהָ בְּבִטְנוֹ의 방향성과 목적어 관계를 다소 약화하므로 ‘그의 배에 찔러 넣었습니다’가 더 정확합니다.
