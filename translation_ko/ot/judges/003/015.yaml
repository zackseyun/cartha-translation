base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'a left-handed man.' The Hebrew literally describes Ehud as limited or restricted in his right hand.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 자손이 야훼께 부르짖었습니다. 야훼께서 그들을 위해 구원자 에훗을 일으키셨으니, 그는 게라의 아들요 베냐민 사람이며, 오른손이 불편한 사람이었습니다. 이스라엘 자손은 그의 손을 통해 모압 왕 에글론에게 공물을 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 전통적으로는 ‘왼손잡이인 사람’입니다. 히브리어는 문자적으로 그의 오른손이 제한되었거나 묶인 상태를 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  english_pob_choice: cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 외쳤습니다
  - 구원을 요청하며 외쳤습니다
  lexicon: HALOT
  rationale: 위기와 절규의 뉘앙스를 살리면서, 문맥상 암시되지만 본문에 없는 ‘구원을 요청하며’를 덧붙이지 않았습니다.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  english_pob_choice: raised up for them a deliverer
  chosen_korean: 그들을 위해 구원자 … 일으키셨습니다
  alternatives_korean:
  - 그들을 위해 구원자를 세우셨습니다
  - 그들을 위해 구출자를 일으키셨습니다
  lexicon: HALOT
  rationale: 하나님이 재판관을 세우시는 관용 표현을 살리기 위해 ‘일으키다’를 썼고, מוֹשִׁיעַ는 이 역사적 문맥에서 ‘구원자’로 옮겼습니다.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  english_pob_choice: a man hindered in his right hand
  chosen_korean: 오른손이 불편한 사람
  alternatives_korean:
  - 오른손이 제약된 사람
  - 왼손잡이인 사람
  lexicon: HALOT
  rationale: 히브리어가 단순히 ‘왼손잡이’라기보다 오른손의 제약을 말하므로, 본문의 모호성을 유지하는 표현을 택했습니다.
- source_word: בְּיָדוֹ ... מִנְחָה
  english_pob_choice: sent tribute by his hand
  chosen_korean: 그의 손을 통해 공물을 보냈습니다
  alternatives_korean:
  - 그를 통해 공물을 보냈습니다
  - 그의 손으로 공물을 보냈습니다
  lexicon: HALOT
  rationale: בְּיָד의 도구적 의미를 살리되 한국어에서 자연스럽게 읽히도록 ‘손을 통해’로 옮겼습니다. מִנְחָה는 정치적 예물로서 ‘공물’이 적절합니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어 관용구를 직결해 성별-정확성을 유지하면서도 한국어에서 익숙한 형태로 표현했습니다.
