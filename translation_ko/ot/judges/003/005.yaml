    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: And the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: בְּנֵי의 문자적 의미를 살리되, 한국어에서는 ‘자손’이 남성 복수의 혈연적·집단적 뉘앙스를 자연스럽게 전달합니다.
- source_word: יָשְׁבוּ
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 계속적 거주를 나타내므로, 현대 한국어에서 가장 분명한 ‘살다’로 옮기는 것이 적절합니다.
- source_word: בְּקֶרֶב
  english_pob_choice: among
  chosen_korean: 가운데
  alternatives_korean:
  - 한가운데
  - 사이에
  lexicon: HALOT
  rationale: ‘~가운데’는 여러 민족들 사이에서 함께 거주했다는 관계적 의미를 자연스럽게 드러냅니다.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  english_pob_choice: the Canaanites ... the Jebusites
  chosen_korean: 가나안 사람들, 헷 사람들, 아모리 사람들, 브리스 사람들, 히위 사람들, 여부스 사람들
  alternatives_korean:
  - 가나안 족속들, 헷 족속들, 아모리 족속들, 브리스 족속들, 히위 족속들, 여부스 족속들
  lexicon: HALOT
  rationale: 히브리어의 단수형 민족명이라도 목록에서는 집단 전체를 가리키므로, 한국어에서는 사람들/족속들로 복수 집단을 분명히 나타내는 것이 자연스럽습니다.
