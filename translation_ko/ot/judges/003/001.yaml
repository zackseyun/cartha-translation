base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'Now these are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
  footnotes:
  - marker: a
    text: Or 'had not experienced any of the wars of Canaan.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이들은 야훼께서 그들로 이스라엘, 곧 가나안의 어떤 전쟁도 알지 못한[a] 모든 사람을 시험하시려고 남겨 두신 민족들입니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안의 전쟁들을 경험하지 못한’.
    reason: ידע는 이 문맥에서 단순한 지식뿐 아니라 전쟁을 직접 겪어 아는 경험적 의미를 나타낼 수 있습니다.
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: Now these are
  chosen_korean: 이제 이들은
  alternatives_korean:
  - 그리고 이들은
  - 이들은
  lexicon: HALOT
  rationale: 새 구간을 여는 전환 표지로서 ‘이제’가 자연스럽고, 지시어 ‘이들은’이 주어를 분명히 살립니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 족속들
  lexicon: HALOT
  rationale: 여기서는 가나안 주변의 정치·민족 집단을 가리키므로 ‘민족들’이 문맥상 가장 자연스럽습니다.
- source_word: לְנַסּוֹת בָּם
  english_pob_choice: to test Israel by them
  chosen_korean: 그들로 … 시험하시려고
  alternatives_korean:
  - 그들을 통해 … 시험하시려고
  - 그들로 … 시험하려고
  lexicon: HALOT
  rationale: 히브리어의 수단/도구적 용법을 한국어의 ‘-로’로 살리면서, 목적절 형태로 자연스럽게 옮겼습니다.
- source_word: לֹא יָדְעוּ אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  english_pob_choice: had not known any of the wars of Canaan
  chosen_korean: 가나안의 모든 전쟁을 알지 못한
  alternatives_korean:
  - 가나안의 전쟁들을 경험하지 못한
  - 가나안의 모든 전쟁을 겪어 알지 못한
  lexicon: HALOT
  rationale: ידע의 ‘경험적으로 알다’는 뉘앙스를 살리되, 본문 표현은 ‘알지 못한’으로 보존했습니다. POB의 각주 취지를 반영해 단순 지식 부재보다 전쟁 경험 부재로 읽힐 수 있습니다.
theological_decisions:
- issue: 야훼의 의도적 남겨 두심과 시험의 목적
  chosen_reading: 야훼께서 그들로 이스라엘을 시험하시려고 남겨 두신
  alternative_readings:
  - 야훼께서 그들을 남겨 두어 이스라엘을 시험하게 하신
  - 야훼께서 이스라엘을 시험하려고 그들을 두신
  rationale: 본문의 목적성과 주어-목적 관계를 그대로 드러내어, 하나님이 의도적으로 남겨 두셨다는 긴장을 완화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
