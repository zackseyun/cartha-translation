  lexicon: HALOT
  rationale: 히브리어의 혈연-집단 표현을 그대로 반영해 ‘이스라엘 자손’으로 옮겼습니다. 이는 원문의 형식을 투명하게 드러냅니다.
- source_word: מֶלֶךְ מוֹאָב
