theological_decisions:
- issue: עבד의 의미가 예배인지 정치적 예속인지
  chosen_reading: 이 구절의 ‘섬기다’는 예배 행위가 아니라 외세 왕권 아래의 종속 상태를 가리킵니다.
  alternative_readings:
  - 예배했다
  - 노예가 되었다
  rationale: 문맥상 이스라엘이 에글론에게 지배당한 기간을 말하므로, 예배 의미는 배제하고 종속의 뉘앙스를 살린 번역을 택했습니다.
  doctrine_reference: 사사기 3장 문맥
- issue: ‘이스라엘 자손’의 집합 명칭 유지
  chosen_reading: 집단 명칭을 ‘이스라엘 자손’으로 유지해 원문이 지닌 문학적·계보적 표현을 보존했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 본문의 형식을 평이하게 풀기보다 원문 어휘를 드러내는 편이, 본문이 말하는 집단 정체성을 더 투명하게 보여 줍니다.
  doctrine_reference: 원문 형식 보존 원칙
