  verdict: revise
  source_fidelity: 핵심 의미는 충실합니다. עבד는 여기서 예배가 아니라 모압 왕에 대한 정치적 종속을 가리키며, ‘섬겼습니다’와 대안 각주는 이를 적절히 구별합니다. 다만 ‘그때’는 히브리어 접속사 וַ의 일반적인 서술 연결을 특정한 시간 지시로 다소 좁히므로 빼는 편이 안전합니다.
  naturalness: ‘이스라엘 자손이 모압 왕 에글론을 … 섬겼습니다’는 현대 표준 한국어의 합쇼체로 자연스럽습니다. 기간 표현은 현대적인 고유어 수사인 ‘열여덟 해 동안’이 ‘십팔 년 동안’보다 더 자연스럽고 명료합니다.
  terminology: ‘이스라엘 자손’, ‘모압 왕 에글론’, ‘섬기다’는 원문의 집합 명칭, 왕의 칭호, 정치적 봉사의 표현을 잘 보존합니다. 각주의 ‘지배를 받았습니다’는 해석적 대안으로 적절합니다.
  issues:
  - severity: low
    issue: 원문에 없는 ‘그때’가 추가되어 있습니다.
    rationale: וַיַּעַבְדוּ의 וַ는 이 문맥에서 앞 서술을 잇는 접속 기능이며, 별도의 ‘그때’라는 시간 지시를 명시하지 않습니다. 한국어에서는 접속어 없이도 자연스럽게 이어집니다.
  - severity: low
    issue: ‘십팔 년’은 현대 표준어 번역문에서는 다소 문어적·한자어적입니다.
    rationale: 의미 오류는 아니지만, 현대적 자연스러움을 위해 ‘열여덟 해 동안’으로 쓰는 것이 좋습니다.
  revised_text: 이스라엘 자손이 모압 왕 에글론을 열여덟 해 동안 섬겼습니다.[a]
