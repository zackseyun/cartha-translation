  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
  footnotes:
  - marker: a
    text: Or 'into the porch,' 'into the antechamber,' or 'into the colonnade'; the Hebrew term is rare and refers to an adjoining architectural space.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 에훗이 해진 곳으로 나가고, 위층 방의 문들을 자기 뒤로 닫고 잠갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘현관’, ‘전실’, ‘기둥 회랑’으로도 옮길 수 있습니다. 이 히브리어는 드물며, 인접한 건축 공간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּסְדְּרוֹנָה
  english_pob_choice: into the vestibule
  chosen_korean: 해진 곳으로
  alternatives_korean:
  - 현관으로
  - 전실로
  - 복도로
  lexicon: HALOT
  rationale: מִסְדְּרוֹן은 드문 건축 용어라 특정 구조로 단정하기보다, 문맥상 ‘안쪽 방에 딸린 연결 공간’이라는 기능을 살려 옮겼습니다. ‘해진 곳’은 한국어로도 낯설 수 있지만, 원문의 애매성을 과도하게 해소하지 않습니다.
- source_word: דַּלְתוֹת
  english_pob_choice: the doors
  chosen_korean: 문들을
  alternatives_korean:
  - 문짝들을
  - 이중문을
  lexicon: HALOT
  rationale: 복수형 דַּלְתוֹת는 문짝들이나 양문을 가리킬 수 있지만, 한국어에서는 자연스럽고 과도한 해석을 피하는 ‘문들’이 가장 무난합니다.
- source_word: הָעֲלִיָּה
  english_pob_choice: the upper room
  chosen_korean: 위층 방
  alternatives_korean:
  - 윗방
  - 다락방
  lexicon: HALOT
  rationale: עֲלִיָּה는 위층에 있는 방을 뜻하므로, 현대 한국어에서 이해가 분명한 ‘위층 방’으로 옮겼습니다. ‘다락방’은 고정관념을 불러일으킬 수 있어 피했습니다.
- source_word: וְנָעָל
  english_pob_choice: and locked them
  chosen_korean: 잠갔습니다
  alternatives_korean:
  - 걸어 잠갔습니다
  - 빗장질렀습니다
  lexicon: HALOT
  rationale: נעל은 문을 잠그다/잠가 두다의 뜻이므로, 현대 서술에 맞는 ‘잠갔습니다’로 충분히 반영했습니다.
