revisions:
- from: 그때 이스라엘 자손이 야훼께 부르짖었고, 야훼께서는 이스라엘 자손을 위해 한 구원자를 세우셔서 그가 그들을 구원하게 하셨습니다. 곧 그 사람은 그나스의 아들 옷니엘, 갈렙보다 나이가 어린 그의 형제였습니다.[a][b][c]
  to: 그때 이스라엘 자손[a]이 야훼께 부르짖었습니다. 야훼께서는 이스라엘 자손을 위하여 구원자[b]를 세우셨습니다. 곧 그들을 구원한 이는 그나스의 아들 옷니엘, 갈렙의 아우[c]였습니다.
  rationale: 야훼가 세우신 구원자와 그 구원자가 실제로 이스라엘을 구원한 사실을 원문의 연속된 서술대로 옮겼습니다. 관계 표현의 불명확한 대명사를 제거하고, 비교급이 ‘갈렙보다 어린’을 뜻한다는 점은 각주에서 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:16Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그가 그들을 구원하게 하셨습니다’는 야훼께서 옷니엘에게 구원을 행하도록 하셨다는 사역 의미를 더합니다. 히브리어는 야훼께서 구원자를 세우셨고, 그 구원자(옷니엘)가 그들을 구원했다고 진술합니다. 또한 ‘그의 형제’는 선행사가 불분명합니다.
  naturalness: 문장을 둘로 나누고 ‘갈렙의 아우’로 관계를 직접 밝혀 현대 표준어 합쇼체에서 더 자연스럽고 명료하게 했습니다.
  terminology: ‘야훼’, ‘이스라엘 자손’, ‘구원자’, ‘그나스’, ‘옷니엘’은 원문 및 제시된 번역 방침에 부합합니다. ‘구원자’에는 인간적·역사적 구출자라는 뜻을 각주로 한정했습니다.
  issues:
