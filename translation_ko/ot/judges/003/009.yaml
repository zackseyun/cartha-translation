source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
  footnotes:
  - marker: a
    text: Or, 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Deliverer'' could also be rendered ''savior'' or ''rescuer''; the Hebrew refers here to a human agent raised up by God to rescue Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'the younger brother of Caleb.' The Hebrew phrase identifies Othniel in relation to Caleb and indicates that he was younger than Caleb.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이스라엘 자손이 야훼께 부르짖었고, 야훼께서는 이스라엘 자손을 위해 한 구원자를 세우셔서 그가 그들을 구원하게 하셨습니다. 곧 그 사람은 그나스의 아들 옷니엘, 갈렙보다 나이가 어린 그의 형제였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들.’ 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구원자’는 ‘구해 주는 이’ 또는 ‘구출자’로도 옮길 수 있습니다. 여기서는 하나님이 세우신 인간 대리자를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘갈렙의 동생.’ 히브리어는 옷니엘이 갈렙과의 관계에서 그보다 어린 사람임을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: WLC
  rationale: 직역의 친족 표현을 살리되 한국어에서도 자연스럽게 읽히는 성경적 표현인 ‘이스라엘 자손’을 택했습니다.
- source_word: וַיִּזְעֲקוּ
  english_pob_choice: cried out
  chosen_korean: 부르짖었고
  alternatives_korean:
  - 외쳤고
  - 간청했고
  lexicon: HALOT
  rationale: 여기서는 단순한 호명이 아니라 위기 속의 절박한 도움 요청이므로 ‘부르짖다’가 원문의 긴박성을 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 언약 이름이 직접 쓰였으므로 본문에서 하나님의 고유 이름인 ‘야훼’를 유지했습니다.
- source_word: מוֹשִׁיעַ
  english_pob_choice: deliverer
  chosen_korean: 구원자
  alternatives_korean:
  - 구해 주는 이
  - 해방자
  - 구원하는 이
  lexicon: HALOT
  rationale: 사사기의 군사적 구출 문맥을 반영하면서도, 하나님이 세우신 인간 대리자라는 점을 살려 ‘구원자’로 옮겼습니다.
theological_decisions:
- issue: 야훼가 세우신 인물의 호칭을 어떻게 번역할지
  chosen_reading: ‘구원자’로 옮기되, 그 인물이 하나님이 세우신 인간 대리자임을 본문 흐름으로 드러냈습니다.
  alternative_readings:
  - ‘구해 주는 이’
  - ‘구출자’
  - ‘구세주’
  rationale: 사사기의 מוֹשִׁיעַ는 그리스도론적 ‘구세주’가 아니라 억압에서 이스라엘을 건져 내는 인간 지도자를 가리키므로, 신학적 혼동을 피하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ의 관계를 어떻게 읽을지
  chosen_reading: ‘갈렙보다 나이가 어린 그의 형제’
  alternative_readings:
  - ‘갈렙의 동생’
  - ‘갈렙보다 젊은 그의 형제’
  - ‘갈렙의 형제, 그보다 어린 사람’
  rationale: 히브리어는 옷니엘이 갈렙의 형제이면서 그보다 어린 사람임을 나타내며, 한국어에서는 이 관계를 가장 자연스럽게 드러내는 방식이 필요합니다.
  doctrine_reference: 본문 해석상 결정
