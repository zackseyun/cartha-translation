base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
  footnotes:
  - marker: a
    text: Or 'the Israelites went down with him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the hill country'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 도착하자, 에브라임 산지에서 나팔을 불었습니다. 이스라엘 자손들은 그와 함께 그 산지에서 내려왔고, 그는 그들 앞에 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  english_pob_choice: And when he arrived
  chosen_korean: 그가 도착하자
  alternatives_korean:
  - 그가 왔을 때
  - 그가 도착했을 때
  lexicon: HALOT
  rationale: 시간 전환을 나타내는 בְּ + 동사구를 한국어의 자연스러운 종속절로 처리해, 사건의 순서를 매끄럽게 살렸습니다.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  english_pob_choice: he blew the trumpet
  chosen_korean: 나팔을 불었고
  alternatives_korean:
  - 뿔나팔을 불었고
  - 나팔을 불었으며
  lexicon: HALOT
  rationale: שׁוֹפָר의 신호 기능을 살리면서 현대 한국어에서 자연스러운 '나팔을 불다'를 택했습니다.
- source_word: בְּהַר אֶפְרָיִם / מִן הָהָר
  english_pob_choice: in the hill country of Ephraim / from the hill country
  chosen_korean: 에브라임의 산간지방 / 산간지방에서
  alternatives_korean:
  - 에브라임의 산지 / 산지에서
  - 에브라임의 산지 / 그 산지에서
  lexicon: HALOT
  rationale: הַר가 단일 산보다 지역 전체의 고지대를 가리키므로, 반복되는 지형 표현을 한국어의 '산간지방'으로 일관되게 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들이
  alternatives_korean:
  - 이스라엘의 아들들이
  - 이스라엘 사람들이
  lexicon: HALOT
  rationale: 히브리어의 직역형을 유지하되 한국어 성경에서 널리 이해되는 집합적 표현을 사용해, 남성 복수 표지를 과도하게 희석하지 않았습니다.
- source_word: וְהוּא לִפְנֵיהֶם
  english_pob_choice: and he was before them
  chosen_korean: 그는 그들 앞에 있었습니다
  alternatives_korean:
  - 그는 그들 앞에 있었습니다
  - 그가 그들 앞에 섰습니다
  lexicon: HALOT
  rationale: 직역의 '그들 앞에'를 살리되, 리더십을 암시하는 위치 관계를 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지리 표현의 반복과 행진 방향
  chosen_reading: 두 번째 구절도 '산간지방에서'로 유지해, 동일한 지형 범주가 반복된다는 점을 드러냈습니다.
  alternative_readings:
  - '''산에서'''
  - '''산지에서'''
  rationale: 본문은 같은 지역 범주를 되풀이하므로, 반복을 매끄럽게 줄이기보다 원문의 지리적 연결성을 보존하는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1-2
