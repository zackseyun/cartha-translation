  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
  footnotes:
  - marker: a
    text: Or, 'as far as the entrance of Hamath.' The Hebrew expression can be understood either as a place name, Lebo-hamath, or descriptively.
    reason: alternative_reading
translation:
  language: ko
  text: 블레셋의 다섯 통치자들과 가나안 사람들 모두, 시돈 사람들과 레바논의 산지에 사는 히위 사람들—바알헤르몬 산에서부터 하맛 입구까지—입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 지명 ‘레보하맛’으로도, ‘하맛 입구’라는 기술적 표현으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סַרְנֵי
  english_pob_choice: rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 지도자들
  - 군주들
  - 주들
  lexicon: HALOT
  rationale: 블레셋의 정치적 지도자를 가리키므로, 한국어에서는 현대 독자가 바로 이해할 수 있는 ‘통치자들’이 가장 자연스럽고, ‘주들’처럼 관습적이지만 모호한 표현은 피했습니다.
- source_word: הַכְּנַעֲנִי
  english_pob_choice: all the Canaanites
  chosen_korean: 가나안 사람들 모두
  alternatives_korean:
  - 모든 가나안 사람들
  - 가나안 족속들 모두
  lexicon: HALOT
  rationale: 히브리어 단수형이 집합적으로 쓰였으므로, 한국어에서는 민족 집단을 드러내는 복수 의미로 옮기되 ‘모두’를 붙여 총칭성을 살렸습니다.
- source_word: הַצִּידֹנִי
  english_pob_choice: the Sidonians
  chosen_korean: 시돈 사람들
  alternatives_korean:
  - 시돈 사람들
  - 시돈 족속
  lexicon: HALOT
  rationale: 지명에서 나온 집단명은 한국어 성경 관용에 따라 ‘시돈 사람들’로 옮겨, 민족 집단임을 분명히 했습니다.
- source_word: הַחִוִּי יֹשֵׁב הַר הַלְּבָנוֹן
  english_pob_choice: the Hivites who lived in the hill country of Lebanon
  chosen_korean: 레바논의 산지에 사는 히위 사람들
  alternatives_korean:
  - 레바논 산지에 거주하던 히위 사람들
  - 레바논의 산지에 거주하는 히위 족속
  lexicon: HALOT
  rationale: 분사 יֹשֵׁב는 현재형 서술보다 배경 설명으로 자연스럽게 처리했으며, ‘산지’는 영어 POB의 지리적 이해를 반영해 단일 산봉우리보다 산악 지대를 뜻하게 했습니다.
- source_word: עַד לְבוֹא חֲמָת
  english_pob_choice: as far as Lebo-hamath
  chosen_korean: 하맛 입구까지
  alternatives_korean:
  - 레보하맛까지
  - 하맛으로 들어가는 곳까지
  lexicon: HALOT
  rationale: 히브리어 표현은 지명으로도, 기술적 표현으로도 읽을 수 있으므로, 한국어 본문은 POB의 주석 가능성을 살려 ‘입구’로 풀어 의미를 분명히 했습니다.
theological_decisions:
- issue: 지리 종결구의 처리
  chosen_reading: ‘하맛 입구까지’로 번역해 지명적 독법을 그대로 고정하지 않았습니다.
  alternative_readings:
  - ‘레보하맛까지’로 음역
  - ‘하맛으로 들어가는 곳까지’로 기술
  rationale: 원문의 표현은 장소명일 수도, 설명적 표현일 수도 있어 어느 한쪽으로 단정하면 본문의 여지를 줄입니다. 한국어 본문에서는 의미를 드러내되, 지명으로서의 가능성은 주석 없이도 열어 두었습니다.
  doctrine_reference: 본문 지리 표현의 해석 유보
