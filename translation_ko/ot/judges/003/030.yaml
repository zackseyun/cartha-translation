translation:
  language: ko
  text: 그날 모압은 이스라엘의 손 아래에 굴복했고, 그 땅은 팔십 년 동안 평온했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날에’.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘이스라엘의 손 아래’는 이스라엘의 권세 아래로 들어갔다는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘고요했다’ 혹은 ‘평화로웠다’.
    reason: alternative_reading
