  source_fidelity: 수정 전 본문은 בָּם(‘그들을 통하여/그들로’)의 도구적 의미를 본문에서 생략하고 각주에만 남겼습니다. 또한 ‘명령들을 들려 하는지’는 듣고자 하는 의향을 뜻하여, 계명을 ‘듣다’(곧 귀 기울여 순종하다)라는 히브리어의 문맥상 의미를 충분히 전달하지 못합니다. 수정문은 남겨진 민족들이 시험의 수단이라는 점, 시험의 목적, 야훼의 계명, 모세를 통한 명령을 모두 보존합니다.
  naturalness: ‘시험하려는 데에 있었으니’는 현대 표준 한국어에서 부자연스럽고 문장 연결도 무겁습니다. ‘시험하는 데 쓰였으며’와 ‘지키는지 알아보기 위해’는 합쇼체 서술문으로 자연스럽고 의미가 분명합니다.
