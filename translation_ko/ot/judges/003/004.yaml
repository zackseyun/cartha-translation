source:
  edition: WLC
  text: וַֽ/יִּהְי֕וּ לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל לָ/דַ֗עַת הֲ/יִשְׁמְעוּ֙ אֶת מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁר צִוָּ֥ה אֶת אֲבוֹתָ֖/ם בְּ/יַד מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
  footnotes:
  - marker: a
    text: Or 'to test Israel by them.' The Hebrew explicitly includes 'by/through them,' referring to the nations left in the land as the means of testing.
    reason: lexical_alternative
  - marker: b
    text: '''Listen to'' here carries the sense of heeding or obeying the LORD''s commandments.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'their fathers'; that is, their forefathers or ancestors.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이스라엘을 시험하는 데 쓰였으며[a], 이스라엘이 야훼의 계명들을 지키는지 알아보기 위한 것이었습니다. 그 계명들은 그분께서 모세를 통하여 그들의 조상들에게 명하신 것이었습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 통하여 이스라엘을 시험하기 위해’. 히브리어는 남겨진 민족들이 이스라엘을 시험하는 수단임을 분명히 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘듣다’는 여기서 단순히 소리를 듣는 것이 아니라, 계명에 귀 기울여 순종한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들의 아버지들’이며, 곧 그들의 조상들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: And they were there
  chosen_korean: 그들은 ...에 있었으니
  alternatives_korean:
  - 그들은 거기에 있었습니다
  - 그들은 그곳에 있었습니다
  lexicon: HALOT
  rationale: 문맥상 남겨진 민족들이 단순히 존재한 것이 아니라 그 자리에 남아 있었음을 자연스럽게 드러내기 위해 ‘있다’로 옮겼습니다.
- source_word: לְנַסּוֹת בָּם אֶת יִשְׂרָאֵל
  english_pob_choice: to test Israel / through them
  chosen_korean: 이스라엘을 시험하려는 데에
  alternatives_korean:
  - 그들을 통해 이스라엘을 시험하려는 데에
  - 그들로 이스라엘을 시험하려는 데에
  lexicon: HALOT
  rationale: 히브리어는 남겨진 민족들을 수단으로 이스라엘을 시험한다는 뜻을 담고 있으므로, 목적 구문으로 옮기되 수단성은 전체 문맥에서 드러나게 했습니다.
- source_word: הֲיִשְׁמְעוּ אֶת מִצְוֺת
  english_pob_choice: whether they would listen to the commandments
  chosen_korean: 그들이 ... 명령들을 들려 하는지
  alternatives_korean:
  - 그들이 ... 명령에 순종하려 하는지
  - 그들이 ... 명령을 들으려 하는지
  lexicon: HALOT
  rationale: שׁמע의 ‘듣다’와 ‘순종하다’의 긴장을 살리기 위해, 한국어에서는 직역을 유지하되 문맥상 순종의 의미가 자연히 읽히도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신성표현 יְהוָה는 고유명사적 음역인 ‘야훼’로 일관되게 옮겼습니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들
  alternatives_korean:
  - 그들의 아버지들
  - 그들의 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 한국어 독자에게는 혈통적·언약사적 선대 전체를 가리키는 말로 ‘조상들’이 더 분명합니다.
theological_decisions:
- issue: 시험의 목적과 성격
  chosen_reading: 남겨진 민족들은 이스라엘의 언약적 순종을 드러내는 시험의 수단으로 제시됩니다.
  alternative_readings:
  - 단순한 역사적 사실 진술로만 읽는 것
  - 유혹이나 죄책 강요의 의미로 확장하는 것
  rationale: לְנַסּוֹת와 לָדַעַת의 목적 구조를 보존하되, 시험을 곧바로 유혹 개념으로 환원하지 않고 본문의 목적을 그대로 드러냈습니다.
  doctrine_reference: 절제된 언약적 시험 이해
- issue: ‘그들의 조상들’의 표현
  chosen_reading: ‘조상들’로 옮겨 혈통과 언약의 연속성을 함께 보이게 했습니다.
  alternative_readings:
  - ‘아버지들’로 직역하는 것
  - 성중립적으로 ‘선조들’로만 바꾸는 것
  rationale: 히브리어의 남성 복수형을 무시하지 않으면서도 한국어에서 오해 없이 읽히도록 균형 있게 처리했습니다.
  doctrine_reference: 문법적 성별을 과도하게 신학화하지 않음
