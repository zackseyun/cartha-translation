  to: 그들은 이스라엘을 시험하는 데 쓰였으며[a], 이스라엘이 야훼의 계명들을 지키는지 알아보기 위한 것이었습니다. 그 계명들은 그분께서 모세를 통하여 그들의 조상들에게 명하신 것이었습니다.[b][c]
  rationale: 본문에 בָּם의 도구적 의미를 반영하고, 계명과 관련된 שׁמע의 순종 의미를 자연스러운 한국어로 명확히 했습니다. ‘명하신’은 צִוָּה의 의미를 보존하며, 모세가 매개자라는 בְּיַד מֹשֶׁה의 뜻도 ‘모세를 통하여’로 유지했습니다. 각주는 본문의 번역 선택과 문자적 표현을 보완합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:08:20Z'
