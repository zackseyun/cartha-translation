translation:
  language: ko
  text: 오직 이스라엘 자손의 세대들이 알게 하시려는 것이니, 곧 그들에게 전쟁을 가르치려 하심이며—전에는 그것을 알지 못했던 자들만을 두셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이스라엘의 아들들’입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘전쟁을 경험하지 못했던 자들만을’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  english_pob_choice: only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그저
  lexicon: HALOT
  rationale: 제한하는 부사로서 목적절의 범위를 분명히 하므로, 반복되는 뉘앙스를 살려 ‘오직’으로 옮겼습니다.
- source_word: לְמַעַן דַּעַת
  english_pob_choice: so that ... might know
  chosen_korean: 알게 하시려는 것이니
  alternatives_korean:
  - 알도록 하기 위하여
  - 알게 하려는 목적에서
  lexicon: HALOT
  rationale: 목적을 나타내는 표현이므로 자연스러운 합쇼체로 처리하되, ‘알다’의 핵심 의미를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손들
  lexicon: HALOT
  rationale: 히브리어의 집단적 관용구를 그대로 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: לְלַמְּדָם מִלְחָמָה
  english_pob_choice: to teach them war
  chosen_korean: 그들에게 전쟁을 가르치려 하심이며
  alternatives_korean:
  - 그들에게 전쟁을 훈련시키려 하심이며
  - 그들에게 전쟁을 익히게 하려 하심이며
  lexicon: HALOT
  rationale: ‘למד’의 기본 의미를 ‘가르치다’로 유지하면서, 목적 대상이 ‘전쟁’이므로 군사적 준비의 함의도 드러나게 했습니다.
- source_word: לֹא יְדָעוּם
  english_pob_choice: had not known it
  chosen_korean: 전에는 그것을 알지 못했던 자들만을
  alternatives_korean:
  - 전에는 그것을 경험하지 못했던 자들만을
  - 전에는 전쟁을 알지 못했던 자들만을
  lexicon: HALOT
  rationale: ‘알다’의 본문 어휘를 보존하여 의미 범위를 좁히지 않았고, POB의 대안인 ‘경험하다’는 주석 가능성으로 남겨둘 수 있게 했습니다.
theological_decisions:
- issue: 반복되는 ‘오직’의 신학적 강조
  chosen_reading: 하나님이 남겨 두신 민족들의 목적이 이스라엘의 교육에 있음을 두 번의 ‘오직’으로 드러냈습니다.
  alternative_readings:
  - 첫 번째 ‘오직’을 완화하여 한 번만 강조할 수 있습니다.
  rationale: 본문은 남겨짐이 우연이 아니라 교육 목적 아래 있음을 반복으로 강조하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: ‘전쟁을 알다’의 의미 범위
  chosen_reading: ‘알다’를 유지하되, 문맥상 전쟁의 실제 경험과 학습이 함께 포함될 수 있도록 열어 두었습니다.
  alternative_readings:
  - ‘전쟁을 경험하다’로 해석을 좁힐 수 있습니다.
  - ‘전쟁을 익히다’로 교육적 의미를 강화할 수 있습니다.
  rationale: 히브리어 ידע는 단순 정보 인지보다 넓은 의미를 가지므로, 본문이 허용하는 의미 폭을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
