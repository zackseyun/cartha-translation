revisions:
- from: 오직 이스라엘 자손의 세대들이 알게 하시려는 것이니, 곧 그들에게 전쟁을 가르치려 하심이며—전에는 그것을 알지 못했던 자들만을 두셨습니다.[a][b]
  to: 이는 오직 이스라엘 자손[a]의 세대들, 곧 전에는 전쟁을 알지 못했던 자들에게만 전쟁을 가르쳐 알게 하시려는 것이었습니다.[b]
  rationale: 목적을 나타내는 לְמַעַן과 두 개의 רַק을 보존하면서, 본문에 명시되지 않은 새 주절 ‘두셨습니다’를 제거했습니다. ‘전쟁을 가르쳐 알게 하다’는 ‘알다’와 ‘가르치다’의 연속을 자연스럽게 나타내며, ‘경험하다’라는 해석적 대안은 각주에만 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:08:22Z'
