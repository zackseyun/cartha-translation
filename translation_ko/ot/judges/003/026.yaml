source:
  edition: WLC
  text: וְ/אֵה֥וּד נִמְלַ֖ט עַ֣ד הִֽתְמַהְמְהָ֑/ם וְ/הוּא֙ עָבַ֣ר אֶת הַ/פְּסִילִ֔ים וַ/יִּמָּלֵ֖ט הַ/שְּׂעִירָֽתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
  footnotes:
  - marker: a
    text: Or 'the idols' or 'the graven images' for 'the carved images.'
    reason: lexical_alternative
  - marker: b
    text: Seirah may also be rendered 'Seirath' in English transliteration.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 에훗은 그들이 지체하는 동안에 도망쳤고, 새긴 우상들 너머로 지나가서 세이라로 도망쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘새긴 우상들’은 직역에 가깝습니다. 문맥에 따라 ‘우상들’ 또는 ‘새긴 형상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘세이라’는 영어 전통 표기 ‘Seirath’를 반영해 ‘세이랏’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵה֥וּד נִמְלַ֖ט
  english_pob_choice: But Ehud escaped
  chosen_korean: 에훗은 … 도망쳤고
  alternatives_korean:
  - 에훗은 … 탈출했고
  - 에훗은 … 빠져나갔고
  lexicon: HALOT
  rationale: נִמְלַט의 성공적 탈출을 자연스러운 현대 한국어 동사 ‘도망쳤고’로 옮겨, 서사의 긴박함과 반복 동사의 효과를 살렸습니다.
- source_word: עַ֣ד הִֽתְמַהְמְהָ֑/ם
  english_pob_choice: while they delayed
  chosen_korean: 그들이 지체하는 동안에
  alternatives_korean:
  - 그들이 머뭇거리는 동안에
  - 그들이 머무는 동안에
  lexicon: HALOT
  rationale: Hitpael of מהה가 나타내는 ‘지체/지연’의 의미를 반영해, 사건의 시간적 배경을 분명히 하는 표현으로 옮겼습니다.
- source_word: אֶת הַ/פְּסִילִ֔ים
  english_pob_choice: the carved images
  chosen_korean: 새긴 우상들
  alternatives_korean:
  - 새긴 형상들
  - 조각한 우상들
  - 새긴 상들
  lexicon: HALOT
  rationale: פְּסִילִים의 문자적 의미인 ‘새겨 만든 형상’과 문맥상 우상성을 함께 드러내기 위해 ‘새긴 우상들’을 선택했습니다.
- source_word: הַ/שְּׂעִירָֽתָ/ה
  english_pob_choice: Seirah
  chosen_korean: 세이라
  alternatives_korean:
  - 세이랏
  - 세이라스
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 적절하므로 현대 표기 관행에 맞춰 ‘세이라’로 옮겼습니다.
- source_word: וְ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 그런데
  lexicon: HALOT
  rationale: 앞선 장면의 대기와 지체와 대비되는 전환을 살리기 위해 단순 접속사보다 대조를 나타내는 ‘그러나’를 택했습니다.
