  text: 그때 에훗이 그에게 나아갔습니다. 그는 자기만을 위한 서늘한 다락방[a]에 홀로 앉아 있었습니다. 에훗이 말했습니다. “당신에게 전할 하나님께로부터의 말씀[b]이 있습니다.” 그러자 그가 자리[c]에서 일어났습니다.
