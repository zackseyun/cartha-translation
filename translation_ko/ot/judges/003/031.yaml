id: JDG.3.31
reference: Judges 3:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
  footnotes:
  - marker: a
    text: Or 'delivered Israel.' The Hebrew verb can denote rescue or deliverance in a military context.
    reason: lexical_alternative
  - marker: b
    text: An 'ox goad' was a pointed stick used to drive cattle.
    reason: cultural_note
translation:
  language: ko
  text: 그의 뒤에 아낫의 아들 삼갈[a]이 있었는데, 그는 소 몰이 막대기[b]로 블레셋 사람 육백 명을 쳐서 쓰러뜨렸고, 그도 이스라엘을 구원했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아낫의 아들’은 친족 관계를 가리킬 수도 있고 별칭일 수도 있습니다.
    reason: source_note
  - marker: b
    text: ‘소 몰이 막대기’는 소를 몰기 위해 쓰던 뾰족한 막대기입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרָיו / After him
  english_pob_choice: After him
  chosen_korean: 그 사람 다음에
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  - 에훗 다음에
  lexicon: HALOT
  rationale: 지시 대상이 앞선 사사임을 드러내되, 영어 POB처럼 이름을 본문에 덧넣지 않고 앞뒤 연결을 자연스럽게 살렸습니다.
- source_word: בְּמַלְמַד הַבָּקָר / with an ox goad
  english_pob_choice: with an ox goad
  chosen_korean: 소 몰이 막대기로
  alternatives_korean:
  - 소 몰이 채찍으로
  - 가축 몰이 막대기로
  - 소 몰이 막대로
  lexicon: HALOT
  rationale: מנהל용 도구라는 점을 살리면서도 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다. 'goad'의 기능을 드러내는 말로 '소 몰이 막대기'가 가장 투명합니다.
- source_word: וַיַּךְ / struck down
  english_pob_choice: struck down
  chosen_korean: 쳐죽였고
  alternatives_korean:
  - 쳐서 무찔렀고
  - 쳐 죽였고
  - 무찔렀고
  lexicon: HALOT
  rationale: 전투 맥락의 נכה가 단순한 타격보다 치명적 공격을 가리킬 수 있어, 결과를 약화시키지 않되 과도한 해석을 피하는 표현으로 옮겼습니다.
- source_word: וַיֹּשַׁע / saved
  english_pob_choice: saved
  chosen_korean: 구원했습니다
  alternatives_korean:
  - 구해냈습니다
  - 구했습니다
  - 해방했습니다
  lexicon: HALOT
  rationale: 사사기의 반복되는 구원 동사를 한국어에서 가장 직접적으로 살리는 표현을 택했습니다. POB의 'saved'에 대응하되 종교적 어감을 유지합니다.
theological_decisions:
- issue: שָׁמְגַּר בֶּן־עֲנָת의 '아들' 표기
  chosen_reading: 아낫의 아들
  alternative_readings:
  - 아낫 사람
  - 아낫의 아들 삼갈
  rationale: 히브리어의 직역을 유지해 문맥상 친족관계인지 별칭인지의 불확실성을 보존했습니다. 본문이 분명히 하려는 것은 출신/연결 표지이지 그 성격의 확정이 아닙니다.
  doctrine_reference: '번역 원칙: 문맥이 확정하지 않는 관계를 해석으로 단정하지 않기'
- issue: וַיֹּשַׁע גַּם הוּא אֶת־יִשְׂרָאֵל / he too saved Israel
  chosen_reading: 그도 이스라엘을 구원했습니다
  alternative_readings:
  - 그도 이스라엘을 구했습니다
  - 그도 이스라엘을 해방했습니다
  rationale: 삼갈을 다른 사사들과 나란한 구원자로 제시하는 문맥을 살리되, 그 구원이 어떤 범위와 지속성을 가지는지는 단정하지 않았습니다.
  doctrine_reference: '사사기의 구원 서술: 반복되는 구원 언어를 유지하면서 구원의 신학적 범위를 과도하게 확장하지 않기'
