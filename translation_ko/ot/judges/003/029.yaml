source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֶת מוֹאָ֜ב בָּ/עֵ֣ת הַ/הִ֗יא כַּ/עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ כָּל שָׁמֵ֖ן וְ/כָל אִ֣ישׁ חָ֑יִל וְ/לֹ֥א נִמְלַ֖ט אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
  footnotes:
  - marker: a
    text: Hebrew 'Moab'; the translation makes explicit that the reference is to Moabite men, since the verse immediately counts 'about ten thousand men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'every robust man'; Hebrew 'every fat/stout one,' likely describing well-fed or strong men rather than making a neutral comment on body size alone.
    reason: lexical_alternative
  - marker: c
    text: Or 'every capable man' or 'every mighty man' for 'every man of valor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들이 모압을 쳐서 약 만 명의 사람들, 곧 모든 살진 사람과 모든 용사들을 죽였으니, 한 사람도 도망하지 못했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직접 목적어를 ‘모압’으로 두지만, 문맥상 모압 사람들, 곧 전투원들을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘살진’은 문자적으로는 ‘살찐’이지만, 이 문맥에서는 잘 먹어 기운이 있거나 건장한 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘용사들’은 ‘모든 용맹한 사람’ 또는 ‘모든 유능한 사람’의 뜻을 함께 담는 관용적 옮김입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  english_pob_choice: they struck down
  chosen_korean: 쳐서 ... 죽였으니
  alternatives_korean:
  - 쳐서 쓰러뜨렸으니
  - 죽였으니
  - 쳐서 멸했으니
  lexicon: HALOT
  rationale: 전투 문맥의 נכה는 단순한 ‘치다’보다 결과가 드러나는 ‘쳐서 죽이다/쓰러뜨리다’가 적절합니다. 한국어에서는 전투 피해를 분명히 드러내되 과도하게 해석하지 않도록 ‘쳐서 ... 죽였으니’로 옮겼습니다.
- source_word: אֶת מוֹאָב
  english_pob_choice: men of Moab
  chosen_korean: 모압을
  alternatives_korean:
  - 모압 사람들을
  - 모압의 사람들을
  - 모압 남자들을
  lexicon: HALOT
  rationale: 히브리어는 직접 목적어를 단순히 ‘모압’으로 두지만, 뒤의 수사 표현이 이미 전투 대상의 남성 집단임을 드러냅니다. 본문을 지나치게 풀지 않고 POB의 처리처럼 대상 집단을 문맥상 이해되도록 ‘모압을’로 유지했습니다.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  english_pob_choice: about ten thousand men
  chosen_korean: 약 만 명의 사람들
  alternatives_korean:
  - 약 만 명의 남자들
  - 대략 만 명의 사람들
  - 만 명가량의 사람들
  lexicon: HALOT
  rationale: כְּ-는 근사치를 나타내므로 ‘약’이 자연스럽습니다. 이 구절은 ‘남자’를 뜻하는 אִישׁ을 포함하지만, 바로 앞의 집단 표지와 뒤의 수식어가 전투원 집합을 가리키므로 한국어에서는 읽기 자연성을 위해 ‘사람들’로 처리했습니다.
- source_word: כָּל שָׁמֵן
  english_pob_choice: every stout man
  chosen_korean: 모든 살진 사람
  alternatives_korean:
  - 모든 살진 자
  - 모든 튼튼한 사람
  - 모든 비대한 사람
  lexicon: HALOT
  rationale: שָׁמֵן은 문자적으로 ‘살찐’이지만, 이 문맥에서는 단순 체형 묘사보다 전투 가능한 강건함을 암시할 수 있습니다. 다만 원어의 구체적 이미지를 살리기 위해 ‘살진’으로 옮기고, 한국어에서는 불필요한 완곡화를 피했습니다.
- source_word: וְכָל אִישׁ חָיִל
  english_pob_choice: every man of valor
  chosen_korean: 모든 용사들
  alternatives_korean:
  - 모든 무용한 사람들
  - 모든 유력한 사람들
  - 모든 강한 사람들
  lexicon: HALOT
  rationale: אִישׁ חָיִל은 군사적 문맥에서 ‘용사, 능력 있는 사람, 무장한 전사’의 뜻을 가집니다. 관용적 표현을 살려 ‘용사들’로 옮겨 전투 맥락을 선명하게 했습니다.
- source_word: וְלֹא נִמְלַט אִישׁ
  english_pob_choice: not a man escaped
  chosen_korean: 한 사람도 도망하지 못했습니다
  alternatives_korean:
  - 한 사람도 피하지 못했습니다
  - 한 사람도 살아남지 못했습니다
  - 한 사람도 빠져나가지 못했습니다
  lexicon: HALOT
  rationale: נמלט는 ‘도망하다, 빠져나가다, 탈출하다’의 뜻입니다. 전투 패배의 총체성을 살리면서 한국어 독자에게 자연스러운 결과를 위해 ‘도망하지 못했습니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 결과의 총체성
  chosen_reading: 한 사람도 도망하지 못했습니다.
  alternative_readings:
  - 한 사람도 빠져나가지 못했습니다
  - 한 사람도 살아남지 못했습니다
  rationale: 히브리어의 부정 표현은 전멸에 가까운 완전한 패배를 강조합니다. ‘도망하지 못했습니다’는 탈출 불가의 총체성을 전달하면서도 과도하게 생명 결과를 단정하지 않습니다.
  doctrine_reference: 본문 서술의 강도 유지; 역사 서술의 총체적 패배 표현
- issue: ‘אִישׁ’의 한국어 처리
  chosen_reading: 약 만 명의 사람들
  alternative_readings:
  - 약 만 명의 남자들
  - 약 만 명의 용사들
  rationale: 원어의 אִישׁ은 남성 집단을 가리키지만, 한국어에서 ‘남자들’로 반복하면 문장이 경직될 수 있습니다. 본문 내 전투 대상은 뒤의 수식어로 충분히 특정되므로 의미를 유지하는 범위에서 더 자연스러운 ‘사람들’을 택했습니다.
  doctrine_reference: 문맥상 지시 대상의 명시화; 성별 표지의 기능 보존
