id: JDG.3.22
reference: Judges 3:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֨א גַֽם הַ/נִּצָּ֜ב אַחַ֣ר הַ/לַּ֗הַב וַ/יִּסְגֹּ֤ר הַ/חֵ֨לֶב֙ בְּעַ֣ד הַ/לַּ֔הַב כִּ֣י לֹ֥א שָׁלַ֛ף הַ/חֶ֖רֶב מִ/בִּטְנ֑/וֹ וַ/יֵּצֵ֖א הַֽ/פַּרְשְׁדֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
  footnotes:
  - marker: a
    text: Or, 'the handle' or 'the shaft' also went in after the blade.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'dung' is rare and may refer more broadly to feces or the contents of the bowels.
    reason: lexical_alternative
translation:
  language: ko
  text: 칼날 뒤쪽의 칼자루까지 들어갔고[a], 지방이 칼날을 덮었습니다. 그가 칼을 그의 배에서 뽑아 내지 않았기 때문입니다. 그리고 배설물이 나왔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘니차브’는 여기서 칼날 뒤에 있는 부분을 가리키며, ‘칼자루’, ‘손잡이’ 또는 ‘자루’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 희귀어는 전통적으로 ‘배설물’로 이해됩니다. 문맥에 따라 대변 또는 장의 내용물을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  english_pob_choice: the hilt / the handle / the shaft
  chosen_korean: 칼자루
  alternatives_korean:
  - 손잡이
  - 자루
  lexicon: HALOT
  rationale: 칼이 몸 안으로 들어가는 장면에서 무기의 손잡이 부분을 가리키므로, 한국어로는 가장 자연스럽고 구체적인 칼 부분인 ‘칼자루’가 적절합니다.
- source_word: הַלַּהַב
  english_pob_choice: the blade
  chosen_korean: 칼날
  alternatives_korean:
  - 날
  - 칼끝
  lexicon: HALOT
  rationale: 문맥상 불꽃이 아니라 무기의 날을 뜻하므로, 현대 한국어에서 분명한 ‘칼날’로 옮겼습니다.
- source_word: וַיִּסְגֹּר הַחֵלֶב בְּעַד הַלַּהַב
  english_pob_choice: the fat closed over the blade
  chosen_korean: 살이 칼날을 덮었으니
  alternatives_korean:
  - 기름기가 칼날을 덮었으니
  - 살이 칼날 위로 닫혔으니
  lexicon: HALOT
  rationale: 히브리어는 ‘지방/살’이 칼날을 둘러싸듯 덮는 장면을 그리므로, 한국어에서는 동작을 자연스럽게 풀어 ‘덮었으니’로 표현했습니다.
- source_word: הַפַּרְשְׁדֹנָה
  english_pob_choice: the dung
  chosen_korean: 배설물
  alternatives_korean:
  - 똥
  - 분변
  - 장 내용물
  lexicon: HALOT
  rationale: 이 희귀어는 배설물 또는 장 내용물로 이해될 수 있으므로, 직설적이되 지나치게 구어적이지 않은 ‘배설물’을 택해 본문의 충격성을 보존했습니다.
theological_decisions:
- issue: 노골적인 신체 묘사의 전달 방식
  chosen_reading: 히브리어 서사의 직설성과 육체성을 살려 완곡하게 희석하지 않았습니다.
  alternative_readings:
  - ‘살이 칼날을 감쌌습니다’처럼 완화하는 번역
  - ‘똥’처럼 더 구어적인 표현
  rationale: 본문은 에글론 살해 장면의 물리적·혐오적 디테일을 의도적으로 제시하므로, 서사의 효과를 유지하는 방향이 적절합니다.
  doctrine_reference: 본문 내러티브의 사실성과 수사적 강도 보존
