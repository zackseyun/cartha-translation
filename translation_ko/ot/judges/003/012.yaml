theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יהוה를 ‘야훼’로 직역하여 고유 이름을 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신적 호칭이 아니라 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 야훼의 주권적 개입과 심판의 긴장
  chosen_reading: 야훼께서 에글론을 이스라엘의 대적으로 강하게 하셨다고 직접 옮겼습니다.
  alternative_readings:
  - 야훼께서 에글론이 강해지도록 허락하셨습니다
  - 야훼께서 에글론에게 승리를 주셨습니다
  rationale: 본문은 이스라엘의 악행에 대한 대응으로 야훼의 능동적 개입을 말하므로, 그 긴장을 완화하지 않고 원문의 직접성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
