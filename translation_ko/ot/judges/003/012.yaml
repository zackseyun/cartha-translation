translation:
  language: ko
  text: 이스라엘 자손이 또 야훼 보시기에 악한 일을 하였고, 야훼께서 모압 왕 에글론을 이스라엘을 대적하도록 강하게 하셨으니, 이는 그들이 야훼 보시기에 악한 일을 하였기 때문입니다.[a]
