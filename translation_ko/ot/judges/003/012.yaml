translation:
  language: ko
  text: 이스라엘 자손[a]이 다시 야훼 보시기에 악한 일을 하였습니다. 그러자 야훼께서는 모압 왕 에글론을 이스라엘에 맞서 강하게 하셨습니다. 이는 그들이 야훼 보시기에 악한 일을 하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어를 직역한 표현이며, 관용적으로는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
