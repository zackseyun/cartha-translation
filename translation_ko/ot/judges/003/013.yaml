  source_fidelity: 초안은 וַיִּירְשׁוּ의 복수 주어를 ‘그들이’로 옮긴 점은 적절합니다. 그러나 עֲמָלֵק은 본문에서 ‘아말렉’이라는 집단 명칭으로 나타나며, ‘아말렉 자손’은 원문에 없는 ‘자손’을 보충합니다. 또한 עִיר הַתְּמָרִים의 통상적 의미인 ‘종려나무 성’이 ‘날짜의 성’으로 잘못 번역되었습니다.
  naturalness: ‘자기에게로 모아’는 자연스럽지만, 현대 표준어 합쇼체 서술로는 문장 종결을 ‘-습니다’로 통일하는 편이 적절합니다. ‘종려나무 성’은 지명성 묘사를 보존하면서도 자연스럽습니다.
  terminology: 암몬은 ‘암몬 자손’으로, עֲמָלֵק은 집단 명칭을 살려 ‘아말렉 사람들’로 옮겼습니다. עִיר הַתְּמָרִים은 본문에서 여리고로 대체하지 않고 ‘종려나무 성’으로 유지하며, 추정적 동일시는 각주에 둡니다.
