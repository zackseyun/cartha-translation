  text: 그 땅은 사십 년 동안 평안하였습니다. 그 뒤에 그나스의 아들 옷니엘이 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  english_pob_choice: had rest
  chosen_korean: 평온하였고
  alternatives_korean:
  - 쉬었고
  - 평안하였고
  - 고요하였고
  lexicon: HALOT
  rationale: 문맥상 사사기의 정형 표현은 압제에서 벗어난 ‘평화로운 안정 상태’이므로, 단순히 ‘조용했다’보다 ‘평온하였다’가 원문과 영어 POB의 의미를 가장 자연스럽게 반영합니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅이
  - 나라가
  - 그 나라
  lexicon: HALOT
  rationale: 이 절의 אֶרֶץ는 보편적 ‘땅/토지’가 아니라 이스라엘의 지면적·공동체적 영역을 가리키므로, 관사성까지 살려 ‘그 땅’으로 옮겼습니다.
- source_word: אַרְבָּעִים שָׁנָה
  english_pob_choice: for forty years
  chosen_korean: 사십 년 동안
  alternatives_korean:
  - 사십 년 동안이나
  - 사십 년
  - 마흔 해 동안
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 표현이므로 한국어에서는 ‘~동안’으로 자연스럽게 풀어 원문의 기간성을 분명히 했습니다.
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었고
  - 별세하였습니다
  - 사망하였습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 죽음을 진술하며, 서술 진행을 살리되 현대 한국어의 직접적 서술인 ‘죽었습니다’가 가장 무리 없습니다.
theological_decisions:
- issue: 사사기 정형 서술의 의미
  chosen_reading: ‘그 땅은 사십 년 동안 평온하였고’로 번역해, 단순한 침묵이 아니라 구원 이후의 안정 상태를 드러냈습니다.
  alternative_readings:
  - 그 땅이 사십 년 동안 쉬었습니다
  - 그 땅이 사십 년 동안 평안하였습니다
  rationale: 이 표현은 재난의 부재를 넘어 사사기의 반복 구조 안에서 하나님이 주신 잠잠함/안정을 암시하므로, 그 역사적·신학적 뉘앙스를 보존하는 쪽이 적절합니다.
  doctrine_reference: 사사기 3장 전체의 순환 구조와 여호와의 구원-안식 패턴
- issue: 이름 구문과 번역 순서
  chosen_reading: ‘옷니엘 곧 그나스의 아들’로 처리해, 인물 식별을 자연스럽게 유지했습니다.
  alternative_readings:
  - 옷니엘, 그나스의 아들
  - 그나스의 아들 옷니엘
  rationale: 히브리어의 인명-계보 구문을 한국어에서 과도하게 기계적으로 따르지 않으면서도, 동일 인물 식별 정보는 명확히 보존했습니다.
  doctrine_reference: 서술형 계보 식별 관행
