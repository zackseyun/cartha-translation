  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
  footnotes:
  - marker: a
    text: Or 'Mesopotamia'; Hebrew 'Aram-naharaim,' traditionally understood as 'Aram of the Two Rivers.'
    reason: alternative_reading
  - marker: b
    text: '''The sons of Israel'' is the literal Hebrew expression; many translations render it ''the Israelites.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼의 분노가 이스라엘을 향해 타올랐고[a], 그들을 아람나하라임의 왕 쿠산리사타임의 손에 넘기셨습니다[b]. 이스라엘 자손은 쿠산리사타임을 팔 년 동안 섬겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 분노가 타올랐고’는 히브리어 관용구를 따라 원문 이미지를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘그들을 그의 손에’는 권세 아래로 넘겨졌다는 뜻을 담는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  english_pob_choice: the anger of Yahweh burned
  chosen_korean: 야훼의 분노가 … 타올랐고
  alternatives_korean:
  - 야훼의 노여움이 … 타올랐고
  - 야훼가 진노하셨고
  lexicon: HALOT
  rationale: 히브리어 관용구는 분노가 ‘타다’는 이미지를 담고 있으므로, 단순한 ‘노여워하셨고’보다 ‘타올랐고’가 원문의 힘을 더 잘 살립니다.
- source_word: וַיִּמְכְּרֵם בְּיַד
  english_pob_choice: he sold them into the hand of
  chosen_korean: 그들을 … 손에 넘기셨습니다
  alternatives_korean:
  - 그들을 … 손에 팔아 넘기셨습니다
  - 그들을 … 권세 아래 넘기셨습니다
  lexicon: HALOT
  rationale: מכר의 ‘팔다’ 이미지는 판단 행위의 언약적 성격을 드러내지만, 한국어에서는 ‘손에 넘기다’가 자연스럽고 ‘팔아 넘기다’의 의미도 충분히 전달합니다.
- source_word: כּוּשַׁן רִשְׁעָתַיִם מֶלֶךְ אֲרַם נַהֲרָיִם
  english_pob_choice: Cushan-rishathaim king of Aram-naharaim
  chosen_korean: 아람나하라임의 왕 쿠산리사타임
  alternatives_korean:
  - 아람나하라임 왕 쿠산리사타임
  - 메소포타미아의 왕 쿠산리사타임
  lexicon: HALOT
  rationale: 고유명사는 음역을 따르되, 지명은 히브리어 형태를 반영해 ‘아람나하라임’으로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 직역을 살리면서도 한국어 성경 문맥에서 자연스러운 관용 표현인 ‘이스라엘 자손’을 사용했습니다.
- source_word: וַיַּעַבְדוּ
  english_pob_choice: served
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 복종했습니다
  - 종노릇했습니다
  lexicon: HALOT
  rationale: עבד는 기본적으로 ‘섬기다/봉사하다’의 뜻이지만, 여기서는 압제 아래의 종속을 가리키므로 문맥상 ‘섬겼습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 야훼의 분노를 의인화된 감정 이미지로 유지할지 여부
  chosen_reading: ‘야훼의 분노가 … 타올랐고’로 직역적 이미지를 유지했습니다.
  alternative_readings:
  - ‘야훼께서 진노하셨고’
  - ‘야훼의 노여움이 일어났고’
  rationale: 본문은 하나님의 심판을 감정의 고조로 묘사하는 관용구를 사용하므로, 이를 평이한 진술로 약화시키지 않고 불타는 이미지를 보존했습니다.
  doctrine_reference: HALOT; Judges narrative style
