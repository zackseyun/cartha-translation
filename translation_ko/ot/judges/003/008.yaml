  source_fidelity: 수정 전 번역은 히브리어의 ‘분노가 타오르다’ 이미지는 잘 보존했으나, וַיִּמְכְּרֵם(‘그들을 팔았다’)를 단순히 ‘넘기셨습니다’로 옮겨 핵심 은유가 약화되었습니다. 또한 각주 b는 본문을 ‘그의 손’이라고 잘못 인용합니다. 히브리어는 ‘쿠산 리사다임의 손에’(בְּיַד ... כּוּשַׁן)이며, ‘그들’을 가리키는 대명사는 손에 붙어 있지 않습니다. 이름은 히브리어 발음에 더 가까운 ‘쿠산 리사다임’으로 바로잡았습니다.
  naturalness: ‘손에 팔아넘기셨습니다’는 한국어에서 자연스럽게 지배·권세 아래 넘긴다는 뜻을 전달하면서도 원문의 ‘팔다’ 은유를 보존합니다. ‘아람나하라임 왕 쿠산 리사다임’은 왕의 칭호와 지명을 명료하게 연결하는 현대 한국어 성경 문체입니다. 전체 문장은 합쇼체로 유지했습니다.
