  source_fidelity: 수정이 필요합니다. 히브리어의 대명사 접미사는 혼인 상대가 상호 다른 집단임을 나타냅니다. 첫 절의 ‘그들의 딸들’은 주변 민족들의 딸들이고, 둘째 절의 ‘그들의 딸들’은 이스라엘의 딸들이며, ‘그들의 아들들’은 주변 민족들의 아들들입니다. 초안의 반복된 ‘자기들의’는 이 지시 대상을 모두 이스라엘로 읽히게 하여 의미를 훼손합니다. 영어 감사 기록에서 ‘their sons’를 이스라엘의 아들들이라고 해설한 부분도 히브리어 문맥과 맞지 않습니다.
