- from: 그들은 자기들의 딸들을 자기들을 위하여 아내로 데려갔으며, 자기들의 딸들을 자기들의 아들들에게 주었고, 그들의 신들을 섬겼습니다.
  to: 이스라엘 자손은 그 민족들의 딸들을 자기 아내로 맞아들이고, 자기 딸들은 그 민족들의 아들들에게 주었으며, 그 민족들의 신들을 섬겼습니다[a].
  rationale: 원문의 혼인 관계에서 각 소유 대명사가 가리키는 집단을 한국어에서 명시하여, 초안이 낳는 ‘자기 딸들을 자기 아들들에게 주었다’라는 오해를 제거했습니다. ‘맞아들이다’와 ‘섬기다’는 각각 לקח 및 עבד의 의미 범위를 보존합니다. 영어 감사 기록의 관련 선행사 해설은 원문에 비추어 재검토되어야 합니다.
