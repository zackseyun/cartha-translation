source:
  edition: WLC
  text: וַ/יִּקְח֨וּ אֶת בְּנוֹתֵי/הֶ֤ם לָ/הֶם֙ לְ/נָשִׁ֔ים וְ/אֶת בְּנוֹתֵי/הֶ֖ם נָתְנ֣וּ לִ/בְנֵי/הֶ֑ם וַ/יַּעַבְד֖וּ אֶת אֱלֹהֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
  footnotes:
  - marker: a
    text: Or "worshiped their gods."
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 그 민족들의 딸들을 자기 아내로 맞아들이고, 자기 딸들은 그 민족들의 아들들에게 주었으며, 그 민족들의 신들을 섬겼습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 민족들의 신들을 예배했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: They took
  chosen_korean: 데려갔으며
  alternatives_korean:
  - 취했습니다
  - 아내로 삼았습니다
  lexicon: HALOT
  rationale: לקח의 기본 의미인 ‘take’를 살리면서, 결혼 관계를 이어지는 표현으로 자연스럽게 드러내기 위해 ‘아내로 데려갔습니다’로 옮겼습니다.
- source_word: לָהֶם לְנָשִׁים
  english_pob_choice: for themselves as wives
  chosen_korean: 자기들을 위하여 아내로
  alternatives_korean:
  - 자기들을 위하여 아내로 삼아
  - 아내로 자기들을 위하여
  lexicon: HALOT
  rationale: 이중 전치사 구조가 지닌 ‘자기들에게 유리하게’와 ‘아내로’의 뜻을 함께 살리기 위해 ‘자기들을 위하여 아내로’로 옮겼습니다.
- source_word: נָתְנוּ לִבְנֵיהֶם
  english_pob_choice: they gave their daughters to their sons
  chosen_korean: 자기들의 딸들을 자기들의 아들들에게 주었고
  alternatives_korean:
  - 자기들의 딸들을 자기들의 아들들에게 시집보냈고
  - 자기들의 딸들을 자기들의 아들들에게 주었습니다
  lexicon: HALOT
  rationale: נתן의 기본 동사 의미인 ‘주다’를 유지하되, 이 문맥이 혼인 배치를 가리키므로 그 함의를 자연스럽게 드러내는 표현으로 다듬었습니다.
- source_word: וַיַּעַבְדוּ אֶת אֱלֹהֵיהֶם
  english_pob_choice: and they served their gods
  chosen_korean: 그들의 신들을 섬겼습니다
  alternatives_korean:
  - 그들의 신들을 예배했습니다
  - 그들의 신들을 섬겨 섬겼습니다
  lexicon: HALOT
  rationale: עבד는 단순한 제의 행위보다 더 넓은 ‘섬김/봉사’의 종속 관계를 뜻할 수 있으므로, 본문이 드러내는 언약적 충성을 반전시켜 보여 주는 ‘섬겼습니다’를 택했습니다.
theological_decisions:
- issue: 'עבד with pagan gods: service or worship'
  chosen_reading: ‘섬겼습니다’는 우상 숭배를 포함하되 그보다 넓은 종속과 충성의 의미를 남깁니다.
  alternative_readings:
  - ‘예배했습니다’는 가능한 번역이지만 행위 자체로 좁아집니다.
  rationale: 본문의 죄는 단지 의례적 예배가 아니라, 다른 신들에게 삶의 충성을 바친 데 있습니다. ‘섬기다’는 그 신학적 넓이를 보존합니다.
  doctrine_reference: Translation philosophy §5 (용어 일관성) and §6 (읽기 쉬운 현대어)
