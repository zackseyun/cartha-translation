  terminology: ‘아내로 맞아들이다’는 혼인 문맥의 לקח을 자연스럽게 반영합니다. ‘섬겼습니다’는 עבד의 폭넓은 종교적 충성/봉사의 의미를 유지합니다. 대안인 ‘예배했습니다’를 각주로 제시할 수 있습니다.
