id: JDG.3.25
reference: Judges 3:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
  footnotes:
  - marker: a
    text: Or 'until they were ashamed.' The Hebrew idiom can denote shame or social embarrassment; here it likely refers to the servants' growing awkwardness as they kept waiting.
    reason: lexical_alternative
  - marker: b
    text: Or 'upper chamber' or 'upstairs room.'
    reason: lexical_alternative
  - marker: c
    text: Or 'their lord.' Here the word refers to their human superior, Eglon.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 부끄러워할 때까지 기다렸습니다[a]. 그런데도 그는 아직 위층 문들을 열고 있지 않았습니다. 그래서 그들이 열쇠를 가져다가 문을 열어 보니, 보십시오, 그들의 주인은 바닥에 쓰러져 죽어 있었습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부끄러워할 때까지’. 히브리어 관용구는 수치와 사회적 어색함을 모두 가리킬 수 있으며, 여기서는 계속 기다리며 느낀 어색함을 뜻할 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘위층 방’ 또는 ‘윗방’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 주인’. 여기서는 에글론을 가리키는 인간 상관을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ עַד בּוֹשׁ
  english_pob_choice: they waited until they were embarrassed
  chosen_korean: 부끄러워할 때까지 기다렸습니다
  alternatives_korean:
  - 부끄러워할 때까지 기다렸습니다
  - 수치스러워할 때까지 기다렸습니다
  - 창피할 때까지 기다렸습니다
  lexicon: HALOT
  rationale: בּוֹשׁ는 여기서 도덕적 수치보다 사회적 어색함에 가까운 기다림의 곤란함을 나타내므로, ‘부끄러워하다/부끄러워할 때까지’가 자연스럽고 원문의 뉘앙스를 잘 살립니다.
- source_word: אֵינֶנּוּ פֹתֵחַ
  english_pob_choice: he still was not opening
  chosen_korean: 아직 ... 열고 있지 않았습니다
  alternatives_korean:
  - 아직 ... 열지 않았습니다
  - 여전히 ... 열고 있지 않았습니다
  lexicon: HALOT
  rationale: 진행 중인 비개방을 나타내는 표현이므로 완료형보다 ‘열고 있지 않았습니다’가 원문의 지속성을 더 잘 드러냅니다.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  english_pob_choice: the doors of the upper room
  chosen_korean: 위층 문들
  alternatives_korean:
  - 위층의 문들
  - 윗방 문들
  - 상층실의 문들
  lexicon: HALOT
  rationale: עֲלִיָּה는 위층 방/상층실을 가리키지만, 한국어에서는 ‘위층’이 공간 관계를 가장 자연스럽게 전달하므로, 복수 ‘문들’도 유지했습니다.
- source_word: אֲדֹנֵיהֶם
  english_pob_choice: their master
  chosen_korean: 그들의 주인
  alternatives_korean:
  - 그들의 주님
  - 그들의 상전
  - 그들의 주인
  lexicon: HALOT
  rationale: 여기서는 신적 호칭이 아니라 시종들의 인간 상관을 가리키므로, 혼동을 피하기 위해 ‘주님’이 아닌 ‘주인’을 택했습니다.
- source_word: נֹפֵל אַרְצָה מֵת
  english_pob_choice: had fallen to the floor, dead
  chosen_korean: 바닥에 쓰러져 죽어 있었습니다
  alternatives_korean:
  - 바닥에 쓰러져 죽어 있었습니다
  - 땅에 쓰러져 죽어 있었습니다
  - 바닥으로 떨어져 죽어 있었습니다
  lexicon: HALOT
  rationale: 실내 장면이므로 ‘바닥’이 ‘땅’보다 더 정확하며, 발견된 상태를 한국어 자연문으로 옮기기 위해 ‘쓰러져 죽어 있었습니다’로 풀었습니다.
theological_decisions:
- issue: אֲדֹנֵיהֶם의 호칭을 신적 ‘주님’으로 읽을지 여부
  chosen_reading: 인간 상관을 뜻하는 사회적 호칭으로 처리해 ‘주인’으로 번역했습니다.
  alternative_readings:
  - 주님
  - 상전
  rationale: 문맥상 에글론을 가리키는 인간적 지위 호칭이므로, 한국어 교회어에서 흔한 ‘주님’은 오해를 낳을 수 있습니다.
  doctrine_reference: 문맥 기반 호칭 구별
