- from: 그들은 부끄러워할 때까지 기다렸습니다[a]. 그런데도 그는 아직 위층 문들을 열고 있지 않았습니다. 그래서 그들이 열쇠를 가져다가 문을 열어 보니, 보십시오, 그들의 주인은 바닥에 쓰러져 죽어 있었습니다[c][b].
  to: 그들은 민망해할 때까지 기다렸습니다[a]. 그런데 보십시오, 그는 위층 방의 문들을 열지 않고 있었습니다[b]. 그래서 그들은 열쇠를 가져다가 그것들을 열었습니다. 보십시오, 그들의 주인[c]이 바닥에 쓰러져 죽어 있었습니다.
  rationale: 원문의 반복된 서사 표지 וְהִנֵּה를 ‘보십시오’로 보존하고, 원문에 없는 ‘열어 보니’의 시험적 뉘앙스를 제거했습니다. עֲלִיָּה의 방 의미를 본문에서 명확히 했으며, 각주의 실제 대안성과 표지 위치를 바로잡았습니다.
