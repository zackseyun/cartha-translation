    rationale: 원문은 두 차례 ‘보라/보십시오’에 해당하는 표지로 장면의 뜻밖의 전환을 표시합니다. 역접 자체는 문맥상 가능하나 원문의 표지 기능을 대체하지는 못합니다.
  - severity: medium
