  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
  footnotes:
  - marker: a
    text: Or “the idols” for “the carved images.” The Hebrew term often refers to cultic images.
    reason: lexical_alternative
  - marker: b
    text: Or “that were at Gilgal.” The Hebrew location phrase is compressed and may indicate proximity or position at Gilgal.
    reason: lexical_alternative
  - marker: c
    text: Or “a secret word” or “a private matter.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 길갈 근처에 있는 새긴 형상들이 있는 곳에서 되돌아와[a][b] 왕에게 말했습니다. “왕께 드릴 비밀한 말이 있습니다.[c]” 그러자 왕이 말했습니다. “잠잠하라.” 그리하여 왕 곁에 서 있던 모든 사람이 왕 앞에서 물러났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상들’. 히브리어는 흔히 숭배와 관련된 새긴 형상들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 위치 표현은 압축되어 있어 ‘길갈에 있는’ 또는 ‘길갈 근처에 있는’으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘비밀스러운 말씀’ 또는 ‘비밀한 일’. 히브리어는 비밀한 말, 메시지, 또는 사안을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא שָׁב
  english_pob_choice: But he himself turned back
  chosen_korean: 그러나 그는 … 돌아와
  alternatives_korean:
  - 그는 되돌아왔습니다
  - 그는 돌아섰습니다
  lexicon: HALOT
  rationale: שָׁב는 단순 ‘돌아가다’보다 이전 이동을 되돌리는 동작을 나타내므로, 서술 흐름을 살려 ‘돌아와’로 옮겼습니다.
- source_word: הַפְּסִילִים
  english_pob_choice: the carved images
  chosen_korean: 새긴 우상들
  alternatives_korean:
  - 새긴 형상들
  - 조각한 우상들
  lexicon: HALOT
  rationale: פסילים의 구체적 조형 이미지를 살리면서 문맥상 우상적 성격도 드러내기 위해 ‘새긴 우상들’을 택했습니다.
- source_word: דְּבַר סֵתֶר
  english_pob_choice: a secret message
  chosen_korean: 비밀스러운 말씀
  alternatives_korean:
  - 비밀한 말
  - 숨은 말
  lexicon: HALOT
  rationale: דבר는 ‘말/말씀/일’의 폭이 있지만, 궁정 대화 맥락에서 자연스러운 한국어로 ‘비밀스러운 말씀’이 원문의 숨겨진 전달 의도를 잘 반영합니다.
- source_word: הָס
  english_pob_choice: Silence
  chosen_korean: 잠잠하라
  alternatives_korean:
  - 조용히 하라
  - 입 다물라
  lexicon: HALOT
  rationale: 짧고 단호한 명령형을 살리되 한국어에서 왕의 명령으로도 자연스러운 표현인 ‘잠잠하라’를 사용했습니다.
theological_decisions:
- issue: 왕의 주변인들이 물러나는 궁정 장면의 표현
  chosen_reading: “그의 앞에서 물러났습니다”로 옮겨, 단순한 공간 이동이 아니라 왕 앞에서의 공식적 퇴장을 드러냈습니다.
  alternative_readings:
  - 그를 떠났습니다
  - 곁을 떠났습니다
  rationale: מֵעָלָיו와 앞의 עֹמְדִים עָלָיו는 궁정 배석자들의 공식적 철수라는 사회적 의미를 가지므로, 이를 분명히 드러냈습니다.
  doctrine_reference: 서사 문맥의 사회적 의미 보존
- issue: ‘비밀스러운 말씀’의 register
  chosen_reading: 에훗의 발언을 정중한 보고 형식으로 살려 왕에게 드리는 말로 처리했습니다.
  alternative_readings:
  - 비밀한 말
  - 숨은 일
  rationale: 직접 화법에서 왕에게 드리는 공손한 표현이 필요하므로, 현대 한국어 합쇼체 안에서 정보 전달의 비밀성을 유지했습니다.
  doctrine_reference: 서사 대화체의 화용 보존
