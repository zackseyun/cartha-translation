review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘새긴 우상들’은 פסילים의 문맥상 함의를 반영하지만, 원문의 구체적 표현인 ‘새긴 형상들’을 곧바로 ‘우상’으로 한정합니다. 또한 ‘길갈 근처에 있는’은 가능한 해석이나, 해당 히브리어 위치 표현의 압축성과 불확실성을 각주로 보존해야 합니다. דְּבַר סֵתֶר는 ‘비밀스러운 말씀’보다 ‘비밀한 말’이 ‘말/일’ 양쪽의 여지를 더 잘 보존합니다.
  naturalness: ‘…우상들에서 돌아와’는 한국어에서 우상으로부터 종교적으로 돌아선다는 뜻으로도 읽힐 수 있습니다. ‘…형상들이 있는 곳에서 되돌아와’는 이동 서술을 자연스럽고 분명하게 드러냅니다. ‘왕 곁에 서 있던 모든 사람’ 및 ‘왕 앞에서 물러났습니다’는 궁정 배석자들의 퇴장을 자연스럽게 나타냅니다.
  terminology: פסילים은 본문에서 ‘새긴 형상들’로 옮기고 ‘우상들’은 각주 대안으로 제시하는 것이 안전합니다. דְּבַר סֵתֶר는 존대 명사 ‘말씀’보다 ‘비밀한 말’로 번역하여 왕에게 전할 비밀 메시지/사안이라는 어휘적 범위를 보존합니다. 직접 발화의 ‘잠잠하라’는 짧은 명령의 어조를 유지하며 현대 한국어 성경 문체에서도 수용 가능합니다.
  issues:
  - severity: medium
    issue: ‘새긴 우상들’이 פסילים을 해석적으로 한정함
    rationale: פסילים은 흔히 숭배 대상 형상을 가리키지만, 기본 의미는 ‘새긴 형상들’입니다. 본문은 이 구체성을 유지하고 ‘우상들’은 각주 대안으로 두는 편이 원문 충실합니다.
  - severity: medium
