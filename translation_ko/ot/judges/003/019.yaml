    rationale: שָׁב מִן은 형상들이 있는 지점에서 되돌아온 이동을 뜻합니다. 한국어 ‘우상들에서 돌아오다’는 다른 의미를 유발할 수 있습니다.
  - severity: medium
    issue: 각주가 본문 끝에 한꺼번에 배치되고 a와 c가 중복됨
    rationale: 각주는 해당 어구에 직접 붙어야 하며, 초안의 a와 c는 모두 דְּבַר סֵתֶר의 대안을 반복합니다. פסילים 및 위치 표현에 대한 핵심 각주도 본문과 연결되어야 합니다.
