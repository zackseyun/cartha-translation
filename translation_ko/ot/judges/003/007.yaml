source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'evil in the eyes of the LORD,' a standard expression for what the LORD judged to be evil.
    reason: lexical_alternative
  - marker: c
    text: Or 'the Asherah poles.' The Hebrew may refer either to cultic objects associated with Asherah or, more broadly, to Asherah worship.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 자손[a]은 야훼께서 보시기에 악을 행하고[b], 그들의 하나님 야훼를 잊었으며, 바알들과 아세라들을[c] 섬겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 직역이며, 더 자연스러운 번역으로는 ‘이스라엘 사람들’이나 ‘이스라엘 백성’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼께서 보시기에 악을 행하다’는 야훼께서 악하다고 판단하신 일을 행한다는 뜻의 히브리어 관용적 평가 표현을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘아세라들’은 아세라와 관련된 제의물, 흔히 ‘아세라 기둥들’ 또는 ‘아세라 목상들’을 가리킬 수도 있고, 더 넓게는 아세라 숭배를 가리킬 수도 있습니다.
    reason: alternative_reading
