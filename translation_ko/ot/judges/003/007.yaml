  - 망각했으며
  lexicon: HALOT
  rationale: 단순한 기억 상실이 아니라 언약적 무시까지 암시하지만, 본문의 기본 동사를 그대로 살리기 위해 ‘잊어버렸으며’를 택했습니다.
- source_word: הַבְּעָלִים / הָאֲשֵׁרוֹת
  english_pob_choice: the Baals / the Asherahs
  chosen_korean: 바알들과 아세라들을
  alternatives_korean:
  - 바알 신들과 아세라 목상들을
  - 바알들과 아세라 기둥들을
  lexicon: HALOT
  rationale: 히브리어 복수형을 보존해 복수의 지역 신격/숭배 대상을 드러내고, 본문 자체의 범위보다 좁은 ‘목상/기둥’으로 한정하지 않았습니다.
