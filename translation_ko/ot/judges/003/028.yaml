    text: Or “Pursue after me.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “has given your enemies, Moab, into your hand,” with “Moab” in apposition to “your enemies.”
    reason: lexical_alternative
  - marker: c
    text: Or “the crossing places of the Jordan toward Moab.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게[a] 말했습니다. 「나를 따라오십시오. 야훼께서 여러분의 원수 모압을 여러분의 손에 넘기셨습니다」. 그래서 그들이 그를 따라 내려가 요르단의 나루[b]들을 모압을 향한 곳에서[c] 점령하고, 아무도 건너가지 못하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 추격하십시오.”
    reason: alternative_reading
  - marker: b
    text: 또는 “요르단의 건넘길들.”
    reason: alternative_reading
  - marker: c
    text: 또는 “모압 쪽으로.”
    reason: alternative_reading
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  english_pob_choice: Follow after me
  chosen_korean: 나를 따라오십시오
  alternatives_korean:
  - 나를 추적하십시오
  - 나를 뒤따르십시오
  lexicon: HALOT
  rationale: 전투적 요청이지만 한국어에서는 ‘추적하다’보다 ‘따라오다’가 자연스럽고, 명령의 긴박감은 문맥으로 보완할 수 있습니다.
- source_word: נָתַן ... בְּיֶדְכֶם
  english_pob_choice: has given ... into your hand
  chosen_korean: 여러분의 손에 넘기셨습니다
  alternatives_korean:
  - 여러분의 손에 주셨습니다
  - 여러분의 권세 아래 두셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘넘기다/건네다’ 이미지를 살리면서, 승리를 보증하는 완료된 행위를 한국어로 자연스럽게 전달합니다.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  english_pob_choice: the fords of the Jordan
  chosen_korean: 요르단의 나루
  alternatives_korean:
  - 요르단의 나루터
  - 요르단의 건넘길
  lexicon: HALOT
  rationale: 군사·지리적 맥락에서 ‘나루’가 가장 간결하고 정확하며, 복수형은 조사와 문맥으로 드러낼 수 있습니다.
- source_word: לְמוֹאָב
  english_pob_choice: against Moab
  chosen_korean: 모압을 향한 곳에서
  alternatives_korean:
  - 모압 쪽으로
  - 모압 맞은편에서
  lexicon: HALOT
  rationale: 문자적으로는 방향/목적을 나타내는 ל이지만, 본문 흐름상 요르단 나루의 위치를 모압 쪽으로 가리키는 의미를 살려 과도한 해석을 피했습니다.
theological_decisions:
- issue: 야훼의 고유명사 표기
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 신적 이름을 직접 사용하므로, 번역 전통의 대체 호칭보다 고유명을 유지하는 것이 출처 충실성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מוֹאָב의 집합명사적 사용
  chosen_reading: ‘모압’으로 옮겼습니다.
  alternative_readings:
  - 모압 사람들
  - 모압 족속
  rationale: 히브리어는 민족/국가명을 직접 제시하므로, 집합적 대상임을 드러내더라도 고유명 자체를 유지하는 편이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: POB source-note on national names as collective entities
