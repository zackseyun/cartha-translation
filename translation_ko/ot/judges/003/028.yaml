  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 לְמוֹאָב는 요르단의 나루들을 수식하는 방향/목적 표현인데, 초안의 “모압을 향한 곳에서”는 점령 장소를 나타내는 부사어처럼 되어 히브리어의 결합 관계와 의미가 흐려집니다. “모압으로 가는 요르단의 나루들”로 옮기면 원문의 방향성을 자연스럽게 보존합니다.
  naturalness: “요르단의 나루들을 모압을 향한 곳에서 점령하고”는 현대 표준어 문장으로 부자연스럽습니다. 또한 “건넘길들”은 일반적인 현대 한국어 표현이 아닙니다. 수정문은 합쇼체를 유지하면서 자연스럽게 읽힙니다.
