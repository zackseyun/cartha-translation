  source_fidelity: ‘안에서’는 חֲדַר הַמְּקֵרָה(서늘한/시원한 방)의 의미를 충분히 전달하지 못하므로, 그 장소의 성격을 본문에 밝혀야 합니다. 또한 וַיִּרְאוּ는 ‘와서 보니’로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: ‘보십시오’는 한국어 서사에서 다소 부자연스럽고 독자에게 직접 말을 거는 듯합니다. ‘와서 보니’가 발견·관찰의 전개를 자연스럽게 나타냅니다. 직접화법은 합쇼체에 맞게 ‘…있는 모양입니다’로 다듬었습니다.
  terminology: ‘종들’은 왕의 수행원이라는 문맥에서 허용됩니다. ‘볼일을 보다’는 히브리어 완곡어를 한국어로 자연스럽게 옮긴 표현이며, 문자적 표현은 주석에서 보존합니다.
