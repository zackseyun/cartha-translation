base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
  footnotes:
  - marker: a
    text: Literally, “covering his feet,” a Hebrew euphemism for relieving oneself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 밖으로 나가자 그의 종들이 들어와 살펴보니, 보십시오, 위층 방의 문들이 잠겨 있었습니다. 그래서 그들은 말했습니다. 「분명히 그는 안에서 볼일을 보고 있겠구나」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적 표현은 “그가 자기 발을 가린다”이며, 몸의 용변을 가리키는 완곡어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  english_pob_choice: When he had gone out
  chosen_korean: 그가 밖으로 나가자
  alternatives_korean:
  - 그가 나갔을 때
  - 그리고 그가 나가자
  lexicon: HALOT
  rationale: 이 절은 에훗의 퇴장 뒤에 종들이 들어오는 시간 순서를 보여 주므로, 한국어에서는 자연스러운 종속 시간절로 처리했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들이
  alternatives_korean:
  - 그의 시종들이
  - 그의 노예들이
  lexicon: HALOT
  rationale: 궁정 맥락에서 기본적으로는 ‘종’이 가장 무난하며, 이 문맥에서는 지위보다 수행 역할이 앞서므로 ‘시종’보다 직접적입니다.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  english_pob_choice: the doors of the upper room
  chosen_korean: 위층 방의 문들이
  alternatives_korean:
  - 상층 방의 문들이
  - 다락방의 문들이
  lexicon: HALOT
  rationale: עֲלִיָּה는 구조적으로 위층/상층의 방을 가리키므로, 현대 한국어로는 ‘위층 방’이 가장 분명합니다.
- source_word: מֵסִיךְ ... אֶת רַגְלָיו
  english_pob_choice: he is relieving himself
  chosen_korean: 볼일을 보고 있겠구나
  alternatives_korean:
  - 몸을 풀고 있겠구나
  - 용변을 보고 있겠구나
  - 발을 가리고 있겠구나
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 의미가 가려지므로, 본문에는 완곡하고도 분명한 한국어 관용 표현을 두고 직역적 뉘앙스는 주석으로 남기는 편이 낫습니다.
theological_decisions:
- issue: 서술문의 완곡 표현을 어떻게 처리할 것인가
  chosen_reading: 본문에서는 노골적 직역보다 한국어 독자가 즉시 이해할 수 있는 완곡한 표현을 사용했습니다.
  alternative_readings:
  - ‘발을 가리고 있겠구나’ 같은 직역형 표현
  - ‘용변을 보고 있겠구나’ 같은 더 직접적인 표현
  rationale: 이 히브리어 관용구는 본문 의미를 알아듣는 것이 핵심이므로, 이야기 흐름을 해치지 않으면서도 의미를 분명히 드러내는 표현을 선택했습니다.
  doctrine_reference: '번역 원칙: 의미 우선, 과도한 직역 회피'
- issue: 경탄/추정 표지의 강도
  chosen_reading: ‘보십시오’와 ‘분명히’로 장면 전환과 추정을 함께 살렸습니다.
  alternative_readings:
  - ‘보라’
  - ‘아마’
  - ‘틀림없이’
  rationale: 히브리어의 서술 전개와 종들의 추정이 모두 중요하므로, 한국어에서도 관찰과 추론의 두 층위를 함께 드러냈습니다.
  doctrine_reference: '번역 원칙: 서사 흐름과 화자 태도 보존'
