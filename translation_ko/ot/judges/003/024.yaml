revisions:
- from: 그가 밖으로 나가자 그의 종들이 들어와 살펴보니, 보십시오, 위층 방의 문들이 잠겨 있었습니다. 그래서 그들은 말했습니다. 「분명히 그는 안에서 볼일을 보고 있겠구나」.[a]
  to: 그가 나간 뒤에 그의 종들이 와서 보니, 위층 방의 문들이 잠겨 있었습니다. 그래서 그들은 말했습니다. “분명히 그는 서늘한 방에서 볼일을 보고[a] 있는 모양입니다.”
  rationale: 원문의 시간 순서와 종들의 관찰을 ‘그가 나간 뒤에 … 와서 보니’로 자연스럽게 보존했습니다. ‘보십시오’는 별도의 독자 호소 없이 관찰 구문에 흡수했습니다. 또한 누락된 ‘서늘한 방’을 복원하고, 완곡어의 문자적 의미는 해당 본문 표현에 연결된 각주로 보존했습니다.
