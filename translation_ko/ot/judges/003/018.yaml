source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/הַקְרִ֖יב אֶת הַ/מִּנְחָ֑ה וַ/יְשַׁלַּח֙ אֶת הָ/עָ֔ם נֹשְׂאֵ֖י הַ/מִּנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
  footnotes:
  - marker: a
    text: Or 'the gift' or 'the offering.' Here the Hebrew term likely refers to tribute presented to a ruler rather than a sacrificial offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 예물을 바치기를 마치자, 그 예물을 나르던 사람들을 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And when
  chosen_korean: …하자
  alternatives_korean:
  - 그리고 …했을 때
  - …하였을 때
  lexicon: HALOT
  rationale: 서사 전환 공식으로서 시간 순서를 자연스럽게 이어 주는 현대 한국어 표현으로 옮겼습니다.
- source_word: כִּלָּה לְהַקְרִיב אֶת הַמִּנְחָה
  english_pob_choice: he had finished presenting the tribute
  chosen_korean: 예물을 바치기를 마치자
  alternatives_korean:
  - 조공을 바치기를 마치자
  - 예물을 드리기를 마치자
  lexicon: HALOT
  rationale: 문맥상 제의적 '제물'보다 상징적·정치적 성격의 바침을 드러내되, 히브리어 מִנְחָה의 넓은 뜻을 살려 '예물'로 옮겼습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the tribute
  chosen_korean: 예물
  alternatives_korean:
  - 조공
  - 선물
  lexicon: HALOT
  rationale: 영어 POB의 'tribute'가 강조하는 공물·헌납의 의미를 고려하되, 한국어에서 너무 군사적·봉건적으로 굳어지지 않도록 '예물'을 택했습니다.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  english_pob_choice: who were carrying the tribute
  chosen_korean: 그 예물을 나르던 사람들
  alternatives_korean:
  - 그 예물을 메고 가던 사람들
  - 그 조공을 들고 있던 사람들
  lexicon: HALOT
  rationale: 분사구가 사람들의 역할을 설명하므로, 자연스러운 현대 한국어로 '나르던 사람들'이라 옮겨 묘사적 기능을 살렸습니다.
theological_decisions:
- issue: מִנְחָה의 성격
  chosen_reading: 제의적 '제물'이 아니라 통치자에게 드리는 정치적 공물/예물로 읽어 '예물'로 옮겼습니다.
  alternative_readings:
  - 제물
  - 조공
  rationale: 영어 POB의 주석처럼 본문 맥락은 제사 행위가 아니라 통치자에게 바치는 공물입니다. 따라서 제의성을 과도하게 강화하지 않으면서도 원문의 넓은 의미를 보존했습니다.
  doctrine_reference: 문맥 우선 원칙; 어휘의 다의성 보존
