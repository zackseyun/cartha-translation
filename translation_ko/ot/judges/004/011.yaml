revisions:
- from: 이제 헤벨 곧 겐 사람은 겐 사람들, 곧 모세의 장인 호밥의 아들들로부터 떨어져 나와 있었고, 자기 천막을 두었는데, 그것은 게데스 곁에 있는 자안님 골짜기의 상수리나무까지 이르렀습니다.[a][b]
  to: 헤벨 곧 겐 사람은 겐 사람들, 곧 모세의 장인[a] 호밥의 자손에게서 떨어져 나와 있었으며, 게데스 곁 사아난님의 상수리나무[b]까지 자기 천막을 쳐 두었습니다.
  rationale: 원문에 없는 ‘이제’와 ‘골짜기’를 삭제하고, 지명 및 문법적 수식 관계를 바로잡았습니다. ‘호밥의 자손’은 히브리어 ‘호밥의 아들들’이 가리키는 집단·계통 의미를 현대 한국어에서 자연스럽게 전달합니다. 주석 표지는 각각 ‘장인’과 ‘상수리나무’에 배치하여 영어 POB의 대안 정보를 정확히 보존했습니다.
