  yaml_path: translation/ot/judges/004/011.yaml
  text: Now Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
  footnotes:
  - marker: a
    text: Or 'the relative by marriage of Moses'; the Hebrew term can be broader than 'father-in-law.'
    reason: alternative_reading
  - marker: b
    text: Or 'the terebinth in Zaannannim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헤벨 곧 겐 사람은 겐 사람들, 곧 모세의 장인[a] 호밥의 자손에게서 떨어져 나와 있었으며, 게데스 곁 사아난님의 상수리나무[b]까지 자기 천막을 쳐 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세의 혼인 친족’. 히브리어 용어는 ‘장인’보다 넓은 혼인 관계의 친족을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘사아난님의 테레빈스 나무’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  english_pob_choice: had separated
  chosen_korean: 떨어져 나와 있었고
  alternatives_korean:
  - 분리되어 있었습니다
  - 떨어져 있었습니다
  lexicon: HALOT
  rationale: נִפְרָד의 분리 상태를 자연스러운 서술로 살리되, 이미 이전에 분리된 배경을 드러내는 완료적 뉘앙스를 반영했습니다.
- source_word: מִ/קַּיִן / הַ/קֵּינִי
  english_pob_choice: the Kenites / the Kenite
  chosen_korean: 겐 사람들 / 겐 사람
  alternatives_korean:
  - 가인 사람들 / 가인 사람
  - 케니 사람들 / 케니 사람
  lexicon: HALOT
  rationale: 문맥상 개인 가인이 아니라 족속명인 겐 사람을 가리키므로, 문맥적 종족 표지를 살려 번역했습니다.
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: the father-in-law of Moses
  chosen_korean: 모세의 장인
  alternatives_korean:
  - 모세의 인척
  - 모세와 혼인으로 맺어진 친족
  lexicon: HALOT
  rationale: 히브리어 חֹתֵן의 기본적 친족 관계를 한국어 관용에 맞게 가장 자연스럽고 구체적인 ‘장인’으로 옮겼습니다.
- source_word: אֵלוֹן בְּצַעֲנִים
  english_pob_choice: the oak in Zaannannim
  chosen_korean: 자안님 골짜기의 상수리나무
  alternatives_korean:
  - 자안님의 상수리나무
  - 자안님의 떡갈나무
  lexicon: HALOT
  rationale: אֵלוֹן의 수종은 문맥상 큰 나무를 가리키므로 ‘상수리나무’로 옮기고, 지명은 음역하되 한국어 지형 감각에 맞게 ‘골짜기’로 보완했습니다.
theological_decisions:
- issue: חֹתֵן מֹשֶׁה의 친족 관계 범위
  chosen_reading: ‘모세의 장인’으로 본문에는 자연스러운 한국어를 쓰되, 더 넓은 혼인 친족 가능성은 본문 밖에서 보류합니다.
  alternative_readings:
  - 모세의 인척
  rationale: POB의 주석이 지적하듯 히브리어는 더 넓은 친족 관계를 포함할 수 있으나, 여기서는 서술상 가장 통용되는 관계를 본문에 두고 해석의 여지는 유지하는 편이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
