base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Now Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
  footnotes:
  - marker: a
    text: Or 'the relative by marriage of Moses'; the Hebrew term can be broader than 'father-in-law.'
    reason: alternative_reading
  - marker: b
    text: Or 'the terebinth in Zaannannim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 헤벨 곧 겐 사람은 겐 사람들, 곧 모세의 장인 호밥의 아들들로부터 떨어져 나와 있었고, 자기 천막을 두었는데, 그것은 게데스 곁에 있는 자안님 골짜기의 상수리나무까지 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세의 혼인 친족’; 히브리어 용어는 ‘장인’보다 넓을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘자안님의 떡갈나무’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  english_pob_choice: had separated
  chosen_korean: 떨어져 나와 있었고
  alternatives_korean:
