translation:
  language: ko
  text: 이스라엘 자손은 여호와 보시기에 또다시 악을 행했습니다. 그리고 에훗이 죽은 뒤였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “이스라엘 사람들”. 히브리어: “이스라엘 자손”.'
