lexical_decisions:
- source_word: וַיֹּסִ֨פוּ ... לַעֲשׂוֹת
  english_pob_choice: again did
  chosen_korean: 또다시 악을 행했습니다
  alternatives_korean:
  - 다시 악을 저질렀습니다
  - 계속 악을 행했습니다
  - 또다시 나쁜 일을 했습니다
  lexicon: WLC; HALOT
  rationale: יסף + 부정사 구문은 반복을 뜻하므로, 서사적 반복성을 살려 ‘또다시’로 옮겼습니다. ‘행했습니다’는 뒤따르는 목적어 ‘악’을 자연스럽게 받으면서도 본문의 도덕 평가를 유지합니다.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֔ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손은
  alternatives_korean:
  - 이스라엘 사람들은
  - 이스라엘 백성은
  lexicon: WLC; HALOT
  rationale: 히브리어 직역 구조를 살리기 위해 ‘이스라엘 자손’으로 옮겼습니다. 이는 영어 POB의 ‘sons of Israel’과도 대응하며, 본문의 집합적 남성 복수 표현을 드러냅니다.
- source_word: בְּ/עֵינֵ֣י יְהוָ֑ה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 여호와 보시기에
  alternatives_korean:
  - 여호와의 눈앞에서
  - 여호와 앞에서
  - 여호와의 시야에서
  lexicon: WLC; HALOT
  rationale: ‘눈’의 은유를 한국어 관용으로 자연스럽게 풀어 ‘보시기에’로 옮겼습니다. 여기서 יְהוָה는 본문의 직접 표기 형태를 따라 여호와로 표기했습니다.
- source_word: וְ/אֵהוּד מֵת
  english_pob_choice: after Ehud died
  chosen_korean: 에훗이 죽은 뒤였습니다
  alternatives_korean:
  - 에훗이 죽었습니다
  - 에훗이 죽은 후였습니다
  - 그리고 에훗은 죽었습니다
  lexicon: WLC; HALOT
  rationale: 문맥상 뒤의 시간 배경을 제시하는 절이므로, 단순 병렬보다 ‘죽은 뒤였습니다’가 서사 관계를 더 분명히 드러냅니다. 영어 POB의 시간 표시를 한국어로 압축해 자연스럽게 재현했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 기록의 한국어 본문은 교회 내 가독성과 기존 성경 수용성을 고려해 여호와를 사용했습니다. 원문 추적성은 히브리어 יְהוָה와의 대응으로 유지됩니다.
  doctrine_reference: POB terminology note for Korean draft; source-text correspondence to יְהוָה
