language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
  footnotes:
  - marker: a
    text: Or 'And Sisera fled on foot.' The Hebrew conjunction can be rendered simply 'and'; 'but' reflects the narrative contrast in context.
    reason: alternative_reading
  - marker: b
    text: '''The house of Heber'' means Heber''s household or clan.'
    reason: cultural_note
translation:
  language: ko
  text: 그런데 시스라가 도보로 야엘의 천막으로 도망했는데, 그 여자는 켄 사람 헤벨의 아내였습니다. 이는 하솔 왕 야빈과 켄 사람 헤벨의 집 사이에 평화가 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그런데’는 앞선 문맥과의 대비를 드러내는 해석이며, 히브리어 접속사는 단순히 ‘그리고’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘헤벨의 집’은 히브리어에서 헤벨의 가정이나 가문을 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙ נָ֣ס
  english_pob_choice: But Sisera fled
  chosen_korean: 그런데 시스라가 도보로 도망했는데
  alternatives_korean:
  - 그리고 시스라가 도보로 도망했습니다
  - 하지만 시스라가 도보로 도망했습니다
  lexicon: HALOT
  rationale: 서술 전환을 자연스럽게 드러내기 위해 ו를 ‘그런데’로 옮겼고, נָס는 기본 의미인 ‘도망하다/달아나다’ 가운데 문맥상 ‘도망하다’가 가장 직접적입니다.
- source_word: בְּ/רַגְלָ֔י/ו
  english_pob_choice: on foot
  chosen_korean: 도보로
  alternatives_korean:
  - 걸어서
  - 발로
  lexicon: HALOT
  rationale: 직역하면 ‘그의 발로’이지만, 한국어 서술에서는 ‘도보로’가 같은 의미를 가장 간결하고 정확하게 전달합니다.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל אֵשֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  english_pob_choice: to the tent of Jael, the wife of Heber the Kenite
  chosen_korean: 야엘의 천막으로
  alternatives_korean:
  - 야엘의 장막으로
  - 켄 사람 헤벨의 아내 야엘의 천막으로
  lexicon: HALOT
  rationale: אֹהֶל은 기본적으로 ‘천막’이며, 뒤의 설명절은 뒤따르는 동격절에서 풀어 주어 한국어에서는 먼저 인물 소유 관계를 자연스럽게 제시했습니다.
- source_word: אֵשֶּׁת חֶבֶר הַקֵּינִי
  english_pob_choice: the wife of Heber the Kenite
  chosen_korean: 그 여자는 켄 사람 헤벨의 아내였습니다
  alternatives_korean:
  - 헤벨 켄 사람의 아내였습니다
  - 켄 사람 헤벨의 아내였습니다
  lexicon: HALOT
  rationale: 히브리어의 동격 설명을 한국어에서는 독립된 서술로 풀어, 야엘이 누구인지 밝히는 식별 기능을 살렸습니다.
- source_word: בֵּין יָבִין מֶלֶךְ חָצֹור וּבֵין בֵּית חֶבֶר הַקֵּינִי
  english_pob_choice: between Jabin king of Hazor and the house of Heber the Kenite
  chosen_korean: 하솔 왕 야빈과 켄 사람 헤벨의 집 사이에
  alternatives_korean:
  - 하솔 왕 야빈과 켄 사람 헤벨의 가문 사이에
  - 하솔 왕 야빈과 켄 사람 헤벨의 집안 사이에
  lexicon: HALOT
  rationale: בֵּית은 단순한 건물이 아니라 가문/가계를 가리킬 수 있으므로, POB의 ‘house’를 따라 ‘집’으로 두되 관계적 의미는 문맥으로 전달했습니다.
theological_decisions:
- issue: כִּי의 인과 관계 처리
  chosen_reading: ‘평화가 있었기 때문입니다’로 옮겨, 시스라가 그 천막을 피난처로 여긴 이유를 직접 설명했습니다.
  alternative_readings:
  - ‘왜냐하면 평화가 있었으므로’
  - ‘…평화가 있었기에’
  rationale: כִּי는 여기서 분명한 이유를 제시하므로, 한국어에서도 인과 접속을 분명하게 드러내는 것이 내러티브 논리를 가장 잘 보존합니다.
  doctrine_reference: 서사 논리 보존
- issue: בֵּית חֶבֶר의 공동체적 범위
  chosen_reading: ‘헤벨의 집’은 개인 주거만이 아니라 그 가족/가문을 포함하는 사회 단위를 뜻합니다.
  alternative_readings:
  - ‘헤벨의 가정’
  - ‘헤벨의 가족’
  rationale: 히브리어 ‘집’은 혈연·거주 공동체를 가리킬 수 있으므로, 본문 의미를 좁히지 않도록 ‘집’을 유지하고 의미를 설명합니다.
  doctrine_reference: 구약 사회사 배경
