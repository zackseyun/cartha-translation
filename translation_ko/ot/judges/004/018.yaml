  naturalness: ‘이쪽으로 비켜 오십시오, 나리’는 현대 독자가 이해할 수 있으면서도 공손한 초청의 어조와 반복을 유지합니다. 서술부도 ‘그녀 쪽으로 비켜 장막 안으로 들어갔습니다’로 자연스럽게 다듬었습니다.
