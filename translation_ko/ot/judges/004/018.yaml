source:
  edition: WLC
  text: וַ/תֵּצֵ֣א יָעֵל֮ לִ/קְרַ֣את סִֽיסְרָא֒ וַ/תֹּ֣אמֶר אֵלָ֗י/ו סוּרָ֧/ה אֲדֹנִ֛/י סוּרָ֥/ה אֵלַ֖/י אַל תִּירָ֑א וַ/יָּ֤סַר אֵלֶ֨י/הָ֙ הָ/אֹ֔הֱלָ/ה וַ/תְּכַסֵּ֖/הוּ בַּ/שְּׂמִיכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
  footnotes:
  - marker: a
    text: Or “Come in, my lord, come in to me.” The Hebrew verb literally means “turn aside,” preserving the image of leaving one’s path to enter shelter.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may also refer to a rug or other covering cloth.
    reason: lexical_alternative
translation:
  language: ko
  text: 야엘이 시스라를 맞으러 나가 그에게 말했습니다. 「돌아서 오십시오, 내 주인이여. 제게로 돌아오십시오. 두려워하지 마십시오.」 그가 그녀에게로, 곧 장막 안으로 돌아서 들어가자, 그녀는 그를 담요로 덮었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘돌아서다’의 뜻입니다. 이 문맥에서는 길을 벗어나 피난처로 들어가라는 유도하는 표현을 살린 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 낱말은 담요 외에 깔개나 다른 덮는 천을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת / סוּרָה
  english_pob_choice: to meet / Turn aside
  chosen_korean: 맞으러 나가 / 돌아서 오십시오
  alternatives_korean:
  - 나가 마주하여 / 비켜 오십시오
  - 나가 만나 / 이쪽으로 오십시오
  lexicon: HALOT
  rationale: לִקְרַאת의 목적적 이동은 ‘맞으러 나가’로, 반복되는 סור는 방향 전환의 이미지를 살려 ‘돌아서 오십시오’로 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주인이여
  alternatives_korean:
  - 내 주여
  - 주인이시여
  - 선생님
  lexicon: HALOT
  rationale: 사회적으로 우위에 있는 남성에게 하는 공손한 호칭을 살리되, 하나님의 호칭과 겹치지 않도록 ‘내 주인이여’로 번역했습니다.
- source_word: הָאֹהֱלָה
  english_pob_choice: into the tent
  chosen_korean: 장막 안으로
  alternatives_korean:
  - 천막 안으로
  - 텐트 안으로
  lexicon: HALOT
  rationale: 문맥상 ‘막’ 안으로 들어가는 이동을 분명히 하기 위해 ‘장막 안으로’로 옮겼습니다.
- source_word: בַּשְּׂמִיכָה
  english_pob_choice: with a blanket
  chosen_korean: 담요로
  alternatives_korean:
  - 덮개로
  - 포대로
  - 담요 같은 천으로
  lexicon: HALOT
  rationale: שׂמיכה는 덮는 천을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘담요’로 옮기되 도구격 ‘-로’를 써서 덮는 동작을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 야엘의 발화에서 공손한 호칭과 유도하는 말투의 register
  chosen_reading: 직접 화법은 공손체 명령형으로 유지해, 표면상 환대와 실제 유인 사이의 긴장을 드러냈습니다.
  alternative_readings:
  - 반말식 유도 표현
  - 더 부드러운 초대체
  rationale: 히브리어의 반복 명령과 정중한 호칭이 만들어 내는 서사적 긴장을 약화하지 않기 위해, 한국어에서도 공손한 초대/명령의 어조를 유지했습니다.
  doctrine_reference: 서사 문맥의 수사와 인물 묘사 보존
- issue: 시스라가 들어가는 동선의 묘사
  chosen_reading: ‘그녀에게로, 곧 장막 안으로 돌아서 들어가자’로 두 동작을 모두 드러냈습니다.
  alternative_readings:
  - ‘그가 그녀의 장막으로 들어가자’
  - ‘그가 그쪽으로 들어가자’
  rationale: 히브리어의 전치사적 방향성과 영어 POB의 ‘turned aside to her into the tent’가 모두 가지는 이동의 연쇄를 유지해 장면의 긴박함을 보존했습니다.
  doctrine_reference: 서사적 세부 묘사 보존
