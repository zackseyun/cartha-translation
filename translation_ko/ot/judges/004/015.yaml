  source_fidelity: 원문의 וַיָּהָם은 전투 중 혼란·공황에 빠뜨리는 행위를 뜻하므로 ‘혼란에 빠뜨리셨습니다’가 적절합니다. לְפִי חֶרֶב는 ‘칼날로’로, לִפְנֵי בָרָק은 ‘바락 앞에서’로 옮겨 양쪽 요소를 보존했습니다. 시스라가 병거에서 내려 도보로 달아난 대조도 유지했습니다.
