  lexicon: 고유명사 음역
  rationale: 인명은 현대 음역으로 옮기며, 히브리어 발음에 가까운 ‘바락’을 사용했습니다.
- source_word: אִם תֵּלְכִי עִמִּי
  english_pob_choice: If you will go with me
  chosen_korean: 당신이 나와 함께 가시면
