  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
  footnotes:
  - marker: a
    text: Or, more formally, “If you go with me, then I will go; but if you do not go with me, I will not go.”
    reason: lexical_alternative
translation:
  language: ko
  text: 바락이 드보라에게 말했습니다. 「당신이 나와 함께 가시면, 나도 가겠습니다. 그러나 당신이 나와 함께 가지 않으시면, 나도 가지 않겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 “당신이 나와 함께 가시면, 그러면 나도 가겠습니다. 그러나 당신이 나와 함께 가지 않으시면, 나도 가지 않겠습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  english_pob_choice: said to her
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그녀에게 말했습니다
  - 그에게 이르렀습니다
  lexicon: HALOT
  rationale: 문맥상 대상은 드보라이므로 원문 인칭은 여성형 목적격입니다. 한국어는 지시 대상의 성별을 드러내지 않으므로 자연스럽게 ‘그에게’로 옮기되, 직접화법 도입을 간결하게 유지했습니다.
- source_word: בָּרָק
  english_pob_choice: Barak
  chosen_korean: 바락
  alternatives_korean:
  - 바락
  lexicon: 고유명사 음역
  rationale: 인명은 현대 음역으로 옮기며, 히브리어 발음에 가까운 ‘바락’을 사용했습니다.
- source_word: אִם תֵּלְכִי עִמִּי
  english_pob_choice: If you will go with me
  chosen_korean: 당신이 나와 함께 가시면
  alternatives_korean:
  - 당신이 나와 함께 가면
  - 당신이 나와 함께 가실 경우
  lexicon: HALOT
  rationale: 조건문을 한국어의 공손한 조건형 ‘-시면’으로 살렸고, 2인칭 여성형의 지시적 성격은 한국어에서 드러나지 않으므로 정중한 2인칭으로 표현했습니다.
- source_word: וְהָלָכְתִּי
  english_pob_choice: I will go
  chosen_korean: 나도 가겠습니다
  alternatives_korean:
  - 그러면 나도 가겠습니다
  - 내가 가겠습니다
  lexicon: HALOT
  rationale: 조건에 대한 응답의 결과를 한국어로 자연스럽게 잇기 위해 ‘나도’로 상응성을 드러냈습니다. 히브리어 접속사 וְ의 기능은 문맥 흐름으로 반영했습니다.
- source_word: וְאִם לֹא... לֹא אֵלֵךְ
  english_pob_choice: but if you will not go with me, I will not go
  chosen_korean: 그러나 당신이 나와 함께 가지 않으시면, 나도 가지 않겠습니다
  alternatives_korean:
  - 하지만 당신이 나와 함께 가지 않으시면, 나도 가지 않겠습니다
  - 당신이 나와 함께 가지 않으면, 나도 가지 않겠습니다
  lexicon: HALOT
  rationale: 대조적 조건을 ‘그러나’로 옮겨 원문의 반전 구조를 드러냈습니다. 부정 조건과 거절의 반복은 ‘가지 않으시면 / 가지 않겠습니다’로 대응했습니다.
