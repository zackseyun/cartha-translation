  rationale: 문맥상 대상은 드보라이므로 원문 인칭은 여성형 목적격입니다. 한국어는 지시 대상의 성별을 드러내지 않으므로 자연스럽게 ‘그에게’로 옮기되, 직접화법 도입을 간결하게 유지했습니다.
- source_word: בָּרָק
  english_pob_choice: Barak
