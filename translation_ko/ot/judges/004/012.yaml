  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  english_pob_choice: And they told
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 말했습니다
  - 전했습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: נגד의 사역형은 ‘알리다/전하다’가 자연스럽고, 불특정 복수 주체의 행위를 한국어에서 간결하게 살릴 수 있습니다.
- source_word: לְסִיסְרָא
  english_pob_choice: Sisera
  chosen_korean: 시스라에게
  alternatives_korean:
  - 시스라에게로
  - 시스라에게 보고했습니다
  lexicon: HALOT
  rationale: 전치사 לְ는 수신자를 표시하므로, 한국어에서는 조사 ‘-에게’로 직접 자연스럽게 옮겼습니다.
- source_word: בֶּן אֲבִינֹעַם
  english_pob_choice: son of Abinoam
  chosen_korean: 아비노암의 아들
  alternatives_korean:
  - 아비노암의 아들인
  - 아비노암의 아들
  lexicon: HALOT
  rationale: 히브리어 친족 표지는 소유격 구조로 직역하는 것이 가장 투명하며, ‘아들’은 본문의 혈통 표지를 그대로 보존합니다.
- source_word: הַר תָּבוֹר
  english_pob_choice: Mount Tabor
  chosen_korean: 다볼 산
  alternatives_korean:
  - 다볼산
  - 다볼의 산
  lexicon: HALOT
  rationale: 지명 관용형으로 ‘다볼 산’이 가장 자연스럽고, 히브리어의 특정 산 지시를 유지합니다.
