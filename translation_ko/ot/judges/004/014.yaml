    text: Or “has delivered Sisera into your hand.”
    reason: lexical_alternative
  - marker: b
    text: Or “Has not the LORD gone ahead of you?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 드보라가 바락에게 말했습니다. 「일어나십시오. 이는 야훼께서 시스라를 당신의 손에 넘기신 날이기 때문입니다. 야훼께서 당신보다 앞서 나가신 것이 아닙니까?」 그러자 바락은 다볼 산에서 내려갔고, 만 명이 그를 뒤따랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시스라를 당신의 손에 넘기셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 당신보다 앞서 가신 것이 아닙니까?’
    reason: lexical_alternative
