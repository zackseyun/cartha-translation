  text: 그때 드보라가 바락에게 말했습니다. 「일어나십시오. 오늘이 바로 야훼께서 시스라를 당신의 손에 넘기신 날입니다.[a] 야훼께서 당신보다 앞서 나가신 것이 아닙니까?[b]」 그러자 바락은 다볼 산에서 내려갔고, 만 명이 그를 뒤따랐습니다.
  philosophy: optimal-equivalence
  footnotes:
