  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 한국어 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 칭호가 아닌 고유한 언약 이름임을 유지했습니다.
- source_word: יָצָא לְפָנֶיךָ
  english_pob_choice: gone out before you
  chosen_korean: 당신보다 앞서 나가신
  alternatives_korean:
  - 당신보다 앞서 나가신
  - 당신 앞에 나가신
  - 당신보다 먼저 나가신
  lexicon: HALOT
  rationale: 군사적 선행 이미지를 자연스럽게 살리면서도, ‘앞서 나가다’로 히브리어의 공간·행진 뉘앙스를 유지했습니다.
theological_decisions:
