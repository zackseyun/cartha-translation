base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
  footnotes:
  - marker: a
    text: 'Hebrew repeats ''man'' (אִישׁ) in both the condition and the question: ''if a man comes ... Is there a man here?'' English could also render this more generically as ''someone'' or ''anyone,'' but the main text preserves the masculine wording of the source.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 여자에게 말했습니다. 「장막 입구에 서 있으십시오. 어떤 남자가 와서 당신에게 ‘여기 남자가 있습니까?’ 하고 묻거든, ‘없습니다’라고 말하십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 조건절과 질문절에서 모두 ‘남자’(אִישׁ)를 반복합니다. 문맥에 따라 조건절의 표현을 ‘누군가’로 일반화할 수도 있지만, 본문은 원문의 남성 표지와 반복을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  english_pob_choice: Stand
  chosen_korean: 서 있으십시오
  alternatives_korean:
  - 서십시오
  - 그 자리에 서 있으십시오
  lexicon: HALOT
  rationale: 명령형 עמד의 직접성을 살리되, 텐트 입구에서의 위치 유지라는 맥락을 분명히 하기 위해 ‘서 있으십시오’로 옮겼습니다.
- source_word: פֶּתַח הָאֹהֶל
  english_pob_choice: the entrance of the tent
  chosen_korean: 장막 문 앞
  alternatives_korean:
  - 장막의 입구
  - 장막 입구
  lexicon: HALOT
  rationale: פֶתַח은 열려 있는 ‘입구/문’의 뜻이므로, 텐트의 공간감에 맞게 ‘장막 문 앞’으로 자연스럽게 표현했습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 남자
  alternatives_korean:
  - 사람
  - 어떤 사람
  lexicon: HALOT
  rationale: 본문의 반복되는 אִישׁ을 성별이 드러나는 ‘남자’로 유지해, 영어 POB가 지적한 반복과 성별 표지를 살렸습니다.
- source_word: אָיִן
  english_pob_choice: 'No'
  chosen_korean: 없습니다
  alternatives_korean:
  - 아닙니다
  - 없어요
  lexicon: HALOT
  rationale: 히브리어의 짧고 단호한 부정 응답을 한국어에서도 가장 간결하게 살리기 위해 ‘없습니다’로 옮겼습니다.
theological_decisions:
- issue: 직접화법 안에서의 호칭과 문체
  chosen_reading: 장면 서술은 합쇼체로 유지하고, 인용문 안에서도 지시·명령은 공손한 명령형으로 옮겼습니다.
  alternative_readings:
  - 인용문 안을 더 구어적으로 낮추는 번역
  - 전체를 개역풍의 고어체로 번역
  rationale: 본문은 위협적인 상황 속 지시를 담고 있으므로, 현대적 합쇼체를 유지하되 원문의 명령성을 약화하지 않도록 했습니다.
  doctrine_reference: 문체 일관성과 화행 보존
