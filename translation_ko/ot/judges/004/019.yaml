  to: 그는 그 여자에게 말했습니다. “부디 마실 물을 조금 주십시오. 제가 목이 마릅니다.” 그러자 그 여자는 우유가 든 가죽 부대[a]를 열어 그에게 마시게 하고, 그를 덮었습니다.
  rationale: 가죽 용기와 그 안의 우유라는 원문의 관계를 ‘우유가 든 가죽 부대’로 분명히 했습니다. 문화적 설명 각주는 해당 용어에 직접 연결했습니다. 그 외에는 원문의 공손한 요청, 갈증의 이유, 우유를 마시게 한 행위, 그리고 덮은 행위를 유지했습니다.
