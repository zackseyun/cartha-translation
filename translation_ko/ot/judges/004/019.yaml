source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
  footnotes:
  - marker: a
    text: Or “the skin-bottle of milk.” The Hebrew refers to a skin container, not a modern bottle.
    reason: cultural_note
translation:
  language: ko
  text: 그는 그 여자에게 말했습니다. “부디 마실 물을 조금 주십시오. 제가 목이 마릅니다.” 그러자 그 여자는 우유가 든 가죽 부대[a]를 열어 그에게 마시게 하고, 그를 덮었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 현대식 병이 아니라 가죽으로 만든 액체 용기를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי
  english_pob_choice: give me ... to drink
  chosen_korean: 마실 물을 조금 주십시오
  alternatives_korean:
  - 물을 조금 주십시오
  - 마실 것을 조금 주십시오
  lexicon: HALOT
  rationale: 히필 명령형의 사역적 의미를 자연스러운 한국어 요청으로 옮기되, 단순한 ‘물 주세요’보다 ‘마실 물을’이 요청의 목적을 더 분명히 드러냅니다.
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청컨대
  lexicon: HALOT
  rationale: 간청의 뉘앙스를 지닌 공손 표지를 현대 표준어로 살리기 위해 ‘부디’를 택했습니다.
- source_word: נֹאוד הֶחָלָב
  english_pob_choice: the skin of milk
  chosen_korean: 젖가죽 부대
  alternatives_korean:
  - 가죽 부대
  - 우유부대
  lexicon: HALOT
  rationale: נֹאוד는 현대 용기의 ‘병’이 아니라 가죽으로 만든 주머니형 용기이므로, 그 고대적 형상을 보존하는 ‘젖가죽 부대’가 본문에 가장 가깝습니다.
- source_word: וַתַּשְׁקֵהוּ
  english_pob_choice: gave him a drink
  chosen_korean: 그에게 마시게 하고
  alternatives_korean:
  - 그에게 마실 것을 주고
  - 그에게 마시도록 하고
  lexicon: HALOT
  rationale: 동일 어근의 사역형을 한국어에서 ‘마시게 하다’로 자연스럽게 옮겨, 앞선 요청과 이어지는 동작을 유지했습니다.
- source_word: וַתְּכַסֵּהוּ
  english_pob_choice: covered him
  chosen_korean: 그를 덮었습니다
  alternatives_korean:
  - 그를 감쌌습니다
  - 그 위를 덮었습니다
  lexicon: HALOT
  rationale: כסה의 기본 의미를 간결하게 살리되, 한국어에서 자연스러운 서술인 ‘덮다’를 사용했습니다.
theological_decisions:
- issue: 사실적 서술에서의 담화 존중
  chosen_reading: 공손한 요청과 응답을 그대로 살려, 인물 간의 긴장과 서사 흐름을 과장 없이 전달했습니다.
  alternative_readings:
  - 더 부드럽게 풀어 ‘물 좀 주십시오’로 단순화
  - 문학적으로 ‘한 모금만 주십시오’로 의역
  rationale: 이 절은 신학적 용어보다 서사적 디테일이 핵심이므로, 원문의 정황과 행위 순서를 보존하는 것이 중요합니다.
  doctrine_reference: 성경 서사의 역사성 및 본문 충실성
