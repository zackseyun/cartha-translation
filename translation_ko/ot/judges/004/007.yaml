source:
  edition: WLC
  text: וּ/מָשַׁכְתִּ֨י אֵלֶ֜י/ךָ אֶל נַ֣חַל קִישׁ֗וֹן אֶת סִֽיסְרָא֙ שַׂר צְבָ֣א יָבִ֔ין וְ/אֶת רִכְבּ֖/וֹ וְ/אֶת הֲמוֹנ֑/וֹ וּ/נְתַתִּ֖י/הוּ בְּ/יָדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
  footnotes:
  - marker: a
    text: Or “to the Kishon River” or “to the torrent of Kishon”; the Hebrew term can refer to a wadi, streambed, or torrent valley.
    reason: lexical_alternative
  - marker: b
    text: Or “his troops” or “his army”; the Hebrew word is broader, literally “his multitude.”
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 기손 강가로 시스라와 그의 병거들과 그의 무리를 끌어오고, 그를 네 손에 넘겨주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 와디, 시내바닥, 급류 골짜기까지 가리킬 수 있으므로, ‘기손 강’로만 좁히지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 המון은 문자적으로 ‘무리, 떼, 다수’의 넓은 뜻을 가지며, 여기서는 군사 집단을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  english_pob_choice: I will draw
  chosen_korean: 끌어오고
  alternatives_korean:
  - 이끌고
  - 당기고
  - 데려오고
  lexicon: HALOT
  rationale: 문맥상 시스라를 특정 장소로 오게 하는 뜻이므로, ‘끌어오다’가 ‘draw’의 유도적 힘을 살리면서도 한국어에서 자연스럽습니다.
- source_word: אֶל נַחַל קִישׁוֹן
  english_pob_choice: at the Wadi Kishon
  chosen_korean: 기손 강가로
  alternatives_korean:
  - 기손 와디로
  - 기손 시내로
  - 기손 골짜기로
  lexicon: HALOT
  rationale: נחל은 상시 하천보다 와디/계류 골짜기까지 아우르므로, 한국어에서 가장 읽기 자연스러운 ‘강가로’를 택하되 지형적 장소성을 유지했습니다.
- source_word: הֲמוֹנוֹ
  english_pob_choice: his multitude
  chosen_korean: 그의 무리
  alternatives_korean:
  - 그의 군대
  - 그의 군중
  - 그의 군사 무리
  lexicon: HALOT
  rationale: המון은 ‘무리, 다수, 떼’의 넓은 뜻이 있어, 군사 문맥을 완전히 좁히지 않는 ‘무리’가 원어의 폭을 가장 잘 보존합니다.
theological_decisions:
- issue: ‘into your hand’의 관용구 처리
  chosen_reading: ‘그를 네 손에 넘겨주겠습니다’로 옮겨, 하나님의 주권적 인도와 패배 선언의 관용적 힘을 살렸습니다.
  alternative_readings:
  - 네 권세 아래 두겠습니다
  - 네 손에 주겠습니다
  rationale: 히브리어 관용구는 단순 전달이 아니라 상대의 통제 아래 넘겨지는 의미를 포함하므로, 한국어에서도 그 함의를 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 신적 주권, 전쟁 승리의 약속
