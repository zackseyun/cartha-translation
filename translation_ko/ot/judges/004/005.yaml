base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel,' a standard covenantal expression for the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or 'for justice' or 'for a legal decision.' The Hebrew term can denote judicial decision-making or the administration of justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 늘 에브라임 산지의 라마와 벧엘 사이에 있는 데보라의 종려나무 아래에 앉아 있었으며, 이스라엘 자손[a]은 재판을 받으러[b] 그녀에게 올라왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들”. 히브리어는 ‘이스라엘의 아들들’을 뜻하는 표준적인 언약 공동체 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “정의를 위해” 또는 “법적 판결을 위해”. 이 히브리어는 사법적 판정이나 정의의 집행을 가리킬 수 있습니다.
    reason: lexical_alternative
