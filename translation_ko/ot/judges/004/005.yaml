  - 정의를 받으러
  lexicon: HALOT
  rationale: 여기서는 일반적 ‘심판’보다 사법적 판결·재판의 맥락이 분명하므로, 결과 지향의 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 남성형 공동체 표현 유지
  chosen_reading: 이스라엘 자손
  alternative_readings:
