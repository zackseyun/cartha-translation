  - 이스라엘 백성
  rationale: 원문 형식을 지우지 않으면서도 공동체 전체를 가리키는 표현으로 전달하기 위해 남성형-언약공동체 어법을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: לַמִּשְׁפָּט의 사법적 의미
  chosen_reading: 재판을 받으러
  alternative_readings:
  - 정의를 받으러
  - 판결을 받으러
  rationale: 문맥상 개인적 분쟁 해결과 판결의 장면이므로, 추상적 ‘정의’보다 사법 행위를 직접 드러내는 표현이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: Judges 4:5 narrative context
