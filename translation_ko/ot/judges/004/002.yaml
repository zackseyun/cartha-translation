revisions:
- from: 그러자 야훼께서 그들을 가나안 왕 야빈의 손에[a] 넘기셨습니다. 그는 하솔에서 다스렸고, 그의 군대 사령관은 시스라였는데, 그는 하로셋-학고임에 살고 있었습니다.[b]
  to: 그러자 야훼께서 그들을 가나안 왕 야빈의 손에[a] 팔아넘기셨습니다. 야빈은 하솔에서 다스렸으며, 그의 군대 사령관 시스라는 하로셋-학고임에 살고 있었습니다.[b]
  rationale: 원문의 מָכַר(‘팔다’)와 בְּיַד(‘손에’)를 ‘손에 팔아넘기셨습니다’로 보존하되, 한국어에서 이해 가능한 심판 관용구로 제시했습니다. 후반부는 야빈과 시스라를 명시하여 원문의 선행사를 정확히 드러냈습니다. 지명과 신명 음역 및 합쇼체 문체는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:56Z'
