    rationale: 이는 בְּיַד의 관용적 기능은 반영하지만 וַיִּמְכְּרֵם의 ‘팔다’를 누락하므로, 직역 설명으로는 부정확합니다.
  - severity: low
    issue: 후반부의 ‘그는’이 연속되어 지시 대상이 잠시 불분명할 수 있습니다.
