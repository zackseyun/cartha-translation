    issue: וַיִּמְכְּרֵם의 ‘팔다’ 비유가 본문과 각주에서 ‘넘기다’로 평준화되었습니다.
    rationale: 영어 POB의 ‘sold them’ 및 히브리어 어근 מָכַר의 직접적 의미를 보존해야 합니다. ‘팔아넘기다’는 한국어에서도 이 비유와 심판의 강도를 자연스럽게 전달합니다.
  - severity: low
