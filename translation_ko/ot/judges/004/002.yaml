id: JDG.4.2
reference: Judges 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sold them into the hand of,'' a covenant-judgment idiom meaning he gave them over to Jabin''s power.'
    reason: lexical_alternative
  - marker: b
    text: Harosheth-haggoyim likely means 'Harosheth of the Nations.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 야훼께서 그들을 가나안 왕 야빈의 손에[a] 넘기셨습니다. 그는 하솔에서 다스렸고, 그의 군대 사령관은 시스라였는데, 그는 하로셋-학고임에 살고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘손에 넘기다’이며, 언약적 심판의 관용구로서 ‘그의 권세 아래에 두다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하로셋-학고임’은 ‘열국의 하로셋’으로도 이해될 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם / sold them
  english_pob_choice: sold them
  chosen_korean: 넘기셨습니다
  alternatives_korean:
  - 팔아 넘기셨습니다
  - 그들을 넘기셨습니다
  - 내주셨습니다
  lexicon: HALOT
  rationale: 직역하면 ‘팔다’이지만, 한국어에서는 ‘손에 넘기다’가 결과적 종속 상태를 자연스럽게 드러내면서도 언약적 심판의 강도를 보존합니다.
- source_word: בְּיַד / into the hand of
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 권세 아래
  - 권능 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘손에’로 옮기되, 문맥상 종속·지배를 한국어에서 이해할 수 있도록 동사 ‘넘기셨습니다’와 결합했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 신명사 יְהוָה는 신학적 대체어가 아닌 음역 ‘야훼’로 옮겼습니다.
- source_word: שַׂר צְבָאוֹ
  english_pob_choice: the commander of his army
  chosen_korean: 군대 사령관
  alternatives_korean:
  - 군대 지휘관
  - 군대 대장
  lexicon: HALOT
  rationale: שַׂר는 단순한 장교가 아니라 지휘 책임자를 뜻하므로, 현대 한국어에서 가장 분명한 ‘사령관’을 택했습니다.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  english_pob_choice: in Harosheth-haggoyim
  chosen_korean: 하로셋-학고임
  alternatives_korean:
  - 하로셋-하고임
  - 하로셋-열국
  lexicon: HALOT
  rationale: 이 표현은 지명으로 보존하는 것이 최선이므로, 표준 음역을 유지하고 본문에서 의미풀이를 덧붙이지 않았습니다.
theological_decisions:
- issue: 여호와/야훼의 직접 행위와 언약 심판
  chosen_reading: 본문의 주어는 우회적 허용이 아니라 야훼의 직접적 행위로 제시되므로, ‘넘기셨습니다’로 언약 심판의 능동성을 살렸습니다.
  alternative_readings:
  - 허락하셨습니다
  - 내버려 두셨습니다
  rationale: 히브리어 동사와 POB 영어 본문이 모두 직접적 처분 행위를 유지하므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy §1, §3; Contested terms: יְהוָה → Yahweh'
