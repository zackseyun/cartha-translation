  source_fidelity: 히브리어 וַיִּמְכְּרֵם은 문자적으로 ‘그들을 팔았다’이며, 사사기에서 야훼께서 이스라엘을 적의 지배에 넘기시는 심판의 비유입니다. 초안의 ‘넘기셨습니다’는 결과는 전달하지만 ‘팔다’라는 핵심 비유를 본문에서 생략합니다. 또한 각 인물의 지시 대상을 이름으로 밝혀 문장 연결을 분명히 하는 것이 안전합니다.
  naturalness: ‘그들을 가나안 왕 야빈의 손에 팔아넘기셨습니다’는 현대 표준어에서 자연스럽고, 원문의 심판 비유와 ‘손에’라는 관용적 이미지를 함께 보존합니다. 뒤 절은 대명사를 반복하기보다 ‘야빈’과 ‘시스라’를 명시하면 자연스럽고 모호하지 않습니다.
  terminology: ‘야훼’, ‘가나안’, ‘야빈’, ‘하솔’, ‘시스라’, ‘하로셋-학고임’은 일관되고 적절합니다. ‘군대 사령관’은 שַׂר צְבָאוֹ를 현대적으로 잘 옮깁니다. 각주 a는 원문의 실제 직역을 ‘손에 넘기다’가 아니라 ‘그들을 …의 손에 팔다’로 바로잡아야 합니다.
  issues:
