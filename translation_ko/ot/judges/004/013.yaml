  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
  footnotes:
  - marker: a
    text: Or 'the Kishon River' or 'the torrent Kishon'; Hebrew naḥal can denote a wadi, streambed, or seasonal torrent valley.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시스라는 자기의 모든 전차, 곧 철제 전차 아홉백 대와 자기와 함께 있던 모든 사람을 소집하여 하로셋-학고임에서 기손 강바닥으로 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기손 강’ 또는 ‘기손 시내’. 히브리어 나할은 와디, 시내바닥, 계절성 급류 계곡을 가리킬 수 있습니다.
    reason: alternative_reading
