  rationale: 군사적 문맥에서 사람과 전차를 한데 불러 집결시키는 뜻이므로, 단순한 '부르다'보다 한국어 군사·행정 문체에 맞는 '소집하다'가 원문의 강한 집결 의미를 잘 살립니다.
