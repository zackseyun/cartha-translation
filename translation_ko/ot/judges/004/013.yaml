  rationale: 원문은 단순 호출이 아니라 군사 집결을 나타내므로, 서사의 긴박감과 주도적 행동을 유지하는 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존과 서사적 화행 유지
- issue: נחל의 지리적 의미
  chosen_reading: 기손을 '강바닥'으로 옮겨 와디/하상 지형을 드러냈습니다.
  alternative_readings:
  - '''기손 강''으로 단순화하는 읽기'
  - '''기손 와디''로 음역을 보존하는 읽기'
  rationale: 본문의 지리 용어는 상시 강이 아니라 계절성 물길을 가리킬 수 있으므로, 한국어 독자가 지형적 차이를 느끼도록 했습니다.
