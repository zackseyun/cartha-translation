base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
  footnotes:
  - marker: a
    text: Or 'the Kishon River' or 'the torrent Kishon'; Hebrew naḥal can denote a wadi, streambed, or seasonal torrent valley.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시스라는 자기의 모든 전차, 곧 철제 전차 구백 대와 자기와 함께 있던 모든 사람을 하로셋학고임에서 기손 와디로 소집했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기손 강’, ‘기손 시내’ 또는 ‘기손 시내바닥’. 히브리어 나할은 와디, 시내바닥 또는 계절성 급류가 흐르는 계곡을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
