theological_decisions:
- issue: 군사 동원 동사의 힘과 문맥
  chosen_reading: 시스라가 전차와 사람을 '소집하여' 전투 태세를 갖추는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 '불러모아'로 완화하는 읽기
