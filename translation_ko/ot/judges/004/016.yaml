    rationale: 히브리어는 병거와 군대 모두를 추격의 대상으로 제시합니다. 한국어에서는 두 목적어를 병렬로 처리하는 편이 명료합니다.
  - severity: low
    issue: 각주 b의 ‘더 직역하면 칼의 날’
    rationale: לְפִי חֶרֶב은 문자적으로 ‘칼의 입으로’이며, ‘칼날에’는 관용적 의미를 살린 번역입니다. 각주는 이를 정확히 설명해야 합니다.
