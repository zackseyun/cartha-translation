base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
  footnotes:
  - marker: a
    text: Or “the chariot force,” taking “chariots” as a collective military term.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “Harosheth of the nations”; traditionally “Harosheth-haggoyim.”
    reason: lexical_alternative
translation:
  language: ko
  text: 바락이 병거들을 따라 군대를 추격하여 하롯셋-하고임까지 이르렀고, 시스라의 군대는 모두 칼날에 쓰러졌습니다. 남은 자는 한 사람도 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 지명은 문자적으로는 “민족들의 하롯셋”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구를 더 직역하면 “칼의 날에”입니다.
    reason: lexical_alternative
