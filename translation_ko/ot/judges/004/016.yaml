revisions:
- from: 바락이 병거들을 따라 군대를 추격하여 하롯셋-하고임까지 이르렀고, 시스라의 군대는 모두 칼날에 쓰러졌습니다. 남은 자는 한 사람도 없었습니다.[a][b]
  to: 바락은 병거 부대와 군대를 추격하여 하로셋-하고임까지 이르렀고,[a] 시스라의 군대는 모두 칼날에 쓰러졌습니다.[b] 한 사람도 남지 않았습니다.
  rationale: 병거와 군대를 모두 추격했다는 원문의 병렬 구조를 명료하게 반영하고, 지명 음역을 바로잡았습니다. ‘칼날에 쓰러졌습니다’는 전사(戰死)를 나타내는 히브리어 관용구를 자연스럽게 보존합니다. 각주 표지는 해당 어구에 직접 연결하고, 직역 설명을 히브리어 표현에 맞게 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:07:32Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 추격, 전멸, 그리고 강조된 ‘한 사람도 남지 않음’을 대체로 잘 전달합니다. 다만 הָרֶכֶב는 집합적 군사 용례일 수 있으므로 ‘병거 부대’가 문맥상 더 분명하며, 지명 חֲרֹשֶׁת는 ‘하로셋’으로 음역하는 것이 히브리어 모음과 한국어 성경의 통용 표기에 더 부합합니다.
  naturalness: ‘병거들을 따라 군대를 추격하여’는 병거를 따라 군대를 추격한다는 수식 관계로도 읽힐 수 있습니다. ‘병거 부대와 군대를 추격하여’로 병렬 목적어를 명시하면 자연스럽고 원문의 구조도 잘 드러납니다.
  terminology: ‘바락’, ‘시스라’, ‘병거’, ‘군대’, ‘칼날’은 적절합니다. 지명은 ‘하로셋-하고임’으로 바로잡는 것이 좋습니다. 또한 לְפִי חֶרֶב의 직역은 ‘칼의 날’이라기보다 ‘칼의 입’이므로 기존 각주 설명은 수정되어야 합니다.
