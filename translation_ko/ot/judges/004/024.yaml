base_translation:
  language: en
  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
  footnotes:
  - marker: a
    text: Or “the Israelites.” The Hebrew reads “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “became stronger against” or “grew more severe against.” The Hebrew expression combines “went” with an intensifying form meaning increasing pressure.
    reason: lexical_alternative
  - marker: c
    text: “Cut off” here means they destroyed or removed him decisively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손의 손이 가나안 왕 야빈에 대하여 점점 더 강해져서, 마침내 그들이 가나안 왕 야빈을 멸하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “이스라엘 자손”이라고 읽습니다.
    reason: source_note
lexical_decisions:
- source_word: וַתֵּלֶךְ ... הָלוֹךְ וְקָשָׁה
  english_pob_choice: went on, growing stronger
  chosen_korean: 점점 더 강해져서
  alternatives_korean:
  - 계속 더 강해져서
  - 점점 더 심해져서
  - 더욱 거세져서
  lexicon: HALOT
  rationale: 히브리어의 진행·강조 결합 표현을 한국어에서는 자연스럽게 ‘점점 더’로 살려, 지속적으로 증대되는 압박과 힘을 함께 드러냈습니다.
- source_word: יַד
  english_pob_choice: the hand
  chosen_korean: 손
  alternatives_korean:
  - 권능
  - 힘
  - 세력
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 ‘손’으로 옮겼고, 이어지는 동사구와 함께 이스라엘의 작용하는 힘을 표현했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 남성 복수형의 원문을 반영하면서도 한국어 성경 표현으로도 널리 이해되는 직역형을 유지했습니다.
- source_word: הִכְרִיתוּ
  english_pob_choice: cut off
  chosen_korean: 멸하였습니다
  alternatives_korean:
  - 끊어 버렸습니다
  - 끊어 내었습니다
  - 제거하였습니다
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘잘라 냄’이 아니라 야빈의 종국적 제거를 뜻하므로, 본문의 결정적 종결을 드러내는 ‘멸하다’로 옮겼습니다.
theological_decisions:
- issue: 결말 동사의 강도
  chosen_reading: ‘cut off’를 문맥상 결정적 패배와 제거로 이해하여 ‘멸하였습니다’로 번역했습니다.
  alternative_readings:
  - ‘끊어 버렸습니다’처럼 더 직역할 수 있습니다.
  - ‘제거하였습니다’로 더 중립적으로 옮길 수도 있습니다.
  rationale: 히브리어 כרת는 이 맥락에서 단순 절단보다 정치적·군사적 제거를 가리키므로, 한국어에서 그 종결성을 분명히 해야 합니다.
  doctrine_reference: 본문 서술의 역사적-군사적 의미
