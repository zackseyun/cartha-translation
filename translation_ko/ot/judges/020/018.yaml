  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
  footnotes:
  - marker: a
    text: Hebrew 'the LORD'; alternatively 'Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Or 'The Israelites.' Hebrew 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'with the sons of Benjamin,' that is, in battle against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 일어나 벧엘로 올라가 하나님께 물었습니다. 이스라엘 자손이 말했습니다. “누가 우리를 위하여 먼저 베냐민 자손과 싸우러 올라가겠습니까?” 야훼께서 말씀하셨습니다. “유다가 먼저입니다.”
  philosophy: optimal-equivalence
