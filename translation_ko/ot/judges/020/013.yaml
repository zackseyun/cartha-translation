    text: Or 'worthless men'; traditionally 'sons of Belial.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'listen to the voice of,' an idiom that can also mean 'obey' or 'heed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기브아에 있는 그 악한 자들[a]을 우리에게 넘겨주십시오. 그러면 우리가 그들을 죽이고 이스라엘에서 악을 없애겠습니다. 그러나 베냐민은 자기 형제들, 곧 이스라엘 자손[c]의 목소리[b]에 귀를 기울이려 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘무가치함의 아들들’입니다. 또는 ‘무가치한 자들’; 전통적으로는 ‘벨리알의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘목소리에 귀를 기울이다’는 관용구로, ‘순종하다’ 또는 ‘귀 기울이다’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘 사람들’입니다.
    reason: lexical_alternative
