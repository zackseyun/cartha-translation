  rationale: 본문은 특정 악마적 존재를 소개하기보다, 기브아의 범죄자들을 도덕적으로 규정합니다. 그래서 고유명사화하지 않고 부정적 성격표현으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3
