revisions:
- from: 이제 그 사람들을—그 불량한 자식들을—기브아에 있는 자들을 넘겨주십시오. 그러면 우리가 그들을 죽이고 이스라엘에서 악을 제거하겠습니다. 그러나 베냐민은 형제들인 이스라엘 자손의 목소리에 귀 기울이려 하지 않았습니다.[a][b][c]
  to: 기브아에 있는 그 악한 자들[a]을 우리에게 넘겨주십시오. 그러면 우리가 그들을 죽이고 이스라엘에서 악을 없애겠습니다. 그러나 베냐민은 자기 형제들, 곧 이스라엘 자손[c]의 목소리[b]에 귀를 기울이려 하지 않았습니다.
  rationale: 원문의 명시적 의미와 법정적 요구의 어조를 보존하면서, 한국어에서 ‘자식들’이 낳는 오해와 문장 구조의 중복을 바로잡았습니다. ‘죽이고’는 וּנְמִיתֵם의 직접적 사법 처형 의도를, ‘악을 없애겠습니다’는 공동체에서 악을 제거한다는 관용적 법률 표현을 전달합니다. 각주 표지는 해당 어구에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:42Z'
