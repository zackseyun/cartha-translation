  lexicon: HALOT
  rationale: 히브리어 관용구의 도덕적 폄하를 살리면서도 한국어에서 어색하지 않게 표현했습니다. ‘벨리알’은 본문 맥락상 고유명사로 오해될 수 있어 피했습니다.
- source_word: לִשְׁמֹעַ בְּקוֹל
  english_pob_choice: to listen to the voice of
  chosen_korean: 목소리에 귀 기울이려 하지 않았습니다
