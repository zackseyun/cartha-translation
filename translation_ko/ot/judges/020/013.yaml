base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Now hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'worthless men'; traditionally 'sons of Belial.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'listen to the voice of,' an idiom that can also mean 'obey' or 'heed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그 사람들을—그 불량한 자식들을—기브아에 있는 자들을 넘겨주십시오. 그러면 우리가 그들을 죽이고 이스라엘에서 악을 제거하겠습니다. 그러나 베냐민은 형제들인 이스라엘 자손의 목소리에 귀 기울이려 하지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무가치한 자들’. 전통적으로는 ‘벨리알의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘목소리에 듣다’는 관용구로, ‘순종하다’ 또는 ‘귀 기울이다’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘 사람들’.
    reason: lexical_alternative
