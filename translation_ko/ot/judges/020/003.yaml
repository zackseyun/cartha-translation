source:
  edition: WLC
  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: Now the sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
  footnotes:
  - marker: a
    text: Or “the Benjaminites” and “the Israelites.” The Hebrew repeatedly says “the sons of Benjamin” and “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: “This evil” could also be rendered “this wickedness” or “this wrong.” The Hebrew term carries strong moral force.
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민 자손[a]은 이스라엘 자손이 미스바로 올라갔다는 말을 들었습니다. 이스라엘 자손이 말했습니다. 「말하십시오. 이 악[b]이 어떻게 일어났습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘베냐민 자손’과 ‘이스라엘 자손’이라는 표현을 반복해서 사용합니다. ‘베냐민 사람들’과 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 악’은 ‘이 악행’ 또는 ‘이 잘못’으로도 옮길 수 있습니다. 히브리어는 강한 도덕적 비난의 의미를 지닙니다.
    reason: lexical_alternative
