  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י בִנְיָמִ֔ן כִּֽי עָל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑ה וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל דַּבְּר֕וּ אֵיכָ֥ה נִהְיְתָ֖ה הָ/רָעָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: Now the sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
  footnotes:
  - marker: a
    text: Or “the Benjaminites” and “the Israelites.” The Hebrew repeatedly says “the sons of Benjamin” and “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: “This evil” could also be rendered “this wickedness” or “this wrong.” The Hebrew term carries strong moral force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 베냐민 자손은 이스라엘 자손이 미스바로 올라갔다는 말을 들었습니다. 이스라엘 자손이 말했습니다. 「말해 보시오, 이 악이 어떻게 일어났습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서도 반복적으로 ‘베냐민의 자손’과 ‘이스라엘의 자손’이라고 말합니다.
    reason: source_note
  - marker: b
    text: ‘이 악’은 문맥상 단순한 사건보다 강한 도덕적 악의 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민 사람들
  - 베냐민 지파 사람들
  lexicon: WLC/HALOT
  rationale: 히브리어의 반복되는 직역 구조를 살리면서도 한국어에서는 자연스러운 ‘자손’을 써서 ‘이스라엘 자손’과의 평행을 유지했습니다.
- source_word: וַיִּשְׁמְעוּ
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 알게 되었습니다
  - 전해 들었습니다
  lexicon: WLC/HALOT
  rationale: 이 서술문맥에서 단순히 소식을 들었다는 의미가 가장 자연스럽고, 서사의 흐름도 그대로 유지합니다.
- source_word: הַמִּצְפָּה
  english_pob_choice: to Mizpah
  chosen_korean: 미스바로
  alternatives_korean:
  - 미스바로
  - 미스바에
  lexicon: WLC/HALOT
  rationale: 지명은 음역을 따르고, 이동 방향은 ‘-로 올라갔다는’으로 옮겨 עלה의 상향 이동 뉘앙스를 반영했습니다.
- source_word: דַּבְּרוּ
  english_pob_choice: Tell us
  chosen_korean: 말해 보시오
  alternatives_korean:
  - 말해 보세요
  - 말하시오
  lexicon: WLC/HALOT
  rationale: 명령형의 요청성을 살리되, 집단이 상대에게 따져 묻는 상황에 맞게 한국어의 정중하지만 압박감 있는 표현을 택했습니다.
- source_word: הָרָעָה הַזֹּאת
  english_pob_choice: this evil
  chosen_korean: 이 악
  alternatives_korean:
  - 이 악한 일
  - 이 죄악
  - 이 잘못
  lexicon: WLC/HALOT
  rationale: רָעָה의 강한 도덕적 악의 뉘앙스를 살려 ‘악’으로 옮겼고, ‘일’로 완화하지 않아 사태의 심각성을 보존했습니다.
theological_decisions:
- issue: מִצְפָּה를 고유지명으로 처리할지 일반명사처럼 처리할지
  chosen_reading: 미스바를 지명으로 음역해 서술의 이동 방향을 분명히 했습니다.
  alternative_readings:
  - 감시대
  - 망대
  rationale: 본문의 הַמִּצְפָּה는 이곳에서 고유지명으로 읽는 것이 자연스럽고, 사건의 장소 이동을 정확히 전달합니다.
  doctrine_reference: 지명 처리/역사서 본문 이해
- issue: ‘이 악’의 윤리적 강도를 유지할지 완화할지
  chosen_reading: 도덕적 비난의 강도를 살려 ‘이 악’으로 직역했습니다.
  alternative_readings:
  - 이 잘못
  - 이 죄악
  - 이 참변
  rationale: 본문은 단순한 사고가 아니라 집단적 성적·도덕적 폭력 사건을 가리키므로, 윤리적 평가를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 구약 서사에서의 도덕적 평가
- issue: 이스라엘 자손의 발화가 요청인지 진술인지
  chosen_reading: ‘말했습니다’로 기본 동사를 유지하고, 인용 안에서 요청형을 드러냈습니다.
  alternative_readings:
  - 물었습니다
  - 요청했습니다
  rationale: 히브리어 וַיֹּאמְרוּ는 기본적으로 ‘말하다’이므로, 요청의 성격은 뒤의 명령형 ‘말해 보시오’로 충분히 전달됩니다.
  doctrine_reference: 서사 동사와 발화 행위
