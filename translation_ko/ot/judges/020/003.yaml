  rationale: רָעָה의 강한 도덕적 악의 뉘앙스를 살려 ‘악’으로 옮겼고, ‘일’로 완화하지 않아 사태의 심각성을 보존했습니다.
theological_decisions:
- issue: מִצְפָּה를 고유지명으로 처리할지 일반명사처럼 처리할지
  chosen_reading: 미스바를 지명으로 음역해 서술의 이동 방향을 분명히 했습니다.
  alternative_readings:
  - 감시대
  - 망대
  rationale: 본문의 הַמִּצְפָּה는 이곳에서 고유지명으로 읽는 것이 자연스럽고, 사건의 장소 이동을 정확히 전달합니다.
  doctrine_reference: 지명 처리/역사서 본문 이해
- issue: ‘이 악’의 윤리적 강도를 유지할지 완화할지
  chosen_reading: 도덕적 비난의 강도를 살려 ‘이 악’으로 직역했습니다.
  alternative_readings:
  - 이 잘못
  - 이 죄악
  - 이 참변
  rationale: 본문은 단순한 사고가 아니라 집단적 성적·도덕적 폭력 사건을 가리키므로, 윤리적 평가를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 구약 서사에서의 도덕적 평가
- issue: 이스라엘 자손의 발화가 요청인지 진술인지
  chosen_reading: ‘말했습니다’로 기본 동사를 유지하고, 인용 안에서 요청형을 드러냈습니다.
  alternative_readings:
  - 물었습니다
  - 요청했습니다
  rationale: 히브리어 וַיֹּאמְרוּ는 기본적으로 ‘말하다’이므로, 요청의 성격은 뒤의 명령형 ‘말해 보시오’로 충분히 전달됩니다.
  doctrine_reference: 서사 동사와 발화 행위
