id: JDG.20.17
reference: Judges 20:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל הִתְפָּֽקְד֗וּ לְ/בַד֙ מִ/בִּנְיָמִ֔ן אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב כָּל זֶ֖ה אִ֥ישׁ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
  footnotes:
  - marker: a
    text: Or 'excluding Benjamin.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were numbered'; the Hebrew verb can denote being counted or mustered for military service.
    reason: lexical_alternative
  - marker: c
    text: Literally 'drawing the sword,' a Hebrew idiom for armed fighting men.
    reason: cultural_note
translation:
  language: ko
  text: 베냐민을 제외한 이스라엘 사람들은 칼을 빼 든 사십만 명으로 소집되었습니다. 이들은 모두 전사들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘의 남자들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 남자
  lexicon: HALOT
  rationale: 히브리어 אִישׁ은 여기서 집합적으로 쓰여 군사 동원 대상 남성을 가리키므로, 단순한 민족명보다 ‘남자들’이 군사적 뉘앙스를 더 잘 살립니다.
- source_word: הִתְפָּקְדוּ
  english_pob_choice: were mustered / were numbered
  chosen_korean: 모두 마흔만 명
  alternatives_korean:
  - 소집되었습니다
  - 계수되었습니다
  - 점호되었습니다
  lexicon: HALOT
  rationale: 이 동사는 군사 문맥에서 인원 집계와 동원 둘 다를 포함할 수 있어, 본문 흐름상 결과 수치를 자연스럽게 제시하는 방식으로 옮겼습니다.
- source_word: לְבַד מִבִּנְיָמִן
  english_pob_choice: apart from Benjamin
  chosen_korean: 베냐민을 제외하고
  alternatives_korean:
  - 베냐민을 빼고
  - 베냐민 외에
  lexicon: HALOT
  rationale: 총계에서 베냐민이 제외된다는 의미를 한국어로 분명하게 전달하기 위해 ‘제외하고’로 옮겼습니다.
- source_word: שֹׁלֵף חָרֶב
  english_pob_choice: drawing the sword
  chosen_korean: 칼을 빼 든 사람들이
  alternatives_korean:
  - 칼을 든 사람들
  - 칼을 뽑는 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘칼을 빼는/뽑는’이지만, 한국어에서는 전투 준비 상태를 나타내는 관용으로 ‘칼을 빼 든’이 가장 자연스럽습니다.
- source_word: אִישׁ מִלְחָמָה
  english_pob_choice: men of war
  chosen_korean: 전쟁에 나서는 사람들이
  alternatives_korean:
  - 전쟁의 사람들
  - 전사들
  lexicon: HALOT
  rationale: ‘전쟁의 사람들’보다 ‘전쟁에 나서는 사람들’이 히브리어의 군사적 정체성을 살리면서도 현대 한국어에서 덜 어색합니다.
