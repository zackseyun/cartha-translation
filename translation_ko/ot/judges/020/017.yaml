revisions:
- from: 이스라엘의 남자들은 — 베냐민을 제외하고 — 모두 마흔만 명의 칼을 빼 든 사람들이었습니다. 이들 모두는 전쟁에 나서는 사람들이었습니다.
  to: 베냐민을 제외한 이스라엘 사람들은 칼을 빼 든 사십만 명으로 소집되었습니다. 이들은 모두 전사들이었습니다.
  rationale: 군사 문맥의 הִתְפָּקְדוּ를 ‘소집되었습니다’로 명시하여 원문의 동작을 복원했습니다. ‘칼을 빼 든’은 שֹׁלֵף חָרֶב의 생생한 무장 표현을 유지하고, ‘전사들’은 אִישׁ מִלְחָמָה를 현대 표준어로 자연스럽게 옮깁니다. 본문 자체로 의미가 충분히 전달되므로 각주는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:07Z'
