translation:
  language: ko
  text: 그때 매복한 자들이 서둘러 기브아를 향해 돌진하였고, 매복 부대는 전진하여[a] 칼날로 온 성읍을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘매복 부대가 끌었다/당겼다’입니다. 이 동사는 매복 부대가 앞으로 뻗어 나아가거나 성읍 안으로 밀고 들어갔다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  english_pob_choice: the men in ambush
  chosen_korean: 매복한 자들 / 매복 부대
  alternatives_korean:
  - 매복
  - 매복자들
  - 숨어 있던 자들
  lexicon: HALOT
  rationale: 영어 POB가 집합적 의미를 분명히 하려고 개인 집단으로 풀어 옮겼으므로, 한국어도 첫 절에서는 ‘매복한 자들’로, 뒤에서는 군사 집단성을 살려 ‘매복 부대’로 자연스럽게 드러냈습니다.
- source_word: הֵחִישׁוּ
  english_pob_choice: quickly rushed
  chosen_korean: 서둘러 돌진하였고
  alternatives_korean:
  - 급히 달려들었고
  - 빨리 몰려갔고
  - 서둘러 진격하였고
  lexicon: HALOT
  rationale: 단순한 ‘급히’보다 군사적 급습의 속도와 방향성을 함께 살리기 위해 ‘서둘러 돌진하다’를 선택했습니다.
- source_word: וַיִּמְשֹׁךְ
  english_pob_choice: advanced
  chosen_korean: 전진하여
  alternatives_korean:
  - 나아가
  - 뻗어 나가
  - 끌려 들어가
  lexicon: HALOT
  rationale: 직역하면 ‘끌다/당기다’이지만 문맥상 매복 부대가 도시 안으로 밀고 들어가는 진행을 뜻하므로, 영어 POB의 해석을 따라 군사적 진행을 분명히 하는 ‘전진하다’로 옮겼습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼끝으로
  - 칼날에 의해
  lexicon: HALOT
  rationale: 히브리어의 관용구 ‘칼의 입’은 한국어 성경에서 흔히 ‘칼날’로 대응되므로, 의미와 이미지가 살아 있는 간결한 표현을 택했습니다.
theological_decisions:
- issue: ‘all the city’의 범위
  chosen_reading: ‘성읍 전체’로 옮겨, 성읍 자체와 그 안의 사람들을 포괄하는 전면적 파괴의 뉘앙스를 유지했습니다.
  alternative_readings:
  - 성읍의 모든 사람
  - 온 성읍
  - 그 도시 전체
  rationale: 히브리어 표현은 문자적으로 ‘모든 성읍’이지만, 문맥상 주민을 포함한 총체적 타격을 가리키므로 과도한 해석 없이 한국어 관용에 맞는 포괄 표현을 사용했습니다.
  doctrine_reference: 내러티브 문맥 보존
