base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
  footnotes:
  - marker: a
    text: Or 'were left-handed.' The Hebrew more literally says they were restricted or impeded in the right hand, which likely implies left-handed fighting.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 백성 가운데에서 선정된 사람 칠백 명은 오른손을 쓰지 못하는 사람들이었습니다. 그들 모두는 돌을 던져 머리카락 하나의 표적도 맞히지 않고 빗나가지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오른손이 제약된’이라는 뜻으로, 문맥상 왼손을 주로 쓰는 전투 능력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  english_pob_choice: From all this people
  chosen_korean: 이 모든 백성 가운데에서
  alternatives_korean:
  - 이 모든 사람들 가운데에서
  - 이 백성 전체 가운데에서
  lexicon: HALOT
  rationale: partitive 관계를 살리기 위해 ‘~가운데에서’로 옮겼고, עָם의 기본값인 ‘백성’을 유지해 원문 범위를 과도하게 좁히지 않았습니다.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  english_pob_choice: seven hundred chosen men
  chosen_korean: 선정된 사람 칠백 명
  alternatives_korean:
  - 선택된 사람 칠백 명
  - 뽑힌 칠백 명
  lexicon: HALOT
  rationale: בָּחוּר의 ‘선발된/뽑힌’ 의미를 자연스러운 현대어 ‘선정된’으로 옮겨, 군사적 맥락의 선택성을 유지했습니다.
- source_word: אִטֵּר יַד יְמִינוֹ
  english_pob_choice: were left-handed
  chosen_korean: 오른손을 쓰지 못하는 사람들이었습니다
  alternatives_korean:
  - 왼손잡이였습니다
  - 오른손이 불편한 사람들이었습니다
  - 오른손이 묶인 사람들이었습니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 신체 특징이라기보다 ‘오른손이 제약된/불편한’ 상태를 말하므로, 전투 맥락을 살려 직역에 가까운 표현으로 처리했습니다.
- source_word: קֹלֵעַ בָּאֶבֶן אֶל הַשַּׂעֲרָה
  english_pob_choice: could sling a stone at a hair
  chosen_korean: 돌을 던져 머리카락 하나의 표적도
  alternatives_korean:
  - 돌을 던져 머리카락 한 올을
  - 돌을 던져 머리카락만 한 표적을
  lexicon: HALOT
  rationale: ‘머리카락’의 극도로 작은 표적 이미지를 살리되, 한국어에서 자연스럽게 읽히도록 ‘머리카락 하나의 표적’으로 풀었습니다.
- source_word: וְלֹא יַחֲטִא
  english_pob_choice: and not miss
  chosen_korean: 빗나가지 않았습니다
  alternatives_korean:
  - 놓치지 않았습니다
  - 빗나가지 않을 수 있었습니다
  lexicon: HALOT
  rationale: חטא의 ‘과녁을 빗나가다’라는 구체적 의미를 반영해, 도덕적 ‘죄하다’가 아니라 명중/빗남의 뜻으로 옮겼습니다.
theological_decisions:
- issue: אִטֵּר יַד יְמִינוֹ의 한국어 처리
  chosen_reading: 신체적 특징을 단정적으로 ‘왼손잡이’라기보다, 오른손의 제약을 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - 왼손잡이였습니다
  - 오른손이 묶인 사람들이었습니다
  rationale: 문맥상 전투 능력을 가리키지만, 히브리어 표현 자체는 오른손의 기능 제한을 먼저 말하므로 그 긴장을 보존했습니다.
  doctrine_reference: source transparency / lexical tension preservation
