source:
  edition: WLC
  text: וְ/הַ/מּוֹעֵ֗ד הָיָ֛ה לְ/אִ֥ישׁ יִשְׂרָאֵ֖ל עִם הָ/אֹרֵ֑ב הֶ֕רֶב לְ/הַעֲלוֹתָ֛/ם מַשְׂאַ֥ת הֶ/עָשָׁ֖ן מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: Now the appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
  footnotes:
  - marker: a
    text: Or 'the appointed arrangement' or 'the agreed sign.' The Hebrew מוֹעֵד often means an appointed time, but here it refers to a prearranged signal in battle.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to/for the men of Israel with the ambush'; the sense is an arrangement between the two parties.
    reason: lexical_alternative
  - marker: c
    text: Or 'a mass/column of smoke.' The Hebrew expression refers to a conspicuous rising smoke signal from the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 사람들과 매복한 자들 사이에 정해진 신호는, 그들이 그 도시에서 큰 연기 기둥을 피워 올리는 것이었습니다[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '정해진 때', '약정'. 히브리어 מוֹעֵד는 흔히 '정한 때'를 뜻하지만, 여기서는 전투를 위해 미리 정한 신호나 약정을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '이스라엘 사람들을 위하여/에게, 매복한 자들과 함께'에 가깝습니다. 문맥상 두 집단 사이에 미리 정한 약정이나 신호를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '큰 연기 구름', '연기의 큰 덩어리'. 히브리어 표현은 그 도시에서 눈에 띄게 치솟는 연기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  english_pob_choice: the appointed sign
  chosen_korean: 정해진 신호
  alternatives_korean:
  - 정해진 때
  - 약정된 arrangement
  - 합의된 표시
  lexicon: HALOT
  rationale: מוֹעֵד는 기본적으로 '정한 때/회합'이지만, 여기서는 전투 상황에서 미리 약속한 신호를 가리키므로 '정해진 신호'가 기능과 의미를 함께 살립니다.
- source_word: לְאִישׁ יִשְׂרָאֵל ... עִם הָאֹרֵב
  english_pob_choice: between the men of Israel and the ambush
  chosen_korean: 이스라엘 사람들과 매복한 자들 사이에
  alternatives_korean:
  - 이스라엘 사람들을 위하여 매복한 자들과 함께
  - 이스라엘의 군사들과 매복 부대 사이에
  lexicon: HALOT
  rationale: 히브리어의 문자적 구성은 '이스라엘의 사람에게/를 위하여 ... 매복한 자들과 함께'이지만, 문맥상 두 편대 사이의 합의 관계이므로 한국어는 '사이'로 풀어 자연스럽게 옮겼습니다.
- source_word: הֶרֶב
  english_pob_choice: great
  chosen_korean: 큰
  alternatives_korean:
  - 크게
  - 매우 큰
  - 많이
  lexicon: HALOT
  rationale: 강조를 나타내는 רבה의 부사적 용법이므로, 한국어에서는 '큰 연기 기둥'으로 옮겨 연기의 눈에 띄는 강도를 살렸습니다.
- source_word: מַשְׂאַת הֶעָשָׁן
  english_pob_choice: a great cloud of smoke
  chosen_korean: 큰 연기 기둥
  alternatives_korean:
  - 큰 연기 구름
  - 연기의 큰 기둥
  - 두드러진 연기 신호
  lexicon: HALOT
  rationale: מַשְׂאַת는 '들어 올린 것, 치솟는 것'의 뜻을 지니므로 단순한 '연기'보다 위로 치솟는 가시적 표지를 드러내기 위해 '연기 기둥'으로 옮겼습니다.
- source_word: מִן הָעִיר
  english_pob_choice: from the city
  chosen_korean: 성에서
  alternatives_korean:
  - 도시에서
  - 그 성읍에서
  lexicon: HALOT
  rationale: 문맥상 전투가 벌어지는 도시를 가리키므로, 한국어 성경에서 흔한 '성'을 사용하되 과도한 고어화 없이 간결하게 처리했습니다.
theological_decisions:
- issue: 전투 신호로서의 무성한 연기 표현
  chosen_reading: 이 구절의 핵심은 예배적 상징이 아니라 전투 작전을 위한 사전 합의 신호로 읽었습니다.
  alternative_readings:
  - 단순한 '연기' 묘사로 축소
  - 예언적 표징처럼 일반화
  rationale: 문맥이 전쟁 서술이며 מוֹעֵד가 당사자들 사이의 약속된 표지를 뜻하므로, 의미를 약화하지 않고 작전 신호로 유지하는 것이 본문에 충실합니다.
  doctrine_reference: 문맥 우선의 서사 해석
