id: JDG.20.33
reference: Judges 20:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹ֣ל אִ֣ישׁ יִשְׂרָאֵ֗ל קָ֚מוּ מִ/מְּקוֹמ֔/וֹ וַ/יַּעַרְכ֖וּ בְּ/בַ֣עַל תָּמָ֑ר וְ/אֹרֵ֧ב יִשְׂרָאֵ֛ל מֵגִ֥יחַ מִ/מְּקֹמ֖/וֹ מִ/מַּֽעֲרֵה גָֽבַע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
  footnotes:
  - marker: a
    text: Hebrew Maareh-geba may be understood as a place name, as translated here. It could also be read more descriptively as 'the open place of Geba' or 'the meadow of Geba.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘의 모든 남자들이 자기들의 자리에서 일어나 바알-다말에서 전열을 갖추었고, 이스라엘의 매복대는 자기들의 자리, 곧 마아레-게바에서[a] 급히 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַעֲרֵה גָבַע는 지명으로도, ‘게바의 벌판’ 또는 ‘게바의 초원’이라는 서술적 표현으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  english_pob_choice: all the men of Israel
  chosen_korean: 이스라엘의 모든 남자들
  alternatives_korean:
  - 이스라엘의 모든 사람들
  - 이스라엘의 모든 남성들
  lexicon: WLC/HALOT
  rationale: 군사적 문맥에서 אִישׁ은 집합적으로 ‘남자들’로 옮기는 것이 자연스럽고, כֹל의 집합적 의미도 잘 드러납니다.
- source_word: וַיַּעַרְכוּ
  english_pob_choice: drew up in battle formation
  chosen_korean: 전열을 갖추었고
  alternatives_korean:
  - 전투 대형을 갖추었고
  - 전열을 정비했고
  lexicon: HALOT
  rationale: ערך는 전쟁 서술에서 병력을 정렬하는 뜻이므로, ‘전열을 갖추다’로 군사적 배열을 간결하게 살렸습니다.
- source_word: בְּבַעַל תָּמָר
  english_pob_choice: at Baal-tamar
  chosen_korean: 바알-다말에서
  alternatives_korean:
  - 바알-다말에
  - 바알-종려나무에서
  lexicon: HALOT
  rationale: 지명으로 보는 것이 타당하므로 음역을 유지했습니다. ‘다말’은 히브리어 תָּמָר의 통상적 음역에 맞췄습니다.
- source_word: אֹרֵב יִשְׂרָאֵל
  english_pob_choice: the men lying in ambush of Israel
  chosen_korean: 이스라엘의 매복한 자들은
  alternatives_korean:
  - 이스라엘의 매복대는
  - 이스라엘의 숨어 기다리던 자들은
  lexicon: HALOT
  rationale: אֹרֵב은 ‘매복하다/숨어 기다리다’는 뜻이므로, 군사 집단을 가리키는 표현으로 한국어 본문에서 바로 이해되게 옮겼습니다.
- source_word: מִמַּעֲרֵה גָבַע
  english_pob_choice: from Maareh-geba
  chosen_korean: 마아레-게바에서
  alternatives_korean:
  - 게바의 벌판에서
  - 게바의 초원에서
  lexicon: HALOT
  rationale: 이 표현은 지명일 수도 있고 서술적 지형명일 수도 있으나, 본문에서는 지명 음역을 유지하고 의미 가능성은 각주로 남기는 편이 가장 안전합니다.
theological_decisions:
- issue: 지명 표기와 본문 의미 보존
  chosen_reading: ‘마아레-게바’는 본문에서는 음역으로 두어 지명 가능성을 살리고, 의미적 해석은 본문 밖으로 미룹니다.
  alternative_readings:
  - ‘게바의 벌판’
  - ‘게바의 초원’
  rationale: 히브리어의 불확실성을 한국어 본문에서 단정적으로 해석하면 원문의 여지를 지우게 되므로, POB의 지명 유지 원칙을 따랐습니다.
  doctrine_reference: '성경 본문 번역 원칙: 불확실한 지명/어구는 본문에서 과도하게 해석하지 않음'
- issue: 군사 서술의 직접성 유지
  chosen_reading: ‘전열을 갖추다’, ‘급히 나왔다’로 군사적 긴박함을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘자리 잡았다’
  - ‘나아왔다’
  rationale: 서술의 전투적 긴장과 급박한 움직임을 약화시키지 않기 위해, 완곡한 표현보다 원문의 행동성과 속도를 살렸습니다.
  doctrine_reference: 서사 본문 번역에서 사건의 동세와 긴장 보존
