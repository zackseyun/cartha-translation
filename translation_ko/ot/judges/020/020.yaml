source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אִ֣ישׁ יִשְׂרָאֵ֔ל לַ/מִּלְחָמָ֖ה עִם בִּנְיָמִ֑ן וַ/יַּעַרְכ֨וּ אִתָּ֧/ם אִֽישׁ יִשְׂרָאֵ֛ל מִלְחָמָ֖ה אֶל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
  footnotes:
  - marker: a
    text: Or 'arrayed themselves for battle against them at Gibeah.' The Hebrew wording allows a slightly more explicit adversarial sense in the second clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 사람들이 베냐민과 싸우려고 나갔고, 이스라엘 사람들이 기브아에서 그들과[a] 맞서 싸울 진형을 갖추었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들과 함께’로도 옮길 수 있으나, 전쟁 문맥에서는 그들을 상대로 맞선다는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나갔고
  alternatives_korean:
  - 출정했고
  - 진군했고
  lexicon: HALOT
  rationale: 전투 문맥의 יצא를 한국어에서 가장 자연스럽게 살리되, 이동·출동의 의미를 과도하게 좁히지 않도록 ‘나가다’로 옮겼습니다.
- source_word: אִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘의 사람들이
  alternatives_korean:
  - 이스라엘의 남자들이
  - 이스라엘 군사들이
  lexicon: HALOT
  rationale: 히브리어의 단수 집합 표현을 한국어에서는 복수 집합으로 자연스럽게 풀어 주되, 전투 집단임을 유지했습니다.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  english_pob_choice: drew up for battle
  chosen_korean: 맞서 싸울 진형을 갖추었습니다
  alternatives_korean:
  - 전열을 갖추었습니다
  - 전투 대형을 갖추었습니다
  lexicon: HALOT
  rationale: ערך의 군사적 ‘진열/전열 배치’ 의미를 살리기 위해 ‘진형을 갖추다’로 옮기고, מִלְחָמָה는 ‘싸울’로 결합해 전투 목적을 드러냈습니다.
- source_word: עִם בִּנְיָמִן / אִתָּם
  english_pob_choice: against Benjamin / against them
  chosen_korean: 베냐민과 / 그들과 맞서
  alternatives_korean:
  - 베냐민을 상대로 / 그들을 상대로
  - 베냐민과 대적하여 / 그들과 대적하여
  lexicon: HALOT
  rationale: עִם과 אִתָּם가 여기서는 동맹이 아니라 대립 관계를 나타내므로, 두 절 모두 한국어에서 분명한 적대 의미가 드러나도록 ‘맞서’로 처리했습니다.
- source_word: אֶל הַגִּבְעָה
  english_pob_choice: at Gibeah
  chosen_korean: 기브아에서
  alternatives_korean:
  - 기브아 쪽에서
  - 기브아를 향하여
  lexicon: HALOT
  rationale: אֶל의 기본값은 ‘~로/향하여’이지만, 여기서는 전투 배치의 위치를 가리키는 것으로 보아 한국어에서는 장소 부사격 ‘기브아에서’가 가장 자연스럽습니다.
theological_decisions:
- issue: 전투 상대를 드러내는 전치사 עִם / אִתָּם의 처리
  chosen_reading: 두 절 모두 적대적 관계를 분명히 하도록 ‘맞서’로 번역했습니다.
  alternative_readings:
  - ‘~과 함께’로 직역
  - ‘~를 향해’로 완화
  rationale: 문맥상 동맹이 아니라 적대적 교전이므로, 독자가 전쟁 장면의 긴장을 오해하지 않도록 명시적 대립 표현을 택했습니다.
  doctrine_reference: 문맥 우선의 번역 원칙
