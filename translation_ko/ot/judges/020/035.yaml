  - severity: medium
    issue: 신명이 ‘여호와’로 되어 있습니다.
    rationale: 제공된 영어 POB 감사 기록은 Tetragrammaton을 Yahweh로 음역하는 방침을 명시합니다. 한국어에서는 ‘야훼’가 이에 대응합니다.
