  to: 야훼께서 이스라엘 앞에서 베냐민을 치셨습니다. 그 날 이스라엘 자손은 베냐민 사람 이만 오천백 명을 죽였습니다. 그들은 모두 칼을 뽑아 드는 자들이었습니다.
