  lexicon: HALOT
  rationale: 압축된 히브리어 구조를 따라 ‘도시들에서 나온 자들’로 남기고, שׁחת의 파괴·살상 의미를 ‘멸하다’로 살려 군사적 몰살을 나타냈습니다.
theological_decisions:
- issue: 전투 장면의 압축된 히브리어를 얼마나 명시적으로 풀어 쓸지
  chosen_reading: 원문의 압축성을 유지하되, 한국어에서 이해가 어려운 부분만 최소한으로 풀어 ‘도시들에서 나온 자들이 그들을 그들 가운데서 멸하고 있었습니다’로 옮겼습니다.
  alternative_readings:
