  - ‘성읍들에서 나온 자들이 그들 안에서 무너뜨리고 있었습니다’
  rationale: 본문은 전술적 역전과 내부 붕괴를 짧게 제시하므로, 과도한 설명을 덧붙이지 않고도 사건의 폭력성과 역전 구조가 드러나게 했습니다.
  doctrine_reference: 본문 해석상의 서술적 선택
