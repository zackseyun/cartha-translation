base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before the men of Israel''; the phrase can also be understood idiomatically as ''from before the men of Israel,'' that is, retreating from them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and the battle caught up with them.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew in the last clause is compressed and difficult. It likely refers to Israelite forces coming out from the cities or ambush positions and destroying Benjamin from within their formation.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 이스라엘 사람들 앞에서 광야로 가는 길을 향해 돌이켰습니다[a]. 그러나 전쟁이 그들을 따라잡았고[b], 성읍들에서 나온 자들이 그들 한가운데서 그들을 멸하고 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 사람들 앞에서’이지만, 관용적으로는 ‘이스라엘 사람들 앞에서 물러나서’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전투가 그들을 따라잡았습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 마지막 절은 압축되어 있어 어렵습니다. 문맥상 성읍들에서 나온 이스라엘 측 병력이 베냐민 군대를 그들 한가운데서 멸하는 장면을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
