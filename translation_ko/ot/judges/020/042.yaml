  text: וַ/יִּפְנ֞וּ לִ/פְנֵ֨י אִ֤ישׁ יִשְׂרָאֵל֙ אֶל דֶּ֣רֶךְ הַ/מִּדְבָּ֔ר וְ/הַ/מִּלְחָמָ֖ה הִדְבִּיקָ֑תְ/הוּ וַ/אֲשֶׁר֙ מֵ/הֶ֣/עָרִ֔ים מַשְׁחִיתִ֥ים אוֹת֖/וֹ בְּ/תוֹכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before the men of Israel''; the phrase can also be understood idiomatically as ''from before the men of Israel,'' that is, retreating from them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and the battle caught up with them.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew in the last clause is compressed and difficult. It likely refers to Israelite forces coming out from the cities or ambush positions and destroying Benjamin from within their formation.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그들은 이스라엘 사람들 앞에서 광야로 가는 길을 향해 돌이켰습니다[a]. 전쟁이 그들을 따라잡았고[b], 도시들에서 나온 자들이 그들을 그들 가운데서 멸하고 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 사람들 앞에서’이지만, 관용적으로는 ‘이스라엘 사람들 앞에서 물러나서’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전투가 그들을 따라잡았습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 마지막 절은 압축되어 있어 어렵습니다. 문맥상 도시들에서 나온 이스라엘 측 병력이 베냐민을 그들의 한가운데에서 무너뜨리는 장면으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  english_pob_choice: they turned
  chosen_korean: 돌이켰습니다
  alternatives_korean:
  - 돌아서 갔습니다
  - 물러갔습니다
  lexicon: HALOT
  rationale: פּנה의 기본 의미인 ‘돌다/방향을 바꾸다’를 살리면서, 전투 문맥의 후퇴도 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  english_pob_choice: before the men of Israel
  chosen_korean: 이스라엘 사람들 앞에서
  alternatives_korean:
  - 이스라엘 사람들 앞을 향해
  - 이스라엘 사람들로부터
  lexicon: HALOT
  rationale: 직역의 ‘앞에서’를 유지하되, 관용적으로는 ‘~앞에서 물러나다’의 뉘앙스가 살아 있어 후퇴 장면을 자연스럽게 전달합니다.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  english_pob_choice: but the battle overtook them
  chosen_korean: 전쟁이 그들을 따라잡았고
  alternatives_korean:
  - 싸움이 그들을 따라붙었고
  - 전투가 그들을 추격했고
  lexicon: HALOT
  rationale: דבק의 사역적 뉘앙스를 한국어의 ‘따라잡다’로 옮겨, 단순히 ‘싸움이 계속되었다’가 아니라 추격하여 포위하는 느낌을 살렸습니다.
- source_word: וַאֲשֶׁר מֵהֶעָרִים ... מַשְׁחִיתִים ... בְּתוֹכוֹ
  english_pob_choice: and those from the cities were destroying them in their midst
  chosen_korean: 도시들에서 나온 자들이 그들을 그들 가운데서 멸하고 있었습니다
  alternatives_korean:
  - 성읍들에서 나온 자들이 그들 가운데서 무너뜨리고 있었습니다
  - 성읍들에서 나온 자들이 그들 한가운데서 죽이고 있었습니다
  lexicon: HALOT
  rationale: 압축된 히브리어 구조를 따라 ‘도시들에서 나온 자들’로 남기고, שׁחת의 파괴·살상 의미를 ‘멸하다’로 살려 군사적 몰살을 나타냈습니다.
theological_decisions:
- issue: 전투 장면의 압축된 히브리어를 얼마나 명시적으로 풀어 쓸지
  chosen_reading: 원문의 압축성을 유지하되, 한국어에서 이해가 어려운 부분만 최소한으로 풀어 ‘도시들에서 나온 자들이 그들을 그들 가운데서 멸하고 있었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘성읍들에서 나온 자들이 그들 가운데서 몰살하고 있었습니다’
  - ‘성읍들에서 나온 자들이 그들 안에서 무너뜨리고 있었습니다’
  rationale: 본문은 전술적 역전과 내부 붕괴를 짧게 제시하므로, 과도한 설명을 덧붙이지 않고도 사건의 폭력성과 역전 구조가 드러나게 했습니다.
  doctrine_reference: 본문 해석상의 서술적 선택
