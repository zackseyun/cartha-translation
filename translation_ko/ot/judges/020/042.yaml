  - 이스라엘 사람들로부터
  lexicon: HALOT
  rationale: 직역의 ‘앞에서’를 유지하되, 관용적으로는 ‘~앞에서 물러나다’의 뉘앙스가 살아 있어 후퇴 장면을 자연스럽게 전달합니다.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  english_pob_choice: but the battle overtook them
  chosen_korean: 전쟁이 그들을 따라잡았고
  alternatives_korean:
  - 싸움이 그들을 따라붙었고
  - 전투가 그들을 추격했고
  lexicon: HALOT
  rationale: דבק의 사역적 뉘앙스를 한국어의 ‘따라잡다’로 옮겨, 단순히 ‘싸움이 계속되었다’가 아니라 추격하여 포위하는 느낌을 살렸습니다.
- source_word: וַאֲשֶׁר מֵהֶעָרִים ... מַשְׁחִיתִים ... בְּתוֹכוֹ
  english_pob_choice: and those from the cities were destroying them in their midst
  chosen_korean: 도시들에서 나온 자들이 그들을 그들 가운데서 멸하고 있었습니다
  alternatives_korean:
