  rationale: 베냐민 공동체 내부에서 벌어진 사건이라는 문맥을 살리기 위해 공동체 내부를 가리키는 표현을 사용했습니다.
  doctrine_reference: 문맥상 공동체 책임과 내부 질서에 관한 서술
