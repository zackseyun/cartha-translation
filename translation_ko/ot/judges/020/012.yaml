  rationale: 구문 구조를 따라 소속 관계를 분명히 하면서도 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  english_pob_choice: through all the tribes of Benjamin
  chosen_korean: 베냐민의 모든 지파에
  alternatives_korean:
  - 베냐민의 모든 지파들 가운데
  - 베냐민의 모든 지파들을 따라
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 분포적 용법을 반영해 ‘~에’로 넓게 미치게 하는 방향을 살리고, 베냐민 내부의 지파/씨족 단위를 포괄하는 뜻을 유지했습니다.
- source_word: הָרָעָה הַזֹּאת
