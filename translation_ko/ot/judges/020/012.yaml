  lexicon: HALOT
  rationale: שלח의 기본 의미를 자연스럽게 옮겨, 문맥상 사절을 보내는 행위임을 드러내되 과도하게 공문체로 굳히지 않았습니다.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
