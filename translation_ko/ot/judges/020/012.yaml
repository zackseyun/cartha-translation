  terminology: ‘이스라엘의 지파들’, ‘베냐민’, ‘너희 가운데서’는 적절합니다. ‘악한 일’은 רָעָה의 도덕적 부정성을 유지하면서도, 여기서 문제 되는 공동체 내의 행위를 자연스럽게 나타냅니다.
