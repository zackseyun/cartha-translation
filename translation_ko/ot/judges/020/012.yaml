- from: 그래서 이스라엘의 지파들이 베냐민의 모든 지파에 사람들을 보내며 이렇게 말했습니다[a]. 「너희 가운데서 일어난 이 악이 무엇입니까?」[b]
  to: 이에 이스라엘의 지파들은 베냐민의 모든 지파에 사람들을 보내어 이렇게 말했습니다. 「너희 가운데서 일어난 이 악한 일[b]이 무엇입니까?」[a]
  rationale: 완료된 파견 행위와 발화의 순서를 자연스럽게 바로잡고, רָעָה를 현대 한국어에서 문맥에 맞는 ‘악한 일’로 다듬었습니다. 또한 각주 b를 그것이 설명하는 어휘 뒤로 옮겼습니다. 각주 a는 원문의 베트 전치사에 관한 대안을 보존하며, ‘베냐민의 모든 지파에’ 뒤가 아니라 문장 끝에 두어도 가리키는 범위가 명확하도록 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:20Z'
