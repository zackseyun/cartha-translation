  - 이 사악함
  - 이 잘못
  lexicon: HALOT
  rationale: רָעָה의 도덕적 악성은 유지하되, 질문문 안에서 가장 간결하고 직설적인 ‘악’을 택했습니다.
theological_decisions:
- issue: ‘among you’의 공동체 내부성
  chosen_reading: 너희 가운데서
  alternative_readings:
