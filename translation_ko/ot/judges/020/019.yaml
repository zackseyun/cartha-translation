lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어 직유구를 그대로 살리되, 한국어에서 자연스럽고 성별 포괄적으로 읽히는 표준 성경식 표현을 택했습니다.
- source_word: וַיָּקֻמוּ
  english_pob_choice: rose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 떠났습니다
  lexicon: HALOT
  rationale: 연속 서술의 동작 진행을 간결하게 옮기며, 단순한 기상과 다음 행동으로 이어지는 흐름을 유지합니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 주둔했습니다
  lexicon: HALOT
  rationale: 전투 상황에서의 군사적 '진치다'를 반영해, 단순한 숙영보다 적대적 배치를 드러내게 했습니다.
- source_word: עַל הַגִּבְעָה
  english_pob_choice: against Gibeah
  chosen_korean: 기브아를 향해
  alternatives_korean:
  - 기브아에
  - 기브아 맞은편에
  lexicon: HALOT
  rationale: עַל이 이 문맥에서 단순 위치보다 공격적 대치를 나타내므로, '향해'로 군사적 방향성을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 가문/민족 집단을 가리키는 'sons of Israel'의 번역
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 본문의 혈통·언약 공동체 표지를 희석하지 않으면서도, 현대 한국어 독자가 이해할 수 있는 익숙한 표현을 유지했습니다.
  doctrine_reference: 언약 공동체 표지 보존
- issue: 전투 진영의 방향성 표현
  chosen_reading: 기브아를 향해
  alternative_readings:
  - 기브아에
  - 기브아 곁에
  rationale: 본문이 단순한 위치가 아니라 대치와 공세 준비를 암시하므로, 문맥의 긴장을 약화시키지 않도록 방향성을 드러냈습니다.
  doctrine_reference: 본문-문맥 일치
