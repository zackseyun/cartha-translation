  source_fidelity: ‘다시 싸움을 벌였습니다’는 실제 교전을 시작했다는 뜻을 더하는 반면, 히브리어 לַעֲרֹךְ מִלְחָמָה는 이 절에서 전투를 위해 전열을 다시 갖추는 행위를 가리킵니다. 이를 ‘다시 전열을 갖추었습니다’로 바로잡아야 합니다. וַיִּתְחַזֵּק의 자기 강화·결의 회복의 뜻도 ‘스스로 힘을 내어’로 보존했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 군사 서술의 반복 구조도 명료하게 전달합니다. ‘이스라엘 백성, 곧 이스라엘 사람들’은 원문의 동격적 집합 표현을 다소 중첩되지만 충실하게 반영합니다.
