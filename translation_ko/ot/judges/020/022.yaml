source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֥ק הָ/עָ֖ם אִ֣ישׁ יִשְׂרָאֵ֑ל וַ/יֹּסִ֨פוּ֙ לַ/עֲרֹ֣ךְ מִלְחָמָ֔ה בַּ/מָּק֕וֹם אֲשֶׁר עָ֥רְכוּ שָׁ֖ם בַּ/יּ֥וֹם הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
  footnotes:
  - marker: a
    text: Or 'took courage' for 'strengthened themselves.' The Hebrew can denote renewed resolve after defeat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘 백성, 곧 이스라엘 사람들은 스스로 힘을 내어, 첫째 날 그들이 진을 쳤던 그 자리에서 다시 전열을 갖추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용기를 내어’. 히브리어 히트파엘형은 패배 뒤에 스스로 힘을 내거나 결의를 회복하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  english_pob_choice: strengthened themselves
  chosen_korean: 다시 용기를 내어
  alternatives_korean:
  - 스스로 강해져
  - 힘을 내어
  - 다시 힘을 모아
  lexicon: HALOT
  rationale: 히트파엘형의 반사적·내적 회복을 자연스러운 한국어로 살리기 위해, 단순한 체력 강화보다 재정비된 결의를 드러내는 표현을 택했습니다.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  english_pob_choice: the people, the men of Israel
  chosen_korean: 이스라엘 백성, 곧 이스라엘 사람들
  alternatives_korean:
  - 이스라엘 백성, 곧 이스라엘 남자들
  - 이스라엘의 군사들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: ‘백성’과 ‘איש’의 병렬을 모두 보이되, 현대 한국어에서 성별 한정이 지나치게 딱딱하게 들리지 않도록 ‘사람들’로 풀어 중첩된 집합적 표현을 살렸습니다.
- source_word: וַיֹּסִפוּ לַעֲרֹךְ מִלְחָמָה
  english_pob_choice: and again drew up for battle
  chosen_korean: 다시 싸움을 벌였습니다
  alternatives_korean:
  - 다시 전열을 갖추어 싸웠습니다
  - 다시 전투 대형을 갖추었습니다
  - 다시 전쟁을 준비했습니다
  lexicon: HALOT
  rationale: יסף의 반복 의미는 ‘다시’로, ערך מלחמה의 군사적 재개는 한국어 본문에서 과도하게 도식화하지 않으면서도 실제 교전 재개를 드러내는 표현으로 옮겼습니다.
- source_word: בַּ/מָּק֕וֹם אֲשֶׁר עָ֥רְכוּ שָׁ֖ם
  english_pob_choice: in the place where they had drawn up
  chosen_korean: 그들이 진을 쳤던 그 자리에서
  alternatives_korean:
  - 그들이 전열을 갖추었던 그곳에서
  - 그들이 진을 벌였던 자리에서
  - 그들이 배치되었던 곳에서
  lexicon: HALOT
  rationale: 같은 어근 ערך가 앞뒤에 반복되므로, 군사적 배치의 의미를 한국어 관용 표현 ‘진을 치다’로 옮겨 반복성을 자연스럽게 드러냈습니다.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  english_pob_choice: on the first day
  chosen_korean: 첫째 날
  alternatives_korean:
  - 첫날
  - 처음 날
  - 첫 번째 날
  lexicon: HALOT
  rationale: 전투의 이전 배치를 가리키는 시간표현으로서 간결하고 자연스러운 ‘첫째 날’을 사용했습니다.
theological_decisions:
- issue: 전투 서술의 직역성과 자연스러움
  chosen_reading: 본문의 군사적 반복 구조를 유지하되, 한국어에서는 ‘다시 용기를 내어’와 ‘다시 싸움을 벌였습니다’로 압축해 서술의 긴박함을 살렸습니다.
  alternative_readings:
  - ‘스스로 강해져 다시 전열을 갖추었습니다’처럼 더 직역적으로
  - ‘다시 전투를 준비했습니다’처럼 더 완곡하게
  rationale: 이 절은 신학적 쟁점보다 서사적 리듬이 핵심이므로, 히브리어의 반복성과 재개성을 보존하면서도 한국어 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 서사 본문 번역 원칙
- issue: ‘이스라엘 사람들’의 성중립/성별 함의
  chosen_reading: ‘איש יִשְׂרָאֵל’의 남성적 표지를 과도하게 성별화하지 않고, 전투 집단을 가리키는 집합적 표현으로 처리했습니다.
  alternative_readings:
  - ‘이스라엘 남자들’
  - ‘이스라엘의 용사들’
  rationale: 문맥상 전투에 참여한 사람들을 가리키지만, 한국어 합쇼체 본문에서는 고대 히브리어의 집합적 관용을 현대 독자가 무리 없이 읽도록 옮기는 것이 적절합니다.
  doctrine_reference: 원문 집합명사 처리 원칙
