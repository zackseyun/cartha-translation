lexical_decisions:
- source_word: וַיֵּצְאוּ / came out
  english_pob_choice: came out
  chosen_korean: 나와
  alternatives_korean:
  - 나섰습니다
  - 나갔습니다
  lexicon: HALOT
  rationale: 전투 문맥의 wayyiqtol יצא를 자연스럽게 살리면서, 도시에서 ‘밖으로 나와’ 출전하는 동작을 간결하게 드러냅니다.
- source_word: בְנֵי בִנְיָמִן / the sons of Benjamin
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민 사람들
  - 베냐민 지파 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족·혈연 표현을 유지해 지파 정체성을 드러내되, 한국어에서는 관용적인 성경체인 ‘자손’을 사용했습니다.
- source_word: וַיַּשְׁחִיתוּ / struck down
  english_pob_choice: struck down
  chosen_korean: 쳐서 쓰러뜨렸습니다
  alternatives_korean:
  - 죽였습니다
  - 멸망시켰습니다
  lexicon: HALOT
  rationale: 직접적인 사망 결과를 분명히 하면서도, 단순한 ‘죽이다’보다 전투적 폭력의 감각을 살렸습니다. ‘멸망시키다’는 과도하게 포괄적이어서 피해 규모를 숫자와 함께 더 흐리게 할 수 있습니다.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף / twenty-two thousand
  english_pob_choice: twenty-two thousand
  chosen_korean: 이만이천 명
  alternatives_korean:
  - 스물두 천 명
  - 22,000명
  lexicon: HALOT
  rationale: 한국어 성경체에서 자연스러운 수사 표현으로 옮겨 숫자 정보를 정확히 보존합니다.
