    issue: 동작의 시작과 ‘보라’ 표지가 누락되었습니다.
    rationale: ‘올라가자’는 הֵחֵלָּה לַעֲלוֹת의 시작 동작을 충분히 나타내지 못하며, וְהִנֵּה는 뒤이어 보게 된 뜻밖의 광경을 표시합니다.
  - severity: medium
