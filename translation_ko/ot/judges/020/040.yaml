  source_fidelity: 초안은 매복대가 보낸 신호와 성에서 올라가는 연기를 대체로 전달합니다. 그러나 הֵחֵלָּה(‘시작했다’)와 וְהִנֵּה(갑작스러운 인지 표지)가 빠지고, ‘연기 기둥처럼’은 עַמּוּד עָשָׁן(‘연기 기둥’)의 단정적 표현을 비교 표현으로 바꿉니다. 또한 ‘올라가자’와 ‘돌아보니’의 연결은 원문의 단순한 연속을 다소 인과적으로 만들 수 있습니다.
  naturalness: ‘성에서 연기 기둥인 신호가 솟아오르기 시작했습니다’는 현대 표준어 문어체로 자연스럽고, ‘베냐민이 뒤를 돌아보았는데, 보니’는 원문의 전환과 발견의 효과를 자연스럽게 보존합니다.
  terminology: ‘베냐민’은 지파를 집합 단수로 나타내는 본문의 용법에 맞습니다. הַמַּשְׂאֵת는 전투 맥락에서 ‘신호’로 옮기는 것이 적절합니다. ‘연기 기둥’은 עַמּוּד עָשָׁן의 통상적이고 정확한 번역입니다.
  issues:
