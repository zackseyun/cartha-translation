  text: 베냐민 사람들이 둘째 날에 기브아에서 그들을 맞으러[a] 나와, 이스라엘 사람들[b] 가운데 또 만팔천 명을 땅에 쓰러뜨렸습니다. 이들은 모두 칼을 뽑아 든 사람들이었습니다.
