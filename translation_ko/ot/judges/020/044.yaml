  text: וַֽ/יִּפְּלוּ֙ מִ/בִּנְיָמִ֔ן שְׁמֹנָֽה עָשָׂ֥ר אֶ֖לֶף אִ֑ישׁ אֶת כָּל אֵ֖לֶּה אַנְשֵׁי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
  footnotes:
  - marker: a
    text: Or, more formally, 'all these were men of valor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 베냐민 사람 만 팔천 명이 쓰러졌습니다. 이들 모두는 용맹한 전사들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 좀 더 직역하면, ‘이들 모두는 용맹한 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  english_pob_choice: fell
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 떨어졌습니다
  - 죽었습니다
  lexicon: HALOT
  rationale: 전투 문맥에서 ‘fell’의 직역성을 살리면서, 한국어에서는 자연스럽게 전사·패배의 결과를 드러내는 ‘쓰러지다’가 가장 가까운 표현입니다.
- source_word: מִבִּנְיָמִן
  english_pob_choice: from Benjamin
  chosen_korean: 베냐민 사람
  alternatives_korean:
  - 베냐민에서
  - 베냐민에게서
  lexicon: HALOT
  rationale: 히브리어 מִן은 출처와 소속을 함께 나타내므로, 한국어에서는 부족 소속을 분명히 하는 ‘베냐민 사람’으로 옮겼습니다.
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  english_pob_choice: eighteen thousand men
  chosen_korean: 만팔천 명
  alternatives_korean:
  - 만팔천 남자
  - 만팔천의 사람
  lexicon: HALOT
  rationale: 수사 뒤의 אִישׁ을 한국어에서는 인원 단위 ‘명’으로 자연스럽게 반영해, 군사적 맥락을 해치지 않으면서도 원문의 인명 수량을 보존했습니다.
- source_word: אַנְשֵׁי חָיִל
  english_pob_choice: valiant warriors
  chosen_korean: 용맹한 전사들
  alternatives_korean:
  - 용사들
  - 용맹한 용사들
  - 무용한 남자들
  lexicon: HALOT
  rationale: 문구는 단순한 ‘능력 있는 사람들’보다 전투 맥락의 용기와 전사성을 함께 띠므로, 현대 한국어에서 분명한 ‘용맹한 전사들’로 옮겼습니다.
theological_decisions:
- issue: 전투 결과를 나타내는 וַיִּפְּלוּ의 의미 범위
  chosen_reading: ‘쓰러졌습니다’로 옮겨 직접적인 죽음의 결과를 암시하되, 본문이 말하는 전투 패배의 이미지를 유지했습니다.
  alternative_readings:
  - ‘죽었습니다’로 명시
  - ‘패배했습니다’로 완화
  rationale: 히브리어 동사는 문자적으로 ‘떨어지다/쓰러지다’이며, 전투 서술에서는 사망과 패배를 함께 암시합니다. 원문의 응축된 표현을 풀어 쓰지 않도록 했습니다.
  doctrine_reference: 성경 본문 서술의 직설성 보존
- issue: אַנְשֵׁי חָיִל의 군사적 성격
  chosen_reading: ‘용맹한 전사들’로 하여 단순한 도덕적 칭찬이 아니라 전투 능력과 용기를 함께 드러냈습니다.
  alternative_readings:
  - ‘용맹한 사람들’
  - ‘용사의 사람들’
  rationale: 이 표현은 문맥상 전사 집단을 가리키므로, 한국어에서도 군사적 의미를 분명히 해야 본문의 비장함이 유지됩니다.
  doctrine_reference: 본문 문맥의 군사적 서술
