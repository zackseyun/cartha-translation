base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
  footnotes:
  - marker: a
    text: Or 'the Benjaminites.' The Hebrew reads 'the sons of Benjamin.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were detached from the city' or 'were lured away from the city.' The sense is that they were drawn out from the city's protection.
    reason: lexical_alternative
  - marker: c
    text: Or 'as before.' The Hebrew idiom compares this attack with the earlier battles.
    reason: lexical_alternative
  - marker: d
    text: Or 'in the field.' The phrase likely describes the route through open country.
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민 자손이 백성을 맞으러 나왔다가 성에서 유인되어 멀어졌고, 그들은 다른 때와 같이 길들에서 이스라엘 사람 약 서른 명을 쓰러뜨리기 시작했습니다. 그 길 하나는 베델로 올라가고, 다른 하나는 들판의 기브아로 가는 길이었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베냐민 사람들’이다. 히브리어는 ‘베냐민의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성에서 떼어내어진’ 또는 ‘성에서 유인된’의 뜻입니다. 문맥상 성의 보호 밖으로 끌려 나온 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘전처럼’입니다. 히브리어 관용구는 이 공격이 앞선 전투들과 같았음을 비교합니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘들판에서’입니다. 이 표현은 열린 시골 지대를 지나는 길을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
