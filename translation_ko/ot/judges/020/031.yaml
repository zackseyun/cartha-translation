  to: 베냐민 자손[a]이 백성을 맞으러 나와 성에서 멀리 끌려 나왔습니다.[b] 그들은 전처럼[c] 큰길들에서 이스라엘 사람 약 서른 명을 쳐 죽이기 시작했습니다. 그 길들 가운데 하나는 베델로 올라가고, 다른 하나는 들판을 지나 기브아로 갑니다.[d]
  rationale: 본문의 도로 지시를 한국어에서 분명하게 재구성하되, 두 번째 길과 ‘들판’의 정확한 결합 범위에 관한 여지는 각주로 보존했습니다. 또한 전투 사상자를 가리키는 חֲלָלִים을 본문에 명시적으로 반영했습니다. 각주 표지는 모두 본문 내 대응 어구에 붙였습니다.
