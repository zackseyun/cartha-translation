  - 베냐민인들
  lexicon: WLC
  rationale: 히브리어의 친족·지파 표현을 살려 직역하되, 한국어로도 자연스럽게 읽히는 표준 성경식 표현을 택했습니다.
- source_word: לִקְרַאת הָעָם
  english_pob_choice: to meet the people
  chosen_korean: 백성을 맞으러
  alternatives_korean:
  - 백성을 만나러
  - 군대를 맞으러
  lexicon: HALOT
  rationale: עָם의 직접 대응을 살리면서도 전투 문맥에서 ‘맞으러’가 자연스럽고, 적대적 접촉의 뉘앙스를 유지합니다.
- source_word: הָנְתְּקוּ מִן הָעִיר
  english_pob_choice: were drawn away from the city
  chosen_korean: 성에서 유인되어 멀어졌고
  alternatives_korean:
  - 성에서 떼어져 나왔고
  - 성에서 끌려 나왔고
  lexicon: HALOT
  rationale: 문맥상 성의 보호에서 벗어나도록 ‘유인되다’는 전술적 의미를 살렸고, POB의 ‘drawn away’와도 대응됩니다.
- source_word: כְּפַעַם בְּפַעַם
  english_pob_choice: as at other times
  chosen_korean: 다른 때와 같이
  alternatives_korean:
  - 전처럼
  - 이전처럼
  lexicon: HALOT
  rationale: 반복된 공격 양상을 나타내는 관용구로, ‘다른 때와 같이’가 의미를 가장 무리 없이 전달합니다.
- source_word: בַּמְסִלּוֹת
  english_pob_choice: on the highways
  chosen_korean: 길들에서
  alternatives_korean:
  - 큰길들에서
  - 도로에서
  lexicon: HALOT
  rationale: מסלות의 도로·고갯길 성격을 살리면서 전투 서술에서 과장되지 않은 한국어로 옮겼습니다.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  english_pob_choice: about thirty men
  chosen_korean: 약 서른 명
  alternatives_korean:
  - 서른 명쯤
  - 약 서른 사람
  lexicon: HALOT
  rationale: כִּ의 대략성을 ‘약’으로 반영했고, ‘명’을 사용해 인원을 자연스럽게 표시했습니다.
theological_decisions:
- issue: 공격의 반복성과 서술 톤
  chosen_reading: ‘다른 때와 같이’로 반복 패턴을 드러내고, 전투 결과를 서사적으로 담담하게 옮겼습니다.
  alternative_readings:
  - ‘전처럼’
  - ‘그전과 같이’
  rationale: 본문은 사건의 반복성과 전술적 성공을 설명하는 서술이므로, 과장 없이 동일한 양상을 드러내는 번역이 적절합니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: ‘성에서 유인되어 멀어졌다’의 전술적 의미
  chosen_reading: 단순 이동이 아니라 보호 구역에서 끌어내는 전술적 유인을 반영했습니다.
  alternative_readings:
  - ‘성에서 나왔다’
  - ‘성에서 떨어졌다’
  rationale: 히브리어 동사는 공격 대상으로부터 떨어져 나오게 된 상황을 시사하므로, 문맥상 전술적 의미를 보존해야 합니다.
  doctrine_reference: 문맥 우선 번역 원칙
