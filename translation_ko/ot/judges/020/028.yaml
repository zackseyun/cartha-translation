  source_fidelity: 원문은 비느하스가 ‘베냐민의 아들들, 나의 형제’와 싸울지를 묻는다고 명시합니다. 초안은 ‘나의 형제’를 본문에서 누락하고 각주에만 남겨, 친족 관계를 강조하는 원문의 표현을 충분히 보존하지 못했습니다. 또한 לְפָנָיו의 선행사는 문맥상 언약궤로 이해할 수 있으나 야훼를 가리킬 가능성도 있으므로, 본문과 각주에서 이 불확실성을 정확히 처리하는 것이 좋습니다.
  naturalness: ‘언약궤 앞에 서서’와 ‘내 형제인 베냐민 자손과 싸우러’는 현대 표준 한국어에서 자연스럽고, 서술은 합쇼체로 유지됩니다. 야훼의 직접 명령 ‘올라가라’와 약속 ‘넘겨주겠다’는 화자-청자의 위계를 반영하는 자연스러운 직접화법입니다.
