base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
  footnotes:
  - marker: a
    text: Or “stood before him,” with the pronoun understood as referring to the LORD rather than to the ark mentioned in the previous verse.
    reason: alternative_reading
  - marker: b
    text: Hebrew “the sons of Benjamin, my brother,” preserving the language of kinship even in civil war.
    reason: cultural_note
  - marker: c
    text: Or “I will deliver him into your hand.” The singular “him” likely treats Benjamin collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 엘르아살의 아들, 아론의 손자 비느하스가 그의 앞에 서서 말했습니다. “제가 또다시 나가 베냐민의 아들들과 싸워야 합니까, 아니면 멈춰야 합니까?” 그러자 야훼께서 말씀하셨습니다. “올라가라. 내일 내가 그를 네 손에 넘겨주겠다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의’는 앞절의 언약궤보다 야훼를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 “베냐민의 아들들, 내 형제”라고 하여 내전 속 친족성을 보존합니다.
    reason: cultural_note
  - marker: c
    text: 또는 “내가 그를 네 손에 넘겨주겠다.” 여기서 단수 ‘그를’은 베냐민 집단을 하나의 단위로 본 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  english_pob_choice: And Phinehas
  chosen_korean: 그때에 … 비느하스가
  alternatives_korean:
  - 그리고 비느하스가
  - 비느하스가
  lexicon: HALOT
  rationale: 문맥상 새 장면 진입의 시간표지로 자연스럽게 옮기되, 본문이 가진 서사 연속성은 유지했습니다. 고유명은 통용되는 성경식 표기를 따랐습니다.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  english_pob_choice: the son of Eleazar, son of Aaron
  chosen_korean: 엘르아살의 아들, 아론의 손자
  alternatives_korean:
  - 엘르아살의 아들, 아론의 아들
  - 엘르아살의 아들, 아론의 자손
  lexicon: HALOT
  rationale: 두 세대의 계보를 한국어 친족관계로 분명하게 드러냈습니다. 아론과의 관계는 한국어에서 ‘손자’가 자연스럽고 간결합니다.
- source_word: עֹמֵד לְפָנָיו
  english_pob_choice: stood before him
  chosen_korean: 그의 앞에 서서
  alternatives_korean:
  - 그 앞에 서서
  - 그 앞에서 섰습니다
  lexicon: HALOT
  rationale: 히브리어의 서 있는 자세를 살리되 한국어에서는 진행적 배경으로 ‘서서’가 가장 자연스럽습니다. 대명사 ‘his’는 원문 존대에 맞춰 중립적으로 처리했습니다.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  english_pob_choice: Shall I yet again go out to battle
  chosen_korean: 제가 또다시 나가 … 싸워야 합니까
  alternatives_korean:
  - 제가 다시 나가 … 싸워야 합니까
  - 제가 또 나가 … 싸워야 합니까
  lexicon: HALOT
  rationale: יסף + עוד의 반복 의미를 ‘또다시’로 살렸고, 전쟁 관용구는 한국어 자연성을 위해 ‘나가 싸우다’로 옮겼습니다.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  english_pob_choice: against the sons of Benjamin my brother
  chosen_korean: 베냐민의 아들들과
  alternatives_korean:
  - 베냐민 자손들과
  - 베냐민의 사람들과
  lexicon: HALOT
  rationale: ‘sons of Benjamin’의 종족적 표현을 유지했습니다. POB가 보존한 형제 호칭은 뒤의 ‘my brother’에서 드러나므로 본문에는 자연스러운 전투 상대 표지로 옮겼습니다.
- source_word: וַיֹּאמֶר יְהוָה
  english_pob_choice: And Yahweh said
  chosen_korean: 야훼께서 말씀하셨습니다
  alternatives_korean:
  - 야훼께서 말씀하셨다
  - 주께서 말씀하셨습니다
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼고, 직설 화법의 신적 발화는 한국어에서 격식을 갖춘 존대 표현으로 처리했습니다.
theological_decisions:
- issue: 전쟁 중 신탁 발화의 존대 및 직접화법 처리
  chosen_reading: 야훼께서 비느하스에게 직접 말씀하시는 장면으로 이해하고, 하나님의 발화는 한국어 존대체로 옮겼습니다.
  alternative_readings:
  - 신탁을 간접화해 서술적으로 처리함
  - 명령형을 평서형으로 완화함
  rationale: 본문은 전쟁 지침을 주시는 신적 직접 발화입니다. 한국어 합쇼체에서 하나님께서 말씀하시는 장면은 존대 종결을 유지하는 것이 의미와 경건성을 함께 살립니다.
  doctrine_reference: Direct divine speech in narrative; honorific register in Korean biblical style
