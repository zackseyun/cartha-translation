  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
  footnotes:
  - marker: a
    text: '''Sons of Israel'' is a literal rendering of the Hebrew expression for the people of Israel; it refers corporately to the tribes, not only to male individuals.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'as one man,' an idiom meaning in united agreement or action.
    reason: lexical_alternative
  - marker: c
    text: Or 'before the LORD at Mizpah.' The Hebrew wording can be understood as the assembly gathering in the LORD's presence at Mizpah.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이스라엘 자손[a]이 모두 나왔고, 회중은 한 사람처럼[b] 단에서 브엘세바까지와 길르앗 땅에서 야훼께서 계신 미스바에 모였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 이스라엘 백성을 가리키는 히브리어 표현을 직역한 것으로, 남성 개인만이 아니라 공동체 전체를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘한 사람처럼’이라는 관용구로, 한마음으로 단결하여 행동했다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘미스바에서 야훼 앞에’. 히브리어 표현은 회중이 미스바에서 야훼의 임재 앞에 모였다는 뜻으로도 이해할 수 있습니다.
    reason: alternative_reading
