  rationale: 문법적으로 불가능한 ‘야훼께 미스바에’를 ‘야훼께서 계신 미스바에’로 바로잡았습니다. 이는 영어 POB 본문의 ‘to Yahweh at Mizpah’ 및 히브리어의 집결 장소·야훼와의 관계를 자연스러운 한국어로 나타내며, ‘야훼 앞에’라는 가능한 해석은 각주에 보존합니다. 또한 각주 표지를 해당 어구 바로 뒤에 배치했습니다.
