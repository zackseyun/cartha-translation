theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문에서 하나님의 언약 이름을 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 기준에 따라 יְהוָה를 전통적 ‘주님’이 아니라 고유한 언약명으로 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אֶל יְהוָה הַמִּצְפָּה의 관계
  chosen_reading: ‘야훼께 미스바에’로 두어, 미스바에서 야훼 앞에 모인 의미를 열어 두었습니다.
  alternative_readings:
  - 야훼 앞에 미스바에서
  - 미스바에서 야훼께
  rationale: 히브리어는 목적 방향과 현장성을 함께 담을 수 있어, 본문은 간결하게 두고 영어 POB가 제시한 대안적 이해를 각주로 밝혔습니다.
  doctrine_reference: English POB footnote c
