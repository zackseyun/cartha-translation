  source_fidelity: 본문은 이스라엘 자손 전체가 나와 회중으로 집결했다는 뜻, ‘한 사람처럼’이라는 일치의 관용구, 단·브엘세바·길르앗의 지리적 범위를 대체로 충실히 보존합니다. 그러나 ‘야훼께 미스바에’는 한국어 문법상 목적 대상과 장소의 관계가 성립하지 않아 히브리어 אֶל־יְהוָה הַמִּצְפָּה의 의미를 전달하지 못합니다.
  naturalness: ‘야훼께 미스바에 모였습니다’는 비문입니다. ‘야훼께서 계신 미스바에 모였습니다’로 고치면 현대 표준 한국어 합쇼체로 자연스럽고, 미스바에서 야훼와 관련하여 모였다는 본문의 의미도 명료해집니다.
  terminology: ‘이스라엘 자손’, ‘회중’, ‘한 사람처럼’, ‘야훼’, ‘미스바’는 원문의 어휘와 POB의 신명 표기 방침에 부합합니다. ‘한 사람처럼’의 관용적 의미와 ‘이스라엘 자손’의 집합적 용법을 설명하는 각주도 적절합니다.
