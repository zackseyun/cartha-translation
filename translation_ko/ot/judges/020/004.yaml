  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
  footnotes:
  - marker: a
    text: Or “which is in Benjamin.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 레위인, 곧 살해된 여자의 남편이 대답했습니다. “나는 내 첩과 함께 하룻밤 묵으려고 베냐민에 속한[a] 기브아에 왔습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “베냐민에 있다.”
    reason: ‘베냐민에 속한’으로 옮긴 귀속 표현의 가능한 지리적 대안 번역입니다.
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: נarrative speech 도입어로서 ‘대답하다’의 관용을 살리되, 한국어에서는 ‘대답하여 말했습니다’가 가장 자연스럽고 문맥상 화법을 유지합니다.
- source_word: הָאִישׁ הַלֵּוִי
  english_pob_choice: the Levite
  chosen_korean: 그 레위 사람
  alternatives_korean:
  - 그 레위인
  - 레위 사람
  lexicon: HALOT
  rationale: 직분/계통을 가리키는 표현이므로 ‘레위 사람’이 직역성과 가독성의 균형이 좋고, 관형사 ‘그’로 화자 식별을 살렸습니다.
- source_word: אִישׁ הָאִשָּׁה הַנִּרְצָחָה
  english_pob_choice: the husband of the woman who had been murdered
  chosen_korean: 그 살해된 여자의 남편
  alternatives_korean:
  - 살해된 그 여자의 남편
  - 그 여인의 남편
  lexicon: HALOT
  rationale: 히브리어의 ‘여자의 남자’ 구조를 관계상 ‘남편’으로 옮겼고, הַנִּרְצָחָה의 수동 분사를 ‘살해된’으로 유지해 강한 폭력성을 살렸습니다.
- source_word: אֲשֶׁר לְבִנְיָמִן
  english_pob_choice: which belongs to Benjamin
  chosen_korean: 베냐민에 속한
  alternatives_korean:
  - 베냐민에 있는
  - 베냐민의
  lexicon: HALOT
  rationale: 영어 POB의 소유/귀속 뉘앙스를 따라 ‘속한’으로 옮겨, 단순한 지리적 위치보다 지파 소속을 분명히 했습니다.
- source_word: וּפִילַגְשִׁי
  english_pob_choice: my concubine
  chosen_korean: 내 첩
  alternatives_korean:
  - 내 소실
  - 내 후궁
  lexicon: HALOT
  rationale: 필라게쉬는 한국어 성서어휘에서 ‘첩’이 가장 직접적이며, 문화적으로 낯설더라도 본문의 사회적 관계를 흐리지 않습니다.
- source_word: לָלוּן
  english_pob_choice: to spend the night
  chosen_korean: 하룻밤 묵으러
  alternatives_korean:
  - 밤을 지내려고
  - 숙박하려고
  lexicon: HALOT
  rationale: לון의 숙박/체류 의미를 현대 한국어로 자연스럽게 풀어 ‘하룻밤 묵으러’로 옮겼습니다.
theological_decisions:
- issue: 레위인의 자기소개 방식
  chosen_reading: 화자의 정체를 ‘그 레위 사람’으로 직접 제시하고, 이어지는 서술은 단순한 사건 보고로 유지했습니다.
  alternative_readings:
  - 레위인
  - 레위 사람 그
  rationale: 본절은 신학적 해설보다 서사적 자기진술이 핵심이므로, 과잉 해석 없이 화자 표지를 유지하는 것이 원문 기능에 맞습니다.
  doctrine_reference: 서사 본문의 화자 식별
