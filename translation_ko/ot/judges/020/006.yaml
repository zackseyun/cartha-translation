revisions:
- from: 그래서 나는 내 첩을 붙잡아[a] 잘라서 조각낸 뒤, 이스라엘의 기업[b]의 모든 지역에 보냈습니다. 그들이 이스라엘 가운데에서 음란함과 망행[c]을 저질렀기 때문입니다.
  to: 그래서 나는 내 첩을 붙잡아[a] 토막 내고, 이스라엘이 기업으로 받은 온 땅에[b] 보냈습니다. 그들이 이스라엘 안에서 음란하고 수치스러운 일을 저질렀기 때문입니다.[c]
  rationale: 현대 표준어의 자연스러움을 높이되, 첩을 붙잡아 조각낸 뒤 이스라엘의 상속지 전역으로 보냈다는 원문의 거친 서술을 완화하지 않았습니다. 또한 נַחֲלָה의 상속·배분 의미와 זִמָּה וּנְבָלָה의 성적·도덕적 수치 및 공동체적 모욕의 의미를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:11:09Z'
