id: JDG.20.6
reference: Judges 20:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אֹחֵ֤ז בְּ/פִֽילַגְשִׁ/י֙ וָֽ/אֲנַתְּחֶ֔/הָ וָֽ/אֲשַׁלְּחֶ֔/הָ בְּ/כָל שְׂדֵ֖ה נַחֲלַ֣ת יִשְׂרָאֵ֑ל כִּ֥י עָשׂ֛וּ זִמָּ֥ה וּ/נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/006.yaml
  text: So I took hold of my concubine and cut her in pieces[a], and sent her throughout all the territory of Israel’s inheritance[c][b], because they committed lewdness and outrage in Israel.
  footnotes:
  - marker: a
    text: Or 'Then I seized my concubine and dismembered her, and sent her throughout every region of Israel’s inheritance.'
    reason: lexical_alternative
  - marker: b
    text: '''Israel’s inheritance'' preserves the covenantal sense of the land allotted to Israel, not merely geography.'
    reason: cultural_note
  - marker: c
    text: '''Lewdness'' may also be rendered ''wickedness'' or ''depravity''; ''outrage'' may also be rendered ''disgraceful act'' or ''vile folly.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 내 첩을 붙잡아[a] 토막 내고, 이스라엘이 기업으로 받은 온 땅에[b] 보냈습니다. 그들이 이스라엘 안에서 음란하고 수치스러운 일을 저질렀기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 첩을 붙들어 조각내어’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘기업으로 받은’은 단순한 영토가 아니라 이스라엘에게 배당된 상속의 몫이라는 뜻을 나타냅니다.
    reason: cultural_note
  - marker: c
    text: ‘음란하고 수치스러운 일’은 ‘음란함과 모욕적인 악행’, 또는 ‘사악함과 수치스러운 짓’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹחֵז
  english_pob_choice: So I took hold of
  chosen_korean: 붙잡아
  alternatives_korean:
  - 잡아
  - 손을 대어
  lexicon: HALOT
  rationale: אחז는 ‘붙잡다, 손에 쥐다’의 뜻이므로, 폭력을 과장하지 않으면서 신체적 행동을 분명히 드러내는 ‘붙잡아’가 적절합니다.
- source_word: וָאֲנַתְּחֶהָ
  english_pob_choice: cut her in pieces
  chosen_korean: 잘라서 조각낸 뒤
  alternatives_korean:
  - 토막내어
  - 조각조각 내어
  lexicon: HALOT
  rationale: נתח는 ‘조각내다, 토막내다’의 의미이므로, 끔찍한 행위를 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: בְּכָל שְׂדֵה נַחֲלַת יִשְׂרָאֵל
  english_pob_choice: throughout all the territory of Israel’s inheritance
  chosen_korean: 이스라엘의 기업의 모든 지역에
  alternatives_korean:
  - 이스라엘의 유업의 온 땅에
  - 이스라엘이 기업으로 받은 모든 땅에
  lexicon: HALOT
  rationale: נחלה는 단순한 지리보다 언약적 분배의 의미를 담으므로, POB의 ‘inheritance’를 따라 ‘기업’으로 두어 그 뉘앙스를 살렸습니다.
- source_word: זִמָּה וּנְבָלָה
  english_pob_choice: lewdness and outrage
  chosen_korean: 음란함과 망행
  alternatives_korean:
  - 음행과 수치
  - 악행과 망신스러운 짓
  lexicon: HALOT
  rationale: זִמָּה와 נְבָלָה는 성적·도덕적 수치와 공동체적 모독을 함께 가리키므로, ‘음란함’과 ‘망행’으로 강한 윤리적 비난을 보존했습니다.
theological_decisions:
- issue: נחלה의 언약적 의미
  chosen_reading: ‘기업’으로 옮겨, 단순한 영토가 아니라 하나님이 이스라엘에게 나누어 주신 몫이라는 뜻을 보존했습니다.
  alternative_readings:
  - ‘땅’으로 단순화할 수 있음
  - ‘유업’으로 옮길 수 있음
  rationale: 본문의 נַחֲלָה는 경계선이 아니라 언약적 상속의 의미를 띠므로, 한국어에서도 그 신학적 층위를 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: זִמָּה וּנְבָלָה의 강한 도덕적 비난
  chosen_reading: ‘음란함과 망행’으로, 단순한 부도덕이 아니라 공동체를 더럽히는 심각한 죄악으로 표현했습니다.
  alternative_readings:
  - ‘악행과 수치’
  - ‘음행과 추악한 일’
  rationale: 두 명사는 본문에서 강한 분노와 수치심을 불러일으키는 표현이므로, 완화하지 않고 현대 한국어로도 무게감 있게 드러내는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
