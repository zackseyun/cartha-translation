  source_fidelity: 원문의 동사 연쇄(붙잡다–조각내다–보내다)와 이유절은 대체로 충실합니다. 다만 ‘이스라엘의 기업의 모든 지역’은 히브리어의 결속 관계를 한국어에서 부자연스럽게 반복하며, ‘망행’은 현대 표준어 성경 문체에서 매우 낯선 말입니다. זִמָּה וּנְבָלָה의 두 겹의 도덕적 비난은 ‘음란하고 수치스러운 일’로 자연스럽고 충분히 유지할 수 있습니다.
  naturalness: ‘잘라서 조각낸 뒤’보다 ‘토막 내고’가 원문의 직접적인 서술과 한국어 흐름에 더 잘 맞습니다. ‘이스라엘이 기업으로 받은 온 땅’은 נַחֲלַת יִשְׂרָאֵל의 상속·배분 의미를 보존하면서도 자연스럽습니다.
  terminology: ‘첩’과 ‘기업’은 적절합니다. ‘기업’은 여기서 현대 경제 용어가 아니라 상속받은 몫이라는 성경적 용례이므로, 본문을 자연스럽게 풀고 각주로 그 의미를 밝혔습니다. ‘망행’은 현대 독자에게 불투명하므로 ‘수치스러운 일’로 고쳤습니다.
