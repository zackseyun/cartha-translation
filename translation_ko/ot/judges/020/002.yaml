  text: וַ/יִּֽתְיַצְּב֞וּ פִּנּ֣וֹת כָּל הָ/עָ֗ם כֹּ֚ל שִׁבְטֵ֣י יִשְׂרָאֵ֔ל בִּ/קְהַ֖ל עַ֣ם הָ/אֱלֹהִ֑ים אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ רַגְלִ֖י שֹׁ֥לֵֽף חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
  footnotes:
  - marker: a
    text: Hebrew literally 'the corners of all the people,' an idiom for the chiefs or leading men.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 백성, 곧 이스라엘의 모든 지파의 지도자들이 하나님의 백성의 회중에 자리를 잡았습니다. 칼을 빼 든 보병 사십만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 백성의 귀퉁이들’이지만, 관용적으로는 지도자나 수장들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  english_pob_choice: took their stand
  chosen_korean: 자리를 잡았습니다
  alternatives_korean:
  - 서 있었습니다
  - 자기 자리를 잡았습니다
  - 전열을 갖추었습니다
  lexicon: HALOT
  rationale: 히트파엘의 ‘자리를 정하고 서다/대오를 갖추다’는 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 군사적 긴장을 유지하는 표현을 택했습니다.
- source_word: פִּנּוֹת כָּל הָעָם
  english_pob_choice: chiefs of all the people
  chosen_korean: 모든 백성의 지도자들
  alternatives_korean:
  - 모든 백성의 우두머리들
  - 모든 백성의 귀퉁이들
  lexicon: HALOT
  rationale: 직역하면 ‘귀퉁이들’이지만 관용적으로 수장의 뜻이므로, 영어 POB의 ‘chiefs’를 따라 지도자들로 옮겼습니다.
- source_word: בִּקְהַל עַם הָאֱלֹהִים
  english_pob_choice: in the assembly of the people of God
  chosen_korean: 하나님의 백성의 회중에서
  alternatives_korean:
  - 하나님의 백성의 모임에서
  - 하나님의 백성의 집회에서
  lexicon: HALOT
  rationale: קהל은 단순 집합보다 ‘회중’이 더 정확하며, עַם הָאֱלֹהִים의 언약적 소속을 그대로 드러냅니다.
- source_word: אִישׁ רַגְלִי שֹׁלֵף חָרֶב
  english_pob_choice: foot soldiers drawing the sword
  chosen_korean: 보병, 곧 칼을 빼 든 자들
  alternatives_korean:
  - 도보로 싸우는 병사들
  - 칼을 뽑고 있는 보병들
  lexicon: HALOT
  rationale: אִישׁ רַגְלִי를 ‘보병’으로 자연스럽게 옮기고, ‘칼을 빼다’로 전투 태세를 간결하게 살렸습니다.
theological_decisions:
- issue: ‘people of God’의 번역어
  chosen_reading: ‘하나님의 백성’으로 번역하되, 집합 장소는 ‘회중’으로 옮겨 언약 공동체의 성격을 드러냈습니다.
  alternative_readings:
  - ‘하나님 백성’
  - ‘하나님의 사람들’
  rationale: 본문은 단순한 군중이 아니라 하나님께 속한 이스라엘의 공식적 집결을 말하므로, 관계성을 분명히 하는 번역이 적절합니다.
  doctrine_reference: covenant identity of Israel
- issue: 수사 표현의 해석
  chosen_reading: 원문의 수효를 그대로 ‘사십만’으로 옮기고, 추가 해설은 넣지 않았습니다.
  alternative_readings:
  - 수치의 상징적 과장으로 풀이
  - 군사력 과시로 완화
  rationale: 수사는 본문이 제시하는 역사적 진술로 읽고, 번역에서는 해석을 가하지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: textual fidelity
