  text: וַ/יַּהֲפֹ֥ךְ אִֽישׁ יִשְׂרָאֵ֖ל בַּ/מִּלְחָמָ֑ה וּ/בִנְיָמִ֡ן הֵחֵל֩ לְ/הַכּ֨וֹת חֲלָלִ֤ים בְּ/אִֽישׁ יִשְׂרָאֵל֙ כִּ/שְׁלֹשִׁ֣ים אִ֔ישׁ כִּ֣י אָמְר֔וּ אַךְ֩ נִגּ֨וֹף נִגָּ֥ף הוּא֙ לְ/פָנֵ֔י/נוּ כַּ/מִּלְחָמָ֖ה הָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
  footnotes:
  - marker: a
    text: Hebrew 'he is utterly defeated' uses a singular form, likely referring to Israel collectively; it could also be rendered 'they are utterly defeated.'
    reason: lexical_alternative
  - marker: b
    text: Or 'began to strike down about thirty men from among the men of Israel.' The Hebrew phrase with 'the slain' is terse and battle-idiomatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 사람들이 전투에서 돌아섰고, 베냐민은 이스라엘 사람들 가운데서 쓰러진 자들을, 약 서른 명을 죽이기 시작했습니다. 그들은 말하기를, “그가 우리 앞에서, 지난번 전투처럼, 확실히 철저히 패하였구나” 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형을 쓰지만, 여기서는 이스라엘 전체를 집합적으로 가리키는 것으로 이해할 수 있으며, 복수로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그는 우리 앞에서 철저히 패하였다’이지만, 전투 문맥에서 ‘완전히/철저히 패하다’의 강조를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  english_pob_choice: turned
  chosen_korean: 돌아섰고
  alternatives_korean:
  - 돌이켰고
  - 전환되었고
  lexicon: HALOT
  rationale: 전투 서술에서 방향 전환과 국면 반전을 함께 드러내는 자연스러운 동사로 옮겼습니다.
- source_word: אִישׁ יִשְׂרָאֵל
  english_pob_choice: the men of Israel
  chosen_korean: 이스라엘 사람들
  alternatives_korean:
  - 이스라엘의 남자들
  - 이스라엘 사람 한 사람 한 사람
  lexicon: HALOT
  rationale: 형태는 단수지만 집합적 군사 집단을 가리키므로, 한국어에서는 자연스러운 집합 명사로 처리했습니다.
- source_word: חֲלָלִים
  english_pob_choice: the slain
  chosen_korean: 쓰러진 자들
  alternatives_korean:
  - 죽은 자들
  - 살해된 자들
  lexicon: HALOT
  rationale: 전투 문맥의 관용적 표현을 살리면서도 한국어에서 어색하지 않도록 ‘쓰러진 자들’로 옮겼습니다.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  english_pob_choice: about thirty men
  chosen_korean: 약 서른 명을
  alternatives_korean:
  - 서른 명가량을
  - 대략 서른 명을
  lexicon: HALOT
  rationale: כ의 대략성을 한국어의 ‘약’으로 반영했습니다.
- source_word: נִגּוֹף נִגָּף הוּא
  english_pob_choice: he is utterly defeated
  chosen_korean: 철저히 패하였구나
  alternatives_korean:
  - 완전히 패하였구나
  - 무참히 패하였구나
  lexicon: HALOT
  rationale: 강조적 중첩을 한국어의 강한 어휘로 살렸고, 주어가 집합적 이스라엘을 가리키는 singular tension은 본문에서 그대로 반영했습니다.
theological_decisions:
- issue: 집합적 단수 주어의 처리
  chosen_reading: “그가 … 철저히 패하였구나”로 단수 표현을 유지하되, 한국어에서는 앞선 집합 명사 ‘이스라엘 사람들’과 함께 읽히도록 구성했습니다.
  alternative_readings:
  - “그들이 … 철저히 패하였구나”로 복수화
  - “이스라엘이 … 패하였구나”로 주어 일반화
  rationale: 히브리어의 단수형은 이스라엘 전체를 집합적으로 가리키는 표현이므로, 단수 긴장을 지우지 않는 쪽을 택했습니다.
  doctrine_reference: 본문 문법 존중과 집합적 표지 유지
- issue: “전투”와 “지난번 전투”의 반복
  chosen_reading: 같은 전투 서술을 두 번 ‘전투’로 옮기되, 두 번째는 ‘지난번 전투’로 구분했습니다.
  alternative_readings:
  - ‘전쟁’으로 바꾸어 반복 완화
  - ‘첫 번째 싸움’으로 더 구어적으로 처리
  rationale: 본문의 비교 구조(‘첫 번째 전투처럼’)를 명확히 드러내기 위해 반복을 보존했습니다.
  doctrine_reference: 서사 반복과 대조 구조 보존
