base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
  footnotes:
  - marker: a
    text: Hebrew 'he is utterly defeated' uses a singular form, likely referring to Israel collectively; it could also be rendered 'they are utterly defeated.'
    reason: lexical_alternative
  - marker: b
    text: Or 'began to strike down about thirty men from among the men of Israel.' The Hebrew phrase with 'the slain' is terse and battle-idiomatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 사람들이 전투 중에 돌아섰고, 베냐민은 이스라엘 사람들 가운데 약 서른 명을 쓰러뜨리기 시작했습니다.[b] 그들은 말했습니다. “이스라엘은[a] 첫 번째 전투 때처럼 우리 앞에서 틀림없이 완전히 패하고 있다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘’을 가리키는 단수형을 사용합니다. 이는 이스라엘 군을 하나의 집합체로 가리키는 것으로 이해할 수 있으며, ‘그들이 틀림없이 완전히 패하고 있다’로 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘이스라엘 사람들 가운데 쓰러진 자들을, 약 서른 명’입니다. 히브리어는 전투에서 쓰러뜨려 죽인 사람들을 가리키는 간결한 관용 표현을 사용합니다. 또는 ‘이스라엘 사람들 가운데 약 서른 명을 쳐 죽이기 시작했습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
