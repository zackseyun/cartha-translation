  text: וַ/יִּקְרְב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֥וֹם הַ/שֵּׁנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
  footnotes:
  - marker: a
    text: Or 'approached' or, in military context, 'advanced against.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel' and 'the sons of Benjamin'; also renderable as 'the Israelites' and 'the Benjaminites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 둘째 날에 베냐민 자손에게 가까이 나아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  english_pob_choice: came near
  chosen_korean: 가까이 나아갔습니다
  alternatives_korean:
  - 다가갔습니다
  - 접근했습니다
  - 진격했습니다
  lexicon: HALOT
  rationale: קרב의 기본 의미인 ‘가까이 오다/나아가다’를 살려, 전투 맥락이더라도 본문이 직접 말하지 않는 ‘공격하다’는 뜻을 과도하게 넣지 않았습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 친족·지파 표현을 한국어 성경 관례에 맞게 ‘자손’으로 옮겨, 집합적 부족 정체성을 유지했습니다.
- source_word: בְנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민 사람들
  - 베냐민 지파
  lexicon: HALOT
  rationale: 앞의 ‘이스라엘 자손’과 대응하는 병렬 구조를 살리기 위해 같은 방식의 친족 표현을 사용했습니다.
- source_word: בַּיּוֹם הַשֵּׁנִי
  english_pob_choice: on the second day
  chosen_korean: 둘째 날에
  alternatives_korean:
  - 두 번째 날에
  - 그 다음 날에
  lexicon: HALOT
  rationale: 히브리어의 서수 표현을 그대로 반영해, 시간 진행을 일반화한 ‘그 다음 날에’보다 원문에 더 가깝게 옮겼습니다.
