source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
  footnotes:
  - marker: a
    text: Or 'all the Israelites and all the people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fellowship offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘의 모든 자손과 모든 백성이 올라가 베델에 이르러, 울고 그곳에서 야훼 앞에 앉아 그날 저녁까지 금식했습니다. 그 후 그들은 야훼 앞에 번제와 화목제를 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 모든 아들들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘화목제’는 ‘평화제’ 또는 ‘교제 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  english_pob_choice: all the sons of Israel and all the people
  chosen_korean: 이스라엘 자손과 모든 백성
  alternatives_korean:
  - 이스라엘의 아들들과 모든 백성
  - 이스라엘 사람들과 모든 백성
  lexicon: WLC / HALOT
  rationale: בני ישראל의 집단적·대표적 표현을 살리되, 한국어에서는 ‘자손’이 성별을 과도하게 드러내지 않으면서도 혈연·언약 공동체의 뉘앙스를 유지합니다. ‘모든 백성’은 뒤의 병렬 표현을 그대로 살렸습니다.
- source_word: בֵית אֵל
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  - 벧-엘
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 ‘베델’로 적었습니다. ‘하나님의 집’으로 풀지 않고 고유 지명을 유지했습니다.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  english_pob_choice: sat there before Yahweh
  chosen_korean: 그곳에서 야훼 앞에 앉아
  alternatives_korean:
  - 그곳에서 야훼 앞에 머물며
  - 그곳에서 야훼 앞에 앉아 머물며
  lexicon: HALOT
  rationale: ישב의 기본 의미인 ‘앉다/머물다’ 가운데, 문맥상 통회와 예배의 몸짓을 함께 드러내는 ‘앉아’를 택했습니다. ‘before Yahweh’는 예배적 대면 관계를 살려 ‘야훼 앞에’로 옮겼습니다.
- source_word: וַיָּצֻמוּ
  english_pob_choice: fasted
  chosen_korean: 금식했습니다
  alternatives_korean:
  - 굶었습니다
  - 먹지 않았습니다
  lexicon: HALOT
  rationale: צום의 표준적 의미를 가장 간결하고 예배 문맥에 맞게 살렸습니다. 한국어 교회 문맥에서도 ‘금식’이 직접적이며 의미가 분명합니다.
- source_word: עֹלוֹת וּשְׁלָמִים
  english_pob_choice: burnt offerings and peace offerings
  chosen_korean: 번제와 화목제
  alternatives_korean:
  - 번제와 화목제물
  - 번제와 평화제
  lexicon: HALOT
  rationale: עֹלוֹת은 제사의 종류를 가리키는 정착된 용어인 ‘번제’가 가장 정확합니다. שְׁלָמִים은 EN POB의 ‘peace offerings’에 대응하되, 한국어 성경 전통과 희생제사 용례를 고려해 ‘화목제’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 Tetragrammaton יְהוָה를 직접 사용하므로, 본 프로젝트의 원칙에 따라 신적 고유명사로서 ‘야훼’를 유지했습니다. 이는 호칭어 ‘주님’으로 대체해 이름성을 흐리는 번역을 피합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 제사 용어 שְׁלָמִים의 번역
  chosen_reading: 화목제
  alternative_readings:
  - 평화제
  - 교제제물
  rationale: 이 항목은 단순한 ‘평화’ 감정보다 제사 제도의 기술적 명칭이 핵심이므로, 한국어 성경 전통에서 널리 쓰이고 제의적 기능을 잘 드러내는 ‘화목제’를 채택했습니다.
  doctrine_reference: 레위기 제사 용어 일관성 원칙
