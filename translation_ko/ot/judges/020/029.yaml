translation:
  language: ko
  text: 이스라엘이 기브아 사방에 매복병을 배치했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘기브아를 향해/주위에 매복자들을 두었다’는 뜻으로, 도시를 둘러싼 매복 배치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: set
  chosen_korean: 배치했습니다
  alternatives_korean:
  - 두었습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: שׂוּם은 ‘두다, 놓다, 배치하다’의 뜻으로, 전투 상황에서 병력을 의도적으로 배치하는 행위를 자연스럽게 드러내기 위해 ‘배치했습니다’를 택했습니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 군대
  lexicon: 고유명사
  rationale: 집합적 주체를 가리키는 고유명사이므로 표준 음역인 ‘이스라엘’을 유지했습니다.
- source_word: אֹרְבִים
  english_pob_choice: men in ambush
  chosen_korean: 매복병
  alternatives_korean:
  - 매복하는 사람들
  - 복병
  lexicon: HALOT
  rationale: אָרַב의 분사형은 ‘매복하는 자들’이라는 인적 의미를 가지므로, 군사적 맥락을 살리면서도 현대 한국어에서 자연스러운 ‘매복병’으로 옮겼습니다.
- source_word: אֶל ... סָבִיב
  english_pob_choice: around
  chosen_korean: 사방에
  alternatives_korean:
  - 주위에
  - 기브아를 둘러
  - 둘레에
  lexicon: HALOT
  rationale: אֶל과 סָבִיב가 결합해 기브아를 둘러싼 배치 상태를 나타내므로, 단순한 ‘toward’보다 주변을 둘러싼 위치를 분명히 하는 ‘사방에’가 더 적절합니다.
theological_decisions:
- issue: 군사 서술의 간결성
  chosen_reading: 이 구절은 하나님에 대한 직접 언급 없이 이스라엘의 전술 배치를 사실적으로 서술합니다.
  alternative_readings:
  - 영적 의미를 덧붙여 해석하는 읽기
  - 전투의 신학적 의도를 본문 밖에서 설명하는 읽기
  rationale: 본문 자체는 전략적 배치 사실을 전달하므로, 의미를 확장하지 않고 서술의 직접성을 유지했습니다.
  doctrine_reference: 서술 본문 존중 원칙
