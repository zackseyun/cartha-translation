translation:
  language: ko
  text: 그러자 이스라엘 사람들[a]이 돌아섰고, 베냐민 사람들은 재앙이 자기들에게 닥친 것을 보고 겁에 질렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘이스라엘의 사람’, ‘베냐민의 사람’, ‘그가 보았다’, ‘그에게’와 같은 단수형 표현을 각 전투 집단 전체를 가리키는 뜻으로 사용합니다. 이 번역은 자연스러운 의미를 위해 복수형으로 옮겼습니다.
    reason: lexical_alternative
