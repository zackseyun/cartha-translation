  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
  footnotes:
  - marker: a
    text: Hebrew singular expressions ('man of Israel,' 'man of Benjamin,' 'he saw,' 'upon him') are used collectively here for the opposing forces; the English renders them as plurals for natural sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 사람들이 돌아섰고, 베냐민 사람들은 겁에 질렸습니다. 그들은 재앙이 자기들에게 닥친 것을 보았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘이스라엘의 남자’, ‘베냐민의 남자’, ‘그가 보았다’, ‘그에게’처럼 단수형을 집합적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  english_pob_choice: Then the men of Israel
  chosen_korean: 이스라엘 사람들이
  alternatives_korean:
  - 이스라엘의 남자들이
  - 이스라엘의 각 사람이
  lexicon: HALOT
  rationale: 전투 서술에서 단수형 אִישׁ이 집합적으로 쓰였으므로, 한국어에서는 자연스러운 복수 표현으로 옮겨 전투 집단을 분명히 했습니다.
- source_word: הָפַךְ
  english_pob_choice: turned
  chosen_korean: 돌아섰고
  alternatives_korean:
  - 돌아섰습니다
  - 되돌아섰고
  - 돌아섰습니다
  lexicon: HALOT
  rationale: 전술적 방향 전환을 나타내므로, 단순한 '돌다'보다 군사적 맥락이 살아 있는 '돌아서다'가 적절합니다.
- source_word: וַיִּבָּהֵל
  english_pob_choice: were terrified
  chosen_korean: 겁에 질렸습니다
  alternatives_korean:
  - 두려워했습니다
  - 당황했습니다
  - 공포에 사로잡혔습니다
  lexicon: HALOT
  rationale: בהל의 급작스러운 공포를 현대 한국어에서 가장 자연스럽게 드러내는 표현으로 '겁에 질리다'를 택했습니다.
- source_word: הָרָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 불행
  - 해악
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 악이 아니라 전쟁에서 닥친 파국이므로, '재앙'이 의미를 가장 정확하게 전달합니다.
theological_decisions:
- issue: 집합적 단수의 처리
  chosen_reading: 히브리어의 단수 표현을 한국어에서는 복수 집단 표현으로 옮겼습니다.
  alternative_readings:
  - '''이스라엘의 각 사람이 돌아섰고…''처럼 단수 성분을 드러내는 번역'
  - 단수형을 그대로 따라 '이스라엘의 남자가 돌아섰고…'라고 번역
  rationale: 문맥이 개인 1인이 아니라 양 진영의 전투 집단을 가리키므로, 독자가 서술 의도를 즉시 이해하도록 집합적 의미를 우선했습니다.
  doctrine_reference: 서사 본문 해석 원칙
