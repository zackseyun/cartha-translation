  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
  footnotes:
  - marker: a
    text: Hebrew 'as at the first,' referring to the earlier battles in this chapter; that is, 'as before' or 'as in the first encounter.'
    reason: cross_reference
  - marker: b
    text: The Hebrew says 'draw him away' with a singular object, likely using a collective singular for Benjamin or its fighting force; some translations render the sense as 'draw them away.'
    reason: lexical_alternative
  - marker: c
    text: Or 'roads' or 'main roads.' The Hebrew term can refer to built-up roads or highways.
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민 자손이 말했습니다. 「그들은 우리 앞에서, 처음 때와 같이, 쓰러지고 있습니다.」 그러나 이스라엘 자손이 말했습니다. 「우리가 도망하여 그들을 성에서 길들로 끌어내리자.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '처음 때와 같이'는 이 장 앞부분의 이전 전투들을 가리키는 말로, '이전처럼'이라는 뜻입니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 목적어를 단수형으로 두지만, 문맥상 베냐민 진영 전체를 가리키는 집합적 단수로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 '길들' 또는 '큰길들'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  english_pob_choice: are being struck down
  chosen_korean: 쓰러지고 있습니다
  alternatives_korean:
  - 패하고 있습니다
  - 꺾이고 있습니다
  - 쳐맞고 있습니다
  lexicon: HALOT
  rationale: 전투 맥락의 수동적 의미를 살리면서, 현대 한국어에서 자연스럽고 직접적인 군사적 패배 이미지를 전달합니다.
- source_word: כְּבָרִאשֹׁנָה
  english_pob_choice: as at the first
  chosen_korean: 처음 때와 같이
  alternatives_korean:
  - 처음과 같이
  - 전과 같이
  - 첫 번째 싸움처럼
  lexicon: HALOT
  rationale: 앞선 두 차례의 교전을 가리키는 비교구를 과도하게 풀지 않고, 한국어로는 시간적 비교가 분명한 표현으로 옮겼습니다.
- source_word: וּנְתַקְּנֻהוּ
  english_pob_choice: and draw him away
  chosen_korean: 그들을 … 끌어내리자
  alternatives_korean:
  - 그를 끌어내리자
  - 그들을 끌어내자
  - 그를 유인해 내자
  lexicon: HALOT
  rationale: 히브리어 동사는 '떼어 내다/끌어내다'의 뉘앙스를 가지므로, 전략적 함정을 나타내는 '끌어내리다'로 옮겼습니다. 영어 POB의 단수 목적어는 본문 오디트의 변이 지점을 보여 주므로 한국어는 문맥상의 집합적 복수로 자연화했습니다.
- source_word: הַמְסִלּוֹת
  english_pob_choice: the highways
  chosen_korean: 길들
  alternatives_korean:
  - 대로로
  - 도로로
  - 큰길로
  lexicon: HALOT
  rationale: 기술적으로는 '고속도로'보다 고대적 도로망을 가리키므로, 현대 독자가 이해할 수 있으면서도 본문의 일반적 길/도로 의미를 보존하는 '길들'을 택했습니다.
