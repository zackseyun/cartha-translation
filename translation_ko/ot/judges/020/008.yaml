  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: ko
  text: 그러자 모든 백성이 한 사람처럼 일어나 말했습니다. “우리 중 아무도 자기 장막으로 가지 않을 것이며, 우리 중 아무도 자기 집으로 돌아서지 않을 것입니다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘한 사람처럼’입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּקָם כָּל הָעָם
  english_pob_choice: Then all the people rose up
  chosen_korean: 그러자 모든 백성이 … 일어나
  alternatives_korean:
  - 온 백성이 일어나
  - 모든 백성이 일어나
  lexicon: וַיָּקָם / קוּם
  rationale: 서사 진행을 나타내는 וַ 를 자연스럽게 ‘그러자’로 풀고, קוּם은 문자적으로 ‘일어나다’로 옮겨 집단적 결의의 동작을 살렸습니다.
- source_word: כְּאִישׁ אֶחָד
  english_pob_choice: as one man
  chosen_korean: 한 사람처럼
  alternatives_korean:
  - 한 사람으로
  - 한마음으로
  lexicon: כְּ + אִישׁ אֶחָד
  rationale: 직역적 대응을 유지하되 한국어에서 자연스러운 집단 일치 표현으로 ‘한 사람처럼’을 사용했습니다.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  english_pob_choice: Not one of us will go to his tent
  chosen_korean: 우리 중 아무도 자기 장막으로 가지 않을 것이며
  alternatives_korean:
  - 우리 가운데 아무도 자기 장막으로 가지 않을 것이며
  - 아무도 자기 천막으로 돌아가지 않을 것이며
  lexicon: אִישׁ + לֹא נֵלֵךְ
  rationale: לֹא + 1인칭 복수 동사의 부정 강조를 ‘우리 중 아무도’로 살려, 영어 POB의 ‘Not one of us’를 반영했습니다.
- source_word: לֹא נָסוּר אִישׁ לְבֵיתוֹ
  english_pob_choice: not one of us will turn aside to his house
  chosen_korean: 우리 중 아무도 자기 집으로 돌아서지 않을 것입니다
  alternatives_korean:
  - 우리 중 아무도 자기 집으로 가지 않을 것입니다
  - 우리 중 아무도 자기 집으로 들르지 않을 것입니다
  lexicon: נָסוּר / בַּיִת
  rationale: נָסוּר는 단순 이동보다 ‘돌아서다/벗어나다’의 뉘앙스가 있어 ‘돌아서지 않다’로 옮겼고, ‘집’은 일반적 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 집단적 서약의 강조
  chosen_reading: ‘한 사람처럼’과 ‘우리 중 아무도’로 공동체의 전면적 결의를 분명히 드러냈습니다.
  alternative_readings:
  - ‘모두 한마음으로’
  - ‘아무도 … 하지 않을 것이다’
  rationale: 히브리어의 강한 총체적 부정과 집단 결속을 흐리지 않기 위해, 개인적 의사보다 공동체적 서약의 톤을 유지했습니다.
  doctrine_reference: 서사 문맥의 공동체 결의 강조
