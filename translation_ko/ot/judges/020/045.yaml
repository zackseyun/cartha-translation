base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
  footnotes:
  - marker: a
    text: Hebrew literally, 'they gleaned him'—an idiom here for cutting down or picking off the fleeing survivors.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses singular suffixes in places ('after him,' 'from him') for a collective referent, referring to the fleeing Benjaminites as a group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들은 돌아서서 광야 쪽, 곧 림몬 바위로 달아났습니다. 그들은 큰길에서 그들 가운데 오천 명을 베어 쓰러뜨렸고[a], 기돔까지 그들을 추격하여[b] 그들 가운데 이천 명을 쳐죽였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그를 이삭 줍듯 하였다’라는 표현을 사용합니다. 여기서는 도주하는 생존자들을 남김없이 차례로 베어 쓰러뜨리는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 집단을 가리키면서도 ‘그를 뒤따라’, ‘그에게서’처럼 단수 접미사를 사용합니다. 여기서는 도주하는 베냐민 사람들을 하나의 집단으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  english_pob_choice: they turned
  chosen_korean: 돌아서서
  alternatives_korean:
