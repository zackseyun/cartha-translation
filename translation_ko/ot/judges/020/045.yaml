base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
  footnotes:
  - marker: a
    text: Hebrew literally, 'they gleaned him'—an idiom here for cutting down or picking off the fleeing survivors.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses singular suffixes in places ('after him,' 'from him') for a collective referent, referring to the fleeing Benjaminites as a group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 돌아서서 광야를 향해, 림몬의 바위로 도망쳤습니다. 그리하여 그들은 큰길들에서 그들 가운데 오천 명을 베어 쓰러뜨렸고, 기돔까지 그들을 추격하여 그들 가운데 이천 명을 쳐죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들을 깎아냈다/주워 모았다’에 가까운 관용구를 사용하며, 여기서는 도주하는 생존자들을 차례로 베어 쓰러뜨리는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 집단을 가리키면서도 ‘그에게서/그를 뒤따라’처럼 단수 접미를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  english_pob_choice: they turned
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아섰습니다
  - 방향을 틀었습니다
  lexicon: HALOT
  rationale: 전투 도주 문맥에서 פנה의 방향 전환을 자연스럽게 살리되, 단순한 심리적 전환이 아니라 실제 이동 방향의 변경을 드러내기 위해 ‘돌아서서’로 옮겼습니다.
- source_word: וַיָּנֻסוּ הַמִּדְבָּרָה
  english_pob_choice: fled toward the wilderness
  chosen_korean: 광야를 향해 … 도망쳤습니다
  alternatives_korean:
  - 광야로 도망쳤습니다
  - 광야로 달아났습니다
  lexicon: HALOT
  rationale: נוס의 군사적 도주 의미를 ‘도망쳤습니다’로 옮기고, הַמִּדְבָּרָה의 방향성은 ‘향해’로 반영했습니다.
- source_word: אֶל סֶלַע הָרִמּוֹן
  english_pob_choice: to the rock of Rimmon
  chosen_korean: 림몬의 바위로
  alternatives_korean:
  - 림몬 바위로
  - 림몬 바위까지
  lexicon: HALOT
  rationale: סֶלַע를 ‘바위’로 직역하고 고유명과의 관계는 한국어 소유격으로 풀어, 장소명과 일반 명사의 의미를 함께 보존했습니다.
- source_word: וַיְעֹלְלֻהוּ
  english_pob_choice: they cut down
  chosen_korean: 베어 쓰러뜨렸고
  alternatives_korean:
  - 도륙했고
  - 죽였고
  - 잘라냈고
  lexicon: HALOT
  rationale: 이 동사는 문자적으로는 ‘따다/추수하다’ 계열의 어감이 있으나 여기서는 도주자들을 가차 없이 도륙하는 관용적 용법이므로, 과도한 비유를 피하면서 전투 행위를 살리는 ‘베어 쓰러뜨리다’로 옮겼습니다.
- source_word: בַּמְסִלּוֹת
  english_pob_choice: on the highways
  chosen_korean: 큰길들에서
  alternatives_korean:
  - 대로들에서
  - 도로들에서
  lexicon: HALOT
  rationale: מְסִלּוֹת는 높은 길, 주된 통행로를 가리키므로 현대 독자가 이해하기 쉬운 ‘큰길들’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 집합 단수 대명사와 복수 행위 주어의 처리
  chosen_reading: ‘그들 가운데’로 옮겨, 원문의 단수 접미가 집합적 집단을 가리킨다는 점을 한국어에서 자연스럽게 풀었습니다.
  alternative_readings:
  - ‘그에게서’
  - ‘그에게서 나온’
  rationale: מִמֶּנּוּ와 אַחֲרָיו의 단수형은 베냐민 사람들을 하나의 집단으로 보는 히브리어 용법이므로, 한국어에서는 오해 없이 집합적 의미를 살리는 방식이 필요합니다.
  doctrine_reference: 서사 본문에서의 집합 명사/대명사 용법
- issue: ‘추격하다’의 강도 표현
  chosen_reading: 동사 자체를 ‘추격하여’로 옮기고, 원문에 없는 부사적 강도 표현은 넣지 않았습니다.
  alternative_readings:
  - ‘거세게 추격하여’
  - ‘바싹 추격하여’
  rationale: 표준 본문에는 단순 추격 동작만 있으므로, 강도 부사는 주석적 설명에 맡기고 본문은 원문 범위 안에서 유지했습니다.
  doctrine_reference: 원문 충실성
