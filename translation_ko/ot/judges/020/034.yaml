  - severity: medium
    issue: 임박한 재앙 표현의 부자연스러운 지시와 상
    rationale: ‘재앙이 자기에게 임할 줄’은 복수 대상에 단수 재귀 표현을 사용해 어색하며, 히브리어 여성 단수 분사의 진행적 ‘닥쳐오고 있었다/미치고 있었다’는 뉘앙스를 충분히 반영하지 못합니다.
