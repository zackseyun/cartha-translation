- from: 이스라엘 모든 자손 중에서 택한 일만 명이 기브아 앞으로부터 와서 싸우매 싸움이 심하였으나 그들이 재앙이 자기에게 임할 줄을 알지 못하였더라
  to: 온 이스라엘에서 뽑힌 만 명이 기브아 맞은편으로 나아왔고, 전투는 치열했으나, 그들은 재앙이 자기들에게 닥쳐오고 있는 것을 알지 못하였습니다.[a]
  rationale: 공간 관계를 ‘기브아 맞은편’으로 바로잡고, 원문에 없는 ‘싸우다’를 제거했습니다. 이어지는 전투의 격렬함과 그들에게 다가오는 재앙을 현대 한국어 합쇼체로 명료하게 옮겼습니다. 히브리어 대명사의 문맥상 지시 대상은 별도로 특정하지 않고 ‘그들’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:40Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘기브아 앞으로부터 와서 싸우매’는 מִנֶּגֶד לַגִּבְעָה(기브아 맞은편/기브아를 마주하여)의 공간적 표현을 ‘앞으로부터’로 부정확하게 옮기며, 본문에 없는 ‘싸우매’를 덧붙입니다. 또한 נֹגַעַת עֲלֵיהֶם הָרָעָה는 재앙이 그들에게 닥쳐오거나 미치고 있다는 뜻인데, ‘자기에게 임할 줄’은 수와 지시 관계가 어색하고 진행성을 약화합니다.
  naturalness: ‘온 이스라엘에서 뽑힌’과 ‘기브아 맞은편으로 나아왔고’는 현대 표준어 문어체에서 자연스럽습니다. ‘전투는 치열했으나’는 כָּבֵדָה의 전쟁 문맥상 강도를 잘 전달합니다.
  terminology: ‘기브아’, ‘이스라엘’, ‘재앙’은 적절합니다. בָּחוּר는 여기서 단순히 젊은이가 아니라 선발된 정예 병사를 가리키므로 ‘뽑힌’으로 옮깁니다.
