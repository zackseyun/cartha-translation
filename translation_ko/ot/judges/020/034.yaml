  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: ko
  text: 온 이스라엘에서 뽑힌 만 명이 기브아 맞은편으로 나아왔고, 전투는 치열했으나, 그들은 재앙이 자기들에게 닥쳐오고 있는 것을 알지 못하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “재앙이 자기들에게 미치고 있는 것을.” 히브리어는 문자적으로 ‘그들에게 재앙이 닿고/미치고 있었다’라고 말합니다.
    reason: נֹגַעַת עֲלֵיהֶם הָרָעָה의 문자적 ‘닿다/미치다’와 문맥상 닥쳐오는 재앙이라는 표현 사이의 어휘적 선택을 밝혀 줍니다.
