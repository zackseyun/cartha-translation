revisions:
- from: 그때 이스라엘 자손은 올라가 야훼 앞에서 저녁까지 울었으며, 야훼께 여쭈어 말했습니다. 「우리가 계속해서 베냐민 자손, 내 형제와 전쟁하러 나아가야 합니까?」 그러자 야훼께서 말씀하셨습니다. 「올라가 그에게 맞서라.」[a]
  to: 그때 이스라엘 자손들이 올라가 야훼 앞에서 저녁까지 울었으며, 야훼께 이렇게 여쭈었습니다. 「제가 계속해서 베냐민 자손인 제 형제와 싸우러 나아가야 합니까?」[a] 그러자 야훼께서 말씀하셨습니다. 「올라가 그에게 맞서십시오.」
  rationale: 원문의 1인칭 단수 질문과 베냐민을 단수로 가리키는 하나님의 응답을 보존했습니다. 전투 문맥은 ‘싸우러’로 드러내되, עִם의 기본적인 ‘~와’ 표현은 본문에 유지했습니다. 각주를 질문 바로 뒤로 이동하고, 각주 속 인칭도 원문에 맞게 단수로 수정했습니다.
  reviewer_model: gpt-5.6-terra
