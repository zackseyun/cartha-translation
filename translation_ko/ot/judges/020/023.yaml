base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
  footnotes:
  - marker: a
    text: Or, “Shall I again approach for battle against the sons of Benjamin, my brother?” The Hebrew can express either continuing or repeating the attack, and עִם may be understood adversatively in this battle context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 자손들이 올라가 야훼 앞에서 저녁까지 울었으며, 야훼께 이렇게 여쭈었습니다. 「제가 계속해서 베냐민 자손인 제 형제와 싸우러 나아가야 합니까?」[a] 그러자 야훼께서 말씀하셨습니다. 「올라가 그에게 맞서십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 베냐민 자손인 제 형제를 상대로 다시 싸우러 나아가야 합니까?” 히브리어는 ‘계속하다’와 ‘다시 하다’의 뜻을 모두 열어 두며, עִם은 전투 문맥에서 ‘상대로/맞서’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 집단적·가계적 표현을 살리되, 한국어에서는 자연스럽고 성경적 관용이 있는 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וַיַּעֲל֣וּ
  english_pob_choice: went up
  chosen_korean: 올라가
  alternatives_korean:
  - 올라갔고
  - 올라와
  lexicon: HALOT
  rationale: עלה의 기본 방향성을 살려 ‘올라가’로 옮겼고, 이어지는 문맥에서도 예배/조언 구하러의 이동이라는 뉘앙스를 유지했습니다.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  english_pob_choice: they inquired of the LORD
  chosen_korean: 야훼께 여쭈어
  alternatives_korean:
  - 야훼께 물어
  - 야훼께 문의하여
  lexicon: HALOT
  rationale: אָרַב/שׁאל의 신탁적 ‘문의’ 의미를 한국어의 존대형 종교적 표현 ‘여쭈다’로 자연스럽게 옮겼습니다.
- source_word: הַאוֹסִיף לָגֶשֶׁת
  english_pob_choice: Shall I continue to go near
  chosen_korean: 계속해서 … 나아가야 합니까
  alternatives_korean:
  - 다시 … 가까이 가야 합니까
  - 계속 … 접근해야 합니까
  lexicon: HALOT
  rationale: 히브리어의 ‘더하다/계속하다’와 ‘가까이 가다’의 결합을 한국어에서 가장 자연스럽게 재현하면서, 전투 진입의 점진성을 보존했습니다.
- source_word: עִם בְּנֵ֥י בִנְיָמִ֖ן
  english_pob_choice: with the sons of Benjamin
  chosen_korean: 베냐민 자손, 내 형제와
  alternatives_korean:
  - 베냐민 자손과
  - 베냐민 자손을 향해
  lexicon: HALOT
  rationale: עִם의 기본 전치사 의미를 살려 ‘와’로 두되, 전투 문맥상 상호 대립이 드러나도록 전체 문맥에서 ‘전쟁하러’와 함께 읽히게 했습니다.
- source_word: עֲלוּ אֵלָיו
  english_pob_choice: Go up against him
  chosen_korean: 올라가 그에게 맞서라
  alternatives_korean:
  - 올라가 그를 치라
  - 올라가 그에게 대항하라
  lexicon: HALOT
  rationale: מַעֲלֶה/עלה의 군사적 관용을 유지하면서도, 영어 POB의 대립적 의미를 한국어 동사 ‘맞서다’로 분명하게 표현했습니다.
theological_decisions:
- issue: 야훼의 직접 화법을 한국어에서 어떻게 처리할지
  chosen_reading: 명령문을 직설적 명령형으로 옮겨 하나님의 응답의 권위를 드러냈습니다.
  alternative_readings:
  - 완곡한 권고형으로 완화
  - ‘가라’ 수준의 일반 명령으로 축소
  rationale: 본문은 단순한 조언이 아니라 전투에 대한 신탁적 응답이므로, 권위와 긴박성을 살린 직설적 명령형이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
