  - marker: b
    text: The clause 'for the ark of the covenant of God was there in those days' explains the setting of their inquiry.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손이 야훼께 물었습니다. — 하나님의 언약궤가 거기에 있었기 때문입니다 —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들이 야훼께 물었습니다.’ 히브리어는 문자적으로 ‘이스라엘의 자손들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 언약궤가 거기에 있었기 때문입니다’는 그들이 묻던 자리의 상황을 설명하는 절입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  english_pob_choice: inquired
  chosen_korean: 물었습니다
  alternatives_korean:
  - 물어보았습니다
  - 여쭈었습니다
  - 문의했습니다
  lexicon: HALOT
  rationale: 이 문맥의 שׁאל + ב는 단순 질문이 아니라 하나님께 뜻을 묻는 종교적 ‘문의’이므로, 한국어에서는 자연스럽고 격식 있는 ‘물었습니다’로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어 직역 구조를 살리면서도 한국어 성경에서 널리 이해되는 집단명이라 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: יהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 도구 규정에 따라 신명은 대체 칭호가 아니라 고유명사 ‘야훼’로 옮겨, 본문의 직접적인 신명 사용을 드러냈습니다.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  english_pob_choice: the ark of the covenant of God
  chosen_korean: 하나님의 언약궤
  alternatives_korean:
  - 언약의 궤
  - 하나님의 언약의 궤
  lexicon: HALOT
  rationale: ‘언약궤’는 한국어에서 관용적이면서도 מקור문 구조를 충분히 반영합니다. ‘하나님의’는 소유격 관계를 간명하게 드러냅니다.
- source_word: וְשָׁם ... בַּיָּמִים הָהֵם
  english_pob_choice: for ... was there in those days
  chosen_korean: — 하나님의 언약궤가 거기에 있었기 때문입니다 —
  alternatives_korean:
  - — 그때 거기에 하나님의 언약궤가 있었기 때문입니다 —
  - — 그곳에 하나님의 언약궤가 있었기 때문입니다 —
  lexicon: HALOT
  rationale: 접속사와 장소부사는 본문의 설명적 삽입구이므로, ‘때문입니다’로 원문의 설명 기능을 드러내고 대시로 괄호적 성격을 표시했습니다.
theological_decisions:
- issue: 야훼께 ‘물었다’는 표현의 종교적 의미
  chosen_reading: 이 동사는 단순한 질문이 아니라 신적 인도를 구하는 행위로 이해합니다.
  alternative_readings:
  - 일반적인 질문으로 읽기
  - ‘문의하다’로 더 기술적으로 옮기기
  rationale: 사사기의 이 관용구는 하나님께 판결이나 지시를 구하는 맥락이므로, 한국어에서도 신앙적·의례적 의미가 살아 있어야 합니다.
  doctrine_reference: Narrative usage of שׁאל + divine name in Judges
