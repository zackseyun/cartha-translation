  lexicon: HALOT
  rationale: 전투 맥락에서 נִגַּף의 수동 의미를 자연스럽게 살리되, “보다”의 서술적 긴박감을 유지했습니다.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  english_pob_choice: had given place to Benjamin
  chosen_korean: 베냐민에게 자리를 내주었는데
  alternatives_korean:
  - 베냐민에게 자리를 주었는데
  - 베냐민에게 물러섰는데
  lexicon: HALOT
  rationale: מָקוֹם의 핵심인 ‘자리/공간’을 살려 직역성을 유지하면서, 전투에서 의도적으로 물러나는 관용적 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: אֶל הָאֹרֵב
  english_pob_choice: in the ambush
  chosen_korean: 기브아를 향해 놓은 매복
  alternatives_korean:
  - 기브아에 놓은 매복
  - 기브아를 상대로 놓은 매복
  lexicon: HALOT
  rationale: אֶל의 방향성을 살려 매복이 기브아를 향한 작전이었음을 드러냈고, 오ֹרֵב은 ‘매복’으로 옮겨 본문 흐름을 간결하게 했습니다.
theological_decisions:
- issue: 전투 서술에서 יִתְּנוּ מָקוֹם의 의미를 어떻게 드러낼지
  chosen_reading: 이스라엘이 베냐민에게 의도적으로 공간을 내주어 끌어내는 전술적 후퇴로 읽었습니다.
  alternative_readings:
  - 단순히 ‘길을 열어 주었다’고 읽기
  - 그냥 ‘물러섰다’고 평이하게 읽기
  rationale: 문맥상 이는 패배가 아니라 유인 전술이므로, ‘자리를 내주다’로 번역해 원문의 전술적 의도를 보존했습니다.
  doctrine_reference: 본문의 서사적 의도와 전쟁 서술의 맥락
