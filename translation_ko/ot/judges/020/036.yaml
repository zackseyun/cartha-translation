  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
  footnotes:
  - marker: a
    text: Or 'relied on the ambush force that they had stationed at Gibeah.' The Hebrew אֹרֵב can refer either to the ambush itself or to those lying in wait.
    reason: lexical_alternative
  - marker: b
    text: Or 'gave place to Benjamin.' The Hebrew idiom means that Israel deliberately yielded space or retreated to draw Benjamin out.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 베냐민 자손은 자기들이 패배한 것을 보았습니다. 이스라엘 사람들은 베냐민에게 자리를 내주었는데, 이는 그들이 기브아를 향해 놓은 매복을 믿었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֹרֵב은 ‘매복’ 자체를 가리킬 수도 있고, 그 자리에 배치된 매복 부대를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘베냐민에게 자리를 내주었다’입니다. 이는 이스라엘이 일부러 공간을 내주며 후퇴해 베냐민을 끌어내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민 사람들
  - 베냐민인들
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 살려 “자손”으로 옮기면 원문 구조가 더 직접적으로 드러납니다.
- source_word: נִגָּפוּ
  english_pob_choice: they were defeated
  chosen_korean: 패배한 것을 보았습니다
  alternatives_korean:
  - 패배한 것을 알았습니다
  - 쳐부서진 것을 보았습니다
  lexicon: HALOT
  rationale: 전투 맥락에서 נִגַּף의 수동 의미를 자연스럽게 살리되, “보다”의 서술적 긴박감을 유지했습니다.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  english_pob_choice: had given place to Benjamin
  chosen_korean: 베냐민에게 자리를 내주었는데
  alternatives_korean:
  - 베냐민에게 자리를 주었는데
  - 베냐민에게 물러섰는데
  lexicon: HALOT
  rationale: מָקוֹם의 핵심인 ‘자리/공간’을 살려 직역성을 유지하면서, 전투에서 의도적으로 물러나는 관용적 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: אֶל הָאֹרֵב
  english_pob_choice: in the ambush
  chosen_korean: 기브아를 향해 놓은 매복
  alternatives_korean:
  - 기브아에 놓은 매복
  - 기브아를 상대로 놓은 매복
  lexicon: HALOT
  rationale: אֶל의 방향성을 살려 매복이 기브아를 향한 작전이었음을 드러냈고, 오ֹרֵב은 ‘매복’으로 옮겨 본문 흐름을 간결하게 했습니다.
theological_decisions:
- issue: 전투 서술에서 יִתְּנוּ מָקוֹם의 의미를 어떻게 드러낼지
  chosen_reading: 이스라엘이 베냐민에게 의도적으로 공간을 내주어 끌어내는 전술적 후퇴로 읽었습니다.
  alternative_readings:
  - 단순히 ‘길을 열어 주었다’고 읽기
  - 그냥 ‘물러섰다’고 평이하게 읽기
  rationale: 문맥상 이는 패배가 아니라 유인 전술이므로, ‘자리를 내주다’로 번역해 원문의 전술적 의도를 보존했습니다.
  doctrine_reference: 본문의 서사적 의도와 전쟁 서술의 맥락
