revisions:
- from: 그러자 베냐민 자손은 자기들이 패배한 것을 보았습니다. 이스라엘 사람들은 베냐민에게 자리를 내주었는데, 이는 그들이 기브아를 향해 놓은 매복을 믿었기 때문입니다.[a][b]
  to: 그러자 베냐민 자손은 자기들이 패배한 것을 보았습니다. 이스라엘 사람들은 베냐민에게 자리를 내주었는데[a], 이는 그들이 기브아를 겨냥해 세워 둔 매복에 의지하고 있었기 때문입니다.[b]
  rationale: 전술적 양보를 뜻하는 ‘자리를 내주다’는 유지했습니다. בָטְחוּ를 ‘의지하고 있었다’로 다듬고, 매복의 기브아를 향한 방향성을 ‘기브아를 겨냥해’로 표현했습니다. 또한 두 각주를 각각의 해당 어구에 직접 연결하도록 표지 위치와 각주 순서를 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:38Z'
