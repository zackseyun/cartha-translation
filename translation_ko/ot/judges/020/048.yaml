revisions:
- from: 이스라엘 사람들이 베냐민 자손에게로 돌아와 칼날로 그들을 쳐서 성에서 가축에 이르기까지 발견된 모든 자를 죽였고 발견된 모든 성을 불사르니라.
  to: 이스라엘 사람들이 돌아서서 베냐민 자손을 칼날로 쳤습니다. 성읍의 사람들부터[a] 가축까지, 곧 발견되는 모든 것을 쳤습니다. 또 그들이 찾아낸 모든 성읍을 불살랐습니다.
  rationale: 적대적 방향을 자연스러운 한국어 목적어 구문으로 고치고, ‘치다’를 유지하여 원문의 동사 의미를 과도하게 좁히지 않았습니다. 난해한 ‘성읍에서, 메톰’은 문맥상 ‘성읍의 사람들’로 최소 해석하되 각주에서 불확실성을 명시했습니다. ‘발견되는 모든 것’으로 옮겨 가축을 포함한 포괄 범위를 보존했으며, 두 번째 ‘발견된 성읍들’은 ‘찾아낸 모든 성읍’으로 자연스럽게 번역했습니다.
  reviewer_model: gpt-5.6-terra
