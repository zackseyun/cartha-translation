    text: 히브리어 ‘성읍에서, 메톰(מְתֹם)’은 해석하기 어렵습니다. 이 표현은 성읍의 주민 전체를 가리키는 것으로 보이지만, 정확한 구문과 의미에는 불확실성이 있습니다.
    reason: lexical_alternative
