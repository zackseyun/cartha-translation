source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
  footnotes:
  - marker: a
    text: Or, 'They planned to kill me.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'they raped my concubine.' The Hebrew verb can denote severe humiliation or violation; here the context indicates sexual assault.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 기브아의 남자들[a]이 나를 대적하여 일어나 밤에 집을 에워쌌습니다. 그들은 나를 죽이려고 하였고, 내 첩[b]을 능욕했으며, 그녀는 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘기브아 사람들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그들은 내 첩을 강간하였다’입니다. 히브리어 동사는 심한 굴욕이나 폭력을 뜻할 수 있으며, 여기서는 문맥상 성적 폭력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  english_pob_choice: the men of Gibeah
  chosen_korean: 기브아 사람들
  alternatives_korean:
  - 기브아의 남자들
  - 기브아의 주민들
  - 기브아의 주인들
  lexicon: HALOT
  rationale: בַּעַל의 직역인 ‘주인들’은 문맥에 맞지 않으며, 영어 POB의 ‘the men of Gibeah’처럼 여기서는 도시의 남성 주민들을 가리키는 관용적 표현으로 읽는 것이 자연합니다.
- source_word: וַיָּקֻמוּ עָלַי
  english_pob_choice: rose up against me
  chosen_korean: 나에게 일어나 맞섰고
  alternatives_korean:
  - 나에게 일어나 대항했고
  - 나를 공격했고
  - 나에게 맞섰고
  lexicon: HALOT
  rationale: קום על의 적대적 관용을 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘일어나 맞서다’로 옮겼습니다.
- source_word: פִּילַגְשִׁי
  english_pob_choice: my concubine
  chosen_korean: 내 첩
  alternatives_korean:
  - 내 후궁
  - 내 부인
  - 내 첩녀
  lexicon: HALOT
  rationale: פילגש의 사회적 지위를 가리키는 표준 대응으로 ‘첩’이 가장 정확하며, 과도한 완곡어나 설명적 번역은 피했습니다.
- source_word: עִנּוּ
  english_pob_choice: violated
  chosen_korean: 능욕하였으며
  alternatives_korean:
  - 강간하였으며
  - 학대하였으며
  - 모욕하였으며
  lexicon: HALOT
  rationale: ענה의 여기서의 뜻은 성적 폭력과 수치심을 함께 포함하는 ‘가혹한 훼손’입니다. 영어 POB의 ‘violated’처럼 직접적이되, 서술어의 무게를 유지하는 ‘능욕하다’를 택했습니다.
theological_decisions:
- issue: 성적 폭력의 표현 수위
  chosen_reading: ‘능욕하였으며’로 번역해 본문이 말하는 폭력성과 수치를 분명히 드러내되, 원문의 의미를 넘어서는 해설적 확정어는 덧붙이지 않았습니다.
  alternative_readings:
  - ‘강간하였으며’
  - ‘학대하였으며’
  rationale: 히브리어 ענה는 문맥상 성적 폭력을 가리키지만, 어휘 자체가 항상 한 단어로만 고정되지는 않으므로, 번역문에서는 본문이 분명히 말하는 폭력의 실상을 드러내면서도 과도한 현대적 단정은 피했습니다.
  doctrine_reference: 본문 해석의 신중성 및 성폭력 관련 서술의 번역 윤리
