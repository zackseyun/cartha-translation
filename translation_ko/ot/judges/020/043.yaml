source:
  edition: WLC
  text: כִּתְּר֤וּ אֶת בִּנְיָמִן֙ הִרְדִיפֻ֔/הוּ מְנוּחָ֖ה הִדְרִיכֻ֑/הוּ עַ֛ד נֹ֥כַח הַ/גִּבְעָ֖ה מִ/מִּזְרַח שָֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
  footnotes:
  - marker: a
    text: Or 'pursued him from Menuchah,' if מְנוּחָה is taken as a place name rather than adverbially.
    reason: alternative_reading
  - marker: b
    text: Or 'drove him along' for 'trampled him down'; the Hebrew verb can carry either a forceful treading sense or a causative movement sense in this context.
    reason: lexical_alternative
  - marker: c
    text: Literally 'from the east of the sun,' that is, 'eastward' or 'on the east side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 베냐민을 에워싸고, 그를 쉬지 못하게 추격하여, 기브아 맞은편 동쪽까지 그를 짓밟았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메누하에서 그를 추격하여.’ 히브리어 메누하(מְנוּחָה)는 ‘쉼’이라는 뜻으로 추격이 쉼 없이 계속되었음을 나타낼 수 있으나, 지명으로 이해되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּתְּרוּ אֶת בִּנְיָמִן
  english_pob_choice: They surrounded Benjamin
  chosen_korean: 그들은 베냐민을 에워싸고
  alternatives_korean:
  - 그들은 베냐민을 포위하고
  - 그들은 베냐민을 둘러싸고
  lexicon: HALOT
  rationale: כִּתְּרוּ는 군사적으로 ‘둘러싸다/에워싸다’의 뜻이므로, ‘에워싸고’로 자연스럽게 옮기되 집단명사로 쓰인 ‘베냐민’을 그대로 살렸습니다.
- source_word: הִרְדִיפֻהוּ
  english_pob_choice: pursued him
  chosen_korean: 그를 뒤쫓아
  alternatives_korean:
  - 그를 추격하여
  - 그를 쫓아
  lexicon: HALOT
  rationale: רָדַף는 전투 맥락에서 ‘추격하다/뒤쫓다’의 뜻이므로, 문맥의 긴박함을 살리는 ‘뒤쫓아’를 택했습니다.
- source_word: מְנוּחָה
  english_pob_choice: relentlessly
  chosen_korean: 뒤쫓아
  alternatives_korean:
  - 쉬지 않고 뒤쫓아
  - 안식 없이
  lexicon: HALOT
  rationale: 본문의 מְנוּחָה는 문자적으로 ‘쉼/안식’이지만, 여기서는 추격이 멈추지 않았다는 뉘앙스를 나타내므로 한국어 본문에는 과도한 해석어를 넣지 않고 유려하게 처리했습니다.
- source_word: הִדְרִיכֻהוּ
  english_pob_choice: trampled him down
  chosen_korean: 그를 짓밟았습니다
  alternatives_korean:
  - 그를 짓밟아 눌렀습니다
  - 그를 짓눌렀습니다
  - 그를 몰아냈습니다
  lexicon: HALOT
  rationale: דרך의 사역형은 이 문맥에서 강한 ‘짓밟다/짓밟아 누르다’의 의미가 자연스러워, 군사적 압박과 폭력을 드러내는 ‘짓밟았습니다’로 옮겼습니다.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  english_pob_choice: toward the east of the sun
  chosen_korean: 해가 뜨는 쪽으로
  alternatives_korean:
  - 동쪽으로
  - 해의 동쪽으로
  lexicon: HALOT
  rationale: 직역하면 ‘해의 동쪽’이지만, 히브리어 관용을 살리면서도 현대 한국어에서 자연스럽게 이해되도록 ‘해가 뜨는 쪽’으로 옮겼습니다.
theological_decisions:
- issue: 집단명사 ‘베냐민’의 처리
  chosen_reading: 한 개인이 아니라 지파 전체를 가리키는 집단명사로 이해해 ‘베냐민’을 그대로 두었습니다.
  alternative_readings:
  - ‘베냐민 사람들’
  - ‘베냐민 지파’
  rationale: 동사들이 단수적 집합 대상을 전제하므로, 본문 형식을 보존하는 쪽이 원문의 집단적 수사를 가장 잘 드러냅니다.
  doctrine_reference: source-syntax
