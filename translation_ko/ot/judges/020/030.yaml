  - ‘기브아 앞에’
  rationale: אֶל의 기본 방향성은 살리되, 전투 문맥에서 독자가 실제 충돌 장면으로 이해하도록 ‘향해/에게로’를 구분해 사용했습니다.
  doctrine_reference: 본문 서사 정확성
