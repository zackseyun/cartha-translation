  yaml_path: translation/ot/nahum/003/012.yaml
  text: All your fortresses are fig trees with first-ripe figs; if they are shaken[a], they fall into the mouth of the eater.
  footnotes:
  - marker: a
    text: Or 'figs with early figs,' taking the image as fruit rather than trees; the main text reads 'fig trees' because it better fits the comparison to fortified places.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 모든 성채는 일찍 익은 무화과가 달린 무화과나무와 같습니다. 흔들리면 먹는 이의 입으로 떨어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일찍 익은 무화과들’로 옮길 수 있습니다. 이는 이 비유를 무화과나무가 아니라 무화과 열매의 이미지로 이해하는 번역입니다. 본문은 성채와의 비교에 더 잘 맞는 ‘무화과나무’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצָרַיִךְ
  english_pob_choice: your fortresses
  chosen_korean: 당신의 모든 성채
  alternatives_korean:
