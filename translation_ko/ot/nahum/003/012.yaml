  yaml_path: translation/ot/nahum/003/012.yaml
  text: All your fortresses are fig trees with first-ripe figs; if they are shaken[a], they fall into the mouth of the eater.
  footnotes:
  - marker: a
    text: Or 'figs with early figs,' taking the image as fruit rather than trees; the main text reads 'fig trees' because it better fits the comparison to fortified places.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 모든 성채는 첫 무르익은 무화과가 달린 무화과나무와 같습니다. 그것들이 흔들리면, 먹는 자의 입속으로 떨어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘초기 무화과가 달린 무화과나무들’로도 옮길 수 있습니다. 본문은 성채와의 대비를 더 분명히 하기 위해 ‘무화과나무’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצָרַיִךְ
  english_pob_choice: your fortresses
  chosen_korean: 당신의 모든 성채
  alternatives_korean:
  - 당신의 모든 요새
  - 당신의 모든 견고한 곳
  lexicon: HALOT
  rationale: 성채는 fortified place라는 뜻을 구체적이고 생생하게 살리면서, 나훔 3장의 공격적 심판 이미지에 잘 맞습니다.
- source_word: תְּאֵנִים
  english_pob_choice: fig trees
  chosen_korean: 무화과나무
  alternatives_korean:
  - 무화과들
  - 무화과나무들
  lexicon: HALOT
  rationale: 비유의 대상이 성채와 대응하는 나무라는 점을 드러내기 위해 ‘무화과나무’로 옮겼습니다.
- source_word: עִם בִּכּוּרִים
  english_pob_choice: with first-ripe figs
  chosen_korean: 첫 무르익은 무화과가 달린
  alternatives_korean:
  - 첫 무르익은 무화과가 있는
  - 초기에 익은 무화과가 달린
  lexicon: HALOT
  rationale: בִּכּוּרִים의 조기 성숙 이미지를 살리되, 제의적 ‘첫열매’로 오해되지 않도록 자연스럽게 ‘첫 무르익은 무화과’로 표현했습니다.
- source_word: עַל פִּי אוֹכֵל
  english_pob_choice: into the mouth of the eater
  chosen_korean: 먹는 자의 입속으로
  alternatives_korean:
  - 먹는 자의 입으로
  - 먹는 사람의 입속으로
  lexicon: HALOT
  rationale: 직역적 구조를 유지하면서도 한국어에서 자연스럽게 떨어지는 방향을 살렸고, 손쉽게 먹히는 무방비함을 드러냅니다.
theological_decisions:
- issue: 비유의 형식 유지
  chosen_reading: 성채가 무화과나무처럼 쉽게 흔들리고 떨어지는 모습으로 그대로 옮겼습니다.
  alternative_readings:
  - 의미를 풀어 ‘쉽게 함락된다’로 번역
  rationale: 원문의 비유적 충격을 유지해야 나훔의 심판 선언이 가진 즉각성과 조롱의 뉘앙스가 보존됩니다.
  doctrine_reference: 예언서의 심판 비유와 수사적 이미지 보존
- issue: 조건문 처리
  chosen_reading: ‘if’의 조건 구조를 ‘흔들리면’으로 살렸습니다.
  alternative_readings:
  - ‘흔들릴 때’
  - ‘흔들리면 곧’
  rationale: 문맥상 일반적·예시적 조건을 나타내므로, 결과의 필연성을 자연스럽게 드러내는 합쇼체 조건 표현이 적절합니다.
  doctrine_reference: 히브리어 조건문과 비유적 일반 진술
