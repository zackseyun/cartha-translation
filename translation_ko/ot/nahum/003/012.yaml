  lexicon: HALOT
  rationale: 직역적 구조를 유지하면서도 한국어에서 자연스럽게 떨어지는 방향을 살렸고, 손쉽게 먹히는 무방비함을 드러냅니다.
theological_decisions:
- issue: 비유의 형식 유지
  chosen_reading: 성채가 무화과나무처럼 쉽게 흔들리고 떨어지는 모습으로 그대로 옮겼습니다.
  alternative_readings:
  - 의미를 풀어 ‘쉽게 함락된다’로 번역
  rationale: 원문의 비유적 충격을 유지해야 나훔의 심판 선언이 가진 즉각성과 조롱의 뉘앙스가 보존됩니다.
  doctrine_reference: 예언서의 심판 비유와 수사적 이미지 보존
- issue: 조건문 처리
  chosen_reading: ‘if’의 조건 구조를 ‘흔들리면’으로 살렸습니다.
  alternative_readings:
  - ‘흔들릴 때’
  - ‘흔들리면 곧’
  rationale: 문맥상 일반적·예시적 조건을 나타내므로, 결과의 필연성을 자연스럽게 드러내는 합쇼체 조건 표현이 적절합니다.
  doctrine_reference: 히브리어 조건문과 비유적 일반 진술
