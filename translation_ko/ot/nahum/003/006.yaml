theological_decisions:
- issue: 예언적 심판의 수치 이미지
  chosen_reading: 원문의 거친 수치화 이미지를 완화하지 않고, 공개적 모욕과 심판의 어조를 그대로 살렸습니다.
  alternative_readings:
  - 더 부드럽게 '부끄럽게 하며' 정도로 순화하기
  - 도덕적 의미를 강조해 '가증한 것'으로 일괄 번역하기
  rationale: 이 절은 교리 논증보다 니느웨의 공적 굴욕을 선언하는 심판 예언이므로, 읽기 쉽게 하되 수치와 모욕의 강도를 유지하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 예언서의 심판 언어와 공적 수치의 수사학
- issue: 2인칭 단수 여성형을 한국어로 처리하는 방식
  chosen_reading: 한국어는 성 구분이 없으므로 '너'로 유지하되, 대상이 니느웨라는 의인화된 도시임을 문맥에 맡겼습니다.
  alternative_readings:
  - '''그대''로 거리감을 높이기'
  - 도시명을 반복해 '니느웨'를 명시하기
  rationale: 히브리어의 여성형 2인칭 접미사는 한국어에서 직접 재현할 수 없으므로, 자연스러운 2인칭과 예언 문맥을 유지하는 쪽이 가장 충실합니다.
  doctrine_reference: 히브리어 인칭·성 구분의 한국어 비대응성
