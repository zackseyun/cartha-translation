id: NAM.3.18
reference: Nahum 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָמ֤וּ רֹעֶ֨י/ךָ֙ מֶ֣לֶךְ אַשּׁ֔וּר יִשְׁכְּנ֖וּ אַדִּירֶ֑י/ךָ נָפֹ֧שׁוּ עַמְּ/ךָ֛ עַל הֶ/הָרִ֖ים וְ/אֵ֥ין מְקַבֵּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/018.yaml
  text: Your shepherds slumber[a], O king of Assyria; your nobles lie down. Your people are scattered on the mountains[d][c][b], and there is no one to gather them.
  footnotes:
  - marker: a
    text: Or 'sleep' for 'slumber'; the Hebrew image may suggest negligent or incapacitated leaders.
    reason: lexical_alternative
  - marker: b
    text: '''Your shepherds'' is a metaphor for Assyria''s rulers or leaders.'
    reason: cultural_note
  - marker: c
    text: Or 'your mighty ones dwell/rest.' The Hebrew verb can mean 'dwell,' but here likely continues the image of leaders lying inactive.
    reason: alternative_reading
  - marker: d
    text: The Hebrew behind 'are scattered' is difficult; the sense is supported by the following line, 'there is no one to gather them.'
    reason: textual_variant
translation:
  language: ko
  text: 앗수르 왕이여, 네 목자들은 잠들어 있고[a][b], 네 귀족들은 누워 있으며[c], 네 백성은 산들 위에 흩어져 있다[d]. 그들을 모을 사람이 없다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠들어 있고’는 히브리어 동사의 일반적 의미를 따른 것이며, ‘졸고 있다’ 또는 ‘잠자고 있다’로도 옮길 수 있습니다. 이 표현은 지도자들의 무기력 또는 태만을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘목자들’은 앗수르의 통치자나 지도자들을 가리키는 은유입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 동사는 ‘거주하다’ 또는 ‘머물다’라는 뜻도 가능하지만, 여기서는 앞의 ‘잠들어 있고’와의 병행 때문에 무기력하게 ‘누워 있다’는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘흩어져 있다’에 해당하는 히브리어는 해석이 어렵습니다. 뒤의 ‘그들을 모을 사람이 없다’는 말이 백성이 흩어진 상황이라는 이해를 뒷받침합니다.
    reason: textual_variant
lexical_decisions:
- source_word: נָמוּ
  english_pob_choice: slumber
  chosen_korean: 잠들었고
  alternatives_korean:
  - 졸고 있습니다
  - 잠들어 있습니다
  - 잠자고 있습니다
  lexicon: HALOT
  rationale: 문맥상 지도자들의 무기력함을 살리면서도 자연스러운 현대 한국어로 옮기기 위해 ‘잠들었고’를 택했습니다. 영어 POB의 ‘slumber’가 담은 완곡한 무기력의 뉘앙스를 반영합니다.
- source_word: רֹעֶיךָ
  english_pob_choice: your shepherds
  chosen_korean: 네 목자들
  alternatives_korean:
  - 네 통치자들
  - 네 지도자들
  - 네 목회자들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘목자들’을 본문에 유지해, 예언서에서 이 은유가 지닌 통치자 비판의 이미지를 살렸습니다. POB의 본문 전략도 이 은유를 유지합니다.
- source_word: אַדִּירֶיךָ
  english_pob_choice: your nobles
  chosen_korean: 네 귀족들
  alternatives_korean:
  - 네 권세자들
  - 네 용사들
  - 네 위대한 자들
  lexicon: HALOT
  rationale: 문맥상 앗수르의 상류 지배층을 가리키므로 ‘귀족들’이 가장 자연스럽고, ‘mighty ones’의 해석 가능성을 과도하게 군사화하지 않습니다.
- source_word: נָפֹשׁוּ עַמְּךָ
  english_pob_choice: Your people are scattered
  chosen_korean: 네 백성은 산들 위에 흩어졌는데
  alternatives_korean:
  - 네 백성은 흩어졌는데
  - 네 백성은 산들에 퍼졌는데
  - 네 백성은 산들 위로 흩어졌는데
  lexicon: HALOT
  rationale: 불확실한 히브리어 동사의 의미를 문맥에 따라 ‘흩어졌’로 처리하되, 이어지는 ‘모을 사람이 없습니다’와의 연결을 위해 장소 구문을 자연스럽게 붙였습니다.
- source_word: וְאֵין מְקַבֵּץ
  english_pob_choice: and there is no one to gather them
  chosen_korean: 그것을 모을 사람이 없습니다
  alternatives_korean:
  - 모을 사람이 없습니다
  - 그리고 모으는 이가 없습니다
  - 그들을 모을 사람이 없습니다
  lexicon: HALOT
  rationale: 히브리어는 문맥상 흩어진 백성을 다시 모을 자가 없다는 뜻이므로, 한국어에서는 대상 지시를 자연스럽게 풀어 ‘그것을’로 처리해 문장 흐름을 살렸습니다.
theological_decisions:
- issue: 예언적 조롱의 어조와 직접 호칭
  chosen_reading: ‘앗수르 왕아’로 직접 호칭을 살려, 무너지는 제국 지도자에 대한 선지자적 조롱과 심판 선언의 긴장을 드러냈습니다.
  alternative_readings:
  - 앗수르 왕이여
  - 앗수르 왕에게
  rationale: 히브리어의 호격은 단순 서술보다 선포적·심판적 효과가 강하므로, 한국어에서도 직접 호칭을 유지하는 것이 본문의 수사와 신학을 더 정확히 반영합니다.
  doctrine_reference: 예언서의 심판 선포와 제국 비판의 수사
