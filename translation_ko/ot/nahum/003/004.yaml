  lexicon: HALOT
  rationale: גּוֹיִם은 정치-국가 단위의 ‘나라들’이 자연스럽고, מִשְׁפָּחוֹת는 핵가족보다 넓은 친족 집단을 가리켜 ‘족속들’이 문맥상 더 가깝습니다.
theological_decisions:
- issue: 음행과 마술 이미지의 해석 범위
  chosen_reading: 여기서는 니느웨를 향한 예언적 비유를 그대로 살려, 성적 타락만이나 종교적 우상숭배만으로 좁히지 않았습니다.
  alternative_readings:
  - 성적 죄의 비유로만 이해
  - 우상숭배의 비유로만 이해
  - 정치·경제적 조작의 비유로만 이해
  rationale: 본문은 음행과 마술을 겹쳐 도시의 유혹적·착취적 힘을 그리므로, 어느 하나로 환원하지 않고 그 긴장을 보존하는 것이 소스에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
