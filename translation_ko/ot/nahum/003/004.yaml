  text: מֵ/רֹב֙ זְנוּנֵ֣י זוֹנָ֔ה ט֥וֹבַת חֵ֖ן בַּעֲלַ֣ת כְּשָׁפִ֑ים הַ/מֹּכֶ֤רֶת גּוֹיִם֙ בִּ/זְנוּנֶ֔י/הָ וּ/מִשְׁפָּח֖וֹת בִּ/כְשָׁפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
  footnotes:
  - marker: a
    text: Or 'well-favored' or 'graceful.' The Hebrew expression describes alluring attractiveness.
    reason: lexical_alternative
  - marker: b
    text: Or 'families.' The Hebrew term can denote extended family groups or clans.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 음행으로 말미암아, 곧 아름답게 매혹적인 창녀[a]요, 마술의 여주인[b]인 여자가 나라들을 그녀의 음행으로, 족속들을 그녀의 마술로 팔았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호감 가는’, ‘우아한’의 뜻일 수 있습니다. 히브리어 표현은 사람을 끌어당기는 매력성을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가문들’의 뜻일 수 있습니다. 히브리어는 확장 가족 집단이나 족속을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  english_pob_choice: because of the many
  chosen_korean: 많은 ...로 말미암아
  alternatives_korean:
  - 풍성한 ... 때문에
  - 번성한 ...로 인하여
  lexicon: HALOT
  rationale: מִן + רֹב는 원인/근거를 나타내므로, 결과적 심판의 근거를 드러내는 ‘...로 말미암아’로 옮겼습니다.
- source_word: טוֹבַת חֵן
  english_pob_choice: charming in grace
  chosen_korean: 아름답게 매혹적인
  alternatives_korean:
  - 은총이 있는
  - 호감 가는
  - 매력 있는
  lexicon: HALOT
  rationale: 직역하면 ‘은혜/호감에 좋은’이지만, 본문은 단순 외모보다 유혹적 매력을 가리키므로 ‘아름답게 매혹적인’으로 본래의 유혹성과 표현력을 살렸습니다.
- source_word: בַּעֲלַת כְּשָׁפִים
  english_pob_choice: mistress of sorceries
  chosen_korean: 마술의 여주인
  alternatives_korean:
  - 주술의 여주인
  - 마법의 여인
  - 마술을 다루는 자
  lexicon: HALOT
  rationale: בַּעֲלַת은 여성형 소유/특성 표지이므로 여성형 호칭을 유지했고, כְּשָׁפִים은 본문 어휘에 맞게 ‘마술’로 옮겼습니다.
- source_word: גּוֹיִם / מִשְׁפָּחוֹת
  english_pob_choice: nations / clans
  chosen_korean: 나라들 / 족속들
  alternatives_korean:
  - 민족들 / 가문들
  - 열방 / 가족들
  lexicon: HALOT
  rationale: גּוֹיִם은 정치-국가 단위의 ‘나라들’이 자연스럽고, מִשְׁפָּחוֹת는 핵가족보다 넓은 친족 집단을 가리켜 ‘족속들’이 문맥상 더 가깝습니다.
theological_decisions:
- issue: 음행과 마술 이미지의 해석 범위
  chosen_reading: 여기서는 니느웨를 향한 예언적 비유를 그대로 살려, 성적 타락만이나 종교적 우상숭배만으로 좁히지 않았습니다.
  alternative_readings:
  - 성적 죄의 비유로만 이해
  - 우상숭배의 비유로만 이해
  - 정치·경제적 조작의 비유로만 이해
  rationale: 본문은 음행과 마술을 겹쳐 도시의 유혹적·착취적 힘을 그리므로, 어느 하나로 환원하지 않고 그 긴장을 보존하는 것이 소스에 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
