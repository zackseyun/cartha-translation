base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
  footnotes:
  - marker: a
    text: Or 'well-favored' or 'graceful.' The Hebrew expression describes alluring attractiveness.
    reason: lexical_alternative
  - marker: b
    text: Or 'families.' The Hebrew term can denote extended family groups or clans.
    reason: lexical_alternative
translation:
  language: ko
  text: 수많은 음행을 일삼는 매력적인 창녀[a], 주술에 능한 여인이 나라들을 자기 음행으로 팔고 족속들[b]을 자기 주술로 팔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘호감을 주는’, ‘우아한’이라는 뜻일 수 있습니다. 히브리어 표현은 사람을 끌어당기는 매력을 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가문들’ 또는 ‘가족 집단들’이라는 뜻일 수 있습니다. 히브리어는 확장 가족 집단이나 족속을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
