id: NAM.3.9
reference: Nahum 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כּ֥וּשׁ עָצְמָ֛/ה וּ/מִצְרַ֖יִם וְ/אֵ֣ין קֵ֑צֶה פּ֣וּט וְ/לוּבִ֔ים הָי֖וּ בְּ/עֶזְרָתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/009.yaml
  text: Cush was her strength[a], and Egypt without end[d][c][b]; Put and the Libyans were among your helpers.
  footnotes:
  - marker: a
    text: 'Hebrew shifts person within the verse: ''Cush was her strength'' (3rd person feminine) but ''your helpers'' (2nd person feminine). The translation preserves this shift rather than smoothing it out.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Cush was your strength.' Some translations smooth the pronoun to match the later 'your,' but the Hebrew suffix on 'strength' is third feminine singular ('her').
    reason: alternative_reading
  - marker: c
    text: '''Put'' is also traditionally rendered ''Phut.'''
    reason: lexical_alternative
  - marker: d
    text: Hebrew 'Lubim'; likely Libyan peoples.
    reason: cultural_note
translation:
  language: ko
  text: 구스는 그녀의 힘이었고, 이집트는 끝이 없었으며, 붓과 루빔은 당신을 돕는 이들이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 절 안에서 3인칭 여성 단수(‘그녀의 힘’)와 2인칭 여성 단수(‘당신을 돕는’)를 함께 사용합니다. 번역은 이 전이를 평탄화하지 않았습니다.
    reason: source_note
  - marker: b
    text: ‘붓’은 전통적으로 ‘푸트’로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘루빔’은 리비아 계열 민족을 가리키는 말로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: כּוּשׁ
  english_pob_choice: Cush
  chosen_korean: 구스
  alternatives_korean:
  - 쿠시
  - 에티오피아
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 현대 한국어 성경에서 널리 통용되는 형태에 맞춰 구스로 옮겼습니다. 이는 해석적 지명인 ‘에티오피아’보다 히브리어 고유명사의 투명성을 더 잘 보존합니다.
- source_word: עָצְמָהּ
  english_pob_choice: was her strength
  chosen_korean: 그녀의 힘이었고
  alternatives_korean:
  - 당신의 힘이었고
  - 그녀의 강함이었고
  lexicon: HALOT
  rationale: 동사의 성 구분이 아니라 소유접미사 3인칭 여성 단수의 대상을 살려 ‘그녀의 힘’으로 옮겼습니다. 영어 POB가 지적한 인칭 전이를 평탄화하지 않았습니다.
- source_word: וְאֵין קֵצֶה
  english_pob_choice: without end
  chosen_korean: 끝이 없었으며
  alternatives_korean:
  - 헤아릴 수 없었으며
  - 무한하였으며
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘끝 없음’이라는 압축된 의미를 자연스러운 한국어로 옮겼습니다. 수적 과다와 한계 없음의 뉘앙스를 함께 유지합니다.
- source_word: פּוּט
  english_pob_choice: Put
  chosen_korean: 붓
  alternatives_korean:
  - 푸트
  - 팟
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역했습니다. 영어 POB의 각주처럼 전통적 표기 ‘Phut’에 해당하는 역사적 이명 가능성은 있으나, 본문에서는 원형에 더 가까운 음역을 택했습니다.
- source_word: לוּבִים
  english_pob_choice: the Libyans
  chosen_korean: 룹 사람들
  alternatives_korean:
  - 리비아 사람들
  - 루빔
  lexicon: HALOT
  rationale: 히브리어 этноним을 투명하게 살리기 위해 음역형을 채택했습니다. 영어 POB가 ‘Libyans’로 해석한 점은 참고하되, 본문은 히브리어 형태를 우선했습니다.
- source_word: בְּעֶזְרָתֵךְ
  english_pob_choice: among your helpers
  chosen_korean: 당신의 조력자들이었습니다
  alternatives_korean:
  - 당신을 돕는 이들 가운데 있었습니다
  - 당신의 도움 가운데 있었습니다
  lexicon: HALOT
  rationale: ב + עזרה + 2fs의 결합을 문맥상 ‘도움의 범주 안에 있는 지원 세력’으로 이해해 자연스럽게 옮겼습니다. 2인칭 여성 단수 소유를 ‘당신의’로 유지했습니다.
theological_decisions:
- issue: 3인칭 여성 단수와 2인칭 여성 단수의 인칭 전이
  chosen_reading: 본문의 인칭 전이를 그대로 드러내기 위해 ‘그녀의 힘’과 ‘당신의 조력자들’을 함께 유지했습니다.
  alternative_readings:
  - 전체를 2인칭으로 맞춰 ‘당신의 힘’으로 평준화함
  - 전체를 3인칭으로 바꿔 번역함
  rationale: 히브리어는 같은 절 안에서 지시 대상과 خطاب이 전환됩니다. 이 긴장을 완화하면 원문의 수사적 효과가 사라지므로, 독자가 본문의 불일치를 인지하도록 보존했습니다.
  doctrine_reference: 본문 비평/수사 분석
