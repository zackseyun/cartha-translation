source:
  edition: WLC
  text: ק֣וֹל שׁ֔וֹט וְ/ק֖וֹל רַ֣עַשׁ אוֹפָ֑ן וְ/ס֣וּס דֹּהֵ֔ר וּ/מֶרְכָּבָ֖ה מְרַקֵּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/002.yaml
  text: The crack of the whip[a], and the rumble of the wheel[b], with galloping horse and bounding chariot!
  footnotes:
  - marker: a
    text: Or 'the sound of the whip, and the sound of the rattling wheel.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew piles up brief sound-images without a finite verb, heightening the immediacy of the battle scene.
    reason: cultural_note
translation:
  language: ko
  text: 채찍 소리[a], 바퀴의 우르릉거림, 질주하는 말, 튀어 오르는 병거![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘소리’라는 일반 표현을 반복합니다. 문맥상 한국어에서는 ‘채찍 소리’와 ‘바퀴의 우르릉거림’처럼 구체화하여 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 유한동사 없이 짧은 소리와 움직임의 이미지들을 연달아 쌓아 전장의 즉시성을 강화합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ק֣וֹל שׁ֔וֹט
  english_pob_choice: the crack of the whip
  chosen_korean: 채찍 소리
  alternatives_korean:
  - 채찍의 파열음
  - 채찍의 crack
  lexicon: HALOT
  rationale: קוֹל은 여기서 일반적인 ‘소리’이지만, battle scene의 생생함을 살리기 위해 한국어에서는 자연스러운 관용 표현인 ‘채찍 소리’로 옮겼습니다.
- source_word: רַ֣עַשׁ אוֹפָ֑ן
  english_pob_choice: the rumble of the wheel
  chosen_korean: 바퀴 굴러가는 우르릉거림
  alternatives_korean:
  - 바퀴의 덜컹거림
  - 바퀴의 요란한 소리
  - 바퀴의 우르릉거림
  lexicon: HALOT
  rationale: רַעַשׁ은 흔들림·덜컹거림·요란한 소리를 가리키므로, 병거 바퀴가 전장 속에서 내는 무거운 이동음을 ‘우르릉거림’으로 살렸습니다.
- source_word: ס֣וּס דֹּהֵ֔ר
  english_pob_choice: galloping horse
  chosen_korean: 질주하는 말
  alternatives_korean:
  - 달리는 말
  - 질주하는 준마
  lexicon: HALOT
  rationale: דֹּהֵר은 빠르게 달리는 동작을 뜻하므로, 말을 자연스럽게 수식하는 현재분사형 ‘질주하는’으로 옮겼습니다.
- source_word: מֶרְכָּבָ֖ה מְרַקֵּדָֽה
  english_pob_choice: bounding chariot
  chosen_korean: 뛰어오르는 병거
  alternatives_korean:
  - 튀어 오르는 병거
  - 들썩이는 병거
  - 뛰는 병거
  lexicon: HALOT
  rationale: מְרַקֵּדָה는 문자적으로는 ‘뛰어오르는/춤추는’의 이미지이지만, 전투 장면에서는 요동치는 병거의 움직임을 가리키므로 ‘뛰어오르는’이 가장 덜 오해를 낳습니다.
theological_decisions:
- issue: 히브리어 원문이 유한동사 없이 소리 이미지들을 연속 제시하는 구문 처리
  chosen_reading: 한국어에서도 동사를 억지로 보태지 않고, 쉼표로 이어지는 감각적 병렬을 유지했습니다.
  alternative_readings:
  - 채찍이 울리고, 바퀴가 우르릉거리고, 말이 질주하며, 병거가 뛰어오릅니다.
  rationale: 원문은 명사구들의 압축된 연쇄로 전장의 즉각성을 높이므로, 한국어도 그 긴박한 음향 효과를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 문학적 형상 보존 원칙
