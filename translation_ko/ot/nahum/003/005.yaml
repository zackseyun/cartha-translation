  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/גִלֵּיתִ֥י שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/הַרְאֵיתִ֤י גוֹיִם֙ מַעְרֵ֔/ךְ וּ/מַמְלָכ֖וֹת קְלוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/005.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will uncover your skirts over your face, and I will show the nations your nakedness and the kingdoms your shame.
  footnotes:
  - marker: a
    text: Or 'I will expose your nakedness.' The Hebrew uses imagery of lifting a woman's skirts as a metaphor of public humiliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 너를 대적합니다. 만군의 야훼께서 말씀하십니다. 내가 네 치맛자락을 네 얼굴 위로 들어 올리고, 민족들에게 네 알몸을, 나라들에게 네 수치를 보이겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 네 알몸을 드러내겠습니다.” 히브리어는 여인의 치맛자락을 들어 올려 공개적으로 수치를 주는 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄사로, 현대 합쇼체에서는 ‘보십시오’가 ‘Behold’의 엄중한 호소력을 가장 자연스럽게 살립니다.
- source_word: אֵלַיִךְ
  english_pob_choice: I am against you
  chosen_korean: 내가 너를 대적합니다
  alternatives_korean:
  - 내가 너를 향합니다
  - 내가 너를 대적하고 있습니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 위치가 아니라 적대적 방향성을 나타내므로, ‘대적하다’가 문맥상 의도를 분명하게 전달합니다.
- source_word: וְגִלֵּיתִי שׁוּלַיִךְ עַל פָּנָיִךְ
  english_pob_choice: I will uncover your skirts over your face
  chosen_korean: 내가 네 치마를 네 얼굴 위로 벗기고
  alternatives_korean:
  - 내가 네 치마를 네 얼굴 위로 드러내고
  - 내가 네 옷자락을 네 얼굴 위로 올리고
  lexicon: HALOT
  rationale: 수치의 공개적 노출 이미지를 살리기 위해 문자적 동작을 유지하되, 한국어에서는 ‘벗기다’가 수치화된 폭로의 강도를 가장 직접적으로 드러냅니다.
- source_word: מַעְרֵךְ
  english_pob_choice: your nakedness
  chosen_korean: 네 벌거벗은 몸
  alternatives_korean:
  - 네 나체
  - 네 알몸
  lexicon: HALOT
  rationale: ‘벌거벗은 몸’은 노골적이지만 성경의 수치 은유를 과도하게 완곡하게 만들지 않으면서도 현대 한국어에서 자연스럽습니다.
- source_word: גוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: HALOT
  rationale: 예언문맥에서 ‘nations’의 포괄성을 살리되, 한국어에서는 ‘민족들’이 가장 넓고 자연스러운 대응입니다.
- source_word: וּמַמְלָכֹת
  english_pob_choice: the kingdoms
  chosen_korean: 나라들
  alternatives_korean:
  - 왕국들
  - 나라들
  lexicon: HALOT
  rationale: 평행구조상 정치적 단위를 가리키므로 ‘나라들’이 문맥에 맞고, ‘왕국들’보다 한국어 가독성이 높습니다.
- source_word: קְלוֹנֵךְ
  english_pob_choice: your shame
  chosen_korean: 네 수치
  alternatives_korean:
  - 네 치욕
  - 네 망신
  lexicon: HALOT
  rationale: 공적 굴욕의 뜻을 지니므로 ‘수치’가 간결하고 평행구조에서 ‘벌거벗은 몸’과 대응이 잘 됩니다.
