  text: פָּרָ֣שׁ מַעֲלֶ֗ה וְ/לַ֤הַב חֶ֨רֶב֙ וּ/בְרַ֣ק חֲנִ֔ית וְ/רֹ֥ב חָלָ֖ל וְ/כֹ֣בֶד פָּ֑גֶר וְ/אֵ֥ין קֵ֨צֶה֙ לַ/גְּוִיָּ֔ה יכשלו בִּ/גְוִיָּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
  footnotes:
  - marker: a
    text: Or 'the flame of the sword' for the vivid Hebrew image.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lightning of the spear.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'their bodies'; the suffix may refer generally to the mass of corpses in the scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 돌격하는 기병들[a], 번쩍이는 칼, 번뜩이는 창[b], 수많은 죽임당한 자들, 무더기 시체들—시체는 끝이 없고, 그들은 그들의 시체들[c]에 걸려 넘어집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기병들’은 히브리어 단수형을 전투 장면의 집단을 가리키는 표현으로 이해한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘번뜩이는’은 히브리어의 ‘번개’ 또는 ‘섬광’ 이미지를 자연스러운 한국어로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들의 시체들’이라고 합니다. ‘그들’이 누구를 가리키는지는 문맥상 명시되지 않았으며, 장면 속 시체 무리를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  english_pob_choice: Horsemen charging
  chosen_korean: 기병들이 돌격하고
  alternatives_korean:
  - 기병들이 진격하고
