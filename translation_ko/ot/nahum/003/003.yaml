id: NAM.3.3
reference: Nahum 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּרָ֣שׁ מַעֲלֶ֗ה וְ/לַ֤הַב חֶ֨רֶב֙ וּ/בְרַ֣ק חֲנִ֔ית וְ/רֹ֥ב חָלָ֖ל וְ/כֹ֣בֶד פָּ֑גֶר וְ/אֵ֥ין קֵ֨צֶה֙ לַ/גְּוִיָּ֔ה יכשלו בִּ/גְוִיָּתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
  footnotes:
  - marker: a
    text: Or 'the flame of the sword' for the vivid Hebrew image.
    reason: lexical_alternative
  - marker: b
    text: Or 'the lightning of the spear.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'their bodies'; the suffix may refer generally to the mass of corpses in the scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 기병들이 돌격하고, 번쩍이는 칼과 번뜩이는 창이 있으며, 죽임당한 자들이 많고 시체가 무더기이며, 몸들에 끝이 없습니다—그들은 그 몸들 위에서 걸려 넘어집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기병들’은 히브리어 단수형을 집단적으로 읽은 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘번뜩이는’은 히브리어 ‘번개’ 이미지의 자연스러운 한국어 대응입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘몸들’은 히브리어가 가리키는 시체들의 집합을 문맥상 넓게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  english_pob_choice: Horsemen charging
  chosen_korean: 기병들이 돌격하고
  alternatives_korean:
  - 기병들이 진격하고
  - 기병들이 올라오고
  lexicon: HALOT
  rationale: פָּרָשׁ은 집단적 전투 장면에서 기병대로 읽는 것이 자연스럽고, מַעֲלֶה는 전개되는 공격을 가리키므로 ‘돌격하고’가 가장 직접적으로 긴박감을 살립니다.
- source_word: לַהַב חֶרֶב / בְּרַק חֲנִית
  english_pob_choice: the flashing sword / the gleaming spear
  chosen_korean: 번쩍이는 칼과 번뜩이는 창
  alternatives_korean:
  - 칼의 불꽃과 창의 번개
  - 번쩍이는 칼날과 번뜩이는 창끝
  lexicon: HALOT
  rationale: לַהַב과 בְּרַק은 각각 불꽃/번개 같은 시각적 광휘를 가리키므로, 무기의 반짝임을 살리면서도 한국어로 자연스러운 ‘번쩍이는/번뜩이는’으로 옮겼습니다.
- source_word: רֹב חָלָל / כֹבֶד פָּגֶר / אֵין קֵצֶה לַגְּוִיָּה
  english_pob_choice: a multitude of slain / heaps of corpses / there is no end to the bodies
  chosen_korean: 죽임당한 자들이 많고 시체가 무더기이며, 몸들에 끝이 없습니다
  alternatives_korean:
  - 죽은 자가 많고 시체가 무더기이며, 몸에 끝이 없습니다
  - 살해된 자가 많고 송장이 무더기이며, 몸들에 끝이 없습니다
  lexicon: HALOT
  rationale: חָלָל은 ‘상처 입은 자’보다 여기서는 ‘죽임당한 자’가 정확하고, כֹבֶד는 ‘무더기’가 담고 있는 양감으로 옮겼습니다. גְּוִיָּה는 문맥상 ‘시체/몸’이 가능한데, POB의 의미 긴장—시체의 누적—을 살리면서도 뒤의 반복을 피하려고 ‘몸들’로 옮겼습니다.
- source_word: יכשלו בִּגְוִיָּתָם
  english_pob_choice: they stumble over their bodies
  chosen_korean: 그들은 그 몸들 위에서 걸려 넘어집니다
  alternatives_korean:
  - 그들은 그 몸들에 걸려 넘어집니다
  - 그들은 시체들 위에서 넘어집니다
  lexicon: HALOT
  rationale: כשל는 단순히 ‘넘어지다’보다 걸림이 있어 ‘걸려 넘어지다’가 더 가깝고, 전치사 בְּ는 ‘~위에서’로 옮겨 시체 더미 위를 밟고 비틀거리는 장면을 살렸습니다.
theological_decisions:
- issue: 폭력 묘사의 밀도와 이미지 유지
  chosen_reading: 전투의 잔혹함을 완화하지 않고, 무기와 시체의 반복적 병렬을 그대로 드러냈습니다.
  alternative_readings:
  - 의역하여 더 완곡하게 표현하기
  - 시체 관련 표현을 한 번만 사용해 반복을 줄이기
  rationale: 본문은 심판의 파괴를 과장된 시각 이미지로 제시하므로, 한국어에서도 어휘를 완화하면 원문의 충격과 수사적 효과가 약해집니다.
  doctrine_reference: 하나님의 심판과 예언 문학의 수사적 과장
