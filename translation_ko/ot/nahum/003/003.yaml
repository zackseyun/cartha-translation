  lexicon: HALOT
  rationale: פָּרָשׁ은 집단적 전투 장면에서 기병대로 읽는 것이 자연스럽고, מַעֲלֶה는 전개되는 공격을 가리키므로 ‘돌격하고’가 가장 직접적으로 긴박감을 살립니다.
- source_word: לַהַב חֶרֶב / בְּרַק חֲנִית
  english_pob_choice: the flashing sword / the gleaming spear
  chosen_korean: 번쩍이는 칼과 번뜩이는 창
  alternatives_korean:
  - 칼의 불꽃과 창의 번개
  - 번쩍이는 칼날과 번뜩이는 창끝
  lexicon: HALOT
  rationale: לַהַב과 בְּרַק은 각각 불꽃/번개 같은 시각적 광휘를 가리키므로, 무기의 반짝임을 살리면서도 한국어로 자연스러운 ‘번쩍이는/번뜩이는’으로 옮겼습니다.
- source_word: רֹב חָלָל / כֹבֶד פָּגֶר / אֵין קֵצֶה לַגְּוִיָּה
  english_pob_choice: a multitude of slain / heaps of corpses / there is no end to the bodies
  chosen_korean: 죽임당한 자들이 많고 시체가 무더기이며, 몸들에 끝이 없습니다
  alternatives_korean:
  - 죽은 자가 많고 시체가 무더기이며, 몸에 끝이 없습니다
  - 살해된 자가 많고 송장이 무더기이며, 몸들에 끝이 없습니다
  lexicon: HALOT
  rationale: חָלָל은 ‘상처 입은 자’보다 여기서는 ‘죽임당한 자’가 정확하고, כֹבֶד는 ‘무더기’가 담고 있는 양감으로 옮겼습니다. גְּוִיָּה는 문맥상 ‘시체/몸’이 가능한데, POB의 의미 긴장—시체의 누적—을 살리면서도 뒤의 반복을 피하려고 ‘몸들’로 옮겼습니다.
- source_word: יכשלו בִּגְוִיָּתָם
  english_pob_choice: they stumble over their bodies
  chosen_korean: 그들은 그 몸들 위에서 걸려 넘어집니다
  alternatives_korean:
  - 그들은 그 몸들에 걸려 넘어집니다
  - 그들은 시체들 위에서 넘어집니다
  lexicon: HALOT
  rationale: כשל는 단순히 ‘넘어지다’보다 걸림이 있어 ‘걸려 넘어지다’가 더 가깝고, 전치사 בְּ는 ‘~위에서’로 옮겨 시체 더미 위를 밟고 비틀거리는 장면을 살렸습니다.
theological_decisions:
