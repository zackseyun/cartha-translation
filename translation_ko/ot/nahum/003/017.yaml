  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִנְּזָרַ֨יִ/ךְ֙ כָּֽ/אַרְבֶּ֔ה וְ/טַפְסְרַ֖יִ/ךְ כְּ/ג֣וֹב גֹּבָ֑י הַֽ/חוֹנִ֤ים בַּ/גְּדֵרוֹת֙ בְּ/י֣וֹם קָרָ֔ה שֶׁ֤מֶשׁ זָֽרְחָה֙ וְ/נוֹדַ֔ד וְ/לֹֽא נוֹדַ֥ע מְקוֹמ֖/וֹ אַיָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/017.yaml
  text: Your guards are like locusts[a], and your scribes like swarms of locusts, settling on the walls on a cold day. The sun rises, and they fly away[d][c][b]; no one knows where they are.
  footnotes:
  - marker: a
    text: Or 'your crowned ones,' 'your princes,' or 'your consecrated ones' for the rare Hebrew term.
    reason: lexical_alternative
  - marker: b
    text: Or 'your officers' or 'your military commanders' for 'your scribes.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew may also mean 'on the fences/enclosures,' not necessarily city walls.
    reason: lexical_alternative
  - marker: d
    text: The final clause is literally something like, 'and its/their place is not known—where are they?'
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 관원들은 메뚜기 같고, 너의 서기관들은 메뚜기 떼 같아서 — 추운 날에 성벽에 내려앉으나 해가 떠오르면 날아가 버려서 그들의 있던 곳을 아무도 알지 못합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 희귀어는 ‘너의 왕관 쓴 자들’, ‘너의 고관들’, ‘너의 봉헌된 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 말은 ‘너의 장교들’ 또는 ‘너의 군사 지휘관들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 꼭 성벽만이 아니라 울타리나 둘레 구조물을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 마지막 구절은 문자적으로는 ‘그들의/그의 장소가 알려지지 않는다 — 그들은 어디 있느냐?’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְּזָרַיִךְ
  english_pob_choice: your guards
  chosen_korean: 너의 관원들
  alternatives_korean:
  - 너의 경비들
  - 너의 왕관 쓴 자들
  - 너의 봉헌된 자들
  lexicon: HALOT
  rationale: 희귀어라 뜻이 분명하지 않지만, 문맥의 조롱조와 직분 병렬을 살려 지위가 있는 인물들을 가리키는 말로 옮겼습니다. ‘관원들’은 군사·행정적 권위를 암시하면서도 지나치게 해석을 고정하지 않습니다.
- source_word: טַפְסְרַיִךְ
  english_pob_choice: your scribes
  chosen_korean: 너의 서기관들
  alternatives_korean:
  - 너의 관리들
  - 너의 장교들
  - 너의 군사 지휘관들
  lexicon: HALOT
  rationale: 어휘적 핵심이 애매한 외래어이므로, 기본 의미층을 살려 ‘서기관들’로 옮기고, 실제로는 관리나 군 지휘관을 가리킬 수 있다는 여지를 남겼습니다.
- source_word: כָּאַרְבֶּה / כְּגֹב גֹּבָי
  english_pob_choice: like locusts / like swarms of locusts
  chosen_korean: 메뚜기 같고 … 메뚜기 떼 같아서
  alternatives_korean:
  - 메뚜기처럼
  - 메뚜기 떼처럼
  - 메뚜기 무리 같아서
  lexicon: HALOT
  rationale: 두 비유를 모두 살려, 첫 번째는 단순 비교, 두 번째는 집단성을 강화한 표현으로 구분했습니다. 반복되는 메뚜기 이미지를 통해 조롱의 강도를 유지했습니다.
- source_word: בַּגְּדֵרוֹת
  english_pob_choice: on the walls
  chosen_korean: 성벽에 내려앉으나
  alternatives_korean:
  - 담장에
  - 울타리에
  - 성벽/울타리에
  lexicon: HALOT
  rationale: 기본 뜻은 벽·울타리·둘레 구조물의 범위를 갖지만, 니느웨 공격 맥락에서는 성벽이 가장 자연스럽고 선명합니다. ‘내려앉다’는 곤충 비유와 잘 맞습니다.
- source_word: וְלֹא נוֹדַע מְקוֹמֹו אַיָּם
  english_pob_choice: no one knows where they are
  chosen_korean: 그들의 있던 곳을 아무도 알지 못합니다
  alternatives_korean:
  - 그들의 자리가 알려지지 않습니다
  - 그들이 어디 있는지 아무도 알지 못합니다
  - 그들의 장소가 알려지지 않습니다
  lexicon: HALOT
  rationale: 마지막 절은 ‘그/그들의 장소를 알 수 없다’는 소멸의 관용구입니다. 복수적 선행사를 살리면서도, 현대 한국어에서 자연스럽고 분명하게 ‘있던 곳’을 옮겼습니다.
theological_decisions:
- issue: 조롱 예언 속 이미지의 보존
  chosen_reading: 관원들과 서기관들을 실제 전투력의 허상처럼 메뚜기 비유로 살려, 니느웨의 권세가 해가 뜨면 사라지는 덧없음으로 드러나게 했습니다.
  alternative_readings:
  - 중립적인 행정직 언어로 완화하기
  - 메뚜기 비유를 설명적으로 풀어 쓰기
  rationale: 본문은 단순 묘사가 아니라 앗수르의 자만과 허망함을 조롱하는 예언적 풍자이므로, 비유의 휘발성과 소멸감을 그대로 유지해야 합니다.
  doctrine_reference: 예언서의 심판 선언과 풍자적 수사
