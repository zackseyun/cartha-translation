  source_fidelity: 핵심 메뚜기 비유와 관원·서기관의 병렬은 잘 보존했습니다. 다만 마지막의 ‘그들의 있던 곳’은 히브리어의 현재적 ‘그들의/그의 장소가 알려지지 않는다; 어디에 있는가?’보다 과거의 장소를 뜻하는 쪽으로 의미를 좁힙니다. 또한 וְנוֹדַד의 단수형이 가리키는 집단적 메뚜기 떼의 소멸 이미지를 한국어에서 자연스럽게 처리하되, ‘날다’라는 동작을 확정하기보다 ‘떠나다’로 옮기는 편이 더 충실합니다.
  naturalness: 원문의 긴 비교 구문을 ‘내려앉아 있다가’로 연결하면 현대 한국어의 흐름이 더 자연스럽습니다. 각주 표지는 해당 어휘·구절 바로 뒤에 배치해야 독자가 대안의 적용 범위를 명확히 알 수 있습니다.
  terminology: ‘관원들’과 ‘서기관들’은 논쟁적인 두 직함을 과도하게 단정하지 않는 번역으로 수용 가능합니다. מִנְּזָרַיִךְ의 다른 가능성 및 טַפְסְרַיִךְ의 행정·군사적 가능성은 각주로 유지합니다. ‘성벽’은 문맥상 가능하나 בַּגְּדֵרוֹת의 넓은 의미범위를 각주에서 밝혀야 합니다.
