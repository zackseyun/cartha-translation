id: NAM.3.11
reference: Nahum 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
  footnotes:
  - marker: a
    text: Or 'You too will seek a stronghold from the enemy.'
    reason: lexical_alternative
  - marker: b
    text: '''Become drunk'' likely continues prophetic imagery of being overwhelmed and reeling under judgment, not merely literal intoxication.'
    reason: cultural_note
translation:
  language: ko
  text: 너도 취하게 될 것이며, 숨겨질 것입니다. 너도 원수에게서 피할 요새를 찾게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너도 원수에게서 강한 요새를 찾게 될 것이다.’
    reason: lexical_alternative
  - marker: b
    text: ‘취하게 될 것’은 단순한 문자적 음주보다, 심판 아래에서 비틀거리며 무너지는 예언적 이미지를 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אַ֣תְּ
  english_pob_choice: You too
  chosen_korean: 너도
  alternatives_korean:
  - 또 너는
  - 심지어 너도
  lexicon: HALOT
  rationale: 반복된 גַּם אַתְּ의 비교·불가피성 강조를 한국어에서 가장 자연스럽게 살려 줍니다.
- source_word: תִּשְׁכְּרִי
  english_pob_choice: will become drunk
  chosen_korean: 취하게 될 것이며
  alternatives_korean:
  - 술에 취하게 될 것이며
  - 술 취할 것입니다
  lexicon: HALOT
  rationale: 동사 שׁכר의 기본적 의미를 살리면서도 예언적 심판 이미지로 읽힐 수 있는 여지를 남깁니다.
- source_word: תְּהִי נַעֲלָמָה
  english_pob_choice: you will be hidden
  chosen_korean: 숨겨질 것입니다
  alternatives_korean:
  - 가려질 것입니다
  - 숨겨진 상태가 될 것입니다
  - 사라질 것입니다
  lexicon: HALOT
  rationale: היה + 수동적 상태를 한국어의 수동형으로 옮겨, 결과적·상태적 뉘앙스를 보존합니다.
- source_word: מָעוֹז מֵאוֹיֵב
  english_pob_choice: a refuge from the enemy
  chosen_korean: 원수에게서 피할 요새
  alternatives_korean:
  - 원수에게서 피난처
  - 원수에게서 피할 피난처
  - 원수로부터의 요새
  lexicon: HALOT
  rationale: מָעוֹז의 ‘견고한 피난처/요새’ 감각을 살리면서, מִן־אוֹיֵב의 분리·보호 의미를 한국어 조사와 어순으로 분명히 드러냅니다.
theological_decisions:
- issue: 예언적 ‘취함’과 ‘숨겨짐’의 이미지
  chosen_reading: 문면상 술 취함과 숨겨짐을 그대로 두되, 심판으로 인한 비틀거림과 은폐의 예언적 이미지로 읽히게 합니다.
  alternative_readings:
  - 단순한 실제 음주로만 이해하기
  - 직접적으로 ‘패배하여 사라질 것’으로 의역하기
  rationale: 본문 자체는 심판의 원인을 명시하지 않으므로, 이미지의 강도를 유지하되 해석을 과도하게 고정하지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: 예언 문학의 심판 상징 읽기
- issue: מָעוֹז의 기능
  chosen_reading: ‘요새’를 쓰되, 실제 전투 요새와 피난 기능을 함께 떠올리게 합니다.
  alternative_readings:
  - ‘보호’만 강조하기
  - ‘성채’로만 좁히기
  rationale: 원문은 안전한 거처를 찾는 행위를 말하므로, 방어 시설의 감각과 피난처의 기능을 함께 담는 번역이 적절합니다.
  doctrine_reference: 문맥적 어휘 기능
