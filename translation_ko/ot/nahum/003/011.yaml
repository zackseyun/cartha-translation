  rationale: היה + 수동적 상태를 한국어의 수동형으로 옮겨, 결과적·상태적 뉘앙스를 보존합니다.
- source_word: מָעוֹז מֵאוֹיֵב
  english_pob_choice: a refuge from the enemy
