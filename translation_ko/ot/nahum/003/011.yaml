  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
  footnotes:
  - marker: a
    text: Or 'You too will seek a stronghold from the enemy.'
    reason: lexical_alternative
  - marker: b
    text: '''Become drunk'' likely continues prophetic imagery of being overwhelmed and reeling under judgment, not merely literal intoxication.'
    reason: cultural_note
translation:
  language: ko
  text: 니느웨야, 당신도 취하게 될 것이며[b] 숨겨질 것입니다. 당신도 원수에게서 피할 피난처를 찾게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신도 원수에게서 피할 요새를 찾게 될 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘취하게 될 것’은 단순한 문자적 음주보다, 심판 아래에서 비틀거리며 무너지는 예언적 이미지를 가리킬 가능성이 큽니다.
    reason: cultural_note
