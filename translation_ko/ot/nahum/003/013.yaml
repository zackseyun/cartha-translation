  text: הִנֵּ֨ה עַמֵּ֤/ךְ נָשִׁים֙ בְּ/קִרְבֵּ֔/ךְ לְ/אֹ֣יְבַ֔יִ/ךְ פָּת֥וֹחַ נִפְתְּח֖וּ שַׁעֲרֵ֣י אַרְצֵ֑/ךְ אָכְלָ֥ה אֵ֖שׁ בְּרִיחָֽיִ/ך׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/013.yaml
  text: Look[a], your troops are women in your midst; the gates of your land stand wide open to your enemies[c][b]; fire has consumed your bars.
  footnotes:
  - marker: a
    text: Or 'your people are women in your midst.' The Hebrew עם commonly means 'people'; here it likely refers to Nineveh's defenders in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'opened, they are opened'—an emphatic construction meaning 'opened wide' or 'completely opened.'
    reason: lexical_alternative
  - marker: c
    text: Or 'your gate-bars' or 'your bolts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 당신의 백성[b]은 당신 가운데서 여자들입니다. 당신 땅의 성문들이 원수들에게 활짝 열렸습니다[c]. 불이 당신의 빗장을 삼켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라.’ 히브리어 הִנֵּה는 주의를 끌며 장면을 제시하는 감탄사입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 군대’ 또는 ‘당신의 방어 병력.’ 히브리어 עַם은 보통 ‘백성’을 뜻하지만, 이 문맥에서는 니느웨의 방어자들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘열려, 열렸다’라는 강조적 구성으로, ‘활짝 열렸다’ 또는 ‘완전히 열렸다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 경고와 조롱이 섞인 주의를 끄는 감탄사로, 현대 한국어에서 자연스럽고 문어체에 맞는 직접적 호명입니다.
- source_word: עַמֵּךְ
  english_pob_choice: your troops
  chosen_korean: 당신의 백성
  alternatives_korean:
  - 당신의 군대
  - 당신의 주민들
  lexicon: HALOT
  rationale: עם의 기본 의미를 살려 ‘백성’으로 옮기되, 성문 방어의 문맥상 군사적 무력함을 독자가 읽어내도록 했습니다.
- source_word: נָשִׁים
  english_pob_choice: women
  chosen_korean: 여자들입니다
  alternatives_korean:
  - 여인들입니다
  - 여자들처럼 보입니다
  lexicon: HALOT
  rationale: 본문의 직설적 성별 표현을 완화하지 않고 유지했습니다. 비교어를 덧붙이지 않은 히브리어의 직설성을 따라갔습니다.
- source_word: פָּת֥וֹחַ נִפְתְּח֖וּ
  english_pob_choice: stand wide open
  chosen_korean: 활짝 열렸고
  alternatives_korean:
  - 완전히 열렸고
  - 크게 열렸고
  lexicon: HALOT
  rationale: 부정사 절대형과 동사형의 강조를 한국어의 강조 부사 ‘활짝’으로 옮겨, 단순 개방이 아니라 완전한 개방의 뉘앙스를 살렸습니다.
- source_word: בְּרִיחָֽיִ/ך׃
  english_pob_choice: your bars
  chosen_korean: 빗장들
  alternatives_korean:
  - 문빗장들
  - 볼트들
  lexicon: HALOT
  rationale: 성문을 잠그는 목재/금속 잠금대를 가리키므로, 한국어 성문 문맥에서 자연스러운 ‘빗장’이 가장 적절합니다.
theological_decisions:
- issue: נָשִׁים의 성별 비유를 어떻게 처리할 것인가
  chosen_reading: 성별 표현을 그대로 살려 ‘여자들입니다’로 옮겼습니다.
  alternative_readings:
  - ‘여자들처럼’으로 완곡화
  - ‘나약합니다’로 의미만 전달
  rationale: 본문은 성별 비유를 직접 사용하며, 이를 완곡하게 바꾸면 예언적 조롱의 날카로움이 약해집니다. 본문 의미와 수사 효과를 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 4 (Gender-accurate over gender-neutral)
