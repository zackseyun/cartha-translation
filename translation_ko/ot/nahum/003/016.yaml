base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/016.yaml
  text: You multiplied your merchants more than the stars of the heavens[b][a]; the locust strips bare and flies away.
  footnotes:
  - marker: a
    text: Or 'the young locust' or 'the hopper'; the Hebrew term refers to a particular kind or stage of locust.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can also mean 'spreads out' or 'strips off'; here it likely describes the locust stripping the land bare before departing.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 하늘의 별보다 더 많은 상인들을 늘렸습니다. 메뚜기[a]가 휩쓸고[b] 날아가 버립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린 메뚜기’ 또는 ‘뛰는 메뚜기’. 히브리어 낱말은 특정 종류나 발육 단계의 메뚜기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘퍼져 나가다’ 또는 ‘벗겨 내다’로도 옮길 수 있습니다. 여기서는 메뚜기가 휩쓸어 황폐하게 한 뒤 떠나는 모습을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
