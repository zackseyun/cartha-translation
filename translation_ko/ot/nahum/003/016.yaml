theological_decisions:
- issue: 니느웨를 향한 2인칭 여성 단수 직접 호칭
  chosen_reading: 직접 심판 خطاب을 유지하기 위해 2인칭 여성 단수의 어조를 한국어에서도 명시적 2인칭으로 살렸습니다.
  alternative_readings:
  - 3인칭 서술로 완화
  - 도시를 ‘그곳’으로 간접화
  rationale: 본문은 도시 니느웨를 여성 단수로 직접 꾸짖는 형식이므로, 한국어에서도 직설적 대면 구조를 보존하는 것이 수사와 심판 선언의 힘을 살립니다.
