base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/015.yaml
  text: There the fire will devour you; the sword will cut you off; it will devour you like the locust[a]. Multiply yourself like the locust; multiply yourself like the swarming locust.
  footnotes:
  - marker: a
    text: 'Hebrew uses two related insect terms here: one often rendered a kind or stage of locust (יֶלֶק), and another the common term for locust (אַרְבֶּה). The main text renders them as ''locust'' and ''swarming locust'' for clarity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 불이 너를 삼키고, 칼이 너를 끊어 버릴 것이며, 그것이 너를 메뚜기처럼 삼킬 것입니다. 메뚜기처럼 자신을 불리십시오. 무리지어 몰려드는 메뚜기처럼 자신을 불리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 서로 관련된 두 곤충어를 사용합니다. 하나는 흔히 메뚜기의 한 종류나 단계로 보이는 יֶלֶק이고, 다른 하나는 일반적인 메뚜기어인 אַרְבֶּה입니다. 본문은 구별을 살리되 한국어 가독성을 위해 ‘메뚜기’와 ‘무리지어 몰려드는 메뚜기’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  english_pob_choice: There
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기서
  - 그곳에
  lexicon: HALOT
  rationale: 전장으로 이어지는 그 지점을 가리키는 위치 부사이므로, 간결한 ‘그곳에서’로 원문의 지시성을 살렸습니다.
- source_word: תֹּאכְלֵךְ אֵשׁ / תֹּאכְלֵךְ
  english_pob_choice: the fire will devour you / it will devour you
  chosen_korean: 불이 너를 삼키고 / 그것이 너를 ... 삼킬 것입니다
  alternatives_korean:
  - 불이 너를 집어삼키고
  - 불이 너를 먹어 버리고
  lexicon: HALOT
  rationale: אָכַל의 ‘먹다/삼키다’ 이미지를 한국어의 자연스러운 파괴 은유인 ‘삼키다’로 옮겼습니다.
- source_word: תַּכְרִיתֵךְ חֶרֶב
  english_pob_choice: the sword will cut you off
  chosen_korean: 칼이 너를 끊어 버릴 것이며
  alternatives_korean:
  - 칼이 너를 잘라 버릴 것이며
  - 칼이 너를 멸할 것이며
  lexicon: HALOT
  rationale: כרת의 ‘끊다, 제거하다’라는 이미지를 살려 ‘끊어 버리다’로 옮겨, 단순한 소멸보다 절단·제거의 뉘앙스를 보존했습니다.
- source_word: הִתְכַּבֵּד / הִתְכַּבְּדִי
  english_pob_choice: Multiply yourself
  chosen_korean: 자신을 불리십시오
  alternatives_korean:
  - 스스로를 많게 하십시오
  - 자신을 번성하게 하십시오
  lexicon: HALOT
  rationale: 히트파엘 명령형의 ‘많아지다/무거워지다’ 계열 의미를, 이 조롱 섞인 문맥에서 한국어로는 ‘불리다’가 가장 자연스럽게 ‘수적으로 늘어나라’는 뜻을 전달합니다.
- source_word: כַּיָּלֶק / כָּאַרְבֶּה
  english_pob_choice: like the locust / like the swarming locust
  chosen_korean: 메뚜기처럼 / 무리지어 몰려드는 메뚜기처럼
  alternatives_korean:
  - 메뚜기 유충처럼
  - 떼지어 날아드는 메뚜기처럼
  lexicon: HALOT
  rationale: 두 곤충어의 차이를 완전히 평준화하지 않고, 본문 주석 없이도 읽히도록 첫째는 ‘메뚜기처럼’, 둘째는 군집성을 드러내는 ‘무리지어 몰려드는 메뚜기처럼’으로 구분했습니다.
theological_decisions:
- issue: 지시 대상의 인칭과 도시 의인화
  chosen_reading: 2인칭 단수 ‘너’와 여성형 명령의 효과를 살려 니느웨에 대한 직접 심판 경고로 읽었습니다.
  alternative_readings:
  - 도시를 완전히 중립적 대상으로 바꾸는 번역
  - 복수형으로 풀어 쓰는 번역
  rationale: 히브리어의 여성 단수 명령이 도시를 직접 향한 예언적 조롱임을 드러내므로, 한국어에서도 직접 호격처럼 들리게 유지했습니다.
  doctrine_reference: 예언서의 도시 의인화와 심판 경고의 수사
