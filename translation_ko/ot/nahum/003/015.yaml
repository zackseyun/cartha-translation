  lexicon: HALOT
  rationale: 히트파엘 명령형의 ‘많아지다/무거워지다’ 계열 의미를, 이 조롱 섞인 문맥에서 한국어로는 ‘불리다’가 가장 자연스럽게 ‘수적으로 늘어나라’는 뜻을 전달합니다.
- source_word: כַּיָּלֶק / כָּאַרְבֶּה
  english_pob_choice: like the locust / like the swarming locust
  chosen_korean: 메뚜기처럼 / 무리지어 몰려드는 메뚜기처럼
  alternatives_korean:
