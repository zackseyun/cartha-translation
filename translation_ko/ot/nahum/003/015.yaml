  - 떼지어 날아드는 메뚜기처럼
  lexicon: HALOT
  rationale: 두 곤충어의 차이를 완전히 평준화하지 않고, 본문 주석 없이도 읽히도록 첫째는 ‘메뚜기처럼’, 둘째는 군집성을 드러내는 ‘무리지어 몰려드는 메뚜기처럼’으로 구분했습니다.
