language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה כָל רֹאַ֨יִ/ךְ֙ יִדּ֣וֹד מִמֵּ֔/ךְ וְ/אָמַר֙ שָׁדְּדָ֣ה נִֽינְוֵ֔ה מִ֖י יָנ֣וּד לָ֑/הּ מֵ/אַ֛יִן אֲבַקֵּ֥שׁ מְנַחֲמִ֖ים לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/007.yaml
  text: And it will happen that all who see you will shrink from you and say, ‘Nineveh is devastated; who will grieve for her? Where can I seek comforters for you?’
translation:
  language: ko
  text: 그때 네 모습을 보는 사람마다 너에게서 물러날 것이며, “니느웨가 황폐하게 되었다! 누가 그를 위해 슬퍼하겠느냐? 어디에서 내가 너를 위로할 사람들을 찾겠느냐?” 하고 말할 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: כָל רֹאַיִךְ יִדּוֹד מִמֵּךְ
  english_pob_choice: all who see you will shrink from you
  chosen_korean: 네 모습을 보는 사람마다 너에게서 물러날 것이며
  alternatives_korean:
  - 너를 보고 달아날 것입니다
  - 너를 보고 도망칠 것입니다
  - 너를 보고 피할 것입니다
  lexicon: רָדַד/דּוֹד
  rationale: 영어 POB의 ‘shrink from you’는 단순한 도주보다 두려움과 기피의 반응을 가리키므로, 이를 ‘물러날’로 옮겨 원문의 반응 강도를 유지했습니다.
- source_word: שָׁדְּדָה נִינְוֵה
  english_pob_choice: Nineveh is devastated
  chosen_korean: “니느웨가 황폐하게 되었다!
  alternatives_korean:
  - 니느웨가 멸망했다
  - 니느웨가 약탈당했다
  - 니느웨가 파괴되었다
  lexicon: שׁדד
  rationale: שָׁדַד의 핵심은 약탈·황폐화이므로, 결과 상태를 드러내는 ‘황폐하게 되었다’가 문맥상 가장 자연스럽고 원문에 가깝습니다.
- source_word: מִי יָנוּד לָהּ
  english_pob_choice: who will grieve for her
  chosen_korean: 누가 그를 위해 슬퍼하겠느냐?
  alternatives_korean:
  - 누가 그를 위해 애통하겠느냐
  - 누가 그를 위해 한탄하겠느냐
  - 누가 그를 위해 동정하겠느냐
  lexicon: נוד
  rationale: 영어 POB가 ‘grieve for her’로 확정한 해석을 따라, 단순한 감정의 동요보다 상실을 함께 슬퍼하는 뜻이 드러나도록 ‘슬퍼하겠느냐’로 옮겼습니다.
- source_word: מְנַחֲמִים
  english_pob_choice: comforters
  chosen_korean: 위로할 사람들
  alternatives_korean:
  - 위로하는 이들
  - 위로자들
  - 위로할 자들
  lexicon: נחם
  rationale: 명사형을 자연스러운 한국어로 풀어, 장례·애도 맥락에서의 ‘위로하는 사람들’이라는 기능을 분명히 했습니다.
theological_decisions:
- issue: 니느웨를 향한 심판 선언의 수사적 효과
  chosen_reading: 도시의 몰락이 너무 분명하여 보는 이들조차 두려움과 기피로 물러나고, 애도해 줄 자도 없다는 냉혹한 심판의 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 역사 보고
  - 과장된 시적 표현으로 완화
  rationale: 문맥상 질문형 수사는 동정의 가능성을 닫고 완전한 고립을 강조하므로, 한국어도 그 냉엄함을 유지했습니다.
  doctrine_reference: 예언서의 심판 신탁과 수사적 질문
