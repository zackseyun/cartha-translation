id: NAM.3.14
reference: Nahum 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ֤י מָצוֹר֙ שַֽׁאֲבִי לָ֔/ךְ חַזְּקִ֖י מִבְצָרָ֑יִ/ךְ בֹּ֧אִי בַ/טִּ֛יט וְ/רִמְסִ֥י בַ/חֹ֖מֶר הַחֲזִ֥יקִי מַלְבֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/014.yaml
  text: Draw water for yourself for the siege; strengthen your fortresses[a]. Go into the clay and tread the mortar; take hold of the brick mold.
  footnotes:
  - marker: a
    text: Or 'the brick kiln.' The Hebrew term מַלְבֵּן is rare and may refer either to a brick mold/form or to a brick kiln; the immediate context of working clay and mortar favors 'brick mold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 물을 길어 포위를 대비하십시오. 당신의 견고한 성들을 굳게 하십시오[a]. 진흙 속으로 들어가서 흙을 밟고, 벽돌틀을 잡으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벽돌 가마’. 히브리어 מַלְבֵּן은 희귀어로, 벽돌틀이나 벽돌 가마를 가리킬 수 있습니다. 앞뒤 문맥의 흙·진흙·벽돌 만들기 이미지는 ‘벽돌틀’을 더 잘 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵי מָצוֹר
  english_pob_choice: water for the siege
  chosen_korean: 물을 ... 포위를 대비하여
  alternatives_korean:
  - 포위용 물을
  - 포위를 위한 물을
  lexicon: HALOT
  rationale: ‘전쟁용 물’이라는 뜻을 살리되, 자연스러운 한국어로는 포위 상황에 대비해 물을 길어 두라는 명령으로 옮기는 것이 가장 직설적입니다.
- source_word: חַזְּקִי מִבְצָרַיִךְ
  english_pob_choice: strengthen your fortresses
  chosen_korean: 당신의 견고한 성들을 굳게 하십시오
  alternatives_korean:
  - 당신의 성채들을 강화하십시오
  - 당신의 요새들을 굳게 하십시오
  lexicon: HALOT
  rationale: מִבְצָרִים는 요새/성채를 가리키므로 ‘견고한 성들’로 옮기고, 동사 חזק의 힘을 살려 ‘굳게 하십시오’로 표현했습니다.
- source_word: בֹּאִי בַטִּיט וְרִמְסִי בַחֹמֶר
  english_pob_choice: Go into the clay and tread the mortar
  chosen_korean: 진흙 속으로 들어가서 흙을 밟고
  alternatives_korean:
  - 점토 속으로 들어가서 모르타르를 밟고
  - 진흙 속으로 들어가서 진흙을 밟고
  lexicon: HALOT
  rationale: טִיט와 חֹמֶר는 문맥상 벽돌 만들기 재료를 가리키므로, 한국어에서는 공정의 이미지를 살리되 지나친 기술 용어를 피해서 옮겼습니다.
- source_word: מַלְבֵּן
  english_pob_choice: the brick mold
  chosen_korean: 벽돌틀
  alternatives_korean:
  - 벽돌몰드
  - 벽돌 가마
  - 벽돌형틀
  lexicon: HALOT
  rationale: 희귀어로서 ‘가마’ 가능성도 있으나, 앞의 점토·흙 밟기와 이어지는 문맥은 벽돌을 빚는 틀을 더 잘 지지하므로 ‘벽돌틀’로 번역했습니다.
theological_decisions:
- issue: 예언적 빈정거림의 어조
  chosen_reading: 이 절은 니느웨에게 포위 대비를 하라고 조롱 섞인 명령을 던지는 예언적 풍자입니다.
  alternative_readings:
  - 단순한 실용적 방어 지시로 읽기
  - 중립적인 작업 지시로 읽기
  rationale: 동사들이 연속된 명령형으로 제시되지만, 실제 기능은 도시의 무력함을 드러내는 풍자이므로 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 나훔 3:14의 문맥적 풍자와 심판 예언
