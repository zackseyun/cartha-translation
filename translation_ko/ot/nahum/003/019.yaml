id: NAM.3.19
reference: Nahum 3:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵין כֵּהָ֣ה לְ/שִׁבְרֶ֔/ךָ נַחְלָ֖ה מַכָּתֶ֑/ךָ כֹּ֣ל שֹׁמְעֵ֣י שִׁמְעֲ/ךָ֗ תָּ֤קְעוּ כַף֙ עָלֶ֔י/ךָ כִּ֗י עַל מִ֛י לֹֽא עָבְרָ֥ה רָעָתְ/ךָ֖ תָּמִֽיד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/019.yaml
  text: There is no healing for your fracture[a]; your wound is grievous. All who hear the report about you clap their hands over you[b], for over whom has your evil not continually passed?
  footnotes:
  - marker: a
    text: Or 'There is no relief for your brokenness; your wound is severe.'
    reason: lexical_alternative
  - marker: b
    text: The rhetorical question means that Nineveh's evil had affected virtually everyone, which is why the nations rejoice at its fall.
    reason: cultural_note
translation:
  language: ko
  text: 네 상처를 고칠 길이 없습니다[a]. 네 부상은 치명적입니다. 너에 대한 소식을 듣는 자마다 너를 보고 손뼉을 칩니다[b]. 네 악이 끊임없이 지나가지 않은 이가 과연 누구이겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 깨어짐에 대한 위로가 없습니다. 네 상처는 심각합니다.’
    reason: lexical_alternative
  - marker: b
    text: 이 수사적 질문은 니느웨의 악이 사실상 모든 민족에게 영향을 미쳤음을 뜻하므로, 열방이 그의 몰락을 기뻐한다는 의미입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֵין כֵּהָה
  english_pob_choice: There is no healing
  chosen_korean: 고칠 길이 없습니다
  alternatives_korean:
  - 치유가 없습니다
  - 낫게 할 방도가 없습니다
  - 회복시킬 수 없습니다
  lexicon: HALOT
  rationale: 존재 부정과 상처의 비가역성을 자연스러운 현대 한국어로 옮기기 위해 ‘고칠 길이 없습니다’로 풀었습니다.
- source_word: לְשִׁבְרֶךָ / מַכָּתֶךָ
  english_pob_choice: for your fracture / your wound
  chosen_korean: 상처 / 부상
  alternatives_korean:
  - 균열 / 상처
  - 파열 / 상처
  - 부서짐 / 타격
  lexicon: HALOT
  rationale: ‘상처’와 ‘부상’은 중첩되는 부정적 이미지로 히브리어의 파괴·상해 은유를 살리면서도 한국어에서 자연스럽습니다.
- source_word: תָּקְעוּ כַף עָלֶיךָ
  english_pob_choice: clap their hands over you
  chosen_korean: 너를 보고 손뼉을 칩니다
  alternatives_korean:
  - 너를 향해 손뼉을 칩니다
  - 너를 두고 손뼉을 칩니다
  - 너를 향하여 손뼉을 칩니다
  lexicon: HALOT
  rationale: 히브리 관용구의 조롱 섞인 환호를 살리되, ‘over you’를 한국어에서 가장 자연스럽게 드러내기 위해 ‘너를 보고’로 옮겼습니다.
- source_word: רָעָתְךָ
  english_pob_choice: your evil
  chosen_korean: 네 악
  alternatives_korean:
  - 네 악행
  - 네 악독
  - 네 폭정
  lexicon: HALOT
  rationale: 문맥의 도덕적 정죄를 유지하면서도, 영어 POB의 ‘evil’보다 한국어에서 과도하게 해설적인 표현을 피했습니다.
theological_decisions:
- issue: 앗수르/니느웨에 대한 심판 신탁의 어조
  chosen_reading: 수사적 질문과 환호를 그대로 살려, 피해자 열방의 기쁨과 니느웨의 보편적 해악을 함께 드러냈습니다.
  alternative_readings:
  - 보다 완곡한 비판조로 낮추기
  - ‘악’을 ‘재난’처럼 중립화하기
  rationale: 본문은 단순한 정보 전달이 아니라 열방의 반응을 정당화하는 심판 선언이므로, 도덕적 판단과 수사적 날카로움을 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 예언서의 심판 신탁과 보응 사상
