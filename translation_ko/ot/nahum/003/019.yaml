    issue: ‘네 부상은 치명적입니다’
    rationale: נַחְלָה는 ‘심각한, 중한, 병든’ 정도를 뜻하며, ‘치명적’은 본문이 명시하지 않는 사망성·필연적 죽음을 덧붙입니다.
  - severity: low
    issue: ‘너를 보고 손뼉을 칩니다’
    rationale: עָלֶיךָ는 니느웨를 두고/향하여 보이는 적대적 환호를 나타냅니다. ‘보고’는 단순한 시각적 계기로 축소될 수 있습니다.
  - severity: low
    issue: 각주 b의 ‘그의 몰락’
    rationale: 니느웨는 도시이므로 남성 인칭 대명사 ‘그의’ 대신 ‘니느웨의’ 또는 ‘그 몰락’이 자연스럽고 지시가 분명합니다.
