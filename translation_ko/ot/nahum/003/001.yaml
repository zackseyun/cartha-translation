  - 강탈
  lexicon: HALOT
  rationale: 폭력으로 빼앗는 행위를 가리키므로, 후속의 '먹잇감' 이미지와 맞물리게 '약탈'로 옮겼습니다.
- source_word: טָרֶף
  english_pob_choice: prey
  chosen_korean: 먹잇감
  alternatives_korean:
  - 희생물
  - 사냥감
  lexicon: HALOT
  rationale: 포식자 이미지가 살아 있는 단어를 택해, 성읍의 지속적인 약탈성을 '먹잇감이 떠나지 않습니다'라는 문장으로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 예언적 저주/탄식 어조
  chosen_reading: 직접적인 규탄의 탄식으로 읽어 '피 흘림의 성읍이여'를 서두에 배치했습니다.
  alternative_readings:
  - 단순 서술형으로 완화
  - '''화 있을진저''로 고전적 경고 어조를 채택'
  rationale: 히브리어 הוֹי는 단순 감탄보다 심판 선포의 어조가 강하므로, 현대 한국어에서도 그 긴박한 책망을 보존하는 방식이 적절합니다.
  doctrine_reference: 예언서의 심판 선포 기능
- issue: 폭력의 상습성과 지속성
  chosen_reading: '''가득하고 … 가득하니, 먹잇감이 떠나지 않습니다''로 반복과 지속성을 살렸습니다.'
  alternative_readings:
  - '''거짓과 약탈로 가득합니다''처럼 간략화'
  - '''먹잇감이 끊이지 않습니다''로 의역'
  rationale: 히브리어의 반복 구조와 부정 지속 표현은 도시의 구조적 악과 멈추지 않는 약탈을 강조하므로, 이를 유지해야 원문의 강도를 보존할 수 있습니다.
  doctrine_reference: 본문의 수사적 반복과 예언적 고발
