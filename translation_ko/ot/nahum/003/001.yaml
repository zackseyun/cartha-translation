reference: Nahum 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֖וֹי עִ֣יר דָּמִ֑ים כֻּלָּ֗/הּ כַּ֤חַשׁ פֶּ֨רֶק֙ מְלֵאָ֔ה לֹ֥א יָמִ֖ישׁ טָֽרֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/001.yaml
  text: Woe to the city of bloodshed[a], all of it full of lies, full of plunder[d][c][b]; prey never departs.
  footnotes:
  - marker: a
    text: Hebrew 'city of bloods,' an idiom for a city marked by bloodshed and bloodguilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'the bloody city.'
    reason: alternative_reading
  - marker: c
    text: '''Plunder'' may also be rendered ''robbery''; the Hebrew term evokes violent seizure.'
    reason: lexical_alternative
  - marker: d
    text: Or 'prey does not cease,' preserving the sense that the city's predatory violence is unending.
    reason: alternative_reading
translation:
  language: ko
  text: 피 흘림의 성읍이여, 네 안에 거짓이 가득하고, 약탈이 가득하니, 먹잇감이 떠나지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '피들의 성읍'이지만, 관용적으로 피 흘림과 혈죄에 물든 도시를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: '''약탈''은 ''노략''이나 ''강탈''로도 옮길 수 있으며, 폭력으로 빼앗는 행위를 가리킵니다.'
    reason: lexical_alternative
  - marker: c
    text: '''먹잇감''은 ''희생물''이나 ''사냥감''으로도 옮길 수 있으며, 포식자 이미지를 살립니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ה֖וֹי
  english_pob_choice: Woe
  chosen_korean: 피 흘림의 성읍이여
  alternatives_korean:
  - 슬프도다, 성읍이여
  - 화 있을진저, 성읍이여
  lexicon: HALOT
  rationale: 예언적 탄식과 책망의 감탄사를 한국어 관용으로 직접 옮기되, 문맥상 대상인 성읍에 대한 규탄을 앞세워 충격을 살렸습니다.
- source_word: עִ֣יר דָּמִ֑ים
  english_pob_choice: the city of bloodshed
  chosen_korean: 피 흘림의 성읍
  alternatives_korean:
  - 피의 성읍
  - 피 흘린 성읍
  lexicon: HALOT
  rationale: 직역의 '피들의 성읍'보다는 혈죄와 폭력을 담은 관용적 의미를 드러내는 '피 흘림의 성읍'이 원문의 비난을 자연스럽게 전달합니다.
- source_word: כַּחַשׁ
  english_pob_choice: lies
  chosen_korean: 거짓
  alternatives_korean:
  - 속임수
  - 허위
  lexicon: HALOT
  rationale: 도덕적·언약적 배반까지 포함할 수 있는 넓은 의미를 살려, 단순한 말의 거짓만이 아니라 도시 전체의 불신실함을 드러내는 '거짓'으로 옮겼습니다.
- source_word: פֶּרֶק
  english_pob_choice: plunder
  chosen_korean: 약탈
  alternatives_korean:
  - 노략
  - 강탈
  lexicon: HALOT
  rationale: 폭력으로 빼앗는 행위를 가리키므로, 후속의 '먹잇감' 이미지와 맞물리게 '약탈'로 옮겼습니다.
- source_word: טָרֶף
  english_pob_choice: prey
  chosen_korean: 먹잇감
  alternatives_korean:
  - 희생물
  - 사냥감
  lexicon: HALOT
  rationale: 포식자 이미지가 살아 있는 단어를 택해, 성읍의 지속적인 약탈성을 '먹잇감이 떠나지 않습니다'라는 문장으로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 예언적 저주/탄식 어조
  chosen_reading: 직접적인 규탄의 탄식으로 읽어 '피 흘림의 성읍이여'를 서두에 배치했습니다.
  alternative_readings:
  - 단순 서술형으로 완화
  - '''화 있을진저''로 고전적 경고 어조를 채택'
  rationale: 히브리어 הוֹי는 단순 감탄보다 심판 선포의 어조가 강하므로, 현대 한국어에서도 그 긴박한 책망을 보존하는 방식이 적절합니다.
  doctrine_reference: 예언서의 심판 선포 기능
- issue: 폭력의 상습성과 지속성
  chosen_reading: '''가득하고 … 가득하니, 먹잇감이 떠나지 않습니다''로 반복과 지속성을 살렸습니다.'
  alternative_readings:
  - '''거짓과 약탈로 가득합니다''처럼 간략화'
  - '''먹잇감이 끊이지 않습니다''로 의역'
  rationale: 히브리어의 반복 구조와 부정 지속 표현은 도시의 구조적 악과 멈추지 않는 약탈을 강조하므로, 이를 유지해야 원문의 강도를 보존할 수 있습니다.
  doctrine_reference: 본문의 수사적 반복과 예언적 고발
