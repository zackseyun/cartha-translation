  source_fidelity: 초안은 포로·유배, 제비뽑기, 결박이라는 본문의 주요 내용을 대체로 보존합니다. 그러나 יְרֻטְּשׁוּ를 ‘짓밟혀 죽었습니다’로 옮긴 것은 원문의 ‘내던져 산산이 부수다’라는 폭력적 이미지를 다른 방식의 폭력으로 바꾸며, בְּרֹאשׁ כָּל חוּצוֹת의 ‘길거리마다 머리맡’은 한국어 의미와 용법상 부정확합니다.
  naturalness: ‘길거리마다 머리맡에서’는 ‘머리맡’이 침상 가까운 곳을 뜻하므로 자연스럽지 않고 본문 위치도 전달하지 못합니다. ‘큰사람들’도 현대 표준어에서 사회적 유력자라는 뜻이 선명하지 않으므로 ‘유력자들’이 자연스럽습니다. ‘모든 거리의 어귀’는 원문의 공간 표현을 자연스럽게 반영합니다.
  terminology: נִכְבַּדֶּיהָ는 ‘귀족들’로 옮길 수 있으나 신분제를 단정하지 않도록 각주에서 ‘존귀한 이들’이라는 직역적 대안을 제시합니다. גְּדוֹלֶיהָ는 ‘유력자들’로 옮겨 사회적 저명성과 권세의 뜻을 보존합니다. זִקִּים은 ‘쇠사슬’로 옮기고, 족쇄·차꼬 등의 구속구일 수 있음을 각주로 보완합니다.
