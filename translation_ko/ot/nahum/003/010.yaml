revisions:
- from: 그녀도 포로가 되어 끌려갔고, 그녀의 어린아이들도 길거리마다 머리맡에서 짓밟혀 죽었습니다. 그녀의 존귀한 사람들을 두고 제비를 뽑았고, 그녀의 큰사람들은 사슬에 묶였습니다.[a][b][c][d]
