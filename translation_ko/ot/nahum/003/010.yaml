id: NAM.3.10
reference: Nahum 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם הִ֗יא לַ/גֹּלָה֙ הָלְכָ֣ה בַ/שֶּׁ֔בִי גַּ֧ם עֹלָלֶ֛י/הָ יְרֻטְּשׁ֖וּ בְּ/רֹ֣אשׁ כָּל חוּצ֑וֹת וְ/עַל נִכְבַּדֶּ֨י/הָ֙ יַדּ֣וּ גוֹרָ֔ל וְ/כָל גְּדוֹלֶ֖י/הָ רֻתְּק֥וּ בַ/זִּקִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/010.yaml
  text: Yet she too went into exile[a], into captivity; her children too were dashed to pieces at the head of every street. They cast lots for her honored men[d][c][b], and all her great men were bound in chains.
  footnotes:
  - marker: a
    text: Or 'her little ones' for 'her children.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'at the head of every street'; that is, at prominent street entrances or corners.
    reason: cultural_note
  - marker: c
    text: Or 'her nobles' for 'her honored men.'
    reason: lexical_alternative
  - marker: d
    text: Or 'were bound with fetters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀도 유배되어 포로로 끌려갔고, 그녀의 어린아이들[a]도 모든 거리의 어귀에서[b] 내던져져 산산이 부서졌습니다. 사람들이 그녀의 귀족들[c]을 두고 제비를 뽑았고, 그녀의 유력자들은 쇠사슬[d]에 묶였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린 것들’. 히브리어 עֹלָלֶיהָ는 매우 어린 아이들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 거리의 머리에서’입니다. 거리의 어귀나 입구를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 직역에 가깝게는 ‘그녀의 존귀한 이들’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘족쇄’ 또는 ‘구속구’. 히브리어 זִקִּים은 사슬이나 족쇄 같은 결박 도구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הִיא
  english_pob_choice: Yet she too
  chosen_korean: 그녀도
  alternatives_korean:
  - 그러나 그녀도
  - 심지어 그녀도
  lexicon: HALOT
  rationale: גַּם의 강조를 한국어의 조사 ‘도’로 간결하게 살리되, 앞 문맥의 대비는 전체 문장 흐름에서 드러나도록 했습니다.
- source_word: לַגּוֹלָה הָלְכָה בַשֶּׁבִי
  english_pob_choice: went into exile, into captivity
  chosen_korean: 포로가 되어 끌려갔고
  alternatives_korean:
  - 유배로 갔고
  - 포로로 끌려갔고
  lexicon: HALOT
  rationale: הלך + גולה의 관용적 의미는 단순한 이동이 아니라 포로로 끌려간 상태이므로, ‘포로가 되어 끌려갔다’로 결과와 상태를 함께 드러냈습니다.
- source_word: עֹלָלֶיהָ יְרֻטְּשׁוּ
  english_pob_choice: her children too were dashed to pieces
  chosen_korean: 그녀의 어린아이들도 ... 짓밟혀 죽었습니다
  alternatives_korean:
  - 그녀의 자녀들도 ... 산산이 부서졌습니다
  - 그녀의 어린 것들도 ... 찢겨 죽었습니다
  lexicon: HALOT
  rationale: עֹלָלֶיהָ는 아주 어린 아이들을 가리키며, יְרֻטְּשׁוּ의 폭력성을 한국어에서 과도하게 완곡화하지 않도록 ‘짓밟혀 죽었습니다’로 옮겼습니다.
- source_word: בְרֹאשׁ כָּל חוּצֹת
  english_pob_choice: at the head of every street
  chosen_korean: 길거리마다 머리맡에서
  alternatives_korean:
  - 모든 거리의 어귀에서
  - 모든 거리의 머리에서
  lexicon: HALOT
  rationale: 직역하면 ‘모든 거리의 머리/머리쪽’이지만, 한국어에서는 공공장소의 노출성을 자연스럽게 드러내기 위해 ‘길거리마다 머리맡에서’로 처리했습니다.
- source_word: נִכְבַּדֶּיהָ
  english_pob_choice: her honored men
  chosen_korean: 그녀의 존귀한 사람들
  alternatives_korean:
  - 그녀의 귀족들
  - 그녀의 존귀한 남자들
  lexicon: HALOT
  rationale: כבד의 ‘무게/존귀함’ 의미를 살려, 지위집단을 지나치게 한정하는 ‘귀족들’보다 더 직접적인 ‘존귀한 사람들’을 선택했습니다.
- source_word: גְּדוֹלֶיהָ
  english_pob_choice: her great men
  chosen_korean: 그녀의 큰사람들
  alternatives_korean:
  - 그녀의 지도자들
  - 그녀의 유력자들
  lexicon: HALOT
  rationale: גדולים의 사회적 우세함을 살리되, 해석을 좁히는 ‘지도자들’보다 원문의 포괄성을 유지하는 표현을 택했습니다.
- source_word: רֻתְּקוּ בַזִּקִּים
  english_pob_choice: were bound in chains
  chosen_korean: 사슬에 묶였습니다
  alternatives_korean:
  - 족쇄에 묶였습니다
  - 사슬로 결박되었습니다
  lexicon: HALOT
  rationale: זִקִּים은 구속구를 가리키므로, 현대 한국어에서 가장 직접적인 ‘사슬에 묶였습니다’로 옮겼습니다.
theological_decisions:
- issue: אָ과 ממשיגים 대조가 주는 심판의 수치성
  chosen_reading: 니느웨가 아닌 다른 멸망 사례를 예로 들며, 포로·학살·공개적 조롱이 한 도시의 수치스러운 종말로 제시됩니다.
  alternative_readings:
  - 단순한 역사 보고로만 읽는 해석
  - 비유적 과장으로 약화시키는 해석
  rationale: 본 절은 단순한 이동 묘사가 아니라 공개 처형과 굴욕적 포로를 통해 심판의 완전성을 강조하므로, 그 충격을 약화시키지 않도록 번역했습니다.
  doctrine_reference: 예언서의 심판 선언과 언약적 공의
- issue: 어린아이들에 대한 폭력 표현의 직설성
  chosen_reading: 원문의 잔혹성을 완곡어법으로 희석하지 않고 드러냈습니다.
  alternative_readings:
  - ‘상처를 입었습니다’처럼 약화하는 표현
  - ‘흩어졌습니다’처럼 비폭력적으로 바꾸는 표현
  rationale: יְרֻטְּשׁוּ는 폭력적 파괴를 가리키므로, 독자가 심판의 엄중함을 실제로 느끼도록 직설적으로 옮기는 것이 본문 의도에 맞습니다.
  doctrine_reference: 하나님의 공의와 역사 속 심판
