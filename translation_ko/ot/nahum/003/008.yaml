id: NAM.3.8
reference: Nahum 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/תֵֽיטְבִי֙ מִ/נֹּ֣א אָמ֔וֹן הַ/יֹּֽשְׁבָה֙ בַּ/יְאֹרִ֔ים מַ֖יִם סָבִ֣יב לָ֑/הּ אֲשֶׁר חֵ֣יל יָ֔ם מִ/יָּ֖ם חוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/008.yaml
  text: Are you better than No-amon, who sat among the Nile channels, with waters all around her, whose rampart was the sea, whose wall was from the sea?
translation:
  language: ko
  text: 네가 노아몬보다 더 낫냐? 그는 나일 강 도랑들 가운데 앉아 있었고, 물이 그의 사방에 둘렸으며, 바다를 요새로 삼았고, 바다를 성벽으로 삼았느니라.
  philosophy: formal
lexical_decisions:
- source_word: הֲ/תֵֽיטְבִי֙
  english_pob_choice: Are you better
  chosen_korean: 네가 …보다 더 낫냐?
  alternatives_korean:
  - 네가 …보다 더 좋으냐?
  - 네가 …보다 우월하냐?
  lexicon: טוב
  rationale: 비교 질문의 직설성과 문맥의 도전적 어조를 살리기 위해 ‘더 낫냐’로 옮겼습니다.
- source_word: מִ/נֹּ֣א אָמ֔וֹן
  english_pob_choice: No-amon
  chosen_korean: 노아몬
  alternatives_korean:
  - 노 아몬
  - 나오몬
  lexicon: 고유명사
  rationale: 영어 POB의 음역을 따라 현대 한국어 외래어 표기 감각에 맞게 붙여 적었습니다.
- source_word: הַ/יֹּֽשְׁבָה֙
  english_pob_choice: who sat
  chosen_korean: 앉아 있었고
  alternatives_korean:
  - 거주하고 있었고
  - 살고 있었고
  lexicon: ישב
  rationale: POB가 ‘dwelt’ 대신 ‘sat’으로 되돌린 점을 반영해, 정착/거주의 상태를 드러내면서도 동작성 있는 ‘앉아 있었고’를 택했습니다.
- source_word: בַּ/יְאֹרִ֔ים
  english_pob_choice: among the Nile channels
  chosen_korean: 나일 강 도랑들 가운데
  alternatives_korean:
  - 나일 운하들 가운데
  - 나일 개천들 가운데
  lexicon: יאור
  rationale: נילוס 수로의 구체적 이미지를 살리되 한국어에서 과도하게 현대적이거나 장식적인 표현을 피하기 위해 ‘도랑들’로 옮겼습니다.
- source_word: חֵ֣יל יָ֔ם
  english_pob_choice: the sea
  chosen_korean: 바다를 요새로
  alternatives_korean:
  - 바다를 방벽으로
  - 바다를 성채로
  lexicon: חיל
  rationale: חֵיל은 방어적 요새/성루의 뜻이 강하므로, 해안 방어의 의미를 살려 ‘요새’로 옮겼습니다.
- source_word: חוֹמָתָֽ/הּ
  english_pob_choice: wall
  chosen_korean: 성벽으로
  alternatives_korean:
  - 벽으로
  - 담으로
  lexicon: חומה
  rationale: 도시 방어 구조를 가리키는 말이므로 일반 ‘벽’보다 ‘성벽’이 원문의 방어적 상을 더 분명히 드러냅니다.
theological_decisions:
- issue: 앗수르를 향한 수사적 심문과 심판 선언의 어조
  chosen_reading: 직접적인 반문 형식을 유지해, 노아몬의 몰락을 예로 들어 니느웨의 자만을 꺾는 심판의 대비를 살렸습니다.
  alternative_readings:
  - 완곡한 서술형
  - 직설을 약화한 설명형
  rationale: 히브리어 수사 질문의 공격성을 흐리면 본문의 심판 수사가 약해지므로, 한국어에서도 그대로 드러내는 것이 합당합니다.
  doctrine_reference: 예언서의 심판 선포와 수사적 질문
- issue: ‘바다를 요새/성벽으로’라는 은유
  chosen_reading: 물리적 방어시설의 은유를 보존해, 도시의 인간적 안전장치가 무력화될 수 있음을 보여 주는 이미지로 처리했습니다.
  alternative_readings:
  - 비유를 풀어 설명하는 해석적 번역
  rationale: 원문은 안전과 শক্ত세의 상징을 병렬적으로 제시하므로, 해석을 덧붙이기보다 이미지 자체를 유지하는 편이 source-direct합니다.
  doctrine_reference: 시적 예언어의 은유 보존
