source:
  edition: WLC
  text: הָרִים֙ רָעֲשׁ֣וּ מִמֶּ֔/נּוּ וְ/הַ/גְּבָע֖וֹת הִתְמֹגָ֑גוּ וַ/תִּשָּׂ֤א הָ/אָ֨רֶץ֙ מִ/פָּנָ֔י/ו וְ/תֵבֵ֖ל וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/005.yaml
  text: The mountains quake before him[a], and the hills melt away; the earth rises up before his face[b], the world and all who dwell in it.
  footnotes:
  - marker: a
    text: Or 'The earth is upheaved before him' or 'The earth heaves before him.' The Hebrew verb can convey lifting, rising, or upheaval in this context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'before his face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 산들이 그 앞에서 떨고, 언덕들이 녹아 내립니다. 땅이 그 얼굴 앞에서 솟아오르고, 세상과 그 안에 사는 모든 자가 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 얼굴 앞에서’는 히브리어의 인체적 관용구를 더 가깝게 보존한 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: הָרִים / רָעֲשׁוּ
  english_pob_choice: The mountains quake
  chosen_korean: 산들이 그 앞에서 떱니다
  alternatives_korean:
  - 산들이 떨립니다
  - 산들이 흔들립니다
  lexicon: HALOT
  rationale: חָרִים의 집합적 복수와 רָעַשׁ의 지진적 떨림을 살려 ‘떨다’보다 강한 동적 표현인 ‘떱니다’를 썼습니다.
- source_word: הִתְמֹגָגוּ
  english_pob_choice: the hills melt away
  chosen_korean: 언덕들이 녹아 내립니다
  alternatives_korean:
  - 언덕들이 녹습니다
  - 언덕들이 무너집니다
  lexicon: HALOT
  rationale: 재귀적·소멸적 이미지를 반영해 ‘녹아 내리다’로 옮겨, 단순한 변화보다 붕괴와 해체의 뉘앙스를 살렸습니다.
- source_word: וַתִּשָּׂא הָאָרֶץ
  english_pob_choice: the earth rises up
  chosen_korean: 땅이 ... 솟아오르고
  alternatives_korean:
  - 땅이 ... 들리고
  - 땅이 ... 치솟고
  lexicon: HALOT
  rationale: נָשָׂא의 ‘들리다/올려지다’와 POB의 상향 운동을 함께 반영해, 지면이 들썩이며 위로 올라오는 장면을 ‘솟아오르다’로 표현했습니다.
- source_word: מִפָּנָיו
  english_pob_choice: before his face
  chosen_korean: 그 얼굴 앞에서
  alternatives_korean:
  - 그 앞에서
  - 그의 임재 앞에서
  lexicon: HALOT
  rationale: 직역에 가까운 인체 표현을 유지해 ‘얼굴’의 의인화된 히브리어 관용구를 보존했습니다.
theological_decisions:
- issue: 우주적 심판 이미지의 강도 유지
  chosen_reading: 산·언덕·땅·세상이 야훼의 현존 앞에서 실제로 흔들리고 변형되는 장면으로 읽히도록, 이미지를 완화하지 않았습니다.
  alternative_readings:
  - 비유적으로만 ‘정치적 격변’을 뜻한다고 완화하는 번역
  rationale: 문맥은 신적 현현과 진노의 묘사이므로, 창조 세계의 반응이라는 원문의 장엄함과 긴장을 그대로 살리는 것이 더 적절합니다.
  doctrine_reference: Translation philosophy §3 (theological tension 유지)
