  naturalness: ‘네게서’는 도시를 향한 예언적 호칭에 자연스럽고 간결합니다. ‘야훼를 대적하여 악을 꾸미는 자’는 현대 표준어에서 적대 관계와 행위를 명료하게 표현합니다. ‘사악한 조언자’는 ‘무가치한 조언자’보다 בְּלִיָּעַל의 문맥상 도덕적 비난을 더 자연스럽게 전달합니다.
