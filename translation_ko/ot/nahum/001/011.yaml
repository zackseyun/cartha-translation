id: NAM.1.11
reference: Nahum 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִמֵּ֣/ךְ יָצָ֔א חֹשֵׁ֥ב עַל יְהוָ֖ה רָעָ֑ה יֹעֵ֖ץ בְּלִיָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/011.yaml
  text: From you has come one who plots evil against Yahweh[a], a counselor of worthlessness.
  footnotes:
  - marker: a
    text: Or 'a counselor of Belial,' if בְּלִיָּעַל is taken as a name-like term rather than 'worthlessness.'
    reason: alternative_reading
translation:
  language: ko
  text: 너에게서 야훼를 향해 악을 꾸미는 자, 무가치한 조언자가 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벨리알의 조언자’로도 옮길 수 있습니다. בְּלִיָּעַל을 고유명사처럼 이해하는 경우입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֵּךְ / יָצָא
  english_pob_choice: From you has come
  chosen_korean: 너에게서 ... 나왔습니다
  alternatives_korean:
  - 너에게서 ... 나가왔습니다
  - 너에게서 ... 나왔습니다
  lexicon: HALOT
  rationale: 원문의 출처·기원(‘from you’)과 완료된 발생을 자연스럽게 살리기 위해 ‘너에게서 … 나왔습니다’로 옮겼습니다. 대상은 니느웨/앗시리아를 가리키는 여성 단수이지만 한국어 본문에서는 굳이 성을 표시하지 않았습니다.
- source_word: חֹשֵׁב
  english_pob_choice: who plots
  chosen_korean: 악을 꾸미는
  alternatives_korean:
  - 악을 도모하는
  - 악을 생각해 내는
  lexicon: HALOT
  rationale: 이 분사는 단순한 사고가 아니라 적대적 의도를 가진 ‘도모/음모’의 뉘앙스이므로, 문맥에 맞게 ‘꾸미는’으로 옮겼습니다.
- source_word: עַל יְהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼를 향해
  alternatives_korean:
  - 야훼를 대적하여
  - 야훼를 향하여
  lexicon: HALOT
  rationale: 원어는 적대적 방향성을 띤 전치사구이므로 ‘향해’만으로는 약할 수 있어, 본문에서는 동사 ‘꾸미다’와 결합해 적대성을 드러냈습니다. יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 반영했습니다.
- source_word: בְּלִיָּעַל
  english_pob_choice: a counselor of worthlessness
  chosen_korean: 무가치한 조언자
  alternatives_korean:
  - 무가치함의 조언자
  - 벨리알의 조언자
  - 악한 조언자
  lexicon: HALOT
  rationale: 이 단어는 여기서 고유명사보다 ‘무가치함/비천함’의 질적 의미가 더 자연스러워, 본문에서는 ‘무가치한’으로 처리해 원문의 평가절을 살렸습니다. ‘조언자’는 앞의 분사와 병렬되는 명사적 호칭을 반영합니다.
theological_decisions:
- issue: בְּלִיָּעַל을 고유명사 ‘벨리알’로 볼지 여부
  chosen_reading: 본문은 질적 의미인 ‘무가치한’으로 두고, 고유명사 해석은 본문 밖 가능성으로 남겨 둡니다.
  alternative_readings:
  - 벨리알
  - 비천함/사악함
  rationale: 문맥상 이 인물의 성격을 규정하는 표현으로 읽는 것이 가장 직접적이며, 후기의 인격화·악마화된 ‘벨리알’ 개념을 본문에 미리 투입할 필요가 없습니다. 다만 전통 번역을 아는 독자를 위해 대안 가능성은 열어 두었습니다.
  doctrine_reference: 원어 우선, 후대 신학적 전개를 본문에 과잉투사하지 않기
