id: NAM.1.9
reference: Nahum 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה תְּחַשְּׁבוּ/ן֙ אֶל יְהוָ֔ה כָּלָ֖ה ה֣וּא עֹשֶׂ֑ה לֹֽא תָק֥וּם פַּעֲמַ֖יִם צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/009.yaml
  text: What are you plotting against Yahweh? He will make a complete end[b][a]; trouble will not rise up a second time.
  footnotes:
  - marker: a
    text: Or, 'What do you devise against the LORD?' The verb can mean 'think,' 'devise,' or 'plot.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Affliction will not arise twice,' or 'Distress will not come a second time.' The Hebrew is concise and may refer either to the enemy's assault or to the need for repeated judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 여호와를 거슬러 무엇을 꾀하느냐? 그분은 완전한 멸절을 이루실 것이며[a][b], 환난은 두 번째로 일어나지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘완전한 멸절’은 히브리어 כָּלָה의 ‘끝/완성’과 심판 문맥의 ‘멸절’ 뉘앙스를 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘환난은 두 번째로 일어나지 않을 것입니다’는 ‘환난이 다시 일어나지 않는다’는 뜻을 유지하면서도 히브리어의 압축성을 살린 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  english_pob_choice: What
  chosen_korean: 무엇을
  alternatives_korean:
  - 왜
  lexicon: HALOT
  rationale: 수사적 질문을 여는 의문사로, 히브리어의 직접성을 살려 ‘무엇을’로 옮겼습니다.
- source_word: תְּחַשְּׁבוּן
  english_pob_choice: are you plotting
  chosen_korean: 꾀하느냐
  alternatives_korean:
  - 도모하느냐
  - 생각하느냐
  - 음모를 꾸미느냐
  lexicon: HALOT
  rationale: חשׁב는 ‘생각하다/계획하다/꾀하다’의 뜻을 가지며, כאן에서는 여호와를 향한 적대적 도모가 문맥상 분명하므로 과도하게 풀지 않고 ‘꾀하다’로 반영했습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 여호와를 거슬러
  alternatives_korean:
  - 여호와를 향하여
  - 여호와에 대하여
  lexicon: HALOT
  rationale: אֶל이 기본적으로 ‘~에게/~을 향하여’이지만, 도모의 대상이 여호와인 적대 문맥에서는 ‘거슬러’가 가장 자연스럽고 정확합니다.
- source_word: כָּלָה
  english_pob_choice: a complete end
  chosen_korean: 완전한 멸절
  alternatives_korean:
  - 완전한 끝
  - 완전한 종말
  - 완결된 파멸
  lexicon: HALOT
  rationale: כָּלָה는 ‘끝/완성’과 ‘멸절’의 뉘앙스를 함께 가지므로, 판단의 문맥에서 두 요소를 모두 살리는 ‘완전한 멸절’을 택했습니다.
- source_word: פַּעֲמַיִם צָרָה
  english_pob_choice: trouble will not rise up a second time
  chosen_korean: 환난은 두 번째로 일어나지 않을 것입니다
  alternatives_korean:
  - 환난이 두 번 일어나지 않을 것입니다
  - 재난이 다시 일어나지 않을 것입니다
  - 고난이 두 번 닥치지 않을 것입니다
  lexicon: HALOT
  rationale: פַּעֲמַיִם는 ‘두 번째로/두 번’, צָרָה는 ‘환난/고난/재난’의 폭을 가지며, 영어 본문의 선택을 따라 반복되지 않는 재앙의 성격을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 대상과 반복성의 여지
  chosen_reading: 여호와의 심판이 결정적이어서, 그분이 ‘완전한 멸절’을 이루시면 환난은 다시 일어나지 않는다는 뜻으로 살렸습니다.
  alternative_readings:
  - 원수의 공격이 두 번째로 일어나지 않는다는 뜻
  - 하나님의 백성에게 환난이 다시 임하지 않는다는 뜻
  rationale: צָרָה는 문맥상 누구에게 닥치는 재난인지 압축적으로 남겨 두므로, 어느 한 해석으로 지나치게 좁히지 않고 심판의 최종성을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
