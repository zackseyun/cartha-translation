id: NAM.1.2
reference: Nahum 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ל קַנּ֤וֹא וְ/נֹקֵם֙ יְהוָ֔ה נֹקֵ֥ם יְהוָ֖ה וּ/בַ֣עַל חֵמָ֑ה נֹקֵ֤ם יְהוָה֙ לְ/צָרָ֔י/ו וְ/נוֹטֵ֥ר ה֖וּא לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/002.yaml
  text: Yahweh is a jealous and avenging God[a]; Yahweh is avenging and full of wrath. Yahweh takes vengeance on his adversaries[c][b], and he keeps wrath for his enemies.
  footnotes:
  - marker: a
    text: Or 'zealous' for 'jealous.' The Hebrew term denotes covenantal zeal and exclusivity.
    reason: lexical_alternative
  - marker: b
    text: Literally 'master/possessor of wrath.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he reserves wrath for his enemies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 질투하시며[a] 보복하시는 하나님이십니다. 야훼는 보복하시며 진노가 충만하십니다[b]. 야훼는 그의 대적들에게 보복하시고, 그의 원수들을 향해 진노를 간직하십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열심이 있으시며’로 옮길 수 있습니다. 이 히브리어는 언약 관계에서의 배타성과 열심을 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘진노의 주인’ 또는 ‘진노의 소유자’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 원수들을 위하여 진노를 남겨 두십니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: HALOT
  rationale: 문맥에서 אֵל은 뒤따르는 성품 진술들의 주어 역할을 하므로, 하나님의 정체를 직접 드러내는 ‘하나님’이 가장 자연스럽습니다.
- source_word: קַנּוֹא
  english_pob_choice: jealous
  chosen_korean: 질투하시는
  alternatives_korean:
  - 열심이 있는
  - 열정적인
  lexicon: HALOT
  rationale: 언약적 배타성과 열심을 담는 표현이므로, 영어 POB의 ‘jealous’를 따라 ‘질투하시는’으로 옮기되 부정적 감정만으로 좁아지지 않게 했습니다.
- source_word: נֹקֵם / וְנֹקֵם
  english_pob_choice: avenging / takes vengeance
  chosen_korean: 원수 갚으시는 / 복수하시고
  alternatives_korean:
  - 보복하시는 / 응징하시고
  - 앙갚음하시는 / 갚아주고
  lexicon: HALOT
  rationale: 반복되는 נקם의 동사를 살려 행동의 지속성과 강조를 드러내기 위해, 한 곳은 형용적·서술적으로 ‘원수 갚으시는’, 다른 곳은 동사적으로 ‘복수하시고’로 옮겼습니다.
- source_word: וּבַעַל חֵמָה
  english_pob_choice: full of wrath
  chosen_korean: 진노가 충만하신
  alternatives_korean:
  - 분노가 가득하신
  - 진노를 지니신
  lexicon: HALOT
  rationale: בעל חֵמָה는 직역하면 ‘진노의 소유자/주인’이지만, 한국어에서는 그 의미를 자연스럽게 담는 관용적 표현인 ‘진노가 충만하신’이 가장 적절합니다.
- source_word: לְצָרָיו
  english_pob_choice: on his adversaries
  chosen_korean: 그의 대적들에게
  alternatives_korean:
  - 그의 원수들에게
  - 그의 적들에게
  lexicon: HALOT
  rationale: צָרִים은 단순한 일반적 반대자가 아니라 대립하는 적대자를 가리키므로, ‘대적’이 관계적 적대성을 더 정확히 드러냅니다.
- source_word: וְנוֹטֵר ... לְאֹיְבָיו
  english_pob_choice: he keeps wrath for his enemies
  chosen_korean: 그의 원수들을 향해 진노를 간직하십니다
  alternatives_korean:
  - 그의 원수들을 위해 진노를 보관하십니다
  - 그의 원수들에게 진노를 쌓아 두십니다
  lexicon: HALOT
  rationale: נטר는 단순 보유보다 ‘간직하다/붙들어 두다’의 뉘앙스가 있어, 영어 POB의 ‘keeps wrath’와 함께 그 지속적 보유의 의미를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 하나님의 질투 표현
  chosen_reading: ‘질투’는 단순한 시기심이 아니라 언약적 배타성과 열심을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘열심이 있는 하나님’으로 순화하기
  - ‘시기하시는’으로 더 부드럽게 옮기기
  rationale: 히브리어 קַנּוֹא의 신학적 긴장을 약화시키지 않기 위해, 전통적이면서도 원문의 강한 의미를 보존하는 ‘질투하시는’ 표현을 택했습니다.
  doctrine_reference: 언약적 배타성과 하나님의 거룩한 열심
- issue: 진노와 복수 언어
  chosen_reading: 원문의 반복적 נקם과 חֵמָה를 약화하지 않고 그대로 강하게 드러냈습니다.
  alternative_readings:
  - ‘벌하시는’ 또는 ‘노하시는’으로 완화하기
  rationale: 이 구절은 하나님의 न्याय적 심판과 적대자에 대한 응보를 강조하므로, 정서적 완곡어보다 소스의 강도를 보존하는 번역이 필요합니다.
  doctrine_reference: 하나님의 공의로운 심판
