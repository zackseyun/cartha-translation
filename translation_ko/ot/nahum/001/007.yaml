id: NAM.1.7
reference: Nahum 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֣וֹב יְהוָ֔ה לְ/מָע֖וֹז בְּ/י֣וֹם צָרָ֑ה וְ/יֹדֵ֖עַ חֹ֥סֵי בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/007.yaml
  text: Yahweh is good[a], a stronghold in the day of distress[c][b]; he knows those who take refuge in him.
  footnotes:
  - marker: a
    text: Or 'a refuge' or 'a fortress' for 'a stronghold.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the day of trouble.'
    reason: lexical_alternative
  - marker: c
    text: Or 'those who trust in him.' The Hebrew more literally speaks of taking refuge in him.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 좋으십니다[a], 환난의 날에 견고한 산성이시며[b] 그에게 피하는 자들을 아십니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋으십니다’는 טוֹב의 넓은 선함·호의·유익의 의미를 자연스러운 한국어로 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘산성’은 ‘피난처’ 또는 ‘요새’로도 옮길 수 있으나, 보호의 견고함을 살리기 위해 채택했습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그에게 피하는 자들’을 말하므로, 단순한 ‘신뢰하는 자들’보다 은유를 더 가깝게 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 좋으십니다
  alternatives_korean:
  - 선하십니다
  - 인자하십니다
  lexicon: HALOT
  rationale: 야훼의 성품을 넓은 도덕적·호의적 의미로 진술하는 형용사로, 한국어에서는 간결하고 자연스러운 ‘좋으십니다’가 본문 힘을 가장 सीधे 살립니다.
- source_word: לְמָעוֹז
  english_pob_choice: a stronghold
  chosen_korean: 견고한 산성
  alternatives_korean:
  - 피난처
  - 요새
  lexicon: HALOT
  rationale: ‘מָעוֹז’의 방어적·보호적 이미지를 살리면서 한국어 성경에서 익숙한 ‘산성’ 표현을 유지하되, 형용사를 덧붙여 강한 보호의 뉘앙스를 분명히 했습니다.
- source_word: בְּיוֹם צָרָה
  english_pob_choice: in the day of distress
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 고난의 날에
  - 곤란한 날에
  lexicon: HALOT
  rationale: 시적·예언적 문맥에서 צָרָה는 단순한 불편보다 더 강한 압박과 위기를 가리키므로 ‘환난’이 가장 적절하며, 관용적 시간 표현으로 자연스럽게 옮겼습니다.
- source_word: חֹסֵי בוֹ
  english_pob_choice: those who take refuge in him
  chosen_korean: 그에게 피하는 자들
  alternatives_korean:
  - 그를 신뢰하는 자들
  - 그 안에 피신하는 자들
  lexicon: HALOT
  rationale: חסה의 핵심은 ‘의지한다’보다 ‘피하여 몸을 숨기다’는 은유이므로, 보호처 이미지와 연결되는 ‘피하는 자들’로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름의 처리
  chosen_reading: יהוה를 야훼로 음역하여 하나님의 고유한 이름을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 칭호가 아니라 테트라그라마톤을 직접 사용하므로, 대체 칭호보다 고유 이름을 보존하는 번역이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘환난의 날’의 범위
  chosen_reading: 특정 종말론적 날로 확정하지 않고 일반적인 위기의 때로 읽었습니다.
  alternative_readings:
  - 종말의 환난의 날
  - 특정한 심판의 날
  rationale: 문맥상 본문 자체는 보편적·관용적 시간 표현을 사용하므로, 본문이 말하지 않는 종말론적 특정을 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy: Never import doctrinal claims the text does not make.'
