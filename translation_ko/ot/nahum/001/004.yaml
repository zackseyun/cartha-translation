base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/004.yaml
  text: He rebukes the sea and dries it up; he makes all the rivers run dry[a]. Bashan and Carmel wither; even the blossom of Lebanon withers.
  footnotes:
  - marker: a
    text: Or, 'he dries up all the rivers.' The Hebrew verb can be rendered more directly this way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 바다를 꾸짖으시고 그것을 말리시며, 모든 강을 메마르게 하십니다[a]. 바산과 갈멜은 시들고, 레바논의 꽃도 시듭니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 모든 강을 메마르게 하십니다.’ 히브리어 동사는 더 직접적으로 이렇게 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹעֵר
  english_pob_choice: rebukes
  chosen_korean: 꾸짖으시고
  alternatives_korean:
  - 책망하시고
  - 꾸짖으시며
  lexicon: HALOT
  rationale: גער의 강한 책망/질책 의미를 살리되, 자연현상에 대한 하나님의 주권적 명령을 드러내는 동사로 ‘꾸짖으시고’를 택했습니다.
- source_word: בַּיָּם
  english_pob_choice: the sea
  chosen_korean: 바다
  alternatives_korean:
  - 그 바다
  lexicon: HALOT
  rationale: 문맥상 특정 대양이 아니라 혼돈의 물을 가리키는 일반명사이므로, 한국어에서도 ‘바다’로 간결하게 옮겼습니다.
- source_word: וַיַּבְּשֵׁהוּ / וְכָל הַנְּהָרוֹת הֶחֱרִיב
  english_pob_choice: dries it up / makes all the rivers run dry
  chosen_korean: 그것을 말리시며, 모든 강을 메마르게 하십니다
  alternatives_korean:
  - 그것을 말리시고, 모든 강을 말리십니다
  - 모든 강을 마르게 하십니다
  lexicon: HALOT
  rationale: ‘말리다/메마르게 하다’로 물이 완전히 사라지는 이미지를 살렸고, 히필의 사역성을 보존했습니다. POB의 ‘run dry’에 해당하는 결과적 상태도 ‘메마르게’로 전달했습니다.
- source_word: אֻמְלַל / אֻמְלָל
  english_pob_choice: wither / withers
  chosen_korean: 시들고 … 시듭니다
  alternatives_korean:
  - 말라가고 … 말라갑니다
  - 쇠하고 … 쇠합니다
  lexicon: HALOT
  rationale: 식물성 이미지에 가장 자연스럽고 반복되는 병행구조도 살릴 수 있는 표준어로 ‘시들다’를 선택했습니다.
theological_decisions:
- issue: 암시된 주어의 보존
  chosen_reading: 본문의 3인칭 남성 단수 동사를 살려 ‘그가’로 시작해, 앞 문맥의 야훼를 이어받는 주어를 한국어에서 드러냈습니다.
  alternative_readings:
  - ‘주님은’ 또는 ‘야훼는’를 반복해 명시함
  rationale: 히브리어 본문에는 이름이 다시 나오지 않지만, 앞 문맥의 주어가 계속되므로 한국어에서는 서술의 자연스러움을 위해 대명사를 보충했습니다.
  doctrine_reference: 문맥 연속성 유지; 야훼의 주권적 행위 묘사
