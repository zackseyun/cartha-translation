id: NAM.1.13
reference: Nahum 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֶשְׁבֹּ֥ר מֹטֵ֖/הוּ מֵֽ/עָלָ֑יִ/ךְ וּ/מוֹסְרֹתַ֖יִ/ךְ אֲנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/013.yaml
  text: And now I will break his yoke from upon you[a], and I will tear off your bonds.
  footnotes:
  - marker: a
    text: Or 'his bar.' The Hebrew term can denote a rod, bar, or yoke; here 'yoke' best fits the paired imagery of oppression and bonds.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 그의 멍에를 네 위에서 부러뜨리고, 네 결박을 끊어 버리겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מֹטֵה는 ‘멍에’ 외에도 ‘막대’, ‘막대기’, ‘가로막대’ 등을 뜻할 수 있습니다. 여기서는 ‘압제와 결박’의 병행 이미지에 가장 잘 맞는 ‘멍에’를 채택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 그런데 지금
  lexicon: HALOT
  rationale: 시간 전환 표지로서 즉각적인 신적 행동의 개시를 드러내므로, 한국어에서는 간결한 ‘이제’가 가장 자연스럽습니다.
- source_word: מֹטֵהוּ
  english_pob_choice: his yoke
  chosen_korean: 그의 멍에
  alternatives_korean:
  - 그의 막대
  - 그의 지팡이
  - 그의 가로막대
  lexicon: HALOT
  rationale: 문맥상 압제와 예속의 이미지가 결박과 짝을 이루므로, ‘멍에’가 관계적 압박과 종속을 가장 잘 살립니다.
- source_word: מֵעָלַיִךְ
  english_pob_choice: from upon you
  chosen_korean: 네 위에서
  alternatives_korean:
  - 네게서
  - 네 위로부터
  lexicon: HALOT
  rationale: ‘על’이 지닌 ‘위에 놓인 짐’의 이미지를 살리기 위해, 단순한 출처보다 ‘네 위에서’로 옮겼습니다.
- source_word: וּמוֹסְרֹתַיִךְ
  english_pob_choice: your bonds
  chosen_korean: 네 결박
  alternatives_korean:
  - 네 사슬
  - 네 속박
  - 네 족쇄
  lexicon: HALOT
  rationale: 묶어 두는 끈/사슬의 넓은 의미를 가지며, 앞의 ‘멍에’와 병행되는 압제의 도상을 유지합니다.
- source_word: אֲנַתֵּק
  english_pob_choice: I will tear off
  chosen_korean: 끊어 버리겠습니다
  alternatives_korean:
  - 찢어 떼어 버리겠습니다
  - 떼어 내겠습니다
  - 잘라 버리겠습니다
  lexicon: HALOT
  rationale: 강한 분리·절단의 동작을 담되 한국어에서 가장 자연스럽고 단호한 해방 표현으로 전달했습니다.
theological_decisions:
- issue: 3인칭 남성 단수 소유격 'his'의 처리
  chosen_reading: 주어 없는 상태로 ‘그의 멍에’라고만 두어, 압제자의 정체를 본문 밖에서 특정하지 않았습니다.
  alternative_readings:
  - 앗수르의 멍에
  - 그의 쇠막대
  rationale: 히브리어는 3인칭 남성 단수 접미사만 제시하므로, 본문이 명시하지 않은 역사적 식별을 본문에 삽입하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하는 범위를 넘겨 구체화를 더하지 않음
