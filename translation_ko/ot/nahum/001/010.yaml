  text: For though they are tangled like thorns[a], and drenched with their drink[b], they will be consumed like fully dry stubble.
  footnotes:
  - marker: a
    text: 'Hebrew is difficult: the clause rendered ''drenched with their drink'' may also be understood as ''like drunkards drunk with their drink'' or ''like their drunken revelry.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'For while they are tangled like thorns …' The opening particle and preposition form a compressed poetic expression.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 가시덤불처럼 얽혀 있고[a], 그들의 술에 흠뻑 젖어 있으나[b], 완전히 마른 지푸라기처럼 소멸될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 첫머리는 압축된 시적 표현입니다. ‘그들이 가시덤불처럼 얽혀 있는 동안’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 난해합니다. ‘그들의 술에 흠뻑 젖어 있다’는 ‘술 취한 자들처럼 술에 취해 있다’ 또는 ‘그들의 주연(酒宴)과 같다’로도 이해될 수 있습니다.
    reason: lexical_alternative
