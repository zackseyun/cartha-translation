  - ‘불타 버립니다’
  rationale: 예언시에서 완료형은 확정된 장래를 가리킬 수 있으므로, 심판의 필연성을 한국어 미래형으로 분명히 나타냈습니다.
  doctrine_reference: 예언적 완료와 하나님의 확정된 심판
