source:
  edition: WLC
  text: כִּ֚י עַד סִירִ֣ים סְבֻכִ֔ים וּ/כְ/סָבְאָ֖/ם סְבוּאִ֑ים אֻ֨כְּל֔וּ כְּ/קַ֥שׁ יָבֵ֖שׁ מָלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/010.yaml
  text: For though they are tangled like thorns[a], and drenched with their drink[b], they will be consumed like fully dry stubble.
  footnotes:
  - marker: a
    text: 'Hebrew is difficult: the clause rendered ''drenched with their drink'' may also be understood as ''like drunkards drunk with their drink'' or ''like their drunken revelry.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'For while they are tangled like thorns …' The opening particle and preposition form a compressed poetic expression.
    reason: alternative_reading
translation:
  language: ko
  text: For 그들이 가시덤불처럼 얽혀 있고, 그들의 술에 흠뻑 젖어 있으나, 완전히 마른 지푸라기처럼 사라질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 난해합니다. 이 절의 앞부분은 ‘가시덤불처럼 얽혀 있는’ 상태를 가리키는 것으로 이해할 수 있지만, 세부 연결은 여러 방식으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 구절은 ‘술에 흠뻑 젖어 있다’ 외에도 ‘술 취한 자들처럼 취해 있다’ 또는 ‘그들의 주연(酒宴)과 같다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: For
  alternatives_korean:
  - 이는
  - 곧
  lexicon: HALOT
  rationale: 원문의 כִּי는 앞선 진술의 근거를 제시하므로, 한국어 본문에서도 원인·이유를 드러내는 연결을 유지하는 것이 자연스럽습니다.
- source_word: עַד
  english_pob_choice: though
  chosen_korean: -더라도
  alternatives_korean:
  - 하면서도
  - 비록
  lexicon: HALOT
  rationale: 시적 압축이 강한 구절이지만, 문맥상 얽힌 상태와 임박한 심판의 대비를 살리기 위해 양보 의미를 한국어 어미로 표현했습니다.
- source_word: וּכְסָבְאָם סְבוּאִים
  english_pob_choice: and drenched with their drink
  chosen_korean: 그들의 술에 흠뻑 젖어 있으나
  alternatives_korean:
  - 술 취한 자들처럼 술에 취해 있으나
  - 그들의 마시고 취한 상태이나
  lexicon: HALOT
  rationale: 히브리어는 ‘그들의 술’과 ‘취함/마심’이 결합된 난해한 표현이므로, POB의 해석을 따라 ‘흠뻑 젖다’로 이미지와 모호성을 함께 보존했습니다.
- source_word: אֻכְּלוּ
  english_pob_choice: they will be consumed
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 불타 버릴 것입니다
  - 소멸될 것입니다
  lexicon: HALOT
  rationale: 완료형이 예언적 확실성을 나타내므로 미래형으로 옮겼고, 이어지는 마른 지푸라기 이미지와 맞게 ‘소멸’의 의미를 자연스럽게 드러냈습니다.
- source_word: כְּקַשׁ יָבֵשׁ מָלֵא
  english_pob_choice: like fully dry stubble
  chosen_korean: 완전히 마른 지푸라기처럼
  alternatives_korean:
  - 완전히 마른 짚처럼
  - 바싹 마른 짚더미처럼
  lexicon: HALOT
  rationale: קשׁ은 빨리 타버리는 마른 식물 찌꺼기를 가리키므로, 한국어에서는 시각적으로 바로 이해되는 ‘지푸라기’가 가장 적절합니다.
theological_decisions:
- issue: 예언적 완료의 미래 번역
  chosen_reading: ‘אֻכְּלוּ’를 미래형 ‘사라질 것입니다’로 옮겼습니다.
  alternative_readings:
