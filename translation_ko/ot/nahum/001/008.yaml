id: NAM.1.8
reference: Nahum 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/שֶׁ֣טֶף עֹבֵ֔ר כָּלָ֖ה יַעֲשֶׂ֣ה מְקוֹמָ֑/הּ וְ/אֹיְבָ֖י/ו יְרַדֶּף חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/008.yaml
  text: But with an overwhelming flood he will make a complete end of its place[a], and darkness will pursue his enemies.
  footnotes:
  - marker: a
    text: Or 'its place.' The Hebrew has a feminine singular suffix ('her place'), likely personifying the city under judgment; some translations smooth this to 'its place.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 범람하는 홍수로 그곳을[a] 완전히 없애시고, 어둠이 그의 원수들을 뒤쫓을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀의 자리’. 히브리어는 여성 단수 접미사를 사용하며, 심판받는 도시를 의인화한 것일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְשֶׁטֶף עֹבֵר
  english_pob_choice: with an overwhelming flood
  chosen_korean: 범람하는 홍수로
  alternatives_korean:
  - 쏟아져 넘치는 홍수로
  - 거세게 밀려오는 홍수로
  lexicon: HALOT
  rationale: שֶׁטֶף와 עֹבֵר의 결합은 단순한 물의 흐름보다 파괴적으로 넘쳐흐르는 홍수 이미지를 강하게 드러내므로, 자연스럽고 압축적인 표현으로 옮겼습니다.
- source_word: כָּלָה יַעֲשֶׂה
  english_pob_choice: he will make a complete end
  chosen_korean: 완전히 끝장내시고
  alternatives_korean:
  - 완전한 끝을 내시고
  - 철저히 멸망시키시고
  lexicon: HALOT
  rationale: כָּלָה와 עשה의 결합은 단순한 종결이 아니라 완전한 멸절을 뜻하므로, 의미 강도를 살려 ‘완전히 끝장내시고’로 옮겼습니다.
- source_word: מְקוֹמָהּ
  english_pob_choice: its place / her place
  chosen_korean: 그곳을
  alternatives_korean:
  - 그의 자리를
  - 그 도시의 자리로
  lexicon: HALOT
  rationale: 히브리어는 여성 단수 접미사를 쓰지만, 한국어에서는 그 접미사를 그대로 재현하기보다 장소 자체를 가리키는 중립적 표현이 자연스럽습니다. 다만 인격화된 여성형 뉘앙스는 본문 주석으로 보존합니다.
- source_word: וְאֹיְבָיו יְרַדֶּף חֹשֶׁךְ
  english_pob_choice: and darkness will pursue his enemies
  chosen_korean: 어둠이 그의 원수들을 뒤쫓을 것입니다
  alternatives_korean:
  - 어둠이 그의 적들을 추격할 것입니다
  - 어둠이 그의 원수들을 추적할 것입니다
  lexicon: HALOT
  rationale: ‘추격하다/뒤쫓다’는 רדף의 공격적 뉘앙스를 살리며, חֹשֶׁךְ은 예언적 심판의 함의를 지우지 않고 기본 이미지인 ‘어둠’으로 유지했습니다.
theological_decisions:
- issue: ‘그의 원수들’의 지시 대상
  chosen_reading: 문맥상 여호와의 원수들을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 니느웨의 원수들로 이해하는 읽기
  - 모호성을 유지해 지시 대상을 명시하지 않는 읽기
  rationale: 히브리어는 남성 단수 접미사를 쓰며, 문맥상 야훼의 심판 행위와 맞물려 ‘그의 원수들’로 읽는 것이 가장 직접적입니다.
  doctrine_reference: Nahum 1:8 문맥 및 대명사 지시
- issue: ‘그곳’의 인격화 처리
  chosen_reading: 여성 단수 접미사가 암시하는 도시의 인격화는 본문 뜻으로 보존하되, 한국어 본문은 자연스러운 장소 지시로 옮겼습니다.
  alternative_readings:
  - ‘그녀의 자리’로 직역하는 방식
  - ‘그의 자리’로 성 중립화하는 방식
  rationale: 원문은 심판받는 도시/권세를 여성형으로 의인화하지만, 한국어에서는 성별 대명사보다 의미 전달이 중요하므로 본문은 중립적으로, 주석은 원문 형태를 반영하도록 했습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
