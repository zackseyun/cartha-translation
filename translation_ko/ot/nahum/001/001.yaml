base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/001.yaml
  text: An oracle concerning Nineveh[a]. The book of the vision of Nahum the Elkoshite.
  footnotes:
  - marker: a
    text: Or 'burden of Nineveh' or 'pronouncement concerning Nineveh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 니느웨에 대한 예언입니다[a]. 나훔, 곧 엘고스 사람의 환상의 책입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘니느웨에 관한 예언’, ‘니느웨에 대한 선포’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: oracle
  chosen_korean: 예언
  alternatives_korean:
  - 부담
  - 선포
  - 오라클
  lexicon: HALOT, BDB
  rationale: 예언서 표제에서 מַשָּׂא는 무거운 짐이 아니라 예언적 선포를 가리키므로, 현대 한국어에서 자연스럽고 기능적으로 가까운 ‘예언’으로 옮겼습니다.
- source_word: נִינְוֵה
  english_pob_choice: Nineveh
  chosen_korean: 니느웨
  alternatives_korean:
  - 니네베
  - 니느웨성
  lexicon: HALOT, BDB
  rationale: 고유 지명은 한국어 성경에서 널리 쓰이는 표기 ‘니느웨’를 따랐습니다.
- source_word: סֵפֶר חֲזֹון
  english_pob_choice: the book of the vision
  chosen_korean: 환상의 책
  alternatives_korean:
  - 계시의 책
  - 묵시의 책
  lexicon: HALOT, BDB
  rationale: סֵפֶר은 문서/책, חֲזוֹן은 예언적 ‘환상’을 뜻하므로 두 명사를 직결해 표제 구조를 살렸습니다. ‘묵시’는 해석적 뉘앙스가 더 강해 피했습니다.
- source_word: הָאֶלְקֹשִׁי
  english_pob_choice: the Elkoshite
  chosen_korean: 엘고스 사람
  alternatives_korean:
  - 엘고스인
  - 엘고스 출신
  lexicon: HALOT, BDB
  rationale: אָ/הָאֶלְקֹשִׁי의 민족형 형용사는 출신지를 나타내므로, 현대 한국어에서 가장 분명한 ‘엘고스 사람’으로 풀어 썼습니다.
theological_decisions:
- issue: 두 개의 표제절 관계
  chosen_reading: 첫 문장은 니느웨를 향한 예언을, 둘째 문장은 나훔의 환상 기록의 성격을 각각 독립적으로 제시하도록 옮겼습니다.
  alternative_readings:
  - 한 문장으로 합쳐 ‘니느웨의 예언, 엘고스 사람 나훔의 환상의 책’처럼 처리
  - ‘부담’으로 옮겨 전통적 표현을 유지
  rationale: 히브리어는 표제적 명사구 두 개가 병렬된 구조이므로, 한국어에서도 짧은 두 절로 나눠 원문의 서문 기능과 초점 이동을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적 서문/표제의 구조 보존
