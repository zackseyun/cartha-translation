  alternative_readings:
  - 한 문장으로 합쳐 ‘니느웨의 예언, 엘고스 사람 나훔의 환상의 책’처럼 처리
  - ‘부담’으로 옮겨 전통적 표현을 유지
  rationale: 히브리어는 표제적 명사구 두 개가 병렬된 구조이므로, 한국어에서도 짧은 두 절로 나눠 원문의 서문 기능과 초점 이동을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적 서문/표제의 구조 보존
