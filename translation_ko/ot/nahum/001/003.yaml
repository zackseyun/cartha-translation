language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ ו/גדול כֹּ֔חַ וְ/נַקֵּ֖ה לֹ֣א יְנַקֶּ֑ה יְהוָ֗ה בְּ/סוּפָ֤ה וּ/בִ/שְׂעָרָה֙ דַּרְכּ֔/וֹ וְ/עָנָ֖ן אֲבַ֥ק רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/003.yaml
  text: Yahweh is slow to anger and great in power[a], and he will by no means leave the guilty unpunished. Yahweh—his way is in the whirlwind and the storm, and clouds are the dust of his feet.
  footnotes:
  - marker: a
    text: Or, more formally, 'and he will by no means acquit' or 'and he will certainly not clear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 분노하기를 더디하시며 능력이 크시고, 죄 있는 자를 결코 무죄로 돌리지 않으십니다[a]. 야훼—그분의 길은 회오리바람과 폭풍 가운데에 있으며, 구름은 그분의 발의 먼지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그는 결코 무죄로 하지 않으십니다’ 또는 ‘결코 면죄하지 않으십니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה / יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문이 하나님의 이름(YHWH)을 직접 사용하므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지해 고유한 언약 이름을 드러냅니다.
- source_word: אֶרֶךְ אַפַּיִם
  english_pob_choice: slow to anger
  chosen_korean: 분노하기를 더디 하시며
  alternatives_korean:
  - 노하기를 더디 하시며
  - 오래 참으시며
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, ‘분노’의 의미를 분명히 살려 하나님의 인내를 직접적으로 드러냅니다.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  english_pob_choice: he will by no means leave the guilty unpunished
  chosen_korean: 죄 있는 자를 결코 무죄로 돌리지 않으십니다
  alternatives_korean:
  - 죄 있는 자를 결코 용서하지 않으십니다
  - 결코 죄 없다고 하시지 않으십니다
  lexicon: HALOT
  rationale: 중첩 부정의 강한 부정성을 살리면서도, 문맥상 재판적 의미를 유지해 ‘무죄로 돌리다’로 옮겼습니다. POB의 보다 직역적인 대안인 ‘acquit/clear’의 긴장을 반영합니다.
- source_word: בְּסוּפָה וּבִשְׂעָרָה
  english_pob_choice: in the whirlwind and the storm
  chosen_korean: 회오리바람과 폭풍 가운데에
  alternatives_korean:
  - 소용돌이바람과 폭풍 가운데에
  - 회오리와 폭풍 가운데에
  lexicon: HALOT
  rationale: 두 기상현상의 격렬함을 현대 한국어로 보존하면서, 히브리어의 폭풍 이미지가 자연스럽게 전달되도록 했습니다.
- source_word: וְעָנָן אֲבַק רַגְלָיו
  english_pob_choice: clouds are the dust of his feet
  chosen_korean: 구름은 그분의 발먼지입니다
  alternatives_korean:
  - 구름은 그분의 발의 먼지입니다
  - 구름은 그분 발밑의 먼지입니다
  lexicon: HALOT
  rationale: ‘발먼지’는 비유적 압축을 살리면서도 한국어에서 이해 가능한 표현입니다. 구름을 여호와의 행차 아래 일어나는 먼지로 묘사하는 이미지를 유지합니다.
theological_decisions:
- issue: 하나님의 이름 YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 고유 이름을 사용하므로 번역어도 이를 드러내는 것이 원문의 신학적 긴장과 개별성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 의와 심판의 긴장
  chosen_reading: 죄 있는 자를 결코 무죄로 돌리지 않으십니다
  alternative_readings:
  - 죄 있는 자를 결코 용서하지 않으십니다
  - 결코 죄 없다고 하시지 않으십니다
  rationale: 하나님의 오래 참으심과 엄정한 심판을 함께 보존해야 하므로, 심판적 선언을 완화하지 않는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
