revisions:
- from: 야훼께서 당신에 관해 명하셨습니다. 다시는 당신의 이름이 뿌려지지 않을 것입니다. 당신의 신들의 집에서 나는 새긴 우상과 부어 만든 우상을 끊어 버리겠습니다. 나는 당신의 무덤을 마련하겠습니다. 당신이 천대받기 때문입니다.[a][b][c]
  to: 야훼께서 당신에 관하여 명하셨습니다. ‘당신의 이름으로부터는 다시는 씨가 뿌려지지 않을 것입니다.[a] 나는 당신의 신들이 있는 집에서[b] 새긴 우상과 부어 만든 우상을 끊어 버리겠습니다. 내가 당신의 무덤을 마련하겠습니다. 당신이 비천하기 때문입니다.[c]’
  rationale: 원문의 씨 뿌림 은유와 מִשִּׁמְךָ의 출처 관계를 보존하되 한국어 문장으로 이해 가능하게 다듬었습니다. בית 주석의 문자적·문맥적 설명을 바로잡고, 주석 표지를 해당 표현에 연결했습니다. 마지막 절은 원문의 평가적 상태를 유지하도록 ‘비천하다’로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:31Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 심판 선언, 신명 ‘야훼’, 복수형 ‘당신의 신들’, 새긴 형상과 주조한 형상의 구별을 충실히 반영했습니다. 그러나 מִשִּׁמְךָ와 יִזָּרַע의 관계는 ‘당신의 이름이 뿌려지다’보다 ‘당신의 이름으로부터 씨가 뿌려지다’로 옮겨야 원문의 전치사와 ‘씨 뿌림’ 은유를 더 정확히 보존합니다. 마지막 כִּי קַלּוֹתָ는 수동적 사회적 처우만을 뜻한다고 단정하지 않고, 대상이 ‘비천하다/경멸스러운 존재이다’라는 상태로 옮기는 것이 적절합니다.
  naturalness: ‘당신’은 신탁의 직접 수신자를 지시하는 문맥에서 사용할 수 있으며, 합쇼체 문장도 일관됩니다. 다만 ‘당신의 신들의 집’은 문자적이지만 한국어에서는 다소 어색하므로 ‘당신의 신들이 있는 집’으로 하여 복수성과 בית의 의미를 함께 살렸습니다. 각 주석 표지는 해당 표현 바로 뒤에 배치해야 합니다.
  terminology: ‘야훼’, ‘새긴 우상’, ‘부어 만든 우상’, ‘끊어 버리겠습니다’는 적절합니다. בית의 문자적 의미는 ‘집’이며 ‘신전’은 문맥적 번역이므로, 기존 b 주석의 ‘더 문자적으로는 신전’이라는 설명은 정정해야 합니다.
