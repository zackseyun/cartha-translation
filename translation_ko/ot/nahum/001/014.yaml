id: NAM.1.14
reference: Nahum 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צִוָּ֤ה עָלֶ֨י/ךָ֙ יְהוָ֔ה לֹֽא יִזָּרַ֥ע מִ/שִּׁמְ/ךָ֖ ע֑וֹד מִ/בֵּ֨ית אֱלֹהֶ֜י/ךָ אַכְרִ֨ית פֶּ֧סֶל וּ/מַסֵּכָ֛ה אָשִׂ֥ים קִבְרֶ֖/ךָ כִּ֥י קַלּֽוֹתָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/014.yaml
  text: 'Yahweh has commanded concerning you: No more will your name be sown[a]. From the house of your gods I will cut off carved image and cast image. I will make your grave[c][b], for you are contemptible.'
  footnotes:
  - marker: a
    text: Or, 'No more offspring will be sown from your name,' that is, your line or dynasty will not continue.
    reason: lexical_alternative
  - marker: b
    text: Or, 'From the temple of your god.' The Hebrew form can be rendered more literally as 'from the house of your gods.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'for you are vile' or 'for you are insignificant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신에 관해 명하셨습니다. 다시는 당신의 이름이 뿌려지지 않을 것입니다. 당신의 신들의 집에서 나는 새긴 우상과 부어 만든 우상을 끊어 버리겠습니다. 나는 당신의 무덤을 마련하겠습니다. 당신이 천대받기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 이름’은 곧 당신의 계통이나 왕조의 지속을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 더 문자적으로는 ‘신전’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘천대받다’는 ‘비천하다’, ‘경멸받다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה עָלֶיךָ יְהוָה
  english_pob_choice: Yahweh has commanded concerning you
  chosen_korean: 야훼께서 당신에 관해 명하셨습니다
  alternatives_korean:
  - 야훼께서 당신에게 명령하셨습니다
  - 야훼께서 당신을 두고 명하셨습니다
  lexicon: HALOT
  rationale: צוה의 완료적 선언을 살려 과거 완료형으로 옮기고, עַלֶיךָ는 심판 선언의 대상이라는 점을 반영해 ‘관해’로 넓게 렌더링했습니다.
- source_word: לֹא יִזָּרַע מִשִּׁמְךָ עוֹד
  english_pob_choice: No more will your name be sown
  chosen_korean: 다시는 당신의 이름이 뿌려지지 않을 것입니다
  alternatives_korean:
  - 당신의 이름이 더는 퍼지지 않을 것입니다
  - 당신의 이름에서 더는 후손이 나지 않을 것입니다
  lexicon: HALOT
  rationale: ‘뿌리다’의 농경 이미지를 본문에 유지해 원문 투명성을 살렸고, ‘이름’의 지속/계승이라는 함의는 주석적 여지로 남겼습니다.
- source_word: מִבֵּית אֱלֹהֶיךָ
  english_pob_choice: From the house of your gods
  chosen_korean: 당신의 신들의 집에서
  alternatives_korean:
  - 당신의 신전에서
  - 당신의 신의 집에서
  lexicon: HALOT
  rationale: 히브리어 복수형과 2인칭 접미사를 그대로 반영해 ‘신들’로 옮겼고, בַּיִת는 ‘집’의 직역을 유지했습니다.
- source_word: פֶּסֶל וּמַסֵּכָה
  english_pob_choice: carved image and cast image
  chosen_korean: 새긴 우상과 부어 만든 우상
  alternatives_korean:
  - 조각한 우상과 부어 만든 우상
  - 새긴 형상과 주조한 형상
  lexicon: HALOT
  rationale: פֶּסֶל과 מַסֵּכָה의 제작 방식을 드러내어 두 항목의 대비를 살렸으며, 한국어 성경에서 익숙한 ‘우상’으로 의미를 분명히 했습니다.
- source_word: כִּי קַלּוֹתָ
  english_pob_choice: for you are contemptible
  chosen_korean: 당신이 천대받기 때문입니다
  alternatives_korean:
  - 당신이 비천하기 때문입니다
  - 당신이 경멸받기 때문입니다
  lexicon: HALOT
  rationale: קלה의 ‘가볍다/경멸받다’ 계열 의미를 살리되, 심판 문맥에서 자연스러운 결과 이유로 ‘천대받다’를 선택했습니다.
theological_decisions:
- issue: 야훼의 고유명 표기
  chosen_reading: 이 구절의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명기를 쓰므로 호칭 대체보다 고유명 보존이 원문과 POB 원칙에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֱלֹהֶיךָ의 복수성
  chosen_reading: 문법형 복수에 따라 ‘당신의 신들’로 옮겼습니다.
  alternative_readings:
  - 당신의 신
  - 당신의 하나님
  rationale: 문맥상 우상 심판이며 형태상 복수이므로 단수화하지 않고 다신교적 배경을 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
