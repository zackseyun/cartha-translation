base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/006.yaml
  text: Who can stand before his indignation? And who can rise up in the heat of his anger? His wrath is poured out like fire[c][b][a], and the rocks are shattered by him.
  footnotes:
  - marker: a
    text: Or 'Who can endure before his indignation? And who can stand in the burning of his anger?'
    reason: lexical_alternative
  - marker: b
    text: Or 'the cliffs' or 'the crags' for 'the rocks.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the rocks are shattered by him' or 'from him.' The Hebrew preposition may express agency or source.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 분노 앞에 누가 설 수 있겠습니까? 그의 진노의 뜨거움 속에서 누가 일어설 수 있겠습니까? 그의 분노는 불처럼 쏟아지고, 바위들은 그로 말미암아 산산이 부서집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 분노 앞에서 누가 견딜 수 있겠습니까? 그의 진노의 타오름 속에서 누가 설 수 있겠습니까?'
    reason: lexical_alternative
  - marker: b
    text: 또는 '바위들' 대신 '절벽들' 또는 '바위벼랑들'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그로 말미암아'의 의미는 원인이나 행위자를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에
  alternatives_korean:
  - 면전에서
  - 존전에서
  lexicon: HALOT
  rationale: 심판 앞에 선다는 공간적·관계적 의미를 자연스럽게 살리되, 현대 한국어에서 가장 직접적인 표현으로 옮겼습니다.
- source_word: זַעְמוֹ
  english_pob_choice: his indignation
  chosen_korean: 분노
  alternatives_korean:
