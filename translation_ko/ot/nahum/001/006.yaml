  - 격노
  lexicon: HALOT
  rationale: 여기서는 하나님을 향한 도덕적 책망과 심판의 뉘앙스가 함께 있어, 일반적이지만 강한 감정의 표현인 '분노'를 택했습니다.
- source_word: חֲרוֹן אַפּוֹ
  english_pob_choice: in the heat of his anger
  chosen_korean: 진노의 뜨거움 속에서
  alternatives_korean:
  - 그의 분노의 불길 속에서
