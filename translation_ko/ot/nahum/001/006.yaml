translation:
  language: ko
  text: 그의 분노 앞에서 누가 설 수 있겠습니까? 그의 진노가 타오를 때에 누가 일어설 수 있겠습니까?[a] 그의 진노는 불처럼 쏟아지고, 바위들[b]은 그로 말미암아[c] 산산이 부서집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 분노 앞에서 누가 견딜 수 있겠습니까? 그의 타오르는 진노 앞에서 누가 설 수 있겠습니까?’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘절벽들’ 또는 ‘바위벼랑들’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 전치사는 행위자(‘그에 의해’) 또는 근원·원인(‘그에게서’, ‘그 때문에’)을 나타낼 수 있습니다.
    reason: lexical_alternative
