  lexicon: HALOT
  rationale: 히브리어의 '타오름/열기' 이미지를 살리기 위해 '뜨거움'을 유지했고, 병렬 구조를 위해 장소적 표현으로 옮겼습니다.
- source_word: נִתְּכָה
  english_pob_choice: is poured out
  chosen_korean: 쏟아지고
  alternatives_korean:
  - 쏟아집니다
  - 퍼부어집니다
  lexicon: HALOT
  rationale: 심판의 액체적 비유를 살리면서, 현대 한국어에서 자연스럽고 시각적인 동사로 옮겼습니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: by him
  chosen_korean: 그로 말미암아
  alternatives_korean:
  - 그에 의해
  - 그 때문에
  lexicon: HALOT
  rationale: 말미암음은 원인·기원을 함께 드러내므로, 전치사의 주어적/출처적 여지를 과도하게 좁히지 않으면서도 종결문에 적합합니다.
theological_decisions:
- issue: 하나님의 분노 표현의 번역 강도
  chosen_reading: זַעַם, חֵמָה 계열을 각각 '분노'와 '진노'로 나누어, 동일어 반복으로 평준화하지 않았습니다.
  alternative_readings:
  - 모두 '진노'로 통일
  - 모두 '분노'로 통일
  rationale: 본문은 분노 어휘를 중첩해 심판의 격렬함을 드러내므로, 한국어에서도 의미 차이를 조금 나누어 시적 긴장과 강도를 보존했습니다.
  doctrine_reference: 번역 철학 항목 5, 6
