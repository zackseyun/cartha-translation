  - 모두 '분노'로 통일
  rationale: 본문은 분노 어휘를 중첩해 심판의 격렬함을 드러내므로, 한국어에서도 의미 차이를 조금 나누어 시적 긴장과 강도를 보존했습니다.
  doctrine_reference: 번역 철학 항목 5, 6
