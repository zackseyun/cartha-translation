  text: 'It is fixed: she is stripped bare[a], she is carried away; and her slave girls are led off, moaning like the sound of doves[b], beating on their hearts.'
  footnotes:
  - marker: a
    text: Or 'she is uncovered' or 'she is exiled'; the Hebrew is difficult and may combine humiliation and deportation imagery.
    reason: alternative_reading
  - marker: b
    text: Literally 'on their hearts'; the phrase may idiomatically refer to beating their breasts in mourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 정해졌습니다. 그녀는 벌거벗겨져[a] 끌려가고, 그녀의 여종들은 비둘기 소리처럼 신음하며 가슴을 칩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀는 드러납니다’, ‘그녀는 추방됩니다’. 히브리어는 어렵고, 수치의 노출과 강제 이주의 이미지를 함께 담을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들의 마음 위에’입니다. 문맥상 애도하며 가슴을 치는 것을 가리키는 관용적 표현일 수 있습니다.
    reason: lexical_alternative
