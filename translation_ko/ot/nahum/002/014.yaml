source:
  edition: WLC
  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/הִבְעַרְתִּ֤י בֶֽ/עָשָׁן֙ רִכְבָּ֔/הּ וּ/כְפִירַ֖יִ/ךְ תֹּ֣אכַל חָ֑רֶב וְ/הִכְרַתִּ֤י מֵ/אֶ֨רֶץ֙ טַרְפֵּ֔/ךְ וְ/לֹֽא יִשָּׁמַ֥ע ע֖וֹד ק֥וֹל מַלְאָכֵֽ/כֵה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/014.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will burn your chariots in smoke; the sword will devour your young lions. I will cut off your prey from the earth[c][b], and the voice of your messengers will no longer be heard.
  footnotes:
  - marker: a
    text: Or 'into smoke'; the Hebrew phrase may emphasize either the manner of burning ('in smoke') or the result ('into smoke').
    reason: lexical_alternative
  - marker: b
    text: '''Young lions'' continues Nineveh''s lion imagery; it likely refers metaphorically to her warriors or rulers.'
    reason: cultural_note
  - marker: c
    text: Or 'envoys.' The Hebrew word can denote human messengers sent on official business.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 너를 대적합니다. 만군의 야훼의 말입니다. 내가 너의 병거를 연기 속에서 불태우고, 네 젊은 사자들은 칼이 먹어 치울 것입니다. 내가 땅에서 네 먹이를 끊어 버리면, 네 사자들의 소리가 다시는 들리지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘연기 속에서’는 불태우는 방식과 그 결과를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젊은 사자들’은 니느웨의 전사나 통치자를 비유적으로 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘사자들’은 히브리어 מַלְאָךְ의 문맥상 인간 사절을 가리킨다고 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보십시오, 내가 너를 대적합니다
  alternatives_korean:
  - 보라, 내가 너를 대적합니다
  - 내가 너를 대적하고 있습니다
  lexicon: HALOT
  rationale: 히브리어의 주의를 환기하는 선언문을 현대 한국어에서는 ‘보십시오’로 살리되, אֵלַיִךְ의 적대적 방향을 ‘대적합니다’로 분명히 옮겼습니다.
- source_word: נְאֻם יְהוָה צְבָא֔וֹת
  english_pob_choice: declares Yahweh of hosts
  chosen_korean: 만군의 야훼의 말입니다
  alternatives_korean:
  - 만군의 야훼께서 말씀하십니다
  - 만군의 야훼의 선언입니다
  lexicon: HALOT
  rationale: נְאֻם의 예언적 공식을 한국어에서는 ‘말입니다’로 자연스럽게 풀었고, יְהוָה צְבָאוֹת는 본 프로젝트 기본어인 ‘야훼’와 ‘만군’을 유지했습니다.
- source_word: בֶעָשָׁן
  english_pob_choice: in smoke
  chosen_korean: 연기 속에서
  alternatives_korean:
  - 연기로
  - 연기 가운데서
  lexicon: HALOT
  rationale: 전치사 ב의 의미를 장소/상태로 살려, 불태움의 방식과 결과를 모두 함축할 수 있는 ‘연기 속에서’로 옮겼습니다.
- source_word: וּכְפִירַיִךְ
  english_pob_choice: your young lions
  chosen_korean: 네 젊은 사자들
  alternatives_korean:
  - 네 어린 사자들
  - 네 새끼 사자들
  lexicon: HALOT
  rationale: 직역되는 ‘young lions’의 사자 이미지를 보존하되, 한국어에서 자연스럽고 품위 있게 읽히도록 ‘젊은 사자들’로 옮겼습니다.
- source_word: מַלְאָכֵכֵה
  english_pob_choice: your messengers
  chosen_korean: 네 사자들
  alternatives_korean:
  - 네 사절들
  - 네 전령들
  lexicon: HALOT
  rationale: 문맥상 인간 사절을 가리키므로 ‘messengers’의 기본 의미를 살리되, 반복되는 사자 이미지와의 연결을 드러내기 위해 ‘사자들’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה צְבָאוֹת의 호칭 표기
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 주 만군
  - 만군의 여호와
  rationale: 본문의 신명 표기를 번역하지 않고 본 프로젝트 기본값인 ‘야훼’로 보존하여, 예언자의 심판 선언이 신적 발화임을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
