id: NAM.2.1
reference: Nahum 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙ מַשְׁמִ֣יעַ שָׁל֔וֹם חָגִּ֧י יְהוּדָ֛ה חַגַּ֖יִ/ךְ שַׁלְּמִ֣י נְדָרָ֑יִ/ךְ כִּי֩ לֹ֨א יוֹסִ֥יף ע֛וֹד ל/עבור בָּ֥/ךְ בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/001.yaml
  text: Look[a], on the mountains are the feet of one who brings good news, who announces peace. Celebrate your festivals, Judah; fulfill your vows[b], for the worthless one will never again pass through you; he is completely cut off.
  footnotes:
  - marker: a
    text: Or 'the feet of a messenger of good news.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the wicked one'; traditionally, 'Belial.'
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 산들 위에 좋은 소식을 전하는 이의 발이 있습니다. 그는 평강을 알립니다. 유다야, 네 절기를 지키고 네 서원을 갚아라. 다시는 무가치한 자가 너를 지나가지 못할 것이며, 그는 완전히 끊어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋은 소식을 전하는 이의 발’ 또는 ‘좋은 소식을 전하는 사자의 발’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벨리알’, 전통적으로는 ‘사악한 자’로도 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서 현대 합쇼체에서 자연스럽게 긴박한 시선을 요구하는 표현으로 옮겼습니다.
- source_word: רַגְלֵי מְבַשֵּׂר / מַשְׁמִיעַ שָׁלוֹם
  english_pob_choice: the feet of one who brings good news, who announces peace
  chosen_korean: 좋은 소식을 전하는 이의 발... 그는 평강을 알립니다
  alternatives_korean:
  - 좋은 소식을 전하는 사람의 발... 평강을 선포합니다
  - 기쁜 소식을 전하는 이의 발... 평화를 알립니다
  lexicon: HALOT
  rationale: ‘발’의 구체적 이미지를 살리고, מְבַשֵּׂר는 ‘좋은 소식을 전하는 이’로, שָׁלוֹם은 POB의 ‘peace’에 맞추되 언약적 뉘앙스를 살려 ‘평강’으로 옮겼습니다.
- source_word: חָגִּי יְהוּדָה חַגַּיִךְ שַׁלְּמִי נְדָרָיִךְ
  english_pob_choice: Celebrate your festivals, Judah; fulfill your vows
  chosen_korean: 유다야, 네 절기를 지키고 네 서원을 갚아라
  alternatives_korean:
  - 유다야, 네 절기를 지키라 그리고 네 서원을 이행하라
  - 유다야, 네 명절을 지키고 네 서원을 이루어라
  lexicon: HALOT
  rationale: חָג는 절기/축제의 종교적 준수를 가리키므로 ‘절기’를 택했고, נדר는 제의적 의무를 포함해 한국어 관용에 맞게 ‘서원’으로 옮겼습니다. POB의 ‘celebrate’는 단순 감정 표현이 아니라 절기 준수 명령으로 이해했습니다.
- source_word: בְּלִיַּעַל
  english_pob_choice: the worthless one
  chosen_korean: 무가치한 자
  alternatives_korean:
  - 사악한 자
  - 벨리알
  lexicon: HALOT
  rationale: 본문의 인물/대상을 악마적 고유명사로 확정하지 않고, POB의 공통명사적 판단을 따라 경멸적 평가를 드러내는 표현으로 옮겼습니다.
- source_word: כֻּלֹּה נִכְרָת
  english_pob_choice: he is completely cut off
  chosen_korean: 완전히 끊어졌습니다
  alternatives_korean:
  - 모두 끊어졌습니다
  - 철저히 잘려 나갔습니다
  lexicon: HALOT
  rationale: 완전성을 나타내는 כֻּלֹּה를 반영해 종결적 파괴를 드러내되, 한국어에서는 자연스럽고 간결한 종결형으로 정리했습니다.
theological_decisions:
- issue: בְּלִיַּעַל을 고유명사 ‘벨리알’로 읽을지, 경멸적 일반명사로 읽을지
  chosen_reading: 본문 본문에는 ‘무가치한 자’로 두어, 적대자를 경멸적으로 규정하는 일반명사적 의미를 살렸습니다.
  alternative_readings:
  - 벨리알
  - 사악한 자
  rationale: 예언 본문 맥락에서 후대적 악령 개념을 끌어들이기보다, 원문이 청중에게 전달하려는 멸시와 심판 선언을 직접적으로 재현하는 편이 더 स्रोत-직결적입니다.
  doctrine_reference: 원어 우선과 문맥 우선의 원칙을 유지하며, 신학적 해석을 본문 번역에 과도하게 고정하지 않습니다.
