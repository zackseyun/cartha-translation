revisions:
- from: 보십시오, 산들 위에 좋은 소식을 전하는 이의 발이 있습니다. 그는 평강을 알립니다. 유다야, 네 절기를 지키고 네 서원을 갚아라. 다시는 무가치한 자가 너를 지나가지 못할 것이며, 그는 완전히 끊어졌습니다.[a][b]
  to: 보십시오, 산들 위에 좋은 소식을 전하는 이의 발[a]이 있습니다. 그는 평화를 알립니다. 유다여, 절기를 지키고 서원을 이행하십시오. 무가치한 자[b]가 다시는 당신을 지나가지 않을 것이며, 그는 완전히 끊어졌습니다.
  rationale: 합쇼체를 일관되게 적용하고, 미래 부정의 의미를 보존하도록 ‘지나가지 않을 것입니다’로 고쳤습니다. שָׁלוֹם은 현대 표준어 ‘평화’로 옮겼습니다. 유다의 소유 표현은 한국어에서 자연스럽게 생략했으며, 지시 대상은 문맥상 ‘당신’으로 명시했습니다. 각주들은 실제 대안을 제공하고 해당 본문어에 직접 연결하도록 수정했으며, 벨리알 관련 전통적 독해의 설명 순서를 POB 감사 기록에 맞췄습니다.
  reviewer_model: gpt-5.6-terra
