  rationale: 고유명사는 현대 외래어 표기 기준에 따라 옮기되, 성경에서 널리 알려진 전통형 ‘느웨’를 사용해 식별성과 가독성을 함께 살렸습니다.
- source_word: כִבְרֵכַת מַיִם
