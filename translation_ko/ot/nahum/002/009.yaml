  - ‘서시오! 서시오!’처럼 옛말식 명령형으로 옮김
  rationale: 히브리어 명령문은 전투적·긴급한 외침이므로, 현대 한국어에서 가장 즉각적인 제지 표현인 ‘멈추어라’를 사용해 장면의 긴박성을 보존했습니다.
  doctrine_reference: 시적 예언문체와 전쟁 서술의 화법
