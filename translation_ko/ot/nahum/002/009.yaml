  text: וְ/נִינְוֵ֥ה כִ/בְרֵֽכַת מַ֖יִם מִ֣/ימֵי הִ֑יא וְ/הֵ֣מָּה נָסִ֔ים עִמְד֥וּ עֲמֹ֖דוּ וְ/אֵ֥ין מַפְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/009.yaml
  text: Nineveh has been like a pool of water from her earliest days[a], yet they are fleeing[b]. “Stop! Stop!”—but no one turns back.
  footnotes:
  - marker: a
    text: Or “Stand! Stand!” The Hebrew imperatives can be rendered more literally this way; “Stop! Stop!” brings out the sense in a flight scene.
    reason: lexical_alternative
  - marker: b
    text: Literally, “from the days she was,” an idiom meaning from Nineveh’s earliest existence or long-standing past.
    reason: lexical_alternative
translation:
  language: ko
  text: 느웨는 처음부터 물웅덩이 같았습니다[a]. 그러나 그들은 도망하고 있습니다[b]. "멈추어라! 멈추어라!"—그러나 뒤로 돌아보는 자가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그녀가 있던 날들로부터’라는 뜻으로, 느웨의 오래된 존속이나 초기 상태를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘그들은 도망하고 있습니다’로도 옮길 수 있으나, POB는 긴박한 도주 장면의 현재 진행감을 살려 이렇게 풀었습니다.
    reason: lexical_alternative
