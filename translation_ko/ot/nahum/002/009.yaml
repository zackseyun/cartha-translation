- source_word: מִימֵי הִיא
  english_pob_choice: from her earliest days
  chosen_korean: 처음부터
  alternatives_korean:
  - 그녀가 있던 날부터
  - 오래전부터
  - 그 존재하던 날들부터
  lexicon: HALOT
  rationale: 직역하면 ‘그녀가 있던 날들로부터’이지만, 관용적으로는 느웨의 오랜 존속과 초기 상태를 가리키므로 ‘처음부터’로 압축해 의미를 살렸습니다.
- source_word: עִמְדוּ עֲמֹדוּ
  english_pob_choice: Stop! Stop!
  chosen_korean: 멈추어라! 멈추어라!
  alternatives_korean:
  - 서라! 서라!
  - 멈춰라! 멈춰라!
  - 그 자리에 서라! 그 자리에 서라!
  lexicon: HALOT
  rationale: 도주 장면에서 반복 명령의 긴박함을 살리기 위해 ‘서라’보다 즉각적 제지의 뉘앙스가 강한 ‘멈추어라’를 택했습니다.
- source_word: וְאֵין מַפְנֶה
  english_pob_choice: but no one turns back
  chosen_korean: 뒤로 돌아보는 자가 없습니다
  alternatives_korean:
  - 돌아서는 자가 없습니다
  - 뒤돌아보는 자가 없습니다
  - 되돌아오는 자가 없습니다
  lexicon: HALOT
  rationale: 어근 פנה의 ‘돌이켜서 돌아감’을 한국어 동작 표현으로 풀어, 단순 시선 이동이 아니라 후퇴·회귀의 부정을 드러냈습니다.
