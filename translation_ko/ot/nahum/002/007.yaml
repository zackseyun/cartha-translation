  rationale: 어휘 자체는 일반적으로 ‘강’을 뜻하고, 운하 해석은 역사적 추론이므로 본문 번역은 기본 어휘 의미를 우선했습니다.
  doctrine_reference: 본문 주해의 역사-지리적 판단은 신학 교리보다 어휘 우선 원칙에 따릅니다.
