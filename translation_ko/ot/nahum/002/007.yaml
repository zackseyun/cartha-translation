id: NAM.2.7
reference: Nahum 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׁעֲרֵ֥י הַ/נְּהָר֖וֹת נִפְתָּ֑חוּ וְ/הַֽ/הֵיכָ֖ל נָמֽוֹג׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/007.yaml
  text: The gates of the rivers are opened[b][a], and the palace melts away.
  footnotes:
  - marker: a
    text: Or 'The gates of the canals are opened,' if the term is taken for Nineveh's waterways rather than rivers in the ordinary sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple,' since Hebrew heikhal can refer to either a palace or a temple; here the context favors 'palace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 강의 성문들이 열리고, 궁전이 녹아내립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁעֲרֵי הַנְּהָרוֹת
  english_pob_choice: the gates of the rivers
  chosen_korean: 강의 성문들
  alternatives_korean:
  - 강들의 성문들
  - 강물의 문들
  - 운하의 성문들
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘강들의 성문들’이지만, 한국어에서는 ‘성문’이 자연스럽고, ‘강’은 복수 표지를 굳이 반복하지 않아도 원문 복수성을 충분히 드러냅니다.
- source_word: נִפְתָּחוּ
  english_pob_choice: are opened
  chosen_korean: 열리고
  alternatives_korean:
  - 열립니다
  - 열려 있습니다
  - 열렸습니다
  lexicon: HALOT
  rationale: 예언적 현재의 생생함을 살리기 위해 현재 진행형 어감을 가진 ‘열리고’를 택했습니다.
- source_word: הַהֵיכָל
  english_pob_choice: the palace
  chosen_korean: 궁전
  alternatives_korean:
  - 성전
  - 왕궁
  - 궁정
  lexicon: HALOT
  rationale: 나훔의 문맥이 니느웨를 향한 심판이므로, הֵיכָל은 ‘성전’보다 왕의 거처를 가리키는 ‘궁전’이 더 정확합니다.
- source_word: נָמוֹג
  english_pob_choice: melts away
  chosen_korean: 녹아내립니다
  alternatives_korean:
  - 녹아 버립니다
  - 무너집니다
  - 사라집니다
  lexicon: HALOT
  rationale: ‘녹다/녹아내리다’는 원문의 비유적 붕괴 이미지를 가장 직접적으로 보존하며, 구조물이 허물어지는 느낌도 함께 전합니다.
theological_decisions:
- issue: הַנְּהָרוֹת의 의미 범위
  chosen_reading: ‘강’으로 두되, 운하 가능성은 본문 본문주 없이 번역문에서는 드러내지 않았습니다.
  alternative_readings:
  - ‘운하들’
  - ‘수로들’
  rationale: 어휘 자체는 일반적으로 ‘강’을 뜻하고, 운하 해석은 역사적 추론이므로 본문 번역은 기본 어휘 의미를 우선했습니다.
  doctrine_reference: 본문 주해의 역사-지리적 판단은 신학 교리보다 어휘 우선 원칙에 따릅니다.
