source:
  edition: WLC
  text: בֹּ֥זּוּ כֶ֖סֶף בֹּ֣זּוּ זָהָ֑ב וְ/אֵ֥ין קֵ֨צֶה֙ לַ/תְּכוּנָ֔ה כָּבֹ֕ד מִ/כֹּ֖ל כְּלִ֥י חֶמְדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/010.yaml
  text: Plunder silver! Plunder gold! There is no end to the treasure[b][a], an abundance of every precious thing.
  footnotes:
  - marker: a
    text: Or 'There is no end to the store/supply.' The Hebrew noun translated 'treasure' is rare and may emphasize accumulated stores rather than treasure in the abstract.
    reason: lexical_alternative
  - marker: b
    text: Or 'all kinds of precious articles.' The Hebrew phrase can refer broadly to desirable valuables, not only vessels in a narrow sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 은을 약탈하십시오! 금을 약탈하십시오! 그 저장물에는 끝이 없고, 온갖 귀한 물건이 가득합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저장물’은 희귀한 히브리어 명사 תְּכוּנָה의 의미를 반영한 것으로, 문맥상 ‘저장된 물품/비축물’의 뉘앙스가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온갖 귀한 물건’은 כְּלִי חֶמְדָּה를 넓게 풀어 옮긴 것으로, 좁게는 ‘귀한 기물’까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּזּוּ
  english_pob_choice: Plunder!
  chosen_korean: 약탈하라!
  alternatives_korean:
  - 노략하라!
  - 빼앗아라!
  lexicon: WLC/HALOT
  rationale: 전쟁 맥락의 강한 복수 명령형을 살리면서, 현대 한국어에서 가장 직접적이고 힘 있는 표현으로 옮겼습니다.
- source_word: תְּכוּנָה
  english_pob_choice: treasure
  chosen_korean: 저장물
  alternatives_korean:
  - 보물
  - 비축물
  - 저장된 물품
  lexicon: HALOT
  rationale: 희귀 명사로서 ‘축적된 저장품’의 뉘앙스가 있어, 단순한 ‘보물’보다 저장된 양의 의미를 드러내는 ‘저장물’로 옮겼습니다.
- source_word: כָּבֹד מִכֹּל כְּלִי חֶמְדָּה
  english_pob_choice: an abundance of every precious thing
  chosen_korean: 온갖 귀한 물건이 가득합니다
  alternatives_korean:
  - 온갖 귀한 기물이 가득합니다
  - 모든 소중한 물건으로 가득합니다
  lexicon: HALOT
  rationale: כָּבֹד는 이 물질적 문맥에서 ‘풍부함/가득함’의 뜻이 적절하고, כְּלִי חֶמְדָּה는 폭넓게 ‘귀한 물건들’을 가리킬 수 있어 지나치게 좁히지 않고 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 전리품 명령의 어조
  chosen_reading: 연속된 명령형을 살려 군사적 약탈 선포의 긴박함을 그대로 드러냈습니다.
  alternative_readings:
  - 완곡한 서술형으로 바꾸는 읽기
  - ‘노략하다’처럼 더 전통적인 군사용어를 쓰는 읽기
  rationale: 본문은 단순 묘사가 아니라 반복되는 명령으로 포위를 앞둔 약탈의 강도를 강조하므로, 그 힘을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 예언서의 심판 선포와 전쟁 이미지의 직접성
