  rationale: 이 절은 예언적 전쟁 묘사의 시각적 과장을 핵심으로 하므로, 독자가 이미지를 즉시 파악할 수 있도록 하면서도 의미 범위를 좁히지 않게 했습니다.
  doctrine_reference: 예언서의 시적 묘사 원리
