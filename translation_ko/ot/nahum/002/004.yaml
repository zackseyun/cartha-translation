base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/004.yaml
  text: The shield of his mighty men is red[a]; the men of valor are clothed in scarlet. The chariots flash with the fire of steel on the day of his preparation[b], and the cypress spears are brandished.
  footnotes:
  - marker: a
    text: Or 'the cypresses shake'; the Hebrew likely uses 'cypresses' metonymically for spear shafts or lances made of cypress wood.
    reason: lexical_alternative
  - marker: b
    text: Or 'the chariots are with fiery steel'; the Hebrew phrase is difficult and may refer to the flashing metal fittings or blades of the chariots.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 용사들의 방패는 붉고, 용사들은 주홍색 옷을 입었습니다. 병거들은 그가 준비하는 날에 강철의 불빛을 번뜩이며[b], 사이프러스 창들은 휘둘러집니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사이프러스나무들이 흔들린다’로도 옮길 수 있습니다. 히브리어는 사이프러스나무를 창대나 창자루의 재료를 가리키는 환유로 사용했을 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘병거들은 강철 같은 불빛과 함께 있다’로도 옮길 수 있습니다. 히브리어 표현이 난해하여 병거의 금속 장식이나 날의 번쩍임을 가리킬 수 있습니다.
    reason: lexical_alternative
