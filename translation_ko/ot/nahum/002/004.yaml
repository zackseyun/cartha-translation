  chosen_reading: 병거와 창의 광휘를 설명적으로 풀되, 원문의 전투적 긴장과 시각적 충격은 유지했습니다.
  alternative_readings:
  - 더 평이하게 풀어 ‘병거는 번쩍이고’로 단순화
