  naturalness: ‘그의 준비하는 날’은 현대 표준 한국어에서 어색하고, ‘강철의 불빛을 번뜩이고’도 목적어 구성보다 부사형으로 연결하는 편이 자연스럽습니다. 또한 각주 a의 내용은 ‘사이프러스 창들’에 걸려야 하므로 해당 위치로 각주 표지를 옮겨야 합니다.
