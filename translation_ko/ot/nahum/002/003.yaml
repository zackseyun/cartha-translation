  rationale: 본문이 하나님의 이름을 직접 사용하므로, 제목어로 바꾸기보다 고유명칭을 보존하는 쪽이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 이름-호칭 구분, 출 3장 전통
- issue: גְּאוֹן의 의미
  chosen_reading: 야곱과 이스라엘에게 주어질 회복된 위엄
  alternative_readings:
  - 교만이 회복됨
  - 자랑이 회복됨
  rationale: 문맥상 야훼의 긍정적 회복 행위이므로 부정적 윤리어보다 존귀·위엄의 의미가 적절합니다.
