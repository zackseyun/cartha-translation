id: NAM.2.3
reference: Nahum 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י שָׁ֤ב יְהוָה֙ אֶת גְּא֣וֹן יַעֲקֹ֔ב כִּ/גְא֖וֹן יִשְׂרָאֵ֑ל כִּ֤י בְקָקוּ/ם֙ בֹּֽקְקִ֔ים וּ/זְמֹרֵי/הֶ֖ם שִׁחֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/003.yaml
  text: For Yahweh is restoring the majesty of Jacob like the majesty of Israel[c][b][a], though destroyers have destroyed them and ruined their vine branches.
  footnotes:
  - marker: a
    text: Or 'has restored' or 'will restore'; the Hebrew verb may express a prophetic certainty.
    reason: lexical_alternative
  - marker: b
    text: Or 'the pride of Jacob, as the pride of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'emptiers have emptied them'; that is, ravagers have thoroughly despoiled them.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 야곱의 위엄을, 곧 이스라엘의 위엄을 회복하고 계시기 때문입니다[a][b][c]. 파괴자들이 그들을 파괴하고 그들의 포도나무 가지들을 망가뜨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회복하셨다’ 혹은 ‘회복하실 것이다’; 히브리어 동사는 예언적 확실성을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야곱의 교만을, 곧 이스라엘의 교만을’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어로는 ‘비우는 자들이 그들을 비웠다’는 뜻이며, 곧 철저히 약탈하고 황폐하게 했다는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 일반적 성서학 표기
  rationale: 원문 고유명사를 보존하기 위해 전통 치환어보다 음역형 '야훼'를 따랐습니다.
- source_word: גְּאוֹן
  english_pob_choice: majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 자랑
  - 교만
  - 영광
  lexicon: HALOT
  rationale: 야곱/이스라엘에게 회복되는 긍정적 의미를 살리되, 한국어에서 '자랑/교만'으로 오해될 소지를 피하기 위해 '위엄'으로 옮겼습니다.
- source_word: שָׁב
  english_pob_choice: is restoring
  chosen_korean: 회복하고 계시기
  alternatives_korean:
  - 회복하셨기
  - 회복하실 것이기
  - 회복하십니다
  lexicon: HALOT
  rationale: 예언적 확실성을 현재 진행형으로 풀어 원문의 생동감을 살렸습니다.
- source_word: בְקָקוּם ... בֹּקְקִים
  english_pob_choice: destroyers have destroyed / plunderers have plundered
  chosen_korean: 파괴자들이 그들을 파괴하고
  alternatives_korean:
  - 빈자들이 비웠고
  - 약탈자들이 약탈하고
  - 황폐하게 한 자들이 황폐하게 했습니다
  lexicon: HALOT
  rationale: בקע/בקק의 '비우다, 황폐하게 하다'를 직역적으로 반영하되, 한국어에서는 의미가 분명한 '파괴자들이 파괴하다'로 옮겨 반복 강조를 살렸습니다.
- source_word: וּזְמֹרֵיהֶם
  english_pob_choice: their vine branches
  chosen_korean: 그들의 포도나무 가지들
  alternatives_korean:
  - 그들의 가지들
  - 그들의 포도덩굴 가지들
  - 그들의 포도나무 순들
  lexicon: HALOT
  rationale: זְמוֹרָה의 포도나무 관련 이미지를 일반적인 '가지'로 넓히지 않고 구체적으로 보존했습니다.
theological_decisions:
- issue: יְהוָה의 번역어 선택
  chosen_reading: 야훼로 음역하여 신적 고유명을 드러냄
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 이름을 직접 사용하므로, 제목어로 바꾸기보다 고유명칭을 보존하는 쪽이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 이름-호칭 구분, 출 3장 전통
- issue: גְּאוֹן의 의미
  chosen_reading: 야곱과 이스라엘에게 주어질 회복된 위엄
  alternative_readings:
  - 교만이 회복됨
  - 자랑이 회복됨
  rationale: 문맥상 야훼의 긍정적 회복 행위이므로 부정적 윤리어보다 존귀·위엄의 의미가 적절합니다.
  doctrine_reference: 문맥 기반 어휘 판단
