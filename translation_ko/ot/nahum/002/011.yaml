base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/011.yaml
  text: Devastation[a], desolation, and destruction! Hearts melt, knees give way, anguish is in every waist, and all their faces grow pale.
  footnotes:
  - marker: a
    text: Or, more literally, 'all their faces gather blackness.' The Hebrew expression is difficult and may describe a darkened or drained facial appearance from terror.
    reason: lexical_alternative
translation:
  language: ko
  text: “황폐와 공허와 파괴입니다! 마음이 녹고, 무릎이 꺾이며, 모든 허리에 고통이 있고, 그들의 얼굴은 모두 창백해집니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 모든 얼굴에 검은빛이 감돈다’에 가깝습니다. 히브리어 표현은 어렵고, 공포 때문에 얼굴빛이 어두워지거나 핏기가 빠지는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוּקָה / מְבוּקָה / מְבֻלָּקָה
  english_pob_choice: Devastation / desolation / destruction
  chosen_korean: 황폐함과 황폐, 그리고 파괴
  alternatives_korean:
  - 멸망과 황폐, 그리고 파멸
  - 폐허와 황폐, 그리고 붕괴
  lexicon: HALOT
  rationale: 히브리어의 빠른 3중 반복을 살려 서로 비슷하지만 점층적인 표현으로 옮겼습니다. 첫 항목의 추상명사형 ‘황폐함’과 뒤의 짧은 ‘황폐’가 리듬을 유지합니다.
- source_word: לֵב נָמֵס
  english_pob_choice: Hearts melt
  chosen_korean: 마음은 녹아내리고
  alternatives_korean:
  - 마음은 녹고
  - 마음은 무너지고
  lexicon: HALOT
  rationale: ‘녹다’의 비유를 그대로 살려 두려움으로 인한 기력 상실을 표현했습니다. 한국어에서는 복수형 ‘마음들’보다 일반적 집합 의미의 ‘마음’이 자연스럽습니다.
- source_word: פִק בִּרְכַּיִם
  english_pob_choice: knees give way
  chosen_korean: 무릎은 꺾이며
  alternatives_korean:
  - 무릎이 풀리며
  - 무릎이 꺾이고
  lexicon: HALOT
  rationale: ‘give way’의 신체적 붕괴를 한국어 관용으로 옮겼습니다. 공포로 다리에 힘이 빠지는 이미지를 직접적으로 전달합니다.
- source_word: וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר
  english_pob_choice: all their faces grow pale
  chosen_korean: 그들의 얼굴은 모두 창백해집니다
  alternatives_korean:
  - 그들의 얼굴은 모두 핏기를 잃습니다
  - 그들의 얼굴은 모두 검어집니다
  lexicon: HALOT
  rationale: 문맥상 공포로 얼굴빛이 변하는 상태를 드러내는 해석을 따랐습니다. POB 주석에 반영된 더 문자적인 ‘얼굴이 검어지다’ 가능성은 각주로 보존했습니다.
theological_decisions:
- issue: 공포와 심판의 누적적 묘사를 어떻게 한국어에서 보존할지
  chosen_reading: 한 절 전체를 짧은 감탄문과 병렬 절들로 유지하여 파괴, 신체 붕괴, 얼굴빛 변화의 충격을 그대로 살렸습니다.
  alternative_readings:
  - 서술형으로 완만하게 정리하는 번역
  - 의미를 풀어 ‘극심한 공포와 혼란’으로 요약하는 번역
  rationale: 이 본문은 설명보다 음성적·시각적 충격이 핵심이므로, 해석적 완화보다 반복과 병렬 구조를 보존하는 것이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 심판의 묘사 본문 — 수사적 강도 보존 원칙
