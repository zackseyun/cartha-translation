  source_fidelity: 핵심 신체 반응과 공포의 묘사는 충실합니다. 다만 첫 세 명사의 원문은 어근을 활용한 난해한 파괴·공허의 삼중 표현이므로, ‘황폐함과 황폐’처럼 사실상 같은 말을 반복하기보다 서로 구별되는 한국어 명사로 옮기는 편이 낫습니다. 마지막 표현은 문맥상 ‘창백해지다’로 번역할 수 있으나, 난해한 문자적 가능성은 각주에서 더 정확하고 자연스럽게 보존해야 합니다.
  naturalness: ‘황폐함과 황폐’는 현대 한국어에서 부자연스럽고 의미상 중복됩니다. ‘황폐와 공허와 파괴’는 짧은 병렬과 수사적 충격을 유지하면서 더 자연스럽습니다. 각주도 ‘검어짐을 모은다’보다 ‘검은빛을 띤다/검은빛이 감돈다’가 한국어 문장으로 자연스럽습니다.
  terminology: ‘마음이 녹고’, ‘무릎이 꺾이며’, ‘허리’는 본문의 비유와 신체성을 적절히 보존합니다. ‘창백해집니다’는 문맥적 번역으로 유지하되, פָארוּר의 의미가 확정되지 않았음을 각주에서 밝혀야 합니다.
