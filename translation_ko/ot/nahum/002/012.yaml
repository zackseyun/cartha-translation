- from: 사자들의 굴은 어디입니까? 젊은 사자들의 먹이터는 어디입니까? 사자와 암사자가 거닐던 곳, 사자 새끼가 있던 곳은 어디입니까? 그들을 두려워하게 하는 자가 아무도 없었습니다.[a][b]
  to: 사자들의 굴과 젊은 사자들의 먹이터[a]는 어디에 있습니까? 사자와 암사자[b]가 다니고 사자 새끼가 있으며, 아무도 그들을 두렵게 하지 않던 곳은 어디에 있습니까?
  rationale: 개정문은 אַיֵּה가 이끄는 수사 의문문의 범위를 끝까지 유지하고, ‘아무도 두렵게 하지 않던’이라는 종결절을 장소 묘사에 연결했습니다. ‘암사자’는 영어 POB의 선택 및 문맥상 가족 집단 이미지에 따라 유지하되, 다의성은 정확한 대안 각주로 보존했습니다. 두 각주는 해당 어휘 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:46Z'
