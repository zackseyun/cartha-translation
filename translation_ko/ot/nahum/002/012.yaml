id: NAM.2.12
reference: Nahum 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַיֵּה֙ מְע֣וֹן אֲרָי֔וֹת וּ/מִרְעֶ֥ה ה֖וּא לַ/כְּפִרִ֑ים אֲשֶׁ֣ר הָלַךְ֩ אַרְיֵ֨ה לָבִ֥יא שָׁ֛ם גּ֥וּר אַרְיֵ֖ה וְ/אֵ֥ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/012.yaml
  text: Where is the lions’ den[a], the feeding place of the young lions, where the lion and lioness walked, where the lion’s cub was[b], with none to make them afraid?
  footnotes:
  - marker: a
    text: Or 'pasture of the young lions.' The Hebrew term for 'feeding place' can also denote a pasture or grazing place, used here metaphorically in the lion image.
    reason: lexical_alternative
  - marker: b
    text: Or 'great lion' for 'lioness.' The Hebrew word לָבִיא can be understood in different lion-related senses, but 'lioness' best fits the sequence of lion, lioness, and cub.
    reason: lexical_alternative
translation:
  language: ko
  text: 사자들의 굴은 어디입니까? 젊은 사자들의 먹이터는 어디입니까? 사자와 암사자가 거닐던 곳, 사자 새끼가 있던 곳은 어디입니까? 그들을 두려워하게 하는 자가 아무도 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젊은 사자들의 목초지.’ 히브리어 표현은 문자적으로는 ‘먹이 주는 곳’이지만, 비유적으로는 풀을 뜯는 목초지를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘암사자.’ 히브리어 לָבִיא는 ‘큰 사자’로도 읽을 수 있지만, 여기서는 사자, 암사자, 새끼의 연속이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  english_pob_choice: Where is
  chosen_korean: 어디입니까?
  alternatives_korean:
  - 어디에 있습니까?
  - 어디입니까
  lexicon: HALOT
  rationale: 장소를 묻는 수사적 질문을 자연스러운 현대 한국어로 옮기기 위해 ‘어디입니까?’를 사용했습니다.
- source_word: מְעוֹן אֲרָיוֹת
  english_pob_choice: the lions’ den
  chosen_korean: 사자들의 굴
  alternatives_korean:
  - 사자들의 집
  - 사자들의 보금자리
  lexicon: HALOT
  rationale: 맹수 이미지에 맞는 ‘굴’이 ‘den’의 뜻을 가장 직접적으로 살리며, 복수 소유도 자연스럽게 반영합니다.
- source_word: וּמִרְעֶה
  english_pob_choice: the feeding place
  chosen_korean: 먹이터
  alternatives_korean:
  - 풀밭
  - 목초지
  - 먹는 곳
  lexicon: HALOT
  rationale: 문맥상 실제 목초지보다 사자들이 먹이를 먹던 장소라는 비유적 의미가 핵심이므로 ‘먹이터’가 가장 적절합니다.
- source_word: לָבִיא
  english_pob_choice: lioness
  chosen_korean: 암사자
  alternatives_korean:
  - 사자
  - 큰 사자
  lexicon: HALOT
  rationale: 사자, 암사자, 새끼의 병렬을 살리기 위해 ‘암사자’로 옮겼습니다. 다만 본문 자체에는 성별 구분이 다의적으로 해석될 여지가 있습니다.
theological_decisions:
- issue: 나훔의 심판 조롱 질문의 어조
  chosen_reading: 직설적인 수사 의문문으로 유지했습니다.
  alternative_readings:
  - 완만한 서술형으로 바꾸기
  - 암시적으로 표현하기
  rationale: 앗시리아의 몰락을 조롱하는 예언적 비난의 날카로운 어조를 약화하지 않기 위해 질문형을 그대로 살렸습니다.
  doctrine_reference: 예언 문학의 수사적 심판 선언
- issue: ‘그들을 두려워하게 하는 자가 아무도 없었습니다’의 복수 지시
  chosen_reading: 사자 무리를 가리키는 복수 의미로 처리했습니다.
  alternative_readings:
  - 사자를 단수로 좁히기
  - ‘방해하는 자가 없었습니다’로 완화하기
  rationale: 히브리어 종결부는 무리 전체에 대한 무서움의 부재를 말하므로, POB의 영어처럼 복수 지시를 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 문맥상 집합적 복수 이해
