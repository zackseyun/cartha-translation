  source_fidelity: 수사 의문문의 기본 뜻과 사자·암사자·새끼의 이미지는 대체로 잘 반영했습니다. 그러나 히브리어의 마지막 ‘아무도 두렵게 하는 자가 없음’은 앞의 장소를 수식하는 한 절의 일부인데, 초안은 이를 독립된 평서문으로 처리하여 질문의 범위와 연결이 흐려졌습니다.
  naturalness: ‘그들을 두려워하게 하는 자’보다 ‘그들을 두렵게 하는 자’가 자연스럽습니다. 또한 각 명사를 따로 묻기보다, 장소를 묘사하는 관계절로 묶어 한 수사 의문문으로 제시하는 편이 현대 한국어와 본문의 구조에 더 자연스럽습니다.
