  source_fidelity: 첫 행의 히브리어는 ‘새끼들을 위하여 충분히 찢다/먹이를 찢다’라는 뜻입니다. 현 번역의 ‘충분히 찢어 먹이를 잡고’는 원문에 없는 ‘잡다’를 더하고, ‘충분히’가 ‘찢어’의 방식처럼 연결되어 의미가 다소 흐려집니다. 둘째 행은 חנק의 목적어가 문맥상 보충될 수 있으나, ‘먹이를 목 졸라 죽였다’는 자연스럽고 충실합니다. 마지막 행의 두 목적어는 각각 ‘먹이’와 ‘찢긴 고기’로 평행을 이루므로 유지할 수 있습니다.
  naturalness: ‘사자가 새끼들을 위해 충분히 찢어 먹이를 잡고’는 결합이 어색하고 의미 관계가 불명확합니다. ‘새끼들을 위하여 충분한 먹이를 찢고’가 현대 표준어에서 더 명료합니다. ‘자기’의 반복은 가능하나, 소유 접미사와 문맥상 ‘그 굴들… 그 은신처들’ 또는 소유어를 한 번만 드러내는 방식이 더 자연스럽습니다. 합쇼체 종결은 적절합니다.
  terminology: ‘암사자들’, ‘굴들’, ‘은신처들’, ‘찢은 고기’는 대체로 적절합니다. 다만 טְרֵפָה는 이미 찢긴 먹잇감/찢긴 고기를 가리키므로 ‘찢긴 고기’가 결과 상태를 더 자연스럽게 나타냅니다. 영어 감사본의 각주 표지는 본문상 [b][a] 순서이나, 한국어 초안은 [a][b]이며 각주 내용도 그 순서에 맞추어 새로 정렬하는 편이 바람직합니다.
