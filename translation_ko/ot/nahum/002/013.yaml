  text: אַרְיֵ֤ה טֹרֵף֙ בְּ/דֵ֣י גֹֽרוֹתָ֔י/ו וּ/מְחַנֵּ֖ק לְ/לִבְאֹתָ֑י/ו וַ/יְמַלֵּא טֶ֣רֶף חֹרָ֔י/ו וּ/מְעֹֽנֹתָ֖י/ו טְרֵפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/013.yaml
  text: The lion tore enough for his cubs and strangled prey for his lionesses[b][a]; he filled his dens with prey and his lairs with torn flesh.
  footnotes:
  - marker: a
    text: Or 'The lion was tearing sufficient prey for his cubs.' The Hebrew participle can be rendered with a more continuous sense.
    reason: lexical_alternative
  - marker: b
    text: '''Torn flesh'' could also be rendered ''prey'' or ''what was torn.'' The translation distinguishes this term from the earlier ''prey'' to preserve the Hebrew poetic variation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사자가 새끼들을 위해 충분히 찢어 먹이를 잡고, 암사자들을 위해 먹이를 목 졸라 죽였으며, 자기 굴들을 먹이로 채우고 자기 은신처들을 찢은 고기로 채웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘충분히 찢어 먹이를 잡고’는 히브리어 분사의 지속적 동작 가능성을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘찢은 고기’는 앞의 ‘먹이’와 다른 히브리어 표현을 구별해 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  english_pob_choice: The lion
  chosen_korean: 사자
  alternatives_korean:
  - 한 마리 사자
  - 그 사자
  lexicon: HALOT
  rationale: 히브리어 단수 명사는 이 문맥에서 대표적 상징으로 쓰인 사자이므로, 자연스러운 일반명사로 옮겼습니다.
- source_word: טֹרֵף בְּדֵי
  english_pob_choice: tore enough
  chosen_korean: 충분히 찢어 먹이를 잡고
  alternatives_korean:
  - 새끼들을 위해 충분히 찢고
  - 찢어서 넉넉히
  lexicon: HALOT
  rationale: בְּדֵי의 ‘충분함’과 טֹרֵף의 ‘찢다/사냥하다’ 의미를 함께 살리기 위해, ‘충분히 찢어’와 ‘먹이를 잡고’를 결합해 수량적 뉘앙스를 드러냈습니다.
- source_word: לְלִבְאֹתָיו
  english_pob_choice: for his lionesses
  chosen_korean: 암사자들을 위해
  alternatives_korean:
  - 그의 암사자들을 위해
  - 암사자들에게
  lexicon: HALOT
  rationale: 여성형 복수형을 가장 सीधे하게 반영하는 표준 한국어 동물명 ‘암사자들’을 사용했습니다.
- source_word: חֹרָיו וּמְעֹנֹתָיו
  english_pob_choice: his dens ... his lairs
  chosen_korean: 자기 굴들 ... 자기 은신처들
  alternatives_korean:
  - 자기 굴들 ... 자기 굴들
  - 자기 동굴들 ... 자기 거처들
  lexicon: HALOT
  rationale: 두 어휘가 평행하지만 동일하지 않으므로, ‘굴들’과 ‘은신처들’로 구분해 시적 변주를 살렸습니다.
- source_word: טְרֵפָה
  english_pob_choice: torn flesh
  chosen_korean: 찢은 고기
  alternatives_korean:
  - 찢긴 살
  - 찢어진 것
  lexicon: HALOT
  rationale: 앞의 טֶרֶף(먹이)와 구별되는 종결 어휘의 거친 이미지를 살리기 위해 ‘찢은 고기’로 옮겼습니다.
theological_decisions:
- issue: 사자 비유를 정치적 설명으로 풀어쓸지 여부
  chosen_reading: 본문의 사자 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 앗수르/니느웨의 약탈을 직접 풀어서 설명함
  rationale: 나훔의 조롱시적 이미지를 보존하는 것이 원문의 뜻과 힘을 가장 잘 전달하므로, 해설적 의역은 피했습니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
