    rationale: בְּדֵי는 ‘충분한/필요한 만큼’이며, טֹרֵף는 먹이를 찢는 행위입니다. ‘새끼들을 위하여 충분한 먹이를 찢고’는 원문의 의미 관계를 더 직접적으로 반영합니다.
