  - 거리들에서는
  lexicon: HALOT
  rationale: חוּצות는 도시의 거리나 공공 통로를 가리키므로, 현대 한국어에서는 가장 자연스러운 ‘거리’로 옮겼습니다.
- source_word: יִתְהוֹלְלוּ
  english_pob_choice: race wildly
  chosen_korean: 미친 듯이 달리고
