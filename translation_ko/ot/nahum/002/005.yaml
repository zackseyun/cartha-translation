theological_decisions:
- issue: 전차 묘사의 난폭함과 폭력성
  chosen_reading: 전차들의 움직임을 ‘미친 듯이 달리고’와 ‘덜컹거립니다’로 옮겨, 전쟁의 혼란과 공포를 약화하지 않았습니다.
  alternative_readings:
  - ‘급히 달리고’처럼 완화된 표현
  - ‘바쁘게 달리고’처럼 중립화된 표현
  rationale: 문맥은 승리의 위용보다 심판과 전쟁의 소란을 강조하므로, 원문의 강한 긴장감을 유지하는 것이 더 충실합니다.
  doctrine_reference: Nahum 2장의 전쟁-심판 이미지
- issue: 비유의 연속성
  chosen_reading: ‘횃불 같고, 번개처럼’이라는 두 겹의 비유를 유지해 시각적·동적인 공포를 함께 드러냈습니다.
  alternative_readings:
  - 두 비유를 하나로 합치는 방식
  - ‘불꽃처럼’으로 일반화하는 방식
  rationale: 히브리어 원문은 시각 이미지와 속도 이미지를 병렬로 제시하므로, 이를 분리해 보존하는 편이 문맥상 더 정확합니다.
