  text: בַּֽ/חוּצוֹת֙ יִתְהוֹלְל֣וּ הָ/רֶ֔כֶב יִֽשְׁתַּקְשְׁק֖וּ/ן בָּ/רְחֹב֑וֹת מַרְאֵי/הֶן֙ כַּ/לַּפִּידִ֔ם כַּ/בְּרָקִ֖ים יְרוֹצֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/005.yaml
  text: In the streets the chariots race wildly[a]; they rattle through the squares. Their appearance is like torches[c][b]; like lightning they dart about.
  footnotes:
  - marker: a
    text: Or 'they rage' for 'race wildly'; the Hebrew verb can suggest frenzied or mad behavior.
    reason: lexical_alternative
  - marker: b
    text: Or 'they clatter' for 'they rattle'; the rare Hebrew verb is likely onomatopoetic, emphasizing noisy jolting motion.
    reason: lexical_alternative
  - marker: c
    text: Or 'they race back and forth' for 'they dart about'; the Hebrew emphasizes rapid movement to and fro.
    reason: lexical_alternative
translation:
  language: ko
  text: 거리에서는 전차들이 미친 듯이 달리고[a], 광장들을 가로질러 덜컹거립니다[b]. 그 모습은 횃불 같고, 번개처럼 이리저리 내달립니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘격분하며’로도 옮길 수 있습니다. 히브리어 동사는 미친 듯하거나 광분한 움직임을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘철커덕거립니다’로도 옮길 수 있습니다. 드문 히브리어 동사는 요란하게 부딪히는 소리를 암시합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이리저리 내달립니다’ 대신 ‘왔다 갔다 하며 달립니다’로도 옮길 수 있습니다. 히브리어는 앞뒤로 빠르게 움직이는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּצוֹת
  english_pob_choice: in the streets
  chosen_korean: 거리에서는
  alternatives_korean:
