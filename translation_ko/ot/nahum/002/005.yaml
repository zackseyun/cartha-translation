  - 철커덕거립니다
  - 덜거덕거립니다
  lexicon: HALOT
  rationale: 드문 의성·의태 동사의 소리 나는 느낌을 살리면서도, 전차의 요동과 소음을 함께 드러내는 한국어로 옮겼습니다.
- source_word: מַרְאֵיהֶן כַּלַּפִּידִם כַּבְּרָקִים
  english_pob_choice: Their appearance is like torches; like lightning
  chosen_korean: 그 모습은 횃불 같고, 번개처럼
  alternatives_korean:
