  - 광분하여 달리고
  lexicon: HALOT
  rationale: 전차의 격렬하고 난폭한 움직임을 살려, 단순한 ‘달리다’보다 분주하고 통제되지 않은 뉘앙스를 드러냈습니다.
- source_word: יִשְׁתַּקְשְׁק֖וּן
  english_pob_choice: they rattle
  chosen_korean: 덜컹거립니다
