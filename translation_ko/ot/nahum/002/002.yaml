id: NAM.2.2
reference: Nahum 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָלָ֥ה מֵפִ֛יץ עַל פָּנַ֖יִ/ךְ נָצ֣וֹר מְצֻרָ֑ה צַפֵּה דֶ֨רֶךְ֙ חַזֵּ֣ק מָתְנַ֔יִם אַמֵּ֥ץ כֹּ֖חַ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
  footnotes:
  - marker: a
    text: Or 'a shatterer' or 'one who dashes to pieces'; the Hebrew term can emphasize either scattering or smashing destruction.
    reason: lexical_alternative
  - marker: b
    text: Literally 'against your face,' an idiom meaning directly before you or against you.
    reason: lexical_alternative
  - marker: c
    text: Or 'the stronghold' or possibly 'the siegeworks/fortification'; the Hebrew noun can refer more broadly to a fortified or besieged position.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 파괴자가 네 앞에 올라왔습니다[a][b]. 성채를 지키십시오; 길을 살피십시오; 허리를 단단히 하십시오; 힘을 크게 모으십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어는 ‘흩뜨리는 자’ 또는 ‘무너뜨리는 자’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 얼굴 위에/앞에’로, 직접 대치하거나 바로 맞서는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 명사는 ‘성채’, ‘요새’, 또는 더 넓게는 포위된 방어 거점을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה / מֵפִיץ
  english_pob_choice: has come up / a scatterer
  chosen_korean: 한 파괴자가 네 앞에 올라왔습니다
  alternatives_korean:
  - 한 흩뜨리는 자가 네 앞에 올라왔습니다
  - 한 무너뜨리는 자가 네 앞에 올라왔습니다
  - 한 흩어버리는 자가 네 앞에 올라왔습니다
  lexicon: HALOT
  rationale: מֵפִיץ는 ‘흩뜨리는 자’와 ‘부수는 자’의 긴장이 있으므로, 전면적 파괴성을 드러내는 ‘파괴자’로 옮기되 영어 주석의 대안 의미는 각주로 보존했습니다.
- source_word: עַל פָּנַיִךְ
  english_pob_choice: against your face
  chosen_korean: 네 앞에
  alternatives_korean:
  - 네 얼굴에
  - 네 맞은편에
  - 네 면전에
  lexicon: HALOT
  rationale: 직역은 ‘네 얼굴에/면전에’이지만, 문맥상 직접 대치의 관용구이므로 한국어에서는 자연스럽고 의미를 보존하는 ‘네 앞에’로 옮겼습니다.
- source_word: מְצֻרָה
  english_pob_choice: the fortress
  chosen_korean: 성채
  alternatives_korean:
  - 요새
  - 견고한 곳
  - 포위진지
  lexicon: HALOT
  rationale: 이 명사는 요새화된 장소나 방어 시설을 가리킬 수 있으므로, 군사적 맥락을 살리면서도 ‘fortress’에 대응하는 ‘성채’를 선택했습니다.
- source_word: חַזֵּק מָתְנַיִם
  english_pob_choice: strengthen your loins
  chosen_korean: 허리를 단단히 하십시오
  alternatives_korean:
  - 허리를 동이십시오
  - 허리를 굳게 하십시오
  - 허리를 세우십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 육체적 이미지를 유지하되, 현대 한국어에서 자연스럽고 긴박한 준비 명령으로 들리도록 ‘허리를 단단히 하십시오’로 옮겼습니다.
- source_word: אַמֵּץ כֹּחַ מְאֹד
  english_pob_choice: muster your strength greatly
  chosen_korean: 힘을 크게 모으십시오
  alternatives_korean:
  - 힘을 더욱 내십시오
  - 아주 힘을 내십시오
  - 힘을 크게 북돋우십시오
  lexicon: HALOT
  rationale: ‘앗메츠 코아흐’는 힘을 적극적으로 불러모으는 명령이므로, 합쇼체에서 자연스러운 ‘힘을 크게 모으십시오’로 압축해 전달했습니다.
theological_decisions:
- issue: 전쟁 경고의 직접적 명령 어조
  chosen_reading: 예언자적 경고문의 급박한 군사적 어조를 살려 연속 명령형으로 옮겼습니다.
  alternative_readings:
  - 부드럽게 경고하는 서술형으로 완화
  - 의미를 풀어 설명하는 문장형 번역
  rationale: 본문은 방어 준비를 재촉하는 짧은 명령들의 연쇄이므로, 한국어에서도 긴박성과 압박감을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언서의 심판 경고는 수사적 긴급성을 통해 청중의 즉각적 대응을 촉구함
