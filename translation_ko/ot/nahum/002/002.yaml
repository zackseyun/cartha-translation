  - 네 맞은편에
  - 네 면전에
  lexicon: HALOT
  rationale: 직역은 ‘네 얼굴에/면전에’이지만, 문맥상 직접 대치의 관용구이므로 한국어에서는 자연스럽고 의미를 보존하는 ‘네 앞에’로 옮겼습니다.
- source_word: מְצֻרָה
  english_pob_choice: the fortress
  chosen_korean: 성채
  alternatives_korean:
  - 요새
  - 견고한 곳
  - 포위진지
  lexicon: HALOT
  rationale: 이 명사는 요새화된 장소나 방어 시설을 가리킬 수 있으므로, 군사적 맥락을 살리면서도 ‘fortress’에 대응하는 ‘성채’를 선택했습니다.
- source_word: חַזֵּק מָתְנַיִם
  english_pob_choice: strengthen your loins
  chosen_korean: 허리를 단단히 하십시오
  alternatives_korean:
  - 허리를 동이십시오
  - 허리를 굳게 하십시오
  - 허리를 세우십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 육체적 이미지를 유지하되, 현대 한국어에서 자연스럽고 긴박한 준비 명령으로 들리도록 ‘허리를 단단히 하십시오’로 옮겼습니다.
- source_word: אַמֵּץ כֹּחַ מְאֹד
  english_pob_choice: muster your strength greatly
  chosen_korean: 힘을 크게 모으십시오
  alternatives_korean:
  - 힘을 더욱 내십시오
