  - 힘을 크게 북돋우십시오
  lexicon: HALOT
  rationale: ‘앗메츠 코아흐’는 힘을 적극적으로 불러모으는 명령이므로, 합쇼체에서 자연스러운 ‘힘을 크게 모으십시오’로 압축해 전달했습니다.
