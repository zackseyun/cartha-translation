  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָלָ֥ה מֵפִ֛יץ עַל פָּנַ֖יִ/ךְ נָצ֣וֹר מְצֻרָ֑ה צַפֵּה דֶ֨רֶךְ֙ חַזֵּ֣ק מָתְנַ֔יִם אַמֵּ֥ץ כֹּ֖חַ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
  footnotes:
  - marker: a
    text: Or 'a shatterer' or 'one who dashes to pieces'; the Hebrew term can emphasize either scattering or smashing destruction.
    reason: lexical_alternative
  - marker: b
    text: Literally 'against your face,' an idiom meaning directly before you or against you.
    reason: lexical_alternative
  - marker: c
    text: Or 'the stronghold' or possibly 'the siegeworks/fortification'; the Hebrew noun can refer more broadly to a fortified or besieged position.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 파괴자가 네게 맞서 쳐들어왔습니다[a][b]. 성채[c]를 지키십시오. 길을 살피십시오. 허리를 단단히 하십시오. 힘을 한껏 내십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어는 ‘흩뜨리는 자’ 또는 ‘산산이 부수는 자’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 얼굴 위에/앞에’로, 직접 대치하거나 바로 맞서는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 명사는 ‘성채’, ‘요새’, 또는 더 넓게는 포위된 방어 거점을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה / מֵפִיץ
  english_pob_choice: has come up / a scatterer
  chosen_korean: 한 파괴자가 네 앞에 올라왔습니다
  alternatives_korean:
  - 한 흩뜨리는 자가 네 앞에 올라왔습니다
  - 한 무너뜨리는 자가 네 앞에 올라왔습니다
  - 한 흩어버리는 자가 네 앞에 올라왔습니다
  lexicon: HALOT
  rationale: מֵפִיץ는 ‘흩뜨리는 자’와 ‘부수는 자’의 긴장이 있으므로, 전면적 파괴성을 드러내는 ‘파괴자’로 옮기되 영어 주석의 대안 의미는 각주로 보존했습니다.
- source_word: עַל פָּנַיִךְ
  english_pob_choice: against your face
  chosen_korean: 네 앞에
  alternatives_korean:
