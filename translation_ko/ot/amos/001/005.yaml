id: AMO.1.5
reference: Amos 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָֽׁבַרְתִּי֙ בְּרִ֣יחַ דַּמֶּ֔שֶׂק וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מִ/בִּקְעַת אָ֔וֶן וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מִ/בֵּ֣ית עֶ֑דֶן וְ/גָל֧וּ עַם אֲרָ֛ם קִ֖ירָ/ה אָמַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/005.yaml
  text: I will break the gate-bar of Damascus[a], and I will cut off the inhabitant from the Valley of Aven and the one who holds the scepter from Beth-eden[b]; and the people of Aram will go into exile to Kir,” says Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'Aven' may echo a word meaning 'wickedness' or 'trouble'; it is likely used here as a place name with possible prophetic wordplay.
    reason: lexical_alternative
  - marker: b
    text: Beth-eden may also be rendered 'house of Eden'; some identify it historically with Bit-Adini.
    reason: alternative_reading
translation:
  language: ko
  text: “나는 다메섹의 빗장을 부수고, 아웬 골짜기에서 주민을 끊어 내며, 벧에덴에서 홀을 쥔 자를 끊어 내고, 아람 백성은 기르로 사로잡혀 갈 것입니다.” 야훼께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아웬’은 지명일 가능성이 크지만, ‘죄악/재난’과 연결되는 말장난일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벧에덴’은 ‘에덴의 집’으로도 옮길 수 있으며, 일부는 역사적으로 ‘비트아디니’와 연결합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  english_pob_choice: I will break
  chosen_korean: 나는 … 부수고
  alternatives_korean:
  - 나는 … 깨뜨리고
  - 나는 … 꺾고
  lexicon: HALOT
  rationale: 예언적 미래 문맥에서 확정된 심판 행위를 나타내므로 ‘부수다’가 자연스럽고, 성채의 방어 장치를 무너뜨리는 이미지를 살립니다.
- source_word: בְּרִיחַ
  english_pob_choice: gate-bar
  chosen_korean: 빗장
  alternatives_korean:
  - 성문 빗장
  - 빗장쇠
  lexicon: HALOT
  rationale: 성문을 잠그는 막대/빗장을 가리키므로, 한국어에서는 간결한 ‘빗장’이 본래의 방어 구조 이미지를 잘 전달합니다.
- source_word: מִ/בִּקְעַת אָוֶן
  english_pob_choice: from the Valley of Aven
  chosen_korean: 아웬 골짜기에서
  alternatives_korean:
  - 아웬의 골짜기에서
  - 사악함 골짜기에서
  lexicon: HALOT
  rationale: 본문은 지명을 유지하는 것이 가장 안전하므로 본문에는 ‘아웬 골짜기’로 두고, אָוֶן의 의미 가능성은 주해 여지로 남깁니다.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  english_pob_choice: the one who holds the scepter
  chosen_korean: 홀을 쥔 자
  alternatives_korean:
  - 홀을 잡은 자
  - 통치권을 쥔 자
  lexicon: HALOT
  rationale: שֵׁבֶט를 왕권/통치의 홀로 보고, תמך의 ‘붙들다, 쥐다’ 의미를 살려 구체적 표상을 유지했습니다.
- source_word: וְגָלוּ עַם אֲרָם
  english_pob_choice: and the people of Aram will go into exile
  chosen_korean: 아람 백성은 기르로 사로잡혀 갈 것입니다
  alternatives_korean:
  - 아람의 백성은 포로로 끌려갈 것입니다
  - 아람 백성은 포로가 되어 갈 것입니다
  lexicon: HALOT
  rationale: ‘사로잡혀 가다’는 포로/유배의 결과를 자연스럽게 드러내며, 예언적 심판 선언의 어조를 한국어로 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 본 프로젝트의 정본 용례를 따라 신명기적 언약명을 ‘야훼’로 옮겨, 본문의 고유한 언약적 발화를 보존합니다.
theological_decisions:
- issue: 예언자적 심판 선언의 화자 표지와 직접 인용부
  chosen_reading: 인용문 안에는 1인칭 미래형 심판 선언을 유지하고, 뒤의 화자 표지는 ‘야훼께서 말씀하십니다’로 옮겼습니다.
  alternative_readings:
  - ‘야훼의 말씀이시다’ 식의 간접 표현
  - 따옴표 없이 서술형으로 통합
  rationale: 히브리어의 직접 화법과 선지자 수식 공식을 한국어에서도 분명히 구분해야 심판 선언의 즉각성과 권위를 보존할 수 있습니다.
  doctrine_reference: 예언자적 발화 형식 보존
- issue: יְהוָה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 언약 이름을 직접 사용하는 예언 공식이므로, 일반 호칭인 ‘주님’보다 고유 নাম을 드러내는 ‘야훼’가 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
