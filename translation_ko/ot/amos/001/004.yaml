base_translation:
  language: en
  yaml_path: translation/ot/amos/001/004.yaml
  text: So I will send fire upon the house of Hazael[a], and it will consume the citadels of Ben-hadad.
  footnotes:
  - marker: a
    text: Or 'palaces'; the Hebrew term can refer to palatial buildings or fortified strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 하사엘의 집에 불을 보내겠으며, 그 불이 벤하닷의 성채들을 삼킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁전들’. 히브리어 표현은 궁전 건물이나 요새화된 성채를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: So I will send
  chosen_korean: 그러므로 내가 ... 보내어
  alternatives_korean:
  - 내가 ... 보낼 것입니다
  - 그리고 내가 ... 보내겠습니다
  lexicon: HALOT
  rationale: 선지서의 심판 맥락에서 앞선 문맥의 결과를 나타내는 연결을 살려 ‘그러므로’로 옮기고, 동사는 현대 한국어에서 자연스러운 ‘보내어’로 표현했습니다.
- source_word: בְּבֵית חֲזָאֵל
  english_pob_choice: upon the house of Hazael
  chosen_korean: 하사엘의 집에
  alternatives_korean:
  - 하사엘의 왕가에
  - 하사엘의 집을 향해
  lexicon: HALOT
  rationale: 히브리어 ‘집’은 문자적 건물보다 왕조/통치 집안을 가리킬 수 있으므로, 그 범위를 유지하면서도 한국어로 자연스럽게 ‘하사엘의 집’이라고 옮겼습니다.
- source_word: אַרְמְנוֹת
  english_pob_choice: the citadels
  chosen_korean: 성채들을
  alternatives_korean:
  - 궁궐들을
  - 요새들을
  lexicon: HALOT
  rationale: 이 단어는 궁전과 요새의 의미 범위를 가지며, 심판 선포의 맥락에서는 왕실 건축물과 방어 거점을 함께 포괄하는 ‘성채들’이 가장 적절합니다.
- source_word: בֶּן הֲדָד
  english_pob_choice: Ben-hadad
  chosen_korean: 벤하닷
  alternatives_korean:
  - 벤-하닷
  - 벤하닷 왕
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 히브리어의 왕조명/고유명사 성격을 보존했습니다.
theological_decisions:
- issue: 불의 이미지
  chosen_reading: 심판의 실제적 이미지로서 ‘불’을 문자적으로 유지했습니다.
  alternative_readings:
  - 군사적 파괴를 풀어서 설명하기
  - 하나님의 진노로 의역하기
  rationale: 본문은 추상화보다 구체적 이미지인 ‘불’을 사용하므로, 예언적 심판의 강도를 약화시키지 않기 위해 직역적 이미지를 유지했습니다.
  doctrine_reference: 예언서의 심판 이미지 보존
