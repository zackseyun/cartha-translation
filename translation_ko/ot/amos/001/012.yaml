id: AMO.1.12
reference: Amos 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/תֵימָ֑ן וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בָּצְרָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/012.yaml
  text: So I will send fire upon Teman[a], and it will consume the citadels of Bozrah.
  footnotes:
  - marker: a
    text: Or 'the palaces of Bozrah.' The Hebrew term can refer to palatial residences or fortified strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 데만에 불을 보내리니, 그것이 보스라의 요새들을 삼킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요새들’은 히브리어 אַרְמְנוֹת가 가리킬 수 있는 ‘궁전들’ 또는 ‘요새화된 거처들’을 함께 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שִׁלַּחְתִּי
  english_pob_choice: So I will send
  chosen_korean: 그러므로 내가 보내리니
  alternatives_korean:
  - 내가 보내겠습니다
  - 그리고 내가 보내리니
  lexicon: HALOT
  rationale: 예언적 심판 선언의 문맥에서 접속사 וְ는 단순한 ‘그리고’보다 앞선 선언의 결과를 잇는 ‘그러므로’가 자연스럽고, 히필 동사 שׁלח는 ‘보내다’로 직접 옮기는 것이 원문을 잘 드러냅니다.
- source_word: אֵשׁ
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 화재
  - 불길
  lexicon: HALOT
  rationale: 히브리어 אֵשׁ의 기본 의미를 그대로 살려 ‘불’로 옮겼고, 문맥상 심판의 불이라는 비유를 지나치게 풀어 쓰지 않았습니다.
- source_word: תֵימָן
  english_pob_choice: Teman
  chosen_korean: 데만
  alternatives_korean:
  - 테만
  - 데만 지역
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역했고, 예언 선포의 표적이 되는 지명을 그대로 유지했습니다.
- source_word: אַרְמְנוֹת
  english_pob_choice: the citadels
  chosen_korean: 요새들
  alternatives_korean:
  - 성채들
  - 궁전들
  lexicon: HALOT
  rationale: אַרְמְנוֹת는 궁전 같은 지배층 거처이면서도 방어된 강한 구조물을 가리킬 수 있어, 한국어에서는 그 군사적·방어적 기능을 드러내는 ‘요새들’이 가장 균형적입니다.
- source_word: בָּצְרָה
  english_pob_choice: of Bozrah
  chosen_korean: 보스라의
  alternatives_korean:
  - 보스라에 있는
  - 보스라의 성채들
  lexicon: HALOT
  rationale: 보스라는 고유명사이므로 음역을 유지했고, construct 관계를 살려 ‘보스라의’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 심판의 불 이미지
  chosen_reading: 불을 추상화하지 않고, 하나님이 보내시는 구체적 심판 행위로 그대로 제시했습니다.
  alternative_readings:
  - 일반적인 파괴나 멸망으로 완화하여 표현
  rationale: 원문은 예언적 심판 공식으로서 실제성을 지닌 이미지를 사용하므로, 이를 약화하지 않고 직접적 심판 선언으로 옮기는 것이 본문의 힘을 보존합니다.
  doctrine_reference: '예언서 번역 원칙: 원문 이미지와 심판의 긴박성을 보존'
