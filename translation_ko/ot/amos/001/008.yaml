source:
  edition: WLC
  text: וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מֵֽ/אַשְׁדּ֔וֹד וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מֵֽ/אַשְׁקְל֑וֹן וַ/הֲשִׁיב֨וֹתִי יָדִ֜/י עַל עֶקְר֗וֹן וְ/אָֽבְדוּ֙ שְׁאֵרִ֣ית פְּלִשְׁתִּ֔ים אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/008.yaml
  text: And I will cut off the inhabitant from Ashdod[a], and the one who holds the scepter from Ashkelon; I will turn my hand against Ekron[b], and the remnant of the Philistines shall perish,” says the Lord GOD.
  footnotes:
  - marker: a
    text: Or, 'the ruler from Ashkelon'; literally, 'the one who holds the scepter.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will bring back my hand against Ekron.' The Hebrew idiom conveys directed judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 아스돗의 주민을, 아스글론의 홀을 잡는 이를 끊어 버리겠습니다. 내가 에그론을 향해 내 손을 돌리겠습니다. 그리고 블레셋의 남은 자가 멸망할 것입니다”라고 주 하나님이 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아스글론의 통치자’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘홀을 잡는 이’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에그론을 향해 내 손을 되돌리겠습니다’로도 옮길 수 있습니다. 히브리어 관용구는 심판의 방향성을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: I will cut off
  chosen_korean: 끊어 버리겠습니다
  alternatives_korean:
  - 끊겠습니다
  - 없애 버리겠습니다
  lexicon: HALOT
  rationale: כרת의 심판적 ‘끊다/제거하다’ 의미를 살리면서도, 한국어에서 예언적 단언의 강도를 자연스럽게 전달합니다.
- source_word: וְתוֹמֵךְ שֵׁבֶט
  english_pob_choice: the one who holds the scepter
  chosen_korean: 홀을 잡는 이
  alternatives_korean:
  - 홀이를 잡는 이
  - 통치자를
  - 왕권을 쥔 이
  lexicon: HALOT
  rationale: שֵׁבֶט을 ‘홀/왕홀’의 이미지로 유지해 지배자의 직함으로 평평하게 풀어버리지 않고, 원문의 비유적 표현을 보존합니다.
- source_word: וַהֲשִׁיבוֹתִי יָדִי עַל
  english_pob_choice: I will turn my hand against
  chosen_korean: 내 손을 돌리겠습니다
  alternatives_korean:
  - 내 손을 에그론에 돌리겠습니다
  - 내 손을 에그론에 되돌리겠습니다
  - 내 손을 에그론을 향해 펴겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘되돌리다/돌리다’ 뉘앙스를 살리되, 한국어에서는 심판의 방향성을 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: שְׁאֵרִית פְּלִשְׁתִּים
  english_pob_choice: the remnant of the Philistines
  chosen_korean: 블레셋의 남은 자
  alternatives_korean:
  - 블레셋의 남은 자들
  - 블레셋의 남은 사람들
  - 블레셋의 생존자들
  lexicon: HALOT
  rationale: שְׁאֵרִית의 ‘남은 자/잔존자’ 의미를 보존하면서, 예언서에서 익숙한 ‘남은 자’ 표현을 한국어로 일관되게 살렸습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님 야훼
  - 주 여호와 하나님
  lexicon: HALOT
  rationale: אֲדֹנָי와 יְהוִה의 이중 호칭을 한국어에서 가장 직접적으로 드러내면서도, ‘주 하나님’으로 자연스럽고 경건한 종결을 유지합니다.
theological_decisions:
- issue: 아모스의 심판 선언에서 신적 행위의 직설성과 어조
  chosen_reading: ‘내가 … 끊어 버리겠습니다’와 ‘내 손을 돌리겠습니다’를 유지해, 심판의 적극성과 방향성을 약화시키지 않았습니다.
  alternative_readings:
  - ‘멸망시키겠습니다’로 완화
  - ‘내 손을 에그론에 대하겠습니다’처럼 더 직역
  rationale: 본문은 단순한 결과 진술이 아니라 야훼의 능동적 심판 행위를 선포하므로, 예언자적 단언을 분명히 드러내는 어휘를 택했습니다.
  doctrine_reference: Amos 1:8의 심판 신탁 어조
