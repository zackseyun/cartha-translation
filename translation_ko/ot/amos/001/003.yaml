id: AMO.1.3
reference: Amos 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י דַמֶּ֔שֶׂק וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל דּוּשָׁ֛/ם בַּ/חֲרֻצ֥וֹת הַ/בַּרְזֶ֖ל אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/003.yaml
  text: 'Thus says Yahweh: “For three transgressions of Damascus[a], and for four, I will not revoke it, because they threshed Gilead with threshing sledges of iron.”'
  footnotes:
  - marker: a
    text: Or “I will not turn it back,” that is, I will not reverse the judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “다메섹의 세 가지 반역, 아니 네 가지 반역 때문에 나는 그것을 되돌리지 않겠습니다. 그들이 쇠로 만든 타작 썰매로 길르앗을 타작했기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 이렇게 말씀하십니다, 야훼께서
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식은 현대 한국어에서 자연스럽게 옮기되, 하나님의 이름 יְהוָה는 POB 지침에 따라 ‘야훼’로 직접 옮겼습니다.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  english_pob_choice: For three transgressions of Damascus, and for four
  chosen_korean: 다메섹의 세 가지 반역, 아니 네 가지 반역 때문에
  alternatives_korean:
  - 다메섹의 세 가지 범죄, 그리고 네 가지 때문에
  - 다메섹의 세 가지 죄악, 아니 네 가지 때문에
  lexicon: HALOT
  rationale: פֶּשַׁע의 반역/불법성 강한 뉘앙스를 살려 ‘반역’으로 옮기고, 히브리어의 수적 과장 구조를 한국어에서도 드러내기 위해 ‘아니 네 가지’로 살렸습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not revoke it
  chosen_korean: 나는 그것을 되돌리지 않겠습니다
  alternatives_korean:
  - 나는 그것을 철회하지 않겠습니다
  - 나는 그것을 돌이키지 않겠습니다
  lexicon: HALOT
  rationale: 문맥상 판결/심판을 되돌리지 않겠다는 뜻이지만, 히브리어의 생략된 목적어를 보존하기 위해 ‘그것’을 유지하고, POB의 판단상 ‘revoke it’를 한국어 동사로 자연스럽게 옮겼습니다.
- source_word: בַּחֲרֻצוֹת הַבַּרְזֶל
  english_pob_choice: with threshing sledges of iron
  chosen_korean: 쇠로 만든 타작 썰매로
  alternatives_korean:
  - 쇠 타작 기구로
  - 철제 타작 썰매로
  lexicon: HALOT
  rationale: חֲרֻצוֹת는 타작 썰매/타작 기구를 가리키므로, 폭력적 이미지를 유지하는 ‘타작 썰매’를 택했고, ‘of iron’은 ‘쇠로 만든’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예언 선포 공식에서 하나님의 이름 표기
  chosen_reading: יהוה를 ‘야훼’로 직접 표기하고, 전령 공식 전체를 존중했습니다.
  alternative_readings:
  - ‘주님’으로 순화
  - ‘여호와’ 표기
  rationale: 이 단락은 텍스트에 직접 나타난 신명(神名)을 포함하므로, 프로젝트 기본값에 따라 본문에서 이름 자체를 드러내는 것이 출처 충실성과 신학적 투명성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לֹא אֲשִׁיבֶנּוּ의 판결적 종결성
  chosen_reading: ‘그것을 되돌리지 않겠습니다’로 심판 철회를 부정하는 판결 선언으로 읽었습니다.
  alternative_readings:
  - ‘그것을 철회하지 않겠습니다’
  - ‘그것을 돌이키지 않겠습니다’
  rationale: 히브리어는 목적어를 생략한 채 판결의 비가역성을 말하므로, 본문에 없는 ‘벌’ 같은 명시어를 덧붙이지 않고도 심판의 확정성을 드러내는 번역이 적절합니다.
  doctrine_reference: Amos 1:3 judgment oracle
