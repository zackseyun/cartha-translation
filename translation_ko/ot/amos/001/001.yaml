revisions:
- from: 아모스의 말들입니다. 그는 드고아 출신의 양 떼를 기르는 자들 가운데 있었으며, 유다 왕 웃시야의 시대와 이스라엘 왕 요아스의 아들 여로보암의 시대에 이스라엘에 관하여 환상을 보았습니다. 그 지진이 있기 두 해 전이었습니다.[a][b]
  to: 드고아 출신 양 사육자들[a] 가운데 있던 아모스가 유다 왕 웃시야의 시대와 이스라엘 왕 요아스의 아들 여로보암의 시대에, 그 지진이 있기 두 해 전에 이스라엘에 관하여[b] 본 말씀입니다.
  rationale: ‘환상’을 삭제하여 חָזָה의 기본 의미를 보존하고, ‘아모스가 … 본 말씀’이라는 단일 표제문 구조로 원문의 문법적 관계를 더 충실하고 자연스럽게 옮겼습니다. נֹקְדִים의 전문적 직업 의미와 עַל의 의미 범위는 본문 및 각주에서 유지했으며, 각주 표지는 해당 번역어에 직접 배치했습니다.
