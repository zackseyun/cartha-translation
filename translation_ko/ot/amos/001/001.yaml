id: AMO.1.1
reference: Amos 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבְרֵ֣י עָמ֔וֹס אֲשֶׁר הָיָ֥ה בַ/נֹּקְדִ֖ים מִ/תְּק֑וֹעַ אֲשֶׁר֩ חָזָ֨ה עַל יִשְׂרָאֵ֜ל בִּ/ימֵ֣י עֻזִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה וּ/בִ/ימֵ֞י יָרָבְעָ֤ם בֶּן יוֹאָשׁ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל שְׁנָתַ֖יִם לִ/פְנֵ֥י הָ/רָֽעַשׁ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/001.yaml
  text: The words of Amos[a], who was among the shepherds from Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah and in the days of Jeroboam son of Joash, king of Israel[b], two years before the earthquake.
  footnotes:
  - marker: a
    text: Or 'among the shepherds.' The Hebrew term likely refers more specifically to sheep breeding than to shepherding in general.
    reason: lexical_alternative
  - marker: b
    text: Or 'against Israel.' The preposition can carry either sense in prophetic contexts; 'concerning' is chosen here as the broader superscriptional wording.
    reason: alternative_reading
translation:
  language: ko
  text: 아모스의 말들입니다. 그는 드고아 출신의 양 떼를 기르는 자들 가운데 있었으며, 유다 왕 웃시야의 시대와 이스라엘 왕 요아스의 아들 여로보암의 시대에 이스라엘에 관하여 환상을 보았습니다. 그 지진이 있기 두 해 전이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘양 떼를 기르는 자들’은 일반적 ‘목자들’보다 히브리어 נֹקְדִים의 더 구체적인 직업적 의미를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘에 관하여’는 예언 문맥에서 ‘이스라엘을 대하여/향하여’로도 이해될 수 있는 עַל의 폭을 남겨 둔 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: 말들입니다
  alternatives_korean:
  - 말씀입니다
  - 이야기입니다
  lexicon: HALOT
  rationale: 예언서 서문의 정형 표현인 ‘The words of’를 한국어로 과도하게 신학화하지 않으면서도, 아모스의 선포 전체를 포괄하는 ‘말들’로 옮겼습니다.
- source_word: בַנֹּקְדִים
  english_pob_choice: among the shepherds
  chosen_korean: 양 떼를 기르는 자들 가운데
  alternatives_korean:
  - 목자들 가운데
  - 양 사육자들 가운데
  lexicon: HALOT
  rationale: נֹקֵד은 일반적인 ‘목자’보다 양 떼를 기르는 직업을 더 구체적으로 가리키므로, 그 전문성을 살려 풀어 옮겼습니다.
- source_word: חָזָה
  english_pob_choice: saw
  chosen_korean: 환상을 보았습니다
  alternatives_korean:
  - 보았습니다
  - 예언으로 보았습니다
  lexicon: HALOT
  rationale: 동사는 단순 ‘보다’이지만 예언적 계시 맥락이 분명하므로, ‘환상을 보았습니다’로 옮겨 예언적 의미를 드러냈습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: concerning Israel
  chosen_korean: 이스라엘에 관하여
  alternatives_korean:
  - 이스라엘에 대해
  - 이스라엘을 향하여
  lexicon: HALOT
  rationale: 예언서 서문의 עַל은 ‘~에 관하여’와 ‘~을 대하여/향하여’의 범위를 가질 수 있으므로, 본문의 폭을 유지하는 중립적 표현을 택했습니다.
theological_decisions:
- issue: 예언적 표제문에서 ‘보았다’의 대상과 형식
  chosen_reading: ‘말들입니다’와 ‘환상을 보았습니다’를 함께 두어, 예언이 말과 계시를 동시에 포함하는 히브리어 표제문의 형식을 보존했습니다.
  alternative_readings:
  - ‘아모스가 본 말씀들입니다’
  - ‘아모스의 예언입니다’
  rationale: 히브리어는 ‘말들’에 ‘보았다’를 직접 연결하는 독특한 표제문 형식을 취하므로, 이를 평탄화하지 않고 한국어에서도 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
