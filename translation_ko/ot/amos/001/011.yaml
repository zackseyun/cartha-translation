  naturalness: ‘아니 네 가지’는 원문의 누적·강조 공식에 비해 앞말을 정정하는 뉘앙스를 낳으며, ‘칼로 … 추적하며’와 ‘긍휼을 파괴했고’는 현대 한국어에서 다소 부자연스럽습니다. 또한 ‘분노는 … 찢었으며’는 포식자 비유를 유지하되 ‘찢어 댔다’가 더 자연스럽습니다.
