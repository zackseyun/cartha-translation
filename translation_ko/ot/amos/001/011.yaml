revisions:
- from: 야훼께서 이렇게 말씀하십니다. 「에돔의 세 가지 범죄 때문에, 아니 네 가지 때문에도, 나는 그 벌을 거두어들이지 않겠다. 이는 그가 칼로 자기의 형제를 추적하며 그의 긍휼을 파괴했고, 그의 분노는 끊임없이 찢었으며 그의 격노는 영원히 간직되었기 때문이다.」[a][b][c]
  to: 야훼께서 이렇게 말씀하십니다. “에돔의 세 가지 죄악과 네 가지 죄악 때문에, 나는 그 벌을 거두어들이지 않겠습니다.[a] 그가 칼로 자기 형제를[b] 뒤쫓고 그의 긍휼을 없애 버렸으며, 그의 분노가 끊임없이 찢어 댔고[c] 그가 자기의 격노를 영원히 간직했기 때문입니다.”
  rationale: 능동 주어 ‘그가 자기의 격노를 … 간직했다’를 복원하고, ‘세 가지와 네 가지’라는 예언적 심판 공식을 보존했습니다. 현대 한국어의 자연스러움을 위해 ‘추적하며’를 ‘뒤쫓고’로, ‘긍휼을 파괴했고’를 ‘긍휼을 없애 버렸으며’로 다듬었습니다. וַיִּטְרֹף의 비유적 문법 관계는 논의가 있으므로, 본문에서는 원문의 의인화와 포식적 이미지를 유지하고 각주에서 대안적 구문을 밝혔습니다. 각주 표지도 해당 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:41Z'
