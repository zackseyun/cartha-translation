id: AMO.1.11
reference: Amos 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י אֱד֔וֹם וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל רָדְפ֨/וֹ בַ/חֶ֤רֶב אָחִי/ו֙ וְ/שִׁחֵ֣ת רַחֲמָ֔י/ו וַ/יִּטְרֹ֤ף לָ/עַד֙ אַפּ֔/וֹ וְ/עֶבְרָת֖/וֹ שְׁמָ֥רָ/ה נֶֽצַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/011.yaml
  text: 'Thus says Yahweh: “For three transgressions of Edom[a], and for four, I will not revoke its punishment, because he pursued his brother with the sword and destroyed his compassion; his anger tore continually[c][b], and he kept his wrath forever.”'
  footnotes:
  - marker: a
    text: Or, 'I will not turn it back,' that is, I will not reverse the announced judgment.
    reason: lexical_alternative
  - marker: b
    text: '''His brother'' likely evokes Edom''s kinship with Israel through Esau and Jacob.'
    reason: cross_reference
  - marker: c
    text: Or, 'he tore perpetually in his anger, and kept his wrath forever.' The Hebrew uses vivid predatory imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “에돔의 세 가지 죄악과 네 가지 죄악 때문에, 나는 그 벌을 거두어들이지 않겠습니다.[a] 그가 칼로 자기 형제를[b] 뒤쫓고 그의 긍휼을 없애 버렸으며, 그의 분노가 끊임없이 찢어 댔고[c] 그가 자기의 격노를 영원히 간직했기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 벌을 거두어들이지 않겠다’는 직역하면 ‘그것을 돌이키지 않겠다’라는 뜻으로, 선포된 심판을 철회하지 않겠다는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 에돔이 에서와 야곱을 통한 이스라엘과의 혈연적 연관을 떠올리게 합니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘그가 분노하여 끊임없이 찢어 댔고.’ 히브리어는 포식자가 찢는 듯한 생생한 이미지를 사용하며, 주어와 목적어의 정확한 관계는 논의됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יהוה를 제목어로 돌려 쓰지 않고 음역하여 보존해야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not revoke its punishment
  chosen_korean: 나는 그 벌을 거두어들이지 않겠다
  alternatives_korean:
  - 나는 그것을 돌이키지 않겠다
  - 나는 그를 되돌리지 않겠다
  - 나는 그 벌을 철회하지 않겠다
  lexicon: HALOT
  rationale: 히브리어 관용구는 선포된 심판을 거두어들이지 않겠다는 뜻이므로, 한국어에서는 의미를 드러내되 너무 해설적으로 늘리지 않도록 ‘그 벌을 거두어들이지 않겠다’로 옮겼습니다.
- source_word: רָדְפוֹ בַחֶרֶב אָחִיו
  english_pob_choice: he pursued his brother with the sword
  chosen_korean: 그가 칼로 자기의 형제를 추적하며
  alternatives_korean:
  - 그가 칼로 자기의 형제를 쫓으며
  - 그가 칼로 자기 형제를 뒤쫓으며
  lexicon: HALOT
  rationale: ‘추적하다/쫓다’는 אַחר/רדף의 폭력적 추격 이미지를 살리며, 목적격과 도구를 자연스러운 한국어 어순으로 배치했습니다.
- source_word: שִׁחֵת רַחֲמָיו
  english_pob_choice: destroyed his compassion
  chosen_korean: 그의 긍휼을 파괴했고
  alternatives_korean:
  - 그의 긍휼을 없앴고
  - 그의 자비를 무너뜨렸고
  - 그의 불쌍히 여김을 파괴했고
  lexicon: HALOT
  rationale: רַחֲמִים은 자비/긍휼/연민을 가리키므로, 본문이 말하는 냉혹한 폭력을 보존하면서도 한국어에서 자연스러운 ‘긍휼’을 선택했습니다.
- source_word: וַיִּטְרֹף לָעַד אַפּוֹ
  english_pob_choice: his anger tore continually
  chosen_korean: 그의 분노는 끊임없이 찢었으며
  alternatives_korean:
  - 그의 분노는 끊임없이 뜯었으며
  - 그의 분노는 계속 찢었으며
  - 그의 분노는 계속 사납게 달려들었으며
  lexicon: HALOT
  rationale: טרף의 본래 이미지인 ‘찢다/뜯어 먹다’의 포식적 비유를 살리기 위해 직역에 가깝게 ‘끊임없이 찢다’로 옮겼습니다.
- source_word: וְעֶבְרָתוֹ שְׁמָרָה נֶצַח
  english_pob_choice: he kept his wrath forever
  chosen_korean: 그의 격노는 영원히 간직되었기 때문이다
  alternatives_korean:
  - 그의 격노는 영원히 보존되었기 때문이다
  - 그의 격노를 영원히 지켰기 때문이다
  lexicon: HALOT
  rationale: שָׁמַר는 ‘지키다/간직하다’의 뜻이므로, 격노를 오래 품고 놓지 않는 상태를 ‘간직되다’로 표현해 병렬 구조를 살렸습니다.
theological_decisions:
- issue: 에돔을 집단명으로 부르면서도 히브리어의 단수 인칭 동사를 유지하는 문제
  chosen_reading: ‘에돔’은 나라 이름으로 유지하되, 뒤의 동작은 인격화된 단수 표현을 한국어에서도 살렸습니다.
  alternative_readings:
  - 에돔 사람들이 추적했다
  - 그들이 형제를 추적했다
  rationale: 원문은 민족을 단수 주어로 의인화하므로, 이를 평탄하게 집단복수로 바꾸면 예언적 고발의 강도가 약해집니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms) and §6 (readable modern Korean)
