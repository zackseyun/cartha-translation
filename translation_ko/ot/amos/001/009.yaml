source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
  footnotes:
  - marker: a
    text: Or, more literally, “I will not turn it back,” with the object left unstated in Hebrew; the sense is that the announced judgment will not be revoked.
    reason: lexical_alternative
  - marker: b
    text: Or “an entire exile community” or “a whole captivity.” The Hebrew phrase refers to handing over a complete group of captives/exiles.
    reason: lexical_alternative
  - marker: c
    text: Literally, “a covenant of brothers.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “두로의 세 가지 죄악 때문에, 네 가지 죄악 때문에도 나는 그 벌을 거두지 않겠습니다[a]. 그들이 포로 무리 전체를[b] 에돔에 넘겨주고 형제의 언약을[c] 기억하지 않았기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 목적어를 명시하지 않고 문자적으로 ‘그것을 돌이키지 않겠다’라고 합니다. 문맥상 선포된 심판 또는 그 벌을 철회하지 않겠다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘완전한 포로 집단’ 또는 ‘온전한 포로 상태’에 가까우며, 포로가 된 사람들 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘형제들의 언약’입니다.
    reason: lexical_alternative
