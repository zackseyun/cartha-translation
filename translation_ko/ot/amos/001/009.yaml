id: AMO.1.9
reference: Amos 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
  footnotes:
  - marker: a
    text: Or, more literally, “I will not turn it back,” with the object left unstated in Hebrew; the sense is that the announced judgment will not be revoked.
    reason: lexical_alternative
  - marker: b
    text: Or “an entire exile community” or “a whole captivity.” The Hebrew phrase refers to handing over a complete group of captives/exiles.
    reason: lexical_alternative
  - marker: c
    text: Literally, “a covenant of brothers.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “두 가지가 아니라 세 가지이지만 네 가지까지도 이어진 두로의 죄악 때문에 나는 그 벌을 거두지 않겠습니다. 그들이 포로 무리를 온전히 에돔에게 넘겨 주었고, 형제의 언약을 기억하지 않았기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 목적어를 생략하여 ‘그것을 돌이키지 않겠다’에 가깝지만, 문맥상 선포된 심판의 철회를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘포로 무리’는 문자적으로는 ‘완전한 포로/포로 상태’에 가까우며, 포로들 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘형제들의 언약’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 여호와께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식은 한국어로 자연스럽게 옮기되, 본문에 나타난 신명은 POB의 원칙에 따라 야훼로 옮겼습니다.
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  english_pob_choice: For three ... and for four
  chosen_korean: 두 가지가 아니라 세 가지이지만 네 가지까지도 이어진
  alternatives_korean:
  - 세 가지 죄악 때문에, 그리고 네 가지 때문에
  - 세 번의 죄악 때문에, 네 번까지도
  lexicon: HALOT
  rationale: 아모스의 수적 점층 관용구를 한국어로도 유지하되, 반복과 누적의 압박감을 살리는 표현으로 옮겼습니다.
- source_word: פִּשְׁעֵי
  english_pob_choice: transgressions
  chosen_korean: 죄악
  alternatives_korean:
  - 범죄
  - 반역
  lexicon: HALOT
  rationale: פֶּשַׁע 계열의 예언자적 고발 어휘로서 단순한 실수보다 더 강한 도덕적·언약적 위반을 드러내는 말로 옮겼습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not revoke its punishment
  chosen_korean: 나는 그 벌을 거두지 않겠습니다
  alternatives_korean:
  - 나는 그것을 돌이키지 않겠습니다
  - 나는 그것을 철회하지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 목적어를 문맥상 ‘판결/벌’로 풀어, 선언된 심판이 취소되지 않는다는 뜻을 자연스럽게 드러냈습니다.
- source_word: גָּלוּת שְׁלֵמָה
  english_pob_choice: an entire population of exiles
  chosen_korean: 포로 무리를 온전히
  alternatives_korean:
  - 온전한 포로 집단을
  - 완전한 포로 상태를
  lexicon: HALOT
  rationale: ‘포로’와 ‘무리’로 집합성을 살리고, שְׁלֵמָה의 ‘온전한/완전한’ 의미를 함께 반영했습니다.
- source_word: בְּרִית אַחִים
  english_pob_choice: a covenant of brotherhood
  chosen_korean: 형제의 언약
  alternatives_korean:
  - 형제애의 언약
  - 형제들 사이의 언약
  lexicon: HALOT
  rationale: 직역에 가까우면서도 한국어에서 자연스러운 결합으로, 혈연·동맹의 친족적 의무를 드러내는 표현을 택했습니다.
