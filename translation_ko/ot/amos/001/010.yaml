id: AMO.1.10
reference: Amos 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/ח֣וֹמַת צֹ֑ר וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/010.yaml
  text: So I will send fire upon the wall of Tyre[a], and it will consume her citadels.
  footnotes:
  - marker: a
    text: Or "her palaces." The Hebrew term can refer to palatial buildings or fortified strongholds/citadels.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 두로의 성벽에 불을 보내겠으며, 그 불이 그 성채들을 삼킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 궁전들.” 히브리어 용어는 궁전 건물이나 요새화된 성채를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: So I will send
  chosen_korean: 그러므로 내가 … 보내리니
  alternatives_korean:
  - 그리고 내가 … 보내리니
  - 그때 내가 … 보내리니
  lexicon: HALOT
  rationale: 예언적 심판 선언의 이어짐을 나타내는 접속을 한국어에서는 ‘그러므로’로 자연스럽게 살렸고, 1인칭 미래 선언도 유지했습니다.
- source_word: אֵשׁ
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 불꽃
  - 화염
  lexicon: HALOT
  rationale: 히브리어 אֵשׁ의 기본 의미를 그대로 살리되, 심판의 이미지가 과장되지 않도록 가장 직접적인 표준어 ‘불’로 옮겼습니다.
- source_word: בְּחוֹמַת
  english_pob_choice: upon the wall
  chosen_korean: 성벽에
  alternatives_korean:
  - 성벽 위에
  - 성벽을 향해
  lexicon: HALOT
  rationale: ב + ‘성벽’은 공격 대상에 대한 작용을 나타내므로, 한국어에서는 자연스러운 목적격/부사격 결합인 ‘성벽에’가 원문의 공격적 함의를 잘 전달합니다.
- source_word: אַרְמְנֹתֶיהָ
  english_pob_choice: her citadels
  chosen_korean: 그 성채들
  alternatives_korean:
  - 그 궁전들
  - 그 견고한 요새들
  lexicon: HALOT
  rationale: אַרְמוֹן은 ‘궁전’과 ‘요새/성채’의 뜻을 가질 수 있는데, 이 심판 문맥에서는 왕궁의 화려함보다 도시의 방어 시설을 가리키는 ‘성채’가 더 적절합니다.
theological_decisions:
- issue: 화염의 성격을 어느 정도까지 특정할지
  chosen_reading: 본문이 말하는 ‘불’을 하나님의 심판 행위로 직역하되, 그 불이 문자적 화재인지 전쟁에 의한 파괴인지 따로 규정하지 않았습니다.
  alternative_readings:
  - 전쟁으로 인한 파괴를 가리키는 비유로 명시
  - 실제 화재로 한정
  rationale: 히브리어는 하나님이 불을 보내고 그것이 성채들을 삼킨다고만 말하므로, 해석을 과도하게 좁히지 않고 예언적 심판 언어의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
