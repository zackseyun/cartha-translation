source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י עַזָּ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל הַגְלוֹתָ֛/ם גָּל֥וּת שְׁלֵמָ֖ה לְ/הַסְגִּ֥יר לֶ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Gaza[a], and for four, I will not revoke its punishment[b], because they carried away an entire population into exile to hand them over to Edom.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''I will not turn it back''; the sense in this judgment formula is that the LORD will not revoke the announced punishment.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they exiled a whole captivity'—that is, they deported an entire population or full company of captives.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “가사의 세 가지 허물과 네 가지 허물 때문에 나는 그것을 되돌리지 않겠다. 이는 그들이 한 사람 전체를 포로로 끌고 가서 에돔에 넘겼기 때문이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘되돌리다/돌이키다’라는 뜻입니다. 이 심판 공식에서는 여호와께서 선포된 형벌을 철회하지 않으신다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 한 집단 전체를 포로로 잡아 끌고 간 강제 이주를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트의 기본 원칙에 따라 신성호칭은 야훼로 옮기고, 본문 첫머리의 예언자적 선언 형식을 살렸습니다.
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  english_pob_choice: For three ... and for four
  chosen_korean: 세 가지 허물과 네 가지 허물 때문에
  alternatives_korean:
  - 세 가지 허물과 네 가지 때문에
  - 세 번과 네 번 때문에
  lexicon: HALOT
  rationale: 히브리어의 수사적 증폭 공식을 자연스러운 한국어로 옮겨, 단순한 횟수보다 죄의 충만함을 드러냈습니다.
- source_word: פִּשְׁעֵי
  english_pob_choice: transgressions
  chosen_korean: 허물
  alternatives_korean:
  - 범죄
  - 반역
  lexicon: HALOT
  rationale: pesha의 도덕적·언약적 위반성을 살리되, 한국어에서 지나치게 법률적이거나 정치적으로 좁아지지 않도록 했습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not revoke its punishment
  chosen_korean: 나는 그것을 되돌리지 않겠다
  alternatives_korean:
  - 나는 그것을 철회하지 않겠다
  - 나는 그것을 취소하지 않겠다
  lexicon: HALOT
  rationale: 히브리어의 직역적 힘을 살려 ‘되돌리다’로 옮기고, 예언적 심판 선언의 불가역성을 유지했습니다.
- source_word: הַגְלוֹתָם גָּלוּת שְׁלֵמָה
  english_pob_choice: they carried away an entire population into exile
  chosen_korean: 한 사람 전체를 포로로 끌고 가서
  alternatives_korean:
  - 온 백성을 포로로 끌고 가서
  - 한 무리 전체를 유배시켜
  lexicon: HALOT
  rationale: 전체적 강제 이주의 의미를 살리되, 뒤의 ‘에돔에 넘겼다’와 연결되도록 간결하게 표현했습니다.
- source_word: לְהַסְגִּיר לֶאֱדוֹם
  english_pob_choice: to hand them over to Edom
  chosen_korean: 에돔에 넘겼기 때문이다
  alternatives_korean:
  - 에돔에 넘겨 주었기 때문이다
  - 에돔에게 인도했기 때문이다
  lexicon: HALOT
  rationale: לְהַסְגִּיר의 ‘인계/넘겨 줌’ 의미를 한국어의 ‘넘기다’로 자연스럽게 옮기면서, 에돔을 수혜자로 분명히 했습니다.
theological_decisions:
- issue: The judgment formula in Amos 1:6 with an implied object
  chosen_reading: ‘그것을 되돌리지 않겠다’로 옮겨, 선언된 심판이 철회되지 않는다는 뜻을 본문 안에서 드러내었습니다.
  alternative_readings:
  - ‘그의 형벌을 되돌리지 않겠다’
  - ‘되돌리지 않겠다’처럼 목적어를 완전히 생략
  rationale: 히브리어는 목적어를 암시하지만, 아모스 1–2장의 반복 공식에서는 심판의 철회 불가가 핵심이므로 한국어 문맥에서 그 의미를 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: גָּלוּת שְׁלֵמָה의 범위
  chosen_reading: ‘한 사람 전체를 포로로 끌고 가서’로, 일부 포로가 아니라 집단 전체의 강제 이주를 나타내도록 했습니다.
  alternative_readings:
  - ‘완전한 포로 상태’
  - ‘온전한 포로 무리’
  rationale: 문맥상 특정 집단을 통째로 사로잡아 이주시킨 행위를 가리키므로, 그 총체성을 한국어로 간결하게 표현했습니다.
  doctrine_reference: Translation philosophy §1, §6
