id: AMO.1.14
reference: Amos 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/חוֹמַ֣ת רַבָּ֔ה וְ/אָכְלָ֖ה אַרְמְנוֹתֶ֑י/הָ בִּ/תְרוּעָה֙ בְּ/י֣וֹם מִלְחָמָ֔ה בְּ/סַ֖עַר בְּ/י֥וֹם סוּפָֽה
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/014.yaml
  text: I will kindle a fire in the wall of Rabbah[a], and it will consume her citadels, with a battle cry on the day of war[c][b], with a storm on the day of tempest.
  footnotes:
  - marker: a
    text: Or 'her palaces' or 'her strongholds' for 'her citadels.'
    reason: lexical_alternative
  - marker: b
    text: '''Battle cry'' translates a Hebrew term that can also mean a loud shout of alarm, sometimes associated with a trumpet blast.'
    reason: lexical_alternative
  - marker: c
    text: The storm imagery may echo the LORD's judgment as a divine warrior, while still fitting the immediate picture of wartime destruction.
    reason: cross_reference
translation:
  language: ko
  text: 내가 라바의 성벽에 불을 지르겠습니다. 그 불이 전쟁의 날의 전투 함성과 함께, 폭풍의 날의 광풍과 함께 그 성채들을 삼킬 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성채들’은 ‘궁전들’ 또는 ‘요새들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘전투 함성’은 경보의 외침이나 나팔 소리를 포함할 수 있는 히브리어 표현을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 폭풍 이미지는 전쟁의 파괴 장면과 함께 야훼의 심판을 떠올리게 할 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִצַּתִּי
  english_pob_choice: I will kindle
  chosen_korean: 내가 … 불을 놓으리니
  alternatives_korean:
  - 내가 … 불을 지르리니
  - 내가 … 불을 붙이리니
  lexicon: HALOT
  rationale: 심판 예언의 미래적 완결을 살리면서도, 한국어로는 ‘불을 놓다’가 원인 행위와 파괴적 의도를 자연스럽게 드러냅니다.
- source_word: בְּחוֹמַת רַבָּה
  english_pob_choice: in the wall of Rabbah
  chosen_korean: 라바의 성벽에
  alternatives_korean:
  - 라바의 담에
  - 라바의 방벽에
  lexicon: HALOT
  rationale: חומה는 단순한 담보다 도시 방어시설인 ‘성벽’이 더 정확하며, מקום명 라바는 음역해 본문의 고유성을 유지했습니다.
- source_word: אַרְמְנוֹתֶיהָ
  english_pob_choice: her citadels
  chosen_korean: 그 성채들
  alternatives_korean:
  - 그 궁전들
  - 그 요새들
  lexicon: HALOT
  rationale: אַרְמון은 궁전과 요새적 건물을 함께 가리킬 수 있으므로, 전쟁 문맥에서 의미 폭을 좁히지 않는 ‘성채들’이 적절합니다.
- source_word: בִּתְרוּעָה
  english_pob_choice: with a battle cry
  chosen_korean: 전쟁의 날의 전투 함성으로
  alternatives_korean:
  - 전쟁의 날의 외침으로
  - 전쟁의 날의 나팔 소리처럼
  lexicon: HALOT
  rationale: תרועה는 단순한 소리보다 전투적 경보·함성의 뉘앙스가 있어, ‘전투 함성’으로 옮기되 문맥의 ‘전쟁의 날’과 결합해 뜻을 분명히 했습니다.
- source_word: בְּסַעַר ... בְּיוֹם סוּפָה
  english_pob_choice: with a storm ... on the day of tempest
  chosen_korean: 폭풍의 날의 광풍으로
  alternatives_korean:
  - 폭풍의 날의 폭풍으로
  - 폭풍과 회오리의 날로
  lexicon: HALOT
  rationale: סַעַר와 סוּפָה는 둘 다 강한 폭풍/광풍 계열이므로, 한국어에서는 반복을 살리되 시적 응축을 위해 ‘폭풍의 날의 광풍’으로 표현했습니다.
theological_decisions:
- issue: 전투와 자연재해 이미지의 병치
  chosen_reading: 이 구절은 군사적 파괴와 폭풍 이미지를 함께 사용해 야훼의 심판을 묘사하므로, 둘을 하나로 평평하게 만들지 않았습니다.
  alternative_readings:
  - 폭풍 이미지를 단지 전쟁의 은유로만 볼 수 있습니다.
  - 폭풍 이미지를 직접적인 신현으로 읽을 수 있습니다.
  rationale: 히브리어는 ‘전쟁의 날’과 ‘폭풍의 날’을 병렬로 둡니다. 번역은 그 긴장을 보존해, 심판이 실제 역사적 파괴이면서도 하나님의 주권 아래 있음을 열어 둡니다.
  doctrine_reference: Translation philosophy §3
- issue: 도시를 가리키는 인칭 표지
  chosen_reading: ‘그 성채들’로 옮겨 히브리어의 여성형 소유 접미사가 가리키는 라바를 인격화된 도시로 유지했습니다.
  alternative_readings:
  - ‘그것의 성채들’로 중립화할 수 있습니다.
  rationale: 히브리어에서 도시는 흔히 여성형으로 다루어지므로, ‘그’와 ‘성채들’을 유지해 도시 의인화를 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §5
