source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י בְנֵֽי עַמּ֔וֹן וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל בִּקְעָ/ם֙ הָר֣וֹת הַ/גִּלְעָ֔ד לְמַ֖עַן הַרְחִ֥יב אֶת גְּבוּלָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/013.yaml
  text: 'Thus says Yahweh: “For three transgressions of the sons of Ammon[a], and for four, I will not revoke it[b], because they ripped open the pregnant women of Gilead in order to enlarge their border.”'
  footnotes:
  - marker: a
    text: Or, 'I will not turn it back'—that is, I will not revoke the announced judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the Ammonites' for 'the sons of Ammon.'
    reason: lexical_alternative
translation:
  language: ko
  text: “야훼께서 이렇게 말씀하십니다. ‘암몬 자손의 세 가지 죄악과 네 가지 죄악 때문에 나는 그것을 거두어들이지 않겠습니다. 그들이 길르앗의 임신한 여인들을 갈라 배를 찢어, 자기들의 경계를 넓히려 했기 때문입니다.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그것을 되돌리지 않겠습니다’—즉, 선포된 심판을 철회하지 않겠다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘암몬 사람들’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: “야훼께서 이렇게 말씀하십니다”
  alternatives_korean:
  - “주께서 이렇게 말씀하십니다”
  - “여호와께서 이렇게 말씀하십니다”
  lexicon: WLC; HALOT
  rationale: 예언자적 전언 공식으로 자연스럽게 옮기되, 본문 표기의 신명 יְהוָה는 프로젝트 기본값에 따라 야훼로 렌더링했습니다.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  english_pob_choice: For three transgressions ... and for four
  chosen_korean: “세 가지 죄악과 네 가지 죄악 때문에”
  alternatives_korean:
  - “세 가지 허물과 네 가지 허물 때문에”
  - “세 번의 죄과와 네 번의 죄과 때문에”
  lexicon: HALOT
  rationale: 아모스의 수적 증강 관용구를 살리면서 פֶּשַׁע의 반역·범죄성을 ‘죄악’으로 옮겼습니다.
- source_word: בְנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: “암몬 자손”
  alternatives_korean:
  - “암몬 사람들”
  - “암몬 족속”
  lexicon: HALOT
  rationale: 히브리어의 직설적 족칭 표현을 보존했고, 한국어에서도 본문의 집단 명칭으로 자연스럽습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not revoke it
  chosen_korean: “나는 그것을 거두어들이지 않겠습니다”
  alternatives_korean:
  - “나는 그것을 돌이키지 않겠습니다”
  - “나는 그것을 철회하지 않겠습니다”
  lexicon: HALOT
  rationale: 문맥상 선언된 심판을 되돌리지 않겠다는 뜻이므로, 직역보다 한국어에서 자연스러운 ‘거두어들이다’를 택했습니다.
- source_word: בִּקְעָם
  english_pob_choice: they ripped open
  chosen_korean: “갈라 배를 찢어”
  alternatives_korean:
  - “찢어 열어”
  - “배를 갈라”
  lexicon: HALOT
  rationale: 잔혹한 폭력을 드러내는 동사를 살리되, 한국어 관용에 맞게 ‘배를 찢어’로 구체화했습니다.
- source_word: הָרוֹת הַגִּלְעָד
  english_pob_choice: the pregnant women of Gilead
  chosen_korean: “길르앗의 임신한 여인들”
  alternatives_korean:
  - “길르앗의 아이 밴 여자들”
  - “길르앗의 배부른 여자들”
  lexicon: HALOT
  rationale: 임신 상태를 직접 드러내는 것이 본문의 비극성과 폭력성을 가장 분명하게 전달합니다.
- source_word: לְמַעַן הַרְחִיב אֶת גְּבוּלָם
  english_pob_choice: in order to enlarge their border
  chosen_korean: “자기들의 경계를 넓히려 했기 때문입니다”
  alternatives_korean:
  - “자기들의 경계를 확장하려 했기 때문입니다”
  - “자기들의 영토를 넓히려 했기 때문입니다”
  lexicon: HALOT
  rationale: 목적절을 살리면서 גְּבוּל의 기본 의미인 ‘경계’를 유지했습니다.
