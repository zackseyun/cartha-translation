    text: Or 'her palaces.' The Hebrew term can refer to palatial buildings, often with a fortified or elite sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 가사의 성벽을 향해 불을 보낼 것이며, 그 불이 가사의 요새들을[a] 삼킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 궁전들.’ 히브리어 단어는 궁전 건물을 가리킬 수 있으며, 흔히 요새화되었거나 지배 계층과 관련된 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: So I will send
  chosen_korean: 그러므로 내가 보내고
  alternatives_korean:
  - 내가 보낼 것이며
  - 내가 보내겠습니다
  lexicon: HALOT
  rationale: 예언적 심판 문맥의 연결어를 ‘그러므로’로 살려 앞선 선언의 결과를 드러냈고, 동사는 직접적인 하나님의 행위를 보이는 현재형 서술로 자연스럽게 옮겼습니다.
- source_word: אֵשׁ
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 불꽃
  - 화염
  lexicon: HALOT
  rationale: 표준적이고 직역에 가까운 ‘불’이 심판 이미지의 강도를 가장 직접적으로 전달합니다.
- source_word: בְּחוֹמַת
  english_pob_choice: upon the wall of
  chosen_korean: 성벽에
  alternatives_korean:
  - 성벽 위에
  - 성벽에 대하여
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 공격적 작용을 한국어에서는 단순한 위치가 아니라 타격의 대상임을 드러내는 ‘-에’로 처리하되, 자연스러운 문장으로 정리했습니다.
- source_word: עַזָּה
  english_pob_choice: Gaza
  chosen_korean: 가사
  alternatives_korean:
  - 가자
  lexicon: 표준 외래어 표기
  rationale: 지명 עַזָּה는 현대 표기 관례상 ‘가사’로 옮겼습니다.
- source_word: אַרְמְנֹתֶיהָ
  english_pob_choice: her citadels
  chosen_korean: 그 요새들
  alternatives_korean:
  - 그 궁전들
  - 그 성채들
  lexicon: HALOT
  rationale: אַרְמוֹן은 궁전과 요새적 성격을 함께 가질 수 있으므로, 심판 문맥에서 방어 시설의 의미를 살리는 ‘요새들’을 택했습니다.
theological_decisions:
- issue: 여성형 소유 접미사의 처리
  chosen_reading: 그 요새들
  alternative_readings:
  - 그의 요새들
  - 그 도시의 요새들
  rationale: 히브리어 여성형 단수 소유 접미사는 가사라는 도시를 의인화한 표현이지만, 한국어에서는 ‘그’로 처리해 어색한 성별 표지를 피하면서도 원문의 지시 대상을 유지했습니다.
  doctrine_reference: 번역 원칙 §4 (문법성-자연스러움 균형)
