    reason: alternative_reading
  revision_rationale: 본문은 מַלְכָּם을 ‘그들의 왕’으로 유지하되, הוּא의 강조를 ‘왕 자신’으로 반영했습니다. בַּגּוֹלָה는 ‘유배’로 옮겨 원문의 추방 의미를 충실히 보존했고, 선언 공식은 ‘야훼께서 말씀하십니다’로 자연화했습니다. 밀곰 대안 독법은 각주에 명확히 유지했습니다.
