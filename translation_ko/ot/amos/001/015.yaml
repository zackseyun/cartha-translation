review_pass:
  verdict: revise
  source_fidelity: ‘포로로 끌려갈 것입니다’는 심판으로 인한 강제 이송을 잘 전달하지만, בַּגּוֹלָה의 기본 뜻은 ‘유배/추방으로’이며 본문의 동사 자체는 ‘가다’입니다. ‘유배될 것입니다’가 원문의 추방·유배 의미를 유지하면서 불필요한 세부를 덧붙이지 않습니다. 독립대명사 הוּא의 강조는 ‘왕 자신’으로 자연스럽게 반영할 수 있습니다.
  naturalness: 대시로 삽입한 ‘그와 그의 관리들이 함께’는 한국어 문장 안에서 다소 끊기고, 뒤의 ‘야훼의 말씀입니다’도 예언자적 선언 공식으로는 덜 직접적입니다. ‘왕 자신과 그의 관리들이 함께’ 및 ‘야훼께서 말씀하십니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘왕’, ‘관리들’, ‘야훼’는 적절합니다. מַלְכָּם을 ‘그들의 왕’으로 본문에 두고 밀곰 독법을 각주에 보존한 것은 원문과 영어 감사 기록에 부합합니다.
  issues:
  - severity: low
    issue: ‘포로로 끌려갈 것입니다’가 원문의 ‘유배로 가다’보다 강제 포획의 방식을 더 구체화합니다.
    rationale: 유배는 정복과 강제 이송을 함의할 수 있으나, 본문은 동사 ‘가다’와 ‘유배’라는 결과를 표현합니다. ‘유배될 것입니다’가 더 절제되고 정확합니다.
  - severity: low
    issue: 대시 삽입 구조와 ‘야훼의 말씀입니다’가 다소 부자연스럽습니다.
    rationale: 히브리어의 강조 대명사와 예언 선언 공식을 한국어 문장 구조와 합쇼체에 맞게 직접 표현하는 편이 자연스럽습니다.
  revised_text: 그들의 왕 자신과 그의 관리들이 함께 유배될 것입니다. 야훼께서 말씀하십니다.
