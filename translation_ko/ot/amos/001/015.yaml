source:
  edition: WLC
  text: וְ/הָלַ֥ךְ מַלְכָּ֖/ם בַּ/גּוֹלָ֑ה ה֧וּא וְ/שָׂרָ֛י/ו יַחְדָּ֖ו אָמַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/015.yaml
  text: And their king shall go into exile[a], he and his officials together, says Yahweh.
  footnotes:
  - marker: a
    text: Or 'Milcom,' the Ammonite god; some understand the line to mean that Ammon's god will go into exile along with his priests or officials.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 왕은 포로로 끌려갈 것입니다[a]—그와 그의 관리들이 함께—야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밀곰’일 수 있습니다. 암몬의 신을 가리키며, 어떤 이들은 이 행이 암몬의 신이 그의 제사장들 또는 관리들과 함께 포로로 끌려간다는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלַךְ
  english_pob_choice: shall go
  chosen_korean: 끌려갈 것입니다
  alternatives_korean:
  - 갈 것입니다
  - 포로로 갈 것입니다
  lexicon: HALOT
  rationale: 예언적 심판 맥락에서 단순한 이동이 아니라 패전 후 강제 이송의 의미가 분명하므로, ‘포로로 끌려가다’로 옮겨 결과를 분명히 했습니다.
- source_word: מַלְכָּם
  english_pob_choice: their king
  chosen_korean: 그들의 왕
  alternatives_korean:
  - 밀곰
  - 그들의 몰렉
  lexicon: HALOT
  rationale: 문맥상 소유격이 붙은 명사구를 자연스럽게 살려 ‘그들의 왕’으로 옮겼습니다. 다만 암몬의 신 밀곰이라는 대안 독법은 본문 각주로 보존합니다.
- source_word: בַּגּוֹלָה
  english_pob_choice: into exile
  chosen_korean: 포로로
  alternatives_korean:
  - 유배로
  - 사로잡혀
  lexicon: HALOT
  rationale: ‘포로로’는 유배/추방의 결과를 한국어로 가장 직접적으로 드러내며, 동사의 강제 수동적 뉘앙스와도 잘 맞습니다.
- source_word: וְשָׂרָיו יַחְדָּו
  english_pob_choice: and his officials together
  chosen_korean: 그와 그의 관리들이 함께
  alternatives_korean:
  - 그와 그의 지도자들이 함께
  - 그와 그의 방백들이 함께
  lexicon: HALOT
  rationale: שָׂרִים는 궁정·통치 맥락에서 ‘관리들’이 현대 한국어로 가장 분명하며, יַחְדָּו의 결속을 ‘함께’로 직접 살렸습니다.
- source_word: אָמַר יְהוָה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀이라
  lexicon: HALOT
  rationale: 예언서의 선언 종결식을 한국어 예언문 관용에 맞되, יהוה를 ‘야훼’로 일관되게 옮기고 본문 마침을 자연스럽게 처리했습니다.
theological_decisions:
- issue: מַלְכָּם의 인물/신격 독법 유지
  chosen_reading: 본문에는 ‘그들의 왕’으로 두되, 암몬의 신 밀곰이라는 대안 독법을 각주로 보존했습니다.
  alternative_readings:
  - 밀곰
  - 몰렉
  rationale: 히브리어 자음과 문맥은 인간 통치자를 잘 지지하지만, 암몬 관련 본문이라는 점에서 신명 독법이 중요한 해석 가능성이므로 지우지 않고 각주로 남겼습니다.
  doctrine_reference: 원문 우선과 해석상 긴장 보존
