source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָה֙ מִ/צִיּ֣וֹן יִשְׁאָ֔ג וּ/מִ/ירוּשָׁלִַ֖ם יִתֵּ֣ן קוֹל֑/וֹ וְ/אָֽבְלוּ֙ נְא֣וֹת הָ/רֹעִ֔ים וְ/יָבֵ֖שׁ רֹ֥אשׁ הַ/כַּרְמֶֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
  footnotes:
  - marker: a
    text: Or 'utters his voice.' The Hebrew idiom is literally 'gives his voice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the meadows of the shepherds mourn.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the head of Carmel,' that is, its summit or topmost height.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. 야훼께서 시온에서 포효하시고, 예루살렘에서 그의 소리를 내십니다[a]. 목자들의 풀밭은 애곡하고[b], 갈멜의 꼭대기는 마릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 소리를 발하십니다.’ 히브리어 관용구는 문자적으로는 ‘그의 소리를 내신다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목자들의 초원이 애곡합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문의 신명사 יְהוָה를 POB 영어본처럼 음역해 하나님의 언약적 이름을 드러냈습니다.
- source_word: יִשְׁאָג
  english_pob_choice: roars
  chosen_korean: 포효하시고
  alternatives_korean:
  - 으르렁거리시고
  - 울부짖으시고
  lexicon: HALOT
  rationale: 사자의 포효를 뜻하는 강한 동사를 한국어에서 가장 생생하게 살리기 위해 ‘포효하다’를 선택했습니다.
- source_word: יִתֵּן קוֹלוֹ
  english_pob_choice: gives his voice
  chosen_korean: 그의 소리를 내십니다
  alternatives_korean:
  - 그의 음성을 내십니다
  - 그의 소리를 보내십니다
  - 그의 소리를 높이십니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, POB가 유지한 ‘gives his voice’의 이미지와 평행성을 한국어로 전달했습니다.
- source_word: נְאוֹת הָרֹעִים
  english_pob_choice: the pastures of the shepherds
  chosen_korean: 목자들의 풀밭
  alternatives_korean:
  - 목자들의 목초지
  - 목자들의 초원
  - 목자들의 들판
  lexicon: HALOT
  rationale: 목자와 연결된 방목지를 자연스러운 한국어로 옮기되, 단순한 ‘마을’이나 ‘거처’로 흐르지 않도록 했습니다.
- source_word: הַכַּרְמֶל
  english_pob_choice: Carmel
  chosen_korean: 갈멜
  alternatives_korean:
  - 갈멜산
  - 카르멜
  lexicon: HALOT
  rationale: 지명 고유명사는 한국어 성경에서 널리 쓰이는 형태를 택했습니다. 본문 맥락상 산 이름을 덧붙이지 않아도 의미가 분명합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 야훼로 옮겨 하나님의 직접적 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB 영어본이 YHWH를 Yahweh로 옮긴 원칙을 따라, 전통적 관용어로 순화하지 않고 원문 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
