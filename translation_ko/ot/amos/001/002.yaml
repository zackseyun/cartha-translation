base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
  footnotes:
  - marker: a
    text: Or 'utters his voice.' The Hebrew idiom is literally 'gives his voice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the meadows of the shepherds mourn.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the head of Carmel,' that is, its summit or topmost height.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. 야훼께서 시온에서 포효하시며 예루살렘에서 자신의 음성을 내시고[a], 목자들의 목초지는 애통하며[b], 갈멜의 꼭대기는 마릅니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 음성을 발하십니다.’ 히브리어 관용구는 문자적으로 ‘그의 음성을 내신다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목자들의 초원이 애통합니다.’
    reason: lexical_alternative
  - marker: c
    text: 히브리어로는 ‘갈멜의 머리’이며, 곧 그 정상 또는 가장 높은 곳을 뜻합니다.
    reason: lexical_alternative
