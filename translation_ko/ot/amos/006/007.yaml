  - 포로로 가게 될 것입니다
  lexicon: HALOT
  rationale: ‘가다’의 단순 이동보다, 강제 이송과 심판의 뉘앙스를 살려 포로로 끌려감을 드러냈습니다.
- source_word: בְּרֹאשׁ גֹּלִים
  english_pob_choice: at the head of the exiles
  chosen_korean: 포로들의 맨 앞에서
  alternatives_korean:
  - 포로들 앞장서서
  - 포로 무리의 선두에서
  lexicon: HALOT
  rationale: 직역적 이미지를 유지하되, 맨 먼저 잡혀가는 역설을 한국어로 분명하게 전달합니다.
- source_word: מִרְזַח סְרוּחִים
  english_pob_choice: the revelry of those who sprawl
  chosen_korean: 방탕한 자들의 흥청거림
  alternatives_korean:
  - 벌렁 누운 자들의 잔치
  - 늘어져 누운 자들의 술판
  lexicon: HALOT
  rationale: 문맥상 사치스러운 연회와 방종한 누움의 이미지를 함께 살리되, 현대 한국어에서 이해 가능한 부정적 표현으로 옮겼습니다.
theological_decisions:
- issue: 심판의 선두 행렬이라는 역설
  chosen_reading: 사회적 우두머리들이 오히려 포로 행렬의 맨 앞에 서는 수치의 심판으로 표현했습니다.
  alternative_readings:
  - 단순히 ‘먼저 잡혀갈 것입니다’로 평탄화
  - ‘가장 먼저 유배될 것입니다’로 완화
  rationale: 본문의 반전 구조는 아모스의 조롱적 심판 선언에서 핵심이므로, ‘맨 앞’의 이미지를 보존해야 합니다.
  doctrine_reference: 예언서의 심판 역전 구조
- issue: 미르자흐와 סְרוּחִים의 경멸적 뉘앙스
  chosen_reading: ‘흥청거림’으로 번역해 단순한 잔치가 아니라 방종과 사치의 의미를 드러냈습니다.
  alternative_readings:
  - ‘잔치’로 중립화
  - ‘연회’로 격상
  rationale: 히브리어 표현은 호화로운 자만의 모임을 비꼬는 성격이 강하므로, 문맥의 비난을 살리는 쪽이 적절합니다.
  doctrine_reference: 예언자적 풍자와 사회적 심판
