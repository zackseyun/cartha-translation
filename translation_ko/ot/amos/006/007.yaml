  text: Therefore now they will go into exile at the head of the exiles[a], and the revelry of those who sprawl will pass away.
  footnotes:
  - marker: a
    text: Or 'the banquet of those stretched out' or 'the carousing of the sprawlers.' The Hebrew expression is compact and likely echoes the lounging on couches in the previous verse.
