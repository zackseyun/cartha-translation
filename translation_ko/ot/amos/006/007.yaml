  yaml_path: translation/ot/amos/006/007.yaml
  text: Therefore now they will go into exile at the head of the exiles[a], and the revelry of those who sprawl will pass away.
  footnotes:
  - marker: a
    text: Or 'the banquet of those stretched out' or 'the carousing of the sprawlers.' The Hebrew expression is compact and likely echoes the lounging on couches in the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 그들은 포로들의 맨 앞에서 포로로 끌려가며, 방탕한 자들의 흥청거림은 사라질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘늘어진 자들의 잔치’ 혹은 ‘늘어져 누운 자들의 흥청거림’입니다. 히브리어 표현은 매우 압축적이며, 바로 앞 절의 침상 위에 기대어 눕는 모습을 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그렇기에
  lexicon: HALOT
  rationale: 앞선 꾸짖음과 이어지는 심판 선언의 논리적 귀결을 한국어로 자연스럽게 드러냅니다.
- source_word: יִגְלוּ
  english_pob_choice: they will go into exile
  chosen_korean: 포로로 끌려가며
  alternatives_korean:
