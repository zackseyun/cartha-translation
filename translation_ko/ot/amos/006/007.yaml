translation:
  language: ko
  text: 그러므로 이제 그들은 유배자들의 맨 앞에서 유배될 것이며, 늘어져 누운 자들의 흥청거림은 사라질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘늘어져 누운 자들의 잔치’ 또는 ‘몸을 길게 뻗고 누운 자들의 흥청거림’입니다. 히브리어 표현은 매우 압축적이며, 바로 앞 절에서 침상 위에 기대어 누운 모습을 되받습니다.
    reason: lexical_alternative
