  source_fidelity: 첫 구절의 ‘포로들의 맨 앞에서 포로로 끌려가며’는 גלה/גֹּלִים의 유배 어근 반복을 어느 정도 반영하지만, ‘포로’는 감금된 사람이라는 뜻으로도 읽혀 유배·강제 이주의 뜻을 다소 흐립니다. 또한 סְרוּחִים은 일반적인 ‘방탕한 자들’이라기보다 앞 절에 이어 몸을 길게 뻗고 누워 있는 자들을 가리킵니다.
