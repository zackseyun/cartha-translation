id: AMO.6.6
reference: Amos 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/שֹּׁתִ֤ים בְּ/מִזְרְקֵי֙ יַ֔יִן וְ/רֵאשִׁ֥ית שְׁמָנִ֖ים יִמְשָׁ֑חוּ וְ/לֹ֥א נֶחְל֖וּ עַל שֵׁ֥בֶר יוֹסֵֽף־
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/006.yaml
  text: who drink wine from bowls and anoint themselves with the finest oils[b][a], but are not grieved over the ruin of Joseph—
  footnotes:
  - marker: a
    text: Or 'the choicest oils'; literally 'the first of oils.'
    reason: lexical_alternative
  - marker: b
    text: '''Joseph'' here refers poetically to the people of Israel, especially the northern kingdom.'
    reason: cultural_note
translation:
  language: ko
  text: 대접에 담긴 포도주를 마시며 가장 좋은 기름[a]을 몸에 바르면서도, 요셉의 파멸을 두고는 슬퍼하지 않습니다[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가장 좋은 기름’은 문자적으로 ‘기름의 첫 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요셉’은 여기서 북이스라엘 백성, 곧 이스라엘을 시적으로 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּמִזְרְקֵי יַיִן
  english_pob_choice: wine from bowls
  chosen_korean: 대접에서 마시며
  alternatives_korean:
  - 그릇에서 마시며
  - 대접의 포도주를 마시며
  lexicon: HALOT
  rationale: מִזְרָק은 제의적·일상적 큰 그릇을 가리킬 수 있어, ‘대접’이 사치스러운 음주 장면을 자연스럽게 살립니다. 한국어에서는 ‘대접에서 마시다’가 영어의 ‘from bowls’와 같은 출발점 이미지를 간결하게 전달합니다.
- source_word: וְרֵאשִׁית שְׁמָנִים
  english_pob_choice: the finest oils
  chosen_korean: 가장 좋은 기름
  alternatives_korean:
  - 최고의 기름
  - 기름의 첫 것
  lexicon: HALOT
  rationale: רֵאשִׁית는 문자적으로 ‘첫/처음/으뜸’이지만, 문맥상 최고급·선별된 기름을 뜻합니다. ‘가장 좋은 기름’은 사치의 뉘앙스를 자연스럽게 옮기면서도 문자적 과잉을 피합니다.
- source_word: יִמְשָׁחוּ
  english_pob_choice: anoint themselves with
  chosen_korean: 몸을 바르지만
  alternatives_korean:
  - 스스로 기름을 바르지만
  - 자신들에게 바르지만
  lexicon: HALOT
  rationale: 이 동사는 여기서 성별(聖別) 의식이 아니라 사치스러운 개인용 도포를 뜻합니다. 한국어 ‘몸을 바르다’가 의례적 ‘기름부음’보다 문맥의 세속적·사치적 의미를 더 직접적으로 드러냅니다.
- source_word: וְלֹא נֶחְלוּ עַל שֵׁבֶר יוֹסֵף
  english_pob_choice: but are not grieved over the ruin of Joseph
  chosen_korean: 요셉의 무너짐 때문에는 아파하지 않습니다
  alternatives_korean:
  - 요셉의 붕괴 때문에는 슬퍼하지 않습니다
  - 요셉의 재앙을 두고는 마음 아파하지 않습니다
  lexicon: HALOT
  rationale: נחלה는 ‘병들다/쇠약해지다’에서 확장되어 애통과 공감의 결여를 나타낼 수 있습니다. ‘아파하지 않습니다’는 원문의 감정적 무감각을 살리되, 단순한 신체 질환으로 오해되지 않게 합니다.
theological_decisions:
- issue: ‘Joseph’의 지시 대상
  chosen_reading: 주본문에서는 ‘요셉’을 그대로 두어, 북이스라엘을 가리키는 시적·비유적 명칭을 유지했습니다.
  alternative_readings:
  - ‘이스라엘’로 풀어 옮김
  - ‘요셉 가문’으로 옮김
  rationale: 본문은 신학 논쟁보다 예언적 수사를 보존하는 것이 중요합니다. 고유명사를 유지하면 원문의 상징성과 역사적 울림을 살릴 수 있고, 지시 대상은 주해적 각주로 충분히 설명할 수 있습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 은유적 고유명사 보존'
