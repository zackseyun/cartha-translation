language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִבְר֤וּ כַֽלְנֵה֙ וּ/רְא֔וּ וּ/לְכ֥וּ מִ/שָּׁ֖ם חֲמַ֣ת רַבָּ֑ה וּ/רְד֣וּ גַת פְּלִשְׁתּ֗ים הֲ/טוֹבִים֙ מִן הַ/מַּמְלָכ֣וֹת הָ/אֵ֔לֶּה אִם רַ֥ב גְּבוּלָ֖/ם מִ/גְּבֻלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/002.yaml
  text: Cross over to Calneh and see[a]; and from there go to Hamath the great; then go down to Gath of the Philistines[b]. Are they better than these kingdoms? Or is their territory greater than your territory?
  footnotes:
  - marker: a
    text: Or, 'Are you better than these kingdoms?' The Hebrew adjective 'better' has no explicit subject, so the comparison may be understood either of the named cities/kingdoms or of the people being addressed.
    reason: alternative_reading
  - marker: b
    text: Calneh is a place name; some identify it with a city in northern Syria or Mesopotamia, but the identification is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 칼네로 건너가 보십시오[a] — 거기에서부터 위대한 하맛으로 가고, 이어서 블레셋의 가드로 내려가 보십시오[b]. 그들이 이 나라들보다 더 나은가요? 아니면 그들의 영토가 여러분의 영토보다 더 넓습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 나라들보다 여러분이 더 나은가요?’ 히브리어의 ‘더 낫다’에 주어가 명시되지 않아, 비교 대상은 앞의 도시/나라들이 될 수도 있고 청중 자신들이 될 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 칼네는 지명입니다. 북부 시리아나 메소포타미아의 도시로 보기도 하나, 정확한 동일시는 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ ... וּרְאוּ
  english_pob_choice: Cross over ... and see
  chosen_korean: 건너가 보십시오
  alternatives_korean:
  - 지나가 보십시오
  - 건너십시오
  lexicon: HALOT
  rationale: עבר의 이동 명령과 ראה의 관찰 명령을 하나의 자연스러운 한국어 명령으로 압축하되, ‘건너가’로 방향성과 이동 이미지를 살렸습니다.
- source_word: כַּלְנֵה
  english_pob_choice: Calneh
  chosen_korean: 칼네
  alternatives_korean:
  - 갈네
  - 칼네하
  lexicon: HALOT
  rationale: 지명은 음역하되 현대 한국어 외래어 표기 관행에 맞추어 칼네로 옮겼습니다.
- source_word: חֲמַת רַבָּה
  english_pob_choice: Hamath the great
  chosen_korean: 위대한 하맛
  alternatives_korean:
  - 큰 하맛
  - 하맛 대
  lexicon: HALOT
  rationale: רַבָּה의 ‘큰/위대한’ 의미를 살리면서 지명 수식 구조를 한국어에서 자연스럽게 재배열했습니다.
- source_word: גַּת פְּלִשְׁתִּים
  english_pob_choice: Gath of the Philistines
  chosen_korean: 블레셋의 가드
  alternatives_korean:
  - 블레셋인들의 가드
  - 블레셋 땅의 가드
  lexicon: HALOT
  rationale: 구문상 소속 관계를 분명히 하되, ‘가드’라는 지명과 블레셋 민족 표지를 함께 보존했습니다.
- source_word: גְּבוּל / מִגְּבֻלְכֶם
  english_pob_choice: territory
  chosen_korean: 영토
  alternatives_korean:
  - 경계
  - 변경
  lexicon: HALOT
  rationale: 비교문의 문맥에서는 경계선보다 정치적·지리적 범위를 가리키므로 ‘영토’가 가장 직접적입니다.
theological_decisions:
- issue: 암시된 비교 대상의 처리
  chosen_reading: ‘그들이 이 나라들보다 더 나은가요?’로 옮겨, 직전의 도시들을 1차 비교 대상으로 드러냈습니다.
  alternative_readings:
  - ‘여러분이 이 나라들보다 더 나은가요?’
  - ‘그들이 이 나라들보다 더 낫습니까?’
  rationale: 히브리어의 형용사는 주어를 명시하지 않으므로 문맥상 가장 가까운 선행 대상인 도시/나라들을 기본 비교 대상으로 삼았습니다. 다만 인칭 주어로도 읽힐 수 있어 주석 가능성을 보존했습니다.
  doctrine_reference: 문맥상 수사 질문의 대상이 암시적일 때는, 본문이 허용하는 범위 내에서 가장 가까운 선행사를 우선 반영합니다.
