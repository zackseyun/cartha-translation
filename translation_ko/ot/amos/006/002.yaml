  source_fidelity: 첫 두 명령을 ‘건너가 보십시오’로 합친 것은 히브리어의 연속된 명령(‘건너가라, 보라’)을 다소 약화시키며, ‘가고’는 독립 명령인 ‘가라’를 연결 서술로 바꿉니다. 또한 ‘그들이 이 나라들보다’는 히브리어에 주어가 명시되지 않은 점을 불필요하게 특정하고, 지시 대상도 한국어에서 다소 불명료합니다. 주어를 생략하여 원문의 논쟁적인 모호성을 보존하는 것이 안전합니다.
  naturalness: ‘그곳에서’가 ‘거기에서부터’보다 현대 표준어 문맥에서 자연스럽습니다. 지명 수식으로서 ‘큰 하맛’은 ‘위대한 하맛’보다 자연스럽고 רַבָּה의 지리적·규모상 뜻을 과장 없이 전달합니다. 각 동사를 합쇼체 독립 명령으로 유지했습니다.
  terminology: 칼네, 하맛, 블레셋, 가드, 영토는 적절합니다. חֲמַת רַבָּה는 존엄성보다는 규모·중요성을 나타내므로 ‘큰 하맛’으로 조정합니다. 비교문의 주어는 본문에서 생략하고 각주로 두 가능한 이해를 밝혔습니다.
