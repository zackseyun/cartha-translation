id: AMO.6.12
reference: Amos 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/יְרֻצ֤וּ/ן בַּ/סֶּ֨לַע֙ סוּסִ֔ים אִֽם יַחֲר֖וֹשׁ בַּ/בְּקָרִ֑ים כִּֽי הֲפַכְתֶּ֤ם לְ/רֹאשׁ֙ מִשְׁפָּ֔ט וּ/פְרִ֥י צְדָקָ֖ה לְ/לַעֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/012.yaml
  text: Do horses run on rock? Does one plow there with oxen? Yet you have turned justice into poison[c][b][a], and the fruit of righteousness into wormwood.
  footnotes:
  - marker: a
    text: Or 'into gall' for 'into poison'; Hebrew רֹאשׁ can denote a bitter or poisonous substance/plant.
    reason: lexical_alternative
  - marker: b
    text: '''Wormwood'' is a bitter plant used metaphorically for moral corruption and bitter consequence.'
    reason: cultural_note
  - marker: c
    text: Or 'and the fruit of justice' for 'the fruit of righteousness'; Hebrew צְדָקָה can carry both moral and judicial nuance depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 말들이 바위 위를 달립니까? 사람이 거기서 소로 밭을 갈겠습니까? 그런데도 여러분은 정의를 독초로, 의의 열매를 쑥으로 바꾸었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘독초’로 옮긴 히브리어 רֹאשׁ은 독성 있는 쓴 식물 또는 독성 물질을 가리킬 수 있습니다. ‘쓸개즙’ 또는 ‘독’으로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쑥’(히브리어 לענה)은 쓴 식물로, 예언서에서는 쓰라린 타락이나 결과를 비유하는 데 사용됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַיְרֻצוּן ... סוּסִים
  english_pob_choice: Do horses run
  chosen_korean: 말이 바위 위를 달립니까?
  alternatives_korean:
  - 말들이 바위 위를 달릴 수 있습니까?
  - 말들이 바위 위를 달립니까?
  lexicon: HALOT
  rationale: 수사적 불가능을 묻는 문장으로, 한국어에서는 가능성 질문형보다 ‘달립니까?’가 더 자연스럽고 압축적으로 원문의 어이없음을 살립니다.
- source_word: אִם יַחֲרֹשׁ בַּבְּקָרִים
  english_pob_choice: Does one plow there with oxen
  chosen_korean: 소들이 거기서 밭을 갈 수 있습니까?
  alternatives_korean:
  - 거기서 소로 밭을 갑니까?
  - 거기서 소로 쟁기질합니까?
  lexicon: HALOT
  rationale: אִם의 병렬 수사 의문을 한국어에서는 두 번째 질문도 같은 의문형으로 맞추되, ‘거기서’로 암시된 장소성을 드러냈습니다.
- source_word: לְרֹאשׁ
  english_pob_choice: into poison
  chosen_korean: 독초로
  alternatives_korean:
  - 쓸개로
  - 독으로
  lexicon: HALOT
  rationale: רֹאשׁ은 독성/쓴 식물을 가리킬 수 있어, POB의 ‘poison’ 취지를 살리면서도 한국어 독자가 이미지로 즉시 이해할 수 있는 ‘독초’로 옮겼습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 재판
  lexicon: HALOT
  rationale: 예언서의 사회·공적 법정적 맥락에서는 ‘정의’가 מִשְׁפָּט의 공적 의미를 가장 자연스럽게 전달합니다.
- source_word: צְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: HALOT
  rationale: 미문적 대비에서 צדקה는 단순한 도덕성보다 하나님 앞과 공동체 앞의 ‘의’로 간결하게 대응시키는 것이 적절합니다.
- source_word: לְלַעֲנָה
  english_pob_choice: wormwood
  chosen_korean: 쑥으로
  alternatives_korean:
  - 쓴쑥으로
  - 웜우드로
  lexicon: HALOT
  rationale: לענה는 쓴 식물 ‘wormwood’이지만 한국어 성경 전통과 자연스러운 비유 전달을 위해 ‘쑥’으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 두 개의 질문은 실제 정보 요청이 아니라, 이스라엘의 행위가 본질적으로 어긋났음을 고발하는 예언자적 수사로 보았습니다.
  alternative_readings:
  - 단순한 비유적 설명으로 약화해 읽기
  - 미래형 가능성 문장으로 읽기
  rationale: 원문의 שאלה형은 불가능성과 부조리를 드러내는 책망의 장치이므로, 한국어에서도 의문형을 유지해 예언적 긴장을 살렸습니다.
  doctrine_reference: 예언문학의 수사적 심판 선언
