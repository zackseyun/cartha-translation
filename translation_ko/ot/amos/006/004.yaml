  - 상아로 장식한 침상
  lexicon: HALOT
  rationale: 직역하되, 이 표현이 사치스러운 침상을 가리키는 점을 드러내기 위해 '상아로 된 침상'으로 옮겼습니다.
- source_word: וּסְרֻחִים עַל עַרְשׂוֹתָם
  english_pob_choice: and sprawl on their couches
  chosen_korean: 자기 의자에서 몸을 뻗고 있으며
  alternatives_korean:
  - 자기 침상에서 몸을 뻗고 있으며
  - 자기 소파에서 늘어져 있으며
  lexicon: HALOT
  rationale: עַרְשׂוֹתָם의 휴식용 가구 이미지를 한국어로 자연스럽게 살리면서, 무절제하게 길게 뻗는 뉘앙스를 '몸을 뻗고'로 반영했습니다.
- source_word: וְאֹכְלִים כָּרִים מִצֹּאן
  english_pob_choice: and eat lambs from the flock
  chosen_korean: 무리에서 어린 양을
  alternatives_korean:
  - 떼에서 어린 양을
  - 양 떼에서 어린 양을
  lexicon: HALOT
  rationale: כָּרִים은 어린 양으로 옮기고, מִצֹּאן은 선택하여 잡아먹는 장면을 살려 '무리에서'로 처리했습니다.
- source_word: וַעֲגָלִים מִתּוֹךְ מַרְבֵּק
  english_pob_choice: and calves from the stall
  chosen_korean: 우리에서 송아지를 먹는 사람들입니다
  alternatives_korean:
  - 비육 우리에서 송아지를 먹는 사람들입니다
  - 우리 안의 송아지를 먹는 사람들입니다
  lexicon: HALOT
  rationale: מַרְבֵּק의 '기르는/살찌우는 우리' 뉘앙스를 기본 뜻인 '우리'로 번역해 간결하게 살렸고, 본문 문맥상 먹는 행위는 앞 동사와 연결된 것으로 이해했습니다.
theological_decisions:
