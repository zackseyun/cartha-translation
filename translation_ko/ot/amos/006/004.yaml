source:
  edition: WLC
  text: הַ/שֹּֽׁכְבִים֙ עַל מִטּ֣וֹת שֵׁ֔ן וּ/סְרֻחִ֖ים עַל עַרְשׂוֹתָ֑/ם וְ/אֹכְלִ֤ים כָּרִים֙ מִ/צֹּ֔אן וַ/עֲגָלִ֖ים מִ/תּ֥וֹךְ מַרְבֵּֽק־־׃
base_translation:
  language: en
