  text: those who lie on beds of ivory and sprawl on their couches[b][a], and eat lambs from the flock and calves from the stall—
  footnotes:
  - marker: a
    text: Or 'stretch themselves out' or 'sprawl' on their couches.
    reason: lexical_alternative
  - marker: b
    text: '''From the stall'' may also be rendered ''from the fattening stall,'' emphasizing specially fed animals reserved for luxury eating.'
    reason: lexical_alternative
translation:
  language: ko
  text: 상아로 된 침상에 누워 있고 자기 의자에서 몸을 뻗고 있으며, 무리에서 어린 양을, 우리에서 송아지를 먹는 사람들입니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몸을 뻗고’는 ‘자기 의자에서 길게 뻗다/늘어지다’의 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리’는 가축을 기르는 곳을 가리키며, 문맥상 살찌운 짐승을 포함한 사치스러운 식사를 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁכְבִים
  english_pob_choice: those who lie
  chosen_korean: 누워 있고
  alternatives_korean:
  - 누워 있는
  - 눕는
  lexicon: HALOT
  rationale: 상태를 이어 가는 분사적 묘사로 처리해, 사치 속에 머무는 모습을 자연스러운 현대 한국어로 살렸습니다.
- source_word: מִטּוֹת שֵׁן
  english_pob_choice: beds of ivory
  chosen_korean: 상아로 된 침상
  alternatives_korean:
