    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְנַדִּים
  english_pob_choice: you who put far away
  chosen_korean: 멀리하는 자들
  alternatives_korean:
  - 멀리 두는 자들
  - 물리치는 자들
  - 미루는 자들
  lexicon: HALOT
  rationale: 대상에게 직접 호소하는 분사적 표현을 살려, 단순히 ‘무시하는’ 것이 아니라 어떤 것을 의도적으로 멀리 두는 행위를 드러냈습니다.
- source_word: לְיוֹם רָע
  english_pob_choice: the evil day
  chosen_korean: 재앙의 날
  alternatives_korean:
  - 악한 날
  - 악의 날
  - 재난의 날
  lexicon: HALOT
  rationale: 직역상 ‘악한 날’도 가능하지만, 예언 문맥에서의 임박한 심판·재난의 함의를 한국어에서 더 자연스럽게 드러내기 위해 ‘재앙의 날’로 옮겼습니다.
- source_word: שֶׁבֶת חָמָס
  english_pob_choice: the seat of violence
  chosen_korean: 폭력의 자리
  alternatives_korean:
  - 폭력의 보좌
  - 폭력의 왕좌
  - 폭력의 통치
  lexicon: HALOT
  rationale: שֶׁבֶת은 추상적 ‘앉음’보다 자리/좌소의 의미를 살릴 수 있어 ‘자리’로 옮겼고, חָמָס는 사회적 폭력성을 직접 드러내는 ‘폭력’이 가장 적절합니다.
theological_decisions:
- issue: 문장의 이중 방향성(재앙을 멀리함 vs 폭력을 가까이함)
  chosen_reading: 본문의 날카로운 역설을 살려, 멸망의 날을 멀리한다고 여기면서 실제로는 폭력의 자리를 가까이하는 행위를 함께 드러냈습니다.
  alternative_readings:
  - 재앙의 날을 미루는 것으로만 읽기
  - 사회적 폭력을 제도화하는 것으로만 읽기
  rationale: 히브리어는 압축적이라 심판의 날과 폭력의 자리가 어떻게 연결되는지를 완전히 단정하지 않습니다. 번역은 그 긴장을 풀지 않고 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
