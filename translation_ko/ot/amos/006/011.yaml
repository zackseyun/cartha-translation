translation:
  language: ko
  text: 보십시오[a], 야훼께서 명령하십니다. 그분께서 큰 집을 산산조각 내시고 작은 집에는 금이 가게 하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, ‘그가 큰 집을 파편들로 치고 작은 집을 갈라진 틈들로 치리라.’ ‘갈라진 틈들’은 ‘조각들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  english_pob_choice: For behold
  chosen_korean: 이는 보십시오
  alternatives_korean:
  - 보십시오
  - 보라
  - 이는
  lexicon: HALOT
  rationale: 예언적 주의를 환기하는 כִּי הִנֵּה의 급박한 도입 기능을 살리되, 한국어에서는 간결하게 ‘이는 보십시오’로 옮겨 흐름과 경고성을 함께 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 신명기적 고유명사로서 ‘야훼’를 사용해 언약적 이름을 직접 드러냈습니다.
- source_word: מְצַוֶּה
  english_pob_choice: commands
  chosen_korean: 명령하십니다
  alternatives_korean:
  - 명령하고 계십니다
  - 분부하십니다
  - 명하십니다
  lexicon: HALOT
  rationale: 분사형의 권위적이고 현재적인 명령 행위를 자연스러운 합쇼체로 옮겼습니다.
- source_word: רְסִיסִים / בְּקִעִים
  english_pob_choice: fragments / pieces
  chosen_korean: 조각으로 / 금으로
  alternatives_korean:
  - 산산조각으로 / 틈으로
  - 부스러기로 / 쪼개진 틈으로
  lexicon: HALOT
  rationale: 두 명사 모두 파괴된 결과를 가리키므로, 큰 집은 ‘조각으로’, 작은 집은 더 가는 파손을 가리키는 ‘금’으로 대응시켜 병행성과 폭력성을 살렸습니다.
theological_decisions:
- issue: וְהִכָּה의 행위자와 수동성
  chosen_reading: 한국어에서는 ‘맞으리라’로 옮겨, 여호와의 명령 아래 집들이 타격을 받는 결과를 전면에 드러냈습니다.
  alternative_readings:
  - 여호와께서 큰 집을 치시고…
  - 큰 집이 치심을 받으리라
  rationale: 히브리어는 명령 뒤에 행위 주체를 문맥적으로 두면서 심판 결과를 강조합니다. 한국어에서는 수동적 결과를 드러내되, 문맥상 심판의 주권은 여호와께 있음을 유지했습니다.
  doctrine_reference: Amos 6:11 judgment oracle; divine sovereignty in prophetic judgment
