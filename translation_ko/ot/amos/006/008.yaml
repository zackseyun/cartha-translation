id: AMO.6.8
reference: Amos 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁבַּע֩ אֲדֹנָ֨/י יְהוִ֜ה בְּ/נַפְשׁ֗/וֹ נְאֻם יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת מְתָאֵ֤ב אָֽנֹכִי֙ אֶת גְּא֣וֹן יַֽעֲקֹ֔ב וְ/אַרְמְנֹתָ֖י/ו שָׂנֵ֑אתִי וְ/הִסְגַּרְתִּ֖י עִ֥יר וּ/מְלֹאָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/008.yaml
  text: 'The Lord GOD has sworn by himself—oracle of Yahweh[a], the God of Armies: I abhor the pride of Jacob, and I hate his citadels[c][b]; and I will hand over the city and all that fills it.'
  footnotes:
  - marker: a
    text: Or 'the majesty of Jacob.' The Hebrew word can denote either exalted majesty or arrogant pride; here the judgment context favors the negative sense.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the God of hosts.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'his palaces.' The Hebrew term can refer to palatial strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 여호와께서 자기 자신으로 맹세하셨습니다 — 만군의 하나님 야훼의 말씀입니다 — 나는 야곱의 교만을 미워하고 그의 견고한 궁전들을 싫어하니, 내가 그 성읍과 그 안에 가득한 모든 것을 넘겨주겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야곱의 위엄'. 히브리어는 높아진 위엄과 교만을 모두 가리킬 수 있으나, 여기서는 심판 문맥이 부정적 의미를 더 강하게 지지합니다.
    reason: lexical_alternative
  - marker: b
    text: '전통적 번역: ''만군의 하나님''.'
    reason: lexical_alternative
  - marker: c
    text: 또는 '그의 궁전들'. 히브리어는 궁전과 성채의 의미를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: The Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: 아도나이와 YHWH의 결합을 한국어에서 가장 자연스럽게 살리기 위해 '주 여호와'로 옮기고, 뒤의 '만군의 하나님 야훼'로 이름과 칭호를 분리해 보여 주었습니다.
- source_word: נִשְׁבַּע ... בְּנַפְשׁוֹ
  english_pob_choice: has sworn by himself
  chosen_korean: 자기 자신으로 맹세하셨습니다
  alternatives_korean:
  - 자기 생명으로 맹세하셨습니다
  - 자신에게 맹세하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 무리 없이 전달하기 위해 '자기 자신으로'를 택해, 하나님의 자기 맹세라는 힘을 보존했습니다.
- source_word: מְתָאֵב
  english_pob_choice: I abhor
  chosen_korean: 미워하고
  alternatives_korean:
  - 혐오하고
  - 가증히 여기고
  lexicon: HALOT
  rationale: 하나님의 강한 거절을 나타내되 한국어 합쇼체 본문에서 지나치게 거칠거나 생경하지 않도록 '미워하다'를 선택했습니다.
- source_word: גְּאוֹן יַעֲקֹב
  english_pob_choice: the pride of Jacob
  chosen_korean: 야곱의 교만
  alternatives_korean:
  - 야곱의 위엄
  - 야곱의 자랑
  lexicon: HALOT
  rationale: 심판 문맥상 이 표현은 긍정적 '위엄'보다 부정적 '교만'이 더 적합하며, POB의 해석 선택을 한국어로 반영했습니다.
- source_word: אַרְמְנֹתָיו
  english_pob_choice: his citadels
  chosen_korean: 그의 견고한 궁전들
  alternatives_korean:
  - 그의 궁전들
  - 그의 요새들
  - 그의 성채들
  lexicon: HALOT
  rationale: 아르모노트는 궁전의 뜻과 함께 방어적 강고함을 담을 수 있어, POB의 'citadels'를 살려 '견고한 궁전들'로 옮겼습니다.
- source_word: וְהִסְגַּרְתִּי
  english_pob_choice: and I will hand over
  chosen_korean: 내가 ... 넘겨주겠습니다
  alternatives_korean:
  - 내가 ... 내주겠습니다
  - 내가 ... 넘기겠습니다
  lexicon: HALOT
  rationale: 심판 맥락의 히필 사구를 '넘겨주다'로 옮겨, 도시가 타자의 손에 넘어가는 함의를 자연스럽게 전달했습니다.
theological_decisions:
- issue: יהוה의 번역과 본문 내 호칭 처리
  chosen_reading: 본문에는 '여호와'를 기본 호칭으로 두고, 동격 설명으로 '만군의 하나님 야훼'를 덧붙였습니다.
  alternative_readings:
  - '''야훼''를 본문 전체에 일관되게 사용'
  - '''주''와 ''여호와''를 더 분리하여 번역'
  rationale: POB의 원문 감사 흔적을 존중하면서도 한국어 독자에게는 전통적 호칭 '여호와'가 즉시 의미를 전달하므로, 이름 '야훼'는 문맥상 설명되는 위치에 배치했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 가차 없는 심판 어조의 유지
  chosen_reading: '''미워하고'', ''싫어하니'', ''넘겨주겠습니다''로 심판 선언의 강도를 유지했습니다.'
  alternative_readings:
  - 완화된 표현으로 바꾸기
  - '''버리다/포기하다''로 더 해석적으로 옮기기'
  rationale: 원문은 자기 맹세와 함께 강한 혐오와 넘겨줌의 선언을 병치하므로, 한국어에서도 그 긴장과 단호함을 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
