  - severity: low
    issue: ‘견고한 궁전들’의 추가 수식
    rationale: אַרְמְנוֹת는 ‘궁전들’을 기본 뜻으로 하며 성채·요새의 뉘앙스가 가능하지만, ‘견고한’을 본문에 더하면 원문에 없는 명시적 성질을 추가합니다. 대안은 각주로 처리하는 것이 안전합니다.
