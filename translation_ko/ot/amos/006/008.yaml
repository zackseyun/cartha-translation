revisions:
- from: 주 여호와께서 자기 자신으로 맹세하셨습니다 — 만군의 하나님 야훼의 말씀입니다 — 나는 야곱의 교만을 미워하고 그의 견고한 궁전들을 싫어하니, 내가 그 성읍과 그 안에 가득한 모든 것을 넘겨주겠습니다.[a][b][c]
  to: 주 야훼께서 자신을 두고 맹세하셨습니다. 만군의 하나님이신 야훼의 말씀입니다. “나는 야곱의 교만을 몹시 싫어하며, 그의 궁전들을 미워합니다. 내가 그 성읍과 그 안에 가득한 모든 것을 넘겨주겠습니다.”[a][b][c]
  rationale: 신명을 ‘야훼’로 일관되게 하여 원문의 두 차례의 יהוה와 POB 방침을 반영했습니다. 자기 맹세의 히브리어 관용구는 자연스러운 한국어인 ‘자신을 두고’로 옮겼습니다. 원문에 없는 ‘견고한’을 본문에서 빼고 기본 뜻인 ‘궁전들’을 채택하되, 성채의 가능성은 해당 각주로 보존했습니다. 예언 선언의 직접성과 현대 합쇼체를 유지하기 위해 인용문 안에서 ‘미워합니다/넘겨주겠습니다’를 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:48Z'
review_pass:
  verdict: revise
  source_fidelity: 주요 의미는 대체로 충실하지만, YHWH를 본문 안에서 ‘여호와’와 ‘야훼’로 혼용한 것은 같은 신명을 달리 옮긴 것이며, ‘자기 자신으로 맹세하다’는 히브리어 관용구의 자연스러운 한국어 표현이 아닙니다. אַרְמְנֹתָיו는 기본적으로 ‘궁전들’이며, ‘견고한’은 원문에 명시되지 않은 수식입니다.
  naturalness: 합쇼체의 전반적 어조는 유지되었으나, ‘자기 자신으로 맹세하셨습니다’와 ‘만군의 하나님 야훼’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘자신을 두고 맹세하셨습니다’ 및 ‘만군의 하나님이신 야훼’가 자연스럽습니다.
  terminology: POB 방침과 감사 흔적에 따라 יהוה는 ‘야훼’로 일관되게 옮겼습니다. ‘만군의 하나님’은 צְבָאוֹת의 군사적 이미지를 보존합니다. ‘궁전들’은 원문의 기본 뜻을 본문에 두고, ‘성채들’은 각주 대안으로 보존했습니다.
  issues:
  - severity: medium
    issue: 신명 혼용
    rationale: 같은 절의 יהוה를 ‘여호와’와 ‘야훼’로 달리 번역하면 독자가 서로 다른 호칭 또는 대상을 뜻하는 것으로 이해할 수 있습니다. POB의 명시된 신명 방침에도 맞지 않습니다.
  - severity: medium
    issue: ‘자기 자신으로 맹세하셨습니다’의 비자연스러운 관용구 번역
