base_translation:
  language: en
  yaml_path: translation/ot/amos/006/013.yaml
  text: you who rejoice over nothing[a], who say[b], “Have we not by our own strength taken horns for ourselves?”
  footnotes:
  - marker: a
    text: Hebrew 'over nothing' may also echo the place-name Lo-debar, creating a wordplay on rejoicing over a captured town whose name sounds like 'nothing' or 'no thing.'
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'Have we not by our own strength taken Karnaim for ourselves?' The Hebrew word rendered 'horns' can also evoke Karnaim, likely as a wordplay on military power and conquest.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 아무것도 아닌 것을 두고 기뻐하며, 이렇게 말합니다. “우리가 우리 힘으로 뿔들을 취하지 않았습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아무것도 아닌 것’을 뜻할 수 있으며, 지명 로-데바르를 가리키는 말놀이일 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔들’로 옮긴 히브리어는 지명 카르나임을 가리키는 말놀이일 수도 있어, 군사적 힘과 정복을 비꼬는 뉘앙스를 더합니다.
    reason: lexical_alternative
