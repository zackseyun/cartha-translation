  rationale: 선지자의 조롱 섞인 자만을 드러내는 수사 의문문을 유지하는 것이 본문의 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 예언서의 교만 비판과 인간의 자기확신에 대한 하나님의 심판
