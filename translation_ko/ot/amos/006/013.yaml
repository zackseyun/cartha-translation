translation:
  language: ko
  text: 너희는 아무것도 아닌 것을 두고 기뻐하고, 이렇게 말합니다. “우리가 우리 힘으로 뿔을 차지하지 않았습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아무것도 아닌 것’은 지명 로-데바르를 가리키는 말놀이일 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔’로 옮긴 히브리어는 지명 카르나임을 가리키는 말놀이일 수도 있습니다. 이는 군사적 힘과 정복에 관련된 표현일 수 있습니다.
    reason: lexical_alternative
