id: AMO.6.1
reference: Amos 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֚וֹי הַ/שַּׁאֲנַנִּ֣ים בְּ/צִיּ֔וֹן וְ/הַ/בֹּטְחִ֖ים בְּ/הַ֣ר שֹׁמְר֑וֹן נְקֻבֵי֙ רֵאשִׁ֣ית הַ/גּוֹיִ֔ם וּ/בָ֥אוּ לָ/הֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
  footnotes:
  - marker: a
    text: Or 'those designated' or 'those named,' referring to prominent or notable people.
    reason: lexical_alternative
  - marker: b
    text: Or 'the first of the nations' or 'the chief of the nations.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew clause is compressed: literally, ''and the house of Israel comes to them.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 시온에서 안일하게 지내는 자들과 사마리아 산에서 안전하다고 여기는 자들, 곧 민족들 가운데 으뜸으로 이름난 자들에게 화가 있습니다[a][b]. 이스라엘의 집이 그들에게로 옵니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지명된 자들’, ‘지목된 자들’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들 가운데 첫째 가는 자들’, ‘민족들의 우두머리’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 압축되어 있으며, 문자적으로는 ‘이스라엘의 집이 그들에게 온다’입니다.
    reason: source_note
