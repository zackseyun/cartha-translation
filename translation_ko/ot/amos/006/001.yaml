    reason: lexical_alternative
  - marker: c
    text: 히브리어는 압축되어 있으며, 문자적으로는 ‘이스라엘의 집이 그들에게 온다’입니다.
    reason: source_note
  revision_rationale: 한 번의 ‘화가 있습니다’로 히브리어 הוֹי의 책망을 자연스러운 현대 합쇼체 문장으로 옮겼습니다. ‘이름난 자들’은 본문의 사회적 두드러짐을 반영하되, ‘지명된/지목된’이라는 어휘적 가능성은 각주에 보존했습니다. 마지막 절은 히브리어의 압축된 독립절을 한국어에서 명료하게 유지했습니다.
