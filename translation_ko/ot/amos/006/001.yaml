revisions:
- from: 「화 있을진저」 시온에서 안일한 자들과 사마리아 산에서 안전하다고 여기는 자들아, 민족들 가운데 으뜸인 자들[a][b], 곧 이스라엘의 집이 그들에게로 오는 자들[c]에게 화가 있습니다.
  to: 시온에서 안일하게 지내는 자들과 사마리아 산에서 안전하다고 여기는 자들, 곧 민족들 가운데 으뜸으로 이름난 자들에게 화가 있습니다[a][b]. 이스라엘의 집이 그들에게로 옵니다[c].
  rationale: 한 번의 ‘화가 있습니다’로 히브리어 הוֹי의 책망을 자연스러운 현대 합쇼체 문장으로 옮겼습니다. ‘이름난 자들’은 본문의 사회적 두드러짐을 반영하되, ‘지명된/지목된’이라는 어휘적 가능성은 각주에 보존했습니다. 마지막 절은 히브리어의 압축된 독립절을 한국어에서 명료하게 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two parallel groups in Zion and Samaria and the compressed final clause. However, the construction places the woe declaration after a long vocative-like phrase and repeats its force, making the syntax less faithful to the Hebrew denunciation. The expression for נְקֻבֵי רֵאשִׁית הַגּוֹיִם should retain the idea of persons distinguished/designated as foremost among the nations without implying that they themselves are simply ‘the foremost people.’
  naturalness: ‘「화 있을진저」’ is archaic and, together with the final ‘화가 있습니다,’ is redundant and awkward in modern formal Korean. A single initial ‘화가 있습니다’ followed by the coordinated objects is clear, natural, and appropriately solemn. ‘안일하게 지내는’ and ‘안전하다고 여기는’ are natural modern expressions.
  terminology: ‘시온,’ ‘사마리아,’ and ‘이스라엘의 집’ are retained. ‘민족들 가운데 으뜸으로 이름난 자들’ communicates social prominence while the lexical alternatives ‘지명된/지목된’ remain in a footnote. No doctrinal interpretation is added.
  issues:
  - severity: medium
    issue: The denunciation is expressed twice and the sentence is syntactically strained.
    rationale: The opening quoted ‘화 있을진저’ is followed by a vocative-like list and then another predicate, ‘화가 있습니다.’ Hebrew has one הוֹי governing the entire group; Korean should express this once in a coherent sentence.
  - severity: medium
    issue: ‘민족들 가운데 으뜸인 자들’ can obscure the force of נְקֻבֵי.
    rationale: נְקֻבֵי denotes those named/designated, in context notable persons. ‘으뜸으로 이름난 자들’ better carries both prominence and the naming/designation nuance, while preserving lexical uncertainty in the note.
  revised_text: 시온에서 안일하게 지내는 자들과 사마리아 산에서 안전하다고 여기는 자들, 곧 민족들 가운데 으뜸으로 이름난 자들에게 화가 있습니다[a][b]. 이스라엘의 집이 그들에게로 옵니다[c].
  revised_footnotes:
