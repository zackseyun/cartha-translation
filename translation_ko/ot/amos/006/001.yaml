  lexicon: HALOT
  rationale: 히브리어의 압축된 관계절을 한국어 문장으로 풀어, ‘이스라엘의 집이 그들에게로 온다’는 의존 관계를 분명히 했습니다.
theological_decisions:
- issue: 시온과 사마리아의 병렬 대상
  chosen_reading: 예언은 시온과 사마리아를 함께 지목하여, 남북 왕국의 권력 중심에 있는 안일한 지도층을 동시에 책망합니다.
  alternative_readings:
  - 시온은 수사적 표현일 뿐 실제 주 대상은 북왕국 지도층이다
  - 본문을 한쪽 왕국에만 한정해야 한다
  rationale: 히브리어의 병렬 구조를 그대로 살려 두 지명을 모두 보존하는 것이 본문이 의도한 폭넓은 심판 대상을 가장 잘 드러냅니다.
  doctrine_reference: 예언서의 공적 심판 선언과 언약 백성 전체에 대한 책망
