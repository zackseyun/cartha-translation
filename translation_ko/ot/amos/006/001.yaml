id: AMO.6.1
reference: Amos 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֚וֹי הַ/שַּׁאֲנַנִּ֣ים בְּ/צִיּ֔וֹן וְ/הַ/בֹּטְחִ֖ים בְּ/הַ֣ר שֹׁמְר֑וֹן נְקֻבֵי֙ רֵאשִׁ֣ית הַ/גּוֹיִ֔ם וּ/בָ֥אוּ לָ/הֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
  footnotes:
  - marker: a
    text: Or 'those designated' or 'those named,' referring to prominent or notable people.
    reason: lexical_alternative
  - marker: b
    text: Or 'the first of the nations' or 'the chief of the nations.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew clause is compressed: literally, ''and the house of Israel comes to them.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 「화 있을진저」 시온에서 안일한 자들과 사마리아 산에서 안전하다고 여기는 자들아, 민족들 가운데 으뜸인 자들[a][b], 곧 이스라엘의 집이 그들에게로 오는 자들[c]에게 화가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지명된 자들’, ‘지목된 자들’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들 가운데 첫째 가는 자들’, ‘민족들의 우두머리’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 압축되어 있으며, 문자적으로는 ‘이스라엘의 집이 그들에게 온다’입니다.
    reason: source_note
lexical_decisions:
- source_word: ה֚וֹי
  english_pob_choice: Woe
  chosen_korean: 「화 있을진저」
  alternatives_korean:
  - 아아
  - 슬프도다
  lexicon: HALOT
  rationale: 예언적 경고와 탄식의 감탄사를 한국어 합쇼체로 옮기면서, 단순 감탄보다 심판 선언의 무게를 살렸습니다.
- source_word: הַשַּׁאֲנַנִּים
  english_pob_choice: those who are at ease
  chosen_korean: 안일한 자들
  alternatives_korean:
  - 편안해하는 자들
  - 태평한 자들
  - 안전하다고 느끼는 자들
  lexicon: HALOT
  rationale: 어근이 가리키는 무사안일과 도덕적 둔감함을 반영하기 위해 ‘안일한’으로 옮겼습니다.
- source_word: נְקֻבֵי רֵאשִׁית הַגּוֹיִם
  english_pob_choice: the distinguished men of the foremost of the nations
  chosen_korean: 민족들 가운데 으뜸인 자들
  alternatives_korean:
  - 지명된 자들
  - 지목된 자들
  - 뛰어난 민족의 사람들
  lexicon: HALOT
  rationale: 직역 가능한 ‘지명된/지목된’의 의미는 각주로 남기고, 본문에서는 사회적 우월성과 대표성을 드러내는 표현을 택했습니다.
- source_word: וּבָאוּ לָהֶם בֵּית יִשְׂרָאֵל
  english_pob_choice: to whom the house of Israel comes
  chosen_korean: 이스라엘의 집이 그들에게로 오는 자들
  alternatives_korean:
  - 이스라엘의 집이 그들에게 나아오는 자들
  - 이스라엘의 집이 그들에게 찾아오는 자들
  lexicon: HALOT
  rationale: 히브리어의 압축된 관계절을 한국어 문장으로 풀어, ‘이스라엘의 집이 그들에게로 온다’는 의존 관계를 분명히 했습니다.
theological_decisions:
- issue: 시온과 사마리아의 병렬 대상
  chosen_reading: 예언은 시온과 사마리아를 함께 지목하여, 남북 왕국의 권력 중심에 있는 안일한 지도층을 동시에 책망합니다.
  alternative_readings:
  - 시온은 수사적 표현일 뿐 실제 주 대상은 북왕국 지도층이다
  - 본문을 한쪽 왕국에만 한정해야 한다
  rationale: 히브리어의 병렬 구조를 그대로 살려 두 지명을 모두 보존하는 것이 본문이 의도한 폭넓은 심판 대상을 가장 잘 드러냅니다.
  doctrine_reference: 예언서의 공적 심판 선언과 언약 백성 전체에 대한 책망
