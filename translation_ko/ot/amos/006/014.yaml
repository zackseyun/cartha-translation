  to: 이스라엘 집아, 보라, 내가 너희를 대적할 한 나라를 일으킬 것입니다. 만군의 하나님 야훼의 말씀입니다. 그들이 레보하맛[a]에서 아라바의 와디[b]까지 너희를 압제할 것입니다.
