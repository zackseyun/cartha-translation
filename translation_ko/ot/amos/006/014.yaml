  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
  footnotes:
  - marker: a
    text: Or “from the entrance of Hamath.” The Hebrew expression may be understood either as the place name Lebo-hamath or as a descriptive boundary phrase.
    reason: alternative_reading
  - marker: b
    text: Or “the brook of the Arabah.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 집아, 보라, 내가 너희를 대적할 한 나라를 일으킬 것입니다. 만군의 하나님 야훼의 말씀입니다. 그들이 레보하맛[a]에서 아라바의 와디[b]까지 너희를 압제할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하맛의 어귀에서부터.” 히브리어 표현은 ‘레보하맛’이라는 지명으로도, 경계 표현으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “아라바 시내.”
    reason: lexical_alternative
lexical_decisions:
