source:
  edition: WLC
  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
  footnotes:
  - marker: a
    text: Or “from the entrance of Hamath.” The Hebrew expression may be understood either as the place name Lebo-hamath or as a descriptive boundary phrase.
    reason: alternative_reading
  - marker: b
    text: Or “the brook of the Arabah.”
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 내가 이스라엘 집 위에 한 나라를 일으키고 있으니—만군의 하나님 야훼의 말씀입니다—그들이 레보하맛에서부터 아라바 시내까지 너희를 압제할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하맛의 어귀에서부터.” 히브리어 표현은 ‘레보하맛’이라는 지명으로도, 경계 표현으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “아라바 시내.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: behold, I am
  chosen_korean: 보라, 내가
  alternatives_korean:
  - 보라, 내가 여기
  - 내가 보라
  lexicon: HALOT
  rationale: 예언적 주의 환기와 임박한 행위 선언을 한국어로 자연스럽게 살리기 위해 ‘보라, 내가’를 택했습니다.
- source_word: מֵקִים
  english_pob_choice: raising up
  chosen_korean: 일으키고
  alternatives_korean:
  - 세우고
  - 끌어올리고
  - 일으켜 세우고
  lexicon: HALOT
  rationale: 하나님이 한 나라를 역사 속에 등장시키시는 능동적 행위를 나타내므로 ‘일으키고’가 가장 간결하고 적절합니다.
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  english_pob_choice: the God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 만군의 하나님
  - 군대들의 하나님
  - 하늘의 군대의 하나님
  lexicon: HALOT
  rationale: צבאות의 군사적·우주적 넓이를 유지하면서 한국어 예배 언어에도 익숙한 표현을 사용했습니다.
- source_word: גּוֹי
  english_pob_choice: a nation
  chosen_korean: 한 나라
  alternatives_korean:
  - 한 민족
  - 한 국가
  - 한 나라의 백성
  lexicon: HALOT
  rationale: 심판 도구로 등장하는 외세를 가리키므로 ‘한 나라’가 가장 직접적입니다.
- source_word: וְלָחֲצוּ
  english_pob_choice: and they will oppress
  chosen_korean: 압제할 것입니다
  alternatives_korean:
  - 억압할 것입니다
  - 짓누를 것입니다
  - 괴롭힐 것입니다
  lexicon: HALOT
  rationale: 지속적이고 정치적인 강압을 나타내므로 단순한 괴롭힘보다 ‘압제’가 원문의 힘을 더 잘 전달합니다.
- source_word: מִלְּבוֹא חֲמָת
  english_pob_choice: from Lebo-hamath
  chosen_korean: 레보하맛에서부터
  alternatives_korean:
  - 하맛 어귀에서부터
  - 레보-하맛에서부터
  lexicon: HALOT
  rationale: 문맥상 경계 지명으로 기능하므로 직역보다 음역을 유지해 독자가 지명으로 읽도록 했습니다.
- source_word: נַחַל הָעֲרָבָה
  english_pob_choice: the Wadi of the Arabah
  chosen_korean: 아라바 시내
  alternatives_korean:
  - 아라바 와디
  - 아라바 골짜기 시내
  - 아라바의 개천
  lexicon: HALOT
  rationale: נחל의 물줄기 뉘앙스를 살리되, 한국어에서는 ‘시내’가 가장 자연스럽고 과도한 지리 해설을 피합니다.
theological_decisions:
- issue: יהוה의 한국어 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 고유명사성을 드러내는 ‘야훼’를 사용했습니다. 여기서는 뒤의 ‘만군의 하나님’과 함께 예언적 선언의 권위를 분명히 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
