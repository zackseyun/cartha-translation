    rationale: '[a]는 레보하맛/‘하맛의 어귀’에, [b]는 아라바의 수로 명칭에 각각 연결되어야 합니다. 현재 위치로는 두 각주의 선행어가 불명확합니다.'
  - severity: low
    issue: 본문의 ‘아라바 시내’와 각주 ‘아라바 시내’가 동일함
