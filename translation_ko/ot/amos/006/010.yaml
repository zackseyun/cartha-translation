- from: 그의 삼촌[a], 곧 그를 불태우는 자가 시신을 집에서 내다 뼈를 꺼내려 할 때, 그가 집의 가장 안쪽에 있는 자에게 말하기를 “아직도 너와 함께 있는 사람이 있느냐?” 하면, 그가 “아무도 없습니다.”라고 하고, 그가 또 말하기를 “조용히 하십시오![c] 우리는 야훼의 이름을 언급해서는 안 됩니다.[b]” 할 것입니다.
