base_translation:
  language: en
  yaml_path: translation/ot/amos/006/010.yaml
  text: Then his uncle[a], the one who burns him, will carry him out to bring the bones out of the house, and he will say to the one who is in the innermost part of the house, “Is there still anyone with you?” And he will say, “No one.” Then he will say[c][b], “Hush! For we must not mention the name of Yahweh.”
  footnotes:
  - marker: a
    text: Or, 'his kinsman'; the Hebrew term can denote a close male relative, though 'uncle' fits the context well.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'the one who burns him.' The wording is unusual and may refer to burning associated with corpse disposal in a time of judgment.
    reason: cultural_note
  - marker: c
    text: Or, 'Do not mention the name of the LORD.' The Hebrew expression is terse and may be heard either as a direct prohibition or as a statement of necessity.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 삼촌[a], 곧 그를 불태우는 자가 시신을 집에서 내다 뼈를 꺼내려 할 때, 그가 집의 가장 안쪽에 있는 자에게 말하기를 “아직도 너와 함께 있는 사람이 있느냐?” 하면, 그가 “아무도 없습니다.”라고 하고, 그가 또 말하기를 “조용히 하십시오![c] 우리는 야훼의 이름을 언급해서는 안 됩니다.[b]” 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 친족’으로 볼 수 있습니다. 히브리어는 가까운 남자 친족을 가리킬 수 있으나, 문맥상 ‘삼촌’이 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘야훼의 이름으로’입니다. 표현이 매우 압축되어 있어, 직접적인 금지로도, 필요의 진술로도 들릴 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘침묵하십시오!’로 옮길 수 있습니다. 급박하고 두려운 분위기를 살리기 위해 짧은 명령형으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדוֹ
  english_pob_choice: his uncle
  chosen_korean: 그의 삼촌
  alternatives_korean:
  - 그의 친족
  - 그의 사랑하는 이
  lexicon: HALOT
  rationale: 문맥이 시신 처리와 가문의 책임을 다루므로, דּוֹד는 여기서 ‘삼촌’처럼 가까운 남자 친족을 가리키는 것이 가장 자연스럽습니다.
- source_word: וּמְסָרְפוֹ
  english_pob_choice: the one who burns him
  chosen_korean: 그를 불태우는 자
  alternatives_korean:
  - 그를 태우는 사람
  - 장례를 준비하는 사람
  lexicon: HALOT
  rationale: 히브리어는 분명히 ‘태우다/불태우다’를 말하므로, 일반적 장례 표현으로 완화하지 않고 그 낯선 이미지를 살렸습니다.
- source_word: בְּיַרְכְּתֵי הַבַּיִת
  english_pob_choice: in the innermost part of the house
  chosen_korean: 집의 가장 안쪽
  alternatives_korean:
  - 집의 깊숙한 곳
  - 집의 가장 먼 곳
  lexicon: HALOT
  rationale: יַרְכָּה의 핵심은 ‘멀리 떨어진/안쪽의’ 공간이므로, 현대 한국어에서 자연스럽게 ‘가장 안쪽’으로 옮겼습니다.
- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  english_pob_choice: we must not mention the name of Yahweh
  chosen_korean: 우리는 야훼의 이름을 언급해서는 안 됩니다
  alternatives_korean:
  - 야훼의 이름을 언급하지 마십시오
  - 야훼의 이름은 언급되어서는 안 됩니다
  lexicon: HALOT
  rationale: 불가/금지의 압축된 구문을 한국어에서 자연스러운 의무 금지로 풀었고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: הַזְכִּיר בְּשֵׁם יְהוָה의 금지/필연 뉘앙스
  chosen_reading: “우리는 야훼의 이름을 언급해서는 안 됩니다”로 금지의 힘을 살리되, 왜 그런지에 대한 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - “야훼의 이름을 언급하지 마십시오”
  - “야훼의 이름은 언급되어서는 안 됩니다”
  rationale: 히브리어는 간결하고 다의적이어서, 본문이 드러내지 않는 이유를 해석으로 채우지 않고 두려움의 장면 자체를 보존하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
