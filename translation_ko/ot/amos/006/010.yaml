- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  english_pob_choice: we must not mention the name of Yahweh
  chosen_korean: 우리는 야훼의 이름을 언급해서는 안 됩니다
  alternatives_korean:
  - 야훼의 이름을 언급하지 마십시오
  - 야훼의 이름은 언급되어서는 안 됩니다
  lexicon: HALOT
  rationale: 불가/금지의 압축된 구문을 한국어에서 자연스러운 의무 금지로 풀었고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: הַזְכִּיר בְּשֵׁם יְהוָה의 금지/필연 뉘앙스
  chosen_reading: “우리는 야훼의 이름을 언급해서는 안 됩니다”로 금지의 힘을 살리되, 왜 그런지에 대한 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - “야훼의 이름을 언급하지 마십시오”
  - “야훼의 이름은 언급되어서는 안 됩니다”
  rationale: 히브리어는 간결하고 다의적이어서, 본문이 드러내지 않는 이유를 해석으로 채우지 않고 두려움의 장면 자체를 보존하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
