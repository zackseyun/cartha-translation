  rationale: 직역하면 ‘입’이지만, 악기의 소리 나는 부분을 가리키는 관용적 표현으로 이해해 ‘입에 맞추어’로 살렸습니다.
- source_word: כְּלוֵי שִׁיר
  english_pob_choice: instruments of song
  chosen_korean: 노래의 악기들
  alternatives_korean:
