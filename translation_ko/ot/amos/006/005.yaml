  - 노래하는 악기들
  lexicon: כְּלֵי שִׁיר
  rationale: ‘노래를 위한 악기들’이라는 기능을 드러내되, 과도한 해석인 ‘찬양’은 피하고 원문의 일반적 표현을 유지했습니다.
- source_word: כְּדָוִיד
  english_pob_choice: like David
  chosen_korean: 다윗처럼
  alternatives_korean:
  - 다윗과 같이
  - 다윗같이
  lexicon: דָּוִיד
  rationale: 시적 비교 구조를 한국어에서 자연스럽게 전달하기 위해 ‘처럼’을 사용했습니다.
