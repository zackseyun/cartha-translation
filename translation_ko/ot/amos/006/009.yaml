source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם יִוָּ֨תְר֜וּ עֲשָׂרָ֧ה אֲנָשִׁ֛ים בְּ/בַ֥יִת אֶחָ֖ד וָ/מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/009.yaml
  text: And it will happen that if ten men remain in one house[a], they will die.
  footnotes:
  - marker: a
    text: Or, 'are left' instead of 'remain.' The Hebrew verb denotes being left over or remaining after others are gone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 한 집에 열 명의 남자가 남아 있다면, 그들은 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘남다’ 또는 ‘남겨지다’를 뜻합니다. 따라서 ‘남겨진다면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it will happen
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 그리하면
  - 그리고 그것이 일어날 것입니다
  lexicon: HALOT
  rationale: 예언적 조건문을 자연스럽게 시작하는 표현으로 옮겼으며, 이어지는 조건절을 살리기 위해 한국어에서는 ‘그리고 만일’로 처리했습니다.
- source_word: יִוָּתְרוּ
  english_pob_choice: remain
  chosen_korean: 남아 있더라도
  alternatives_korean:
  - 남아 있다면
  - 남겨지더라도
  - 남아 있다
  lexicon: HALOT
  rationale: 동사의 핵심인 ‘남아 있음/남겨짐’을 반영하되, 결과절의 죽음과 연결되는 문맥을 살리기 위해 다소 자연스러운 ‘남아 있더라도’를 택했습니다.
- source_word: עֲשָׂרָה אֲנָשִׁים
  english_pob_choice: ten men
  chosen_korean: 열 명의 사람
  alternatives_korean:
  - 열 사람
  - 열 명의 남자들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수를 쓰지만, 한국어에서는 예언문의 비극적 장면을 전달하는 데 ‘사람’이 과도한 성별 표시 없이 더 자연스러워 문맥상 포괄적으로 옮겼습니다.
- source_word: בְּבַיִת אֶחָד
  english_pob_choice: in one house
  chosen_korean: 한 집에
  alternatives_korean:
  - 한 집 안에
  - 한 가정에
  lexicon: HALOT
  rationale: 공간적·구체적 의미를 유지하기 위해 ‘집’으로 옮겼고, ‘가정’은 건물보다 가족 단위로 의미가 좁아질 수 있어 피했습니다.
theological_decisions:
- issue: 예언적 결과절의 미래 시제와 파멸의 확정성
  chosen_reading: ‘그들은 죽을 것입니다’로 미래 결과를 분명히 제시했습니다.
  alternative_readings:
  - 그들은 죽게 될 것입니다
  - 그들은 죽습니다
  rationale: 히브리어의 וָמֵתוּ는 단순한 서술이 아니라 조건 뒤에 오는 확정적 결과를 나타내므로, 현대 한국어에서도 미래 결과를 분명하게 드러냈습니다.
  doctrine_reference: 예언 심판의 확정성과 하나님의 판결 선언
