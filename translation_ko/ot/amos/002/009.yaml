  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָ֨נֹכִ֜י הִשְׁמַ֤דְתִּי אֶת הָֽ/אֱמֹרִי֙ מִ/פְּנֵי/הֶ֔ם אֲשֶׁ֨ר כְּ/גֹ֤בַהּ אֲרָזִים֙ גָּבְה֔/וֹ וְ/חָסֹ֥ן ה֖וּא כָּֽ/אַלּוֹנִ֑ים וָ/אַשְׁמִ֤יד פִּרְי/וֹ֙ מִ/מַּ֔עַל וְ/שָׁרָשָׁ֖י/ו מִ/תָּֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/009.yaml
  text: Yet I destroyed the Amorite before them[a], whose height was like the height of cedars, and he was strong like the oaks[b]; I destroyed his fruit above and his roots beneath.
  footnotes:
  - marker: a
    text: Or 'the Amorites'; Hebrew uses the singular 'the Amorite' as a collective for the people.
    reason: lexical_alternative
  - marker: b
    text: '''Fruit'' and ''roots'' continue the tree imagery and imply total destruction from top to bottom.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 내가 그들 앞에서 아모리 사람을 멸망시켰습니다[a]. 그의 키는 백향목의 키 같았고, 그는 상수리나무들처럼 강했습니다[b]. 내가 위에 있는 그의 열매와 아래에 있는 그의 뿌리를 멸망시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형 ‘아모리 사람’을 집합명사처럼 써서 아모리 민족 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘열매’와 ‘뿌리’는 나무 이미지를 이어 가며, 위에서 아래까지의 완전한 멸망을 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָנֹכִי
  english_pob_choice: Yet I
  chosen_korean: 그러나 내가
  alternatives_korean:
  - 그리고 내가
  - 내가 또
  lexicon: HALOT
  rationale: 문맥상 앞선 진술과의 대조가 핵심이므로, 단순한 연결보다 역전·대조를 드러내는 ‘그러나’가 적절합니다. 강조된 인칭 대명사도 ‘내가’로 살렸습니다.
- source_word: הִשְׁמַדְתִּי
  english_pob_choice: destroyed
  chosen_korean: 멸망시켰습니다
  alternatives_korean:
  - 파멸시켰습니다
  - 멸절시켰습니다
  - 파괴했습니다
  lexicon: HALOT
  rationale: 히필형 שׁמד는 단순 파괴보다 ‘완전한 멸망’을 뜻하므로, 한국어에서도 강도를 살리기 위해 ‘멸망시키다’를 택했습니다.
- source_word: הָאֱמֹרִי
  english_pob_choice: the Amorite
  chosen_korean: 아모리 사람
  alternatives_korean:
  - 아모리 족속
  - 아모리인
  lexicon: HALOT
  rationale: 히브리어 단수 집합명사를 한국어에서는 자연스럽게 민족 집단으로 풀어 ‘아모리 사람’이라 옮겼습니다. 본문에 단수 집합성을 유지하되, 한국어 문법상 어색함은 피했습니다.
- source_word: כְּגֹבַהּ אֲרָזִים גָּבְהוֹ
  english_pob_choice: whose height was like the height of cedars
  chosen_korean: 그의 키는 백향목의 키 같았고
  alternatives_korean:
  - 그의 높이는 백향목의 높이 같았고
  - 그는 백향목처럼 키가 컸고
  lexicon: HALOT
  rationale: 중복된 ‘높이’ 표현을 살리면서도 한국어에서는 ‘키’가 인물 묘사에 가장 자연스럽습니다. ‘백향목’은 시적 수목 비유를 보존하는 표준 번역입니다.
- source_word: וְחָסֹן הוּא כָּאַלּוֹנִים
  english_pob_choice: and he was strong like the oaks
  chosen_korean: 그는 상수리나무들처럼 강했습니다
  alternatives_korean:
  - 그는 떡갈나무들처럼 강했습니다
  - 그는 상수리나무처럼 강했습니다
  lexicon: HALOT
  rationale: חָסֹן의 핵심은 강건함이므로 ‘강했습니다’가 직접적입니다. אַלּוֹנִים은 일반적으로 상수리나무로 옮길 수 있어, 비교 대상을 한국어 독자가 바로 이해할 수 있게 했습니다.
- source_word: פִּרְיוֹ ... וְשָׁרָשָׁיו
  english_pob_choice: his fruit ... his roots
  chosen_korean: 그의 열매는 … 그의 뿌리는
  alternatives_korean:
  - 그의 소출은 … 그의 뿌리는
  - 그의 자손은 … 그의 뿌리는
  lexicon: HALOT
  rationale: 나무 비유가 끝까지 이어지므로 본문에서는 이미지가 분명한 ‘열매’와 ‘뿌리’를 유지했습니다. ‘자손’은 해석적 확장이므로 본문에서는 채택하지 않았습니다.
theological_decisions:
- issue: 아모리 사람에 대한 단수 집합명사와 인칭 유지
  chosen_reading: 한국어 본문에서는 ‘아모리 사람’으로 자연화하되, 동사는 단수 인격화된 흐름을 살려 집합적 적대자를 하나의 거목처럼 그리는 수사를 보존했습니다.
  alternative_readings:
  - ‘아모리들’로 전면 복수화하여 매끄럽게 처리함
  - 완전한 단수 ‘아모리인’으로 유지함
  rationale: 히브리어는 단수형을 집합적으로 사용하며, 이어지는 ‘그의…그는…그의’도 그 집합적 인격화와 맞물립니다. 이를 살리면 총체적 심판의 수사와 나무 비유가 더 분명해집니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
