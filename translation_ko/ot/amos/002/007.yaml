id: AMO.2.7
reference: Amos 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/שֹּׁאֲפִ֤ים עַל עֲפַר אֶ֨רֶץ֙ בְּ/רֹ֣אשׁ דַּלִּ֔ים וְ/דֶ֥רֶךְ עֲנָוִ֖ים יַטּ֑וּ וְ/אִ֣ישׁ וְ/אָבִ֗י/ו יֵֽלְכוּ֙ אֶל הַֽ/נַּעֲרָ֔ה לְמַ֥עַן חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/007.yaml
  text: those who trample the head of the poor into the dust of the earth[a], and turn aside the way of the humble; and a man and his father go in to the same girl[d][c][b], so as to profane my holy name.
  footnotes:
  - marker: a
    text: Or 'those who pant after the dust of the earth on the head of the poor.' The Hebrew verb can be read more literally as intense craving, but in context it likely describes ruthless oppression.
    reason: lexical_alternative
  - marker: b
    text: Or 'turn aside the path of the afflicted/meek.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'go in to the girl'; this is a sexual euphemism. 'Girl' may also be rendered 'young woman.'
    reason: lexical_alternative
  - marker: d
    text: The verse does not explicitly identify the girl as a cult prostitute or slave, though some interpreters infer exploitation of that kind from the context.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 가난한 자의 머리를 땅의 티끌 속에 짓밟고[a], 겸손한 자의 길을 비뚤어지게 하며, 한 사람과 그의 아버지가 같은 소녀에게 들어가서[c][b][d] 내 거룩한 이름을 더럽힙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 티끌을 가난한 자의 머리 위에서 갈망하는 자들’로도 읽을 수 있습니다. 히브리어 동사는 더 문자적으로는 강한 욕망을 뜻할 수 있으나, 문맥에서는 잔혹한 억압을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고난받는 자/온유한 자의 길을 비뚤어지게 하며’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘소녀에게 들어가다’는 성적 완곡어법입니다. ‘소녀’는 ‘젊은 여자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 본문은 그 소녀가 성전 매춘부나 노예라고 명시하지 않지만, 일부 해석자는 문맥상 그런 착취를 추정합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁאֲפִים
  english_pob_choice: those who trample
  chosen_korean: 짓밟고
  alternatives_korean:
  - 열망하는
  - 탐하는
  - 내리누르고
  lexicon: HALOT
  rationale: 문맥상 ‘가난한 자의 머리’와 ‘땅의 티끌’이 결합되어 있어 단순한 갈망보다 폭력적 억압을 드러내는 동사가 필요합니다. 한국어 ‘짓밟다’가 그 훼손성과 폭력을 가장 자연스럽게 살립니다.
- source_word: עַל עֲפַר אֶרֶץ
  english_pob_choice: into the dust of the earth
  chosen_korean: 땅의 티끌 속에
  alternatives_korean:
  - 땅의 티끌 위에
  - 땅의 먼지 위에
  - 땅의 흙 속에
  lexicon: HALOT
  rationale: 히브리어의 흙/티끌 이미지를 살리면서 ‘짓밟다’와 자연스럽게 연결되는 표현으로 옮겼습니다. ‘속에’는 단순한 위치보다 짓눌림의 결과를 강조합니다.
- source_word: וְדֶרֶךְ עֲנָוִים יַטּוּ
  english_pob_choice: and turn aside the way of the humble
  chosen_korean: 겸손한 자의 길을 비뚤어지게 하며
  alternatives_korean:
  - 가난한 자의 길을 굽게 하며
  - 온유한 자의 길에서 벗어나게 하며
  - 겸손한 자의 길을 돌이키며
  lexicon: HALOT
  rationale: דרך는 ‘길’로, Hiphil נטה는 ‘비뚤어지게 하다/돌려버리다’의 뜻이 있어 그 비틀림을 살렸습니다. ענוים은 ‘겸손한/온유한/압제받는’의 폭이 있으나, 여기서는 사회적 약자의 낮아짐도 함께 담는 ‘겸손한 자’가 가장 무난합니다.
- source_word: וְאִישׁ וְאָבִיו יֵלְכוּ אֶל הַנַּעֲרָה
  english_pob_choice: and a man and his father go in to the same girl
  chosen_korean: 한 사람과 그의 아버지가 같은 소녀에게 들어가서
  alternatives_korean:
  - 한 남자와 그의 아버지가 같은 여자에게 들어가서
  - 한 사람과 그의 아버지가 그 소녀에게 가서
  - 한 남자와 그의 아버지가 같은 젊은 여자에게 들어가서
  lexicon: HALOT
  rationale: הלך אל은 여기서 성적 완곡어법이므로 ‘들어가다’로 옮겨 의미를 드러냈습니다. נערה는 나이와 취약성을 살리는 ‘소녀’가 적절하며, 본문이 한 여성을 공유하는 상황임을 반영해 ‘같은’을 유지했습니다.
- source_word: שֵׁם קָדְשִׁי
  english_pob_choice: my holy name
  chosen_korean: 내 거룩한 이름
  alternatives_korean:
  - 내 성호
  - 나의 거룩한 이름
  - 내 거룩하신 이름
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 한국어에서 자연스럽고 신학적으로도 분명한 ‘거룩한 이름’으로 옮겼습니다. 하나님의 소유격을 분명히 하되 과도한 경어를 붙여 의미를 흐리지 않았습니다.
theological_decisions:
- issue: וְאִישׁ וְאָבִיו יֵלְכוּ אֶל הַנַּעֲרָה의 성적 행위 성격
  chosen_reading: 본문은 한 사람과 그의 아버지가 같은 소녀와 성적 관계를 맺는 행위를 정죄하며, 이것을 야훼의 거룩한 이름을 더럽히는 일로 제시합니다.
  alternative_readings:
  - 특정한 성전 성매매나 착취를 가리킨다고 볼 수 있습니다.
  - 노골적 근친상간이라기보다 가족 질서를 모독하는 성적 타락을 강조한다고 볼 수 있습니다.
  rationale: 히브리어 본문 자체는 ‘소녀에게 들어감’이라는 완곡어법과 ‘내 거룩한 이름을 더럽히다’라는 결말을 분명히 말하지만, 소녀의 신분이나 제도적 배경을 명시하지는 않습니다. 따라서 주석적 추정을 본문 본문에 덧붙이지 않고 긴장을 보존합니다.
  doctrine_reference: 본문이 말하는 범위를 넘어서 성격을 단정하지 않고, 죄의 사회적·언약적 모독성을 유지합니다.
