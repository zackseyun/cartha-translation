id: AMO.2.2
reference: Amos 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מוֹאָ֔ב וְ/אָכְלָ֖ה אַרְמְנ֣וֹת הַ/קְּרִיּ֑וֹת וּ/מֵ֤ת בְּ/שָׁאוֹן֙ מוֹאָ֔ב בִּ/תְרוּעָ֖ה בְּ/ק֥וֹל שׁוֹפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/002.yaml
  text: So I will send fire upon Moab[a], and it will consume the citadels of Kerioth; and Moab will die amid tumult, amid shouting[c][b], amid the sound of a trumpet.
  footnotes:
  - marker: a
    text: Or 'the palaces of Kerioth' or 'the strongholds of Kerioth.'
    reason: lexical_alternative
  - marker: b
    text: Kerioth may also be understood as 'the cities,' though it is likely a place-name here.
    reason: alternative_reading
  - marker: c
    text: '''Shouting'' may also be rendered ''a battle cry.'''
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 모압에 불을 보내리니, 그것이 그리욧의 견고한 성들을 삼킬 것입니다. 모압은 소란 속에서, 함성 속에서, 나팔 소리 가운데 죽을 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리욧은 ‘도시들’로도 이해할 수 있지만, 여기서는 지명으로 보는 것이 더 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: ‘나팔’은 전쟁과 집회의 신호로 쓰이는 뿔나팔을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘함성’은 ‘전투 함성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: So I will send
  chosen_korean: 내가 … 보내리니
  alternatives_korean:
  - 내가 … 보내겠습니다
  - 내가 … 보낼 것입니다
  lexicon: HALOT
  rationale: 예언적 심판 선언에서 1인칭 미래형의 직접성을 살리되, 한국어에서는 결과를 이끄는 연속성을 '-리니'로 자연스럽게 드러냈습니다.
- source_word: אֵשׁ
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 불길
  - 화염
  lexicon: HALOT
  rationale: 심판 이미지로서의 기본 의미를 가장 सीधे하게 살리기 위해 일상적이고도 문맥에 맞는 '불'로 옮겼습니다.
- source_word: אַרְמְנוֹת
  english_pob_choice: the citadels
  chosen_korean: 견고한 성들
  alternatives_korean:
  - 궁전들
  - 요새들
  lexicon: HALOT
  rationale: 문맥상 왕궁만이 아니라 방어된 중심 건축물을 가리킬 수 있으므로, '견고한 성들'로 옮겨 성채성과 방어성을 함께 살렸습니다.
- source_word: הַקְּרִיּוֹת
  english_pob_choice: of Kerioth
  chosen_korean: 그리욧
  alternatives_korean:
  - 그 도시들
  - 케리욧
  lexicon: HALOT
  rationale: 본문의 본래 읽음은 지명으로 이해하는 것이 가장 자연스러워, 일반 명사화하지 않고 음역을 유지했습니다.
- source_word: בְּשָׁאוֹן
  english_pob_choice: amid tumult
  chosen_korean: 소란 속에서
  alternatives_korean:
  - 혼란 가운데
  - 격동 속에서
  lexicon: HALOT
  rationale: 전투와 파괴의 소음을 나타내는 어휘를 한국어 관용으로 풀어, 폭력적 소란의 현장감을 살렸습니다.
- source_word: בִּתְרוּעָה
  english_pob_choice: amid shouting
  chosen_korean: 함성 속에서
  alternatives_korean:
  - 전투 함성 속에서
  - 승리의 외침 속에서
  lexicon: HALOT
  rationale: 직전의 '소란'과 다음의 '나팔 소리' 사이에서, যুদ্ধ적 외침의 의미를 담되 중복을 줄이기 위해 '함성'으로 옮겼습니다.
- source_word: בְּקוֹל שׁוֹפָר
  english_pob_choice: amid the sound of a trumpet
  chosen_korean: 나팔 소리 가운데
  alternatives_korean:
  - 나팔 소리와 함께
  - 뿔나팔 소리 가운데
  lexicon: HALOT
  rationale: שׁוֹפָר의 전쟁·집회용 뿔나팔을 한국어 성경 표현인 '나팔'로 자연스럽게 옮기되, 소리의 동반 상황을 살리기 위해 '가운데'를 사용했습니다.
theological_decisions:
- issue: 예언적 미래 표현과 하나님의 직접 심판 선언
  chosen_reading: '''내가 … 보내리니''로 하나님의 주권적 심판 행위를 직접적으로 드러냈습니다.'
  alternative_readings:
  - '''내가 … 보내겠습니다''처럼 더 평이하게 옮길 수 있음'
  - '''내가 … 보낼 것입니다''처럼 서술적으로 옮길 수 있음'
  rationale: 본절은 선언문 형식의 예언적 심판이므로, 단순 미래보다 선포적이고 단호한 한국어 종결을 택했습니다.
  doctrine_reference: 예언서의 신적 주권과 심판 선언 문체
- issue: Kerioth의 처리
  chosen_reading: 지명으로 이해하여 '그리욧'을 유지했습니다.
  alternative_readings:
  - '''그 도시들''로 일반 명사화할 수 있음'
  rationale: 본문과 영어 POB 주석 모두 지명 이해를 우선시하므로, 해석을 과도하게 일반화하지 않고 음역을 유지하는 것이 본문 충실성에 더 가깝습니다.
  doctrine_reference: 본문 고유명사 보존과 지리적 심판 대상의 구체성
