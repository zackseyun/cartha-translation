id: AMO.2.6
reference: Amos 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יִשְׂרָאֵ֔ל וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל מִכְרָ֤/ם בַּ/כֶּ֨סֶף֙ צַדִּ֔יק וְ/אֶבְי֖וֹן בַּ/עֲב֥וּר נַעֲלָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Israel[a], and for four, I will not revoke the punishment, because they sell the righteous for silver, and the needy for a pair of sandals.”'
  footnotes:
  - marker: a
    text: Or, “I will not revoke it,” that is, I will not reverse the announced judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “이스라엘의 죄가 셋, 넷이므로, 나는 그것을 거두지 않겠습니다.[a] 그들이 의인을 은을 받고 팔고, 궁핍한 이를 샌들 한 켤레를 받고 팔았기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 그것을 되돌리지 않겠습니다.” 히브리어의 목적어는 명시되지 않았으며, 선포된 심판을 가리키는 것으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하셨습니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식은 한국어로 자연스럽게 ‘이렇게 말씀하십니다’로 옮기고, 여호와 대신 프로젝트 기본값인 ‘야훼’를 유지합니다.
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  english_pob_choice: For three transgressions ... and for four
  chosen_korean: 이스라엘의 세 가지 죄, 네 가지 죄 때문에
  alternatives_korean:
  - 이스라엘의 세 가지 범죄, 네 가지 범죄 때문에
  - 이스라엘의 세 번의 죄와 네 번의 죄 때문에
  lexicon: HALOT
  rationale: 아모스의 누적 수사법을 살리되, ‘죄’로 옮겨 도덕적·언약적 위반의 뉘앙스를 유지했습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not turn it back
  chosen_korean: 나는 그것을 돌이키지 않겠습니다
  alternatives_korean:
  - 나는 그것을 철회하지 않겠습니다
  - 나는 그것을 되돌리지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 목적어를 그대로 살려 ‘그것을’로 두고, 심판을 명시적으로 풀어 쓰지 않아 본문 긴장을 보존했습니다.
- source_word: מִכְרָם בַּכֶּסֶף
  english_pob_choice: they sell the righteous for silver
  chosen_korean: 그들이 의인을 은으로 팔고
  alternatives_korean:
  - 그들이 의인을 돈으로 팔고
  - 그들이 의인을 은 값에 팔고
  lexicon: HALOT
  rationale: ‘은’은 문자적 대응을 유지하면서 값싼 거래를 드러내며, ‘의인’은 צַדִּיק의 법정·윤리적 의미를 보존합니다.
- source_word: אֶבְיוֹן בַּעֲבוּר נַעֲלָיִם
  english_pob_choice: the needy for a pair of sandals
  chosen_korean: 가난한 사람을 한 켤레의 샌들 값으로 팔았기 때문입니다
  alternatives_korean:
  - 가난한 사람을 샌들 한 켤레 값에 팔았기 때문입니다
  - 궁핍한 사람을 한 켤레의 샌들에 팔았기 때문입니다
  lexicon: HALOT
  rationale: ‘한 켤레의 샌들’은 히브리어 복수형의 소박함과 모욕적 교환가치를 살리고, ‘가난한 사람’은 אֶבְיוֹן의 빈곤 상태를 자연스럽게 전달합니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값을 따르되, 본문에서 예언자 발화의 주어로서 고유한 언약명의 식별성을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → 야훼'
- issue: לֹא אֲשִׁיבֶנּוּ의 의미 범위
  chosen_reading: 그것을 돌이키지 않겠습니다
  alternative_readings:
  - 그것을 철회하지 않겠습니다
  - 그것을 되돌리지 않겠습니다
  rationale: 히브리어의 생략과 암시를 해소하지 않고, 선언된 심판을 ‘그것’으로 남겨 두어 본문이 의도적으로 남긴 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
