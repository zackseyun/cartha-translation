revisions:
- from: 야훼께서 이렇게 말씀하십니다. “이스라엘의 세 가지 죄, 네 가지 죄 때문에 나는 그것을 돌이키지 않겠습니다. 그들이 의인을 은으로 팔고, 가난한 사람을 한 켤레의 샌들 값으로 팔았기 때문입니다.”[a]
  to: 야훼께서 이렇게 말씀하십니다. “이스라엘의 죄가 셋, 넷이므로, 나는 그것을 거두지 않겠습니다.[a] 그들이 의인을 은을 받고 팔고, 궁핍한 이를 샌들 한 켤레를 받고 팔았기 때문입니다.”
  rationale: 아모스 특유의 수적 점층 공식을 한국어에서 자연스럽게 재현하고, 히브리어의 생략된 목적어는 ‘그것’으로 보존했습니다. 판매의 대가를 ‘은을 받고’와 ‘샌들 한 켤레를 받고’로 명확히 하여 원문의 병렬과 의미를 살렸으며, 각주를 실제로 가능한 대안 번역과 목적어의 생략에 대한 설명으로 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:40Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 수사적 ‘셋… 넷’ 공식, 생략된 목적어, 그리고 은과 신발을 대가로 한 매매의 병렬을 유지해야 합니다. 초안의 ‘은으로 팔고’는 한국어에서 은을 수단으로 삼아 판다는 뜻으로도 읽힐 수 있으므로, 대가를 분명히 하는 표현이 필요합니다.
  naturalness: ‘세 가지 죄, 네 가지 죄 때문에’는 직역 흔적이 강하고, ‘그것을 돌이키지 않겠습니다’도 현대 한국어에서 다소 부자연스럽습니다. ‘죄가 셋, 넷이므로’와 ‘그것을 거두지 않겠습니다’는 예언적 문체와 합쇼체를 유지하면서 더 자연스럽습니다.
  terminology: ‘야훼’, ‘죄’, ‘의인’은 유지할 수 있습니다. אֶבְיוֹן은 단순한 경제적 빈곤보다 궁핍함을 가리키므로 ‘궁핍한 이’가 적절합니다. נַעֲלָיִם은 ‘샌들 한 켤레’로 옮기되, 히브리어의 교환 대상을 ‘값’으로 과도하게 해석하지 않고 ‘받고’로 표현합니다.
  issues:
  - severity: medium
    issue: ‘은으로 팔고’는 대가가 아니라 수단으로 읽힐 수 있습니다.
    rationale: בַּכֶּסֶף는 이 문맥에서 판매의 대가인 은을 가리킵니다. ‘은을 받고 팔고’가 한국어 의미 관계를 정확히 드러냅니다.
  - severity: medium
    issue: ‘그것을 돌이키지 않겠습니다’는 자연스러운 한국어 관용으로 정착되어 있지 않습니다.
    rationale: לֹא אֲשִׁיבֶנּוּ의 목적어는 본문에서 생략되어 있으므로 ‘그것’을 남기되, 선언이나 조처를 철회하지 않는다는 뜻을 자연스럽게 나타내는 ‘거두지 않겠습니다’로 옮길 수 있습니다.
  - severity: low
    issue: 각주가 대안 번역을 제시하지 않고 본문 표현을 반복하며, 해당 구절에 직접 붙어 있지 않습니다.
    rationale: 각주는 본문의 ‘거두지 않겠습니다’에 대한 가능한 직역 대안을 제시하고, 해당 절에 앵커를 두는 편이 기능과 위치 면에서 적절합니다.
