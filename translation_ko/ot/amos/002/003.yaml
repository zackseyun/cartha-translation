  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִכְרַתִּ֥י שׁוֹפֵ֖ט מִ/קִּרְבָּ֑/הּ וְ/כָל שָׂרֶ֛י/הָ אֶהֱר֥וֹג עִמּ֖/וֹ אָמַ֥ר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/003.yaml
  text: And I will cut off the judge from her midst[a], and I will kill all her officials with him,” says Yahweh.
  footnotes:
  - marker: a
    text: Or 'the judge'; the Hebrew term can denote a judicial officer or, more broadly here, a governing ruler.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 한 치리자를 그 가운데에서 끊어 버리고[a], 그와 함께 그의 모든 대신들을 죽이겠습니다.”라고 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 치리자’; 히브리어 이 단어는 사법관을 뜻할 수도 있고, 여기서는 더 넓게 통치자를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  english_pob_choice: I will cut off
  chosen_korean: 끊어 버리고
  alternatives_korean:
  - 끊어 내고
  - 제거하고
  - 멸하고
  lexicon: HALOT
  rationale: כרת의 심판적·단절적 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 강한 종결감을 주는 표현으로 옮겼습니다.
- source_word: שׁוֹפֵט
  english_pob_choice: the judge
  chosen_korean: 한 치리자
  alternatives_korean:
  - 한 재판관
  - 한 판관
  - 한 통치자
  lexicon: HALOT
  rationale: 문자적으로는 ‘판단하는 자’이지만, 문맥상 정치적 지도력을 가리킬 수 있어 ‘치리자’로 옮겨 사법직에만 제한되지 않게 했습니다. 앞에 ‘한’을 둔 것은 영어 주석의 대안적 이해(‘the judge’ 또는 더 넓게 ruler)를 반영한 것입니다.
- source_word: וְכָל שָׂרֶיהָ
  english_pob_choice: all her officials
  chosen_korean: 그의 모든 대신들
  alternatives_korean:
  - 그녀의 모든 관원들
  - 그의 모든 지도자들
  - 그의 모든 귀족들
  lexicon: HALOT
  rationale: שָׂרִים을 혈통 귀족만이 아니라 통치 엘리트 전체로 이해해, 현대 한국어에서 정치 권력층을 자연스럽게 가리키는 ‘대신들’로 옮겼습니다.
- source_word: עִמּוֹ
  english_pob_choice: with him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 더불어
  - 그와 같이
  - 그와 더불어 함께
  lexicon: HALOT
  rationale: 대명사 접속을 자연스럽게 풀어, 앞의 단수 지시 대상과 그에 따른 집단적 심판을 분명히 했습니다.
- source_word: אָמַר יְהוָה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 이르십니다
  - 야훼의 말씀이니라
  lexicon: HALOT
  rationale: 예언 공식의 현재시제 진술을 한국어 성경체로 살리면서, 본 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언 심판문의 화자 표지와 신명 표기
  chosen_reading: 직접 발화 형식으로 옮기되, יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’으로 완화하는 번역
  - 간접화법으로 처리하는 번역
  rationale: 본문은 하나님의 직접 선언을 담은 예언 공식을 사용하므로, 발화의 즉시성과 권위를 보존하는 것이 중요합니다. 또한 Tetragrammaton을 관습적 대체어가 아니라 고유 신명으로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שׁוֹפֵט의 의미 범위
  chosen_reading: 사법관에 한정하지 않고 통치 엘리트로 읽을 수 있게 ‘치리자’로 번역했습니다.
  alternative_readings:
  - ‘재판관’으로 좁히는 번역
  - ‘통치자’로 넓히는 번역
  rationale: 영어 POB 주해가 이 단어를 더 넓은 정치적 지도자로 이해할 수 있음을 분명히 하므로, 한국어에서도 그 긴장을 지우지 않도록 중간 폭의 표현을 택했습니다.
  doctrine_reference: 본문 문맥에 따른 어휘적 판단
