  source_fidelity: 핵심 의미는 대체로 충실합니다. מָנוֹס는 빠른 사람에게서 사라지는 도피 가능성/피할 길을, יְאַמֵּץ כֹּחוֹ는 강한 사람이 자신의 힘을 발휘하거나 힘을 내지 못함을, יְמַלֵּט נַפְשׁוֹ는 용사가 자기 목숨을 구하지 못함을 뜻합니다. 다만 ‘도망이 사라지고’와 ‘힘을 강화하지 못하며’는 한국어에서 다소 직역투이며, 후자는 히브리어 관용의 문맥적 뜻을 충분히 자연스럽게 전달하지 못합니다.
