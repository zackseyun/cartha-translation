  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָבַ֤ד מָנוֹס֙ מִ/קָּ֔ל וְ/חָזָ֖ק לֹא יְאַמֵּ֣ץ כֹּח֑/וֹ וְ/גִבּ֖וֹר לֹא יְמַלֵּ֥ט נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/014.yaml
  text: Flight will perish from the swift[a], and the strong will not strengthen his power[d][c][b], and the warrior will not save his life.
  footnotes:
  - marker: a
    text: Or 'Escape will vanish from the swift.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the strong will not muster his strength.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'will not save his נפש'; here the Hebrew means 'life' or 'self,' not specifically 'soul.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the strong will not strengthen his power'.
    reason: previous_rendering
translation:
  language: ko
  text: 빠른 자도 피할 길을 잃고[a], 강한 자도 자기 힘을 내지 못하며[b], 용사도 자기 목숨을 구하지 못합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빠른 자에게서 도피가 사라지고.’ 히브리어 מָנוֹס는 ‘도피’ 또는 ‘피할 길’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 힘을 강하게 하지 못하며.’ 문맥상 자기 힘을 내거나 발휘하지 못한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 נַפְשׁוֹ는 ‘영혼’이라기보다 ‘목숨’ 또는 ‘생명’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָבַד מָנוֹס
  english_pob_choice: Flight will perish
  chosen_korean: 도망이 사라지고
  alternatives_korean:
  - 피할 길이 사라지고
  - 도피가 사라지고
  lexicon: HALOT
  rationale: מָנוֹס는 ‘도망/피신할 길’의 뜻이므로, 문맥상 ‘도망’으로 옮겨 빠른 자에게서 가능한 탈출이 끊기는 이미지를 살렸습니다.
- source_word: מִ/קָּל
  english_pob_choice: from the swift
  chosen_korean: 빠른 자에게서
  alternatives_korean:
  - 민첩한 자에게서
  - 신속한 자에게서
  lexicon: HALOT
  rationale: מן의 출처·분리를 살려 ‘~에게서’로 옮겼고, 속도 특성을 나타내는 형용사는 자연스러운 한국어 관용에 따라 ‘빠른 자’로 처리했습니다.
- source_word: וְ/חָזָק לֹא יְאַמֵּץ כֹּח/וֹ
  english_pob_choice: the strong will not strengthen his power
  chosen_korean: 강한 자가 자기 힘을 강화하지 못하며
  alternatives_korean:
  - 강한 자가 자기 힘을 북돋우지 못하며
  - 강한 자가 자기 힘을 굳세게 하지 못하며
  lexicon: HALOT
  rationale: יְאַמֵּץ는 ‘강하게 하다/강화하다’의 뜻이므로, כוח와의 어근 대응을 살리기 위해 ‘힘을 강화하다’로 옮겼습니다. POB의 ‘power’는 문맥상 한국어에서는 ‘힘’이 가장 직접적입니다.
- source_word: וְ/גִבּוֹר לֹא יְמַלֵּט נַפְשׁ/וֹ
  english_pob_choice: and the warrior will not save his life
  chosen_korean: 용사가 자기 목숨을 구하지 못합니다
  alternatives_korean:
  - 용사가 자기 생명을 건지지 못합니다
  - 용사가 자기 영혼을 구하지 못합니다
  lexicon: HALOT
  rationale: נפש는 여기서 ‘영혼’이 아니라 생명/목숨을 가리키므로, 한국어에서는 자연스럽고 오해가 적은 ‘목숨’으로 옮겼습니다. גבור은 전투적·무력적 맥락에 따라 ‘용사’가 적절합니다.
theological_decisions:
- issue: נפש의 의미 범위
  chosen_reading: ‘자기 목숨’으로 옮겨, 본문의 뜻이 생명 보존의 실패를 말한다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘자기 영혼’으로 옮김
  - ‘자기 자신’을 뜻하는 포괄적 표현으로 옮김
  rationale: 예언 문맥에서 נפש는 종종 위험 속 생명 자체를 뜻하므로, 영혼으로 좁히면 현대 독자가 오해할 수 있습니다.
  doctrine_reference: 문맥 우선 원칙; נפש의 용법
