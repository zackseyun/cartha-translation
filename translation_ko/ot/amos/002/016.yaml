  naturalness: ‘전사들 가운데 용감한 자도’는 현대 표준 한국어에서 자연스럽고, 전쟁 맥락과 원문의 강조를 보존합니다. 직접 발화의 문장부호를 제거하고 예언 종결 공식을 독립 문장으로 처리하면 구조도 자연스럽습니다.
