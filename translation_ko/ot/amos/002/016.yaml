lexical_decisions:
- source_word: אַמִּיץ לִבּוֹ
  english_pob_choice: stouthearted
  chosen_korean: 심장이 강한 자
  alternatives_korean:
  - 용맹한 자
  - 마음이 강한 자
  - 담대한 자
  lexicon: HALOT
  rationale: 히브리어의 관용구인 ‘강한 마음/심장’이라는 뜻을 살리되, 한국어에서 자연스러운 표현으로 옮겼습니다. ‘stouthearted’의 복합적 뉘앙스를 반영하기 위해 단순한 ‘용감한’보다 내적 강인함을 드러냈습니다.
- source_word: בַּגִּבּוֹרִים
  english_pob_choice: among the warriors
  chosen_korean: 그 전사들 가운데에서도
  alternatives_korean:
  - 그 용사들 가운데서도
  - 강한 자들 가운데서도
  - 무사들 가운데서도
  lexicon: HALOT
  rationale: גִּבּוֹרִים는 전투적·무용의 맥락에서 ‘전사들’이 가장 자연스럽고 의미를 분명히 드러냅니다. 영어의 ‘warriors’와 대응시키되, 현대 한국어에서 지나치게 고어적인 표현은 피했습니다.
- source_word: עָרוֹם
  english_pob_choice: naked
  chosen_korean: 벌거벗은 채로
  alternatives_korean:
  - 나체로
  - 알몸으로
  - 벗은 채로
  lexicon: HALOT
  rationale: 히브리어의 직설적 의미인 ‘naked’를 그대로 살려 수치와 패배의 충격을 유지했습니다. ‘벌거벗은 채로’는 도망의 상황을 자연스럽게 표현합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  - 야훼의 신탁입니다
  lexicon: HALOT
  rationale: 예언서의 표준 종결 공식을 한국어로 옮기되, 본문에 직접 신적 화자를 드러내는 방식으로 처리했습니다. ‘말씀입니다’는 נְאֻם의 장중한 공문체적 종결을 보존합니다.
theological_decisions:
- issue: 예언 종결 공식의 화자 표지
  chosen_reading: ‘야훼의 말씀입니다’로 마무리해 예언자의 전달 문구와 야훼의 직접 발화를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 선언입니다’
  rationale: נְאֻם יְהוָה는 단순한 서술이 아니라 신적 권위를 띤 예언 공식입니다. 한국어에서도 그 공적·권위적 성격을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'POB divine name rendering policy: יְהוָה → 야훼'
