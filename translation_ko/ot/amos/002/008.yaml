  text: וְ/עַל בְּגָדִ֤ים חֲבֻלִים֙ יַטּ֔וּ אֵ֖צֶל כָּל מִזְבֵּ֑חַ וְ/יֵ֤ין עֲנוּשִׁים֙ יִשְׁתּ֔וּ בֵּ֖ית אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/008.yaml
  text: And on garments taken in pledge they stretch themselves out beside every altar[c][b][a], and in the house of their God they drink the wine of those they have fined.
  footnotes:
  - marker: a
    text: Or 'on pledged garments they lie down beside every altar.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the wine of those fined' or 'the wine of the punished.'
    reason: lexical_alternative
  - marker: c
    text: 'Some translate ''in the house of their god,'' but the Hebrew form is plural: ''their gods.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 담보로 잡힌 옷들 위에 모든 제단 곁에서 몸을 뻗고, 그들의 신의 집에서 벌금으로 얻은 포도주를 마십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘담보로 잡힌 옷들’은 ‘전당 잡힌 옷들’ 또는 ‘담보로 제공된 옷들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘벌금형을 받은 사람들의 포도주’ 또는 ‘벌받은 사람들의 포도주’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 형태는 복수입니다. ‘그들의 신들의 집’으로 이해하기도 하며, 문맥에 따라 ‘그들의 하나님’으로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגָדִים חֲבֻלִים
  english_pob_choice: garments taken in pledge
  chosen_korean: 전당 잡힌 옷
  alternatives_korean:
  - 저당 잡힌 옷
  - 담보로 잡힌 옷
  lexicon: HALOT
  rationale: חֲבֻלִים는 담보로 잡힌 상태를 가리키므로, 법적 의미를 살리되 한국어로 자연스러운 ‘전당 잡힌’으로 옮겼습니다.
- source_word: יַטּוּ
  english_pob_choice: they stretch themselves out
  chosen_korean: 몸을 뻗고
  alternatives_korean:
  - 누워 있고
  - 드러누우며
  lexicon: HALOT
  rationale: 단순한 ‘눕다’보다 무례하게 비스듬히 뻗는 동작을 드러내는 표현이므로, POB의 역동성을 살려 옮겼습니다.
- source_word: עֲנוּשִׁים
  english_pob_choice: of those they have fined
  chosen_korean: 벌금으로 거둔
  alternatives_korean:
  - 벌을 받은 자들의
  - 벌금 부과로 얻은
  lexicon: HALOT
  rationale: ‘벌금/과징금’의 경제적 착취를 드러내기 위해, 포도주가 부당한 벌금 징수에서 나온 것임을 한국어 관용에 맞게 압축했습니다.
- source_word: בֵּית אֱלֹהֵיהֶם
  english_pob_choice: in the house of their gods / their God
  chosen_korean: 자기들의 하나님 집에서
  alternatives_korean:
  - 자기들의 신의 집에서
  - 그들의 신들 집에서
  lexicon: HALOT
  rationale: 형태는 복수형이지만, 한국어에서는 ‘자기들의 하나님 집’이 원문이 겨냥한 불법적 제의 공간을 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: אֱלֹהֵיהֶם의 단수/복수 처리
  chosen_reading: 문맥상 ‘하나님’으로 표기하되, 소유격을 붙여 그들의 배교적 제의 공간임을 드러냈습니다.
  alternative_readings:
  - 그들의 신들
  - 그들의 신
  rationale: 히브리어 형태는 복수형이지만, 아모스의 예언적 고발은 우상적 예배 장소들을 겨냥합니다. 한국어 본문에서는 우상숭배의 성격을 명확히 하되, 각주 없이도 이해되도록 정리했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
