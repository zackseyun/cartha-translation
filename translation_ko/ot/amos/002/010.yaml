id: AMO.2.10
reference: Amos 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אוֹלֵ֨ךְ אֶתְ/כֶ֤ם בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה לָ/רֶ֖שֶׁת אֶת אֶ֥רֶץ הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/010.yaml
  text: Yet I brought you up from the land of Egypt[a], and I led you in the wilderness forty years, to take possession of the land of the Amorites.
  footnotes:
  - marker: a
    text: Or, 'the land of the Amorites.' The Hebrew uses the singular 'Amorite' as a collective term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 너희를 이집트 땅에서 이끌어 올라오게 했고, 광야에서 사십 년 동안 너희를 인도하여 아모리 사람들의 땅을 차지하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아모리 사람’이라는 집합적 단수형을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  english_pob_choice: Yet I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 하지만 나는
  lexicon: WLC
  rationale: 문맥상 이스라엘의 죄책을 고발하는 뒤에 하나님의 구원 행위가 대조되므로, 역접과 강조를 함께 살리는 ‘그러나 나는’이 가장 자연스럽습니다.
- source_word: הֶעֱלֵיתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: brought you up from the land of Egypt
  chosen_korean: 이집트 땅에서 올라오게 했고
  alternatives_korean:
  - 이집트 땅에서 끌어내었고
  - 이집트에서 너희를 데리고 나왔고
  lexicon: WLC
  rationale: ‘올라오게 하다’는 העלה의 상향 이동 뉘앙스를 살리면서 출애굽 관용구를 유지합니다. ‘땅’도 원문에 있어 함께 반영했습니다.
- source_word: וָאוֹלֵךְ אֶתְכֶם בַּמִּדְבָּר אַרְבָּעִים שָׁנָה
  english_pob_choice: I led you in the wilderness forty years
  chosen_korean: 광야에서 너희를 사십 년 동안 인도하여
  alternatives_korean:
  - 광야를 지나 사십 년 동안 인도하여
  - 광야에서 너희를 사십 년 동안 이끌어
  lexicon: WLC
  rationale: ‘인도하다’는 הלך의 사역적 의미를 자연스럽게 담으며, 광야 순례의 역사적 장면을 표준적으로 전달합니다.
- source_word: לָרֶשֶׁת אֶת אֶרֶץ הָאֱמֹרִי
  english_pob_choice: to take possession of the land of the Amorites
  chosen_korean: 아모리 사람의 땅을 차지하게 했습니다
  alternatives_korean:
  - 아모리 사람의 땅을 소유하게 했습니다
  - 아모리인의 땅을 상속받게 했습니다
  lexicon: WLC
  rationale: ירשׁ은 문맥상 단순 소유보다 점유·정복의 결과를 포함하므로 ‘차지하다’가 가장 직접적입니다. 히브리어 단수 집합 명사도 한국어에서는 복수적 집합 의미를 자연스럽게 풀어 ‘아모리 사람’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 구원 행위와 심판 선언의 대비
  chosen_reading: ‘그러나 나는’으로 시작해, 심판을 전제한 뒤에도 하나님이 먼저 행하신 구원을 강조했습니다.
  alternative_readings:
  - 단순한 연결인 ‘그리고 나는’
  - 완곡한 ‘그런데 나는’
  rationale: 아모스의 고발 논리에서 본절은 이스라엘의 반역을 무효화하는 하나님의 은혜로운 기억 환기입니다. 역접을 약하게 하면 수사적 긴장이 줄어듭니다.
  doctrine_reference: Amos prophetic rhetoric; translation philosophy §5
