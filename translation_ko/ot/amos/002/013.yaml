  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
  footnotes:
  - marker: a
    text: Or, 'I am weighing you down,' or 'I will press down beneath you.' The Hebrew verb can be understood as pressure/weight, and the verbal form allows either a present vivid announcement or imminent future sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am pressing down beneath you'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 내가 여러분 아래에서[b] 무게를 가하고 있습니다[a]. 곡식 단을 가득 실은 수레가 짓누르듯이 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무게를 가하고 있습니다’는 히브리어 동사의 압박·무게 감각을 살린 번역입니다. ‘짓누르고 있습니다’, ‘압박하고 있습니다’ 또는 문맥상 ‘짓누를 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분 아래에서’는 히브리어의 공간적 표현을 살린 번역입니다. 이 어려운 표현은 더 해석적으로 ‘여러분을 여러분 자리에서 짓누르고 있다’로 이해되기도 합니다.
    reason: lexical_alternative
