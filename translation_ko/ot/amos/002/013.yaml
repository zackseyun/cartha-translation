base_translation:
  language: en
  yaml_path: translation/ot/amos/002/013.yaml
  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
  footnotes:
  - marker: a
    text: Or, 'I am weighing you down,' or 'I will press down beneath you.' The Hebrew verb can be understood as pressure/weight, and the verbal form allows either a present vivid announcement or imminent future sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am pressing down beneath you'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 나는 여러분 아래를 짓누르고 있습니다. 마치 곡식 단으로 가득 찬 수레가 짓누를 때와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짓누르고 있습니다’는 히브리어 동사의 압박·무게 감각을 살린 번역입니다. ‘무겁게 하고 있습니다’ 또는 ‘누르고 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분 아래를’은 히브리어의 공간적 표현을 살린 번역입니다. 더 해석적으로는 ‘여러분을 여러분 자리에서 짓누르고 있습니다’로 이해할 수도 있습니다.
    reason: lexical_alternative
