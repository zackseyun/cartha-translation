theological_decisions:
- issue: 심판 선언의 현재적·임박한 시제감
  chosen_reading: ‘나는 ... 짓누르고 있습니다’로 현재 진행형을 써서, 경고가 이미 시작된 심판 선언처럼 들리게 했습니다.
  alternative_readings:
  - ‘나는 ... 짓누를 것입니다’
  - ‘나는 ... 짓누르고 있습니다’
  rationale: 히브리어 분사는 현재적 묘사와 임박한 미래 선언 둘 다 가능하므로, POB의 현재적 긴박감을 살린 읽기를 택했습니다.
  doctrine_reference: 예언서의 심판 선포 방식과 문맥상 긴급한 경고의 현재성
- issue: תַּחְתֵּיכֶם의 공간 이미지 유지
  chosen_reading: ‘여러분 아래를’로 두어, 하나님이 위에서 누르시는 이미지와 수레 비유의 압박감을 함께 드러냈습니다.
  alternative_readings:
  - ‘여러분 대신에’
  - ‘여러분 자리에서’
  rationale: 본문의 물리적 압박 이미지를 약화시키지 않기 위해, 의미를 해치지 않는 범위에서 공간 표현을 유지했습니다.
  doctrine_reference: 본문의 비유적 심판 이미지 보존
