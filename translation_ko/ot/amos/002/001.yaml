source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י מוֹאָ֔ב וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל שָׂרְפ֛/וֹ עַצְמ֥וֹת מֶֽלֶךְ אֱד֖וֹם לַ/שִּֽׂיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/001.yaml
  text: 'Thus says Yahweh: “For three transgressions of Moab[a], and for four, I will not revoke it[b], because he burned the bones of the king of Edom to lime.”'
  footnotes:
  - marker: a
    text: Or 'I will not turn it back,' that is, I will not reverse the announced judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'into lime' or 'to plaster'; the Hebrew refers to burning the bones so thoroughly that they were reduced to lime.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “모압의 세 가지 죄악과 네 가지 죄악 때문에, 나는 그것을 돌이키지 않겠습니다.[a] 모압이 에돔 왕의 뼈를 석회가 되도록 태웠기 때문입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 그것을 되돌리지 않겠습니다.’ 이는 선포된 심판을 거두거나 번복하지 않겠다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘석회로’ 또는 ‘회반죽으로.’ 히브리어는 뼈를 매우 철저히 태워 석회가 되게 한 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 선포 공식의 현재형을 살리면서, 본문에 직접 나온 신명은 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: פִּשְׁעֵי
  english_pob_choice: transgressions
  chosen_korean: 허물
  alternatives_korean:
  - 범죄
  - 죄과
  lexicon: HALOT
  rationale: פֶּשַׁע의 반역적·언약 위반적 성격을 한국어에서 가장 자연스럽게 드러낼 수 있어 ‘허물’을 택했습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not revoke it
  chosen_korean: 나는 그것을 돌이키지 않겠습니다
  alternatives_korean:
  - 나는 그것을 철회하지 않겠습니다
  - 나는 그것을 되돌리지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 기본 이미지인 ‘돌려 보내지 않다/되돌리지 않다’를 살리되, 선포된 심판을 되돌리지 않겠다는 뜻이 한국어로 분명하게 들리게 했습니다.
- source_word: לַשִּׂיד
  english_pob_choice: to lime
  chosen_korean: 석회로 만들었습니다
  alternatives_korean:
  - 석회가 되도록 만들었습니다
  - 플라스터로 만들었습니다
  lexicon: HALOT
  rationale: 히브리어는 뼈를 완전히 태워 석회 상태에 이르게 했다는 뜻이므로, ‘석회로 만들다’가 의도된 극심한 모독을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본 규범에 따라 ‘야훼’로 보존해 본문의 신학적 표지를 흐리지 않도록 했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 심판 선포문의 어조
  chosen_reading: 직접 인용문 안에서 단정적 미래·선언형으로 유지
  alternative_readings:
  - 완곡한 예고형
  - 설명적 평서형
  rationale: ‘나는 그것을 돌이키지 않겠습니다’는 심판 철회의 불가함을 드러내는 선언이며, 문맥상 신탁의 권위를 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: Amos judgment oracle register
