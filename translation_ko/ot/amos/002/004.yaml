revisions:
- from: 야훼께서 이렇게 말씀하십니다. “유다의 죄악이 세 가지요, 네 가지라도 나는 그것을 되돌리지 않겠습니다. 그들이 야훼의 율법을 거부하고 그의 규례를 지키지 않았으며, 그들의 거짓이 그들을 그들의 조상들이 따라가던 길로 이끌어 잘못 가게 했기 때문입니다.”[a][b][c]
  to: 야훼께서 이렇게 말씀하십니다. “유다의 죄악이 세 가지요 네 가지라도, 나는 그것을 되돌리지 않겠습니다.[a] 그들이 야훼의 율법[b]을 거부하고 그의 규례를 지키지 않았으며, 그들의 거짓[c]이 그들을 그릇되게 했고, 그 거짓을 따라 그들의 조상들이 걸었기 때문입니다.”
  rationale: 마지막 절을 히브리어의 관계절 구조에 맞추어, 조상들이 ‘그들의 거짓’을 따라 걸었다고 바로 표현했습니다. 심판 공식의 목적어가 명시되지 않은 점과 ‘거짓’의 의미 범위는 유지했습니다. 각주 표지는 해당 단어 및 표현 바로 뒤로 옮겼습니다.
