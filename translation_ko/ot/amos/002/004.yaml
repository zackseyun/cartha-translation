source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יְהוּדָ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל מָאֳסָ֞/ם אֶת תּוֹרַ֣ת יְהוָ֗ה וְ/חֻקָּי/ו֙ לֹ֣א שָׁמָ֔רוּ וַ/יַּתְעוּ/ם֙ כִּזְבֵי/הֶ֔ם אֲשֶׁר הָלְכ֥וּ אֲבוֹתָ֖/ם אַחֲרֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/004.yaml
  text: 'Thus says Yahweh: “For three transgressions of Judah[a], and for four, I will not turn it back, because they have rejected the law of Yahweh and have not kept his statutes; and their lies have led them astray[c][b], after which their fathers walked.”'
  footnotes:
  - marker: a
    text: Or 'I will not revoke it,' that is, the announced judgment or punishment.
    reason: lexical_alternative
  - marker: b
    text: '''The law of the LORD'' may also be rendered ''the instruction of the LORD.'''
    reason: lexical_alternative
  - marker: c
    text: '''Their lies'' may refer more specifically to false gods or idols—deceptive objects of worship followed by their ancestors.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “유다의 죄악이 세 가지요 네 가지라도, 나는 그것을 되돌리지 않겠습니다.[a] 그들이 야훼의 율법[b]을 거부하고 그의 규례를 지키지 않았으며, 그들의 거짓[c]이 그들을 그릇되게 했고, 그 거짓을 따라 그들의 조상들이 걸었기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 표현은 ‘심판’이나 ‘판결’을 돌이키지 않는다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 여기서 ‘야훼의 교훈’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들의 거짓’은 더 구체적으로는 우상이나 거짓 예배를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사를 보존하기 위해 POB의 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: לֹא אֲשִׁיבֶנּוּ
  english_pob_choice: I will not turn it back
  chosen_korean: 나는 그것을 되돌리지 않겠습니다
  alternatives_korean:
  - 나는 그것을 철회하지 않겠습니다
  - 나는 그것을 거두지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 관용구를 살려 ‘되돌리지 않겠습니다’로 옮겨, 심판/선언의 대상이 암시된 여지를 유지했습니다.
- source_word: תּוֹרַת יְהוָה
  english_pob_choice: the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 교훈
  - 야훼의 토라
  lexicon: HALOT
  rationale: 예언서의 언약적 법정맥락에서는 ‘율법’이 가장 자연스럽고, POB의 기본 용례와도 맞습니다.
- source_word: חֻקָּיו
  english_pob_choice: his statutes
  chosen_korean: 그의 규례
  alternatives_korean:
  - 그의 법도
  - 그의 명령
  lexicon: HALOT
  rationale: חֻקִּים은 규범적·법적 조항을 가리키므로, 한국어에서도 ‘규례’가 가장 안정적으로 대응합니다.
- source_word: כִּזְבֵיהֶם
  english_pob_choice: their lies
  chosen_korean: 그들의 거짓
  alternatives_korean:
  - 그들의 거짓말
  - 그들의 허망한 것들
  lexicon: HALOT
  rationale: 직역의 핵심을 살리되 현대 한국어에서 자연스럽게 들리도록 ‘거짓’으로 옮겼습니다. 본문이 직접 ‘우상’이라고 말하지는 않으므로 그 표현은 본문에 넣지 않았습니다.
theological_decisions:
- issue: 아모스의 반복된 심판 공식 לֹא אֲשִׁיבֶנּוּ의 처리
  chosen_reading: ‘되돌리지 않겠습니다’로 유지해, 무엇을 되돌리지 않는지의 함축을 남겼습니다.
  alternative_readings:
  - 그 벌을 거두지 않겠습니다
  - 그것을 철회하지 않겠습니다
  - 심판을 돌이키지 않겠습니다
  rationale: 히브리어는 짧고 의도적으로 여백이 있어, 대상이 명시되지 않은 긴장을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it.'
- issue: ‘그들의 거짓’의 의미 범위
  chosen_reading: 본문에는 ‘거짓’이라고 두고, 우상적 함의는 직접 확정하지 않았습니다.
  alternative_readings:
  - 그들의 우상
  - 그들의 거짓 신들
  rationale: 예언적 문맥에서 우상적 의미가 가능하지만, 히브리어는 본래 ‘거짓/허위’라고만 말하므로 본문 수준에서는 과잉해석을 피했습니다.
  doctrine_reference: 'Translation philosophy §1 and §3: original-language primacy; preserve ambiguity where genuine.'
