base_translation:
  language: en
  yaml_path: translation/ot/amos/002/005.yaml
  text: So I will send fire upon Judah[a], and it will devour the citadels of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'palaces' or 'strongholds' for 'citadels.' The Hebrew term can refer to fortified palatial buildings.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 유다에 불을 보내겠습니다. 그 불이 예루살렘의 성채들을 삼킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성채들’로 번역한 히브리어 אַרְמְנוֹת는 ‘궁전들’ 또는 ‘요새들’을 뜻할 수도 있으며, 방비를 갖춘 궁전 건물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: So I will send
  chosen_korean: 그러므로 내가 … 보내리니
  alternatives_korean:
  - 내가 … 보내겠습니다
  - 그리고 내가 … 보내리니
  lexicon: HALOT
  rationale: 히필 동사 שׁלח의 기본 의미인 ‘보내다’를 살리되, 접속사 וְ는 앞선 심판 선언과의 연결을 보여 주는 ‘그러므로’로 옮겨 인과적 뉘앙스를 드러냈습니다.
- source_word: אֵשׁ
  english_pob_choice: fire
  chosen_korean: 불
  alternatives_korean:
  - 화염
  - 불길
  lexicon: HALOT
  rationale: אֵשׁ은 기본적으로 ‘불’이며, 여기서는 심판 이미지로 쓰이지만 원문이 더 구체화하지 않으므로 자연스러운 기본어를 유지했습니다.
- source_word: בִּיהוּדָה
  english_pob_choice: upon Judah
  chosen_korean: 유다에
  alternatives_korean:
  - 유다 위에
  - 유다를 향해
  - 유다에게
  lexicon: HALOT
  rationale: ב의 방향성을 한국어에서 가장 무리 없이 살리는 표현으로 ‘유다에’를 택했습니다. 심판 맥락의 적대적 방향은 전체 문맥과 동사 ‘보내다’가 충분히 전달합니다.
- source_word: אַרְמְנוֹת
  english_pob_choice: the citadels
  chosen_korean: 보루들
  alternatives_korean:
  - 궁전들
  - 견고한 성채들
  - 요새들
  lexicon: HALOT
  rationale: אַרְמְנוֹת는 왕궁의 성격과 요새의 성격을 함께 가질 수 있지만, 이 절의 파괴 대상로서는 방어적 의미가 더 두드러지므로 ‘보루들’로 옮겼습니다.
- source_word: יְרוּשָׁלִָם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘성
  lexicon: HALOT
  rationale: 고유명사는 통용 표기인 ‘예루살렘’을 유지했습니다.
theological_decisions:
- issue: 불의 성격
  chosen_reading: 불을 직접적인 심판 선언으로 번역하되, 그 방식이 문자적 화재인지 침공을 통한 비유인지 특정하지 않았습니다.
  alternative_readings:
  - 문자적 화재로 한정
  - 전쟁 심판의 은유로 한정
  rationale: 예언 문구는 야훼의 심판을 분명히 말하지만, 본절만으로 그 집행 방식까지 확정하지 않으므로 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
