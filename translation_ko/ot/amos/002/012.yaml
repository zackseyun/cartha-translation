source:
  edition: WLC
  text: וַ/תַּשְׁק֥וּ אֶת הַ/נְּזִרִ֖ים יָ֑יִן וְ/עַל הַ/נְּבִיאִים֙ צִוִּיתֶ֣ם לֵ/אמֹ֔ר לֹ֖א תִּנָּבְאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/012.yaml
  text: But you made the Nazirites drink wine[a], and you commanded the prophets, saying[b], ‘Do not prophesy.’
  footnotes:
  - marker: a
    text: Or 'the consecrated ones.' Hebrew 'Nazirites' refers to those under a special vow of consecration, which included abstaining from wine.
    reason: lexical_alternative
  - marker: b
    text: Or 'Do not prophesy' / 'You shall not prophesy.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 당신들은 나지르인들에게 포도주를 마시게 하였고, 예언자들에게는 ‘예언하지 마십시오’ 하고 명령하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉헌된 사람들.’ 히브리어 ‘나지르인’은 포도주를 피하는 특별한 서원 아래 있는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예언하지 말라’ / ‘예언해서는 안 됩니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּשְׁקוּ
  english_pob_choice: you made ... drink
  chosen_korean: 마시게 하였고
  alternatives_korean:
  - 마시도록 하였고
  - 마시게 했고
  - 마시게 만들었고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 자연스러운 한국어로 옮기되, 강제성을 분명히 드러내기 위해 ‘마시게 하였고’로 렌더링했습니다.
- source_word: הַנְּזִרִים
  english_pob_choice: the Nazirites
  chosen_korean: 나지르인들에게
  alternatives_korean:
  - 나실인들에게
  - 봉헌된 사람들에게
  - 나지르 서원을 한 사람들에게
  lexicon: HALOT
  rationale: 특정한 서원 아래 있는 사람들을 가리키는 기술 용어이므로, 일반화하지 않고 음역형인 ‘나지르인’으로 보존했습니다.
- source_word: צִוִּיתֶם
  english_pob_choice: you commanded
  chosen_korean: 명령하였습니다
  alternatives_korean:
  - 명령했습니다
  - 지시하였습니다
  - 분부하였습니다
  lexicon: HALOT
  rationale: 금지의 내용을 강하게 규정하는 צוה의 힘을 살리기 위해 ‘명령하였습니다’를 택했습니다.
- source_word: לֹא תִּנָּבְאוּ
  english_pob_choice: Do not prophesy
  chosen_korean: 예언하지 마십시오
  alternatives_korean:
  - 예언하지 말라
  - 예언해서는 안 됩니다
  - 예언하지 말아라
  lexicon: HALOT
  rationale: 직접 화법의 금지 명령으로, 현대 표준어 합쇼체에 맞는 정중한 명령형 ‘-십시오’를 사용했습니다.
theological_decisions:
- issue: 나지르인의 정체성을 일반적 ‘봉헌된 사람’으로 완화할지 여부
  chosen_reading: 나지르인
  alternative_readings:
  - 봉헌된 사람
  - 나지르 서원자
  rationale: 본문은 여호와께 특별히 구별된 집단을 전제하므로, 기술적 명칭을 유지해야 죄의 성격이 흐려지지 않습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve covenantal specificity.'
- issue: 예언 금지의 직접성
  chosen_reading: ‘예언하지 마십시오’
  alternative_readings:
  - ‘예언하지 말라’
  - ‘예언하면 안 됩니다’
  rationale: 히브리어의 금지 발화를 직접인용으로 옮겨, 권력에 의한 예언 억압의 폭력을 분명하게 드러냅니다.
  doctrine_reference: 'Translation philosophy: maintain source force without softening the prohibition.'
