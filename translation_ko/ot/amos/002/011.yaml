id: AMO.2.11
reference: Amos 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אָקִ֤ים מִ/בְּנֵי/כֶם֙ לִ/נְבִיאִ֔ים וּ/מִ/בַּחוּרֵי/כֶ֖ם לִ/נְזִרִ֑ים הַ/אַ֥ף אֵֽין זֹ֛את בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/011.yaml
  text: And I raised up some of your sons to be prophets[a], and some of your young men to be Nazirites. Is this not so[b], O sons of Israel? declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'children of Israel' or 'people of Israel.' The Hebrew is literally 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Nazirites'' refers to those specially consecrated to God under a Nazirite vow; alternatively, ''consecrated ones.'''
    reason: cultural_note
translation:
  language: ko
  text: 내가 너희 아들들 가운데서 선지자들을 일으켰고, 너희 젊은이들 가운데서 나실인들을 일으켰습니다. 이 일이 사실이 아니겠습니까, 이스라엘의 아들들아? 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나실인’은 하나님께 특별히 구별된 사람들을 가리키는 기술어입니다. 더 풀어 쓰면 ‘서원으로 구별된 사람들’ 정도로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָקִים
  english_pob_choice: And I raised up
  chosen_korean: 일으켰고
  alternatives_korean:
  - 세웠고
  - 일으켜 세웠고
  lexicon: HALOT
  rationale: 히필형 קום은 ‘일으키다, 세우다’의 뜻이므로, 하나님이 사람들을 소명과 직분으로 세우신 행위를 자연스럽게 드러내는 ‘일으키다’를 택했습니다.
- source_word: מִבְּנֵיכֶם / לִנְבִיאִים
  english_pob_choice: some of your sons to be prophets
  chosen_korean: 너희 아들들 가운데서 선지자들을
  alternatives_korean:
  - 너희 아들들 중에서 선지자들을
  - 너희 아들들로 선지자들이 되게
  lexicon: HALOT
  rationale: מִן의 분리·부분적 의미를 ‘가운데서’로 살리고, 역할 목적을 한국어에서는 직접적으로 ‘선지자들’로 옮겨 소명 부여의 뉘앙스를 유지했습니다.
- source_word: וּמִבַּחוּרֵיכֶם / לִנְזִרִים
  english_pob_choice: and some of your young men to be Nazirites
  chosen_korean: 너희 젊은이들 가운데서 나실인들을 일으켰습니다
  alternatives_korean:
  - 너희 젊은이들 가운데서 나실인들로
  - 너희 젊은이들 중 일부를 나실인으로 세웠습니다
  lexicon: HALOT
  rationale: בָּחוּר는 문맥상 ‘젊은이들, 젊은 남자들’을 뜻하며, נָזִיר는 특정한 성별 구분보다 봉헌된 신분을 가리키는 기술어이므로, POB의 기술어를 따라 ‘나실인’으로 유지했습니다.
- source_word: הַאַף אֵין זֹאת
  english_pob_choice: Is this not so
  chosen_korean: 이 일이 사실이 아니겠습니까
  alternatives_korean:
  - 그렇지 않습니까
  - 이것이 사실이 아니겠습니까
  lexicon: HALOT
  rationale: 수사적 질문으로서 동의를 요구하는 표현이므로, 한국어에서 자연스럽고 단정적인 반문형으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: O sons of Israel
  chosen_korean: 이스라엘의 아들들아
  alternatives_korean:
  - 이스라엘 자손들아
  - 이스라엘의 백성들아
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 호격을 그대로 살려 covenantal address를 보존했습니다. 한국어에서는 호격 어미 ‘-아’로 직접 호소하는 형식을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: נְאֻם은 예언자적 선언 공식을 이루므로, 현대 한국어의 공적 종결로 ‘말씀입니다’를 택해 선언적 권위를 살렸습니다. 다만 직역의 경직함을 피하면서도 신적 발화의 무게를 유지했습니다.
theological_decisions:
- issue: 예언자적 선언 공식의 한국어 종결 형식
  chosen_reading: ‘야훼의 말씀입니다’로 마무리
  alternative_readings:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  rationale: 히브리어 נְאֻם은 단순 화행 동사가 아니라 예언서의 권위 있는 선언 표지이므로, 합쇼체 안에서 선언의 무게를 유지하는 종결을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, prophetic speech conventions
- issue: 보편화보다 남성 표지 유지 여부
  chosen_reading: ‘이스라엘의 아들들아’ 유지
  alternative_readings:
  - 이스라엘 백성들아
  - 이스라엘 자손들아
  rationale: 본문은 남성 복수 호칭을 직접 사용하므로, 이를 중성화하면 원문의 호칭 구조가 흐려집니다. 문맥상 민족 전체를 가리키더라도 표지 자체는 보존하는 편이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
