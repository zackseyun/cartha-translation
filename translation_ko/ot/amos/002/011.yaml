    rationale: בְּנֵי יִשְׂרָאֵל의 직역 및 대안 번역을 설명하는 각주를 호격 표현에 연결해 감사 기록과 의미를 보존해야 합니다.
  - severity: low
    issue: ‘이스라엘의 아들들아’ 및 ‘젊은이들’은 각각 다소 직역적이거나 성별 정보가 약합니다.
    rationale: ‘이스라엘 자손들아’와 ‘젊은 남자들’이 현대 한국어의 자연스러움 및 히브리어의 남성 표지를 더 잘 반영합니다.
