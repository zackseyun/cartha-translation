    issue: יהוה를 ‘주님’으로 번역함
    rationale: 원문은 고유 신명 יהוה이고, 제공된 영어 POB의 확정 선택도 ‘Yahweh’입니다. ‘주님’은 이를 칭호로 대체합니다.
  - severity: high
    issue: ‘침상 덮개’ 및 ‘…만 남은 채’라는 해석적 첨가
    rationale: בִדְמֶשֶׁק עָרֶשׂ의 마소라 본문은 ‘다메섹’으로 읽히며, ‘덮개’는 본문이 확정하지 않는 해석입니다. 또한 ‘만 남은 채’는 제한의 의미를 비유 전체에서 추론하여 문장에 첨가한 것입니다.
  - severity: medium
    issue: 난해 구절 각주의 표제어와 본문이 불일치함
    rationale: 각주는 ‘침상의 다메섹’을 설명하지만 본문은 ‘침상 덮개’로 바꾸어, 독자가 본문과 원문의 관계를 확인하기 어렵습니다.
  - severity: low
