revisions:
- from: 주님께서 이렇게 말씀하십니다. 「목자가 사자의 입에서 두 다리나 귀 조각 하나를 건져 내는 것처럼, 사마리아에 사는 이스라엘 자손도 침상 모퉁이와 침상 덮개만 남은 채 건져질 것입니다」.[a][b]
  to: 야훼께서 이렇게 말씀하십니다. “목자가 사자의 입에서 두 다리나 귀 한 조각을 건져 내는 것처럼, 사마리아에 살면서 침상 한 모퉁이와 다메섹의 긴의자에 앉아 있는 이스라엘 자손도 건져질 것입니다.”[a][b]
  rationale: 원문 우선 원칙에 따라 יהוה를 ‘야훼’로 회복했습니다. 마지막 난해 구절은 마소라 본문의 ‘다메섹’을 본문에서 보존하되, 문맥상 이스라엘 자손의 사치스러운 휴식 처소를 가리키는 수식 관계를 한국어로 자연스럽게 드러냈습니다. ‘침상 덮개’와 ‘만 남은 채’처럼 원문이 명시하지 않는 해석적 보충은 제거했고, 대안적 이해는 각주로 제한했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:43Z'
review_pass:
  verdict: revise
  source_fidelity: ‘주님’은 원문의 고유 신명 יהוה 및 영어 POB의 ‘Yahweh’를 일반 칭호로 바꾸므로 ‘야훼’로 옮기는 것이 적절합니다. 또한 현 본문의 ‘침상 덮개’와 ‘…만 남은 채’는 히브리어의 난해한 마지막 구절을 특정 해석으로 확정하고, ‘만 남은 채’라는 제한을 첨가합니다. 마소라 본문의 ‘다메섹’을 본문에 보존하고 난해성은 각주에서 설명해야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 예언자적 문체를 유지하면서, ‘사마리아에 살면서’ 이하가 이스라엘 자손을 수식하도록 문장 관계를 분명히 합니다. ‘두 다리나 귀 한 조각’은 자연스럽고 원문의 참혹한 잔해 이미지를 보존합니다.
  terminology: יהוה는 ‘야훼’, בְּנֵי יִשְׂרָאֵל은 관용적 집단 명칭인 ‘이스라엘 자손’, יַצִּיל/יִנָּצְלוּ는 연결성을 살려 ‘건져 내다/건져지다’로 통일했습니다. 마지막 עָרֶשׂ은 앞의 מִטָּה와 구별하여 ‘긴의자’로 옮겼으며, ‘다메섹’ 해석의 불확실성은 각주에 남겼습니다.
  issues:
