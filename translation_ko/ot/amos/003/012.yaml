source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ כַּ/אֲשֶׁר֩ יַצִּ֨יל הָ/רֹעֶ֜ה מִ/פִּ֧י הָ/אֲרִ֛י שְׁתֵּ֥י כְרָעַ֖יִם א֣וֹ בְדַל אֹ֑זֶן כֵּ֣ן יִנָּצְל֞וּ בְּנֵ֣י יִשְׂרָאֵ֗ל הַ/יֹּֽשְׁבִים֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/פְאַ֥ת מִטָּ֖ה וּ/בִ/דְמֶ֥שֶׁק עָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/012.yaml
  text: 'Thus says Yahweh: As the shepherd rescues from the mouth of the lion two legs or a piece of an ear[b][a], so will the sons of Israel who dwell in Samaria be rescued—with the corner of a bed and the cover of a couch.'
  footnotes:
  - marker: a
    text: Or 'the Israelites.' Hebrew 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase is difficult. Hebrew reads literally 'with the corner of a bed and the couch of Damascus.' It may refer to luxurious furniture, or possibly 'a damask couch,' or 'a couch in Damascus.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “목자가 사자의 입에서 두 다리나 귀 한 조각을 건져 내는 것처럼, 사마리아에 살면서 침상 한 모퉁이와 다메섹의 긴의자에 앉아 있는 이스라엘 자손도 건져질 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 자손’입니다. ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 표현은 난해합니다. 히브리어는 문자적으로 ‘침상 한 모퉁이와 다메섹의 긴의자’로 읽힙니다. 사치스러운 가구를 가리킬 수 있으며, ‘다마스크 천을 씌운 긴의자’ 또는 ‘다메섹에 있는 긴의자’로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 본절의 선지자적 공식을 한국어 합쇼체 서술로 자연스럽게 옮기기 위해 본문에는 ‘주님’을 두었습니다. 다만 본문의 히브리어 מקור은 야훼이며, 개역적 관습어를 무비판적으로 따르지 않도록 주의했습니다.
- source_word: כַּאֲשֶׁר ... כֵּן
  english_pob_choice: As ... so
  chosen_korean: ~처럼 ... ~도
  alternatives_korean:
  - ~하듯이 ... ~도
  - ~과 같이 ... ~도
  lexicon: HALOT
  rationale: 히브리어의 대응 구조를 한국어에서도 분명히 드러내기 위해 ‘~처럼 ... ~도’로 살렸습니다.
- source_word: שְׁתֵּי כְרָעַיִם / בְדַל אֹזֶן
  english_pob_choice: two legs / a piece of an ear
  chosen_korean: 두 다리나 귀 조각 하나
  alternatives_korean:
  - 두 다리와 귀 조각 하나
  - 두 정강이와 귀 조각 하나
  lexicon: HALOT
  rationale: 사자에게서 건져 낸 아주 적은 잔해라는 이미지가 핵심이므로, 문자적인 ‘다리’와 ‘귀 조각’의 생생함을 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 관용적 집단 명칭을 보존하면서도 한국어에서 자연스러운 성경어로 옮겼습니다.
- source_word: בִּפְאַת מִטָּה וּבִדְמֶשֶׁק עָרֶשׂ
  english_pob_choice: the corner of a bed and the cover of a couch
  chosen_korean: 침상 모퉁이와 침상 덮개
  alternatives_korean:
  - 침상의 모퉁이와 다메섹의 침상
  - 침대 모퉁이와 침상 덮개
  lexicon: HALOT
  rationale: 마지막 구절은 본문상 난해하므로, 지리명으로 단정하지 않고 사치스러운 침상 용품의 이미지가 드러나도록 가장 보수적으로 옮겼습니다.
theological_decisions:
- issue: 사마리아의 구원이 긍정적 회복인지, 매우 제한된 생존인지
  chosen_reading: 극도로 제한된 구원, 곧 심판 뒤에 남는 잔해의 이미지로 유지했습니다.
  alternative_readings:
  - 보다 일반적인 ‘구출’의 의미로 완화하는 읽기
  rationale: 사자가 물어뜯은 뒤 겨우 다리와 귀 조각만 건지는 비유이므로, 본문은 구원의 풍성함이 아니라 극히 적은 생존을 말합니다. 이 긴장을 약화시키지 않았습니다.
  doctrine_reference: 예언 문맥의 심판-잔존 긴장 보존
- issue: 난해한 마지막 표현을 해석으로 확정할지 여부
  chosen_reading: 본문의 난해함을 본문 안에서는 최소한으로 처리하고, 결론적 해석은 피했습니다.
  alternative_readings:
  - ‘다메섹의 침상’으로 읽기
  - ‘다마스크 천의 침상’으로 읽기
  rationale: 의미가 불확실한 부분을 번역자가 단정해 버리면 원문 투명성이 손상됩니다. 그래서 한국어 본문은 자연스럽게 읽히되, 과도한 추정을 피했습니다.
  doctrine_reference: 원문 우선, 불확실성 보존
