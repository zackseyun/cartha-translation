id: AMO.3.6
reference: Amos 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יִתָּקַ֤ע שׁוֹפָר֙ בְּ/עִ֔יר וְ/עָ֖ם לֹ֣א יֶחֱרָ֑דוּ אִם תִּהְיֶ֤ה רָעָה֙ בְּ/עִ֔יר וַ/יהוָ֖ה לֹ֥א עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/006.yaml
  text: If a trumpet is blown in a city[a], do not the people tremble? If disaster happens in a city, has not Yahweh done it?
  footnotes:
  - marker: a
    text: Or 'calamity.' The Hebrew word can also be rendered 'evil,' but here it refers to disaster or judgment, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 나팔이 한 성읍에서 울려도 백성이 떨지 않겠습니까? 성읍에 재앙이 일어나는데 야훼께서 행하지 않으셨겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재난.’ 히브리어는 ‘악’으로도 번역될 수 있으나, 여기서는 도덕적 악이 아니라 재앙이나 심판을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַ֤ע שׁוֹפָר֙
  english_pob_choice: a trumpet is blown
  chosen_korean: 나팔이 울리다
  alternatives_korean:
  - 나팔이 불리다
  - 뿔나팔이 울리다
  - 나팔이 연주되다
  lexicon: HALOT
  rationale: שׁוֹפָר는 경고 신호로 쓰이는 나팔/뿔나팔이며, 한국어에서는 공개 경보의 울림을 살리는 ‘울리다’가 자연스럽고 수동적 상황도 잘 드러냅니다.
- source_word: בְּ/עִיר
  english_pob_choice: in a city
  chosen_korean: 한 성읍에서
  alternatives_korean:
  - 성읍에서
  - 도시에서
  - 그 성읍에서
  lexicon: HALOT
  rationale: עִיר는 일반적인 성읍/도시를 가리키며, 반복되는 장면의 관용성을 살리기 위해 특정성을 과도하게 높이지 않는 ‘한 성읍에서’를 택했습니다.
- source_word: וְ/עָ֖ם לֹ֣א יֶחֱרָד֑וּ
  english_pob_choice: do not the people tremble?
  chosen_korean: 백성이 떨지 않겠습니까?
  alternatives_korean:
  - 사람들이 떨지 않겠습니까?
  - 그 백성이 떨지 않겠습니까?
  - 백성이 두려워하지 않겠습니까?
  lexicon: HALOT
  rationale: חרד는 두려움으로 몸서리치듯 떨다의 뜻이 있어, 단순한 감정보다 신체적 반응까지 살리는 ‘떨다’가 더 가깝습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 환난
  - 악
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 ‘악’이 아니라 심판적 해악/재앙을 뜻하므로, 하나님의 행위를 도덕적 악으로 오해하지 않게 하는 ‘재앙’이 적절합니다.
- source_word: וַ/יהוָ֖ה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 주
  lexicon: HALOT
  rationale: 본문의 신명기적 성호 יהוה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 별도의 해설 없이도 원문 고유명사를 드러냅니다.
- source_word: עָשָׂה
  english_pob_choice: done it
  chosen_korean: 행하지 않으셨겠습니까
  alternatives_korean:
  - 하셨겠습니까
  - 만드셨겠습니까
  - 일으키지 않으셨겠습니까
  lexicon: HALOT
  rationale: עשה는 넓게 ‘하다/행하다/만들다’의 뜻이므로, 재앙의 직접적 행위 주체성을 흐리지 않으면서도 한국어 문맥에 자연스러운 ‘행하다’를 선택했습니다.
theological_decisions:
- issue: 여호와의 재앙에 대한 직접적 귀속
  chosen_reading: ‘야훼께서 행하지 않으셨겠습니까?’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘야훼께서 일으키지 않으셨겠습니까?’
  - ‘야훼께서 그것을 가져오지 않으셨겠습니까?’
  rationale: 히브리어는 성읍의 재앙을 야훼의 행위로 직접 묻고 있으므로, 이를 완화하지 않고 보존해야 본문의 예언적 긴장과 하나님의 주권이 드러납니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
