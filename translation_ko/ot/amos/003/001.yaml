  yaml_path: translation/ot/amos/003/001.yaml
  text: 'Hear this word that Yahweh has spoken against you[a], sons of Israel, against the whole family that I brought up from the land of Egypt, saying:'
  footnotes:
  - marker: a
    text: Or 'children of Israel' or 'people of Israel.' The Hebrew reads 'sons of Israel,' preserving the familial covenant idiom.
