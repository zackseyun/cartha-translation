translation:
  language: ko
  text: '이스라엘 자손들아[a], 야훼께서 너희를 거슬러, 이집트 땅에서 내가 이끌어 올린 온 가족을 거슬러 하신 이 말씀을 들으십시오:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손들’은 히브리어의 직역에 가깝습니다. ‘이스라엘의 자녀들’ 또는 ‘이스라엘 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들으세요
  lexicon: HALOT
  rationale: 예언적 공개 호소의 명령형으로, 합쇼체에서 격식과 긴박함을 함께 살리기 위해 ‘들으십시오’를 택했습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this word
  chosen_korean: 이 말
  alternatives_korean:
  - 이 말씀
  - 이 말씀을
  lexicon: HALOT
  rationale: 예언 문맥의 דבר를 한국어에서 가장 직접적으로 전달하는 ‘말’로 옮겨, 하나님의 발화라는 점은 다음 절과 연결되도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유신명 יְהוָה를 직역적 관례에 따라 ‘야훼’로 옮겨, 본문의 언약적 이름을 제목어 ‘주’로 바꾸지 않았습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 관용구를 유지하면서도 한국어에서 가장 자연스럽고 통용되는 성경적 표현으로 옮겼습니다.
- source_word: הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: I brought up from the land of Egypt
  chosen_korean: 이집트 땅에서 내가 올라오게 한
  alternatives_korean:
  - 이집트 땅에서 내가 데리고 올라온
  - 이집트 땅에서 내가 인도하여 올린
  lexicon: HALOT
  rationale: עלה의 ‘올라오게 하다’라는 상향 이동 이미지를 살리면서 출애굽을 상기시키는 원문 관용을 보존했습니다.
theological_decisions:
- issue: 예언적 심판 발화의 방향성
  chosen_reading: ‘너희에게’와 ‘온 가족을 두고’의 중첩으로 경고의 대상을 분명히 했습니다.
  alternative_readings:
  - ‘너희에 관하여’
  - ‘너희를 향하여’
  rationale: עֲלֵיכֶם/עַל의 대립·법정적 뉘앙스가 단순한 ‘관하여’보다 강하므로, 대상 지정과 경고성을 함께 드러내는 방식이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: Amos의 언약 소송(covenant lawsuit) 맥락
- issue: 이스라엘 정체성의 호칭
  chosen_reading: ‘이스라엘 자손들’로 유지했습니다.
  alternative_readings:
  - ‘이스라엘 백성’
  - ‘이스라엘의 자녀들’
  rationale: 성별-정확성 원칙을 유지해 בְּנֵי의 남성 복수 형식을 지우지 않으면서, 공동체적·언약적 호칭으로 기능하도록 했습니다.
  doctrine_reference: Translation philosophy §4 (Gender-accurate over gender-neutral)
