id: AMO.3.15
reference: Amos 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִכֵּיתִ֥י בֵית הַ/חֹ֖רֶף עַל בֵּ֣ית הַ/קָּ֑יִץ וְ/אָבְד֞וּ בָּתֵּ֣י הַ/שֵּׁ֗ן וְ/סָפ֛וּ בָּתִּ֥ים רַבִּ֖ים נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the houses adorned with ivory'—likely luxurious houses decorated with ivory inlay rather than houses literally built of ivory.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 겨울 집을 여름 집과 함께 치고, 상아로 된 집들이 무너지고, 많은 집들이 끝장날 것이다.” 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 정확히는 ‘상아로 장식된 집들’일 가능성이 있습니다. 실제로 상아 자체로 지은 집이라기보다 상아 상감 장식이 된 호화 주택을 가리키는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכֵּיתִי
  english_pob_choice: And I will strike
  chosen_korean: 내가 … 치고
  alternatives_korean:
  - 내가 … 치며
  - 내가 … 치겠다
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/치기’의 강한 심판 뉘앙스를 살리되, 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: בֵית הַחֹרֶף / בֵית הַקָּיִץ
  english_pob_choice: the winter house / the summer house
  chosen_korean: 겨울 집 / 여름 집
  alternatives_korean:
  - 겨울 별장 / 여름 별장
  - 겨울 거처 / 여름 거처
  lexicon: HALOT
  rationale: 계절별 거주지를 가리키는 병렬 구조를 그대로 살려, 사회경제적 대비가 드러나도록 직역에 가깝게 유지했습니다.
- source_word: בָּתֵּי הַשֵּׁן
  english_pob_choice: the houses of ivory
  chosen_korean: 상아로 된 집들
  alternatives_korean:
  - 상아 집들
  - 상아 장식의 집들
  lexicon: HALOT
  rationale: 문자적으로는 ‘상아의 집들’이지만, 문맥상 상아로 장식된 호화로운 집들을 가리킬 가능성이 높아 한국어에서는 자연스럽게 풀어 옮겼습니다.
- source_word: וְסָפוּ בָּתִּים רַבִּים
  english_pob_choice: and many houses will come to an end
  chosen_korean: 많은 집들이 끝장날 것이다
  alternatives_korean:
  - 많은 집들이 끝날 것이다
  - 수많은 집들이 사라질 것이다
  lexicon: HALOT
  rationale: סוף의 ‘끝나다/종결되다’ 의미와 רַבִּים의 양적 표현을 살려, 심판의 종국성을 분명하게 전달했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식의 마무리를 현대 한국어의 정형적 종결 표현으로 옮기면서, 신명기적 고유명사 יְהוָה는 ‘야훼’로 반영했습니다.
theological_decisions:
- issue: 예언 종결 공식의 화자 표지
  chosen_reading: ‘야훼의 말씀입니다’로 마무리하여 직접 신탁 형식을 드러냈습니다.
  alternative_readings:
  - ‘주님의 말씀입니다’
  - ‘야훼께서 말씀하십니다’
  rationale: 본문의 נְאֻם יְהוָה는 단순한 서술이 아니라 예언 신탁의 권위를 표시하는 공식이므로, 한국어에서도 그 기능을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
