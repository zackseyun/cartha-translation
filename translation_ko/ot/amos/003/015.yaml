  source_fidelity: ‘상아로 된 집들’은 집의 재료가 상아라는 뜻으로 좁혀져 히브리어 בָּתֵּי הַשֵּׁן(직역하면 ‘상아의 집들’)이 지닌 표현상의 여지를 보존하지 못합니다. 또한 וְאָבְדוּ의 소멸 의미는 ‘무너지다’보다 ‘없어지다’가 더 직접적으로 반영합니다. 나머지 계절 집의 병렬, רַבִּים의 양적 의미, 야훼 이름의 표기는 적절합니다.
  naturalness: 원문의 직접 신탁과 현대 표준어 합쇼체를 일관되게 드러내도록 ‘치겠습니다/것입니다’ 형식으로 다듬었습니다. ‘끝장나다’는 다소 구어적이고 강한 표현이므로 예언적·격식적 문맥에서는 ‘끝나게 될 것입니다’가 더 자연스럽습니다.
  terminology: יהוה는 방침에 따라 ‘야훼’로 유지했습니다. ‘상아의 집들’은 다소 낯설 수 있으나 원문의 문자적 표현과 해석상 불확실성을 보존하며, 각주가 ‘상아로 장식된 집들’이라는 유력한 이해를 설명합니다.
