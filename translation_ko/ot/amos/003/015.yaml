  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the houses adorned with ivory'—likely luxurious houses decorated with ivory inlay rather than houses literally built of ivory.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 겨울 집을 여름 집과 함께 치겠습니다. 상아의 집들은 없어지고, 많은 집들은 끝나게 될 것입니다.” 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 명시적으로는 ‘상아로 장식된 집들’로 옮길 수 있습니다. 상아 자체로 지은 집이라기보다 상아 상감 등으로 장식한 호화 주택을 가리킬 가능성이 높습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכֵּיתִי
  english_pob_choice: And I will strike
  chosen_korean: 내가 … 치고
  alternatives_korean:
  - 내가 … 치며
  - 내가 … 치겠다
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/치기’의 강한 심판 뉘앙스를 살리되, 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: בֵית הַחֹרֶף / בֵית הַקָּיִץ
  english_pob_choice: the winter house / the summer house
  chosen_korean: 겨울 집 / 여름 집
  alternatives_korean:
