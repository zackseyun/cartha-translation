  - 겨울 거처 / 여름 거처
  lexicon: HALOT
  rationale: 계절별 거주지를 가리키는 병렬 구조를 그대로 살려, 사회경제적 대비가 드러나도록 직역에 가깝게 유지했습니다.
- source_word: בָּתֵּי הַשֵּׁן
  english_pob_choice: the houses of ivory
  chosen_korean: 상아로 된 집들
  alternatives_korean:
  - 상아 집들
  - 상아 장식의 집들
  lexicon: HALOT
  rationale: 문자적으로는 ‘상아의 집들’이지만, 문맥상 상아로 장식된 호화로운 집들을 가리킬 가능성이 높아 한국어에서는 자연스럽게 풀어 옮겼습니다.
- source_word: וְסָפוּ בָּתִּים רַבִּים
  english_pob_choice: and many houses will come to an end
  chosen_korean: 많은 집들이 끝장날 것이다
  alternatives_korean:
  - 많은 집들이 끝날 것이다
  - 수많은 집들이 사라질 것이다
  lexicon: HALOT
  rationale: סוף의 ‘끝나다/종결되다’ 의미와 רַבִּים의 양적 표현을 살려, 심판의 종국성을 분명하게 전달했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식의 마무리를 현대 한국어의 정형적 종결 표현으로 옮기면서, 신명기적 고유명사 יְהוָה는 ‘야훼’로 반영했습니다.
theological_decisions:
- issue: 예언 종결 공식의 화자 표지
  chosen_reading: ‘야훼의 말씀입니다’로 마무리하여 직접 신탁 형식을 드러냈습니다.
  alternative_readings:
