source:
  edition: WLC
  text: הֲ/תִפֹּ֤ל צִפּוֹר֙ עַל פַּ֣ח הָ/אָ֔רֶץ וּ/מוֹקֵ֖שׁ אֵ֣ין לָ֑/הּ הֲ/יַֽעֲלֶה פַּח֙ מִן הָ֣/אֲדָמָ֔ה וְ/לָכ֖וֹד לֹ֥א יִלְכּֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/005.yaml
  text: Does a bird fall into a trap on the ground when there is no snare for it? Does a trap spring up from the ground when it has caught nothing at all?[a][b]
  footnotes:
  - marker: a
    text: Or 'when there is no bait/trigger for it'; the Hebrew term behind 'snare' can refer more specifically to what lures or activates the trap.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and to catch it does not catch,' an emphatic Hebrew construction meaning 'it certainly catches nothing' or 'without catching anything.'
    reason: lexical_alternative
translation:
  language: ko
  text: 새가 땅의 덫에 걸려 떨어지는데, 그것을 위한 그물덫이 없겠습니까? 덫이 땅에서 솟아오르는데, 아무것도 잡지 않고서야 그러겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מוֹקֵשׁ은 여기서 ‘그물덫’처럼 덫을 유인하거나 작동시키는 장치를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘잡고 또 잡다’라는 강조형 표현으로, 의미상 ‘아무것도 잡지 않는다’ 또는 ‘전혀 잡지 못한다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִפֹּל צִפּוֹר
  english_pob_choice: Does a bird fall
  chosen_korean: 새가 … 떨어지는데
  alternatives_korean:
  - 새가 … 빠지는데
  - 새가 … 걸려드는데
  lexicon: HALOT
  rationale: נפל의 기본 뜻인 ‘떨어지다’를 살리면서, 짧은 비유 문맥에서 한국어로 자연스럽게 읽히도록 했습니다. ‘걸려들다’는 결과를 풀어쓴 해석이라 본문에는 두지 않았습니다.
- source_word: פַּח הָאָרֶץ / מוֹקֵשׁ
  english_pob_choice: trap on the ground / snare
  chosen_korean: 땅의 덫 / 그물덫
  alternatives_korean:
  - 땅의 함정 / 올가미
  - 땅의 덫 / 덫의 방아쇠
  lexicon: HALOT
  rationale: פַּח은 일반적인 ‘덫’으로, מוֹקֵשׁ은 덫을 작동시키거나 유인하는 요소까지 포함할 수 있어 ‘그물덫’으로 옮겨 구별을 살렸습니다. 영어 주석의 lexical alternative를 반영해, 보다 좁은 ‘방아쇠’ 해석은 본문보다 주석적 대안으로 남겼습니다.
- source_word: הֲיַעֲלֶה פַּח מִן הָאֲדָמָה
  english_pob_choice: Does a trap spring up from the ground
  chosen_korean: 덫이 땅에서 솟아오르는데
  alternatives_korean:
  - 덫이 땅에서 올라오는데
  - 덫이 흙에서 솟는데
  lexicon: HALOT
  rationale: עלה의 ‘올라가다/솟다’라는 동작을 유지하면서, 덫이 아래에서 갑자기 작동하는 장면을 한국어로 생생하게 드러내기 위해 ‘솟아오르다’를 택했습니다.
- source_word: וְלָכוֹד לֹא יִלְכּוֹד
  english_pob_choice: when it has caught nothing at all
  chosen_korean: 아무것도 잡지 않고서야 그러겠습니까
  alternatives_korean:
  - 전혀 잡지 않고서야 그러겠습니까
  - 무엇 하나도 잡지 못하고서야 그러겠습니까
  lexicon: HALOT
  rationale: 히브리어의 강조형 구성(‘잡고 또 잡다’)을 한국어의 반문으로 옮겨, ‘아무것도 잡지 않다’라는 강한 부정을 살렸습니다. 본문 자체가 수사적 질문이므로 자연스러운 종결형으로 다듬었습니다.
theological_decisions:
- issue: 두 개의 반문을 통한 지혜문학적 수사 유지
  chosen_reading: 본절은 답을 요구하는 반문으로 처리해, 하나님의 심판 메시지를 예고하는 논증의 긴장감을 유지했습니다.
  alternative_readings:
  - 직설문으로 평서화하기
  - ‘당연히 그렇지 않다’처럼 해설적으로 풀기
  rationale: 아모스 3장 문맥에서 이 구절은 다음 절의 결론을 향한 연속된 반문입니다. 평서문으로 바꾸면 논증의 압박감과 청중을 향한 호소력이 약해집니다.
  doctrine_reference: 아모스 3:3-8의 예언적 논증 구조
- issue: 덫/그물덫의 구별을 통한 이미지 보존
  chosen_reading: פַּח과 מוֹקֵשׁ을 동일어로 흡수하지 않고, 본문에서는 ‘덫’과 ‘그물덫’으로 구별했습니다.
  alternative_readings:
  - 둘 다 ‘덫’으로 통일하기
  - 둘 다 ‘올가미’로 옮기기
  rationale: 원문은 같은 사냥 이미지 안에서 서로 다른 장치를 병치합니다. 한국어에서도 구별을 남겨 두어, 포획의 불가피성과 장치의 작동성을 함께 드러내는 것이 더 충실합니다.
  doctrine_reference: 원문 어휘의 병렬성과 수사적 대비
