id: AMO.3.7
reference: Amos 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לֹ֧א יַעֲשֶׂ֛ה אֲדֹנָ֥/י יְהוִ֖ה דָּבָ֑ר כִּ֚י אִם גָּלָ֣ה סוֹד֔/וֹ אֶל עֲבָדָ֖י/ו הַ/נְּבִיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/007.yaml
  text: For the Lord GOD does nothing unless he reveals his secret to his servants the prophets[a].
  footnotes:
  - marker: a
    text: Or 'his secret' or 'his confidential plan.' The Hebrew word can refer to confidential counsel, intimate deliberation, or a secret matter.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서는 자신의 종들인 예언자들에게 자신의 비밀을 드러내지 않고서는 아무 일도 행하지 않으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비밀’은 비밀스러운 의논, 내밀한 계획, 또는 숨겨진 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 두 호칭이 결합된 표현이므로 ‘주’와 언약 이름 ‘야훼’를 함께 살려 원문의 중첩된 신적 칭호를 보존했습니다.
- source_word: דָּבָר
  english_pob_choice: nothing
  chosen_korean: 아무것도
  alternatives_korean:
  - 아무 일도
  - 어떤 것도
  lexicon: HALOT
  rationale: 부정-예외 구문에서 한국어는 ‘아무것도’가 가장 자연스럽고, ‘행하다/하다’와 결합해 결과적으로 ‘아무것도 행하지 않으십니다’가 원문의 강한 부정 의미를 잘 살립니다.
- source_word: גָּלָה
  english_pob_choice: reveals
  chosen_korean: 드러내시지 않고는
  alternatives_korean:
  - 계시하지 않고는
  - 밝히지 않고는
  lexicon: HALOT
  rationale: ‘드러내다’는 숨겨진 것을 밖으로 나타내는 뜻을 살리면서도 현대 한국어에서 과도하게 교회적이지 않아, ‘reveals’의 의미를 자연스럽게 옮깁니다.
- source_word: סוֹדוֹ
  english_pob_choice: his secret
  chosen_korean: 자기 비밀
  alternatives_korean:
  - 자기 비밀의 뜻
  - 자기 은밀한 계획
  lexicon: HALOT
  rationale: סוֹד은 ‘비밀’만이 아니라 친밀한 내밀한 의논/비밀스러운 계획까지 포함할 수 있으므로, 본문 주석의 긴장을 유지하면서도 한국어로는 간결하게 ‘자기 비밀’로 옮겼습니다.
- source_word: עֲבָדָיו הַנְּבִיאִים
  english_pob_choice: his servants the prophets
  chosen_korean: 자기 종들인 예언자들
  alternatives_korean:
  - 자기 종들인 선지자들
  - 자기 종들인 예언자들
  lexicon: HALOT
  rationale: עבד는 여기서 하나님의 위임받은 종이라는 기능적 의미가 강하므로 ‘종’으로, הַנְּבִיאִים은 예언의 직무를 드러내는 표준어 ‘예언자들’로 옮겼습니다.
theological_decisions:
- issue: YHWH를 한국어에서 어떻게 표기할지
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 여호와
  - 주 하나님
  rationale: 프로젝트 기본값에 따라 YHWH는 ‘야훼’로 옮기고, אֲדֹנָי와의 결합은 ‘주’로 살려 두 칭호의 결합을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: ‘그분께서는… 행하지 않으십니다’의 주어를 앞에 보강할지 여부
  chosen_reading: 문장 첫머리에 ‘그분께서는’를 두어 주어를 명시했습니다.
  alternative_readings:
  - 주 야훼께서는 아무것도 행하지 않으십니다
  - 주 야훼께서는… 드러내시지 않고는 아무것도 행하지 않으십니다
  rationale: 히브리어의 화제 전개를 한국어 문장으로 자연화하되, 신적 주어가 분명하게 앞세워지도록 했습니다.
  doctrine_reference: 'Translation philosophy: maintain authorial force without flattening discourse flow'
