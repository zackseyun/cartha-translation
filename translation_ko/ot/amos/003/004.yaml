  source_fidelity: 첫 질문의 기본 의미와 수사 의문형은 잘 보존되었습니다. 그러나 כְּפִיר는 단순한 ‘새끼 사자’보다 성장한 ‘젊은 사자’를 가리키며, 둘째 각주의 ‘문자적으로는’ 설명은 히브리어의 실제 표현(‘잡았을 때가 아니면/잡지 않았다면’)을 정확히 반영하지 않습니다.
  naturalness: ‘먹이가 없는데도 … 포효하겠습니까?’와 ‘무언가를 잡지 않고서야 … 소리를 내겠습니까?’는 현대 표준 한국어의 합쇼체로 자연스럽고, 원문의 병행된 수사 질문도 유지합니다.
  terminology: אַרְיֵה는 ‘사자’, כְּפִיר는 ‘젊은 사자’로 구별하는 것이 적절합니다. יִשְׁאַג에는 사자의 울음에 알맞은 ‘포효하다’를 사용했습니다. מְעֹנָה의 대안은 본문 ‘굴’과 중복되지 않도록 ‘보금자리’로 제시했습니다.
