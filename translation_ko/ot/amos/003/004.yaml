translation:
  language: ko
  text: 사자가 숲에서 먹이가 없는데도 포효하겠습니까? 젊은 사자가 굴에서 무언가를 잡지 않고서야 소리를 내겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보금자리에서’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 잡았을 때가 아니면’입니다. 목적어는 문맥상 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁאַג / אַרְיֵה
  english_pob_choice: roar / lion
  chosen_korean: 사자가 … 부르짖겠습니까?
  alternatives_korean:
  - 울부짖겠습니까?
  - 포효하겠습니까?
  lexicon: HALOT
  rationale: 사자의 큰 울음소리를 자연스러운 현대 한국어로 옮기되, 수사적인 질문의 긴장감을 살리기 위해 ‘부르짖다’를 선택했습니다.
- source_word: בַּיַּעַר
  english_pob_choice: in the forest
  chosen_korean: 숲에서
  alternatives_korean:
  - 숲속에서
  - 삼림에서
  lexicon: HALOT
  rationale: יַעַר의 기본 뜻을 현대적으로 자연스럽게 살리기 위해 ‘숲’을 썼습니다.
- source_word: יִתֵּן קוֹלוֹ
  english_pob_choice: raise its voice
  chosen_korean: 목소리를 내겠습니까
  alternatives_korean:
  - 소리를 내겠습니까
  - 울겠습니까
  lexicon: HALOT
  rationale: 직역하면 ‘그의 소리를 주다’라는 관용구이므로, 한국어 관용으로는 ‘목소리를 내다’가 가장 무난합니다.
- source_word: מִמְּעֹנָתוֹ
  english_pob_choice: from its den
  chosen_korean: 굴에서
  alternatives_korean:
  - 은신처에서
  - 보금자리에서
  lexicon: HALOT
  rationale: 사자의 거처를 가리키는 표현을 한국어 동물 이미지에 맞게 ‘굴’로 옮겼습니다. 영어 주석의 ‘lair’ 가능성도 이 범위 안에 포함됩니다.
- source_word: בִּלְתִּי אִם לָכָד
  english_pob_choice: unless it has caught something
  chosen_korean: 무언가를 잡지 않고서야
  alternatives_korean:
  - 무엇인가를 잡지 않고서는
  - 먹이를 잡지 않고서야
  lexicon: HALOT
  rationale: 부정 조건구를 한국어의 자연스러운 종결 형태로 옮겼고, 원문이 암시하는 목적어를 드러내기 위해 ‘무언가를’로 처리했습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 두 질문 모두 대답을 요구하지 않는 예언적 수사 질문으로 옮겼습니다.
  alternative_readings:
  - 평서문으로 완화하여 옮김
  - 설명문으로 풀어 씀
  rationale: 문맥상 자연 질서의 당위를 끌어내는 논증이므로, 질문형을 유지해야 원문의 힘이 보존됩니다.
  doctrine_reference: 예언서의 수사적 논증과 심판 경고의 문맥
