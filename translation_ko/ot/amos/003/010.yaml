translation:
  language: ko
  text: 그들은 올바르게 행할 줄을 알지 못합니다—야훼의 말씀입니다—곧 자기들의 궁궐에 폭력과 파괴를 쌓아 두는 자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약탈’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘요새’ 또는 ‘성채’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדְעוּ עֲשׂוֹת נְכֹחָה
  english_pob_choice: do not know how to do what is right
  chosen_korean: 어떻게 올바른 일을 해야 하는지 알지 못합니다
  alternatives_korean:
  - 올바르게 행할 줄을 알지 못합니다
  - 옳은 일을 할 줄 모릅니다
  lexicon: HALOT
  rationale: ידע + 부정사구는 단순한 정보 부족보다 ‘어떻게 행해야 하는지’에 대한 도덕적 무능을 나타내므로, 절차성과 윤리성을 함께 살려 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: oracle of Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 신탁입니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם은 본문의 단락 경계를 표시하는 선언문이므로, 한국어에서는 자연스러운 예언 서술형으로 옮기되 하나님의 이름은 야훼로 유지했습니다.
- source_word: הָאֹצְרִים חָמָס וָשֹׁד
  english_pob_choice: those who store up violence and destruction
  chosen_korean: 폭력과 파멸을 그들의 요새에 쌓아 두는 자들
  alternatives_korean:
  - 폭력과 파괴를 쌓아 두는 자들
  - 폭력과 멸망을 저장하는 자들
  lexicon: HALOT
  rationale: אצר의 ‘쌓아 두다/저장하다’ 이미지를 살리고, חָמָס는 폭력으로, שֹׁד는 POB의 ‘destruction’에 맞춰 파멸로 옮겨 누적된 사회악의 강도를 드러냈습니다.
- source_word: בְּאַרְמְנֹוֹתֵיהֶם
  english_pob_choice: in their citadels
  chosen_korean: 그들의 요새에
  alternatives_korean:
  - 그들의 궁궐에
  - 그들의 성채에
  lexicon: HALOT
  rationale: אַרְמוֹן은 궁전일 수도 있으나, 아모스의 사회비판 맥락에서는 권력과 방어가 결합된 ‘요새’가 문맥상 더 직접적이어서 그 의미를 살렸습니다.
theological_decisions:
- issue: 야훼를 고유명사로 유지할지, 전통적 대체어로 바꿀지
  chosen_reading: 본문에는 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 히브리어 고유명사 יְהוָה를 직접 사용하므로, 공적 호칭으로 대체하지 않고 이름 자체를 보존하는 것이 원문 충실성과 감수성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
