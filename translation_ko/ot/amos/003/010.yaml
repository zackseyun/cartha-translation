  verdict: revise
  source_fidelity: 히브리어의 부정 표현, ‘올바르게 행하다’의 윤리적 의미, 야훼의 예언 선언, 그리고 폭력과 שֹׁד를 축적하는 자들의 묘사는 대체로 충실합니다. 다만 אַרְמוֹן의 복수형은 이 문맥에서 엘리트의 거처인 ‘궁궐’이 가장 자연스러운 기본 번역이며, ‘요새’는 가능한 대안으로 처리하는 편이 어휘 범위를 더 정확히 반영합니다.
  naturalness: 초안의 ‘어떻게 올바른 일을 해야 하는지’는 의미는 전달하지만 다소 장황합니다. ‘올바르게 행할 줄을’이 현대 표준 한국어에서 더 자연스럽고, 원문의 ‘알다 + 부정사’ 구조도 잘 살립니다. 삽입된 선언구는 대시를 붙여 유지하되, 대시 앞뒤의 공백은 한국어 문장부호 관례에 맞게 정리했습니다.
  terminology: יְהוָה는 지침과 원문에 따라 ‘야훼’로 유지했습니다. נְאֻם יְהוָה는 ‘야훼의 말씀입니다’로 자연스럽게 옮길 수 있습니다. שֹׁד는 문맥상 ‘파괴’로 옮기고 ‘약탈’을 각주 대안으로 유지했습니다. אַרְמְנוֹתֵיהֶם의 본문어는 ‘궁궐’로, ‘요새’를 각주 대안으로 제시했습니다.
