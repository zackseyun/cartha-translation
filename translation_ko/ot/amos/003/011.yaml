  lexicon: HALOT
  rationale: 히브리어 אַרְמוֹן은 궁전과 견고한 거점을 모두 가리킬 수 있으나, 여기서는 포위와 약탈의 맥락이 강하므로 방어적 의미를 살린 ‘요새들’로 옮겼습니다.
