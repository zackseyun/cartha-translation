translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “원수[a]가 그 땅 사방을 에워쌀 것이며, 네 힘을 꺾고, 네 요새들[b]은 약탈당할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적대자’. 히브리어 צַר는 ‘적대자’나 ‘원수’를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 궁전들’. 히브리어 אַרְמְנוֹתָיִךְ는 궁전이나 견고한 거점을 가리킬 수 있습니다.
    reason: lexical_alternative
