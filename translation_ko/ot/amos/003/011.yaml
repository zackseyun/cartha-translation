  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צַ֖ר וּ/סְבִ֣יב הָ/אָ֑רֶץ וְ/הוֹרִ֤ד מִמֵּ/ךְ֙ עֻזֵּ֔/ךְ וְ/נָבֹ֖זּוּ אַרְמְנוֹתָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/011.yaml
  text: 'Therefore[a], thus says the Lord GOD: An adversary shall surround the land, and he shall bring down your strength from you[b], and your citadels shall be plundered.'
  footnotes:
  - marker: a
    text: Or 'enemy' for 'adversary.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your palaces shall be plundered.' The Hebrew word can refer to palaces or fortified strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 야훼께서 이렇게 말씀하십니다. “원수가 그 땅을 둘러쌀 것이며, 당신의 힘을 당신에게서 빼앗아 가고, 당신의 요새들이 약탈당할 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘원수’. 히브리어 צַר는 ‘적대자’나 ‘원수’를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 궁전들이 약탈당할 것입니다.’ 히브리어 אַרְמְנוֹתָיִךְ는 궁전이나 견고한 거점을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그렇기 때문에
  lexicon: BDB/HALOT
  rationale: 원인-결과를 잇는 논리 표지로서, 예언 문맥에 자연스럽고 단정한 연결어인 ‘그러므로’가 가장 적절합니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 이 합성 칭호는 통상적인 예언자적 신적 선언을 가리키므로, 고유 이름 יהוה는 기본 원칙대로 ‘야훼’로 옮기고 아도나이는 ‘주’로 보존했습니다.
- source_word: צַר
  english_pob_choice: an adversary
  chosen_korean: 원수
  alternatives_korean:
  - 대적
  - 적
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘환난’보다 침공하는 적대 세력을 가리키므로, 한국어로는 단수의 적대자성을 드러내는 ‘원수’가 가장 자연스럽습니다.
- source_word: אַרְמְנוֹתָיִךְ
  english_pob_choice: your citadels
  chosen_korean: 당신의 요새들
  alternatives_korean:
  - 당신의 궁전들
  - 당신의 성채들
  lexicon: HALOT
  rationale: 히브리어 אַרְמוֹן은 궁전과 견고한 거점을 모두 가리킬 수 있으나, 여기서는 포위와 약탈의 맥락이 강하므로 방어적 의미를 살린 ‘요새들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 자기계시 이름을 어떻게 처리할 것인가
  chosen_reading: 본문에는 ‘주 야훼’로 두어, 아도나이와 야훼의 이중 호칭을 함께 드러냈습니다.
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 합성 칭호를 평평하게 만들지 않고, 예언적 선언의 위엄과 고유성을 보존하기 위해 본문에 별도 설명 없이 ‘야훼’를 사용합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for יְהוָה YHWH'
