  rationale: 이 합성 칭호는 통상적인 예언자적 신적 선언을 가리키므로, 고유 이름 יהוה는 기본 원칙대로 ‘야훼’로 옮기고 아도나이는 ‘주’로 보존했습니다.
- source_word: צַר
  english_pob_choice: an adversary
  chosen_korean: 원수
  alternatives_korean:
