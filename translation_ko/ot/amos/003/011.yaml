  naturalness: 합쇼체의 신탁 도입과 미래 서술은 자연스럽습니다. 집단적 수신자를 가리키는 성서 문체에서는 ‘당신의’보다 ‘네’를 쓰는 것이 더 자연스럽고 일관됩니다. 각주 표지는 해당 어휘 바로 뒤에 두어야 독자가 대안이 무엇을 가리키는지 분명히 알 수 있습니다.
