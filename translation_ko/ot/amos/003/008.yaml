id: AMO.3.8
reference: Amos 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַרְיֵ֥ה שָׁאָ֖ג מִ֣י לֹ֣א יִירָ֑א אֲדֹנָ֤/י יְהוִה֙ דִּבֶּ֔ר מִ֖י לֹ֥א יִנָּבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/008.yaml
  text: A lion has roared—who will not fear? The Lord GOD has spoken—who will not prophesy?[a][b]
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord YHWH.'' English ''Lord GOD'' reflects the customary rendering of the divine name in this compound title; alternatively, ''the Lord Yahweh.'''
    reason: alternative_reading
  - marker: b
    text: Or, more idiomatically, 'who can but prophesy?'
    reason: lexical_alternative
translation:
  language: ko
  text: 사자가 포효했습니다 — 누가 두려워하지 않겠습니까? 주 야훼께서 말씀하셨습니다 — 누가 예언하지 않겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아도나이 야훼’, 곧 ‘주 야훼’입니다. 주권 칭호와 신명을 함께 드러내어 ‘주 야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 더 관용적으로는 ‘누가 예언하지 않을 수 있겠습니까?’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  english_pob_choice: lion
  chosen_korean: 사자
  alternatives_korean:
  - 한 마리 사자
  lexicon: HALOT
  rationale: 일반 명사로서 자연스럽게 ‘사자’로 옮겼습니다. 한국어에서는 부정관사 없이도 단수 일반 의미가 잘 전달됩니다.
- source_word: שָׁאָג
  english_pob_choice: has roared
  chosen_korean: 포효합니다
  alternatives_korean:
  - 포효했습니다
  - 으르렁거렸습니다
  lexicon: HALOT
  rationale: 열린 선포의 힘을 살리기 위해 ‘포효하다’를 택했고, 예언적 격언의 현재형 표현으로 긴박한 효과를 유지했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: The Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 본문의 결합 칭호를 그대로 살려 ‘주’와 신명 ‘야훼’를 분리해 옮겼습니다. ‘주 하나님’은 신명 구분이 약해지고, 전통적 ‘여호와’는 본 프로젝트의 기본 용례를 따르지 않습니다.
- source_word: דִּבֶּר
  english_pob_choice: has spoken
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 말하셨습니다
  lexicon: HALOT
  rationale: 하나님을 가리키는 동사로는 표준적인 존칭 표현인 ‘말씀하시다’가 자연스럽고, 앞의 ‘포효합니다’와 대응되는 단정적 선언을 유지합니다.
- source_word: מִי לֹא יִנָּבֵא
  english_pob_choice: who will not prophesy?
  chosen_korean: 누가 예언하지 않겠습니까?
  alternatives_korean:
  - 누가 예언할 수 없겠습니까?
  - 누가 예언하지 않을 수 있겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 강한 필연성을 살려 직역형보다 한국어 자연성이 높은 부정 의문형으로 옮겼습니다. ‘예언하다’가 본문의 직접 어휘 대응입니다.
theological_decisions:
- issue: יהוה를 포함한 결합 칭호 אֲדֹנָי יְהוִה의 한국어 처리
  chosen_reading: ‘주 야훼’로 옮겨 주권 칭호와 언약 이름을 함께 드러냈습니다.
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문은 ‘주’와 신명 이름을 함께 제시하므로 두 요소를 함께 보존하는 것이 소스에 더 충실합니다. 전통적 교회어인 ‘주 하나님’은 신명성을 희석할 수 있어 채택하지 않았습니다.
  doctrine_reference: Contested terms — יְהוָה (YHWH) → 야훼
