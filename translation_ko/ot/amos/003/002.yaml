  source_fidelity: 본문의 ‘알았으므로’는 히브리어의 ‘오직 … 알았다’와 그 뒤의 독립적인 결론 표지 ‘그러므로’를 하나의 인과절로 합쳐, 원문의 강조와 논리 전개를 흐립니다. 또한 פקד עַל의 주석을 ‘찾겠다/돌아보겠다’로 설명한 것은 이 심판 문맥에 맞지 않습니다.
  naturalness: ‘너희의 모든 죄악을 너희에게 물을 것입니다’는 목적어와 부사어의 결합이 다소 어색합니다. ‘너희의 모든 죄악에 대하여 너희에게 책임을 물을 것입니다’가 현대 표준어 합쇼체에서 자연스럽고 법정적 심판의 어감도 보존합니다.
  terminology: ‘족속’, ‘알다’, ‘죄악’은 문맥과 격식에 적절합니다. ידע의 언약적 함의는 본문에서 ‘알았다’로 보존하고 주석에서 선택적 의미를 밝혀야 합니다. פקד עַל은 이 문맥에서 죄악에 대해 책임을 묻고 처벌하는 행위를 가리킵니다.
