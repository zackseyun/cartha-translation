id: AMO.3.2
reference: Amos 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַ֚ק אֶתְ/כֶ֣ם יָדַ֔עְתִּי מִ/כֹּ֖ל מִשְׁפְּח֣וֹת הָ/אֲדָמָ֑ה עַל כֵּן֙ אֶפְקֹ֣ד עֲלֵי/כֶ֔ם אֵ֖ת כָּל עֲוֺנֹֽתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/002.yaml
  text: You only have I known from among all the families of the earth[b][a]; therefore I will punish you for all your iniquities.
  footnotes:
  - marker: a
    text: Or 'You only have I chosen/acknowledged among all the families of the earth.' The Hebrew 'known' can carry covenantal overtones.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'I will visit upon you all your iniquities,' that is, 'I will call you to account for them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 땅의 모든 족속 가운데서 내가 너희만을 알았다.[a] 그러므로 내가 너희의 모든 죄악에 대하여 너희에게 책임을 물을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알았다’는 여기서 ‘택했다’ 또는 ‘인정했다’는 뜻을 지닌 언약적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희의 모든 죄악을 너희에게 벌하다’라는 뜻으로, 곧 그 죄악들에 대하여 책임을 묻는다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 오직 하나만
  lexicon: HALOT
  rationale: 문장 첫머리의 배타적 강조를 간결하게 살리기 위해 ‘오직’을 사용했습니다.
- source_word: יָדַעְתִּי
  english_pob_choice: have I known
  chosen_korean: 내가 ... 알았으므로
  alternatives_korean:
  - 내가 ... 알았기에
  - 내가 ... 택했으므로
  - 내가 ... 인정했으므로
  lexicon: HALOT
  rationale: ידע의 핵심 의미를 ‘알다’로 유지하되, 문맥상 원인절로 자연스럽게 연결되도록 옮겼습니다. ‘택하다’는 주석이 뒷받침하는 해석이지만 본문에서는 직접 대치하지 않았습니다.
- source_word: מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה
  english_pob_choice: from among all the families of the earth
  chosen_korean: 땅의 모든 족속 중에서
  alternatives_korean:
  - 세상의 모든 가족들 가운데서
  - 땅의 모든 집안들 중에서
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 여기서 집단적 민족 단위를 가리키므로 ‘족속’이 자연스럽고, הָאֲדָמָה는 인류 전체의 범위를 살려 ‘땅’으로 옮겼습니다.
- source_word: אֶפְקֹד עֲלֵיכֶם
  english_pob_choice: I will punish you
  chosen_korean: 내가 ... 너희에게 물을 것입니다
  alternatives_korean:
  - 내가 ... 너희를 벌할 것입니다
  - 내가 ... 너희에게 벌을 내릴 것입니다
  - 내가 ... 너희를 심문하여 책임을 물을 것입니다
  lexicon: HALOT
  rationale: פקד의 법정적·심판적 뉘앙스를 살리면서도, 영어 주석의 ‘call you to account’에 대응하도록 ‘물을 것입니다’를 사용했습니다. 전통적 종교어 ‘벌하다’만으로는 책임 추궁의 요소가 덜 드러납니다.
- source_word: עֲוֺנֹתֵיכֶם
  english_pob_choice: your iniquities
  chosen_korean: 너희의 모든 죄악
  alternatives_korean:
  - 너희의 모든 죄책
  - 너희의 모든 죄들
  lexicon: HALOT
  rationale: עָוֹן의 도덕적·법적 무게를 반영해 ‘죄악’으로 옮기고, ‘모든’으로 총괄성을 분명히 했습니다.
theological_decisions:
- issue: ידע(알다)의 언약적 함의
  chosen_reading: 본문에는 ‘알다’를 유지하고, 언약적 선택의 뉘앙스는 주석에서 설명합니다.
  alternative_readings:
  - 명시적으로 ‘택하다’로 번역
  - ‘인정하다’로 번역
  rationale: 이 절은 야훼와 이스라엘의 독특한 관계를 말하지만, 히브리어 동사는 실제로 ‘알다’입니다. 본문에서 그 어휘를 보존해야 선택과 관계적 친밀성의 긴장이 살아납니다.
  doctrine_reference: translation philosophy §§1, 3, 5
- issue: פקד의 심판 의미
  chosen_reading: ‘물을 것입니다’로 옮겨 심판과 책임 추궁의 의미를 함께 살립니다.
  alternative_readings:
  - ‘벌할 것입니다’
  - ‘문책할 것입니다’
  rationale: 이 문맥에서는 죄에 대한 언약적 심판이 핵심이므로, 단순한 처벌보다 책임을 묻는 법정적 어감을 살리는 것이 원문에 더 가깝습니다.
  doctrine_reference: translation philosophy §§1, 6
