  verdict: revise
  source_fidelity: 히브리어의 명령 연쇄와 핵심 어휘는 대체로 반영되었으나, 「요새들 위에 선포하고」는 עַל־אַרְמְנוֹת의 호명/선포 용법을 한국어에서 부자연스럽고 오해 가능하게 옮긴 표현입니다. 또한 אַרְמְנוֹת는 단순 군사 요새보다 궁정·상류층 거처의 뜻을 포함하므로 본문에는 「궁전들」을 쓰고 대안을 주석으로 남기는 편이 안전합니다. עֲשׁוּקִים은 수동 분사 복수로서 「압제당하는 사람들」로 유지할 수 있습니다.
  naturalness: 현행문의 「그녀 안」, 「그녀 가운데」는 한국어 성경 문체에서도 지나치게 직역적입니다. 도시 사마리아를 가리키는 여성 단수 대명사는 「그곳」으로 자연스럽게 처리할 수 있습니다. 「…에 선포하여 이렇게 말하십시오」와 「그곳의/그곳 한가운데의」는 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: 「궁전들」은 אַרְמְנוֹת의 중심 의미와 예언자가 외국의 지배층 거처를 증인으로 부르는 수사적 맥락을 잘 살립니다. 방어적 뉘앙스는 주석에서 「요새들」 또는 「성채들」이라는 대안으로 보존합니다. 「소요」와 「압제당하는 사람들」은 각각 מְהוּמוֹת와 עֲשׁוּקִים의 복수 및 사회적 혼란/피해자 의미를 적절히 반영합니다.
