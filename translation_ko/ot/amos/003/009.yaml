id: AMO.3.9
reference: Amos 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַשְׁמִ֨יעוּ֙ עַל אַרְמְנ֣וֹת בְּ/אַשְׁדּ֔וֹד וְ/עַֽל אַרְמְנ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אִמְר֗וּ הֵאָֽסְפוּ֙ עַל הָרֵ֣י שֹׁמְר֔וֹן וּ/רְא֞וּ מְהוּמֹ֤ת רַבּוֹת֙ בְּ/תוֹכָ֔/הּ וַ/עֲשׁוּקִ֖ים בְּ/קִרְבָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/009.yaml
  text: Proclaim to the citadels of Ashdod and to the citadels in the land of Egypt[a], and say, “Assemble on the mountains of Samaria, and see the many tumults within her[d][c][b], and the oppressed in her midst.”
  footnotes:
  - marker: a
    text: Or “palaces” for “citadels.” The Hebrew term can denote grand fortified residences.
    reason: lexical_alternative
  - marker: b
    text: Or “the hills of Samaria.”
    reason: lexical_alternative
  - marker: c
    text: Or “great unrest” / “many disturbances” for “many tumults.”
    reason: lexical_alternative
  - marker: d
    text: Or “acts of oppression”; the Hebrew may be read more abstractly, but “the oppressed” best fits the form and context.
    reason: alternative_reading
translation:
  language: ko
  text: 아스돗의 요새들과 이집트 땅의 요새들 위에 선포하고, 말하십시오. “사마리아의 산들 위에 모여 그녀 안의 많은 소요와 그녀 가운데의 압제당한 사람들을 보십시오.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “요새들” 대신 “궁전들”로 볼 수 있습니다. 히브리어는 큰 방어 시설이자 저택을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “사마리아의 언덕들”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “큰 불안” / “많은 혼란”으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “압제 행위들”로 읽을 수 있습니다. 히브리어는 더 추상적으로도 읽히지만, 문법과 문맥상 “압제당한 사람들”이 더 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  english_pob_choice: Proclaim
  chosen_korean: 선포하고
  alternatives_korean:
  - 알리라고
  - 들리게 하라고
  lexicon: HALOT
  rationale: 히필 명령형의 공개적 호출을 한국어에서 자연스럽고 강하게 살리기 위해 ‘선포하다’를 택했습니다.
- source_word: אַרְמְנוֹת
  english_pob_choice: citadels
  chosen_korean: 요새들
  alternatives_korean:
  - 궁전들
  - 성채들
  lexicon: HALOT
  rationale: 이 단어는 화려한 거처이면서 방어시설일 수 있으나, 예언적 소환 맥락에서는 방어성을 살린 ‘요새들’이 가장 무난합니다.
- source_word: מְהוּמֹת רַבּוֹת
  english_pob_choice: the many tumults
  chosen_korean: 많은 소요
  alternatives_korean:
  - 큰 혼란
  - 많은 소란들
  - 많은 동요
  lexicon: HALOT
  rationale: 복수형의 ציבור적 혼란을 유지하면서도 한국어에서 자연스러운 사회적 소요의 의미를 담기 위해 ‘많은 소요’로 옮겼습니다.
- source_word: עֲשׁוּקִים
  english_pob_choice: the oppressed
  chosen_korean: 압제당한 사람들
  alternatives_korean:
  - 억눌린 자들
  - 압제들
  - 억압받는 사람들
  lexicon: HALOT
  rationale: 명사화된 분사로서 추상적 ‘압제’보다 피해를 입은 사람들을 가리키는 것이 문맥에 더 잘 맞아, POB의 수정을 반영해 인격적 대상을 드러냈습니다.
theological_decisions:
- issue: 아스돗과 이집트의 요새들에 대한 호명 방식
  chosen_reading: 지명 앞의 전치사를 한국어에서 자연스러운 소속/귀속 표현으로 풀어 ‘아스돗의 요새들’, ‘이집트 땅의 요새들’로 옮겼습니다.
  alternative_readings:
  - 아스돗 안의 요새들
  - 아스돗에 있는 요새들
  rationale: 히브리어의 지시 기능을 유지하면서도 한국어 문맥에서 예언적 호명의 힘을 살리기 위한 처리입니다.
  doctrine_reference: source-grammar
- issue: עֲשׁוּקִים의 의미
  chosen_reading: 사마리아 가운데에서 보이는 것은 추상적 ‘압제’가 아니라 압제당한 사람들입니다.
  alternative_readings:
  - 압제들
  - 압제 행위들
  rationale: POB의 최종 판정처럼 분사형을 인격적 대상으로 읽는 것이 본문 병렬과 아모스의 사회정의 문맥에 가장 잘 맞습니다.
  doctrine_reference: source-syntax
