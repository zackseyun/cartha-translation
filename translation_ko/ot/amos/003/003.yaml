  text: הֲ/יֵלְכ֥וּ שְׁנַ֖יִם יַחְדָּ֑ו בִּלְתִּ֖י אִם נוֹעָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/003.yaml
  text: Do two walk together unless they have agreed to meet?[a]
  footnotes:
  - marker: a
    text: Or, 'unless they have agreed' or 'unless they have appointed a meeting.' The Hebrew verb carries the sense of arranging or agreeing to meet by prior appointment.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 사람이 서로 약속하지 않고 함께 걷겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '서로 약속하지 않고'나 '만나기로 정하지 않고'. 히브리어 동사는 미리 약정하여 만나기로 정하는 의미를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵלְכ֥וּ
  english_pob_choice: Do ... walk
  chosen_korean: 함께 걷겠습니까?
  alternatives_korean:
  - 함께 걸어가겠습니까?
  - 함께 걷습니까?
  lexicon: HALOT
  rationale: 의문 표지 הֲ가 붙은 완료적·격언적 질문이므로, 단순 미래보다 수사적 현재형 의문으로 옮겼습니다. '걷다'는 히브리어 הלך의 가장 직접적인 대응입니다.
- source_word: שְׁנַ֖יִם
  english_pob_choice: two
  chosen_korean: 두 사람이
  alternatives_korean:
  - 둘이
  - 두 명이
  lexicon: HALOT
  rationale: 문맥상 사람을 가리키므로 한국어에서는 자연스럽게 '두 사람'으로 옮겼습니다.
- source_word: יַחְדָּ֑ו
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 같이
  - 동시에
  lexicon: HALOT
  rationale: יַחדָו의 기본 뜻인 '함께, 공동으로'를 간결하고 현대적인 표현인 '함께'로 옮겼습니다.
- source_word: נוֹעָדוּ־
  english_pob_choice: have agreed to meet
  chosen_korean: 서로 약속하지
  alternatives_korean:
  - 만나기로 합의하지
  - 미리 정해 만나지
  lexicon: HALOT
  rationale: נעד의 니팔은 단순한 동시 행동이 아니라 사전 합의·약정을 뜻하므로, '서로 약속하다'가 그 의미를 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 예언적 책망과 당연한 상식에 호소하는 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순 정보 확인 질문
  - 인과관계를 기술하는 진술
  rationale: 문장 구조와 잠언적 문맥상, 본절은 '둘이 함께 걷는 데에는 사전 합의가 필요하다'는 상식적 사실을 통해 뒤의 논지를 준비하는 수사적 질문입니다.
  doctrine_reference: 문맥적-수사학적 해석
