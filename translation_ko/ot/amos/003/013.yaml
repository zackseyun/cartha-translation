  text: שִׁמְע֥וּ וְ/הָעִ֖ידוּ בְּ/בֵ֣ית יַֽעֲקֹ֑ב נְאֻם אֲדֹנָ֥/י יְהוִ֖ה אֱלֹהֵ֥י הַ/צְּבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/013.yaml
  text: Hear and testify against the house of Jacob[a], declares the Lord GOD[b], the God of hosts.
  footnotes:
  - marker: a
    text: Or 'bear witness against the house of Jacob'; the Hebrew verb can mean to give testimony or witness in a judicial sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Lord GOD' represents the compound divine title 'Adonai YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들으십시오. 그리고 야곱의 집에 대하여 증언하십시오[а], 주 하나님[b], 만군의 하나님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 집에 대하여 증거하십시오’. 히브리어 동사는 법정적 맥락에서 증언하거나 증거하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘주 하나님’은 아도나이와 야훼가 결합된 합성 신칭을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְע֥וּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
  - 들으라
  lexicon: HALOT
  rationale: 복수 명령형의 예언자적 호소를 합쇼체 명령으로 옮겨, 경고와 권위의 어조를 살렸습니다.
- source_word: וְהָעִ֖ידוּ
  english_pob_choice: testify against
  chosen_korean: 증언하십시오
  alternatives_korean:
  - 증언하십시오(…을)
  - 증거하십시오
  - 증언하여 대적하십시오
  lexicon: HALOT
  rationale: 히필 명령형의 법정적 의미를 살리되, 한국어에서 자연스러운 핵심어는 ‘증언하다’이므로 이를 택했습니다. 문맥상의 ‘against’는 뒤의 전치사구와 전체 심판 문맥이 드러내므로 본문에서 과도하게 확장하지 않았습니다.
- source_word: בְּבֵית יַֽעֲקֹב
  english_pob_choice: against the house of Jacob
  chosen_korean: 야곱의 집에 대하여
  alternatives_korean:
  - 야곱의 집을 향하여
  - 야곱 집에 대하여
  - 야곱의 집 안에서
  lexicon: HALOT
  rationale: בְּ의 방향/대상성은 한국어 조사 ‘대하여’로 비교적 중립적이면서도 법정적 어감을 유지할 수 있습니다. ‘야곱의 집’은 언약 백성 이스라엘을 가리키는 관용을 보존합니다.
- source_word: אֲדֹנָ֥/י יְהוִ֖ה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  - 주 하나님 야훼
  lexicon: HALOT
  rationale: 합성 신칭에서 두 호칭의 중첩을 한국어로 자연스럽게 처리하기 위해 ‘주 하나님’을 택했습니다. 본문은 이미 주권 호칭과 언약 이름의 결합을 담고 있으므로, 별도의 음역을 본문에 강제하지 않고 주석적 여지를 남겼습니다.
- source_word: אֱלֹהֵ֥י הַ/צְּבָאֽוֹת
  english_pob_choice: the God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 군대의 하나님
  - 하늘 군대의 하나님
  - 만군의 주 하나님
  lexicon: HALOT
  rationale: ‘hosts’의 관용적 한국어 대응인 ‘만군’은 전통적이면서도 여전히 이해 가능합니다. 하나님의 위엄과 통치 범위를 간결하게 보존합니다.
theological_decisions:
- issue: יהוה를 본문에서 음역할지 여부
  chosen_reading: 본문에는 합성 칭호를 자연스럽게 ‘주 하나님’으로 옮기고, 필요한 경우 주석에서 야훼를 설명하는 방식이 적절합니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 이 절의 핵심은 심판 선언의 권위이며, 한국어 본문에서 ‘주 하나님’이 합성 칭호의 중첩을 가장 매끄럽게 드러냅니다. 원문 이름의 구별은 본문보다 주석층에서 보완하는 편이 합쇼체 문맥에 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
