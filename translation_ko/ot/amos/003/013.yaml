  - 주 여호와
  rationale: 이 절의 핵심은 심판 선언의 권위이며, 한국어 본문에서 ‘주 하나님’이 합성 칭호의 중첩을 가장 매끄럽게 드러냅니다. 원문 이름의 구별은 본문보다 주석층에서 보완하는 편이 합쇼체 문맥에 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
