id: AMO.3.14
reference: Amos 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֗י בְּ/י֛וֹם פָּקְדִ֥/י פִשְׁעֵֽי יִשְׂרָאֵ֖ל עָלָ֑י/ו וּ/פָֽקַדְתִּי֙ עַל מִזְבְּח֣וֹת בֵּֽית אֵ֔ל וְ/נִגְדְּעוּ֙ קַרְנ֣וֹת הַ/מִּזְבֵּ֔חַ וְ/נָפְל֖וּ לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/014.yaml
  text: For on the day when I punish Israel for his transgressions[a], I will also punish the altars of Bethel[b]; the horns of the altar will be cut off and fall to the ground.
  footnotes:
  - marker: a
    text: Or 'when I visit Israel for his rebellions'; the Hebrew verb can mean 'visit' in the sense of calling to account or punishing.
    reason: lexical_alternative
  - marker: b
    text: The 'horns' were the horn-like projections at the corners of the altar, associated with its sanctity and ritual use.
    reason: cultural_note
translation:
  language: ko
  text: 그가 이스라엘의 범죄들을 벌하시는 날에, 내가 또한 베델의 제단들을 벌하겠습니다. 제단의 뿔들이 잘려 나가 땅에 떨어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: פָּקַד은 여기서 ‘살피다’가 아니라, 책임을 물어 벌하시는 심판 행위를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제단의 뿔’은 제단 모서리에 붙은 실제 돌출부를 가리키며, 예배와 성소의 상징성을 지닌 구조물입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי בְּיוֹם
  english_pob_choice: For on the day
  chosen_korean: 그가 이스라엘의 범죄들을 벌하시는 날에
  alternatives_korean:
  - 그날에
  - 이스라엘을 벌하시는 날에
  - 이스라엘의 범죄들을 살피시는 날에
  lexicon: HALOT
  rationale: כִּי의 설명적 연결과 בְּיוֹם의 시간 표현을 함께 살려, 앞선 선언의 근거가 되는 종말적 심판 시점을 자연스러운 한국어로 풀었습니다.
- source_word: פָּקְדִי פִשְׁעֵי יִשְׂרָאֵל
  english_pob_choice: when I punish Israel for his transgressions
  chosen_korean: 이스라엘의 범죄들을 벌하시는
  alternatives_korean:
  - 이스라엘을 벌하시는
  - 이스라엘의 반역들을 벌하시는
  - 이스라엘을 살피시는
  lexicon: HALOT
  rationale: פָּקַד는 여기서 ‘벌하다/심판하다’의 법정적 의미가 분명하므로, ‘벌하시는’으로 옮겨 원문의 심판 뉘앙스를 분명히 했습니다. פִשְׁעִים은 언약적 반역을 가리키지만, 한국어에서는 문맥상 가장 직접적인 ‘범죄들’이 과도한 해석을 피하면서도 무게를 살립니다.
- source_word: וּפָקַדְתִּי עַל מִזְבְּחוֹת בֵּית אֵל
  english_pob_choice: I will also punish the altars of Bethel
  chosen_korean: 내가 또한 베델의 제단들을 벌하겠습니다
  alternatives_korean:
  - 베델의 제단들을 심판하겠습니다
  - 베델 제단에 벌을 내리겠습니다
  - 베델의 제단들을 살피겠습니다
  lexicon: HALOT
  rationale: 반복되는 פָּקַד를 앞절과 일관되게 ‘벌하다’로 처리해, 이중 심판 선언의 대응을 보이게 했습니다. מִזְבְּחוֹת בֵּית אֵל은 소유격 구조를 자연스럽게 풀어 ‘베델의 제단들’로 옮겼습니다.
- source_word: וְנִגְדְּעוּ קַרְנוֹת הַמִּזְבֵּחַ
  english_pob_choice: the horns of the altar will be cut off
  chosen_korean: 제단의 뿔들이 잘려 나가
  alternatives_korean:
  - 제단의 뿔들이 끊어져
  - 제단의 뿔들이 꺾여
  - 제단의 뿔들이 잘려 떨어져
  lexicon: HALOT
  rationale: קַרְנוֹת은 제단 꼭짓점의 실제 ‘뿔’ 모양 돌출부를 가리키므로, 상징을 풀지 않고 직역적으로 유지했습니다. נִגְדְּעוּ는 폭력적으로 잘려 나가는 동작을 드러내는 한국어가 적절합니다.
- source_word: וְנָפְלוּ לָאָרֶץ
  english_pob_choice: and fall to the ground
  chosen_korean: 땅에 떨어질 것입니다
  alternatives_korean:
  - 땅으로 떨어질 것입니다
  - 땅에 떨어집니다
  - 땅에 쓰러질 것입니다
  lexicon: HALOT
  rationale: 마지막 결과 절은 잘려 나감의 자연스러운 귀결이므로, 물리적 낙하를 분명히 하는 ‘떨어질 것입니다’로 옮겼습니다. לָאָרֶץ는 이 문맥에서 ‘땅에/땅으로’가 가장 자연스럽습니다.
theological_decisions:
- issue: אָנֹכִי/1인칭 심판 선언의 한국어 시점 처리
  chosen_reading: ‘내가’로 직접 화법을 유지하되, 앞의 시간절을 살려 예언적 심판 선언의 긴박함을 보존했습니다.
  alternative_readings:
  - ‘내가’ 없이 수동형으로 완화
  - ‘주께서’로 간접화
  rationale: 이 절은 야훼의 직접 발언이 아니라 예언자의 선언이지만, 1인칭 심판 예고의 힘이 핵심이므로 주어를 분명히 드러냈습니다. 수동화하면 책임 주체와 예언적 압박감이 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, original-language primacy over smoothing
