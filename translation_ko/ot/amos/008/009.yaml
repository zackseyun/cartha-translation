source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הֵבֵאתִ֥י הַ/שֶּׁ֖מֶשׁ בַּֽ/צָּהֳרָ֑יִם וְ/הַחֲשַׁכְתִּ֥י לָ/אָ֖רֶץ בְּ/י֥וֹם אֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/009.yaml
  text: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
  footnotes:
  - marker: a
    text: Or 'the land'; Hebrew אֶרֶץ can refer either to the earth generally or to a particular land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에는 이런 일이 일어날 것입니다. 주 야훼의 말씀입니다. 내가 정오에 해를 지게 하고, 밝은 대낮에 땅을 어둡게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 세상’ 또는 ‘그 땅’으로도 번역할 수 있습니다. 히브리어 אֶרֶץ는 일반적인 땅이나 세상을 가리킬 수도 있고, 특정 지역이나 나라를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה / בַּיּוֹם הַהוּא
  english_pob_choice: And it shall happen in that day
  chosen_korean: 그날에 그런 일이 일어날 것입니다
  alternatives_korean:
  - 그날에 일어날 것입니다
  - 그날에 그것이 이루어질 것입니다
  lexicon: HALOT
  rationale: 예언적 미래 도입구를 자연스러운 현대 한국어로 옮기되, 단순한 서술보다 선언적 긴장을 살렸습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 야훼의 말씀입니다
  alternatives_korean:
  - 주 하나님 야훼의 말씀입니다
  - 주 여호와의 말씀입니다
  lexicon: HALOT
  rationale: נְאֻם의 예언적 공식을 ‘말씀입니다’로 처리하고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְהֵבֵאתִי הַשֶּׁמֶשׁ בַּצָּהֳרָיִם
  english_pob_choice: that I will make the sun go down at noon
  chosen_korean: 내가 정오에 해를 지게 하고
  alternatives_korean:
  - 내가 정오에 해를 내려가게 하고
  - 내가 정오에 해를 지게 하며
  lexicon: HALOT
  rationale: 히필 동사의 원인적 의미를 살려 하나님이 해의 저무는 일을 일으키신다는 뜻을 자연스럽게 표현했습니다.
- source_word: לָאָרֶץ בְּיוֹם אוֹר
  english_pob_choice: and I will darken the earth in broad daylight
  chosen_korean: 한낮에 땅을 어둡게 하겠습니다
  alternatives_korean:
  - 대낮에 땅을 어둡게 하겠습니다
  - 밝은 낮에 땅을 어둡게 하겠습니다
  lexicon: HALOT
  rationale: ‘בְּיוֹם אוֹר’의 충격을 한국어 관용으로 ‘한낮’으로 옮겨, 빛 한가운데의 어둠이라는 역설을 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값을 따라 YHWH를 ‘야훼’로 표기해 원문 고유명을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 아모스 8:9의 심판적 역설 표현
  chosen_reading: 정오의 해짐과 한낮의 어두움
  alternative_readings:
  - 단순한 일식 묘사
  - 은유적으로만 처리
  rationale: 본문은 단순한 천문 현상보다 야훼의 심판적 주권을 드러내므로, 자연현상 묘사와 예언적 경고를 함께 보존했습니다.
  doctrine_reference: Amos prophecy context
