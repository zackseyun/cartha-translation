id: AMO.8.2
reference: Amos 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר כְּל֣וּב קָ֑יִץ וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בָּ֤א הַ/קֵּץ֙ אֶל עַמִּ֣/י יִשְׂרָאֵ֔ל לֹא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/002.yaml
  text: And he said[a], “What do you see, Amos?” And I said, “A basket of summer fruit.” Then Yahweh said to me, “The end has come upon my people Israel[b]; I will not again pass by them.”
  footnotes:
  - marker: a
    text: Hebrew 'summer fruit' (qayits) sounds like 'the end' (qets), forming a wordplay that links the vision to the announcement of judgment.
    reason: cultural_note
  - marker: b
    text: Or 'I will not again spare them' / 'I will not again pass over them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다[a], “아모스, 네가 무엇을 보고 있습니까?” 내가 말했습니다. “여름 과일 한 광주리입니다.” 그러자 야훼께서 내게 말씀하셨습니다. “끝이 내 백성 이스라엘 위에 이르렀습니다. 내가 다시는 그들을 지나치지 않겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘여름 과일’(qayits)은 ‘끝’(qets)과 소리가 비슷하여, 환시와 심판 선포를 연결하는 말놀이를 이룹니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘내가 다시는 그들을 아끼지 않겠다’ / ‘내가 다시는 그들을 지나쳐 가지 않겠다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלוּב קָיִץ
  english_pob_choice: a basket of summer fruit
  chosen_korean: 여름 과일 한 광주리
  alternatives_korean:
  - 여름 과일 바구니
  - 익은 과일 한 광주리
  - 과일 한 광주리
  lexicon: HALOT
  rationale: קָיִץ의 ‘여름 과일’과 뒤의 הַקֵּץ ‘끝’ 사이의 말놀이를 살리기 위해, 일반적인 ‘과일’보다 ‘여름 과일’을 유지하고 용기는 ‘광주리’로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기적 고유명 יְהוָה를 POB 기본 원칙에 따라 ‘야훼’로 옮겨, 호칭 ‘주님’으로 대체하지 않았습니다.
- source_word: בָּא הַקֵּץ
  english_pob_choice: The end has come
  chosen_korean: 끝이 … 이르렀다
  alternatives_korean:
  - 끝이 왔다
  - 끝이 도래했다
  lexicon: HALOT
  rationale: 완결된 도래를 나타내는 בָּא를 한국어 ‘이르렀다’로 자연스럽게 살리면서, 정관사적 הַקֵּץ는 ‘끝’으로 옮겼습니다.
- source_word: לֹא אוֹסִיף עוֹד עֲב֥וֹר לוֹ
  english_pob_choice: I will not again pass by them
  chosen_korean: 내가 다시는 그들을 지나치지 않겠다
  alternatives_korean:
  - 내가 다시는 그들을 용서하지 않겠다
  - 내가 다시는 그들을 지나가 버리지 않겠다
  - 내가 다시는 그들을 눈감아 주지 않겠다
  lexicon: HALOT
  rationale: 직역적 ‘pass by’를 기본으로 하되 한국어에서 자연스러운 ‘지나치다’로 옮겨, 본문의 은유를 유지하면서도 주석적 해석인 ‘용서하다/눈감아 주다’는 본문 밖 선택지로 남겼습니다.
theological_decisions:
- issue: אַתָּה רֹאֶה의 직접 화법과 아모스의 응답
  chosen_reading: “아모스야, 네가 무엇을 보느냐?” / “여름 과일 한 광주리입니다.”
  alternative_readings:
  - “아모스야, 무엇이 보이느냐?”
  - “네가 무엇을 보고 있느냐?”
  rationale: 환시 대화의 즉시성을 살리기 위해 현재형 질문을 사용하고, 아모스의 응답도 간결한 선언문으로 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve source discourse force without smoothing'
