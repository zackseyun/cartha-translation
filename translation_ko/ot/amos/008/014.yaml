id: AMO.8.14
reference: Amos 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נִּשְׁבָּעִים֙ בְּ/אַשְׁמַ֣ת שֹֽׁמְר֔וֹן וְ/אָמְר֗וּ חֵ֤י אֱלֹהֶ֨י/ךָ֙ דָּ֔ן וְ/חֵ֖י דֶּ֣רֶךְ בְּאֵֽר שָׁ֑בַע וְ/נָפְל֖וּ וְ/לֹא יָק֥וּמוּ עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/014.yaml
  text: Those who swear by the guilt of Samaria and say[a], ‘As your god, Dan, lives,’ and[c][b], ‘As the way of Beer-sheba lives,’ will fall and never rise again.
  footnotes:
  - marker: a
    text: Or 'by the sin of Samaria'; some understand this as a reference to an idol or deity associated with Samaria.
    reason: lexical_alternative
  - marker: b
    text: Or 'As your god of Dan lives.'
    reason: lexical_alternative
  - marker: c
    text: '''The way of Beer-sheba'' may refer to the pilgrimage route to Beer-sheba or to its cultic practice.'
    reason: alternative_reading
translation:
  language: ko
  text: 사마리아의 죄책[a]을 두고 맹세하며, “단이여, 네 신이 살아 있음을 두고 맹세합니다”[c]라고 말하고, 또 “브엘세바의 길[b]이 살아 있음을 두고 맹세합니다”라고 말하는 자들은 넘어질 것이며 다시는 일어나지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사마리아의 죄를 두고.” “사마리아의 죄책”은 사마리아와 관련된 죄책 또는 우상적 숭배 대상을 가리킬 수 있으며, 일부는 이를 특정 신명의 형태로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: “브엘세바의 길”은 브엘세바로 가는 순례길 또는 그곳과 관련된 예배 관행을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 압축된 표현입니다. “단이여, 네 신이…”로 이해할 수 있으며, “단의 네 신이…” 또는 “단에 있는 네 신이…”로 이해하기도 합니다.
    reason: source_note
lexical_decisions:
- source_word: הַנִּשְׁבָּעִים
  english_pob_choice: Those who swear
  chosen_korean: 맹세하는 자들
  alternatives_korean:
  - 맹세하는 사람들
  - ~로 맹세하는 자들
  lexicon: HALOT
  rationale: 분사형을 한국어에서 자연스러운 명사화로 옮겨, 심판받는 무리를 서술적으로 제시했습니다.
- source_word: בְּאַשְׁמַת שֹׁמְרוֹן
  english_pob_choice: by the guilt of Samaria
  chosen_korean: 사마리아의 죄로
  alternatives_korean:
  - 사마리아의 죄책으로
  - 사마리아의 죄악으로
  lexicon: HALOT
  rationale: אַשְׁמָה의 기본 뜻인 ‘죄/유죄/죄책’을 살리되, 한국어에서는 ‘죄로 맹세하다’가 가장 자연스러워 간명하게 옮겼습니다.
- source_word: חֵי אֱלֹהֶיךָ דָּן
  english_pob_choice: As your god, Dan, lives
  chosen_korean: “당신의 하나님, 단이 살아 계십니다”
  alternatives_korean:
  - “단의 당신의 하나님이 살아 계십니다”
  - “당신의 단의 하나님이 살아 계십니다”
  lexicon: HALOT
  rationale: 히브리어의 압축된 호격/소유 구조를 한국어에서는 ‘당신의 하나님, 단’으로 풀어, 단과 결부된 신적 대상이라는 점을 드러냈습니다.
- source_word: חֵי דֶּרֶךְ בְּאֵר שָׁבַע
  english_pob_choice: As the way of Beer-sheba lives
  chosen_korean: “브엘세바의 길이 살아 있습니다”
  alternatives_korean:
  - “브엘세바로 가는 길이 살아 있습니다”
  - “브엘세바의 순례길이 살아 있습니다”
  lexicon: HALOT
  rationale: דֶּרֶךְ의 문자적 의미를 본문에서 보존하여, 브엘세바와 관련된 길/관행이라는 해석 가능성을 열어 두었습니다.
- source_word: וְנָפְלוּ וְלֹא יָקוּמוּ עוֹד
  english_pob_choice: will fall and never rise again
  chosen_korean: 넘어지고 다시는 일어나지 못할 것입니다
  alternatives_korean:
  - 떨어지고 다시는 일어서지 못할 것입니다
  - 넘어져 다시는 일어나지 못할 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 한국어의 단정적 미래로 옮기면서, अंतिम성인 ‘다시는…못하다’의 뉘앙스를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 사마리아의 ‘죄’의 성격
  chosen_reading: 사마리아의 죄책/우상적 예배를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 사마리아의 우상
  - 사마리아의 신상
  - 사마리아의 죄악
  rationale: 본문은 사마리아와 결부된 불법적 숭배 대상을 겨냥하므로, 명시적 신명으로 단정하지 않고 ‘죄’의 의미를 살려 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
- issue: 브엘세바의 ‘길’
  chosen_reading: 문자적 표현을 본문에 유지하고, 의례적/순례적 함의를 해석으로 열어 두었습니다.
  alternative_readings:
  - 브엘세바로 가는 순례
  - 브엘세바의 종교 관습
  rationale: 히브리어의 압축성과 모호성을 해소해 버리기보다, 본문이 허용하는 범위 안에서 독자가 해석 가능성을 보도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
