- from: 사마리아의 죄로 맹세하는 자들, 곧 “당신의 하나님, 단이 살아 계십니다”라고 말하고 또 “브엘세바의 길이 살아 있습니다”라고 말하는 자들은 넘어지고 다시는 일어나지 못할 것입니다.[a][b][c]
  to: 사마리아의 죄책[a]을 두고 맹세하며, “단이여, 네 신이 살아 있음을 두고 맹세합니다”[c]라고 말하고, 또 “브엘세바의 길[b]이 살아 있음을 두고 맹세합니다”라고 말하는 자들은 넘어질 것이며 다시는 일어나지 못할 것입니다.
  rationale: 맹세 공식의 기능을 한국어에서 명시하고, 단에 관한 압축된 히브리어 구문은 유력한 호격 읽기로 자연스럽게 번역했습니다. 논쟁 가능한 신명·우상 해석과 브엘세바의 ‘길’의 의미는 본문에서 과도하게 확정하지 않고 각주에 보존했습니다. 심판의 미래성과 ‘다시는’의 최종성은 유지했습니다.
