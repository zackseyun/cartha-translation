  - severity: medium
    issue: ‘당신의 하나님, 단이’가 히브리어의 단(דן)을 부자연스럽게 처리합니다.
    rationale: דן은 유력하게 호격(‘단이여’)입니다. 현 번역은 단이 ‘하나님’의 동격인지 문장의 주어인지 불명료합니다. 다른 구문 이해는 각주로 보존하는 것이 안전합니다.
