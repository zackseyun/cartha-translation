id: AMO.8.7
reference: Amos 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁבַּ֥ע יְהוָ֖ה בִּ/גְא֣וֹן יַעֲקֹ֑ב אִם אֶשְׁכַּ֥ח לָ/נֶ֖צַח כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/007.yaml
  text: 'Yahweh has sworn by the pride of Jacob: Surely I will never forget any of their deeds[a][b].'
  footnotes:
  - marker: a
    text: Or 'by the glory of Jacob' or 'by the excellency of Jacob.' The Hebrew phrase may refer ironically to what Jacob prides himself in, or possibly to God as Jacob's true glory.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'if I forget forever any of their deeds'—an oath formula meaning 'surely I will never forget any of their deeds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 야곱의 자랑을 두고 맹세하셨습니다. “내가 그들의 어떤 행위도 영원히 잊지 않겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גָּאוֹן은 ‘자랑, 영광, 위엄, 탁월함’까지 아우를 수 있어, 문맥상 반어인지 하나님의 칭호인지가 열려 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 맹세 공식은 문자적으로 ‘내가 영원히 잊는다면’이지만, 뜻은 ‘나는 결코 잊지 않겠다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: יהוה는 고유 신명으로, POB의 원칙에 따라 한국어에서도 제목이 아니라 음역인 ‘야훼’로 옮겨 하나님의 고유 이름을 보존했습니다.
- source_word: בִּגְאוֹן
  english_pob_choice: by the pride of
  chosen_korean: 야곱의 자랑을 두고
  alternatives_korean:
  - 야곱의 영광을 두고
  - 야곱의 위엄을 두고
  - 야곱의 탁월함을 두고
  lexicon: HALOT
  rationale: גָּאוֹן은 ‘자랑/교만, 영광, 위엄’의 폭이 있어, 여기서는 모호성과 반어 가능성을 살리기 위해 ‘자랑’을 택했습니다.
- source_word: מַעֲשֵׂיהֶם
  english_pob_choice: their deeds
  chosen_korean: 그들의 어떤 행위도
  alternatives_korean:
  - 그들의 모든 행위도
  - 그들의 일도
  - 그들의 일한 것 중 아무것도
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 행위, 일, 공적을 뜻하므로 심판 문맥에 맞는 ‘행위’로 옮기되, 부정문 아래의 분배적 의미를 드러내기 위해 ‘어떤’과 결합했습니다.
- source_word: אִם אֶשְׁכַּח לָנֶצַח
  english_pob_choice: Surely I will never forget
  chosen_korean: 내가 ... 영원히 잊지 않겠습니다
  alternatives_korean:
  - 내가 ... 결코 잊지 않겠습니다
  - 내가 ... 영원토록 잊지 않겠습니다
  lexicon: HALOT
  rationale: 맹세 공식의 조건문이 실제로는 부정 서약을 뜻하므로, 직역형 ‘만일 내가 잊는다면’보다 한국어에서 자연스럽고 맹세의 힘을 살리는 ‘영원히 잊지 않겠습니다’로 풀었습니다.
theological_decisions:
- issue: ‘야곱의 자랑’의 의미를 확정할지 여부
  chosen_reading: 의미를 하나로 결정하지 않고, 원문의 반어적/양면적 가능성을 살린 채 그대로 유지했습니다.
  alternative_readings:
  - ‘야곱의 영광’으로 하나님을 가리키는 표현
  - ‘야곱의 탁월함/위엄’으로 이스라엘의 상태를 가리키는 표현
  rationale: 히브리어 הביטוי는 의도적으로 모호할 수 있으므로, 번역이 해석을 앞질러 긴장을 해소하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
