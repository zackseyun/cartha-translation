  chosen_reading: 아름다운 처녀들과 청년들 모두가 목마름으로 기절하는 것으로 그대로 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘지쳐 쓰러질 것입니다’처럼 완화해 옮김
