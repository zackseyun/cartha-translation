  rationale: 본문은 사회적으로 두드러진 젊은 집단 전체가 심판 아래 무너지는 장면을 직설적으로 제시하므로, 강도를 낮추지 않았습니다.
  doctrine_reference: 예언 심판의 직설적 경고
