  - 실신할 것입니다
  lexicon: HALOT
  rationale: 히트파엘 עלף는 기력이 빠져 의식을 잃는 상태를 가리키므로, 현대 한국어에서 의미가 분명한 ‘기절하다’를 택했습니다.
- source_word: הַבְּתוּלֹת הַיָּפוֹת
  english_pob_choice: the beautiful virgins
  chosen_korean: 아름다운 처녀들
