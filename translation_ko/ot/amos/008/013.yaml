lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그날에는
  alternatives_korean:
  - 그날에
  - 그때에는
  lexicon: HALOT
  rationale: 예언서의 전형적 시간 표지를 자연스러운 한국어로 옮기되, 지시적 강조를 살리기 위해 ‘그날에는’으로 처리했습니다.
- source_word: תִּתְעַלַּפְנָה
  english_pob_choice: will faint
  chosen_korean: 기절할 것입니다
  alternatives_korean:
  - 쓰러질 것입니다
  - 혼절할 것입니다
  - 실신할 것입니다
  lexicon: HALOT
  rationale: 히트파엘 עלף는 기력이 빠져 의식을 잃는 상태를 가리키므로, 현대 한국어에서 의미가 분명한 ‘기절하다’를 택했습니다.
- source_word: הַבְּתוּלֹת הַיָּפוֹת
  english_pob_choice: the beautiful virgins
  chosen_korean: 아름다운 처녀들
  alternatives_korean:
  - 아름다운 동정녀들
  - 아름다운 소녀들
  - 아름다운 젊은 여자들
  lexicon: HALOT
  rationale: בְּתוּלָה의 성적·사회적 구분을 지나치게 완화하지 않으면서도, 한국어에서 가장 직접적으로 대응되는 표현으로 ‘처녀’를 사용했습니다.
- source_word: וְהַבַּחוּרִים
  english_pob_choice: and the young men
  chosen_korean: 청년들
  alternatives_korean:
  - 젊은 남자들
  - 젊은이들
  - 총각들
  lexicon: HALOT
  rationale: בָּחוּר는 한창 젊은 남성을 가리키므로, 성별과 연령을 드러내는 표준적인 한국어로 ‘청년들’을 선택했습니다.
theological_decisions:
- issue: 재앙의 범위가 미화되지 않고 동일하게 양쪽 집단에 미친다는 점
  chosen_reading: 아름다운 처녀들과 청년들 모두가 목마름으로 기절하는 것으로 그대로 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘지쳐 쓰러질 것입니다’처럼 완화해 옮김
  - 서술을 비유적으로 처리함
  rationale: 본문은 사회적으로 두드러진 젊은 집단 전체가 심판 아래 무너지는 장면을 직설적으로 제시하므로, 강도를 낮추지 않았습니다.
  doctrine_reference: 예언 심판의 직설적 경고
