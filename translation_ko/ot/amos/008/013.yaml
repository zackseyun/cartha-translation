  lexicon: HALOT
  rationale: 예언서의 전형적 시간 표지를 자연스러운 한국어로 옮기되, 지시적 강조를 살리기 위해 ‘그날에는’으로 처리했습니다.
- source_word: תִּתְעַלַּפְנָה
  english_pob_choice: will faint
  chosen_korean: 기절할 것입니다
  alternatives_korean:
  - 쓰러질 것입니다
