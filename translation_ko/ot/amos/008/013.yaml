  - 아름다운 젊은 여자들
  lexicon: HALOT
  rationale: בְּתוּלָה의 성적·사회적 구분을 지나치게 완화하지 않으면서도, 한국어에서 가장 직접적으로 대응되는 표현으로 ‘처녀’를 사용했습니다.
