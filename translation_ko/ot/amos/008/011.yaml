  text: הִנֵּ֣ה יָמִ֣ים בָּאִ֗ים נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִשְׁלַחְתִּ֥י רָעָ֖ב בָּ/אָ֑רֶץ לֹֽא רָעָ֤ב לַ/לֶּ֨חֶם֙ וְ/לֹֽא צָמָ֣א לַ/מַּ֔יִם כִּ֣י אִם לִ/שְׁמֹ֔עַ אֵ֖ת דִּבְרֵ֥י יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/011.yaml
  text: Behold[a], days are coming, declares the Lord GOD, when I will send a famine on the land—not a famine for bread, nor a thirst for water, but for hearing the words of Yahweh.
  footnotes:
  - marker: a
    text: Or 'to hear the words of the LORD.' The Hebrew infinitive can be rendered more directly this way; 'for hearing' was chosen to preserve the parallel with 'for bread' and 'for water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「보십시오, 날들이 오고 있습니다. 주 야훼의 말씀입니다. 내가 이 땅에 기근을 보내겠습니다. 그것은 양식의 기근도 아니고 물의 갈증도 아니라, 야훼의 말씀을 듣지 못하는 기근입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 말씀을 듣는 것에 대한 기근’입니다. 히브리어 부정사는 ‘듣기’로도 옮길 수 있으며, 여기서는 양식과 물의 결핍에 비유된 말씀을 듣는 일의 결핍을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
