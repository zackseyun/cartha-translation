revisions:
- from: 「보라, 날들이 오고 있습니다」— 주 야훼의 선언입니다. 내가 이 땅에 기근을 보내겠는데, 그것은 빵에 대한 기근도 아니고 물에 대한 목마름도 아니라, 야훼의 말씀을 들으려는 것에 대한 기근입니다.[a]
  to: 「보십시오, 날들이 오고 있습니다. 주 야훼의 말씀입니다. 내가 이 땅에 기근을 보내겠습니다. 그것은 양식의 기근도 아니고 물의 갈증도 아니라, 야훼의 말씀을 듣지 못하는 기근입니다.[a]」
  rationale: 본문의 예언적 선언, 신명, 양식과 물의 부정된 결핍, 그리고 말씀을 듣는 일의 결핍이라는 은유를 유지했습니다. ‘듣지 못하는’은 원문의 부정사를 의지 표현으로 바꾸지 않으면서 한국어에서 ‘기근’의 결핍 의미를 명료하게 드러냅니다. 각주는 영어 POB 감사 기록의 부정사 대안과 동일한 쟁점에 연결했습니다.
