  source_fidelity: 수정이 필요합니다. 초안의 ‘야훼의 말씀을 들으려는 것’은 히브리어 לִשְׁמֹעַ(‘듣는 것/듣기 위해’)에 없는 의지·소망의 뜻을 더합니다. 또한 히브리어 דִּבְרֵי는 복수이나, 한국어의 집합적 존칭 명사 ‘말씀’은 이 문맥에서 자연스럽게 그 뜻을 포괄합니다.
  naturalness: ‘빵에 대한 기근’, ‘물에 대한 목마름’, 특히 ‘들으려는 것에 대한 기근’은 현대 표준 한국어로 다소 부자연스럽습니다. ‘양식의 기근’, ‘물의 갈증’, ‘말씀을 듣지 못하는 기근’으로 다듬으면 평행과 은유를 유지하면서도 자연스럽습니다. ‘보십시오’와 ‘보내겠습니다’는 요청된 현대 합쇼체에 맞습니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. אֲדֹנָי יְהוִה는 ‘주 야훼’로, נְאֻם은 ‘말씀입니다’로 옮겨 신명과 선언 공식을 보존했습니다. 영어 감사 기록의 부정사 관련 각주는 ‘듣지 못하는 기근’에 연결하도록 바로잡았습니다.
  issues:
