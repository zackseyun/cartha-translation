  - 보게
  lexicon: HALOT
  rationale: 예언적 경고와 주의를 환기하는 감탄사로, 한국어에서도 '보라'가 가장 직접적으로 긴박한 선포의 힘을 살립니다.
- source_word: יָמִים בָּאִים
