  lexicon: HALOT
  rationale: 미래 임박성을 드러내는 예언 관용구를 자연스러운 현대 한국어 현재진행형으로 옮겨, 다가오는 심판의 긴박함을 살렸습니다.
- source_word: רָעָב לַלֶּחֶם / צָמָא לַמַּיִם
  english_pob_choice: not a famine for bread, nor a thirst for water
  chosen_korean: 빵에 대한 기근도 아니고 물에 대한 목마름도 아니라
  alternatives_korean:
  - 양식에 대한 기근도 아니고 물에 대한 갈증도 아니라
  - 떡에 대한 기근도 아니고 물에 대한 목마름도 아니라
  lexicon: HALOT
  rationale: 히브리어의 평행 구조를 유지하되, 오늘 한국어에서 '빵'이 더 직접적으로 기본 양식을 가리켜 자연스럽게 읽히도록 했습니다.
- source_word: לִשְׁמֹעַ אֵת דִּבְרֵי יְהוָה
  english_pob_choice: for hearing the words of Yahweh
  chosen_korean: 야훼의 말씀을 들으려는 것에 대한 기근입니다
  alternatives_korean:
  - 야훼의 말씀을 들음에 대한 기근입니다
  - 야훼의 말씀을 들을 수 없는 기근입니다
  lexicon: HALOT
  rationale: '''for hearing''의 목적·결핍 의미를 한국어에서 가장 분명하게 드러내기 위해 명사화하여 옮겼고, ‘말씀’을 단수형으로도 읽을 수 있는 히브리어 표현을 문맥상 자연스럽게 반영했습니다.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신명(神名) יְהוָה는 '야훼'로 옮겨, 본문의 언약적 고유성을 보존했습니다.
theological_decisions:
- issue: 주 아도나이와 야훼의 병렬 호칭
  chosen_reading: 주 야훼의 선언입니다
  alternative_readings:
  - 주 하나님의 선언입니다
  - 주 여호와의 선언입니다
  rationale: 히브리어 אֲדֹנָי יְהוִה의 결합을 한국어에서 직역적으로 드러내되, '야훼'를 사용해 신명과 주권 호칭의 구분을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 기근의 성격
  chosen_reading: 야훼의 말씀을 들으려는 것에 대한 기근입니다
  alternative_readings:
  - 영적 기근입니다
  - 말씀의 결핍입니다
  rationale: 본문이 빵과 물의 실제 결핍을 부정하고 '들음'의 결핍을 말하므로, 이를 해석적으로 완화하지 않고 본문의 은유를 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
