language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/קְנ֤וֹת בַּ/כֶּ֨סֶף֙ דַּלִּ֔ים וְ/אֶבְי֖וֹן בַּ/עֲב֣וּר נַעֲלָ֑יִם וּ/מַפַּ֥ל בַּ֖ר נַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/006.yaml
  text: to buy the poor for silver[a], and the needy for a pair of sandals, and sell the sweepings of the grain.
  footnotes:
  - marker: a
    text: Or 'the refuse of the wheat' or 'the fallen grain'; the Hebrew likely refers to inferior grain remnants being sold as merchandise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 은으로 가난한 사람들을 사며, 한 켤레의 샌들 값으로 궁핍한 사람들을 사서, 곡식의 찌꺼기를 팔 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘곡식의 찌꺼기/부스러기/떨어진 곡식’의 뉘앙스를 가리키며, 열등한 곡물 잔여물을 상품처럼 팔았다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְנוֹת
  english_pob_choice: to buy
  chosen_korean: 사며
  alternatives_korean:
  - 사들여
  - 구매하며
  lexicon: HALOT
  rationale: 매매 행위를 그대로 드러내는 기본 동사 ‘사다’가 가장 직접적이며, 앞뒤 문맥의 착취적 거래를 자연스럽게 살립니다.
- source_word: בַּכֶּסֶף
  english_pob_choice: for silver
  chosen_korean: 은으로
  alternatives_korean:
  - 은 값으로
  - 돈으로
  lexicon: HALOT
  rationale: 히브리어 כסף의 구체성을 살려 ‘은’으로 옮기되, 거래 수단/대가의 의미가 분명하도록 조사 ‘-으로’를 붙였습니다.
- source_word: דַּלִּים / אֶבְיוֹן
  english_pob_choice: the poor / the needy
  chosen_korean: 가난한 사람들 / 궁핍한 사람들
  alternatives_korean:
  - 가난한 자들 / 빈궁한 자들
  - 가난한 이들 / 필요한 이들
  lexicon: HALOT
  rationale: 두 표현은 의미가 겹치지만 완전히 같지 않으므로, 두 번째를 ‘궁핍한’으로 옮겨 병행성을 유지하면서도 차이를 살렸습니다.
- source_word: בַּעֲבוּר נַעֲלָיִם
  english_pob_choice: for a pair of sandals
  chosen_korean: 한 켤레의 샌들 값으로
  alternatives_korean:
  - 한 켤레의 신발 값으로
  - 샌들 한 켤레로
  lexicon: HALOT
  rationale: 쌍수형 נַעֲלָיִם을 ‘한 켤레’로 자연스럽게 살렸고, 값의 하찮음을 드러내는 문맥상 ‘값으로’가 적절합니다.
- source_word: וּמַפַּל בַּר
  english_pob_choice: the sweepings of the grain
  chosen_korean: 곡식의 찌꺼기
  alternatives_korean:
  - 곡식의 부스러기
  - 밀의 찌꺼기
  - 떨어진 곡식
  lexicon: HALOT
  rationale: מַפַּל은 떨어져 나온 것, 찌꺼기, 부스러기의 뜻을 포함하므로 상업적으로 팔리는 열등한 잔여물을 포괄적으로 드러내는 ‘찌꺼기’가 적합합니다.
- source_word: נַשְׁבִּיר
  english_pob_choice: and sell
  chosen_korean: 팔 것입니다
  alternatives_korean:
  - 팔고 있습니다
  - 팔아넘길 것입니다
  lexicon: HALOT
  rationale: 히브리어의 상업적 용법을 따라 단순히 ‘팔다’로 옮기되, 종결을 미래형으로 처리해 예언적 비난의 진술 형식을 살렸습니다.
theological_decisions:
- issue: 가난한 사람들을 상품처럼 매매하는 착취의 뉘앙스
  chosen_reading: 문맥이 사람을 ‘사다’는 표현을 실제 매매 행위로 유지하여, 사회경제적 착취와 비인격화를 그대로 드러내도록 옮겼습니다.
  alternative_readings:
  - 가난한 사람들을 ‘얻다’로 순화
  - ‘구입하다’로 중립화
  rationale: 선지자적 고발의 강도를 약화시키지 않기 위해, 경제행위를 완곡하게 만들지 않고 원문이 주는 폭력을 보존했습니다.
  doctrine_reference: 예언서의 사회정의 심판 선언
