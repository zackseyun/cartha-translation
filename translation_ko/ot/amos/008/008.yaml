  text: הַ֤/עַל זֹאת֙ לֹֽא תִרְגַּ֣ז הָ/אָ֔רֶץ וְ/אָבַ֖ל כָּל יוֹשֵׁ֣ב בָּ֑/הּ וְ/עָלְתָ֤ה כָ/אֹר֙ כֻּלָּ֔/הּ וְ/נִגְרְשָׁ֥ה ו/נשקה כִּ/יא֥וֹר מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/008.yaml
  text: Because of this[a], will not the land tremble, and every one who dwells in it mourn? All of it will rise like the Nile[b]; it will be driven along and sink like the Nile of Egypt.
  footnotes:
  - marker: a
    text: Or 'the earth' instead of 'the land.' The Hebrew אֶרֶץ can bear either sense; here the local sense is preferred because the verse focuses on the judged territory and its inhabitants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like the Nile ... like the Nile of Egypt.' The image is of the Nile's annual rising and subsiding, used here as a picture of overwhelming upheaval.
    reason: cultural_note
translation:
  language: ko
  text: 이 때문에 땅[a]이 떨지 않겠으며, 그 안에 사는 모든 사람이 애통하지 않겠습니까? 땅 전체가 나일강[b]처럼 솟아오르고, 이집트의 나일강처럼 떠밀려 흔들리다가 가라앉을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 심판받는 지역과 그 거주민에 초점이 있으므로 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘나일강처럼 … 이집트의 나일강처럼’이라고 반복합니다. 나일강의 불어남과 물러감을 빌려 압도적인 격변을 그린 비유입니다.
    reason: cultural_note
