  - 땅이 진동하지 않겠으며
  - 땅이 뒤흔들리지 않겠으며
  lexicon: HALOT
  rationale: רגז의 물리적 흔들림과 심판의 긴장을 함께 살리기 위해 '떨다'를 택했습니다.
- source_word: וְאָבַל כָּל יוֹשֵׁב בָּהּ
  english_pob_choice: every one who dwells in it mourn
  chosen_korean: 그 안에 사는 모든 사람이 애통하지 않겠습니까
  alternatives_korean:
  - 그 안에 사는 모든 사람이 슬퍼하지 않겠습니까
  - 그 안에 거주하는 모든 사람이 애곡하지 않겠습니까
  - 그 안에 사는 모든 이가 울지 않겠습니까
  lexicon: HALOT
  rationale: אָבַל은 단순한 슬픔보다 장례적 애통을 포함하므로 '애통하다'가 문맥상 더 강하고 정확합니다.
- source_word: וְעָלְתָה כָאֹר כֻּלָּהּ ... וְנִגְרְשָׁה וְנשקה
  english_pob_choice: All of it will rise like the Nile; it will be driven along and sink
  chosen_korean: 온 땅이 나일강처럼 솟아오를 것이며, 흩날려 올라가고 ... 가라앉을 것입니다
  alternatives_korean:
  - 온 땅이 나일강처럼 치솟을 것이며, 밀려 올라가고 ... 가라앉을 것입니다
  - 온 땅이 나일강처럼 불어날 것이며, 떠밀려 올라가고 ... 가라앉을 것입니다
  - 온 땅이 나일강처럼 올라올 것이며, 밀려다니다가 ... 가라앉을 것입니다
  lexicon: HALOT
  rationale: 이 구절의 이미지가 나일강의 범람과 되돌아감을 비유하므로 '솟아오르다/흩날려 올라가다/가라앉다'로 물의 동세를 살렸습니다.
theological_decisions:
- issue: 지리적 심판 대상의 범위
  chosen_reading: '''땅''으로 옮겨 지역적 심판의 대상과 그 거주민을 함께 드러냈습니다.'
  alternative_readings:
  - '''온 땅''으로 보편적 의미를 더 강하게 살리는 읽기'
  - '''땅'' 대신 ''세상''으로 확장하는 읽기'
  rationale: 문맥상 아모스의 심판은 특정한 땅과 그 주민을 겨냥하므로, 일반화보다 지역적 의미를 우선했습니다.
  doctrine_reference: 예언서 문맥과 אֶרֶץ의 의미 범위
- issue: 나일강 비유의 기능
  chosen_reading: 나일강의 연간 범람과 물러감을 심판의 격변 이미지로 보았습니다.
  alternative_readings:
  - 단순한 홍수 이미지로만 보는 읽기
  - 지진적 흔들림과만 연결하는 읽기
  rationale: 히브리어의 상승-흐름-가라앉음 연쇄는 나일강의 범람과 퇴조를 배경으로 한 시각적 비유를 형성합니다.
  doctrine_reference: 시적 비유와 예언적 심판 이미지
