  source_fidelity: 첫 두 절반은 히브리어의 인과적 수사 의문문과 애도의 뜻을 충실히 반영합니다. 그러나 וְנִגְרְשָׁה는 땅/물의 격렬한 움직임을 나타내는 말인데, 초안의 ‘흩날려 올라가고’는 바람에 날리는 물체의 이미지를 불러오며 ‘올라감’을 불필요하게 반복합니다. ‘떠밀려 흔들리다가’는 이어지는 침강과 나일강 비유를 더 정확히 살립니다.
  naturalness: ‘땅이 떨지 않겠으며’와 ‘애통하지 않겠습니까?’는 현대 합쇼체의 예언적 수사 질문으로 자연스럽습니다. 다만 ‘흩날려 올라가고’는 땅이나 범람하는 강의 움직임에 자연스럽지 않습니다. ‘땅 전체가’는 כֻּלָּהּ를 명료하게 드러내면서도 자연스럽습니다.
  terminology: אָבַל의 애도 의미에는 ‘애통하다’가 적절하고, אֶרֶץ는 문맥상 ‘땅’으로 유지하는 것이 타당합니다. ‘나일강’은 יְאֹר 및 뒤따르는 ‘이집트’의 명시와 잘 맞습니다. 원문의 두 나일강 비교 및 영어 감사 기록의 문화 주석을 한국어 각주에도 반영하고, 각주 표지를 해당 어휘에 정확히 붙였습니다.
