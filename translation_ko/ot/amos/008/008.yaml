theological_decisions:
- issue: 지리적 심판 대상의 범위
  chosen_reading: '''땅''으로 옮겨 지역적 심판의 대상과 그 거주민을 함께 드러냈습니다.'
  alternative_readings:
  - '''온 땅''으로 보편적 의미를 더 강하게 살리는 읽기'
  - '''땅'' 대신 ''세상''으로 확장하는 읽기'
  rationale: 문맥상 아모스의 심판은 특정한 땅과 그 주민을 겨냥하므로, 일반화보다 지역적 의미를 우선했습니다.
  doctrine_reference: 예언서 문맥과 אֶרֶץ의 의미 범위
- issue: 나일강 비유의 기능
  chosen_reading: 나일강의 연간 범람과 물러감을 심판의 격변 이미지로 보았습니다.
  alternative_readings:
  - 단순한 홍수 이미지로만 보는 읽기
  - 지진적 흔들림과만 연결하는 읽기
  rationale: 히브리어의 상승-흐름-가라앉음 연쇄는 나일강의 범람과 퇴조를 배경으로 한 시각적 비유를 형성합니다.
  doctrine_reference: 시적 비유와 예언적 심판 이미지
