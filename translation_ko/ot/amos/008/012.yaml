id: AMO.8.12
reference: Amos 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָעוּ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/צָּפ֖וֹן וְ/עַד מִזְרָ֑ח יְשֽׁוֹטְט֛וּ לְ/בַקֵּ֥שׁ אֶת דְּבַר יְהוָ֖ה וְ/לֹ֥א יִמְצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/012.yaml
  text: They will wander from sea to sea[a], and from north to east; they will roam about seeking the word of Yahweh[b], but they will not find it.
  footnotes:
  - marker: a
    text: Or 'they will run to and fro' for 'they will roam about.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the word of the LORD'; that is, a divine message or revelation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바다에서 바다까지, 북쪽에서 동쪽까지 헤매며 야훼의 말씀을 찾을 것입니다. 그러나 그것을 찾지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이리저리 뛰어다니며’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 말씀’이며, 곧 신적 메시지 또는 계시를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  english_pob_choice: they will wander
  chosen_korean: 헤매며
  alternatives_korean:
  - 방황하며
  - 이리저리 다니며
  - 정처 없이 다니며
  lexicon: HALOT
  rationale: 탐색과 절박한 이동을 함께 드러내기 위해 ‘헤매다’를 택했습니다. ‘흔들리다/비틀거리다’보다 문맥상 지리적·정서적 방황이 더 분명합니다.
- source_word: מִיָּם עַד יָם וּמִצָּפוֹן וְעַד מִזְרָח
  english_pob_choice: from sea to sea, and from north to east
  chosen_korean: 바다에서 바다까지, 북쪽에서 동쪽까지
  alternatives_korean:
  - 서쪽에서 서쪽까지, 북쪽에서 동쪽까지
  - 이 바다에서 저 바다까지, 북쪽에서 동쪽까지
  lexicon: HALOT
  rationale: 히브리어의 방향 감각과 시적 병행을 살리기 위해 직역에 가깝게 옮겼습니다. ‘동쪽’은 מִזְרָח의 기본 의미를 현대 한국어로 자연스럽게 전달합니다.
- source_word: לְבַקֵּשׁ אֶת דְּבַר יְהוָה
  english_pob_choice: seeking the word of Yahweh
  chosen_korean: 야훼의 말씀을 찾을 것입니다
  alternatives_korean:
  - 야훼의 말씀을 구할 것입니다
  - 야훼의 말씀을 찾으려 할 것입니다
  - 주님의 말씀을 찾을 것입니다
  lexicon: HALOT
  rationale: ‘דָּבָר’는 여기서 예언적 ‘말씀/계시’를 뜻하므로 ‘말씀’이 적합합니다. 동사는 목적의 의미를 살려 ‘찾다’로 옮겨, 영어 POB의 ‘seek’와 히브리어의 탐색성을 함께 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: POB 기준에 따라 신적 고유명은 ‘야훼’로 음역합니다. 예언서에서 언약적 고유명을 보존하기 위해 관용적 대체어 ‘주’는 쓰지 않았습니다.
theological_decisions:
- issue: 여호와/주로 대체하지 않고 야훼의 고유명을 보존하는 문제
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨, 단순 직함이 아니라 하나님이 이스라엘에게 드러내신 이름을 드러냈습니다.
  alternative_readings:
  - ‘주’로 번역
  - 전통적 음역 ‘여호와’ 사용
  rationale: 이 절은 예언적 ‘말씀’의 부재를 말하며, 그 말씀의 출처가 되는 언약적 이름을 드러내는 것이 문맥상 중요합니다. POB의 명시적 방침과도 일치합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
