translation:
  language: ko
  text: “이 말을 들으십시오. 가난한 이를 짓밟고[a] 이 땅의 가난한 이들을 사라지게 하려 하는 자들아.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘가난한 이를 탐내는’ 또는 ‘가난한 이를 삼키는’으로도 옮길 수 있습니다. 이 분사는 탐욕스럽고 포식적인 억압의 생생한 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들어라
  lexicon: WLC/HALOT
  rationale: 예언자적 직접 호소의 명령형을 살리되, 현대 합쇼체에 맞게 공적 경고의 어조를 유지했습니다.
- source_word: הַשֹּׁאֲפִים אֶבְיוֹן
  english_pob_choice: you who trample the needy
  chosen_korean: 가난한 이를 짓밟고
  alternatives_korean:
  - 가난한 이를 탐내며
  - 가난한 이를 삼키고
  lexicon: WLC/HALOT
  rationale: 히브리어 분사 שאף의 폭력적·포식적 이미지를 한국어로는 ‘짓밟다’로 옮겨, POB의 ‘trample’ 선택이 드러내는 억압성을 살렸습니다.
- source_word: אֶבְיוֹן / ענוי
  english_pob_choice: the needy / the poor
  chosen_korean: 가난한 이들 / 궁핍한 이들
  alternatives_korean:
  - 궁핍한 사람들 / 가난한 사람들
  - 빈곤한 이들
  lexicon: WLC/HALOT
  rationale: אֶבְיוֹן과 ענו이 겹치지만 완전히 동일하지 않으므로, 앞은 ‘가난한 이’, 뒤는 ‘궁핍한 이들’로 약간 구분해 사회경제적 압박을 유지했습니다.
- source_word: וְלַשְׁבִּית
  english_pob_choice: and bring ... to an end
  chosen_korean: 끝장내려
  alternatives_korean:
  - 끝내려
  - 사라지게 하려
  lexicon: WLC/HALOT
  rationale: causative ‘~하게 하다/끝나게 하다’의 힘을 현대 한국어에서 자연스럽게 전달하되, 단순한 소멸보다 폭력적 의도를 드러내기 위해 ‘끝장내다’를 택했습니다.
- source_word: אָרֶץ
  english_pob_choice: the land
  chosen_korean: 이 땅
  alternatives_korean:
  - 그 땅
  - 땅
  lexicon: WLC/HALOT
  rationale: 아모스 문맥의 ארץ를 추상적 ‘세상’이 아니라 구체적 사회-정치적 공간으로 읽어 ‘이 땅’으로 옮겼습니다.
theological_decisions:
- issue: 예언자적 고발의 어조
  chosen_reading: 직접 호소형 명령문과 2인칭 복수 호칭을 유지해, 청중을 향한 공적 심판 경고로 읽히게 했습니다.
  alternative_readings:
  - 서술형으로 완화
  - 비난보다 설명 중심으로 조정
  rationale: 본문은 단순 정보 전달이 아니라 언약 공동체의 착취를 정면 고발하는 선포이므로, 한국어에서도 날카로운 경고성을 보존해야 합니다.
  doctrine_reference: 예언서의 심판 선포와 사회적 정의
- issue: 히브리어 분사의 폭력적 이미지
  chosen_reading: ‘짓밟다’로 옮겨 경제적 착취가 단순 무관심이 아니라 폭력적 억압임을 드러냈습니다.
  alternative_readings:
  - ‘압제하다’로 일반화
  - ‘해치다’로 약화
  rationale: POB의 주석이 밝히듯 원문 분사는 포식적·폭력적 이미지를 담으므로, 이를 약화하지 않고 한국어에서 즉시 이해되는 표현으로 살렸습니다.
  doctrine_reference: 가난한 자에 대한 억압 금지와 사회 정의
