  terminology: אֶבְיוֹן은 ‘궁핍한 이’, עֲנִיֵּי־אָרֶץ는 ‘이 땅의 가난한 이들’로 구별했습니다. הַשֹּׁאֲפִים의 본문 선택인 ‘짓밟고’는 유지하되, 논쟁적인 어휘 이미지는 해당 단어에 각주를 연결했습니다.
