id: AMO.8.10
reference: Amos 8:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָפַכְתִּ֨י חַגֵּי/כֶ֜ם לְ/אֵ֗בֶל וְ/כָל שִֽׁירֵי/כֶם֙ לְ/קִינָ֔ה וְ/הַעֲלֵיתִ֤י עַל כָּל מָתְנַ֨יִם֙ שָׂ֔ק וְ/עַל כָּל רֹ֖אשׁ קָרְחָ֑ה וְ/שַׂמְתִּ֨י/הָ֙ כְּ/אֵ֣בֶל יָחִ֔יד וְ/אַחֲרִיתָ֖/הּ כְּ/י֥וֹם מָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/010.yaml
  text: I will turn your feasts into mourning[a], and all your songs into lamentation; I will bring sackcloth on every waist and baldness on every head; I will make it like mourning for an only son[d][c][b], and its end like a bitter day.
  footnotes:
  - marker: a
    text: Or 'your festivals.'
    reason: lexical_alternative
  - marker: b
    text: Or 'into a dirge' for 'into lamentation.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'like mourning for an only one'; the sense is commonly understood as mourning for an only son.
    reason: lexical_alternative
  - marker: d
    text: Or 'like a day of bitterness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희의 절기를 애도로 바꾸고[a], 너희의 모든 노래를 애가로 바꾸며[b], 모든 허리에 굵은베를 두르고[c] 모든 머리마다 대머리가 되게 하리라. 나는 그것을 외아들을 위한 애도[d]와 같게 만들고, 그 끝을 쓰디쓴 날처럼 만들겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 축제들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘슬픈 노래로’.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘허리마다 굵은베’입니다.
    reason: source_note
  - marker: d
    text: 히브리어는 문자적으로 ‘외아들 하나를 위한 애도’이지만, 통상 ‘외아들’의 죽음으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַגֵּיכֶם
  english_pob_choice: your feasts
  chosen_korean: 너희의 절기
  alternatives_korean:
  - 너희의 잔치
  - 너희의 축제
  lexicon: HALOT
  rationale: חַג는 단순한 사교 잔치보다 절기적·예배적 성격의 축제를 가리키므로, 한국어에서는 ‘절기’가 원문의 종교적 분위기를 가장 잘 살립니다.
- source_word: לְאֵבֶל
  english_pob_choice: into mourning
  chosen_korean: 애도로
  alternatives_korean:
  - 슬픔으로
  - 상중으로
  lexicon: HALOT
  rationale: אֵבֶל은 죽음 앞의 공식적 애도 상태를 뜻하므로, 감정 일반인 ‘슬픔’보다 ‘애도’가 더 정확합니다.
- source_word: לְקִינָה
  english_pob_choice: into lamentation
  chosen_korean: 애가로
  alternatives_korean:
  - 통곡으로
  - 탄식으로
  lexicon: HALOT
  rationale: קִינָה는 장례적 성격의 애가이므로, 문학적·의례적 뉘앙스를 살리는 ‘애가’가 적합합니다.
- source_word: וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק ... וְעַל כָּל רֹאשׁ קָרְחָה
  english_pob_choice: I will bring sackcloth on every waist ... baldness on every head
  chosen_korean: 모든 허리에 굵은베를 두르고 모든 머리마다 대머리가 되게 하리라
  alternatives_korean:
  - 모든 허리에 상복을 두르고 모든 머리에 대머리를 주며
  - 모든 허리에 굵은베를 입히고 모든 머리를 밀게 하리라
  lexicon: HALOT
  rationale: ‘굵은베’는 상복의 상징을 한국어로 자연스럽게 옮기며, ‘대머리가 되게 하리라’는 קָרְחָה의 애도 표지를 직설적으로 보존합니다.
- source_word: כְּאֵבֶל יָחִיד
  english_pob_choice: like mourning for an only son
  chosen_korean: 외아들을 위한 애도
  alternatives_korean:
  - 외아들 하나를 위한 애도
  - 외아들을 잃은 슬픔
  lexicon: HALOT
  rationale: יָחִיד는 본래 ‘홀로 있는 하나’이지만, 이 관용구는 통상 ‘외아들’의 죽음을 가리키는 장례 이미지이므로 그 함의를 살렸습니다.
theological_decisions:
- issue: 히브리어 여성형 대명사 -הּ의 지시 대상
  chosen_reading: ‘그것’으로 옮겨, 절기들이 뒤바뀐 공동체의 전체 처지를 가리키는 열린 표현으로 남겼습니다.
  alternative_readings:
  - ‘그녀’로 옮겨 땅을 가리킴
  - ‘그것’으로 옮겨 절기 자체를 가리킴
  rationale: 문맥상 여성형 지시어는 땅, 도시, 또는 지금 말한 집단적 상황을 가리킬 수 있으므로, 한국어에서 특정 대상을 확정하지 않고 중립적으로 유지했습니다.
  doctrine_reference: 본문의 문맥적 모호성 보존
