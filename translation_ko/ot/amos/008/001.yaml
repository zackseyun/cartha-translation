base_translation:
  language: en
  yaml_path: translation/ot/amos/008/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], a basket of summer fruit.'
  footnotes:
  - marker: a
    text: Or 'a basket of ripe fruit.' The Hebrew says 'summer fruit,' a wording that sets up the sound-play with 'end' in the next verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 야훼께서 내게 이와 같이 보여 주셨습니다. 보십시오, 여름 과일 한 광주리입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘익은 과일 한 광주리’입니다. 히브리어는 ‘여름 과일’이라고 되어 있으며, 이는 다음 절의 ‘끝’과의 음성 유희를 예고합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  english_pob_choice: This is what
  chosen_korean: 이러하셨습니다
  alternatives_korean:
  - 이것이 …입니다
  - 이와 같이 말씀하셨습니다
  lexicon: HALOT
  rationale: 예언 환시 서두의 선언형 도입으로, 보고받은 내용을 자연스럽게 시작하는 현대 한국어 표현을 택했습니다.
- source_word: הִרְאַנִי
  english_pob_choice: showed me
  chosen_korean: 내게 이러하셨습니다
  alternatives_korean:
  - 내게 보여 주셨습니다
  - 내가 보게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 ‘보이게 하다/보여 주다’ 의미를 살리되, 환시 공식에서 매끄러운 합쇼체로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  lexicon: HALOT
  rationale: 아도나이와 YHWH가 결합한 호칭은 한국어에서 ‘주 하나님’이 가장 자연스럽고, ‘주 주님’ 같은 중복을 피하면서도 신적 칭호의 무게를 유지합니다.
- source_word: כְּלוּב
  english_pob_choice: basket
  chosen_korean: 광주리
  alternatives_korean:
  - 바구니
  - 바스켓
  lexicon: HALOT
  rationale: 문맥상 여름 과일을 담는 용기이므로, 한국어 성경에서 익숙한 ‘광주리’가 내용과 장면성을 잘 전달합니다.
- source_word: קָיִץ
  english_pob_choice: summer fruit
  chosen_korean: 여름 과일
  alternatives_korean:
  - 여름 열매
  - 익은 과일
  lexicon: HALOT
  rationale: 다음 절의 ‘끝’(קֵץ)과의 말장난을 뒷받침하려면 단순히 ‘과일’보다 ‘여름 과일’이 원문 연결을 더 분명히 드러냅니다.
theological_decisions:
- issue: YHWH의 한국어 표기와 아도나이 결합 호칭
  chosen_reading: ‘주 하나님’으로 통일하여 읽되, 합성 칭호의 예언적 장엄성을 유지했습니다.
  alternative_readings:
  - 야훼
  - 주 여호와
  rationale: 이 절은 אֲדֹנָי 뒤에 YHWH가 붙는 고유한 결합형이므로, 한국어에서는 중복 없이 자연스러운 ‘주 하나님’이 가장 직접적이며 공적 낭독에도 적합합니다.
  doctrine_reference: 'POB rendering policy: YHWH name handling in compound divine titles'
