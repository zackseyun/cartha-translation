revisions:
- from: 말하기를, “언제면 초하루가 지나서 우리가 곡식을 팔 수 있을까? 그리고 안식일이 지나서 우리가 밀을 내다 팔 수 있을까 — 에바를 작게 하고 세겔을 크게 하며, 속이는 저울을 왜곡하려고 말입니다.”[a][b]
  to: 말하기를, “언제 초하루[a]가 지나 우리가 곡식을 팔 수 있겠으며, 안식일이 지나 우리가 밀을 내다 팔 수 있겠는가? 에바를 작게 하고 세겔을 크게 하며[b], 속임수 저울을 조작하려는 것이다.”
  rationale: 마지막 세 부정행위를 거래 재개를 바라는 화자의 목적과 자연스럽게 연결하도록 문장을 고쳤습니다. ‘속임수 저울을 조작하다’는 עוה(구부리다, 왜곡하다, 부정하게 만들다)와 ‘저울들의 속임’이라는 원문의 이미지를 현대 한국어로 무리 없이 전달합니다. 각주 내용은 유지하되 해당 본문 어구 바로 뒤로 표지를 옮겼습니다.
