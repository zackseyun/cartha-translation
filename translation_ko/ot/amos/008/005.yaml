  terminology: ‘초하루’, ‘안식일’, ‘에바’, ‘세겔’은 적절합니다. מֹאזְנֵי מִרְמָה는 ‘속이는 저울’보다 ‘속임수 저울’ 또는 ‘부정한 저울’이 자연스럽습니다. ‘속임수 저울’은 명사의 속임/사기 성격을 잘 나타내며 특정 교리적 해석을 더하지 않습니다.
