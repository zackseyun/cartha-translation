source:
  edition: WLC
  text: לֵ/אמֹ֗ר מָתַ֞י יַעֲבֹ֤ר הַ/חֹ֨דֶשׁ֙ וְ/נַשְׁבִּ֣ירָה שֶּׁ֔בֶר וְ/הַ/שַּׁבָּ֖ת וְ/נִפְתְּחָה בָּ֑ר לְ/הַקְטִ֤ין אֵיפָה֙ וּ/לְ/הַגְדִּ֣יל שֶׁ֔קֶל וּ/לְ/עַוֵּ֖ת מֹאזְנֵ֥י מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/005.yaml
  text: saying[a], “When will the new moon be over, so that we may sell grain, and the Sabbath, so that we may offer wheat for sale—making the ephah small and the shekel large[b], and distorting deceitful scales?”
  footnotes:
  - marker: a
    text: Or 'the month' for 'the new moon'; here the context favors the festival observance rather than the calendar month.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'making the ephah small and the shekel large'—that is, giving less product and demanding more payment.
    reason: cultural_note
translation:
  language: ko
  text: 말하기를, “언제 초하루[a]가 지나 우리가 곡식을 팔 수 있겠으며, 안식일이 지나 우리가 밀을 내다 팔 수 있겠는가? 에바를 작게 하고 세겔을 크게 하며[b], 속임수 저울을 조작하려는 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֹדֶשׁ는 여기서 달(month)보다 초하루 절기를 가리키는 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에바를 작게 하고 세겔을 크게 한다’는 것은 실제로는 덜 주고 더 받는 상거래 사기를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֵאמֹר / saying
  english_pob_choice: saying
  chosen_korean: 말하기를
  alternatives_korean:
  - 이르기를
  - 말하며
  lexicon: HALOT
  rationale: 원문의 서두 인용 표지를 자연스럽게 살리되, 한국어에서 문장 시작의 연결어로 무난한 ‘말하기를’를 택했습니다.
- source_word: הַחֹדֶשׁ
  english_pob_choice: the new moon
  chosen_korean: 초하루
  alternatives_korean:
  - 새달
  - 한 달
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘달(month)’이 아니라 절기적 초하루를 가리키므로, 제의적 의미가 드러나는 ‘초하루’로 옮겼습니다.
- source_word: וְנִפְתְּחָה בָּר
  english_pob_choice: so that we may offer wheat for sale
  chosen_korean: 우리가 밀을 내다 팔 수 있을까
  alternatives_korean:
  - 우리가 곡식을 내놓을 수 있을까
  - 우리가 곡식을 팔 수 있을까
  lexicon: HALOT
  rationale: פּתח + בָּר의 상업적 관용을 한국어의 자연스러운 ‘내다 팔다’로 풀되, POB의 구체성에 맞춰 ‘밀’을 유지했습니다.
- source_word: לְהַקְטִין אֵיפָה / וּלְהַגְדִּיל שֶׁקֶל
  english_pob_choice: making the ephah small and the shekel large
  chosen_korean: 에바를 작게 하고 세겔을 크게 하며
  alternatives_korean:
  - 에바를 줄이고 세겔을 늘리며
  - 에바를 작게 만들고 세겔을 크게 만들며
  lexicon: HALOT
  rationale: 옛 도량형과 저울값의 부정을 그대로 보여 주기 위해 ‘에바’와 ‘세겔’을 음역으로 보존하고, 대구를 살려 직역했습니다.
- source_word: וּלְעַוֵּת מֹאזְנֵי מִרְמָה
  english_pob_choice: and distorting deceitful scales
  chosen_korean: 속이는 저울을 왜곡하려고 말입니다
  alternatives_korean:
  - 속이는 저울을 비틀려고 말입니다
  - 부정한 저울을 왜곡하려고 말입니다
  lexicon: HALOT
  rationale: עוה의 물리적 ‘비틀다/왜곡하다’ 이미지를 살리면서, מִרְמָה를 ‘속이는’으로 옮겨 부정의 성격을 드러냈습니다.
theological_decisions:
- issue: 절기 불평의 신학적 뉘앙스
  chosen_reading: ‘초하루’와 ‘안식일’을 그대로 살려, 상거래를 위해 거룩한 때가 빨리 지나가길 바라는 탐욕의 태도를 드러냈습니다.
  alternative_readings:
  - 달
  - 주간 휴일
  rationale: 본문의 비판은 단순한 시간표가 아니라 예배적 경계를 성가시게 여기는 마음에 있으므로, 절기성을 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 6
