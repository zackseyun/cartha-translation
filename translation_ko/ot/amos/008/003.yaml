  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵילִ֜ילוּ שִׁיר֤וֹת הֵיכָל֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה רַ֣ב הַ/פֶּ֔גֶר בְּ/כָל מָק֖וֹם הִשְׁלִ֥יךְ הָֽס־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/003.yaml
  text: And the songs of the palace will become wailing in that day[a], declares the Lord GOD. Many will be the corpses[b]; in every place they will throw them out—silence!
  footnotes:
  - marker: a
    text: Or 'the songs of the temple will become wailing.' The Hebrew הֵיכָל can mean either 'palace' or 'temple.'
    reason: alternative_reading
  - marker: b
    text: Or 'hush!' / 'be silent!' The final Hebrew הָס is a sharp call for silence, likely expressing shock or dread.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 궁전의 노래들이 애곡으로 바뀔 것입니다[a]. 주 하나님께서 선언하십니다. 시체가 수없이 많을 것이며, 모든 곳에 그것들을 내던질 것입니다. 잠잠하시오![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전의 노래들이 애곡으로 바뀔 것입니다.’ 히브리어 הֵיכָל은 ‘궁전’ 또는 ‘성전’을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘쉿!’ / ‘잠잠하라!’ 끝의 히브리어 הָס는 날카롭게 침묵을 요구하는 말로서, 충격이나 공포를 드러낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵילִילוּ
  english_pob_choice: will become wailing
  chosen_korean: 애곡으로 바뀔 것입니다
  alternatives_korean:
  - 애곡하게 될 것입니다
  - 곡성이 될 것입니다
  - 울부짖음이 될 것입니다
  lexicon: HALOT
  rationale: 동사 히필의 ‘울음/곡으로 변하게 됨’이라는 변화를 살려, 단순히 노래하는 주체가 우는 것이 아니라 노래 자체가 애곡이 되는 이미지를 반영했습니다.
- source_word: שִׁירוֹת
  english_pob_choice: songs
  chosen_korean: 노래들
  alternatives_korean:
  - 찬가들
  - 노래 소리들
  lexicon: HALOT
  rationale: 복수 명사로서의 구체성을 유지하기 위해 ‘노래들’로 옮겼습니다.
- source_word: הֵיכָל
  english_pob_choice: palace
  chosen_korean: 궁전
  alternatives_korean:
  - 성전
  - 왕궁
  lexicon: HALOT
  rationale: POB의 기본 선택인 ‘palace’를 따라, 아모스 8장의 사회적 심판 문맥에 맞는 ‘궁전’으로 옮겼습니다. 대안 의미인 ‘성전’은 각주로 보존했습니다.
- source_word: רַב הַפֶּגֶר
  english_pob_choice: Many will be the corpses
  chosen_korean: 시체가 많을 것이며
  alternatives_korean:
  - 많은 시체가 있을 것이며
  - 죽은 몸이 많을 것이며
  lexicon: HALOT
  rationale: ‘많다’의 술어적 용법을 한국어 자연문장으로 풀어 ‘시체가 많을 것이며’로 옮겼습니다.
- source_word: הַפֶּגֶר
  english_pob_choice: the corpses
  chosen_korean: 시체
  alternatives_korean:
  - 사체
  - 송장
  lexicon: HALOT
  rationale: פֶּגֶר는 죽은 몸/시체를 뜻하므로, 현대 표준어에서 명확한 ‘시체’를 선택했습니다.
- source_word: בְּכָל מָקוֹם
  english_pob_choice: in every place
  chosen_korean: 온갖 곳마다
  alternatives_korean:
  - 모든 곳에서
  - 모든 곳마다
  - 도처에
  lexicon: HALOT
  rationale: 분배적 의미를 살리되 한국어에서 자연스럽게 읽히도록 ‘온갖 곳마다’로 옮겼습니다.
- source_word: הִשְׁלִיךְ
  english_pob_choice: they will throw them out
  chosen_korean: 내던질 것입니다
  alternatives_korean:
  - 버릴 것입니다
  - 내쫓을 것입니다
  - 던져 버릴 것입니다
  lexicon: HALOT
  rationale: 주어가 생략된 집단적/비인칭적 동작을 한국어에서는 수동적 처리보다 행위성을 살린 ‘내던지다’로 옮겼습니다.
- source_word: הָס
  english_pob_choice: silence!
  chosen_korean: 잠잠하시오!
  alternatives_korean:
  - 조용하시오!
  - 침묵하시오!
  - 쉿!
  lexicon: HALOT
  rationale: 갑작스런 정적 요구를 한국어 명령형으로 재현하되, 합쇼체 본문에 맞춰 ‘잠잠하시오!’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기와 אֲדֹנָי יְהוִה 합성 호칭
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주 LORD
  - 주 하나님 여호와
  rationale: 본문의 합성 칭호는 한국어에서 관용적으로 ‘주 하나님’이 자연스럽고, 본 절은 직함 선언문이므로 합쇼체 화법과 어울리도록 정리했습니다. 다만 원문은 יְהוִה를 포함하지만, 이 절에서는 영어 POB의 문체를 따라 본문에는 ‘주 하나님’으로 두었습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוִה YHWH → Yahweh'
- issue: 종결 명령 הָס의 정서적 기능
  chosen_reading: 잠잠하시오!
  alternative_readings:
  - 침묵하시오!
  - 잠잠하라!
  - 쉿!
  rationale: 마지막 한마디는 단순한 정보가 아니라 충격과 공포 속의 정적을 부르는 감탄적 명령이므로, 문맥의 긴장감을 살려 ‘잠잠하시오!’로 처리했습니다.
  doctrine_reference: Amos 8:3의 재난-애곡-정적 구조
