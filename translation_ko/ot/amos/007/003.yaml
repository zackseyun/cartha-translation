source:
  edition: WLC
  text: נִחַ֥ם יְהוָ֖ה עַל זֹ֑את לֹ֥א תִהְיֶ֖ה אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/003.yaml
  text: 'Yahweh relented concerning this: “It will not happen,” said Yahweh[a].'
  footnotes:
  - marker: a
    text: Or “The LORD changed his mind concerning this” or “The LORD was sorry about this.” The Hebrew verb can express relenting, regret, or a change in intended action depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이 일에 대하여 뜻을 돌이키셨습니다. “이 일은 일어나지 않을 것입니다.” 야훼께서 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일에 대하여 마음을 바꾸셨습니다” 혹은 “이 일에 대해 유감으로 여기셨습니다.” 히브리어 동사는 문맥에 따라 뜻을 돌이키다, 후회하다, 예정된 행동을 바꾸다의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  english_pob_choice: relented
  chosen_korean: 뜻을 돌이키셨습니다
  alternatives_korean:
  - 마음을 바꾸셨습니다
  - 뜻을 거두셨습니다
  - 유감으로 여기셨습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 예언된 심판을 거두시는 뜻의 전환이 핵심이므로, 인간의 죄책이나 후회를 직접 뜻하기 쉬운 표현보다 “뜻을 돌이키셨습니다”가 원문의 행동 변화를 비교적 정확하게 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 여호와나 주님 대신 고유명사 음역인 “야훼”를 사용하여 히브리어 신명 자체를 드러냈습니다.
- source_word: עַל זֹאת
  english_pob_choice: concerning this
  chosen_korean: 이 일에 대하여
  alternatives_korean:
  - 이것에 관하여
  - 이 일에 관해
  - 이 일로
  lexicon: HALOT
  rationale: 지시어는 직전에 나온 심판 환상을 가리키므로, 한국어에서는 자연스럽고 문맥적 범위도 보존하는 “이 일에 대하여”로 옮겼습니다.
- source_word: לֹא תִהְיֶה
  english_pob_choice: It will not happen
  chosen_korean: 이 일은 일어나지 않을 것입니다
  alternatives_korean:
  - 그것은 일어나지 않을 것입니다
  - 그 일은 이루어지지 않을 것입니다
  - 그것은 생기지 않을 것입니다
  lexicon: HALOT
  rationale: 여기서 부정되는 것은 사건/재난의 발생이므로, 결과가 발생하지 않음을 분명히 하는 “일어나지 않을 것입니다”가 가장 직접적입니다.
theological_decisions:
- issue: 하나님의 ‘뜻을 돌이키심’에 대한 인격적·신학적 긴장
  chosen_reading: 원문이 드러내는 예언적 심판 철회와 중보에 대한 응답을 살리기 위해, 하나님의 행동 변화를 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 마음을 바꾸셨습니다
  - 후회하셨습니다
  - 불쌍히 여기셨습니다
  rationale: 이 동사는 인간처럼 말하는 방식이지만, 본문은 하나님이 정하신 심판을 거두시는 장면을 말합니다. ‘뜻을 돌이키셨습니다’는 신적 성품을 훼손하지 않으면서도 본문의 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
