  text: וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ חֲדַל נָ֔א מִ֥י יָק֖וּם יַעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/005.yaml
  text: Then I said[a], “Lord GOD, please cease[b]. How can Jacob stand? For he is small.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Lord YHWH'' (אֲדֹנָי יְהוִה); English ''Lord GOD'' reflects the combined title and avoids ''Lord LORD.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Who can Jacob stand?' / 'Who will raise up Jacob?' The Hebrew phrase is terse; the main text takes it as a plea that Jacob cannot endure on his own.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 내가 말했습니다[a]. “주 하나님, 이제 그만해 주십시오[b]. 야곱이 어떻게 서겠습니까? 그는 작습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘내가 말하였다’(וָאֹמַר).'
    reason: source_note
  - marker: b
    text: 히브리어는 짧은 표현으로, ‘그만해 주십시오’ 외에도 ‘멈추어 주십시오’, ‘누가 야곱이 서게 하겠습니까?’처럼 이해될 수 있습니다. 본문은 야곱이 스스로 감당할 수 없다는 간청으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 내가 말했습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그때 내가 말하였습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어 자연스러운 순서 표현으로 옮기되, 예언자적 대화 전환을 분명하게 했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼님
  - 주님 하나님
  lexicon: HALOT
  rationale: 합성 칭호이므로 두 요소를 모두 살리되, 한국어에서는 중복을 피하면서도 경외적 호칭을 유지하는 ‘주 하나님’이 가장 자연스럽습니다.
- source_word: חֲדַל נָא
  english_pob_choice: please stop / cease
  chosen_korean: 이제 그만해 주십시오
  alternatives_korean:
  - 제발 멈추어 주십시오
  - 이제 멈추십시오
  - 그만해 주십시오
  lexicon: HALOT
  rationale: חֲדַל은 중단을 요구하는 명령이며, נָא의 간청을 반영해 공손한 청유형으로 옮겼습니다. ‘그만해 주십시오’보다 상황상 간절한 중보의 뉘앙스를 분명히 했습니다.
- source_word: קָטֹן הוּא
  english_pob_choice: he is small
  chosen_korean: 그는 작습니다
  alternatives_korean:
  - 그는 작습니다만
  - 그는 작고 연약합니다
  - 그는 보잘것없습니다
  lexicon: HALOT
  rationale: 직역상 ‘작다/작은’에 해당하는 형용사로, 원문의 축소 표현을 보존하면서도 과도한 해석을 피했습니다.
theological_decisions:
- issue: יהוה를 합성 칭호 אֲדֹנָי יְהוִה 안에서 어떻게 표시할지
  chosen_reading: 주 하나님
  alternative_readings:
  - 주 야훼
  - 주님 야훼
  - 주 여호와
  rationale: 이 구절은 이미 ‘아도나이’와 결합된 형태라서, 본문에서 별도의 음역을 붙이면 한국어가 어색해집니다. 따라서 POB의 영어 ‘Lord GOD’처럼 합성 칭호의 기능을 살리되, 한국어에서는 ‘주 하나님’으로 자연스럽게 전달했습니다.
  doctrine_reference: 'POB glossary: YHWH default → 야훼; compound title אֲדֹנָי יְהוִה requires context-sensitive handling'
