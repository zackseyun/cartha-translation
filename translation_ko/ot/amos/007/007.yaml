base_translation:
  language: en
  yaml_path: translation/ot/amos/007/007.yaml
  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
  footnotes:
  - marker: a
    text: Or 'on a wall of plumb line'; the Hebrew phrase is difficult. The noun אֲנָךְ likely refers to a plumb line or plummet, though some have proposed the material 'lead' or 'tin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 주님께서 제게 보여 주신 것입니다. 보십시오[a], 주님께서 먹줄로 된 성벽 곁에 서 계셨고, 그분의 손에는 먹줄이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹줄 성벽 위에’; 히브리어 구절은 어렵습니다. 명사 אֲנָךְ는 먹줄이나 추를 가리킬 가능성이 크지만, 어떤 해석은 ‘납’이나 ‘주석’을 제안합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  english_pob_choice: This is what he showed me
  chosen_korean: 이것이 주님께서 제게 보여 주신 것입니다
  alternatives_korean:
  - 이것이 그분이 제게 보여 주신 것입니다
  - 이와 같이 그분이 제게 보여 주셨습니다
  lexicon: HALOT
  rationale: 비전 보고의 도입구로서 자연스러운 현대 한국어를 사용하되, 히필 ראה의 ‘보여 주다’ 의미를 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 시각적 돌연 전환을 드러내기 위해 감탄형을 살렸고, 합쇼체 흐름에 맞게 ‘보십시오’를 택했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: HALOT
  rationale: 하나님을 가리키는 호칭이므로, 본문 문맥에 맞는 존칭적 번역으로 ‘주님’을 사용했습니다.
- source_word: חוֹמַת אֲנָךְ / אֲנָךְ
  english_pob_choice: a wall made with a plumb line / plumb line
  chosen_korean: 먹줄로 된 성벽 / 먹줄
  alternatives_korean:
  - 먹줄 성벽 / 먹줄
  - 수직추로 된 성벽 / 수직추
  lexicon: HALOT
  rationale: אֲנָךְ의 의미가 어려우나 문맥상 측정용 도구인 먹줄로 보는 해석이 가장 자연스럽습니다. 벽의 표현은 POB의 난점을 반영해 ‘먹줄로 된’으로 옮겨, 벽이 먹줄과 연관된 상태임을 드러냈습니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 호칭 처리
  chosen_reading: ‘주님’으로 번역해 하나님을 지칭하는 호칭임을 드러냈습니다.
  alternative_readings:
  - ‘주’
  - 음역
  rationale: 이 본문은 하나님의 현현 장면이므로, 한국어 독자에게도 분명한 신적 호칭으로 전달하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve divine address/register'
