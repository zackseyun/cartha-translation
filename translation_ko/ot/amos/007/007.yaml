  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
  footnotes:
  - marker: a
    text: Or 'on a wall of plumb line'; the Hebrew phrase is difficult. The noun אֲנָךְ likely refers to a plumb line or plummet, though some have proposed the material 'lead' or 'tin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 주님께서 제게 보여 주신 것입니다. 보십시오[a], 주님께서 다림줄로 된 성벽 곁에 서 계셨고, 주님의 손에는 다림줄이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다림줄로 된 성벽 위에’; 히브리어 표현은 해석하기 어렵습니다. 명사 אֲנָךְ는 다림줄이나 수직추를 가리킬 가능성이 크지만, ‘납’이나 ‘주석’을 뜻한다고 보는 견해도 있습니다.
    reason: lexical_alternative
