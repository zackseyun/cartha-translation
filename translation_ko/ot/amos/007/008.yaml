  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר אֲנָ֑ךְ וַ/יֹּ֣אמֶר אֲדֹנָ֗/י הִנְ/נִ֨י שָׂ֤ם אֲנָךְ֙ בְּ/קֶ֨רֶב֙ עַמִּ֣/י יִשְׂרָאֵ֔ל לֹֽא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
  footnotes:
  - marker: a
    text: Or, possibly, 'tin,' 'lead,' or 'plummet'; the Hebrew term likely refers to a measuring device or material associated with a plumb line.
    reason: lexical_alternative
  - marker: b
    text: '''I will not again pass by them'' likely means ''I will no longer spare them'' or ''I will no longer overlook their sin.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 야훼께서 제게 말씀하셨습니다. “아모스야, 네가 무엇을 보느냐?” 제가 대답했습니다. “수직추입니다.” 그러자 주님께서 말씀하셨습니다. “보아라, 내가 내 백성 이스라엘 한가운데에 수직추를 두고 있다. 나는 다시는 그들을 그냥 지나치지 않겠다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲנָךְ는 문맥상 수직을 재는 도구를 가리키며, ‘먹줄’ 또는 그와 관련된 납추를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다시는 그들을 그냥 지나치지 않겠다’는 곧 ‘더 이상 그들을 용서하지 않겠다’ 또는 ‘그들의 죄를 더 이상 간과하지 않겠다’는 뜻일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 언약적 신명은 POB 원칙에 따라 ‘야훼’로 옮겨야 하며, 뒤의 אֲדֹנָי와 구별을 유지해야 합니다.
- source_word: מָה אַתָּה רֹאֶה
  english_pob_choice: What do you see
  chosen_korean: 네가 무엇을 보느냐
  alternatives_korean:
  - 네가 무엇을 보고 있느냐
  - 무엇이 보이느냐
  lexicon: HALOT
  rationale: 아모스에게 묻는 직접 질문이므로 자연스러운 현대 한국어 의문문으로 옮기되, 현재 시각적 환시의 질문이라는 점을 유지했습니다.
- source_word: אֲנָךְ
  english_pob_choice: plumb line
  chosen_korean: 수직추
  alternatives_korean:
  - 먹줄
  - 플럼라인
  - 기준선
  lexicon: HALOT
  rationale: 문맥상 수직 여부를 재는 도구를 가리키므로, 기능을 드러내는 ‘수직추’가 가장 직접적입니다. 단순한 금속 물질이 아니라 측정 도구라는 의미를 살렸습니다.
- source_word: לֹא אוֹסִיף עוֹד עֲבֹר לוֹ
  english_pob_choice: I will not again pass by them
  chosen_korean: 나는 다시는 그들을 그냥 지나치지 않겠다
  alternatives_korean:
  - 나는 다시는 그들을 용서하지 않겠다
  - 나는 다시는 그들을 못 본 척하지 않겠다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘지나가다’ 이미지를 살리면서, 문맥상 포함되는 ‘더 이상 봐주지 않음’의 뜻이 드러나도록 했습니다.
theological_decisions:
- issue: 야훼와 주님의 구별
  chosen_reading: 첫 번째 신명은 ‘야훼’, 뒤의 אֲדֹנָי는 ‘주님’으로 구별했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통일
  - 둘 다 이름 없이 титling 처리
  rationale: 한 절 안에서 언약 이름과 호칭이 함께 나오므로, 원문이 만드는 신학적·서사적 구별을 한국어에서도 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘지나치다’의 관용구 보존
  chosen_reading: ‘다시는 그들을 그냥 지나치지 않겠다’로 옮겨 심판의 관용구를 보존했습니다.
  alternative_readings:
  - 나는 다시는 그들을 용서하지 않겠다
  - 나는 다시는 그들의 죄를 덮어주지 않겠다
  rationale: 이 표현은 단순한 이동이 아니라 더 이상 용서/간과하지 않겠다는 심판 선언이므로, 본문 이미지와 해석 가능성을 함께 남겨 두는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
