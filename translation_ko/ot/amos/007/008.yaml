base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
  footnotes:
  - marker: a
    text: Or, possibly, 'tin,' 'lead,' or 'plummet'; the Hebrew term likely refers to a measuring device or material associated with a plumb line.
    reason: lexical_alternative
  - marker: b
    text: '''I will not again pass by them'' likely means ''I will no longer spare them'' or ''I will no longer overlook their sin.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. “아모스야, 네가 무엇을 보고 있습니까?” 제가 대답했습니다. “다림줄입니다.” 그러자 주님께서 말씀하셨습니다. “보십시오, 내가 내 백성 이스라엘 한가운데에 다림줄을 두고 있습니다.[a] 내가 다시는 그들을 그냥 지나쳐 주지 않겠습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲנָךְ는 문맥상 다림줄을 가리키는 것으로 보입니다. 그러나 ‘수직추’ 또는 납이나 주석 같은 금속을 뜻한다는 견해도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을 그냥 지나쳐 주지 않겠다’는 더 이상 그들을 용서하지 않거나 그들의 죄를 간과하지 않겠다는 뜻일 수 있습니다.
    reason: alternative_reading
