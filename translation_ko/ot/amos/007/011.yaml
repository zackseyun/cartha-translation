  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 각주가 히브리어의 강조형인 גָּלֹה יִגְלֶה(‘반드시 포로로 끌려갈 것이다’)를 설명하면서 본문의 ‘칼로 죽고’에 붙어 있어, 각주 표지가 설명 대상과 일치하지 않습니다. 또한 מֵעַל אַדְמָתוֹ의 이탈 의미는 ‘자기 땅에서’보다 ‘자기 땅을 떠나’가 더 명확하게 드러납니다.
  naturalness: ‘아모스가 이렇게 말했습니다’는 보고된 발언을 소개하는 현대 표준 한국어로 자연스럽고, 인용문 안의 미래 예고에도 합쇼체를 일관되게 적용합니다. ‘자기 땅을 떠나 포로로 끌려갈 것입니다’는 출발점과 강제 이주의 의미를 자연스럽게 표현합니다.
  terminology: ‘칼’, ‘이스라엘’, ‘포로로 끌려가다’는 적절합니다. ‘여로보암’과 ‘아모스’도 표준 성경 인명 표기에 맞습니다. ‘반드시’는 부정사 절대형과 유한동사의 강조를 적절히 반영합니다.
  issues:
  - severity: high
    issue: 각주 표지가 ‘칼로 죽고’ 뒤에 붙어 있습니다.
    rationale: 각주 내용은 칼에 의한 죽음이 아니라 גָּלֹה יִגְלֶה의 강조 용법과 ‘포로로 끌려감/유배’이라는 대안을 설명합니다. 따라서 표지는 이스라엘의 포로 이주 절 끝에 와야 합니다.
  - severity: medium
    issue: ‘자기 땅에서 포로로 끌려가게 될 것입니다’는 출발점의 의미가 다소 약하고 ‘포로로’의 수식 범위가 순간적으로 모호할 수 있습니다.
    rationale: מֵעַל אַדְמָתוֹ는 자기 땅으로부터 떠나게 되는 이탈을 뜻합니다. ‘자기 땅을 떠나 포로로 끌려갈 것입니다’가 이를 더 분명하고 자연스럽게 전달합니다.
