  to: 이는 아모스가 이렇게 말했습니다. “여로보암은 칼로 죽고, 이스라엘은 반드시 자기 땅을 떠나 포로로 끌려갈 것입니다[a].”
  rationale: 각주 표지를 히브리어 강조형이 있는 이스라엘의 포로 이주 절로 옮겨 표지와 설명의 불일치를 바로잡았습니다. 또한 ‘자기 땅을 떠나’로 옮겨 땅으로부터의 추방이라는 원문의 이탈 의미를 분명히 했습니다. 나머지 내용은 원문의 보고 문맥, 미래 예고, 합쇼체 문체를 유지합니다.
