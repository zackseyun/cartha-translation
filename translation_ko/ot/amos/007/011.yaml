  text: כִּי כֹה֙ אָמַ֣ר עָמ֔וֹס בַּ/חֶ֖רֶב יָמ֣וּת יָרָבְעָ֑ם וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/011.yaml
  text: 'For this is what Amos has said: ‘Jeroboam will die by the sword[a], and Israel will surely go into exile from its land.’'
  footnotes:
  - marker: a
    text: Or “will certainly be exiled” or “will surely be carried away into exile.” The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 아모스가 이렇게 말했습니다. “여로보암은 칼로 죽고, 이스라엘은 반드시 자기 땅을 떠나 포로로 끌려갈 것입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “반드시 유배될 것입니다” 또는 “반드시 포로로 잡혀갈 것입니다.” 히브리어는 강조를 위해 부정사 절대형과 유한동사를 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 고발 내용을 이어 주는 보고 문맥이므로, 한국어에서는 원인을 풀기보다 담담한 연결어 ‘이는’으로 자연스럽게 처리했습니다.
- source_word: כֹה אָמַר
  english_pob_choice: this is what ... has said
  chosen_korean: 한 말입니다
  alternatives_korean:
  - 이것이 ...가 말한 것입니다
  - 이렇게 말했습니다
  lexicon: HALOT
  rationale: 이미 전해진 예언 발언을 인용하는 보고문이므로, 과거 완료 느낌을 살리면서도 현대 한국어에 자연스러운 ‘한 말입니다’로 옮겼습니다.
- source_word: בַּחֶרֶב
  english_pob_choice: by the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼에 의해
  - 칼에
  - 전쟁으로
  lexicon: HALOT
  rationale: 히브리어의 도구적 표현을 한국어 관용에 맞게 ‘칼로’로 옮겨, 폭력적 죽음의 직설성을 유지했습니다.
- source_word: גָּלֹה יִגְלֶה
  english_pob_choice: will surely go into exile
  chosen_korean: 반드시 ... 포로로 끌려가게 될 것입니다
  alternatives_korean:
  - 반드시 추방될 것입니다
  - 반드시 포로 생활로 들어가게 될 것입니다
  - 확실히 유배될 것입니다
  lexicon: HALOT
  rationale: 부정사 절대형과 동사의 중복이 강조를 나타내므로 ‘반드시’로 강조를 살렸고, 국가적 추방의 결과를 한국어에서 분명히 드러내기 위해 ‘포로로 끌려가게 될 것입니다’로 옮겼습니다.
- source_word: מֵעַל אַדְמָתוֹ
  english_pob_choice: from its land
  chosen_korean: 자기 땅에서
  alternatives_korean:
  - 그 땅에서
  - 자기 토지에서
  - 자기 땅으로부터
  lexicon: HALOT
  rationale: ‘from upon’의 직역보다 한국어 자연성을 우선하되, 국토에서의 추방이라는 의미를 살려 ‘자기 땅에서’로 번역했습니다.
theological_decisions:
- issue: 이스라엘의 지칭과 소유격
  chosen_reading: 이스라엘을 집단적·국가적 단수로 보고 ‘자기 땅’으로 옮겼습니다.
  alternative_readings:
  - 그들의 땅
  - 이스라엘 백성의 땅
  rationale: 히브리어는 이스라엘을 하나의 집단 실체로 다루므로, 한국어에서도 단수적 공동체성을 유지하는 표현이 더 정확합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms) and §6 (readable modern Korean)
