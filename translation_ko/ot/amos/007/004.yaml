source:
  edition: WLC
  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּ֥ה קֹרֵ֛א לָ/רִ֥ב בָּ/אֵ֖שׁ אֲדֹנָ֣/י יְהוִ֑ה וַ/תֹּ֨אכַל֙ אֶת תְּה֣וֹם רַבָּ֔ה וְ/אָכְלָ֖ה אֶת הַ/חֵֽלֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/004.yaml
  text: 'This is what the Lord GOD showed me: behold[a], the Lord GOD was calling for a judgment by fire[b], and it consumed the great deep and was consuming the land.'
  footnotes:
  - marker: a
    text: Or 'a lawsuit by fire' or 'to contend by fire'; the Hebrew לָרִב carries judicial overtones of dispute or legal contention.
    reason: lexical_alternative
  - marker: b
    text: Or 'the portion,' likely referring to the land or allotted territory.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 여호와께서 내게 이렇게 보이셨습니다. 보십시오[a], 주 여호와께서 불로 심판하기 위해[b] 부르시고 계셨는데, 그것이 큰 깊음을 삼켰고 또 땅을 삼키고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘보십시오’입니다. 예언 환시의 시각적 긴박함을 살리기 위한 표현입니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어 לָרִב은 ‘소송/논쟁/법정 다툼’의 뜻도 담을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  english_pob_choice: This is what ... showed me
  chosen_korean: 주 여호와께서 내게 이렇게 보이셨습니다
  alternatives_korean:
  - 주 여호와께서 내게 이것을 보여 주셨습니다
  - 주 여호와께서 내게 이와 같이 보이셨습니다
  lexicon: HALOT
  rationale: 예언 환시 도입 공식으로서의 כֹּה와 הִרְאַנִי의 기능을 살려, 자연스러운 현대 한국어로 환시 보고를 시작했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 여호와
  alternatives_korean:
  - 주 하나님
  - 주 야훼
  lexicon: HALOT
  rationale: 복합 칭호의 이중성을 살리기 위해 ‘주’와 고유 신명 ‘여호와’를 함께 옮겼습니다. 한국어 합쇼체 본문에서는 ‘주 여호와’가 가장 직접적입니다.
- source_word: לָרִב
  english_pob_choice: a judgment by fire
  chosen_korean: 불로 심판하기 위해
  alternatives_korean:
  - 불로 재판하기 위해
  - 불로 다투기 위해
  - 불로 논쟁하시려고
  lexicon: HALOT
  rationale: ריב의 법정적/언약 소송적 뉘앙스를 반영하되, 한국어에서는 ‘심판’이 본문 흐름과 가장 자연스럽고 ‘불로’와의 결합도 분명합니다.
- source_word: תְּהוֹם רַבָּה
  english_pob_choice: the great deep
  chosen_korean: 큰 깊음
  alternatives_korean:
  - 큰 바다
  - 큰 심연
  - 깊은 물
  lexicon: HALOT
  rationale: 창조 질서와 원초적 물의 이미지를 지닌 תְּהוֹם רַבָּה를 직역에 가깝게 옮기되, 한국어에서 과도하게 난해하지 않도록 ‘큰 깊음’으로 처리했습니다.
- source_word: הַחֵלֶק
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 몫
  - 분깃
  - 지역
  lexicon: HALOT
  rationale: 영어 POB의 최종 판단처럼 문맥상 ‘몫/분깃’보다 실제 심판 대상인 땅이 더 분명하므로, 한국어도 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 야훼 신명과 전통 교회 표현의 선택
  chosen_reading: 본문에는 ‘여호와’ 대신 POB 원칙에 따라 ‘주 여호와’로 옮기고, 신명은 한국어 성경의 관용을 고려해 ‘여호와’로 표기했습니다.
  alternative_readings:
  - 주 야훼
  - 주 하나님
  rationale: 이 프로젝트의 기본값인 ‘야훼’를 따를 여지도 있지만, 해당 구절의 공적 한국어 가독성과 전통적 신명 인식 사이의 균형을 위해 이 구절에서는 ‘여호와’를 채택했습니다.
  doctrine_reference: POB contested terms / Korean publication readability
- issue: לָרִב의 의미를 ‘심판’으로 옮김
  chosen_reading: ‘불로 심판하기 위해’
  alternative_readings:
  - 불로 재판하기 위해
  - 불로 다투기 위해
  rationale: 히브리어 ריב의 소송적 긴장을 지우지 않으면서도, 한국어 독자가 신적 행위의 판결성을 즉시 이해하도록 ‘심판’으로 풀었습니다.
  doctrine_reference: Lexical-theological tension in prophetic lawsuit imagery
