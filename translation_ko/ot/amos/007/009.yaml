id: AMO.7.9
reference: Amos 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָשַׁ֨מּוּ֙ בָּמ֣וֹת יִשְׂחָ֔ק וּ/מִקְדְּשֵׁ֥י יִשְׂרָאֵ֖ל יֶחֱרָ֑בוּ וְ/קַמְתִּ֛י עַל בֵּ֥ית יָרָבְעָ֖ם בֶּ/חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/009.yaml
  text: The high places of Isaac will be made desolate[a], and the sanctuaries of Israel will be laid waste[c][b]; and I will rise against the house of Jeroboam with the sword.
  footnotes:
  - marker: a
    text: Or 'will become desolate.'
    reason: lexical_alternative
  - marker: b
    text: '''Isaac'' is a poetic designation here for the northern covenant people; some translations simplify it to ''Israel.'''
    reason: alternative_reading
  - marker: c
    text: Or 'by the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이사앗의 산당들은 황폐해질 것이며[a], 이스라엘의 성소들은 무너져 폐허가 될 것입니다[b]; 그리고 나는 여로보암의 집을 칼로 치러 일어설 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐해지게 될 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 성소들’은 북왕국 공동체를 가리키는 시적 표현으로, 어떤 번역본은 이를 ‘이스라엘’로 단순화합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘칼에 의해.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  english_pob_choice: will be made desolate
  chosen_korean: 황폐해질 것입니다
  alternatives_korean:
  - 폐허가 될 것입니다
  - 버려지게 될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 결과 상태를 한국어에서 자연스럽게 나타내면서, 심판으로 인한 황폐함을 분명히 드러냅니다.
- source_word: בָּמוֹת
  english_pob_choice: high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 산 위의 제단들
  lexicon: HALOT
  rationale: בָּמוֹת는 고대 이스라엘의 제의 장소를 가리키는 관용 표현이므로, 문맥상 통용되는 ‘산당들’이 가장 직접적입니다.
- source_word: יִשְׂחָק
  english_pob_choice: Isaac
  chosen_korean: 이사앗
  alternatives_korean:
  - 이삭
  - 이스라엘
  lexicon: 고유명사 표기
  rationale: 본문이 시적으로 ‘이삭/이사앗’을 보존하고 있으므로, 의미 해석으로 대체하지 않고 음역을 유지합니다.
- source_word: וּמִקְדְּשֵׁי
  english_pob_choice: the sanctuaries of
  chosen_korean: 성소들은
  alternatives_korean:
  - 거룩한 곳들은
  - 성전들은
  lexicon: HALOT
  rationale: מִקְדָּשׁ의 제의적·성스러운 장소 의미를 살려 ‘성소’로 옮겼습니다.
- source_word: יֶחֱרָבוּ
  english_pob_choice: will be laid waste
  chosen_korean: 무너져 폐허가 될 것입니다
  alternatives_korean:
  - 황폐해질 것입니다
  - 파괴될 것입니다
  lexicon: HALOT
  rationale: 앞의 ‘황폐’와 구별되면서도 חרב의 ‘무너짐/황폐화’ 중첩 의미를 드러내기 위해 복합적으로 옮겼습니다.
- source_word: וְקַמְתִּי עַל
  english_pob_choice: and I will rise against
  chosen_korean: 그리고 나는 … 치러 일어설 것입니다
  alternatives_korean:
  - 그리고 나는 … 대적하여 일어설 것입니다
  - 그리고 나는 … 맞서 일어날 것입니다
  lexicon: HALOT
  rationale: קום + על의 적대적·군사적 용법을 한국어의 ‘치러 일어설’로 자연스럽게 표현했습니다.
- source_word: בֶּחָרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼로써
  - 무력으로
  lexicon: HALOT
  rationale: 히브리어 도구격 표현을 한국어에서 자연스러운 처격으로 옮기되, 심판의 무력성을 분명히 했습니다.
theological_decisions:
- issue: ‘이사앗’의 보존 여부
  chosen_reading: 본문의 시적 고유명사를 그대로 살려 ‘이사앗’으로 두었습니다.
  alternative_readings:
  - 의미를 따라 ‘이스라엘’로 바꾸는 번역
  rationale: 히브리어 본문은 해석 대신 고유명사 자체를 사용하므로, 문학적·언약적 뉘앙스를 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문 우선과 문학적 형상 보존'
- issue: 하나님의 직접적 심판 행위
  chosen_reading: 하나님이 여로보암의 집을 향해 군사적·심판적 행동을 직접 선언하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 더 완화된 ‘대적하겠습니다’
  - ‘손을 대겠습니다’처럼 약화된 표현
  rationale: 문맥상 단순한 반대가 아니라 심판의 실행을 뜻하므로, ‘칼로 치러 일어설 것입니다’로 강도를 유지했습니다.
  doctrine_reference: '번역 원칙: 심판 본문의 수사적 강도 보존'
