  source_fidelity: 원문의 병렬 구조와 심판 선언은 대체로 반영되었으나, 고유명사 יִצְחָק은 표준 한국어 성경 및 현대 한국어 표기에 따라 ‘이삭’으로 써야 합니다. 또한 ‘칼로 치러 일어설’은 히브리어의 ‘칼을 가지고/칼로 여로보암의 집을 대적하여 일어나다’를 다소 부자연스럽게 결합합니다.
