revisions:
- from: 그러므로 야훼께서 말씀하십니다. “네 아내는 성읍에서 창녀가 될 것이고, 네 아들들과 네 딸들은 칼에 쓰러질 것이며, 네 땅은 측량줄로 나뉠 것이다. 그리고 너는 더러운 땅에서 죽을 것이며, 이스라엘은 반드시 자기 땅에서 사로잡혀 갈 것이다.”[a][b][c]
  to: 그러므로 야훼께서 이렇게 말씀하십니다. “너의 아내는 그 성읍에서 매춘을 할 것이며[a], 너의 아들들과 딸들은 칼에 쓰러질 것이고, 너의 땅은 측량줄로 나뉠 것이다[b]. 너는 부정한 땅에서 죽을 것이며, 이스라엘은 자기 땅을 떠나 반드시[c] 유배될 것이다.”
  rationale: 원문의 동사 의미, 제의적 표현, 그리고 유배의 강조 구문을 더 정확히 반영했습니다. 각주 c의 문법 설명을 정정하고, 모든 각주 표지를 해당 표현 뒤로 옮겼습니다. ‘부정한 땅’이 가리키는 범위와 유배의 역사적 양상은 본문에서 확대 해석하지 않았습니다.
