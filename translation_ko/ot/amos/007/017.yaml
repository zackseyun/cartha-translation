review_pass:
  verdict: revise
  source_fidelity: 원문의 심판 선언 구조와 주요 항목은 대체로 보존되었습니다. 그러나 גָּלֹה יִגְלֶה는 단순히 ‘사로잡혀 가다’라기보다 강조된 ‘유배되다/추방되다’이며, טְמֵאָה의 제의적·언약적 함의를 ‘더러운’보다 ‘부정한’이 더 충실하게 전달합니다. 또한 ‘창녀가 될 것이다’보다 동사의 행위성을 보존하는 ‘매춘을 할 것이다’가 안전합니다.
  naturalness: ‘측량줄로 나뉠 것이다’, ‘칼에 쓰러질 것이다’는 자연스럽고 문맥에 맞습니다. ‘자기 땅에서 사로잡혀 갈 것이다’는 한국어에서 출발점과 포로화의 의미가 다소 불명확하므로 ‘자기 땅을 떠나 반드시 유배될 것이다’로 다듬는 것이 명료합니다.
  terminology: 야훼는 제공된 프로젝트 방침과 일치합니다. ‘부정한 땅’은 원문의 טְמֵאָה가 지닌 의례적·언약적 표현을 유지하며, 그것이 구체적으로 무엇을 뜻하는지는 본문에서 확정하지 않습니다. 각주 c의 ‘완료적 강조’ 설명은 문법적으로 부정확합니다. 이는 부정사가 동반된 동사형(절대부정사+유한동사)의 강조입니다.
  issues:
  - severity: medium
    issue: גָּלֹה יִגְלֶה를 ‘반드시 사로잡혀 갈 것이다’로 번역함
    rationale: גלה는 이 문맥에서 이스라엘이 자기 땅을 떠나 유배/추방되는 것을 가리킵니다. ‘사로잡히다’는 포로가 되는 방식에 초점을 더해 원문보다 좁은 의미가 됩니다.
  - severity: medium
    issue: טְמֵאָה를 ‘더러운’으로 번역함
    rationale: ‘더러운’은 일반적 오염이나 도덕적 더러움을 주로 떠올리게 합니다. ‘부정한’은 원문의 제의적·언약적 어휘를 더 잘 보존하면서도 구체적 해석을 강요하지 않습니다.
  - severity: low
    issue: זנה를 ‘창녀가 될 것이다’로 번역함
    rationale: 문맥상 가능한 결과적 표현이나, 원문 동사는 ‘매춘하다’라는 행위를 직접 서술합니다. ‘매춘을 할 것이다’가 행위성과 심판 선언의 직설성을 보존합니다.
  - severity: high
