  - 확실히 유배될 것이다
  - 틀림없이 끌려갈 것이다
  lexicon: HALOT
  rationale: 어근 גלה의 추방·포로됨을 살리면서, 히브리어 강조형의 확실성을 ‘반드시’로 표현했습니다.
theological_decisions:
- issue: 예언자적 심판 선포의 직설성
  chosen_reading: 원문이 지닌 가정 완화 없이, 가족의 죽음·토지 분할·추방을 직접적인 심판 선언으로 옮겼습니다.
