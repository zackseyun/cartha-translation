  - 완곡하게 바꾸어 ‘불행이 닥할 것이다’처럼 처리
  - 정치적 결과로만 축소
  rationale: 아모스 7:17은 하나님의 판결을 선언하는 본문이므로, 독자가 심판의 무게를 그대로 이해하도록 직설성을 보존하는 것이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
