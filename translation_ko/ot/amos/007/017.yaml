  lexicon: HALOT
  rationale: 프로젝트 기본값을 따라 고유 신명은 학술적 음역인 ‘야훼’로 옮겼습니다.
- source_word: תִּזְנֶה
  english_pob_choice: will prostitute herself
  chosen_korean: 창녀가 될 것이고
  alternatives_korean:
  - 몸을 팔 것이고
  - 음행할 것이고
  - 매춘할 것이고
  lexicon: HALOT
  rationale: זנה의 노골적 성적 타락과 심판 선언의 충격을 살리되, 현대 한국어에서 과도하게 생경하지 않게 표현했습니다.
- source_word: בַּחֶרֶב יִפֹּלוּ
  english_pob_choice: will fall by the sword
  chosen_korean: 칼에 쓰러질 것이며
  alternatives_korean:
  - 칼에 죽을 것이며
  - 칼에 맞아 죽을 것이며
  lexicon: HALOT
  rationale: 히브리어 관용구의 비장함을 유지하면서, 한국어에서는 자연스러운 ‘쓰러지다’로 폭력적 죽음을 옮겼습니다.
- source_word: בַּחֶבֶל תְּחֻלָּק
  english_pob_choice: will be divided by measuring line
  chosen_korean: 측량줄로 나뉠 것이다
  alternatives_korean:
  - 줄자로 분배될 것이다
  - 줄로 나뉘어 배분될 것이다
  - 분깃줄로 나뉠 것이다
  lexicon: HALOT
  rationale: חֶבֶל을 토지 분할에 쓰는 줄로 이해하여, 정복 후 분배의 이미지를 살리는 ‘측량줄’로 옮겼습니다.
- source_word: עַל אֲדָמָה טְמֵאָה
  english_pob_choice: on unclean land
  chosen_korean: 더러운 땅에서
  alternatives_korean:
  - 부정한 땅에서
  - 정결하지 않은 땅에서
  lexicon: HALOT
  rationale: ‘부정한’은 예식적 뉘앙스가 강하므로, 이 맥락의 추방·죽음 선고가 주는 이질감을 살려 ‘더러운 땅’으로 번역했습니다.
- source_word: גָּלֹה יִגְלֶה
  english_pob_choice: will surely go into exile
  chosen_korean: 반드시 사로잡혀 갈 것이다
  alternatives_korean:
  - 반드시 포로로 끌려갈 것이다
  - 확실히 유배될 것이다
  - 틀림없이 끌려갈 것이다
  lexicon: HALOT
  rationale: 어근 גלה의 추방·포로됨을 살리면서, 히브리어 강조형의 확실성을 ‘반드시’로 표현했습니다.
theological_decisions:
- issue: 예언자적 심판 선포의 직설성
  chosen_reading: 원문이 지닌 가정 완화 없이, 가족의 죽음·토지 분할·추방을 직접적인 심판 선언으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 바꾸어 ‘불행이 닥할 것이다’처럼 처리
  - 정치적 결과로만 축소
  rationale: 아모스 7:17은 하나님의 판결을 선언하는 본문이므로, 독자가 심판의 무게를 그대로 이해하도록 직설성을 보존하는 것이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
