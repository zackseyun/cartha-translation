  lexicon: HALOT
  rationale: ‘아들’ 직역을 유지해 히브리어 관용구의 소속/계열 뉘앙스를 남겼고, 한국어에서는 자연스럽게 부정 접속으로 연결했습니다.
- source_word: בוֹקֵר ... וּבוֹלֵס שִׁקְמִים
  english_pob_choice: a herdsman and a dresser of sycamore figs
  chosen_korean: 목축하는 사람이며 뽕나무무화과를 가꾸는 사람입니다
  alternatives_korean:
  - 목자이며 뽕나무무화과를 다루는 사람입니다
  - 소를 치는 사람이며 뽕나무무화과를 손질하는 사람입니다
  lexicon: HALOT
  rationale: בוֹקֵר는 단순한 ‘목자’보다 가축을 돌보는 생업을 넓게 드러내는 표현으로 처리했고, שִׁקְמִים은 ‘뽕나무무화과’로 옮겨 현대 독자가 과실을 이해하도록 했습니다.
theological_decisions:
- issue: 아모스의 자기 부정이 직분 부정인지, 직업/길드 소속 부정인지
  chosen_reading: 본문은 해석을 확정하지 않고, 아모스의 자기 진술을 그대로 살려 두었습니다.
  alternative_readings:
  - 예언직 자체를 부정하는 말로 읽음
  - 직업상 예언자, 곧 예언자 길드의 구성원이 아님을 뜻함
  rationale: 이 구절은 아모스의 실제 예언자적 발화와 긴장을 이루므로, 한국어 본문에서 그 긴장을 해소하지 않고 남겨 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 'POB 번역 원칙: 신학적 긴장은 번역에서 미리 해결하지 않는다.'
