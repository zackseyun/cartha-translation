base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
  footnotes:
  - marker: a
    text: Or 'nor am I a prophet’s son'; the Hebrew idiom may refer to membership in a prophetic guild rather than literal descent.
    reason: lexical_alternative
  - marker: b
    text: Or 'a dresser of sycamore figs' or 'one who pierces sycamore figs'; the Hebrew likely refers to cultivating or preparing the fruit of the sycamore-fig tree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아모스가 아마샤에게 대답하여 말했습니다. 「나는 예언자가 아니며, 예언자의 아들도 아닙니다[a]. 오히려 나는 목축하는 사람이며 돌무화과를 가꾸는 사람입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예언자의 아들’은 문자적으로 예언자의 아들을 뜻할 수도 있지만, 예언자 집단이나 계열에 속한 사람을 가리키는 관용구일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘돌무화과를 손질하는 사람’ 또는 ‘돌무화과를 찌르는 사람’으로 번역할 수 있습니다. 히브리어는 돌무화과 열매를 재배하거나 익도록 손질하는 행위를 가리키는 것으로 보입니다.
    reason: lexical_alternative
