base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
  footnotes:
  - marker: a
    text: Or 'nor am I a prophet’s son'; the Hebrew idiom may refer to membership in a prophetic guild rather than literal descent.
    reason: lexical_alternative
  - marker: b
    text: Or 'a dresser of sycamore figs' or 'one who pierces sycamore figs'; the Hebrew likely refers to cultivating or preparing the fruit of the sycamore-fig tree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아모스가 아마샤에게 대답하여 말했습니다. 「나는 예언자가 아니며, 예언자의 아들도 아닙니다. 오히려 나는 목축하는 사람이며 뽕나무무화과를 가꾸는 사람입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자의 아들’로 번역할 수 있습니다. 히브리어 관용구는 문자적 혈연보다 예언자 집단에 속함을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뽕나무무화과를 손질하는 사람’으로 번역할 수 있습니다. 히브리어는 무화과를 가꾸거나 준비하는 행위를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 서두를 자연스러운 현대 한국어로 옮기되, ‘대답하여 말하다’의 이중 동작을 살려 서술 리듬을 보존했습니다.
- source_word: לֹא נָבִיא אָנֹכִי
  english_pob_choice: I am not a prophet
  chosen_korean: 나는 예언자가 아니며
  alternatives_korean:
  - 나는 예언자가 아닙니다
  - 나는 예언자 아닙니다
  lexicon: HALOT
  rationale: אָנֹכִי의 강조를 살리면서도 합쇼체 문맥에 맞게 평이하게 옮겼습니다.
- source_word: וְלֹא בֶן נָבִיא אָנֹכִי
  english_pob_choice: nor am I a son of a prophet
  chosen_korean: 예언자의 아들도 아닙니다
  alternatives_korean:
  - 예언자의 아들도 아니며
  - 예언자의 아들이 아닙니다
  lexicon: HALOT
  rationale: ‘아들’ 직역을 유지해 히브리어 관용구의 소속/계열 뉘앙스를 남겼고, 한국어에서는 자연스럽게 부정 접속으로 연결했습니다.
- source_word: בוֹקֵר ... וּבוֹלֵס שִׁקְמִים
  english_pob_choice: a herdsman and a dresser of sycamore figs
  chosen_korean: 목축하는 사람이며 뽕나무무화과를 가꾸는 사람입니다
  alternatives_korean:
  - 목자이며 뽕나무무화과를 다루는 사람입니다
  - 소를 치는 사람이며 뽕나무무화과를 손질하는 사람입니다
  lexicon: HALOT
  rationale: בוֹקֵר는 단순한 ‘목자’보다 가축을 돌보는 생업을 넓게 드러내는 표현으로 처리했고, שִׁקְמִים은 ‘뽕나무무화과’로 옮겨 현대 독자가 과실을 이해하도록 했습니다.
theological_decisions:
- issue: 아모스의 자기 부정이 직분 부정인지, 직업/길드 소속 부정인지
  chosen_reading: 본문은 해석을 확정하지 않고, 아모스의 자기 진술을 그대로 살려 두었습니다.
  alternative_readings:
  - 예언직 자체를 부정하는 말로 읽음
  - 직업상 예언자, 곧 예언자 길드의 구성원이 아님을 뜻함
  rationale: 이 구절은 아모스의 실제 예언자적 발화와 긴장을 이루므로, 한국어 본문에서 그 긴장을 해소하지 않고 남겨 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 'POB 번역 원칙: 신학적 긴장은 번역에서 미리 해결하지 않는다.'
