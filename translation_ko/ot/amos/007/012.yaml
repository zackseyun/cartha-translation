  text: וַ/יֹּ֤אמֶר אֲמַצְיָה֙ אֶל עָמ֔וֹס חֹזֶ֕ה לֵ֥ךְ בְּרַח לְ/ךָ֖ אֶל אֶ֣רֶץ יְהוּדָ֑ה וֶ/אֱכָל שָׁ֣ם לֶ֔חֶם וְ/שָׁ֖ם תִּנָּבֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/012.yaml
  text: Then Amaziah said to Amos[a], “Seer, go, flee away to the land of Judah, and eat bread there, and prophesy there.”
  footnotes:
  - marker: a
    text: Or 'earn your bread there' / 'make your living there'; the phrase 'eat bread' likely carries the sense of making one's livelihood there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 아마샤가 아모스에게 말했습니다. 「선견자여, 가서 유다 땅으로 도망가십시오. 거기서 먹고살고 거기서 예언하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거기서 빵을 먹으라’입니다. 문맥상 ‘거기서 생계를 꾸리라/먹고살라’는 뜻으로 쓰인 표현일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֶה
  english_pob_choice: Seer
  chosen_korean: 선견자
  alternatives_korean:
  - 환상가
  - 예언자
  lexicon: HALOT
  rationale: חֹזֶה는 일반적인 נָבִיא보다 ‘보는 자’라는 뜻이 더 분명한 전문 용어이므로, 직무를 살리면서도 위계가 강한 교회 용어인 ‘예언자’로 평탄화하지 않고 ‘선견자’로 옮겼습니다.
- source_word: בְּרַח לְךָ
  english_pob_choice: flee away
  chosen_korean: 도망가십시오
  alternatives_korean:
  - 달아나십시오
  - 어서 떠나십시오
  lexicon: HALOT
  rationale: 직역하면 ‘너 자신을 위해 도망가라’는 급박한 명령이므로, 한국어에서는 강한 추방 뉘앙스를 살리는 ‘도망가십시오’가 가장 자연스럽습니다.
- source_word: וֶאֱכָל שָׁם לֶחֶם
  english_pob_choice: eat bread there
  chosen_korean: 거기서 먹고살고
  alternatives_korean:
  - 거기서 빵을 먹고
  - 거기서 양식을 먹고
  lexicon: HALOT
  rationale: ‘빵/양식’을 문자적으로 유지할 수도 있으나, 문맥상 생계를 꾸리라는 조롱 섞인 표현이므로 본문은 한국어 관용 표현으로 살리되, 원문 이미지의 생계 의미를 드러내도록 했습니다.
- source_word: תִּנָּבֵא
  english_pob_choice: prophesy
  chosen_korean: 예언하십시오
  alternatives_korean:
  - 예언자로 일하십시오
  - 예언하십시오
  lexicon: HALOT
  rationale: נבא의 표준 동사 의미를 따라 ‘예언하다’로 옮겼고, 명령형 공손체를 사용해 화자의 명령적 어조를 유지했습니다.
theological_decisions:
- issue: ‘eat bread there’의 의미를 생계 의미로 드러낼지 여부
  chosen_reading: 본문에는 ‘먹고살고’로 자연스럽게 옮기고, 원문이 가진 생계·직업적 함의를 유지했습니다.
  alternative_readings:
  - ‘거기서 빵을 먹고’처럼 더 직역하기
  - ‘거기서 생계를 꾸리고’처럼 더 해석적으로 옮기기
  rationale: 아마샤의 말은 아모스를 ‘직업 예언자’처럼 조롱하며 유다에서 생계를 해결하라는 뜻을 내포하므로, 한국어 본문은 이해 가능한 관용 표현으로 옮기되 원문의 비꼬는 뉘앙스를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
