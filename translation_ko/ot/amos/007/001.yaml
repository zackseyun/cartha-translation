revisions:
- from: 주 하나님이 저에게 보여 주셨습니다. 보라, 그가 봄 곡식이 돋기 시작할 때 메뚜기 떼를 만들고 계셨는데, 보라, 그것은 왕의 베어 낸 풀 뒤에 난 봄 곡식이었습니다.[a][b]
  to: 주 야훼께서 나에게 이렇게 보여 주셨습니다. 보십시오, 그분께서 늦은 곡식[a]이 돋아나기 시작할 때 메뚜기 떼를 지어 내고 계셨습니다. 보십시오, 그것은 왕의 베기[b] 뒤에 난 늦은 곡식이었습니다.
  rationale: 원문의 환시 도입 표현과 두 차례의 וְהִנֵּה를 보존했습니다. לֶקֶשׁ의 ‘후기 성장’이라는 핵심을 ‘늦은 곡식’으로 옮기고, 왕의 베기에 관한 구체적 농작물 추정은 본문이 아니라 각주에 남겨 원문의 모호성을 유지했습니다. 각주 표지도 해당 어구 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:52Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. כֹּה(‘이와 같이’)가 현 초안에서 빠졌고, לֶקֶשׁ는 일반적인 ‘봄 곡식’보다는 앞선 베기 뒤에 나는 ‘늦은/후기 성장분’이라는 뜻을 보존해야 합니다. 또한 ‘왕의 베어 낸 풀’은 히브리어가 명시하지 않는 ‘풀’을 본문에 확정적으로 더합니다.
  naturalness: ‘주 야훼께서 나에게 이렇게 보여 주셨습니다’와 ‘왕의 베기 뒤에 난 늦은 곡식’은 현대 표준어 합쇼체에서 자연스럽고, 환시의 제시를 ‘보십시오’의 반복으로 살립니다.
  terminology: אֲדֹנָי יְהוִה는 제공된 신명 정책 및 한국어에서의 신명 표기를 따라 ‘주 야훼’로 옮겼습니다. גֹּבַי는 ‘메뚜기 떼’, לֶקֶשׁ는 ‘늦은 곡식’으로 일관되게 처리했습니다. ‘왕의 베기’는 원문의 다소 불확정적인 절단물/베기 표현을 보존하며 각주에서 가능한 역사적 배경을 제한적으로 설명합니다.
  issues:
  - severity: medium
    issue: 환시 도입의 כֹּה가 누락되었습니다.
    rationale: ‘이와 같이’는 하나님이 보여 주신 환시의 내용이 뒤따름을 표시하므로 번역에 반영하는 것이 좋습니다.
  - severity: high
    issue: לֶקֶשׁ를 ‘봄 곡식’으로 확정했습니다.
    rationale: 이 단어는 앞선 베기 뒤의 후기 성장 또는 늦은 작물을 가리킵니다. 계절을 단순히 ‘봄’으로 고정하면 농업적 순서와 어휘의 핵심 의미가 약화됩니다.
  - severity: medium
    issue: ‘왕의 베어 낸 풀’이 ‘풀’을 본문에 보충합니다.
    rationale: גִּזֵּי는 베기/절단물이라는 뜻이나, 본문 자체는 그것이 정확히 풀인지 명시하지 않습니다. ‘왕의 베기’로 두고 문화적 추정은 각주에 한정하는 편이 안전합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 놓여 해당 어구와의 연결이 불명확합니다.
    rationale: 어휘 각주는 ‘늦은 곡식’ 뒤에, 문화 각주는 ‘왕의 베기’ 뒤에 붙여 각주의 지시 대상을 분명히 해야 합니다.
  revised_text: 주 야훼께서 나에게 이렇게 보여 주셨습니다. 보십시오, 그분께서 늦은 곡식[a]이 돋아나기 시작할 때 메뚜기 떼를 지어 내고 계셨습니다. 보십시오, 그것은 왕의 베기[b] 뒤에 난 늦은 곡식이었습니다.
