id: AMO.7.1
reference: Amos 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּה֙ יוֹצֵ֣ר גֹּבַ֔י בִּ/תְחִלַּ֖ת עֲל֣וֹת הַ/לָּ֑קֶשׁ וְ/הִ֨נֵּה לֶ֔קֶשׁ אַחַ֖ר גִּזֵּ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], he was forming locusts at the beginning of the spring crop''s coming up, and behold[b], it was the spring crop after the king''s mowings.'
  footnotes:
  - marker: a
    text: Or 'the late crop' or 'the latter growth.' The Hebrew term refers to the later spring growth after an earlier cutting.
    reason: lexical_alternative
  - marker: b
    text: '''The king''s mowings'' likely refers to an initial cutting of grass or fodder claimed as royal due, after which the later crop would grow.'
    reason: cultural_note
translation:
  language: ko
  text: 주 하나님이 저에게 보여 주셨습니다. 보라, 그가 봄 곡식이 돋기 시작할 때 메뚜기 떼를 만들고 계셨는데, 보라, 그것은 왕의 베어 낸 풀 뒤에 난 봄 곡식이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '늦은 곡식', '뒤늦은 성장'으로도 옮길 수 있습니다. 히브리어는 앞선 베기 뒤에 난 뒤늦은 봄 성장분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕의 베어 낸 풀’은 왕에게 세금처럼 귀속된 첫 풀베기나 사료용 절단을 가리키는 표현일 가능성이 큽니다. 그 뒤에 난 곡식이 바로 심판 환시의 대상입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님이십니다
  lexicon: WLC
  rationale: 합쇼체 서술문에서 אֲדֹנָי יְהוִה의 이중 호칭을 자연스럽게 살리되, 본문의 환시 도입 공식성을 유지하기 위해 '주 하나님'으로 옮겼습니다.
- source_word: הִרְאַנִי
  english_pob_choice: showed me
  chosen_korean: 저에게 보여 주셨습니다
  alternatives_korean:
  - 저에게 보이셨습니다
  - 저에게 나타내 주셨습니다
  lexicon: HALOT
  rationale: 환시 문맥의 사역적 '보이다'를 한국어의 자연스러운 합쇼체로 옮겨, 예언자가 받은 계시라는 성격을 유지했습니다.
- source_word: גֹּבַי
  english_pob_choice: locusts
  chosen_korean: 메뚜기 떼
  alternatives_korean:
  - 메뚜기들
  - 메뚜기 무리
  lexicon: HALOT
  rationale: 농경 심판 환시에서 단수 명사보다 집단성을 드러내는 표현이 적절하므로 '메뚜기 떼'로 옮겼습니다.
- source_word: לֶקֶשׁ / הַלָּקֶשׁ
  english_pob_choice: the spring crop
  chosen_korean: 봄 곡식
  alternatives_korean:
  - 뒤늦은 곡식
  - 늦은 곡식
  - 뒤늦게 난 곡식
  lexicon: HALOT
  rationale: POB가 지시한 후기 성장한 곡식의 뜻을 한국어에서 직관적으로 드러내기 위해 '봄 곡식'을 택했고, 농업적 시기감을 살렸습니다.
- source_word: גִּזֵּי הַמֶּלֶךְ
  english_pob_choice: the king's mowings
  chosen_korean: 왕의 베어 낸 풀
  alternatives_korean:
  - 왕의 깎은 풀
  - 왕의 첫 베기
  - 왕의 베어 낸 초목
  lexicon: HALOT
  rationale: 왕에게 귀속된 첫 풀베기를 가리키는 문화적 배경을 반영하여, 문맥상 자연스러운 '베어 낸 풀'로 풀어 옮겼습니다.
theological_decisions:
- issue: 환시 도입어 וְהִנֵּה의 반복 처리
  chosen_reading: 보라로 두 번 반복
  alternative_readings:
  - 그리고 보니
  - 그런데
  rationale: 히브리어의 시각적·긴급한 제시감을 유지하기 위해 POB의 'behold'에 맞추어 '보라'를 반복했습니다.
  doctrine_reference: 예언서 환시 서술 관례
