id: AMO.7.6
reference: Amos 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִחַ֥ם יְהוָ֖ה עַל זֹ֑את גַּם הִיא֙ לֹ֣א תִֽהְיֶ֔ה אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/006.yaml
  text: 'Yahweh relented concerning this also: “It too shall not happen,” said the Lord GOD[a].'
  footnotes:
  - marker: a
    text: Or “changed his mind concerning this”; Hebrew anthropopathic language describing the LORD’s response to intercession.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이 일에 대해서도 뜻을 돌이키셨습니다. “이 일도 일어나지 않을 것입니다.”라고 주 하나님께서 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일에 대해 마음을 바꾸셨다.” 히브리어의 인격적 표현으로, 간구에 대한 야훼의 반응을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם / יְהוָה
  english_pob_choice: relented / Yahweh
  chosen_korean: 야훼께서 … 뜻을 돌이키셨습니다
  alternatives_korean:
  - 야훼께서 … 후회하셨습니다
  - 야훼께서 … 마음을 바꾸셨습니다
  lexicon: HALOT
  rationale: נִחַם의 핵심은 문맥상 중보에 대한 반응으로서의 ‘relenting’이므로, 한국어도 관계적 반응을 살리면서도 하나님께 실수나 도덕적 후회를 암시하지 않는 ‘뜻을 돌이키다’를 택했습니다. יְהוָה는 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: עַל זֹאת
  english_pob_choice: concerning this
  chosen_korean: 이 일에 대해서도
  alternatives_korean:
  - 이 일에 관하여도
  - 이 일과 관련해서도
  lexicon: HALOT
  rationale: עַל זֹאת는 여기서 심판 환상으로 제시된 사건을 가리키는 말이므로, 자연스럽고 축약된 현대어로 ‘이 일에 대해서도’라고 옮겼습니다.
- source_word: גַּם הִיא
  english_pob_choice: It too
  chosen_korean: 이 일도
  alternatives_korean:
  - 그것도
  - 이것도
  lexicon: HALOT
  rationale: 여성형 대명사는 앞서 언급된 재난/사건을 가리키며, 추가 강조의 גַּם을 살리기 위해 ‘이 일도’로 간결하게 번역했습니다.
- source_word: לֹא תִהְיֶה
  english_pob_choice: shall not happen
  chosen_korean: 일어나지 않을 것입니다
  alternatives_korean:
  - 존재하지 않을 것입니다
  - 있지 않을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘되지 않을 것이다’이지만, 문맥상 선언된 사건의 비발생을 뜻하므로 현대 한국어에서 가장 자연스러운 ‘일어나지 않을 것입니다’를 택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님께서
  alternatives_korean:
  - 주 야훼께서
  - 주님 하나님께서
  lexicon: HALOT
  rationale: אֲדֹנָי + יְהוִה의 결합은 호칭과 신명을 함께 담고 있어, 한국어에서는 통상적인 ‘주 하나님’으로 옮기되 동사의 주어 표지는 유지했습니다.
theological_decisions:
- issue: נִחַם을 하나님에게 적용할 때의 인격적·유비적 표현
  chosen_reading: ‘뜻을 돌이키셨습니다’로 유지해, 중보에 응답하시는 하나님의 관계적 언어를 보존했습니다.
  alternative_readings:
  - 후회하셨습니다
  - 마음을 바꾸셨습니다
  rationale: 본문은 아모스의 간구 이후 심판 선언이 유보되는 장면이므로, 신학적 긴장을 지우지 않으면서도 오해를 줄이는 표현이 필요했습니다. ‘뜻을 돌이키다’는 본문의 유비적 언어를 가장 온전히 살립니다.
  doctrine_reference: 하나님의 변개 가능성에 대한 교리적 단정 대신 본문이 드러내는 응답성을 보존
