source:
  edition: WLC
  text: וּ/בֵֽית אֵ֔ל לֹֽא תוֹסִ֥יף ע֖וֹד לְ/הִנָּבֵ֑א כִּ֤י מִקְדַּשׁ מֶ֨לֶךְ֙ ה֔וּא וּ/בֵ֥ית מַמְלָכָ֖ה הֽוּא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/013.yaml
  text: But at Bethel you must not prophesy any longer[a], for it is the king’s sanctuary[b], and it is a royal house.
  footnotes:
  - marker: a
    text: Or 'do not prophesy again' / 'you shall no longer prophesy.' The Hebrew literally says 'do not add any more to prophesy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the house of the kingdom.' The phrase likely refers to Bethel as an institution of the royal regime.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 벧엘에서는 더 이상 예언하지 마십시오[a]. 이는 그곳이 왕의 성소이며 왕국의 집이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 예언하지 마십시오’ / ‘더 이상 예언하지 마십시오.’ 히브리어는 문자적으로 ‘예언하는 일을 더 이상 더하지 말라’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕권의 집.’ 이 표현은 벧엘이 왕정 체제의 제도적 일부라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֵית אֵל
  english_pob_choice: But at Bethel
  chosen_korean: 벧엘에서는
  alternatives_korean:
  - 그리고 벧엘에서는
  - 벧엘에서
  lexicon: HALOT
  rationale: וּ는 앞선 맥락에 이어지는 접속이지만, 여기서는 아마샤의 금지 발언으로 이어지는 전환이므로 한국어에서는 역접 느낌을 살린 ‘그러나’로 자연스럽게 옮기고, 장소 부사격은 ‘벧엘에서는’로 처리했습니다.
- source_word: לֹא תוֹסִ֥יף ע֖וֹד לְ/הִנָּבֵ֑א
  english_pob_choice: you must not prophesy any longer
  chosen_korean: 다시는 예언하지 마십시오
  alternatives_korean:
  - 더 이상 예언하지 마십시오
  - 예언을 더 이상 계속하지 마십시오
  lexicon: HALOT
  rationale: יסף + עוד + 부정 부정형은 ‘더/다시 …하지 말라’는 반복·지속 금지를 나타내므로, 직역을 과도하게 늘리지 않고 자연스러운 금지 표현인 ‘다시는 예언하지 마십시오’로 옮겼습니다.
- source_word: מִקְדַּשׁ מֶלֶךְ
  english_pob_choice: the king’s sanctuary
  chosen_korean: 왕의 성소
  alternatives_korean:
  - 왕의 성역
  - 왕의 신성한 장소
  lexicon: HALOT
  rationale: מִקְדַּשׁ은 성소/신성한 장소를 뜻하며, 소유격 구조는 왕에게 속한 성소라는 정치·종교적 성격을 드러냅니다. 교회식의 ‘성전’보다 원문에 더 가까운 ‘성소’를 택했습니다.
- source_word: וּ/בֵית מַמְלָכָה
  english_pob_choice: a royal house
  chosen_korean: 왕실입니다
  alternatives_korean:
  - 왕국의 집입니다
  - 왕권의 집입니다
  - 왕의 집입니다
  lexicon: HALOT
  rationale: ‘집’과 ‘왕권/왕국’의 결합은 단순한 건물을 넘어 왕정 체제에 속한 기관성을 가리키므로, 한국어에서는 의미를 살린 ‘왕실’이 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 벧엘의 성격을 어떤 톤으로 옮길 것인가
  chosen_reading: 아마샤의 정치·종교적 주장으로서 ‘왕의 성소’와 ‘왕실’을 서술적으로 옮기되, 그 정당성을 암시하지 않았습니다.
  alternative_readings:
  - ‘국가 성소’처럼 더 해석적으로 옮길 수 있음
  - ‘성전’으로 일반화할 수 있음
  rationale: 이 구절은 벧엘 예배의 신학적 정당성을 말하는 것이 아니라, 아마샤가 예언을 막기 위해 내세우는 권력의 근거를 보고합니다. 따라서 주장 자체의 정치성을 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
