language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֲמַצְיָה֙ כֹּהֵ֣ן בֵּֽית אֵ֔ל אֶל יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר קָשַׁ֨ר עָלֶ֜י/ךָ עָמ֗וֹס בְּ/קֶ֨רֶב֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹא תוּכַ֣ל הָ/אָ֔רֶץ לְ/הָכִ֖יל אֶת כָּל דְּבָרָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/010.yaml
  text: Then Amaziah[a], the priest of Bethel, sent word to Jeroboam king of Israel, saying, “Amos has conspired against you in the midst of the house of Israel[c][b]; the land is not able to bear all his words.”
  footnotes:
  - marker: a
    text: Or 'has plotted against you.' The Hebrew verb can denote conspiracy or plotting, especially in political settings.
    reason: lexical_alternative
  - marker: b
    text: Or 'among the house of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the land is not able to contain/endure all his words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 베델의 제사장 아마샤가 이스라엘 왕 여로보암에게 전갈을 보내어 말했습니다. 「아모스가 이스라엘 집 한가운데서 당신을 거슬러 음모를 꾸몄습니다[a][b]. 이 땅은 그의 모든 말을 감당할 수 없습니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 반역을 꾀했습니다’. 이 히브리어 동사는 특히 정치적 상황에서 음모나 책략을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 집 가운데서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이 땅은 그의 모든 말을 담아/견디어 낼 수 없습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent word
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보냈습니다
  - 전갈을 보냈습니다
  lexicon: HALOT
  rationale: 메신저 공식으로서 실제로 무엇을 보냈는지 명시되지 않으므로, 한국어에서는 전달 행위를 자연스럽게 드러내는 ‘사람을 보내어’가 원문의 통신 행위를 잘 살립니다.
- source_word: קָשַׁר
  english_pob_choice: has conspired
  chosen_korean: 반역을 꾀했습니다
  alternatives_korean:
  - 음모를 꾸몄습니다
  - 공모했습니다
  lexicon: HALOT
  rationale: 이 동사는 정치적 상황에서의 결탁·반역을 강하게 암시하므로, 단순한 ‘계획하다’보다 왕에게 고발하는 뉘앙스를 살리는 ‘반역을 꾀했습니다’가 적절합니다.
- source_word: בְּקֶרֶב בֵּית יִשְׂרָאֵל
  english_pob_choice: in the midst of the house of Israel
  chosen_korean: 이스라엘 집 한가운데서
  alternatives_korean:
  - 이스라엘 집 가운데서
  - 이스라엘 집 안에서
  lexicon: HALOT
  rationale: ‘בְּקֶרֶב’의 공간적·사회적 긴장을 유지하기 위해 ‘한가운데서’를 택해, 아모스가 외부가 아니라 그 공동체 내부에서 활동한다는 점을 드러냈습니다.
- source_word: לֹא תוּכַ֣ל הָאָרֶץ לְהָכִיל
  english_pob_choice: the land is not able to bear
  chosen_korean: 이 땅은 ... 감당할 수 없습니다
  alternatives_korean:
  - 이 땅은 ... 견딜 수 없습니다
  - 이 땅은 ... 담아낼 수 없습니다
  lexicon: HALOT
  rationale: ‘לְהָכִיל’은 포함하다/견디다의 범위를 가지므로, 한국어에서는 ‘감당하다’를 사용해 아마샤의 과장된 불평을 자연스럽고 압축적으로 재현했습니다.
theological_decisions:
- issue: 아마샤의 발화가 실제 죄를 판정하는지 여부
  chosen_reading: 아마샤의 정치적 고발로 처리하고, 화자의 주장 자체를 번역문 안에 유지했습니다.
  alternative_readings:
  - 아모스가 실제로 반역했다는 서술로 평평하게 옮김
  - ‘음모’보다 중립적인 ‘계획’으로 완화함
  rationale: 본문은 내레이터의 판결이 아니라 왕에게 보내는 고발문이므로, 아모스를 범죄자로 확정하지 않고 고발의 수사학을 그대로 드러내는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
