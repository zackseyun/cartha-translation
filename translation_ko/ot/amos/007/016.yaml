revisions:
- from: 이제 야훼의 말씀을 들으십시오. 당신은 말하기를 ‘이스라엘을 향해 예언하지 말며, 이사악의 집을 향해 선포하지 말라’고 합니다.[a]
  to: 이제 야훼의 말씀을 들으십시오. 당신은 ‘이스라엘을 거슬러 예언하지 말고, 이삭의 집을 거슬러 선포하지 말라[a]’고 말합니다.
  rationale: 적대적 문맥의 עַל을 ‘거슬러’로 명확히 하고, 고유명사를 통용 표기인 ‘이삭’으로 바로잡았습니다. 또한 현대 합쇼체에 맞게 인용 도입부를 다듬고, נטף의 문자적 의미와 예언적 관용 용법을 정확히 설명하도록 각주를 수정했습니다. 각주 표지는 대안 번역이 적용되는 ‘선포하지 말라’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:18Z'
