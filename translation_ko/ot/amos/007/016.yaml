  verdict: revise
  source_fidelity: 히브리어의 명령 구조와 대조되는 두 예언 발화 동사는 대체로 반영되어 있으나, עַל의 문맥상 적대적 방향은 ‘~을 향해’보다 더 분명히 나타낼 필요가 있습니다. נטף의 문자적 의미를 설명하는 각주에는 부정확한 ‘드리우다’가 포함되어 있습니다.
  naturalness: 본문의 ‘당신은 말하기를 …고 합니다’는 현대 표준 한국어로 다소 부자연스럽고, 인용문 뒤의 서술도 합쇼체 문맥에 맞게 정리하는 편이 자연스럽습니다.
  terminology: יהוה는 프로젝트 방침에 맞게 ‘야훼’로 유지합니다. יִשְׂחָק은 한국어 성서 및 현대 한국어의 통용 표기인 ‘이삭’이 적절합니다. ‘이삭의 집’은 원문의 비유적 집단 명칭을 보존합니다.
