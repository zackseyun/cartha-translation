id: AMO.7.16
reference: Amos 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע דְּבַר יְהוָ֑ה אַתָּ֣ה אֹמֵ֗ר לֹ֤א תִנָּבֵא֙ עַל יִשְׂרָאֵ֔ל וְ/לֹ֥א תַטִּ֖יף עַל בֵּ֥ית יִשְׂחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/016.yaml
  text: 'And now[a], hear the word of Yahweh: You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’'
  footnotes:
  - marker: a
    text: Or 'do not pour out words against the house of Isaac.' The Hebrew verb behind 'preach' is literally 'drip' and is used idiomatically for prophetic speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼의 말씀을 들으십시오. 당신은 말하기를 ‘이스라엘을 향해 예언하지 말며, 이사악의 집을 향해 선포하지 말라’고 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이사악의 집을 향해 말을 쏟아내지 말라’일 수 있습니다. 여기서 히브리어 동사는 문자적으로는 ‘똑똑 떨어지다/드리우다’의 뜻이며, 예언적 발화를 가리키는 관용적으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 예언적 대화의 급전환을 자연스럽게 살리면서도 접속과 시간 전환을 간결하게 나타냅니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 선포
  lexicon: HALOT
  rationale: דָּבָר의 예언자적·계시적 무게를 ‘말씀’으로 살리고, 프로젝트 기본값에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: תַטִּיף
  english_pob_choice: preach
  chosen_korean: 선포하지 말라
  alternatives_korean:
  - 예언하지 말라
  - 말하지 말라
  - 쏟아내지 말라
  lexicon: HALOT
  rationale: נטף의 관용적 예언 발화 의미를 드러내면서도, ‘preach’보다 한국어에서 더 직접적으로 선지자적 발화를 가리키는 표현으로 옮겼습니다.
- source_word: בֵּית יִשְׂחָק
  english_pob_choice: the house of Isaac
  chosen_korean: 이사악의 집
  alternatives_korean:
  - 이삭의 집
  - 이사악 집안
  - 이사악 가문
  lexicon: HALOT
  rationale: 예언적 별칭을 평이하게 풀기보다 원문의 ‘집’ 표현을 보존했습니다. 고유명사는 현대 외래어 표기법에 따라 ‘이사악’으로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절은 신적 이름을 직접 사용하므로, 프로젝트 기본값과 원문 가시성을 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'POB terminology default: יהוה / YHWH → 야훼'
- issue: עַל יִשְׂרָאֵל / עַל בֵּית יִשְׂחָק의 방향성
  chosen_reading: 이스라엘을 향해 / 이사악의 집을 향해
  alternative_readings:
  - 이스라엘을 상대로 / 이사악의 집을 상대로
  - 이스라엘에 대하여 / 이사악의 집에 대하여
  rationale: 아마샤의 금지는 중립적 주제 언급이 아니라 적대적 예언 금지이므로, 관계의 긴장을 살리되 한국어에서 과도하게 군사화되지 않도록 ‘향해’로 처리했습니다.
  doctrine_reference: Original-language primacy over translation tradition
