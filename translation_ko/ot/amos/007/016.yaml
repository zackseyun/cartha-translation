    rationale: 한국어 성서 문맥에서 해당 족장 이름의 확립되고 널리 통용되는 표기는 ‘이삭’입니다.
  - severity: medium
    issue: 각주의 문자적 동사 설명에 ‘드리우다’를 포함함
    rationale: נטף의 기본 이미지는 ‘방울방울 떨어지다/떨어뜨리다’이며, ‘드리우다’는 해당 어휘의 적절한 문자적 의미가 아닙니다.
  - severity: low
