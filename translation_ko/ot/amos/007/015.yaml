base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
  footnotes:
  - marker: a
    text: Or “from behind the flock,” more literally reflecting the Hebrew idiom.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “to my people Israel”; in context the prophetic message includes judgment, but the verse itself does not explicitly say “against.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 야훼께서 양 떼를 따르던 자리에서[a] 저를 데려가셨고, 야훼께서 저에게 말씀하셨습니다. 「가서 내 백성 이스라엘에게[b] 예언하라.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현을 더 문자적으로 옮기면 “양 떼 뒤에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 “내 백성 이스라엘에게”라고 말하며, 이 구절 자체에는 “거슬러”라는 뜻이 명시되지 않습니다.
    reason: alternative_reading
