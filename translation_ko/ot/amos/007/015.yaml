source:
  edition: WLC
  text: וַ/יִּקָּחֵ֣/נִי יְהוָ֔ה מֵ/אַחֲרֵ֖י הַ/צֹּ֑אן וַ/יֹּ֤אמֶר אֵלַ/י֙ יְהוָ֔ה לֵ֥ךְ הִנָּבֵ֖א אֶל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
  footnotes:
  - marker: a
    text: Or “from behind the flock,” more literally reflecting the Hebrew idiom.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says “to my people Israel”; in context the prophetic message includes judgment, but the verse itself does not explicitly say “against.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 야훼께서 저를 양 떼 뒤에서 데려가셨고, 야훼께서 저에게 말씀하셨습니다. 「가서 내 백성 이스라엘에게 예언하라」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 더 문자적으로 옮기면 “양 떼 뒤에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 “내 백성 이스라엘에게”라고 말하며, 이 구절 자체에는 “거슬러/against”가 명시되지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC/HALOT
  rationale: 원문 고유명 יְהוָה를 제목이 아닌 하나님의 이름으로 살려 옮기기 위해, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: וַיִּקָּחֵנִי מֵאַחֲרֵי הַצֹּאן
  english_pob_choice: took me from following the flock
  chosen_korean: 저를 양 떼 뒤에서 데려가셨고
  alternatives_korean:
  - 저를 양 떼를 따르던 자리에서 데려가셨고
  - 저를 양 떼를 몰던 자리에서 데려가셨고
  lexicon: WLC/HALOT
  rationale: ‘from after the flock’라는 히브리어 관용을 너무 풀이하지 않으면서도 한국어로 자연스럽게 전하기 위해 ‘양 떼 뒤에서’와 ‘데려가셨다’를 택했습니다.
- source_word: הִנָּבֵא
  english_pob_choice: prophesy
  chosen_korean: 예언하라
  alternatives_korean:
  - 예언을 선포하라
  - 예언자처럼 말하라
  lexicon: WLC/HALOT
  rationale: נבא의 명령형은 예언 행위를 요구하므로, 직접적이고 간결한 동사 ‘예언하라’가 가장 잘 맞습니다.
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  english_pob_choice: to my people Israel
  chosen_korean: 내 백성 이스라엘에게
  alternatives_korean:
  - 내 백성 이스라엘을 향해
  - 내 백성 이스라엘에게로
  lexicon: WLC/HALOT
  rationale: 전치사 אֶל의 기본값인 ‘~에게/~을 향해’를 살리되, 한국어에서는 목적어 자리에 자연스럽게 오는 ‘내 백성 이스라엘에게’로 옮겼습니다.
theological_decisions:
- issue: 예언 명령의 방향성(‘to’ vs ‘against’)
  chosen_reading: ‘내 백성 이스라엘에게’로 옮겨, 본절 자체가 노골적으로 ‘against’를 말하지 않는 점을 보존했습니다.
  alternative_readings:
  - ‘내 백성 이스라엘을 향해’
  - ‘내 백성 이스라엘을 거슬러’
  rationale: 문맥상 심판 선포가 이어지더라도, 본문에는 אֶל(대개 ‘~에게’)이 쓰였으므로 본절만으로 대립 방향을 덧씌우지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
