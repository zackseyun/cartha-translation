theological_decisions:
- issue: 예언 명령의 방향성(‘to’ vs ‘against’)
  chosen_reading: ‘내 백성 이스라엘에게’로 옮겨, 본절 자체가 노골적으로 ‘against’를 말하지 않는 점을 보존했습니다.
  alternative_readings:
  - ‘내 백성 이스라엘을 향해’
  - ‘내 백성 이스라엘을 거슬러’
  rationale: 문맥상 심판 선포가 이어지더라도, 본문에는 אֶל(대개 ‘~에게’)이 쓰였으므로 본절만으로 대립 방향을 덧씌우지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
