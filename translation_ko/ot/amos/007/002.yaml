reference: Amos 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם כִּלָּה֙ לֶֽ/אֱכוֹל֙ אֶת עֵ֣שֶׂב הָ/אָ֔רֶץ וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ סְֽלַֽח נָ֔א מִ֥י יָק֖וּם יַֽעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/002.yaml
  text: And when it had finished eating the vegetation of the land[a], I said, “Lord GOD, please forgive! How can Jacob stand? For he is small.”
  footnotes:
  - marker: a
    text: Or, “Who will raise up Jacob?”
    reason: alternative_reading
translation:
  language: ko
  text: 그것이 그 땅의 풀을 다 먹어 버린 뒤에[a], 내가 말했습니다. “주 야훼여, 제발 용서해 주십시오! 야곱이 어떻게 설 수 있겠습니까? 그는 작기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “누가 야곱을 일으켜 세우겠습니까?”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  english_pob_choice: And when
  chosen_korean: 그 … 하고 나서
  alternatives_korean:
  - 그리고 그때
  - 그리고 … 때에
  lexicon: HALOT
  rationale: 히브리어 관용구가 다음 사건의 진행을 여는 시간 표현이므로, 단순 조건문처럼 보이지 않게 문맥상 자연스러운 순차 표현으로 옮겼습니다.
- source_word: כִּלָּה לֶאֱכוֹל
  english_pob_choice: it had finished eating
  chosen_korean: 다 먹어 치우고 나서
  alternatives_korean:
  - 먹기를 마치고
  - 다 삼키고 나서
  lexicon: HALOT
  rationale: 완료된 포식 행위를 살려, 대상의 파괴성을 드러내는 동적 표현을 사용했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님이여
  alternatives_korean:
  - 주 여호와여
  - 주 하나님
  lexicon: HALOT
  rationale: 아도나이와 야훼가 결합된 호칭을 한국어 경배 호격으로 자연스럽게 살리되, 직역의 어색함을 피했습니다.
- source_word: מִי יָקוּם יַעֲקֹב
  english_pob_choice: How can Jacob stand?
  chosen_korean: 야곱이 어떻게 설 수 있겠습니까?
  alternatives_korean:
  - 누가 야곱을 일으킬 수 있겠습니까?
  - 누가 야곱을 세우겠습니까?
  lexicon: HALOT
  rationale: 문맥상 심판을 견디지 못하는 절박한 탄원을 나타내므로, 존속 가능성을 묻는 수사 의문으로 옮겼습니다. 히브리어의 세움/일어남 가능성은 각주로 보존했습니다.
- source_word: כִּי קָטֹן הוּא
  english_pob_choice: For he is small
  chosen_korean: 그는 작기 때문입니다
  alternatives_korean:
  - 그는 보잘것없기 때문입니다
  - 그는 약하기 때문입니다
  lexicon: HALOT
  rationale: קָטֹן의 기본 의미인 ‘작다/작은’을 유지해, 민족의 왜소함과 취약함을 넓게 드러냈습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼 대신 본문에서는 호격 ‘주 하나님이여’로 처리했습니다.
  alternative_readings:
  - 야훼
  - 주 여호와여
  rationale: 이 절의 직접 발화는 기도 호칭이므로, 본문 가독성과 예배적 어조를 위해 한국어 호격을 우선했습니다. 다만 표제어 차원의 신명 표기는 별도 원칙과 충돌하지 않도록 처리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: מִי יָקוּם יַעֲקֹב의 해석
  chosen_reading: 야곱이 존립/생존할 수 없다는 탄원으로 읽었습니다.
  alternative_readings:
  - 누가 야곱을 일으킬 수 있겠습니까?
  - 야곱을 다시 세울 수 있겠습니까?
  rationale: 문맥상 아모스의 중보적 탄원이므로, 수사 의문을 생존 불능의 의미로 먼저 살렸고, 복원적 가능성은 각주에 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
