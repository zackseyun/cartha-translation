source:
  edition: WLC
  text: רָאִ֨יתִי אֶת אֲדֹנָ֜/י נִצָּ֣ב עַֽל הַ/מִּזְבֵּ֗חַ וַ/יֹּאמֶר֩ הַ֨ךְ הַ/כַּפְתּ֜וֹר וְ/יִרְעֲשׁ֣וּ הַ/סִּפִּ֗ים וּ/בְצַ֨עַ/ם֙ בְּ/רֹ֣אשׁ כֻּלָּ֔/ם וְ/אַחֲרִיתָ֖/ם בַּ/חֶ֣רֶב אֶהֱרֹ֑ג לֹֽא יָנ֤וּס לָ/הֶם֙ נָ֔ס וְ/לֹֽא יִמָּלֵ֥ט לָ/הֶ֖ם פָּלִֽיט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/001.yaml
  text: 'I saw the Lord standing beside the altar[a], and he said: Strike the capital, so that the thresholds may shake; shatter them on the heads of all of them. And I will kill their survivors with the sword; not one who flees among them will get away[d][c][b], and not one who escapes among them will be delivered.'
  footnotes:
  - marker: a
    text: Or 'standing on the altar.' The Hebrew preposition can be rendered 'on' or 'upon,' but the scene may also imply standing at or beside the altar in readiness to judge.
    reason: lexical_alternative
  - marker: b
    text: Or 'the pillar-cap' or 'the knob/capital.' The Hebrew term refers to the top architectural feature of the structure.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew is difficult: ''and cut/break them on the head of all of them.'' The sense is that the shattered structure falls on everyone present.'
    reason: lexical_alternative
  - marker: d
    text: Or 'their remnant.' Here the context favors those left alive after the initial destruction rather than a hopeful remnant.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 보니 주님께서 제단 곁에 서 계셨습니다[a]. 그분께서 말씀하셨습니다. 「기둥머리를 쳐서 문지방들이 흔들리게 하고, 그것들을 모두의 머리 위로 부숴라[c][b]. 그리하면 내가 남은 자들을 칼로 죽이겠다[d]. 그들 가운데 도망하는 자는 하나도 빠져나가지 못하고, 도망치는 자는 하나도 구출되지 못할 것이다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제단 위에 서 계셨다’. 히브리어 전치사는 ‘위에’와 ‘곁에’ 모두 가능하지만, 문맥상 심판을 집행하시는 장면일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기둥머리’, ‘주두’, ‘장식머리’. כאן의 히브리어는 구조물 상부의 건축 요소를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 난해합니다. 직역하면 ‘그것들을 모두의 머리 위에서/위로 부수라’에 가깝고, 전체 구조물이 안에 있는 사람들 위로 무너지는 장면으로 이해됩니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들의 남은 자’. 여기서는 소망의 ‘남은 자’라기보다 초기 파괴 뒤에 아직 남아 있는 사람들을 가리키는 것이 문맥에 더 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주
  lexicon: HALOT
  rationale: 환상 속 하나님의 주권적 호칭이므로 한국어에서는 예배적이면서도 현대적인 ‘주님’이 가장 자연스럽고, 여기서는 야훼의 이름이 아니라 אֲדֹנָי이므로 ‘여호와/야훼’로 옮기지 않았습니다.
- source_word: נִצָּב עַל הַמִּזְבֵּחַ
  english_pob_choice: standing beside the altar
  chosen_korean: 제단 곁에 서 계셨습니다
  alternatives_korean:
  - 제단 위에 서 계셨습니다
  - 제단에 서 계셨습니다
  - 제단 앞에 서 계셨습니다
  lexicon: HALOT
  rationale: עַל의 공간감은 남기되, 심판 환상의 장면에서는 ‘곁에’가 POB의 해석처럼 위압적·판결적 근접성을 더 잘 드러냅니다.
- source_word: הַכַּפְתּוֹר
  english_pob_choice: the capital
  chosen_korean: 기둥머리
  alternatives_korean:
  - 기둥 꼭대기
  - 장식머리
  - 주두
  lexicon: HALOT
  rationale: 성전/건축 구조의 상부 부재를 가리키는 말이므로, 현대 독자가 이해하기 쉬운 건축 용어로 ‘기둥머리’를 택했습니다.
- source_word: הַסִּפִּים
  english_pob_choice: the thresholds
  chosen_korean: 문지방들
  alternatives_korean:
  - 문설주들
  - 턱들
  - 임계부
  lexicon: HALOT
  rationale: 히브리어의 문턱/턱 구조를 직접 살리면서도, 기둥머리와의 병렬적 붕괴 이미지를 한국어로 선명하게 전달합니다.
- source_word: וּבְצַעַם בְּרֹאשׁ כֻּלָּם
  english_pob_choice: shatter them on the heads of all of them
  chosen_korean: 그것들을 모두의 머리 위로 부숴라
  alternatives_korean:
  - 그것들을 그들 모두의 머리 위에 부수어라
  - 그것들을 모두의 머리 위에서 부수어라
  lexicon: HALOT
  rationale: 본문의 난해한 בצע를 POB의 판단에 따라 붕괴/파쇄의 동작으로 반영하되, 한국어에서는 구조물이 아래의 사람들 위로 무너지는 장면을 간결하게 살렸습니다.
- source_word: וְאַחֲרִיתָם
  english_pob_choice: their survivors
  chosen_korean: 남은 자들
  alternatives_korean:
  - 생존자들
  - 남은 자
  - 남은 이들
  lexicon: HALOT
  rationale: 문맥상 희망적 ‘남은 자’가 아니라 처음 파괴 뒤에 남아 있는 사람들을 가리키므로, 원문의 후속 심판 대상을 자연스럽게 드러내는 ‘남은 자들’로 옮겼습니다.
- source_word: לֹא יָנוּס לָהֶם נָס וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  english_pob_choice: not one who flees among them will get away ... not one who escapes among them will be delivered
  chosen_korean: 그들 가운데 도망하는 자는 하나도 빠져나가지 못하고, 도망치는 자는 하나도 구출되지 못할 것이다
  alternatives_korean:
  - 그들 가운데 도망하는 자는 하나도 벗어나지 못하고, 도망치는 자는 하나도 건짐받지 못할 것이다
  - 그들 가운데 달아나는 자는 하나도 피하지 못하고, 달아나는 자는 하나도 구원받지 못할 것이다
  lexicon: HALOT
  rationale: 도망/도피의 평행을 살리면서, יִמָּלֵט의 탈출·구출 의미는 ‘구출되지 못하다’로 옮겨 결말의 전면적 차단을 드러냈습니다.
theological_decisions:
- issue: 제단 위/곁의 환상 장면과 심판 권위의 표현
  chosen_reading: ‘제단 곁에 서 계셨습니다’로 번역해, 심판을 집행하시는 주님의 임박성과 판결권을 함께 드러냈습니다.
  alternative_readings:
  - ‘제단 위에 서 계셨습니다’
  - ‘제단에 서 계셨습니다’
  rationale: 히브리어 עַל은 ‘위에’로도 읽을 수 있지만, POB의 해석처럼 심판 장면의 긴박한 현장성을 한국어에서 더 분명히 전달하는 쪽이 본문 효과를 잘 보존합니다.
  doctrine_reference: 본문은 예언 환상 속 주님의 심판 선포를 제시하며, 호칭은 אֲדֹנָי로 유지합니다.
