- source_word: לֹא יָנוּס לָהֶם נָס וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  english_pob_choice: not one who flees among them will get away ... not one who escapes among them will be delivered
  chosen_korean: 그들 가운데 도망하는 자는 하나도 빠져나가지 못하고, 도망치는 자는 하나도 구출되지 못할 것이다
  alternatives_korean:
