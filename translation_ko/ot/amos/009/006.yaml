theological_decisions:
- issue: 우주적 건축 이미지(상층/둥근 천장)의 보존
  chosen_reading: 현대 과학적 설명으로 평면화하지 않고, 창조주를 우주 건축가로 묘사하는 시적 이미지를 살렸습니다.
  alternative_readings:
  - ‘상층실’/‘돔’처럼 더 직역하기
  - ‘하늘 궁전’처럼 해석적으로 옮기기
  rationale: 본 절은 하나님의 창조 주권을 고대 우주론의 건축 은유로 찬양하므로, 이미지의 강도를 유지하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 여호와/야훼 처리
  chosen_reading: 히브리어 신명사 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 대체하기
  - ‘여호와’로 옮기기
  rationale: 본문이 실제 고유명으로 하나님을 지칭하므로, 표제어가 아닌 이름을 보존하는 것이 원문 가시성과 감사 찬양의 정점을 살립니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
