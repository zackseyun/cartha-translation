source:
  edition: WLC
  text: הַ/בּוֹנֶ֤ה בַ/שָּׁמַ֨יִם֙ מעלות/ו וַ/אֲגֻדָּת֖/וֹ עַל אֶ֣רֶץ יְסָדָ֑/הּ הַ/קֹּרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/006.yaml
  text: He who builds his upper chambers in the heavens[a], and has founded his vault upon the earth[b], who calls for the waters of the sea and pours them out upon the face of the earth—Yahweh is his name.
  footnotes:
  - marker: a
    text: Or 'his ascents' or 'his steps' for 'his upper chambers.' The Hebrew term can denote heights, stairways, or upper rooms; here it likely refers to elevated heavenly structures.
    reason: lexical_alternative
  - marker: b
    text: Or 'his band,' 'his structure,' or 'his dome' for 'his vault.' The Hebrew word refers to something bound together and is used here in cosmic architecture imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 상층을 하늘들에 세우시고, 그의 둥근 천장을 땅 위에 세우시며, 바다의 물들을 부르셔서 그것들을 땅의 표면 위에 쏟으시는 이—그의 이름은 야훼입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 오름들’이나 ‘그의 계단들’. 히브리어는 높이, 계단, 위층 방을 가리킬 수 있으며, 여기서는 하늘의 높은 구조물을 가리키는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 띠’, ‘그의 구조’, ‘그의 돔’. 히브리어는 묶인 것이라는 뜻을 지니며, 여기서는 우주적 건축 이미지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנֶה
  english_pob_choice: He who builds
  chosen_korean: 세우시고
  alternatives_korean:
  - 짓는 이
  - 건축하시는 분
  - 세우시는 이
  lexicon: WLC/HALOT
  rationale: 분사형 서술을 한국어 도치 구조로 살리면서, 창조적 건축 행위를 자연스럽게 표현했습니다.
- source_word: מַעֲלוֹתָיו
  english_pob_choice: his upper chambers
  chosen_korean: 그의 상층
  alternatives_korean:
  - 그의 상층실
  - 그의 높은 방들
  - 그의 오름들
  lexicon: HALOT
  rationale: 문맥상 실제 건물보다 하늘의 높은 구조를 가리키므로, 직역의 낯섦을 줄이되 ‘상층’으로 높은 공간 이미지를 유지했습니다.
- source_word: וַאֲגֻדָּתוֹ
  english_pob_choice: his vault
  chosen_korean: 그의 둥근 천장
  alternatives_korean:
  - 그의 둥근 구조
  - 그의 장막
  - 그의 덮개
  lexicon: HALOT
  rationale: 문맥의 우주적 건축 이미지를 살리기 위해, ‘묶인 것/구조물’의 의미를 지닌 어휘를 한국어의 ‘둥근 천장’으로 옮겨 하늘과 땅을 덮는 구조감을 나타냈습니다.
- source_word: לְמֵי הַיָּם
  english_pob_choice: the waters of the sea
  chosen_korean: 바다의 물들
  alternatives_korean:
  - 바다 물
  - 바다의 물
  - 바닷물
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 그대로 반영하되, 시적 병행에서 자연스럽게 읽히도록 했습니다.
- source_word: יְהוָה שְׁמוֹ
  english_pob_choice: Yahweh is his name
  chosen_korean: 그의 이름은 야훼입니다
  alternatives_korean:
  - 야훼가 그의 이름입니다
  - 그 이름은 야훼입니다
  - 야훼는 그의 이름입니다
  lexicon: HALOT
  rationale: 마지막 자기-명명 구절의 종결성을 살리기 위해 주어 표지를 앞세웠고, 표준 번역 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 우주적 건축 이미지(상층/둥근 천장)의 보존
  chosen_reading: 현대 과학적 설명으로 평면화하지 않고, 창조주를 우주 건축가로 묘사하는 시적 이미지를 살렸습니다.
  alternative_readings:
  - ‘상층실’/‘돔’처럼 더 직역하기
  - ‘하늘 궁전’처럼 해석적으로 옮기기
  rationale: 본 절은 하나님의 창조 주권을 고대 우주론의 건축 은유로 찬양하므로, 이미지의 강도를 유지하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 여호와/야훼 처리
  chosen_reading: 히브리어 신명사 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 대체하기
  - ‘여호와’로 옮기기
  rationale: 본문이 실제 고유명으로 하나님을 지칭하므로, 표제어가 아닌 이름을 보존하는 것이 원문 가시성과 감사 찬양의 정점을 살립니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
