id: AMO.9.14
reference: Amos 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁבְתִּי֮ אֶת שְׁב֣וּת עַמִּ֣/י יִשְׂרָאֵל֒ וּ/בָנ֞וּ עָרִ֤ים נְשַׁמּוֹת֙ וְ/יָשָׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/שָׁת֖וּ אֶת יֵינָ֑/ם וְ/עָשׂ֣וּ גַנּ֔וֹת וְ/אָכְל֖וּ אֶת פְּרִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/014.yaml
  text: I will restore the fortunes of my people Israel[a], and they will rebuild ruined cities and inhabit them; they will plant vineyards and drink their wine; they will make gardens and eat their fruit.
  footnotes:
  - marker: a
    text: Or, 'I will bring back the captives of my people Israel' / 'I will restore the captivity of my people Israel.' The Hebrew restoration formula can denote both return from captivity and a broader reversal of distress.
    reason: alternative_reading
translation:
  language: ko
  text: 내 백성 이스라엘의 처지를 회복하겠습니다[a]. 그들은 무너진 도시들을 다시 세우고 거기에 살며, 포도밭을 심고 그 포도주를 마시고, 정원을 만들고 그 열매를 먹을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성 이스라엘의 포로를 돌아오게 하겠습니다’ / ‘내 백성 이스라엘의 포로 상태를 회복하겠습니다.’ 이 히브리어 회복 공식은 포로 귀환과 더 넓은 고난의 반전을 둘 다 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  english_pob_choice: I will restore the fortunes
  chosen_korean: 처지를 회복하겠습니다
  alternatives_korean:
  - 포로를 돌아오게 하겠습니다
  - 포로 상태를 회복하겠습니다
  lexicon: HALOT
  rationale: שׁוּב + שְׁבוּת는 단순한 귀환보다 전반적 상황 반전을 가리킬 수 있어, 문맥의 도시·농경 회복과 함께 넓은 의미의 ‘회복’으로 옮겼습니다.
- source_word: עַמִּי יִשְׂרָאֵל
  english_pob_choice: my people Israel
  chosen_korean: 내 백성 이스라엘
  alternatives_korean:
  - 내 백성, 이스라엘
  lexicon: HALOT
  rationale: 언약적 소유 관계를 드러내기 위해 ‘내 백성’으로 옮기고, 이스라엘은 직설적으로 유지했습니다.
- source_word: וּבָנוּ עָרִים נְשַׁמּוֹת
  english_pob_choice: they will rebuild ruined cities
  chosen_korean: 무너진 도시들을 다시 세우고
  alternatives_korean:
  - 황폐한 도시들을 다시 세우고
  - 폐허가 된 도시들을 다시 세우고
  lexicon: HALOT
  rationale: נְשַׁמּוֹת의 황폐함을 살리되, 한국어에서는 ‘무너진’이 복구의 대비를 더 자연스럽게 드러냅니다.
- source_word: וְיָשָׁבוּ
  english_pob_choice: live in them
  chosen_korean: 거기에 살며
  alternatives_korean:
  - 거기에 거주하며
  - 거기에 머물며
  lexicon: HALOT
  rationale: 도시 재건 뒤 실제 정주를 나타내므로 ‘살다’를 사용하되, 이어지는 동사들과 나란히 배치했습니다.
- source_word: וְנָטְעוּ כְרָמִים ... וְעָשׂוּ גַנּוֹת
  english_pob_choice: they will plant vineyards ... they will make gardens
  chosen_korean: 포도밭을 심고 ... 정원을 만들고
  alternatives_korean:
  - 포도원을 심고 ... 정원을 가꾸고
  - 포도밭을 만들고 ... 정원을 만들고
  lexicon: HALOT
  rationale: כְרָמִים은 관용적으로 ‘포도밭’이 가장 자연스럽고, גַנּוֹת은 ‘만들다’의 평행 구조를 살려 ‘정원을 만들다’로 옮겼습니다.
- source_word: וְשָׁתוּ אֶת יֵינָם / וְאָכְלוּ אֶת פְּרִי/הֶם
  english_pob_choice: drink their wine / eat their fruit
  chosen_korean: 그 포도주를 마시고 ... 그 열매를 먹을 것입니다
  alternatives_korean:
  - 그들의 포도주를 마시고 ... 그들의 열매를 먹을 것입니다
  - 그 포도주를 마시고 ... 그 생산물을 먹을 것입니다
  lexicon: HALOT
  rationale: 소유격은 앞선 포도밭·정원에서 난 산물을 가리키므로, 한국어에서는 ‘그’로 지시해 반복을 줄이면서도 소유 관계를 유지했습니다.
theological_decisions:
- issue: שׁוּב שְׁבוּת의 의미 범위
  chosen_reading: ‘포로 귀환’만으로 좁히지 않고, 전반적 회복을 뜻하는 ‘처지를 회복하다’로 번역했습니다.
  alternative_readings:
  - 포로를 돌아오게 하다
  - 포로 상태를 회복하다
  rationale: 이 구절은 뒤따르는 재건·재식재·결실의 이미지와 함께 읽힐 때 전체적 번영 회복을 강조하므로, 포로 귀환만으로 축소하지 않았습니다.
  doctrine_reference: Translation philosophy §3, §5
