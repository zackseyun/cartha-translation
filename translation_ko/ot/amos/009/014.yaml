  source_fidelity: 본문은 히브리어의 회복 공식 שׁוּב שְׁבוּת를 포로 귀환에 한정하지 않고 넓은 회복으로 이해하며, 도시 재건·정주·포도원과 정원의 생산물 향유라는 뒤이은 동작들을 충실히 반영합니다. 다만 ‘처지를 회복하다’는 한국어에서 다소 어색하고, 각주의 ‘포로 상태를 회복하겠습니다’는 포로 상태 자체를 다시 세운다는 뜻으로 읽힐 수 있어 대안 번역으로 적절하지 않습니다.
  naturalness: ‘형편을 회복하겠습니다’가 현대 표준어 합쇼체에서 더 자연스럽고, שְׁבוּת가 가리키는 고난의 전반적 반전을 잘 드러냅니다. 나머지 문장은 자연스럽고 문체도 일관됩니다.
