revisions:
- from: 그리고 만일 그들이 갈멜의 꼭대기에 숨는다 해도, 거기에서 내가 그들을 찾아내어 데려갈 것이며, 만일 그들이 내 눈앞에서 바다의 바닥에 숨는다 해도, 거기에서 내가 뱀에게 명령하겠고, 그것이 그들을 물 것입니다.[a][b]
  to: 그리고 만일 그들이 갈멜의 꼭대기에 숨는다 해도, 거기에서 내가 그들을 찾아내어 데려갈 것이며, 만일 그들이 내 눈앞을 피해 바다 밑바닥에 숨는다 해도, 거기에서 내가 뱀에게 명령하겠고, 그것이 그들을 물 것입니다.[a]
  rationale: ‘내 눈앞에서’를 ‘내 눈앞을 피해’로 조정하여 히브리어 전치사구의 회피 의미를 한국어에서 명확히 했습니다. 바다의 공간 표현은 본문과 각주가 실제 어휘 대안을 이루도록 조정했습니다. 한국어에서는 ‘뱀’이 נָחָשׁ를 자연스럽게 포괄하므로, 중복되고 부자연스러운 b 각주는 삭제했습니다. 그 밖의 병렬 조건문과 심판의 미래 표현은 유지했습니다.
