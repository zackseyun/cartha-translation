  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם יֵחָֽבְאוּ֙ בְּ/רֹ֣אשׁ הַ/כַּרְמֶ֔ל מִ/שָּׁ֥ם אֲחַפֵּ֖שׂ וּ/לְקַחְתִּ֑י/ם וְ/אִם יִסָּ֨תְר֜וּ מִ/נֶּ֤גֶד עֵינַ/י֙ בְּ/קַרְקַ֣ע הַ/יָּ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/נָּחָ֖שׁ וּ/נְשָׁכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/003.yaml
  text: And if they hide themselves on the summit of Carmel[a], from there I will search them out and take them; and if they conceal themselves from before my eyes on the floor of the sea, from there I will command the serpent[b], and it will bite them.
  footnotes:
  - marker: a
    text: Or 'at the bottom of the sea' for 'on the floor of the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the snake.' The Hebrew noun can denote either 'snake' or 'serpent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그들이 갈멜의 꼭대기에 숨는다 해도, 거기에서 내가 그들을 찾아내어 데려갈 것이며, 만일 그들이 내 눈앞을 피해 바다 밑바닥에 숨는다 해도, 거기에서 내가 뱀에게 명령하겠고, 그것이 그들을 물 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다의 바닥에’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵחָבְאוּ
  english_pob_choice: hide themselves
  chosen_korean: 숨는다 해도
  alternatives_korean:
  - 몸을 숨긴다 해도
  - 숨으려 해도
  lexicon: HALOT
  rationale: 반사적 의미의 ‘숨다’로 옮기되, 조건절의 대조 구조를 살려 자연스러운 합쇼체 문장으로 만들었습니다.
- source_word: בְּרֹאשׁ הַכַּרְמֶל
  english_pob_choice: on the summit of Carmel
  chosen_korean: 갈멜의 꼭대기
  alternatives_korean:
  - 갈멜의 정상
  - 갈멜 산꼭대기
  - 갈멜의 산꼭대기
  lexicon: HALOT
  rationale: רֹאשׁ의 ‘머리/윗부분’ 이미지를 한국어의 ‘꼭대기’로 살렸고, 원문처럼 지명을 직접 유지했습니다.
- source_word: בְּקַרְקַע הַיָּם
  english_pob_choice: on the floor of the sea
  chosen_korean: 바다의 바닥
  alternatives_korean:
  - 바다 밑바닥
  - 바다의 해저
  lexicon: HALOT
  rationale: קַרְקַע의 ‘땅/바닥’ 이미지를 직역에 가깝게 살려, 지하적·심연적 공간이라는 압박감을 보존했습니다.
- source_word: הַנָּחָשׁ
  english_pob_choice: the serpent
  chosen_korean: 뱀
  alternatives_korean:
  - 뱀(serpent)
  - 뱀/뱀장어
  lexicon: HALOT
  rationale: 히브리어가 ‘뱀/서펀트’ 둘 다 가능하므로, 문맥상 한국어의 기본어 ‘뱀’으로 옮기되 신화적 상징을 과잉 주입하지 않았습니다.
theological_decisions:
- issue: 하나님의 추적과 심판을 나타내는 신인적 표현
  chosen_reading: ‘내 눈앞에서’와 ‘찾아내어 데려갈 것’의 구체적 이미지를 유지했습니다.
  alternative_readings:
  - 내 시야에서
  - 찾아 잡을 것
  rationale: 원문은 숨을 곳이 없다는 심판의 확실성을 신체적·공간적 언어로 드러내므로, 이를 추상화하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 예언적 직설과 조건문의 연속
  chosen_reading: 두 조건절을 모두 ‘만일 … 해도’로 반복하여 원문의 병렬적 압박감을 유지했습니다.
  alternative_readings:
  - …한다면 … 하겠고
  - …하면 … 하겠고
  rationale: 히브리어의 반복 구조는 도피 불가능성을 누적시키는 수사이므로, 한국어에서도 같은 반복을 살렸습니다.
  doctrine_reference: Translation philosophy §1
