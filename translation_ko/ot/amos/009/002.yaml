source:
  edition: WLC
  text: אִם יַחְתְּר֣וּ בִ/שְׁא֔וֹל מִ/שָּׁ֖ם יָדִ֣/י תִקָּחֵ֑/ם וְ/אִֽם יַעֲלוּ֙ הַ/שָּׁמַ֔יִם מִ/שָּׁ֖ם אוֹרִידֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/002.yaml
  text: Though they dig into Sheol[a], from there my hand will take them; and though they climb up to the heavens, from there I will bring them down.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead' for 'Sheol.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 그들이 스올[a]로 파고 들어갈지라도, 거기서 내 손이 그들을 붙잡을 것이며, 비록 그들이 하늘로 올라갈지라도, 거기서 내가 그들을 내려오게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스올’은 ‘무덤’ 또는 ‘죽은 자들의 세계’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... וְאִם
  english_pob_choice: Though ... and though
  chosen_korean: 비록 …일지라도, 비록 …일지라도
  alternatives_korean:
  - 만일 …하고 또 만일 …한다면
  - 설령 …하더라도, 설령 …하더라도
  lexicon: WLC / POB audit trail
  rationale: 이 구문은 단순 조건이 아니라 도피 시도마저 무력하다는 양보법이므로, 한국어에서는 ‘비록 …일지라도’로 반복해 강조를 살렸습니다.
- source_word: יַחְתְּרוּ
  english_pob_choice: dig
  chosen_korean: 파고 들어갈
  alternatives_korean:
  - 뚫고 들어갈
  - 파헤칠
  lexicon: HALOT
  rationale: ‘파다’의 구체적 이미지를 살리면서도 스올로의 침투라는 맥락을 자연스럽게 드러내기 위해 ‘파고 들어가다’를 택했습니다.
- source_word: בִּשְׁאוֹל
  english_pob_choice: into Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  lexicon: HALOT
  rationale: 원어의 사후 세계 개념을 좁은 ‘무덤’으로 환원하지 않기 위해 음역 ‘스올’을 유지했습니다. 발문의 의미를 보존하면서도 주석으로 대안을 열어 둡니다.
- source_word: אוֹרִידֵם
  english_pob_choice: I will bring them down
  chosen_korean: 내가 그들을 끌어내릴 것입니다
  alternatives_korean:
  - 내가 그들을 내려보낼 것입니다
  - 내가 그들을 떨어뜨릴 것입니다
  lexicon: HALOT
  rationale: 히필형의 사역성을 반영해 단순한 ‘내려가다’가 아니라, 하나님이 직접 아래로 끌어내리시는 능동적 행위를 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 스올의 번역 처리
  chosen_reading: 스올을 음역으로 유지하고, 본문에서는 지명적·우주론적 대비를 살립니다.
  alternative_readings:
  - 무덤
  - 죽은 자들의 세계
  rationale: 이 절은 스올과 하늘의 극단적 대조로 하나님의 심판을 피할 수 없음을 말하므로, 스올을 지나치게 특정한 장례 용어로 좁히지 않는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: 원문 우선, 용어의 신학적 중립성 유지
