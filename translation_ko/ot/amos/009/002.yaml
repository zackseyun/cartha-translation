  source_fidelity: 전반적으로 히브리어의 양보적 병행 구조, 스올과 하늘의 우주론적 대조, 그리고 ‘내 손’이라는 구체적 심상을 충실히 반영합니다. 다만 אוֹרִידֵם은 히필 사역형으로 ‘그들을 내려오게 하겠다/내려가게 하겠다’라는 뜻이며, ‘끌어내리다’는 원문에 없는 물리적으로 끄는 방식을 다소 덧붙입니다.
