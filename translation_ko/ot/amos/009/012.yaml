revisions:
- from: 그들이 에돔의 남은 자와 내 이름으로 일컬음을 받는 모든 나라를 차지하게 하려 함입니다.” 야훼께서 말씀하십니다. “이 일을 행하시는 분입니다.”[a][b]
  to: 그들이 에돔의 남은 자와 내 이름으로 불리는 모든 나라를[a] 차지하게 하려는 것입니다. 이것을 행하시는 야훼의 말씀입니다.[b]
  rationale: MT의 점유 표현과 에돔 및 여러 나라에 관한 언급을 유지했습니다. 다만 야훼의 선언 공식을 한국어 문장으로 바로잡아 עֹשֶׂה זֹאת이 야훼를 수식하도록 했고, 각주 표지를 관련 어구와 절 전체의 전승 차이에 맞추어 배치했습니다.
