source:
  edition: WLC
  text: לְמַ֨עַן יִֽירְשׁ֜וּ אֶת שְׁאֵרִ֤ית אֱדוֹם֙ וְ/כָל הַ/גּוֹיִ֔ם אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עֲלֵי/הֶ֑ם נְאֻם יְהוָ֖ה עֹ֥שֶׂה זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/012.yaml
  text: so that they may possess the remnant of Edom and all the nations who are called by my name,” declares Yahweh[b][a], who does this.
  footnotes:
  - marker: a
    text: Or more literally, “over whom my name is called.” This Hebrew idiom expresses belonging to or being claimed by the LORD.
    reason: lexical_alternative
  - marker: b
    text: The Greek form of this verse cited in Acts 15:17 differs notably, reading along the lines of “so that the remnant of mankind may seek the Lord, and all the nations upon whom my name has been called.”
    reason: textual_variant
translation:
  language: ko
  text: 그들이 에돔의 남은 자와 내 이름으로 불리는 모든 나라를[a] 차지하게 하려는 것입니다. 이것을 행하시는 야훼의 말씀입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 이름이 그들 위에 불린”입니다. 이 히브리어 관용구는 그들이 야훼께 속하거나 야훼께서 그들을 자기 것으로 삼으셨음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 사도행전 15:17에서 인용된 그리스어 형태는 이 절과 상당히 다르게 읽습니다. 대략 “남은 인류가 주를 찾게 하고, 그의 이름이 불린 모든 민족도 그렇게 하려 함”이라는 뜻입니다.
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: ~하게 하려 함입니다
  alternatives_korean:
  - ~하도록
  - ~하기 위하여
  lexicon: HALOT
  rationale: 문맥상 목적을 나타내므로 한국어에서는 자연스러운 목적 표현으로 옮겼습니다.
- source_word: יִירְשׁוּ
  english_pob_choice: they may possess
  chosen_korean: 차지하게
  alternatives_korean:
  - 소유하게
  - 차지하게 하여
  lexicon: HALOT
  rationale: אָרץ/민족을 대상으로 한 ירש의 ‘소유하다/차지하다’의 힘을 살리되, 현대 문장에서는 ‘차지하다’가 가장 직접적입니다.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  english_pob_choice: who are called by my name
  chosen_korean: 내 이름으로 일컬음을 받는
  alternatives_korean:
  - 내 이름이 그들 위에 불린
  - 내 이름이 그들에게 불린
  lexicon: HALOT
  rationale: 히브리어 관용구는 소속/귀속을 뜻하므로, 직역을 지나치게 굳히지 않으면서도 ‘내 이름으로 일컬음을 받는’으로 관계적 의미를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기적 고유명사를 표준 학술 음역인 ‘야훼’로 옮겼습니다.
- source_word: עֹשֶׂה זֹּאת
  english_pob_choice: who does this
  chosen_korean: 이 일을 행하시는 분입니다
  alternatives_korean:
  - 이것을 하시는 분입니다
  - 이 일을 하시는 분입니다
  lexicon: HALOT
  rationale: 현재분사적 표현을 한국어에서 인격적·선언적으로 살리기 위해 ‘행하시는 분’으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 본문의 지배/점유 표현과 사도행전 15장의 그리스어 전승 차이
  chosen_reading: 본문은 MT를 따라 ‘에돔의 남은 자와 모든 나라를 차지하게’로 유지하고, 사도행전의 다른 전승을 본문에 흡수하지 않았습니다.
  alternative_readings:
  - ‘민족들이 주를 찾게 하려 함’ 같은 LXX/행 15 계열의 포함적 해석
  - ‘상속하게’로 더 완화한 번역
  rationale: 주어진 히브리어 본문은 점유/소유의 진술을 분명히 하므로, 이를 포함적 해석으로 바꾸지 않고 그대로 드러내는 것이 저자의 의미와 문서의 이중 전승 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
