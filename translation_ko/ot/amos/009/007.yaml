source:
  edition: WLC
  text: הֲ/ל֣וֹא כִ/בְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛/י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֶת יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/פְלִשְׁתִּיִּ֥ים מִ/כַּפְתּ֖וֹר וַ/אֲרָ֥ם מִ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/007.yaml
  text: Are you not like the Cushites to me[a], O sons of Israel? declares Yahweh. Did I not bring up Israel from the land of Egypt, and the Philistines from Caphtor[c][b], and Aram from Kir?
  footnotes:
  - marker: a
    text: Or 'like Ethiopians'; Hebrew 'Cushites,' referring to the people of Cush.
    reason: lexical_alternative
  - marker: b
    text: Caphtor is a place name traditionally associated by many with Crete, though its exact identification is debated.
    reason: cultural_note
  - marker: c
    text: Or 'the Arameans from Kir.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 내게 구스인들과 같지 않습니까, 이스라엘 자손들이여? 야훼의 말씀입니다. 내가 이스라엘을 이집트 땅에서, 블레셋 사람들을 갑돌에서, 아람을 키르에서 올라오게 하지 않았습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구스인들’은 히브리어 ‘쿠시 사람들’을 옮긴 말입니다. ‘에티오피아인들’로도 옮길 수 있으나, 구스는 현대 국가명과 정확히 일치하지 않는 고대의 지명·민족명입니다.
    reason: lexical_alternative
  - marker: b
    text: 갑돌은 전통적으로 크레타와 연관되어 왔으나, 정확한 위치에 대해서는 논쟁이 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘아람 사람들을 키르에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  english_pob_choice: Are you not / Did I not
  chosen_korean: 같지 않으냐 / 하지 않았느냐
  alternatives_korean:
  - 아니냐 / 아니었느냐
  - 정녕 … 아니냐
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문이 긍정 대답을 기대하므로, 첫 절은 현재 비교형으로, 둘째 절은 회고형 질문으로 자연스럽게 살렸습니다.
- source_word: כִבְנֵי כֻשִׁיִּים
  english_pob_choice: like the Cushites
  chosen_korean: 구스 사람들과 같지 않으냐
  alternatives_korean:
  - 구스인들과 같지 않으냐
  - 에티오피아 사람들과 같지 않으냐
  lexicon: HALOT
  rationale: כִּ는 비교이고 בְּנֵי는 민족 명칭처럼 기능하므로, ‘구스 사람들’로 직역성 있게 옮겼습니다. ‘에티오피아 사람들’은 후대 지리명으로 옮겨 원지시가 약해집니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 공식을 현대 한국어에서 자연스럽게 풀되, 하나님의 이름은 본 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: הֶעֱלֵיתִי
  english_pob_choice: bring up
  chosen_korean: 올라오게 하지 않았느냐
  alternatives_korean:
  - 데리고 올라오지 않았느냐
  - 인도하여 올라오게 하지 않았느냐
  lexicon: HALOT
  rationale: עלה의 사역형을 ‘올라오게 하다’로 살려 이집트, 블레셋, 아람에 대한 평행 구조를 모두 유지했습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם / כַּפְתּוֹר / קִיר
  english_pob_choice: from the land of Egypt / from Caphtor / from Kir
  chosen_korean: 이집트 땅에서 / 갑도르에서 / 길에서
  alternatives_korean:
  - 이집트 땅에서 / 크레타에서 / 길에서
  - 이집트에서 / 갑도르에서 / 길에서
  lexicon: HALOT
  rationale: ‘땅’은 히브리어의 명시적 표현을 보존하고, 고유지명은 본문에서 음역해 식별 가능성을 남겼습니다.
theological_decisions:
- issue: 이스라엘과 구스 사람들의 비교가 함의하는 의미
  chosen_reading: 이스라엘은 혈통이나 출애굽 전통만으로 자동적 특권을 가진 민족이 아니라는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순히 지리적 이동의 비유로만 제한하는 해석
  - 비교의 충격을 완화해 친근한 표현으로 바꾸는 해석
  rationale: 수사적 질문은 야훼 앞에서 이스라엘의 예외성을 상대화합니다. 본문의 긴장을 줄이지 않도록 직접적인 비교를 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
- issue: ‘이스라엘 자손들아’의 호격 유지
  chosen_reading: 호격과 민족 명칭의 남성 복수 형태를 그대로 살렸습니다.
  alternative_readings:
  - 이스라엘 백성들아
  - 이스라엘 사람들아
  rationale: 히브리어의 형태와 예언자적 호소를 유지하기 위해 집합명사로 완화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: gender-accurate over gender-neutral'
