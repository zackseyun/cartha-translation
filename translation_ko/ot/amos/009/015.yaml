source:
  edition: WLC
  text: וּ/נְטַעְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹ֨א יִנָּתְשׁ֜וּ ע֗וֹד מֵ/עַ֤ל אַדְמָתָ/ם֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם אָמַ֖ר יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/015.yaml
  text: I will plant them on their land[a], and they will never again be uprooted from the land that I have given them, says Yahweh your God.
  footnotes:
  - marker: a
    text: Hebrew reads “your God” (singular); some understand this as an address to Israel as a people, while “their God” is a smoothing alternative.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그들을 그들의 땅에 심겠으며, 그들은 내가 그들에게 준 그들의 땅에서 다시는 뿌리째 뽑히지 않을 것입니다. 야훼, 너의 하나님[a]께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 단수형 ‘너의 하나님’을 읽습니다. 앞부분의 복수 표현에 맞추어 ‘그들의 하나님’으로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְטַעְתִּים
  english_pob_choice: I will plant them
  chosen_korean: 내가 그들을 자기 땅에 심겠으며
  alternatives_korean:
  - 내가 그들을 땅에 심겠으며
  - 내가 그들을 굳게 심겠으며
  lexicon: HALOT
  rationale: נטע의 기본 이미지는 ‘심다/심어 두다’이므로, 회복의 농경적 비유를 살리기 위해 ‘심다’로 옮겼습니다.
- source_word: עַל אַדְמָתָם
  english_pob_choice: on their land
  chosen_korean: 자기 땅에
  alternatives_korean:
  - 그들의 땅에
  - 그들의 토지에
  lexicon: HALOT
  rationale: אַדְמָה는 문자적으로는 토지·땅·흙을 가리키지만, 언약적 회복 문맥에서는 ‘땅’이 가장 자연스럽고 신학적 함의를 잘 보존합니다.
- source_word: וְלֹא יִנָּתְשׁוּ עוֹד
  english_pob_choice: and they will never again be uprooted
  chosen_korean: 다시는 … 뽑히지 않을 것입니다
  alternatives_korean:
  - 다시는 … 뽑혀 나오지 않을 것입니다
  - 다시는 … 뽑혀지지 않을 것입니다
  lexicon: HALOT
  rationale: נתש의 수동은 ‘뽑다, 뿌리째 뽑다’의 이미지를 주므로, 앞의 ‘심다’와 대응되도록 ‘뽑히다’로 번역했습니다.
- source_word: אָמַר יְהוָה אֱלֹהֶיךָ
  english_pob_choice: says Yahweh your God
  chosen_korean: 야훼, 곧 너희 하나님이 말씀하십니다
  alternatives_korean:
  - 야훼, 곧 네 하나님이 말씀하십니다
  - 야훼, 너희 하나님이 말씀하십니다
  lexicon: HALOT
  rationale: אָמַר은 예언서 종결 공식에 맞게 현재형 ‘말씀하십니다’로 옮겼고, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 음역했습니다. אֱלֹהֶיךָ는 히브리어의 단수형이지만 문맥상 공동체를 향한 호칭으로 읽히므로 ‘너희 하나님’으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 끝맺음의 하나님의 이름과 호칭
  chosen_reading: ‘야훼, 곧 너희 하나님’으로 두 층위를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼, 너희 하나님’
  - ‘주님, 너희 하나님’
  rationale: 본문의 언약 이름 יְהוָה를 ‘야훼’로 보존하면서, 예언자적 선언의 관계적 호칭을 한국어로 분명히 하기 위해 ‘곧’으로 설명적으로 연결했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
