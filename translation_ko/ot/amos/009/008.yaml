id: AMO.9.8
reference: Amos 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֞ה עֵינֵ֣י אֲדֹנָ֣/י יְהוִ֗ה בַּ/מַּמְלָכָה֙ הַֽ/חַטָּאָ֔ה וְ/הִשְׁמַדְתִּ֣י אֹתָ֔/הּ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה אֶ֗פֶס כִּ֠י לֹ֣א הַשְׁמֵ֥יד אַשְׁמִ֛יד אֶת בֵּ֥ית יַעֲקֹ֖ב נְאֻם יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/008.yaml
  text: Look[a], the eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob," declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'Nevertheless, I will not completely destroy the house of Jacob.' The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 주 하나님의 눈은 죄 많은 나라를 향하고 있습니다. 내가 그것을 지면에서 멸망시킬 것입니다. 그러나 야곱의 집은 완전히 멸망시키지는 않겠다고 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 야곱의 집은 완전히 멸망시키지는 않겠습니다.” 히브리어는 강조를 위해 부정과 함께 동사 어간을 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 경고와 선언을 여는 주의 환기 표현으로, 현대 합쇼체에서는 '보십시오'가 가장 자연스럽고 격식을 유지합니다.
- source_word: עֵינֵי אֲדֹנָי יְהוִה
  english_pob_choice: the eyes of the Lord GOD
  chosen_korean: 주 하나님의 눈은
  alternatives_korean:
  - 주 하나님의 눈은
  - 주 야훼의 눈은
  lexicon: HALOT
  rationale: 히브리어의 '눈들' 복수형을 살려 하나님의 감시와 주목의 이미지를 유지했고, אֲדֹנָי יְהוִה는 직역적 존칭으로 풀어 '주 하나님'이라 했습니다.
- source_word: בַּמַּמְלָכָה הַחַטָּאָה
  english_pob_choice: on the sinful kingdom
  chosen_korean: 죄 많은 나라를 향하고 있습니다
  alternatives_korean:
  - 죄 많은 왕국을 향하고 있습니다
  - 죄 지은 나라를 향하고 있습니다
  lexicon: HALOT
  rationale: 문맥상 심판의 대상에 대한 하나님의 시선을 나타내므로 '향하고 있습니다'로 처리했고, מַמְלָכָה는 한국어에서 정치공동체를 가리키는 자연스러운 '나라'로 옮겼습니다.
- source_word: וְהִשְׁמַדְתִּי אֹתָהּ מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: and I will destroy it from the face of the earth
  chosen_korean: 내가 그것을 지면에서 멸망시킬 것입니다
  alternatives_korean:
  - 내가 그것을 땅 위에서 없애 버릴 것입니다
  - 내가 그것을 땅의 표면에서 멸절시킬 것입니다
  lexicon: HALOT
  rationale: '''from the face of the earth''의 관용을 한국어로 자연스럽게 살리면서도 ''멸망시키다''로 שׁמד의 강한 파괴 의미를 유지했습니다.'
- source_word: אֶפֶס כִּי לֹא הַשְׁמֵיד אַשְׁמִיד
  english_pob_choice: Yet I will not utterly destroy
  chosen_korean: 그러나 … 완전히 멸망시키지는 않겠다고
  alternatives_korean:
  - 하지만 … 전적으로 멸절시키지는 않겠다고
  - 그러나 … 끝까지 멸망시키지는 않겠다고
  lexicon: HALOT
  rationale: אֶפֶס כִּי의 강한 전환을 '그러나'로, 부정 강조 구조는 '완전히'로 옮겨 절대적 소멸의 부인을 분명히 했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה는 한국어에서 현재형 선언문으로 자연스럽게 들리도록 '말씀하십니다'로 옮겼고, 본문 전체의 하나님의 직접 발화를 마무리합니다.
theological_decisions:
- issue: יְהוָה의 표기와 예언 공식의 처리
  chosen_reading: 본문의 שני 두 형태 모두를 야훼로 반영하되, 첫 절의 아도나이와 결합된 형태는 '주 하나님'으로 음역하지 않고 의미역으로 처리했습니다.
  alternative_readings:
  - 주 LORD
  - 주 야훼
  - 여호와
  rationale: 이 단락은 심판 선언과 언약적 자기계시를 함께 담고 있으므로, 프로젝트 기본어인 '야훼'를 유지해 신적 이름을 가리고 전통적 대체어로 완화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 심판과 보존의 긴장 유지
  chosen_reading: 죄 많은 나라에 대한 멸망 선언과 야곱의 집에 대한 전면적 멸망 부정을 함께 보존했습니다.
  alternative_readings:
  - 보존의 약속을 더 약하게 읽는 번역
  - 심판만 강조하고 두 번째 절을 완화하는 번역
  rationale: 원문은 동일한 절 안에서 철저한 심판과 완전한 멸절의 부인을 병치하므로, 두 요소 중 하나를 희석하지 않고 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
