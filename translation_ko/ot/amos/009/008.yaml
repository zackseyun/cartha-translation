  rationale: 신명 표기를 프로젝트 원칙에 맞게 일관되게 하고, 하나님의 1인칭 심판 선언을 명확한 직접 화법으로 처리했습니다. ‘결코 완전히’는 부정과 부정사 절대형의 강조를 자연스럽게 반영하며, 심판과 완전한 멸절의 부정 사이의 원문 긴장을 해소하지 않고 유지합니다. ‘땅 위에서’는 מֵעַל פְּנֵי הָאֲדָמָה의 제거 이미지를 자연스러운 한국어로 보존합니다.
