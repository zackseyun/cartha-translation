  source_fidelity: 원문의 심판 선언과 그에 대한 제한(야곱의 집을 완전히 멸망시키지는 않음)은 대체로 보존되었습니다. 그러나 אֲדֹנָי יְהוִה의 יְהוִה를 첫 절에서 ‘하나님’으로 옮겨 신명 야훼를 드러내지 않았고, 직접 화법과 예언 공식의 연결도 한국어에서 불분명합니다.
  naturalness: ‘야곱의 집은 완전히 멸망시키지는 않겠다고 야훼께서 말씀하십니다’는 목적어가 주제화된 데다 ‘-겠다고 말씀하십니다’가 앞선 1인칭 선언과 어색하게 결합됩니다. 인용문을 명확히 하고 끝의 예언 공식을 독립시키면 현대 한국어 합쇼체로 자연스럽습니다.
