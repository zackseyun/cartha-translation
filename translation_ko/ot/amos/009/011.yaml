id: AMO.9.11
reference: Amos 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא אָקִ֛ים אֶת סֻכַּ֥ת דָּוִ֖יד הַ/נֹּפֶ֑לֶת וְ/גָדַרְתִּ֣י אֶת פִּרְצֵי/הֶ֗ן וַ/הֲרִֽסֹתָי/ו֙ אָקִ֔ים וּ/בְנִיתִ֖י/הָ כִּ/ימֵ֥י עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/011.yaml
  text: In that day I will raise up the fallen shelter of David[a], and I will wall up its breaches[c][b], and I will raise up its ruins and rebuild it as in the days of old.
  footnotes:
  - marker: a
    text: Or 'booth of David'; traditionally, 'tabernacle of David.' The Hebrew image is of a temporary shelter, used here metaphorically for David's fallen house or dynasty.
    reason: lexical_alternative
  - marker: b
    text: Or 'close up its breaches' or 'repair its gaps.'
    reason: lexical_alternative
  - marker: c
    text: '''As in the days of old'' refers to former days or ancient times, not necessarily to eternity in an abstract sense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날에 나는 무너진 다윗의 장막을 다시 세우고, 그 틈들을 막으며, 그 무너진 것들을 다시 세우고 옛날과 같이 그것을 다시 지을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗의 초막’; 전통적으로는 ‘다윗의 장막’으로 옮길 수 있습니다. 히브리어의 이미지는 임시 거처로서, 여기서는 비유적으로 무너진 다윗의 집안이나 왕조를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 틈을 메우며’ 혹은 ‘그 허물어진 곳을 수리하며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘옛날과 같이’는 영원이라는 추상적 개념이 아니라, 옛 시절 또는 오래전 때를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: In that day
  chosen_korean: 그 날에
  alternatives_korean:
  - 그때에
  - 그 날
  lexicon: HALOT
  rationale: 예언서의 관용적 시간표현을 자연스러운 한국어로 옮기되, 종말론적·예언적 울림을 유지합니다.
- source_word: סֻכַּת דָּוִיד
  english_pob_choice: the shelter of David
  chosen_korean: 다윗의 장막
  alternatives_korean:
  - 다윗의 초막
  - 다윗의 쉼터
  - 다윗의 집
  lexicon: HALOT
  rationale: 히브리어의 임시 거처 이미지를 살리면서도 한국어 성경 독자에게 익숙한 ‘장막’을 택해, 다윗 왕조/집안의 허물어진 상태라는 비유를 보존합니다.
- source_word: וְגָדַרְתִּי אֶת פִּרְצֵיהֶן
  english_pob_choice: and I will wall up its breaches
  chosen_korean: 그 틈들을 막으며
  alternatives_korean:
  - 그 허물어진 틈을 메우며
  - 그 균열을 막으며
  - 그 틈을 수축하며
  lexicon: HALOT
  rationale: גדר의 ‘막다/둘러막다’ 의미와 פִּרְצֵי의 ‘틈, 벌어진 곳’을 반영하되, 건축적 복원 이미지를 한국어로 간결하게 전달합니다.
- source_word: וַהֲרִסֹתָיו
  english_pob_choice: its ruins
  chosen_korean: 그 무너진 것들
  alternatives_korean:
  - 그 폐허
  - 그 허물어진 곳들
  - 그 무너진 폐허
  lexicon: HALOT
  rationale: הריסות의 ‘무너진 것들, 폐허’라는 뜻을 직역적으로 살리되, 앞의 ‘틈들’과 중복을 피하면서 복원 대상의 총체적 붕괴를 나타냅니다.
theological_decisions:
- issue: ‘다윗의 장막’의 해석 범위
  chosen_reading: 다윗 왕조가 무너진 상태를 가리키는 비유적 표현으로 유지했습니다.
  alternative_readings:
  - 성전/예배 장막에 대한 직접 지칭
  - 메시아 왕국에 대한 곧바른 번역적 해석
  rationale: 본문의 구체적 이미지와 복원 약속을 보존하기 위해, 해석을 미리 확정하지 않고 비유를 그대로 살렸습니다.
  doctrine_reference: 예언 문맥의 비유성과 다윗 언약의 회복 기대를 함께 보존합니다.
