  source_fidelity: 대체로 히브리어의 복원 이미지를 충실히 반영합니다. 그러나 וְגָדַרְתִּי는 미래 1인칭 동사인데, 번역의 ‘막으며’는 주절과 병렬되는 약속의 서술을 약화합니다. 또한 ‘그 무너진 것들’은 וַהֲרִסֹתָיו(그 폐허들/허물어진 곳들)보다 다소 부자연스럽고 지시 대상이 흐립니다.
  naturalness: ‘그 날에’와 ‘다윗의 장막’은 현대 한국어 성경 문체에 자연스럽습니다. 다만 ‘그 틈들을 막으며’는 병렬된 미래 동사의 격식 있는 흐름에 맞지 않으며, ‘그 무너진 것들’은 한국어에서 복원 대상의 명사구로 매끄럽지 않습니다. ‘그 폐허를 일으키고’가 더 자연스럽습니다.
  terminology: ‘장막’은 סֻכָּה의 임시 거처 이미지를 전달하는 안전한 전통적 용어이며, 각주에서 ‘초막’ 대안을 제시한 것도 적절합니다. 다만 각주 a의 ‘다윗의 집안’은 본문 은유를 설명하는 해석이므로 ‘다윗 왕조 또는 집안’이라고 절제해 설명하는 편이 좋습니다. ‘틈을 막고’와 ‘폐허를 일으키고’는 건축·복원 어휘를 유지합니다.
