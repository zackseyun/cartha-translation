    rationale: 이는 ‘눈’이 재앙이 되는 것으로 오해될 수 있습니다. 히브리어의 목적/결과 관계를 한국어에서 ‘재앙을 내리되’로 명료하게 표현할 필요가 있습니다.
  - severity: low
