  - severity: medium
    issue: יֵלְכוּ를 ‘포로로 끌려가더라도’로 번역함
    rationale: 포로 됨에는 강제가 함축될 수 있으나, 원문의 동사는 능동형 ‘가다’입니다. 수동적 강제성을 본문에 명시하는 것은 해석을 더합니다.
  - severity: medium
