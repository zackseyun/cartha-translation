id: AMO.9.4
reference: Amos 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם יֵלְכ֤וּ בַ/שְּׁבִי֙ לִ/פְנֵ֣י אֹֽיבֵי/הֶ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/חֶ֖רֶב וַ/הֲרָגָ֑תַ/ם וְ/שַׂמְתִּ֨י עֵינִ֧/י עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֥א לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/004.yaml
  text: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
  footnotes:
  - marker: a
    text: Or 'for disaster and not for good.' The Hebrew רָעָה here denotes calamity or harmful judgment, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그들이 원수들 앞에서 포로로 가더라도, 내가 거기서 칼에게 명령할 것이며, 칼이 그들을 죽일 것입니다. 또 내가 그들에게 내 눈을 두어 재앙을 내리되, 복을 내리지는 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 해를 끼치려고 내 눈을 두되, 유익을 주려고 두지는 않을 것입니다.’ 히브리어 רָעָה는 여기서 도덕적 악이 아니라 재난이나 해로운 심판을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם / יֵלְכוּ בַשְּׁבִי
  english_pob_choice: And if they go into captivity
  chosen_korean: 그러나 그들이 ... 포로로 끌려가더라도
  alternatives_korean:
  - 그리고 만약 그들이 포로로 가면
  - 그들이 포로가 되어 가더라도
  lexicon: HALOT
  rationale: הלך는 문자적으로 ‘가다’이지만, כאן은 포로 상태를 뜻하는 בַשְּׁבִי와 함께 심판의 상황을 나타내므로 한국어에서는 자연스럽게 ‘포로로 끌려가다’로 옮겼습니다.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  english_pob_choice: before their enemies
  chosen_korean: 원수들 앞에서
  alternatives_korean:
  - 그들의 원수들 앞에서
  - 적들 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구로서 단순한 물리적 위치보다 적대 세력의 권세 아래 놓인 상태를 가리키므로, 간결한 ‘원수들 앞에서’로 옮겼습니다.
- source_word: אֲצַוֶּה אֶת הַחֶרֶב
  english_pob_choice: I will command the sword
  chosen_korean: 내가 칼에게 명령할 것이니
  alternatives_korean:
  - 내가 칼을 명령할 것이니
  - 내가 칼을 부릴 것이니
  lexicon: HALOT
  rationale: 칼을 의인화한 표현을 살리기 위해 ‘칼에게 명령하다’로 옮겼습니다. 이는 단순한 사건 묘사로 평평하게 만들지 않고 하나님의 직접 통치를 드러냅니다.
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם לְרָעָה וְלֹא לְטוֹבָה
  english_pob_choice: and I will set my eyes on them for harm and not for good
  chosen_korean: 내 눈을 두어 재앙이 되게 하고, 복이 되게 하지는 않을 것입니다
  alternatives_korean:
  - 그들 위에 내 눈을 두어 해가 되게 하고, 유익이 되게 하지는 않을 것입니다
  - 그들 위에 내 눈을 두어 악이 되게 하고, 선이 되게 하지는 않을 것입니다
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 심판으로서의 재앙을 뜻하므로, 영어 POB의 ‘harm’에 맞추어 ‘재앙’으로 옮겼습니다. לְטוֹבָה는 반대로 ‘복’으로 옮겨 대조를 선명하게 했습니다.
theological_decisions:
- issue: 하나님의 ‘눈’을 두신다는 표현의 의미
  chosen_reading: 감찰과 심판을 뜻하는 의도적 주목으로 이해해, 직역된 비유를 유지했습니다.
  alternative_readings:
  - 단순히 지켜보신다는 뜻으로 완화
  - 징계의 시작을 뜻하는 표현으로 의역
  rationale: 히브리어 관용구를 보존해야 뒤이어 나오는 ‘재앙이 되게 하고, 복이 되게 하지는 않을 것입니다’와의 긴장이 살아납니다.
  doctrine_reference: 예언서의 심판 선언에서의 의인화와 관용어 보존
- issue: לְרָעָה의 번역
  chosen_reading: ‘재앙’으로 번역해 도덕적 악이 아니라 판결된 불행/심판을 나타내게 했습니다.
  alternative_readings:
  - 악
  - 해
  rationale: 하나님이 도덕적 악을 행하신다는 오해를 피하면서도 원문의 위협적 심판 뜻을 보존합니다.
  doctrine_reference: 예언적 심판 언어의 정확한 전달
