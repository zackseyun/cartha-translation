  source_fidelity: 첫 접속사 וְאִם은 앞 절에 이어지는 조건을 나타내므로 ‘그러나’보다 ‘그리고 만일’이 적절합니다. יֵלְכוּ는 능동형이므로 ‘끌려가더라도’보다 ‘포로로 가더라도’가 원문의 표현을 보존합니다. ‘칼에게 명령하다’와 칼의 의인화는 잘 보존되어 있습니다. 마지막 절은 하나님의 시선이 재앙을 위한 것임을 나타내므로, 이를 더 자연스럽고 명확하게 연결했습니다.
  naturalness: 기존의 ‘내 눈을 두어 재앙이 되게 하고’는 한국어에서 눈 자체가 재앙이 되는 듯하게 들릴 수 있습니다. ‘그들에게 내 눈을 두어 재앙을 내리되’는 비유를 유지하면서 문장 관계를 분명히 합니다. 합쇼체 종결도 일관되게 정리했습니다.
  terminology: ‘포로’, ‘원수’, ‘칼’, ‘재앙’, ‘복’은 문맥과 현대 표준어에 적합합니다. רָעָה는 도덕적 악이 아니라 심판적 재앙을 뜻하므로 ‘재앙’이 적절합니다. 각주에는 실제 대안 번역을 제시하도록 고쳤습니다.
  issues:
