id: AMO.9.13
reference: Amos 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/נִגַּ֤שׁ חוֹרֵשׁ֙ בַּ/קֹּצֵ֔ר וְ/דֹרֵ֥ךְ עֲנָבִ֖ים בְּ/מֹשֵׁ֣ךְ הַ/זָּ֑רַע וְ/הִטִּ֤יפוּ הֶֽ/הָרִים֙ עָסִ֔יס וְ/כָל הַ/גְּבָע֖וֹת תִּתְמוֹגַֽגְנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/013.yaml
  text: Behold[a], days are coming, declares Yahweh, when the plowman will overtake the reaper, and the one who treads grapes the one who sows the seed; the mountains will drip sweet wine[c][b], and all the hills will melt.
  footnotes:
  - marker: a
    text: Or 'the one who sows seed.' The Hebrew literally says 'the one who draws out the seed,' likely an idiom for sowing.
    reason: lexical_alternative
  - marker: b
    text: Or 'new wine.'
    reason: lexical_alternative
  - marker: c
    text: The image is of such abundance that one season's work begins before the previous one has ended.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 날들이 오고 있습니다, 야훼의 말씀이니라. 그때에 밭 가는 자가 거두는 자를 따라잡고, 포도를 밟는 자가 씨를 뿌리는 자를 따라잡으며, 산들이 달콤한 포도주[b][c]를 흘려내고, 모든 언덕들이 녹아내릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '보라'.
    reason: lexical_alternative
  - marker: b
    text: 또는 '새 포도주'.
    reason: lexical_alternative
  - marker: c
    text: 풍요가 너무 커서 한 계절의 일이 이전 계절이 끝나기 전에 시작되는 그림입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언문맥의 주의를 환기하는 호격을 현대 합쇼체로 자연스럽게 옮기되, 단순한 구어체보다 격식을 유지했습니다.
- source_word: יָמִים בָּאִים
  english_pob_choice: days are coming
  chosen_korean: 날들이 오고 있습니다
  alternatives_korean:
  - 그 날들이 오고 있습니다
  - 날들이 다가오고 있습니다
  lexicon: HALOT
  rationale: 미래의 도래를 알리는 관용구를 직역에 가깝게 살리면서도 한국어 문장 흐름에 맞게 표현했습니다.
- source_word: בְּמֹשֵׁךְ הַזָּרַע
  english_pob_choice: the one who draws out the seed
  chosen_korean: 씨를 뿌리는 자
  alternatives_korean:
  - 씨를 끌어내는 자
  - 씨를 뽑아내는 자
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 '씨를 끌어내는' 표현이지만 문맥상 파종을 가리키는 관용구로 보이므로, 한국어에서는 의미를 분명하게 '씨를 뿌리는 자'로 옮겼습니다.
- source_word: עָסִיס
  english_pob_choice: sweet wine
  chosen_korean: 달콤한 포도주
  alternatives_korean:
  - 새 포도주
  - 신 포도주
  - 달콤한 술
  lexicon: HALOT
  rationale: 풍성함의 이미지를 살리면서도 '새 포도주'보다 맛의 뉘앙스를 드러내어 원문의 시적 효과를 보존했습니다.
- source_word: תִּתְמוֹגַגְנָה
  english_pob_choice: will melt
  chosen_korean: 녹아내릴 것입니다
  alternatives_korean:
  - 녹을 것입니다
  - 무너질 것입니다
  - 흘러내릴 것입니다
  lexicon: HALOT
  rationale: 산과 언덕이 과장된 풍요로움 앞에서 '녹는' 이미지를 유지하되, 한국어에서는 자연스러운 서술로 다듬었습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 고유명사로서 '야훼'를 본문에 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 예언 공식 '야훼의 말씀'을 포함하므로, 신적 칭호로 바꾸지 않고 하나님의 이름을 직접 드러내는 것이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 'POB 기본 원칙: יהוה는 ''야훼''로 표기'
- issue: 풍요의 예언 이미지
  chosen_reading: 본문을 농경적 과잉 풍요를 묘사하는 시적 예언으로 유지했습니다.
  alternative_readings:
  - 문자적 농업 예언으로만 제한
  - 영적 복으로만 비유화
  rationale: 원문은 계절과 수확이 겹칠 정도의 압도적 풍요를 시적으로 말하므로, 번역이 그 긴장을 해소하지 않고 그대로 남겨 두어야 합니다.
  doctrine_reference: 예언 시어의 과장과 복원의 긴장 보존
