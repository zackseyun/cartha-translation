id: AMO.9.5
reference: Amos 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אדֹנָ֨/י יְהוִ֜ה הַ/צְּבָא֗וֹת הַ/נּוֹגֵ֤עַ בָּ/אָ֨רֶץ֙ וַ/תָּמ֔וֹג וְ/אָבְל֖וּ כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/עָלְתָ֤ה כַ/יְאֹר֙ כֻּלָּ֔/הּ וְ/שָׁקְעָ֖ה כִּ/יאֹ֥ר מִצְרָֽיִם־
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/005.yaml
  text: And the Lord GOD of hosts is the one who touches the earth[a], and it melts, and all who dwell in it mourn; and all of it rises like the Nile and sinks like the Nile of Egypt.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Lord YHWH of hosts.'' English ''Lord GOD'' avoids the awkward repetition ''Lord LORD'' while representing the divine name YHWH.'
    reason: lexical_alternative
translation:
  language: ko
  text: 땅을 만지시는 만군의 주 야훼께서 계시니, 땅이 녹고 그 안에 사는 모든 이가 애도합니다. 땅 전체가 나일강처럼 솟아오르고 이집트의 나일강처럼 가라앉습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה הַצְּבָאוֹת
  english_pob_choice: the Lord GOD of hosts
  chosen_korean: 만군의 하나님이신 주 야훼
  alternatives_korean:
  - 만군의 주 하나님
  - 만군의 야훼 하나님
  lexicon: HALOT
  rationale: אֲדֹנָי + יְהוָה + הַצְּבָאוֹת의 복합 칭호를 한 덩어리로 살리되, 야훼는 원문 고유명으로 유지하고 '만군의'는 군사적·우주적 주권을 함께 드러내도록 했습니다.
- source_word: הַנּוֹגֵעַ
  english_pob_choice: is the one who touches
  chosen_korean: 만지시면
  alternatives_korean:
  - 건드리시면
  - 치시면
  lexicon: HALOT
  rationale: 직역상 '만지다'가 기본 뜻이지만, 한국어에서는 하나님이 땅에 접촉하시는 주권적 행위를 자연스럽게 드러내기 위해 존대형 현재 분사적 표현으로 옮겼습니다.
- source_word: וַתָּמוֹג
  english_pob_choice: it melts
  chosen_korean: 땅이 녹고
  alternatives_korean:
  - 땅이 무너지고
  - 땅이 녹아내리고
  lexicon: HALOT
  rationale: מוּג의 핵심 이미지는 녹아 흩어지는 붕괴이므로, 예언적 심판의 생생한 그림을 살려 '녹고'로 옮겼습니다.
- source_word: וְאָבְלוּ
  english_pob_choice: mourn
  chosen_korean: 애곡합니다
  alternatives_korean:
  - 슬퍼합니다
  - 통곡합니다
  lexicon: HALOT
  rationale: אבל은 단순한 슬픔보다 장례·재난의 애도 행위를 가리키므로, 현대 한국어에서 가장 강한 대응어인 '애곡합니다'를 선택했습니다.
- source_word: וְעָלְתָה כַיְאֹר כֻּלָּהּ
  english_pob_choice: and all of it rises like the Nile
  chosen_korean: 그 땅 전체가 나일강처럼 올라갔다가
  alternatives_korean:
  - 그 땅 전체가 나일강처럼 올라가고
  - 그 모든 것이 나일강처럼 차올랐다가
  lexicon: HALOT
  rationale: 지속적·주기적 변화의 대비를 살리기 위해 '올라갔다가'를 썼고, יְאֹר는 문맥상 이집트의 나일강을 가리키므로 고유명으로 밝혔습니다.
- source_word: וְשָׁקְעָה כִּיאֹר מִצְרָיִם
  english_pob_choice: and sinks like the Nile of Egypt
  chosen_korean: 이집트의 나일강처럼 가라앉습니다
  alternatives_korean:
  - 이집트의 나일강처럼 잠깁니다
  - 이집트의 나일강처럼 내려앉습니다
  lexicon: HALOT
  rationale: שׁקע는 가라앉다·내려앉다의 뜻이므로, 앞의 '올라갔다가'와 대구를 이루는 '가라앉습니다'로 옮겨 리듬과 의미를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에는 여호와의 이름이 직접 나오므로, 프로젝트 기본값에 따라 음역형 '야훼'를 사용해 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
