  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂנְאוּ רָע֙ וְ/אֶ֣הֱבוּ ט֔וֹב וְ/הַצִּ֥יגוּ בַ/שַּׁ֖עַר מִשְׁפָּ֑ט אוּלַ֗י יֶֽחֱנַ֛ן יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁאֵרִ֥ית יוֹסֵֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/015.yaml
  text: Hate evil[a], and love good, and establish justice in the gate; perhaps Yahweh, the God of hosts[c][b], will be gracious to the remnant of Joseph.
  footnotes:
  - marker: a
    text: The gate was the public place where elders and officials heard legal cases and administered civic justice.
    reason: cultural_note
  - marker: b
    text: Or 'at the gate.' The Hebrew idiom refers to the place of public judgment in the city.
    reason: lexical_alternative
  - marker: c
    text: Joseph here refers to the people descended from Joseph, especially the northern kingdom; 'the remnant of Joseph' means those left after judgment.
    reason: cross_reference
translation:
  language: ko
  text: 악을 미워하고 선을 사랑하며, 성문에서 정의를 세우십시오. 그러면 혹시 야훼, 만군의 하나님께서 요셉의 남은 자에게 은혜를 베푸실지 모릅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 성문은 장로들과 관리들이 소송을 듣고 공적 정의를 집행하던 공개 장소였습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘성문에서.’ 히브리어 관용구는 도시의 공적 재판 장소를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 요셉은 요셉의 자손들, 특히 북왕국을 가리키며, ‘요셉의 남은 자’는 심판 뒤에 남은 이들을 뜻합니다.
    reason: cross_reference
lexical_decisions:
- source_word: שִׂנְאוּ רָע
  english_pob_choice: Hate evil
  chosen_korean: 악을 미워하고
  alternatives_korean:
  - 악을 혐오하고
  - 악을 증오하고
  lexicon: HALOT
  rationale: 원문의 강한 명령형을 살리기 위해 직접적인 도덕적 대립어인 ‘미워하다’를 택했습니다.
- source_word: וְהַצִּיגוּ בַשַּׁעַר מִשְׁפָּט
  english_pob_choice: and establish justice in the gate
  chosen_korean: 성문에서 정의를 세우십시오
  alternatives_korean:
  - 성문에 정의를 세우십시오
  - 성문에서 न्याय를 세우십시오
  lexicon: HALOT
  rationale: ‘성문’은 공적 재판과 판결의 장소를 가리키므로 관용구를 자연스럽게 풀어 옮기되, משפט의 공적·법적 의미를 ‘정의’로 반영했습니다.
- source_word: אוּלַי יֶחֱנַן
  english_pob_choice: perhaps ... will be gracious
  chosen_korean: 그러면 혹시 … 은혜를 베푸실지 모릅니다
  alternatives_korean:
  - 아마 … 은혜를 주실 것입니다
  - 혹 … 은혜를 베푸실지도 모릅니다
  lexicon: HALOT
  rationale: אוּלַי의 불확실성과 소망의 긴장을 살리기 위해 단정하지 않는 표현으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת
  english_pob_choice: Yahweh, the God of hosts
  chosen_korean: 야훼, 만군의 하나님
  alternatives_korean:
  - 여호와, 만군의 하나님
  - 야훼 하나님, 만군의 주
  lexicon: HALOT
  rationale: דוין? עק? (No) The divine name יְהוָה는 프로젝트 기본에 따라 ‘야훼’로, אֱלֹהֵי צְבָאוֹת는 고정된 신칭으로서 ‘만군의 하나님’으로 옮겼습니다.
- source_word: שְׁאֵרִית יוֹסֵף
  english_pob_choice: the remnant of Joseph
  chosen_korean: 요셉의 남은 자
  alternatives_korean:
  - 요셉의 남은 무리
  - 요셉의 남은 자들
  lexicon: HALOT
  rationale: שְׁאֵרִית의 예언서 용례를 따라 ‘남은 자’로 옮겨 심판 후에도 남는 공동체라는 함의를 보존했습니다.
theological_decisions:
- issue: 성문(공적 재판 장소)의 의미
  chosen_reading: ‘성문에서’는 도시의 공적 심판 장소를 가리키는 관용구로 유지하되, 본문에서는 자연스러운 한국어로 압축했습니다.
  alternative_readings:
  - ‘성문에서’
  - ‘성문 법정에서’
  rationale: 히브리어 관용구를 과도하게 설명문으로 풀지 않으면서도 משפט의 공적 정의라는 신학적·사회적 함의를 유지했습니다.
  doctrine_reference: 'POB 번역 원칙: 원문의 관용과 사회적 의미를 보존하면서도 현대 한국어로 이해 가능하게 번역'
- issue: אוּלַי의 불확실성
  chosen_reading: ‘혹시 … 하실지 모릅니다’로 번역하여 예언적 소망은 살리되 결과를 보장하지는 않았습니다.
  alternative_readings:
  - ‘아마 … 하실 것입니다’
  - ‘… 하실지도 모릅니다’
  rationale: 회개나 순종이 자동적으로 구원을 보장하는 것으로 읽히지 않도록, 원문의 희망과 유보를 함께 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
