id: AMO.5.9
reference: Amos 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/מַּבְלִ֥יג שֹׁ֖ד עַל עָ֑ז וְ/שֹׁ֖ד עַל מִבְצָ֥ר יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/009.yaml
  text: He who brings sudden destruction upon the strong[b][a], so that destruction comes upon the fortress.
  footnotes:
  - marker: a
    text: Or 'He who causes devastation to burst forth upon the mighty.' The Hebrew verb is rare and difficult, and some take it differently.
    reason: lexical_alternative
  - marker: b
    text: '''Fortress'' could also be rendered ''stronghold'' or ''fortified place.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 강한 자에게 갑작스러운 파멸을 가져오시며[a], 요새에까지 파멸이 이릅니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀한 히브리어 동사 הַמַּבְלִיג는 ‘갑작스럽게 파멸을 가져오다’ 또는 ‘파멸을 터뜨리다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요새’는 ‘견고한 성’ 또는 ‘강한 성채’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבְלִיג
  english_pob_choice: He who flashes / brings sudden destruction
  chosen_korean: 그가 … 갑작스러운 파멸을 가져오시며
  alternatives_korean:
  - 그가 … 번뜩이듯 파멸을 일으키며
  - 그가 … 파멸을 터뜨리며
  - 그가 … 갑자기 파괴를 가져오시며
  lexicon: HALOT
  rationale: 희귀한 히필 분사의 난해함을 반영해, 본문의 급작스러운 파괴성을 살리되 너무 해설적으로 풀지 않기 위해 ‘갑작스러운 파멸을 가져오시며’로 옮겼습니다.
- source_word: שֹׁד
  english_pob_choice: destruction
  chosen_korean: 파멸
  alternatives_korean:
  - 파괴
  - 멸망
  - 황폐
  lexicon: HALOT
  rationale: שֹׁד는 단순한 손상보다 폭력적 붕괴와 황폐를 가리키므로, 현대 한국어에서 그 강도를 잘 드러내는 ‘파멸’을 선택했습니다.
- source_word: עָז
  english_pob_choice: the strong
  chosen_korean: 강한 자
  alternatives_korean:
  - 능한 자
  - 용사
  - 힘센 자
  lexicon: HALOT
  rationale: 형용사가 실질적으로 명사처럼 쓰였으므로 집단적·인격적 대상을 드러내는 ‘강한 자’로 옮겼습니다.
- source_word: מִבְצָר
  english_pob_choice: fortress
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 견고한 성
  - 요새화된 곳
  lexicon: HALOT
  rationale: 군사적 방어 거점을 뜻하는 מִבְצָר의 기본 의미를 자연스러운 현대어인 ‘요새’로 반영했습니다.
theological_decisions:
- issue: 신적 주어의 명시 여부
  chosen_reading: 히브리어 참여구문을 한국어에서 ‘그가’로 풀어, 문맥상 야훼의 행위를 직접 말하는 구조를 살렸습니다.
  alternative_readings:
  - 야훼께서
  - 주님이
  - 그분이
  rationale: 앞뒤 문맥(암 5:8-9)이 야훼의 창조·심판권을 찬양하는 흐름이므로, 본문 자체는 해설을 덧붙이지 않되 주어를 자연스럽게 드러내는 방식이 가장 स्रोत에 가깝습니다.
  doctrine_reference: Amos 5:8-9 문맥의 야훼 찬양과 심판 선언
