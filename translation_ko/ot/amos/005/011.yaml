id: AMO.5.11
reference: Amos 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֠/כֵן יַ֣עַן בּוֹשַׁסְ/כֶ֞ם עַל דָּ֗ל וּ/מַשְׂאַת בַּר֙ תִּקְח֣וּ מִמֶּ֔/נּוּ בָּתֵּ֥י גָזִ֛ית בְּנִיתֶ֖ם וְ/לֹא תֵ֣שְׁבוּ בָ֑/ם כַּרְמֵי חֶ֣מֶד נְטַעְתֶּ֔ם וְ/לֹ֥א תִשְׁתּ֖וּ אֶת יֵינָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/011.yaml
  text: Therefore[a], because you trample on the poor and take a grain tax from him, you have built houses of cut stone, but you will not live in them; you have planted delightful vineyards[c][b], but you will not drink their wine.
  footnotes:
  - marker: a
    text: Or 'exact levies of grain from him.' The Hebrew expression refers to an imposed burden or tribute consisting of grain.
    reason: lexical_alternative
  - marker: b
    text: Or 'houses of hewn stone.'
    reason: lexical_alternative
  - marker: c
    text: Or 'choice vineyards' or 'pleasant vineyards.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a], 너희가 가난한 사람을 짓밟고 그에게서 곡식 공물을 거두어 들이기 때문입니다. 너희는 다듬은 돌로 집을 지었지만, 거기서 살지 못할 것이며; 아름다운 포도원을 심었지만[c][b], 그 포도주의 맛을 보지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 곡식의 정확한 부과를’. 히브리어 표현은 곡식으로 이루어진 강제 부담 또는 공물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다듬은 돌로 지은 집’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘좋은 포도원들’ 혹은 ‘기쁜 포도원들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן / יַעַן
  english_pob_choice: Therefore / because
  chosen_korean: 그러므로 / 때문에
  alternatives_korean:
  - 그래서 / 왜냐하면
  - 그러므로 / 때문에
  lexicon: HALOT
  rationale: לָכֵן의 결론적·판결적 흐름을 ‘그러므로’로 살리고, יַעַן의 이유 제시를 ‘때문입니다’로 자연스럽게 옮겨 예언적 심판 선언의 힘을 유지했습니다.
- source_word: בּוֹשַׁסְכֶם עַל דָּל
  english_pob_choice: you trample on the poor
  chosen_korean: 가난한 사람을 짓밟고
  alternatives_korean:
  - 가난한 사람을 밟고
  - 빈자를 압제하고
  lexicon: HALOT
  rationale: 동사의 폭력적·비유적 ‘짓밟다’를 살려 사회적 약자를 무참히 짓누르는 이미지를 보존했습니다.
- source_word: וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ
  english_pob_choice: take a grain tax from him
  chosen_korean: 그에게서 곡식 공물을 거두어 들이기
  alternatives_korean:
  - 그에게서 곡식 세금을 거두기
  - 그에게서 곡식 조공을 취하기
  lexicon: HALOT
  rationale: מַשְׂאַת בַּר의 강제 부과 부담을 드러내기 위해 ‘공물’로 옮기되, 문맥상 착취의 성격을 ‘거두어 들이다’로 살렸습니다.
- source_word: בָּתֵּי גָזִית
  english_pob_choice: houses of cut stone
  chosen_korean: 다듬은 돌로 집을
  alternatives_korean:
  - 깎은 돌로 지은 집을
  - 다듬은 돌집을
  lexicon: HALOT
  rationale: גָזִית의 석재 가공 이미지를 ‘다듬은 돌’로 직역성 있게 보존하고, 사치스러운 건축의 뉘앙스를 유지했습니다.
- source_word: וְלֹא תֵשְׁבוּ בָם
  english_pob_choice: but you will not live in them
  chosen_korean: 거기서 살지 못할 것이며
  alternatives_korean:
  - 거기서 거주하지 못할 것이며
  - 거기서 살지 못할 것이며
  lexicon: HALOT
  rationale: 주거 맥락의 יָשַׁב를 현대 한국어에서 자연스러운 ‘살다’로 옮겨, 심판으로 인한 향유의 박탈을 분명히 했습니다.
- source_word: כַּרְמֵי חֶמֶד
  english_pob_choice: delightful vineyards
  chosen_korean: 아름다운 포도원
  alternatives_korean:
  - 좋은 포도원
  - 기쁜 포도원
  - 아름답고 좋은 포도원
  lexicon: HALOT
  rationale: חֶמֶד의 바람직함과 매력성을 ‘아름다운’으로 옮겨, 값지고 탐나는 포도원이라는 인상을 자연스럽게 전달했습니다.
- source_word: וְלֹא תִשְׁתּוּ אֶת יֵינָם
  english_pob_choice: but you will not drink their wine
  chosen_korean: 그 포도주의 맛을 보지 못할 것입니다
  alternatives_korean:
  - 그들의 포도주를 마시지 못할 것입니다
  - 그 포도주를 마시지 못할 것입니다
  lexicon: HALOT
  rationale: 직접적인 ‘마시다’보다 결과적 즐거움의 박탈을 드러내는 ‘맛을 보다’가 한국어에서 더 자연스럽고, 포도원의 열매를 누리지 못한다는 역설을 살립니다.
theological_decisions:
- issue: 예언적 심판의 성격
  chosen_reading: 사회적 착취에 대한 언약적 심판 선언으로 읽었습니다.
  alternative_readings:
  - 일반적인 도덕 격언
  - 단순한 경제 비판
  rationale: 2인칭 직접 호칭과 미래형 박탈 진술을 살려, 본문을 추상적 교훈이 아니라 구체적 예언 심판으로 전달했습니다.
  doctrine_reference: Amos prophetic oracle; covenant justice
- issue: ‘아름다운 포도원’과 향유의 박탈
  chosen_reading: 소유의 축복이 아닌, 착취로 얻은 소유가 누리지 못하게 되는 역전으로 읽었습니다.
  alternative_readings:
  - 단순히 재산을 잃는다는 뜻
  - 농업 생산의 일반적 실패
  rationale: ‘심었지만… 마시지 못할 것’의 대비를 유지해, 불의로 축적한 것을 누리지 못하게 하는 하나님의 역전 심판을 드러냈습니다.
  doctrine_reference: prophetic reversal
