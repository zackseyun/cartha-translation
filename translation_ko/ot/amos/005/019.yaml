source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר יָנ֥וּס אִישׁ֙ מִ/פְּנֵ֣י הָ/אֲרִ֔י וּ/פְגָע֖/וֹ הַ/דֹּ֑ב וּ/בָ֣א הַ/בַּ֔יִת וְ/סָמַ֤ךְ יָד/וֹ֙ עַל הַ/קִּ֔יר וּ/נְשָׁכ֖/וֹ הַ/נָּחָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/019.yaml
  text: It will be as when a man flees from before the lion[a], and the bear meets him; then he enters the house and leans his hand on the wall[b], and the snake bites him.
  footnotes:
  - marker: a
    text: Or 'the bear encounters him' or 'the bear falls upon him.' The Hebrew verb can denote meeting, encountering, or striking upon, depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'serpent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 사자를 피해 도망할 때에 곰이 그를 만나고, 그가 집에 들어가서 손을 벽에 짚으면 뱀이 그를 물 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만나고’는 히브리어 פגע의 기본 의미를 살린 번역입니다. 문맥상 ‘덮치고’까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘벽에 손을 짚으면’은 몸을 기대어 쉬는 장면을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: as when
  chosen_korean: -할 때에
  alternatives_korean:
  - -과 같을 때
  - -처럼
  lexicon: HALOT
  rationale: 이 절은 앞선 비유를 이어 주는 비교 표현이므로, 한국어에서는 자연스러운 조건·비유 연결인 “-할 때에”로 옮겨 비교의 흐름을 살렸습니다.
- source_word: יָנוּס
  english_pob_choice: flees
  chosen_korean: 도망할
  alternatives_korean:
  - 달아날
  - 피할
  lexicon: HALOT
  rationale: 위험 앞에서의 급박한 도피를 나타내므로, “도망할”이 가장 간결하게 공포와 긴박함을 드러냅니다.
- source_word: וּפְגָעֹו
  english_pob_choice: the bear meets him
  chosen_korean: 곰이 그를 만나고
  alternatives_korean:
  - 곰이 그를 만나고 덮치고
  - 곰이 그와 마주치고
  lexicon: HALOT
  rationale: פגע는 문맥상 ‘만나다/마주치다/덮치다’의 폭이 있으므로, 본문이 연속되는 재난의 역설을 살리되 과도하게 폭력적으로 좁히지 않기 위해 “만나고”를 택했습니다.
- source_word: וּנְשָׁכוֹ
  english_pob_choice: and the snake bites him
  chosen_korean: 뱀이 그를 물 것입니다
  alternatives_korean:
  - 뱀이 그를 물고
  - 뱀이 그를 문다
  lexicon: HALOT
  rationale: 마지막 돌발적 위험을 한국어의 종결형으로 분명하게 살리기 위해 미래형 “물 것입니다”를 사용했습니다.
theological_decisions:
- issue: 심판의 비유적 연쇄 표현을 얼마나 직접적으로 유지할지
  chosen_reading: 사자-곰-뱀의 연속 재난을 직설적으로 유지했습니다.
  alternative_readings:
  - 상징적으로 완화해 ‘위험’을 일반화하는 번역
  - 문학적으로 풀어 더 매끄럽게 만드는 번역
  rationale: 본문은 여호와의 날을 도피 불가능한 재난의 연쇄로 묘사하므로, 완화하지 않고 이미지의 충격을 그대로 유지하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: 아모스 5:18-20의 ‘여호와의 날’ 심판 경고
