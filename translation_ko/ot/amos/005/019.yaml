    rationale: ‘벽에 손을 짚는’ 표현은 손을 벽에 의지하는 행위를 말할 뿐 ‘몸을 기대어 쉬는 장면’이라고 한정하지 않습니다. 또한 영어 감사 기록상 해당 각주는 נחש의 ‘serpent’ 대안에 관한 것이므로 ‘뱀’에 연결되어야 합니다.
