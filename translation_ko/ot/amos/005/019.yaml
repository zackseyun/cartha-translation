  rationale: 원문의 비교 도입을 ‘…것과 같을 것입니다’로 명시하고, 위험이 연달아 닥치는 비유의 서술을 자연스럽게 다듬었습니다. פגע의 의미 폭은 각주로 보존했으며, 근거 없이 장면을 해설하던 기존 b 각주는 נחש의 어휘 대안을 제시하도록 교정했습니다.
