id: AMO.5.24
reference: Amos 5:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִגַּ֥ל כַּ/מַּ֖יִם מִשְׁפָּ֑ט וּ/צְדָקָ֖ה כְּ/נַ֥חַל אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/024.yaml
  text: But let justice roll down like waters[b][a], and righteousness like an ever-flowing stream.
  footnotes:
  - marker: a
    text: Or 'like water.' The Hebrew uses the plural 'waters,' which can emphasize abundance or movement.
    reason: lexical_alternative
  - marker: b
    text: Or 'like a perennial stream.' The Hebrew expression refers to a stream that is enduring or does not dry up.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 정의는 물처럼[a] 굽이쳐 흐르게 하시고, 의는 마르지 않는 시내처럼[b] 흐르게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물들처럼’. 히브리어는 ‘물’이라는 말을 복수형으로 사용하며, 풍성함이나 움직임을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘끊임없이 흐르는 시내처럼’ 또는 ‘영속하는 시내처럼’. 히브리어 표현은 마르지 않거나 지속되는 물길을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגַּל
  english_pob_choice: let ... roll down
  chosen_korean: 흐르게 하십시오
  alternatives_korean:
  - 흘러가게 하십시오
  - 굽이쳐 흐르게 하십시오
  - 넘쳐 흐르게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 jussive/명령적 뉘앙스를 한국어 권고형으로 옮기되, 물의 움직임을 자연스럽게 살리기 위해 ‘흐르게 하십시오’를 택했습니다. ‘roll down’의 역동성을 직접화하되 과도하게 시각화하지 않습니다.
- source_word: כַּמַּיִם
  english_pob_choice: like waters
  chosen_korean: 물처럼
  alternatives_korean:
  - 물들처럼
  - 물 같이
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘waters’의 풍성함은 유지하되, 한국어에서는 ‘물처럼’이 가장 자연스럽고 시적입니다. 복수성은 문맥의 이미지로 전달합니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 공의
  - 심판
  lexicon: HALOT
  rationale: 이 예언적 문맥에서는 사회적·공적 질서를 가리키므로 ‘정의’가 가장 직접적입니다. 전통적 교회어인 ‘공의’도 가능하지만, 현대 한국어에서는 ‘정의’가 문맥을 더 분명히 드러냅니다.
- source_word: וּצְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 공의
  - 옳은 삶
  lexicon: HALOT
  rationale: 첫 번째 항목과 구별되는 언약적·도덕적 성격을 살리기 위해 ‘의’로 옮겼습니다. ‘정의’와 같은 단어로 평준화하지 않고 히브리어의 병행을 보존합니다.
- source_word: כְּנַחַל אֵיתָן
  english_pob_choice: like an ever-flowing stream
  chosen_korean: 마르지 않는 시내처럼
  alternatives_korean:
  - 끊임없이 흐르는 시내처럼
  - 영원히 흐르는 시내처럼
  - 끊어지지 않는 개울처럼
  lexicon: HALOT
  rationale: נַחַל אֵיתָן은 마르지 않는, 지속되는 물길을 뜻하므로 ‘마르지 않는 시내’가 가장 간결하면서도 의미를 잘 살립니다. ‘ever-flowing’의 지속성을 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: מִשְׁפָּט / צְדָקָה의 병행을 어떻게 살릴 것인가
  chosen_reading: ‘정의’와 ‘의’를 구분해 함께 제시하여 공적 질서와 언약적 올바름을 모두 드러냅니다.
  alternative_readings:
  - 둘 다 ‘공의’로 통일
  - 둘 다 ‘정의’로 통일
  rationale: 두 히브리어는 겹치지만 완전히 동일하지 않으므로, 한국어에서도 같은 단어로 흡수하지 않고 의미 차이를 남기는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§3, 5
