  terminology: מִשְׁפָּט은 ‘정의’, צְדָקָה는 ‘의’로 구별한 선택이 적절합니다. נַחַל אֵיתָן의 지속성을 ‘마르지 않는 시내’로 옮긴 것도 자연스럽고 원문에 충실합니다.
