  text: וְ/אַֽל תִּדְרְשׁוּ֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּל֙ לֹ֣א תָבֹ֔אוּ וּ/בְאֵ֥ר שֶׁ֖בַע לֹ֣א תַעֲבֹ֑רוּ כִּ֤י הַ/גִּלְגָּל֙ גָּלֹ֣ה יִגְלֶ֔ה וּ/בֵֽית אֵ֖ל יִהְיֶ֥ה לְ/אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/005.yaml
  text: But do not seek Bethel[a], and do not enter Gilgal, and do not cross over to Beersheba; for Gilgal will surely go into exile, and Bethel will become nothingness.
  footnotes:
  - marker: a
    text: 'Or possibly, “Bethel will become Beth-aven,” preserving a Hebrew wordplay: Bethel (“house of God”) is reduced to aven (“nothingness,” “wickedness,” or “disaster”).'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 베델을 찾지 말며, 길갈로 들어가지 말고, 브엘세바를 건너지 마십시오. 이는 길갈이 반드시 포로로 끌려가고, 베델은 아무것도 아닌 것이 될 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “베델은 벧아웬이 될 것이다”로도 옮길 수 있습니다. 이는 베델(“하나님의 집”)이 אָוֶן(“아무것도 없음”, “악”, “재앙”)으로 전락한다는 히브리어 말장난을 보존한 읽기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְרְשׁוּ
  english_pob_choice: seek
  chosen_korean: 찾지 말며
  alternatives_korean:
  - 구하지 말며
  - 찾으려 하지 말며
  - 찾아가지 말며
  lexicon: HALOT
  rationale: דרשׁ의 예배·신탁적 ‘seek’를 한국어로는 여기서 산당/성소를 향해 의지하는 행위를 자연스럽게 드러내는 ‘찾다’로 옮겼습니다.
- source_word: בֵּית אֵל
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  - 베델 성소
  - 하나님의 집
  lexicon: HALOT
  rationale: 지명으로서 음역을 유지하되, 한국어 표준 음역 관행에 따라 ‘베델’로 적었습니다.
- source_word: תַעֲבֹרוּ
  english_pob_choice: cross over to
  chosen_korean: 건너지 마십시오
  alternatives_korean:
  - 건너가지 마십시오
  - 지나가지 마십시오
  - 향하지 마십시오
  lexicon: HALOT
  rationale: עבר의 ‘건너다/가로지르다’의 구체적 힘을 살리기 위해 단순한 ‘가다’보다 ‘건너다’를 택했습니다.
- source_word: יִהְיֶה לְאָוֶן
  english_pob_choice: will become nothingness
  chosen_korean: 아무것도 아닌 것이 될 것이기 때문입니다
  alternatives_korean:
  - 헛것이 될 것이기 때문입니다
  - 무가치한 것이 될 것이기 때문입니다
  - 재앙이 될 것이기 때문입니다
  lexicon: HALOT
  rationale: אָוֶן의 의미 범위 가운데 이 절의 문맥과 베델/벧아웬 말장난 가능성을 함께 살릴 수 있는 ‘아무것도 아닌 것’으로 옮겼습니다.
theological_decisions:
- issue: 베델의 종말을 אָוֶן으로 어떻게 드러낼지
  chosen_reading: 본문에는 ‘아무것도 아닌 것이 될 것’으로 두고, 주석 없이 말장난을 과도하게 해석하지는 않았습니다.
  alternative_readings:
  - ‘벧아웬이 될 것’으로 음역형 처리
  - ‘악의/재앙이 될 것’으로 윤리적·재난적 의미를 전면화
  rationale: 히브리어는 베델(Bethel)과 אָוֶן(‘무가치함/공허/재앙’) 사이의 암시적 말장난을 포함할 가능성이 있으나, 본문은 그 긴장을 유지하면서도 한국어 독자가 즉시 이해할 수 있도록 했습니다.
  doctrine_reference: Translation philosophy §3, source tension preserved rather than over-resolved
