theological_decisions:
- issue: 베델의 종말을 אָוֶן으로 어떻게 드러낼지
  chosen_reading: 본문에는 ‘아무것도 아닌 것이 될 것’으로 두고, 주석 없이 말장난을 과도하게 해석하지는 않았습니다.
  alternative_readings:
  - ‘벧아웬이 될 것’으로 음역형 처리
  - ‘악의/재앙이 될 것’으로 윤리적·재난적 의미를 전면화
  rationale: 히브리어는 베델(Bethel)과 אָוֶן(‘무가치함/공허/재앙’) 사이의 암시적 말장난을 포함할 가능성이 있으나, 본문은 그 긴장을 유지하면서도 한국어 독자가 즉시 이해할 수 있도록 했습니다.
  doctrine_reference: Translation philosophy §3, source tension preserved rather than over-resolved
