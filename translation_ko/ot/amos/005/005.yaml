- from: 그러나 베델을 찾지 말며, 길갈로 들어가지 말고, 브엘세바를 건너지 마십시오. 이는 길갈이 반드시 포로로 끌려가고, 베델은 아무것도 아닌 것이 될 것이기 때문입니다.[a]
  to: 그러나 벧엘을 찾지 마십시오. 길갈로 들어가지 말고, 브엘세바로 건너가지 마십시오. 길갈은 반드시 포로로 끌려갈 것이며, 벧엘은 아무것도 아닌 것이 될 것이기 때문입니다.[a]
