    text: 또는 “벧엘은 벧아웬이 될 것이다.” 히브리어 말놀이를 살린 번역입니다. 벧엘은 “하나님의 집”이라는 뜻이며, 벧아웬은 “헛됨”, “악”, 또는 “재앙”을 뜻하는 אָוֶן과 관련된 이름입니다.
    reason: lexical_alternative
