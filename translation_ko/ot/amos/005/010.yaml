id: AMO.5.10
reference: Amos 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂנְא֥וּ בַ/שַּׁ֖עַר מוֹכִ֑יחַ וְ/דֹבֵ֥ר תָּמִ֖ים יְתָעֵֽבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/010.yaml
  text: They hate the one who reproves in the gate[b][a], and they abhor the one who speaks with integrity.
  footnotes:
  - marker: a
    text: '"In the gate" refers to the city gate, the customary place for legal proceedings and public judgment.'
    reason: cultural_note
  - marker: b
    text: Or "the one who speaks what is blameless" / "the one who speaks uprightly."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성문에서 책망하는 자를 미워하며, 정직하게 말하는 자를 혐오합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 도시의 공적 재판과 판결이 이루어지던 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘정직하게 말하는 자’는 ‘흠 없이 말하는 자’ 또는 ‘바르게 말하는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשַּׁעַר
  english_pob_choice: in the gate
  chosen_korean: 성문에서
  alternatives_korean:
  - 성문 안에서
  - 문에서
  lexicon: HALOT
  rationale: ‘שער’는 도시의 성문을 가리키며 공적 재판과 판단이 이루어지던 장소이므로, 한국어로는 관용을 살리되 의미를 분명히 하는 ‘성문에서’가 적절합니다.
- source_word: מוֹכִיחַ
  english_pob_choice: the one who reproves
  chosen_korean: 책망하는 자
  alternatives_korean:
  - 꾸짖는 자
  - 바르게 지적하는 자
  - 훈계하는 자
  lexicon: HALOT
  rationale: 공적 자리에서 잘못을 드러내고 바로잡는 뉘앙스를 살리기 위해, 자연스러운 현대어이면서도 법정적/예언적 성격을 담을 수 있는 ‘책망하는 자’를 택했습니다.
- source_word: תָּמִים
  english_pob_choice: with integrity
  chosen_korean: 온전하게
  alternatives_korean:
  - 흠 없이
  - 정직하게
  - 완전하게
  lexicon: HALOT
  rationale: ‘תמים’의 핵심인 온전함, 흠 없음, 도덕적 진실성을 한국어 부사형으로 옮겨 ‘말하는’과 연결되게 했습니다. POB의 ‘with integrity’와도 대응됩니다.
- source_word: יְתָעֵבוּ
  english_pob_choice: they abhor
  chosen_korean: 혐오합니다
  alternatives_korean:
  - 가증히 여깁니다
  - 몹시 싫어합니다
  - 역겨워합니다
  lexicon: HALOT
  rationale: 첫 절의 ‘미워하다’보다 더 강한 혐오감을 나타내는 동사로서, 반복을 피하면서도 강도를 살릴 수 있는 ‘혐오합니다’를 선택했습니다.
theological_decisions:
- issue: 공적 재판 장소로서의 ‘성문’의 표지 유지
  chosen_reading: ‘성문에서’로 직역해, 사회적·법적 심판의 현장을 드러냈습니다.
  alternative_readings:
  - ‘재판정에서’
  - ‘성문 곁에서’
  rationale: 본문의 비판은 단순한 장소 설명이 아니라 공적 정의가 거부되는 상황을 가리키므로, 해석적 확장보다 히브리어 관용을 보존하는 편이 더 강합니다.
  doctrine_reference: 예언서의 공의/정의 비판과 공동체 법정의 타락을 드러내는 본문 맥락
