- from: 그는 플레이아데스와 오리온을 지으시고, 깊은 어둠을 아침으로 바꾸시며, 낮을 밤으로 어둡게 하시고, 바닷물을 불러 그것을 땅의 표면 위에 쏟아 부으십니다—그의 이름은 야훼이십니다.[a][b]
  to: 플레이아데스와 오리온을 지으시고, 깊은 어둠을 아침으로 바꾸시며,[a] 낮을 밤같이 어둡게 하시고, 바다의 물을 불러 땅 위에 쏟아부으시는 분, 그의 이름은 야훼입니다.[b]
  rationale: 이름 서술의 높임법을 바로잡고, 각주 표지를 해당 어휘 뒤로 옮겼습니다. 또한 ‘낮을 밤같이 어둡게 하시며’와 ‘땅 위에’를 사용하여 원문의 시적 병렬과 의미를 유지하면서 현대 표준 한국어의 자연스러움을 높였습니다. 원문의 분사적 묘사는 ‘지으시고 … 바꾸시며 … 어둡게 하시고 … 쏟아부으시는 분’이라는 연쇄로 보존했습니다.
