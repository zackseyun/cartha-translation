base_translation:
  language: en
  yaml_path: translation/ot/amos/005/008.yaml
  text: He who made the Pleiades and Orion[a], and turns deep darkness into morning, and darkens day into night[b], who calls for the waters of the sea and pours them out over the face of the earth—Yahweh is his name.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; alternatively rendered ''Yahweh.'''
    reason: alternative_reading
  - marker: b
    text: Or 'the shadow of death' for 'deep darkness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 플레이아데스와 오리온을 지으시고, 깊은 어둠을 아침으로 바꾸시며,[a] 낮을 밤같이 어둡게 하시고, 바다의 물을 불러 땅 위에 쏟아부으시는 분, 그의 이름은 야훼입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צַלְמָוֶת은 여기서 ‘깊은 어둠’으로 옮길 수 있으며, 전통적으로는 ‘사망의 그늘’로도 번역됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 고유 신명 YHWH를 옮긴 것입니다. 본문에서는 고유명사로 ‘야훼’를 사용합니다.
    reason: divine_name
lexical_decisions:
- source_word: עֹשֵׂה
  english_pob_choice: He who made
  chosen_korean: 지으시고
  alternatives_korean:
  - 만드시고
  - 지으신 분이
  lexicon: HALOT
  rationale: 분사형이 하나님의 지속적·서술적 행위를 이끌므로, 현대 한국어에서는 관계절보다 서술적 연결인 "지으시고"가 자연스럽고 원문의 열거를 살립니다.
- source_word: כִימָה וּ/כְסִיל
  english_pob_choice: the Pleiades and Orion
  chosen_korean: 플레이아데스와 오리온
  alternatives_korean:
  - 기마와 케실
  - 플레이아데스와 케실
  lexicon: HALOT
  rationale: 천문학적 대응이 분명하므로 의미를 전달하는 음역보다 통용되는 별자리 이름을 쓰되, 원문의 두 천체 짝을 그대로 보존했습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep darkness
  chosen_korean: 깊은 어둠
  alternatives_korean:
  - 사망의 그늘
  - 흑암
  lexicon: HALOT
  rationale: 이 문맥은 죽음의 그림자보다 낮/밤의 우주적 전환을 말하므로, "깊은 어둠"이 원문의 강도를 살리면서 오해를 줄입니다.
- source_word: וַיִּשְׁפְּכֵם
  english_pob_choice: and pours them out
  chosen_korean: 쏟아 부으십니다
  alternatives_korean:
  - 부으십니다
  - 쏟으십니다
  lexicon: HALOT
  rationale: 물의 대량 방출 이미지를 살리기 위해 "쏟아 부으십니다"를 택했습니다. 한국어에서는 목적어를 포함한 자연스러운 동작감이 더 분명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 도상의 결론부에 있는 고유신명을 제목화하지 않고 음역으로 드러내기 위해 프로젝트 기본값인 "야훼"를 유지했습니다.
theological_decisions:
- issue: 하늘과 바다를 다스리는 하나님의 주권적 행위 묘사
  chosen_reading: 문장 전체를 현재형 서술로 옮겨, 창조·전복·심판을 한 분의 지속적 주권 행위로 들리게 했습니다.
  alternative_readings:
  - 과거형의 단회 사건으로 옮김
  - 더 서사적인 표현으로 완화
  rationale: 히브리어 분사 연쇄는 단순 과거 회상이 아니라 하나님이 지금도 그러하신 분임을 묘사합니다. 한국어 현재 서술이 이 신학적 상시성을 잘 전달합니다.
  doctrine_reference: 시적 본문에서의 분사적 신적 묘사
