reference: Amos 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָ/עִ֛יר הַ/יֹּצֵ֥את אֶ֖לֶף תַּשְׁאִ֣יר מֵאָ֑ה וְ/הַ/יּוֹצֵ֥את מֵאָ֛ה תַּשְׁאִ֥יר עֲשָׂרָ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/003.yaml
  text: 'For thus says the Lord GOD: The city that marches out a thousand will have a hundred left[a], and the one that marches out a hundred will have ten left, for the house of Israel.'
  footnotes:
  - marker: a
    text: Or 'that goes out a thousand ... that goes out a hundred.' The Hebrew verb is literally 'goes out,' likely referring to going out for battle; 'marches out' makes that military sense explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: “주 야훼께서 이렇게 말씀하십니다. 이스라엘 집에서는 천 명을 이끌고 출전하는 성읍이 백 명만 남기고, 백 명을 이끌고 출전하는 성읍이 열 명만 남길 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천 명이 나가는 … 백 명이 나가는’으로 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘나가다’이며, 여기서는 전투를 위해 나가는 뜻일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 히브리어의 복합 신적 호칭을 한국어에서 자연스럽게 살리면서도, 본문이 직접 יְהוִה를 사용하므로 POB의 야훼 원칙에 맞게 구별해 옮겼습니다. “주 하나님”은 합쇼체 본문에서 가장 무리 없는 공식적 표현입니다.
- source_word: הָעִיר / הַיֹּצֵאת
  english_pob_choice: The city that marches out
  chosen_korean: 천 명을 거느리고 나가는 성읍
  alternatives_korean:
  - 천 명이 나가는 성읍
  - 천 명을 내보내는 성읍
  lexicon: HALOT
  rationale: 분사형 ‘나가는’은 도시가 전쟁/군사 동원에 나서는 뜻을 살리되, 한국어에서는 ‘거느리고’로 대상 인원을 드러내어 자연스럽게 만들었습니다. 도시를 주어로 유지해 원문 구조를 보존했습니다.
- source_word: תַּשְׁאִיר / מֵאָה / עֲשָׂרָה
  english_pob_choice: will have a hundred left / will have ten left
  chosen_korean: 백 명만 남고 / 열 명만 남을 것입니다
  alternatives_korean:
  - 백 명이 남게 되고 / 열 명이 남게 되고
  - 백 명을 남기고 / 열 명을 남기고
  lexicon: HALOT
  rationale: 히필 ‘남기다/남다’의 결과 상태를 한국어에서는 ‘남다’로 자연스럽게 옮겼습니다. ‘만’은 남은 수의 극적 대비를 살리되 과장하지 않습니다.
- source_word: לְבֵית יִשְׂרָאֵל
  english_pob_choice: for the house of Israel
  chosen_korean: 이스라엘의 집을 두고
  alternatives_korean:
  - 이스라엘의 집을 위해
  - 이스라엘 집안에 대하여
  lexicon: HALOT
  rationale: לְ의 관계·대상 의미를 한국어에서는 ‘~을 두고’로 옮겨, 이 선언이 이스라엘 전체를 향한 심판 선언임을 드러냈습니다. ‘이스라엘의 집’은 언약적 집단 명칭으로 유지했습니다.
theological_decisions:
- issue: 야훼/주 하나님의 이중 신적 호칭 처리
  chosen_reading: 본문에서는 직접 발화의 격식을 살려 ‘주 하나님’으로 시작하되, 본문 전체의 하나님 이름은 POB 원칙에 따라 ‘야훼’로 반영했습니다.
  alternative_readings:
  - 주 야훼
  - 주 여호와
  rationale: 한국어 문장에서는 ‘주 야훼’가 어색할 수 있어, 예언자적 선포문의 공적·엄숙한 톤을 유지하는 ‘주 하나님’이 가장 읽히기 쉽습니다. 다만 본문 원어의 יְהוִה는 지워지지 않도록 POB의 이름 원칙을 설명에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
