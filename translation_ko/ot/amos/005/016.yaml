source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֲדֹנָ֔/י בְּ/כָל רְחֹב֣וֹת מִסְפֵּ֔ד וּ/בְ/כָל חוּצ֖וֹת יֹאמְר֣וּ הוֹ ה֑וֹ וְ/קָרְא֤וּ אִכָּר֙ אֶל אֵ֔בֶל וּ/מִסְפֵּ֖ד אֶל י֥וֹדְעֵי נֶֽהִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/016.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the Lord: In all the squares there will be wailing, and in all the streets they will say, “Alas! Alas!” They will call the farmer to mourning[b], and those who know lamentation to wailing.'
  footnotes:
  - marker: a
    text: Or “Woe! Woe!” The Hebrew cry הוֹ הוֹ is an exclamation of lament; “Alas! Alas!” was chosen to emphasize mourning rather than denunciation.
    reason: lexical_alternative
  - marker: b
    text: Literally “those who know lamentation,” likely referring to skilled or professional mourners.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로[a] 만군의 하나님 야훼, 곧 주께서 이렇게 말씀하십니다. 모든 광장에서는 곡성이 터져 나오고, 모든 거리에서는 “아아! 아아!”라고 외칠 것입니다. 농부를 애도로 부르고[b], 애가를 아는 이들을 곡성으로 부를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “화로다! 화로다!”로 옮길 수도 있습니다. 히브리어 감탄사 הוֹ הוֹ는 애곡의 외침이므로, 여기서는 정죄의 ‘화’보다 슬픔의 톤을 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “애가를 아는 자들”입니다. 문맥상 애곡을 잘하는 전문 조문객을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언을 잇는 추론적 접속을 한국어로 자연스럽게 살리되, 예언 문맥의 결론 표지를 분명히 했습니다.
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי
  english_pob_choice: Yahweh, the God of hosts, the Lord
  chosen_korean: 만군의 하나님 야훼, 곧 주
  alternatives_korean:
  - 만군의 하나님 야훼, 곧 주님
  - 만군의 하나님 야훼, 곧 주 하나님
  lexicon: HALOT
  rationale: 여호와를 대신하는 전통적 교회어인 ‘주’보다, 원문의 신명 ‘야훼’를 보존하고 뒤의 אֲדֹנָי는 설명적 동격으로 ‘곧 주’로 풀었습니다.
- source_word: בְּכָל רְחֹבוֹת / חוּצוֹת
  english_pob_choice: In all the squares / in all the streets
  chosen_korean: 모든 광장 / 모든 거리
  alternatives_korean:
  - 모든 넓은 곳 / 모든 길거리
  - 모든 시가지의 빈터 / 모든 길
  lexicon: HALOT
  rationale: רְחֹבוֹת와 חוּצוֹת의 도시 공적 공간 대비를 살리기 위해, 각각 ‘광장’과 ‘거리’로 구분해 번역했습니다.
- source_word: הוֹ הוֹ
  english_pob_choice: Alas! Alas!
  chosen_korean: 아아! 아아!
  alternatives_korean:
  - 슬프다! 슬프다!
  - 화로다! 화로다!
  lexicon: HALOT
  rationale: 이 표현은 책망의 ‘화’보다 애곡의 외침에 가깝기 때문에, 통곡의 감탄사인 ‘아아!’로 옮겼습니다.
- source_word: יֹדְעֵי נֶהִי
  english_pob_choice: those who know lamentation
  chosen_korean: 애가를 아는 이들
  alternatives_korean:
  - 애곡을 아는 사람들
  - 곡조를 아는 사람들
  lexicon: HALOT
  rationale: 직역의 구조를 유지하되 한국어에서는 자연스럽게 ‘애가를 아는 이들’로 다듬어, 전문 애곡자라는 문화적 함의를 과도하게 본문에 넣지 않았습니다.
theological_decisions:
- issue: יהוה와 אֲדֹנָי의 동시 표기
  chosen_reading: ‘야훼’는 신명으로 본문에 두고, ‘אֲדֹנָי’는 이어지는 호칭으로 ‘주’라고 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 통일
  - ‘여호와’로 통일
  rationale: 원문은 신명과 주권 호칭을 함께 사용하여 신적 권위를 누적합니다. 이를 하나로 평준화하면 원문의 긴장감이 약해지므로 구별을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
