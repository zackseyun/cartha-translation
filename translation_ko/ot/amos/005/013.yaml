id: AMO.5.13
reference: Amos 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן הַ/מַּשְׂכִּ֛יל בָּ/עֵ֥ת הַ/הִ֖יא יִדֹּ֑ם כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/013.yaml
  text: Therefore the prudent man keeps silent at that time[a], for it is an evil time.
  footnotes:
  - marker: a
    text: Or 'the wise person' or 'the discerning one'; the Hebrew is masculine singular, used here in a representative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그때에 분별 있는 사람은 잠잠해야 합니다. 왜냐하면 그때는 악한 때이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런즉
  lexicon: HALOT
  rationale: 앞 절들의 책망에 대한 결론을 분명히 드러내는 추론 접속사이므로, 한국어에서는 자연스러운 문어체 결론 표지인 ‘그러므로’가 가장 적절합니다.
- source_word: הַמַּשְׂכִּיל
  english_pob_choice: the prudent man
  chosen_korean: 분별 있는 사람
  alternatives_korean:
  - 지혜로운 사람
  - 슬기로운 사람
  - 통찰력 있는 사람
  lexicon: HALOT
  rationale: שׂכל의 히필 분사로서 단순한 지적 지식보다 상황을 분별하여 바르게 처신하는 의미가 강하므로 ‘분별 있는 사람’이 문맥상 가장 잘 맞습니다. 영어의 남성 단수 대표성은 한국어에서는 일반명사 ‘사람’으로 자연스럽게 살렸습니다.
- source_word: יִדֹּם
  english_pob_choice: keeps silent
  chosen_korean: 잠잠해야 합니다
  alternatives_korean:
  - 침묵해야 합니다
  - 말을 멈춰야 합니다
  - 고요해야 합니다
  lexicon: HALOT
  rationale: דמם은 단순한 무음 상태보다 말과 반응을 자제하는 침묵을 뜻하므로, 현재적 상태보다 권고적 뉘앙스를 살린 ‘잠잠해야 합니다’로 옮겼습니다.
- source_word: עֵת רָעָה
  english_pob_choice: an evil time
  chosen_korean: 악한 때
  alternatives_korean:
  - 나쁜 때
  - 재앙의 때
  - 악의 때
  lexicon: HALOT
  rationale: רָעָה는 단순히 불편한 ‘나쁜’이 아니라 도덕적·사회적 악성을 담고 있으므로 ‘악한 때’가 원문의 무게를 가장 잘 보존합니다.
theological_decisions:
- issue: 대표성을 띤 남성 단수 표현의 처리
  chosen_reading: ‘분별 있는 사람’으로 옮겨, 남성 단수 형태의 대표성을 자연스럽게 반영했습니다.
  alternative_readings:
  - 분별 있는 자는
  - 분별 있는 한 사람은
  rationale: 히브리어는 남성 단수 분사이지만, 문맥상 특정 성별을 지정하기보다 대표적 일반화를 가리키므로 한국어에서는 성별을 과도하게 드러내지 않는 ‘사람’이 가장 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
