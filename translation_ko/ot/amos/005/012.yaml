  source_fidelity: 히브리어는 하나님께서 그들의 많은 죄과와 큰 죄, 그리고 의인을 억압하고 뇌물을 받으며 성문에서 가난한 이들을 물리치는 행위를 아신다고 선언합니다. 초안의 문장 끝 ‘…자들 때문입니다’는 이 행위자들이 이유라는 뜻을 더하여 원문의 통사와 의미를 바꿉니다. 또한 ‘가난한 자를 굽게 하다’는 한국어에서 목적어와 결합이 부자연스럽고, משפט적 맥락의 הִטּוּ를 적절히 전달하지 못합니다.
  naturalness: ‘내가 … 아노니’ 자체는 문어적 성경 문체로 가능하지만, 현대 합쇼체 기준에서는 ‘알고 있기 때문입니다’가 더 자연스럽습니다. 병렬된 참여자 구문을 ‘너희가 … 한다는 것’으로 풀어 원문의 고발 대상을 명확하고 자연스럽게 제시했습니다.
  terminology: ‘죄과’는 פשע의 고의적·법적 위반의 뉘앙스를 보존하며, ‘의인’, ‘뇌물’, ‘성문’도 적절합니다. הִטּוּ는 ‘물리치다’로 옮겨 가난한 이들을 재판의 장에서 배제하거나 그들의 요구를 거절하는 의미를 유지했습니다. ‘공의’로 한정하는 해석은 각주 대안으로만 제시했습니다.
  issues:
