  rationale: עֲצֻמִים는 단순 수량보다 무게·강도를 강조하므로, ‘심히 크다’로 옮겨 죄의 중대성을 직접적으로 드러냈습니다.
  doctrine_reference: Translation philosophy §5 (lexical force preservation)
