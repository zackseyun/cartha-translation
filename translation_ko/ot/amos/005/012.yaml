  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י יָדַ֨עְתִּי֙ רַבִּ֣ים פִּשְׁעֵי/כֶ֔ם וַ/עֲצֻמִ֖ים חַטֹּֽאתֵי/כֶ֑ם צֹרְרֵ֤י צַדִּיק֙ לֹ֣קְחֵי כֹ֔פֶר וְ/אֶבְיוֹנִ֖ים בַּ/שַּׁ֥עַר הִטּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/012.yaml
  text: For I know how many your transgressions are, and how great your sins are—oppressors of the righteous[a], takers of a bribe[b], and those who turn aside the needy in the gate.
  footnotes:
  - marker: a
    text: '"In the gate" refers to the city gate, where legal cases and public decisions were commonly handled.'
    reason: cultural_note
  - marker: b
    text: Or "those who deprive the needy of justice at the gate."
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 너희의 죄과가 많고 너희의 죄가 심히 크다는 것을 아노니 — 의인을 억압하는 자들, 뇌물을 받는 자들, 그리고 성문에서 가난한 자를 굽게 하는 자들 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 고대 도시의 재판과 공적 판단이 이루어지던 장소를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 “성문에서 가난한 자의 공의를 빼앗는 자들”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 내가 … 아노니
  alternatives_korean:
  - 내가 … 압니다
  - 내가 … 알고 있습니다
  lexicon: HALOT
  rationale: 야훼의 확정된 인지를 현재진행보다 단정적으로 드러내면서, 예언적 선언의 문맥에 맞게 격식 있는 합쇼체로 옮겼습니다.
- source_word: פִּשְׁעֵיכֶם
  english_pob_choice: your transgressions
  chosen_korean: 너희의 죄과
  alternatives_korean:
  - 너희의 범죄
  - 너희의 반역
  lexicon: HALOT
  rationale: פֶּשַׁע는 단순한 실수보다 고의적 위반·반역의 뉘앙스가 있어, 표준적이면서도 법적·언약적 무게를 지닌 ‘죄과’로 옮겼습니다.
- source_word: צֹרְרֵי צַדִּיק
  english_pob_choice: oppressors of the righteous
  chosen_korean: 의인을 억압하는 자들
  alternatives_korean:
  - 의인을 괴롭히는 자들
  - 의인들의 대적자들
  lexicon: HALOT
  rationale: 현재분사적 명사구를 한국어에서 자연스러운 서술적 표현으로 살리되, פִּׁיתי적 폭력을 드러내는 ‘억압하다’로 옮겼습니다.
- source_word: לֹקְחֵי כֹפֶר
  english_pob_choice: takers of a bribe
  chosen_korean: 뇌물을 받는 자들
  alternatives_korean:
  - 뇌물을 취하는 자들
  - 속전(贖錢)을 받는 자들
  lexicon: HALOT
  rationale: 재판과 공적 판단의 문맥에서 כֹפֶר는 뇌물의 의미가 가장 분명하므로, 관용적이고 직접적인 ‘뇌물을 받는 자들’로 옮겼습니다.
- source_word: בַּשַּׁעַר
  english_pob_choice: in the gate
  chosen_korean: 성문에서
  alternatives_korean:
  - 문에서
  - 성문 안에서
  lexicon: HALOT
  rationale: 고대 도시의 사법·행정 공간을 가리키는 관용구이므로, 한국어 성경에서 익숙한 ‘성문’으로 옮기고 장소성을 유지했습니다.
- source_word: הִטּוּ
  english_pob_choice: turn aside
  chosen_korean: 굽게 하는 자들
  alternatives_korean:
  - 치우치게 하는 자들
  - 돌이키게 하는 자들
  lexicon: HALOT
  rationale: 법정에서 가난한 자의 길을 ‘비틀어’ 공의를 빼앗는 뉘앙스를 살리기 위해, 결과적 불의와 왜곡을 드러내는 ‘굽게 하다’를 택했습니다.
theological_decisions:
- issue: עֲצֻמִים חַטֹּאתֵיכֶם의 강도 표현
  chosen_reading: 너희의 죄가 심히 크다는 것
  alternative_readings:
