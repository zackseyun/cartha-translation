base_translation:
  language: en
  yaml_path: translation/ot/amos/005/007.yaml
  text: you who turn justice into wormwood and cast righteousness down to the earth:[a][b]
  footnotes:
  - marker: a
    text: Or 'bitterness' for 'wormwood'; the Hebrew names a bitter plant and uses it metaphorically here.
    reason: lexical_alternative
  - marker: b
    text: Or 'and throw justice to the ground,' since 'righteousness' and 'justice' overlap in the semantic range of the Hebrew term.
    reason: alternative_reading
translation:
  language: ko
  text: 정의를 쓴쑥으로 바꾸고 의를 땅에 내던지는 너희여![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓴맛’ 또는 ‘쓰라림’. 히브리어는 쓴 식물을 가리키며, 여기서는 비유적으로 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정의를 땅에 내던지는’. 히브리어 ‘의’는 이 문맥에서 ‘정의’를 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַהֹפְכִים
  english_pob_choice: you who turn
  chosen_korean: 너희는 ... 바꾸고
  alternatives_korean:
  - 너희는 ... 뒤집고
  - 정의를 뒤바꾸는 자들입니다
  lexicon: WLC; participial vocative in prophetic address
  rationale: 분사구가 경고의 직접 호소로 쓰이므로, 한국어에서도 2인칭 복수 호격을 살려 ‘너희는’으로 시작해 예언적 직설을 유지했습니다.
- source_word: לַעֲנָה
  english_pob_choice: wormwood
  chosen_korean: 쓴쑥
  alternatives_korean:
  - 쑥
  - 쓴맛
  lexicon: WLC; HALOT
  rationale: 히브리어의 구체적 식물 이미지를 살리면서도 한국어에서 낯설지 않게 하려고, 전통적 성경 어휘인 ‘쓴쑥’을 택했습니다. 다만 본문이 은유적으로 ‘쓴맛/고통’을 가리키는 점은 그대로 남습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의
  alternatives_korean:
  - 심판
  - 재판
  - 공의
  lexicon: WLC; HALOT
  rationale: 이 구절의 משפט은 사회·공동체적 질서를 가리키므로 ‘정의’가 가장 자연스럽습니다. ‘심판’은 사건 중심으로 좁아지고, ‘공의’는 다음 대응어인 צדקה와의 구별이 흐려집니다.
- source_word: וּצְדָקָה
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: WLC; HALOT
  rationale: צדקה는 여기서 משפט과 짝을 이루어 도덕적·관계적 올바름을 뜻하므로, 프로젝트 기본어인 ‘의’를 사용해 두 개념의 긴장을 보존했습니다.
- source_word: הִנִּיחוּ
  english_pob_choice: cast ... down
  chosen_korean: 던져 버리는
  alternatives_korean:
  - 땅에 내려놓는
  - 내팽개치는
  - 버려 두는
  lexicon: WLC; HALOT
  rationale: 히필형의 ‘놓다/두다’가 כאן에서는 낮추어 떨어뜨리는 결과를 나타내므로, 공간적 이미지와 경멸적 뉘앙스를 함께 살리는 ‘던져 버리다’로 옮겼습니다.
theological_decisions:
- issue: משפט / צדקה의 병렬 번역
  chosen_reading: 정의 / 의를 서로 구별해 번역합니다.
  alternative_readings:
  - 정의 / 정의
  - 공의 / 공의
  rationale: 히브리어는 유사하지만 같은 말은 아닌 두 개념을 병렬로 두므로, 한국어에서도 의미를 합쳐 버리지 않고 구별해 번역해야 예언자의 비판 강도가 살아납니다.
  doctrine_reference: 'Translation philosophy #3 and #5; contested terms principle'
