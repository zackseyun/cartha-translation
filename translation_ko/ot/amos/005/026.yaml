id: AMO.5.26
reference: Amos 5:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְשָׂאתֶ֗ם אֵ֚ת סִכּ֣וּת מַלְכְּ/כֶ֔ם וְ/אֵ֖ת כִּיּ֣וּן צַלְמֵי/כֶ֑ם כּוֹכַב֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר עֲשִׂיתֶ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/026.yaml
  text: And you carried Sikkuth your king[a], and Kiyyun your images, the star of your god[c][b], which you made for yourselves.
  footnotes:
  - marker: a
    text: Or 'your Molech'; the Hebrew reads 'your king,' but many interpreters understand a reference to the deity Molech/Moloch here, reflected also in Acts 7:43.
    reason: alternative_reading
  - marker: b
    text: Sikkuth and Kiyyun are rare names, likely associated with astral worship; their precise identification is uncertain.
    reason: cultural_note
  - marker: c
    text: Or possibly 'the star of your gods,' though the Masoretic pointing supports the singular 'your god.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 너희가 스스로 만든 시쿳, 너희 왕[a]과 기윤[b], 너희 형상들, 너희 신의 별[c]을 메고 다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 몰렉’일 수 있습니다. 히브리어는 ‘너희 왕’으로 읽히지만, 많은 해석자들은 여기서 몰렉/몰록 신을 가리킨다고 봅니다. 사도행전 7:43도 이 이해를 반영합니다.
    reason: alternative_reading
  - marker: b
    text: 시쿳과 기윤은 드문 이름으로, 아마도 천체 숭배와 관련된 것으로 보이지만 정확한 식별은 확실하지 않습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘너희 신들의 별’일 수도 있습니다. 다만 마소라의 모음 표기는 단수인 ‘너희 신’ 쪽을 지지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשָׂאתֶם
  english_pob_choice: And you carried
  chosen_korean: 지니고 다녔습니다
  alternatives_korean:
  - 들고 다녔습니다
  - 메고 다녔습니다
  - 지고 다녔습니다
  lexicon: HALOT
  rationale: נשא의 ‘carry/bear’ 의미를 자연스럽게 살리면서, 우상 숭배 대상을 몸에 지니거나 운반했다는 뉘앙스를 현대 한국어로 전달합니다.
- source_word: סִכּוּת
  english_pob_choice: Sikkuth
  chosen_korean: 시쿳
  alternatives_korean:
  - 스ikkuth
  - 사쿳
  lexicon: HALOT
  rationale: 희귀한 고유명사이므로 뜻풀이보다 음역이 원문을 가장 충실하게 보존합니다.
- source_word: מַלְכְּכֶם
  english_pob_choice: your king
  chosen_korean: 너희 왕
  alternatives_korean:
  - 너희 몰렉
  - 너희 통치자
  lexicon: HALOT
  rationale: 마소라 본문의 직접 표기는 ‘너희 왕’이므로 본문에는 이를 유지하고, Molech 해석은 본문에 흡수하지 않았습니다.
- source_word: צַלְמֵיכֶם
  english_pob_choice: your images
  chosen_korean: 너희 우상들
  alternatives_korean:
  - 너희 형상들
  - 너희 조각상들
  lexicon: HALOT
  rationale: צֶלֶם은 기본적으로 ‘형상/상’이지만, 문맥상 우상 숭배를 가리키므로 한국어에서는 오해를 줄이기 위해 ‘우상들’로 옮겼습니다.
- source_word: כּוֹכַב אֱלֹהֵיכֶם
  english_pob_choice: the star of your god
  chosen_korean: 너희 신의 별
  alternatives_korean:
  - 너희 하나님들의 별
  - 너희 신의 별빛
  lexicon: HALOT
  rationale: 히브리어의 소유격 구성을 간결하게 보존하며, singular ‘god’에 맞춰 ‘너희 신’으로 옮겼습니다.
- source_word: אֲשֶׁר עֲשִׂיתֶם לָכֶם
  english_pob_choice: which you made for yourselves
  chosen_korean: 너희가 너희를 위해 만든 것입니다
  alternatives_korean:
  - 너희 자신을 위해 만든 것입니다
  - 너희를 위해 만들어 낸 것입니다
  lexicon: HALOT
  rationale: לָכֶם의 반사적 힘을 살려, 우상들을 스스로 제작한 행위와 그 자기중심성을 분명히 드러냅니다.
theological_decisions:
- issue: ‘시쿳’과 ‘너희 왕’의 관계를 본문에서 어떻게 처리할 것인가
  chosen_reading: 고유명사 시쿳과 일반 명사 ‘너희 왕’을 병렬로 두었습니다.
  alternative_readings:
  - ‘너희 왕 시쿳’으로 합쳐 읽기
  - ‘너희 몰렉’으로 해석하기
  rationale: 본문의 소리와 형태를 최대한 보존하면서도, 해석 전통이 요구하는 Molech 동일시는 본문 밖에서 검토할 수 있도록 열어 둡니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve theological tension rather than resolve it.'
