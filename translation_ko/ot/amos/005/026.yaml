- from: 그런데 너희는 너희 왕 시쿳과 너희 우상들, 너희 신의 별을 지니고 다녔습니다. 그것은 너희가 너희를 위해 만든 것입니다.[a][b][c]
  to: 너희는 너희가 스스로 만든 시쿳, 너희 왕[a]과 기윤[b], 너희 형상들, 너희 신의 별[c]을 메고 다녔습니다.
  rationale: 기윤의 누락을 복원하고, ‘우상들’을 원문에 더 가까운 ‘형상들’로 고쳤습니다. 히브리어의 난해한 병렬 및 동격 관계(시쿳/너희 왕, 기윤/너희 형상들/너희 신의 별)는 특정한 동일시를 강요하지 않도록 쉼표 나열로 유지했습니다. ‘너희가 스스로 만든’을 열거 전체 앞에 두어 원문의 관계절 의미를 살리고, 불명확한 단수 대명사를 제거했습니다.
