base_translation:
  language: en
  yaml_path: translation/ot/amos/005/023.yaml
  text: Take away from me the noise of your songs[a], and I will not listen to the melody of your harps.
  footnotes:
  - marker: a
    text: Or 'lyres' for 'harps'; the Hebrew names an ancient stringed instrument, and the exact modern equivalent is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 앞에서 네 노래들의 소음을 치우십시오. 나는 네 수금의 선율을 듣지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수금’은 히브리어 נבל의 전통적인 번역입니다. 이 고대 현악기가 오늘날 어떤 악기에 정확히 해당하는지는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  english_pob_choice: Take away
  chosen_korean: 치워 버리라
  alternatives_korean:
  - 내게서 제거하라
  - 내게서 치우라
  lexicon: HALOT
  rationale: 명령형의 거절감을 살리면서, 예언적 책망의 직접성을 유지하기 위해 ‘치워 버리라’로 옮겼습니다.
- source_word: הֲמוֹן
  english_pob_choice: the noise
  chosen_korean: 소음
  alternatives_korean:
  - 소란
  - 요란한 소리
  - 잡음
  lexicon: HALOT
  rationale: 문맥상 하나님이 받지 않으시는 예배 음악의 부정적 울림을 가리키므로, 중립적 ‘소리’보다 부정적 뉘앙스가 분명한 ‘소음’을 선택했습니다.
- source_word: נְבָלֶיךָ
  english_pob_choice: your harps
  chosen_korean: 네 수금
  alternatives_korean:
  - 네 비파
  - 네 류트
  - 네 현악기
  lexicon: HALOT
  rationale: נבל은 고대 현악기이지만 정확한 현대 대응물이 불확실하므로, 한국어에서 전통적으로 쓰이는 ‘수금’으로 옮기되 현대 독해를 위해 ‘하프’로 단정하지는 않았습니다.
theological_decisions:
- issue: 예배 거절의 강도
  chosen_reading: 하나님이 형식적 예배를 단호히 거절하시는 예언자적 어조를 그대로 살렸습니다.
  alternative_readings:
  - ‘소리’처럼 덜 부정적인 표현으로 완화하는 읽기
  - ‘듣지 않겠다’를 완곡하게 처리하는 읽기
  rationale: 아모스 5장의 문맥은 정의 없는 예배에 대한 책망이므로, 거절의 강도를 약화시키지 않는 번역이 본문의 의도를 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
