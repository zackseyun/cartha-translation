  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 מֵעָלַי는 단순한 출처라기보다 화자에게서 물러나게 하라는 거절의 방향을 나타내므로 ‘내게서’보다 ‘내 앞에서’가 한국어에서 더 자연스럽고 분명합니다. שִׁרֶיךָ는 복수이므로 ‘노래들’로 반영하는 것이 안전합니다. וְזִמְרַת נְבָלֶיךָ는 ‘수금의 선율’로 옮길 수 있으나, 대조를 더하지 않는 목적격 ‘선율을’이 원문에 가깝습니다.
