  text: הַ/זְּבָחִ֨ים וּ/מִנְחָ֜ה הִֽגַּשְׁתֶּם לִ֧/י בַ/מִּדְבָּ֛ר אַרְבָּעִ֥ים שָׁנָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/025.yaml
  text: Did you bring me sacrifices and offerings in the wilderness for forty years[a], O house of Israel?
  footnotes:
  - marker: a
    text: Or 'sacrifices and grain offerings.' The Hebrew word for 'offerings' can refer more specifically to a grain offering in cultic contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 집아, 너희가 광야에서 사십 년 동안 내게 제사와 소제를 드렸느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소제’로 옮긴 히브리어 מִנְחָה는 제의 문맥에서 ‘곡식제물’을 가리킬 수 있으며, 문맥에 따라 더 일반적으로 ‘예물’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּבָחִים
  english_pob_choice: sacrifices
  chosen_korean: 제사들
  alternatives_korean:
  - 희생제물들
  - 희생제사들
  lexicon: HALOT
  rationale: זֶבַח의 제의적 의미를 살리면서 한국어 성경 문맥에서 자연스러운 일반 용어인 ‘제사들’로 옮겼습니다.
- source_word: וּמִנְחָה
  english_pob_choice: and offerings
  chosen_korean: 소제들
  alternatives_korean:
  - 곡식제물들
  - 예물들
  lexicon: HALOT
  rationale: 여기서는 제의 문맥에서 מִנְחָה가 더 구체적인 곡식 제사를 가리킬 수 있으므로, 그 긴장을 보존하려고 ‘소제들’을 택했습니다.
- source_word: הִגַּשְׁתֶּם לִי
  english_pob_choice: Did you bring me
  chosen_korean: 내게 ... 드렸느냐
  alternatives_korean:
  - 내게 ... 가져왔느냐
  - 내게 ... 바쳤느냐
  lexicon: HALOT
  rationale: 히필형의 ‘가져와 바치다/드리다’라는 동작을 한국어 예배 표현인 ‘드리다’로 자연스럽게 반영했습니다.
- source_word: בַמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: 출애굽-방황의 배경을 살리는 표준 성경 용례인 ‘광야’를 사용했습니다.
theological_decisions:
- issue: 아모스 5:25의 수사적 질문 처리
  chosen_reading: 질문형을 유지하되, 화자가 기대하는 부정적 대답을 본문 밖에서 명시하지 않았습니다.
  alternative_readings:
  - ‘너희는 실제로 내게 드리지 않았다’로 풀이해 옮김
  - 단순 정보 질문처럼 평이하게 옮김
  rationale: 히브리어 수사 의문문의 날카로운 책망을 보존하면서도, 본문이 직접 말하지 않는 해설을 덧붙이지 않기 위해서입니다.
  doctrine_reference: '번역 원칙: 본문이 암시하는 긴장과 책망의 힘을 해소하지 말고 그대로 드러낸다.'
