base_translation:
  language: en
  yaml_path: translation/ot/amos/005/001.yaml
  text: 'Hear this word that I am taking up over you as a lament[a], O house of Israel:'
  footnotes:
  - marker: a
    text: Or 'that I utter concerning you a dirge'; the Hebrew literally says 'that I am taking up over you a lament.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 집안아, 내가 너희에게 얹는 이 말씀을 들으십시오. 그것은 한 애가입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에 관하여 애가를 부르는 말씀’; 히브리어는 문자적으로 ‘너희 위에 애가를 얹는’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어라
  - 들으세요
  lexicon: HALOT
  rationale: 복수 명령의 선지자적 호소를 표준적인 합쇼체 명령으로 옮겨, 공적 경고의 힘을 살렸습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this word
  chosen_korean: 이 말씀
  alternatives_korean:
  - 이 말
  - 이 메시지
  lexicon: HALOT
  rationale: דָּבָר의 예언 문맥상 ‘말’보다 격식 있는 ‘말씀’이 적절하여, 선언되는 신탁의 무게를 살렸습니다.
- source_word: אֲשֶׁר אָנֹכִי נֹשֵׂא עֲלֵיכֶם
  english_pob_choice: that I am taking up over you
  chosen_korean: 내가 너희에게 얹는
  alternatives_korean:
  - 내가 너희 위에 드는
  - 내가 너희에 대하여 드는
  lexicon: HALOT
  rationale: נשא의 ‘들다/떠받다’ 이미지를 살리되 한국어에서는 ‘얹다’가 ‘위에 올려 말하다’는 함의를 가장 자연스럽게 전달합니다.
- source_word: קִינָה
  english_pob_choice: as a lament
  chosen_korean: 한 애가
  alternatives_korean:
  - 한 애가의 노래
  - 한 애가로
  lexicon: HALOT
  rationale: קִינָה는 단순한 슬픔이 아니라 죽음을 애도하는 예식적 탄식을 가리키므로, 성경적 격식을 유지하는 ‘애가’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 집안에 대한 직접 호칭의 문체
  chosen_reading: “이스라엘 집안아”로 직접 호칭을 살려 예언적 책망의 긴장감을 유지했습니다.
  alternative_readings:
  - 이스라엘 집안이여
  - 이스라엘 집안 여러분
  rationale: 원문은 ‘בית ישראל’ 앞에 명시적 호격 표지가 없지만, 전체 문맥상 직접 부름으로 읽히며, 한국어에서는 호격을 드러내는 편이 수사적 효과를 보존합니다.
  doctrine_reference: 예언서의 심판 선포와 공동체 직접 책망의 수사
