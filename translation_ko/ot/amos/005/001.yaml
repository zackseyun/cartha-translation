  source_fidelity: 원문의 ‘듣다’ 명령, ‘이 말’, 화자가 이스라엘을 대상으로 애가를 읊는다는 구조, 그리고 ‘이스라엘의 집’이라는 직접 호칭을 보존해야 합니다. 초안의 ‘너희에게 얹는’은 עֲלֵיכֶם의 ‘너희를 두고/너희 위에’와 נֹשֵׂא קִינָה의 애가 관용구를 한국어로 자연스럽게 전달하지 못하며, ‘그것은 한 애가입니다’는 애가가 화자의 발화 행위라는 관계를 약화시킵니다.
  naturalness: ‘너희에게 얹는 말씀’은 현대 표준 한국어에서 부자연스럽습니다. ‘너희를 두고 애가로 부르는 이 말’은 예언적 엄숙함을 유지하면서도 자연스럽습니다. ‘이스라엘 집아’는 원문의 집 은유와 호격을 간결하게 살립니다.
  terminology: קִינָה는 ‘애가’로 유지할 수 있습니다. 다만 이는 ‘말씀’ 자체의 분류를 단정하는 별도 문장이 아니라, 그 말을 애가로 읊는다는 수식 구조 안에 놓는 것이 적절합니다. ‘집안’보다 공동체를 가리키는 성경적 표현인 ‘집’이 בֵּית יִשְׂרָאֵל에 더 가깝습니다.
