id: AMO.5.22
reference: Amos 5:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אִם תַּעֲלוּ לִ֥/י עֹל֛וֹת וּ/מִנְחֹתֵי/כֶ֖ם לֹ֣א אֶרְצֶ֑ה וְ/שֶׁ֥לֶם מְרִיאֵי/כֶ֖ם לֹ֥א אַבִּֽיט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/022.yaml
  text: For even if you offer up to me burnt offerings and your grain offerings[a], I will not accept them; and I will not look upon the peace offerings of your fattened animals.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' for 'peace offerings.' The Hebrew term denotes a specific sacrificial category associated with well-being and communion.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희가 내게 번제와 너희의 곡식 제물을 드린다 해도, 나는 그것들을 받지 않겠습니다. 또한 너희의 살진 짐승의 화목제물도 보지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제물’은 관계와 평안을 뜻하는 제의 범주로, 영어 POB의 ‘peace offerings’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲלוּ לִי
  english_pob_choice: you offer up to me
  chosen_korean: 내게 드린다 해도
  alternatives_korean:
  - 내게 올린다 해도
  - 내게 제물로 바친다 해도
  lexicon: HALOT
  rationale: 희생 제의 문맥의 ‘offer up’ 의미를 한국어의 자연스러운 제의 동사 ‘드리다’로 옮기되, ‘해도’로 양보 의미를 살려 앞의 전제와 연결했습니다.
- source_word: עֹלוֹת
  english_pob_choice: burnt offerings
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 완전 번제
  lexicon: HALOT
  rationale: 이스라엘 제의 체계의 특정 희생 범주를 유지하기 위해 통상적 성경 용어인 ‘번제’를 사용했습니다.
- source_word: וּמִנְחֹתֵיכֶם
  english_pob_choice: and your grain offerings
  chosen_korean: 너희의 곡식 제물
  alternatives_korean:
  - 너희의 소제
  - 너희의 곡식 예물
  lexicon: HALOT
  rationale: מִנְחָה는 제의적 문맥에서 곡식 제물을 가리키므로 의미를 분명히 드러내는 ‘곡식 제물’을 택했습니다.
- source_word: וְשֶׁלֶם מְרִיאֵיכֶם
  english_pob_choice: and the peace offerings of your fattened animals
  chosen_korean: 너희의 살진 짐승의 화목제물
  alternatives_korean:
  - 너희의 살진 짐승의 평화 제물
  - 너희의 살진 짐승의 친교 제물
  lexicon: HALOT
  rationale: שֶׁלֶם/שְׁלָמִים의 제의 범주를 보존하면서도 한국어 성경에서 널리 통하는 ‘화목제물’로 옮겼고, מְרִיאִים은 ‘살진 짐승’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 예언자가 제사 자체를 폐기하는지, 부정한 제사를 거절하는지
  chosen_reading: 번제, 곡식 제물, 화목제물 같은 구체적 제의 범주를 그대로 유지하여, 제사 일반이 아니라 불순한 예배를 거절하는 예언적 책망으로 읽었습니다.
  alternative_readings:
  - 제물들
  - 예물들
  rationale: 원문과 영어 POB 모두 특정 제의 범주를 유지하므로, 이를 일반화하면 예언의 날카로운 비판 대상이 흐려집니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
