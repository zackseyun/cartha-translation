  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֥וֹי הַ/מִּתְאַוִּ֖ים אֶת י֣וֹם יְהוָ֑ה לָ/מָּה זֶּ֥ה לָ/כֶ֛ם י֥וֹם יְהוָ֖ה הוּא חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
  footnotes:
  - marker: a
    text: Or, 'Why do you want the day of the LORD?' The Hebrew expression is idiomatic and rhetorical.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 날을 갈망하는 자들에게 화가 있습니다! 어찌하여 여러분은 야훼의 날을 원하십니까?[a] 그날은 어둠이지 빛이 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왜 여러분은 야훼의 날을 원하십니까?’ 히브리어 표현은 관용적이고 수사적인 질문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ה֥וֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬프다
  - 아아
  lexicon: HALOT
  rationale: 예언자적 경고와 심판 선언의 무게를 살리면서도, 현대 한국어에서 자연스럽고 공적 문체에 맞게 전달합니다.
- source_word: הַמִּתְאַוִּים
  english_pob_choice: those who long for
  chosen_korean: 갈망하는 자들
  alternatives_korean:
  - 원하는 자들
  - 갈구하는 자들
  lexicon: HALOT
  rationale: 지속적이고 강한 열망을 나타내는 분사형을 반영해, 단순한 희망보다 더 강한 ‘갈망’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명사는 ‘야훼’로 유지해 언약적 고유성을 드러냈습니다.
- source_word: לָמָּה זֶּה לָכֶם
  english_pob_choice: Why would you have
  chosen_korean: 어찌하여 여러분이 …을 원하십니까
  alternatives_korean:
  - 왜 여러분은 …을 원하십니까
  - 무슨 까닭으로 여러분은 …을 바라십니까
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어의 공손한 반문으로 살리되, 단순 정보 질문이 아니라 책망의 뉘앙스를 유지했습니다.
- source_word: הוּא חֹשֶׁךְ וְלֹא אוֹר
  english_pob_choice: It is darkness, and not light
  chosen_korean: 그것은 어둠이지 빛이 아닙니다
  alternatives_korean:
  - 그것은 어둠이며 빛이 아닙니다
  - 그날은 어둠이고 빛이 아닙니다
  lexicon: HALOT
  rationale: 대조 구조를 직역에 가깝게 보존해 예언적 심판의 선명한 대비를 유지했습니다.
theological_decisions:
- issue: 야훼의 날에 대한 수사적 역설
  chosen_reading: 갈망하는 대상이 오히려 심판의 날이므로, 번역도 단순한 정보 전달이 아니라 책망의 역설을 드러내도록 했습니다.
  alternative_readings:
  - 단순히 '야훼의 날을 기다리는 자들'로 완화하는 읽기
  - 중립적인 경고문으로 옮기는 읽기
  rationale: 본문은 ‘야훼의 날’을 선한 구원일로 오해하는 청중을 향한 반어적 경고이므로, 한국어에서도 그 반전을 유지해야 합니다.
  doctrine_reference: Amos 5:18의 예언적 심판 신학
- issue: 수신자 호칭의 공손성
  chosen_reading: 직접 대면하는 책망이지만 현대 한국어 합쇼체를 사용해 예언자적 공적 발화를 자연스럽게 재현했습니다.
  alternative_readings:
  - 반말형 경고
  - 개역식 고어체
  rationale: 원문의 책망 강도를 유지하면서도 공적 낭독과 출판에 적합한 현대 문체를 택했습니다.
  doctrine_reference: Korean style and register policy
