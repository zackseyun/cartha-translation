base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
  footnotes:
  - marker: a
    text: Or, 'Why do you want the day of the LORD?' The Hebrew expression is idiomatic and rhetorical.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 날을 갈망하는 자들에게 화가 있습니다! 어찌하여 여러분이 야훼의 날을 원하십니까? 그것은 어둠이지 빛이 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왜 여러분은 야훼의 날을 원하십니까?’ 히브리어 표현은 관용적이고 수사적인 질문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ה֥וֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬프다
  - 아아
  lexicon: HALOT
  rationale: 예언자적 경고와 심판 선언의 무게를 살리면서도, 현대 한국어에서 자연스럽고 공적 문체에 맞게 전달합니다.
- source_word: הַמִּתְאַוִּים
