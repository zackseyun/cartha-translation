review_pass:
  verdict: revise
  source_fidelity: יַהוֶה is appropriately rendered ‘야훼,’ and ‘이스라엘 족속’ naturally conveys the corporate idiom ‘house of Israel.’ The draft’s rendering of וִחְיוּ as a result clause is possible, but the Hebrew imperative coordination can be retained more closely in Korean. The revised wording also makes the prophetic quotation explicit.
  naturalness: ‘말씀하시는 바입니다’ is a stiff, indirect calque in modern Korean. ‘이렇게 말씀하십니다’ followed by a direct quotation is natural formal-polite Korean. ‘나를 찾고 사십시오’ preserves the compact urgency of the paired imperatives.
  terminology: ‘야훼’ correctly retains the divine name rather than replacing it with a title. ‘이스라엘 족속’ is the established natural Korean expression for the corporate ‘house of Israel,’ without implying a physical building or a modern household.
  issues:
  - severity: medium
    issue: The introductory prophetic formula is rendered as the awkward indirect expression ‘말씀하시는 바입니다.’
    rationale: כֹה אָמַר is a fixed messenger formula. In modern formal Korean, ‘이렇게 말씀하십니다’ is both more idiomatic and more clearly introduces the direct divine speech.
  - severity: low
    issue: The main text’s ‘그러면 살 것입니다’ selects the result nuance where the Hebrew also permits imperative coordination.
    rationale: The result reading is valid, but ‘나를 찾고 사십시오’ more closely preserves the terse imperative force and leaves the result nuance available in a footnote.
  - severity: low
    issue: ‘이스라엘 집’ is overly literal and unnatural in contemporary Korean.
    rationale: In this corporate idiom, ‘이스라엘 족속’ communicates the referent naturally while retaining the collective sense of בית ישראל.
  revised_text: 야훼께서 이스라엘 족속에게 이렇게 말씀하십니다. “나를 찾고 사십시오.”[a]
