  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה לְ/בֵ֣ית יִשְׂרָאֵ֑ל דִּרְשׁ֖וּ/נִי וִֽ/חְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/004.yaml
  text: 'For thus says Yahweh to the house of Israel: Seek me and live[a].'
  footnotes:
  - marker: a
    text: Or, 'Seek me so that you may live,' or 'Seek me, and you will live.' The Hebrew can be understood as an urgent command with a promised result.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘 족속에게 이렇게 말씀하십니다. “나를 찾고 사십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 찾으십시오. 그러면 살 것입니다” 또는 “나를 찾으면 살 것입니다.” 히브리어는 긴급한 명령과 그에 따르는 결과를 함께 나타내는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약적 고유명을 가리키는 יְהוָה는 한국어에서도 관용적 대체호칭인 ‘주’보다 음역인 ‘야훼’로 옮겨, 본문의 신명성을 보존했습니다.
- source_word: לְבֵית יִשְׂרָאֵל
  english_pob_choice: to the house of Israel
  chosen_korean: 이스라엘 집에
  alternatives_korean:
  - 이스라엘에게
  - 이스라엘 백성에게
  lexicon: HALOT
  rationale: בית ישראל의 집단적·언약적 표현을 살려 ‘이스라엘 집’으로 옮기고, לְ의 방향성을 ‘에’로 반영했습니다.
- source_word: דִּרְשׁוּנִי
  english_pob_choice: Seek me
  chosen_korean: 나를 찾으십시오
  alternatives_korean:
  - 나를 구하십시오
  - 나를 찾으시오
  lexicon: HALOT
  rationale: דרש의 예언적 용례는 단순한 정보 탐색보다 하나님께 돌아가 그분을 찾는 호소이므로, 현대 한국어에서 자연스럽고 절실한 ‘찾으십시오’를 택했습니다.
- source_word: וִחְיוּ
  english_pob_choice: and live
  chosen_korean: 그러면 살 것입니다
  alternatives_korean:
  - 그리고 사십시오
  - 그러면 살아갈 것입니다
  - 살 것입니다
  lexicon: HALOT
  rationale: 히브리어는 명령과 결과를 함께 담을 수 있어, 한국어에서는 직역형 접속사 ‘그리고’보다 결과를 드러내는 ‘그러면’이 문맥상 더 분명하지만, 생명의 범위를 한정하지 않도록 단순한 미래 진술로 마무리했습니다.
theological_decisions:
- issue: 야훼의 말씀 형식과 직접 인용의 어조
  chosen_reading: 예언적 선포를 한국어로 자연스럽게 살리되, ‘나를 찾으십시오’처럼 직접 명령의 긴급성을 유지했습니다.
  alternative_readings:
  - 나를 찾으라
  - 나를 찾으시오
  rationale: 본절은 선지자적 공문체가 아니라 하나님의 직접적 경고이므로, 합쇼체 명령으로 옮겨 청중에게 즉각적인 응답을 요구하는 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: ‘살 것입니다’의 생명 범위
  chosen_reading: 육체적 생존과 영적 생명을 본문이 여기서 하나로 규정하지 않으므로, 범위를 좁히지 않는 표현을 유지했습니다.
  alternative_readings:
  - 구원을 얻을 것입니다
  - 살아남을 것입니다
  rationale: 히브리어 וִחְיוּ는 결과로서의 생명을 약속하지만 그 생명의 유형을 이 절에서 명시하지 않으므로, 한국어도 그 긴장을 그대로 두는 것이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
