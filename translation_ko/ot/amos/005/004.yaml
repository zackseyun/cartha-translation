  to: 야훼께서 이스라엘 족속에게 이렇게 말씀하십니다. “나를 찾고 사십시오.”[a]
  rationale: 직접 인용 형식으로 예언자적 선포를 자연스럽게 만들고, ‘이스라엘 집’이라는 직역투를 한국어 관용적 집단 표현인 ‘이스라엘 족속’으로 조정했습니다. 또한 본문은 명령의 병렬을 유지하고, 결과적 이해는 각주에 보존하여 히브리어의 가능한 뉘앙스를 좁히지 않았습니다.
