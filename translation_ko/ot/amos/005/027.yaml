lexical_decisions:
- source_word: וְ/הִגְלֵיתִ֥י
  english_pob_choice: I will send you into exile
  chosen_korean: 내가 너희를 … 포로로 끌고 가겠습니다
  alternatives_korean:
  - 내가 너희를 유배시키겠습니다
  - 내가 너희를 사로잡아 가겠습니다
  lexicon: HALOT
  rationale: 히필형 גלה의 사역적 의미를 살려 단순한 이동이 아니라 ‘포로 상태로 보내다’는 결과를 드러내기 위해 ‘포로로 끌고 가겠습니다’로 옮겼습니다.
- source_word: מֵ/הָ֣לְאָה לְ/דַמָּשֶׂק
  english_pob_choice: beyond Damascus
  chosen_korean: 다마스쿠스 너머로
  alternatives_korean:
  - 다마스쿠스 바깥으로
  - 다마스쿠스 저편으로
  lexicon: HALOT
  rationale: מֵהָלְאָה가 다마스쿠스를 경계로 한 ‘저편/너머’의 이동을 나타내므로, 간결하고 자연스러운 ‘너머로’가 가장 가깝습니다.
- source_word: יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת
  english_pob_choice: Yahweh, whose name is the God of hosts
  chosen_korean: 야훼, 만군의 하나님이시며
  alternatives_korean:
  - 야훼, 천군만군의 하나님이시며
  - 여호와, 만군의 하나님이시며
  lexicon: HALOT
  rationale: יהוה는 본문 원형을 따라 ‘야훼’로, אֱלֹהֵי צְבָאוֹת는 ‘만군의 하나님’으로 옮겨 יְהוָה와 별도의 칭호임을 유지했습니다.
- source_word: שְׁמֽ/וֹ־
  english_pob_choice: whose name is
  chosen_korean: 그의 이름입니다
  alternatives_korean:
  - 이름이십니다
  - 그 이름입니다
  lexicon: HALOT
  rationale: 히브리어의 명사구를 살려 문장 끝에서 주어를 덧붙이는 대신, 한국어에서는 서술적으로 ‘그의 이름입니다’라고 처리해 원문의 선언적 성격을 보존했습니다.
theological_decisions:
- issue: The divine name יְהוָה in a prophetic judgment oracle
  chosen_reading: 본문의 직접 표지로 ‘야훼’와 그 호칭을 유지하고, 번역문에서 주님의 대체어로 숨기지 않았습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 신탁의 결말에서 하나님의 직접 발화를 표시하므로, 고유명사 יְהוָה를 가리지 않고 드러내는 것이 원문의 예언적 긴장을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
