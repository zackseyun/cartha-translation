- from: 그러므로 내가 너희를 다마스쿠스 너머로 포로로 끌고 가겠습니다. — 야훼, 만군의 하나님이시며 그의 이름입니다.[a]
  to: 그러므로 내가 너희를 다마스쿠스 너머로 유배시키겠습니다.” 그 이름이 만군의 하나님 야훼이신 분께서 말씀하십니다.[a]
  rationale: The exile verb is rendered directly with ‘유배시키겠습니다.’ The concluding formula is recast as ‘그 이름이 만군의 하나님 야훼이신 분께서 말씀하십니다,’ which is natural formal Korean while retaining Yahweh, God of hosts, and the explicit Hebrew statement concerning the speaker’s name. The alternative footnote now supplies the more concrete ‘포로로 끌고 가다’ wording as an allowable lexical rendering.
  reviewer_model: gpt-5.6-terra
