  to: 야훼를 찾으십시오. 그러면 살 것입니다[a]. 그렇지 않으면 그분께서 불처럼 요셉의 집을 휩쓸어 버리실 것이며, 그 불이 그것을 삼켜 버릴 것입니다. 베델을 위하여 그 불을 끌 사람은 없을 것입니다[b].
  rationale: 본문은 생략된 주어를 야훼로 이해하는 영어 POB의 선택을 반영하여 ‘그분께서’로 옮겼습니다. 동시에 불이 삼키는 후속 동작을 분명히 하여 히브리어의 불 이미지와 동사 연쇄를 살렸습니다. 주어를 불로 보는 가능한 대안은 각주 a에 보존했습니다. ‘베델을 위하여’라는 난해한 전치사구는 본문과 각주에서 유지했으며, 해석적으로 ‘베델에서’로 바꾸지 않았습니다.
