id: AMO.5.6
reference: Amos 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּרְשׁ֥וּ אֶת יְהוָ֖ה וִֽ/חְי֑וּ פֶּן יִצְלַ֤ח כָּ/אֵשׁ֙ בֵּ֣ית יוֹסֵ֔ף וְ/אָכְלָ֥ה וְ/אֵין מְכַבֶּ֖ה לְ/בֵֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/006.yaml
  text: Seek Yahweh and live[a], lest he break out like fire in the house of Joseph, and it consume[b], with no one to quench it for Bethel.
  footnotes:
  - marker: a
    text: Or 'lest it break out like fire'; the Hebrew verb's subject is implicit, though the LORD is the most likely referent from the preceding clause.
    reason: alternative_reading
  - marker: b
    text: Bethel was a major sanctuary in the northern kingdom; the Hebrew can be rendered very literally 'and there is no one to quench for Bethel.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼를 찾으십시오, 그러면 살 것입니다[a]. 그렇지 않으면 불이 요셉의 집에 번져 타 버릴 것이며, 베델을 위하여 그것을 끌 사람이 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그렇지 않으면 불이 번져 날 것입니다’; 히브리어 동사의 주어는 생략되어 있으며, 앞 절의 야훼가 가장 유력한 지시 대상입니다.
    reason: alternative_reading
  - marker: b
    text: 베델은 북이스라엘의 중요한 성소였습니다. 히브리어는 아주 문자적으로 ‘베델을 위하여’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: דִּרְשׁוּ
  english_pob_choice: Seek
  chosen_korean: 찾으십시오
  alternatives_korean:
  - 구하십시오
  - 찾아야 합니다
  lexicon: HALOT
  rationale: דרשׁ의 예언·언약 문맥에서는 단순한 정보 문의보다 하나님을 ‘찾다’는 뜻이 자연스러워서, 한국어에서는 간결한 명령형 ‘찾으십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 전통 대체어가 아니라 고유명으로 드러내는 것이 원문에 충실하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וִחְיוּ
  english_pob_choice: and live
  chosen_korean: 그러면 살 것입니다
  alternatives_korean:
  - 그리고 살십시오
  - 그래서 살 것입니다
  lexicon: HALOT
  rationale: 히브리어의 짧은 연결은 결과를 말하므로, 한국어에서는 자연스러운 결과 표현 ‘그러면 살 것입니다’로 처리했습니다.
- source_word: וְאֵין מְכַבֶּה
  english_pob_choice: with no one to quench it
  chosen_korean: 그것을 끌 사람이 없습니다
  alternatives_korean:
  - 그것을 끌 자가 없습니다
  - 그것을 끌 사람이 없을 것입니다
  lexicon: HALOT
  rationale: 불을 끄다의 한국어 관용을 살리되, 존재 부정을 분명히 하려고 ‘사람이 없습니다’로 옮겼습니다.
theological_decisions:
- issue: 불의 주체를 어떻게 드러낼지
  chosen_reading: ‘그렇지 않으면 불이… 번져 타 버릴 것입니다’로 옮겨, 원문의 불-심판 이미지를 살리되 주체를 과도하게 명시하지 않았습니다.
  alternative_readings:
  - ‘그렇지 않으면 그가 불같이 터져 나올 것입니다’
  - ‘불이… 터져 나올 것입니다’
  rationale: 히브리어는 ‘불’ 이미지와 함께 문맥상 야훼의 심판 행위를 암시하지만, 본문 자체의 비유적 긴장을 그대로 보존하는 편이 좋습니다.
  doctrine_reference: Amos 5:6 심판 경고 문맥
