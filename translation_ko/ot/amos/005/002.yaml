id: AMO.5.2
reference: Amos 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָֽפְלָה֙ לֹֽא תוֹסִ֣יף ק֔וּם בְּתוּלַ֖ת יִשְׂרָאֵ֑ל נִטְּשָׁ֥ה עַל אַדְמָתָ֖/הּ אֵ֥ין מְקִימָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/002.yaml
  text: Fallen[a], virgin Israel will not rise again; abandoned on her own land[b], she has no one to raise her up.
  footnotes:
  - marker: a
    text: Or 'will rise no more.' The Hebrew idiom literally says 'she will not again rise.'
    reason: lexical_alternative
  - marker: b
    text: '''Virgin Israel'' is a poetic personification of the nation, not a statement about literal sexual status.'
    reason: cultural_note
translation:
  language: ko
  text: 쓰러진 처녀 이스라엘[a]은 다시는 일어나지 않습니다.[b] 자기 땅에 버려져 있으며, 그녀를 일으켜 줄 이가 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘처녀 이스라엘’은 문자적인 성적 상태를 말하는 것이 아니라, 이스라엘 민족을 여성으로 의인화한 예언적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘더는 일어나지 않습니다.’ 히브리어 표현은 ‘다시 일어나다’를 부정하여, 다시 일어나지 않음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָֽפְלָה
  english_pob_choice: Fallen
  chosen_korean: 쓰러진
  alternatives_korean:
  - 넘어진
  - 무너진
  - 쓰러진 채
  lexicon: HALOT
  rationale: ראשית lament의 절박한 상태를 살리기 위해 결과 상태를 나타내는 표현으로 옮겼습니다. ‘쓰러진’은 시적 단문성을 유지하면서도 자연스럽습니다.
- source_word: לֹא תוֹסִ֣יף ק֔וּם
  english_pob_choice: will not rise again
  chosen_korean: 다시 일어나지 못합니다
  alternatives_korean:
  - 다시는 일어나지 못합니다
  - 다시 일어나지 않을 것입니다
  - 일어나지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 최종성을 살리되, 한국어에서는 ‘다시’와 ‘일어나지 못합니다’로 절망적 금지를 자연스럽게 표현했습니다.
- source_word: בְּתוּלַ֖ת יִשְׂרָאֵ֑ל
  english_pob_choice: virgin Israel
  chosen_korean: 처녀 이스라엘
  alternatives_korean:
  - 처녀 이스라엘 나라
  - 이스라엘의 처녀
  - 처녀 같은 이스라엘
  lexicon: HALOT
  rationale: 민족을 의인화한 예언적 호칭을 그대로 보존하기 위해 ‘처녀’로 옮겼습니다. 이는 문자적 성적 상태가 아니라 상징적 표현입니다.
- source_word: נִטְּשָׁ֥ה
  english_pob_choice: abandoned
  chosen_korean: 버려져
  alternatives_korean:
  - 버림받아
  - 내팽개쳐져
  - 외면당해
  lexicon: HALOT
  rationale: 피동적 유기 상태를 간결하게 드러내는 표현으로, 뒤의 무력함과 함께 애가의 정서를 살립니다.
- source_word: עַל אַדְמָתָ֖/הּ
  english_pob_choice: on her own land
  chosen_korean: 자기 땅에
  alternatives_korean:
  - 자기 땅 위에
  - 자기 토지에
  - 그 땅에
  lexicon: HALOT
  rationale: אַדְמָה의 ‘땅/터’ 의미를 살리되, 소유 대명사의 힘을 한국어의 자연스러운 ‘자기 땅’으로 옮겼습니다.
- source_word: אֵ֥ין מְקִימָֽ/הּ
  english_pob_choice: she has no one to raise her up
  chosen_korean: 그녀를 일으켜 줄 이가 없습니다
  alternatives_korean:
  - 그녀를 일으킬 이가 없습니다
  - 일으켜 줄 사람이 없습니다
  - 그녀를 일으켜 세울 이가 없습니다
  lexicon: HALOT
  rationale: ‘일으키다’는 앞의 ‘일어나다’와 같은 어근 연계를 한국어에서도 드러내며, 주체적 회복이 전혀 없다는 점을 분명히 합니다.
theological_decisions:
- issue: 이스라엘을 ‘처녀’로 부르는 의인화 표현
  chosen_reading: ‘처녀 이스라엘’을 그대로 유지했습니다.
  alternative_readings:
  - ‘이스라엘’만 번역
  - ‘젊은 이스라엘’로 완화
  rationale: 예언적 애가의 상징을 약화시키지 않기 위해 직역에 가까운 표현을 택했습니다. 이는 이스라엘의 한때의 명예와 지금의 몰락을 함께 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: לֹא תוֹסִיף קוּם의 단정적 심판
  chosen_reading: ‘다시 일어나지 못합니다’로 최종성을 살렸습니다.
  alternative_readings:
  - ‘다시는 일어나지 않습니다’
  - ‘더는 일어나지 못합니다’
  rationale: 본문의 예언적 단절을 완화하지 않기 위해, 회복 가능성을 남기지 않는 표현을 사용했습니다.
  doctrine_reference: Translation philosophy §§1, 6
