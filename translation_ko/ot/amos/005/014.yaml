source:
  edition: WLC
  text: דִּרְשׁוּ ט֥וֹב וְ/אַל רָ֖ע לְמַ֣עַן תִּֽחְי֑וּ וִ/יהִי כֵ֞ן יְהוָ֧ה אֱלֹהֵֽי צְבָא֛וֹת אִתְּ/כֶ֖ם כַּ/אֲשֶׁ֥ר אֲמַרְתֶּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/014.yaml
  text: Seek good and not evil[a], so that you may live; and so Yahweh, the God of hosts, will be with you, as you have said.
  footnotes:
  - marker: a
    text: Or 'as you say.' The Hebrew perfect may refer to what they have previously claimed about the LORD's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 선을 구하고 악을 구하지 마십시오[a]. 그리하면 여러분이 살게 되고, 야훼 곧 만군의 하나님께서 여러분과 함께 계실 것입니다. 여러분이 말한 것처럼.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 말하는 것처럼’. 히브리어 완료형은 주님께서 함께하신다고 그들이 이전에 주장해 온 말을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דִּרְשׁוּ
  english_pob_choice: Seek
  chosen_korean: 구하십시오
  alternatives_korean:
  - 찾으십시오
  - 추구하십시오
  lexicon: HALOT
  rationale: דרשׁ의 핵심은 어떤 것을 적극적으로 찾고 따르는 행위이므로, 예언적 권면에 자연스러운 명령형 ‘구하십시오’로 옮겼습니다.
- source_word: טוֹב וְאַל רָע
  english_pob_choice: good and not evil
  chosen_korean: 선을 구하고 악을 구하지 마십시오
  alternatives_korean:
  - 좋은 것을 구하고 악을 구하지 마십시오
  - 선과 악을 구분하여 선을 따르십시오
  lexicon: HALOT
  rationale: 히브리어의 간결한 대조를 한국어에서 자연스럽게 풀어, ‘선/악’의 도덕적 대립을 분명히 살렸습니다.
- source_word: לְמַעַן תִּחְיוּ
  english_pob_choice: so that you may live
  chosen_korean: 그리하면 여러분이 살게 되고
  alternatives_korean:
  - 그리하여 여러분이 살 것입니다
  - 그래야 여러분이 살 수 있습니다
  lexicon: HALOT
  rationale: למען의 목적·결과 뉘앙스를 살려, 생명이 추상적 약속이 아니라 그 요구에 대한 결과로 제시되도록 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת
  english_pob_choice: Yahweh, the God of hosts
  chosen_korean: 야훼 곧 만군의 하나님
  alternatives_korean:
  - 야훼, 천군의 하나님
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로, אֱלֹהֵי צְבָאוֹת은 관용적으로 ‘만군의 하나님’으로 옮겨 신적 칭호의 엄중함을 유지했습니다.
- source_word: כַּאֲשֶׁר אֲמַרְתֶּם
  english_pob_choice: as you have said
  chosen_korean: 여러분이 말한 것처럼
  alternatives_korean:
  - 여러분이 말한 대로
  - 여러분이 그렇게 말한 것처럼
  lexicon: HALOT
  rationale: 완료형의 회고적 뉘앙스를 반영해, 현재의 주장보다 과거에 한 말이나 주장에 대한 언급으로 읽히도록 했습니다.
theological_decisions:
- issue: 하나님의 임재 약속의 성격
  chosen_reading: ‘그리하면 … 야훼 곧 만군의 하나님께서 여러분과 함께 계실 것입니다’로, 선을 구하는 행위에 대한 결과적 약속으로 읽었습니다.
  alternative_readings:
  - ‘… 여러분과 함께 계십니다’처럼 현재적 사실로 읽기
  - 조건을 약화시켜 일반적 축복 선언으로 읽기
  rationale: 문맥상 이는 회개 촉구와 연결된 조건적/결과적 진술이며, 마지막 절의 ‘여러분이 말한 것처럼’이 그들의 기존 주장에 대한 반전을 드러냅니다.
  doctrine_reference: 원문 우선 원칙에 따라 언약적 긴장과 조건성을 보존합니다.
