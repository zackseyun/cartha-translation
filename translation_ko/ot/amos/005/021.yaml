base_translation:
  language: en
  yaml_path: translation/ot/amos/005/021.yaml
  text: I hate[a], I reject your festivals, and I will not delight in your solemn assemblies.
  footnotes:
  - marker: a
    text: Literally, 'I will not smell'—that is, I will not accept or take pleasure in them.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희의 절기들을 미워하고 거절합니다. 너희의 엄숙한 집회를 기쁘게 여기지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘너희의 엄숙한 집회에서 냄새를 맡지 않겠다’입니다. 제의 문맥에서는 그것을 기뻐하거나 받아들이지 않겠다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  english_pob_choice: I hate
  chosen_korean: 나는 … 미워하고
  alternatives_korean:
  - 나는 … 혐오하고
  - 나는 … 싫어하고
  lexicon: HALOT
  rationale: 히브리어 완전형 1인칭 단수는 야훼의 강한 개인적 혐오를 드러내므로, 현대 한국어에서는 ‘미워하다’가 그 직설성과 شدت를 가장 자연스럽게 전달합니다.
- source_word: מָאַסְתִּי
  english_pob_choice: I reject
  chosen_korean: 받아들이지 않겠습니다
  alternatives_korean:
  - 거절하겠습니다
  - 배척하겠습니다
  lexicon: HALOT
  rationale: מאס은 단순 감정 표현보다 ‘부적합한 것으로 거부하다’의 뜻이 강하므로, 예배 행위를 공식적으로 승인하지 않겠다는 의미를 살려 ‘받아들이지 않겠습니다’로 옮겼습니다.
- source_word: חַגֵּיכֶם
  english_pob_choice: your festivals
  chosen_korean: 너희의 절기들
  alternatives_korean:
  - 너희의 축제들
  - 너희의 명절들
  lexicon: HALOT
  rationale: חג는 제의적 절기/축제를 가리키므로, 한국어에서 종교적·제의적 색채가 분명한 ‘절기’가 가장 직접적입니다.
- source_word: בְּעַצְּרֹתֵיכֶם
  english_pob_choice: in your solemn assemblies
  chosen_korean: 너희의 엄숙한 집회
  alternatives_korean:
  - 너희의 엄숙한 모임
  - 너희의 성대한 집회
  lexicon: HALOT
  rationale: עֲצָרָה/עֲצֶרֶת는 단순 모임이 아니라 제의적이고 엄숙한 집회를 뜻하므로, ‘엄숙한 집회’가 본문의 공식성과 예배 맥락을 보존합니다.
theological_decisions:
- issue: אָרִיחַ의 직역 이미지와 관용적 의미
  chosen_reading: 주된 문장에서는 ‘받아들이지 않겠습니다’로 옮기고, 감각적 이미지보다 거부의 의미를 살렸습니다.
  alternative_readings:
  - ‘냄새 맡지 않겠습니다’로 직역하기
  - ‘기쁘게 여기지 않겠습니다’로 의역하기
  rationale: 히브리어 동사는 문자적으로 ‘냄새 맡다’와 연결되지만, 여기서는 제의적 수용/불수용을 나타내는 관용 표현입니다. 한국어 본문에서는 어색한 직역보다 예배를 인정하지 않는다는 뜻이 분명해야 합니다.
  doctrine_reference: 번역 철학 §1, §3, §6
