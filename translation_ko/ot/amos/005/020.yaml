id: AMO.5.20
reference: Amos 5:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹא חֹ֛שֶׁךְ י֥וֹם יְהוָ֖ה וְ/לֹא א֑וֹר וְ/אָפֵ֖ל וְ/לֹא נֹ֥גַֽהּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/020.yaml
  text: Is not the day of Yahweh darkness[a], and not light, and gloom with no brightness in it?
  footnotes:
  - marker: a
    text: Or 'and gloom, with no shining for it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와의 날은 어찌 어둠이지 빛이겠으며, 어찌 캄캄함이지 밝음이겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘캄캄함이요, 그에게는 빛남이 없음이겠습니까.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Is not
  chosen_korean: 어찌 …겠습니까?
  alternatives_korean:
  - ~이 아닙니까?
  - 정녕 …입니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 예상되는 대답을 요구하므로, 한국어에서는 반문형 표현으로 그 긴장과 압박을 자연스럽게 살렸습니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 암흑
  - 캄캄함
  lexicon: HALOT
  rationale: 명사적 대조를 살리기 위해 표준적이고 직설적인 ‘어둠’을 기본값으로 삼았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문의 하나님의 언약 이름을 한국어 성경 관용어에 맞게 표시했습니다. 이 구절은 ‘여호와의 날’이라는 고정된 예언자적 표현이므로, 한국어 독자의 인지 가능성을 위해 기존 관용형을 택했습니다.
- source_word: וְאָפֵל
  english_pob_choice: and gloom
  chosen_korean: 캄캄함
  alternatives_korean:
  - 짙은 어둠
  - 침침함
  lexicon: HALOT
  rationale: אָפֵל은 단순한 어둠보다 더 짙고 답답한 상태를 가리키므로, ‘어둠’과 중복을 피하면서 강도를 살리는 ‘캄캄함’을 선택했습니다.
- source_word: וְלֹא נֹגַהּ לוֹ
  english_pob_choice: with no brightness in it
  chosen_korean: 밝음이 없겠습니까
  alternatives_korean:
  - 비침이 없겠습니까
  - 비춤이 없겠습니까
  lexicon: HALOT
  rationale: נֹגַהּ의 ‘빛남/밝음’ 의미를 살려, 마지막 절정의 부정을 한국어에서 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 여호와의 날의 심판적 성격
  chosen_reading: 이 날은 빛이 아니라 어둠과 캄캄함으로 규정되는 심판의 날입니다.
  alternative_readings:
  - 중립적인 날의 묘사로 약화하기
  - 미래의 일반적 재난으로만 읽기
  rationale: 문맥상 선지자적 경고로서 ‘여호와의 날’은 구원의 기대가 아니라 임박한 심판을 뜻하므로, 어둠-빛의 대립을 약화하지 않았습니다.
  doctrine_reference: Amos 5:18-20의 문맥과 예언자적 ‘여호와의 날’ 전통
