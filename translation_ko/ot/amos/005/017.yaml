id: AMO.5.17
reference: Amos 5:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/כָל כְּרָמִ֖ים מִסְפֵּ֑ד כִּֽי אֶעֱבֹ֥ר בְּ/קִרְבְּ/ךָ֖ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/017.yaml
  text: And in all the vineyards there will be wailing[b][a], for I will pass through your midst," says Yahweh.
  footnotes:
  - marker: a
    text: Or 'mourning' or 'lamentation' for 'wailing.' The Hebrew term refers to public grieving, often expressed audibly.
    reason: lexical_alternative
  - marker: b
    text: '''I will pass through your midst'' may echo earlier biblical language of divine visitation in judgment; compare Exodus 12:12. The verse itself does not make the allusion explicit.'
    reason: cross_reference
translation:
  language: ko
  text: “그리고 모든 포도원에는 통곡이 있을 것입니다[a]. 이는 내가 너희 가운데를 지나갈 것이기 때문입니다[b].” 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘통곡’은 מִסְפֵּד가 가리키는 공개적 애곡과 슬픔의 소리를 현대 한국어로 압축해 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 너희 가운데를 지나갈 것입니다’는 출애굽기 12:12의 심판적 방문 언어를 떠올리게 할 수 있으나, 본문 자체가 그 연관을 명시하지는 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְ/כָל כְּרָמִים
  english_pob_choice: And in all the vineyards
  chosen_korean: 모든 포도원에는
  alternatives_korean:
  - 그리고 모든 포도원에는
  - 그리고 모든 포도밭마다
  lexicon: HALOT
  rationale: 전치사와 양화 표현은 장소 범위를 강조하므로 ‘모든 포도원에는’로 옮겨 분포적 의미를 살렸습니다. ‘포도원’이 원문의 כְּרָמִים에 가장 직접적으로 대응합니다.
- source_word: מִסְפֵּד
  english_pob_choice: there will be wailing
  chosen_korean: 통곡이 있을 것입니다
  alternatives_korean:
  - 애곡이 있을 것입니다
  - 슬픔이 있을 것입니다
  - 애도 소리가 있을 것입니다
  lexicon: HALOT
  rationale: 이 명사는 공개적인 슬픔과 소리 나는 애곡을 가리키므로, 현대 한국어에서 강한 음성적 뉘앙스를 살리는 ‘통곡’이 적절합니다.
- source_word: אֶעֱבֹר בְּ/קִרְבְּ/ךָ
  english_pob_choice: I will pass through your midst
  chosen_korean: 내가 너희 가운데를 지나갈 것이기 때문입니다
  alternatives_korean:
  - 내가 너희 가운데를 통과할 것이기 때문입니다
  - 내가 너희 한가운데를 지나갈 것이기 때문입니다
  - 내가 너희 가운데를 지나가겠기 때문입니다
  lexicon: HALOT
  rationale: ‘지나가다’보다 ‘지나갈 것’이 עבר의 움직임을 자연스럽게 살리며, ‘너희 가운데’는 집합적 주소를 한국어로 읽기 쉽게 옮깁니다. ‘통과하다’는 다소 기계적이어서 배제했습니다.
- source_word: אָמַר יְהוָה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀이십니다
  - 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 종결 공식은 현재형의 직접 발화를 살려 ‘말씀하십니다’로 옮겼습니다. יְהוָה는 본 프로젝트 기본어인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: ‘I will pass through your midst’의 심판적 방문 뉘앙스
  chosen_reading: ‘너희 가운데를 지나갈’은 단순한 이동이 아니라 심판 가운데 임하는 신적 방문으로 읽을 수 있게 두었습니다.
  alternative_readings:
  - ‘너희 가운데를 지나가다’로 단순한 이동처럼 완화하는 읽기
  - 출애굽기 12:12의 암시를 본문에 명시적으로 넣는 읽기
  rationale: 원문은 심판의 임재를 강하게 암시하지만, 직접 설명하지는 않습니다. 따라서 본문은 간결하게 유지하고, 가능한 성경 내 공명을 과잉 해설하지 않았습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 본문에서는 ‘야훼’로 옮겨 언약적 고유성을 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 처리하는 전통적 교회 번역
  - ‘여호와’로 음역하는 읽기
  rationale: 원문에 직접 나타난 신명은 숨기지 않고 드러내는 것이 이 프로젝트의 원칙에 부합합니다. 문맥상 예언자적 선언의 주어도 분명히 유지됩니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → Yahweh
