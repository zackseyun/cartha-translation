  source_fidelity: 본문의 핵심 의미는 충실합니다. בְּכָל־כְּרָמִים은 ‘모든 포도원에는/에서’, מִסְפֵּד은 공개적 애곡·통곡, כִּי는 원인을 나타내며, אֶעֱבֹר בְּקִרְבְּךָ는 ‘내가 너희 가운데를 지나갈 것이다’로 적절히 옮겼습니다. יְהוָה도 프로젝트 방침에 맞게 ‘야훼’로 보존했습니다.
  naturalness: ‘통곡이 있을 것입니다’와 ‘야훼께서 말씀하십니다’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. 다만 독립 인용문으로 제시할 때에는 여는 인용 부호도 갖추고, 문장 종결을 명확히 하는 편이 더 자연스럽습니다.
