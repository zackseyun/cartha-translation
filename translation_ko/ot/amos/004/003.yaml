source:
  edition: WLC
  text: וּ/פְרָצִ֥ים תֵּצֶ֖אנָה אִשָּׁ֣ה נֶגְדָּ֑/הּ וְ/הִשְׁלַכְתֶּ֥נָה הַ/הַרְמ֖וֹנָ/ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/003.yaml
  text: And through the breaches you will go out[a], each woman straight ahead of her[b], and you will be cast out toward Harmon,” declares Yahweh.
  footnotes:
  - marker: a
    text: Or possibly “and you will be thrown to Harmon,” “to the fortress,” or “to Hermon.” The Hebrew הַהַרְמוֹנָה is obscure, and its precise referent is uncertain.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: “woman before/opposite her,” likely meaning each woman will go straight out through the breach in front of her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 틈 사이로 너희는 나가며[a], 각 여자도 그 여자의 정면으로[b] 나갈 것이며, 너희는 하르몬으로 던져질 것입니다.” 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하르몬으로 던져질 것이다”, “요새로”, 혹은 “헤르몬으로”로도 옮길 수 있습니다. 히브리어 הַהַרְמוֹנָה는 불분명하여 정확한 대상을 확정하기 어렵습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 “그 여자 앞/정면”입니다. 문맥상 각 여자가 성벽의 틈을 곧장 빠져나간다는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְרָצִים
  english_pob_choice: through the breaches
  chosen_korean: 틈 사이로
  alternatives_korean:
  - 무너진 틈 사이로
  - 파괴된 성벽 사이로
  - 균열 사이로
  lexicon: HALOT
  rationale: פְרָצִים은 성벽의 ‘틈’ 또는 ‘허물어진 곳’으로 이해하는 것이 자연스러워, 이동 경로를 드러내는 ‘틈 사이로’로 옮겼습니다.
- source_word: תֵּצֶאנָה
  english_pob_choice: you will go out
  chosen_korean: 너희는 나가며
  alternatives_korean:
  - 너희는 나갈 것이며
  - 너희는 나옵니다
  - 너희는 나오게 될 것이며
  lexicon: HALOT
  rationale: 미완료형 2인칭 복수 여성형의 기본 의미인 ‘나가다’를 유지하되, 심판 맥락의 연속 동작을 살려 연결형으로 처리했습니다.
- source_word: אִשָּׁה נֶגְדָּהּ
  english_pob_choice: each woman straight ahead of her
  chosen_korean: 각 여자도 그 여자의 정면으로
  alternatives_korean:
  - 각 여자도 그 여자 앞쪽으로
  - 각 여자는 자기 앞을 향해
  - 각 여자도 그 앞에 있는 방향으로
  lexicon: HALOT
  rationale: אִשָּׁה נֶגְדָּהּ는 분배적으로 ‘각 여자’에 대응하며, נֶגֶד의 ‘앞/정면’ 의미를 살려 각자가 곧장 빠져나가는 장면을 표현했습니다.
- source_word: הַהַרְמוֹנָה
  english_pob_choice: toward Harmon
  chosen_korean: 하르몬으로
  alternatives_korean:
  - 하몬으로
  - 헤르몬으로
  - 요새로
  lexicon: HALOT
  rationale: 이 어휘는 불확실한 지명/대상으로 보이므로, 의미를 확정하는 ‘요새’보다 음역 ‘하르몬’을 택해 원문의 불명확성을 보존했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  - 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언서의 종결 공식은 한국어에서 자연스럽게 ‘말씀입니다’로 처리해도 원문 기능을 유지하며, 여호와 대신 야훼를 사용했습니다.
theological_decisions:
- issue: 예언 종결 공식의 화자 표지
  chosen_reading: 직접 인용을 닫은 뒤 ‘야훼의 말씀입니다’로 마무리했습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼께서 선언하십니다’
  rationale: נְאֻם יְהוָה는 예언적 권위 표지이므로, 현대 한국어에서 지나치게 경직되지 않으면서도 신탁의 종결감을 주는 형식을 택했습니다.
  doctrine_reference: 예언서 문체와 신적 발화의 권위 표지
