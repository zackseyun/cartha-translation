id: AMO.4.1
reference: Amos 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֞וּ הַ/דָּבָ֣ר הַ/זֶּ֗ה פָּר֤וֹת הַ/בָּשָׁן֙ אֲשֶׁר֙ בְּ/הַ֣ר שֹֽׁמְר֔וֹן הָ/עֹשְׁק֣וֹת דַּלִּ֔ים הָ/רֹצְצ֖וֹת אֶבְיוֹנִ֑ים הָ/אֹמְרֹ֥ת לַ/אֲדֹֽנֵי/הֶ֖ם הָבִ֥יאָ/ה וְ/נִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/001.yaml
  text: Hear this word[a], you cows of Bashan, who are on the mountain of Samaria, who oppress the poor, who crush the needy, who say to their masters, “Bring[b], that we may drink.”
  footnotes:
  - marker: a
    text: Or “their husbands.” The Hebrew אֲדֹנֵיהֶם can refer to masters, lords, or husbands depending on context.
    reason: alternative_reading
  - marker: b
    text: Bashan was a fertile region east of the Jordan, famous for well-fed cattle; the image is a biting insult aimed at the luxurious and oppressive.
    reason: cultural_note
translation:
  language: ko
  text: 이 말을 들으십시오, 바산의 암소들[b]아, 사마리아 산에 있는 자들아. 너희는 가난한 이들을 착취하고 궁핍한 이들을 짓누르며, 자기 주인들에게[a] “가져오십시오. 우리가 마시겠습니다”라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 남편들에게.” 히브리어 אֲדֹנֵיהֶם은 문맥에 따라 주인들, 지배자들, 또는 남편들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 바산은 요단강 동쪽의 비옥한 지역으로, 살진 가축으로 유명했습니다. 이 이미지는 사치스럽고 압제적인 이들을 향한 날카로운 모욕입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ הַדָּבָר הַזֶּה
  english_pob_choice: Hear this word
  chosen_korean: 이 말을 들으십시오
  alternatives_korean:
  - 이 말씀을 들으십시오
  - 이 말을 들어라
  lexicon: HALOT
  rationale: 예언적 호소문의 직접성을 살리기 위해 ‘들으십시오’를 썼고, דבר는 여기서 ‘말씀’보다 중립적인 ‘말’이 자연스럽습니다.
- source_word: פָּרוֹת הַבָּשָׁן
  english_pob_choice: cows of Bashan
  chosen_korean: 바산의 암소들
  alternatives_korean:
  - 바산의 소들
  - 바산의 암소들아
  lexicon: HALOT
  rationale: פָּרוֹת는 암소를 가리키므로 성별을 살려 ‘암소들’로 옮겼고, 모욕적 비유의 날카로움을 유지했습니다.
- source_word: הָעֹשְׁקוֹת דַּלִּים / הָרֹצְצוֹת אֶבְיוֹנִים
  english_pob_choice: who oppress the poor / who crush the needy
  chosen_korean: 가난한 자들을 압제하고 궁핍한 자들을 짓밟으며
  alternatives_korean:
  - 가난한 자들을 억압하고 궁핍한 자들을 부수며
  - 가난한 이들을 학대하고 궁핍한 이들을 짓밟으며
  lexicon: HALOT
  rationale: עָשַׁק은 사회·경제적 압제를 포괄하므로 ‘압제하다’가 적절하고, רָצַץ의 폭력성을 ‘짓밟다’로 살렸습니다.
- source_word: לַאֲדֹנֵיהֶם
  english_pob_choice: to their masters
  chosen_korean: 자기들의 주인들에게
  alternatives_korean:
  - 자기들의 남편들에게
  - 자기들의 주인들에게
  lexicon: HALOT
  rationale: אֲדֹנֵיהֶם은 문맥상 ‘주인들/지배자들’이 가장 넓고 안전한 번역이어서 본문에는 이를 두고, 결혼관계 해석은 각주로 보존했습니다.
theological_decisions:
- issue: ‘바산의 암소들’의 수신자 범위
  chosen_reading: 사마리아의 부유하고 사치스러우며 타인을 착취하는 여성들을 향한 예언적 비유로 읽었습니다.
  alternative_readings:
  - 사마리아의 넓은 엘리트 집단 전체를 가리키는 더 포괄적 비유
  - 단순한 동물적 조롱으로서 특정 성별을 좁게 지칭하지 않는 읽기
  rationale: 동사와 형용사의 여성복수형이 연속되므로 본문은 여성들에게 직접 말하는 형태가 강합니다. 본문은 그 성별 표지를 유지한 채 비유의 모욕성과 비판을 드러내야 합니다.
  doctrine_reference: 문법적 표지와 수사적 비유를 우선하여 본문 감각을 보존
