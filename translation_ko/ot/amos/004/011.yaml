source:
  edition: WLC
  text: הָפַ֣כְתִּי בָ/כֶ֗ם כְּ/מַהְפֵּכַ֤ת אֱלֹהִים֙ אֶת סְדֹ֣ם וְ/אֶת עֲמֹרָ֔ה וַ/תִּהְי֕וּ כְּ/א֖וּד מֻצָּ֣ל מִ/שְׂרֵפָ֑ה וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/011.yaml
  text: I overthrew some among you as God overthrew Sodom and Gomorrah[a], and you became like a brand snatched from the burning; yet you did not return to me[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'among you'; the Hebrew preposition may be read without making the partitive sense explicit.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'like the overthrow of God of Sodom and Gomorrah,' that is, like the overthrow God brought on Sodom and Gomorrah.
    reason: lexical_alternative
  - marker: c
    text: Or 'a firebrand rescued from the blaze.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 가운데 일부를 소돔과 고모라를 하나님이 뒤엎으신 것처럼 뒤엎었습니다[a][b]. 너희는 불타는 곳에서 건져 낸 장작토막처럼 되었지만[c], 너희는 내게로 돌아오지 않았습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 가운데’; 히브리어 전치사는 분배적 의미를 명시하지 않은 채 읽을 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나님의 소돔과 고모라의 뒤엎으심’으로, 곧 하나님이 소돔과 고모라에 가져오신 전복을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘불에서 건져 낸 불쏘시개처럼’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַכְתִּי
  english_pob_choice: I overthrew
  chosen_korean: 뒤엎었습니다
  alternatives_korean:
  - 엎었습니다
  - 무너뜨렸습니다
  lexicon: HALOT
  rationale: 판결 맥락의 הפך는 단순한 전환보다 파멸적 전복을 뜻하므로, 한국어의 ‘뒤엎다’가 원문의 강한 심판 뉘앙스를 가장 직접적으로 살립니다.
- source_word: בָכֶם
  english_pob_choice: some among you
  chosen_korean: 너희 가운데 일부를
  alternatives_korean:
  - 너희 가운데
  - 너희 안에서
  lexicon: HALOT
  rationale: 전치사 ב의 분배적 의미를 드러내기 위해 ‘일부를’로 옮겨, 심판이 민족 전체가 아니라 그 안의 일부에 미친다는 점을 분명히 했습니다.
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  english_pob_choice: as God overthrew
  chosen_korean: 하나님이 뒤엎으신 것처럼
  alternatives_korean:
  - 하나님의 뒤엎으심처럼
  - 하나님께서 뒤엎으신 것처럼
  lexicon: HALOT
  rationale: ‘소돔과 고모라’에 대한 창세기적 심판을 동사형으로 풀어, ‘하나님이 행하신 전복’이라는 뜻을 자연스럽고도 source-direct하게 드러냈습니다.
- source_word: כְּאוּד מֻצָּל מִשְּׂרֵפָה
  english_pob_choice: like a brand snatched from the burning
  chosen_korean: 불타는 곳에서 건져 낸 장작토막처럼
  alternatives_korean:
  - 불에서 건져 낸 숯덩이처럼
  - 불붙은 나뭇조각처럼
  lexicon: HALOT
  rationale: אוּד는 불에서 건져 낸 나무 조각을 가리키므로, ‘장작토막’으로 구체화해 비유의 생생함을 살렸고, מֻצָּל의 구출 이미지는 ‘건져 낸’으로 표현했습니다.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  english_pob_choice: yet you did not return to me
  chosen_korean: 너희는 내게로 돌아오지 않았습니다
  alternatives_korean:
  - 하지만 너희는 내게 돌아서지 않았습니다
  - 너희는 내게로 회개하지 않았습니다
  lexicon: HALOT
  rationale: 예언서의 관용구 שׁוב + עַד은 언약적 회귀를 뜻하므로, ‘돌아오다’로 유지해 관계 회복과 회개의 의미를 함께 보존했습니다.
theological_decisions:
- issue: 야훼의 표기
  chosen_reading: 야훼의 말씀입니다
  alternative_readings:
  - 주님의 말씀입니다
  - 여호와의 말씀입니다
  rationale: 원문에 יְהוָה가 직접 있으므로, 프로젝트 기본값에 따라 신명기를 지우지 않고 고유한 언약명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 심판 후의 언약적 귀환
  chosen_reading: 내게로 돌아오지 않았습니다
  alternative_readings:
  - 내게로 회개하지 않았습니다
  - 내게로 돌아서지 않았습니다
  rationale: 예언자적 책망의 핵심은 내적 후회가 아니라 하나님께로의 관계적 귀환이므로, ‘돌아오다’가 신학적 범위를 가장 넓고 정확하게 보존합니다.
