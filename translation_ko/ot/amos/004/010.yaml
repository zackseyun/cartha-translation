id: AMO.4.10
reference: Amos 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁלַּ֨חְתִּי בָ/כֶ֥ם דֶּ֨בֶר֙ בְּ/דֶ֣רֶךְ מִצְרַ֔יִם הָרַ֤גְתִּי בַ/חֶ֨רֶב֙ בַּח֣וּרֵי/כֶ֔ם עִ֖ם שְׁבִ֣י סֽוּסֵי/כֶ֑ם וָ/אַעֲלֶ֞ה בְּאֹ֤שׁ מַחֲנֵי/כֶם֙ וּֽ/בְ/אַפְּ/כֶ֔ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/010.yaml
  text: I sent among you a plague in the manner of Egypt[a]; I killed your young men with the sword, along with your captured horses, and I made the stench of your camps rise even into your nostrils; yet you did not return to me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'after the manner of Egypt,' likely alluding to the plagues/judgments associated with Egypt rather than a literal route.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'along with the captivity of your horses'; the phrase likely refers to military defeat in which their horses were taken.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 가운데에 재앙을 보냈고, 이집트의 방식으로 했습니다[a]. 너희 젊은이들을 칼로 죽였고, 너희의 사로잡힌 말들과 함께였습니다[b]. 또 너희 진영들의 악취를 올라오게 하여 너희 코로 들어가게 했습니다. 그러나 너희는 내게 돌아오지 않았습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이집트의 방식’은 문자적 이동 경로라기보다, 이집트에 내렸던 재앙/심판을 암시하는 표현일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘너희 말들의 포로 됨’이라고도 읽을 수 있으며, 전쟁 패배로 말들이 사로잡힌 상황을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁלַּחְתִּי / בָכֶם
  english_pob_choice: I sent among you
  chosen_korean: 내가 너희 가운데에 재앙을 보냈고
  alternatives_korean:
  - 내가 너희 가운데 재앙을 보냈고
  - 내가 너희에게 재앙을 보냈고
  - 내가 너희를 향해 재앙을 보냈고
  lexicon: HALOT
  rationale: שלח의 기본 뜻을 살리되, 재앙이 사람들 ‘가운데’ 임했다는 뉘앙스를 한국어 조사로 자연스럽게 옮겼습니다.
- source_word: דֶּבֶר בְּדֶרֶךְ מִצְרַיִם
  english_pob_choice: a plague in the manner of Egypt
  chosen_korean: 이집트의 방식으로 했습니다
  alternatives_korean:
  - 이집트의 방식처럼 했습니다
  - 이집트와 같은 방식으로 했습니다
  - 이집트의 길로 했습니다
  lexicon: HALOT
  rationale: בדרך מצרים는 문자적 ‘길’보다 이집트에 내린 재앙을 떠올리게 하는 관용구로 보이므로, 그 암시를 살려 ‘이집트의 방식’으로 옮겼습니다.
- source_word: עִם שְׁבִי סוּסֵי/כֶם
  english_pob_choice: along with your captured horses
  chosen_korean: 너희의 사로잡힌 말들과 함께였습니다
  alternatives_korean:
  - 너희 말들의 포로 됨과 함께였습니다
  - 너희 말들이 사로잡힌 것과 함께였습니다
  - 너희가 빼앗긴 말들과 함께였습니다
  lexicon: HALOT
  rationale: שבי는 ‘포로 됨/사로잡힌 상태’를 뜻하므로, 전쟁 패배로 말들이 끌려간 상황을 드러내면서도 압축된 히브리어 표현을 과도하게 풀지 않았습니다.
- source_word: וּבְאַפְּ/כֶם
  english_pob_choice: even into your nostrils
  chosen_korean: 너희 코로 들어가게 했습니다
  alternatives_korean:
  - 너희 콧구멍까지 올라가게 했습니다
  - 너희 코끝까지 올라가게 했습니다
  - 너희 콧속까지 올라가게 했습니다
  lexicon: HALOT
  rationale: אַף는 여기서 신체의 코/콧구멍을 가리키므로, 악취가 실제로 코에 닿는 강한 이미지를 한국어로 자연스럽게 재현했습니다.
- source_word: שַׁבְתֶּם עָדַי
  english_pob_choice: you did not return to me
  chosen_korean: 너희는 내게 돌아오지 않았습니다
  alternatives_korean:
  - 너희는 내게로 돌아서지 않았습니다
  - 너희는 내게 회개하지 않았습니다
  - 너희는 내게 돌아오지 않았습니다
  lexicon: HALOT
  rationale: שוב의 예언서적 용례를 따라 ‘회개하다’로 풀기보다, 본문의 직접 표현인 ‘돌아오다’를 유지해 언약적 초청의 의미를 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם은 한국어에서 성경적 종결로 자연스럽게 ‘말씀입니다’가 적합하며, 야훼는 본 프로젝트의 표준 음역을 따랐습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 tetragrammaton을 직접 사용하므로, 프로젝트 기준에 따라 ‘야훼’로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘돌아오다’의 회개 함의
  chosen_reading: 내게 돌아오지 않았습니다
  alternative_readings:
  - 내게 회개하지 않았습니다
  - 내게로 돌아서지 않았습니다
  rationale: 히브리어 שוב는 회개의 함의를 가질 수 있지만, 본문 자체의 동사는 ‘돌아오다’이므로 도덕적 해석을 덧붙이지 않고 언약적 관계 회복의 소명을 보존했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
