id: AMO.4.13
reference: Amos 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֡י הִנֵּה֩ יוֹצֵ֨ר הָרִ֜ים וּ/בֹרֵ֣א ר֗וּחַ וּ/מַגִּ֤יד לְ/אָדָם֙ מַה שֵּׂח֔/וֹ עֹשֵׂ֥ה שַׁ֨חַר֙ עֵיפָ֔ה וְ/דֹרֵ֖ךְ עַל בָּ֣מֳתֵי אָ֑רֶץ יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/013.yaml
  text: For behold[a], the one who forms the mountains and creates the wind, and declares to man what his thought is, who makes the dawn darkness and treads on the heights of the earth—Yahweh, the God of hosts[c][b], is his name.
  footnotes:
  - marker: a
    text: Or 'creates the spirit'; Hebrew רוּחַ can mean 'wind,' 'breath,' or 'spirit.'
    reason: lexical_alternative
  - marker: b
    text: Or 'declares to humankind'; Hebrew 'to man' uses the representative singular אָדָם.
    reason: lexical_alternative
  - marker: c
    text: Or 'what he is thinking' / 'what his meditation is'; the Hebrew term can refer to inward musing or thought.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 산들을 빚으시고 바람을 창조하시며, 사람에게 그의 생각이 무엇인지 알리시고[b][c], 새벽을 어둠으로 바꾸시며 땅의 높은 곳들을 밟고 다니시는 분—그의 이름은 야훼, 만군의 하나님이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영을 창조하시는 분’으로도 옮길 수 있습니다. 히브리어 רוּחַ는 ‘바람’, ‘숨’, ‘영’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘인류에게’로 옮길 수 있습니다. 히브리어 ‘사람에게’는 대표 단수 אָדָם을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 무엇을 생각하는지’ / ‘그의 묵상이 무엇인지’로도 옮길 수 있습니다. 히브리어는 내면의 생각이나 묵상을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보십시오
  lexicon: HALOT
  rationale: כִּי의 논리적 연결과 הִנֵּה의 지시적 긴급함을 함께 살리기 위해, 예언적 호소에 어울리는 공손한 명령형 ‘보십시오’를 택했습니다.
- source_word: יוֹצֵר הָרִים
  english_pob_choice: the one who forms the mountains
  chosen_korean: 산들을 빚으시고
  alternatives_korean:
  - 산들을 만드시고
  - 산들을 지으시고
  lexicon: HALOT
  rationale: יוֹצֵר는 단순 제작보다 형상화·빚음의 뉘앙스가 있어, 창조적 장인의 느낌을 살리는 ‘빚으시고’로 옮겼습니다.
- source_word: וּבֹרֵא רוּחַ
  english_pob_choice: and creates the wind
  chosen_korean: 바람을 창조하시며
  alternatives_korean:
  - 영을 창조하시며
  - 숨을 창조하시며
  lexicon: HALOT
  rationale: 이 문맥은 산, 새벽, 땅의 높은 곳과 함께 우주적 창조 행위를 나열하므로 ‘바람’이 가장 자연스럽습니다. 다만 רוּחַ의 중의성은 본문에 그대로 남겼습니다.
- source_word: וּמַגִּיד לְאָדָם מַה שֵּׂחוֹ
  english_pob_choice: and declares to man what his thought is
  chosen_korean: 사람에게 그의 생각이 무엇인지 알리시고
  alternatives_korean:
  - 사람에게 그가 무엇을 생각하는지 알리시고
  - 사람에게 그의 묵상이 무엇인지 알리시고
  lexicon: HALOT
  rationale: מגיד는 단순 말하기보다 ‘알림/선언’의 격식을 띠므로 ‘알리시고’로 옮겼고, שֵׂחוֹ는 내면의 생각·묵상으로 읽혀 ‘생각’이 과도한 해석 없이 뜻을 전달합니다.
- source_word: עֹשֵׂה שַׁחַר עֵיפָה
  english_pob_choice: who makes the dawn darkness
  chosen_korean: 새벽을 어둠으로 바꾸시며
  alternatives_korean:
  - 새벽을 어둡게 하시며
  - 새벽을 어둠이 되게 하시며
  lexicon: HALOT
  rationale: עֵיפָה는 어둠/암흑을 가리키며, 이 표현은 새벽을 뒤집는 심판적 반전을 강조하므로 ‘어둠으로 바꾸시며’가 가장 직설적입니다.
- source_word: וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ
  english_pob_choice: and treads on the heights of the earth
  chosen_korean: 땅의 높은 곳들을 밟고 다니시는 분
  alternatives_korean:
  - 땅의 높은 곳을 밟으시는 분
  - 땅의 산봉우리들을 밟고 다니시는 분
  lexicon: HALOT
  rationale: דרך는 단순히 걷는 것보다 ‘밟다/짓밟다’에 가깝고, בָּמֳתֵי אָרֶץ는 지리적 높이를 가리키므로 ‘높은 곳들’을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명(神名) יְהוָה는 프로젝트 기본값대로 ‘야훼’로 옮겨, 호칭 대체가 아니라 고유 이름을 드러냈습니다.
- source_word: אֱלֹהֵי צְבָאוֹת
  english_pob_choice: the God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 군대의 하나님
  - 천군의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת의 관용적 한국어 대응으로 ‘만군의 하나님’을 채택해, 하늘 군대의 위엄을 자연스러운 표현으로 살렸습니다.
theological_decisions:
- issue: רוּחַ의 번역 범위
  chosen_reading: 바람
  alternative_readings:
  - 영
  - 숨
  rationale: 창조·우주 통치의 연속 동사들과 결합해 자연현상으로 읽는 것이 가장 강합니다. 다만 히브리어의 의미 폭은 주석층이 아니라 본문 해석의 열린 가능성으로 남겨 두었습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: אָדָם의 대표적 단수
  chosen_reading: 사람
  alternative_readings:
  - 인류
  - 사람들
  rationale: 히브리어는 대표 단수 אָדָם을 사용하므로, 문법상 단수를 유지하면서도 현대 한국어에서 자연스럽게 읽히는 ‘사람’을 택했습니다.
  doctrine_reference: DOCTRINE.md §4 Gender-accurate over gender-neutral
