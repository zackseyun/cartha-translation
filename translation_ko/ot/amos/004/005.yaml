  text: וְ/קַטֵּ֤ר מֵֽ/חָמֵץ֙ תּוֹדָ֔ה וְ/קִרְא֥וּ נְדָב֖וֹת הַשְׁמִ֑יעוּ כִּ֣י כֵ֤ן אֲהַבְתֶּם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/005.yaml
  text: And burn a thank offering from leavened bread[a], and proclaim freewill offerings—announce them! For this is what you have loved, O sons of Israel[b], declares the Lord GOD.
  footnotes:
  - marker: a
    text: Or 'with leaven' or 'of leavened bread'; the Hebrew phrase links leavened material with the thank offering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 누룩 든 것으로 감사 제물을 불살라 드리십시오[a]. 낙헌제들을 선포하고 널리 알리십시오! 이스라엘 자손들아[b], 너희가 바로 그런 일을 좋아하기 때문입니다. 주 야훼께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누룩과 함께’ 또는 ‘누룩 든 빵으로’; 히브리어 구는 누룩 든 재료와 감사 제물을 연결합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַטֵּר מֵחָמֵץ תּוֹדָה
  english_pob_choice: And burn a thank offering from leavened bread[a]
  chosen_korean: 그리고 누룩 든 것으로 감사제를 드리고
  alternatives_korean:
  - 누룩 있는 것으로 감사제를 태우고
  - 누룩 든 빵으로 감사제를 드리고
  lexicon: WLC/사전 일반 제사 용례
  rationale: קטר는 제단 위에서 제물을 연기 올라가게 드리는 제사 동작이므로, 한국어에서는 제의적 의미를 살린 ‘감사제를 드리다’로 옮기고, מֵחָמֵץ는 재료/동반 성격을 살려 ‘누룩 든 것으로’ 처리했습니다.
- source_word: וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ
  english_pob_choice: and proclaim freewill offerings—announce them!
  chosen_korean: 낙헌제를 선포하며—알리십시오!
  alternatives_korean:
  - 자원제를 선포하며—알리십시오!
  - 낙헌제를 외치며—널리 알리십시오!
  lexicon: HALOT
  rationale: נְדָבוֹת은 제의적 ‘자원제/낙헌제’이므로 교회적 어법보다 제사 용어를 유지했고, הַשְׁמִיעוּ는 ‘듣게 하다/알리다’의 사역형이어서 공적인 공포를 살리는 ‘알리십시오’로 옮겼습니다.
- source_word: כִּי כֵן אֲהַבְתֶּם
  english_pob_choice: For this is what you have loved
  chosen_korean: 이는 너희가 사랑해 온 것인데
  alternatives_korean:
  - 이는 너희가 그렇게 사랑해 온 것인데
  - 너희가 바로 그것을 사랑해 왔기 때문입니다
  lexicon: HALOT
  rationale: 완료형 אֲהַבְתֶּם의 지속된 성향을 반영해 ‘사랑해 온’으로 옮기고, 예언자의 비꼬는 어조를 유지하기 위해 인과보다 설명적 진술로 처리했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: O sons of Israel[b]
  chosen_korean: 이스라엘의 아들들아
  alternatives_korean:
  - 이스라엘 백성아
  - 이스라엘 자손들아
  lexicon: HALOT
  rationale: 직역적 호칭을 유지해 המקור의 남성 복수 호격을 드러냈고, 한국어에서는 ‘아들들아’로 직접 부름의 날카로운 어조를 보존했습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  english_pob_choice: declares the Lord GOD
  chosen_korean: 주 하나님께서 말씀하십니다
  alternatives_korean:
  - 주 여호와께서 말씀하십니다
  - 주 하나님이 선언하십니다
  lexicon: 고유한 예언 공식
  rationale: נְאֻם은 예언적 선언 공식을 나타내므로 ‘말씀하십니다’로 옮겼고, אֲדֹנָי יְהוִה는 한국어 성경의 일반 독법을 따라 ‘주 하나님’으로 처리했습니다.
theological_decisions:
- issue: YHWH를 한국어에서 어떻게 처리할지
  chosen_reading: 주 하나님
  alternative_readings:
  - 야훼
  - 주 여호와
  rationale: 이 구절의 예언 공식에서는 독자 가독성과 본문 흐름을 위해 전통적 한국어 성경에서 널리 통용되는 ‘주 하나님’을 채택했습니다. 다만 본문 자체의 히브리어 신명은 주석 층위에서 추적 가능합니다.
  doctrine_reference: POB Korean name rendering policy for אֲדֹנָי יְהוִה
