  naturalness: 초안의 ‘이는 너희가 사랑해 온 것인데’는 뒤의 호격 및 선언 공식과 결합될 때 문장이 매끄럽지 않습니다. ‘이스라엘 자손들아, 너희가 바로 그런 일을 좋아하기 때문이다’는 현대 표준 한국어 합쇼체에서 자연스럽게 예언적 비꼼을 전달합니다. ‘이스라엘의 아들들아’는 히브리어 관용적 집단 호칭으로서는 지나치게 문자적이고 한국어에서 부자연스러워 ‘이스라엘 자손들아’로 조정하되, 각주에 직역을 남깁니다.
