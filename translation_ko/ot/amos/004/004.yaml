id: AMO.4.4
reference: Amos 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֹּ֤אוּ בֵֽית אֵל֙ וּ/פִשְׁע֔וּ הַ/גִּלְגָּ֖ל הַרְבּ֣וּ לִ/פְשֹׁ֑עַ וְ/הָבִ֤יאוּ לַ/בֹּ֨קֶר֙ זִבְחֵי/כֶ֔ם לִ/שְׁלֹ֥שֶׁת יָמִ֖ים מַעְשְׂרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/004.yaml
  text: Come to Bethel—and transgress; to Gilgal—and multiply transgression. Bring your sacrifices every morning[a], your tithes every three days,
  footnotes:
  - marker: a
    text: Or 'on the third day' or 'after three days' for 'every three days.'
    reason: alternative_reading
translation:
  language: ko
  text: 벧엘로 와서 범죄하십시오. 길갈로 가서 죄를 더욱 많이 지으십시오. 아침마다 여러분의 제물을 바치고, 사흘마다[a] 여러분의 십일조를 바치십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사흘째에’ 또는 ‘사흘 후에’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹּאוּ בֵית אֵל
  english_pob_choice: Come to Bethel
  chosen_korean: 벧엘로 와서도
  alternatives_korean:
  - 벧엘에 들어오십시오
  - 벧엘로 가십시오
  lexicon: HALOT
  rationale: בוא의 명령형 복수는 초청처럼 들리지만 예언적 조롱의 흐름이므로, 자연스러운 ‘오다’로 살리면서 목적지 표지는 ‘-로’로 처리했습니다.
- source_word: וּפִשְׁעוּ / הַרְבּוּ לִפְשֹׁעַ
  english_pob_choice: and transgress / and multiply transgression
  chosen_korean: —범죄하고 / —죄를 더 많이 지으십시오
  alternatives_korean:
  - —반역하고 / —반역을 더 늘리십시오
  - —죄를 짓고 / —죄를 더욱 더하십시오
  lexicon: HALOT
  rationale: פשע는 단순한 일반적 ‘죄’보다 covenantal한 ‘범죄/반역’의 뉘앙스가 있어, 예언적 아이러니를 살리는 방향으로 번역했습니다. 두 번째 절은 히필+부정사구의 증강을 한국어로 자연스럽게 풀어 ‘더 많이 지으십시오’로 옮겼습니다.
- source_word: לַבֹּקֶר / לִשְׁלֹשֶׁת יָמִים
  english_pob_choice: every morning / every three days
  chosen_korean: 매일 아침 / 사흘마다
  alternatives_korean:
  - 아침마다 / 사흘에 한 번
  - 매 아침 / 사흘마다
  lexicon: HALOT
  rationale: לַבֹּקֶר는 분배적 반복을 드러내는 표현으로 보고 ‘매일 아침’이라 했고, לִשְׁלֹשֶׁת יָמִים는 영어 POB의 주석과 함께 읽어 실제 반복 감각이 살아나는 ‘사흘마다’를 본문에 반영했습니다.
- source_word: זִבְחֵיכֶם / מַעְשְׂרֹתֵיכֶם
  english_pob_choice: your sacrifices / your tithes
  chosen_korean: 여러분의 제물 / 여러분의 십일조
  alternatives_korean:
  - 여러분의 희생제물 / 여러분의 십분의 일
  - 여러분의 제사 / 여러분의 십일조
  lexicon: HALOT
  rationale: זבח는 제의적 희생을 가리키므로 통상적인 ‘제물’로 옮겼고, מַעֲשֵׂר 계열은 교회 전통어와도 호응하는 ‘십일조’를 유지하되 문맥상 조롱의 톤을 해치지 않게 했습니다.
theological_decisions:
- issue: 예언적 아이러니를 한국어에서 얼마나 노골적으로 드러낼지
  chosen_reading: 명령형의 표면을 유지하되, ‘—’와 문장 흐름으로 조롱성이 드러나게 했습니다.
  alternative_readings:
  - ‘가서 범죄하십시오’처럼 더 직설적으로 처리
  - ‘범죄해 보십시오’처럼 노골적 비꼼을 추가
  rationale: 히브리어는 실제 명령형을 사용해 풍자를 구성하므로, 해설을 덧붙여 과잉 해석하지 않고 원문의 수사적 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
