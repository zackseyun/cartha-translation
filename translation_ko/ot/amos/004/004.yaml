review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘와서도’와 ‘가서도’에 들어 있는 보조사 ‘-도’는 히브리어 본문에 없는 양보·첨가의 뉘앙스를 더합니다. 명령형들의 예언적 풍자는 유지하되 이 հավել가 의미는 제거해야 합니다. ‘아침마다’와 ‘사흘마다’는 각각 לַבֹּקֶר와 논쟁적인 לִשְׁלֹשֶׁת יָמִים의 선택된 독법을 충실히 반영합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘벧엘로 와서 … 길갈로 가서’는 두 성소를 향한 움직임과 이어지는 명령을 한국어에서 무리 없이 표현합니다. 각주 표지는 ‘사흘마다’ 바로 뒤에 두어, 어느 표현의 대안 독법인지 명확히 합니다.
  terminology: ‘범죄하다’는 פשע의 위반·반역의 함의를 비교적 잘 보존하며, ‘죄를 더욱 많이 짓다’는 הַרְבּוּ לִפְשֹׁעַ의 증강을 자연스럽게 드러냅니다. ‘제물’과 ‘십일조’도 제의 문맥에서 적절합니다.
  issues:
  - severity: medium
    issue: ‘와서도’와 ‘가서도’의 ‘-도’가 원문에 없는 양보 또는 첨가의 뉘앙스를 더합니다.
    rationale: 본문은 ‘벧엘로 오라, 그리고 범죄하라; 길갈로 가라, 그리고 범죄를 늘려라’라는 병렬적 명령과 풍자를 구사합니다. ‘-도’는 ‘그곳에 가서조차’라는 추가 의미를 암시하므로 삭제하는 편이 원문 수사에 더 충실합니다.
  - severity: low
    issue: 대안 독법 각주 표지가 해당 시간 표현에서 떨어져 있습니다.
    rationale: 각주가 לִשְׁלֹשֶׁת יָמִים만을 설명하므로 ‘사흘마다’ 직후에 표기하면 참조 범위가 분명해집니다.
  revised_text: 벧엘로 와서 범죄하십시오. 길갈로 가서 죄를 더욱 많이 지으십시오. 아침마다 여러분의 제물을 바치고, 사흘마다[a] 여러분의 십일조를 바치십시오.
