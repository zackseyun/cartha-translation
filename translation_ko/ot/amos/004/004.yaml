revisions:
- from: 벧엘로 와서도—범죄하고, 길갈로 가서도—죄를 더 많이 지으십시오. 매일 아침 여러분의 제물을 바치고, 사흘마다 여러분의 십일조를 바치십시오.[a]
  to: 벧엘로 와서 범죄하십시오. 길갈로 가서 죄를 더욱 많이 지으십시오. 아침마다 여러분의 제물을 바치고, 사흘마다[a] 여러분의 십일조를 바치십시오.
  rationale: 원문에 없는 ‘-도’를 삭제하여 명령형의 병렬 구조와 예언적 아이러니를 보존했습니다. 시간 표현의 대안 독법은 본문의 ‘사흘마다’를 유지하되 해당 어구에 직접 각주를 연결했습니다. 그 밖의 제의 용어와 합쇼체 문체는 유지했습니다.
