source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִי֩ מָנַ֨עְתִּי מִ/כֶּ֜ם אֶת הַ/גֶּ֗שֶׁם בְּ/ע֨וֹד שְׁלֹשָׁ֤ה חֳדָשִׁים֙ לַ/קָּצִ֔יר וְ/הִמְטַרְתִּי֙ עַל עִ֣יר אֶחָ֔ת וְ/עַל עִ֥יר אַחַ֖ת לֹ֣א אַמְטִ֑יר חֶלְקָ֤ה אַחַת֙ תִּמָּטֵ֔ר וְ/חֶלְקָ֛ה אֲשֶֽׁר לֹֽא תַמְטִ֥יר עָלֶ֖י/הָ תִּיבָֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/007.yaml
  text: And I also withheld the rain from you when there were still three months until the harvest; and I caused it to rain on one city[a], but on another city I did not cause it to rain. One field received rain, but the field on which it did not rain dried up.
  footnotes:
  - marker: a
    text: Or, 'One plot was rained on, but the plot on which rain did not fall dried up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 추수까지 아직 석 달이 남았을 때 너희에게서 비를 거두었습니다. 나는 한 성읍에는 비를 내렸으나 다른 성읍에는 비를 내리지 않았습니다. 한 밭에는 비가 내렸지만, 비가 내리지 않은 밭은 말라버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘한 구획에는 비가 내렸지만, 비가 내리지 않은 구획은 말라버렸습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אָנֹכִי
  english_pob_choice: And I also
  chosen_korean: 그리고 나는
  alternatives_korean:
  - 그리고 나도
  - 또한 나는
  lexicon: HALOT
  rationale: 추가 강조를 나타내는 גַם을 ‘그리고’로 자연스럽게 잇고, 독립 인칭대명사의 강조는 한국어에서는 별도 강조어 없이 주어를 앞세워 살렸습니다.
- source_word: מָנַעְתִּי מִכֶּם אֶת הַגֶּשֶׁם
  english_pob_choice: withheld the rain from you
  chosen_korean: 너희에게서 비를 거두었습니다
  alternatives_korean:
  - 너희에게서 비를 막았습니다
  - 너희에게서 비를 거두어 갔습니다
  lexicon: HALOT
  rationale: מנע의 ‘막다/거두다’ 의미를 살리면서, 농경 문맥에서 하나님의 적극적 박탈 행위를 드러내는 ‘거두었습니다’를 택했습니다.
- source_word: וְהִמְטַרְתִּי
  english_pob_choice: I caused it to rain
  chosen_korean: 비를 내렸습니다
  alternatives_korean:
  - 비가 오게 했습니다
  - 비를 내리게 했습니다
  lexicon: HALOT
  rationale: 히필의 원인적 힘은 유지하되, 한국어에서는 ‘내리다’가 비의 자연스러운 표현이므로 지나치게 설명적인 구조를 피했습니다.
- source_word: חֶלְקָה אַחַת / וְחֶלְקָה אֲשֶׁר לֹא תַמְטִיר עָלֶי־הָ
  english_pob_choice: One field received rain, but the field on which it did not rain
  chosen_korean: 한 밭에는 비가 내렸지만, 비가 내리지 않은 밭은
  alternatives_korean:
  - 한 구획에는 비가 내렸지만, 비가 내리지 않은 구획은
  - 한 땅에는 비가 내렸지만, 비가 내리지 않은 땅은
  lexicon: HALOT
  rationale: חלקה는 농경 구획을 가리키므로 문맥에 맞는 ‘밭’으로 옮겼고, 대조 구조를 분명히 하기 위해 반복을 살렸습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위의 표현
  chosen_reading: 비를 거두었습니다, 비를 내렸습니다처럼 하나님이 직접 행하시는 서술을 유지했습니다.
  alternative_readings:
  - 비가 그쳤습니다
  - 비가 왔습니다
  rationale: 본문은 기상 현상을 중립적으로 묘사하기보다 언약 심판의 주권적 행위를 강조하므로, 주어-동사 구조를 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
