source:
  edition: WLC
  text: נִשְׁבַּ֨ע אֲדֹנָ֤/י יְהוִה֙ בְּ/קָדְשׁ֔/וֹ כִּ֛י הִנֵּ֥ה יָמִ֖ים בָּאִ֣ים עֲלֵי/כֶ֑ם וְ/נִשָּׂ֤א אֶתְ/כֶם֙ בְּ/צִנּ֔וֹת וְ/אַחֲרִיתְ/כֶ֖ן בְּ/סִיר֥וֹת דּוּגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/002.yaml
  text: 'The Lord GOD has sworn by his holiness: For behold[a], days are coming upon you when they will lift you away with hooks[b], and your posterity with fishhooks.'
  footnotes:
  - marker: a
    text: Or 'the last of you' for 'your remnant'; the Hebrew term can denote one's end, future, or those remaining.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew terms for 'hooks' and 'fishhooks' are difficult; some understand the imagery more generally as being carried off with sharp implements used like fishing gear.
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님께서는 그의 거룩하심을 두고 맹세하셨습니다. “보십시오, 날들이 너희에게 닥치고 있으니, 사람들이 너희를 갈고리[b]로 끌어가며 너희의 남은 자들[a]을 낚시갈고리로 끌어갈 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘너희의 끝’, ‘너희의 미래’, 또는 ‘너희의 남은 자들’을 뜻할 수도 있습니다. 여기서는 심판 뒤에 남은 이들을 가리키는 것으로 이해했습니다.
    reason: alternative_reading
  - marker: b
    text: ‘갈고리’와 ‘낚시갈고리’에 해당하는 히브리어 낱말들은 뜻이 분명하지 않습니다. 이 비유는 포로들을 끌어가는 데 쓰는 날카로운 도구를 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: The Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이+יהוה의 결합은 한국어에서 중복을 피하면서도 두 요소를 살리기 위해 ‘주 하나님’으로 옮겼습니다. 본문 내 계명적 호칭의 엄숙함을 유지합니다.
- source_word: בְּקָדְשׁוֹ
  english_pob_choice: by his holiness
  chosen_korean: 자신의 거룩하심을 두고
  alternatives_korean:
  - 그의 성소를 두고
  - 그의 거룩하심으로
  lexicon: HALOT
  rationale: קדשׁ는 여기서 성소보다 하나님의 거룩하심을 가리키는 맹세 표현으로 보는 것이 자연스럽습니다. 한국어에서는 ‘두고 맹세하다’가 이 관용을 가장 직접적으로 살립니다.
- source_word: יָמִים בָּאִים עֲלֵיכֶם
  english_pob_choice: days are coming upon you
  chosen_korean: 날들이 너희에게 닥치고 있으니
  alternatives_korean:
  - 날들이 너희에게 오고 있으니
  - 날들이 너희 위에 임하니
  lexicon: HALOT
  rationale: 예언적 경고의 압박감을 살리기 위해 ‘upon you’를 단순한 도착보다 ‘닥치다’로 옮겼습니다. 진행형 현재는 ‘-고 있으니’로 자연스럽게 표현했습니다.
- source_word: וְנִשָּׂא אֶתְכֶם בְּצִנּוֹת וְאַחֲרִיתְכֶן בְּסִירוֹת דּוּגָה
  english_pob_choice: they will lift you away with hooks, and your posterity with fishhooks
  chosen_korean: 사람들이 너희를 갈고리로 끌어가며 너희의 남은 자들을 낚시갈고리로 끌어갈 것입니다
  alternatives_korean:
  - 사람들이 너희를 갈고리로 끌어가며 너희의 후손을 낚시갈고리로 끌어갈 것입니다
  - 사람들이 너희를 갈고리로 끌어가며 너희의 끝부분을 낚시갈고리로 끌어갈 것입니다
  lexicon: HALOT
  rationale: 동사의 수동/비인칭적 힘을 한국어에서 ‘사람들이 … 끌어가다’로 풀어 forced removal 이미지를 살렸습니다. אַחֲרִיתְכֶן은 문맥상 혈통적 ‘후손’보다 남겨진 자들까지 포함하는 총체적 포로 이동을 가리키므로 ‘남은 자들’로 처리했습니다. צִנּוֹת/סִירוֹת דּוּגָה는 난해하지만 병렬과 이미지상 갈고리·낚시갈고리로 옮기는 것이 가장 직접적입니다.
theological_decisions:
