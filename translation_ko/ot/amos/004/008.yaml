id: AMO.4.8
reference: Amos 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָע֡וּ שְׁתַּיִם֩ שָׁלֹ֨שׁ עָרִ֜ים אֶל עִ֥יר אַחַ֛ת לִ/שְׁתּ֥וֹת מַ֖יִם וְ/לֹ֣א יִשְׂבָּ֑עוּ וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/008.yaml
  text: So two or three cities staggered to one city to drink water[a], but they were not satisfied; yet you did not return to me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'staggered' or 'reeled' to one city; the Hebrew verb suggests unsteady movement to and fro in search of water.
    reason: lexical_alternative
  - marker: b
    text: Or 'turn back to me.' In Amos, 'return' carries the sense of covenantal turning back to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 두세 성읍이 물을 마시려고 한 성읍으로 비틀거리며 갔으나 만족하지 못했습니다. 그런데도 너희는 내게로 돌아오지 않았습니다. 야훼의 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '비틀거리며'나 '휘청거리며'로도 옮길 수 있습니다. 히브리어 동사는 물을 찾아 불안정하게 이리저리 움직이는 모습을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내게로 돌아서지 않았습니다.' 아모스에서 '돌아오다'는 언약적으로 하나님께로 돌아서는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  english_pob_choice: staggered
  chosen_korean: 비틀거리며 갔으나
  alternatives_korean:
  - 비틀거리며
  - 휘청거리며
  - 방황하며
  lexicon: HALOT
  rationale: 문맥이 가뭄 속 급박한 이동이므로 단순한 이동보다 불안정하고 절박한 움직임을 드러내는 표현이 적절합니다. 영어 POB의 'staggered'에 맞춰 한국어에서도 몸이 흔들리는 뉘앙스를 살렸습니다.
- source_word: שְׁתַּיִם שָׁלֹשׁ עָרִים
  english_pob_choice: two or three cities
  chosen_korean: 두세 성읍이
  alternatives_korean:
  - 두세 도시가
  - 두 세 성읍이
  lexicon: HALOT
  rationale: 히브리어의 관용적 수량 결합을 한국어의 자연스러운 '두세'로 옮겨, 불특정 소수라는 의미를 유지했습니다.
- source_word: לִשְׁתּוֹת מַיִם
  english_pob_choice: to drink water
  chosen_korean: 물을 마시려고
  alternatives_korean:
  - 물을 마시기 위해
  - 물 마시러
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구로 이해해 한국어의 목적형으로 옮겼습니다. '마시려고'는 구문상 자연스럽고 동작의 목적을 분명히 합니다.
- source_word: וְלֹא יִשְׂבָּעוּ
  english_pob_choice: but they were not satisfied
  chosen_korean: 만족하지 못했습니다
  alternatives_korean:
  - 배부르지 못했습니다
  - 충분하지 않았습니다
  - 채워지지 않았습니다
  lexicon: HALOT
  rationale: שׂבע는 기본적으로 충족/만족의 의미를 가지므로, 물을 찾아도 해갈되지 않는 상태를 한국어의 '만족하지 못했습니다'로 넓게 보존했습니다.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  english_pob_choice: yet you did not return to me
  chosen_korean: 그런데도 너희는 내게로 돌아오지 않았습니다
  alternatives_korean:
  - 그런데도 너희는 내게로 돌아서지 않았습니다
  - 그런데도 너희는 내게로 되돌아오지 않았습니다
  lexicon: HALOT
  rationale: נבוא서 문맥의 שׁוב은 단순한 복귀가 아니라 언약적 회심을 포함하므로, 직역성을 유지하면서도 그 방향을 드러내는 '돌아오다'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 기록된 신명은 칭호 '주'로 대체하지 않고 고유명사로 옮기는 원칙에 따라 '야훼'를 사용했습니다.
theological_decisions:
- issue: 회개로서의 '돌아오다'
  chosen_reading: '''내게로 돌아오지 않았습니다''는 단순 귀환이 아니라 언약적 회심의 부재를 함께 드러냅니다.'
  alternative_readings:
  - 내게로 되돌아오지 않았습니다
  - 내게로 돌아서지 않았습니다
  - 회개하지 않았습니다
  rationale: 아모스의 예언적 경고에서는 שׁוב이 하나님께로의 언약적 전환을 포함하지만, '회개하다'로 완전히 풀면 해석이 앞서므로 원문의 긴장을 유지하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: 신명 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명은 호칭이 아니라 언약적 고유명으로 기능하므로, 번역에서도 그 차이를 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
