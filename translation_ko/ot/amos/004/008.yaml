  source_fidelity: 첫 접속사 וְ는 단순 연결이며 인과를 뜻하는 ‘그러므로’는 본문에 없습니다. נוע는 가뭄 가운데 이리저리 움직이는 모습을 나타내므로 ‘이리저리 헤매며’로 옮기고 대안을 각주에 보존하는 것이 안전합니다. שׂבע의 ‘충족되다’는 물의 문맥에서 ‘충분히 마시지 못하다’로 자연스럽게 표현할 수 있습니다.
  naturalness: 기존의 ‘만족하지 못했습니다’는 물을 마시는 문맥에서 다소 추상적입니다. 또한 두 각주가 문장 끝에 함께 붙어 있어 각주의 적용 지점이 불분명합니다. 해당 어구 뒤에 각각 배치해야 합니다.
  terminology: ‘성읍’, ‘야훼’, ‘내게로 돌아오지 않았습니다’는 표준어 현대 합쇼체로 적절하며, 신명 및 언약적 회귀의 함의를 과도하게 해석하지 않고 보존합니다.
