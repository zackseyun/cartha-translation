  text: וְ/גַם אֲנִי֩ נָתַ֨תִּי לָ/כֶ֜ם נִקְי֤וֹן שִׁנַּ֨יִם֙ בְּ/כָל עָ֣רֵי/כֶ֔ם וְ/חֹ֣סֶר לֶ֔חֶם בְּ/כֹ֖ל מְקוֹמֹֽתֵי/כֶ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/006.yaml
  text: And I also gave you cleanness of teeth in all your cities[a], and lack of bread in all your places; yet you did not return to me, declares Yahweh.
  footnotes:
  - marker: a
    text: Literally, “cleanness of teeth,” an idiom for having nothing to eat.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 또한 너희의 모든 성읍에 이가 깨끗함을, 너희의 모든 곳에 양식의 부족을 주었으나, 너희는 내게로 돌아오지 않았습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이가 깨끗함”이며, 먹을 것이 없어 이를 사용할 일이 없다는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְיוֹן שִׁנַּיִם
  english_pob_choice: cleanness of teeth
  chosen_korean: 이가 하얘질 정도의 먹을 것 없음
  alternatives_korean:
  - 이가 깨끗함
  - 치아의 깨끗함
  - 이가 하얀 상태
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역 이미지를 한국어로 살리되, 의미가 곧바로 드러나도록 ‘먹을 것 없음’을 덧붙여 기근의 뜻을 보존했습니다.
- source_word: וְחֹסֶר לֶחֶם
  english_pob_choice: and lack of bread
  chosen_korean: 빵이 부족함
  alternatives_korean:
  - 빵의 부족
  - 빵이 모자람
  - 양식의 결핍
  lexicon: HALOT
  rationale: 앞의 관용구와 평행을 이루는 더 구체적이고 자연스러운 현대 한국어 표현을 택해, 문자적 요소 ‘빵’과 결핍감을 함께 전달했습니다.
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  english_pob_choice: yet you did not return to me
  chosen_korean: 너희는 내게로 돌아오지 않았습니다
  alternatives_korean:
  - 너희는 내게 돌아서지 않았습니다
  - 너희는 내게 회개하지 않았습니다
  lexicon: HALOT
  rationale: שׁוּב의 언약적 의미를 살리면서도, 단순한 내적 감정보다 하나님께로의 회귀라는 직접적 관계를 유지하는 표현으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀입니다
  - 야훼의 말씀이니라
  lexicon: HALOT
  rationale: 본문의 예언자적 종결 공식을 한국어 현대 문체로 옮기면서, מקור의 신명기적 이름을 프로젝트 기본값인 ‘야훼’로 반영했습니다.
theological_decisions:
- issue: 여호와/주님의 관용을 어떻게 처리할지
  chosen_reading: יְהוָה를 ‘야훼’로 옮겨 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 주
  - 여호와
  rationale: 이 절은 신적 칭호가 아니라 고유한 언약 이름을 직접 사용하므로, 본문이 드러내는 정체성을 보존하기 위해 음역을 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘이가 하얘질 정도’의 이미지 보존 여부
  chosen_reading: 관용구의 시각적 이미지를 살리면서 뜻을 풀어 주는 절충 번역을 사용했습니다.
  alternative_readings:
  - 먹을 것이 없었습니다
  - 기근이 있었습니다
  - 이빨이 깨끗했습니다
  rationale: 히브리어의 날카로운 풍자적 이미지를 유지하는 것이 예언 본문의 수사학을 살리므로, 완전한 의역보다 이미지+의미 병기를 택했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; original-language primacy'
