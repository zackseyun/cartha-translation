  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִכֵּ֣יתִי אֶתְ/כֶם֮ בַּ/שִּׁדָּפ֣וֹן וּ/בַ/יֵּרָקוֹן֒ הַרְבּ֨וֹת גַּנּוֹתֵי/כֶ֧ם וְ/כַרְמֵי/כֶ֛ם וּ/תְאֵנֵי/כֶ֥ם וְ/זֵיתֵי/כֶ֖ם יֹאכַ֣ל הַ/גָּזָ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/009.yaml
  text: I struck you with blight and mildew; your many gardens and your vineyards[a], your fig trees and your olive trees, the locust devoured; yet you did not return to me, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the cutting locust' (or 'gnawing locust'); the Hebrew names a crop-devouring insect, traditionally understood as a kind of locust.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 식물마름병과 곰팡이병으로 쳤으며, 너희의 많은 정원과 포도원, 무화과나무와 감람나무를 메뚜기가[a] 먹어 치웠으나, 너희는 내게로 돌아오지 않았습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘가잠’은 작물을 해치는 곤충을 가리키며, 전통적으로 메뚜기류의 한 종류로 이해됩니다. ‘갉아먹는 메뚜기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֵּיתִי
  english_pob_choice: I struck
  chosen_korean: 내가 … 쳤으며
  alternatives_korean:
  - 내가 … 때렸으며
  - 내가 … 치셨으며
  lexicon: HALOT
  rationale: נכה의 능동적 심판 행위를 현대 한국어에서 자연스럽게 살리면서도, 고어적·성경투 번역체를 피하기 위해 ‘치다’를 택했습니다.
- source_word: בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן
  english_pob_choice: with blight and mildew
  chosen_korean: 밭흰가루병과 노균병으로
  alternatives_korean:
  - 서리해와 노균병으로
  - 시듦과 노랗게 됨으로
  lexicon: HALOT
  rationale: 두 농업 재앙은 농작물을 해치는 질병성 재앙으로 이해되므로, 한국어에서도 병해의 성격이 드러나도록 ‘밭흰가루병’과 ‘노균병’으로 옮겼습니다.
- source_word: יֹאכַל הַגָּזָם
  english_pob_choice: the locust devoured
  chosen_korean: 메뚜기가 먹어 치웠으나
  alternatives_korean:
  - 메뚜기가 삼켰으나
  - 메뚜기가 먹었으나
  lexicon: HALOT
  rationale: 가잠은 작물을 갉아먹는 곤충을 가리키므로, 파괴적 소비를 강조하는 ‘먹어 치우다’로 옮겨 원문의 심판적 뉘앙스를 살렸습니다.
- source_word: שַׁבְתֶּם עָדַי
  english_pob_choice: you did not return to me
  chosen_korean: 너희는 내게로 돌아오지 않았습니다
  alternatives_korean:
  - 너희는 내게 돌아서지 않았습니다
  - 너희는 내게로 회개하지 않았습니다
  lexicon: HALOT
  rationale: ‘돌아오다’는 선지서에서 하나님께로의 언약적 회귀를 넓게 담아내므로, 회개로 좁히지 않고 관계적·언약적 의미를 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 공식어로서 단순한 화행 표지이므로, 한국어에서는 종결 어투를 유지하는 ‘말씀입니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유한 언약 სახელ을 가리키므로, POB 기준에 따라 신적 칭호로 치환하지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘돌아오다’의 신학적 범위
  chosen_reading: 언약적 회귀를 포함하는 ‘돌아오다’
  alternative_readings:
  - 내적 회개로 좁힌 번역
  - 단순한 방향 전환으로 축소한 번역
  rationale: 이 표현은 회개, 전환, 재충성을 함께 포함할 수 있으므로, 의미를 축소하지 않기 위해 넓은 범주의 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
