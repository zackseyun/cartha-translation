id: AMO.4.12
reference: Amos 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֥ה אֶעֱשֶׂה לְּ/ךָ֖ יִשְׂרָאֵ֑ל עֵ֚קֶב כִּֽי זֹ֣את אֶֽעֱשֶׂה לָּ֔/ךְ הִכּ֥וֹן לִ/קְרַאת אֱלֹהֶ֖י/ךָ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/012.yaml
  text: Therefore[a], thus I will do to you, Israel; because I will do this to you, prepare to meet your God, Israel.
  footnotes:
  - marker: a
    text: Or, 'prepare to encounter your God.' In context, the meeting is a fearful confrontation following announced judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 이스라엘아, 내가 너에게 이와 같이 하겠습니다. 내가 너에게 이 일을 하기로 했으니, 네 하나님을 만나러 준비하십시오, 이스라엘아.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 하나님을 맞닥뜨릴 준비를 하십시오.’ 문맥상 이 만남은 선포된 심판 뒤에 오는 두려운 대면입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니까
  - 그래서
  lexicon: HALOT
  rationale: 앞 문맥의 심판 선언에서 결론을 이끄는 접속사로, 문맥상 인과와 전환을 함께 살리는 ‘그러므로’가 가장 자연스럽습니다.
- source_word: כֹּה
  english_pob_choice: thus
  chosen_korean: 이와 같이
  alternatives_korean:
  - 이렇게
  - 그리하여
  lexicon: HALOT
  rationale: 예언적 선포의 지시적 표현을 살리되 현대 한국어에서 어색하지 않도록 ‘이와 같이’로 옮겼습니다.
- source_word: אֶעֱשֶׂה לְּךָ ... אֶעֱשֶׂה לָּךְ
  english_pob_choice: I will do to you ... I will do this to you
  chosen_korean: 내가 너에게 이 일을 하기로 했으니
  alternatives_korean:
  - 내가 너에게 이렇게 하겠습니다
  - 내가 너에게 이 일을 하겠습니다
  lexicon: HALOT
  rationale: עשה의 넓은 의미를 유지하면서 반복을 한국어에서 자연스럽게 풀어, 앞선 선언을 이유절로 받는 구조를 살렸습니다.
- source_word: הִכּוֹן לִקְרַאת
  english_pob_choice: prepare to meet
  chosen_korean: 만나러 준비하십시오
  alternatives_korean:
  - 만날 준비를 하십시오
  - 맞설 준비를 하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘준비하여 맞이하라’에 가깝지만, כאן의 핵심은 임박한 대면이므로 ‘만나러 준비하십시오’로 압축해 긴박감을 살렸습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 네 하나님
  alternatives_korean:
  - 당신의 하나님
  - 너의 하나님
  lexicon: HALOT
  rationale: 히브리어 2인칭 단수 소유격을 그대로 반영해 친밀하면서도 경고의 대상이 분명한 ‘네 하나님’으로 옮겼습니다.
theological_decisions:
- issue: ‘prepare to meet your God’의 어조
  chosen_reading: 다가올 심판적 대면을 경고하는 엄중한 소환으로 읽었습니다.
  alternative_readings:
  - 예배나 회복을 향한 중립적 초대
  - 단순한 종교적 만남의 권고
  rationale: 직전 문맥이 반복되는 심판 선언이며, 따라서 이 명령은 하나님과의 만남 자체보다 그 만남이 갖는 위협적 성격을 강조합니다.
  doctrine_reference: Amos 4:12 문맥상 예언적 경고
