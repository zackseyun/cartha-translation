  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
  footnotes:
  - marker: a
    text: Or “the parcel of land.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the fields of Moab,” an idiom for the land or countryside of Moab.
    reason: cultural_note
  - marker: c
    text: Or “has sold”; the Hebrew form can be understood as a completed action, but here it is rendered as a present within the ongoing legal discussion.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 그는 그 고엘에게 말했습니다. “모압의 들에서[b] 돌아온 나오미가 우리 형제 엘리멜렉에게 속했던 밭의 한 구획을[a] 팔고 있습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “토지의 한 구획”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “모압의 들에서”는 모압의 땅이나 시골을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “팔았습니다”. 히브리어 동사형은 완료로도 이해할 수 있지만, 여기서는 진행 중인 법적 논의에 맞추어 현재로 옮겼습니다.
    reason: alternative_reading
