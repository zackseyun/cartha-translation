source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לַ/גֹּאֵ֔ל חֶלְקַת֙ הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר לְ/אָחִ֖י/נוּ לֶ/אֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַ/שָּׁ֖בָה מִ/שְּׂדֵ֥ה מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
  footnotes:
  - marker: a
    text: Or “the parcel of land.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from the fields of Moab,” an idiom for the land or countryside of Moab.
    reason: cultural_note
  - marker: c
    text: Or “has sold”; the Hebrew form can be understood as a completed action, but here it is rendered as a present within the ongoing legal discussion.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 그는 그 고엘에게 말했습니다. “나오미는 모압의 들에서 돌아온 사람인데, 우리 친족 엘리멜렉의 밭 한 몫을 팔고 있습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “밭의 한 구획”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “모압의 들에서”는 모압의 땅이나 시골을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “팔았습니다”. 히브리어 동사형은 완료로도 읽을 수 있지만, 여기서는 진행 중인 법적 논의에 맞춰 현재로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַגֹּאֵל
  english_pob_choice: to the redeemer
  chosen_korean: 그 고엘에게
  alternatives_korean:
  - 그 구속자에게
  - 그 친족 구속자에게
  - 그 친족에게
  lexicon: HALOT
  rationale: 이 문맥의 גֹּאֵל은 법적 책임을 지는 친족 보호자이므로, 의미를 보존하면서도 고유 기능을 드러내는 음역형 ‘고엘’이 적절합니다.
- source_word: חֶלְקַת הַשָּׂדֶה
  english_pob_choice: the portion of the field
  chosen_korean: 밭 한 몫
  alternatives_korean:
  - 밭의 한 부분
  - 밭의 몫
  - 토지의 한 몫
  lexicon: HALOT
  rationale: חֶלְקָה는 ‘부분, 몫, 구획’의 뜻이 있어, ‘밭 한 몫’이 소유와 분배의 뉘앙스를 간결하게 살립니다.
- source_word: הַשָּׁבָה מִשְּׂדֵה מוֹאָב
  english_pob_choice: who has returned from the fields of Moab
  chosen_korean: 모압의 들에서 돌아온 사람인데
  alternatives_korean:
  - 모압의 들에서 돌아온 나오미가
  - 모압 들판에서 돌아온 사람인데
  - 모압 지방에서 돌아온 사람인데
  lexicon: HALOT
  rationale: 히브리어의 분사구는 나오미를 ‘돌아온 자’로 규정하므로, 관계절로 풀어 현재 대화에 연결되도록 옮겼습니다. ‘모압의 들’은 영어 POB가 지적한 관용구를 반영합니다.
- source_word: מָכְרָה
  english_pob_choice: is selling
  chosen_korean: 팔고 있습니다
  alternatives_korean:
  - 팔았습니다
  - 팔려 합니다
  - 팔고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형이지만, 영어 POB처럼 법적 협의가 진행 중인 상황에 맞춰 현재진행으로 옮겨, 이미 종결된 거래처럼 들리지 않게 했습니다.
theological_decisions:
- issue: גֹּאֵל 용어를 한국어 교회 전통어로 바꿀지 여부
  chosen_reading: ‘고엘’로 음역해 법적-가족적 역할을 드러냈습니다.
  alternative_readings:
  - 구속자
  - 친족구속자
  - 기업 무를 자
  rationale: 이 장면은 구속 개념보다 근족의 권리·의무를 다루는 법정 협상입니다. 전통적 표현보다 מקור의 기능을 직접 드러내는 음역이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 룻기 4장 친족 구속 규례
