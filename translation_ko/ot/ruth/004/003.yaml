  naturalness: ‘모압의 들에서 돌아온 사람인데’는 나오미를 가리키는 표현으로 다소 우회적이고 구어적으로 들립니다. ‘모압의 들에서 돌아온 나오미가’가 현대 표준 한국어의 문장 흐름에 더 자연스럽습니다. ‘밭 한 몫’도 일상어에서는 다소 어색할 수 있어 ‘밭의 한 구획’이 더 명확합니다.
