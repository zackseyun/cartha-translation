  terminology: ‘살몬’, ‘보아스’, ‘오벳’은 적절합니다. 족보 문맥의 ‘낳다’도 한국어 성경 문체에서 정착된 표현입니다. 기존 각주는 본문 표현 자체를 ‘또는 낳았다’라고 제시하여 대안으로 기능하지 않으므로, 실제 의미 대안인 ‘아버지가 되었다’로 고쳐야 합니다.
