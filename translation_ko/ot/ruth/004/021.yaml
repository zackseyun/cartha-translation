  source_fidelity: 히브리어 הוֹלִיד는 족보에서 남성 조상이 자녀를 낳았다는, 곧 ‘아버지가 되다/낳다’의 계보 관계를 나타냅니다. 본문의 ‘낳다’는 이 뜻을 적절히 전달합니다. 히브리어의 두 접속사 וְ는 한국어에서 첫 절의 ‘-았고’로 자연스럽게 반영할 수 있으며, 두 인명도 통용 표기와 일치합니다.
