base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
  footnotes:
  - marker: a
    text: Hebrew text reads literally, 'I acquired' (or 'I have acquired') Ruth the Moabite; many understand the sense here as 'you also acquire' in context.
    reason: textual_variant
  - marker: b
    text: Or 'the dead man’s wife.'
    reason: lexical_alternative
  - marker: c
    text: That is, to preserve the deceased man’s family line and claim within his inherited property.
    reason: cultural_note
translation:
  language: ko
  text: 보아스가 말했습니다. “당신이 나오미의 손에서 그 밭을 사는 날에는, 죽은 이의 아내였던 모압 여인 룻도 맞아들여야 합니다. 이는 죽은 이의 이름을 그의 기업 위에 세우기 위해서입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘내가 모압 여인 룻을 얻었다’ 또는 ‘나는 모압 여인 룻을 얻었습니다’로 읽힙니다. 그러나 문맥상 많은 이들은 ‘당신도 룻을 맞아들여야 한다’는 뜻으로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘죽은 이의 아내’.
    reason: lexical_alternative
  - marker: c
    text: 곧, 죽은 이의 가문과 그가 물려받은 재산에 대한 권리가 계속 보존되게 하려는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  english_pob_choice: On the day you acquire
  chosen_korean: “당신이 … 사는 날에”
  alternatives_korean:
  - “당신이 … приобрет는 날에”
  - “당신이 … 얻는 날에”
  lexicon: HALOT
  rationale: 법적 거래의 맥락을 살리면서도 한국어로 자연스럽게 들리도록 ‘사는 날에’로 옮겼습니다. ‘구매’보다 덜 상업적이면서 원문의 취득 의미를 유지합니다.
- source_word: מִיַּד נָעֳמִי
  english_pob_choice: from the hand of Naomi
  chosen_korean: “나오미의 손에서”
  alternatives_korean:
  - “나오미에게서”
  - “나오미의 소유에서”
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 살려 이전·양도의 법률적 어감을 보존했습니다. 단순히 ‘나오미에게서’로 풀면 원문의 관용성과 절차적 느낌이 약해집니다.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה אֵשֶׁת הַמֵּת
  english_pob_choice: you also acquire Ruth the Moabite, the wife of the dead man
  chosen_korean: “죽은 자의 아내인 모압 여자 룻도 사서”
  alternatives_korean:
  - “모압 여자 룻과 함께”
  - “죽은 자의 아내 룻도”
  lexicon: HALOT
  rationale: 문맥상 밭을 사는 것에 더해 룻에 대한 책임까지 수반됨을 드러내기 위해 ‘도 사서’로 처리했습니다. ‘죽은 자의 아내’는 직역성을 유지하고, ‘모압 여자’는 정체성을 그대로 반영합니다.
- source_word: קניתי / קְנוֹתְךָ
  english_pob_choice: you also acquire / MT-style first person variant in footnote
  chosen_korean: “사서”
  alternatives_korean:
  - “내가 샀다”
  - “사게 됩니다”
  lexicon: HALOT
  rationale: 본문의 매끄러운 흐름은 보아스가 가까운 기업 무를 자에게 말하는 취지이므로 문맥적 의미를 본문에 반영했습니다. MT의 प्रथम인칭형 난점은 주석으로 처리하는 편이 한국어 본문을 덜 어색하게 합니다.
- source_word: לְהָקִים שֵׁם
  english_pob_choice: in order to raise up the name
  chosen_korean: “죽은 자의 이름을 … 세우려는 것입니다”
  alternatives_korean:
  - “죽은 자의 이름을 … 일으키려는 것입니다”
  - “죽은 자의 이름을 … 다시 세우려는 것입니다”
  lexicon: HALOT
  rationale: ‘이름을 세우다’는 한국어에서 명예·가문·지속성을 함께 담을 수 있어 히브리어 관용구를 비교적 직접적으로 살립니다. 단순히 ‘보존하다’로 하면 이미지가 약해집니다.
theological_decisions:
- issue: 룻과 기업 무름이 결합된 법적·가문적 책임의 표현
  chosen_reading: 밭의 취득과 함께 룻에 대한 책임이 따라오며, 그 목적은 죽은 자의 이름을 그의 기업 위에 이어 세우는 데 있다고 본문에 드러냈습니다.
  alternative_readings:
  - 룻을 단순히 배우자로 소개하는 읽기
  - 재산 거래와 별개의 부가 설명으로만 보는 읽기
  rationale: 이 절은 단순한 매매가 아니라 죽은 자의 이름과 기업을 보존하는 가문 보전의 의도를 드러냅니다. 본문 표현을 약화하지 않기 위해 그 목적을 명시했습니다.
  doctrine_reference: 'Translation philosophy #1, #3, #5'
