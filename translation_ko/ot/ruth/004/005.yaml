review_pass:
  verdict: revise
  source_fidelity: 본문은 קניתי의 문맥상 2인칭 의미를 채택한 점과 ‘나오미의 손에서’, ‘이름을 세우다’, ‘기업 위에’를 보존한 점이 대체로 적절합니다. 그러나 사람을 물건처럼 ‘사서’라고 한 표현은 한국어에서 불필요하게 직설적이며, 이 문맥의 가문 계승 책임을 자연스럽게 전달하지 못합니다. 또한 목적절은 ‘하려는 것입니다’보다 의무와 목적을 명료하게 나타내는 표현이 필요합니다. MT의 1인칭 단수 읽기는 각주에서 유지합니다.
  naturalness: ‘모압 여자’보다는 현대 표준어 문어체에서 ‘모압 여인’이 자연스럽습니다. ‘룻도 사서’는 현대 한국어에서 매우 부자연스럽고 오해를 낳을 수 있으므로, 문맥상 수반되는 혼인·가문 책임을 나타내는 ‘맞아들여야 합니다’로 옮기는 것이 안전합니다. ‘죽은 이’는 반복되는 ‘죽은 자’보다 자연스러운 현대 문어체입니다.
  terminology: ‘기업’은 본문의 상속 재산이라는 법적·가문적 의미를 유지하므로 보존했습니다. ‘이름을 세우다’도 히브리어 관용구를 잘 반영합니다. 다만 한국어에서는 ‘죽은 이의 아내’와 ‘죽은 이의 아내였던’의 차이가 실제로 의미를 분명히 하므로, 본문에는 후자를 쓰고 가능한 직역을 각주로 제시했습니다.
