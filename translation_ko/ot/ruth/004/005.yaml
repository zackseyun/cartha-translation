  to: 보아스가 말했습니다. “당신이 나오미의 손에서 그 밭을 사는 날에는, 죽은 이의 아내였던 모압 여인 룻도 맞아들여야 합니다. 이는 죽은 이의 이름을 그의 기업 위에 세우기 위해서입니다.”[a][b][c]
  rationale: 문맥상 가까운 기업 무를 자에게 부과되는 책임을 현대 한국어 합쇼체로 명료하게 옮겼습니다. 사람을 ‘사다’라고 하는 부자연스럽고 오해 소지가 큰 표현은 ‘맞아들이다’로 바꾸되, 난해한 MT의 1인칭 ‘내가 얻었다’ 읽기는 각주에 보존했습니다. ‘기업 위에’와 ‘이름을 세우다’는 원문의 법적·가문적 이미지를 유지했습니다.
