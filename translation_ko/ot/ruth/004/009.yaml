  lexicon: HALOT
  rationale: 법적 증언이 공개적으로 이루어지는 장면이므로 두 집단을 모두 분명히 드러냈습니다.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  english_pob_choice: You are witnesses today
  chosen_korean: 여러분은 오늘 증인입니다
  alternatives_korean:
  - 오늘 여러분은 증인입니다
  - 여러분은 이 날 증인입니다
  lexicon: HALOT
  rationale: 히브리어의 술어 강조를 한국어에서는 자연스러운 판정문으로 옮겼습니다.
- source_word: קָנִיתִי
  english_pob_choice: I have acquired
  chosen_korean: 샀습니다
  alternatives_korean:
  - 획득했습니다
  - 매입했습니다
  lexicon: HALOT
  rationale: 영어 POB가 구매/획득의 법적 이전 가능성을 열어 두지만, 한국어 본문은 거래의 법적·상업적 뉘앙스를 직접 드러내는 ‘샀습니다’를 택했습니다. 다만 이는 소유권 이전을 뜻하는 문맥으로 이해되어야 합니다.
- source_word: מִיַּד נָעֳמִי
  english_pob_choice: from the hand of Naomi
  chosen_korean: 나오미의 손에서
  alternatives_korean:
  - 나오미에게서
  - 나오미의 소유에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려, 나오미의 소유·관리 아래 있던 것에서 넘겨받았다는 법적/관계적 의미를 보존했습니다.
theological_decisions:
- issue: 구매 동사의 신학적/법적 뉘앙스
  chosen_reading: ‘샀습니다’로 직역성 있는 거래 언어를 유지하되, 대상이 사람이 아니라 엘리멜렉 집안의 소유에 관한 법적 이전임을 문맥으로 드러냈습니다.
  alternative_readings:
  - ‘획득했습니다’
  - ‘매입했습니다’
  rationale: 본문은 속량 서사 속의 재산 이전을 말하며, 본문이 말하지 않는 인신매매나 노예화 의미를 덧씌우지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 룻기 속 기업 무르기/속량의 법적 문맥
