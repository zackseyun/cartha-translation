base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
  footnotes:
  - marker: a
    text: Or “I have bought” or “I have purchased”; the Hebrew verb can denote acquiring by purchase in a legal transaction.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “from the hand of Naomi,” an idiom for from Naomi’s possession or control.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 보아스가 장로들과 모든 백성에게 말했습니다. 「여러분이 오늘 증인입니다. 내가 나오미에게서[b] 엘리멜렉에게 속한 모든 것과 기룐과 말론에게 속한 모든 것을 취득했습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “샀습니다”, “구입했습니다”. 히브리어 동사는 법적 거래에서 구매에 의한 취득을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: “나오미의 손에서.” 나오미의 소유나 관리 아래 있던 것으로부터 넘겨받았다는 뜻의 관용구입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
