  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 자연문으로 살려, 사건 전개를 매끄럽게 이어 주는 표현을 택했습니다.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  english_pob_choice: to the elders and all the people
  chosen_korean: 장로들과 모든 백성에게
