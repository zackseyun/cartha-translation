id: RUT.4.4
reference: Ruth 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
  footnotes:
  - marker: a
    text: Hebrew literally, 'uncover your ear,' an idiom meaning 'inform you' or 'let you know.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text reads 'if he will not redeem'; some understand this in context as 'if you will not redeem,' smoothing the shift from second person to third person.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 제가 당신께 알려 드리려고 했습니다. 곧, 여기 앉아 있는 사람들과 내 백성의 장로들 앞에서 그것을 사십시오. 당신이 그것을 무르려면 무르십시오. 그러나 무르지 않으려거든 저에게 말해 주십시오. 그래야 제가 알겠습니다. 당신 외에는 그것을 무를 사람이 없고, 저는 당신 다음이기 때문입니다.” 그가 말했습니다. “제가 무르겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘당신의 귀를 열다’라는 관용구로, ‘알려 드리다’ 또는 ‘말해 드리다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 문자적으로 ‘무르지 않으면’에 해당하는 형태를 가지며, 문맥상 2인칭으로 이해하는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  english_pob_choice: inform you
  chosen_korean: 알려 드리려고 했습니다
  alternatives_korean:
  - 말씀드리려고 했습니다
  - 귀를 열어 드리려고 했습니다
  - 알려 드리겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘귀를 드러내다’의 의미를 살려, 현대 한국어에서는 자연스러운 ‘알려 드리다’로 옮겼습니다.
- source_word: קְנֵה
  english_pob_choice: Buy it
  chosen_korean: 그것을 사십시오
  alternatives_korean:
  - 그것을 사라
  - 그것을 매입하십시오
  - 그것을 취득하십시오
  lexicon: HALOT
  rationale: 이 문맥은 친족-법적 권리와 관련되지만 동사 עצמו는 실제 거래 행위를 가리키므로, ‘사다’가 가장 직접적이고 자연스럽습니다.
- source_word: נֶגֶד הַיֹּשְׁבִים / וְנֶגֶד זִקְנֵי עַמִּי
  english_pob_choice: in the presence of those sitting here / the elders of my people
  chosen_korean: 여기 앉아 있는 사람들과 내 백성의 장로들 앞에서
  alternatives_korean:
  - 여기 앉아 있는 사람들과 내 백성의 장로들 면전에서
  - 여기 앉아 있는 이들과 내 백성의 장로들 앞에서
  lexicon: HALOT
  rationale: נגד는 공개적 증언/면전의 뜻이므로 ‘~앞에서’가 적절하며, היושבים는 현재 그 자리에 앉아 있는 사람들을 가리킵니다.
- source_word: גְּאָל / לִגְאֹל
  english_pob_choice: redeem
  chosen_korean: 무르다
  alternatives_korean:
  - 되찾다
  - 속량하다
  - 구속하다
  lexicon: HALOT
  rationale: 룻기의 친족-속량 문맥에서는 단순 구매보다 ‘무르다’가 소유권을 되찾는 법적·가족적 뉘앙스를 더 잘 보존합니다.
- source_word: אֵין זוּלָתְךָ לִגְאֹל
  english_pob_choice: there is no one besides you to redeem it
  chosen_korean: 당신 외에는 그것을 무를 사람이 없고
  alternatives_korean:
  - 당신밖에는 그것을 무를 이가 없고
  - 당신 외에는 그것을 되찾을 사람이 없고
  lexicon: HALOT
  rationale: זוּלָת는 배제/예외를 나타내므로 ‘당신 외에는’이 자연스럽고, 이어지는 부정절과도 잘 맞습니다.
theological_decisions:
- issue: גאל의 한국어 대응을 어떤 법적·신학적 색조로 둘지
  chosen_reading: ‘무르다’로 일관해 친족-속량의 법적 책임과 회복 의미를 함께 드러냅니다.
  alternative_readings:
  - ‘되찾다’로 더 일반화하기
  - ‘속량하다’로 종교적 어휘화하기
  rationale: 이 절은 단순한 상거래가 아니라 가족 내 구속권 행사에 관한 말이므로, 한국어 성경 전통에서도 의미 범위를 가장 잘 유지하는 ‘무르다’를 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: 히브리어 3인칭 형태 ‘if he will not redeem’의 처리
  chosen_reading: 문맥상 한국어에서는 ‘무르지 않으려거든’으로 자연스럽게 처리했습니다.
  alternative_readings:
  - ‘그가 무르지 않거든’
  - ‘당신이 무르지 않거든’
  rationale: 본문의 자음형은 3인칭처럼 보이지만 문맥상 2인칭 흐름과 충돌하지 않도록, 영어 POB의 주석 취지를 반영해 매끄럽게 옮겼습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
