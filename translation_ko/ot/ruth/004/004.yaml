  - 그것을 매입하십시오
  - 그것을 취득하십시오
  lexicon: HALOT
  rationale: 이 문맥은 친족-법적 권리와 관련되지만 동사 עצמו는 실제 거래 행위를 가리키므로, ‘사다’가 가장 직접적이고 자연스럽습니다.
- source_word: נֶגֶד הַיֹּשְׁבִים / וְנֶגֶד זִקְנֵי עַמִּי
  english_pob_choice: in the presence of those sitting here / the elders of my people
  chosen_korean: 여기 앉아 있는 사람들과 내 백성의 장로들 앞에서
  alternatives_korean:
  - 여기 앉아 있는 사람들과 내 백성의 장로들 면전에서
  - 여기 앉아 있는 이들과 내 백성의 장로들 앞에서
  lexicon: HALOT
  rationale: נגד는 공개적 증언/면전의 뜻이므로 ‘~앞에서’가 적절하며, היושבים는 현재 그 자리에 앉아 있는 사람들을 가리킵니다.
- source_word: גְּאָל / לִגְאֹל
  english_pob_choice: redeem
  chosen_korean: 무르다
  alternatives_korean:
  - 되찾다
  - 속량하다
  - 구속하다
  lexicon: HALOT
  rationale: 룻기의 친족-속량 문맥에서는 단순 구매보다 ‘무르다’가 소유권을 되찾는 법적·가족적 뉘앙스를 더 잘 보존합니다.
- source_word: אֵין זוּלָתְךָ לִגְאֹל
  english_pob_choice: there is no one besides you to redeem it
  chosen_korean: 당신 외에는 그것을 무를 사람이 없고
  alternatives_korean:
  - 당신밖에는 그것을 무를 이가 없고
  - 당신 외에는 그것을 되찾을 사람이 없고
  lexicon: HALOT
  rationale: זוּלָת는 배제/예외를 나타내므로 ‘당신 외에는’이 자연스럽고, 이어지는 부정절과도 잘 맞습니다.
theological_decisions:
- issue: גאל의 한국어 대응을 어떤 법적·신학적 색조로 둘지
  chosen_reading: ‘무르다’로 일관해 친족-속량의 법적 책임과 회복 의미를 함께 드러냅니다.
  alternative_readings:
  - ‘되찾다’로 더 일반화하기
  - ‘속량하다’로 종교적 어휘화하기
  rationale: 이 절은 단순한 상거래가 아니라 가족 내 구속권 행사에 관한 말이므로, 한국어 성경 전통에서도 의미 범위를 가장 잘 유지하는 ‘무르다’를 택했습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: 히브리어 3인칭 형태 ‘if he will not redeem’의 처리
  chosen_reading: 문맥상 한국어에서는 ‘무르지 않으려거든’으로 자연스럽게 처리했습니다.
  alternative_readings:
  - ‘그가 무르지 않거든’
  - ‘당신이 무르지 않거든’
  rationale: 본문의 자음형은 3인칭처럼 보이지만 문맥상 2인칭 흐름과 충돌하지 않도록, 영어 POB의 주석 취지를 반영해 매끄럽게 옮겼습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
