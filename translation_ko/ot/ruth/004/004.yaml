  rationale: 히브리어 관용구 ‘귀를 드러내다’의 의미를 살려, 현대 한국어에서는 자연스러운 ‘알려 드리다’로 옮겼습니다.
- source_word: קְנֵה
  english_pob_choice: Buy it
  chosen_korean: 그것을 사십시오
