revisions:
- from: 그러므로 제가 당신께 알려 드리려고 했습니다. 곧, 여기 앉아 있는 사람들과 내 백성의 장로들 앞에서 그것을 사십시오. 당신이 그것을 무르려면 무르십시오. 그러나 무르지 않으려거든 저에게 말해 주십시오. 그래야 제가 알겠습니다. 당신 외에는 그것을 무를 사람이 없고, 저는 당신 다음이기 때문입니다.” 그가 말했습니다. “제가 무르겠습니다.”[a][b]
  to: 그래서 저는 당신께 알려 드려야겠다고 생각했습니다[a]. ‘여기 앉아 있는 사람들과 내 백성의 장로들 앞에서 그것을 사십시오. 당신이 그것을 무르려면 무르십시오. 그러나 그가 무르지 않으면[b] 저에게 말해 주십시오. 제가 알 수 있도록 말입니다. 그것을 무를 사람은 당신 외에는 없고, 저는 당신 다음이기 때문입니다.’ 그러자 그가 말했습니다. ‘제가 무르겠습니다.’
  rationale: 마소라 본문의 3인칭 형태를 본문과 각주에 명시적으로 보존했습니다. 직접 화법의 인용부호를 바로잡고, 각주를 해당 어구에 각각 연결했습니다. 그 밖에는 ‘무르다’라는 핵심 법적 용어와 공개 증인 및 우선순위의 의미를 유지하면서 현대 한국어 합쇼체로 다듬었습니다.
