    reason: lexical_alternative
translation:
  language: ko
  text: 이전에는 이스라엘에서 속량과 교환에 관한 관례가 이러하였습니다[a]. 곧 어떤 일을 확정하려면 사람이 자기 신발을 벗어 이웃에게 주었고[b], 이것이 이스라엘의 증거였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전 시대에는’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 거래를 확정하려면’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘의 증언이었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  english_pob_choice: formerly
  chosen_korean: 이전에는
  alternatives_korean:
  - 예전에는
  - 옛날에는
  - 한때는
  lexicon: HALOT
  rationale: לְפָנִים은 앞선 시대의 관례를 가리키므로, 현대 한국어에서는 ‘이전에는’이 가장 자연스럽고 문맥의 시간표시를 분명하게 전달합니다.
- source_word: הַגְּאוּלָּה וְעַל הַתְּמוּרָה
  english_pob_choice: redemption and exchange
  chosen_korean: 속량과 교환
  alternatives_korean:
  - 구속과 교환
  - 속량과 교환관계
  - 되사기와 교환
  lexicon: HALOT
  rationale: גְּאוּלָּה는 친족법 맥락의 ‘속량’이 적절하고, תְּמוּרָה는 단순한 ‘교환’이 가장 무리 없이 대응되므로 두 법적 개념을 함께 살렸습니다.
- source_word: לְקַיֵּם כָּל דָּבָר
  english_pob_choice: to confirm any matter
  chosen_korean: 어떤 일을 확정하려면
  alternatives_korean:
  - 모든 일을 확정하려면
  - 어떤 거래를 확정하려면
  - 어떤 일을 पुष्टि하려면
  lexicon: HALOT
  rationale: לְקַיֵּם은 ‘확정하다/확립하다’의 뜻이어서, 법적 관례의 목적을 드러내는 ‘어떤 일을 확정하려면’이 가장 간결하고 자연스럽습니다.
- source_word: שָׁלַף נַעֲלוֹ וְנָתַן לְרֵעֵהוּ
  english_pob_choice: a man removed his sandal and gave it to his neighbor
  chosen_korean: 사람이 자기 신발을 벗어 이웃에게 주었고
  alternatives_korean:
  - 사람이 자기 샌들을 벗어 이웃에게 주었고
  - 사람이 자기 신을 벗어 상대에게 주었고
  - 사람이 자기 신발을 벗어 다른 사람에게 주었고
  lexicon: HALOT
  rationale: שָׁלַף는 여기서 ‘벗다/벗어 내다’의 구체적 동작으로 이해되며, נַעַל은 문화적으로 ‘신발’보다 ‘샌들’도 가능하지만 한국어에서는 본문의 법적 관례를 자연스럽게 전달하는 ‘신발’이 더 읽기 쉽습니다.
- source_word: הַתְּעוּדָה
  english_pob_choice: the attestation
  chosen_korean: 증거
  alternatives_korean:
  - 증언
  - 증서
  - 증거물
  lexicon: HALOT
  rationale: תְּעוּדָה는 거래를 공적으로 입증하는 표지이므로, 한국어에서는 ‘증거’가 법적·증빙적 기능을 가장 간명하게 드러냅니다.
theological_decisions:
- issue: 고대 이스라엘의 관례 설명을 현대 독자에게 어떤 어조로 전달할지
  chosen_reading: 직설적 설명문으로 옮겨, 본문의 관습적·법적 성격이 분명히 드러나게 했습니다.
  alternative_readings:
  - 보다 서술적으로 풀어 쓰는 방식
  - 전통 교회어로 관습을 완곡하게 표현하는 방식
  rationale: 이 절은 서사 속 법적 주석이므로, 해설적이되 과도하게 풀지 않고 관례 자체의 객관성을 살리는 것이 원문의 의도에 부합합니다.
  doctrine_reference: 본문 맥락상 교리 쟁점은 없으며, 번역상의 서술 방식만 조정했습니다.
