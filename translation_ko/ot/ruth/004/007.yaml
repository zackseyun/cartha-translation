  text: וְ/זֹאת֩ לְ/פָנִ֨ים בְּ/יִשְׂרָאֵ֜ל עַל הַ/גְּאוּלָּ֤ה וְ/עַל הַ/תְּמוּרָה֙ לְ/קַיֵּ֣ם כָּל דָּבָ֔ר שָׁלַ֥ף אִ֛ישׁ נַעֲל֖/וֹ וְ/נָתַ֣ן לְ/רֵעֵ֑/הוּ וְ/זֹ֥את הַ/תְּעוּדָ֖ה בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'Now this was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
  footnotes:
  - marker: a
    text: Or 'in former times.'
