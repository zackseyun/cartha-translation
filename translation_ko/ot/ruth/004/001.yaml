id: RUT.4.1
reference: Ruth 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Now Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Peloni Almoni,'' an idiom meaning something like ''so-and-so'' or ''such-and-such one,'' deliberately leaving the man''s name unstated.'
    reason: lexical_alternative
  - marker: b
    text: The town gate functioned as a public place for legal and civic proceedings.
    reason: cultural_note
translation:
  language: ko
  text: 보아스가 성문에 올라가 거기 앉아 있었습니다[a]. 그런데 보아스가 말한 그 기업 무를 자가 지나가고 있었습니다. 그래서 그가 말했습니다. "이리로 비켜 앉으십시오, 아무개씨[b]." 그러자 그가 비켜 와서 앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 'פְּלֹנִי אַלְמֹנִי'는 이름을 의도적으로 밝히지 않는 관용구로, 영어 POB의 'so-and-so'와 같은 익명화 표현입니다.
    reason: source_note
  - marker: b
    text: 성문은 고대 이스라엘에서 공적 거래와 법적 절차가 이루어지던 장소였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  english_pob_choice: had gone up to the gate
  chosen_korean: 성문에 올라가
  alternatives_korean:
  - 성문으로 올라가
  - 문으로 올라가
  lexicon: HALOT
  rationale: עָלָה의 '올라가다'와 העיר gate의 지형·공적 공간 뉘앙스를 살려 직역하되, 한국어에서는 자연스럽게 '성문에 올라가'로 옮겼습니다.
- source_word: הַגֹּאֵל
  english_pob_choice: the kinsman-redeemer
  chosen_korean: 그 기업 무를 자
  alternatives_korean:
  - 그 구속자
  - 그 친족 구속자
  - 그 기업 무르는 자
  lexicon: HALOT
  rationale: 룻기에서 גֹּאֵל은 단순한 '구속자'가 아니라 친족의 법적 책임을 지닌 자이므로, 전통적 교회어를 피하고 기능을 드러내는 '기업 무를 자'를 택했습니다.
- source_word: פְּלֹנִי אַלְמֹנִי
  english_pob_choice: so-and-so
  chosen_korean: 아무개씨
  alternatives_korean:
  - 아무개
  - 누구누구
  - 무명씨
  lexicon: HALOT
  rationale: 히브리어의 의도적 익명화 표현을 한국어의 익숙한 호칭형으로 살려, 이름을 밝히지 않으면서도 직접 부르는 말투를 유지했습니다.
- source_word: סוּרָה / וַיָּסַר
  english_pob_choice: Turn aside / he turned aside
  chosen_korean: 비켜 앉으십시오 / 비켜 와서
  alternatives_korean:
  - 돌이키십시오 / 돌이켜
  - 잠깐 오십시오 / 와서
  lexicon: HALOT
  rationale: סור의 '옆으로 비키다, 방향을 틀다'와 이어지는 응답 동사를 살려, 같은 어근의 반복성과 장면의 구체성을 한국어에서 자연스럽게 반영했습니다.
theological_decisions:
- issue: 가ֹּאֵל의 번역에서 친족성과 법적 기능을 어떻게 드러낼지
  chosen_reading: '''기업 무를 자''로 번역해 친족-구속 책임을 함께 드러냈습니다.'
  alternative_readings:
  - '''구속자'''
  - '''친족 구속자'''
  rationale: 룻기의 서술 맥락에서는 추상적 '구속자'보다 친족 관계와 상속 회복의 법적 책임이 핵심이므로, 그 의미를 한국어 관용구로 압축해 표현했습니다.
  doctrine_reference: 룻 4장 친족 구속 제도
- issue: 성문 장면의 사회적 기능을 본문에 얼마나 드러낼지
  chosen_reading: 본문은 간결하게 유지하고, 공적·법적 기능은 번역어 선택으로만 반영했습니다.
  alternative_readings:
  - '''성문(법정)으로 올라가'''
  - 각주로 제도 설명 추가
  rationale: 히브리어 본문은 성문에서의 공적 만남을 자연스럽게 전제하므로, 설명을 과잉 삽입하지 않고 장면의 진행을 살리는 쪽을 택했습니다.
  doctrine_reference: 고대 이스라엘의 성문 재판·거래 관행
