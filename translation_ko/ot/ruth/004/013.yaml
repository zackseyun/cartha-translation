  to: 보아스가 룻을 맞아 아내로 삼았습니다. 그가 룻과 동침하니, 야훼께서 룻에게 잉태를 주셨고[a] 룻이 아들을 낳았습니다.
  rationale: ‘동침하니’로 히브리어의 성적 결합 완곡법이 가리키는 의미를 현대 한국어의 절제된 문어체로 명확히 했습니다. 또한 ‘잉태를 주셨고’는 וַיִּתֵּן ... הֵרָיוֹן의 직역적 구조와 야훼의 행위 주체를 보존합니다. 각주는 자연스러운 의역 대안을 제시하도록 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:24:11Z'
