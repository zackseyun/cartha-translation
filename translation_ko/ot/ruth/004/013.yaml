  source_fidelity: 히브리어의 혼인, 성적 결합, 야훼의 잉태 부여, 아들의 출생이라는 순서와 신적 행위 주체는 대체로 충실히 반영되었습니다. 다만 ‘그녀에게 들어갔고’는 히브리어 완곡법을 기계적으로 옮긴 표현으로 현대 표준 한국어에서는 부자연스럽고 의미가 불명확합니다.
