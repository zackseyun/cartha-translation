id: RUT.4.13
reference: Ruth 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח בֹּ֤עַז אֶת רוּת֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/יָּבֹ֖א אֵלֶ֑י/הָ וַ/יִּתֵּ֨ן יְהוָ֥ה לָ֛/הּ הֵרָי֖וֹן וַ/תֵּ֥לֶד בֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
  footnotes:
  - marker: a
    text: Or, 'the LORD gave her conception' or 'the LORD enabled her to conceive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보아스가 룻을 맞아 아내로 삼았습니다. 그가 룻과 동침하니, 야훼께서 룻에게 잉태를 주셨고[a] 룻이 아들을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 룻이 임신하게 하셨고’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 맞이하여
  alternatives_korean:
  - 데려가
  - 취하여
  - 아내로 삼아
  lexicon: HALOT
  rationale: 히브리어 לקח의 기본 의미인 ‘취하다/데려가다’를 살리되, 결혼 문맥에서 자연스럽게 읽히도록 ‘맞이하여’로 옮겼습니다. 뒤의 ‘아내로 삼았습니다’가 혼인 관계를 분명히 하므로 과도한 중복을 피했습니다.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  english_pob_choice: she became his wife
  chosen_korean: 아내로 삼았습니다
  alternatives_korean:
  - 그의 아내가 되었습니다
  - 그의 아내가 되었습니다
  lexicon: HALOT
  rationale: 혼인 상태의 성립을 나타내는 관용구이므로, 한국어에서 가장 자연스럽고 법적·서사적 의미를 드러내는 표현으로 옮겼습니다.
- source_word: וַיָּבֹא אֵלֶיהָ
  english_pob_choice: He went in to her
  chosen_korean: 그가 그녀에게 들어갔고
  alternatives_korean:
  - 그녀와 동침했고
  - 그녀와 관계했고
  - 그녀에게 왔고
  lexicon: HALOT
  rationale: 성적 결합을 가리키는 완곡 표현을 유지하기 위해 직설적이되 절제된 표현으로 옮겼습니다. 너무 노골적인 번역보다 히브리어의 문체를 더 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 여호와 대체표현이 아니라 하나님의 고유명사이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  english_pob_choice: the LORD granted her conception
  chosen_korean: 야훼께서 그녀가 임신하도록 하셨으며
  alternatives_korean:
  - 야훼께서 그녀에게 잉태를 주셨으며
  - 야훼께서 그녀의 임신을 허락하셨으며
  - 야훼께서 그녀를 임신하게 하셨으며
  lexicon: HALOT
  rationale: הֵרָיוֹן은 ‘임신/잉태’의 결과를 가리키므로, 하나님의 주권적 개입을 드러내면서도 한국어에서 자연스러운 서술로 옮겼습니다. POB의 ‘granted her conception’이 지닌 원인-결과를 유지합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명사 טetragrammaton을 고유명사로 보존하여, 하나님의 언약적 이름을 제목화하지 않고 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 룻의 임신에 대한 신적 주권
  chosen_reading: 야훼께서 그녀가 임신하도록 하셨으며
  alternative_readings:
  - 야훼께서 그녀에게 잉태를 주셨으며
  - 야훼께서 그녀를 임신하게 하셨으며
  rationale: 본문은 출산을 우연이나 인간 행위가 아니라 야훼의 직접적 선물로 제시합니다. 번역은 이 신적 행위를 약화시키지 않으면서도 과도한 설명을 덧붙이지 않습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
