base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
  footnotes:
  - marker: a
    text: Or 'do valiantly' or 'show worth'; the Hebrew expression can denote valor, strength, wealth, or prosperous success.
    reason: lexical_alternative
translation:
  language: ko
  text: 성문에 있던 모든 백성과 장로들이 말했습니다. 「우리는 증인입니다. 야훼께서 당신의 집으로 들어오는 이 여인을 라헬과 레아처럼 되게 하시기를 바랍니다. 이 두 여인이 함께 이스라엘의 집을 세웠습니다. 또한 당신이 에브라다에서 큰일을 이루고 베들레헴에서 이름을 선포하시기를 바랍니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰일을 이루고’는 히브리어 חיל의 넓은 의미(능력, 번영, 용맹, 성취)를 문맥에 따라 압축한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름을 선포하다’는 קרא שֵׁם의 직역에 가깝지만, 관용적으로는 ‘명성을 얻다’의 뜻도 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  english_pob_choice: We are witnesses
  chosen_korean: 우리는 증인입니다
  alternatives_korean:
  - 증인입니다
  - 우리가 증인입니다
  lexicon: HALOT
  rationale: 직접 화법에서 히브리어 명사문을 한국어로 자연스럽게 옮기되, 증언 선언의 공적 성격을 살리기 위해 ‘증인입니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신적 이름을 존칭 대체어로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
- source_word: וַעֲשֵׂה חַיִל
  english_pob_choice: may you prosper
  chosen_korean: 당신이 큰일을 이루고
  alternatives_korean:
  - 당신이 번성하고
  - 당신이 용맹을 떨치고
  - 당신이 성공하고
  lexicon: HALOT
  rationale: חיל은 문맥에 따라 능력, 번성, 용맹, 성취를 아우르므로, 이 축복문에서는 결과적 번영과 유능함을 함께 담는 ‘큰일을 이루고’로 옮겼습니다.
- source_word: וּקְרָא שֵׁם
  english_pob_choice: proclaim a name
  chosen_korean: 이름을 선포하시기를 바랍니다
  alternatives_korean:
  - 이름을 부르시기를 바랍니다
  - 이름을 드러내시기를 바랍니다
  - 이름을 알리시기를 바랍니다
  lexicon: HALOT
  rationale: קרא שֵׁם의 직설적 의미를 살리기 위해 ‘이름을 선포하다’를 택했고, 명성 획득의 관용적 의미도 문맥상 유지됩니다.
theological_decisions:
- issue: 야훼라는 하나님의 이름을 어떻게 처리할지
  chosen_reading: 고유명사 ‘야훼’로 직역하여 공적 축복 선언의 주체를 분명히 했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 일반적 ‘주’가 아니라 יְהוָה를 사용하므로, 신적 호칭으로 약화시키지 않고 고유 이름을 보존하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
