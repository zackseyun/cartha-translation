  source_fidelity: 본문 마지막 절의 히브리어 계보 표현은 ‘그는 이새의 아버지, 다윗의 아버지’로, 오벳과 이새 및 이새와 다윗의 두 부자 관계를 차례로 진술합니다. 초안의 ‘다윗의 할아버지’는 사실관계상 맞지만 원문의 반복된 ‘아버지’ 표현을 다른 친족 관계로 바꾸므로 수정이 필요합니다. 또한 각주는 앞선 ‘나오미에게 아들이 태어났습니다’에 관한 것이므로 해당 인용문에 붙여야 합니다.
