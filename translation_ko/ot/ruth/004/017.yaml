  - “나오미에게 아들이 태어났습니다.”
  lexicon: HALOT
  rationale: 수동형과 ל 전치사의 의미를 살려 ‘나오미에게’라는 수혜/귀속 의미를 보존했습니다. 생물학적 모성으로 단정하지 않도록 ‘태어났습니다’로 옮겼습니다.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  english_pob_choice: And they named him Obed
  chosen_korean: 그들은 그를 오벳이라 이름 지었습니다.
  alternatives_korean:
