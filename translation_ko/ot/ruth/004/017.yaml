  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
  footnotes:
  - marker: a
    text: Literally, 'A son has been born to Naomi.' The women speak of Naomi's restored family line through Ruth's child, not of Naomi as the biological mother.
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃 여자들이 그에게 이름을 지어 주면서 말했습니다. “나오미에게 아들이 태어났습니다.”[a] 그들은 그를 오벳이라 이름 지었습니다. 그는 이새의 아버지였고, 이새는 다윗의 아버지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “나오미에게 아들이 태어났습니다”입니다. 이 말은 나오미가 생물학적 어머니라는 뜻이 아니라, 룻의 아이를 통해 나오미의 가문이 회복되었다는 마을 여자들의 선언입니다.
    reason: alternative_reading
