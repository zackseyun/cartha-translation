theological_decisions:
- issue: “나오미에게 아들이 태어났습니다”의 의미 범위
  chosen_reading: 생물학적 출산으로 좁히지 않고, 마을 여성들의 관점에서 나온 가족 회복의 선언으로 유지했습니다.
  alternative_readings:
  - “나오미에게 손자가 태어났습니다”
  - “나오미가 아들을 얻었습니다”
  rationale: 히브리어와 영어 POB 모두 나오미의 복권과 가문 회복을 말하는 공동체적 선언을 보존합니다. ‘손자’로 풀면 문학적 긴장과 간접 화법이 약화됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
