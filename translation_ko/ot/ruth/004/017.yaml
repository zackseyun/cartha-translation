  rationale: 히브리어의 관용구를 현대 한국어로 자연스럽게 풀면서, לוֹ가 나타내는 ‘그에게’의 방향성을 유지했습니다.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  english_pob_choice: A son has been born to Naomi
  chosen_korean: “나오미에게 아들이 태어났습니다.”
