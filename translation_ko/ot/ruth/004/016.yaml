source:
  edition: WLC
  text: וַ/תִּקַּ֨ח נָעֳמִ֤י אֶת הַ/יֶּ֨לֶד֙ וַ/תְּשִׁתֵ֣/הוּ בְ/חֵיקָ֔/הּ וַ/תְּהִי ל֖/וֹ לְ/אֹמֶֽנֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/016.yaml
  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
  footnotes:
  - marker: a
    text: Or 'foster mother' or 'caretaker'; the Hebrew term refers to a woman who nurses, raises, or cares for a child, not a medical nurse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나오미가 그 아이를 받아 자기 품에 안고, 그 아이의 양육자가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유모’, ‘양육어머니’, ‘돌보는 사람’. 히브리어는 의료진이 아니라 아이를 먹이고 기르고 돌보는 여성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  english_pob_choice: took
  chosen_korean: 받아
  alternatives_korean:
  - 데려가
  - 취하여
  lexicon: HALOT
  rationale: 서술의 첫 동작을 자연스럽게 살리되, 아이를 손에 넣어 품에 두는 흐름을 한국어로 압축해 나타내기 위해 ‘받아’를 택했습니다.
- source_word: הַיֶּלֶד
  english_pob_choice: the child
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 어린아이
  - 그 아기
  lexicon: HALOT
  rationale: 문맥상 갓난아이에 가깝지만, 원문의 일반적 명사 의미를 과도하게 좁히지 않기 위해 ‘그 아이’로 옮겼습니다.
- source_word: בְחֵיקָהּ
  english_pob_choice: in her lap
  chosen_korean: 자기 품에
  alternatives_korean:
  - 무릎에
  - 가슴에
  lexicon: HALOT
  rationale: 히브리어 חֵיק의 신체적 이미지를 살리면서도 현대 한국어에서 자연스럽고 따뜻하게 들리는 표현으로 ‘자기 품에’를 선택했습니다.
- source_word: לְאֹמֶנֶת
  english_pob_choice: nurse
  chosen_korean: 양육자
  alternatives_korean:
  - 유모
  - 돌봄이
  - 보호자
  lexicon: HALOT
  rationale: 원어는 의학적 ‘간호사’가 아니라 아이를 키우고 돌보는 사람을 가리키므로, 그 기능을 가장 직접적으로 드러내는 ‘양육자’를 택했습니다.
theological_decisions:
- issue: אֹמֶנֶת의 직역 여부와 현대 오해 가능성
  chosen_reading: ‘양육자’로 풀어, 나오미가 단순한 간호인이 아니라 아이를 돌보고 키우는 역할을 맡았음을 드러냈습니다.
  alternative_readings:
  - ‘유모’로 옮기기
  - ‘돌봄이’로 완화하기
  rationale: 문맥은 의료 행위가 아니라 양육 관계이므로, 현대 독자가 ‘간호’로 오해하지 않도록 기능 중심으로 번역했습니다.
  doctrine_reference: 서사 본문 해석—어휘 의미와 문맥 우선
