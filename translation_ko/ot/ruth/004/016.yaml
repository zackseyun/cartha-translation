  source_fidelity: ‘받아’는 וַתִּקַּח(‘잡아/데려다가 두다’)보다 ‘받다/수령하다’의 뜻으로 읽히기 쉬워, 나오미가 아이를 직접 취하여 품에 두는 동작을 충분히 반영하지 못합니다. 또한 ‘안고’는 자연스럽지만, וַתְּשִׁתֵהוּ의 ‘두다/놓다’라는 동작을 다소 흡수합니다.
  naturalness: ‘그 아이를 데려다가 자기 품에 안고’는 현대 표준 한국어의 합쇼체 서사에서 자연스럽고, 아이를 품에 두는 장면을 분명하게 전달합니다.
  terminology: ‘양육자’는 אֹמֶנֶת의 돌봄·양육 의미를 적절히 전달합니다. 다만 원어가 여성형이며 ‘유모/양육어머니’의 뉘앙스도 가능하므로 각주에서 이를 밝혀 두는 것이 좋습니다. ‘의료진’은 이 맥락에서 다소 부자연스러우므로 ‘의료 간호사’로 구체화합니다.
  issues:
