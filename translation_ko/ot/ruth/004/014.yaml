  edition: WLC
  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
  footnotes:
  - marker: a
    text: Or 'kinsman-redeemer' or 'guardian-redeemer,' highlighting the family-legal role of a close relative who acts to restore and protect a family line.
    reason: lexical_alternative
  - marker: b
    text: The 'redeemer' may refer specifically to the newborn child as Naomi's restorer, though some understand it more broadly in light of Boaz's role as redeemer in the chapter.
    reason: alternative_reading
  - marker: c
    text: Hebrew literally, 'may his name be called in Israel'; the expression means that his name will be known, invoked, or honored among Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 여자들이 나오미에게 말했습니다. 「야훼께서 오늘 당신에게 구원자를 남겨 두지 않으신 분은 복되십니다[a][b]. 그의 이름이 이스라엘에서 널리 알려지게 되기를 바랍니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원자’는 여기서 가까운 친족이 가족의 존속과 회복을 위해 행동하는 법적·가족적 역할을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 ‘구원자’는 문맥상 갓 태어난 아이를 가리킬 수도 있고, 장 전체의 흐름에서는 보아스의 구속 행위를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 ‘이스라엘에서 그의 이름이 불리게 하라’는 뜻이며, 여기서는 그 이름이 알려지고 존중받게 된다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה הַנָּשִׁים
  english_pob_choice: Then the women said
  chosen_korean: 그러자 여자들이 말했습니다
