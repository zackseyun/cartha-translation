  rationale: 서사 전개를 나타내는 wayyiqtol과 복수 주어를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼께서 … 복되십니다
