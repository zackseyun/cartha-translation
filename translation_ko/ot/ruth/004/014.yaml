  - 야훼는 복되십니다
  lexicon: HALOT
  rationale: 히브리어 축복 공식을 살리면서, 본 프로젝트 기본값에 따라 여호와 대신 야훼를 사용했습니다.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ גֹּאֵל
  english_pob_choice: who has not left you without a redeemer
  chosen_korean: 당신에게 구원자를 남겨 두지 않으신
  alternatives_korean:
  - 당신에게 구속자를 끊지 않으신
  - 당신에게 친족-구속자를 끊지 않으신
  lexicon: HALOT
  rationale: הִשְׁבִּית의 ‘없애다/그치게 하다’ 의미를 문맥상 ‘남겨 두지 않다’로 자연스럽게 풀었고, גֹּאֵל은 본문 주석 가능성을 살려 기본어인 ‘구원자’로 옮겼습니다.
- source_word: וְיִקָּרֵא שְׁמוֹ בְּיִשְׂרָאֵל
  english_pob_choice: and may his name be renowned in Israel
  chosen_korean: 그의 이름이 이스라엘에서 널리 알려지게 되기를 바랍니다
  alternatives_korean:
  - 그의 이름이 이스라엘에서 불리게 되기를 바랍니다
  - 그의 이름이 이스라엘에서 유명해지기를 바랍니다
  lexicon: HALOT
  rationale: ‘이름이 불리다’의 직역보다, 이름이 알려지고 존중받는다는 관용적 의미를 살려 공적 명성을 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: גֹּאֵל의 지시 대상
  chosen_reading: 본문의 모호성을 유지하여, 구원자가 태어난 아이인지 혹은 보아스를 통한 구속의 열매인지 본문만으로는 단정하지 않았습니다.
  alternative_readings:
  - 구원자는 갓 태어난 아이를 가리킵니다.
  - 구원자는 보아스를 가리킵니다.
  rationale: 영어 POB의 주해처럼 가까운 문맥은 아이를, 책 전체의 법적-속량 맥락은 보아스를 함께 떠올리게 하므로, 본문이 허용하는 긴장을 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
