  - 베레스 / 헷스론
  lexicon: standard proper-name transliteration
  rationale: 히브리어 인명은 현대 한국어 음역 관행에 따라 베레스, 헤스론으로 옮겼습니다.
theological_decisions:
- issue: 족보 서문의 문체 처리
  chosen_reading: 서술문처럼 읽히되, 족보 공식의 반복성을 살려 간결한 선언형으로 유지했습니다.
  alternative_readings:
  - 좀 더 설명적인 번역으로 풀어쓰기
  - 더 전통적인 ‘이것들은…’ 식의 직역
  rationale: 본문은 신학적 논평보다 족보 표제를 제시하는 공식문이므로, 의미를 과장하지 않고 관습적 구조를 유지하는 것이 적절합니다.
  doctrine_reference: 성경 족보의 역사성 및 계보 표지의 문학 기능
