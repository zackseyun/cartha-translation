  lexicon: HALOT
  rationale: 족보 공식에서의 ילד 히필을 자연스러운 한국어 인과 표현인 ‘낳았습니다’로 옮겨, 출생 관계를 간결하게 드러냈습니다.
- source_word: פָּרֶץ / חֶצְרוֹן
