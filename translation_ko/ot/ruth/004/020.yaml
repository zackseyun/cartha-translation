    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּינָדָב
  english_pob_choice: Amminadab
  chosen_korean: 아므미나답
  alternatives_korean:
  - 암미나답
  - 아미나답
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 한국어 음역으로 옮기되, 영어 POB의 Amminadab에 대응하도록 표준적인 음가를 반영했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 הוֹלִיד는 단순 출생이 아니라 부계 계보를 표시하므로, 한국어에서는 자연스럽고 간결한 ‘낳았습니다’로 옮겼습니다.
- source_word: נַחְשׁוֹן
  english_pob_choice: Nahshon
  chosen_korean: 나흔
  alternatives_korean:
  - 나숀
  - 나흐손
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사 나흐쇼ן 계열을 한국어 음역으로 옮겼고, 한국어 발음상 자연스러운 형태를 택했습니다.
- source_word: שַׂלְמָה
  english_pob_choice: Salmah
  chosen_korean: 살마
  alternatives_korean:
  - 살몬
  lexicon: 고유명사 음역
  rationale: 본문 히브리어는 שַׂלְמָה이므로 영어 전승형 Salmon보다 본문 직접형 Salmah를 따라 ‘살마’로 옮겼습니다.
theological_decisions:
- issue: 족보 동사의 반복 표현
  chosen_reading: ‘낳았습니다’를 반복해 계보의 직선적 연결을 드러냈습니다.
  alternative_readings:
  - ‘아들을 두었습니다’
  - ‘~의 아버지가 되었습니다’
  rationale: 이 절은 서사보다 족보를 제시하므로, 두 번의 הוֹלִיד를 동일하게 처리해 계보 흐름을 분명히 했습니다.
  doctrine_reference: 족보 문맥의 문법-서사 기능
