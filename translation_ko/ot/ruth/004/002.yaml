  lexicon: HALOT
  rationale: מן의 분리·선발 의미를 살려 ‘가운데서’로 옮기고, זקני העיר는 지명보다는 공적 지도층을 가리키는 관용구이므로 ‘장로들’로 옮겼습니다.
