base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/002.yaml
  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
  footnotes:
  - marker: a
    text: Or “he selected ten men from the elders of the city.” The Hebrew verb can imply taking for a purpose, here likely selecting witnesses for the legal proceeding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 성읍의 장로들 가운데서 열 명의 남자를 데려와 말했습니다. 「여기에 앉으십시오」. 그들이 앉았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 성읍의 장로들 가운데서 열 명의 남자들을 선발했습니다.’ 히브리어 동사는 목적을 위한 ‘취하다’의 뜻을 띨 수 있으며, 여기서는 법적 절차를 위한 증인 선발을 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: he took
  chosen_korean: 데려와
  alternatives_korean:
  - 데려갔습니다
  - 가져갔습니다
  - 선택했습니다
  lexicon: HALOT
  rationale: 문맥상 보아스가 법적 절차를 위한 증인들을 목적을 가지고 불러 모은 것이므로, 단순한 물리적 ‘취하다’보다 ‘데려오다’가 자연스럽고 원문 의도를 잘 드러냅니다.
- source_word: עֲשָׂרָה אֲנָשִׁים
  english_pob_choice: ten men
  chosen_korean: 열 명의 남자
  alternatives_korean:
  - 열 사람
  - 열 명의 사람들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형으로 공적 법정 상황의 성인 남성을 가리키므로, 성별이 드러나는 ‘남자’가 원문에 더 가깝습니다.
- source_word: מִזִּקְנֵי הָעִיר
  english_pob_choice: from the elders of the city
  chosen_korean: 성읍의 장로들 가운데서
  alternatives_korean:
  - 성읍의 장로들 중에서
  - 도시의 장로들 가운데서
  lexicon: HALOT
  rationale: מן의 분리·선발 의미를 살려 ‘가운데서’로 옮기고, זקני העיר는 지명보다는 공적 지도층을 가리키는 관용구이므로 ‘장로들’로 옮겼습니다.
- source_word: שְׁבוּ פֹה
  english_pob_choice: Sit here
  chosen_korean: 여기에 앉으십시오
  alternatives_korean:
  - 여기에 앉으세요
  - 여기에 앉으시오
  lexicon: HALOT
  rationale: 직접 명령이지만 합쇼체가 요구되므로 ‘앉으십시오’로 옮겨 공손성과 명령성을 함께 보존했습니다.
theological_decisions:
- issue: 보아스의 말투를 한국어에서 어떻게 구현할지
  chosen_reading: 직접 화법의 명령을 합쇼체로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화하여 ‘여기에 앉으세요’로 처리
  - 권위적 느낌을 살려 ‘여기에 앉으시오’로 처리
  rationale: 본문은 법적 절차를 진행하는 장면이지만, 현대 한국어 성경의 합쇼체를 유지하면서도 명령의 기능을 분명하게 드러내는 것이 가장 균형적입니다.
  doctrine_reference: 문체·담화 수준의 번역 원칙
