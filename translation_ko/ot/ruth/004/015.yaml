revisions:
- from: 그리고 그는 당신에게 생명을 회복시켜 주는 이가 되고, 당신의 늙은 나이를 부양하는 이가 될 것입니다[a]. 이는 당신을 사랑하는 당신의 며느리가 그를 낳았기[b] 때문입니다. 그는 당신에게 일곱 아들보다 더 좋은 사람입니다[c].
  to: 그 아이는 당신에게 생명을 되찾게 해 주고[a] 당신의 노년을 돌보아 줄 것입니다[b]. 당신을 사랑하는 당신의 며느리가 그를 낳았기 때문입니다. 그녀는 당신에게 일곱 아들보다 더 낫습니다[c].
  rationale: 히브리어의 지시 관계를 보존하기 위해 아이의 유익을 말하는 첫 절과 며느리 루스의 가치를 비교하는 마지막 절을 분명히 구별했습니다. 아울러 각주 앵커를 해당 어휘에 맞게 바로잡고, 현대 표준어 합쇼체에 맞게 표현을 다듬었습니다.
