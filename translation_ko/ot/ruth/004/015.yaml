id: RUT.4.15
reference: Ruth 4:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
  footnotes:
  - marker: a
    text: Or 'a restorer of your life'; Hebrew 'restorer of life/soul.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your old age,' literally 'your gray hair.'
    reason: lexical_alternative
  - marker: c
    text: '''Seven sons'' uses a number that often signifies fullness or completeness; the point is that Ruth is worth more to Naomi than the idealized blessing of many sons.'
    reason: cultural_note
translation:
  language: ko
  text: 그 아이는 당신에게 생명을 되찾게 해 주고[a] 당신의 노년을 돌보아 줄 것입니다[b]. 당신을 사랑하는 당신의 며느리가 그를 낳았기 때문입니다. 그녀는 당신에게 일곱 아들보다 더 낫습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생명을 회복시키는 이’로 옮길 수 있습니다. 히브리어는 직역하면 ‘생명/혼을 되돌리는 이’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘노년’은 직역하면 ‘백발’을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘일곱 아들’은 충만함과 완전함을 나타내는 수로, 루스가 이상적인 많은 아들보다 더 값진 존재라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And he will be
  chosen_korean: 그는 ... 될 것입니다
  alternatives_korean:
  - 그는 ... 되리라
  - 그는 ... 되겠습니다
  lexicon: HALOT
  rationale: 문맥상 축복의 미래 진술이므로 평서형 미래를 쓰되, 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  english_pob_choice: a restorer of life
  chosen_korean: 생명을 회복시켜 주는 이
  alternatives_korean:
  - 생명의 회복자
  - 생명을 되돌려 주는 이
  - 영혼을 회복시키는 이
  lexicon: HALOT
  rationale: נֶפֶשׁ를 추상적 ‘영혼’보다 구체적인 ‘생명’으로 살리고, מֵשִׁיב의 회복/되돌림 의미를 한국어 동사구로 자연스럽게 반영했습니다.
- source_word: וּלְכַלְכֵּל אֶת שֵׂיבָתֵךְ
  english_pob_choice: and a sustainer of your old age
  chosen_korean: 당신의 늙은 나이를 부양하는 이
  alternatives_korean:
  - 당신의 늙은 머리를 돌보는 이
  - 당신의 늙은 시절을 지탱하는 이
  - 당신의 백발을 부양하는 이
  lexicon: HALOT
  rationale: שֵׂיבָה의 문자적 ‘백발’보다 관용적 의미인 ‘늙은 나이’를 살렸고, כִלְכֵּל의 ‘지탱/부양/돌봄’ 중 문맥에 맞는 ‘부양’으로 유지했습니다.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  english_pob_choice: she who is better to you
  chosen_korean: 당신에게 더 좋은 사람입니다
  alternatives_korean:
  - 당신에게 더 유익한 사람입니다
  - 당신에게 더 낫습니다
  - 당신에게 더 좋은 분입니다
  lexicon: HALOT
  rationale: 비교급 טוֹבָה의 우열 관계를 분명히 하면서, 대상이 사람임을 드러내어 문맥의 평가를 살렸습니다.
- source_word: מִשִּׁבְעָה בָּנִים
  english_pob_choice: than seven sons
  chosen_korean: 일곱 아들보다
  alternatives_korean:
  - 일곱 자녀보다
  - 아들 일곱보다
  - 일곱 아들들보다
  lexicon: HALOT
  rationale: 본문의 성별 표지를 지우지 않고 ‘아들’을 유지해, 고대 문맥의 축복 표현을 그대로 드러냈습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 자기 자신
  rationale: 이 구절은 나오미의 미래와 양육에 관한 축복이므로, 인간 구성론보다 실제 삶의 회복을 가리키는 ‘생명’이 문맥에 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 일곱 아들의 비교 표현
  chosen_reading: 일곱 아들보다 더 좋은 사람
  alternative_readings:
  - 일곱 자녀보다 더 좋은 사람
  - 많은 자녀보다 더 좋은 사람
  rationale: 히브리어의 남성 복수 ‘아들들’을 완화하지 않고 유지해야, 당시 사회에서 아들의 상징적 가치가 본문의 수사로 드러납니다.
  doctrine_reference: Translation philosophy §4
