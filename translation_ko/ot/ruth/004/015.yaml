    rationale: a는 נֶפֶשׁ(생명)의 대안을, b는 שֵׂיבָה(노년/백발)의 설명을 다루므로 각각 해당 표현 뒤에 놓아야 합니다.
  - severity: low
    issue: ‘늙은 나이’라는 표현이 현대 한국어에서 어색함
    rationale: ‘노년’이 שֵׂיבָה의 관용적 의미를 더 자연스럽고 간결하게 전달합니다.
