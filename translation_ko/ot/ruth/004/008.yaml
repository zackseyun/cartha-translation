id: RUT.4.8
reference: Ruth 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/גֹּאֵ֛ל לְ/בֹ֖עַז קְנֵה לָ֑/ךְ וַ/יִּשְׁלֹ֖ף נַעֲלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
  footnotes:
  - marker: a
    text: Or “the kinsman-redeemer.” The Hebrew term refers to a near relative with legal responsibility to redeem family property or lineage.
    reason: lexical_alternative
  - marker: b
    text: Removing the sandal functioned as a customary legal sign in this transaction; compare Ruth 4:7.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 그 기업권자가 보아스에게 말했습니다. “그것을 당신을 위해 사십시오.” 그리고 그는 자신의 샌들을 벗었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “친족 기업자”. 히브리어 גֹּאֵל은 가족 재산이나 계보를 무를 법적 책임이 있는 가까운 친족을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 신발을 벗는 일은 이 거래에서 관습적인 법적 표지로 기능했습니다. 룻기 4:7을 보십시오.
    reason: cultural_note
lexical_decisions:
- source_word: הַגֹּאֵל
  english_pob_choice: the redeemer
  chosen_korean: 그 기업권자
  alternatives_korean:
  - 그 구속자
  - 그 친족 기업자
  - 그 구속 친족
  lexicon: HALOT
  rationale: 룻기의 גאל는 단순한 ‘구속자’보다 가족 재산과 계보를 보전할 법적 책임이 있는 친족을 가리키므로, 문맥 기능을 드러내는 ‘기업권자’로 옮겼습니다.
- source_word: קְנֵה
  english_pob_choice: Buy
  chosen_korean: 사십시오
  alternatives_korean:
  - 사라
  - 구입하십시오
  - 사들이십시오
  lexicon: HALOT
  rationale: 법적 거래 맥락에서 קנה의 명령형은 현대 한국어에서 가장 자연스럽고 직접적인 ‘사십시오’가 적절합니다.
- source_word: לָךְ
  english_pob_choice: for yourself
  chosen_korean: 당신을 위해
  alternatives_korean:
  - 당신 자신을 위해
  - 당신 몫으로
  - 당신에게
  lexicon: HALOT
  rationale: 여기서는 단순 수혜가 아니라 보아스가 그 매입을 자기 몫으로 떠맡는 뜻이므로, 반사적 뉘앙스를 살려 ‘당신을 위해’로 옮겼습니다.
- source_word: נַעֲלוֹ
  english_pob_choice: his sandal
  chosen_korean: 자신의 샌들
  alternatives_korean:
  - 자신의 신발
  - 자신의 샌달
  lexicon: HALOT
  rationale: 고대 근동의 신발을 가리키는 구체성을 살리기 위해 ‘샌들’을 유지했습니다.
theological_decisions:
- issue: גֹּאֵל의 호칭을 어떻게 처리할 것인가
  chosen_reading: 기능을 드러내는 법적 친족 호칭인 ‘기업권자’를 본문에 두었습니다.
  alternative_readings:
  - 구속자
  - 친족구속자
  - 기업 무를 자
  rationale: 룻기 본문에서 이 인물은 단순한 신학적 칭호보다 가족 기업을 무를 책임이 있는 친족이라는 법적 역할이 핵심이므로, 독자가 장면의 제도적 의미를 바로 이해하도록 했습니다.
  doctrine_reference: 룻기 4장 친족 기업 무를 제도
- issue: 샌들을 벗는 행위의 의미를 본문에 주석 없이 얼마나 드러낼 것인가
  chosen_reading: 행위 자체만 서술하고, 법적 표지는 본문 밖 주석으로 처리하지 않았습니다.
  alternative_readings:
  - 그는 법적 표지로 자기 샌들을 벗었습니다
  - 그리고 그는 거래의 표지로 샌들을 벗었습니다
  rationale: 히브리어는 단순히 벗었다고 말하며, 이 행위의 관습적 법적 의미는 문맥과 대조 구절에서 드러나므로 본문은 과잉해석하지 않았습니다.
  doctrine_reference: 룻기 4:7과의 관습적 절차
