  text: וְ/חֶצְרוֹן֙ הוֹלִ֣יד אֶת רָ֔ם וְ/רָ֖ם הוֹלִ֥יד אֶת עַמִּֽינָדָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/019.yaml
  text: Hezron fathered Ram, and Ram fathered Amminadab.
translation:
  language: ko
  text: 헤스론은 람을 낳았고, 람은 암미나답을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  english_pob_choice: Hezron
  chosen_korean: 헤스론
  alternatives_korean:
  - 헷스론
  - 헤즈론
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 옮겼으며, 영어 POB의 Hezron에 대응하는 표준적 음역으로 '헤스론'을 택했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  - 생산했습니다
  lexicon: HALOT
  rationale: 계보 문맥의 הוֹלִיד는 자녀를 '낳다/낳게 하다'의 계보적 의미를 가지므로, 현대 한국어에서 자연스럽고 남성 계보를 분명히 드러내는 '낳았습니다'로 옮겼습니다.
- source_word: עַמִּינָדָב
  english_pob_choice: Amminadab
  chosen_korean: 암미나답
  alternatives_korean:
  - 아미나답
  lexicon: HALOT
  rationale: 고유명사는 통용되는 성서 인명 음역을 따르되, 히브리어 표기의 이중 자음을 반영하여 '암미나답'으로 옮겼습니다.
theological_decisions:
- issue: 계보 서술의 반복 동사 표현
  chosen_reading: '''fathered''의 반복을 한국어에서도 동일하게 계보 동사로 유지하여, 단순한 출생 서술이 아니라 족보 전승의 연속성을 드러냈습니다.'
  alternative_readings:
  - '''아버지가 되었습니다''처럼 완곡하게 표현함'
  - 동사를 생략하고 '헤스론의 아들 람, 람의 아들 암미나답'으로 재구성함
  rationale: 이 절은 족보의 연쇄를 압축적으로 제시하므로, 원문의 동사 반복을 보존하는 편이 계보 구조와 남성 중심의 족보 화법을 더 분명히 드러냅니다.
  doctrine_reference: 성경 족보의 문학적·역사적 형식 보존
