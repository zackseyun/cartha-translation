source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
  footnotes:
  - marker: a
    text: Or, 'I have bought for myself.' The Hebrew verb can carry the sense of acquiring by purchase in a legal transaction.
    reason: lexical_alternative
  - marker: b
    text: That is, to preserve the deceased man's family line and legal standing in connection with his inherited property.
    reason: cultural_note
  - marker: c
    text: The 'gate' was the public place where legal matters were witnessed and settled.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 또한 모압 여인 룻, 말론의 아내를 저는 제 아내로 맞아, 죽은 이의 이름을 그의 유산 위에 다시 세워, 죽은 이의 이름이 그의 형제들 가운데와 그의 자리의 문에서 끊어지지 않게 하려 합니다. 오늘 여러분은 증인입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קנה는 ‘사다/얻다/취득하다’의 뜻을 가질 수 있으므로, 이곳의 동사는 법적 거래를 포함한 ‘획득’의 의미로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이름을 ‘다시 세운다’는 말은 죽은 자의 가문과 상속 지위를 이어 주는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: ‘문’은 고대 이스라엘에서 공적 재판과 계약이 이루어지던 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם / And also
  english_pob_choice: And also
  chosen_korean: 그리고 또한
  alternatives_korean:
  - 또한
  - 더욱이
  lexicon: HALOT
  rationale: 추가 정보를 잇는 접속의 힘을 살리면서, 법정 발화의 엄숙함을 현대 한국어로 자연스럽게 유지합니다.
- source_word: ר֣וּת הַ/מֹּאֲבִיָּה / Ruth the Moabite
  english_pob_choice: Ruth the Moabite
  chosen_korean: 모압 여인 룻
  alternatives_korean:
  - 모압 사람 룻
  - 모압 여인 룻
  lexicon: HALOT
  rationale: 고유명사는 음역하고, 지명적 출신은 현대 한국어에서 자연스러운 ‘모압 여인’으로 옮겨 원문의 민족 표지를 드러냅니다.
- source_word: קָנִ֧יתִי לִ֣/י / I have acquired for myself
  english_pob_choice: I have acquired for myself
  chosen_korean: 저는 제 아내로 맞아
  alternatives_korean:
  - 저는 제 자신을 위해 얻었습니다
  - 저는 제 아내로 취했습니다
  lexicon: HALOT
  rationale: קנה의 거래적 의미를 살리되, 한국어에서 사람을 물건처럼 들리지 않게 하면서도 결혼-회복의 법적 맥락을 유지하는 표현을 택했습니다.
- source_word: לְ/אִשָּׁ֗ה / as a wife
  english_pob_choice: as a wife
  chosen_korean: 제 아내로
  alternatives_korean:
  - 아내로
  - 아내가 되도록
  lexicon: HALOT
  rationale: 히브리어 목적/결과 구문을 한국어의 자연스러운 술어 보완으로 옮겼습니다.
- source_word: לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ / to raise up the name of the dead
  english_pob_choice: to raise up the name of the dead
  chosen_korean: 죽은 이의 이름을 … 다시 세워
  alternatives_korean:
  - 죽은 이의 이름을 세워
  - 죽은 자의 이름을 일으켜
  lexicon: HALOT
  rationale: ‘세우다/다시 세우다’는 명칭과 가문을 지속시키는 관용적 의미를 살리면서, 영어 POB의 ‘raise up’와 대응되는 동작성을 유지합니다.
- source_word: עַל נַחֲלָת֔/וֹ / over his inheritance
  english_pob_choice: over his inheritance
  chosen_korean: 그의 유산 위에
  alternatives_korean:
  - 그의 기업 위에
  - 그의 상속분 위에
  lexicon: HALOT
  rationale: נחלה의 상속·유업 의미를 담되, 본문의 법적 소유권 연결을 한국어의 ‘위에’로 반영했습니다.
- source_word: מֵ/עִ֥ם אֶחָ֖י/ו / from among his brothers
  english_pob_choice: from among his brothers
  chosen_korean: 그의 형제들 가운데
  alternatives_korean:
  - 그의 친족들 가운데
  - 그의 형제들 중에서
  lexicon: HALOT
  rationale: 원문이 문자적으로 ‘형제들’이라고 말하므로 이를 유지하되, 혈족 공동체를 가리키는 법정 맥락은 ‘가운데’로 자연화했습니다.
- source_word: וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ / and from the gate of his place
  english_pob_choice: and from the gate of his place
  chosen_korean: 그의 자리의 문에서
  alternatives_korean:
  - 그의 곳문에서
  - 그의 성문에서
  lexicon: HALOT
  rationale: ‘문/성문’의 공적 법정 장소성을 유지하면서, 원문의 장소적 소유 표현을 가능한 한 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: אֶשֶׁת מַחְלוֹן와 קָנִיתִי의 결합이 사람을 대상화하는가 하는 문제
  chosen_reading: ‘룻 … 제 아내로 맞아’로 옮겨 거래적 동사와 혼인-회복 목적을 함께 드러냈습니다.
  alternative_readings:
  - ‘룻을 샀습니다’
  - ‘룻을 취했습니다’
  rationale: 본문은 법적 취득 어휘를 사용하지만, 이야기 전체는 상속 보존과 죽은 자의 이름을 세우는 속량의 맥락입니다. 한국어에서는 직접적 구매 표현만 둘 경우 대상화가 과도해질 수 있어, 법적 의미를 유지하면서도 결혼의 목적을 드러내는 표현을 택했습니다.
  doctrine_reference: Ruth 4:10; translation philosophy §5
- issue: עֵדִים אַתֶּם הַיּוֹם의 화행 성격
  chosen_reading: ‘오늘 여러분은 증인입니다’로 공개적 법정 선언을 살렸습니다.
  alternative_readings:
  - ‘오늘 여러분이 증인입니다’
  - ‘당신들은 오늘 증인들입니다’
  rationale: 이 구절은 단순 정보 전달이 아니라 공동체 앞에서 증인을 지정하는 법적 선언입니다. 한국어에서는 존댓말 대상화를 유지하되, 공개 증언의 현재성을 분명히 해야 합니다.
  doctrine_reference: Ruth 4:10; legal-public setting
