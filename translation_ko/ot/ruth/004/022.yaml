theological_decisions:
- issue: 족보 동사의 뉘앙스
  chosen_reading: ‘낳았습니다’는 생물학적·계보적 계승을 그대로 드러내며, 본문에 없는 추가적 신학 해설을 덧붙이지 않습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’
  - ‘낳아 주었습니다’
  rationale: 이 절은 다윗으로 이어지는 단순한 족보 진술이므로, 문맥을 과장하지 않는 직설적 표현이 가장 적절합니다.
  doctrine_reference: Translation philosophy §§5–6
