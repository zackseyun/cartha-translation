- from: 당신의 집이 Tamar가 Judah에게 낳은 Perez의 집과 같게 되기를 바랍니다. 이는 야훼께서 이 젊은 여자를 통해 당신에게 주실 그 씨에서 비롯됩니다.[a][b]
  to: 야훼께서 이 젊은 여자를 통하여 당신에게 주실 자손[b]을 통하여, 당신의 집[a]이 다말이 유다에게 낳아 준 베레스의 집과 같게 되기를 바랍니다.
  rationale: 축복의 중심 문장을 유지하면서, ‘자손’ 전치사구를 축복의 매개/근거를 나타내는 구로 재결합했습니다. 또한 한국어 성경식 인명 표기를 적용하고 각주 표지를 해당 어휘에 직접 연결했습니다.
