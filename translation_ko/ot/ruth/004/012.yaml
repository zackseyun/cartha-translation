  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
  footnotes:
  - marker: a
    text: Or 'from the seed' (that is, 'from the offspring'). The Hebrew uses 'seed' as a common idiom for descendants.
    reason: lexical_alternative
  - marker: b
    text: '''House'' here means household or family line, not merely a physical dwelling.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이 젊은 여자를 통하여 당신에게 주실 자손[b]을 통하여, 당신의 집[a]이 다말이 유다에게 낳아 준 베레스의 집과 같게 되기를 바랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 물리적인 건물만이 아니라 가문이나 가계를 뜻할 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘자손’은 직역하면 ‘씨’이며, 여기서는 후손을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בֵיתְךָ כְּבֵית פֶּרֶץ
  english_pob_choice: And may your house be like the house of Perez
  chosen_korean: 당신의 집이 ...의 집과 같게 되기를 바랍니다
  alternatives_korean:
  - 당신의 집이 ...의 집처럼 되기를 바랍니다
  - 당신의 가문이 ...의 가문과 같게 되기를 바랍니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 축복형 희망문을 한국어의 공손한 소망 표현으로 옮기되, ‘집’을 유지해 가문/가계의 의미층위를 살렸습니다.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  english_pob_choice: whom Tamar bore to Judah
  chosen_korean: Tamar가 Judah에게 낳은
  alternatives_korean:
  - Tamar가 Judah를 위해 낳은
  - Tamar가 Judah를 위해 출산한
  lexicon: WLC; HALOT
  rationale: יַלד의 출산 의미를 직접 살려 관계절을 간결하게 옮겼고, לִיהוּדָה는 족보 맥락의 자연스러운 ‘에게’로 처리했습니다.
- source_word: מִן הַזֶּרַע
  english_pob_choice: from the offspring
  chosen_korean: 그 씨에서 비롯됩니다
  alternatives_korean:
  - 그 후손에서 비롯됩니다
  - 그 자손으로부터 나옵니다
  lexicon: WLC; HALOT
  rationale: זֶרַע의 직역적 ‘씨’와 후손 의미를 함께 보존하되, 한국어에서는 ‘비롯됩니다’로 출처/기원을 자연스럽게 표현했습니다.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  english_pob_choice: by this young woman
  chosen_korean: 이 젊은 여자를 통해
  alternatives_korean:
  - 이 젊은 여자로부터
  - 이 여자를 통해
  lexicon: WLC; HALOT
  rationale: נַעֲרָה는 연소한 여성을 가리키므로 ‘젊은 여자’를 택했고, 임신/출산의 매개를 한국어에서 자연스럽게 드러내기 위해 ‘통해’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: POB default; WLC
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
