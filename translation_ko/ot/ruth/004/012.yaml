    rationale: 초안은 두 표지를 문장 끝에 함께 붙여 어느 단어를 설명하는지 알기 어렵습니다. ‘집’과 ‘자손’ 뒤에 각각 배치하고 해당 각주 내용을 맞추었습니다.
