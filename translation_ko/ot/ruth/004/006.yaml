reference: Ruth 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/גֹּאֵ֗ל לֹ֤א אוּכַל֙ ל/גאול לִ֔/י פֶּן אַשְׁחִ֖ית אֶת נַחֲלָתִ֑/י גְּאַל לְ/ךָ֤ אַתָּה֙ אֶת גְּאֻלָּתִ֔/י כִּ֥י לֹא אוּכַ֖ל לִ/גְאֹֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
  footnotes:
  - marker: a
    text: Or “my redemption.” The Hebrew noun can be rendered more literally this way, but here it refers to the legal right/duty to redeem the property and marry Ruth within the family line.
    reason: lexical_alternative
  - marker: b
    text: “The redeemer” refers to the nearer family redeemer with prior claim before Boaz; traditional English often has “kinsman-redeemer.”
    reason: cultural_note
translation:
  language: ko
  text: 그 가까운 친족 구속자가 말했습니다.[b] “제가 제 몫으로 그것을 속량할 수는 없습니다. 내 유산을 해칠까 염려됩니다. 당신이 나의 속량권을 행사하십시오.[a] 저는 속량할 수 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나의 속량’입니다. 여기서는 재산을 속량할 법적 권리와 책임을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가까운 친족 구속자’는 보아스보다 우선권을 가진 가까운 친족으로서, 가족의 재산을 속량할 권리와 책임이 있는 사람을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַגֹּאֵל
  english_pob_choice: the redeemer
  chosen_korean: 그 친족 구속자
  alternatives_korean:
  - 그 구속자
  - 그 기업 무를 자
  - 그 속량자
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘구속자’보다 가까운 친족으로서의 법적 권리를 가진 사람임이 중요하므로, 친족 관계를 드러내되 기능을 살린 표현을 택했습니다.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  english_pob_choice: redeem / redeem / my right of redemption
  chosen_korean: 속량하다 / 속량하십시오 / 나의 속량권
  alternatives_korean:
  - 구속하다 / 구속하십시오 / 나의 구속
  - 되사다 / 되사십시오 / 나의 되삼권
  lexicon: HALOT
  rationale: 어근 גאל의 반복을 한국어에서도 일관되게 살리되, 여기서는 재산과 결혼 의무를 포함한 법적 권리의 의미가 강하므로 ‘속량권’으로 구체화했습니다.
- source_word: פֶּן אַשְׁחִית אֶת נַחֲלָתִי
  english_pob_choice: lest I ruin my own inheritance
  chosen_korean: 그렇게 하면 내 유산을 해칠까 두렵습니다
  alternatives_korean:
  - 그렇게 하면 내 기업을 망칠까 두렵습니다
  - 그렇게 하면 내 상속 재산을 손상시킬까 두렵습니다
  lexicon: HALOT
  rationale: ‘파멸시키다’의 강한 의미를 그대로 살리기보다, 이 문맥의 경제적·법적 손실을 자연스럽게 드러내는 ‘해치다’로 옮겼습니다.
- source_word: לִי / לְךָ אַתָּה
  english_pob_choice: for myself / for yourself
  chosen_korean: 내 자신을 위해 / 당신을 위해
  alternatives_korean:
  - 나를 위해 / 너 자신을 위해
  - 나에게 / 당신에게
  lexicon: HALOT
  rationale: 수혜·이익의 방향을 드러내는 여격을 한국어에서는 ‘~을 위해’로 옮겨 말의 논리를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 보아스 앞선 ‘친족 구속자’의 법적 지위와 기능
  chosen_reading: 이 인물은 일반적인 ‘구원자’가 아니라, 우선권을 가진 가까운 친족으로서 기업을 무를 법적 책임/권리를 가진 사람으로 이해했습니다.
  alternative_readings:
  - 그냥 ‘구속자’로만 번역
  - 전통적 ‘기업 무를 자’로 번역
  rationale: 룻기 4장의 논점은 구원 일반이 아니라 가족 법과 재산 상속의 우선권이므로, 본문의 사회-법적 의미를 한국어에서도 분명히 해야 합니다.
  doctrine_reference: 룻기 4장 문맥의 גאל(기업 무름) 개념
