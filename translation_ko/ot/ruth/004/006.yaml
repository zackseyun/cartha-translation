  rationale: 수혜와 강조를 현대 한국어답게 다듬고, 히브리어의 ‘나의 속량’이라는 법적 명사를 ‘나의 속량권’으로 명료하게 옮겼습니다. 또한 권리의 이전·행사를 ‘행사하십시오’로 표현하여 의미를 분명히 했습니다. 두 각주는 각각 해당 어휘에 붙여 영어 POB 감사 기록의 어휘 및 문화 설명 기능을 반영했습니다.
