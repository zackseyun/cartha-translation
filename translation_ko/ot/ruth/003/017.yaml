base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
  footnotes:
  - marker: a
    text: Hebrew literally, 'these six barley[s].' The specific unit is not stated, so 'measures' is supplied in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다[a], 「그가 이 보리 여섯 개를 나에게 주었습니다. 그가 말하기를, ‘당신의 시어머니에게 빈손으로 가지 마십시오.’라고 했기 때문입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 보리 여섯’이며, 구체적인 도량형은 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: She said
  chosen_korean: 그녀가 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol을 한국어에서는 자연스러운 보고문으로 풀되, 원문의 단순한 발화 도입 기능을 유지했습니다.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  english_pob_choice: these six measures of barley
  chosen_korean: 이 보리 여섯 개를
  alternatives_korean:
  - 이 보리 여섯 되를
  - 이 보리 여섯 단위를
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘이 보리 여섯’에 가깝고, 구체 단위는 본문에 없습니다. 한국어에서는 자연스러운 수량 표현으로 풀되, 단위를 임의로 확정하지 않았습니다.
- source_word: רֵיקָם
  english_pob_choice: empty-handed
  chosen_korean: 빈손으로
  alternatives_korean:
  - 헛되이
  - 아무것도 없이
  lexicon: HALOT
  rationale: 문맥상 물품 없이 돌아가는 뜻이므로 관용적이면서도 의미를 분명히 하는 ‘빈손으로’가 가장 적절합니다.
- source_word: אֶל חֲמוֹתֵךְ
  english_pob_choice: to your mother-in-law
  chosen_korean: 당신의 시어머니에게
  alternatives_korean:
  - 네 시어머니에게
  - 시어머니에게
  lexicon: HALOT
  rationale: חֲמוֹת는 정확히 ‘시어머니/장모’에 해당하며, 한국어 독자에게는 직접화법 안에서 정중한 호칭인 ‘당신의 시어머니’가 자연스럽습니다.
