source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
  footnotes:
  - marker: a
    text: Or 'our kinsman.' The Hebrew term can denote a relative or clan connection, not merely an acquaintance.
    reason: lexical_alternative
  - marker: b
    text: Or 'with whose servant girls you have been.' The Hebrew can refer to Boaz's female workers or attendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보아스는 우리의 친족이 아니십니까? 당신이 그의 젊은 여자들과 함께 지내지 않았습니까? 보십시오, 그는 오늘 밤 타작마당에서 보리를 까부르고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹדַעְתָּנוּ
  english_pob_choice: our relative
  chosen_korean: 우리의 친족
  alternatives_korean:
  - 우리의 친척
  - 우리의 친족관계인 사람
  - 우리의 고엘
  lexicon: HALOT
  rationale: 문맥상 단순한 아는 사람이 아니라 가족·씨족 연결을 가리키므로, 현대 한국어에서 의미를 분명히 하는 ‘친족’이 가장 적절합니다.
- source_word: נַעֲרוֹתָיו
  english_pob_choice: with whose young women you have been
  chosen_korean: 그의 젊은 여자들과 함께 지내지 않았습니까
  alternatives_korean:
  - 그의 여종들과 함께 지내지 않았습니까
  - 그의 시녀들과 함께 지내지 않았습니까
  - 그의 젊은 여자 종들과 함께 있지 않았습니까
  lexicon: HALOT
  rationale: 히브리어는 보아스의 여자 일꾼/시중드는 여자들을 가리킬 수 있으므로, 종속성을 과도하게 단정하지 않으면서도 장면의 관계를 살렸습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐요
  - 자
  lexicon: HALOT
  rationale: 주의를 환기하는 지시어로서, 합쇼체 서술 안에서 자연스럽고 직접적인 현대 한국어 표현을 선택했습니다.
- source_word: זֹרֶה אֶת גֹּרֶן הַשְּׂעֹרִים
  english_pob_choice: he is winnowing barley at the threshing floor
  chosen_korean: 그는 오늘 밤 타작마당에서 보리를 까부르고 있습니다
  alternatives_korean:
  - 그는 오늘 밤 타작마당에서 보리를 키질하고 있습니다
  - 그는 오늘 밤 보리를 타작마당에서 까부르고 있습니다
  lexicon: HALOT
  rationale: 동작은 ‘보리’를 까부르는 것이므로 목적어와 장소를 분리해 자연스럽게 옮겼습니다. ‘까부르다’는 풍작과 선별의 장면을 잘 살리며, ‘키질하다’는 더 도구 중심이라 여기서는 덜 직접적입니다.
- source_word: הַלָּיְלָה
  english_pob_choice: tonight
  chosen_korean: 오늘 밤
  alternatives_korean:
  - 이 밤에
  - 밤에
  lexicon: HALOT
  rationale: 시간 부사로서 가장 자연스러운 현대 한국어 대응입니다.
theological_decisions:
- issue: ועתה의 담화 기능
  chosen_reading: ‘이제’로 시작해 다음 행동 지침을 여는 연결어로 처리했습니다.
  alternative_readings:
  - ‘그리고 이제’
  - ‘자, 이제’
  rationale: 나오미의 권면이 새 단계로 넘어감을 보여 주는 담화 표지이므로, 접속성과 시간성을 함께 살리는 ‘이제’가 적절합니다.
  doctrine_reference: Narrative discourse
