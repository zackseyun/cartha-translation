id: RUT.3.11
reference: Ruth 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'all my people at the gate know.' The 'gate' refers to the public place of civic recognition and legal proceedings.
    reason: cultural_note
  - marker: b
    text: Or 'a worthy woman,' 'an excellent woman,' or 'a woman of valor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 딸아, 두려워하지 마십시오. 당신이 말씀하시는 것은 무엇이든 제가 해 드리겠습니다. 우리 백성 모두가[a] 당신이 훌륭한 여인이라는 것을 압니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 백성의 온 성문이’입니다. ‘성문’은 고대 이스라엘에서 공적 인정과 법적 절차가 이루어지던 장소를 가리키며, 여기서는 그 공적 공동체를 비유적으로 나타냅니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘유능한 여인’, ‘가치 있는 여인’, 또는 ‘용맹한 여인’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  english_pob_choice: my daughter
  chosen_korean: 내 딸아
  alternatives_korean:
  - 내 자녀야
  - 내 딸
  lexicon: HALOT
  rationale: 친밀하고 보호적인 호칭을 한국어에서도 직접 살리되, 대화체의 자연스러움을 위해 호격을 사용했습니다.
- source_word: אַל תִּירְאִי
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말라
  lexicon: HALOT
  rationale: 부정 명령의 의미를 간결하고 격식 있게 옮겼습니다.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  english_pob_choice: All that you say, I will do for you
  chosen_korean: 당신이 말하는 것은 모두 제가 당신을 위해 하겠습니다
  alternatives_korean:
  - 당신이 말하는 것은 모두 해 드리겠습니다
  - 무엇이든 말씀하시면 제가 당신을 위해 하겠습니다
  lexicon: HALOT
  rationale: ‘말하다’의 동사 의미를 유지하면서, לָּךְ의 이익 대상을 ‘당신을 위해’로 자연스럽게 살렸습니다.
- source_word: שַׁעַר
  english_pob_choice: gate
  chosen_korean: 성문
  alternatives_korean:
  - 문
  - 성문 어귀
  lexicon: HALOT
  rationale: 고대 이스라엘의 공적·법적 장소라는 함의를 한국어 성경 용례에 맞게 드러냈습니다.
- source_word: אֵשֶׁת חַיִל
  english_pob_choice: a woman of noble character
  chosen_korean: 고귀한 품격을 지닌 여자
  alternatives_korean:
  - 유능한 여자
  - 훌륭한 여자
  - 용맹한 여자
  lexicon: HALOT
  rationale: חַיִל의 폭넓은 의미(가치, 강함, 유능함, 탁월함)를 고려해, 이 문맥에서 인격적·사회적 가치를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 성문을 둘러싼 공동체적 인지 표현
  chosen_reading: 우리 백성의 성문에 있는 모든 사람이 당신이 고귀한 품격을 지닌 여자라는 것을 압니다.
  alternative_readings:
  - 우리 백성의 성문에 있는 모든 사람이 당신이 훌륭한 여자라는 것을 압니다.
  - 우리 백성의 성문에 있는 모든 사람이 당신이 용맹한 여자라는 것을 압니다.
  rationale: 히브리어의 관용적 표현을 단순히 ‘사람들’로 평탄화하지 않고, 공적 인정이 이루어지는 ‘성문’의 장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
