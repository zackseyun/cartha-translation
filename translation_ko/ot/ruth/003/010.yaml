  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
  footnotes:
  - marker: a
    text: Or 'steadfast love,' 'loyalty,' or 'covenant faithfulness' for 'kindness' (חֶסֶד).
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「야훼께 복을 받으십시오, 내 딸아. 네가 이 마지막 친절을 처음 것보다 더 잘하였으니, 곧 젊은이들을 따르지 아니한 것이다. 그들이 가난하든 부유하든 말입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘친절’은 여기서 חֶסֶד의 주요 번역이지만, 문맥상 ‘인애’, ‘신실한 사랑’, ‘언약적 신실함’의 의미도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  english_pob_choice: May you be blessed by Yahweh
  chosen_korean: 야훼께 복을 받으십시오
  alternatives_korean:
  - 야훼께 복을 받으라
  - 야훼께 복되시기를 바랍니다
  lexicon: HALOT
  rationale: 축복 선언문으로서의 수동적 축복 공식을 자연스러운 합쇼체로 옮겼습니다. '복을 받으십시오'는 원문의 축복 발화를 살리면서도 현대 한국어에서 낯설지 않습니다.
- source_word: בִּתִּי
  english_pob_choice: my daughter
  chosen_korean: 내 딸아
  alternatives_korean:
  - 내 아이야
  - 내 자녀야
  lexicon: HALOT
  rationale: 보아스가 룻에게 하는 친근하고 연장자다운 호칭을 보존하기 위해 직역에 가깝게 옮겼습니다. '내 딸아'는 관계적 뉘앙스를 가장 분명하게 드러냅니다.
- source_word: חַסְדֵּךְ
  english_pob_choice: kindness
  chosen_korean: 친절
  alternatives_korean:
  - 인애
  - 은혜
  - 자비
  - 신실한 사랑
  lexicon: HALOT
  rationale: 문맥상 룻이 나오미 가문을 향해 보인 실제 행동의 선함과 충성을 말하므로, 한국어에서는 '친절'이 가장 직접적입니다. 다만 חֶסֶד의 더 두꺼운 의미층은 주석적 대안으로 남깁니다.
- source_word: הָאַחֲרוֹן מִן הָרִאשׁוֹן
  english_pob_choice: this last ... than the first
  chosen_korean: 이 마지막 ... 처음 것보다 더 잘
  alternatives_korean:
  - 이후의 ... 이전의 것보다
  - 마지막 ... 첫째 것보다
  lexicon: HALOT
  rationale: 비교 구문을 한국어에서 자연스럽게 풀어 '더 잘하였으니'로 옮겨, 앞선 친절보다 더 큰 친절이라는 비교 의미를 살렸습니다.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי הַבַּחוּרִים
  english_pob_choice: by not going after the young men
  chosen_korean: 젊은이들을 따르지 아니한 것
  alternatives_korean:
  - 젊은 남자들을 뒤따르지 않은 것
  - 청년들을 좇지 않은 것
  lexicon: HALOT
  rationale: 연애·혼인 선택의 추구를 뜻하는 관용을 한국어 독자가 이해하도록 '따르다'로 옮겼습니다. '젊은이들'은 הַבַּחוּרִים의 자연스러운 현대 대응입니다.
- source_word: אִם דַּל וְאִם עָשִׁיר
  english_pob_choice: whether poor or rich
  chosen_korean: 가난하든 부유하든
  alternatives_korean:
  - 빈곤하든 부유하든
  - 가난하든지 부유하든지
  lexicon: HALOT
  rationale: 범위 전체를 포괄하는 병렬 표현을 한국어의 '-든' 구조로 간결하게 살렸습니다.
theological_decisions:
- issue: חֶסֶד의 핵심 의미를 한국어 본문에서 어떻게 유지할 것인가
  chosen_reading: 본문은 '친절'로 읽기 쉽게 두되, חֶסֶד의 언약적 충성·신실함의 층위는 주석적 선택지로 남깁니다.
  alternative_readings:
  - 인애
  - 신실한 사랑
  - 언약적 신실함
  rationale: 이 절에서는 보아스가 룻의 실제 행동을 칭찬하는 서술이므로, 본문은 과도하게 신학화하지 않고 내러티브 의미를 우선했습니다. 동시에 חֶסֶד의 더 깊은 의미를 지우지 않도록 대안을 기록합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: 야훼의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문에 יְהוָה가 직접 나오므로, 관례적 대치어보다 하나님의 고유 이름을 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
