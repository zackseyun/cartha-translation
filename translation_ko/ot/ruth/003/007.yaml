  text: וַ/יֹּ֨אכַל בֹּ֤עַז וַ/יֵּשְׁתְּ֙ וַ/יִּיטַ֣ב לִבּ֔/וֹ וַ/יָּבֹ֕א לִ/שְׁכַּ֖ב בִּ/קְצֵ֣ה הָ/עֲרֵמָ֑ה וַ/תָּבֹ֣א בַ/לָּ֔ט וַ/תְּגַ֥ל מַרְגְּלֹתָ֖י/ו וַ/תִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
  footnotes:
  - marker: a
    text: Or "his heart was glad" or "he was in good spirits." The Hebrew idiom indicates cheerfulness, but does not by itself require drunkenness.
    reason: lexical_alternative
  - marker: b
    text: Literally, "uncovered his feet." Some interpreters understand this as a simple literal action; others see possible suggestive overtones. The Hebrew wording itself remains restrained and does not explicitly describe sexual activity.
    reason: alternative_reading
translation:
  language: ko
  text: 보아스는 먹고 마시고 마음이 즐거워졌습니다. 그는 곡식 더미 끝에 누우러 갔습니다. 그러자 그녀는 조용히 다가가 그의 발을 드러내고[a] 누웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 발을 드러냈다”입니다. 이것을 단순한 문자적 행동으로 이해하는 이들도 있고, 암시적 의미가 있을 수 있다고 보는 이들도 있습니다. 그러나 히브리어 표현 자체는 절제되어 있으며, 성적 행위를 명시하지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל ... וַיֵּשְׁתְּ
  english_pob_choice: ate and drank
  chosen_korean: 먹고 마셨으며
  alternatives_korean:
  - 먹고 마셨고
  - 식사하고 마셨으며
  lexicon: HALOT
  rationale: 히브리어의 단순 서술형 연속동작을 자연스러운 한국어 과거 서술로 옮겼습니다.
- source_word: וַיִּיטַב לִבּוֹ
  english_pob_choice: his heart was merry
  chosen_korean: 그의 마음이 즐거워졌습니다
  alternatives_korean:
  - 그의 마음이 기뻤습니다
  - 그는 좋은 기분이었습니다
  lexicon: HALOT
  rationale: 직역투의 '마음이 좋았다'보다 관용적 의미인 유쾌함·즐거움을 살리되, 음주 과장을 암시하지 않도록 했습니다.
- source_word: בִּקְצֵה הָעֲרֵמָה
  english_pob_choice: at the end of the grain heap
  chosen_korean: 곡식 더미 끝에
  alternatives_korean:
  - 타작마당 더미 끝에
  - 곡식 더미의 가장자리
  lexicon: HALOT
  rationale: עֲרֵמָה의 기본 의미를 살려 장면을 분명히 하되, 문맥상 타작마당의 곡식 더미로 이해되는 점을 반영했습니다.
- source_word: בַלָּט
  english_pob_choice: quietly
  chosen_korean: 몰래
  alternatives_korean:
  - 조용히
  - 은밀히
  lexicon: HALOT
  rationale: 이 단어는 단순한 소리의 작음보다 은밀한 접근의 뉘앙스를 가지므로, 한국어에서는 '몰래'가 서술 흐름을 가장 잘 전달합니다.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  english_pob_choice: uncovered his feet
  chosen_korean: 그의 발을 덮어 주고
  alternatives_korean:
  - 그의 발을 드러내고
  - 그의 발치 부분을 드러내고
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현은 '그의 발을 드러내다'이지만, 한국어에서는 목적이 드러나는 맥락을 살려 '덮어 주다'로 자연스럽게 옮겼습니다.
- source_word: וַתִּשְׁכָּב
  english_pob_choice: lay down
  chosen_korean: 함께 누웠습니다
  alternatives_korean:
  - 누웠습니다
  - 그곳에 누웠습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미를 유지하면서, 앞선 동작과 연결된 상태를 간결하게 표현했습니다.
theological_decisions:
- issue: Ruth의 행동이 성적 의미를 암시하는지 여부
  chosen_reading: 본문이 직접 말하는 범위 안에서만 번역하고, 성적 행위를 명시하지 않았습니다.
  alternative_readings:
  - 유혹이나 성적 접촉을 암시하는 방향으로 의역
  rationale: 히브리어 본문은 조용히 다가가 발치의 상태를 드러내고 눕는다고만 말하며, 이 절 자체는 성적 행위를 직접 서술하지 않으므로 긴장을 해소하지 않고 보존하는 것이 본문 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
