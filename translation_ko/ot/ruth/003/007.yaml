revisions:
- from: 보아스는 먹고 마셨으며, 그의 마음이 즐거워졌습니다. 그리고 그는 곡식 더미 끝에 누우러 갔습니다. 그때 그녀가 몰래 와서 그의 발을 덮어 주고 함께 누웠습니다.[a]
  to: 보아스는 먹고 마시고 마음이 즐거워졌습니다. 그는 곡식 더미 끝에 누우러 갔습니다. 그러자 그녀는 조용히 다가가 그의 발을 드러내고[a] 누웠습니다.
  rationale: 원어의 동작 방향을 바로잡아 ‘발을 덮어 주고’를 ‘발을 드러내고’로 수정했습니다. 또한 원문에 없는 ‘함께’를 삭제하여 룻이 누웠다는 서술만 남겼습니다. בַלָּט는 본문 흐름상 ‘조용히 다가가’로 옮겼고, 논쟁적인 함의는 본문이 아니라 각주에서 보존했습니다.
