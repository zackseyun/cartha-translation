  source_fidelity: 원문의 동작 순서는 대체로 반영했으나, וַתְּגַל(‘드러내다, 덮은 것을 벗기다’)를 ‘덮어 주고’로 옮긴 것은 뜻을 정반대로 바꿉니다. 또한 וַתִּשְׁכָּב는 단순히 ‘누웠다’인데 ‘함께 누웠습니다’는 원문에 없는 동반의 뜻을 더합니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 성경 서술로 자연스럽습니다. ‘조용히 다가가’는 בַלָּט의 은밀하고 소리 없이 접근하는 뉘앙스를 무리 없이 전달합니다.
  terminology: 보아스, 곡식 더미, 발을 드러내다 등의 표현은 문맥과 원어의 어휘 범위에 적절합니다. 성적 의미는 본문이나 본문 번역에 첨가하지 않고 각주에서 해석 가능성만 절제하여 설명합니다.
