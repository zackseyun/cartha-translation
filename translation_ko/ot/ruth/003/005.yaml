lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And she said
  chosen_korean: 그녀가 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그녀가 이렇게 말했습니다
  lexicon: HALOT
  rationale: 와우 계열 서술형은 한국어에서 자연스러운 과거 서술로 옮기되, 히브리어 서사 진행을 과잉 해석하지 않도록 단순하게 처리했습니다.
- source_word: אֵלֶיהָ
  english_pob_choice: to her
  chosen_korean: 그에게
  alternatives_korean:
  - 그녀에게
  - 그 사람에게
  lexicon: HALOT
  rationale: 문맥상 화자는 룻이 아니라 나오미이므로 3인칭 여성을 가리키는 대명사는 한국어에서 자연스럽게 ‘그녀에게’로 옮기는 것이 적절합니다.
- source_word: כֹּל אֲשֶׁר
  english_pob_choice: All that
  chosen_korean: 당신이 말씀하시는 것은 다
  alternatives_korean:
  - 말씀하시는 모든 것은
  - 무엇이든 말씀하시는 것은
  lexicon: HALOT
  rationale: 총칭적 표현을 한국어에서 가장 자연스럽고 포괄적으로 드러내기 위해 ‘다’와 주제 표지를 사용해 전체성을 살렸습니다.
- source_word: תֹּאמְרִי
  english_pob_choice: you say
  chosen_korean: 말씀하시는
  alternatives_korean:
  - 말하는
  - 하시는
  lexicon: HALOT
  rationale: 2인칭 여성 단수의 현재적 직접화법을 한국어에서 공손한 현재형 ‘말씀하시는’으로 옮겨, 나오미에게 대한 존대를 반영했습니다.
- source_word: אֶעֱשֶׂה
  english_pob_choice: I will do
  chosen_korean: 제가 하겠습니다
  alternatives_korean:
  - 제가 할 것입니다
  - 그대로 하겠습니다
  lexicon: HALOT
  rationale: 의지 표시는 ‘하겠습니다’로 자연스럽게 살리고, 히브리어에 없는 목적어 ‘it’은 덧붙이지 않았습니다.
theological_decisions:
- issue: Naomi에게 대한 공손한 호칭과 동사 높임의 반영
  chosen_reading: 룻의 응답을 한국어 존대 표현으로 옮겨, 상대가 나오미임을 드러내는 공손한 대화체를 사용했습니다.
  alternative_readings:
  - 평서체로 ‘그녀가 말했다. “네가 말하는 것은 다 하겠다.”’
  - 더 중립적인 ‘그녀에게 말했다’
  rationale: 본문의 관계는 가족 내 대화이지만 한국어에서는 상대에 대한 존대를 통해 인물 관계를 자연스럽게 드러낼 수 있으며, 원문의 의미를 훼손하지 않습니다.
  doctrine_reference: 서사문 대화체의 사회적 존대와 인물 관계 표현
- issue: ‘All that’의 총칭성 유지
  chosen_reading: ‘당신이 말씀하시는 것은 다’로 총칭적 의미를 분명히 했습니다.
  alternative_readings:
  - ‘모든 것을’
  - ‘말씀하시는 대로’
  rationale: 원문은 조건 없는 전면적 순응을 강조하므로, 한국어에서도 범위를 축소하지 않고 전체성을 보존하는 번역이 적절합니다.
  doctrine_reference: 원문 총칭 표현의 범위 보존
