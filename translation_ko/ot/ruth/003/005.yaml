  to: 룻이 나오미에게 말했습니다. “말씀하시는 모든 것을 제가 하겠습니다.”[a]
  rationale: 수신자를 남성으로 지시한 오류를 바로잡고, 문맥상 이미 확정된 인명을 사용하여 한국어의 대명사 모호성을 해소했습니다. ‘모든 것을’은 히브리어 כֹּל אֲשֶׁר의 포괄성을, ‘하겠습니다’는 룻의 결심을 유지합니다. 각주는 ‘all that/everything that’에 해당하는 한국어의 자연스러운 대안 표현을 제시합니다.
