  source_fidelity: 원문의 אֵלֶיהָ는 여성 단수 대상, 곧 나오미를 가리키므로 본문의 ‘그에게’는 남성 지시가 되어 원문과 맞지 않습니다. 또한 문맥상 룻과 나오미를 명시하면 한국어에서 두 여성 대명사의 반복과 지시 대상의 모호함을 피할 수 있습니다. כֹּל אֲשֶׁר תֹּאמְרִי와 אֶעֱשֶׂה의 전면적 수행 의지는 ‘말씀하시는 모든 것을 제가 하겠습니다’에 보존됩니다.
  naturalness: ‘룻이 나오미에게 말했습니다’는 현대 한국어 서사에서 자연스럽고 지시 대상이 분명합니다. 나오미를 향한 직접 발화에서는 주어를 생략한 ‘말씀하시는’이 ‘당신이 말씀하시는’보다 자연스러운 존대 합쇼체입니다.
