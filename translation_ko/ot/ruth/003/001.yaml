  - severity: medium
    issue: ‘그의 며느리’의 소유·지시 표현
    rationale: 히브리어의 3인칭 여성 단수 접미사는 나오미와 룻의 관계를 가리키지만, 한국어 ‘그의’는 남성 소유자를 기본적으로 연상시키며 지시 대상도 불분명합니다. ‘자기 며느리’가 자연스럽고 정확합니다.
  - severity: low
