    rationale: ‘안식처’도 가능하나 한국어에서는 종교적 안식 또는 피난처의 뉘앙스가 비교적 강합니다. מָנוֹחַ의 일반적인 ‘쉼/정착된 안정의 자리’를 보존하려면 ‘쉴 곳’이 더 중립적이고 자연스럽습니다.
  - severity: low
