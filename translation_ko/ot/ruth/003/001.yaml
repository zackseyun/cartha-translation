  text: וַ/תֹּ֥אמֶר לָ֖/הּ נָעֳמִ֣י חֲמוֹתָ֑/הּ בִּתִּ֞/י הֲ/לֹ֧א אֲבַקֶּשׁ לָ֛/ךְ מָנ֖וֹחַ אֲשֶׁ֥ר יִֽיטַב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
  footnotes:
  - marker: a
    text: Or 'rest,' 'security,' or 'a home.' In context Naomi is seeking Ruth's settled well-being, likely through marriage, but the Hebrew says 'resting place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 나오미가 자기 며느리에게 말했습니다. “내 딸아, 내가 너를 위해 네가 잘되도록 쉴 곳[a]을 찾아 주어야 하지 않겠느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉼’, ‘안정’, ‘보금자리’. 문맥상 나오미는 룻이 안정되고 잘 지내도록 마련해 주려 하며, 이는 결혼을 포함할 수 있습니다. 그러나 히브리어 본문은 결혼을 직접 말하지 않고 ‘쉴 곳’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그래서 ... 말했습니다
  lexicon: WLC; HALOT
  rationale: 와우-연속의 서술 진행을 한국어의 자연스러운 순서 표지로 옮기되, 단순 접속보다 사건의 다음 진행을 드러내기 위해 ‘그러자’를 택했습니다.
- source_word: חֲמוֹתָהּ
  english_pob_choice: her mother-in-law
  chosen_korean: 그의 며느리에게
  alternatives_korean:
  - 시어머니가
  - 며느리에게
  lexicon: WLC; HALOT
  rationale: 히브리어는 나오미와 룻의 관계를 분명히 하므로, 한국어에서도 호칭 관계를 드러내어 대상을 명확히 했습니다.
- source_word: בִּתִּי
  english_pob_choice: My daughter
  chosen_korean: 내 딸아
  alternatives_korean:
  - 내 사랑하는 딸아
  - 딸아
  lexicon: WLC; HALOT
  rationale: 친밀한 호칭을 보존하면서도 현대 한국어에서 자연스러운 직접 호칭인 ‘내 딸아’로 옮겼습니다.
- source_word: מָנוֹחַ
  english_pob_choice: a resting place
  chosen_korean: 안식처
  alternatives_korean:
  - 쉼터
  - 평안할 곳
  - 거할 곳
  lexicon: HALOT
  rationale: 직역적 ‘쉼’보다 문맥상 안정된 거처와 보호를 함께 담는 표현이 필요하므로, ‘resting place’의 은유를 살리는 ‘안식처’를 선택했습니다.
theological_decisions:
- issue: 룻 3:1의 מָנוֹחַ를 어떻게 이해할지
  chosen_reading: 본문은 ‘결혼’ 자체를 직접 말하지 않고, 룻의 정착된 복지와 안정을 가리키는 ‘안식처’로 유지했습니다.
  alternative_readings:
  - ‘남편’ 또는 ‘결혼할 자리’로 명시적으로 풀기
  - ‘집’으로 단순화하기
  rationale: 영어 POB가 footnote로 밝히듯이, 문맥상 결혼을 암시할 수는 있어도 히브리어 표면형은 ‘resting place’이므로 그 긴장을 지키는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 본문의 표면 의미와 문맥적 함의를 함께 보존하는 원문 충실성 원칙
