  source_fidelity: 개정이 필요합니다. 초안의 ‘그의 며느리’는 나오미를 가리키는 3인칭 소유 표현으로 어색할 뿐 아니라 한국어에서 남성 소유자도 연상시킬 수 있습니다. 또한 מָנוֹחַ는 문맥상 정착된 안전과 복지를 뜻하지만, 본문에서는 결혼이나 ‘안식처’를 신학적으로 특정하지 않은 ‘쉴 곳’으로 옮기는 편이 더 자연스럽고 원문의 폭을 보존합니다.
  naturalness: ‘자기 며느리’는 나오미와 룻의 관계 및 대화 상대를 자연스럽고 분명하게 나타냅니다. ‘너를 위해 네가 잘되도록 쉴 곳을 찾아 주어야’는 수사 의문문의 권유·책임감을 현대 표준어 합쇼체로 자연스럽게 살립니다.
  terminology: מָנוֹחַ는 ‘쉴 곳’으로 번역하고, 각주에서 ‘쉼, 안정, 보금자리’라는 가능한 뉘앙스를 밝혔습니다. 이는 결혼을 본문에 직접 삽입하지 않으면서 문맥적 함의를 보존합니다.
