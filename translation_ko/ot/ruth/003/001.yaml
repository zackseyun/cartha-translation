revisions:
- from: 그러자 나오미가 그의 며느리에게 말했습니다. 「내 딸아, 내가 너를 위해 안식처를 찾아서 너에게 잘되게 하지 않겠느냐?」[a]
  to: 그러자 나오미가 자기 며느리에게 말했습니다. “내 딸아, 내가 너를 위해 네가 잘되도록 쉴 곳[a]을 찾아 주어야 하지 않겠느냐?”
  rationale: 나오미가 룻의 시어머니라는 관계를 한국어에서 분명하고 자연스럽게 고쳤습니다. 수사 의문문(‘내가 … 하지 않겠느냐?’), ‘너를 위해’, 그리고 룻의 잘됨이라는 목적을 유지했습니다. מָנוֹחַ는 문맥상 결혼을 암시할 수 있으나 본문에 없는 ‘남편’이나 ‘결혼’을 넣지 않고 ‘쉴 곳’으로 번역했으며, 그 의미 범위는 각주로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:16:08Z'
