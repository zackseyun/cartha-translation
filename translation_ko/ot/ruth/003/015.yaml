revisions:
- from: 그가 말했습니다. 「당신이 입고 있는 외투를 가져와 펼치십시오」. 그래서 그녀가 그것을 펼치자, 그가 보리 여섯 단위를 재어 그녀에게 얹어 주었습니다[a]. 그런 다음 그는 성읍으로 들어갔습니다[b].
  to: 그가 말했습니다. “당신이 걸치고 있는 겉옷을 가져와 펼치십시오.” 그래서 그녀가 그것을 펼치자, 그가 보리를 여섯 단위 재어 그녀 위에 얹어 주었습니다[a]. 그런 다음 그는 성읍으로 들어갔습니다[b].
  rationale: 의복 명칭을 문맥에 더 맞는 ‘겉옷’으로 조정하고, 곡식을 올려놓는 위치를 ‘그녀 위에’로 명시했습니다. 마지막 절은 마소라 본문의 남성형 동사를 따르며, 이문은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
