source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הָ֠בִי הַ/מִּטְפַּ֧חַת אֲשֶׁר עָלַ֛יִ/ךְ וְ/אֶֽחֳזִי בָ֖/הּ וַ/תֹּ֣אחֶז בָּ֑/הּ וַ/יָּ֤מָד שֵׁשׁ שְׂעֹרִים֙ וַ/יָּ֣שֶׁת עָלֶ֔י/הָ וַ/יָּבֹ֖א הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
  footnotes:
  - marker: a
    text: 'Hebrew: ''six barley''; the unit is not stated, so ''measures'' is supplied for clear English.'
    reason: lexical_alternative
  - marker: b
    text: Some ancient versions and many translations read, 'Then she went into the city.' The Masoretic Text reads, 'Then he went into the city.'
    reason: textual_variant
translation:
  language: ko
  text: 그가 말했습니다. “당신이 걸치고 있는 겉옷을 가져와 펼치십시오.” 그래서 그녀가 그것을 펼치자, 그가 보리를 여섯 단위 재어 그녀 위에 얹어 주었습니다[a]. 그런 다음 그는 성읍으로 들어갔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘보리 여섯’이라고 되어 있어, 한국어에서는 뜻을 분명히 하려고 ‘단위’를 보탰습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 고대 역본과 많은 번역본은 ‘그녀가 성읍으로 들어갔다’로 읽습니다. 그러나 마소라 본문은 ‘그가 성읍으로 들어갔다’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  english_pob_choice: Bring the cloak that is on you and hold it out.
  chosen_korean: 「당신이 입고 있는 외투를 가져와 펼치십시오」
  alternatives_korean:
  - 가져오십시오
  - 이리 가져오십시오
  - 당신이 입고 있는 외투를 가져와 잡으십시오
  lexicon: HALOT
  rationale: 요청의 방향을 살리면서 현대 한국어에서 자연스럽게 들리도록 ‘가져오다’와 ‘펼치다’를 결합했습니다.
- source_word: הַמִּטְפַּחַת
  english_pob_choice: the cloak
  chosen_korean: 외투
  alternatives_korean:
  - 망토
  - 숄
  - 겉옷
  lexicon: HALOT
  rationale: 이 단어는 여기서 곡식을 담을 수 있는 넓은 겉옷/덮개를 가리키므로, 지나치게 장식적이거나 얇은 인상을 주는 표현보다 ‘외투’가 기능을 더 잘 드러냅니다.
- source_word: וַיָּמָד שֵׁשׁ שְׂעֹרִים
  english_pob_choice: he measured six measures of barley
  chosen_korean: 보리 여섯 단위를 재어
  alternatives_korean:
  - 보리 여섯 되를 재어
  - 보리 여섯 에바를 재어
  - 보리 여섯 석을 재어
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘보리 여섯’을 말하지만 단위가 명시되지 않으므로, 본문의 अस्प अस्प? — no. '단위'를 보태어 한국어 독자가 양감을 이해하도록 하되, 구체 단위는 본문이 말하지 않으므로 확정하지 않았습니다.
- source_word: וַיָּשֶׁת עָלֶיהָ
  english_pob_choice: and put it on her
  chosen_korean: 그녀에게 얹어 주었습니다
  alternatives_korean:
  - 그녀 위에 놓았습니다
  - 그녀에게 올려놓았습니다
  - 그녀에게 실어 주었습니다
  lexicon: HALOT
  rationale: 곡식이 그녀의 옷/몸에 실리는 장면을 살리기 위해 ‘얹어 주다’를 택했습니다. ‘put it on her’의 물리적 동작과 배려의 뉘앙스를 함께 반영합니다.
- source_word: וַיָּבֹא הָעִיר
  english_pob_choice: Then he went into the city.
  chosen_korean: 성읍으로 들어갔습니다
  alternatives_korean:
  - 그녀가 성읍으로 들어갔습니다
  - 그는 성읍으로 갔습니다
  lexicon: HALOT
  rationale: 마소라 본문의 남성형 동사를 따라 주어를 ‘그’로 읽었고, 한국어에서는 반복을 줄이기 위해 목적어 없이 자연스럽게 정리했습니다.
theological_decisions:
- issue: 마소라 본문의 마지막 절 주어 처리
  chosen_reading: 본문을 따라 ‘그가 성읍으로 들어갔다’로 번역했습니다.
  alternative_readings:
  - ‘그녀가 성읍으로 들어갔다’로 번역
  rationale: 이 항목은 교리 문제가 아니라 본문 비평상 주목할 만한 이본 문제입니다. POB의 영어 본문처럼 마소라 본문의 형태를 우선했고, 다른 전통의 독법은 각주로 남겼습니다.
  doctrine_reference: Translation philosophy §1, §3
