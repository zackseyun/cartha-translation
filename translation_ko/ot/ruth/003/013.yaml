source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
  footnotes:
  - marker: a
    text: Hebrew 'redeem' here refers to the role of a family redeemer, often called a 'kinsman-redeemer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 밤 여기 머무르십시오. 아침에 그가 당신을 위하여 기업 무를 책임을 지려 한다면, 좋습니다. 그가 그 책임을 지게 하십시오. 그러나 그가 당신을 위하여 기업 무를 책임을 지려 하지 않으면, 야훼께서 살아 계심을 두고 내가 친히 그 책임을 지겠습니다. 아침까지 누워 계십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 가알(גאל)은 여기서 가까운 친족이 가족의 재산과 권리를 보호하고 회복할 책임을 지는 일을 가리킵니다. 전통적으로 ‘기업 무를 자’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  english_pob_choice: Stay here tonight
  chosen_korean: 오늘 밤 여기 머무르십시오
  alternatives_korean:
  - 오늘 밤 여기 머무세요
  - 이 밤 여기 묵으십시오
  lexicon: HALOT
  rationale: לון은 ‘머무르다/묵다’의 뜻이므로, 현대 한국어에서는 자연스러운 명령형 ‘머무르십시오’로 옮기고 הַלַּיְלָה는 ‘오늘 밤’으로 풀어 즉시성을 살렸습니다.
- source_word: יִגְאָלֵךְ / לְגָאֳלֵךְ
  english_pob_choice: redeem / to redeem you
  chosen_korean: 무르다 / 무르게 하다
  alternatives_korean:
  - 속량하다
  - 구속하다
  - 기업 무를 책임을 지다
  lexicon: HALOT
  rationale: 룻기의 גאל은 단순한 종교적 ‘구속’보다 가족-법적 ‘기업 무름’의 의미가 핵심이므로, 본문에는 이를 드러내는 ‘무르다’를 사용하고, 주체적 행위는 ‘무르게 하다’로 살렸습니다.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  english_pob_choice: then I myself will redeem you
  chosen_korean: 내가 친히 당신을 무르겠습니다
  alternatives_korean:
  - 내가 당신을 무르겠습니다
  - 내가 직접 당신의 기업을 무르겠습니다
  lexicon: HALOT
  rationale: אָנֹכִי의 강조를 ‘내가 친히’로 반영했고, 앞뒤 문맥의 대조를 위해 ‘그가… 원하지 않으면’ 뒤에 이어지는 확약으로 자연스럽게 옮겼습니다.
- source_word: חַי יְהוָה
  english_pob_choice: as Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고
  alternatives_korean:
  - 야훼의 살아 계심을 두고
  - 야훼의 삶을 두고
  lexicon: HALOT
  rationale: 히브리어의 맹세 공식은 직역하면 ‘야훼께서 살아 계심을 두고’이며, 한국어에서도 서약의 힘을 유지하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 룻기의 גאל(기업 무름) 용어를 어떻게 드러낼 것인가
  chosen_reading: 본문은 ‘무르다/무르게 하다’로 옮겨 가족-법적 책임을 드러내고, 너무 좁은 교회 용어는 피했습니다.
  alternative_readings:
  - 구속하다
  - 구원하다
  - 기업 무르다
  rationale: 이 동사는 신학적으로 중요한 ‘속량’ 일반이 아니라 보아스의 친족 책임을 가리키므로, 독자가 본문의 사회·법적 배경을 놓치지 않도록 한국어에서 가능한 한 직접적으로 표현했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 예언/서약 발화에서 화자 등록
  chosen_reading: 보아스의 맹세는 서술문 안에서 합쇼체를 유지하고, 직접적인 맹세 공식만 원문 흐름대로 살렸습니다.
  alternative_readings:
  - 더 경어적인 종교문체
  - 개역식 서원체
  rationale: 본문의 감정적 긴장과 실제 대화 상황을 보존하기 위해, 과도하게 의례화된 문체보다 현대적이고 명료한 합쇼체를 선택했습니다.
  doctrine_reference: Korean target style guidance
