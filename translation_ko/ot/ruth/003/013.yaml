revisions:
- from: 오늘 밤 여기 머무르십시오. 아침에 만일 그가 당신을 무르려 하면 좋습니다—그가 당신을 무르게 하십시오. 그러나 그가 당신을 무르기를 원하지 않으면, 야훼께서 살아 계심을 두고 내가 친히 당신을 무르겠습니다. 아침까지 누워 계십시오.[a]
  to: 오늘 밤 여기 머무르십시오. 아침에 그가 당신을 위하여 기업 무를 책임을 지려 한다면, 좋습니다. 그가 그 책임을 지게 하십시오. 그러나 그가 당신을 위하여 기업 무를 책임을 지려 하지 않으면, 야훼께서 살아 계심을 두고 내가 친히 그 책임을 지겠습니다. 아침까지 누워 계십시오.[a]
  rationale: 수정문은 גאל의 가족-법적 의미를 본문에서 ‘기업 무를 책임을 지다’로 명시하여 한국어의 자연스러움과 원문의 기능을 함께 보존했습니다. ‘좋습니다’ 뒤의 승인 표현도 자연스러운 합쇼체로 고쳤습니다. 화자가 룻에게 직접 쓰는 호칭은 필요한 곳에서만 ‘당신’으로 제한하고, 이후에는 ‘그 책임’으로 받아 반복을 피했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:16:08Z'
