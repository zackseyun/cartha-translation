revisions:
- from: 그는 아침까지 그의 발치에 누워 있다가, 사람들이 서로를 알아보지 못할 때에 일어났습니다. 그리고 그는 말했습니다. "여인이 타작마당에 왔다는 사실을 알리지 마십시오."[a][b]
  to: 그녀는 아침까지 그의 발치에 누워 있다가, 사람들이 서로를 알아보기 전에[a] 일어났습니다. 그리고 그가 말했습니다.[b] “그 여인이 타작마당에 왔다는 사실이 알려지지 않게 하십시오.”
  rationale: 여성 단수 동사에 맞춰 룻을 ‘그녀’로 바로잡고, ‘~하기 전에’로 בטרום의 시간 관계를 보존했습니다. 성적 함의는 추가하거나 해소하지 않았습니다. 화자는 원문처럼 이름을 밝히지 않았으며, 비공개 명령의 수동 의미와 정관사 표현을 반영했습니다.
