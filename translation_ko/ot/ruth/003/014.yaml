base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
  footnotes:
  - marker: a
    text: Or, “before a man could recognize his companion.” The Hebrew idiom means before people could distinguish one another in the low light.
    reason: lexical_alternative
  - marker: b
    text: The speaker is most likely Boaz from the context, though the Hebrew text says only, “And he said.”
    reason: alternative_reading
translation:
  language: ko
  text: 그는 아침까지 그의 발치에 누워 있다가, 사람들이 서로를 알아보지 못할 때에 일어났습니다. 그리고 그는 말했습니다. "여인이 타작마당에 왔다는 사실을 알리지 마십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 낮은 빛 때문에 사람들이 서로를 구분할 수 없을 때를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 화자는 보아스일 가능성이 크지만, 히브리어 본문은 단지 “그리고 그가 말했다”라고만 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  english_pob_choice: at his feet
  chosen_korean: 그의 발치에
  alternatives_korean:
  - 그의 발밑에
  - 그의 발 가까이에
  lexicon: HALOT
  rationale: 발치라는 표현이 ‘feet’의 공간적 의미를 자연스럽게 살리면서도, 단순한 신체 부위가 아니라 사람이 누워 있던 자리의 위치를 한국어로 idiomatic하게 전달합니다.
- source_word: בטרום יכיר איש את רעהו
  english_pob_choice: before one man could recognize another
  chosen_korean: 사람들이 서로를 알아보지 못할 때에
  alternatives_korean:
  - 한 사람이 다른 사람을 알아보기 전에
  - 한 사람이 그의 동료를 알아볼 수 있기 전에
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 어스름한 시간에 상호 식별이 어려웠다는 점이므로, 한국어에서는 그 의미를 풀어 ‘서로를 알아보지 못할 때’로 옮겨 자연스럽게 재현했습니다.
- source_word: אל יוודע
  english_pob_choice: Do not let it be known
  chosen_korean: 알리지 마십시오
  alternatives_korean:
  - 알려지지 않게 하십시오
  - 알게 하지 마십시오
  lexicon: HALOT
  rationale: 부정 수동/금지의 뉘앙스를 현대 한국어의 공손한 금지 명령으로 옮겼습니다. 내용상 비밀 유지 요청이므로 ‘알리지 마십시오’가 가장 직접적입니다.
- source_word: האשה הגרן
  english_pob_choice: the woman came to the threshing floor
  chosen_korean: 여인이 타작마당에 왔다는 사실
  alternatives_korean:
  - 그 여자가 타작마당에 왔다는 것
  - 그 여인이 타작마당으로 왔다는 사실
  lexicon: HALOT
  rationale: 본문의 정관사 ‘the woman’과 장소 표현을 보존하되, 한국어에서는 보고/전언의 목적절 형태로 자연스럽게 재구성했습니다. ‘타작마당’은 הגרן의 표준적 대응어입니다.
theological_decisions:
- issue: 화자가 익명으로 제시됨
  chosen_reading: 본문처럼 ‘그는’으로 두어 화자를 이름 없이 유지했습니다.
  alternative_readings:
  - 보아스가 말했다고 명시하기
  - 주어를 아예 생략하기
  rationale: 문맥상 보아스로 읽히지만 히브리어 본문은 단지 ‘그리고 그가 말했다’라고만 하므로, 서술의 절제와 원문 투명성을 위해 익명 처리를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 룻의 위치 묘사와 성적 함의
  chosen_reading: 단순한 공간 묘사인 ‘그의 발치에 누워 있다가’를 유지했습니다.
  alternative_readings:
  - 성적 함의를 드러내거나 완화하는 해석적 표현
  - 관계의 순결을 명시적으로 부정하는 표현
  rationale: 본문은 위치와 시간만 말할 뿐이므로, 논쟁적 함의를 번역이 미리 해석해 버리지 않도록 원문 수준의 절제된 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
