source:
  edition: WLC
  text: וְ/רָחַ֣צְתְּ וָ/סַ֗כְתְּ וְ/שַׂ֧מְתְּ שמלת/ך עָלַ֖יִ/ךְ ו/ירדתי הַ/גֹּ֑רֶן אַל תִּוָּדְעִ֣י לָ/אִ֔ישׁ עַ֥ד כַּלֹּת֖/וֹ לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
  footnotes:
  - marker: a
    text: Or 'bathe yourself.' The Hebrew verb can denote washing or bathing the body.
    reason: lexical_alternative
  - marker: b
    text: Or 'put on your garment.' The Hebrew refers generally to an outer garment or cloak; some translations interpret this more specifically as festive or best clothing.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew consonantal form is unusual here; in context it is commonly understood as Naomi''s continued instruction to Ruth: ''go down to the threshing floor.'''
    reason: textual_variant
translation:
  language: ko
  text: 몸을 씻고[a], 몸에 기름을 바르고, 겉옷을 입은 다음 타작마당으로 내려가십시오[c][b]. 그가 먹고 마시기를 마칠 때까지 그 사람에게 자신을 드러내지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몸을 씻다’는 ‘목욕하다’까지 포함할 수 있는 히브리어 רָחַץ의 넓은 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘겉옷’은 히브리어 שִׂמְלָה의 일반적인 외투 또는 겉의복이라는 의미를 따른 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 마소라 본문의 형태는 특이하지만, 문맥상 ‘내려가십시오’로 이해하는 것이 일반적입니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  english_pob_choice: Wash yourself
  chosen_korean: 몸을 씻고
  alternatives_korean:
  - 목욕하고
  - 몸을 씻으시고
  lexicon: HALOT
  rationale: רחץ는 몸을 씻거나 목욕하는 뜻이므로, 현대 한국어에서 자연스럽고 과도하게 좁히지 않는 ‘몸을 씻다’로 옮겼습니다.
- source_word: וָסַכְתְּ
  english_pob_choice: anoint yourself
  chosen_korean: 몸에 기름을 바르고
  alternatives_korean:
  - 기름을 바르고
  - 향유를 바르고
  lexicon: HALOT
  rationale: סוך는 기름/연고로 바르는 행위이므로, 문맥상 화장품적 ‘향유’보다 원뜻을 더 직접 반영하는 표현을 택했습니다.
- source_word: וְשַׂמְתְּ שמלת/ך עָלַיִ/ךְ
  english_pob_choice: put your cloak on
  chosen_korean: 겉옷을 입은 다음
  alternatives_korean:
  - 외투를 입은 다음
  - 옷을 입은 다음
  - 겉옷을 걸친 다음
  lexicon: HALOT
  rationale: שִׂמְלָה는 일반적으로 겉옷/외투 성격의 의복을 가리키므로, ‘겉옷’이 가장 무난하게 원뜻을 살립니다.
- source_word: וירדתי הַ/גֹּרֶן
  english_pob_choice: then go down to the threshing floor
  chosen_korean: 타작마당으로 내려가십시오
  alternatives_korean:
  - 타작마당으로 가십시오
  - 타작마당으로 내려가 보십시오
  lexicon: HALOT
  rationale: גֹּרֶן은 ‘타작마당’이 표준적이며, 동사의 방향성은 ‘내려가다’로 살렸습니다. 문맥상 명령형으로 자연스럽게 정리했습니다.
- source_word: אַל תִּוָּדְעִי לָאִישׁ
  english_pob_choice: Do not make yourself known to the man
  chosen_korean: 그 사람에게 자신을 드러내지 말고
  alternatives_korean:
  - 그 사람에게 알려지지 말고
  - 그 사람에게 자신을 밝히지 말고
  - 그 남자에게 드러나지 말고
  lexicon: HALOT
  rationale: ידע의 니팔형은 ‘알려지다/드러나다’의 수동·반사적 뉘앙스를 가지므로, 한국어에서는 ‘자신을 드러내다’가 그 긴장을 잘 보존합니다.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  english_pob_choice: until he has finished eating and drinking
  chosen_korean: 그가 먹고 마시기를 마칠 때까지
  alternatives_korean:
  - 그가 먹고 마시기를 끝낼 때까지
  - 그가 먹고 마신 뒤까지
  lexicon: HALOT
  rationale: כלה는 동작의 완결을 나타내므로, ‘마칠 때까지’가 가장 직설적이고 문맥에 맞습니다.
