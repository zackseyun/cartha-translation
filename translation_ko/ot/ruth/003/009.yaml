id: RUT.3.9
reference: Ruth 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִי אָ֑תּ וַ/תֹּ֗אמֶר אָנֹכִי֙ ר֣וּת אֲמָתֶ֔/ךָ וּ/פָרַשְׂתָּ֤ כְנָפֶ֨/ךָ֙ עַל אֲמָ֣תְ/ךָ֔ כִּ֥י גֹאֵ֖ל אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
  footnotes:
  - marker: a
    text: Or 'Spread the corner of your garment over your servant.' The Hebrew word can mean 'wing' or the edge of a garment, and the wording may intentionally suggest both protection and a marriage claim.
    reason: lexical_alternative
  - marker: b
    text: Or 'a kinsman-redeemer,' that is, a family redeemer with a recognized obligation to act on behalf of a relative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a], "누구십니까?" 그녀가 대답했습니다. "저는 당신의 여종 룻입니다. 당신의 여종[b] 위에 당신의 날개를 펴십시오. 당신은 기업 무를 자이기 때문입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 옷자락을 펴십시오.' 히브리어는 '날개'와 옷의 가장자리를 모두 뜻할 수 있으며, 보호와 혼인 청원을 함께 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '기업 무를 자,' 곧 친족에게 대한 의무를 지닌 가족 구속자를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  english_pob_choice: Who are you?
  chosen_korean: 누구십니까?
  alternatives_korean:
  - 누구입니까?
  - 누구세요?
  lexicon: HALOT
  rationale: 정체를 묻는 직접 질문이므로 간결하게 옮기되, 대화체의 공손함을 살려 합쇼체 의문형을 사용했습니다.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 종
  - 당신의 여자종
  - 당신의 여종/여종아이
  lexicon: HALOT
  rationale: אמה는 여성 종을 가리키므로, 성별이 드러나도록 '여종'으로 옮겼습니다. '종'만 쓰면 성별 정보가 약해집니다.
- source_word: כְנָפֶךָ
  english_pob_choice: your wing
  chosen_korean: 당신의 날개
  alternatives_korean:
  - 당신의 옷자락
  - 당신의 덮개
  - 당신의 겉자락
  lexicon: HALOT
  rationale: 본문의 비유적 긴장을 살리기 위해 기본적인 직역 이미지를 유지했습니다. 가림과 보호, 그리고 혼인 청원의 이중 뉘앙스를 본문 안에서 열어 두기 위해 '날개'를 선택했습니다.
- source_word: גֹאֵל
  english_pob_choice: a redeemer
  chosen_korean: 기업 무를 자
  alternatives_korean:
  - 구속자
  - 속량자
  - 친족 무를 자
  lexicon: HALOT
  rationale: 룻기 문맥에서 גאל은 단순한 구원자가 아니라 친족의 의무를 지닌 법적 역할을 가리키므로, 한국어 성경 전통에서 문맥을 가장 잘 드러내는 '기업 무를 자'를 사용했습니다.
theological_decisions:
- issue: ‘날개’ 이미지의 보존 여부
  chosen_reading: 본문에는 '당신의 날개'를 유지하고, 가림/보호와 혼인 요청의 의미를 곧바로 해소하지 않았습니다.
  alternative_readings:
  - 당신의 옷자락을 펴십시오
  - 당신의 덮개를 펴십시오
  rationale: 히브리어 כָּנָף는 문자적 날개와 의복 가장자리의 뜻을 함께 환기할 수 있으므로, 본문이 의도한 상징적 중첩을 보존하는 편이 더 충실합니다.
  doctrine_reference: 번역 원칙 §1 원문 우선, §3 신학적·문학적 긴장 보존
- issue: גֹאֵל의 법적·가족적 의미
  chosen_reading: '''기업 무를 자''로 번역해 친족법상의 책임과 회복 기능을 드러냈습니다.'
  alternative_readings:
  - 구속자
  - 친족 구속자
  - 가족 구속자
  rationale: 룻기에서 גֹאֵל은 추상적 구원 개념보다 가족 내 책임을 수행하는 인물이라는 점이 중요하므로, 그 법적·관계적 의미를 함께 살릴 수 있는 표현을 선택했습니다.
  doctrine_reference: 룻기 친족구속 제도, 레위기 25장 배경
