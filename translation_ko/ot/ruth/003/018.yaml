source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔/י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔י/ן אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָ/אִ֔ישׁ כִּֽי אִם כִּלָּ֥ה הַ/דָּבָ֖ר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
  footnotes:
  - marker: a
    text: Or, “how the matter will turn out.” The Hebrew idiom is literally “how the matter will fall.”
    reason: lexical_alternative
  - marker: b
    text: “The man” refers to Boaz, though the Hebrew keeps the expression indefinite rather than naming him here.
    reason: cross_reference
translation:
  language: ko
  text: 그녀가 말했습니다. “내 딸아, 그 일이 어떻게 될지 알게 될 때까지 기다리십시오. 그 사람은 오늘 그 일을 마칠 때까지는 쉬지 않을 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기다리십시오’는 히브리어 명령형 שְׁבִי의 문자적 뜻인 ‘앉다’ 또는 ‘머물다’를 이 문맥의 실질적 의미에 따라 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 일이 어떻게 될지’는 히브리어 관용구 אֵיךְ יִפֹּל דָּבָר의 직역인 “일이 어떻게 떨어질지”를 한국어답게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי
  english_pob_choice: Wait
  chosen_korean: 앉아 있으십시오
  alternatives_korean:
  - 기다리십시오
  - 가만히 계십시오
  - 머무르십시오
  lexicon: HALOT
  rationale: 히브리어 명령형은 문자적으로 ‘앉다/머물다’의 뜻이지만, 이 장면에서는 결과를 기다리며 자리에 머물라는 실질적 의미가 강하므로, 합쇼체에서 자연스럽고 지시력이 분명한 표현으로 옮겼습니다.
- source_word: בִתִּי
  english_pob_choice: my daughter
  chosen_korean: 내 딸아
  alternatives_korean:
  - 딸아
  - 내 딸
  lexicon: HALOT
  rationale: 나오미의 애정 어린 호칭을 보존하기 위해 소유격을 살렸고, 직접 부름의 뉘앙스를 드러내기 위해 호격형으로 처리했습니다.
- source_word: אֵיךְ יִפֹּל דָּבָר
  english_pob_choice: how the matter will fall out
  chosen_korean: 일이 어떻게 되어 갈지
  alternatives_korean:
  - 그 일이 어떻게 될지
  - 일이 어떻게 떨어질지
  - 일이 어떻게 마무리될지
  lexicon: HALOT
  rationale: 직역의 ‘떨어지다’ 이미지를 한국어에서 자연스럽게 유지하기 어려워, 관용적으로 ‘일이 어떻게 되어 갈지’로 옮기되 아직 확정되지 않은 전개라는 원문 감각을 살렸습니다.
- source_word: יִשְׁקֹט / כִּלָּה הַדָּבָר
  english_pob_choice: will not rest unless he has settled the matter
  chosen_korean: 그 일은 … 그 일을 마치기 전에는 쉬지 않을 것입니다
  alternatives_korean:
  - 그 일을 정리하기 전에는 쉬지 않을 것입니다
  - 그 일을 끝내기 전에는 쉬지 않을 것입니다
  - 그 일을 해결하기 전에는 쉬지 않을 것입니다
  lexicon: HALOT
  rationale: יִּשְׁקֹט의 ‘쉬다/가만히 있다’와 כִּלָּה의 ‘마치다/완료하다’를 함께 반영하되, 관계와 절차가 걸린 맥락을 고려해 ‘마치기’로 번역했습니다.
theological_decisions:
- issue: 본문이 남자(Booz)의 이름을 생략하고 ‘그 사람’이라고 하는 점
  chosen_reading: 히브리어의 비지시적 표현을 따라 ‘그 사람’으로 두어, 독자가 문맥으로 보아 인물을 파악하게 했습니다.
  alternative_readings:
  - 보아스라고 풀어 쓰는 번역
  - 그가로 바꾸는 번역
  rationale: 본문이 의도적으로 인명을 숨기고 일반 명사로 말하는 효과를 유지하는 편이, 서사 진행과 긴장감을 더 잘 보존합니다.
  doctrine_reference: 서사 문맥 보존 및 원문 수사학 존중
- issue: ‘마치다/끝내다’ 대신 ‘쉬지 않다’와 결합된 완료 표현의 관계
  chosen_reading: ‘오늘 그 일을 마치기 전에는 쉬지 않을 것입니다’로 옮겨, 행위의 지속성과 완료 조건을 함께 드러냈습니다.
  alternative_readings:
  - ‘오늘 그 일을 해결하기 전에는’
  - ‘오늘 그 일을 끝내기 전에는’
  rationale: כִּלָּה는 단순 종결이 아니라 미결 사안을 끝내는 뉘앙스가 있어, 결과를 서둘러 처리하려는 보아스의 결연함을 보존하는 번역이 필요합니다.
  doctrine_reference: 원문 의미 범위 보존
