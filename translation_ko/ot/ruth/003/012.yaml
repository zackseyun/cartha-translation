id: RUT.3.12
reference: Ruth 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
  footnotes:
  - marker: a
    text: Or 'kinsman-redeemer' or 'guardian-redeemer'; the Hebrew term refers to a near relative with recognized family redemption responsibilities.
    reason: lexical_alternative
  - marker: b
    text: '''Closer'' here means more closely related in terms of family redemption rights, not merely physically nearer.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이제는, 내가 한 친족 구속자이기는 하나[a], 나보다 더 가까운 친족 구속자도 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기업 무를 자’나 ‘가까운 친족 구속자’로 옮길 수 있습니다. 이 히브리어는 가족의 구속 책임을 지닌 가까운 친척을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제는
  alternatives_korean:
  - 이제는
  - 그리고 지금은
  lexicon: HALOT
  rationale: 전환 접속사 ו와 시간 표지 עתה를 함께 살려 담화 전환을 자연스럽게 표시했습니다.
- source_word: גֹאֵל
  english_pob_choice: redeemer
  chosen_korean: 친족 구속자
  alternatives_korean:
  - 구속자
  - 기업 무를 자
  - 가까운 친족 구속자
  lexicon: HALOT
  rationale: 본문의 גֹאֵל은 단순한 종교적 ‘구속자’가 아니라 가족·법적 의무를 지닌 근친 구속자이므로, 의미를 드러내는 ‘친족 구속자’를 채택했습니다.
- source_word: קָרוֹב מִמֶּנִּי
  english_pob_choice: closer than I
  chosen_korean: 나보다 더 가까운
  alternatives_korean:
  - 나보다 더 가까운 친족
  - 나보다 더 가까운 관계에 있는
  - 나보다 더 가까운 분
  lexicon: HALOT
  rationale: ‘가깝다’는 물리적 거리보다 친족권의 우선순위를 가리키므로, 문맥을 살려 ‘나보다 더 가까운’으로 옮겼습니다.
theological_decisions:
- issue: גֹאֵל의 한국어 처리
  chosen_reading: 친족 구속자
  alternative_readings:
  - 구속자
  - 기업 무를 자
  rationale: 이 장면은 추상적 구원이 아니라 이스라엘의 친족 구속 의무를 다루므로, 본문의 법적·가족적 의미가 드러나도록 번역했습니다.
  doctrine_reference: Translation philosophy §§1, 5
