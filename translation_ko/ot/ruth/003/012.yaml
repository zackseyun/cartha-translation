    issue: 확언 표현 כִּי אָמְנָם이 번역에서 누락되었습니다.
    rationale: 이 표현은 보아스가 자신의 친족 구속자 지위를 분명히 인정하는 확언입니다. ‘참으로’ 또는 ‘사실’로 반영하는 것이 안전합니다.
  - severity: medium
    issue: 각주 표지가 ‘친족 구속자’가 아니라 양보절 끝의 ‘하나’에 붙어 있습니다.
    rationale: 현 각주는 גֹאֵל의 번역 대안을 설명하므로 해당 용어에 직접 붙어야 합니다. 또한 ‘더 가까운’이 친족상 우선권을 뜻한다는 영어 감사 이력의 설명도 보존할 필요가 있습니다.
  - severity: low
