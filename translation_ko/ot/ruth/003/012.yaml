base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
  footnotes:
  - marker: a
    text: Or 'kinsman-redeemer' or 'guardian-redeemer'; the Hebrew term refers to a near relative with recognized family redemption responsibilities.
    reason: lexical_alternative
  - marker: b
    text: '''Closer'' here means more closely related in terms of family redemption rights, not merely physically nearer.'
    reason: cultural_note
translation:
  language: ko
  text: 이제, 참으로 내가 친족 구속자이기는 합니다[a]. 그러나 나보다 더 가까운 친족 구속자가 또 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기업 무를 자’ 또는 ‘가까운 친족 구속자’로 옮길 수 있습니다. 이 히브리어는 가족의 구속 책임을 지닌 가까운 친척을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘더 가까운’은 단지 물리적으로 더 가까움을 뜻하는 것이 아니라, 가족 구속의 권리와 책임에서 더 가까운 친족 관계, 곧 우선권이 있음을 뜻합니다.
    reason: cultural_note
