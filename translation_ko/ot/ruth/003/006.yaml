lexical_decisions:
- source_word: וַתֵּרֶד
  english_pob_choice: went down
  chosen_korean: 내려가서
  alternatives_korean:
  - 갔습니다
  - 내려왔습니다
  lexicon: HALOT
  rationale: ירד의 기본 방향성인 ‘내려감’을 그대로 살리면서, 한국어 서술 흐름에 자연스럽게 연결했습니다.
