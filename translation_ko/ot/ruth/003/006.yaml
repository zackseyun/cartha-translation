  alternatives_korean:
  - 모두 그대로
  - 전부 그대로
  lexicon: HALOT
  rationale: ‘according to all that’의 포괄성과 준수의 의미를 자연스러운 한국어 관용으로 옮겼습니다.
- source_word: צִוַּתָּה
  english_pob_choice: had commanded
  chosen_korean: 명령한
  alternatives_korean:
