  verdict: revise
  source_fidelity: 첫 절에서 בְּשָׁכְבוֹ의 시간 표현(“그가 누울 때에”)이 빠졌고, “발치를 들고”는 וְגִלִּית(‘드러내다, 벗기다’)를 ‘들다’로 옮겨 원문의 동작을 바꿉니다. 또한 מַרְגְּלֹתָיו의 기본 뜻은 ‘그의 발’이며, 넓은 의미 가능성은 각주에서 보존하는 편이 적절합니다.
  naturalness: “그가 누울 때에, 그가 어느 곳에 눕는지 알아 두십시오”는 반복을 과도하게 피하지 않으면서도 현대 표준 한국어 합쇼체로 자연스럽습니다. “그의 발을 드러내고 누우십시오”도 지시문의 순서와 원문의 의도적 모호성을 자연스럽게 유지합니다.
  terminology: ‘발’은 מַרְגְּלֹתָיו의 기본 번역으로 적절하며, ‘발치/몸의 아래 부분’ 가능성은 각주에서 제한적으로 제시합니다. 케티브/케레 차이는 본문에서 문맥상 2인칭으로 번역하고 각주에서 정확히 밝혀야 합니다.
