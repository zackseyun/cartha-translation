source:
  edition: WLC
  text: וִ/יהִ֣י בְ/שָׁכְב֗/וֹ וְ/יָדַ֨עַתְּ֙ אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִשְׁכַּב שָׁ֔ם וּ/בָ֛את וְ/גִלִּ֥ית מַרְגְּלֹתָ֖י/ו ו/שכבתי וְ/הוּא֙ יַגִּ֣יד לָ֔/ךְ אֵ֖ת אֲשֶׁ֥ר תַּעַשִֽׂי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
  footnotes:
  - marker: a
    text: Or possibly 'the place by his feet' or 'the lower part of him'; the Hebrew expression may refer more specifically to the area around his feet than to the feet alone.
    reason: lexical_alternative
  - marker: b
    text: The written Hebrew form reads 'and I lay down,' but the context and traditional reading understand it as 'and you lie down.'
    reason: textual_variant
translation:
  language: ko
  text: 그가 누울 때에, 그가 어느 곳에 눕는지 알아 두십시오. তারপর 가서 그의 발[a]을 드러내고 누우십시오[b]. 그러면 그가 당신이 해야 할 일을 알려 줄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발치’나 ‘몸의 아래 부분’을 가리킬 수 있습니다. 히브리어 표현은 발 자체보다 발 주변이나 아래쪽을 더 구체적으로 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 기록된 히브리어 형태는 ‘그리고 내가 누웠다’라고 읽힙니다. 그러나 문맥과 전통적 독법은 ‘그리고 당신이 누워라’로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  english_pob_choice: Then, when he lies down
  chosen_korean: 그러면 그가 누운 곳을 알아두십시오
  alternatives_korean:
  - 그가 누울 때에
  - 그가 누운 다음에는
  lexicon: HALOT
  rationale: 첫 절은 시간 순서를 여는 নির্দেশ문으로, 한국어에서는 ‘그러면’이 자연스럽고, 이어지는 동작을 돕는 ‘알아두십시오’가 ידע의 실천적 의미를 잘 살립니다.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  english_pob_choice: uncover his feet
  chosen_korean: 그의 발치[a]를 들고
  alternatives_korean:
  - 그의 발을 드러내고
  - 그의 발 아래를 드러내고
  lexicon: HALOT
  rationale: מַרְגְּלֹתָיו는 단순한 ‘발’보다 발이 놓인 자리/발치의 뉘앙스를 가질 수 있어, 본문은 직역에 가깝게 ‘발치’로 두고 footnote로 범위를 밝혔습니다.
- source_word: וְשָׁכָבְתִּי / contextually understood as second person
  english_pob_choice: and lie down
  chosen_korean: 누우십시오[b]
  alternatives_korean:
  - 누우십시오
  - 그곳에 누우십시오
  lexicon: HALOT
  rationale: 마소라 본문 표면형과 문맥상 의도된 2인칭 명령 사이의 긴장을 반영하기 위해 본문에는 자연스러운 명령형을 쓰고, 각주로 히브리어 표면형의 차이를 남겼습니다.
- source_word: וְהוּא יַגִּיד לָךְ
  english_pob_choice: and he will tell you
  chosen_korean: 그러면 그가 당신이 해야 할 일을 알려 줄 것입니다
  alternatives_korean:
  - 그가 당신에게 무엇을 해야 하는지 말해 줄 것입니다
  - 그가 당신에게 할 일을 알려 줄 것입니다
  lexicon: HALOT
  rationale: נגד의 기본 의미를 살리면서, 뒤의 목적절을 한국어 관용에 맞게 풀어 ‘해야 할 일’로 옮겨 지시의 뜻을 분명히 했습니다.
theological_decisions:
- issue: ‘his feet’와 ‘the place by his feet’ 사이의 의미 범위와 내러티브의 긴장
  chosen_reading: 본문은 ‘발치’로 옮겨 직접성을 유지하되, 본문 해석을 성급히 성적 행위나 단순 실무 행위로 확정하지 않았습니다.
  alternative_readings:
  - ‘발 근처’를 뜻하는 완곡어법으로 이해
  - 단순히 그를 깨우기 위한 실무적 동작으로 이해
  rationale: 히브리어 표현이 발 자체보다 발 주변 공간을 가리킬 가능성이 있어, 번역은 모호성을 보존해야 합니다. 본문은 중립적으로 유지하고 각주로 어휘 범위를 밝혀 독자가 원문 긴장을 보게 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
