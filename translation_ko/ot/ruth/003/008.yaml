  text: וַ/יְהִי֙ בַּ/חֲצִ֣י הַ/לַּ֔יְלָה וַ/יֶּחֱרַ֥ד הָ/אִ֖ישׁ וַ/יִּלָּפֵ֑ת וְ/הִנֵּ֣ה אִשָּׁ֔ה שֹׁכֶ֖בֶת מַרְגְּלֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
  footnotes:
  - marker: a
    text: Or 'turned himself'; the Hebrew verb is rare and may suggest he shifted, twisted, or bent himself in surprise.
    reason: lexical_alternative
  - marker: b
    text: Literally 'at his feet'; the Hebrew expression may also refer more broadly to the area of his feet or lower legs.
    reason: lexical_alternative
translation:
  language: ko
  text: 자정쯤에 그 남자가 떨며 몸을 돌렸고, 보니 한 여자가 그의 발치에 누워 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 희귀하여, 놀라 몸을 옮기거나 비트는 동작까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 발들에서/발의 자리에서’이며, 더 넓게는 발이나 다리 주변을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  english_pob_choice: And it happened at midnight
  chosen_korean: 자정쯤에
  alternatives_korean:
  - 한밤중에
  - 한밤의 한가운데에
  lexicon: HALOT
  rationale: 히브리어의 사건 전환과 시간 표지를 자연스러운 현대 한국어로 압축해 옮기되, 서술 흐름은 유지했습니다.
- source_word: וַיֶּחֱרַד
  english_pob_choice: trembled
  chosen_korean: 떨며
  alternatives_korean:
  - 깜짝 놀라
  - 몸을 떨며
  lexicon: HALOT
  rationale: חרד의 신체적 반응을 살려 ‘떨다’로 옮겼고, 감정의 원인을 지나치게 특정하지 않았습니다.
- source_word: וַיִּלָּפֵת
  english_pob_choice: turned himself
  chosen_korean: 몸을 돌렸고
  alternatives_korean:
  - 몸을 비틀었고
  - 자세를 바꾸었고
  lexicon: HALOT
  rationale: 희귀 동사의 정확한 동작은 문맥상 단정하기 어려우므로, POB의 ‘turned himself’처럼 몸의 방향이 바뀌는 동작을 무리 없이 드러냈습니다.
- source_word: מַרְגְּלֹתָיו
  english_pob_choice: at his feet
  chosen_korean: 그의 발치에
  alternatives_korean:
  - 그의 발 앞에
  - 그의 발가에
  lexicon: HALOT
  rationale: 직역하면 ‘발들/발의 자리’에 해당하지만, 한국어에서는 ‘발치’가 자연스럽게 위치와 거리감을 함께 전달합니다.
theological_decisions:
- issue: 루스의 위치 표현이 성적 함의를 갖는지 여부
  chosen_reading: 본문은 그저 루스가 보아스의 발치에 누워 있었다고 직설적으로 옮깁니다.
  alternative_readings:
  - 더 완곡하게 ‘발의 자리’로 돌려 말하기
  - 암시를 강하게 드러내는 방식으로 번역하기
  rationale: 히브리어 자체는 성적 행위를 말하지 않으므로, 서술이 주는 긴장감은 유지하되 본문에 없는 판단이나 암시를 주입하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: 서술의 긴장을 해소하지 말고 보존할 것; 원어 우선 원칙'
