  rationale: חרד의 신체적 반응을 살려 ‘떨다’로 옮겼고, 감정의 원인을 지나치게 특정하지 않았습니다.
- source_word: וַיִּלָּפֵת
  english_pob_choice: turned himself
  chosen_korean: 몸을 돌렸고
  alternatives_korean:
  - 몸을 비틀었고
  - 자세를 바꾸었고
  lexicon: HALOT
  rationale: 희귀 동사의 정확한 동작은 문맥상 단정하기 어려우므로, POB의 ‘turned himself’처럼 몸의 방향이 바뀌는 동작을 무리 없이 드러냈습니다.
- source_word: מַרְגְּלֹתָיו
  english_pob_choice: at his feet
  chosen_korean: 그의 발치에
  alternatives_korean:
  - 그의 발 앞에
  - 그의 발가에
  lexicon: HALOT
  rationale: 직역하면 ‘발들/발의 자리’에 해당하지만, 한국어에서는 ‘발치’가 자연스럽게 위치와 거리감을 함께 전달합니다.
theological_decisions:
- issue: 루스의 위치 표현이 성적 함의를 갖는지 여부
  chosen_reading: 본문은 그저 루스가 보아스의 발치에 누워 있었다고 직설적으로 옮깁니다.
  alternative_readings:
  - 더 완곡하게 ‘발의 자리’로 돌려 말하기
  - 암시를 강하게 드러내는 방식으로 번역하기
  rationale: 히브리어 자체는 성적 행위를 말하지 않으므로, 서술이 주는 긴장감은 유지하되 본문에 없는 판단이나 암시를 주입하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: 서술의 긴장을 해소하지 말고 보존할 것; 원어 우선 원칙'
