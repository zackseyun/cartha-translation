  text: וַ/תָּבוֹא֙ אֶל חֲמוֹתָ֔/הּ וַ/תֹּ֖אמֶר מִי אַ֣תְּ בִּתִּ֑/י וַ/תַּ֨גֶּד לָ֔/הּ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה לָ֖/הּ הָ/אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'How did it go with you, my daughter?' The Hebrew reads literally, 'Who are you, my daughter?' and may imply a question about Ruth's changed status or the outcome of her meeting.
    reason: alternative_reading
translation:
  language: ko
  text: 그녀가 시어머니에게로 돌아와서 말했습니다. “어머니, 누구십니까?” 그러고 나서 그 여인은 자기가 받은 모든 것을 그에게서 자세히 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 보다 해석적으로는 ‘어떻게 되었습니까, 내 딸아?’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘누구십니까, 내 딸아?’라고 되어 있으며, 룻의 달라진 상태나 그 만남의 결과를 묻는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  english_pob_choice: When she came to her mother-in-law
  chosen_korean: 그녀가 시어머니에게로 돌아와서
  alternatives_korean:
  - 그녀가 시어머니에게 왔을 때
  - 그녀가 시어머니에게 돌아왔습니다
  lexicon: HALOT
  rationale: 시어머니는 חֲמוֹתָהּ의 자연스러운 대응이며, 전후 문맥상 ‘돌아와서’가 장면 전환을 매끄럽게 살립니다.
- source_word: מִי אַתְּ בִּתִּי
  english_pob_choice: Who are you, my daughter?
  chosen_korean: 어머니, 누구십니까?
  alternatives_korean:
  - 누구십니까, 내 딸아?
  - 어찌된 일이십니까, 내 딸아?
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘누구십니까, 내 딸아?’이지만, 한국어에서는 상대를 부르는 호칭을 앞에 두어 자연스러운 대화문으로 옮겼습니다. 다만 본문의 낯선 질문성을 살리기 위해 ‘어찌된 일이십니까’로 완전히 풀지 않았습니다.
- source_word: וַתַּגֶּד לָהּ אֵת כָּל אֲשֶׁר עָשָׂה לָהּ הָאִישׁ
  english_pob_choice: Then she told her all that the man had done for her.
  chosen_korean: 그러고 나서 그 여인은 자기가 받은 모든 것을 그에게서 자세히 말했습니다.
  alternatives_korean:
  - 그리고 그녀는 그 남자가 자기에게 한 모든 일을 말했습니다
  - 그러고 나서 그 여인은 그 남자가 자기에게 해 준 모든 일을 말했습니다
  lexicon: HALOT
  rationale: נגד는 ‘말하다/알리다’의 뜻이므로 ‘자세히 말했습니다’로 살렸고, עשה + ל는 해악이 아니라 유익한 행위를 가리키므로 ‘해 준/받은’ 쪽 의미를 반영했습니다.
theological_decisions:
- issue: 마지막 절의 익명성
  chosen_reading: 이 절에서 보아스의 이름을 굳이 넣지 않고 ‘그 여인’과 ‘그’로 남겼습니다.
  alternative_readings:
  - ‘보아스가’로 명시하기
  - 이름을 생략하지 않고 해설적으로 풀기
  rationale: 히브리어는 마지막 절에서 의도적으로 ‘그 남자’를 사용하므로, 서술의 긴장과 익명성을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 서사 문맥 보존 원칙
- issue: ‘Who are you?’의 해석
  chosen_reading: 본문의 직역적 질문성을 완전히 평서문으로 바꾸지 않고, 한국어에서는 대화 상대를 묻는 형식으로 최소한만 조정했습니다.
  alternative_readings:
  - ‘어찌된 일이십니까?’로 의미를 완전 해석하기
  - ‘지금 누구십니까?’로 상태 변화를 드러내기
  rationale: 영어 POB가 각주에서 지적하듯 히브리어는 문자적으로 ‘누구십니까’이지만, 문맥상 상태/결과를 묻는 함의가 있을 수 있어 본문은 너무 해석하지 않고 각주로 여지를 남기는 것이 적절합니다.
  doctrine_reference: 번역-주해 경계 원칙
