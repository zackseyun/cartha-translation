revisions:
- from: 그녀가 시어머니에게로 돌아와서 말했습니다. “어머니, 누구십니까?” 그러고 나서 그 여인은 자기가 받은 모든 것을 그에게서 자세히 말했습니다.[a]
  to: 룻이 시어머니에게 왔습니다. 시어머니가 말했습니다. “내 딸아, 너는 누구냐?”[a] 룻은 그 남자가 자기에게 해 준 모든 일을 시어머니에게 말했습니다.
  rationale: 원문의 서사 순서와 발화 관계를 회복했습니다. ‘누구냐’라는 문자적 질문은 본문에 남기되, 상태나 만남의 결과를 묻는 것으로 이해하는 해석적 가능성은 각주에 한정했습니다. 마지막 절은 원문의 익명적 ‘그 남자’ 및 그가 룻을 위해 행한 일을 보존했습니다.
