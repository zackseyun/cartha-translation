base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'So she left the place where she had been.' The Hebrew verb is literally 'went out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그녀는 자기가 있던 곳에서 나왔고, 두 며느리도 함께 있었으며, 그들은 유다 땅으로 돌아가려고 길을 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직접적으로, ‘그녀는 자기가 있던 곳을 떠났습니다.’ 히브리어 동사는 문자적으로는 ‘나갔다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  english_pob_choice: So she went out
  chosen_korean: 그러므로 그녀는 … 나왔고
  alternatives_korean:
  - 그녀는 나갔고
  - 그래서 그녀는 떠났고
  lexicon: HALOT
  rationale: יצא의 기본 동작인 ‘나가다/나오다’를 살려 ‘나왔고’로 옮겼으며, 서술 연결을 위해 ‘그러므로’를 붙였습니다.
- source_word: מִן הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  english_pob_choice: from the place where she had been
  chosen_korean: 자기가 있던 곳에서
  alternatives_korean:
  - 자기가 거하던 곳에서
  - 그곳에서
  lexicon: HALOT
  rationale: 히브리어의 ‘그녀가 거기 있었다’는 거주/체류를 가리키므로, 자연스러운 한국어로 ‘자기가 있던 곳’이라 옮겼습니다.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  english_pob_choice: and her two daughters-in-law with her
  chosen_korean: 두 며느리도 함께 있었으며
  alternatives_korean:
  - 두 며느리도 그녀와 함께 있었으며
  - 두 사위 며느리도 함께 있었으며
  lexicon: HALOT
  rationale: כַּלָּה는 여기서 ‘며느리’가 맞으며, 동반 관계를 살려 ‘함께 있었으며’로 자연스럽게 표현했습니다.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ לָשׁוּב
  english_pob_choice: and they went on the way to return
  chosen_korean: 그들은 … 길을 갔습니다
  alternatives_korean:
  - 그들은 돌아가려고 길을 갔습니다
  - 그들은 돌아가기 위해 길을 갔습니다
  lexicon: HALOT
  rationale: 복수 여성형 동사와 ‘길/דרך’의 이동 이미지를 살리되, 한국어에서 중복이 되는 ‘걷다’를 피하고 서술 흐름에 맞게 ‘길을 갔습니다’로 옮겼습니다.
- source_word: אֶרֶץ יְהוּדָה
  english_pob_choice: the land of Judah
  chosen_korean: 유다 땅
  alternatives_korean:
  - 유다의 땅
  - 유다 지방
  lexicon: HALOT
  rationale: אֶרֶץ를 ‘땅’으로 직접 살려 지리적·언약적 배경을 유지했습니다.
theological_decisions:
- issue: 루트기의 귀환 동기 표현
  chosen_reading: ‘돌아가려고’로 옮겨 שׁוּב의 귀환 동기를 분명히 했습니다.
  alternative_readings:
  - ‘되돌아가려 하여’
  - ‘돌아가려는 길에’
  rationale: 이 절은 단순 이동이 아니라 유다 땅으로의 귀환을 강조하므로, שׁוּב의 방향성을 분명히 드러내는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 서사적 귀환 모티프, 룻기 1장 문맥
- issue: ‘나왔고’와 ‘길을 갔습니다’의 병렬
  chosen_reading: 출발과 진행을 나란히 두어 인물들의 실제 이동을 서술했습니다.
  alternative_readings:
  - 한 문장으로 압축
  - ‘떠났고’로 통합
  rationale: 히브리어의 연속 동작을 너무 추상화하지 않고, 이야기의 물리적 이동을 독자가 따라가게 하는 것이 적절합니다.
  doctrine_reference: 서사 번역 원칙
