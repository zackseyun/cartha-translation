  source_fidelity: 원문의 연속 서사 접속은 인과를 강하게 나타내지 않으므로 ‘그러므로’보다 ‘그래서’ 또는 무표지 연결이 적절합니다. 또한 두 며느리는 나오미와 동행하며, 이어 세 사람이 유다 땅으로 돌아가기 위해 길을 떠나는 동작이 명시되어야 합니다.
  naturalness: 초안의 ‘두 며느리도 함께 있었으며’는 이동 중 동행을 나타내는 문맥에서 다소 정태적으로 들리고, ‘길을 갔습니다’는 현대 한국어에서 부자연스럽습니다. ‘함께 떠났습니다’와 ‘길을 떠났습니다’가 자연스럽습니다.
  terminology: ‘며느리’, ‘유다 땅’, ‘돌아가려고’는 각각 כַּלָּה, אֶרֶץ יְהוּדָה, לָשׁוּב을 정확하고 자연스럽게 반영합니다. ‘그녀’는 지시 대상이 분명한 문맥에서 유지할 수 있습니다.
