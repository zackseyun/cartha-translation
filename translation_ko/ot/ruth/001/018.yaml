translation:
  language: ko
  text: 나오미는 루스가 나오미와 함께 가기로 굳게 결심한 것을 보고, 더 이상 루스에게 말하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  english_pob_choice: When she saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았을 때
  - 그때 보니
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서, 인지 동사의 결과를 앞절에 매끄럽게 연결합니다.
- source_word: מִתְאַמֶּצֶת
  english_pob_choice: was determined
  chosen_korean: 굳게 결심한
  alternatives_korean:
  - 스스로 강해지는
  - 결연한
  - 단단히 마음먹은
  lexicon: HALOT
  rationale: 히트파엘이 담는 ‘스스로를 강하게 함/굳게 함’의 의미를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לָלֶכֶת אִתָּהּ
  english_pob_choice: to go with her
  chosen_korean: 자기와 함께 가려고
  alternatives_korean:
  - 그녀와 함께 가려고
  - 그녀를 따라가려고
  lexicon: HALOT
  rationale: 동행 의도를 분명히 드러내며, 히브리어 목적부정사구의 방향성을 자연스럽게 반영합니다.
- source_word: וַתֶּחְדַּל לְדַבֵּר אֵלֶיהָ
  english_pob_choice: she stopped speaking to her
  chosen_korean: 그에게 더 이상 말하지 않았습니다
  alternatives_korean:
  - 그에게 말하기를 멈췄습니다
  - 그에게 더 이상 말하는 것을 그쳤습니다
  lexicon: HALOT
  rationale: חדל + לדבר는 단순한 정적의 중단이므로, 회화체를 피하면서도 ‘말하지 않았다’는 결과를 간결하게 전달합니다.
theological_decisions:
- issue: 나오미가 말을 멈춘 행위의 의미
  chosen_reading: 루스의 결심을 확인한 뒤 더 이상의 설득을 중단한 것으로 옮겼습니다.
  alternative_readings:
  - 감정적으로 말문이 막힌 것으로 옮길 수 있음
  - 단순히 대화를 끝낸 것으로 옮길 수 있음
  rationale: 문맥상 도덕적·신학적 해석을 덧붙이기보다, 서술이 보여 주는 대화 중단 자체를 그대로 반영하는 것이 가장 안전합니다.
  doctrine_reference: 서사 본문 해석 원칙
