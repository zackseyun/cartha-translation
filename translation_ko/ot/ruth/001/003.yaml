  source_fidelity: 히브리어는 엘리멜렉의 죽음 뒤에 나오미와 그녀의 두 아들이 남았음을 진술합니다. 초안의 ‘나오미와 두 아들만’은 문맥상 이해 가능하지만, ‘만’은 원문에 명시된 한정 표현이 아니므로 피하는 편이 더 충실합니다. ‘나오미와 두 아들이 남았습니다’는 הִיא וּשְׁנֵי בָנֶיהָ의 병렬 주어를 자연스럽게 보존합니다.
  naturalness: ‘그때’와 ‘그리고’의 연속은 현대 한국어 합쇼체 서사에서 자연스럽습니다. 다만 각 절을 한 문장으로 연결하면 원문의 긴밀한 서술 진행을 더 매끄럽게 드러낼 수 있습니다.
  terminology: ‘엘리멜렉’, ‘나오미’, ‘남편’, ‘아들’은 표준적인 인명 표기와 문맥상 적절한 관계어입니다. 각주 인용문의 ‘그녀 곧 그녀와’는 비문이므로 바로잡아야 합니다.
