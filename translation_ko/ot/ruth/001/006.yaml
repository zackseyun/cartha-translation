  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
  footnotes:
  - marker: a
    text: Or "bread"; Hebrew lechem often means bread specifically, but can also refer more broadly to food or provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나오미는 며느리들과 함께 일어나 모압의 들에서 돌아왔습니다. 모압의 들에 있을 때 야훼께서 그들에게 먹을 것[a]을 주시어 자기 백성을 돌보셨다는 소식을 들었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빵’. 히브리어 레헴은 보통 ‘빵’을 뜻하지만, 여기서는 더 넓게 ‘먹을 것’이나 ‘양식’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  english_pob_choice: Then she arose
  chosen_korean: 일어나
  alternatives_korean:
  - 그때 일어나
  - 그때 일어났습니다
  lexicon: HALOT
  rationale: 서술의 다음 동작을 자연스럽게 이어 주는 동사로, 합쇼체 서술에 맞게 간결하게 옮겼습니다.
- source_word: וְכַלֹּתֶיהָ
  english_pob_choice: with her daughters-in-law
  chosen_korean: 두 며느리와 함께
  alternatives_korean:
  - 그리고 두 며느리와
  - 며느리들과 함께
  lexicon: HALOT
  rationale: 동반의 의미를 살려 ‘함께’로 옮겼고, 관계를 분명히 하기 위해 ‘며느리’로 표현했습니다.
- source_word: מִשְּׂדֵי מוֹאָב / בִּשְׂדֵה מוֹאָב
  english_pob_choice: from the fields of Moab / in the field of Moab
  chosen_korean: 모압의 들
  alternatives_korean:
  - 모압의 들판
  - 모압 지방
  lexicon: HALOT
  rationale: 반복되는 שׂדה의 구체적 이미지를 살리기 위해 ‘들’로 일관되게 옮겼습니다.
- source_word: שָׁמְעָה
  english_pob_choice: she had heard
  chosen_korean: 들었기 때문입니다
  alternatives_korean:
  - 들었던 것입니다
  - 들었기 때문이었습니다
  lexicon: HALOT
  rationale: 앞선 귀환의 이유를 나타내는 배경 설명으로 자연스럽게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 언약명을 제목형 대체어가 아니라 음역형인 ‘야훼’로 옮겨 원문 구별을 유지했습니다.
- source_word: פָקַד
  english_pob_choice: had visited
  chosen_korean: 돌아보셔서
  alternatives_korean:
  - 방문하셔서
  - 찾아보셔서
  - 돌보셔서
  lexicon: HALOT
  rationale: 이 문맥의 פקד는 단순 방문보다 백성을 향한 언약적 돌봄과 개입을 뜻하므로, 의미를 드러내는 ‘돌아보셔서’로 옮겼습니다.
- source_word: לָתֵת לָהֶם לָחֶם
  english_pob_choice: to give them food
  chosen_korean: 먹을 것을 주셨다는
  alternatives_korean:
  - 빵을 주셨다는
  - 음식을 주셨다는
  lexicon: HALOT
  rationale: לֶחֶם이 여기서는 문자적 ‘빵’보다 생존을 위한 양식 전체를 가리키므로, 현대 한국어에 자연스러운 ‘먹을 것’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: ‘야훼’로 본문에 직접 반영했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 신명기적 언약명의 직접 사용을 드러내므로, 대체 호칭보다 고유명 음역을 택해 신학적·문헌학적 구분을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
