- from: 그때 나오미는 두 며느리와 함께 일어나 모압의 들에서 돌아왔습니다. 그녀는 모압의 들에 있을 때 야훼께서 자기 백성을 돌아보셔서 그들에게 먹을 것을 주셨다는 소식을 들었기 때문입니다.[a]
  to: 그때 나오미는 며느리들과 함께 일어나 모압의 들에서 돌아왔습니다. 모압의 들에 있을 때 야훼께서 그들에게 먹을 것[a]을 주시어 자기 백성을 돌보셨다는 소식을 들었기 때문입니다.
  rationale: 본문에 명시되지 않은 ‘두’를 삭제하고, פקד와 ‘먹을 것을 주다’의 문법적·의미적 연결을 ‘먹을 것을 주시어 ... 돌보셨다’로 자연스럽게 반영했습니다. 또한 각주 표지를 해당 어휘에 붙이고 히브리어 음역을 한국어로 표기했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:17Z'
