  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
  footnotes:
  - marker: a
    text: Naomi means something like “pleasant,” while Mara means “bitter.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그녀가 그들에게 말했습니다. 「나를 나오미라 부르지 마십시오. 나를 마라라 부르십시오. 전능하신 분께서 나를 매우 쓰라리게 하셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나오미’는 ‘기쁨/즐거움’에 가까운 뜻이고, ‘마라’는 ‘쓰라림’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: But she said
  chosen_korean: 그러나 그녀가 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그때 그녀가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 살리면서 앞선 인사에 대한 반응성을 드러내기 위해 역접적 전환을 ‘그러나’로 옮겼습니다.
- source_word: אַל תִּקְרֶאנָה לִי ... קְרֶאןָ לִי
  english_pob_choice: Do not call me ... call me
  chosen_korean: 나를 나오미라 부르지 마십시오. 나를 마라라 부르십시오
  alternatives_korean:
  - 나를 나오미라고 부르지 마십시오. 나를 마라라고 부르십시오
  - 나를 나오미로 부르지 마십시오. 나를 마라로 부르십시오
  lexicon: HALOT
  rationale: קרא의 명명/호칭 의미를 살려 직접적이고 자연스러운 ‘부르다’로 옮기되, 이름 앞의 호격 기능은 한국어 어순에 맞게 처리했습니다.
- source_word: מָרָא
  english_pob_choice: Mara
  chosen_korean: 마라
  alternatives_korean:
  - 마라
  - 마라(‘쓰라림’)
  lexicon: HALOT
  rationale: 고유명사로 음역하되, 본문 안에서는 번역하지 않고 의미는 문맥과 주석으로 드러나게 하는 것이 적절합니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 전능자
  - 샷다이
  lexicon: HALOT
  rationale: יהוה가 아니라 신적 칭호이므로 의미를 살려 번역했고, 한국어에서는 인격적 호칭감을 위해 ‘전능하신 분’이 가장 자연스럽습니다.
- source_word: הֵמַר ... מְאֹד
  english_pob_choice: has made me very bitter
  chosen_korean: 나를 매우 쓰라리게 하셨기 때문입니다
  alternatives_korean:
  - 나를 매우 쓰게 하셨기 때문입니다
  - 나를 크게 쓰라리게 하셨기 때문입니다
  lexicon: HALOT
  rationale: 히필의 ‘쓰라리게 하다/씁쓸하게 만들다’라는 의미를 살려, 마라(‘쓰라림’)와의 말놀이가 보이도록 ‘쓰라리게’로 옮겼습니다.
theological_decisions:
- issue: 쉴다이(שַׁדַּי)의 번역 방식
  chosen_reading: ‘전능하신 분’으로 번역해 하나님의 칭호로 전달했습니다.
  alternative_readings:
  - 샷다이로 음역
  - 전능자
  rationale: 이 본문에서 מדובר하는 것은 고유명사보다 하나님의 성격을 드러내는 칭호이므로, 의미 전달을 우선해 번역했습니다.
  doctrine_reference: Translation philosophy §2 (Translate titles; transliterate names)
