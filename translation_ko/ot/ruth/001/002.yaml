base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
  footnotes:
  - marker: a
    text: Or 'the country of Moab' or 'the territory of Moab'; Hebrew 'the fields of Moab.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and were there' or 'and stayed there'; Hebrew literally, 'and they were there.'
    reason: lexical_alternative
  - marker: c
    text: Chilion may also be spelled 'Kilion' in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 남자의 이름은 엘리멜렉이었고, 그의 아내의 이름은 나오미였으며, 그의 두 아들의 이름은 마흘론과 기룐이었습니다. 그들은 유다 베들레헴의 에브랏 사람들이었습니다. 그들은 모압의 들판에 와서 거기 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '모압의 들판들'입니다. 영어 POB는 이를 'the fields of Moab'으로 옮기며, 영역적 의미로는 '모압의 지방/영토'도 가능하다고 주석합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 פשוט히 '그들은 거기 있었다'입니다. 문맥상 '거기 머물렀다'로도 자연스럽지만, 본문은 상태 진술을 그대로 말합니다.
    reason: lexical_alternative
  - marker: c
    text: Chilion은 영어 음역에서 'Kilion'으로도 철자될 수 있습니다.
    reason: lexical_alternative
