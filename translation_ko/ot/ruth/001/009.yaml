base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
  footnotes:
  - marker: a
    text: Or 'security' or 'settledness'; the Hebrew 'rest' here refers to the settled security of life in a husband's household.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여러분에게 주시기를 — 여러분 각자가 남편의 집에서 안식을 찾기를 바랍니다." 그러고 나서 나오미가 그들에게 입을 맞추자, 그들은 소리를 높여 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평안’이나 ‘정착된 삶’. 여기의 ‘안식’은 남편의 집안에서 누리는 안정된 삶을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן יְהוָה
  english_pob_choice: May Yahweh grant
  chosen_korean: 야훼께서 여러분에게 주시기를
  alternatives_korean:
  - 야훼께서 여러분에게 주시기를 바랍니다
  - 야훼께서 여러분에게 허락하시기를
  lexicon: WLC / HALOT
  rationale: 히브리어 직설형이지만 여기서는 축복의 소망을 나타내므로 한국어에서도 기원형으로 옮겼고, 하나님의 이름은 프로젝트 기본값인 ‘야훼’를 유지했습니다.
- source_word: וּמְצֶאןָ מְנוּחָה
  english_pob_choice: that you find rest
  chosen_korean: 안식을 찾기를 바랍니다
  alternatives_korean:
  - 평안을 얻기를 바랍니다
  - 안정된 삶을 찾기를 바랍니다
  lexicon: HALOT
  rationale: מְנוּחָה는 단순 휴식보다 정착된 안전과 안식을 가리키므로 ‘안식’을 택해 핵심 이미지를 살렸습니다.
- source_word: בֵּית אִישָׁהּ
  english_pob_choice: in the house of her husband
  chosen_korean: 남편의 집에서
  alternatives_korean:
  - 남편의 집안에서
  - 남편의 가정에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리면서도, 결혼한 여성의 거처와 보호를 함께 드러내는 표현으로 옮겼습니다.
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  english_pob_choice: they lifted up their voices and wept
  chosen_korean: 그들은 소리를 높여 울었습니다
  alternatives_korean:
  - 그들은 목소리를 높여 울었습니다
  - 그들은 큰 소리로 울었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘소리를 높이다’를 직역에 가깝게 살리되, 뒤의 ‘울었습니다’와 결합해 자연스러운 한국어로 구성했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 טetragrammaton יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
