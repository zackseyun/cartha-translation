theological_decisions:
- issue: 죽음과 상실의 누적 서술
  chosen_reading: 본문의 반복적 상실을 평이하게 직역하기보다, 한국어에서 비극의 누적이 드러나도록 ‘곧 죽었습니다… 남편을 잃고 남게 되었습니다’로 정리했습니다.
  alternative_readings:
  - '직역형: ‘그리고 그 둘도 죽었습니다… 그 여자는 그녀의 두 자녀와 남편에게서 남겨졌습니다’'
  - 더 완곡한 표현
  rationale: 룻기의 서두가 가족의 몰락을 강조하므로, 상실의 중첩이 독자에게 분명히 전달되도록 했습니다.
  doctrine_reference: Narrative emphasis in wisdom/emptiness motif (Ruth 1:1-5)
