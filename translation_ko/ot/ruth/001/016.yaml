  text: וַ/תֹּ֤אמֶר רוּת֙ אַל תִּפְגְּעִי בִ֔/י לְ/עָזְבֵ֖/ךְ לָ/שׁ֣וּב מֵ/אַחֲרָ֑יִ/ךְ כִּ֠י אֶל אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּ/בַ/אֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣/ךְ עַמִּ֔/י וֵ/אלֹהַ֖יִ/ךְ אֱלֹהָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
  footnotes:
  - marker: a
    text: Or 'urge me,' 'entreat me,' or 'insist with me' for 'press me.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from after you,' an idiom meaning 'from following you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'where you spend the night, I will spend the night.'
    reason: lexical_alternative
  - marker: d
    text: The Hebrew clauses 'Your people my people, and your God my God' are verbless; English may also render them 'Your people are my people, and your God is my God' or with future sense.
    reason: alternative_reading
translation:
  language: ko
  text: 룻이 말했습니다. 「당신을 떠나거나 당신을 따르던 길에서 돌아서라고[a] 저를 재촉하지 마십시오. 당신이 가시는 곳으로 저도 가고, 당신이 묵으시는 곳에서 저도 묵겠습니다. 당신의 백성이 제 백성이 되고, 당신의 하나님이 제 하나님이 되실 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신 뒤에서부터’라는 방향 표현을 씁니다. 곧 당신을 따르는 데서 돌이켜 떠나는 것을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: אַל תִּפְגְּעִי בִי
  english_pob_choice: Do not press me
  chosen_korean: 저를 재촉하지 마십시오
  alternatives_korean:
  - 저에게 간청하지 마십시오
  - 저를 졸라대지 마십시오
  - 저를 압박하지 마십시오
  lexicon: HALOT
  rationale: פגע with ב can carry the sense of urging or importuning; ‘재촉하지 마십시오’는 룻의 거절 의도를 자연스럽게 살리면서 물리적 충돌이나 지나친 강압 뉘앙스를 피합니다.
- source_word: לְעָזְבֵךְ
  english_pob_choice: to leave you
  chosen_korean: 당신을 떠나고
  alternatives_korean:
  - 당신을 버리고
  - 당신을 저버리고
  lexicon: HALOT
  rationale: עזב은 ‘떠나다/버리다’가 가능하지만, 여기서는 관계를 끊고 떠나는 기본 의미가 가장 자연스럽습니다.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  english_pob_choice: to turn back from following after you
  chosen_korean: 당신을 따라 돌아가지 말라고
  alternatives_korean:
  - 당신을 따라 돌아서지 말라고
  - 당신 뒤를 따라 돌아가지 말라고
  lexicon: HALOT
  rationale: מאחריך의 방향 감각을 살려 ‘당신을 따라 돌아가다’로 옮겼고, 영어 POB가 보존한 후행적 이미지를 한국어에서도 유지했습니다.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  english_pob_choice: where you lodge, I will lodge
  chosen_korean: 당신이 머무시는 곳에서 저도 머물겠습니다
  alternatives_korean:
  - 당신이 묵으시는 곳에서 저도 묵겠습니다
  - 당신이 밤을 지내시는 곳에서 저도 밤을 지내겠습니다
  lexicon: HALOT
  rationale: לון은 숙박/하룻밤 묶음을 뜻하므로, 현대 한국어에서는 ‘머물다’가 가장 자연스럽고 반복 병렬 구조를 잘 살립니다.
- source_word: עַמֵּךְ עַמִּי / וֵאלֹהַיִךְ אֱלֹהָי
  english_pob_choice: Your people will be my people, and your God my God
  chosen_korean: 당신의 백성이 제 백성이 되고, 당신의 하나님이 제 하나님이 되실 것입니다
  alternatives_korean:
  - 당신의 백성은 제 백성입니다, 그리고 당신의 하나님은 제 하나님입니다
  - 당신의 백성이 제 백성이고, 당신의 하나님이 제 하나님입니다
  lexicon: HALOT
  rationale: 히브리어의 무동사 절은 현재/미래로 모두 읽을 수 있으므로, 서원적 결단을 분명히 드러내는 미래형으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 무동사 두 절의 시제 처리
  chosen_reading: ‘제 백성이 되고… 제 하나님이 되실 것입니다’로 두 절 모두 미래적 서원으로 읽었습니다.
  alternative_readings:
  - 둘 다 현재형으로 옮기기
  - 첫 절은 미래형, 둘째 절은 무동사 구조를 살린 현재형으로 옮기기
  rationale: 원문은 두 절 모두 동사를 생략한 선언형입니다. 한국어에서는 문맥상 결단과 충성을 분명히 하는 미래형이 가장 자연스럽고, 신학적으로도 룻의 언약적 결심을 선명하게 드러냅니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source force without overexpanding'
