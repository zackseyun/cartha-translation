id: RUT.1.21
reference: Ruth 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
  footnotes:
  - marker: a
    text: Or 'has borne witness against me.' The Hebrew verb can carry the sense of answering or testifying against someone.
    reason: lexical_alternative
  - marker: b
    text: Or 'has done me harm.' The Hebrew expression speaks of calamity or adversity brought upon Naomi.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 풍족하게 떠났지만, 야훼께서는 나를 빈손으로 돌아오게 하셨습니다. 왜 나를 나오미라고 부르십니까? 야훼께서 나를 거슬러 증언하셨고[a], 전능자께서 내게 재앙을 내리셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 거슬러 증언하셨고’는 ‘나에게 대답하셨고’ 또는 ‘나에 대하여 증언하셨고’로도 옮길 수 있습니다. 이 동사는 응답하다 또는 증언하다를 뜻할 수 있으며, 여기서는 나오미에게 불리한 증언이라는 문맥적 뉘앙스를 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내게 재앙을 내리셨습니다’는 ‘나를 해치셨습니다’ 또는 ‘내게 불행을 가져오셨습니다’로도 옮길 수 있습니다. 여기서는 하나님이 나오미에게 닥친 재난을 직접 가져오셨다는 진술을 보존하면서, 도덕적 악을 뜻하는 표현은 피했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה הָלַכְתִּי
  english_pob_choice: I went away full
  chosen_korean: 풍족한 채로 갔지만
  alternatives_korean:
  - 가득 찬 채로 갔지만
  - 풍성한 채로 떠났지만
  lexicon: HALOT
  rationale: 이 표현은 출발 당시의 충만함과 이후의 공허함을 대비하므로, ‘풍족한’으로 상태를 자연스럽게 살리고 ‘갔지만’으로 대조를 분명히 했습니다.
- source_word: וְרֵיקָם הֱשִׁיבַנִי
  english_pob_choice: has brought me back empty
  chosen_korean: 나를 빈손으로 돌아오게 하셨습니다
  alternatives_korean:
  - 나를 빈손으로 돌아오게 하셨습니다
  - 나를 빈 채로 돌아오게 하셨습니다
  lexicon: HALOT
  rationale: ‘רֵיקָם’의 빈 상태를 한국어 관용에 맞게 ‘빈손’으로 옮기되, ‘돌아오게 하셨습니다’로 하나님의 주도적 행위를 보존했습니다.
- source_word: תִקְרֶאנָה לִי נָעֳמִי
  english_pob_choice: Why do you call me Naomi
  chosen_korean: 왜 나를 나오미라고 부르십니까
  alternatives_korean:
  - 왜 나를 나오미라고 부르십니까
  - 왜 나를 나오미라 부르십니까
  lexicon: HALOT
  rationale: 복수형 호칭이지만 한국어에서는 자연스럽게 ‘부르십니까’로 처리해, 직접적인 항의의 수사적 질문을 살렸습니다.
- source_word: עָנָה בִי
  english_pob_choice: has testified against me
  chosen_korean: 나에게 대하여 증언하셨고
  alternatives_korean:
  - 나에게 대하여 증언하셨고
  - 나를 대적하여 증언하셨고
  - 나를 향해 증언하셨고
  lexicon: HALOT
  rationale: 문맥상 משפט적 뉘앙스의 ‘증언하다’가 가장 잘 맞으며, 전치사 ‘בִי’를 ‘나에게 대하여’로 옮겨 반대/대항의 의미를 열어 두었습니다.
- source_word: שַׁדַּי
  english_pob_choice: the Almighty
  chosen_korean: 전능자
  alternatives_korean:
  - 전능자
  - 샤다이
  lexicon: HALOT
  rationale: 히브리어 신칭을 한국어에서 의미 중심으로 옮겨, 신적 호칭의 기능을 분명히 했습니다.
- source_word: הֵרַע לִי
  english_pob_choice: has brought calamity on me
  chosen_korean: 나에게 재앙을 내리셨습니다
  alternatives_korean:
  - 나에게 재앙을 내리셨습니다
  - 나를 해치셨습니다
  - 나를 괴롭게 하셨습니다
  lexicon: HALOT
  rationale: 악을 행했다는 직역을 피하고, 본문이 말하는 불행/재난의 결과를 ‘재앙’으로 옮겨 하나님의 직접적 행위를 유지했습니다.
theological_decisions:
- issue: 야훼와 전능자에게 고난의 원인을 직접 돌리는 표현
  chosen_reading: ‘야훼께서 나에게 대하여 증언하셨고, 전능자께서 나에게 재앙을 내리셨습니다’로 직설을 유지합니다.
  alternative_readings:
  - 하나님께서 허락하셔서 재앙이 왔습니다
  - 하나님께서 나를 버리셨습니다
  rationale: 본문은 나의 고난을 하나님의 주권 아래 있는 사건으로 강하게 진술하므로, 그 긴장을 완화하지 않고 그대로 보존했습니다. 다만 ‘재앙’을 사용해 도덕적 악을 하나님께 귀속하는 오해는 피했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
