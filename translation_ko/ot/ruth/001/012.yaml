source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
  footnotes:
  - marker: a
    text: Or, 'to have a husband' or 'to marry.' The Hebrew is literally 'from being to a husband/man.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew presents a hypothetical chain: ''For if I said, “I have hope,” even if I were with a husband tonight and even bore sons—'''
    reason: lexical_alternative
translation:
  language: ko
  text: 돌아가십시오, 내 딸들아. 내가 남편을 두기에는 너무 늙었습니다. 설령 내가 말하기를, ‘내게 아직 소망이 있다’ — 설령 내가 오늘 밤 남편이 있다 하더라도 또 아들들을 낳는다 하더라도 —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남편을 가지기에는’, ‘결혼하기에는’. 히브리어는 문자적으로 ‘남자/남편에게 속하는 상태로부터’입니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어는 가정적 연쇄를 제시합니다: ‘내가 “내게 소망이 있다”고 말한다면, 설령 오늘 밤 남편이 있고 또 아들들을 낳는다 하더라도—’'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  english_pob_choice: Turn back
  chosen_korean: 돌아가십시오
  alternatives_korean:
  - 되돌아가십시오
  - 다시 돌아가십시오
  lexicon: HALOT
  rationale: 여성 복수 명령형 שוב의 방향 전환을 자연스럽게 살리면서, 나오미가 동행을 멈추고 돌아가라고 촉구하는 뉘앙스를 반영했습니다.
- source_word: בְנֹתַי
  english_pob_choice: my daughters
  chosen_korean: 내 딸들아
  alternatives_korean:
  - 내 딸들이여
  - 내 딸들
  lexicon: HALOT
  rationale: 친밀한 가족 호칭을 그대로 살리되 한국어 호격을 써서 직접 권면의 어조를 유지했습니다.
- source_word: מִהְיוֹת לְאִישׁ
  english_pob_choice: to belong to a husband
  chosen_korean: 남편을 두기에는
  alternatives_korean:
  - 남편을 갖기에는
  - 남편에게 속하기에는
  - 남편이 되기에는
  lexicon: HALOT
  rationale: 히브리어의 יחס적 표현을 한국어에서 너무 법률적이거나 추상적으로 만들지 않으면서, 결혼 가능성이 사라졌다는 뜻을 자연스럽게 전달했습니다.
- source_word: יֶשׁ לִי תִקְוָה
  english_pob_choice: There is still hope for me
  chosen_korean: 내게 아직 소망이 있다
  alternatives_korean:
  - 나에게 희망이 있다
  - 내게 소망이 있다
  lexicon: HALOT
  rationale: 존재구문을 살려 '소망'을 넣되, '아직'으로 문맥상 거의 불가능한 가능성을 가정하는 어조를 드러냈습니다.
- source_word: וְגַם יָלַדְתִּי בָנִים
  english_pob_choice: and even bore sons
  chosen_korean: 또 아들들을 낳는다 하더라도
  alternatives_korean:
  - 또 아들들을 낳았다 하더라도
  - 또 아들들을 낳는다고 하더라도
  lexicon: HALOT
  rationale: 가정적 연쇄를 한국어 조건문으로 옮기되, בָנִים의 남성 후손 의미를 '아들들'로 보존했습니다.
theological_decisions:
- issue: 남성 후손 언어의 유지
  chosen_reading: 아들들
  alternative_readings:
  - 자녀들
  - 아이들
  rationale: 본문의 논점은 수혼 맥락에서 후사를 잇는 남성 후손 가능성에 있으므로, 성중립화하지 않고 '아들들'을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, item 4
- issue: 가정적 연쇄의 문법 처리
  chosen_reading: 설령 ... 하더라도
  alternative_readings:
  - 만일 ... 한다면
  - 비록 ... 해도
  rationale: 히브리어의 연속된 가정 상황을 한국어의 양보 표현으로 옮겨, 나오미의 상상적 반론이 단계적으로 쌓이는 구조를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
