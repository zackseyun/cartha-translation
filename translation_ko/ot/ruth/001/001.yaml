  to: 사사들이 다스리던 때에 땅에 기근이 들었습니다.[a] 유다의 베들레헴에서 한 사람이 모압의 들에 나그네로 머물려고 갔습니다.[b][c] 그와 그의 아내와 두 아들이 함께 갔습니다.
  rationale: 이동과 체류 목적을 자연스러운 한국어 구문으로 바로잡고, 동행 가족 목록을 이동 사건에 결속시켰습니다. 본문의 의미를 추가하거나 축소하지 않았으며, 원문의 반복과 ‘들’의 지역적 가능성은 각주에서 보존했습니다.
