  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: Now it happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
  footnotes:
  - marker: a
    text: 'Or ''when the judges ruled.'' The Hebrew repeats the same root (''judge'') in an idiomatic construction: literally, ''when the judges judged.'''
    reason: lexical_alternative
  - marker: b
    text: '''Sojourn'' suggests temporary residence as an outsider, not necessarily permanent settlement.'
    reason: cultural_note
  - marker: c
    text: Or 'in the territory/country of Moab.' Literally, 'in the fields of Moab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사사들이 다스리던 때에 땅에 기근이 들었습니다.[a] 유다의 베들레헴에서 한 사람이 모압의 들에 나그네로 머물려고 갔습니다.[b][c] 그와 그의 아내와 두 아들이 함께 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사사들이 사사하던 때에.” 히브리어는 ‘사사하다’와 같은 어근을 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나그네로 머물려고’는 영구 정착이라기보다 외부인으로서의 임시 체류를 뜻할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 “모압의 들[들판들]에”입니다. 이 표현은 모압 지역 전체를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now it happened
  chosen_korean: 사사들이 다스리던 때에
  alternatives_korean:
  - 그때 일이 있었습니다
  - 이러한 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 서사 도입 공식은 한국어에서 직역형의 ‘그리고/또’보다 장면 설정을 자연스럽게 여는 시간 표현으로 옮기는 것이 읽기 좋습니다. 이어지는 ‘사사들이’와 결합해 서사의 배경을 제시합니다.
- source_word: שְׁפֹט הַשֹּׁפְטִים
  english_pob_choice: when the judges judged
  chosen_korean: 사사들이 다스리던 때에
  alternatives_korean:
  - 사사들이 심판하던 때에
  - 사사들이 사사하던 때에
  lexicon: HALOT
  rationale: 히브리어의 동사 반복은 수사적 강조지만, 한국어에서 ‘사사들이 사사하던’은 어색하므로 의미를 살려 ‘다스리던’으로 옮겼습니다. 다만 반복 구조의 긴장감은 ‘때에’로 간결하게 유지했습니다.
- source_word: לָגוּר
  english_pob_choice: to sojourn
  chosen_korean: 나그네로 머물러 가려고
  alternatives_korean:
  - 잠시 머무르려고
  - 객으로 지내려고
  - 거류하려고
  lexicon: HALOT
  rationale: גור는 단순한 거주보다 외부인으로서의 임시 체류를 뜻하므로, ‘나그네로’로 신분적 뉘앙스를 살렸습니다. ‘가려고’는 목적을 드러내어 이동의 의도를 분명히 합니다.
- source_word: בִּשְׂדֵי מוֹאָב
  english_pob_choice: in the fields of Moab
  chosen_korean: 모압의 들판
  alternatives_korean:
  - 모압 땅
  - 모압의 들
  lexicon: HALOT
  rationale: שְׂדֵי는 문자적으로 ‘들판들/들’의 감각이 있어, 지역 일반화보다 구체성을 살린 ‘들판’이 원문에 가깝습니다. 영어 POB의 주석처럼 지역 의미를 포함하되, 본문은 농경적 이미지를 유지했습니다.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  english_pob_choice: he and his wife and his two sons
  chosen_korean: 그와 그의 아내와 두 아들이 함께 갔습니다
  alternatives_korean:
  - 그와 그의 아내와 그의 두 아들이 갔습니다
  - 그와 아내와 두 아들이 함께 갔습니다
  lexicon: HALOT
  rationale: 히브리어의 나열 구조를 한국어에서도 보존하되, 동사 ‘갔습니다’를 한 번만 두어 문장을 자연스럽게 정리했습니다. ‘함께’는 가족 단위의 동행을 분명히 합니다.
theological_decisions:
- issue: 사사기 시대의 역사적 배경 표현
  chosen_reading: ‘사사들이 다스리던 때에’로 옮겨, 단순 연대 표지가 아니라 질서 부재와 불안정한 통치 상황을 암시하도록 했습니다.
  alternative_readings:
  - ‘사사들이 심판하던 때에’
  - ‘사사들이 통치하던 때에’
  rationale: 원문의 반복 구조는 서사적 배경 설명이면서, 사사 시대의 혼란을 전제합니다. ‘다스리던’은 משפט/שפט의 넓은 통치 기능을 무리 없이 담아내면서도 한국어에서 자연스럽습니다.
  doctrine_reference: 사사기-룻기 서사의 역사적 배경 인식
