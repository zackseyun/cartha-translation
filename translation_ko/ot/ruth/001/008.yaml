- from: 나오미가 두 며느리에게 말했습니다. “가십시오, 돌아가십시오. 각각 자기 어머니의 집으로 돌아가십시오. 야훼께서 여러분에게 인자하심을 베푸시기를 원합니다. 그것은 여러분이 죽은 이들과 저에게 베푸신 것과 같습니다.”[a]
  to: 나오미가 두 며느리에게 말했습니다. “가십시오. 각자 자기 어머니의 집으로 돌아가십시오. 야훼께서 여러분에게 친절[a]을 베푸시기를 바랍니다. 여러분이 죽은 이들과 저에게 친절을 베푼 것처럼 말입니다.”
