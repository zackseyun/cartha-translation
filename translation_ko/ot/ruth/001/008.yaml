  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
  footnotes:
  - marker: a
    text: Or 'steadfast love,' 'loyal love,' or 'covenant faithfulness' for 'kindness' (Hebrew hesed).
    reason: lexical_alternative
translation:
  language: ko
  text: 나오미가 두 며느리에게 말했습니다. “가십시오. 각자 자기 어머니의 집으로 돌아가십시오. 야훼께서 여러분에게 친절[a]을 베푸시기를 바랍니다. 여러분이 죽은 이들과 저에게 친절을 베푼 것처럼 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘변함없는 사랑’, ‘신실한 사랑’, 또는 ‘언약적 신실함’으로 옮길 수 있습니다. 히브리어 חֶסֶד의 대안적 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  english_pob_choice: her two daughters-in-law
  chosen_korean: 두 며느리
  alternatives_korean:
  - 두 딸
  - 두 사위댁
  lexicon: HALOT
  rationale: כַּלָּה는 여기서 아들의 아내를 가리키므로, 한국어의 자연스럽고 정확한 대응인 ‘며느리’가 가장 적절합니다.
- source_word: לֵכְנָה שֹּׁבְנָה
  english_pob_choice: Go, return
  chosen_korean: 가십시오, 돌아가십시오
  alternatives_korean:
  - 가서 돌아가십시오
  - 가십시오, 돌아가 보십시오
  lexicon: HALOT
  rationale: 겹임명형 명령의 반복과 강조를 살리기 위해 두 동사를 모두 분리해 옮겼습니다.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  english_pob_choice: each to her mother’s house
  chosen_korean: 각각 자기 어머니의 집으로
  alternatives_korean:
  - 각자 어머니의 집으로
  - 각 사람 어머니의 집으로
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 반영하여 ‘각각’으로 옮기고, ‘어머니의 집’을 그대로 살려 구체성을 유지했습니다.
- source_word: חֶסֶד
  english_pob_choice: kindness
  chosen_korean: 인자하심
  alternatives_korean:
  - 은혜
  - 자비
  - 사랑
  lexicon: HALOT
  rationale: 호의 이상의 언약적 선의를 담는 말이므로, 한국어에서 그 뉘앙스를 비교적 잘 담는 ‘인자하심’으로 옮기되, 본문 맥락상 자연스럽게 표현했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명사형이 직접 나오므로, 전통적 대체어가 아니라 고유 이름을 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד의 의미 범위
  chosen_reading: 인자하심
  alternative_readings:
  - 변함없는 사랑
  - 언약적 신실함
  - 친절
  rationale: 이 절의 축복 맥락에서는 관계적이고 베푸는 선의가 전면에 있으므로, 핵심 의미를 살리되 과도하게 신학화하지 않는 표현을 택했습니다.
  doctrine_reference: 'POB lexical policy: חֶסֶד in blessing contexts'
