translation:
  language: ko
  text: 그들은 모압 여인들을 아내로 맞이했습니다.[a] 한 사람의 이름은 오르바였고, 다른 사람의 이름은 룻이었습니다. 그들은 거기에서 약 십 년 동안 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
