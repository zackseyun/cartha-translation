base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
  footnotes:
  - marker: a
    text: Or, 'they married Moabite women.' The Hebrew literally says 'they took for themselves Moabite wives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모압 여인들을 아내로 맞이했습니다. 하나의 이름은 오르바였고, 다른 하나의 이름은 룻이었습니다. 그들은 거기에서 약 십 년 동안 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모압 여인들을 아내로 삼았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים מֹאֲבִיּוֹת
  english_pob_choice: they took for themselves Moabite wives
  chosen_korean: 그들은 모압 여인들을 아내로 맞이했습니다
  alternatives_korean:
  - 그들은 모압 여인들을 자신들을 위해 취했습니다
  - 그들은 모압 출신 아내들을 얻었습니다
  lexicon: HALOT
  rationale: נָשָׂא עם נָשִׁים은 결혼을 가리키는 관용구이므로, 한국어에서는 그 의미를 자연스럽게 드러내는 ‘아내로 맞이하다’를 택했습니다. ‘모압 여인들’은 민족적 출처를, ‘아내’는 혼인 관계를 함께 살립니다.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  english_pob_choice: The name of the one was ... and the name of the other was
  chosen_korean: 하나의 이름은 ... 다른 하나의 이름은
  alternatives_korean:
  - 첫째의 이름은 ... 둘째의 이름은
  - 한 사람의 이름은 ... 다른 사람의 이름은
  lexicon: HALOT
  rationale: 히브리어의 대조적 명명 공식을 그대로 살려 두 여인을 병렬적으로 소개했습니다. ‘하나/다른 하나’는 אַחַת / הַשֵּׁנִית의 대비를 자연스럽게 반영합니다.
- source_word: כְּעֶשֶׂר שָׁנִים
  english_pob_choice: about ten years
  chosen_korean: 약 십 년 동안
  alternatives_korean:
  - 대략 십 년 동안
  - 거의 십 년 동안
  lexicon: HALOT
  rationale: 접두 כ의 근사값을 살려 정확히 10년으로 단정하지 않고 ‘약’으로 처리했습니다. 동작 지속은 ‘동안’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 결혼 표현의 직역성과 의미 명확화
  chosen_reading: ‘아내로 맞이했습니다’로 옮겨 결혼의 의미를 분명히 하되, 본문의 관용구성을 유지했습니다.
  alternative_readings:
  - ‘결혼했습니다’
  - ‘아내들을 취했습니다’
  rationale: 본문은 ‘여자를 취하다’의 관용적 결혼 표현이므로, 의미를 풀어 쓰면서도 원문의 행위성과 서술성을 보존하는 쪽이 적절합니다.
  doctrine_reference: source-language meaning and literary form
