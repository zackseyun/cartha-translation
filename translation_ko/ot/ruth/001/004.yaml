  terminology: ‘모압’, ‘오르바’, ‘룻’ 및 ‘아내로 맞이했습니다’는 적절합니다. 각주에는 원문의 לָהֶם(‘자신들을 위해’)의 관용적 뉘앙스를 빠뜨리지 않는 것이 좋습니다.
