base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''and they said'' is feminine plural, indicating that the speakers are women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 두 여인은 베들레헴에 이를 때까지 갔습니다. 그들이 베들레헴에 이르자, 온 마을이 그들 때문에 술렁였고, 여인들이[a] 말했습니다. “이 사람이 나오미입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 여성 복수형이므로, 화자는 일반적인 ‘그들’이 아니라 여인들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  english_pob_choice: went on / the two of them
  chosen_korean: 그 두 사람은 … 계속 갔습니다
  alternatives_korean:
  - 그 둘은 … 갔습니다
  - 그 두 사람은 … 걸어갔습니다
  lexicon: HALOT
  rationale: 여행의 지속성을 살리기 위해 ‘계속 갔습니다’를 택했고, 쌍을 이루는 강조는 ‘그 두 사람’으로 자연스럽게 반영했습니다.
- source_word: וַיְהִי כְּבֹאָהּ
  english_pob_choice: And when they came
  chosen_korean: 그들이 … 이르자
  alternatives_korean:
  - 그리고 그들이 … 왔을 때
  - 그들이 … 도착하자
  lexicon: HALOT
  rationale: 히브리어의 전환 공식은 서사 흐름을 이어 주므로, 현대 한국어에서도 시간 전환을 분명히 하는 ‘이르자’로 옮겼습니다.
- source_word: וַתֵּהֹם כָּל הָעִיר
  english_pob_choice: the whole town was stirred
  chosen_korean: 온 마을이 … 술렁였고
  alternatives_korean:
  - 온 마을이 … 들끓었고
  - 온 마을이 … 소란스러웠고
  lexicon: HALOT
  rationale: המה의 동요·소란을 한국어의 ‘술렁이다’로 옮겨, 과도한 폭동 뉘앙스 없이 공동체의 동요를 살렸습니다.
- source_word: וַתֹּאמַרְנָה
  english_pob_choice: the women said
  chosen_korean: 여자들이 말했습니다
  alternatives_korean:
  - 여인들이 말했습니다
  - 그 여자들이 말했습니다
  lexicon: HALOT
  rationale: 동사의 여성 복수형이므로 발화 주체가 여성들임을 드러내기 위해 성별 정보를 유지했습니다.
- source_word: הֲזֹאת נָעֳמִי
  english_pob_choice: Is this Naomi?
  chosen_korean: 이 사람이 나오미입니까?
  alternatives_korean:
  - 이분이 나오미입니까?
  - 정말 나오미입니까?
  lexicon: HALOT
  rationale: 놀라운 인식의 질문이므로 직설적으로 옮겼고, ‘이 사람이’는 히브리어의 지시적 뉘앙스를 자연스럽게 반영합니다.
theological_decisions:
- issue: 여성 복수형 발화 주체를 본문에 드러낼지 여부
  chosen_reading: 본문에 ‘여자들이’라고 명시해 여성 화자라는 정보를 드러냈습니다.
  alternative_readings:
  - 그들이 말했습니다
  - 사람들이 말했습니다
  rationale: 히브리어 동사형이 여성 복수이므로, POB의 감사본 취지를 따라 성별 표지를 평탄화하지 않고 유지했습니다.
  doctrine_reference: 본문 문법 관찰(히브리어 동사 인칭·성 구분)
