    issue: ‘룻은 그에게 달라붙어 있었습니다’의 ‘그에게’
    rationale: 히브리어 בָּהּ은 여성 단수이며, 문맥상 나오미를 가리킵니다. 한국어 ‘그’는 통상 남성을 가리키므로 성별 및 지시 대상이 부정확합니다.
  - severity: medium
    issue: ‘달라붙어 있었습니다’
    rationale: דָּבְקָה의 긴밀하고 지속적인 애착을 전달할 수 있으나, 한국어에서는 지나치게 물리적이거나 다소 부정적으로 들릴 수 있습니다. ‘굳게 붙어 있었습니다’가 더 중립적이고 서사 문체에 알맞습니다.
  - severity: low
    issue: 첫 절의 관용구 표현
    rationale: ‘큰 소리로 울었습니다’는 의미상 가능하지만, ‘목소리를 높여 울었습니다’가 ‘목소리를 들다’와 ‘울다’라는 원문의 두 요소를 더 잘 보존합니다.
