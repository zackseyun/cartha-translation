  to: 그들은 다시 목소리를 높여 울었습니다. 오르바는 시어머니에게 입을 맞추었지만, 룻은 시어머니에게 굳게 붙어 있었습니다.[a]
  rationale: 여성인 나오미를 가리키는 대명사의 오류를 피하기 위해 ‘시어머니에게’를 반복했습니다. 또한 ‘목소리를 높여 울었습니다’로 히브리어 관용구와 울음 동사를 함께 살리고, ‘굳게 붙어 있었습니다’로 룻의 지속적인 애착을 현대 표준 한국어의 격식 있는 서사 문체로 표현했습니다. 접속사의 대조적 번역과 그 대안은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:10:16Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 ‘목소리를 높이다’와 ‘울다’의 결합, 반복을 뜻하는 ‘다시’, 오르바와 룻의 대조를 충실히 반영합니다. 다만 룻이 붙든 대상은 여성인 나오미이므로 ‘그에게’는 부정확합니다.
  naturalness: ‘다시 큰 소리로 울었습니다’도 뜻은 통하지만, ‘목소리를 높여 울었습니다’가 히브리어 관용구와 뒤따르는 울음을 더 자연스럽고 정확하게 함께 전달합니다. ‘달라붙어’는 다소 구어적이고 물리적·부정적 뉘앙스가 있어, 관계적 지속성을 나타내는 ‘굳게 붙어 있었습니다’가 문맥과 문체에 더 적합합니다.
  terminology: ‘오르바’, ‘룻’, ‘시어머니’, ‘입을 맞추다’는 적절합니다. 여성 지시 대상에 남성형 ‘그’가 쓰인 점을 바로잡아야 합니다.
  issues:
