base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/014.yaml
  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
  footnotes:
  - marker: a
    text: Or 'and Ruth clung to her'; the Hebrew conjunction can be read simply as 'and,' but the context suggests a contrast between Orpah's kiss and Ruth's continued attachment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 다시 큰 소리로 울었습니다. 오르바는 시어머니에게 입을 맞추었지만, 룻은 그에게 달라붙어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 룻은 그에게 달라붙어 있었다’. 히브리어 접속사는 단순히 ‘그리고’로도 읽을 수 있지만, 문맥은 오르바의 입맞춤과 룻의 계속된 붙어 있음 사이의 대조를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  english_pob_choice: they lifted up their voices
  chosen_korean: 다시 큰 소리로 울었습니다
  alternatives_korean:
  - 목소리를 높였습니다
  - 큰 소리로 외쳤습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 소리 내어 우는 장면을 자연스러운 한국어로 살리되, 뒤의 ‘울었습니다’와 구별되도록 ‘큰 소리로’로 음성의 강도를 드러냈습니다.
- source_word: וַתִּבְכֶּינָה
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 흘렸습니다
  - 통곡했습니다
  lexicon: HALOT
  rationale: 동사의 핵심 의미인 ‘울다’를 그대로 옮겨 절의 반복적 통곡 장면을 간결하게 전달했습니다.
- source_word: וַתִּשַּׁק
  english_pob_choice: kissed
  chosen_korean: 입을 맞추었습니다
  alternatives_korean:
  - 키스했습니다
  - 입맞추었습니다
  lexicon: HALOT
  rationale: 성경 서술문에서 자연스러우면서도 지나치게 현대 구어체로 흐르지 않는 표현을 택해, 단순한 ‘키스’보다 관계적 행동을 부드럽게 나타냈습니다.
- source_word: וְרוּת דָּבְקָה בָּהּ
  english_pob_choice: but Ruth clung to her
  chosen_korean: 하지만, 룻은 그에게 달라붙어 있었습니다
  alternatives_korean:
  - 그러나 룻은 그에게 붙어 있었습니다
  - 룻은 그에게 굳게 매달렸습니다
  lexicon: HALOT
  rationale: דבק의 ‘강하게 붙다/밀착하다’는 감각을 살리면서, 오르바의 떠남과 대비되는 지속적 부착을 드러내기 위해 ‘달라붙어 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: וְ의 대조 관계
  chosen_reading: 문맥상 단순 접속사 ‘그리고’보다 대조 접속사 ‘하지만’으로 옮겼습니다.
  alternative_readings:
  - 그리고
  - 또
  rationale: 오르바의 입맞춤과 룻의 계속된 붙어 있음이 대비되므로, 서술의 흐름을 오해 없이 드러내는 것이 더 적절합니다.
  doctrine_reference: 문맥 기반 의미 대조
