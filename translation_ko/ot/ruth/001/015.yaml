reference: Ruth 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
  footnotes:
  - marker: a
    text: Or 'has returned.' The Hebrew verb שוב is repeated in this verse for both Orpah's action and Naomi's command to Ruth.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to her gods'; some translate 'to her god,' but the plural likely refers to the deities of Moab.
    reason: alternative_reading
translation:
  language: ko
  text: 나오미가 말했습니다. 「보십시오. 당신의 동서가 자기 백성과 자기 신들[a]에게로 돌아갔습니다[b]. 당신의 동서를 따라 돌아가십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘자기 신들’입니다. 일부는 ‘자기 신’으로 옮기지만, 복수형은 모압의 신들을 가리키는 뜻이 더 강합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘돌아왔습니다’. 이 절에서는 히브리어 동사 שוב가 오르바의 행동과 나오미의 명령에 모두 반복됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: And she said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그녀가 말했습니다
  lexicon: HALOT
  rationale: 서술 도입의 וַ-연속법을 자연스러운 한국어 이야기체로 옮기되, 직접 인용을 여는 말로서 평이한 과거 서술을 유지했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 주의 환기 기능을 살려 현대 한국어에서 자연스럽고 공손한 감탄/지시 표현으로 옮겼습니다.
- source_word: יְבִמְתֵּךְ
  english_pob_choice: your sister-in-law
  chosen_korean: 당신의 며느리
  alternatives_korean:
  - 당신의 시누이
  - 당신의 형제의 아내
  lexicon: HALOT
  rationale: 이 문맥의 유대인 친족 용어를 한국어 관용으로는 단순히 '시누이'보다, 나아-룻 관계의 핵심인 ‘며느리’가 화자-청자 관점에서 더 분명하게 드러납니다. 다만 원어의 족속 내 혼인 관계라는 요소는 주석으로 보완이 필요할 수 있습니다.
- source_word: אֶל עַמָּהּ וְאֶל אֱלֹהֶיהָ
  english_pob_choice: to her people and to her gods
  chosen_korean: 자기 백성과 자기 신들
  alternatives_korean:
  - 자기 백성과 자기 신에게
  - 자기 민족과 자기 신들
  lexicon: HALOT
  rationale: ‘백성’은 עַם의 집단적 소속감을, ‘신들’은 복수형 אֱלֹהֶיהָ가 가리키는 모압의 다신교적 배경을 보존합니다.
- source_word: שׁוּבִי אַחֲרֵי
  english_pob_choice: Go back after
  chosen_korean: 따라 돌아가십시오
  alternatives_korean:
  - 뒤따라 가십시오
  - 돌아가서 따르십시오
  lexicon: HALOT
  rationale: 같은 어근 שוב의 반복을 한국어에서도 '돌아가다'로 살리면서, אַחֲרֵי의 추종/동행 이미지를 '따라'로 반영했습니다.
theological_decisions:
- issue: אֱלֹהֶיהָ의 복수형을 한국어로 어떻게 드러낼지
  chosen_reading: 자기 신들
  alternative_readings:
  - 자기 신
  - 자기 하나님
  rationale: 문맥상 보아스/모압의 대조가 아니라 모압 여인의 종교적 귀향을 말하므로, 복수형을 살려 다신교적 배경을 흐리지 않는 번역이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 다신교 문맥의 수를 보존하는 번역
