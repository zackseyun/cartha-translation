  source_fidelity: 수정이 필요합니다. וַתֹּאמֶר의 여성 단수 주어는 문맥상 나오미이므로 ‘그가’는 부정확합니다. 또한 יְבִמְתֵּךְ는 룻과 오르바의 관계에서 ‘며느리’가 아니라 서로 남편의 형제와 결혼한 여성 친족, 곧 ‘동서’를 가리킵니다. ‘동서’는 이 문맥에서 원어의 친족 관계를 가장 정확히 반영합니다. שוב의 완료형과 명령형 반복, 그리고 אֱלֹהֶיהָ의 복수는 수정문에서 보존했습니다.
  naturalness: ‘나오미가 말했습니다’는 지시 대상이 분명하며 현대 정중체 서술에 자연스럽습니다. ‘당신의 동서’와 ‘돌아가십시오’는 요청된 합쇼체에 맞습니다. ‘보십시오’는 הִנֵּה의 주의 환기 기능을 자연스럽게 살립니다.
