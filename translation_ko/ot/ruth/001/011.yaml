  text: 그러나 나오미가 말했습니다. 「내 딸들아[a], 돌아가십시오. 어찌 나와 함께 가려 하십니까? 내 태중에 아직 아들들이 있어서 그들이 여러분의 남편이 될 수 있겠습니까?」
  philosophy: optimal-equivalence
