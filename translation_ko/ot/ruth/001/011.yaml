  verdict: revise
  source_fidelity: 히브리어의 수사적 질문과 핵심 표현(‘돌아가라’, ‘내 딸들’, ‘내게 아직 태중에 아들들이 있는가’, ‘너희의 남편이 되다’)은 대체로 충실히 반영되었습니다. 다만 ‘태 속’은 현대 표준어 성경 문체에서 다소 부자연스럽고 의미가 불명료할 수 있어 ‘태중’으로 다듬는 것이 안전합니다.
