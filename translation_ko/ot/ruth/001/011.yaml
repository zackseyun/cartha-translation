source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
  footnotes:
  - marker: a
    text: Literally, 'my daughters'; Naomi is addressing her daughters-in-law with familial affection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나오미가 말했습니다. 「내 딸들아, 돌아가십시오. 어찌 나와 함께 가려 하십니까? 내게 아직 태 속에 아들들이 있어서 그들이 여러분의 남편이 될 수라도 있습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 딸들’입니다. 나오미가 며느리들을 가족적 애정으로 부르는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: But Naomi said
  chosen_korean: 그러나 나오미가 말했습니다
  alternatives_korean:
  - 그리고 나오미가 말했습니다
  - 그런데 나오미가 말했습니다
  lexicon: HALOT
  rationale: 서술 전개를 살리되, 앞선 말과의 대비를 나타내는 전환을 한국어의 자연스러운 「그러나」로 옮겼습니다.
- source_word: שֹׁבְנָה
  english_pob_choice: Turn back
  chosen_korean: 돌아가십시오
  alternatives_korean:
  - 돌아오십시오
  - 되돌아가십시오
  lexicon: HALOT
  rationale: שׁוב의 방향 전환을 간결하고 공손한 명령으로 살렸습니다.
- source_word: בְנֹתַי
  english_pob_choice: my daughters
  chosen_korean: 내 딸들아
  alternatives_korean:
  - 내 딸들이여
  - 내 딸들
  lexicon: HALOT
  rationale: 문자적으로는 ‘내 딸들’이지만, 나오미가 며느리들을 애정 어린 가족 호칭으로 부르는 뉘앙스를 한국어 호격으로 드러냈습니다.
- source_word: בְּמֵעַי
  english_pob_choice: in my womb
  chosen_korean: 태 속에
  alternatives_korean:
  - 내 자궁에
  - 내 배 속에
  lexicon: HALOT
  rationale: 출산 가능성을 묻는 문맥에서 ‘태 속’이 현대 한국어로 가장 자연스럽게 여성의 자궁/태를 가리킵니다.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  english_pob_choice: that they could become husbands for you
  chosen_korean: 그들이 여러분의 남편이 될 수라도 있습니까
  alternatives_korean:
  - 그들이 여러분의 남편이 되겠습니까
  - 그들이 여러분에게 남편이 될 수 있습니까
  lexicon: HALOT
  rationale: אֲנָשִׁים를 이 문맥의 결혼 관계에 맞게 ‘남편’으로 옮기고, 가능성/가정의 수사적 질문을 한국어의 ‘될 수라도 있습니까’로 살렸습니다.
theological_decisions:
- issue: 나오미의 수사적 질문이 실제 가능성보다 절망적 반문을 형성하는가
  chosen_reading: 이 문장은 정보 요청이 아니라, 더 갈 수 없는 현실을 강조하는 수사적 반문으로 읽었습니다.
  alternative_readings:
  - 단순한 미래 질문으로 읽을 수 있음
  - 가정적 가능성 확인으로 읽을 수 있음
  rationale: 문맥상 나오미는 며느리들의 동행을 말리며 자신의 상황이 결혼 재개를 보장하지 못함을 강조합니다.
  doctrine_reference: 문맥/화행 해석
