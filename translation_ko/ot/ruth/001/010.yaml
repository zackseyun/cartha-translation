lexical_decisions:
- source_word: וַתֹּאמַרְנָה לָּהּ
  english_pob_choice: But they said to her
  chosen_korean: 그러나 그들은 그녀에게 말했습니다
  alternatives_korean:
  - 그리고 그들은 그녀에게 말했습니다
  lexicon: WLC + HALOT
  rationale: 복수 여성 화자들의 말 시작을 자연스럽게 옮기면서, 앞선 나오미의 권유에 대한 반응이라는 대조를 살려 '그러나'로 시작했습니다.
- source_word: כִּי
  english_pob_choice: 'No'
  chosen_korean: 아니요
  alternatives_korean:
  - 정녕
  - 참으로
  - 왜냐하면
  lexicon: HALOT
  rationale: 여기서는 단순 접속사보다 거절과 반박의 강한 응답이 앞서므로, 한국어 직접화법에서는 '아니요'가 원문의 기능을 가장 잘 드러냅니다.
- source_word: נָשׁוּב
  english_pob_choice: we will return
  chosen_korean: 우리는 … 돌아가겠습니다
  alternatives_korean:
  - 우리는 … 돌아오겠습니다
  - 우리는 … 되돌아가겠습니다
  lexicon: HALOT
  rationale: שׁוּב의 반복 어근을 살리기 위해 '돌아가겠습니다'로 옮겨, 룻기 1장에 반복되는 '돌아감'의 주제를 유지했습니다.
- source_word: לְעַמֵּךְ
  english_pob_choice: to your people
  chosen_korean: 당신의 백성에게로
  alternatives_korean:
  - 당신의 ժողովուրդ에게로
  - 당신의 민족에게로
  - 당신의 사람들에게로
  lexicon: HALOT
  rationale: עַם은 단순 친족보다 공동체적·민족적 소속을 가리키므로, 한국어 성경 문맥에서 자연스럽고 충분히 넓은 '백성'을 택했습니다.
theological_decisions:
- issue: 동행 거부의 강조와 친밀한 호칭의 균형
  chosen_reading: 직접화법에서 나오미를 향한 2인칭은 존칭 '당신'을 유지하고, 거절은 '아니요'로 분명히 표현했습니다.
  alternative_readings:
  - '''아닙니다''로 더 공손하게 옮김'
  - '''우리''의 결단만 강조하고 거절은 완화함'
  rationale: 원문은 단순 정보 전달이 아니라 나오미의 권유를 단호히 거절하는 장면이므로, 한국어에서도 거절의 선명함을 흐리지 않되 관계적 존중은 유지해야 합니다.
  doctrine_reference: 서사 본문의 화행과 인물 관계에 대한 번역 원칙
