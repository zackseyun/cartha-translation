  rationale: 장소를 나타내는 בַּאֲשֶׁר의 뜻을 살리되, 한국어에서는 ‘곳에서’가 맥락상 자연스럽고 맹세문의 엄숙함도 유지합니다.
- source_word: אָמ֔וּת וְשָׁ֖ם אֶקָּבֵ֑ר
