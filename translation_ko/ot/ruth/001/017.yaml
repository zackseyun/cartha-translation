  - 저도 죽어 거기에서 묻히겠습니다
  lexicon: HALOT
  rationale: מות와 קבר의 병렬을 살려 죽음과 매장을 함께 진술했고, 미래·의지의 맹세 뉘앙스는 한국어의 청유/의지형 ‘-겠습니다’로 옮겼습니다.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  english_pob_choice: May Yahweh do so to me, and more also
  chosen_korean: 야훼께서 저에게 그렇게 하시고, 또 그보다 더 하시기를
  alternatives_korean:
  - 야훼께서 저에게 그렇게 하시고, 또 그보다 더 하시기를
  - 야훼께서 저에게 그렇게 하시며 더하시기를
  - 야훼께서 저에게 이와 같이 하시고 더하시기를
  lexicon: HALOT
  rationale: 히브리어의 정형적 자기저주 맹세 공식을 직역에 가깝게 살리되, 한국어 문장으로는 ‘-하시기를’이 맹세·기원의 힘을 가장 잘 전달합니다.
- source_word: יְהוָה
