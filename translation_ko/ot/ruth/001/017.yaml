theological_decisions:
- issue: 루트의 맹세가 담는 결속의 범위
  chosen_reading: 죽음 외에는 어떤 것도 당신과 저를 갈라놓지 못할 것입니다
  alternative_readings:
  - 죽음만이 당신과 저를 갈라놓을 수 있습니다
  - 죽음이 아니면 아무것도 우리를 갈라놓지 못합니다
  rationale: 히브리어 כִּי הַמָּוֶת יַפְרִיד는 ‘죽음 외의 어떤 것’도 분리를 허용하지 않는다는 뜻이므로, 관계적 결속의 절대성을 분명히 드러내는 방향으로 옮겼습니다.
  doctrine_reference: Ruth 1:17의 언약적 충성 표현
