base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
  footnotes:
  - marker: a
    text: Or, more literally, 'May the LORD do so to me, and so may he add.' This is a Hebrew oath formula invoking divine judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'if anything except death separates me from you.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신이 죽는 곳에서 저도 죽고, 그곳에 묻히겠습니다. 죽음 외에 무엇이든 당신과 저를 갈라놓는다면, 야훼께서 제게 그렇게 하시고 그보다 더하시기를 빕니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼께서 제게 이와 같이 하시고, 이와 같이 더하시기를’입니다. 이는 하나님의 심판을 자신에게 불러오는 히브리어 맹세 공식입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽음 말고 무엇이든 당신과 저를 갈라놓는다면’입니다. 뜻은 죽음만이 이 결속을 끊을 수 있다는 것입니다.
    reason: alternative_reading
