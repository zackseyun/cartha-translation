base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
  footnotes:
  - marker: a
    text: Or, more literally, 'May the LORD do so to me, and so may he add.' This is a Hebrew oath formula invoking divine judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'if anything except death separates me from you.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신이 죽는 곳에서 저도 죽고, 거기에서 저도 묻히겠습니다. 야훼께서 저에게 그렇게 하시고, 또 그보다 더 하시기를 — 죽음 외에는 어떤 것도 당신과 저를 갈라놓지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼께서 저에게 그렇게 하시고, 또 그보다 더 하시기를’이라는 히브리어 맹세 공식입니다.
    reason: lexical_alternative
  - marker: b
    text: 뜻은 ‘죽음 외에는 아무것도 당신과 저를 갈라놓지 못합니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּאֲשֶׁר תָּמוּתִי
  english_pob_choice: Where you die
  chosen_korean: 당신이 죽는 곳에서
