reference: Ruth 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
  footnotes:
  - marker: a
    text: Or, 'Would you remain unmarried for them?' The Hebrew verb is rare and likely refers to holding back from marriage while waiting for future husbands.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 위해서 그들이 다 자랄 때까지 기다리시겠습니까? 그들을 위해 남자에게 속하는 것을 그만두시겠습니까? 아니요, 내 딸들아. 나에게는 너희보다 훨씬 더 쓰라립니다. 야훼의 손이 나를 치고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀한 동사로, 문맥상 ‘결혼을 위해 기다리다/유보하다’는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  english_pob_choice: would you wait
  chosen_korean: 기다리시겠습니까
  alternatives_korean:
  - 기대하시겠습니까
  - 바라시겠습니까
  lexicon: HALOT
  rationale: 여기서는 가상의 아들들이 자랄 때까지의 시간을 ‘기다리다’로 자연스럽고 정확하게 옮기는 것이 낫습니다. ‘기대하다/바라다’는 시간적 지연보다 심리적 기대에 치우칩니다.
- source_word: תֵּעָגֵנָה + לְבִלְתִּי הֱיוֹת לְאִישׁ
  english_pob_choice: refrain from belonging to a man
  chosen_korean: 남자에게 속하는 것을 그만두시겠습니까
  alternatives_korean:
  - 결혼하지 않으시겠습니까
  - 남자와 관계를 맺지 않으시겠습니까
  lexicon: HALOT
  rationale: 희귀한 동사와 뒤따르는 관용구를 함께 반영해, 결혼 상태를 위해 스스로를 유보하는 뜻을 살렸습니다. ‘결혼하지 않다’보다 원문의 소유/귀속 뉘앙스를 조금 더 가깝게 드러냅니다.
- source_word: אַ֣ל בְּנֹתַ֗/י
  english_pob_choice: No, my daughters
  chosen_korean: 아니요, 내 딸들아
  alternatives_korean:
  - 아니, 내 딸들아
  - 그만두어라, 내 딸들아
  lexicon: HALOT
  rationale: 여기서 אַל은 단순 금지보다 절절한 거절의 말투로 기능하므로, 자연스러운 감탄적 거절로 옮겼습니다.
- source_word: מַר לִי מְאֹד מִכֶּם
  english_pob_choice: it is much more bitter for me than for you
  chosen_korean: 나에게는 너희보다 훨씬 더 쓰라립니다
  alternatives_korean:
  - 나에게는 너희보다 훨씬 더 고통스럽습니다
  - 내 처지가 너희보다 훨씬 더 쓰랍니다
  lexicon: HALOT
  rationale: מַר의 비유적 감각을 한국어의 ‘쓰라리다’로 살리고, 비교구 מִכֶּם은 ‘너희보다’로 분명히 드러냈습니다.
- source_word: יָצְאָה בִי יַד יְהוָה
  english_pob_choice: the hand of Yahweh has gone out against me
  chosen_korean: 야훼의 손이 나를 치고 있기 때문입니다
  alternatives_korean:
  - 야훼의 손이 나를 거슬러 나갔기 때문입니다
  - 야훼의 손이 나를 향해 나갔기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘손’과 ‘나가다’ 이미지를 그대로 살리면서, 문맥상 해를 입히는 뜻을 한국어의 ‘치다’로 자연스럽게 표현했습니다. ‘대적하여 나가다’보다 현재의 고통 상태가 더 분명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다. 이는 고유명을 유지해 서술의 직접성을 보존합니다.
theological_decisions:
- issue: 여호와/야훼의 손이 고난의 원인으로 진술되는 표현
  chosen_reading: 야훼의 손이 나를 치고 있기 때문입니다
  alternative_readings:
  - 야훼의 손이 나를 거슬러 나갔기 때문입니다
  - 야훼의 손이 나를 향해 나갔기 때문입니다
  rationale: 본문은 나오미의 고난을 야훼의 손과 직접 연결하므로, 그 신학적 긴장을 완화하지 않고 그대로 보존했습니다. 다만 한국어에서는 현재적 고통을 분명히 하기 위해 동작성을 살렸습니다.
  doctrine_reference: 고난의 신적 귀속을 약화시키지 않음; 신명은 야훼로 번역
