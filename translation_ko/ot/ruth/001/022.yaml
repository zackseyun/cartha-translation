id: RUT.1.22
reference: Ruth 1:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֣שָׁב נָעֳמִ֗י וְ/ר֨וּת הַ/מּוֹאֲבִיָּ֤ה כַלָּתָ/הּ֙ עִמָּ֔/הּ הַ/שָּׁ֖בָה מִ/שְּׂדֵ֣י מוֹאָ֑ב וְ/הֵ֗מָּה בָּ֚אוּ בֵּ֣ית לֶ֔חֶם בִּ/תְחִלַּ֖ת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'from the country of Moab.' The Hebrew reads 'from the fields of Moab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 나오미가 돌아오고, 모압 여인 룻도, 곧 그녀와 함께 모압 들판에서 돌아온 며느리도 함께 돌아왔습니다. 그들은 보리 추수의 시작에 베들레헴에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모압 들판’은 히브리어의 직역이며, 영어 POB의 각주처럼 더 관용적으로는 ‘모압 지방/나라에서’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아오고
  alternatives_korean:
  - 돌아왔습니다
  - 되돌아왔습니다
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아오다’를 자연스럽게 살리되, 서술 흐름상 뒤의 ‘이르렀습니다’와 연결되도록 했습니다.
- source_word: הַמּוֹאֲבִיָּה
  english_pob_choice: the Moabite
  chosen_korean: 모압 여인
  alternatives_korean:
  - 모압 사람
  - 모압 여자
  lexicon: HALOT
  rationale: 민족적/지리적 출신을 드러내는 여성형 형용사로서, 직역적이고도 한국어에서 자연스러운 ‘모압 여인’을 택했습니다.
- source_word: הַשָּׁבָה מִשְּׂדֵי מוֹאָב
  english_pob_choice: the one who returned from the fields of Moab
  chosen_korean: 곧 그녀와 함께 모압 들판에서 돌아온 며느리도
  alternatives_korean:
  - 곧 모압 들판에서 돌아온 며느리도
  - 곧 모압의 들에서 돌아온 며느리도
  lexicon: HALOT
  rationale: 분사 구문을 한국어에서 어색하지 않게 풀어, 룻을 가리키는 설명적 동격을 분명히 했습니다. ‘모압 들판’은 원문의 שְׂדֵי(들, fields)를 보존한 표현입니다.
- source_word: בֵּית לֶחֶם
  english_pob_choice: Bethlehem
  chosen_korean: 베들레헴
  alternatives_korean:
  - 베들레헴 성읍
  lexicon: HALOT
  rationale: 고유명사는 한국어에 정착된 표기를 따랐습니다.
- source_word: בִּתְחִלַּת קְצִיר שְׂעֹרִים
  english_pob_choice: at the beginning of the barley harvest
  chosen_korean: 보리 추수의 시작에
  alternatives_korean:
  - 보리 수확이 시작될 때
  - 보리 추수 초기에
  lexicon: HALOT
  rationale: 시간 부사구를 간결하게 옮겨, 절기의 시작이라는 서술적 기능을 살렸습니다.
theological_decisions:
- issue: 룻의 정체를 어떻게 드러낼지
  chosen_reading: ‘모압 여인 룻’으로 민족적 표지를 앞에 두어, 이방 출신인 룻의 서사적 중요성을 유지했습니다.
  alternative_readings:
  - ‘모압 사람 룻’
  - 단순히 ‘룻’
  rationale: 본문은 룻의 출신을 단순 배경이 아니라 반복적으로 강조합니다. 따라서 표지를 약화하지 않는 번역이 적절합니다.
  doctrine_reference: 본문 내 서사적 강조의 보존
