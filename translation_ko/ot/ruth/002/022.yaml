  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
  footnotes:
  - marker: a
    text: Or 'so that they do not bother/assault you in another field.' The Hebrew verb can denote an encounter that is merely meeting or one that is harmful; the context of Naomi's concern for Ruth's safety suggests a negative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 나오미가 며느리 룻에게 말했습니다. “내 딸아, 네가 그의 젊은 여자들과 함께 나가는 것이 좋구나. 그래야 그들이 다른 밭에서 너를 만나지 않을 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פָּגַע는 단순히 ‘만나다’일 수도 있고, 문맥상 해로운 ‘맞닥뜨리다/해치다’의 뜻일 수도 있습니다. 나오미가 룻의 안전을 염려하는 흐름을 고려하면 부정적 뉘앙스가 유력합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우-연속의 서술 진행을 자연스러운 한국어 순서 표현으로 옮기되, 사건의 연속성을 살렸습니다.
- source_word: כַּלָּתָהּ
  english_pob_choice: her daughter-in-law
  chosen_korean: 며느리
  alternatives_korean:
  - 시집간 딸
  - 사위의 아내
  lexicon: HALOT
  rationale: 룻과 나오미의 관계를 직접 가리키는 기본 의미이므로 한국어의 표준 친족어인 ‘며느리’로 옮겼습니다.
- source_word: נַעֲרוֹתָיו
  english_pob_choice: his young women
  chosen_korean: 그의 젊은 여자들
  alternatives_korean:
  - 그의 일하는 여자들
  - 그의 여종들
  lexicon: HALOT
  rationale: 문맥상 보아스의 여성 일꾼들을 가리키지만, 본문 자체는 직분을 명시하지 않으므로 ‘젊은 여자들’로 비교적 직접적으로 옮겼습니다.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  english_pob_choice: so that they do not come upon you
  chosen_korean: 그래야 그들이 ... 너를 만나지 않을 것이다
  alternatives_korean:
  - 그래야 그들이 ... 너를 맞닥뜨리지 않을 것이다
  - 그래야 그들이 ... 너를 해치지 않을 것이다
  lexicon: HALOT
  rationale: פָּגַע의 의미 범위는 ‘만나다/마주치다’부터 해로운 접촉까지 넓지만, 한국어 본문에서는 원뜻을 보존하는 ‘만나지 않다’로 두고 해석을 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 룻에 대한 나오미의 보호 의도와 פָּגַע의 뉘앙스
  chosen_reading: ‘만나지 않다’로 번역해, 다른 밭에서의 위험 가능성을 암시하되 본문이 명시하지 않은 가해 의미를 본문 안에 고정하지 않았습니다.
  alternative_readings:
  - ‘해치지 않다’
  - ‘불쾌하게 하지 않다’
  rationale: 히브리어 동사는 중립적 만남과 해로운 접촉을 모두 가질 수 있으므로, 문맥의 보호 의도를 살리되 의미 범위를 유지하는 쪽이 가장 투명합니다.
  doctrine_reference: 본문 문맥 주해 원칙
