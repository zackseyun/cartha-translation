base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
  footnotes:
  - marker: a
    text: Or “between the sheaves.” The Hebrew preposition is literally “between,” but “among” is more natural English in this setting.
    reason: lexical_alternative
  - marker: b
    text: Or “do not shame her.” The Hebrew verb can denote causing disgrace or public humiliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 이삭을 주우러 일어나자, 보아스는 자기 소년들에게 명하여 말했습니다. 「그녀가 이삭들 사이에서도 주울 수 있게 하고, 그녀를 모욕하지 마십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이삭들 사이에서도’는 히브리어 전치사 בֵּין의 문자적 의미(‘사이’)를 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘모욕하지 마십시오’는 히브리어 동사의 공개적 수치·망신의 뜻을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  english_pob_choice: When she rose to glean
  chosen_korean: 그녀가 이삭을 주우러 일어나자
  alternatives_korean:
  - 그녀가 이삭을 주우려고 일어났을 때
  - 그녀가 주우러 일어나자
  lexicon: HALOT
  rationale: לְלַקֵּט의 목적 의미를 살려 ‘이삭을 주우러’로 옮기고, וַתָּקָם의 이어지는 서사 흐름은 ‘일어나자’로 자연스럽게 표현했습니다.
- source_word: וַיְצַו ... לֵאמֹר
  english_pob_choice: Boaz commanded ... saying
  chosen_korean: 보아스는 자기 소년들에게 명하여 말했습니다
  alternatives_korean:
  - 보아스는 자기 일꾼들에게 지시하며 말했습니다
  - 보아스는 자기 젊은이들에게 명령하며 말했습니다
  lexicon: HALOT
  rationale: צוה의 명령성을 살려 ‘명하여’로 옮겼고, לֵאמֹר의 말하기 도입을 ‘말했습니다’로 자연스럽게 처리했습니다.
- source_word: נְעָרָיו
  english_pob_choice: his young men
  chosen_korean: 자기 소년들
  alternatives_korean:
  - 자기 젊은 남자들
  - 자기 일꾼들
  lexicon: HALOT
  rationale: 여기서는 보아스의 들판 인력을 가리키므로, 관계와 연령감을 함께 드러내는 ‘소년들’이 원문 어휘의 뉘앙스를 비교적 직접적으로 반영합니다.
- source_word: בֵּין הָעֳמָרִים
  english_pob_choice: even among the sheaves
  chosen_korean: 이삭들 사이에서도
  alternatives_korean:
  - 단들 사이에서도
  - 그 단들 가운데서도
  lexicon: HALOT
  rationale: בֵּין의 ‘사이’ 의미를 살리되 한국어에서 자연스러운 활동 공간 표현으로 옮겼습니다. ‘이삭들’은 수확 문맥을 반영한 일반적 번역입니다.
- source_word: וְלֹא תַכְלִימוּהָ
  english_pob_choice: and do not humiliate her
  chosen_korean: 그녀를 모욕하지 마십시오
  alternatives_korean:
  - 그녀를 부끄럽게 하지 마십시오
  - 그녀를 창피하게 하지 마십시오
  lexicon: HALOT
  rationale: כלם의 사회적 수치와 공개적 망신의 뉘앙스를 한국어에서 가장 직접적으로 드러내는 말은 ‘모욕하다’입니다.
theological_decisions:
- issue: 보아스의 지시를 직접화법에서 어떻게 전달할지
  chosen_reading: 직접 인용문 안에서는 하급자에게 하는 명령형을 ‘~십시오’로 유지해 보아스의 권위와 보호 의도를 분명히 했습니다.
  alternative_readings:
  - ‘~하지 말아라’처럼 더 구어적인 명령형
  - 간접화로 풀어 ‘그녀를 모욕하지 말라고 했습니다’
  rationale: 본문은 보호를 위한 실제 명령을 제시하므로, 현대 합쇼체로 명확하고 공손하게 살리는 것이 적절합니다.
  doctrine_reference: 서사문 직접화법의 문체와 화행 보존
