source:
  edition: WLC
  text: עֵינַ֜יִ/ךְ בַּ/שָּׂדֶ֤ה אֲשֶׁר יִקְצֹרוּ/ן֙ וְ/הָלַ֣כְתִּ אַחֲרֵי/הֶ֔ן הֲ/ל֥וֹא צִוִּ֛יתִי אֶת הַ/נְּעָרִ֖ים לְ/בִלְתִּ֣י נָגְעֵ֑/ךְ וְ/צָמִ֗ת וְ/הָלַכְתְּ֙ אֶל הַ/כֵּלִ֔ים וְ/שָׁתִ֕ית מֵ/אֲשֶׁ֥ר יִשְׁאֲב֖וּ/ן הַ/נְּעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
  footnotes:
  - marker: a
    text: Or, more contextually, 'not to lay a hand on you.' The Hebrew literally says 'not to touch you,' which may include protection from harassment or assault.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 거두는 밭을 눈여겨보시고, 그들[a] 뒤를 따라가십시오. 내가 젊은이들에게 당신을 건드리지 말라고 명령하지 않았습니까? 목마를 때에는 그릇들이 있는 곳에 가서 젊은이들이 길어 온 물을 마시십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그들’은 여성 복수형으로, 앞서 언급된 여인 일꾼들을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: עֵינַיִךְ
  english_pob_choice: Keep your eyes on
  chosen_korean: 밭에서 추수하는 곳을 살피고
  alternatives_korean:
  - 눈을 두십시오
  - 눈여겨보십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘당신의 눈’이지만, 한국어에서는 직접적인 몸기관 표현보다 ‘살피다’가 명령의 초점을 자연스럽게 살립니다.
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  english_pob_choice: follow behind them
  chosen_korean: 그들 뒤를 따라가십시오
  alternatives_korean:
  - 그들을 따라가십시오
  - 그들 뒤로 가십시오
  lexicon: HALOT
  rationale: אַחֲרֵיהֶן의 공간적 의미를 살려 ‘뒤를’ 넣었고, 합쇼체 명령형으로 자연스럽게 옮겼습니다.
- source_word: לְבִלְתִּי נָגְעֵךְ
  english_pob_choice: not to touch you
  chosen_korean: 당신을 건드리지 말라고
  alternatives_korean:
  - 당신에게 손대지 말라고
  - 당신을 만지지 말라고
  lexicon: HALOT
  rationale: 문자적 ‘touch’보다 이 문맥에서 더 강하게 들리는 해악·희롱 가능성을 한국어 ‘건드리다’가 어느 정도 반영합니다.
- source_word: הַכֵּלִים
  english_pob_choice: the jars
  chosen_korean: 그릇들로
  alternatives_korean:
  - 항아리들로
  - 물동이들로
  lexicon: HALOT
  rationale: 어휘가 넓어 구체적 용기를 단정하기 어려워, 물을 길어 마시는 맥락을 해치지 않는 넓은 표현을 택했습니다.
- source_word: יִשְׁאֲבוּן
  english_pob_choice: have drawn
  chosen_korean: 길어 온 것에서
  alternatives_korean:
  - 길어 온 물에서
  - 퍼 온 것에서
  lexicon: HALOT
  rationale: ‘draw water’의 동작을 한국어 관용에 맞게 ‘길어 오다’로 옮겨, 이미 길어진 물을 마신다는 순서를 드러냈습니다.
theological_decisions:
- issue: 보호 명령의 강도
  chosen_reading: ‘당신을 건드리지 말라’는 문장을 그대로 두어, 보아스의 보호가 단순한 예의가 아니라 실제 접촉 금지 명령임을 드러냈습니다.
  alternative_readings:
  - ‘당신에게 손대지 말라’로 완화
  - ‘당신을 함부로 하지 말라’로 의역
  rationale: 히브리어 נגע는 문자적으로 ‘만지다’이지만, 본문 맥락에서는 안전과 경계 설정의 실질적 명령으로 읽히므로 그 긴장을 유지했습니다.
  doctrine_reference: 본문 맥락 주해
