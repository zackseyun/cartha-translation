  verdict: revise
  source_fidelity: 첫 문장의 ‘밭에서 추수하는 곳을 살피고’는 히브리어의 ‘그들이 거두는 밭에 눈을 두라’는 뜻을 다소 어색하게 옮깁니다. ‘그들이 거두는 밭을 눈여겨보시고’가 밭과 눈의 관계를 더 정확하고 자연스럽게 드러냅니다. 또한 הַכֵּלִים는 물을 담은 용기들을 가리키므로 ‘그릇들로 가서’보다 ‘그릇들이 있는 곳에 가서’가 한국어 문법과 문맥에 맞습니다.
  naturalness: 전체적으로 합쇼체는 유지되어 있으나, ‘밭에서 추수하는 곳’과 ‘그릇들로 가서’는 현대 표준 한국어로 다소 부자연스럽습니다. ‘눈여겨보시고’, ‘그릇들이 있는 곳에 가서’, ‘길어 온 물을 마시십시오’로 다듬으면 자연스럽습니다.
  terminology: ‘건드리지 말라’는 נגע의 문자적 접촉 금지와 문맥상의 보호 명령을 무리 없이 보존합니다. אַחֲרֵיהֶן의 여성 복수 지시는 본문에서 성별을 과도하게 보충하지 않고 각주로 밝혀 두는 것이 적절합니다.
