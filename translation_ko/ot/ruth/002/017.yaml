source:
  edition: WLC
  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
  footnotes:
  - marker: a
    text: An ephah was an ancient dry measure, roughly 20–22 liters (about half a bushel).
    reason: cultural_note
translation:
  language: ko
  text: 그녀는 저녁까지 밭에서 이삭을 주웠고, 주운 것을 두드려 털어 내었더니, 보리가 약 한 에바쯤 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에바는 고대의 건량 단위로, 대략 20~22리터(약 반 부셸)입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט / gleaned
  english_pob_choice: So she gleaned
  chosen_korean: 이삭을 주웠고
  alternatives_korean:
  - 이삭을 거두었고
  - 이삭을 주었고
  lexicon: HALOT
  rationale: 룻기의 לקט는 추수 뒤 남은 이삭을 줍는 농경적 행위를 가리키므로, 일반적인 ‘거두다’보다 ‘이삭을 줍다’가 의미를 더 분명하게 드러냅니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 밭에서
  alternatives_korean:
  - 들판에서
  - 그 밭에서
  lexicon: HALOT
  rationale: שָׂדֶה는 보통 농사짓는 ‘밭’을 뜻하므로, 한국어에서는 자연스럽고 구체적인 ‘밭’이 적합합니다.
- source_word: וַתַּחְבֹּט
  english_pob_choice: beat out
  chosen_korean: 도리어 털어 내니
  alternatives_korean:
  - 두드려 낸 후
  - 털어 내니
  lexicon: HALOT
  rationale: חבט는 거둔 곡식에서 알곡을 분리하려고 두드리는 동작이므로, ‘도리어 털어 내다’가 결과까지 포함해 자연스럽게 옮깁니다.
- source_word: כְּאֵיפָה שְׂעֹרִים
  english_pob_choice: about an ephah of barley
  chosen_korean: 보리가 약 한 에바쯤
  alternatives_korean:
  - 보리 한 에바쯤
  - 보리 약 한 되쯤
  lexicon: HALOT
  rationale: אֵיפָה는 고대 건량 단위이므로 음역 ‘에바’를 유지하고, כ의 근사 의미를 ‘약 …쯤’으로 살렸습니다.
