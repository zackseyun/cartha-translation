  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
  footnotes:
  - marker: a
    text: Or “from the field of Moab”; the Hebrew singular may be understood collectively for the agricultural land of Moab.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 보리를 베는 일꾼들 위에 세워진 그 젊은 사람이 대답하며 말했습니다. “그 여자는 모압 사람 젊은 여자입니다. 나오미와 함께 모압 들판에서 돌아온 여자입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단수형은 모압의 농경지 전체를 가리키는 집합적 의미로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר הַנִּצָּב עַל הַקּוֹצְרִים
  english_pob_choice: the young man who was set over the reapers
  chosen_korean: 보리를 베는 일꾼들 위에 세워진 그 젊은 사람
  alternatives_korean:
  - 보리 추수꾼들 위에 세워진 그 젊은 사람
  - 보리를 베는 사람들을 감독하던 그 젊은 사람
  lexicon: HALOT
  rationale: נַעַר는 기본적으로 ‘젊은 사람/청년’이므로 ‘젊은 사람’으로 살리고, נִצָּב עַל은 여기서 단순한 서 있음보다 위에 배치된 관리·감독의 위치를 나타내므로 ‘세워진’으로 옮겼습니다.
- source_word: הַקּוֹצְרִים
  english_pob_choice: the reapers
  chosen_korean: 보리를 베는 일꾼들
  alternatives_korean:
  - 추수꾼들
  - 수확하는 사람들
  lexicon: HALOT
  rationale: קוצר는 곡식을 베는 수확 노동자를 가리키므로, 한국어에서 자연스럽고 문맥이 분명한 ‘보리를 베는 일꾼들’로 구체화했습니다.
- source_word: מֽוֹאֲבִיָּה
  english_pob_choice: a young Moabite woman
  chosen_korean: 모압 사람 젊은 여자
  alternatives_korean:
  - 모압 여인
  - 모압 여자
  lexicon: HALOT
  rationale: 민족·출신을 나타내는 형용사는 ‘모압 사람’으로 직접 풀어, 혈통·소속을 분명히 했습니다. ‘여자’는 현대 한국어에서 가장 평이하고 직접적인 대응입니다.
- source_word: מִשְּׂדֵה מוֹאָב
  english_pob_choice: from the fields of Moab
  chosen_korean: 모압 들판에서
  alternatives_korean:
  - 모압의 들에서
  - 모압의 들판들에서
  lexicon: HALOT
  rationale: שְׂדֵה는 단수형이지만 지역 전체를 가리키는 집합적 용법이 가능하므로, POB의 ‘fields’ 취지를 반영해 자연스러운 지명적 표현인 ‘모압 들판’으로 옮겼습니다.
theological_decisions:
- issue: 룻의 정체를 말하는 화자의 시점
  chosen_reading: 직접적인 관찰 진술로 유지하고, 신학적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 배경설명이나 평가를 덧붙이는 번역
  - ‘이방 여인’처럼 정체성을 신학적으로 강조하는 번역
  rationale: 본문은 단순히 출신과 귀환 경위를 식별하는 말이므로, 서술의 절제와 현장감을 보존하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 본문 해석의 절제와 서술 문맥 보존
- issue: 등록어 선택
  chosen_reading: 화자 발화는 현대 서술체 ‘말했습니다’를 쓰고, 인용문은 평서체로 유지했습니다.
  alternative_readings:
  - 더 구어적인 ‘말했어요’
  - 성경체의 고어적 종결
  rationale: 합쇼체 서술과 인용문 내부의 직접성 사이 균형을 위해, 공적 낭독에도 적합한 현대 표준어를 사용했습니다.
  doctrine_reference: 문체 일관성과 공예배 낭독 가독성
