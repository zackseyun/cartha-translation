  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
  footnotes:
  - marker: a
    text: Or 'recognize me,' 'regard me,' or 'acknowledge me' for 'take notice of me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 얼굴을 땅에 대고 엎드려 절하며 그에게 말했습니다. “왜 제가 당신의 눈에 은혜를 입어, 저를 알아보시려 합니까? 저는 외국 여자에 불과한데요.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알아보다’, ‘주의를 기울이다’, 또는 ‘인정하다’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל פָּנֶיהָ
  english_pob_choice: she fell on her face
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴에 엎드려
  - 엎드려 얼굴을 땅에 대고
  lexicon: HALOT
  rationale: 히브리어 관용구가 드러내는 낮은 자세와 수치를 한국어로 자연스럽게 살리되, 신체 이미지를 유지했습니다.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  english_pob_choice: bowed to the ground
  chosen_korean: 절하며
  alternatives_korean:
  - 땅에 절하며
  - 몸을 굽혀 땅에 엎드리며
  lexicon: HALOT
  rationale: 이 동작은 보아스 앞에서의 공손한 몸짓이므로, 예배로 오해될 수 있는 표현을 피하면서도 ‘절하다’의 예절적 의미를 살렸습니다.
- source_word: חֵן בְּעֵינֶיךָ
  english_pob_choice: found favor in your eyes
  chosen_korean: 당신의 눈에 은혜를 입어
  alternatives_korean:
  - 당신의 눈에 호의를 얻어
  - 당신께 호의를 얻어
  lexicon: HALOT
  rationale: 직역하면 ‘눈에 은혜를 찾다’라는 관용구라서, ‘눈에 은혜를 입다’로 옮겨 호의의 이미지를 보존했습니다.
- source_word: לְהַכִּירֵנִי
  english_pob_choice: that you should take notice of me
  chosen_korean: 저를 알아보시려 합니까
  alternatives_korean:
  - 저를 눈여겨보시려 합니까
  - 저를 알아주시려 합니까
  - 저를 인정하시려 합니까
  lexicon: HALOT
  rationale: נכר의 사역형은 단순한 식별보다 ‘알아보다/주의를 기울이다’의 뜻이므로, 문맥상 보아스의 호의 어린 주목을 살려 번역했습니다.
- source_word: נָכְרִיָּה
  english_pob_choice: a foreign woman
  chosen_korean: 외국 여자에 불과한데요
  alternatives_korean:
  - 외국 여자인데요
  - 이방 여자일 뿐인데요
  - 나그네 여자일 뿐인데요
  lexicon: HALOT
  rationale: 여성형을 살리면서도 루스가 자신의 낮은 사회적 지위를 강조하는 뉘앙스를 담기 위해 ‘...에 불과한데요’로 옮겼습니다.
theological_decisions:
- issue: וַתִּשְׁתַּחוּ אָרְצָה를 예배로 볼지 공손한 몸짓으로 볼지
  chosen_reading: 보아스에게 드리는 사회적 경의와 겸손의 절로 읽었습니다.
  alternative_readings:
  - 종교적 예배 행위로 읽는 번역
  - 단순히 허리를 굽히는 정도로 완화하는 번역
  rationale: 서사 맥락상 루스는 하나님께 예배하는 것이 아니라 보아스 앞에서 극도의 겸손을 표현하고 있으므로, 예배적 의미를 덧씌우지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 신학적 의미를 덧입히지 않음'
