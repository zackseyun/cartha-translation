source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ ר֨וּת הַ/מּוֹאֲבִיָּ֜ה אֶֽל נָעֳמִ֗י אֵֽלְכָה נָּ֤א הַ/שָּׂדֶה֙ וַ/אֲלַקֳטָּ֣ה בַ/שִׁבֳּלִ֔ים אַחַ֕ר אֲשֶׁ֥ר אֶמְצָא חֵ֖ן בְּ/עֵינָ֑י/ו וַ/תֹּ֥אמֶר לָ֖/הּ לְכִ֥י בִתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
  footnotes:
  - marker: a
    text: Or “and glean among the heads of grain.”
    reason: lexical_alternative
  - marker: b
    text: Literally “after whom I find favor in his eyes,” a Hebrew idiom for receiving someone's favorable regard.
    reason: lexical_alternative
translation:
  language: ko
  text: 모압 여인 룻이 나오미에게 말했습니다. “부디 제가 밭으로 가서 이삭을 줍게 해 주십시오[a]. 제게 호의를 베푸는 사람을 따라[b] 하겠습니다.” 그러자 나오미가 룻에게 말했습니다. “가십시오, 내 딸아.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “곡식 이삭 사이에서 이삭을 줍게 해 주십시오.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용으로, 직역하면 “내가 그의 눈에서 호의를 얻는 사람 뒤를 따라”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  english_pob_choice: the Moabite
  chosen_korean: 모압 여인 룻
  alternatives_korean:
  - 모압 사람 룻
  - 모압 여자 룻
  lexicon: HALOT
  rationale: 지명적 출신을 드러내는 민족 표지를 한국어로 자연스럽게 옮기되, 현대 독자가 이해하기 쉬운 표현을 택했습니다.
- source_word: אֵלְכָה נָּא
  english_pob_choice: Please let me go
  chosen_korean: 부디 제가 … 가서
  alternatives_korean:
  - 제가 가겠습니다
  - 가게 해 주십시오
  lexicon: HALOT
  rationale: 청유형과 נָא의 정중한 요청을 살려, 단순 미래나 의지 표명보다 허락을 구하는 뉘앙스를 반영했습니다.
- source_word: וַאֲלַקֳטָּה בַשִּׁבֳּלִים
  english_pob_choice: and glean among the ears of grain
  chosen_korean: 밭으로 가서, … 이삭을 주워 모으게 해 주십시오
  alternatives_korean:
  - 밭에서 이삭을 주워 모으게 해 주십시오
  - 곡식 이삭 사이에서 이삭을 주우려 합니다
  lexicon: HALOT
  rationale: לקט은 단순 수집이 아니라 추수 후 남은 것을 줍는 ‘이삭줍기’이므로, 한국어 관용과 농경 맥락을 함께 살렸습니다.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  english_pob_choice: after the one in whose eyes I find favor
  chosen_korean: 제가 호의를 얻는 사람 뒤를 따라
  alternatives_korean:
  - 제가 은총을 입는 사람 뒤를 따라
  - 제가 호의를 얻는 그 사람 뒤를 따라
  lexicon: HALOT
  rationale: ‘눈에서 은총/호의를 얻다’는 히브리식 관용을 한국어의 자연스러운 ‘호의를 얻다’로 옮기되, ‘뒤를 따라’로 관계적·실천적 의미를 드러냈습니다.
- source_word: בִתִּי
  english_pob_choice: my daughter
  chosen_korean: 내 딸아
  alternatives_korean:
  - 내 딸
  - 얘야
  lexicon: HALOT
  rationale: 나오미의 애정 어린 호칭을 살리면서도, 본문의 구어적 친밀감을 한국어로 무리 없이 전달했습니다.
theological_decisions:
- issue: חֵן의 번역에서 ‘은혜’ 대신 ‘호의’를 택함
  chosen_reading: 여기서는 신학적 개념어보다 사회적·관계적 맥락을 살린 ‘호의’로 번역했습니다.
  alternative_readings:
  - 은혜
  - 은총
  rationale: 본문은 하나님과의 구원론적 은혜가 아니라, 타인에게서 받는 호감·호의의 관용구를 말하므로 문맥에 맞게 구분했습니다.
  doctrine_reference: 히브리어 חֵן의 문맥적 용례 구분
- issue: 노아미의 말에서 직접 화법의 친밀한 어조 유지
  chosen_reading: 「가거라, 내 딸아.」로 옮겨 애정 어린 권면을 유지했습니다.
  alternative_readings:
  - 「가, 내 딸아.」
  - 「가거라, 딸아.」
  rationale: 대상 관계의 따뜻함과 권면의 짧은 명령형을 함께 보존하기 위해 친밀한 호칭을 유지했습니다.
  doctrine_reference: 서사 대화의 화용론
