  to: 모압 여인 룻이 나오미에게 말했습니다. “부디 제가 밭으로 가서 이삭을 줍게 해 주십시오[a]. 제게 호의를 베푸는 사람을 따라[b] 하겠습니다.” 그러자 나오미가 룻에게 말했습니다. “가십시오, 내 딸아.”
  rationale: 본문에 누락된 ‘모압 여인’을 복원하고, 나오미가 룻에게 말한 사실을 정확히 반영했습니다. 룻의 요청은 허락을 구하는 뉘앙스를 유지했으며, ‘호의’는 חֵן의 비신학적 사회적 의미를 자연스럽게 전달합니다. 각주 표지는 해당 어구에 연결하고, 모든 직접화법을 현대 합쇼체로 정리했습니다.
