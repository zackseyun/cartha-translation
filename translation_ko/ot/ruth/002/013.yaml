  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
  footnotes:
  - marker: a
    text: Or “you have spoken kindly to your female servant.” The Hebrew is literally “you have spoken to the heart of your female servant.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다. “나리, 제가 나리의 눈에 은혜를 입기를 바랍니다. 나리께서 저를 위로해 주셨고, 여종에게 다정하게 말씀해 주셨기 때문입니다.[a] 저는 나리의 여종들 가운데 하나와도 같지 않은데도 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 “당신의 여종의 마음에 말씀하셨다”입니다. 이 표현은 여종에게 다정하게, 또는 위로하여 말해 주었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  english_pob_choice: May I find favor
  chosen_korean: 은혜를 입게 해 주십시오
  alternatives_korean:
  - 좋은 호의를 얻게 해 주십시오
  - 은총을 얻게 해 주십시오
  lexicon: HALOT
  rationale: 청유형의 공손한 간구로 기능하는 관용구이므로, 직역보다 한국어에서 자연스러운 간청 표현으로 옮기되 ‘은혜’로 호의의 의미를 보존했습니다.
- source_word: בְּעֵינֶיךָ
  english_pob_choice: in your eyes
  chosen_korean: 당신의 눈에
  alternatives_korean:
  - 당신 보시기에
  - 당신 앞에
  lexicon: HALOT
  rationale: 평가와 호의를 나타내는 히브리어 관용구를 이미지 그대로 살려, 원문의 투명성을 유지했습니다.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  english_pob_choice: your servant / your female servants
  chosen_korean: 당신의 여종 / 당신의 여종들
  alternatives_korean:
  - 당신의 종 / 당신의 종들
  - 당신의 여자 종 / 당신의 여자 종들
  lexicon: HALOT
  rationale: 원어가 여성 종을 가리키므로 두 용례를 구분해 ‘여종’으로 옮겼습니다. 앞의 자기 지칭은 단수, 뒤의 비교 대상은 복수로 반영했습니다.
- source_word: דִבַּרְתָּ עַל לֵב
  english_pob_choice: you have spoken to the heart of
  chosen_korean: 마음에 말씀하셨기 때문입니다
  alternatives_korean:
  - 마음을 어루만져 주셨기 때문입니다
  - 위로의 말을 건네셨기 때문입니다
  lexicon: HALOT
  rationale: 직역인 ‘마음에 말씀하다’를 유지하되, 한국어에서 어색하지 않도록 ‘마음에 말씀하셨다’로 다듬었습니다. 이는 위로와 격려의 뜻을 함께 담습니다.
theological_decisions:
- issue: 보아스에 대한 호칭 אֲדֹנִי의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 나의 주인
  - 선생님
  - 주인이시여
  rationale: 여기서는 인간 보아스에 대한 공손한 호칭이므로, 소유 뉘앙스가 강한 ‘주인’보다 존칭적 호칭을 택했습니다. 문맥상 과도한 종교적 오해를 피하면서도 원문의 예의는 유지됩니다.
  doctrine_reference: 공손한 사회적 호칭의 문맥적 번역
