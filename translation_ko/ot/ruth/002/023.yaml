  text: וַ/תִּדְבַּ֞ק בְּ/נַעֲר֥וֹת בֹּ֨עַז֙ לְ/לַקֵּ֔ט עַד כְּל֥וֹת קְצִֽיר הַ/שְּׂעֹרִ֖ים וּ/קְצִ֣יר הַֽ/חִטִּ֑ים וַ/תֵּ֖שֶׁב אֶת חֲמוֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
  footnotes:
  - marker: a
    text: Or 'clung to Boaz's young women.' The Hebrew verb can emphasize close attachment.
    reason: lexical_alternative
  - marker: b
    text: Or 'she stayed with her mother-in-law.' The Hebrew verb can mean 'stayed,' 'remained,' or 'lived/dwelt,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 보아스의 젊은 여자들 곁에 붙어 이삭을 주우며, 보리 수확과 밀 수확이 끝날 때까지 지냈습니다.[a] 그리고 시어머니와 함께 살았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘달라붙다’ 또는 ‘바싹 붙어 있다’라는 더 강한 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문맥에 따라 ‘머물다’, ‘남아 있다’, 또는 ‘살다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  english_pob_choice: stayed close
  chosen_korean: 붙어 있었습니다
  alternatives_korean:
  - 가까이 머물렀습니다
  - 따라다녔습니다
  - 달라붙었습니다
  lexicon: HALOT
  rationale: דבק는 ‘붙다, 달라붙다, 밀착하다’의 강한 결속감을 지니므로, 문맥상 자연스럽게 관계의 지속성을 살리는 ‘붙어 있었습니다’로 옮겼습니다.
- source_word: בְּנַעֲרֹות בֹּעַז
  english_pob_choice: Boaz's young women
  chosen_korean: 보아스의 젊은 여자들
  alternatives_korean:
  - 보아스의 여종들
  - 보아스의 젊은 일꾼들
  - 보아스의 시녀들
  lexicon: HALOT
  rationale: נַעֲרוֹת는 보아스의 밭일에 참여하는 젊은 여자들을 가리키므로, 관계를 드러내는 소유격을 유지하되 성별과 연령감을 살려 ‘젊은 여자들’로 옮겼습니다.
- source_word: לְלַקֵּט
  english_pob_choice: to glean
  chosen_korean: 거두는 일
  alternatives_korean:
  - 이삭 줍는 일
  - 이삭을 줍는 일
  - 줍는 일
  lexicon: HALOT
  rationale: ללקט는 이삭을 ‘줍다/거두다’는 의미지만, 한국어에서는 본문과 자연스럽게 연결되도록 목적을 드러내는 ‘거두는 일’로 표현했습니다.
- source_word: וַתֵּשֶׁב אֶת חֲמוֹתָהּ
  english_pob_choice: she lived with her mother-in-law
  chosen_korean: 그녀는 시어머니와 함께 살았습니다
  alternatives_korean:
  - 그녀는 시어머니 곁에 머물렀습니다
  - 그녀는 시어머니와 함께 지냈습니다
  - 그녀는 시어머니와 함께 있었습니다
  lexicon: HALOT
  rationale: ישב는 여기서 단순한 ‘앉다’가 아니라 거주/동거의 뜻이므로, 관계를 자연스럽게 나타내는 ‘함께 살았습니다’로 옮겼습니다.
theological_decisions:
- issue: Ruth가 보아스의 젊은 여자들 ‘곁에 붙어 있음’의 뉘앙스
  chosen_reading: 단순한 동행이 아니라 지속적이고 의도적인 밀착을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 그냥 따라다녔습니다
  - 그들과 함께 있었습니다
  rationale: דבק의 강한 결속 뉘앙스를 약화시키면 본문이 강조하는 보호된 관계와 지속성이 흐려지므로, 이를 한국어에서도 살렸습니다.
  doctrine_reference: 서사 본문의 어휘 강도 보존 원칙
- issue: 시어머니와의 동거를 ‘살았습니다’로 번역
  chosen_reading: 거주/동거의 의미를 분명히 하되, 지나친 해석 없이 서술했습니다.
  alternative_readings:
  - 머물렀습니다
  - 지냈습니다
  rationale: ישב는 문맥상 거주를 뜻하므로, 일시적 체류보다 삶의 지속성을 보여 주는 표현이 적절합니다.
  doctrine_reference: 문맥 우선 번역 원칙
