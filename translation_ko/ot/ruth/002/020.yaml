id: RUT.2.20
reference: Ruth 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר נָעֳמִ֜י לְ/כַלָּתָ֗/הּ בָּר֥וּךְ הוּא֙ לַ/יהוָ֔ה אֲשֶׁר֙ לֹא עָזַ֣ב חַסְדּ֔/וֹ אֶת הַ/חַיִּ֖ים וְ/אֶת הַ/מֵּתִ֑ים וַ/תֹּ֧אמֶר לָ֣/הּ נָעֳמִ֗י קָר֥וֹב לָ֨/נוּ֙ הָ/אִ֔ישׁ מִֽ/גֹּאֲלֵ֖/נוּ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
  footnotes:
  - marker: a
    text: Or, 'May he be blessed by the LORD, who has not forsaken his kindness toward the living and the dead,' with 'his kindness' understood as Boaz's kindness rather than the LORD's.
    reason: alternative_reading
  - marker: b
    text: Or 'one of our kinsman-redeemers.' The Hebrew refers to a near relative with a recognized duty or right to redeem a family member or property.
    reason: lexical_alternative
translation:
  language: ko
  text: 나오미가 자기 며느리[a]에게 말했습니다. “그가 야훼께 복을 받기를 바랍니다. 야훼께서는 살아 있는 자들과 죽은 자들에게 베푸신 자신의 인자하심을 거두지 않으셨습니다.” 그리고 나오미가 그녀에게 말했습니다. “그 사람은 우리와 가까운 친족입니다. 그는 우리의 기업 무를 자들 가운데 하나입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 야훼께 복을 받기를 바랍니다. 그는 살아 있는 자들과 죽은 자들에게 베푼 자신의 인자함을 거두지 않았습니다.”라고 옮길 수 있습니다. 이 독법에서는 ‘그’와 ‘자신의 인자함’이 보아스를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘우리의 친족 무를 자들 가운데 하나’로 옮길 수 있습니다. 히브리어는 가족 구성원이나 그 재산을 되찾거나 회복할 권리 또는 책임이 있는 가까운 친족을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  english_pob_choice: Blessed be he by Yahweh
  chosen_korean: 그가 야훼께 복을 받기를 바랍니다
  alternatives_korean:
  - 야훼께서 그에게 복을 주시기를 바랍니다
  - 그가 야훼로부터 복을 받기를 바랍니다
  lexicon: HALOT
  rationale: 히브리어 축복 공식은 단순한 서술보다 축원/선언에 가깝기 때문에, 한국어에서도 바람을 나타내는 형태로 옮겨 원문의 발화 기능을 살렸습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his kindness
  chosen_korean: 자신의 인자하심
  alternatives_korean:
  - 그의 친절
  - 그의 은혜로움
  - 그의 신실한 사랑
  lexicon: HALOT
  rationale: חֶסֶד는 단순 친절보다 더 넓은 언약적 호의와 자비를 포함하므로, 교회 용어에 지나치게 고정되지 않으면서도 문맥의 무게를 살려 ‘인자하심’으로 옮겼습니다.
- source_word: קָרוֹב לָנוּ
  english_pob_choice: a close relative of ours
  chosen_korean: 우리 가까운 친족입니다
  alternatives_korean:
  - 우리와 가까운 사람입니다
  - 우리와 가까운 친척입니다
  lexicon: HALOT
  rationale: קָרוֹב는 여기서 공간적 ‘가까움’보다 혈연·가족 관계의 근접성을 뜻하므로, ‘친족’으로 옮겨 관계적 의미를 분명히 했습니다.
- source_word: מִגֹּאֲלֵנוּ
  english_pob_choice: one of our redeemers
  chosen_korean: 우리의 기업 무를 자들 가운데 하나입니다
  alternatives_korean:
  - 우리의 무를 자들 가운데 하나입니다
  - 우리의 친족 구속자들 가운데 하나입니다
  lexicon: HALOT
  rationale: גֹּאֵל은 단순한 친족이 아니라 가족의 재산과 사람을 되찾는 법적 책임이 있는 ‘무를 자’이므로, 한국어 성경 전통에 익숙한 표현을 살리되 기능을 드러내는 형태로 옮겼습니다.
theological_decisions:
- issue: ‘인자하심’의 소유격이 누구를 가리키는지
  chosen_reading: 문맥상 야훼의 인자하심으로 옮기되, 원문이 허용하는 다른 해석은 보존하지 않았습니다.
  alternative_readings:
  - 보아스의 인자하심
  - 야훼의 인자하심
  rationale: 히브리어는 소유 대명사의 지시 대상이 다소 열려 있지만, 축복 공식에서 하나님께 초점을 두는 읽기가 한국어 문장에서도 가장 자연스럽고 신학적으로도 흐름이 분명합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
