base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
  footnotes:
  - marker: a
    text: Literally, “whom you did not know yesterday or the day before.”
    reason: lexical_alternative
translation:
  language: ko
  text: 보아스가 그녀에게 대답하여 말했습니다. “당신이 남편이 죽은 뒤 시어머니를 위해 한 모든 일과, 아버지와 어머니와 고향 땅을 떠나 전에 알지 못하던 한 백성에게로 간 일이 모두 내게 자세히 전해졌습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “어제나 그저께 알지 못하던”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  english_pob_choice: I have been fully told
  chosen_korean: 충분히 전해졌습니다
  alternatives_korean:
  - 자세히 전해졌습니다
  - 충분히 들었습니다
  lexicon: HALOT
  rationale: 홉할 수동과 강조를 살려, 단순한 '들었습니다'보다 정보가 충분하고 확정적으로 전달되었음을 드러내는 표현을 택했습니다.
- source_word: אֶת חֲמוֹתֵךְ
  english_pob_choice: for your mother-in-law
  chosen_korean: 시어머니를 위해
  alternatives_korean:
  - 시어머니에게
  - 시어머니를 위하여
  lexicon: HALOT
  rationale: 동사 '한 일'과 결합될 때 한국어에서는 목적격보다 '위해'가 자연스럽고, 헌신의 수혜 방향도 함께 드러냅니다.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  english_pob_choice: the land of your birth
  chosen_korean: 태어난 땅
  alternatives_korean:
  - 탄생의 땅
  - 출생의 땅
  - 고향 땅
  lexicon: HALOT
  rationale: 문맥상 출생지/고향을 가리키므로 직역성을 유지하면서도 현대 한국어에서 이해하기 쉬운 '태어난 땅'을 택했습니다.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  english_pob_choice: before
  chosen_korean: 전에 알지 못하던
  alternatives_korean:
  - 어제나 그저께 알지 못하던
  - 예전에 알지 못하던
  lexicon: HALOT
  rationale: 히브리어 관용구의 최근 과거 뉘앙스를, 한국어에서는 자연스러운 '전에'로 풀어 주되, 미지의 상태를 유지하도록 '알지 못하던'과 결합했습니다.
theological_decisions:
- issue: 보아스의 보고 표현의 수동성
  chosen_reading: '''충분히 전해졌습니다''로 번역해 보아스가 직접 들은 정보를 강조하되, 보고의 수동적 전달 구조를 유지했습니다.'
  alternative_readings:
  - '''내게 확실히 보고되었습니다'''
  - '''내게 분명히 전해 들었습니다'''
  rationale: 본문은 보아스의 개인적 지식보다, 룻의 행동이 공동체적으로 널리 알려졌음을 드러냅니다. 한국어에서도 이 공개적 증언의 뉘앙스를 살리는 것이 중요합니다.
  doctrine_reference: 서사 맥락에서의 평판/증언의 공적 성격
