source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Now Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
  footnotes:
  - marker: a
    text: Or 'a mighty man of valor,' 'a prominent man,' or 'a wealthy man'; the Hebrew expression combines ideas of strength, capability, status, and substance.
    reason: lexical_alternative
  - marker: b
    text: Or 'family of Elimelech'; the Hebrew can refer to a wider kin-group or clan.
    reason: lexical_alternative
translation:
  language: ko
  text: 나오미에게는 남편 쪽 친족 한 사람이 있었는데, 그는 엘리멜렉의 집안[b] 출신의 유력한 사람[a]이었으며, 이름은 보아스였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 용사’, ‘능력 있고 유력한 사람’, ‘재력 있는 사람’으로도 옮길 수 있습니다. 히브리어 표현은 힘, 능력, 지위, 재력의 의미를 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘엘리멜렉의 가족’입니다. 히브리어는 더 넓은 친족 집단이나 씨족을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  english_pob_choice: relative
  chosen_korean: 친족
  alternatives_korean:
  - 친척
  - 가족
  - 친족 관계의 사람
  lexicon: HALOT
  rationale: Naomi의 남편과 연결된 사람이라는 뜻을 자연스럽게 살리면서, 이어지는 ‘엘리멜렉의 집안’과도 잘 맞는 보다 넓은 친족 관계 표현을 택했습니다.
- source_word: לְאִישָׁהּ
  english_pob_choice: of her husband
  chosen_korean: 남편 쪽
  alternatives_korean:
  - 그녀의 남편의
  - 남편의
  - 남편 편의
  lexicon: HALOT
  rationale: 직역적 소유보다 관계 방향을 드러내는 표현이 한국어에서 더 자연스럽고, 나오미 자신이 아니라 남편과 연결된 친족임을 분명히 합니다.
- source_word: אִישׁ גִּבּוֹר חַיִל
  english_pob_choice: a man of great worth
  chosen_korean: 큰 어진 사람
  alternatives_korean:
  - 큰 용사의 사람
  - 큰 능력의 사람
  - 유력한 사람
  lexicon: HALOT
  rationale: 이 표현은 전투적 ‘용사’만이 아니라 능력, 지위, 재력까지 아우르는 넓은 칭찬이므로, ‘어진’으로 도덕적·인격적 우수성을 살리고 ‘큰’으로 그 포괄적 탁월함을 담았습니다.
- source_word: מִמִּשְׁפַּחַת
  english_pob_choice: from the clan of
  chosen_korean: 엘리멜렉의 집안
  alternatives_korean:
  - 엘리멜렉의 가족
  - 엘리멜렉의 씨족
  - 엘리멜렉의 친족 집안
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 단순한 직계가족보다 넓은 친족 집단을 가리킬 수 있으므로, 한국어에서는 ‘집안’이 가장 자연스럽게 그 범위를 전달합니다.
theological_decisions:
- issue: חַיִל의 성격을 어떻게 드러낼 것인가
  chosen_reading: 군사적 ‘용사’로 좁히지 않고, 인격·지위·능력을 함께 담는 넓은 칭찬으로 옮겼습니다.
  alternative_readings:
  - 용사
  - 유력한 사람
  - 재력 있는 사람
  rationale: 룻기의 문맥은 전쟁이 아니라 인물 소개이므로, 원문의 포괄적 평가를 한쪽 의미로 과도하게 제한하지 않도록 했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
- issue: מידע를 법적 ‘기업 무를 자’로 미리 특정할지 여부
  chosen_reading: 여기서는 단순한 친족으로 두고, 후속 서술에서만 법적 역할을 드러낼 수 있게 했습니다.
  alternative_readings:
  - 기업 무를 자
  - 구속자 친족
  - 가까운 친족
  rationale: 본문 자체는 아직 법적 기능을 밝히지 않으며, EN POB도 ‘relative’로 처리해 후속 전개를 위해 의미를 열어 두었습니다.
  doctrine_reference: 서사적 점진 계시와 문맥 보존
