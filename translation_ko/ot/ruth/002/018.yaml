  verdict: revise
  source_fidelity: 히브리어의 여성 단수 동사들은 룻을, ‘그의 시어머니’와 여격 대명사는 나오미를 가리킵니다. 초안의 ‘그/그의’는 표준 한국어에서 남성으로 읽히므로 원문의 여성 지시와 인물 관계를 잘못 전달합니다. 또한 לקט의 농경 전문어는 ‘이삭을 주운 것’으로 밝혀 주는 편이 충실합니다.
  naturalness: 현대 한국어 합쇼체에서 반복되는 대명사보다 ‘룻’과 ‘시어머니’를 밝혀 쓰는 것이 자연스럽고 오해가 없습니다. ‘들고’, ‘성읍’, ‘배가 부른 뒤에’는 간결하면서도 서사 문체에 맞습니다.
  terminology: ‘이삭을 줍다’는 룻기에서 לקט의 핵심 의미를 보존합니다. הוֹתִירָה מִשָּׂבְעָהּ는 먹고 배부른 뒤 남긴 음식이라는 문맥을 반영하되, 본문의 표현을 과도하게 해석하지 않도록 ‘배가 부른 뒤에 남겨 둔 것’으로 옮기고 대안을 각주로 제시합니다.
