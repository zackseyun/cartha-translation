  text: וַ/תִּשָּׂא֙ וַ/תָּב֣וֹא הָ/עִ֔יר וַ/תֵּ֥רֶא חֲמוֹתָ֖/הּ אֵ֣ת אֲשֶׁר לִקֵּ֑טָה וַ/תּוֹצֵא֙ וַ/תִּתֶּן לָ֔/הּ אֵ֥ת אֲשֶׁר הוֹתִ֖רָה מִ/שָּׂבְעָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
  footnotes:
  - marker: a
    text: Or 'after she had eaten her fill.'
    reason: lexical_alternative
translation:
  language: ko
  text: 룻이 그것을 들고 성읍으로 들어가니, 시어머니가 룻이 이삭을 주운 것을 보았습니다. 룻은 배가 부른 뒤에 남겨 둔 것을[a] 꺼내어 시어머니에게 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배불리 먹은 뒤에 남겨 둔 것’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  english_pob_choice: She picked it up
  chosen_korean: 그것을 주워 가지고
  alternatives_korean:
  - 그것을 들어 가지고
  - 그것을 들고
  lexicon: HALOT
  rationale: נשא의 기본 의미는 ‘들다/메다’이지만, 여기서는 이삭을 집어 들고 옮겨 가는 동작이므로 현대 한국어에서는 ‘주워 가지고’가 자연스럽고 장면도 분명하게 전달합니다.
- source_word: הָעִיר
  english_pob_choice: the city
  chosen_korean: 성읍으로
  alternatives_korean:
  - 도성으로
  - 도시로
  lexicon: HALOT
  rationale: רִע/עִיר는 기본적으로 ‘도시’이지만 룻기의 배경에서는 작은 정착지라도 성읍으로 옮기는 것이 한국어 서사에 더 자연스럽고, ‘성읍’이 고대 공동체 맥락을 보존합니다.
- source_word: לִקֵּטָה
  english_pob_choice: what she had gleaned
  chosen_korean: 그가 주운 것
  alternatives_korean:
  - 그가 이삭을 주운 것
  - 그가 거둔 것
  lexicon: HALOT
  rationale: לקט는 룻기에서 전문적으로 ‘이삭을 줍다’라는 의미이므로, 동사형으로 풀어 ‘주운 것’이라 옮기되 의미를 잃지 않도록 했습니다.
- source_word: הוֹתִרָה מִשָּׂבְעָהּ
  english_pob_choice: what she had left over after she was satisfied
  chosen_korean: 자신이 배부른 뒤에 남겨 둔 것
  alternatives_korean:
  - 자신이 만족한 뒤에 남긴 것
  - 배를 채운 뒤에 남은 것
  lexicon: HALOT
  rationale: שׂבע는 단순한 ‘만족’보다 ‘배부름/충분히 먹음’의 상태를 가리키므로, 먹은 뒤 남긴 음식이라는 문맥을 살려 ‘배부른 뒤에 남겨 둔 것’으로 옮겼습니다.
theological_decisions:
- issue: 시어머니를 가리키는 대명사 처리
  chosen_reading: 본문의 히브리어는 ‘그의 시어머니’와 ‘그녀’가 이어지므로, 한국어에서는 반복을 줄이되 인물 관계가 흐려지지 않게 옮겼습니다.
  alternative_readings:
  - 그의 시어머니가 그가 주운 것을 보았습니다. 그러자 그녀는…
  - 시어머니가 그것을 보고…
  rationale: 이 절은 서사적 순서를 전달하는 것이 핵심이므로, 인칭을 과도하게 반복하지 않으면서도 루트와 나오미의 관계가 분명히 드러나도록 했습니다.
  doctrine_reference: source-clarity
