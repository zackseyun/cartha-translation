  to: 룻이 그것을 들고 성읍으로 들어가니, 시어머니가 룻이 이삭을 주운 것을 보았습니다. 룻은 배가 부른 뒤에 남겨 둔 것을[a] 꺼내어 시어머니에게 주었습니다.
