  - severity: low
    issue: ‘보상이 ... 온전히 차기를’의 어색한 결합
    rationale: שְׁלֵמָה의 ‘완전함/충만함’은 보상에 적용될 수 있으나, ‘보상이 차다’는 현대 한국어에서 자연스럽지 않습니다. ‘보상을 온전하게 해 주시다’가 의미와 문체를 더 잘 전달합니다.
  - severity: low
    issue: 각주의 어휘 연결 누락
