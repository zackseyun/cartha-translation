- from: 야훼께서 당신의 행위를 갚아 주시고, 당신의 보상이 야훼, 이스라엘의 하나님께로부터 온전히 차기를 바랍니다. 당신이 그분의 날개 아래로 와서 피난하였기 때문입니다.[a]
