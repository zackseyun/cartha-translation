  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
  footnotes:
  - marker: a
    text: Or 'may your wages be complete.' The Hebrew term can denote wages or reward, and 'full/complete' echoes the same root as 'repay.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신의 행위를 갚아 주시고, 당신의 보상이 야훼, 이스라엘의 하나님께로부터 온전히 차기를 바랍니다. 당신이 그분의 날개 아래로 와서 피난하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보상’은 본문 맥락에서의 뜻을 따른 것이며, ‘임금/삯’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문의 언약적 고유명사를 살려, 관용적 대체호칭인 ‘주’ 대신 음역형 ‘야훼’로 옮겼습니다.
- source_word: יְשַׁלֵּם
  english_pob_choice: may ... repay
  chosen_korean: 갚아 주시고
  alternatives_korean:
  - 보상해 주시고
  - 되갚아 주시고
  lexicon: HALOT
  rationale: 축복/소원의 뉘앙스를 살리면서, 보응·갚음의 의미를 한국어로 자연스럽게 드러내기 위해 ‘갚아 주시고’를 선택했습니다.
- source_word: מַשְׂכֻּרְתֵּךְ
  english_pob_choice: your reward
  chosen_korean: 보상
  alternatives_korean:
  - 삯
  - 임금
  - 상급
  lexicon: HALOT
  rationale: 문맥상 단순 임금보다 야훼로부터 오는 보응이 강조되므로, ‘보상’이 의미 범위를 가장 넓고 정확하게 반영합니다.
- source_word: תַּחַת כְּנָפָיו
  english_pob_choice: under whose wings
  chosen_korean: 그분의 날개 아래로
  alternatives_korean:
  - 그분의 날개 아래에
  - 그분의 날개 그늘 아래로
  lexicon: HALOT
  rationale: 보호의 은유를 보존하기 위해 ‘날개’ 이미지를 유지했고, 이동과 피난의 동사를 살리기 위해 ‘아래로’와 ‘피난하다’를 연결했습니다.
theological_decisions:
- issue: מֵעִם יְהוָה אֱלֹהֵי יִשְׂרָאֵל의 신학적 초점
  chosen_reading: 보상이 야훼, 이스라엘의 하나님께로부터 온전히 차기 바랍니다
  alternative_readings:
  - 야훼께서 당신에게 온전한 상을 주시기 바랍니다
  - 야훼로부터 완전한 보상이 있기를 바랍니다
  rationale: ‘from Yahweh’와 ‘be full/complete’의 이중 의미를 함께 살리기 위해, 보상의 충만함이 하나님께서 공급하시는 것임을 분명히 했습니다.
  doctrine_reference: Ruth 2:12 blessing formula; lexical linkage between שׁלם and שׂכר
