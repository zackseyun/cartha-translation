id: RUT.2.16
reference: Ruth 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֛ם שֹׁל תָּשֹׁ֥לּוּ לָ֖/הּ מִן הַ/צְּבָתִ֑ים וַ/עֲזַבְתֶּ֥ם וְ/לִקְּטָ֖ה וְ/לֹ֥א תִגְעֲרוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
  footnotes:
  - marker: a
    text: Or 'from the sheaves.' The Hebrew term refers to gathered bunches of stalks.
    reason: lexical_alternative
  - marker: b
    text: Or 'let her glean.' The Hebrew verb is the standard term for gleaning in a harvested field.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 또한 너희는 그녀를 위하여 낟단들에서 일부를 일부러 뽑아 놓고, 그것을 남겨 두어 그녀가 거두게 하십시오. 그녀를 꾸짖지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낟단들에서’. 히브리어는 이미 거둔 곡식 다발을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이삭줍게 하십시오’. 히브리어 동사는 추수 밭에서 이삭을 줍는 표준 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  english_pob_choice: And also
  chosen_korean: 그리고 또한
  alternatives_korean:
  - 또한
  - 그리고
  lexicon: HALOT
  rationale: 단순한 첨가가 아니라 앞 명령에 덧붙는 강조를 살려 ‘그리고 또한’으로 옮겼습니다.
- source_word: שֹׁל תָּשֹׁלּוּ
  english_pob_choice: you must surely pull out
  chosen_korean: 일부러 뽑아 놓고
  alternatives_korean:
  - 반드시 뽑아 놓고
  - 확실히 끌어내어
  lexicon: HALOT
  rationale: 어근의 강한 강조와 의도성을 살리되, 한국어에서 자연스럽게 보이도록 ‘일부러’와 ‘뽑아 놓고’로 표현했습니다.
- source_word: מִן הַ/צְּבָתִים
  english_pob_choice: from the bundles
  chosen_korean: 낟단들에서
  alternatives_korean:
  - 이삭단들에서
  - 묶음들에서
  lexicon: HALOT
  rationale: צְּבָתִים은 이미 모아 놓은 곡식 다발을 가리키므로, 현대 한국어에서 의미가 분명한 ‘낟단들’로 옮겼습니다.
- source_word: וְלִקְּטָה
  english_pob_choice: so that she may gather it
  chosen_korean: 그녀가 거두게 하십시오
  alternatives_korean:
  - 그녀가 이삭을 줍게 하십시오
  - 그녀가 주워 모으게 하십시오
  lexicon: HALOT
  rationale: לקט는 이삭줍기의 기술적 용법이지만, 앞뒤 문맥이 이미 추수 현장을 분명히 하므로 ‘거두다’로 자연스럽게 살렸습니다.
