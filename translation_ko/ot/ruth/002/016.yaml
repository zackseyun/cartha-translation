  to: 또한 너희는 그녀를 위하여 곡식단에서 얼마를 일부러 뽑아 내어 남겨 두고, 그녀가 이삭을 줍게 하십시오.[a][b] 그녀를 꾸짖지 마십시오.
  rationale: 첨가의 의미는 자연스러운 ‘또한’으로 보존했습니다. 강조된 명령의 의도성은 ‘일부러 뽑아 내어’로 유지했고, 곡식 다발을 뜻하는 명사는 현대적으로 ‘곡식단’으로 다듬었습니다. לקט의 추수 전문 용어적 의미를 본문에서 ‘이삭을 줍다’로 명시했으며, 각주 표지는 해당 어휘 뒤에 배치했습니다.
