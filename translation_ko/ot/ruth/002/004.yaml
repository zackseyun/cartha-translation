  - “야훼가 너희와 함께 있기를.”
  rationale: 히브리어의 축복적 인사말을 단순 서술이 아니라 소망·축복의 말로 드러내기 위해 한국어에서도 기원형으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
