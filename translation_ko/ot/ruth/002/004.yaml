  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH with you''—a greeting/blessing idiom, rendered ''The LORD be with you.'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'The LORD bless you.' The Hebrew form expresses a wish or blessing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 마침 보아스가 베들레헴에서 와서, 추수꾼들에게 말했습니다. “야훼께서 너희와 함께하시기를.” 그들이 그에게 말했습니다. “야훼께서 당신에게 복을 주시기를.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼가 너희와 함께’라는 인사/축복 관용구입니다. 여기서는 자연스러운 축복 표현으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사형은 단순한 진술보다 소망이나 축복을 나타냅니다.
    reason: lexical_alternative
