theological_decisions:
- issue: יְהוָה를 포함한 인사/축복 관용구의 처리
  chosen_reading: “야훼께서 너희와 함께하시기를.”과 “야훼께서 당신에게 복을 주시기를.”로 번역했습니다.
  alternative_readings:
  - “주께서 너희와 함께 계시기를.”
  - “야훼가 너희와 함께 있기를.”
  rationale: 히브리어의 축복적 인사말을 단순 서술이 아니라 소망·축복의 말로 드러내기 위해 한국어에서도 기원형으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
