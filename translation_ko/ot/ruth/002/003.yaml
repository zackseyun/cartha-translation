revisions:
- from: 그래서 그녀는 가서 들에 이르러, 추수꾼들 뒤를 따라 이삭을 주웠습니다. 그런데 그녀가 우연히 가게 된 그 밭의 한 몫은, 엘리멜렉의 집안에 속한 보아스의 것이었습니다.[a]
  to: 그리하여 그녀는 가서 들에 이르러 추수꾼들 뒤에서 이삭을 주웠습니다. 그러다가 우연히도[a] 보아스에게 속한 그 밭의 한 구역에 이르게 되었습니다. 그는 엘리멜렉의 집안에 속한 사람이었습니다.
  rationale: 문장을 히브리어의 순차적 서술에 맞추어 ‘가서—이르러—이삭을 줍고—우연히 밭의 한 구역에 이르다’로 정리했습니다. 우연의 관용구는 본문에서 ‘우연히도’로 보존하고, 섭리에 관한 더 넓은 서사적 관찰은 각주에만 두었습니다. 보아스가 엘리멜렉의 집안에 속한다는 관계도 독립 문장으로 명확히 했습니다.
