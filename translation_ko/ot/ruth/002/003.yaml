  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
  footnotes:
  - marker: a
    text: 'Hebrew: ''and her chance happened''—an idiom expressing apparent chance from a human perspective; the book''s wider narrative also invites the reader to see providence at work.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그녀는 가서 들에 이르러 추수꾼들 뒤에서 이삭을 주웠습니다. 그러다가 우연히도[a] 보아스에게 속한 그 밭의 한 구역에 이르게 되었습니다. 그는 엘리멜렉의 집안에 속한 사람이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘그녀의 우연이 일어났다’라는 관용구입니다. 인간의 관점에서는 우연처럼 보이는 일을 가리킵니다. 룻기의 더 넓은 이야기는 독자가 그 뒤에서 섭리가 일하고 있음을 보도록 이끕니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  english_pob_choice: she went and came
  chosen_korean: 그녀는 가서 … 이르러
  alternatives_korean:
  - 그녀는 가고 와서
  - 그녀는 가서 도착했고
  lexicon: HALOT
  rationale: 연속된 wayyiqtol의 서술 흐름을 살리되, 한국어에서는 ‘가고 와서’보다 ‘가서 … 이르러’가 더 자연스럽고 서사적입니다.
- source_word: וַתְּלַקֵּט
  english_pob_choice: and gleaned
  chosen_korean: 이삭을 주웠습니다
  alternatives_korean:
  - 이삭을 주웠습니다
  - 주워 모았습니다
  lexicon: HALOT
  rationale: 이 문맥의 לקט는 추수 후 남은 곡식을 줍는 ‘이삭 줍기’이므로, 한국어 관용 표현을 쓰되 행위의 의미를 분명히 했습니다.
- source_word: אַחֲרֵי הַקֹּצְרִים
  english_pob_choice: behind the reapers
  chosen_korean: 추수꾼들 뒤를 따라
  alternatives_korean:
  - 추수꾼들 뒤에서
  - 수확하는 사람들 뒤를 따라
  lexicon: HALOT
  rationale: אַחֲרֵי는 여기서 시간적 ‘뒤에’가 아니라 공간적 위치를 가리키므로, ‘뒤를 따라’가 자연스럽게 그 관계를 나타냅니다.
- source_word: וַיִּקֶר מִקְרֶהָ
  english_pob_choice: she happened to come
  chosen_korean: 우연히 가게 된
  alternatives_korean:
  - 마침 그곳에 가게 된
  - 뜻밖에 이르게 된
  lexicon: HALOT
  rationale: 히브리어 관용구가 인간 눈에는 우연처럼 보이는 사건을 나타내므로, ‘우연히 가게 된’으로 옮겨 서사의 우연성 표면을 보존했습니다.
- source_word: חֶלְקַת הַשָּׂדֶה לְבֹעַז
  english_pob_choice: the portion of the field belonging to Boaz
  chosen_korean: 그 밭의 한 몫은 … 보아스의 것이었습니다
  alternatives_korean:
  - 그 밭의 몫은 … 보아스의 것이었습니다
  - 그 밭의 일부는 … 보아스에게 속해 있었습니다
  lexicon: HALOT
  rationale: חלקה는 ‘구획/몫/부분’의 뜻이 있어, 너무 기술적인 ‘구획’보다 본문 흐름에 맞는 ‘한 몫’으로 표현하고, לְ 표지를 소유 관계로 자연스럽게 풀었습니다.
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  english_pob_choice: who was from the family of Elimelech
  chosen_korean: 엘리멜렉의 집안에 속한
  alternatives_korean:
  - 엘리멜렉의 가족에 속한
  - 엘리멜렉의 씨족에 속한
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 문맥상 단순 가족보다 더 넓은 친족 집단일 수 있으나, 한국어 성경 문맥에서는 ‘집안’이 그 범위를 비교적 자연스럽게 살립니다.
theological_decisions:
- issue: 우연처럼 보이는 사건과 섭리의 긴장
  chosen_reading: 본문은 ‘우연히 가게 된’이라고 옮겨, 인간 관점의 우연성을 그대로 드러냈습니다.
  alternative_readings:
  - 섭리를 드러내기 위해 ‘하나님께서 인도하신’으로 해석적으로 옮기기
  - 더 직역하여 ‘그녀의 우연이 우연히 일어났다’로 옮기기
  rationale: 룻기의 더 넓은 서사는 섭리를 암시하지만, 이 절 자체는 사건을 우연의 언어로 말하므로 그 긴장을 해소하지 않고 남겨 두는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
