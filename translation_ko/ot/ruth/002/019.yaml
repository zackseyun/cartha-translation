base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
  footnotes:
  - marker: a
    text: Hebrew more literally, 'what she had done with him' and 'the man with whom I had done [work] today.' Here 'worked' brings out the contextual sense of field labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 시어머니가 그에게 말했습니다[a], “오늘 어디에서 이삭을 주웠습니까? 또 어디에서 일하셨습니까? 당신에게 호의를 베푼 이가 복을 받기를 바랍니다.” 그러자 그가 시어머니에게 자신이 누구와 함께 일했는지를 알려 주었고, 말했습니다. “제가 오늘 그와 함께 일한 남자의 이름은 보아스입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그가 그녀와 함께 한 일’과 ‘내가 오늘 그와 함께 한 남자’에 가깝습니다. 여기서는 들판에서의 노동이라는 문맥을 살려 ‘일하다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  english_pob_choice: her mother-in-law
  chosen_korean: 시어머니
  alternatives_korean:
  - 남편의 어머니
  - 며느리의 시어머니
  lexicon: HALOT
  rationale: 가장 자연스러운 현대 한국어 친족어이며, 본문 상황에서도 오해 없이 관계를 전달합니다.
- source_word: לִקַּטְתְּ
  english_pob_choice: did you glean
  chosen_korean: 이삭을 주웠습니까
  alternatives_korean:
  - 이삭을 주웠습니까
  - 이삭을 거두었습니까
  lexicon: HALOT
  rationale: 루트기의 농업·율법적 맥락에서 ‘glean’의 구체성을 살리기 위해 ‘이삭을 줍다’로 옮겼습니다.
- source_word: עָשִׂית
  english_pob_choice: have you worked
  chosen_korean: 일하셨습니까
  alternatives_korean:
  - 일하셨습니까
  - 무엇을 하셨습니까
  lexicon: HALOT
  rationale: 뒤이어 나오는 일꾼/동행 보고 맥락상 단순한 ‘하다’보다 노동 행위를 드러내는 ‘일하다’가 적절합니다.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  english_pob_choice: Blessed be the one who took notice of you
  chosen_korean: 당신에게 호의를 베푼 이가 복을 받기를 바랍니다
  alternatives_korean:
  - 당신을 알아본 이가 복을 받기를 바랍니다
  - 당신을 눈여겨본 이가 복을 받기를 바랍니다
  lexicon: HALOT
  rationale: מכיר는 문자적으로 ‘알아보다/주목하다’이지만, 문맥상 룻에게 호의적으로 관심을 둔 사람을 축복하는 말이므로 그 뉘앙스를 살렸습니다.
- source_word: וַ/תַּגֵּד ... וַ/תֹּ֗אמֶר
  english_pob_choice: So she told ... and she said
  chosen_korean: 그러자 그가 시어머니에게 자신이 누구와 함께 일했는지를 알려 주었고, 말했습니다
  alternatives_korean:
  - 그래서 그가 시어머니에게 ... 말했습니다
  - 그는 시어머니에게 ... 이야기했고 말했습니다
  lexicon: HALOT
  rationale: 서술 동사의 흐름을 한국어로 자연스럽게 연결하되, 원문의 연속된 보고 구조를 유지했습니다.
- source_word: שֵׁם הָ/אִישׁ ... בֹּעַז
  english_pob_choice: The name of the man ... is Boaz
  chosen_korean: 제가 오늘 그와 함께 일한 남자의 이름은 보아스입니다
  alternatives_korean:
  - 오늘 그와 함께 일한 남자의 이름은 보아스입니다
  - 그 남자의 이름은 오늘 함께 일한 보아스입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘그와 함께 일한 남자’를 자연스러운 한국어로 재배열하면서도, 인물 식별 정보를 분명히 전달했습니다.
theological_decisions:
- issue: 룻의 보고를 전하는 방식에서 원문의 직접성 유지
  chosen_reading: 시어머니의 질문과 룻의 답변을 모두 직접화법으로 살려, 장면의 즉시성과 인물 간 관계를 드러냈습니다.
  alternative_readings:
  - 간접화법으로 더 압축해 옮김
  - 보다 문학적으로 재서술함
  rationale: 이 절은 대화가 핵심이므로, 직접화법을 유지하는 것이 원문이 청자에게 주는 생생한 효과를 가장 잘 보존합니다.
  doctrine_reference: Narrative fidelity / discourse representation
