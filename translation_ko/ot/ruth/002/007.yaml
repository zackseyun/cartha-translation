id: RUT.2.7
reference: Ruth 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר אֲלַקֳטָה נָּא֙ וְ/אָסַפְתִּ֣י בָֽ/עֳמָרִ֔ים אַחֲרֵ֖י הַ/קּוֹצְרִ֑ים וַ/תָּב֣וֹא וַֽ/תַּעֲמ֗וֹד מֵ/אָ֤ז הַ/בֹּ֨קֶר֙ וְ/עַד עַ֔תָּה זֶ֛ה שִׁבְתָּ֥/הּ הַ/בַּ֖יִת מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
  footnotes:
  - marker: a
    text: Or, “She has rested in the shelter only a little.” The Hebrew of the final clause is difficult; 'house' may refer to a worker’s shelter.
    reason: alternative_reading
translation:
  language: ko
  text: 그녀가 말했습니다. 「부디 제가 추수꾼들 뒤에서 곡식단들 사이의 이삭을 주워 모으게 해 주십시오.」 그래서 그녀가 와서 아침부터 지금까지 계속 있었습니다. 집에서[a] 잠시 쉰 것 말고는 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀가 쉼터에서 잠시만 쉬었습니다.” 마지막 절의 히브리어는 난해합니다. ‘집’은 일꾼들이 쉬는 들판의 쉼터를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  english_pob_choice: Please let me glean
  chosen_korean: 부디 제가 이삭을 주워 모아
  alternatives_korean:
  - 부디 제가 이삭을 줍게 해 주십시오
  - 제발 제가 이삭을 줍고 모으게 해 주십시오
  lexicon: HALOT
  rationale: לקט의 추수 뒤 이삭 줍기를 한국어 농경 표현인 ‘이삭을 주워 모으다’로 살렸고, נָּא는 정중한 간청의 뉘앙스를 ‘부디’로 옮겼습니다.
- source_word: וְאָסַפְתִּי בָעֳמָרִים
  english_pob_choice: and gather among the sheaves
  chosen_korean: 이삭을 주워 모아
  alternatives_korean:
  - 사이사이에서 모아
  - 곡식단들 가운데서 거두어
  lexicon: HALOT
  rationale: אָסַף은 단순한 반복보다 ‘모으다/거두다’의 뜻이어서, 앞 동사와 구분되면서도 자연스럽게 ‘주워 모아’로 렌더링했습니다.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  english_pob_choice: after the reapers
  chosen_korean: 추수꾼들 뒤를 따라가게 해 주십시오
  alternatives_korean:
  - 추수꾼들 뒤에서
  - 거두는 사람들 뒤를 따라가게 해 주십시오
  lexicon: HALOT
  rationale: 공간적·행동적 관계를 함께 담기 위해 단순 위치 표현보다 ‘뒤를 따라가게’로 옮겨, 이삭 줍기의 장면을 분명히 했습니다.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  english_pob_choice: she has sat in the house only a little
  chosen_korean: 집에서 잠시만 쉬었을 뿐입니다
  alternatives_korean:
  - 집에서 잠깐만 앉아 있었을 뿐입니다
  - 집에서 쉬는 시간이 아주 적었습니다
  lexicon: HALOT
  rationale: 마지막 절은 의미가 난해하므로, ‘집/피난처’의 가능성을 열어 두되 문맥상 실제로는 잠깐 쉬었음을 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 ‘house’와 짧은 체류의 의미
  chosen_reading: ‘집에서 잠시만 쉬었을 뿐입니다’로 옮기되, ‘집’이 들판의 쉼터를 가리킬 가능성을 열어 둡니다.
  alternative_readings:
  - ‘피난처에서 잠시 쉬었을 뿐입니다’
  - ‘집에 잠깐 앉아 있었을 뿐입니다’
  rationale: 히브리어는 압축적이고 난해하므로, 본문이 분명히 말하는 최소한의 정보—아침부터 지금까지 머물렀지만 쉼은 아주 짧았다는 점—를 보존하는 것이 적절합니다.
  doctrine_reference: 본문 난해구 처리 원칙
- issue: 문장 화자 표지의 평서형
  chosen_reading: 보아스의 종/일꾼이 보고하는 장면으로 보고, 서술과 직접인용의 구분만 유지했습니다.
  alternative_readings:
  - 직접화법의 감탄/강조를 더 살리는 번역
  rationale: 서술 자체에는 신학적 쟁점이 없으므로, 장면의 흐름과 리듬을 해치지 않는 범위에서 직설적으로 번역했습니다.
  doctrine_reference: 서사 본문 번역 원칙
