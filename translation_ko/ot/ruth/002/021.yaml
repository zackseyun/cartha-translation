revisions:
- from: 그러자 모압 여인 룻이 말했습니다. “그가 나에게도 ‘내 젊은이들 곁을, 그들이 내 추수를 다 마칠 때까지 떠나지 말고 붙어 있으라’고 했습니다.”[a]
  to: 그러자 모압 여인 룻이 말했습니다. “그가 또 내게 말했습니다. ‘너는 내 젊은 남자들 곁에 붙어 있어야 합니다. 그들이 내 추수 일을 모두 마칠 때까지 말입니다.’”
  rationale: 마소라 본문의 남성 복수형 נְעָרִים을 ‘젊은 남자들’로 보존하고, 이를 여성형으로 돌리는 부정확한 각주를 삭제했습니다. 명령적 지시는 현대 합쇼체 안에서 ‘붙어 있어야 합니다’로 자연스럽게 표현했으며, 추수의 완료는 ‘추수 일’을 마치는 것으로 명료하게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:16:07Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 본문은 עִם הַנְּעָרִים에서 남성 복수 명사 ‘젊은 남자들’을 사용합니다. 문맥상 2:8 및 2:22의 ‘젊은 여자들’과 긴장이 있으나, 이 절의 마소라 본문을 문맥에 맞추어 여성으로 바꾸거나 성별을 중화해서는 안 됩니다. 또한 ‘내 추수’를 마친다는 표현보다 ‘내 추수 일’을 마친다고 하면 완료의 대상이 자연스럽고 원문의 뜻을 보존합니다.
  naturalness: ‘곁을 ... 붙어 있으라’보다 ‘곁에 붙어 있어야 한다’가 현대 표준 한국어에서 자연스럽습니다. 서술과 인용문을 합쇼체에 맞추어 ‘말했습니다’와 ‘있어야 합니다’로 처리했습니다.
  terminology: ‘모압 여인 룻’은 출신과 여성형 호칭을 자연스럽게 전달합니다. נְעָרִים은 이 절에서 ‘젊은 남자들’로 명시하여 원문의 남성형을 보존했습니다.
  issues:
  - severity: medium
    issue: 본문의 ‘내 젊은이들’이 히브리어 남성 복수형을 중화합니다.
    rationale: נְעָרִים은 남성 복수형입니다. 가까운 문맥의 여성형 표현과 조화시키기 위해 본문 성별을 흐리게 해서는 안 됩니다.
  - severity: high
    issue: 각주가 ‘전치사와 명사 성별을 어떻게 처리하느냐’에 따라 ‘젊은 여자들’이라는 대안이 가능한 것처럼 설명합니다.
    rationale: 전치사 עִם은 성별 선택의 근거가 아니며, 이 절의 명사는 명시적으로 남성 복수형입니다. 문맥적 긴장은 번역 본문의 성별 변경을 정당화하지 않으므로 이 각주는 삭제하는 것이 안전합니다.
  - severity: low
    issue: ‘그들이 내 추수를 다 마칠 때까지’는 추수 작업의 완료 대상을 다소 부자연스럽게 표현합니다.
    rationale: קָצִיר는 여기서 추수철의 작업을 가리킬 수 있으므로 ‘내 추수 일을 모두 마칠 때까지’가 자연스럽고 의미를 유지합니다.
  revised_text: 그러자 모압 여인 룻이 말했습니다. “그가 또 내게 말했습니다. ‘너는 내 젊은 남자들 곁에 붙어 있어야 합니다. 그들이 내 추수 일을 모두 마칠 때까지 말입니다.’”
  revised_footnotes: []
