  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר ר֣וּת הַ/מּוֹאֲבִיָּ֑ה גַּ֣ם כִּי אָמַ֣ר אֵלַ֗/י עִם הַ/נְּעָרִ֤ים אֲשֶׁר לִ/י֙ תִּדְבָּקִ֔י/ן עַ֣ד אִם כִּלּ֔וּ אֵ֥ת כָּל הַ/קָּצִ֖יר אֲשֶׁר לִֽ/י׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
  footnotes:
  - marker: a
    text: Or, “stay close with my young men.” The Hebrew preposition may be rendered either way in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모압 여인 룻이 말했습니다. “그가 나에게도 ‘내 젊은이들 곁을, 그들이 내 추수를 다 마칠 때까지 떠나지 말고 붙어 있으라’고 했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 젊은 여자들 곁을.” 히브리어 전치사와 명사 성별을 어떻게 처리하느냐에 따라 달라질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּת הַמּוֹאֲבִיָּה
  english_pob_choice: Ruth the Moabite
  chosen_korean: 모압 여인 룻
  alternatives_korean:
  - 모압 사람 룻
  - 모압 여자 룻
  lexicon: HALOT
  rationale: 지명 형용사 הַמּוֹאֲבִיָּה는 한국어에서 자연스러운 신분 표지로 옮기되, 본문이 강조하는 출신을 살려 ‘모압 여인’으로 번역했습니다.
- source_word: עִם הַנְּעָרִים
  english_pob_choice: by my young men
  chosen_korean: 내 젊은이들 곁을
  alternatives_korean:
  - 내 젊은 남자들 곁을
  - 내 종들 곁을
  - 내 젊은 여자들 곁을
  lexicon: HALOT
  rationale: 히브리어 נְעָרִים의 남성형을 반영해 ‘젊은이들’로 옮겼고, 보아스의 지시를 자연스럽게 살리기 위해 관계 표지를 ‘곁을’로 처리했습니다.
- source_word: תִּדְבָּקִין
  english_pob_choice: You are to stay close
  chosen_korean: 떠나지 말고 붙어 있으라
  alternatives_korean:
  - 가까이 머물러 있으라
  - 꼭 붙어 있으라
  - 계속 따라붙어 있으라
  lexicon: HALOT
  rationale: דבק의 핵심은 ‘붙다/밀착하다’이므로 단순한 동거가 아니라 밀착적 동행을 드러내는 표현을 택했습니다.
- source_word: כִּלּוּ אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  english_pob_choice: until they have finished all my harvest
  chosen_korean: 그들이 내 추수를 다 마칠 때까지
  alternatives_korean:
  - 내 추수 일을 다 끝낼 때까지
  - 내 추수의 모든 일을 마칠 때까지
  - 내 수확을 모두 끝낼 때까지
  lexicon: HALOT
  rationale: קָצִיר는 단순한 ‘수확물’보다 ‘추수/수확 작업’의 뉘앙스가 강하므로, 끝나는 시점을 분명히 하는 ‘추수를 다 마칠 때까지’로 옮겼습니다.
theological_decisions:
- issue: 인용문 안의 보아스 발화 등록
  chosen_reading: 인용된 직접화법은 평서형 명령문을 한국어 자연문으로 옮겨, 권면의 강도를 유지했습니다.
  alternative_readings:
  - 더 직역하여 ‘너는 내 젊은이들 곁에 붙어 있어야 한다’로 옮길 수 있음
  - 완곡하게 ‘머물러도 된다’로 약화시킬 수 있음
  rationale: 원문은 허용이 아니라 지시/명령의 성격이 있으므로, 한국어에서도 명령적 뉘앙스를 보존하는 편이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 담화 기능 보존
