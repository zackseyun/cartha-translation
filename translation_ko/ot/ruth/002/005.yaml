base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
  footnotes:
  - marker: a
    text: Or, “Who does this young woman belong to?” The Hebrew asks about her affiliation or household connection.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 보아스가 베는 사람들 위에 세워 둔 자기의 젊은 사람에게 말했습니다. 「이 젊은 여자는 누구의 사람입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 질문은 단순한 소유가 아니라, 그녀가 누구의 집안이나 소속에 속한 사람인지 묻는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어에서는 자연스러운 순행 표현인 ‘그러자’로 옮겨 사건의 이어짐을 살렸습니다.
- source_word: לְנַעֲרוֹ
  english_pob_choice: to his young man
  chosen_korean: 자기의 젊은 사람에게
  alternatives_korean:
  - 자기의 종에게
  - 자기의 일꾼에게
  lexicon: HALOT
  rationale: נַעַר의 기본 의미인 ‘젊은 사람’을 살리되, 뒤의 ‘베는 사람들 위에 세워 둔’이라는 수식으로 감독 역할을 드러내어 의미를 분리해 반영했습니다.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  english_pob_choice: who was set over the reapers
  chosen_korean: 베는 사람들 위에 세워 둔
  alternatives_korean:
  - 베는 사람들을 감독하도록 세운
  - 베는 사람들 위에 서 있는
  lexicon: HALOT
  rationale: נצב의 수동·배치된 뉘앙스를 ‘세워 둔’으로 옮기고, קֹצְרִים은 동작을 드러내는 ‘베는 사람들’로 자연스럽게 표현했습니다.
- source_word: לְמִי ... הַנַּעֲרָה הַזֹּאת
  english_pob_choice: Whose young woman is this?
  chosen_korean: 이 젊은 여자는 누구의 사람입니까?
  alternatives_korean:
  - 이 젊은 여자는 누구에게 속해 있습니까?
  - 이 젊은 여자는 누구의 딸입니까?
  lexicon: HALOT
  rationale: 히브리어의 질문은 단순 소유가 아니라 소속·가문 관계를 묻는 관용 표현이므로, POB 각주 취지를 따라 ‘누구의 사람’으로 옮겼습니다.
