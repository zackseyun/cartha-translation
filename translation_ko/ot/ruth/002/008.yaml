  text: וַ/יֹּאמֶר֩ בֹּ֨עַז אֶל ר֜וּת הֲ/ל֧וֹא שָׁמַ֣עַתְּ בִּתִּ֗/י אַל תֵּלְכִי֙ לִ/לְקֹט֙ בְּ/שָׂדֶ֣ה אַחֵ֔ר וְ/גַ֛ם לֹ֥א תַעֲבוּרִ֖י מִ/זֶּ֑ה וְ/כֹ֥ה תִדְבָּקִ֖י/ן עִם נַעֲרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: ko
  text: 그때 보아스가 룻에게 말했습니다. “내 딸아, 들으십시오. 다른 밭으로 이삭을 줍러 가지 마십시오. 또 여기서 떠나지 말고, 내 젊은 여자들 곁에 붙어 있으십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 보아라
  - 듣지 않았느냐
  - 잘 들으십시오
  lexicon: שׁמע
  rationale: English POB의 ‘Listen’은 확인 질문보다 주의를 환기하는 호격적 권고로 읽히므로, 한국어에서는 자연스럽고 공손한 직접 호소인 ‘들으십시오’로 옮겼습니다.
- source_word: לִלְקֹט
  english_pob_choice: to glean
  chosen_korean: 이삭을 줍러
  alternatives_korean:
  - 이삭을 줍기 위해
  - 줍도록
  - 이삭을 거두러
  lexicon: לקט
  rationale: 시골 수확 관습을 가리키는 동사이므로 한국어 성경어인 ‘이삭을 줍다’ 계열을 살리되, 목적 동작을 분명히 하기 위해 동사구로 처리했습니다.
- source_word: נַעֲרֹתַי
  english_pob_choice: my young women
  chosen_korean: 내 젊은 여자들
  alternatives_korean:
  - 내 여자 종들
  - 내 시종녀들
  - 내 젊은 여종들
  lexicon: נערה
  rationale: 문맥상 보아스의 수확 현장에서 일하는 젊은 여성들을 가리키며, POB의 ‘my young women’을 따라 사회적 직함을 과도하게 강해지지 않게 ‘젊은 여자들’로 옮겼습니다.
theological_decisions:
- issue: 룻에게 대한 보아스의 호칭과 말투
  chosen_reading: ‘내 딸아’와 공손한 명령형으로, 보호와 권위를 함께 드러내는 말투를 유지했습니다.
  alternative_readings:
  - ‘내 딸’로 평서형 처리
  - 더 부드러운 권유형으로 완화
  rationale: 히브리어 호격 표현은 친밀한 보호 관계를 나타내므로, 한국어에서도 호칭과 명령형을 유지해 본문의 사회적·서사적 긴장을 보존했습니다.
  doctrine_reference: 본문 서사 및 언약 공동체의 보호 관계
