  source_fidelity: 히브리어 הֲלוֹא שָׁמַעַתְּ는 문자적으로 ‘듣지 않았습니까?’라는 부정 의문문입니다. 영어 POB의 ‘Listen’은 이를 주의 환기 표현으로 평탄화했지만, 한국어는 원문의 의문 형식을 보존하는 편이 안전합니다. תִדְבָּקִין עִם(‘~와 함께 계속 붙어/머물다’)도 ‘곁에 붙어’보다 ‘함께 계속 있으십시오’가 관계와 지속성을 더 정확히 드러냅니다.
  naturalness: ‘이삭을 줍러’는 비표준 축약형이므로 ‘이삭을 주우러’로 고쳐야 합니다. 또한 ‘내 젊은 여자들 곁에 붙어 있으십시오’는 한국어에서 다소 어색하고, 소유 관계의 여성 집단과 함께 행동하라는 뜻이 충분히 드러나지 않습니다.
  terminology: ‘이삭을 줍다’는 לקט의 농경 관습을 자연스럽게 나타냅니다. נַעֲרֹתַי는 영어 POB의 ‘my young women’을 따라 ‘내 젊은 여자들’로 유지하되, 이들이 보아스의 밭에서 일하는 여성 집단이라는 문맥은 ‘함께’로 반영합니다. ‘내 딸아’는 보호적 호칭을 보존합니다.
