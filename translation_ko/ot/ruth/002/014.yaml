- from: 식사 시간에 보아스가 그녀에게 말했습니다. 「이리 와서 빵을 조금 먹고, 네 한 조각을 신 포도주에 찍어 먹으십시오.」 그래서 그녀는 베는 사람들 곁에 앉았고, 그는 그녀에게 볶은 곡식을 주었습니다. 그녀는 먹고 배부르며, 남은 것이 있었습니다.[a]
