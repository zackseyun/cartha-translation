  chosen_reading: 보아스의 직접 인용은 공손한 명령형으로 옮기고, 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 직접 인용도 평서형으로 낮추기
  - 전체를 더 경직된 성경체로 옮기기
  rationale: 본문의 초대와 호의를 현대 한국어 독자가 자연스럽게 읽도록 하면서도, 화행의 직접성을 보존하기 위한 선택입니다.
  doctrine_reference: 본문 화행과 서사 톤
