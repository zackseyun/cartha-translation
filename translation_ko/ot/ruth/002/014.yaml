base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
  footnotes:
  - marker: a
    text: Or “dip your morsel in the vinegar.” The Hebrew חֹמֶץ can denote vinegar or a sour wine drink; in this agricultural meal context, a sour wine is likely intended.
    reason: lexical_alternative
translation:
  language: ko
  text: 식사 시간에 보아스가 그녀에게 말했습니다. 「이리 와서 빵을 조금 먹고, 네 한 조각을 신 포도주에 찍어 먹으십시오.」 그래서 그녀는 베는 사람들 곁에 앉았고, 그는 그녀에게 볶은 곡식을 주었습니다. 그녀는 먹고 배부르며, 남은 것이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신 포도주’는 이 문맥에서 노동자들의 식사에 곁들이는 신맛 나는 포도 음료를 가리킬 가능성이 큽니다. 따라서 전통 번역의 ‘식초’보다 문맥에 맞는 의미를 본문에 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  english_pob_choice: At mealtime
  chosen_korean: 식사 시간에
  alternatives_korean:
  - 먹을 때에
  - 식사할 때에
  lexicon: HALOT
  rationale: 관용적 시간표현으로, 수확 노동자들의 식사 때라는 문맥을 자연스럽게 살리면서도 원문의 시점을 유지합니다.
- source_word: גֹּשִׁי הֲלֹם
  english_pob_choice: Come here
  chosen_korean: 이리 와서
  alternatives_korean:
  - 여기 오십시오
  - 이쪽으로 오십시오
  lexicon: HALOT
  rationale: 가까이 오라는 직접 명령을 현대 한국어로 간결하게 옮겼습니다.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  english_pob_choice: dip your piece in the sour wine
  chosen_korean: 네 한 조각을 신 포도주에 찍어 먹으십시오
  alternatives_korean:
  - 네 조각을 식초에 찍어 먹으십시오
  - 네 빵 조각을 신 포도주에 찍어 먹으십시오
  lexicon: HALOT
  rationale: חֹמֶץ의 문맥상 의미를 반영해 ‘신 포도주’를 본문 표현으로 두고, ‘찍어 먹다’로 식사 동작을 자연스럽게 살렸습니다.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  english_pob_choice: he passed her roasted grain
  chosen_korean: 그는 그녀에게 볶은 곡식을 주었습니다
  alternatives_korean:
  - 그는 그녀에게 볶은 곡식을 내주었습니다
  - 그는 그녀에게 볶은 곡식을 건넸습니다
  lexicon: HALOT
  rationale: 동사의 정확한 세부 동작은 불확실하지만, 식탁 맥락에서 그녀에게 곡식을 건네 준 뜻을 가장 무리 없이 전달합니다.
- source_word: וַתֹּתַר
  english_pob_choice: she had some left over
  chosen_korean: 남은 것이 있었습니다
  alternatives_korean:
  - 조금 남았습니다
  - 남겨 둔 것이 있었습니다
  lexicon: HALOT
  rationale: 결과 상태를 한국어에서 자연스럽게 표현하되, 먹고 난 뒤 남은 양이 있다는 의미를 유지합니다.
theological_decisions:
