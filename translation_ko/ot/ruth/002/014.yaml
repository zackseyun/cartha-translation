  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
  footnotes:
  - marker: a
    text: Or “dip your morsel in the vinegar.” The Hebrew חֹמֶץ can denote vinegar or a sour wine drink; in this agricultural meal context, a sour wine is likely intended.
    reason: lexical_alternative
translation:
  language: ko
  text: 식사 시간에 보아스가 그녀에게 말했습니다. “이리 와서 빵을 조금 먹고, 네 빵 조각을 신 포도주에 찍어 먹으십시오.” 그래서 그녀는 추수하는 사람들 곁에 앉았고, 그는 그녀에게 볶은 곡식을 건네주었습니다. 그녀는 먹고 배부르게 되었으며, 남은 것도 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신 포도주’는 히브리어 חֹמֶץ를 옮긴 말입니다. 이 말은 ‘식초’로도 번역될 수 있으며, 이 식사 문맥에서는 신맛 나는 포도주 음료를 가리킬 가능성도 있습니다.
    reason: lexical_alternative
