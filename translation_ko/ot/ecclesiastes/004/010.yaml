  to: 만일 그들이 넘어지면, 한 사람이 자기 동료[a]를 일으켜 세웁니다. 그러나 넘어졌을 때 그를 일으켜 세워 줄 다른 사람이 없는 사람에게는 화가 있습니다.[b]
  rationale: ‘둘째’를 ‘다른 사람’으로 바꾸어 원문의 수적 대조와 한국어 자연스러움을 함께 살렸습니다. 원문에 없는 ‘외로운’을 삭제하고, חָבֵר는 현대적인 ‘동료’로 옮겼습니다. 반복되는 ‘일으켜 세우다’를 유지하여 קום 어근의 반복도 반영했습니다.
