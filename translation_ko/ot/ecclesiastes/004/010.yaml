id: ECC.4.10
reference: Ecclesiastes 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אִם יִפֹּ֔לוּ הָ/אֶחָ֖ד יָקִ֣ים אֶת חֲבֵר֑/וֹ וְ/אִ֣י/ל֗/וֹ הָֽ/אֶחָד֙ שֶׁ/יִּפּ֔וֹל וְ/אֵ֥ין שֵׁנִ֖י לַ/הֲקִימֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/010.yaml
  text: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
  footnotes:
  - marker: a
    text: Or 'his friend' for 'his companion.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and there is no second to lift him up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그들이 넘어지면, 한 사람이 자기 동무를 일으켜 세웁니다. 그러나 둘째가 없어 그를 일으켜 세워 줄 수 없는 외로운 사람에게는 화가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동무’는 여기서 정서적 ‘친구’보다 함께하는 동료·동반자를 가리키는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘둘째가 없어 그를 일으켜 세우는 이가 없다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 만일
  alternatives_korean:
  - 만일 …라면
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞절과의 논리적 연결을 유지하는 조건 표현으로 ‘만일’이 가장 자연스럽고, 영어 POB의 ‘For if’가 주는 설명적 조건성을 살립니다.
- source_word: יִפֹּלוּ
  english_pob_choice: they fall
  chosen_korean: 넘어지면
  alternatives_korean:
  - 떨어지면
  - 쓰러지면
  lexicon: HALOT
  rationale: 문맥상 실제로 균형을 잃고 쓰러지는 이미지를 살려 ‘넘어지면’으로 옮겼습니다. ‘떨어지다’는 다소 물리적 낙하에 치우치고, ‘쓰러지다’는 더 강한 상해 뉘앙스를 줄 수 있습니다.
- source_word: חֲבֵרֹו
  english_pob_choice: his companion
  chosen_korean: 자기 동무
  alternatives_korean:
  - 자기 친구
  - 자기 벗
  lexicon: HALOT
  rationale: חבר는 단순한 정서적 ‘친구’보다 동행자·동료의 뜻이 강하므로, 관계의 실용성을 드러내는 ‘동무’가 적절합니다.
- source_word: וְאֵין שֵׁנִי
  english_pob_choice: when there is not a second
  chosen_korean: 둘째가 없어
  alternatives_korean:
  - 다른 한 사람이 없어
  - 둘이 아니어서
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘둘째가 없다’는 숫자 대조를 보존합니다. 문맥상 조건을 분명히 하기 위해 연결을 자연스럽게 한 ‘둘째가 없어’로 옮겼습니다.
- source_word: לַהֲקִימוֹ
  english_pob_choice: to lift him up
  chosen_korean: 일으켜 세워 줄 수 없는
  alternatives_korean:
  - 일으켜 세우지 못하는
  - 일으켜 세울 이가 없는
  lexicon: HALOT
  rationale: 앞의 יָקִים과 같은 동작을 반복해, 넘어져 있는 사람을 물리적으로 다시 세우는 이미지를 한국어로도 유지했습니다.
theological_decisions:
- issue: ‘화’의 강도와 지혜문학 경고의 어조
  chosen_reading: ‘화가 있습니다’로 옮겨 경고와 애도의 결합을 살렸습니다.
  alternative_readings:
  - ‘불행합니다’
  - ‘불쌍합니다’
  rationale: הוֹי/וְאִילוֹ 계열의 감탄은 단순한 동정이 아니라 경고와 탄식을 함께 담으므로, ‘화’가 본문의 경고성을 가장 잘 보존합니다.
  doctrine_reference: 지혜문학의 경구적 경고 어조
