id: ECC.4.1
reference: Ecclesiastes 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁ֣בְתִּֽי אֲנִ֗י וָ/אֶרְאֶה֙ אֶת כָּל הָ֣/עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֣ה דִּמְעַ֣ת הָ/עֲשֻׁקִ֗ים וְ/אֵ֤ין לָ/הֶם֙ מְנַחֵ֔ם וּ/מִ/יַּ֤ד עֹֽשְׁקֵי/הֶם֙ כֹּ֔חַ וְ/אֵ֥ין לָ/הֶ֖ם מְנַחֵֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/001.yaml
  text: 'Then I turned and saw all the oppressions that are done under the sun: and behold[a], the tears of the oppressed, and they had no comforter. Power was in the hand of their oppressors[b], and they had no comforter.'
  footnotes:
  - marker: a
    text: Or 'all the oppressed that are under the sun.' The Hebrew passive participle can refer either to oppressed people or, by extension, to acts of oppression.
    reason: alternative_reading
  - marker: b
    text: Literally 'and from the hand of their oppressors, power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 다시 돌아보니, 해 아래에서 일어나는 모든 학대와 보니 — 억압받는 자들의 눈물이 있었으나 그들에게는 위로자가 없었습니다. 그들의 억압자들의 손에는 권세가 있었으나 그들에게는 위로자가 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해 아래 있는 모든 억압받는 자들’로도 옮길 수 있습니다. 히브리어 수동 분사는 억압받는 사람들을 가리키거나, 확장하여 억압의 행위 자체를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들의 억압자들의 손에서 권세가 있었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  english_pob_choice: Then I turned
  chosen_korean: 그때 내가 다시 돌아보니
  alternatives_korean:
  - 내가 돌아서서 보니
  - 또 내가 돌아보니
  lexicon: WLC/Qoheleth usage
  rationale: שׁוּב는 전도서에서 관찰의 전환을 여는 표현이므로, 물리적 ‘돌아감’보다 관찰 동작의 전환을 살려 옮겼습니다.
- source_word: כָּל הָעֲשֻׁקִים ... אֲשֶׁר נַעֲשִׂים
  english_pob_choice: all the oppressions that are done
  chosen_korean: 해 아래에서 일어나는 모든 학대
  alternatives_korean:
  - 해 아래에서 일어나는 모든 억압
  - 해 아래에서 행해지는 모든 압제
  lexicon: HALOT
  rationale: 문맥상 ‘억압받는 자들’로도 읽힐 수 있으나, 이어지는 ‘…that are done’과 결합할 때 억압의 행위/상황을 가리키는 말로 읽는 것이 더 자연스러워 ‘학대’로 옮겼습니다.
- source_word: דִּמְעַת הָעֲשֻׁקִים
  english_pob_choice: the tears of the oppressed
  chosen_korean: 억압받는 자들의 눈물
  alternatives_korean:
  - 압제받는 자들의 눈물
  - 억눌린 자들의 눈물
  lexicon: HALOT
  rationale: דִּמְעָה의 단수형이지만 한국어에서는 집합적 복수로 옮기는 것이 자연스러워 ‘눈물’로, והעֲשֻׁקִים는 사람을 가리키는 뒤 절에 맞춰 ‘억압받는 자들’로 옮겼습니다.
- source_word: מְנַחֵם
  english_pob_choice: comforter
  chosen_korean: 위로자
  alternatives_korean:
  - 위로해 주는 사람
  - 위안자
  lexicon: HALOT
  rationale: 반복되는 명사구의 기능을 살려 간결한 명사 ‘위로자’로 번역했습니다.
- source_word: וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ
  english_pob_choice: Power was in the hand of their oppressors
  chosen_korean: 그들의 억압자들의 손에는 권세가 있었으나
  alternatives_korean:
  - 그들의 억압자들의 손에는 힘이 있었으나
  - 그들의 억압자들의 손에 권세가 있었으나
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 이미지를 유지하되, 문맥상 단순한 힘보다 지배적 권한을 드러내는 ‘권세’가 더 적절합니다.
theological_decisions:
- issue: הָעֲשֻׁקִים의 주된 지시 대상
  chosen_reading: 첫 절반은 ‘억압’이라는 현실을, 후반은 그 피해자인 ‘억압받는 자들’을 드러내는 흐름으로 살렸습니다.
  alternative_readings:
  - 모든 억압받는 자들
  - 모든 압제 행위
  rationale: 원문과 POB 주해처럼 이 표현은 사람과 행위를 모두 가리킬 여지가 있으므로, 한국어 본문에서는 앞부분을 행위/상황 중심으로, 뒤에서는 피해자 중심으로 분화해 시적 전환을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 반복되는 ‘위로자 없음’의 종결감
  chosen_reading: 두 번 모두 ‘그들에게는 위로자가 없었습니다’로 반복했습니다.
  alternative_readings:
  - 그들을 위로해 줄 사람이 없었습니다
  - 위로자가 없었습니다
  rationale: 전도자의 관찰 보고체를 살리면서, 반복을 통해 무력한 현실의 절망감을 그대로 드러내기 위해 동일한 종결을 유지했습니다.
  doctrine_reference: Translation philosophy §6
