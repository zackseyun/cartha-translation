  - severity: medium
    issue: כֹּחַ를 ‘권세’로 번역
    rationale: כֹּחַ의 기본 의미는 힘, 능력, 세력입니다. 이 문맥에서는 억압자들이 가진 우세한 힘을 말하므로, 신학적·제도적 뉘앙스가 더 강한 ‘권세’보다 ‘힘’이 원문에 가깝습니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 대안 독법 각주는 첫 ‘억압’에, 문자적 표현 각주는 ‘힘’의 절에 붙여야 각각의 관련 어구가 분명해집니다.
