lexical_decisions:
- source_word: טוֹבִים הַשְּׁנַיִם מִן הָאֶחָד
  english_pob_choice: Two are better than one
  chosen_korean: 둘이 하나보다 낫습니다
  alternatives_korean:
  - 두 사람은 한 사람보다 더 좋습니다
  - 둘은 하나보다 더 낫습니다
  lexicon: HALOT
  rationale: 비교 구문으로서 מִן의 대비를 살려 ‘보다 낫다’로 옮겼고, 전도서 잠언체의 일반적 진술을 자연스러운 한국어로 다듬었습니다.
- source_word: אֲשֶׁר יֵשׁ לָהֶם
  english_pob_choice: because they have
  chosen_korean: 그들이 … 얻기 때문입니다
  alternatives_korean:
  - 그들에게 … 있기 때문입니다
  - 그들이 … 가지고 있기 때문입니다
  lexicon: HALOT
  rationale: 존재구문을 한국어에서는 소유·획득 표현으로 자연화해야 하므로, 문맥상 결과를 가리키는 ‘얻기 때문입니다’로 옮겼습니다.
- source_word: שָׂכָר טוֹב
  english_pob_choice: a good reward
  chosen_korean: 좋은 보상
  alternatives_korean:
  - 좋은 보수
  - 좋은 대가
  - 좋은 보답
  lexicon: HALOT
  rationale: שָׂכָר는 단순 임금보다 작업의 결과로 받는 보상/보답의 뜻이 넓어, 지혜문맥에 맞게 ‘보상’으로 옮겼습니다.
- source_word: בַּעֲמָלָם
  english_pob_choice: for their labor
  chosen_korean: 수고에 대한
  alternatives_korean:
  - 노고에 대한
  - 애쓴 것에 대한
  - 그들의 일에 대한
  lexicon: HALOT
  rationale: עָמָל은 전도서에서 반복되는 ‘수고/노고’의 뉘앙스를 가지므로, 추상적이면서도 한국어에서 자연한 ‘수고’로 살렸습니다.
