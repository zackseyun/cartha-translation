id: ECC.4.6
reference: Ecclesiastes 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֕וֹב מְלֹ֥א כַ֖ף נָ֑חַת מִ/מְּלֹ֥א חָפְנַ֛יִם עָמָ֖ל וּ/רְע֥וּת רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/006.yaml
  text: Better is a handful with rest than two handfuls with toil and a striving after wind[a][b].
  footnotes:
  - marker: a
    text: Or 'with quietness.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'and a striving/chasing after wind'; traditionally, 'and vexation of spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 줌의 평안이 두 줌의 수고와 바람을 좇는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바람을 좇음/추구함’이라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better is
  chosen_korean: …보다 낫습니다
  alternatives_korean:
  - …가 더 좋습니다
  - …가 낫습니다
  lexicon: WLC
  rationale: 비교 격언의 판정형을 한국어에서는 자연스럽게 ‘…보다 낫습니다’로 살렸습니다.
- source_word: מְלֹא כַף
  english_pob_choice: a handful
  chosen_korean: 한 줌
  alternatives_korean:
  - 한 손 가득
  - 손바닥 가득
  lexicon: HALOT
  rationale: ‘손의 가득함’이라는 측정 표현을 한국어의 관용적 양 표현인 ‘한 줌’으로 압축해 의미를 보존했습니다.
- source_word: נָחַת
  english_pob_choice: rest
  chosen_korean: 평안
  alternatives_korean:
  - 안식
  - 고요함
  - 휴식
  lexicon: HALOT
  rationale: 문맥상 노동과 대비되는 고요한 상태이므로, 단순 휴식보다 결과적 상태를 드러내는 ‘평안’이 적절합니다.
- source_word: וּרְעוּת רוּחַ
  english_pob_choice: and a chasing after wind
  chosen_korean: 바람을 좇는 것
  alternatives_korean:
  - 바람을 쫓는 것
  - 바람을 좇아 달리는 것
  - 헛바람을 좇는 것
  lexicon: HALOT
  rationale: 전도서의 반복 표현을 문자적으로 살리되, 영어 POB의 결정에 따라 ‘chasing after wind’의 허무한 추구를 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: רְעוּת רוּחַ의 관용적 의미 처리
  chosen_reading: ‘바람을 좇는 것’으로 옮겨, 전통적 교회어인 ‘심령의 괴로움’류 표현을 쓰지 않았습니다.
  alternative_readings:
  - ‘영의 괴로움’
  - ‘마음의 괴로움’
  - ‘헛된 마음의 번민’
  rationale: 히브리어 표현은 본문 자체의 이미지가 핵심이므로, 후대의 해석이 반영된 완화된 표현보다 허무한 추구라는 원뜻을 드러내는 번역이 본문 충실성에 더 적합합니다.
  doctrine_reference: 전도서 4:6의 지혜문학적 허무 비유
