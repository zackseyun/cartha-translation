- from: 한 줌의 평안이 두 줌의 수고와 바람을 좇는 것보다 낫습니다.[a]
  to: 고요함 가운데 얻는 한 줌이 수고하며 바람을 좇아 얻는 두 줌보다 낫습니다.[a][b]
  rationale: The revision renders נָחַת as ‘고요함,’ a closer modern Korean equivalent, and clarifies the Hebrew comparison by expressing the implied relation of the respective handfuls to quietness and toil. It retains the concrete image ‘바람을 좇는 것’ and supplies footnotes for both the lexical alternative and the historically traditional alternative without preferring a doctrinal interpretation.
