    text: 또는 ‘평온함’ 또는 ‘안식’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘바람을 좇음/추구함’이라는 뜻입니다. 전통적으로는 ‘심령의 괴로움’으로도 옮겼습니다.
    reason: lexical_alternative
