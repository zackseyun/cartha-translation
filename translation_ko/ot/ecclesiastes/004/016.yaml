  text: אֵֽין קֵ֣ץ לְ/כָל הָ/עָ֗ם לְ/כֹ֤ל אֲשֶׁר הָיָה֙ לִ/פְנֵי/הֶ֔ם גַּ֥ם הָ/אַחֲרוֹנִ֖ים לֹ֣א יִשְׂמְחוּ ב֑/וֹ כִּֽי גַם זֶ֥ה הֶ֖בֶל וְ/רַעְי֥וֹן רֽוּחַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
  footnotes:
  - marker: a
    text: Or, 'There is no end of all the people, of all those who went before them.' The Hebrew syntax in this clause is difficult and may be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Or, 'will not be glad about him' or 'will not rejoice over him.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'hebel,' a key term in Ecclesiastes for what is fleeting, insubstantial, or frustrating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들보다 앞서 있던 모든 사람을 포함하여, 모든 백성의 수는 끝이 없었습니다[a]. 그러나 뒤에 오는 사람들은 그를 두고 기뻐하지 않을 것입니다[b]. 이 또한 헛됨이며 바람을 쫓는 일입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 매우 난해합니다. 이를 ‘그들보다 앞서 있던 모든 사람을 포함하여, 모든 백성의 수는 끝이 없었다’로 이해할 수 있으며, ‘모든 백성에 관하여, 그들보다 앞서 있던 모든 사람에 관하여 끝이 없었다’로 분석할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그에 관하여 기뻐하지 않을 것입니다’, ‘그를 기뻐하지 않을 것입니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘헤벨’은 전도서에서 덧없음, 실체 없음, 좌절스러움을 가리키는 핵심어입니다.
    reason: lexical_alternative
