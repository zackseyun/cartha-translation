  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵֽין קֵ֣ץ לְ/כָל הָ/עָ֗ם לְ/כֹ֤ל אֲשֶׁר הָיָה֙ לִ/פְנֵי/הֶ֔ם גַּ֥ם הָ/אַחֲרוֹנִ֖ים לֹ֣א יִשְׂמְחוּ ב֑/וֹ כִּֽי גַם זֶ֥ה הֶ֖בֶל וְ/רַעְי֥וֹן רֽוּחַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
  footnotes:
  - marker: a
    text: Or, 'There is no end of all the people, of all those who went before them.' The Hebrew syntax in this clause is difficult and may be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Or, 'will not be glad about him' or 'will not rejoice over him.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'hebel,' a key term in Ecclesiastes for what is fleeting, insubstantial, or frustrating.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 백성에 대해, 그들보다 앞선 모든 사람에 대해서도 끝이 없었습니다[a]. 그러나 뒤에 오는 사람들은 그에게서 기뻐하지 않을 것입니다[b]. 이 또한 헛됨이며 바람을 쫓는 일입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 매우 어려워, '모든 백성에 대해, 그들보다 앞선 모든 사람에 대해서도'처럼 이해할 수도 있고 '모든 백성의 수가 끝이 없었다'처럼 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그를 두고 기뻐하지 않을 것입니다', '그를 기뻐하지 않을 것입니다'.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 '헤벨'은 전도서에서 덧없음, 실체 없음, 좌절스러움을 가리키는 핵심어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין קֵץ
  english_pob_choice: There was no end
  chosen_korean: 끝이 없었습니다
  alternatives_korean:
  - 끝이 없습니다
  - 한이 없었습니다
  lexicon: HALOT
  rationale: 존재 부정을 자연스러운 한국어로 옮기되, 문맥의 회고적 진술을 살려 과거형으로 처리했습니다.
- source_word: לְכָל הָעָם / לְכֹל אֲשֶׁר הָיָה לִפְנֵיהֶם
  english_pob_choice: to all the people / to all who were before them
  chosen_korean: 모든 백성에 대해, 그들보다 앞선 모든 사람에 대해서도
  alternatives_korean:
  - 모든 백성의 수가 다 셀 수 없었습니다
  - 그들 앞에 있던 모든 사람들에 대해서도
  lexicon: HALOT
  rationale: 히브리어의 압축된 전치사구를 한국어에서 과도하게 풀지 않으면서, 원문의 애매성을 보존하도록 '대해/에 대해서도'로 대응했습니다.
- source_word: לֹא יִשְׂמְחוּ בּוֹ
  english_pob_choice: will not rejoice in him
  chosen_korean: 그에게서 기뻐하지 않을 것입니다
  alternatives_korean:
  - 그를 두고 기뻐하지 않을 것입니다
  - 그를 기뻐하지 않을 것입니다
  - 그를 기뻐하지 않을 것입니다
  lexicon: HALOT
  rationale: בּוֹ의 관계를 직접적으로 단정하기보다, 인물에 대한 반응을 나타내는 자연스러운 한국어 표현인 '그에게서 기뻐하다'로 옮겼습니다.
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛됨
  alternatives_korean:
  - 허무
  - 바람
  - 공허
  lexicon: HALOT
  rationale: 전도서의 핵심어로서 전통적 '헛됨'을 유지하되, 현대 한국어에서도 개념어로 읽히도록 했습니다.
- source_word: רַעְיוֹן רוּחַ
  english_pob_choice: a chasing after wind
  chosen_korean: 바람을 쫓는 일
  alternatives_korean:
  - 바람을 좇는 일
  - 헛바람을 좇는 일
  - 바람을 추구하는 일
  lexicon: HALOT
  rationale: 관용적 은유를 직역에 가깝게 살리면서도 현대 문장으로 읽히도록 '쫓는 일'로 옮겼습니다.
theological_decisions:
- issue: 뒤에 오는 사람들의 시제와 일반적 진술의 성격
  chosen_reading: '''뒤에 오는 사람들''을 미래적·일반적 진술로 처리하여, 히브리어 미완료형의 개방성을 살렸습니다.'
  alternative_readings:
  - '''뒤에 온 사람들''로 과거 서술화'
  - '''뒤에 올 사람들''로 더 강한 미래화'
  rationale: 문맥상 단순한 사건 보고가 아니라 세대 간 반응의 일반 원리를 말하므로, 현재-미래적 함의를 남기는 번역이 가장 적절합니다.
  doctrine_reference: Translation philosophy §3
