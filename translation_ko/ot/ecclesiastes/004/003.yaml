id: ECC.4.3
reference: Ecclesiastes 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/טוֹב֙ מִ/שְּׁנֵי/הֶ֔ם אֵ֥ת אֲשֶׁר עֲדֶ֖ן לֹ֣א הָיָ֑ה אֲשֶׁ֤ר לֹֽא רָאָה֙ אֶת הַ/מַּעֲשֶׂ֣ה הָ/רָ֔ע אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/003.yaml
  text: But better than both of them is the one who has not yet been[a], who has not seen the evil deed that is done under the sun.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'the one not yet born.' The Hebrew more literally says 'the one who has not yet been.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 둘보다 더 나은 것은 아직 있지 않은 이—곧 아직 존재하지 않은 이—로, 해 아래에서 행해지는 악한 일을 보지 못한 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아직 존재하지 않은 이’입니다. 문맥상 보통 ‘아직 태어나지 않은 이’로 이해할 수 있지만, 히브리어는 출생보다 존재 자체의 부재를 더 직접적으로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹב
  english_pob_choice: But better
  chosen_korean: 그러나 이 둘보다 더 나은 것은
  alternatives_korean:
  - 그리고 이 둘보다 더 나은 것은
  - 하지만 이 둘보다 더 낫습니다
  lexicon: HALOT
  rationale: 앞절의 둘(산 자와 죽은 자)과 대조되는 비교이므로 ‘더 나은’으로 비교 의미를 살리고, 접속은 한국어 문맥상 ‘그러나’가 자연스럽습니다.
- source_word: מִשְּׁנֵיהֶם
  english_pob_choice: than both of them
  chosen_korean: 이 둘보다
  alternatives_korean:
  - 그 둘보다
  - 두 사람보다
  lexicon: HALOT
  rationale: 히브리어는 앞서 언급된 두 대상을 분명히 가리키므로, 한국어에서도 ‘이 둘’로 그 이중 비교를 분명하게 드러냅니다.
- source_word: אֵת אֲשֶׁר עֲדֶן לֹא הָיָה
  english_pob_choice: the one who has not yet been
  chosen_korean: 아직 있지 않은 이—곧 아직 존재하지 않은 이—
  alternatives_korean:
  - 아직 존재하지 않은 이
  - 아직 태어나지 않은 이
  lexicon: HALOT
  rationale: 직역하면 ‘아직 있지 않은/되지 않은 이’에 가까워서 먼저 원문에 가까운 표현을 두고, 이어서 동의적 설명을 덧붙여 독자가 의미를 놓치지 않게 했습니다. ‘아직 태어나지 않은 이’는 해석이 더 구체적이어서 본문보다 좁습니다.
- source_word: לֹא רָאָה
  english_pob_choice: has not seen
  chosen_korean: 보지 못한 사람입니다
  alternatives_korean:
  - 보지 않은 사람입니다
  - 본 적이 없는 사람입니다
  lexicon: HALOT
  rationale: 여기서는 부정의 완료 의미를 한국어 현재완료형으로 자연스럽게 옮겨, 존재하지 않음과 결합된 상태를 표현했습니다.
- source_word: הַמַּעֲשֶׂה הָרָע
  english_pob_choice: the evil deed
  chosen_korean: 악한 일
  alternatives_korean:
  - 악한 행위
  - 악한 짓
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 구체적 ‘행동/일’을 뜻할 수 있어, 문맥의 부정한 현실을 지나치게 도덕화하지 않으면서도 ‘악한’으로 그 성격을 분명히 했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 햇볕 아래에서
  lexicon: HALOT
  rationale: 전도서의 반복 공식이므로 관용적으로 ‘해 아래에서’를 유지했습니다.
theological_decisions:
- issue: עֲדֶן לֹא הָיָה의 존재론적 완곡성
  chosen_reading: ‘아직 있지 않은 이—곧 아직 존재하지 않은 이—’로 직역성과 해석성을 함께 살렸습니다.
  alternative_readings:
  - ‘아직 태어나지 않은 이’
  - ‘아직 존재하지 않은 이’만 단독 사용
  rationale: 히브리어는 태어남을 직접 말하지 않고 존재 자체를 부정하므로, 본문이 허용하는 범위 안에서만 설명을 보탰습니다. 이렇게 하면 문맥상 의미는 전달하면서도 원문의 표현 긴장은 유지됩니다.
  doctrine_reference: 전도서 4장의 존재-무존재 대비, 본문 주해 원칙
- issue: ‘악한 일’의 윤리적 강도
  chosen_reading: ‘악한 일’로 번역해 도덕적 평가를 분명히 했습니다.
  alternative_readings:
  - ‘나쁜 일’
  - ‘해로운 일’
  rationale: 원문의 הָרָע는 단순히 불쾌한 것이 아니라 악성/악행의 성격을 띠므로, 윤리적 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: אָוֶן/רַע 계열의 악성 표현 일반
