  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁ֧בְתִּי אֲנִ֛י וָ/אֶרְאֶ֥ה הֶ֖בֶל תַּ֥חַת הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/007.yaml
  text: Then I turned and saw vanity under the sun:[a][b]
  footnotes:
  - marker: a
    text: Or 'Again I turned and saw vanity under the sun.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew hebel, a key term in Ecclesiastes; also rendered 'vapor,' 'breath,' or 'meaninglessness' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 돌아서서 해 아래서 헛됨을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다시 나는 돌아서서 해 아래서 헛됨을 보았습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 hebel은 전도서의 핵심 용어로, 문맥에 따라 ‘바람,’ ‘숨,’ ‘헛됨,’ 또는 ‘의미없음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  english_pob_choice: Then I turned
  chosen_korean: 그때 나는 돌아서서
  alternatives_korean:
  - 그리고 나는 돌이켜
  - 다시 나는 돌아서서
  lexicon: HALOT
  rationale: שׁוּב는 문자적으로 ‘돌아가다/돌아서다’이므로, 반복된 관찰의 전환을 자연스럽게 살리는 ‘돌아서서’로 옮겼습니다. 영어 POB의 ‘Then’은 담화 전환을 반영하므로 ‘그때’로 처리했습니다.
- source_word: וָאֶרְאֶה
  english_pob_choice: saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았고
  - 관찰했습니다
  lexicon: HALOT
  rationale: ראה의 기본 의미인 ‘보다’를 직접 살렸고, 전도서의 사색적 맥락에 맞게 평서형 ‘보았습니다’를 택했습니다.
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛됨
  alternatives_korean:
  - 허무
  - 바람
  - 덧없음
  lexicon: HALOT
  rationale: hebel은 전도서의 핵심 어휘로 ‘vanity’를 기본값으로 삼되, 한국어에서는 ‘헛됨’이 공허함과 무상함을 함께 전달하면서도 ‘허무’보다 단정적 허무주의를 덜 강하게 띱니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래서
  alternatives_korean:
  - 태양 아래서
  - 해 밑에서
  lexicon: HALOT
  rationale: 전도서의 관용구를 한국어에서 가장 자연스럽고 널리 통용되는 ‘해 아래서’로 유지했습니다.
theological_decisions:
- issue: hebel의 신학적 톤
  chosen_reading: ‘헛됨’으로 번역해 전도서의 반복적 사색과 덧없음을 드러내되, ‘의미없음’으로 좁혀 단정적 허무주의로 고정하지 않았습니다.
  alternative_readings:
  - 의미없음
  - 허무
  rationale: hebel은 문맥상 덧없음, 헛됨, 안개 같은 유동성을 함께 지니므로, 한쪽 의미로 과도하게 축소하지 않는 것이 본문의 사유 폭을 보존합니다.
  doctrine_reference: 전도서의 지혜문학적 관찰어휘
