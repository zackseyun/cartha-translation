source:
  edition: WLC
  text: שְׁמֹ֣ר רגלי/ך כַּ/אֲשֶׁ֤ר תֵּלֵךְ֙ אֶל בֵּ֣ית הָ/אֱלֹהִ֔ים וְ/קָר֣וֹב לִ/שְׁמֹ֔עַ מִ/תֵּ֥ת הַ/כְּסִילִ֖ים זָ֑בַח כִּֽי אֵינָ֥/ם יוֹדְעִ֖ים לַ/עֲשׂ֥וֹת רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/017.yaml
  text: Guard your steps when you go to the house of God[a], and draw near to listen rather than to offer the sacrifice of fools[c][b], for they do not know that they are doing evil.
  footnotes:
  - marker: a
    text: Or 'Guard your feet when you go to the house of God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to hear' instead of 'to listen.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew literally, 'for they do not know to do evil,' likely meaning they do not realize that their action is evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 집에 갈 때에는 네 걸음을 지키십시오.[a] 어리석은 자들이 제사를 드리는 것보다 가까이 나아가 귀 기울여 들으십시오.[b] 그들은 자신들이 악을 행하고 있다는 것을 알지 못합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 발을 지키십시오’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들으십시오’. 여기의 말은 주의 깊게 듣는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들이 악을 행할 줄 알지 못한다’에 가깝습니다. 이는 그들의 행동이 악이라는 사실을 깨닫지 못한다는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר רגליך
  english_pob_choice: Guard your steps
  chosen_korean: 네 걸음을 지키고
  alternatives_korean:
  - 네 발을 지키고
  - 네 걸음을 살피고
  lexicon: HALOT
  rationale: ‘발’도 가능하지만, 한국어에서는 ‘걸음’이 접근 방식과 행실의 이미지를 더 자연스럽게 살리므로 경계의 뜻을 담아 옮겼습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집에
  lexicon: HALOT
  rationale: 본문의 직유를 보존하기 위해 ‘성전’으로 해석하지 않고, 히브리어 표현을 그대로 살린 ‘하나님의 집’을 택했습니다.
- source_word: וְקָרוֹב לִשְׁמֹעַ
  english_pob_choice: and draw near to listen
  chosen_korean: 듣는 일에 가까이하십시오
  alternatives_korean:
  - 듣기 위해 가까이하십시오
  - 들으러 가까이하십시오
  lexicon: HALOT
  rationale: ‘가까이하다/가까이하십시오’는 경건한 접근의 뉘앙스를 살리고, ‘듣다’보다 ‘듣는 일’로 풀어 목적성을 분명히 했습니다.
- source_word: מִתֵּת הַכְּסִילִים זָבַח
  english_pob_choice: rather than to offer the sacrifice of fools
  chosen_korean: 희생 제물을 드리는 것보다
  alternatives_korean:
  - 어리석은 자들의 제사를 드리는 것보다
  - 어리석은 이들의 제물보다
  lexicon: HALOT
  rationale: 앞의 ‘듣는 일’과 대조되도록 비교 구조를 자연스럽게 살렸고, זבח은 제사 행위의 맥락에서 ‘희생 제물’을 택했습니다.
- source_word: רָע
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 잘못
  - 악한 일
  lexicon: HALOT
  rationale: 마지막 절의 평가어는 단순한 실수보다 도덕적·신앙적 악을 가리키므로, 약화되지 않도록 ‘악’으로 옮겼습니다.
theological_decisions:
- issue: 듣는 것과 제사의 대비
  chosen_reading: 이 절은 제사를 전면 부정하기보다, 하나님 앞에 나아갈 때 경건한 경청이 형식적 제사보다 우선함을 책망합니다.
  alternative_readings:
  - 제사 자체를 거부하는 말씀
  - 단지 예배 절차의 우열을 말하는 말씀
  rationale: 히브리어는 ‘듣는 것’과 ‘어리석은 자들의 제물’을 대비하고, 끝절에서 그 행위를 악으로 규정합니다. 따라서 예배의 공허함을 비판하는 지혜문으로 읽는 것이 가장 적절합니다.
  doctrine_reference: Translation philosophy §3
