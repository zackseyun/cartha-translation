id: ECC.4.12
reference: Ecclesiastes 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִֽם יִתְקְפ/וֹ֙ הָ/אֶחָ֔ד הַ/שְּׁנַ֖יִם יַעַמְד֣וּ נֶגְדּ֑/וֹ וְ/הַ/חוּט֙ הַֽ/מְשֻׁלָּ֔שׁ לֹ֥א בִ/מְהֵרָ֖ה יִנָּתֵֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/012.yaml
  text: And if someone overpowers one[a], two will stand against him; and a threefold cord is not quickly broken.
  footnotes:
  - marker: a
    text: Or 'a three-stranded cord.' The Hebrew describes a cord made threefold.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 제압당하더라도, 두 사람은 그에게 맞설 것입니다. 세 겹으로 된 줄[a]은 빨리 끊어지지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세 가닥으로 된 줄’. 히브리어는 세 겹으로 이루어진 줄을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְקְפוֹ
  english_pob_choice: someone overpowers one
  chosen_korean: 제압당할 수 있으나
  alternatives_korean:
  - 누군가 한 사람을 압도하더라도
  - 한 사람이 공격당하더라도
  - 누군가 한 사람을 이기더라도
  lexicon: HALOT
  rationale: תקף의 ‘강하게 대하여 이기다/제압하다’라는 뜻을 살려 수동적 결과를 자연스럽게 옮겼습니다. 전반의 속담체를 해치지 않으면서 ‘한 사람’이 홀로 당하는 상황을 드러냅니다.
- source_word: יַעַמְדוּ נֶגְדּוֹ
  english_pob_choice: will stand against him
  chosen_korean: 그를 맞설 수 있습니다
  alternatives_korean:
  - 그 앞에 맞서 설 것입니다
  - 그를 대적할 것입니다
  - 그를 막아설 것입니다
  lexicon: HALOT
  rationale: ‘서다’의 이미지와 נגד의 대항 의미를 함께 살리되, 한국어 속담 표현으로는 ‘맞서다’가 가장 자연스럽습니다.
- source_word: הַחוּט / הַמְשֻׁלָּשׁ
  english_pob_choice: a threefold cord
  chosen_korean: 세 겹으로 꼰 줄
  alternatives_korean:
  - 세 가닥 줄
  - 세 겹의 끈
  - 세 가닥으로 된 줄
  lexicon: HALOT
  rationale: חוּט은 ‘줄/끈’의 물질성을 가지므로 ‘줄’로 옮겼고, משולש는 단순히 ‘셋’이 아니라 세 번 겹쳐져 하나가 된 상태를 나타내어 ‘세 겹으로 꼰’으로 풀었습니다.
- source_word: בִמְהֵרָה
  english_pob_choice: quickly
  chosen_korean: 쉽게
  alternatives_korean:
  - 빨리
  - 곧
  - 급히
  lexicon: HALOT
  rationale: 직역하면 ‘빨리’이지만, 문맥상 끊어지기 어려운 견고함을 말하므로 한국어에서는 결과적 의미를 드러내는 ‘쉽게’가 더 정확하게 전달합니다.
theological_decisions:
- issue: 속담의 은유를 얼마나 직접적으로 살릴지
  chosen_reading: ‘세 겹으로 꼰 줄’이라는 물리적 이미지를 유지해 인간 협력의 강함을 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘세 가닥 줄은 쉽게 끊어지지 않습니다’처럼 더 간명하게 옮길 수 있습니다.
  - ‘세 겹의 줄’처럼 덜 구체적으로 옮길 수 있습니다.
  rationale: 히브리어는 실제 끈의 구조를 바탕으로 한 비유이므로, 은유를 추상화하지 않고 가시적인 형상으로 보존하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 잠언적 지혜 문학의 은유 보존
- issue: ‘제압당하다’의 수동 표현 사용
  chosen_reading: 주어를 일반화하여 ‘한 사람이 제압당할 수 있으나’로 옮겼습니다.
  alternative_readings:
  - ‘누군가 한 사람을 제압하면’처럼 능동으로 옮길 수 있습니다.
  - ‘한 사람이 공격받으면’처럼 보다 약하게 옮길 수 있습니다.
  rationale: 히브리어 문장은 조건절에서 ‘한 사람을 이기다/제압하다’의 상황을 가리키므로, 한국어에서는 결과 중심의 수동 표현이 문맥상 가장 자연스럽고, 다음 절의 ‘두 사람’과도 대조가 분명합니다.
  doctrine_reference: 문법적 주어 일반화
