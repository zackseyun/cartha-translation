reference: Ecclesiastes 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאִ֨יתִֽי אֲנִ֜י אֶת כָּל עָמָ֗ל וְ/אֵת֙ כָּל כִּשְׁר֣וֹן הַֽ/מַּעֲשֶׂ֔ה כִּ֛י הִ֥יא קִנְאַת אִ֖ישׁ מֵ/רֵעֵ֑/הוּ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
  footnotes:
  - marker: a
    text: Or 'all success in work'; the Hebrew כִּשְׁרוֹן can refer to skill, competence, or the success that results from it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man's envy of his neighbor.' The singular masculine likely has representative force.
    reason: lexical_alternative
  - marker: c
    text: Or 'striving after wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 모든 수고와 모든 능숙한 일에 사람이 자기 이웃을 시기하는 마음이 있음을 보았습니다. 이 또한 헛되고 바람을 쫓는 일입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '일에서 얻는 성공'으로도 볼 수 있습니다. 히브리어 כִּשְׁרוֹן은 기술, 능숙함, 또는 그로부터 나오는 성공을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '한 남자의 이웃에 대한 시기'입니다. 단수 남성형은 대표적 의미를 지닐 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '바람을 좇는 일'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמָל
  english_pob_choice: labor
  chosen_korean: 수고
  alternatives_korean:
  - 노고
  - 일
  lexicon: HALOT
  rationale: 전도서에서 עָמָל은 단순한 일이 아니라 고된 인간의 분투와 노력을 가리키므로, 한국어로는 자연스럽고 문맥에 맞는 '수고'가 적절합니다.
- source_word: כִּשְׁרוֹן הַמַּעֲשֶׂה
  english_pob_choice: skillful work
  chosen_korean: 능숙한 일
  alternatives_korean:
  - 솜씨 있는 일
  - 기량 있는 일
  - 성공한 일
  lexicon: HALOT
  rationale: כִּשְׁרוֹן은 기술, 능숙함, 그 결과로서의 성공을 아우르므로, '능숙한 일'이 기술된 일의 질과 성취 가능성을 함께 살립니다.
- source_word: קִנְאַת אִישׁ מֵרֵעֵהוּ
  english_pob_choice: a man's envy of his neighbor
  chosen_korean: 사람이 자기 이웃을 시기하는 마음
  alternatives_korean:
  - 한 사람의 이웃에 대한 시기
  - 자기 이웃을 향한 사람의 질투
  lexicon: HALOT
  rationale: 히브리어는 단수 남성형으로 대표성을 띠므로, 본문 뜻을 살리면서도 한국어에서 자연스럽게 읽히도록 '사람이 자기 이웃을 시기하는 마음'으로 옮겼습니다.
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛되고
  alternatives_korean:
  - 허무하고
  - 덧없고
  lexicon: HALOT
  rationale: 전도서의 핵심어인 הֶבֶל의 의미를 너무 좁히지 않으면서도, 문장 안에서 '헛되고'로 반복해 주어 전도서적 정서를 유지했습니다.
- source_word: רְעוּת רוּחַ
  english_pob_choice: a chasing after wind
  chosen_korean: 바람을 쫓는 일
  alternatives_korean:
  - 바람을 좇는 일
  - 헛바람을 좇는 일
  - 바람을 뒤쫓는 일
  lexicon: HALOT
  rationale: 관용구의 이미지가 분명하므로 직역성을 유지한 '바람을 쫓는 일'이 가장 간결하게 허무한 추구를 드러냅니다.
theological_decisions:
- issue: 히브리어 단수 남성형의 대표성 처리
  chosen_reading: 개별 남성 한 사람으로만 좁히지 않고, 대표적 인간 일반을 가리키는 표현으로 '사람이'를 사용했습니다.
  alternative_readings:
  - '''한 남자가'''
  - '''어떤 사람이'''
  rationale: POB 주석이 지적하듯 단수 남성형은 대표성을 지니므로, 한국어에서는 성별을 과도하게 부각하지 않으면서도 원문의 일반성을 유지하는 편이 좋습니다.
  doctrine_reference: 문법적 대표성, 번역상 성중립화의 범위
