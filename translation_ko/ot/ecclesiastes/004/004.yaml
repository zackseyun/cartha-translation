  text: וְ/רָאִ֨יתִֽי אֲנִ֜י אֶת כָּל עָמָ֗ל וְ/אֵת֙ כָּל כִּשְׁר֣וֹן הַֽ/מַּעֲשֶׂ֔ה כִּ֛י הִ֥יא קִנְאַת אִ֖ישׁ מֵ/רֵעֵ֑/הוּ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
  footnotes:
  - marker: a
    text: Or 'all success in work'; the Hebrew כִּשְׁרוֹן can refer to skill, competence, or the success that results from it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man's envy of his neighbor.' The singular masculine likely has representative force.
    reason: lexical_alternative
  - marker: c
    text: Or 'striving after wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 나는 모든 수고와 모든 일의 능숙함[a]이 사람이 자기 이웃을 시기하는 데서[b] 나오는 것임을 보았습니다. 이 또한 헛된 것이며 바람을 쫓는 일입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일에서 얻는 성공’으로도 볼 수 있습니다. 히브리어 כִּשְׁרוֹן은 기술, 능숙함, 또는 그로부터 나오는 성공을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘한 남자가 자기 이웃을 시기함’입니다. 단수 남성형은 대표적 의미를 지닐 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘바람을 좇는 일’로도 옮길 수 있습니다.
    reason: lexical_alternative
