- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛되고
  alternatives_korean:
  - 허무하고
  - 덧없고
  lexicon: HALOT
  rationale: 전도서의 핵심어인 הֶבֶל의 의미를 너무 좁히지 않으면서도, 문장 안에서 '헛되고'로 반복해 주어 전도서적 정서를 유지했습니다.
- source_word: רְעוּת רוּחַ
  english_pob_choice: a chasing after wind
  chosen_korean: 바람을 쫓는 일
  alternatives_korean:
