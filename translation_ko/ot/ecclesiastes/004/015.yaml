    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I saw
  chosen_korean: 나는 … 보았습니다
  alternatives_korean:
  - 나는 … 보았습니다
  - 나는 … 관찰했습니다
  lexicon: HALOT
  rationale: 화자의 직접적인 관찰을 가장 자연스럽게 드러내는 1인칭 과거형으로 옮겼습니다.
- source_word: כָּל הַחַיִּים הַמְהַלְּכִים תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: all the living, those walking under the sun
  chosen_korean: 해 아래에서 살아가는 모든 사람
  alternatives_korean:
  - 해 아래에서 살아가는 모든 사람
  - 해 아래를 거니는 모든 살아 있는 사람들
  lexicon: HALOT
  rationale: ‘모든 살아 있는 이들’의 뜻을 문맥에 맞게 풀어, 전도서의 관용구인 ‘해 아래’도 유지했습니다.
- source_word: הַיֶּלֶד הַשֵּׁנִי
  english_pob_choice: the second youth
  chosen_korean: 둘째 청년
  alternatives_korean:
  - 둘째 청년
  - 두 번째 젊은이
  - 두 번째 아이
  lexicon: HALOT
  rationale: 직역의 ‘아이’는 통치 계승 문맥에 어울리지 않아, POB의 축약적 표현을 따라 ‘청년’으로 옮겼습니다.
- source_word: אֲשֶׁר יַעֲמֹד תַּחְתָּיו
  english_pob_choice: who would stand in his place
  chosen_korean: 그 자리를 대신할
  alternatives_korean:
  - 그 자리를 대신할
  - 그의 자리에 설
  - 그를 대신해 설
  lexicon: HALOT
  rationale: ‘그 밑에’의 직역보다 계승·대체의 관용적 의미가 분명하므로 ‘대신할’로 옮겼습니다.
theological_decisions:
- issue: ‘둘째 청년’의 정체를 본문 안에서 확정할지 여부
  chosen_reading: 본문은 그 인물을 단정하지 않고, 단순히 앞선 이를 대신할 인물로 제시합니다.
  alternative_readings:
  - 후계자
  - 후임 통치자
  - 둘째 아들/청년
  rationale: 히브리어와 POB 주석 모두 대체·계승 가능성을 열어 두므로, 해석을 앞서가지 않는 번역을 택했습니다.
  doctrine_reference: 전도서의 관찰 문맥과 본문 내 수사적 절제
