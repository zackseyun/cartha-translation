base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/011.yaml
  text: Again[a], if two lie down together, they keep warm; but how can one keep warm alone?
  footnotes:
  - marker: a
    text: Or 'they are warm'; the Hebrew expression literally indicates that warmth is for them.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 두 사람이 함께 누우면 따뜻해집니다.[a] 그러나 한 사람은 어떻게 따뜻해지겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 따뜻함이 있습니다.’ 히브리어는 문자적으로 그들에게 따뜻함이 있음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Again
  chosen_korean: 또
  alternatives_korean:
  - 또한
  - 게다가
  lexicon: HALOT
  rationale: 문맥상 전도서의 연속된 관찰을 이어 주는 첨가 표현이므로, ‘또’가 가장 자연스럽게 추가 진술의 흐름을 살립니다.
- source_word: יִשְׁכְּבוּ שְׁנַיִם
  english_pob_choice: if two lie down together
  chosen_korean: 두 사람이 함께 누우면
  alternatives_korean:
  - 둘이 함께 누우면
  - 두 사람이 함께 자면
  lexicon: HALOT
  rationale: שׁכב의 핵심은 ‘누움’이므로 ‘자다’보다 직접적으로 옮기고, ‘둘’은 대상이 사람임을 자연스럽게 풀어 줍니다.
- source_word: וְחַם לָהֶם
  english_pob_choice: they keep warm
  chosen_korean: 따뜻하지만
  alternatives_korean:
  - 따뜻해집니다
  - 그들에게 따뜻함이 있습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘그들에게 따뜻함이 있다’는 결과를 말하므로, 앞 절과 뒤 절을 대비시키는 문맥을 살려 ‘따뜻하지만’으로 압축했습니다.
- source_word: וּלְאֶחָד אֵיךְ יֵחָם
  english_pob_choice: but how can one keep warm alone?
  chosen_korean: 한 사람은 어떻게 따뜻하겠습니까?
  alternatives_korean:
  - 한 사람은 어떻게 따뜻해질 수 있겠습니까?
  - 혼자서 어떻게 따뜻하겠습니까?
  lexicon: HALOT
  rationale: ‘혼자서’는 본문의 대조를 드러내지만, 본문에는 명시어가 없으므로 과한 확장 없이 ‘한 사람은’으로 남기고 수사적 질문을 유지했습니다.
theological_decisions:
- issue: 수사적 질문의 존중
  chosen_reading: 본문의 마지막 절은 실제 정보 요청이 아니라, 한 사람의 한계를 드러내는 수사적 질문으로 유지했습니다.
  alternative_readings:
  - 평서문처럼 ‘한 사람은 따뜻하지 못합니다’로 바꾸는 읽기
  - 설명적 질문으로 완화하는 읽기
  rationale: 히브리어 שאלות형 ‘איך’의 압박감을 보존해야 본문의 지혜문학적 효과가 살아나므로, 한국어도 직접적인 수사 의문으로 옮겼습니다.
  doctrine_reference: 전도서의 지혜문학적 수사 구조
