id: ECC.4.8
reference: Ecclesiastes 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵ֣שׁ אֶחָד֩ וְ/אֵ֨ין שֵׁנִ֜י גַּ֣ם בֵּ֧ן וָ/אָ֣ח אֵֽין ל֗/וֹ וְ/אֵ֥ין קֵץ֙ לְ/כָל עֲמָל֔/וֹ גַּם עיני/ו לֹא תִשְׂבַּ֣ע עֹ֑שֶׁר וּ/לְ/מִ֣י אֲנִ֣י עָמֵ֗ל וּ/מְחַסֵּ֤ר אֶת נַפְשִׁ/י֙ מִ/טּוֹבָ֔ה גַּם זֶ֥ה הֶ֛בֶל וְ/עִנְיַ֥ן רָ֖ע הֽוּא־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/008.yaml
  text: There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor[c][b]. Yet his eyes are not satisfied with wealth, and he says, “And for whom am I laboring and depriving myself of good?” This too is vanity and a grievous business.
  footnotes:
  - marker: a
    text: Or, 'There is one alone' or 'there is one, with no other.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'depriving my soul of good'; here 'soul' means the self or person.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew word translated 'vanity' can also suggest 'vapor' or 'futility.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 있는데 둘째가 없고, 아들도 형제도 없으며, 그의 모든 수고에는 끝이 없습니다. 그의 눈도 재물에 만족하지 못하나, “내가 누구를 위해 수고하며 내 자신에게서 좋은 것을 빼앗고 있는가?”라고 말합니다. 이것도 헛됨이며, 괴로운 일입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 사람뿐인데’ 또는 ‘홀로 있는 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 영혼에서 좋은 것을 빼앗다’는 뜻으로, 여기서는 ‘나 자신’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 הֶבֶל은 ‘입김’, ‘허무’, ‘헛됨’의 뜻을 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אֶחָד וְאֵין שֵׁנִי
  english_pob_choice: There is one man, and he has no second
  chosen_korean: 한 사람이 있는데 둘째가 없고
  alternatives_korean:
  - 혼자 있는 사람이 있는데
  - 한 사람뿐인데
  lexicon: HALOT
  rationale: אֶחָד/שֵׁנִי의 관계를 살려 ‘둘째가 없다’고 옮기면 홀로 선 인물이라는 소외감과 결핍이 드러납니다. ‘한 사람이 있는데’는 시작의 존재 진술을 자연스럽게 살립니다.
- source_word: גַּם בֵּן וָאָח אֵין לוֹ
  english_pob_choice: he has neither son nor brother
  chosen_korean: 아들도 형제도 없으며
  alternatives_korean:
  - 아들도 형제도 없고
  - 아들과 형제도 없으며
  lexicon: HALOT
  rationale: 부정된 두 친족 관계를 한국어의 ‘도…도…없으며’로 간결하게 살렸습니다. ‘아들’과 ‘형제’를 그대로 유지해 가족적 고립을 약화하지 않았습니다.
- source_word: וְאֵין קֵץ לְכָל עֲמָלוֹ
  english_pob_choice: and there is no end to all his labor
  chosen_korean: 그의 모든 수고에는 끝이 없습니다
  alternatives_korean:
  - 그의 모든 노동에는 끝이 없습니다
  - 그의 모든 노고에는 끝이 없습니다
  lexicon: HALOT
  rationale: עָמָל은 전도서에서 단순 노동보다 고된 수고를 가리키는 경우가 많아 ‘수고’가 가장 무난합니다. ‘끝이 없습니다’는 אין קֵץ의 직접적 감각을 유지합니다.
- source_word: גַּם עֵינָיו לֹא תִשְׂבַּע עֹשֶׁר
  english_pob_choice: Yet his eyes are not satisfied with wealth
  chosen_korean: 그의 눈도 재물에 만족하지 못하나
  alternatives_korean:
  - 그의 눈도 재물로 만족하지 못하나
  - 그의 눈도 부에 만족하지 못하나
  lexicon: HALOT
  rationale: ‘눈’의 표현을 그대로 유지해 욕망의 방향을 신체 이미지로 드러냈습니다. עֹשֶׁר은 문맥상 ‘재물’이 자연스럽고, ‘도’는 גַּם의 누적/첨가를 살립니다.
- source_word: וּלְמִי אֲנִי עָמֵל וּמְחַסֵּר אֶת נַפְשִׁי מִטּוֹבָה
  english_pob_choice: And for whom am I laboring and depriving myself of good?
  chosen_korean: 내가 누구를 위해 수고하며 내 자신에게서 좋은 것을 빼앗고 있는가?
  alternatives_korean:
  - 내가 누구를 위해 수고하며 내 영혼에게서 좋은 것을 빼앗고 있는가?
  - 내가 누구를 위해 애쓰며 내 자신의 좋은 것을 빼앗고 있는가?
  lexicon: HALOT
  rationale: לְמִי는 ‘누구를 위해’로 옮겨 수고의 수혜 대상을 묻는 구조를 보존했습니다. נַפְשִׁי는 여기서 ‘내 자신’으로 이해하는 것이 적절하며, מִטּוֹבָה는 ‘좋은 것을’로 풀어 전도서의 일반적 ‘좋음’ 개념을 유지합니다.
- source_word: גַּם זֶה הֶבֶל
  english_pob_choice: This too is vanity
  chosen_korean: 이것도 헛됨이며
  alternatives_korean:
  - 이것도 허무이며
  - 이것도 바람과 같으며
  lexicon: HALOT
  rationale: הֶבֶל은 전도서의 표어적 용어이므로 전통적이면서도 현대어로 읽히는 ‘헛됨’을 택했습니다. 종결을 이어 주기 위해 뒤 문장과 호응하도록 ‘이며’로 처리했습니다.
- source_word: וְעִנְיַן רָע הוּא
  english_pob_choice: and a grievous business
  chosen_korean: 괴로운 일입니다
  alternatives_korean:
  - 고통스러운 일입니다
  - 심히 괴로운 일입니다
  - 나쁜 일입니다
  lexicon: HALOT
  rationale: עִנְיָן은 여기서 삶의 일거리/일로서의 성격을 가리키며, רָע는 단순 도덕악보다 고통스러운 성격이 두드러집니다. ‘괴로운 일’은 그 부담과 불편함을 현대 한국어로 직접 전달합니다.
theological_decisions:
- issue: נַפְשִׁי의 의미 범위
  chosen_reading: 내 자신
  alternative_readings:
  - 내 영혼
  - 내 목숨
  rationale: 지혜문학 문맥에서 נֶפֶשׁ은 기술적 영혼 개념보다 ‘자기 자신/생명’의 용례가 자연스럽습니다. ‘내 자신’은 과도한 영혼-육체 구분을 덧씌우지 않으면서 자기 소모의 뜻을 분명히 합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: הֶבֶל과 רָע의 결합
  chosen_reading: 헛됨이며, 괴로운 일입니다
  alternative_readings:
  - 허무이며, 비참한 일입니다
  - 헛됨이며, 나쁜 일입니다
  rationale: הֶבֶל의 표어성을 살리면서, וְעִנְיַן רָע는 단순한 평가가 아니라 삶의 무거운 고통을 말하므로 ‘괴로운 일’로 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §5
