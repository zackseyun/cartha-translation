source:
  edition: WLC
  text: כִּֽי מִ/בֵּ֥ית הָ/סוּרִ֖ים יָצָ֣א לִ/מְלֹ֑ךְ כִּ֛י גַּ֥ם בְּ/מַלְכוּת֖/וֹ נוֹלַ֥ד רָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/014.yaml
  text: For he came out from the house of prisoners to reign[b][a], though even in his kingdom he had been born poor.
  footnotes:
  - marker: a
    text: Or 'from prison'; Hebrew literally, 'from the house of prisoners.'
    reason: lexical_alternative
  - marker: b
    text: Or 'during his reign he was born poor,' with 'kingship/reign' as an alternative sense of 'kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 감옥에서 나와 왕위에 올랐습니다[a]. 그러나 그의 나라에서조차 그는 가난하게 태어났습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감옥에서’; 히브리어는 문자적으로 ‘죄수들의 집에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 통치 중에 가난하게 태어났습니다’; 히브리어의 ‘나라/왕위/통치’는 문맥에 따라 겹쳐질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֵּית הָסוּרִים
  english_pob_choice: from the house of prisoners
  chosen_korean: 감옥에서
  alternatives_korean:
  - 죄수들의 집에서
  - 수감자들의 집에서
  - 구금의 집에서
  lexicon: HALOT
  rationale: 히브리어의 직역성은 유지하되, 한국어에서는 ‘감옥에서’가 의미를 가장 분명하고 자연스럽게 전달합니다. ‘집’ 이미지는 각주로 보완합니다.
- source_word: יָצָא לִמְלֹךְ
  english_pob_choice: came out ... to reign
  chosen_korean: 나와 왕위에 올랐습니다
  alternatives_korean:
  - 나와 다스리게 되었습니다
  - 나와 통치하게 되었습니다
  - 나와 왕이 되었습니다
  lexicon: HALOT
  rationale: יָצָא의 ‘나오다’와 לִמְלֹךְ의 왕권 취지를 함께 살려, 한국어에서 자연스러운 왕위 등극 표현으로 옮겼습니다.
- source_word: בְּמַלְכוּתוֹ
  english_pob_choice: in his kingdom
  chosen_korean: 그의 나라에서조차
  alternatives_korean:
  - 그의 왕국에서
  - 그의 통치 중에도
  - 그의 왕위에서도
  lexicon: HALOT
  rationale: מַלְכוּת는 ‘왕국’과 ‘통치/왕위’의 범위를 모두 가질 수 있으므로, 문맥상 역설을 살리는 ‘그의 나라에서조차’로 처리했습니다.
- source_word: נוֹלַד רָשׁ
  english_pob_choice: he had been born poor
  chosen_korean: 가난하게 태어났습니다
  alternatives_korean:
  - 가난한 사람으로 태어났습니다
  - 빈곤하게 태어났습니다
  - 궁핍하게 태어났습니다
  lexicon: HALOT
  rationale: רָשׁ의 기본 의미를 한국어 ‘가난하게’로 옮기면, 출생 당시의 빈곤 상태를 간결하게 드러낼 수 있습니다.
theological_decisions:
- issue: 두 번째 כִּי의 논리 관계
  chosen_reading: ‘그러나/조차’로 이어지는 양보적 대비를 살렸습니다.
  alternative_readings:
  - ‘왜냐하면’으로 연속적인 인과로 옮김
  - ‘그리고’로 단순 병렬 처리
  rationale: 본문은 첫 절의 이유를 제시한 뒤, 같은 인물이 왕이 되었음에도 출생은 가난했다는 역설을 강조하므로, 양보적 대비가 더 잘 드러나야 합니다.
  doctrine_reference: 문학적·수사적 구조에 대한 해석
