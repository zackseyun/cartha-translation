id: ECC.4.13
reference: Ecclesiastes 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֛וֹב יֶ֥לֶד מִסְכֵּ֖ן וְ/חָכָ֑ם מִ/מֶּ֤לֶךְ זָקֵן֙ וּ/כְסִ֔יל אֲשֶׁ֛ר לֹא יָדַ֥ע לְ/הִזָּהֵ֖ר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/013.yaml
  text: Better is a poor but wise youth than an old and foolish king who no longer knows how to heed warning[a].
  footnotes:
  - marker: a
    text: Or 'who no longer knows how to receive instruction' or 'how to be admonished.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가난하지만 지혜로운 젊은이가 늙고 어리석은 왕보다 낫습니다. 그 왕은 더 이상 경고를 받아들일 줄 모릅니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 이상 훈계를 받아들일 줄 모릅니다’ 혹은 ‘더 이상 경고를 들을 줄 모릅니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: Better is
  chosen_korean: -보다 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 비교 구문이므로 한국어에서는 서술형 비교인 ‘-보다 낫습니다’로 옮겨 잠언식 판단을 자연스럽게 살렸습니다.
- source_word: יֶלֶד מִסְכֵּן וְחָכָם
  english_pob_choice: a poor but wise youth
  chosen_korean: 가난하지만 지혜로운 젊은이
  alternatives_korean:
  - 가난한데도 지혜로운 청년
  - 빈곤하지만 지혜로운 소년
  lexicon: HALOT
  rationale: יֶלֶד은 여기서 어린아이보다 ‘젊은이/청년’이 적절하고, מִסְכֵּן은 단순한 결핍보다 사회적·경제적 가난을 가리켜 ‘가난한’이 가장 간결합니다.
- source_word: מִמֶּלֶךְ זָקֵן וּכְסִיל
  english_pob_choice: than an old and foolish king
  chosen_korean: 늙고 어리석은 왕보다
  alternatives_korean:
  - 나이 많은 어리석은 왕보다
  - 늙은 바보 왕보다
  lexicon: HALOT
  rationale: זָקֵן과 כְסִיל의 대조를 그대로 살려 ‘늙고 어리석은’으로 옮겼습니다. כְסִיל은 지적 능력보다 지혜 문학의 도덕적·실천적 어리석음을 가리킵니다.
- source_word: לֹא יָדַע לְהִזָּהֵר עוֹד
  english_pob_choice: who no longer knows how to heed warning
  chosen_korean: 더 이상 경고를 받아들일 줄 모릅니다
  alternatives_korean:
  - 더 이상 경고를 들을 줄 모릅니다
  - 더 이상 훈계를 받아들일 줄 모릅니다
  - 더 이상 주의를 기울일 줄 모릅니다
  lexicon: HALOT
  rationale: לְהִזָּהֵר는 단순히 ‘조심하다’보다 경고·훈계를 받아들이는 수동적 수용을 뜻하므로, 문맥에 맞게 ‘경고를 받아들이다’로 풀어냈습니다. עוֹד는 부정과 결합해 ‘더 이상’으로 옮겼습니다.
theological_decisions:
- issue: כְסִיל의 지혜문학적 의미
  chosen_reading: ‘어리석은’은 단순한 지능 부족이 아니라 하나님 앞에서 교정받지 않는 지혜문학적 어리석음을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘우둔한’
  - ‘미련한’
  rationale: 본문은 왕의 지위보다 태도와 분별의 결핍을 대조하므로, 한국어에서도 도덕적·실천적 어리석음을 드러내는 ‘어리석은’이 가장 적절합니다.
  doctrine_reference: 잠언/전도서의 חכם-כסיל 대비 어휘
