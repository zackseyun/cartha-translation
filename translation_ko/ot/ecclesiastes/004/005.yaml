translation:
  language: ko
  text: 어리석은 사람은 두 손을 포개고[a] 자기 살을 먹습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 손을 맞잡는다’ 또는 ‘두 손을 깍지 낀다’. 이 모습은 게으른 무위를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 곧, 자기 자신을 해치거나 파멸시키는 모습을 비유적으로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּסִיל
  english_pob_choice: the fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 자
  - 우매한 사람
  lexicon: HALOT
  rationale: 지혜문학의 כְּסִיל은 단순한 지적 부족보다 도덕적·실천적 어리석음을 가리키므로, 자연스러운 현대 한국어로는 ‘어리석은 사람’이 가장 직접적입니다.
- source_word: חֹבֵק אֶת יָדָיו
  english_pob_choice: folds his hands
  chosen_korean: 자기 손을 포개고
  alternatives_korean:
  - 자기 손을 감싸 쥐고
  - 자기 손을 끼고
  lexicon: HALOT
  rationale: 동사 חֹבֵק은 문자적으로 ‘껴안다/감싸다’이지만 손과 함께 쓰여 무위와 게으름의 몸짓을 나타내므로, 관용적 의미를 살린 ‘손을 포개고’가 한국어로도 이미지와 뜻을 함께 전달합니다.
- source_word: בְּשָׂרוֹ
  english_pob_choice: his own flesh
  chosen_korean: 자기 살
  alternatives_korean:
  - 그의 살
  - 자기 육체
  lexicon: HALOT
  rationale: בָּשָׂר는 문자적으로 ‘살/육체’이므로, 본문의 강한 자기파괴 이미지를 살려 ‘자기 살’로 옮기고, ‘자기’를 넣어 반사적 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘자기 살을 먹는다’는 비유의 처리
  chosen_reading: 직역에 가까운 비유를 본문에 유지하여, 게으름과 어리석음이 낳는 자기파괴를 독자가 그대로 느끼게 했습니다.
  alternative_readings:
  - ‘자기를 망칩니다’처럼 해석적으로 옮김
  - ‘자기 몸을 해칩니다’처럼 완화함
  rationale: 히브리어는 노골적인 신체 비유를 사용하므로, 이를 평이한 추상어로 바꾸면 원문의 충격과 수사적 힘이 약해집니다. POB의 최적대응 원칙에 따라 비유를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
