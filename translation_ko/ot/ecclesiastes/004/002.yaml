id: ECC.4.2
reference: Ecclesiastes 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁבֵּ֧חַ אֲנִ֛י אֶת הַ/מֵּתִ֖ים שֶׁ/כְּבָ֣ר מֵ֑תוּ מִן הַ֣/חַיִּ֔ים אֲשֶׁ֛ר הֵ֥מָּה חַיִּ֖ים עֲדֶֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/002.yaml
  text: And I considered the dead[a], who have already died, more fortunate than the living, who are still alive.
  footnotes:
  - marker: a
    text: Or, 'And I praised the dead ... more than the living.' The Hebrew verb can be rendered more literally as 'praised' or 'commended'; here it expresses Qoheleth's judgment that the dead are better off.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이미 죽은 자들을, 아직 살아 있는 살아 있는 자들보다 더 낫다고 여겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 שׁבח는 여기서 ‘칭찬하다’ 또는 ‘더 낫다고 여기다/판단하다’로 옮길 수 있습니다. 문맥상 전도자는 죽은 자를 도덕적으로 찬양하는 것이 아니라, 살아 있는 자보다 더 나은 처지라고 평가하고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבֵּחַ
  english_pob_choice: considered ... more fortunate
  chosen_korean: 더 낫다고 여겼습니다
  alternatives_korean:
  - 칭찬했습니다
  - 찬미했습니다
  - 더 복되다고 여겼습니다
  lexicon: HALOT
  rationale: 피엘 שׁבח의 평가·판정 의미를 살리되, 문맥상 도덕적 찬양이 아니라 삶의 형편을 비교해 내리는 판단이므로 한국어에서는 ‘여겼습니다’로 자연스럽게 옮겼습니다.
- source_word: אֶת הַמֵּתִים
  english_pob_choice: the dead
  chosen_korean: 이미 죽은 자들을
  alternatives_korean:
  - 죽은 자들을
  - 죽은 이들을
  - 고인들을
  lexicon: HALOT
  rationale: 명사구로서 집단을 가리키므로 ‘자들’을 사용했고, 뒤의 이미(כְּבָר)와 연결해 완료 상태를 분명히 했습니다.
- source_word: שֶׁכְּבָר מֵתוּ
  english_pob_choice: who have already died
  chosen_korean: 이미 죽은
  alternatives_korean:
  - 벌써 죽은
  - 이미 세상을 떠난
  - 이미 죽어 버린
  lexicon: HALOT
  rationale: כְּבָר의 ‘이미/벌써’와 완료 동사의 상태를 간결하게 반영하되, 본문의 비교 판단에 맞게 과도한 정서를 덧붙이지 않았습니다.
- source_word: מִן הַחַיִּים
  english_pob_choice: more fortunate than the living
  chosen_korean: 살아 있는 자들보다 더 낫다고
  alternatives_korean:
  - 살아 있는 자들보다 더 복되다고
  - 산 자들보다 낫다고
  - 살아 있는 이들보다 더 좋다고
  lexicon: HALOT
  rationale: מן의 비교 의미를 명시적으로 살려 ‘보다 더 낫다’로 옮겼습니다. 문맥상 ‘복되다’는 후대적·신학적 뉘앙스를 더할 수 있어 피했습니다.
- source_word: עֲדֶנָה
  english_pob_choice: still alive
  chosen_korean: 아직 살아 있는
  alternatives_korean:
  - 여전히 살아 있는
  - 아직도 살아 있는
  - 아직 살아 있다
  lexicon: HALOT
  rationale: עֲדֶנָה의 ‘아직/여전히’ 의미를 한국어 부사 ‘아직’으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 죽은 자를 ‘복되다’로 단정할지, 비교적 판단으로 유지할지
  chosen_reading: 본문은 ‘해 아래’의 압제 속에서 죽은 자가 살아 있는 자보다 낫다고 보는 전도자의 관찰적 판단을 말하며, 죽은 자의 사후 상태에 대한 교리를 직접 진술하지는 않는다고 보았습니다.
  alternative_readings:
  - 죽은 자의 사후 복된 상태에 대한 진술
  - 단순한 과장된 절망 표현
  rationale: 문맥(4:1–3)이 압제와 고통의 현실에 대한 비교이므로, 신학적 결론을 앞당기지 않고 비교 판단 자체를 보존했습니다.
  doctrine_reference: 전도서의 긴장 보존; 사후 상태 교리의 직접화 지양
