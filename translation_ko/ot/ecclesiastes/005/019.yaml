- from: 그는 자기 생애의 날들을 많이 기억하지 못할 것입니다. 하나님이 그의 마음의 기쁨으로 그를 바쁘게 하시기 때문입니다.[a][b]
  to: 그는 자기 생애의 날들을 많이 기억하지 않을 것입니다. 하나님께서 그의 마음의 기쁨으로 그를 몰두하게 하시기 때문입니다.[a][b]
