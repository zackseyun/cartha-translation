    rationale: 문맥상 가능한 번역이지만, 현대 한국어에서는 주로 업무나 일상 활동의 분주함을 뜻합니다. 하나님이 마음의 기쁨으로 사람의 주의를 채우신다는 문맥에는 ‘몰두하게 하시다’가 더 정확하고 자연스럽습니다.
