source:
  edition: WLC
  text: כִּ֚י לֹ֣א הַרְבֵּ֔ה יִזְכֹּ֖ר אֶת יְמֵ֣י חַיָּ֑י/ו כִּ֧י הָ/אֱלֹהִ֛ים מַעֲנֶ֖ה בְּ/שִׂמְחַ֥ת לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/019.yaml
  text: For he will not remember much the days of his life[b][a], because God keeps him occupied with the joy of his heart.
  footnotes:
  - marker: a
    text: Or, more literally, 'For he will not remember much the days of his life'; the verb may also be understood as 'remember' rather than 'dwell on.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because God answers him with the joy of his heart.' The Hebrew verb can be understood more literally as 'answers,' though in context it likely means that God keeps him occupied or absorbed with joy.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 자기 생애의 날들을 많이 기억하지 않을 것입니다. 하나님께서 그의 마음의 기쁨으로 그를 몰두하게 하시기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “그는 자기 생애의 날들을 많이 기억하지 않을 것이다.” 히브리어 동사는 문맥상 ‘되새기다’ 또는 ‘마음에 두다’라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “하나님께서 그의 마음의 기쁨으로 그에게 응답하신다.” 히브리어 동사는 더 문자적으로 ‘응답하다’로도 옮길 수 있습니다. 그러나 여기서는 하나님께서 그를 마음의 기쁨에 몰두하게 하신다는 뜻으로 이해될 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִזְכֹּר
  english_pob_choice: will remember much
  chosen_korean: 많이 기억하지 못할 것입니다
  alternatives_korean:
  - 기억하지 않을 것입니다
  - 오래 생각하지 않을 것입니다
  - 되새기지 않을 것입니다
  lexicon: HALOT
  rationale: זכר의 기본 뜻인 ‘기억하다’를 살리되, 문맥상 정도를 나타내는 לֹא הַרְבֵּה를 자연스럽게 반영했습니다.
- source_word: אֶת יְמֵי חַיָּיו
  english_pob_choice: the days of his life
  chosen_korean: 자기 생애의 날들
  alternatives_korean:
  - 그의 삶의 날들
  - 그의 생애의 날들
  - 자기 삶의 날들
  lexicon: HALOT
  rationale: 히브리어의 표현을 비교적 직역적으로 살려 전도자의 문체와 반복감을 보존했습니다.
- source_word: מַעֲנֶה
  english_pob_choice: keeps him occupied
  chosen_korean: 그를 바쁘게 하시기
  alternatives_korean:
  - 그를 몰두하게 하시기
  - 그를 점유하시기
  - 그에게 응답하시기
  lexicon: HALOT
  rationale: 문맥상 ‘대답하다’보다 ‘사로잡아 두다/바쁘게 하다’는 의미가 더 자연스럽지만, 너무 해석적으로 넓히지 않고 동사의 작용을 드러냈습니다.
- source_word: בְּשִׂמְחַת לִבּוֹ
  english_pob_choice: with the joy of his heart
  chosen_korean: 그의 마음의 기쁨으로
  alternatives_korean:
  - 그의 마음의 즐거움으로
  - 마음의 기쁨 가운데
  - 그 마음의 기쁨으로
  lexicon: HALOT
  rationale: בְּ를 도구·방편으로 받아 ‘~으로’ 처리하여, 하나님이 기쁨을 매개로 사람을 채우신다는 이미지를 살렸습니다.
theological_decisions:
- issue: מַעֲנֶה의 의미를 ‘응답’으로 둘지 ‘바쁘게 하다’로 둘지
  chosen_reading: 문맥에 따라 하나님이 사람을 기쁨으로 바쁘게 하신다는 의미로 옮겼습니다.
  alternative_readings:
  - 하나님이 그의 마음의 기쁨으로 그에게 응답하신다
  - 하나님이 그의 마음의 기쁨으로 그를 괴롭게 하신다
  rationale: 전후 문맥(5:18-20)이 삶의 선물로서의 기쁨을 말하므로, ‘응답’의 더 문자적인 가능성은 주석으로 남기되 본문은 긍정적 의미를 택했습니다.
  doctrine_reference: Translation philosophy §3 — 문맥상 가능성과 직역 가능성을 구분하되, 해소하지 말고 주석으로 보존합니다.
