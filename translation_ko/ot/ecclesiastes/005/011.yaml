  edition: WLC
  text: מְתוּקָה֙ שְׁנַ֣ת הָ/עֹבֵ֔ד אִם מְעַ֥ט וְ/אִם הַרְבֵּ֖ה יֹאכֵ֑ל וְ/הַ/שָּׂבָע֙ לֶֽ/עָשִׁ֔יר אֵינֶ֛/נּוּ מַנִּ֥יחַֽ ל֖/וֹ לִ/ישֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/011.yaml
  text: Sweet is the sleep of the worker[a], whether he eats little or much, but the abundance of the rich man does not let him sleep.
  footnotes:
  - marker: a
    text: Or 'the fullness' or 'the satiety of the rich man does not let him sleep.' The Hebrew term can denote fullness or satisfaction, but here likely refers to the rich man's abundance or overfull state.
    reason: lexical_alternative
translation:
  language: ko
  text: 일하는 사람의 잠은 달콤합니다[a]. 그는 적게 먹든지 많이 먹든지 상관없지만, 부자의 넉넉함은 그가 잠들지 못하게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부자의 충만함’ 또는 ‘부자의 포만감’으로도 옮길 수 있습니다. 히브리어는 ‘가득 참’이나 ‘만족’의 뜻을 가질 수 있지만, 여기서는 부유함이나 과도한 충만 상태를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
