  text: Sweet is the sleep of the worker[a], whether he eats little or much, but the abundance of the rich man does not let him sleep.
  footnotes:
  - marker: a
    text: Or 'the fullness' or 'the satiety of the rich man does not let him sleep.' The Hebrew term can denote fullness or satisfaction, but here likely refers to the rich man's abundance or overfull state.
    reason: lexical_alternative
translation:
  language: ko
  text: 일하는 사람의 잠은, 그가 적게 먹든 많이 먹든, 달콤합니다. 그러나 부자의 풍족함[a]은 그 부자가 잠들지 못하게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부자의 충만함’ 또는 ‘부자의 포만감’으로 옮길 수 있습니다. 히브리어는 ‘가득 참’이나 ‘만족’의 뜻을 가질 수 있지만, 여기서는 부유함이나 과도하게 충만한 상태를 가리키는 것으로 보입니다.
    reason: lexical_alternative
