  - 적게 먹거나 많이 먹거나
  lexicon: HALOT
  rationale: 조건-상관 구조를 한국어의 대조 표현으로 풀어, 먹는 양과 무관하게 잠이 달콤하다는 뜻을 자연스럽게 전달했습니다.
- source_word: וְהַשָּׂבָע לֶעָשִׁיר
  english_pob_choice: the abundance of the rich man
  chosen_korean: 부자의 넉넉함
  alternatives_korean:
