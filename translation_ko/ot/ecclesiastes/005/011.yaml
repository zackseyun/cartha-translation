  lexicon: HALOT
  rationale: 히브리어의 기본 뜻인 ‘달다/달콤하다’를 살려 수면의 쾌적함을 비유적으로 드러냈습니다.
- source_word: שְׁנַת הָעֹבֵד
  english_pob_choice: the sleep of the worker
