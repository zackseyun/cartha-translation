  - 그에게 잠들게 하지 않습니다
  lexicon: HALOT
  rationale: 히브리어 사역 표현을 한국어의 자연스러운 부정 사역으로 옮겨, 잠을 ‘허락하지 않는’ 뜻을 분명히 했습니다.
theological_decisions:
