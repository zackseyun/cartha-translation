  lexicon: HALOT
  rationale: 문맥상 ‘충만/포만’보다 ‘풍족한 상태’가 더 적절하여, 부유함이 오히려 잠을 방해하는 역설을 살렸습니다.
- source_word: אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן
  english_pob_choice: does not let him sleep
  chosen_korean: 그가 잠들지 못하게 합니다
