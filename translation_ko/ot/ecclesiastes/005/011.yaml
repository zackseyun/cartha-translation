  lexicon: HALOT
  rationale: ‘worker’에 해당하는 분사를 자연스러운 현대 한국어로 옮기되, 직업적·사회적 뉘앙스를 과도하게 좁히지 않도록 했습니다.
- source_word: אִם מְעַט וְאִם הַרְבֵּה יֹאכֵל
  english_pob_choice: whether he eats little or much
  chosen_korean: 그는 적게 먹든지 많이 먹든지 상관없지만
  alternatives_korean:
