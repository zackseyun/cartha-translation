  chosen_reading: 이 절은 노동과 부유함에 대한 관찰적 지혜를 말하며, 절대적 약속이나 교리 명제처럼 읽지 않습니다.
  alternative_readings:
  - 도덕적 명령으로 읽기
  - 모든 부자는 반드시 불면증에 시달린다는 진술로 읽기
  rationale: 전도서의 문맥상 관찰적·격언적 진술로 이해하는 것이 가장 적절합니다.
  doctrine_reference: 전도서의 지혜문학적 장르
