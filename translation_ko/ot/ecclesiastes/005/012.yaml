    rationale: 히브리어 עֹשֶׁר שָׁמוּר לִבְעָלָיו는 재물이 그 소유자에 의해/그 소유자를 위해 보관된 상태를 가리키며, 이어지는 לְרָעָתוֹ는 그 소유자에게 해가 되는 결과를 말합니다. ‘주인이 … 간직해 둔’으로 보완하는 편이 자연스럽고 충실합니다.
