  text: יֵ֚שׁ רָעָ֣ה חוֹלָ֔ה רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֹ֛שֶׁר שָׁמ֥וּר לִ/בְעָלָ֖י/ו לְ/רָעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/012.yaml
  text: 'There is a grievous evil that I have seen under the sun: wealth kept by its owner to his harm[a].'
  footnotes:
  - marker: a
    text: Or 'for its owner, to his hurt.' The Hebrew prepositions can be represented slightly differently in English without changing the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 해 아래에서 내가 본 중대한 악이 하나 있습니다. 곧 주인에게 해가 되도록 지켜 둔 재물입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주인에게, 자기의 해로.’ 히브리어 전치사는 한국어에서 약간 다르게 옮길 수 있지만 뜻은 변하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: '...하나 있습니다'
  alternatives_korean:
  - '...이 있습니다'
  - '...가 있습니다'
  lexicon: HALOT
  rationale: 존재를 알리는 서술이므로 한국어에서도 자연스러운 존재문으로 옮겼습니다.
- source_word: רָעָה חוֹלָה
  english_pob_choice: grievous evil
  chosen_korean: 중대한 악
  alternatives_korean:
  - 극심한 악
  - 심각한 악
  - 몹시 괴로운 악
  lexicon: HALOT
  rationale: רָעָה의 도덕적·경험적 무게를 살리면서, חוֹלָה의 강화 기능은 ‘중대한’으로 압축해 부자연스러운 직역을 피했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 해 아래
  - 태양 아래에서
  lexicon: HALOT
  rationale: 전도서의 반복 관용구를 유지하되, 한국어에서는 ‘해 아래에서’가 가장 자연스럽고 문학적 리듬도 살립니다.
- source_word: לִבְעָלָיו לְרָעָתוֹ
  english_pob_choice: by its owner, to his harm
  chosen_korean: 주인에게 해가 되도록
  alternatives_korean:
  - 주인이 자기에게 해를 입히도록
  - 주인에게 해를 끼치도록
  - 소유자에게 손해가 되도록
  lexicon: HALOT
  rationale: ל/בעל의 소유 관계와 결과 구문을 한국어에서는 한 번에 풀어 자연스럽게 옮겼습니다. ‘해가 되도록’은 결과성을 유지하며 소유자가 손해를 입는 뜻을 잘 드러냅니다.
theological_decisions:
- issue: 전도서의 ‘악/해악’ 어휘 강도
  chosen_reading: ‘중대한 악’으로 옮겨 관찰된 현실의 도덕적·실존적 불편함을 유지했습니다.
  alternative_readings:
  - ‘재앙’
  - ‘나쁜 일’
  - ‘해로운 일’
  rationale: 이 구절의 רָעָה는 단순한 불행보다 더 강한 평가를 담고 있어, 완화된 표현보다 ‘악’ 계열을 택하는 것이 원문의 문제의식을 더 잘 보존합니다.
  doctrine_reference: 전도서 5:12의 경험적 지혜 진술
