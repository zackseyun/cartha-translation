  lexicon: HALOT
  rationale: 농경어 ‘수확’의 배경을 유지하면서도, 부의 맥락에서는 현대 독자가 곧바로 이해할 수 있는 ‘소득’이 가장 적절합니다.
- source_word: הָבֶל
  english_pob_choice: vapor
  chosen_korean: 안개
  alternatives_korean:
