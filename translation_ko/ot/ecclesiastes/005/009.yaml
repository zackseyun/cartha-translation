base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/009.yaml
  text: Whoever loves silver will not be satisfied with silver[a], nor whoever loves abundance with income[b]; this too is vapor.
  footnotes:
  - marker: a
    text: Or 'Whoever loves wealth is not satisfied with income.' The second clause is syntactically difficult; 'abundance' may also be understood as 'wealth,' and 'income' as 'increase' or 'gain.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'vapor' (traditionally 'vanity'); a recurring Ecclesiastes term for what is fleeting, elusive, or insubstantial.
    reason: lexical_alternative
translation:
  language: ko
  text: 은을 사랑하는 사람은 은으로 만족하지 못하고, 풍요를 사랑하는 사람은 소득으로 만족하지 못합니다. 이것도 안개와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘은’이지만, 문맥상 재물 일반을 가리키는 메타포로 이해될 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어 הָבֶל은 전도서의 반복어로, 전통적으로는 ‘헛됨’이지만 여기서는 덧없고 잡히지 않는 상태를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב כֶּסֶף
  english_pob_choice: whoever loves silver
  chosen_korean: 은을 사랑하는 사람
  alternatives_korean:
