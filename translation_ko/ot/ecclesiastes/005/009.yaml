  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 ‘은’을 살리되, 한국어에서는 재물을 가리키는 메타포로 자연스럽게 읽히도록 ‘은을 사랑하는 사람’으로 옮겼습니다.
- source_word: יִשְׂבַּע כֶּסֶף
  english_pob_choice: will not be satisfied with silver
  chosen_korean: 은으로 만족하지 못하고
