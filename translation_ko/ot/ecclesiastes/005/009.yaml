theological_decisions:
- issue: 전도서의 הָבֶל 관용구를 어떻게 한국어로 보존할지
  chosen_reading: ‘안개’로 번역하여 덧없음과 비실재성을 이미지적으로 드러냄
  alternative_readings:
  - 헛됨
  - 허무
  - 무의미
  rationale: 이 절의 결론은 도덕적 판단보다 존재의 덧없음에 있으며, ‘안개’가 반복어의 시적 효과를 가장 잘 살립니다.
  doctrine_reference: Translation philosophy §1, §5
