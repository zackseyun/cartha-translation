source:
  edition: WLC
  text: אֹהֵ֥ב כֶּ֨סֶף֙ לֹא יִשְׂבַּ֣ע כֶּ֔סֶף וּ/מִֽי אֹהֵ֥ב בֶּ/הָמ֖וֹן לֹ֣א תְבוּאָ֑ה גַּם זֶ֖ה הָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/009.yaml
  text: Whoever loves silver will not be satisfied with silver[a], nor whoever loves abundance with income[b]; this too is vapor.
  footnotes:
  - marker: a
    text: Or 'Whoever loves wealth is not satisfied with income.' The second clause is syntactically difficult; 'abundance' may also be understood as 'wealth,' and 'income' as 'increase' or 'gain.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'vapor' (traditionally 'vanity'); a recurring Ecclesiastes term for what is fleeting, elusive, or insubstantial.
    reason: lexical_alternative
translation:
  language: ko
  text: 은을 사랑하는 사람은 은으로 만족하지 못하며, 풍요를 사랑하는 사람도 소득으로 만족하지 못합니다.[a] 이것 또한 안개와 같습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 둘째 절은 문법적으로 난해하며, ‘풍요를 사랑하는 사람도 소득으로 만족하지 못한다’는 앞 절의 동사를 보충하여 옮긴 것입니다. ‘풍요’는 ‘부’ 또는 ‘많음’으로, ‘소득’은 ‘증가’, ‘수확’, 또는 ‘이익’으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 הָבֶל은 전도서에서 반복되는 말로, 전통적으로 ‘헛됨’으로 옮깁니다. 여기의 ‘안개’는 덧없고 붙잡기 어려운 것을 나타내는 비유적 번역입니다.
    reason: lexical_alternative
