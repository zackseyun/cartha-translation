  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘충분히 채워지다/만족하다’를 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: בֶּהָמוֹן
  english_pob_choice: abundance
  chosen_korean: 풍요
  alternatives_korean:
  - 부요
  - 많음
  - 재물
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘많음’보다 재물의 축적 상태를 드러내는 ‘풍요’가 더 적절하지만, 히브리어가 가리킬 수 있는 폭을 과도하게 좁히지는 않도록 했습니다.
- source_word: תְבוּאָה
  english_pob_choice: income
  chosen_korean: 소득
