  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תְּבַהֵ֨ל עַל פִּ֜י/ךָ וְ/לִבְּ/ךָ֧ אַל יְמַהֵ֛ר לְ/הוֹצִ֥יא דָבָ֖ר לִ/פְנֵ֣י הָ/אֱלֹהִ֑ים כִּ֣י הָ/אֱלֹהִ֤ים בַּ/שָּׁמַ֨יִם֙ וְ/אַתָּ֣ה עַל הָ/אָ֔רֶץ עַֽל כֵּ֛ן יִהְי֥וּ דְבָרֶ֖י/ךָ מְעַטִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/001.yaml
  text: Do not be hasty with your mouth[a], and do not let your heart be quick to bring forth a word before God, for God is in heaven and you are on earth. Therefore let your words be few.
  footnotes:
  - marker: a
    text: Or 'to utter a word'; in context this may include rash vows, but the Hebrew here speaks more broadly of bringing forth speech before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 입으로 성급히 말하지 마십시오. 마음으로 하나님 앞에서 말을 급히 꺼내지도 마십시오. 하나님은 하늘에 계시고 당신은 땅에 있으므로, 말을 적게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말을 급히 꺼내다’는 직역하면 ‘말을 밖으로 내다’입니다. 문맥상 성급한 서원을 포함할 수 있으나, 여기서는 하나님 앞에서 하는 말을 서원으로만 한정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל / יְמַהֵר
  english_pob_choice: be hasty / be quick
  chosen_korean: 경솔하게 말하다 / 말을 급히 내놓다
  alternatives_korean:
  - 성급하게 말하다
  - 서두르다
  lexicon: HALOT
  rationale: 두 동사가 함께 말의 성급함을 경고하므로, 한국어에서는 단순한 속도보다 판단 없는 성급함을 드러내는 표현이 자연스럽습니다.
- source_word: עַל פִּיךָ
  english_pob_choice: with your mouth
  chosen_korean: 입으로
  alternatives_korean:
  - 네 입으로
  - 네 말로
  lexicon: HALOT
  rationale: 직역적 이미지를 살리면서도 한국어에서 어색하지 않게 입과 말의 발화를 연결해 주는 표현으로 옮겼습니다.
- source_word: לְהוֹצִיא דָבָר
  english_pob_choice: to bring forth a word
  chosen_korean: 말을 내놓다
  alternatives_korean:
  - 한마디를 내뱉다
  - 말을 꺼내다
  - 말을 내다
  lexicon: HALOT
  rationale: 히브리어의 '말을 밖으로 내다'는 구체적 이미지를 유지하되, 단순한 발화보다 하나님 앞에서의 신중한 발화를 드러내는 한국어로 반영했습니다.
- source_word: לִפְנֵי הָאֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 앞에
  - 하나님 앞에서
  lexicon: HALOT
  rationale: 예배적·법정적 엄숙함을 드러내는 전치구를 한국어의 자연스러운 관용으로 옮겼습니다.
theological_decisions:
- issue: 본절을 서원(맹세)으로 한정할지 여부
  chosen_reading: 본문의 더 넓은 의미를 살려, 하나님 앞에서의 경솔한 말 전체로 옮겼습니다.
  alternative_readings:
  - 특히 예배 중 서원에 대한 경고로 좁혀 번역
  rationale: 문맥상 서원 논의가 이어지지만, 본절 자체는 '말'을 더 넓게 가리키므로 본문이 허용하는 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
