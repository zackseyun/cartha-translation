  to: 만일 당신이 지방에서 가난한 이들에 대한 억압[a]과 정의와 의의 약탈[b]을 보게 되면, 그 일에 놀라지 마십시오. 높은 자 위에는 더 높은 자가 지켜보고 있으며, 그들 위에는 더 높은 이들이 있기 때문입니다.[c]
  rationale: 수정문은 원문의 ‘높은 자’의 반복과 다층적 위계를 유지하면서, שֹׁמֵר를 보호가 아니라 감독적 주시로 자연스럽게 옮겼습니다. 하나님을 본문에 명시적으로 삽입하지 않아 원문의 해석상 열려 있는 의미를 보존했습니다. 각주는 해당 어구에 직접 연결하고, c 각주에는 원문의 표현 및 가능한 해석을 제시했습니다.
