id: ECC.5.7
reference: Ecclesiastes 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עֹ֣שֶׁק רָ֠שׁ וְ/גֵ֨זֶל מִשְׁפָּ֤ט וָ/צֶ֨דֶק֙ תִּרְאֶ֣ה בַ/מְּדִינָ֔ה אַל תִּתְמַ֖הּ עַל הַ/חֵ֑פֶץ כִּ֣י גָבֹ֜הַּ מֵ/עַ֤ל גָּבֹ֨הַ֙ שֹׁמֵ֔ר וּ/גְבֹהִ֖ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/007.yaml
  text: If you see the oppression of the poor and the robbery of justice and righteousness in the province, do not be astonished at the matter; for a high official is watched by one higher, and there are even higher ones over them.
  footnotes:
  - marker: a
    text: Or 'extortion of the poor.' The Hebrew terms can emphasize exploitative seizure as well as general oppression.
    reason: lexical_alternative
  - marker: b
    text: Or 'the plundering of justice and righteousness.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says 'for a high one is watching over a high one, and higher ones are over them,' which may refer to layers of human officials and may also imply ultimate divine oversight.
    reason: alternative_reading
translation:
  language: ko
  text: 만일 당신이 지방에서 가난한 사람의 억압과 정의와 의의 약탈을 보게 되면, 그 일에 놀라지 마십시오. 이는 높은 자를 지키는 이가 그보다 더 높고, 그들 위에 더 높은 이들이 있기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가난한 사람의 억압’은 ‘가난한 자에 대한 압제’ 또는 ‘가난한 사람을 향한 착취’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정의와 의의 약탈’은 ‘정의와 의의 강탈’ 또는 ‘정의와 의를 빼앗음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘지방’은 כאן의 מְדִינָה를 행정 구획으로 본 해석을 반영한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: עֹשֶׁק רָשׁ
  english_pob_choice: oppression of the poor
  chosen_korean: 가난한 사람의 억압
  alternatives_korean:
  - 가난한 자에 대한 압제
  - 가난한 사람을 향한 착취
  lexicon: HALOT
  rationale: עֹשֶׁק은 폭압적 억압과 착취를 아우르므로, 한국어로는 자연스럽고 포괄적인 ‘억압’을 택했습니다. רָשׁ은 계층적 의미의 ‘가난한 사람’으로 옮겼습니다.
- source_word: גֵזֶל מִשְׁפָּט וָצֶדֶק
  english_pob_choice: the robbery of justice and righteousness
  chosen_korean: 정의와 의의 약탈
  alternatives_korean:
  - 정의와 의의 강탈
  - 정의와 의를 빼앗음
  lexicon: HALOT
  rationale: גֵזֶל은 단순한 손실보다 강제적 탈취를 가리키므로 ‘약탈’이 문맥의 폭력을 잘 드러냅니다. מִשְׁפָּט과 צֶדֶק의 결합은 공적 정의와 윤리적 의를 함께 포괄하므로 각각 ‘정의’와 ‘의’로 살렸습니다.
- source_word: בַמְּדִינָה
  english_pob_choice: in the province
  chosen_korean: 지방에서
  alternatives_korean:
  - 도내에서
  - 한 지방에서
  - 행정 구역에서
  lexicon: HALOT
  rationale: מְדִינָה는 행정 구획을 가리키는 경우가 많지만, 한국어에서는 ‘지방’이 본문의 관료적 상황을 과도하게 좁히지 않으면서도 자연스럽습니다.
- source_word: תִּתְמַהּ עַל הַחֵפֶץ
  english_pob_choice: do not be astonished at the matter
  chosen_korean: 그 일에 놀라지 마십시오
  alternatives_korean:
  - 그 일에 놀라지 마세요
  - 그 사태를 이상히 여기지 마십시오
  lexicon: HALOT
  rationale: תִּתְמַהּ는 놀람/경이의 반응을 금지하는 말이므로, 현대적이고 간결한 ‘놀라지 마십시오’로 옮겼습니다. הַחֵפֶץ는 여기서 앞서 말한 사태를 가리키므로 ‘그 일’이 자연스럽습니다.
- source_word: גָבֹהַּ ... גְבֹהִים
  english_pob_choice: a high official ... higher ones
  chosen_korean: 높은 자... 더 높은 이들
  alternatives_korean:
  - 고관... 더 높은 자들
  - 높은 관리... 더 높은 자들
  lexicon: HALOT
  rationale: 높다/높은의 반복은 위계의 연쇄를 강조하므로, 직함을 덧붙이기보다 ‘높은 자/더 높은 이들’로 남겨 반복 효과를 보존했습니다.
theological_decisions:
- issue: 마지막 위계 문구가 하나님을 명시적으로 가리키는지 여부
  chosen_reading: 본문은 인간 위계의 연쇄를 그대로 살려 ‘더 높은 이들’로 번역하고, 하나님을 본문에 직접 삽입하지 않았습니다.
  alternative_readings:
  - 최종적으로는 하나님의 섭리나 감시를 암시한다고 해석할 수 있음
  - ‘더 높은 이들’에 하나님을 포함시키는 해석
  rationale: 히브리어는 반복되는 ‘높음’의 층위를 말할 뿐 하나님을 명시하지 않으므로, 번역은 그 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
