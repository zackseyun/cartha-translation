id: ECC.5.18
reference: Ecclesiastes 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם כָּֽל הָ/אָדָ֡ם אֲשֶׁ֣ר נָֽתַן ל֣/וֹ הָ/אֱלֹהִים֩ עֹ֨שֶׁר וּ/נְכָסִ֜ים וְ/הִשְׁלִיט֨/וֹ לֶ/אֱכֹ֤ל מִמֶּ֨/נּוּ֙ וְ/לָ/שֵׂ֣את אֶת חֶלְק֔/וֹ וְ/לִ/שְׂמֹ֖חַ בַּ/עֲמָל֑/וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/018.yaml
  text: Also[a], every man to whom God has given wealth and possessions, and has empowered him to eat from them, and to take his portion[c][b], and to rejoice in his labor—this is the gift of God.
  footnotes:
  - marker: a
    text: Or 'everyone' / 'every person.' The Hebrew reads 'every man' with a masculine singular noun used generically for human beings.
    reason: lexical_alternative
  - marker: b
    text: Or 'has given him power' or 'has enabled him.' The Hebrew verb emphasizes God-given ability to enjoy what one possesses.
    reason: lexical_alternative
  - marker: c
    text: Or 'to receive his lot' or 'to take his share.' 'Portion' is a key Ecclesiastes term for one's allotted share in life.
    reason: lexical_alternative
translation:
  language: ko
  text: 또[a] 하나님께서 재물과 소유를 주시고, 그에게 그것들에서 먹게 하시며, 자기 몫을 취하게 하시며, 자기 수고로 기뻐하게 하시는 사람은—이것이 하나님의 선물입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고’ / ‘더욱이’. 히브리어 גַּם은 앞 문맥을 이어 주는 추가 연결어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또
  alternatives_korean:
  - 그리고
  - 또한
  lexicon: HALOT
  rationale: 앞선 진술을 이어 주는 연결어로서 ‘또’가 추가적·연결적 뉘앙스를 가장 간결하게 살립니다.
- source_word: כָּל הָאָדָם
  english_pob_choice: every man
  chosen_korean: 사람은
  alternatives_korean:
  - 모든 사람은
  - 각 사람은
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 보통명사이지만 한국어 본문에서는 문맥상 일반화된 인간을 자연스럽게 가리키도록 ‘사람은’으로 옮겼습니다.
- source_word: וְהִשְׁלִיטוֹ
  english_pob_choice: has empowered him
  chosen_korean: 그에게 그것들에서 먹게 하시며
  alternatives_korean:
  - 그에게 먹을 능력을 주시며
  - 그것들을 누리게 하시며
  lexicon: HALOT
  rationale: שלט의 사역형은 단순 허용보다 하나님이 누릴 수 있는 실제 능력과 권한을 부여하시는 뜻이므로, 뒤의 ‘먹다’ 관용구를 살려 구체화했습니다.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  english_pob_choice: to eat from them
  chosen_korean: 그것들에서 먹게 하시며
  alternatives_korean:
  - 그것들을 먹게 하시며
  - 그것들로부터 먹게 하시며
  lexicon: HALOT
  rationale: ‘먹다/먹게 하다’라는 직접적인 표현을 유지해 지혜문학의 감각적·실질적 뉘앙스를 보존했습니다.
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  english_pob_choice: to take his portion
  chosen_korean: 자기 몫을 취하게 하시며
  alternatives_korean:
  - 자기 몫을 받게 하시며
  - 자기 몫을 차지하게 하시며
  lexicon: HALOT
  rationale: חלק은 전도서에서 ‘몫/분깃’의 핵심 어휘이므로 ‘몫’을 유지했고, נשׂא의 동작성을 살리기 위해 ‘취하다’를 택했습니다.
- source_word: וְלִשְׂמֹחַ בַּעֲמָלֹו
  english_pob_choice: to rejoice in his labor
  chosen_korean: 자기 수고로 기뻐하게 하시는
  alternatives_korean:
  - 자기 수고를 기뻐하게 하시는
  - 자기 노동 속에서 즐기게 하시는
  lexicon: HALOT
  rationale: עָמָל은 단순한 일이 아니라 수고·노고의 뉘앙스를 가지므로 ‘수고’로 옮기고, שמח의 기쁨을 명시했습니다.
- source_word: מַתַּת אֱלֹהִים
  english_pob_choice: the gift of God
  chosen_korean: 하나님의 선물입니다
  alternatives_korean:
  - 하나님의 선물입니다
  - 하나님께서 주신 선물입니다
  lexicon: HALOT
  rationale: 문장 결론을 자연스럽게 마무리하면서도 מקור의 진술형을 보존하기 위해 ‘하나님의 선물’로 직역했습니다.
theological_decisions:
- issue: ‘every man’의 성별 포괄성
  chosen_reading: 사람은
  alternative_readings:
  - 모든 사람은
  - 각 사람은
  rationale: 히브리어의 남성형 단수는 대표적 일반인을 가리키므로, 한국어 본문에서는 성별 표지를 드러내지 않되 의미 범위를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם adam'
- issue: 하나님이 주시는 것은 소유 자체뿐 아니라 누릴 능력까지 포함하는가
  chosen_reading: 그에게 그것들에서 먹게 하시며
  alternative_readings:
  - 그에게 먹을 능력을 주시며
  - 그것들을 누리게 하시며
  rationale: 본문은 재물의 소유와 더불어 그것을 실제로 누릴 수 있게 하시는 하나님의 주권을 말하므로, 추상화보다 구체적 관용구를 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
