  source_fidelity: 재물의 증가와 그것을 소비하는 이들의 증가, 그리고 소유자의 유익이 단지 보는 데 있다는 대조를 대체로 잘 옮겼습니다. 다만 재물에 대해 ‘먹는 자들’이라고 하면 한국어에서 문자적 섭식으로 이해되기 쉬워 원문의 문맥상 ‘소비하는 이들’이 더 충실합니다.
  naturalness: 현행 문장은 수사적 질문 뒤에 ‘다만 …뿐입니다’를 두어 의미는 전달하지만, ‘그것을 먹는 자들’은 재물과 결합할 때 부자연스럽습니다. ‘소비하는 이들’ 및 ‘… 외에는 없습니다’로 다듬으면 현대 표준 한국어의 격언적 문체가 자연스럽습니다.
