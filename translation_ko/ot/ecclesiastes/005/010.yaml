id: ECC.5.10
reference: Ecclesiastes 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/רְבוֹת֙ הַ/טּוֹבָ֔ה רַבּ֖וּ אוֹכְלֶ֑י/הָ וּ/מַה כִּשְׁרוֹן֙ לִ/בְעָלֶ֔י/הָ כִּ֖י אִם ראית עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/010.yaml
  text: When goods increase[a], those who consume them increase[b]; and what advantage is there to their owners except the seeing of their eyes?
  footnotes:
  - marker: a
    text: Or 'good things,' 'prosperity,' or 'wealth' for 'goods.' The Hebrew term can denote material good or prosperity more broadly; the immediate context favors possessions that can be consumed and owned.
    reason: lexical_alternative
  - marker: b
    text: Literally 'except the seeing of his eyes.' The Hebrew idiom suggests that the owner’s only benefit may be merely looking at what he has.
    reason: lexical_alternative
translation:
  language: ko
  text: 재물이 많아지면 그것을 먹는 자들도 많아지고, 그 소유주에게 무슨 유익이 있겠습니까? 다만 자기 눈으로 보는 것뿐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַטּוֹבָה는 문자적으로 ‘좋은 것들/좋음’도 뜻할 수 있으나, 여기서는 소유되고 소비되는 경제적 재화를 가리키는 흐름이 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘자기 눈의 보는 것’이라고 되어 있어, 소유자의 유익이 사실상 ‘바라보는 것’에 그칠 수 있음을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת הַטּוֹבָה
  english_pob_choice: When goods increase
  chosen_korean: 재물이 많아지면
  alternatives_korean:
  - 좋은 것들이 많아지면
  - 부가 늘어나면
  - 재산이 늘어나면
  lexicon: HALOT
  rationale: בְּ plus רבה의 관용적 시간 표현을 한국어 조건문으로 자연스럽게 옮겼고, הַטּוֹבָה는 이 문맥에서 소유·소비 가능한 경제적 축복을 가리키므로 '재물'이 가장 간결합니다.
- source_word: רַבּוּ אוֹכְלֶיהָ
  english_pob_choice: those who consume them increase
  chosen_korean: 그것을 먹는 자들도 많아지고
  alternatives_korean:
  - 그것을 소비하는 자들도 늘어나고
  - 그것을 먹는 이들도 많아지고
  - 그것을 먹는 자들이 증가하고
  lexicon: HALOT
  rationale: אכל의 기본 이미지는 '먹다'이므로 직접성을 살리되, 재물의 맥락에서 '소비하는 자들'이라는 의미를 한국어로 풀어 주었습니다.
- source_word: וּמַה כִּשְׁרוֹן לִבְעָלֶיהָ
  english_pob_choice: what advantage is there to their owners
  chosen_korean: 그 소유주에게 무슨 유익이 있겠습니까?
  alternatives_korean:
  - 그 소유자에게 무슨 이익이 있겠습니까?
  - 그 주인들에게 무슨 유익이 있겠습니까?
  - 그 소유주에게 무슨 이득이 있겠습니까?
  lexicon: HALOT
  rationale: כִּשְׁרוֹן은 '유익/이익' 계열이 가장 자연스럽고, בעל의 명사형은 '소유주'로 옮겨 소유 관계를 분명히 했습니다.
- source_word: כִּי אִם רְאִית עֵינָיו
  english_pob_choice: except the seeing of their eyes
  chosen_korean: 다만 자기 눈으로 보는 것뿐입니다.
  alternatives_korean:
  - 오직 자기 눈으로 보는 것뿐입니다.
  - 다만 눈으로 바라보는 것뿐입니다.
  - 그저 눈으로 보는 것 외에는 없습니다.
  lexicon: HALOT
  rationale: 히브리어 관용구 '눈의 보는 것'은 소유자의 실질적 유익이 아니라 단지 바라보는 행위만을 가리키므로, 의미를 드러내면서도 과도한 해석은 피했습니다.
theological_decisions:
- issue: 시적/격언적 수사에서의 어조
  chosen_reading: 직설적인 질문과 단정으로 한국어를 정리해, 재물의 증가는 유익의 증대가 아니라 관조에 그칠 수 있다는 역설을 살렸습니다.
  alternative_readings:
  - 완곡하게 풀어 설명하는 방식
  - 문학적 비유를 더 강하게 드러내는 방식
  rationale: 전도서의 격언적 문체는 짧고 날카로운 대비가 핵심이므로, 설교체 설명을 덧붙이지 않고 수사적 긴장을 유지하는 것이 원문에 가깝습니다.
  doctrine_reference: 전도서의 지혜 문학적 관찰과 수사 구조
