source:
  edition: WLC
  text: וְ/גַם זֹה֙ רָעָ֣ה חוֹלָ֔ה כָּ/ל עֻמַּ֥ת שֶׁ/בָּ֖א כֵּ֣ן יֵלֵ֑ךְ וּ/מַה יִּתְר֣וֹן ל֔/וֹ שֶֽׁ/יַּעֲמֹ֖ל לָ/רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/015.yaml
  text: 'This too is a grievous evil: exactly as he came[a], so he will go. And what profit is there for him who toils for the wind?'
  footnotes:
  - marker: a
    text: Or 'for the spirit' or 'for the breath'; Hebrew רוּחַ can mean 'wind,' 'breath,' or 'spirit.' Here 'wind' best fits the context of futile toil.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것도 심히 악한 일입니다. 그가 온 그대로 갈 것이니, 바람을 위해 수고하는 사람에게 무슨 이익이 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영을 위해’ 또는 ‘숨을 위해’로도 옮길 수 있습니다. 히브리어 רוּחַ는 ‘바람’, ‘숨’, ‘영’을 뜻할 수 있으나, 여기서는 ‘바람’이 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה חוֹלָה
  english_pob_choice: a grievous evil
  chosen_korean: 심히 악한 일
  alternatives_korean:
  - 지독한 악
  - 괴로운 악
  - 병든 악
  lexicon: HALOT
  rationale: רָעָה는 ‘악한 일/나쁜 것’이고, חוֹלָה는 문자적으로 ‘병든, 아픈’의 뜻이지만 이 관용구에서는 실제 질병보다 심각하고 고통스러운 악을 가리킵니다. ‘심히 악한 일’이 그 비유적 강도를 자연스럽게 살립니다.
- source_word: כָּל עֻמַּת שֶׁבָּא
  english_pob_choice: exactly as he came
  chosen_korean: 그가 온 그대로 그대로
  alternatives_korean:
  - 그가 온 것과 정확히 같이
  - 온 그대로
  - 그가 왔던 대로
  lexicon: HALOT
  rationale: עֻמַּת은 대응·대칭의 의미이므로, 죽을 때 들어온 상태와 나가는 상태의 정확한 대응을 드러내야 합니다. 한국어에서는 ‘그가 온 그대로’가 가장 직역에 가깝고 자연스럽습니다.
- source_word: לָרוּחַ
  english_pob_choice: for the wind
  chosen_korean: 바람을 위해
  alternatives_korean:
  - 영을 위해
  - 숨을 위해
  - 바람을 향하여
  lexicon: HALOT
  rationale: רוּחַ는 ‘바람/숨/영’이 될 수 있지만, 문맥은 헛된 수고의 이미지를 말하므로 ‘바람’이 가장 적절합니다. ‘바람을 위해’는 헛되이 애쓰는 감각을 그대로 살립니다.
- source_word: יִתְרוֹן
  english_pob_choice: profit
  chosen_korean: 이익
  alternatives_korean:
  - 유익
  - 남는 것
  - 이득
  lexicon: HALOT
  rationale: 전도서의 핵심 어휘로서 ‘남는 몫, 이익, 유익’을 뜻합니다. 여기서는 질문형 수사로 쓰이므로 ‘이익’이 간결하고 문맥에 잘 맞습니다.
theological_decisions:
- issue: רוּחַ의 의미를 ‘영’으로 영성화할지 여부
  chosen_reading: 문맥상 ‘바람’으로 유지합니다.
  alternative_readings:
  - 영
  - 숨
  rationale: 이 구절은 죽음 앞에서의 수고의 허무를 말하므로, 추상적·신학적 의미의 ‘영’보다 물리적 이미지인 ‘바람’이 저자의 의도를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
