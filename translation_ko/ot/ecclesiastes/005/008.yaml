id: ECC.5.8
reference: Ecclesiastes 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִתְר֥וֹן אֶ֖רֶץ בַּ/כֹּ֣ל היא מֶ֥לֶךְ לְ/שָׂדֶ֖ה נֶעֱבָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/008.yaml
  text: 'And the profit of the land in every way is this: a king committed to a cultivated field[a][b].'
  footnotes:
  - marker: a
    text: Or, 'But a king for a cultivated field is an advantage to a land in every way.' The Hebrew of this verse is notably difficult, and the relation among 'profit/advantage,' 'land,' and 'king' is understood in several ways.
    reason: alternative_reading
  - marker: b
    text: '''Profit'' may also be rendered ''advantage'' or ''gain,'' echoing Ecclesiastes'' recurring theme of what enduring benefit there is.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 땅의 이익은 모든 면에서 이것입니다. 곧 경작되는 밭을 위한 왕입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 매우 난해하며, ‘이익’, ‘땅’, ‘왕’의 관계는 여러 방식으로 이해될 수 있습니다. 직역하면 ‘경작되는 밭을 위한 왕’이며, 이를 ‘경작되는 밭에 의존하는 왕’ 또는 ‘경작되는 밭 때문에 땅에 유익한 왕’으로 이해하기도 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘이익’은 ‘유익’이나 ‘이득’으로도 옮길 수 있습니다. 이 말은 전도서에서 반복되며, 무엇이 참된 이득인가라는 책의 주제를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְרוֹן
  english_pob_choice: And the profit
  chosen_korean: 모든 면에서 땅의 이익은
  alternatives_korean:
  - 그리고 땅의 이익은
  - 땅의 이익은
  - 땅의 이득은
  lexicon: HALOT
  rationale: יִתְרוֹן의 반복 어휘를 살리되, 문맥상 ‘이익’이 ‘profit/advantage/gain’의 중립적 범위를 비교적 자연스럽게 반영합니다.
- source_word: בַּכֹּל
  english_pob_choice: in every way
  chosen_korean: 모든 면에서
  alternatives_korean:
  - 온전히
  - 모든 일에서
  - 전적으로
  lexicon: HALOT
  rationale: 관용적이고 난해한 부사를 한국어로 과도하게 해석하지 않으면서, 포괄성을 살려 옮겼습니다.
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  english_pob_choice: a king committed to a cultivated field
  chosen_korean: 밭을 섬기는 왕
  alternatives_korean:
  - 경작된 밭에 속한 왕
  - 밭을 위해 일하는 왕
  - 경작된 밭에 봉사하는 왕
  lexicon: HALOT
  rationale: 히브리어의 압축된 구문을 직역적으로 풀되, נֶעֱבָד의 수동/피동적 뉘앙스를 ‘섬기는’으로 살려 ‘밭에 봉사하는’이라는 의미 관계를 드러냈습니다.
theological_decisions:
- issue: 난해한 종결절의 관계 설정
  chosen_reading: 본문은 ‘땅의 이익’과 ‘왕-밭’의 관계를 단정적으로 재구성하지 않고, 원문의 압축성과 다의성을 보존하는 쪽으로 옮겼습니다.
  alternative_readings:
  - ‘땅에게는 모든 면에서 유익이 있다. 곧 밭을 섬기는 왕이다.’
  - ‘그러나 밭을 위해 있는 왕은 땅에 모든 면에서 이익이다.’
  rationale: 전승된 영어 POB도 이 절의 난해함을 주석으로 표시하므로, 한국어도 의미를 지나치게 매끈하게 정리하지 않고 구문상의 긴장을 유지했습니다.
  doctrine_reference: 문맥상 지혜문학의 난구절 처리 원칙
- issue: ‘בַּכֹּל’의 해석 범위
  chosen_reading: ‘모든 면에서’는 우주론적 ‘모든 것’이 아니라, 실용적·포괄적 이익의 범위를 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - ‘전적으로’
  - ‘온갖 면에서’
  - ‘모든 일에’
  rationale: 해석을 좁히거나 특정 교훈으로 몰아가지 않고, 문맥이 허용하는 폭 안에서 포괄성을 유지합니다.
  doctrine_reference: 지혜문학의 수사적 포괄성
