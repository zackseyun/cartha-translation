revisions:
- from: 하나님께 서원을 하거든 그것을 갚는 일을 지체하지 마십시오. 그는 어리석은 자들을 기뻐하지 않으십니다. 서원한 것은 갚으십시오.[a][b]
  to: 하나님께 서원하거든 그것을 이행하기를 지체하지 마십시오.[a] 하나님께서는 어리석은 자들을 기뻐하지 않으십니다.[b] 서원한 것은 이행하십시오.
  rationale: 서원을 ‘갚는다’는 표현을 ‘이행한다’로 바꾸어 שׁלם의 문맥상 의미를 현대 한국어로 자연스럽게 전달했습니다. 문장의 뜻과 명령의 반복은 유지했으며, 각주 표지를 해당 본문 절에 배치하고 각주 설명도 수정된 번역어에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:08Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 서원한 것을 지체 없이 שׁלם(갚다·완수하다·이행하다)하라고 명합니다. 초안의 ‘갚다’는 가능한 번역이지만, 현대 한국어에서는 금전 채무를 갚는 뜻이 먼저 떠올라 서원 이행이라는 의미가 불필요하게 좁아질 수 있습니다. ‘이행하다’가 문맥의 의무 이행을 더 정확하고 자연스럽게 전달합니다. 생략된 주어를 하나님으로 보충한 둘째 문장은 문맥과 영어 POB의 해석을 충실히 반영합니다.
  naturalness: ‘그것을 갚는 일을 지체하지 마십시오’는 명사화가 무겁고 ‘갚는 일’이 다소 부자연스럽습니다. ‘그것을 이행하기를 지체하지 마십시오’가 현대적인 합쇼체 문장으로 자연스럽습니다. ‘서원을 하거든’도 가능하지만 ‘서원하거든’이 더 간결합니다.
  terminology: ‘서원’은 נדר에 알맞은 표준 성서 용어입니다. כְּסִילִים은 지혜문학에서 윤리적 함의를 지닌 부류이므로 ‘어리석은 자들’은 적절합니다. שׁלם은 이 문맥에서 ‘이행하다’로 통일하여 서원의 내용이 금전적 상환에 한정되지 않음을 드러냈습니다.
  issues:
