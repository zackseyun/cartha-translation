  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ תִּדֹּ֨ר נֶ֜דֶר לֵֽ/אלֹהִ֗ים אַל תְּאַחֵר֙ לְ/שַׁלְּמ֔/וֹ כִּ֛י אֵ֥ין חֵ֖פֶץ בַּ/כְּסִילִ֑ים אֵ֥ת אֲשֶׁר תִּדֹּ֖ר שַׁלֵּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/003.yaml
  text: When you make a vow to God[a], do not delay in paying it, for he takes no pleasure in fools[b]. Pay what you vow.
  footnotes:
  - marker: a
    text: Or 'do not postpone fulfilling it.' The Hebrew verb can denote paying, completing, or fulfilling what was vowed.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''for there is no pleasure in fools,'' with the subject implied; the sense is that God takes no pleasure in fools.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께 서원을 하거든 그것을 갚는 일을 지체하지 마십시오. 그는 어리석은 자들을 기뻐하지 않으십니다. 서원한 것은 갚으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갚는 일을’은 ‘이행하는 일’ 또는 ‘완수하는 일’로도 옮길 수 있습니다. 히브리어 동사는 서원한 것을 지불하거나 끝내거나 이행하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘어리석은 자들 안에는 기쁨이 없다’는 식으로 주어를 생략합니다. 문맥상 하나님을 가리키는 것으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּדֹּר נֶדֶר
  english_pob_choice: you make a vow
  chosen_korean: 서원을 하거든
  alternatives_korean:
  - 서원하거든
  - 맹세를 하거든
  lexicon: HALOT
  rationale: 히브리어의 동사+명사 중복 표현은 한국어에서 자연스럽게 ‘서원을 하다’로 옮기는 것이 적절하며, 조건적 서두는 ‘하거든’으로 문맥의 경우성을 살렸습니다.
- source_word: לְשַׁלְּמוֹ
  english_pob_choice: in paying it
  chosen_korean: 그것을 갚는 일을
  alternatives_korean:
  - 그것을 이루는 일을
  - 그것을 완수하는 일을
  lexicon: HALOT
  rationale: שׁלם은 여기서 서원한 것을 이행하고 갚는 뜻이므로, 구체적 의무감을 드러내는 ‘갚는 일’이 가장 직접적입니다.
- source_word: בַּכְּסִילִים
  english_pob_choice: fools
  chosen_korean: 어리석은 자들
  alternatives_korean:
  - 미련한 자들
  - 우매한 자들
  lexicon: HALOT
  rationale: 지혜문학의 כְּסִילִים은 단순 지능 부족보다 도덕적·영적 어리석음을 가리키므로, 비속하지 않으면서도 평가적 뉘앙스를 살린 표현을 택했습니다.
- source_word: שַׁלֵּם
  english_pob_choice: Pay
  chosen_korean: 갚으십시오
  alternatives_korean:
  - 이행하십시오
  - 완수하십시오
  lexicon: HALOT
  rationale: 마지막 명령은 앞의 ‘지체하지 마십시오’와 짝을 이루는 서원 이행의 압축적 표현이므로, 같은 어근 의미를 살린 간결한 명령형 ‘갚으십시오’가 적절합니다.
theological_decisions:
- issue: ‘for he takes no pleasure in fools’의 암시된 주어
  chosen_reading: 주어를 하나님으로 분명히 드러내어 ‘그는 어리석은 자들을 기뻐하지 않으십니다’로 옮겼습니다.
  alternative_readings:
  - ‘어리석은 자들 가운데 기쁨이 없다’로 무주어처럼 옮김
  - ‘누구도 어리석은 자를 기뻐하지 않는다’로 일반화함
  rationale: 문맥이 하나님께 드리는 서원에 관한 것이므로, 히브리어의 생략된 주어는 하나님으로 이해하는 것이 가장 자연스럽고 독자에게 의도를 명확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
