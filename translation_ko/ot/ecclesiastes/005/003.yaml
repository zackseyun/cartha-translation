    rationale: שׁלם은 지불의 뜻도 있지만, 이 절에서는 서원한 바를 완수·이행한다는 넓은 뜻입니다. 현대 표준어에서는 ‘서원을 이행하다’가 더 자연스럽고 의미 범위도 적절합니다.
  - severity: low
    issue: 두 각주 표지가 문단 끝에 함께 놓여 있어 각주가 가리키는 본문 위치가 불명확합니다.
    rationale: 어휘 대안 각주는 ‘이행하기’에, 생략 주어 관련 각주는 ‘어리석은 자들’을 기뻐하지 않으신다는 절에 각각 붙이는 것이 명확합니다.
