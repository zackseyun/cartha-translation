source:
  edition: WLC
  text: הִנֵּ֞ה אֲשֶׁר רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר יָפֶ֣ה לֶֽ/אֶכוֹל וְ֠/לִ/שְׁתּוֹת וְ/לִ/רְא֨וֹת טוֹבָ֜ה בְּ/כָל עֲמָל֣/וֹ שֶׁ/יַּעֲמֹ֣ל תַּֽחַת הַ/שֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי חי/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים כִּי ה֥וּא חֶלְקֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/017.yaml
  text: Behold[a], what I myself have seen to be good and fitting is to eat and to drink and to see good in all the labor at which he labors under the sun during the number of the days of his life that God has given him, for this is his portion.
  footnotes:
  - marker: a
    text: Or, 'to enjoy good' or 'to experience good.' Hebrew literally, 'to see good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 내가 직접 보기에 좋은 것, 알맞은 것은 해 아래에서 수고하는 모든 수고 가운데서 먹고 마시며, 하나님이 그에게 주신 자기 생애의 날들의 수만큼 자기의 몫이 이것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘좋음을 보다’입니다. 문맥상 ‘좋은 것을 누리다’ 또는 ‘좋은 것을 경험하다’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 문맥의 주목 환기와 단락 시작의 강조를 살리면서, 현대 합쇼체에서 자연스러운 직접 호명으로 옮겼습니다.
- source_word: רָאִיתִי אָ֗נִי
  english_pob_choice: what I myself have seen
  chosen_korean: 내가 직접 보기에
  alternatives_korean:
  - 내가 본 것은
  - 내가 직접 본 것은
  lexicon: HALOT
  rationale: אָ֗נִי의 강조를 ‘내가 직접’으로 반영하고, ‘보기에’로 코헬렛의 판단 진술 느낌을 자연스럽게 살렸습니다.
- source_word: טוֹב אֲשֶׁר יָפֶה
  english_pob_choice: good and fitting
  chosen_korean: 좋은 것, 알맞은 것
  alternatives_korean:
  - 좋고 알맞은 것
  - 좋고 아름다운 것
  lexicon: HALOT
  rationale: 형용사 두 개의 병렬을 한국어에서 가장 자연스럽게 풀어, 도덕적 ‘좋음’과 상황적 ‘알맞음’을 함께 보존했습니다.
- source_word: וְלִרְאוֹת טוֹבָה
  english_pob_choice: to see good
  chosen_korean: 먹고 마시며
  alternatives_korean:
  - 좋음을 보며
  - 좋은 것을 누리며
  lexicon: HALOT
  rationale: 영어 POB의 본문 표현은 유지하되, 한국어에서는 이어지는 ‘먹고 마시다’와 함께 즐거움을 나타내는 전반적 문맥을 자연스럽게 반영했습니다. 다만 본문에는 ‘좋은 것’을 유지하지 않고, 의미를 보완하는 풀이를 footnote로 처리했습니다.
- source_word: בְּכָל עֲמָלוֹ
  english_pob_choice: in all the labor
  chosen_korean: 해 아래에서 수고하는 모든 수고 가운데서
  alternatives_korean:
  - 모든 노동 가운데서
  - 그가 하는 모든 수고 가운데서
  lexicon: HALOT
  rationale: ‘עָמָל’의 수고/노고 뉘앙스를 살리기 위해 ‘수고’를 택했고, ‘해 아래서’는 전도서의 반복 표현으로 유지했습니다.
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  english_pob_choice: that God has given him
  chosen_korean: 하나님이 그에게 주신
  alternatives_korean:
  - 하나님께서 그에게 주신
  - 하나님이 그에게 주신 바
  lexicon: HALOT
  rationale: 직접적인 소유/부여 관계를 간결하게 옮겼고, 본문 흐름상 ‘그에게’는 앞의 일반적 인간을 가리키는 것으로 읽었습니다.
- source_word: כִּי הוּא חֶלְקֽוֹ
  english_pob_choice: for this is his portion
  chosen_korean: 자기의 몫이 이것이기 때문입니다
  alternatives_korean:
  - 이것이 그의 몫이기 때문입니다
  - 이는 그의 분깃이기 때문입니다
  lexicon: HALOT
  rationale: 전도서에서 반복되는 ‘portion/share’의 의미를 현대어 ‘몫’으로 옮겨, 운명론적 과장이 아닌 하나님이 정하신 분배의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: וְלִרְאוֹת טוֹבָה의 관용적 의미
  chosen_reading: 본문에는 ‘먹고 마시며’로 옮기되, footnote에서 ‘좋은 것을 누리다/경험하다’의 가능성을 밝혔습니다.
  alternative_readings:
  - ‘좋음을 보다’
  - ‘좋은 것을 누리다’
  rationale: 히브리어는 문자적으로 ‘좋음을 보다’이므로, 한국어 본문은 자연성을 위해 풀어 쓰되 원문의 관용적 표현은 각주로 보존하는 편이 문맥과 주해 모두에 유익합니다.
  doctrine_reference: Translation philosophy §3, §5
