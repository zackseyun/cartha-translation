source:
  edition: WLC
  text: כִּ֣י בְ/רֹ֤ב חֲלֹמוֹת֙ וַ/הֲבָלִ֔ים וּ/דְבָרִ֖ים הַרְבֵּ֑ה כִּ֥י אֶת הָ/אֱלֹהִ֖ים יְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/006.yaml
  text: For in many dreams and vanities there are also many words[b][a]; but fear God.
  footnotes:
  - marker: a
    text: Or 'For in many dreams there are also vanities and many words; but fear God.' The Hebrew is elliptical, and the second 'for' may function contrastively or inferentially.
    reason: alternative_reading
  - marker: b
    text: '''Vanities'' renders the plural of hebel, Ecclesiastes'' recurring term for what is fleeting, insubstantial, or empty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 꿈이 많고 헛됨이 많으면 말도 많아집니다[b][a]. 그러나 하나님을 두려워하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략이 있는 압축문으로, 두 번째 כִּי의 기능은 ‘그러나/그리하여’처럼 대조적이거나 추론적인 연결로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘헛됨’은 전도서의 반복어 הבל을 옮긴 말로, 덧없음·공허함·무의미함의 뉘앙스를 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרֹב חֲלֹמוֹת
  english_pob_choice: in many dreams
  chosen_korean: 꿈이 많고
  alternatives_korean:
  - 많은 꿈이
  - 꿈들이 많아
  lexicon: HALOT
  rationale: בְרֹב는 ‘많음/풍성함’을 나타내므로, 한국어에서는 자연스럽게 ‘꿈이 많고’로 풀어 압축된 병렬 구조를 살렸습니다.
- source_word: וַהֲבָלִים
  english_pob_choice: vanities
  chosen_korean: 헛됨이
  alternatives_korean:
  - 허무가
  - 헛된 것들이
  - 허무한 것들이
  lexicon: HALOT
  rationale: 전도서의 핵심어 הבל을 기존 문맥과 연결되도록 ‘헛됨’으로 옮겼고, 복수형의 누적성을 살리기 위해 조사 구조를 유지했습니다.
- source_word: וּדְבָרִים הַרְבֵּה
  english_pob_choice: and many words
  chosen_korean: 말도 많아집니다
  alternatives_korean:
  - 말도 많습니다
  - 많은 말도 있습니다
  - 말이 많이 생깁니다
  lexicon: HALOT
  rationale: 직역하면 ‘많은 말’이지만, 문맥상 지혜문학의 압축된 관찰을 한국어 자연문으로 옮기기 위해 ‘말도 많아집니다’로 처리했습니다.
- source_word: יְרָא־
  english_pob_choice: fear
  chosen_korean: 두려워하십시오
  alternatives_korean:
  - 경외하십시오
  - 두려워하시오
  - 두려워하십시오
  lexicon: HALOT
  rationale: 지혜문맥의 ירא는 단순 감정이 아니라 하나님 앞의 경외와 복종을 포함하지만, 본문의 직접적 명령성을 살려 ‘두려워하십시오’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 생략된 연결과 대조적 כִּי의 처리
  chosen_reading: 앞절의 관찰을 이어 받아 결론 명령으로 전환하는 형태로, ‘그러나’로 연결했습니다.
  alternative_readings:
  - 왜냐하면
  - 그리하여
  - 실로
  rationale: 두 번째 כִּי는 단순 원인 접속이라기보다 관찰에서 권면으로 넘어가는 대조·추론 기능이 강하므로, 한국어에서는 ‘그러나’가 문맥의 긴장을 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
