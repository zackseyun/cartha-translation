  text: It is better that you should not vow than that you should vow and not fulfill it[a].
  footnotes:
  - marker: a
    text: Or, more literally, 'and not pay.' Here 'pay' refers to paying or fulfilling a vow.
    reason: lexical_alternative
translation:
  language: ko
  text: 서원하지 않는 것이, 서원하고서 그것을 이행하지 않는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘갚지 않는 것’ 또는 ‘지불하지 않는 것’입니다. 여기서 이 말은 서원을 이행하는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is better
  chosen_korean: 더 좋습니다
  alternatives_korean:
  - 좋습니다
  - 더 낫습니다
  lexicon: HALOT
  rationale: 비교 평가를 나타내는 טוֹב의 관용적 의미를 한국어에서 자연스러운 비교 표현으로 옮겼습니다.
- source_word: לֹא תִדֹּר
  english_pob_choice: you should not vow
  chosen_korean: 소원을 아예 하지 않는 것이
  alternatives_korean:
  - 서원을 하지 않는 것이
  - 맹세하지 않는 것이
  lexicon: HALOT
  rationale: נדר는 문맥상 하나님께 드리는 서원/소원으로, 여기서는 발화의 실천 가능성을 강조하는 표현으로 옮겼습니다.
- source_word: תְשַׁלֵּם
  english_pob_choice: fulfill it
  chosen_korean: 이행하지 않는 것
  alternatives_korean:
  - 갚지 않는 것
  - 완수하지 않는 것
  - 지키지 않는 것
  lexicon: HALOT
  rationale: שלם의 ‘지불하다/이행하다’ 의미가 서원 문맥에서 ‘이행하다’로 자연스럽게 드러나므로, 약속을 지키지 못하는 뜻을 살렸습니다.
theological_decisions:
- issue: 서원의 성격을 한국어로 어떻게 드러낼지
  chosen_reading: ‘소원’과 ‘이행하다’의 짝으로, 서원은 단순한 말이 아니라 하나님 앞에서 실행을 요구하는 약속임을 드러냈습니다.
  alternative_readings:
  - ‘서원’으로 직접 고정하기
  - ‘맹세’로 일반화하기
  rationale: 히브리어 נדר의 핵심은 하나님께 드리는 의무적 약속이므로, 한국어에서 지나치게 일상적인 ‘약속’으로 약화시키지 않으면서도 문맥의 압박을 살렸습니다.
  doctrine_reference: 서원/헌신의 책임에 대한 잠언적 지혜 전승
