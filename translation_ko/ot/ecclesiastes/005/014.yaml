  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
  footnotes:
  - marker: a
    text: Or, 'and he will carry away nothing from his toil that he can carry in his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 어머니의 태에서 나왔을 때처럼 벌거벗은 채로, 왔을 때 그대로 다시 갈 것입니다. 그는 자기 수고로 얻은 것 가운데 손에 들고 갈 수 있는 것은 아무것도 가져가지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “그는 자기 수고에서 자기 손에 들고 갈 수 있는 것은 아무것도 가져가지 못할 것입니다.”
    reason: lexical_alternative
lexical_decisions:
