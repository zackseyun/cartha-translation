  naturalness: ‘그가 어머니의 태에서 나왔을 때와 같이’는 주어와 시간 표현이 다소 장황하고, ‘와서 그대로 가듯이 돌아갈 것입니다’는 의미 관계가 불분명합니다. 출생과 떠남의 대응을 한국어의 병행 표현으로 간명하게 정리할 필요가 있습니다.
  terminology: ‘어머니의 태’, ‘벌거벗은 채’, ‘수고’는 본문의 구체성과 문체에 적절합니다. 다만 ‘수고에서’보다는 문맥상 ‘수고로 얻은 것 가운데’가 자연스럽고, 직역 가능성은 각주로 보존하는 것이 좋습니다.
