theological_decisions:
- issue: 인생의 출발과 종말을 대비하는 지혜문학의 진술
  chosen_reading: 출생 때와 죽음 때의 상태가 서로 대응하며, 인간은 자기 수고의 결과를 영구히 소유하지 못한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순한 허무주의 선언으로 약화시키는 읽기
  - 도덕적 경구로만 좁히는 읽기
  rationale: 히브리어 병행 구조가 출생과 귀환의 대응을 강하게 말하므로, 이를 보존해 인간의 유한성과 소유의 한계를 드러냈습니다.
  doctrine_reference: 전도서의 지혜적 인간 이해
