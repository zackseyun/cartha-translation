- from: 그가 어머니의 태에서 나왔을 때와 같이, 벌거벗은 채로 돌아가며, 와서 그대로 가듯이 돌아갈 것입니다. 그리고 자기가 손에 들 수 있는 아무것도 자기 수고에서 가져가지 못할 것입니다.[a]
  to: 그는 어머니의 태에서 나왔을 때처럼 벌거벗은 채로, 왔을 때 그대로 다시 갈 것입니다. 그는 자기 수고로 얻은 것 가운데 손에 들고 갈 수 있는 것은 아무것도 가져가지 못할 것입니다.[a]
  rationale: 출생과 죽음의 대응을 이루는 히브리어의 비교와 병행을 ‘나왔을 때처럼 … 왔을 때 그대로 다시 갈 것입니다’로 자연스럽게 보존했습니다. 마지막 절은 수고의 결과를 죽음 때 가지고 갈 수 없다는 문맥적 뜻을 명료하게 옮겼으며, 히브리어 전치사구에 가까운 표현은 각주에 직역으로 남겼습니다. 해석적·교리적 확대는 하지 않았습니다.
