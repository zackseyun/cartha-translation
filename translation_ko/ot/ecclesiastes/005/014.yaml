base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/014.yaml
  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
  footnotes:
  - marker: a
    text: Or, 'and he will carry away nothing from his toil that he can carry in his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 어머니의 태에서 나왔을 때와 같이, 벌거벗은 채로 돌아가며, 와서 그대로 가듯이 돌아갈 것입니다. 그리고 자기가 손에 들 수 있는 아무것도 자기 수고에서 가져가지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 자기 수고에서 자기 손에 들 수 있는 아무것도 가져가지 못할 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר / כְּשֶׁבָּא
  english_pob_choice: As ... as he came
  chosen_korean: '...와 같이, ... 그대로'
  alternatives_korean:
  - '...처럼, ...처럼'
  - '...한 것같이, ...한 그대로'
  lexicon: HALOT
  rationale: 비교 구문을 자연스럽게 살리면서, 출생과 귀환의 대응 관계를 분명하게 드러내기 위해 '와 같이'와 '그대로'를 사용했습니다.
- source_word: יָצָא מִבֶּטֶן אִמּוֹ
  english_pob_choice: he came from his mother’s womb
  chosen_korean: 어머니의 태에서 나왔을 때
  alternatives_korean:
  - 어머니의 배에서 나왔을 때
  - 어머니의 태를 벗어났을 때
  lexicon: HALOT
  rationale: 출생의 구체적 이미지를 보존하기 위해 '태'를 택했고, 동사는 관용적으로 자연한 '나왔을 때'로 옮겼습니다.
- source_word: עָרוֹם
  english_pob_choice: naked
  chosen_korean: 벌거벗은 채로
  alternatives_korean:
  - 나체로
  - 벌거숭이로
  lexicon: HALOT
  rationale: 죽음과 출생의 철저한 무소유를 드러내는 문자적 뜻을 유지하기 위해 직설적으로 옮겼습니다.
- source_word: וּמְאוּמָה לֹא יִשָּׂא בַעֲמָלוֹ
  english_pob_choice: he will carry away nothing from his labor
  chosen_korean: 자기가 손에 들 수 있는 아무것도 자기 수고에서 가져가지 못할 것입니다
  alternatives_korean:
  - 자기 수고에서 아무것도 가져가지 못할 것입니다
  - 손에 들 만한 아무것도 수고에서 가져가지 못할 것입니다
  lexicon: HALOT
  rationale: POB의 해설처럼 '손에 들 수 있는'이라는 구체적 제한을 살려, המְאוּמָה의 전면적 부정을 한국어에서 자연스럽게 강조했습니다.
theological_decisions:
- issue: 인생의 출발과 종말을 대비하는 지혜문학의 진술
  chosen_reading: 출생 때와 죽음 때의 상태가 서로 대응하며, 인간은 자기 수고의 결과를 영구히 소유하지 못한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순한 허무주의 선언으로 약화시키는 읽기
  - 도덕적 경구로만 좁히는 읽기
  rationale: 히브리어 병행 구조가 출생과 귀환의 대응을 강하게 말하므로, 이를 보존해 인간의 유한성과 소유의 한계를 드러냈습니다.
  doctrine_reference: 전도서의 지혜적 인간 이해
