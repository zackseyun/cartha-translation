theological_decisions:
- issue: ‘어둠’의 의미
  chosen_reading: 직역 이미지를 유지하되, 삶 전체가 빛과 기쁨이 결여된 상태라는 함의를 자연스럽게 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘우울 속에서’처럼 해석을 앞세우는 번역
  - 완전히 문자적으로 ‘어둠 가운데서’만 옮기는 번역
  rationale: 전도서의 압축된 시적 표현은 물리적 어둠과 비참한 삶의 상태를 함께 암시하므로, 한국어에서도 이미지와 비유를 함께 살리는 것이 적절합니다.
  doctrine_reference: 전도서의 지혜문학적 은유 이해
- issue: ‘번민/병/분노’의 병렬
  chosen_reading: 세 개의 명사를 나란히 두어 삶의 지속적 고통과 내적 격앙을 그대로 보존했습니다.
  alternative_readings:
  - 술어화하여 풀어 쓰는 번역
  - 세 항목을 하나의 포괄적 표현으로 합치는 번역
  rationale: 히브리어의 압축된 명사열은 고통의 중첩을 강조하므로, 이를 평탄화하지 않고 한국어에서도 병렬 구조로 살렸습니다.
  doctrine_reference: 문학적 평행법과 어휘 중첩 보존
