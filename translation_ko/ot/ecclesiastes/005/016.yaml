translation:
  language: ko
  text: 또한 그는 평생 어둠 속에서[b] 먹고, 많은 번민[a]과 병과 분노를 겪습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 압축된 표현은 ‘번민’ 외에 ‘괴로움’이나 ‘근심’으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어둠 속에서’는 문자적 어둠일 수도 있고, 빛이 없는 비참한 삶을 가리키는 비유일 수도 있습니다.
    reason: lexical_alternative
