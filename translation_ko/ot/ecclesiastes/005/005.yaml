id: ECC.5.5
reference: Ecclesiastes 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּתֵּ֤ן אֶת פִּ֨י/ךָ֙ לַ/חֲטִ֣יא אֶת בְּשָׂרֶ֔/ךָ וְ/אַל תֹּאמַר֙ לִ/פְנֵ֣י הַ/מַּלְאָ֔ךְ כִּ֥י שְׁגָגָ֖ה הִ֑יא לָ֣/מָּה יִקְצֹ֤ף הָֽ/אֱלֹהִים֙ עַל קוֹלֶ֔/ךָ וְ/חִבֵּ֖ל אֶת מַעֲשֵׂ֥ה יָדֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/005.yaml
  text: Do not let your mouth cause your flesh to sin[a], and do not say before the messenger, “It was a mistake.” Why should God be angry at your voice and destroy the work of your hands?
  footnotes:
  - marker: a
    text: Or “the angel.” The Hebrew מַלְאָךְ can refer to either a human messenger or a heavenly messenger.
    reason: alternative_reading
translation:
  language: ko
  text: 입을 함부로 놀려서 자기 육체가 죄를 짓게 하지 마십시오. 그리고 사자 앞에서 “실수였습니다”라고 말하지 마십시오. 왜 하나님께서 당신의 말에 노하셔서 당신 손의 일을 멸하시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “천사.” 히브리어 מַלְאָךְ는 인간 사자나 하늘 사자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּ֤ן אֶת פִּ֨י/ךָ֙
  english_pob_choice: let your mouth
  chosen_korean: 입을 함부로 놀려서
  alternatives_korean:
  - 입을 주어서
  - 당신의 입이 하게 해서
  - 입으로 말하게 해서
  lexicon: HALOT
  rationale: 히브리어의 ‘입을 주다’는 한국어에서 자연스럽지 않으므로, 방종하게 말을 내뱉는 뉘앙스를 살려 ‘입을 함부로 놀려서’로 옮겼습니다.
- source_word: לַ/חֲטִ֣יא אֶת בְּשָׂרֶ֔/ךָ
  english_pob_choice: cause your flesh to sin
  chosen_korean: 자기 육체가 죄를 짓게 하지 마십시오
  alternatives_korean:
  - 당신의 육체를 죄 짓게 하지 마십시오
  - 당신의 몸이 죄를 짓게 하지 마십시오
  - 당신의 육체를 죄로 끌어들이지 마십시오
  lexicon: HALOT
  rationale: 사역형의 인과를 살리면서도, 전도서의 구체적·육체적 표현을 반영해 ‘육체’와 ‘죄를 짓게 하다’를 유지했습니다.
- source_word: הַ/מַּלְאָ֔ךְ
  english_pob_choice: the messenger
  chosen_korean: 사자
  alternatives_korean:
  - 메신저
  - 천사
  - 전달자
  lexicon: HALOT
  rationale: מלאך는 문맥에 따라 인간 사자나 천사를 뜻할 수 있어, 한국어에서도 중립적으로 읽히는 ‘사자’를 택해 본문의 해석 여지를 보존했습니다.
- source_word: שְׁגָגָ֖ה הִ֑יא
  english_pob_choice: It was a mistake
  chosen_korean: 실수였습니다
  alternatives_korean:
  - 잘못이었습니다
  - 부주의였습니다
  - 의도치 않은 일이었습니다
  lexicon: HALOT
  rationale: 명사 שְׁגָגָה는 실수·부주의로 인한 잘못을 가리키므로, 자연스럽고 완곡한 변명조를 살려 ‘실수였습니다’로 옮겼습니다.
- source_word: קוֹלֶ֔/ךָ
  english_pob_choice: your voice
  chosen_korean: 당신의 말
  alternatives_korean:
  - 당신의 목소리
  - 당신의 소리
  - 당신의 발언
  lexicon: HALOT
  rationale: 직역하면 ‘목소리’이지만 여기서는 서원과 변명을 포함한 발화를 가리키므로, 의미를 드러내는 ‘말’로 옮겼습니다.
- source_word: וְ/חִבֵּ֖ל
  english_pob_choice: destroy
  chosen_korean: 멸하시겠습니까
  alternatives_korean:
  - 망하게 하시겠습니까
  - 무너뜨리시겠습니까
  - 해치시겠습니까
  lexicon: HALOT
  rationale: 하나님의 심판적 행위를 강조하는 동사이므로, 결과의 강도를 분명히 하는 ‘멸하다’로 옮겼습니다.
- source_word: מַעֲשֵׂ֥ה יָדֶֽי/ךָ
  english_pob_choice: the work of your hands
  chosen_korean: 당신 손의 일
  alternatives_korean:
  - 당신 손의 수고
  - 당신이 손으로 한 일
  - 당신의 손으로 지은 것
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 풀되, 노동의 결과물을 뜻하는 표현성을 살려 ‘당신 손의 일’로 옮겼습니다.
theological_decisions:
- issue: הַמַּלְאָךְ의 정체를 한국어에서 어떻게 보존할지
  chosen_reading: 사자
  alternative_readings:
  - 천사
  - 메신저
  rationale: 본문은 서원 문제를 다루는 상황에서 인간 사자를 가리킬 가능성도, 천사를 가리킬 가능성도 완전히 닫지 않습니다. 한국어 본문에서는 해석을 과도하게 고정하지 않도록 중립적인 ‘사자’를 사용했습니다.
  doctrine_reference: '번역 원칙 §3: 본문이 허용하는 해석 긴장을 보존한다'
