  - 당신의 몸이 죄를 짓게 하지 마십시오
  - 당신의 육체를 죄로 끌어들이지 마십시오
  lexicon: HALOT
  rationale: 사역형의 인과를 살리면서도, 전도서의 구체적·육체적 표현을 반영해 ‘육체’와 ‘죄를 짓게 하다’를 유지했습니다.
- source_word: הַ/מַּלְאָ֔ךְ
  english_pob_choice: the messenger
  chosen_korean: 사자
  alternatives_korean:
  - 메신저
  - 천사
  - 전달자
  lexicon: HALOT
  rationale: מלאך는 문맥에 따라 인간 사자나 천사를 뜻할 수 있어, 한국어에서도 중립적으로 읽히는 ‘사자’를 택해 본문의 해석 여지를 보존했습니다.
- source_word: שְׁגָגָ֖ה הִ֑יא
  english_pob_choice: It was a mistake
