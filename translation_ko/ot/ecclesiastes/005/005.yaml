  source_fidelity: 초안은 לַחֲטִיא의 사역 의미와 מַלְאָךְ의 대안적 의미를 대체로 보존합니다. 그러나 ‘입을 함부로 놀려서’는 원문의 단순한 금지보다 ‘함부로’라는 평가를 더하며, ‘사자’는 현대 한국어에서 비성서적 의미(특히 동물)를 우선 연상시킬 수 있습니다. 또한 각주 표지는 대안이 걸리는 ‘사자’ 바로 뒤에 놓는 편이 정확합니다.
  naturalness: ‘입을 내버려 두어’는 히브리어 관용을 지나치게 의역하지 않으면서 현대 한국어로 자연스럽게 전달합니다. ‘전령’은 합쇼체 본문에서 자연스럽고, ‘당신의 손으로 한 일’과 ‘망치시겠습니까’도 이해하기 쉽습니다.
