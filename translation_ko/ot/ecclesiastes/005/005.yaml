  lexicon: HALOT
  rationale: 명사 שְׁגָגָה는 실수·부주의로 인한 잘못을 가리키므로, 자연스럽고 완곡한 변명조를 살려 ‘실수였습니다’로 옮겼습니다.
- source_word: קוֹלֶ֔/ךָ
  english_pob_choice: your voice
  chosen_korean: 당신의 말
  alternatives_korean:
  - 당신의 목소리
  - 당신의 소리
  - 당신의 발언
  lexicon: HALOT
  rationale: 직역하면 ‘목소리’이지만 여기서는 서원과 변명을 포함한 발화를 가리키므로, 의미를 드러내는 ‘말’로 옮겼습니다.
- source_word: וְ/חִבֵּ֖ל
  english_pob_choice: destroy
  chosen_korean: 멸하시겠습니까
