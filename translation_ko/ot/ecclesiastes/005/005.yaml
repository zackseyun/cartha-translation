  lexicon: HALOT
  rationale: 히브리어의 ‘입을 주다’는 한국어에서 자연스럽지 않으므로, 방종하게 말을 내뱉는 뉘앙스를 살려 ‘입을 함부로 놀려서’로 옮겼습니다.
- source_word: לַ/חֲטִ֣יא אֶת בְּשָׂרֶ֔/ךָ
