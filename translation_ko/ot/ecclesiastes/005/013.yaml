  - marker: b
    text: Literally, 'and there is nothing in his hand,' an idiom meaning he possesses nothing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 재산은 불운한 일로 잃게 되었고[b], 그는 아들을 얻었는데 그의 손에는 아무것도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 손에 아무것도 없다’는 뜻으로, 그가 아무것도 소유하지 못함을 나타내는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불운한 일’은 해로운 사업이나 불행한 사건을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד הָעֹשֶׁר הַהוּא
  english_pob_choice: And that wealth was lost
  chosen_korean: 그 재산은 … 사라지고
  alternatives_korean:
  - 그 부는 … 잃고
  - 그 재물은 … 없어지고
  lexicon: HALOT
  rationale: עֹשֶׁר는 일반적으로 ‘재산/부’의 뜻이므로 자연스러운 현대 한국어 ‘재산’으로 옮겼고, וְאָבַד는 소실의 결과를 살려 ‘사라지고’로 처리했습니다.
- source_word: בְּעִנְיַן רָע
  english_pob_choice: in a bad venture
  chosen_korean: 나쁜 거래에서
  alternatives_korean:
  - 나쁜 사업에서
  - 불운한 일로
  - 해로운 일로
  lexicon: HALOT
  rationale: עִנְיָן은 전도서 문맥에서 ‘일, 일거리, 거래, 일의 형편’처럼 폭넓게 쓰이므로, 재산 손실의 경제적 맥락을 살려 ‘거래’로 옮겼습니다.
- source_word: וְהוֹלִיד בֵּן
  english_pob_choice: and he fathered a son
  chosen_korean: 아들을 낳았으나
  alternatives_korean:
  - 아들을 두었으나
  - 아들을 낳았고
  lexicon: HALOT
  rationale: הוֹלִיד는 ‘낳다/자녀를 두다’의 의미이므로, 서술의 흐름을 살려 ‘아들을 낳았으나’로 자연스럽게 옮겼습니다.
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  english_pob_choice: and had nothing in his hand
  chosen_korean: 그의 손에는 아무것도 남지 않았습니다
  alternatives_korean:
  - 그의 손에는 아무것도 없었습니다
  - 그는 아무것도 가지고 있지 않았습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 손에 아무것도 없다’이지만, 한국어에서는 소유 부재를 자연스럽게 드러내는 ‘아무것도 남지 않았다’가 관용구를 더 분명히 반영합니다.
