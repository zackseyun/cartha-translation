  yaml_path: translation/ot/ecclesiastes/005/013.yaml
  text: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
  footnotes:
  - marker: a
    text: Or 'through a grievous business matter' or 'in an unfortunate affair.' The Hebrew phrase can denote a harmful enterprise or circumstance.
