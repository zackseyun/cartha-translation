base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/002.yaml
  text: 'All is the same for all: one fate comes to the righteous and to the wicked[a], to the good and to the clean and to the unclean, to the one who sacrifices and to the one who does not sacrifice; as the good one, so the sinner[b]; the one who swears is as the one who fears an oath.'
  footnotes:
  - marker: a
    text: Or 'one event' or 'the same destiny.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the one who is afraid to swear.'
    reason: alternative_reading
translation:
  language: ko
  text: 모든 것이 모든 사람에게 똑같습니다. 의인에게나 악인에게나, 선한 자에게나 깨끗한 자에게나 더러운 자에게나, 제사하는 자에게나 제사하지 않는 자에게나 하나의 운명이 닥칩니다. 선한 사람이나 죄인이나 같으며, 맹세하는 사람이나 맹세를 두려워하는 사람이나 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 사건’ 혹은 ‘같은 운명’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘맹세하기를 두려워하는 사람’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל / כַּאֲשֶׁר לַכֹּל
  english_pob_choice: All is the same for all
  chosen_korean: 모든 것이 모든 사람에게 똑같습니다
  alternatives_korean:
  - 모든 것이 모두에게 같습니다
  - 모든 것은 모든 이에게 동일합니다
  lexicon: WLC + POB audit trail
  rationale: 서두의 총괄 진술을 자연스러운 합쇼체로 살리되, 히브리어의 압축된 비교 구조가 말하는 ‘보편적 동일성’을 분명히 드러냈습니다.
- source_word: מִקְרֶה אֶחָד
  english_pob_choice: one fate
  chosen_korean: 하나의 운명이 닥칩니다
  alternatives_korean:
  - 하나의 일이 닥칩니다
  - 같은 운명이 닥칩니다
  - 한 사건이 닥칩니다
  lexicon: HALOT
  rationale: 전도서의 מִקְרֶה는 단순한 ‘사건’보다 인간에게 닥치는 결과를 가리키므로, 문맥에 맞게 ‘운명’으로 옮기되 ‘닥칩니다’로 도래성을 살렸습니다.
- source_word: לַטָּהוֹר וְלַטָּמֵא
  english_pob_choice: to the clean and to the unclean
  chosen_korean: 깨끗한 자에게나 더러운 자에게나
  alternatives_korean:
  - 정결한 자에게나 부정한 자에게나
  - 깨끗한 사람에게나 더러운 사람에게나
  lexicon: HALOT
  rationale: 정결/부정의 의례적 대비를 유지하되, 한국어에서 직관적인 ‘깨끗한/더러운’으로 옮겨 본문의 폭넓은 대조를 보존했습니다.
- source_word: לַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ
  english_pob_choice: to the one who sacrifices and to the one who does not sacrifice
  chosen_korean: 제사하는 자에게나 제사하지 않는 자에게나
  alternatives_korean:
  - 희생제사를 드리는 사람에게나 드리지 않는 사람에게나
  - 제물을 바치는 자에게나 바치지 않는 자에게나
  lexicon: HALOT
  rationale: 동사적 분사를 한국어 관계절로 풀어 제사 행위의 대비를 분명히 했습니다. ‘제사’는 본문의 제의적 성격을 가장 सीधे하게 드러냅니다.
- source_word: הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא
  english_pob_choice: the one who swears is as the one who fears an oath
  chosen_korean: 맹세하는 사람이나 맹세를 두려워하는 사람이나 같습니다
  alternatives_korean:
  - 맹세하는 사람은 맹세를 두려워하는 사람과 같습니다
  - 맹세하는 사람이나 맹세를 경외하는 사람이나 같습니다
  lexicon: HALOT
  rationale: 마지막 평행구의 핵심은 맹세 행위와 맹세에 대한 두려움의 병치이므로, POB의 모호성을 살려 ‘두려워하는’으로 유지했습니다.
theological_decisions:
- issue: מִקְרֶה אֶחָד의 신학적 뉘앙스
  chosen_reading: one fate / 하나의 운명
  alternative_readings:
  - one event / 하나의 사건
  - the same destiny / 같은 운명
  rationale: 전도서는 인간 삶의 공통 결말을 관찰적으로 진술하므로, 여기서는 결정론을 덧씌우기보다 모든 계층에 동일하게 닥치는 결과를 담담하게 표현하는 쪽이 본문에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 정결/부정 범주의 유지
  chosen_reading: 깨끗한/더러운
  alternative_readings:
  - 정결한/부정한
  - 순결한/불결한
  rationale: 히브리어의 대조가 도덕 범주와 제의 범주를 모두 포괄할 수 있으므로, 한국어에서도 그 긴장을 풀어버리지 않고 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3
