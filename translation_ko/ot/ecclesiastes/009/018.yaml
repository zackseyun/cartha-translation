  yaml_path: translation/ot/ecclesiastes/009/018.yaml
  text: Wisdom is better than weapons of war[a], but one sinner destroys much good.
  footnotes:
  - marker: a
    text: Or 'and one sinner destroys much good.' The Hebrew conjunction can be read simply as 'and,' but the sense in context is contrastive.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜가 전쟁의 무기보다 더 낫습니다[a]. 그러나 한 죄인이 많은 선을 무너뜨립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 한 죄인이 많은 선을 무너뜨립니다.’로도 읽을 수 있습니다. 히브리어 접속사는 단순한 ‘그리고’일 수 있지만, 문맥상 대조의 뜻이 분명합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹבָה
  english_pob_choice: better
  chosen_korean: 더 낫습니다
  alternatives_korean:
  - 좋습니다
  - 더 좋습니다
  lexicon: HALOT
  rationale: 비교 구문 מִ/כְּ와 함께 쓰여 단순한 ‘좋다’가 아니라 비교급의 뜻이 분명하므로, 자연스러운 현대 한국어로 ‘더 낫습니다’라고 옮겼습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지식
  - 슬기
  lexicon: HALOT
  rationale: 전도서에서 반복되는 חָכְמָה의 핵심 의미를 살려 표준적인 ‘지혜’로 번역했습니다.
- source_word: מִכְּלֵי קְרָב
  english_pob_choice: than weapons of war
  chosen_korean: 전쟁의 무기보다
  alternatives_korean:
  - 전투 도구보다
  - 전쟁용 무기보다
  lexicon: HALOT
  rationale: כְּלֵי는 ‘도구/기구/무기류’를 가리키고 קְרָב은 전투를 뜻하므로, 현대 한국어로는 군사적 의미가 자연하게 드러나는 ‘전쟁의 무기’가 적절합니다.
- source_word: וְחוֹטֶא אֶחָד
  english_pob_choice: but one sinner
  chosen_korean: 그러나 한 죄인이
  alternatives_korean:
  - 그리고 한 죄인이
  - 한 죄인이
  lexicon: HALOT
  rationale: 접속사 וְ는 형식상 ‘그리고’지만 문맥상 대조가 분명하므로 한국어 담화 기능에 맞게 ‘그러나’로 풀었고, חוֹטֶא는 명사적 분사로서 ‘죄인’이 적절합니다.
- source_word: יְאַבֵּד טוֹבָה הַרְבֵּה
  english_pob_choice: destroys much good
  chosen_korean: 많은 선을 무너뜨립니다
  alternatives_korean:
  - 많은 좋은 것을 파괴합니다
  - 큰 선을 망가뜨립니다
  lexicon: HALOT
  rationale: יְאַבֵּד은 단순 소멸보다 ‘파괴/망침’의 강한 의미가 있어 ‘무너뜨립니다’로 옮겼고, טוֹבָה הַרְבֵּה는 결과적 유익을 포괄하는 ‘많은 선’으로 번역했습니다.
theological_decisions:
- issue: 접속사 וְ의 처리
  chosen_reading: 첫 절은 비교 진술로, 두 번째 절은 문맥상 대조적 경고로 읽었습니다.
  alternative_readings:
  - ‘그리고 한 죄인이 많은 선을 무너뜨립니다’처럼 단순 병렬로 읽을 수 있음
  rationale: 히브리어 וְ는 형식상 단순 접속사이지만, 전도서 9:18의 문맥에서는 지혜의 가치와 죄인의 파괴력을 대비하는 경구 구조가 더 분명합니다.
  doctrine_reference: 담화 관계/문맥적 번역 원칙
