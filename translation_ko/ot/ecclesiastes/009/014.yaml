id: ECC.9.14
reference: Ecclesiastes 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִ֣יר קְטַנָּ֔ה וַ/אֲנָשִׁ֥ים בָּ֖/הּ מְעָ֑ט וּ/בָֽא אֵלֶ֜י/הָ מֶ֤לֶךְ גָּדוֹל֙ וְ/סָבַ֣ב אֹתָ֔/הּ וּ/בָנָ֥ה עָלֶ֖י/הָ מְצוֹדִ֥ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/014.yaml
  text: There was a small city[a], and few men were in it; and a great king came against it, surrounded it, and built great siegeworks against it.
  footnotes:
  - marker: a
    text: Or 'built great bulwarks against it' or 'built great siege ramps against it.' The Hebrew מְצוֹדִים can refer more broadly to siege structures or fortifications.
    reason: lexical_alternative
translation:
  language: ko
  text: 작은 성읍이 하나 있었는데, 그 안에는 사람이 얼마 없었습니다. 큰 왕이 그 성읍을 향해 와서 그것을 둘러싸고, 그 위에 큰 포위 시설들을 쌓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְצוֹדִים은 여기서 성을 포위하기 위한 구조물이나 공성 시설을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר קְטַנָּה
  english_pob_choice: a small city
  chosen_korean: 작은 성읍
  alternatives_korean:
  - 작은 도시
  - 조그만 성읍
  lexicon: HALOT
  rationale: עִיר는 일반적인 ‘성읍/도시’인데, 한국어 성서 문체에서는 ‘성읍’이 더 자연스럽고 고전적 의미도 살릴 수 있습니다. קְטַנָּה의 단순한 크기 표현은 ‘작은’으로 옮겼습니다.
- source_word: וַאֲנָשִׁים בָּהּ מְעָט
  english_pob_choice: and few men were in it
  chosen_korean: 그 안에는 사람이 얼마 없었습니다
  alternatives_korean:
  - 그 안에는 남자들이 얼마 없었습니다
  - 그 안에는 사람들이 얼마 없었습니다
  lexicon: HALOT
  rationale: אֲנָשִׁים의 문자형은 남성 복수이지만, 한국어에서는 ‘사람’이 자연스럽고 성읍 안의 인구가 적다는 뜻을 분명히 전달합니다. 다만 남성형을 굳이 드러내는 번역은 문맥상 필요하지 않아 더 직접적인 표현을 택했습니다.
- source_word: מְצוֹדִים גְּדֹלִים
  english_pob_choice: great siegeworks
  chosen_korean: 큰 포위 시설들
  alternatives_korean:
  - 큰 포위 장치들
  - 큰 축성물들
  - 큰 공성 시설들
  lexicon: HALOT
  rationale: מְצוֹדִים은 포위전 맥락에서 성을 공격하기 위한 공성 구조물을 가리킬 수 있으므로, 기능을 드러내는 ‘포위 시설들’로 옮겼습니다. ‘큰’은 גְּדֹלִים의 규모 강조를 유지합니다.
- source_word: וּבָנָה עָלֶיהָ
  english_pob_choice: and built ... against it
  chosen_korean: 그 위에 큰 포위 시설들을 쌓았습니다
  alternatives_korean:
  - 그것을 향해 큰 포위 시설들을 세웠습니다
  - 그것 위에 큰 포위 진지를 만들었습니다
  lexicon: HALOT
  rationale: בנה는 기본적으로 ‘짓다/쌓다’이므로, 공성 장비를 만드는 장면에서는 ‘쌓았습니다’가 한국어로 더 구체적이고 자연스럽습니다. עַל의 대립적 방향성은 앞의 ‘향해’와 문맥 전체로 반영했습니다.
theological_decisions:
- issue: 포위전 묘사의 직설성
  chosen_reading: 왕이 성읍을 향해 와서 둘러싸고 공성 구조물을 쌓는 장면을 그대로 직설적으로 옮겼습니다.
  alternative_readings:
  - 보다 완곡하게 ‘공격하여 에워쌌습니다’로 약화
  - ‘포위 진지를 구축했습니다’로 군사 용어를 일반화
  rationale: 본문은 지혜문학의 예화로서 긴박한 전쟁 상황을 묘사하므로, 완곡화보다 공성의 압박감을 드러내는 직역적 표현이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 전도서 9장 문맥의 관찰적 지혜 진술
