  rationale: 공성 시설을 도시 ‘위에’ 쌓았다는 공간적 표현을, 도시를 향해 세웠다는 공격적 방향 표현으로 바로잡았습니다. מְצוֹדִים의 정확한 형태가 불확실하므로 본문에서는 포괄적인 ‘공성 시설’로 옮기고, 각주에서 가능한 의미 범위를 밝혔습니다. 나머지 문장은 원문의 작은 성읍, 적은 수의 사람, 강대한 왕, 포위라는 대조와 전개를 보존합니다.
