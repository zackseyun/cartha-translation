  source_fidelity: 핵심 대조인 살아 있는 자의 희망과 죽은 사자의 무가치함은 충실히 반영되었습니다. 다만 본문의 난해한 첫 구절은 영어 POB의 ‘joined to all the living’처럼 살아 있는 자들의 편에 속해 있음을 나타내므로, ‘가운데에 속한’보다 더 자연스러운 표현으로 다듬는 것이 좋습니다.
  naturalness: ‘살아 있는 모든 사람 가운데에 속한 자’는 현대 한국어에서 결합이 다소 어색합니다. ‘살아 있는 모든 이들과 함께 있는 이’는 해당 문맥에서 생존자들의 편에 속해 있다는 뜻을 자연스럽게 전달합니다. 합쇼체 문장도 유지됩니다.
  terminology: ‘희망’, ‘살아 있는 개’, ‘죽은 사자’는 문맥과 잠언적 대조에 잘 맞습니다. ‘안전’은 가능한 어휘 대안이지만 다소 물리적 안전을 연상시킬 수 있으므로 각주에서 ‘확신’ 및 ‘안정’과 함께 제시하는 편이 자연스럽습니다.
