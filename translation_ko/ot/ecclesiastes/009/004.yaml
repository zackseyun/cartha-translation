id: ECC.9.4
reference: Ecclesiastes 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי מִי֙ אֲשֶׁ֣ר יבחר אֶ֥ל כָּל הַ/חַיִּ֖ים יֵ֣שׁ בִּטָּח֑וֹן כִּֽי לְ/כֶ֤לֶב חַי֙ ה֣וּא ט֔וֹב מִן הָ/אַרְיֵ֖ה הַ/מֵּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/004.yaml
  text: For whoever is joined to all the living has hope[b][a], because a living dog is better than a dead lion.
  footnotes:
  - marker: a
    text: Or possibly, 'whoever is chosen among all the living has confidence.' The Hebrew form in the opening clause is difficult, and some understand it differently.
    reason: alternative_reading
  - marker: b
    text: '''Hope'' could also be rendered ''confidence'' or ''security.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 살아 있는 모든 이들과 함께 있는 이에게는 희망이 있기 때문입니다[a][b]. 살아 있는 개가 죽은 사자보다 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살아 있는 모든 이들 가운데 선택된 이’로 옮길 수도 있습니다. 히브리어 첫 절의 형태는 난해하며, 일부는 이를 다르게 이해합니다.
    reason: alternative_reading
  - marker: b
    text: ‘희망’은 ‘확신’ 또는 ‘안정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ בִּטָּחוֹן
  english_pob_choice: has hope
  chosen_korean: 희망이 있습니다
  alternatives_korean:
  - 확신이 있습니다
  - 안전이 있습니다
  - 기대가 있습니다
  lexicon: HALOT
  rationale: בִּטָּחוֹן은 문맥상 단순한 정서가 아니라 살아 있음이 주는 가능성과 여지를 가리키므로, 한국어에서는 가장 자연스럽고 문맥에 맞는 ‘희망’으로 옮겼습니다.
- source_word: אֲשֶׁר יבחר אֶל כָּל הַחַיִּים
  english_pob_choice: whoever is joined to all the living
  chosen_korean: 살아 있는 모든 사람 가운데에 속한 자
  alternatives_korean:
  - 살아 있는 모든 사람과 함께한 자
  - 살아 있는 모든 사람에게 붙어 있는 자
  - 살아 있는 모든 사람 가운데 선택된 자
  lexicon: HALOT
  rationale: 히브리어 첫 절은 표기상 ‘선택되다’로도 읽을 수 있지만, 영어 POB의 판단처럼 문맥은 살아 있는 자들에 속한 상태를 가리키는 쪽이 더 자연스럽습니다. 한국어에서는 ‘속한 자’로 관계성을 살렸습니다.
- source_word: לְכֶלֶב חַי
  english_pob_choice: a living dog
  chosen_korean: 살아 있는 개
  alternatives_korean:
  - 산 개
  - 생존한 개
  lexicon: HALOT
  rationale: 잠언적 대비를 직역에 가깝게 살리기 위해 평이한 현대어인 ‘살아 있는 개’로 옮겼습니다.
- source_word: הָאַרְיֵה הַמֵּת
  english_pob_choice: a dead lion
  chosen_korean: 죽은 사자
  alternatives_korean:
  - 사자처럼 죽은 자
  - 죽어 있는 사자
  lexicon: HALOT
  rationale: 대조 구조를 분명하게 드러내기 위해 히브리어의 단순한 형용사 대구를 그대로 반영했습니다.
theological_decisions:
- issue: 첫 절의 난해한 동사 יבחר의 해석
  chosen_reading: ‘살아 있는 모든 사람 가운데에 속한 자’로 이해하여, 생존 자체가 주는 희망을 강조했습니다.
  alternative_readings:
  - ‘살아 있는 모든 사람 가운데 선택된 자’
  - ‘살아 있는 모든 사람 가운데 확정된 자’
  rationale: 이 구절은 교리적 쟁점보다 문맥적 해석의 문제입니다. 본문은 죽음보다 삶이 가지는 우위를 강조하므로, 선택 개념을 전면화하기보다 살아 있음에 속한 상태를 드러내는 번역이 더 적절합니다.
  doctrine_reference: 전도서 9:4의 문맥적 해석
- issue: 비교 속담의 의미
  chosen_reading: ‘살아 있는 개가 죽은 사자보다 낫습니다’라는 역설적 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘살아 있는 개가 죽은 사자보다 더 유익합니다’
  - ‘산 개가 죽은 사자보다 낫습니다’
  rationale: 표현을 완화하면 본문의 충격과 역설이 약해집니다. 전도자의 의도는 낮은 존재라도 살아 있음이 죽은 위엄보다 낫다는 점을 선명하게 말하는 데 있습니다.
  doctrine_reference: 전도서의 지혜 문학적 역설
