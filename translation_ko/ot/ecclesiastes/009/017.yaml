- source_word: בְּנַחַת נִשְׁמָעִים
  english_pob_choice: are heard in quiet
  chosen_korean: 조용한 가운데서 들리며
  alternatives_korean:
  - 조용히 들리며
  - 평온한 가운데서 들리며
  lexicon: HALOT
  rationale: בְּנַחַת의 명사적 뉘앙스와 נִשְׁמָעִים의 수동적 상태를 함께 살리기 위해, 단순 부사형보다 ‘조용한 가운데서 들리며’로 옮겼습니다.
- source_word: מִזַּעֲקַת
  english_pob_choice: more than the shouting of
  chosen_korean: …보다 낫습니다
  alternatives_korean:
  - …보다 더 크게 들립니다
  - …보다 우월합니다
  lexicon: HALOT
  rationale: 비교 מן의 의미를 한국어에서 자연스러운 우월 비교인 ‘…보다 낫습니다’로 재현해, ‘들려짐’의 정도가 아니라 지혜의 가치 우위를 드러냈습니다.
- source_word: בַּכְּסִילִים
  english_pob_choice: among fools
  chosen_korean: 어리석은 자들 가운데 있는
  alternatives_korean:
  - 어리석은 자들 среди
  - 어리석은 자들 속에 있는
  lexicon: HALOT
  rationale: ב의 장소/연관 용법을 따라 ‘among’을 ‘가운데 있는’으로 옮겨, 지배적 의미의 ‘~위에’가 아니라 동반적 위치를 분명히 했습니다.
theological_decisions:
- issue: 비교문의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: 지혜로운 사람들의 말이 조용한 가운데서 들리며, 통치자의 외침보다 더 낫다고 옮겼습니다.
  alternative_readings:
  - 지혜로운 사람들의 말은 조용히 들리며 통치자의 외침보다 큽니다.
  - 지혜로운 사람들의 말은 조용한 가운데서 들리는 것이 통치자의 외침보다 낫습니다.
  rationale: 히브리어의 비교 구문을 완화하지 않고, 수동적 ‘들리다’와 가치 판단 ‘낫다’를 함께 유지해 본문의 지혜 문학적 대비를 보존했습니다.
  doctrine_reference: 지혜문학의 비교 표현
