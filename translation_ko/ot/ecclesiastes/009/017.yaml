  - 말들에 대해
  lexicon: HALOT
  rationale: דְּבָרִים의 구문상 ‘말/발언’의 복수적 의미를 살리되, 한국어에서는 자연스럽게 주어 역할을 하는 ‘말은’으로 옮겼습니다.
- source_word: חֲכָמִים
