  lexicon: HALOT
  rationale: בְּנַחַת의 명사적 뉘앙스와 נִשְׁמָעִים의 수동적 상태를 함께 살리기 위해, 단순 부사형보다 ‘조용한 가운데서 들리며’로 옮겼습니다.
