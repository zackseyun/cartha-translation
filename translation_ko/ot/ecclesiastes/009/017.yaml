  text: דִּבְרֵ֣י חֲכָמִ֔ים בְּ/נַ֖חַת נִשְׁמָעִ֑ים מִ/זַּעֲקַ֥ת מוֹשֵׁ֖ל בַּ/כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/017.yaml
  text: The words of the wise are heard in quiet more than the shouting of a ruler among fools[a][b].
  footnotes:
  - marker: a
    text: Or 'The words of the wise, heard quietly, are better than the shouting of a ruler among fools.' The Hebrew comparison can be expressed with 'more than' or with an implied sense of superiority ('better than').
    reason: lexical_alternative
  - marker: b
    text: '''Among fools'' may also be understood by some as ''over fools,'' but the preposition more naturally suggests location or association here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 조용히 들리는 지혜로운 이들의 말은 어리석은 자들 가운데 있는 통치자의 외침보다 낫습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 비교는 ‘…보다’의 직접 비교로도, ‘…하는 것이 더 낫다’는 우월 비교로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘어리석은 자들 가운데’는 어떤 경우 ‘어리석은 자들 위에’로 이해되기도 하지만, 여기서 전치사는 위치나 연관을 가리키는 뜻이 더 자연스럽습니다.
    reason: alternative_reading
