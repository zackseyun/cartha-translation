  - 사람들
  - 인자들
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 풀어, 앞의 단수 ‘사람’과 대조되는 집합적 표현임을 살리면서도 현대 한국어에서 어색하지 않게 조정했습니다.
- source_word: לְעֵת רָעָה
  english_pob_choice: at an evil time
