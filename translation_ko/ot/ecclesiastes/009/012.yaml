revisions:
- from: 사람은 자기 때를 알지 못합니다. 악한 그물에 걸리는 물고기처럼, 올무에 잡히는 새들처럼, 사람의 자손도 재앙의 때에 덫에 걸립니다. 그것이 그들에게 갑자기 닥치기 때문입니다.[a][b][c]
  to: 사람은 자기 때조차 알지 못합니다.[a] 물고기가 위험한 그물에 걸리고 새들이 올무에 잡히는 것처럼, 사람들도[b] 갑자기 닥치는 재앙의 때에[c] 덫에 걸립니다.
  rationale: The revision restores the Hebrew intensifier and temporal syntax, resolves the unclear Korean pronoun by incorporating the sudden arrival into the description of the calamitous time, and replaces literal but unnatural expressions with modern formal Korean equivalents. The notes preserve the relevant lexical and idiomatic information without imposing an interpretive theological reading.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:46:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the general imagery and the calamitous sense of לְעֵת רָעָה. However, it omits the intensifier גם (‘even/also’), changes the final temporal clause (‘when it suddenly falls upon them’) into a causal statement (‘because it suddenly comes upon them’), and leaves the antecedent of ‘it’ unclear. The revision restores these elements without over-specifying the feminine antecedent, which is most naturally the ‘time.’
  naturalness: ‘악한 그물’ and especially ‘사람의 자손’ are not idiomatic in modern standard Korean in this context. ‘위험한 그물’ naturally conveys the harmful force of the net, while ‘사람들’ is the normal Korean rendering of the Hebrew collective idiom, with a footnote preserving its literal form. Recasting the closing clause as ‘갑자기 닥치는 재앙의 때’ is natural Korean and retains the temporal force.
  terminology: ‘사람’ appropriately represents the singular generic הָאָדָם. ‘자기 때’ is suitable for עִתּוֹ. ‘올무,’ ‘덫에 걸리다,’ and ‘재앙의 때’ communicate the respective Hebrew images and the contextual sense of רָעָה. Footnotes distinguish the generic singular, the collective idiom, and the literal ‘evil time.’
  issues:
  - severity: medium
    issue: 'The final clause is rendered causally: ‘그것이 그들에게 갑자기 닥치기 때문입니다.’'
    rationale: כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם is a temporal clause, ‘when it suddenly falls upon them,’ not a reason introduced by ‘because.’
  - severity: medium
    issue: ‘악한 그물’ is overly literal and unnatural in Korean.
    rationale: Here רָעָה describes the net as harmful or deadly rather than morally evil. ‘위험한 그물’ is idiomatic while preserving the destructive sense.
  - severity: medium
    issue: ‘사람의 자손’ is unnatural as a designation for humanity in modern Korean.
    rationale: בְּנֵי הָאָדָם is a Hebrew collective idiom. ‘사람들’ is natural Korean; the literal form can be retained in a footnote.
  - severity: low
    issue: The intensifying גם is not represented.
    rationale: ‘자기 때조차’ appropriately conveys ‘does not even know his time.’
  revised_text: 사람은 자기 때조차 알지 못합니다.[a] 물고기가 위험한 그물에 걸리고 새들이 올무에 잡히는 것처럼, 사람들도[b] 갑자기 닥치는 재앙의 때에[c] 덫에 걸립니다.
