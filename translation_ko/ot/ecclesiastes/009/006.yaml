id: ECC.9.6
reference: Ecclesiastes 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם אַהֲבָתָ֧/ם גַּם שִׂנְאָתָ֛/ם גַּם קִנְאָתָ֖/ם כְּבָ֣ר אָבָ֑דָה וְ/חֵ֨לֶק אֵין לָ/הֶ֥ם עוֹד֙ לְ/עוֹלָ֔ם בְּ/כֹ֥ל אֲשֶֽׁר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/006.yaml
  text: Their love[a], their hatred, and their jealousy have already perished, and they no longer have a share forever in anything that is done under the sun.
  footnotes:
  - marker: a
    text: Or 'their zeal' or 'their envy' for 'their jealousy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 사랑과 그들의 미움과 그들의 질투도 이미 사라졌으며, 그들은 해 아래에서 이루어지는 모든 일에 영원히 더 이상 몫이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘질투’는 여기서 ‘시기’나 ‘열심’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַהֲבָתָם
  english_pob_choice: their love
  chosen_korean: 그들의 사랑
  alternatives_korean:
  - 그들의 애정
  - 그들의 사랑스러움
  lexicon: HALOT
  rationale: 명사형 사랑이 מקור의 추상명사를 가장 직접적으로 옮기며, 삼중 구조의 첫 항목으로도 자연스럽습니다.
- source_word: שִׂנְאָתָם
  english_pob_choice: their hatred
  chosen_korean: 그들의 미움
  alternatives_korean:
  - 그들의 증오
  - 그들의 혐오
  lexicon: HALOT
  rationale: 문맥상 인간 감정의 대조쌍을 이루므로, 일상적이면서도 추상적인 ‘미움’이 ‘사랑’과의 병렬을 잘 살립니다.
- source_word: קִנְאָתָם
  english_pob_choice: their jealousy
  chosen_korean: 그들의 질투
  alternatives_korean:
  - 그들의 시기
  - 그들의 열심
  lexicon: HALOT
  rationale: POB가 각주로 남긴 바와 같이 ‘질투/시기/열심’의 의미 범위가 있지만, 사랑·미움과 나란한 정서적 항목으로는 ‘질투’가 가장 자연스럽습니다.
- source_word: כְּבָר אָבָדָה
  english_pob_choice: have already perished
  chosen_korean: 이미 사라졌으며
  alternatives_korean:
  - 이미 멸망했으며
  - 이미 없어졌으며
  lexicon: HALOT
  rationale: 아בד의 강한 소멸감을 살리되, 한국어에서는 죽음 이후의 상태를 지나치게 단정하지 않도록 ‘사라졌으며’로 옮겼습니다. ‘이미’는 כְּבָר의 완료성을 반영합니다.
- source_word: חֵלֶק
  english_pob_choice: a share
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 분량
  lexicon: HALOT
  rationale: 전도서에서 ‘삶에서의 몫/몫받이’라는 뜻을 살려 현대 한국어의 ‘몫’으로 옮기면, 뒤의 ‘더 이상 … 없습니다’와도 자연스럽게 맞습니다.
theological_decisions:
- issue: 죽은 자의 상태에 대한 진술 범위
  chosen_reading: 이 구절은 죽은 자가 ‘해 아래’에서 이루어지는 일에 더 이상 참여하거나 몫을 갖지 못한다는 뜻으로 번역했습니다.
  alternative_readings:
  - 죽은 자의 의식이 전면적으로 소멸되었다는 형이상학적 진술
  - 사후 세계 전체에 대한 단정
  rationale: 문맥이 ‘해 아래’라는 한정어로 진술 범위를 땅 위의 삶과 활동으로 묶고 있으므로, 그 경계를 넘어 교리를 확정하지 않도록 했습니다.
  doctrine_reference: 전도서의 긴장을 보존하고, 본문이 말하는 범위를 넘어서지 않음
