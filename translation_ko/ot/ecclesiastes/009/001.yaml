id: ECC.9.1
reference: Ecclesiastes 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אֶת כָּל זֶ֞ה נָתַ֤תִּי אֶל לִבִּ/י֙ וְ/לָ/ב֣וּר אֶת כָּל זֶ֔ה אֲשֶׁ֨ר הַ/צַּדִּיקִ֧ים וְ/הַ/חֲכָמִ֛ים וַ/עֲבָדֵי/הֶ֖ם בְּ/יַ֣ד הָ/אֱלֹהִ֑ים גַּֽם אַהֲבָ֣ה גַם שִׂנְאָ֗ה אֵ֤ין יוֹדֵ֨עַ֙ הָֽ/אָדָ֔ם הַ/כֹּ֖ל לִ/פְנֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/001.yaml
  text: 'For I laid all this to my heart[a], even to examine all this: that the righteous and the wise and their works are in the hand of God. Whether love or hate, man does not know[b]; everything is before them.'
  footnotes:
  - marker: a
    text: Or 'their servants.' The Hebrew form can be read that way, but many understand it here as 'their deeds' or 'works.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew of the final clause is difficult. It may mean that a person does not know in advance whether love or hate awaits them, or that present circumstances do not reveal whether one is loved or hated.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 이 모든 것에 마음을 두고, 이 모든 것을 살펴보니, 의인들과 지혜로운 사람들과 그들의 행위는 하나님의 손 안에 있습니다. 사랑이든 미움이든 사람은 알지 못합니다. 그들의 앞에는 모든 것이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 종들’로도 읽을 수 있으나, 문맥상 ‘그들의 행위/일’로 이해하는 경우가 많습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 마지막 절은 어렵습니다. 사랑이나 미움이 장차 닥칠지, 또는 현재 형편만으로 사랑받음과 미움을 알 수 없는지를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתִּי אֶל לִבִּי
  english_pob_choice: I laid all this to my heart
  chosen_korean: 마음을 두고
  alternatives_korean:
  - 마음에 두고
  - 깊이 생각하고
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 숙고를 자연스러운 합쇼체로 옮기되, 단순한 감정이 아니라 의식적인 숙고라는 점을 살렸습니다.
- source_word: וְלָבוּר
  english_pob_choice: even to examine
  chosen_korean: 살펴보니
  alternatives_korean:
  - 검토하니
  - 조사하니
  lexicon: HALOT
  rationale: 지혜문학의 탐구적 뉘앙스를 유지하면서 한국어에서 자연스럽게 읽히는 ‘살펴보다’로 옮겼습니다.
- source_word: וַעֲבָדֵיהֶם
  english_pob_choice: their works
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 일
  - 그들의 종
  lexicon: HALOT
  rationale: 문맥상 ‘그들의 종’보다 ‘그들이 행한 것/행위’가 더 자연스럽고, POB의 본문 선택인 works를 한국어로 반영했습니다.
- source_word: בְּיַד הָאֱלֹהִים
  english_pob_choice: in the hand of God
  chosen_korean: 하나님의 손 안에
  alternatives_korean:
  - 하나님의 권능 아래
  - 하나님의 손에
  lexicon: HALOT
  rationale: 신적 주권을 나타내는 구체적 비유를 직역에 가깝게 보존했습니다.
- source_word: גַּם אַהֲבָה גַם שִׂנְאָה
  english_pob_choice: Whether love or hate
  chosen_korean: 사랑이든 미움이든
  alternatives_korean:
  - 사랑이든 증오이든
  - 사랑이냐 미움이냐
  lexicon: HALOT
  rationale: 대조되는 가능성을 한국어의 선택 구조로 살려, 인간이 미리 알 수 없다는 뉘앙스를 유지했습니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람은
  alternatives_korean:
  - 인은
  - 인간은
  lexicon: HALOT
  rationale: 히브리어의 일반적 단수 표현을 한국어에서는 성중립적으로 자연스럽게 전달했습니다.
theological_decisions:
- issue: וַעֲבָדֵיהֶם의 의미
  chosen_reading: ‘그들의 행위’로 이해했습니다.
  alternative_readings:
  - ‘그들의 종’으로 읽을 수 있습니다.
  rationale: 문맥이 의인과 지혜로운 사람의 상태와 운명을 말하므로, 새 사회집단을 도입하는 ‘종’보다 행위/일의 뜻이 흐름에 더 잘 맞습니다. 다만 자음 형태가 ‘종들’로도 읽힐 수 있는 긴장은 본문 번역에서 그대로 유지했습니다.
  doctrine_reference: 번역 원칙 §3, §5
- issue: 사랑과 미움에 대한 문장
  chosen_reading: 사람은 사랑과 미움이 자신에게 어떻게 올지 미리 알지 못한다는 뜻을 살렸습니다.
  alternative_readings:
  - 현재 형편만으로 사랑받음과 미움을 분별할 수 없다는 뜻
  - 사랑이든 미움이든 인간은 앞날을 알 수 없다는 뜻
  rationale: 히브리어가 압축되어 있어 확정적 해석을 강하게 못 박기보다, 전도서의 문맥에 맞는 불확실성을 한국어 본문에 보존했습니다.
  doctrine_reference: 번역 원칙 §3
