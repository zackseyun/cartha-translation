id: ECC.9.5
reference: Ecclesiastes 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֧י הַֽ/חַיִּ֛ים יוֹדְעִ֖ים שֶׁ/יָּמֻ֑תוּ וְ/הַ/מֵּתִ֞ים אֵינָ֧/ם יוֹדְעִ֣ים מְא֗וּמָה וְ/אֵֽין ע֤וֹד לָ/הֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/005.yaml
  text: For the living know that they will die[a], but the dead know nothing at all, and there is no longer any reward for them, because their memory is forgotten.
  footnotes:
  - marker: a
    text: 'Or, ''know nothing.'' The Hebrew expression is emphatic: ''do not know anything at all.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 살아 있는 사람들은 자신들이 죽을 것을 알지만, 죽은 사람들은 아무것도 알지 못합니다. 그들에게는 더 이상 보상도 없고, 그들의 기억도 잊혀졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아무것도 알지 못합니다’는 히브리어의 강조를 반영한 표현으로, 문자적으로는 ‘아무것도 전혀 알지 못한다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַיִּים
  english_pob_choice: the living
  chosen_korean: 살아 있는 사람들
  alternatives_korean:
  - 산 자들
  - 생존자들
  lexicon: HALOT
  rationale: 살아 있는 사람들을 가리키는 집합적 표현으로, 한국어에서 자연스럽고 문맥상 사람을 분명히 드러냅니다.
- source_word: יוֹדְעִים שֶׁיָּמֻתוּ
  english_pob_choice: know that they will die
  chosen_korean: 자신들이 죽을 것을 알지만
  alternatives_korean:
  - 그들이 죽을 것을 알지만
  - 죽게 될 것을 알지만
  lexicon: HALOT
  rationale: ידע의 기본 의미를 살려 ‘알다’로 옮기되, 내용절을 자연스러운 한국어 어순으로 처리했습니다.
- source_word: אֵינָם יוֹדְעִים מְאוּמָה
  english_pob_choice: know nothing at all
  chosen_korean: 아무것도 알지 못합니다
  alternatives_korean:
  - 전혀 알지 못합니다
  - 아무것도 모릅니다
  lexicon: HALOT
  rationale: מְאוּמָה의 강조를 한국어의 ‘아무것도’로 살려, 단순한 부정보다 강한 ‘전혀 없음’을 드러냈습니다.
- source_word: שָׂכָר
  english_pob_choice: reward
  chosen_korean: 보상
  alternatives_korean:
  - 상급
  - 삯
  lexicon: HALOT
  rationale: 문맥상 경제적 ‘삯’보다 삶의 결산·보답을 가리키는 일반적 의미가 더 적절하여 ‘보상’으로 옮겼습니다.
- source_word: זִכְרָם
  english_pob_choice: their memory
  chosen_korean: 그들의 기억
  alternatives_korean:
  - 그들의 기억됨
  - 그들을 기억함
  lexicon: HALOT
  rationale: זֵכֶר 계열의 뜻을 자연스러운 현대 한국어로 옮겼으며, 주어의 소멸이 아니라 ‘기억’ 자체가 사라진 상태를 나타냅니다.
theological_decisions:
- issue: 죽은 자에 대한 진술을 교리적으로 완화할지 여부
  chosen_reading: 본문의 직설적 진술을 그대로 살려, 죽은 사람들은 아무것도 알지 못하고 더 이상 보상도 없다고 옮겼습니다.
  alternative_readings:
  - ‘해 아래에서 일어나는 일에 대해 아무것도 알지 못한다’와 같이 범위를 덧붙이는 번역
  - 후대 교리와의 조화를 위해 표현을 약화하는 번역
  rationale: 전도자의 문맥상 발화는 ‘해 아래’ 관점의 현실 진술이므로, 본문이 지닌 긴장을 해소하지 않고 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
