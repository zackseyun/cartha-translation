id: ECC.9.11
reference: Ecclesiastes 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׁ֜בְתִּי וְ/רָאֹ֣ה תַֽחַת הַ/שֶּׁ֗מֶשׁ כִּ֣י לֹא֩ לַ/קַּלִּ֨ים הַ/מֵּר֜וֹץ וְ/לֹ֧א לַ/גִּבּוֹרִ֣ים הַ/מִּלְחָמָ֗ה וְ֠/גַם לֹ֣א לַ/חֲכָמִ֥ים לֶ֨חֶם֙ וְ/גַ֨ם לֹ֤א לַ/נְּבֹנִים֙ עֹ֔שֶׁר וְ/גַ֛ם לֹ֥א לַ/יֹּדְעִ֖ים חֵ֑ן כִּי עֵ֥ת וָ/פֶ֖גַע יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/011.yaml
  text: I again saw under the sun that the race is not to the swift[a], nor the battle to the mighty, and also bread is not to the wise, nor riches to the discerning, nor favor to those who know; for time and chance happen to them all.
  footnotes:
  - marker: a
    text: Or 'time and happening,' 'time and mischance,' or 'time and occurrence.' The Hebrew expression emphasizes that unpredictable circumstances overtake everyone.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 다시 보고 해 아래를 보니, 달리기는 빠른 사람들의 몫이 아니고, 전쟁은 용사들의 몫이 아니며, 음식은 지혜로운 사람들의 몫이 아니고, 재물은 분별 있는 사람들의 몫이 아니며, 호의도 지식을 가진 사람들의 몫이 아닙니다. 이는 때와 기회가 그들 모두에게 닥치기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기회’는 פֶגַע의 가능한 의미를 반영한 것입니다. 이 표현은 ‘때와 발생,’ ‘때와 불운,’ 또는 ‘때와 사건’으로도 옮길 수 있으며, 예상할 수 없는 상황이 모든 사람에게 닥친다는 점을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְתִּי וְרָאֹה
  english_pob_choice: I again saw
  chosen_korean: 내가 다시 보고
  alternatives_korean:
  - 내가 다시 보았습니다
  - 내가 돌아서서 보았습니다
  lexicon: WLC / HALOT
  rationale: שַׁבְתִּי와 רָאֹה의 반복적 관찰 기능을 살려, 단순한 이동이 아니라 ‘다시 보다’는 담화 흐름으로 옮겼습니다.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래를
  alternatives_korean:
  - 태양 아래를
  - 세상에서
  lexicon: HALOT
  rationale: 전도서의 관용구를 그대로 살려 인간 세계의 관찰 범위를 드러내는 표현으로 유지했습니다.
- source_word: לַקַּלִּים הַמֵּרוֹץ
  english_pob_choice: the race is not to the swift
  chosen_korean: 달리기는 빠른 사람들의 몫이 아니고
  alternatives_korean:
  - 경주는 빠른 사람들의 몫이 아니고
  - 달리기는 민첩한 사람들의 몫이 아니고
  lexicon: HALOT
  rationale: ‘race’를 자연스러운 현대 한국어로 옮기되, 결과가 보장되지 않는 배당의 뉘앙스를 살리기 위해 ‘몫’으로 처리했습니다.
- source_word: עֹשֶׁר / חֵן
  english_pob_choice: riches ... favor
  chosen_korean: 재물 ... 호의
  alternatives_korean:
  - 부유함 ... 은총
  - 부 ... 은혜
  lexicon: HALOT
  rationale: עֹשֶׁר은 물질적 소유를 가리키므로 ‘재물’이 적절하고, חֵן은 이 지혜문맥에서 신학적 ‘은혜’보다 사회적 수용/호의를 뜻하므로 ‘호의’로 옮겼습니다.
theological_decisions:
- issue: פֶגַע를 ‘chance’로 옮길 때 우연론으로 오해될 가능성
  chosen_reading: ‘때와 기회’로 옮겨, 관찰되는 예측 불가능성을 말하되 하나님의 주권을 부정하는 철학적 주장으로 단정하지 않도록 했습니다.
  alternative_readings:
  - 운명
  - 우연
  rationale: 전도서의 ‘해 아래’ 관점은 인간 경험의 불가예측성을 기술하지만, 본문 자체가 섭리를 부정한다고 말하지는 않으므로 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 섭리와 인간 경험의 긴장 유지
