id: ECC.9.3
reference: Ecclesiastes 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֣ה רָ֗ע בְּ/כֹ֤ל אֲשֶֽׁר נַעֲשָׂה֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּֽי מִקְרֶ֥ה אֶחָ֖ד לַ/כֹּ֑ל וְ/גַ֣ם לֵ֣ב בְּֽנֵי הָ֠/אָדָם מָלֵא רָ֨ע וְ/הוֹלֵל֤וֹת בִּ/לְבָבָ/ם֙ בְּ/חַיֵּי/הֶ֔ם וְ/אַחֲרָ֖י/ו אֶל הַ/מֵּתִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/003.yaml
  text: 'This is the evil in all that is done under the sun: that one fate comes to all[a]. Also, the heart of the sons of man is full of evil, and madness is in their hearts during their lives—and afterward[c][b], they go to the dead.'
  footnotes:
  - marker: a
    text: Or 'the heart of humankind' / 'the human heart.' The Hebrew phrase 'the sons of man' uses masculine representative language for humanity in general.
    reason: lexical_alternative
  - marker: b
    text: Or 'that the same event happens to all.' The Hebrew מִקְרֶה can mean what befalls a person, an event, or a common fate.
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew is abrupt: literally, ''and after it, to the dead.'' This likely means that after life, people go to the dead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 해 아래에서 이루어지는 모든 일의 악입니다. 곧 한 운명이 모두에게 닥칩니다[a]. 또한 사람의 아들들의 마음에는 악이 가득하고, 그들의 살아 있는 동안에는 마음속에 광기가 있으며, 그 뒤에는 죽은 자들에게로 갑니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 마음’ / ‘인류의 마음’. 히브리어 ‘사람의 아들들’은 인류 전체를 가리키는 남성 대표 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘동일한 일이 모두에게 닥칩니다’. 히브리어 מִקְרֶה는 사람에게 닥치는 일, 사건, 또는 공통의 운명을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 매우 압축적입니다. 문자적으로는 ‘그리고 뒤에, 죽은 자들에게로’이며, 이는 삶 뒤에 사람들이 죽은 자들에게로 간다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה רָע
  english_pob_choice: This is the evil
  chosen_korean: 이것은 해 아래에서 이루어지는 모든 일의 악입니다
  alternatives_korean:
  - 이것은 악입니다
  - 이것은 해 아래에서 이루어지는 모든 일의 악한 일입니다
  lexicon: HALOT
  rationale: 지시어와 평가적 형용사의 결합을 문맥에 맞게 특정한 ‘악’으로 옮겨, 전도서의 진술을 일반적 설명이 아니라 문제의 핵심 진단으로 드러냈습니다.
- source_word: כִּי מִקְרֶה אֶחָד לַכֹּל
  english_pob_choice: that one fate comes to all
  chosen_korean: 곧 한 운명이 모두에게 닥칩니다
  alternatives_korean:
  - 곧 한 사건이 모든 사람에게 일어납니다
  - 곧 같은 일이 모두에게 닥칩니다
  lexicon: HALOT
  rationale: מִקְרֶה의 ‘일어남/닥침’과 전도서 문맥의 실존적 뉘앙스를 살려 ‘운명’으로 옮겼습니다. ‘한 운명’은 POB의 해석을 따르되 한국어로 자연스럽게 전달합니다.
- source_word: לֵב בְּנֵי הָאָדָם
  english_pob_choice: the heart of the sons of man
  chosen_korean: 사람의 아들들의 마음
  alternatives_korean:
  - 인류의 마음
  - 인간의 마음
  lexicon: HALOT
  rationale: 히브리어의 남성 대표 표현을 평탄화하지 않고 최대한 형태에 가깝게 살렸습니다. ‘마음’은 히브리어 לֵב의 인지·의지적 중심을 유지합니다.
- source_word: מָלֵא רָע וְהוֹלֵלוֹת
  english_pob_choice: is full of evil, and madness
  chosen_korean: 악이 가득하고 … 광기가 있으며
  alternatives_korean:
  - 악으로 가득하고 … 어리석음이 있으며
  - 악이 충만하고 … 미친 듯한 행실이 있으며
  lexicon: HALOT
  rationale: ‘가득하다’는 상태 동사를 보존하고, וְהוֹלֵלוֹת는 단순한 ‘어리석음’보다 강한 광기/광란의 뉘앙스를 살려 ‘광기’로 옮겼습니다.
- source_word: וְאַחֲרָיו אֶל הַמֵּתִים
  english_pob_choice: and afterward, they go to the dead
  chosen_korean: 그 뒤에는 죽은 자들에게로 갑니다
  alternatives_korean:
  - 그 후에는 죽은 자들에게로 갑니다
  - 그리고 나서 죽은 자들에게 갑니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 종결을 한국어에서는 자연스럽게 풀어, POB의 해석을 반영하면서도 명시적 동사를 보충했습니다.
theological_decisions:
- issue: בְּנֵי הָאָדָם의 대표적 남성 표현을 어떻게 처리할지
  chosen_reading: 사람의 아들들
  alternative_readings:
  - 인류
  - 인간들
  rationale: 원문의 남성 대표 표현을 지우지 않으면서도 한국어 독자에게는 전체 인류를 가리키는 표현으로 읽히도록 유지했습니다. 이는 문법적 성별보다 원문 형식을 우선하는 번역 선택입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; 사람/인류 관련 성별-표현 정책
- issue: וְאַחֲרָיו אֶל הַמֵּתִים의 압축성을 어떻게 풀지
  chosen_reading: 그 뒤에는 죽은 자들에게로 갑니다
  alternative_readings:
  - 그 뒤에 죽은 자들에게
  - 그 후 죽은 자들에게로
  rationale: 히브리어는 매우 생략적이지만 문맥상 삶 이후의 귀결을 뜻하므로, 의미를 훼손하지 않는 범위에서 동사를 보충해 독자 이해를 돕는 쪽을 택했습니다.
  doctrine_reference: 전도서 9:3 문맥상 종결 진술; 서술 보완 허용 원칙
