id: ECC.9.9
reference: Ecclesiastes 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְאֵ֨ה חַיִּ֜ים עִם אִשָּׁ֣ה אֲשֶׁר אָהַ֗בְתָּ כָּל יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔/ךָ אֲשֶׁ֤ר נָֽתַן לְ/ךָ֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑/ךָ כִּ֣י ה֤וּא חֶלְקְ/ךָ֙ בַּֽ/חַיִּ֔ים וּ/בַ/עֲמָ֣לְ/ךָ֔ אֲשֶׁר אַתָּ֥ה עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/009.yaml
  text: Enjoy life with the wife whom you love all the days of your fleeting life that he has given you under the sun—all your fleeting days—for that is your portion in life and in your labor at which you toil under the sun[a][b][c].
  footnotes:
  - marker: a
    text: Or 'See life with the wife whom you love.' The Hebrew idiom 'see life' can mean to experience or enjoy life.
    reason: lexical_alternative
  - marker: b
    text: Hebrew hebel, often rendered 'vanity' or 'vapor'; here it conveys the fleeting, insubstantial character of life.
    reason: lexical_alternative
  - marker: c
    text: The subject of 'has given' is implicit in Hebrew; the wider context suggests God, though he is not named in this clause.
    reason: alternative_reading
translation:
  language: ko
  text: 그대가 사랑하는 아내와 함께 삶을 누리십시오. 해 아래에서 하나님이 그대에게 주신 덧없는 생애의 모든 날—그 덧없는 날들—을 누리십시오. 그것이 삶과 해 아래에서 그대가 수고하는 그 노동에서 그대의 몫이기 때문입니다[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아내와 함께 삶을 보십시오.’ 히브리어 관용구 ‘삶을 보다’는 삶을 경험하거나 누린다는 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 hebel은 흔히 ‘허무’ 또는 ‘바람’으로 옮겨지지만, 여기서는 삶의 덧없고 붙잡을 수 없는 성격을 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘주신’의 주어는 히브리어에서 생략되어 있습니다. 넓은 문맥은 하나님을 가리키지만, 이 절 자체에서는 그분이 명시되지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה חַיִּים
  english_pob_choice: Enjoy life
  chosen_korean: 삶을 누리십시오
  alternatives_korean:
  - 삶을 보십시오
  - 삶을 경험하십시오
  - 삶을 즐기십시오
  lexicon: HALOT
  rationale: 히브리어 ‘보다’는 전도서의 관용구 ‘삶을 보다’에서 ‘삶을 누리다/즐기다’의 뜻으로 쓰이므로, 자연스러운 한국어로 그 관용적 힘을 살렸습니다.
- source_word: עִם אִשָּׁה אֲשֶׁר אָהַבְתָּ
  english_pob_choice: with the wife whom you love
  chosen_korean: 그대가 사랑하는 아내와 함께
  alternatives_korean:
  - 그대가 사랑하는 아내와 더불어
  - 그대가 사랑한 아내와 함께
  - 사랑하는 아내와 함께
  lexicon: HALOT
  rationale: 문맥상 일반적인 ‘한 여자’가 아니라 청자에게 속한 아내를 가리키므로, 영어 POB의 ‘the wife’에 맞춰 ‘아내’로 분명히 했습니다.
- source_word: הֶבֶל
  english_pob_choice: fleeting
  chosen_korean: 덧없는
  alternatives_korean:
  - 헛된
  - 허무한
  - 바람 같은
  lexicon: HALOT
  rationale: 전도서의 הֶבֶל은 단순히 ‘의미 없음’보다 덧없음, 붙잡을 수 없음, 짧음을 함께 드러내므로 ‘덧없는’이 본문 긴장을 가장 잘 살립니다.
- source_word: אֲשֶׁר נָתַן לְךָ
  english_pob_choice: that he has given you
  chosen_korean: 하나님이 그대에게 주신
  alternatives_korean:
  - 그가 그대에게 주신
  - 그대에게 주신
  lexicon: HALOT
  rationale: 히브리어는 주어가 생략되어 있지만 문맥상 주시는 분은 하나님이므로, 본문 의미를 분명히 하되 전도서의 신학적 흐름을 따라 ‘하나님’을 명시했습니다.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 햇빛 아래에서
  lexicon: HALOT
  rationale: 전도서의 대표적 표현을 관용적으로 옮겨, 현세적 삶의 영역이라는 책의 반복적 주제를 유지했습니다.
- source_word: חֶלְקְךָ
  english_pob_choice: your portion
  chosen_korean: 그대의 몫
  alternatives_korean:
  - 그대의 분깃
  - 그대의 몫이
  lexicon: HALOT
  rationale: חֵלֶק은 할당된 몫/분깃의 뜻이므로, 현대 한국어에서 자연스럽고 분배의 뉘앙스를 살리는 ‘몫’을 선택했습니다.
- source_word: וּבַעֲמָלְךָ
  english_pob_choice: and in your labor
  chosen_korean: 그대가 수고하는 그 노동에서
  alternatives_korean:
  - 그대의 노동에서
  - 그대의 수고에서
  - 그대가 애쓰는 일에서
  lexicon: HALOT
  rationale: עָמָל은 단순한 일보다 고된 수고를 가리키므로, 뒤따르는 분사 ‘수고하는’과 함께 중첩 없이 강조되도록 옮겼습니다.
theological_decisions:
- issue: 동사 נָתַן의 생략된 주어
  chosen_reading: 주어를 ‘하나님’으로 명시했습니다.
  alternative_readings:
  - ‘그가’로 유지하기
  - 주어를 아예 드러내지 않기
  rationale: 본문은 주어를 생략하지만 전도서 전체 문맥에서 삶과 몫을 주시는 분은 하나님이므로, 독자가 오해 없이 읽도록 주어를 보충했습니다.
  doctrine_reference: 전도서 9:7-10의 문맥적 신학
- issue: ‘삶을 누리십시오’의 명령 어조
  chosen_reading: 청자에게 직접 권하는 합쇼체 명령으로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화하기
  - 더 중립적인 권고문으로 만들기
  rationale: 히브리어 명령형 רְאֵה의 권면성을 살리되, 한국어 성경 문체에 맞게 정중한 직접 권고로 유지했습니다.
  doctrine_reference: 번역 문체 원칙
