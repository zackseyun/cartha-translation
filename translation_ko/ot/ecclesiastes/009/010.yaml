  yaml_path: translation/ot/ecclesiastes/009/010.yaml
  text: Whatever your hand finds to do, do it with your strength, for there is no work or planning or knowledge or wisdom in Sheol, where you are going.
  footnotes:
  - marker: a
    text: Or 'the grave' or 'the realm of the dead.' The Hebrew term 'Sheol' refers to the place/state of the dead in the Old Testament.
    reason: lexical_alternative
translation:
  language: ko
  text: 할 수 있는 일이라면 무엇이든 힘을 다해 하십시오. 당신이 가는 스올[a]에는 일도 계획도 지식도 지혜도 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무덤’이나 ‘죽은 자들의 세계’. 히브리어 ‘스올’은 구약성경에서 죽은 자들이 있는 곳 또는 죽은 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא יָדְךָ
  english_pob_choice: your hand finds
  chosen_korean: 당신의 손이 할 일을 발견하면
  alternatives_korean:
  - 당신이 할 일을 찾으면
  - 당신의 손이 찾으면
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 단순한 신체 부위가 아니라 실제로 할 수 있는 일과 기회를 가리키는 관용구이므로, 주어 구조를 살리되 한국어에서는 자연스럽게 ‘할 일을 발견하다’로 옮겼습니다.
- source_word: בְּכֹחֲךָ
  english_pob_choice: with your strength
  chosen_korean: 힘을 다해
  alternatives_korean:
  - 온 힘으로
  - 당신의 힘으로
  lexicon: HALOT
  rationale: 본문의 강조는 가진 역량을 최대한 사용하라는 뜻이므로, ‘힘을 다해’가 원문의 실행력과 긴박감을 한국어로 가장 자연스럽게 드러냅니다.
- source_word: מַעֲשֶׂה וְחֶשְׁבּוֹן וְדַעַת וְחָכְמָה
  english_pob_choice: work or planning or knowledge or wisdom
  chosen_korean: 일도, 계획도, 지식도, 지혜도
  alternatives_korean:
  - 일도, 셈함도, 앎도, 지혜도
  - 일도, 계산도, 지식도, 지혜도
  lexicon: HALOT
  rationale: 연속된 명사열을 한국어의 병렬 구조로 살리면서, ‘חשבון’을 단순 계산보다 문맥에 더 적합한 ‘계획’으로 옮겨 죽음 이후의 활동 불가능성을 분명히 했습니다.
- source_word: בִּשְׁאוֹל
  english_pob_choice: in Sheol
  chosen_korean: 스올에는
  alternatives_korean:
  - 음부에는
  - 무덤에는
  - 죽은 자의 세계에는
  lexicon: HALOT
  rationale: ‘스올’은 전통적 교회 용어인 ‘음부’보다 히브리어의 고유한 사후 세계 개념을 더 직접적으로 보존하므로 음역을 유지하고, 독자가 문맥을 따라가도록 장소 조사만 붙였습니다.
theological_decisions:
- issue: 스올의 번역 방식
  chosen_reading: ‘스올’로 음역하여 유지하고, 죽은 자의 상태/영역을 가리키는 표현으로 이해하게 합니다.
  alternative_readings:
  - 무덤
  - 죽은 자의 세계
  - 음부
  rationale: 전도서 9:10은 죽음 이후의 인간 활동의 중지를 말하므로, ‘지옥’처럼 후대적 형벌 개념을 끌어오지 않도록 하고 히브리어 고유어의 범위를 보존하는 편이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
