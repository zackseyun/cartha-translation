- from: 당신의 손이 할 일을 발견하면, 힘을 다해 하십시오. 왜냐하면 당신이 가는 그곳, 스올에는 일도, 계획도, 지식도, 지혜도 없기 때문입니다.[a]
  to: 할 수 있는 일이라면 무엇이든 힘을 다해 하십시오. 당신이 가는 스올[a]에는 일도 계획도 지식도 지혜도 없기 때문입니다.
  rationale: 히브리어의 ‘손이 찾아내는’ 관용구가 나타내는 실제적 능력 또는 기회의 뜻을 ‘할 수 있는 일이라면 무엇이든’으로 자연스럽게 옮겼습니다. ‘힘을 다해’는 בְּכֹחֲךָ의 힘을 기울이는 뜻을 한국어 관용으로 충실히 전달합니다. 스올은 음역을 유지하고, 각주 표지를 해당 용어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:46:23Z'
