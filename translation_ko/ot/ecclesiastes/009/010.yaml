  verdict: revise
  source_fidelity: 초안은 명사열과 스올의 음역을 대체로 충실히 반영합니다. 그러나 ‘당신의 손이 할 일을 발견하면’은 히브리어 관용구가 뜻하는 ‘할 수 있거나 손에 닿는 일’을 한국어에서 부자연스럽게 직역한 표현입니다. 이를 자연스러운 포괄 표현으로 고쳤습니다.
  naturalness: 현대 표준어 합쇼체에서 ‘할 수 있는 일이라면 무엇이든’과 ‘…없기 때문입니다’가 자연스럽습니다. ‘왜냐하면’으로 시작하는 종속절식 연결은 제거했습니다.
  terminology: ‘스올’을 유지하여 שְׁאוֹל의 의미 범위를 보존했습니다. 각주도 ‘무덤’ 및 ‘죽은 자들의 세계’라는 대안을 제시하되, 후대의 특정 교리 개념을 부과하지 않도록 다듬었습니다.
