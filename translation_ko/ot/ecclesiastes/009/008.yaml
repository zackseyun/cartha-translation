  verdict: revise
  source_fidelity: 히브리어는 ‘모든 때에/언제나’(בכל עת), ‘너의 옷들이 희게 하라/있게 하라’(יהיו בגדיך לבנים), 그리고 ‘네 머리 위의 기름이 부족하지 않게 하라’(ושמן על ראשך אל יחסר)라는 권면을 담고 있습니다. 초안의 시간성과 금지·권면의 의미는 대체로 맞지만, ‘옷은 희게 하고’는 한국어에서 옷을 표백한다는 사역 의미로 쉽게 읽혀 원문의 옷차림 이미지를 충분히 자연스럽게 전달하지 못합니다.
  naturalness: ‘언제나 옷을 희게 입으십시오’는 흰 옷을 입는 지속적 권면을 자연스러운 현대 한국어로 표현하면서도 원문의 ‘흰’ 이미지를 보존합니다. ‘머리에는 기름이 떨어지지 않게 하십시오’는 현대 한국어에서도 자연스럽고, 원문의 결핍되지 않게 하라는 표현을 유지합니다.
  terminology: ‘기름’은 원문이 특정 종류의 기름을 밝히지 않으므로 적절합니다. 문화 주석의 ‘안녕’은 이 문맥에서 다소 추상적이므로 ‘평안’으로 다듬고, 애도와의 대비를 명확히 했습니다.
