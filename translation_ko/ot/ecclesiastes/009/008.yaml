id: ECC.9.8
reference: Ecclesiastes 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כָל עֵ֕ת יִהְי֥וּ בְגָדֶ֖י/ךָ לְבָנִ֑ים וְ/שֶׁ֖מֶן עַל רֹאשְׁ/ךָ֥ אַל יֶחְסָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/008.yaml
  text: Let your garments always be white[b][a], and do not let oil be lacking on your head.
  footnotes:
  - marker: a
    text: Or 'At all times let your garments be white.'
    reason: lexical_alternative
  - marker: b
    text: The imagery of white garments and oil on the head evokes festivity, joy, and well-being rather than mourning.
    reason: cultural_note
translation:
  language: ko
  text: 언제나 당신의 옷은 희게 하고, 당신의 머리에는 기름이 떨어지지 않게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “언제나 당신의 옷은 희게 하십시오.”
    reason: alternative_reading
  - marker: b
    text: 흰 옷과 머리의 기름은 애도보다 축제, 기쁨, 안녕의 이미지를 불러일으킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל עֵת
  english_pob_choice: always
  chosen_korean: 언제나
  alternatives_korean:
  - 항상
  - 늘
  - 모든 때에
  lexicon: HALOT
  rationale: ‘at every time’의 지속성을 자연스러운 현대 한국어로 옮기되, 지혜문학의 권면체에 맞게 평이한 부사 ‘언제나’를 택했습니다.
- source_word: יִהְיוּ
  english_pob_choice: let ... be
  chosen_korean: 희게 하고
  alternatives_korean:
  - 희게 되게 하십시오
  - 희게 있으십시오
  lexicon: HALOT
  rationale: 히브리어 비완료형의 권면적 힘을 한국어 명령형으로 살리되, ‘흰 옷을 입다’보다 원문의 상태 초점을 살려 ‘희게 하다’로 옮겼습니다.
- source_word: לְבָנִים
  english_pob_choice: white
  chosen_korean: 희게
  alternatives_korean:
  - 하얗게
  - 흰
  lexicon: HALOT
  rationale: 색채 형용사의 직접 대응으로 ‘희게’를 사용해 옷의 상태를 묘사하는 원문 이미지를 유지했습니다.
- source_word: אַל יֶחְסָר
  english_pob_choice: do not let ... be lacking
  chosen_korean: 떨어지지 않게 하십시오
  alternatives_korean:
  - 부족하지 않게 하십시오
  - 모자라지 않게 하십시오
  - 없지 않게 하십시오
  lexicon: HALOT
  rationale: 부정 명령의 ‘결핍/부재’ 의미를 살리면서도 한국어에서 더 자연스럽게 들리는 ‘떨어지다’를 써서 지속적 공급의 이미지를 전달했습니다.
theological_decisions:
- issue: 흰 옷과 기름의 상징성
  chosen_reading: 의례적·애도적 이미지가 아니라 축제와 기쁨, 번영의 분위기를 암시하는 표현으로 읽었습니다.
  alternative_readings:
  - 도덕적 순결의 상징으로만 읽기
  - 장례/애도 맥락으로 읽기
  rationale: 영문 POB의 주석을 따라, 본문이 직접 설명하지 않는 상징을 과도하게 신학화하지 않고 문맥상 지혜문학적 권면의 정서로 유지했습니다.
  doctrine_reference: 전도서 9장 문맥과 POB 문화 주석
- issue: 권면체의 문체
  chosen_reading: 하나의 일반 진술이 아니라 청자에게 주는 권면으로 합쇼체 명령형을 사용했습니다.
  alternative_readings:
  - 서술형 미래로 번역하기
  - 완곡한 권유형으로 번역하기
  rationale: 히브리어 비완료형과 금지형이 함께 주는 권면성을 한국어에서 가장 분명하게 드러내기 위해 명령형을 선택했습니다.
  doctrine_reference: 히브리어 동사상/법의식
