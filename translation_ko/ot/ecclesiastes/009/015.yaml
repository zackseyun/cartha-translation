language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָ֣צָא בָ֗/הּ אִ֤ישׁ מִסְכֵּן֙ חָכָ֔ם וּ/מִלַּט ה֥וּא אֶת הָ/עִ֖יר בְּ/חָכְמָת֑/וֹ וְ/אָדָם֙ לֹ֣א זָכַ֔ר אֶת הָ/אִ֥ישׁ הַ/מִּסְכֵּ֖ן הַ/הּֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/015.yaml
  text: And there was found in it a poor wise man[a], and he delivered the city by his wisdom; yet no one remembered that poor man.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'yet no one remembered that poor man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성 안에서 가난하고 지혜로운 한 사람이 발견되었습니다. 그는 자기 지혜로 그 성을 구해 냈습니다. 그러나 아무도 그 가난한 사람을 기억하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָצָא בָהּ
  english_pob_choice: there was found in it
  chosen_korean: 그 가운데서 ... 발견되었습니다
  alternatives_korean:
  - 그 안에서 발견되었습니다
  - 거기에서 발견되었습니다
  lexicon: HALOT
  rationale: מצא의 비인칭적·수동적 용법을 살려, 주어를 새로 만들지 않고 자연스러운 한국어 수동형으로 옮겼습니다.
- source_word: אִישׁ מִסְכֵּן חָכָם
  english_pob_choice: a poor wise man
  chosen_korean: 가난하지만 지혜로운 한 사람
  alternatives_korean:
  - 가난한 지혜로운 한 사람
  - 가난한 현명한 사람
  lexicon: HALOT
  rationale: אִישׁ은 여기서 특정한 남성을 가리키므로 '한 사람'으로 풀되, מִסְכֵּן과 חָכָם의 병치를 한국어에서는 대조적으로 살려 '가난하지만 지혜로운'으로 옮겼습니다.
- source_word: וּמִלַּט הוּא אֶת הָעִיר
  english_pob_choice: and he delivered the city
  chosen_korean: 그는 ... 그 성을 구해 냈지만
  alternatives_korean:
  - 그는 ... 그 성을 구원했지만
  - 그는 ... 그 성을 건져 냈지만
  lexicon: HALOT
  rationale: מלט의 구출/구해냄 의미를 살려, 대상이 '성'이라는 점을 분명히 하면서도 한국어에서 자연스러운 구출 동사로 옮겼습니다.
- source_word: בְּחָכְמָתוֹ
  english_pob_choice: by his wisdom
  chosen_korean: 자신의 지혜로
  alternatives_korean:
  - 그의 지혜로
  - 지혜를 통해
  lexicon: HALOT
  rationale: 전치사 ב의 수단 의미를 한국어 조사 '-로'로 간결하게 반영했습니다.
- source_word: וְאָדָם לֹא זָכַר
  english_pob_choice: yet no one remembered
  chosen_korean: 아무도 ... 기억하지 않았습니다
  alternatives_korean:
  - 아무 사람도 ... 기억하지 않았습니다
  - 어느 누구도 ... 기억하지 않았습니다
  lexicon: HALOT
  rationale: אָדָם의 일반적·포괄적 부정을 한국어 관용 표현 '아무도'로 옮겨, 원문의 뜻을 자연스럽게 전달했습니다.
- source_word: הָאִישׁ הַמִּסְכֵּן הַהוּא
  english_pob_choice: that poor man
  chosen_korean: 그 가난한 사람
  alternatives_korean:
  - 그 가난한 남자
  - 그 가난한 자
  lexicon: HALOT
  rationale: 지시어와 관사를 살려 특정 인물을 가리키는 점을 드러냈고, 한국어에서는 반복되는 '가난한'을 유지해 강조를 보존했습니다.
theological_decisions:
- issue: אָדָם의 일반 부정 표현
  chosen_reading: 아무도 기억하지 않았습니다
  alternative_readings:
  - 아무도 기억하지 않았습니다
  - 어느 누구도 기억하지 않았습니다
  rationale: 히브리어 אָדָם은 여기서 성별 특정이 아니라 일반 인간을 가리키므로, 한국어에서는 가장 자연스러운 포괄 부정인 '아무도'로 뜻을 드러냈습니다.
  doctrine_reference: Translation philosophy §4; contested terms for אָדָם
