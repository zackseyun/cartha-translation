  text: Go[a], eat your bread with joy, and drink your wine with a glad heart, for God has already approved your works.
  footnotes:
  - marker: a
    text: Or 'has accepted your deeds' or 'is pleased with your works.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 기쁨으로 네 빵을 먹고, 즐거운 마음으로 네 포도주를 마시십시오. 이는 하나님께서 이미 네 행위를 기뻐하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하셨기’는 여기서 ‘호의로 여기셨기’ 또는 ‘받아들이셨기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가보십시오
  lexicon: HALOT
  rationale: 권면을 여는 관용적 명령으로서 한국어에서도 자연스러운 ‘가서’로 처리해, 원문의 담화 추진력을 살렸습니다.
- source_word: בְּשִׂמְחָה
  english_pob_choice: with joy
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 기쁘게
  - 즐거움 가운데
  lexicon: HALOT
  rationale: 전치사 ב의 방식 용법을 살리면서 명사형을 유지해, 원문의 ‘기쁨’이라는 실체적 표현을 보존했습니다.
- source_word: לַחְמֶךָ / יֵינֶךָ
  english_pob_choice: your bread / your wine
  chosen_korean: 네 빵 / 네 포도주
  alternatives_korean:
  - 네 떡 / 네 술
  - 네 음식 / 네 포도주
  lexicon: HALOT
  rationale: לחם과 יין의 기본 이미지를 직접 살리기 위해 ‘빵’과 ‘포도주’를 택했습니다. ‘빵’은 현대 한국어에서 가장 직접적인 대응이며, ‘포도주’는 יין의 음료 이미지를 구체적으로 유지합니다.
- source_word: בְלֶב טוֹב
  english_pob_choice: with a glad heart
  chosen_korean: 즐거운 마음으로
  alternatives_korean:
  - 기쁜 마음으로
  - 좋은 마음으로
  lexicon: HALOT
  rationale: ‘좋은 마음’보다 한국어에서 자연스러운 내면 상태를 나타내는 ‘즐거운 마음’이 원문의 관용적 의미를 더 잘 전달합니다.
- source_word: רָצָה
  english_pob_choice: has already approved
  chosen_korean: 기뻐하셨기
  alternatives_korean:
  - 이미 승인하셨기
  - 이미 받아들이셨기
  - 이미 좋아하셨기
  lexicon: HALOT
  rationale: רצה의 핵심인 ‘기쁘게 여기다/받아들이다’를 한국어 동사 ‘기뻐하다’로 옮겨, 하나님이 행위를 호의적으로 보신다는 의미를 자연스럽게 드러냈습니다. ‘승인’은 다소 행정적이어서 피했습니다.
- source_word: מַעֲשֶׂיךָ
  english_pob_choice: your works
  chosen_korean: 네 행위
  alternatives_korean:
  - 네 일들
  - 네 일
  - 네 행동
  lexicon: HALOT
  rationale: ‘works’의 평가적 뉘앙스를 유지하되, 한국어에서 신학적 오해를 줄이는 가장 중립적이고 자연스러운 대응으로 ‘행위’를 선택했습니다.
theological_decisions:
- issue: 마지막 절의 하나님의 호의 표현
  chosen_reading: 이 절은 하나님께서 이미 그 사람의 삶의 행위를 호의적으로 여기셨다는 근거로 일상의 기쁨을 권면하며, 행위로 구원을 얻는다는 교리를 가르치지 않습니다.
  alternative_readings:
  - 제의적 제물 수납을 뜻할 수 있음
  - 일반적인 섭리적 호의로 볼 수 있음
  rationale: רצה + מעשים는 문맥상 호의적 수납/기쁨을 뜻할 수 있지만, 전도서는 일상적 선물을 누리라는 권면에 초점을 둡니다. ‘기뻐하셨다’는 번역은 평가적 어조를 보존하면서 교리적 과잉 해석을 피합니다.
  doctrine_reference: Affirmations; Translation philosophy §3
