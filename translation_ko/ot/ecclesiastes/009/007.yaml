  to: 가서 기쁨으로 빵을 먹고, 즐거운 마음으로 포도주를 마시십시오. 하나님께서 이미 당신의 행위를 기쁘게 여기셨기 때문입니다.[a]
  rationale: 마지막 절의 רָצָה를 ‘기쁘게 여기셨다’로 다듬어 하나님의 호의적 평가라는 의미를 명확히 했습니다. 명령 대상의 소유 표현은 한국어에서 자연스럽게 생략하되, 마지막 절에서는 원문의 단수 대상을 드러내기 위해 ‘당신의 행위’를 유지했습니다. 각주도 대안 번역이 마지막 절의 동사와 목적어에 직접 연결되도록 수정했습니다.
