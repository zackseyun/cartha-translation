translation:
  language: ko
  text: 나는 또 해 아래에서 이 지혜를 보았는데, 그것이 내게는 크게 여겨졌습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 지혜’라고 합니다. 문맥상 뒤이어 서술되는 지혜의 한 사례를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: also
  chosen_korean: 나도
  alternatives_korean:
  - 또한
  - 그리고 나도
  lexicon: HALOT
  rationale: 앞선 관찰에 덧붙이는 말이므로, 문두의 부가적 의미를 자연스럽게 살려 ‘나도’로 옮겼습니다.
- source_word: זֹה חָכְמָה
  english_pob_choice: this example of wisdom
  chosen_korean: 이런 지혜
  alternatives_korean:
  - 이 지혜
  - 지혜의 한 사례
  - 이런 지혜의 사례
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘이 지혜’이지만, 문맥상 구체적 사례를 가리키므로 한국어에서는 지나친 설명 없이 ‘이런 지혜’로 처리해 원문 구조와 의미를 함께 살렸습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 해 아래
  - 태양 아래에서
  lexicon: HALOT
  rationale: 전도서의 관용구를 직역하되 한국어 관용으로도 자연스럽게 들리도록 ‘해 아래에서’로 옮겼습니다.
- source_word: וּגְדוֹלָה הִיא אֵלַי
  english_pob_choice: and it was great to me
  chosen_korean: 그것은 나에게 매우 큰 것이었습니다
  alternatives_korean:
  - 그것은 제게 매우 중요했습니다
  - 그것은 제 눈에 매우 훌륭했습니다
  lexicon: HALOT
  rationale: ‘גדול’의 넓은 평가 의미를 살리면서, 화자에게 크게 보였다는 주관적 평가를 ‘나에게’로 분명히 했습니다.
theological_decisions:
- issue: 전도서의 평가어 ‘great’의 의미 범위
  chosen_reading: 여기서는 도덕적 칭찬보다 화자에게 크게 인식된 가치/중대함을 나타내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘훌륭했습니다’
  - ‘인상적이었습니다’
  rationale: 문맥이 지혜의 윤리적 선함보다 관찰자의 평가를 말하므로, 의미를 축소하지 않되 신학적 과잉해석도 피했습니다.
  doctrine_reference: 전도서 9장 문맥의 지혜 관찰과 인간 인식의 한계
