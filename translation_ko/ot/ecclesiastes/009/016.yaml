base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/016.yaml
  text: And I said[a], “Wisdom is better than strength,” but the wisdom of the poor man is despised[c][b], and his words are not heard.
  footnotes:
  - marker: a
    text: Or 'might' or 'power' for 'strength.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the poor man'; this likely refers back to the poor wise man in the preceding verse.
    reason: cross_reference
  - marker: c
    text: Or 'are not listened to' or 'go unheard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 말했습니다. “지혜가 힘보다 낫습니다. 그러나 가난한 사람의 지혜는 멸시를 받고, 그의 말은 들리지 않습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַרְתִּי אָנִי
  english_pob_choice: And I said
  chosen_korean: 그리고 내가 말했습니다
  alternatives_korean:
  - 그래서 내가 말했습니다
  - 그때 내가 말했습니다
  lexicon: WLC
  rationale: 단순한 서술 연결과 1인칭 회상의 흐름을 살려 직역에 치우치지 않으면서도 자연스러운 현대 한국어로 옮겼습니다.
- source_word: טוֹבָה חָכְמָה מִגְּבוּרָה
  english_pob_choice: Wisdom is better than strength
  chosen_korean: 지혜가 힘보다 낫습니다
  alternatives_korean:
  - 지혜가 능력보다 낫습니다
  - 지혜가 강함보다 낫습니다
  lexicon: WLC
  rationale: גְּבוּרָה는 문맥상 일반적인 ‘힘/강함’을 가리키므로, 비교 구문을 가장 직접적으로 살리는 표현을 택했습니다.
- source_word: בְּזוּיָה
  english_pob_choice: is despised
  chosen_korean: 업신여김을 받고
  alternatives_korean:
  - 멸시를 받고
  - 경멸을 받고
  lexicon: WLC
  rationale: 수동적 평가를 한국어 관용으로 자연스럽게 옮기기 위해 상태 서술보다 처우를 나타내는 표현을 사용했습니다.
- source_word: אֵינָם נִשְׁמָעִים
  english_pob_choice: are not heard
  chosen_korean: 들리지 않습니다
  alternatives_korean:
  - 듣지 않습니다
  - 귀 기울여지지 않습니다
  lexicon: WLC
  rationale: 히브리어의 ‘들려 받아들여지지 않음’을 간결하게 반영하되, 단순 청각 부재와 무시의 뉘앙스를 함께 담았습니다.
