  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּ/זֶ֔ה וְ/גַם מִ/זֶּ֖ה אַל תַּנַּ֣ח אֶת יָדֶ֑/ךָ כִּֽי יְרֵ֥א אֱלֹהִ֖ים יֵצֵ֥א אֶת כֻּלָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/018.yaml
  text: It is good that you should grasp this[a], and also not let your hand rest from that; for the one who fears God will come out with them all.
  footnotes:
  - marker: a
    text: Or 'will come forth from them all,' that is, emerge successfully from all these matters; some understand the sense more interpretively as 'will avoid them all.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것을 붙잡는 것이 좋습니다[a] — 또한 이쪽에서도 손을 거두지 마십시오. 하나님을 경외하는 사람은 그 모든 것 가운데서 벗어나게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모든 것에서 나와 성공적으로 벗어나게 됩니다,’ 곧 이 여러 문제를 잘 헤쳐 나간다는 뜻입니다. 어떤 이들은 더 해석적으로 ‘그 모든 것을 피하게 됩니다’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is good
  chosen_korean: 그것을 붙잡는 것이 좋습니다
  alternatives_korean:
  - 좋습니다
  - 그것을 붙잡는 것이 선합니다
  lexicon: HALOT
  rationale: 평가적 형용사 טוֹב의 권고적 힘을 살리되, 한국어에서는 자연스러운 문장으로 옮겼습니다.
- source_word: אֲשֶׁר תֶּאֱחֹז בָּזֶה
  english_pob_choice: that you should grasp this
  chosen_korean: 그것을 붙잡는 것이
  alternatives_korean:
  - 그것을 붙잡는 것
  - 이것을 붙드는 것이
  lexicon: HALOT
  rationale: אָחַז의 ‘붙잡다/붙들다’ 이미지를 살려 권고의 뉘앙스를 유지했습니다.
- source_word: וְגַם מִזֶּה אַל תַּנַּח אֶת יָדֶךָ
  english_pob_choice: and also not let your hand rest from that
  chosen_korean: 또한 이쪽에서도 손을 거두지 마십시오
  alternatives_korean:
  - 또한 거기서 손을 쉬지 마십시오
  - 또한 그것에서 손을 떼지 마십시오
  lexicon: HALOT
  rationale: נוח의 핵심인 ‘쉬게 하다/놓아두다’와 손의 관용구를 살리면서, 한국어에서 이해되는 ‘손을 거두다’로 옮겼습니다.
- source_word: יֵצֵא אֶת כֻּלָּם
  english_pob_choice: will come out with them all
  chosen_korean: 그 모든 것 가운데서 벗어나게 됩니다
  alternatives_korean:
  - 그 모든 것과 함께 나오게 됩니다
  - 그 모든 것에서 나오게 됩니다
  lexicon: HALOT
  rationale: ‘come out’의 직유를 과도하게 풀지 않으면서, 문맥상 두 가지 대상 모두와 관련해 ‘벗어나다/빠져나오다’의 열린 의미를 유지했습니다.
theological_decisions:
- issue: 끝절의 의미가 압축적이고 해석이 갈리는 점
  chosen_reading: 의인/경외자는 앞의 권고들 가운데서 안전하게 벗어나거나 바르게 지나가게 된다는 열린 의미로 유지했습니다.
  alternative_readings:
  - 둘 다 피하게 된다
  - 둘 다 감당하게 된다
  rationale: 히브리어가 결론을 단정하지 않으므로, 해석을 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
