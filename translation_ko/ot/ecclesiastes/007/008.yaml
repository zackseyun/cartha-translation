id: ECC.7.8
reference: Ecclesiastes 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֛וֹב אַחֲרִ֥ית דָּבָ֖ר מֵֽ/רֵאשִׁית֑/וֹ ט֥וֹב אֶֽרֶךְ ר֖וּחַ מִ/גְּבַהּ רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/008.yaml
  text: The end of a matter is better than its beginning[a]; patience is better than a proud spirit.
  footnotes:
  - marker: a
    text: Literally, 'long of spirit,' an idiom for patience or forbearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 사건의 끝이 그 시작보다 낫습니다[a]. 참는 마음이 교만한 영보다 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘영이 긴(long of spirit)’이라는 관용구로, 인내 또는 오래 참음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב / אַחֲרִית
  english_pob_choice: better / the end
  chosen_korean: 끝이 … 낫습니다
  alternatives_korean:
  - 마침이 … 낫습니다
  - 결말이 … 낫습니다
  lexicon: WLC / HALOT
  rationale: טוֹב의 비교 의미를 한국어 자연문으로 옮기기 위해 ‘낫습니다’를 썼고, אַחֲרִית는 지혜문맥의 대비를 살리는 ‘끝’이 가장 직관적입니다.
- source_word: דָּבָר
  english_pob_choice: a matter
  chosen_korean: 사건
  alternatives_korean:
  - 일
  - 문제
  - 일의 경과
  lexicon: HALOT
  rationale: דָּבָר는 ‘말/일/사안’ 등 폭이 넓지만, 문장 전체가 시작과 끝의 대비를 말하므로 ‘사건’이 한국어에서 가장 자연스럽게 그 진행과 결말을 함께 드러냅니다.
- source_word: אֶרֶךְ רוּחַ
  english_pob_choice: patience
  chosen_korean: 참는 마음
  alternatives_korean:
  - 오래 참고 견디는 마음
  - 인내
  lexicon: HALOT
  rationale: 직역하면 ‘영이 긴’ 표현이지만, POB가 주석으로 밝힌 관용적 뜻은 인내/관용입니다. 한국어에서는 ‘참는 마음’이 그 뜻을 자연스럽게 살립니다.
- source_word: מִגְּבַהּ רוּחַ
  english_pob_choice: than a proud spirit
  chosen_korean: 교만한 영
  alternatives_korean:
  - 거만한 영
  - 높은 영
  - 오만한 마음
  lexicon: HALOT
  rationale: גְּבַהּ רוּחַ는 내적 태도의 높아짐, 곧 교만을 뜻하므로 ‘교만한 영’이 원문의 ‘영’ 이미지를 유지하면서도 부정적 의미를 분명히 합니다.
