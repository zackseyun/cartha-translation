id: ECC.7.17
reference: Ecclesiastes 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּרְשַׁ֥ע הַרְבֵּ֖ה וְ/אַל תְּהִ֣י סָכָ֑ל לָ֥/מָּה תָמ֖וּת בְּ/לֹ֥א עִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/017.yaml
  text: Do not be excessively wicked, and do not be a fool. Why should you die before your time?
  footnotes:
  - marker: a
    text: Or 'Do not be too wicked.' The Hebrew includes a degree term, creating a deliberate tension with the surrounding context rather than approving any amount of wickedness.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'in not your time.' That is, before your proper or expected time.
    reason: lexical_alternative
translation:
  language: ko
  text: 지나치게 악하지 말고[a], 어리석은 사람이 되지도 마십시오. 어찌하여 제때가 되기 전에 죽으시겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너무 악하지 말라’입니다. 히브리어는 정도 표현을 포함하여, 어떤 악도 승인하지 않으면서도 문맥의 긴장을 의도적으로 남깁니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너의 때가 아닌 때에’입니다. 곧 제때, 혹은 마땅히 기대되는 때보다 이르게라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְשַׁע הַרְבֵּה
  english_pob_choice: be excessively wicked
  chosen_korean: 너무 악하지 말고
  alternatives_korean:
  - 지나치게 악하지 말고
  - 몹시 악하지 말고
  lexicon: HALOT
  rationale: הַרְבֵּה의 정도 부사를 살려 ‘너무/지나치게’로 옮기되, 한국어에서 자연스럽고 경구체로 들리는 표현을 택했습니다. ‘악하다’는 רשע의 도덕적 범주를 직접 반영합니다.
- source_word: וְאַל תְּהִי סָכָל
  english_pob_choice: and do not be a fool
  chosen_korean: 어리석은 사람이 되지도 마십시오
  alternatives_korean:
  - 어리석지 마십시오
  - 우매한 사람이 되지도 마십시오
  lexicon: HALOT
  rationale: היה + 명사 구조를 한국어에서는 ‘~한 사람이 되다’로 옮겨 סָכָל의 명사적 힘을 살렸습니다. ‘어리석다’보다 ‘어리석은 사람’이 원문의 경고성을 더 잘 드러냅니다.
- source_word: לָמָּה תָמוּת
  english_pob_choice: Why should you die
  chosen_korean: 어찌하여 … 죽으려 하십니까
  alternatives_korean:
  - 왜 죽으려 하십니까
  - 어찌하여 죽어야 하십니까
  lexicon: HALOT
  rationale: 수사적 질문의 압박을 살리기 위해 ‘어찌하여’를 택했습니다. עתיד형의 경고성을 한국어에서는 ‘죽으려 하십니까’로 자연스럽게 풀었습니다.
- source_word: בְּלֹא עִתֶּךָ
  english_pob_choice: before your time
  chosen_korean: 제때가 되기 전에
  alternatives_korean:
  - 때가 되기 전에
  - 당신의 때가 오기 전에
  - 정해진 때 전에
  lexicon: HALOT
  rationale: 히브리어의 직역보다 ‘before your time’의 의미를 분명하게 전달하는 한국어 관용 표현을 사용했습니다. ‘제때’는 본래 시간/적기라는 뜻을 살리면서도 과도한 해석을 피합니다.
theological_decisions:
- issue: 지혜 문맥에서 ‘악을 조금은 허용하라’는 뜻처럼 들릴 가능성
  chosen_reading: 원문의 긴장—‘지나친 악’이라는 경고—을 유지하되, 어떤 수준의 악도 권하는 뜻으로 읽히지 않게 번역했습니다.
  alternative_readings:
  - 전혀 악하지 말고
  - 너무 악하지 말고
  rationale: 전후 문맥이 ‘지나치게 의롭지 말라’는 역설적 경구를 이어가므로, 의미를 평평하게 만들지 않고 정도 표현을 살렸습니다. 다만 한국어에서는 오해를 막기 위해 ‘악하지 말고’로 시작해 금지의 성격을 분명히 했습니다.
  doctrine_reference: Translation philosophy §3
