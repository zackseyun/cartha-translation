reference: Ecclesiastes 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל רָאִ֖יתִי בִּ/ימֵ֣י הֶבְלִ֑/י יֵ֤שׁ צַדִּיק֙ אֹבֵ֣ד בְּ/צִדְק֔/וֹ וְ/יֵ֣שׁ רָשָׁ֔ע מַאֲרִ֖יךְ בְּ/רָעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/015.yaml
  text: 'I have seen it all in the days of my vanity: there is a righteous man perishing in his righteousness[c][b][a], and there is a wicked man prolonging his life in his evil.'
  footnotes:
  - marker: a
    text: Or 'in the days of my fleetingness' or 'in the days of my vapor.' The Hebrew הֶבֶל, a key word in Ecclesiastes, suggests transience, elusiveness, and frustration.
    reason: lexical_alternative
  - marker: b
    text: Or 'perishing despite his righteousness.' The Hebrew can be read more than one way; the main text preserves the ambiguity.
    reason: alternative_reading
  - marker: c
    text: Or 'prolonging his life despite his evil' or 'lengthening his days in his evil.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 내 헛됨의 날들에 이 모든 것을 보았습니다. 의인 한 사람이 자기의 의 안에서 망해 가는 일도 있고, 악인 한 사람이 자기의 악 안에서 자기의 생명을 길게 누리는 일도 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 덧없음의 날들에' 혹은 '내 바람 같은 날들에'. 전도서의 핵심어 הֶבֶל은 덧없음, 잡힘 없음, 좌절의 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그의 의에도 불구하고 망하는'. 히브리어는 여러 방식으로 읽을 수 있으며, 본문은 그 모호성을 그대로 둡니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '그의 악에도 불구하고 자기의 생명을 길게 누리는' 혹은 '그의 악 안에서 자기의 날을 길게 하는'.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶת הַכֹּל / רָאִיתִי
  english_pob_choice: I have seen it all
  chosen_korean: 이 모든 것을 보았습니다
  alternatives_korean:
  - 다 보았습니다
  - 모든 것을 보았습니다
  lexicon: HALOT
  rationale: 전면성을 살리면서도 한국어에서 자연스러운 관찰 서술로 옮겼습니다. '보았습니다'는 전도서의 회고적 어조를 잘 반영합니다.
- source_word: בִּימֵי הֶבֶלִי
  english_pob_choice: in the days of my vanity
  chosen_korean: 내 헛됨의 날들에
  alternatives_korean:
  - 내 허무의 날들에
  - 내 덧없음의 날들에
  - 내 바람 같은 날들에
  lexicon: HALOT
  rationale: הֶבֶל의 핵심인 덧없음·허무의 의미를 살리되, 전도서의 반복어로서의 연결성을 위해 '헛됨'을 택했습니다. '날들에'는 히브리어 직역감을 유지합니다.
- source_word: בְּצִדְקוֹ
  english_pob_choice: in his righteousness
  chosen_korean: 자기의 의 안에서
  alternatives_korean:
  - 그의 의 가운데
  - 그의 의로 인해
  - 의로움 속에서
  lexicon: HALOT
  rationale: ב의 의미를 단정하지 않고 '안에서'로 옮겨, 의의 상태/정황 속에서 망하는 역설을 보존했습니다. '의'는 전도서의 윤리적 어휘에 맞습니다.
- source_word: אֹבֵד
  english_pob_choice: perishing
  chosen_korean: 망해 가는
  alternatives_korean:
  - 멸망하는
  - 죽어 가는
  - 사라져 가는
  lexicon: HALOT
  rationale: 진행 중인 붕괴·파멸의 뉘앙스를 살려 '망해 가는'으로 옮겼습니다. 단순한 죽음보다 넓은 의미를 유지합니다.
- source_word: מַאֲרִיךְ
  english_pob_choice: prolonging his life
  chosen_korean: 자기의 생명을 길게 누리는
  alternatives_korean:
  - 자기 생명을 연장하는
  - 오래 사는
  - 자기의 날을 길게 하는
  lexicon: HALOT
  rationale: 히브리어의 '길게 하다'를 한국어에서 자연스럽게 풀어, 삶의 연장이 아니라 삶을 '길게 누림'이라는 관찰적 표현으로 처리했습니다.
- source_word: בְּרָעָתוֹ
  english_pob_choice: in his evil
  chosen_korean: 자기의 악 안에서
  alternatives_korean:
  - 자기의 악 가운데
  - 악함 속에서
  - 자기의 악으로
  lexicon: HALOT
  rationale: 앞 구와 같은 전치사 구조를 맞추어 평행법과 의미의 개방성을 유지했습니다. '악'은 רָעָה의 직접적인 어휘 대응입니다.
theological_decisions:
- issue: ב in בְּצִדְקוֹ / בְּרָעָתוֹ의 의미 확정 여부
  chosen_reading: '''의 안에서'' / ''악 안에서''로 옮겨, ''때문에''나 ''에도 불구하고''로 단정하지 않았습니다.'
  alternative_readings:
  - 의 때문에 / 악 때문에
  - 의에도 불구하고 / 악에도 불구하고
  rationale: 이 구절은 의인과 악인의 삶이 예상과 다르게 전개되는 역설을 관찰합니다. 히브리어의 전치사 유연성을 한국어에서도 열어 두어, 해석을 본문 밖에서 과도하게 결정하지 않았습니다.
  doctrine_reference: Translation philosophy §3
- issue: הֶבֶל의 한국어 재현
  chosen_reading: '''헛됨''으로 옮기되 전도서의 반복 핵심어로 유지했습니다.'
  alternative_readings:
  - 허무
  - 덧없음
  - 바람
  rationale: 여기서 הֶבֶל은 윤리적 자기비하가 아니라 삶의 덧없고 잡히지 않는 성격을 가리킵니다. 전도서 전체의 어휘 연결을 위해 관용적이면서도 신학적으로 중립적인 '헛됨'을 선택했습니다.
  doctrine_reference: Translation philosophy §5
