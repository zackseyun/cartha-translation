translation:
  language: ko
  text: 너무 의롭지 마십시오[a]. 또 지나치게 지혜로운 사람이 되려 하지 마십시오. 어찌하여 자신을 망하게 하시겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
