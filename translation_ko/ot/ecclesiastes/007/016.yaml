source:
  edition: WLC
  text: אַל תְּהִ֤י צַדִּיק֙ הַרְבֵּ֔ה וְ/אַל תִּתְחַכַּ֖ם יוֹתֵ֑ר לָ֖/מָּה תִּשּׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/016.yaml
  text: Do not be overly righteous[a], and do not make yourself too wise[b]. Why should you ruin yourself?
  footnotes:
  - marker: a
    text: Or 'Do not be too righteous, and do not make yourself excessively wise.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Why should you destroy yourself?' The Hebrew verb can also carry the sense of becoming desolated or appalled.
    reason: lexical_alternative
translation:
  language: ko
  text: 너무 의롭지 마십시오[a]. 또 지나치게 지혜롭다고 여기지도 마십시오[b]. 어찌하여 자신을 망하게 하시겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너무 의롭지 마십시오. 지나치게 의롭지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어찌하여 자신을 망하게 하시겠습니까?’ 히브리어 동사는 ‘황폐해지다’ 또는 ‘경악하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִ֤י
  english_pob_choice: Do not be
  chosen_korean: …마십시오
  alternatives_korean:
  - …하지 마십시오
  - …되지 마십시오
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지문을 현대 한국어 금지 표현으로 자연스럽게 옮겼습니다.
- source_word: צַדִּיק הַרְבֵּה
  english_pob_choice: overly righteous
  chosen_korean: 너무 의롭지
  alternatives_korean:
  - 지나치게 의롭지
  - 너무 의롭다고 여겨지지
  lexicon: HALOT
  rationale: צַדִּיק을 ‘의롭다’로, הַרְבֵּה를 ‘너무’로 옮겨 의로움 자체를 부정하지 않고 과도함을 드러냈습니다.
- source_word: תִּתְחַכַּם יוֹתֵר
  english_pob_choice: make yourself too wise
  chosen_korean: 지나치게 지혜롭다고 여기지도
  alternatives_korean:
  - 너무 지혜롭다고 여기지도
  - 스스로 너무 지혜롭게 만들지도
  lexicon: HALOT
  rationale: 히트파엘형의 자기지향적 뉘앙스를 살려 ‘스스로 지혜롭게 꾸미다’의 뜻을 ‘지혜롭다고 여기다’로 자연스럽게 반영했습니다.
- source_word: תִּשּׁוֹמֵם
  english_pob_choice: ruin yourself
  chosen_korean: 자신을 망하게 하시겠습니까
  alternatives_korean:
  - 스스로 황폐해지겠습니까
  - 자신을 황폐하게 하시겠습니까
  lexicon: HALOT
  rationale: 문맥상 경고의 결론을 살려 ‘망하게 하다’로 옮겼고, שמם의 ‘황폐해지다/망하다’ 가능성을 과도하게 풀이하지 않도록 했습니다.
theological_decisions:
- issue: 의로움과 지혜 자체를 금하는가, 아니면 과도함을 경계하는가
  chosen_reading: 이 구절은 의로움과 지혜 자체를 부정하기보다, 그것들의 과도함이나 자기의에 가까운 추구를 경계합니다.
  alternative_readings:
  - 의로움과 지혜를 전반적으로 비판하는 말
  - 겉으로 드러나는 경건만 경계하는 말
  rationale: הַרְבֵּה와 יוֹתֵר가 ‘지나침’을 표시하고, 다음 절의 대칭적 경고와도 맞물려 극단을 경계하는 말로 읽는 것이 본문 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
