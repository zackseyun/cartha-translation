  source_fidelity: 첫 금지문은 צַדִּיק הַרְבֵּה를 ‘너무 의롭지 마십시오’로 충실히 옮겼습니다. 그러나 תִּתְחַכַּם의 히트파엘형은 단순히 자신을 지혜롭다고 ‘여기는’ 내적 판단보다 스스로 지나치게 지혜로운 사람이 되려 하거나 그렇게 처신하는 자기지향적 뉘앙스를 나타냅니다. 이를 더 가깝고 자연스러운 표현으로 조정했습니다. תִּשּׁוֹמֵם은 문맥상 ‘자신을 망하게 하다’로 옮길 수 있으며, 대안적 의미는 각주로 보존했습니다.
  naturalness: 합쇼체와 문장 흐름은 전반적으로 자연스럽습니다. 다만 ‘지혜롭다고 여기지도 마십시오’는 원문의 동작을 인식·판단으로 좁힐 수 있어, ‘지혜로운 사람이 되려 하지 마십시오’가 현대 표준어에서 더 매끄럽고 원문의 자기지향성을 더 잘 드러냅니다.
  terminology: ‘의롭다’, ‘지혜롭다’, ‘망하게 하다’는 적절합니다. 각주 a의 현행 문구는 동일한 내용을 반복하며 대안 번역으로 기능하지 않습니다. 또한 שמם 관련 각주는 마지막 질문에 붙어야 하므로 앵커를 옮겼습니다.
