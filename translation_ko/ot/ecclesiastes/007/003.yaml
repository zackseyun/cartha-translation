source:
  edition: WLC
  text: ט֥וֹב כַּ֖עַס מִ/שְּׂחֹ֑ק כִּֽי בְ/רֹ֥עַ פָּנִ֖ים יִ֥יטַב לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/003.yaml
  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
  footnotes:
  - marker: a
    text: Or 'Anger is better than laughter,' since Hebrew כַּעַס can also mean 'anger' or 'vexation.' Here it is rendered 'sorrow' because the context emphasizes the beneficial effect of grief or seriousness rather than anger itself.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for by the badness of face the heart becomes good.' The Hebrew idiom refers to a sad or troubled countenance.
    reason: lexical_alternative
translation:
  language: ko
  text: 슬픔은 웃음보다 낫습니다[a]. 이는 얼굴이 어두울 때 마음이 나아지기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּעַס는 ‘슬픔’ 외에도 ‘분노’ 또는 ‘번민’으로도 옮길 수 있습니다. 여기서는 웃음과 대비되는 유익한 슬픔의 의미를 살려 ‘슬픔’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘얼굴의 나쁨으로 마음이 좋아진다’에 가깝습니다. 이는 슬프거나 침울한 표정을 가리키는 히브리어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִשְּׂחוֹק
  english_pob_choice: better than laughter
  chosen_korean: 웃음보다 낫습니다
  alternatives_korean:
