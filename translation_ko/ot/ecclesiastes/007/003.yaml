id: ECC.7.3
reference: Ecclesiastes 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֥וֹב כַּ֖עַס מִ/שְּׂחֹ֑ק כִּֽי בְ/רֹ֥עַ פָּנִ֖ים יִ֥יטַב לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/003.yaml
  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
  footnotes:
  - marker: a
    text: Or 'Anger is better than laughter,' since Hebrew כַּעַס can also mean 'anger' or 'vexation.' Here it is rendered 'sorrow' because the context emphasizes the beneficial effect of grief or seriousness rather than anger itself.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for by the badness of face the heart becomes good.' The Hebrew idiom refers to a sad or troubled countenance.
    reason: lexical_alternative
translation:
  language: ko
  text: 슬픔은 웃음보다 낫습니다. 이는 얼굴의 어두움으로 마음이 나아지기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּעַס는 ‘슬픔’ 외에도 ‘분노’ 또는 ‘번민’으로도 옮길 수 있습니다. 여기서는 웃음과 대비되는 유익한 슬픔의 의미를 살려 ‘슬픔’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘얼굴의 나쁨으로 마음이 좋아진다’에 가깝습니다. 이는 슬프거나 침울한 표정을 가리키는 히브리어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִשְּׂחוֹק
  english_pob_choice: better than laughter
  chosen_korean: 웃음보다 낫습니다
  alternatives_korean:
  - 웃음보다 좋습니다
  - 희락보다 낫습니다
  lexicon: HALOT
  rationale: 비교 구문이므로 טוֹב는 ‘좋다’보다 비교급인 ‘낫다’가 자연스럽고, שְׂחוֹק은 문맥상 ‘웃음’이 가장 직접적입니다.
- source_word: כַּעַס
  english_pob_choice: sorrow
  chosen_korean: 슬픔
  alternatives_korean:
  - 분노
  - 번민
  - 근심
  lexicon: HALOT
  rationale: כעס는 ‘분노’도 가능하지만, 이 절은 웃음과 대비되는 유익한 정서적 무게를 말하므로 ‘슬픔’이 POB의 해석을 가장 잘 반영합니다.
- source_word: בְ/רֹעַ פָּנִים
  english_pob_choice: by a sad face
  chosen_korean: 얼굴의 어두움으로
  alternatives_korean:
  - 슬픈 얼굴로
  - 침울한 얼굴로
  - 얼굴의 나쁨으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역 의미인 ‘얼굴의 나쁨/어두움’을 살리되, 한국어에서는 ‘어두움’이 비유적·관용적 의미를 가장 자연스럽게 전달합니다.
- source_word: יִיטַב לֵב
  english_pob_choice: the heart is made better
  chosen_korean: 마음이 나아집니다
  alternatives_korean:
  - 마음이 좋아집니다
  - 마음이 유익을 얻습니다
  - 마음이 더 좋아집니다
  lexicon: HALOT
  rationale: יָטַב은 ‘좋아지다/나아지다’의 뜻이므로, ‘나아지다’가 마음에 미치는 유익을 간결하게 전달하면서 과도한 심리화도 피합니다.
theological_decisions:
- issue: 슬픔과 웃음의 대비를 도덕 판단으로 과잉 해석할지 여부
  chosen_reading: 이 절은 웃음 자체를 악으로 정죄하기보다, 슬픔이 사람의 내면을 유익하게 할 수 있다는 지혜적 비교로 읽었습니다.
  alternative_readings:
  - 웃음을 부정적으로 보는 금욕적 교훈
  - 분노를 뜻하는 כעס을 따라 윤리적 분노와 웃음을 대비하는 읽기
  rationale: 문맥과 POB의 설명은 ‘anger’ 가능성을 인정하되, 여기서는 grief/seriousness의 유익을 강조하므로 정죄적 해석을 피하는 것이 본문에 더 충실합니다.
  doctrine_reference: 전도서 7장의 지혜 문맥
