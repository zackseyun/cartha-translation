id: ECC.7.19
reference: Ecclesiastes 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ/חָכְמָ֖ה תָּעֹ֣ז לֶ/חָכָ֑ם מֵֽ/עֲשָׂרָה֙ שַׁלִּיטִ֔ים אֲשֶׁ֥ר הָי֖וּ בָּ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/019.yaml
  text: Wisdom gives strength to a wise man more than ten rulers who were in a city[a].
  footnotes:
  - marker: a
    text: Or "in the city." The Hebrew form can be read definitely, but the saying appears to be general rather than tied to a specific city.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜는 한 성읍에 있는 열 명의 통치자보다 한 지혜로운 사람에게 힘을 줍니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 성읍에 있는.” 히브리어 형태는 분명하게 읽을 수 있지만, 이 말은 특정한 도시가 아니라 일반적인 경우를 말하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחָכְמָה
  english_pob_choice: Wisdom
  chosen_korean: 지혜는
  alternatives_korean:
  - 지혜가
  - 그 지혜가
  lexicon: HALOT
  rationale: 히브리어 정관사가 붙어 있지만, 잠언적 문맥에서는 한국어에서도 추상명사를 주어로 자연스럽게 살리는 편이 적절합니다.
- source_word: תָּעֹז
  english_pob_choice: gives strength to
  chosen_korean: 힘을 줍니다
  alternatives_korean:
  - 강하게 합니다
  - 굳세게 합니다
  - 강건하게 합니다
  lexicon: HALOT
  rationale: 동사의 사역적 의미를 살리면서도 한국어에서 어색하지 않게 ‘힘을 주다’로 옮겼습니다.
- source_word: לֶחָכָם
  english_pob_choice: to a wise man
  chosen_korean: 한 지혜로운 사람에게
  alternatives_korean:
  - 지혜로운 사람에게
  - 한 현자에게
  lexicon: HALOT
  rationale: ל의 이익·대상 의미를 ‘-에게’로 반영했고, 잠언의 일반적 진술이므로 특정 인물을 가리키지 않도록 ‘한’으로 처리했습니다.
- source_word: מֵעֲשָׂרָה שַׁלִּיטִים
  english_pob_choice: more than ten rulers
  chosen_korean: 열 명의 통치자보다
  alternatives_korean:
  - 열 통치자보다
  - 열 명의 권력자보다
  - 열 명의 지배자보다
  lexicon: HALOT
  rationale: מ의 비교 의미를 ‘-보다’로 풀고, שַׁלִּיטִים은 통치권을 가진 자로서 가장 सीधे한 ‘통치자’로 옮겼습니다.
- source_word: בָּעִיר
  english_pob_choice: who were in a city
  chosen_korean: 한 성읍에 있는
  alternatives_korean:
  - 그 성읍에 있는
  - 도시에 있는
  lexicon: HALOT
  rationale: 영어 POB의 주석이 시구를 일반적 속담으로 읽도록 했으므로, 특정 도시가 아닌 일반성을 살려 ‘한 성읍’으로 옮겼습니다.
theological_decisions:
- issue: 속담적 일반성 대 특정 도시성
  chosen_reading: 이 절은 특정한 한 도시를 지칭하기보다 일반적인 도시를 가리키는 지혜 문장으로 읽었습니다.
  alternative_readings:
  - 그 성읍에 있는 열 명의 통치자
  - 어느 특정 도시 안의 열 명의 통치자
  rationale: 영어 POB 주석이 the city로도 읽을 수 있으나 격언은 일반 진술일 가능성이 크다고 밝히므로, 한국어에서도 그 일반성을 드러냈습니다.
  doctrine_reference: 문맥적 해석 원칙, 잠언적/격언적 문장 읽기
- issue: 동사의 사역적 뉘앙스
  chosen_reading: ‘힘을 줍니다’로 사역적 힘의 공급을 표현했습니다.
  alternative_readings:
  - 강하게 합니다
  - 강건하게 합니다
  rationale: 히브리어 동사가 단순한 상태 서술보다 ‘힘을 부여함’에 가깝다는 주석 전통과 POB의 영어 선택을 반영했습니다.
  doctrine_reference: 원어 의미 보존, 사역 뉘앙스
