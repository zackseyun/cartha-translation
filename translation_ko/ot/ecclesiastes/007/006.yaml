source:
  edition: WLC
  text: כִּ֣י כְ/ק֤וֹל הַ/סִּירִים֙ תַּ֣חַת הַ/סִּ֔יר כֵּ֖ן שְׂחֹ֣ק הַ/כְּסִ֑יל וְ/גַם זֶ֖ה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/006.yaml
  text: For like the crackling of thorns under a pot[a], so is the laughter of the fool[b]; this too is vapor.
  footnotes:
  - marker: a
    text: Or 'like the sound of thorns under the pot.' The Hebrew says literally 'like the sound/voice of thorns,' while the context suggests the sharp crackling noise they make when burned.
    reason: lexical_alternative
  - marker: b
    text: Hebrew hebel, often rendered 'vanity' or 'breath.' Here 'vapor' preserves the image of something fleeting and insubstantial.
    reason: lexical_alternative
translation:
  language: ko
  text: 가시나무가 냄비 밑에서 타며 타닥거리는 소리처럼[a], 어리석은 자의 웃음도 이와 같습니다. 이것도 헛됨입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘가시들의 소리’라고 합니다. 문맥에서는 냄비 밑의 연료로 쓰인 가시나무가 탈 때 나는 날카로운 타닥거림을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 헤벨(hebel)은 본디 ‘입김’ 또는 ‘수증기’를 가리키며, 전도서에서는 덧없고 붙잡을 수 없는 것을 비유하는 핵심어입니다. 여기서는 전통적인 표현인 ‘헛됨’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְקֹול הַסִּירִים
  english_pob_choice: like the crackling of thorns
  chosen_korean: 가시를 냄비 아래에서 태울 때 나는 타닥거리는 소리처럼
  alternatives_korean:
  - 가시가 냄비 아래에서 타는 소리처럼
  - 가시의 소리처럼
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘가시들의 소리’이지만, 문맥상 불에 탈 때 나는 날카로운 소리가 핵심이므로 한국어에서는 감각적으로 자연한 ‘타닥거리는 소리’로 옮겼습니다.
- source_word: הַכְּסִיל
  english_pob_choice: the fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 바보
  - 우매한 자
  lexicon: HALOT
  rationale: 지혜문학의 מוסרי-지적 범주를 살리기 위해 일상적 조롱어보다 중립적이면서도 평가를 담는 ‘어리석은 자’를 택했습니다.
- source_word: הָבֶל
  english_pob_choice: vapor
  chosen_korean: 헛됨
  alternatives_korean:
  - 입김
  - 증기
  - 허무
  lexicon: HALOT
  rationale: 히브리어 이미지인 ‘숨/증기’의 구체성은 살리되, 한국어에서 전도서의 반복 주제와 자연스럽게 연결되는 ‘헛됨’으로 번역했습니다. 다만 물리적 이미지 자체를 과도하게 약화시키지 않도록 간결하게 유지했습니다.
theological_decisions:
- issue: וְגַם זֶה הָבֶל의 평가 강도
  chosen_reading: ‘이것도 헛됨입니다’로 단정적으로 옮겨, 전도자의 평가 문장을 약화하지 않았습니다.
  alternative_readings:
  - 이것도 허무합니다
  - 이것도 증기 같습니다
  rationale: 문맥은 단순한 감상이 아니라 지혜자의 판정이므로, 한국어에서도 평가적 결론을 분명히 드러내는 표현이 적절합니다.
  doctrine_reference: 전도서의 반복되는 הבל 진술은 삶의 덧없음에 대한 신학적 평가로 기능합니다.
