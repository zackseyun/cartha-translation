id: ECC.7.14
reference: Ecclesiastes 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/י֤וֹם טוֹבָה֙ הֱיֵ֣ה בְ/ט֔וֹב וּ/בְ/י֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת זֶ֤ה לְ/עֻמַּת זֶה֙ עָשָׂ֣ה הָֽ/אֱלֹהִ֔ים עַל דִּבְרַ֗ת שֶׁ/לֹּ֨א יִמְצָ֧א הָֽ/אָדָ֛ם אַחֲרָ֖י/ו מְאֽוּמָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/014.yaml
  text: 'In a day of prosperity[a], be joyful; and in a day of adversity, consider: God has made the one as well as the other[c][b], so that man may not find out anything that will come after him.'
  footnotes:
  - marker: a
    text: Or, 'be joyful' or 'enjoy the good.' The Hebrew expression is idiomatic.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'man,' used here in a representative sense for humanity.
    reason: lexical_alternative
  - marker: c
    text: Or, 'find out anything after him,' that is, discover what will happen in the future.
    reason: alternative_reading
translation:
  language: ko
  text: 형통할 때에는 좋은 것을 누리십시오[a]. 역경을 겪을 때에는 생각해 보십시오. 하나님께서는 이것도 저것에 맞추어 만드셨습니다. 이는 사람이[b] 자기 뒤에 무엇이 올지를 아무것도 찾아낼 수 없게 하시려는 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기뻐하십시오’, ‘좋음을 누리십시오’로 옮길 수 있습니다. 히브리어 표현은 관용적입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사람’으로, 여기서는 대표적 의미로 인간을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기 뒤에 아무것도 찾아내지 못하게’라는 뜻입니다. 곧 미래에 일어날 일을 알아내지 못한다는 말입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם טוֹבָה / הֱיֵה בְטוֹב
  english_pob_choice: In a day of prosperity, be joyful
  chosen_korean: 좋은 날에는 즐거워하십시오
  alternatives_korean:
  - 형통한 날에는 기뻐하십시오
  - 좋은 때에는 즐거워하십시오
  - 풍요의 날에는 기뻐하십시오
  lexicon: HALOT
  rationale: טוֹבָה는 단순한 ‘좋음’보다 형통한 형편을 가리키므로 ‘좋은 날’로 풀되, הֱיֵה בְטוֹב의 관용적 권면을 자연스러운 명령형 ‘즐거워하십시오’로 옮겼습니다.
- source_word: וּבְיוֹם רָעָה / רְאֵה
  english_pob_choice: and in a day of adversity, consider
  chosen_korean: 재앙의 날에는 생각하십시오
  alternatives_korean:
  - 환난의 날에는 생각하십시오
  - 역경의 날에는 숙고하십시오
  - 재난의 날에는 살펴보십시오
  lexicon: HALOT
  rationale: רָעָה는 이 문맥에서 도덕적 악이 아니라 재난·역경을 뜻하므로 ‘재앙’으로 옮겼고, רְאֵה는 단순 시각보다 숙고의 뜻이 강해 ‘생각하십시오’로 번역했습니다.
- source_word: עָשָׂה הָאֱלֹהִים
  english_pob_choice: God has made the one as well as the other
  chosen_korean: 하나님이 이 둘을 모두 만드셨으니
  alternatives_korean:
  - 하나님이 이 둘을 다 지으셨으니
  - 하나님이 이것과 저것을 모두 만드셨으니
  - 하나님이 한쪽과 다른 쪽을 모두 만드셨으니
  lexicon: HALOT
  rationale: ‘이 둘’은 앞의 형통과 재앙을 가리키는 대응을 살리고, ‘만드셨으니’로 원문의 신적 행위를 직접적으로 드러냈습니다.
- source_word: שֶׁלֹּא יִמְצָא הָאָדָם אַחֲרָיו מְאוּמָה
  english_pob_choice: so that man may not find out anything that will come after him
  chosen_korean: 사람은 자기 뒤에 올 일을 아무것도 찾아낼 수 없게 하려 하심입니다
  alternatives_korean:
  - 사람이 자기 뒤에 올 일을 아무것도 알아낼 수 없게 하려 하심입니다
  - 사람이 이후의 일을 아무것도 찾아내지 못하게 하려 하심입니다
  - 사람이 자기 뒤에 무엇이 올지 아무것도 알 수 없게 하려 하심입니다
  lexicon: HALOT
  rationale: הָאָדָם의 대표적 인간 의미를 살려 ‘사람’으로 옮기고, אַחֲרָיו와 מְאוּמָה의 결합은 미래를 ‘자기 뒤에 올 일’로 구체화하되 과도한 해석은 피했습니다.
theological_decisions:
- issue: 하나님이 형통과 재앙을 모두 만드셨다는 진술
  chosen_reading: 본문의 긴장을 완화하지 않고, 형통과 재앙 모두에 대한 하나님의 주권적 행위를 그대로 드러냈습니다.
  alternative_readings:
  - 재앙에 대한 직접적 원인 진술을 약화해 ‘한쪽에 대응하는 다른 쪽을 만드셨다’고 순화하는 읽기
  - 섭리를 일반론적으로만 처리하는 읽기
  rationale: 히브리어 원문은 대조되는 두 현실을 모두 하나님의 행위로 돌리므로, 번역도 그 신학적 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: הָאָדָם의 번역
  chosen_reading: 대표적 인간을 가리키는 ‘사람’으로 번역하되, 문맥상 남성 단수 형식의 대표성을 유지했습니다.
  alternative_readings:
  - 인류
  - 한 사람
  - 사람들
  rationale: 본문은 일반적 인간을 뜻하지만 문법상 단수 남성형이므로, 과도한 중립화보다 대표성 있는 ‘사람’이 원문 구조를 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §4; Contested terms table for אָדָם.
