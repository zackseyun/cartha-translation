translation:
  language: ko
  text: 오직 이것을 보십시오. 하나님께서 사람을 올바르게 지으셨으나, 그들은 많은 꾀를 찾아냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘인류’: ‘하나님께서 인류를 올바르게 지으셨으나, 그들은 많은 꾀를 찾아냈습니다.’'
    reason: alternative_reading
  - marker: b
    text: 또는 ‘많은 장치들’, ‘많은 계획들’, 혹은 ‘많은 계산들’에 해당할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד רְאֵה זֶה
  english_pob_choice: Only see this
  chosen_korean: 오직 이것을 보십시오
  alternatives_korean:
  - 보십시오, 이것만
  - 오직 이것을 보십시오
  lexicon: HALOT
  rationale: 도입부의 제한·강조를 살리면서, ‘see’의 주의 환기 기능을 현대 한국어의 공손한 명령으로 자연스럽게 옮겼습니다.
- source_word: הָאָדָם
  english_pob_choice: man / humankind
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 히브리어의 단수 정관사형이 일반적으로 인류를 가리키는 점을 반영하되, 한국어에서는 성별 편향을 과도하게 드러내지 않는 ‘사람’이 본문 기능을 가장 잘 살립니다.
- source_word: יָשָׁר
  english_pob_choice: upright
  chosen_korean: 올바르게
  alternatives_korean:
  - 곧게
  - 정직하게
  - 바르게
  lexicon: HALOT
  rationale: מ/יָשָׁר의 윤리적·도덕적 의미를 한국어에서 가장 자연스럽고 넓게 전달하는 표현으로, 단순한 물리적 ‘곧음’보다 관계적·도덕적 ‘올바름’을 드러냅니다.
- source_word: חִשְּׁבֹנוֹת רַבִּים
  english_pob_choice: many schemes
  chosen_korean: 많은 꾀
  alternatives_korean:
  - 많은 계획
  - 많은 계산
  - 많은 꾀와 생각
  lexicon: HALOT
  rationale: 문맥상 인간이 만들어 낸 복잡한 궁리·꾀를 가리키므로, 현대 독자가 즉시 이해할 수 있는 ‘꾀’로 옮기되 ‘many’의 복수를 보존했습니다.
theological_decisions:
- issue: הָאָדָם의 대표적 인간성 번역
  chosen_reading: ‘사람’으로 번역해 인간 전체를 가리키는 대표적 용법을 살렸습니다.
  alternative_readings:
  - ‘인간’으로 명시
  - ‘남자’로 직역
  rationale: 본문은 창조된 인간의 본래 상태와 이후의 보편적 일탈을 대조하는 일반 진술이므로, 성별을 특정하지 않으면서도 대표성을 유지하는 ‘사람’이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
