    text: '또는 ‘인류’: ‘하나님께서 인류를 올바르게 지으셨으나, 그들은 많은 계책을 찾아다녔습니다.’'
    reason: alternative_reading
  - marker: b
    text: 또는 ‘많은 꾀’, ‘많은 계획’, 또는 ‘많은 계산’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד רְאֵה זֶה
  english_pob_choice: Only see this
  chosen_korean: 오직 이것을 보십시오
  alternatives_korean:
