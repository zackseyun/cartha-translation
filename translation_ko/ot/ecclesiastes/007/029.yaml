  text: 보십시오, 내가 찾아낸 것은 오직 이것입니다. 하나님께서 사람[a]을 올바르게 지으셨으나, 그들은 많은 계책[b]을 찾아다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
