base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/022.yaml
  text: For your heart knows that many times you yourself have also cursed others[a].
  footnotes:
  - marker: a
    text: Or 'reviled others' or 'spoken evil of others.' The Hebrew verb can denote cursing in speech, but in context it may refer more broadly to insulting or speaking against others.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 네 마음이 너도 여러 번 다른 사람들을 저주했다는 것을 알고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모욕했다’ 또는 ‘남을 헐뜯었다’로 옮길 수 있습니다. 히브리어 동사는 말로 저주하는 것을 뜻할 수 있지만, 문맥에서는 더 넓게 남을 모욕하거나 악담하는 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞 문장의 이유를 밝히는 설명 접속으로 읽고, 한국어에서는 문장 앞의 원인 제시를 자연스럽게 풀어 주었습니다.
- source_word: לִבְּךָ
  english_pob_choice: your heart
  chosen_korean: 네 마음
  alternatives_korean:
  - 네 심장
  - 네 속마음
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 내면 전체를 가리키므로, 직역의 어색함을 피하면서도 내적 앎의 뜻을 살려 ‘네 마음’으로 옮겼습니다.
- source_word: פְּעָמִים רַבּוֹת
  english_pob_choice: many times
  chosen_korean: 여러 번
  alternatives_korean:
  - 많은 번
  - 자주
  lexicon: HALOT
  rationale: 관용적으로 ‘많은 때/번’을 뜻하므로, 한국어에서는 반복성을 자연스럽게 드러내는 ‘여러 번’이 가장 적절합니다.
- source_word: קִלַּלְתָּ
  english_pob_choice: cursed
  chosen_korean: 저주한
  alternatives_korean:
  - 욕한
  - 모욕한
  - 악담한
  lexicon: HALOT
  rationale: 이 동사는 말로 저주하거나 대적하는 뜻을 가지므로, 본문과 POB의 직설성을 따라 ‘저주한’으로 렌더링했습니다.
theological_decisions:
- issue: ‘heart’의 인지 기능과 죄책의 자각
  chosen_reading: ‘네 마음이 … 알고 있기 때문입니다’로, 내면의 자각과 양심적 인식을 분명히 드러냈습니다.
  alternative_readings:
  - ‘네가 … 알고 있기 때문입니다’
  - ‘네 양심이 … 알고 있기 때문입니다’
  rationale: 히브리어는 ‘마음’을 앎의 주체로 두어 자기 성찰을 강조합니다. 한국어에서도 그 내면적 인식 구조를 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 인간 내면의 자기인식과 양심에 대한 성경적 표현
