lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: Consider
  chosen_korean: 살피십시오
  alternatives_korean:
  - 보십시오
  - 생각해 보십시오
  - 고려하십시오
  lexicon: HALOT
  rationale: 지혜문맥의 명령형은 단순한 시각적 인지가 아니라 숙고를 요구하므로, 공손한 합쇼체로 ‘살피십시오’가 가장 자연스럽고 반성적 의미를 살립니다.
- source_word: מַעֲשֵׂה
  english_pob_choice: work
  chosen_korean: 행하심
  alternatives_korean:
  - 일
  - 일하심
  - 하신 일
  lexicon: HALOT
  rationale: ‘하나님의 일/행동’이라는 넓은 의미를 유지하면서도, 하나님을 주체로 드러내는 표현으로 ‘행하심’이 적절합니다.
- source_word: לְתַקֵּן / עִוְּתוֹ
  english_pob_choice: straighten / made crooked
  chosen_korean: 곧게 하다 / 굽게 하다
  alternatives_korean:
  - 바로잡다 / 비틀다
  - 고치다 / 비뚤게 하다
  lexicon: HALOT
  rationale: 본문의 대조는 ‘곧게 하다’와 ‘굽게 하다’의 공간적 이미지가 가장 분명하게 살려 주므로, 추상적인 ‘고치다’보다 이 대응을 택했습니다.
theological_decisions:
- issue: עִוְּתוֹ의 3인칭 남성 단수 접미사의 지시 대상
  chosen_reading: ‘하나님께서 굽게 하신 것’으로 옮겨, 접미사가 하나님을 가리키는 뜻을 분명히 드러냈습니다.
  alternative_readings:
  - ‘굽게 된 것’
  - ‘굽혀진 것’
  rationale: 바로 앞절의 ‘하나님의 행하심’이 문맥적 주어를 제공하므로, 이를 명시적으로 살려 하나님의 주권적 행위를 흐리지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
