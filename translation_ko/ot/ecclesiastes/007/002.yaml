id: ECC.7.2
reference: Ecclesiastes 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֞וֹב לָ/לֶ֣כֶת אֶל בֵּֽית אֵ֗בֶל מִ/לֶּ֨כֶת֙ אֶל בֵּ֣ית מִשְׁתֶּ֔ה בַּ/אֲשֶׁ֕ר ה֖וּא ס֣וֹף כָּל הָ/אָדָ֑ם וְ/הַ/חַ֖י יִתֵּ֥ן אֶל לִבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/002.yaml
  text: It is better to go to a house of mourning than to go to a house of feasting[a], because that is the end of every person, and the living should take it to heart.
  footnotes:
  - marker: a
    text: Or, “the end of all humankind.” Hebrew “every man” uses אָדָם generically for humanity.
    reason: alternative_reading
translation:
  language: ko
  text: 슬픔의 집으로 가는 것이 잔치의 집으로 가는 것보다 낫습니다[a]. 이는 모든 사람의 끝이기 때문이며, 살아 있는 사람은 이것을 마음에 두어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 인류의 끝”입니다. 히브리어 ‘אָדָם’은 여기서 인류 전체를 가리키는 일반명사로 쓰입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is better
  chosen_korean: ~하는 것이 …보다 낫습니다
  alternatives_korean:
  - ~보다 좋습니다
  - ~하는 편이 좋습니다
  lexicon: HALOT
  rationale: 지혜 문맥의 비교 판단을 자연스러운 현대 한국어로 살려, 평가적 비교를 직접 드러내는 ‘~하는 것이 …보다 낫습니다’를 택했습니다.
- source_word: בֵּית אֵבֶל
  english_pob_choice: a house of mourning
  chosen_korean: 슬픔의 집
  alternatives_korean:
  - 애도의 집
  - 상주의 집
  lexicon: HALOT
  rationale: 직역상 ‘애도/상주’도 가능하지만, 대조되는 장소성보다 상태를 드러내는 ‘슬픔의 집’이 한국어 독자에게 더 자연스럽고 본문의 대비를 분명히 합니다.
- source_word: בֵּית מִשְׁתֶּה
  english_pob_choice: a house of feasting
  chosen_korean: 잔치의 집
  alternatives_korean:
  - 연회의 집
  - 먹고 마시는 집
  lexicon: HALOT
  rationale: מִשְׁתֶּה는 단순 식사보다 잔치/연회에 가깝기 때문에, 한국어에서 행사성을 살리는 ‘잔치의 집’이 가장 간결합니다.
- source_word: יִתֵּן אֶל לִבּוֹ
  english_pob_choice: should take it to heart
  chosen_korean: 마음에 두어야 합니다
  alternatives_korean:
  - 마음에 새겨야 합니다
  - 깊이 생각해야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음에 두다/새기다’의 내적 숙고를 살리되, 지혜 격언의 권면성을 자연스럽게 표현했습니다.
theological_decisions:
- issue: הָאָדָם의 보편적 의미를 한국어로 어떻게 드러낼지
  chosen_reading: 모든 사람
  alternative_readings:
  - 모든 인류
  - 모든 인간
  rationale: 본문은 인간 전체의 죽음이라는 보편 진술이므로, 성별 표지보다 의미의 보편성을 우선해 ‘모든 사람’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם *adam*'
