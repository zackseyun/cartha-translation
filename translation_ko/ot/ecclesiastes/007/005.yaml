  text: It is better to hear the rebuke of a wise man than to hear the song of fools[a].
  footnotes:
  - marker: a
    text: Or 'It is better to hear the rebuke of a wise man than for a man to hear the song of fools.' The Hebrew second line is literally 'than a man hearing the song of fools.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람의 책망을 듣는 것이, 어리석은 자들의 노래를 듣는 것보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어리석은 자들의 노래’는 히브리어의 פשוט한 대조 표현으로, 문자적으로는 ‘어리석은 자들의 노래를 듣는 것’입니다.
    reason: source_note
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is better
  chosen_korean: ~하는 것이 ...보다 낫습니다
  alternatives_korean:
  - 좋습니다
