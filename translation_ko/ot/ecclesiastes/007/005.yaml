  lexicon: HALOT
  rationale: 분사형 ‘듣는’의 현재적 행위를 한국어에서는 명사화해 첫 절과 평행을 이루게 했고, ‘노래’와 ‘어리석은 자들’의 대비를 분명히 했습니다.
