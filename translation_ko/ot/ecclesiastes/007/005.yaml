  rationale: 히브리어는 남성형 단수이지만, 한국어에서는 성별을 불필요하게 좁히지 않고 원문의 지혜자 대비를 살리는 ‘지혜로운 사람’이 가장 자연스럽습니다.
- source_word: שֹׁמֵעַ שִׁיר כְּסִילִים
