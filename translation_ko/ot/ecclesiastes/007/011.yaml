id: ECC.7.11
reference: Ecclesiastes 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טוֹבָ֥ה חָכְמָ֖ה עִֽם נַחֲלָ֑ה וְ/יֹתֵ֖ר לְ/רֹאֵ֥י הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/011.yaml
  text: Wisdom is good with an inheritance[b][a], and an advantage to those who see the sun.
  footnotes:
  - marker: a
    text: Or 'Wisdom is as good as an inheritance'; the Hebrew construction may compare wisdom with inheritance or commend wisdom together with inheritance.
    reason: lexical_alternative
  - marker: b
    text: '''Those who see the sun'' is an idiom for the living, those who are alive in this world.'
    reason: cultural_note
translation:
  language: ko
  text: 지혜는 유산과 함께하는 것이 좋으며[a], 해를 보는 이들에게[b] 유익합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구조는 ‘지혜가 유산과 함께 좋다’는 뜻으로도, ‘지혜가 유산만큼 좋다’는 비교로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘해를 보는 이들’은 이 세상에 살아 있는 사람들을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: טוֹבָה
  english_pob_choice: is good
  chosen_korean: 좋고
  alternatives_korean:
  - 좋습니다
  - 더 낫습니다
  - 유익합니다
  lexicon: HALOT
  rationale: 히브리어 서술문을 자연스럽게 살려 ‘좋다’의 의미를 유지하되, 뒤 절과의 평행을 고려해 연결형 ‘좋고’로 처리했습니다.
- source_word: חָכְמָה
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지식
  - 슬기
  lexicon: HALOT
  rationale: 전도서의 חָכְמָה는 일반적 지식보다 실천적 지혜를 가리키므로 표준적인 ‘지혜’가 가장 직접적입니다.
- source_word: נַחֲלָה
  english_pob_choice: an inheritance
  chosen_korean: 유산
  alternatives_korean:
  - 상속
  - 기업
  - 재산
  lexicon: HALOT
  rationale: 여기서는 물려받은 몫을 가리키는 말로, 한국어에서는 문맥상 자연스러운 ‘유산’이 ‘inheritance’의 의미를 잘 살립니다.
- source_word: לְרֹאֵי הַשָּׁמֶשׁ
  english_pob_choice: those who see the sun
  chosen_korean: 해 아래 사는 자들
  alternatives_korean:
  - 태양을 보는 사람들
  - 햇빛을 보는 사람들
  - 이 세상에 사는 사람들
  lexicon: HALOT
  rationale: ‘해를 본다’는 표현은 살아 있는 사람들을 가리키는 관용구이므로, 의미를 드러내면서도 전도서의 이미지와 맞게 ‘해 아래 사는 자들’로 옮겼습니다.
theological_decisions:
- issue: ‘with an inheritance’의 관계를 비교로 볼지 동반으로 볼지
  chosen_reading: 지혜가 유산과 함께 있을 때 좋은 것으로 진술했습니다.
  alternative_readings:
  - 지혜는 유산만큼 좋습니다.
  - 지혜는 유산보다 더 좋습니다.
  rationale: 히브리어 구조가 비교인지 동반인지 둘 다 가능하므로, 과도한 비교 해석을 피하고 본문의 최소 의미인 ‘함께 있음’을 살렸습니다.
  doctrine_reference: 전도서 7:11의 문맥적 지혜 진술
- issue: ‘those who see the sun’의 관용구 처리
  chosen_reading: 직역보다 관용적 의미를 드러내는 ‘해 아래 사는 자들’로 옮겼습니다.
  alternative_readings:
  - 태양을 보는 사람들
  - 이 세상에 사는 사람들
  rationale: 히브리어 관용구가 단순한 시각 행위가 아니라 ‘살아 있음’을 뜻하므로, 독자가 즉시 이해할 수 있도록 의미를 풀어 번역했습니다.
  doctrine_reference: 전도서의 ‘해 아래’ 세계관
