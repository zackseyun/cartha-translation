id: ECC.7.28
reference: Ecclesiastes 7:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֛ר עוֹד בִּקְשָׁ֥ה נַפְשִׁ֖/י וְ/לֹ֣א מָצָ֑אתִי אָדָ֞ם אֶחָ֤ד מֵ/אֶ֨לֶף֙ מָצָ֔אתִי וְ/אִשָּׁ֥ה בְ/כָל אֵ֖לֶּה לֹ֥א מָצָֽאתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/028.yaml
  text: 'which my soul still sought[a], but I did not find: one man among a thousand I found[b], but a woman among all these I did not find.'
  footnotes:
  - marker: a
    text: Or 'one out of a thousand.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'among all these' likely refers to the whole group under consideration in Qoheleth's search; the verse reports his finding, not necessarily a universal statement about all women everywhere.
    reason: cultural_note
translation:
  language: ko
  text: 내 혼이 아직도 찾았지만[a] 찾지 못했습니다. 천 명 가운데서 한 남자[b]는 찾았으나, 이 모든 것 가운데서는 한 여자는 찾지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천 명 가운데 한 사람’.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 화자가 탐색한 집단 전체를 가리키는 것으로 보이며, 모든 여성을 일반화한 진술로 읽을 필요는 없습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְשָׁה נַפְשִׁי
  english_pob_choice: my soul sought
  chosen_korean: 내 혼이 아직도 찾았지만
  alternatives_korean:
  - 내 혼이 찾았지만
  - 내가 아직도 찾았지만
  - 내 마음이 아직도 찾았지만
  lexicon: HALOT
  rationale: נֶפֶשׁ을 단순한 ‘나’로 풀지 않고 ‘혼’으로 옮겨 원문의 내면 주체를 살렸고, עוֹד의 지속성을 ‘아직도’로 반영했습니다.
- source_word: אָדָם אֶחָד מֵאֶלֶף
  english_pob_choice: one man among a thousand
  chosen_korean: 천 명 가운데서 한 남자
  alternatives_korean:
  - 천 명 중 한 사람
  - 천 명 가운데 한 남자
  - 천 명에서 한 남자
  lexicon: HALOT
  rationale: 앞절의 ‘여자’와 직접 대조되는 אָדָם을 여기서는 성별이 드러나는 ‘남자’로 옮겼고, 수량 관용구는 한국어로 자연스러운 ‘천 명 가운데서’로 처리했습니다.
- source_word: וְאִשָּׁה בְכָל אֵלֶּה
  english_pob_choice: but a woman among all these
  chosen_korean: 이 모든 것 가운데서는 한 여자는
  alternatives_korean:
  - 이 모든 것 가운데 한 여자는
  - 이 모든 것 속에서 한 여자는
  - 이 모든 가운데서는 한 여자
  lexicon: HALOT
  rationale: בְכָל אֵלֶּה의 범위를 청중이 오해하지 않도록 ‘이 모든 것 가운데서’로 옮겨, POB가 주석으로 밝힌 ‘그가 탐색한 전체 집단’이라는 맥락을 드러냈습니다.
theological_decisions:
- issue: 남녀에 대한 보편적 판단으로 읽힐 가능성
  chosen_reading: 화자의 탐색 결과를 보고하는 서술로 유지하고, 보편 일반화나 도덕적 확대를 하지 않았습니다.
  alternative_readings:
  - 여성을 비하하지 않도록 완화한 의역
  - 모든 여성에 대한 일반 진술로 확장
  rationale: 전도서는 화자의 조사와 발견을 기록하는 문맥이므로, 본문이 말하는 범위를 넘겨 신학적 결론을 덧붙이지 않는 것이 원문 충실성과 긴장 보존에 맞습니다.
  doctrine_reference: 문맥 우선 해석; 성별 일반화 자제
- issue: ‘혼’의 번역
  chosen_reading: נפש를 ‘혼’으로 옮겨 내면 탐색의 주체성을 유지했습니다.
  alternative_readings:
  - 영혼
  - 마음
  - 내 존재
  rationale: 한국어 교회어에서 ‘혼’은 נפש의 넓은 의미를 비교적 직접적으로 담을 수 있고, 본문의 시적·지혜문학적 어조도 살립니다.
  doctrine_reference: 인간 내면을 가리키는 성서적 인류학 표현
