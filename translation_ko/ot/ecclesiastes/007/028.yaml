  terminology: אָדָם은 바로 뒤의 אִשָּׁה와 대조되므로 ‘남자’로 유지하는 것이 적절합니다. נֶפֶשׁ은 이 문맥에서 실체론적 의미의 ‘혼’으로 한정하지 않고 ‘마음’으로 옮기는 편이 현대 한국어와 히브리어 관용 양쪽에 더 적절합니다. 기존 각주 표지는 본문이 가리키는 위치 및 내용과 서로 바뀌어 있어 수정이 필요합니다.
