  yaml_path: translation/ot/ecclesiastes/007/024.yaml
  text: What has been is far off and very deep—who can find it out?[a]
  footnotes:
  - marker: a
    text: 'Hebrew: ''and deep, deep''—the repetition intensifies the sense: ''very deep'' or ''exceedingly deep.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이미 있던 것은 멀리 있고, 매우 깊습니다—누가 그것을 찾아낼 수 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘깊고, 깊고’라고 반복하여 강하게 강조합니다. 즉 ‘매우 깊다’ 또는 ‘지극히 깊다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחוֹק
  english_pob_choice: far off
  chosen_korean: 멀리 있고
  alternatives_korean:
  - 멀리 떨어져 있고
  - 먼 곳에 있고
  - 원대하고
  lexicon: HALOT
  rationale: מצב을 나타내는 형용사적 술어로서 ‘멀다’의 의미를 살리되, 현대 한국어에서는 ‘멀리 있다’가 가장 자연스럽고 문맥상 닿기 어려운 상태를 잘 드러냅니다.
- source_word: מַה שֶּׁהָיָה
  english_pob_choice: what has been
  chosen_korean: 이미 있던 것
  alternatives_korean:
  - 있었던 것
  - 이미 생겨난 것
  - 무엇이 있었던 것
  lexicon: HALOT
  rationale: 과거에 존재했거나 되어 온 실재를 가리키므로, 단순한 현재가 아니라 ‘이미 있던 것’으로 옮겨 문맥의 회상적 뉘앙스를 살렸습니다.
- source_word: וְעָמֹק עָמֹק
  english_pob_choice: and very deep
  chosen_korean: 매우 깊습니다
  alternatives_korean:
  - 깊고도 깊습니다
  - 아주 깊습니다
  - 깊고 깊습니다
  lexicon: HALOT
  rationale: 원문 반복은 강한 강조이므로, 본문에서는 매끄럽게 ‘매우 깊습니다’로 옮기고 반복의 강조 효과는 각주로 보존했습니다.
- source_word: יִמְצָאֶנּוּ
  english_pob_choice: can find it out
  chosen_korean: 찾아낼 수 있습니까
  alternatives_korean:
  - 찾을 수 있습니까
  - 발견할 수 있습니까
  - 알아낼 수 있습니까
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘찾다’보다 궁극적 이해/발견의 뜻이 강해 ‘찾아내다’가 적절하며, 수사적 질문의 가능성은 ‘-수 있습니까’로 자연스럽게 살렸습니다.
