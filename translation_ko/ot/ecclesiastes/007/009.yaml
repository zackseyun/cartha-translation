id: ECC.7.9
reference: Ecclesiastes 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תְּבַהֵ֥ל בְּ/רֽוּחֲ/ךָ֖ לִ/כְע֑וֹס כִּ֣י כַ֔עַס בְּ/חֵ֥יק כְּסִילִ֖ים יָנֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/009.yaml
  text: Do not be quick in your spirit to become angry[a], for anger rests in the bosom of fools.
  footnotes:
  - marker: a
    text: Or 'in the lap of fools.' The Hebrew image is of anger settling down close to a fool's inner life.
    reason: lexical_alternative
translation:
  language: ko
  text: 조급한 마음으로 화를 내지 마십시오. 분노는 어리석은 자들의 품에 머뭅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘품’은 분노가 어리석은 자의 가장 내밀한 자리 가까이에 자리 잡는다는 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל
  english_pob_choice: be quick
  chosen_korean: 조급한 마음으로
  alternatives_korean:
  - 서두르지
  - 급하게
  - 당황하여
  lexicon: HALOT
  rationale: 문맥상 감정적 성급함을 금하는 표현이므로, 자연스러운 한국어로 '조급한 마음으로'를 택해 내면의 급박함을 살렸습니다.
- source_word: בְּרוּחֲךָ
  english_pob_choice: in your spirit
  chosen_korean: 마음으로
  alternatives_korean:
  - 영으로
  - 속으로
  - 기질로
  lexicon: HALOT
  rationale: 히브리어 רוּחַ의 내적 성향을 한국어에서 가장 자연스럽게 드러내는 표현으로 '마음'을 선택했습니다.
- source_word: לִכְעוֹס / כַעַס
  english_pob_choice: to become angry / anger
  chosen_korean: 화를 내지 마십시오 / 분노
  alternatives_korean:
  - 성내지 마십시오 / 성냄
  - 분개
  - 노여움
  lexicon: HALOT
  rationale: 동사와 명사를 같은 어휘장으로 맞추되, 동사는 현대적이고 직접적인 '화를 내다'로, 명사는 원문의 일반적 감정명사에 맞는 '분노'로 옮겼습니다.
- source_word: בְּחֵיק כְּסִילִים
  english_pob_choice: in the bosom of fools
  chosen_korean: 어리석은 자들의 품에
  alternatives_korean:
  - 어리석은 자들의 가슴에
  - 어리석은 자들의 품속에
  - 어리석은 자들의 가슴팍에
  lexicon: HALOT
  rationale: חֵיק의 신체적 이미지를 한국어에서 자연스럽게 전달하면서도, 분노가 그들의 내밀한 자리 가까이에 머문다는 뜻을 살리기 위해 '품에'로 옮겼습니다.
- source_word: יָנוּחַ
  english_pob_choice: rests
  chosen_korean: 머뭅니다
  alternatives_korean:
  - 쉼니다
  - 머무릅니다
  - 안주합니다
  lexicon: HALOT
  rationale: נגח의 의미는 단순 정지가 아니라 거처처럼 자리 잡는 뉘앙스이므로, 분노가 어리석은 자들 안에 계속 머문다는 뜻을 담아 '머뭅니다'를 사용했습니다.
