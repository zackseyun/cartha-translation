source:
  edition: WLC
  text: גַּ֤ם לְ/כָל הַ/דְּבָרִים֙ אֲשֶׁ֣ר יְדַבֵּ֔רוּ אַל תִּתֵּ֖ן לִבֶּ֑/ךָ אֲשֶׁ֥ר לֹֽא תִשְׁמַ֥ע אֶֽת עַבְדְּ/ךָ֖ מְקַלְלֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/021.yaml
  text: Also[a], do not give your heart to every word that is spoken[b], lest you hear your servant cursing you.
  footnotes:
  - marker: a
    text: Or 'do not take to heart everything that is said.' The Hebrew literally reads 'do not give your heart to every word that they speak.'
    reason: lexical_alternative
  - marker: b
    text: '''Your servant'' may also be rendered ''your slave''; the Hebrew עֶבֶד can refer to either, depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한, 사람들이 하는 모든 말을 마음에 두지 마십시오[a]. 그렇지 않으면 당신의 종[b]이 당신을 저주하는 것을 듣게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말해지는 모든 말을 마음에 두지 마십시오.’ 히브리어는 문자적으로 ‘그들이 말하는 모든 말에 당신의 마음을 주지 마십시오’라고 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종’은 문맥에 따라 ‘하인’ 또는 ‘노예’로도 옮길 수 있습니다. 히브리어 עֶבֶד는 두 의미를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 또
  lexicon: HALOT
  rationale: 추가적 권고를 자연스럽게 이어 주는 부사로, 앞뒤 문맥에 덧붙는 힘을 살리면서도 과장하지 않습니다.
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  english_pob_choice: every word that is spoken
  chosen_korean: 사람들은 하는 모든 말
  alternatives_korean:
  - 모든 말
  - 사람들이 말하는 모든 것
  - 말해지는 모든 말
  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 ‘말’로 읽는 것이 가장 자연스럽고, 주어가 없는 히브리어 복수 동사를 한국어에서는 ‘사람들은’으로 보충해 주어 어색한 수동형을 피했습니다.
- source_word: אַֽל תִּתֵּ֖ן לִבֶּ֑ךָ
  english_pob_choice: do not give your heart
  chosen_korean: 마음을 쓰지 마십시오
  alternatives_korean:
  - 마음을 두지 마십시오
  - 마음을 주지 마십시오
  - 마음에 두지 마십시오
  lexicon: HALOT
  rationale: 직역의 ‘마음을 주다’보다 한국어 관용에 맞는 ‘마음을 쓰다’가 히브리어 관용구의 뜻—주의와 관심을 돌리지 말라—를 더 자연스럽게 전달합니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종복
  - 당신의 하인
  - 당신의 노예
  lexicon: HALOT
  rationale: 이 절에서는 가정/사회적 종속 관계가 핵심이므로 기본값인 ‘종’을 따랐고, POB의 ‘servant’도 이를 지지합니다. ‘노예’는 본문에서 별도 강조가 없어 선택하지 않았습니다.
- source_word: מְקַלְלֶךָ
  english_pob_choice: cursing you
  chosen_korean: 당신을 저주하는
  alternatives_korean:
  - 당신을 욕하는
  - 당신을 저주하여
  - 당신에게 악담하는
  lexicon: HALOT
  rationale: קלל의 핵심 의미인 ‘저주하다’를 직접 살려, 관계의 심각한 모욕을 약화시키지 않도록 했습니다.
theological_decisions:
- issue: 지혜문학의 권면 어조와 대상을 현대 한국어에서 어떻게 유지할지
  chosen_reading: 금지 명령을 공손한 합쇼체로 옮기되, 본문의 경고성과 직접성을 유지했습니다.
  alternative_readings:
  - 부드러운 권유체로 완화
  - 직설적인 평서형으로 번역
  rationale: 본문은 실제 경고이므로 완화하면 힘이 줄어듭니다. 합쇼체 금지형은 현대적이면서도 권면의 긴장을 보존합니다.
  doctrine_reference: 지혜문학의 권면 형식 보존
