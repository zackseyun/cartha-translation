id: ECC.7.1
reference: Ecclesiastes 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֥וֹב שֵׁ֖ם מִ/שֶּׁ֣מֶן ט֑וֹב וְ/י֣וֹם הַ/מָּ֔וֶת מִ/יּ֖וֹם הִוָּלְדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/001.yaml
  text: A good name is better than good oil[a], and the day of death than the day of one's birth.
  footnotes:
  - marker: a
    text: Or 'than fine perfume' or 'than precious ointment'; the Hebrew literally says 'than good oil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 이름은 좋은 기름보다 낫고, 죽는 날은 태어나는 날보다 낫습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב שֵׁם
  english_pob_choice: A good name
  chosen_korean: 좋은 이름
  alternatives_korean:
  - 좋은 명성
  - 좋은 평판
  lexicon: HALOT
  rationale: שֵׁם은 문자적으로 ‘이름’이지만 지혜문학에서는 명성과 평판을 포함할 수 있습니다. 본문은 관용적 해석으로 풀어도 되지만, 원어의 직접 대응을 살려 ‘이름’을 유지했습니다.
- source_word: מִשֶּׁמֶן טוֹב
  english_pob_choice: than good oil
  chosen_korean: 좋은 기름보다
  alternatives_korean:
  - 좋은 향유보다
  - 귀한 향유보다
  - 좋은 연고보다
  lexicon: HALOT
  rationale: שֶׁמֶן은 기본적으로 ‘기름’이며, 문맥상 향유나 귀한 연고를 가리킬 수 있습니다. 본문 이미지를 투명하게 보존하기 위해 직역적 표현인 ‘좋은 기름’을 택했습니다.
- source_word: וְיוֹם הַמָּוֶת מִיּוֹם הִוָּלְדוֹ
  english_pob_choice: and the day of death than the day of his birth
  chosen_korean: 죽는 날은 태어나는 날보다
  alternatives_korean:
  - 죽음의 날은 출생의 날보다
  - 죽는 날이 태어나는 날보다
  lexicon: HALOT
  rationale: 히브리어는 ‘죽음의 날’과 ‘그의 태어남의 날’이라는 대구를 이룹니다. 한국어에서는 자연스러운 수식 관계를 위해 ‘죽는 날’, ‘태어나는 날’로 옮겨 비교 구문을 살렸습니다.
- source_word: הִוָּלְדוֹ
  english_pob_choice: his birth
  chosen_korean: 태어나는 날
  alternatives_korean:
  - 그의 태어남
  - 한 사람의 태어남
  lexicon: HALOT
  rationale: 어미의 3인칭 남성 단수는 지혜문학의 대표적 단수로 볼 수 있지만, 한국어에서는 성별 표지를 살리기보다 속담형 표현의 자연스러움을 우선해 ‘태어나는 날’로 처리했습니다.
theological_decisions:
- issue: 비교문의 압축된 잠언체를 한국어에서 어떻게 드러낼 것인가
  chosen_reading: 문장 전체를 ‘A는 B보다 낫다’ 구조로 풀어, 잠언의 평가적 결론을 분명히 했습니다.
  alternative_readings:
  - 좋은 이름이 좋은 기름보다 더 좋습니다
  - 좋은 이름이 좋은 기름보다 낫습니다
  rationale: 히브리어 본문은 서술어 없이 מִן 비교를 통해 판단을 제시합니다. 한국어는 이러한 압축을 그대로 두면 어색하므로, 의미를 훼손하지 않는 범위에서 비교 판단을 명시했습니다.
  doctrine_reference: Translation philosophy §3
