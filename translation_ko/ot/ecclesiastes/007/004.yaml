id: ECC.7.4
reference: Ecclesiastes 7:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵ֤ב חֲכָמִים֙ בְּ/בֵ֣ית אֵ֔בֶל וְ/לֵ֥ב כְּסִילִ֖ים בְּ/בֵ֥ית שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/004.yaml
  text: The heart of the wise is in the house of mourning[a], but the heart of fools is in the house of mirth.
  footnotes:
  - marker: a
    text: Or 'joy' or 'gladness' for 'mirth.' The Hebrew term can denote rejoicing more broadly, but here likely refers to festive merriment in contrast with mourning.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람의 마음은 애통의 집에 있지만, 어리석은 사람의 마음은 기쁨의 집에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שִׂמְחָה는 ‘기쁨, 즐거움, 환희’까지 넓게 가리킬 수 있습니다. 여기서는 애통과 대조되는 축제적 즐거움의 분위기를 가리키는 말로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 마음속
  - 내면
  lexicon: HALOT
  rationale: 히브리어 לֵב은 단순한 감정보다 사고와 의지까지 포함한 내적 중심을 가리키므로, 한국어에서는 ‘마음’이 가장 자연스럽고 포괄적으로 대응합니다.
- source_word: חֲכָמִים
  english_pob_choice: the wise
  chosen_korean: 지혜로운 사람들
  alternatives_korean:
  - 지혜로운 이들
  - 지혜자들
  - 현명한 사람들
  lexicon: HALOT
  rationale: 지혜문학의 관용적 집단명으로서 복수 명사구를 살리기 위해 ‘지혜로운 사람들’로 옮기되, 문장 흐름상 여기서는 ‘지혜로운 사람의 마음’으로 자연스럽게 다듬었습니다.
- source_word: בֵּית
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 집안
  - 장소
  - 가정
  lexicon: HALOT
  rationale: ‘집 of mourning / house of mirth’라는 대구를 유지하려면 ‘집’이 가장 직접적이며, 상징적 공간 표현도 잘 보존합니다.
- source_word: אֵבֶל
  english_pob_choice: mourning
  chosen_korean: 애통
  alternatives_korean:
  - 애도
  - 슬픔
  - 곡
  lexicon: HALOT
  rationale: אֵבֶל은 단순한 슬픔보다 상실 앞에서의 애도와 통곡을 포함하는 말이어서, 문맥상 ‘애통’이 ‘mourning’의 정서와 의례적 뉘앙스를 함께 살립니다.
- source_word: שִׂמְחָה
  english_pob_choice: mirth
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  - 흥겨움
  lexicon: HALOT
  rationale: 히브리어는 축제적 즐거움을 가리킬 수 있지만, 한국어에서는 ‘기쁨’이 가장 넓고 자연스럽게 대응하며, 대조 구조상 앞의 ‘애통’과도 균형을 이룹니다.
theological_decisions:
- issue: 지혜자/어리석은 자의 대비를 도덕적 평가로 유지할지, 단순 성격 차이로 완화할지
  chosen_reading: ‘지혜로운 사람’과 ‘어리석은 사람’의 대비를 그대로 살려, 삶의 태도와 선택의 지향이 서로 다른 두 집에 머문다는 뜻으로 읽었습니다.
  alternative_readings:
  - 지혜 있는 자/어리석은 자
  - 현명한 사람/미련한 사람
  rationale: 이 절은 지혜문학의 전형적 대조로서 단순한 심리 묘사가 아니라 가치판단을 포함하므로, 약화하지 않고 그대로 드러내는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 지혜문학의 도덕적 이분법
- issue: ‘house of mirth’를 축제적 환락으로 과장할지, 일반적 즐거움으로 번역할지
  chosen_reading: ‘기쁨의 집’으로 번역해, 과장된 유흥보다 즐거움의 분위기를 넓게 포괄하도록 했습니다.
  alternative_readings:
  - 흥겨움의 집
  - 환락의 집
  - 즐거움의 집
  rationale: 히브리어 שִׂמְחָה는 즐거움 전반을 뜻할 수 있으므로, 본문이 요구하는 대비는 유지하되 한국어에서 과도하게 세속적이거나 특정한 뉘앙스로 좁히지 않는 편이 적절합니다.
  doctrine_reference: 지혜문학 어휘의 의미 범위
