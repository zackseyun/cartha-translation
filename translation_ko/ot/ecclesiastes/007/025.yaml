base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
  footnotes:
  - marker: a
    text: Or, 'I turned about, I and my heart,' preserving the more literal image of reorientation.
    reason: lexical_alternative
  - marker: b
    text: Or 'a scheme,' 'a reckoning,' or 'a reasoned account' for 'an explanation.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression may also be rendered, 'to know that wickedness is folly and foolishness is madness.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 내 마음과 함께 방향을 돌려, 지혜와 헤아림[b]을 알고 탐구하고 찾으며, 또 악함이 어리석음이고 어리석음이 광기임을[c] 알려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘방향을 돌려’는 더 문자적으로 ‘돌이켜’ 또는 ‘돌아서서’로 옮길 수 있으며, 사유와 탐구의 방향을 전환하는 이미지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘헤아림’(חֶשְׁבּוֹן)은 ‘계산’, ‘이치’, ‘설명’ 또는 ‘이유 있는 설명’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 계사가 생략된 압축 표현입니다. 직역하면 ‘악함은 어리석음, 어리석음은 광기’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוֹתִי
  english_pob_choice: I turned
  chosen_korean: 나는 … 돌이켜
  alternatives_korean:
