  lexicon: HALOT
  rationale: 사유의 방향 전환을 나타내는 동사를 한국어로 자연스럽게 옮기되, 본문의 구체적 회전 이미지를 너무 평평하게 만들지 않기 위해 ‘돌이켜’를 택했습니다.
- source_word: אֲנִי וְלִבִּי
  english_pob_choice: I and my heart
  chosen_korean: 내 마음과 함께
  alternatives_korean:
  - 나와 내 마음
  - 내가 내 마음과 함께
  lexicon: HALOT
  rationale: 히브리어의 내적 성찰 관용구를 살리기 위해 ‘마음’을 유지했습니다. 한국어에서는 병렬을 그대로 옮기기보다 ‘내 마음과 함께’로 자연스럽게 처리했습니다.
- source_word: חֶשְׁבּוֹן
  english_pob_choice: an explanation
  chosen_korean: 설명
  alternatives_korean:
  - 계산
  - 헤아림
  - 이유에 대한 설명
  lexicon: HALOT
  rationale: 문맥상 지혜를 탐구한 결과로 얻으려는 ‘이해 가능한 설명/해명’의 의미가 강하므로, 과도하게 기술적인 ‘계산’보다 ‘설명’이 가장 읽기 좋고 의미도 넓게 담습니다.
- source_word: רֶשַׁע כֶּסֶל וְהַסִּכְל֖וּת הוֹלֵלֽוֹת
  english_pob_choice: wickedness is folly and foolishness is madness
  chosen_korean: 악함은 어리석음이며 어리석음은 광기임
  alternatives_korean:
  - 악은 어리석음이며 어리석음은 미친 짓임
  - 악행은 어리석음이며 어리석음은 광란임
  lexicon: HALOT
  rationale: 마지막 절은 히브리어의 생략된 계사 구조를 가진 판단문이므로, 한국어에서는 ‘-임’으로 판정의 힘을 보존했습니다. ‘악함/어리석음/광기’는 지혜문학의 윤리적·평가적 어휘를 유지합니다.
theological_decisions:
- issue: ‘heart’의 인지적 의미를 한국어로 어떻게 보존할지
  chosen_reading: ‘마음’을 그대로 유지해 내면의 사고와 의지를 함께 가리키도록 했습니다.
  alternative_readings:
  - ‘생각’으로 풀이
  - ‘마음’과 ‘생각’을 병기
  rationale: 본문은 히브리적 인간 이해에서 ‘마음’을 사유의 중심으로 씁니다. 이를 ‘생각’으로 바꾸면 문화적·신학적 두께가 줄어들므로, 한국어 독자에게도 익숙한 ‘마음’을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
