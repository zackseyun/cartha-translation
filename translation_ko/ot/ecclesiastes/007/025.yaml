  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סַבּ֨וֹתִֽי אֲנִ֤י וְ/לִבִּ/י֙ לָ/דַ֣עַת וְ/לָ/ת֔וּר וּ/בַקֵּ֥שׁ חָכְמָ֖ה וְ/חֶשְׁבּ֑וֹן וְ/לָ/דַ֨עַת֙ רֶ֣שַׁע כֶּ֔סֶל וְ/הַ/סִּכְל֖וּת הוֹלֵלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
  footnotes:
  - marker: a
    text: Or, 'I turned about, I and my heart,' preserving the more literal image of reorientation.
    reason: lexical_alternative
  - marker: b
    text: Or 'a scheme,' 'a reckoning,' or 'a reasoned account' for 'an explanation.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression may also be rendered, 'to know that wickedness is folly and foolishness is madness.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 내 마음과 함께 돌이켜 지혜와 설명을 찾아내고, 또 악함은 어리석음이며 어리석음은 광기임을 알기 위해 힘썼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌이켜’는 더 문자적으로는 ‘돌아서다/돌아보다’의 이미지를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘설명’은 ‘계산’, ‘헤아림’, ‘이유에 대한 설명’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 ‘악함은 어리석음이며 어리석음은 광기입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוֹתִי
  english_pob_choice: I turned
  chosen_korean: 나는 … 돌이켜
  alternatives_korean:
  - 나는 … 돌아섰습니다
  - 나는 … 방향을 돌렸습니다
  lexicon: HALOT
  rationale: 사유의 방향 전환을 나타내는 동사를 한국어로 자연스럽게 옮기되, 본문의 구체적 회전 이미지를 너무 평평하게 만들지 않기 위해 ‘돌이켜’를 택했습니다.
- source_word: אֲנִי וְלִבִּי
  english_pob_choice: I and my heart
  chosen_korean: 내 마음과 함께
  alternatives_korean:
  - 나와 내 마음
  - 내가 내 마음과 함께
  lexicon: HALOT
  rationale: 히브리어의 내적 성찰 관용구를 살리기 위해 ‘마음’을 유지했습니다. 한국어에서는 병렬을 그대로 옮기기보다 ‘내 마음과 함께’로 자연스럽게 처리했습니다.
- source_word: חֶשְׁבּוֹן
  english_pob_choice: an explanation
  chosen_korean: 설명
  alternatives_korean:
  - 계산
  - 헤아림
  - 이유에 대한 설명
  lexicon: HALOT
  rationale: 문맥상 지혜를 탐구한 결과로 얻으려는 ‘이해 가능한 설명/해명’의 의미가 강하므로, 과도하게 기술적인 ‘계산’보다 ‘설명’이 가장 읽기 좋고 의미도 넓게 담습니다.
- source_word: רֶשַׁע כֶּסֶל וְהַסִּכְל֖וּת הוֹלֵלֽוֹת
  english_pob_choice: wickedness is folly and foolishness is madness
  chosen_korean: 악함은 어리석음이며 어리석음은 광기임
  alternatives_korean:
  - 악은 어리석음이며 어리석음은 미친 짓임
  - 악행은 어리석음이며 어리석음은 광란임
  lexicon: HALOT
  rationale: 마지막 절은 히브리어의 생략된 계사 구조를 가진 판단문이므로, 한국어에서는 ‘-임’으로 판정의 힘을 보존했습니다. ‘악함/어리석음/광기’는 지혜문학의 윤리적·평가적 어휘를 유지합니다.
theological_decisions:
- issue: ‘heart’의 인지적 의미를 한국어로 어떻게 보존할지
  chosen_reading: ‘마음’을 그대로 유지해 내면의 사고와 의지를 함께 가리키도록 했습니다.
  alternative_readings:
  - ‘생각’으로 풀이
  - ‘마음’과 ‘생각’을 병기
  rationale: 본문은 히브리적 인간 이해에서 ‘마음’을 사유의 중심으로 씁니다. 이를 ‘생각’으로 바꾸면 문화적·신학적 두께가 줄어들므로, 한국어 독자에게도 익숙한 ‘마음’을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
