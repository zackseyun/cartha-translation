revisions:
- from: 또 내가 보니, 그 여자는 죽음보다 더 쓰라립니다. 그 여자의 마음은 올무와 그물이며, 그 여자의 손은 쇠사슬입니다. 하나님 앞에서 선한 사람은 그녀에게서 벗어나겠지만, 죄인은 그녀에게 붙잡히게 될 것입니다.[a][b]
  to: 또 나는 그 여자가 죽음보다 더 쓰라린 것을 깨닫습니다. 그 여자의 마음은 올무와 그물[a]이고, 그 손은 사슬입니다. 하나님 앞에서 선한 사람[b]은 그 여자에게서 벗어나겠지만, 죄인은 그 여자에게 붙잡힐 것입니다.
  rationale: 첫 문장을 ‘나는 ... 것을 깨닫습니다’로 고쳐 화자의 1인칭 관찰과 ‘죽음보다 더 쓰라린’ 비교가 그 여자를 목적어로 수식하는 원문 구조를 보존했습니다. 포획 은유와 단수의 ‘그 여자’를 유지했으며, 각주는 해당 어구 바로 뒤에 배치하고 독립적으로 자연스럽게 읽히도록 정비했습니다.
