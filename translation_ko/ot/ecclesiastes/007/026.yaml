source:
  edition: WLC
  text: וּ/מוֹצֶ֨א אֲנִ֜י מַ֣ר מִ/מָּ֗וֶת אֶת הָֽ/אִשָּׁה֙ אֲשֶׁר הִ֨יא מְצוֹדִ֧ים וַ/חֲרָמִ֛ים לִבָּ֖/הּ אֲסוּרִ֣ים יָדֶ֑י/הָ ט֞וֹב לִ/פְנֵ֤י הָ/אֱלֹהִים֙ יִמָּלֵ֣ט מִמֶּ֔/נָּה וְ/חוֹטֵ֖א יִלָּ֥כֶד בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/026.yaml
  text: And I find more bitter than death the woman whose heart is traps and nets[a], and whose hands are chains. The one who is good before God will escape from her[b], but the sinner will be caught by her.
  footnotes:
  - marker: a
    text: Or, 'whose heart is snares and nets.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'The one who pleases God will escape from her.'
    reason: alternative_reading
translation:
  language: ko
  text: 또 나는 그 여자가 죽음보다 더 쓰라린 것을 깨닫습니다. 그 여자의 마음은 올무와 그물[a]이고, 그 손은 사슬입니다. 하나님 앞에서 선한 사람[b]은 그 여자에게서 벗어나겠지만, 죄인은 그 여자에게 붙잡힐 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덫과 그물’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님을 기쁘시게 하는 사람’.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמוֹצֶא אֲנִי
  english_pob_choice: And I find
  chosen_korean: 또 내가 보니
  alternatives_korean:
  - 그리고 나는 찾습니다
  - 또 내가 찾습니다
  lexicon: HALOT
  rationale: קהלת의 1인칭 관찰 진술을 한국어 현재 관찰 표현으로 자연스럽게 옮기되, 단순 과거 서술로 굳히지 않았습니다.
- source_word: מַר מִמָּוֶת
  english_pob_choice: more bitter than death
  chosen_korean: 죽음보다 더 쓰라립니다
  alternatives_korean:
  - 죽음보다 더 씁쓸합니다
  - 죽음보다 쓰라리기 그지없습니다
  lexicon: HALOT
  rationale: 비교구문 מן을 한국어의 비교 조사 '보다'로 옮겨, 강한 대비와 정서를 유지했습니다.
- source_word: מְצוֹדִים וַחֲרָמִים
  english_pob_choice: traps and nets
  chosen_korean: 올무와 그물
  alternatives_korean:
  - 덫과 그물
  - 올무와 올가미
  lexicon: HALOT
  rationale: 포획 이미지의 두 명사를 한국어 관용적 대응으로 옮겨, 함정과 얽힘의 비유를 분명하게 했습니다.
- source_word: אֲסוּרִים יָדֶיהָ
  english_pob_choice: whose hands are chains
  chosen_korean: 그 여자의 손은 쇠사슬입니다
  alternatives_korean:
  - 그 여자의 손은 족쇄입니다
  - 그 여자의 손은 결박입니다
  lexicon: HALOT
  rationale: אֲסוּרִים의 결박/사슬 이미지를 구체적인 명사 '쇠사슬'로 옮겨 앞절과의 포획 비유를 살렸습니다.
- source_word: טוֹב לִפְנֵי הָאֱלֹהִים
  english_pob_choice: The one who is good before God
  chosen_korean: 하나님 앞에서 선한 사람
  alternatives_korean:
  - 하나님 앞에서 좋은 사람
  - 하나님 보시기에 선한 사람
  lexicon: HALOT
  rationale: 직역의 '좋다'를 도덕적·관계적 평가가 드러나는 '선한 사람'으로 옮기되, 본문이 가진 '하나님 앞에서'라는 표현은 유지했습니다.
- source_word: יִמָּלֵט מִמֶּנָּה
  english_pob_choice: will escape from her
  chosen_korean: 그녀에게서 벗어나겠지만
  alternatives_korean:
  - 그녀에게서 피하겠지만
  - 그녀로부터 도망하겠지만
  lexicon: HALOT
  rationale: נמלט의 탈출/벗어남 의미를 한국어 자연어로 살려, 포획 비유와 연결되도록 했습니다.
- source_word: וְחוֹטֵא יִלָּכֶד בָּהּ
  english_pob_choice: but the sinner will be caught by her
  chosen_korean: 죄인은 그녀에게 붙잡히게 될 것입니다
  alternatives_korean:
  - 죄인은 그녀에게 잡히게 될 것입니다
  - 죄인은 그녀에게 포획될 것입니다
  lexicon: HALOT
  rationale: ילכד의 수동적 포획 의미를 '붙잡히다'로 옮겨, 직설적이고 현대적인 한국어로 유지했습니다.
theological_decisions:
- issue: ‘그 여인’을 일반화하거나 완화할지 여부
  chosen_reading: 본문의 단수 여성 표현을 유지해 '그 여자'로 직역하고, 유형적·상징적 해석은 본문 밖에 남겼습니다.
  alternative_readings:
  - 한 여자
  - 유혹하는 여자
  - 어리석음의 의인화
  rationale: 히브리어는 단수 여성과 강한 포획 은유를 사용하므로, 본문이 말하는 긴장과 불편함을 덮지 않고 그대로 드러내는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: טוֹב לִפְנֵי הָאֱלֹהִים의 의미 범위
  chosen_reading: ‘하나님 앞에서 선한 사람’으로 옮겨, 본문의 어휘를 살리면서도 한국어에서 자연스러운 평가 표현을 사용했습니다.
  alternative_readings:
  - 하나님을 기쁘시게 하는 사람
  - 하나님 보시기에 좋은 사람
  rationale: ‘기쁘시게 한다’는 해석은 가능하지만, 본문은 먼저 טוב와 ‘하나님 앞에서’라는 표현을 말하므로 본문적 어휘를 유지하는 것이 더 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
