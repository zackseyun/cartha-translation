    rationale: 히브리어의 복수형을 기계적으로 재현할 필요는 없습니다. ‘덫과 그물’은 같은 포획 어휘장의 자연스러운 어휘 대안을 제공합니다.
  revised_text: 또 나는 그 여자가 죽음보다 더 쓰라린 것을 깨닫습니다. 그 여자의 마음은 올무와 그물[a]이고, 그 손은 사슬입니다. 하나님 앞에서 선한 사람[b]은 그 여자에게서 벗어나겠지만, 죄인은 그 여자에게 붙잡힐 것입니다.
