translation:
  language: ko
  text: 이는 땅 위에 의로운 사람이 있어 선을 행하고 죄를 짓지 않는 경우가 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 단수이지만 보편적 의미로 쓰였으므로, 한국어에서는 대표적 일반명사 ‘사람’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 히브리어 אָדָם은 여기서 대표적·보편적 의미를 지닌 단수 표현이므로, 한국어에서는 성별을 앞세우기보다 자연스러운 보편 명사 ‘사람’으로 옮겨 대표성을 살렸습니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로운
  alternatives_korean:
  - 의인인
  - 공의로운
  - 정의로운
  lexicon: HALOT
  rationale: 전도서의 문맥에서 도덕적·언약적 의로움을 가리키므로, 교회 전통어를 과도하게 굳히지 않으면서도 의미가 분명한 ‘의로운’을 선택했습니다.
- source_word: יַעֲשֶׂה טּוֹב
  english_pob_choice: does good
  chosen_korean: 선을 행하고
  alternatives_korean:
  - 좋은 일을 하고
  - 선을 하고
  - 좋은 것을 행하고
  lexicon: HALOT
  rationale: 히브리어의 간결한 관용을 한국어에서 자연스럽게 풀어 ‘선을 행하다’로 옮겨, 행위의 도덕적 성격을 분명히 했습니다.
- source_word: וְלֹא יֶחֱטָא
  english_pob_choice: and does not sin
  chosen_korean: 죄를 짓지 않는
  alternatives_korean:
  - 그리고 죄를 짓지 않는
  - 죄를 범하지 않는
  - 그리고 결코 죄를 짓지 않는
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 한국어에서는 매끄럽게 연결하기 위해 관계절 안에서 ‘죄를 짓지 않는’으로 처리했으며, 절대화된 ‘결코’는 원문을 넘는 것으로 보아 피했습니다.
theological_decisions:
- issue: אָדָם의 보편적 인간 진술을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘사람’으로 옮겨 단수의 대표성과 보편성을 함께 살렸습니다.
  alternative_readings:
  - 사람이
  - 인간이
  - 인류 가운데
  rationale: 본문은 단수 일반명사를 통해 인간 전체에 대한 보편 진술을 하므로, 성별을 전면화하는 번역보다 대표적 일반명사 ‘사람’이 원문의 의도를 더 자연스럽게 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy; generic singular representation
