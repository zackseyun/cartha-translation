  - 인류
  lexicon: HALOT
  rationale: 히브리어 אָדָם은 여기서 대표적·보편적 의미를 지닌 단수 표현이므로, 한국어에서는 성별을 앞세우기보다 자연스러운 보편 명사 ‘사람’으로 옮겨 대표성을 살렸습니다.
- source_word: צַדִּיק
