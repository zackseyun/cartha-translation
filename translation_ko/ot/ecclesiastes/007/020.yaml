  chosen_reading: ‘사람’으로 옮겨 단수의 대표성과 보편성을 함께 살렸습니다.
  alternative_readings:
  - 사람이
  - 인간이
  - 인류 가운데
  rationale: 본문은 단수 일반명사를 통해 인간 전체에 대한 보편 진술을 하므로, 성별을 전면화하는 번역보다 대표적 일반명사 ‘사람’이 원문의 의도를 더 자연스럽게 전달합니다.
