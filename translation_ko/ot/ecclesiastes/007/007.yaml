  terminology: ‘마음’ suitably retains the Hebrew לב metaphor, with a note explaining its wider reference to judgment, understanding, and will. ‘뇌물’ is a sound contextual choice; its lexical alternative should be anchored directly to that word, while the heart note should be anchored to ‘마음.’
