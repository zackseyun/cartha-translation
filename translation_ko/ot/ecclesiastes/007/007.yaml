  - severity: low
    issue: Unmarked concessive nuance in ‘지혜로운 사람도’
    rationale: The Hebrew says ‘a/the wise person’ without an explicit equivalent of ‘even.’ Removing ‘도’ more closely preserves the source wording.
  - severity: low
    issue: Footnote anchors do not align with their referents
    rationale: The cultural note on ‘heart’ should be attached to ‘마음,’ and the lexical-alternative note should be attached to ‘뇌물,’ rather than placing both markers at the sentence end.
