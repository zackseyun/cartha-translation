  source_fidelity: 'The core renderings are faithful: הָעֹשֶׁק is appropriately rendered ‘억압,’ יְהוֹלֵל as ‘미치게 하다,’ and מַתָּנָה as ‘뇌물’ is well supported in this context. However, ‘지혜로운 사람도’ adds an explicit concessive ‘even’ not marked in the Hebrew, and the paired use of ‘왜냐하면’ and ‘때문입니다’ is redundant in Korean.'
