source:
  edition: WLC
  text: כִּ֥י הָ/עֹ֖שֶׁק יְהוֹלֵ֣ל חָכָ֑ם וִֽ/יאַבֵּ֥ד אֶת לֵ֖ב מַתָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/007.yaml
  text: For oppression drives a wise man mad[b][a], and a bribe destroys the heart.
  footnotes:
  - marker: a
    text: Or 'a gift destroys the heart.' The Hebrew word can mean 'gift' generally, but here the context strongly favors the negative sense 'bribe.'
    reason: lexical_alternative
  - marker: b
    text: '''The heart'' in Hebrew commonly refers to the inner person, including judgment, understanding, and will.'
    reason: cultural_note
translation:
  language: ko
  text: 왜냐하면 억압은 지혜로운 사람도 미치게 하고, 뇌물은 마음을 망치기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마음’은 흔히 판단, 이해, 의지를 포함하는 내적 중심을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 이 문맥에서는 מַתָּנָה를 일반적인 ‘선물’보다 부정한 ‘뇌물’로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 그리고
  - 그 이유는
  lexicon: HALOT
  rationale: 앞뒤 논리를 설명하는 연결사이므로, 문맥상 원인 제시를 자연스럽게 드러내는 ‘왜냐하면’이 적절합니다.
- source_word: הָעֹשֶׁק
  english_pob_choice: oppression
  chosen_korean: 억압
  alternatives_korean:
  - 압제
  - 착취
  - 불의
  lexicon: HALOT
  rationale: 권력의 남용과 불의한 눌러짬을 포괄하는 말로 ‘억압’이 가장 무난하며, 문맥의 사회적 폭력을 잘 살립니다.
- source_word: יְהוֹלֵל
  english_pob_choice: drives ... mad
  chosen_korean: 미치게 하고
  alternatives_korean:
  - 미련하게 하고
  - 광기 나게 하고
  - 정신이 혼미하게 하고
  lexicon: HALOT
  rationale: 동사가 가리키는 것은 단순한 어리석음보다 이성을 흐트러뜨리는 강한 파괴이므로, 현대 한국어로는 ‘미치게 하고’가 힘을 가장 잘 전달합니다.
- source_word: מַתָּנָה
  english_pob_choice: a bribe
  chosen_korean: 뇌물
  alternatives_korean:
  - 선물
  - 예물
  - 거저 주는 것
  lexicon: HALOT
  rationale: 이 문맥에서는 일반적인 ‘선물’보다 부패를 일으키는 부정한 증여를 가리키므로, POB의 독법에 따라 ‘뇌물’로 옮겼습니다.
theological_decisions:
- issue: ‘heart’의 의미 범위
  chosen_reading: 마음
  alternative_readings:
  - 심장
  - 중심
  - 내면
  rationale: 히브리어 ‘heart’는 판단, 의지, 이해를 포함하는 내적 기관을 가리키므로, 본문 의미를 자연스럽게 전하는 ‘마음’을 본문에 두었습니다.
  doctrine_reference: 히브리어 심장/마음 어휘의 의미 범위
- issue: 억압과 뇌물의 도덕적 병폐를 직설적으로 표현할지 여부
  chosen_reading: 직설적 경고로 유지
  alternative_readings:
  - 완곡하게 표현
  - 도덕적 해석을 약화
  rationale: 지혜문학의 경고를 약화하지 않고, 본문이 말하는 사회적·윤리적 파괴력을 그대로 드러내는 것이 원문 충실도에 더 부합합니다.
  doctrine_reference: 전도서의 지혜문학적 경고
