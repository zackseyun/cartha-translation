translation:
  language: ko
  text: “왜 이전 날들이 지금보다 더 좋았는가?”라고 말하지 마십시오.[b] 이는 이것을 묻는 것이 지혜에서 나온 일이 아니기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이는 이것에 관해 물은 것이 지혜에서 나온 일이 아니기 때문입니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “무엇이 있었기에 이전 날들이 이 날들보다 좋았는가?”라고 하며, ‘왜 이전 날들이 지금보다 더 좋았는가?’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 말하지 마십시오
