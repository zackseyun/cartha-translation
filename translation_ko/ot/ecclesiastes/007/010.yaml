  lexicon: HALOT
  rationale: אַל + תֹּאמַר의 금지문을 합쇼체 명령으로 옮겨, 직접적 금지를 자연스럽게 드러냈습니다.
- source_word: מֶה הָיָה ... הָיוּ טוֹבִים מֵאֵלֶּה
  english_pob_choice: Why were the former days better than these?
  chosen_korean: 옛날이 지금보다 더 좋았다고
  alternatives_korean:
  - 왜 옛날이 지금보다 더 좋았는지
  - 옛날이 이보다 더 좋았다고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다 한국어에서 자연스러운 내용절로 풀어, 원문의 ‘예전이 더 좋다’는 비교 질문의 의미를 살렸습니다.
- source_word: לֹא מֵחָכְמָה
  english_pob_choice: it is not from wisdom
  chosen_korean: 지혜에서 나온 말이 아닙니다
  alternatives_korean:
  - 지혜에서 비롯된 것이 아닙니다
  - 지혜로 하는 말이 아닙니다
  lexicon: HALOT
  rationale: מִן + חָכְמָה의 출처/근거 의미를 살려 ‘지혜에서 나온’으로 옮겼고, 뒤의 ‘이것’은 문맥상 발화 전체를 가리키므로 ‘말’로 자연스럽게 받았습니다.
theological_decisions:
- issue: 잠언적 금지의 적용 범위
  chosen_reading: 이 절은 특정 시대 평가를 금지하는 것이 아니라, 과거를 현재와 우열 비교하며 한탄하는 태도를 지혜와 무관한 것으로 경계합니다.
  alternative_readings:
  - 단순한 시간 비교 자체를 금지하는 것으로 읽기
  - 과거 회상 전반을 부정하는 것으로 읽기
  rationale: 문맥상 지혜서의 일반 원칙을 말하므로, 과거 그 자체가 아니라 무익한 비교와 불평의 태도를 겨냥하는 것으로 읽는 것이 자연합니다.
  doctrine_reference: 전도서 7장 전체의 지혜 문맥
