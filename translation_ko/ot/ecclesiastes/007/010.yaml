  text: אַל תֹּאמַר֙ מֶ֣ה הָיָ֔ה שֶׁ֤/הַ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים הָי֥וּ טוֹבִ֖ים מֵ/אֵ֑לֶּה כִּ֛י לֹ֥א מֵ/חָכְמָ֖ה שָׁאַ֥לְתָּ עַל זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/010.yaml
  text: Do not say[b][a], “Why were the former days better than these?” For it is not from wisdom that you ask this.
  footnotes:
  - marker: a
    text: Or, “For it is not from wisdom that you have asked about this.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “What was it that the former days were better than these?” an idiom meaning “Why were the former days better than these?”
    reason: lexical_alternative
translation:
  language: ko
  text: “옛날이 지금보다 더 좋았다고 말하지 마십시오.” 그것은 지혜에서 나온 말이 아닙니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것은 당신이 이것에 대해 물은 것이 지혜에서 나온 것이 아닙니다.”
    reason: alternative_reading
  - marker: b
    text: 히브리어 관용구는 문자적으로 “옛날이 이보다 더 좋았던 것이 무엇인가?”이며, 뜻은 “옛날이 지금보다 더 좋았다고 왜 말합니까?”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 말하지 마세요
  - 말하지 마라
  lexicon: HALOT
  rationale: אַל + תֹּאמַר의 금지문을 합쇼체 명령으로 옮겨, 직접적 금지를 자연스럽게 드러냈습니다.
- source_word: מֶה הָיָה ... הָיוּ טוֹבִים מֵאֵלֶּה
  english_pob_choice: Why were the former days better than these?
  chosen_korean: 옛날이 지금보다 더 좋았다고
  alternatives_korean:
  - 왜 옛날이 지금보다 더 좋았는지
  - 옛날이 이보다 더 좋았다고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다 한국어에서 자연스러운 내용절로 풀어, 원문의 ‘예전이 더 좋다’는 비교 질문의 의미를 살렸습니다.
- source_word: לֹא מֵחָכְמָה
  english_pob_choice: it is not from wisdom
  chosen_korean: 지혜에서 나온 말이 아닙니다
  alternatives_korean:
  - 지혜에서 비롯된 것이 아닙니다
  - 지혜로 하는 말이 아닙니다
  lexicon: HALOT
  rationale: מִן + חָכְמָה의 출처/근거 의미를 살려 ‘지혜에서 나온’으로 옮겼고, 뒤의 ‘이것’은 문맥상 발화 전체를 가리키므로 ‘말’로 자연스럽게 받았습니다.
theological_decisions:
- issue: 잠언적 금지의 적용 범위
  chosen_reading: 이 절은 특정 시대 평가를 금지하는 것이 아니라, 과거를 현재와 우열 비교하며 한탄하는 태도를 지혜와 무관한 것으로 경계합니다.
  alternative_readings:
  - 단순한 시간 비교 자체를 금지하는 것으로 읽기
  - 과거 회상 전반을 부정하는 것으로 읽기
  rationale: 문맥상 지혜서의 일반 원칙을 말하므로, 과거 그 자체가 아니라 무익한 비교와 불평의 태도를 겨냥하는 것으로 읽는 것이 자연합니다.
  doctrine_reference: 전도서 7장 전체의 지혜 문맥
