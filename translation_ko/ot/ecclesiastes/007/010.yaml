  source_fidelity: 개정이 필요합니다. 초안은 인용된 히브리어 의문문(‘어찌하여/왜 이전 날들이 이 날들보다 좋았는가?’)을 평서 내용절 ‘옛날이 지금보다 더 좋았다고’로 바꾸어, ‘왜’라는 핵심 의문 요소를 빠뜨렸습니다. 후반절은 ‘이것을 묻는 것’이 지혜에서 나온 것이 아니라는 뜻으로 옮기는 것이 원문에 충실합니다.
