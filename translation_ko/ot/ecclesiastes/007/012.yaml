revisions:
- from: 지혜의 그늘 아래에 있는 것은 돈의 그늘 아래에 있는 것과 같으나, 지식의 이점은 지혜가 그 소유자들의 생명을 보존한다는 점입니다.[a][b]
  to: 지혜의 그늘도 돈의 그늘도 피난처가 됩니다.[a] 그러나 지식의 유익은 지혜가 그것을 가진 사람들의 생명을 보존한다는 데 있습니다.[b]
  rationale: 원문의 생략된 비교를 한국어에서 지혜와 돈이 각각 ‘그늘’, 곧 피난처가 된다는 표현으로 보완했습니다. 후반부는 히브리어의 구성상 남아 있는 결합의 어려움을 ‘지식의 유익’으로 보존하고, 여성 단수 접미사가 가리키는 지혜를 ‘그것’으로 명시했습니다. 각주도 설명 대상 어구 바로 뒤에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:17Z'
