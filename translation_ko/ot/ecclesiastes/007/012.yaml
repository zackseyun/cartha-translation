  - 재물의 그늘 아래에 있는 것
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 ‘은’이지만, 전도서의 비교 구조에서는 현대 독자에게 경제적 의미를 분명히 하는 ‘돈’이 자연스럽습니다.
- source_word: וְיִתְרוֹן
  english_pob_choice: but the advantage
  chosen_korean: 이점은
  alternatives_korean:
  - 유익은
  - 이익은
  - 장점은
  lexicon: HALOT
  rationale: 전도서의 יִתְרוֹן은 ‘이득/유익/우위’의 의미를 가지며, 여기서는 앞의 평행을 넘어서는 장점을 가리키므로 ‘이점’이 간결합니다.
- source_word: תְּחַיֶּה
  english_pob_choice: preserves the life of
  chosen_korean: 생명을 보존한다
  alternatives_korean:
  - 살게 한다
  - 생명을 지켜 준다
  - 목숨을 살린다
  lexicon: HALOT
  rationale: Piel חיה는 ‘살게 하다’보다 ‘살아 있게 유지하다/보존하다’의 뜻이 강하므로, 지혜가 소유자들의 생명을 지속적으로 지킨다는 의미를 드러냈습니다.
theological_decisions:
- issue: ‘그늘’ 은유를 한국어에서 어떻게 처리할지
  chosen_reading: 보호와 안전을 뜻하는 비유적 ‘그늘 아래’로 살렸습니다.
  alternative_readings:
  - 추상화하여 ‘보호’로만 옮김
  - 직역하여 ‘그늘’만 반복함
  rationale: 본문의 대비는 지혜와 돈이 모두 실제적 보호를 제공한다는 비유이므로, 이미지를 유지하되 한국어로 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 지혜문학의 비유적 표현
