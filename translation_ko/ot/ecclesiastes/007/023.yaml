id: ECC.7.23
reference: Ecclesiastes 7:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל זֹ֖ה נִסִּ֣יתִי בַֽ/חָכְמָ֑ה אָמַ֣רְתִּי אֶחְכָּ֔מָה וְ/הִ֖יא רְחוֹקָ֥ה מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/023.yaml
  text: All this I tested by wisdom[a]. I said[c][b], “I will become wise,” but it was far from me.
  footnotes:
  - marker: a
    text: Or “All these things I tested with wisdom.”
    reason: lexical_alternative
  - marker: b
    text: Or “I will be wise” or “I will gain wisdom.”
    reason: lexical_alternative
  - marker: c
    text: That is, wisdom remained distant or beyond his grasp.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 지혜로 이 모든 것을 시험해 보았습니다.[a] 나는 말했습니다. “나는 지혜롭게 되리라.” 그러나 그것은 내게서 멀었습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 지혜로 이 모든 것들을 시험해 보았습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “나는 지혜롭겠다고 하리라” 또는 “나는 지혜를 얻으리라.”
    reason: lexical_alternative
  - marker: c
    text: 즉, 지혜는 내 손에 닿지 않을 만큼 멀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זֹה
  english_pob_choice: All this
  chosen_korean: 이 모든 것을
  alternatives_korean:
  - 이 모든 것
  - 이 모든 일들
  lexicon: HALOT
  rationale: 단수 지시대명사 זֹה가 앞선 성찰 전체를 가리키므로, 한국어에서도 전체 범위를 자연스럽게 드러내는 ‘이 모든 것’을 택했습니다.
- source_word: נִסִּיתִי בַחָכְמָה
  english_pob_choice: I tested by wisdom
  chosen_korean: 지혜로 시험했습니다
  alternatives_korean:
  - 지혜로 시험해 보았습니다
  - 지혜와 함께 시험했습니다
  lexicon: HALOT
  rationale: ב는 여기서 수단/방법을 나타내므로 ‘지혜로’가 적절하며, נִסִּיתִי의 평가적·탐색적 의미를 ‘시험했습니다’로 살렸습니다.
- source_word: אֶחְכָּמָה
  english_pob_choice: I will become wise
  chosen_korean: 내가 지혜로워지리라
  alternatives_korean:
  - 내가 지혜롭겠다고 했습니다
  - 내가 지혜를 얻으리라
  lexicon: HALOT
  rationale: חכם의 cohortative는 단순 선언보다 지향·결심을 드러내므로, ‘지혜로워지리라’가 상태로의 도달 욕구를 가장 간결하게 반영합니다.
- source_word: רְחוֹקָה מִמֶּנִּי
  english_pob_choice: was far from me
  chosen_korean: 내게서 멀었습니다
  alternatives_korean:
  - 내게서 멀리 있었습니다
  - 내 손이 닿지 않는 데 있었습니다
  lexicon: HALOT
  rationale: 거리의 상태를 직접적으로 표현하는 말이므로 ‘내게서 멀었습니다’가 가장 직역에 가깝고 자연스럽습니다.
theological_decisions:
- issue: 솔로몬/전도자의 자기성찰 어조
  chosen_reading: 화자의 내적 결심과 좌절을 그대로 드러내는 서술형으로 옮겼습니다.
  alternative_readings:
  - 더 설명적인 방식으로 ‘지혜를 얻으려 했다’고 풀어쓰기
  rationale: 본문은 지혜 탐구의 시도와 그 한계를 대비시키므로, 해석을 덧붙이기보다 화자의 말과 좌절을 직접 제시하는 편이 전도서의 사상을 더 잘 보존합니다.
  doctrine_reference: 전도서 7장 문맥의 지혜 한계와 인간 인식의 제한
- issue: ‘but it was far from me’의 절망적 대비
  chosen_reading: ‘하지만, 그것은 내게서 멀었습니다’로 역접을 분명히 했습니다.
  alternative_readings:
  - 단순 접속인 ‘그리고 그것은 내게서 멀었습니다’
  rationale: 히브리어 וְ는 형식상 ‘그리고’이지만 문맥상 기대의 좌절을 나타내므로, 한국어에서도 역접을 통해 의미 관계를 드러내는 것이 적절합니다.
  doctrine_reference: 전도서의 반전적 수사와 지혜의 제한성
