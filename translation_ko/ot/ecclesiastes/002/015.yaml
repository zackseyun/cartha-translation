revisions:
- from: 제가 마음속으로 말하기를, "우매한 사람에게 일어나는 일이 나에게도 일어날 것입니다. 그렇다면 내가 더 지혜로웠던 것이 무슨 소용이 있습니까?"라고 하였습니다. 그리고 제가 마음속으로 말하기를, 이 또한 헛됩니다.[a]
  to: 저는 마음속으로 “우매한 사람에게 일어나는 일처럼 나에게도 일어날 것입니다. 그렇다면 제가 왜 더 지혜로웠습니까?”라고 말하였습니다. 또 저는 마음속으로 이 또한 헛되다고 말하였습니다.[a]
  rationale: The revision removes the added ‘what use’ interpretation from the Hebrew rhetorical question, retains the comparative ‘more wise,’ and smooths the repeated inward-speech formula in standard modern formal-polite Korean. The established rendering ‘헛되다’ and its lexical footnote are retained.
  reviewer_model: gpt-5.6-terra
