source:
  edition: WLC
  text: וְ/אָמַ֨רְתִּֽי אֲנִ֜י בְּ/לִבִּ֗/י כְּ/מִקְרֵ֤ה הַ/כְּסִיל֙ גַּם אֲנִ֣י יִקְרֵ֔/נִי וְ/לָ֧/מָּה חָכַ֛מְתִּי אֲנִ֖י אָ֣ז יוֹתֵ֑ר וְ/דִבַּ֣רְתִּי בְ/לִבִּ֔/י שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/015.yaml
  text: And I said in my heart[a], "As happens to the fool, so it will happen to me also. Why then was I more wise?" And I said in my heart that this too is vanity.
  footnotes:
  - marker: a
    text: Or 'vapor' or 'breath'; the Hebrew הָבֶל is Ecclesiastes' recurring term for what is fleeting, elusive, or futile.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 마음속으로 “우매한 사람에게 일어나는 일처럼 나에게도 일어날 것입니다. 그렇다면 제가 왜 더 지혜로웠습니까?”라고 말하였습니다. 또 저는 마음속으로 이 또한 헛되다고 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증기’, ‘숨결’. 히브리어 הָבֶל은 전도서에서 덧없고 붙잡기 어려우며 헛된 것을 가리키는 반복어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי ... בְּלִבִּי
  english_pob_choice: And I said in my heart
  chosen_korean: 제가 마음속으로 말하기를
  alternatives_korean:
  - 마음속으로 말했습니다
  - 속으로 말했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어 내부 독백으로 옮기되, ‘마음속으로’로 내적 숙고의 이미지를 유지했습니다.
- source_word: כְּמִקְרֵה הַכְּסִיל
  english_pob_choice: As happens to the fool
  chosen_korean: 우매한 사람에게 일어나는 일이
  alternatives_korean:
  - 어리석은 자에게 닥치는 일이
  - 미련한 사람에게 생기는 일이
  lexicon: HALOT
  rationale: מִקְרֶה의 ‘발생/일어남’ 의미를 살려, 비교 대상을 한국어의 자연스러운 관용으로 풀었습니다. הַכְּסִיל은 지적 무능보다 지혜문학적 도덕성을 띤 ‘우매한 사람’으로 옮겼습니다.
- source_word: חָכַמְתִּי אֲנִי אָז יוֹתֵר
  english_pob_choice: Why then was I more wise?
  chosen_korean: 내가 더 지혜로웠던 것이 무슨 소용이 있습니까?
  alternatives_korean:
  - 그렇다면 내가 더 지혜로웠던 이유가 무엇입니까?
  - 그렇다면 내가 더 지혜로웠던 것이 왜 필요했습니까?
  lexicon: HALOT
  rationale: 직역형 질문보다 문맥상 결론을 드러내는 반문으로 옮겨, 히브리어의 수사적 질문 기능을 한국어로 자연스럽게 재현했습니다. ‘더 지혜로웠던’은 יוֹתֵר의 비교를 반영합니다.
- source_word: הָבֶל
  english_pob_choice: vanity
  chosen_korean: 헛됩니다
  alternatives_korean:
  - 헛됩니다만
  - 허무합니다
  - 덧없습니다
  lexicon: HALOT
  rationale: 전통적 ‘허무’보다 전도서의 반복어를 간결하게 드러내는 현대어 ‘헛되다’를 택했습니다. 반복되는 핵심어를 동사형으로 처리해 문장 전체의 판단을 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 전도서의 הָבֶל 번역어
  chosen_reading: ‘헛됩니다’로 옮기되, 본문 각주에 ‘vapor/breath’의 문자적 배경을 밝힙니다.
  alternative_readings:
  - 허무합니다
  - 덧없습니다
  - 가치 없습니다
  rationale: הָבֶל은 단순한 심리 상태보다 덧없음·일시성·붙잡을 수 없음의 폭을 갖기 때문에, 본문은 읽기 쉬운 현대어로 두되 각주로 어휘적 폭을 보존하는 편이 원문 충실성과 가독성을 함께 살립니다.
  doctrine_reference: Translation philosophy §1, §5
