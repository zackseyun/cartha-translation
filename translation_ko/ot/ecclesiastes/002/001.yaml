id: ECC.2.1
reference: Ecclesiastes 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י לְכָ/ה נָּ֛א אֲנַסְּ/כָ֛ה בְ/שִׂמְחָ֖ה וּ/רְאֵ֣ה בְ/ט֑וֹב וְ/הִנֵּ֥ה גַם ה֖וּא הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/001.yaml
  text: I said in my heart[a], “Come now, I will test you with pleasure; so enjoy what is good.” But look[c][b], this too is vapor.
  footnotes:
  - marker: a
    text: Or 'mirth' or 'joy' for 'pleasure.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'and see good'; the Hebrew idiom means to experience or enjoy what is good.
    reason: lexical_alternative
  - marker: c
    text: Or 'vanity' or 'breath'; Hebrew 'vapor' is a recurring metaphor in Ecclesiastes for what is fleeting or insubstantial.
    reason: lexical_alternative
translation:
  language: ko
  text: “내 마음속으로 말했습니다[a]. ‘자, 내가 너를 즐거움으로 시험해 보겠다. 그러니 무엇이 좋은지 누려 보아라[b].’ 그런데 보십시오[c], 이것도 헛됩니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 마음 안에서/내 마음에’입니다. 히브리어 관용구로서 내면의 자기대화를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘좋은 것을 보라’입니다. 히브리어 관용구는 ‘좋은 것을 경험하다/누리다’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 הֶבֶל은 문자적으로 ‘입김’, ‘증기’를 뜻하며, 전도서에서 덧없고 붙잡을 수 없는 것을 가리키는 반복 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  english_pob_choice: I said in my heart
  chosen_korean: 내 마음속으로 말했습니다
  alternatives_korean:
  - 나는 내 마음에 말했습니다
  - 내가 속으로 말했습니다
  lexicon: WLC; HALOT
  rationale: 히브리어 관용구 ‘마음속으로 말하다’를 한국어에서 자연스럽고 현대적으로 옮기면서도, 내면의 자기대화를 분명히 드러내기 위해 ‘내 마음속으로 말했습니다’로 렌더링했습니다.
- source_word: לְכָה נָּא
  english_pob_choice: Come now
  chosen_korean: 자
  alternatives_korean:
  - 이제
  - 오십시오
  lexicon: WLC; HALOT
  rationale: 자기 자신에게 건네는 촉구의 뉘앙스를 살리기 위해 짧은 호응어 ‘자’를 택했습니다.
- source_word: בְשִׂמְחָה
  english_pob_choice: with pleasure
  chosen_korean: 즐거움으로
  alternatives_korean:
  - 쾌락으로
  - 기쁨으로
  lexicon: WLC; HALOT
  rationale: 전도서의 실험적 향유 맥락을 고려해 ‘즐거움’으로 옮겨, 도덕적 평가를 과하게 덧씌우지 않으면서도 감각적 즐김의 의미를 살렸습니다.
- source_word: וּרְאֵה בְטוֹב
  english_pob_choice: so enjoy what is good
  chosen_korean: 무엇이 좋은지 누려 보아라
  alternatives_korean:
  - 좋은 것을 보아라
  - 좋은 것을 경험해 보아라
  lexicon: WLC; HALOT
  rationale: 직역하면 ‘좋은 것을 보다’이지만 한국어 관용으로는 경험·향유의 뜻이 살아나도록 ‘무엇이 좋은지 누려 보아라’로 옮겼습니다.
- source_word: הָבֶל
  english_pob_choice: vapor
  chosen_korean: 헛됩니다
  alternatives_korean:
  - 입김 같습니다
  - 바람 같습니다
  - 허무합니다
  lexicon: WLC; HALOT
  rationale: 전도서의 핵심 은유인 ‘הֶבֶל’을 한국어에서 가장 널리 읽히는 축약적 의미로 전달하되, 문맥상 평가 결론을 자연스럽게 드러내기 위해 ‘헛됩니다’로 옮겼습니다.
theological_decisions:
- issue: הָבֶל의 번역을 형상적 은유로 유지할지, 해석적 표현으로 풀어쓸지
  chosen_reading: 문맥의 결론을 살려 ‘헛됩니다’로 옮겼습니다.
  alternative_readings:
  - ‘입김 같습니다’
  - ‘바람 같습니다’
  - ‘허무합니다’
  rationale: 이 절은 자기실험의 결과를 선언하는 문장이라, 한국어 독자가 즉시 파악할 수 있는 평가어를 택했습니다. 다만 ‘הֶבֶל’의 핵심은 덧없음·실체 없음에 있으므로, 완전한 교리적 재해석은 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
