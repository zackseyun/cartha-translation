- from: “내 마음속으로 말했습니다[a]. ‘자, 내가 너를 즐거움으로 시험해 보겠다. 그러니 무엇이 좋은지 누려 보아라[b].’ 그런데 보십시오[c], 이것도 헛됩니다.”
