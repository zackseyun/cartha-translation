base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/008.yaml
  text: I also gathered for myself silver and gold[a], and the treasure of kings and provinces. I acquired for myself male singers and female singers[b], and the delights of the sons of man—a concubine and concubines.
  footnotes:
  - marker: a
    text: Or 'the delights of humankind.' The Hebrew reads 'the delights of the sons of man.'
    reason: lexical_alternative
  - marker: b
    text: The meaning of the Hebrew word rendered 'a concubine and concubines' is uncertain; alternatives include 'a mistress and mistresses,' 'male and female cupbearers,' or more generally 'every kind of luxury.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 또한 은과 금, 왕들과 여러 지방의 보물을 모았습니다. 나는 나를 위하여 남자 노래꾼들과 여자 노래꾼들을 마련했으며, 또 사람들이 누리는 즐거움[a], 곧 한 첩과 여러 첩들[b]도 마련했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류의 즐거움’. 히브리어는 직역하면 ‘사람의 아들들의 즐거움’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 이 단어의 뜻은 확실하지 않습니다. ‘한 첩과 여러 첩들’, ‘한 정부와 여러 정부들’, ‘남자와 여자 술시중꾼들’, 또는 더 일반적으로 ‘온갖 사치’로도 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּנַסְתִּי / עָשִׂיתִי לִי
  english_pob_choice: gathered / I acquired for myself
  chosen_korean: 모았습니다 / 제게 마련했고
  alternatives_korean:
  - 수집했습니다 / 제가 얻었습니다
  - 끌어모았습니다 / 제 소유로 삼았습니다
  lexicon: HALOT
  rationale: 두 동사는 단순한 소유가 아니라 솔로몬이 자기 자신을 위해 축적하고 확보한 행위를 가리키므로, ‘모았습니다’와 ‘제게 마련했고’로 자연스럽게 옮겼습니다.
- source_word: סְגֻלַּת מְלָכִים וְהַמְּדִינוֹת
  english_pob_choice: the treasure of kings and provinces
  chosen_korean: 왕들과 지방들의 보물
  alternatives_korean:
  - 왕들과 지방들의 재물
  - 왕들과 지역들의 특별한 보물
  lexicon: HALOT
  rationale: סְגֻלָּה는 ‘보물/귀중한 소유’의 뜻이므로 ‘보물’로 옮겼고, מְדִינוֹת은 추상적 ‘국가들’보다 행정 구역인 ‘지방들’이 문맥에 더 가깝습니다.
- source_word: שָׁרִים וְשָׁרוֹת
  english_pob_choice: male singers and female singers
  chosen_korean: 남자 노래꾼들과 여자 노래꾼들
  alternatives_korean:
  - 남녀 노래꾼들
  - 가수들, 남자와 여자
  lexicon: HALOT
  rationale: 히브리어가 남성형과 여성형을 병렬로 구분하므로, 성별 구분을 살려 ‘남자 노래꾼들과 여자 노래꾼들’로 옮겼습니다.
- source_word: תַעֲנוּגֹת בְּנֵי הָאָדָם
  english_pob_choice: the delights of the sons of man
  chosen_korean: 사람의 아들들의 즐거움
  alternatives_korean:
  - 인간의 즐거움
  - 인류의 즐거움
  lexicon: HALOT
  rationale: 본문의 남성형 표현을 평탄화하지 않고 ‘사람의 아들들’로 남겨, 영어 POB가 보존한 형식을 따르면서도 한국어로 이해 가능하게 했습니다.
- source_word: שִׁדָּה וְשִׁדּוֹת
  english_pob_choice: a concubine and concubines
  chosen_korean: 첩과 첩들
  alternatives_korean:
  - 후궁과 후궁들
  - 정부와 정부들
  - 온갖 사치
  lexicon: HALOT
  rationale: 이 희귀어는 뜻이 불확실하지만, 문맥상 궁정의 성적·사치적 향락을 가리키는 해석이 가장 유력하므로 본문에는 ‘첩과 첩들’을 두고, 불확실성은 주석으로 남겼습니다.
