  doctrine_reference: Translation philosophy §4
- issue: שִׁדָּה וְשִׁדּוֹת의 의미 불확실성
  chosen_reading: 본문에는 ‘첩과 첩들’을 두고, 주석으로 대안적 의미를 열어 두었습니다.
  alternative_readings:
