base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/003.yaml
  text: I searched in my heart to draw my flesh along with wine[a], while my heart was guiding me with wisdom, and to lay hold of folly[b], until I might see what was good for the sons of man to do under the heavens during the number of the days of their lives.
  footnotes:
  - marker: a
    text: Or, 'for humankind.' The Hebrew reads 'for the sons of man,' a masculine-generic expression for humanity.
    reason: alternative_reading
  - marker: b
    text: The phrase 'to draw my flesh along with wine' is difficult Hebrew; it may mean testing bodily pleasure through wine while still retaining wise self-control.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 마음속으로 포도주와 함께 내 육체를 이끌어 볼 것을, 또 내 마음은 지혜로 나를 인도하는 가운데 어리석음을 붙잡아 볼 것을, 하늘 아래서 자기들의 생애의 날 수 동안 인생의 아들들에게 무엇이 좋은 것인지 내가 볼 때까지 탐구했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 육체를 포도주와 함께 이끌다’라고 되어 있어, 육체적 즐거움을 시험하면서도 지혜로운 절제를 유지하는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인생의 아들들’은 히브리어의 남성형 총칭 표현으로, 여기서는 인류 전체를 가리키는 뜻으로 읽을 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: תַּרְתִּי בְלִבִּי
  english_pob_choice: I searched in my heart
  chosen_korean: 나는 마음속으로 탐구했습니다
