  rationale: 히브리어의 남성형 일반표현을 그대로 반영하면서도, 한국어 성경 문맥에서 대표적·총칭적 의미가 드러나도록 ‘인생의 아들들’로 옮겼습니다.
- source_word: תחת השמים
