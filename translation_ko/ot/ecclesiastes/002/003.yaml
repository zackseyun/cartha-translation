  lexicon: HALOT
  rationale: משׁך의 ‘끌다/이끌다’와 בשר의 문자적 ‘육체/살’을 살려, 본문이 가진 난해함과 실험적 뉘앙스를 보존했습니다.
- source_word: ולבי נהג בחכמה
  english_pob_choice: while my heart was guiding me with wisdom
  chosen_korean: 내 마음은 지혜로 나를 인도하는 가운데
  alternatives_korean:
  - 내 마음은 지혜롭게 나를 이끄는 가운데
  - 내 마음이 지혜로 나를 다스리는 가운데
  lexicon: HALOT
  rationale: נהג의 ‘인도하다, 이끌다’ 의미를 살리되, 한국어에서 자연스럽게 읽히도록 관계절로 풀었습니다.
- source_word: בסכלות
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 미련함
  lexicon: HALOT
  rationale: 전도서의 지혜-어리석음 대비를 한국어에서 가장 직접적으로 드러내는 기본어로 ‘어리석음’을 택했습니다.
- source_word: לבני האדם
  english_pob_choice: for the sons of man
  chosen_korean: 인생의 아들들에게
