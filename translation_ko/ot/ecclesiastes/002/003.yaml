  - 나는 마음속으로 살펴보았습니다
  lexicon: HALOT
  rationale: תַּרְתִּי는 내적 탐구와 실험적 검토를 뜻하므로, 표준적이면서도 성찰적인 ‘탐구하다’가 가장 가깝습니다.
- source_word: למשוך ביין את בשרי
  english_pob_choice: to draw my flesh along with wine
  chosen_korean: 포도주와 함께 내 육체를 이끌어 볼 것을
