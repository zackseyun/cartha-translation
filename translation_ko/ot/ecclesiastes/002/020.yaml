base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/020.yaml
  text: So I turned to despair in my heart over all the labor at which I had labored under the sun[a][b].
  footnotes:
  - marker: a
    text: Or 'Then I turned to make my heart despair' / 'Then I turned to give up in my heart.' The Hebrew idiom is compact and can be expressed in several close ways.
    reason: lexical_alternative
  - marker: b
    text: '''Under the sun'' is a recurring Ecclesiastes expression for life in the present world and its earthly sphere.'
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 나는 해 아래에서 내가 수고한 모든 수고 때문에 내 마음이 절망하게 되었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 히브리어 관용구는 ‘내 마음을 절망하게 하다’처럼 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해 아래’는 전도서에 반복되는 표현으로, 현재 세계의 지상적 삶의 영역을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְסַבּוֹתִי
  english_pob_choice: So I turned
  chosen_korean: 그러므로 나는 돌아섰습니다
  alternatives_korean:
  - 그리하여 나는 향했습니다
  - 그래서 나는 돌아보았습니다
  lexicon: HALOT
  rationale: 문맥상 사유의 방향이 바뀌는 전환을 나타내므로, 단순한 물리적 이동보다 ‘돌아서다’로 옮겨 변화의 뉘앙스를 살렸습니다.
- source_word: לְיַאֵשׁ אֶת לִבִּי
  english_pob_choice: to despair in my heart
  chosen_korean: 내 마음이 절망하게 되었습니다
  alternatives_korean:
  - 내 마음을 절망에 빠뜨리게 되었습니다
  - 내 마음에 절망이 들게 되었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘마음’을 절망 상태로 이끄는 관용구이므로, 한국어에서는 결과 상태를 자연스럽게 드러내는 수동/사역형 표현으로 옮겼습니다.
- source_word: כָּל הֶעָמָל שֶׁעָמַלְתִּי
  english_pob_choice: all the labor at which I had labored
  chosen_korean: 내가 수고한 모든 수고
  alternatives_korean:
  - 내가 애써 온 모든 수고
  - 내가 일해 온 모든 노동
  lexicon: HALOT
  rationale: עָמָל과 동사 עָמַל의 반복을 한국어에서도 ‘수고’로 되풀이해, 원문의 강조를 살리되 과도한 직역은 피했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 세상 아래에서
  lexicon: HALOT
  rationale: 전도서의 반복 표지를 일관되게 살리기 위해 직역적 관용구인 ‘해 아래에서’를 사용했습니다.
theological_decisions:
- issue: 전도서의 반복 어구인 ‘해 아래’의 의미 범위
  chosen_reading: 창조 세계의 제한된 현세, 곧 하나님을 배제한 지상 삶의 영역을 가리키는 전도서의 표지 표현으로 유지했습니다.
  alternative_readings:
  - 단순히 ‘이 세상에서’로 풀어 쓰는 읽기
  - 일반적인 자연 현상 묘사로만 보는 읽기
  rationale: 본문의 사색적·신학적 범위를 넓은 인생 일반으로 환원하지 않기 위해, 전도서 고유 표현을 보존했습니다.
  doctrine_reference: 전도서 1–3장의 반복 주제와 해 아래 표현의 문맥적 기능
