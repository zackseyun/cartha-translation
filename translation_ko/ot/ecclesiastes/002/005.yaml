  text: עָשִׂ֣יתִי לִ֔/י גַּנּ֖וֹת וּ/פַרְדֵּסִ֑ים וְ/נָטַ֥עְתִּי בָ/הֶ֖ם עֵ֥ץ כָּל פֶּֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/005.yaml
  text: I made for myself gardens and parks[a], and I planted in them every kind of fruit tree.
  footnotes:
  - marker: a
    text: Or 'orchards' for 'parks' (Hebrew pardesim), referring to enclosed cultivated pleasure-grounds or orchard-parks.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내게 정원들과 공원들[a]을 만들고, 그 안에 온갖 과일나무를 심었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘과수원들’. 히브리어 파르데심(pardesim)은 둘러싸인 조경지나 과수원-공원 같은 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  english_pob_choice: I made for myself
  chosen_korean: 나는 내게 …을 만들고
  alternatives_korean:
  - 나는 나를 위해 …을 만들고
  - 나는 내게 …을 마련하고
  lexicon: HALOT
  rationale: עשה의 기본 의미를 살려 ‘만들다’로 옮기고, לִי의 자기지향적 뉘앙스는 ‘내게’로 반영했습니다. 한국어에서는 ‘나를 위해’보다 ‘내게’가 이어지는 소유·이익의 흐름을 더 자연스럽게 드러냅니다.
- source_word: גַּנּוֹת
  english_pob_choice: gardens
  chosen_korean: 정원들
  alternatives_korean:
  - 동산들
  - 뜰들
  lexicon: HALOT
  rationale: 일반적이고 기본적인 גַּן의 복수형으로서 현대 한국어의 ‘정원들’이 가장 직관적입니다.
- source_word: פַרְדֵּסִים
  english_pob_choice: parks
  chosen_korean: 공원들
  alternatives_korean:
  - 과수원들
  - 낙원들
  - 별장 정원들
  lexicon: HALOT
  rationale: פַרְדֵּס는 둘러싸인 조경·휴양 공간을 가리키므로, 문맥상 단순 과수원보다 넓은 ‘공원들’이 영어 POB의 ‘parks’를 가장 잘 반영합니다.
- source_word: עֵץ כָּל פֶּרִי
  english_pob_choice: every kind of fruit tree
  chosen_korean: 온갖 과일나무
  alternatives_korean:
  - 모든 종류의 과일나무
  - 열매 맺는 모든 나무
  lexicon: HALOT
  rationale: 직역하면 ‘모든 열매의 나무’에 가깝지만, 관용적으로는 나무의 종류를 가리키는 ‘온갖 과일나무’가 분포적 의미와 식물학적 뜻을 함께 살립니다.
theological_decisions:
- issue: 전도자의 자기 성취 열거를 현대 한국어로 어떻게 유지할지
  chosen_reading: 과장 없이 일인칭 완료 서술로 옮겨, 왕의 자기 주도적 조경 사업이라는 사실적 어조를 유지했습니다.
  alternative_readings:
  - 나는 스스로 정원들과 공원들을 지었습니다
  - 나는 내 소유로 정원들과 공원들을 마련했습니다
  rationale: 본문은 신학적 해설보다 전도자의 경험 진술이 핵심이므로, 서술의 누적감과 소유감을 살리되 의미를 확대하지 않았습니다.
  doctrine_reference: 전도서 2:5의 문맥적 자전적 진술
