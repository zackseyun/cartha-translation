id: ECC.2.7
reference: Ecclesiastes 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָנִ֨יתִי֙ עֲבָדִ֣ים וּ/שְׁפָח֔וֹת וּ/בְנֵי בַ֖יִת הָ֣יָה לִ֑/י גַּ֣ם מִקְנֶה֩ בָקָ֨ר וָ/צֹ֤אן הַרְבֵּה֙ הָ֣יָה לִ֔/י מִ/כֹּ֛ל שֶֽׁ/הָי֥וּ לְ/פָנַ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/007.yaml
  text: I acquired male slaves and female slaves[a], and homeborn slaves were mine; I also had great herds of cattle and flocks[b], more than all who were before me in Jerusalem.
  footnotes:
  - marker: a
    text: Literally, 'sons of the house,' referring to persons born into the household; in this context, likely household slaves born there.
    reason: cultural_note
  - marker: b
    text: Or 'livestock ... in abundance'; the Hebrew uses collective terms for animal holdings.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 남녀 종들을 사들였고, 집에서 난 종들도 제 것이었습니다. 또 큰 가축 떼와 양 떼도 있었으니, 예루살렘에서 저보다 먼저 있던 모든 사람보다 많았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘집의 아들들’로, 이 문맥에서는 집안에서 난 종들, 곧 가내 출생 종들을 가리키는 말로 이해됩니다.
    reason: source_note
  - marker: b
    text: 히브리어는 가축 보유를 집합적으로 말합니다. 직역하면 ‘소 떼와 양 떼’ 또는 더 넓게는 ‘가축’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתִי
  english_pob_choice: I acquired
  chosen_korean: 사들였고
  alternatives_korean:
  - 획득했고
  - 얻었고
  - 구입했고
  lexicon: HALOT
  rationale: 맥락상 재산·소유를 늘려 가는 목록이므로, 단순한 ‘얻다’보다 취득의 구체성을 살리면서도 구매만으로 과도하게 좁히지 않는 ‘사들이다’가 적절합니다.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  english_pob_choice: male slaves and female slaves
  chosen_korean: 남녀 종들
  alternatives_korean:
  - 남자 종들과 여자 종들
  - 남종들과 여종들
  - 노예들과 노예 여자들
  lexicon: HALOT
  rationale: POB의 영어는 성별과 종속 상태를 함께 드러내지만, 한국어에서는 ‘남녀 종들’이 자연스럽고 과도한 반복 없이 성별 대비를 보존합니다.
- source_word: וּבְנֵי בַיִת
  english_pob_choice: homeborn slaves
  chosen_korean: 집에서 난 종들
  alternatives_korean:
  - 가내 종들
  - 집에서 태어난 종들
  - 집안에서 난 종들
  lexicon: HALOT
  rationale: 직역의 ‘집의 아들들’보다 한국어 관용에 맞는 ‘집에서 난’이 출생 기원을 분명히 하며, 문맥상 가정 내에서 태어난 종이라는 POB의 주석 취지를 살립니다.
- source_word: הָיָה לִי
  english_pob_choice: were mine
  chosen_korean: 제 것이었습니다
  alternatives_korean:
  - 제 것이었습니다
  - 제 소유였습니다
  - 제 소유로 있었습니다
  lexicon: HALOT
  rationale: 소유 완료를 나타내는 관용 표현이므로, 목록형 서술에 자연스러운 ‘제 것이었습니다’로 옮겼습니다.
- source_word: מִקְנֶה בָקָר וָצֹאן הַרְבֵּה
  english_pob_choice: great herds of cattle and flocks
  chosen_korean: 큰 가축 떼와 양 떼
  alternatives_korean:
  - 많은 소 떼와 양 떼
  - 큰 목축 떼와 양 떼
  - 풍부한 가축 떼와 양 떼
  lexicon: HALOT
  rationale: 히브리어는 집합적 축산 자산을 가리키므로, ‘가축 떼’로 총괄한 뒤 ‘양 떼’로 구체화해 POB의 집합적 의미를 유지했습니다.
- source_word: מִכֹּל שֶׁהָיוּ לְפָנַי
  english_pob_choice: more than all who were before me
  chosen_korean: 저보다 먼저 있던 모든 사람보다
  alternatives_korean:
  - 저보다 앞서 있던 모든 이들보다
  - 제 앞선 모든 사람보다
  - 저보다 이전에 있던 모든 이보다
  lexicon: HALOT
  rationale: 비교의 초점은 선행 세대 전체를 능가한다는 뜻이므로, ‘저보다 먼저 있던 모든 사람보다’로 직역에 가깝게 보존했습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에 있는
  - 예루살렘에서
  lexicon: HALOT
  rationale: 지명은 표준 표기 ‘예루살렘’을 유지하고, 앞선 목록의 비교 기준을 자연스럽게 마무리하는 조사로 ‘에서’를 사용했습니다.
theological_decisions:
- issue: עֲבָדִים / שְׁפָחוֹת의 사회적 강도
  chosen_reading: ‘종들’로 옮겨 지배·소속 관계를 드러내되, 현대어로 읽히는 자연성을 유지했습니다.
  alternative_readings:
  - ‘노예들’로 더 강하게
  - ‘종복들’로 완화
  - ‘하인들’로 중화
  rationale: 이 구절은 솔로몬의 재산 축적을 나열하는 문맥으로, 강제적 종속 관계가 실제로 포함될 수 있으나 한국어 본문에서 과도하게 현대 윤리적 해설을 덧붙이지 않도록 ‘종들’이 균형적입니다.
  doctrine_reference: 구약 지혜서의 역사적 서술에서 사회제도 용어를 본문 자체의 강도로 번역하는 원칙
