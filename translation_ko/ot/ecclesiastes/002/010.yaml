source:
  edition: WLC
  text: וְ/כֹל֙ אֲשֶׁ֣ר שָֽׁאֲל֣וּ עֵינַ֔/י לֹ֥א אָצַ֖לְתִּי מֵ/הֶ֑ם לֹֽא מָנַ֨עְתִּי אֶת לִבִּ֜/י מִ/כָּל שִׂמְחָ֗ה כִּֽי לִבִּ֤/י שָׂמֵ֨חַ֙ מִ/כָּל עֲמָלִ֔/י וְ/זֶֽה הָיָ֥ה חֶלְקִ֖/י מִ/כָּל עֲמָלִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/010.yaml
  text: And whatever my eyes desired I did not withhold from them[a]; I did not keep my heart from any pleasure, for my heart rejoiced in all my labor[c][b], and this was my portion from all my labor.
  footnotes:
  - marker: a
    text: Or 'whatever my eyes asked for, I did not keep from them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I did not restrain my heart from any joy.'
    reason: lexical_alternative
  - marker: c
    text: '''Labor'' may also be rendered ''toil'' in both occurrences of the Hebrew term.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 눈이 원하는 것은 무엇이든, 나는 그것을 얻지 못하게 하지 않았습니다[a]. 어떤 즐거움도 내 마음이 누리지 못하게 하지 않았습니다[b]. 내 마음이 내 모든 수고로 기뻐하였기 때문입니다[c]. 이것이 내 모든 수고에서 얻은 내 몫이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 눈이 구하는 것은 무엇이든 나는 그것을 내 눈에게서 아끼지 않았습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 어떤 기쁨에서도 내 마음을 억제하지 않았습니다.’
    reason: lexical_alternative
  - marker: c
    text: ‘수고’는 히브리어 עָמָל의 번역이며, 두 곳 모두 ‘노고’ 또는 ‘노동’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ עֵינַי
  english_pob_choice: whatever my eyes desired
  chosen_korean: 무엇이든 내 눈이 원한 것
  alternatives_korean:
  - 내 눈이 요구한 것
  - 내 눈이 바란 것
  lexicon: HALOT
  rationale: ‘눈’이 주어인 관용적 표현을 살려, 단순한 ‘요구’보다 시각적 욕망의 뉘앙스를 담는 ‘원한 것’으로 옮겼습니다.
- source_word: אָצַלְתִּי מֵהֶם
  english_pob_choice: I did not withhold from them
  chosen_korean: 그것을 그들에게서 빼앗지 않았습니다
  alternatives_korean:
  - 그들에게서 아끼지 않았습니다
  - 그들에게서 거두어들이지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 눈이 원하는 것을 허락하지 않는 뜻이므로, ‘withhold’의 핵심을 분명하게 드러내는 ‘빼앗지 않았습니다’로 옮겼습니다.
- source_word: מָנַעְתִּי אֶת לִבִּי מִכָּל שִׂמְחָה
  english_pob_choice: I did not keep my heart from any pleasure
  chosen_korean: 나는 어떤 즐거움에서도 내 마음을 막지 않았습니다
  alternatives_korean:
  - 나는 내 마음을 어떤 기쁨도 누리지 못하게 하지 않았습니다
  - 나는 어떤 আনন্দ에서도 내 마음을 억제하지 않았습니다
  lexicon: HALOT
  rationale: ‘마음’이 내적 자아를 가리키는 만큼, 억제의 의미를 살리되 현대 한국어로 자연스럽게 들리는 ‘막지 않았습니다’를 선택했습니다.
- source_word: שִׂמְחָה
  english_pob_choice: pleasure
  chosen_korean: 즐거움
  alternatives_korean:
  - 기쁨
  - 환희
  lexicon: HALOT
  rationale: 이 문맥은 금욕의 부정이 아니라 향유의 범위를 말하므로, ‘joy’보다 감각적으로 넓은 ‘즐거움’이 POB의 의미를 잘 반영합니다.
- source_word: עֲמָלִי
  english_pob_choice: my labor
  chosen_korean: 내 모든 수고
  alternatives_korean:
  - 내 모든 노동
  - 내 모든 노력
  lexicon: HALOT
  rationale: 전도서의 עָמָל은 단순 노동보다 삶의 힘든 수고를 포함하므로, 두 번의 용례를 모두 ‘수고’로 일관되게 옮겼습니다.
- source_word: חֶלְקִי
  english_pob_choice: my portion
  chosen_korean: 내 몫
  alternatives_korean:
  - 내 분깃
  - 내 분
  lexicon: HALOT
  rationale: 지혜문학의 ‘portion’은 인생에서 주어진 몫이라는 뜻이므로, 오늘날 자연스럽고도 비유를 유지하는 ‘몫’이 적절합니다.
theological_decisions:
- issue: 쾌락과 수고의 관계
  chosen_reading: 본문은 자제의 실패를 미화하지 않고, 자기 쾌락 추구의 결과를 ‘내 몫’으로 회고하는 방식으로 말합니다.
  alternative_readings:
  - 단순히 성공의 축하로 읽는 해석
  - 도덕적 자기비난으로만 읽는 해석
  rationale: 전도자의 회고는 실험적 향유의 한계를 드러내며, 마지막 절의 ‘내 몫’은 쾌락이 결국 인생의 전체 의미가 되지 못했음을 시사합니다.
  doctrine_reference: 전도서의 허무/유한성 주제
- issue: ‘즐거움’의 번역
  chosen_reading: שִׂמְחָה를 ‘즐거움’으로 옮겨 향유와 쾌락의 범위를 드러냈습니다.
  alternative_readings:
  - ‘기쁨’으로 옮겨 더 내면적인 정서로 읽는 해석
  rationale: 문맥상 단순한 정서적 기쁨보다 삶의 향유와 만족의 범위를 가리키므로, 본문의 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 전도서 2장의 지혜적 관찰
