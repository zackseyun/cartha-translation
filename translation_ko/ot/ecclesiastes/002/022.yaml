id: ECC.2.22
reference: Ecclesiastes 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י מֶֽה הֹוֶ֤ה לָֽ/אָדָם֙ בְּ/כָל עֲמָל֔/וֹ וּ/בְ/רַעְי֖וֹן לִבּ֑/ו שֶׁ/ה֥וּא עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/022.yaml
  text: For what does a man gain from all his labor and from the striving of his heart with which he toils under the sun?[a]
  footnotes:
  - marker: a
    text: Or 'the vexation of his heart' or 'the pursuit/preoccupation of his heart.' The Hebrew term רַעְיוֹן can carry nuances of inner striving, mental pursuit, or troubled preoccupation in Ecclesiastes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 사람이 그의 모든 수고와 마음의 추구로부터 무엇을 얻습니까? 그는 해 아래에서 수고합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '마음의 번민' 또는 '마음의 추구/몰두'. 히브리어 רַעְיוֹן은 전도서에서 내적 분투, 정신적 추구, 혹은 괴로운 몰두의 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / מֶה הֹוֶה
  english_pob_choice: For what does a man gain
  chosen_korean: 그러므로 사람이 … 무엇을 얻습니까?
  alternatives_korean:
  - 왜냐하면 사람이 … 무엇을 얻습니까?
  - 사람이 … 무엇을 얻습니까?
  lexicon: HALOT
  rationale: 질문형 수사 구조를 한국어에서 자연스럽게 살리기 위해 '무엇을 얻습니까?'로 옮기고, כִּי의 설명적 연결은 문맥상 '그러므로'로 처리했습니다.
- source_word: בְּכָל עֲמָלוֹ
  english_pob_choice: from all his labor
  chosen_korean: 그의 모든 수고로부터
  alternatives_korean:
  - 그의 모든 노동에서
  - 그의 모든 수고에서
  lexicon: HALOT
  rationale: עָמָל의 육체적·고된 노동감을 살려 '수고'를 택했고, 전치사 בְּ의 결과/근원 뉘앙스를 '로부터'로 드러냈습니다.
- source_word: וּבְרַעְיוֹן לִבּוֹ
  english_pob_choice: and from the striving of his heart
  chosen_korean: 마음의 추구로부터
  alternatives_korean:
  - 마음의 갈등으로부터
  - 마음의 번민으로부터
  - 마음의 집착으로부터
  lexicon: HALOT
  rationale: רַעְיוֹן은 전도서에서 내적 추구, 사색, 불안한 몰두를 아우를 수 있어, 본문 문맥을 지나치게 감정화하지 않는 '추구'를 선택했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 세상에서
  lexicon: HALOT
  rationale: 전도서의 반복 표현을 관용구로 보존하되, 한국어에서 자연스러운 등가인 '해 아래'를 사용해 문학적 반복성을 유지했습니다.
theological_decisions:
- issue: 인칭과 대표적 남성형 אָדָם의 처리
  chosen_reading: '''사람이''로 번역해 대표적 인간 일반을 드러내되, 단수 수사 구조는 유지했습니다.'
  alternative_readings:
  - '''한 사람이'''
  - '''사람은'''
  rationale: 히브리어의 남성 단수 형식을 기계적으로 '남자'로 좁히기보다, 전도서의 일반적 인간론을 살리는 표현이 본문의 기능에 더 맞습니다.
  doctrine_reference: 성경 번역의 대표성 원칙
