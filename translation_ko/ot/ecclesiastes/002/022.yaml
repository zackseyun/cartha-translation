review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. כִּי는 앞 진술에 대한 이유·설명을 잇는 접속사인데, ‘그러므로’는 결과를 나타내므로 방향이 바뀝니다. 또한 שֶׁהוּא עָמֵל תַּחַת הַשָּׁמֶשׁ은 앞의 수고 및 마음의 추구와 관련하여 ‘그가 해 아래에서 수고하는’이라는 한정 관계를 이루며, 이를 독립문 ‘그는 … 수고합니다’로 분리하면 원문의 연결이 약화됩니다.
  naturalness: ‘사람이 해 아래에서 수고하는 모든 수고와 마음의 추구에서 무엇을 얻습니까?’는 현대 표준어 합쇼체로 자연스럽고, 전도서의 수사적 질문과 반복 표현 ‘해 아래’를 보존합니다.
  terminology: עָמָל은 ‘수고’, רַעְיוֹן לִבּוֹ는 본문에서 평가를 과도하게 덧붙이지 않는 ‘마음의 추구’로 유지할 수 있습니다. רַעְיוֹן의 ‘번민/몰두’ 가능성은 각주에서 제시합니다. אָדָם은 일반적 인간을 가리키므로 ‘사람’이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그러므로’가 כִּי의 설명적 기능을 결과적 연결로 바꿉니다.
    rationale: 원문의 כִּי는 ‘왜냐하면/이는’에 가까운 논증적 설명을 도입합니다. 한국어에서는 별도의 접속사를 생략해도 질문의 자연스러움을 유지하면서 이 기능을 지나치게 변경하지 않을 수 있습니다.
  - severity: high
