  rationale: ‘그러므로’를 삭제하여 כִּי의 설명적 접속을 한국어의 무표지 연결로 처리했고, ‘해 아래에서 수고하는’을 앞의 명사구를 한정하는 구조로 회복했습니다. 핵심 어휘와 수사적 질문, 그리고 רַעְיוֹן의 어휘적 모호성은 보존했습니다.
