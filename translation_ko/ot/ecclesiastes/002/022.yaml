    rationale: שֶׁהוּא עָמֵל תַּחַת הַשָּׁמֶשׁ은 앞의 ‘모든 수고와 마음의 추구’를 수식하는 관계절입니다. 독립 서술로 만들면 원문의 ‘그가 해 아래에서 수고하는 … 에서 무엇을 얻는가’라는 질문 구조가 흐려집니다.
