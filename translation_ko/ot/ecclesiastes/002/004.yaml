  - 나는 나의 업적들을 확대했습니다
  lexicon: HALOT
  rationale: 히필형의 확대·증가 의미를 살리되, 뒤의 구체적 건축·식재 활동을 포괄할 수 있도록 ‘업적들’과 ‘크게 했습니다’를 결합했습니다.
- source_word: מַעֲשַׂי
  english_pob_choice: my works
  chosen_korean: 나의 업적들
  alternatives_korean:
