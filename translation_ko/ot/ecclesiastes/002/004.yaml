  - 나는 나의 프로젝트들을 확대했습니다
  - 나는 나의 업적들을 확대했습니다
  lexicon: HALOT
  rationale: 히필형의 확대·증가 의미를 살리되, 뒤의 구체적 건축·식재 활동을 포괄할 수 있도록 ‘업적들’과 ‘크게 했습니다’를 결합했습니다.
- source_word: מַעֲשַׂי
  english_pob_choice: my works
  chosen_korean: 나의 업적들
  alternatives_korean:
  - 나의 일들
  - 나의 행위들
  - 나의 프로젝트들
  - 나의 일거리들
  lexicon: HALOT
  rationale: 문맥상 단순한 행위가 아니라 왕적 성취와 사업을 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘업적들’이 가장 잘 맞습니다.
- source_word: בָּתִּים
  english_pob_choice: houses
  chosen_korean: 집들
  alternatives_korean:
  - 건물들
  - 궁전들
  - 저택들
  lexicon: HALOT
  rationale: 히브리어의 기본 뜻은 ‘집’이므로, 왕궁 뉘앙스 가능성보다 원의에 가까운 기본어를 유지했습니다.
theological_decisions:
- issue: 전도서 2:4의 자기 성취를 고백하는 화자의 어조
  chosen_reading: 화자는 자기 손으로 이룬 성과를 열거하는 식으로 말하며, 이를 도덕적 평가보다 실존적 기록으로 옮겼습니다.
  alternative_readings:
  - 성취를 자랑하는 어조로 강하게 옮김
  - 반어를 과도하게 강조함
  rationale: 본문은 공적 고백의 사실 진술에 가깝기 때문에, 해석을 덧씌우기보다 화자의 서술을 그대로 드러내는 번역이 적절합니다.
  doctrine_reference: 전도서의 지혜문학적 서술 방식
