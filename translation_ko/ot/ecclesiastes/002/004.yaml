  - 나의 행위들
  - 나의 프로젝트들
  - 나의 일거리들
  lexicon: HALOT
  rationale: 문맥상 단순한 행위가 아니라 왕적 성취와 사업을 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘업적들’이 가장 잘 맞습니다.
