  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָנִ֣יתִֽי אֲנִ֗י בְּ/כָל מַעֲשַׂ/י֙ שֶֽׁ/עָשׂ֣וּ יָדַ֔/י וּ/בֶֽ/עָמָ֖ל שֶׁ/עָמַ֣לְתִּי לַ/עֲשׂ֑וֹת וְ/הִנֵּ֨ה הַ/כֹּ֥ל הֶ֨בֶל֙ וּ/רְע֣וּת ר֔וּחַ וְ/אֵ֥ין יִתְר֖וֹן תַּ֥חַת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/011.yaml
  text: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
  footnotes:
  - marker: a
    text: Or 'vapor' or 'breath'; the Hebrew hebel often conveys what is fleeting, insubstantial, or frustratingly elusive.
    reason: lexical_alternative
  - marker: b
    text: Or 'striving after wind.' The Hebrew idiom depicts futile effort or pursuit.
    reason: lexical_alternative
  - marker: c
    text: Or 'gain' or 'advantage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 내 손으로 한 모든 일과 내가 이루려고 수고한 모든 수고를 돌아보았습니다. 보십시오, 모든 것이 헛되며[a] 바람을 쫓는 것이고[b], 해 아래에는 아무 유익도 없었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛됨’, ‘입김’, ‘숨결’로도 옮길 수 있습니다. 히브리어 hebel은 덧없음, 실체 없음, 붙잡기 어려움을 함께 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바람을 좇는 수고’ 또는 ‘바람을 좇아 애씀’으로도 옮길 수 있습니다. 히브리어 관용구는 헛된 추구를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이익’ 또는 ‘남는 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי
  english_pob_choice: Then I turned to consider
  chosen_korean: 그때 나는 … 돌아보았습니다
  alternatives_korean:
  - 그때 나는 … 살펴보았습니다
  - 그때 나는 … 생각해 보았습니다
  - 그때 나는 … 돌이켰습니다
  lexicon: WLC/HALOT
  rationale: פנה의 핵심은 물리적 ‘돌아섬’이지만, 문맥상 전도서 화자가 자신의 성취를 평가하는 반성적 전환을 가리키므로 ‘돌아보다’로 자연스럽게 옮겼습니다.
- source_word: שֶׁעָשׂוּ יָדַי
  english_pob_choice: that my hands had done
  chosen_korean: 내 손이 행한
  alternatives_korean:
  - 내 손이 만든
  - 내 손이 이루어 낸
  - 내 손으로 한
  lexicon: WLC/HALOT
  rationale: ‘내 손’이라는 히브리어 표현이 드러내는 직접적 행위성과 개인적 노력을 살리기 위해, POB의 관찰적 어감을 따라 ‘행한’으로 옮겼습니다.
- source_word: וּרְעוּת רוּחַ
  english_pob_choice: a chasing after wind
  chosen_korean: 바람을 쫓는 것
  alternatives_korean:
  - 바람을 좇는 것
  - 바람을 좇아 애쓰는 것
  - 헛된 추구
  lexicon: WLC/HALOT
  rationale: 관용구의 핵심은 헛된 추적이라는 이미지이므로, 직역에 가까운 ‘바람을 쫓는 것’을 사용해 의미와 은유를 함께 유지했습니다.
- source_word: יִתְרוֹן
  english_pob_choice: profit
  chosen_korean: 유익
  alternatives_korean:
  - 이익
  - 남는 것
  - 이득
  lexicon: WLC/HALOT
  rationale: 전도서의 반복 어휘인 יִתְרוֹן은 경제적 ‘이익’보다 ‘남는 유익/소득’의 뉘앙스가 있어, 문맥에 잘 맞는 ‘유익’으로 옮겼습니다.
theological_decisions:
- issue: הֶבֶל의 핵심 의미 보존
  chosen_reading: ‘헛되고’로 옮기되, 전도서의 반복 주제인 허무·덧없음의 층위를 유지했습니다.
  alternative_readings:
  - 덧없고
  - 헛됨이며
  - 입김 같은
  rationale: הֶבֶל은 단순한 ‘무의미’보다 덧없음, 허무, 붙잡을 수 없음의 폭넓은 의미를 가지므로, 전도서 전체 어휘와의 연속성을 살려 ‘헛되다’를 채택했습니다.
  doctrine_reference: 전도서 1–2장의 주제어 해석
- issue: 수사적 전환 표지의 처리
  chosen_reading: ‘보십시오’로 옮겨, הִנֵּה의 갑작스러운 결론 제시와 관찰 촉구를 드러냈습니다.
  alternative_readings:
  - 보라
  - 보게 됩니다
  - 그리고 보니
  rationale: 본문은 단순 진술이 아니라 평가의 결론을 독자에게 제시하는 구조이므로, 현대 한국어에서 자연스럽고도 강조가 살아 있는 ‘보십시오’를 선택했습니다.
  doctrine_reference: 전도서의 선언적 수사
