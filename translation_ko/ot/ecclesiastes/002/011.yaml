  rationale: ‘모두가’를 무생물 총칭인 ‘모든 것이’로 바로잡아 원문의 지시 대상을 보존했습니다. 문장을 현대 표준어에 맞게 다듬되, ‘수고한 모든 수고’라는 반복을 유지하여 עָמָל/עָמַלְתִּי의 강조를 살렸습니다. 각주 표지는 각각 ‘헛되며’, ‘바람을 쫓는’, ‘유익’에 붙여 원어 어휘와 대안 번역의 연결을 명확히 했습니다.
