id: ECC.2.26
reference: Ecclesiastes 2:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/026.yaml
  text: For to the man who is good before him he has given wisdom and knowledge and joy[a], but to the sinner he has given the task of gathering and collecting, to give to the one who is good before God[b]. This too is vanity and a chasing after wind.
  footnotes:
  - marker: a
    text: Or, 'who pleases him' / 'who pleases God.' The Hebrew literally says 'who is good before him/God.'
    reason: alternative_reading
  - marker: b
    text: Or, 'striving after wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분 앞에서 선한 사람에게는 지혜와 지식과 기쁨을 주셨지만[a], 죄인에게는 모아 들이고 쌓아 두는 일을 주셔서 하나님 앞에서 선한 사람에게 주게 하십니다[b]. 이것도 헛되고 바람을 쫓는 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 기쁘시게 하는 사람’ / ‘하나님을 기쁘시게 하는 사람’. 히브리어는 문자적으로 ‘그분/하나님 앞에서 선한 사람’이라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘바람을 좇는 일’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  english_pob_choice: to the man
  chosen_korean: 사람에게는
  alternatives_korean:
  - 그 사람에게는
  - 인간에게는
  lexicon: HALOT
  rationale: 히브리어 אָדָם은 여기서 죄인과 대비되는 개별 인물을 가리키므로, 성중립적 일반화보다 문맥상 개인을 뜻하는 ‘사람’이 자연스럽습니다.
- source_word: שֶׁטּוֹב לְפָנָיו
  english_pob_choice: who is good before him
  chosen_korean: 그분 앞에서 선한
  alternatives_korean:
  - 그분을 기쁘시게 하는
  - 하나님 보시기에 선한
  lexicon: HALOT
  rationale: 좋음의 표현을 직접 살려 ‘선한’으로 옮기고, 전치사구는 ‘그분 앞에서’로 보존해 원문의 평가적 구조를 드러냈습니다.
- source_word: עִנְיָן לֶאֱסוֹף וְלִכְנוֹס
  english_pob_choice: the task of gathering and collecting
  chosen_korean: 모아 들이고 쌓아 두는 일
  alternatives_korean:
  - 모으고 축적하는 일
  - 거두어 모으는 일
  lexicon: HALOT
  rationale: ‘עִנְיָן’은 전도서에서 부여된 일/골칫거리의 뉘앙스를 가질 수 있어 ‘일’로 처리했고, 중복 동사쌍은 누적 행위를 살려 ‘모아 들이고 쌓아 두는’으로 옮겼습니다.
- source_word: הֶבֶל וּרְעוּת רוּחַ
  english_pob_choice: vanity and a chasing after wind
  chosen_korean: 헛되고 바람을 쫓는 일
  alternatives_korean:
  - 허무하고 바람을 쫓는 일
  - 헛됨과 바람을 쫓는 일
  lexicon: HALOT
  rationale: 전도서의 핵심어 הֶבֶל은 전통적 울림을 살리는 ‘헛되다’ 계열로 옮겼고, 관용구 רְעוּת רוּחַ는 의미를 드러내는 직역보다 자연스러운 ‘바람을 쫓는 일’로 처리했습니다.
theological_decisions:
- issue: 26절 전반의 주체가 되는 ‘주셨습니다’의 귀속
  chosen_reading: 이 절 전체의 주체는 문맥상 하나님으로 이해해 한국어 본문도 하나님이 주시는 것으로 읽히게 했습니다.
  alternative_readings:
  - 일반적/비인칭적 주체로 두는 읽기
  rationale: 직전 문맥이 하나님이 주시는 것을 말하고 있으며, 절 후반에도 하나님이 명시되므로 같은 주체를 유지하는 것이 흐름과 신학에 가장 잘 맞습니다.
  doctrine_reference: 전도서 2:24-26의 문맥적 일관성
