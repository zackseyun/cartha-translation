revisions:
- from: 나는 해 아래에서 수고한 내 모든 수고를 미워했습니다. 왜냐하면 그것을 내 뒤에 올 사람에게 남겨 주어야 하기 때문입니다.[a]
  to: 나는 해 아래에서 내가 수고하여 이룬 모든 것을 미워했습니다. 이는 그것을 내 뒤에 올 사람에게[a] 남겨야 하기 때문입니다.
  rationale: 수고의 반복적 강조와 후대자에게 남겨야 하는 문맥을 자연스러운 현대 표준 한국어 합쇼체로 옮겼습니다. ‘남겨 주어야’를 ‘남겨야’로 바꾸어 원문에 없는 수혜적 뉘앙스를 피했고, 각주 표지를 대안이 적용되는 ‘내 뒤에 올 사람’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:15Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 עָמָל(수고/노고)과 이를 다시 받는 분사 עָמֵל의 강조는, ‘수고하여 이룬 모든 것’으로 자연스럽게 반영할 수 있습니다. נוח의 사역형은 후대 사람에게 남겨 두어야 하는 뜻이며, ‘남겨 주다’의 수혜적 뉘앙스 없이 ‘남겨야’로 옮기는 편이 정확합니다.
  naturalness: ‘수고한 내 모든 수고’는 원문의 반복을 기계적으로 재현하여 현대 한국어에서 다소 어색합니다. ‘해 아래에서 내가 수고하여 이룬 모든 것’이 자연스럽고, 문맥상 후대에 넘겨질 성과를 분명히 합니다.
  terminology: ‘해 아래’는 전도서의 반복 관용구를 적절히 보존합니다. ‘내 뒤에 올 사람’은 שֶׁיִּהְיֶה אַחֲרָי를 자연스럽게 옮긴 표현입니다. 각주는 ‘사람’에 붙여, 대안이 되는 후행 관계 표현을 정확히 가리키도록 해야 합니다.
  issues:
  - severity: medium
    issue: ‘남겨 주어야’의 수혜적 표현
    rationale: שֶׁאַנִּיחֶנּוּ는 화자가 자신의 수고의 결과를 후대자에게 남겨 두거나 넘겨야 함을 말합니다. ‘주다’는 호의로 베푸는 뉘앙스를 더할 수 있으므로 ‘남겨야’가 더 중립적이고 정확합니다.
  - severity: low
    issue: 각주 표지의 위치와 각주 내용의 연결
    rationale: 제시된 각주는 ‘내 뒤에 올 사람’의 대안 표현이므로, 문장 끝이 아니라 해당 명사구에 표지를 붙여야 합니다.
  revised_text: 나는 해 아래에서 내가 수고하여 이룬 모든 것을 미워했습니다. 이는 그것을 내 뒤에 올 사람에게[a] 남겨야 하기 때문입니다.
