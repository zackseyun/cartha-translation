  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׂנֵ֤אתִֽי אֲנִי֙ אֶת כָּל עֲמָלִ֔/י שֶׁ/אֲנִ֥י עָמֵ֖ל תַּ֣חַת הַ/שָּׁ֑מֶשׁ שֶׁ֣/אַנִּיחֶ֔/נּוּ לָ/אָדָ֖ם שֶׁ/יִּהְיֶ֥ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/018.yaml
  text: And I hated all my labor in which I toiled under the sun[a], because I must leave it to the man who will come after me.
  footnotes:
  - marker: a
    text: Or, 'to a man who will be after me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 해 아래에서 수고한 내 모든 수고를 미워했습니다. 왜냐하면 그것을 내 뒤에 올 사람에게 남겨 주어야 하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '내 뒤에 나설 사람에게.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  english_pob_choice: I hated
  chosen_korean: 미워했습니다
  alternatives_korean:
  - 싫어했습니다
  - 증오했습니다
  lexicon: HALOT
  rationale: 완결된 개인적 반응을 자연스러운 현대 한국어로 옮기되, 단순한 호불호보다 더 강한 정서인 'hated'의 뉘앙스를 살리기 위해 '미워했습니다'를 택했습니다.
- source_word: כָּל עֲמָלִי
  english_pob_choice: all my labor
  chosen_korean: 내 모든 수고
  alternatives_korean:
  - 내 모든 노동
  - 내 모든 일
  lexicon: HALOT
  rationale: 전도서의 עמל은 단순한 일이 아니라 수고와 고된 노력의 뉘앙스를 가지므로, 한국어 '수고'가 가장 가깝습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 세상에서
  lexicon: HALOT
  rationale: 전도서의 반복적 관용구를 직역에 가깝게 유지하되, 한국어로도 관용적으로 자연스러운 '해 아래에서'를 사용했습니다.
- source_word: שֶׁאַנִּיחֶנּוּ
  english_pob_choice: because I must leave it
  chosen_korean: 그것을 … 남겨 주어야 하기 때문입니다
  alternatives_korean:
  - 그것을 … 두어야 하기 때문입니다
  - 그것을 … 맡겨야 하기 때문입니다
  lexicon: HALOT
  rationale: נוח의 사역형은 '남기다, 두다, 넘겨주다'의 뜻을 가지므로, 상속의 맥락에 맞게 '남겨 주어야'로 옮겼습니다. 영어 POB의 'must'가 드러내는 불가피성도 반영했습니다.
- source_word: שֶׁיִּהְיֶה אַחֲרָי
  english_pob_choice: who will come after me
  chosen_korean: 내 뒤에 올 사람
  alternatives_korean:
  - 내 뒤에 있을 사람
  - 나를 이어 올 사람
  lexicon: HALOT
  rationale: 직역하면 '내 뒤에 있을'이지만 한국어에서는 '올 사람'이 더 자연스럽고, 후계/후임의 의미를 충분히 보존합니다.
theological_decisions:
- issue: 전도서의 관용구 תַּחַת הַשָּׁמֶשׁ의 의미 범위
  chosen_reading: 해 아래에서
  alternative_readings:
  - 세상에서
  - 현세에서
  rationale: 이 표현은 단순한 장소가 아니라 인간 삶의 유한한 지평을 가리키는 전도서 특유의 관용구이므로, 익숙한 직역을 유지해 반복성과 신학적 분위기를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Ecclesiastes idiom policy'
