  - severity: medium
    issue: ‘예루살렘에서 내 앞에 있던 모든 사람보다 더 많아졌습니다’의 서술어가 불명확합니다.
    rationale: 히브리어의 יסף는 비교구문에서 앞선 이들을 능가할 만큼 더해졌다는 뜻입니다. 한국어 ‘더 많아지다’는 수량의 대상이 제시되지 않아 뜻이 흐려집니다.
  - severity: low
    issue: 본문의 각주 표지가 해당 구절에 붙어 있지 않고 순서도 바뀌어 있습니다.
    rationale: 비교 표현의 대안은 비교 표현 뒤에, ‘지혜가 섰다’의 직역은 지혜에 관한 절 뒤에 붙여야 독자가 각주의 대상을 알 수 있습니다.
