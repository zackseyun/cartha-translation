  yaml_path: translation/ot/ecclesiastes/002/009.yaml
  text: So I became great and increased more than all who were before me in Jerusalem[b][a]; also my wisdom remained with me.
  footnotes:
  - marker: a
    text: Or 'and I increased more than all who were before me in Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'my wisdom stood by me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 내가 크게 되었고, 예루살렘에서 내 앞에 있던 모든 사람보다 더 많아졌습니다. 또한 내 지혜는 나와 함께 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 내가 예루살렘에서 내 앞에 있던 모든 사람보다 더 많아졌습니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 지혜가 내 곁에 섰습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָדַלְתִּי
  english_pob_choice: So I became great
  chosen_korean: 이렇게 내가 크게 되었고
  alternatives_korean:
  - 그리고 내가 크게 되었고
  - 그리하여 내가 크게 되었고
  lexicon: HALOT
  rationale: גדל의 결과적 의미를 살려 신분·위세가 커진 상태를 자연스러운 한국어로 옮겼습니다.
- source_word: וְהוֹסַפְתִּי מִכֹּל שֶׁהָיָה לְפָנַי
  english_pob_choice: and increased more than all who were before me
  chosen_korean: 예루살렘에서 내 앞에 있던 모든 사람보다 더 많아졌습니다
  alternatives_korean:
  - 예루살렘에서 내 앞에 있던 모든 사람보다 더 증가했습니다
  - 예루살렘에서 내 앞에 있던 모든 사람을 넘어섰습니다
  lexicon: HALOT
  rationale: יסף의 문자적 '더하다/증가하다'와 비교 구문을 반영해, 과도한 의역 없이 우위의 뜻을 한국어로 풀었습니다.
- source_word: אַף
  english_pob_choice: also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 심지어
  lexicon: HALOT
  rationale: 앞선 진술에 덧붙는 추가 진술로서의 기능을 살려, 자연스러운 접속 부사로 처리했습니다.
- source_word: עָמְדָה לִּי
  english_pob_choice: remained with me
  chosen_korean: 나와 함께 있었습니다
  alternatives_korean:
  - 내 곁에 서 있었습니다
  - 내게 남아 있었습니다
  lexicon: HALOT
  rationale: 직역하면 '내게/나를 위해 서 있었다'이지만, 문맥상 지혜가 여전히 자신과 함께 있었다는 지속성을 한국어로 명확히 했습니다.
