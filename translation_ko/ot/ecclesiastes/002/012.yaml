  text: וּ/פָנִ֤יתִֽי אֲנִי֙ לִ/רְא֣וֹת חָכְמָ֔ה וְ/הוֹלֵל֖וֹת וְ/סִכְל֑וּת כִּ֣י מֶ֣ה הָ/אָדָ֗ם שֶׁ/יָּבוֹא֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ אֵ֥ת אֲשֶׁר כְּבָ֖ר עָשֽׂוּ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/012.yaml
  text: So I turned to consider wisdom[a], madness, and folly; for what can the man do who comes after the king? Only what has already been done.
  footnotes:
  - marker: a
    text: 'Hebrew: ''what is the man who comes after the king—what they have already done him/it?'' The final clause is difficult and may also be understood as ''Only what has already been done.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 나는 지혜와 광기, 어리석음을 살펴보려고 돌아섰습니다. 왕 뒤에 오는 사람이 무엇을 할 수 있겠습니까? 이미 해 놓은 것밖에는 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '왕 뒤에 오는 사람이 무엇이냐—그들이 이미 그에게/그것에 한 것?'에 가깝습니다. 마지막 절은 매우 어렵고, '이미 해 놓은 것밖에는 없습니다'로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָנִיתִי
  english_pob_choice: So I turned
  chosen_korean: 돌아섰습니다
  alternatives_korean:
  - 돌아보았습니다
  - 방향을 돌렸습니다
  lexicon: HALOT
  rationale: פנה의 전환 동작을 자연스러운 서술로 옮기되, 다음 탐구로 초점을 바꾸는 뉘앙스를 살렸습니다.
- source_word: לִרְאוֹת
  english_pob_choice: to consider
  chosen_korean: 살펴보려고
  alternatives_korean:
  - 생각해 보려고
  - 고려해 보려고
  lexicon: HALOT
  rationale: 직역하면 '보다'이지만, 전도서의 사유 맥락에서는 대상을 면밀히 검토하는 뜻이므로 '살펴보다'가 적절합니다.
- source_word: הוֹלֵלוֹת
  english_pob_choice: madness
  chosen_korean: 광기
  alternatives_korean:
  - 광란
  - 미친 짓
  lexicon: HALOT
  rationale: 지혜와 대비되는 비이성적 상태를 강하게 드러내기 위해 '광기'를 택했습니다. POB의 'madness'에 대응하는 직접적인 표현입니다.
- source_word: סִכְלוּת
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 미련함
  lexicon: HALOT
  rationale: סכלות의 기본 뜻을 반영하면서, '광기'와 구별되는 도덕적·인지적 결함을 한국어로 분명히 드러냅니다.
- source_word: אֵת אֲשֶׁר כְּבָר עָשׂוּהוּ
  english_pob_choice: Only what has already been done
  chosen_korean: 이미 해 놓은 것밖에는 없습니다
  alternatives_korean:
  - 이미 되어 있는 것뿐입니다
  - 이미 한 것밖에는 없습니다
  lexicon: HALOT
  rationale: 마지막 절은 히브리어가 압축적이고 대명사 지시가 모호하므로, 단정적으로 대상을 특정하지 않고 POB의 해석 범위를 유지하는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 일반명사적이면서도 단수인 표현
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 한 사람
  rationale: 히브리어는 단수형이지만 수사적 질문으로 일반성을 띠므로, 한국어에서는 성별 중립적이면서도 단수성을 크게 해치지 않는 '사람'으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
