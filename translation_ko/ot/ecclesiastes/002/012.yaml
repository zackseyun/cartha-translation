  rationale: 마지막 절의 해석상 모호함은 각주에서 보존하되, 본문에서는 채택된 독법이 앞선 수사 질문의 답으로 자연스럽게 이어지도록 술어를 보완했습니다. ‘이루어진’은 행위자와 대명사 지시 대상을 특정하지 않아 난해한 히브리어의 모호성을 과도하게 해소하지 않습니다.
