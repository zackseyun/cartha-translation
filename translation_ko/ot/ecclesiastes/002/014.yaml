- from: 지혜로운 사람은 머리에 눈이 있지만, 어리석은 사람은 어둠 속을 걷습니다. 그러나 저도 또한 알게 되었습니다. 한 가지 운명이 그들 모두에게 닥친다는 사실을 말입니다.[a]
  to: 지혜로운 사람의 눈은 자기 머리에 있지만, 어리석은 사람은 어둠 속을 걷습니다. 그러나 나도 한 가지 운명[a]이 그들 모두에게 닥친다는 것을 알았습니다.
