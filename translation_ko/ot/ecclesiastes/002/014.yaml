  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶֽ/חָכָם֙ עֵינָ֣י/ו בְּ/רֹאשׁ֔/וֹ וְ/הַ/כְּסִ֖יל בַּ/חֹ֣שֶׁךְ הוֹלֵ֑ךְ וְ/יָדַ֣עְתִּי גַם אָ֔נִי שֶׁ/מִּקְרֶ֥ה אֶחָ֖ד יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/014.yaml
  text: The wise man has his eyes in his head[a], but the fool walks in darkness. Yet I also knew that one fate happens to them all.
  footnotes:
  - marker: a
    text: Or, 'one event befalls them all.' The Hebrew מִקְרֶה can denote what happens to someone, hence 'event,' 'fate,' or 'destiny' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람은 머리에 눈이 있지만, 어리석은 사람은 어둠 속을 걷습니다. 그러나 저도 또한 알게 되었습니다. 한 가지 운명이 그들 모두에게 닥친다는 사실을 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '한 가지 사건이 그들 모두에게 닥친다.' 히브리어 מִקְרֶה는 문맥에 따라 사람에게 일어나는 일, 사건, 운명, 귀결을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  english_pob_choice: The wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜자
  lexicon: HALOT
  rationale: 히브리어 חָכָם은 성별 표시가 있는 남성 단수이지만, 한국어에서는 대표적 대비를 살리면서도 지나치게 성별을 강조하지 않는 '지혜로운 사람'이 자연스럽습니다.
- source_word: עֵינָיו בְּרֹאשׁוֹ
  english_pob_choice: has his eyes in his head
  chosen_korean: 머리에 눈이 있지만
  alternatives_korean:
  - 머리에 눈을 가지고 있지만
  - 분별하여 보지만
  lexicon: HALOT
  rationale: 직역적 관용구를 한국어에서도 이미지가 살아 있도록 옮겼습니다. '분별하여 보지만'은 뜻은 분명하지만 원문의 생생한 신체적 이미지를 약화합니다.
- source_word: בַּחֹשֶׁךְ הוֹלֵךְ
  english_pob_choice: walks in darkness
  chosen_korean: 어둠 속을 걷습니다
  alternatives_korean:
  - 어둠 속에서 걷습니다
  - 어둠 가운데 걸어갑니다
  lexicon: HALOT
  rationale: הלך의 기본 의미를 살려 '걷습니다'로 옮기고, 전치사는 한국어 자연성을 위해 '속을'로 처리해 대비 구조를 유지했습니다.
- source_word: מִקְרֶה אֶחָד
  english_pob_choice: one fate
  chosen_korean: 한 가지 운명
  alternatives_korean:
  - 한 가지 사건
  - 같은 운명
  lexicon: HALOT
  rationale: 전도서에서 מִקְרֶה는 단순 사건보다 사람에게 닥치는 궁극적 귀결을 가리킬 수 있으므로, 문맥상 '운명'이 가장 적절합니다. '한 가지'는 אֶחָד의 단수성을 반영합니다.
theological_decisions:
- issue: 전도서의 מִקְרֶה를 어떻게 이해할지
  chosen_reading: '''한 가지 운명''으로 옮겨, 지혜로운 자와 어리석은 자 모두에게 동일하게 닥치는 삶의 귀결을 드러냈습니다.'
  alternative_readings:
  - '''한 가지 사건''으로 중립적으로 옮김'
  - '''같은 운명''으로 더 해석적으로 옮김'
  rationale: 문맥상 지혜의 이익을 인정하면서도 죽음/삶의 한계 아래 모든 사람이 공통의 귀결을 맞는다는 전도서의 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 전도서 2:14; 전도서의 지혜와 인간 운명에 대한 관찰
