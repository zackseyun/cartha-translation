  text: 이는 그분 없이[a] 누가 먹을 수 있으며, 누가 누릴[b] 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마소라 본문은 문자적으로 ‘나 없이’ 또는 ‘나를 떠나서는’입니다. 그러나 앞뒤 문맥에 비추어 많은 해석자들은 이를 하나님을 가리키는 ‘그분 없이’로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 동사의 뜻은 불확실합니다. ‘서두르다’ 또는 ‘느끼다’로도 옮길 수 있으나, 여기서는 문맥에 따라 ‘누리다’의 뜻으로 이해했습니다.
