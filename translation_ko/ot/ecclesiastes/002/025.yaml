base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/025.yaml
  text: For who can eat[a], and who can enjoy[b], apart from him?
  footnotes:
  - marker: a
    text: 'Hebrew: ''apart from me.'' Many interpreters understand the sense as ''apart from him,'' referring to God, in light of the surrounding context.'
    reason: textual_variant
  - marker: b
    text: Or 'who can hasten?' or 'who can feel?' The Hebrew verb is difficult; here it is understood in the sense of enjoying or experiencing pleasure.
    reason: lexical_alternative
translation:
  language: ko
  text: 과연 누가 먹을 수 있으며, 누가 그분 밖에서 즐길 수 있습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘나에게서’입니다. 그러나 문맥상 많은 해석자는 하나님을 가리켜 ‘그분 밖에서’로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어 동사는 의미가 어렵습니다. 여기서는 전후 문맥에 따라 ‘즐기다/누리다’의 뜻으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 과연
  alternatives_korean:
  - 이는
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 앞 절의 진술을 설명하는 도입어로서, 한국어에서는 문장 전체를 자연스럽게 끌어주는 ‘과연’이 추론적·수사적 뉘앙스를 가장 잘 살립니다.
- source_word: יֹאכַל
  english_pob_choice: can eat
  chosen_korean: 먹을 수 있으며
  alternatives_korean:
  - 먹습니다
  - 먹을 수 있습니까
  - 먹겠습니까
  lexicon: HALOT
  rationale: 시적 수사의 가능성 표현을 살리기 위해 단순 현재보다 능력/허용의 의미를 드러내는 표현을 택했습니다.
- source_word: יָחוּשׁ
  english_pob_choice: can enjoy
  chosen_korean: 즐길 수 있습니까
  alternatives_korean:
  - 누릴 수 있습니까
  - 느낄 수 있습니까
  - 달려갈 수 있습니까
  lexicon: HALOT
  rationale: 동사의 의미가 난해하지만 전후 문맥이 먹는 행위와 즐거움에 집중하므로, POB의 해석을 따라 ‘즐기다/누리다’의 뜻으로 옮겼습니다.
- source_word: מִמֶּנִּי
  english_pob_choice: apart from him
  chosen_korean: 그분 밖에서
  alternatives_korean:
  - 그분 없이
  - 저밖에
  - 저 밖에서
  lexicon: HALOT
  rationale: 마소라 본문은 ‘나에게서’(me)를 가리키지만, 문맥상 하나님을 가리키는 것으로 이해하는 해석을 본문에 반영하되, 한국어에서는 신학적으로 더 분명한 ‘그분 밖에서’로 옮겼습니다.
theological_decisions:
- issue: 마지막 대명사 접미사의 지시 대상
  chosen_reading: ‘그분 밖에서’로 번역하여 하나님을 가리키는 문맥적 의미를 본문에 반영했습니다.
  alternative_readings:
  - ‘나 밖에서’
  - ‘그분 없이’
  rationale: 직전 절들과 이어지는 문맥에서 누림의 근원이 하나님께 있음을 강조하므로, 표면형의 ‘나’를 그대로 옮기기보다 문맥적 지시 대상을 살리는 번역이 본문의 신학적 흐름을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
