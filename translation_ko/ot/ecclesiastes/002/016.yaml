  lexicon: HALOT
  rationale: 공적·존재론적 문맥에서 남는 'remembrance'를 한국어의 자연스러운 '기억'으로 옮기되, 단순한 내적 회상보다 지속성을 담았습니다.
- source_word: לֶחָכָם / הֶחָכָם
  english_pob_choice: the wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 이
  - 지혜자
  - 지혜로운 남자
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 실체형을 반영하되, 한국어에서는 성별을 과도하게 드러내지 않는 '사람'이 합쇼체 문체에 더 자연스럽습니다.
- source_word: עִם הַכְּסִיל
  english_pob_choice: any more than of the fool / just like the fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 자
  - 우둔한 사람
  - 바보
  lexicon: HALOT
  rationale: 비교 대상인 'fool'을 도덕적·지적 대비가 드러나는 '어리석은 사람'으로 옮겼습니다.
- source_word: וְאֵיךְ יָמוּת
  english_pob_choice: And how ... dies
  chosen_korean: 어찌 이렇습니까
  alternatives_korean:
  - 어찌 죽는지
  - 얼마나 비참합니까
  - 정말 어떻게 죽는지
  lexicon: HALOT
  rationale: 히브리어의 탄식·수사 의문을 한국어에서 감탄형으로 처리해, 단순 정보 질문이 아니라 놀라움과 비애를 함께 드러내게 했습니다.
theological_decisions:
- issue: 지혜와 어리석음의 최종 운명에 대한 수사적 진술
  chosen_reading: 지혜로운 사람도 어리석은 사람과 동일하게 죽고, 기억도 함께 사라진다는 탄식으로 번역했습니다.
  alternative_readings:
  - 지혜로운 사람과 어리석은 사람의 죽음이 같다
  - 지혜로운 사람의 기억이 어리석은 사람보다 조금 더 남지 않는다
  rationale: 전도서의 허무 사유를 약화시키지 않도록, 본문의 수사적 탄식을 유지했습니다.
  doctrine_reference: 전도서 2:14-16의 문맥
