id: ECC.2.16
reference: Ecclesiastes 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ אֵ֨ין זִכְר֧וֹן לֶ/חָכָ֛ם עִֽם הַ/כְּסִ֖יל לְ/עוֹלָ֑ם בְּ/שֶׁ/כְּבָ֞ר הַ/יָּמִ֤ים הַ/בָּאִים֙ הַ/כֹּ֣ל נִשְׁכָּ֔ח וְ/אֵ֛יךְ יָמ֥וּת הֶ/חָכָ֖ם עִֽם הַ/כְּסִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/016.yaml
  text: For there is no lasting remembrance of the wise man any more than of the fool[a], since in the days to come everything will already have been forgotten[b]. And how the wise man dies just like the fool!
  footnotes:
  - marker: a
    text: Or, more formally, 'For there is no remembrance of the wise with the fool forever.' The main text renders the Hebrew idiom in natural English while preserving the comparison of their shared fate.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'And how the wise man dies with the fool!' The wording is likely exclamatory, expressing the grievous fact that the wise man dies just like the fool.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람과 어리석은 사람의 기억이 영원히 함께 남는 것은 없습니다. 다가올 날들에는 모든 것이 이미 잊혀질 것이기 때문입니다. 지혜로운 사람이 어리석은 사람처럼 죽는다는 것이 어찌 이렇습니까![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “지혜로운 사람과 함께/어리석은 사람과 함께 기억이 없다”는 식의 비교를 담을 수 있습니다. 본문은 이를 자연스러운 한국어로 풀어 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 절은 히브리어에서 탄식조의 수사 의문으로 읽힐 수 있습니다. 한국어 본문은 그 비애를 살려 감탄형으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרוֹן
  english_pob_choice: remembrance
  chosen_korean: 기억
  alternatives_korean:
  - 기념
  - 추억
  - 기억됨
  lexicon: HALOT
  rationale: 공적·존재론적 문맥에서 남는 'remembrance'를 한국어의 자연스러운 '기억'으로 옮기되, 단순한 내적 회상보다 지속성을 담았습니다.
- source_word: לֶחָכָם / הֶחָכָם
  english_pob_choice: the wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 이
  - 지혜자
  - 지혜로운 남자
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 실체형을 반영하되, 한국어에서는 성별을 과도하게 드러내지 않는 '사람'이 합쇼체 문체에 더 자연스럽습니다.
- source_word: עִם הַכְּסִיל
  english_pob_choice: any more than of the fool / just like the fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 어리석은 자
  - 우둔한 사람
  - 바보
  lexicon: HALOT
  rationale: 비교 대상인 'fool'을 도덕적·지적 대비가 드러나는 '어리석은 사람'으로 옮겼습니다.
- source_word: וְאֵיךְ יָמוּת
  english_pob_choice: And how ... dies
  chosen_korean: 어찌 이렇습니까
  alternatives_korean:
  - 어찌 죽는지
  - 얼마나 비참합니까
  - 정말 어떻게 죽는지
  lexicon: HALOT
  rationale: 히브리어의 탄식·수사 의문을 한국어에서 감탄형으로 처리해, 단순 정보 질문이 아니라 놀라움과 비애를 함께 드러내게 했습니다.
theological_decisions:
- issue: 지혜와 어리석음의 최종 운명에 대한 수사적 진술
  chosen_reading: 지혜로운 사람도 어리석은 사람과 동일하게 죽고, 기억도 함께 사라진다는 탄식으로 번역했습니다.
  alternative_readings:
  - 지혜로운 사람과 어리석은 사람의 죽음이 같다
  - 지혜로운 사람의 기억이 어리석은 사람보다 조금 더 남지 않는다
  rationale: 전도서의 허무 사유를 약화시키지 않도록, 본문의 수사적 탄식을 유지했습니다.
  doctrine_reference: 전도서 2:14-16의 문맥
