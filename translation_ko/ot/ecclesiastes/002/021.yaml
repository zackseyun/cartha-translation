  source_fidelity: 초안은 지혜·지식·기술의 병렬, 수고하지 않은 수령자와 몫의 대조, 그리고 הֶבֶל 및 רָעָה רַבָּה의 강한 평가를 대체로 보존합니다. 그러나 ‘자기 수고하지 않은 사람’은 문법적으로 부자연스럽고, 원문의 ‘그것/그 일에 수고하지 않은’ 관계를 명확히 전달하지 못합니다. הֶבֶל의 구체적 비유는 ‘증기’보다 ‘입김’이 한국어에서 더 적절하게 보존합니다.
  naturalness: ‘사람이 … 수고한 것이 있으나’ 및 ‘자기 수고하지 않은 사람’은 현대 표준 한국어 문장으로 매끄럽지 않습니다. 주체를 ‘…수고한 사람이 있어도’로, 대조 대상을 ‘그 일에 수고하지 않은 사람’으로 처리하면 자연스럽고 원문의 불특정 사례 제시도 유지됩니다. 각주 표지도 해당 어휘 바로 뒤에 배치하는 것이 좋습니다.
  terminology: עָמָל은 ‘수고’로, חֵלֶק은 ‘자기 몫’으로 옮기는 것이 적절합니다. כִּשְׁרוֹן은 이 문맥에서 ‘솜씨’가 자연스럽고 지혜·지식과 구별됩니다. הֶבֶל은 전통적인 ‘헛됨’이라는 대안 각주를 유지하되 본문에서는 덧없고 실체 없는 비유를 살리는 ‘입김’으로 옮깁니다. רָעָה רַבָּה는 문맥상 강한 부정적 평가이므로 ‘큰 악’으로 유지할 수 있습니다.
