  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי יֵ֣שׁ אָדָ֗ם שֶׁ/עֲמָל֛/וֹ בְּ/חָכְמָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כִשְׁר֑וֹן וּ/לְ/אָדָ֞ם שֶׁ/לֹּ֤א עָֽמַל בּ/וֹ֙ יִתְּנֶ֣/נּוּ חֶלְק֔/וֹ גַּם זֶ֥ה הֶ֖בֶל וְ/רָעָ֥ה רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/021.yaml
  text: For there is a man whose labor is with wisdom and with knowledge and with skill[a], yet he must give his portion to a man who has not labored in it[b]. This also is vapor and a great evil.
  footnotes:
  - marker: a
    text: Or 'his toil.' The Hebrew עָמָל often carries the sense of wearisome toil in Ecclesiastes.
    reason: lexical_alternative
  - marker: b
    text: Or 'This too is vanity.' Traditional English versions often render הֶבֶל as 'vanity'; the translation 'vapor' preserves the Hebrew image of something fleeting and insubstantial.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜와 지식과 솜씨로 수고한[a] 사람이 있어도, 그 일에 수고하지 않은 사람에게 자기 몫을 주어야 합니다. 이것도 입김[b]이며 큰 악입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 수고’. 전도서에서 עָמָל은 종종 고되고 힘겨운 수고를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이것도 헛됨’. 전통 번역은 הֶבֶל을 ‘허무’ 또는 ‘헛됨’으로 옮깁니다. 여기서 ‘입김’은 덧없고 실체 없는 것을 가리키는 히브리어의 이미지를 살린 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אָדָם
  english_pob_choice: there is a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 어떤 사람이
  lexicon: HALOT
  rationale: 히브리어의 יֵשׁ + 명사 관용구는 사례를 도입하므로 한국어에서는 주어를 앞세워 자연스럽게 처리하되, אָדָם의 개별적 사례성을 살려 ‘사람이’로 옮겼습니다.
- source_word: עֲמָלוֹ
  english_pob_choice: his labor
  chosen_korean: 수고한 것이
  alternatives_korean:
  - 그의 노동이
  - 그의 수고
  lexicon: HALOT
  rationale: 전도서에서 עָמָל은 단순 노동보다 힘들고 고된 수고를 뜻하므로, 명사적 ‘수고’보다 문맥에 맞는 서술적 표현으로 옮겼습니다.
- source_word: בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן
  english_pob_choice: with wisdom and with knowledge and with skill
  chosen_korean: 지혜와 지식과 능숙함으로
  alternatives_korean:
  - 지혜와 지식과 기술로
  - 지혜와 앎과 솜씨로
  lexicon: HALOT
  rationale: 세 단어의 병렬을 유지하면서, חָכְמָה는 ‘지혜’, דַּעַת는 ‘지식’, כִשְׁרוֹן은 결과가 아니라 능력/숙련을 가리키므로 ‘능숙함’으로 옮겼습니다.
- source_word: חֶלְקוֹ
  english_pob_choice: his portion
  chosen_korean: 그 몫
  alternatives_korean:
  - 그의 분깃
  - 그의 몫
  lexicon: HALOT
  rationale: חֵלֶק은 전도서에서 ‘할당된 몫’의 의미를 가지므로, 한국어에서도 분배된 몫이라는 감각을 살려 ‘그 몫’으로 간명하게 옮겼습니다.
- source_word: הֶבֶל
  english_pob_choice: vapor
  chosen_korean: 증기
  alternatives_korean:
  - 입김
  - 허무
  - 바람
  lexicon: HALOT
  rationale: POB의 ‘vapor’는 הֶבֶל의 감각적 이미지인 덧없음과 비실재성을 보존하려는 선택이므로, 전통어 ‘허무’보다 구체적인 표상인 ‘증기’로 반영했습니다.
theological_decisions:
- issue: הֶבֶל의 표상 유지
  chosen_reading: 증기
  alternative_readings:
  - 허무
  - 헛됨
  - 공허
  rationale: 이 절은 단순한 가치판단보다 ‘잠깐 나타났다가 사라지는 것’이라는 전도서의 핵심 이미지를 드러내므로, 추상화된 종교용어보다 원문 이미지에 가까운 표현을 택했습니다.
  doctrine_reference: 전도서 1:2의 הֶבֶל 용례 및 본서의 반복 어휘
- issue: רָעָה רַבָּה의 평가 강도
  chosen_reading: 큰 악입니다
  alternative_readings:
  - 큰 재앙입니다
  - 큰 불행입니다
  - 큰 잘못입니다
  rationale: 문맥상 단순한 불운이 아니라 도덕적·실존적으로 매우 나쁜 상태를 진술하므로, 평가의 강도를 약화하지 않는 ‘큰 악’이 적절합니다.
  doctrine_reference: 지혜문학의 평가어법
