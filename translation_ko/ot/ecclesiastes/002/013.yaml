language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאִ֣יתִי אָ֔נִי שֶׁ/יֵּ֥שׁ יִתְר֛וֹן לַֽ/חָכְמָ֖ה מִן הַ/סִּכְל֑וּת כִּֽ/יתְר֥וֹן הָ/א֖וֹר מִן הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/013.yaml
  text: And I saw that wisdom has an advantage over folly[a], as light has an advantage over darkness.
  footnotes:
  - marker: a
    text: 'Or ''profit'': the Hebrew term can denote surplus, gain, or advantage; here it refers to wisdom''s superiority over folly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 지혜가 어리석음보다 유익함이 있음을 보았습니다. 빛이 어둠보다 유익함이 있는 것과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאִיתִי
  english_pob_choice: And I saw
  chosen_korean: 그리고 나는 보았습니다
  alternatives_korean:
  - 그리고 내가 보았습니다
  - 또 나는 보았습니다
  lexicon: HALOT
  rationale: ראה의 완료형 1인칭 단수는 경험적 관찰을 나타내므로, 자연스러운 합쇼체의 과거형 ‘보았습니다’로 옮겼습니다.
- source_word: יִתְרוֹן
  english_pob_choice: advantage
  chosen_korean: 유익함
  alternatives_korean:
  - 이득
  - 우위
  - 이익
  lexicon: HALOT
  rationale: 전도서에서 יתרון은 단순한 금전적 ‘이익’보다 어떤 것이 다른 것보다 낫다는 비교적 우월성을 가리키므로, 문맥상 ‘유익함’이 가장 자연스럽게 그 의미를 살립니다.
- source_word: מִן הַסִּכְלוּת
  english_pob_choice: over folly
  chosen_korean: 어리석음보다
  alternatives_korean:
  - 어리석음에 비해
  - 우둔함보다
  - 우매함보다
  lexicon: HALOT
  rationale: מן은 비교를 나타내므로 한국어에서는 ‘-보다’로 풀어 주는 것이 가장 직접적입니다. סִכְלוּת는 전도서의 문맥에 맞게 ‘어리석음’으로 옮겼습니다.
- source_word: הָאוֹר / הַחֹשֶׁךְ
  english_pob_choice: light / darkness
  chosen_korean: 빛 / 어둠
  alternatives_korean:
  - 광명 / 흑암
  - 빛 / 어두움
  lexicon: HALOT
  rationale: אָוֹר와 חֹשֶׁךְ의 대조는 상징적이면서도 직관적인 자연 이미지이므로, 가장 표준적이고 대칭이 분명한 ‘빛 / 어둠’으로 렌더링했습니다.
theological_decisions:
- issue: 비교문의 반복 구조를 한국어에서 어떻게 살릴 것인가
  chosen_reading: 앞 절의 ‘지혜가 어리석음보다 유익함이 있다’와 후반의 ‘빛이 어둠보다 유익함이 있는 것’이라는 평행 구조를 유지했습니다.
  alternative_readings:
  - 지혜가 어리석음보다 낫습니다. 빛이 어둠보다 낫는 것과 같습니다.
  - 지혜는 어리석음보다 우위에 있습니다. 빛이 어둠보다 우위에 있는 것과 같습니다.
  rationale: 히브리어는 יתרון과 מן을 반복하여 비교를 강조합니다. 이를 ‘낫다’로 약화시키기보다, 원문의 반복성과 대응을 살리기 위해 같은 비교 어휘를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
