id: ECC.2.19
reference: Ecclesiastes 2:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ֣י יוֹדֵ֗עַ הֶֽ/חָכָ֤ם יִהְיֶה֙ א֣וֹ סָכָ֔ל וְ/יִשְׁלַט֙ בְּ/כָל עֲמָלִ֔/י שֶֽׁ/עָמַ֥לְתִּי וְ/שֶׁ/חָכַ֖מְתִּי תַּ֣חַת הַ/שָּׁ֑מֶשׁ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/019.yaml
  text: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
  footnotes:
  - marker: a
    text: Or 'This too is vapor,' emphasizing transience; also possibly 'This too is futile.' The Hebrew hebel carries a range of senses in Ecclesiastes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 지혜로운지 어리석은지 누가 압니까? 그러나 그는 내가 해 아래에서 수고하며 지혜를 쏟아 이룬 나의 모든 수고를 다스릴 것입니다. 이것도 허무입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것도 증기처럼 사라짐이다.’ 히브리어 hebel은 전도서에서 덧없음, 덧없어짐, 헛됨의 뜻을 아우릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יוֹדֵעַ
  english_pob_choice: And who knows
  chosen_korean: 그러나 누가 압니까?
  alternatives_korean:
  - 그리고 누가 압니까?
  - 그런데 누가 압니까?
  lexicon: HALOT
  rationale: 의문과 불확실성을 자연스럽게 드러내되, 앞절과의 흐름상 반대·전환의 뉘앙스를 살려 ‘그러나’로 옮겼습니다.
- source_word: הֶחָכָם יִהְיֶה אוֹ סָכָל
  english_pob_choice: whether he will be wise or foolish
  chosen_korean: 그가 지혜로운지 어리석은지
  alternatives_korean:
  - 그가 지혜로운 사람인지 어리석은 사람인지
  - 그가 지혜로울지 어리석을지
  lexicon: HALOT
  rationale: 인접한 대조를 한국어 의문절로 자연스럽게 옮기면서, 형용사 대조를 유지했습니다.
- source_word: וְיִשְׁלַט בְּכָל עֲמָלִי
  english_pob_choice: Yet he will rule over all my labor
  chosen_korean: 그러나 그는 내가 … 이룬 나의 모든 수고를 다스릴 것입니다
  alternatives_korean:
  - 그러나 그는 나의 모든 수고를 지배할 것입니다
  - 그러나 그는 나의 모든 수고 위에 권세를 가질 것입니다
  lexicon: HALOT
  rationale: יִשְׁלַט의 통치·권한 행사를 ‘다스리다’로 옮겨, 단순 소유보다 지배적 통제의 힘을 드러냈습니다.
- source_word: שֶׁעָמַלְתִּי וְשֶׁחָכַמְתִּי
  english_pob_choice: in which I labored and used wisdom
  chosen_korean: 내가 해 아래에서 수고하며 지혜를 쏟아 이룬
  alternatives_korean:
  - 내가 해 아래에서 수고하고 지혜롭게 일한
  - 내가 해 아래에서 애써 일하고 지혜를 사용한
  lexicon: HALOT
  rationale: ‘수고’로 עמל의 반복을 살리고, חכם의 동사적 의미를 ‘지혜를 쏟아’로 풀어 문맥상 ‘지혜롭게 일함’의 뜻을 반영했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 해 아래
  lexicon: HALOT
  rationale: 전도서의 관용구를 일관되게 살려, 인생의 지상적 영역을 가리키는 표현으로 유지했습니다.
- source_word: גַּם זֶה הָבֶל
  english_pob_choice: This too is vanity
  chosen_korean: 이것도 허무입니다.
  alternatives_korean:
  - 이것도 헛됨입니다.
  - 이것도 증기처럼 사라짐입니다.
  lexicon: HALOT
  rationale: 전도서의 핵심어 הבל을 문맥상 가장 널리 읽히는 ‘허무’로 옮기되, 전통적 공명을 유지하면서도 현대어로 이해되게 했습니다.
theological_decisions:
- issue: הבל(hebel)의 한국어 핵심어 선택
  chosen_reading: ‘허무’로 번역하되, 전도서의 반복적 주제어로 일관되게 유지했습니다.
  alternative_readings:
  - 헛됨
  - 증기처럼 사라짐
  - 무가치함
  rationale: 이 단어는 교리 쟁점이라기보다 전도서 전체의 주제어이므로, 단일 의미로 축소하지 않으면서도 한국어 독자가 반복 구조를 알아볼 수 있는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency with documented exception)
