  rationale: 원문은 단순한 1인칭 완료형 ‘내가 말했다’이므로, 반성적 독백의 뉘앙스를 암시하더라도 원문에 없는 ‘제 자신에게’를 덧붙이지 않았습니다.
- source_word: מְהוֹלָל
  english_pob_choice: It is madness
