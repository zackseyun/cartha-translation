  lexicon: HALOT
  rationale: 이 형용사는 웃음을 향한 강한 평가를 나타내므로, ‘미친 것입니다’로 사태 평가를 직설적으로 드러내면서도 한국어 문장으로 자연스럽게 만들었습니다.
- source_word: מַה ... עֹשָׂה
  english_pob_choice: What does this accomplish?
  chosen_korean: 이것이 무엇을 이루겠습니까?
  alternatives_korean:
  - 이것이 무엇을 하겠습니까?
  - 이것이 무슨 유익을 주겠습니까?
  lexicon: HALOT
  rationale: 문맥상 단순한 행위가 아니라 효용/결과를 묻는 수사 의문이므로, ‘이루다’를 써서 ‘무슨 성과를 내는가’라는 평가적 의미를 살렸습니다.
