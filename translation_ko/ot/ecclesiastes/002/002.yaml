  chosen_reading: ‘미친 것입니다’와 수사 의문을 통해, 전도자의 냉정한 부정 평가를 약화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘미련한 것입니다’처럼 완화된 도덕적 평가
  - ‘도대체 무엇이 유익합니까?’처럼 설명적 완화
  rationale: 본문은 단순한 취향 선언이 아니라 삶의 가치에 대한 급진적 평가이므로, 원문의 날카로움을 보존하는 것이 중요합니다.
