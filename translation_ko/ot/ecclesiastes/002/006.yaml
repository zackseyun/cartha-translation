  lexicon: HALOT
  rationale: יַעַר은 보통 ‘숲/삼림’이며, 여기서는 조성·관개된 환경이므로 ‘숲’으로, צוֹמֵחַ는 진행 중인 성장을 살려 ‘자라는’으로 옮겼습니다.
theological_decisions:
