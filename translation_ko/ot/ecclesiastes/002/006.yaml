base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/006.yaml
  text: I made for myself pools of water, to irrigate from them a grove sprouting trees.
  footnotes:
  - marker: a
    text: Or 'a forest growing trees' or 'a woodland with growing trees.' The Hebrew יַעַר can denote a forest or wooded area; 'grove' is chosen here because the context is cultivated and irrigated.
    reason: lexical_alternative
  - marker: b
    text: Or 'to water from them.' The verb can mean 'to give drink to' or 'to water'; 'to irrigate' makes explicit the agricultural setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 나를 위해 물의 못들을 만들어, 그곳에서 물을 대어 자라는 나무들의 숲이 있게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숲’이나 ‘삼림’. 히브리어 יַעַר는 숲이 우거진 구역을 뜻할 수 있으며, 여기서는 관개되는 조성지라는 문맥을 따라 ‘숲’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘물을 주려고’ ‘물을 대려고’. 동사 שׁקה의 사역형은 농업적 공급 행위를 가리킬 수 있어, 문맥을 드러내어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  english_pob_choice: I made for myself
  chosen_korean: 나는 나를 위해 … 만들었습니다
