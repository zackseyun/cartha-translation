  naturalness: ‘물의 못들’과 ‘자라는 나무들의 숲이 있게 했습니다’는 현대 표준 한국어로 다소 부자연스럽습니다. 목적 관계를 직접 드러내는 ‘…숲에 물을 대기 위해 물웅덩이들을 만들었습니다’가 자연스럽고 명료합니다.
