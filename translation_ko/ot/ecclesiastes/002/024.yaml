  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵֽין ט֤וֹב בָּ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/הֶרְאָ֧ה אֶת נַפְשׁ֛/וֹ ט֖וֹב בַּ/עֲמָל֑/וֹ גַּם זֹה֙ רָאִ֣יתִי אָ֔נִי כִּ֛י מִ/יַּ֥ד הָ/אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/024.yaml
  text: There is nothing better for a man than that he should eat and drink and show himself good in his labor[b][a]. I also saw that this is from the hand of God.
  footnotes:
  - marker: a
    text: Or, more literally, 'and cause his soul to see good in his labor'; that is, experience or enjoy good from his labor.
    reason: lexical_alternative
  - marker: b
    text: The opening clause can also be rendered more literally, 'There is no good in a man that he should eat and drink...,' but the context strongly supports the idiomatic sense, 'There is nothing better for a man than...'.
    reason: alternative_reading
translation:
  language: ko
  text: 사람에게는 먹고 마시며 자기 수고 가운데서 자기 영혼에 선을 보이는 것보다 더 나은 것이 없습니다. 나도 이것이 하나님의 손에서 나온 것임을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 직역하면 ‘자기 영혼에게 선을 보이게 하다’에 가깝습니다. 곧 수고의 열매를 경험하고 누린다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 문두의 히브리어는 문자적으로는 ‘좋음이 없다’에 가깝지만, 문맥상 ‘더 나은 것이 없다’는 비교적 뜻으로 읽는 것이 자연합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹב
  english_pob_choice: There is nothing better
  chosen_korean: 더 나은 것이 없습니다
  alternatives_korean:
  - 좋은 것이 없습니다
  - 좋은 것이 없습니다만
  lexicon: HALOT
  rationale: 히브리어는 전형적인 지혜문학식 비교 표현으로, 절대적 부정보다 ‘더 나은 것이 없다’는 뜻이 문맥에 더 잘 맞습니다.
- source_word: בָּאָדָם
  english_pob_choice: for a man
  chosen_korean: 사람에게는
  alternatives_korean:
  - 사람 안에는
  - 사람에게
  lexicon: HALOT
  rationale: אָדָם은 여기서 단수이면서도 일반적 의미이므로, 한국어에서는 성별을 과도하게 드러내지 않으면서도 보편성을 살려 ‘사람에게는’으로 옮겼습니다.
- source_word: וְהֶרְאָה אֶת נַפְשׁוֹ טוֹב
  english_pob_choice: and show himself good
  chosen_korean: 자기 영혼에 선을 보이는 것
  alternatives_korean:
  - 자기 영혼에게 좋은 것을 보여 주는 것
  - 자기 영혼이 선을 보게 하는 것
  - 자기 혼에 선을 보이는 것
  lexicon: HALOT
  rationale: 직역하면 ‘자기 영혼에게/에 선을 보이다’이므로, 관용적 의미인 ‘그것을 누리다’로 완전히 바꾸지 않고 원문의 이미지와 내적 대상을 살렸습니다.
- source_word: מִיַּד הָאֱלֹהִים
  english_pob_choice: from the hand of God
  chosen_korean: 하나님의 손에서 나온 것
  alternatives_korean:
  - 하나님에게서 나온 것
  - 하나님의 손으로부터 나온 것
  - 하나님의 손에서 온 것
  lexicon: HALOT
  rationale: ‘손’은 단순한 출처가 아니라 주어지는 선물의 뉘앙스를 담는 히브리어 관용구이므로, 그 비유를 보존했습니다.
theological_decisions:
- issue: אֵין טוֹב의 의미
  chosen_reading: ‘사람에게 더 나은 것이 없다’는 비교적 의미로 이해했습니다.
  alternative_readings:
  - ‘사람 안에는 선한 것이 없다’는 절대적 진술
  rationale: 문맥의 권고적 구조와 뒤이어 오는 ‘먹고 마시며…’ 절이 비교 대상임을 보여 주므로, 인간론적 부정으로 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
