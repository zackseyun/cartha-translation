source:
  edition: WLC
  text: כִּ֧י כָל יָמָ֣י/ו מַכְאֹבִ֗ים וָ/כַ֨עַס֙ עִנְיָנ֔/וֹ גַּם בַּ/לַּ֖יְלָה לֹא שָׁכַ֣ב לִבּ֑/וֹ גַּם זֶ֖ה הֶ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/023.yaml
  text: For all his days are pains[a], and his occupation is vexation; even in the night his heart does not lie down[b]. This too is vapor.
  footnotes:
  - marker: a
    text: Or 'his heart does not rest.' The Hebrew reads literally, 'his heart does not lie down,' expressing inward unrest that continues through the night.
    reason: lexical_alternative
  - marker: b
    text: Or 'vanity' or 'breath.' The Hebrew הֶבֶל is rendered here as 'vapor' to preserve the book's recurring image of what is fleeting and insubstantial.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 모든 날은 고통들이며, 그의 일은 번뇌입니다. 밤에도 그의 마음은 눕지 않습니다[a]. 이것도 안개입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마음은 쉬지 않습니다.’ 히브리어는 문자적으로 ‘그의 마음은 눕지 않는다’라고 하며, 밤에도 계속되는 내면의 불안을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘허무’ 또는 ‘입김’. 히브리어 הֶבֶל은 여기서 ‘안개’로 옮겨, 덧없고 실체가 희박한 것을 가리키는 전도서의 반복 이미지를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그의
  alternatives_korean:
  - 왜냐하면
  - 참으로
  - 이는
  lexicon: HALOT
  rationale: 문맥상 앞선 관찰을 풀어 주는 연결이지만, 한국어 본문에서는 자연스러운 시작으로 바로 진술하는 편이 더 매끄러워 별도 접속사를 두지 않았습니다.
- source_word: כָל יָמָיו
  english_pob_choice: all his days
  chosen_korean: 그의 모든 날은
  alternatives_korean:
  - 그의 평생은
  - 그의 모든 생애는
  lexicon: HALOT
  rationale: 히브리어 관용구를 구체적인 시간 이미지로 살려, ‘평생’보다 원문에 더 밀착된 ‘모든 날’을 택했습니다.
- source_word: מַכְאֹבִים
  english_pob_choice: pains
  chosen_korean: 고통들이며
  alternatives_korean:
  - 아픔들이며
  - 통증들이며
  - 근심들이며
  lexicon: HALOT
  rationale: 복수형을 살리기 위해 단수 추상어보다 복수형 표현을 사용했고, 전도서의 실존적 무게를 고려해 ‘고통’이 가장 적절합니다.
- source_word: וָכַעַס
  english_pob_choice: vexation
  chosen_korean: 번뇌입니다
  alternatives_korean:
  - 답답함입니다
  - 괴로움입니다
  - 분노입니다
  lexicon: HALOT
  rationale: 전도서에서의 כַּעַס는 단순한 분노보다 내면의 괴로움과 괴롭힘에 가깝기에, ‘번뇌’로 옮겨 지속적 내적 불안을 드러냈습니다.
- source_word: לֹא שָׁכַב לִבּוֹ
  english_pob_choice: his heart does not lie down
  chosen_korean: 그의 마음은 눕지 않습니다
  alternatives_korean:
  - 그의 마음은 쉬지 않습니다
  - 그의 마음은 잠들지 않습니다
  - 그의 마음은 편히 쉬지 않습니다
  lexicon: HALOT
  rationale: POB가 보존한 직역적 은유를 따라 ‘눕지 않는다’를 유지했습니다. ‘마음’은 לֵב의 내면성까지 포괄하는 한국어로, POB의 ‘heart’와 대응합니다.
- source_word: הֶבֶל
  english_pob_choice: vapor
  chosen_korean: 안개입니다
  alternatives_korean:
  - 허무입니다
  - 헛것입니다
  - 증기입니다
  lexicon: HALOT
  rationale: 전도서의 반복 이미지인 덧없음과 실체 없음은 ‘안개’가 현대 한국어에서 가장 자연스럽게 전달합니다. ‘허무’는 해석을 앞세울 수 있어 피했습니다.
theological_decisions:
- issue: 전도서의 הֶבֶל 번역
  chosen_reading: ‘안개’로 옮겨 덧없음과 붙잡히지 않는 성격을 이미지로 보존했습니다.
  alternative_readings:
  - ‘허무’
  - ‘헛됨’
  - ‘증기’
  rationale: 이 절의 결론은 단순한 가치판단보다 삶의 실체 없음과 지나감의 이미지를 강조하므로, POB의 ‘vapor’에 상응하는 한국어로 ‘안개’를 채택했습니다.
  doctrine_reference: 전도서 1–2장의 반복 어휘와 문학적 이미지
- issue: לֹא שָׁכַב לִבּוֹ의 의인화
  chosen_reading: ‘그의 마음은 눕지 않습니다’라는 원문 직유를 유지했습니다.
  alternative_readings:
  - ‘그의 마음은 쉬지 않습니다’
  - ‘그의 마음은 안정되지 않습니다’
  rationale: 원문은 심리 상태를 직접 풀어 설명하기보다 마음의 움직임을 신체 동작으로 표현하므로, 의미를 덜어내지 않고 은유를 보존했습니다.
  doctrine_reference: 히브리 시적/지혜 문학의 인체 은유
