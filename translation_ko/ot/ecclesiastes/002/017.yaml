id: ECC.2.17
reference: Ecclesiastes 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׂנֵ֨אתִי֙ אֶת הַ֣/חַיִּ֔ים כִּ֣י רַ֤ע עָלַ/י֙ הַֽ/מַּעֲשֶׂ֔ה שֶׁ/נַּעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ כִּֽי הַ/כֹּ֥ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/017.yaml
  text: So I hated life[a], because the work that is done under the sun was grievous to me[b]; for everything is vapor and a chasing after wind.
  footnotes:
  - marker: a
    text: Or 'vanity' or 'breath'; the Hebrew hebel evokes something fleeting, insubstantial, or elusive.
    reason: lexical_alternative
  - marker: b
    text: Or 'striving after wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 생명을 미워했습니다[a]. 해 아래에서 이루어지는 일이 나에게 괴로웠기 때문입니다[b]. 참으로 모든 것은 바람을 잡으려는 헛수고입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘허무’, ‘입김’. 히브리어 hebel은 덧없고 실체가 희박하며 붙잡기 어려운 것을 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘바람을 좇는 것’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  english_pob_choice: So I hated
  chosen_korean: 그래서 나는 … 미워했습니다
  alternatives_korean:
  - 그리고 나는 … 미워했습니다
  - 그러므로 나는 … 미워했습니다
  lexicon: HALOT
  rationale: 문맥의 결론을 이어 주는 앞접속사 וְ를 ‘그래서’로 옮겨, 단순 병렬이 아니라 앞선 반성을 받은 결과임을 드러냈습니다.
- source_word: הַחַיִּים
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 목숨
  lexicon: HALOT
  rationale: 여기서는 일반적 ‘삶’보다 존재 전체를 가리키는 느낌의 ‘생명’이 히브리어의 포괄성을 더 직접적으로 반영합니다.
- source_word: רַע עָלַי
  english_pob_choice: was grievous to me
  chosen_korean: 나에게 괴로웠기
  alternatives_korean:
  - 나에게 악했습니다
  - 나에게 나빴기
  - 나에게 괴로움이 되었기
  lexicon: HALOT
  rationale: 직역형 ‘악했다/나빴다’보다, 화자에게 가해진 압박과 고통의 체험을 드러내는 ‘괴로웠다’가 관용적 의미를 잘 살립니다.
- source_word: הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה
  english_pob_choice: the work that is done
  chosen_korean: 이루어지는 일
  alternatives_korean:
  - 행해지는 일
  - 되어 가는 일
  - 행사되는 일
  lexicon: HALOT
  rationale: 단순 ‘일/행위’보다, תחת השמש 아래에서 벌어지는 인간 활동의 총체를 자연스럽게 담기 위해 ‘이루어지는 일’로 옮겼습니다.
- source_word: הֶבֶל
  english_pob_choice: vapor
  chosen_korean: 헛것
  alternatives_korean:
  - 입김
  - 증기
  - 허무
  lexicon: HALOT
  rationale: 전도서의 핵심 은유인 덧없음과 붙잡을 수 없음은 한국어에서 ‘헛것’이 가장 간결하게 전달합니다.
- source_word: וּרְעוּת רוּחַ
  english_pob_choice: a chasing after wind
  chosen_korean: 바람을 잡으려는 헛수고
  alternatives_korean:
  - 바람을 쫓는 것
  - 바람을 좇는 수고
  - 바람을 좇는 헛일
  lexicon: HALOT
  rationale: 직접적인 이미지인 ‘바람’과 무익한 추구를 함께 살리기 위해, 동작성과 허무를 모두 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: הֶבֶל의 의미 범위
  chosen_reading: ‘헛것’으로 번역해 덧없음과 비실재성을 함께 전달했습니다.
  alternative_readings:
  - 허무
  - 공허
  - 덧없음
  rationale: 전도서에서 הֶבֶל은 단순한 감정적 허무가 아니라, 붙잡을 수 없고 지속되지 않는 실재의 특성을 가리키므로 이를 너무 심리화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 전도서의 총괄 진술
  chosen_reading: ‘모든 것은 바람을 잡으려는 헛수고입니다’로, 일반화된 평가의 강도를 유지했습니다.
  alternative_readings:
  - 모든 것은 헛것입니다
  - 모든 것은 허무입니다
  rationale: 구절의 결론은 개별 사안이 아니라 전반적 실재에 대한 판정이므로, 포괄어 ‘모든 것’과 반복되는 허무 이미지를 함께 보존했습니다.
  doctrine_reference: Translation philosophy §1
