source:
  edition: WLC
  text: וְ/יֹתֵ֥ר מֵ/הֵ֖מָּה בְּנִ֣/י הִזָּהֵ֑ר עֲשׂ֨וֹת סְפָרִ֤ים הַרְבֵּה֙ אֵ֣ין קֵ֔ץ וְ/לַ֥הַג הַרְבֵּ֖ה יְגִעַ֥ת בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/012.yaml
  text: 'And beyond these[a], my son, be warned: of making many books there is no end, and much study is a weariness of the flesh.'
  footnotes:
  - marker: a
    text: Or 'and much reading' or 'and much devotion'; the Hebrew term rendered 'study' is uncommon and may refer more broadly to absorption in books or words.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 아들아, 이것들보다 더 나아가는 것에 대하여 경계하십시오. 책을 많이 만드는 일에는 끝이 없고, 많은 공부[a]는 육체를 지치게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많이 읽는 것’ 혹은 ‘많이 몰두하는 것’으로 옮길 수 있습니다. 여기의 히브리어는 드물게 쓰이는 말로, 책이나 말에 몰입하는 일을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹתֵר מֵהֵמָּה
  english_pob_choice: And beyond these
  chosen_korean: 그리고 이보다 더한 것은
  alternatives_korean:
  - 그리고 이들보다 더한 것은
  - 그리고 이보다 많은 것은
  lexicon: HALOT
  rationale: 앞절의 교훈을 넘어서는 일을 경계하라는 연결을 살리면서, 비교의 뜻을 자연스럽게 한국어로 옮겼습니다.
- source_word: בְּנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 자녀야
  - 내 아들
  lexicon: HALOT
  rationale: 히브리어의 직접 호칭을 살려 친밀한 권면의 말투로 옮겼습니다.
- source_word: הִזָּהֵר
  english_pob_choice: be warned
  chosen_korean: 경계하십시오
  alternatives_korean:
  - 조심하십시오
  - 경고를 받으십시오
  lexicon: HALOT
  rationale: 명령형 경고의 힘을 살리되, 현대 한국어에서 자연스럽고 품위 있게 들리는 표현을 택했습니다.
- source_word: וְ/לַהַג הַרְבֵּה
  english_pob_choice: and much study
  chosen_korean: 많이 읽는 것은
  alternatives_korean:
  - 많이 공부하는 것은
  - 많이 파고드는 것은
  lexicon: HALOT
  rationale: לַהַג가 책과 말에 대한 몰입을 넓게 가리킬 수 있으므로, 영어 POB의 각주 취지를 따라 ‘study’보다 넓은 독서/몰입의 뜻을 담아 옮겼습니다.
- source_word: יְגִעַת בָּשָׂר
  english_pob_choice: is a weariness of the flesh
  chosen_korean: 육체를 지치게 합니다
  alternatives_korean:
  - 몸을 지치게 합니다
  - 육체의 피곤함입니다
  lexicon: HALOT
  rationale: ‘flesh’를 직역한 ‘육체’를 유지하되, 한국어에서 더 자연스러운 결과 구문으로 풀어 피로와 소모의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 지혜 추구와 책/읽기의 경계 설정
  chosen_reading: 본문은 많은 책과 많은 읽음 자체를 무한한 끝없음과 육체의 피로로 연결해 경계합니다.
  alternative_readings:
  - 지적 탐구 일반에 대한 절제 권면
  - 서기관적 저작 활동에 대한 비판
  rationale: 히브리어와 POB 각주는 단순한 반지성주의가 아니라 과도한 책과 읽기/몰입이 끝없는 소모를 낳는다는 실용적 경고로 읽게 합니다.
  doctrine_reference: 전도서 12:12의 문맥상 지혜 문헌의 절제 권면
