  source_fidelity: 첫 구절의 וְיֹתֵר מֵהֵמָּה는 앞선 말씀들 ‘너머/그 이상’에 관한 경계이지, ‘이보다 더한 것’이라는 독립 명사절은 아닙니다. 또한 לַהַג는 문맥상 ‘공부/연구’로 옮길 수 있으나 뜻이 확정적이지 않아 각주로 대안을 보존해야 합니다.
  naturalness: 초안의 ‘그리고 이보다 더한 것은’은 문장이 미완결된 듯하며 ‘경계하십시오’의 대상도 불분명합니다. 이를 ‘이것들보다 더 나아가는 것에 대하여 경계하십시오’로 고치면 현대 한국어 합쇼체에서 문법적으로 완결되고 뜻도 분명합니다. ‘많은 공부’와 ‘육체를 지치게 합니다’는 자연스럽고 격식에 맞습니다.
  terminology: ‘내 아들아’는 בְּנִי의 남성 단수 호칭을 충실히 반영합니다. בָּשָׂר는 이 문맥에서 신학적 용어라기보다 신체적 피로를 가리키므로 ‘육체’가 적절합니다. 각주는 드문 단어 לַהַג의 불확실성을 유지하도록 본문의 ‘많은 공부’에 연결합니다.
