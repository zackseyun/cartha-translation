source:
  edition: WLC
  text: וְ/סֻגְּר֤וּ דְלָתַ֨יִם֙ בַּ/שּׁ֔וּק בִּ/שְׁפַ֖ל ק֣וֹל הַֽ/טַּחֲנָ֑ה וְ/יָקוּם֙ לְ/ק֣וֹל הַ/צִּפּ֔וֹר וְ/יִשַּׁ֖חוּ כָּל בְּנ֥וֹת הַ/שִּֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/004.yaml
  text: and the doors on the street are shut when the sound of the grinding is low[a], and one rises at the sound of a bird[c][b], and all the daughters of song are brought low.
  footnotes:
  - marker: a
    text: Or 'the double doors'; many interpreters understand 'the doors' here metaphorically as the lips or mouth in the poem's depiction of old age.
    reason: alternative_reading
  - marker: b
    text: Or 'when the sound of the mill grows faint'; many take this as an image for diminished chewing because the preceding and following lines are often read as bodily metaphors.
    reason: lexical_alternative
  - marker: c
    text: Literally 'all the daughters of song.' This may refer to singing women, the faculties of singing, or the sounds associated with song.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거리의 문들이 닫히고, 맷돌 소리가 낮아질 때, 새 소리에 사람은 일어나며, 노래의 딸들은 모두 낮아집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이중문들’입니다. 많은 해석자는 여기의 ‘문들’을 시가 노년을 묘사하는 방식 속에서 입술 또는 입으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘맷돌 소리가 희미해질 때’입니다. 앞뒤 문맥이 신체 은유로 읽히는 경우가 많아서, 이는 씹는 기능의 약화를 가리키는 이미지로 보기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘노래의 딸들’입니다. 이는 노래하는 여성들, 노래 능력, 또는 노래와 관련된 소리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֻגְּרוּ דְלָתַיִם
  english_pob_choice: the doors ... are shut
  chosen_korean: 거리의 문들이 닫히고
  alternatives_korean:
  - 거리의 이중문들이 닫히고
  - 입술들이 닫히고
  lexicon: HALOT
  rationale: דְלָתַיִם의 기본뜻인 ‘문들’을 살려 ‘거리의 문들’로 옮기고, 메타포를 본문에서 확정하지 않았습니다. ‘입술’ 해석은 가능한 주석이므로 각주로만 열어 두었습니다.
- source_word: בִּשְׁפַל קוֹל הַטַּחֲנָה
  english_pob_choice: when the sound of the grinding is low
  chosen_korean: 맷돌 소리가 낮아질 때
  alternatives_korean:
  - 맷돌 소리가 희미해질 때
  - 분쇄하는 소리가 낮아질 때
  lexicon: HALOT
  rationale: שׁפל의 ‘낮아짐/쇠함’과 טחנה의 ‘갈기, 분쇄’ 의미를 자연스럽게 살려, 기계보다 행위에 가까운 ‘맷돌 소리’로 풀었습니다.
- source_word: לְקוֹל הַצִּפּוֹר
  english_pob_choice: at the sound of a bird
  chosen_korean: 새 소리에
  alternatives_korean:
  - 한 새의 소리에
  - 새의 지저귐에
  lexicon: HALOT
  rationale: 히브리어 단수형의 생생한 이미지를 살리되 한국어에서는 더 자연스러운 ‘새 소리’로 옮겼습니다. ‘지저귐’은 해석을 더 강하게 넣는 표현이라 본문에서는 피했습니다.
- source_word: כָּל בְּנוֹת הַשִּׁיר
  english_pob_choice: all the daughters of song
  chosen_korean: 노래의 딸들은 모두
  alternatives_korean:
  - 노래의 딸들 모두
  - 노래의 모든 딸들은
  lexicon: HALOT
  rationale: 직역적 비유를 유지하여 ‘노래의 딸들’을 보존했습니다. 이는 노래하는 여성들인지, 노래 능력 자체인지 확정하지 않기 위해서입니다.
theological_decisions:
- issue: 노년의 알레고리에서 이미지의 대응관계를 본문에서 확정할지 여부
  chosen_reading: 각 이미지를 문자 그대로 유지하고, 구체적 신체 대응은 본문에서 확정하지 않았습니다.
  alternative_readings:
  - 문들 = 입술
  - 맷돌 소리 = 씹는 기능의 약화
  - 노래의 딸들 = 노래하는 능력 또는 관련 기관
  rationale: 전도서 12장은 노년의 알레고리로 널리 읽히지만, 개별 대응은 해석이 갈립니다. 본문은 히브리어의 시적 긴장을 보존하고, 구체화는 각주로만 처리하는 편이 더 원문 충실적입니다.
  doctrine_reference: Translation philosophy §3
