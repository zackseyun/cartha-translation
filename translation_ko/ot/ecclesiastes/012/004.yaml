  naturalness: ‘새 소리에 사람은 일어나며’도 이해되지만, 원문의 일반화된 단수 주어를 한국어에서 굳이 ‘사람’으로 명시하지 않아도 자연스럽습니다. ‘새 소리에 일어나고’는 시적 연결과 한국어 문맥 모두에 잘 맞습니다. 각주 표지를 관련 낱말 뒤에 배치하면 읽기에도 자연스럽습니다.
