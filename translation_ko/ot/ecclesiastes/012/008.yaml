id: ECC.12.8
reference: Ecclesiastes 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲבֵ֧ל הֲבָלִ֛ים אָמַ֥ר הַ/קּוֹהֶ֖לֶת הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/008.yaml
  text: “Vapor of vapors,” says the Teacher[a]; “everything is vapor.”
  footnotes:
  - marker: a
    text: Or “Vanity of vanities … all is vanity.” The traditional rendering preserves longstanding English usage, but the Hebrew הבל literally evokes something like vapor or breath—what is fleeting, insubstantial, or elusive.
    reason: lexical_alternative
translation:
  language: ko
  text: “숨결 중의 숨결”이라고 회중 설교자가 말합니다. “모든 것이 숨결입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “헛됨 중의 헛됨 … 모든 것이 헛됨.” 전통적인 번역은 오랜 영어 관용을 보존하지만, 히브리어 הבל은 문자적으로는 입김이나 숨결처럼 덧없고 실체가 없는 것을 더 직접적으로 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵ֧ל הֲבָלִ֛ים
  english_pob_choice: Vapor of vapors
  chosen_korean: “숨결 중의 숨결”
  alternatives_korean:
  - “헛됨 중의 헛됨”
  - “허무 중의 허무”
  - “입김 중의 입김”
  lexicon: HALOT, BDB
  rationale: 히브리어 반복 구조의 강한 최상급 느낌을 살리면서, POB의 ‘vapor’가 지닌 구체적 이미지에 맞춰 ‘숨결’로 옮겼습니다. ‘헛됨/허무’는 해석을 너무 앞세워 원문의 비유성을 약화시킬 수 있습니다.
- source_word: הַ/קּוֹהֶ֖לֶת
  english_pob_choice: the Teacher
  chosen_korean: 회중 설교자
  alternatives_korean:
  - 교사
  - 전도자
  - 코헬렛
  lexicon: HALOT, BDB
  rationale: 이 제목은 고유명사보다 직함에 가깝고, 회중 앞에서 말하는 기능을 드러냅니다. 다만 ‘설교자’는 교회적 뉘앙스가 강하므로, ‘회중’과 결합해 원문의 공적 발화 성격을 유지했습니다.
- source_word: הַכֹּל
  english_pob_choice: everything
  chosen_korean: 모든 것이
  alternatives_korean:
  - 전부가
  - 모두가
  - 온갖 것이
  lexicon: HALOT, BDB
  rationale: 총체성을 자연스럽게 나타내는 현대 한국어로 옮겼습니다. 문장 결론부의 절대적 진술을 살리기 위해 ‘모든 것’ 구조를 유지했습니다.
- source_word: הָבֶל
  english_pob_choice: vapor
  chosen_korean: 숨결
  alternatives_korean:
  - 헛됨
  - 허무
  - 입김
  lexicon: HALOT, BDB
  rationale: 앞의 반복어와 같은 어휘를 반복해 책의 핵심 은유를 일관되게 유지했습니다. ‘숨결’은 덧없음·비실체성을 드러내면서도 ‘헛됨’처럼 추상화하지 않습니다.
theological_decisions:
- issue: 전통적 ‘헛되다’ 계열 번역 대신 비유적 이미지 유지
  chosen_reading: ‘숨결’과 ‘숨결 중의 숨결’로 번역해, 전도서의 핵심어 הבל을 추상적 판단이 아니라 시적 이미지로 유지했습니다.
  alternative_readings:
  - ‘헛됨’
  - ‘허무’
  - ‘무익함’
  rationale: 이 구절은 교리적 용어 정리보다 문학적 은유의 반복이 핵심입니다. POB의 ‘vapor’ 선택을 따라, 독자가 원문의 긴장과 다의성을 그대로 접하도록 했습니다.
  doctrine_reference: 전도서 12:8의 문학적-신학적 핵심어 해석
