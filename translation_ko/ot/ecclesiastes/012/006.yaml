  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֣ד אֲשֶׁ֤ר לֹֽא ירחק חֶ֣בֶל הַ/כֶּ֔סֶף וְ/תָרֻ֖ץ גֻּלַּ֣ת הַ/זָּהָ֑ב וְ/תִשָּׁ֤בֶר כַּד֙ עַל הַ/מַּבּ֔וּעַ וְ/נָרֹ֥ץ הַ/גַּלְגַּ֖ל אֶל הַ/בּֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/006.yaml
  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring[d][c][b], and the wheel is crushed at the pit.
  footnotes:
  - marker: a
    text: Or 'is removed,' 'is severed,' or traditionally 'is loosed'; the Hebrew verb here is difficult in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'pitcher' for 'jar.'
    reason: lexical_alternative
  - marker: c
    text: The 'wheel' may refer more specifically to a well-wheel or pulley.
    reason: lexical_alternative
  - marker: d
    text: Or 'well' or 'cistern' instead of 'pit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 은 줄이 끊어지기 전에, 금 그릇이 깨지고, 항아리가 샘 곁에서 부서지고, 바퀴가 못으로 부서집니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문맥상 '끊어지다', '떨어져 나가다', 전통적으로는 '풀리다' 등으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '항아리'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '''바퀴''는 더 구체적으로는 우물 바퀴나 도르래를 가리킬 수 있습니다.'
    reason: lexical_alternative
  - marker: d
    text: 또는 '우물'이나 '저수조'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  english_pob_choice: before
  chosen_korean: -기 전에
  alternatives_korean:
  - ~하기 전까지
  - ~하기 전에
  lexicon: HALOT
  rationale: 죽음이 닥치기 전의 시간을 나타내므로, 현대 한국어에서는 자연스러운 시간 종결 표현인 '-기 전에'로 옮기는 것이 가장 분명합니다.
- source_word: חֶבֶל הַכֶּסֶף
  english_pob_choice: the silver cord
  chosen_korean: 은 줄
  alternatives_korean:
  - 은 실
  - 은 끈
  - 은 줄
  lexicon: HALOT
  rationale: 직역성을 유지하되 현대어에서 자연스러운 이미지가 되도록 '줄'을 택했습니다. '실'보다 굵고 물리적 끊어짐의 감각이 살아납니다.
- source_word: גֻּלַּת הַזָּהָב
  english_pob_choice: the golden bowl
  chosen_korean: 금 그릇
  alternatives_korean:
  - 황금 그릇
  - 금빛 그릇
  - 금 그릇
  lexicon: HALOT
  rationale: גֻּלָּה의 용기 이미지를 살리면서도 한국어에서 과도하게 해석하지 않도록 '그릇'으로 옮겼습니다.
- source_word: וְנָרֹץ הַגַּלְגַּל
  english_pob_choice: the wheel is crushed
  chosen_korean: 바퀴가 부서지고
  alternatives_korean:
  - 바퀴가 짓눌리고
  - 바퀴가 산산이 부서지고
  - 바퀴가 부서지고
  lexicon: HALOT
  rationale: רצץ의 폭력적 파괴를 살리되, 한국어 시어의 흐름을 위해 '부서지고'를 택했습니다. 같은 절 안의 다른 파손 동사들과 균형을 맞춥니다.
- source_word: אֶל הַבּוֹר
  english_pob_choice: at the pit
  chosen_korean: 못에
  alternatives_korean:
  - 구덩이에서
  - 우물에
  - 못에
  lexicon: HALOT
  rationale: בּוֹר는 구덩이/우물/저수조를 모두 가질 수 있으나, 본문 문맥의 어둠과 추락 이미지를 살려 '못'으로 옮겼습니다. 'at'의 장소 표지 역시 한국어에서는 목적지·위치 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 이 절의 상징적 이미지 처리
  chosen_reading: 문자적 사물 이미지 자체를 유지하여, 노화와 죽음의 붕괴를 암시하는 시적 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - 신체 기관의 세부적 알레고리로 풀어 쓰기
  rationale: 원문은 해석 여지가 큰 시적 비유를 사용하므로, 의미를 지나치게 풀어버리지 않고 독자가 이미지의 불확실성과 강도를 함께 느끼도록 두는 것이 적절합니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 말고 보존한다.'
