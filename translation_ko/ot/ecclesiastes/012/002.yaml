lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  english_pob_choice: before
  chosen_korean: -기 전에
  alternatives_korean:
  - -하지 않을 때까지
  - -하기 전에
  lexicon: HALOT
  rationale: ‘until not’의 직역보다 문맥상 경고와 권면의 흐름을 살려 한국어 자연 표현인 ‘-기 전에’로 옮겼습니다.
- source_word: תֶחְשַׁךְ
  english_pob_choice: grow dark
  chosen_korean: 어두워지다
  alternatives_korean:
  - 어둡게 되다
  - 어두워지게 되다
  lexicon: HALOT
  rationale: 히브리어 동사의 상태 변화 의미를 살려, 단순 수동보다 자연스러운 자동사적 표현을 택했습니다.
- source_word: וְהָאוֹר
  english_pob_choice: the light
  chosen_korean: 빛
  alternatives_korean:
  - 빛깔
  - 광명
  lexicon: HALOT
  rationale: 문맥상 해·달·별과 병렬되는 일반적 ‘빛’으로 옮겨, 히브리어의 간결한 시적 평행구조를 보존했습니다.
- source_word: וְשָׁבוּ הֶעָבִים אַחַר הַגָּשֶׁם
  english_pob_choice: and the clouds return after the rain
  chosen_korean: 비가 그친 뒤에 구름이 다시 돌아옵니다
  alternatives_korean:
  - 비 후에 구름이 다시 돌아옵니다
  - 비가 온 뒤 구름이 다시 돌아옵니다
  lexicon: HALOT
  rationale: שׁוּב의 반복·재귀적 느낌을 ‘다시 돌아오다’로 살리고, אַחַר הַגָּשֶׁם은 자연스러운 ‘비가 그친 뒤에’로 풀었습니다.
theological_decisions:
- issue: 시적 우주 어둠과 구름의 귀환을 어떻게 처리할지
  chosen_reading: 본문의 비유적 이미지를 그대로 유지하고, 노화·심판 등 해석을 본문 안에서 확정하지 않았습니다.
  alternative_readings:
  - 노화의 시작을 가리키는 비유
  - 삶의 쇠퇴와 반복되는 환난의 포괄적 이미지
  rationale: 전도서 12장은 상징적 묘사를 제시할 뿐 해석을 직접 풀어 말하지 않으므로, 번역문에서도 의미를 단정하지 않고 긴장을 보존하는 것이 원문 충실도에 합당합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
