    issue: ‘전에’의 범위가 둘째 절에 미치지 않고, ‘구름이 다시 돌아옵니다’가 독립 현재문으로 처리되었습니다.
    rationale: 원문은 ‘해와 빛과 달과 별들이 어두워지고, 비 뒤에 구름이 돌아오기 전에’라는 하나의 시간절입니다. 둘째 절을 현재 서술로 분리하면 עַד אֲשֶׁר לֹא의 범위와 전절에서 이어지는 권면의 흐름이 손상됩니다.
  - severity: low
