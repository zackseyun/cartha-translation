id: ECC.12.11
reference: Ecclesiastes 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבְרֵ֤י חֲכָמִים֙ כַּ/דָּ֣רְבֹנ֔וֹת וּֽ/כְ/מַשְׂמְר֥וֹת נְטוּעִ֖ים בַּעֲלֵ֣י אֲסֻפּ֑וֹת נִתְּנ֖וּ מֵ/רֹעֶ֥ה אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/011.yaml
  text: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
  footnotes:
  - marker: a
    text: Or 'the masters of assemblies'; the Hebrew phrase is difficult and may refer either to compilers of collected sayings or to leaders in gathered assemblies.
    reason: alternative_reading
  - marker: b
    text: '''From one shepherd'' may refer to God as the ultimate source of wisdom, but the text does not explicitly identify the shepherd.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜자들의 말은 채찍 같고, 박아 놓은 못들처럼 굳건한 것은 모은 말씀들이니, 그것들은 한 목자에게서 주어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모임들의 주인들'로도 볼 수 있습니다. 히브리어 어구는 어렵고, 모아 둔 말씀들의 편집자나 모인 회중의 인도자를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''한 목자''는 하나님을 궁극적 근원으로 가리킬 수 있지만, 본문은 그 목자를 명시적으로 밝히지 않습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  english_pob_choice: The words of the wise
  chosen_korean: 지혜자들의 말
  alternatives_korean:
  - 지혜로운 이들의 말
  - 지혜자들의 말씀
  lexicon: HALOT
  rationale: 지혜자들을 집단 명사로 자연스럽게 옮기되, מקור의 plural construct를 살려 '말'로 번역했습니다. '말씀'은 한국어 교회어감이 강해 일반적 지혜 전승의 뉘앙스를 다소 좁힐 수 있습니다.
- source_word: כַּדָּרְבֹנוֹת
  english_pob_choice: like goads
  chosen_korean: 채찍 같고
  alternatives_korean:
  - 가시찌르개 같고
  - 소몰이 막대기 같고
  lexicon: HALOT
  rationale: דָּרְבֹן의 핵심은 사람이나 짐승을 몰아 움직이게 하는 자극 도구이므로, 현대 한국어에서 기능을 살리는 '채찍'으로 옮겼습니다. 다만 'goad'의 구체성을 완전히 지우지 않도록 유사한 자극 도구의 이미지를 유지했습니다.
- source_word: בַּעֲלֵי אֲסֻפּוֹת
  english_pob_choice: the masters of collections
  chosen_korean: 모은 말씀들
  alternatives_korean:
  - 모임의 주인들
  - 집합의 주인들
  - 모아 둔 말들
  lexicon: HALOT
  rationale: 이 어구는 난해하므로 'masters of collections'의 해석 가능성을 살리되, 한국어에서는 자연스럽게 기능을 드러내는 쪽을 택했습니다. 본문 맥락상 지혜의 전승/편집된 말들을 가리키는 가능성이 크므로 '모은 말씀들'로 옮겼습니다.
- source_word: נִתְּנוּ מֵרֹעֶה אֶחָד
  english_pob_choice: they are given by one shepherd
  chosen_korean: 그것들은 한 목자에게서 주어졌습니다
  alternatives_korean:
  - 그것들은 한 목자에 의해 주어졌습니다
  - 그것들은 한 목자에게서 나왔습니다
  lexicon: HALOT
  rationale: מִן의 출처 의미를 살려 '에게서'로 옮겼고, 수동형 '주어졌습니다'를 유지해 지혜의 말들의 근원이 한 분에게 있음을 드러냈습니다. '목자'는 원문이 그 대상을 명시하지 않으므로 소문자로 두어 해석을 열어 두었습니다.
theological_decisions:
- issue: 한 목자의 정체성
  chosen_reading: 본문은 '한 목자'를 그대로 두어 하나님으로의 명시적 동일시를 본문 안에서 확정하지 않았습니다.
  alternative_readings:
  - 하나님을 지혜의 궁극적 근원으로 보는 해석
  - 솔로몬 또는 전도자의 단일한 권위로 보는 해석
  rationale: 원문은 מקור을 암시하지만 명시적으로 규정하지 않으므로, 신학적 해석을 본문 번역에 미리 고정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 본문의 모호성을 보존하고 해석을 과잉 확정하지 않음
