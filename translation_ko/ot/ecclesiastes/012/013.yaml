- from: 일의 끝이요, 모든 것이 들린 뒤에는 하나님을 경외하고 그의 명령들을 지키십시오. 이것이 모든 사람의 본분입니다.[a]
  to: 모든 것을 다 들은 뒤의 결론은 이렇습니다. 하나님을 경외하고 그분의 계명을 지키십시오. 이것이 모든 사람의 전부입니다.[a]
  rationale: The revision corrects the source-significant final clause by moving the interpretive ‘duty’ reading from the main text to a clearly marked alternative footnote. It also uses the conventional Korean biblical term ‘계명’ and recasts the opening into fluent formal-polite Korean without adding content.
