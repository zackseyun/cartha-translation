    text: 또는 “이것이 모든 사람의 본분입니다.”
    reason: alternative_reading
  revision_rationale: The revision corrects the source-significant final clause by moving the interpretive ‘duty’ reading from the main text to a clearly marked alternative footnote. It also uses the conventional Korean biblical term ‘계명’ and recasts the opening into fluent formal-polite Korean without adding content.
