id: ECC.12.13
reference: Ecclesiastes 12:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ס֥וֹף דָּבָ֖ר הַ/כֹּ֣ל נִשְׁמָ֑ע אֶת הָ/אֱלֹהִ֤ים יְרָא֙ וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר כִּי זֶ֖ה כָּל הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/013.yaml
  text: 'The end of the matter, when all has been heard: fear God and keep his commandments, for this is the whole of man.[a]'
translation:
  language: ko
  text: 일의 끝이요, 모든 것이 들린 뒤에는 하나님을 경외하고 그의 명령들을 지키십시오. 이것이 모든 사람의 본분입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것이 모든 인간의 본분입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: ס֥וֹף דָּבָ֖ר
  english_pob_choice: The end of the matter
  chosen_korean: 일의 끝이요
  alternatives_korean:
  - 말의 끝은
  - 이 일의 결론은
  - 모든 말의 마지막은
  lexicon: סוֹף + דָבָר
  rationale: 히브리어는 단순한 ‘결론’보다 앞선 논의 전체를 맺는 종결 선언이므로, 한국어에서도 문맥을 살려 ‘일의 끝’으로 옮겼습니다.
- source_word: הַ/כֹּ֣ל נִשְׁמָ֑ע
  english_pob_choice: when all has been heard
  chosen_korean: 모든 것이 들린 뒤에는
  alternatives_korean:
  - 모든 것이 들렸을 때
  - 모든 말을 들은 뒤에
  - 모든 것이 들리면
  lexicon: כֹּל + נִשְׁמָע
  rationale: 직역하면 ‘모든 것이 들렸다’이지만, 한국어에서는 자연스럽게 ‘모든 것이 들린 뒤’로 처리해 종결의 뉘앙스를 유지했습니다.
- source_word: אֶת הָ/אֱלֹהִ֤ים יְרָא֙
  english_pob_choice: fear God
  chosen_korean: 하나님을 경외하고
  alternatives_korean:
  - 하나님을 두려워하고
  - 하나님을 경외하십시오
  - 하나님을 두려워하십시오
  lexicon: יָרֵא + אֱלֹהִים
  rationale: ‘두려워하다’의 공포감은 있으나, 지혜문학의 종교적 책임과 예배적 태도를 함께 살리기 위해 ‘경외하다’를 택했습니다.
- source_word: וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר
  english_pob_choice: keep his commandments
  chosen_korean: 그의 명령들을 지키십시오
  alternatives_korean:
  - 그의 계명들을 지키십시오
  - 그의 명령을 지키십시오
  - 그분의 계명을 지키십시오
  lexicon: מִצְוֹת + שָׁמַר
  rationale: מִצְוֹת은 토라적 ‘계명’이 가능하지만, 본문이 지혜서의 결론으로서 보편적 복종을 말하므로 POB의 ‘commandments’를 따라 ‘명령들’로 옮겼습니다.
- source_word: כִּי זֶ֖ה כָּל הָ/אָדָֽם
  english_pob_choice: for this is the whole of man
  chosen_korean: 이것이 모든 사람의 본분입니다
  alternatives_korean:
  - 이것이 사람의 전부입니다
  - 이것이 모든 인간의 전부입니다
  - 이것이 사람의 본질입니다
  lexicon: כָּל הָאָדָם
  rationale: 히브리어는 문자적으로 ‘모든 사람/사람 전체’이지만, 영어 POB가 문맥상 인간의 의무를 강조하는 해석을 취했으므로 한국어도 오해를 줄이는 방향으로 ‘본분’으로 풀었습니다.
theological_decisions:
- issue: כָּל הָאָדָם의 의미 범위
  chosen_reading: 실존론적 ‘인간의 전부’보다, 하나님 앞에서 사람에게 요구되는 총체적 의무를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - ‘이것이 사람의 전부’라는 존재론적 진술
  - ‘이것이 모든 인간의 본성’이라는 일반화
  rationale: 전도서 결론 문맥상 지혜의 결론은 인간 존재의 정의보다 하나님 경외와 순종의 총합을 제시하는 데 있으므로, 한국어는 그 기능을 드러내는 쪽이 적절합니다.
  doctrine_reference: Ecclesiastes 12:13; wisdom literature conclusion
- issue: 명령형의 한국어 높임
  chosen_reading: 본문의 직접 권면을 현대 공식 문체의 명령형 ‘지키십시오’로 옮겼습니다.
  alternative_readings:
  - ‘지키라’(평서적 명령)
  - ‘지키시기 바랍니다’(완곡 권고)
  rationale: 원문의 단호한 권면을 보존하면서도 현대 표준어 합쇼체에 맞추기 위해 직접 명령형을 사용했습니다.
  doctrine_reference: Korean style/register alignment
