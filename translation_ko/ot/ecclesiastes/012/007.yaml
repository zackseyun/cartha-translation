  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשֹׁ֧ב הֶ/עָפָ֛ר עַל הָ/אָ֖רֶץ כְּ/שֶׁ/הָיָ֑ה וְ/הָ/ר֣וּחַ תָּשׁ֔וּב אֶל הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר נְתָנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/007.yaml
  text: and the dust returns to the earth as it was[a], and the spirit returns to God who gave it.
  footnotes:
  - marker: a
    text: Or 'the breath returns to God who gave it.' Hebrew רוּחַ can mean 'spirit,' 'breath,' or 'wind'; here the context of death favors 'spirit,' though 'breath' remains a plausible lexical alternative.
    reason: lexical_alternative
translation:
  language: ko
  text: 먼지는 땅으로, 있었던 그대로 돌아가고, 영은 그것을 주신 하나님께로 돌아갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨이 그것을 주신 하나님께로 돌아갑니다.’ 히브리어 רוּחַ는 ‘영’, ‘숨’, ‘바람’을 뜻할 수 있으며, 여기서는 죽음의 문맥이 ‘영’을 더 잘 지지하지만 ‘숨’도 가능한 어휘 대안입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב / תָּשׁוּב
  english_pob_choice: returns
  chosen_korean: 돌아갑니다
  alternatives_korean:
  - 되돌아갑니다
  - 돌아옵니다
  lexicon: HALOT
  rationale: 두 동사의 반복을 살리기 위해 같은 동사로 처리했습니다. 한국어에서는 ‘돌아옵니다’보다 방향성을 분명히 하는 ‘돌아갑니다’가 문맥에 더 맞습니다.
- source_word: הֶעָפָר
  english_pob_choice: the dust
  chosen_korean: 먼지
  alternatives_korean:
  - 흙
  - 티끌
  lexicon: HALOT
  rationale: 히브리어의 죽음-귀환 이미지를 한국어로 자연스럽게 옮기기 위해 ‘먼지’를 택했습니다. ‘흙’은 창세기의 인간 재료를 떠올리게 하지만, כאן의 대비 구조에는 ‘먼지’가 더 직접적입니다.
- source_word: עַל הָאָרֶץ כְּשֶׁהָיָה
  english_pob_choice: to the earth as it was
  chosen_korean: 땅으로, 있었던 그대로
  alternatives_korean:
  - 땅으로, 전과 같이
  - 땅 위로, 있었던 대로
  lexicon: HALOT
  rationale: ‘땅’은 אֶרֶץ의 자연스러운 한국어 대응이며, ‘있었던 그대로’는 כְּשֶׁהָיָה의 이전 상태 회귀를 간결하게 드러냅니다.
- source_word: וְהָרוּחַ
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 바람
  - 영혼
  lexicon: HALOT
  rationale: 문맥상 몸의 먼지 귀환과 대조되는 비물질적 생명 원리를 가리키므로 ‘영’이 가장 균형 있습니다. ‘숨’의 가능성은 주석으로 보존했습니다.
theological_decisions:
- issue: רוּחַ의 의미 범위
  chosen_reading: 영
  alternative_readings:
  - 숨
  - 영혼
  rationale: 본문은 죽음에서 육체는 땅으로, רוח는 하나님께로 돌아가는 대조를 세웁니다. 의미를 과도하게 좁히지 않으면서도 문맥상의 대조를 살리기 위해 ‘영’으로 번역했습니다.
  doctrine_reference: Translation philosophy §3 (theological tension preserved)
