translation:
  language: ko
  text: 더 나아가, 코헬렛은 지혜로웠으므로 백성에게 지식을 가르쳤습니다. 또한 그는 많은 잠언을 헤아리고, 탐구하고, 정리했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더 나아가, 코헬렛은 지혜로웠고 백성에게 지식을 가르쳤습니다. 그는 많은 잠언을 숙고하고, 탐구하고, 질서 있게 정리했습니다.’
    reason: lexical_alternative
