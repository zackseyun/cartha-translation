source:
  edition: WLC
  text: וְ/יֹתֵ֕ר שֶׁ/הָיָ֥ה קֹהֶ֖לֶת חָכָ֑ם ע֗וֹד לִמַּד דַּ֨עַת֙ אֶת הָ/עָ֔ם וְ/אִזֵּ֣ן וְ/חִקֵּ֔ר תִּקֵּ֖ן מְשָׁלִ֥ים הַרְבֵּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/009.yaml
  text: And beyond that[a], because Qoheleth was wise, he still taught the people knowledge; he also weighed, searched out, and arranged many proverbs.
  footnotes:
  - marker: a
    text: Or 'And moreover, because the Teacher was wise, he also taught the people knowledge; he pondered, searched out, and set in order many proverbs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그뿐만 아니라, 코헬렛이 지혜로웠기 때문에 그는 아직도 백성에게 지식을 가르쳤습니다. 그는 또 많은 잠언들을 저울질하고, 탐구하고, 배열했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 더욱이, 코헬렛이 지혜로웠기 때문에 그는 백성에게 지식을 가르쳤고, 많은 잠언들을 생각하고, 탐구하고, 질서 있게 두었다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹתֵר
  english_pob_choice: And beyond that
  chosen_korean: 그리고 그뿐만 아니라
  alternatives_korean:
  - 게다가
  - 그리고 더욱이
  lexicon: HALOT
  rationale: 추가적인 진술을 여는 연결어로서, 단순한 접속을 넘어 앞선 평가에 덧붙는 뉘앙스를 자연스럽게 살렸습니다.
- source_word: קֹהֶלֶת
  english_pob_choice: Qoheleth
  chosen_korean: 코헬렛
  alternatives_korean:
  - 전도자
  - 교사
  lexicon: HALOT
  rationale: 본문의 고유한 호칭을 음역해 유지하고, 전통적 역할 명칭으로 좁히지 않았습니다.
- source_word: לִמַּד דַּעַת אֶת הָעָם
  english_pob_choice: taught the people knowledge
  chosen_korean: 백성에게 지식을 가르쳤습니다
  alternatives_korean:
  - 백성에게 지혜를 가르쳤습니다
  - 백성에게 지식을 전했습니다
  lexicon: HALOT
  rationale: חכם과 דעת을 구분해, 이미 '지혜로웠다'고 한 뒤에는 '지식'을 가르친다는 구조를 보존했습니다.
- source_word: וְאִזֵּן וְחִקֵּר תִּקֵּן
  english_pob_choice: weighed, searched out, and arranged
  chosen_korean: 저울질하고, 탐구하고, 배열했습니다
  alternatives_korean:
  - 헤아리고, 조사하고, 정리했습니다
  - 숙고하고, 찾아내고, 정돈했습니다
  lexicon: HALOT
  rationale: 세 동사의 점층적 노동을 살리되, 시적·문학적 표현으로서 한국어에서 자연스러운 동사열을 택했습니다.
theological_decisions:
- issue: 코헬렛의 호칭을 직역어로 풀지 여부
  chosen_reading: 고유 호칭으로서 '코헬렛'을 유지했습니다.
  alternative_readings:
  - 전도자
  - 교사
  rationale: 본문은 단순 직업명보다 책 전체의 화자 표지를 이루는 호칭을 사용하므로, 의미를 좁히는 번역어보다 음역이 소스에 더 충실합니다.
  doctrine_reference: 문학적 표제/화자 정체성
- issue: מְשָׁלִים의 문학적 기능
  chosen_reading: 잠언들을 문학적 산출물로 이해해 '배열했습니다'로 옮겼습니다.
  alternative_readings:
  - 정리했습니다
  - 지어냈습니다
  rationale: 본문은 지혜 격언들을 구성하고 편집하는 행위를 말하므로, 창작만이나 단순 정리만으로 환원하지 않고 둘 사이의 범위를 살렸습니다.
  doctrine_reference: 지혜문학의 편집·구성
