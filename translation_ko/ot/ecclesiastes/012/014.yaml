  to: 하나님께서 모든 행위를, 숨은 모든 것까지도[a], 선한 것이든 악한 것이든 심판에 이르게 하실 것이기 때문입니다.
  rationale: 원문의 כִּי를 ‘것이기 때문입니다’로 옮겨 앞 절의 권면에 대한 근거임을 보존했습니다. 모든 행위가 심판의 대상이라는 주절을 분명히 하고, עַל כָּל נֶעְלָם은 ‘숨은 모든 것까지도’로 처리하여 은폐된 것까지 포함되는 포괄성을 표현했습니다. 선·악의 대조는 원문의 모호한 수식 범위를 과도하게 해석하지 않도록 ‘숨은 모든 것’에 인접시켜 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:46:23Z'
