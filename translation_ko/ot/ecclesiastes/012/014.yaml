id: ECC.12.14
reference: Ecclesiastes 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אֶת כָּל מַֽעֲשֶׂ֔ה הָ/אֱלֹהִ֛ים יָבִ֥א בְ/מִשְׁפָּ֖ט עַ֣ל כָּל נֶעְלָ֑ם אִם ט֖וֹב וְ/אִם רָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/014.yaml
  text: For God will bring every deed into judgment[a], with every hidden thing, whether good or evil.
  footnotes:
  - marker: a
    text: Or 'including every hidden thing' or 'with respect to every secret thing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 모든 행위를 심판으로 이끄시고, 숨은 것마다, 곧 선한 것이든 악한 것이든 다 그러하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨은 모든 것과 함께’ 또는 ‘숨은 모든 것에 관하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 곧
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 문맥상 앞선 권면의 이유를 제시하는 연결어이므로, 합쇼체에서 자연스럽고 설명적 기능을 살리는 ‘곧’을 택했습니다.
- source_word: יָבִא בְמִשְׁפָּט
  english_pob_choice: will bring into judgment
  chosen_korean: 심판으로 이끄시고
  alternatives_korean:
  - 심판으로 데려오시고
  - 심판에 가져오시고
  lexicon: HALOT
  rationale: 히필 동사는 ‘가져오다/이끌어오다’의 능동적 행위를 나타내므로, 단순 상태 진술보다 하나님이 모든 행위를 심판 자리로 가져오시는 동작을 드러내는 표현을 사용했습니다.
- source_word: עַל כָּל נֶעְלָם
  english_pob_choice: with every hidden thing
  chosen_korean: 숨은 것마다
  alternatives_korean:
  - 감추어진 것마다
  - 은밀한 것마다
  - 숨겨진 모든 것과 함께
  lexicon: HALOT
  rationale: על의 의미를 ‘~과 함께/관하여’로 풀되, 한국어에서는 분리된 부연보다 대상 확대를 자연스럽게 드러내는 ‘숨은 것마다’가 가장 직접적입니다.
- source_word: אִם טוֹב וְאִם רָע
  english_pob_choice: whether good or evil
  chosen_korean: 선한 것이든 악한 것이든
  alternatives_korean:
  - 좋은 것이든 나쁜 것이든
  - 선이든 악이든
  lexicon: HALOT
  rationale: 도덕적 평가의 양극을 분명히 하기 위해 ‘선/악’으로 옮겼고, 열거 구조를 한국어의 대응 연결형으로 살렸습니다.
theological_decisions:
- issue: 공의로운 판단의 범위
  chosen_reading: 하나님은 드러난 행위뿐 아니라 숨은 것까지도 포함하여 모든 행위를 심판하신다는 진술로 유지했습니다.
  alternative_readings:
  - 오직 최후 심판만을 가리킴
  - 역사 속 섭리적 판단과 최후 심판을 모두 포함
  rationale: 히브리어 본문은 심판의 포괄성과 은폐된 것의 포함을 말하지만, 그 시점이나 메커니즘을 규정하지 않으므로 해석 범위를 좁히지 않았습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존
