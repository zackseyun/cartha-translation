id: ECC.12.3
reference: Ecclesiastes 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֗וֹם שֶׁ/יָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַ/בַּ֔יִת וְ/הִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶ/חָ֑יִל וּ/בָטְל֤וּ הַ/טֹּֽחֲנוֹת֙ כִּ֣י מִעֵ֔טוּ וְ/חָשְׁכ֥וּ הָ/רֹא֖וֹת בָּ/אֲרֻבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
  footnotes:
  - marker: a
    text: 'The imagery likely depicts the decline of old age: the ''keepers of the house'' may refer to the arms or hands, the ''men of strength'' to the legs, the ''grinders'' to the teeth, and those looking through the windows to the eyes.'
    reason: alternative_reading
  - marker: b
    text: Or 'through the lattices.'
    reason: lexical_alternative
translation:
  language: ko
  text: 집을 지키는 자들이 떨고[a], 힘센 사람들은 굽고, 맷돌질하는 자들은 수가 줄어들어 그치고, 창문으로 바라보는 이들은 어두워지는 날에[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이미지는 대체로 노쇠를 묘사하는 것으로 보이며, ‘집을 지키는 자들’은 팔이나 손, ‘힘센 사람들’은 다리, ‘맷돌질하는 자들’은 이빨, ‘창문으로 바라보는 이들’은 눈을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘창살을 통해서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם / יָזֻעוּ
  english_pob_choice: on the day when ... tremble
  chosen_korean: …하는 날에
  alternatives_korean:
  - …하는 때에
  - …할 때
  lexicon: HALOT
  rationale: 히브리어의 시간 부사구를 한국어의 자연스러운 종속절로 옮기되, 뒤따르는 노쇠의 연속 장면이 흐트러지지 않게 했습니다.
- source_word: שֹׁמְרֵי הַבַּיִת
  english_pob_choice: the keepers of the house
  chosen_korean: 집을 지키는 자들
  alternatives_korean:
  - 집의 파수꾼
  - 집을 지키는 사람들
  lexicon: HALOT
  rationale: POB처럼 본문이 집-몸의 비유를 즉시 풀지 않고, 원문의 이미지인 ‘집을 지키는 자들’을 한국어로 가까이 유지했습니다.
- source_word: הַטֹּחֲנוֹת
  english_pob_choice: the grinders
  chosen_korean: 맷돌질하는 자들
  alternatives_korean:
  - 가는 자들
  - 분쇄하는 자들
  lexicon: HALOT
  rationale: 문자적으로는 ‘가는 이들’이지만, 한국어에서 시적 이미지를 살리면서도 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: הָרֹאוֹת בָּאֲרֻבּוֹת
  english_pob_choice: those looking through the windows
  chosen_korean: 창문으로 바라보는 이들
  alternatives_korean:
  - 창으로 내다보는 이들
  - 틈으로 바라보는 이들
  lexicon: HALOT
  rationale: ‘창문’은 가장 직접적인 대응이며, 시각의 쇠퇴 이미지를 살리기 위해 ‘바라보는 이들’로 유지했습니다.
theological_decisions:
- issue: 노쇠를 말하는 은유를 본문에서 어디까지 풀어 쓸 것인가
  chosen_reading: 본문은 집을 지키는 자들, 힘센 사람들, 맷돌질하는 자들, 창문으로 바라보는 이들로 된 연속 은유를 그대로 살리고, 해석은 각주에만 둡니다.
  alternative_readings:
  - 팔과 다리, 이빨, 눈으로 직접 풀어 쓰기
  - 각 은유를 아예 현대적 신체 표현으로 바꾸기
  rationale: 원문이 각 요소를 명시적으로 해독하지 않으므로, 본문에서는 이미지의 힘을 보존하고 독자 해석을 돕는 방식이 가장 투명합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
