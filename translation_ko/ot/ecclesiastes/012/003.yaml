  - …할 때
  lexicon: HALOT
  rationale: 히브리어의 시간 부사구를 한국어의 자연스러운 종속절로 옮기되, 뒤따르는 노쇠의 연속 장면이 흐트러지지 않게 했습니다.
- source_word: שֹׁמְרֵי הַבַּיִת
  english_pob_choice: the keepers of the house
  chosen_korean: 집을 지키는 자들
