  - 집을 지키는 사람들
  lexicon: HALOT
  rationale: POB처럼 본문이 집-몸의 비유를 즉시 풀지 않고, 원문의 이미지인 ‘집을 지키는 자들’을 한국어로 가까이 유지했습니다.
- source_word: הַטֹּחֲנוֹת
  english_pob_choice: the grinders
  chosen_korean: 맷돌질하는 자들
  alternatives_korean:
  - 가는 자들
  - 분쇄하는 자들
  lexicon: HALOT
  rationale: 문자적으로는 ‘가는 이들’이지만, 한국어에서 시적 이미지를 살리면서도 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: הָרֹאוֹת בָּאֲרֻבּוֹת
  english_pob_choice: those looking through the windows
  chosen_korean: 창문으로 바라보는 이들
  alternatives_korean:
  - 창으로 내다보는 이들
  - 틈으로 바라보는 이들
  lexicon: HALOT
  rationale: ‘창문’은 가장 직접적인 대응이며, 시각의 쇠퇴 이미지를 살리기 위해 ‘바라보는 이들’로 유지했습니다.
theological_decisions:
- issue: 노쇠를 말하는 은유를 본문에서 어디까지 풀어 쓸 것인가
  chosen_reading: 본문은 집을 지키는 자들, 힘센 사람들, 맷돌질하는 자들, 창문으로 바라보는 이들로 된 연속 은유를 그대로 살리고, 해석은 각주에만 둡니다.
  alternative_readings:
  - 팔과 다리, 이빨, 눈으로 직접 풀어 쓰기
  - 각 은유를 아예 현대적 신체 표현으로 바꾸기
  rationale: 원문이 각 요소를 명시적으로 해독하지 않으므로, 본문에서는 이미지의 힘을 보존하고 독자 해석을 돕는 방식이 가장 투명합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
