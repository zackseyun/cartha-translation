  naturalness: ‘힘센 사람들은 굽고’는 현대 한국어에서 무엇인가를 굽는다는 뜻으로도 읽혀 부자연스럽고 의미가 불명확합니다. ‘굽어지며’로 고치면 시적 병렬과 의미가 모두 자연스럽습니다. 히브리어의 ‘그 날에’는 다음 절과 이어지는 미완의 시간 틀이므로, 절 끝의 ‘날에’는 원문의 문장 진행을 보존한 것입니다.
  terminology: ‘집을 지키는 자들’, ‘맷돌질하는 자들’, ‘창문으로 바라보는 이들’은 은유를 섣불리 신체 부위로 해설하지 않아 적절합니다. ‘힘센 남자들’은 원문의 남성 복수 표현을 보존합니다. 각주는 해석을 가능성으로만 제시하며 교리적 단정을 피합니다.
