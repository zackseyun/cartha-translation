base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
  footnotes:
  - marker: a
    text: 'The imagery likely depicts the decline of old age: the ''keepers of the house'' may refer to the arms or hands, the ''men of strength'' to the legs, the ''grinders'' to the teeth, and those looking through the windows to the eyes.'
    reason: alternative_reading
  - marker: b
    text: Or 'through the lattices.'
    reason: lexical_alternative
translation:
  language: ko
  text: 집을 지키는 자들이 떨고[a], 힘센 남자들이 굽어지며, 맷돌질하는 자들이 수가 적어 그치고, 창문으로 바라보는 이들이 어두워지는 날에[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이미지는 대체로 노쇠를 묘사하는 것으로 보이며, ‘집을 지키는 자들’은 팔이나 손, ‘힘센 남자들’은 다리, ‘맷돌질하는 자들’은 이빨, ‘창문으로 바라보는 이들’은 눈을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘창살을 통해서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם / יָזֻעוּ
  english_pob_choice: on the day when ... tremble
  chosen_korean: …하는 날에
  alternatives_korean:
