  verdict: revise
  source_fidelity: 핵심 이미지들의 선택은 대체로 히브리어 본문과 영어 POB의 난해어 처리 방침을 잘 따릅니다. 그러나 마지막 절에서 כִּי는 ‘사람이 자기 영원한 집으로 가기 때문’에 연결되며, 애곡자들이 거리를 다니는 절까지 별도의 ‘때문’ 절로 만들지 않는 것이 원문 접속을 더 충실히 반영합니다. 또한 각주 표지는 해당 어구에 붙어야 합니다.
