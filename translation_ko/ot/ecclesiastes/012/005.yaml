id: ECC.12.5
reference: Ecclesiastes 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם מִ/גָּבֹ֤הַּ יִרָ֨אוּ֙ וְ/חַתְחַתִּ֣ים בַּ/דֶּ֔רֶךְ וְ/יָנֵ֤אץ הַ/שָּׁקֵד֙ וְ/יִסְתַּבֵּ֣ל הֶֽ/חָגָ֔ב וְ/תָפֵ֖ר הָֽ/אֲבִיּוֹנָ֑ה כִּֽי הֹלֵ֤ךְ הָ/אָדָם֙ אֶל בֵּ֣ית עוֹלָמ֔/וֹ וְ/סָבְב֥וּ בָ/שּׁ֖וּק הַ/סֹּפְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/005.yaml
  text: Also they are afraid of heights[a], and terrors are on the road; the almond tree blossoms, the grasshopper drags itself along, and the caper berry fails, because man is going to his eternal house[c][b], and the mourners go about in the street.
  footnotes:
  - marker: a
    text: Or 'the grasshopper becomes a burden.' The Hebrew expression is difficult, and the image may emphasize either feeble movement or the slightest thing becoming burdensome in old age.
    reason: lexical_alternative
  - marker: b
    text: Or 'desire fails.' The Hebrew literally refers to 'the caper berry,' likely an image connected with appetite or stimulation.
    reason: lexical_alternative
  - marker: c
    text: '''Mourners'' may include professional mourners who publicly lamented the dead.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 또한 높은 곳을 두려워하고 길에는 두려움이 있으며, 아몬드나무는 꽃이 피고 메뚜기는 몸을 끌며 다니고 케이퍼 열매는 시들어 버립니다. 이는 사람이 자기 영원한 집으로 가기 때문이며, 애곡하는 이들이 거리로 다니기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메뚜기가 짐이 된다.’ 히브리어 표현은 어렵고, 늙음 속에서 아주 작은 것조차 짐이 되는 모습이나 쇠약해진 움직임을 강조하는 것으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘욕망이 사라진다.’ 히브리어는 문자적으로 ‘케이퍼 열매’를 가리키며, 아마도 식욕이나 자극과 연결된 이미지입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘애곡하는 이들’에는 죽은 이를 공개적으로 곡하는 직업적 애곡인이 포함될 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִגָּבֹהַּ
  english_pob_choice: of heights
  chosen_korean: 높은 곳을
  alternatives_korean:
  - 높은 데를
  - 고지(高地)를
  lexicon: HALOT
  rationale: ‘높은 곳’은 두려움의 대상이 되는 고도를 자연스럽게 살리면서도 노년의 쇠약 이미지를 유지합니다.
- source_word: חַתְחַתִּים
  english_pob_choice: terrors
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 전율
  lexicon: HALOT
  rationale: 복수 명사로서의 위협감은 살리되, 한국어에서는 바로 뒤의 ‘두려워하고’와 결합해 의미를 자연스럽게 전달하는 쪽을 택했습니다.
- source_word: יָנֵאץ הַשָּׁקֵד
  english_pob_choice: the almond tree blossoms
  chosen_korean: 아몬드나무는 꽃이 피고
  alternatives_korean:
  - 아몬드나무는 피어나고
  - 아몬드나무가 만발하고
  lexicon: HALOT
  rationale: 동사의 난해함에도 불구하고 POB의 해석을 따라 노쇠의 징후로서 ‘꽃이 피다’를 살렸습니다.
- source_word: יִסְתַּבֵּל הֶחָגָב
  english_pob_choice: the grasshopper drags itself along
  chosen_korean: 메뚜기는 몸을 끌며 다니고
  alternatives_korean:
  - 메뚜기는 짐이 되어
  - 메뚜기는 질질 끌고 가고
  lexicon: HALOT
  rationale: ‘짐이 되어’는 POB 주석이 제시하는 대안 의미를 반영하지만, 본문 이미지는 신체적 쇠약을 더 분명히 드러내는 ‘몸을 끌며 다니고’가 적절합니다.
- source_word: תָפֵר הָאֲבִיּוֹנָה
  english_pob_choice: the caper berry fails
  chosen_korean: 케이퍼 열매는 시들어 버립니다
  alternatives_korean:
  - 케이퍼 열매는 힘을 잃습니다
  - 욕망은 사라집니다
  lexicon: HALOT
  rationale: 열매를 구체적으로 보존하되, 문맥상 쇠퇴·무력함의 의미를 한국어 동사 ‘시들어 버리다’로 옮겼습니다.
- source_word: בֵּית עוֹלָמוֹ
  english_pob_choice: his eternal house
  chosen_korean: 자기 영원한 집
  alternatives_korean:
  - 그의 영원한 집
  - 자기 오래 머무는 집
  lexicon: HALOT
  rationale: 직역적 은유를 유지하면서도 한국어에서는 소유 관계를 자연스럽게 드러내기 위해 ‘자기’를 사용했습니다.
- source_word: הַסֹּפְדִים
  english_pob_choice: the mourners
  chosen_korean: 애곡하는 이들
  alternatives_korean:
  - 상주들
  - 장례 곡자들
  lexicon: HALOT
  rationale: POB 주석이 말하는 직업적 애곡 가능성을 열어 두면서, 공개적 애도의 장면을 가장 무난하게 표현합니다.
theological_decisions:
- issue: אָדָם의 한국어 성별-보존 표현
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 히브리어 단수 일반명사로서 대표적 인간을 가리키므로, 현대 한국어에서는 성별을 과도하게 고정하지 않는 ‘사람’이 본문 의미를 가장 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (אָדָם), and Translation philosophy §4'
