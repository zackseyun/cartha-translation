  terminology: ‘아몬드나무’, ‘메뚜기’, ‘케이퍼 열매’, ‘영원한 집’, ‘애곡하는 이들’은 적절합니다. חַתְחַתִּים의 복수적이고 객관화된 위협의 뉘앙스는 ‘두려움’보다 ‘공포’가 더 잘 드러냅니다.
