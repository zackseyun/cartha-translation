revisions:
- from: 그들은 또한 높은 곳을 두려워하고 길에는 두려움이 있으며, 아몬드나무는 꽃이 피고 메뚜기는 몸을 끌며 다니고 케이퍼 열매는 시들어 버립니다. 이는 사람이 자기 영원한 집으로 가기 때문이며, 애곡하는 이들이 거리로 다니기 때문입니다.[a][b][c]
  to: 또한 그들은 높은 곳을 두려워하고, 길에는 공포가 있습니다. 아몬드나무는 꽃을 피우고, 메뚜기는 몸을 끌며 다니며[a], 케이퍼 열매는 효력을 잃습니다[b]. 사람이 자기 영원한 집으로 가고, 애곡하는 이들이 거리에서 돌아다닙니다[c]
  rationale: 문장의 인과 구조를 히브리어 접속에 맞게 바로잡고, 난해한 어구의 대안 각주를 해당 본문 어구에 각각 연결했습니다. ‘케이퍼 열매는 효력을 잃습니다’는 열매라는 구체 이미지를 보존하면서 영어 POB의 ‘fails’ 및 식욕·자극 관련 가능성을 자연스럽게 반영합니다.
