  - 진실의 말들
  lexicon: HALOT
  rationale: 히브리어 구성어를 따라 ‘말들’과 ‘진리’를 연결하되, 한국어에서는 ‘진리의 말들’이 가장 자연스럽고 공적입니다.
theological_decisions:
- issue: וְכָת֥וּב יֹ֖שֶׁר의 구문 처리
  chosen_reading: ‘바르게 기록한’으로 번역해, 기록의 방식이 곧고 정직했음을 드러냈습니다.
  alternative_readings:
  - ‘바르게, 기록된’
  - ‘바르게 쓰인’
  rationale: 히브리어 구문은 압축적이어서 ‘쓰다/기록하다’의 행위와 ‘바르게’의 수식이 함께 읽힐 수 있습니다. 한국어에서는 문장의 자연스러움과 원문의 긴장을 함께 살리는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve syntactic ambiguity when warranted by source.'
