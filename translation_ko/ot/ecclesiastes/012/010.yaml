translation:
  language: ko
  text: 코헬렛은 즐거운 말들을[a] 찾으려 힘썼으며, 바르게 기록된 것은 진리의 말들이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기쁨을 주는 말들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 구문은 압축적입니다. ‘바르게 기록된 것은 진리의 말들’로 읽을 수 있으며, ‘그가 진리의 말들을 바르게 기록하였다’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּקֵּשׁ
