    text: 또는 ‘기쁘게 하는 말들’이 아니라 ‘즐거운 말들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 문장은 압축적이어서 ‘바르게 기록한 말들’ 또는 ‘바르게 쓰인 진리의 말들’처럼 조금 다르게 읽을 수도 있습니다.
    reason: alternative_reading
