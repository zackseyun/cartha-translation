translation:
  language: ko
  text: 고난의 날들이 이르고, “나는 그 해들에서 아무 즐거움도 찾지 못하겠다”라고 말하게 될 해들이 가까이 오기 전에, 젊은 날에 당신의 창조주를 기억하십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형태상 복수형 표현으로, 문자적으로는 “당신의 창조자들”에 가깝습니다. 문맥상 하나님을 가리키는 표현으로 이해되어 본문에서는 “창조주”로 옮겼습니다.
    reason: lexical_alternative
