  rationale: 지혜문학의 단일하신 하나님을 가리키는 문맥이 분명하므로, 한국어 본문은 오해를 피하도록 단수로 옮기고 복수형 표지는 각주로 남겼습니다.
  doctrine_reference: 하나님의 단일성, 번역 원칙
