  text: וּ/זְכֹר֙ אֶת בּ֣וֹרְאֶ֔י/ךָ בִּ/ימֵ֖י בְּחוּרֹתֶ֑י/ךָ עַ֣ד אֲשֶׁ֤ר לֹא יָבֹ֨אוּ֙ יְמֵ֣י הָֽ/רָעָ֔ה וְ/הִגִּ֣יעוּ שָׁנִ֔ים אֲשֶׁ֣ר תֹּאמַ֔ר אֵֽין לִ֥/י בָ/הֶ֖ם חֵֽפֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/001.yaml
  text: And remember your Creator in the days of your youth[a], before the evil days come and the years arrive of which you will say, “I have no pleasure in them.”
  footnotes:
  - marker: a
    text: Hebrew has a plural-form expression, literally 'your creators'; here it refers to God as a singular title, 'your Creator.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 창조주를 너의 젊은 날에 기억하십시오[a]—악한 날들이 이르기 전에, 곧 “내가 그것들에 만족을 느끼지 못하겠다”라고 말하게 될 해들이 다가오기 전에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형태상 복수형 표현으로, 문자적으로는 “네 창조자들”에 가깝습니다. 여기서는 단일하신 하나님을 가리키는 호칭으로 이해해 “창조주”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/זְכֹר
  english_pob_choice: And remember
  chosen_korean: 그리고 … 기억하십시오
  alternatives_korean:
  - 기억하십시오
  - 그러므로 기억하십시오
  lexicon: HALOT
  rationale: 명령형 זכר의 직접 권면을 살리되, 앞 절과의 담화를 이어 주는 접속 뉘앙스를 한국어의 자연스러운 문맥 연결로 옮겼습니다.
- source_word: אֶת בּוֹרְאֶיךָ
  english_pob_choice: your Creator
  chosen_korean: 네 창조주
  alternatives_korean:
  - 너의 창조주
  - 네 창조자
  lexicon: HALOT
  rationale: 히브리어의 복수형 표지는 그대로 드러내기보다, 본문이 가리키는 단일한 하나님을 분명히 하는 쪽으로 ‘창조주’의 단수 의미를 살렸습니다.
- source_word: בִּימֵי בְּחוּרֹתֶיךָ
  english_pob_choice: in the days of your youth
  chosen_korean: 너의 젊은 날에
  alternatives_korean:
  - 젊은 시절에
  - 청년의 날들에
  lexicon: HALOT
  rationale: 직역형보다 한국어에서 자연스러운 시간 표현으로 옮기되, 청춘의 시기라는 원문의 시간적 초점을 유지했습니다.
- source_word: אֵין לִי בָהֶם חֵפֶץ
  english_pob_choice: I have no pleasure in them
  chosen_korean: 내가 그것들에 만족을 느끼지 못하겠다
  alternatives_korean:
  - 나는 그것들에 즐거움이 없다
  - 나는 그것들에서 기쁨을 찾지 못하겠다
  lexicon: HALOT
  rationale: חֵפֶץ의 ‘즐거움/기쁨/만족’ 범위를 반영하면서, 단순 감정이 아니라 그 시기에 대한 개인적 평가를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 히브리어 복수형 בּוֹרְאֶיךָ의 처리
  chosen_reading: 단수 의미의 ‘창조주’로 번역했습니다.
  alternative_readings:
  - 복수형을 살린 ‘네 창조자들’
