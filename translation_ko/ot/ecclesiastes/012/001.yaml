  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 두 시간절(‘고난의 날들이 이르기 전에’와 ‘그 해들이 가까이 오기 전에’)은 병렬인데, 초안의 ‘곧’은 뒤의 ‘해들’을 앞의 ‘날들’의 동격처럼 처리하여 관계를 다소 좁힙니다. 또한 ‘그것들’은 ‘해들’을 가리키는 한국어 표현으로 부자연스럽습니다.
  naturalness: ‘그리고 네 … 기억하십시오’는 친근한 2인칭 소유 표현과 합쇼체 종결이 다소 어울리지 않습니다. 문장 순서를 조정하고 ‘그 해들’을 사용하면 현대 표준어의 격식 있는 성경 문체로 더 자연스럽습니다.
