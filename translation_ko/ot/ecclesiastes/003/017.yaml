language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י אֶת הַ/צַּדִּיק֙ וְ/אֶת הָ֣/רָשָׁ֔ע יִשְׁפֹּ֖ט הָ/אֱלֹהִ֑ים כִּי עֵ֣ת לְ/כָל חֵ֔פֶץ וְ/עַ֥ל כָּל הַֽ/מַּעֲשֶׂ֖ה שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
  footnotes:
  - marker: a
    text: Or, 'for there is an appointed time for every purpose and for every work.' The Hebrew terms can also be rendered more formally as 'purpose' and 'work.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew includes 'there' at the end of the clause. It may point to the place or occasion of God's judgment; some translations smooth it out in English.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 마음속으로 말했습니다[a]. “하나님께서 의인과 악인을 심판하실 것입니다[b]. 이는 모든 일과 모든 행위에 때가 있기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 마음에’이지만, 한국어에서는 내적 독백의 관용 표현으로 ‘마음속으로’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘의인’과 ‘악인’을 대조하며, 문맥상 하나님께서 그 둘을 최종적으로 심판하신다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  english_pob_choice: I said in my heart
  chosen_korean: 내가 마음속으로 말했습니다
  alternatives_korean:
  - 내가 마음에 말했습니다
  - 내가 속으로 말했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 독백을 자연스러운 현대 한국어로 풀되, 반성적 발화를 보존하기 위해 ‘마음속으로’로 옮겼습니다.
- source_word: הַצַּדִּיק / הָרָשָׁע
  english_pob_choice: the righteous / the wicked
  chosen_korean: 의인과 악인
  alternatives_korean:
  - 의로운 사람과 악한 사람
  - 의로운 자와 악한 자
  lexicon: HALOT
  rationale: 대조되는 실질적 집합명사로서 한국어 성경 관용에 맞는 ‘의인 / 악인’을 사용해 윤리적 대비를 분명히 했습니다.
- source_word: יִשְׁפֹּט הָאֱלֹהִים
  english_pob_choice: God will judge
  chosen_korean: 하나님께서 심판하실 것입니다
  alternatives_korean:
  - 하나님께서 판단하실 것입니다
  - 하나님께서 재판하실 것입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 판정보다 종말론적·도덕적 재판의 뉘앙스가 강하므로 ‘심판하다’가 원문의 무게를 가장 잘 드러냅니다.
- source_word: עֵת לְכָל חֵפֶץ וְעַל כָּל הַמַּעֲשֶׂה שָׁם
  english_pob_choice: there is a time for every matter and for every deed there
  chosen_korean: 이는 모든 일과 모든 행위에 때가 있기 때문입니다
  alternatives_korean:
  - 이는 모든 일과 모든 행위에 정한 때가 있기 때문입니다
  - 모든 뜻과 모든 행위에 때가 거기 있기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 논증 구조를 한국어로 자연스럽게 풀어 ‘때가 있기 때문입니다’로 옮겼고, 마지막 שָׁם은 영어 POB의 처리처럼 문장 끝의 강조로 간접 반영했습니다.
theological_decisions:
- issue: 마지막 שָׁם(there)의 처리
  chosen_reading: 본문에는 별도의 ‘거기’/‘그곳’ 표현을 넣지 않고, 문장 끝의 강조와 여운으로 처리했습니다.
  alternative_readings:
  - ‘거기’/‘그곳에’로 직접 옮김
  - ‘그 때에’로 해석하여 시간적 의미를 명시함
  rationale: 이 부사는 위치적·상황적 의미가 모두 가능해 해석이 갈리므로, 본문이 허용하는 긴장을 보존하기 위해 한국어 본문에서는 매끈한 문장 종결만 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
