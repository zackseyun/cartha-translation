- source_word: יִשְׁפֹּט הָאֱלֹהִים
  english_pob_choice: God will judge
  chosen_korean: 하나님께서 심판하실 것입니다
  alternatives_korean:
  - 하나님께서 판단하실 것입니다
  - 하나님께서 재판하실 것입니다
  lexicon: HALOT
  rationale: 문맥상 단순한 판정보다 종말론적·도덕적 재판의 뉘앙스가 강하므로 ‘심판하다’가 원문의 무게를 가장 잘 드러냅니다.
- source_word: עֵת לְכָל חֵפֶץ וְעַל כָּל הַמַּעֲשֶׂה שָׁם
  english_pob_choice: there is a time for every matter and for every deed there
  chosen_korean: 이는 모든 일과 모든 행위에 때가 있기 때문입니다
  alternatives_korean:
  - 이는 모든 일과 모든 행위에 정한 때가 있기 때문입니다
  - 모든 뜻과 모든 행위에 때가 거기 있기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 논증 구조를 한국어로 자연스럽게 풀어 ‘때가 있기 때문입니다’로 옮겼고, 마지막 שָׁם은 영어 POB의 처리처럼 문장 끝의 강조로 간접 반영했습니다.
theological_decisions:
- issue: 마지막 שָׁם(there)의 처리
  chosen_reading: 본문에는 별도의 ‘거기’/‘그곳’ 표현을 넣지 않고, 문장 끝의 강조와 여운으로 처리했습니다.
  alternative_readings:
  - ‘거기’/‘그곳에’로 직접 옮김
  - ‘그 때에’로 해석하여 시간적 의미를 명시함
  rationale: 이 부사는 위치적·상황적 의미가 모두 가능해 해석이 갈리므로, 본문이 허용하는 긴장을 보존하기 위해 한국어 본문에서는 매끈한 문장 종결만 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
