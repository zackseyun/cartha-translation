base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
  footnotes:
  - marker: a
    text: Or, 'for there is an appointed time for every purpose and for every work.' The Hebrew terms can also be rendered more formally as 'purpose' and 'work.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew includes 'there' at the end of the clause. It may point to the place or occasion of God's judgment; some translations smooth it out in English.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 마음속으로 말했습니다[a]. “하나님께서 의인과 악인을 심판하실 것입니다. 그곳에는 모든 일과 모든 행위에 때가 있기 때문입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 마음에’입니다. 이는 속으로 생각하거나 자신에게 말하는 것을 가리키는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문장 끝에 ‘그곳에’라는 말을 덧붙입니다. 이것이 하나님의 심판이 이루어질 장소를 가리키는지, 그 심판의 때나 상황을 가리키는지는 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  english_pob_choice: I said in my heart
  chosen_korean: 내가 마음속으로 말했습니다
  alternatives_korean:
