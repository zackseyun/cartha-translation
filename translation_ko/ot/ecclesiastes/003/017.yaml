  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 독백을 자연스러운 현대 한국어로 풀되, 반성적 발화를 보존하기 위해 ‘마음속으로’로 옮겼습니다.
- source_word: הַצַּדִּיק / הָרָשָׁע
  english_pob_choice: the righteous / the wicked
  chosen_korean: 의인과 악인
  alternatives_korean:
