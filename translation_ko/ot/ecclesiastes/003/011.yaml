id: ECC.3.11
reference: Ecclesiastes 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל עָשָׂ֖ה יָפֶ֣ה בְ/עִתּ֑/וֹ גַּ֤ם אֶת הָ/עֹלָם֙ נָתַ֣ן בְּ/לִבָּ֔/ם מִ/בְּלִ֞י אֲשֶׁ֧ר לֹא יִמְצָ֣א הָ/אָדָ֗ם אֶת הַֽ/מַּעֲשֶׂ֛ה אֲשֶׁר עָשָׂ֥ה הָ/אֱלֹהִ֖ים מֵ/רֹ֥אשׁ וְ/עַד סֽוֹף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/011.yaml
  text: He has made everything beautiful in its time. He has also put eternity in their heart[a], yet so that man cannot find out the work that God has done from beginning to end.
  footnotes:
  - marker: a
    text: Or 'the world' or 'the age' for 'eternity'; the Hebrew עוֹלָם here is difficult and may refer to an awareness of the whole span of time or of the world beyond immediate experience.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서는 모든 것을 제때에 아름답게 만드셨습니다. 또한 사람들의 마음에 영원[a]을 두셨으나, 사람이 하나님께서 처음부터 끝까지 하신 일을 찾아낼 수 없도록 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영원’은 여기서 ‘세상’ 또는 ‘시대’로도 옮길 수 있는 난해한 히브리어 עוֹלָם을 반영합니다. 이는 인간에게 시간 전체나 직접 경험 너머의 세상에 대한 인식을 주셨다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  english_pob_choice: everything
  chosen_korean: 모든 것
  alternatives_korean:
  - 전부
  - 만물
  lexicon: HALOT
  rationale: ‘하나님께서 만드신/행하신 대상의 총체’를 포괄적으로 나타내는 표현으로, 문맥의 전면성을 살립니다.
- source_word: יָפֶה בְעִתּוֹ
  english_pob_choice: beautiful in its time
  chosen_korean: 그때에 맞게 아름답게
  alternatives_korean:
  - 제때에 아름답게
  - 그 시기에 아름답게
  - 때에 맞아 아름답게
  lexicon: HALOT
  rationale: יָפֶה는 단순한 미적 아름다움뿐 아니라 ‘적절함’의 뉘앙스도 있어, 한국어에서는 ‘아름답게’에 ‘그때에 맞게’를 붙여 두 의미를 함께 살렸습니다.
- source_word: הָעֹלָם
  english_pob_choice: eternity
  chosen_korean: 영원
  alternatives_korean:
  - 세상
  - 시대
  - 영속성
  lexicon: HALOT
  rationale: 이 난해한 어휘를 POB의 본문 선택에 따라 ‘영원’으로 옮겨, 인간 내면에 주어진 시간 너머의 인식을 보존했습니다.
- source_word: בְּלִבָּם
  english_pob_choice: in their heart
  chosen_korean: 사람들의 마음에
  alternatives_korean:
  - 그들의 마음에
  - 인간의 마음에
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 내면 전체를 가리키므로, 일반적 인간을 대표하는 복수형으로 자연스럽게 옮겼습니다.
- source_word: מִבְּלִי אֲשֶׁר לֹא יִמְצָא
  english_pob_choice: yet so that man cannot find out
  chosen_korean: … 찾아낼 수 없게 하셨습니다
  alternatives_korean:
  - … 알 수 없게 하셨습니다
  - … 헤아릴 수 없게 하셨습니다
  - … 알아내지 못하게 하셨습니다
  lexicon: HALOT
  rationale: 결과/제한의 구조를 한국어로 자연스럽게 풀어, 인간의 인식 한계를 강조했습니다.
theological_decisions:
- issue: הָעֹלָם의 의미를 본문에서 어떻게 보존할 것인가
  chosen_reading: ‘영원’으로 본문에 두어, 인간에게 주어진 시간 너머의 감각과 동시에 완전한 이해 불가능성을 함께 남겼습니다.
  alternative_readings:
  - 세상
  - 시대
  - 세계
  rationale: 전통적 해석을 하나로 고정하지 않고, 본문이 유지하는 긴장을 살리는 것이 번역상 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
