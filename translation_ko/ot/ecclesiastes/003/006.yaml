  - marker: b
    text: 또는 ‘간직할 때가 있고, 내버릴 때가 있습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: עֵת
  english_pob_choice: a time
  chosen_korean: 때
  alternatives_korean:
  - 시기
  - 시절
  lexicon: HALOT
  rationale: 반복되는 병렬 구조를 살리기 위해 가장 직접적이고 자연스러운 ‘때’를 택했습니다.
- source_word: לְבַקֵּשׁ
  english_pob_choice: to seek
  chosen_korean: 찾을
  alternatives_korean:
  - 구할
  - 찾아낼
  lexicon: HALOT
  rationale: 문맥상 ‘찾다’가 대상의 부재를 전제로 한 ‘seek’의 의미를 가장 간결하게 드러냅니다.
- source_word: שׁמר
  english_pob_choice: to keep
  chosen_korean: 지킬
  alternatives_korean:
  - 간직할
  - 보존할
  lexicon: HALOT
  rationale: 여기서는 물건을 보관·유지하는 뜻이므로 ‘지키다’가 ‘keep’의 폭넓은 의미를 자연스럽게 담습니다.
- source_word: השליך
  english_pob_choice: to throw away
  chosen_korean: 버릴
  alternatives_korean:
  - 내던질
  - 던져 버릴
  lexicon: HALOT
  rationale: 현대 한국어에서 폐기·처분의 뜻을 가장 분명하게 전달하는 표현으로 ‘버리다’를 선택했습니다.
theological_decisions:
- issue: ‘seek/lost/keep/throw away’의 지혜시적 대구를 얼마나 직접적으로 드러낼지
  chosen_reading: 시적 병렬을 유지하면서도 동사 선택을 평이하게 해, 대상의 상실과 보존·폐기의 대비가 즉시 보이도록 했습니다.
  alternative_readings:
  - ‘구할 때가 있고 잃을 때가 있습니다’
  - ‘찾을 때가 있고 내버릴 때가 있습니다’
  rationale: 전도서의 잠언형 대구는 과장보다 간결한 대비가 핵심이므로, 의미를 넓히지 않으면서도 한국어 리듬이 살아나는 표현을 택했습니다.
  doctrine_reference: 전도서 3장의 지혜시적 구조와 문학적 평행법
