translation:
  language: ko
  text: 찾을 때가 있고 잃을 때가 있으며, 지킬 때가 있고 버릴 때가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾아 구할 때가 있고, 잃어버린 것으로 여길 때가 있습니다.’
