id: ECC.3.15
reference: Ecclesiastes 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה שֶּֽׁ/הָיָה֙ כְּבָ֣ר ה֔וּא וַ/אֲשֶׁ֥ר לִ/הְי֖וֹת כְּבָ֣ר הָיָ֑ה וְ/הָ/אֱלֹהִ֖ים יְבַקֵּ֥שׁ אֶת נִרְדָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/015.yaml
  text: What has been already is[a], and what is to be has already been; and God seeks what has been driven away.
  footnotes:
  - marker: a
    text: Or, 'God seeks what is pursued,' or 'God calls the past to account.' The Hebrew of the final clause is difficult and may refer either to what has been driven away/passed on or to what is pursued.
    reason: alternative_reading
translation:
  language: ko
  text: 이미 있었던 것은 지금도 있고, 앞으로 있을 것도 이미 있었습니다. 하나님께서는 쫓겨난 것을 찾으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서는 쫓기는 것을 찾으신다’, 혹은 ‘하나님께서는 지나간 것을 결산하신다’. 마지막 절의 히브리어는 어렵습니다. 이는 쫓겨나거나 지나간 것, 또는 쫓기는 것을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה / כְּבָר הוּא
  english_pob_choice: What has been already is
  chosen_korean: 이미 있던 것은 이미 있고
  alternatives_korean:
  - 무엇이 이미 있었던 것은 이미 있습니다
  - 이미 있었던 것은 이미 존재합니다
  lexicon: WLC; HALOT
  rationale: 반복 구조를 살리되 한국어에서 자연스럽게 읽히도록 ‘이미’와 현재형 ‘있다’를 대응시켜, 존재·상태의 일반 진술이라는 점을 보존했습니다.
- source_word: וַאֲשֶׁר לִהְיוֹת כְּבָר הָיָה
  english_pob_choice: what is to be has already been
  chosen_korean: 있게 될 것은 이미 있었습니다
  alternatives_korean:
  - 될 것은 이미 있었습니다
  - 앞으로 있을 것은 이미 있었습니다
  lexicon: WLC; HALOT
  rationale: 미래 지시를 드러내는 ‘있게 될 것’으로 옮겨, 앞 절과 평행을 이루면서도 히브리어의 시간적 역전을 유지했습니다.
- source_word: וְהָאֱלֹהִים יְבַקֵּשׁ אֶת נִרְדָּף
  english_pob_choice: God seeks what has been driven away
  chosen_korean: 하나님은 쫓겨난 것을 찾으십니다
  alternatives_korean:
  - 하나님은 추적당한 것을 찾으십니다
  - 하나님은 쫓긴 것을 찾으십니다
  lexicon: WLC; HALOT
  rationale: נִרְדָּף의 수동/결과적 뉘앙스를 살려 ‘쫓겨난 것’으로 옮겼습니다. ‘찾으십니다’는 בקשׁ의 기본 의미를 보존하면서, POB의 의도처럼 해석을 한 방향으로 과도하게 좁히지 않습니다.
theological_decisions:
- issue: 마지막 절의 נִרְדָּף 해석
  chosen_reading: ‘쫓겨난 것’으로 본문 번역을 유지하고, 다른 가능한 이해를 각주에 남깁니다.
  alternative_readings:
  - ‘추적당한 것’
  - ‘쫓기는 것’
  - ‘과거에 속한 것/지나간 것’
  rationale: 히브리어가 압축적이고 다의적이어서, 본문에서는 한 해석을 단정하지 않고 POB의 긴장 보존 원칙을 따릅니다.
  doctrine_reference: Translation philosophy §3 — 해석상의 긴장을 풀어버리지 않고 보존
