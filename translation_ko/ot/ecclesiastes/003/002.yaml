  rationale: 문맥상 ‘죽을 때’와 짝을 이루는 개인의 생애 시작을 가리키므로, 능동형보다 한국어 자연어인 ‘태어날 때’로 옮겼습니다.
- source_word: לַעֲקֹור נָטוּעַ
  english_pob_choice: to uproot what is planted
