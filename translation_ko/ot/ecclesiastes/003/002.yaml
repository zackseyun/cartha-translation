  - 심은 것을 뽑아낼 때
  lexicon: HALOT
  rationale: עקר는 ‘뽑다/뿌리째 뽑다’의 뜻이므로, 농경 이미지를 살리면서도 현대 한국어로 자연스러운 ‘뽑아내다’를 택했습니다.
