  text: 태어날 때가 있고 죽을 때가 있으며, 심을 때가 있고 심은 것을 뽑아낼 때가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “심은 것을 뿌리째 뽑을 때”로 옮길 수 있습니다.
