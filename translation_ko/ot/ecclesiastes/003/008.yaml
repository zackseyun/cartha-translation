  text: a time to love[a], and a time to hate; a time for war[c][b], and a time for peace.
  footnotes:
  - marker: a
    text: Or 'a season.' The Hebrew עֵת can denote a time or season, but 'time' best fits the poem's repeated cadence.
    reason: lexical_alternative
  - marker: b
    text: '''Hate'' here renders the Hebrew verb directly; in this wisdom context it expresses strong aversion or opposition in contrast with love, not necessarily sinful malice.'
    reason: lexical_alternative
  - marker: c
    text: '''Peace'' translates שָׁלוֹם, which can also mean ''well-being'' or ''wholeness''; here the contrast with war favors ''peace.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사랑할 때가 있고 미워할 때가 있습니다. 전쟁의 때가 있고 평화의 때가 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֵת는 ‘때’ 또는 ‘시기’를 뜻할 수 있으나, 이 시의 반복되는 운율에는 ‘때’가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘미워하다’는 여기서 사랑과의 대조를 이루는 히브리어 동사를 직접 옮긴 것입니다. 이 문맥에서는 반드시 죄된 증오만을 뜻한다고 볼 수는 없습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘평화’는 히브리어 שָׁלוֹם의 번역으로, ‘평안’이나 ‘온전함’의 뜻도 담을 수 있지만 여기서는 전쟁과의 대비가 분명합니다.
    reason: lexical_alternative
