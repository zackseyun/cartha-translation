theological_decisions:
- issue: ‘미워하다’의 도덕적 오해 가능성
  chosen_reading: 본문은 사랑과 미움의 윤리 명령이 아니라, 하나님의 섭리 아래 삶에 있는 상반된 때를 진술하는 시구로 유지했습니다.
  alternative_readings:
