    rationale: ‘인생’은 성서 문체에서는 가능하나 현대 표준어의 일반적 인간 집단 지칭으로는 ‘사람들’보다 덜 자연스럽습니다. 히브리어 בְּנֵי הָאָדָם의 집합적 인간 일반이라는 뜻은 ‘사람들에게’로 충분히 유지됩니다.
  - severity: low
