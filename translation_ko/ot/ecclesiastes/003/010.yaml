    rationale: 현 각주의 ‘그 일에 매여 일하게 한다’는 해석을 다소 구체화합니다. 본문의 난해성을 보존하려면 ‘괴로움을 겪게’와 ‘수고하게’라는 직접적 대안을 제시하고, ‘힘쓰다/분주히 지내다’와 부담의 양 가능성을 간결히 밝혀야 합니다.
