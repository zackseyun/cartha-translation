translation:
  language: ko
  text: 나는 하나님께서 사람들이 그 일에 힘쓰게 하시려고 사람들에게 주신 일을 보았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것으로 괴로움을 겪게’ 또는 ‘그 일에 수고하게’. 히브리어 표현은 뜻이 분명하지 않아, 그 일에 힘쓰거나 분주히 지내게 한다는 뜻일 수도 있고 그 일로 말미암아 부담이나 괴로움을 겪게 한다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I have seen
  chosen_korean: 나는 … 보았습니다
  alternatives_korean:
  - 나는 … 보았습니다
  lexicon: HALOT
  rationale: 전도자의 성찰적 관찰을 자연스럽게 살리기 위해 완료형의 관찰 진술로 옮겼습니다.
- source_word: הָעִנְיָן
  english_pob_choice: the task
  chosen_korean: 그 일
  alternatives_korean:
  - 그 과업
  - 그 수고거리
  - 그 일거리
  lexicon: HALOT
  rationale: 전도서 문맥에서 지정된 ‘일/일거리’의 뜻이 자연스러워, 추상적이기보다 실제로 맡겨진 과업의 뉘앙스를 살렸습니다.
- source_word: לִבְנֵי הָאָדָם
  english_pob_choice: to the sons of man
  chosen_korean: 인생들에게
  alternatives_korean:
  - 사람의 아들들에게
  - 사람들에게
  - 인류에게
  lexicon: HALOT
  rationale: 히브리어의 남성형 관용구를 직접 풀어 쓰되, 한국어에서는 통용성이 높은 ‘인생’으로 대표성을 살렸습니다.
- source_word: לַעֲנוֹת בּוֹ
  english_pob_choice: to be occupied with
  chosen_korean: 그것으로 수고하게
  alternatives_korean:
  - 그것에 얽매이게
  - 그것으로 괴로움을 당하게
  - 그것에 몰두하게
  lexicon: HALOT
  rationale: 본문의 난해한 표현을 ‘수고하다’로 옮겨, 단순한 분주함과 더불어 수고로운 부담의 가능성도 열어 두었습니다.
theological_decisions:
- issue: לִבְנֵי הָאָדָם의 대표성
  chosen_reading: 인생들에게
  alternative_readings:
  - 사람들에게
  - 인류에게
  - 사람의 아들들에게
  rationale: 히브리어의 남성형 관용은 직접 드러나지 않게 하되, 전도서의 인간 일반을 가리키는 대표성을 유지하는 한국어를 택했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם *adam*'
- issue: לַעֲנוֹת בּוֹ의 난해성
  chosen_reading: 그것으로 수고하게
  alternative_readings:
  - 그것에 괴로움을 당하게
  - 그것에 몰두하게
  - 그것으로 얽매이게
  rationale: 문맥상 하나님이 인간에게 맡기신 일이 ‘수고’의 대상이 된다는 전도서의 주제를 반영하면서도, 단정적인 해석으로 좁히지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
