lexical_decisions:
- source_word: עֵת
  english_pob_choice: a time
  chosen_korean: ~할 때
  alternatives_korean:
  - ~할 시기
  - ~할 때가 있습니다
  lexicon: HALOT
  rationale: עֵת의 반복적 운율을 살리면서도 현대 한국어에서 가장 자연스러운 대응은 ‘~할 때’입니다. 영어 POB의 ‘a time’처럼 동일한 구조를 반복해 시적 병렬을 보존했습니다.
- source_word: לַהֲרוֹג
  english_pob_choice: to kill
  chosen_korean: 죽일
  alternatives_korean:
  - 죽이는
  - 죽일 시기가 있는
  lexicon: HALOT
  rationale: הרג는 폭넓게 ‘죽이다’를 뜻하므로, 도덕적 완곡어법으로 약화하지 않고 직접적으로 옮겼습니다. 영어 POB가 ‘to kill’을 유지한 것과 같은 방향입니다.
- source_word: לִרְפּוֹא
  english_pob_choice: to heal
  chosen_korean: 고칠
  alternatives_korean:
  - 치유할
  - 낫게 할
  lexicon: HALOT
  rationale: רפא는 ‘치유하다/고치다’의 뜻이므로, 병을 낫게 한다는 의미를 간명하게 드러내는 ‘고치다’를 택했습니다. ‘치유하다’도 가능하지만 본문의 대구에서 한국어로는 ‘고치다’가 더 간결합니다.
- source_word: לִפְרֹוץ
  english_pob_choice: to tear down
  chosen_korean: 허물어뜨릴
  alternatives_korean:
  - 무너뜨릴
  - 헐어버릴
  - 부술
  lexicon: HALOT
  rationale: פרץ는 여기서 ‘무너뜨리다/허물다’의 파괴적 의미가 핵심이므로, 건축의 반대인 해체를 분명히 하는 ‘허물어뜨리다’를 선택했습니다. 영어 POB의 ‘tear down’과 같은 대비를 유지합니다.
- source_word: לִבְנוֹת
  english_pob_choice: to build up
  chosen_korean: 세울
  alternatives_korean:
  - 건축할
  - 짓고 세울
  - 세워 올릴
  lexicon: HALOT
  rationale: בנה는 기본적으로 ‘짓다/세우다’인데, 전반적 병렬에서 파괴의 반대편을 간단명료하게 보여 주는 ‘세우다’를 택했습니다. ‘build up’의 상승적 뉘앙스는 과도하게 확장하지 않았습니다.
theological_decisions:
- issue: 이 구절의 파괴 동사를 도덕적으로 완화할지 여부
  chosen_reading: 설명적 목록의 긴장감을 유지하기 위해 ‘죽일’과 ‘허물어뜨릴’을 직접적으로 옮겼습니다.
  alternative_readings:
  - 살릴 때
  - 파괴할 때
  - 무너뜨릴 때
  rationale: 전도서는 ‘이 아래에서’ 인간 삶의 상이한 때들을 열거할 뿐이며, 나열된 행위를 모두 승인한다고 말하지 않습니다. 따라서 본문이 지닌 날카로움을 완화하지 않고 그대로 드러내는 것이 소스에 더 충실합니다.
  doctrine_reference: 본문의 긴장을 해소하지 않고 유지한다.
