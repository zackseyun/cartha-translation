  text: וְ/גַ֤ם כָּל הָ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/רָאָ֥ה ט֖וֹב בְּ/כָל עֲמָל֑/וֹ מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/013.yaml
  text: And also that every man should eat and drink and see good in all his labor—this is the gift of God[a][b].
  footnotes:
  - marker: a
    text: Or 'everyone' / 'every person'; Hebrew 'every man' uses a generic singular for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'enjoy good' or 'experience good'; Hebrew literally, 'see good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 모든 사람이 먹고 마시며 자기의 모든 수고 가운데서 좋은 것을 보는 것은 하나님의 선물입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람마다’ 또는 ‘각 사람마다’; 히브리어는 인류를 가리키는 일반적 단수 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘좋은 것을 누리다’ 또는 ‘좋은 것을 경험하다’; 히브리어는 문자적으로 ‘좋은 것을 보다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הָאָדָם
  english_pob_choice: And also that every man
  chosen_korean: 또 사람마다
  alternatives_korean:
  - 또 모든 사람이
  - 또 각 사람마다
  - 또 사람마다
  lexicon: HALOT
  rationale: אָדָם은 여기서 인류 전체를 가리키는 일반적 표현이므로, 한국어에서는 자연스럽고 현대적인 분포적 표현인 '사람마다'로 옮겨 generic 함을 살렸습니다.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  english_pob_choice: should eat and drink
  chosen_korean: 먹고 마시며
  alternatives_korean:
  - 먹고 마셔야 하며
  - 먹고 마시고
  - 먹으며 마시며
  lexicon: HALOT
  rationale: 히브리어의 יחס절적/내용절적 흐름을 과도하게 의무화하지 않고, 인간에게 주어진 보편적 삶의 모습으로 자연스럽게 풀어 '먹고 마시며'로 표현했습니다.
- source_word: וְרָאָה טוֹב
  english_pob_choice: and see good
  chosen_korean: 좋은 것을 보게 되는 것
  alternatives_korean:
  - 좋은 것을 보고
  - 좋음을 누리고
  - 좋은 것을 경험하고
  lexicon: HALOT
  rationale: 직역상 '좋은 것을 보다'를 유지하되, 한국어에서 어색하지 않도록 '보게 되는 것'으로 풀어 원문의 이미지와 POB의 'see good'를 함께 반영했습니다.
- source_word: בְּכָל עֲמָלוֹ
  english_pob_choice: in all his labor
  chosen_korean: 자기 모든 수고 속에서
  alternatives_korean:
  - 그의 모든 노동 속에서
  - 자기 모든 일 가운데
  - 자기 모든 수고 안에서
  lexicon: HALOT
  rationale: עָמָל은 단순한 일이 아니라 수고·노고의 뉘앙스가 있어 '수고'로 옮겼고, 전치사 בְּ는 결과나 범위가 드러나는 한국어 표현 '속에서'로 자연스럽게 살렸습니다.
- source_word: מַתַּת אֱלֹהִים הִיא
  english_pob_choice: this is the gift of God
  chosen_korean: 이것이 하나님의 선물입니다
  alternatives_korean:
  - 이것은 하나님의 선물입니다
  - 이것이 하나님이 주시는 선물입니다
  - 이것은 하나님께서 주신 선물입니다
  lexicon: HALOT
  rationale: 문맥상 앞 절 전체를 가리키는 지시어의 힘을 살려 '이것이'로 시작했고, מַתַּת의 명사적 선언을 '선물'로 직역해 하나님의 주권적 주심을 보존했습니다.
theological_decisions:
- issue: כָּל הָאָדָם의 일반명사적 범위
  chosen_reading: '''사람마다''로 옮겨 남성형 형식을 그대로 드러내기보다 일반적 인간 전체를 가리키는 분배적 의미를 살렸습니다.'
  alternative_readings:
  - 모든 사람
  - 각 사람
  - 사람마다
  rationale: 히브리어 אָדָם은 여기서 대표적 인류 일반을 가리키는 표현이므로, 성별을 새로 도입하지 않으면서도 문맥의 보편성을 전달하는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם'
