  naturalness: ‘또 모든 사람이 먹고 마시며 자기의 모든 수고 가운데서 좋은 것을 보는 것은 하나님의 선물입니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 히브리어의 긴 주어절과 결론을 명료하게 반영합니다.
