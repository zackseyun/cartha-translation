base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/016.yaml
  text: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
  footnotes:
  - marker: a
    text: Or 'in the place of justice' for 'in the place of righteousness'; Hebrew uses a different word here (צֶדֶק) than in the previous phrase (מִשְׁפָּט), though the meanings overlap.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 또 해 아래에서 보았습니다. 정의의 자리에는 악이 있었고, 의의 자리[a]에도 악이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의의 자리’로도 옮길 수 있습니다. 히브리어는 앞 구절의 מִשְׁפָּט와 다른 단어인 צֶדֶק을 사용하지만, 두 말의 의미는 겹칩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְע֥וֹד
  english_pob_choice: And I also
  chosen_korean: 나는 또
  alternatives_korean:
  - 그리고 나는 또
  - 또한 나는
  lexicon: HALOT
  rationale: 전도자의 관찰을 이어 가는 추가 진술이므로 ‘또’가 additive force를 자연스럽게 살립니다.
- source_word: תַּ֣חַת הַ/שָּׁ֑מֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  lexicon: HALOT
  rationale: 전도서의 관용구를 한국어로 자연스럽게 옮기되, 반복되는 문맥적 어조를 살리기 위해 익숙한 직역형을 유지했습니다.
- source_word: מְק֤וֹם הַ/מִּשְׁפָּט
  english_pob_choice: the place of justice
  chosen_korean: 정의의 자리
  alternatives_korean:
  - 정의의 곳
  - 심판의 자리
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 법정적 ‘심판’보다 정의가 집행되어야 할 장소를 가리키므로, 의미 범위를 살려 ‘정의의 자리’로 옮겼습니다.
- source_word: וּ/מְק֥וֹם הַ/צֶּ֖דֶק
  english_pob_choice: and in the place of righteousness
  chosen_korean: 의의 자리
  alternatives_korean:
  - 정의의 자리
  - 옳음의 자리
  lexicon: HALOT
  rationale: 앞선 מִשְׁפָּט와 구별되는 צֶדֶק의 어휘 대비를 살리기 위해 ‘의’로 번역해 반복을 피했습니다.
- source_word: הָ/רֶ֔שַׁע ... הָ/רָֽשַׁע
  english_pob_choice: wickedness ... wickedness
  chosen_korean: 악이 ... 악이
  alternatives_korean:
  - 악이 ... 악이었습니다
  - 불의가 ... 불의가
  lexicon: HALOT
  rationale: 두 절에서 반복되는 추상명사 구조를 그대로 살려, 장소와 현실의 뒤틀림을 압축적으로 드러내는 ‘악’으로 옮겼습니다.
theological_decisions:
- issue: מִשְׁפָּט와 צֶדֶק의 구별 유지
  chosen_reading: 두 어휘를 각각 ‘정의’와 ‘의’로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘정의’로 통일
  - 둘 다 ‘의’로 통일
  rationale: 히브리어는 유사하지만 동일하지 않은 두 단어를 병렬로 쓰므로, 한국어에서도 의미 중첩을 완전히 평탄화하지 않고 차이를 남기는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy 5 (Consistency of key terms, or documented exception)
