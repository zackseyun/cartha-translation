lexical_decisions:
- source_word: מַה
  english_pob_choice: What
  chosen_korean: 무슨
  alternatives_korean:
  - 무엇의
  - 어떤
  lexicon: HALOT
  rationale: 히브리어 의문사 מַה의 간결한 문제 제기를 살려, 한국어에서도 짧고 직접적인 의문 표현인 ‘무슨’이 가장 자연스럽습니다.
- source_word: יִתְרוֹן
  english_pob_choice: profit
  chosen_korean: 유익
  alternatives_korean:
  - 이익
  - 이득
  - 남는 것
  lexicon: HALOT
  rationale: 전도서의 핵심어로서 ‘남는 가치/소득’을 가리키지만, 한국어에서는 문맥상 자연스럽고 수사적 질문의 힘을 살릴 수 있는 ‘유익’이 적절합니다.
- source_word: הָעֹשֶׂה
  english_pob_choice: the worker
  chosen_korean: 일하는 사람
  alternatives_korean:
  - 일꾼
  - 일하는 자
  - 일하는 이
  lexicon: HALOT
  rationale: 분사형 ‘하는 사람’을 한국어의 현대적 문장으로 풀어, 단순 직업명보다 행위 주체를 드러내는 표현으로 옮겼습니다.
- source_word: בַּאֲשֶׁר ... עָמֵל
  english_pob_choice: from that in which he labors
  chosen_korean: 그 일에서 수고하는
  alternatives_korean:
  - 그가 수고하는 것에서
  - 그가 애써 일하는 바로 그 일에서
  lexicon: HALOT
  rationale: בַּאֲשֶׁר와 עָמֵל의 결합은 ‘그가 수고하는 바로 그 영역/일’의 뜻이므로, 이를 자연스럽게 살린 ‘그 일에서 수고하는’으로 옮겼습니다.
