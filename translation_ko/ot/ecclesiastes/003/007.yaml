source:
  edition: WLC
  text: עֵ֤ת לִ/קְר֨וֹעַ֙ וְ/עֵ֣ת לִ/תְפּ֔וֹר עֵ֥ת לַ/חֲשׁ֖וֹת וְ/עֵ֥ת לְ/דַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/007.yaml
  text: a time to tear[a], and a time to sew; a time to keep silent, and a time to speak[b];
  footnotes:
  - marker: a
    text: The phrase 'to tear' may allude to tearing garments as a sign of grief, shock, or mourning, though the object is not stated in the Hebrew.
    reason: cultural_note
  - marker: b
    text: Or 'a time to be silent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 찢을 때가 있고, 꿰맬 때가 있습니다. 잠잠할 때가 있고, 말할 때가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 찢는 대상을 밝히지 않지만, 애도·충격의 표지로 옷을 찢는 풍습을 떠올리게 할 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘잠잠할 때’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  english_pob_choice: a time
  chosen_korean: 때
  alternatives_korean:
  - 시간
  - 시기
  lexicon: HALOT
  rationale: 반복되는 병렬 구조에서 עֵת의 간결한 시간-국면 의미를 가장 자연스럽게 살리며, 한국어에서도 리듬을 유지합니다.
- source_word: לִקְרוֹעַ
  english_pob_choice: to tear
  chosen_korean: 찢을
  alternatives_korean:
  - 뜯을
  - 찢어 놓을
  lexicon: HALOT
  rationale: קרע의 기본 의미인 ‘찢다’를 직접 반영해, 애도용 의복 찢기를 암시할 수 있는 여지를 남기되 대상을 과도하게 특정하지 않습니다.
- source_word: לִתְפּוֹר
  english_pob_choice: to sew
  chosen_korean: 꿰맬
  alternatives_korean:
  - 바느질할
  - 꿰찰
  lexicon: HALOT
  rationale: תפר의 ‘바느질하다/꿰매다’ 의미를 자연스럽게 살리면서 앞의 ‘찢다’와 선명한 대구를 이룹니다.
- source_word: לַחֲשׁוֹת
  english_pob_choice: to keep silent
  chosen_korean: 잠잠할
  alternatives_korean:
  - 침묵할
  - 조용할
  lexicon: HALOT
  rationale: חשׁה는 단순한 소음 부재보다 의도적인 침묵에 가깝기 때문에, ‘잠잠하다’가 시적이고도 절제된 의미를 잘 전달합니다.
- source_word: לְדַבֵּר
  english_pob_choice: to speak
  chosen_korean: 말할
  alternatives_korean:
  - 말을 할
  - 발언할
  lexicon: HALOT
  rationale: דבר의 일반적 의미를 현대 한국어로 자연스럽게 옮기되, 앞의 ‘잠잠하다’와 균형을 이루도록 간결하게 처리했습니다.
theological_decisions:
- issue: 본문의 생략된 대상과 애도 관용구 가능성
  chosen_reading: ‘찢을 때’로 직역하되, 찢는 대상은 본문에 명시하지 않습니다.
  alternative_readings:
  - ‘옷을 찢을 때’로 보충 번역
  - ‘애도할 때’로 의역
  rationale: 히브리어는 행위만 말하고 대상을 밝히지 않으므로, 문화적 관습(애도 시 의복 찢기)을 암시하되 본문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: 본문해석/문학적 절제
