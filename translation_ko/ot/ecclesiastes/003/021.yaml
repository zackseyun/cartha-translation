id: ECC.3.21
reference: Ecclesiastes 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֣י יוֹדֵ֗עַ ר֚וּחַ בְּנֵ֣י הָ/אָדָ֔ם הָ/עֹלָ֥ה הִ֖יא לְ/מָ֑עְלָ/ה וְ/ר֨וּחַ֙ הַ/בְּהֵמָ֔ה הַ/יֹּרֶ֥דֶת הִ֖יא לְ/מַ֥טָּה לָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/021.yaml
  text: Who knows whether the spirit of the sons of man goes upward[b][a], and whether the spirit of the beast goes down to the earth?
  footnotes:
  - marker: a
    text: Or 'the spirit of human beings.' The Hebrew reads 'the spirit of the sons of man,' using a masculine expression with representative force for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'breath' instead of 'spirit' in both occurrences of רוּחַ; Ecclesiastes can use the term with overlapping senses.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 사람의 영이 위로 올라가는지, 또 짐승의 영이 땅으로 내려가는지 알겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 두 경우 모두 ‘영’ 대신 ‘숨’. 히브리어 רוּחַ는 전도서에서 서로 겹치는 의미로 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람의 영’. 히브리어는 ‘사람의 아들들’이라는 남성형 표현을 사용하며, 인류 전체를 대표하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  english_pob_choice: Who knows
  chosen_korean: 누가 … 알겠습니까?
  alternatives_korean:
  - 누가 … 압니까?
  - 누가 … 알 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어에서도 자연스러운 의문문으로 살렸습니다. '알겠습니까'는 단순 정보 질문이 아니라 전도서 특유의 인식의 한계를 드러냅니다.
- source_word: רוּחַ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 생기
  - 영혼
  lexicon: HALOT
  rationale: 이 문맥의 רוּחַ는 인간과 짐승의 생명 원리/존재 상태를 가리키므로, '숨'보다 더 포괄적인 '영'이 적절합니다. 다만 신학적 의미의 '성령'으로는 좁히지 않았습니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의
  alternatives_korean:
  - 인간의
  - 사람 자손의
  - 인자의
  lexicon: HALOT
  rationale: 영어 POB가 문법적 남성표현의 대리적 힘을 보존하되 이해 가능성을 유지했으므로, 한국어에서는 관용적이면서도 대표성을 유지하는 '사람의'로 옮겼습니다. 직역형인 '사람의 아들들'은 한국어에서 불필요하게 어색합니다.
- source_word: הַבְּהֵמָה
  english_pob_choice: the beast
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 가축
  - 들짐승
  lexicon: HALOT
  rationale: 히브리어의 대조를 유지하기 위해 일반적인 '동물'보다 어감이 강한 '짐승'을 택했습니다. 전도서의 인간-짐승 대비를 선명하게 드러냅니다.
- source_word: לְמָעְלָה ... לְמַטָּה לָאָרֶץ
  english_pob_choice: goes upward ... goes down to the earth
  chosen_korean: 위로 올라가는지 … 땅으로 내려가는지
  alternatives_korean:
  - 위로 올라가는지 … 땅 아래로 내려가는지
  - 위로 향하는지 … 땅으로 떨어지는지
  lexicon: HALOT
  rationale: 상향/하향의 대조를 한국어에서 가장 직접적으로 표현했습니다. '땅으로'는 'to the earth'의 종결 방향을 살리며, 지면/흙의 이미지보다 더 넓은 'earth'의 감각을 유지합니다.
theological_decisions:
- issue: 전도서 3:21의 인식론적 유보를 얼마나 분명히 드러낼 것인가
  chosen_reading: 수사적 질문으로 남겨 '누가 … 알겠습니까?'라고 옮겼습니다.
  alternative_readings:
  - '''사람의 영이 위로 올라가고 짐승의 영이 땅으로 내려간다는 것을 누가 압니까?''처럼 보다 평서문에 가깝게 옮길 수 있음'
  - 확정적 진술처럼 보이게 번역할 수 있음
  rationale: 히브리어 מִי יוֹדֵעַ는 단순 정보 요청이 아니라 확정적 단언을 보류하는 표현입니다. 이 절의 신학적 긴장을 해소하지 않고 그대로 보존하는 것이 문맥에 충실합니다.
  doctrine_reference: 전도서의 의도적 불확실성 보존
