  text: לַ/כֹּ֖ל זְמָ֑ן וְ/עֵ֥ת לְ/כָל חֵ֖פֶץ תַּ֥חַת הַ/שָּׁמָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/001.yaml
  text: For everything there is a season[a], and a time for every matter under the heavens.
  footnotes:
  - marker: a
    text: 'Or ''purpose'': the Hebrew חֵפֶץ can mean ''matter,'' ''activity,'' or ''purpose.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 것에는 때가 있고, 하늘 아래 모든 일에는 때가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목적’. 히브리어 חֵפֶץ는 ‘일, 사안, 활동, 목적’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּל
  english_pob_choice: for everything
  chosen_korean: 모든 것에는
  alternatives_korean:
  - 모든 일에는
  - 각각의 것에는
  lexicon: HALOT
  rationale: ל plus כֹּל의 포괄적 범위를 한국어에서는 ‘모든 것’으로 자연스럽게 살렸습니다. 문맥상 시간의 배분을 말하므로 주어격보다 ‘-에는’ 구조가 어울립니다.
- source_word: זְמָן
  english_pob_choice: season
  chosen_korean: 때
  alternatives_korean:
  - 계절
  - 정해진 때
  - 시기
  lexicon: HALOT
  rationale: זְמָן은 정해진 또는 알맞은 시간을 가리키므로, 한국어에서는 ‘때’가 가장 간결하게 그 뉘앙스를 담습니다. ‘계절’은 의미가 좁아지고, ‘시기’는 다소 행정적입니다.
- source_word: עֵת
  english_pob_choice: and a time
  chosen_korean: 때
  alternatives_korean:
  - 시간
  - 시각
  - 시점
  lexicon: HALOT
  rationale: עֵת의 일반적 의미를 ‘때’로 옮겨 앞의 זְמָן과도 자연스러운 평행을 이루게 했습니다. 영어처럼 두 번 ‘시간’이라고 반복하지 않고도 시적 대구를 유지합니다.
- source_word: חֵפֶץ
  english_pob_choice: matter
  chosen_korean: 일
  alternatives_korean:
  - 일들
  - 사안
  - 목적
  - 사사건건
  lexicon: HALOT
  rationale: חֵפֶץ는 ‘일, 사안, 활동, 목적’의 폭이 있으므로, 본문이 이어질 인간사의 목록을 생각할 때 ‘일’이 가장 넓고 덜 단정적인 대응입니다. ‘목적’은 인과적·목적론적 뉘앙스를 과도하게 고정할 수 있습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘 아래
  alternatives_korean:
  - 하늘 아래에서
  - 하늘 밑
  - 하늘 아래의
  lexicon: HALOT
  rationale: 직역인 ‘하늘들’보다 한국어 관용과 시적 자연스러움을 살려 ‘하늘 아래’로 옮겼습니다. 이는 전도서가 즐겨 쓰는 ‘under the heavens’의 지상적 영역을 잘 드러냅니다.
theological_decisions:
- issue: חֵפֶץ를 ‘목적’으로 읽어 강한 섭리·목적론을 함축할지 여부
  chosen_reading: ‘일’로 옮겨 본문이 말하는 범위를 넓게 유지합니다.
  alternative_readings:
  - 목적
  - 사건
  rationale: 히브리어 עצמו가 여기서 모든 사건의 강한 목적론을 명시한다고 보기보다, 모든 인간사의 적절한 때를 말하는 표현으로 남겨 두는 편이 원문의 긴장과 넓이를 보존합니다.
  doctrine_reference: 본문의 신학적 함의를 지나치게 해소하지 않고 보존
