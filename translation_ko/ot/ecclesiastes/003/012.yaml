base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/012.yaml
  text: I know that there is nothing better for them than to rejoice and to do good during their lives[a].
  footnotes:
  - marker: a
    text: Or 'and to enjoy themselves' / 'and to fare well'; the Hebrew phrase can be taken either ethically ('do good') or experientially ('do well, enjoy life').
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들이 사는 동안 기뻐하고 선을 행하는 것보다 그들에게 더 나은 것은 없음을 압니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘즐겁게 지내는 것’, ‘잘 지내는 것’으로 옮길 수 있습니다. 히브리어 표현은 윤리적으로 ‘선을 행하다’로도, 경험적으로 ‘잘 살다’ 또는 ‘즐기다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 나는 ... 압니다
  alternatives_korean:
  - 나는 ... 알게 되었습니다
  - 나는 ... 알고 있습니다
  lexicon: HALOT
  rationale: 1인칭 완료형의 현재적 확신을 한국어에서는 「압니다」로 자연스럽게 옮기는 것이 합쇼체에 맞고, 전도자의 숙고된 진술을 잘 드러냅니다.
- source_word: אֵין טוֹב בָּם / כִּי אִם
  english_pob_choice: there is nothing better for them than
  chosen_korean: 그들에게는 ... 더 나은 것이 없다는 것
  alternatives_korean:
  - 그들에게는 ... 더 좋은 것이 없다는 것
  - 그들에게는 ... 외에는 없다
  lexicon: HALOT
  rationale: POB의 비교적·제외적 구조를 살려 「더 나은 것이 없다」로 옮기되, 한국어에서 어색한 직역을 피하고 문맥상 의미를 자연스럽게 전달했습니다.
- source_word: לִשְׂמוֹחַ
  english_pob_choice: to rejoice
  chosen_korean: 즐거워하고
  alternatives_korean:
  - 기뻐하고
  - 즐기고
  lexicon: HALOT
  rationale: 동사의 즐거움/기쁨 의미를 살리면서 다음 구와 병렬되도록 현재분사형으로 자연스럽게 처리했습니다.
- source_word: וְלַעֲשׂוֹת טוֹב
  english_pob_choice: to do good
  chosen_korean: 선을 행하는 것
  alternatives_korean:
  - 좋은 일을 하는 것
  - 좋은 것을 행하는 것
  - 잘 지내는 것
  lexicon: HALOT
  rationale: 히브리어의 가장 직접적인 윤리적 의미를 따라 「선을 행하다」로 옮겼고, 경험적 의미로 완화하는 해석은 본문 밖 주석으로 남기는 것이 적절합니다.
- source_word: בְּחַיָּיו
  english_pob_choice: during their lives
  chosen_korean: 사는 동안
  alternatives_korean:
  - 그들의 삶 동안
  - 그 생애 동안
  lexicon: HALOT
  rationale: 문맥상 일반적 인간의 삶을 가리키는 분배적 의미를 한국어의 관용 표현 「사는 동안」으로 간결하게 살렸습니다.
theological_decisions:
- issue: וְלַעֲשׂוֹת טוֹב의 의미를 윤리적 표현으로 유지할지, 경험적 의미로 완화할지
  chosen_reading: 「선을 행하는 것」으로 유지했습니다.
  alternative_readings:
  - 「즐기며 사는 것」
  - 「잘 지내는 것」
  rationale: 히브리어 구문 자체는 윤리적 의미인 「선을 행하다」를 직접 지지하므로, 그 긴장을 지우지 않고 본문 그대로 드러내는 편이 source-grounded합니다. 경험적 의미 가능성은 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
