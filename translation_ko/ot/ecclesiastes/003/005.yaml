  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֵ֚ת לְ/הַשְׁלִ֣יךְ אֲבָנִ֔ים וְ/עֵ֖ת כְּנ֣וֹס אֲבָנִ֑ים עֵ֣ת לַ/חֲב֔וֹק וְ/עֵ֖ת לִ/רְחֹ֥ק מֵ/חַבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/005.yaml
  text: A time to throw stones[a], and a time to gather stones; a time to embrace, and a time to refrain from embracing.
  footnotes:
  - marker: a
    text: Or 'A time to cast stones, and a time to gather stones.' The Hebrew imagery may be read literally, though some interpreters understand it metaphorically in relation to human relationships, agriculture, or warfare.
    reason: lexical_alternative
translation:
  language: ko
  text: 돌을 던질 때가 있고, 돌을 모을 때가 있습니다. 포옹할 때가 있고, 포옹을 멈출 때가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이미지는 문자적으로도 읽을 수 있고, 어떤 해석자들은 인간 관계, 농경, 전쟁과 관련된 비유로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵת
  english_pob_choice: a time
  chosen_korean: 때
  alternatives_korean:
  - 시간
  - 시기
  - 철
  lexicon: HALOT
  rationale: 반복되는 시적 병행구조에서 עֵת의 일반적 의미를 가장 자연스럽게 살리는 표준어 표현은 ‘때’입니다.
- source_word: לְהַשְׁלִיךְ אֲבָנִים
  english_pob_choice: to throw stones
  chosen_korean: 돌을 던질 때
  alternatives_korean:
  - 돌을 던질 때
  - 돌을 내던질 때
  - 돌을 캐스팅할 때
  lexicon: HALOT
  rationale: השליך의 기본 의미는 ‘던지다/내던지다’이므로, 영어 POB의 ‘throw’와 대응되면서도 자연스러운 한국어로 옮겼습니다.
- source_word: כְּנוֹס אֲבָנִים
  english_pob_choice: to gather stones
  chosen_korean: 돌을 모을 때
  alternatives_korean:
  - 돌을 모을 때
  - 돌을 거둘 때
  - 돌을 수집할 때
  lexicon: HALOT
  rationale: כנס는 ‘모으다, 거두다’의 뜻이므로, 문맥상 가장 간명하고 시적인 ‘모을 때’를 선택했습니다.
- source_word: לַחֲבוֹק
  english_pob_choice: to embrace
  chosen_korean: 포옹할 때
  alternatives_korean:
  - 안을 때
  - 껴안을 때
  - 포옹할 때
  lexicon: HALOT
  rationale: חבק은 신체적 ‘껴안음’이지만, 한국어에서는 시적·문학적 병행을 살리는 ‘포옹하다’가 영어 POB의 ‘embrace’와 가장 잘 맞습니다.
- source_word: לִרְחֹק מֵחַבֵּק
  english_pob_choice: to refrain from embracing
  chosen_korean: 포옹을 멈출 때
  alternatives_korean:
  - 포옹을 삼갈 때
  - 포옹에서 멀어질 때
  - 안기를 멈출 때
  lexicon: HALOT
  rationale: 직역의 ‘멀리하다’보다, 히브리어의 대조 구조를 현대 한국어로 자연스럽게 드러내는 ‘멈출 때’가 영어 POB의 ‘refrain from’에 더 가깝습니다.
theological_decisions:
- issue: 이 구절의 돌의 이미지가 문자적 돌과 비유적 상황을 모두 열어 두는지 여부
  chosen_reading: 본문은 문자적 ‘돌을 던지고/모으는’ 이미지를 그대로 살리되, 해석의 여지는 주석이 아니라 번역 본문 자체에서는 닫지 않았습니다.
  alternative_readings:
  - 농경·건축 맥락의 돌 모으기
  - 관계·전쟁의 비유적 의미
  rationale: 영어 POB 주석이 지적하듯 히브리어 이미지는 문자적으로도 읽히고 비유적으로도 읽힐 수 있으므로, 번역은 원문 이미지를 유지하고 해석은 열어 두는 것이 가장 충실합니다.
  doctrine_reference: 전도서의 지혜문학적 다의성 보존
