source:
  edition: WLC
  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י עַל דִּבְרַת֙ בְּנֵ֣י הָ/אָדָ֔ם לְ/בָרָ֖/ם הָ/אֱלֹהִ֑ים וְ/לִ/רְא֕וֹת שְׁ/הֶם בְּהֵמָ֥ה הֵ֖מָּה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/018.yaml
  text: I said in my heart concerning the sons of man, that God is testing them, and to show them that they themselves are beasts.
  footnotes:
  - marker: a
    text: Or 'human beings' for 'the sons of man'; Hebrew uses a masculine expression with representative force.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'and to see'; the clause may also be understood as 'and to let them see' or 'and to see that they themselves are beasts.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 내 마음속으로 사람의 자손들에 관하여 말했습니다. 하나님이 그들을 시험하시며, 그들이 자기들 자신이 짐승임을 보게 하시려고 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 자손들’은 히브리어의 남성형 대표 표현을 살린 번역입니다. 더 포괄적으로는 ‘인간들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘보고/보게 하려고’입니다. 문맥상 ‘보게 하시려고’로 옮겼지만, 더 직역하면 ‘그들을 보시려고’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  english_pob_choice: I said in my heart
  chosen_korean: 나는 내 마음속으로 말했습니다
  alternatives_korean:
  - 나는 속으로 말했습니다
  - 나는 내 마음에 말했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 내적 성찰을 가리키므로, 한국어에서는 자연스럽게 ‘내 마음속으로’로 옮기되 반성적 독백의 느낌을 살렸습니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 자손들
  alternatives_korean:
  - 인생들
  - 인간들
  - 사람의 아들들
  lexicon: HALOT
  rationale: 원문의 남성형 표현과 대표성을 유지하면서도 한국어에서 지나치게 낯선 직역을 피하기 위해 ‘사람의 자손들’로 옮겼습니다.
- source_word: לְבָרָם הָאֱלֹהִים
  english_pob_choice: God is testing them
  chosen_korean: 하나님이 그들을 시험하시며
  alternatives_korean:
  - 하나님이 그들을 검증하시며
  - 하나님이 그들을 단련하시며
  - 하나님이 그들을 입증하시며
  lexicon: HALOT
  rationale: בָּרַר 계열의 의미를 문맥에 맞게 ‘시험하다’로 옮겼습니다. ‘단련하다’보다 시험의 성격이 더 직접적입니다.
- source_word: וְלִרְאוֹת
  english_pob_choice: and to show them
  chosen_korean: 그리고 그들이 보게 하시려고
  alternatives_korean:
  - 그들에게 보이시려고
  - 그리고 그들에게 보여 주시려고
  - 그리고 그들이 알게 하시려고
  lexicon: HALOT
  rationale: 히브리어는 형식상 ‘보다’이지만 문맥상 결과/목적을 나타내므로, 한국어에서는 ‘보게 하시려고’로 풀어 자연스럽게 목적절을 드러냈습니다.
- source_word: שֶׁהֵם בְּהֵמָה הֵמָּה
  english_pob_choice: that they themselves are beasts
  chosen_korean: 그들이 자기들 자신이 짐승임을
  alternatives_korean:
  - 그들이 짐승들임을
  - 그들이 짐승과 같음을
  - 그들 자신이 짐승임을
  lexicon: HALOT
  rationale: 원문의 직접 진술과 강조 대명사를 살려 ‘자기들 자신’으로 강조를 반영했습니다. ‘짐승과 같다’는 비교로 약화되므로 피했습니다.
theological_decisions:
- issue: 인간과 짐승의 직접 비교를 완화할지 여부
  chosen_reading: 본문의 거친 진술을 그대로 살려, 인간이 ‘짐승과 같다’가 아니라 ‘짐승임’을 보게 하시는 것으로 옮겼습니다.
  alternative_readings:
  - 그들이 짐승과 같음을 보게 하시려고
  - 그들이 동물과 같음을 알게 하시려고
  rationale: 전도서는 인간의 유한성과 죽음 앞에서의 동물성과 같은 처지를 강조합니다. 이 긴장을 부드럽게 만들지 않기 위해 원문의 직접성을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
