base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/019.yaml
  text: 'For the fate of the sons of man and the fate of the beast is one fate for them: as this one dies[a], so dies that one, and one breath is for all. Man has no advantage over the beast, for all is vapor.'
  footnotes:
  - marker: a
    text: Or 'one spirit is for all.' The Hebrew word רוּחַ can mean 'breath,' 'wind,' or 'spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 사람의 자손들의 fate와 짐승의 fate가 그들에게는 하나의 fate이기 때문입니다. 이 죽음이 죽듯이 저도 죽고, 모든 것에는 한 호흡이 있습니다. 사람은 짐승보다 이로움이 없으니, 모든 것이 수증기와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 것에 한 영이 있습니다.' 히브리어 רוּחַ는 '호흡', '바람', '영'을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרֶה
  english_pob_choice: fate
  chosen_korean: fate
  alternatives_korean:
  - 운명
  - 일어남
  - 사건
  lexicon: HALOT
  rationale: 전도서에서 מִקְרֶה는 인간과 짐승에게 공통으로 닥치는 죽음의 귀결을 가리키므로, 이를 해설적으로 풀기보다 영어 POB의 'fate'를 그대로 차용해 동일한 존재론적 뉘앙스를 유지했습니다.
- source_word: בְנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 자손들
  alternatives_korean:
  - 인자들의
  - 인간들의
  - 사람의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 대표 복수 표현을 보존하되, 한국어에서 자연스럽고 직역에 가까운 '사람의 자손들'로 옮겨 형식과 의미를 함께 살렸습니다.
- source_word: רוּחַ
  english_pob_choice: breath
  chosen_korean: 호흡
  alternatives_korean:
  - 영
  - 바람
  - 숨
  lexicon: HALOT
  rationale: 문맥이 인간과 짐승의 공동한 죽음을 논하므로, 존재론적 '영'보다 생명 호흡의 뜻이 분명한 '호흡'이 가장 적절합니다.
- source_word: מוֹתַר
  english_pob_choice: advantage
  chosen_korean: 이로움
  alternatives_korean:
  - 유익
  - 우위
  - 이점
  lexicon: HALOT
  rationale: 비교문에서 אדם이 짐승보다 갖는 '무엇의 이득'을 말하므로, '이로움이 없다'가 현대 한국어에서 가장 자연스럽고 간결합니다.
- source_word: הָבֶל
  english_pob_choice: vapor
  chosen_korean: 수증기
  alternatives_korean:
  - 허무
  - 안개
  - 입김
  lexicon: HALOT
  rationale: 전도서의 핵심 은유인 הבל을 전통적 '허무'로 평탄화하지 않고, 덧없고 잡히지 않는 물질적 이미지로서 '수증기'를 택해 은유성을 살렸습니다.
theological_decisions:
- issue: רוּחַ를 '영'으로 볼지 '호흡'으로 볼지
  chosen_reading: 호흡
  alternative_readings:
  - 영
  - 바람
  rationale: 이 절은 인간과 짐승의 공통된 죽음과 유한성을 관찰적으로 진술하므로, 인간 영혼론을 미리 결론짓는 '영'보다 본문이 직접 말하는 생명 호흡의 의미를 유지해야 합니다.
  doctrine_reference: 본문이 허용하는 긴장을 보존하고, 인간과 짐승의 공통 유한성을 우선 드러냄.
- issue: הָבֶל의 번역을 전통적 '허무'로 고정할지
  chosen_reading: 수증기
  alternative_readings:
  - 허무
  - 헛됨
  - 입김
  rationale: 전도서의 הבל은 단순한 감정적 허무보다 덧없음과 잡히지 않음을 가리키는 비유적 표현이므로, 그 이미지를 살려 독자가 본문의 관찰적·시적 힘을 느끼도록 했습니다.
  doctrine_reference: 전도서의 הבל 은유를 과도하게 해석하지 않고 시적 긴장을 보존함.
