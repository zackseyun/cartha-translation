base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/004.yaml
  text: A time to weep[a], and a time to laugh; a time to mourn[b], and a time to dance.
  footnotes:
  - marker: a
    text: Or 'a season' throughout the verse.
    reason: lexical_alternative
  - marker: b
    text: '''Mourn'' may also be rendered ''lament,'' especially in contexts of formal mourning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 울 때[a]가 있고 웃을 때가 있으며, 애도할[b] 때가 있고 춤출 때가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절 전체에서 ‘때’는 ‘시기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘애도하다’는 특히 장례와 관련하여 ‘애곡하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  english_pob_choice: a time
  chosen_korean: 때
  alternatives_korean:
  - 시기
  - 계절
  lexicon: HALOT
  rationale: עֵת는 문맥상 특정한 ‘때/기회’를 가리키므로, 반복 구조를 살린 ‘때’가 가장 직접적이고 자연스럽습니다. ‘계절’은 영어 POB 각주가 인정한 대안이지만 여기서는 시적 병렬을 해치지 않는 ‘때’를 택했습니다.
- source_word: לִבְכּוֹת
  english_pob_choice: to weep
  chosen_korean: 울다
  alternatives_korean:
  - 통곡하다
  - 눈물 흘리다
  lexicon: HALOT
  rationale: בכה는 기본적으로 ‘울다/우는’ 뜻이므로, 시적이면서도 직역성을 유지하는 ‘울다’가 مناسب합니다. 영어 POB의 ‘weep’과도 가장 가깝게 대응합니다.
- source_word: סְפוֹד
  english_pob_choice: to mourn
  chosen_korean: 슬퍼하다
  alternatives_korean:
  - 애도하다
  - 애통하다
  - 곡하다
  lexicon: HALOT
  rationale: ספד는 장례 맥락의 애도·곡하는 행위를 가리키지만, 현대 한국어에서 과도하게 의례적이거나 고어적인 표현을 피하면서도 감정적 중량을 살리기 위해 ‘슬퍼하다’를 택했습니다. 영어 POB가 ‘mourn’으로 잡은 일반적 애도 의미를 반영합니다.
- source_word: רְקוֹד
  english_pob_choice: to dance
  chosen_korean: 춤추다
  alternatives_korean:
  - 무도하다
  - 춤을 추다
  lexicon: HALOT
  rationale: רקד는 단순히 ‘춤추다’라는 뜻이므로, 목록의 동사형 병렬을 살리는 ‘춤추다’가 가장 자연스럽습니다.
