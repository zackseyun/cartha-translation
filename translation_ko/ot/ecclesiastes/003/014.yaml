id: ECC.3.14
reference: Ecclesiastes 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָדַ֗עְתִּי כִּ֠י כָּל אֲשֶׁ֨ר יַעֲשֶׂ֤ה הָ/אֱלֹהִים֙ ה֚וּא יִהְיֶ֣ה לְ/עוֹלָ֔ם עָלָי/ו֙ אֵ֣ין לְ/הוֹסִ֔יף וּ/מִמֶּ֖/נּוּ אֵ֣ין לִ/גְרֹ֑עַ וְ/הָ/אֱלֹהִ֣ים עָשָׂ֔ה שֶׁ/יִּֽרְא֖וּ מִ/לְּ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/014.yaml
  text: I know that whatever God does will endure forever; there is nothing to add to it[a], and there is nothing to take from it. God has done it so that they may fear before him.
  footnotes:
  - marker: a
    text: Or 'so that they may stand in awe before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 아는 것은 하나님께서 행하시는 것은 무엇이든 영원히 남는다는 것입니다. 거기에 더할 것은 없고, 거기에서 뺄 것도 없습니다. 하나님께서 그렇게 하신 것은 사람들이 그분 앞에서 두려워하게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분 앞에 경외하며 서게 하려는 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 내가 아는 것은
  alternatives_korean:
  - 나는 압니다
  - 내가 깨달은 것은
  - 내가 알게 된 것은
  lexicon: HALOT
  rationale: 완료형의 확정된 인식을 한국어에서는 앞절 화제화 구조로 풀어, 현재적 확신과 문장 흐름을 자연스럽게 살렸습니다.
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים
  english_pob_choice: whatever God does
  chosen_korean: 하나님께서 행하시는 것은 무엇이든
  alternatives_korean:
  - 하나님이 하시는 모든 것
  - 하나님께서 하시는 일은 모두
  lexicon: HALOT
  rationale: כָּל + אֲשֶׁר의 보편성을 ‘무엇이든’으로 살리고, 행위 동사를 ‘행하시는’으로 맞추어 문맥의 포괄성을 유지했습니다.
- source_word: עָלָיו אֵין לְהוֹסִיף / וּמִמֶּנּוּ אֵין לִגְרֹעַ
  english_pob_choice: there is nothing to add to it / there is nothing to take from it
  chosen_korean: 거기에 더할 것은 없고, 거기에서 뺄 것도 없습니다
  alternatives_korean:
  - 거기에 더할 수 있는 것이 없고, 거기에서 뺄 수 있는 것도 없습니다
  - 그것에 더할 것이 없고 그에서 뺄 것이 없습니다
  lexicon: HALOT
  rationale: ‘더하다/빼다’는 히브리어의 추가·감소 금지를 한국어 관용으로 직접 드러내며, 대상 지시를 ‘거기’로 받아 앞절의 하나님의 행하심을 자연스럽게 연결했습니다.
- source_word: מִלְּפָנָיו
  english_pob_choice: before him
  chosen_korean: 그분 앞에서
  alternatives_korean:
  - 그분의 앞에서
  - 그분의 임재 앞에서
  - 그분 앞에
  lexicon: HALOT
  rationale: 직역적 ‘얼굴’ 이미지는 한국어에서 어색하므로, 관계적 위치를 나타내는 ‘앞에서’로 옮겨 מקור의 관용구를 보존했습니다.
theological_decisions:
- issue: יְרָא의 번역에서 'fear'의 긴장 유지
  chosen_reading: ‘두려워하게 하려는 것입니다’로 옮겨 경외로 완화하지 않았습니다.
  alternative_readings:
  - 경외하게 하려는 것입니다
  - 그분을 두려워하며 섬기게 하려는 것입니다
  rationale: 전도서의 하나님 언어가 지닌 긴장을 해소하지 않기 위해, 핵심 의미인 두려움을 그대로 살렸습니다. 경외는 포함될 수 있지만 본문이 요구하는 직접성은 약해집니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
