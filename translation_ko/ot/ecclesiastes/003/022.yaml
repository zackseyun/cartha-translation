id: ECC.3.22
reference: Ecclesiastes 3:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵ/אֲשֶׁ֨ר יִשְׂמַ֤ח הָ/אָדָם֙ בְּֽ/מַעֲשָׂ֔י/ו כִּי ה֖וּא חֶלְק֑/וֹ כִּ֣י מִ֤י יְבִיאֶ֨/נּוּ֙ לִ/רְא֔וֹת בְּ/מֶ֖ה שֶׁ/יִּהְיֶ֥ה אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/022.yaml
  text: So I saw that there is nothing better than that a man should rejoice in his works[a], for that is his portion. For who can bring him to see what will be after him?
  footnotes:
  - marker: a
    text: Or, 'what will happen after he is gone.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 사람이 자기의 일들로 기뻐하는 것보다 더 나은 것은 없다고 보았습니다. 그것이 그의 몫이기 때문입니다. 누가 그에게 자기 뒤에 올 것을 보게 할 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 떠난 뒤에 어떤 일이 일어날지.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  english_pob_choice: So I saw
  chosen_korean: 그래서 나는 … 보았습니다
  alternatives_korean:
  - 그리고 나는 … 보았습니다
  - 그러므로 나는 … 보았습니다
  lexicon: HALOT
  rationale: 관찰에서 결론으로 나아가는 흐름을 살려 '그래서'를 두고, 평서형 '보았습니다'로 전도서의 성찰적 화법을 자연스럽게 옮겼습니다.
- source_word: אֵין טוֹב מֵאֲשֶׁר
  english_pob_choice: there is nothing better than that
  chosen_korean: 더 나은 것은 없다고
  alternatives_korean:
  - 그것보다 더 좋은 것은 없다고
  - 더 좋은 것은 없다고
  lexicon: HALOT
  rationale: '''אין טוב מ''의 비교적 평가를 한국어의 ''더 나은 것은 없다''로 옮겨, 절대적 도덕 판단처럼 들리지 않게 하면서도 전도서 특유의 평가 어조를 보존했습니다.'
- source_word: הָאָדָם
  english_pob_choice: a man
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 인간이
  lexicon: HALOT
  rationale: 여기서는 대표적 단수의 일반 진술이므로, 현대 한국어에서 성별 편향을 강하게 드러내지 않는 '사람'으로 옮겨 원문의 보편적 적용 범위를 살렸습니다.
- source_word: בְּמַעֲשָׂיו
  english_pob_choice: in his works
  chosen_korean: 자기의 일들로
  alternatives_korean:
  - 자기의 일에서
  - 자기의 수고에서
  - 자기가 한 일들로
  lexicon: HALOT
  rationale: מַעֲשֶׂה의 활동/일의 폭을 살리면서 전도서의 '행위·수고' 맥락을 반영해, 결과 상태보다 행위의 범위를 드러내는 '일들로'를 택했습니다.
- source_word: חֶלְקוֹ
  english_pob_choice: his portion
  chosen_korean: 그의 몫
  alternatives_korean:
  - 그의 분깃
  - 그의 몫과 분량
  - 그의 몫입니다
  lexicon: HALOT
  rationale: '''portion''의 운명적·배당된 몫이라는 뜻을 한국어의 ''몫''으로 간결하게 살렸고, 전도서의 삶의 몫이라는 주제를 보존했습니다.'
- source_word: בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו
  english_pob_choice: what will be after him
  chosen_korean: 자기 뒤에 올 것을
  alternatives_korean:
  - 그 뒤에 무엇이 있을지를
  - 자기가 떠난 뒤에 있을 것을
  lexicon: HALOT
  rationale: 직역의 어순을 다소 풀되, 'after him'의 시간적·존재적 여운을 살려 '자기 뒤에 올 것'으로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 일반적 단수 표현을 한국어에서 어떻게 처리할지
  chosen_reading: 사람이
  alternative_readings:
  - 한 사람이
  - 인간이
  rationale: 원문은 남성 단수형이지만 대표적 일반 진술이므로, 한국어에서는 자연스럽고 보편적인 '사람이'로 옮겨 성별 표지를 불필요하게 강화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
