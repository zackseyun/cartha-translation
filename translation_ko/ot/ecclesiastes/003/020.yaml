id: ECC.3.20
reference: Ecclesiastes 3:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/כֹּ֥ל הוֹלֵ֖ךְ אֶל מָק֣וֹם אֶחָ֑ד הַ/כֹּל֙ הָיָ֣ה מִן הֶֽ/עָפָ֔ר וְ/הַ/כֹּ֖ל שָׁ֥ב אֶל הֶ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/020.yaml
  text: All go to one place[a]. All came from the dust[b], and all return to the dust.
  footnotes:
  - marker: a
    text: Or 'All was from the dust.' The Hebrew more literally reads 'all was from the dust,' but 'came from the dust' expresses the sense of origin more naturally in English.
    reason: lexical_alternative
  - marker: b
    text: '''The dust'' echoes humanity''s mortality and recalls Genesis 3:19.'
    reason: cross_reference
translation:
  language: ko
  text: 모든 것은 한 곳으로 갑니다[a]. 모든 것은 흙에서 왔고[b], 모든 것은 흙으로 돌아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 것은 한 곳으로 갑니다.’ 히브리어는 ‘모든 것은 한 곳으로 갑니다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흙’은 인간의 죽음과 유한성을 드러내며, 창세기 3:19를 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַכֹּל
  english_pob_choice: All
  chosen_korean: 모든 것은
  alternatives_korean:
  - 모두
  - 모든 것들이
  lexicon: WLC
  rationale: 반복되는 הַכֹּל의 포괄성을 살리되, 한국어에서는 주어-서술 구조로 풀어 읽는 것이 자연스러워 ‘모든 것은’으로 옮겼습니다.
- source_word: הוֹלֵךְ אֶל מָקוֹם אֶחָד
  english_pob_choice: go to one place
  chosen_korean: 한 곳으로 갑니다
  alternatives_korean:
  - 한 곳으로 갑니다
  - 한 곳으로 가고 있습니다
  - 같은 곳으로 갑니다
  lexicon: WLC
  rationale: 직역적인 ‘한 곳’과 ‘갑니다’를 사용해 보편적 현재 진술을 살리면서, 영어 POB의 간결한 의미도 자연스럽게 반영했습니다.
- source_word: הָיָה מִן הֶעָפָר
  english_pob_choice: came from the dust
  chosen_korean: 흙에서 왔고
  alternatives_korean:
  - 흙에서 있었습니다
  - 흙에서 비롯되었고
  - 흙에서 나왔고
  lexicon: WLC
  rationale: 히브리어는 문자적으로 ‘흙으로부터 있었습니다’에 가깝지만, 한국어에서는 기원을 드러내는 ‘흙에서 왔고’가 의미를 가장 분명하고 자연스럽게 전달합니다.
- source_word: הֶעָפָר
  english_pob_choice: the dust
  chosen_korean: 흙
  alternatives_korean:
  - 먼지
  - 티끌
  - 흙먼지
  lexicon: WLC
  rationale: 문맥상 창세기 3:19를 떠올리게 하는 죽음과 유한성의 표지를 유지하기 위해, 관용적이면서도 성경적 뉘앙스가 있는 ‘흙’을 택했습니다.
theological_decisions:
- issue: ‘모든 것’의 범위와 죽음의 보편성
  chosen_reading: 이 절은 전후 문맥에서 인간과 짐승이 공유하는 죽음의 운명을 말하며, 그 이상을 단정하지 않습니다.
  alternative_readings:
  - 인간만을 일반화해 말한다
  - 죽음 이후의 차이를 부정한다
  rationale: 전도서 3:18–21의 흐름은 보편적 죽음을 관찰하는 것이므로, 본문이 말하는 범위를 넘어서 영혼이나 내세 교리를 해소하지 않도록 유지했습니다.
  doctrine_reference: 본문이 드러내는 긴장을 보존해야 합니다.
