theological_decisions:
- issue: אַשְׁרֵי의 평가성
  chosen_reading: ‘행복하여라’는 하나님의 직접 축복 선언이라기보다, 지혜문학적 관찰로서 번영한 상태를 묘사하는 감탄으로 처리했습니다.
  alternative_readings:
  - ‘복되도다’로 더 축복 선언처럼 읽는 방식
  - ‘복되어라’로 명령/축원처럼 읽는 방식
  rationale: 문맥은 왕권과 통치의 질서가 잘 갖춰진 공동체의 복됨을 말하므로, 신적 축복 선포로 과도하게 신학화하지 않는 것이 원문에 가깝습니다.
  doctrine_reference: 지혜문학의 복/행복 표현
- issue: בִּגְבוּרָה וְלֹא בַשְּׁתִי의 윤리적 대비
  chosen_reading: ‘힘을 위해서이지 술취함을 위해서가 아니다’로 번역해, 식사의 목적이 절제와 생명력에 있음을 드러냈습니다.
  alternative_readings:
  - ‘마시기 위해서가 아니라’처럼 더 직역하는 방식
  - ‘기력을 위해서이지 취하려는 것이 아니다’로 완화하는 방식
  rationale: 대조의 핵심은 먹는 행위 자체가 아니라 탐닉과 절제의 대비이므로, ‘술취함’으로 부정적 결과를 분명히 드러내는 것이 문맥상 적절합니다.
  doctrine_reference: 절제와 통치의 지혜
