  source_fidelity: 히브리어의 두 일반적 분사 주어와 결과를 충실히 반영합니다. ‘구덩이를 파는 사람은 거기에 빠지고’는 חֹפֵר גּוּמָּץ בּוֹ יִפּוֹל을, ‘담을 허무는 사람은 뱀에게 물립니다’는 וּפֹרֵץ גָּדֵר יִשְּׁכֶנּוּ נָחָשׁ을 자연스럽게 옮깁니다. 한국어의 피동 표현은 히브리어에서 뱀이 행위 주체인 문장을 의미 손실 없이 표현합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽고, 잠언적·일반적 결과를 나타내는 현재형 ‘빠지고/물립니다’도 적절합니다. ‘담을 허무는’은 경계 담을 파괴하거나 뚫는 행위를 포괄적으로 나타낼 수 있습니다.
  terminology: ‘구덩이’, ‘담’, ‘뱀’은 문맥과 현대 한국어에 잘 맞습니다. 각주도 גָּדֵר가 경계용 담장 또는 돌담을 가리킬 수 있음을 적절히 설명합니다.
