  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֹפֵ֥ר גּוּמָּ֖ץ בּ֣/וֹ יִפּ֑וֹל וּ/פֹרֵ֥ץ גָּדֵ֖ר יִשְּׁכֶ֥/נּוּ נָחָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/008.yaml
  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
  footnotes:
  - marker: a
    text: Or 'a serpent will bite him.'
    reason: lexical_alternative
  - marker: b
    text: '''Wall'' may also be understood as a boundary fence, likely a stone enclosure wall in the ancient setting.'
    reason: cultural_note
translation:
  language: ko
  text: 구덩이를 파는 사람은 거기에 빠지고, 담을 허무는 사람은 뱀에게 물립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘담’은 경계용 담장이나 돌담으로도 이해할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֹפֵר
  english_pob_choice: Whoever digs
  chosen_korean: 구덩이를 파는 사람은
  alternatives_korean:
  - 누구든지 파는 사람은
  - 파는 자는
  lexicon: HALOT
  rationale: 분사형 일반 주어를 한국어의 자연스러운 보편적 표현으로 옮겼습니다.
- source_word: גּוּמָּץ
  english_pob_choice: a pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 구멍
  - 함정
  lexicon: HALOT
  rationale: 지혜문학의 경구에서 가장 자연스럽고, 파 놓은 구덩이의 함의를 잘 드러냅니다.
- source_word: גָּדֵר
  english_pob_choice: a wall
  chosen_korean: 담
  alternatives_korean:
  - 울타리
  - 벽
  lexicon: HALOT
  rationale: 해당 어휘는 경계용 담이나 돌담까지 포괄할 수 있으므로, 한국어에서는 경계 구조를 살리는 '담'이 가장 무난합니다.
- source_word: יִשְּׁכֶנּוּ
  english_pob_choice: will be bitten by a snake
  chosen_korean: 뱀에게 물립니다
  alternatives_korean:
  - 뱀이 그를 물 것입니다
  - 뱀에 물립니다
  lexicon: HALOT
  rationale: 히브리어의 결과를 자연스러운 피동 표현으로 옮겨, 누구에게 벌어지는 일인지 분명하게 했습니다.
