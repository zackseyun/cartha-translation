  text: 구덩이를 파는 사람은 거기에 빠지고, 담을 허무는 사람은 뱀에게 물립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘담’은 경계용 담장이나 돌담으로도 이해할 수 있습니다.
    reason: cultural_note
