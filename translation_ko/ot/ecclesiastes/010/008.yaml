  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
  footnotes:
  - marker: a
    text: Or 'a serpent will bite him.'
    reason: lexical_alternative
  - marker: b
    text: '''Wall'' may also be understood as a boundary fence, likely a stone enclosure wall in the ancient setting.'
    reason: cultural_note
translation:
