id: ECC.10.4
reference: Ecclesiastes 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם ר֤וּחַ הַ/מּוֹשֵׁל֙ תַּעֲלֶ֣ה עָלֶ֔י/ךָ מְקוֹמְ/ךָ֖ אַל תַּנַּ֑ח כִּ֣י מַרְפֵּ֔א יַנִּ֖יחַ חֲטָאִ֥ים גְּדוֹלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/004.yaml
  text: If the ruler’s anger rises against you[a], do not leave your place[d][c][b], for calmness lays great offenses to rest.
  footnotes:
  - marker: a
    text: Or 'the ruler’s spirit' or 'the ruler’s temper.' The Hebrew word רוּחַ literally means 'spirit' or 'wind' and here likely refers to an angry disposition.
    reason: lexical_alternative
  - marker: b
    text: Literally 'your place.'
    reason: lexical_alternative
  - marker: c
    text: Or 'healing' or 'gentleness.' The Hebrew noun מַרְפֵּא carries the idea of a soothing or healing response.
    reason: lexical_alternative
  - marker: d
    text: Or 'great sins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 통치자의 진노가 당신에게 미치거든, 당신의 자리를 떠나지 마십시오. 차분함이 큰 죄과들을 쉬게 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치자의 영’ 혹은 ‘통치자의 성미’로도 옮길 수 있습니다. 히브리어 רוּחַ는 문자적으로 ‘영’ 또는 ‘바람’을 뜻하며, 여기서는 분노한 기질을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 자리’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘치유’ 혹은 ‘온유함’으로도 옮길 수 있습니다. 히브리어 מַרְפֵּא는 누그러뜨리고 회복시키는 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘큰 죄들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ הַמּוֹשֵׁל
  english_pob_choice: the ruler’s anger
  chosen_korean: 통치자의 진노
  alternatives_korean:
  - 통치자의 영
  - 통치자의 성미
  - 통치자의 분노
  lexicon: HALOT
  rationale: רוּחַ는 문자적으로 ‘영/바람’이지만, 여기서는 통치자에게서 터져 나오는 감정적 격앙을 가리키므로 문맥상 ‘진노’가 가장 자연스럽고 원문 의도를 잘 드러냅니다.
- source_word: תַּעֲלֶה עָלֶיךָ
  english_pob_choice: rises against you
  chosen_korean: 당신에게 미치거든
  alternatives_korean:
  - 당신에게 솟아오르거든
  - 당신을 향해 일어나거든
  - 당신을 거슬러 오르거든
  lexicon: HALOT
  rationale: ‘올라가다/오르다’와 ‘~위에’의 결합을 한국어에서는 감정이나 위협이 ‘미치다’로 옮길 수 있어, 적대적 접근과 압박의 뉘앙스를 간결하게 살렸습니다.
- source_word: מְקוֹמְךָ
  english_pob_choice: your place
  chosen_korean: 당신의 자리
  alternatives_korean:
  - 당신의 위치
  - 당신의 직분
  - 당신의 처소
  lexicon: HALOT
  rationale: 본문의 문자적 의미는 ‘당신의 장소’이지만, 통치자 아래에서의 처지를 말하는 문맥이므로 ‘자리’가 지나치게 설명적이지 않으면서도 자연스럽습니다.
- source_word: מַרְפֵּא
  english_pob_choice: calmness
  chosen_korean: 차분함
  alternatives_korean:
  - 치유
  - 온유함
  - 평온
  lexicon: HALOT
  rationale: 이 명사는 ‘치유/완화/진정’의 뜻을 가지며, 여기서는 긴장을 누그러뜨리는 반응을 가리키므로 ‘차분함’이 가장 적절합니다.
- source_word: חֲטָאִים גְּדוֹלִים
  english_pob_choice: great offenses
  chosen_korean: 큰 죄과들
  alternatives_korean:
  - 큰 죄들
  - 심각한 잘못들
  - 큰 허물들
  lexicon: HALOT
  rationale: POB의 ‘offenses’는 단순한 범법보다 관계적·도덕적 잘못을 넓게 가리키므로, ‘죄과’가 무게를 살리면서도 ‘죄들’보다 덜 교회식입니다.
theological_decisions:
- issue: 마지막 절의 도덕적 강도
  chosen_reading: ‘큰 죄과들’로 옮겨, 단순한 예의범절이 아니라 실제로 큰 잘못이 누그러질 수 있다는 지혜 문장의 경고를 살렸습니다.
  alternative_readings:
  - ‘큰 죄들’
  - ‘심각한 잘못들’
  rationale: 히브리어 חֲטָאִים는 지혜문맥에서 단순한 신학 용어보다 실제적 잘못까지 포괄할 수 있어, 문맥상 ‘죄과’가 가장 균형적입니다.
  doctrine_reference: 지혜서의 실천적 윤리와 죄의 현실성
