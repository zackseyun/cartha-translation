id: ECC.10.14
reference: Ecclesiastes 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/סָּכָ֖ל יַרְבֶּ֣ה דְבָרִ֑ים לֹא יֵדַ֤ע הָ/אָדָם֙ מַה שֶׁ/יִּֽהְיֶ֔ה וַ/אֲשֶׁ֤ר יִֽהְיֶה֙ מֵֽ/אַחֲרָ֔י/ו מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/014.yaml
  text: And the fool multiplies words[a]. A man does not know what will be[b], and who can tell him what will be after him?
  footnotes:
  - marker: a
    text: Or, 'Man does not know' or 'Humankind does not know.' The Hebrew has the singular הָאָדָם, a representative singular for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or, 'what will happen after him' or 'what will be after he is gone.' The Hebrew may refer to what comes after a person in time, especially after his life.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 자는 말을 많이 합니다. 사람은 자기 뒤에 무엇이 있을지 알지 못하며, 누가 그에게 그 뒤에 무엇이 있을지 말해 주겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 הָאָדָם은 단수형이지만, 여기서는 특정한 한 사람이 아니라 인류를 대표하는 단수로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''그 뒤에 무엇이 있을지''는 그 사람의 생애 이후에 무엇이 일어날지라는 뜻으로도 읽을 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַסָּכָל
  english_pob_choice: And the fool
  chosen_korean: 어리석은 자는
  alternatives_korean:
  - 그리고 어리석은 자는
  - 어리석은 사람은
  - 미련한 자는
  lexicon: HALOT
  rationale: הַסָּכָל은 특정한 어리석은 인물을 가리키는 정관 명사로 보이며, 한국어에서는 표준적이고 직설적인 '어리석은 자'가 가장 잘 대응합니다. 문맥상 접속사 וְ는 단순 연결로 보고 자연스러운 문장 흐름을 위해 생략했습니다.
- source_word: יַרְבֶּה דְבָרִים
  english_pob_choice: multiplies words
  chosen_korean: 말을 많이 합니다
  alternatives_korean:
  - 말을 늘립니다
  - 말을 쏟아 냅니다
  - 말이 많습니다
  lexicon: HALOT
  rationale: '''말을 많이 하다''는 히브리어의 ''말을 많이 늘이다/증가시키다''라는 관용적 표현을 현대 한국어로 자연스럽게 옮긴 것입니다. 원문의 이미지인 ''말의 과다''를 과도하게 도식화하지 않도록 했습니다.'
- source_word: לֹא יֵדַע הָאָדָם
  english_pob_choice: A man does not know
  chosen_korean: 사람은 … 알지 못하며
  alternatives_korean:
  - 인간은 … 알지 못하며
  - 누구도 … 알지 못하며
  - 사람이 … 알지 못하며
  lexicon: HALOT
  rationale: הָאָדָם은 대표 단수로서 보편적 인간을 가리키므로, 한국어에서는 젠더 한정이 덜한 '사람'이 가장 자연스럽습니다. 영어 POB의 각주가 지적하듯 의미는 개별 남성이 아니라 인류 일반입니다.
- source_word: מַה שֶׁיִּהְיֶה
  english_pob_choice: what will be
  chosen_korean: 무엇이 있을지
  alternatives_korean:
  - 무엇이 될지
  - 무슨 일이 일어날지
  - 무엇이 있게 될지
  lexicon: HALOT
  rationale: '''what will be''는 단순한 미래를 넘어 앞으로 닥칠 현실 전체를 가리킬 수 있어, 한국어에서는 ''무엇이 있을지''가 가장 포괄적이면서도 직역에 가깝습니다.'
- source_word: וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו
  english_pob_choice: what will be after him
  chosen_korean: 그 뒤에 무엇이 있을지
  alternatives_korean:
  - 그가 떠난 뒤에 무엇이 있을지
  - 그 후에 무엇이 있을지
  - 그에게 이어질 것이 무엇인지
  lexicon: HALOT
  rationale: מֵאַחֲרָיו는 시간적·존재적 '그 뒤'를 모두 열어 두는 표현이므로, 한국어도 '그 뒤에'로 여지를 남겼습니다. POB 주석이 말하듯 그의 생애 이후를 가리킬 수 있는 모호성을 보존했습니다.
- source_word: מִי יַגִּיד לוֹ
  english_pob_choice: who can tell him
  chosen_korean: 누가 그에게 … 말해 주겠습니까
  alternatives_korean:
  - 누가 그에게 알려 주겠습니까
  - 누가 그에게 설명하겠습니까
  - 누가 그에게 고하겠습니까
  lexicon: HALOT
  rationale: נגד의 사역형은 단순 정보 전달이므로, 현대 한국어에서는 '말해 주다/알려 주다'가 가장 자연스럽습니다. 반문형을 살려 인간의 무능을 강조했습니다.
