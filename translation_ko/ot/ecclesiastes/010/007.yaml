  text: I have seen slaves on horses[c][b][a], and princes walking on the ground like slaves.
  footnotes:
  - marker: a
    text: Or 'servants' for 'slaves' (Hebrew עֲבָדִים); 'slaves' is chosen here because the verse emphasizes a stark reversal of social rank.
    reason: lexical_alternative
  - marker: b
    text: Or 'nobles' for 'princes' (Hebrew שָׂרִים), referring to people of high rank or authority.
    reason: lexical_alternative
  - marker: c
    text: Literally 'on the earth/land'; the sense here is that they are traveling unmounted, in contrast to those 'on horses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 말을 탄 종들[a]과 땅 위를[b] 종들처럼 걷는 고관들[c]을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종들’(히브리어 עֲבָדִים)은 문맥에 따라 ‘노예들’ 또는 ‘하인들’로도 옮길 수 있습니다. 여기서는 높은 신분의 사람들과 대비되는 낮은 신분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 직역하면 ‘땅/땅 위에서’입니다. 말에 타는 것과 대비되어, 타지 않고 걷는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘고관들’(히브리어 שָׂרִים)은 고위 관리, 귀족, 또는 권세 있는 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
