  rationale: 말 위와의 대비를 살리기 위해, 단순히 ‘땅에서’보다 ‘땅 위를’로 옮겨 하행 이동의 장면성을 유지했습니다.
theological_decisions:
- issue: 신분 역전의 충격을 어떻게 드러낼 것인가
  chosen_reading: 말 위의 종들과 땅 위를 걷는 고관들로, 극단적 사회 질서의 역전을 직설적으로 제시합니다.
  alternative_readings:
  - 종 대신 시종/하인으로 완화하는 읽기
  - 고관 대신 관리/지도자로 일반화하는 읽기
  rationale: 전도서는 사회적 아이러니를 과장 없이 직접 제시하므로, 완곡한 표현보다 신분 대비가 선명한 번역이 본문의 관찰 의도를 더 잘 보존합니다.
  doctrine_reference: 전도서의 지혜 문학적 현실 인식
