base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/007.yaml
  text: I have seen slaves on horses[c][b][a], and princes walking on the ground like slaves.
  footnotes:
  - marker: a
    text: Or 'servants' for 'slaves' (Hebrew עֲבָדִים); 'slaves' is chosen here because the verse emphasizes a stark reversal of social rank.
    reason: lexical_alternative
  - marker: b
    text: Or 'nobles' for 'princes' (Hebrew שָׂרִים), referring to people of high rank or authority.
    reason: lexical_alternative
  - marker: c
    text: Literally 'on the earth/land'; the sense here is that they are traveling unmounted, in contrast to those 'on horses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 말 위에 탄 종들[a]과, 땅 위를 종들처럼[b] 걷는 고관들을 보았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֲבָדִים는 문자적으로는 ‘종들’이지만, 영어 POB는 사회적 전복을 강조하여 ‘slaves’를 선택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅 위를’은 문자적으로는 ‘땅/땅바닥 위에서’에 가깝고, 말 위와의 대비를 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: שָׂרִים는 고위 관료나 유력자를 가리킬 수 있어, 문맥상 ‘고관들’로 옮겼습니다.
    reason: lexical_alternative
