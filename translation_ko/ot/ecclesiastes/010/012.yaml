  text: The words of the mouth of a wise man are gracious[a], but the lips of a fool swallow him up.
  footnotes:
  - marker: a
    text: Or 'The words from the mouth of a wise man bring favor,' with חֵן understood more concretely as 'favor' or 'grace.'
