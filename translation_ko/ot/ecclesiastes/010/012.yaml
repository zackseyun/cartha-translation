translation:
  language: ko
  text: 지혜로운 사람의 입에서 나오는 말은 은혜롭지만, 어리석은 자의 입술은 그를 삼켜 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지혜로운 사람의 입에서 나오는 말은 호의/호감을 가져온다.” חֵן을 더 구체적으로 ‘호의’나 ‘은혜’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִי
  english_pob_choice: words of the mouth of
  chosen_korean: 입에서 나오는 말
  alternatives_korean:
  - 입의 말
  - 입의 말씀
  - 말들
  lexicon: HALOT
  rationale: 히브리어의 소유/출처 결합을 직역하면 어색하므로, ‘입에서 나오는 말’로 옮겨 원문의 구체적 이미지를 살리면서도 자연스러운 한국어로 만들었습니다.
- source_word: חָכָם
  english_pob_choice: a wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 자
  - 지혜로운 사람
  - 현명한 사람
  lexicon: HALOT
  rationale: 지혜문학의 보편적 의미를 살리기 위해 ‘지혜로운 사람’으로 옮겼습니다. ‘자’보다 현대 문장에 자연스럽고, 남성형의 일반성을 무리 없이 담습니다.
- source_word: חֵן
  english_pob_choice: gracious
  chosen_korean: 은혜롭습니다
  alternatives_korean:
  - 호의적입니다
  - 호감을 줍니다
  - 은총입니다
  lexicon: HALOT
  rationale: חֵן은 단순한 평가가 아니라 말의 성격이 ‘은혜/호의’를 띤다는 뜻이므로, 형용사적으로 ‘은혜롭다’로 옮겨 원문의 의미 강도를 유지했습니다.
- source_word: תְּבַלְּעֶנּוּ
  english_pob_choice: swallow him up
  chosen_korean: 그를 삼켜 버립니다
  alternatives_korean:
  - 그를 집어삼킵니다
  - 그를 먹어 버립니다
  - 그를 삼킵니다
  lexicon: HALOT
  rationale: ‘삼키다’의 파괴적 비유를 살리되, 결과의 완결성을 드러내는 ‘-버립니다’를 더해 어리석은 말이 결국 자기 자신을 파괴한다는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 지혜로운 사람의 말이 ‘은혜롭다’는 표현의 전달
  chosen_reading: 말의 도덕적/관계적 성격이 하나님의 은혜를 닮아 사람에게 유익하고 호의를 불러일으키는 것으로 읽었습니다.
  alternative_readings:
  - 단순히 말이 ‘좋다’는 일반적 칭찬
  - 말이 듣기 좋고 부드럽다는 의미
  rationale: חֵן은 미학적 부드러움보다 더 강하게 호의와 은혜의 성격을 띠므로, 이를 약화하지 않기 위해 ‘은혜롭다’로 유지했습니다.
  doctrine_reference: 지혜문학의 언어 윤리
- issue: ‘어리석은 자의 입술은 그를 삼킨다’의 주어-목적어 긴장
  chosen_reading: 어리석은 자의 말이 결국 그 자신을 파괴한다는 자기해체적 역설로 읽었습니다.
  alternative_readings:
  - 입술이 다른 사람을 해친다
  - 어리석은 자가 자신의 말에 먹힌다
  rationale: 히브리어 문장은 입술이라는 비인격적 주어가 ‘그를’ 삼킨다고 말해, 말이 말하는 사람 자신에게 되돌아오는 역설을 강조합니다. 이를 그대로 살려 경고의 강도를 유지했습니다.
  doctrine_reference: 지혜문학의 자기파괴적 어리석음
