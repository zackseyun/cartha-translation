id: ECC.10.10
reference: Ecclesiastes 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם קֵהָ֣ה הַ/בַּרְזֶ֗ל וְ/הוּא֙ לֹא פָנִ֣ים קִלְקַ֔ל וַ/חֲיָלִ֖ים יְגַבֵּ֑ר וְ/יִתְר֥וֹן הכשיר חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/010.yaml
  text: If the iron is dull and one has not sharpened its edge[a], then he must use more strength[b]; but wisdom brings success.
  footnotes:
  - marker: a
    text: Or, 'If the iron is dull and one has not sharpened the edge, then one must exert more force; and the advantage of wisdom is that it gives success.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the iron' likely refers to an iron blade or tool, not iron in the abstract.
    reason: cultural_note
translation:
  language: ko
  text: 쇠가 무디고[a] 날을 갈지 않으면[b] 더 많은 힘을 들여야 합니다. 그러나 지혜는 성공을 가져옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘쇠’를 말하지만, 문맥상 날붙이나 도구를 가리키는 말로 이해하는 것이 자연스럽습니다.
    reason: cultural_note
  - marker: b
    text: ‘날’로 옮긴 히브리어 ‘파님’은 문자적으로는 ‘얼굴들/면들’이지만, 여기서는 도구의 작업면이나 날을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם קֵהָה הַבַּרְזֶל
  english_pob_choice: If the iron is dull
  chosen_korean: 쇠가 무뎌졌는데도
  alternatives_korean:
  - 쇠가 둔해졌는데도
  - 철이 무뎌졌는데도
  lexicon: HALOT
  rationale: ברזל은 문자적으로 ‘쇠/철’이지만, 문맥상 날붙이나 도구를 가리키므로 자연스러운 한국어로 풀어 ‘쇠’와 ‘무뎌지다’로 옮겼습니다.
- source_word: פָנִים קִלְקַל
  english_pob_choice: has not sharpened the edge
  chosen_korean: 날을 갈지 않으면
  alternatives_korean:
  - 날을 다듬지 않으면
  - 끝을 날카롭게 하지 않으면
  lexicon: HALOT
  rationale: ‘얼굴/면’의 직역보다, 도구의 작업면을 뜻하는 관용적 의미를 살려 ‘날’로 옮겼고, קלקל은 문맥상 연마·연삭의 반대인 ‘갈다’로 표현했습니다.
- source_word: וַחֲיָלִים יְגַבֵּר
  english_pob_choice: must use more strength
  chosen_korean: 더 많은 힘을 들여야 합니다
  alternatives_korean:
  - 더 큰 힘을 써야 합니다
  - 더 힘써야 합니다
  lexicon: HALOT
  rationale: חֲיָלִים은 힘/역량을 가리키며, יגבר는 그 힘을 더해야 함을 나타내므로 ‘힘을 들이다’로 옮겨 노동과 노력의 부담을 드러냈습니다.
- source_word: וְיִתְרוֹן הכשיר חָכְמָה
  english_pob_choice: but wisdom brings success
  chosen_korean: 그러나 지혜는 성공의 이득입니다
  alternatives_korean:
  - 그러나 지혜는 성공을 가져옵니다
  - 지혜의 이득은 성공입니다
  lexicon: HALOT
  rationale: יתרון은 ‘이득/유익/우위’를 뜻하고, הכשיר는 ‘유리하게 만들다, 성공하게 하다’의 의미이므로, 최종 절을 ‘지혜는 성공의 이득’으로 옮겨 지혜가 성취를 낳는 유익이라는 점을 살렸습니다.
theological_decisions:
- issue: 잠언식 결론의 관계 설정
  chosen_reading: 마지막 절은 지혜가 단순한 지식이 아니라 실제 상황에서 유익과 성취를 낳는 실천적 능력이라는 뜻으로 읽었습니다.
  alternative_readings:
  - 지혜가 일반적으로 유리함을 준다는 뜻
  - 지혜가 성공 그 자체를 보장한다는 뜻
  rationale: 전도서의 문맥에서 지혜는 추상적 덕목이 아니라 삶의 성과와 연결되는 실천적 가치로 제시되므로, 과도한 보증처럼 읽히지 않도록 ‘이득’과 ‘성공’의 관계를 유지했습니다.
  doctrine_reference: 전도서의 지혜 이해
