id: ECC.10.6
reference: Ecclesiastes 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִתַּ֣ן הַ/סֶּ֔כֶל בַּ/מְּרוֹמִ֖ים רַבִּ֑ים וַ/עֲשִׁירִ֖ים בַּ/שֵּׁ֥פֶל יֵשֵֽׁבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/006.yaml
  text: Folly is set in many high places[a], and the rich sit in a low place.
  footnotes:
  - marker: a
    text: Or 'Foolishness is placed in many exalted positions.' The Hebrew uses spatial language ('high places' / 'low place') metaphorically for social rank or office.
    reason: lexical_alternative
translation:
  language: ko
  text: 어리석음이 많은 높은 자리에 놓여 있고, 부자들은 낮은 자리에 앉아 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘많은 높은 곳’이며, 여기서 히브리어는 사회적 지위나 직분을 가리키는 공간적 비유를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתַּן
  english_pob_choice: is set
  chosen_korean: 놓여 있습니다
  alternatives_korean:
  - 세워져 있습니다
  - 배치되어 있습니다
  - 정해져 있습니다
  lexicon: HALOT
  rationale: 수동적 ‘set/placed’의 뜻을 살리면서 한국어에서 자연스럽고, agency를 과도하게 보태지 않는 표현입니다.
- source_word: הַסֶּכֶל
  english_pob_choice: folly
  chosen_korean: 어리석음
  alternatives_korean:
  - 우둔함
  - 어리석은 자
  - 어리석음/우둔함
  lexicon: HALOT
  rationale: 지혜문학의 대조 구조에서 인격화된 ‘fool’보다 추상 명사 ‘어리석음’이 원문의 뜻을 더 직접적으로 반영합니다.
- source_word: בַּמְּרוֹמִים רַבִּים
  english_pob_choice: in many high places
  chosen_korean: 많은 높은 자리에
  alternatives_korean:
  - 많은 높은 곳에
  - 많은 높은 직위에
  - 많은 높은 지위에
  lexicon: HALOT
  rationale: 공간적 높이의 은유를 보존하되, POB의 주석처럼 사회적 지위/직무를 드러내는 한국어로 옮겼습니다.
- source_word: בַּשֵּׁפֶל
  english_pob_choice: in a low place
  chosen_korean: 낮은 자리에
  alternatives_korean:
  - 낮은 곳에
  - 비천한 자리에
  - 낮은 곳
  lexicon: HALOT
  rationale: 첫 행의 ‘높은 자리’와 평행을 이루도록 ‘낮은 자리’로 옮겨 사회적 위치의 대비를 살렸습니다.
theological_decisions:
- issue: 공간 은유를 사회적/공적 지위로 옮길지 여부
  chosen_reading: ‘높은 자리’와 ‘낮은 자리’로 번역해 공간 은유를 유지하면서도, 독자가 지위와 직분의 대비로 이해할 수 있게 했습니다.
  alternative_readings:
  - ‘높은 곳’과 ‘낮은 곳’으로 더 직역하기
  - ‘높은 직위’와 ‘낮은 자리’로 더 해석적으로 옮기기
  rationale: POB의 주석이 밝히듯 이 구절은 물리적 위치보다 사회적 rank/office를 말하므로, 은유를 보존하는 범위 안에서 이해 가능한 한국어를 택했습니다.
  doctrine_reference: 지혜문학의 사회적 역전 모티프
