id: ECC.10.19
reference: Ecclesiastes 10:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/שְׂחוֹק֙ עֹשִׂ֣ים לֶ֔חֶם וְ/יַ֖יִן יְשַׂמַּ֣ח חַיִּ֑ים וְ/הַ/כֶּ֖סֶף יַעֲנֶ֥ה אֶת הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/019.yaml
  text: They make bread for laughter[a], and wine gladdens life[b], and money answers everything.
  footnotes:
  - marker: a
    text: Or 'money is the answer to everything'; the Hebrew literally says 'money answers everything.'
    reason: lexical_alternative
  - marker: b
    text: '''Bread'' here may stand for food or a meal more broadly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 웃음을 위해 빵을 만들고[a], 포도주는 삶을 기쁘게 하며[b], 돈은 모든 것에 대답합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘웃음거리로’; לִשְׂחוֹק는 목적뿐 아니라 ‘웃음거리’라는 뉘앙스로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빵’은 여기서 음식이나 식사를 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׂחוֹק
  english_pob_choice: for laughter
  chosen_korean: 웃음을 위해
  alternatives_korean:
  - 웃기 위해
  - 즐거움을 위해
  - 흥겨움을 위해
  lexicon: HALOT
  rationale: לִ는 목적을 나타내며 שְׂחוֹק는 ‘웃음’ 또는 ‘희롱/흥겨움’의 뜻입니다. ‘웃음을 위해’는 직역성을 살리면서도 한국어에서 자연스럽습니다.
- source_word: עֹשִׂים לֶחֶם
  english_pob_choice: they make bread
  chosen_korean: 빵을 만들고
  alternatives_korean:
  - 빵을 준비하고
  - 음식을 만들고
  - 잔치를 베풀고
  lexicon: HALOT
  rationale: לֶחֶם은 문자적으로 ‘빵’이지만 음식이나 식사를 넓게 가리킬 수 있습니다. 본문은 명시적 주어가 없는 일반적 진술이므로 ‘그들은’과 ‘빵을 만들고’를 유지해 히브리어의 압축성을 보존했습니다.
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  english_pob_choice: and wine gladdens life
  chosen_korean: 포도주는 삶을 기쁘게 하며
  alternatives_korean:
  - 포도주는 생명을 기쁘게 하며
  - 포도주는 삶을 즐겁게 하며
  - 포도주는 사는 이들을 기쁘게 하며
  lexicon: HALOT
  rationale: יַיִן은 ‘포도주’, יְשַׂמַּח는 ‘기쁘게 하다/즐겁게 하다’입니다. חַיִּים을 여기서는 ‘삶’으로 옮겨 잠언체 진술의 보편성을 살렸습니다.
- source_word: וְהַכֶּסֶף יַעֲנֶה אֶת הַכֹּל
  english_pob_choice: money answers everything
  chosen_korean: 돈은 모든 것에 대답합니다
  alternatives_korean:
  - 돈은 모든 것에 응답합니다
  - 돈이 모든 것에 답합니다
  - 돈이 만사를 해결합니다
  lexicon: HALOT
  rationale: כֶּסֶף는 여기서 ‘은/은화’보다 현대 한국어에서 곧장 이해되는 ‘돈’이 적절합니다. יַעֲנֶה는 문자적으로 ‘대답하다/응답하다’이므로, 의미를 너무 풀지 않고 ‘대답합니다’로 옮겨 본문의 날카로운 압축을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 단정적·역설적 어조
  chosen_reading: 본문을 그대로 단정형으로 두어, 돈이 만능이라는 통념을 설명하거나 완화하지 않았습니다.
  alternative_readings:
  - 돈은 모든 것을 해결합니다
  - 돈이야말로 모든 것에 대한 답입니다
  rationale: 전도서는 종종 관찰적이고 긴장된 진술을 유지합니다. 히브리어는 여기서 아이러니 표지를 문법적으로 분명히 표시하지 않으므로, 본문이 가진 역설을 본문 밖에서 해소하지 않는 편이 source-faithful합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
