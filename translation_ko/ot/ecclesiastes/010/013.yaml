id: ECC.10.13
reference: Ecclesiastes 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּחִלַּ֥ת דִּבְרֵי פִ֖י/הוּ סִכְל֑וּת וְ/אַחֲרִ֣ית פִּ֔י/הוּ הוֹלֵל֖וּת רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/013.yaml
  text: The beginning of the words of his mouth is foolishness[a], and the end of his speech is evil madness.
  footnotes:
  - marker: a
    text: Or 'the end of his speech is harmful madness.' The Hebrew repeats 'his mouth' literally, and רָעָה can be understood as 'evil' or more broadly 'harmful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 입의 말의 시작은 어리석음이며, 그의 말의 끝은 악한 광기입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּחִלַּת דִּבְרֵי
  english_pob_choice: the beginning of the words of
  chosen_korean: 말의 시작은
  alternatives_korean:
  - 말들의 시작은
  - 말의 첫머리는
  lexicon: HALOT
  rationale: 히브리어는 ‘말/발언’의 시작을 가리키는 구성형이므로, 자연스러운 한국어로 옮기되 ‘시작’과 ‘말’의 대응을 유지했습니다.
- source_word: פִּיהוּ
  english_pob_choice: his mouth
  chosen_korean: 그 입
  alternatives_korean:
  - 그의 입
  - 그의 말
  lexicon: HALOT
  rationale: 히브리어의 문자적 신체 표현을 살려 ‘입’을 유지했습니다. 뒤의 평행구에서도 같은 이미지를 반복하므로, 완곡한 ‘말’로만 풀지 않았습니다.
- source_word: סִכְלוּת
  english_pob_choice: foolishness
  chosen_korean: 어리석음
  alternatives_korean:
  - 우매함
  - 어리석은 짓
  lexicon: HALOT
  rationale: 지혜문학의 대비에서 일반적인 ‘어리석음’이 가장 직접적이며, 문맥상 도덕적·지적 분별의 결핍을 함께 전달합니다.
- source_word: הוֹלֵלוּת רָעָה
  english_pob_choice: evil madness
  chosen_korean: 악한 광기
  alternatives_korean:
  - 해로운 광기
  - 악한 망상
  lexicon: HALOT
  rationale: הוֹלֵלוּת는 단순한 어리석음보다 강한 광란/광기의 뉘앙스가 있어 ‘광기’로 살렸고, רָעָה는 POB의 ‘evil’에 맞춰 도덕적 강도를 유지했습니다.
theological_decisions:
- issue: The parallel line ends with a morally charged description rather than a softened practical warning.
  chosen_reading: ‘악한 광기’로 직역에 가깝게 유지해, 지혜의 대조와 윤리적 평가를 분명히 드러냈습니다.
  alternative_readings:
  - ‘해로운 광기’
  - ‘심한 어리석음’
  rationale: 본문은 단순한 무익함이 아니라 악함을 포함한 평가를 제시하므로, 이를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 지혜문학의 어리석음/의로움 대비
