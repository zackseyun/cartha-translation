id: ECC.10.3
reference: Ecclesiastes 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם בַּ/דֶּ֛רֶךְ כ/ש/ה/סכל הֹלֵ֖ךְ לִבּ֣/וֹ חָסֵ֑ר וְ/אָמַ֥ר לַ/כֹּ֖ל סָכָ֥ל הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/003.yaml
  text: Even on the road[a], when the fool walks, his heart lacks sense, and he says to everyone that he is a fool.
  footnotes:
  - marker: a
    text: Or, 'and says to everyone, “He is a fool.”' The Hebrew may be taken either as the fool exposing himself as a fool, or as him calling others fools; the former best fits the context of self-disclosing folly.
    reason: alternative_reading
translation:
  language: ko
  text: 길에서도 어리석은 자가 걸어갈 때 그의 마음에는 지혜가 없으며, 그는 모든 사람에게 자신이 어리석은 자라고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람에게 “그는 어리석은 자다”라고 말합니다.’ 히브리어는 어리석은 자가 스스로 자신의 어리석음을 드러내는 뜻으로도, 다른 사람을 어리석다고 부르는 뜻으로도 읽을 수 있으나, 문맥상 전자가 더 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Even
  chosen_korean: 길에서도
  alternatives_korean:
  - 또한
  - 더욱이
  - 심지어
  lexicon: HALOT
  rationale: 추가 관찰의 강조를 살리면서, 앞 절에 이어지는 공적 상황을 자연스럽게 한국어로 풀어 옮겼습니다.
- source_word: בַּדֶּרֶךְ
  english_pob_choice: on the road
  chosen_korean: 길에서
  alternatives_korean:
  - 도로에서
  - 길 위에서
  - 여정 중에
  lexicon: HALOT
  rationale: 직역적 공간 이미지인 ‘road’를 현대 한국어에서 가장 자연스럽게 옮겼습니다.
- source_word: לִבּוֹ חָסֵר
  english_pob_choice: his heart lacks sense
  chosen_korean: 그의 마음에는 지혜가 없으며
  alternatives_korean:
  - 그의 마음은 분별이 없으며
  - 그의 마음은 어리석으며
  - 그의 이성은 부족하며
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’은 감정보다 판단·분별의 중심을 가리키므로, 한국어 관용을 따라 의미를 분명히 하되 본문의 진술 구조는 유지했습니다.
- source_word: סָכָל הוּא
  english_pob_choice: that he is a fool
  chosen_korean: 자신이 어리석은 자라고
  alternatives_korean:
  - 그가 어리석다고
  - 자기가 바보라고
  - 그가 어리석은 사람이라고
  lexicon: HALOT
  rationale: 명사형 ‘어리석은 자’를 살려, 단순한 형용사보다 본문의 자기 노출적 뉘앙스를 더 분명히 했습니다.
theological_decisions:
- issue: 마음(לֵב)과 지혜의 결핍을 어떻게 한국어로 드러낼지
  chosen_reading: ‘마음에는 지혜가 없으며’로 옮겨, 지적·도덕적 분별의 상실을 함께 드러냈습니다.
  alternative_readings:
  - ‘마음이 어리석으며’
  - ‘생각이 없으며’
  - ‘분별이 없으며’
  rationale: 전도서는 ‘마음’을 사고와 판단의 중심으로 쓰는 경우가 많아, 단순 감정 표현으로 약화하지 않고 지혜의 부재로 번역하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 지혜문학의 인간 인식론
- issue: 마지막 구절의 의미를 자기 폭로로 읽을지, 타인을 향한 발화로 읽을지
  chosen_reading: 기본본문은 자기 폭로로 읽히도록 ‘자신이 어리석은 자라고 말합니다’로 옮겼습니다.
  alternative_readings:
  - ‘모든 사람에게 “그는 어리석은 자다”라고 말합니다’
  - ‘모든 사람에게 남들을 어리석다고 말합니다’
  rationale: 영문 POB의 주석처럼 문법상 다른 가능성이 있지만, 문맥상 어리석음이 스스로 드러나는 뜻이 더 잘 맞으므로 그 읽기를 본문에 반영했습니다.
  doctrine_reference: 문맥 우선 해석 원리
