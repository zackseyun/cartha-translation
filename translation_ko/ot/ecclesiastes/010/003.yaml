  rationale: ‘지혜’ 대신 ‘분별력’을 사용하여 히브리어의 ‘마음’이 가리키는 판단력과 חסר의 결핍 의미를 더 정확히 옮겼습니다. 마지막 절의 문법적 모호성은 본문에서 문맥상 더 자연스러운 자기 폭로 읽기를 유지하고, 대안은 각주에 보존했습니다.
