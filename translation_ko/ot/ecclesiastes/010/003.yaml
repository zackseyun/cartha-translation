review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the road-setting, the fool's walking, and the contextually preferred reading that his words disclose his own folly. However, ‘그의 마음에는 지혜가 없으며’ renders לִבּוֹ חָסֵר more specifically as a lack of ‘wisdom.’ In this idiom, לֵב concerns judgment or discernment, and חָסֵר denotes deficiency; ‘분별력이 없다’ more directly communicates the intended lack of sense without importing the more programmatic term ‘지혜.’
  naturalness: The revised wording is natural modern standard Korean in formal-polite style. Placing ‘때에도’ after ‘길을 걸을’ reads more smoothly while retaining the force of ‘even/on the road.’
  terminology: ‘분별력’ appropriately represents the intellectual-discernment sense of Hebrew לֵב in this context. ‘어리석은 자’ consistently represents סָכָל. The alternative construal of the final clause remains marked by the footnote and is not forced into the main text.
  issues:
  - severity: medium
    issue: ‘지혜가 없으며’ is overly specific for לִבּוֹ חָסֵר.
    rationale: The Hebrew idiom describes deficient sense/judgment, not specifically the absence of ‘wisdom’ as a thematic or theological quality. ‘마음에 분별력이 없으며’ is closer to the idiomatic force and preserves the cognitive sense of ‘heart.’
  revised_text: 길을 걸을 때에도 어리석은 자는 마음에 분별력이 없으며, 모든 사람에게 자신이 어리석은 자라고 말합니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘모든 사람에게 “그는 어리석은 자다”라고 말합니다.’ 히브리어는 어리석은 자가 스스로 자신의 어리석음을 드러내는 뜻으로도, 다른 사람을 어리석다고 부르는 뜻으로도 읽을 수 있으나, 문맥상 전자가 더 잘 맞습니다.
