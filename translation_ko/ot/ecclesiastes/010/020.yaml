  text: גַּ֣ם בְּ/מַדָּֽעֲ/ךָ֗ מֶ֚לֶךְ אַל תְּקַלֵּ֔ל וּ/בְ/חַדְרֵי֙ מִשְׁכָּ֣בְ/ךָ֔ אַל תְּקַלֵּ֖ל עָשִׁ֑יר כִּ֣י ע֤וֹף הַ/שָּׁמַ֨יִם֙ יוֹלִ֣יךְ אֶת הַ/קּ֔וֹל וּ/בַ֥עַל ה/כנפים יַגֵּ֥יד דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/020.yaml
  text: Even in your thoughts[a], do not curse a king, and in your bedroom do not curse a rich man, for a bird of the heavens may carry the sound[c][b], and a winged creature may report the matter.
  footnotes:
  - marker: a
    text: Or 'in your mind' for 'in your thoughts.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'in the chambers of your bed,' that is, in the privacy of your bedroom.
    reason: cultural_note
  - marker: c
    text: Hebrew 'a bird of the heavens'; compare the idiom behind the expression 'a little bird told me.'
    reason: cross_reference
translation:
  language: ko
  text: 생각 속에서조차[a] 왕을 저주하지 말며, 침실에서조차[b] 부자를 저주하지 마십시오. 하늘의 새가[c] 그 소리를 옮기고, 날개 달린 것이 그 일을 알릴 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신의 지식 안에서’로도 옮길 수 있으나, 여기서는 ‘생각 속에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 침상의 방들’이며, 가장 사적인 침실을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘하늘의 새’입니다. 이 표현은 비밀스러운 말도 뜻밖에 전해질 수 있음을 비유적으로 나타냅니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּמַדָּעֲךָ
  english_pob_choice: in your thoughts
  chosen_korean: 마음속에서도
  alternatives_korean:
  - 생각으로도
  - 생각 속에서도
  - 마음으로도
  lexicon: HALOT
  rationale: מַדָּע는 지식보다 내면의 인지·생각 영역을 가리키는 뜻으로 쓰였으므로, 한국어에서는 자연스러운 내적 영역 표현인 ‘마음속’으로 옮겼습니다.
- source_word: תְּקַלֵּל
  english_pob_choice: curse
  chosen_korean: 저주하지 말고
  alternatives_korean:
  - 욕하지 말고
  - 비방하지 말고
  - 헐뜯지 말고
  lexicon: HALOT
  rationale: קלל의 직접적 의미를 따라 ‘저주하다’를 택해, 단순한 험담보다 강한 금지의 뉘앙스를 살렸습니다.
- source_word: בְחַדְרֵי מִשְׁכָּבְךָ
  english_pob_choice: in your bedroom
  chosen_korean: 침실에서도
  alternatives_korean:
  - 잠방에서도
  - 침상 방에서도
  - 잠자리에 드는 방에서도
  lexicon: HALOT
  rationale: 직역하면 ‘침상의 방들’이지만, 문맥상 극히 사적인 공간을 가리키므로 현대 한국어의 ‘침실’이 의미를 가장 분명하게 전달합니다.
- source_word: עָשִׁיר
  english_pob_choice: a rich man
  chosen_korean: 부자를
  alternatives_korean:
  - 부유한 사람을
  - 유력자를
  - 부유한 남자를
  lexicon: HALOT
  rationale: 문법상 남성 단수의 명사적 용법이므로 ‘부자’를 택해 왕과의 평행을 살렸습니다.
- source_word: עוֹף הַשָּׁמַיִם / בַעַל הַכְּנָפַיִם
  english_pob_choice: a bird of the heavens / a winged creature
  chosen_korean: 하늘의 새가 소리를 전할 수 있고, 날개 달린 것이 그 일을 알릴 수도 있기 때문입니다
  alternatives_korean:
  - 하늘의 새가 소리를 옮길 수 있고, 날개 가진 것이 그 일을 알릴 수도 있기 때문입니다
  - 하늘의 새가 그 소리를 실어 나를 수 있고, 날개 가진 것이 그 일을 알릴 수도 있기 때문입니다
  lexicon: HALOT
  rationale: 두 개의 병행 절을 살려, 첫째는 ‘소리를 전하다’, 둘째는 ‘일을 알리다’로 옮겨 히브리어의 전달·고지 이미지를 유지했습니다.
theological_decisions:
- issue: 잠언적 경고의 확실성 표현
  chosen_reading: ‘…할 수 있고…할 수도 있기 때문입니다’로 번역해, 악담이 실제로 알려질 수 있다는 경고적 가능성을 살렸습니다.
  alternative_readings:
  - ‘…전할 것이기 때문입니다’처럼 단정적으로 번역
  - ‘…전할지도 모릅니다’로 약화
  rationale: 히브리어의 지혜문학적 경계는 가능성을 띤 경고로 읽는 것이 가장 자연스럽고, 문장의 설득력을 보존합니다.
  doctrine_reference: 지혜문학의 권면/경고 표현
- issue: ‘하늘의 새’의 이미지 보존
  chosen_reading: 직역에 가까운 ‘하늘의 새’를 유지했습니다.
  alternative_readings:
  - ‘공중의 새’로 관용화
  - ‘새가 우연히’처럼 의미만 남기기
  rationale: 히브리어의 비유적 이미지는 소문의 전파 가능성을 생생하게 드러내므로, 이를 평이하게 바꾸기보다 이미지 자체를 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 문학적 이미지 보존
