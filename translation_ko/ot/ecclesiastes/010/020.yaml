  terminology: ‘저주하다’는 קלל의 강한 표현을 보존합니다. ‘하늘의 새’와 ‘날개 달린 것’은 עוֹף הַשָּׁמַיִם 및 בַּעַל הַכְּנָפַיִם의 이미지를 충실히 살립니다.
