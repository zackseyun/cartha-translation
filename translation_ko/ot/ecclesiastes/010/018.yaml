base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/018.yaml
  text: Through laziness the roof sags[b][a], and through idle hands the house leaks.
  footnotes:
  - marker: a
    text: Or 'By laziness the roof sinks'; the Hebrew verb can denote becoming low or giving way, and the noun for 'roof' may refer more specifically to the roof structure or rafters.
    reason: lexical_alternative
  - marker: b
    text: Literally 'through the lowness of hands,' an idiom for slackness or negligence.
    reason: lexical_alternative
translation:
  language: ko
  text: 게으름 때문에 지붕이 처지고, 게으른 손 때문에 집에 물이 샙니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지붕’은 히브리어 מְקָרֶה가 가리키는 지붕 구조물이나 덮개를 현대 한국어로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘게으른 손’은 직역하면 ‘손의 낮아짐’이라는 히브리어 관용구를 한국어 관용 표현으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲצַלְתַּיִם
  english_pob_choice: Through laziness
  chosen_korean: 게으름 때문에
  alternatives_korean:
  - 게으름으로
  - 나태 때문에
  - 태만 때문에
  lexicon: HALOT
  rationale: בְּ는 원인·수단의 뜻을 나타내고, עצלתיים은 게으름/나태를 가리키므로 한국어에서는 자연스러운 인과 표현인 ‘때문에’로 옮겼습니다.
- source_word: יִמַּךְ הַמְּקָרֶה
  english_pob_choice: the roof sags
  chosen_korean: 지붕이 처지고
  alternatives_korean:
  - 지붕이 내려앉고
  - 지붕이 주저앉고
  - 지붕이 낮아지고
  lexicon: HALOT
  rationale: מַךְ 계열 동사는 ‘낮아지다, 주저앉다, 기울다’의 뜻을 가지며, 문맥상 급붕괴보다 서서히 약해지는 상태를 가리키므로 ‘처지다’가 가장 적절합니다.
- source_word: וּבְשִׁפְל֥וּת יָדַ֖יִם
  english_pob_choice: and through idle hands
  chosen_korean: 손이 게으르면
  alternatives_korean:
  - 손의 나태함 때문에
  - 손이 처지면
  - 손이 축 늘어지면
  lexicon: HALOT
  rationale: ‘손의 낮아짐’은 손을 쓰지 않는 태만의 관용구이므로, 직역보다 의미를 드러내는 ‘손이 게으르면’이 한국어 속담형 권고문맥에 잘 맞습니다.
- source_word: יִדְלֹף
  english_pob_choice: leaks
  chosen_korean: 샙니다
  alternatives_korean:
  - 새어듭니다
  - 뚝뚝 떨어집니다
  - 비가 샙니다
  lexicon: HALOT
  rationale: דלף는 ‘새다, 물이 떨어지다’의 뜻으로, 여기서는 집 전체의 손상 결과를 말하므로 ‘샙니다’가 가장 간결하고 자연스럽습니다.
