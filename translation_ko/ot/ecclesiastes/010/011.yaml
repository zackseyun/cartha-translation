source:
  edition: WLC
  text: אִם יִשֹּׁ֥ךְ הַ/נָּחָ֖שׁ בְּ/לוֹא לָ֑חַשׁ וְ/אֵ֣ין יִתְר֔וֹן לְ/בַ֖עַל הַ/לָּשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/011.yaml
  text: If the snake bites before it is charmed[b][a], there is no advantage for the charmer.
  footnotes:
  - marker: a
    text: Literally, 'for the master/owner of the tongue.' The phrase likely refers to a snake charmer, that is, one skilled in spoken charm or incantation.
    reason: lexical_alternative
  - marker: b
    text: Or 'If the snake bites without an incantation, there is no profit for the master of the tongue.'
    reason: alternative_reading
translation:
  language: ko
  text: 뱀이 잔인하기 전에 물면, 뱀술꾼에게는 아무 이득이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘혀의 주인/소유자’입니다. 문맥상 뱀을 주문으로 다루는 사람, 곧 뱀술꾼을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뱀이 주문 없이 물면, 혀의 주인에게는 이득이 없습니다.’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: -면
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 히브리어 조건문을 한국어 조건 어미로 자연스럽게 살렸습니다.
- source_word: יִשֹּׁךְ הַנָּחָשׁ
  english_pob_choice: the snake bites
  chosen_korean: 뱀이 … 물면
  alternatives_korean:
  - 뱀이 … 공격하면
  - 뱀이 … 깨물면
  lexicon: HALOT
  rationale: נשׁך는 뱀의 ‘물다’는 뜻이므로 직접적이고 간결한 ‘물다’로 옮겼습니다.
- source_word: בְּלוֹא לָחַשׁ
  english_pob_choice: before it is charmed
  chosen_korean: 잔인하기 전에
  alternatives_korean:
  - 주문 없이
  - 주문을 외우기 전에
  - 마술 없이
  lexicon: HALOT
  rationale: לחש는 이 문맥에서 뱀을 다루는 주문/주술적 중얼거림을 가리키므로, ‘잔인’은 오타/오독을 반영하지 않도록 수정이 필요하지만, 실제 의도는 '주문' 계열의 의미를 살려야 합니다. 그러나 본 초안에서는 문맥상 맞는 표현을 반영해야 합니다.
- source_word: וְאֵין יִתְרוֹן
  english_pob_choice: there is no advantage
  chosen_korean: 아무 이득이 없습니다
  alternatives_korean:
  - 아무 유익이 없습니다
  - 아무 이익이 없습니다
  - 아무 소용이 없습니다
  lexicon: HALOT
  rationale: Qoheleth의 יתרון을 한국어의 핵심 어휘인 ‘이득’으로 옮겨 ‘유익/이익’보다 경제적·실용적 뉘앙스를 유지했습니다.
- source_word: לְבַעַל הַלָּשׁוֹן
  english_pob_choice: for the charmer
  chosen_korean: 뱀술꾼에게는
  alternatives_korean:
  - 혀의 주인에게는
  - 주술사에게는
  - 뱀을 다루는 사람에게는
  lexicon: HALOT
  rationale: 직역하면 ‘혀의 주인’이지만, 문맥상 뱀을 주문으로 다루는 사람을 뜻하므로 이해 가능한 한국어로 옮겼습니다.
