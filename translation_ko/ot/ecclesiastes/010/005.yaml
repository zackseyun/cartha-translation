  rationale: The revision keeps the Hebrew’s broad ‘evil/bad thing,’ its ‘under the sun’ idiom, the simile, and the concrete ‘from before the ruler’ court imagery. It improves modern Korean flow, aligns the footnote with the main rendering, and preserves the source’s final colon as a link to the following verse.
