translation:
  language: ko
  text: '내가 해 아래에서 본 한 가지 악이 있습니다. 그것은 통치자 앞에서 나오는 실수와 같은 것입니다[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치자의 면전에서부터 나오는 실수와 같은 것’으로도 옮길 수 있습니다. 히브리어 표현은 실제로 부주의한 실수를 가리킬 수도 있고, 실수인 것처럼 여겨지는 것을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: …있습니다
  alternatives_korean:
  - …존재합니다
  - …있습니다
  lexicon: HALOT
  rationale: 존재를 알리는 서술을 자연스러운 현대 한국어로 옮기되, 전도체적 단정 대신 관찰 진술의 톤을 살렸습니다.
- source_word: רָעָה
  english_pob_choice: an evil
  chosen_korean: 한 악
