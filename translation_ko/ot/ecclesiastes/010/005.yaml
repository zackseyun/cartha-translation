  edition: WLC
  text: יֵ֣שׁ רָעָ֔ה רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ כִּ/שְׁגָגָ֕ה שֶׁ/יֹּצָ֖א מִ/לִּ/פְנֵ֥י הַ/שַּׁלִּֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/005.yaml
  text: 'There is an evil I have seen under the sun[a], like an error that goes out from before the ruler:'
  footnotes:
  - marker: a
    text: Or 'like a mistake that proceeds from the presence of the ruler.' The Hebrew wording can suggest either an actual inadvertent error or something treated as though it were an error.
    reason: lexical_alternative
translation:
  language: ko
  text: 해 아래에서 내가 본 한 악이 있습니다. 그것은 마치 통치자 앞에서 나오는 실수 같습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치자의 면전에서부터 나오는 실수처럼’으로도 옮길 수 있습니다. 히브리어 표현은 실제로 부주의한 실수이거나, 그렇게 간주되는 것을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: There is
  chosen_korean: …있습니다
  alternatives_korean:
  - …존재합니다
  - …있습니다
  lexicon: HALOT
  rationale: 존재를 알리는 서술을 자연스러운 현대 한국어로 옮기되, 전도체적 단정 대신 관찰 진술의 톤을 살렸습니다.
- source_word: רָעָה
  english_pob_choice: an evil
  chosen_korean: 한 악
  alternatives_korean:
  - 한 악한 일
  - 한 재앙
  - 한 잘못
  lexicon: HALOT
  rationale: 전도서의 רָעָה가 도덕적 악과 불행/해악을 함께 아우를 수 있어, 의미를 좁히지 않는 '악'을 택했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 이 세상에서
  lexicon: HALOT
  rationale: 전도서의 관용구를 직역에 가깝게 보존하되, 한국어에서 자연스러운 표현인 '해 아래'를 사용했습니다.
- source_word: כִּשְׁגָגָה
  english_pob_choice: like an error
  chosen_korean: 마치 … 실수 같습니다
  alternatives_korean:
  - 마치 … 오류 같습니다
  - 마치 … 실수인 듯합니다
  - 마치 … 과실 같습니다
  lexicon: HALOT
  rationale: שׁגגה의 ‘부주의한 오류/실수’ 가능성을 살려, 실제 오류인지 그렇게 취급되는 것인지 열어 둔 비교 표현으로 옮겼습니다.
theological_decisions:
- issue: שֶׁיֹּצָא מִלִּפְנֵי הַשַּׁלִּיט의 궁정 이미지 보존
  chosen_reading: ‘통치자 앞에서 나오는’으로 직역해, 권력자 앞에서 비롯된 판단의 분위기를 살렸습니다.
  alternative_readings:
  - ‘통치자 앞에서부터’
  - ‘통치자의 면전에서’
  rationale: 본문은 단순한 출처 표기보다 궁정적 권위와 판단의 긴장을 드러내므로, 그 이미지를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 전도서 10:5의 지혜 관찰 문맥
