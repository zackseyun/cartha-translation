id: ECC.10.16
reference: Ecclesiastes 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִֽי לָ֣/ךְ אֶ֔רֶץ שֶׁ/מַּלְכֵּ֖/ךְ נָ֑עַר וְ/שָׂרַ֖יִ/ךְ בַּ/בֹּ֥קֶר יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/016.yaml
  text: Woe to you[a], O land[b], when your king is a youth and your princes eat in the morning.
  footnotes:
  - marker: a
    text: Or 'Alas for you, O land, whose king is a child.' The Hebrew נַעַר can denote a child, youth, or young man; here it likely emphasizes immaturity in rule.
    reason: lexical_alternative
  - marker: b
    text: The statement that princes 'eat in the morning' likely implies self-indulgent feasting at an improper time, in contrast to the commendation in the following verse.
    reason: cultural_note
translation:
  language: ko
  text: 화 있을진저, 그대여, 땅이여 — 왕이 어린 나라이며 그대의 방백들이 아침에 먹는구나.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָעַר는 ‘어린아이’, ‘청년’, ‘젊은이’까지 가리킬 수 있으며, 여기서는 나이보다 통치의 미성숙함을 강조하는 표현으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 방백들이 ‘아침에 먹는다’는 말은 단순한 식사보다 부적절한 향락과 무절제를 암시하는 표현으로 이해하는 것이 자연스럽습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프도다
  - 아아
  lexicon: HALOT
  rationale: 지혜문학과 경고 맥락에서 감탄사적 책망을 가장 자연스럽고 강하게 살리는 표준적 대응입니다.
- source_word: לָךְ אֶרֶץ
  english_pob_choice: to you, O land
  chosen_korean: 그대여, 땅이여
  alternatives_korean:
  - 땅이여
  - 나라여
  lexicon: HALOT
  rationale: 히브리어의 직접 호소를 살려 2인칭 호격으로 옮겼고, אֶרֶץ는 여기서 정치적 공동체를 가리키므로 ‘땅’이 가장 넓이와 직결감을 함께 유지합니다.
- source_word: נָעַר
  english_pob_choice: a youth
  chosen_korean: 어린
  alternatives_korean:
  - 젊은
  - 아이 같은
  lexicon: HALOT
  rationale: 이 단어의 핵심은 단순 연령보다 통치의 미성숙함이므로, ‘어린’으로 옮겨 왕권의 미숙함을 드러냈습니다.
- source_word: שָׂרַיִךְ
  english_pob_choice: your princes
  chosen_korean: 그대의 방백들이
  alternatives_korean:
  - 그대의 통치자들이
  - 그대의 귀족들이
  lexicon: HALOT
  rationale: שָׂרִים은 궁정의 고위 통치자를 가리키므로, 한국어에서는 전통적이면서도 위계가 드러나는 ‘방백들’이 적절합니다.
- source_word: בַּבֹּקֶר יֹאכֵלוּ
  english_pob_choice: eat in the morning
  chosen_korean: 아침에 먹는구나
  alternatives_korean:
  - 아침에 먹고 있구나
  - 아침부터 잔치를 벌이는구나
  lexicon: HALOT
  rationale: 동사의 기본 의미를 유지하되, 문맥상 부적절한 향락을 암시하는 뉘앙스는 과도하게 풀지 않고 다음 절과의 대비에 남겨 둡니다.
theological_decisions:
- issue: 왕의 미성숙함과 방백들의 아침 식사에 담긴 비판의 강도
  chosen_reading: 본문의 직설적 책망을 유지해, 정치적 무질서와 절제 없음이 한 나라의 재앙이라는 뜻을 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘슬프도다’로 낮추는 읽기
  - ‘아침에 먹는다’를 중립적으로만 처리하는 읽기
  rationale: 히브리어 감탄사와 문맥상 비난의 힘을 약화시키지 않기 위해, 경고의 어조와 부적절한 향락성을 그대로 보존했습니다.
  doctrine_reference: 잠언/전도서의 지혜적 경고와 통치 윤리
- issue: ‘땅’에 대한 호격 처리
  chosen_reading: ‘그대여, 땅이여’로 옮겨 대상 국가를 직접 책망하는 형식을 살렸습니다.
  alternative_readings:
  - ‘땅이여’만 두는 읽기
  - ‘나라여’로 바꾸는 읽기
  rationale: 히브리어의 직접 호소를 현대 한국어에서 자연스럽게 재현하면서도, אֶרֶץ의 정치적·공동체적 의미를 보존하기 위한 선택입니다.
  doctrine_reference: 예언적 책망의 수사학
