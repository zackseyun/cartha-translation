id: ECC.10.1
reference: Ecclesiastes 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְב֣וּבֵי מָ֔וֶת יַבְאִ֥ישׁ יַבִּ֖יעַ שֶׁ֣מֶן רוֹקֵ֑חַ יָקָ֛ר מֵ/חָכְמָ֥ה מִ/כָּב֖וֹד סִכְל֥וּת מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/001.yaml
  text: Dead flies make a perfumer’s oil stink and bubble up[b][a]; so a little folly outweighs wisdom and honor.
  footnotes:
  - marker: a
    text: Or 'ferment,' 'give off bubbles,' or more generally 'spoil.' The Hebrew verb suggests an active emission or bubbling from the ruined oil.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''is more precious than.'' The Hebrew can be read as a comparison of value: ''a little folly is weightier/more significant than wisdom and honor.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 죽은 파리들이 향유 제조자의 기름에서 악취가 나게 하고 거품이 일게 합니다.[a] 이처럼 조금의 어리석음이 지혜와 명예보다 더 무겁습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발효시키다’, ‘거품을 내다’, 혹은 더 일반적으로 ‘망치다’. 히브리어 동사는 손상된 기름이 능동적으로 배어나오거나 거품이 이는 모습을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 귀하다’. 히브리어는 가치 비교로도 읽을 수 있어, ‘조금의 어리석음이 지혜와 명예보다 더 무겁다’는 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּבֵי מָוֶת
  english_pob_choice: Dead flies
  chosen_korean: 죽은 파리들
  alternatives_korean:
  - 죽음의 파리들
  - 치명적인 파리들
  lexicon: HALOT
  rationale: 직역하면 '죽음의 파리들'이지만, 문맥상 부패한 기름을 오염시키는 시체성 파리를 가리키므로 자연스러운 한국어로 '죽은 파리들'이 원문의 이미지를 잘 살립니다.
- source_word: יַבְאִישׁ
  english_pob_choice: make ... stink
  chosen_korean: 썩게 하고
  alternatives_korean:
  - 악취가 나게 하고
  - 냄새나게 하고
  lexicon: HALOT
  rationale: 히필형의 원인 의미를 살리면서, 기름이 부패해 악취를 내는 결과를 한국어에서 가장 자연스럽게 드러내기 위해 '썩게 하고'로 옮겼습니다.
- source_word: יַבִּיעַ
  english_pob_choice: bubble up
  chosen_korean: 거품이 일게 합니다
  alternatives_korean:
  - 부풀게 합니다
  - 끓어오르게 합니다
  - 거품을 내게 합니다
  lexicon: HALOT
  rationale: 원어는 손상된 기름이 활발히 솟아오르거나 거품을 내는 모습을 시사하므로, 한국어에서는 시각적 동작을 살린 '거품이 일게 합니다'가 가장 적절합니다.
- source_word: יָקָר מֵ/חָכְמָה מִ/כָּב֖וֹד
  english_pob_choice: outweighs wisdom and honor
  chosen_korean: 지혜와 명예보다 더 무겁습니다
  alternatives_korean:
  - 지혜와 명예보다 더 귀합니다
  - 지혜와 명예보다 더 값집니다
  - 지혜와 명예를 능가합니다
  lexicon: HALOT
  rationale: 여기서는 মূল্য/가치 비교보다 '무게'의 비유가 핵심이므로, 비교의 역설을 드러내는 '더 무겁습니다'가 원문의 수사적 힘을 잘 보존합니다.
theological_decisions:
- issue: וְ/־־ 없이 이어지는 잠언적 비교를 한국어에서 어떻게 압축할지
  chosen_reading: 첫 절은 원인의 비유, 둘째 절은 그 비유를 적용하는 대조 구조로 두 문장을 나누었습니다.
  alternative_readings:
  - 한 문장으로 길게 이어 번역하기
  - '''그러므로''를 명시해 해설적으로 풀기'
  rationale: 히브리어의 비유-적용 구조를 한국어에서도 분명히 전달하되, 원문에 없는 해설 연결어는 넣지 않았습니다.
  doctrine_reference: 지혜문학의 관찰적 경구 형식
