  verdict: revise
  source_fidelity: 히브리어는 ‘어리석은 자들’(복수)의 수고가 3인칭 남성 단수 목적어를 지치게 한다고 하며, 이어지는 관계절도 그 단수 대상을 수식하는 것이 가장 직접적입니다. 현 번문의 본문은 ‘그들을’과 ‘그는’을 병치하여 이 문법적 연결을 불명료하게 만듭니다. עיר는 관사 없는 일반적 표현이므로 한국어에서는 자연스럽게 ‘도시로’로 옮기는 것이 적절합니다.
  naturalness: ‘도시로 가는 법을 알지 못하는 그를’처럼 관계절을 목적어 앞에 두면 현대 표준 한국어에서 자연스럽고 문장 연결도 분명합니다. ‘한 도시’는 문법상 가능하지만 한국어 격언 문체에서는 다소 부자연스러우므로 피했습니다.
  terminology: ‘어리석은 자들’, ‘수고’, ‘지치게 합니다’는 지혜문학의 כְּסִיל 및 עָמָל의 의미와 합쇼체 문체에 적절합니다. 신학 용어상 조정할 사항은 없습니다.
