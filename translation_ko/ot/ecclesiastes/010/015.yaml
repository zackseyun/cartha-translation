id: ECC.10.15
reference: Ecclesiastes 10:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲמַ֥ל הַ/כְּסִילִ֖ים תְּיַגְּעֶ֑/נּוּ אֲשֶׁ֥ר לֹֽא יָדַ֖ע לָ/לֶ֥כֶת אֶל עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/015.yaml
  text: The labor of fools wearies them[a], for he does not know how to go to the city.
  footnotes:
  - marker: a
    text: Or, 'The toil of fools wears them out, for they do not know the way to the city.' The Hebrew suffixes and relative clause permit a more collective sense, but the singular 'him who does not know' follows the most straightforward grammatical linkage.
    reason: alternative_reading
translation:
  language: ko
  text: 어리석은 자들의 수고는 도시로 가는 법을 알지 못하는 그를 지치게 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘어리석은 자들의 수고는 그들을 지치게 합니다. 그들은 도시로 가는 길을 알지 못합니다.’ 히브리어 동사의 목적어 접미사는 단수이지만, 앞선 복수 명사에 따라 집합적으로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲמַל
  english_pob_choice: labor
  chosen_korean: 수고
  alternatives_korean:
  - 노고
  - 일
  lexicon: HALOT
  rationale: 지혜문학적 문맥에서 עמל의 노동·노고의 뉘앙스를 살리면서, 한국어에서 자연스럽고 무게감 있게 들리는 ‘수고’를 택했습니다.
- source_word: הַכְּסִילִים
  english_pob_choice: fools
  chosen_korean: 어리석은 자들
  alternatives_korean:
  - 우매한 사람들
  - 미련한 자들
  lexicon: HALOT
  rationale: כְּסִיל은 단순 지능 부족보다 도덕적·지혜적 무지를 가리키므로, 직설적이지만 비난조를 과도하게 키우지 않는 ‘어리석은 자들’로 옮겼습니다.
- source_word: תְּיַגְּעֶנּוּ
  english_pob_choice: wearies him
  chosen_korean: 그들을 지치게 합니다
  alternatives_korean:
  - 그를 지치게 합니다
  - 그들을 피곤하게 합니다
  lexicon: HALOT
  rationale: 히브리어는 형식상 단수 목적어를 가지지만, 영어 POB의 주석처럼 집합적 복수 이해가 가능하므로 앞의 복수 주어에 맞춘 자연스러운 한국어로 처리했습니다.
- source_word: לָלֶכֶת אֶל עִיר
  english_pob_choice: to go to the city
  chosen_korean: 한 도시로 가는 법
  alternatives_korean:
  - 도시에 가는 법
  - 한 도시로 가는 길
  lexicon: HALOT
  rationale: ‘ידע + 부정사’의 관용구를 ‘가는 법을 알다’로 자연스럽게 살리고, ‘עִיר’는 특정 도시가 아닌 속담적 일반성을 유지하도록 ‘한 도시’로 옮겼습니다.
theological_decisions:
- issue: 격언의 주어-목적어 수일치와 일반화의 처리
  chosen_reading: 히브리어의 형식상 단수 목적어를 그대로 고집하지 않고, 속담적 문맥에 따라 복수 주어 ‘어리석은 자들’에 맞추어 자연스럽게 옮겼습니다.
  alternative_readings:
  - 그를 지치게 합니다
  - 어리석은 자들의 수고는 그를 지치게 합니다
  rationale: 본문은 지혜문학의 일반 진술이므로, 의미 전달을 우선하되 주석이 지적한 문법적 긴장은 설명 가능한 범위 안에서 보존했습니다.
  doctrine_reference: 문법적 긴장에 대한 본문비평/해석학적 판단
- issue: ‘도시’의 일반성
  chosen_reading: 특정한 도시를 가리키지 않는 속담적 표현으로 ‘한 도시’로 번역했습니다.
  alternative_readings:
  - 그 도시
  - 도시
  rationale: 영어 POB가 최종적으로 일반적이고 직접적인 표현을 선호한 흐름을 따라, 특정 지시를 피하고 속담적 보편성을 유지했습니다.
  doctrine_reference: 지혜문학의 일반 명제 처리
