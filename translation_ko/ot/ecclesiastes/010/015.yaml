    rationale: ‘그들을 지치게 합니다. 그는’은 복수 목적어와 단수 관계절 주어를 분리해 놓아, 히브리어의 단수 목적어와 그를 수식하는 관계절의 직접적인 연관을 본문에서 잃게 합니다.
  - severity: low
