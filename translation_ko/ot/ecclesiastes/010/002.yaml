  text: לֵ֤ב חָכָם֙ לִֽ/ימִינ֔/וֹ וְ/לֵ֥ב כְּסִ֖יל לִ/שְׂמֹאלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/002.yaml
  text: A wise man's heart is at his right hand[a], but a fool's heart is at his left.
  footnotes:
  - marker: a
    text: Or 'to his right ... to his left.' The Hebrew idiom uses right and left as symbolic orientations, likely implying sound judgment versus poor judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람의 마음은 오른쪽에 있고, 어리석은 사람의 마음은 왼쪽에 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 오른편… 그의 왼편’입니다. 히브리어 관용구는 오른쪽과 왼쪽을 상징적 방향성으로 사용하여, 지혜로운 판단과 어리석은 판단의 대비를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב는 사고와 판단을 포함한 내적 중심을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘마음’이 적절합니다.
- source_word: חָכָם
  english_pob_choice: wise man
  chosen_korean: 지혜로운 사람
  alternatives_korean:
  - 지혜로운 남자
  - 지혜자
  lexicon: HALOT
  rationale: 원문은 명사처럼 쓰인 형용사이지만, 한국어에서는 성별을 과도하게 부각하지 않으면서도 대표적 지혜 격언의 성격을 살리는 ‘지혜로운 사람’이 자연스럽습니다.
- source_word: לִ/ימִינ֔/וֹ
  english_pob_choice: at his right hand
  chosen_korean: 오른쪽에
  alternatives_korean:
  - 그의 오른편에
  - 오른손에
  lexicon: HALOT
  rationale: 전치사 ל는 여기서 방향·배치를 나타내므로, 한국어에서는 관용적이면서도 상징적 대비를 살리는 ‘오른쪽에’로 옮겼습니다.
- source_word: כְּסִיל
  english_pob_choice: fool
  chosen_korean: 어리석은 사람
  alternatives_korean:
  - 미련한 사람
  - 우둔한 사람
  lexicon: HALOT
  rationale: 지혜문학의 כְּסִיל은 단순한 조롱이 아니라 판단이 그릇된 사람을 뜻하므로, 현대 한국어에서 품위를 지키면서도 의미를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 우/좌의 상징성 유지
  chosen_reading: 오른쪽과 왼쪽의 공간 대비를 그대로 살려, 지혜와 어리석음의 대조로 읽히게 했습니다.
  alternative_readings:
  - ‘옳은 판단/그른 판단’처럼 의미를 풀어쓴 번역
  rationale: 원문은 신체적 위치를 통해 판단의 방향성을 말하는 비유이므로, 해석을 앞질러 의미를 추상화하기보다 상징 구조를 보존하는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1 (source-transparency)
