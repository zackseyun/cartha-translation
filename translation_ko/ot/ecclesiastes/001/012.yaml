lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I
  chosen_korean: 나
  alternatives_korean:
  - 저
  - 내가
  lexicon: HALOT
  rationale: 첫인칭 단수의 자기지시를 자연스럽게 살리되, 문장 서두의 강조를 보존하기 위해 평서문 주어로 '나'를 택했습니다.
- source_word: קֹהֶלֶת
  english_pob_choice: Qoheleth
  chosen_korean: 코헬렛
  alternatives_korean:
  - 교사
  - 설교자
  - 모은 자
  lexicon: HALOT
  rationale: 의미를 단정해 풀지 않고 음역하여, 본문의 고유한 화자 표지를 보존했습니다. 영어 POB의 음역 결정을 한국어로 옮긴 것입니다.
- source_word: הָיִיתִי
  english_pob_choice: was
  chosen_korean: ~이었습니다
  alternatives_korean:
  - ~였습니다
  - ~이었노라
  lexicon: HALOT
  rationale: 완료형의 회고적 진술을 한국어 과거 평서로 옮겨, 이전 상태를 말하는 문맥을 자연스럽게 반영했습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘에
  - 예루살렘 안에서
  lexicon: HALOT
  rationale: 지명 앞 ב의 처소 의미를 한국어 조사 '에서'로 옮겨, 왕권의 자리와 활동 무대를 분명히 했습니다.
theological_decisions:
- issue: קֹהֶלֶת의 의미를 번역어로 풀지, 음역으로 보존할지
  chosen_reading: 코헬렛으로 음역했습니다.
  alternative_readings:
  - 교사
  - 설교자
  rationale: 이 호칭은 의미가 분명히 합의되지 않았고 책의 고유한 화자 명칭으로 기능하므로, 특정 해석을 앞질러 확정하지 않기 위해 음역을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
