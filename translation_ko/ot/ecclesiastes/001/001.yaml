    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: 말씀입니다
  alternatives_korean:
  - 말들입니다
  - 말들의 내용입니다
  lexicon: HALOT
  rationale: 히브리어 복수형 דִּבְרֵי는 책의 서두에서 내용 전체를 여는 관용 표현이므로, 자연스러운 한국어로는 ‘말씀’이 아니라면 다소 어색할 수 있지만 여기서는 본문의 책 제목 기능을 살려 간결하게 ‘말씀입니다’로 옮겼습니다.
- source_word: קֹהֶלֶת
  english_pob_choice: Qoheleth
  chosen_korean: 전도자
  alternatives_korean:
  - 고헬렛
  - 교사
  - 설교자
  lexicon: HALOT
  rationale: 영어 POB는 음역을 본문에 유지하지만, 한국어에서는 독자가 즉시 인물 호칭으로 이해하도록 하면서도 회중/모임과 관련된 어감을 살리기 위해 ‘전도자’를 선택했습니다. 다만 의미가 완전히 단정되지 않는다는 점은 본문에 과도한 해석을 넣지 않는 방식으로 반영했습니다.
- source_word: בֶּן דָּוִד
  english_pob_choice: son of David
  chosen_korean: 다윗의 아들
  alternatives_korean:
  - 다윗의 자손
  - 다윗의 후손
  lexicon: HALOT
  rationale: 직역에 가까운 친자 관계 표현으로서 ‘다윗의 아들’이 가장 직접적이며, 왕적 계승의 여지도 본문이 스스로 지니게 합니다.
- source_word: מֶלֶךְ
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 통치자
  lexicon: HALOT
  rationale: מֶלֶךְ의 기본 의미를 그대로 살려 ‘왕’으로 옮겼습니다. 고전적 어감보다 현대 표준어의 직설성이 본문 서두에 적합합니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘의
  alternatives_korean:
  - 예루살렘에 있는
  - 예루살렘에서
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 장소 의미를 한국어 소유격 구조로 자연스럽게 반영해 ‘예루살렘의 왕’으로 처리했습니다. 이는 왕의 소재지를 드러내면서 문장 흐름을 매끄럽게 합니다.
theological_decisions:
- issue: קֹהֶלֶת의 의미를 본문에서 얼마나 해석할 것인가
  chosen_reading: 본문에는 기능상 호칭으로서 ‘전도자’를 사용하고, 정확한 어원적 범주는 열어 둡니다.
  alternative_readings:
  - 고헬렛
  - 교사
  - 설교자
  rationale: 전도서는 제목적 용법이 강하므로 독자가 역할을 바로 이해하도록 했지만, 히브리어의 정확한 뉘앙스는 논쟁적이어서 본문 자체에서 과도하게 특정하지 않았습니다.
  doctrine_reference: 번역 철학 §§2–3
