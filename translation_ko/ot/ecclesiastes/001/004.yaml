    rationale: 히브리어는 정관사 없는 명사를 반복하여 세대들의 지속적 교체를 병행법으로 표현합니다. 한국어에서는 ‘세대는 가고, 세대는 오지만’이 이 총칭적·격언적 대구를 더 자연스럽게 재현합니다.
