  yaml_path: translation/ot/ecclesiastes/001/004.yaml
  text: A generation goes[a], and a generation comes[b], but the earth stands forever.
  footnotes:
  - marker: a
    text: Or 'remains forever.' The Hebrew verb is literally 'stands,' a concrete image for enduring stability.
    reason: lexical_alternative
  - marker: b
    text: '''Forever'' renders a Hebrew idiom for enduring continuance; in context it highlights the contrast between passing generations and the earth''s relative permanence.'
    reason: cultural_note
translation:
  language: ko
  text: 세대는 가고, 세대는 오지만, 땅은 영원히[b] 서 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서 있습니다’는 히브리어의 구체적 동사 이미지(‘서다’)를 살린 번역입니다. ‘남아 있습니다’도 가능하지만, 원문의 형상성을 덜 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원히’는 여기의 히브리 관용구를 자연스러운 한국어로 옮긴 것입니다. 이 구절에서는 세대의 지나감과 땅의 지속성 사이의 대비를 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹר
  english_pob_choice: generation
  chosen_korean: 세대
  alternatives_korean:
  - 세대 사람들
  - 한 시대
  lexicon: HALOT
  rationale: דּוֹר는 한 무리의 사람들을 가리키는 ‘세대’가 가장 자연스럽고, 앞뒤의 대구를 그대로 살릴 수 있습니다.
- source_word: הֹלֵךְ
  english_pob_choice: goes
  chosen_korean: 가고
  alternatives_korean:
  - 지나가고
  - 떠나고
  lexicon: HALOT
  rationale: 진행형적 용례를 살려 ‘가고’로 옮기면, 해석을 덧붙이지 않으면서도 반복적·격언적 흐름을 유지할 수 있습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅 위
  - 세상
  - 지구
  lexicon: HALOT
  rationale: 이 구절은 특정 땅이 아니라 인간 세대의 유한함과 대비되는 지속성을 말하므로, 전통적이고 넓은 범위의 ‘땅’이 무난합니다.
- source_word: עֹמָדֶת
  english_pob_choice: stands
  chosen_korean: 서 있습니다
  alternatives_korean:
  - 서 있다
  - 머물러 있습니다
  - 남아 있습니다
  lexicon: HALOT
  rationale: ‘서 있다’의 구체적 이미지를 살려 POB의 ‘stands’를 한국어로 풀어, 지속의 안정감을 직설적으로 드러냈습니다.
theological_decisions:
- issue: לְעוֹלָם의 의미를 절대적 무한성으로 고정할지, 지혜문학적 지속성으로 살릴지
  chosen_reading: ‘영원히’로 옮기되, 지혜문학의 관찰적 표현으로 읽히도록 문맥의 대비를 유지했습니다.
  alternative_readings:
  - 끝없이
  - 오래도록
  - 세세토록
  rationale: 이 절은 세대의 유한함과 땅의 지속성을 대조하는 관찰 언어이므로, 교리적 과잉설명 없이 일반적 한국어 표현인 ‘영원히’가 가장 자연스럽습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 해소하지 말고 보존한다'
