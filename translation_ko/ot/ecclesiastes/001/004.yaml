  source_fidelity: 히브리어의 대구(‘세대가 가고 / 세대가 오며’)와 결론(‘땅은 영원히 서 있다’)을 충실히 옮겼습니다. 다만 ‘한 세대는 … 한 세대는’은 같은 세대가 가고 오는 듯한 불필요한 모호성을 낳을 수 있으므로, 관습적·총칭적 표현인 ‘세대는’의 반복이 원문의 격언적 병행을 더 자연스럽게 전달합니다.
  naturalness: ‘땅은 영원히 서 있습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 각주 b의 ‘כאן의’는 한국어 문장 안에 남은 부적절한 히브리어 표기로서 ‘여기의’로 고쳐야 합니다.
  terminology: ‘세대’, ‘땅’, ‘영원히’, ‘서 있습니다’는 각각 דּוֹר, הָאָרֶץ, לְעוֹלָם, עֹמָדֶת에 적절합니다. ‘서 있습니다’는 עמד의 구체적 이미지를 보존하며, ‘영원히’는 본문의 수사적 긴장을 과도하게 해설하지 않습니다.
