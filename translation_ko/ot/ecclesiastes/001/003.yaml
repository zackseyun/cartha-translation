    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 해 아래에서 수고하는 그의 모든 수고에서 무슨 이익이 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 대표적 단수로 쓰였으며, ‘사람’ 또는 ‘인간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה / What
  english_pob_choice: What
  chosen_korean: 무슨
  alternatives_korean:
  - 무엇의
  - 어떤
  lexicon: HALOT
  rationale: 히브리어의 간결한 수사적 의문을 한국어에서도 짧고 자연스럽게 살리기 위해 ‘무슨’으로 옮겼습니다.
- source_word: יִּתְר֖וֹן
  english_pob_choice: profit
  chosen_korean: 이익
  alternatives_korean:
  - 유익
  - 이득
  - 남는 것
  lexicon: HALOT
  rationale: 전도서의 핵심어로서 ‘남는 실질적 이익’의 뉘앙스를 담되, 현대 한국어에서 수사적 질문에 자연스러운 ‘이익’을 선택했습니다.
- source_word: לָאָדָם
  english_pob_choice: does man have
  chosen_korean: 사람이
  alternatives_korean:
  - 한 사람이
  - 인간이
  - 인류가
  lexicon: HALOT
  rationale: 대표적 단수인 אָדָם을 한국어에서는 주어로 자연스럽게 풀어 ‘사람이’로 옮겼습니다. 성중립적 보충은 가능하지만, 원문의 단수 대표성을 유지하는 쪽을 우선했습니다.
- source_word: בְּכָל עֲמָלוֹ
  english_pob_choice: in all his labor
  chosen_korean: 그의 모든 수고에서
  alternatives_korean:
  - 그의 모든 노동에서
  - 그의 모든 일에서
  - 그의 모든 애씀에서
  lexicon: HALOT
  rationale: עָמָל의 ‘수고/애씀’이라는 부담스러운 노동의 뉘앙스를 살리기 위해 ‘수고’를 택했고, 전치사 בְּ는 한국어에서 자연스러운 조사 ‘에서’로 처리했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 해 밑에서
  - 태양 아래에서
  lexicon: HALOT
  rationale: 전도서의 상징적 관용구를 한국어 성경 전통에 맞으면서도 현대적으로 ‘해 아래에서’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: אָדָם의 대표적 단수와 한국어 인칭 표현
  chosen_reading: ‘사람이’로 옮겨 일반 인간 전체를 가리키는 대표적 단수로 읽히게 했습니다.
  alternative_readings:
  - ‘한 사람이’
  - ‘인간이’
  - ‘인류가’
  rationale: 원문은 단수 형태를 유지하면서 보편적 인간을 대표합니다. 한국어에서는 ‘사람이’가 자연스럽고, 남성 전용으로 오해될 위험도 줄입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
