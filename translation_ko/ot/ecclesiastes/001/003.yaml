- from: 사람이 해 아래에서 수고하는 그의 모든 수고에서 무슨 이익이 있습니까?[a]
  to: 사람이 해 아래에서 애쓰는 모든 수고로 얻는 이익이 무엇입니까?[a]
  rationale: 문장의 핵심 의미는 바꾸지 않고, 한국어의 자연스러운 어순과 결합을 위해 ‘수고하는 그의 모든 수고에서 무슨 이익이 있습니까’를 ‘애쓰는 모든 수고로 얻는 이익이 무엇입니까’로 다듬었습니다. 이는 노동에서 얻는 이익을 묻는 원문의 관계를 분명히 하며, עמל의 반복적 강조도 ‘애쓰는’과 ‘수고’로 유지합니다. 각주도 본문과 중복되는 ‘사람’을 대안으로 제시하지 않고 대표적 단수의 기능과 실제 대안인 ‘인간’을 제시하도록 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:07Z'
