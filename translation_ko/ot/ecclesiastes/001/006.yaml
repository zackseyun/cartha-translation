id: ECC.1.6
reference: Ecclesiastes 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹלֵךְ֙ אֶל דָּר֔וֹם וְ/סוֹבֵ֖ב אֶל צָפ֑וֹן סוֹבֵ֤ב סֹבֵב֙ הוֹלֵ֣ךְ הָ/ר֔וּחַ וְ/עַל סְבִיבֹתָ֖י/ו שָׁ֥ב הָ/רֽוּחַ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/006.yaml
  text: Going toward the south and turning toward the north[a], turning and turning goes the wind[b]; and on its circuits the wind returns.
  footnotes:
  - marker: a
    text: Hebrew רוּחַ can also mean 'spirit' or 'breath'; here the context of natural cycles favors 'wind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its rounds' for 'its circuits.'
    reason: lexical_alternative
translation:
  language: ko
  text: '남쪽으로 가고 북쪽으로 돌아서며

    돌고 돌아 바람은 갑니다[a];

    그리고 그 도는 길에서 바람은 되돌아옵니다[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחַ는 ‘영’이나 ‘숨’도 뜻할 수 있으나, 여기서는 문맥상 ‘바람’이 가장 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 도는 길들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  english_pob_choice: the wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨
  lexicon: HALOT
  rationale: 이 절은 해와 물줄기와 함께 자연의 순환을 묘사하므로, רוּחַ는 여기서 ‘영’보다 ‘바람’이 직접적인 의미입니다.
- source_word: סוֹבֵב סֹבֵב
  english_pob_choice: turning and turning
  chosen_korean: 돌고 돌아
  alternatives_korean:
  - 돌고 돌고
  - 빙빙 돌며
  lexicon: HALOT
  rationale: 반복 분사는 끊임없는 회전의 리듬을 살려야 하므로, 한국어에서도 자연스럽게 반복감을 주는 ‘돌고 돌아’로 옮겼습니다.
- source_word: סְבִיבֹתָיו
  english_pob_choice: its circuits
  chosen_korean: 그 도는 길
  alternatives_korean:
  - 그 순환
  - 그 둘레
  - 그 순환의 길
  lexicon: HALOT
  rationale: 직역된 ‘순환들’은 어색할 수 있어, 바람이 반복적으로 도는 경로라는 뜻을 살려 ‘그 도는 길’로 풀었습니다.
- source_word: שָׁב
  english_pob_choice: returns
  chosen_korean: 되돌아옵니다
  alternatives_korean:
  - 돌아옵니다
  - 되돌아갑니다
  lexicon: HALOT
  rationale: שׁוּב의 되돌아감이라는 순환적 의미를 분명히 하면서, 앞의 ‘도는’과 대응되도록 ‘되돌아옵니다’로 했습니다.
theological_decisions:
- issue: רוּחַ의 의미
  chosen_reading: 자연 현상인 바람
  alternative_readings:
  - 영
  - 숨
  rationale: 문맥이 창조 세계의 반복되는 관찰을 열거하므로, 신학적 의미를 끌어들이지 않고 자연 현상으로 읽는 것이 본문 의도에 가장 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
