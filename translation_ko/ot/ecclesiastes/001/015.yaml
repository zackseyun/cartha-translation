translation:
  language: ko
  text: 굽은 것은 곧게 할 수 없고, 모자라는 것은 셀 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곧게 할 수 없다’는 직역의 뜻이며, 영어 POB의 대안처럼 ‘뒤틀린 것은 곧게 펴질 수 없다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀 수 없습니다’는 ‘번호를 매길 수 없다/헤아릴 수 없다’의 자연스러운 현대 한국어 표현입니다.
    reason: lexical_alternative
