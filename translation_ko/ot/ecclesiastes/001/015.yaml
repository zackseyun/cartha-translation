  source_fidelity: 첫 행은 히브리어의 ‘굽은 것’과 ‘곧게 하다’의 비유를 대체로 충실히 보존합니다. 그러나 חֶסְרוֹן은 단순히 ‘모자라는 사물’보다 ‘부족/결핍된 것’이라는 추상적 평행 표현에 가깝므로 ‘부족한 것’이 더 정확합니다. 두 불가능 진술도 유지했습니다.
  naturalness: ‘굽은 것은 곧게 할 수 없으며, 부족한 것은 셀 수 없습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 잠언적 대구를 잘 드러냅니다. 각주 표지를 해당 절에 직접 붙여 참조 범위를 분명히 했습니다.
  terminology: ‘굽은/곧게’는 עוה와 תקן의 형상을 보존합니다. ‘부족한 것’은 חֶסְרוֹן의 추상성을, ‘셀 수 없습니다’는 נִמְנוֹת의 ‘계수되다’ 의미를 무리 없이 반영합니다.
