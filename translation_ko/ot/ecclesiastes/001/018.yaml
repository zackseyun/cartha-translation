  lexicon: HALOT
  rationale: 전도서에서 כָּעַס은 단순한 분노보다 내적 불편, 괴로움, 번민에 가까우므로 ‘번뇌’가 문맥상 가장 잘 맞습니다.
- source_word: בְּרֹב חָכְמָה
  english_pob_choice: with much wisdom
  chosen_korean: 지혜가 많으면
  alternatives_korean:
  - 많은 지혜 가운데
  - 지혜가 풍부하면
  lexicon: HALOT
  rationale: בְּ + רֹב은 조건·상황의 뉘앙스를 가지므로 한국어에서는 자연스럽게 조건문으로 옮겨 ‘지혜가 많으면’이라고 했습니다.
- source_word: יוֹסִיף דַּעַת / יוֹסִיף מַכְאוֹב
  english_pob_choice: he who increases knowledge increases pain
  chosen_korean: 지식을 더하는 사람은 아픔도 더합니다
  alternatives_korean:
  - 지식을 늘리는 사람은 고통도 늘립니다
  - 지식을 더할수록 아픔도 더합니다
  lexicon: HALOT
  rationale: 반복되는 יסף의 평행 구조를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘더하는 사람은 … 더합니다’로 대응했습니다.
- source_word: מַכְאוֹב
  english_pob_choice: pain
  chosen_korean: 아픔
  alternatives_korean:
  - 고통
  - 슬픔
  - 상처
  lexicon: HALOT
  rationale: מַכְאוֹב는 신체적·정서적 아픔을 아우를 수 있어, 전도서의 성찰적 어조에 맞는 포괄적 표현인 ‘아픔’을 택했습니다.
theological_decisions:
- issue: 전도서 1:18의 인식론적 역설을 한국어에서 어떻게 유지할지
  chosen_reading: 지혜와 지식은 단순한 선으로만 제시되지 않고, 인간 경험 안에서는 번뇌와 아픔을 동반하는 것으로 옮겼습니다.
  alternative_readings:
  - 지혜는 기쁨을 준다로 완화하기
  - 교훈적으로만 정리해 부정적 뉘앙스를 약화하기
  rationale: 본문은 지혜의 가치 자체를 부정하기보다 그 누적이 실존적 고통을 증대시킨다는 역설을 말하므로, 그 긴장을 그대로 유지해야 합니다.
  doctrine_reference: 전도서의 지혜문학적 역설과 인간 한계에 대한 묵상
