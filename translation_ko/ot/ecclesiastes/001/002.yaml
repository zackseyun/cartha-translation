  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
  footnotes:
  - marker: a
    text: Hebrew הֶבֶל (hevel), literally 'breath' or 'vapor.' Qoheleth uses this word across 38 occurrences in the book, metaphorically carrying three linked senses at once — transient (like a breath that's already gone), elusive (can't be grasped), and ironic (what was expected and what happens don't match). No single English word covers all three. We render with the concrete image — 'breath' in the superlative, 'mere breath' in the predicate — and let context develop each sense. Traditional English renderings include 'vanity' (KJV — misread in modern English as 'pride') and 'meaninglessness' (NIV — imports a nihilism Qoheleth's argument does not assert). The construct הֲבֵל הֲבָלִים is a Hebrew absolute-superlative, like 'song of songs' or 'holy of holies.'
    reason: lexical_choice
  - marker: b
    text: Qoheleth is the Hebrew title/name traditionally rendered 'the Teacher' or 'the Preacher' — both interpretive and each narrowing the semantic range differently. We transliterate to preserve the openness.
    reason: lexical_alternative
translation:
  language: ko
  text: “숨결 중의 숨결[a]”이라고 코헬렛[b]이 말합니다. “숨결 중의 숨결, 모든 것은 그저 숨결입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הֶבֶל(hevel)은 문자적으로 ‘숨결’ 또는 ‘증기’를 뜻하며, 전도서에서는 덧없음, 붙잡히지 않음, 그리고 기대와 실제 결과 사이의 어긋남에서 생기는 역설성을 함께 떠올리게 합니다. 절대최상급 구조인 הֲבֵל הֲבָלִים은 ‘노래 중의 노래’처럼 ‘X 중의 X’의 형식입니다.
    reason: source_note
  - marker: b
    text: 코헬렛은 히브리어 호칭으로, 전통적으로 ‘전도자’ 또는 ‘교사’로 옮겨지지만 두 번역 모두 의미를 좁힙니다. 여기서는 히브리어 호칭을 음역해 그 개방성을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  english_pob_choice: breath / mere breath
  chosen_korean: 숨결 / 그저 숨결
  alternatives_korean:
  - 입김
  - 바람
  - 헛것
  - 헛됨
  - 덧없음
  lexicon: HALOT
  rationale: 히브리어 הֶבֶל은 문자적으로 ‘숨결, 증기’에 가깝고 전도서 전체에서 덧없음·붙잡히지 않음·역설적 허무를 함께 지니므로, 추상어로 단정하지 않고 구체적 이미지인 ‘숨결’로 옮겼습니다. 서술부에서는 English POB의 ‘mere breath’에 맞추어 ‘그저 숨결’로 번역해 평가적 디폴트를 살렸습니다.
- source_word: הֲבֵל הֲבָלִים
  english_pob_choice: breath of breaths
  chosen_korean: 숨결 중의 숨결
  alternatives_korean:
  - 숨결들의 숨결
  - 숨결 중의 숨결들
  - 숨결 중의 숨결만
  lexicon: HALOT
  rationale: 히브리어의 ‘X 중의 X’ 절대최상급을 한국어에서 자연스럽게 드러내기 위해 ‘숨결 중의 숨결’로 옮겼습니다. 이 표현은 수사적 최상급을 보존하면서도 본문의 구체적 이미지인 ‘숨결’을 유지합니다.
- source_word: אָמַר
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말했습니다
  - 이르십니다
  lexicon: HALOT
  rationale: 히브리어의 현재형적 발화 공식을 한국어에서도 서술 현재로 옮겨, 전도서의 진술이 인용문처럼 생생하게 들리도록 했습니다.
- source_word: קֹהֶלֶת
  english_pob_choice: Qoheleth
  chosen_korean: Qoheleth
  alternatives_korean:
  - 전도자
  - 교사
  - 설교자
  lexicon: HALOT
  rationale: 이 호칭은 영어 POB처럼 음역을 유지해 의미를 조기 고정하지 않았습니다. ‘전도자’나 ‘교사’는 각각 해석을 좁히므로 본문이 지닌 개방성을 보존하기 위해 음역을 택했습니다.
- source_word: הַכֹּל
  english_pob_choice: everything / all
  chosen_korean: 모든 것은
  alternatives_korean:
  - 전부는
  - 만물은
  - 모든 것이
  lexicon: HALOT
  rationale: 문맥상 הכול의 총괄성을 현대 한국어에서 자연스럽게 전달하는 표현으로 ‘모든 것은’을 택했습니다. 이는 뒤의 술어 ‘그저 숨결입니다’와 함께 포괄적 판정을 형성합니다.
theological_decisions:
- issue: 전도서의 핵심어 הֶבֶל을 어떻게 신학적으로 오해 없이 전달할 것인가
  chosen_reading: ‘숨결’이라는 구체적 이미지를 유지하고, 술어 자리에서는 ‘그저 숨결’로 번역해 평가적 결론을 분명히 했습니다.
  alternative_readings:
  - 헛됨
  - 허무
  - 무의미
  - 덧없음
  - 허망
  rationale: 추상어는 각각 한 측면만 드러내어 전도서가 의도하는 세 층위(덧없음, 붙잡히지 않음, 역설성)를 줄입니다. ‘무의미’는 본문이 말하지 않는 니힐리즘을 불러오기 쉽고, ‘헛됨’이나 ‘허무’는 현대 한국어에서 철학적 뉘앙스로 과도하게 굳어집니다. ‘숨결’은 이미지와 의미 범위를 함께 살립니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
