language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זָרַ֥ח הַ/שֶּׁ֖מֶשׁ וּ/בָ֣א הַ/שָּׁ֑מֶשׁ וְ/אֶ֨ל מְקוֹמ֔/וֹ שׁוֹאֵ֛ף זוֹרֵ֥חַֽ ה֖וּא שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/005.yaml
  text: And the sun rises[a], and the sun goes down, and hastening to its place, it rises there again.
  footnotes:
  - marker: a
    text: Or 'and to its place it hastens; there it rises.' The Hebrew participle שׁוֹאֵף can be understood as 'pants' or more idiomatically 'hastens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 떠오르고 해가 지며, 자기 자리로 서둘러 가서 그곳에서 떠오릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוֹאֵף는 직역하면 ‘헐떡이다’이며, 문맥에서는 ‘서두르다’ 또는 ‘급히 가다’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַח
  english_pob_choice: And the sun rises
  chosen_korean: 해가 떠오르고
  alternatives_korean:
  - 해가 일어나고
  - 해가 솟고
  lexicon: HALOT
  rationale: זָרַח는 특히 해가 빛나며 떠오르는 모습을 가리키므로, 현대 한국어에서 자연스럽고 관찰적인 표현인 ‘떠오르고’로 옮겼습니다.
- source_word: וּבָא
  english_pob_choice: and the sun goes down
  chosen_korean: 해가 지며
  alternatives_korean:
  - 해가 내려가며
  - 해가 들어가며
  lexicon: HALOT
  rationale: בוא는 해와 함께 관용적으로 ‘지다’의 뜻을 이루므로, 운동 이미지를 살리되 한국어 관용에 맞게 ‘해가 지며’로 옮겼습니다.
- source_word: מְקוֹמוֹ שׁוֹאֵף
  english_pob_choice: and hastening to its place
  chosen_korean: 자기 자리로 달려가서는
  alternatives_korean:
  - 자기 자리로 급히 가서는
  - 자기 곳을 그리워하며
  lexicon: HALOT
  rationale: שׁוֹאֵף는 ‘헐떡이다/달려들다/서둘다’의 의미 범위를 가지며, POB의 핵심 선택인 ‘hastening’에 맞춰 동작성을 살려 ‘달려가서는’으로 옮겼습니다. מְקוֹם의 기본 뜻도 과장 없이 ‘자리’로 반영했습니다.
- source_word: זוֹרֵחַ הוּא שָׁם
  english_pob_choice: it rises there again
  chosen_korean: 거기서 다시 떠오릅니다
  alternatives_korean:
  - 거기서 다시 빛납니다
  - 거기서 다시 솟아오릅니다
  lexicon: HALOT
  rationale: זוֹרֵחַ는 앞의 ‘떠오르다’와 병행되는 현재분사이므로 같은 동사군을 유지했고, הוּא שָׁם의 되돌아옴과 반복성을 한국어의 ‘다시’로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 전도서 1:5의 반복·순환 이미지의 표현 방식
  chosen_reading: 해의 운동을 단순한 정보가 아니라 피조 세계의 반복되는 질서로 읽히도록, 동작 동사들을 연쇄해 순환성을 유지했습니다.
  alternative_readings:
  - 보다 설명적인 문장으로 풀어 ‘돌아갑니다’ 중심으로 번역하는 방식
  - 해석적 요소를 더해 ‘제자리로 되돌아옵니다’로 정리하는 방식
  rationale: 히브리어는 관찰문으로서 해의 움직임을 압축적으로 나열하므로, 한국어도 이를 과도하게 해설하지 않고 반복 구조를 살리는 쪽이 본문의 효과를 더 잘 전달합니다.
  doctrine_reference: 전도서의 관찰 지혜 문학적 서술
- issue: שׁוֹאֵף의 이미지 보존
  chosen_reading: ‘달려가서는’으로 옮겨, 단순한 위치 이동이 아니라 서두르는 움직임의 생동감을 살렸습니다.
  alternative_readings:
  - ‘서둘러’처럼 더 평이하게 처리하는 방식
  - ‘헐떡이며’처럼 신체적 이미지를 강하게 드러내는 방식
  rationale: 원어는 단순한 중립적 이동이 아니라 생동하는 의인화 이미지를 담고 있으므로, 한국어에서도 그 긴장을 너무 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 히브리어 시적/지혜문학의 수사 보존
