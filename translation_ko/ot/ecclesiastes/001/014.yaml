  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת כָּל הַֽ/מַּעֲשִׂ֔ים שֶֽׁ/נַּעֲשׂ֖וּ תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֥ה הַ/כֹּ֛ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/014.yaml
  text: I have seen all the works that are done under the sun[a], and behold[b], all is vanity and a striving after wind.
  footnotes:
  - marker: a
    text: Or 'vapor,' 'breath,' or 'futility' for 'vanity'; the Hebrew הֶבֶל in Ecclesiastes suggests what is fleeting, insubstantial, and frustrating rather than simply 'meaningless.'
    reason: lexical_alternative
  - marker: b
    text: Or 'striving after wind.' The Hebrew phrase רְעוּת רוּחַ is idiomatic and likely conveys futile pursuit; a more literal possibility is 'shepherding the wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 해 아래에서 행해지는 모든 일들을 보았습니다. 보십시오, 모든 것이 헛되고 바람을 좇는 일입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛되고’는 히브리어 הֶבֶל의 전통적 대응으로, 여기서는 ‘덧없음’, ‘실체 없음’, ‘좌절스러움’의 뜻을 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바람을 좇는 일’은 רְעוּת רוּחַ의 관용적 의미를 풀어 옮긴 것입니다. 더 문자적인 가능성으로는 ‘바람을 목양하는 일’이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I have seen
  chosen_korean: 나는 ... 보았습니다
  alternatives_korean:
  - 나는 ... 보았습니
  - 보았습니다
  lexicon: HALOT
  rationale: 완료형의 회고적 관찰을 자연스러운 한국어로 옮기되, 전도서의 성찰적 진술을 살리기 위해 현재와 연결된 관찰 어감을 유지했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 해 아래
  - 태양 아래에서
  lexicon: HALOT
  rationale: 전도서의 핵심 관용구를 한국어로 직역에 가깝게 옮겨, 인간 세계의 한계를 가리키는 문맥을 보존했습니다.
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛되고
  alternatives_korean:
  - 허무하고
  - 덧없고
  - 헛된
  lexicon: HALOT
  rationale: 전통적 교회어의 ‘헛됨’ 계열을 유지하되, 단순한 ‘무의미’로 축소하지 않고 덧없음·실체 없음·좌절의 뉘앙스를 담기 위해 형용사형으로 처리했습니다.
- source_word: רְעוּת רוּחַ
  english_pob_choice: a striving after wind
  chosen_korean: 바람을 좇는 일
  alternatives_korean:
  - 바람을 쫓는 일
  - 바람을 붙드는 일
  - 바람을 목양하는 일
  lexicon: HALOT
  rationale: 관용구의 무익한 추구라는 뜻을 현대 한국어로 분명하게 드러내기 위해 ‘좇는 일’로 옮겼습니다. 직역에 가까운 ‘목양하는’은 의미 전달이 약하므로 본문에는 쓰지 않았습니다.
theological_decisions:
- issue: 전도서 1:14의 평가어 ‘הֶבֶל’의 신학적 강도
  chosen_reading: ‘헛되고’로 옮겨, 단순한 감정 표현이 아니라 피조 세계 안의 덧없고 붙잡을 수 없는 বাস্ত를 드러내는 진술로 읽게 했습니다.
  alternative_readings:
  - 허무하고
  - 무의미하고
  - 덧없고
  rationale: 전도서의 반복 어휘가 지닌 긴장과 관찰의 무게를 보존하기 위해, ‘무의미’처럼 사상적 결론으로 지나치게 닫지 않았습니다.
  doctrine_reference: 전도서의 지혜문학적 실존 진술
- issue: 반복 관찰의 수사와 직접 호소
  chosen_reading: ‘보십시오’로 옮겨 독자를 향한 주목 요청을 살렸습니다.
  alternative_readings:
  - 보라
  - 이것을 보십시오
  rationale: וְהִנֵּה의 주의 환기 기능을 현대 합쇼체로 자연스럽게 재현하기 위한 선택입니다.
  doctrine_reference: 수사적 담화 표지
