  text: What has been is what will be[a], and what has been done is what will be done; and there is nothing new under the sun.
  footnotes:
  - marker: a
    text: Or, 'What was is what will be, and what was done is what will be done.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이미 있었던 것은 장차 있을 것이고[a], 이미 행해진 것은 장차 행해질 것입니다. 해 아래에는 새것이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이미 있었던 것은 장차 있을 것이고, 이미 행해진 것은 장차 행해질 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה שֶׁהָיָה / הוּא שֶׁיִּהְיֶה
  english_pob_choice: What has been is what will be
  chosen_korean: 이미 있었던 것은 장차 있을 것입니다
  alternatives_korean:
  - 있었던 것은 있을 것입니다
  - 있던 것은 장차 있을 것입니다
  lexicon: WLC + POB English audit
  rationale: 히브리어의 동일 구조를 따라 과거에 이미 있었던 것과 미래에도 있을 것을 평행적으로 살리기 위해 ‘이미 있었던 것 / 장차 있을 것’으로 옮겼습니다.
- source_word: וּמַה שֶׁנַּעֲשָׂה / הוּא שֶׁיֵּעָשֶׂה
  english_pob_choice: and what has been done is what will be done
  chosen_korean: 이미 행해진 것은 장차 행해질 것입니다
  alternatives_korean:
  - 행해졌던 것은 행해질 것입니다
  - 해진 것은 될 것입니다
  lexicon: WLC + POB English audit
  rationale: נַעֲשָׂה/יֵּעָשֶׂה의 수동·결과적 흐름을 보존하기 위해 능동적으로 풀지 않고 ‘행해진 / 행해질’로 대응했습니다.
- source_word: וְאֵין כָּל חָדָשׁ
  english_pob_choice: and there is nothing new
  chosen_korean: 새것이 없습니다
  alternatives_korean:
  - 새로운 것이 없습니다
  - 아무것도 새롭지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 존재문을 자연스러운 한국어로 살리기 위해 ‘새것이 없습니다’로 옮겼고, 추상적 ‘새로운 것’보다 본문의 간명한 단정을 유지했습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에는
  alternatives_korean:
  - 태양 아래에는
  - 세상에는
  lexicon: HALOT
  rationale: 전도서의 핵심 관용구를 직역하여 인간 삶의 관찰 범위를 가리키는 표현을 보존했습니다.
theological_decisions:
- issue: ‘해 아래’의 범위
  chosen_reading: 이 진술을 인간 삶의 관찰 가능한 영역에 대한 일반 관찰로 유지했습니다.
  alternative_readings:
  - 모든 의미에서 절대적으로 어떤 새것도 없다는 형이상학적 주장
  rationale: ‘해 아래’가 관찰 세계의 범위를 제한하므로, 본문 자체가 말하는 보편적 수사만 살리고 절대화는 피했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
