source:
  edition: WLC
  text: יֵ֥שׁ דָּבָ֛ר שֶׁ/יֹּאמַ֥ר רְאֵה זֶ֖ה חָדָ֣שׁ ה֑וּא כְּבָר֙ הָיָ֣ה לְ/עֹֽלָמִ֔ים אֲשֶׁ֥ר הָיָ֖ה מִ/לְּ/פָנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/010.yaml
  text: Is there a thing of which one says[a], “See, this is new”? It has already been in the ages before us.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “It has already existed long ago, in the ages before us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 「보십시오, 이것은 새것입니다」라고 말할 만한 것이 있습니까? 그것은 이미 우리보다 앞선 세대들에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리보다 앞선 세대들에’는 직역적 표현으로, 뜻을 풀면 ‘오래전부터 이미 존재해 왔습니다’라는 의미입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  english_pob_choice: Is there
  chosen_korean: 있습니까
  alternatives_korean:
  - 있습니다
  lexicon: HALOT
  rationale: 문맥상 수사 의문문이므로 단순 서술보다 의문형으로 옮기는 것이 자연스럽습니다.
- source_word: שֶׁיֹּאמַר
  english_pob_choice: of which one says
  chosen_korean: 어떤 사람이 …라고 말할 만한
  alternatives_korean:
  - 사람들이 …라고 말하는
  - 어떤 이가 …라고 말하는
  lexicon: HALOT
  rationale: 주어가 특정 인물이라기보다 일반적·불특정 화법이므로, 한국어에서는 ‘어떤 사람이’로 풀어 일반성을 살렸습니다.
- source_word: רְאֵה זֶה חָדָשׁ הוּא
  english_pob_choice: See, this is new
  chosen_korean: 「보십시오, 이것은 새것입니다」
  alternatives_korean:
  - 「보라, 이것은 새롭습니다」
  - 「보십시오, 이것은 새롭습니다」
  lexicon: HALOT
  rationale: 느낌표식 감탄보다 관찰을 촉구하는 명령이므로 ‘보십시오’를 택했고, 명사적 표현인 ‘새것’으로 ‘새롭다’의 주장성을 살렸습니다.
- source_word: לְעֹלָמִים
  english_pob_choice: in the ages
  chosen_korean: 우리보다 앞선 세대들에
  alternatives_korean:
  - 옛 세대들에
  - 옛 시대들에
  lexicon: HALOT
  rationale: 히브리어의 복수적 시간감(‘세대들/시대들’)을 살리되 한국어 독자에게는 ‘우리보다 앞선 세대들’이 가장 분명하게 전달됩니다.
theological_decisions:
- issue: 전도서의 반복적 허무 진술을 현대 한국어로 얼마나 직접적으로 드러낼지
  chosen_reading: ‘새것’이라는 주장에 대한 반박을 직설적으로 유지했습니다.
  alternative_readings:
  - ‘새로운 것’이라고 완곡하게 표현
  - ‘새롭다’로만 번역해 명사성을 약화
  rationale: 본문은 지혜문학적 성찰을 넘어 ‘새로움’의 주장 자체를 상대화하므로, 직설적 표현이 저자의 논지를 더 잘 드러냅니다.
  doctrine_reference: 전도서 1:9-10의 반복과 인식의 한계
