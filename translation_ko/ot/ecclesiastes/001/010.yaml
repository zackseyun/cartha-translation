  - severity: low
    issue: ‘새것입니다’가 형용사 술어를 명사화함
    rationale: חָדָשׁ הוּא는 ‘이것은 새롭다’입니다. ‘새것’도 의미상 가능하지만, ‘새롭습니다’가 원문의 문법과 주장 형태를 더 직접적으로 반영합니다.
  - severity: medium
    issue: 각주의 ‘직역적 표현’ 및 해설형 내용
    rationale: 현 본문은 엄밀히 직역이 아니며, 각주는 본문의 의미를 한 방향으로 해설하기보다 לְעֹלָמִים의 관용적 시간 표현에 대한 대안을 간결히 제시하는 것이 적절합니다.
