  text: כָּל הַ/נְּחָלִים֙ הֹלְכִ֣ים אֶל הַ/יָּ֔ם וְ/הַ/יָּ֖ם אֵינֶ֣/נּוּ מָלֵ֑א אֶל מְק֗וֹם שֶׁ֤/הַ/נְּחָלִים֙ הֹֽלְכִ֔ים שָׁ֛ם הֵ֥ם שָׁבִ֖ים לָ/לָֽכֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/007.yaml
  text: All the streams flow into the sea[a], yet the sea is not full; to the place where the streams flow[b], there they return to flow again.
  footnotes:
  - marker: a
    text: Or 'rivers' for 'streams.' The Hebrew נְחָלִים can refer to streams, wadis, or riverbeds depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to the place where the streams go, there they return to go.' The wording may evoke the recurring cycle of waters without explicitly describing its mechanism.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 시내가 바다로 흘러가지만 바다는 차지 않습니다. 시내가 흘러가는 바로 그곳으로, 거기로 다시 흘러갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְחָלִים는 문맥에 따라 시내, 와디, 하천바닥을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘시내가 가는 곳, 거기로 그들이 다시 가기 위해 돌아온다’에 가깝습니다. 본문은 순환의 반복을 압축해 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  english_pob_choice: streams
  chosen_korean: 시내
  alternatives_korean:
  - 강들
  - 개울들
  - 하천들
  lexicon: HALOT
  rationale: נחל은 문맥에 따라 시내, 와디, 하천바닥을 가리킬 수 있는데, 이 시에서는 계속 흘러가는 물길의 이미지를 살리기 위해 ‘시내’가 가장 자연스럽고 과도하게 구체화하지 않습니다.
- source_word: הֹלְכִים
  english_pob_choice: flow
  chosen_korean: 흘러가지만
  alternatives_korean:
  - 갑니다
  - 흐릅니다
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘가다’이지만 물에 대해서는 한국어에서 ‘흘러가다’가 관용적이므로, 원문의 움직임을 자연스럽게 옮겼습니다.
- source_word: אֵינֶנּוּ מָלֵא
  english_pob_choice: is not full
  chosen_korean: 차지 않습니다
  alternatives_korean:
  - 가득 차지 않습니다
  - 다 차지 않습니다
  lexicon: HALOT
  rationale: 원문은 바다의 상태를 간단히 말하므로, 반복의 뜻을 과잉 설명하지 않고 짧고 직접적으로 ‘차지 않습니다’로 옮겼습니다.
- source_word: לָלָכֶת
  english_pob_choice: to flow again
  chosen_korean: 다시 흘러갑니다
  alternatives_korean:
  - 다시 가려고
  - 계속 흘러가려고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘가다’이지만 주어가 물길이므로 끝의 목적형까지 한국어에서는 ‘다시 흘러갑니다’로 풀어 주어 순환의 반복을 드러냈습니다.
theological_decisions:
- issue: 순환 구조의 표현
  chosen_reading: 바다로 갔다가 다시 돌아오는 반복적 순환을 본문 자체의 압축된 표현대로 유지했습니다.
  alternative_readings:
  - 수문학적 원리를 설명하는 방식으로 풀어 쓰기
  - ‘비어 있지 않다’의 철학적 함의를 덧붙이기
  rationale: 전도서는 자연의 반복을 묘사하지만, 본문이 직접 말하지 않는 설명을 덧붙이면 시적 긴장이 약해집니다.
  doctrine_reference: 전도서 1장 문맥의 관찰적 지혜 문학
- issue: שָׁם הֵם שָׁבִים לָלָכֶת의 중복 강조
  chosen_reading: ‘거기로 다시 흘러갑니다’로 중복과 회귀를 압축해 살렸습니다.
  alternative_readings:
  - ‘거기서 그들은 다시 가려고 돌아옵니다’처럼 직역하기
  - ‘그곳으로 다시 돌아가 흘러갑니다’처럼 해설을 덧붙이기
  rationale: 원문의 반복적 리듬은 유지하되, 현대 한국어에서 자연스럽게 들리도록 압축 표현을 택했습니다.
  doctrine_reference: 히브리 시문학의 반복·평행법
