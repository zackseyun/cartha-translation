revisions:
- from: 나는 지혜로 모든 것이 하늘 아래서 이루어지는 것을 두루 살피고 탐구하려고 마음을 쏟았습니다. 그것은 하나님께서 사람의 아들들에게 주셔서 그것에 얽매이게 하신 괴로운 과업입니다.[a][b]
  to: 나는 지혜로 하늘 아래에서 이루어지는 모든 일을 두루 살피고 탐구하려고 마음을 쏟았습니다. 그것은 하나님께서 사람들에게[a] 그 일로 수고하게 하시려고 주신 괴로운 일입니다.[b]
  rationale: The revision replaces an unnatural literal Korean calque with an idiomatic generic expression while preserving the Hebrew wording and gendered form in a note. It also softens the overly determinate ‘bound to it’ into wording that expresses labor and burden, consistent with the lexical range of ענה and the context of a grievous human task. No theological interpretation beyond the source’s negative evaluation is introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the deliberate application of the heart, the comprehensive scope of inquiry, and the burdensome character of the task. However, ‘사람의 아들들에게’ is an overly literal and unnatural Korean calque for the generic Hebrew לִבְנֵי הָאָדָם, and ‘그것에 얽매이게 하신’ overstates the sense of לַעֲנוֹת בּוֹ as bondage. A rendering referring to human beings, with the Hebrew form noted, and a wording of labor/being burdened better preserve both meaning and ambiguity.
  naturalness: The revised wording is modern standard Korean in formal-polite style. ‘하늘 아래에서 이루어지는 모든 일’ is clearer than placing ‘모든 것이’ before the embedded passive clause. The footnote markers are placed at the expressions they clarify rather than both being appended to the sentence end.
  terminology: ‘마음을 쏟았습니다,’ ‘두루 살피고 탐구하려고,’ and ‘괴로운 일’ appropriately render the Hebrew idiom, paired investigative verbs, and עִנְיַן רָע without assigning moral evil to God. ‘사람들에게’ naturally carries the generic human reference; the literal masculine expression is retained in a footnote. ‘그 일로 수고하게’ retains the burdened-occupation sense of לַעֲנוֹת בּוֹ without prematurely selecting the stronger sense of being bound.
  issues:
  - severity: medium
    issue: ‘사람의 아들들에게’ is unnatural and potentially misleading in contemporary Korean.
    rationale: Although formally close to ‘sons of man,’ it is not an idiomatic generic expression in Korean and can suggest a restricted group. The Hebrew is generic for humanity in this context. ‘사람들에게’ conveys the referent naturally, while a note preserves the literal wording.
  - severity: medium
    issue: ‘그것에 얽매이게 하신’ is too restrictive for לַעֲנוֹת בּוֹ.
    rationale: The verb can denote being occupied, laboring, or being afflicted in connection with the task. ‘얽매이다’ makes bondage the main assertion. ‘그 일로 수고하게’ preserves the burdensome labor while allowing the alternatives in the footnote.
  - severity: low
    issue: Both footnote anchors occur at the end rather than at their respective referents.
    rationale: Anchoring each note after the relevant expression improves readability and makes the lexical relationship unambiguous.
  revised_text: 나는 지혜로 하늘 아래에서 이루어지는 모든 일을 두루 살피고 탐구하려고 마음을 쏟았습니다. 그것은 하나님께서 사람들에게[a] 그 일로 수고하게 하시려고 주신 괴로운 일입니다.[b]
  revised_footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사람의 아들들에게’이며, 남성형 표현이지만 여기서는 인류 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 일로 수고하게 하시려고’는 ‘그 일에 힘쓰게 하시려고’ 또는 ‘그 일로 괴로움을 겪게 하시려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural literal Korean calque with an idiomatic generic expression while preserving the Hebrew wording and gendered form in a note. It also softens the overly determinate ‘bound to it’ into wording that expresses labor and burden, consistent with the lexical range of ענה and the context of a grievous human task. No theological interpretation beyond the source’s negative evaluation is introduced.
