  edition: WLC
  text: וְ/נָתַ֣תִּי אֶת לִבִּ֗/י לִ/דְר֤וֹשׁ וְ/לָ/תוּר֙ בַּֽ/חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁמָ֑יִם ה֣וּא עִנְיַ֣ן רָ֗ע נָתַ֧ן אֱלֹהִ֛ים לִ/בְנֵ֥י הָ/אָדָ֖ם לַ/עֲנ֥וֹת בּֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/013.yaml
  text: And I set my heart to seek and to explore by wisdom all that is done under heaven[b][a]. It is an unhappy task God has given to the sons of man to be occupied with.
  footnotes:
  - marker: a
    text: Or 'to humankind' / 'to human beings.' The Hebrew reads 'to the sons of man,' a masculine expression used generically for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'to be afflicted by it' or 'to toil in it.' The Hebrew can carry both the sense of being occupied with something and of being burdened by it.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 지혜로 모든 것이 하늘 아래서 이루어지는 것을 두루 살피고 탐구하려고 마음을 쏟았습니다. 그것은 하나님께서 사람의 아들들에게 주셔서 그것에 얽매이게 하신 괴로운 과업입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 아들들’은 히브리어의 남성형 표현이지만, 문맥상 인류 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것에 얽매이게 하신’은 ‘그것으로 애쓰게 하신’ 또는 ‘그것에 괴로움을 겪게 하신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  english_pob_choice: And I set my heart
  chosen_korean: 나는 … 마음을 쏟았습니다
  alternatives_korean:
  - 나는 … 마음을 두었습니다
  - 나는 … 뜻을 두었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 감정이 아니라 의지적 결심을 뜻하므로, 한국어에서는 ‘마음을 쏟다’로 내적 집중과 결심을 함께 살렸습니다.
- source_word: לִדְרוֹשׁ וְלָתוּר בַּחָכְמָה
  english_pob_choice: to seek and to explore by wisdom
  chosen_korean: 지혜로 … 두루 살피고 탐구하려고
  alternatives_korean:
  - 지혜로 … 찾고 살피려고
  - 지혜로 … 조사하고 탐색하려고
  lexicon: HALOT
  rationale: דרש의 ‘찾다/구하다’와 תור의 ‘살피다/탐구하다’라는 두 동사를 구별해, ‘두루 살피고 탐구하다’로 이중적 조사 행위를 살렸습니다.
- source_word: עִנְיַן רָע
  english_pob_choice: an unhappy task
  chosen_korean: 괴로운 과업
  alternatives_korean:
  - 고통스러운 일
  - 불행한 과업
  - 괴로운 일
  lexicon: HALOT
  rationale: ‘과업/일’의 의미를 유지하면서 רָע의 도덕적 ‘악’보다 짐스럽고 고통스러운 성격을 드러내기 위해 ‘괴로운’으로 옮겼습니다.
- source_word: לִבְנֵי הָאָדָם
  english_pob_choice: to the sons of man
  chosen_korean: 사람의 아들들에게
  alternatives_korean:
  - 인간에게
  - 사람들에게
  - 인자들에게
  lexicon: HALOT
  rationale: 히브리어의 남성형이지만 보편적 인간을 가리키는 표현이므로, 본문 형식을 살려 직역하되 한국어에서 자연스러운 ‘사람의 아들들’로 옮겼습니다.
- source_word: לַעֲנוֹת בּוֹ
  english_pob_choice: to be occupied with
  chosen_korean: 그것에 얽매이게 하신
  alternatives_korean:
  - 그것을 감당하게 하신
  - 그것으로 애쓰게 하신
  - 그것을 떠맡게 하신
  lexicon: HALOT
  rationale: עָנָה의 ‘억눌리다/괴로움을 겪다/매여 있다’는 뉘앙스를 반영하여, 단순한 중립적 ‘관여’보다 부담과 종속을 함께 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 하나님이 주신 것의 성격을 어떻게 번역할지
  chosen_reading: ‘괴로운 과업’으로 옮겨, 하나님을 악의 근원처럼 만들지 않으면서 본문의 고된 성격을 보존했습니다.
  alternative_readings:
  - 악한 과업
  - 나쁜 일
  - 불행한 과업
  rationale: 본문은 인간에게 주어진 삶의 수고와 한계를 말하지, 하나님이 도덕적 악을 주셨다고 단정하지 않습니다. לכן רָע의 부정적 평가를 ‘괴로운’으로 유지하는 것이 본문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 명시하지 않는 신학적 주장을 덧붙이지 말고, 어휘의 긴장을 보존한다.'
