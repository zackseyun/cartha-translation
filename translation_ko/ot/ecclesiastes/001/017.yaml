language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶתְּנָ֤/ה לִבִּ/י֙ לָ/דַ֣עַת חָכְמָ֔ה וְ/דַ֥עַת הוֹלֵל֖וֹת וְ/שִׂכְל֑וּת יָדַ֕עְתִּי שֶׁ/גַּם זֶ֥ה ה֖וּא רַעְי֥וֹן רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/017.yaml
  text: And I set my heart to know wisdom[a], and to know madness and folly; I came to know that this too is a chasing after wind.
  footnotes:
  - marker: a
    text: Or 'striving after wind'; traditionally, 'vexation of spirit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 지혜를 알고자, 또 광기와 어리석음을 알고자 내 마음을 기울였습니다. 그러나 나도 이것이 바람을 잡으려는 일임을 알게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바람을 좇는 일’; 전통적으로는 ‘영의 번뇌’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה לִבִּי
  english_pob_choice: I set my heart
  chosen_korean: 내 마음을 기울였습니다
  alternatives_korean:
  - 내 마음을 두었습니다
  - 내 마음을 바쳤습니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 내적 의지와 주의를 특정 대상에 돌리는 뜻이므로, 한국어에서는 자연스럽게 ‘마음을 기울이다’로 옮겨 원문의 방향성을 살렸습니다.
- source_word: לָדַעַת / וְדַעַת
  english_pob_choice: to know / and to know
  chosen_korean: 알고자 / 또 알고자
  alternatives_korean:
  - 알기 위해 / 또 알기 위해
  - 알아보려고 / 또 알아보려고
  lexicon: HALOT
  rationale: 반복되는 ידע 계열을 한국어에서도 동사 반복으로 살려, 지혜와 광기·어리석음을 ‘알아내려는’ 탐구의 평행 구조를 유지했습니다.
- source_word: הוֹלֵלוֹת / שִׂכְלוּת
  english_pob_choice: madness / folly
  chosen_korean: 광기와 어리석음
  alternatives_korean:
  - 미친 짓과 어리석음
  - 광란과 어리석음
  lexicon: HALOT
  rationale: 첫 번째 말은 단순한 어리석음보다 비정상성·광란의 뉘앙스가 강하므로 ‘광기’로, 뒤의 용어는 지혜의 반대말로 익숙한 ‘어리석음’으로 구분했습니다.
- source_word: רַעְיוֹן רוּחַ
  english_pob_choice: a chasing after wind
  chosen_korean: 바람을 잡으려는 일
  alternatives_korean:
  - 바람을 쫓는 일
  - 헛바람을 좇는 일
  lexicon: HALOT
  rationale: 직역적인 ‘바람을 쫓다/잡다’의 이미지를 유지하면서도, 전도서 문맥의 허무한 추구를 한국어로 분명하게 드러내기 위해 ‘바람을 잡으려는 일’로 옮겼습니다.
theological_decisions:
- issue: 전도서 특유의 결론적 인식 표현
  chosen_reading: ‘그러나 나도 이것이…임을 알게 되었습니다’로 결과적 발견을 드러냈습니다.
  alternative_readings:
  - ‘내가 알게 되었습니다’
  - ‘나는 알았습니다’
  rationale: 히브리어 완료형이 조사·탐구의 끝에서 얻은 결론을 말하므로, 단순 과거보다 ‘알게 되었습니다’가 문맥의 발견성을 더 잘 살립니다.
  doctrine_reference: 지혜문학의 관찰적 서술
