base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/011.yaml
  text: There is no remembrance of the former ones[a], and even of the later ones who will be, there will be no remembrance among those who will come afterward.
  footnotes:
  - marker: a
    text: Or 'There is no memory of the former, and even the later who are yet to be will have no memory among those who come still later.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이전 세대에 대한 기억은 없습니다[a]. 또한 뒤에 올 후대에 대해서도 그다음 세대들 가운데서는 기억이 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전 세대에 대한 기억이 없습니다. 또한 아직 올 뒤의 세대들도 그다음 세대들 가운데서는 기억되지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹן / זִכָּרוֹן
  english_pob_choice: remembrance
  chosen_korean: 기억
  alternatives_korean:
  - 기념
  - 기억됨
  - 회상
  lexicon: HALOT
  rationale: 문맥상 추상명사로서 ‘remembrance’에 해당하므로 자연스러운 현대 한국어 ‘기억’을 택하되, 단순 심리 상태보다 전승의 소멸을 드러내도록 했습니다.
- source_word: לָרִאשֹׁנִים
  english_pob_choice: of the former ones
  chosen_korean: 이전 세대에 대한
  alternatives_korean:
  - 옛사람들에 대한
  - 먼저 온 사람들에 대한
  - 선대에 대한
  lexicon: HALOT
  rationale: 히브리어의 넓은 지시 대상을 살려, 특정 개인보다 앞선 세대 전체를 가리키는 표현으로 옮겼습니다.
- source_word: לָאַחֲרֹנִים ... לָאַחֲרֹנָה
  english_pob_choice: of the later ones ... those who will come afterward
  chosen_korean: 뒤에 올 후대 ... 그다음 세대들 가운데서는
  alternatives_korean:
  - 나중 세대 ... 그 뒤에 오는 사람들 가운데서는
  - 후속 세대 ... 뒤이어 올 자들 가운데서는
  lexicon: HALOT
  rationale: ‘later ones’와 ‘those who will come afterward’의 중첩된 시간 순서를 한국어로 분명히 드러내기 위해, ‘뒤에 올 후대’와 ‘그다음 세대들’로 이중 대비를 살렸습니다.
- source_word: עִם
  english_pob_choice: among
  chosen_korean: 가운데서는
  alternatives_korean:
  - 사이에
  - 속에서는
  - 중에는
  lexicon: HALOT
  rationale: 기억의 부재가 어느 집단 안에서 성립하는지를 나타내는 관계를 자연스럽게 전달하는 표현입니다.
theological_decisions:
- issue: 전도서 1:11의 반복 구조와 무상성의 강조
  chosen_reading: ‘기억이 없습니다… 기억이 없을 것입니다’로 반복을 살려, 세대 간 전승의 소멸이라는 냉정한 진술을 유지했습니다.
  alternative_readings:
  - ‘잊혀질 것입니다’로 의역
  - ‘기억되지 않을 것입니다’로 완화
  rationale: 본문은 단순한 망각 예측이 아니라 기억/명명의 단절을 강조하므로, 반복되는 ‘기억’ 어휘를 보존하는 편이 원문의 효과를 더 잘 반영합니다.
  doctrine_reference: 전도서의 지혜 문학적 관찰과 허무의 주제
