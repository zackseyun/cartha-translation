  naturalness: ‘뒤에 올 후대’는 시간 의미가 중복되어 다소 어색합니다. ‘뒤에 있을 이들’ 및 ‘그들보다 뒤에 있을 이들’은 현대 표준어로 자연스러우면서 원문의 단계적 시간 대비를 명료하게 나타냅니다. 합쇼체 종결도 유지합니다.
  terminology: זִכְרוֹן / זִכָּרוֹן의 반복에는 ‘기억’을 유지할 수 있습니다. ‘기념’은 한국어에서 기념 행위나 기념물을 더 강하게 연상시킬 수 있으므로 본문에는 적절하지 않습니다. ‘먼저 있던 이들’은 ‘이전 세대’보다 원문의 포괄성을 더 잘 보존합니다.
