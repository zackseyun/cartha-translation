source:
  edition: WLC
  text: כָּל הַ/דְּבָרִ֣ים יְגֵעִ֔ים לֹא יוּכַ֥ל אִ֖ישׁ לְ/דַבֵּ֑ר לֹא תִשְׂבַּ֥ע עַ֨יִן֙ לִ/רְא֔וֹת וְ/לֹא תִמָּלֵ֥א אֹ֖זֶן מִ/שְּׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/008.yaml
  text: All things are wearisome; a man cannot speak of it. The eye is not satisfied with seeing, nor is the ear filled with hearing.
  footnotes:
  - marker: a
    text: Or 'All words are wearisome'; Hebrew דְּבָרִים can mean 'words,' 'matters,' or 'things.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a man cannot speak'; the Hebrew may mean that no person can fully express the matter, or that the subject is too wearisome to describe.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 것들이 지루합니다. 사람은 그것들을 말할 수 없습니다. 눈은 보는 것으로 만족하지 못하며, 귀는 듣는 것으로 채워지지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 말들이 지루합니다’로도 옮길 수 있습니다. 히브리어 דְּבָרִים는 ‘말들’, ‘일들’, ‘것들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람은 그것을 다 말할 수 없습니다’로도 옮길 수 있습니다. 히브리어는 대상 전체를 충분히 표현할 수 없다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַדְּבָרִים
  english_pob_choice: All things
  chosen_korean: 모든 것들이
  alternatives_korean:
  - 모든 말들이
  - 모든 일들이
  - 모든 것
  lexicon: HALOT
  rationale: דְּבָרִים는 ‘말들/일들/것들’의 범위를 가질 수 있으므로, 전반적 경험을 가리키는 문맥에서 가장 넓고 자연스러운 ‘모든 것들’로 옮겼습니다.
- source_word: יְגֵעִים
  english_pob_choice: are wearisome
  chosen_korean: 지루합니다
  alternatives_korean:
  - 피곤하게 합니다
  - 지치게 합니다
  - 수고스럽습니다
  lexicon: HALOT
  rationale: 여기서는 사물 자체가 인간에게 피로와 소진을 일으킨다는 의미가 핵심이므로, 현대 한국어에서 반복적·끝없는 현실의 피로감을 드러내는 ‘지루합니다’로 표현했습니다.
- source_word: לֹא יוּכַל אִישׁ לְדַבֵּר
  english_pob_choice: a man cannot speak of it
  chosen_korean: 사람은 그것들을 말할 수 없습니다
  alternatives_korean:
  - 아무도 그것들을 다 말할 수 없습니다
  - 한 사람도 그것들을 말할 수 없습니다
  - 사람은 그것을 말할 수 없습니다
  lexicon: HALOT
  rationale: אִישׁ는 일반적 인간을 가리키는 단수이므로 ‘사람’으로 유지했고, 문맥상 ‘모든 것들’을 가리키는 복수 지시를 자연스럽게 반영하기 위해 ‘그것들을’로 옮겼습니다.
- source_word: לֹא תִשְׂבַּע עַיִן לִרְאוֹת / וְלֹא תִמָּלֵא אֹזֶן מִשְּׁמֹעַ
  english_pob_choice: The eye is not satisfied with seeing, nor is the ear filled with hearing
  chosen_korean: 눈은 보는 것으로 만족하지 못하며, 귀는 듣는 것으로 채워지지 않습니다
  alternatives_korean:
  - 눈은 보는 것으로 충분하지 않으며, 귀는 듣는 것으로 가득 차지 않습니다
  - 눈은 보아도 만족하지 못하며, 귀는 들어도 차지 않습니다
  lexicon: HALOT
  rationale: ‘눈/귀’의 대표적 단수는 한국어에서도 일반적 진술로 유지했고, שׂבע와 מלא의 대조를 살려 ‘만족하지 못하며 / 채워지지 않습니다’로 대응시켰습니다.
theological_decisions:
- issue: 허무/피로의 표현 강도
  chosen_reading: ‘지루합니다’는 지적 정보가 아니라 인간 경험의 소진과 끝없음을 드러내는 감각적·실존적 피로를 전면에 둡니다.
  alternative_readings:
  - 피곤합니다
  - 수고스럽습니다
  - 지치게 합니다
  rationale: 전도서의 관찰은 단순한 지적 진술보다 체험적 소진을 말하므로, 한국어에서 반복성과 권태를 함께 전달하는 표현을 택했습니다.
  doctrine_reference: 전도서 1장 문맥의 인생 허무/수고 주제
