  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת כָּל זֶ֤ה רָאִ֨יתִי֙ וְ/נָת֣וֹן אֶת לִבִּ֔/י לְ/כָֽל מַעֲשֶׂ֔ה אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֵ֗ת אֲשֶׁ֨ר שָׁלַ֧ט הָ/אָדָ֛ם בְּ/אָדָ֖ם לְ/רַ֥ע לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/009.yaml
  text: All this I have seen[a], while applying my heart to every deed that is done under the sun, at a time when man has ruled over man to his harm.
  footnotes:
  - marker: a
    text: Or, “one person has ruled over another to his harm.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 것을 나는 보았습니다[a]. 곧 해 아래에서 이루어지는 모든 일에 내 마음을 두었을 때였습니다. 사람이 사람을 다스려 자기에게 해를 끼치는 때였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한 사람이 다른 사람을 자기에게 해가 되게 다스렸습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I have seen
  chosen_korean: 나는 보았습니다
  alternatives_korean:
  - 나는 보았습니니다
  - 나는 보아 왔습니다
  - 나는 목격했습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 누적된 관찰과 회고적 어조를 살리기 위해 단순 과거보다 자연스러운 완료형으로 옮겼습니다.
- source_word: וְנָתוֹן אֶת־לִבִּי
  english_pob_choice: while applying my heart
  chosen_korean: 내 마음을 두었을 때였습니다
  alternatives_korean:
  - 내 마음을 두고 있을 때였습니다
  - 내 마음을 기울였을 때였습니다
  - 내 마음을 쏟았을 때였습니다
  lexicon: HALOT
  rationale: 직역적 이미지인 '마음'을 유지하되, 한국어에서 자연스러운 관용으로 '마음을 두다'를 선택해 인지적 집중의 뜻을 살렸습니다.
- source_word: תַּחַת הַשָּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 햇빛 아래에서
  lexicon: HALOT
  rationale: 전도서의 반복 표현을 한국어에서도 반복 가능한 관용으로 보존하기 위해 '해 아래'를 택했습니다.
- source_word: שָׁלַט הָאָדָם בְּאָדָם
  english_pob_choice: man has ruled over man
  chosen_korean: 사람이 사람을 다스려
  alternatives_korean:
  - 한 사람이 다른 사람을 다스려
  - 사람이 사람 위에 군림하여
  - 한 인간이 다른 인간을 지배하여
  lexicon: HALOT
  rationale: 대표적·격언적 진술로서 두 번의 אָדָם을 한국어에서도 대칭적으로 살리되, '다스리다'가 כוח/지배의 의미를 충분히 담으면서도 과도하게 해석적이지 않아 선택했습니다.
- source_word: לְרַע לוֹ
  english_pob_choice: to his harm
  chosen_korean: 자기에게 해를 끼치는
  alternatives_korean:
  - 그에게 해가 되게
  - 자기 해로
  - 그의 손해로
  lexicon: HALOT
  rationale: הָאָדָם/בְּאָדָם의 관계가 그 결과로 불이익과 손상을 낳는다는 점을 드러내기 위해 '해를 끼치는'으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 대표적 남성형 אָדָם의 한국어 처리
  chosen_reading: 사람이 사람을
  alternative_readings:
  - 한 사람이 다른 사람을
  - 인간이 인간을
  rationale: 히브리어의 대표적 남성형을 완전히 중성화하지 않으면서도 한국어에서는 성별보다 인간 일반을 드러내는 '사람'을 사용해, 본문의 격언성과 보편성을 함께 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4; Contested terms table for אָדָם
