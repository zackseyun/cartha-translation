source:
  edition: WLC
  text: כִּֽי אֵינֶ֥/נּוּ יֹדֵ֖עַ מַה שֶּׁ/יִּֽהְיֶ֑ה כִּ֚י כַּ/אֲשֶׁ֣ר יִֽהְיֶ֔ה מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/007.yaml
  text: For he does not know what will be, for who can tell him how it will be?
  footnotes:
  - marker: a
    text: Or, 'who will tell him what will happen?' The Hebrew phrase can be taken more generally, but 'how it will be' preserves the distinction between the two clauses.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람은 장차 무슨 일이 일어날지 알지 못합니다. 그것이 어떻게 될지를 누가 그에게 알려 줄 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 곧
  lexicon: HALOT
  rationale: 첫 번째 כִּי는 앞선 진술을 풀어 설명하는 연결사이므로, 문맥상 이유 설명을 자연스럽게 이어 주는 「이는」으로 옮겼습니다.
- source_word: מַה שֶּׁיִּהְיֶה
  english_pob_choice: what will be
  chosen_korean: 무엇이 될지
  alternatives_korean:
  - 무엇이 일어날지
  - 무엇이 되리인지
  lexicon: HALOT
  rationale: 히브리어의 직설적인 미래 의문구조를 살려 「무엇이 될지」로 옮겨, Qoheleth의 간결한 표현과 의미 범위를 함께 유지했습니다.
- source_word: מִי יַגִּיד לוֹ
  english_pob_choice: who can tell him
  chosen_korean: 누가 그에게 말해 줄 수 있겠습니까
  alternatives_korean:
  - 누가 그에게 알려 줄 수 있겠습니까
  - 누가 그에게 설명할 수 있겠습니까
  lexicon: HALOT
  rationale: 히필 נגד의 ‘말하다/알리다’ 의미를 반영하면서, 수사 의문이 지닌 불가능성을 한국어에서 자연스럽게 드러내기 위해 「말해 줄 수 있겠습니까」로 옮겼습니다.
- source_word: כַּאֲשֶׁר יִהְיֶה
  english_pob_choice: how it will be
  chosen_korean: 그것이 어떻게 될지
  alternatives_korean:
  - 그것이 언제 될지
  - 그것이 어떤 방식으로 될지
  lexicon: HALOT
  rationale: 편집 이력상 시간적 의미(when)로의 수정이 있었지만, 최종 회복된 POB는 이 구를 결과의 양상/방식으로 이해하므로, ‘how it will be’를 따라 「어떻게 될지」로 옮겼습니다.
theological_decisions:
- issue: 전도서의 보편적 진술을 한국어에서 어떻게 주어화할지
  chosen_reading: 인칭적 ‘그는’으로 두되, 일반 인간을 가리키는 문맥상 대표적 주어로 읽게 했습니다.
  alternative_readings:
  - 사람은
  - 사람이
  - 그 사람은
  rationale: 히브리어의 3인칭 단수와 영어 POB의 ‘he’를 반영하면서, 전도서의 일반화된 인간 진술로 이해되도록 했습니다.
  doctrine_reference: 문맥 일반화
