id: ECC.8.3
reference: Ecclesiastes 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּבָּהֵ֤ל מִ/פָּנָי/ו֙ תֵּלֵ֔ךְ אַֽל תַּעֲמֹ֖ד בְּ/דָבָ֣ר רָ֑ע כִּ֛י כָּל אֲשֶׁ֥ר יַחְפֹּ֖ץ יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/003.yaml
  text: Do not be hasty to leave his presence[a]. Do not take your stand in an evil matter[b], for he does whatever he pleases.
  footnotes:
  - marker: a
    text: Or 'Do not be alarmed and leave his presence.' The Hebrew verb can suggest agitation or alarm as well as rash haste.
    reason: lexical_alternative
  - marker: b
    text: Or 'Do not stand in a bad cause' or 'Do not persist in an evil matter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 앞에서 성급하게 떠나지 마십시오[a]. 악한 일에 서지 마십시오[b]. 그분은 자기 뜻대로 다 행하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 앞에서 동요하여 떠나지 마십시오.’ 히브리어 동사는 성급함뿐 아니라 동요나 당황도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악한 사안에 서지 마십시오’ 혹은 ‘악한 일에 계속 머물지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבָּהֵל
  english_pob_choice: be hasty
  chosen_korean: 성급하게
  alternatives_korean:
  - 당황하여
  - 겁먹고
  - 서둘러
  lexicon: HALOT
  rationale: בהל은 ‘당황하다, 동요하다, 성급히 행동하다’의 뜻을 모두 가질 수 있으므로, 여기서는 문맥상 성급한 행동을 나타내는 ‘성급하게’가 가장 자연스럽습니다.
- source_word: מִפָּנָיו תֵּלֵךְ
  english_pob_choice: leave his presence
  chosen_korean: 그분의 앞에서 떠나지 마십시오
  alternatives_korean:
  - 그 앞에서 물러나지 마십시오
  - 그분의 면전에서 떠나지 마십시오
  lexicon: HALOT
  rationale: 직역하면 ‘그 앞에서 가다’이지만, 한국어에서는 왕 앞의 courtly 장면을 살리면서도 자연스럽게 ‘그분의 앞에서 떠나지 마십시오’로 옮기는 것이 적절합니다.
- source_word: בְּדָבָר רָע
  english_pob_choice: in an evil matter
  chosen_korean: 악한 일에
  alternatives_korean:
  - 나쁜 일에
  - 악한 사안에
  - 옳지 않은 일에
  lexicon: HALOT
  rationale: דָבָר은 ‘말’보다 넓은 ‘일, 일거리, 사안’을 가리킬 수 있으므로, 의미의 폭을 살려 ‘일’로 옮기고 רָע의 도덕적 강도를 ‘악한’으로 유지했습니다.
- source_word: יַחְפֹּץ יַעֲשֶׂה
  english_pob_choice: he does whatever he pleases
  chosen_korean: 자기 뜻대로 다 행하십니다
  alternatives_korean:
  - 원하시는 것은 무엇이든 하십니다
  - 뜻하시는 바를 다 하십니다
  lexicon: HALOT
  rationale: חפץ는 단순한 ‘원하다’보다 ‘뜻하다, 기뻐하다’의 뉘앙스가 있어, 왕의 유효한 의지를 살리면서 한국어로는 ‘자기 뜻대로 다 행하십니다’가 가장 매끄럽습니다.
theological_decisions:
- issue: 세 번째 인칭 대명사의 지시 대상
  chosen_reading: 문맥상 지시 대상은 왕입니다. 따라서 한국어에서는 그 대상을 드러내되, 지나치게 설명하지 않고 ‘그분’으로 유지했습니다.
  alternative_readings:
  - 일반적인 통치자나 권위자
  - 직접적으로 ‘왕’이라고 명시
  rationale: 앞절과 뒷절이 왕의 명령과 권위를 전제하므로, 인칭 대명사는 왕을 가리킵니다. ‘그분’은 원문의 인칭성을 보존하면서도 한국어에서 자연스럽습니다.
  doctrine_reference: 전도서 8:2–4 문맥
