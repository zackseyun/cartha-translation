  source_fidelity: 첫 명령의 ‘성급하게 떠나다’와 마지막 절의 왕의 유효한 의지는 대체로 충실합니다. 그러나 בְּדָבָר רָע에서 עמד의 관용적·비유적 ‘어떤 사안/일에 입장을 세우거나 가담하다’는 뜻을 ‘악한 일에 서다’라고 하면 한국어에서 충분히 전달되지 않습니다.
  naturalness: ‘악한 일에 서지 마십시오’는 현대 표준 한국어에서 부자연스럽고 뜻이 모호합니다. 또한 문맥상 왕을 가리키는 대명사를 ‘그분’ 및 높임 서술어로만 처리하면 한국어 독자에게 신적 지시 대상으로 오인될 여지가 있습니다. ‘왕’을 밝혀 문맥을 자연스럽게 연결하는 편이 안전합니다.
  terminology: ‘악한 일’은 רָע의 도덕적 강도를 보존합니다. ‘가담하지 마십시오’는 여기서의 ‘악한 사안에서 입장을 취하다’라는 의미를 자연스럽게 전달합니다. 왕을 신적 호칭처럼 들릴 수 있는 ‘그분’으로 지칭하지 않고 ‘왕’으로 명시합니다.
