base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/015.yaml
  text: So I commended joy[a], because there is nothing better for man under the sun than to eat and to drink and to rejoice[c][b]; and this will accompany him in his labor during the days of his life that God has given him under the sun.
  footnotes:
  - marker: a
    text: Or, 'I praised joy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for man'; the singular is generic, referring to human beings generally.
    reason: lexical_alternative
  - marker: c
    text: Or, 'and it will go with him in his toil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 기쁨을 칭찬했습니다[a]. 해 아래에서 사람에게[b] 먹고 마시고 기뻐하는 것보다 더 나은 것은 없기 때문입니다. 그 기쁨이 하나님께서 해 아래에서 그에게 주신 삶의 날 동안 그의 수고 가운데 그와 함께할 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘나는 기쁨을 찬양했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람에게’를 뜻하는 단수형을 사용하지만, 일반적인 인간을 가리키는 보편적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, ‘그리고 그것이 그의 수고 가운데 그와 함께 갈 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּחְתִּי
  english_pob_choice: I commended
  chosen_korean: 나는 기쁨을 칭찬했습니다
  alternatives_korean:
  - 기쁨을 찬양했습니다
  - 기쁨을 좋게 여겼습니다
  lexicon: HALOT
  rationale: שׁבח의 ‘칭찬하다/찬양하다’ 의미를 살리되, 문맥상 지혜자의 평가를 드러내는 ‘칭찬했습니다’로 자연스럽게 옮겼습니다.
- source_word: הַשִּׂמְחָה
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  lexicon: HALOT
  rationale: 지혜서 전반의 핵심 주제인 즐거움/기쁨을 가장 직접적으로 전달하는 표준어로 ‘기쁨’을 택했습니다.
- source_word: לָאָדָם
  english_pob_choice: for man
  chosen_korean: 사람에게
  alternatives_korean:
  - 인간에게
  - 한 사람에게
  lexicon: HALOT
  rationale: 히브리어 단수 보편 표현을 한국어에서 자연스럽게 살리기 위해 ‘사람에게’로 옮겼습니다. 성별 제한이 아니라 일반 인간을 가리킵니다.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 세상에서
  lexicon: HALOT
  rationale: 전도서의 반복 관용구를 일관되게 보존하기 위해 직역형인 ‘해 아래에서’를 사용했습니다.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׂמֹחַ
  english_pob_choice: to eat and to drink and to rejoice
  chosen_korean: 먹고 마시고 즐기는 것
  alternatives_korean:
  - 먹고 마시고 기뻐하는 것
  - 먹고 마시며 즐거워하는 것
  lexicon: HALOT
  rationale: 세 개의 부정사 연쇄를 한국어에서는 병렬 동명사 구조로 풀어, 내용의 자연스러움과 리듬을 함께 살렸습니다.
- source_word: וְהוּא יִלְוֶנּוּ
  english_pob_choice: and this will accompany him
  chosen_korean: 그것이 … 그와 함께할 것입니다
  alternatives_korean:
  - 그것이 … 그를 따를 것입니다
  - 그것이 … 동행할 것입니다
  lexicon: HALOT
  rationale: לוה의 기본 의미인 ‘동행하다/동반하다’를 살려, 기쁨의 효력을 주어로 이해해 ‘그것이 그와 함께할 것입니다’로 옮겼습니다.
- source_word: בַעֲמָלוֹ
  english_pob_choice: in his labor
  chosen_korean: 그의 노동의 날들 동안
  alternatives_korean:
  - 그의 수고 가운데
  - 그의 일 가운데
  lexicon: HALOT
  rationale: עָמָל의 부담스러운 ‘수고/노동’ 뉘앙스를 유지하면서, 뒤의 ‘날들’ 표현과 결합해 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 기쁨을 삶의 선물로 제시하는 전도서의 실용적 권면
  chosen_reading: 해 아래의 일상 속에서 먹고 마시고 즐기는 것이 하나님이 주신 삶의 몫이며, 그 기쁨이 노동을 동반합니다.
  alternative_readings:
  - 단순한 허무주의적 체념
  - 쾌락주의적 권고
  rationale: 문맥은 쾌락 찬양이 아니라, 하나님이 주신 삶의 한계 안에서 누리는 선한 기쁨을 지혜롭게 권하는 말입니다.
  doctrine_reference: 전도서 8:15 문맥; 창조와 섭리 아래의 일상적 선물에 대한 지혜문학 이해
