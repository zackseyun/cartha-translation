id: ECC.8.1
reference: Ecclesiastes 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֚י כְּ/הֶ֣/חָכָ֔ם וּ/מִ֥י יוֹדֵ֖עַ פֵּ֣שֶׁר דָּבָ֑ר חָכְמַ֤ת אָדָם֙ תָּאִ֣יר פָּנָ֔י/ו וְ/עֹ֥ז פָּנָ֖י/ו יְשֻׁנֶּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/001.yaml
  text: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
  footnotes:
  - marker: a
    text: Or, 'Human wisdom lights up the face.' The Hebrew has 'the wisdom of a man,' using singular generic language.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the boldness/ sternness of his face is changed.' The Hebrew expression is idiomatic and may refer to a hard or severe facial expression being altered by wisdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 지혜로운 사람과 같습니까? 또 누가 어떤 일의 뜻을 압니까? 사람의 지혜[a]는 그의 얼굴을 밝게 하고, 그의 얼굴의 굳은 표정[b]이 바뀝니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간의 지혜는 얼굴을 밝게 합니다.’ 히브리어는 단수 일반 표현으로 ‘한 사람의 지혜’를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 얼굴의 대담함/엄함이 바뀝니다.’ 이 히브리어 표현은 관용적으로 지혜로 말미암아 굳거나 엄한 표정이 변화하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי כְּהֶחָכָם
  english_pob_choice: Who is like the wise man
  chosen_korean: 누가 지혜로운 사람과 같습니까?
  alternatives_korean:
  - 누가 지혜로운 자와 같습니까?
  - 누가 현자와 같습니까?
  lexicon: HALOT
  rationale: מִי의 수사 의문을 ‘누가’로 옮기고, כְּ의 비교 의미는 ‘-와 같습니까’로 살렸습니다. הֶחָכָם은 일반적 지혜로운 사람을 가리키므로 ‘지혜로운 사람’이 가장 자연스럽고 본문 구조도 보존합니다.
- source_word: יוֹדֵעַ פֵּשֶׁר דָּבָר
  english_pob_choice: who knows the interpretation of a matter
  chosen_korean: 또 누가 한 일의 해석을 압니까?
  alternatives_korean:
  - 또 누가 어떤 일의 뜻을 압니까?
  - 또 누가 한 사건의 의미를 압니까?
  lexicon: HALOT
  rationale: פֵּשֶׁר은 ‘해석/풀이’를 뜻하고 דָּבָר는 광범위하게 ‘일, 일어난 일, 문제’를 가리킬 수 있어 ‘한 일의 해석’이 본문의 지혜 격언적 뉘앙스를 잘 살립니다.
- source_word: חָכְמַת אָדָם
  english_pob_choice: A man's wisdom
  chosen_korean: 사람의 지혜는
  alternatives_korean:
  - 한 사람의 지혜는
  - 인간의 지혜는
  lexicon: HALOT
  rationale: אָדָם의 단수 일반 용법을 반영해 ‘사람의’로 옮겼습니다. 한국어에서는 남성 표지가 과도하게 느껴질 수 있어, 대표적·일반적 의미를 살리면서도 성별을 불필요하게 강조하지 않는 표현을 택했습니다.
- source_word: עֹז פָּנָיו יְשֻׁנֶּא
  english_pob_choice: the hardness of his face is changed
  chosen_korean: 그의 얼굴의 굳은 기색이 바뀝니다.
  alternatives_korean:
  - 그의 얼굴의 강한 기색이 바뀝니다.
  - 그의 얼굴의 엄한 기색이 바뀝니다.
  lexicon: HALOT
  rationale: עֹז פָּנִים은 얼굴의 강건함보다 ‘굳은/엄한’ 표정이라는 관용적 의미가 자연스럽습니다. ‘기색’은 한국어로 얼굴의 경직된 표정을 잘 드러내며, ‘바뀝니다’가 שינוי의 수동적 의미를 무리 없이 반영합니다.
theological_decisions:
- issue: אָדָם의 대표적 일반성 보존
  chosen_reading: ‘사람의 지혜’로 옮겨, 단수 일반 명사로서의 대표성을 살렸습니다.
  alternative_readings:
  - ‘인간의 지혜’
  - ‘한 사람의 지혜’
  rationale: 본문은 특정 개인이 아니라 일반적 지혜를 말하는 수사적 질문이므로, 성별 중립화나 개념화보다 원문의 단수 일반 용법을 자연스럽게 보존하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
