base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/002.yaml
  text: I say[a], keep the king’s command[c][b], because of your oath before God.
  footnotes:
  - marker: a
    text: Or, 'keep the king’s command, and because of the oath of God'; the Hebrew is compressed and may be read with slightly different syntax.
    reason: alternative_reading
  - marker: b
    text: Hebrew literally, 'the mouth of a king.'
    reason: lexical_alternative
  - marker: c
    text: '''Oath before God'' may also be understood as ''oath to God'' or ''the oath of God.'''
    reason: alternative_reading
translation:
  language: ko
  text: 나는 말합니다. 하나님 앞에서 한 맹세 때문에 왕의 명령을 지키십시오[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축되어 있어, ‘나는’에 숨은 서술을 보충하여 ‘나는 말합니다’로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘왕의 입’입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 ‘하나님께 한 맹세’ 또는 ‘하나님의 맹세’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I say
  chosen_korean: 나는 말합니다
  alternatives_korean:
  - 나는
  - 내가 말합니다
  lexicon: HALOT
  rationale: 히브리어의 독립대명사 ‘나는’에 영어 POB가 문맥상 생략된 발화를 보충한 흐름을 따라, 한국어에서도 발화 표지를 최소한으로 드러내는 ‘나는 말합니다’로 자연화했습니다.
- source_word: פִּי מֶלֶךְ
  english_pob_choice: the king’s command
  chosen_korean: 왕의 명령
  alternatives_korean:
  - 왕의 입
  - 왕의 말씀
  - 왕의 말
  lexicon: HALOT
  rationale: 직역하면 ‘왕의 입’이지만, 관용적으로 왕이 말한 권위 있는 지시를 가리키므로 현대 한국어에서는 ‘왕의 명령’이 가장 분명합니다.
- source_word: שְׁמֹר
  english_pob_choice: keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 지켜야 합니다
  - 준수하십시오
  - 지키다
  lexicon: HALOT
  rationale: 이 동사는 ‘지키다, 준수하다, 보존하다’의 폭이 있으나, 명령형으로서 왕의 말을 따라야 하는 뜻을 살려 ‘지키십시오’로 옮겼습니다.
- source_word: שְׁבוּעַת אֱלֹהִים
  english_pob_choice: your oath before God
  chosen_korean: 하나님 앞에서 한 맹세
  alternatives_korean:
  - 하나님께 한 맹세
  - 하나님의 맹세
  - 하나님 앞의 맹세
  lexicon: HALOT
  rationale: 히브리어는 ‘하나님에게/하나님 앞에서/하나님의’로 다소 압축되어 애매하므로, POB의 해석을 따라 맹세가 하나님의 증인 아래 이루어졌음을 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: ‘하나님’이 붙는 맹세구의 의미
  chosen_reading: 왕의 명령을 지키는 근거를 하나님 앞에서 한 맹세로 제시합니다.
  alternative_readings:
  - 하나님께 한 맹세
  - 하나님의 맹세로서의 맹세
  rationale: 본문은 왕권 순종과 종교적 책임을 함께 두지만, 왕에 대한 무조건적 복종 교리로 확장하지 않고 맹세의 구속력만을 보존하는 것이 문맥에 충실합니다.
  doctrine_reference: 본문의 정치적·신학적 긴장 보존
