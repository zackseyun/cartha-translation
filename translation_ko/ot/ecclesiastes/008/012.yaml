  terminology: ‘악을 행하다’, ‘하나님’, ‘경외하다’는 적절합니다. ‘그분 앞에서 경외하는’은 מִלְּפָנָיו의 현존·경외 뉘앙스와 동사의 반복을 보존합니다.
