id: ECC.8.12
reference: Ecclesiastes 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֣ר חֹטֶ֗א עֹשֶׂ֥ה רָ֛ע מְאַ֖ת וּ/מַאֲרִ֣יךְ ל֑/וֹ כִּ֚י גַּם יוֹדֵ֣עַ אָ֔נִי אֲשֶׁ֤ר יִהְיֶה טּוֹב֙ לְ/יִרְאֵ֣י הָ/אֱלֹהִ֔ים אֲשֶׁ֥ר יִֽירְא֖וּ מִ/לְּ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/012.yaml
  text: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
  footnotes:
  - marker: a
    text: Or, 'and lives long' for 'and prolongs his life.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'that it will be good for those who fear God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 죄인이 백 번 악을 행하고 오래 살지라도[a], 나는 또한 하나님을 경외하는 사람들, 곧 그분 앞에서 경외하는 사람들에게 잘될 것을[b] 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 생명을 길게 누리고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님을 경외하는 사람들에게 좋은 일이 있을 것을’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹטֶא
  english_pob_choice: a sinner
  chosen_korean: 죄인
  alternatives_korean:
  - 죄를 짓는 사람
  - 죄를 범하는 자
  lexicon: HALOT
  rationale: 현재 분사형은 지속적으로 죄를 짓는 사람의 성격을 가리키므로, 간결하고 자연스러운 명사형 ‘죄인’으로 옮겼습니다.
- source_word: עֹשֶׂה רָע
  english_pob_choice: does evil
  chosen_korean: 악을 행하고
  alternatives_korean:
  - 악을 저지르고
  - 악하게 행하고
  lexicon: HALOT
  rationale: 동사구의 구체성을 살려 ‘악을 행하다’로 옮기되, 문맥상 연속된 행위를 드러내기 위해 연결어미를 사용했습니다.
- source_word: וּמַאֲרִיךְ לוֹ
  english_pob_choice: and prolongs his life
  chosen_korean: 자기 생명을 길게 누릴지라도
  alternatives_korean:
  - 그리고 자기 생명을 연장할지라도
  - 그리고 오래 살지라도
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘그에게/자기에게 생명을 길게 하다’의 뜻이므로, 문자성을 유지하되 한국어에서 자연한 ‘생명을 길게 누리다’로 풀었습니다.
- source_word: לְיִרְאֵי הָאֱלֹהִים
  english_pob_choice: for those who fear God
  chosen_korean: 하나님을 경외하는 사람들
  alternatives_korean:
  - 하나님을 두려워하는 사람들
  - 하나님을 경외하는 자들
  lexicon: HALOT
  rationale: פּ־יראה 계열은 단순 공포가 아니라 경외의 태도를 가리키므로, 한국어 성경 관용을 따라 ‘경외하다’를 선택했습니다.
- source_word: אֲשֶׁר יִירְאוּ מִלְּפָנָיו
  english_pob_choice: who fear before him
  chosen_korean: 그분 앞에서 경외하는 사람들
  alternatives_korean:
  - 그분 앞에서 두려워하는 사람들
  - 그분의 면전에서 경외하는 사람들
  lexicon: HALOT
  rationale: 반복된 ‘경외하다’의 동사적 뉘앙스를 살리면서, מִלְּפָנָיו의 공간적 표현은 ‘그분 앞에서’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘하나님을 경외하는 사람들’과 ‘그분 앞에서 경외하는 사람들’의 이중 표현
  chosen_reading: 두 표현은 같은 대상을 반복하여 강조하는 것으로 이해하고, 한국어에서도 중복을 유지했습니다.
  alternative_readings:
  - 뒤의 구를 단순히 ‘그분 앞에서’로 줄이는 방안
  - 첫 구만 번역하고 뒤를 생략하는 방안
  rationale: 히브리어는 두 번의 경외 표현으로 수사적 강조를 형성하므로, 이를 평준화하지 않고 반복을 보존하는 편이 원문 효과를 더 잘 드러냅니다.
  doctrine_reference: 문학적 반복과 경외의 강조
