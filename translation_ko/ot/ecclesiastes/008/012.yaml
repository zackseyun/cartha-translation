  source_fidelity: 핵심 의미는 대체로 충실하지만, 히브리어의 관계절 ‘그분 앞에서 경외하는’은 앞선 ‘하나님을 경외하는 사람들’을 수식합니다. 초안처럼 ‘잘될 것을’를 반복하면 원문의 문장 구조가 불필요하게 바뀝니다. 또한 화자의 1인칭은 공적·격식 문맥에서 ‘저는’보다 ‘나는’이 자연스럽습니다.
