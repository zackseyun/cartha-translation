id: ECC.8.5
reference: Ecclesiastes 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְ/עֵ֣ת וּ/מִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/005.yaml
  text: Whoever keeps a command will not know an evil thing[b][a], and a wise heart knows the proper time and judgment.
  footnotes:
  - marker: a
    text: Or 'an evil thing' or 'a bad thing.' The Hebrew phrase is literally 'a bad/evil thing,' and may refer either to moral evil or, more likely here, to harmful consequence or trouble.
    reason: lexical_alternative
  - marker: b
    text: Or 'time and judgment,' that is, the proper time and the right decision/procedure.
    reason: lexical_alternative
translation:
  language: ko
  text: 명령을 지키는 사람은 해로운 일을 겪지 않으며, 지혜로운 마음은 적절한 때와 판단을 압니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 일’, ‘나쁜 일’. 히브리어 구절은 문자적으로 ‘악/나쁜 일’이며, 여기서는 도덕적 악보다 해악이나 불상사를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘때와 판단’, 곧 적절한 때와 올바른 결정/절차입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר מִצְוָה
  english_pob_choice: Whoever keeps a command
  chosen_korean: 명령을 지키는 사람은
  alternatives_korean:
  - 계명을 지키는 사람은
  - 명령을 지키는 이는
  lexicon: HALOT
  rationale: 히브리어 분사는 일반적 행위를 가리키므로, 한국어에서는 관계절보다 자연스러운 ‘~하는 사람은’으로 대표적 일반성을 살렸습니다. מִצְוָה는 여기서 특정한 한 계명보다 일반적 ‘명령’이 더 자연스럽습니다.
- source_word: דָּבָר רָע
  english_pob_choice: an evil thing
  chosen_korean: 해로운 일
  alternatives_korean:
  - 악한 일
  - 나쁜 일
  - 악
  lexicon: HALOT
  rationale: 문맥상 도덕적 악 자체보다 순종하는 자에게 닥치는 해악이나 불상사를 가리키는 뉘앙스가 강하므로, 구체적이면서도 자연스러운 ‘해로운 일’로 옮겼습니다.
- source_word: וְעֵת וּ/מִשְׁפָּט
  english_pob_choice: the proper time and judgment
  chosen_korean: 적절한 때와 판단
  alternatives_korean:
  - 때와 판단
  - 적절한 시기와 판결
  - 정한 때와 결정
  lexicon: HALOT
  rationale: עֵת은 지혜문맥에서 ‘때’보다 ‘적절한 때’가 뜻을 더 분명히 드러내며, מִשְׁפָּט은 여기서 재판 절차보다 ‘판단/결정’의 뜻이 더 적절해 ‘판단’으로 옮겼습니다.
- source_word: לֵב חָכָם
  english_pob_choice: a wise heart knows
  chosen_korean: 지혜로운 마음은 압니다
  alternatives_korean:
  - 지혜로운 마음은 압니다
  - 지혜로운 자의 마음은 압니다
  - 지혜로운 হৃদ심은 압니다
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 이해와 분별의 자리이므로, 문자적으로 ‘마음’을 유지하되 현대 한국어에서 자연스럽게 읽히도록 주어-서술을 정리했습니다. 핵심은 지혜의 내적 분별력입니다.
theological_decisions:
- issue: 히브리어 지혜문학의 인류학적 표현 לֵב(마음) 보존
  chosen_reading: 지혜로운 마음은 압니다
  alternative_readings:
  - 지혜로운 사람은 압니다
  - 마음이 지혜로운 사람은 압니다
  rationale: ‘마음’을 유지해 히브리어가 이해의 중심을 내면에 두는 표현 방식을 보존했습니다. 이는 단순한 인지 능력보다 분별의 내적 중심을 드러냅니다.
  doctrine_reference: Translation philosophy §5, §6
