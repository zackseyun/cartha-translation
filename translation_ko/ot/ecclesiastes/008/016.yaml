  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר נָתַ֤תִּי אֶת לִבִּ/י֙ לָ/דַ֣עַת חָכְמָ֔ה וְ/לִ/רְאוֹת֙ אֶת הָ֣/עִנְיָ֔ן אֲשֶׁ֥ר נַעֲשָׂ֖ה עַל הָ/אָ֑רֶץ כִּ֣י גַ֤ם בַּ/יּוֹם֙ וּ/בַ/לַּ֔יְלָה שֵׁנָ֕ה בְּ/עֵינָ֖י/ו אֵינֶ֥/נּוּ רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/016.yaml
  text: When I applied my heart to know wisdom and to observe the activity that is done on the earth—for even by day and by night his eyes do not see sleep—[a]
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'he gets no sleep day or night.' The main text preserves the Hebrew image, literally, 'sleep his eyes do not see.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 지혜를 알고, 땅에서 일어나는 활동을 살피려고 내 마음을 기울였을 때—그의 눈은 밤낮으로 잠을 보지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 ‘그는 밤낮으로 잠을 이루지 못합니다’라고 옮길 수 있습니다. 본문은 히브리어의 직설적 이미지를 유지해 ‘눈이 잠을 보지 못한다’고 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: When
  chosen_korean: ~했을 때
  alternatives_korean:
  - ~할 때
  - ~하면서
  lexicon: HALOT
  rationale: 시간적 상황을 자연스러운 현대 한국어로 옮기되, 앞선 관찰 행위의 배경 상황이라는 점을 살렸습니다.
- source_word: נָתַתִּי אֶת־לִבִּי
  english_pob_choice: I applied my heart
  chosen_korean: 내 마음을 기울였을 때
  alternatives_korean:
  - 내 마음을 두었을 때
  - 내 마음을 쏟았을 때
  lexicon: HALOT
  rationale: ‘마음’의 이미지를 유지하면서도 의도적으로 집중했다는 뜻을 한국어로 자연스럽게 드러냅니다.
- source_word: לָדַעַת חָכְמָה
  english_pob_choice: to know wisdom
  chosen_korean: 지혜를 알고
  alternatives_korean:
  - 지혜를 알기 위해
  - 지혜를 이해하고
  lexicon: HALOT
  rationale: 지혜를 대상으로 하는 지적 추구를 간결하게 표현했습니다.
- source_word: וְלִרְאוֹת אֶת־הָעִנְיָן
  english_pob_choice: and to observe the activity
  chosen_korean: 땅에서 일어나는 활동을 살피려고
  alternatives_korean:
  - 그 일이 벌어지는 것을 보려고
  - 그 현상을 관찰하려고
  lexicon: HALOT
  rationale: הָעִנְיָן의 문맥상 ‘사람들의 일/활동’이라는 뜻을 살리되, 현대 독자가 이해하기 쉬운 ‘활동’으로 옮겼습니다.
- source_word: שֵׁנָה בְּעֵינָיו אֵינֶנּוּ רֹאֶה
  english_pob_choice: his eyes do not see sleep
  chosen_korean: 그의 눈은 밤낮으로 잠을 보지 못합니다
  alternatives_korean:
  - 그의 눈은 잠을 보지 못합니다
  - 그는 밤낮으로 잠을 이루지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 다소 낯선 이미지(‘눈이 잠을 보지 못함’)를 본문에서 유지하되, 한국어 어순에 맞게 자연화했습니다.
theological_decisions:
- issue: ‘그의 눈’의 3인칭 남성 단수 표현을 한국어에서 어떻게 보존할지
  chosen_reading: 주어를 새로 특정하지 않고 ‘그의 눈’으로 그대로 유지했습니다.
  alternative_readings:
  - ‘내 눈’으로 풀어 적기
  - ‘사람의 눈’으로 일반화하기
  rationale: 마소라 본문이 3인칭 남성 단수를 쓰므로, 화자를 임의로 바꾸거나 일반화하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, §4
