revisions:
- from: 내가 지혜를 알고, 땅에서 일어나는 활동을 살피려고 내 마음을 기울였을 때—그의 눈은 밤낮으로 잠을 보지 못합니다.[a]
  to: 내가 지혜를 알고 땅에서 행해지는 일을 살피려고 마음을 기울였을 때—실로 그는 밤낮으로도 눈으로 잠을 보지 못합니다.[a]
  rationale: 두 부정사 ‘지혜를 알고’와 ‘… 일을 살피려고’를 모두 ‘마음을 기울였’다는 행위의 목적으로 연결했습니다. ‘행해지는 일’로 수동 표현을 반영했으며, 3인칭 남성 단수의 불명확한 지시 대상은 ‘그’로 보존하되 그가 누구인지는 특정하지 않았습니다. ‘눈으로 잠을 보지 못합니다’라는 비관용적 표현은 각주에서 관용적 대안을 제공하면서 본문에서는 원문의 이미지를 보존합니다.
  reviewer_model: gpt-5.6-terra
