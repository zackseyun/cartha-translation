  - severity: medium
    issue: ‘그의 눈은 … 잠을 보지 못합니다’
    rationale: 히브리어의 동사 רֹאֶה의 묵시적 주어는 3인칭 남성 단수이며, בְּעֵינָיו는 ‘그의 눈으로’라는 수단/관점 표현입니다. 눈을 문법적 주어로 바꾸지 않는 편이 원문 형태와 모호성을 더 충실히 보존합니다.
