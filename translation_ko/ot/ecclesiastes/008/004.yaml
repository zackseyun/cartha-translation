source:
  edition: WLC
  text: בַּ/אֲשֶׁ֥ר דְּבַר מֶ֖לֶךְ שִׁלְט֑וֹן וּ/מִ֥י יֹֽאמַר ל֖/וֹ מַֽה תַּעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/004.yaml
  text: For the word of a king is authority[a], and who may say to him, “What are you doing?”
  footnotes:
  - marker: a
    text: Or 'For where the word of the king is, there is authority.' The Hebrew opening can be construed more literally in that way.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 말은 권위가 있으니, 누가 그에게 “무엇을 하고 있습니까?”라고 말하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “왕의 말이 있는 곳에 권위가 있다”로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר מֶלֶךְ
  english_pob_choice: the word of a king
  chosen_korean: 왕의 말
  alternatives_korean:
  - 왕의 말씀
  - 임금의 명령
  - 왕의 칙령
  lexicon: HALOT
  rationale: דְּבַר는 ‘말/사건/일’의 폭이 있지만, 여기서는 왕의 권위를 실어 나르는 발언을 가리키므로 ‘말’이 본문 형식을 가장 잘 살리면서도 다음 절의 권위 표현과 자연스럽게 연결됩니다.
- source_word: שִׁלְטוֹן
  english_pob_choice: authority
  chosen_korean: 권위가 있으니
  alternatives_korean:
  - 통치력이 있으니
  - 지배권이 있으니
  - 권세가 있으니
  lexicon: HALOT
  rationale: שִׁלְטוֹן은 통치력/지배권을 뜻하지만, 한국어에서는 ‘권위가 있다’가 왕의 말이 지닌 구속력을 가장 자연스럽게 드러냅니다.
- source_word: וּמִי יֹאמַר לוֹ
  english_pob_choice: and who may say to him
  chosen_korean: 누가 그에게 …라고 말하겠습니까?
  alternatives_korean:
  - 누가 그에게 …라고 말할 수 있겠습니까?
  - 누가 그에게 …라고 하겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 가능성 표현을 한국어에서는 의문형 종결로 옮겨, 왕에게 따질 수 없는 상황을 살렸습니다.
- source_word: מַה תַּעֲשֶׂה
  english_pob_choice: What are you doing?
  chosen_korean: “무엇을 하고 있습니까?”
  alternatives_korean:
  - “무엇을 하십니까?”
  - “무슨 일을 하십니까?”
  - “무엇을 하고 있느냐?”
  lexicon: HALOT
  rationale: 직접 발화의 공격성을 유지하면서도, 왕에게 하는 말이므로 존대형을 사용해 문맥의 대조를 살렸습니다.
theological_decisions:
- issue: 왕의 권위를 드러내는 술어의 강도
  chosen_reading: ‘권위가 있으니’로 옮겨 왕의 말이 실제로 구속력을 가진다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘권세가 있으니’
  - ‘통치력이 있으니’
  rationale: 본문의 초점은 단순한 위엄이 아니라 말 자체가 지닌 재판적·통치적 효력에 있으므로, 현대 한국어에서 가장 직접적인 ‘권위’를 택했습니다.
  doctrine_reference: 전도서 8:4의 왕권/통치 일반 원리
