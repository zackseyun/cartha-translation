  to: 땅 위에서 일어나는 헛됨이 있습니다. 악인들의 행위에 걸맞은 일을 당하는 의인들이 있고, 의인들의 행위에 걸맞은 일을 당하는 악인들도 있습니다. 나는 이것도 헛됨이라고 말했습니다.[a]
