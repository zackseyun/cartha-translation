id: ECC.8.14
reference: Ecclesiastes 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֶשׁ הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל הָ/אָרֶץ֒ אֲשֶׁ֣ר יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵ/הֶם֙ כְּ/מַעֲשֵׂ֣ה הָ/רְשָׁעִ֔ים וְ/יֵ֣שׁ רְשָׁעִ֔ים שֶׁ/מַּגִּ֥יעַ אֲלֵ/הֶ֖ם כְּ/מַעֲשֵׂ֣ה הַ/צַּדִּיקִ֑ים אָמַ֕רְתִּי שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/014.yaml
  text: 'There is a vanity that is done on the earth: there are righteous people to whom it happens according to the deeds of the wicked[a], and there are wicked people to whom it happens according to the deeds of the righteous. I said that this too is vanity.'
  footnotes:
  - marker: a
    text: Or 'futility' or 'vapor.' The Hebrew הֶבֶל is a key term in Ecclesiastes for what is fleeting, elusive, or frustratingly incongruous.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅 위에서 일어나는 헛됨이 있습니다. 악인들의 행위에 걸맞은 일을 당하는 의인들이 있고, 의인들의 행위에 걸맞은 일을 당하는 악인들도 있습니다. 나는 이것도 헛됨이라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛됨’은 전도서의 핵심어 הֶבֶל을 옮긴 것입니다. 이 말에는 ‘허무’ 또는 입김이나 바람처럼 덧없고 붙잡을 수 없음의 뜻과, 이 절에서처럼 이해하기 어려운 부조리의 뉘앙스가 함께 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛됨
  alternatives_korean:
  - 허무
  - 공허
  - 헛것
  lexicon: HALOT
  rationale: 전도서의 핵심어로서, 전통적 번역어인 ‘헛됨’을 살리되 현대어로 자연스럽게 읽히도록 했습니다. ‘허무’보다 반복 구절의 관용과 책의 어조를 더 잘 보존합니다.
- source_word: נַעֲשָׂה
  english_pob_choice: is done
  chosen_korean: 이루어지는
  alternatives_korean:
  - 일어나는
  - 행해지는
  - 생기는
  lexicon: HALOT
  rationale: 땅 위에서 ‘일어나는’ 현실을 나타내되, 수동적 뉘앙스를 살려 ‘이루어지는’으로 옮겼습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: on the earth
  chosen_korean: 땅 위에는
  alternatives_korean:
  - 세상에는
  - 지면 위에는
  - 땅에서는
  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어에서 자연스러운 장소 표지로 처리했습니다. ‘땅’은 כאן의 물리적-세계적 범위를 비교적 직접적으로 반영합니다.
- source_word: מַגִּיעַ אֲלֵהֶם
  english_pob_choice: it happens to them
  chosen_korean: 닥치는
  alternatives_korean:
  - 이르게 되는
  - 미치는
  - 임하는
  lexicon: HALOT
  rationale: 원문의 ‘그들에게 이른다/미친다’는 뜻을 살리면서, 결과가 뜻밖에 들이닥치는 느낌을 주는 한국어로 옮겼습니다.
- source_word: כְּמַעֲשֵׂה
  english_pob_choice: according to the deeds of
  chosen_korean: 행위대로
  alternatives_korean:
  - 행실에 따라
  - 행동에 따라
  - 한 일대로
  lexicon: HALOT
  rationale: 마땅히 받을 결과와 행위의 대응 관계를 간결하게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 전도서의 הֶבֶל을 한국어로 어떻게 유지할지
  chosen_reading: ‘헛됨’으로 통일해, 책 전체의 반복 어조와 의미상의 불일치를 함께 드러냈습니다.
  alternative_readings:
  - 허무
  - 공허
  - 무의미
  rationale: 이 절은 의인과 악인의 역전된 처지를 가리키며, 단순한 감정적 허무보다 ‘이해하기 어렵고 어긋난 현실’의 뉘앙스가 강합니다. ‘헛됨’이 전도서의 전통적 문맥과 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms)
