  source_fidelity: 첫 문장의 ‘이루어지는 헛됨’은 נַעֲשָׂה의 ‘땅 위에서 일어나는/벌어지는’ 사건성을 다소 부자연스럽게 전달합니다. 또한 ‘악인의 행위대로 닥치는 의인들’은 ‘행위’가 의인들에게 닥친다는 듯한 문법적·의미적 모호성을 낳습니다. 원문은 의인에게 악인에게 걸맞은 결과가, 악인에게 의인에게 걸맞은 결과가 이르는 역설을 말합니다.
  naturalness: ‘땅 위에서 일어나는 헛됨’과 ‘…에 걸맞은 일을 당하는’은 현대 표준어에서 자연스럽고, 원문의 평행 구조와 역설을 명료하게 보존합니다. 문장 종결은 합쇼체를 유지했습니다.
  terminology: הֶבֶל은 전도서의 반복 핵심어인 ‘헛됨’으로 유지하는 것이 적절합니다. 각주에서는 ‘입김/바람처럼 사라짐’보다 הֶבֶל의 덧없음·붙잡을 수 없음 및 이 문맥의 부조리성을 더 정확히 밝혀야 합니다.
