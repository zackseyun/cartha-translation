id: ECC.8.8
reference: Ecclesiastes 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣ין אָדָ֞ם שַׁלִּ֤יט בָּ/ר֨וּחַ֙ לִ/כְל֣וֹא אֶת הָ/ר֔וּחַ וְ/אֵ֤ין שִׁלְטוֹן֙ בְּ/י֣וֹם הַ/מָּ֔וֶת וְ/אֵ֥ין מִשְׁלַ֖חַת בַּ/מִּלְחָמָ֑ה וְ/לֹֽא יְמַלֵּ֥ט רֶ֖שַׁע אֶת בְּעָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/008.yaml
  text: No man has power over the wind to restrain the wind[a], and there is no authority over the day of death, and there is no discharge in war, and wickedness will not deliver its master.
  footnotes:
  - marker: a
    text: 'Or ''spirit'': ''No man has power over the spirit to restrain the spirit.'' Hebrew רוּחַ can mean wind, spirit, or breath.'
    reason: alternative_reading
translation:
  language: ko
  text: 사람은 바람을 억누를 권세가 없어서 바람을 가둘 수 없고, 죽는 날에 대한 권세도 없으며, 전쟁에서 제대할 수도 없고, 악은 자기 주인을 구하지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘영’: “사람은 영을 억누를 권세가 없어서 영을 가둘 수 없다.” 히브리어 רוּחַ는 바람, 영, 숨을 뜻할 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין אָדָם שַׁלִּיט
  english_pob_choice: No man has power
  chosen_korean: 사람은 … 권세가 없어서
  alternatives_korean:
  - 사람은 … 힘이 없어서
  - 아무도 … 권한이 없어서
  lexicon: HALOT
  rationale: אָדָם의 일반적 인간 지칭을 한국어 보편 표현 ‘사람’으로 옮기고, שַׁלִּיט의 지배/통제 능력은 문맥상 ‘권세’로 자연스럽게 풀어 바람·죽음·전쟁을 포괄하는 무능력 진술로 나타냈습니다.
- source_word: בָּרוּחַ / אֶת הָרוּחַ
  english_pob_choice: the wind ... the wind
  chosen_korean: 바람을 억누를 … 바람을 가둘 수 없고
  alternatives_korean:
  - 영을 억누를 … 영을 가둘 수 없고
  - 바람을 붙잡아 둘 … 바람을 붙잡아 둘 수 없고
  lexicon: HALOT
  rationale: POB가 채택한 ‘바람’ 해석을 따라 첫 번째 רוּחַ와 두 번째 רוּחַ를 모두 바람으로 두었고, לִכְלוֹא는 ‘가두다’보다 자연스러운 ‘억누르다/가두다’로 옮겨 통제 불가능성을 살렸습니다.
- source_word: שִׁלְטוֹן בְּיוֹם הַמָּוֶת
  english_pob_choice: there is no authority over the day of death
  chosen_korean: 죽는 날에 대한 권세도 없으며
  alternatives_korean:
  - 죽음의 날에 대한 권세도 없으며
  - 죽는 날을 지배할 권한도 없으며
  lexicon: HALOT
  rationale: שִׁלְטוֹן은 지배권/권세의 뜻이므로 한국어 성경 문맥에 맞는 ‘권세’로 옮겼고, ‘죽는 날’은 시간 개념을 살려 직역했습니다.
- source_word: מִשְׁלַחַת בַּמִּלְחָמָה
  english_pob_choice: there is no discharge in war
  chosen_korean: 전쟁에서 제대할 수도 없고
  alternatives_korean:
  - 전쟁에서 면제될 수도 없고
  - 전쟁에서 풀려날 수도 없고
  lexicon: HALOT
  rationale: 군사적 맥락의 מִשְׁלַחַת을 한국어에서 가장 관용적인 병역 해제 표현인 ‘제대’로 옮겨, 전쟁이 시작되면 인간이 임의로 빠져나올 수 없다는 뜻을 분명히 했습니다.
- source_word: רֶשַׁע אֶת בְּעָלָיו
  english_pob_choice: wickedness will not deliver its master
  chosen_korean: 악은 자기 주인을 구하지 못합니다
  alternatives_korean:
  - 악은 자기 주인을 건져내지 못합니다
  - 악은 그것을 따르는 자를 구하지 못합니다
  lexicon: HALOT
  rationale: רֶשַׁע을 추상명사로 유지하면서도 히브리어의 의인화된 ‘주인’ 관계를 살려 ‘자기 주인’으로 옮겼고, יְמַלֵּט은 구원 의미를 과도하게 신학화하지 않는 ‘구하다/건져내다’로 처리했습니다.
theological_decisions:
- issue: רוּחַ의 의미 선택
  chosen_reading: 본문은 ‘바람’으로 번역하되, 히브리어의 다의성은 주석 없이 본문 밖으로 넘기지 않고 유지합니다.
  alternative_readings:
  - 영
  - 숨
  rationale: 문맥의 연속된 불가통제 항목들(바람, 죽음, 전쟁)이 자연현상인 바람을 지지하므로 본문은 그 의미를 따르되, 다의성 자체는 POB의 영어 각주 전통에 맞춰 보존합니다.
  doctrine_reference: Translation philosophy §3 (의미를 임의로 해소하지 않고 긴장을 보존)
