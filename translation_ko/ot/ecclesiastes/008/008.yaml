revisions:
- from: 사람은 바람을 억누를 권세가 없어서 바람을 가둘 수 없고, 죽는 날에 대한 권세도 없으며, 전쟁에서 제대할 수도 없고, 악은 자기 주인을 구하지 못합니다.[a]
  to: 사람은 바람을 가둘 권세가 없고, 죽음의 날에 대한 권세도 없으며, 전쟁 중에는 제대도 없고, 악은 그 주인을 구해 내지 못합니다.[a]
  rationale: 첫 절을 히브리어의 통일된 ‘권세가 없다’ 구조로 복원하여 불필요한 동작의 중복과 인과 관계를 제거했습니다. ‘죽음의 날’, ‘전쟁 중에는 제대도 없음’, 그리고 악이 의인화되어 그 주인을 구하지 못한다는 병렬 구조를 보존했습니다. 각주는 רוּחַ의 실제 다의성을 유지하되 대안 문장도 개정 본문과 같은 구조로 맞추었습니다.
