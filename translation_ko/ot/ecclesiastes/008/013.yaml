  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/טוֹב֙ לֹֽא יִהְיֶ֣ה לָֽ/רָשָׁ֔ע וְ/לֹֽא יַאֲרִ֥יךְ יָמִ֖ים כַּ/צֵּ֑ל אֲשֶׁ֛ר אֵינֶ֥/נּוּ יָרֵ֖א מִ/לִּ/פְנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/013.yaml
  text: But it will not go well for the wicked[a], and he will not prolong his days like a shadow[b], because he does not fear before God.
  footnotes:
  - marker: a
    text: Or, 'and he will not prolong his days.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'because he does not fear in the presence of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 악인에게는 잘되지 않을 것입니다[a]. 그는 그림자처럼 자기의 날을 길게 하지 못할 것입니다[b]. 이는 그가 하나님 앞에서 두려워하지 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그의 형편이 좋지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그가 하나님 앞에서 두려워하지 않기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹב
  english_pob_choice: But it will not go well
  chosen_korean: 그러나 … 잘되지 않을 것입니다
  alternatives_korean:
  - 그리고 … 좋지 않을 것입니다
  - 그러나 … 복되게 되지 않을 것입니다
  lexicon: WLC/HALOT
  rationale: טוֹב가 이 문맥에서 추상적 ‘좋음’보다 형편과 결과의 ‘잘됨/잘되지 않음’을 가리키므로, 전절과의 대비를 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: לָרָשָׁע
  english_pob_choice: for the wicked
  chosen_korean: 악인에게는
  alternatives_korean:
  - 사악한 자에게는
  - 악한 사람에게는
  lexicon: WLC/HALOT
  rationale: רָשָׁע은 지혜문학에서 윤리적 범주로서 ‘악인’이 가장 직접적이고 관용적인 대응입니다.
- source_word: וְלֹא יַאֲרִיךְ יָמִים
  english_pob_choice: and he will not prolong his days
  chosen_korean: 그는 … 자기의 날을 길게 하지 못할 것입니다
  alternatives_korean:
  - 그는 … 자기의 날을 연장하지 못할 것입니다
  - 그는 … 오래 살지 못할 것입니다
  lexicon: WLC/HALOT
  rationale: 히필의 직역 이미지를 살려 ‘날을 길게 하다’를 유지하되, 한국어 문장에서는 동작 주체를 분명히 하기 위해 ‘자기의 날’을 넣었습니다.
- source_word: כַּ/צֵּל
  english_pob_choice: like a shadow
  chosen_korean: 그림자처럼
  alternatives_korean:
  - 그림자 같이
  - 그늘처럼
  lexicon: WLC/HALOT
  rationale: שֵׁם ‘그림자’의 덧없음 이미지를 보존하면서, 한국어에서는 ‘처럼’이 가장 자연스럽게 비유를 전달합니다.
theological_decisions:
- issue: 마지막 분절의 관계절/이유절 처리
  chosen_reading: ‘이는 … 때문입니다’로 이유를 분명히 밝혀, 악인의 불행과 수명 단축이 하나님을 두려워하지 않는 태도와 연결됨을 드러냈습니다.
  alternative_readings:
  - ‘… 하나님 앞에서 두려워하지 않는 사람입니다’처럼 관계절로 옮김
  - ‘… 그가 하나님 앞에서 경외하지 않기 때문입니다’처럼 더 직역
  rationale: אֲשֶׁר가 여기서는 단순 수식보다 원인 설명의 기능이 강하므로, 한국어에서는 원인 접속을 명시하는 편이 문맥과 논리를 더 정확히 반영합니다.
  doctrine_reference: 지혜문학의 일반 원리로서의 인과를 보존
