id: ECC.8.17
reference: Ecclesiastes 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאִיתִי֮ אֶת כָּל מַעֲשֵׂ֣ה הָ/אֱלֹהִים֒ כִּי֩ לֹ֨א יוּכַ֜ל הָ/אָדָ֗ם לִ/מְצוֹא֙ אֶת הַֽ/מַּעֲשֶׂה֙ אֲשֶׁ֣ר נַעֲשָׂ֣ה תַֽחַת הַ/שֶּׁ֔מֶשׁ בְּ֠/שֶׁ/ל אֲשֶׁ֨ר יַעֲמֹ֧ל הָ/אָדָ֛ם לְ/בַקֵּ֖שׁ וְ/לֹ֣א יִמְצָ֑א וְ/גַ֨ם אִם יֹאמַ֤ר הֶֽ/חָכָם֙ לָ/דַ֔עַת לֹ֥א יוּכַ֖ל לִ/מְצֹֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/017.yaml
  text: 'Then I saw all the work of God: that man cannot find out the work that is done under the sun[a]. However much man labors to seek it out, he will not find it; and even if the wise man says he knows[b], he cannot find it out.'
  footnotes:
  - marker: a
    text: Or 'humankind cannot find out.' The Hebrew uses the singular 'man' generically for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'the wise man claims to know.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 하나님의 모든 일을 보았습니다. 곧, 사람이[a] 해 아래에서 이루어지는 일을 찾아낼 수 없다는 것입니다. 사람이 아무리 애써 그것을 찾으려 해도 찾아내지 못하며, 지혜로운 사람이 안다고 말할지라도[b] 찾아낼 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간은 찾아낼 수 없습니다.’ 히브리어는 단수 ‘사람’을 일반적 의미로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜로운 사람이 안다고 주장할지라도.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  english_pob_choice: Then I saw
  chosen_korean: 내가 보니
  alternatives_korean:
  - 그때 내가 보니
  - 그리고 내가 보니
  lexicon: HALOT
  rationale: 전개를 이어 주는 관찰 표현으로, 한국어에서는 ‘내가 보니’가 자연스럽고 결론적 관찰의 뉘앙스를 잘 살립니다.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  english_pob_choice: the work of God
  chosen_korean: 하나님이 하시는 모든 일
  alternatives_korean:
  - 하나님의 일
  - 하나님의 일하심
  lexicon: HALOT
  rationale: 단순한 ‘일’보다 진행 중인 행위성을 드러내며, 뒤의 ‘이루어진 그 일’과 대응되도록 넓은 의미를 유지했습니다.
- source_word: לִמְצוֹא ... לִמְצֹא
  english_pob_choice: find out / find it out
  chosen_korean: 찾아내다
  alternatives_korean:
  - 알아내다
  - 발견하다
  lexicon: HALOT
  rationale: 지적 이해의 실패를 나타내므로 ‘찾아내다’가 ‘알아내다’보다 원문의 반복적 실패를 더 일관되게 살립니다.
- source_word: תַחַת הַשֶּׁמֶשׁ
  english_pob_choice: under the sun
  chosen_korean: 해 아래에서
  alternatives_korean:
  - 태양 아래에서
  - 세상에서
  lexicon: HALOT
  rationale: 전도서의 반복어를 직역에 가깝게 유지해 주제어의 문학적 기능을 보존했습니다.
theological_decisions:
- issue: הָאָדָם의 보편적 인간 지시
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 인류
  rationale: 히브리어 단수 일반용법을 한국어에서도 보편적 대표성으로 옮기기 위해 ‘사람’을 사용했습니다. 성별 특정이 아니라 인간 일반의 한계를 말합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; contested terms policy for אָדָם
