  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁר֙ אֵין נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָ/רָעָ֖ה מְהֵרָ֑ה עַל כֵּ֡ן מָלֵ֞א לֵ֧ב בְּֽנֵי הָ/אָדָ֛ם בָּ/הֶ֖ם לַ/עֲשׂ֥וֹת רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/011.yaml
  text: Because the sentence against an evil deed is not carried out quickly[b][a], therefore the heart of the sons of man is fully set in them to do evil.
  footnotes:
  - marker: a
    text: Or 'the children of man,' that is, humanity in general.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew idiom literally says the heart is 'full' in them to do evil, expressing a settled resolve or emboldened inclination.
    reason: lexical_alternative
translation:
  language: ko
  text: 악한 행위에 대한 판결이 속히 집행되지 않으므로, 사람의 아들들의 마음은 그들 안에 가득 차 악을 행하려고 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 아들들’은 문자적으로는 남성형 표현이지만, 문맥상 인류 일반을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘가득하다’는 이미지를 통해, 악을 향한 굳은 결심이나 더 대담해진 성향을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתְגָם
  english_pob_choice: sentence
  chosen_korean: 판결
  alternatives_korean:
  - 선고
  - 판정
  - 판결문
  lexicon: HALOT
  rationale: 여기서는 악한 행위에 대한 공식적 사법 판단을 가리키므로, 현대 한국어의 법정 맥락에서 자연스러운 ‘판결’이 POB의 ‘sentence’를 가장 잘 받쳐 줍니다.
- source_word: נַעֲשָׂה ... מְהֵרָה
  english_pob_choice: is carried out quickly
  chosen_korean: 속히 집행되지
  alternatives_korean:
  - 빨리 이루어지지
  - 신속하게 실행되지
  - 재빨리 시행되지
  lexicon: HALOT
  rationale: ‘carried out’는 단순히 ‘되다’가 아니라 판결의 실행을 뜻하므로, 사법적 뉘앙스를 살린 ‘집행’으로 옮겼습니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 아들들의
  alternatives_korean:
  - 사람의 자손들의
  - 인간의 자녀들의
  - 인류의
  lexicon: HALOT
  rationale: 히브리어의 남성 대표 표현을 그대로 살리되, 한국어에서는 소유격 구조로 자연스럽게 풀어 ‘사람의 아들들’로 옮겼습니다.
- source_word: מָלֵא לֵב ... לַעֲשׂוֹת רָע
  english_pob_choice: the heart ... is fully set ... to do evil
  chosen_korean: 마음은 그들 안에 가득 차 악을 행하려고 합니다
  alternatives_korean:
  - 마음이 그들 안에서 악을 행하도록 완전히 굳어 있습니다
  - 마음이 그들 안에서 악을 하려는 데로 가득합니다
  - 마음이 그들 안에 충만하여 악을 행하려 합니다
  lexicon: HALOT
  rationale: ‘full’의 비유를 그대로 ‘가득 차’로 살리면서, 그 결과로 생기는 내적 결심·기울어짐을 한국어 동사구 ‘악을 행하려고 합니다’로 표현했습니다.
theological_decisions:
- issue: בְּנֵי הָאָדָם의 대표적·보편적 의미
  chosen_reading: ‘사람의 아들들’이라는 원형을 유지하면서, 전체 인류를 가리키는 보편적 표현으로 읽었습니다.
  alternative_readings:
  - ‘사람들’로 평이하게 일반화
  - ‘인류’로 성중립화
  rationale: 본문의 남성 대표 표현을 평준화하지 않고 보존해 원문의 어법을 드러내되, 문맥상 의미는 인류 일반을 가리킨다고 이해했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Contested terms table for אָדָם
