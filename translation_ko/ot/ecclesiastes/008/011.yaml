  rationale: ‘carried out’는 단순히 ‘되다’가 아니라 판결의 실행을 뜻하므로, 사법적 뉘앙스를 살린 ‘집행’으로 옮겼습니다.
- source_word: בְּנֵי הָאָדָם
  english_pob_choice: the sons of man
  chosen_korean: 사람의 아들들의
  alternatives_korean:
