source:
  edition: WLC
  text: וּ/בְ/כֵ֡ן רָאִיתִי֩ רְשָׁעִ֨ים קְבֻרִ֜ים וָ/בָ֗אוּ וּ/מִ/מְּק֤וֹם קָדוֹשׁ֙ יְהַלֵּ֔כוּ וְ/יִֽשְׁתַּכְּח֥וּ בָ/עִ֖יר אֲשֶׁ֣ר כֵּן עָשׂ֑וּ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/010.yaml
  text: And so I saw the wicked buried[a]; they had come and gone from the holy place, and they were forgotten in the city where they had done so[c][b]. This too is vanity.
  footnotes:
  - marker: a
    text: Or, following some ancient versions and a different understanding of the Hebrew, 'and they were praised in the city where they had done so.'
    reason: textual_variant
  - marker: b
    text: '''The holy place'' may refer to the temple precincts or another sacred place.'
    reason: cultural_note
  - marker: c
    text: Hebrew hebel, often rendered 'vanity'; also 'vapor,' suggesting something fleeting or elusive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 나는 악인들이 묻힌 것을 보았습니다. 그들은 거룩한 곳에 왔다가 떠났고[b], 그들이 그렇게 행하던 도성에서 잊혔습니다[a]. 이것도 헛됨입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 히브리어는 ‘잊혀졌다’는 뜻이 자연스럽지만, 고대 역본 일부와 히브리어를 달리 이해하는 견해는 ‘그들이 그렇게 행하던 도성에서 칭송받았다’는 뜻을 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: ‘거룩한 곳’은 성전 구역이나 다른 성스러운 장소를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 hebel은 흔히 ‘헛됨’으로 옮기며, ‘입김’ 또는 ‘증기’처럼 덧없고 잡히지 않는 성격도 시사합니다.
    reason: lexical_alternative
