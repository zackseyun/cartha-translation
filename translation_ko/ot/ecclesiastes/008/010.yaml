  lexicon: HALOT
  rationale: 앞 문맥의 관찰을 잇는 결론적 연결을 자연스럽게 살리면서, 합쇼체 서술문에 어울리는 문어적 연결어로 옮겼습니다.
- source_word: רְשָׁעִים
