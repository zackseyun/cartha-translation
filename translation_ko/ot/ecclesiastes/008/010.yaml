  rationale: 문맥상 성전 구역일 가능성을 열어 두되, 원문의 일반명사를 과도하게 특정하지 않도록 ‘거룩한 곳’으로 옮겼습니다.
- source_word: וְיִשְׁתַּכְּחוּ
  english_pob_choice: they were forgotten
  chosen_korean: 잊혀졌습니다
  alternatives_korean:
  - 기억되지 않았습니다
  - 잊혔습니다
  - 사라졌습니다
  lexicon: HALOT
  rationale: 동사 שכח의 기본 의미를 그대로 살렸고, 본문이 지닌 씁쓸한 관찰을 유지했습니다.
- source_word: גַּם זֶה הָבֶל
  english_pob_choice: This too is vanity
  chosen_korean: 이것도 헛됨입니다
  alternatives_korean:
  - 이것도 허무입니다
  - 이것도 덧없음입니다
  - 이것도 바람입니다
  lexicon: HALOT
  rationale: 전도서의 반복어 הבל을 한국어 성경 전통과 현대 가독성 사이에서 균형 있게 ‘헛됨’으로 옮겼습니다.
theological_decisions:
- issue: ‘거룩한 곳’의 구체성
  chosen_reading: 원문이 직접 특정하지 않는 범위 안에서, 성전일 가능성을 열어 두되 본문에는 일반적 표현인 ‘거룩한 곳’을 유지했습니다.
  alternative_readings:
  - 성전에서
  - 성소에서
  - 거룩한 성소에서
  rationale: 본문은 장소를 암시하지만 명시적으로 규정하지 않으므로, 해석을 앞서가며 특정 제도를 단정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
