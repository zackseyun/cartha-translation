lexical_decisions:
- source_word: לְכָל חֵפֶץ
  english_pob_choice: for every matter
  chosen_korean: 모든 일
  alternatives_korean:
  - 모든 문제
  - 모든 목적
  - 모든 일/사안
  lexicon: HALOT
  rationale: חֵפֶץ는 문맥에 따라 기쁨, 소원, 목적, 일/사안을 뜻할 수 있는데, 전도서 8:6에서는 3:1과 같이 ‘때’와 짝지어 각 사안의 보편성을 말하므로 ‘모든 일’이 가장 자연스럽고 넓습니다.
- source_word: יֵשׁ עֵת
  english_pob_choice: there is a time
  chosen_korean: 때가 있습니다
  alternatives_korean:
  - 정해진 때가 있습니다
  - 시간이 있습니다
  lexicon: HALOT
  rationale: 히브리어의 존재문을 한국어로 자연스럽게 옮기되, 전도서의 반복 주제인 ‘때’를 그대로 살렸습니다.
- source_word: וּמִשְׁפָּט
  english_pob_choice: and a judgment
  chosen_korean: 심판이 있습니다
  alternatives_korean:
  - 판단이 있습니다
  - 판결이 있습니다
  - 공정한 처리가 있습니다
  lexicon: HALOT
  rationale: מִשְׁפָּט는 판단, 판결, 공의, 질서 등 폭이 넓지만, 여기서는 ‘때’와 병렬되어 마땅한 결말/판정을 가리키므로 ‘심판’이 핵심 의미를 잘 드러냅니다.
- source_word: רָעַת הָאָדָם
  english_pob_choice: the evil of man
  chosen_korean: 사람의 악
  alternatives_korean:
  - 사람의 고난
  - 사람의 불행
  - 인류의 악
  lexicon: HALOT
  rationale: רָעָה는 악, 재앙, 고난, 불행까지 포괄할 수 있지만, 본문은 문맥상 사람에게 얹힌 무거운 악/해악의 성격을 함께 지니므로 ‘사람의 악’으로 두고 여운을 남겼습니다.
- source_word: רַבָּה עָלָיו
  english_pob_choice: weighs heavily upon him
  chosen_korean: 그에게 크게 무겁게 지워지기 때문입니다
  alternatives_korean:
  - 그에게 크게 얹히기 때문입니다
  - 그에게 무겁게 내려오기 때문입니다
  - 그를 크게 짓누르기 때문입니다
  lexicon: HALOT
  rationale: 직역하면 ‘그에게 크다/크게 있다’이지만, 한국어에서는 무게감과 압박을 함께 살리는 표현이 필요해 ‘무겁게 지워지다’로 옮겼습니다.
theological_decisions:
- issue: מִשְׁפָּט의 의미 범위
  chosen_reading: 심판
  alternative_readings:
  - 판단
  - 공의
  - 판결
  rationale: 본문은 단순한 추상 원리보다 하나님 앞의 마땅한 판정/심판을 떠올리게 하므로, 한국어 독자에게도 긴장감을 유지하는 ‘심판’이 가장 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; broad lexical range of מִשְׁפָּט.
- issue: הָאָדָם의 일반명사성
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 인류
  rationale: 히브리어 단수형의 보편적 인간을 가리키는 표현이므로, 성중립적 완화보다 원형에 가까운 ‘사람’을 택했습니다.
  doctrine_reference: Gender-accurate over gender-neutral; אָדָם default 'man / humankind (context)'.
