id: ECC.11.9
reference: Ecclesiastes 11:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂמַ֧ח בָּח֣וּר בְּ/יַלְדוּתֶ֗י/ךָ וִֽ/יטִֽיבְ/ךָ֤ לִבְּ/ךָ֙ בִּ/ימֵ֣י בְחוּרוֹתֶ֔/ךָ וְ/הַלֵּךְ֙ בְּ/דַרְכֵ֣י לִבְּ/ךָ֔ וּ/בְ/מַרְאֵ֖י עֵינֶ֑י/ךָ וְ/דָ֕ע כִּ֧י עַל כָּל אֵ֛לֶּה יְבִֽיאֲ/ךָ֥ הָ/אֱלֹהִ֖ים בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
  footnotes:
  - marker: a
    text: Or 'let your heart make you glad.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the days of your youth.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'in the sight/appearance of your eyes.'
    reason: lexical_alternative
  - marker: d
    text: Ecclesiastes holds together the enjoyment of life and accountability before God; the verse may be read either as qualified permission or as warning-laden exhortation.
    reason: alternative_reading
translation:
  language: ko
  text: 청년이여, 네 젊은 시절에 기뻐하고, 네 젊은 날들에 네 마음이 너를 즐겁게 하게 하십시오. 네 마음이 가는 길들과 네 눈에 보이는 대로 걸으십시오. 그러나 이 모든 일로 하나님께서 너를 심판으로 이끌어 가실 것을 알아두십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하고’는 ‘네 마음이 너를 즐겁게 하게 하십시오’와 함께 원문의 명령형 반복을 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘네 눈에 보이는 대로’는 문자적으로는 ‘네 눈의 보임/모습’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 전도서는 즐김과 책임을 함께 붙들며, 이 구절은 허용의 권고이면서 동시에 경고를 담은 말씀으로 읽힐 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: שְׂמַח
  english_pob_choice: Rejoice
  chosen_korean: 기뻐하고
  alternatives_korean:
  - 즐거워하고
  - 환호하고
  lexicon: HALOT
  rationale: 명령형의 적극적 기쁨을 살리면서 현대 한국어에서 자연스럽고 격조 있는 표현으로 옮겼습니다.
- source_word: בָּחוּר
  english_pob_choice: young man
  chosen_korean: 청년이여
  alternatives_korean:
  - 젊은이여
  - 젊은 사람아
  lexicon: HALOT
  rationale: 히브리어가 남성 단수로 직접 호칭하므로, 성별이 드러나는 ‘청년’으로 옮기되 한국어 호격을 살렸습니다.
- source_word: וִיטִיבְךָ לִבְּךָ
  english_pob_choice: let your heart cheer you
  chosen_korean: 네 마음이 너를 즐겁게 하게 하십시오
  alternatives_korean:
  - 네 마음이 너를 기쁘게 하게 하십시오
  - 네 마음이 너를 즐겁게 하십시오
  lexicon: HALOT
  rationale: ‘마음’이 주체가 되어 기쁨을 일으킨다는 사역적 의미를 보존하면서, 한국어에서 어색하지 않은 이중 사역 구조로 옮겼습니다.
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  english_pob_choice: in the sight of your eyes
  chosen_korean: 네 눈에 보이는 대로
  alternatives_korean:
  - 네 눈의 보이는 바에 따라
  - 네 눈앞에 보이는 대로
  lexicon: HALOT
  rationale: 직역의 ‘눈의 시야/보임’은 한국어에서 자연스럽지 않아, 원문의 관찰·지각 의미를 유지하는 범위에서 관용적으로 옮겼습니다.
- source_word: בַּמִּשְׁפָּט
  english_pob_choice: into judgment
  chosen_korean: 심판으로 이끌어 가실
  alternatives_korean:
  - 심판으로 데려가실
  - 재판으로 이끌어 가실
  lexicon: HALOT
  rationale: 법정적 평가를 뜻하는 뉘앙스를 살리면서, 하나님이 행위자를 심판 자리로 데려가신다는 동작성을 한국어로 분명히 했습니다.
theological_decisions:
- issue: 권고와 경고의 긴장 보존
  chosen_reading: 청년에게 즐거움을 허용하는 권고와, 그 모든 일에 대한 하나님의 심판 경고를 함께 살려 긴장을 풀지 않았습니다.
  alternative_readings:
  - 이 구절을 풍자적 경고로만 읽는 해석
  - 즐거움의 허용을 더 강하게 강조하는 해석
  rationale: 전도서는 삶의 즐김과 하나님 앞의 책임을 함께 붙드는 문맥이므로, 어느 한쪽으로 기울여 문맥의 긴장을 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 호칭의 성별 정확성
  chosen_reading: הבָּחוּר는 남성 단수 호칭이므로 ‘청년’으로 유지했습니다.
  alternative_readings:
  - 젊은이
  - 청춘
  rationale: 본문의 직접 호칭과 문법적 성별을 희석하지 않기 위해 중성화하지 않았습니다.
  doctrine_reference: 'Translation philosophy §4: Gender-accurate over gender-neutral.'
