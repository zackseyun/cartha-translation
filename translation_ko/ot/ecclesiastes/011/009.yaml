base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
  footnotes:
  - marker: a
    text: Or 'let your heart make you glad.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the days of your youth.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'in the sight/appearance of your eyes.'
    reason: lexical_alternative
  - marker: d
    text: Ecclesiastes holds together the enjoyment of life and accountability before God; the verse may be read either as qualified permission or as warning-laden exhortation.
    reason: alternative_reading
translation:
  language: ko
  text: 청년이여, 네 젊은 시절에 기뻐하고 네 젊은 날에 네 마음이 너를 즐겁게 하도록 하십시오. 네 마음의 길을 따라, 네 눈에 보이는 대로 걸으십시오. 그러나 이 모든 일로 말미암아 하나님께서 너를 심판에 이르게 하실 것을 알아두십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하고’와 ‘네 마음이 너를 즐겁게 하도록 하십시오’는 모두 원문의 명령을 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘네 눈에 보이는 대로’는 문자적으로 ‘네 눈의 보임/모습’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 전도서는 삶의 즐김과 하나님 앞에서의 책임을 함께 말합니다. 이 구절은 허용의 권고이면서 동시에 경고를 담은 말로 읽힐 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: שְׂמַח
