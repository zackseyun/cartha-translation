  - 젊은 사람아
  lexicon: HALOT
  rationale: 히브리어가 남성 단수로 직접 호칭하므로, 성별이 드러나는 ‘청년’으로 옮기되 한국어 호격을 살렸습니다.
- source_word: וִיטִיבְךָ לִבְּךָ
  english_pob_choice: let your heart cheer you
  chosen_korean: 네 마음이 너를 즐겁게 하게 하십시오
  alternatives_korean:
  - 네 마음이 너를 기쁘게 하게 하십시오
  - 네 마음이 너를 즐겁게 하십시오
  lexicon: HALOT
  rationale: ‘마음’이 주체가 되어 기쁨을 일으킨다는 사역적 의미를 보존하면서, 한국어에서 어색하지 않은 이중 사역 구조로 옮겼습니다.
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  english_pob_choice: in the sight of your eyes
  chosen_korean: 네 눈에 보이는 대로
  alternatives_korean:
  - 네 눈의 보이는 바에 따라
  - 네 눈앞에 보이는 대로
  lexicon: HALOT
  rationale: 직역의 ‘눈의 시야/보임’은 한국어에서 자연스럽지 않아, 원문의 관찰·지각 의미를 유지하는 범위에서 관용적으로 옮겼습니다.
- source_word: בַּמִּשְׁפָּט
  english_pob_choice: into judgment
  chosen_korean: 심판으로 이끌어 가실
  alternatives_korean:
  - 심판으로 데려가실
  - 재판으로 이끌어 가실
  lexicon: HALOT
  rationale: 법정적 평가를 뜻하는 뉘앙스를 살리면서, 하나님이 행위자를 심판 자리로 데려가신다는 동작성을 한국어로 분명히 했습니다.
theological_decisions:
- issue: 권고와 경고의 긴장 보존
  chosen_reading: 청년에게 즐거움을 허용하는 권고와, 그 모든 일에 대한 하나님의 심판 경고를 함께 살려 긴장을 풀지 않았습니다.
  alternative_readings:
  - 이 구절을 풍자적 경고로만 읽는 해석
  - 즐거움의 허용을 더 강하게 강조하는 해석
  rationale: 전도서는 삶의 즐김과 하나님 앞의 책임을 함께 붙드는 문맥이므로, 어느 한쪽으로 기울여 문맥의 긴장을 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 호칭의 성별 정확성
  chosen_reading: הבָּחוּר는 남성 단수 호칭이므로 ‘청년’으로 유지했습니다.
  alternative_readings:
  - 젊은이
  - 청춘
  rationale: 본문의 직접 호칭과 문법적 성별을 희석하지 않기 위해 중성화하지 않았습니다.
  doctrine_reference: 'Translation philosophy §4: Gender-accurate over gender-neutral.'
