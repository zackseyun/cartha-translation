source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר אֵֽינְ/ךָ֤ יוֹדֵ֨עַ֙ מַה דֶּ֣רֶךְ הָ/ר֔וּחַ כַּ/עֲצָמִ֖ים בְּ/בֶ֣טֶן הַ/מְּלֵאָ֑ה כָּ֗כָה לֹ֤א תֵדַע֙ אֶת מַעֲשֵׂ֣ה הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר יַעֲשֶׂ֖ה אֶת הַ/כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/005.yaml
  text: Just as you do not know the way of the wind[a], or how the bones form in the womb of a pregnant woman, so you do not know the work of God[b], who makes everything.
  footnotes:
  - marker: a
    text: Or 'the way of the spirit' or 'how the breath goes'; Hebrew רוּחַ can mean 'wind,' 'breath,' or 'spirit.'
    reason: alternative_reading
  - marker: b
    text: Literally 'in the womb of the full one,' an idiom for a pregnant woman.
    reason: cultural_note
translation:
  language: ko
  text: 바람의 길을 알 수 없고[a], 임신한 여인의 태중에서 뼈들이 어떻게 형성되는지도 알 수 없듯이[b], 만물을 이루시는 하나님의 일을 알 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영의 길’, ‘숨결의 길’로 옮길 수 있습니다. 히브리어 רוּחַ는 ‘바람’, ‘숨결’, ‘영’을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어를 직역하면 ‘가득 찬 여인의 태 안에서’라는 뜻으로, 임신한 여인을 가리키는 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ הָרוּחַ
  english_pob_choice: the way of the wind
  chosen_korean: 바람의 길
  alternatives_korean:
  - 영의 길
  - 숨결이 가는 길
  lexicon: HALOT
  rationale: רוּחַ의 핵심적 자연현상 의미를 살려 wisdom 문맥의 ‘알 수 없는 현상’을 드러내면서, דֶּרֶךְ의 ‘way’도 직역에 가깝게 보존했습니다.
- source_word: כַּעֲצָמִים
  english_pob_choice: how the bones form
  chosen_korean: 뼈들이 어떻게 형성되는지도
  alternatives_korean:
  - 뼈들처럼
  - 뼈들이 어떻게 되는지도
  lexicon: HALOT
  rationale: 히브리어는 생략된 비교를 담은 표현이라 한국어에서는 의미를 풀어 ‘형성되는’으로 옮겨, 태중의 감추어진 발달 과정을 분명하게 했습니다.
- source_word: בְּבֶטֶן הַמְּלֵאָה
  english_pob_choice: in the womb of a pregnant woman
  chosen_korean: 임신한 여인의 태중에서
  alternatives_korean:
  - 가득 찬 태 안에서
  - 태가 가득한 여인의 배 속에서
  lexicon: HALOT
  rationale: 직역하면 어색한 관용구이므로, 문맥상 지시하는 대상을 현대 한국어로 분명하게 풀어 주었습니다.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  english_pob_choice: the work of God
  chosen_korean: 하나님이 하시는 일
  alternatives_korean:
  - 하나님의 일
  - 하나님의 일하심
  lexicon: HALOT
  rationale: ‘work of God’의 동작성과 결과성을 함께 살리기 위해 ‘하나님이 하시는 일’로 옮겼습니다.
theological_decisions:
- issue: רוּחַ의 의미 선택
  chosen_reading: 바람
  alternative_readings:
  - 영
  - 숨결
  rationale: 이 절은 자연 세계의 보이지 않는 과정에 대한 인간의 무지를 병치하므로, 바람을 택해야 문맥의 비유가 가장 직접적으로 드러납니다. 의미 중첩은 주석적으로는 열어 두되 본문은 한 가지를 택했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
