translation:
  language: ko
  text: 빛은 달콤하며, 해를 보는 것은 눈에 좋습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달콤하다’는 여기서 문자적 맛보다 ‘즐겁고 기분 좋다’는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해를 본다’는 표현은 문자적으로는 해를 보는 것이지만, 살아 있음과 지상에서의 삶을 누리는 것을 가리키는 관용적 표현일 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמָתוֹק / sweet
  english_pob_choice: sweet
  chosen_korean: 달콤하고
  alternatives_korean:
  - 즐겁고
  - 기분 좋고
  - 상쾌하고
  lexicon: HALOT
  rationale: מָתוֹק의 기본 뜻인 ‘달콤함’을 살려, 원문의 감각적·시적 이미지를 보존했습니다. English POB의 ‘sweet’도 같은 방향이므로 한국어에서도 ‘달콤하다’가 가장 직접적입니다.
- source_word: הָאוֹר / the light
  english_pob_choice: the light
  chosen_korean: 빛은
  alternatives_korean:
  - 그 빛은
  - 광명은
  - 해는
  lexicon: HALOT
  rationale: 정관사가 있는 ‘the light’를 한국어에서는 자연스럽게 ‘빛’으로 옮기되, 문맥상 태양빛/생명 빛을 지나치게 풀이하지 않고 원문의 간결함을 유지했습니다.
- source_word: לָעֵינַיִם / for the eyes
  english_pob_choice: for the eyes
  chosen_korean: 눈에
  alternatives_korean:
  - 눈에게
  - 눈을 위해
  - 눈에 대하여
  lexicon: HALOT
  rationale: 히브리어의 유익/대상 관계를 한국어 자연어로 살려 ‘눈에 좋습니다’로 옮겼습니다. 직역형 ‘눈에게’보다 현대 한국어에서 더 자연스럽고, 원문의 관용성을 유지합니다.
- source_word: לִרְאוֹת אֶת־הַשָּׁמֶשׁ / to see the sun
  english_pob_choice: to see the sun
  chosen_korean: 태양을 보는 것은
  alternatives_korean:
  - 해를 보는 것은
  - 햇빛을 보는 것은
  - 태양을 바라보는 것은
  lexicon: HALOT
  rationale: English POB의 문자적 표현을 따라 ‘태양을 보는 것’으로 유지했습니다. ‘해를 보라’는 식으로 의미를 풀지 않고, 원문이 가진 생명/삶의 암시를 독자가 읽어내도록 남겼습니다.
theological_decisions:
- issue: ‘태양을 보는 것’의 관용적 함의(살아 있음, 지상 삶의 향유)를 본문에 명시할지 여부
  chosen_reading: 본문에는 문자적 표현을 유지하고 함의를 드러내지 않았습니다.
  alternative_readings:
  - 살아 있는 것이 좋습니다
  - 세상의 삶을 누리는 것은 좋습니다
  rationale: 전도서의 태양 이미지는 관용적으로 생명과 지상 삶을 가리킬 수 있지만, 히브리어 본문 자체는 구체적이고 시적인 표현을 사용합니다. 본문에서 풀어쓰면 시적 긴장과 독자가 읽어낼 여지가 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
