revisions:
- from: 그러므로 마음에서 분노를 없애고, 몸에서 악을 떼어 내십시오. 청춘과 삶의 새벽은 허무이기 때문입니다.[a][b][c][d]
  to: 마음에서 근심을 없애고, 몸에서 해로운 것을 없애십시오. 어린 시절과 청년기는 덧없기 때문입니다.
  rationale: 접속사를 비추론적으로 처리하고, 어린 시절과 청년기라는 두 생애 단계를 구별했습니다. ‘근심’과 ‘해로운 것’은 각각 כַּעַס와 רָעָה의 문맥상 의미 범위를 과도하게 좁히지 않으며, ‘덧없다’는 הֶבֶל의 비지속성과 붙잡을 수 없음을 자연스럽게 전달합니다. 별도의 주석 없이는 번역 의미가 충분히 전달되므로 각주 표지는 제거했습니다.
