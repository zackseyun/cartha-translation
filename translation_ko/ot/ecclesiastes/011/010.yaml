base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/010.yaml
  text: So remove vexation from your heart, and put away harm from your flesh, for youth and the dawn of life are vapor.
translation:
  language: ko
  text: 마음에서 근심을 없애고, 몸에서 해로운 것을 없애십시오. 어린 시절과 청년기는 덧없기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעַס
  english_pob_choice: vexation
  chosen_korean: 분노
  alternatives_korean:
  - 번민
  - 격분
  - 짜증
  lexicon: כַּעַס
  rationale: 문맥상 마음속에 품는 강한 격앙과 분노를 가리키므로, POB의 ‘vexation’을 한국어로는 지나치게 약화시키지 않는 ‘분노’로 옮겼습니다.
- source_word: רָעָה
  english_pob_choice: harm
  chosen_korean: 악
  alternatives_korean:
  - 해
  - 해악
  - 나쁜 것
  lexicon: רָעָה
  rationale: 영어 POB는 본문을 ‘harm’으로 정리했지만, 히브리어는 단순한 피해보다 도덕적 악/해를 함께 포괄할 수 있어 ‘악’으로 두어 의미의 긴장을 보존했습니다.
- source_word: בְּשָׂר
  english_pob_choice: flesh
  chosen_korean: 몸
  alternatives_korean:
  - 육체
  - 육신
  - 살
  lexicon: בָּשָׂר
  rationale: 히브리어 ‘flesh’의 인격 전체와 삶의 실존을 가리키는 넓은 용법을 고려해, 한국어에서 직역적이면서도 오해가 적은 ‘몸’으로 옮겼습니다.
- source_word: הָבֶל
  english_pob_choice: vapor
  chosen_korean: 허무
  alternatives_korean:
  - 입김
  - 증기
  - 덧없음
  lexicon: הֶבֶל
  rationale: 전도서의 표어적 표현인 הֶבֶל은 단순 물질적 ‘증기’보다 덧없음과 실체 없음의 뉘앙스를 함께 담으므로, 문맥상 가장 자연스러운 ‘허무’로 옮겼습니다.
theological_decisions:
- issue: הֶבֶל의 신학적 무게
  chosen_reading: ‘청춘과 삶의 새벽은 허무’로 번역해, 젊음의 찬란함이 궁극적 실재가 아니라는 전도서의 관찰을 드러냈습니다.
  alternative_readings:
  - ‘청춘과 삶의 새벽은 증기’
  - ‘청춘과 젊은 날은 덧없음’
  rationale: 전도서에서 הֶבֶל은 단순한 소멸이 아니라 붙잡을 수 없음, 비실재성, 덧없음을 함께 말하므로, 한국어에서도 그 신학적 중량을 유지해야 합니다.
  doctrine_reference: Ecclesiastes 1:2; 12:8
