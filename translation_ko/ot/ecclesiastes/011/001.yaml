id: ECC.11.1
reference: Ecclesiastes 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שַׁלַּ֥ח לַחְמְ/ךָ֖ עַל פְּנֵ֣י הַ/מָּ֑יִם כִּֽי בְ/רֹ֥ב הַ/יָּמִ֖ים תִּמְצָאֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/001.yaml
  text: Cast your bread upon the surface of the waters, for after many days you will find it.
  footnotes:
  - marker: a
    text: Or, 'Send your bread upon the waters.' The Hebrew image may suggest generosity, investment, or both; the wording is left figurative in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 떡을 물 위에 던지십시오. 여러 날 뒤에 그것을 찾게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “물 위에”이지만, 히브리어의 표현은 “물의 표면 위에”라는 이미지를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלַּח
  english_pob_choice: Cast
  chosen_korean: 던지십시오
  alternatives_korean:
  - 보내십시오
  - 내버리십시오
  - 흩뿌리십시오
  lexicon: HALOT
  rationale: שלח의 기본 뜻은 ‘보내다/놓아주다’이지만, ‘떡’과 ‘물 위에’가 함께하는 비유에서는 한국어로도 동작성이 살아 있는 ‘던지십시오’가 원문의 생생한 이미지를 가장 자연스럽게 옮깁니다.
- source_word: לַחְמְךָ
  english_pob_choice: your bread
  chosen_korean: 너의 떡
  alternatives_korean:
  - 너의 빵
  - 너의 양식
  lexicon: HALOT
  rationale: לֶחֶם은 일반적으로 ‘떡/빵’이지만 히브리어의 구체적 음식 이미지를 살리기 위해 ‘떡’을 택했습니다. 현대 독자에게는 다소 옛말처럼 들릴 수 있어도, 잠언적 비유의 물질적 대상을 분명히 합니다.
- source_word: עַל פְּנֵי הַמָּיִם
  english_pob_choice: upon the waters
  chosen_korean: 물 위에
  alternatives_korean:
  - 물의 표면 위에
  - 물 위의 표면에
  - 물들 위에
  lexicon: HALOT
  rationale: פְּנֵי는 문자적으로 ‘얼굴/표면’이지만, 한국어에서는 ‘물 위에’가 비유를 해치지 않으면서도 자연스럽습니다. 영어 POB가 단순화한 최종본을 따라 과잉설명은 피했습니다.
- source_word: בְרֹב הַיָּמִים
  english_pob_choice: after many days
  chosen_korean: 여러 날 뒤에
  alternatives_korean:
  - 오랜 날이 지난 뒤에
  - 많은 날 뒤에
  - 오래 후에
  lexicon: HALOT
  rationale: 히브리어의 시간 지연을 한국어에서 가장 자연스럽게 나타내는 표현으로 ‘여러 날 뒤에’를 택했습니다. ‘after many days’의 지연성과 예언적 여운을 보존합니다.
- source_word: תִּמְצָאֶנּוּ
  english_pob_choice: you will find it
  chosen_korean: 그것을 찾게 될 것입니다
  alternatives_korean:
  - 그것을 찾을 것입니다
  - 그것을 발견하게 될 것입니다
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘찾다’를 유지하되, 미래적 결과를 분명히 하도록 ‘찾게 될 것입니다’로 옮겼습니다. 목적어 ‘그것’을 유지해 떡을 가리키는 지시를 분명히 합니다.
theological_decisions:
- issue: 잠언의 비유를 어떻게 해석할지
  chosen_reading: 주된 본문에서는 떡을 물 위에 던지는 이미지만 보존하고, 자선·투자·위험감수 중 어느 하나로도 해석을 고정하지 않았습니다.
  alternative_readings:
  - 후한 베풂에 대한 권면
  - 상업적 투자나 위험 감수에 대한 격려
  rationale: 히브리어 본문은 의도적으로 비유적이며, 문맥만으로 해석을 단정하기 어렵습니다. 따라서 본문은 이미지를 그대로 살리고, 해석을 미리 결정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
