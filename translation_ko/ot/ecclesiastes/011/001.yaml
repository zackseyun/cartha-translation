  to: 당신의 빵을 물 위에 던지십시오. 여러 날 뒤에 그것을 찾을 것입니다.[a]
  rationale: ‘빵’으로 음식 이미지를 정확히 옮기고, 단순 미래형 ‘찾을 것입니다’로 원문의 미래 진술을 보존했습니다. 본문의 비유성은 그대로 유지했으며, 각주에서만 פְּנֵי의 문자적 ‘표면’ 요소를 밝혔습니다.
