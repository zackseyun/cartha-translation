source:
  edition: WLC
  text: כִּ֣י אִם שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָ/אָדָ֖ם בְּ/כֻלָּ֣/ם יִשְׂמָ֑ח וְ/יִזְכֹּר֙ אֶת יְמֵ֣י הַ/חֹ֔שֶׁךְ כִּֽי הַרְבֵּ֥ה יִהְי֖וּ כָּל שֶׁ/בָּ֥א הָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/008.yaml
  text: For if a man lives many years[a], let him rejoice in them all; but let him remember the days of darkness, for they will be many. All that comes is vapor.
  footnotes:
  - marker: a
    text: Or 'Everything that comes is breath' or traditionally 'vanity.' The Hebrew hebel is a recurring term in Ecclesiastes for what is fleeting, insubstantial, or elusive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여러 해를 살게 되면, 그 모든 날에 즐거워하십시오. 그러나 어둠의 날들을 기억하십시오. 그것들이 많을 것이기 때문입니다. 오는 것은 모두 증기와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오는 것은 모두 입김입니다” 혹은 전통적으로 “헛됩니다.” 히브리어 הֶבֶל은 전도서에서 덧없고, 실체가 없고, 붙잡기 어려운 것을 가리키는 반복어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 그가 … 되면
  alternatives_korean:
  - 그가 … 한다면
  - 비록 … 하더라도
  lexicon: HALOT
  rationale: 조건문의 도입과 설명적 뉘앙스를 함께 살리기 위해 평이한 조건형으로 옮겼습니다.
- source_word: יִשְׂמָח
  english_pob_choice: let him rejoice
  chosen_korean: 즐거워하십시오
  alternatives_korean:
  - 기뻐하십시오
  - 즐기십시오
  lexicon: HALOT
  rationale: 권고의 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 문체상 격이 있는 합쇼체로 옮겼습니다.
- source_word: יְמֵי הַחֹשֶׁךְ
  english_pob_choice: the days of darkness
  chosen_korean: 어둠의 날들
  alternatives_korean:
  - 흑암의 날들
  - 어두움의 날들
  lexicon: HALOT
  rationale: 비유를 그대로 유지하면서도 한국어에서 가장 직접적이고 읽기 쉬운 표현을 택했습니다.
- source_word: הָבֶל
  english_pob_choice: vapor
  chosen_korean: 증기
  alternatives_korean:
  - 입김
  - 허무
  - 덧없음
  lexicon: HALOT
  rationale: 전통적 ‘헛됨/허무’로 평탄화하지 않고, 전도서의 핵심 은유인 덧없고 실체 없는 성격을 물질적 이미지로 살렸습니다.
theological_decisions:
- issue: הָבֶל의 최종 한국어 이미지
  chosen_reading: 증기와 같습니다
  alternative_readings:
  - 허무합니다
  - 입김과 같습니다
  - 덧없습니다
  rationale: 본문의 핵심 주제인 잠깐 나타났다가 사라지는 성격을 직접 드러내기 위해, 관념어보다 은유를 유지하는 쪽을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
- issue: 반복되는 경고와 절제의 톤
  chosen_reading: 즐거워하십시오 … 어둠의 날들을 기억하십시오
  alternative_readings:
  - 즐기십시오 … 잊지 마십시오
  - 기뻐하되 … 기억하십시오
  rationale: 즐거움과 기억의 병치를 유지하여 전도서의 절제된 지혜 문맥을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
