id: ECC.11.3
reference: Ecclesiastes 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יִמָּלְא֨וּ הֶ/עָבִ֥ים גֶּ֨שֶׁם֙ עַל הָ/אָ֣רֶץ יָרִ֔יקוּ וְ/אִם יִפּ֥וֹל עֵ֛ץ בַּ/דָּר֖וֹם וְ/אִ֣ם בַּ/צָּפ֑וֹן מְק֛וֹם שֶׁ/יִּפּ֥וֹל הָ/עֵ֖ץ שָׁ֥ם יְהֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/003.yaml
  text: If the clouds are full of rain[a], they pour it out on the earth; and if a tree falls to the south or to the north, in the place where the tree falls, there it will lie.
  footnotes:
  - marker: a
    text: Or, more literally, 'there it will be.' The Hebrew verb is simply 'be,' but 'lie' conveys the sense naturally in English for a fallen tree.
    reason: lexical_alternative
translation:
  language: ko
  text: 구름에 비가 가득 차면 땅에 쏟아지고, 나무가 남쪽으로든 북쪽으로든 넘어지면 그 나무가 넘어지는 곳에 거기 그대로 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거기 그대로 있습니다’는 히브리어의 단순한 ‘있다’에 해당하지만, 넘어져 누운 나무의 상태를 한국어로 자연스럽게 드러낸 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ הֶעָבִים גֶּשֶׁם
  english_pob_choice: the clouds are full of rain / pour it out
  chosen_korean: 구름에 비가 가득 차면 / 땅에 쏟아지고
  alternatives_korean:
  - 구름이 비로 가득하면 / 땅에 쏟아지고
  - 구름에 비가 차면 / 땅에 쏟아붓습니다
  lexicon: WLC + HALOT
  rationale: 히브리어는 구름이 ‘가득 차다’와 그 결과로 ‘쏟아내다’는 흐름을 보이므로, ‘가득 차면… 쏟아지고’로 자연스럽게 옮기되 비를 명시했습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: on the earth
  chosen_korean: 땅에
  alternatives_korean:
  - 땅 위에
  - 온 땅에
  lexicon: HALOT
  rationale: ארץ는 여기서 자연 현상의 도착점을 가리키므로, 한국어에서는 간결하게 ‘땅에’로 옮기는 것이 가장 자연스럽습니다.
- source_word: בַּדָּרוֹם / בַּצָּפוֹן
  english_pob_choice: to the south / to the north
  chosen_korean: 남쪽으로든 북쪽으로든
  alternatives_korean:
  - 남쪽으로든 북쪽으로든지
  - 남쪽이나 북쪽으로
  lexicon: HALOT
  rationale: 방향 부사로서의 병렬 구조를 살려, 나무의 넘어지는 방향을 ‘-으로든 … -으로든’으로 대응시켰습니다.
- source_word: מְקוֹם שֶׁיִּפּוֹל הָעֵץ שָׁם יְהוּא
  english_pob_choice: in the place where the tree falls, there it will lie
  chosen_korean: 그 나무가 넘어지는 곳에 거기 그대로 있습니다
  alternatives_korean:
  - 그 나무가 넘어지는 곳에 거기 있습니다
  - 그 나무가 넘어지는 곳에 그대로 있게 됩니다
  lexicon: HALOT
  rationale: 히브리어 동사 ‘있다/되다’는 쓰러진 나무의 결과 상태를 가리키므로, 영어 POB의 해석처럼 한국어에서도 ‘그대로 있습니다’로 상태를 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 동사 יְהוּא의 의미를 상태 진술로 볼지 단순 존재 진술로 볼지
  chosen_reading: 쓰러진 나무가 그 자리에 그대로 있는 상태를 나타내는 진술로 옮겼습니다.
  alternative_readings:
  - 거기에 있습니다
  - 거기에 있게 됩니다
  rationale: 문맥상 ‘있다’보다 ‘그대로 있다’가 쓰러진 뒤의 결과 상태를 더 분명히 드러내며, 영어 POB의 ‘lie’ 해석과도 부합합니다.
  doctrine_reference: 문학적/지혜문학적 관찰 — 교리 쟁점 없음
