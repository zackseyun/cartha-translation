  lexicon: HALOT
  rationale: 히브리어 2인칭 남성 단수 명령형을 한국어 현대 문어의 공손한 명령형으로 옮겼습니다. 지혜문학의 권면체를 살리면서도 합쇼체에 맞춥니다.
- source_word: חֵלֶק
  english_pob_choice: a portion
  chosen_korean: 몫
