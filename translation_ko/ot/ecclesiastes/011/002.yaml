  - 분깃
  - 몫 하나
  lexicon: HALOT
  rationale: חֵלֶק의 구체적 분배 의미를 살리기 위해 ‘몫’을 택했습니다. ‘부분’보다 분배된 몫의 뉘앙스가 더 분명합니다.
- source_word: לְשִׁבְעָה ... וְגַם לִשְׁמוֹנָה
  english_pob_choice: to seven, and even to eight
  chosen_korean: 일곱 사람에게, 심지어 여덟 사람에게도
