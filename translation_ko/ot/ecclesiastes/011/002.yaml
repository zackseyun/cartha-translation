  - 일곱에게도, 여덟에게도
  - 일곱에, 그리고 여덟에
  lexicon: HALOT
  rationale: 숫자 관용구를 그대로 살리되 한국어에서 자연스럽게 들리도록 사람을 보충해 분배의 대상을 드러냈습니다. ‘심지어’로 보강의 뉘앙스를 보존합니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 불행
  - 화
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 ‘악’이 아니라 닥쳐오는 해로운 사건이므로 ‘재앙’이 가장 직접적입니다. POB의 disaster와 대응합니다.
theological_decisions:
