translation:
  language: ko
  text: 일곱 사람에게, 심지어 여덟 사람에게도 몫을 주십시오. 왜냐하면 땅에 일어날 재앙이 무엇인지 당신은 알지 못하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅에.’ 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘땅/세상’의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  english_pob_choice: Give
  chosen_korean: 주십시오
  alternatives_korean:
