  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 לְשִׁבְעָה ... לִשְׁמוֹנָה는 수사적 숫자 표현으로서 수령자가 사람임을 문맥상 시사할 수 있어도, 원문에 없는 ‘사람’을 본문에 명시하지 않는 편이 더 충실합니다. 또한 עַל הָאָרֶץ의 대안은 본문 각주에서 명확히 구분되어야 합니다.
  naturalness: 합쇼체 권면으로 자연스럽습니다. 다만 ‘땅에 일어날 재앙이 무엇인지 당신은 알지 못하기 때문입니다’는 다소 직역투이고 ‘당신’은 한국어 지혜문학 문체에서 불필요하게 두드러집니다. ‘어떤 재앙이 세상에 닥칠지 알지 못하기 때문입니다’가 더 자연스럽습니다.
  terminology: ‘몫’은 חֵלֶק의 분배된 몫이라는 뜻을 잘 반영하며, ‘재앙’도 문맥상의 רָעָה에 적절합니다. הָאָרֶץ는 본문에서 넓은 뜻의 ‘세상’으로 번역하고, ‘땅’을 각주 대안으로 제시하는 것이 영어 POB의 선택 및 히브리어의 의미 범위를 더 분명하게 반영합니다.
