    rationale: 본문이 ‘땅에’인데 각주도 ‘또는 땅에’라고 하면 대안이 되지 않습니다. 본문을 ‘세상에’로 하고 각주에 ‘또는 땅에’라고 하거나, 그 반대로 명확히 제시해야 합니다.
