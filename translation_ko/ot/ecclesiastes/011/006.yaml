id: ECC.11.6
reference: Ecclesiastes 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/בֹּ֨קֶר֙ זְרַ֣ע אֶת זַרְעֶ֔/ךָ וְ/לָ/עֶ֖רֶב אַל תַּנַּ֣ח יָדֶ֑/ךָ כִּי֩ אֵֽינְ/ךָ֨ יוֹדֵ֜ע אֵ֣י זֶ֤ה יִכְשָׁר֙ הֲ/זֶ֣ה אוֹ זֶ֔ה וְ/אִם שְׁנֵי/הֶ֥ם כְּ/אֶחָ֖ד טוֹבִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/006.yaml
  text: In the morning sow your seed[a], and in the evening do not let your hand rest, for you do not know which will succeed, this or that[b], or whether both alike will be good.
  footnotes:
  - marker: a
    text: Or 'will prosper' for 'will succeed.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'do not let your hand rest,' an idiom for not ceasing from work.
    reason: cultural_note
translation:
  language: ko
  text: 아침에 씨를 뿌리고, 저녁에도 손을 쉬게 두지 마십시오.[b] 이것이 잘될지[a] 저것이 잘될지, 또는 둘 다 똑같이 좋을지 알지 못하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잘될지’는 히브리어 יִכְשָׁר를 옮긴 말로, ‘성공할지’ 또는 ‘잘 풀릴지’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 손을 쉬게 두지 마십시오’입니다. 일을 그치지 말라는 뜻의 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בַּבֹּקֶר / וְלָעֶרֶב
  english_pob_choice: In the morning ... and in the evening
  chosen_korean: 아침에 ... 저녁에도
  alternatives_korean:
  - 아침에 ... 그리고 저녁에
  - 아침에 ... 저녁 무렵에도
  lexicon: HALOT
  rationale: 두 시간 표현의 대구를 살리면서, 현대 한국어에서 자연스럽고 간결하게 시간 순서를 드러내도록 옮겼습니다.
- source_word: זְרַע אֶת זַרְעֶךָ
  english_pob_choice: sow your seed
  chosen_korean: 네 씨를 뿌리십시오
  alternatives_korean:
  - 네 씨앗을 뿌리십시오
  - 네 씨를 심으십시오
  lexicon: HALOT
  rationale: זָרַע는 ‘씨를 뿌리다’가 기본 뜻이므로, 농경 이미지를 직접 살리는 표현을 택했습니다. ‘심다’는 일반적이지만 원문의 파종 이미지는 약해집니다.
- source_word: אַל תַּנַּח יָדֶךָ
  english_pob_choice: do not let your hand rest
  chosen_korean: 네 손을 거두지 마십시오
  alternatives_korean:
  - 네 손을 쉬게 하지 마십시오
  - 네 손을 멈추지 마십시오
  - 네 손을 쉬게 두지 마십시오
  lexicon: HALOT
  rationale: 직역하면 ‘손이 쉬게 두지 말라’이지만, 한국어에서는 동작을 계속하라는 뜻이 더 자연스럽게 드러나도록 ‘거두지 마십시오’로 옮겼습니다. 원문의 관용적 뜻을 살리면서도 문맥상 노동 중단 금지를 분명히 합니다.
- source_word: יִכְשָׁר
  english_pob_choice: will succeed
  chosen_korean: 잘 될지
  alternatives_korean:
  - 성공할지
  - 형통할지
  - 잘될지
  lexicon: HALOT
  rationale: 이 동사는 결과가 잘 풀리다/성공하다의 뜻을 가지므로, 지혜문맥에 어울리는 중립적이고 현대적인 ‘잘 될지’를 선택했습니다. ‘형통’은 종교적 뉘앙스가 강해 일반 의미가 약해집니다.
- source_word: שְׁנֵיהֶם כְּאֶחָד טוֹבִים
  english_pob_choice: both alike will be good
  chosen_korean: 둘이 함께 다 좋을 수도 있습니다
  alternatives_korean:
  - 둘 다 좋을 수도 있습니다
  - 둘이 똑같이 좋을 수도 있습니다
  lexicon: HALOT
  rationale: כְּאֶחָד의 ‘한결같이/함께’라는 뉘앙스를 반영해 ‘함께’를 넣었고, 결과의 가능성을 여는 지혜문맥에 맞게 ‘수도 있습니다’로 마무리했습니다.
theological_decisions:
- issue: 두 번째 절반의 지혜적 불확실성
  chosen_reading: ‘이것도, 저것도 어느 것이 잘 될지 네가 알지 못하기 때문입니다’로, 두 선택의 결과를 단정하지 않고 개방형 권고로 유지했습니다.
  alternative_readings:
  - ‘이것이냐 저것이냐를 너는 알지 못하기 때문입니다’
  - ‘둘 중 어느 쪽이 성공할지 알지 못하기 때문입니다’
  rationale: 전도서는 일반적 인과를 제시하면서 인간의 한계를 강조하므로, 번역도 확정적 결론보다 가능성의 개방성을 유지해야 합니다.
  doctrine_reference: 전도서의 지혜문학적 신학—인간의 제한된 지식과 섭리 아래의 신중함
