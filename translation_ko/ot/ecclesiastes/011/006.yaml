    rationale: וְאִם은 앞선 간접의문문을 이어 ‘또는 둘 다 ... 좋을지’를 나타냅니다. ‘둘이 함께 다 좋을 수도 있습니다’라고 별도 진술로 처리하기보다, 알 수 없는 경우의 하나로 연결하는 것이 더 가깝습니다.
