  text: 바람을 지켜보는 사람은 씨를 뿌리지 못하고, 구름을 바라보는 사람은 거두지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “바람을 관찰하는 사람은 씨를 뿌리지 않고, 구름을 보는 사람은 거두지 않는다”입니다.
