  - 파종하지 못하고
  lexicon: HALOT
  rationale: 히브리어 잠언식 결과를 한국어에서는 서술적 연결로 처리해, 앞절과 뒤절의 평행을 살리면서 문장을 매끄럽게 했습니다.
- source_word: וְרֹאֶה בֶעָבִים
  english_pob_choice: whoever looks at the clouds
