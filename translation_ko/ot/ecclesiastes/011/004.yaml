translation:
  language: ko
  text: 바람을 살피는 사람은 씨를 뿌리지 않고, 구름을 바라보는 사람은 거두지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמֵר רוּחַ
  english_pob_choice: watches the wind
  chosen_korean: 바람을 지켜보는 사람
  alternatives_korean:
  - 바람을 관찰하는 사람
  - 바람을 살피는 사람
  lexicon: HALOT
  rationale: 지속적으로 바람을 주시하는 행위를 자연스러운 현대 한국어로 옮기되, 농사 비유에 맞는 기상 관찰의 의미를 유지했습니다.
- source_word: יִזְרָע
  english_pob_choice: will not sow
  chosen_korean: 씨를 뿌리지 못하고
  alternatives_korean:
  - 씨를 뿌리지 않을 것이고
  - 파종하지 못하고
  lexicon: HALOT
  rationale: 히브리어 잠언식 결과를 한국어에서는 서술적 연결로 처리해, 앞절과 뒤절의 평행을 살리면서 문장을 매끄럽게 했습니다.
- source_word: וְרֹאֶה בֶעָבִים
  english_pob_choice: whoever looks at the clouds
  chosen_korean: 구름을 바라보는 사람
  alternatives_korean:
  - 구름을 보는 사람
  - 구름을 살피는 사람
  lexicon: HALOT
  rationale: 두 번째 분사의 일반적 주어를 '사람'으로 풀어 한국어 문장성을 높였고, '바라보는'으로 바라봄의 지속성을 살렸습니다.
- source_word: יִקְצוֹר
  english_pob_choice: will not reap
  chosen_korean: 거두지 못합니다
  alternatives_korean:
  - 수확하지 못합니다
  - 거두지 않을 것입니다
  lexicon: HALOT
  rationale: '''reap''의 농경적 의미를 한국어 성경 문맥에 맞게 ''거두다''로 옮겨, 앞의 ''씨를 뿌리다''와 대응시키고 일반적 결과를 현재형 문장으로 자연스럽게 표현했습니다.'
