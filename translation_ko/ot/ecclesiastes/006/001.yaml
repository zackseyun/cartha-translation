    issue: רָעָה를 ‘재앙’으로 한정함
    rationale: ‘재앙’은 대규모의 파국적 사건을 강하게 암시합니다. 히브리어 명사는 여기서 해로운 일, 악, 불행을 폭넓게 가리킬 수 있으므로 ‘악한 일’이 더 안전합니다.
  - severity: low
