id: ECC.6.9
reference: Ecclesiastes 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ט֛וֹב מַרְאֵ֥ה עֵינַ֖יִם מֵֽ/הֲלָךְ נָ֑פֶשׁ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/009.yaml
  text: Better is the sight of the eyes than the wandering of the soul[c][b][a]; this too is vapor and a chasing after wind.
  footnotes:
  - marker: a
    text: Or 'what the eyes see' instead of 'the sight of the eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the soul' or 'desire' for 'the appetite'; the Hebrew nephesh here likely refers to craving or the desiring self rather than the immaterial soul.
    reason: lexical_alternative
  - marker: c
    text: Or 'and striving after wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 눈에 보이는 것이[a] 마음이 이리저리 헤매는 것보다 낫습니다.[b] 이것도 헛되고 바람을 쫓는 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘눈의 봄’ 또는 ‘눈이 보는 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 네페쉬는 여기서 ‘욕망’, ‘욕구하는 자아’를 뜻할 수 있으며, ‘영혼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘바람을 좇아 애쓰는 것’입니다. 이 표현은 붙잡을 수 없는 것을 헛되이 추구하는 모습을 나타내는 관용구일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב מַרְאֵה עֵינַיִם מֵהֲלָךְ נָפֶשׁ
  english_pob_choice: Better is the sight of the eyes than the wandering of the soul/appetite
  chosen_korean: 눈으로 보는 것이 영혼의 방황보다 낫습니다
  alternatives_korean:
  - 눈이 보는 것이 영혼의 헤매임보다 낫습니다
  - 눈에 보이는 것이 영혼의 방황보다 낫습니다
  lexicon: HALOT
  rationale: 비교문으로서 '낫습니다'를 사용해 טבע스러운 한국어 비교를 만들고, מַרְאֵה עֵינַיִם의 구체적 이미지는 '눈으로 보는 것'으로 살렸습니다.
- source_word: נָפֶשׁ
  english_pob_choice: the soul / the appetite
  chosen_korean: 영혼
  alternatives_korean:
  - 목마름
  - 욕구
  - 욕망
  lexicon: HALOT
  rationale: 전도서 문맥상 נֶפֶשׁ이 욕구하는 자아를 가리킬 수 있지만, 한국어 본문에서는 독자가 과도하게 생리적 의미로 오해하지 않도록 '영혼'을 택하되 주석에서 대안을 제시합니다.
- source_word: הֶבֶל
  english_pob_choice: vapor
  chosen_korean: 헛되고
  alternatives_korean:
  - 허무하고
  - 연기 같고
  - 바람 같고
  lexicon: HALOT
  rationale: '''vapor''의 비실체성과 덧없음을 한국어 성경어법에서 널리 이해되는 ''헛되다''로 옮기되, 이어지는 병행어 ''바람을 쫓는''과 함께 전도서의 반복 어휘를 살렸습니다.'
- source_word: וּרְעוּת רוּחַ
  english_pob_choice: and a chasing after wind
  chosen_korean: 바람을 쫓는 것입니다
  alternatives_korean:
  - 바람을 좇는 것입니다
  - 바람을 따라다니는 것입니다
  - 바람을 추구하는 것입니다
  lexicon: HALOT
  rationale: 관용구의 허무한 추구를 직역보다 자연스러운 동사구로 살려, 전도서의 반복 이미지를 한국어로 분명하게 전달합니다.
theological_decisions:
- issue: נָפֶשׁ의 번역이 인간 존재의 실체를 지칭하는지, 욕망/욕구를 지칭하는지
  chosen_reading: 본문은 '영혼'으로 번역하되, 전도서 문맥의 긴장 때문에 의미 범위는 주석적 유연성을 남깁니다.
  alternative_readings:
  - 욕구
  - 갈망
  - 자기
  rationale: 문맥상 통상적 영혼 개념으로 좁히기보다, 전도서의 수사적 대비를 한국어로 매끄럽게 전달하는 쪽을 택했습니다.
  doctrine_reference: 전도서의 지혜문학적 인간 이해
- issue: הֶבֶל과 רְעוּת רוּחַ의 반복적 평가어를 한국어에서 어떻게 유지할지
  chosen_reading: '''헛되고 바람을 쫓는 것입니다''로 두 개의 평가를 모두 보존합니다.'
  alternative_readings:
  - 허무하고 바람을 좇는 것입니다
  - 덧없고 바람을 따라다니는 것입니다
  rationale: 전도서의 핵심 평가어를 약화하지 않고, 두 개의 병렬 판단을 현대 한국어로 분명하게 유지했습니다.
  doctrine_reference: 전도서의 반복 어법과 허무 모티프
