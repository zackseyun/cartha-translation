id: ECC.6.12
reference: Ecclesiastes 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מִֽי יוֹדֵעַ֩ מַה טּ֨וֹב לָֽ/אָדָ֜ם בַּֽ/חַיִּ֗ים מִסְפַּ֛ר יְמֵי חַיֵּ֥י הֶבְל֖/וֹ וְ/יַעֲשֵׂ֣/ם כַּ/צֵּ֑ל אֲשֶׁר֙ מִֽי יַגִּ֣יד לָֽ/אָדָ֔ם מַה יִּהְיֶ֥ה אַחֲרָ֖י/ו תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/012.yaml
  text: For who knows what is good for man in life, during the number of the days of his fleeting life, which he spends like a shadow? For who can tell man what will be after him under the sun?
translation:
  language: ko
  text: 사람에게 생애 중에 무엇이 좋은지, 허무한 그의 삶의 날수 동안 그가 그림자처럼 보내는 그날수의 수효를 누가 알겠습니까? 또한 사람에게 그 뒤에 무엇이 일어날지 누가 말해 줄 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה טּוֹב לָאָדָם בַּחַיִּים
  english_pob_choice: what is good for man in life
  chosen_korean: 사람에게 생애 중에 무엇이 좋은지
  alternatives_korean:
  - 사람에게 삶에서 무엇이 좋은지
  - 사람에게 살아 있는 동안 무엇이 좋은지
  lexicon: טוֹב / אָדָם / חַיִּים
  rationale: טוֹב는 단순히 ‘좋다’로 두되, 생애 전체의 맥락을 살려 ‘생애 중에’로 옮겨 인생 전체에 대한 질문임을 드러냈습니다.
- source_word: הֶבֶל
  english_pob_choice: fleeting
  chosen_korean: 허무한
  alternatives_korean:
  - 덧없는
  - 헛된
  lexicon: הֶבֶל
  rationale: 전도서의 핵심 어휘인 הֶבֶל은 단순한 시간적 ‘짧음’보다 실체의 덧없음과 공허함을 함께 담으므로, 문맥상 자연스러운 ‘허무한’으로 옮겼습니다.
- source_word: כַּצֵּל
  english_pob_choice: like a shadow
  chosen_korean: 그림자처럼
  alternatives_korean:
  - 그림자같이
  - 그늘처럼
  lexicon: צֵל
  rationale: 비유 구조를 한국어에서 가장 자연스럽게 살리기 위해 비교 부사형 ‘-처럼’을 사용했습니다.
- source_word: מַה יִּהְיֶה אַחֲרָיו
  english_pob_choice: what will be after him
  chosen_korean: 그 뒤에 무엇이 일어날지
  alternatives_korean:
  - 그 후에 무엇이 될지
  - 그 뒤에 어떤 일이 있을지
  lexicon: אַחַר
  rationale: 직역의 ‘그 후에 무엇이 될지’보다, 전도서 문맥에서 미래의 전개를 묻는 표현으로 ‘무엇이 일어날지’가 더 분명합니다.
theological_decisions:
- issue: 전도서의 הֶבֶל을 ‘fleeting’으로 완화할지 여부
  chosen_reading: 허무한 그의 삶
  alternative_readings:
  - 덧없는 그의 삶
  - 짧은 그의 삶
  rationale: 영어 POB의 ‘fleeting’은 시간의 짧음만이 아니라 전도서의 주제어 הֶבֶל의 실존적 허무를 반영하므로, 주제어의 무게를 살렸습니다.
  doctrine_reference: 전도서의 지혜 문학적 실존 인식
