id: ECC.6.5
reference: Ecclesiastes 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם שֶׁ֥מֶשׁ לֹא רָאָ֖ה וְ/לֹ֣א יָדָ֑ע נַ֥חַת לָ/זֶ֖ה מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/005.yaml
  text: Though it has not seen the sun or known anything[b][a], it has more rest than that man.
  footnotes:
  - marker: a
    text: Literally, 'this has rest more than that.' The demonstratives refer to the stillborn child and the man described in the preceding verses.
    reason: lexical_alternative
  - marker: b
    text: '''Seen the sun'' is a Hebrew way of speaking about experiencing life in this world.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 햇빛도 보지 못하고 아무것도 알지 못했지만, 그보다 더한 안식이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안식’은 히브리어 נַחַת의 기본 의미로, 단순한 ‘휴식’보다 더 안정된 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘햇빛을 보다’는 이 문맥에서 이 세상의 삶과 경험을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Though
  chosen_korean: -지만
  alternatives_korean:
  - 또한
  - 심지어
  lexicon: HALOT
  rationale: 문맥상 앞 절과의 대비·양보를 나타내므로, 한국어에서는 양보 연결어미 -지만으로 자연스럽게 살렸습니다.
- source_word: שֶׁמֶשׁ
  english_pob_choice: the sun
  chosen_korean: 햇빛
  alternatives_korean:
  - 해
  - 태양
  lexicon: HALOT
  rationale: ‘태양을 보다’보다 ‘햇빛을 보다’가 한국어에서 생명 세계의 경험을 나타내는 관용적 이미지로 더 자연스럽고, 히브리어의 감각적 표현도 유지합니다.
- source_word: וְלֹא יָדָע
  english_pob_choice: or known anything
  chosen_korean: 아무것도 알지 못했
  alternatives_korean:
  - 아무것도 알지 못하고
  - 알지 못했
  lexicon: HALOT
  rationale: יָדַע가 단순 지식이 아니라 삶의 경험 전반을 가리키므로, ‘아무것도’로 범위를 드러내어 문맥의 뜻을 분명히 했습니다.
- source_word: נַחַת
  english_pob_choice: rest
  chosen_korean: 안식
  alternatives_korean:
  - 쉼
  - 휴식
  - 평안
  lexicon: HALOT
  rationale: 해당 단어는 단순 휴식보다 상태의 평온과 안정을 가리키므로, 시적 문맥에서 ‘안식’이 가장 응축된 표현입니다.
theological_decisions:
- issue: 비교문의 지시 대상과 생략된 비교구문
  chosen_reading: ‘그보다 더한 안식’으로 옮겨, 앞 구절의 죽은 아이와 그와 대비되는 사람 사이의 비교를 한국어에서 드러냈습니다.
  alternative_readings:
  - ‘이것이 저것보다 더한 안식을 가집니다’
  - ‘그는 저 사람보다 더 안식합니다’
  rationale: 히브리어는 ‘이것/저것’의 지시대명사로 비교를 만들지만 한국어 직역은 referent가 흐려질 수 있어, 본문의 대비를 보존하면서도 독자가 바로 이해하도록 했습니다.
  doctrine_reference: 문맥 주해/서술 비교
