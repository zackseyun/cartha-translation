  source_fidelity: 히브리어는 ‘해를 보지 못하고 알지 못하였다’와 ‘이것에게 저것보다 쉼이 더 있다’라는 비교를 말합니다. 초안은 전반적 의미를 따르지만, ‘그보다 더한 안식이 있습니다’는 비교 대상과 쉼을 누리는 대상을 문법적으로 불분명하게 만듭니다. 또한 שֶׁמֶשׁ는 ‘햇빛’보다 ‘해’로 옮기는 편이 원문의 이미지를 더 직접적으로 보존합니다.
  naturalness: ‘그 아이에게는 그 사람보다 더 큰 쉼이 있습니다’는 문맥상 지시 대상을 자연스럽게 드러내면서도, 히브리어의 비교 구문을 한국어로 명료하게 재현합니다. ‘쉼’은 현대 표준어에서 자연스럽고 נַחַת의 비기술적인 뜻에 맞습니다.
  terminology: ‘안식’은 신학적·예전적 연상을 불필요하게 강하게 일으킬 수 있으므로, כאן의 נַחַת에는 ‘쉼’이 더 중립적이고 적절합니다. ‘해를 보다’는 원문의 표현을 보존하며, 관용적 함의는 각주로 설명합니다.
