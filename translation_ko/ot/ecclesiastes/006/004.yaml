source:
  edition: WLC
  text: כִּֽי בַ/הֶ֥בֶל בָּ֖א וּ/בַ/חֹ֣שֶׁךְ יֵלֵ֑ךְ וּ/בַ/חֹ֖שֶׁךְ שְׁמ֥/וֹ יְכֻסֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/004.yaml
  text: For he comes in vanity and goes in darkness[b][a], and in darkness his name is covered.
  footnotes:
  - marker: a
    text: Or 'in futility' or 'like a vapor.' The Hebrew הֶבֶל is a key term in Ecclesiastes, often expressing transience, emptiness, or futility.
    reason: lexical_alternative
  - marker: b
    text: '''His name is covered'' may mean that his identity or memory remains in obscurity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그가 허무[a] 가운데서 와서 어둠 속에서 가며, 그의 이름도 어둠 속에 가려지기[b] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘허무’는 전도서의 핵심어 הֶבֶל을 옮긴 것으로, 덧없음·공허함·무상함의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 이름도 어둠 속에 가려지기’는 그의 정체성이나 기억이 어둠 속에 묻힌다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: -합니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 직전 진술에 대한 설명을 잇는 접속이므로, 한국어에서는 별도 접속사보다 종결 어미로 자연스럽게 연결해 담담한 설명문 흐름을 살렸습니다.
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 허무
  alternatives_korean:
  - 헛됨
  - 입김
  - 바람
  lexicon: HALOT
  rationale: 전도서의 주제어로서의 상투성과 함께, 한국어에서 ‘허무’가 공허함·덧없음·무상함의 뉘앙스를 가장 무리 없이 담아냅니다.
- source_word: חֹשֶׁךְ
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 캄캄함
  - 그늘
  lexicon: HALOT
  rationale: 두 번 반복된 이미지를 그대로 살리기 위해 ‘어둠’을 유지했으며, 물리적 어두움과 은폐·기억 상실의 의미를 함께 보존합니다.
- source_word: יְכֻסֶּה
  english_pob_choice: is covered
  chosen_korean: 가려집니다
  alternatives_korean:
  - 덮입니다
  - 숨겨집니다
  - 가리워집니다
  lexicon: HALOT
  rationale: 이름이 빛 가운데 드러나지 못하고 가려지는 이미지를 자연스러운 현대어로 옮겼으며, 단순한 ‘덮임’보다 의미상 ‘은폐’가 선명합니다.
theological_decisions:
- issue: ‘이름’의 의미 범위
  chosen_reading: 본문 그대로 ‘그의 이름’이라고 두되, 기억과 정체성이 어둠 속에 묻히는 함의를 열어 둡니다.
  alternative_readings:
  - 그의 기억이 가려집니다
  - 그의 존재가 잊힙니다
  rationale: 히브리어는 문자적으로 ‘이름’이라고 말하므로 본문 어휘를 보존해야 하며, 전도서 문맥상 사회적 기억의 소멸까지 암시할 수 있습니다.
  doctrine_reference: 전도서 6장 문맥의 무상성/기억 상실 주제
- issue: ‘허무’의 신학적 뉘앙스
  chosen_reading: ‘허무’로 번역해 전도서의 반복 어휘를 유지합니다.
  alternative_readings:
  - 헛됨
  - 바람같음
  - 무상함
  rationale: 이 단어는 단순한 감정 표현이 아니라 전도서 전체의 핵심 어휘이므로, 전통적이면서도 현대어로 이해 가능한 대응이 필요합니다.
  doctrine_reference: 전도서의 הֶבֶל 주제어
