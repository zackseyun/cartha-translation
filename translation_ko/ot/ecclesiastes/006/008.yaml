source:
  edition: WLC
  text: כִּ֛י מַה יּוֹתֵ֥ר לֶ/חָכָ֖ם מִֽן הַ/כְּסִ֑יל מַה לֶּ/עָנִ֣י יוֹדֵ֔עַ לַ/הֲלֹ֖ךְ נֶ֥גֶד הַ/חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/008.yaml
  text: For what advantage does the wise man have over the fool? What does the poor man have who knows how to conduct himself before the living?[a]
  footnotes:
  - marker: a
    text: Or, more formally, 'What advantage has the poor man who knows how to walk before the living?' The Hebrew expression 'to walk' can idiomatically mean 'to conduct oneself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 지혜로운 사람이 어리석은 사람보다 무슨 이점이 있습니까? 살아 있는 사람들 앞에서 어떻게 행해야 하는지를 아는 가난한 사람이 무슨 이점이 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여 ‘살아 있는 사람들 앞에서 걷는 법을 아는 가난한 사람에게 무슨 이점이 있습니까?’라고도 옮길 수 있습니다. 히브리어의 ‘걷다’는 관용적으로 ‘처신하다’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יּוֹתֵר / מַה
  english_pob_choice: what advantage ... have / What does ... have
  chosen_korean: 무슨 이점이 있습니까
  alternatives_korean:
  - 무슨 유익이 있습니까
  - 무슨 이익이 있습니까
  - 무슨 이점이 있습니까
  lexicon: HALOT
  rationale: 히브리어의 비교 질문을 한국어 자연문으로 옮기면서, 첫 절과 둘째 절의 평행성을 살려 같은 핵심 명사구를 반복했습니다.
- source_word: לֶחָכָם / הַכְּסִיל
  english_pob_choice: the wise man / the fool
  chosen_korean: 지혜로운 사람 / 어리석은 사람
  alternatives_korean:
  - 지혜로운 자 / 어리석은 자
  - 지혜로운 사람 / 바보
  lexicon: HALOT
  rationale: 남성 단수 명사적 용법을 살리되 현대 한국어에서 자연스럽고 중립적인 인칭 표현으로 옮겼습니다.
- source_word: עָנִי
  english_pob_choice: the poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 빈곤한 사람
  - 가난한 사람
  lexicon: HALOT
  rationale: 문맥상 사회경제적 빈곤의 뜻이 가장 자연스러워 ‘가난한 사람’으로 옮겼습니다.
- source_word: לַהֲלֹךְ נֶגֶד הַחַיִּים
  english_pob_choice: to conduct himself before the living
  chosen_korean: 살아 있는 사람들 앞에서 어떻게 행해야 하는지
  alternatives_korean:
  - 살아 있는 사람들 앞에서 어떻게 걸어야 하는지
  - 살아 있는 사람들 앞에서 어떻게 처신해야 하는지
  - 살아 있는 사람들 앞에서 어떻게 행해야 하는지
  lexicon: HALOT
  rationale: ‘הלך’의 문자적 ‘걷다’보다 삶의 방식·처신을 가리키는 관용을 따라, 한국어에서는 ‘행하다’로 풀어 의미를 분명히 했습니다.
theological_decisions:
- issue: 히브리어 평행 구조에서 둘째 물음에 ‘이점’의 함의를 드러낼지 여부
  chosen_reading: 둘째 절도 첫 절과 같은 ‘무슨 이점이 있습니까’ 구조로 평행을 맞췄습니다.
  alternative_readings:
  - 그 가난한 사람이 무엇을 갖고 있습니까
  - 그 가난한 사람이 무엇을 얻습니까
  rationale: 원문은 두 질문이 평행하여 모두 실질적 ‘이득/이점’을 묻는 구조이므로, 한국어에서도 같은 질문 틀을 유지해 논증 흐름을 살렸습니다.
  doctrine_reference: 문예적/해석학적 결정
