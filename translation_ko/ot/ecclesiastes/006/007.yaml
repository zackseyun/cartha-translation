translation:
  language: ko
  text: 사람의 모든 수고는 그의 입을 위한 것이지만, 그들의 식욕은 채워지지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘영혼’: ‘그들의 영혼은 채워지지 않습니다.’ 여기서 נֶפֶשׁ은 문맥상 먹고 만족하는 욕구를 가리킬 가능성이 큽니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֲמַל
  english_pob_choice: All a man's labor
  chosen_korean: 사람의 모든 수고
  alternatives_korean:
  - 한 사람의 모든 노고
  - 모든 인간의 수고
  lexicon: HALOT
  rationale: עֲמַל의 짐스러운 뉘앙스를 살려 ‘수고’로 옮기고, כָּל은 ‘모든’으로 처리해 총괄성을 분명히 했습니다.
- source_word: הָאָדָם
  english_pob_choice: a man's
  chosen_korean: 사람의
  alternatives_korean:
  - 한 남자의
  - 인류의
  lexicon: HALOT
  rationale: 여기서 אָדָם은 특정 남성이 아니라 일반적인 인간을 가리키므로, 표준적인 대표 표현인 ‘사람의’로 옮겼습니다.
- source_word: לְפִיהוּ
  english_pob_choice: for his mouth
  chosen_korean: 그의 입을 위한
  alternatives_korean:
  - 그의 입을 위해
  - 입을 위한
  lexicon: HALOT
  rationale: 직역적 이미지를 보존하기 위해 ‘입’을 유지했습니다. 다만 한국어에서는 ‘입을 위한’이 목적성을 자연스럽게 드러냅니다.
- source_word: הַנֶּפֶשׁ
  english_pob_choice: appetite
  chosen_korean: 식욕
  alternatives_korean:
  - 목숨
  - 영혼
  - 욕구
  lexicon: HALOT
  rationale: 먹고 채워지는 문맥에서 נֶפֶשׁ은 ‘영혼’보다 욕구/식욕의 뜻이 강하므로, 육체적 만족의 맥락을 살린 ‘식욕’이 가장 적절합니다.
- source_word: לֹא תִמָּלֵא
  english_pob_choice: is not filled
  chosen_korean: 채워지지 않습니다
  alternatives_korean:
  - 만족되지 않습니다
  - 가득 차지 않습니다
  lexicon: HALOT
  rationale: מלא의 기본 이미지를 유지하면서 현대 한국어에서 자연스럽고 수동적 결과를 분명히 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역에서 영혼론적 오해를 피하는 문제
  chosen_reading: 식욕
  alternative_readings:
  - 영혼
  - 목숨
  - 자기
  rationale: 이 절은 사람의 노동과 먹는 행위를 말하므로, ‘영혼’으로 번역하면 본문이 말하지 않는 이원론적 해석을 불러올 수 있습니다. 따라서 본문 문맥의 욕구/충족 차원을 드러내는 ‘식욕’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 신학적 긴장 보존'
- issue: אָדָם의 일반적 의미를 한국어로 어떻게 살릴지
  chosen_reading: 사람의
  alternative_readings:
  - 한 남자의
  - 인류의
  rationale: 잠언적 일반 진술이므로 성별 특정이 아니라 대표성을 드러내는 중립적 일반어가 적절합니다. 동시에 히브리어 단수형의 일반화 효과를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for אָדָם'
