  yaml_path: translation/ot/ecclesiastes/006/007.yaml
  text: All a man's labor is for his mouth[a], yet even his appetite is not filled.
  footnotes:
  - marker: a
    text: 'Or ''soul'': ''yet even the soul is not filled.'' Here נֶפֶשׁ likely refers to desire or appetite in the context of eating and satisfaction.'
