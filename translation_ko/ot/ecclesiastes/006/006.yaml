id: ECC.6.6
reference: Ecclesiastes 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִלּ֣וּ חָיָ֗ה אֶ֤לֶף שָׁנִים֙ פַּעֲמַ֔יִם וְ/טוֹבָ֖ה לֹ֣א רָאָ֑ה הֲ/לֹ֛א אֶל מָק֥וֹם אֶחָ֖ד הַ/כֹּ֥ל הוֹלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/006.yaml
  text: Even if he should live a thousand years twice over and not see good[c][b][a], do not all go to one place?
  footnotes:
  - marker: a
    text: Or 'two thousand years'; literally, 'a thousand years twice.'
    reason: lexical_alternative
  - marker: b
    text: '''See good'' is a Hebrew idiom meaning to experience or enjoy what is good.'
    reason: lexical_alternative
  - marker: c
    text: That is, the same destination in death; the Hebrew says only 'one place.'
    reason: alternative_reading
translation:
  language: ko
  text: 비록 그가 천 년을 두 번 산다 해도, 좋은 것을 보지 못한다면, 다들 한 곳으로 가지 않습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천 년을 두 번’은 문자적으로는 ‘천 년 두 번’이며, ‘이천 년’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘좋은 것을 보다’는 히브리어 관용으로, ‘좋음을 누리다/경험하다’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 목적지를 단지 ‘한 곳’이라고만 말하며, 죽음이나 무덤을 직접 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִלּוּ
  english_pob_choice: Even if
  chosen_korean: 비록 … 해도
  alternatives_korean:
  - 만일 …이라면
  - 설령 …하더라도
  lexicon: HALOT
  rationale: 양보·가정의 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 방식으로, 영어 POB의 'Even if'와 같은 기능을 유지합니다.
- source_word: אֶלֶף שָׁנִים פַּעֲמַיִם
  english_pob_choice: a thousand years twice over
  chosen_korean: 천 년을 두 번
  alternatives_korean:
  - 이천 년
  - 천 년씩 두 번
  lexicon: HALOT
  rationale: 히브리어의 직역적 반복 구조를 살리면서도 한국어에서 자연스럽게 읽히도록 했습니다. 단순한 숫자화보다 원문의 강조를 보존합니다.
- source_word: וְטוֹבָה לֹא רָאָה
  english_pob_choice: not see good
  chosen_korean: 좋은 것을 보지 못한다면
  alternatives_korean:
  - 좋음을 보지 못한다면
  - 좋은 것을 경험하지 못한다면
  lexicon: HALOT
  rationale: ‘보다’가 히브리어 관용으로 ‘경험하다/누리다’를 뜻할 수 있으나, 원문 동사를 지나치게 풀지 않고 한국어에서 이해 가능한 관용으로 옮겼습니다.
- source_word: אֶל מָקוֹם אֶחָד
  english_pob_choice: to one place
  chosen_korean: 한 곳으로
  alternatives_korean:
  - 한 곳에
  - 같은 곳으로
  lexicon: HALOT
  rationale: 히브리어의 모호한 표현을 그대로 살려, 죽음/무덤을 본문에서 미리 특정하지 않도록 했습니다. 한국어도 ‘한 곳’으로 남겨 두어 원문의 절제된 표현을 유지합니다.
theological_decisions:
- issue: ‘한 곳’의 의미를 본문에서 명시할지 여부
  chosen_reading: 본문에서는 ‘한 곳’으로만 두고, 죽음이나 무덤으로 구체화하지 않았습니다.
  alternative_readings:
  - 무덤으로
  - 죽음으로
  - 같은 곳으로
  rationale: 히브리어는 목적지를 암시하지만 명시하지 않습니다. 본문의 수사적 여백과 전도서의 긴장을 보존하기 위해 해석을 본문에 주입하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
