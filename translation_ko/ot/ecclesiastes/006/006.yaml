    text: ‘천 년을 두 번’은 문자적으로는 ‘천 년 두 번’이며, ‘이천 년’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘좋은 것을 보다’는 히브리어 관용으로, 좋음을 누리거나 경험한다는 뜻일 수 있습니다.
    reason: lexical_alternative
