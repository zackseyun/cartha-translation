  text: אִם יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְ/שָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְ/רַ֣ב שֶׁ/יִּהְי֣וּ יְמֵֽי שָׁנָ֗י/ו וְ/נַפְשׁ/וֹ֙ לֹא תִשְׂבַּ֣ע מִן הַ/טּוֹבָ֔ה וְ/גַם קְבוּרָ֖ה לֹא הָ֣יְתָה לּ֑/וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖/נּוּ הַ/נָּֽפֶל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/003.yaml
  text: If a man fathers a hundred children and lives many years[a], however many the days of his years may be, but his soul is not satisfied with good, and he does not even have burial[c][b], I say that the stillborn child is better off than he.
  footnotes:
  - marker: a
    text: Or 'the miscarriage' or 'the untimely birth' for 'the stillborn child.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his soul is not satisfied with good'; 'soul' may also be understood as 'self' or, in context, 'appetite.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I said'; the Hebrew perfect may be rendered either as a past statement or as a present discourse formula here.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 남자가 백 명의 자녀를 두고 여러 해를 살며, 그의 햇수가 아무리 많아도, 그 자신[b]이 좋은 것에 만족하지 못하고 매장조차 되지 못한다면, 나는 말합니다[c]. 사산아[a]가 그보다 더 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사산아’에 해당하는 히브리어는 유산으로 잃은 태아 또는 때 이른 출생을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 네페쉬(혼/자아)’입니다. 문맥상 ‘그 자신’ 또는 ‘그의 욕구/식욕’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나는 말합니다’는 히브리어 완료형을 현재의 담화 공식으로 읽은 번역입니다. ‘내가 말했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלִיד אִישׁ מֵאָה
  english_pob_choice: a man fathers a hundred children
  chosen_korean: 사람이 백 명의 자녀를 낳고
  alternatives_korean:
  - 한 남자가 백 명의 자녀를 낳고
  - 사람이 백 명을 낳고
  lexicon: WLC / HALOT
  rationale: 히필형 ילד의 생식적·원인적 힘을 살리면서도 한국어에서는 ‘자녀를 낳다’가 자연스럽고 문맥에 맞습니다. '백 명을 낳고'는 대상이 모호해져 원문의 인격적 의미를 약화시킵니다.
- source_word: וְנַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영
  alternatives_korean:
  - 그의 혼
  - 그의 생명
  - 그 자신
  lexicon: WLC / HALOT
  rationale: 문맥상 ‘영혼/자아/생명’의 폭이 있으나, 한국어 ‘영’이 내부의 충족 여부를 가장 직설적으로 전달합니다. 다만 인간 안의 내적 존재를 가리킨다는 점을 유지하기 위해 ‘그의 영’으로 옮겼습니다.
- source_word: לֹא תִשְׂבַּע מִן הַטּוֹבָה
  english_pob_choice: is not satisfied with good
  chosen_korean: 좋은 것에 만족하지 못하고
  alternatives_korean:
  - 복된 것에 만족하지 못하고
  - 좋은 것으로 배부르지 못하고
  lexicon: WLC / HALOT
  rationale: שׂבע의 ‘만족하다/배부르다’ 의미를 살리되, 전도서의 הַטּוֹבָה를 한국어 독자에게 자연스럽게 풀어 ‘좋은 것’으로 옮겼습니다. 이는 도덕적 선보다 삶의 유익과 즐거움을 가리키는 뉘앙스를 반영합니다.
- source_word: וְגַם קְבוּרָה לֹא הָיְתָה לּוֹ
  english_pob_choice: and he does not even have burial
  chosen_korean: 장례도 받지 못한다면
  alternatives_korean:
  - 무덤도 없으면
  - 장사도 지내지 못한다면
  - 장례조차 받지 못한다면
  lexicon: WLC / HALOT
  rationale: קבורה는 매장 행위와 장례의 수치를 함께 포함하므로, 한국어에서는 ‘장례’가 문맥상 가장 자연스럽습니다. ‘받지 못한다’는 수동적 박탈을 드러냅니다.
- source_word: הַנָּפֶל
  english_pob_choice: the stillborn child
  chosen_korean: 낙태된 아이
  alternatives_korean:
  - 사산된 아이
  - 유산된 아이
  - 조산된 아이
  lexicon: WLC / HALOT
  rationale: 영어 POB의 주석이 'miscarriage' / 'untimely birth' 가능성을 열어 두고 있어, 한국어도 동일한 해석 범위를 반영해야 합니다. ‘낙태된 아이’는 본문 비교의 충격과 비극성을 살리되, 현대 독자에게도 제시된 대안적 독법을 함께 떠올리게 합니다.
theological_decisions:
- issue: נֶפֶשׁ의 인간학적 폭을 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘그의 영’으로 번역해 내부적 충족의 주체를 드러냈습니다.
  alternative_readings:
  - 그의 혼
  - 그 자신
  - 그의 생명
  rationale: 본문은 교리적 정의를 제시하기보다 인간 존재의 내적 허무를 묘사합니다. 한국어에서 ‘영’은 문자적 대응만이 아니라 내면의 결핍과 갈망을 충분히 전달해, 원문의 인간학적 긴장을 보존합니다.
  doctrine_reference: 전도서 6:3의 지혜문학적 인간 이해
- issue: אָמַרְתִּי의 현재적 담화 공식 여부
  chosen_reading: ‘내가 말합니다’로 현재적 평가 진술을 살렸습니다.
  alternative_readings:
  - 내가 말했습니다
  - 내가 말하였노라
  rationale: 히브리어 완료형이 문맥상 단순 과거가 아니라 논증을 이끄는 담화 공식으로 기능할 수 있습니다. 한국어 현재형은 화자의 판단을 즉각적으로 제시하며, 전도서의 성찰적 흐름과 잘 맞습니다.
  doctrine_reference: 전도서의 담화 진행 방식
