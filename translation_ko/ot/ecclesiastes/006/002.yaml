id: ECC.6.2
reference: Ecclesiastes 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן ל֣/וֹ הָ/אֱלֹהִ֡ים עֹשֶׁר֩ וּ/נְכָסִ֨ים וְ/כָב֜וֹד וְֽ/אֵינֶ֨/נּוּ חָסֵ֥ר לְ/נַפְשׁ֣/וֹ מִ/כֹּ֣ל אֲשֶׁר יִתְאַוֶּ֗ה וְ/לֹֽא יַשְׁלִיטֶ֤/נּוּ הָֽ/אֱלֹהִים֙ לֶ/אֱכֹ֣ל מִמֶּ֔/נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י יֹֽאכֲלֶ֑/נּוּ זֶ֥ה הֶ֛בֶל וָ/חֳלִ֥י רָ֖ע הֽוּא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches[a], possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not empower him to eat from them, because a foreign man eats them[c][b]. This is vanity and a grievous sickness.
  footnotes:
  - marker: a
    text: Or 'a foreigner' / 'a stranger.' The Hebrew says literally 'a foreign man.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to eat from them,' a concrete expression for enjoying or benefiting from one's possessions.
    reason: lexical_alternative
  - marker: c
    text: Or 'vapor' or 'futility' for 'vanity' (Hebrew hebel), a key term in Ecclesiastes.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 있어 하나님께서 그에게 재물과 소유와 존귀를 주셔서, 그 자신이 바라는 모든 것 가운데 부족한 것이 없는데도, 하나님께서는 그가 그것을 먹을 수 있게 하지 않으십니다. 외국 사람이[a] 그것을 먹습니다[b]. 이것은 허무[c]이며 심한 병입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 사람’. 히브리어는 문자적으로 ‘외국의 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘먹다’는 여기서 소유를 실제로 누리거나 그 혜택을 받는다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 전도서의 핵심어 הֶבֶל은 문맥에 따라 ‘헛됨’, ‘입김’ 또는 ‘증기’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  english_pob_choice: There is a man to whom
  chosen_korean: 하나님이 … 주셔서
  alternatives_korean:
  - 어떤 사람이 있어서
  - 한 남자가 있어서
  lexicon: HALOT
  rationale: 히브리어는 일반적 사례를 제시하는 지혜문학식 진술이므로, 한국어에서는 인물 도입을 자연스럽게 풀어 쓰되 대표적 남성 단수의 관찰 형식을 유지했습니다.
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  english_pob_choice: riches, possessions, and honor
  chosen_korean: 재물과 소유와 존귀
  alternatives_korean:
  - 부와 재산과 명예
  - 부유함과 소유물과 영예
  lexicon: HALOT
  rationale: 세 항목의 축적 효과를 살리면서, עֹשֶׁר는 재물, נְכָסִים는 소유, כָבוֹד는 인간 관계적 ‘존귀’로 구분해 옮겼습니다.
- source_word: וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר יִתְאַוֶּה
  english_pob_choice: so that he lacks nothing for himself of all that he desires
  chosen_korean: 그가 자기 마음에 원하는 것 가운데 무엇 하나도 부족함이 없게 되었는데도
  alternatives_korean:
  - 그가 자기 자신에게 아무것도 부족하지 않게 되었는데도
  - 그가 자기에게 필요한 모든 것을 결핍하지 않게 되었는데도
  lexicon: HALOT
  rationale: לְנַפְשׁוֹ는 여기서 기술적 ‘영혼’보다 자기 자신/자기 삶을 가리키는 관용이므로, 이를 ‘자기 마음에 원하는 것’과 ‘부족함이 없게’로 풀어 자연스럽게 전달했습니다.
- source_word: וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים לֶאֱכֹל מִמֶּנּוּ
  english_pob_choice: yet God does not empower him to eat from them
  chosen_korean: 하나님은 그에게 그것들로부터 먹을 수 있게 하지 않으십니다
  alternatives_korean:
  - 하나님은 그가 그것들을 누리게 하지 않으십니다
  - 하나님은 그가 그것들에서 먹도록 허락하지 않으십니다
  lexicon: HALOT
  rationale: הִשְׁלִיט의 사역적 뉘앙스를 살리기 위해 단순 허용보다 ‘먹을 수 있게 하지 않다’로 옮겼고, 먹다라는 구체적 표현은 소유의 향유를 가리키는 히브리어 관용을 보존합니다.
- source_word: אִישׁ נָכְרִי יֹאכֲלֶנּוּ
  english_pob_choice: because a foreign man eats them
  chosen_korean: 오히려 낯선 사람이 그것들을 먹습니다
  alternatives_korean:
  - 오히려 이방인이 그것들을 먹습니다
  - 오히려 외국 사람이 그것들을 먹습니다
  lexicon: HALOT
  rationale: אִישׁ נָכְרִי는 문자적으로 ‘낯선/외국의 사람’이므로, 한국어에서는 ‘낯선 사람’으로 옮겨 두 단어의 긴장을 보존했습니다.
- source_word: זֶה הֶבֶל וָחֳלִי רָע
  english_pob_choice: This is vanity and a grievous sickness
  chosen_korean: 이것은 허무이며 심한 병입니다
  alternatives_korean:
  - 이것은 헛됨이며 심한 병입니다
  - 이것은 허무이며 중한 병입니다
  lexicon: HALOT
  rationale: הֶבֶל은 전도서의 핵심어이므로 여기서는 전통적 대응어 ‘허무’를 유지했고, וָחֳלִי רָע는 ‘심한 병’으로 옮겨 해로운 질병 이미지를 살렸습니다.
theological_decisions:
- issue: לְנַפְשׁוֹ의 의미
  chosen_reading: ‘자기 마음에 원하는 것’으로 풀어, 자기 자신/자기 삶을 가리키는 관용으로 처리했습니다.
  alternative_readings:
  - ‘자기 영혼에’
  - ‘자기에게’
  rationale: 문맥은 영혼론이 아니라 소유의 충족 상태를 말하므로, נֶפֶשׁ를 직역해 신학적 의미를 과도하게 부각하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 대표적 남성 단수 표현
  chosen_reading: אִישׁ를 일반 사례를 제시하는 ‘어떤 사람’의 형식으로 풀되, 본문의 남성 단수 관찰 구조는 유지했습니다.
  alternative_readings:
  - 사람
  - 누구든지
  rationale: 전도서의 잠언적 관찰을 한국어로 자연스럽게 전달하면서도, 원문의 대표적 남성 단수 구성을 지웠습니다.
  doctrine_reference: Translation philosophy §4
