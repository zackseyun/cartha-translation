id: ECC.6.10
reference: Ecclesiastes 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה שֶּֽׁ/הָיָ֗ה כְּבָר֙ נִקְרָ֣א שְׁמ֔/וֹ וְ/נוֹדָ֖ע אֲשֶׁר ה֣וּא אָדָ֑ם וְ/לֹא יוּכַ֣ל לָ/דִ֔ין עִ֥ם ש/התקיף מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
  footnotes:
  - marker: a
    text: Or, 'with him who is stronger than he'; the stronger one is likely God, though the Hebrew does not state this explicitly.
    reason: alternative_reading
  - marker: b
    text: '''Man'' here represents humanity in the singular.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무슨 일이 생기든 이미 이름이 붙여져 있고[a], 무엇이 사람인지도 알려져 있습니다[b]. 그러나 그는 자기보다 더 강한 자와 다툴 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그보다 더 강한 이와’; 더 강한 이는 아마도 하나님을 가리키지만, 히브리어는 그것을 분명히 말하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘사람’은 여기서 인류를 대표하는 단수입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  english_pob_choice: Whatever has come to be
  chosen_korean: 무슨 일이 생기든
  alternatives_korean:
  - 무슨 것이 생겨나든
  - 이미 존재하게 된 것은
  lexicon: HALOT
  rationale: 보편적 진술의 범위를 살리면서도 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: נִקְרָא שְׁמוֹ
  english_pob_choice: has already been named
  chosen_korean: 이미 이름이 붙여져 있고
  alternatives_korean:
  - 이미 이름이 불렸고
  - 이미 명명되었고
  lexicon: HALOT
  rationale: ‘이름이 붙여지다’는 수동적 명명/지정의 뉘앙스를 비교적 자연스럽게 옮깁니다.
- source_word: אֲשֶׁר הוּא אָדָם
  english_pob_choice: what man is
  chosen_korean: 무엇이 사람인지
  alternatives_korean:
  - 사람이 무엇인지
  - 인간이 무엇인지
  lexicon: HALOT
  rationale: 대표적 단수로서의 אָדָם을 한국어에서 과도하게 남성화하지 않으면서도, 본문이 말하는 인간 실상을 드러내게 했습니다.
- source_word: וְלֹא יוּכַל לָדִין
  english_pob_choice: and he cannot contend
  chosen_korean: 그러나 그는 … 다툴 수 없습니다
  alternatives_korean:
  - 그러나 그는 … 논쟁할 수 없습니다
  - 그러나 그는 … 변론할 수 없습니다
  lexicon: HALOT
  rationale: דין의 대립·논쟁적 의미를 살리되, 법정 용어로 좁히지 않고 문맥에 맞게 ‘다투다’로 옮겼습니다.
- source_word: עִם שֶׁהִתְקִיף מִמֶּנּוּ
  english_pob_choice: with one stronger than he
  chosen_korean: 자기보다 더 강한 자
  alternatives_korean:
  - 그보다 더 강한 자
  - 자기보다 더 힘센 자
  lexicon: HALOT
  rationale: 히브리어가 명시하지 않는 대상을 본문에 추가하지 않고, 비교 구조만 그대로 드러냈습니다.
theological_decisions:
- issue: ‘더 강한 자’의 정체를 본문에서 명시할지 여부
  chosen_reading: 주어를 생략한 채 ‘자기보다 더 강한 자’로 남겼습니다.
  alternative_readings:
  - 하나님으로 명시함
  - ‘그보다 더 강하신 하나님’으로 풀어씀
  rationale: 문맥상 하나님을 가리킬 가능성은 크지만, 히브리어 본문이 그 정체를 명시하지 않으므로 수사적 모호성을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
