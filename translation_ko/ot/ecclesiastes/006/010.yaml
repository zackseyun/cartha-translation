source:
  edition: WLC
  text: מַה שֶּֽׁ/הָיָ֗ה כְּבָר֙ נִקְרָ֣א שְׁמ֔/וֹ וְ/נוֹדָ֖ע אֲשֶׁר ה֣וּא אָדָ֑ם וְ/לֹא יוּכַ֣ל לָ/דִ֔ין עִ֥ם ש/התקיף מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
  footnotes:
  - marker: a
    text: Or, 'with him who is stronger than he'; the stronger one is likely God, though the Hebrew does not state this explicitly.
    reason: alternative_reading
  - marker: b
    text: '''Man'' here represents humanity in the singular.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무엇이든 존재하게 된 것은 이미 그 이름이 붙여졌고, 사람이 무엇인지도 알려져 있습니다[b]. 사람은 자기보다 더 강한 이와[a] 다툴 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그보다 더 강한 이와’; 더 강한 이는 아마도 하나님을 가리키지만, 히브리어는 그것을 분명히 말하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘사람’은 여기서 인류를 대표하는 단수입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  english_pob_choice: Whatever has come to be
  chosen_korean: 무슨 일이 생기든
  alternatives_korean:
  - 무슨 것이 생겨나든
  - 이미 존재하게 된 것은
  lexicon: HALOT
  rationale: 보편적 진술의 범위를 살리면서도 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: נִקְרָא שְׁמוֹ
  english_pob_choice: has already been named
  chosen_korean: 이미 이름이 붙여져 있고
  alternatives_korean:
