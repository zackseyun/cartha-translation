revisions:
- from: 그리고 그들 가운데 하나에게서 작은 뿔[a]이 나와, 남쪽과 동쪽[b]과 아름다운 땅을 향하여 심히 커졌습니다.
  to: 그들 가운데 하나에서 작은 뿔[a] 하나가 나왔는데, 그것이 남쪽과 동쪽과 아름다운 땅[b]을 향하여 심히 커졌습니다.
  rationale: 본문 의미를 바꾸지 않고 기원 표현을 더 자연스러운 한국어로 다듬었으며, 수사 ‘하나’를 본문에 반영했습니다. 가장 중요한 수정은 각주 b를 ‘아름다운 땅’에 정확히 연결하고, 중복된 ‘또는 동쪽’을 제거한 것입니다. ‘기쁜 땅’은 צבי의 ‘기쁨/바람직함’ 계열의 가능한 번역으로서 영어 감사 기록의 ‘pleasant land’에 대응합니다.
