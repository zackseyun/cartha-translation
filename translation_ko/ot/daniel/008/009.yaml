id: DAN.8.9
reference: Daniel 8:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הָ/אַחַ֣ת מֵ/הֶ֔ם יָצָ֥א קֶֽרֶן אַחַ֖ת מִ/צְּעִירָ֑ה וַ/תִּגְדַּל יֶ֛תֶר אֶל הַ/נֶּ֥גֶב וְ/אֶל הַ/מִּזְרָ֖ח וְ/אֶל הַ/צֶּֽבִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/009.yaml
  text: And out of one of them came a small horn[a], and it grew exceedingly great toward the south, toward the east[b], and toward the Beautiful Land.
  footnotes:
  - marker: a
    text: Or "a little horn."
    reason: lexical_alternative
  - marker: b
    text: Or "the glorious land" or "the pleasant land." The Hebrew expression is a descriptive title, likely referring to the land of Israel.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들 가운데 하나에게서 작은 뿔[a]이 나와, 남쪽과 동쪽[b]과 아름다운 땅을 향하여 심히 커졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “작은 뿔 하나.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “동쪽”; 또는 “영광스러운 땅”이나 “아름다운 땅.” 이 히브리어 표현은 묘사적 칭호로, 아마도 이스라엘 땅을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הָאַחַת מֵהֶם
  english_pob_choice: And out of one of them
  chosen_korean: 그들 가운데 하나에게서
  alternatives_korean:
  - 그들 중 하나에게서
  - 그들 중 한 개에서
  lexicon: HALOT
  rationale: 출처를 나타내는 מן 구문을 한국어의 자연스러운 ‘~가운데/중’으로 옮겨, ‘one of them’의 소속감과 발생 출처를 함께 살렸습니다.
- source_word: קֶרֶן אַחַת מִצְּעִירָה
  english_pob_choice: a small horn
  chosen_korean: 작은 뿔
  alternatives_korean:
  - 작은 뿔
  - 작은 뿔 하나
  lexicon: HALOT
  rationale: 상징적 이미지를 해석하지 않고 그대로 보존하되, מִצְּעִירָה의 소형성을 ‘작은’으로 자연스럽게 반영했습니다.
- source_word: וַתִּגְדַּל יֶתֶר
  english_pob_choice: it grew exceedingly great
  chosen_korean: 심히 커졌습니다
  alternatives_korean:
  - 매우 크게 자랐습니다
  - 극도로 커졌습니다
  lexicon: HALOT
  rationale: גדל의 ‘커지다/크게 되다’와 יֶתֶר의 강화를 함께 살리면서, 현대 한국어에서 과장되지 않고도 충분히 강한 ‘심히’로 처리했습니다.
- source_word: וְאֶל הַצְּבִי
  english_pob_choice: toward the Beautiful Land
  chosen_korean: 아름다운 땅을 향하여
  alternatives_korean:
  - 영광스러운 땅을 향하여
  - 아름다운 땅을 향하여
  lexicon: HALOT
  rationale: 지명적 해석을 본문에 직접 넣지 않고, 히브리어의 묘사적 표현을 살려 ‘Beautiful Land’에 대응되는 ‘아름다운 땅’을 유지했습니다.
theological_decisions:
- issue: 뿔 상징을 본문에서 해석적으로 풀지 않을지 여부
  chosen_reading: 상징어 ‘뿔’을 그대로 유지했습니다.
  alternative_readings:
  - 왕
  - 세력
  - 왕국
  rationale: 묵시적 상징을 번역문에서 곧바로 해석하면 히브리어가 남긴 상징성을 약화시킬 수 있으므로, 원문이 말하는 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: הַצְּבִי의 의미를 ‘아름다운 땅’으로 둘지 ‘영광스러운 땅’으로 둘지 여부
  chosen_reading: 본문에는 ‘아름다운 땅’을 두고, 대안 독법은 각주로 남겼습니다.
  alternative_readings:
  - 영광스러운 땅
  - 기쁜 땅
  rationale: 이 표현은 이스라엘 땅을 가리키는 묘사적 칭호로 보이지만, 본문에서는 설명을 앞세우기보다 히브리어의 서술적 뉘앙스를 유지하는 편이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
