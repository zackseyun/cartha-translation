source:
  edition: WLC
  text: וּ/רְאִיתִ֞י/ו מַגִּ֣יעַ אֵ֣צֶל הָ/אַ֗יִל וַ/יִּתְמַרְמַ֤ר אֵלָי/ו֙ וַ/יַּ֣ךְ אֶת הָ/אַ֔יִל וַ/יְשַׁבֵּר֙ אֶת שְׁתֵּ֣י קְרָנָ֔י/ו וְ/לֹא הָ֥יָה כֹ֛חַ בָּ/אַ֖יִל לַ/עֲמֹ֣ד לְ/פָנָ֑י/ו וַ/יַּשְׁלִיכֵ֤/הוּ אַ֨רְצָ/ה֙ וַֽ/יִּרְמְסֵ֔/הוּ וְ/לֹא הָיָ֥ה מַצִּ֛יל לָ/אַ֖יִל מִ/יָּדֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/007.yaml
  text: And I saw him come up to the ram[a], and he was enraged against him, and he struck the ram and broke its two horns. And there was no strength in the ram to stand before him; he threw him to the ground and trampled him[d][c][b], and there was no one to rescue the ram from his hand.
  footnotes:
  - marker: a
    text: Or 'approach the ram.' The Hebrew verb can denote coming near or reaching to.
    reason: lexical_alternative
  - marker: b
    text: Or 'he became bitter against him.' The Hebrew expression conveys intense hostility or embittered rage.
    reason: lexical_alternative
  - marker: c
    text: '''To stand before him'' can also mean ''to withstand him'' in this conflict setting.'
    reason: lexical_alternative
  - marker: d
    text: '''From his hand'' is a Hebrew idiom for being under someone''s power or control.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 보니 숫염소가 숫양에게 다가갔습니다.[a] 숫염소는 숫양에게 격분하여[b] 숫양을 쳐서 그 두 뿔을 꺾었습니다. 숫양은 숫염소 앞에 설[c] 힘이 없었고, 숫염소는 숫양을 땅에 내던져 짓밟았으며, 숫양을 숫염소의 손에서[d] 구해 낼 자가 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다가갔습니다’는 히브리어 표현의 ‘가까이 가다’ 또는 ‘도달하다’라는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘격분하여’는 ‘그에게 쓰라린 마음을 품다’ 또는 ‘그를 향해 몹시 분노하다’로도 옮길 수 있는 히브리어 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘앞에 서다’는 이 전투 장면에서 ‘맞서다’ 또는 ‘버티다’라는 뜻도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘손에서’는 히브리어 관용구로, 그의 권세나 지배 아래에서라는 뜻을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתִיו / מַגִּיעַ אֵצֶל
  english_pob_choice: And I saw him come up to the ram
  chosen_korean: 내가 보니 숫양에게로 다가가는데
  alternatives_korean:
  - 내가 보니 숫양에게로 올라오는데
  - 내가 보니 숫양에게 접근하는데
  lexicon: HALOT
  rationale: 시각 보고 문맥을 살리면서 מַגִּיעַ אֵצֶל의 ‘가까이 감/도달함’을 자연스러운 ‘다가가는데’로 옮겼습니다.
- source_word: וַיִּתְמַרְמַר אֵלָיו
  english_pob_choice: he was enraged against him
  chosen_korean: 그가 그에게 격분하여
  alternatives_korean:
  - 그가 그에게 쓰라린 마음이 되어
  - 그가 그를 향해 분노에 사로잡혀
  lexicon: HALOT
  rationale: 히트파엘 מרר의 격렬한 적개심을 ‘격분하다’로 옮겨, 단순한 감정 변화가 아니라 공격적 적의의 강도를 드러냈습니다.
- source_word: וַיְשַׁבֵּר אֶת שְׁתֵּי קְרָנָיו
  english_pob_choice: and broke its two horns
  chosen_korean: 숫양을 쳐서 그 두 뿔을 꺾었습니다
  alternatives_korean:
  - 숫양의 두 뿔을 부러뜨렸습니다
  - 숫양의 두 뿔을 산산이 부쉈습니다
  lexicon: HALOT
  rationale: שבר는 ‘부수다/꺾다/부러뜨리다’의 범위가 있어, 뿔을 직접적으로 무너뜨리는 이미지를 살린 ‘꺾었습니다’를 선택했습니다.
- source_word: וְלֹא הָיָה כֹחַ בָּאַיִל לַעֲמֹד לְפָנָיו
  english_pob_choice: there was no strength in the ram to stand before him
  chosen_korean: 숫양에게는 그 앞에 서 있을 힘이 없었고
  alternatives_korean:
  - 숫양에게는 그를 버틸 힘이 없었고
  - 숫양에게는 그를 맞설 힘이 없었고
  lexicon: HALOT
  rationale: ‘서 있다’의 직역 가능성을 살리되, 전투 문맥에서의 항거 의미를 함께 드러내어 ‘서 있을 힘’으로 번역했습니다.
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה וַיִּרְמְסֵהוּ
  english_pob_choice: he threw him to the ground and trampled him
  chosen_korean: 그를 땅에 던져 짓밟았으며
  alternatives_korean:
  - 그를 땅에 내던져 짓밟았으며
  - 그를 땅에 던져 밟아 버렸으며
  lexicon: HALOT
  rationale: השליך의 강한 투척과 רמס의 짓밟음을 합쳐, 폭력의 연속성을 한국어에서도 압축적으로 드러냈습니다.
- source_word: מִיָּדוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서 건져 낼 자가 없었습니다
  alternatives_korean:
  - 그의 손에서 구해 낼 자가 없었습니다
  - 그의 권세에서 빼앗아 올 자가 없었습니다
  lexicon: HALOT
  rationale: ‘손’의 관용적 통제 의미를 살리면서 한국어에서는 ‘건져 내다’로 구출의 부재를 자연스럽게 표현했습니다.
