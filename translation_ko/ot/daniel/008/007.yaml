  source_fidelity: 원문의 주어·목적어 관계는 숫염소가 숫양에게 다가가 격분한 뒤 공격하는 흐름입니다. 초안은 반복되는 ‘그’ 때문에 두 동물의 지시 대상이 불명확해질 수 있으므로, 핵심 행위자와 대상은 명시하는 것이 필요합니다. 또한 לַעֲמֹד לְפָנָיו의 문자적 표현과 전투 문맥의 ‘맞서다’ 의미, מִיָּדוֹ의 ‘손’ 관용구를 각주로 보완하는 것이 적절합니다.
