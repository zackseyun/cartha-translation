base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/001.yaml
  text: In the third year of the reign of Belshazzar the king[a], a vision appeared to me—I, Daniel—after the one that had appeared to me at the first.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'after the vision that had appeared to me at the first.' The Hebrew refers back to an earlier appearing and likely alludes to Daniel's previous vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 벨사살 왕의 통치 제삼년에, 처음에 내게 나타났던 것 뒤에 나 다니엘에게 환상이 나타났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ
  english_pob_choice: In the third year of
  chosen_korean: 통치 제삼년
  alternatives_korean:
  - 왕위 제삼년
  - 즉위 제삼년
  lexicon: WLC
  rationale: 연대 표지구문으로서 ‘year of the reign’의 의미를 살려, 자연스러운 현대 한국어로 ‘통치 제삼년’이라 옮겼습니다.
- source_word: לְמַלְכוּת
  english_pob_choice: of the reign of
  chosen_korean: 통치
  alternatives_korean:
  - 왕권
  - 왕위
  lexicon: WLC
  rationale: מַלְכוּת는 이 문맥에서 왕의 ‘통치/재위 기간’을 가리키므로, 제도적 ‘왕권’보다 시간표현에 맞는 ‘통치’를 택했습니다.
- source_word: חָזוֹן
  english_pob_choice: a vision
  chosen_korean: 환상
  alternatives_korean:
  - 계시
  - 이상
  lexicon: WLC
  rationale: 다니엘서의 예언적 시현을 가리키는 말로, 본문의 시각적·계시적 경험을 살리기 위해 ‘환상’을 사용했습니다.
- source_word: הַנִּרְאָה ... בַּתְּחִלָּה
  english_pob_choice: the one that had appeared ... at the first
  chosen_korean: 처음에 내게 나타났던 그것
  alternatives_korean:
  - 처음에 내게 보였던 환상
  - 맨 처음 내게 나타났던 것
  lexicon: WLC
  rationale: 히브리어가 앞선 나타남을 되짚는 구조이므로, ‘그것’으로 앞선 시현을 지시해 POB의 회수적 관계를 반영했습니다.
theological_decisions:
- issue: 환상의 반복적 연결 관계
  chosen_reading: ‘처음에 내게 나타났던 그것 뒤에’로 이전 환상과의 연속성을 드러냈습니다.
  alternative_readings:
  - ‘이전에 내게 나타난 뒤에’
  - ‘맨 처음 나타난 환상 뒤에’
  rationale: 본문은 현재의 환상이 이전에 이미 주어진 시현을 회상하는 구조이므로, 시간순 연결과 회고를 함께 드러내는 표현이 가장 충실합니다.
  doctrine_reference: 문맥-해석의 연속성
