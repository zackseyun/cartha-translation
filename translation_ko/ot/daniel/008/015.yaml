  to: 나 다니엘이 그 환상을 보고 그 뜻을 깨닫고자 할 때에, 보니 사람의 모습 같은 이가 내 앞에 서 있었습니다.
  rationale: 주어를 ‘나 다니엘이’로 바로잡아 원문의 자기지시적 강조를 자연스럽게 반영했습니다. ‘보니’로 서사 전환과 הִנֵּה의 주목 기능을 살렸고, ‘사람의 모습 같은 이’는 원문의 외양 비교를 그대로 유지하여 그 존재의 정체를 해석적으로 확정하지 않습니다. 의미 있는 대안이 아닌 어순 반복 각주는 삭제했습니다.
