  text: וַ/יְהִ֗י בִּ/רְאֹתִ֛/י אֲנִ֥י דָנִיֵּ֖אל אֶת הֶ/חָז֑וֹן וָ/אֲבַקְשָׁ֣/ה בִינָ֔ה וְ/הִנֵּ֛ה עֹמֵ֥ד לְ/נֶגְדִּ֖/י כְּ/מַרְאֵה גָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/015.yaml
  text: And it happened[a], when I, Daniel, had seen the vision and was seeking understanding, behold, standing before me was one with the appearance of a man.
  footnotes:
  - marker: a
    text: Or, 'there stood before me one like the appearance of a man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나 다니엘이 그 환상을 보고 그 뜻을 깨닫고자 할 때에, 보니 사람의 모습 같은 이가 내 앞에 서 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: …있었습니다
  alternatives_korean:
  - …되었습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 서사 전개 표지로서의 wayyiqtol 기능을 살려, 한국어에서는 자연스러운 서술 연결인 ‘…있었습니다’로 풀어 담담한 사건 전환을 나타냈습니다.
- source_word: בִּרְאֹתִי אֲנִי דָנִיֵּאל
  english_pob_choice: when I, Daniel, had seen
  chosen_korean: 내가, 다니엘이, 그 환상을 보았고
  alternatives_korean:
  - 내가 다니엘이 그 환상을 보았을 때
  - 내가 다니엘이 그 환상을 본 뒤
  lexicon: HALOT
  rationale: 시간 부사절의 선후관계를 한국어의 과거 연결로 자연스럽게 옮기되, ‘나, 다니엘’의 강조를 살리기 위해 주어를 분리해 표기했습니다.
- source_word: בִינָה
  english_pob_choice: understanding
  chosen_korean: 이해를
  alternatives_korean:
  - 깨달음을
  - 분별을
  lexicon: HALOT
  rationale: בינה는 단순한 지식이 아니라 사태의 의미를 파악하는 이해/통찰을 가리키므로, 가장 مستقیم한 ‘이해’로 옮겼습니다.
- source_word: עֹמֵד לְנֶגְדִּי
  english_pob_choice: standing before me was
  chosen_korean: 내 앞에 서 있었습니다
  alternatives_korean:
  - 내 앞에 서 있었습니다
  - 내 앞에 서 있던 이가 있었습니다
  lexicon: HALOT
  rationale: ‘서 있는’ 상태를 나타내는 분사와 ‘내 앞에/마주하여’의 위치 정보를 한국어의 현재진행적 서술로 반영했습니다.
- source_word: כְּמַרְאֵה גָבֶר
  english_pob_choice: one with the appearance of a man
  chosen_korean: 사람의 모습 같은 이가
  alternatives_korean:
  - 사람처럼 보이는 이가
  - 사람의 형상 같은 이가
  lexicon: HALOT
  rationale: 비교 표지 כ와 מראה의 관찰적 성격을 유지해, 정체를 단정하지 않고 겉모습만 기술하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 그 인물의 정체를 본문 이상으로 특정할지 여부
  chosen_reading: 본문의 관찰 진술만 살려 ‘사람의 모습 같은 이’로 두고, 천사·신적 존재 등으로 특정하지 않았습니다.
  alternative_readings:
  - 천사처럼 보이는 이
  - 사람의 형상을 한 주님의 사자
  - 성육신 전의 신적 존재
  rationale: 이 절 자체는 다니엘이 본 외형을 묘사할 뿐이므로, 해석적 동일시를 번역문에 미리 주입하지 않고 본문이 허용하는 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 관찰과 해석의 구분 유지
