id: DAN.8.14
reference: Daniel 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י עַ֚ד עֶ֣רֶב בֹּ֔קֶר אַלְפַּ֖יִם וּ/שְׁלֹ֣שׁ מֵא֑וֹת וְ/נִצְדַּ֖ק קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/014.yaml
  text: And he said to me[a], “Until 2,300 evenings and mornings[b]; then the sanctuary will be restored.”
  footnotes:
  - marker: a
    text: Or 'Until evening-morning, 2,300'; the phrase may refer either to 2,300 full days or to 2,300 evening-morning offerings (about 1,150 days).
    reason: alternative_reading
  - marker: b
    text: Or 'then the sanctuary will be cleansed,' 'vindicated,' or 'justified.' The Hebrew verb is literally 'be put right.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나에게 말했습니다. “2,300 저녁과 아침까지[a]; 그러면 성소가 회복될 것입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘2,300 저녁-아침까지’; 이 표현은 2,300일을 가리킬 수도 있고, 2,300번의 저녁과 아침 제사를 가리킬 수도 있습니다(약 1,150일).
    reason: alternative_reading
  - marker: b
    text: 또는 ‘성소가 정결하게 될 것입니다’, ‘성소의 옳음이 드러날 것입니다’, 또는 ‘성소가 바로잡힐 것입니다’. 히브리어 동사는 문자적으로 ‘바르게 되다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  english_pob_choice: And he said to me
  chosen_korean: 그가 저에게 말했습니다
  alternatives_korean:
  - 그가 내게 말했습니다
  - 그리고 그가 저에게 말했습니다
  lexicon: HALOT
  rationale: 서술의 순서를 자연스럽게 살리되, 히브리어의 직접 화행을 현대 문어체로 옮겨 ‘말했습니다’로 간결하게 처리했습니다.
- source_word: עַד
  english_pob_choice: Until
  chosen_korean: …까지
  alternatives_korean:
  - 까지
  - 때까지
  lexicon: HALOT
  rationale: 질문에 대한 기간의 한계를 나타내는 말로 보아, 한국어에서는 ‘까지’가 가장 직접적이고 자연스럽습니다.
- source_word: עֶרֶב בֹּקֶר
  english_pob_choice: 2,300 evenings and mornings
  chosen_korean: 2,300 저녁과 아침
  alternatives_korean:
  - 2,300 저녁-아침
  - 2,300 저녁과 아침들
  lexicon: HALOT
  rationale: 히브리어의 이중 표현을 그대로 살려, 해석을 단정하지 않고 ‘저녁과 아침’으로 옮겼습니다.
- source_word: וְנִצְדַּק קֹדֶשׁ
  english_pob_choice: then the sanctuary will be restored
  chosen_korean: 그러면 성소가 회복될 것입니다
  alternatives_korean:
  - 그러면 성소가 바로잡힐 것입니다
  - 그러면 성소가 정당함을 인정받을 것입니다
  - 그러면 성소가 정결해질 것입니다
  lexicon: HALOT
  rationale: נִצְדַּק의 핵심은 ‘바르게 되다/옳게 되다’에 있으므로, ‘회복되다’로 옮겨 성소의 상태가 바로잡히는 뜻을 살렸습니다. ‘정결해지다’는 해석을 앞세울 수 있어 본문에서는 피했습니다.
theological_decisions:
- issue: עֶרֶב בֹּקֶר의 시간 단위 해석
  chosen_reading: 본문은 해석을 단정하지 않고 ‘2,300 저녁과 아침’의 표현을 보존합니다.
  alternative_readings:
  - 2,300일
  - 1,150일(매일 드리는 저녁·아침 제사를 기준으로 셈)
  rationale: 히브리어 표현 자체가 기간과 제사 횟수의 두 가능성을 남기므로, 한국어 본문도 그 긴장을 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: 번역 원칙 §3
- issue: וְנִצְדַּק קֹדֶשׁ의 의미
  chosen_reading: 성소가 ‘회복될 것입니다’로 번역해, משפט/정당성보다 ‘바로잡힘’의 넓은 의미를 살립니다.
  alternative_readings:
  - 성소가 정결해질 것입니다
  - 성소가 옳게 될 것입니다
  - 성소가 변호될 것입니다
  rationale: 히브리어 동사는 문자적으로 ‘바르게 되다’에 가깝고, 문맥상 제의적 정결만으로 좁히기 어렵기 때문에 넓은 의미의 ‘회복’으로 옮겼습니다.
  doctrine_reference: 번역 원칙 §1, §5
