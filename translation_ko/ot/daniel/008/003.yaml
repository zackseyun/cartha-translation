id: DAN.8.3
reference: Daniel 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשָּׂ֤א עֵינַ/י֙ וָ/אֶרְאֶ֔ה וְ/הִנֵּ֣ה אַ֣יִל אֶחָ֗ד עֹמֵ֛ד לִ/פְנֵ֥י הָ/אֻבָ֖ל וְ/ל֣/וֹ קְרָנָ֑יִם וְ/הַ/קְּרָנַ֣יִם גְּבֹה֗וֹת וְ/הָ/אַחַת֙ גְּבֹהָ֣ה מִן הַ/שֵּׁנִ֔ית וְ/הַ֨/גְּבֹהָ֔ה עֹלָ֖ה בָּ/אַחֲרֹנָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/003.yaml
  text: Then I lifted up my eyes and saw[a], and behold, one ram was standing before the canal, and it had two horns. The horns were high, but one was higher than the other[b], and the higher one came up last.
  footnotes:
  - marker: a
    text: Or 'stream' or 'river' for 'canal'; the Hebrew term refers to a watercourse and in Daniel likely denotes a canal.
    reason: lexical_alternative
  - marker: b
    text: Or 'the higher one arose later.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 눈을 들어 보니, 보아라, 한 숫양이 개울 앞에 서 있었고, 두 뿔이 있었습니다. 그 뿔들은 높았는데, 그중 하나가 다른 것보다 더 높았고, 더 높은 뿔은 나중에 솟아올랐습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내’나 ‘강’일 수 있습니다. 히브리어 용어는 물길을 가리키며, 다니엘서에서는 아마도 수로를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 높은 것이 나중에 솟아올랐습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  english_pob_choice: Then I lifted up my eyes
  chosen_korean: 내가 눈을 들어 보니
  alternatives_korean:
  - 눈을 올려 보니
  - 눈을 들어 바라보니
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 환상 보고의 시각적 전환을 살리기 위해 ‘눈을 들어 보니’로 렌더링했습니다.
- source_word: וָאֶרְאֶה וְהִנֵּה
  english_pob_choice: and saw, and behold
  chosen_korean: 보아라
  alternatives_korean:
  - 그리고 보니
  - 그런데
  lexicon: HALOT
  rationale: הִנֵּה의 지시적·강조적 효과를 살리기 위해 단순한 접속어보다 ‘보아라’를 택해 장면의 돌연한 제시를 드러냈습니다.
- source_word: עֹמֵד לִפְנֵי הָאֻבָל
  english_pob_choice: was standing before the canal
  chosen_korean: 개울 앞에 서 있었고
  alternatives_korean:
  - 운하 앞에 서 있었고
  - 시내 앞에 서 있었고
  lexicon: HALOT
  rationale: אֻבָל은 다니엘서 문맥에서 수로/물길을 가리키므로, 영어의 ‘canal’에 맞추되 한국어에서는 과도하게 기술적인 ‘운하’보다 장면상 자연스러운 ‘개울’로 옮겼습니다.
- source_word: וְלוֹ קְרָנָיִם
  english_pob_choice: and it had two horns
  chosen_korean: 두 뿔이 있었습니다
  alternatives_korean:
  - 두 뿔을 가지고 있었습니다
  - 두 뿔이 달려 있었습니다
  lexicon: HALOT
  rationale: 소유구문을 한국어의 존재 표현으로 자연스럽게 풀어, 환상 속 형상의 묘사를 간결하게 전달했습니다.
- source_word: וְהַקְּרָנַיִם גְּבֹהוֹת ... וְהָאַחַת גְּבֹהָה מִן הַשֵּׁנִית
  english_pob_choice: The horns were high, but one was higher than the other
  chosen_korean: 그 뿔들은 높았는데, 그중 하나가 다른 것보다 더 높았고
  alternatives_korean:
  - 그 뿔들은 높았으나 하나가 둘째보다 더 높았고
  - 그 뿔들은 높았고 하나는 다른 것보다 더 컸습니다
  lexicon: HALOT
  rationale: 높이의 반복과 비교를 그대로 살려, 형체의 상대적 두드러짐을 시각적으로 유지했습니다.
- source_word: וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה
  english_pob_choice: and the higher one came up last
  chosen_korean: 더 높은 뿔은 나중에 솟아올랐습니다
  alternatives_korean:
  - 더 높은 뿔은 뒤에 올라왔습니다
  - 더 높은 뿔은 나중에 생겨났습니다
  lexicon: HALOT
  rationale: עֹלָה는 단순한 위치 이동보다 출현·발흥의 뉘앙스를 담을 수 있어 ‘솟아올랐습니다’로 옮겼고, בָּאַחֲרֹנָה의 시간 순서를 ‘나중에’로 분명히 했습니다.
theological_decisions:
- issue: 환상 속 상징 동물의 번역 범위
  chosen_reading: 주본문에서는 상징을 해설하지 않고 ‘숫양’과 ‘뿔’의 구체적 형상을 그대로 유지했습니다.
  alternative_readings:
  - 역사적 의미를 본문 안에 풀어 써서 번역하기
  - 상징적 의미를 암시하는 설명을 덧붙이기
  rationale: 이 절은 후속 문맥에서 해석되는 환상 묘사이므로, 본문 자체는 저자의 관찰을 최대한 보존하는 쪽이 소스 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
