id: DAN.8.12
reference: Daniel 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צָבָ֛א תִּנָּתֵ֥ן עַל הַ/תָּמִ֖יד בְּ/פָ֑שַׁע וְ/תַשְׁלֵ֤ךְ אֱמֶת֙ אַ֔רְצָ/ה וְ/עָשְׂתָ֖ה וְ/הִצְלִֽיחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/012.yaml
  text: And a host was given over with the regular burnt offering because of transgression[a]; and it cast truth to the ground[c][b], and it acted and prospered.
  footnotes:
  - marker: a
    text: Or 'the daily sacrifice' or 'the continual offering.' Hebrew tamid refers to the regular temple offering.
    reason: lexical_alternative
  - marker: b
    text: Or 'against the regular burnt offering' for the preposition linking 'host' and 'the regular burnt offering'; the Hebrew construction is difficult.
    reason: alternative_reading
  - marker: c
    text: The Hebrew verbs are feminine singular; the precise referent is compressed in the vision and may point to the hostile power symbolized in the preceding context.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 군대가 범죄 때문에 정규 번제와 함께[a][b] 넘겨졌습니다. 그것은 진리를 땅에 내던졌고[c], 행하고 성공을 거두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매일 드리는 제물’ 또는 ‘지속적인 제물’입니다. 히브리어 תָּמִיד는 성전에서 정기적으로 드리는 제사를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정규 번제에 맞서’로 옮길 수 있습니다. ‘군대’와 ‘정규 번제’를 연결하는 히브리어 전치사 구조는 해석하기 어렵습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 동사들은 여성 단수형입니다. 정확한 지시 대상은 환상에서 압축되어 있으며, 앞 문맥에서 상징된 적대적 권세를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְצָבָא
  english_pob_choice: a host
  chosen_korean: 한 군대
  alternatives_korean:
  - 군대
  - 한 무리
  - 군대 한 떼
  lexicon: HALOT
  rationale: צָבָא는 군사적 ‘군대’일 수도 있고 집합적 ‘군대/부대’일 수도 있어, 한국어에서는 ‘한 군대’로 두 의미를 과도하게 좁히지 않았습니다.
- source_word: תִּנָּתֵן
  english_pob_choice: was given over
  chosen_korean: 넘겨졌습니다
  alternatives_korean:
  - 주어졌습니다
  - 내주어졌습니다
  - 전달되었습니다
  lexicon: HALOT
  rationale: 수동형 נתן의 ‘주어지다’보다, 적대적 문맥에서 ‘넘겨지다’가 권세 아래로 넘겨진 뉘앙스를 더 잘 드러냅니다.
- source_word: הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 정규 번제
  alternatives_korean:
  - 매일 드리는 제물
  - 항상 드리는 제물
  - 지속적인 번제
  lexicon: HALOT
  rationale: תמיד는 성전의 정기적/지속적 제사를 가리키므로, 전통적이지만 모호할 수 있는 표현보다 ‘정규 번제’로 cultic 의미를 분명히 했습니다.
- source_word: אֱמֶת
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 진실
  - 참된 것
  lexicon: HALOT
  rationale: 이 묵시적 문맥에서는 단순한 사실정보보다 하나님께 속한 참됨과 올바름의 차원을 포함하는 ‘진리’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘그것’의 지시 대상과 여성형 동사의 압축성
  chosen_reading: 동사의 주어를 특정하지 않고 ‘그것’으로 두어, 본문이 의도적으로 압축한 지시 대상을 열어 두었습니다.
  alternative_readings:
  - 그가 진리를 땅에 내던졌고
  - 뿔이 진리를 땅에 내던졌고
  rationale: 히브리어는 여성 단수 동사를 사용해 직접적인 남성 인칭 참조와 불일치를 보이므로, 한국어도 해석을 단정하지 않고 모호성을 보존했습니다.
  doctrine_reference: 본문의 압축된 상징성과 해석상 긴장을 유지합니다.
- issue: בְּפָשַׁע의 관계
  chosen_reading: ‘범죄 때문에’로 옮겨, 전치사가 나타내는 원인 또는 상황을 열어 두었습니다.
  alternative_readings:
  - 범죄 가운데
  - 범죄로 말미암아
  - 반역으로 인해
  rationale: 문맥상 원인적 용법이 자연스럽지만, 누가 범죄했는지와 정확한 관계는 본문이 응축해 두므로 지나치게 특정하지 않았습니다.
  doctrine_reference: 원문 우선의 해석 절제를 따릅니다.
