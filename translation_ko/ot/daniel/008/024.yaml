id: DAN.8.24
reference: Daniel 8:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָצַ֤ם כֹּח/וֹ֙ וְ/לֹ֣א בְ/כֹח֔/וֹ וְ/נִפְלָא֥וֹת יַשְׁחִ֖ית וְ/הִצְלִ֣יחַ וְ/עָשָׂ֑ה וְ/הִשְׁחִ֥ית עֲצוּמִ֖ים וְ/עַם קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/024.yaml
  text: His power will become strong[a], but not by his own power. He will bring about extraordinary destruction, and he will succeed and act; he will destroy the mighty and the people of the holy ones.
  footnotes:
  - marker: a
    text: Or, 'the holy people' or 'the people of the saints.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 힘이 강해질 것입니다. 그러나 자기 힘으로는 아닙니다. 그는 놀라운 파괴를 일으키고 성공하고 행할 것이며, 강한 자들과 거룩한 이들의 백성[a]을 멸할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 백성’ 또는 ‘성도들의 백성’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָצַם כֹּחוֹ
  english_pob_choice: His power will become strong
  chosen_korean: 그의 힘이 강해질 것입니다
  alternatives_korean:
  - 그의 힘이 강대해질 것입니다
  - 그의 능력이 강해질 것입니다
  lexicon: HALOT
  rationale: עָצַם과 כֹּחַ의 결합은 ‘힘이 강해지다/강대해지다’의 점증을 나타내므로, 동사형으로 바꾸어 원문의 상태 변화와 힘의 상승을 살렸습니다.
- source_word: וְלֹא בְכֹחוֹ
  english_pob_choice: but not by his own power
  chosen_korean: 그러나 자기 힘으로는 아닙니다
  alternatives_korean:
  - 그러나 자기의 능력으로는 아닙니다
  - 그러나 그 자신의 힘으로는 아닙니다
  lexicon: HALOT
  rationale: בְּ는 수단을 나타내므로 ‘~으로’로 옮기되, 대조를 분명히 하기 위해 ‘자기 힘’으로 자연스럽게 표현했습니다.
- source_word: וְנִפְלָאוֹת יַשְׁחִית
  english_pob_choice: He will bring about extraordinary destruction
  chosen_korean: 그는 놀라운 파괴를 일으키고
  alternatives_korean:
  - 그는 놀랍도록 파괴할 것이며
  - 그는 기이한 파괴를 가져올 것이며
  lexicon: HALOT
  rationale: נִפְלָאוֹת는 문자적으로 ‘놀라운/기이한 것들’이지만, שׁחת와 결합할 때는 ‘놀라운 파괴’라는 충격적 효과를 지니므로 그 긴장을 살려 번역했습니다.
- source_word: וְעַם קְדֹשִׁים
  english_pob_choice: the people of the holy ones
  chosen_korean: 거룩한 이들의 백성
  alternatives_korean:
  - 성도들의 백성
  - 거룩한 백성
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘거룩한 이들’과 소유/관계 구조를 유지하면서도, 한국어에서 어색하지 않도록 ‘백성’과 자연스럽게 연결했습니다.
theological_decisions:
- issue: וְעַם קְדֹשִׁים의 지시 대상과 해석의 긴장
  chosen_reading: 본문은 ‘거룩한 이들의 백성’으로 두어, 성도 공동체를 가리키는 전통적 이해와 더 직역적인 ‘거룩한 이들’의 다의성을 함께 열어 둡니다.
  alternative_readings:
  - 성도들의 백성
  - 거룩한 백성
  - 거룩한 자들의 백성
  rationale: 다니엘서의 ‘거룩한 이들’은 하늘의 거룩한 존재들을 가리키거나 하나님의 백성을 지칭할 수 있어, 본문이 지닌 해석의 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
