  to: 그의 힘이 강해질 것입니다. 그러나 자기 힘으로는 아닙니다. 그는 놀라운 파괴를 일으키고 성공하고 행할 것이며, 강한 자들과 거룩한 이들의 백성[a]을 멸할 것입니다.
