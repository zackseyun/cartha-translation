  source_fidelity: 히브리어의 점진적 표현(‘그의 힘이 강해질 것입니다’), 수단의 부정(‘자기 힘으로는 아닙니다’), 파괴·성공·행동의 연속, 그리고 ‘거룩한 이들의 백성’이라는 직역적 구성은 대체로 충실합니다. 다만 대안 독법을 설명하는 각주 표지가 첫 절에 붙어 있어, 실제로 해당하는 וְעַם קְדֹשִׁים에 옮겨야 합니다.
  naturalness: ‘성공하여 행동할 것이며’는 한국어에서 다소 부자연스럽습니다. ‘성공하고 행할 것이며’가 원문의 넓은 עָשָׂה를 과도하게 보충하지 않으면서 더 자연스럽습니다.
  terminology: ‘거룩한 이들의 백성’은 다소 낯선 표현이지만, קְדֹשִׁים의 복수 및 구성 관계에 관한 본문의 긴장을 보존하는 안전한 번역입니다. 각주의 ‘성도들의 백성’과 ‘거룩한 백성’은 대안으로 유지할 수 있습니다.
