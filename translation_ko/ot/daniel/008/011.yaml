  verdict: revise
  source_fidelity: 히브리어 עַד의 도달 범위, שַׂר הַצָּבָא의 칭호, מִמֶּנּוּ의 남성 단수 대명사와 그 선행사의 모호성, 그리고 מְכוֹן의 ‘터/기초’ 범위는 대체로 잘 보존되었습니다. 그러나 הַתָּמִיד은 문맥상 정기적·지속적인 성전 제의를 가리키며, 본문의 ‘매일 드리는 제사’는 ‘매일’이라는 시간 빈도를 본문보다 더 구체화합니다. ‘정기 제사’가 영어 POB의 regular offering 및 히브리어의 생략된 제의 표현을 더 충실히 반영합니다.
  naturalness: ‘스스로를 크게 하였다’는 뜻은 전달하지만 현대 표준어에서는 다소 직역투입니다. ‘자신을 높였습니다’가 교만한 자기 고양의 문맥을 자연스럽고 분명하게 전달합니다. 또한 성소의 물리적 장소를 나타내는 מְכוֹן에는 ‘자리’보다 ‘터’가 더 자연스럽습니다.
  terminology: ‘군대의 방백’은 שַׂר הַצָּבָא의 높임 칭호를 보존하고 지시 대상을 특정하지 않으므로 유지할 수 있습니다. ‘정기 제사’는 상번제라는 교단적·전통적 특정화 없이 הַתָּמִיד의 정규적 제의 의미를 유지합니다. ‘성소의 터’는 מְכוֹן의 장소성에 적합하며, ‘기초’ 가능성은 각주에 남깁니다.
