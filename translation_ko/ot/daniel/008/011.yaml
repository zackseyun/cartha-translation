id: DAN.8.11
reference: Daniel 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַ֥ד שַֽׂר הַ/צָּבָ֖א הִגְדִּ֑יל וּ/מִמֶּ֨/נּוּ֙ הרים הַ/תָּמִ֔יד וְ/הֻשְׁלַ֖ךְ מְכ֥וֹן מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/011.yaml
  text: It even magnified itself up to the Prince of the host[a], and from him the regular offering was taken away[c][b], and the place of his sanctuary was cast down.
  footnotes:
  - marker: a
    text: Or 'the continual offering' or 'the daily offering'; in temple context הַתָּמִיד refers to the regular ongoing sacrificial service, traditionally understood as the regular burnt offering.
    reason: lexical_alternative
  - marker: b
    text: '''From him'' follows the Hebrew pronoun literally; the antecedent is debated.'
    reason: alternative_reading
  - marker: c
    text: Or 'the foundation of his sanctuary was cast down.' The Hebrew word may denote 'place/site' or 'foundation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 군대의 방백에게까지 자신을 높였고, 그에게서 정기 제사[a][b]가 걷어졌으며, 그의 성소의 터[c]가 무너졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘항상 드리는 제사’, ‘날마다 드리는 제사’. 성전 문맥에서 הַתָּמִיד은 반복적으로 드려지는 정규 제사를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그에게서’는 히브리어 대명사를 직역한 것으로, 그 선행사는 논의 중입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘기초’. 히브리어 מְכוֹן은 ‘자리, 터, 기초’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד
  english_pob_choice: even ... up to
  chosen_korean: …에게까지
  alternatives_korean:
  - 그리고 …까지
  - …에 이르기까지
  lexicon: HALOT
  rationale: עַד의 도달 범위를 살리면서 문맥의 상승적·과장적 뉘앙스를 자연스럽게 반영했습니다.
- source_word: שַׂר הַצָּבָא
  english_pob_choice: the Prince of the host
  chosen_korean: 군대의 방백
  alternatives_korean:
  - 군대의 통치자
  - 군대의 대장
  lexicon: HALOT
  rationale: שַׂר는 ‘방백/통치자/지휘관’ 범위가 있으므로, 위격을 즉시 특정하지 않으면서도 격조를 살린 ‘방백’을 택했습니다.
- source_word: הִגְדִּיל
  english_pob_choice: magnified itself
  chosen_korean: 스스로를 크게 하였고
  alternatives_korean:
  - 자기를 높였고
  - 스스로 크게 하였고
  lexicon: HALOT
  rationale: 문맥상 교만한 자기 과장을 나타내므로 반사적 의미를 드러내는 표현으로 옮겼습니다.
- source_word: הַתָּמִיד
  english_pob_choice: the regular offering
  chosen_korean: 매일 드리는 제사
  alternatives_korean:
  - 정기 제사
  - 상번제
  lexicon: HALOT
  rationale: 성전 문맥에서의 тұрақ적인 제의 행위를 가리키는 말이므로, 전통어인 ‘상번제’ 대신 의미를 드러내는 표현을 사용하되, 본문 의미의 반복성과 규칙성을 유지했습니다.
- source_word: וְהֻשְׁלַךְ מְכוֹן מִקְדָּשׁוֹ
  english_pob_choice: and the place of his sanctuary was cast down
  chosen_korean: 그의 성소의 자리[c]가 무너졌습니다
  alternatives_korean:
  - 그의 성소의 터가 무너졌습니다
  - 그의 성소의 기초가 무너졌습니다
  lexicon: HALOT
  rationale: מְכוֹן은 ‘자리/터/기초’가 가능하므로, 장소성에 무게를 두되 ‘무너졌다’로 파괴적 이미지를 살렸습니다.
theological_decisions:
- issue: ‘군대의 방백’의 지시 대상을 본문에서 확정할지 여부
  chosen_reading: 본문에서는 위격을 특정하지 않고 직역적으로 유지했습니다.
  alternative_readings:
  - 하늘 군대의 지휘관
  - 하나님 자신
  - 대제사장으로 보는 역사적 해석
  - 메시아로 보는 해석
  rationale: 히브리어는 격조 높은 칭호를 사용하지만, 본문 자체만으로는 지시 대상을 단정하지 않으므로 해석의 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 보존하고 해소하지 않는다.'
- issue: ‘그에게서’의 선행사 모호성
  chosen_reading: ‘그에게서’로 그대로 두어 선행사 논쟁을 열어 두었습니다.
  alternative_readings:
  - ‘그것에게서’로 군대를 가리키는 해석
  - 의미상 무인칭으로 처리
  rationale: 히브리어 인칭 접미사는 문맥상 여러 선행사를 허용하므로, 본문이 가진 모호성을 그대로 유지했습니다.
  doctrine_reference: '번역 원칙 §3: 신학적 긴장을 보존하고 해소하지 않는다.'
