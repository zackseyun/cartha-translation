revisions:
- from: 그리고 그들의 왕국의 마지막 때에, 반역자들이 자기 몫을 채울 때, 한 왕이 일어날 것입니다. 그는 얼굴이 강하고 수수께끼를 이해합니다.[a]
  to: 그리고 그들의 왕국의 마지막 무렵, 반역자들의 죄악이 극에 달할 때, 얼굴이 사납고 수수께끼를 이해하는 한 왕이 일어날 것입니다.
  rationale: 원문의 시간적 배경, 반역의 충만, 왕의 출현, 그리고 그의 사나운 태도와 חִידוֹת에 대한 이해를 보존했습니다. ‘수수께끼를 이해하는’은 히브리어의 직접적 표현을 유지하며, 이를 ‘모략에 능한’으로 좁혀 해석하지 않습니다. 본문이 그 직역을 채택하므로 중복된 어휘 대안 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:55Z'
review_pass:
  verdict: revise
  source_fidelity: ‘얼굴이 강하고’는 히브리어 관용구 עַז פָּנִים의 적대적·강퍅한 뉘앙스를 한국어에서 자연스럽게 전달하지 못합니다. 또한 ‘자기 몫을 채울 때’의 ‘자기 몫’은 원문에 없는 개인적 할당의 뜻을 불필요하게 불러일으킵니다. ‘반역자들의 죄악이 극에 달할 때’는 완료/충만의 문맥적 의미를 자연스럽게 드러냅니다. חִידוֹת는 본문에서 ‘수수께끼’로 직접 옮겨, 정치적 모략으로 한정하지 않았습니다.
  naturalness: 한 문장 안에서 왕의 출현과 그 특징을 연결하고, ‘얼굴이 사납고’ 및 ‘수수께끼를 이해하는’으로 현대 표준 한국어의 자연스러운 문장을 만들었습니다. ‘마지막 때’보다 ‘마지막 무렵’이 אַחֲרִית의 기간적 의미에도 더 잘 맞습니다.
  terminology: ‘왕국’, ‘반역자들’, ‘왕’은 원문의 기본 어휘와 격식 있는 성경 문체에 부합합니다. ‘반역자들의 죄악’은 פשׁע의 반역적·도덕적 의미를 드러내되 특정 교리 해석을 강요하지 않습니다.
  issues:
  - severity: medium
    issue: ‘자기 몫을 채울 때’
    rationale: 히브리어의 완료/충만 표현을 개인에게 배정된 ‘몫’으로 들리게 하며, 한국어 관용상도 부자연스럽습니다.
  - severity: medium
    issue: ‘얼굴이 강하고’
    rationale: 원문의 ‘강한/사나운 얼굴’ 관용구를 지나치게 직역하여 한국어에서 의미가 불명확합니다.
  - severity: low
    issue: 각주가 본문의 동일한 표현을 대안으로 반복함
    rationale: 본문이 이미 ‘수수께끼를 이해하는’이라는 직역을 채택했으므로, 동일한 표현을 다시 제시하는 각주는 유익한 어휘 대안을 제공하지 못합니다.
  revised_text: 그리고 그들의 왕국의 마지막 무렵, 반역자들의 죄악이 극에 달할 때, 얼굴이 사납고 수수께끼를 이해하는 한 왕이 일어날 것입니다.
