  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/בְ/אַחֲרִית֙ מַלְכוּתָ֔/ם כְּ/הָתֵ֖ם הַ/פֹּשְׁעִ֑ים יַעֲמֹ֛ד מֶ֥לֶךְ עַז פָּנִ֖ים וּ/מֵבִ֥ין חִידֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/023.yaml
  text: And at the latter end of their kingdom[a], when the transgressors have reached their full measure, a king will arise, fierce in countenance and skilled in intrigue.
  footnotes:
  - marker: a
    text: Or, 'and understanding riddles' or 'and understanding dark sayings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 왕국의 마지막 때에, 반역자들이 자기 몫을 채울 때, 한 왕이 일어날 것입니다. 그는 얼굴이 강하고 수수께끼를 이해합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수수께끼들을 이해하는’ 혹은 ‘어두운 말을 이해하는’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחֲרִית
  english_pob_choice: And at the latter end of
  chosen_korean: 그리고 ...의 마지막 때에
  alternatives_korean:
  - 그리고 ...의 끝에
  - 그리고 ...의 말기에
  lexicon: HALOT
  rationale: אַחֲרִית는 한 기간의 마지막 부분을 가리키므로, ‘마지막 때에’로 시간적 종결을 자연스럽게 살렸습니다.
- source_word: מַלְכוּתָם
  english_pob_choice: their kingdom
  chosen_korean: 그들의 왕국
  alternatives_korean:
  - 그들의 통치
  - 그들의 나라
  - 그들의 왕권
  lexicon: HALOT
  rationale: 단수형 명사에 3인칭 복수 소유격이 붙은 형태이므로, 복수의 ‘왕국들’이 아니라 집합적으로 ‘그들의 왕국’이 적절합니다.
- source_word: עַז פָּנִים
  english_pob_choice: fierce in countenance
  chosen_korean: 얼굴이 강하고
  alternatives_korean:
  - 강한 얼굴을 하고
  - 사납게 생기고
  - 대담한 표정을 하고
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴이 강한’이라는 얼굴 관용구이므로, 외모와 태도의 कठ함을 살려 ‘얼굴이 강하고’로 옮겼습니다.
- source_word: וּמֵבִין חִידוֹת
  english_pob_choice: understanding riddles
  chosen_korean: 수수께끼를 이해합니다
  alternatives_korean:
  - 수수께끼들을 풉니다
  - 숨은 말을 압니다
  - 모략에 능합니다
  lexicon: HALOT
  rationale: חִידוֹת은 문자적으로 수수께끼/어두운 말을 뜻하므로, 본문을 따라 직접적으로 번역하되, 정치적 간교함으로 좁혀 해석하지는 않았습니다.
theological_decisions:
- issue: וּמֵבִין חִידוֹת의 해석 폭
  chosen_reading: 본절은 단순한 지적 능력뿐 아니라, 모호하고 은밀한 것을 꿰뚫는 왕의 성격을 묘사한다고 보되, 본문 차원의 직접 표현은 유지했습니다.
  alternative_readings:
  - 모략에 능한
  - 간교함을 아는
  - 수수께끼를 푸는
  rationale: 문맥상 적대적 왕의 성품을 드러내지만, 히브리어 자체는 ‘수수께끼를 이해함’까지도 허용하므로 해석을 앞서지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: 본문의 긴장과 폭을 보존한다.'
