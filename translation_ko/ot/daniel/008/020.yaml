translation:
  language: ko
  text: 네가 본 그 숫양, 곧 두 뿔 가진 그 숫양은 메대와 바사의 왕들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네가 본 그 숫양, 곧 두 뿔의 소유자[는] 메대와 바사의 왕들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  english_pob_choice: the ram
  chosen_korean: 숫양
  alternatives_korean:
  - 수양
  - 산양
  lexicon: HALOT
  rationale: 비전의 상징 동물로서 אַיִל은 ‘숫양’이 가장 자연스럽고 정확합니다.
- source_word: אֲשֶׁר רָאִיתָ
  english_pob_choice: that you saw
  chosen_korean: 네가 본
  alternatives_korean:
  - 네가 보았던
  - 네가 보신
  lexicon: HALOT
  rationale: 예언적 환상 설명의 현재 독자에게는 간결한 과거형 ‘본’이 가장 자연스럽습니다.
- source_word: בַּעַל הַקְּרָנַיִם
  english_pob_choice: the one with the two horns
  chosen_korean: 두 뿔 가진 그
  alternatives_korean:
  - 두 뿔을 가진
  - 두 뿔의 소유자인
  lexicon: HALOT
  rationale: בַּעַל은 직역하면 ‘소유자’지만 이 관용적 구성에서는 ‘~을 가진’이 의미를 정확하고 자연스럽게 드러냅니다.
- source_word: מַלְכֵי מָדַי וּפָרָס
  english_pob_choice: the kings of Media and Persia
  chosen_korean: 메대와 바사의 왕들
  alternatives_korean:
  - 메디아와 페르시아의 왕들
  - 메대와 페르시아의 왕들
  lexicon: HALOT
  rationale: 복수 명사 מַלְכֵי를 살려 ‘왕들’로 옮겼고, 고유명사는 통용되는 성경적 음역인 메대/바사를 유지했습니다.
theological_decisions:
- issue: 문장 관계를 한국어에서 어떻게 드러낼지
  chosen_reading: 숫양의 상징이 메대와 바사의 왕들을 가리킨다는 관계를 ‘~은 …입니다’로 직접 식별했습니다.
  alternative_readings:
  - ~은 …을 대표합니다
  - ~은 …를 뜻합니다
  rationale: 히브리어는 계사 없는 명사구지만, 해설적 환상 문맥에서는 한국어가 식별 관계를 분명히 해야 하므로 직설적 동일시로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; symbolic identification in interpretive vision speech.'
