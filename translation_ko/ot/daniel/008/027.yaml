revisions:
- from: 나, 다니엘은 며칠 동안 기진맥진하고 병들었습니다. 그런 다음 일어나 왕의 일을 하였지만, 그 환상에 충격을 받았고, 그것을 이해하는 사람이 없었습니다.[a]
  to: 나 다니엘은 기력이 다하여 여러 날 앓았습니다. 그 뒤에 일어나 왕의 일을 하였지만, 그 환상 때문에 경악했고, 아무도 그것을 이해하지 못했습니다.[a]
  rationale: 탈진과 병환의 관계를 더 자연스러운 한국어로 표현하고, 마지막 절의 목적어를 밝혀 문장을 명료하게 했습니다. 본문의 주어가 불분명한 마지막 표현은 비인칭적 본문 번역과 개인적 대안 독해를 각주로 병존시켜 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:49:46Z'
