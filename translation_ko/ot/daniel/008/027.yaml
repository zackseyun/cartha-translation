  source_fidelity: ‘기진맥진하고 병들었습니다’는 대체로 뜻을 전달하지만, 첫 동사의 결과적 탈진과 뒤따르는 병환의 기간을 더 자연스럽고 정확하게 연결할 수 있습니다. 마지막 절의 비인칭적 독해는 본문과 영어 감사 기록에 부합하며, 대안 독해는 각주로 보존해야 합니다.
  naturalness: ‘기력이 다하여 여러 날 앓았습니다’가 현대 표준어 합쇼체에서 더 매끄럽고, ‘그 환상 때문에 경악했지만’은 환상이 준 강한 충격과 뒤의 대조를 자연스럽게 드러냅니다. 목적어 ‘그것을’을 보충하면 마지막 문장이 명료해집니다.
  terminology: ‘환상’은 מַרְאֶה의 다니엘서 문맥에 적절합니다. ‘왕의 일’도 מְלֶאכֶת הַמֶּלֶךְ를 불필요하게 구체화하지 않는 충실한 표현입니다.
