id: DAN.8.27
reference: Daniel 8:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֣י דָנִיֵּ֗אל נִהְיֵ֤יתִי וְ/נֶֽחֱלֵ֨יתִי֙ יָמִ֔ים וָ/אָק֕וּם וָ/אֶֽעֱשֶׂ֖ה אֶת מְלֶ֣אכֶת הַ/מֶּ֑לֶךְ וָ/אֶשְׁתּוֹמֵ֥ם עַל הַ/מַּרְאֶ֖ה וְ/אֵ֥ין מֵבִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/027.yaml
  text: And I[a], Daniel, was overcome and was sick for days. Then I rose and did the king’s work, but I was appalled by the vision, and there was no one who understood it.
  footnotes:
  - marker: a
    text: Or, 'but I did not understand it.' The Hebrew expression is terse and may be taken either impersonally ('there was no one who understood it') or personally of Daniel himself.
    reason: alternative_reading
translation:
  language: ko
  text: 나, 다니엘은 며칠 동안 기진맥진하고 병들었습니다. 그런 다음 일어나 왕의 일을 하였지만, 그 환상에 충격을 받았고, 그것을 이해하는 사람이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 그것을 이해하지 못했습니다.’ 히브리어 표현이 매우 간결하여, 비인칭적으로도, 다니엘 자신에 대한 말로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נִהְיֵיתִי
  english_pob_choice: was overcome
  chosen_korean: 기진맥진하고
  alternatives_korean:
  - 기진한
  - 탈진하고
  - 쓰러져
  lexicon: HALOT
  rationale: 결과 상태로서의 심한 소진과 압도됨을 자연스럽게 드러내기 위해 ‘기진맥진하고’를 택했습니다.
- source_word: נֶחֱלֵיתִי
  english_pob_choice: was sick
  chosen_korean: 병들었습니다
  alternatives_korean:
  - 아팠습니다
  - 병이 났습니다
  - 쇠약해졌습니다
  lexicon: HALOT
  rationale: נחל의 니팔이 보이는 ‘병듦’의 상태를 현대 한국어로 가장 직접적으로 옮겼습니다.
- source_word: וְאֵין מֵבִין
  english_pob_choice: there was no one who understood it
  chosen_korean: 이해하는 사람이 없었습니다
  alternatives_korean:
  - 제가 이해하지 못했습니다
  - 이해하는 이가 없었습니다
  - 아무도 이해하지 못했습니다
  lexicon: HALOT
  rationale: 히브리어의 주어가 생략된 간결한 표현을 따라, 인칭을 단정하지 않는 비인칭적 해석을 한국어로 자연스럽게 풀었습니다.
- source_word: הַמַּרְאֶה
  english_pob_choice: the vision
  chosen_korean: 그 환상
  alternatives_korean:
  - 그 이상
  - 그 보이는 것
  - 그것
  lexicon: HALOT
  rationale: 다니엘서 문맥에서의 계시적 시각을 반영하여 ‘환상’으로 옮겼습니다.
theological_decisions:
- issue: וְאֵין מֵבִין의 주어 해석
  chosen_reading: 비인칭적으로 ‘이해하는 사람이 없었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘제가 이해하지 못했습니다’라는 개인적 해석
  - ‘아무도 이해하지 못했습니다’라는 보다 명시적 비인칭 해석
  rationale: 마소라 본문은 명시적 1인칭 주어를 두지 않으므로, 원문의 간결함을 보존하는 방향을 택했습니다. 다만 문맥상 다니엘 자신의 이해 부족으로도 읽힐 수 있는 긴장은 그대로 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
