id: DAN.8.2
reference: Daniel 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אֶרְאֶה֮ בֶּ/חָזוֹן֒ וַ/יְהִי֙ בִּ/רְאֹתִ֔/י וַ/אֲנִי֙ בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֔ה אֲשֶׁ֖ר בְּ/עֵילָ֣ם הַ/מְּדִינָ֑ה וָ/אֶרְאֶה֙ בֶּֽ/חָז֔וֹן וַ/אֲנִ֥י הָיִ֖יתִי עַל אוּבַ֥ל אוּלָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/002.yaml
  text: And I saw in the vision[a], and when I saw, I was in Susa the citadel, which is in the province of Elam; and I saw in the vision that I was beside the Ulai Canal.
  footnotes:
  - marker: a
    text: Or 'river Ulai' or 'stream Ulai.' The Hebrew term for the watercourse can be rendered more broadly, but 'Canal' best fits the likely setting near Susa.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 환상 속에서 보았는데, 보게 되었을 때 나는 엘람 지방에 있는 수사의 요새에 있었으며, 내가 또 환상 속에서 보니 내가 울라이 강가에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 אוּבַל은 수로, 하천, 운하를 모두 가리킬 수 있으나, 수사의 지리적 맥락에서는 '강가'가 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה / בֶּחָזוֹן
  english_pob_choice: And I saw in the vision
  chosen_korean: 환상 속에서 보았습니다
  alternatives_korean:
  - 환상 가운데 보았습니다
  - 환상을 보았습니다
  lexicon: HALOT
  rationale: ראה의 반복은 예언적 시야를 가리키므로, 두 차례의 '보았다'를 살리면서 '환상 속에서'로 비현실적 시야임을 분명히 했습니다.
- source_word: שׁוּשַׁן הַבִּירָה
  english_pob_choice: Susa the citadel
  chosen_korean: 수사의 요새
  alternatives_korean:
  - 수사의 성채
  - 수사의 궁성
  lexicon: HALOT
  rationale: בִּירָה는 왕궁 전체보다 요새화된 중심지를 가리키므로, '요새'를 택해 방어적·행정적 함의를 함께 살렸습니다.
- source_word: עֵילָם הַמְּדִינָה
  english_pob_choice: the province of Elam
  chosen_korean: 엘람 지방
  alternatives_korean:
  - 엘람 주
  - 엘람 관구
  lexicon: HALOT
  rationale: הַמְּדִינָה는 행정 구획을 뜻하므로, 현대 한국어에서 자연스러운 '지방'으로 옮겼습니다.
- source_word: עַל אוּבַל אוּלָי
  english_pob_choice: beside the Ulai Canal
  chosen_korean: 울라이 강가에
  alternatives_korean:
  - 울라이 운하 곁에
  - 울라이 개천가에
  lexicon: HALOT
  rationale: עַל은 물길 옆의 위치를 나타내며, אוּבַל은 수로·수로변을 가리킬 수 있어 지리적 자연성을 살린 '강가'로 옮겼습니다. 고유명사 울라이는 음역했습니다.
theological_decisions:
- issue: 첫 문장의 반복되는 '보았다'와 '환상'의 관계
  chosen_reading: 환상 체험의 반복적 시각 묘사를 그대로 살려, 본문이 두 번의 '보았다'를 통해 예언적 인식을 강조한다고 보았습니다.
  alternative_readings:
  - 첫 '보았다'를 하나로 줄여 매끈하게 만드는 읽기
  - '''환상 가운데''를 단순 배경표현으로 약화시키는 읽기'
  rationale: 히브리어 본문은 반복을 통해 체험의 전환과 장면 전환을 강조하므로, 이를 완화하지 않고 보존했습니다.
  doctrine_reference: 예언서의 서술 반복과 시각적 계시 강조
