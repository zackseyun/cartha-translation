source:
  edition: WLC
  text: וְ/הַ֨/נִּשְׁבֶּ֔רֶת וַ/תַּֽעֲמֹ֥דְנָה אַרְבַּ֖ע תַּחְתֶּ֑י/הָ אַרְבַּ֧ע מַלְכֻי֛וֹת מִ/גּ֥וֹי יַעֲמֹ֖דְנָה וְ/לֹ֥א בְ/כֹחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/022.yaml
  text: 'And as for the broken horn[a], in whose place four arose: four kingdoms will arise from that nation, but not with its power.'
  footnotes:
  - marker: a
    text: Or, 'but not with his power,' referring to the power of the first king represented by the broken horn.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 부러진 뿔[a]에 대해서 말하자면, 그 자리에 네 개가 일어났습니다. 그 나라에서 네 왕국이 일어날 것이나, 그 힘으로 되는 것은 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 힘으로 되는 것은 아닙니다’로도 옮길 수 있습니다. 여기서는 부러진 뿔이 상징하는 원래의 권세를 가리키는 것으로 읽었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁבֶּרֶת
  english_pob_choice: as for the broken horn
  chosen_korean: 부러진 뿔에 대해서 말하자면
  alternatives_korean:
  - 부러진 것에 대해서 말하자면
  - 부러진 뿔은
  lexicon: HALOT
  rationale: 여성형 분사에 해당하는 ‘부러진’이 앞선 ‘뿔’을 가리키므로, 한국어에서는 암시된 명사를 살려 ‘뿔’로 분명하게 옮겼습니다. ‘그리고 …에 대해서 말하자면’은 해석적 전환을 자연스럽게 드러냅니다.
- source_word: וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ
  english_pob_choice: in whose place four arose
  chosen_korean: 그 자리에 네 개가 일어났습니다
  alternatives_korean:
  - 그 자리에 네 개가 섰습니다
  - 그 자리를 대신하여 네 개가 일어났습니다
  lexicon: HALOT
  rationale: ‘일어나다’는 여기서 출현·등장을 뜻하는 정치적 표현에 가깝기 때문에, 예언 문맥에 맞게 옮겼습니다. ‘그 자리에’는 대체 관계를 간결하게 살립니다.
- source_word: אַרְבַּע מַלְכֻיּוֹת
  english_pob_choice: four kingdoms
  chosen_korean: 네 왕국
  alternatives_korean:
  - 네 나라
  - 네 통치권
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 네 명의 왕보다 후속 정치체들을 가리키므로 ‘왕국’이 가장 자연스럽습니다.
- source_word: וְלֹא בְכֹחוֹ
  english_pob_choice: but not with its power
  chosen_korean: 그 힘으로 되는 것은 아닙니다
  alternatives_korean:
  - 그 힘으로는 아닙니다
  - 그의 힘으로 되는 것은 아닙니다
  lexicon: HALOT
  rationale: כֹּחַ는 ‘힘/능력’의 뜻이므로 직역하되, 한국어에서는 결과적 부정을 자연스럽게 풀어 ‘되는 것은 아닙니다’로 옮겼습니다. 대명사는 상징적 지시를 살려 ‘그’로 처리했습니다.
theological_decisions:
- issue: 마지막 소유격 대명사의 지시 대상
  chosen_reading: 마지막 ‘그’는 부러진 뿔이 상징하는 원래의 권세를 가리키는 상징적 지시로 처리했습니다.
  alternative_readings:
  - 첫째 왕(알렉산더)을 가리키는 ‘그의 힘’
  rationale: 이 절은 상징과 역사적 실재가 겹치는 해석 구절이므로, 본문에서는 상징적 지시를 유지하고 대안 독해는 각주로 보존하는 편이 더 투명합니다.
  doctrine_reference: 해석학적 선택; 교리 쟁점 아님
