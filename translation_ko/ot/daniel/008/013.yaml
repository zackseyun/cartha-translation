id: DAN.8.13
reference: Daniel 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁמְעָ֥/ה אֶֽחָד קָד֖וֹשׁ מְדַבֵּ֑ר וַ/יֹּאמֶר֩ אֶחָ֨ד קָד֜וֹשׁ לַ/פַּֽלְמוֹנִ֣י הַֽ/מְדַבֵּ֗ר עַד מָתַ֞י הֶ/חָז֤וֹן הַ/תָּמִיד֙ וְ/הַ/פֶּ֣שַׁע שֹׁמֵ֔ם תֵּ֛ת וְ/קֹ֥דֶשׁ וְ/צָבָ֖א מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/013.yaml
  text: Then I heard a holy one speaking[a], and one holy one said to the one speaking, “How long is the vision concerning the regular burnt offering and the desolating transgression[d][c][b], and the giving over of both the sanctuary and the host to be trampled?”
  footnotes:
  - marker: a
    text: Or possibly, 'to Palmoni, the one speaking,' if לַפַּלְמוֹנִי is taken as a proper name or title rather than an indefinite expression.
    reason: alternative_reading
  - marker: b
    text: Traditionally, 'the daily sacrifice.' The Hebrew תָּמִיד refers to the regular continual offering in the temple service.
    reason: lexical_alternative
  - marker: c
    text: Or 'the transgression that desolates.'
    reason: lexical_alternative
  - marker: d
    text: '''Host'' may refer to the people associated with the sanctuary, an army, or another collective force; the Hebrew is not fully specific here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 한 거룩한 자가 말하는 것을 들었고, 또 다른 거룩한 자가 그 말하는 이에게 말하였습니다. “그 환상과, 정규 번제와 황폐하게 하는 범죄, 그리고 성소와 군대가 짓밟히도록 내어주는 일이 언제까지입니까?”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 말하는 이’는 לַפַּלְמוֹנִי를 고유명사로 확정하지 않고, 불분명한 지시 대상을 보존한 번역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘정규 번제’는 전통적 ‘매일 제사’보다 תָּמִיד의 계속되는 제의적 성격을 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘황폐하게 하는 범죄’는 ‘황폐하게 하는 반역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘군대’는 כאן의 צָבָא가 성소와 연관된 집단, 군사력, 혹은 백성을 가리킬 수 있는 넓은 뜻을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדוֹשׁ
  english_pob_choice: holy one
  chosen_korean: 거룩한 자
  alternatives_korean:
  - 거룩한 이
  - 성인
  lexicon: HALOT
  rationale: 비전 문맥에서 형용사가 명사처럼 쓰인 표현이므로, 교회적 의미의 ‘성인’을 피하고 존재를 드러내는 ‘거룩한 자’로 옮겼습니다.
- source_word: לַפַּלְמוֹנִי
  english_pob_choice: to the one
  chosen_korean: 그 말하는 이
  alternatives_korean:
  - 그 특정한 이에게
  - 팔모니에게
  lexicon: HALOT
  rationale: 본문은 불분명한 지시 대상이므로 고유명사로 확정하지 않고, 문맥상 말하는 존재를 가리키는 표현으로 처리해 불확실성을 보존했습니다.
- source_word: הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 정규 번제
  alternatives_korean:
  - 늘 드리는 제사
  - 항상 드리는 번제
  - 매일 드리는 제사
  lexicon: HALOT
  rationale: 다니엘서의 성전 제의 맥락을 반영하면서도 ‘daily sacrifice’보다 원문 의미를 더 분명히 드러내기 위해 ‘정규 번제’로 옮겼습니다.
- source_word: הַפֶּשַׁע שֹׁמֵם
  english_pob_choice: the desolating transgression
  chosen_korean: 황폐하게 하는 범죄
  alternatives_korean:
  - 황폐를 일으키는 범죄
  - 황폐케 하는 배반
  - 황폐하게 하는 반역
  lexicon: HALOT
  rationale: פֶּשַׁע의 ‘범죄/반역’ 의미와 שֹׁמֵם의 황폐 효과를 함께 살리되, 단정적인 기술용어로 굳히지 않고 압축적으로 표현했습니다.
- source_word: קֹדֶשׁ וְצָבָא
  english_pob_choice: both the sanctuary and the host
  chosen_korean: 성소와 군대
  alternatives_korean:
  - 성소와 군중
  - 성소와 군사들
  - 성소와 백성
  lexicon: HALOT
  rationale: ‘성소’는 구체적 성전 공간을 가리키는 것이 자연스럽고, צָבָא는 문맥상 군대/무리/백성을 모두 열어 두지만 한국어 본문에서는 가장 직접적인 ‘군대’를 택했습니다.
theological_decisions:
- issue: 거룩한 존재들의 정체
  chosen_reading: 천상적 거룩한 존재들로 이해되지만, 본문에는 ‘거룩한 자’로만 남겨 둡니다.
  alternative_readings:
  - 천사들
  - 성도들
  rationale: 다니엘의 환상 문맥에서는 천상 존재로 읽는 것이 유력하지만, 본문 자체는 그 정체를 명시하지 않으므로 번역문은 과잉해석을 피했습니다.
  doctrine_reference: Translation philosophy §3
- issue: צָבָא의 범위
  chosen_reading: ‘군대’로 옮기되, 사람/집단/군사력을 모두 포괄할 수 있는 여지를 남깁니다.
  alternative_readings:
  - 백성
  - 하늘 군대
  - 성전 봉사 무리
  rationale: 이 단어는 문맥상 범위가 분명히 좁혀지지 않으므로, 해석을 단정하지 않고 독자가 문맥적 긴장을 느끼도록 했습니다.
  doctrine_reference: Translation philosophy §3
