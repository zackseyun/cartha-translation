id: DAN.8.6
reference: Daniel 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֗א עַד הָ/אַ֨יִל֙ בַּ֣עַל הַ/קְּרָנַ֔יִם אֲשֶׁ֣ר רָאִ֔יתִי עֹמֵ֖ד לִ/פְנֵ֣י הָ/אֻבָ֑ל וַ/יָּ֥רָץ אֵלָ֖י/ו בַּ/חֲמַ֥ת כֹּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/006.yaml
  text: He came up to the ram with the two horns[a], which I had seen standing before the canal[b], and ran at him in the fury of his power.
  footnotes:
  - marker: a
    text: Or 'stream.' The Hebrew אוּבָל refers to a watercourse; 'canal' is chosen here because it best fits the setting in Daniel 8.
    reason: lexical_alternative
  - marker: b
    text: Or 'rushed at him in the wrath of his strength.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이전에 보았던, 두 뿔 달린 숫양에게—내가 그가 수로 앞에 서 있는 것을 보았던 그 숫양에게—그의 힘의 분노 속에서 달려들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수로’는 כאן의 אוּבָל을 이 장면에 맞게 옮긴 것으로, POB의 ‘canal’과 같은 의미 범주입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘달려들었습니다’는 히브리어의 단순한 ‘오기’보다 공격적인 돌진을 드러내기 위한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עַד
  english_pob_choice: He came up to
  chosen_korean: 달려들었습니다
  alternatives_korean:
  - 다가갔습니다
  - 다가왔습니다
  - 접근했습니다
  lexicon: HALOT
  rationale: 단순한 ‘오다’보다 עַד가 포함하는 대상 쪽으로의 돌진성을 살리기 위해, 이어지는 공격 장면에 맞게 한국어로는 ‘달려들었습니다’가 가장 자연스럽습니다.
- source_word: בַּעַל הַקְּרָנַיִם
  english_pob_choice: with the two horns
  chosen_korean: 두 뿔 달린
  alternatives_korean:
  - 두 뿔을 가진
  - 두 뿔의
  lexicon: HALOT
  rationale: 히브리어 בעל의 소유/지닌 바를 한국어 관용 표현으로 옮겨, 동물 묘사에서는 ‘두 뿔 달린’이 가장 간결하고 자연스럽습니다.
- source_word: לִפְנֵי הָאֻבָל
  english_pob_choice: before the canal
  chosen_korean: 수로 앞에
  alternatives_korean:
  - 운하 앞에
  - 개천 앞에
  - 시내 앞에
  lexicon: HALOT
  rationale: אוּבָל을 이 장면의 지형에 맞는 물길로 이해하여, POB의 ‘canal’을 살리되 한국어로는 ‘수로’가 가장 무난합니다.
- source_word: בַּחֲמַת כֹּחוֹ
  english_pob_choice: in the fury of his power
  chosen_korean: 그의 힘의 분노 속에서
  alternatives_korean:
  - 그의 힘의 격분 속에서
  - 분노한 힘으로
  - 격렬한 힘으로
  lexicon: HALOT
  rationale: חמה와 כוח를 각각 보존하기 위해 ‘분노’와 ‘힘’을 모두 살렸고, 전투적 강도를 드러내는 ‘속에서’로 장면의 긴박함을 유지했습니다.
theological_decisions:
- issue: 반복된 대명사와 관계절이 강조하는 환시의 식별성
  chosen_reading: ‘내가 이전에 보았던… 그 숫양’으로 옮겨, 같은 대상을 다시 특정하는 반복을 유지했습니다.
  alternative_readings:
  - 단순히 ‘그 숫양에게’로 압축
  - 관계절을 줄여 한 번만 언급
  rationale: 본문은 이미 보았던 동일한 숫양을 다시 지목함으로써 독자가 환시의 연속성을 파악하게 하므로, 반복을 줄이지 않고 드러내는 것이 좋습니다.
  doctrine_reference: 성경 내 환시 서술의 지시 대상 일관성
