source:
  edition: WLC
  text: וַ/תִּגְדַּ֖ל עַד צְבָ֣א הַ/שָּׁמָ֑יִם וַ/תַּפֵּ֥ל אַ֛רְצָ/ה מִן הַ/צָּבָ֥א וּ/מִן הַ/כּוֹכָבִ֖ים וַֽ/תִּרְמְסֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/010.yaml
  text: It grew as high as the host of heaven[a], and it cast some of the host and some of the stars down to the earth, and trampled them.
  footnotes:
  - marker: a
    text: Or 'the army of heaven.' The phrase may refer symbolically to heavenly beings, God's people, or celestial powers; the Hebrew leaves the image open.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 하늘의 군대에까지 커졌습니다[a]. 그리고 그 하늘의 군대와 별들 가운데 일부를 땅으로 떨어뜨리고 그들을 짓밟았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 진영’입니다. 이 표현은 상징적으로 천상 존재, 하나님의 백성, 또는 하늘의 권세를 가리킬 수 있으며, 히브리어는 이 이미지의 의미를 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְדַּל
  english_pob_choice: It grew
  chosen_korean: 자라나고
  alternatives_korean:
  - 커지고
  - 크게 되며
  lexicon: HALOT
  rationale: גדל의 진행적 성장 이미지를 자연스럽게 살리되, 영어 POB의 'It grew'처럼 자기증식적 의미를 과도하게 넣지 않기 위해 '자라나고'로 옮겼습니다.
- source_word: צְבָא הַשָּׁמַיִם
  english_pob_choice: the host of heaven
  chosen_korean: 하늘 군대
  alternatives_korean:
  - 하늘의 군대
  - 하늘 군대들
  lexicon: HALOT
  rationale: צָבָא의 기본 의미인 '군대/진영'을 살리면서도, 단순히 천체만을 가리키는 것으로 좁히지 않기 위해 '하늘 군대'로 옮겼습니다. 영어 주석이 열어 둔 상징적 중의성도 유지됩니다.
- source_word: מִן הַצָּבָא וּמִן הַכּוֹכָבִים
  english_pob_choice: some of the host and some of the stars
  chosen_korean: 그 하늘 군대와 별들 가운데 일부
  alternatives_korean:
  - 그 군대와 별들 중 일부
  - 하늘 군대와 별들에서 일부
  lexicon: HALOT
  rationale: מִן의 부분적 용법을 드러내기 위해 '가운데 일부'로 옮겨, 전체가 아니라 일부가 떨어져 나갔다는 점을 분명히 했습니다.
- source_word: וַתִּרְמְסֵם
  english_pob_choice: and trampled them
  chosen_korean: 그들을 짓밟았습니다
  alternatives_korean:
  - 그들을 밟아 짓눌렀습니다
  - 그들을 밟았습니다
  lexicon: HALOT
  rationale: רמס의 강한 폭력성을 살리기 위해 '짓밟다'를 택했고, 한국어 문맥에서 가장 자연스럽고 직접적인 표현으로 정리했습니다.
theological_decisions:
- issue: '''하늘 군대''와 ''별들''의 지시 대상을 본문에서 특정할지 여부'
  chosen_reading: 본문의 이미지를 그대로 유지하고, 천상 존재·하나님의 백성·천체 상징을 본문에서 확정하지 않습니다.
  alternative_readings:
  - 천사들
  - 성도들
  - 하늘의 별들/천체를 상징하는 권세
  rationale: 히브리어는 이 상징의 지시 대상을 명시하지 않으므로, 본문이 열어 둔 긴장을 유지하는 쪽이 원문의 범위를 가장 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolving it interpretively in the main text.'
