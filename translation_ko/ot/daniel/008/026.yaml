  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַרְאֵ֨ה הָ/עֶ֧רֶב וְ/הַ/בֹּ֛קֶר אֲשֶׁ֥ר נֶאֱמַ֖ר אֱמֶ֣ת ה֑וּא וְ/אַתָּה֙ סְתֹ֣ם הֶֽ/חָז֔וֹן כִּ֖י לְ/יָמִ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/026.yaml
  text: And the vision of the evening and the morning that was spoken is true; but you, seal up the vision, for it concerns many days from now.
translation:
  language: ko
  text: 또 저녁과 아침의 환상은 참된 것입니다. 그러나 당신은 그 환상을 봉인하십시오. 그것은 먼 여러 날에 관한 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘봉인하십시오’는 단순히 숨기라는 뜻보다, 내용의 보존과 공개 시점의 유보를 함께 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה ... הָעֶרֶב וְהַבֹּקֶר
  english_pob_choice: the vision of the evening and the morning
  chosen_korean: 저녁과 아침의 환상
  alternatives_korean:
  - 저녁과 아침의 이상
  - 저녁-아침의 환상
  lexicon: מַרְאֶה / חָזוֹן
  rationale: 원문의 어순과 결합을 따라 ‘저녁과 아침’의 한 묶음이 보는 내용임을 살리되, 한국어에서는 자연스럽게 ‘환상’으로 옮겼습니다.
- source_word: אֱמֶת הוּא
  english_pob_choice: is true
  chosen_korean: 참된 것입니다
  alternatives_korean:
  - 진실합니다
  - 참입니다
  lexicon: אֱמֶת
  rationale: 예언의 진위를 단정하는 표현이므로 ‘참된’으로 옮겨 사실성·확실성을 분명히 했습니다.
- source_word: סְתֹם הֶחָזוֹן
  english_pob_choice: seal up the vision
  chosen_korean: 그 환상을 봉인하십시오
  alternatives_korean:
  - 그 환상을 봉하시오
  - 그 환상을 닫아 두십시오
  lexicon: סָתַם
  rationale: POB의 ‘seal up’를 따라 단순 보관보다 공식적·가시적 보존 행위를 드러내는 ‘봉인하다’를 택했습니다.
- source_word: לְיָמִים רַבִּים
  english_pob_choice: for many days
  chosen_korean: 먼 여러 날에 관한 것입니다
  alternatives_korean:
  - 오랜 날들에 관한 것입니다
  - 많은 날 뒤에 해당합니다
  lexicon: יָמִים רַבִּים
  rationale: 직역의 ‘많은 날’보다 한국어에서는 ‘먼 여러 날’이 시간적 간격과 지연의 뉘앙스를 더 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘evening and morning’의 표현 방식
  chosen_reading: 창조의 날 계산을 직접 확정하는 표현으로 풀지 않고, 환상의 내용 자체를 가리키는 예언적 표현으로 유지했습니다.
  alternative_readings:
  - ‘저녁-아침’으로 하여 계산 단위를 강조하는 읽기
  - ‘저녁과 아침의 제사’처럼 의례적 해석을 암시하는 읽기
  rationale: 본문은 ‘저녁과 아침’의 환상이 참되다고 말할 뿐이므로, 추가 해석을 덧붙이지 않고 예언적 서술로 남기는 것이 원문에 충실합니다.
  doctrine_reference: 단 8:26의 문맥상 환상 해석 보류 원칙
