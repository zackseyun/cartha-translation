id: DAN.8.4
reference: Daniel 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָאִ֣יתִי אֶת הָ/אַ֡יִל מְנַגֵּחַ֩ יָ֨מָּ/ה וְ/צָפ֜וֹנָ/ה וָ/נֶ֗גְבָּ/ה וְ/כָל חַיּוֹת֙ לֹֽא יַֽעַמְד֣וּ לְ/פָנָ֔י/ו וְ/אֵ֥ין מַצִּ֖יל מִ/יָּד֑/וֹ וְ/עָשָׂ֥ה כִ/רְצֹנ֖/וֹ וְ/הִגְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/004.yaml
  text: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
  footnotes:
  - marker: a
    text: Or, 'and magnified himself' or 'and grew great.' The Hebrew can express either becoming great or making oneself great.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그 숫양이 서쪽과 북쪽과 남쪽으로 들이받는 것을 보았습니다. 어떤 짐승도 그 앞에 설 수 없었고, 그의 손에서 건져 낼 자도 없었습니다. 그는 자기 뜻대로 행하여 크게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신을 크게 하였습니다’ 또는 ‘크게 되었습니다’로도 옮길 수 있습니다. 히브리어는 두 뜻을 모두 표현할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I saw
  chosen_korean: 내가 ... 보니
  alternatives_korean:
  - 내가 보았습니다
  - 나는 보았습니다
  lexicon: WLC/HALOT
  rationale: 서술적 환상 문맥에서 1인칭 완료형의 관찰을 자연스러운 한국어 서술인 「...보니」로 옮겨, 단순한 시각 행위보다 장면 목격의 흐름을 살렸습니다.
- source_word: הָאַיִל
  english_pob_choice: the ram
  chosen_korean: 그 숫양
  alternatives_korean:
  - 그 양
  - 그 수양
  lexicon: HALOT
  rationale: אַיִל은 환상 맥락에서 숫양을 가리키므로, 일반적인 '양'보다 구체적인 '숫양'이 원문 지시를 더 정확히 반영합니다.
- source_word: מְנַגֵּחַ
  english_pob_choice: charging
  chosen_korean: 들이받는
  alternatives_korean:
  - 받아들이는
  - 뿔로 치는
  - 돌진하는
  lexicon: HALOT
  rationale: נגח는 뿔로 들이받는 동작을 뜻하므로, 현대 한국어에서 이미지와 동작을 함께 살리는 「들이받는」이 가장 자연스럽습니다.
- source_word: יָמָּה וְצָפוֹנָה וָנֶגְבָּה
  english_pob_choice: westward and northward and southward
  chosen_korean: 서쪽과 북쪽과 남쪽으로
  alternatives_korean:
  - 서쪽으로와 북쪽으로와 남쪽으로
  - 서쪽을 향해와 북쪽을 향해와 남쪽을 향해
  lexicon: HALOT
  rationale: 방향 목적격의 ה-를 한국어의 조사 「-으로」로 옮겨 이동의 방향성을 살렸습니다.
- source_word: וְכָל חַיּוֹת לֹא יַעַמְדוּ לְפָנָיו
  english_pob_choice: and no beasts could stand before him
  chosen_korean: 짐승들 가운데 어느 것도 그 앞에 설 수 없었고
  alternatives_korean:
  - 어떤 짐승도 그 앞에 설 수 없었고
  - 모든 짐승이 그 앞에 서지 못했고
  lexicon: HALOT
  rationale: חַיּוֹת는 환상 속 짐승들을 가리키므로 '짐승들'로 옮겼고, 부정문은 능력 부정의 의미를 살려 「설 수 없었고」로 표현했습니다.
- source_word: וְאֵין מַצִּיל מִיָּדוֹ
  english_pob_choice: and there was no one who could rescue from his hand
  chosen_korean: 그의 손에서 건져낼 자도 없었습니다
  alternatives_korean:
  - 그의 손에서 구해낼 자도 없었습니다
  - 그의 권세에서 건져낼 자도 없었습니다
  lexicon: HALOT
  rationale: מַצִּיל은 구출/구해냄의 뜻이므로 「건져낼」을 택했고, '손'은 권세와 통제의 히브리 관용을 그대로 살렸습니다.
- source_word: וְעָשָׂה כִרְצֹנוֹ
  english_pob_choice: He did as he pleased
  chosen_korean: 하고 싶은 대로 행하며
  alternatives_korean:
  - 자기 뜻대로 행하며
  - 자기 기분대로 행하며
  lexicon: HALOT
  rationale: 관용구로서의 '자기 뜻대로'를 뜻하되, 문맥의 연속 동작을 살려 연결형 「행하며」로 처리했습니다.
- source_word: וְהִגְדִּיל
  english_pob_choice: and became great
  chosen_korean: 크게 되었습니다
  alternatives_korean:
  - 스스로를 크게 하였습니다
  - 자라서 크게 되었습니다
  - 크게 성장하였습니다
  lexicon: HALOT
  rationale: 히필 גדל은 '크게 되다/크게 하다' 모두 가능하지만, 본문은 정복과 확장의 결과를 말하므로 반사적 해석을 과잉으로 넣지 않는 「크게 되었습니다」를 택했습니다.
theological_decisions:
- issue: וְהִגְדִּיל의 반사적 의미를 명시할지 여부
  chosen_reading: 크게 되었습니다
  alternative_readings:
  - 스스로를 크게 하였습니다
  - 자기를 높였습니다
  rationale: 히브리어 형태만으로는 반사적 행위가 명시되지 않으며, 문맥상 핵심은 숫양의 세력 확대입니다. 따라서 도덕적 평가를 덧씌우지 않고 결과를 드러내는 번역을 유지했습니다.
  doctrine_reference: '번역 원칙: 문맥이 허락하는 범위에서 해석을 과잉 결정하지 않고 긴장을 보존한다'
