  source_fidelity: 핵심 의미는 대체로 충실합니다. 숫양, 세 방향으로의 들이받음, 다른 짐승들의 무력함, 그의 손에서 구출할 자의 부재, 뜻대로 행함, 그리고 ‘크게 됨’을 모두 반영합니다. 다만 ‘보니’는 단순 과거 목격인 רָאִיתִי에 발견·결과의 뉘앙스를 더하며, 이어지는 과거 서술과도 시제가 매끄럽지 않습니다.
