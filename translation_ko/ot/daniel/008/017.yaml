  source_fidelity: 공간 표현과 엎드림의 묘사는 히브리어 본문에 대체로 충실합니다. 그러나 לְעֵת קֵץ הֶחָזוֹן은 환상이 ‘끝의 때’와 관련됨을 말하며, ‘끝의 때를 위한 것이다’는 한국어에서 목적·용도를 뜻하는 것으로 들려 의미가 다소 빗나갑니다.
  naturalness: 합쇼체 본문 안의 직접 명령 ‘깨달아라’는 반말이므로, 요구된 현대 정중한 문체에 맞게 ‘깨달으십시오’로 고쳐야 합니다. 또한 ‘끝의 때를 위한 것이다’는 현대 한국어에서 어색하므로 ‘끝의 때에 관한 것입니다’가 자연스럽습니다.
  terminology: ‘인자여’는 בן־אדם의 문자적 형태와 다니엘서 내 호칭의 울림을 보존하는 적절한 번역입니다. 각주 b의 ‘사람아/필멸의 존재여’도 해당 표현의 어휘적 대안을 적절히 제시합니다.
