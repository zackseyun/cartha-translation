id: DAN.8.17
reference: Daniel 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֵ֣צֶל עָמְדִ֔/י וּ/בְ/בֹא֣/וֹ נִבְעַ֔תִּי וָ/אֶפְּלָ֖/ה עַל פָּנָ֑/י וַ/יֹּ֤אמֶר אֵלַ/י֙ הָבֵ֣ן בֶּן אָדָ֔ם כִּ֖י לְ/עֶת קֵ֥ץ הֶ/חָזֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/017.yaml
  text: So he came near where I was standing[a], and when he came, I was terrified and fell on my face. Then he said to me, “Understand, son of man[b], that the vision is for the time of the end.”
  footnotes:
  - marker: a
    text: 'Or “human one” or “mortal.” Hebrew: “son of man.”'
    reason: lexical_alternative
  - marker: b
    text: Or “the vision concerns the appointed end.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 내가 서 있던 곳 가까이로 왔습니다[a]. 그가 오자 나는 몹시 두려워 얼굴을 땅에 대고 엎드렸습니다. 그가 내게 말했습니다. “인자여[b], 깨달으십시오. 그 환상은 끝의 때에 관한 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 서 있던 자리 곁으로.”
    reason: alternative_reading
  - marker: b
    text: '또는 “사람아” 또는 “필멸의 존재여.” 히브리어: “사람의 아들.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֶל עָמְדִי
  english_pob_choice: near where I was standing
  chosen_korean: 내가 서 있던 곳 가까이
  alternatives_korean:
  - 내가 서 있던 자리 곁으로
  - 내가 서 있던 곳 옆으로
  lexicon: HALOT
  rationale: אֵצֶל의 근접 의미를 살리면서, עָמְדִי를 자연스러운 한국어로 풀어 위치를 나타냈습니다.
- source_word: נִבְעַתִּי
  english_pob_choice: I was terrified
  chosen_korean: 두려워서
  alternatives_korean:
  - 몹시 놀라서
  - 공포에 질려
  lexicon: HALOT
  rationale: 이 동사는 단순한 놀람보다 강한 공포 반응을 나타내므로, 문맥에 맞게 두려움의 강도를 반영했습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: son of man
  chosen_korean: 인자여
  alternatives_korean:
  - 사람아
  - 인간이여
  lexicon: HALOT
  rationale: 호격으로 쓰인 מקור 표현을 살리기 위해 직역에 가까운 '인자여'를 유지했고, 다니엘서의 호칭 기능도 보존했습니다.
- source_word: לְעֵת קֵץ הֶחָזוֹן
  english_pob_choice: for the time of the end
  chosen_korean: 끝의 때를 위한 것이다
  alternatives_korean:
  - 끝 때를 위한 것이다
  - 종말의 때를 위한 것이다
  lexicon: HALOT
  rationale: לְעֵת קֵץ는 '끝'이 특징이 되는 때를 가리키므로, 영어 POB의 의미를 따라 자연스럽게 '끝의 때'로 옮겼습니다.
theological_decisions:
- issue: בֶּן אָדָם의 번역에서 문자성과 호격성의 보존
  chosen_reading: 인자여
  alternative_readings:
  - 사람아
  - 인간이여
  rationale: 다니엘 8:17의 호칭은 인간성을 강조하는 동시에 본문의 어조를 형성하므로, 완화하지 않고 문자적 호칭을 유지해 긴장과 상호텍스트성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 소스의 긴장을 해소하지 말고 보존할 것.'
- issue: לְעֵת קֵץ의 종말론적 구체화 절제
  chosen_reading: 끝의 때를 위한 것이다
  alternative_readings:
  - 정해진 끝의 때를 위한 것이다
  - 종말의 때를 위한 것이다
  rationale: 본문이 말하는 것은 환상이 특정한 '끝의 때'와 관련된다는 점이지, 추가적인 종말 체계를 상세히 규정하는 것이 아니므로 과잉 해석을 피했습니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 말하지 않는 교리적 세부를 들여오지 말 것.'
