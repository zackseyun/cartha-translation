  to: 그가 내가 서 있던 곳 가까이로 왔습니다[a]. 그가 오자 나는 몹시 두려워 얼굴을 땅에 대고 엎드렸습니다. 그가 내게 말했습니다. “인자여[b], 깨달으십시오. 그 환상은 끝의 때에 관한 것입니다.”
  rationale: 문체 지정에 맞추어 명령형을 합쇼체로 통일했습니다. 또한 ‘환상은 끝의 때를 위한 것이다’를, 히브리어가 나타내는 관련·대상 관계를 자연스럽게 드러내는 ‘그 환상은 끝의 때에 관한 것입니다’로 수정했습니다. ‘인자여’와 공간 표현 및 해당 각주의 연결은 유지했습니다.
