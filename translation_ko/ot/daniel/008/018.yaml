    text: 또는 ‘나는 깊은 잠에 빠져 있었다’ 또는 ‘나는 혼미한 상태에 빠졌다.’ 히브리어는 깊은 잠이나 혼미에 압도된 상태를 나타냅니다.
    reason: lexical_alternative
