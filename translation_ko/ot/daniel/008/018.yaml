id: DAN.8.18
reference: Daniel 8:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י נִרְדַּ֥מְתִּי עַל פָּנַ֖/י אָ֑רְצָ/ה וַ/יִּ֨גַּע בִּ֔/י וַ/יַּֽעֲמִידֵ֖/נִי עַל עָמְדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/018.yaml
  text: And while he was speaking with me[a], I fell into a deep sleep with my face to the ground[b]; but he touched me and made me stand up where I had been standing.
  footnotes:
  - marker: a
    text: Or, 'I was in a deep sleep' or 'I fell into a trance-like sleep.' The Hebrew describes being overcome by deep sleep or stupor.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and made me stand upon my standing.' The expression likely means he set me back on my feet, at my place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나와 말씀하시는 동안 나는 얼굴을 땅에 대고 깊은 잠에 빠졌습니다[a]. 그러자 그가 나를 만져, 내가 서 있던 자리에서 다시 일어서게 했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 깊은 잠에 있었다’ 혹은 ‘나는 트랜스와 같은 잠에 빠졌다.’ 히브리어는 깊은 잠이나 혼미에 압도된 상태를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 서 있던 위에 나를 세웠다’입니다. 이 표현은 그가 나를 다시 발을 딛게 하여 제자리로 세웠다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  english_pob_choice: while he was speaking with me
  chosen_korean: 그가 나와 말씀하시는 동안
  alternatives_korean:
  - 그가 내게 말씀하시는 동안
  - 그가 나와 이야기하시는 동안
  lexicon: HALOT
  rationale: ב+분사 구문은 진행 중인 동작의 시간적 배경을 나타내므로 ‘~하는 동안’으로 옮겼고, עִמִּי는 ‘나와’로 자연스럽게 반영했습니다.
- source_word: נִרְדַּמְתִּי
  english_pob_choice: I fell into a deep sleep
  chosen_korean: 깊은 잠에 빠졌습니다
  alternatives_korean:
  - 깊은 잠에 들었습니다
  - 혼수상태처럼 잠들었습니다
  lexicon: HALOT
  rationale: רדם의 수동/비수동적 뉘앙스는 단순한 수면보다 ‘깊은 잠에 빠지다’가 더 잘 드러내며, POB의 ‘deep sleep or stupor’ 범위를 무리 없이 담습니다.
- source_word: עַל פָּנַי אָרְצָה
  english_pob_choice: with my face to the ground
  chosen_korean: 얼굴을 땅에 대고
  alternatives_korean:
  - 얼굴을 땅으로 향한 채
  - 얼굴을 땅에 대고 엎드려
  lexicon: HALOT
  rationale: 직역하면 ‘내 얼굴 위로, 땅으로’이지만 한국어에서는 자세의 의미를 자연스럽게 살리기 위해 ‘얼굴을 땅에 대고’로 옮겼습니다.
- source_word: וַיַּעֲמִידֵנִי עַל עָמְדִי
  english_pob_choice: made me stand up where I had been standing
  chosen_korean: 내가 서 있던 자리에서 다시 일어서게 했습니다
  alternatives_korean:
  - 내 서 있던 곳에 다시 세우셨습니다
  - 내가 서 있던 곳으로 다시 서게 하셨습니다
  lexicon: HALOT
  rationale: Hiphil עמד의 사역성(‘서게 하다’)과 עַל־עָמְדִי의 관용구적 의미(‘내가 서 있던 자리/위치’)를 함께 살리기 위해 ‘다시 일어서게 했습니다’로 번역했습니다.
theological_decisions:
- issue: 다니엘의 상태 묘사(נִרְדַּמְתִּי)의 해석
  chosen_reading: 비전 중의 신비한 황홀경이라기보다, 몸이 깊은 잠/혼미에 빠진 서술로 유지했습니다.
  alternative_readings:
  - 환상적 트랜스 상태
  - 예언적 황홀경
  rationale: 히브리어 רדם은 문맥상 ‘깊은 잠’이나 ‘혼미’에 가깝고, 본문이 말하는 것은 천상 존재와의 만남에 대한 다니엘의 신체적 반응입니다. 기술용어를 덧씌우기보다 본문이 직접 말하는 범위로 남겼습니다.
  doctrine_reference: 원어 우선 원칙; 본문이 명시하지 않는 신학적 범주를 확대 적용하지 않음.
