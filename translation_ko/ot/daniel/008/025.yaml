source:
  edition: WLC
  text: וְ/עַל שִׂכְל֗/וֹ וְ/הִצְלִ֤יחַ מִרְמָה֙ בְּ/יָד֔/וֹ וּ/בִ/לְבָב֣/וֹ יַגְדִּ֔יל וּ/בְ/שַׁלְוָ֖ה יַשְׁחִ֣ית רַבִּ֑ים וְ/עַ֤ל שַׂר שָׂרִים֙ יַעֲמֹ֔ד וּ/בְ/אֶ֥פֶס יָ֖ד יִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/025.yaml
  text: And through his shrewdness he will make deceit prosper in his hand; and in his heart he will magnify himself. In a time of security he will destroy many[a], and he will rise up against the Prince of princes; but he will be broken without hand.
  footnotes:
  - marker: a
    text: Or 'without human hand,' that is, not by ordinary human power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 영리함으로 그는 자기 손안에서 속임수를 성공시키고, 마음속으로 자신을 높일 것입니다. 사람들이 안전하다고 여기는 때에 그는 많은 사람을 멸망시키고, 방백들의 방백에게 맞서 일어설 것입니다. 그러나 그는 손에 의하지 않고[a] 부서질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 손 없이’, 곧 보통 인간의 힘에 의한 것이 아니라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂכְלוֹ
  english_pob_choice: his shrewdness
  chosen_korean: 그의 영리함
  alternatives_korean:
  - 그의 분별력
  - 그의 지혜
  - 그의 간교함
  lexicon: HALOT
  rationale: 문맥상 중립적이거나 긍정적인 ‘이해’보다, 속임수가 성공하는 데 쓰이는 계산된 지능을 드러내야 하므로 ‘영리함’이 가장 균형 잡힌 대응입니다.
- source_word: וְהִצְלִיחַ מִרְמָה בְּיָדוֹ
  english_pob_choice: he will make deceit prosper in his hand
  chosen_korean: 자기 손에서 속임수를 번성하게 할 것이며
  alternatives_korean:
  - 자기 손으로 속임수를 성공하게 할 것이며
  - 자기 권세 아래서 속임수를 번성하게 할 것이며
  - 손에 속임수를 두고 번성하게 할 것이며
  lexicon: HALOT
  rationale: 히필형의 사역적 뜻을 살려 ‘번성하게 하다’로 옮기고, ‘בְּיָדוֹ’는 지배 영역을 나타내는 이미지로서 자연스럽게 ‘자기 손에서’로 살렸습니다.
- source_word: וּבִלְבָבוֹ יַגְדִּיל
  english_pob_choice: in his heart he will magnify himself
  chosen_korean: 그의 마음속에서는 스스로를 크게 할 것입니다
  alternatives_korean:
  - 그의 마음속에서 스스로를 높일 것입니다
  - 그의 마음속에서 자신을 크게 할 것입니다
  - 그의 마음속에서는 자기를 높일 것입니다
  lexicon: HALOT
  rationale: ‘גדל’의 기본 이미지를 보존하면서, 내면의 교만을 드러내는 표현으로 한국어에서 자연스러운 ‘스스로를 크게 하다’를 택했습니다.
- source_word: שַׁלְוָה
  english_pob_choice: a time of security
  chosen_korean: 평온한 때
  alternatives_korean:
  - 안전한 때
  - 안심한 때
  - 평안한 때
  lexicon: HALOT
  rationale: ‘peace’보다 ‘quietness/ease/security’의 뉘앙스를 살려, 경계심이 풀린 상태를 드러내는 ‘평온한 때’로 옮겼습니다.
- source_word: שַׂר שָׂרִים
  english_pob_choice: the Prince of princes
  chosen_korean: 방백들 가운데 지극히 높은 이
  alternatives_korean:
  - 방백들의 방백
  - 방백들의 통치자
  - 최고의 방백
  lexicon: HALOT
  rationale: ‘방백’은 Daniel의 고위 통치자 어휘를 살린 표현이며, 직역적이면서도 한국어에서 어색하지 않게 지극히 높은 위상을 드러내기 위해 풀어 옮겼습니다.
- source_word: וּבְאֶפֶס יָד
  english_pob_choice: without hand
  chosen_korean: 손에 의하지 않고
  alternatives_korean:
  - 손 없이
  - 사람의 손 없이
  - 인간의 손 없이
  lexicon: HALOT
  rationale: 히브리어의 생략된 관용구를 그대로 드러내되, 한국어에서 의미가 분명하도록 ‘손에 의하지 않고’로 옮겨 인간적/보통의 힘이 아님을 함축하게 했습니다.
theological_decisions:
- issue: שַׂר שָׂרִים의 위상과 지칭
  chosen_reading: 방백들 가운데 지극히 높은 이
  alternative_readings:
  - 방백들의 방백
  - 최고의 방백
  rationale: 문맥상 최상위 통치 권위를 가리키지만, 이 절만으로 지칭 대상을 과도하게 특정하지 않기 위해 직함의 위상은 살리되 해석을 최소화했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: וּבְאֶפֶס יָד의 비인간적/신적 성격
  chosen_reading: 손에 의하지 않고
  alternative_readings:
  - 사람의 손 없이
  - 인간의 손 없이
  rationale: 본문은 멸망이 통상적 인간 능력에 의한 것이 아님을 암시하지만, 그 방식까지 단정하지 않기 위해 간결한 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
