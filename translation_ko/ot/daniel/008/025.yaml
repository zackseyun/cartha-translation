- from: 그의 영리함으로 그는 자기 손에서 속임수를 번성하게 할 것이며, 그의 마음속에서는 스스로를 크게 할 것입니다. 평온한 때에 그는 많은 사람을 멸망시킬 것이며[a], 또 그는 방백들 가운데 지극히 높은 이에게 맞서 일어설 것이지만, 손에 의하지 않고 부서질 것입니다.
  to: 그의 영리함으로 그는 자기 손안에서 속임수를 성공시키고, 마음속으로 자신을 높일 것입니다. 사람들이 안전하다고 여기는 때에 그는 많은 사람을 멸망시키고, 방백들의 방백에게 맞서 일어설 것입니다. 그러나 그는 손에 의하지 않고[a] 부서질 것입니다.
  rationale: 각주 표지를 원문의 וּבְאֶפֶס יָד에 해당하는 ‘손에 의하지 않고’로 옮겼습니다. 사역적 동사와 내면의 자고를 자연스러운 한국어로 옮기고, 합쇼체 미래 종결을 통일했습니다. ‘방백들의 방백’은 원문의 위계적 칭호를 보존하면서도 그 지칭을 본문 이상으로 특정하지 않습니다. ‘사람들이 안전하다고 여기는 때’는 שַׁלְוָה의 평온·안심·안전의 뉘앙스를 문맥상 자연스럽게 드러냅니다.
