id: DAN.8.5
reference: Daniel 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֣י הָיִ֣יתִי מֵבִ֗ין וְ/הִנֵּ֤ה צְפִיר הָֽ/עִזִּים֙ בָּ֤א מִן הַֽ/מַּעֲרָב֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֵ֥ין נוֹגֵ֖עַ בָּ/אָ֑רֶץ וְ/הַ֨/צָּפִ֔יר קֶ֥רֶן חָז֖וּת בֵּ֥ין עֵינָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/005.yaml
  text: As I was considering[a], behold, a male goat came from the west over the face of the whole earth, without touching the ground[c][b]; and the goat had a conspicuous horn between its eyes.
  footnotes:
  - marker: a
    text: Or 'a he-goat.' The Hebrew specifically refers to a male goat.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and there was no touching the earth,' an image of extraordinary speed.
    reason: lexical_alternative
  - marker: c
    text: Or 'a prominent horn' between its eyes.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 계속 생각하고 있을 때, 보라, 숫염소가 서쪽에서 온 땅의 표면을 가로질러 왔는데 땅을 밟지 않았습니다[b]; 그 숫염소에는 눈 사이에 뚜렷한 뿔이 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 '땅을 밟지 아니하며'입니다. 초자연적으로 빠른 이동의 이미지를 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '눈에 띄는 뿔'입니다. 원문은 뿔의 시각적 두드러짐을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הָיִיתִי מֵבִין
  english_pob_choice: As I was considering
  chosen_korean: 내가 계속 생각하고 있을 때
  alternatives_korean:
  - 내가 이해하고 있을 때
  - 내가 살피고 있을 때
  lexicon: HALOT
  rationale: היה + 분사는 진행 중인 동작을 나타내므로 단순한 지적 상태보다 시각 환상을 계속 주목하는 흐름을 살려야 합니다. '계속 생각하고 있을 때'가 자연스러운 현대 한국어로 그 지속성을 보여 줍니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 갑자기
  lexicon: HALOT
  rationale: 환시의 전환을 알리는 표지이므로 감탄사적 호소를 유지하는 '보라'가 적절합니다.
- source_word: צְפִיר הָעִזִּים
  english_pob_choice: a male goat
  chosen_korean: 숫염소
  alternatives_korean:
  - 수염소
  - 염소 수컷
  - 염소
  lexicon: HALOT
  rationale: 히브리어는 암수 구분이 분명한 수컷 염소를 가리키므로, 이를 분명히 드러내는 '숫염소'를 택했습니다.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  english_pob_choice: over the face of the whole earth
  chosen_korean: 온 땅의 표면을 가로질러
  alternatives_korean:
  - 온 땅 위를
  - 온 땅을 가로질러
  - 온 세상의 표면을 가로질러
  lexicon: HALOT
  rationale: עַל פְּנֵי의 표면/위를 뜻하는 이미지를 살리면서, 비상하듯 빠른 이동의 장면을 자연스럽게 전달하기 위해 이와 같이 옮겼습니다.
- source_word: וְאֵין נוֹגֵעַ בָּאָרֶץ
  english_pob_choice: without touching the ground
  chosen_korean: 땅을 밟지 않았습니다
  alternatives_korean:
  - 땅에 닿지 않았습니다
  - 땅에 손대지 않았습니다
  lexicon: HALOT
  rationale: 직역보다 한국어 관용에서 더 자연스러운 '땅을 밟지 않았다'를 사용해 초자연적으로 빠른 움직임을 분명히 했습니다.
- source_word: קֶרֶן חָזוּת
  english_pob_choice: a conspicuous horn
  chosen_korean: 뚜렷한 뿔
  alternatives_korean:
  - 두드러진 뿔
  - 눈에 띄는 뿔
  - 분명한 뿔
  lexicon: HALOT
  rationale: חָזוּת는 눈에 띄는 시각적 두드러짐을 가리키므로, 상징성을 유지하면서도 자연스러운 '뚜렷한'으로 옮겼습니다.
- source_word: בֵּין עֵינָיו
  english_pob_choice: between its eyes
  chosen_korean: 눈 사이에
  alternatives_korean:
  - 두 눈 사이에
  - 눈 사이 중앙에
  - 이마에
  lexicon: HALOT
  rationale: 위치를 직접적으로 나타내는 기본 의미를 따라 '눈 사이에'로 옮겼습니다.
theological_decisions:
- issue: 환시의 상징 동물 이미지를 해석하지 않고 보존할지 여부
  chosen_reading: 숫염소와 뿔의 이미지를 그대로 유지하고, 이 절 안에서 상징의 대상(제국/통치자)을 미리 풀어 쓰지 않았습니다.
  alternative_readings:
  - 숫염소를 특정 제국이나 통치자로 풀어 번역하기
  - 의미를 해설적으로 덧붙이기
  rationale: 본문은 아직 상징을 해설하는 단계가 아니므로, 해석을 번역에 앞당기지 않고 환시의 서사 순서를 보존하는 것이 source-direct 합니다.
  doctrine_reference: Translation philosophy §1, §3
