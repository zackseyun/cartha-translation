  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
  footnotes:
  - marker: a
    text: Or, 'the he-goat' or simply 'the goat.' The Hebrew expression is more vivid, describing a male goat with shaggy hair.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Javan,' a term commonly referring here to Greece or the Greek realm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 털이 많은 숫염소[b]는 그리스[a]의 왕이며, 그 눈 사이에 있는 큰 뿔은 첫째 왕입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야완’. 여기서는 보통 그리스 또는 그리스 세계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 털이 많은 수컷 염소를 생생하게 묘사합니다. 단순히 ‘염소’ 또는 ‘숫염소’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  english_pob_choice: the shaggy male goat
  chosen_korean: 털이 많은 숫염소
  alternatives_korean:
