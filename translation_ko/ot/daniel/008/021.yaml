  - 커다란 뿔
  lexicon: HALOT
  rationale: '''great horn''의 상징적 이미지를 그대로 살리되, 한국어에서는 ''큰 뿔''이 가장 자연스럽고 직설적입니다.'
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  english_pob_choice: is the first king
  chosen_korean: 첫째 왕
