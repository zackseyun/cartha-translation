  rationale: רִאשׁוֹן은 순서상 '첫째'를 뜻하므로, 단순한 '전임'보다 '첫째 왕'이 원문의 순차적 의미를 더 잘 보존합니다.
theological_decisions:
- issue: 상징 해석의 범위
  chosen_reading: 숫염소는 헬라의 왕, 큰 뿔은 첫째 왕이라는 본문의 해석을 그대로 유지했습니다.
  alternative_readings:
  - 숫염소를 헬라 제국 전체로 이해하는 번역
  - 큰 뿔을 단지 '큰 권세'의 상징으로만 풀어 쓰는 번역
  rationale: 히브리어 본문이 직접 해석을 제시하므로, 본문이 말하는 상징 대응을 본문 안에서 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
