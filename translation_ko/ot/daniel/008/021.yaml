base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/021.yaml
  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
  footnotes:
  - marker: a
    text: Or, 'the he-goat' or simply 'the goat.' The Hebrew expression is more vivid, describing a male goat with shaggy hair.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Javan,' a term commonly referring here to Greece or the Greek realm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 털이 많은 숫염소는 헬라의 왕이요, 그의 눈 사이에 있는 큰 뿔은 첫째 왕입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '야완'은 여기서 보통 헬라(그리스) 또는 헬라 세계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '''털이 많은 숫염소''는 히브리어 표현의 생생함을 살린 번역입니다. 단순히 ''염소'' 또는 ''숫염소''로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  english_pob_choice: the shaggy male goat
  chosen_korean: 털이 많은 숫염소
  alternatives_korean:
  - 염소
  - 숫염소
  - 털 많은 수염소
  lexicon: HALOT
  rationale: צָפִיר와 שָׂעִיר의 결합은 단순한 '염소'보다 수컷과 털이 많은 특징을 함께 드러냅니다. '털이 많은 숫염소'는 영어 POB의 묘사력을 살리면서도 자연스럽습니다.
- source_word: מֶלֶךְ יָוָן
  english_pob_choice: the king of Greece
  chosen_korean: 헬라의 왕
  alternatives_korean:
  - 그리스의 왕
  - 야완의 왕
  - 헬라 제국
  lexicon: HALOT
  rationale: 이 문맥에서 יָוָן은 개인명 '야완'보다 헬라/그리스 세력을 가리키므로, POB의 역사적·문맥적 해석을 따라 '헬라의 왕'으로 옮겼습니다.
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  english_pob_choice: the great horn
  chosen_korean: 큰 뿔
  alternatives_korean:
  - 큰 뿔
  - 커다란 뿔
  lexicon: HALOT
  rationale: '''great horn''의 상징적 이미지를 그대로 살리되, 한국어에서는 ''큰 뿔''이 가장 자연스럽고 직설적입니다.'
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  english_pob_choice: is the first king
  chosen_korean: 첫째 왕
  alternatives_korean:
  - 첫 번째 왕
  - 처음의 왕
  - 전임 왕
  lexicon: HALOT
  rationale: רִאשׁוֹן은 순서상 '첫째'를 뜻하므로, 단순한 '전임'보다 '첫째 왕'이 원문의 순차적 의미를 더 잘 보존합니다.
theological_decisions:
- issue: 상징 해석의 범위
  chosen_reading: 숫염소는 헬라의 왕, 큰 뿔은 첫째 왕이라는 본문의 해석을 그대로 유지했습니다.
  alternative_readings:
  - 숫염소를 헬라 제국 전체로 이해하는 번역
  - 큰 뿔을 단지 '큰 권세'의 상징으로만 풀어 쓰는 번역
  rationale: 히브리어 본문이 직접 해석을 제시하므로, 본문이 말하는 상징 대응을 본문 안에서 보존하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
