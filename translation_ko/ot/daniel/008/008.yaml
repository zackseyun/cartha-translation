id: DAN.8.8
reference: Daniel 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/צְפִ֥יר הָ/עִזִּ֖ים הִגְדִּ֣יל עַד מְאֹ֑ד וּ/כְ/עָצְמ֗/וֹ נִשְׁבְּרָה֙ הַ/קֶּ֣רֶן הַ/גְּדוֹלָ֔ה וַֽ/תַּעֲלֶ֜נָה חָז֤וּת אַרְבַּע֙ תַּחְתֶּ֔י/הָ לְ/אַרְבַּ֖ע רוּח֥וֹת הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/008.yaml
  text: And the male goat grew exceedingly great[a], but when he was strong, the great horn was broken[b], and in its place four conspicuous horns came up toward the four winds of heaven.
  footnotes:
  - marker: a
    text: Or 'four notable ones'; the Hebrew term describes what is visible or prominent, and English supplies 'horns' from the context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'under it'; here the sense is 'in its place' or 'instead of it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 숫염소가 심히 강대해졌습니다. 그가 강성해졌을 때 큰 뿔이 꺾였고, 그 자리[a]에 네 개의 두드러진 뿔[b]이 하늘의 네 바람을 향하여 솟아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 아래에’입니다. 여기서는 ‘그 자리에’ 또는 ‘그 대신에’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 개의 두드러진 것들’로도 옮길 수 있습니다. 히브리어는 문맥상 ‘뿔’을 보충합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/צְפִ֥יר הָ/עִזִּ֖ים
  english_pob_choice: the male goat
  chosen_korean: 염소 수컷
  alternatives_korean:
  - 숫염소
  - 염소
  lexicon: HALOT
  rationale: צְפִיר הָעִזִּים는 단순한 염소가 아니라 수컷 염소를 가리키므로, 현대 한국어에서 자연스럽고 정확한 ‘염소 수컷’으로 옮겼습니다.
- source_word: הִגְדִּ֣יל עַד מְאֹ֑ד
  english_pob_choice: grew exceedingly great
  chosen_korean: 심히 커졌습니다
  alternatives_korean:
  - 매우 크게 되었습니다
  - 크게 번성했습니다
  lexicon: HALOT
  rationale: גדל의 증대 의미와 עַד מְאֹד의 강화를 함께 살리기 위해, 단순한 상태 변화보다 강한 확대를 드러내는 ‘심히 커졌습니다’로 옮겼습니다.
- source_word: חָזו֤וּת אַרְבַּע֙
  english_pob_choice: four conspicuous horns
  chosen_korean: 네 개의 뚜렷한 뿔
  alternatives_korean:
  - 네 개의 눈에 띄는 뿔
  - 네 개의 분명한 뿔
  lexicon: HALOT
  rationale: חָזוּת는 보이는 것, 두드러진 것을 가리키므로 ‘뚜렷한’으로 옮겼고, 문맥상 대상이 뿔이므로 명시적으로 ‘뿔’을 보충했습니다.
- source_word: תַּחְתֶּ֔י/הָ
  english_pob_choice: in its place
  chosen_korean: 그 자리에
  alternatives_korean:
  - 그 대신
  - 그 아래에
  lexicon: HALOT
  rationale: 문자적으로는 ‘그 아래/밑에’이지만, 교체 관계에서는 ‘그 자리에’가 의미를 가장 자연스럽게 전달하므로 POB의 해석을 반영했습니다.
- source_word: לְ/אַרְבַּ֖ע רוּח֥וֹת הַ/שָּׁמָֽיִם
  english_pob_choice: toward the four winds of heaven
  chosen_korean: 하늘의 네 바람을 향해
  alternatives_korean:
  - 하늘의 네 방향을 향해
  - 하늘의 네 바람 쪽으로
  lexicon: HALOT
  rationale: 성경적 관용구를 살려 ‘네 바람’을 유지하되, 한국어 어순에 맞게 ‘하늘의 네 바람을 향해’로 옮겼습니다.
theological_decisions:
- issue: 환상 이미지 보존 여부
  chosen_reading: 뿔과 바람의 이미지를 본문에 그대로 유지하고, 해석을 본문 안에 덧붙이지 않았습니다.
  alternative_readings:
  - 뿔을 왕이나 왕국으로 직접 풀어 쓰기
  - 바람을 방향으로 바꾸어 번역하기
  rationale: 이 절은 묵시적 환상 서술이므로, 본문 자체의 상징 언어를 보존해 장 전체가 제공하는 해석을 따르도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
