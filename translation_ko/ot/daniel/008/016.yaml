    rationale: אָדָם은 ‘사람, 인간’도 뜻하므로 ‘남자’만이 문자적 의미라고 단정하면 어휘 범위를 지나치게 좁힙니다. ‘한 남자의 음성’은 가능한 번역 대안으로 제시하는 것이 적절합니다.
