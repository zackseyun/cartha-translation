  text: וָ/אֶשְׁמַ֥ע קוֹל אָדָ֖ם בֵּ֣ין אוּלָ֑י וַ/יִּקְרָא֙ וַ/יֹּאמַ֔ר גַּבְרִיאֵ֕ל הָבֵ֥ן לְ/הַלָּ֖ז אֶת הַ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/016.yaml
  text: And I heard the voice of a man between the banks of the Ulai[a], and he called out and said, “Gabriel[c][b], make this one understand the vision.”
  footnotes:
  - marker: a
    text: Or, 'a human voice.' The Hebrew says literally 'the voice of a man.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'between Ulai' / 'between the sides of the Ulai,' likely referring to the space between its banks.
    reason: lexical_alternative
  - marker: c
    text: Or, 'make this one understand the vision.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 울라이 강둑 사이에서[b] 사람의 음성[a]을 들었고, 그가 외쳐 말했습니다. “가브리엘아, 이 사람에게 그 환상을 깨닫게 하라.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 남자의 음성’. 히브리어는 문자적으로 ‘사람의 음성’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘울라이 사이에서’. 문맥상 울라이 물길의 양 강둑 사이를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이 사람으로 하여금 그 환상을 이해하게 하라’. 히브리어 동사는 ‘이해하게 하다’라는 사역의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל אָדָם
  english_pob_choice: the voice of a man
  chosen_korean: 사람의 음성
  alternatives_korean:
  - 한 남자의 음성
  - 인간의 음성
  lexicon: HALOT
  rationale: קוֹל은 ‘음성/소리’, אָדָם은 여기서 구체적인 사람을 가리키므로, 자연스러운 한국어로 ‘사람의 음성’이라고 옮겼습니다. 영어의 gender-accurate 취지를 살리되 과도하게 성별을 드러내지 않았습니다.
- source_word: בֵּין אוּלָי
  english_pob_choice: between the banks of the Ulai
  chosen_korean: 울라이 강 사이에서
  alternatives_korean:
  - 울라이의 강둑 사이에서
  - 울라이 강둑 사이에서
  lexicon: HALOT
  rationale: בֵּין은 ‘사이에서’이고, אוּלָי는 울라이라는 지명입니다. 본문 맥락상 강/수로의 공간을 가리키므로 한국어에서는 간결하게 ‘울라이 강 사이에서’라고 하여 의미를 드러냈습니다.
- source_word: הָבֵן
  english_pob_choice: make this one understand
  chosen_korean: 이 사람에게 그 환상을 깨닫게 하라
  alternatives_korean:
  - 이 사람으로 하여금 그 환상을 이해하게 하라
  - 이 사람을 그 환상을 알게 하라
  lexicon: HALOT
  rationale: 히필 명령형의 사역 의미를 살려 단순히 ‘이해하라’가 아니라 ‘깨닫게 하라’로 옮겼습니다. 대상은 문맥상 다니엘이므로 ‘이 사람에게’라고 하여 영어 POB의 지시 대상을 반영했습니다.
- source_word: אֶת הַמַּרְאֶה
  english_pob_choice: the vision
  chosen_korean: 그 환상
  alternatives_korean:
  - 그 이상
  - 그 보이는 것
  lexicon: HALOT
  rationale: 다니엘서의 묵시 문맥에서는 מַרְאֶה가 ‘환상’이 가장 자연스럽고 문맥에 맞습니다. ‘환상’은 계시의 내용을 분명히 드러냅니다.
theological_decisions:
- issue: 가브리엘의 직접 발화에서의 호칭과 명령문 어조
  chosen_reading: “가브리엘아, 이 사람에게 그 환상을 깨닫게 하라.”
  alternative_readings:
  - “가브리엘, 이 사람으로 하여금 그 환상을 이해하게 하라.”
  - “가브리엘아, 이 사람을 그 환상을 알게 하라.”
  rationale: 천사의 이름을 직접 부르는 호격을 한국어로 자연스럽게 살리면서, 명령문의 사역적 의미를 유지했습니다. 본문은 회화적 직접 발화이므로 간결한 명령형이 적절합니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: imperative causation'
