  rationale: 왕권적 통치력을 가리키므로, 한국어에서는 ‘권세’가 반복되는 통치 개념을 간결하게 살립니다.
- source_word: וִיקָר
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 위엄
  lexicon: HALOT
  rationale: 왕적·신학적 고양감을 주는 표준 번역으로 ‘영광’을 택했습니다.
- source_word: יִפְלְחוּן
  english_pob_choice: should serve him
  chosen_korean: 섬기게 하려는 것입니다
  alternatives_korean:
  - 섬기도록 하려는 것입니다
  - 예배하게 하려는 것입니다
  - 경배하게 하려는 것입니다
  lexicon: HALOT
  rationale: 이 동사는 정치적 복종과 종교적 섬김 모두를 포함할 수 있으므로, POB의 긴장을 살려 ‘섬기다’로 두고 목적을 나타내는 문맥에 맞춰 옮겼습니다.
theological_decisions:
- issue: יִפְלְחוּן의 의미를 예배로 확정할지 여부
  chosen_reading: ‘섬기게 하려는 것입니다’로 두어, 단순 정치적 복종과 예배적 섬김의 가능성을 함께 열어 둡니다.
  alternative_readings:
  - 예배하게 하려는 것입니다
  - 경배하게 하려는 것입니다
  - 복종하게 하려는 것입니다
  rationale: 아람어 동사는 예배를 포함할 수 있지만, 본문만으로 그 의미를 단정하면 해석을 앞서게 됩니다. 따라서 원문의 신학적 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
