base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/014.yaml
  text: And to him was given dominion and glory and a kingdom[a], that all peoples, nations, and languages should serve him. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
  footnotes:
  - marker: a
    text: Or 'worship him' or 'pay homage to him.' The Aramaic verb can denote service, including religious service, so the exact nuance may include more than political submission.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 권세와 영광과 나라가 주어졌습니다[a]. 모든 백성과 민족과 언어를 가진 사람들이 그를 섬기게 하려는 것입니다. 그의 권세는 영원한 권세이며, 사라지지 않을 것이고, 그의 나라는 멸망하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 예배하게 하려는 것입니다’ 혹은 ‘그에게 경의를 표하게 하려는 것입니다.’ 이 아람어 동사는 섬김을 뜻하며, 종교적 섬김도 포함할 수 있으므로 정확한 뉘앙스에는 그 이상이 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִיב
  english_pob_choice: was given
  chosen_korean: 주어졌습니다
  alternatives_korean:
  - 주셨습니다
  - 받았습니다
  lexicon: HALOT
  rationale: 주어짐을 나타내는 수동적 의미를 살려, 그에게 권세와 나라가 부여되었다는 문맥을 자연스럽게 옮겼습니다.
- source_word: שָׁלְטָן
  english_pob_choice: dominion
  chosen_korean: 권세
  alternatives_korean:
  - 통치
  - 지배
  - 주권
  lexicon: HALOT
  rationale: 왕권적 통치력을 가리키므로, 한국어에서는 ‘권세’가 반복되는 통치 개념을 간결하게 살립니다.
- source_word: וִיקָר
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 위엄
  lexicon: HALOT
  rationale: 왕적·신학적 고양감을 주는 표준 번역으로 ‘영광’을 택했습니다.
- source_word: יִפְלְחוּן
  english_pob_choice: should serve him
  chosen_korean: 섬기게 하려는 것입니다
  alternatives_korean:
  - 섬기도록 하려는 것입니다
  - 예배하게 하려는 것입니다
  - 경배하게 하려는 것입니다
  lexicon: HALOT
  rationale: 이 동사는 정치적 복종과 종교적 섬김 모두를 포함할 수 있으므로, POB의 긴장을 살려 ‘섬기다’로 두고 목적을 나타내는 문맥에 맞춰 옮겼습니다.
theological_decisions:
- issue: יִפְלְחוּן의 의미를 예배로 확정할지 여부
  chosen_reading: ‘섬기게 하려는 것입니다’로 두어, 단순 정치적 복종과 예배적 섬김의 가능성을 함께 열어 둡니다.
  alternative_readings:
  - 예배하게 하려는 것입니다
  - 경배하게 하려는 것입니다
  - 복종하게 하려는 것입니다
  rationale: 아람어 동사는 예배를 포함할 수 있지만, 본문만으로 그 의미를 단정하면 해석을 앞서게 됩니다. 따라서 원문의 신학적 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
