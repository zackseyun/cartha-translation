id: DAN.7.9
reference: Daniel 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֗ית עַ֣ד דִּ֤י כָרְסָוָן֙ רְמִ֔יו וְ/עַתִּ֥יק יוֹמִ֖ין יְתִ֑ב לְבוּשֵׁ֣/הּ כִּ/תְלַ֣ג חִוָּ֗ר וּ/שְׂעַ֤ר רֵאשֵׁ/הּ֙ כַּ/עֲמַ֣ר נְקֵ֔א כָּרְסְיֵ/הּ֙ שְׁבִיבִ֣ין דִּי נ֔וּר גַּלְגִּלּ֖וֹ/הִי נ֥וּר דָּלִֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/009.yaml
  text: I kept watching until thrones were set in place[a], and the Ancient of Days took his seat. His clothing was white as snow, and the hair of his head was like pure wool. His throne was flames of fire[b]; its wheels were a burning fire.
  footnotes:
  - marker: a
    text: Or, 'thrones were placed.' The traditional rendering 'thrones were cast down' is less likely here because the scene immediately depicts the heavenly court being convened.
    reason: alternative_reading
  - marker: b
    text: Aramaic 'Ancient of Days,' a title emphasizing great age and eternal majesty.
    reason: cultural_note
translation:
  language: ko
  text: 내가 계속 보고 있을 때에 보좌들이 놓였고[a], 옛적부터 항상 계신 이께서 앉으셨습니다. 그의 옷은 눈처럼 희었고, 그의 머리털은 깨끗한 양털 같았습니다. 그의 보좌는 불꽃이었고[b], 그 바퀴들은 타오르는 불이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보좌들이 놓였습니다.’ 전통적인 ‘보좌들이 던져졌다’는 이 장면에서 하늘 법정이 소집되는 흐름과는 덜 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 아람어 ‘옛적부터 항상 계신 이’는 오래된 나이 자체보다 영원한 위엄과 신적 존귀를 드러내는 칭호입니다.
    reason: theological_note
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  english_pob_choice: I kept watching
  chosen_korean: 내가 계속 보고 있을 때에
  alternatives_korean:
  - 내가 보고 있었을 때에
  - 내가 계속 지켜보고 있을 때에
  lexicon: HALOT
  rationale: 지속적으로 이어지는 환상 관찰의 뉘앙스를 살리기 위해 단순 과거보다 진행성을 드러냈습니다.
- source_word: כָרְסָוָן רְמִיו
  english_pob_choice: thrones were set in place
  chosen_korean: 보좌들이 놓였고
  alternatives_korean:
  - 보좌들이 세워졌고
  - 보좌들이 던져졌고
  lexicon: HALOT
  rationale: 이 문맥은 하늘 법정의 개시이므로 ‘던져졌다’보다 ‘놓였다/세워졌다’가 원문의 장면에 더 잘 맞습니다.
- source_word: וְעַתִּיק יוֹמִין
  english_pob_choice: the Ancient of Days
  chosen_korean: 옛적부터 항상 계신 이
  alternatives_korean:
  - 옛날의 이
  - 항상 옛적의 이
  lexicon: HALOT
  rationale: 단순 연령이 아니라 영원성과 위엄을 드러내는 호칭이므로, 한국어에서는 의미를 풀어 살리되 고유 칭호성을 유지했습니다.
- source_word: לְבוּשֵׁהּ כִּתְלַג חִוָּר
  english_pob_choice: His clothing was white as snow
  chosen_korean: 그의 옷은 눈처럼 희었고
  alternatives_korean:
  - 그의 의복은 눈처럼 하얘졌고
  - 그의 옷은 눈같이 희었고
  lexicon: HALOT
  rationale: 눈과의 직유를 자연스러운 현대 한국어로 옮기되, 색채 이미지의 즉시성을 유지했습니다.
- source_word: וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא
  english_pob_choice: the hair of his head was like pure wool
  chosen_korean: 그의 머리털은 깨끗한 양털 같았습니다
  alternatives_korean:
  - 그의 머리털은 순수한 양털 같았습니다
  - 그의 머리털은 하얀 양털 같았습니다
  lexicon: HALOT
  rationale: נְקֵא의 ‘깨끗한/순수한’ 의미를 반영해 단순한 색상보다 원문 대비를 살렸습니다.
- source_word: כָּרְסְיֵהּ שְׁבִיבִין דִּי נוּר
  english_pob_choice: His throne was flames of fire
  chosen_korean: 그의 보좌는 불꽃이었고
  alternatives_korean:
  - 그의 보좌는 불꽃의 불이었고
  - 그의 보좌는 불의 불꽃이었고
  lexicon: HALOT
  rationale: שְׁבִיבִין의 불길 이미지를 간결하게 살리면서, 이어지는 바퀴 묘사와 함께 장엄한 법정-전차 보좌의 시각적 충격을 유지했습니다.
- source_word: גַּלְגִּלּוֹהִי נוּר דָּלִק
  english_pob_choice: its wheels were a burning fire
  chosen_korean: 그 바퀴들은 타오르는 불이었습니다
  alternatives_korean:
  - 그 바퀴들은 불타는 불이었습니다
  - 그 바퀴들은 활활 타는 불이었습니다
  lexicon: HALOT
  rationale: 바퀴에 대한 원문의 불붙은 이미지와 움직임을 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 위칭 구문과 하늘 법정 장면에서의 보좌 배치
  chosen_reading: ‘보좌들이 놓였고’로 읽어, 심판을 위한 하늘 회의가 열리는 장면으로 드러냈습니다.
  alternative_readings:
  - ‘보좌들이 던져졌고’
  - ‘보좌들이 세워졌고’
  rationale: 문맥상 즉시 이어지는 것은 야훼의 법정 개회이며, ‘던져졌다’는 한국어에서 무질서한 투척 이미지를 강하게 불러 원문의 장면과 충돌할 수 있습니다.
  doctrine_reference: 하늘 법정/종말론적 심판의 문맥 보존
- issue: ‘Ancient of Days’의 칭호성
  chosen_reading: ‘옛적부터 항상 계신 이’로 옮겨, 단순한 노년 묘사가 아니라 영원한 존엄의 호칭임을 드러냈습니다.
  alternative_readings:
  - ‘옛날부터 계신 이’
  - ‘항상 옛적의 이’
  rationale: 이 표현은 하나님/신적 존재의 칭호로 기능하므로, 설명적 번역을 통해 의미를 보존했습니다.
  doctrine_reference: 신적 칭호의 존엄성과 영원성
