- from: 내가 계속 보고 있을 때에 보좌들이 놓였고[a], 옛적부터 항상 계신 이께서 앉으셨습니다. 그의 옷은 눈처럼 희었고, 그의 머리털은 깨끗한 양털 같았습니다. 그의 보좌는 불꽃이었고[b], 그 바퀴들은 타오르는 불이었습니다.
  to: 나는 보좌들이 놓일 때까지 계속 보고 있었습니다. 옛적부터 계신 이께서 자리에 앉으셨습니다[a] 그의 옷은 눈처럼 희었고, 그의 머리털은 깨끗한 양털 같았습니다. 그의 보좌는 불꽃이었고, 그 바퀴들은 타오르는 불이었습니다.
  rationale: 원문의 עַד דִּי를 ‘~할 때까지’로 반영하고, 신적 칭호에 붙은 해설 각주를 올바른 위치로 옮겼습니다. ‘옛적부터 계신 이’는 원문의 칭호성을 유지하면서도 현대 한국어에서 자연스럽고, ‘항상’이라는 해석적 보강을 피합니다. 그 밖의 불·보좌 이미지는 원문의 모호성과 장엄한 묘사를 보존하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
