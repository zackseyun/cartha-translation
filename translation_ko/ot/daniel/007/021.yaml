base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/021.yaml
  text: I kept watching[a], and that horn was making war with the holy ones and was prevailing over them,
  footnotes:
  - marker: a
    text: Or 'the saints' or 'God’s holy people.' The Aramaic literally says 'the holy ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 계속 보고 있는데, 그 뿔이 거룩한 이들과 싸우고 있었고 그들을 이기고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 이들’은 직역으로, 전통적으로는 ‘성도들’ 또는 ‘하나님의 거룩한 백성’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  english_pob_choice: I kept watching
  chosen_korean: 내가 계속 보고 있는데
  alternatives_korean:
  - 내가 보고 있었는데
  - 내가 계속 지켜보고 있는데
  lexicon: HALOT
  rationale: 아람어의 진행·지속적 과거를 한국어로 자연스럽게 살려, 단순 과거보다 지속성을 드러내는 표현을 택했습니다.
- source_word: וְקַרְנָא דִכֵּן
  english_pob_choice: and that horn
  chosen_korean: 그 뿔
  alternatives_korean:
  - 그 같은 뿔
  - 그 저 뿔
  lexicon: HALOT
  rationale: 지시어 דִכֵּן의 문맥상 지시 기능을 반영해, 앞서 언급된 뿔을 가리키는 자연스러운 한국어로 옮겼습니다.
- source_word: עָבְדָה קְרָב עִם
  english_pob_choice: was making war with
  chosen_korean: 싸우고 있었고
  alternatives_korean:
  - 전쟁을 벌이고 있었고
  - 전쟁을 하고 있었고
  lexicon: HALOT
  rationale: ‘전쟁을 만들다’라는 관용을 직역하기보다, 전투 행위를 자연스럽게 풀어 한국어로 옮기되 지속성을 유지했습니다.
- source_word: קַדִּישִׁין
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도들
  - 거룩한 사람들
  lexicon: HALOT
  rationale: 본문의 아람어를 보다 투명하게 드러내기 위해 전통적 교회 용어인 ‘성도’보다 직역에 가까운 표현을 택했습니다.
- source_word: וְיָכְלָה לְהוֹן
  english_pob_choice: and was prevailing over them
  chosen_korean: 그들을 이기고 있었습니다
  alternatives_korean:
  - 그들보다 우세하고 있었습니다
  - 그들을 능가하고 있었습니다
  lexicon: HALOT
  rationale: ‘능히 하다/이기다/우세하다’의 의미를 문맥에 맞게 반영하여, 비전 서술의 진행성을 살린 현재완료적 뉘앙스를 피하지 않으면서 옮겼습니다.
theological_decisions:
- issue: קַדִּישִׁין의 대상 범위
  chosen_reading: 거룩한 이들
  alternative_readings:
  - 성도들
  - 하나님의 거룩한 백성
  rationale: 다니엘의 환상에서 이 표현은 공동체적 백성과 천상적 거룩한 존재를 모두 열어 둘 수 있으므로, 해석을 좁히지 않는 직역을 유지했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
