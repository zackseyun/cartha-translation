id: DAN.7.26
reference: Daniel 7:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דִינָ֖/א יִתִּ֑ב וְ/שָׁלְטָנֵ֣/הּ יְהַעְדּ֔וֹן לְ/הַשְׁמָדָ֥ה וּ/לְ/הוֹבָדָ֖ה עַד סוֹפָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/026.yaml
  text: But the court will sit[a], and his dominion will be taken away[c][b], to be destroyed and annihilated to the end.
  footnotes:
  - marker: a
    text: Or "the judgment will sit"; the Aramaic may emphasize either the convening of the court or the judicial session itself.
    reason: lexical_alternative
  - marker: b
    text: Or "his rule" or "his authority."
    reason: lexical_alternative
  - marker: c
    text: Or "until the end"; the phrase underscores the finality of the judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 재판정이 열리고, 그의 통치는 빼앗겨서 끝까지 파멸되고 멸망할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “재판이 앉을 것입니다.” 아람어는 법정의 개정 자체와 재판 행위 자체를 함께 강조할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “그의 지배권”이나 “그의 권위.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “끝까지.” 이 표현은 심판의 최종성을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִינָא
  english_pob_choice: the court
  chosen_korean: 재판정
  alternatives_korean:
  - 법정
  - 재판이
  lexicon: HALOT
  rationale: 아람어 דִינָא는 판결 자체보다 재판을 행하는 법정/재판정의 의미를 가질 수 있으므로, 문맥의 ‘앉다’에 맞춰 재판장이 열리는 장면을 살렸습니다.
- source_word: יִתִּב
  english_pob_choice: will sit
  chosen_korean: 열리고
  alternatives_korean:
  - 앉을 것입니다
  - 자리를 잡을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘앉다’이지만, 여기서는 법정이 소집되어 심리가 시작되는 그림이므로 한국어로 자연스러운 ‘열리고’를 택했습니다.
- source_word: שָׁלְטָנֵהּ
  english_pob_choice: his dominion
  chosen_korean: 그의 통치
  alternatives_korean:
  - 그의 지배권
  - 그의 주권
  lexicon: HALOT
  rationale: 이 단어는 다니엘 7장의 왕권·지배력을 가리키므로, 권세보다 넓고 문맥에 맞는 ‘통치’로 옮겼습니다.
- source_word: יְהַעְדּוֹן
  english_pob_choice: will be taken away
  chosen_korean: 빼앗겨서
  alternatives_korean:
  - 빼앗길 것입니다
  - 거두어져서
  lexicon: HALOT
  rationale: 주어를 명시하지 않은 불특정 행위의 결과를 한국어 수동/피동 감각으로 살려, 통치권이 제거되는 효과를 분명히 했습니다.
- source_word: לְהַשְׁמָדָה וּלְהוֹבָדָה
  english_pob_choice: to be destroyed and annihilated
  chosen_korean: 파멸되고 멸망할 것입니다
  alternatives_korean:
  - 파괴되고 소멸될 것입니다
  - 멸절되고 무너질 것입니다
  lexicon: HALOT
  rationale: 연속된 두 부정사구는 완전한 폐기를 강조하므로, ‘파멸’과 ‘멸망’의 중첩으로 강도를 살렸습니다.
- source_word: עַד סוֹפָא
  english_pob_choice: to the end
  chosen_korean: 끝까지
  alternatives_korean:
  - 끝에 이르도록
  - 최후까지
  lexicon: HALOT
  rationale: 직역의 ‘끝까지’는 심판의 최종성과 종결성을 간결하게 전달합니다.
theological_decisions:
- issue: 법정/재판정 이미지와 심판의 주체를 어떻게 드러낼지
  chosen_reading: 본문은 추상적 ‘심판’보다 하늘 법정의 개정과 판결 집행을 함께 보여 주므로, ‘재판정이 열리고’로 법정 이미지와 사건성을 살렸습니다.
  alternative_readings:
  - ‘심판이 행해지고’로 더 추상적으로 옮길 수 있습니다.
  - ‘재판이 시작되고’로 할 수도 있습니다.
  rationale: 다니엘 7장의 문맥은 단순 선언이 아니라 왕권 교체를 선고하는 법정 장면이므로, 장면성을 유지하는 번역이 원문의 힘을 보존합니다.
  doctrine_reference: 다니엘 7장의 하늘 법정 모티프 유지
- issue: ‘his dominion’의 범위
  chosen_reading: ‘그의 통치’는 앞선 짐승/뿔 문맥의 개인적 지배권을 가리키되, 본문이 그 정체를 더 확장해 설명하지는 않도록 그대로 유지했습니다.
  alternative_readings:
  - ‘그의 나라’로 더 넓게 볼 수 있습니다.
  - ‘그의 권세’로 보다 추상화할 수 있습니다.
  rationale: 문맥상 개별 폭군의 지배와 왕국 전체의 운명이 겹치지만, 본문이 유지하는 단수 지시를 보존해 해석을 과도하게 확정하지 않았습니다.
  doctrine_reference: 본문이 드러내는 종말 심판의 범위와 지시 대상 보존
