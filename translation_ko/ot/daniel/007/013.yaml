  source_fidelity: 핵심 어휘와 동작의 순서는 대체로 충실합니다. 다만 ‘옛적부터 항상 계신 이’는 עַתִּיק יוֹמַיָּא의 관용적 칭호에 ‘항상’을 덧붙여 다소 과잉 해석적이며, הַקְרְבוּהִי의 복수 주어는 띄어쓰기 오류 없이 유지되어야 합니다. 원문의 비교 표현과 עִם(‘함께’)의 의미는 보존했습니다.
  naturalness: 초안의 ‘그들 이’는 명백한 띄어쓰기 오류이며, ‘그를 그 앞에 가까이 인도했습니다’는 ‘그’의 지시 대상과 ‘가까이’의 수식 관계가 다소 어색합니다. 문장을 나누고 ‘그분 앞으로 가까이 데려갔습니다’로 옮기면 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘사람의 아들과 같은 이’는 כְּבַר אֱנָשׁ의 비교를 보존하면서 한국어 문법상 ‘사람의 아들 같은 이’보다 명료합니다. עַתִּיק יוֹמַיָּא는 널리 쓰이는 ‘옛적부터 계신 이’로 정리했습니다. 각주 a는 본문과 동일한 표현을 ‘직역’이라고 설명하므로, 실제 대안인 ‘사람 같은 이’를 제시하도록 고쳤습니다.
