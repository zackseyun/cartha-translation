  lexicon: HALOT
  rationale: 아람어의 진행·지속적 과거를 살려, 단발적 완료보다 계속성을 드러내는 표현을 택했습니다.
- source_word: בְּחֶזְוֵי לֵילְיָא
  english_pob_choice: in the visions of the night
  chosen_korean: 밤의 환상들 가운데서
  alternatives_korean:
