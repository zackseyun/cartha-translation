  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָזֵ֤ה הֲוֵית֙ בְּ/חֶזְוֵ֣י לֵֽילְיָ֔/א וַ/אֲרוּ֙ עִם עֲנָנֵ֣י שְׁמַיָּ֔/א כְּ/בַ֥ר אֱנָ֖שׁ אָתֵ֣ה הֲוָ֑ה וְ/עַד עַתִּ֤יק יֽוֹמַיָּ/א֙ מְטָ֔ה וּ/קְדָמ֖וֹ/הִי הַקְרְבֽוּ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/013.yaml
  text: I kept looking in the visions of the night[a], and behold, with the clouds of heaven one like a son of man was coming, and he came to the Ancient of Days[b], and they brought him near before him.
  footnotes:
  - marker: a
    text: Or, 'one like a human being.' The Aramaic literally says 'like a son of man,' an expression that can denote a human figure and later becomes a significant messianic title in biblical interpretation.
    reason: lexical_alternative
  - marker: b
    text: Traditionally, 'on the clouds of heaven.' The Aramaic preposition here is 'with,' which may describe accompaniment rather than explicitly stating motion upon the clouds.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 밤의 환상들 가운데서 계속 보고 있었는데, 보라, 하늘의 구름과 함께 사람의 아들 같은 이가 오고 있었고, 그는 옛적부터 항상 계신 이에게 이르렀으며, 그들 이 그를 그 앞에 가까이 인도했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들 같은 이’입니다. 아람어 표현은 인간 형상을 가리킬 수도 있고, 성경 해석 전통에서 중요한 메시아적 호칭으로 발전하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘하늘의 구름 위에’로 옮기기도 합니다. 그러나 여기의 아람어 전치사는 ‘함께’에 가까워, 구름 위를 달리는 이미지를 직접 말한다기보다 동반을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  english_pob_choice: I kept looking
  chosen_korean: 계속 보고 있었습니다
  alternatives_korean:
  - 보고 있었습니다
  - 지켜보고 있었습니다
  lexicon: HALOT
  rationale: 아람어의 진행·지속적 과거를 살려, 단발적 완료보다 계속성을 드러내는 표현을 택했습니다.
- source_word: בְּחֶזְוֵי לֵילְיָא
  english_pob_choice: in the visions of the night
  chosen_korean: 밤의 환상들 가운데서
  alternatives_korean:
  - 밤 환상들 가운데서
  - 밤에 본 환상들 가운데서
  lexicon: HALOT
  rationale: 복수형 ‘환상들’과 ‘밤’의 관계를 유지하면서도 한국어에서 자연스럽게 읽히는 구조로 옮겼습니다.
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  english_pob_choice: with the clouds of heaven
  chosen_korean: 하늘의 구름과 함께
  alternatives_korean:
  - 하늘의 구름과
  - 하늘 구름들과 함께
  lexicon: HALOT
  rationale: 전치사 עִם의 ‘함께’라는 의미를 살려, 전통적 ‘구름 위에’가 아니라 동반의 뉘앙스를 반영했습니다.
- source_word: כְּבַר אֱנָשׁ
  english_pob_choice: one like a son of man
  chosen_korean: 사람의 아들 같은 이
  alternatives_korean:
  - 인자 같은 이
  - 사람 같은 이
  lexicon: HALOT
  rationale: 원문의 비교적 표현을 유지하면서도 한국어에서 자연스럽게 읽히도록 ‘같은 이’로 풀었습니다. 전통적 용어인 ‘인자’는 오해 없이 읽히는 경우가 제한적이어서 본문에서는 더 직접적인 표현을 택했습니다.
- source_word: וּקְדָמוֹהִי הַקְרְבוּהִי
  english_pob_choice: they brought him near before him
  chosen_korean: 그를 그 앞에 가까이 인도했습니다
  alternatives_korean:
  - 그를 그 앞에 가까이 데려갔습니다
  - 그를 그 앞에 데려왔습니다
  lexicon: HALOT
  rationale: ‘가까이 인도하다’는 의미를 살리되 한국어에서 자연스러운 서술로 다듬었습니다. 주어가 명시되지 않은 복수형의 느낌도 ‘그들 이’로 반영했습니다.
theological_decisions:
- issue: ‘인자’ 표현의 처리
  chosen_reading: 사람의 아들 같은 이
  alternative_readings:
  - 인자 같은 이
  - 사람 같은 이
  rationale: 이 절의 아람어 표현은 문자적으로 ‘사람의 아들’에 가깝지만, 본문 자체는 아직 칭호를 해설하지 않습니다. 그래서 후대의 해석 전통을 과도하게 앞서지 않으면서도, 비교적 의미를 분명히 드러내는 표현을 사용했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
- issue: ‘구름 위에’ 대신 ‘구름과 함께’
  chosen_reading: 하늘의 구름과 함께
  alternative_readings:
  - 하늘의 구름 위에
  rationale: 원문 전치사 עִם의 기본 뜻을 따랐습니다. 메시아적/종말론적 전통에서 익숙한 표현보다 소스 언어의 방향성을 우선해, 본문이 말하는 동반 이미지를 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3
