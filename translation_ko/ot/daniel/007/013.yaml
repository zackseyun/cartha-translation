  - 밤에 본 환상들 가운데서
  lexicon: HALOT
  rationale: 복수형 ‘환상들’과 ‘밤’의 관계를 유지하면서도 한국어에서 자연스럽게 읽히는 구조로 옮겼습니다.
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  english_pob_choice: with the clouds of heaven
  chosen_korean: 하늘의 구름과 함께
  alternatives_korean:
  - 하늘의 구름과
  - 하늘 구름들과 함께
  lexicon: HALOT
  rationale: 전치사 עִם의 ‘함께’라는 의미를 살려, 전통적 ‘구름 위에’가 아니라 동반의 뉘앙스를 반영했습니다.
- source_word: כְּבַר אֱנָשׁ
  english_pob_choice: one like a son of man
  chosen_korean: 사람의 아들 같은 이
  alternatives_korean:
  - 인자 같은 이
  - 사람 같은 이
  lexicon: HALOT
  rationale: 원문의 비교적 표현을 유지하면서도 한국어에서 자연스럽게 읽히도록 ‘같은 이’로 풀었습니다. 전통적 용어인 ‘인자’는 오해 없이 읽히는 경우가 제한적이어서 본문에서는 더 직접적인 표현을 택했습니다.
- source_word: וּקְדָמוֹהִי הַקְרְבוּהִי
  english_pob_choice: they brought him near before him
  chosen_korean: 그를 그 앞에 가까이 인도했습니다
  alternatives_korean:
  - 그를 그 앞에 가까이 데려갔습니다
  - 그를 그 앞에 데려왔습니다
  lexicon: HALOT
  rationale: ‘가까이 인도하다’는 의미를 살리되 한국어에서 자연스러운 서술로 다듬었습니다. 주어가 명시되지 않은 복수형의 느낌도 ‘그들 이’로 반영했습니다.
theological_decisions:
- issue: ‘인자’ 표현의 처리
  chosen_reading: 사람의 아들 같은 이
  alternative_readings:
  - 인자 같은 이
  - 사람 같은 이
  rationale: 이 절의 아람어 표현은 문자적으로 ‘사람의 아들’에 가깝지만, 본문 자체는 아직 칭호를 해설하지 않습니다. 그래서 후대의 해석 전통을 과도하게 앞서지 않으면서도, 비교적 의미를 분명히 드러내는 표현을 사용했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
- issue: ‘구름 위에’ 대신 ‘구름과 함께’
  chosen_reading: 하늘의 구름과 함께
  alternative_readings:
  - 하늘의 구름 위에
  rationale: 원문 전치사 עִם의 기본 뜻을 따랐습니다. 메시아적/종말론적 전통에서 익숙한 표현보다 소스 언어의 방향성을 우선해, 본문이 말하는 동반 이미지를 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3
