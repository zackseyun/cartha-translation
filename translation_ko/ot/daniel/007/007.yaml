  text: בָּאתַ֣ר דְּנָה֩ חָזֵ֨ה הֲוֵ֜ית בְּ/חֶזְוֵ֣י לֵֽילְיָ֗/א וַ/אֲר֣וּ חֵיוָ֣ה רביעיה דְּחִילָה֩ וְ/אֵֽימְתָנִ֨י וְ/תַקִּיפָ֜א יַתִּ֗ירָא וְ/שִׁנַּ֨יִן דִּֽי פַרְזֶ֥ל לַ/הּ֙ רַבְרְבָ֔ן אָֽכְלָ֣ה וּ/מַדֱּקָ֔ה וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה וְ/הִ֣יא מְשַׁנְּיָ֗ה מִן כָּל חֵֽיוָתָ/א֙ דִּ֣י קָֽדָמַ֔י/הּ וְ/קַרְנַ֥יִן עֲשַׂ֖ר לַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
  footnotes:
  - marker: a
    text: Or 'fearsome' for 'terrifying,' and 'extremely powerful' for 'exceedingly strong.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and the remainder it trampled with its feet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 후에 내가 밤의 환상들 속에서 계속 보는데, 보라, 넷째 짐승이 나타났습니다. 그것은 무섭고 두렵고 지극히 강했습니다. 그에게는 큰 철 이빨이 있었고, 그것은 삼키고 부수고, 남은 것은 자기 발로 짓밟았습니다. 그것은 자기 앞에 있던 모든 짐승과 달랐고, 열 뿔이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무서운’으로, ‘지극히 강한’은 ‘매우 강한’으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘남은 것을 자기 발로 짓밟았습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  lexicon: HALOT
  rationale: 시간적 전환을 자연스러운 현대 한국어로 옮기되, 앞선 환상 장면 다음에 이어지는 순서를 분명히 했습니다.
- source_word: חָזֵה הֲוֵית
  english_pob_choice: I kept looking
  chosen_korean: 내가 ... 계속 보는데
  alternatives_korean:
  - 내가 보고 있는데
  - 내가 계속 보고 있었습니다
  lexicon: HALOT
  rationale: 진행 중인 시각적 관찰의 지속성을 살리기 위해 단순 과거보다 ‘계속 보는데’로 옮겼습니다.
- source_word: דְּחִילָה וְאֵימְתָנִי וְתַקִּיפָא יַתִּירָא
  english_pob_choice: terrifying and dreadful and exceedingly strong
  chosen_korean: 무섭고 두렵고 지극히 강했습니다
  alternatives_korean:
  - 두렵고 무섭고 매우 강했습니다
  - 공포스럽고 두렵고 대단히 강했습니다
  lexicon: HALOT
  rationale: 세 겹의 강한 형용사를 과도하게 풀이하지 않으면서도, 압도적 위세를 갖는 짐승의 인상을 유지했습니다.
- source_word: וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה
  english_pob_choice: and it trampled what was left with its feet
  chosen_korean: 남은 것은 자기 발로 짓밟았습니다
  alternatives_korean:
  - 남은 것을 자기 발로 밟아 짓밟았습니다
  - 남은 것들을 자기 발로 밟았습니다
  lexicon: HALOT
  rationale: שְׁאָרָא의 잔존 대상을 자연스럽게 ‘남은 것’으로 옮기고, רָפְסָה의 폭력적 이미지를 ‘짓밟았습니다’로 드러냈습니다.
- source_word: מְשַׁנְּיָה מִן כָּל חֵיוָתָא דִּי קָדָמַיּהּ
  english_pob_choice: It was different from all the beasts that were before it
  chosen_korean: 자기 앞에 있던 모든 짐승과 달랐고
  alternatives_korean:
  - 앞서 있던 모든 짐승과 달랐고
  - 자기 이전의 모든 짐승과 달랐고
  lexicon: HALOT
  rationale: 단순한 시간 순서보다 ‘자기 앞에 있던’이 문맥상 더 자연스럽고, 기존 짐승들과의 구별을 분명히 합니다.
theological_decisions:
- issue: 짐승의 정체를 번역문에 해석적으로 특정할지 여부
  chosen_reading: 본문의 상징 이미지를 그대로 살려, 넷째 짐승의 무시무시함과 차별성만 드러냈습니다.
  alternative_readings:
  - 로마 제국 등 역사적 동일시를 번역문에 반영
  - 종말론적 복합 제국으로 구체화
  rationale: 이 절 자체는 짐승의 성격을 묘사할 뿐 정체를 명시하지 않으므로, 해석은 주석에 맡기고 본문은 상징을 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 상징성과 해석의 여지를 보존합니다.
