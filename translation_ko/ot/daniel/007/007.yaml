base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
  footnotes:
  - marker: a
    text: Or 'fearsome' for 'terrifying,' and 'extremely powerful' for 'exceedingly strong.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and the remainder it trampled with its feet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 내가 밤의 환상들 가운데서 계속 보고 있었습니다. 그런데 보니, 넷째 짐승이 있었는데, 그것은 무섭고 두렵고 지극히 강했습니다.[a] 그것에는 철로 된 큰 이빨이 있었고, 그것은 삼키고 부수고, 남은 것을 자기 발로 짓밟았습니다.[b] 그것은 그보다 앞서 있던 모든 짐승과 달랐고, 열 뿔이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무서운’으로, ‘지극히 강한’은 ‘매우 강한’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘남은 것을 자기 발로 짓밟았습니다’.
    reason: lexical_alternative
