- from: 이 일 후에 내가 밤의 환상들 속에서 계속 보는데, 보라, 넷째 짐승이 나타났습니다. 그것은 무섭고 두렵고 지극히 강했습니다. 그에게는 큰 철 이빨이 있었고, 그것은 삼키고 부수고, 남은 것은 자기 발로 짓밟았습니다. 그것은 자기 앞에 있던 모든 짐승과 달랐고, 열 뿔이 있었습니다.[a][b]
  to: 그 후에 내가 밤의 환상들 가운데서 계속 보고 있었습니다. 그런데 보니, 넷째 짐승이 있었는데, 그것은 무섭고 두렵고 지극히 강했습니다.[a] 그것에는 철로 된 큰 이빨이 있었고, 그것은 삼키고 부수고, 남은 것을 자기 발로 짓밟았습니다.[b] 그것은 그보다 앞서 있던 모든 짐승과 달랐고, 열 뿔이 있었습니다.
  rationale: 원문의 지속적 환시 서술과 וַאֲרוּ의 주의 환기 기능을 자연스러운 현대 합쇼체로 옮기고, 출현이라는 추가 의미를 제거했습니다. 각주 표지를 해당 대안의 대상 표현에 붙였으며, 앞선 짐승들이라는 시간적 관계를 명료하게 했습니다. b 각주는 본문과 동일한 대안을 제시하지만, 제공된 영어 감사 이력의 각주 내용을 의미 변경 없이 보존했습니다.
