theological_decisions:
- issue: 짐승의 정체를 번역문에 해석적으로 특정할지 여부
  chosen_reading: 본문의 상징 이미지를 그대로 살려, 넷째 짐승의 무시무시함과 차별성만 드러냈습니다.
  alternative_readings:
  - 로마 제국 등 역사적 동일시를 번역문에 반영
  - 종말론적 복합 제국으로 구체화
  rationale: 이 절 자체는 짐승의 성격을 묘사할 뿐 정체를 명시하지 않으므로, 해석은 주석에 맡기고 본문은 상징을 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 상징성과 해석의 여지를 보존합니다.
