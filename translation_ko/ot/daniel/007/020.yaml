revisions:
- from: 그리고 머리 위에 있던 열 뿔과, 그 뒤에 올라와서 그 앞에서 셋이 쓰러진 그 다른 뿔과, 눈이 있고 큰 말을 하는 입이 있으며, 그 모습이 그 동료들의 것보다 더 컸습니다.[a]
  to: 또 그 머리에 있던 열 뿔과, 그 뒤에 올라와 그 앞에서 셋이 쓰러진 다른 뿔, 곧 눈이 있고 큰 것들을 말하는 입[a]이 있으며 그 모습이 그 동료들보다 더 커 보였던 그 뿔에 관하여 알고 싶었습니다.
  rationale: 앞 절에서 이어지는 원문의 의존절을 한국어에서도 ‘알고 싶었습니다’로 명시하여 복원했습니다. 뒤에 올라온 뿔을 가리키는 수식들을 하나의 명사구로 묶었고, ‘큰 것들’을 말한다는 표현은 본문에 남겨 해석적 좁힘을 피했습니다. 각주 표지는 해당 어구 바로 뒤로 옮기고 문법을 바로잡았습니다.
