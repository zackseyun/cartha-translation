id: DAN.7.20
reference: Daniel 7:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙ דִּ֣י בְ/רֵאשַׁ֔/הּ וְ/אָחֳרִי֙ דִּ֣י סִלְקַ֔ת ו/נפלו מִן קדמי/ה תְּלָ֑ת וְ/קַרְנָ֨/א דִכֵּ֜ן וְ/עַיְנִ֣ין לַ֗/הּ וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/020.yaml
  text: and about the ten horns that were on its head[a], and the other horn that came up, before which three fell—the horn that had eyes and a mouth speaking great things, and whose appearance was greater than that of its companions.
  footnotes:
  - marker: a
    text: Or 'a mouth speaking boastful things' or 'uttering great boasts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 머리 위에 있던 열 뿔과, 그 뒤에 올라와서 그 앞에서 셋이 쓰러진 그 다른 뿔과, 눈이 있고 큰 말을 하는 입이 있으며, 그 모습이 그 동료들의 것보다 더 컸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자랑하는 말 하는 입’, 혹은 ‘큰 자랑을 내뱉는 입’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙
  english_pob_choice: the ten horns
  chosen_korean: 열 뿔
  alternatives_korean:
  - 열 개의 뿔
  - 그 열 뿔
  lexicon: HALOT
  rationale: 수사와 명사를 자연스럽게 결합해 다니엘의 상징적 이미지를 그대로 살렸습니다.
- source_word: וְ/אָחֳרִי֙ ... ו/נפלו מִן קדמי/ה תְּלָ֑ת
  english_pob_choice: the other horn ... before which three fell
  chosen_korean: 그 다른 뿔과, ... 그 앞에서 셋이 쓰러진
  alternatives_korean:
  - 또 하나의 뿔과, ... 그 앞에서 셋이 쓰러진
  - 뒤에 올라온 뿔과, ... 그 앞에서 셋이 쓰러진
  lexicon: HALOT
  rationale: אָחֳרִי의 대비적 의미를 살려 ‘그 다른 뿔’로 옮기고, ‘before which’는 대상이 된 뿔을 기준으로 ‘그 앞에서’로 자연스럽게 표현했습니다.
- source_word: וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן
  english_pob_choice: a mouth speaking great things
  chosen_korean: 큰 말을 하는 입
  alternatives_korean:
  - 큰 것들을 말하는 입
  - 거만한 말을 하는 입
  lexicon: HALOT
  rationale: 직역하면 ‘큰 것들’을 말하는 입이지만, 한국어에서는 의미가 드러나도록 ‘큰 말을 하는 입’으로 옮겨 어휘의 직역성과 자연스러움을 함께 살렸습니다.
- source_word: וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ
  english_pob_choice: whose appearance was greater than that of its companions
  chosen_korean: 그 모습이 그 동료들의 것보다 더 컸습니다
  alternatives_korean:
  - 그 모습이 그 동료들보다 더 컸습니다
  - 그 외양이 그 동료들의 것보다 더 컸습니다
  lexicon: HALOT
  rationale: חֶזְוָהּ의 시각적 외형을 ‘모습’으로 옮기고, רַב은 단순한 크기뿐 아니라 두드러짐을 포함할 수 있어 ‘더 컸습니다’로 보존했습니다.
theological_decisions:
- issue: רַבְרְבָן의 의미를 ‘자랑하는 것들’로 좁힐지 여부
  chosen_reading: 본문에는 ‘큰 말’로 두되, 노골적인 자랑의 해석은 본문 밖으로 미뤘습니다.
  alternative_readings:
  - 자랑하는 말
  - 큰 자랑
  rationale: 아람어 본문은 문자적으로 ‘큰 것들’이라 하므로, 본문은 과도하게 해석하지 않고 의미를 열어 둡니다. 다만 문맥상 오만한 발화로 읽힐 여지는 남깁니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
