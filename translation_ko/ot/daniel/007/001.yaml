  naturalness: ‘바빌론 왕 벨사살의 통치 첫해에’와 ‘침상에 있을 때’는 현대 표준 한국어 합쇼체 문장으로 자연스럽고, 원문의 범위를 불필요하게 좁히지 않습니다. 마지막 절은 ‘그 내용의 요지를 말했습니다’가 자연스럽습니다.
