id: DAN.7.1
reference: Daniel 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת חֲדָ֗ה לְ/בֵלְאשַׁצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל דָּנִיֵּאל֙ חֵ֣לֶם חֲזָ֔ה וְ/חֶזְוֵ֥י רֵאשֵׁ֖/הּ עַֽל מִשְׁכְּבֵ֑/הּ בֵּ/אדַ֨יִן֙ חֶלְמָ֣/א כְתַ֔ב רֵ֥אשׁ מִלִּ֖ין אֲמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/001.yaml
  text: In the first year of Belshazzar king of Babylon[a], Daniel saw a dream and visions in his head while on his bed. Then he wrote down the dream—the summary of the words he told.
  footnotes:
  - marker: a
    text: Or, more literally, 'Then he wrote the dream; he said the head of the words.' The Aramaic idiom likely means he recorded the main points or summary of the matter.
    reason: lexical_alternative
translation:
  language: ko
  text: 벨사살 왕 1년에 다니엘이 침상에서 잠을 자는 동안 꿈과 머릿속의 환상들을 보았습니다. 그때 그는 그 꿈을 적어 두고, 그 일의 요지를 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 일의 요지’는 아람어 관용구로, 문자적으로는 ‘말들의 머리’이지만 핵심 내용이나 요약을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה
  english_pob_choice: In the first year
  chosen_korean: 1년에
  alternatives_korean:
  - 첫해에
  - 제1년에
  lexicon: HALOT
  rationale: 아람어 날짜 공식의 관용적 표현을 한국어 자연문장에 맞게 옮기되, ‘첫해’의 의미가 분명하도록 숫자형 표현을 사용했습니다.
- source_word: חֵלֶם חֲזָה
  english_pob_choice: saw a dream
  chosen_korean: 꿈을 보았습니다
  alternatives_korean:
  - 꿈을 꾸었습니다
  - 꿈을 보았습니다
  lexicon: HALOT
  rationale: 원문은 직역하면 ‘꿈을 보았다’이므로, 환상적 체험의 시각성을 살려 ‘보았습니다’를 택했습니다.
- source_word: וְחֶזְוֵי רֵאשֵׁהּ
  english_pob_choice: visions in his head
  chosen_korean: 머릿속의 환상들
  alternatives_korean:
  - 머리의 환상들
  - 마음속 환상들
  lexicon: HALOT
  rationale: 아람어 관용구의 문자적 뜻을 지나치게 어색하게 옮기지 않으면서도, POB가 유지한 신체적 이미지와 내적 환상의 긴장을 살렸습니다.
- source_word: עַל מִשְׁכְּבֵהּ
  english_pob_choice: while on his bed
  chosen_korean: 침상에서 잠을 자는 동안
  alternatives_korean:
  - 침상 위에서
  - 침상에 누워 있는 동안
  lexicon: HALOT
  rationale: 단순한 위치 표지보다 꿈의 발생 상황을 한국어에서 더 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: רֵאשׁ מִלִּין אֲמַר
  english_pob_choice: the summary of the words he told
  chosen_korean: 그 일의 요지를 말했습니다
  alternatives_korean:
  - 그 말들의 머리말을 말했습니다
  - 그 말의 핵심을 말했습니다
  lexicon: HALOT
  rationale: 직역의 ‘머리/요지’ 관용구를 살리되, 본문의 뜻이 ‘핵심 내용’임을 한국어에서 바로 이해할 수 있게 했습니다.
theological_decisions:
- issue: 환상과 꿈의 병렬 표현
  chosen_reading: ‘꿈과 머릿속의 환상들’로 두 표현을 모두 살려, 단순한 일반 꿈이 아니라 계시적 체험의 이중성을 드러냈습니다.
  alternative_readings:
  - ‘꿈과 환상들’로 단순화
  - ‘꿈과 머리의 이상들’로 직역
  rationale: 본문은 꿈과 환상을 병치하므로, 둘 중 하나로 흡수하지 않고 함께 보존하는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 단 7장 환상 문맥
- issue: ‘말했습니다’의 해석
  chosen_reading: ‘그 일의 요지를 말했습니다’로, 단순 기록 행위와 구두 보고의 결합을 함께 반영했습니다.
  alternative_readings:
  - ‘그 꿈의 요지를 기록했습니다’
  - ‘그 일의 핵심을 전했습니다’
  rationale: 아람어 동사 אֲמַר은 직접적 ‘말하다’이지만, 앞의 기록 행위와 함께 읽을 때 내용 요약의 전달을 가리키는 것으로 보아 자연스럽게 옮겼습니다.
  doctrine_reference: 문맥상 서술 기능
- issue: 벨사살 표기
  chosen_reading: 고유명사는 현대 표기법에 따라 ‘벨사살’로 옮겼습니다.
  alternative_readings:
  - 벨사르
  - 벨사사르
  rationale: 이미 널리 쓰이는 성경 인명 표기를 따르되, 본문 의미에 개입하지 않는 범위에서 표준화했습니다.
  doctrine_reference: 고유명사 표기
