  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קִרְבֵ֗ת עַל חַד֙ מִן קָ֣אֲמַיָּ֔/א וְ/יַצִּיבָ֥א אֶבְעֵֽא מִנֵּ֖/הּ עַֽל כָּל דְּנָ֑ה וַ/אֲמַר לִ֕/י וּ/פְשַׁ֥ר מִלַּיָּ֖/א יְהוֹדְעִנַּֽ/נִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/016.yaml
  text: I approached one of those standing there and asked him the certainty about all this[b][a]. So he told me and made known to me the interpretation of the matter.
  footnotes:
  - marker: a
    text: Or 'the truth about all this'; the Aramaic term carries the sense of what is firm, certain, or true.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the interpretation of the words.' Here 'words' likely refers to the content or matter of the vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그곳에 서 있던 이들 가운데 한 사람에게 다가가 이 모든 일에 관한 진실을[a] 그에게 물었습니다. 그러자 그가 내게 말하여 그 일의 해석을[b] 알려 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 일에 관한 확실한 것’ 또는 ‘확실성’으로 옮길 수 있습니다. 아람어 표현은 굳고 확실하거나 참된 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘말들의 해석’입니다. 여기서 ‘말들’은 환상 전체의 내용이나 사안을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבֵת
  english_pob_choice: I approached
  chosen_korean: 다가가서
  alternatives_korean:
  - 가까이 갔습니다
  - 다가왔습니다
  lexicon: HALOT
  rationale: 동작의 진행과 거리의 이동을 자연스러운 현대 한국어로 살리면서, 서술 흐름을 매끄럽게 만들었습니다.
- source_word: עַל חַד מִן קָאֲמַיָּא
  english_pob_choice: one of those standing there
  chosen_korean: 그곳에 서 있던 이들 가운데 한 사람
  alternatives_korean:
  - 거기 서 있던 사람들 가운데 한 사람
  - 서 있던 이들 중 한 사람
  lexicon: HALOT
  rationale: 참여자 중 한 사람이라는 뜻을 살리되, 단순한 공간 묘사 이상으로 ‘대기/출석’의 뉘앙스를 유지했습니다.
- source_word: וְיַצִּיבָא
  english_pob_choice: certainty
  chosen_korean: 확실성
  alternatives_korean:
  - 진리
  - 진실
  - 확실한 것
  lexicon: HALOT
  rationale: 이 단어가 ‘진리’만이 아니라 ‘굳고 확실한 것’의 뜻을 지닌다는 점을 반영해, 질문 대상이 되는 판단 가능성을 한국어로 드러냈습니다.
- source_word: וּפְשַׁר מִלַּיָּא
  english_pob_choice: the interpretation of the matter
  chosen_korean: 그 일의 해석
  alternatives_korean:
  - 말들의 해석
  - 이 일의 뜻
  - 이것들의 해석
  lexicon: HALOT
  rationale: 직역하면 ‘말들’이지만 문맥상 환상 전체의 내용/사안을 가리키므로, ‘해석’의 대상이 되는 사건 자체를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 다니엘의 요청을 ‘진리’가 아니라 ‘확실성’으로 번역할지
  chosen_reading: ‘확실성’으로 옮겨, 환상의 내용에 대한 신뢰 가능한 해석을 구하는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘진리’로 번역
  - ‘확실한 것’으로 번역
  rationale: 본문의 아람어 표현은 철학적 추상명사보다 ‘굳고 믿을 수 있는 사실’에 가깝기 때문에, 독자가 다니엘의 질문 의도를 오해하지 않도록 했습니다.
  doctrine_reference: 본문 주해/어휘 선택
