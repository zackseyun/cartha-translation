  text: וַ/אֲר֣וּ חֵיוָה֩ אָחֳרִ֨י תִנְיָנָ֜ה דָּמְיָ֣ה לְ/דֹ֗ב וְ/לִ/שְׂטַר חַד֙ הֳקִמַ֔ת וּ/תְלָ֥ת עִלְעִ֛ין בְּ/פֻמַּ֖/הּ בֵּ֣ין שני/ה וְ/כֵן֙ אָמְרִ֣ין לַ֔/הּ ק֥וּמִֽי אֲכֻ֖לִי בְּשַׂ֥ר שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/005.yaml
  text: 'And look[a], another beast, a second one, resembling a bear; it was raised up on one side, and three ribs were in its mouth between its teeth. And this is what they were saying to it: “Arise[b], eat much flesh.”'
  footnotes:
  - marker: a
    text: Or possibly “three tusks” instead of “three ribs,” though “ribs” better fits the phrase “between its teeth.”
    reason: lexical_alternative
  - marker: b
    text: The phrase “raised up on one side” may also be understood as “raised up on one flank,” emphasizing the beast’s uneven posture.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오, 또 다른 짐승, 곧 둘째 짐승이 있었는데, 곰과 같았습니다. 그것은 한쪽으로 높이 들려 있었고[b], 그 입에는 이빨 사이에 세 개의 갈빗대가 있었습니다[a]. 그리고 그들이 그것에게 이렇게 말하고 있었습니다. “일어나, 많은 살을 먹어라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈빗대’는 이 본문에서 널리 받아들여지는 이해를 따른 번역입니다. 일부는 이를 ‘엄니’ 또는 ‘송곳니’로 이해할 가능성을 제시하지만, ‘이빨 사이에’라는 표현에는 ‘갈빗대’가 더 잘 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한쪽으로 높이 들려 있었고’는 본문의 비대칭적 자세를 따른 번역입니다. ‘한쪽 옆으로 높이 세워져 있었고’ 또는 ‘한쪽으로 치우쳐 있었고’로도 이해할 수 있습니다.
    reason: lexical_alternative
