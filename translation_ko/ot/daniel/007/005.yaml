reference: Daniel 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲר֣וּ חֵיוָה֩ אָחֳרִ֨י תִנְיָנָ֜ה דָּמְיָ֣ה לְ/דֹ֗ב וְ/לִ/שְׂטַר חַד֙ הֳקִמַ֔ת וּ/תְלָ֥ת עִלְעִ֛ין בְּ/פֻמַּ֖/הּ בֵּ֣ין שני/ה וְ/כֵן֙ אָמְרִ֣ין לַ֔/הּ ק֥וּמִֽי אֲכֻ֖לִי בְּשַׂ֥ר שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/005.yaml
  text: 'And look[a], another beast, a second one, resembling a bear; it was raised up on one side, and three ribs were in its mouth between its teeth. And this is what they were saying to it: “Arise[b], eat much flesh.”'
  footnotes:
  - marker: a
    text: Or possibly “three tusks” instead of “three ribs,” though “ribs” better fits the phrase “between its teeth.”
    reason: lexical_alternative
  - marker: b
    text: The phrase “raised up on one side” may also be understood as “raised up on one flank,” emphasizing the beast’s uneven posture.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 보십시오, 또 다른 짐승이 있었는데, 둘째 짐승으로 곰과 같았습니다. 그것은 한쪽으로 높이 들렸고, 그 입에는 세 개의 갈빗대가 이빨 사이에 있었습니다. 그리고 그들에게서 이런 말이 나오고 있었습니다. “일어나서 많은 살을 먹어라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈빗대’는 이 본문에서 널리 쓰이는 이해를 따른 번역이며, 일부는 ‘엄니’ 또는 ‘송곳니 조각’ 같은 다른 해석 가능성을 제시합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한쪽으로 높이 들렸고’는 본문의 비대칭적 자세를 따른 번역으로, ‘한쪽 옆으로’ 또는 ‘한쪽으로 치우쳐’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוּ
  english_pob_choice: And look
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 그리고 보게 되었습니다
  lexicon: HALOT
  rationale: 새로운 환상을 강하게 환기하는 아람어 담화 표지이므로, 현대 한국어에서 시각적 주의를 끄는 표현으로 옮겼습니다.
- source_word: חֵיוָה אָחֳרִי תִנְיָנָה
  english_pob_choice: another beast, a second one
  chosen_korean: 또 다른 짐승이 있었는데, 둘째 짐승
  alternatives_korean:
  - 또 하나의 둘째 짐승
  - 다른, 둘째 짐승
  lexicon: HALOT
  rationale: ‘또 다른’과 ‘둘째’의 두 층위가 함께 있으므로 둘 다 살리되, 자연스러운 한국어 어순으로 정리했습니다.
- source_word: דָּמְיָה לְדֹב
  english_pob_choice: resembling a bear
  chosen_korean: 곰과 같았습니다
  alternatives_korean:
  - 곰을 닮았습니다
  - 곰처럼 보였습니다
  lexicon: HALOT
  rationale: 비유적 형용사의 비교 관계를 간결하게 드러내면서, 환상 묘사의 직접성을 유지했습니다.
- source_word: וְלִשְׂטַר חַד הֳקִמַת
  english_pob_choice: it was raised up on one side
  chosen_korean: 한쪽으로 높이 들렸고
  alternatives_korean:
  - 한쪽으로 높이 세워졌고
  - 한쪽으로 들려 있었고
  lexicon: HALOT
  rationale: 비대칭적 자세를 나타내는 문구로 이해하여, ‘한쪽으로’와 ‘높이 들렸고’로 소리와 동작을 모두 살렸습니다.
- source_word: וּתְלָת עִלְעִין
  english_pob_choice: three ribs
  chosen_korean: 세 개의 갈빗대
  alternatives_korean:
  - 세 갈빗대
  - 세 개의 늑골
  lexicon: HALOT
  rationale: 문맥상 입 안의 포식 흔적을 가리키는 표상을 따라, 한국어에서 가장 자연스러운 해부학적 표현을 택했습니다.
- source_word: אָמְרִין לַהּ
  english_pob_choice: they were saying to it
  chosen_korean: 그들에게서 이런 말이 나오고 있었습니다
  alternatives_korean:
  - 그들이 그것에게 말하고 있었습니다
  - 그들이 그것을 향해 말했습니다
  lexicon: HALOT
  rationale: 불특정 복수 주어의 지속적 발화를 드러내기 위해 진행형으로 옮겼습니다.
- source_word: קוּמִי אֲכֻלִי
  english_pob_choice: Arise, eat much flesh
  chosen_korean: 일어나서 많은 살을 먹어라
  alternatives_korean:
  - 일어나 많은 살을 먹어라
  - 일어나서 살을 많이 먹어라
  lexicon: HALOT
  rationale: 암시적 명령을 직접 화법으로 살리고, ‘많은 살’을 통해 מקור의 양적 강조를 보존했습니다.
theological_decisions:
- issue: 환상 속 짐승의 상징적 성격
  chosen_reading: ‘짐승’은 실제 동물이 아니라 제국적 세력을 상징하는 환상적 표상으로 읽었습니다.
  alternative_readings:
  - 단순한 동물 묘사로 읽는 해석
  - 도덕적 비유로만 축소하는 해석
  rationale: 다니엘 7장의 문맥 전체가 상징적 환상을 형성하므로, 한국어도 그 위압감과 상징성을 유지해야 합니다.
  doctrine_reference: 다니엘 7장 문맥 해석
- issue: 명령문 ‘קוּמִי’의 직접성
  chosen_reading: 짐승에게 주어지는 명령형을 그대로 살려 ‘일어나서… 먹어라’로 옮겼습니다.
  alternative_readings:
  - 서술문으로 완화하는 번역
  - 간접화법으로 바꾸는 번역
  rationale: 환상 대사의 공격성과 긴박함이 본문 효과의 핵심이므로, 명령의 직접성을 약화시키지 않았습니다.
  doctrine_reference: 본문 수사와 문학 효과
