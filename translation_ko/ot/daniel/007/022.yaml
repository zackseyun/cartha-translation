id: DAN.7.22
reference: Daniel 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֣ד דִּֽי אֲתָ֗ה עַתִּיק֙ יֽוֹמַיָּ֔/א וְ/דִינָ֣/א יְהִ֔ב לְ/קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/זִמְנָ֣/א מְטָ֔ה וּ/מַלְכוּתָ֖/א הֶחֱסִ֥נוּ קַדִּישִֽׁין־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/022.yaml
  text: until the Ancient of Days came[a], and judgment was given to the saints of the Most High, and the time arrived[c][b], and the saints took possession of the kingdom.
  footnotes:
  - marker: a
    text: Or 'judgment was given to the saints of the Most High.' The Aramaic preposition can be understood either as benefactive ('for,' in their favor) or as indirect object ('to').
    reason: alternative_reading
  - marker: b
    text: Or 'the holy ones of the Most High.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the saints possessed the kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 옛적부터 계신 이가 오실 때까지, 지극히 높으신 이의 성도들에게 심판이 내려졌고, 때가 이르렀으며, 성도들이 나라를 차지하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판결이 성도들에게 내려졌고’. 아람어 전치사는 ‘~을 위하여’라는 이익을 나타내는 뜻으로도, ‘~에게’라는 간접목적어로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘거룩한 자들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성도들이 나라를 소유하였습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתִּיק יוֹמַיָּא
  english_pob_choice: the Ancient of Days
  chosen_korean: 옛적부터 계신 이
  alternatives_korean:
  - 옛날부터 계신 이
  - 항상 계신 옛적부터의 이
  lexicon: HALOT
  rationale: 다니엘 7장의 고유한 신적 칭호를 한국어로 자연스럽게 옮기되, 의인화된 고대성의 이미지를 보존했습니다.
- source_word: וְדִינָא יְהִב
  english_pob_choice: judgment was given
  chosen_korean: 심판이 내려졌고
  alternatives_korean:
  - 판결이 내려졌고
  - 심리가 주어졌고
  lexicon: HALOT
  rationale: 아람어 수동적 법정 표현을 살려 ‘주어지다’의 법적·공적 어감을 담되, 한국어에서는 ‘심판이 내려지다’가 가장 자연스럽고 간결합니다.
- source_word: לְקַדִּישֵׁי עֶלְיוֹנִין
  english_pob_choice: the saints of the Most High
  chosen_korean: 지극히 높으신 이의 성도들
  alternatives_korean:
  - 지극히 높으신 이의 거룩한 자들
  - 가장 높으신 이의 성도들
  lexicon: HALOT
  rationale: POB의 기본 용어인 ‘성도’를 유지하고, עֶלְיוֹנִין은 다니엘서의 신적 호칭으로 ‘지극히 높으신 이’가 안정적으로 대응합니다.
- source_word: וּמַלְכוּתָא הֶחֱסִנוּ
  english_pob_choice: the saints took possession of the kingdom
  chosen_korean: 성도들이 나라를 차지하였습니다
  alternatives_korean:
  - 성도들이 왕국을 차지하였습니다
  - 성도들이 나라를 소유하게 되었습니다
  lexicon: HALOT
  rationale: ‘take possession of’의 소유·접수 의미를 살리면서, 다니엘 7장의 통치 전환 문맥에는 ‘나라를 차지하다’가 가장 직접적입니다.
theological_decisions:
- issue: לְקַדִּישֵׁי עֶלְיוֹנִין의 법정 의미
  chosen_reading: ‘심판이 내려졌고’로 옮겨, 성도들에게 유리한 판결이 내려진다는 함의를 열어 둡니다.
  alternative_readings:
  - ‘성도들에게 심판이 주어졌고’
  - ‘성도들을 위해 판결이 내려졌고’
  rationale: 본문은 박해받던 성도들의 억울함이 해소되는 장면이므로, 판결의 방향성을 너무 좁히지 않으면서도 문맥상의 변호/변증 의미를 보존하는 번역이 적절합니다.
  doctrine_reference: 본문의 법정-종말론적 역전 구조를 보존
