id: DAN.7.24
reference: Daniel 7:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קַרְנַיָּ֣/א עֲשַׂ֔ר מִנַּ/הּ֙ מַלְכוּתָ֔/ה עַשְׂרָ֥ה מַלְכִ֖ין יְקֻמ֑וּן וְ/אָחֳרָ֞ן יְק֣וּם אַחֲרֵי/ה֗וֹן וְ/ה֤וּא יִשְׁנֵא֙ מִן קַדְמָיֵ֔/א וּ/תְלָתָ֥ה מַלְכִ֖ין יְהַשְׁפִּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/024.yaml
  text: As for the ten horns[a], out of this kingdom ten kings will arise; and another will arise after them. He will be different from the former ones[b], and he will humble three kings.
  footnotes:
  - marker: a
    text: Or "will be diverse from the former ones."
    reason: lexical_alternative
  - marker: b
    text: Or "will abase" or "put down" three kings.
    reason: lexical_alternative
translation:
  language: ko
  text: 열 뿔은 이 왕국에서 일어날 열 왕이며, 그들 뒤이어 또 다른 한 왕이 일어날 것입니다. 그는 앞선 왕들과 다를 것이며[b], 세 왕을 낮출 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “낮게 하다”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “앞선 왕들과 구별될 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קַרְנַיָּ֣/א עֲשַׂ֔ר
  english_pob_choice: the ten horns
  chosen_korean: 열 뿔
  alternatives_korean:
  - 열 개의 뿔
  - 열 뿔들
  lexicon: HALOT
  rationale: 상징어인 ‘뿔’을 그대로 살려, 본문이 곧바로 그 의미를 풀어 주기 전까지는 해석으로 바꾸지 않았습니다.
- source_word: מִנַּ/הּ֙ מַלְכוּתָ֔/ה
  english_pob_choice: out of this kingdom
  chosen_korean: 이 왕국에서
  alternatives_korean:
  - 그 왕국에서
  - 이 나라에서
  lexicon: HALOT
  rationale: 대명사가 가리키는 왕국에서 ‘나와’ 일어나는 뜻을 한국어로 자연스럽게 옮겼습니다.
- source_word: יְקֻמ֑וּן / יְקוּם אַחֲרֵי/הוֹן
  english_pob_choice: will arise / will arise after them
  chosen_korean: 일어날 것입니다 / 그들 뒤에 일어날 것입니다
  alternatives_korean:
  - 일어설 것입니다
  - 그 뒤에 일어날 것입니다
  lexicon: HALOT
  rationale: 다니엘서의 왕권 출현을 나타내는 קוּם의 의미를 살려, 단순한 시간적 ‘오다’보다 ‘일어나다’를 택했습니다.
- source_word: יִשְׁנֵא֙ מִן קַדְמָיֵ֔/א
  english_pob_choice: will be different from the former ones
  chosen_korean: 이전의 자들과 다를 것이며
  alternatives_korean:
  - 이전의 자들과 구별될 것이며
  - 이전의 자들과 달라질 것이며
  lexicon: HALOT
  rationale: 본문의 초점은 이 왕의 ‘성격/유형의 차이’이지 단순한 변경이 아니므로, 영어 POB의 해석을 따라 ‘다르다’로 옮겼습니다.
- source_word: וּ/תְלָתָ֥ה מַלְכִ֖ין יְהַשְׁפִּֽל־
  english_pob_choice: and he will humble three kings
  chosen_korean: 세 왕을 낮출 것입니다
  alternatives_korean:
  - 세 왕을 낮추어 놓을 것입니다
  - 세 왕을 굴복시킬 것입니다
  - 세 왕을 겸손하게 만들 것입니다
  lexicon: HALOT
  rationale: שׁפל의 사역형이 지닌 ‘낮추다/겸손하게 하다’의 뜻을 살리되, 정치적 결과를 과도하게 좁히지 않기 위해 ‘낮추다’로 번역했습니다.
theological_decisions:
- issue: 마지막 왕의 ‘다름’의 의미를 어떻게 보존할 것인가
  chosen_reading: 그는 이전의 자들과 다를 것입니다
  alternative_readings:
  - 그는 이전의 자들보다 더 사나울 것입니다
  - 그는 이전의 자들로부터 바뀔 것입니다
  rationale: 본문은 이 왕의 정체를 해석하기보다 앞선 왕들과의 차이를 진술합니다. 그러므로 후대의 동일시나 성격 규정을 덧붙이지 않고, 비교적 중립적인 ‘다르다’를 유지했습니다.
  doctrine_reference: 예언 본문의 묘사적 긴장을 그대로 보존
