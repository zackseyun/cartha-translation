id: DAN.7.2
reference: Daniel 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָנֵ֤ה דָנִיֵּאל֙ וְ/אָמַ֔ר חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוִ֖/י עִם לֵֽילְיָ֑/א וַ/אֲר֗וּ אַרְבַּע֙ רוּחֵ֣י שְׁמַיָּ֔/א מְגִיחָ֖ן לְ/יַמָּ֥/א רַבָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/002.yaml
  text: Daniel answered and said[a], “I was seeing in my vision by night, and behold, the four winds of heaven were stirring up the great sea.”
  footnotes:
  - marker: a
    text: Or “the four spirits of heaven.” The Aramaic word can mean either “winds” or “spirits.”
    reason: alternative_reading
translation:
  language: ko
  text: 다니엘은 대답하여 말했습니다. “나는 밤에 내 환상 속에서 보고 있었습니다. 보십시오, 하늘의 네 바람[a]이 큰 바다를 뒤흔들고 있었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘의 네 영.” 아람어 단어는 “바람” 또는 “영”을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 히브리어·아람어 서사 공식인 ‘대답하여 말하다’를 자연스러운 현대 한국어로 옮기되, 단순한 ‘말했습니다’보다 화행 공식성을 살렸습니다.
- source_word: חָזֵה הֲוֵית
  english_pob_choice: I was looking
  chosen_korean: 보고 있었습니다
  alternatives_korean:
  - 보고 있었습니다
  - 보고 있었습니다
  - 보았습니다
  lexicon: HALOT
  rationale: 진행·지속의 과거 뉘앙스를 살려 단순 과거보다 ‘보고 있었습니다’로 옮겼습니다.
- source_word: אַרְבַּע רוּחֵי שְׁמַיָּא
  english_pob_choice: the four winds of heaven
  chosen_korean: 하늘의 네 바람
  alternatives_korean:
  - 하늘의 네 영
  - 하늘의 네 바람들
  lexicon: HALOT
  rationale: 이 문맥의 바다를 뒤흔드는 우주적 이미지에서는 ‘바람’이 1차 의미이므로 본문에는 바람을 택했고, רוּחַ의 ‘영’ 가능성은 각주로 남겼습니다.
- source_word: מְגִיחָן
  english_pob_choice: were stirring up
  chosen_korean: 뒤흔들고 있었습니다
  alternatives_korean:
  - 일으키고 있었습니다
  - 몰아치고 있었습니다
  - 격동시키고 있었습니다
  lexicon: HALOT
  rationale: 바람이 바다에 미치는 동적 효과를 한국어로 가장 분명하게 드러내기 위해 ‘뒤흔들다’를 택했습니다.
theological_decisions:
- issue: רוּחֵי의 의미 범위
  chosen_reading: 본문에는 ‘바람’으로 두되, ‘영’ 가능성은 각주로 보존합니다.
  alternative_readings:
  - 영
  - 바람과 영의 이중 가능성
  rationale: 아람어 רוּחַ는 ‘바람’과 ‘영’ 모두 가능하지만, 바로 뒤의 ‘큰 바다를 뒤흔들다’라는 장면은 물리적 바람의 이미지가 더 직접적입니다. 본문은 우선적 의미를 따르고, 해석상의 긴장은 각주로 보존합니다.
  doctrine_reference: 해석의 긴장을 해소하지 않고 보존
- issue: 다니엘의 발화 서술 방식
  chosen_reading: ‘대답하여 말했습니다’로 서술 공식성을 살립니다.
  alternative_readings:
  - ‘말했습니다’로 단순화
  - ‘응답하여 말했습니다’
  rationale: 문맥상 질문에 대한 실제 응답이 명시되지 않아도, 아람어 서사 공식의 기능을 보존하는 번역이 더 적절합니다.
  doctrine_reference: 서사 관용구 보존
