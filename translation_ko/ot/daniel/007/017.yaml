source:
  edition: WLC
  text: אִלֵּין֙ חֵיוָתָ֣/א רַבְרְבָתָ֔/א דִּ֥י אִנִּ֖ין אַרְבַּ֑ע אַרְבְּעָ֥ה מַלְכִ֖ין יְקוּמ֥וּן מִן אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/017.yaml
  text: These great beasts[a], which are four, are four kings who will arise from the earth.
  footnotes:
  - marker: a
    text: Or 'from the land.' The Aramaic אַרְעָא can denote either 'earth' or 'land'; 'earth' is preferred here because of the chapter's broad apocalyptic scope.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 큰 짐승들[a], 곧 네 마리는 땅에서 일어날 네 왕들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라에서’ 또는 ‘지역에서’. 아람어 אַרְעָא는 ‘땅’뿐 아니라 ‘나라’나 ‘지역’을 가리킬 수도 있습니다. 이 장의 넓은 묵시적 범위를 고려하여 여기서는 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִלֵּין
  english_pob_choice: These
  chosen_korean: 이
  alternatives_korean:
  - 저
  - 그
  lexicon: HALOT
  rationale: 지시대명사 복수로서 직전 환상 속 짐승들을 가리키므로 한국어에서도 가까운 지시어 ‘이’를 사용했습니다.
- source_word: חֵיוָתָא רַבְרְבָתָא
  english_pob_choice: great beasts
  chosen_korean: 큰 짐승들
  alternatives_korean:
  - 거대한 짐승들
  - 위대한 짐승들
  lexicon: HALOT
  rationale: 아람어의 ‘크다/큰’은 크기와 상징적 위력을 함께 드러내므로, 한국어에서는 자연스러운 ‘큰 짐승들’로 옮겼습니다.
- source_word: אַרְבְּעָה מַלְכִין
  english_pob_choice: four kings
  chosen_korean: 네 왕들
  alternatives_korean:
  - 네 나라들
  - 네 왕국들
  lexicon: HALOT
  rationale: 원문이 분명히 ‘왕들’(מַלְכִין)이라고 말하므로, 해석적으로 ‘나라들’로 바꾸지 않고 복수 명사 그대로 유지했습니다.
- source_word: מִן אַרְעָא
  english_pob_choice: from the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅으로부터
  - 땅에서부터
  lexicon: HALOT
  rationale: אַרְעָא는 ‘땅/땅 위’의 범위를 가질 수 있으나, 이 환상 문맥에서는 한국어 ‘땅에서’가 가장 자연스럽고 넓은 범위를 살립니다.
theological_decisions:
- issue: ‘왕들’과 장차 나타날 제국적 의미의 관계
  chosen_reading: 본문은 ‘네 왕들’이라는 표면적 어휘를 유지하고, 더 넓은 상징적 지시 대상은 본문 바깥의 해석에 맡겼습니다.
  alternative_readings:
  - ‘네 나라들’로 해석해 번역
  - 각주에서 곧바로 ‘왕국들’로 풀어쓰기
  rationale: 원문 해석문은 단어 수준에서 ‘왕들’을 말하므로, 번역이 미리 조화시키기보다 본문의 언어적 긴장을 보존하는 편이 source-grounded입니다.
  doctrine_reference: 원어 우선 원칙; 해석적 확장보다 어휘 보존
- issue: ‘땅’의 범위
  chosen_reading: ‘earth’에 해당하는 넓은 우주적 느낌을 살리되, 한국어에서는 ‘땅’으로 번역했습니다.
  alternative_readings:
  - ‘세상’
  - ‘땅’ 대신 ‘나라’
  rationale: 아람어 אַרְעָא는 문맥에 따라 ‘땅/땅’의 범위를 가질 수 있지만, 여기서는 환상 전체의 우주적 배경과 맞물려도 한국어 ‘땅’이 가장 무리 없는 대응입니다.
  doctrine_reference: 문맥상 어휘 선택; apocalyptic scope
