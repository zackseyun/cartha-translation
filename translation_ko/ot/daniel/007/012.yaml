  to: 나머지 짐승들은 통치권을 빼앗겼으나, 한 때와 한 시기 동안 더 살도록 허락되었습니다.[a]
  rationale: 시간 표현을 목적격처럼 들리는 ‘위하여’에서 지속 기간을 나타내는 ‘동안’으로 고쳤습니다. 또한 ‘생명의 연장이 그들에게 주어졌습니다’라는 명사적 표현을 ‘더 살도록 허락되었습니다’로 자연화하되, 생명이 제한적으로 연장되었다는 뜻과 허여의 수동 표현을 유지했습니다. 각주에서는 עַד를 ‘~까지’로 이해하는 대안을 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:53Z'
