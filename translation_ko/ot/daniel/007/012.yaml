source:
  edition: WLC
  text: וּ/שְׁאָר֙ חֵֽיוָתָ֔/א הֶעְדִּ֖יו שָׁלְטָנְ/ה֑וֹן וְ/אַרְכָ֧ה בְ/חַיִּ֛ין יְהִ֥יבַת לְ/ה֖וֹן עַד זְמַ֥ן וְ/עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/012.yaml
  text: As for the rest of the beasts[a], their dominion was taken away, but an extension of life was given to them for a time and a season.
  footnotes:
  - marker: a
    text: Or 'until a time and a season.' The Aramaic expression can be understood as marking the limit of the extension granted to them.
    reason: alternative_reading
translation:
  language: ko
  text: 나머지 짐승들은 통치권을 빼앗겼으나, 한 때와 한 시기 동안 더 살도록 허락되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 때와 한 시기까지’. 아람어 표현은 그들에게 허락된 생명의 연장이 미치는 한계를 나타내는 것으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר
  english_pob_choice: As for the rest of
  chosen_korean: 나머지
  alternatives_korean:
  - 그리고 나머지
  - 남은
  lexicon: HALOT
  rationale: 문맥상 앞선 짐승과 대조되는 나머지 짐승들을 가리키므로, 서술 전환을 자연스럽게 드러내는 ‘나머지’로 옮겼습니다.
- source_word: שָׁלְטָנְהוֹן
  english_pob_choice: their dominion
  chosen_korean: 그들의 통치권
  alternatives_korean:
  - 그들의 지배권
  - 그들의 권세
  - 그들의 주권
  lexicon: HALOT
  rationale: 다니엘서의 정치-환상적 어휘를 살리면서도, ‘통치권’이 왕권적 지배의 상실을 비교적 सीधे하게 드러냅니다.
- source_word: וְאַרְכָה בְחַיִּין
  english_pob_choice: an extension of life
  chosen_korean: 생명의 연장
  alternatives_korean:
  - 생명의 연장됨
  - 삶의 연장
  - 수명의 연장
  lexicon: HALOT
  rationale: 아람어의 ‘길어짐/연장’ 의미를 한국어 명사구로 자연스럽게 표현해, ‘생명이 연장되었다’는 뜻을 압축해 담았습니다.
- source_word: עַד זְמַן וְעִדָּן
  english_pob_choice: for a time and a season
  chosen_korean: 한때와 한 시기를 위하여
  alternatives_korean:
  - 한 시간과 한 시기를 위하여
  - 정해진 때와 시기를 위하여
  - 어느 때와 어느 시기를 위하여
  lexicon: HALOT
  rationale: 두 시간 명사가 병렬된 제한 기간 표현을 그대로 살리되, ‘for’의 기능을 자연스럽게 반영하여 기간 한정을 드러냈습니다.
theological_decisions:
- issue: 마지막 시간 표현의 범위
  chosen_reading: 한때와 한 시기를 위하여
  alternative_readings:
  - 한때까지
  - 정해진 때까지
  - 한때와 한 시기 동안
  rationale: 본문은 짐승들의 생명이 제한된 기간 더 지속되었음을 말하지만, 그 기간의 종말론적 구조를 더 구체화하지 않습니다. 따라서 제한성을 유지하되 과도한 해석은 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
