id: DAN.7.15
reference: Daniel 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶתְכְּרִיַּ֥ת רוּחִ֛/י אֲנָ֥ה דָנִיֵּ֖אל בְּ/ג֣וֹא נִדְנֶ֑ה וְ/חֶזְוֵ֥י רֵאשִׁ֖/י יְבַהֲלֻנַּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
  footnotes:
  - marker: a
    text: Or 'within my body.' The Aramaic term rendered 'sheath' is a rare metaphor for the bodily frame enclosing the spirit.
    reason: lexical_alternative
translation:
  language: ko
  text: 나, 다니엘은 내 영이 내 속에서 괴로웠고, 내 머리의 환상들이 나를 두렵게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 몸 안에서'로 옮길 수 있습니다. 아람어의 이 드문 표현은 영을 둘러싼 몸의 틀을 가리키는 은유로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  english_pob_choice: was distressed
  chosen_korean: 괴로웠고
  alternatives_korean:
  - 괴로워했고
  - 고통스러웠고
  - 번민했고
  lexicon: HALOT
  rationale: 내면의 격한 불안과 고통을 자연스러운 현대 한국어로 옮기되, 단순한 '슬펐다'보다 더 강한 정서를 살렸습니다.
- source_word: רוּחִי
  english_pob_choice: my spirit
  chosen_korean: 내 영이
  alternatives_korean:
  - 내 마음이
  - 내 영혼이
  - 내 속이
  lexicon: HALOT
  rationale: 여기서는 바람이 아니라 다니엘의 내적 존재를 가리키므로 '영'이 원문 의미를 가장 직접적으로 보존합니다.
- source_word: בְּגוֹא נִדְנֶה
  english_pob_choice: within me
  chosen_korean: 내 속에서
  alternatives_korean:
  - 내 몸 안에서
  - 내 안에서
  - 몸의 껍질 안에서
  lexicon: HALOT
  rationale: POB의 영어 본문처럼 원문의 은유를 과도하게 풀지 않고, 문맥상 몸/내면을 가리키는 내부 위치 표현으로 옮겼습니다.
- source_word: חֶזְוֵי רֵאשִׁי
  english_pob_choice: the visions of my head
  chosen_korean: 내 머리의 환상들이
  alternatives_korean:
  - 내 머리의 이상들이
  - 머릿속의 환상들이
  - 내 머리의 이상한 광경들이
  lexicon: HALOT
  rationale: 직역적인 '머리의 환상들'을 유지하되 한국어 어순에 맞게 정리하여, 다니엘서의 반복되는 환상 체험 표현을 살렸습니다.
theological_decisions:
- issue: רוּחִי의 인간 내면 지시 여부
  chosen_reading: 다니엘 자신의 영이 내적 동요를 겪는 것으로 읽었습니다.
  alternative_readings:
  - 마음이나 생각이 괴로운 것으로 완화하여 읽을 수 있음
  - 생리적 충격으로만 읽을 수 있음
  rationale: 문맥은 외부 사건보다 다니엘의 내적 존재가 환상에 압도되는 상황을 강조하므로, '영'을 유지하는 것이 원문의 인간론적 긴장을 보존합니다.
  doctrine_reference: 다니엘 7장의 환상 서술과 인간의 내적 반응
