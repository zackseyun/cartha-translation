base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
  footnotes:
  - marker: a
    text: Or 'within my body.' The Aramaic term rendered 'sheath' is a rare metaphor for the bodily frame enclosing the spirit.
    reason: lexical_alternative
translation:
  language: ko
  text: 나 다니엘은 내 영이 내 속에서[a] 괴로웠고, 내 머릿속의 환상들이 나를 두렵게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 몸 안에서.’ 아람어의 드문 낱말은 영을 둘러싼 몸의 외피 또는 틀을 비유적으로 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  english_pob_choice: was distressed
  chosen_korean: 괴로웠고
  alternatives_korean:
