id: DAN.7.27
reference: Daniel 7:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַלְכוּתָ֨/ה וְ/שָׁלְטָנָ֜/א וּ/רְבוּתָ֗/א דִּ֚י מַלְכְוָת֙ תְּח֣וֹת כָּל שְׁמַיָּ֔/א יְהִיבַ֕ת לְ/עַ֖ם קַדִּישֵׁ֣י עֶלְיוֹנִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/כֹל֙ שָׁלְטָ֣נַיָּ֔/א לֵ֥/הּ יִפְלְח֖וּן וְ/יִֽשְׁתַּמְּעֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/027.yaml
  text: And the kingdom and the dominion and the greatness of the kingdoms under all heaven shall be given to the people of the saints of the Most High[a]. His kingdom shall be an everlasting kingdom[c][b], and all dominions shall serve and obey him.
  footnotes:
  - marker: a
    text: Or 'the people of the holy ones of the Most High' or 'the holy people of the Most High.'
    reason: lexical_alternative
  - marker: b
    text: 'The Aramaic has singular pronouns: ''His kingdom ... all dominions shall serve him and obey him.'' This may point to the representative ruler seen earlier in the vision, even as the kingdom is given to the saints.'
    reason: alternative_reading
  - marker: c
    text: '''Serve'' can also carry the sense ''worship'' in Daniel when the service is rendered to deity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 이의 거룩한 백성에게 하늘 아래의 모든 나라의 왕권과 통치권과 위대함이 주어질 것입니다[a]. 그의[b] 왕국은 영원한 왕국이 될 것이며, 모든 통치 세력이 그를 섬기며[c] 복종할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 이의 거룩한 이들의 백성’ 또는 ‘지극히 높으신 이의 성도들의 백성’.
    reason: lexical_alternative
  - marker: b
    text: 아람어는 단수 대명사를 사용합니다. 곧 ‘그의 왕국 … 모든 통치 세력이 그를 섬기며 복종할 것입니다’라고 합니다. 이는 앞선 환상에 나오는 대표적 통치자를 가리킬 수 있으며, 동시에 왕국은 거룩한 백성에게 주어집니다.
    reason: alternative_reading
  - marker: c
    text: ‘섬기다’는 다니엘서에서 신에게 드리는 섬김을 가리킬 때 ‘예배하다’의 뜻을 띨 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתָה / מַלְכוּתֵהּ
  english_pob_choice: the kingdom / His kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 나라
  - 통치
  lexicon: HALOT
  rationale: 아람어 מַלְכוּת는 ‘왕국’과 ‘왕권/통치’의 뜻을 함께 가질 수 있지만, 문맥에서 반복되는 통치 개념과 구체적 종말론적 실체를 살리기 위해 ‘왕국’으로 옮겼습니다.
- source_word: שָׁלְטָנָא / שָׁלְטָנַיָּא
  english_pob_choice: the dominion / all dominions
  chosen_korean: 통치권
  alternatives_korean:
  - 지배권
  - 권세
  - 통치들
  lexicon: HALOT
  rationale: 같은 어근이 한 번은 단수, 한 번은 복수로 반복되므로, ‘통치권’으로 옮겨 앞뒤 대응을 살리고 정치적 지배의 뉘앙스를 유지했습니다.
- source_word: רְבוּתָא
  english_pob_choice: the greatness
  chosen_korean: 위대함
  alternatives_korean:
  - 크신 위엄
  - 장엄함
  - 크기
  lexicon: HALOT
  rationale: 이 명사는 ‘크다/위대하다’의 추상명사로, 여기서는 왕권과 통치권에 덧붙는 총체적 탁월성을 가리키므로 ‘위대함’이 가장 직설적입니다.
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  english_pob_choice: the saints of the Most High
  chosen_korean: 지극히 높으신 이의 거룩한 백성
  alternatives_korean:
  - 지극히 높으신 이의 성도들
  - 지극히 높으신 이의 거룩한 자들
  - 지극히 높으신 이의 거룩한 사람들
  lexicon: HALOT
  rationale: POB가 ‘saints’의 집합성을 유지하면서도 공동체를 뜻한다고 본 점을 따라, ‘거룩한 백성’으로 공동체성을 분명히 했습니다.
- source_word: יִפְלְחוּן
  english_pob_choice: shall serve
  chosen_korean: 섬기고
  alternatives_korean:
  - 봉사하고
  - 예배하고
  - 섬길 것입니다
  lexicon: HALOT
  rationale: 이 동사는 단순 노동보다 상전/신에게 드리는 ‘섬김’의 의미를 가지므로, 문맥상 ‘섬기고’가 가장 자연스럽습니다.
- source_word: וְיִשְׁתַּמְּעוּן
  english_pob_choice: and obey
  chosen_korean: 복종할 것입니다
  alternatives_korean:
  - 순종할 것입니다
  - 들을 것입니다
  - 따를 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘듣다’보다 왕권 문맥에서 요구되는 결과를 드러내는 ‘복종하다’가 의미를 더 분명히 전달합니다.
theological_decisions:
- issue: “그의 왕국”의 단수 대명사 유지
  chosen_reading: ‘그의 왕국’과 ‘그를 섬기고 복종할 것입니다’를 그대로 유지해, 성도들에게 주어지는 왕국과 문맥 속 단수 지시 대상의 긴장을 보존했습니다.
  alternative_readings:
  - ‘그들의 왕국’으로 집합화
  - ‘그 왕국’으로 비인격화
  rationale: 아람어는 단수 접미사와 대명사를 사용하므로, 이를 평탄화하지 않고 본문이 남긴 긴장을 드러내는 것이 번역 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
