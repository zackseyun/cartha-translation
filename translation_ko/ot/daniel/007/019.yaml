  lexicon: HALOT
  rationale: 서술의 순서를 이어 주는 시간 표지로, 현대 한국어에서 자연스럽게 다음 국면을 여는 표현입니다.
- source_word: צְבִית לְיַצָּבָא
  english_pob_choice: wanted to know for certain
  chosen_korean: 확실히 알고 싶었습니다
