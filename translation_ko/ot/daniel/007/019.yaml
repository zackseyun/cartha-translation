base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
  footnotes:
  - marker: a
    text: Or 'to ascertain the truth about the fourth beast.' The Aramaic expression conveys a desire to know something with certainty.
    reason: lexical_alternative
  - marker: b
    text: Or 'nails of bronze.' The term can denote claws or nails; 'claws' was chosen to fit the beast imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 네 번째 짐승에 대해 확실히 알고 싶었습니다[a]. 그 짐승은 다른 모든 짐승과 달랐고, 몹시 무서웠으며, 철로 된 이빨과 청동으로 된 발톱[b]을 가졌고, 먹어 치우며 부수고, 남은 것은 그 발로 짓밟았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 번째 짐승의 진실을 알아내고 싶었습니다.’ 아람어 표현은 어떤 일을 확실히 알려는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘청동으로 된 손톱’입니다. 이 단어는 발톱이나 손톱을 가리킬 수 있으나, 여기서는 짐승의 형상에 맞추어 ‘발톱’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
