  terminology: ‘네 번째 짐승’, ‘철로 된 이빨’, ‘청동으로 된 발톱’, ‘짓밟았습니다’는 적절합니다. טִפְרַיּהּ의 대안 각주는 ‘발톱’에 연결되어야 하며, ‘부수고’와는 관련이 없습니다.
