source:
  edition: WLC
  text: אֱדַ֗יִן צְבִית֙ לְ/יַצָּבָ֔א עַל חֵֽיוְתָ/א֙ רְבִיעָ֣יְתָ֔/א דִּֽי הֲוָ֥ת שָֽׁנְיָ֖ה מִן כל/הון דְּחִילָ֣ה יַתִּ֗ירָה שני/ה דִּֽי פַרְזֶל֙ וְ/טִפְרַ֣י/הּ דִּֽי נְחָ֔שׁ אָֽכְלָ֣ה מַדֲּקָ֔ה וּ/שְׁאָרָ֖/א בְּ/רַגְלַ֥י/הּ רָֽפְסָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
  footnotes:
  - marker: a
    text: Or 'to ascertain the truth about the fourth beast.' The Aramaic expression conveys a desire to know something with certainty.
    reason: lexical_alternative
  - marker: b
    text: Or 'nails of bronze.' The term can denote claws or nails; 'claws' was chosen to fit the beast imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 네 번째 짐승에 대해 확실히 알고 싶었습니다[a]. 그 짐승은 다른 모든 짐승과 달랐고, 몹시 무서웠으며, 철로 된 이빨과 청동으로 된 발톱을 가졌고, 무엇이든 먹어 치우고, 부수고[b], 남은 것을 그 발로 짓밟았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 번째 짐승의 진실을 알아내고 싶었습니다.’ 아람어 표현은 어떤 일을 확실히 알려는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘발톱들’입니다. 이 단어는 발톱이나 손톱을 가리킬 수 있으나, 여기서는 짐승의 형상에 맞추어 ‘부수고’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 서술의 순서를 이어 주는 시간 표지로, 현대 한국어에서 자연스럽게 다음 국면을 여는 표현입니다.
- source_word: צְבִית לְיַצָּבָא
  english_pob_choice: wanted to know for certain
  chosen_korean: 확실히 알고 싶었습니다
  alternatives_korean:
  - 진상을 알고 싶었습니다
  - 틀림없이 알고 싶었습니다
  lexicon: HALOT
  rationale: יצב의 의미를 단순한 지식보다 ‘확실성’의 추구로 반영하면서, 다니엘의 내적 갈망을 자연스럽게 살립니다.
- source_word: חֵיוְתָא רְבִיעָיְתָא
  english_pob_choice: the fourth beast
  chosen_korean: 네 번째 짐승
  alternatives_korean:
  - 넷째 짐승
  - 네 번째 짐승
  lexicon: HALOT
  rationale: 짐승 비유를 그대로 유지하고, 서수는 현대 한국어의 가장 자연스러운 형태로 옮겼습니다.
- source_word: דְּחִילָה יַתִּירָה
  english_pob_choice: exceedingly terrifying
  chosen_korean: 몹시 무서웠으며
  alternatives_korean:
  - 극도로 두려운 존재였으며
  - 지극히 무서웠으며
  lexicon: HALOT
  rationale: 강한 정도 부사를 살리되, 문맥상 짐승의 위협성을 간결하고 생생하게 드러내는 표현을 택했습니다.
- source_word: וְטִפְרַיּהּ דִּי נְחָשׁ
  english_pob_choice: claws of bronze
  chosen_korean: 청동으로 된 발톱
  alternatives_korean:
  - 청동 발톱
  - 놋쇠로 된 발톱
  lexicon: HALOT
  rationale: טפר는 동물적 이미지에 맞는 ‘발톱’이 적절하고, נְחָשׁ은 문맥상 ‘청동’으로 옮기는 것이 가장 표준적입니다.
- source_word: אָכְלָה מַדֲּקָה וּשְׁאָרָא בְּרַגְלַיּהּ רָפְסָה
  english_pob_choice: devoured, crushed, and trampled the rest with its feet
  chosen_korean: 먹어 치우고, 부수고[b], 남은 것을 그 발로 짓밟았습니다
  alternatives_korean:
  - 삼키고, 산산이 부수고, 남은 것을 발로 짓밟았습니다
  - 삼켜 버리고, 깨뜨리고, 남은 것을 발로 짓밟았습니다
  lexicon: HALOT
  rationale: 연속 동사를 한국어의 자연스러운 폭력 서술로 옮기되, רָפְסָה의 ‘발로 짓밟다’ 이미지를 분명히 유지했습니다.
theological_decisions:
- issue: 다니엘의 ‘알고 싶음’의 성격
  chosen_reading: 지적 호기심보다, 환상 속 네 번째 짐승의 정체를 분명히 파악하려는 확실성 추구로 옮겼습니다.
  alternative_readings:
  - 진실을 알고 싶었습니다
  - 정확히 알기를 원했습니다
  rationale: 아람어 לְיַצָּבָא의 핵심은 ‘확실하게 하다/알다’의 뉘앙스이므로, 단순한 정보 욕구보다 판별과 확인의 긴장을 살리는 것이 더 적절합니다.
  doctrine_reference: 텍스트 의미 보존 및 서사적 긴장
- issue: 짐승 묘사의 폭력성
  chosen_reading: 동사들을 완곡하게 누그러뜨리지 않고 연속적인 파괴 행위로 유지했습니다.
  alternative_readings:
  - 삼켰다, 깨뜨렸다, 밟았다
  - 삼켜 버리고, 산산이 부수고, 짓밟았다
  rationale: 환상 본문이 의도하는 공포와 압박감을 약화하지 않도록, 원문의 폭력적 이미지와 동작의 연쇄를 그대로 드러냈습니다.
  doctrine_reference: 문학적-서사적 충실성
