  to: 첫째 짐승은 사자와 같았고 독수리의 날개를 지니고 있었습니다. 나는 그것의 날개들이 뽑혀 나갈 때까지 계속 보고 있었습니다.[a] 그것은 땅에서 들어 올려져 사람처럼 두 발로 서도록 세워졌고,[b] 사람의 마음이 그것에게 주어졌습니다.[c]
  rationale: 원문의 시간 표현과 ‘서도록 세워졌다’라는 사역·피동 의미를 명확히 했습니다. 독수리의 날개는 한국어에서 집합적으로 자연스러운 단수 ‘날개’로 처리했습니다. 각주 표지는 해당 구절에 붙이고, 중복된 c 각주를 실제 가능한 대안으로 교정했습니다.
