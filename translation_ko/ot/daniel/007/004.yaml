  text: קַדְמָיְתָ֣/א כְ/אַרְיֵ֔ה וְ/גַפִּ֥ין דִּֽי נְשַׁ֖ר לַ֑/הּ חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּי מְּרִ֨יטוּ גַפַּ֜י/הּ וּ/נְטִ֣ילַת מִן אַרְעָ֗/א וְ/עַל רַגְלַ֨יִן֙ כֶּ/אֱנָ֣שׁ הֳקִימַ֔ת וּ/לְבַ֥ב אֱנָ֖שׁ יְהִ֥יב לַֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/004.yaml
  text: The first was like a lion[a], and it had the wings of an eagle. I kept watching until its wings were plucked off, and it was lifted up from the earth and made to stand on two feet like a man[c][b], and a human heart was given to it.
  footnotes:
  - marker: a
    text: Or 'its wings were torn off' or 'stripped off.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'made to stand on feet like a man.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a man's heart was given to it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 짐승은 사자와 같았고 독수리의 날개를 지니고 있었습니다. 나는 그것의 날개들이 뽑혀 나갈 때까지 계속 보고 있었습니다.[a] 그것은 땅에서 들어 올려져 사람처럼 두 발로 서도록 세워졌고,[b] 사람의 마음이 그것에게 주어졌습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 날개들이 찢겨 나갔다’ 또는 ‘벗겨져 나갔다’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘사람처럼 발 위에 서도록 세워졌다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘한 사람의 마음이 그것에게 주어졌다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְמָיְתָא
  english_pob_choice: The first
  chosen_korean: 첫째는
  alternatives_korean:
  - 첫 번째는
  - 첫째 것은
  lexicon: HALOT
  rationale: 여성형 서수로 앞선 짐승을 가리키므로, 간결한 현대 한국어로 ‘첫째는’이 가장 자연스럽습니다.
- source_word: כְאַרְיֵה
  english_pob_choice: was like a lion
  chosen_korean: 사자와 같았고
  alternatives_korean:
  - 사자 같았고
  - 사자처럼 보였고
  lexicon: HALOT
  rationale: 비교 표지 כ를 살려 동일시가 아닌 유사성을 나타내기 위해 ‘같았고’를 사용했습니다.
- source_word: וְגַפִּין דִּי נְשַׁר לַהּ
  english_pob_choice: and it had the wings of an eagle
  chosen_korean: 독수리의 날개들이 달려 있었습니다
  alternatives_korean:
  - 독수리 날개가 달려 있었습니다
  - 독수리의 날개가 있었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘독수리의 날개들이 그것에게 있었다’이므로, 소유를 나타내는 자연스러운 한국어로 옮기되 복수성을 살렸습니다.
- source_word: מְּרִיטוּ גַפַּיהּ
  english_pob_choice: its wings were plucked off
  chosen_korean: 그것의 날개들이 뽑혀 나갔고
  alternatives_korean:
  - 그것의 날개들이 찢겨 나갔고
  - 그것의 날개들이 뜯겨 나갔고
  lexicon: HALOT
  rationale: 동사는 ‘뽑다/뽑혀 나가다’의 감각이 강하므로, POB의 ‘plucked off’를 직접 반영했습니다.
- source_word: וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  english_pob_choice: and made to stand on two feet like a man
  chosen_korean: 사람처럼 두 발로 서게 되었고
  alternatives_korean:
  - 사람처럼 두 발 위에 서게 되었고
  - 사람처럼 발로 서게 되었고
  lexicon: HALOT
  rationale: 문맥상 짐승이 곧게 서게 되는 장면이므로, ‘두 발로’로 자연스럽게 풀어 원문의 의도를 살렸습니다.
- source_word: וּלְבַב אֱנָשׁ יְהִיב לַהּ
  english_pob_choice: and a human heart was given to it
  chosen_korean: 사람의 마음이 그것에게 주어졌습니다
  alternatives_korean:
  - 인간의 마음이 그것에게 주어졌습니다
  - 사람의 심장이 그것에게 주어졌습니다
  lexicon: HALOT
  rationale: 여기서 לְבַב은 문자적 장기보다 인간적 내면/지성을 가리키므로 ‘마음’이 적절합니다. 성별을 특정하지 않는 ‘사람의’가 원문의 대비를 잘 살립니다.
theological_decisions:
- issue: 짐승의 인간화 표현의 성별 뉘앙스
  chosen_reading: כֶּאֱנָשׁ은 ‘사람처럼’, לְבַב אֱנָשׁ은 ‘사람의 마음’으로 옮겼습니다.
  alternative_readings:
  - 남자처럼 / 남자의 마음
  - 인간처럼 / 인간의 마음
  rationale: 본문의 대비점은 성별이 아니라 짐승성과 인간성의 전환이므로, 현대 한국어에서 자연스럽고 비성별적인 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
