id: DAN.7.10
reference: Daniel 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְהַ֣ר דִּי נ֗וּר נָגֵ֤ד וְ/נָפֵק֙ מִן קֳדָמ֔וֹ/הִי אֶ֤לֶף אלפים יְשַׁמְּשׁוּנֵּ֔/הּ וְ/רִבּ֥וֹ רבון קָֽדָמ֣וֹ/הִי יְקוּמ֑וּן דִּינָ֥/א יְתִ֖ב וְ/סִפְרִ֥ין פְּתִֽיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/010.yaml
  text: A river of fire was flowing and coming out from before him[a]; a thousand thousands were serving him, and ten thousand times ten thousand were standing before him. The court sat[c][b], and the books were opened.
  footnotes:
  - marker: a
    text: Or 'thousands upon thousands were serving him, and myriads upon myriads were standing before him.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the judgment sat'; the phrase refers to the heavenly court taking its seat for judgment.
    reason: lexical_alternative
  - marker: c
    text: Or 'scrolls were opened.'
    reason: lexical_alternative
translation:
  language: ko
  text: 불이 강처럼 흘러 그의 앞에서 나왔습니다[a]. 수천 수천이 그를 섬기고 있었고, 수만 수만이 그의 앞에 서 있었습니다. 법정이 열리고[b] 책들이 펴졌습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수천 수천이 그를 섬기고, 수만 수만이 그의 앞에 서 있었습니다.’
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘심판이 앉았다’입니다. 이 구절은 천상 법정이 판결을 위해 자리를 잡는 것을 가리킵니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘두루마리들이 펴졌습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: נְהַר דִּי נוּר
  english_pob_choice: a river of fire
  chosen_korean: 불이 강처럼
  alternatives_korean:
  - 불의 강이
  - 불의 강이 흘렀습니다
  lexicon: WLC / HALOT
  rationale: 아람어의 ‘강’과 ‘불’ 이미지를 살리되, 한국어에서는 ‘불이 강처럼’으로 옮겨 화염의 흐름과 장면의 생동감을 자연스럽게 표현했습니다.
- source_word: נָגֵד וְנָפֵק
  english_pob_choice: was flowing and coming out
  chosen_korean: 흘러 … 나왔습니다
  alternatives_korean:
  - 흘러나왔습니다
  - 흘러 나오고 있었습니다
  lexicon: WLC / HALOT
  rationale: 진행형의 중첩을 한국어 동사 연쇄로 살려, 불길이 지속적으로 흘러나오는 모습을 드러냈습니다.
- source_word: אֶלֶף אלפים … וְרִבּוֹ רבון
  english_pob_choice: a thousand thousands … ten thousand times ten thousand
  chosen_korean: 수천 수천 … 수만 수만
  alternatives_korean:
  - 천천 … 만만
  - 천천의 천천 … 만만의 만만
  lexicon: WLC / HALOT
  rationale: 수적 과장을 보존하되 현대 한국어에서 자연스럽고 즉각 이해되는 표현으로 옮겨, ‘무수히 많음’으로 평준화하지 않았습니다.
- source_word: דִּינָא יְתִב
  english_pob_choice: The court sat
  chosen_korean: 법정이 열리고
  alternatives_korean:
  - 재판장이 앉고
  - 법정이 자리를 잡고
  lexicon: WLC / HALOT
  rationale: 직역하면 ‘심판이 앉았다’이지만, 이는 천상 법정의 개정(開廷)을 가리키는 관용구이므로 ‘법정이 열리고’로 옮겨 사법 장면을 분명히 했습니다.
- source_word: וְסִפְרִין פְּתִיחוּ
  english_pob_choice: and the books were opened
  chosen_korean: 책들이 펴졌습니다
  alternatives_korean:
  - 두루마리들이 펴졌습니다
  - 기록책들이 열렸습니다
  lexicon: WLC / HALOT
  rationale: 복수형 문서어는 ‘책들’로 가장 무난하게 살리되, 천상 재판의 기록물이 ‘펼쳐짐’이라는 동작을 한국어로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 천상 법정의 관용구 דִּינָא יְתִב 번역
  chosen_reading: ‘법정이 열리고’로 옮겨, 단순한 좌정이 아니라 심판 절차의 개시를 드러냈습니다.
  alternative_readings:
  - ‘심판이 앉고’
  - ‘재판이 시작되고’
  rationale: 문자적 형태보다 문맥의 법정 이미지를 우선해, 독자가 본문을 ‘법정 개정’ 장면으로 이해하도록 했습니다. 이는 교리적 해석이 아니라 관용구의 기능을 드러내는 번역 결정입니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 다수 표현의 보존
  chosen_reading: 수천 수천 / 수만 수만으로 유지해, 무리의 규모를 수치적 과장으로 남겼습니다.
  alternative_readings:
  - 무수한 무리
  - 셀이 수없이
  rationale: 천상 존재들의 규모를 일반적인 ‘무수한’으로 희석하지 않고, 원문의 수적 반복이 주는 압도감을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
