id: DAN.7.11
reference: Daniel 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית בֵּ/אדַ֗יִן מִן קָל֙ מִלַּיָּ֣/א רַבְרְבָתָ֔/א דִּ֥י קַרְנָ֖/א מְמַלֱּלָ֑ה חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּ֨י קְטִילַ֤ת חֵֽיוְתָ/א֙ וְ/הוּבַ֣ד גִּשְׁמַ֔/הּ וִ/יהִיבַ֖ת לִ/יקֵדַ֥ת אֶשָּֽׁא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/011.yaml
  text: I kept watching then because of the sound of the great words that the horn was speaking. I kept watching until the beast was killed[a], and its body was destroyed and given over to the burning fire.
  footnotes:
  - marker: a
    text: Or 'the boastful words' or 'the arrogant words'; literally 'the great words.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 그 큰 말들 때문에 계속 보고 있었습니다. 곧 그 뿔이 말하는 그 소리를 들었기 때문입니다. 나는 계속 보고 있었는데, 마침내 그 짐승이 죽임을 당하고 그 몸은 파괴되어 타는 불에 넘겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거만한 말들’ 혹은 ‘교만한 말들’; 문자적으로는 ‘큰 말들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  english_pob_choice: I kept watching
  chosen_korean: 계속 보고 있었습니다
  alternatives_korean:
  - 보고 있었습니다
  - 보았습니다
  lexicon: HALOT
  rationale: 아람어 분사+조동사 구문이 진행 중인 과거 관찰을 나타내므로, 단순 과거보다 지속성을 드러내는 표현을 택했습니다.
- source_word: מִן קָל מִלַּיָּא רַבְרְבָתָא
  english_pob_choice: because of the sound of the great words
  chosen_korean: 그 큰 말들 때문에 … 그 소리를 들었기 때문입니다
  alternatives_korean:
  - 그 큰 말들의 소리 때문에
  - 그 거만한 말들 때문에
  lexicon: HALOT
  rationale: מִן은 원인/계기를 나타내므로 인과를 드러냈고, מִלַּיָּא רַבְרְבָתָא의 문자적 의미를 살려 ‘큰 말들’로 옮겨 원문의 표현을 보존했습니다.
- source_word: קָל
  english_pob_choice: sound
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: HALOT
  rationale: 이 명사는 청각적 ‘소리’를 가리키며, 뿔이 내는 말의 강한 음향적 인상을 자연스럽게 전달합니다.
- source_word: קַרְנָא מְמַלֱּלָה
  english_pob_choice: the horn was speaking
  chosen_korean: 그 뿔이 말하는
  alternatives_korean:
  - 그 뿔이 말하고 있는
  - 그 뿔이 말하던
  lexicon: HALOT
  rationale: 현재분사적 진행성을 살려 환시 속에서 계속 말하는 장면을 자연스럽게 옮겼습니다.
- source_word: קְטִילַת חֵיוְתָא
  english_pob_choice: the beast was killed
  chosen_korean: 그 짐승이 죽임을 당하고
  alternatives_korean:
  - 그 짐승이 죽고
  - 그 짐승이 살해되고
  lexicon: HALOT
  rationale: 피동형의 처형/살해 뉘앙스를 살리기 위해 단순히 ‘죽다’보다 ‘죽임을 당하다’로 옮겼습니다.
- source_word: וְהוּבַד גִּשְׁמַהּ
  english_pob_choice: its body was destroyed
  chosen_korean: 그 몸은 파괴되어
  alternatives_korean:
  - 그 몸은 멸망하여
  - 그 시체는 파괴되어
  lexicon: HALOT
  rationale: גִּשְׁמַהּ는 ‘몸’을 뜻하므로 과도한 해석을 피하고, 동사의 파괴 의미를 직접 드러냈습니다.
- source_word: וִיהִיבַת לִיקֵדַת אֶשָּׁא
  english_pob_choice: given over to the burning fire
  chosen_korean: 타는 불에 넘겨졌습니다
  alternatives_korean:
  - 불타는 불에 넘겨졌습니다
  - 불의 타는 데 넘겨졌습니다
  lexicon: HALOT
  rationale: 명사구적 표현을 직역하되 한국어에서 자연스럽게 읽히도록 ‘타는 불에 넘겨졌다’로 옮겨, 심판의 이미지와 수동성을 보존했습니다.
theological_decisions:
- issue: ‘큰 말들’의 함의가 단순 크기인지, 교만/신성모독인지
  chosen_reading: 본문에는 ‘큰 말들’의 문자적 표현을 유지했습니다.
  alternative_readings:
  - 거만한 말들
  - 교만한 말들
  - 신성모독적인 말들
  rationale: 단어 자체는 ‘큰’이므로 본문은 어휘 형태를 보존하고, 다니엘서 문맥이 주는 교만한 뉘앙스는 독자가 읽어낼 수 있도록 열어 두었습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 환시의 상징을 해석어로 바꿀지 여부
  chosen_reading: ‘짐승’, ‘그 몸’, ‘불’의 환시 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 그 왕국이 무너졌습니다
  - 완전히 심판받았습니다
  rationale: 본문은 상징적 환상을 서술하므로, 해석을 미리 결론내기보다 상징 자체를 직접 번역하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
