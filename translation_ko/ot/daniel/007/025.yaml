base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
  footnotes:
  - marker: a
    text: Or 'appointed times' for 'times,' possibly referring to fixed seasons or festival times.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will be handed over to him'; the implied referent is most naturally the saints.
    reason: alternative_reading
  - marker: c
    text: Literally, 'for a time, times, and half a time'; this may denote a limited period, often understood as three and a half times/years.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 지극히 높으신 분을 거슬러 말들을 내뱉고, 지극히 높으신 분의 성도들을 지치게 할 것입니다. 그는 때들과 율법을 바꾸려 할 것이며, 그들은 한 때와 두 때와 반 때 동안 그의 손에 넘겨질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정한 때들’. ‘때들’이 절기나 고정된 예식 시기를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 그에게 넘겨질 것입니다’. 암시된 대상은 문맥상 가장 자연스럽게 성도들입니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘한 때와 두 때와 반 때’입니다. 보통 제한된 기간, 곧 삼 년 반으로 이해되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלִּין
  english_pob_choice: words
  chosen_korean: 말들
  alternatives_korean:
  - 말
  - 말씀
  - 발언
  lexicon: HALOT
  rationale: 아람어 복수 명사로서 단순한 ‘말/발언’의 뜻이며, 적대적 발화라는 문맥을 살려 ‘말들’로 옮겼습니다.
- source_word: לְצַד עֶלְיָא
  english_pob_choice: against the Most High
  chosen_korean: 지극히 높으신 분을 거슬러
  alternatives_korean:
  - 지극히 높으신 분에 대항하여
  - 지극히 높으신 분을 향하여
  lexicon: HALOT
  rationale: 문맥상 단순한 방향성이 아니라 하나님을 향한 반대·적대의 의미이므로, 표준적인 신칭인 ‘지극히 높으신 분’을 유지하면서 ‘거슬러’로 적대성을 드러냈습니다.
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  english_pob_choice: the saints of the Most High
  chosen_korean: 지극히 높으신 분의 성도들
  alternatives_korean:
  - 지극히 높으신 분의 거룩한 이들
  - 지극히 높으신 분의 거룩한 백성
  lexicon: HALOT
  rationale: 다니엘서의 용례상 하나님의 언약 백성을 가리키는 표현이므로, 간결하고 교회적 오해가 적은 ‘성도들’을 사용했습니다.
- source_word: וְ/יִסְבַּ֗ר לְ/הַשְׁנָיָה֙ זִמְנִ֣ין וְ/דָ֔ת
  english_pob_choice: He will intend to change times and law
  chosen_korean: 그는 때들과 율법을 바꾸려 할 것이며
  alternatives_korean:
  - 그는 때들과 법을 바꾸려 할 것이며
  - 그는 정한 때들과 율례를 바꾸려 할 것이며
  lexicon: HALOT
  rationale: ‘זִמְנִין’은 ‘때들/정한 때들’이 가능하지만 본문은 문구의 개방성을 유지하는 것이 좋고, ‘דָת’는 여기서 율법·법령의 범주를 가리키므로 POB의 ‘law’에 맞춰 ‘율법’으로 옮겼습니다.
theological_decisions:
- issue: ‘때들’(זִמְנִין)의 의미 범위
  chosen_reading: 달력적·예배적 ‘정한 때들’을 포함할 수 있으나 본문에서는 ‘때들’로 열어 둡니다.
  alternative_readings:
  - 정한 때들
  - 절기들
  - 시기들
  rationale: 본문 자체가 상징적·묵시적 표현을 사용하므로 특정 달력 체계로 곧장 좁히지 않고, 원문의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘그들은 … 그의 손에 넘겨질 것입니다’의 주어
  chosen_reading: 문맥상 가장 자연스럽게는 ‘성도들’이 그 대상입니다.
  alternative_readings:
  - 때들과 율법이 넘겨짐
  - 일반적 무생물 주어로 처리
  rationale: 마지막 절의 수동형은 바로 앞의 성도들과 연결되는 것이 가장 자연스럽지만, 본문은 대상을 직접 명시하지 않으므로 한국어도 암시를 살리되 과도하게 단정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
