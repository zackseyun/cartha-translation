  edition: WLC
  text: וּ/מִלִּ֗ין לְ/צַ֤ד עלי/א יְמַלִּ֔ל וּ/לְ/קַדִּישֵׁ֥י עֶלְיוֹנִ֖ין יְבַלֵּ֑א וְ/יִסְבַּ֗ר לְ/הַשְׁנָיָה֙ זִמְנִ֣ין וְ/דָ֔ת וְ/יִתְיַהֲב֣וּן בִּ/ידֵ֔/הּ עַד עִדָּ֥ן וְ/עִדָּנִ֖ין וּ/פְלַ֥ג עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
  footnotes:
  - marker: a
    text: Or 'appointed times' for 'times,' possibly referring to fixed seasons or festival times.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will be handed over to him'; the implied referent is most naturally the saints.
    reason: alternative_reading
  - marker: c
    text: Literally, 'for a time, times, and half a time'; this may denote a limited period, often understood as three and a half times/years.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 지극히 높으신 분을 거슬러 말할 것이며, 지극히 높으신 분의 성도들을 지치게 할 것입니다. 그는 때들[a]과 법을 바꾸려고 할 것이며, 그들은 한 때와 여러 때와 반 때[c] 동안 그의 손에 넘겨질 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정한 때들’. ‘때들’이 절기나 고정된 예식 시기를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 그에게 넘겨질 것입니다’. 암시된 대상은 문맥상 가장 자연스럽게 성도들입니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘한 때와 여러 때와 반 때’입니다. 이 표현은 종종 삼 년 반으로 이해되기도 하지만, 정확한 기간은 논쟁의 여지가 있습니다.
    reason: alternative_reading
