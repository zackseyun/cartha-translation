id: DAN.7.28
reference: Daniel 7:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד כָּ֖ה סוֹפָ֣/א דִֽי מִלְּתָ֑/א אֲנָ֨ה דָֽנִיֵּ֜אל שַׂגִּ֣יא רַעְיוֹנַ֣/י יְבַהֲלֻנַּ֗/נִי וְ/זִיוַ/י֙ יִשְׁתַּנּ֣וֹן עֲלַ֔/י וּ/מִלְּתָ֖/א בְּ/לִבִּ֥/י נִטְרֵֽת־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/028.yaml
  text: This is the end of the matter[a]. As for me, Daniel, my thoughts greatly terrified me, and my appearance changed because of it[b]; but I kept the matter in my heart.
  footnotes:
  - marker: a
    text: Or 'the conclusion of the matter.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my countenance changed' or 'my brightness changed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 그 일의 끝입니다[a]. 나 다니엘은 생각들이 크게 나를 두렵게 했고, 그 일 때문에 내 모습도 변하였습니다[b]. 그러나 나는 그 일을 내 마음에 간직하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 일의 결론입니다.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 얼굴빛이 변하였습니다’ 혹은 ‘내 밝음이 변하였습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: עַד כָּה / סוֹפָא דִי מִלְּתָא
  english_pob_choice: This is the end of the matter
  chosen_korean: 이것이 그 일의 끝입니다
  alternatives_korean:
  - 이것이 그 일의 결론입니다
  - 여기까지가 그 일의 끝입니다
  lexicon: HALOT
  rationale: 아람어 관용구가 비전 보고의 종결 선언을 이루므로, 현대 한국어로 자연스럽게 ‘끝’으로 옮기되 ‘그 일’로 מִלְּתָא의 지시 대상을 살렸습니다.
- source_word: אֲנָה דָנִיֵּאל
  english_pob_choice: As for me, Daniel
  chosen_korean: 나 다니엘은
  alternatives_korean:
  - 내가 다니엘은
  - 나는 다니엘입니다
  lexicon: HALOT
  rationale: 독립 인칭대명사와 이름의 강조를 반영하여, 한국어에서도 주제를 앞세운 ‘나 다니엘은’으로 자기지시의 강조를 살렸습니다.
- source_word: שַׂגִּיא רַעְיוֹנַי יְבַהֲלֻנַּנִי
  english_pob_choice: my thoughts greatly terrified me
  chosen_korean: 생각들이 크게 나를 두렵게 했고
  alternatives_korean:
  - 내 생각들이 크게 나를 놀라게 했고
  - 내 생각들이 심히 나를 괴롭게 했고
  lexicon: HALOT
  rationale: רַעְיוֹנַי를 ‘생각들’로, יְבַהֲלֻנַּנִי의 강한 동요를 ‘두렵게 했고’로 옮겨 비전 앞의 심리적 충격을 직접적으로 드러냈습니다.
- source_word: וְזִיוַי יִשְׁתַּנּוֹן עֲלַי
  english_pob_choice: my appearance changed because of it
  chosen_korean: 그 일 때문에 내 모습도 변하였습니다
  alternatives_korean:
  - 내 용모도 변하였습니다
  - 내 얼굴빛도 변하였습니다
  lexicon: HALOT
  rationale: זִיו의 ‘외적 모습/얼굴빛’ 가능성을 한국어의 넓은 표현인 ‘모습’으로 처리해, 주석 없이도 문맥상 자연스럽고 과도하게 좁히지 않게 했습니다.
- source_word: בְּלִבִּי נִטְרֵת
  english_pob_choice: I kept the matter in my heart
  chosen_korean: 그 일을 내 마음에 간직하였습니다
  alternatives_korean:
  - 그 일을 내 마음에 지켰습니다
  - 그 일을 내 마음속에 보존하였습니다
  lexicon: HALOT
  rationale: ‘마음’은 성서적 내면 언어를 보존하고, נִטְרֵת의 ‘지키다/간직하다’ 중에서는 현대 한국어에서 가장 자연스러운 ‘간직하다’를 택했습니다.
theological_decisions:
- issue: ‘마음’의 인류학적 표현 보존
  chosen_reading: ‘마음’으로 번역해 내면의 기억·숙고·보존의 자리를 함께 드러냈습니다.
  alternative_readings:
  - 생각
  - 마음속
  - 내면
  rationale: 이 구절은 단순한 인지 기능보다 성서적 내면 전체를 가리키므로, ‘마음’을 유지하는 편이 원문의 인류학을 더 온전히 보존합니다.
  doctrine_reference: 번역 원칙 §6; 성서적 인간 이해 보존
- issue: 다니엘의 고백체 문장 구조
  chosen_reading: ‘나 다니엘은’으로 시작해 강조와 직접 증언의 분위기를 살렸습니다.
  alternative_readings:
  - 나는 다니엘입니다
  - 내가 다니엘은
  rationale: 아람어의 독립 주어 강조를 한국어에서도 드러내기 위해, 서술형보다 증언체에 가까운 문장 구조를 선택했습니다.
  doctrine_reference: 원문 수사 구조 보존
