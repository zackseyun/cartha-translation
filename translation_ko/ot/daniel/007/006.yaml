  source_fidelity: 초안은 시간 순서, 지속적 관찰, 네 날개와 네 머리, 그리고 부여자의 미명시를 대체로 충실히 반영합니다. 그러나 ‘또 하나가 나타났습니다’는 원문에 없는 ‘나타남’ 사건을 보태며, ‘또 하나’는 문맥상 보충되어야 할 ‘짐승’을 명시하지 않아 다소 불완전합니다. ‘권세’도 가능하나 שָׁלְטָן의 통치·지배의 범위를 ‘통치권’이 더 직접적으로 나타냅니다.
  naturalness: ‘보십시오’는 현대 한국어 환시 서술에서 독자에게 직접 명령하는 듯하여 다소 부자연스럽습니다. ‘보니’는 감탄적 주의 환기의 기능을 자연스럽게 살립니다. 날개를 ‘달려 있었다’고 하면 부착 방식을 다소 구체화하므로, 원문의 단순 위치 표현에 맞게 ‘있었다’로 옮기는 것이 안전합니다.
  terminology: 다니엘 7장의 상징적 동물에는 ‘짐승’을 유지하는 것이 적절합니다. שָׁלְטָן은 단순 개인적 ‘권세’보다 통치권·지배권을 뜻하므로 ‘통치권’으로 조정합니다. 부여자는 계속 수동형으로 미명시합니다.
  issues:
