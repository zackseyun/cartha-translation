  text: After this I kept looking[a], and behold, another, like a leopard; it had four wings of a bird on its back, and the beast had four heads, and dominion was given to it.
  footnotes:
  - marker: a
    text: Or 'on its sides'; the Aramaic expression may denote the creature's back or upper body more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 내가 계속 보고 있었는데, 보니 표범과 같은 또 다른 짐승이 있었습니다. 그 등[a] 위에 새의 날개 넷이 있었고, 그 짐승에게는 머리 넷이 있었으며, 통치권이 그것에게 주어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘등’으로 옮긴 아람어 표현은 짐승의 등 또는 더 넓게는 윗부분을 가리킬 수 있습니다.
    reason: lexical_alternative
