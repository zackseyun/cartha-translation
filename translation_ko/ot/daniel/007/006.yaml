revisions:
- from: 그 뒤에 내가 계속 보고 있었는데, 보십시오, 또 하나가 나타났습니다. 그것은 표범과 같았고, 그 등의 위에는 새의 날개 넷이 달려 있었으며, 그 짐승에게는 머리 넷이 있었고, 권세가 그것에게 주어졌습니다.[a]
  to: 그 뒤에 내가 계속 보고 있었는데, 보니 표범과 같은 또 다른 짐승이 있었습니다. 그 등[a] 위에 새의 날개 넷이 있었고, 그 짐승에게는 머리 넷이 있었으며, 통치권이 그것에게 주어졌습니다.
  rationale: 원문에 없는 ‘나타났다’를 제거하고, אָחֳרִי가 가리키는 ‘또 다른 짐승’을 한국어 본문에서 명시했습니다. 감탄적 주의 환기는 자연스러운 환시 서술인 ‘보니’로 처리했습니다. 위치 표현은 원문의 범위를 넘지 않도록 ‘날개가 있었다’로 옮겼고, 관련 각주 표지를 ‘등’에 붙였습니다. 마지막으로 שָׁלְטָן의 통치적 의미를 ‘통치권’으로 명료하게 하되, 수동형을 유지하여 부여자를 특정하지 않았습니다.
