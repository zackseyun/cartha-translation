  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּן֮ אֲמַר֒ חֵֽיוְתָ/א֙ רְבִיעָ֣יְתָ֔/א מַלְכ֤וּ רביעי/א תֶּהֱוֵ֣א בְ/אַרְעָ֔/א דִּ֥י תִשְׁנֵ֖א מִן כָּל מַלְכְוָתָ֑/א וְ/תֵאכֻל֙ כָּל אַרְעָ֔/א וּ/תְדוּשִׁנַּ֖/הּ וְ/תַדְּקִנַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/023.yaml
  text: 'Thus he said: ‘The fourth beast will be a fourth kingdom on the earth[a], which will be different from all the kingdoms[b]; and it will devour the whole earth and trample it down and crush it.’'
  footnotes:
  - marker: a
    text: Or “which will differ from all the kingdoms.”
    reason: lexical_alternative
  - marker: b
    text: Or “and break it in pieces.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이렇게 말했습니다. 「넷째 짐승은 땅 위에[a] 넷째 나라가 될 것이며, 모든 나라들과는 다를 것입니다[b]. 그것은 온 땅을 삼키고, 그것을 짓밟고, 부술 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅에서.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “모든 나라들과는 달라질 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן אֲמַר
  english_pob_choice: Thus he said
  chosen_korean: 그는 이렇게 말했습니다
  alternatives_korean:
  - 그리하여 그가 말했습니다
  - 이처럼 그가 말했습니다
  lexicon: HALOT
  rationale: 예언-해석 전환을 나타내는 도입부로서 자연스러운 보고문을 살리되, 합쇼체 서술에 맞게 간결하게 옮겼습니다.
- source_word: חֵיוְתָא רְבִיעָתָא / מַלְכוּ רביעיא
  english_pob_choice: the fourth beast ... a fourth kingdom
  chosen_korean: 넷째 짐승은 ... 넷째 나라가 될 것이며
  alternatives_korean:
  - 넷째 짐승은 ... 넷째 왕국이 될 것이며
  - 넷째 짐승은 ... 넷째 통치가 될 것이며
  lexicon: HALOT
  rationale: 본문이 짐승을 정치적 실체로 해석하므로 ‘나라’로 옮겨, 상징과 해석을 함께 드러냈습니다.
- source_word: בְאַרְעָא
  english_pob_choice: on the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅에서
  - 세상에
  lexicon: HALOT
  rationale: 다니엘 7장의 우주적 범위를 살리면서도, 한국어에서 자연스러운 위치 표현으로 옮겼습니다.
- source_word: דִּי תִשְׁנֵא מִן כָּל מַלְכְוָתָא
  english_pob_choice: which will be different from all the kingdoms
  chosen_korean: 모든 나라들과는 다를 것입니다
  alternatives_korean:
  - 모든 나라들과는 구별될 것입니다
  - 모든 나라들과는 다르게 될 것입니다
  lexicon: HALOT
  rationale: 히브리/아람어의 비교적 차이를 단순한 ‘달라짐’으로 유지하되, 한국어 관용에 맞게 ‘-와는 다르다’ 구조로 옮겼습니다.
- source_word: וְתֵאכֻל ... וּתְדוּשִׁנַּהּ וְתַדְּקִנַּהּ
  english_pob_choice: and it will devour ... and trample it down and crush it
  chosen_korean: 그리고 그것은 온 땅을 삼키고, 그것을 짓밟고, 그것을 부수어 버릴 것입니다
  alternatives_korean:
  - 그리고 그것은 온 땅을 먹어 삼키고, 그것을 밟아 짓이기고, 그것을 산산이 부술 것입니다
  - 그리고 그것은 온 땅을 집어삼키고, 그것을 짓밟고, 그것을 깨뜨릴 것입니다
  lexicon: HALOT
  rationale: 짐승의 폭력적 이미지를 약화시키지 않도록 동사군의 점층을 살렸고, ‘부수어 버리다’로 최종 파괴를 강조했습니다.
theological_decisions:
- issue: 짐승과 나라의 동일시
  chosen_reading: ‘넷째 짐승은 넷째 나라가 될 것입니다’로 옮겨, 본문 안의 해석적 동일시를 그대로 드러냈습니다.
  alternative_readings:
  - 짐승 이미지를 더 모호하게 두는 번역
  - ‘왕국’으로 옮기는 번역
  rationale: 아람어 본문이 상징을 정치적 실체로 해설하고 있으므로, 상징성보다 해석을 우선 반영하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 단 7:17, 23의 내적 해석 구조
- issue: 온 땅의 범위
  chosen_reading: ‘온 땅’으로 옮겨 전면적 파괴의 범위를 유지했습니다.
  alternative_readings:
  - ‘온 세상’
  - ‘전 세계’
  rationale: אַרְעָא의 범위를 과도하게 현대화하지 않으면서도, 본문의 보편적·제국적 파괴력을 드러내기에 가장 직접적입니다.
  doctrine_reference: 다니엘 7장의 제국 상징성
