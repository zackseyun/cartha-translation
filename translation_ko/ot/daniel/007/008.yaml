revisions:
- from: 내가 계속 그 뿔들을 살펴보는데, 보라, 또 다른 작은 뿔 하나가 그들 사이에서 올라왔고, 그 첫째 뿔들 셋은 그것 앞에서 뿌리째 뽑혔습니다. 그리고 보라, 이 뿔에는 사람의 눈 같은 눈이 있었고, 큰일들을 말하는 입이 있었습니다.[a][b]
  to: 내가 그 뿔들을 유심히 살펴보고 있었습니다. 그런데 보십시오, 또 다른 작은 뿔 하나가 그들 사이에서 올라왔고, 먼저 있던 뿔 세 개가 그 뿔 앞에서 뿌리째 뽑혔습니다. 보십시오, 이 뿔에는 사람의 눈 같은 눈[a]이 있었고, 큰 것들을 말하는 입[b]이 있었습니다.
  rationale: 지속 과거의 환상 서술을 일관되게 만들고, 시간상 앞선 뿔들의 의미를 자연스러운 한국어로 드러냈습니다. רַבְרְבָן은 ‘큰 것들’로 유지하여 교만·자랑의 해석을 본문에 강요하지 않았으며, 그 해석 가능성은 각주에 남겼습니다. 각주를 실제 해당 어구에 연결하고 a 각주의 중복을 해소했습니다.
