  terminology: ‘뿔’, ‘뿌리째 뽑히다’, ‘사람의 눈 같은 눈’은 적절합니다. ‘큰 것들을 말하는 입’은 본문의 비평가적 함의를 확정하지 않으면서도 ‘큰일들’의 한국어 오해를 피합니다. 각주 a는 본문과 사실상 동일하여 대안 기능을 하지 못했고, 두 각주 모두 문장 끝에 함께 붙어 있어 해당 어구의 앵커가 불명확했습니다.
