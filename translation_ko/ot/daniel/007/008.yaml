  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִשְׂתַּכַּ֨ל הֲוֵ֜ית בְּ/קַרְנַיָּ֗/א וַ֠/אֲלוּ קֶ֣רֶן אָחֳרִ֤י זְעֵירָה֙ סִלְקָ֣ת ביני/הון וּ/תְלָ֗ת מִן קַרְנַיָּ/א֙ קַדְמָ֣יָתָ֔/א אתעקרו מִן קדמי/ה וַ/אֲל֨וּ עַיְנִ֜ין כְּ/עַיְנֵ֤י אֲנָשָׁ/א֙ בְּ/קַרְנָ/א דָ֔א וּ/פֻ֖ם מְמַלִּ֥ל רַבְרְבָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/008.yaml
  text: I was considering the horns[a], and behold, another horn, a little one, came up among them, and three of the first horns were uprooted before it. And behold, in this horn were eyes like the eyes of a man[b], and a mouth speaking great things.
  footnotes:
  - marker: a
    text: Or 'eyes like human eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a mouth speaking boastful things' or 'uttering great boasts.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 계속 그 뿔들을 살펴보는데, 보라, 또 다른 작은 뿔 하나가 그들 사이에서 올라왔고, 그 첫째 뿔들 셋은 그것 앞에서 뿌리째 뽑혔습니다. 그리고 보라, 이 뿔에는 사람의 눈 같은 눈이 있었고, 큰일들을 말하는 입이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 눈 같은 눈’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘자랑하는 말’ 또는 ‘큰 자랑을 토하는 입’
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׂתַּכַּ֨ל הֲוֵית
  english_pob_choice: I was considering
  chosen_korean: 내가 계속 그 뿔들을 살펴보는데
  alternatives_korean:
  - 내가 그 뿔들을 보고 있었는데
  - 내가 그 뿔들을 유심히 살펴보는데
  lexicon: HALOT
  rationale: 진행 중인 과거의 주의 깊은 관찰을 살리기 위해 ‘계속 … 살펴보는데’로 옮겼습니다. 단순 시각보다 숙고와 응시의 뉘앙스를 함께 담습니다.
- source_word: וַאֲלוּ
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 봐라
  lexicon: HALOT
  rationale: 환시 전환을 알리는 감탄사로서, 예언·묵시 문맥의 격조를 살리는 ‘보라’를 택했습니다.
- source_word: קֶרֶן אָחֳרִי זְעֵירָה
  english_pob_choice: another horn, a little one
  chosen_korean: 또 다른 작은 뿔 하나
  alternatives_korean:
  - 또 다른 작은 뿔
  - 다른 작은 뿔 하나
  lexicon: HALOT
  rationale: ‘또 다른’과 ‘작은’의 두 요소를 모두 드러내되, 한국어 어순에 맞게 자연스럽게 묶었습니다.
- source_word: אתעקרו
  english_pob_choice: were uprooted
  chosen_korean: 뿌리째 뽑혔습니다
  alternatives_korean:
  - 뿌리째 뽑혔습니다
  - 끌어내려졌습니다
  - 뽑혀 나갔습니다
  lexicon: HALOT
  rationale: 동사의 폭력적 제거 이미지를 살리기 위해 ‘뿌리째 뽑히다’를 선택했습니다.
- source_word: עַיְנִין כְּעַיְנֵי אֲנָשָׁא
  english_pob_choice: eyes like the eyes of a man
  chosen_korean: 사람의 눈 같은 눈
  alternatives_korean:
  - 사람 눈 같은 눈
  - 인간의 눈 같은 눈
  lexicon: HALOT
  rationale: 주석의 대안처럼 ‘human’으로 일반화하기보다 본문 이미지에 가까운 ‘사람의 눈’으로 직역성을 유지했습니다.
- source_word: וּפֻם מְמַלִּל רַבְרְבָן
  english_pob_choice: a mouth speaking great things
  chosen_korean: 큰일들을 말하는 입
  alternatives_korean:
  - 큰일들을 말하는 입
  - 큰소리를 내는 입
  - 자랑스러운 일들을 말하는 입
  lexicon: HALOT
  rationale: רַבְרְבָן을 본문 그대로 ‘큰일들’로 옮겨, ‘교만한 말’로 미리 해석을 굳히지 않았습니다. 이는 본문이 유지하는 표현상의 긴장을 보존합니다.
theological_decisions:
- issue: רַבְרְבָן의 함의—‘큰일들’인가 ‘자랑/교만’인가
  chosen_reading: 본문 표현을 따라 ‘큰일들’로 두고, 의미상으로는 과장·교만의 가능성을 열어 둡니다.
  alternative_readings:
  - 자랑하는 말
  - 교만한 말
  - 큰 자랑
  rationale: 아람어는 형식상 ‘큰 것들/큰일들’을 말하므로, 본문 단계에서 곧바로 비난적 의미로 확정하지 않고 독자가 문맥으로 판단하도록 남겨 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문의 어휘적 긴장을 보존하고 문맥적 해석을 주석으로 넘김.
