id: DAN.7.18
reference: Daniel 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִֽ/יקַבְּלוּן֙ מַלְכוּתָ֔/א קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/יַחְסְנ֤וּן מַלְכוּתָ/א֙ עַֽד עָ֣לְמָ֔/א וְ/עַ֖ד עָלַ֥ם עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/018.yaml
  text: But the holy ones of the Most High will receive the kingdom and possess the kingdom forever—forever and ever[a].
  footnotes:
  - marker: a
    text: Or 'the saints of the Most High.' The Aramaic expression may refer to God's holy people; some interpreters also understand a heavenly reference in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 이의 거룩한 이들은 나라를 받아 영원히—곧 영원무궁토록—그 나라를 소유할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 이의 성도들’로 옮길 수 있습니다. 아람어 표현은 하나님의 거룩한 백성을 가리킬 수도 있고, 이 문맥에서는 하늘의 존재를 가리킨다고 이해하는 해석도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  english_pob_choice: the holy ones of the Most High
  chosen_korean: 지극히 높으신 이의 거룩한 이들
  alternatives_korean:
  - 지극히 높으신 분의 성도들
  - 지극히 높으신 이의 성도들
  - 지극히 높으신 이의 거룩한 자들
  lexicon: HALOT
  rationale: 아람어의 명사적 형용사 표현을 직역에 가깝게 살려 ‘거룩한 이들’로 옮기되, 소유격은 하나님의 칭호를 드러내는 ‘지극히 높으신 이의’로 처리했습니다.
- source_word: וִיקַבְּלוּן
  english_pob_choice: will receive
  chosen_korean: 나라를 받아
  alternatives_korean:
  - 나라를 받을
  - 나라를 얻게 될
  - 나라를 받게 될
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘받다/받아들이다’를 살려 수동을 덧붙이지 않고 ‘받아’로 옮겼습니다.
- source_word: מַלְכוּתָא
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 왕국
  - 나라와 통치
  lexicon: HALOT
  rationale: 다니엘 7장의 대비 구조에서 ‘왕권’보다 대상적·종말론적 실체를 가리키는 ‘나라’가 자연스럽고, 본문의 약속 구조를 잘 드러냅니다.
- source_word: וְיַחְסְנוּן
  english_pob_choice: and possess
  chosen_korean: 소유할 것입니다
  alternatives_korean:
  - 차지할 것입니다
  - 소유하게 될 것입니다
  - 가질 것입니다
  lexicon: HALOT
  rationale: 지속적 소유의 뜻을 살려 단순한 ‘가짐’보다 ‘소유’로 옮겼습니다.
- source_word: עַד עָלְמָא / וְעַד עָלַם עָלְמַיָּא
  english_pob_choice: forever—forever and ever
  chosen_korean: 영원히—곧 영원무궁토록—
  alternatives_korean:
  - 영원히—영원히 또 영원히—
  - 세세토록—곧 세세무궁토록—
  - 영원히—영원히 그리고 또 영원히—
  lexicon: HALOT
  rationale: 두 겹의 종결어구를 한국어의 관용적 중첩 표현으로 옮겨 강조를 보존했습니다.
theological_decisions:
- issue: ‘지극히 높으신 이의 거룩한 이들’의 정체
  chosen_reading: ‘성도’로 좁히지 않고, 본문 그대로 ‘거룩한 이들’로 유지했습니다.
  alternative_readings:
  - 지극히 높으신 이의 성도들
  - 지극히 높으신 이의 백성
  - 천상의 거룩한 존재들
  rationale: 다니엘 7장에서는 이 표현이 하나님의 백성과 천상적 존재를 모두 염두에 둘 수 있어, 본문이 허용하는 해석적 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
