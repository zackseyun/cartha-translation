  naturalness: ‘그리고’와 ‘네 마리의 큰 짐승’, ‘바다에서 올라오고 있었습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 두 절로 나누어 ‘서로 달랐습니다’라고 하면 부자연스러운 연결 어미와 외형 한정도 피할 수 있습니다.
