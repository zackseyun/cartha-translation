lexical_decisions:
- source_word: חֵיוָן
  english_pob_choice: beasts
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 생물
  lexicon: HALOT
  rationale: 묵시 문맥에서 단순한 동물보다 위협적이고 상징적인 존재를 가리키므로, POB의 'beasts'에 맞게 '짐승'이 가장 자연스럽고 강합니다.
- source_word: רַבְרְבָן
  english_pob_choice: great
  chosen_korean: 큰
  alternatives_korean:
  - 커다란
  - 위대한
  lexicon: HALOT
  rationale: 크기와 위압감을 함께 담되, '짐승'과 결합할 때 한국어에서 가장 직관적인 표현은 '큰'입니다.
- source_word: סָלְקָן
  english_pob_choice: were coming up
  chosen_korean: 올라오고 있었는데
  alternatives_korean:
  - 올라왔는데
  - 올라오고 있었고
  lexicon: HALOT
  rationale: 진행 중인 상승 동작을 살리기 위해 진행형을 택했고, 환상 장면의 흐름상 배경 설명처럼 이어지도록 '-고 있었는데'로 옮겼습니다.
- source_word: מִן יַמָּא
  english_pob_choice: from the sea
  chosen_korean: 바다에서
  alternatives_korean:
  - 바다로부터
  - 바다 밖에서
  lexicon: HALOT
  rationale: 출처를 나타내는 전치사 מן의 기본값을 반영하면서, 한국어로는 가장 자연스러운 '바다에서'가 원문의 방향성을 잘 살립니다.
- source_word: שָׁנְיָן דָּא מִן דָּא
  english_pob_choice: different from one another
  chosen_korean: 서로 다르게
  alternatives_korean:
  - 서로 서로 달라
  - 서로 구별되게
  lexicon: HALOT
  rationale: 상호적 차이를 표현하는 관용구로, 한국어에서는 '서로 다르게'가 가장 간결하면서도 의미를 정확히 전달합니다.
theological_decisions:
- issue: 묵시적 상징의 보존
  chosen_reading: חֵיוָן을 '짐승'으로 옮겨, 단순한 동물 묘사로 순화하지 않았습니다.
  alternative_readings:
  - 동물
  - 생물
  rationale: 이 단어는 후속 해석에서 제국들을 상징하는 괴수적 존재이므로, 본문이 지닌 불길함과 상징성을 유지하는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve symbolic force without pre-empting interpretation.'
