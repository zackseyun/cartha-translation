id: DAN.2.9
reference: Daniel 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּ֣י הֵן חֶלְמָ/א֩ לָ֨א תְהֽוֹדְעֻנַּ֜/נִי חֲדָה הִ֣יא דָֽתְ/כ֗וֹן וּ/מִלָּ֨ה כִדְבָ֤ה וּ/שְׁחִיתָה֙ הזמנתון לְ/מֵאמַ֣ר קָֽדָמַ֔/י עַ֛ד דִּ֥י עִדָּנָ֖/א יִשְׁתַּנֵּ֑א לָהֵ֗ן חֶלְמָ/א֙ אֱמַ֣רוּ לִ֔/י וְֽ/אִנְדַּ֕ע דִּ֥י פִשְׁרֵ֖/הּ תְּהַחֲוֻנַּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/009.yaml
  text: But if you do not make the dream known to me[a], there is only one decree for you, for you have agreed to speak lying and corrupt words before me until the time changes. Therefore tell me the dream[c][b], and I will know that you can make its interpretation known to me.
  footnotes:
  - marker: a
    text: Or 'there is one sentence for you' or 'there is one law for you.' The Aramaic דָּת can denote a decree, law, or judicial sentence in royal-court context.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have prepared' or 'you have arranged' to speak false and corrupt words before me. The verb suggests deliberate preparation; 'agreed' brings out the collective sense in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'until the times change.' The singular 'time' is retained in the main text as the closer rendering of the Aramaic form.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그대들이 꿈을 나에게 알려 주지 않으면, 그대들에게는 단 하나의 판결만 있습니다. 그대들은 거짓되고 부패한 말을 내 앞에서 하기로 합의해 왔으니, 때가 바뀔 때까지 그러할 것입니다. 그러므로 꿈을 나에게 말하십시오. 그러면 그대들이 그 해석을 나에게 알려 줄 수 있는지 내가 알겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘판결’은 궁정 맥락의 דָּת를 옮긴 것입니다. 이 어휘는 문맥에 따라 ‘법’이나 ‘법령’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알려 주다’는 아람어 히필형의 ‘알게 하다/통지하다’ 뉘앙스를 살린 번역입니다.
    reason: source_note
  - marker: c
    text: ‘때’는 아람어 단수형을 반영한 번역입니다. 문맥상 ‘때들이’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי הֵן
  english_pob_choice: But if
  chosen_korean: 만일
  alternatives_korean:
  - 그러나 만일
  - 만일
  lexicon: HALOT
  rationale: 조건절의 시작을 분명히 하되, 앞절과의 반대/전환 뉘앙스는 문맥상 자연스럽게 드러나므로 한국어에서는 간결한 ‘만일’로 옮겼습니다.
- source_word: לָא תְהוֹדְעֻנַּנִי
  english_pob_choice: you do not make the dream known to me
  chosen_korean: 꿈을 나에게 알려 주지 않으면
  alternatives_korean:
  - 꿈을 내게 알리지 않으면
  - 꿈을 나에게 말씀해 주지 않으면
  lexicon: HALOT
  rationale: hifil의 ‘알게 하다/알리다’ 의미를 살려 ‘알려 주다’로 옮겼고, 왕의 직접 화법이므로 지나친 공손화는 피했습니다.
- source_word: חֲדָה הִיא דָתְכוֹן
  english_pob_choice: there is only one decree for you
  chosen_korean: 그대들에게는 단 하나의 판결만 있습니다
  alternatives_korean:
  - 그대들에게는 오직 하나의 법이 있습니다
  - 그대들에게는 한 가지 선고만 있습니다
  lexicon: HALOT
  rationale: דָּת는 궁정 맥락에서 법/판결/명령을 가리킬 수 있으나, 문맥상 왕의 위협적 선언을 가장 직접적으로 드러내는 ‘판결’을 택했습니다.
- source_word: וּמִלָּה כִדְבָה וּשְׁחִיתָה
  english_pob_choice: lying and corrupt words
  chosen_korean: 거짓되고 부패한 말
  alternatives_korean:
  - 거짓말과 부패한 말
  - 거짓되고 타락한 말
  lexicon: HALOT
  rationale: 두 수식어를 한국어 관용에 맞게 형용사구로 압축하되, ‘부패한’으로 שְׁחִיתָה의 ‘훼손/타락/부패’ 뉘앙스를 살렸습니다.
- source_word: עַד דִּי עִדָּנָא יִשְׁתַּנֵּא
  english_pob_choice: until the time changes
  chosen_korean: 때가 바뀔 때까지
  alternatives_korean:
  - 때가 바뀔 때까지
  - 시대가 바뀔 때까지
  lexicon: HALOT
  rationale: 아람어 단수형 ‘때’를 유지하면서, 문맥상 상황 전환을 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: פִשְׁרֵהּ
  english_pob_choice: its interpretation
  chosen_korean: 그 해석
  alternatives_korean:
  - 그 뜻풀이
  - 그 의미
  lexicon: HALOT
  rationale: 다니엘서에서 הפשר/פשר는 꿈의 ‘해석’이라는 기술적 용례가 반복되므로 일관성을 위해 ‘해석’으로 번역했습니다.
theological_decisions:
- issue: 왕의 명령문에서 직접명령의 높임 정도
  chosen_reading: 인물 간 대화이지만 왕의 위압적 발언이므로 한국어에서는 중립적 명령형을 사용했고, 하나님께 드리는 높임 표현은 적용하지 않았습니다.
  alternative_readings:
  - 더 공손한 ‘말씀하십시오’
  - 더 직설적인 ‘말하시오’
  rationale: 원문은 궁정 장면의 권위적 압박을 드러내므로, 현대 합쇼체 안에서 과도한 공손화 없이 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 서술 화법과 담화 상황의 재현
- issue: ‘꿈을 알려 주다’와 ‘해석을 알려 주다’의 반복
  chosen_reading: 두 번의 ‘알려 주다’를 유지해 히필 ידע의 반복적 요구를 드러냈습니다.
  alternative_readings:
  - 첫 번째만 ‘말하다’로 완화
  - 둘째를 ‘풀이하다’로 의역
  rationale: 왕의 요구는 단순한 정보 전달이 아니라 숨겨진 내용을 ‘알게 하는’ 행위이므로, 동일한 동사를 반복해 압박과 시험의 성격을 보존했습니다.
  doctrine_reference: 원문 반복 구조 보존
