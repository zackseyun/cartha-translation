  source_fidelity: 아람어의 조건문, 약속, 명령의 구조와 ‘꿈 및 그 해석’의 반복은 대체로 잘 반영되었습니다. 다만 תְּהַחֲוֺן은 복수 청자에 대한 단순 조건절이지 청자를 높이는 표현은 아니므로 ‘알려 주시면’의 주체 높임은 피하는 편이 정확합니다. 반복 명령도 왕의 직접 요구에 맞게 ‘알리십시오’로 옮기는 것이 더 충실합니다.
  naturalness: ‘제게서’와 뒤의 ‘내게’가 한 절 안에서 섞여 있어 화자의 지칭이 일관되지 않습니다. 또한 ‘알려 주시다’는 청자가 화자에게 호의를 베푸는 뉘앙스와 주체 높임을 더합니다. 현대 표준어 합쇼체에서는 ‘나에게 … 알리십시오’가 자연스럽고 문맥에 알맞습니다.
  terminology: ‘해석’, ‘선물’, ‘상’, ‘큰 영예’는 적절합니다. ‘상’은 왕이 주는 보상을 자연스럽게 나타내며, 원문의 수를 한국어에서 부당하게 한정하지 않습니다.
