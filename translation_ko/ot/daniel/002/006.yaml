base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/006.yaml
  text: But if you make known the dream and its interpretation[a], you will receive from me gifts and rewards and great honor. Therefore make known to me the dream and its interpretation.
  footnotes:
  - marker: a
    text: Or 'show me' / 'declare to me' for the repeated Aramaic verb meaning 'make known.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 꿈과 그 해석을 알려 주시면, 제게서 선물과 상과 큰 영예를 받게 될 것입니다. 그러므로 내게 꿈과 그 해석을 알려 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알려 주시다/알려 주십시오’는 반복되는 아람어 동사 חוה를 같은 방식으로 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וְהֵן
  english_pob_choice: But if
  chosen_korean: 그러나 … 주시면
  alternatives_korean:
  - 그리고 … 주시면
  - 만일 … 주시면
  lexicon: HALOT
  rationale: 앞절의 위협적 조건문에 대비되는 역접을 살리기 위해 ‘그러나’를 두었고, 조건 의미는 종결 어미로 자연스럽게 처리했습니다.
- source_word: תְּהַחֲוֺן / הַחֲוֺנִי
  english_pob_choice: make known / make known to me
  chosen_korean: 알려 주시다 / 알려 주십시오
  alternatives_korean:
  - 말씀해 주시다 / 말씀해 주십시오
  - 드러내 주시다 / 드러내 주십시오
  lexicon: HALOT
  rationale: 아람어 חוה의 사역적 의미를 따라 단순히 ‘보이다’보다 ‘알려 주다’가 더 정확하며, 반복되는 동사를 같은 표현으로 맞춰 문맥의 긴박함을 살렸습니다.
- source_word: וּנְבִזְבָּה
  english_pob_choice: and rewards
  chosen_korean: 상
  alternatives_korean:
  - 보상
  - 포상
  lexicon: HALOT
  rationale: 왕이 약속하는 보상의 성격을 현대 한국어에서 간결하게 드러내는 말로 ‘상’을 택했습니다.
- source_word: וִיקָר שַׂגִּיא
  english_pob_choice: and great honor
  chosen_korean: 큰 영예
  alternatives_korean:
  - 큰 존영
  - 큰 명예
  lexicon: HALOT
  rationale: יקָר의 핵심 의미인 존귀함·명예를 살리되, שַׂגִּיא의 강화를 자연스럽게 반영하기 위해 ‘큰 영예’로 옮겼습니다.
