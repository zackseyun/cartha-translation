source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּנִיֵּ֗אל הֲתִיב֙ עֵטָ֣א וּ/טְעֵ֔ם לְ/אַרְי֕וֹךְ רַב טַבָּחַיָּ֖/א דִּ֣י מַלְכָּ֑/א דִּ֚י נְפַ֣ק לְ/קַטָּלָ֔ה לְ/חַכִּימֵ֖י בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/014.yaml
  text: Then Daniel answered Arioch[a], the chief of the king’s executioners, with counsel and discretion—the one who had gone out to kill the wise men of Babylon.
  footnotes:
  - marker: a
    text: Or 'the captain of the king’s guard.' The Aramaic title is literally 'chief of the slaughterers,' which in royal context can denote executioners or the royal guard.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다니엘은 왕의 살수들의 우두머리인 아리옥에게—그가 바빌론의 지혜자들을 죽이려고 나가 있던 그에게—말과 분별로 대답했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 경호대장.’ 아람어 직함은 문자적으로 ‘도살자들의 우두머리’이며, 왕실 맥락에서는 처형 집행관 또는 왕실 경호대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 뒤
  - 이에
  - 그때에
  lexicon: HALOT
  rationale: 아람어 담화 표지를 한국어 서술 흐름에 자연스럽게 옮기되, 단순한 시간 부사 이상으로 다음 사건으로 넘어감을 보여 주는 표현을 택했습니다.
- source_word: הֲתִיב
  english_pob_choice: answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 응답했습니다
  - 답했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 말하기가 아니라 앞선 상황에 대한 응답을 뜻하므로, 현대 한국어에서 가장 자연스러운 ‘대답하다’를 사용했습니다.
- source_word: עֵטָא וּטְעֵם
  english_pob_choice: with counsel and discretion
  chosen_korean: 말과 분별로
  alternatives_korean:
  - 충고와 분별로
  - 권고와 판단으로
  - 지혜와 분별로
  lexicon: HALOT
  rationale: 두 명사가 다니엘의 발화 방식과 판단의 절제를 함께 드러내므로, 한국어에서는 의미쌍을 자연스럽게 풀어 ‘말과 분별’로 옮겼습니다. ‘분별’은 וּטְעֵם의 판단/식별의 뉘앙스를 살립니다.
- source_word: רַב טַבָּחַיָּא דִּי מַלְכָּא
  english_pob_choice: the chief of the king’s executioners
  chosen_korean: 왕의 살수들의 우두머리
  alternatives_korean:
  - 왕의 집행관들의 우두머리
  - 왕의 처형자들의 우두머리
  - 왕의 경호대장
  lexicon: HALOT
  rationale: 직역하면 ‘도살자들’이지만, 왕실 맥락과 바로 이어지는 살해 명령을 고려하면 실행자/처형자 계열이 맞습니다. POB의 주석이 제시하듯 경호대장 가능성도 있으나, 이 절의 문맥에서는 ‘살수들’이 위협적 기능을 가장 직접적으로 드러냅니다.
- source_word: דִּי נְפַק לְקַטָּלָה לְחַכִּימֵי בָּבֶל
  english_pob_choice: the one who had gone out to kill the wise men of Babylon
  chosen_korean: 그가 바빌론의 지혜자들을 죽이려고 나가 있던 그에게
  alternatives_korean:
  - 바빌론의 지혜자들을 죽이러 나간 그에게
  - 바빌론의 지혜자들을 죽이기 위해 나간 그에게
  lexicon: HALOT
  rationale: 관계절을 한국어로 자연스럽게 풀어, 아리옥이 이미 실행 임무를 띤 상태였음을 드러냈습니다. ‘지혜자들’은 Daniel의 관료 집단을 가리키는 표준적 표현을 유지합니다.
theological_decisions:
- issue: 아리옥의 직함 표현
  chosen_reading: ‘살수들의 우두머리’로 옮겨, 본문의 급박한 처형 명령과 직결된 기능을 드러냈습니다.
  alternative_readings:
  - ‘왕의 경호대장’으로 완화
  - ‘왕의 집행관들의 우두머리’로 중립화
  rationale: 아람어 표현은 문자적으로 ‘도살자/살해자’ 계열이지만 왕실 행정에서는 경호와 처형이 겹칠 수 있습니다. 이 절은 실제로 지혜자들을 죽이려 나간 상황이므로 기능적 의미를 강하게 드러내는 쪽을 택했습니다.
  doctrine_reference: 본문 문맥 및 POB lexical note
- issue: עֵטָא וּטְעֵם의 한국어 어감
  chosen_reading: ‘말과 분별’로 번역해 다니엘의 신중하고 절제된 응답을 드러냈습니다.
  alternative_readings:
  - ‘충고와 분별’
  - ‘지혜로운 조언과 판단’
  rationale: 이 표현은 단순한 화법이 아니라 신중한 재량과 판단을 묘사합니다. 한국어에서는 명사 두 개를 그대로 붙이기보다, 독자가 즉시 이해할 수 있도록 발화의 태도와 판단 능력을 함께 보여 주는 표현으로 옮겼습니다.
  doctrine_reference: 본문의 수사적 의미
