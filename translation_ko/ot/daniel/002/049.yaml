  lexicon: HALOT
  rationale: 요청 동사와 함께 한국어에서는 '왕에게 요청하다'가 가장 자연스럽고, 원문의 관계를 무리 없이 반영합니다.
- source_word: עֲבִידְתָּא
  english_pob_choice: the administration
