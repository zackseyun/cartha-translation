  - 청하였고
  - 간청하였고
  lexicon: HALOT
  rationale: 궁정 맥락에서 단순한 '묻다'보다 공식적인 청탁·청원을 나타내는 '요청하다'가 가장 자연스럽고 원문의 격식을 살립니다.
- source_word: מַלְכָּא
