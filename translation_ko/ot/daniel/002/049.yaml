base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/049.yaml
  text: And Daniel requested of the king[a], and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. But Daniel remained at the king’s court.
  footnotes:
  - marker: a
    text: Literally, “at the king’s gate.” The phrase likely refers to Daniel’s place in the royal court or administrative presence before the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 다니엘은 왕에게 요청하였고, 왕은 바빌론 지방의 행정을 사드락과 메삭과 아벳느고에게 맡겼습니다. 그러나 다니엘은 왕의 궁정에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “왕의 문에”입니다. 이 표현은 다니엘의 왕실 궁정 내 위치나 왕 앞의 행정적 접근권을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָא
  english_pob_choice: requested
  chosen_korean: 요청하였고
  alternatives_korean:
