theological_decisions:
- issue: 왕의 문/궁정 표현의 의미
  chosen_reading: '''왕의 궁정''은 단순한 장소가 아니라 왕 앞의 접견·행정권이 있는 공적 지위를 뜻하는 관용 표현으로 이해했습니다.'
  alternative_readings:
  - '''왕의 문''을 문자적으로 살리는 번역'
  - '''왕의 문간''으로 더 직역하는 번역'
  rationale: 원문은 장소를 넘어서 궁정 내 지위와 접근권을 암시하므로, 의미를 살린 번역이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 역사-문법적 해석 원칙
