  rationale: 직역하면 '왕의 문에'이지만, 고대 궁정의 관용적 의미가 왕 앞의 행정·접견 자리이므로 현대 독자를 위해 '왕의 궁정'으로 옮기되, 잔류의 상태는 '머물렀습니다'로 자연스럽게 풀었습니다.
