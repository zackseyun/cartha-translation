  lexicon: WLC Aramaic / HALOT
  rationale: 서술 공식의 반복된 두 동사를 한국어의 자연스러운 합쇼체로 옮기되, 서사적 응답의 강조를 살리기 위해 ‘대답하여 말했습니다’로 유지했습니다.
- source_word: מִן יַצִּיב
  english_pob_choice: for certain
