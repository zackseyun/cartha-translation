  lexicon: WLC Aramaic / HALOT
  rationale: ‘from certainty’의 관용적 의미를 현대 한국어의 짧고 강한 부사로 옮겨 왕의 단정적 어조를 살렸습니다.
- source_word: אַנְתּוּן זָבְנִין
  english_pob_choice: you are trying to gain
  chosen_korean: 시간을 벌려고 하는
  alternatives_korean:
  - 시간을 얻으려고 하는
  - 시간을 사려고 하는
  lexicon: WLC Aramaic / HALOT
  rationale: ‘사다’의 관용적 비유를 한국어에서 자연스럽게 풀어, 실제 의미인 ‘time-buying’을 전달했습니다.
- source_word: אַזְדָּא מִנִּי מִלְּתָא
  english_pob_choice: the matter has gone from me
  chosen_korean: 그 문제가 내게서 떠난
  alternatives_korean:
  - 그 말이 내게서 떠난
  - 그 일이 내게서 사라진
  - 그 명령이 내게서 떠난
  lexicon: WLC Aramaic / HALOT
  rationale: POB가 보존한 의미적 모호성을 따라 ‘matter’를 ‘문제’로, ‘has gone from me’를 ‘내게서 떠난’으로 옮겨, ‘말/명령/꿈’으로 단정하지 않았습니다.
theological_decisions:
- issue: מִלְּתָא / אַזְדָּא מִנִּי의 의미적 모호성 유지
  chosen_reading: 그 문제가 내게서 떠난
  alternative_readings:
  - 그 말이 내게서 떠난
  - 그 명령이 내게서 떠난
  - 그 꿈이 내게서 떠난
  - 그 문제가 내게서 사라진
  rationale: 본문은 왕이 무엇을 염두에 두는지(말, 명령, 꿈, 문제)와 그 상태(떠남/사라짐)를 좁게 확정하지 않습니다. 한국어 본문도 이 긴장을 유지해, 해석을 과도하게 결정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
