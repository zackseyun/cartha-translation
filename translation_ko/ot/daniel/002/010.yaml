  text: עֲנ֨וֹ כשדי/א קֳדָם מַלְכָּ/א֙ וְ/אָ֣מְרִ֔ין לָֽא אִיתַ֤י אֲנָשׁ֙ עַל יַבֶּשְׁתָּ֔/א דִּ֚י מִלַּ֣ת מַלְכָּ֔/א יוּכַ֖ל לְ/הַחֲוָיָ֑ה כָּ/ל קֳבֵ֗ל דִּ֚י כָּל מֶ֨לֶךְ֙ רַ֣ב וְ/שַׁלִּ֔יט מִלָּ֤ה כִ/דְנָה֙ לָ֣א שְׁאֵ֔ל לְ/כָל חַרְטֹּ֖ם וְ/אָשַׁ֥ף וְ/כַשְׂדָּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/010.yaml
  text: The Chaldeans answered before the king and said, “There is not a man on earth who can make known the king’s matter, because no great and powerful king has asked for a thing like this from any diviner-priest, enchanter, or Chaldean.”
translation:
  language: ko
  text: 그 갈대아 사람들이 왕 앞에서 대답하며 말했습니다. "이 땅 위에는 왕의 일을 밝혀 알릴 만한 사람이 없습니다. 어떤 크고 권세 있는 왕도 이런 일을 어떤 점술관, 주술사, 갈대아 사람에게도 묻지 않았기 때문입니다."[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직능명은 히브리어 원문에 있는 세 부류를 구분해 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: כַּשְׂדָּי
  english_pob_choice: The Chaldeans
  chosen_korean: 그 갈대아 사람들
  alternatives_korean:
  - 갈대아인들
  - 갈대아 사람들
  lexicon: 갈대아 사람
  rationale: 집단 명칭으로서 민족/직역형을 살리되, 문맥상 화자 집단을 자연스럽게 드러내기 위해 '사람들'을 붙였습니다.
- source_word: מִלַּת מַלְכָּא
  english_pob_choice: the king’s matter
  chosen_korean: 왕의 일을 밝혀 알릴 만한
  alternatives_korean:
  - 왕의 일
  - 왕의 문제
  - 왕의 말을
  lexicon: 일
  rationale: 이 어구는 단순한 '말'보다 왕이 말한 꿈/요구의 내용을 가리키므로, POB의 'matter' 취지를 살려 '일'에 '밝혀 알리다'를 붙였습니다.
- source_word: חַרְטֹּם וְאָשַׁף וְכַשְׂדָּי
  english_pob_choice: diviner-priest, enchanter, or Chaldean
  chosen_korean: 점술관, 주술사, 갈대아 사람
  alternatives_korean:
  - 점술가, 주술사, 갈대아 사람
  - 박수, 마술사, 갈대아 사람
  lexicon: 직능 명칭
  rationale: 세 직능명을 한국어 독자가 구분할 수 있게 옮기되, 전통 교회어보다 원문 직능의 기능을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 왕의 요구가 '말'이 아니라 '사건/내용' 전체를 가리키는지
  chosen_reading: 왕의 일을 밝혀 알릴 만한 사람
  alternative_readings:
  - 왕의 말을 알려 줄 사람
  - 왕의 비밀을 말할 사람
  rationale: 문맥상 문제는 단순 발화가 아니라 꿈의 의미와 그와 관련된 왕의 요구 전체이므로, source의 מִלָּה/POB 'matter'를 더 넓은 의미로 반영했습니다.
  doctrine_reference: 문맥 중심 번역 원칙
