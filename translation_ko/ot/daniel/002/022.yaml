  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֛וּא גָּלֵ֥א עַמִּיקָתָ֖/א וּ/מְסַתְּרָתָ֑/א יָדַע֙ מָ֣ה בַ/חֲשׁוֹכָ֔/א ו/נהיר/א עִמֵּ֥/הּ שְׁרֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/022.yaml
  text: He reveals deep and hidden things[a]; he knows what is in the darkness[b], and light dwells with him.
  footnotes:
  - marker: a
    text: Or 'secret things' for 'hidden things.'
    reason: lexical_alternative
  - marker: b
    text: Or 'light is with him.' The Aramaic verb can be rendered more statively, but 'dwells' better preserves the imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 깊고 숨겨진 것들을 드러내십니다[a]. 그는 어둠 속에 있는 것이 무엇인지 아시며[b], 빛이 그와 함께 거합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은밀한 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘빛이 그와 함께 있습니다.’ 아람어 동사는 더 상태적으로도 옮길 수 있지만, ‘거합니다’가 이미지를 더 잘 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלֵא / עַמִּיקָתָא / וּמְסַתְּרָתָא
  english_pob_choice: reveals deep and hidden things
  chosen_korean: 깊고 숨겨진 것들을 드러내십니다
  alternatives_korean:
  - 깊은 것들과 숨은 것들을 밝히십니다
  - 깊고 은밀한 것들을 나타내십니다
  lexicon: WLC Aramaic; HALOT
  rationale: ‘드러내다’는 가려진 것을 알게 하는 동사를 자연스럽게 살리며, ‘깊고 숨겨진 것들’은 병렬되는 두 형용사적 표현을 그대로 보존합니다.
- source_word: יָדַע מָה בַחֲשׁוֹכָא
  english_pob_choice: he knows what is in the darkness
  chosen_korean: 어둠 속에 있는 것이 무엇인지 아시며
  alternatives_korean:
  - 어둠 속에 무엇이 있는지 아시며
  - 어둠 가운데 있는 것을 아시며
  lexicon: WLC Aramaic; HALOT
  rationale: ‘무엇인지’는 ארמית의 ‘무엇’(מָה) 구조를 살리면서 현대 한국어의 자연스러운 간접의문문으로 옮깁니다.
- source_word: וְנְהִירָא עִמֵּהּ שְׁרֵא
  english_pob_choice: and light dwells with him
  chosen_korean: 빛이 그와 함께 거합니다
  alternatives_korean:
  - 빛이 그와 함께 있습니다
  - 빛이 그와 함께 머뭅니다
  lexicon: WLC Aramaic; HALOT
  rationale: ‘거하다’는 השׁרא의 지속적 거주/머묾을 살리며, 단순 존재보다 시적 이미지를 더 잘 보존합니다.
- source_word: הוּא
  english_pob_choice: He
  chosen_korean: 그는
  alternatives_korean:
  - 그분은
  - 그가
  lexicon: WLC Aramaic; grammatical emphasis
  rationale: 문두의 인칭대명사는 강조를 나타내므로 ‘그는’으로 시작해 주어를 전면에 두었습니다.
theological_decisions:
- issue: 빛의 의인화와 하나님의 관계
  chosen_reading: 빛이 그와 함께 거합니다
  alternative_readings:
  - 빛이 그와 함께 있습니다
  - 빛이 그와 함께 머뭅니다
  rationale: 동사 שְׁרֵא의 거주/머묾 이미지를 유지해, 빛이 단순히 ‘있다’는 진술보다 더 강한 시적 관계성을 보존합니다.
  doctrine_reference: 시적 표현은 완화하지 않고 원문의 형상을 유지함
