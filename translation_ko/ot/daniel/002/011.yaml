id: DAN.2.11
reference: Daniel 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִלְּתָ֨/א דִֽי מַלְכָּ֤/ה שָׁאֵל֙ יַקִּירָ֔ה וְ/אָחֳרָן֙ לָ֣א אִיתַ֔י דִּ֥י יְחַוִּנַּ֖/הּ קֳדָ֣ם מַלְכָּ֑/א לָהֵ֣ן אֱלָהִ֔ין דִּ֚י מְדָ֣רְ/ה֔וֹן עִם בִּשְׂרָ֖/א לָ֥א אִיתֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/011.yaml
  text: And the thing that the king asks is difficult[a], and there is no other who can declare it before the king except the gods[b], whose dwelling is not with flesh.
  footnotes:
  - marker: a
    text: Or 'the matter that the king asks is hard.'
    reason: lexical_alternative
  - marker: b
    text: Or 'except the gods, whose dwelling is not with humans' or 'with mortal flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 묻는 그 일은 어렵습니다[a]. 왕 앞에서 그것을 밝힐 수 있는 이는 육체와 함께 거하지 않는 신들[b] 외에는 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕이 묻는 그 사안은 어렵습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람과 함께 거하지 않는 신들’ 또는 ‘유한한 육체와 함께 거하지 않는 신들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּתָא / the thing
  english_pob_choice: the thing
  chosen_korean: 그 일
  alternatives_korean:
  - 그 문제
  - 그 일에 해당하는 것
  - 그 내용
  lexicon: HALOT
  rationale: 아람어의 포괄적 의미를 한국어에서 자연스럽게 살려, 왕이 요구하는 ‘사안’이라는 뜻을 간결하게 전했습니다.
- source_word: יַקִּירָה / difficult
  english_pob_choice: difficult
  chosen_korean: 어렵습니다
  alternatives_korean:
  - 힘듭니다
  - 난해합니다
  - 귀합니다
  lexicon: HALOT
  rationale: 문맥상 점술가들이 말하는 ‘해내기 어려운’ 요청이므로, 현대 한국어에서 가장 직접적인 ‘어렵습니다’를 택했습니다.
- source_word: יְחַוִּנַּהּ / can declare it
  english_pob_choice: can declare it
  chosen_korean: 밝힐 수 있는
  alternatives_korean:
  - 알릴 수 있는
  - 선언할 수 있는
  - 드러낼 수 있는
  lexicon: HALOT
  rationale: 궁정 대화의 맥락에서 비밀을 ‘밝히다’가 가장 자연스럽고, 단순한 ‘알리다’보다 원문의 공개·설명 뉘앙스를 잘 살립니다.
- source_word: אֱלָהִין / the gods
  english_pob_choice: the gods
  chosen_korean: 신들
  alternatives_korean:
  - 신들
  - 신
  - 신적 존재들
  lexicon: HALOT
  rationale: 복수형을 유지해 바벨론 궁정의 다신적 발화를 반영했습니다. 한국어에서는 관용적으로 ‘신들’이 가장 직접적입니다.
theological_decisions:
- issue: בִּשְׂרָא / flesh의 처리
  chosen_reading: 육체와 함께 거하지 않는
  alternative_readings:
  - 살과 함께 거하지 않는
  - 사람과 함께 거하지 않는
  - 유한한 인간과 함께 거하지 않는
  rationale: 원문은 ‘육체’라는 구체적 이미지를 사용하므로, 이를 완화하지 않고 그대로 살렸습니다. 다만 한국어 문장에서는 자연성을 위해 ‘함께 거하다’로 정리했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 아람어 복수형 אֱלָהִין의 신학적 의미
  chosen_reading: 신들
  alternative_readings:
  - 하나님
  - 신적 존재들
  rationale: 바벨론 점술가들의 입술에 있는 복수형을 한국어에서도 그대로 유지해, 이 말이 이스라엘의 단일신 신앙 진술이 아님을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
