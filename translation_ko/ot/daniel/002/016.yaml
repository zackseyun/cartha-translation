  text: וְ/דָ֣נִיֵּ֔אל עַ֖ל וּ/בְעָ֣ה מִן מַלְכָּ֑/א דִּ֚י זְמָ֣ן יִנְתֵּן לֵ֔/הּ וּ/פִשְׁרָ֖/א לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/016.yaml
  text: So Daniel went in and asked the king to give him time, so that he might make the interpretation known to the king.
translation:
  language: ko
  text: 그리하여 다니엘은 왕에게 들어가서 해석을 왕에게 알려 줄 수 있도록 시간을 달라고 청했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָנִיֵּאל עַ֖ל
  english_pob_choice: So Daniel went in
  chosen_korean: 다니엘은 왕에게 들어가서
  alternatives_korean:
  - 그리하여 다니엘은 들어가서
  - 다니엘이 들어가서
  lexicon: עַל / 들어가다
  rationale: 여기서 עַל은 문맥상 왕 앞에 ‘들어가다’의 동작을 나타내므로, 단순 이동보다 왕에게 나아감의 뜻이 드러나도록 옮겼습니다.
- source_word: וּבְעָה מִן מַלְכָּא
  english_pob_choice: asked the king to give him time
  chosen_korean: 왕에게 들어가서 해석을 왕에게 알려 줄 수 있도록 시간을 달라고 청했습니다
  alternatives_korean:
  - 왕에게 시간을 달라고 구했습니다
  - 왕께 시간을 요청했습니다
  lexicon: בָּעָה / 청하다, 구하다
  rationale: בָּעָה는 단순 요청보다 간청·청원의 뉘앙스가 있어, 현대 한국어에서 자연스럽고 격식을 갖춘 ‘청했습니다’로 옮겼습니다.
- source_word: דִּי זְמָן יִנְתֵּן לֵהּ
  english_pob_choice: give him time
  chosen_korean: 시간을 달라고
  alternatives_korean:
  - 기한을 달라고
  - 여유를 달라고
  lexicon: זְמָן / 시간, 기한
  rationale: זְמָן은 문맥상 문제를 풀 시간을 가리키므로, ‘기한’보다 직관적인 ‘시간’이 적절합니다.
- source_word: וּפִשְׁרָא לְהַחֲוָיָה
  english_pob_choice: so that he might make the interpretation known
  chosen_korean: 해석을 … 알려 줄 수 있도록
  alternatives_korean:
  - 그 해석을 … 밝힐 수 있도록
  - 그 뜻을 … 알릴 수 있도록
  lexicon: פְּשָׁר / 해석
  rationale: פשר는 꿈의 ‘해석’이므로, 단순히 의미를 전달하는 ‘알려 주다’에 해석 대상이 드러나도록 배치했습니다.
theological_decisions:
- issue: 다니엘의 요청 문장 구조
  chosen_reading: 다니엘이 왕에게 들어가 시간을 청한 목적이 ‘해석을 왕에게 알려 주기’ 위한 것임을 한 문장 안에서 분명히 드러냈습니다.
  alternative_readings:
  - 시간을 달라고 한 뒤 해석을 알려 주겠다는 순차적 표현
  - 왕에게 시간을 구해 해석을 밝히려는 의도만 간단히 표현
  rationale: 히브리어는 목적절 관계를 분명히 담고 있으므로, 한국어도 ‘~할 수 있도록’으로 목적을 명시해 원문의 논리를 보존했습니다.
  doctrine_reference: 서사 문맥 보존
- issue: 왕에 대한 존대 표현
  chosen_reading: 직접 화법이 아니므로 서술체 합쇼체를 사용하되, 왕을 향한 동작은 ‘왕에게’로 자연스럽게 표현했습니다.
  alternative_readings:
  - 왕께
  - 임금에게
  rationale: 본문은 왕에게 행하는 요청을 서술하므로, 과도한 궁정어를 피하면서도 품위를 유지하는 표현이 적절합니다.
  doctrine_reference: 문체 일관성
