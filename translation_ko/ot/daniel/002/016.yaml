    rationale: עַל은 이 문맥에서 왕 앞에 들어가거나 나아가는 행위를 가리킵니다. 한국어에서는 ‘왕에게 나아가’가 그 행위와 왕 앞에 나아감이라는 맥락을 더 명료하게 전달합니다.
  - severity: low
    issue: 왕에게 해석을 ‘알려 주다’보다 ‘알려 드리다’가 서술상 더 적절합니다.
    rationale: 다니엘이 왕에게 행하려는 전달 행위이므로, 현대 표준 한국어의 격식 있는 문체에서는 객체 높임을 반영한 ‘알려 드리다’가 자연스럽습니다.
