source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א חָזֵ֤ה הֲוַ֨יְתָ֙ וַ/אֲל֨וּ צְלֵ֥ם חַד֙ שַׂגִּ֔יא צַלְמָ֨/א דִּכֵּ֥ן רַ֛ב וְ/זִיוֵ֥/הּ יַתִּ֖יר קָאֵ֣ם לְ/קָבְלָ֑/ךְ וְ/רֵוֵ֖/הּ דְּחִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/031.yaml
  text: You[a], O king, were watching, and behold, there was one great statue[b]. That statue was immense, and its splendor was extraordinary; it was standing before you[c], and its appearance was terrifying.
  footnotes:
  - marker: a
    text: Aramaic צְלֵם can be rendered 'image' or 'statue'; 'statue' is chosen here because the context describes a large visible figure standing before the king.
    reason: lexical_alternative
  - marker: b
    text: Or 'its brightness was surpassing.' The phrase emphasizes the figure's exceptional radiance or splendor.
    reason: lexical_alternative
  - marker: c
    text: Or 'its aspect was dreadful.' The Aramaic describes an appearance that evokes fear.
    reason: lexical_alternative
translation:
  language: ko
  text: 임금님께서는 보고 계셨는데, 보십시오, 하나의 큰 조각상[a]이 있었습니다. 그 조각상은 매우 컸고, 그 광채는 매우 뛰어났습니다[b]. 그것은 임금님 앞에 서 있었으며, 그 모습은 두려움을 자아냈습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 צְלֵם은 ‘형상’ 또는 ‘조각상’으로도 옮길 수 있습니다. 여기서는 임금님 앞에 서 있는 크고 보이는 형상이라는 문맥을 따라 ‘조각상’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 빛남은 비할 데 없이 뛰어났습니다.’ 아람어는 그 형상의 탁월한 밝음 또는 광채를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 외양은 무서웠습니다.’ 아람어는 그 형상의 모습이 두려움을 불러일으켰음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה
  english_pob_choice: You
  chosen_korean: 당신은
  alternatives_korean:
  - 임금님은
  - 당신 자신은
  lexicon: HALOT
  rationale: 2인칭 단수의 직접 호칭을 자연스러운 한국어로 살리되, 이어지는 ‘임금님’ 호격과 함께 대면 상황을 분명히 했습니다.
- source_word: מַלְכָּא
  english_pob_choice: O king
  chosen_korean: 임금님
  alternatives_korean:
  - 왕이시여
  - 왕님
  lexicon: HALOT
  rationale: 직접 호칭의 예를 살리면서도 현대 한국어 합쇼체에서 가장 자연스럽고 격식 있는 호칭으로 옮겼습니다.
- source_word: צְלֵם חַד שַׂגִּיא
  english_pob_choice: one great statue
  chosen_korean: 하나의 큰 조각상
  alternatives_korean:
  - 한 큰 형상
  - 하나의 거대한 우상
  lexicon: HALOT
  rationale: POB의 ‘statue’를 따라 ‘조각상’으로 옮기고, חַד의 수적 감각은 ‘하나의’로, שַׂגִּיא는 ‘큰’으로 간결하게 반영했습니다.
- source_word: וְזִיוֵהּ יַתִּיר
  english_pob_choice: its splendor was extraordinary
  chosen_korean: 그 광채는 매우 뛰어났습니다
  alternatives_korean:
  - 그 밝기는 뛰어났습니다
  - 그 빛남은 압도적이었습니다
  lexicon: HALOT
  rationale: זִיו의 ‘광채/빛남’ 의미를 살리면서 יַתִּיר의 강화 기능을 ‘매우 뛰어났습니다’로 자연스럽게 구현했습니다.
- source_word: וְרֵוֵהּ דְּחִיל
  english_pob_choice: its appearance was terrifying
  chosen_korean: 그 모습은 두려웠습니다
  alternatives_korean:
  - 그 외양은 무서웠습니다
  - 그 모습은 공포스러웠습니다
  lexicon: HALOT
  rationale: דְּחִיל의 ‘두려움을 주는’ 의미를 현대 한국어의 직접적 표현으로 옮겨, 꿈의 압도적 공포감을 유지했습니다.
theological_decisions:
- issue: 꿈 장면의 직설적 시각 묘사
  chosen_reading: 예언적 해석을 덧붙이지 않고, 왕이 본 환상 자체를 서술형으로 그대로 옮겼습니다.
  alternative_readings:
  - 상징적 의미를 암시하는 표현을 보태는 방식
  - 조각상을 ‘우상’으로 해석적으로 좁히는 방식
  rationale: 본문은 아직 해석이 아니라 관찰 보고 단계이므로, 서술의 즉시성과 긴장을 보존하는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 단 2:31 문맥상 서술 단락 보존
- issue: 연속된 크기·광채 묘사의 중복
  chosen_reading: ‘큰’과 ‘매우 뛰어났습니다’를 구분해 반복의 강조를 유지했습니다.
  alternative_readings:
  - 동의 반복을 하나로 압축하는 방식
  - ‘매우 크고 찬란했습니다’처럼 단일 문장으로 합치는 방식
  rationale: 아람어의 연속 수식은 단순 중복이 아니라 위압감의 누적 효과를 내므로, 이를 한국어에서도 분리해 보여 주었습니다.
  doctrine_reference: 문학적 형상 보존
