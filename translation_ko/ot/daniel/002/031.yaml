  rationale: 원문의 직접적 환상 서술, 조각상의 크기에 대한 거듭된 강조, 탁월한 광채를 보존했습니다. 한국어에서 왕에게 쓰는 자연스러운 현대 합쇼체로 주어를 조정하고, 공포의 의미가 형상이 아닌 관찰자에게서 비롯됨을 분명히 했습니다. 또한 모든 각주 표지를 해당 표현에 정확히 연결했습니다.
