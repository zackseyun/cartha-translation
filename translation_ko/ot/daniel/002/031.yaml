    issue: ‘그 모습은 두려웠습니다’의 의미가 모호합니다.
    rationale: 아람어 דְּחִיל은 형상이 두려움을 유발한다는 뜻입니다. 한국어의 ‘모습은 두려웠습니다’는 형상 자체가 두려움을 느꼈다는 뜻으로도 해석될 여지가 있으므로 ‘두려움을 자아냈습니다’로 명시하는 것이 안전합니다.
  - severity: low
