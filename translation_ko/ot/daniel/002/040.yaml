  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַלְכוּ֙ רביעיה תֶּהֱוֵ֥א תַקִּיפָ֖ה כְּ/פַרְזְלָ֑/א כָּ/ל קֳבֵ֗ל דִּ֤י פַרְזְלָ/א֙ מְהַדֵּ֤ק וְ/חָשֵׁל֙ כֹּ֔לָּ/א וּֽ/כְ/פַרְזְלָ֛/א דִּֽי מְרָעַ֥ע כָּל אִלֵּ֖ין תַּדִּ֥ק וְ/תֵרֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/040.yaml
  text: And the fourth kingdom will be strong like iron[a], because iron crushes and shatters everything; and like iron that breaks all these things[b], it will crush and shatter.
  footnotes:
  - marker: a
    text: Or 'And a fourth kingdom.' The Aramaic lacks the English definite article, though in context the kingdom is clearly the fourth in sequence.
    reason: lexical_alternative
  - marker: b
    text: '''All these things'' likely refers to the earlier kingdoms represented in the statue vision.'
    reason: cross_reference
translation:
  language: ko
  text: 넷째 왕국은 철처럼 강할 것입니다[a]. 철이 모든 것을 부수고 산산이 부수듯이, 또 철이 이 모든 것을 부수는 것처럼 그 왕국도 부수고 산산이 부술 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '넷째 왕국'. 아람어에는 영어의 정관사가 없지만, 문맥상 이 왕국은 순서상 넷째입니다.
    reason: lexical_alternative
  - marker: b
    text: '''이 모든 것''은 아마도 앞선 왕국들, 곧 신상 환상에 나타난 것들을 가리킵니다.'
    reason: cross_reference
lexical_decisions:
- source_word: וּמַלְכוּ רביעיה
  english_pob_choice: And the fourth kingdom
  chosen_korean: 넷째 왕국은
  alternatives_korean:
  - 그리고 넷째 왕국은
  - 넷째 나라(왕국)은
  lexicon: HALOT
  rationale: רביעיה는 순서상 '넷째'를 뜻하므로 이를 분명히 드러냈고, 한국어에서는 문맥상 시작 연결사보다 주어 제시가 자연스러워 '넷째 왕국은'으로 옮겼습니다.
- source_word: תַּקִּיפָה כְּפַרְזְלָא
  english_pob_choice: will be strong like iron
  chosen_korean: 철처럼 강할 것입니다
  alternatives_korean:
  - 철같이 강할 것입니다
  - 철처럼 튼튼할 것입니다
  lexicon: HALOT
  rationale: תַקִּיפָה는 단순한 물리적 강함을 가리키므로 '강하다'가 가장 직접적이며, 비교구문 כְּפַרְזְלָא는 '철처럼'으로 자연스럽게 살렸습니다.
- source_word: מְהַדֵּק וְחָשֵׁל כֹּלָּא
  english_pob_choice: iron crushes and shatters everything
  chosen_korean: 철이 모든 것을 부수고 산산이 부수듯이
  alternatives_korean:
  - 철이 모든 것을 부수고 깨뜨리듯이
  - 철이 모든 것을 짓이기고 산산이 부수듯이
  lexicon: HALOT
  rationale: 두 동사의 중첩된 파괴성을 살리되 한국어에서 과도하게 기계적으로 반복되지 않도록 '부수고 산산이 부수다'로 옮겨 강한 파괴 이미지를 보존했습니다.
- source_word: תַּדִּק וְתֵרֹעַ
  english_pob_choice: it will crush and break
  chosen_korean: 부수고 산산이 부술 것입니다
  alternatives_korean:
  - 부수고 깨뜨릴 것입니다
  - 짓이기고 부술 것입니다
  lexicon: HALOT
  rationale: 마지막 이중 동사도 앞부분과 대응하는 강한 파괴를 나타내므로, POB의 보수적 선택인 'crush and break'의 힘을 유지하면서 한국어에서는 반복을 조금 정리해 표현했습니다.
theological_decisions:
- issue: 네 번째 왕국의 지시 대상
  chosen_reading: 문맥상 앞선 환상에서 제시된 이전 왕국들과 구별되는 '넷째 왕국'으로 이해했습니다.
  alternative_readings:
  - 그냥 '어떤 네 번째 왕국'으로 읽기
  - 지시 대상을 특정하지 않고 일반화하기
  rationale: 본문의 절대적 서술과 POB 주석이 모두 순차적 문맥을 전제하므로, 독자가 예언-해석의 흐름을 놓치지 않도록 순서성을 명시했습니다.
  doctrine_reference: Daniel 2 문맥 전체
