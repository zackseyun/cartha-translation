  text: דְּנָ֣ה חֶלְמָ֔/א וּ/פִשְׁרֵ֖/הּ נֵאמַ֥ר קֳדָם מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/036.yaml
  text: This was the dream[a], and we will tell its interpretation before the king.
  footnotes:
  - marker: a
    text: Or 'This is the dream; now we will tell its interpretation before the king.' The Aramaic can be rendered with slightly different English punctuation and aspect without changing the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 그 꿈입니다[a]. 그리고 우리는 그것의 해석을 왕 앞에서 말하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 그 꿈입니다. 이제 우리는 그 해석을 왕 앞에서 말하겠습니다.’로도 옮길 수 있습니다. 아람어는 약간 다른 구두점과 상(aspect)으로도 같은 뜻을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה
  english_pob_choice: This
  chosen_korean: 이것이
  alternatives_korean:
  - 이것은
  - 이것
  lexicon: HALOT
  rationale: 지시어로 앞서 언급한 꿈을 가리키므로, 문맥상 자연스러운 주어형 ‘이것이’로 옮겼습니다.
- source_word: חֶלְמָא
  english_pob_choice: the dream
  chosen_korean: 그 꿈
  alternatives_korean:
  - 꿈
  - 이 꿈
  lexicon: HALOT
  rationale: 이미 문맥에서 특정된 꿈이므로 관형사 ‘그’를 붙여 특정성을 드러냈습니다.
- source_word: וּפִשְׁרֵהּ
  english_pob_choice: and its interpretation
  chosen_korean: 그것의 해석
  alternatives_korean:
  - 그 꿈의 해석
  - 그 뜻풀이
  lexicon: HALOT
  rationale: פִשְׁרָא의 기술적 의미를 살려 ‘해석’으로 옮기고, 소유 대명사는 앞선 명사를 자연스럽게 받도록 했습니다.
- source_word: נֵאמַר
  english_pob_choice: we will tell
  chosen_korean: 말하겠습니다
  alternatives_korean:
  - 전하겠습니다
  - 설명하겠습니다
  lexicon: HALOT
  rationale: 미래형의 발표/선언 뉘앙스를 살리되 한국어에서는 ‘말하겠습니다’가 가장 간결하고 자연스럽습니다.
- source_word: קֳדָם מַלְכָּא
  english_pob_choice: before the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕 앞에
  - 왕의 앞에서
  lexicon: HALOT
  rationale: 궁정 맥락의 ‘before’는 단순한 장소보다 왕 앞에서의 공개 진술을 뜻하므로 ‘왕 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 2인칭/공적 발화의 공손도와 진술 시점
  chosen_reading: 서술문은 합쇼체를 유지하고, 직접 발화가 아닌 공적 보고체로 ‘말하겠습니다’라고 옮겼습니다.
  alternative_readings:
  - ‘말할 것입니다’
  - ‘전하겠습니다’
  rationale: 원문은 단순 미래 진술이므로 과도한 장엄체를 피하고, 다니엘의 왕 앞 진술이라는 공적 상황을 반영했습니다.
  doctrine_reference: 문맥 충실성과 담화 기능 보존
