id: DAN.2.32
reference: Daniel 2:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וּא צַלְמָ֗/א רֵאשֵׁ/הּ֙ דִּֽי דְהַ֣ב טָ֔ב חֲד֥וֹ/הִי וּ/דְרָע֖וֹ/הִי דִּ֣י כְסַ֑ף מְע֥וֹ/הִי וְ/יַרְכָתֵ֖/הּ דִּ֥י נְחָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/032.yaml
  text: That image—its head was of fine gold[a], its chest and its arms of silver[c][b], its belly and its thighs of bronze.
  footnotes:
  - marker: a
    text: Or 'statue.' The Aramaic צַלְמָא can denote an image or a statue.
    reason: lexical_alternative
  - marker: b
    text: Or 'pure gold.' Literally 'good gold,' an idiom for high-quality gold.
    reason: lexical_alternative
  - marker: c
    text: Or 'copper.' The Aramaic נְחָשׁ often refers to bronze in context, though ancient metal terminology may overlap.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 형상[a]의 머리는 질 좋은 금[b]이고, 가슴과 팔은 은이며, 배와 넓적다리는 청동[c]이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조각상.’ 아람어 צַלְמָא는 형상이나 조각상을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘순금.’ 문자적으로는 ‘좋은 금’이며, 질 좋은 금을 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구리.’ 아람어 נְחָשׁ은 문맥에 따라 청동을 가리키지만, 고대 금속 명칭은 구리와 겹칠 수 있습니다.
    reason: lexical_alternative
