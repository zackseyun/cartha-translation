id: DAN.2.32
reference: Daniel 2:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וּא צַלְמָ֗/א רֵאשֵׁ/הּ֙ דִּֽי דְהַ֣ב טָ֔ב חֲד֥וֹ/הִי וּ/דְרָע֖וֹ/הִי דִּ֣י כְסַ֑ף מְע֥וֹ/הִי וְ/יַרְכָתֵ֖/הּ דִּ֥י נְחָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/032.yaml
  text: That image—its head was of fine gold[a], its chest and its arms of silver[c][b], its belly and its thighs of bronze.
  footnotes:
  - marker: a
    text: Or 'statue.' The Aramaic צַלְמָא can denote an image or a statue.
    reason: lexical_alternative
  - marker: b
    text: Or 'pure gold.' Literally 'good gold,' an idiom for high-quality gold.
    reason: lexical_alternative
  - marker: c
    text: Or 'copper.' The Aramaic נְחָשׁ often refers to bronze in context, though ancient metal terminology may overlap.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 형상은 머리는 좋은 금[a][b]이요, 가슴과 팔은 은[c], 배와 넓적다리는 놋이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상.’ 아람어 צַלְמָא는 형상이나 조각상을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘순금.’ 문자적으로는 ‘좋은 금’이며, 고급 금을 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구리.’ 아람어 נְחָשׁ은 문맥에 따라 놋/청동/구리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַלְמָא
  english_pob_choice: image
  chosen_korean: 형상
  alternatives_korean:
  - 상
  - 이미지
  - 우상
  lexicon: HALOT
  rationale: 이미지의 의미를 따르되, 다니엘의 꿈 장면에서는 현대 독자에게도 자연스러운 ‘형상’이 본문의 시각적 상을 잘 전달합니다.
- source_word: דְהַב טָב
  english_pob_choice: fine gold
  chosen_korean: 좋은 금
  alternatives_korean:
  - 순금
  - 정금
  - 아주 좋은 금
  lexicon: HALOT
  rationale: 직역하면 ‘좋은 금’이지만, 한국어에서는 재료의 질을 나타내는 관용적 표현으로 자연스럽고 원문의 평가적 뉘앙스를 보존합니다.
- source_word: כְסַף
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은붙이
  - 백은
  lexicon: HALOT
  rationale: 금속 명칭은 일반적인 현대 한국어 어휘로 직접 옮기는 것이 가장 분명합니다.
- source_word: נְחָשׁ
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 다니엘서의 금속 목록에서는 전통적으로 ‘놋’이 문맥상 가장 안정적이며, ‘bronze’에 해당하는 합금이라는 점을 잘 드러냅니다.
theological_decisions:
- issue: 꿈의 조형물을 ‘image’로 유지할지, 더 구체적인 ‘statue’로 옮길지
  chosen_reading: 형상
  alternative_readings:
  - 상
  - 조각상
  - 우상
  rationale: 문맥상 네부갓네살의 꿈에 나타난 거대한 조형물을 가리키지만, 원문의 צַלְמָא는 ‘형상’과 ‘조각상/상’의 범위를 모두 가질 수 있어 더 넓은 의미를 유지했습니다.
  doctrine_reference: 다니엘 2장의 상징적 환상 문맥
- issue: ‘good gold’를 값어치의 평가로 살릴지, 재료의 순도를 암시하는 방향으로 풀지
  chosen_reading: 좋은 금
  alternative_readings:
  - 순금
  - 정금
  rationale: טָב는 문자적으로 ‘좋은’이므로, 이를 ‘순금’으로 단정하기보다 품질이 뛰어난 금이라는 원문의 평가를 살리는 쪽이 더 안전합니다.
  doctrine_reference: 원문 수사와 물질 묘사
