id: DAN.2.3
reference: Daniel 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר לָ/הֶ֛ם הַ/מֶּ֖לֶךְ חֲל֣וֹם חָלָ֑מְתִּי וַ/תִּפָּ֣עֶם רוּחִ֔/י לָ/דַ֖עַת אֶֽת הַ/חֲלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/003.yaml
  text: And the king said to them[a], “I have dreamed a dream[c][b], and my spirit is troubled to know the dream.”
  footnotes:
  - marker: a
    text: Or, “I dreamed a dream.” The Hebrew more literally reads, “a dream I dreamed,” a cognate construction that adds emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or, “my spirit was troubled” or “my spirit is agitated.”
    reason: lexical_alternative
  - marker: c
    text: “My spirit” may also be understood more idiomatically as “I” or “my mind,” but the translation preserves the Hebrew term.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕이 그들에게 말했습니다. “내가 꿈을 꾸었습니다[a]. 내 영이 그 꿈을 알기 위하여 괴로워합니다[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 꿈을 꾸었습니다.” 히브리어는 문자적으로 “꿈을 내가 꿈꾸었습니다”에 가까운 동족 목적어 구문으로, 반복을 통해 강조를 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내 영이 괴로워합니다” 혹은 “내 영이 동요합니다.”
    reason: lexical_alternative
  - marker: c
    text: ‘내 영’은 더 관용적으로 ‘나’ 또는 ‘내 마음’으로 이해될 수도 있으나, 번역은 히브리어 표현을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  english_pob_choice: And the king said to them
  chosen_korean: 왕이 그들에게 말했습니다
  alternatives_korean:
  - 그리고 왕이 그들에게 말했습니다
  - 왕이 그들에게 이르렀습니다
  lexicon: HALOT
  rationale: 서술 흐름은 한국어에서도 자연스럽게 ‘그리고’로 살리고, לָהֶם의 대상은 직역해 ‘그들에게’로 유지했습니다.
- source_word: חֲלוֹם חָלָמְתִּי
  english_pob_choice: I have dreamed a dream
  chosen_korean: 내가 꿈을 꾸었습니다
  alternatives_korean:
  - 내가 꿈을 꿈꿨습니다
  - 꿈을 꿈꾸었습니다
  - 내가 꿈을 꾸었습니다
  lexicon: HALOT
  rationale: 히브리어의 어근 반복(‘꿈을 꿈꾸다’)이 강조를 이루지만, 한국어에서는 자연스러운 합쇼체를 우선해 ‘꿈을 꾸었습니다’로 옮기되 반복 구조의 의미는 살렸습니다.
- source_word: וַתִּפָּעֶם רוּחִי
  english_pob_choice: my spirit is troubled
  chosen_korean: 내 영이 ... 괴로워합니다
  alternatives_korean:
  - 내 영이 ... 불안해합니다
  - 내 영이 ... 동요합니다
  - 내 마음이 ... 괴로워합니다
  lexicon: HALOT
  rationale: רוּחִי를 POB처럼 ‘my spirit’에 맞춰 ‘내 영’으로 두고, פָּעַם의 내적 동요를 ‘괴로워합니다’로 풀어 감정의 강도를 유지했습니다.
- source_word: לָדַעַת אֶת הַחֲלוֹם
  english_pob_choice: to know the dream
  chosen_korean: 그 꿈을 알기 위하여
  alternatives_korean:
  - 그 꿈을 알기 위해
  - 그 꿈을 이해하려고
  - 그 꿈을 알기 위하여
  lexicon: HALOT
  rationale: לָדַעַת의 기본 의미를 따라 ‘알기 위하여’로 옮겨, 단순한 해석보다 ‘알게 되다/알다’의 폭넓은 뜻을 유지했습니다.
theological_decisions:
- issue: רוּחַ를 인격적 내면으로 번역할지, ‘마음’으로 평탄화할지
  chosen_reading: ‘내 영’으로 유지했습니다.
  alternative_readings:
  - ‘내 마음’
  - ‘내가’
  rationale: 본문은 האדם의 내적 주체를 רוּחִי로 표현하므로, 이를 ‘마음’이나 대명사로 바꾸면 히브리어의 인류학적 표현이 약해집니다.
  doctrine_reference: 성서 인류학/내면성 표현
