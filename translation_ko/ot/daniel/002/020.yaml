    issue: 각주 표지가 본문 끝에 함께 놓여 있어 각주가 수식하는 구절이 불명확합니다.
    rationale: a는 ‘영원부터 영원까지’의 대안을, b는 ‘그분의 것입니다’라는 소유 표현의 대안을 설명하므로 해당 어구 바로 뒤에 각각 붙여야 합니다.
  - severity: low
    issue: ‘지혜와 권능은 그분께 있습니다’는 원문의 소유 표현을 다소 완곡하게 만듭니다.
    rationale: דִּי לֵהּ הִיא는 ‘그분의 것이다/그분께 속한다’라는 소유를 직접 진술합니다.
