base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/020.yaml
  text: 'Daniel answered and said: “Blessed be the name of God from everlasting to everlasting[b][a], for wisdom and might belong to him.”'
  footnotes:
  - marker: a
    text: Or “from age to age” or “forever and ever.”
    reason: lexical_alternative
  - marker: b
    text: Or “wisdom and power are his.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다니엘이 대답하여 말했습니다. 「하나님의 이름은 영원부터 영원까지 찬송받으소서. 지혜와 권능은 그분께 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “세대에서 세대로”, “세세토록”
    reason: lexical_alternative
  - marker: b
    text: 또는 “지혜와 능력은 그분의 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 아람어 관용구의 이중 서술을 살리되, 한국어에서는 자연스럽게 연결되는 동사구로 옮겨 서술 도입의 형식을 보존했습니다.
- source_word: לֶהֱוֵא ... מְבָרַךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송받으소서
  alternatives_korean:
  - 복되시기를 원합니다
  - 찬양받으소서
  lexicon: HALOT
  rationale: 이 절은 하나님 이름에 대한 축복/송축 공식이므로, 현대 한국어에서도 기도적·축복적 뉘앙스를 유지하는 ‘찬송받으소서’가 가장 직접적입니다.
- source_word: מִן עָלְמָא וְעַד עָלְמָא
  english_pob_choice: from everlasting to everlasting
  chosen_korean: 영원부터 영원까지
  alternatives_korean:
  - 세대에서 세대로
  - 세세토록
  lexicon: HALOT
  rationale: 시간의 무한한 연속을 나타내는 표현으로, 한국어에서는 ‘영원부터 영원까지’가 원문의 범위를 가장 투명하게 드러냅니다.
- source_word: חָכְמְתָא וּגְבוּרְתָא
  english_pob_choice: wisdom and might
  chosen_korean: 지혜와 권능
  alternatives_korean:
  - 지혜와 힘
  - 지혜와 능력
  lexicon: HALOT
  rationale: ‘גְבוּרְתָא’는 단순한 체력보다 주권적 힘을 가리키므로, 이 문맥의 장엄한 병렬에 맞게 ‘권능’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름을 향한 축복 문구의 한국어 화행
  chosen_reading: 명령형 축복문으로서 ‘찬송받으소서’를 사용해 하나님의 이름에 대한 송축을 직접 드러냈습니다.
  alternative_readings:
  - 서술형으로 ‘하나님의 이름은 찬송받습니다’
  - 소원형으로 ‘하나님의 이름이 찬송받기를 바랍니다’
  rationale: 원문은 독백적 선언이 아니라 축복/송축의 화행이므로, 한국어에서도 대상이 되는 이름을 직접 향해 드리는 예배적 표현을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
