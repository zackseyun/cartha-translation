  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּרַ֡ם אִיתַ֞י אֱלָ֤הּ בִּ/שְׁמַיָּ/א֙ גָּלֵ֣א רָזִ֔ין וְ/הוֹדַ֗ע לְ/מַלְכָּ/א֙ נְבֽוּכַדְנֶצַּ֔ר מָ֛ה דִּ֥י לֶהֱוֵ֖א בְּ/אַחֲרִ֣ית יוֹמַיָּ֑/א חֶלְמָ֨/ךְ וְ/חֶזְוֵ֥י רֵאשָׁ֛/ךְ עַֽל מִשְׁכְּבָ֖/ךְ דְּנָ֥ה הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/028.yaml
  text: 'But there is a God in heaven who reveals mysteries[a], and he has made known to King Nebuchadnezzar what will happen in the latter days. Your dream, and the visions of your head as you lay on your bed[c][b], were these:'
  footnotes:
  - marker: a
    text: Or 'God in heaven' or 'the God in heaven.' The Aramaic expression is formally indefinite, though it clearly refers to the true God in context.
    reason: alternative_reading
  - marker: b
    text: Or 'in the last days.' The phrase can denote a future climactic period without specifying a particular eschatological system.
    reason: lexical_alternative
  - marker: c
    text: Literally 'the visions of your head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하늘에 계신 하나님께서 비밀들을 드러내시는 분이시며, 바벨론 왕 느부갓네살에게 후일에 일어날 일을 알려 주셨습니다. 왕의 꿈과, 왕이 침상에 누워 있을 때 머리에 떠오른 환상은 이렇습니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어는 형식상 비한정적입니다만, 문맥상 분명히 참 하나님을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘네 머리의 환상들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞선 문맥의 점술가들과 달리 참된 해석의 근원이 하나님께 있음을 대비시키는 역접이므로, 자연스러운 문어체 역접 접속사 ‘그러나’가 적절합니다.
- source_word: אֱלָהּ בִּשְׁמַיָּא
  english_pob_choice: a God in heaven
  chosen_korean: 하늘에 계신 하나님
  alternatives_korean:
  - 하늘에 있는 한 하나님
  - 하늘의 하나님
  lexicon: HALOT
  rationale: 아람어는 형식상 비한정적이지만 문맥상 이스라엘의 참 하나님을 가리키므로, 한국어는 신앙 공동체가 즉시 이해할 수 있는 표현을 쓰되 본문이 주는 하늘-왕정 대비를 살렸습니다.
- source_word: גָּלֵא רָזִין
  english_pob_choice: who reveals mysteries
  chosen_korean: 비밀들을 드러내시는 분이시며
  alternatives_korean:
  - 비밀을 밝히시는 분이시며
  - 신비들을 드러내시는 분이시며
  lexicon: HALOT
  rationale: ‘mysteries’는 단순한 비밀보다 계시로만 알려지는 감추어진 내용을 가리키므로, 본문의 계시적 기능을 살려 ‘비밀들을 드러내시는’으로 옮겼습니다.
- source_word: מָה דִּי לֶהֱוֵא בְּאַחֲרִית יוֹמַיָּא
  english_pob_choice: what will happen in the latter days
  chosen_korean: 후일에 일어날 일을
  alternatives_korean:
  - 마지막 날들에 있을 일을
  - 끝날에 일어날 일을
  lexicon: HALOT
  rationale: 아람어는 미래의 사건을 가리키며, ‘latter days’의 종말론적 여운을 과도하게 확정하지 않기 위해 ‘후일’로 두되 ‘일어날 일’을 붙여 예언적 의미를 분명히 했습니다.
- source_word: עַל מִשְׁכְּבָךְ
  english_pob_choice: as you lay on your bed
  chosen_korean: 침상에 누워 있을 때
  alternatives_korean:
  - 침상 위에 있을 때
  - 침상에 누웠을 때
  lexicon: HALOT
  rationale: 문맥상 꿈이 주어진 상황을 설명하는 부사절이므로, 직역의 ‘침상 위에’보다 한국어에서 자연스러운 상황 묘사인 ‘침상에 누워 있을 때’를 택했습니다.
theological_decisions:
- issue: ‘하늘에 계신 하나님’의 비한정성 유지 여부
  chosen_reading: 한국어는 자연스러운 신앙 언어를 사용하되, 본문이 대조하는 것은 바벨론의 무력한 점술 세계와 하늘의 참 하나님임을 드러냈습니다.
  alternative_readings:
  - 하늘에 있는 한 하나님
  - 하늘의 신
  rationale: 아람어의 형식상 비한정성은 문맥에서 참 하나님을 가리키므로, 한국어에서는 오해를 줄이는 표현을 택하되 우상들과의 대비라는 본문의 수사적 기능을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘이후의 날들’(בְּאַחֲרִית יוֹמַיָּא)의 종말론적 개방성
  chosen_reading: ‘후일’로 옮겨 종말론적 의미를 닫지 않고 미래성만 분명히 했습니다.
  alternative_readings:
  - 마지막 날들
  - 끝날
  rationale: 이 표현은 특정 종말 체계로 곧장 환원되기보다, 뒤에 올 결정적 미래를 가리킬 수 있으므로 과도한 신학적 구체화를 피했습니다.
  doctrine_reference: Translation philosophy §3
