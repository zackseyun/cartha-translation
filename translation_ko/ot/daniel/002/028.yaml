revisions:
- from: 그러나 하늘에 계신 하나님께서 비밀들을 드러내시는 분이시며, 바벨론 왕 느부갓네살에게 후일에 일어날 일을 알려 주셨습니다. 왕의 꿈과, 왕이 침상에 누워 있을 때 머리에 떠오른 환상은 이렇습니다:[a][b]
  to: '그러나 하늘에는 비밀들을 드러내시는 하나님[a]이 계시며, 그분께서 느부갓네살 왕에게 마지막 날들[b]에 무슨 일이 일어날지를 알려 주셨습니다. 왕의 꿈과 왕께서 침상에 누워 계실 때 보신 머리의 환상들[c]은 이러합니다:'
  rationale: The revision uses an existential Korean clause to reflect the source’s ‘there is a God in heaven,’ preserves the formal indefiniteness in a carefully qualified footnote, avoids adding ‘떠오른,’ and restores a footnote for the open-ended temporal phrase. It also relocates all anchors to their proper referents and maintains modern formal-polite register.
