  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דִּֽי חֲזַ֡יְתָ דִּ֣י מִ/טּוּרָ/א֩ אִתְגְּזֶ֨רֶת אֶ֜בֶן דִּי לָ֣א בִ/ידַ֗יִן וְ֠/הַדֶּקֶת פַּרְזְלָ֨/א נְחָשָׁ֤/א חַסְפָּ/א֙ כַּסְפָּ֣/א וְ/דַהֲבָ֔/א אֱלָ֥הּ רַב֙ הוֹדַ֣ע לְ/מַלְכָּ֔/א מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/יַצִּ֥יב חֶלְמָ֖/א וּ/מְהֵימַ֥ן פִּשְׁרֵֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/045.yaml
  text: Just as you saw that a stone was cut from the mountain not by hands[a], and that it crushed the iron, the bronze, the clay, the silver, and the gold, the great God has made known to the king what will happen after this. The dream is certain, and its interpretation is trustworthy.
  footnotes:
  - marker: a
    text: Or 'without hands' / 'not with hands'; the Aramaic idiom indicates that the stone's cutting was not accomplished by human agency.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 당신이 보신 것은, 한 돌이 손으로가 아니라 산에서 잘려 나와서 철과 놋과 진흙과 은과 금을 부서뜨리는 것입니다. 큰 하나님께서 왕에게 이 후에 일어날 일을 알려 주셨습니다. 그 꿈은 확실하고, 그 해석은 신뢰할 만합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘손으로가 아니라/손 없이’입니다. 이 관용구는 돌이 인간의 힘으로 깎인 것이 아님을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דִּי
  english_pob_choice: Just as
  chosen_korean: 그러므로
  alternatives_korean:
  - 곧
  - 이와 같이
  lexicon: HALOT
  rationale: 원문의 연결어는 앞선 환상 장면을 설명·적용하는 기능이어서, 한국어에서는 자연스럽게 원인-결과를 여는 ‘그러므로’로 풀되 과도한 논증화는 피했습니다.
- source_word: אִתְגְּזֶרֶת אֶבֶן דִּי לָא בִידַיִן
  english_pob_choice: a stone was cut ... not by hands
  chosen_korean: 한 돌이 손으로가 아니라 산에서 잘려 나와서
  alternatives_korean:
  - 손으로가 아니라
  - 사람의 손으로가 아니라
  lexicon: HALOT
  rationale: ‘not by hands’의 비인간적 기원을 살리기 위해 ‘손으로가 아니라’를 유지했고, ‘잘려 나와서’로 האבן/stone의 절단 이미지를 자연스럽게 옮겼습니다.
- source_word: פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא
  english_pob_choice: the iron, the bronze, the clay, the silver, and the gold
  chosen_korean: 철과 놋과 진흙과 은과 금
  alternatives_korean:
  - 철과 청동과 진흙과 은과 금
  - 철, 놋, 진흙, 은, 금
  lexicon: HALOT
  rationale: 열거의 재료명은 한국어 관용에 맞게 관사를 빼고 병렬로 처리했으며, נְחָשָׁא는 이 문맥의 금속 재료로서 전통적 ‘놋’을 택했습니다.
- source_word: הוֹדַע לְמַלְכָּא מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  english_pob_choice: has made known to the king what will happen after this
  chosen_korean: 왕에게 이 후에 일어날 일을 알려 주셨습니다
  alternatives_korean:
  - 왕에게 이후에 일어날 일을 알게 하셨습니다
  - 왕에게 이 일 뒤에 일어날 일을 알리셨습니다
  lexicon: HALOT
  rationale: 예고적 의미를 살리기 위해 ‘일어날 일’을 택했고, divine subject에 맞게 ‘알려 주셨습니다’로 공손한 서술을 유지했습니다.
- source_word: וְיַצִּיב חֶלְמָא וּמְהֵימַן פִּשְׁרֵהּ
  english_pob_choice: The dream is certain, and its interpretation is trustworthy
  chosen_korean: 그 꿈은 확실하고, 그 해석은 신뢰할 만합니다
  alternatives_korean:
  - 그 꿈은 확정되어 있고, 그 해석은 믿을 만합니다
  - 그 꿈은 참되고, 그 해석은 신실합니다
  lexicon: HALOT
  rationale: יַצִּיב은 ‘확실하다/확정되다’의 뜻이므로 ‘확실하다’를, מְהֵימַן은 사람·해석에 대한 신뢰성을 나타내므로 ‘신뢰할 만하다’를 선택했습니다.
theological_decisions:
- issue: ‘not by hands’가 암시하는 비인간적/신적 기원
  chosen_reading: 주석 없이 본문에서는 ‘손으로가 아니라’로 직역을 유지했습니다.
  alternative_readings:
  - 사람의 손으로가 아니라
  - 인간의 손이 아닌
  rationale: 원문의 신학적 긴장 — 돌의 기원이 인간이 아니라는 점 — 을 해설로 풀어버리지 않고, 독자가 문맥에서 하나님의 주권적 개입을 읽어 내도록 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
