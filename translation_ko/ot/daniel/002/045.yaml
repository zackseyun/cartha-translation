revisions:
- from: 그러므로 당신이 보신 것은, 한 돌이 손으로가 아니라 산에서 잘려 나와서 철과 놋과 진흙과 은과 금을 부서뜨리는 것입니다. 큰 하나님께서 왕에게 이 후에 일어날 일을 알려 주셨습니다. 그 꿈은 확실하고, 그 해석은 신뢰할 만합니다.[a]
  to: 왕께서 산에서 손을 대지 않고[a] 잘려 나온 돌이 철과 청동과 진흙과 은과 금을 부순 것을 보신 것처럼, 위대하신 하나님께서 왕에게 이 일 뒤에 일어날 일을 알려 주셨습니다. 그 꿈은 확실하고, 그 해석은 신뢰할 만합니다.
  rationale: 비교·설명 기능의 첫 절을 ‘…보신 것처럼’으로 바로잡고, 돌이 잘려 나와 재료들을 부순 환상 장면을 완료된 사건으로 옮겼습니다. ‘손을 대지 않고’와 이에 붙인 각주는 원문의 비인간적 작용의 함의를 유지하되, 본문에서 이를 특정 신학적 해석으로 확대하지 않습니다. 재료명은 현대 용례에 맞춰 ‘청동’으로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:40Z'
