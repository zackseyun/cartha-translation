  source_fidelity: 첫 연결어 כָּל־קֳבֵל דִּי는 문맥상 ‘그러므로’라는 결과 접속보다 왕이 본 환상 세부와의 대응을 나타내는 ‘…보신 것처럼/…듯이’가 더 충실합니다. 또한 원문의 완료된 환상 묘사(돌이 잘려 나와 재료들을 부숨)를 현재형 ‘부서뜨리는 것입니다’로 옮긴 것은 수정이 필요합니다. ‘이 일 뒤에’는 אַחֲרֵי דְנָה의 지시성을 보존합니다.
  naturalness: ‘산에서 손을 대지 않고 잘려 나온 돌’ 및 ‘…보신 것처럼’은 현대 표준어 합쇼체에서 자연스럽고, 원문의 수식 관계와 사건 순서를 명료하게 드러냅니다. ‘청동’은 현대 일반 독자에게 ‘놋’보다 자연스럽습니다.
  terminology: אֱלָהּ רַב은 ‘위대하신 하나님’으로 옮겨 존칭과 ‘great’의 의미를 함께 살렸습니다. פִּשְׁרֵהּ는 ‘해석’, מְהֵימַן은 ‘신뢰할 만합니다’로 유지했습니다. ‘손을 대지 않고’는 비인간적 작용을 암시하는 관용을 본문에서 과잉 해설하지 않습니다.
