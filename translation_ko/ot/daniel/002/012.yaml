source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָ֔ה מַלְכָּ֕/א בְּנַ֖ס וּ/קְצַ֣ף שַׂגִּ֑יא וַ/אֲמַר֙ לְ/ה֣וֹבָדָ֔ה לְ/כֹ֖ל חַכִּימֵ֥י בָבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/012.yaml
  text: Because of this[a], the king became furious and very enraged[b], and he commanded that all the wise men of Babylon be destroyed.
  footnotes:
  - marker: a
    text: Or, 'For this reason' or 'Therefore.'
    reason: lexical_alternative
  - marker: b
    text: The verb is literally 'said,' but here it introduces a royal decree; hence 'commanded.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 때문에[a] 왕이 격분하여 몹시 노했고, 바빌론의 모든 지혜자들을 멸하라고 명령했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 인과 구문은 ‘이 일 때문에’, ‘이 때문에’, ‘그러므로’처럼 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 문자적으로는 ‘말하였다’이지만, 여기서는 왕의 명령을 도입하므로 ‘명령했습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  english_pob_choice: Because of this
  chosen_korean: 이 일 때문에
  alternatives_korean:
  - 이 때문에
  - 그러므로
  lexicon: HALOT
  rationale: 원인의 뚜렷한 연결을 살리되, 현대 한국어에서 자연스러운 인과 표현으로 옮겼습니다.
- source_word: בְּנַס וּקְצַף שַׂגִּיא
  english_pob_choice: became furious and very enraged / very angry
  chosen_korean: 격분하여 몹시 노했고
  alternatives_korean:
  - 분노하여 크게 노했고
  - 격노하여 매우 화를 냈고
  lexicon: HALOT
  rationale: 두 개의 분노 표현이 겹쳐 강도를 높이므로, 첫째는 상태 변화(격분하여), 둘째는 강한 정도(몹시)로 살려 중첩된 격앙을 자연스럽게 반영했습니다.
- source_word: וַאֲמַר
  english_pob_choice: and he commanded
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 명령하였습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 직역하면 '말하다'이지만, 문맥상 왕의 칙령을 선포하는 기능이므로 한국어에서는 명령어로 옮기는 것이 원문의 힘을 더 정확히 드러냅니다.
- source_word: לְהוֹבָדָה
  english_pob_choice: be destroyed
  chosen_korean: 멸하라고
  alternatives_korean:
  - 파멸시키라고
  - 없애라고
  lexicon: HALOT
  rationale: 아람어 אבד의 결과적·사역적 의미를 반영해, 피동적 최종 결과인 '멸하다'로 옮겼습니다.
- source_word: לְכֹל חַכִּימֵי בָבֶל
  english_pob_choice: all the wise men of Babylon
  chosen_korean: 바빌론의 모든 지혜자들을
  alternatives_korean:
  - 바빌론의 모든 현자들을
  - 바빌론의 모든 박사들을
  lexicon: HALOT
  rationale: Daniel 문맥의 궁정 지식인 계층을 가리키므로, 일반적이면서도 비교적 중립적인 '지혜자들'을 선택했습니다.
