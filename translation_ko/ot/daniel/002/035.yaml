id: DAN.2.35
reference: Daniel 2:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּ֣קוּ כַ/חֲדָ֡ה פַּרְזְלָ/א֩ חַסְפָּ֨/א נְחָשָׁ֜/א כַּסְפָּ֣/א וְ/דַהֲבָ֗/א וַ/הֲווֹ֙ כְּ/ע֣וּר מִן אִדְּרֵי קַ֔יִט וּ/נְשָׂ֤א הִמּוֹן֙ רוּחָ֔/א וְ/כָל אֲתַ֖ר לָא הִשְׁתֲּכַ֣ח לְ/ה֑וֹן וְ/אַבְנָ֣/א דִּֽי מְחָ֣ת לְ/צַלְמָ֗/א הֲוָ֛ת לְ/ט֥וּר רַ֖ב וּ/מְלָ֥ת כָּל אַרְעָֽ/א־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/035.yaml
  text: Then the iron[a], the clay, the bronze, the silver, and the gold were crushed all at once and became like chaff from the summer threshing floors, and the wind carried them away so that no place was found for them[c][b]. But the stone that struck the statue became a great mountain and filled the whole earth.
  footnotes:
  - marker: a
    text: Or 'together' / 'as one' for 'all at once.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like dust'; the Aramaic image is light refuse from threshing, hence 'chaff.'
    reason: lexical_alternative
  - marker: c
    text: '''Earth'' could also be rendered ''land,'' but here the broader scope of the vision favors ''earth.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그때 철과 진흙과 놋과 은과 금이 한꺼번에 부서져 여름 타작마당의 겨처럼 되었고, 바람이 그것들을 날려 보내어 그들을 위한 자리가 어디에도 발견되지 않았습니다[a][b]. 그러나 그 우상을 쳤던 돌은 큰 산이 되어 온 땅을 가득 채웠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께’, ‘한몸에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘먼지’로도 옮길 수 있으나, 아람어 이미지는 타작 후 남는 가벼운 겨에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘땅’으로도 옮길 수 있으나, 이 환상의 범위는 더 넓은 ‘온 땅’이 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 서사 진행을 여는 담화 표지로, 현대 한국어에서 자연스럽고 시간 순서를 분명히 하는 ‘그때’가 적절합니다.
- source_word: דָּקוּ כַחֲדָה
  english_pob_choice: were crushed all at once
  chosen_korean: 한꺼번에 부서져
  alternatives_korean:
  - 함께 부서져
  - 동시에 산산이 부서져
  lexicon: HALOT
  rationale: ‘다쿠’의 수동적 파괴와 ‘한꺼번에’의 동시성을 함께 살렸습니다. ‘산산이’는 원문에 없는 분해 정도를 약간 더해 피했습니다.
- source_word: וַהֲווֹ כְּעוּר מִן אִדְּרֵי קַיִט
  english_pob_choice: and became like chaff from the summer threshing floors
  chosen_korean: 여름 타작마당의 겨처럼 되었고
  alternatives_korean:
  - 여름 타작마당에서 나온 겨처럼 되었고
  - 여름 타작마당의 겨풀처럼 되었고
  lexicon: HALOT
  rationale: ‘כְעוּר’의 가벼운 농산물 찌꺼기 이미지를 한국어 성경어휘로 가장 직접적으로 옮길 수 있는 말은 ‘겨’입니다. ‘타작마당’은 원문의 농경 이미지를 보존합니다.
- source_word: וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן
  english_pob_choice: so that no place was found for them
  chosen_korean: 그들을 위한 자리가 어디에도 발견되지 않았습니다
  alternatives_korean:
  - 그들에게는 아무 곳도 남지 않았습니다
  - 그들을 찾을 수 있는 곳이 없었습니다
  lexicon: HALOT
  rationale: 직역적 결과절을 살리면서도 한국어에서 자연스러운 수동 표현으로 정리했습니다. ‘발견되지 않았습니다’는 원문의 ‘found’와 대응합니다.
- source_word: וְאַבְנָא דִּי מְחָת לְצַלְמָא
  english_pob_choice: But the stone that struck the statue
  chosen_korean: 그러나 그 우상을 쳤던 돌은
  alternatives_korean:
  - 그런데 그 우상을 친 돌은
  - 그리고 그 우상을 쳤던 돌은
  lexicon: HALOT
  rationale: 대조를 드러내기 위해 ‘그러나’를 택했습니다. ‘צַלְמָא’는 문맥상 우상의 형상/형체를 가리키므로, 앞절의 거대한 형상 전체를 가리키는 표현으로 ‘우상’을 사용했습니다.
- source_word: הֲוָת לְט֥וּר רַב
  english_pob_choice: became a great mountain
  chosen_korean: 큰 산이 되어
  alternatives_korean:
  - 위대한 산이 되어
  - 거대한 산이 되어
  lexicon: HALOT
  rationale: ‘טוּר’는 산이며, ‘רַב’은 크기뿐 아니라 위세를 띨 수 있지만 한국어에서는 단순하고 자연한 ‘큰 산’이 원문 범위를 잘 지킵니다.
- source_word: וּמְלָת כָּל אַרְעָא
  english_pob_choice: and filled the whole earth
  chosen_korean: 온 땅을 가득 채웠습니다
  alternatives_korean:
  - 온 세상을 가득 채웠습니다
  - 온 땅에 가득했습니다
  lexicon: HALOT
  rationale: ‘אַרְעָא’는 여기서 비전의 우주적 범위를 따라 ‘땅’보다 넓은 ‘온 땅’이 적절합니다. ‘가득 채웠습니다’는 원문의 완료적 충만을 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘אַרְעָא’의 범위
  chosen_reading: 온 땅
  alternative_readings:
  - 땅
  - 땅/나라
  rationale: 다니엘 2장의 상징 구조는 여러 제국을 넘어서는 확장성을 띠므로, 여기서는 전통적 ‘나라’보다 더 넓은 범위를 드러내는 ‘온 땅’이 본문 흐름에 맞습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
- issue: 대조 접속의 처리
  chosen_reading: 그러나
  alternative_readings:
  - 그리고
  rationale: 히브리/아람어 원문은 단순 연결이지만, 앞의 사라짐과 뒤의 지속·팽창 사이의 분명한 대비를 한국어에서도 드러내는 것이 본문 의도 전달에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
