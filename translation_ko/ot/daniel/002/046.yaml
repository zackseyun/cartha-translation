  source_fidelity: ‘제물’은 מִנְחָה의 넓은 ‘예물/헌물’보다 희생 제물을 더 강하게 시사할 수 있으므로 ‘예물’이 더 정확합니다. 또한 נִיחֹחִין은 문맥상 향과 관련되지만 문자적으로는 ‘기분 좋은 향기들/향기로운 냄새들’이므로 각주로 범위를 밝혀야 합니다. 나머지 문장 구조와 다니엘을 향한 행위의 수혜자 표시는 원문에 충실합니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. ‘엎드려 … 절하고’는 왕의 신체적 엎드림과 다니엘에게 보인 경의를 간결하게 함께 전달합니다. ‘예물과 향을 드리라고 명령했습니다’도 현대 표준 한국어에서 명확하고 자연스럽습니다.
  terminology: 느부갓네살, 다니엘, 예물, 향은 표준적인 성경 한국어 용례에 부합합니다. סְגִד는 ‘절하고’로 옮겨 신적 예배라고 단정하지 않으면서도 극진한 경의를 보존합니다.
