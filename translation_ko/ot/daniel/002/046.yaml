source:
  edition: WLC
  text: בֵּ֠/אדַיִן מַלְכָּ֤/א נְבֽוּכַדְנֶצַּר֙ נְפַ֣ל עַל אַנְפּ֔וֹ/הִי וּ/לְ/דָנִיֵּ֖אל סְגִ֑ד וּ/מִנְחָה֙ וְ/נִ֣יחֹחִ֔ין אֲמַ֖ר לְ/נַסָּ֥כָה לֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/046.yaml
  text: Then King Nebuchadnezzar fell on his face and paid homage to Daniel[c][b][a], and he commanded that an offering and incense be offered to him.
  footnotes:
  - marker: a
    text: Or 'worshiped Daniel' or 'bowed down before Daniel.' The Aramaic verb can denote prostration or reverential homage; here 'paid homage' avoids overstating the act as divine worship while preserving the king's extreme reverence.
    reason: alternative_reading
  - marker: b
    text: The verb behind 'be presented' more specifically suggests pouring out a libation for him.
    reason: lexical_alternative
  - marker: c
    text: Or 'pleasing aromas'/'sweet odors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 느부갓네살 왕이 엎드려 다니엘에게 절하고[a], 그에게 예물과 향[b]을 드리라고 명령했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다니엘에게 경배하고’ 또는 ‘다니엘 앞에 몸을 굽히고.’ 아람어 동사는 엎드림이나 경의의 표시를 뜻할 수 있습니다. 여기서는 이를 다니엘에 대한 신적 예배라고 단정하지 않고 왕의 극진한 경의를 나타내는 말로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘기분 좋은 향기들’ 또는 ‘향기로운 냄새들.’
    reason: lexical_alternative
  - marker: c
    text: ‘드리다’로 옮긴 아람어 동사는 더 구체적으로는 그에게 붓다, 곧 전제를 붓다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 이에
  lexicon: HALOT
  rationale: 담화 표지로서 다음 사건을 시간 순서대로 이어 주는 표현이므로, 현대 한국어에서 자연스러운 ‘그때’로 옮겼습니다.
- source_word: נְפַל עַל אַנְפּוֹהִי
  english_pob_choice: fell on his face
  chosen_korean: 엎드려
  alternatives_korean:
  - 얼굴을 땅에 대고
  - 그 얼굴 위로 넘어져
  lexicon: HALOT
  rationale: 관용구의 신체적 동작을 살리되 한국어 문맥에서는 ‘엎드려’가 가장 자연스럽고 간결합니다.
- source_word: סְגִד
  english_pob_choice: paid homage
  chosen_korean: 절하고
  alternatives_korean:
  - 경배하고
  - 몸을 굽혀 절하고
  lexicon: HALOT
  rationale: 다니엘에게 향한 행위이므로 신적 ‘예배’로 단정하기보다, 극진한 존경과 굴복을 드러내는 ‘절하다’로 옮겨 영어 POB의 신학적 긴장을 유지했습니다.
- source_word: מִנְחָה וְנִיחֹחִין
  english_pob_choice: an offering and incense
  chosen_korean: 제물과 향
  alternatives_korean:
  - 예물과 향
  - 제사물과 향기
  lexicon: HALOT
  rationale: 민חה는 넓은 범주의 제의적 제물이고, ניחוחין은 제의와 관련된 향을 가리키므로, 한국어에서도 두 항목을 구분해 간명하게 살렸습니다.
- source_word: אֲמַר לְנַסָּכָה לֵהּ
  english_pob_choice: he commanded that ... be offered to him
  chosen_korean: 드리라고 명령했습니다
  alternatives_korean:
  - 바치라고 명령했습니다
  - 부어 드리라고 명령했습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘붓다/바치다’의 제의적 지시이지만, 본절 전체의 제물·향 문맥에서는 한국어로 ‘드리다’가 가장 자연스럽고 과도한 특정화를 피합니다.
theological_decisions:
- issue: 다니엘에게 행한 סְגִד를 예배로 단정할지 여부
  chosen_reading: ‘절하다’로 번역하여 왕의 극진한 존중과 굴복을 나타냈습니다.
  alternative_readings:
  - 경배하다
  - 예배하다
  rationale: 본문은 인간인 다니엘에게 대한 왕의 행동을 묘사하므로, ‘예배’로 번역하면 인물에 대한 신적 숭배를 과도하게 확정할 수 있습니다. 영어 POB처럼 행위의 강도는 유지하되, 신학적 의미는 열어 두었습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
