  language: ko
  text: 왕이 다니엘에게 — 그 이름은 벨드사살이었습니다 — 대답하며 말했습니다. “네가 내가 본 그 꿈과 그 해석을 내게 알려 줄 수 있느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 이름은 벨드사살이었습니다’입니다.
