lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 대답하고 말했습니다
  - 응답하며 말했습니다
  lexicon: HALOT
  rationale: 아람어의 관용적 서술 결합을 한국어에서 자연스럽게 살리되, ‘대답하다’와 ‘말하다’를 함께 두어 두 동사를 모두 반영했습니다.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  english_pob_choice: whose name was Belteshazzar
  chosen_korean: 그 이름은 벨드사살이었습니다
  alternatives_korean:
  - 벨드사살이라는 이름을 가진
  - 이름이 벨드사살이었던
  lexicon: HALOT
  rationale: 직역적 관계절보다 한국어에서 더 자연스러운 설명식으로 옮기되, 과거 서술로 이름 소개의 서사 기능을 유지했습니다.
- source_word: כָּהֵל
  english_pob_choice: able
  chosen_korean: ~할 수 있느냐
  alternatives_korean:
  - 할 능력이 있느냐
  - 가능하냐
  lexicon: HALOT
  rationale: ‘능력’의 추상어보다 본문이 묻는 수행 가능성을 직접 드러내는 표현이 자연스럽습니다.
- source_word: לְהוֹדָעֻתַנִי
  english_pob_choice: to make known to me
  chosen_korean: 내게 알려 줄 수 있느냐
  alternatives_korean:
  - 내게 알게 할 수 있느냐
  - 내게 밝혀 줄 수 있느냐
  lexicon: HALOT
  rationale: 사역적 의미를 살리면서도 한국어에서는 결과 중심의 ‘알려 주다’가 가장 자연스럽고, 질문형 문맥에 맞게 정리했습니다.
- source_word: חֶלְמָא ... וּפִשְׁרֵהּ
  english_pob_choice: the dream ... and its interpretation
  chosen_korean: 그 꿈과 그 해석
  alternatives_korean:
  - 그 꿈과 그 뜻풀이
  - 그 꿈과 풀이
  lexicon: HALOT
  rationale: Daniel 본문에서 פשר는 기술적 의미의 ‘해석’이 적절하므로, 단순한 ‘의미’보다 POB의 의도를 반영했습니다.
