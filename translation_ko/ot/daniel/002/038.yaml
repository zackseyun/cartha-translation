source:
  edition: WLC
  text: וּ/בְ/כָל דִּ֣י דארין בְּֽנֵי אֲ֠נָשָׁ/א חֵיוַ֨ת בָּרָ֤/א וְ/עוֹף שְׁמַיָּ/א֙ יְהַ֣ב בִּ/ידָ֔/ךְ וְ/הַשְׁלְטָ֖/ךְ בְּ/כָלְּ/ה֑וֹן אַנְתְּה ה֔וּא רֵאשָׁ֖/ה דִּ֥י דַהֲבָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/038.yaml
  text: And wherever the children of men dwell[a], the beasts of the field and the birds of the heavens—he has given them into your hand and made you ruler over all of them[c][b]. You are the head of gold.
  footnotes:
  - marker: a
    text: Or 'human beings' for 'the children of men.'
    reason: lexical_alternative
  - marker: b
    text: The implied subject of 'has given' and 'made you ruler' is God, as stated in the previous verse.
    reason: cross_reference
  - marker: c
    text: Or 'the birds of the sky.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 사람들이 어디에 살든지, 들의 짐승들과 하늘의 새들을 그분이 당신의 손에 넘기시고, 당신을 그들 모두의 통치자로 세우셨습니다. 당신은 금으로 된 머리입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들’은 문자적으로는 ‘사람의 아들들’이라는 관용구를 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וּבְכָל דִּי דארין
  english_pob_choice: And wherever ... dwell
  chosen_korean: 사람들이 어디에 살든지
  alternatives_korean:
  - 사람들이 사는 곳마다
  - 사람들이 어디에 거주하든지
  lexicon: HALOT
  rationale: ‘어디에 살든지’는 장소 포괄과 거주의 지속성을 자연스럽게 살리면서, 아람어의 ‘어디서나/어디에나’ + ‘거주하다’ 구성을 현대 한국어로 매끄럽게 옮깁니다.
- source_word: בְּנֵי אֲנָשָׁא
  english_pob_choice: the children of men
  chosen_korean: 사람들
  alternatives_korean:
  - 인간들
  - 인류
  lexicon: HALOT
  rationale: 원문은 문자적으로 ‘사람의 아들들/사람들’이라는 관용구이지만, 한국어에서는 ‘사람들’이 가장 자연스럽고, POB의 인간-대표적 의미도 무리 없이 전달합니다.
- source_word: חֵיוַת בָּרָא וְעוֹף שְׁמַיָּא
  english_pob_choice: the beasts of the field and the birds of the heavens
  chosen_korean: 들의 짐승들과 하늘의 새들
  alternatives_korean:
  - 들짐승들과 하늘의 새들
  - 야생 짐승들과 하늘의 새들
  lexicon: HALOT
  rationale: ‘들의 짐승들’은 원문의 ‘들/들판’ 이미지를 보존하고, ‘하늘의 새들’은 문어적 높임을 유지해 아람어의 병렬 구조를 살립니다.
- source_word: יְהַב בִּידָךְ וְהַשְׁלְטָךְ
  english_pob_choice: he has given them into your hand and made you ruler
  chosen_korean: 그분이 당신의 손에 넘기시고, 당신을 그들 모두의 통치자로 세우셨습니다
  alternatives_korean:
  - 그분이 당신의 손에 주시고, 당신을 그들 모두의 통치자로 삼으셨습니다
  - 그분이 당신의 손에 넘겨주시고, 당신을 그들 모두를 다스리게 하셨습니다
  lexicon: HALOT
  rationale: ‘손에 넘기다’는 권한 위임의 관용구를 그대로 살리고, ‘세우셨습니다’는 사역형의 ‘통치자로 만들다/임명하다’의 의미를 자연스럽게 담습니다.
- source_word: רֵאשָׁה דִּי דַהֲבָא
  english_pob_choice: the head of gold
  chosen_korean: 금으로 된 머리
  alternatives_korean:
  - 금 머리
  - 금의 머리
  lexicon: HALOT
  rationale: 꿈의 상징 이미지를 한국어로 분명하게 살리기 위해 ‘~으로 된’ 구성을 택했습니다. 이는 단순한 형용사화보다 명사구의 물질적 속성을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 이 절의 행위 주체가 암시되어 있음
  chosen_reading: 주어를 ‘그분’으로 옮겨, 바로 앞 절에서 밝혀진 하늘의 하나님을 가리키도록 했습니다.
  alternative_readings:
  - 주어를 생략해 ‘당신의 손에 넘기셨고…’로 처리
  - 명시적으로 ‘하나님이’라고 넣기
  rationale: 아람어는 이 절에서 동사의 주어를 생략하지만, 바로 앞 문맥이 하나님의 수여와 통치를 분명히 밝힙니다. 한국어에서는 ‘그분’으로 연결해 문맥 흐름을 유지하면서도, 본문이 가리키는 주체를 분명하게 했습니다.
  doctrine_reference: 단 2:37의 문맥 연속성
- issue: ‘금으로 된 머리’의 상징성
  chosen_reading: 문자적 상징 표현을 유지해 느부갓네살을 환상의 머리 부분과 직접 연결했습니다.
  alternative_readings:
  - ‘황금 머리’로 의역
  - ‘금 머리’로 축약
  rationale: 이 구절은 왕의 정체를 꿈의 상징과 직접 겹쳐 보여 주므로, 상징 이미지를 약화시키지 않는 번역이 필요합니다. ‘금으로 된 머리’는 그 연결을 가장 분명하게 보존합니다.
  doctrine_reference: 단 2장 상징 구조
