id: DAN.2.1
reference: Daniel 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת שְׁתַּ֗יִם לְ/מַלְכוּת֙ נְבֻֽכַדְנֶצַּ֔ר חָלַ֥ם נְבֻֽכַדְנֶצַּ֖ר חֲלֹמ֑וֹת וַ/תִּתְפָּ֣עֶם רוּח֔/וֹ וּ/שְׁנָת֖/וֹ נִהְיְתָ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/001.yaml
  text: In the second year of Nebuchadnezzar’s reign[a], Nebuchadnezzar dreamed dreams, and his spirit was troubled[c][b], and his sleep left him.
  footnotes:
  - marker: a
    text: Or, more literally, 'dreamed dreams.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'his spirit was agitated.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'his sleep was gone from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 느부갓네살이 통치한 지 이 년째 되던 해에, 느부갓네살은 여러 꿈을 꾸었습니다[a]. 그의 영이 불안해졌고[b], 그는 잠을 이루지 못했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, '꿈들을 꾸었습니다'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, '그의 영이 동요하였습니다.'
    reason: lexical_alternative
  - marker: c
    text: 직역하면, '그의 잠이 그에게서 떠났습니다'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁתַּיִם
  english_pob_choice: In the second year
  chosen_korean: 통치 제2년에
  alternatives_korean:
  - 제2년에
  - 왕위 제2년에
  lexicon: HALOT
  rationale: 시간 부사를 자연스러운 한국어 서술로 옮기되, לְמַלְכוּת과 연결된 왕의 통치 기간이라는 점을 살려 '통치 제2년'으로 구체화했습니다.
- source_word: לְמַלְכוּת
  english_pob_choice: of ... reign
  chosen_korean: 통치
  alternatives_korean:
  - 왕권
  - 왕국
  lexicon: HALOT
  rationale: 여기서는 영역(kingdom)보다 왕의 재위 기간을 가리키므로, 영어 POB의 'reign'에 맞춰 '통치'로 옮겼습니다.
- source_word: חָלַם ... חֲלֹמוֹת
  english_pob_choice: dreamed dreams
  chosen_korean: 꿈들을 꾸었습니다
  alternatives_korean:
  - 꿈을 꾸었습니다
  - 꿈꿈을 꾸었습니다
  lexicon: HALOT
  rationale: 히브리어의 목적어 반복(동족 목적어)을 한국어에서는 과도한 직역 없이 복수형의 '꿈들을'로 살려 반복성과 강세를 반영했습니다.
- source_word: וַתִּתְפָּעֶם רוּחוֹ
  english_pob_choice: his spirit was troubled
  chosen_korean: 그의 영이 번민하였고
  alternatives_korean:
  - 그의 영이 동요하였고
  - 그의 마음이 번민하였고
  lexicon: HALOT
  rationale: ר֫וּחַ를 '마음'으로 심리화하기보다 '영'으로 유지하고, 내적 불안의 강도를 '번민하다'로 표현했습니다.
- source_word: וּשְׁנָתוֹ נִהְיְתָה עָלָיו
  english_pob_choice: his sleep left him
  chosen_korean: 그의 잠은 그에게서 떠났습니다
  alternatives_korean:
  - 그의 잠은 사라졌습니다
  - 그는 잠을 이루지 못했습니다
  lexicon: HALOT
  rationale: 관용구의 의미를 살리면서도 원문의 '잠이 떠남' 이미지를 보존해, 영어 POB의 직설성을 한국어로 재현했습니다.
theological_decisions:
- issue: רוחו의 번역에서 '영'을 유지할지 '마음/정신'으로 풀지
  chosen_reading: '''그의 영''으로 직역에 가깝게 유지했습니다.'
  alternative_readings:
  - 그의 마음
  - 그의 정신
  rationale: 본문은 느부갓네살 내부의 불안이지만, 히브리어는 רוּחַ를 사용하므로 이를 '마음'으로 바꾸면 원문의 인류학적 표현이 약화됩니다.
  doctrine_reference: 성경 히브리어의 인칭 내면어휘 보존
