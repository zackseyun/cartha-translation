translation:
  language: ko
  text: 그의 종아리는 철이었고, 그의 발은 일부는 철이고 일부는 점토였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토기’ 또는 ‘질그릇’. 아람어 חֲסַף는 점토성 재료나 토기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקוֹהִי
  english_pob_choice: its legs
  chosen_korean: 그의 종아리
  alternatives_korean:
  - 그의 다리
  - 그의 하반신
  lexicon: HALOT
  rationale: 이 아람어 명사는 상반신이 아니라 다리 부분을 가리키므로, 한국어에서는 자연스러운 현대 표현인 ‘종아리’로 구체화해 앞의 ‘발’과 구분했습니다.
- source_word: דִּי פַרְזֶל
  english_pob_choice: of iron
  chosen_korean: 철로 되었고
  alternatives_korean:
  - 철로 된
  - 철의
  lexicon: HALOT
  rationale: 영어의 ‘of iron’은 재질을 나타내는 압축 표현이므로, 한국어에서는 상태 서술인 ‘철로 되었고’로 옮겨 물질 구성을 자연스럽게 드러냈습니다.
- source_word: מִנְהוֹן וּמִנְהוֹן
  english_pob_choice: partly ... and partly
  chosen_korean: 일부는 ... 일부는
  alternatives_korean:
  - 반은 ... 반은
  - 어느 부분은 ... 어느 부분은
  lexicon: HALOT
  rationale: 직역하면 ‘그들 가운데서’이지만 여기서는 발의 혼합 구성을 뜻하므로, 분배적 의미를 분명히 하는 ‘일부는 ... 일부는’을 택했습니다.
- source_word: חֲסַף
  english_pob_choice: clay
  chosen_korean: 진흙
  alternatives_korean:
  - 점토
  - 토기
  - 질그릇
  lexicon: HALOT
  rationale: 이 단어는 ‘clay’로도 옮길 수 있지만, 한국어에서는 비유적 이미지가 더 즉각적으로 전달되는 ‘진흙’이 자연스럽습니다. 다만 문맥상 도자기 재료의 성격도 함께 내포합니다.
theological_decisions:
- issue: 상반되는 재료의 혼합을 어떻게 처리할지
  chosen_reading: 철과 진흙의 혼합이라는 상징을 평이하게 유지해, 뒤의 심판·붕괴 이미지를 흐리지 않도록 했습니다.
  alternative_readings:
  - 철과 점토
  - 철과 토기
  rationale: 본문은 왕국/권세의 취약성과 분열을 드러내는 비전 서술이므로, 이미지의 즉시성을 살리는 번역이 중요합니다.
  doctrine_reference: 다니엘 2장의 상징적 환상 묘사
