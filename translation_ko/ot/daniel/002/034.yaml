revisions:
- from: 당신은 돌 하나가 깎여 나오는 것을 볼 때까지 보고 계셨습니다. 그것은 손으로 된 것이 아니었고, 그 돌이 쇠와 진흙으로 된 발을 가진 그 형상을 치고 그것들을 부수었습니다.[a][b]
  to: 왕께서는 돌 하나가 사람의 손을 거치지 않고[a] 깎여 나와, 그 형상의[b] 쇠와 진흙으로 된 발들을 쳐서 부수기까지 보고 계셨습니다.
  rationale: 왕을 향한 격식 있는 호칭을 사용하고, 원문의 ‘계속 보고 있었다’와 ‘~할 때까지’를 한 문장 안에서 자연스럽게 재현했습니다. ‘사람의 손을 거치지 않고 깎여 나온’은 신학적 해석을 덧붙이지 않으면서 원문의 비인간적 행위자 함의를 보존합니다. ‘그 발들’을 명시하여 복수 대명사의 지시 대상도 분명히 했으며, 각주 표지를 해당 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:41Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘돌 하나가 깎여 나오는 것을 볼 때까지 보고 계셨습니다’는 원문의 지속 관찰과 ‘~할 때까지’의 범위를 부자연스럽고 중복되게 처리하며, 이어지는 돌의 타격과 파쇄 사건도 그 관찰 내용에서 분리합니다. 또한 ‘손으로 된 것이 아니었고’는 무엇이 손으로 되지 않았는지 불명확합니다. ‘사람의 손을 거치지 않고 깎여 나온’은 원문의 비인간적 행위자 함의를 자연스럽게 보존합니다.
  naturalness: ‘당신은’은 왕에게 직접 말하는 이 문맥에서 현대 표준어 합쇼체로는 부자연스럽거나 무례하게 들릴 수 있으므로 ‘왕께서는’이 적절합니다. ‘…부수기까지 보고 계셨습니다’는 아람어의 지속적 관찰과 사건의 진행을 자연스럽게 연결합니다.
  terminology: ‘형상’은 צלם의 ‘형상/조각상’ 범위를 유지하는 적절한 선택입니다. 대명사 ‘그것들’은 선행사가 불분명할 수 있으므로, 원문상 복수인 발을 ‘그 발들을’로 명시했습니다. 각주 표지는 해당 어구 바로 뒤에 두어야 합니다.
  issues:
  - severity: high
    issue: 관찰의 대상과 시간 범위가 부정확하고 중복적으로 표현됨
    rationale: ‘돌 하나가 깎여 나오는 것을 볼 때까지 보고’는 ‘보다’가 중복되고, 돌이 형상을 치고 부수는 후속 사건을 ‘계속 보고 있었다’는 원문의 서술에서 이탈합니다.
  - severity: medium
    issue: ‘손으로 된 것’의 지시 대상 및 행위가 불명확함
    rationale: 원문은 돌이 ‘손들에 의해’ 잘려 나오지 않았음을 말합니다. ‘사람의 손을 거치지 않고 깎여 나온’이 자연스럽고 충실합니다.
  - severity: medium
    issue: 각주 표지가 관련 어구에 붙어 있지 않음
    rationale: ‘손 없이’ 대안은 ‘사람의 손을 거치지 않고’에, ‘조각상’ 대안은 ‘형상’에 각각 연결되어야 독자가 각주의 대상을 알 수 있습니다.
