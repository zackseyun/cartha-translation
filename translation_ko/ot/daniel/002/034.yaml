  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָזֵ֣ה הֲוַ֗יְתָ עַ֠ד דִּ֣י הִתְגְּזֶ֤רֶת אֶ֨בֶן֙ דִּי לָ֣א בִ/ידַ֔יִן וּ/מְחָ֤ת לְ/צַלְמָ/א֙ עַל רַגְל֔וֹ/הִי דִּ֥י פַרְזְלָ֖/א וְ/חַסְפָּ֑/א וְ/הַדֵּ֖קֶת הִמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/034.yaml
  text: You were watching until a stone was cut out[a], not by hands[b], and it struck the statue on its feet of iron and clay and crushed them.
  footnotes:
  - marker: a
    text: Or 'without hands.' The Aramaic idiom indicates that the stone was not cut out by human agency.
    reason: lexical_alternative
  - marker: b
    text: Or 'the image.' The Aramaic word can denote an image or statue; here it refers to the great figure seen in the dream.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 돌 하나가 깎여 나오는 것을 볼 때까지 보고 계셨습니다. 그것은 손으로 된 것이 아니었고, 그 돌이 쇠와 진흙으로 된 발을 가진 그 형상을 치고 그것들을 부수었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘손 없이’. 아람어 관용구는 이 돌이 인간의 손이나 능력으로 만들어진 것이 아님을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 형상’. 아람어 단어는 ‘형상’이나 ‘조각상’을 가리킬 수 있으며, 여기서는 꿈에서 본 거대한 인물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוַיְתָ
  english_pob_choice: you were watching
  chosen_korean: 보고 계셨습니다
  alternatives_korean:
  - 보고 있었습니다
  - 지켜보고 계셨습니다
  - 보셨습니다
  lexicon: HALOT
  rationale: 과거의 지속적 관찰을 나타내므로 단순 과거 ‘보셨습니다’보다 진행성을 살린 ‘보고 계셨습니다’가 자연스럽습니다.
- source_word: הִתְגְּזֶרֶת אֶבֶן
  english_pob_choice: a stone was cut out
  chosen_korean: 돌 하나가 깎여 나오는 것
  alternatives_korean:
  - 돌 하나가 잘려 나오는 것
  - 돌 하나가 다듬어져 나오는 것
  - 돌 하나가 깎여 나온 것
  lexicon: HALOT
  rationale: 아람어 수동/재귀형은 돌이 인간 손에서 만들어진 것이 아니라 ‘깎여 나와’ 생겨난 과정을 나타내므로, 문맥상 자연스러운 현재화로 옮겼습니다.
- source_word: דִּי לָא בִידַיִן
  english_pob_choice: not by hands
  chosen_korean: 손으로 된 것이 아니었고
  alternatives_korean:
  - 손 없이
  - 손으로 하지 않고
  - 사람의 손으로 하지 않고
  lexicon: HALOT
  rationale: 직역형 ‘손으로’는 한국어에서 어색하므로, 비인간적 기원을 드러내는 의미를 살려 ‘손으로 된 것이 아니었고’로 옮겼습니다. 본문의 관용구는 인간적 제작/능력이 아님을 강조합니다.
- source_word: לְצַלְמָא
  english_pob_choice: the statue
  chosen_korean: 그 형상
  alternatives_korean:
  - 그 상
  - 그 우상
  - 그 조각상
  lexicon: HALOT
  rationale: 꿈에서 본 विशाल한 인간형 이미지를 가리키므로, 구체적이면서도 원문의 ‘image/statue’ 범위를 유지하는 ‘형상’이 적절합니다.
theological_decisions:
- issue: ‘손으로 된 것이 아니었고’의 의미 보존
  chosen_reading: 인간의 손에 의한 제작이나 기원이 아니라는 뜻을 본문에 직접 드러냈습니다.
  alternative_readings:
  - 손 없이
  - 사람 손으로 하지 않고
  rationale: 이 구절의 핵심은 단순한 방식 설명이 아니라, 돌의 기원이 인간적 조작을 넘어선다는 점입니다. 한국어 본문은 그 신학적 함의를 약화시키지 않도록 직설적으로 처리했습니다.
  doctrine_reference: Translation philosophy §3, §6
