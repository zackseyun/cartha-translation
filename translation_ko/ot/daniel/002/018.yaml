id: DAN.2.18
reference: Daniel 2:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רַחֲמִ֗ין לְ/מִבְעֵא֙ מִן קֳדָם֙ אֱלָ֣הּ שְׁמַיָּ֔/א עַל רָזָ֖/ה דְּנָ֑ה דִּ֣י לָ֤א יְהֹֽבְדוּן֙ דָּנִיֵּ֣אל וְ/חַבְר֔וֹ/הִי עִם שְׁאָ֖ר חַכִּימֵ֥י בָבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/018.yaml
  text: and to seek mercy from before the God of heaven concerning this mystery[a], so that Daniel and his companions might not perish with the rest of the wise men of Babylon.
  footnotes:
  - marker: a
    text: Or 'secret.' The Aramaic term refers to a hidden matter that requires revelation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 রহဖ রহ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신비’. 아람어 용어는 드러나지 않은 숨은 문제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַחֲמִין
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은혜
  lexicon: HALOT
  rationale: 아람어 복수형이지만 여기서는 하나님께 간구하는 대상이므로, 한국어에서는 자연스럽고 성경적인 추상명사인 ‘긍휼’로 옮겼습니다.
- source_word: לְמִבְעֵא
  english_pob_choice: to seek
  chosen_korean: 구하게
  alternatives_korean:
  - 찾게
  - 청하게
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사이므로, 단순 요청보다 간절한 간구의 뉘앙스를 살려 ‘구하게’로 렌더링했습니다.
- source_word: עַל רָזָה דְּנָה
  english_pob_choice: concerning this mystery
  chosen_korean: 이 비밀에 관하여
  alternatives_korean:
  - 이 신비에 관하여
  - 이 숨은 일에 관하여
  lexicon: HALOT
  rationale: 다니엘 2장의 רָז는 단순한 은폐된 비밀이라기보다 계시가 필요한 숨은 문제이므로, 본문 맥락을 살려 ‘비밀’로 옮겼습니다.
- source_word: דִּי לָא יְהֹבְדוּן
  english_pob_choice: so that ... might not perish
  chosen_korean: 그들이 멸망하지 않도록
  alternatives_korean:
  - 그들이 죽지 않도록
  - 그들이 사라지지 않도록
  lexicon: HALOT
  rationale: 문맥상 목적/결과 절을 나타내며, 동사의 의미를 한국어 자연문으로 가장 직접적으로 반영하는 표현은 ‘멸망하다’입니다.
- source_word: שְׁאָר חַכִּימֵי בָבֶל
  english_pob_choice: the rest of the wise men of Babylon
  chosen_korean: 바빌론의 나머지 현자들과 함께
  alternatives_korean:
  - 바빌론의 다른 박사들과 함께
  - 바빌론의 나머지 지혜자들과 함께
  lexicon: HALOT
  rationale: ‘חַכִּימֵי’는 궁정의 지혜자들을 가리키므로, 전통적 교회어보다는 본문 기능을 드러내는 ‘현자’가 적절합니다.
theological_decisions:
- issue: רָז의 의미 범주
  chosen_reading: ‘비밀’은 인간에게 숨겨진 것이며, 하나님께서 계시하셔야 드러나는 내용으로 이해했습니다.
  alternative_readings:
  - ‘신비’로 옮길 수도 있습니다.
  - ‘숨은 일’로 풀어쓸 수도 있습니다.
  rationale: 다니엘 2장의 רָז는 단순한 정보 비밀이 아니라 해석이 필요한 계시적 숨은 문제이므로, 문맥상 ‘비밀’이 가장 균형 잡힌 선택입니다.
  doctrine_reference: 번역 원칙 §1, §3
