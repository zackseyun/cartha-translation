id: DAN.2.13
reference: Daniel 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דָתָ֣/א נֶפְקַ֔ת וְ/חַכִּֽימַיָּ֖/א מִֽתְקַטְּלִ֑ין וּ/בְע֛וֹ דָּנִיֵּ֥אל וְ/חַבְר֖וֹ/הִי לְ/הִתְקְטָלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/013.yaml
  text: So the decree went out[a], and the wise men were being killed[b]; and they sought Daniel and his companions to kill them.
  footnotes:
  - marker: a
    text: Or 'was issued.' The Aramaic literally says 'went out,' referring to the promulgation of the royal decree.
    reason: lexical_alternative
  - marker: b
    text: Or 'were being slain.' The form suggests the executions were already underway.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 조서가 내려졌고, 지혜자들이 죽임을 당하고 있었습니다. 그리고 그들은 다니엘과 그의 동료들을 찾아 그들을 죽이려 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어는 문자적으로 '나갔다'고 말합니다. 이는 왕령의 공포를 가리킵니다.
    reason: source_note
  - marker: b
    text: 형태상 이미 죽임이 진행되고 있었음을 시사합니다.
    reason: source_note
lexical_decisions:
- source_word: דָתָא / decree
  english_pob_choice: decree
  chosen_korean: 조서
  alternatives_korean:
  - 칼령
  - 명령
  - 조칙
  lexicon: 국어 일반 용례 / 공적 문서 용어
  rationale: 바벨론 궁정의 왕령이 공포되는 장면이므로, 단순한 '명령'보다 공문서 뉘앙스가 있는 '조서'가 더 정확하고 자연스럽습니다.
- source_word: נֶפְקַת / went out
  english_pob_choice: went out
  chosen_korean: 내려졌고
  alternatives_korean:
  - 나갔고
  - 공포되었고
  - 발령되었고
  lexicon: HALOT
  rationale: 아람어의 직역상 '나가다'의 이미지가 있지만, 한국어에서는 왕의 조서가 공식적으로 시행되는 뜻을 자연스럽게 살리기 위해 '내려졌고'로 옮겼습니다.
- source_word: חַכִּימַיָּא / the wise men
  english_pob_choice: the wise men
  chosen_korean: 지혜자들
  alternatives_korean:
  - 현자들
  - 지혜로운 사람들
  - 지혜 있는 자들
  lexicon: HALOT
  rationale: 다니엘서의 궁정 직함을 반복해서 드러내는 표현이므로, 맥락상 '지혜자들'이 가장 직역에 가깝고 문맥도 잘 살립니다.
- source_word: מִתְקַטְּלִין / were being killed
  english_pob_choice: were being killed
  chosen_korean: 죽임을 당하고 있었습니다
  alternatives_korean:
  - 살해되고 있었습니다
  - 죽임을 당하고 있던 중이었습니다
  - 죽어가고 있었습니다
  lexicon: HALOT
  rationale: 진행 중인 수동을 나타내는 형태를 반영해 이미 처형이 진행되는 긴박감을 살렸습니다.
- source_word: חַבְרוֹהִי / his companions
  english_pob_choice: his companions
  chosen_korean: 그의 동료들
  alternatives_korean:
  - 그의 동무들
  - 그와 함께한 자들
  - 그의 친구들
  lexicon: HALOT
  rationale: 궁정 맥락에서 'companions'는 친밀한 '친구들'보다 공식적인 동료·동반자 의미가 더 강하므로 '동료들'이 적절합니다.
theological_decisions:
- issue: 문장의 진행성과 긴박감
  chosen_reading: '''죽임을 당하고 있었습니다''와 ''죽이려 했습니다''로 각각 진행 중인 처형과 추적 의도를 구분했습니다.'
  alternative_readings:
  - '''죽임을 당했습니다''로 단순 완료형 처리'
  - '''죽이기 위해 찾았습니다''로 평이하게 처리'
  rationale: 본문은 이미 처형이 진행되는 상황과 다니엘 일행을 찾아 추가로 죽이려는 의도를 함께 보여 주므로, 두 동작의 단계 차이를 한국어에서도 분명히 드러내는 것이 중요합니다.
  doctrine_reference: 서사 본문 해석 원리
