  to: 그러므로 다니엘은 바벨론의 지혜자들을 죽이도록[a] 왕이 임명한 아리옥에게 가서, 그에게 이렇게 말했습니다. “바벨론의 지혜자들을 죽이지 마십시오. 저를 왕 앞에 데려가 주십시오. 그러면 제가 왕께 그 해석을 알려 드리겠습니다.[b]”
