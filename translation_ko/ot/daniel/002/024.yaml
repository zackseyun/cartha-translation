base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/024.yaml
  text: 'Therefore Daniel went in to Arioch[a], whom the king had appointed to destroy the wise men of Babylon. He went and said this to him: “Do not destroy the wise men of Babylon. Bring me in before the king[b], and I will show the interpretation to the king.”'
  footnotes:
  - marker: a
    text: Or 'Do not kill the wise men of Babylon.' The Aramaic verb can denote causing to perish or destroying; here it refers to the execution order against them.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will make known the interpretation to the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 다니엘은 바벨론의 지혜자들을 멸망시키도록 왕이 임명한 아리옥에게 들어가서 그에게 이렇게 말했습니다. “바벨론의 지혜자들을 멸망시키지 마십시오. 저를 왕 앞에 데려가 주십시오. 그러면 제가 왕께 그 해석을 보여 드리겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사는 ‘죽이다’보다 넓게 ‘멸망시키다/멸하다’의 뜻도 가질 수 있습니다. 여기서는 지혜자들에게 내려진 사형 집행을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕께 그 해석을 알려 드리겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 이로 말미암아
  lexicon: HALOT
  rationale: 앞선 내용과의 논리적 연결을 자연스럽게 살리면서도 원문의 인과·결론 관계를 간결하게 드러냅니다.
- source_word: עַל עַל־אַרְיוֹךְ
  english_pob_choice: went in to Arioch
  chosen_korean: 아리옥에게 들어가서
  alternatives_korean:
  - 아리옥에게 나아가서
  - 아리옥에게 찾아가서
  lexicon: HALOT
  rationale: 직접 대면하는 궁정 장면의 접근성을 살리되, 한국어에서 자연스러운 ‘들어가다’로 원문의 접근/진입 뉘앙스를 반영했습니다.
- source_word: לְהוֹבָדָה
  english_pob_choice: to destroy
  chosen_korean: 멸망시키도록
  alternatives_korean:
  - 죽이도록
  - 멸하게 하도록
  lexicon: HALOT
  rationale: 원문의 causative 동사는 단순 살해보다 더 넓은 ‘파멸시키다’의 의미를 가지므로, 영어 POB의 ‘destroy’에 맞춰 더 넓은 파괴·멸망 의미를 살렸습니다.
- source_word: קֳדָם מַלְכָּא
  english_pob_choice: before the king
  chosen_korean: 왕 앞에
  alternatives_korean:
  - 왕의 앞에
  - 임금 앞에
  lexicon: HALOT
  rationale: 궁정 출입과 면대의 의미를 한국어 관용에 맞게 간명하게 표현했습니다.
- source_word: וּפִשְׁרָא
  english_pob_choice: the interpretation
  chosen_korean: 그 해석
  alternatives_korean:
  - 그 뜻풀이
  - 그 설명
  lexicon: HALOT
  rationale: 다니엘서에서 פשר는 꿈/비밀의 기술적 용어로 쓰이므로, 단순한 ‘설명’보다 ‘해석’이 문맥상 더 정확합니다.
theological_decisions:
- issue: 알지 못하는 대상의 예언적/궁정 연설체 유지
  chosen_reading: 다니엘의 직접 화법은 정중한 명령형과 청유형으로 옮겨, 왕과 아리옥 앞에서의 궁정적 긴장과 예의를 함께 드러냈습니다.
  alternative_readings:
  - 더 평이한 서술체로 완화
  - 더 고어체의 청유형으로 조정
  rationale: 본문은 생명에 대한 중대한 위기 속에서도 다니엘의 담담하고 단호한 요청을 보여 주므로, 현대적이되 격을 잃지 않는 합쇼체가 적절합니다.
  doctrine_reference: 서사적 문맥과 화행 보존
