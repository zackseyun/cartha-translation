base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/044.yaml
  text: And in the days of those kings[a], the God of heaven will set up a kingdom that will never be destroyed, and the kingdom will not be left to another people. It will crush and put an end to all these kingdoms[b], and it will stand forever.
  footnotes:
  - marker: a
    text: Or 'break in pieces'; the Aramaic verb conveys crushing or shattering.
    reason: lexical_alternative
  - marker: b
    text: '''Those kings'' refers back to the kings/kingdoms represented in Nebuchadnezzar''s dream; interpreters differ on the precise historical referent.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 왕들의 시대에 하늘의 하나님이 한 나라를 세우실 텐데, 그 나라는 영원히 무너지지 않을 것입니다. 그 나라는 다른 백성에게 넘겨지지 않을 것입니다. 그 나라는 이 모든 나라들을 부수고 끝내 버릴 것이며, 영원히 서 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부수고’에 해당하는 아람어 동사는 ‘산산이 부수다, 산산조각 내다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 왕들’은 느부갓네살의 꿈에 나타난 왕들과 나라들을 가리키며, 정확한 역사적 대응에 대해서는 해석자들 사이에 견해 차이가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְיוֹמֵיהוֹן
  english_pob_choice: And in the days of
  chosen_korean: 그 왕들의 시대에
  alternatives_korean:
  - 그 왕들의 날에
  - 그 왕들의 시기에
  lexicon: HALOT
  rationale: 시간 부사구로서 문맥상 자연스러운 ‘시대에’가 원문의 역사적·서사적 연결을 잘 살립니다.
- source_word: אֱלָהּ שְׁמַיָּא
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘의 하나님이신 분
  - 하늘 하나님
  lexicon: HALOT
  rationale: 아람어의 정관적 칭호를 한국어에서도 통상적인 신적 칭호로 옮기되, 직역성을 해치지 않도록 ‘하늘의 하나님’으로 유지했습니다.
- source_word: מַלְכוּ
  english_pob_choice: a kingdom
  chosen_korean: 한 나라
  alternatives_korean:
  - 하나의 나라
  - 한 왕국
  lexicon: HALOT
  rationale: 여기서는 추상적 통치권보다 하나님이 세우시는 실체적 나라를 가리키므로, 현대 한국어에서 자연스러운 ‘한 나라’가 적절합니다.
- source_word: לְעַם אָחֳרָן לָא תִשְׁתְּבִק
  english_pob_choice: will not be left to another people
  chosen_korean: 다른 백성에게 넘겨지지 않을 것입니다
  alternatives_korean:
  - 다른 백성에게 남겨지지 않을 것입니다
  - 다른 민족에게 맡겨지지 않을 것입니다
  lexicon: HALOT
  rationale: 수동적·이행적 뉘앙스를 살려, 나라가 다른 집단의 소유로 넘어가지 않는다는 뜻을 자연스럽게 표현했습니다.
- source_word: תַּדִּק וְתָסֵיף
  english_pob_choice: It will crush and put an end to
  chosen_korean: 부수고 끝내 버릴 것이며
  alternatives_korean:
  - 짓부수고 끝장낼 것이며
  - 깨뜨리고 끝낼 것이며
  lexicon: HALOT
  rationale: 두 동사의 중첩된 파괴력을 유지하기 위해 ‘부수고’와 ‘끝내 버릴’로 구분해 옮겼습니다.
theological_decisions:
- issue: 그 나라의 정체를 번역문에 명시할지 여부
  chosen_reading: 본문이 말하는 바대로, 하나님이 세우시는 영원한 나라의 성격과 승리를 말하되 특정한 교리적 동일시를 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 메시아 왕국으로 명시
  - 단순한 미래의 정치 체제로 일반화
  rationale: 아람어 본문 자체는 영원히 멸망하지 않을 하나님이 세우시는 나라를 말하지만, 번역문이 그 정체를 과도하게 규정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy 1, 3
- issue: ‘그 왕들’의 지시 대상
  chosen_reading: 문맥상 앞선 꿈의 왕/나라들을 가리키는 표현으로 유지하고, 역사적 범위를 번역에서 좁히지 않았습니다.
  alternative_readings:
  - 이 왕들
  - 그 열왕들
  rationale: 지시어의 모호성을 보존해야 해석을 번역이 선점하지 않습니다.
  doctrine_reference: Translation philosophy 3
