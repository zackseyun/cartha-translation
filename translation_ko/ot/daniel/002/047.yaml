  text: עָנֵה֩ מַלְכָּ֨/א לְ/דָנִיֵּ֜אל וְ/אָמַ֗ר מִן קְשֹׁט֙ דִּ֣י אֱלָהֲ/כ֗וֹן ה֣וּא אֱלָ֧הּ אֱלָהִ֛ין וּ/מָרֵ֥א מַלְכִ֖ין וְ/גָלֵ֣ה רָזִ֑ין דִּ֣י יְכֵ֔לְתָּ לְ/מִגְלֵ֖א רָזָ֥/ה דְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/047.yaml
  text: The king answered Daniel and said[a], “Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, because you were able to reveal this mystery.”
  footnotes:
  - marker: a
    text: Or 'a revealer of secrets.' The Aramaic term can denote hidden matters generally, but 'mysteries' better preserves Daniel's recurring vocabulary of divine disclosure.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 다니엘에게 대답하여 말했습니다. 「참으로 당신들의 하나님은 신들의 하나님이시며 왕들의 주님이시고, 비밀들을 드러내시는 분이십니다. 당신이 이 비밀을 드러낼 수 있었기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비밀들’은 다니엘서에서 반복되는 계시 언어를 살린 번역입니다. ‘숨은 것들’ 또는 ‘비밀한 일들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  english_pob_choice: answered ... and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 아람어의 관용적 서술 공식을 자연스럽게 옮기되, 두 동사의 순차성을 살리기 위해 ‘대답하여 말했습니다’를 택했습니다.
- source_word: מִן קְשֹׁט
  english_pob_choice: Truly
  chosen_korean: 참으로
  alternatives_korean:
  - 진실로
  - 참말로
  - 확실히
  lexicon: HALOT
  rationale: 강조의 의미를 가진 아람어 관용구로서, 현대 한국어에서 자연스럽고 격식 있는 ‘참으로’가 적절합니다.
- source_word: אֱלָהֲכוֹן
  english_pob_choice: your God
  chosen_korean: 당신들의 하나님
  alternatives_korean:
  - 당신의 하나님
  - 너희 하나님
  lexicon: HALOT
  rationale: 복수형 어미가 다니엘과 동료들을 함께 가리키는 맥락을 반영하여 ‘당신들의 하나님’으로 옮겼습니다.
- source_word: וְגָלֵה רָזִין
  english_pob_choice: and a revealer of mysteries
  chosen_korean: 비밀들을 드러내시는 분
  alternatives_korean:
  - 비밀들을 밝혀내시는 분
  - 신비들을 드러내시는 분
  - 수수께끼들을 드러내시는 분
  lexicon: HALOT
  rationale: 다니엘서의 רָז는 단순한 ‘비밀’보다 계시로 밝혀지는 감추어진 내용을 가리키므로, ‘드러내시는 분’으로 동사의 역동성을 살렸습니다.
- source_word: לְמִגְלֵא רָזָה דְנָה
  english_pob_choice: to reveal this mystery
  chosen_korean: 이 비밀을 드러낼 수 있었기 때문입니다
  alternatives_korean:
  - 이 비밀을 밝힐 수 있었기 때문입니다
  - 이 신비를 드러낼 수 있었기 때문입니다
  lexicon: HALOT
  rationale: 마지막 절은 다니엘이 실제로 감당한 계시 능력의 근거를 밝히므로, 인과를 드러내는 한국어 구문으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: Nebuchadnezzar의 고백을 완전한 회심으로 읽을지, 지존성 인정으로 남길지
  chosen_reading: 하나님의 유일한 예배를 선언하는 문장으로 확대하지 않고, ‘신들의 하나님’과 ‘왕들의 주님’이라는 최고 칭호의 인정으로 유지했습니다.
  alternative_readings:
  - ‘오직 당신의 하나님만이 하나님이십니다’처럼 강한 일신론적 표현
  - 우상 숭배적 배경을 약화시키는 완화된 표현
  rationale: 본문은 다니엘의 하나님에 대한 진정한 경외와 지위를 인정하지만, 왕이 다른 신들을 완전히 버렸다고 명시하지는 않으므로 그 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
