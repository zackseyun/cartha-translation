language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֔/א מֶ֖לֶךְ מַלְכַיָּ֑/א דִּ֚י אֱלָ֣הּ שְׁמַיָּ֔/א מַלְכוּתָ֥/א חִסְנָ֛/א וְ/תָקְפָּ֥/א וִֽ/יקָרָ֖/א יְהַב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/037.yaml
  text: You[a], O king, are the king of kings, to whom the God of heaven has given the kingdom, the might, the power, and the glory.
  footnotes:
  - marker: a
    text: Or 'the honor' or 'the splendor' for 'the glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이시여, 왕께서는 왕들의 왕이십니다. 하늘의 하나님께서 왕에게 나라와 힘과 능력과 영광을 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַ֣נְתְּה
  english_pob_choice: You
  chosen_korean: 왕이시여
  alternatives_korean:
  - 당신은
  - 그대여
  lexicon: HALOT
  rationale: 둘째인칭 직접 호칭을 한국어 공손한 호격으로 살려, 뒤의 ‘왕들 가운데 왕’과 함께 예우의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: מַלְכָּא / מֶלֶךְ מַלְכַיָּא
  english_pob_choice: O king / the king of kings
  chosen_korean: 왕들 가운데 왕
  alternatives_korean:
  - 왕 중의 왕
  - 왕의 왕
  lexicon: HALOT
  rationale: 아람어의 칭호적 구성은 직역 가능한 ‘왕들 가운데 왕’으로 옮겨 과장된 왕호의 힘을 보존했습니다.
- source_word: אֱלָהּ שְׁמַיָּא
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘 하나님
  - 하늘에 계신 하나님
  lexicon: HALOT
  rationale: 정관적 칭호를 한국어에서 가장 자연스럽게 드러내는 형태로 옮겼으며, 하늘의 근원성을 유지했습니다.
- source_word: מַלְכוּתָא / חִסְנָא / תָקְפָּא / וִיקָרָא
  english_pob_choice: the kingdom, the might, the power, and the glory
  chosen_korean: 나라와 힘과 능력과 영광
  alternatives_korean:
  - 왕국과 권세와 능력과 존귀
  - 나라와 권능과 힘과 영광
  lexicon: HALOT
  rationale: ‘מלכותא’는 여기서 통치 영역과 왕권을 함께 가리키므로 ‘나라’로, ‘חסנא/תקפא’는 서로 겹치지만 구별되는 القوة 계열로서 ‘힘/능력’으로, ‘ויקרא’는 POB의 ‘glory’에 맞춰 ‘영광’으로 옮겼습니다.
- source_word: יְהַב לָךְ
  english_pob_choice: has given ... to you
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 넘겨주셨습니다
  lexicon: HALOT
  rationale: 완료된 하나님의 부여 행위를 한국어 현재완료감 있는 높임말로 표현해, 이미 주어진 결과가 현재 유효함을 살렸습니다.
theological_decisions:
- issue: 바빌론 왕의 권세가 어디서 오는가
  chosen_reading: 느부갓네살의 왕권은 하늘의 하나님께서 주신 선물로 제시됩니다.
  alternative_readings:
  - 정복과 지배력에서 자연히 나온 권세로 읽을 수 있습니다.
  rationale: 본문은 왕권, 힘, 능력, 영광을 인간의 성취가 아니라 하나님의 부여로 명시하므로 그 신학적 방향을 그대로 보존했습니다.
  doctrine_reference: 본문의 직접 진술을 우선하는 번역 원칙
