  text: וְ/אֶצְבְּעָת֙ רַגְלַיָּ֔/א מנ/הון פַּרְזֶ֖ל ו/מנ/הון חֲסַ֑ף מִן קְצָ֤ת מַלְכוּתָ/א֙ תֶּהֱוֵ֣ה תַקִּיפָ֔ה וּ/מִנַּ֖/הּ תֶּהֱוֵ֥ה תְבִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/042.yaml
  text: And as the toes of the feet were partly iron and partly clay[a], so part of the kingdom will be strong[b], and part of it will be brittle.
  footnotes:
  - marker: a
    text: Or 'clay pottery' / 'earthenware' for the Aramaic term rendered 'clay.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fragile' or 'breakable' for 'brittle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 발가락들도 발의 것이 철과 진흙이 반반이듯이, 그 나라의 얼마는 강하고[a] 얼마는 부서지기 쉽습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘점토’나 ‘도기(질그릇)’로도 옮길 수 있습니다. 아람어 어휘는 여기서 진흙질 재료를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘취약한’이나 ‘깨지기 쉬운’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְבְּעָת רַגְלַיָּא
  english_pob_choice: the toes of the feet
  chosen_korean: 발가락들
  alternatives_korean:
  - 발의 발가락들
  - 발가락들로
  lexicon: HALOT
  rationale: ‘발가락’이 이미 ‘발’을 전제하므로 한국어에서는 중복을 줄이되, 본문의 신상 이미지와 대응 관계를 살리기 위해 복수형으로 옮겼습니다.
- source_word: מנ/הון ... ו/מנ/הון
  english_pob_choice: partly ... and partly
  chosen_korean: 반반이
  alternatives_korean:
  - 일부는 … 또 일부는
  - 부분적으로 … 또 부분적으로
  lexicon: HALOT
  rationale: 두 재료가 섞인 구성을 자연스러운 한국어로 압축해 전달하면서, 분할된 성분이라는 원문의 의미를 유지했습니다.
- source_word: חֲסַף
  english_pob_choice: clay
  chosen_korean: 진흙
  alternatives_korean:
  - 점토
  - 도기
  lexicon: HALOT
  rationale: 다니엘 2장의 상징 장면에서 철과 대조되는 연약한 토질을 한국어 독자가 즉시 이해하도록 ‘진흙’으로 옮겼습니다. 다만 원어의 점토/도기 가능성은 각주로 남겼습니다.
- source_word: תַקִּיפָה
  english_pob_choice: strong
  chosen_korean: 강하고
  alternatives_korean:
  - 튼튼하고
  - 견고하고
  lexicon: HALOT
  rationale: 나라의 한 부분이 지닌 힘과 안정성을 간결하게 드러내는 기본 대응으로 ‘강하다’를 택했습니다.
- source_word: תְבִירָה
  english_pob_choice: brittle
  chosen_korean: 부서지기 쉽습니다
  alternatives_korean:
  - 취약합니다
  - 깨지기 쉽습니다
  lexicon: HALOT
  rationale: 단순한 ‘깨짐’보다 구조적으로 약해 쉽게 파손되는 성질을 보여 주는 표현으로, 철과 진흙의 대비를 살렸습니다.
theological_decisions:
- issue: 부분적으로 강하고 부분적으로 약한 왕국이라는 상징의 보존
  chosen_reading: ‘그 나라의 얼마는 강하고 얼마는 부서지기 쉽습니다’로 옮겨, 단일한 성격이 아니라 혼합된 상태를 드러냈습니다.
  alternative_readings:
  - ‘그 나라의 일부는 강하고 일부는 약합니다’
  - ‘그 나라의 절반은 강하고 절반은 약합니다’
  rationale: 본문의 반복 구조는 동일한 왕국 안의 이질적 구성과 불안정성을 강조하므로, 이를 희석하지 않도록 분할성과 연약함을 함께 살렸습니다.
  doctrine_reference: 다니엘 2장 신상 환상의 왕국 분열과 불안정성
- issue: ‘clay’의 한국어 선택
  chosen_reading: 본문에는 ‘진흙’을 썼지만 각주에서 ‘점토’ 또는 ‘도기’의 가능성을 밝혔습니다.
  alternative_readings:
  - 점토
  - 도기
  - 질그릇
  rationale: 상징적으로는 진흙의 연약함이 잘 드러나지만, 원어 חֲסַף는 점토/도기 재질까지 포함할 수 있어 해석의 폭을 각주로 보존했습니다.
  doctrine_reference: 원문 어휘의 의미 범위 보존 원칙
