  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
  footnotes:
  - marker: a
    text: Or 'secret.' The Aramaic term is rendered 'mystery' here to preserve the chapter's repeated theme of a hidden matter disclosed only by God.
    reason: lexical_alternative
  - marker: b
    text: '''Enchanters'' translates a technical term for one class of Babylonian specialists; ''astrologers'' is a traditional alternative.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다니엘이 왕 앞에서 대답하여 말했습니다[a]. 「왕이 묻는 그 비밀은 어떤 지혜자나 술객이나 박사[b]나 점쟁이도 왕에게 알려 줄 수 없습니다」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대답하여 이르되’로 옮길 수 있습니다. 원문의 응답 동사와 서사적 말문 도입을 함께 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘술객’과 ‘박사’는 각각 바빌론의 전문 점술·지식인 계열을 가리키는 기술어입니다. 영어 POB의 ‘enchanters’, ‘magicians’ 구분을 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: HALOT
  rationale: 서사적 응답 동사를 자연스러운 현대 한국어로 옮기되, 궁정 대화의 격식을 살려 ‘대답하여 말했습니다’로 처리했습니다.
- source_word: קֳדָם
  english_pob_choice: before
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕 앞에서
  - 왕의 면전에서
  lexicon: HALOT
  rationale: ‘before/in the presence of’의 관계를 한국어 궁정 표현으로 간결하게 반영했습니다.
- source_word: רָזָה
  english_pob_choice: mystery
  chosen_korean: 비밀
  alternatives_korean:
  - 신비
  - 은밀한 일
  lexicon: HALOT
  rationale: 다니엘서에서의 계시되지 않은 숨은 내용을 가리키는 말로, 한국어에서는 ‘비밀’이 가장 직접적이지만, 본문의 반복 주제를 보존하려는 영어 POB의 ‘mystery’ 선택을 반영해 문맥상 무리 없는 번역으로 처리했습니다.
- source_word: אָשְׁפִין
  english_pob_choice: enchanters
  chosen_korean: 술객
  alternatives_korean:
  - 주술사
  - 마술사
  - 점성가
  lexicon: HALOT
  rationale: 바빌론의 전문 점술/주술 계열을 가리키는 기술어로, ‘술객’이 고전적이면서도 한국어에서 해당 직능을 비교적 넓게 포괄합니다.
- source_word: חַרְטֻמִּין
  english_pob_choice: magicians
  chosen_korean: 박사
  alternatives_korean:
  - 마술사
  - 서기관 주술사
  lexicon: HALOT
  rationale: 고대 근동의 지식인·주술 전문가 집단을 가리키므로, 단순한 현대적 ‘마술사’보다 문맥상 격식 있는 ‘박사’가 궁정 열거문에 더 자연스럽습니다.
- source_word: גָּזְרִין
  english_pob_choice: diviners
  chosen_korean: 점쟁이
  alternatives_korean:
  - 점술가
  - 예언가
  lexicon: HALOT
  rationale: 숨은 일을 알아맞히는 기능을 드러내는 말로, 한국어에서는 ‘점쟁이’가 기능상 가장 직접적입니다.
theological_decisions:
- issue: 다니엘의 말하는 방식과 왕에 대한 존대
  chosen_reading: 내레이터 서술은 합쇼체를 유지하고, 다니엘의 직접 발화는 왕에게 예를 갖춘 공손한 진술로 옮겼습니다.
  alternative_readings:
  - 직접화법을 더 중립적으로 평서형으로 옮김
  - 보다 고어적인 궁정체 사용
  rationale: 원문의 궁정 장면과 권력 관계를 보존하면서도 현대 표준어 합쇼체 독자를 위한 가독성을 확보하기 위한 선택입니다.
  doctrine_reference: Korean style/register policy
