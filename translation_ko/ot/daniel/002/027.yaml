source:
  edition: WLC
  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
  footnotes:
  - marker: a
    text: Or 'secret.' The Aramaic term is rendered 'mystery' here to preserve the chapter's repeated theme of a hidden matter disclosed only by God.
    reason: lexical_alternative
  - marker: b
    text: '''Enchanters'' translates a technical term for one class of Babylonian specialists; ''astrologers'' is a traditional alternative.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다니엘이 왕 앞에서 대답하여 말했습니다. 「왕께서 물으시는 그 비밀[a]은 지혜 있는 사람들이나 술객들이나 마술사들[b]이나 점술가들이 왕께 알려 드릴 수 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은밀한 일’. 아람어 라즈(רָזָה)는 이 장에서 하나님께서 드러내셔야 하는 숨겨진 일을 가리키며, ‘비밀’로 옮겨 그 반복되는 주제를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘술객’과 ‘마술사’는 각각 바빌론 궁정의 서로 다른 전문 주술·점술가 집단을 가리키는 기술어입니다. ‘술객’에 해당하는 말은 전통적으로 ‘점성가’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
