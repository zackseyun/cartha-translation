  lexicon: HALOT
  rationale: ‘before/in the presence of’의 관계를 한국어 궁정 표현으로 간결하게 반영했습니다.
- source_word: רָזָה
  english_pob_choice: mystery
  chosen_korean: 비밀
  alternatives_korean:
  - 신비
  - 은밀한 일
  lexicon: HALOT
  rationale: 다니엘서에서의 계시되지 않은 숨은 내용을 가리키는 말로, 한국어에서는 ‘비밀’이 가장 직접적이지만, 본문의 반복 주제를 보존하려는 영어 POB의 ‘mystery’ 선택을 반영해 문맥상 무리 없는 번역으로 처리했습니다.
- source_word: אָשְׁפִין
  english_pob_choice: enchanters
  chosen_korean: 술객
  alternatives_korean:
  - 주술사
  - 마술사
  - 점성가
  lexicon: HALOT
  rationale: 바빌론의 전문 점술/주술 계열을 가리키는 기술어로, ‘술객’이 고전적이면서도 한국어에서 해당 직능을 비교적 넓게 포괄합니다.
- source_word: חַרְטֻמִּין
  english_pob_choice: magicians
  chosen_korean: 박사
  alternatives_korean:
  - 마술사
  - 서기관 주술사
  lexicon: HALOT
  rationale: 고대 근동의 지식인·주술 전문가 집단을 가리키므로, 단순한 현대적 ‘마술사’보다 문맥상 격식 있는 ‘박사’가 궁정 열거문에 더 자연스럽습니다.
- source_word: גָּזְרִין
  english_pob_choice: diviners
  chosen_korean: 점쟁이
  alternatives_korean:
  - 점술가
  - 예언가
  lexicon: HALOT
  rationale: 숨은 일을 알아맞히는 기능을 드러내는 말로, 한국어에서는 ‘점쟁이’가 기능상 가장 직접적입니다.
theological_decisions:
- issue: 다니엘의 말하는 방식과 왕에 대한 존대
  chosen_reading: 내레이터 서술은 합쇼체를 유지하고, 다니엘의 직접 발화는 왕에게 예를 갖춘 공손한 진술로 옮겼습니다.
  alternative_readings:
  - 직접화법을 더 중립적으로 평서형으로 옮김
  - 보다 고어적인 궁정체 사용
  rationale: 원문의 궁정 장면과 권력 관계를 보존하면서도 현대 표준어 합쇼체 독자를 위한 가독성을 확보하기 위한 선택입니다.
  doctrine_reference: Korean style/register policy
