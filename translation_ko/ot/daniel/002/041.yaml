  rationale: 원문의 관찰-해석-관찰의 상응 구조를 보존하도록 문장을 재구성했습니다. ‘그 왕국’은 특정 상징적 왕국이라는 문맥을 반영하며, ‘진흙 같은 점토’는 마지막 재료 표현의 점토와 진흙 의미를 자연스러운 한국어로 함께 드러냅니다. 특정 역사적 왕국이나 교리적 해석은 덧붙이지 않았습니다.
