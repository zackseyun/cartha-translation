  text: וְ/דִֽי חֲזַ֜יְתָה רַגְלַיָּ֣/א וְ/אֶצְבְּעָתָ֗/א מנ/הון חֲסַ֤ף דִּֽי פֶחָר֙ ו/מנ/הון פַּרְזֶ֔ל מַלְכ֤וּ פְלִיגָה֙ תֶּהֱוֵ֔ה וּ/מִן נִצְבְּתָ֥/א דִ֥י פַרְזְלָ֖/א לֶֽהֱוֵא בַ֑/הּ כָּ/ל קֳבֵל֙ דִּ֣י חֲזַ֔יְתָה פַּ֨רְזְלָ֔/א מְעָרַ֖ב בַּ/חֲסַ֥ף טִינָֽ/א־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/041.yaml
  text: And as you saw the feet and toes[a], partly of potter’s clay and partly of iron, the kingdom will be divided; yet some of the firmness of iron will be in it[b], just as you saw the iron mixed with clay mud.
  footnotes:
  - marker: a
    text: Or 'some of the strength of iron will be in it.' The Aramaic term can denote firmness, strength, or stability.
    reason: lexical_alternative
  - marker: b
    text: Or 'mixed with muddy clay.' The phrase combines terms for clay and mud, emphasizing the unstable mixture.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 보신 발과 발가락[a]은 일부가 토기장이의 점토이고 일부가 쇠였으므로, 그 왕국은 분열될 것입니다. 그러나 그 안에는 쇠의 단단함이 일부[b] 있을 것입니다. 왕이 철이 진흙 같은 점토와 섞여 있는 것을 보신 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘발’과 ‘발가락’을 모두 복수형으로 표현합니다.
    reason: source_form
  - marker: b
    text: 또는 ‘쇠의 견고함이 그 안에 일부 있을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלַיָּא וְאֶצְבְּעָתָא
  english_pob_choice: the feet and toes
  chosen_korean: 발과 발가락
  alternatives_korean:
  - 다리와 발가락
  lexicon: HALOT
  rationale: 문맥상 상(像)의 하부를 가리키며 발가락과 짝을 이루므로 ‘발’이 자연스럽고, ‘다리’는 의미를 벗어납니다.
- source_word: חֲסַף דִּי פֶחָר
  english_pob_choice: potter’s clay
  chosen_korean: 토기장이의 진흙
  alternatives_korean:
  - 토기장이의 점토
  - 도공의 점토
  lexicon: HALOT
  rationale: 재료의 성질과 그것이 빚어진 대상의 이미지를 함께 살리기 위해 ‘진흙’보다 문어적인 ‘점토’도 가능하지만, 여기서는 손으로 빚는 재료감을 살려 ‘토기장이의 진흙’으로 옮겼습니다.
- source_word: מַלְכוּ פְלִיגָה תֶּהֱוֵה
  english_pob_choice: the kingdom will be divided
  chosen_korean: 그 나라가 분열될 것입니다
  alternatives_korean:
  - 그 왕국이 나뉠 것입니다
  - 그 통치가 분열될 것입니다
  lexicon: HALOT
  rationale: 예언적 상징의 해석이므로 영어 POB의 ‘the kingdom’을 따라 ‘그 나라’로 옮겼고, פְלִיגָה는 분열/나뉨을 뜻해 ‘분열될 것입니다’가 적절합니다.
- source_word: נִצְבְּתָא דִי פַרְזְלָא
  english_pob_choice: the firmness of iron
  chosen_korean: 쇠의 단단함
  alternatives_korean:
  - 쇠의 견고함
  - 철의 강도
  lexicon: HALOT
  rationale: 나뉘지 않은 물질적 강도를 가리키므로 추상화된 ‘강도’보다 ‘단단함’이 이미지에 더 가깝습니다.
- source_word: בַּחֲסַף טִינָא
  english_pob_choice: with muddy clay
  chosen_korean: 진흙과 섞인 것
  alternatives_korean:
  - 진흙 같은 점토와 섞인 것
  - 질퍽한 점토와 섞인 것
  lexicon: HALOT
  rationale: 마지막 비교절은 철이 진흙과 섞인 상태를 설명하므로, 중복 재료 명칭을 한국어에서 자연스럽게 풀어 ‘진흙과 섞인 것’으로 처리했습니다.
theological_decisions:
- issue: 상징적 나라 해석의 지시 대상
  chosen_reading: ‘그 나라’는 신상 비유 전체에서 다니엘이 설명하는 마지막 단계의 분열된 왕국을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - ‘그 왕국’으로 더 직역
  - ‘그 통치’로 추상화
  rationale: 본문은 문자적 금속 혼합이 아니라 역사적-상징적 왕국의 분열을 말하므로, 해석적 명시를 유지하되 과도한 주석화는 피했습니다.
  doctrine_reference: 다니엘 2장의 제국 상징 해석
- issue: ‘그러나/yet’의 접속 뉘앙스
  chosen_reading: 본질적 대조를 살리되 한국어에서는 ‘그러나’로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 그렇지만
  - 하지만
  rationale: 히브리/아람어 문맥의 대조를 유지하면서도 현대 한국어 합쇼체에서 가장 안정적인 연결 표현을 선택했습니다.
  doctrine_reference: 문장 결속과 예언문체
