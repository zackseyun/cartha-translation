  source_fidelity: ‘이는 … 때문입니다’는 כָּל־קֳבֵל דִּי를 인과로 한정하여, 본문의 비교·상응 관계를 바꿉니다. 또한 첫 절의 ‘일부는 …이고 일부는 …이므로’는 본문이 묘사하는 재질 구성을 원인절처럼 만들고, 마지막의 בַּחֲסַף טִינָא에 있는 점토와 진흙의 결합도 충분히 드러내지 못합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서, ‘보신 것처럼’으로 자연스러운 비교 구문을 구성합니다. ‘토기장이의 점토’와 ‘진흙 같은 점토’는 각각 재료와 마지막의 진흙성 점토를 한국어답게 표현합니다.
  terminology: מַלְכוּ는 문맥상 특정 왕국을 가리키므로 ‘그 왕국’으로 옮겼습니다. פַּרְזֶל은 문맥상 일관되게 ‘쇠’로 유지했고, נִצְבְּתָא는 물질 이미지와 연결되는 ‘단단함’으로 옮겼습니다. 각주 표지는 실제로 해당 어구에 붙도록 정리했습니다.
