    text: 또는 ‘밤에 본 환상 속에서’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 숨은 일이 밝혀졌습니다’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘찬송하였습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때에 / 그러자
  alternatives_korean:
  - 그때
  - 그리하여
  - 이에
  lexicon: HALOT
  rationale: 두 번 반복되는 순차 표지를 한국어에서도 앞뒤 절로 나누어 살려, 사건 진행과 응답의 연결을 자연스럽게 드러냈습니다.
- source_word: רָזָה
  english_pob_choice: the mystery
  chosen_korean: 그 비밀
  alternatives_korean:
  - 그 신비
  - 그 숨은 일
  lexicon: HALOT
  rationale: 다니엘서 문맥에서 하늘로부터 드러나는 숨은 내용을 가리키므로, 의미를 유지하면서도 현대 한국어에서 자연스러운 '비밀'을 택했습니다.
- source_word: בְּחֶזְוָא דִי לֵילְיָא
  english_pob_choice: in a vision of the night
  chosen_korean: 밤의 환상 가운데
  alternatives_korean:
  - 밤 환상 가운데
  - 밤에 본 환상 가운데
  - 밤의 환시 가운데
  lexicon: HALOT
  rationale: 직역의 어순을 무리하게 따르기보다, '밤의 환상'으로 이미지와 수식을 보존하고 '가운데'로 매개 전치사의 뜻을 살렸습니다.
- source_word: בָּרִךְ
  english_pob_choice: blessed
  chosen_korean: 찬송하였습니다
  alternatives_korean:
  - 축복하였습니다
  - 복을 빌었습니다
  - 찬양하였습니다
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 ברך는 한국어 성경 문체에서 흔히 '찬송하다'로 옮겨도 원문의 경배 행위를 잘 드러냅니다. 단순한 말의 복을 비는 뜻이 아니므로 '축복하다'는 피했습니다.
theological_decisions:
- issue: 드러남/계시의 주체
  chosen_reading: 그 비밀이 … 다니엘에게 드러났습니다
  alternative_readings:
  - 그 비밀이 … 다니엘에게 밝혀졌습니다
  - 그 비밀이 … 다니엘에게 계시되었습니다
  rationale: 원문은 인간의 발견이 아니라 숨은 것이 하늘로부터 알려지는 사건을 말하므로, 과도한 교리 용어인 '계시'보다 서술적으로 '드러났습니다'를 택해 계시의 성격을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 하늘의 하나님 호칭
  chosen_reading: 하늘의 하나님
  alternative_readings:
  - 하늘의 하나님님
  - 하늘 하나님
  - 하늘의 하나님
  rationale: 원문의 정형적 호칭 לֶאֱלָהּ שְׁמַיָּא를 그대로 반영해, 다니엘서의 예배적·제국 궁정적 문맥을 살렸습니다.
  doctrine_reference: Translation philosophy §5
