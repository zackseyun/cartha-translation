translation:
  language: ko
  text: 그때에 그 비밀이 밤의 환상 속에서[a] 다니엘에게 드러났습니다[b]. 그러자 다니엘이 하늘의 하나님을 찬양하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
