id: DAN.2.21
reference: Daniel 2:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הוּא מְהַשְׁנֵ֤א עִדָּנַיָּ/א֙ וְ/זִמְנַיָּ֔/א מְהַעְדֵּ֥ה מַלְכִ֖ין וּ/מְהָקֵ֣ים מַלְכִ֑ין יָהֵ֤ב חָכְמְתָ/א֙ לְ/חַכִּימִ֔ין וּ/מַנְדְּעָ֖/א לְ/יָדְעֵ֥י בִינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/021.yaml
  text: He changes times and seasons[a]; he removes kings and sets up kings[b]; he gives wisdom to the wise and knowledge to those who have understanding.
  footnotes:
  - marker: a
    text: Or 'appointed times' for 'seasons.' The Aramaic pair can denote both times in general and their fitting or appointed occasions.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to those who know understanding.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 때와 계절을 바꾸시고, 왕들을 제거하시며 왕들을 세우시고, 지혜를 지혜로운 이들에게 주시며, 분별을 아는 이들에게 지식을 주십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘때와 계절’은 아람어의 병렬 표현으로, 일반적인 시간뿐 아니라 정해진 때나 적절한 시기까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘이해를 아는 이들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַשְׁנֵא עִדָּנַיָּא וְזִמְנַיָּא
  english_pob_choice: changes times and seasons
  chosen_korean: 때와 계절을 바꾸시고
  alternatives_korean:
  - 시기와 절기를 바꾸시고
  - 시간들과 정해진 때들을 바꾸시고
  lexicon: HALOT
  rationale: Aramaic의 병렬 표현을 한국어의 자연스러운 대응인 ‘때와 계절’로 살리되, 변화의 능동성을 ‘바꾸시고’로 옮겼습니다.
- source_word: מְהַעְדֵּה מַלְכִין וּמְהָקֵים מַלְכִין
  english_pob_choice: removes kings and sets up kings
  chosen_korean: 왕들을 제거하시며 왕들을 세우시고
  alternatives_korean:
  - 왕들을 폐하시며 왕들을 세우시고
  - 왕들을 폐위하시며 왕들을 세우시고
  lexicon: HALOT
  rationale: ‘remove/set up’의 직설적 대립을 보존했습니다. 정치적으로 더 구체적인 ‘폐위’도 가능하지만, 원문의 범위를 넘지 않도록 더 넓은 ‘제거’와 ‘세우다’를 택했습니다.
- source_word: חָכְמְתָא לְחַכִּימִין
  english_pob_choice: wisdom to the wise
  chosen_korean: 지혜를 지혜로운 이들에게 주시며
  alternatives_korean:
  - 지혜를 현명한 이들에게 주시며
  - 지혜를 지혜자들에게 주시며
  lexicon: HALOT
  rationale: 명사 ‘지혜’와 형용사적 명사 ‘지혜로운 이들’의 대응을 살려, 단순한 수식보다 소유/부여 관계가 드러나게 했습니다.
- source_word: מַנְדְּעָא לְיָדְעֵי בִינָה
  english_pob_choice: knowledge to those who know understanding
  chosen_korean: 분별을 아는 이들에게 지식을 주십니다
  alternatives_korean:
  - 이해를 아는 이들에게 지식을 주십니다
  - 분별을 가진 이들에게 지식을 주십니다
  lexicon: HALOT
  rationale: 원문의 어색할 정도로 셈어적인 표현을 그대로 매끈하게 풀기보다, ‘알다’와 ‘이해/분별’의 긴장을 남기기 위해 ‘분별을 아는 이들’로 옮겼습니다. ‘지식’과 ‘분별’의 구분도 유지했습니다.
theological_decisions:
- issue: 하나님의 주권적 통치가 정치 권력에 미치는 직접성
  chosen_reading: 하나님이 왕들을 ‘제거하시며’ ‘세우신다’는 직접 진술을 약화하지 않았습니다.
  alternative_readings:
  - 하나님이 왕들의 등장을 허락하십니다
  - 하나님이 정치 변동에 영향을 주십니다
  rationale: 본문은 정치 권력의 교체를 하나님의 행위로 직접 진술하므로, 허용이나 영향력 정도로 완화하지 않고 원문의 강한 주장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
