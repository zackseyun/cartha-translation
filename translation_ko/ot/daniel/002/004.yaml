- from: 그러자 갈대아 사람들이 아람어로 왕에게 말했습니다. 「왕이시여, 영원히 사십시오. 꿈을 당신의 종들에게 말씀해 주십시오. 그러면 우리가 그 해석을 알려 드리겠습니다」[a][b][c]
  to: 그러자 갈대아 사람들이 왕에게 아람어로[a] 말했습니다. 「왕이시여, 영원히 사십시오[b]. 왕의 종들에게 꿈을 말씀해 주십시오. 그러면 우리가 그 해석을 알려 드리겠습니다[c].」
  rationale: 의미 변경 없이 주석 표지를 각각의 원어 표현에 정확히 연결하고, 왕에게 직접 말하는 문맥에 맞춰 ‘당신의 종들’을 ‘왕의 종들’로 다듬었습니다. ‘영원히 사십시오’는 원문의 관습적 왕실 축원을 직역적으로 보존합니다.
