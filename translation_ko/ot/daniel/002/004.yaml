  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֧וּ הַ/כַּשְׂדִּ֛ים לַ/מֶּ֖לֶךְ אֲרָמִ֑ית מַלְכָּ/א֙ לְ/עָלְמִ֣ין חֱיִ֔י אֱמַ֥ר חֶלְמָ֛/א ל/עבדי/ך וּ/פִשְׁרָ֥/א נְחַוֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/004.yaml
  text: 'Then the Chaldeans spoke to the king in Aramaic: “O king[a], live forever! Tell the dream to your servants[c][b], and we will declare the interpretation.”'
  footnotes:
  - marker: a
    text: Aramaic begins here and continues through Daniel 7:28.
    reason: cross_reference
  - marker: b
    text: Or “may you live forever.”
    reason: lexical_alternative
  - marker: c
    text: Or “we will make known the interpretation.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 갈대아 사람들이 아람어로 왕에게 말했습니다. 「왕이시여, 영원히 사십시오. 꿈을 당신의 종들에게 말씀해 주십시오. 그러면 우리가 그 해석을 알려 드리겠습니다」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 본문은 여기서 시작하여 다니엘 7:28까지 계속됩니다.
    reason: source_note
  - marker: b
    text: 또는 “영원히 사시기를 바랍니다.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “우리가 그 해석을 밝혀 드리겠습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  english_pob_choice: Then ... spoke
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어에서 자연스러운 사건 전환으로 옮기기 위해 ‘그러자’를 사용했습니다.
- source_word: אֲרָמִית
  english_pob_choice: in Aramaic
  chosen_korean: 아람어로
  alternatives_korean:
  - 아람어로 된 말로
  - 아람어로서
  lexicon: HALOT
  rationale: 이 표지는 발화 언어를 가리키며 다니엘서의 아람어 전환을 알리므로, 간결하게 ‘아람어로’로 옮겼습니다.
- source_word: לְעַבְדָךְ
  english_pob_choice: to your servants
  chosen_korean: 당신의 종들에게
  alternatives_korean:
  - 당신의 노예들에게
  - 주인님의 종들에게
  lexicon: HALOT
  rationale: 궁정 예법상 자칭 겸손 표현으로 기능하므로 문맥의 공손한 호칭을 살려 ‘종들’로 옮겼습니다. 다만 법적 예속성 자체를 드러내는 본문은 아니므로 ‘노예’는 채택하지 않았습니다.
- source_word: וּפִשְׁרָא נְחַוֵּא
  english_pob_choice: we will declare the interpretation
  chosen_korean: 우리가 그 해석을 알려 드리겠습니다
  alternatives_korean:
  - 우리가 그 해석을 밝혀 드리겠습니다
  - 우리가 그 해석을 선언하겠습니다
  lexicon: HALOT
  rationale: פשר은 다니엘서의 기술용어로 ‘해석’이 적절하며, נְחַוֵּא는 ‘알려 주다/밝히다’의 뜻이므로 자연스러운 한국어로 ‘알려 드리겠습니다’라고 옮겼습니다.
theological_decisions:
- issue: 왕에게 바치는 상투적 축원 “live forever”의 문체
  chosen_reading: 「왕이시여, 영원히 사십시오」로 옮겨 궁정 축원의 공손한 직접 화법을 살렸습니다.
  alternative_readings:
  - 「왕이시여, 영원히 사시기를 바랍니다」
  - 「왕이시여, 만세이십니다」
  rationale: 히브리/아람어의 축원형 표현을 과도하게 평서문이나 한국식 관용구로 바꾸지 않고, 본문의 예법적 말투를 드러내는 쪽이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 문체/화행 차원의 보존
