  terminology: ‘비밀들을 드러내시는 이’는 아람어 분사구를 서술적으로 반영하는 적절한 표현입니다. 다만 현 각주는 본문에 명시되지 않은 ‘하나님’을 단정적으로 보충하므로, 분사구의 번역 가능성을 설명하는 어휘 각주로 바꾸는 것이 좋습니다.
