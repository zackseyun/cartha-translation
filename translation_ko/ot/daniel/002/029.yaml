  source_fidelity: 첫 절의 ‘이 일 후에’는 원문의 ‘이것 후에’를 대체로 반영하지만, 둘째 절의 ‘그 일에 대해’는 반복되는 ‘무슨 일이 일어날지’를 ‘그 일’로 좁혀 원문의 표현을 충분히 반영하지 못합니다. ‘침상 위에서’도 여기서는 단순한 장소 표현으로 ‘침상에서’가 더 자연스럽습니다.
