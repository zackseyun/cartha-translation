id: DAN.2.29
reference: Daniel 2:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א רַעְיוֹנָ/ךְ֙ עַל מִשְׁכְּבָ֣/ךְ סְלִ֔קוּ מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/גָלֵ֧א רָזַיָּ֛/א הוֹדְעָ֖/ךְ מָה דִ֥י לֶהֱוֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/029.yaml
  text: As for you[a], O king, your thoughts came up on your bed about what would happen after this, and he who reveals mysteries has made known to you what would happen.
  footnotes:
  - marker: a
    text: Or, 'and he who reveals mysteries has made known to you.' The Aramaic participle can be rendered more descriptively rather than as the title 'the Revealer of mysteries.'
    reason: lexical_alternative
translation:
  language: ko
  text: 임금님, 임금님께서 침상에 계실 때 이후에 무슨 일이 일어날지에 관한 생각들이 떠올랐습니다. 그리고 비밀들을 드러내시는 이[a]가 장차 일어날 일을 임금님께 알려 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비밀들을 드러내는 이’. 아람어 분사 표현을 칭호가 아닌 서술적 표현으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה
  english_pob_choice: As for you
  chosen_korean: 임금님
  alternatives_korean:
  - 임금님에 관해 말씀드리자면
  - 당신
  lexicon: HALOT
  rationale: 아람어 독립 인칭대명사의 주제 강조를 한국어에서는 문두 호격으로 자연스럽게 살렸습니다. '임금님에 관해 말씀드리자면'은 의미는 살지만 문장이 지나치게 길어집니다.
- source_word: רַעְיוֹנָךְ
  english_pob_choice: your thoughts
  chosen_korean: 임금님의 생각이
  alternatives_korean:
  - 임금님의 생각들
  - 임금님의 숙고가
  lexicon: HALOT
  rationale: 이 명사는 여기서 마음속에 떠오른 생각들을 가리키므로 '생각'이 가장 자연스럽습니다.
- source_word: סְלִקוּ
  english_pob_choice: came up
  chosen_korean: 떠올랐습니다
  alternatives_korean:
  - 일어났습니다
  - 올라왔습니다
  lexicon: HALOT
  rationale: 직역하면 '올라오다'이지만, '생각'과 결합할 때는 '떠오르다'가 현대 한국어에서 가장 자연스럽고 은유도 유지합니다.
- source_word: וְגָלֵא רָזַיָּא
  english_pob_choice: he who reveals mysteries
  chosen_korean: 비밀들을 드러내시는 이가
  alternatives_korean:
  - 비밀들을 밝히시는 이가
  - 비밀을 드러내시는 분이
  lexicon: HALOT
  rationale: 영어 POB의 후기 판단처럼 이 표현은 명칭보다 분사적 서술로 옮기는 편이 원문에 가깝습니다. '비밀들'은 복수형을 반영해 아람어 복수감을 살렸습니다.
- source_word: הוֹדְעָךְ
  english_pob_choice: has made known to you
  chosen_korean: 임금님께 알려 주셨습니다
  alternatives_korean:
  - 임금님께 알리셨습니다
  - 임금님께 알려 주셨습니다
  lexicon: HALOT
  rationale: '''알려 주다''는 본문처럼 계시의 성격을 자연스럽게 살리며, 화자가 하나님을 높여 말하는 문맥에 맞게 높임말을 사용했습니다.'
theological_decisions:
- issue: 비밀을 드러내시는 분을 제목처럼 처리할지, 서술적으로 처리할지
  chosen_reading: 서술적으로 '비밀들을 드러내시는 이가'로 옮겼습니다.
  alternative_readings:
  - '''비밀들을 드러내시는 분'''
  - '''비밀의 드러내심이 있는 이'''
  rationale: 아람어 분사구는 여기서 하나님을 가리키지만, 본문 자체가 명사형 칭호를 명시하지는 않으므로 서술적 번역이 더 투명합니다. 동시에 계시 주체가 하나님이라는 점은 문맥상 분명하므로 그 신학적 힘은 유지했습니다.
  doctrine_reference: 번역 철학 §§1, 5
