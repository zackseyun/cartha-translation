base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/017.yaml
  text: Then Daniel went to his house and made the matter known to Hananiah[a], Mishael, and Azariah, his companions.
  footnotes:
  - marker: a
    text: Or 'his friends.' The Aramaic term can denote associates or companions closely joined to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다니엘은 자기 집으로 가서 그 일을 그의 동료들인 하나냐와 미사엘과 아사랴에게 알렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그런 다음
  - 그때
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 접속부사로, 현대 한국어에서 자연스럽고 시간 순서를 분명히 드러내는 표현입니다.
- source_word: לְבַיְתֵהּ
  english_pob_choice: to his house
  chosen_korean: 자기 집으로
  alternatives_korean:
  - 자기 집에
  - 자기 घर로
  lexicon: HALOT
  rationale: 방향을 나타내는 ל를 살려 ‘-으로’로 옮기고, בית은 이 문맥에서 ‘집’이 가장 직접적입니다.
- source_word: חַבְרוֹהִי
  english_pob_choice: his companions
  chosen_korean: 자기 동료들
  alternatives_korean:
  - 자기 친구들
  - 자기 साथी들
  lexicon: HALOT
  rationale: 단순한 친목의 ‘친구들’보다, 다니엘과 함께 묶인 동료·동반자의 관계를 더 정확히 담아냅니다.
- source_word: מִלְּתָא הוֹדַע
  english_pob_choice: made the matter known
  chosen_korean: 그 일을 … 알렸습니다
  alternatives_korean:
  - 그 사정을 … 알려 주었습니다
  - 그 문제를 … 알렸습니다
  lexicon: HALOT
  rationale: ‘사물/말/사건’ 범위를 가진 מִלְּתָא는 여기서 구체적 사안이므로, 한국어에서는 자연스럽게 ‘그 일’로 옮기되, causative의 ‘made known’는 ‘알리다’로 살렸습니다.
