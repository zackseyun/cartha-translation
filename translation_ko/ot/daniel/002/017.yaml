    issue: 인명 ‘한냐’의 표기
    rationale: 아람어 חֲנַנְיָה 및 한국어 성경 전통의 통상 음역에 따라 ‘하나냐’가 적절합니다.
  - severity: low
    issue: 대시로 삽입한 ‘자기 동료들에게’의 문장 연결
    rationale: 세 인명은 ‘동료들’의 동격 설명이며 동시에 ‘알리다’의 수혜 대상입니다. 대시 대신 ‘그의 동료들인 …에게’로 처리하면 문법적 관계가 명료하고 현대 한국어에 자연스럽습니다.
  revised_text: 그때 다니엘은 자기 집으로 가서 그 일을 그의 동료들인 하나냐와 미사엘과 아사랴에게 알렸습니다.
