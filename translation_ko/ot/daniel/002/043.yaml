id: DAN.2.43
reference: Daniel 2:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: די חֲזַ֗יְתָ פַּרְזְלָ/א֙ מְעָרַב֙ בַּ/חֲסַ֣ף טִינָ֔/א מִתְעָרְבִ֤ין לֶהֱוֺן֙ בִּ/זְרַ֣ע אֲנָשָׁ֔/א וְ/לָֽא לֶהֱוֺ֥ן דָּבְקִ֖ין דְּנָ֣ה עִם דְּנָ֑ה הֵֽא כְ/דִ֣י פַרְזְלָ֔/א לָ֥א מִתְעָרַ֖ב עִם חַסְפָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/043.yaml
  text: As you saw the iron mixed with clay[a], they will mix themselves with the seed of man, but they will not hold together, this one with that one[c][b], just as iron does not mix with pottery.
  footnotes:
  - marker: a
    text: Or 'with human seed'; many interpreters understand this as 'they will intermarry,' but the Aramaic is more literally 'they will mix themselves with the seed of man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'one with another.'
    reason: lexical_alternative
  - marker: c
    text: The final term can also be rendered 'clay' or 'earthenware.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 철이 진흙[a]과 섞인 것을 본 것처럼, 그들은 사람의 씨와 섞일 것입니다. 그러나 이것이 저것[b]과 서로 붙어 있지 못할 것입니다. 철이 질그릇[c]과 섞이지 않는 것과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 씨와 함께’; 많은 해석자는 이를 ‘서로 통혼할 것’으로 이해하지만, 아람어는 더 문자적으로 ‘사람의 씨와 섞일 것’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘서로’.
    reason: alternative_reading
  - marker: c
    text: 여기서 마지막 용어는 ‘진흙’ 또는 ‘토기’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעָרַב / מִתְעָרְבִין
  english_pob_choice: mixed / they will mix themselves
  chosen_korean: 섞인 / 섞일 것입니다
  alternatives_korean:
  - 뒤섞인 / 뒤섞일 것입니다
  - 혼합된 / 혼합될 것입니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살리기 위해 단순 수동보다 “섞일 것입니다”를 택했습니다. '섞다'는 현대 한국어에서 자연스럽고 물질 이미지도 유지합니다.
- source_word: בִּזְרַע אֲנָשָׁא
  english_pob_choice: with the seed of man
  chosen_korean: 사람의 씨
  alternatives_korean:
  - 인간의 씨
  - 사람의 자손
  - 사람의 씨앗
  lexicon: HALOT
  rationale: 직역하면 ‘사람의 씨’로, POB가 유지한 모호성과 원문 이미지를 살렸습니다. ‘씨앗’은 한국어에서 비유가 다소 약해져 ‘씨’를 택했습니다.
- source_word: דָּבְקִין
  english_pob_choice: hold together
  chosen_korean: 서로 붙어 있지 못할 것입니다
  alternatives_korean:
  - 붙어 있지 못할 것입니다
  - 달라붙지 못할 것입니다
  - 결합하지 못할 것입니다
  lexicon: HALOT
  rationale: 문맥상 물질들이 구조적으로 견디지 못한다는 뜻이므로, 추상적 '결합'보다 ‘서로 붙어 있지 못하다’가 자연스럽고 의미를 잘 드러냅니다.
- source_word: דְּנָה עִם דְּנָה
  english_pob_choice: this one with that one
  chosen_korean: 이쪽과 저쪽
  alternatives_korean:
  - 이것과 저것
  - 이것이 저것과
  - 이쪽과 저쪽이
  lexicon: HALOT
  rationale: 쌍을 이루는 지시어의 분배적 대조를 살리기 위해 매끈한 관용구보다 ‘이쪽과 저쪽’을 선택했습니다.
- source_word: חַסְפָּא
  english_pob_choice: pottery
  chosen_korean: 진흙 그릇
  alternatives_korean:
  - 토기
  - 도기
  - 질그릇
  lexicon: HALOT
  rationale: ‘pottery’는 단순한 흙이 아니라 구워 만든 취약한 그릇류를 가리키므로, 한국어에서는 이미지가 분명한 ‘진흙 그릇’으로 옮겼습니다.
theological_decisions:
- issue: ‘they will mix themselves with the seed of man’의 해석을 한국어에서 얼마나 구체화할지
  chosen_reading: ‘그들은 사람의 씨와 섞일 것입니다’로 두어, 혼인/혼합에 대한 특정 해석을 본문 안에 확정하지 않았습니다.
  alternative_readings:
  - 그들은 서로 통혼할 것입니다
  - 그들은 인간 사회와 뒤섞일 것입니다
  - 그들은 사람들과 섞여 들어갈 것입니다
  rationale: 아람어 표현은 해석이 갈리는 난구이므로, 본문이 직접 말하는 범위를 넘는 특정 역사적·종말론적 도식을 한국어 본문에 주입하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
