  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 각주는 논쟁적 구절인 ‘내 말이 확정되었습니다’에 직접 붙여야 독자가 대안 독법의 적용 범위를 혼동하지 않습니다. ‘찢어질’보다 ‘찢길’이 처벌을 당하는 수동의 뜻을 조금 더 분명히 합니다.
  terminology: ‘왕’, ‘갈대아 사람들’, ‘꿈’, ‘해석’, ‘사지’, ‘거름더미’는 문맥과 문체에 적절합니다. ‘거름더미’는 수치스럽게 황폐해진 집의 이미지를 보존합니다.
