  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר ל/כשדי/א מִלְּתָ֖/א מִנִּ֣/י אַזְדָּ֑א הֵ֣ן לָ֤א תְהֽוֹדְעוּנַּ֨/נִי֙ חֶלְמָ֣/א וּ/פִשְׁרֵ֔/הּ הַדָּמִין֙ תִּתְעַבְד֔וּן וּ/בָתֵּי/כ֖וֹן נְוָלִ֥י יִתְּשָׂמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/005.yaml
  text: 'The king answered and said to the Chaldeans[a], “The word from me is firm: if you do not make known to me the dream and its interpretation, you will be made into limbs[b], and your houses will be made a refuse heap.”'
  footnotes:
  - marker: a
    text: Or, “The word has gone out from me.”
    reason: alternative_reading
  - marker: b
    text: Traditionally, “you will be made into pieces.” The Aramaic term is more literally “limbs” or “members,” implying dismemberment.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 갈대아 사람들에게 대답하며 말했습니다. 「내 말이 확정되었습니다. 너희가 내게 꿈과 그 해석을 알려 주지 않으면, 너희는 사지가 찢어질 것이며 너희 집은 거름더미가 될 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 “내게서 말이 나갔습니다”라는 뜻으로도 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְכָּא
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 국왕
  lexicon: HALOT
  rationale: 왕권을 가리키는 가장 자연스러운 현대 한국어로 옮기되, 서사체의 간결함을 유지했습니다.
- source_word: לכשדיא
  english_pob_choice: to the Chaldeans
  chosen_korean: 갈대아 사람들에게
  alternatives_korean:
  - 갈대아인들에게
  - 점성가들에게
  lexicon: HALOT
  rationale: 문맥상 관원 집단이지만, 어형이 가리키는 민족/집단 명칭을 우선 보존해 원문 표지를 살렸습니다.
- source_word: מִלְּתָא מִנִּי אַזְדָּא
  english_pob_choice: The word from me is firm
  chosen_korean: 내 말이 확정되었습니다
  alternatives_korean:
  - 내게서 나온 말입니다
  - 내 말은 굳게 섰습니다
  lexicon: HALOT
  rationale: 논쟁적인 구절이지만, 바로 뒤의 위협이 왕의 결정이 번복되지 않음을 드러내므로 ‘확정되다’로 옮겨 의미를 분명히 했습니다.
- source_word: הַדָּמִין
  english_pob_choice: you will be made into limbs
  chosen_korean: 사지가 찢어질 것이며
  alternatives_korean:
  - 조각나게 될 것이며
  - 사지로 만들어질 것이며
  lexicon: HALOT
  rationale: 직역하면 ‘사지/팔다리’이므로, 전통적 완곡어법보다 신체 훼손의 이미지를 분명히 드러내는 표현을 택했습니다.
- source_word: נְוָלִי
  english_pob_choice: a refuse heap
  chosen_korean: 거름더미
  alternatives_korean:
  - 쓰레기더미
  - 오물더미
  lexicon: HALOT
  rationale: 전통 번역의 ‘dunghill’에 가까운 낮고 수치스러운 폐허의 이미지를 살리기 위해 현대어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 왕의 위협적 발언을 담는 서술의 강도
  chosen_reading: 원문의 폭력성과 수치를 약화하지 않고, ‘사지가 찢어질’이라는 직접적 표현을 유지했습니다.
  alternative_readings:
  - 전통적으로 완곡하게 ‘조각나게 될 것’으로 완화하기
  - ‘토막날 것’처럼 일반화하기
  rationale: 본문은 단순한 처벌이 아니라 신체 절단의 위협을 드러내므로, 독자가 그 공포를 그대로 이해하도록 보다 직설적으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: מִלְּתָא מִנִּי אַזְדָּא의 의미 확정
  chosen_reading: ‘내 말이 확정되었습니다’로 이해해 왕의 결정의 불가역성을 드러냈습니다.
  alternative_readings:
  - ‘내게서 말이 나갔습니다’
  - ‘내 말이 굳게 섰습니다’
  rationale: 문맥상 핵심은 왕의 요구와 위협이 단호하고 되돌릴 수 없다는 점이므로, 그 기능을 가장 분명히 전달하는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
