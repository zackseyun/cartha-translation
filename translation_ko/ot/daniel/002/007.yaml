source:
  edition: WLC
  text: עֲנ֥וֹ תִנְיָנ֖וּת וְ/אָמְרִ֑ין מַלְכָּ֕/א חֶלְמָ֛/א יֵאמַ֥ר לְ/עַבְד֖וֹ/הִי וּ/פִשְׁרָ֥/ה נְהַחֲוֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/007.yaml
  text: They answered a second time and said[a], “Let the king tell the dream to his servants[b], and we will show the interpretation.”
  footnotes:
  - marker: a
    text: Or 'again.' The Aramaic adverb more specifically means 'a second time.'
    reason: lexical_alternative
  - marker: b
    text: Or 'we will make known its interpretation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 두 번째로 대답하며 말했습니다[a], “왕께서 그 꿈을 당신의 종들에게 말씀해 주십시오. 그러면 우리가 그 해석을 보여 드리겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시’. 아람어 부사는 더 구체적으로 ‘두 번째로’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 그것의 해석을 알려 드리겠습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ תִנְיָנ֖וּת
  english_pob_choice: They answered a second time
  chosen_korean: 두 번째로 대답하며
  alternatives_korean:
  - 다시 대답하며
  - 두 번째로 응답하며
  lexicon: HALOT
  rationale: 아람어 부사의 ‘두 번째로’라는 시간적 뉘앙스를 살려 ‘두 번째로’로 옮겼고, 서술 흐름상 ‘대답하며’가 자연스럽습니다.
- source_word: מַלְכָּא
  english_pob_choice: the king
  chosen_korean: 왕께서
  alternatives_korean:
  - 왕이
  - 임금께서
  lexicon: HALOT
  rationale: 여기서는 직접 호칭이 아니라 ‘말씀해 주십시오’의 주어이므로, 존칭 주어인 ‘왕께서’가 문맥에 맞습니다.
- source_word: לְעַבְדֹוהִי
  english_pob_choice: to his servants
  chosen_korean: 당신의 종들에게
  alternatives_korean:
  - 그의 신하들에게
  - 그의 종들에게
  lexicon: HALOT
  rationale: 궁정 맥락에서는 ‘종들’이 문자적 의미를 유지하면서도 한국어에서 자연스럽고, 왕에게 직접 말하는 예의상 2인칭 높임을 반영해 ‘당신의’로 풀었습니다.
- source_word: וּפִשְׁרָה נְהַחֲוֵה
  english_pob_choice: and we will show the interpretation
  chosen_korean: 그러면 우리가 그 해석을 보여 드리겠습니다
  alternatives_korean:
  - 그러면 우리가 그 해석을 알려 드리겠습니다
  - 그러면 우리가 해석을 밝혀 드리겠습니다
  lexicon: HALOT
  rationale: פשר는 꿈의 ‘해석’이므로 ‘의미’보다 정확하고, חוה의 사역적 의미를 살려 ‘보여 드리겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 왕에게 말하는 직접 화법의 높임 표현
  chosen_reading: 직접 인용 안에서는 왕에게 ‘말씀해 주십시오’, ‘보여 드리겠습니다’처럼 높임을 사용했습니다.
  alternative_readings:
  - 평서형으로 중립적으로 옮김
  - 더 고전적인 궁중체 사용
  rationale: 아람어 본문은 공손한 궁정 대화이므로, 현대 한국어에서도 예의를 분명히 드러내는 합쇼체가 본문 효과를 가장 잘 살립니다.
  doctrine_reference: 번역 스타일 결정
