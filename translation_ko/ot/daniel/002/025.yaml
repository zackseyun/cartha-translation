id: DAN.2.25
reference: Daniel 2:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱדַ֤יִן אַרְיוֹךְ֙ בְּ/הִתְבְּהָלָ֔ה הַנְעֵ֥ל לְ/דָנִיֵּ֖אל קֳדָ֣ם מַלְכָּ֑/א וְ/כֵ֣ן אֲמַר לֵ֗/הּ דִּֽי הַשְׁכַּ֤חַת גְּבַר֙ מִן בְּנֵ֤י גָֽלוּתָ/א֙ דִּ֣י יְה֔וּד דִּ֥י פִשְׁרָ֖/א לְ/מַלְכָּ֥/א יְהוֹדַֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/025.yaml
  text: Then Arioch hurriedly brought Daniel before the king and said to him[a], “I have found a man from among the exiles of Judah who will make the interpretation known to the king.”
  footnotes:
  - marker: a
    text: Or “of the Jews” or “Judean.” The Aramaic identifies Daniel as belonging to the people of Judah in exile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아리옥이 급히 다니엘을 왕 앞에 데리고 가서 왕에게 이렇게 말했습니다. 「저는 유다 출신 포로들[a] 가운데 한 사람을 찾아냈는데, 그가 왕께 해석을 알려 드릴 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인’ 또는 ‘유다 사람’으로도 옮길 수 있습니다. 아람어는 다니엘이 유다 출신의 포로 공동체에 속한 사람임을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그러자
  - 그런 다음
  lexicon: HALOT
  rationale: 서사 전개를 잇는 담화 표지로서 한국어에서는 자연스러운 시간 연결 표현인 ‘그때’가 적절합니다.
- source_word: בְּהִתְבְּהָלָה
  english_pob_choice: hurriedly
  chosen_korean: 급히
  alternatives_korean:
  - 서둘러
  - 허둥지둥
  lexicon: HALOT
  rationale: 긴박한 속도를 나타내며, 아리옥이 즉시 움직이는 장면에 맞게 ‘급히’가 가장 간결합니다.
- source_word: הַנְעֵל
  english_pob_choice: brought
  chosen_korean: 데리고 가서
  alternatives_korean:
  - 데려가서
  - 끌고 가서
  lexicon: HALOT
  rationale: 왕 앞에 인도하는 공적 장면이므로 단순한 ‘가져오다’보다 사람을 함께 데려가는 뉘앙스를 살렸습니다.
- source_word: מִן בְּנֵי גָלוּתָא
  english_pob_choice: from among the exiles
  chosen_korean: 유다 포로들 가운데
  alternatives_korean:
  - 유다의 포로들 가운데
  - 유다 사람들 가운데 포로가 된 이들
  lexicon: HALOT
  rationale: ‘포로/유배 상태에 있는 사람들’이라는 집단성을 살리되, 한국어에서 자연스럽게 읽히도록 정리했습니다.
- source_word: דִּי יְהוּד
  english_pob_choice: of Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다인의
  - 유다 사람
  - 유대인의
  lexicon: HALOT
  rationale: 아람어의 지시 표현은 출신과 소속을 가리키므로, 문맥상 가장 직접적인 ‘유다’로 옮겼습니다. ‘유대인’은 후대적 종교·민족 개념을 덧붙일 수 있어 피했습니다.
- source_word: פִשְׁרָא
  english_pob_choice: the interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 풀이
  - 설명
  lexicon: HALOT
  rationale: 다니엘서의 꿈/비밀 풀이 문맥에서는 기술어로서 ‘해석’이 가장 안정적입니다.
- source_word: יְהוֹדַע
  english_pob_choice: will make ... known
  chosen_korean: 알려 드릴 것입니다
  alternatives_korean:
  - 알게 할 것입니다
  - 밝힐 것입니다
  lexicon: HALOT
  rationale: 목적어가 왕이므로 공손한 간접화법으로 처리해, ‘해석을 왕께 알리다’는 의미를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 다니엘의 민족/출신 표지 דִּי יְהוּד의 번역
  chosen_reading: ‘유다’로 옮겨, 포로 공동체 안의 출신 표지를 드러냈습니다.
  alternative_readings:
  - ‘유대인’
  - ‘유다 사람’
  - ‘유다 사람들 가운데’
  rationale: 이 구절은 신학적 논쟁어가 아니라 포로 귀환 이전의 역사적 식별입니다. ‘유다’는 본문이 말하는 집단 소속을 과장 없이 보여 줍니다.
  doctrine_reference: 번역 원칙 §1, §4
- issue: 왕에게 말하는 궁정 서술의 높임말 처리
  chosen_reading: 서술체는 합쇼체를 유지하되, 왕에게 향하는 말은 간접 높임으로 ‘알려 드릴 것입니다’로 옮겼습니다.
  alternative_readings:
  - 직접적으로 ‘알릴 것입니다’
  - 더 격식 있는 ‘고하겠습니다’
  rationale: 원문의 궁정 공손성을 살리면서도 현대 한국어 독자가 자연스럽게 이해할 수 있는 수준의 높임을 유지했습니다.
  doctrine_reference: Korean target style
