  naturalness: 합쇼체 서술과 왕을 향한 직접 발화의 높임말은 자연스럽습니다. 다만 ‘그에게 말했습니다’는 선행하는 왕을 가리키지만, ‘왕에게 이렇게 말했습니다’가 궁정 장면에서 더 명료하고 자연스럽습니다.
  terminology: ‘아리옥’, ‘다니엘’, ‘왕’, ‘해석’은 적절합니다. ‘유다 출신 포로들’은 역사적·민족적 표지를 과도하게 현대화하지 않으면서도 한국어 문장 안에서 자연스럽게 전달합니다. 각주 표지는 해당 표현 바로 뒤에 두는 것이 대안이 무엇을 받는지 명확하게 합니다.
