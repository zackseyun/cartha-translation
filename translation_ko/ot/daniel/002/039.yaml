id: DAN.2.39
reference: Daniel 2:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָתְרָ֗/ךְ תְּק֛וּם מַלְכ֥וּ אָחֳרִ֖י ארע/א מִנָּ֑/ךְ וּ/מַלְכ֨וּ תליתיא אָחֳרִי֙ דִּ֣י נְחָשָׁ֔/א דִּ֥י תִשְׁלַ֖ט בְּ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/039.yaml
  text: And after you another kingdom[a], inferior to yours, will arise; and yet a third kingdom, of bronze[b], which will rule over all the earth.
  footnotes:
  - marker: a
    text: Or 'lower than you.' The Aramaic expression is difficult; the sense is that the next kingdom is less than Nebuchadnezzar's kingdom in rank or splendor.
    reason: lexical_alternative
  - marker: b
    text: Or 'over the whole land.' The term can mean either 'earth' or 'land,' but here likely refers to broad imperial dominion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신 뒤에 당신보다 못한 다른 나라가 일어날 것입니다. 그리고 또 셋째 나라는 구리로 된 나라로, 그것이 온 땅을 다스릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신보다 못한’은 히브리/아람어의 난해한 비교 표현을 문맥상 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 땅’은 ‘땅/나라’ 모두 가능한 ארעָא의 의미를 문맥상 제국적 보편 지배로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתְרָךְ תְּקוּם
  english_pob_choice: And after you ... will arise
  chosen_korean: 그리고 당신 뒤에 ... 일어날 것입니다
  alternatives_korean:
  - 당신 뒤에 ... 일어날 것입니다
  - 그리고 당신 뒤에 ... 세워질 것입니다
  lexicon: HALOT
  rationale: 시간적 계승을 나타내는 표현이므로 ‘당신 뒤에’로 옮기고, 통치권의 등장과 성립을 자연스럽게 드러내기 위해 ‘일어날 것입니다’를 선택했습니다.
- source_word: אַרעָא מִנָּךְ
  english_pob_choice: inferior to yours
  chosen_korean: 당신보다 못한
  alternatives_korean:
  - 당신보다 낮은
  - 당신보다 열등한
  lexicon: HALOT
  rationale: 문맥상 나라는 느부갓네살의 나라보다 위세와 영광이 낮다는 비교이므로, 직역 어감을 유지하면서도 현대 한국어에서 자연스러운 ‘당신보다 못한’으로 옮겼습니다.
- source_word: נְחָשָׁא
  english_pob_choice: of bronze
  chosen_korean: 구리로 된
  alternatives_korean:
  - 청동으로 된
  - 놋으로 된
  lexicon: HALOT
  rationale: 사전상 금속 명칭의 대응은 가능하지만, 한국어 성경에서 본문 이미지와 잘 이어지는 표준적 금속 표현을 위해 ‘구리로 된’을 택했습니다.
- source_word: דִּי תִשְׁלַט בְּכָל אַרְעָא
  english_pob_choice: which will rule over all the earth
  chosen_korean: 그것이 온 땅을 다스릴 것입니다
  alternatives_korean:
  - 그것이 온 땅을 통치할 것입니다
  - 그것이 온 땅 위에 군림할 것입니다
  lexicon: HALOT
  rationale: 다스림의 의미를 보존하면서도 현대 독자가 이해하기 쉬운 동사 ‘다스릴 것입니다’를 사용했고, 범위는 POB의 ‘all the earth’에 맞춰 ‘온 땅’으로 옮겼습니다.
theological_decisions:
- issue: 'אַרעָא의 범위: ‘땅’인가 ‘나라/세상’인가'
  chosen_reading: ‘온 땅’으로 두어 제국적 보편 지배의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘온 나라’
  - ‘세상 전체’
  rationale: 다니엘 2장의 상징적 제국 언어에서는 אַרעָא가 단순한 지리적 땅보다 광범위한 지배 영역을 가리킬 수 있으므로, 본문의 과장된 세계통치 이미지를 드러내는 번역이 적절합니다.
  doctrine_reference: Daniel 2:39 문맥의 제국 상징과 문학적 과장
