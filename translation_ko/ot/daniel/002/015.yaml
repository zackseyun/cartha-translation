    issue: ‘왕 앞에서’가 칙령의 발원/권위를 나타내는 아람어 관용구를 부정확하고 어색하게 연결합니다.
    rationale: מִן קֳדָם מַלְכָּא는 ‘왕에게서/왕의 권위로부터’라는 뜻이며, ‘왕 앞에서’는 한국어에서 행위의 장소처럼 이해됩니다.
  - severity: high
    issue: 기존 각주 a와 b가 본문 표지 및 원문 어구에 부합하지 않습니다.
