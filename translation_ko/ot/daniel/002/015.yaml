id: DAN.2.15
reference: Daniel 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָנֵ֣ה וְ/אָמַ֗ר לְ/אַרְיוֹךְ֙ שַׁלִּיטָ֣/א דִֽי מַלְכָּ֔/א עַל מָ֥ה דָתָ֛/א מְהַחְצְפָ֖ה מִן קֳדָ֣ם מַלְכָּ֑/א אֱדַ֣יִן מִלְּתָ֔/א הוֹדַ֥ע אַרְי֖וֹךְ לְ/דָנִיֵּֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/015.yaml
  text: He answered and said to Arioch[a], the king’s commander[b], “Why is the decree so harsh from before the king?” Then Arioch made the matter known to Daniel.
  footnotes:
  - marker: a
    text: Or “so harsh,” “so severe,” or “so hasty” for “so urgent.” The Aramaic term conveys pressing severity; the context favors the sense of haste in carrying out the king’s decree.
    reason: lexical_alternative
  - marker: b
    text: Literally “from before the king,” an Aramaic idiom meaning that the decree came from the king’s presence or authority.
    reason: cultural_note
translation:
  language: ko
  text: 그가 아리옥[a], 곧 왕의 지휘관[b]에게 말했습니다. “왕 앞에서 어찌하여 이 칙령이 이처럼 급합니까?” 그러자 아리옥이 그 일을 다니엘에게 알려 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아리옥에게”.
    reason: source_note
  - marker: b
    text: 직역하면 “왕의 앞에 있는 왕의 지휘관”이라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  english_pob_choice: He answered and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 대답하여 말했습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 히브리/아람어의 관용적 서술 결합이지만 한국어에서는 중복을 줄여 자연스럽게 한 동작으로 옮겼습니다.
- source_word: שַׁלִּיטָא דִי מַלְכָּא
  english_pob_choice: the king’s commander
  chosen_korean: 왕의 지휘관
  alternatives_korean:
  - 왕의 사령관
  - 왕의 관리
  - 왕의 군관
  lexicon: HALOT
  rationale: 아리옥의 직분이 왕명을 집행하는 권위 있는 군사·행정 책임자이므로, 현대 한국어에서 가장 무난한 기능어로 ‘지휘관’을 택했습니다.
- source_word: מְהַחְצְפָה
  english_pob_choice: so urgent
  chosen_korean: 이처럼 급합니까
  alternatives_korean:
  - 이처럼 심합니까
  - 이처럼 가혹합니까
  - 이처럼 서둘립니까
  lexicon: HALOT
  rationale: POB의 본문은 ‘urgent’를 채택했으나 주석은 ‘harsh/severe/hasty’의 의미 범위를 인정합니다. 한국어 본문에서는 문맥상 제재 집행의 다급함을 살려 ‘급하다’로 옮기되, 의미 범위를 과도하게 좁히지 않았습니다.
- source_word: מִן קֳדָם מַלְכָּא
  english_pob_choice: from before the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕 앞에서부터
  - 왕의 면전에서
  - 왕에게서
  lexicon: HALOT
  rationale: 아람어 관용구의 핵심인 ‘왕의 앞/권위 아래’라는 뜻을 한국어 관용 표현으로 자연스럽게 살렸습니다.
