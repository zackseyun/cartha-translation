  naturalness: 합쇼체 기도문으로 ‘하나님이시여’와 ‘감사하고 찬양합니다’를 사용하면 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 배치하여 참조 대상이 분명하게 했습니다.
  terminology: ‘내 조상들의 하나님’은 아람어의 ‘내 아버지들의 하나님’이라는 관용적 계보 표현을 현대 한국어로 자연스럽게 반영합니다. גְבוּרְתָא는 ‘능력’, מִלָּה는 문맥상 넓은 뜻의 ‘일’로 유지하여 과도한 해석을 피했습니다.
