source:
  edition: WLC
  text: לָ֣/ךְ אֱלָ֣הּ אֲבָהָתִ֗/י מְהוֹדֵ֤א וּ/מְשַׁבַּח֙ אֲנָ֔ה דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א יְהַ֣בְתְּ לִ֑/י וּ/כְעַ֤ן הֽוֹדַעְתַּ֨/נִי֙ דִּֽי בְעֵ֣ינָא מִנָּ֔/ךְ דִּֽי מִלַּ֥ת מַלְכָּ֖/א הוֹדַעְתֶּֽ/נָא׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/023.yaml
  text: To you[a], O God of my fathers, I give thanks and praise, because you have given me wisdom and might, and now you have made known to me what we requested from you[c][b], for you have made known to us the king’s matter.
  footnotes:
  - marker: a
    text: Or 'God of my ancestors.' The Aramaic is literally 'God of my fathers,' a covenantal expression linking Daniel to those before him.
    reason: lexical_alternative
  - marker: b
    text: Or 'what we sought from you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the king’s word' or 'the king’s affair.' The Aramaic term is broad and refers to the matter the king had set forth.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 감사합니다. 내 조상들의 하나님이여, 제가 주님께 감사하고 찬양합니다. 주님께서 제게 지혜와 능력을 주셨고, 이제 우리가 주님께 구한 것을 알게 하셨으며, 왕의 문제를 우리에게 알려 주셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 조상들의 하나님’은 아람어의 직역에 가깝고, ‘내 아버지들의 하나님’ 또는 ‘내 조상들의 하나님’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구한’은 ‘요청한’ 또는 ‘찾은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘왕의 문제’는 ‘왕의 말’ 또는 ‘왕의 사안’까지 포괄할 수 있는 넓은 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהּ אֲבָהָתִי
  english_pob_choice: O God of my fathers
  chosen_korean: 내 조상들의 하나님이여
  alternatives_korean:
  - 내 아버지들의 하나님이여
  - 조상들의 하나님이여
  lexicon: HALOT
  rationale: 아람어 직역은 ‘내 아버지들/조상들의 하나님’이며, 한국어에서는 ‘조상들’이 세대적·언약적 연속성을 자연스럽게 드러내어 본문의 호칭을 보존합니다.
- source_word: מְהוֹדֵא וּמְשַׁבַּח אֲנָה
  english_pob_choice: I give thanks and praise
  chosen_korean: 감사하고 찬양합니다
  alternatives_korean:
  - 감사하며 찬양합니다
  - 감사와 찬양을 드립니다
  lexicon: HALOT
  rationale: 두 분사적 동작을 한국어로 자연스럽게 살려, 단순한 감정이 아니라 실제로 ‘감사하고 찬양하는’ 행위를 분명히 표현했습니다.
- source_word: חָכְמְתָא וּגְבוּרְתָא
  english_pob_choice: wisdom and might
  chosen_korean: 지혜와 능력
  alternatives_korean:
  - 지혜와 권능
  - 지혜와 힘
  lexicon: HALOT
  rationale: 지혜와 짝을 이루는 גְבוּרְתָא는 전투적 ‘힘’보다 하나님이 주시는 ‘능력’이 더 넓고 자연스러워, 본문의 높임말적 기조를 유지합니다.
- source_word: בְעֵינָא מִנָּךְ
  english_pob_choice: what we asked from you
  chosen_korean: 우리가 주님께 구한 것
  alternatives_korean:
  - 우리가 주님께 요청한 것
  - 우리가 주님께 바란 것
  lexicon: HALOT
  rationale: 본문은 1인칭 복수로 공동체적 간구를 가리키므로 ‘우리가’와 ‘구한 것’을 살려, 다니엘과 동료들의 기도를 반영했습니다.
- source_word: מִלַּת מַלְכָּא
  english_pob_choice: the king’s matter
  chosen_korean: 왕의 문제
  alternatives_korean:
  - 왕의 일
  - 왕의 사안
  - 왕의 말
  lexicon: HALOT
  rationale: 아람어 מִלָּה는 ‘말’만이 아니라 ‘문제/사안’까지 포괄하므로, 여기서는 왕이 제기한 꿈의 본질을 드러내는 ‘문제’가 가장 무난합니다.
theological_decisions:
- issue: 첫 문장의 경배 호칭을 한국어에서 어떻게 살릴 것인가
  chosen_reading: 내 조상들의 하나님이여
  alternative_readings:
  - 내 아버지들의 하나님이여
  - 조상들의 하나님이여
  rationale: 이 호칭은 단순한 소유격이 아니라 이스라엘의 언약적 연속성을 부르는 표현입니다. 한국어에서는 ‘조상들’이 혈연적·역사적 연속을 함께 살립니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 복수형 간구와 응답을 유지할 것인가
  chosen_reading: 우리가 주님께 구한 것 ... 우리에게 알려 주셨습니다
  alternative_readings:
  - 제가 주님께 구한 것 ... 제게 알려 주셨습니다
  rationale: 아람어는 분명히 1인칭 복수로 전환합니다. 이를 살려야 다니엘이 동료들과 함께 드린 기도의 공동체성이 유지됩니다.
  doctrine_reference: Translation philosophy §1, §5
