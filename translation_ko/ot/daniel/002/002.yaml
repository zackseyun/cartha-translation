reference: Daniel 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ֠/מֶּלֶךְ לִ/קְרֹ֨א לַֽ/חַרְטֻמִּ֜ים וְ/לָֽ/אַשָּׁפִ֗ים וְ/לַֽ/מְכַשְּׁפִים֙ וְ/לַ/כַּשְׂדִּ֔ים לְ/הַגִּ֥יד לַ/מֶּ֖לֶךְ חֲלֹמֹתָ֑י/ו וַ/יָּבֹ֕אוּ וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/002.yaml
  text: Then the king ordered the magicians[a], the enchanters, the sorcerers, and the Chaldeans to tell the king his dreams[b]. So they came and stood before the king.
  footnotes:
  - marker: a
    text: '''Chaldeans'' may refer either to the ethnic Chaldeans or, in this context, to a class of Babylonian court wise men.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew literally says 'the king said to call,' an idiom meaning that he gave the order to summon them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 점쟁이들[a]과 술객들과 주술사들과 갈대 사람들을 불러다가, 자기의 꿈들을 왕에게 알려 달라고 명령했습니다[b]. 그러자 그들이 와서 왕 앞에 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대 사람들’은 이 문맥에서 민족 집단을 가리킬 수도 있고, 바빌론 궁정의 지혜자 집단을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘왕이 부르라고 말했다’는 식의 관용구로, 실제 의미는 그들을 소집하라는 왕의 명령입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִקְרֹא
  english_pob_choice: ordered ... [them]
  chosen_korean: 불러다가 ... 명령했습니다
  alternatives_korean:
  - 소집하라고 했습니다
  - 불러오라고 했습니다
  lexicon: HALOT
  rationale: ‘말하다’의 직역보다, 왕의 지시가 담긴 관용구로 읽어 한국어에서는 ‘불러다가 명령했습니다’가 원문의 명령적 힘을 자연스럽게 드러냅니다.
- source_word: חַרְטֻמִּים
  english_pob_choice: magicians
  chosen_korean: 점쟁이들
  alternatives_korean:
  - 마술사들
  - 박수들
  lexicon: HALOT
  rationale: 바빌론 궁정의 점술·주술 전문직을 가리키므로, 현대 한국어에서 기능을 드러내는 ‘점쟁이들’이 문맥상 가장 바로 이해됩니다.
- source_word: אַשָּׁפִים / מְכַשְּׁפִים
  english_pob_choice: enchanters / sorcerers
  chosen_korean: 술객들과 주술사들
  alternatives_korean:
  - 주술사들과 마법사들
  - 마술을 부리는 자들과 주술사들
  lexicon: HALOT
  rationale: 두 용어가 모두 초자연적 기술자 계열이지만 서로 같은 말로 평평해지지 않도록, 보다 넓은 ‘술객들’과 직접적인 ‘주술사들’로 구별해 옮겼습니다.
- source_word: כַּשְׂדִּים
  english_pob_choice: Chaldeans
  chosen_korean: 갈대 사람들
  alternatives_korean:
  - 갈대아인들
  - 갈대아 현자들
  lexicon: HALOT
  rationale: 이 단어는 민족명일 수도 있고 궁정 지혜자 집단일 수도 있으므로, 영어 POB의 각주처럼 번역어는 본문에서 중립적으로 두고 주석 여지를 남겼습니다.
- source_word: חֲלֹמֹתָיו
  english_pob_choice: his dreams
  chosen_korean: 자기의 꿈들을
  alternatives_korean:
  - 그의 꿈들을
  - 왕의 꿈들을
  lexicon: HALOT
  rationale: 어미의 인칭을 살리면서도 바로 앞의 왕을 분명히 가리키도록 ‘자기의’로 풀었습니다. 복수형도 그대로 반영해 ‘꿈들’로 옮겼습니다.
theological_decisions:
- issue: 궁정 점술가 명칭의 번역 강도
  chosen_reading: 본문의 직업군 성격을 살려 ‘점쟁이들, 술객들, 주술사들’처럼 기능 중심으로 옮겼습니다.
  alternative_readings:
  - 전통교회식으로 ‘박수, 술객, 술사’로 통일하는 읽기
  - 중립적으로 ‘마술사, 주술사’로만 번역하는 읽기
  rationale: 다니엘서의 바벨론 궁정 맥락에서는 단순한 직함보다 점술·주술 전문성을 드러내는 것이 독자의 이해에 더 직접적이며, 동시에 원문의 다층적 구분도 보존합니다.
  doctrine_reference: 문맥적 어휘 선택; 단어 의미역 유지
