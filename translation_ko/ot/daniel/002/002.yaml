    rationale: 한국어 재귀 소유 표현 ‘자기의’는 가까운 복수 명사구인 소집 대상자들과 연결되어 읽힐 여지가 있습니다. ‘왕의 꿈들을 왕에게’로 명시하는 편이 원문의 소유 관계를 정확히 보존합니다.
