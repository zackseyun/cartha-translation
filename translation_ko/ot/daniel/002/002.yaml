    rationale: ‘갈대’(reed)는 כַּשְׂדִּים의 음역이나 통용 지명이 아닙니다. ‘갈대아인들’로 고쳐야 하며, 문맥상 궁정 지혜자 계층을 뜻할 가능성은 각주에서 밝혀야 합니다.
  - severity: medium
