  source_fidelity: 수정이 필요합니다. כַּשְׂדִּים은 ‘갈대 사람들’이 아니라 고유 지명·민족명인 ‘갈대아인들’(또는 ‘갈대아 사람들’)로 옮겨야 합니다. 또한 원문은 그들이 왕에게 왕 자신의 꿈들을 알리게 하려는 소집·명령을 말하므로, 수혜·소유 관계가 분명하게 드러나야 합니다.
  naturalness: ‘불러다가 … 알려 달라고 명령했습니다’는 ‘알려 달라’가 요청처럼 들리고, ‘자기의 꿈들’은 뒤따르는 복수 직업군을 가리킬 가능성이 있어 다소 모호합니다. ‘왕의 꿈들을 왕에게 알려 주도록 명령했습니다’가 현대 한국어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: חַרְטֻמִּים에는 ‘점쟁이들’보다 바빌론 궁정의 전문 집단이라는 성격을 덜 구어적으로 드러내는 ‘점술가들’이 적절합니다. אַשָּׁפִים과 מְכַשְּׁפִים은 불확정적 세부 의미를 과도하게 특정하지 않도록 각각 ‘술객들’, ‘주술사들’로 구별할 수 있습니다. כַּשְׂדִּים의 문맥상 직업 집단이라는 가능성은 각주에서 보존합니다.
  issues:
