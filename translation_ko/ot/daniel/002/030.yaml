id: DAN.2.30
reference: Daniel 2:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנָ֗ה לָ֤א בְ/חָכְמָה֙ דִּֽי אִיתַ֥י בִּ/י֙ מִן כָּל חַיַּיָּ֔/א רָזָ֥/א דְנָ֖ה גֱּלִ֣י לִ֑/י לָהֵ֗ן עַל דִּבְרַת֙ דִּ֤י פִשְׁרָ/א֙ לְ/מַלְכָּ֣/א יְהוֹדְע֔וּן וְ/רַעְיוֹנֵ֥י לִבְבָ֖/ךְ תִּנְדַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/030.yaml
  text: But as for me[a], this mystery has been revealed to me not because of wisdom that is in me more than in all the living, but in order that the interpretation may be made known to the king[b], and that you may know the thoughts of your heart.
  footnotes:
  - marker: a
    text: Or 'this secret.' The Aramaic term can mean a hidden matter, but in Daniel it often carries the sense of a mystery disclosed by God.
    reason: lexical_alternative
  - marker: b
    text: Or 'the thoughts of your mind.' Literally, 'the thoughts of your heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저로 말하자면, 이 비밀[a]이 제게 드러난 것은 모든 살아 있는 이들보다 제 안에 더 많은 지혜가 있어서가 아니라, 그 해석이 왕께 알려지고 왕께서 왕의 마음속 생각[b]을 아시게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 신비’. 아람어 רָז는 숨겨진 일을 뜻할 수 있으나, 다니엘서에서는 하나님에 의해 드러나는 신비를 가리키는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕의 생각’. 직역하면 ‘왕의 마음의 생각’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָה
  english_pob_choice: But as for me
  chosen_korean: 그러나 저로 말하자면
  alternatives_korean:
  - 저는
  - 그리고 저로 말하자면
  lexicon: HALOT
  rationale: 대조적 화제 전환을 살려 다니엘의 겸손한 자기 지시를 자연스럽게 표현했습니다.
- source_word: רָזָא דְנָה
  english_pob_choice: this mystery
  chosen_korean: 이 비밀
  alternatives_korean:
  - 이 신비
  - 이 숨은 일
  lexicon: HALOT
  rationale: 다니엘서에서의 רָז는 계시로 드러나는 숨은 내용을 가리키므로, 문맥상 한국어에서는 ‘비밀’이 가장 자연스럽고 소통력이 있습니다.
- source_word: פִשְׁרָא
  english_pob_choice: the interpretation
  chosen_korean: 그 해석
  alternatives_korean:
  - 그 설명
  - 그 풀이
  lexicon: HALOT
  rationale: 꿈과 비밀에 대한 기술적 용어로서 ‘해석’이 가장 정확합니다.
- source_word: וְרַעְיוֹנֵי לִבְבָךְ
  english_pob_choice: the thoughts of your heart
  chosen_korean: 마음의 생각
  alternatives_korean:
  - 마음의 사유
  - 마음의 뜻
  lexicon: HALOT
  rationale: 직역적인 ‘마음의 생각’을 유지하되, 현대 한국어에서 자연스럽게 읽히도록 다듬었습니다.
theological_decisions:
- issue: ‘마음’의 인류학적 표현 유지
  chosen_reading: ‘heart’를 ‘마음’으로 유지해 사고와 의지까지 포함하는 성경적 내면 개념을 보존했습니다.
  alternative_readings:
  - 마음을 ‘생각’으로만 바꾸는 번역
  - 마음을 ‘정신’으로 바꾸는 번역
  rationale: 원문의 לִבְבָךְ는 단순한 감정기관이 아니라 사고와 의도까지 포함하는 내적 중심을 가리키므로, 이를 ‘마음’으로 살려야 합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 계시의 출처
  chosen_reading: 이 비밀은 다니엘 자신의 지혜가 아니라 하나님이 드러내신 것임을 분명히 했습니다.
  alternative_readings:
  - 다니엘의 통찰을 강조하는 완화된 번역
  - 단순한 정보 제공처럼 읽히는 번역
  rationale: 원문은 모든 살아 있는 자들보다 더한 지혜를 부인하며 계시의 기원을 인간이 아니라 하나님께 둡니다. 이를 흐리지 않도록 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
