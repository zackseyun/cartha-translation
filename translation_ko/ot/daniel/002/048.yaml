id: DAN.2.48
reference: Daniel 2:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱדַ֨יִן מַלְכָּ֜/א לְ/דָנִיֵּ֣אל רַבִּ֗י וּ/מַתְּנָ֨ן רַבְרְבָ֤ן שַׂגִּיאָן֙ יְהַב לֵ֔/הּ וְ/הַ֨שְׁלְטֵ֔/הּ עַ֖ל כָּל מְדִינַ֣ת בָּבֶ֑ל וְ/רַב סִגְנִ֔ין עַ֖ל כָּל חַכִּימֵ֥י בָבֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/048.yaml
  text: Then the king made Daniel great and gave him many great gifts[b][a], and he made him ruler over the whole province of Babylon and chief prefect over all the wise men of Babylon.
  footnotes:
  - marker: a
    text: Or 'promoted Daniel.' The Aramaic verb literally means 'made great' and in context refers to royal exaltation.
    reason: lexical_alternative
  - marker: b
    text: The title rendered 'chief prefect' refers to a high-ranking official set over other court officials or administrators.
    reason: cultural_note
translation:
  language: ko
  text: 그때 왕이 다니엘을 크게 높이고 많은 큰 선물[a]을 주었으며, 그를 바빌론 온 지방의 통치자로 세우고 바빌론의 모든 지혜자들 위에 있는 최고 총독[b]으로 삼았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘크게 하다’입니다. 여기서는 궁정 맥락에서 ‘승진시키다/높이다’의 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 관직명은 다른 관리들 위에 놓인 고위 행정직을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּי
  english_pob_choice: made Daniel great
  chosen_korean: 다니엘을 크게 높이고
  alternatives_korean:
  - 다니엘을 크게 하시고
  - 다니엘을 승진시키고
  - 다니엘을 영화롭게 하고
  lexicon: HALOT
  rationale: 아람어 동사의 기본 뜻인 ‘크게 하다/높이다’를 살리면서, 궁정 맥락의 신분 상승도 자연스럽게 드러내는 표현을 택했습니다.
- source_word: וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן
  english_pob_choice: many great gifts
  chosen_korean: 많은 큰 선물
  alternatives_korean:
  - 많고 큰 선물
  - 아주 큰 선물들
  - 풍성한 선물
  lexicon: HALOT
  rationale: ‘선물’로 옮겨 מַתְּנָן의 의미를 직접 반영했고, 중첩된 강조 형용사는 ‘많은 큰’으로 비교적 직역성 있게 살렸습니다.
- source_word: וְהַשְׁלְטֵהּ
  english_pob_choice: and he made him ruler
  chosen_korean: 그를 … 통치자로 세우고
  alternatives_korean:
  - 그를 … 다스리게 하고
  - 그에게 … 통치권을 주고
  - 그를 … 위에 세우고
  lexicon: HALOT
  rationale: שׁלט의 사역형을 한국어 동사 ‘세우다’로 풀어, 권한 부여와 임명이라는 행정적 뉘앙스를 함께 전달했습니다.
- source_word: וְרַב סִגְנִין
  english_pob_choice: and chief prefect
  chosen_korean: 최고 총독
  alternatives_korean:
  - 수석 총독
  - 최고 감독관
  - 수석 행정관
  lexicon: HALOT
  rationale: 직함의 정확한 한국어 대응어가 없어, ‘ruler over…’와 병행되는 상위 관직임을 드러내는 범위에서 가장 자연스러운 행정 용어로 옮겼습니다.
theological_decisions:
- issue: 다니엘의 승귀를 어떤 어조로 번역할지
  chosen_reading: ‘크게 높이고 … 세우고 삼았습니다’로 왕의 실제 승진 조치를 서술형으로 옮겼습니다.
  alternative_readings:
  - ‘영화롭게 했습니다’처럼 더 종교적 뉘앙스로 옮길 수 있음
  - ‘승진시켰습니다’로 현대 행정어를 사용할 수 있음
  rationale: 본문은 하나님의 직접 행위가 아니라 바벨론 왕의 궁정 조치이므로, 과도한 신학화보다 서술 사실을 분명히 하는 쪽이 원문과 POB의 의도를 더 잘 보존합니다.
  doctrine_reference: 섭리와 세속 권세 아래의 승귀
