id: DAN.5.29
reference: Daniel 5:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן אֲמַ֣ר בֵּלְשַׁאצַּ֗ר וְ/הַלְבִּ֤ישׁוּ לְ/דָֽנִיֵּאל֙ אַרְגְּוָנָ֔/א ו/המונכ/א דִֽי דַהֲבָ֖/א עַֽל צַוְּארֵ֑/הּ וְ/הַכְרִ֣זֽוּ עֲל֔וֹ/הִי דִּֽי לֶהֱוֵ֥א שַׁלִּ֛יט תַּלְתָּ֖א בְּ/מַלְכוּתָֽ/א׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/029.yaml
  text: Then Belshazzar gave the command[a], and they clothed Daniel with purple, put a chain of gold around his neck[b], and proclaimed concerning him that he should be the third ruler in the kingdom.
  footnotes:
  - marker: a
    text: Or 'they dressed Daniel in purple.' The Aramaic term can refer to purple clothing or purple cloth as a mark of royal honor.
    reason: lexical_alternative
  - marker: b
    text: Or 'the third ruler in the realm.' The phrase denotes rank within the kingdom, likely reflecting Daniel's position as third in authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 벨사살이 명령하였습니다. 그러자 그들은 다니엘에게 자주색 옷을 입히고 그의 목에 금 사슬을 걸어 주었으며, 다니엘이 왕국의 셋째 통치자가 될 것이라고 선포하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן אֲמַר
  english_pob_choice: Then Belshazzar gave the command
  chosen_korean: 그때 벨사살이 명령하자
  alternatives_korean:
  - 그때 벨사살이 말하자
  - 그때 벨사살이 명령을 내리자
  lexicon: HALOT
  rationale: 서술 전개를 나타내는 בֵּאדַיִן은 자연스럽게 ‘그때’로 옮기고, 아람어 אֲמַר의 왕실 맥락상 수행적 힘을 살려 ‘명령하자’로 처리했습니다.
- source_word: וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא
  english_pob_choice: they clothed Daniel with purple
  chosen_korean: 다니엘에게 자주색 옷을 입히고
  alternatives_korean:
  - 다니엘에게 자주색으로 입히고
  - 다니엘에게 자주색 옷을 입혀
  lexicon: HALOT
  rationale: אַרְגְּוָנָא는 왕실의 영예를 나타내는 자주색 의복/천을 가리키므로, 한국어에서는 ‘자주색 옷’으로 풀어 의미를 분명히 했습니다.
- source_word: ו/המונכ/א דִי דַהֲבָ/א עַל צַוְּארֵהּ
  english_pob_choice: a chain of gold around his neck
  chosen_korean: 금 사슬을 목에 걸어 주었으며
  alternatives_korean:
  - 금 사슬을 목에 둘렀으며
  - 금 목걸이를 목에 걸어 주었으며
  lexicon: HALOT
  rationale: המונכא는 목에 거는 장식 사슬을 가리키므로 ‘금 사슬’로 옮기고, עַל צַוְּארֵהּ는 한국어 관용에 맞게 ‘목에 걸어’로 표현했습니다.
- source_word: וְהַכְרִזוּ עֲלֹוהִי דִּי לֶהֱוֵ֥א שַׁלִּיט תַּלְתָּא בְּמַלְכוּתָא
  english_pob_choice: and proclaimed concerning him that he should be the third ruler in the kingdom
  chosen_korean: 그에 관하여 그가 왕국에서 셋째 통치자가 되어야 한다고 선포하였습니다
  alternatives_korean:
  - 그에 관하여 그가 왕국의 셋째 통치자가 될 것이라고 선포하였습니다
  - 그에 관하여 그가 나라에서 세 번째 통치자가 되라고 선포하였습니다
  lexicon: HALOT
  rationale: 선포의 내용은 지위 부여이므로 תַּלְתָּא שַׁלִּיט을 ‘셋째 통치자’로 옮겨 직분/서열 의미를 유지했고, בְּמַלְכוּתָא는 ‘왕국에서’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 왕실 명령의 수행적 뉘앙스
  chosen_reading: ‘말하자’보다 ‘명령하자’로 옮겨 왕의 발화가 곧 조치가 되는 궁정 문맥을 살렸습니다.
  alternative_readings:
  - 그때 벨사살이 말하자
  - 그때 벨사살이 명령을 내리자
  rationale: 아람어 אֲמַר는 문자적으로 ‘말하다’이지만, 뒤따르는 복수 수행자와 궁정 서술에서는 단순 발화보다 왕령의 기능이 핵심입니다.
  doctrine_reference: 서술 문맥의 왕권 표현
