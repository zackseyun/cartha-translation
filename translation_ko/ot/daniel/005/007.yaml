  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרֵ֤א מַלְכָּ/א֙ בְּ/חַ֔יִל לְ/הֶֽעָלָה֙ לְ/אָ֣שְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/חַכִּימֵ֣י בָבֶ֗ל דִּ֣י כָל אֱ֠נָשׁ דִּֽי יִקְרֵ֞ה כְּתָבָ֣/ה דְנָ֗ה וּ/פִשְׁרֵ/הּ֙ יְחַוִּנַּ֔/נִי אַרְגְּוָנָ֣/א יִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארֵ֔/הּ וְ/תַלְתִּ֥י בְ/מַלְכוּתָ֖/א יִשְׁלַֽט׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/007.yaml
  text: The king called out loudly to bring in the enchanters[a], the Chaldeans, and the diviners. The king answered and said to the wise men of Babylon, “Any man who reads this writing and makes its interpretation known to me shall be clothed with purple, have a chain of gold around his neck[c][b], and rule as third in the kingdom.”
  footnotes:
  - marker: a
    text: Or “the astrologers” for “the Chaldeans,” since the term can denote a class of Babylonian court sages rather than the ethnic group alone.
    reason: lexical_alternative
  - marker: b
    text: “Any man” renders a grammatically masculine singular expression used generically here; the sense is “anyone.”
    reason: lexical_alternative
  - marker: c
    text: Or “be the third ruler in the kingdom.” The Aramaic likely refers to rank as third in authority.
    reason: alternative_reading
translation:
  language: ko
  text: 왕이 크게 외쳐, 마술사들과 갈대아 사람들과 점쟁이들을 불러오게 했습니다. 왕이 바벨론의 지혜자들에게 말했습니다. “누구든지 이 글을 읽고 그 뜻을 내게 알려 주는 사람은 자주색 옷을 입고, 목에는 금 사슬을 걸며, 나라에서 셋째 통치자가 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרֵא ... בְּחַיִל
  english_pob_choice: called out loudly
  chosen_korean: 크게 외쳐
  alternatives_korean:
  - 크게 불러
  - 힘껏 외쳐
  lexicon: HALOT
  rationale: 공적인 상황에서의 강한 외침을 자연스러운 현대 한국어로 살리면서, 단순히 ‘불렀다’로 약화되지 않게 했습니다.
- source_word: אָשְׁפַיָּא
  english_pob_choice: the enchanters
  chosen_korean: 마술사들
  alternatives_korean:
  - 주술사들
  - 주문자들
  lexicon: HALOT
  rationale: 바벨론 궁정의 occult 전문가 집단을 가리키는 말로, 한국어에서 가장 직관적인 대응은 ‘마술사들’입니다.
- source_word: כשדי/א
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 갈대아인들
  - 갈대아 학자들
  lexicon: HALOT
  rationale: 여기서는 민족명과 직함적 용법이 겹치므로, 본문 용어를 보존하는 번역이 가장 안전합니다.
- source_word: גָזְרַיָּא
  english_pob_choice: the diviners
  chosen_korean: 점쟁이들
  alternatives_korean:
  - 점술가들
  - 길흉을 점치는 자들
  lexicon: HALOT
  rationale: 예언적·점복적 해석을 하는 자들을 가리키므로, 현대 독자에게 즉시 의미가 전달되는 표현을 선택했습니다.
- source_word: וּפִשְׁרֵהּ יְחַוִּנַּנִי
  english_pob_choice: and makes its interpretation known to me
  chosen_korean: 그 뜻을 내게 알려 주는
  alternatives_korean:
  - 그 해석을 내게 알리는
  - 그 의미를 내게 보여 주는
  lexicon: HALOT
  rationale: פִשְׁרֵהּ는 ‘해석’이지만, 한국어 문맥에서는 ‘뜻’이 자연스럽고, ‘알려 주는’이 선언적 행위를 잘 드러냅니다.
- source_word: וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט
  english_pob_choice: and rule as third in the kingdom
  chosen_korean: 나라에서 셋째 통치자가 될 것입니다
  alternatives_korean:
  - 나라에서 세 번째 권세자가 될 것입니다
  - 나라의 제3통치자가 될 것입니다
  lexicon: HALOT
  rationale: 본문은 서열상 ‘셋째’ 지위를 말하므로, 직역적이면서도 한국어로 자연스러운 ‘셋째 통치자’로 옮겼습니다.
theological_decisions:
- issue: 궁정 직함의 의미를 민족명으로만 고정할지 여부
  chosen_reading: ‘갈대아 사람들’로 유지해 본문 용어의 이중 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘점성가들’로 의역
  - ‘갈대아인들’만의 민족명으로 고정
  rationale: 다니엘서에서 ‘갈대아’는 민족명과 궁정 전문직 명칭이 겹치므로, 해석을 과도하게 단정하지 않는 것이 본문에 충실합니다.
  doctrine_reference: 본문 해석의 절제와 문맥 우선 원칙
