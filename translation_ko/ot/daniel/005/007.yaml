  source_fidelity: 수정이 필요합니다. 초안은 소환 대상과 보상의 주요 내용을 대체로 충실히 옮겼지만, עָנֵה ... וְאָמַר의 ‘대답하여 말하다’라는 서술 공식을 생략했습니다. 또한 אָשְׁפַיָּא를 ‘마술사들’로 옮기면 현대 한국어에서 오락적 마술 공연자를 쉽게 연상시킬 수 있어 궁정의 주술·비술 전문가라는 원뜻이 약해집니다. וְתַלְתִּי ... יִשְׁלַט은 ‘셋째 통치자가 된다’로도 가능하나, 통상 권력 서열 셋째라는 의미이므로 대안 독법을 주석으로 밝혀야 합니다.
