  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘세어 끝내셨습니다’는 두 완료 동사의 병렬 관계와 둘째 동사의 목적어(나라)를 한국어에서 다소 압축하여 모호하게 만듭니다. ‘세셨고 끝내셨습니다’로 옮기면 하나님께서 나라를 헤아리시고 그 나라를 끝내셨다는 원문의 판단을 더 직접적으로 드러냅니다.
  naturalness: ‘이것이 그 메시지의 해석입니다’는 자연스럽고 합쇼체에도 맞습니다. 다만 ‘당신의 나라를 세어 끝내셨습니다’는 결합이 다소 뻣뻣하므로, 접속하여 두 행위를 분명히 하는 편이 현대 한국어에 더 자연스럽습니다.
