id: DAN.5.26
reference: Daniel 5:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דְּנָ֖ה פְּשַֽׁר מִלְּתָ֑/א מְנֵ֕א מְנָֽה אֱלָהָ֥/א מַלְכוּתָ֖/ךְ וְ/הַשְׁלְמַֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/026.yaml
  text: 'This is the interpretation of the message: MENE—God has numbered your kingdom and finished it[a][b].'
  footnotes:
  - marker: a
    text: Aramaic MENE sounds like the verb meaning 'numbered' or 'counted.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the word,' 'the matter,' or 'the inscription.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이것이 그 메시지의 해석입니다: “메네—하나님께서 당신의 나라를 세어 끝내셨습니다.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 MENE는 ‘세다’, ‘계수하다’를 뜻하는 동사와 소리가 비슷합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘말’, ‘일’, ‘새겨진 글’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פְּשַׁר מִלְּתָא
  english_pob_choice: This is the interpretation of the message
  chosen_korean: 이것이 그 메시지의 해석입니다
  alternatives_korean:
  - 이것이 그 말의 해석입니다
  - 이것이 그 글의 해석입니다
  - 이것이 그 말씀의 해석입니다
  lexicon: HALOT
  rationale: אַראמיתית의 도입문을 자연스러운 현대 한국어로 옮기되, פְּשַׁר의 ‘해석’과 מִלְּתָא의 ‘메시지’ 의미를 살려 설명문으로 유지했습니다.
- source_word: מְנֵא
  english_pob_choice: MENE
  chosen_korean: 메네
  alternatives_korean:
  - MENE
  - 메나
  lexicon: HALOT
  rationale: 본문에 새겨진 단어 자체를 보존해야 하므로 음역으로 남기고, 한국어 독자가 읽기 쉬운 표기로 옮겼습니다.
- source_word: מְנָה
  english_pob_choice: has numbered
  chosen_korean: 세어
  alternatives_korean:
  - 번호를 매기셨습니다
  - 계산하셨습니다
  - 세셨습니다
  lexicon: HALOT
  rationale: ‘세다/세어’가 מְנָה의 수를 헤아리다라는 뜻과 메네와의 말놀이를 가장 간결하게 드러냅니다.
- source_word: מַלְכוּתָךְ
  english_pob_choice: your kingdom
  chosen_korean: 당신의 나라
  alternatives_korean:
  - 당신의 왕국
  - 당신의 통치
  - 당신의 나라와 왕권
  lexicon: HALOT
  rationale: 문맥상 벨사살의 통치 영역을 가리키므로, 한국어에서는 ‘나라’가 가장 자연스럽고 문맥 친화적입니다.
- source_word: וְהַשְׁלְמַהּ
  english_pob_choice: finished it
  chosen_korean: 끝내셨습니다
  alternatives_korean:
  - 마치셨습니다
  - 완성하셨습니다
  - 종결하셨습니다
  lexicon: HALOT
  rationale: 이 절의 심판적 문맥에서는 ‘완성’보다 ‘끝내다’가 결과의 종료를 더 분명하게 드러냅니다.
theological_decisions:
- issue: 하나님의 주권적 심판을 나타내는 완료 동사의 뉘앙스
  chosen_reading: 하나님께서 벨사살의 나라를 세어 그 끝을 정하셨다는 뜻을, 본문의 직설성을 살려 ‘세어 끝내셨습니다’로 옮겼습니다.
  alternative_readings:
  - 하나님께서 당신의 나라를 계산해 끝내셨습니다
  - 하나님께서 당신의 나라를 세어 종결하셨습니다
  rationale: 본문은 단순한 계산이 아니라 정해진 수명을 셈한 뒤 종결시키는 심판 행위를 말하므로, 그 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 신적 주권과 심판의 직설적 진술을 보존
- issue: 아람어 말놀이(MENE / numbered)의 재현
  chosen_reading: ‘메네—세어’로 음역과 의미를 나란히 두어 말놀이를 살렸습니다.
  alternative_readings:
  - ‘메네—번호를 매기셨습니다’
  - ‘메네—계산하셨습니다’
  rationale: 음역을 지우면 본문의 표지어가 사라지고, 의미만 남기면 독특한 수사적 효과가 약해집니다.
  doctrine_reference: 본문의 수사적 긴장 보존
