  text: וּ/מִן רְבוּתָ/א֙ דִּ֣י יְהַב לֵ֔/הּ כֹּ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ/א֙ וְ/לִשָּׁ֣נַיָּ֔/א הֲו֛וֹ זאעין וְ/דָחֲלִ֖ין מִן קֳדָמ֑וֹ/הִי דִּֽי הֲוָ֨ה צָבֵ֜א הֲוָ֣א קָטֵ֗ל וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מַחֵ֔א וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מָרִ֔ים וְ/דִֽי הֲוָ֥ה צָבֵ֖א הֲוָ֥ה מַשְׁפִּֽיל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/019.yaml
  text: And because of the greatness that he gave him[a], all peoples, nations, and languages were trembling and fearing before him. Whomever he wanted, he killed; and whomever he wanted, he kept alive; and whomever he wanted, he raised up; and whomever he wanted[c][b], he humbled.
  footnotes:
  - marker: a
    text: Or 'he kept alive' or 'he spared.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he exalted' or 'he promoted.'
    reason: lexical_alternative
  - marker: c
    text: The subject of 'he gave him' is implicit here and refers back to God in the previous verse.
    reason: cross_reference
translation:
  language: ko
  text: 그에게 주신[a] 큰 위엄 때문에 모든 백성과 민족과 언어가 그의 앞에서 떨며 두려워하였습니다. 그가 원하는 사람은 죽이고, 그가 원하는 사람은 살려 두고, 그가 원하는 사람은 높이고, 그가 원하는 사람은 낮추었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주신’의 주어는 원문에서 생략되어 있으며, 앞절의 하나님을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: רְבוּתָא
  english_pob_choice: the greatness
  chosen_korean: 그 큰 권세
  alternatives_korean:
  - 그 عظ대함
  - 그 위대함
  - 그 큰 영화
  lexicon: HALOT
  rationale: 문맥상 왕에게 부여된 위엄과 통치력의 크기를 가리키므로, 단순한 추상명사보다 ‘권세’가 한국어에서 기능을 더 분명히 드러냅니다. ‘큰’으로 규모를 살리고, 전승적 표현을 지나치게 완화하지 않았습니다.
- source_word: יְהַב לֵהּ
  english_pob_choice: he gave him
  chosen_korean: 그에게 주신
  alternatives_korean:
  - 그가 그에게 주었다
  - 그에게 주었다
  lexicon: HALOT
  rationale: 문법상 주어는 생략되어 있지만 앞절의 하나님을 가리키는 것이 분명하므로, 한국어 본문에는 자연스럽게 담되 과도한 반복은 피했습니다. ‘주신’은 앞문맥의 하나님 주도성을 보존합니다.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  english_pob_choice: peoples, nations, and languages
  chosen_korean: 모든 백성과 나라들과 언어들이
  alternatives_korean:
  - 백성과 민족들과 언어들이
  - 민족들과 나라들과 말들이
  lexicon: HALOT
  rationale: 다니엘서의 관용적 삼중열거를 살리되, 현대 한국어에서 자연스럽고 포괄적으로 읽히는 ‘백성, 나라, 언어’ 구조를 유지했습니다.
- source_word: זאעין וְדָחֲלִין
  english_pob_choice: were trembling and fearing
  chosen_korean: 떨며 두려워하였습니다
  alternatives_korean:
  - 떨고 두려워하였습니다
  - 전율하며 두려워하였습니다
  lexicon: HALOT
  rationale: 두 분사를 병렬로 살려 반응의 강도를 유지했습니다. ‘떨며 두려워하다’는 원문의 정서적 긴장을 비교적 직접적으로 전달합니다.
- source_word: דִּי הֲוָה צָבֵא
  english_pob_choice: whomever he wanted
  chosen_korean: 그가 하고자 하면
  alternatives_korean:
  - 그가 원하면
  - 그가 바라는 대로
  lexicon: HALOT
  rationale: 반복되는 조건문 구조를 한국어로 가장 간결하게 옮겼습니다. ‘하고자 하면’은 임의적 왕권의 의지성을 분명하게 드러냅니다.
- source_word: מַחֵא
  english_pob_choice: he kept alive
  chosen_korean: 살려 두었고
  alternatives_korean:
  - 살려 두었고
  - 살게 했고
  - 살게 두었고
  lexicon: HALOT
  rationale: 앞의 ‘죽였고’와 대구를 이루도록 생명 보존의 행위를 간명하게 표현했습니다. ‘살려 두다’는 원문의 대조를 가장 직접적으로 반영합니다.
- source_word: מָרִים / מַשְׁפִּיל
  english_pob_choice: he raised up / he humbled
  chosen_korean: 높였고 / 낮추었습니다
  alternatives_korean:
  - 들어 올렸고 / 낮추었습니다
  - 높였고 / 겸손하게 했습니다
  lexicon: HALOT
  rationale: 원문은 지위의 올림과 내림을 병렬로 말하므로, 한국어에서도 높임과 낮춤의 짝을 유지했습니다. ‘낮추다’는 원문의 사회적·정치적 하강을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 생략된 행위 주어의 처리
  chosen_reading: 본문에는 ‘주다’의 주어가 생략되어 있으나, 앞절의 하나님을 자연스럽게 가리키는 것으로 이해하되 본문 안에는 직접 ‘하나님’을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘하나님이 그에게 주신’처럼 주어를 명시하는 번역
  rationale: 원문은 서술상 주어를 반복하지 않으므로, 한국어에서도 문맥상 분명한 의미를 살리되 본문에 없는 단어를 추가하지 않는 쪽을 택했습니다.
  doctrine_reference: 원문 우선 원칙, 문맥적 지시어의 절제된 복원
