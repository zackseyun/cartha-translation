  source_fidelity: ‘큰 권세’는 רְבוּתָא(위대함, 위엄, 높은 지위)를 통치 권한으로 다소 좁힙니다. 또한 반복되는 דִּי הֲוָה צָבֵא는 ‘그가 하고자 하면’보다 각 경우의 대상인 ‘그가 원하는 사람’을 드러내야 합니다. 생략된 ‘주신’의 주어는 본문에서 명시하지 않는 것이 원문에 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서, 반복되는 왕의 자의적 처분을 자연스럽고 분명하게 전달합니다. ‘모든 백성과 민족과 언어’는 다니엘서의 삼중 열거를 보존합니다.
  terminology: רְבוּתָא는 ‘큰 위엄’으로 옮겨 왕에게 부여된 탁월한 위상과 장엄함을 보존했습니다. מַחֵא는 ‘살려 두고’, מָרִים/מַשְׁפִּיל은 ‘높이고/낮추었습니다’로 대구를 유지했습니다.
