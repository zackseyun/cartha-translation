  text: בֵּ/אדַ֨יִן֙ דָּֽנִיֵּ֔אל הֻעַ֖ל קֳדָ֣ם מַלְכָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל אנתה ה֤וּא דָנִיֵּאל֙ דִּֽי מִן בְּנֵ֤י גָלוּתָ/א֙ דִּ֣י יְה֔וּד דִּ֥י הַיְתִ֛י מַלְכָּ֥/א אַ֖בִ/י מִן יְהֽוּד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
  footnotes:
  - marker: a
    text: Or, 'my predecessor'; in royal usage 'father' can refer to an ancestor or earlier king, not only an immediate biological father.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 다니엘이 왕 앞으로 인도되었습니다. 왕이 다니엘에게 이렇게 말했습니다. “그대가 내 아버지[a] 왕이 유다에서 데려온 유다 포로들 가운데 한 사람인 바로 그 다니엘입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 왕실 용법에서 ‘아버지’는 친아버지뿐 아니라 선왕이나 조상을 가리킬 수도 있습니다.
    reason: cultural_note
