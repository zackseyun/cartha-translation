  - 내 아버지인 왕이 유다에서 데려온
  - 내 아버지 왕께서 유다에서 데려오신
  lexicon: HALOT
  rationale: 왕실 호칭의 순서를 살리되, ‘데려온’으로 추방·이송의 의미를 유지했습니다.
theological_decisions:
- issue: ‘내 아버지’의 왕실 용법
  chosen_reading: 본문의 ‘내 아버지 왕’을 그대로 살리되, 혈연만을 뜻한다고 고정하지 않도록 번역했습니다.
  alternative_readings:
  - 내 선왕
  - 내 전임자
  rationale: 원문은 ‘아버지’라고 말하므로 이를 보존하되, 고대 왕실에서 선대 왕을 가리킬 수 있는 용법을 번역 자체에서 과도하게 해소하지 않았습니다.
  doctrine_reference: 역사적·언어적 긴장을 본문 수준에서 보존
