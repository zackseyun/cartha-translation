  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֨יִן֙ דָּֽנִיֵּ֔אל הֻעַ֖ל קֳדָ֣ם מַלְכָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל אנתה ה֤וּא דָנִיֵּאל֙ דִּֽי מִן בְּנֵ֤י גָלוּתָ/א֙ דִּ֣י יְה֔וּד דִּ֥י הַיְתִ֛י מַלְכָּ֥/א אַ֖בִ/י מִן יְהֽוּד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
  footnotes:
  - marker: a
    text: Or, 'my predecessor'; in royal usage 'father' can refer to an ancestor or earlier king, not only an immediate biological father.
    reason: cultural_note
translation:
  language: ko
  text: 그때 다니엘이 왕 앞에 끌려왔습니다. 왕이 다니엘에게 대답하며 말했습니다. “너가 유다에서 끌려온 유다 포로들 가운데 있는 바로 그 다니엘이냐? 내 아버지 왕이 유다에서 데려온 그 사람 말이냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 왕실 용법에서는 ‘아버지’가 바로 앞선 왕이나 조상을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그러자
  lexicon: HALOT
  rationale: 이야기 전개를 이어 주는 아람어 담화 표지를 현대 한국어 서술 흐름에 자연스럽게 옮겼습니다.
- source_word: הֻעַל
  english_pob_choice: was brought in
  chosen_korean: 끌려왔습니다
  alternatives_korean:
  - 들여졌습니다
  - 인도되었습니다
  lexicon: HALOT
  rationale: 수동/사동적 의미를 살리되, 왕 앞에 ‘데려와짐’의 상황을 한국어로 자연스럽게 드러냈습니다.
- source_word: קֳדָם מַלְכָּא
  english_pob_choice: before the king
  chosen_korean: 왕 앞에
  alternatives_korean:
  - 왕 앞에서
  - 왕의 면전으로
  lexicon: HALOT
  rationale: 아람어 관용구를 간결한 현대 한국어로 옮겨, 법정·궁정 장면의 긴장을 유지했습니다.
- source_word: בְּנֵי גָלוּתָא דִּי יְהוּד
  english_pob_choice: one of the exiles of Judah
  chosen_korean: 유다 포로들 가운데 있는
  alternatives_korean:
  - 유다의 포로들 중 하나인
  - 유다에서 끌려간 사람들 가운데 있는
  lexicon: HALOT
  rationale: 직역적 ‘포로들’의 집단성을 살리면서도 한국어 문맥에서 자연스럽게 이해되도록 구성했습니다.
- source_word: דִּי הַיְתִי מַלְכָּא אַבִי מִן יְהֽוּד
  english_pob_choice: whom the king my father brought from Judah
  chosen_korean: 내 아버지 왕이 유다에서 데려온
  alternatives_korean:
  - 내 아버지인 왕이 유다에서 데려온
  - 내 아버지 왕께서 유다에서 데려오신
  lexicon: HALOT
  rationale: 왕실 호칭의 순서를 살리되, ‘데려온’으로 추방·이송의 의미를 유지했습니다.
theological_decisions:
- issue: ‘내 아버지’의 왕실 용법
  chosen_reading: 본문의 ‘내 아버지 왕’을 그대로 살리되, 혈연만을 뜻한다고 고정하지 않도록 번역했습니다.
  alternative_readings:
  - 내 선왕
  - 내 전임자
  rationale: 원문은 ‘아버지’라고 말하므로 이를 보존하되, 고대 왕실에서 선대 왕을 가리킬 수 있는 용법을 번역 자체에서 과도하게 해소하지 않았습니다.
  doctrine_reference: 역사적·언어적 긴장을 본문 수준에서 보존
