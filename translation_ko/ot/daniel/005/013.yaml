  source_fidelity: 원문의 수동형 הֻעַל은 다니엘이 왕의 앞으로 다른 이들에 의해 데려와졌음을 뜻하므로, ‘끌려왔습니다’보다 궁정 장면에 중립적인 ‘인도되었습니다’가 알맞습니다. 또한 두 번째 문장은 다니엘을 수식하는 하나의 관계절이므로, 이를 두 개의 질문으로 나누지 않는 편이 원문 구조와 의미를 더 충실히 보존합니다.
  naturalness: 초안의 ‘너가’는 표준 표기가 아니며, 왕의 직접 발화를 현대 공식 문체로 일관되게 옮기려면 ‘그대가 … 입니까?’가 자연스럽습니다. ‘유다 포로들 가운데 있는’도 ‘유다 포로들 가운데 한 사람인’으로 고치면 한국어 결속이 좋아집니다.
  terminology: ‘유다’, ‘다니엘’, ‘아버지 왕’은 유지했습니다. ‘내 아버지’는 원문의 왕실 친족·계승 용법을 보존하며, 각주에서 선왕 또는 조상을 뜻할 수 있음을 설명합니다. 각주 표지는 의미상 해당하는 ‘아버지’에 직접 붙였습니다.
