- from: 그때 다니엘이 왕 앞에 끌려왔습니다. 왕이 다니엘에게 대답하며 말했습니다. “너가 유다에서 끌려온 유다 포로들 가운데 있는 바로 그 다니엘이냐? 내 아버지 왕이 유다에서 데려온 그 사람 말이냐?”[a]
  to: 그러자 다니엘이 왕 앞으로 인도되었습니다. 왕이 다니엘에게 이렇게 말했습니다. “그대가 내 아버지[a] 왕이 유다에서 데려온 유다 포로들 가운데 한 사람인 바로 그 다니엘입니까?”
