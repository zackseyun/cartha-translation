id: DAN.5.17
reference: Daniel 5:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֜יִן עָנֵ֣ה דָנִיֵּ֗אל וְ/אָמַר֙ קֳדָ֣ם מַלְכָּ֔/א מַתְּנָתָ/ךְ֙ לָ֣/ךְ לֶֽהֶוְיָ֔ן וּ/נְבָ֥זְבְּיָתָ֖/ךְ לְ/אָחֳרָ֣ן הַ֑ב בְּרַ֗ם כְּתָבָ/א֙ אֶקְרֵ֣א לְ/מַלְכָּ֔/א וּ/פִשְׁרָ֖/א אֲהוֹדְעִנֵּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/017.yaml
  text: Then Daniel answered and said before the king, “Let your gifts remain yours, and give your rewards to another. Nevertheless, I will read the writing for the king and make its interpretation known to him.”
translation:
  language: ko
  text: 그때 다니엘이 왕 앞에서 대답하여 말했습니다. “왕의 선물은 왕께서 간직하시고, 상은 다른 사람에게 주십시오. 그러나 저는 왕께 이 글을 읽어 드리고 그 해석을 알려 드리겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֳדָם מַלְכָּא
  english_pob_choice: before the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕의 면전에서
  - 왕 앞에서 그
  lexicon: HALOT
  rationale: קֳדָם은 단순한 대상을 넘는 '면전/앞'의 위치를 나타내므로, court setting을 자연스럽게 살린 '왕 앞에서'로 옮겼습니다.
- source_word: מַתְּנָתָךְ / נְבָזְבְּיָתָךְ
  english_pob_choice: your gifts / your rewards
  chosen_korean: 왕의 선물 / 상
  alternatives_korean:
  - 왕의 예물 / 보상
  - 왕의 선물 / 상금
  lexicon: HALOT
  rationale: 두 명사의 뉘앙스를 구분해 첫 항목은 이미 제안된 선물, 둘째는 왕이 약속한 보상성 수여로 읽히는 '상'으로 옮겼습니다.
- source_word: לָךְ לֶהֶוְיָן
  english_pob_choice: remain yours
  chosen_korean: 왕께서 간직하시고
  alternatives_korean:
  - 왕께 속한 채로 두시고
  - 왕의 것으로 남기시고
  lexicon: HALOT
  rationale: 관용적으로는 소유를 유지하라는 뜻이므로, 현대 한국어에서 거절 의도를 분명히 드러내는 '간직하시고'로 풀었습니다.
- source_word: בְּרַם
  english_pob_choice: Nevertheless
  chosen_korean: 그러나
  alternatives_korean:
  - 그렇지만
  - 하지만
  lexicon: HALOT
  rationale: 앞선 거절과 뒤의 실행 의지를 강하게 대조하는 접속으로서, 문맥상 가장 간결한 역접 '그러나'를 선택했습니다.
- source_word: כְּתָבָא
  english_pob_choice: the writing
  chosen_korean: 이 글
  alternatives_korean:
  - 그 글
  - 그 기록
  lexicon: HALOT
  rationale: 환상적이고 수수께끼 같은 기록이지만 한국어에서는 '글'이 가장 직접적이며, 지시어 '이'로 왕이 보게 된 그 현장성을 살렸습니다.
theological_decisions:
- issue: 다니엘의 보상 거절과 예언적 해석 수행의 긴장
  chosen_reading: 다니엘은 왕의 선물을 받지 않겠다고 분명히 하면서도, 해석 자체는 왕을 위해 제공하겠다고 말합니다.
  alternative_readings:
  - 보상을 완전히 경멸하는 태도로 읽기
  - 해석 제공까지 조건부로 거절하는 태도로 읽기
  rationale: 본문은 금전적 보상과 예언적 충성 사이의 대비를 강조하므로, 두 요소를 모두 살려 다니엘의 자유로운 거절과 의무 이행을 함께 드러냈습니다.
  doctrine_reference: 예언자의 무상성 및 하나님의 말씀에 대한 충성
