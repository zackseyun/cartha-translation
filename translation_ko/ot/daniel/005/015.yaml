  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְעַ֞ן הֻעַ֣לּוּ קָֽדָמַ֗/י חַכִּֽימַיָּ/א֙ אָֽשְׁפַיָּ֔/א דִּֽי כְתָבָ֤/ה דְנָה֙ יִקְר֔וֹן וּ/פִשְׁרֵ֖/הּ לְ/הוֹדָעֻתַ֑/נִי וְ/לָֽא כָהֲלִ֥ין פְּשַֽׁר מִלְּתָ֖/א לְ/הַחֲוָיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/015.yaml
  text: And now the wise men, the enchanters, have been brought before me to read this writing and make its interpretation known to me, but they were not able to show the interpretation of the message.
translation:
  language: ko
  text: 그리고 이제 지혜자들과 술객들이 이 글을 읽고 그 해석을 내게 알려 주도록 내 앞에 불려 왔으나, 그들은 그 글의 해석을 밝혀 주지 못하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְעַן / And now
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그런데 이제
  lexicon: וּכְעַן
  rationale: 담화 전환을 자연스럽게 살리면서도 원문의 시간·상황 전환을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: חַכִּימַיָּא / wise men
  english_pob_choice: the wise men
  chosen_korean: 지혜자들
  alternatives_korean:
  - 현자들
  - 박사들
  lexicon: חַכִּימַיָּא
  rationale: 단순한 학자 집단이 아니라 바벨론 궁정의 지혜자들을 가리키므로, 전통적 교회어보다 직역성이 있는 ‘지혜자들’을 택했습니다.
- source_word: אָשְׁפַיָּא / enchanters
  english_pob_choice: the enchanters
  chosen_korean: 술객들
  alternatives_korean:
  - 주술사들
  - 주문자들
  lexicon: אָשְׁפַיָּא
  rationale: 마술·주술적 행위를 하는 집단을 가리키는 말이므로, 문맥상 자연스럽고 낯설지 않은 ‘술객들’로 옮겼습니다.
- source_word: פִשְׁרֵהּ לְהוֹדָעֻתַנִי / make its interpretation known to me
  english_pob_choice: make its interpretation known to me
  chosen_korean: 그 해석을 내게 알려 주도록
  alternatives_korean:
  - 그 뜻을 내게 알려 주도록
  - 그 해석을 내게 알게 하도록
  lexicon: פְשַׁר / הוֹדַע
  rationale: ‘해석’을 유지해 앞 절의 ‘글’을 대상으로 한 설명 행위를 분명히 했고, ‘알려 주다’로 원문의 통고 의미를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 해석 불능의 진술
  chosen_reading: 그들은 그 말의 해석을 보여 주지 못하였습니다.
  alternative_readings:
  - 그들은 그 해석을 내게 알리지 못하였습니다.
  - 그들은 그 말의 뜻을 설명하지 못하였습니다.
  rationale: 원문은 단순한 지식 부족이 아니라 실제로 해석을 제시하지 못한 실패를 말하므로, POB의 ‘show’ 취지를 따라 ‘보여 주지 못하다’로 옮겨 무능의 강조를 보존했습니다.
  doctrine_reference: 본문 서술의 서사적 강조
