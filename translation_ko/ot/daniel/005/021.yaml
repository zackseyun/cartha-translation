id: DAN.5.21
reference: Daniel 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן בְּנֵי֩ אֲנָשָׁ֨/א טְרִ֜יד וְ/לִבְבֵ֣/הּ עִם חֵיוְתָ֣/א שוי וְ/עִם עֲרָֽדַיָּ/א֙ מְדוֹרֵ֔/הּ עִשְׂבָּ֤/א כְ/תוֹרִין֙ יְטַ֣עֲמוּנֵּ֔/הּ וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּֽי יְדַ֗ע דִּֽי שַׁלִּ֞יט אֱלָהָ֤/א עלי/א בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖ה יְהָקֵ֥ים עלי/ה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/021.yaml
  text: He was driven away from the sons of men[a], and his heart was made like the beasts, and his dwelling was with the wild donkeys. He was fed grass like oxen, and his body was drenched with the dew of heaven[d][c][b], until he knew that the Most High God rules over the kingdom of mankind and sets over it whomever he wills.
  footnotes:
  - marker: a
    text: Or 'from human beings' for 'from the sons of men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his mind was made like the beasts'; the Aramaic literally says 'his heart was made like [the beasts].'
    reason: lexical_alternative
  - marker: c
    text: '''Wild donkeys'' refers to onagers; older English versions often have ''wild asses.'''
    reason: cultural_note
  - marker: d
    text: Or 'over the kingdom of men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 사람들[a] 가운데서 쫓겨나, 그의 마음은 짐승들과 같아졌고 그의 거처는 들나귀들과 함께하게 되었습니다. 그는 소들처럼 풀을 먹었고, 그의 몸은 하늘의 이슬에 흠뻑 젖었습니다. 그것은 지극히 높으신 하나님이 사람의 나라를 다스리시며, 그 위에 누구든지 원하시는 자를 세우신다는 것을 그가 알게 될 때까지였습니다.[d][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '인간들'로, '사람들'의 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어는 문자적으로 '그의 마음이 짐승들과 같게 되었다'라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: '''들나귀''는 onager를 가리키며, 옛 번역들에는 ''들나귀'' 또는 ''들나귀(야생 당나귀)''에 해당하는 표현이 나타납니다.'
    reason: cultural_note
  - marker: d
    text: 또는 '사람들의 나라 위에'.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אֲנָשָׁא
  english_pob_choice: the sons of men
  chosen_korean: 사람들
  alternatives_korean:
  - 인간들
  - 인류
  lexicon: HALOT
  rationale: 아람어 관용구의 포괄적 의미를 살리되, 직역체인 '사람의 아들들'보다 자연스러운 현대 한국어로 옮겼습니다.
- source_word: טְרִיד
  english_pob_choice: was driven away
  chosen_korean: 쫓겨나
  alternatives_korean:
  - 내쫓겨
  - 몰려나
  lexicon: HALOT
  rationale: 수동적 추방의 의미를 자연스럽게 살리는 표현으로, 강한 제거의 뉘앙스를 유지합니다.
- source_word: גִּשְׁמֵהּ יִצְטַבַּע
  english_pob_choice: his body was drenched
  chosen_korean: 그의 몸은 … 흠뻑 젖었습니다
  alternatives_korean:
  - 그의 몸은 … 젖었습니다
  - 그의 몸은 … 흠뻑 적셔졌습니다
  lexicon: HALOT
  rationale: יִצְטַבַּע의 충분히 젖은 상태를 반영해 '흠뻑 젖었습니다'로 옮겼습니다.
- source_word: בְּמַלְכוּת אֲנָשָׁא
  english_pob_choice: the kingdom of mankind
  chosen_korean: 사람의 나라
  alternatives_korean:
  - 인류의 나라
  - 사람들의 나라
  lexicon: HALOT
  rationale: 문맥상 인간의 지배 영역 전체를 가리키므로, 소유격을 살린 '사람의 나라'가 간결하면서도 원문의 범위를 유지합니다.
- source_word: וּלְמַן דִּי יִצְבֵּה יְהָקֵים עליה
  english_pob_choice: and sets over it whomever he wills
  chosen_korean: 누구든지 원하시는 자를 세우신다는
  alternatives_korean:
  - 원하시는 누구든지 그 위에 세우신다는
  - 뜻하시는 자를 그 위에 세우신다는
  lexicon: HALOT
  rationale: 하나님의 주권적 선택과 임명 행위를 분명히 드러내는 동사 '세우시다'를 유지했습니다.
theological_decisions:
- issue: 다니엘 5:21의 주권 선언을 약화시키지 않는 번역
  chosen_reading: 지극히 높으신 하나님이 사람의 나라를 다스리시며, 그 위에 누구든지 원하시는 자를 세우신다
  alternative_readings:
  - 지극히 높으신 하나님이 인류의 나라에 대해 주권을 가지시며, 뜻하시는 자를 임명하신다
  - 지극히 높으신 하나님이 사람들의 나라를 다스리시고 원하시는 자를 그 위에 세우신다
  rationale: 본문은 바벨론 왕의 굴욕을 통해 하나님의 실제 통치를 직접 진술하므로, 추상화된 표현보다 주권과 임명의 강도를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: אֲנָשָׁא의 성중립적 집합 의미
  chosen_reading: 사람들 / 사람의 나라
  alternative_readings:
  - 남자들 / 남자의 나라
  - 인간들 / 인류의 나라
  rationale: 문법적으로는 남성형이지만 의미는 포괄적이므로, 한국어에서도 남성 한정으로 오해되지 않도록 중립적 집합 표현을 택했습니다.
  doctrine_reference: Translation philosophy §4
