source:
  edition: WLC
  text: בֵּ/אדַ֗יִן הַיְתִיו֙ מָאנֵ֣י דַהֲבָ֔/א דִּ֣י הַנְפִּ֗קוּ מִן הֵֽיכְלָ֛/א דִּֽי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/אִשְׁתִּ֣יו בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/003.yaml
  text: Then they brought in the gold vessels that had been taken out of the temple[a], the house of God, which was in Jerusalem, and the king and his nobles[b], his wives and his concubines drank from them.
  footnotes:
  - marker: a
    text: Or 'which they had brought out of the temple.' The Aramaic verb can be rendered more actively, but the passive-style English keeps the focus on the vessels.
    reason: lexical_alternative
  - marker: b
    text: '''His wives'' translates an Aramaic term that can refer to royal consorts; some render it ''his queens.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들은 예루살렘에 있는 하나님의 집, 곧 성전에서 가져온 금그릇들을 가져왔습니다. 왕과 그의 귀족들, 그의 아내들과 그의 첩들이 그것으로 마셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성전’은 아람어 הֵיכְלָא의 자연스러운 현대 한국어 번역입니다.
    reason: source_note
  - marker: b
    text: ‘아내들’로 옮긴 아람어는 왕실의 배우자들을 가리킬 수 있으며, 경우에 따라 ‘왕후들’로도 번역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 이야기 전개를 잇는 시간 부사로, 현대 한국어에서 자연스럽고 서술 흐름을 잘 살립니다.
- source_word: מָאנֵי דַהֲבָא
  english_pob_choice: the gold vessels
  chosen_korean: 금그릇들
  alternatives_korean:
  - 금항아리들
  - 금제 기물들
  lexicon: HALOT
  rationale: 성전 기물을 가리키는 문맥에서 ‘그릇들’이 가장 자연스럽고, 금으로 된 용기라는 점을 직접 드러냅니다.
- source_word: דִּי הַנְפִּקוּ מִן הֵיכְלָא דִּי בֵית אֱלָהָא דִּי בִירוּשְׁלֶם
  english_pob_choice: that had been taken out of the temple, the house of God, which was in Jerusalem
  chosen_korean: 예루살렘에 있는 하나님의 집, 곧 성전에서 가져온
  alternatives_korean:
  - 예루살렘에 있는 하나님의 집, 곧 성전에서 끌어낸
  - 예루살렘에 있는 하나님의 집에서 옮겨 온
  lexicon: HALOT
  rationale: 원문의 수동적 결과를 살리면서도 한국어에서는 ‘가져온’이 가장 자연스럽고, ‘곧’으로 성전과 하나님의 집의 동격 설명을 분명히 했습니다.
- source_word: רַבְרְבָנוֹהִי
  english_pob_choice: his nobles
  chosen_korean: 그의 귀족들
  alternatives_korean:
  - 그의 대신들
  - 그의 고관들
  lexicon: HALOT
  rationale: 왕의 고위층을 가리키는 말로, 한국어에서는 ‘귀족들’이 본문 분위기와 위계를 잘 전달합니다.
- source_word: שֵׁגְלָתֵהּ
  english_pob_choice: his wives
  chosen_korean: 그의 아내들
  alternatives_korean:
  - 그의 왕후들
  - 그의 후궁들
  lexicon: HALOT
  rationale: 해당 아람어는 왕실 배우자들을 가리킬 수 있지만, 문맥상 ‘아내들’이 가장 직접적이고 과도한 해석을 피합니다.
- source_word: וּלְחֵנָתֵהּ
  english_pob_choice: his concubines
  chosen_korean: 그의 첩들
  alternatives_korean:
  - 그의 후궁들
  - 그의 여첩들
  lexicon: HALOT
  rationale: 왕실 내 비정규 배우자를 뜻하는 말이므로, 전통적이면서도 직설적인 ‘첩들’이 의미를 분명히 드러냅니다.
theological_decisions:
- issue: 성전 기물을 술잔처럼 사용하는 모독적 행위의 표현
  chosen_reading: 원문의 사건성을 유지해, 금그릇을 ‘그것으로 마셨습니다’라고 직설적으로 옮겼습니다.
  alternative_readings:
  - 그것으로 술을 마셨습니다
  - 그것을 술잔처럼 사용했습니다
  rationale: 이 구절의 긴장은 성전 기물이 세속적 연회에 사용되었다는 데 있으므로, 완곡하게 돌리지 않고 행위를 그대로 드러내는 것이 본문의 효과를 보존합니다.
  doctrine_reference: 단 5장 문맥의 성전 모독 및 심판 서사
