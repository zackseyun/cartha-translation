translation:
  language: ko
  text: 그날 밤 바로 벨사살, 곧 갈대아 왕이 죽임을 당했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘그 밤에 벨사살 왕, 곧 갈대아인들의 왕이 죽임을 당했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ בְּלֵילְיָא
  english_pob_choice: In that very night
  chosen_korean: 그날 밤 바로
  alternatives_korean:
  - 그 밤에
  - 그날 밤에
  lexicon: HALOT
  rationale: 시간 표현의 지시성과 강조를 한국어의 ‘그날 밤 바로’로 옮겨, 같은 밤이라는 긴급성과 특정성을 자연스럽게 드러냈습니다.
- source_word: קְטִיל
  english_pob_choice: was killed
  chosen_korean: 죽임을 당했습니다
  alternatives_korean:
  - 죽었습니다
  - 살해당했습니다
  lexicon: HALOT
  rationale: 수동적 결과를 분명히 하면서도 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다. ‘살해당했습니다’는 더 구체적이지만 다소 강한 어감이라 기본 본문에는 덜 중립적인 ‘죽임을 당했습니다’를 사용했습니다.
- source_word: מַלְכָּא כשדי/א
  english_pob_choice: the Chaldean king
  chosen_korean: 갈대아 왕
  alternatives_korean:
  - 갈대아인의 왕
  - 갈대아 사람들의 왕
  lexicon: HALOT
  rationale: ארמית의 명사구를 한국어의 관형어적 명칭으로 압축해, ‘왕’과 민족적 수식 관계를 자연스럽게 유지했습니다.
theological_decisions:
- issue: 벨사살의 죽음 서술 방식
  chosen_reading: 본문은 단순한 역사 서술로, 사건의 시점을 ‘그날 밤 바로’로 앞세워 급박함을 강조합니다.
  alternative_readings:
  - ‘그날 밤에’로 중립적으로 옮길 수 있습니다.
  - ‘그날 밤 바로’는 강조를 다소 더 드러냅니다.
  rationale: 히브리/아람어의 시간-강조 구조를 한국어에서 과도하게 해설하지 않고, 서술의 즉시성을 살리는 번역을 택했습니다.
  doctrine_reference: 본문 서술의 시점 강조
