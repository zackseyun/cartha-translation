review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그분의 집 그릇들’은 소유 관계가 불분명하고 비자연스러우며, 마지막 절의 ‘하나님을 ... 높여 드리지 않았다’는 원문의 ‘존귀하게 하다/공경하다’와 문법적 결속을 한국어에서 다소 부자연스럽게 처리합니다. ‘모든 길’은 해석적으로 확대하지 않고 유지했습니다.
  naturalness: ‘그분의 집의 그릇들’ 및 ‘당신 앞에 가져다 놓였고’가 현대 표준 한국어에서 더 자연스럽습니다. 하나님에 대한 부정 동사는 ‘공경하지 않았습니다’로 옮겨 존대 표현 ‘높여 드리다’의 어색함을 피했습니다. 합쇼체를 일관되게 유지했습니다.
  terminology: מָרֵא שְׁמַיָּא는 ‘하늘의 주님’으로 유지할 수 있으며, 각주에서 ‘주인’이라는 어휘 대안을 제시하는 것은 적절합니다. מָאנַיָּא는 문맥상 성전 기물이지만 원문의 ‘집’을 보존해 ‘그분의 집의 그릇들’로 옮겼습니다. נִשְׁמָה는 ‘숨’, אֹרְחָתָךְ는 ‘모든 길’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘그분의 집 그릇들’의 소유 관계 표현
    rationale: 한국어에서는 ‘집 그릇’이 가정용 식기처럼 들릴 수 있고, ‘그분의 집의 그릇들’이 원문의 ‘그의 집의 기물들’을 더 명료하게 반영합니다.
  - severity: medium
    issue: 마지막 절의 ‘하나님을 ... 높여 드리지 않았습니다’
    rationale: ‘높여 드리다’는 이 문맥에서 자연스럽지 않으며, 원문의 הַדַּרְתָּ는 하나님께 합당한 존귀를 돌리지 않았다는 뜻입니다. ‘공경하지 않았습니다’가 직접적이고 자연스럽습니다.
  - severity: low
    issue: ‘가져와졌으며’의 문체
    rationale: 문법적으로 가능하지만 다소 무거운 피동 표현입니다. ‘가져다 놓였고’가 원문의 수동 의미를 유지하면서 자연스럽습니다.
  revised_text: 그러나 당신은 하늘의 주님[a]을 거슬러 자신을 높였고, 그분의 집의 그릇들이 당신 앞에 가져다 놓였으며, 당신과 당신의 귀족들, 당신의 아내들, 당신의 첩들이 그 그릇들로 포도주를 마셨습니다. 또 당신은 은과 금, 놋과 쇠, 나무와 돌로 된 신들을 찬양하였습니다. 그들은 보지도 듣지도 알지도 못합니다. 그러나 당신의 숨이 그분의 손에 있고 당신의 모든 길이 그분께 속해 있는 하나님을 당신은 공경하지 않았습니다.
