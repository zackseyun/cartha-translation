source:
  edition: WLC
  text: וְ/עַ֣ל מָרֵֽא שְׁמַיָּ֣/א הִתְרוֹמַ֡מְתָּ וּ/לְ/מָֽאנַיָּ֨/א דִֽי בַיְתֵ֜/הּ הַיְתִ֣יו קדמי/ך ו/אנתה ו/רברבני/ך שֵֽׁגְלָתָ֣/ךְ וּ/לְחֵנָתָ/ךְ֮ חַמְרָ/א֮ שָׁתַ֣יִן בְּ/הוֹן֒ וְ/לֵֽ/אלָהֵ֣י כַסְפָּֽ/א וְ֠/דַהֲבָ/א נְחָשָׁ֨/א פַרְזְלָ֜/א אָעָ֣/א וְ/אַבְנָ֗/א דִּ֠י לָֽא חָזַ֧יִן וְ/לָא שָׁמְעִ֛ין וְ/לָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְ/לֵֽ/אלָהָ֞/א דִּֽי נִשְׁמְתָ֥/ךְ בִּ/ידֵ֛/הּ וְ/כָל אֹרְחָתָ֥/ךְ לֵ֖/הּ לָ֥א הַדַּֽרְתָּ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/023.yaml
  text: But you have exalted yourself against the Lord of heaven[a], and the vessels of his house were brought before you, and you and your nobles, your wives, and your concubines have been drinking wine from them. And you have praised the gods of silver and gold, bronze, iron, wood, and stone, which do not see or hear or know; but the God in whose hand is your breath, and to whom belong all your ways[c][b], you have not honored.
  footnotes:
  - marker: a
    text: Or 'the Master of heaven.' The Aramaic title can denote either 'lord' or 'master'; 'Lord' was chosen as the more natural elevated English rendering for God here.
    reason: lexical_alternative
  - marker: b
    text: Or 'the God who holds your breath in his hand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you have not glorified' or 'you have not given glory to.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 하늘의 주님[a]을 거슬러 스스로 높아졌고, 그분의 집 그릇들이 당신 앞에 가져와졌으며, 당신과 당신의 귀족들, 당신의 아내들, 당신의 첩들은 그것들로 포도주를 마셨습니다. 그리고 당신은 은과 금, 놋과 쇠, 나무와 돌로 된 신들을 찬양하였는데, 그들은 보지도 듣지도 알지도 못합니다. 그러나 당신의 숨이 그분의 손에 있으며, 당신의 모든 길이 그분께 속한 하나님을 당신은 높여 드리지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 주인.’ 아람어 호칭 מָרֵא는 ‘주’와 ‘주인’ 모두 가능하므로, 여기서는 하나님에 대한 더 자연스러운 높임말로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרֵא שְׁמַיָּא
  english_pob_choice: the Lord of heaven
  chosen_korean: 하늘의 주님
  alternatives_korean:
  - 하늘의 주인
  - 하늘의 주
  lexicon: HALOT
  rationale: מָרֵא는 ‘주/주인’의 뜻을 가지며, 문맥상 하나님을 가리키므로 ‘주님’으로 옮기되, ‘하늘의’로 שְׁמַיָּא를 반영했습니다.
- source_word: הִתְרוֹמַמְתָּ
  english_pob_choice: have exalted yourself
  chosen_korean: 스스로 높아졌고
  alternatives_korean:
  - 자신을 높였고
  - 교만하게 자신을 높였고
  lexicon: HALOT
  rationale: 반사적 뉘앙스를 살려 자기 과시적 고양을 드러내는 ‘스스로 높아졌고’로 옮겼습니다.
- source_word: מָאנַיָּא ... שָׁתַיִן בְּהוֹן
  english_pob_choice: the vessels ... have been drinking wine from them
  chosen_korean: 그분의 집 그릇들이 ... 당신과 당신의 귀족들, 당신의 아내들, 당신의 첩들은 그것들로 포도주를 마셨습니다
  alternatives_korean:
  - 그분의 집 그릇들이 ... 포도주를 마셨습니다
  - 그분의 집 기물들이 ... 포도주를 마셨습니다
  lexicon: HALOT
  rationale: 성전 기물을 뜻하는 מָאנַיָּא를 ‘그릇들’로, והוֹן의 도구적 의미를 ‘그것들로’로 살려 모독의 장면을 분명히 했습니다.
- source_word: שַׁבַּחְתָּ
  english_pob_choice: have praised
  chosen_korean: 찬양하였는데
  alternatives_korean:
  - 찬양하였고
  - 높여 드렸는데
  lexicon: HALOT
  rationale: 우상에 대한 경멸적 숭배를 드러내는 동사를 한국어 성서 문체에서 자연스러운 ‘찬양하다’로 옮겼습니다.
- source_word: אֱלָהָא דִּי נִשְׁמְתָךְ בִּידֵהּ
  english_pob_choice: the God in whose hand is your breath
  chosen_korean: 당신의 숨이 그분의 손에 있으며
  alternatives_korean:
  - 당신의 생명이 그분의 손에 있으며
  - 당신의 호흡이 그분의 손에 있으며
  lexicon: HALOT
  rationale: נִשְׁמָה를 ‘숨’으로 직역해 생명 유지에 대한 하나님의 직접 주권을 보존했습니다.
- source_word: וְכָל אֹרְחָתָךְ לֵהּ
  english_pob_choice: to whom belong all your ways
  chosen_korean: 당신의 모든 길이 그분께 속한
  alternatives_korean:
  - 당신의 모든 길이 그분의 것인
  - 당신의 모든 길이 그분께 달린
  lexicon: HALOT
  rationale: ‘모든 길/행로’의 소유 관계를 한국어의 자연스러운 귀속 표현인 ‘그분께 속한’으로 반영했습니다.
theological_decisions:
- issue: 하늘의 주님에 대한 호칭
  chosen_reading: 하나님에 대한 직접적 호칭으로 ‘하늘의 주님’을 사용했습니다.
  alternative_readings:
  - 하늘의 주인
  - 하늘의 주
  rationale: 문맥은 벨사살의 교만을 꾸짖는 하나님의 칭호이므로, 영어 POB의 elevated title을 한국어에서도 존칭적으로 유지했습니다.
  doctrine_reference: Translation philosophy §2; Daniel의 신적 칭호 처리 원칙
- issue: 우상과 참 하나님의 대비
  chosen_reading: ‘보지도 듣지도 알지도 못합니다’와 ‘당신의 숨이 그분의 손에 있으며’의 대조를 보존했습니다.
  alternative_readings:
  - 의역하여 ‘무력한 신들’로 정리
  - ‘생명’으로 확대
  rationale: 본문의 신학은 무생명 우상과 생명 주권을 쥔 하나님을 극적으로 대비하므로, 이미지 자체를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
