revisions:
- from: 그러나 당신은 하늘의 주님[a]을 거슬러 스스로 높아졌고, 그분의 집 그릇들이 당신 앞에 가져와졌으며, 당신과 당신의 귀족들, 당신의 아내들, 당신의 첩들은 그것들로 포도주를 마셨습니다. 그리고 당신은 은과 금, 놋과 쇠, 나무와 돌로 된 신들을 찬양하였는데, 그들은 보지도 듣지도 알지도 못합니다. 그러나 당신의 숨이 그분의 손에 있으며, 당신의 모든 길이 그분께 속한 하나님을 당신은 높여 드리지 않았습니다.
  to: 그러나 당신은 하늘의 주님[a]을 거슬러 자신을 높였고, 그분의 집의 그릇들이 당신 앞에 가져다 놓였으며, 당신과 당신의 귀족들, 당신의 아내들, 당신의 첩들이 그 그릇들로 포도주를 마셨습니다. 또 당신은 은과 금, 놋과 쇠, 나무와 돌로 된 신들을 찬양하였습니다. 그들은 보지도 듣지도 알지도 못합니다. 그러나 당신의 숨이 그분의 손에 있고 당신의 모든 길이 그분께 속해 있는 하나님을 당신은 공경하지 않았습니다.
  rationale: 원문의 대조 구조, 즉 우상들을 찬양한 행위와 생명과 모든 길을 주관하시는 하나님을 공경하지 않은 행위를 보존했습니다. ‘집’과 ‘숨’과 ‘모든 길’의 구체적 표현도 유지하되, 한국어 문장 결속과 현대적 자연스러움을 개선했습니다.
