base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/027.yaml
  text: 'Tekel: you have been weighed in the balances and found lacking[a][b][c].'
  footnotes:
  - marker: a
    text: Aramaic Tekel is the written word Daniel interprets; it is related to the idea of being weighed.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the scales.'
    reason: lexical_alternative
  - marker: c
    text: Or 'found deficient' or 'found wanting.'
    reason: lexical_alternative
translation:
  language: ko
  text: '데겔: 당신은 저울에 달려 부족한 것으로 판명되었습니다[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 Tekel은 다니엘이 해석하는 글자로, ‘달아 보다/저울질하다’는 뜻의 연관성을 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저울 위에’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘결핍된 것으로’, ‘모자란 것으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקֵ֑ל
  english_pob_choice: Tekel
  chosen_korean: 데겔
  alternatives_korean:
  - 테켈
  - 저울
  lexicon: HALOT
  rationale: 본문에 적힌 아람어 판독어를 그대로 살려야 하므로 음역을 택했습니다. ‘저울’로 풀면 이름/표지어로서의 기능과 다니엘의 해석 대상이라는 점이 흐려집니다.
- source_word: תְּקִילְתָּה
  english_pob_choice: you have been weighed
  chosen_korean: 저울에 달려
  alternatives_korean:
  - 저울에 달렸습니다
  - 달려 보였습니다
  lexicon: HALOT
  rationale: 심판적 평가를 나타내는 수동 완료의 뜻을 살려, 결과가 드러난 상태를 자연스럽게 표현했습니다. 한국어에서는 ‘저울에 달리다’가 비유를 보존하면서도 읽기 쉽습니다.
- source_word: בְמֹאזַנְיָא
  english_pob_choice: in the balances
  chosen_korean: 저울에
  alternatives_korean:
  - 저울판에
  - 천칭에
  lexicon: HALOT
  rationale: 영어 POB의 ‘balances’에 해당하는 도구를 한국어에서는 ‘저울’로 옮기는 것이 가장 자연스럽습니다. 다만 비유적 심판 장면이므로 ‘천칭’보다 평이한 ‘저울’을 택했습니다.
- source_word: חַסִּיר
  english_pob_choice: lacking
  chosen_korean: 부족한 것으로
  alternatives_korean:
  - 결핍된 것으로
  - 모자란 것으로
  - 부족하다고
  lexicon: HALOT
  rationale: 단순한 수량 부족이 아니라 평가 후 드러난 결핍을 뜻하므로, 판정 결과를 드러내는 ‘부족한 것으로’가 적절합니다.
theological_decisions:
- issue: 판정 비유를 설명으로 평탄화할지 여부
  chosen_reading: 저울에 달아 부족함이 드러났다는 심판적 평가의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님께서 당신을 심판하셨습니다’처럼 판정을 직접 풀어 쓰는 번역
  - 상업적 무게 측정만 가리키는 문자적 표현
  rationale: 본문은 상징적 저울질 이미지를 통해 왕의 평가 절하를 드러냅니다. 이를 신학적 설명으로 바꾸기보다, 원문의 이미지와 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy items 1, 3, and 6
