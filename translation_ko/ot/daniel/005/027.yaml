  - 저울판에
  - 천칭에
  lexicon: HALOT
  rationale: 영어 POB의 ‘balances’에 해당하는 도구를 한국어에서는 ‘저울’로 옮기는 것이 가장 자연스럽습니다. 다만 비유적 심판 장면이므로 ‘천칭’보다 평이한 ‘저울’을 택했습니다.
- source_word: חַסִּיר
  english_pob_choice: lacking
  chosen_korean: 부족한 것으로
  alternatives_korean:
  - 결핍된 것으로
  - 모자란 것으로
  - 부족하다고
  lexicon: HALOT
  rationale: 단순한 수량 부족이 아니라 평가 후 드러난 결핍을 뜻하므로, 판정 결과를 드러내는 ‘부족한 것으로’가 적절합니다.
