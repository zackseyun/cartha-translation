  naturalness: ‘당신은 저울에 달려 부족한 것으로 판명되었습니다’는 문법상 가능하지만, 현대 표준 한국어의 성경 문체로는 ‘당신’의 직접 호칭이 부자연스럽고 ‘저울에 달려’와 ‘판명되었습니다’의 연결도 다소 경직됩니다. 주어를 생략하고 ‘저울에 달려서 부족한 것으로 드러났습니다’로 하면 합쇼체를 유지하면서 자연스럽습니다.
  terminology: ‘데겔’은 아람어 תְּקֵל의 통용되는 한국어 음역으로 적절합니다. ‘저울’과 ‘부족한 것으로’도 본문의 측량·결핍 비유를 잘 보존합니다. 각주 a의 ‘글자’는 단일 문자라기보다 기록된 말/단어를 가리키므로 ‘말’로 바로잡는 것이 정확합니다. 각주 c의 ‘결핍된’은 이 문맥에서 다소 부자연스러워 ‘부족하다고’를 제시합니다.
