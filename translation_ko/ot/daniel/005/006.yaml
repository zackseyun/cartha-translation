id: DAN.5.6
reference: Daniel 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱדַ֤יִן מַלְכָּ/א֙ זִיוֺ֣/הִי שְׁנ֔וֹ/הִי וְ/רַעיֹנֹ֖/הִי יְבַהֲלוּנֵּ֑/הּ וְ/קִטְרֵ֤י חַרְצֵ/הּ֙ מִשְׁתָּרַ֔יִן וְ/אַ֨רְכֻבָּתֵ֔/הּ דָּ֥א לְ/דָ֖א נָֽקְשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/006.yaml
  text: Then the king’s color changed[a], and his thoughts terrified him; the joints of his hips gave way[b], and his knees knocked against each other.
  footnotes:
  - marker: a
    text: Or, more literally, 'his brightness changed.' The Aramaic idiom refers to his appearance or complexion changing from fear.
    reason: lexical_alternative
  - marker: b
    text: Or 'the joints of his loins were loosened.' The expression describes physical weakness or collapse brought on by terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕의 얼굴빛이 변하였고, 그의 생각들이 그를 두렵게 하였으며, 그의 허리의 관절들이 풀리고 그의 무릎이 서로 부딪쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 빛남/광채가 변하였다’에 가깝습니다. 이 아람어 관용구는 두려움으로 인한 얼굴빛이나 용모의 변화를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 허리의 관절들이 풀렸다’에 가깝습니다. 공포로 인한 신체적 무력감이나 붕괴를 묘사하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִיוֺהִי שְׁנוֹהִי
  english_pob_choice: his color changed
  chosen_korean: 얼굴빛이 변하였고
  alternatives_korean:
  - 얼굴색이 변하였고
  - 겉모습이 변하였고
  - 빛남이 변하였고
  lexicon: HALOT
  rationale: 아람어 관용구가 두려움으로 인한 외형 변화, 특히 안색 변화를 가리키므로 ‘얼굴빛’이 가장 자연스럽고 원문 의미를 잘 드러냅니다.
- source_word: רַעְיוֹנֹהִי
  english_pob_choice: his thoughts
  chosen_korean: 그의 생각들이
  alternatives_korean:
  - 그의 마음이
  - 그의 심중이
  - 그의 생각
  lexicon: HALOT
  rationale: 명사 복수형의 뉘앙스를 살려 ‘생각들’로 옮기되, 한국어 흐름상 복수 표지를 과도하게 강조하지 않고 자연스럽게 처리했습니다.
- source_word: קִטְרֵי חַרְצֵהּ מִשְׁתָּרַיִן
  english_pob_choice: the joints of his hips gave way
  chosen_korean: 그의 허리의 관절들이 풀리고
  alternatives_korean:
  - 그의 허리의 마디들이 풀리고
  - 그의 엉덩이 관절들이 풀리고
  - 그의 허리 관절들이 무너지고
  lexicon: HALOT
  rationale: 직역하면 ‘엉덩이/허리의 관절들’이지만, 두려움으로 인한 신체적 무너짐을 한국어로 가장 분명하게 전하려고 ‘허리의 관절들’과 ‘풀리고’를 택했습니다.
- source_word: אַרְכֻבָּתֵהּ דָּא לְדָא נָקְשָׁן
  english_pob_choice: his knees knocked against each other
  chosen_korean: 그의 무릎이 서로 부딪쳤습니다
  alternatives_korean:
  - 그의 무릎이 서로 마주쳤습니다
  - 그의 무릎이 서로 짝짝 부딪쳤습니다
  - 그의 무릎이 맞부딪쳤습니다
  lexicon: HALOT
  rationale: 무릎이 공포로 떨리며 서로 치는 이미지를 살리기 위해 ‘서로 부딪쳤습니다’로 옮겼습니다.
theological_decisions:
- issue: 두려움이 초래한 신체 반응의 묘사
  chosen_reading: 본문의 연속적 신체 반응을 약화시키지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘얼굴이 창백해졌다’처럼 완화하는 번역
  - ‘기가 꺾였다’처럼 심리화하는 번역
  rationale: 아람어는 왕의 공포가 얼굴빛 변화, 사고의 동요, 신체의 붕괴로 이어지는 과정을 단계적으로 묘사하므로, 이를 그대로 살려 서술했습니다.
  doctrine_reference: 본문 서사 묘사; 출 15:16, 단 5:6 병행적 공포 묘사 맥락
- issue: ‘허리의 관절들’의 신체 이미지
  chosen_reading: 의역을 허용하되, 공포로 인한 육체적 약화를 분명히 드러냈습니다.
  alternative_readings:
  - ‘허리의 마디들’로 더 문자적으로
  - ‘엉덩이뼈가 풀렸다’처럼 해부학적으로
  rationale: 원문은 관용적이고 다소 난해하므로, 과도한 해부학적 세부화보다 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 원문 관용구 해석
