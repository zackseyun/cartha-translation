theological_decisions:
- issue: 두려움이 초래한 신체 반응의 묘사
  chosen_reading: 본문의 연속적 신체 반응을 약화시키지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘얼굴이 창백해졌다’처럼 완화하는 번역
  - ‘기가 꺾였다’처럼 심리화하는 번역
  rationale: 아람어는 왕의 공포가 얼굴빛 변화, 사고의 동요, 신체의 붕괴로 이어지는 과정을 단계적으로 묘사하므로, 이를 그대로 살려 서술했습니다.
  doctrine_reference: 본문 서사 묘사; 출 15:16, 단 5:6 병행적 공포 묘사 맥락
- issue: ‘허리의 관절들’의 신체 이미지
  chosen_reading: 의역을 허용하되, 공포로 인한 육체적 약화를 분명히 드러냈습니다.
  alternative_readings:
  - ‘허리의 마디들’로 더 문자적으로
  - ‘엉덩이뼈가 풀렸다’처럼 해부학적으로
  rationale: 원문은 관용적이고 다소 난해하므로, 과도한 해부학적 세부화보다 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 원문 관용구 해석
