  yaml_path: translation/ot/daniel/005/006.yaml
  text: Then the king’s color changed[a], and his thoughts terrified him; the joints of his hips gave way[b], and his knees knocked against each other.
  footnotes:
  - marker: a
    text: Or, more literally, 'his brightness changed.' The Aramaic idiom refers to his appearance or complexion changing from fear.
    reason: lexical_alternative
  - marker: b
    text: Or 'the joints of his loins were loosened.' The expression describes physical weakness or collapse brought on by terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕의 낯빛이 변하였고[a], 그의 생각이 그를 두렵게 하였으며, 그의 허리 관절들이 풀리고[b], 그의 무릎이 서로 부딪쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 빛남/광채가 변하였다’에 가깝습니다. 이 아람어 관용구는 두려움으로 인한 낯빛이나 용모의 변화를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 허리의 관절들이 풀렸다’에 가깝습니다. 공포로 인한 신체적 무력감이나 붕괴를 묘사하는 표현입니다.
    reason: lexical_alternative
