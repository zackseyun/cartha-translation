  to: 하지만 저는 당신이 해석을 제시하고 어려운 문제들을 풀 수 있다고 들었습니다[a]. 이제 당신이 그 글을 읽고 그 해석을 저에게 알려 줄 수 있다면, 당신은 자주색 옷을 입게 될 것이며, 금 사슬이 당신의 목에 둘러질 것이며, 왕국에서 셋째 통치자로 다스리게 될 것입니다[b].
