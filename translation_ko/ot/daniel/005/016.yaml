source:
  edition: WLC
  text: וַ/אֲנָה֙ שִׁמְעֵ֣ת עלי/ך דִּֽי תוכל פִּשְׁרִ֛ין לְ/מִפְשַׁ֖ר וְ/קִטְרִ֣ין לְ/מִשְׁרֵ֑א כְּעַ֡ן הֵן֩ תוכל כְּתָבָ֜/א לְ/מִקְרֵ֗א וּ/פִשְׁרֵ/הּ֙ לְ/הוֹדָ֣עֻתַ֔/נִי אַרְגְּוָנָ֣/א תִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארָ֔/ךְ וְ/תַלְתָּ֥א בְ/מַלְכוּתָ֖/א תִּשְׁלַֽט־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/016.yaml
  text: But I have heard about you that you are able to give interpretations and to solve difficulties[a]. Now, if you are able to read the writing and make its interpretation known to me, you shall be clothed with purple, and a chain of gold shall be put around your neck[b], and you shall rule as third in the kingdom.
  footnotes:
  - marker: a
    text: Aramaic literally, 'to loose knots,' an idiom for solving difficult problems or resolving perplexities.
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall be the third ruler in the kingdom.' The phrase likely refers to third rank in the realm.
    reason: alternative_reading
translation:
  language: ko
  text: 하지만 저는 당신이 해석을 제시하고 어려운 문제들을 풀 수 있다고 들었습니다[a]. 이제 당신이 그 글을 읽고 그 해석을 저에게 알려 줄 수 있다면, 당신은 자주색 옷을 입게 될 것이며, 금 사슬이 당신의 목에 둘러질 것이며, 왕국에서 셋째 통치자로 다스리게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘매듭들을 푼다’는 뜻의 아람어 관용으로, 난해한 문제를 해결한다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕국에서 셋째 지위에 오르게 될 것입니다.’ 이 표현은 아마도 왕국에서 셋째 서열의 지위를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנָה
  english_pob_choice: But I
  chosen_korean: 하지만 저는
  alternatives_korean:
  - 그리고 저는
  - 저는
  lexicon: HALOT
  rationale: 화자의 말 전환과 대비를 살리기 위해 역접 ‘하지만’을 두었고, 독립 인칭대명사는 현대 한국어의 자연스러운 공손한 서술에 맞게 ‘저는’으로 옮겼습니다.
- source_word: פִּשְׁרִין לְמִפְשַׁר
  english_pob_choice: to give interpretations
  chosen_korean: 해석을 제시하고
  alternatives_korean:
  - 해석들을 주고
  - 풀이를 해 주고
  lexicon: HALOT
  rationale: 아람어의 ‘풀다/해석하다’ 관용을 한국어에서 가장 자연스럽게 드러내기 위해 단순한 ‘해석하다’보다 결과를 드러내는 ‘해석을 제시하다’로 옮겼습니다.
- source_word: וְקִטְרִין לְמִשְׁרֵא
  english_pob_choice: to solve difficulties
  chosen_korean: 어려운 문제를 풀어낼 수 있다고
  alternatives_korean:
  - 난제를 풀 수 있다고
  - 매듭을 풀 수 있다고
  lexicon: HALOT
  rationale: 직역하면 ‘매듭을 푼다’는 관용이지만, 한국어에서는 의미를 분명히 하는 ‘어려운 문제를 풀어내다’가 본문 의도를 더 잘 전달합니다.
- source_word: אַרְגְּוָנָא תִלְבַּשׁ
  english_pob_choice: you shall be clothed with purple
  chosen_korean: 자주색 옷을 입고
  alternatives_korean:
  - 보랏빛 옷을 입고
  - 자주옷을 입고
  lexicon: HALOT
  rationale: 왕실의 명예 수여를 나타내는 의복 표현으로서, 고색창연한 어휘보다 현대 독자가 바로 이해할 수 있는 ‘자주색 옷’이 적절합니다.
- source_word: וְהַמּוֹנְכָא דִי דַהֲבָא עַל צַוְּארָךְ
  english_pob_choice: and a chain of gold shall be put around your neck
  chosen_korean: 금 사슬이 당신의 목에 둘러질 것이며
  alternatives_korean:
  - 금목걸이가 당신 목에 놓일 것이며
  - 금 사슬이 목에 놓일 것이며
  lexicon: HALOT
  rationale: 장식적 금사슬을 가리키되, 수여되는 명예의 표지를 살리기 위해 수동형 ‘둘러질 것’으로 처리했습니다.
- source_word: וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט
  english_pob_choice: and you shall rule as third in the kingdom
  chosen_korean: 왕국에서 셋째 자리를 차지하게 될 것입니다
  alternatives_korean:
  - 왕국에서 셋째 통치자가 될 것입니다
  - 왕국에서 셋째 권세를 갖게 될 것입니다
  lexicon: HALOT
  rationale: 해당 구절은 단순 서열 표지이므로, 통치 행위보다 ‘셋째 자리/위치’를 드러내는 번역이 본문의 정치적 맥락과 영어 POB의 해석을 잘 반영합니다.
theological_decisions:
- issue: 다니엘에게 주어지는 보상과 권위의 성격
  chosen_reading: ‘셋째 자리’로 옮겨, 벨사살이 줄 수 있는 왕국 내 서열상의 지위를 강조했습니다.
  alternative_readings:
  - ‘셋째 통치자’
  - ‘왕국의 셋째 통치자’
  rationale: 아람어 표현은 능동적 통치 행위보다 서열과 위상을 가리키는 문맥이 강하므로, 본문이 암시하는 정치적 제한을 과장하지 않도록 처리했습니다.
  doctrine_reference: 역사서 본문 해석 원칙
