id: DAN.5.8
reference: Daniel 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱדַ֨יִן֙ עללין כֹּ֖ל חַכִּימֵ֣י מַלְכָּ֑/א וְ/לָֽא כָהֲלִ֤ין כְּתָבָ/א֙ לְ/מִקְרֵ֔א ו/פשר/א לְ/הוֹדָעָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/008.yaml
  text: Then all the king’s wise men came in[b][a], but they were not able to read the writing or make its interpretation known to the king.
  footnotes:
  - marker: a
    text: Or 'read the inscription.' The Aramaic term can refer to the written message itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'tell the king its meaning.' The Aramaic word for 'interpretation' is a recurring term in Daniel for explaining a mysterious message or dream.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕의 모든 박사들이 들어왔지만, 그들은 그 글을 읽지도 못하고 그것의 해석을 왕에게 알려주지도 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 글(문구/비문)을 읽다’. 아람어는 적힌 메시지 자체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕에게 그 뜻을 말하다’. ‘해석’에 해당하는 아람어는 다니엘서에서 수수께끼 같은 메시지를 푸는 뜻으로 반복됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 서사 전개를 잇는 담화 표지로서, 현대 한국어에서 자연스러운 시간 연결 표현인 ‘그때’로 옮겼습니다.
- source_word: כֹּל חַכִּימֵי מַלְכָּא
  english_pob_choice: all the king’s wise men
  chosen_korean: 왕의 모든 박사들
  alternatives_korean:
  - 왕의 모든 지혜자들
  - 왕궁의 모든 박사들
  lexicon: HALOT
  rationale: 바벨론 궁정의 전문 지식인 집단을 가리키므로, 본문 전통에 맞는 ‘박사들’을 기본으로 하되 왕에게 속한 집단임을 분명히 했습니다.
- source_word: כְּתָבָא לְמִקְרֵא
  english_pob_choice: to read the writing
  chosen_korean: 그 글을 읽지도
  alternatives_korean:
  - 그 글을 해독하지도
  - 그 글을 읽어 내지도
  lexicon: HALOT
  rationale: כְּתָבָא 는 단순한 ‘글’이 아니라 적힌 메시지를 가리킬 수 있으나, 문맥상 ‘읽다’가 핵심이므로 자연스러운 ‘그 글을 읽다’로 옮겼습니다. 'read the inscription'의 가능성도 본문상 열어 두었습니다.
- source_word: וּפִשְׁרָא לְהוֹדָעָה לְמַלְכָּא
  english_pob_choice: to make its interpretation known to the king
  chosen_korean: 그것의 해석을 왕에게 알려주지도
  alternatives_korean:
  - 그 뜻을 왕에게 알려주지도
  - 그 해석을 왕에게 설명해 주지도
  lexicon: HALOT
  rationale: Daniel 본문에서 פְּשַׁר 계열은 수수께끼 같은 문구의 ‘해석/풀이’를 뜻하므로, 이를 직접 반영해 ‘해석’으로 옮기고 ‘알려주다’로 사역적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 궁정 지혜자 집단의 호칭
  chosen_reading: ‘박사들’로 번역해 다니엘서에서 반복되는 바벨론 지혜자 집단의 기능을 드러냈습니다.
  alternative_readings:
  - 지혜자들
  - 현자들
  rationale: 전통적 교회어 ‘지혜자들’도 가능하지만, 한국어에서의 관용성과 다니엘서 내 동일 집단 표지를 고려해 ‘박사들’이 가장 자연스럽습니다.
  doctrine_reference: Daniel 2–5의 궁정 지혜자 묘사
