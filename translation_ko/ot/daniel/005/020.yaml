  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/דִי֙ רִ֣ם לִבְבֵ֔/הּ וְ/רוּחֵ֖/הּ תִּֽקְפַ֣ת לַ/הֲזָדָ֑ה הָנְחַת֙ מִן כָּרְסֵ֣א מַלְכוּתֵ֔/הּ וִֽ/יקָרָ֖/ה הֶעְדִּ֥יוּ מִנֵּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/020.yaml
  text: But when his heart was lifted up and his spirit was hardened in arrogance[a], he was brought down from his royal throne[b], and his glory was taken away from him.
  footnotes:
  - marker: a
    text: Or 'his spirit grew arrogant' or 'his spirit became strong in presumption.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his honor' or 'his majesty was taken away from him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 마음이 높아지고 그의 영이 오만함 속에서 굳어졌을 때, 그는 왕위에서 끌어내려졌고 그의 영광도 그에게서 빼앗겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영이 교만해졌다’ 혹은 ‘그의 영이 주제넘은 확신으로 강해졌다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 명예’ 혹은 ‘그의 위엄’이 그에게서 빼앗겼다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְדִי
  english_pob_choice: But when
  chosen_korean: 그러나 … 때
  alternatives_korean:
  - 그리고 … 때
  - 그때
  lexicon: HALOT
  rationale: 앞 절과의 대비를 살리기 위해 역접인 ‘그러나’를 두고, 아람어의 시간 절은 한국어의 ‘…했을 때’로 자연스럽게 옮겼습니다.
- source_word: רִם לִבְבֵהּ
  english_pob_choice: his heart was lifted up
  chosen_korean: 그의 마음이 높아지고
  alternatives_korean:
  - 그의 마음이 들떠 오르고
  - 그의 마음이 교만해지고
  lexicon: HALOT
  rationale: ‘마음이 높아지다’는 비유를 살려, 단순한 해석어인 ‘교만해지다’보다 원문의 상승 이미지를 더 직접적으로 반영했습니다.
- source_word: וְרוּחֵהּ תִּקְפַת לַהֲזָדָה
  english_pob_choice: his spirit was hardened in arrogance
  chosen_korean: 그의 영이 오만함 속에서 굳어졌습니다
  alternatives_korean:
  - 그의 영이 무례한 자신감으로 강해졌습니다
  - 그의 영이 분별 없이 대담해졌습니다
  lexicon: HALOT
  rationale: תִּקְפַת의 ‘굳어짐/강해짐’과 לַהֲזָדָה의 ‘오만/주제넘음’을 함께 살리기 위해 ‘오만함 속에서 굳어졌다’로 옮겼습니다.
- source_word: הָנְחַת מִן כָּרְסֵא מַלְכוּתֵהּ
  english_pob_choice: he was brought down from his royal throne
  chosen_korean: 그는 왕위에서 끌어내려졌고
  alternatives_korean:
  - 그는 왕좌에서 내려졌고
  - 그는 왕좌에서 쫓겨났고
  lexicon: HALOT
  rationale: 수동적 굴욕과 전복의 뉘앙스를 살리기 위해 ‘끌어내려지다’를 선택했고, ‘왕위’로 왕권의 자리를 자연스럽게 표현했습니다.
- source_word: וִיקָרֵהּ
  english_pob_choice: his glory
  chosen_korean: 그의 영광
  alternatives_korean:
  - 그의 명예
  - 그의 위엄
  - 그의 존귀
  lexicon: HALOT
  rationale: 본문의 왕적 맥락에서 יְקָר의 의미를 ‘영광’으로 옮겨, 단순한 사회적 명예보다 상실된 왕의 위상을 드러냈습니다.
theological_decisions:
- issue: 이 절의 심판 주체를 명시할지 여부
  chosen_reading: 이 절 자체는 하나님을 직접 언급하지 않으므로, 왕의 교만과 그에 따른 굴욕만을 진술했습니다.
  alternative_readings:
  - 문맥상 하나님의 심판을 명시적으로 드러내는 번역
  - 암시된 신적 주체를 문장에 삽입하는 번역
  rationale: 본문의 직접 표현을 넘어서지 않으면서, 앞뒤 문맥이 이 굴욕의 궁극적 배후를 밝히도록 두는 것이 원문에 더 충실합니다.
  doctrine_reference: translation philosophy §1, §3
