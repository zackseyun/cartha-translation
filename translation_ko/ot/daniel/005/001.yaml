source:
  edition: WLC
  text: בֵּלְשַׁאצַּ֣ר מַלְכָּ֗/א עֲבַד֙ לְחֶ֣ם רַ֔ב לְ/רַבְרְבָנ֖וֹ/הִי אֲלַ֑ף וְ/לָ/קֳבֵ֥ל אַלְפָּ֖/א חַמְרָ֥/א שָׁתֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/001.yaml
  text: King Belshazzar made a great feast for a thousand of his nobles[a], and in the presence of the thousand he was drinking wine.
  footnotes:
  - marker: a
    text: Or 'and before the thousand he drank wine.' The Aramaic expression can be rendered more literally with 'before,' but here likely means that he was drinking publicly in the presence of the thousand guests.
    reason: lexical_alternative
translation:
  language: ko
  text: 벨사살 왕이 그의 귀족들 천 명을 위하여 큰 잔치를 베풀었고, 그 천 명 앞에서[a] 포도주를 마시고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 천 명 앞에서 포도주를 마셨다.’ 아람어 표현은 더 문자적으로 ‘앞에서’로 옮길 수 있으나, 여기서는 그가 천 명의 손님 앞에서 공개적으로 포도주를 마시고 있었음을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  english_pob_choice: King
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  lexicon: HALOT
  rationale: 상태형 명사가 벨사살의 호칭처럼 쓰이므로 이름 앞에 자연스럽게 ‘왕’을 두었습니다.
- source_word: עֲבַד לְחֶם רַב
  english_pob_choice: made a great feast
  chosen_korean: 큰 잔치를 베풀었고
  alternatives_korean:
  - 큰 잔치를 열었고
  - 큰 잔치를 마련했고
  lexicon: HALOT
  rationale: ‘עשה/עשה לחם’ 계열의 잔치 문맥을 한국어에서 가장 자연스럽게 풀어 ‘잔치를 베풀다’로 옮겼습니다.
- source_word: לְרַבְרְבָנֹוהִי
  english_pob_choice: for ... his nobles
  chosen_korean: 그의 귀족들
  alternatives_korean:
  - 그의 귀인들
  - 그의 고관들
  lexicon: HALOT
  rationale: 궁정 맥락의 고위 인사들을 가리키므로 현대 한국어에서 통하는 ‘귀족들’로 옮겼습니다.
- source_word: וְלָקֳבֵל אַלְפָּא
  english_pob_choice: in the presence of the thousand
  chosen_korean: 그 천 명 앞에서
  alternatives_korean:
  - 그 천 명의 면전에서
  - 천 명이 보는 앞에서
  lexicon: HALOT
  rationale: 단순한 위치보다 공개적·면전적 상황을 드러내는 표현이라 ‘앞에서’로 자연스럽게 살렸습니다.
- source_word: שָׁתֵה
  english_pob_choice: he was drinking
  chosen_korean: 술을 마시고 있었습니다
  alternatives_korean:
  - 마시고 있었습니다
  - 포도주를 마시고 있었습니다
  lexicon: HALOT
  rationale: 진행형의 상태를 반영해 ‘-고 있었습니다’로 옮겼고, ‘wine’은 여기서 문맥상 술/포도주 모두 가능하지만 간결하게 ‘술’로 처리했습니다.
