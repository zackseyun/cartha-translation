  text: They drank the wine and praised the gods of gold and silver[a], bronze, iron, wood, and stone.
  footnotes:
  - marker: a
    text: Or 'copper' for 'bronze.' The Aramaic term can denote copper or bronze; 'bronze' best fits the conventional material list for idols here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 포도주를 마시고, 금과 은[a], 놋, 철, 나무, 돌로 된 신들을 찬양했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놋’은 본문의 נְחָשָׁא가 구리 또는 청동을 뜻할 수 있는 점을 반영한 번역입니다. 여기서는 우상 재료 목록의 관용적 표현에 따라 ‘놋’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשְׁתִּיו
  english_pob_choice: They drank
  chosen_korean: 그들은 포도주를 마시고
  alternatives_korean:
  - 그들은 마셨습니다
  - 그들은 포도주를 마셨습니다
  lexicon: HALOT
  rationale: 동사의 완료적 서술을 한국어 서술형으로 자연스럽게 옮기되, 앞절의 연속 동작을 살려 ‘마시고’로 연결했습니다.
- source_word: חַמְרָא
  english_pob_choice: the wine
  chosen_korean: 포도주
  alternatives_korean:
  - 그 포도주
  - 술
  lexicon: HALOT
  rationale: 문맥상 특정 잔치의 포도주이지만, 한국어에서는 관사를 드러내기보다 ‘포도주’로 자연스럽게 옮기는 것이 좋습니다.
- source_word: וְשַׁבַּחוּ
  english_pob_choice: and praised
  chosen_korean: 찬양했습니다
  alternatives_korean:
  - 찬송했습니다
  - 찬미했습니다
  - 영광을 돌렸습니다
  lexicon: HALOT
  rationale: 우상 숭배의 종교적 행위를 드러내는 동사로서, 일반적인 ‘칭찬하다’보다 예배적 뉘앙스가 있는 ‘찬양하다’가 적절합니다.
- source_word: לֵאלָהֵי
  english_pob_choice: the gods of
  chosen_korean: 신들을
  alternatives_korean:
  - 신들
  - 하나님
  - 우상들
  lexicon: HALOT
  rationale: 복수형과 뒤따르는 재료 목록이 우상 신들을 가리키므로, 단수 ‘하나님’이 아니라 복수 ‘신들’로 옮겨야 합니다.
- source_word: נְחָשָׁא
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  - 놋쇠
  lexicon: HALOT
  rationale: 성경 한국어에서 금속 목록의 관용적 대응은 ‘놋’이며, 본문이 우상 재료 목록이라는 점에서도 가장 자연스럽습니다.
theological_decisions:
- issue: אֱלָהֵי의 대상이 ‘하나님’인지 ‘신들’인지
  chosen_reading: 신들
  alternative_readings:
  - 하나님
  - 신
  rationale: 원문 복수형과 금·은·놋·철·나무·돌의 재료 목록은 이 대상이 바벨론의 우상 신들임을 분명히 하므로, 단수적 유일신 표현은 원문 의미를 훼손합니다.
  doctrine_reference: 'Translation philosophy #1'
