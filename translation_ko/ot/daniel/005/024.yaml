base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/024.yaml
  text: Then from before him the palm of a hand was sent[b][a], and this writing was inscribed.
  footnotes:
  - marker: a
    text: Or 'from his presence.' The Aramaic is literally 'from before him,' indicating origin from the presence of the one just mentioned.
    reason: lexical_alternative
  - marker: b
    text: Or 'this inscription was written.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그분 앞에서[a] 한 손의 손바닥이 보내졌고, 이 글이[b] 기록되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 앞에서’입니다. 문맥상 앞 절에 언급된 분의 현존에서 비롯됨을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기록되었습니다’는 원문의 ‘쓰이다/새겨지다’를 포괄적으로 옮긴 것입니다. 상황상 ‘새겨졌습니다’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그리하여
  lexicon: HALOT
  rationale: 담화 표지로서 사건의 진행을 자연스럽게 이어 주는 말이므로, 현대 한국어에서 간결하고 문맥에 맞는 ‘그때’를 택했습니다.
- source_word: מִן קֳדָמוֹהִי
  english_pob_choice: from before him
  chosen_korean: 그분 앞에서
  alternatives_korean:
  - 그분의 임재 앞에서
  - 그분의 앞에서
  lexicon: HALOT
  rationale: 직역의 공간적 이미지를 살리면서도 한국어에서 어색하지 않게 옮겼습니다. 본문이 하나님의 현존에서 나온다는 뉘앙스를 유지하되, 본문 이상으로 풀어 쓰지는 않았습니다.
- source_word: פַּסָּא דִי יְדָא
  english_pob_choice: the palm of a hand
  chosen_korean: 손의 손바닥
  alternatives_korean:
  - 손바닥
  - 한 손의 손바닥
  lexicon: HALOT
  rationale: 아람어의 부분 표현을 그대로 드러내기 위해 ‘손의 손바닥’으로 옮겼습니다. 환시에서 갑작스럽게 나타난 손의 일부라는 느낌을 살리면서도 한국어 문장 안에서 이해 가능하게 했습니다.
- source_word: וּכְתָבָא דְנָה רְשִׁים
  english_pob_choice: and this writing was inscribed
  chosen_korean: 이 글이 기록되었습니다
  alternatives_korean:
  - 이 글이 새겨졌습니다
  - 이 기록이 쓰였습니다
  lexicon: HALOT
  rationale: 문맥상 벽에 나타난 글자를 가리키므로 ‘글’로 옮기되, ‘기록되었습니다’로 받아 적힌 결과를 강조했습니다. ‘새겨졌습니다’도 가능하지만, 본문이 반드시 물리적 각인을 뜻한다고 단정하지 않도록 했습니다.
theological_decisions:
- issue: ‘from before him’의 신학적 함의
  chosen_reading: 하나님의 현존에서 나온 표지라는 이미지를 유지하면서도, 본문에 없는 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - 단순히 ‘그분에게서’라고 완화하여 옮길 수 있습니다.
  - 명시적으로 ‘하나님의 임재 앞에서’라고 해석할 수 있습니다.
  rationale: 아람어는 문자적으로 ‘그 앞에서’의 공간적 표현을 사용하므로, 환시의 출처와 위엄을 살리되 번역이 과도하게 해석을 앞서지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
