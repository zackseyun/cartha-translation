  naturalness: ‘그러나 그의 아들인 벨사살이여, 당신은 …’은 성경적 직접 호칭을 유지하면서도 현대 표준어 합쇼체에서 자연스럽습니다. 소유격 ‘당신의 마음’은 한국어에서 문맥상 분명하므로 ‘마음을’으로 처리해 반복을 줄였습니다.
