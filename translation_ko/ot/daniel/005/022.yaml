id: DAN.5.22
reference: Daniel 5:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/אנתה בְּרֵ/הּ֙ בֵּלְשַׁאצַּ֔ר לָ֥א הַשְׁפֵּ֖לְתְּ לִבְבָ֑/ךְ כָּ/ל קֳבֵ֕ל דִּ֥י כָל דְּנָ֖ה יְדַֽעְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/022.yaml
  text: But you[a], his son, Belshazzar, have not humbled your heart, though you knew all this.
  footnotes:
  - marker: a
    text: Aramaic 'his son' can also mean 'his descendant' or 'his successor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그의 아들[a]인 벨사살이여, 당신은 이 모든 일을 알면서도 마음을 낮추지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 ‘그의 아들’은 ‘그의 후손’ 또는 ‘그의 계승자’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 당신은
  alternatives_korean:
  - 그리고 당신은
  - 하지만 당신은
  lexicon: HALOT
  rationale: 앞절의 느부갓네살 이야기와 대조를 이루는 역접을 살리되, 합쇼체에서 자연스러운 문두 전환으로 옮겼습니다.
- source_word: בְּרֵהּ
  english_pob_choice: his son
  chosen_korean: 그의 아들이요
  alternatives_korean:
  - 그의 후손이요
  - 그의 계승자요
  lexicon: HALOT
  rationale: 직역에 가까운 '아들'을 유지하되, 한국어 문맥에서 호격 앞 연결을 자연스럽게 하도록 '-이요'로 처리했습니다. 혈통·승계의 넓은 가능성은 본문 그대로 남깁니다.
- source_word: הַשְׁפֵּלְתְּ לִבְבָךְ
  english_pob_choice: have not humbled your heart
  chosen_korean: 당신의 마음을 낮추지 않았습니다
  alternatives_korean:
  - 당신의 마음을 겸손하게 하지 않았습니다
  - 당신의 마음을 낮추지 않으셨습니다
  lexicon: HALOT
  rationale: 아람어 관용구를 한국어에서 바로 알아들을 수 있도록 '마음을 낮추다'로 옮겼습니다. '겸손하게 하다'보다 원문의 '낮추다'가 더 직접적입니다.
- source_word: כָל דְּנָה
  english_pob_choice: all this
  chosen_korean: 이 모든 것을
  alternatives_korean:
  - 이 모든 일들을
  - 모든 이것을
  lexicon: HALOT
  rationale: 앞선 나보니드/느부갓네살의 사건을 가리키는 지시어를 분명하게 살리면서도, 한국어에서 자연스러운 총칭으로 옮겼습니다.
theological_decisions:
- issue: ‘his son’의 관계 표현을 어떻게 유지할 것인가
  chosen_reading: 본문의 계보적 표현을 풀지 않고 '그의 아들이요'로 유지했습니다.
  alternative_readings:
  - 그의 후손이요
  - 그의 계승자요
  rationale: 아람어 표현은 문자적 아들과 왕조적 후손/후계자 모두를 포괄할 수 있으므로, 번역이 역사 조화를 미리 결정하지 않도록 본문 표현을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 해석적 조화보다 본문이 지닌 긴장을 보존
- issue: ‘heart’를 심리적 의미로 완화할지 여부
  chosen_reading: ‘마음’을 유지했습니다.
  alternative_readings:
  - 마음속
  - 속사람
  rationale: 성경적 인간 이해에서 '마음'은 의지·생각·판단을 포함하는 중심을 가리키므로, 단순 감정으로 좁히지 않고 원문의 인류학적 의미를 살렸습니다.
  doctrine_reference: 성경적 인류학에서의 ‘heart’
