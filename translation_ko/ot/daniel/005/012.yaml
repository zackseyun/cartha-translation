id: DAN.5.12
reference: Daniel 5:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֡ל דִּ֣י ר֣וּחַ יַתִּירָ֡ה וּ/מַנְדַּ֡ע וְ/שָׂכְלְתָנ֡וּ מְפַשַּׁ֣ר חֶלְמִין֩ וַֽ/אַֽחֲוָיַ֨ת אֲחִידָ֜ן וּ/מְשָׁרֵ֣א קִטְרִ֗ין הִשְׁתְּכַ֤חַת בֵּ/הּ֙ בְּ/דָ֣נִיֵּ֔אל דִּֽי מַלְכָּ֥/א שָׂם שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר כְּעַ֛ן דָּנִיֵּ֥אל יִתְקְרֵ֖י וּ/פִשְׁרָ֥/ה יְהַֽחֲוֵֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/012.yaml
  text: because an extraordinary spirit[a], knowledge, and understanding to interpret dreams, explain riddles, and solve difficulties were found in him, in Daniel, whom the king named Belteshazzar. Now let Daniel be called[c][b], and he will show the interpretation.
  footnotes:
  - marker: a
    text: Or 'an excellent spirit.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'solve knots,' a metaphor for resolving difficult problems.
    reason: cultural_note
  - marker: c
    text: Or 'he will make known the interpretation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 꿈을 풀이하고 수수께끼를 해석하며 어려운 문제를 푸는 데 탁월한 영과 지식과 총명이 발견되었기 때문입니다. 곧, 왕이 벨드사살이라 이름 붙인 그 다니엘에게서 그러했습니다. 이제 다니엘을 부르십시오. 그러면 그가 해석을 알려 줄 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뛰어난 영’.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘매듭들을 푼다’는 뜻으로, 어려운 문제를 해결하는 비유입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그가 해석을 드러낼 것입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחַ יַתִּירָה
  english_pob_choice: an extraordinary spirit
  chosen_korean: 탁월한 영
  alternatives_korean:
  - 뛰어난 영
  - 특별한 영
  - 탁월한 성품
  lexicon: HALOT
  rationale: 아람어의 수식은 단순한 성향보다 뛰어난 자질을 가리키므로, ‘탁월한 영’으로 옮겨 원문의 평가를 살리되 신학적 의미를 덧씌우지 않았습니다.
- source_word: מַנְדַּע וְשָׂכְלְתָנוּ
  english_pob_choice: knowledge and understanding
  chosen_korean: 지식과 총명
  alternatives_korean:
  - 지식과 이해
  - 앎과 분별
  - 지식과 통찰
  lexicon: HALOT
  rationale: 두 명사를 한국어에서 자연스러운 짝인 ‘지식과 총명’으로 옮겨, 지식과 분별의 이중 강조를 유지했습니다.
- source_word: מְפַשַּׁר חֶלְמִין וַאַחֲוָיַת אֲחִידָן וּמְשָׁרֵא קִטְרִין
  english_pob_choice: to interpret dreams, explain riddles, and solve difficulties
  chosen_korean: 꿈을 풀이하고 수수께끼를 해석하며 어려운 문제를 푸는 데
  alternatives_korean:
  - 꿈을 해석하고 수수께끼를 풀며 어려운 매듭을 푸는 데
  - 꿈을 해몽하고 수수께끼를 밝히며 난제를 푸는 데
  - 꿈을 풀고 수수께끼를 설명하며 매듭을 푸는 데
  lexicon: HALOT
  rationale: 동사구의 연속성을 살리면서도 한국어에서 매끄럽게 읽히도록 ‘풀이하다/해석하다/풀다’로 나누어 옮겼고, 마지막 표현은 어려운 문제 해결의 비유를 보존했습니다.
- source_word: דִּי מַלְכָּא שָׂם שְׁמֵהּ בֵּלְטְשַׁאצַּר
  english_pob_choice: whom the king named Belteshazzar
  chosen_korean: 왕이 벨드사살이라 이름 붙인
  alternatives_korean:
  - 왕이 벨드사살이라 부른
  - 왕이 벨드사살이라는 이름을 준
  - 왕이 벨드사살로 지은
  lexicon: HALOT
  rationale: 아람어의 ‘이름을 두다/세우다’ 관용을 자연스럽게 풀어 ‘이름 붙이다’로 옮겼습니다.
- source_word: יִתְקְרֵי ... וּפִשְׁרָה יְהַחֲוֵה
  english_pob_choice: let Daniel be called ... and he will show the interpretation
  chosen_korean: 다니엘을 부르십시오. 그러면 그가 해석을 알려 줄 것입니다
  alternatives_korean:
  - 다니엘을 부르십시오. 그러면 그가 해석을 보일 것입니다
  - 다니엘을 불러오십시오. 그러면 그가 해석을 밝힐 것입니다
  - 다니엘을 부르십시오. 그러면 그가 해석을 드러낼 것입니다
  lexicon: HALOT
  rationale: 청유형과 결과절을 현대 한국어 공문체에 맞게 옮기되, ‘해석’은 단순한 설명이 아니라 계시된 뜻을 밝혀 주는 행위를 담아 ‘알려 줄 것입니다’로 처리했습니다.
theological_decisions:
- issue: ‘영’의 성격을 신적 영으로 특정할지 여부
  chosen_reading: 다니엘의 뛰어난 자질을 가리키는 탁월한 영으로 유지했습니다.
  alternative_readings:
  - 하나님의 영으로 명시
  - 성령으로 해석
  rationale: 문맥은 다니엘의 예지와 분별을 칭찬하지만 이 절 자체는 그 영을 직접 하나님의 영으로 동일시하지 않으므로, 원문의 긴장을 보존했습니다.
  doctrine_reference: 본문이 직접 말하지 않는 신학적 결론을 앞당겨 단정하지 않음
- issue: ‘해석을 알려 줄 것입니다’의 주체와 범위
  chosen_reading: 다니엘이 해석을 ‘알려 줄’ 것으로 옮겼습니다.
  alternative_readings:
  - 해석을 ‘보일’ 것입니다
  - 해석을 ‘밝힐’ 것입니다
  rationale: 아람어의 פשרה יהחוה는 해석을 드러내거나 알리는 뜻이므로, 한국어에서는 ‘알려 주다’로 자연스럽게 풀어도 예언적 기능을 유지합니다.
  doctrine_reference: 문맥상 지혜의 계시 기능을 보존
