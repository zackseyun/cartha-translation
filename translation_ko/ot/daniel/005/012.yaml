    rationale: 원문은 ‘그 안에서 발견되었다’ 뒤에 다니엘을 동격으로 밝히는 구조입니다. 초안의 문장은 한국어로 비문에 가깝고, 무엇이 ‘그러했다’는 것인지 불명확합니다.
