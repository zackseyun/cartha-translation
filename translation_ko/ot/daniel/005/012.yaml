    rationale: a는 ‘탁월한 영’, b는 ‘어려운 문제를 해결하는’, c는 ‘해석을 알려 줄 것입니다’에 각각 연결되어야 각주의 적용 범위가 분명합니다.
  revised_text: 이는 왕이 벨드사살이라는 이름을 붙인 다니엘에게 탁월한 영[a]과 지식과 총명, 곧 꿈을 해석하고 수수께끼를 설명하며 어려운 문제를 해결하는 능력[b]이 있었기 때문입니다. 이제 다니엘을 부르십시오. 그러면 그가 해석을 알려 줄 것입니다[c].
