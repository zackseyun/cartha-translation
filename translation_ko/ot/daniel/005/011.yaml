    rationale: ‘바벨론 왕 느부갓네살이, 당신의 아버지 왕이’는 두 주격 주어가 충돌합니다. 원문의 동격 표현은 한국어에서 ‘느부갓네살 왕, 곧 당신의 아버지께서’로 처리할 수 있습니다.
