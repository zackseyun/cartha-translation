id: DAN.5.11
reference: Daniel 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִיתַ֨י גְּבַ֜ר בְּ/מַלְכוּתָ֗/ךְ דִּ֠י ר֣וּחַ אֱלָהִ֣ין קַדִּישִׁין֮ בֵּ/הּ֒ וּ/בְ/יוֹמֵ֣י אֲב֗/וּךְ נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה כְּ/חָכְמַת אֱלָהִ֖ין הִשְׁתְּכַ֣חַת בֵּ֑/הּ וּ/מַלְכָּ֤/א נְבֻֽכַדְנֶצַּר֙ אֲב֔/וּךְ רַ֧ב חַרְטֻמִּ֣ין אָֽשְׁפִ֗ין כַּשְׂדָּאִין֙ גָּזְרִ֔ין הֲקִימֵ֖/הּ אֲב֥/וּךְ מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/011.yaml
  text: There is a man in your kingdom in whom is a spirit of the holy gods[a], and in the days of your father light and insight and wisdom like the wisdom of the gods were found in him. And King Nebuchadnezzar, your father, appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father[b], the king.
  footnotes:
  - marker: a
    text: Or, 'the Spirit of the holy God' / 'the spirit of the holy God.' The Aramaic is plural ('gods'), but some understand the queen's wording as referring to the one true God.
    reason: alternative_reading
  - marker: b
    text: '''Your father'' may also mean ''your ancestor'' or ''your predecessor'' in this courtly/dynastic context.'
    reason: cultural_note
translation:
  language: ko
  text: 당신의 나라에 한 사람이 있는데, 그 사람 안에 거룩한 신들의 영이 있습니다. 당신의 아버지의 시대에 빛과 총명과 지혜, 곧 신들의 지혜와 같은 것이 그에게서 발견되었습니다. 바벨론 왕 느부갓네살이, 당신의 아버지 왕이 그를 점술가들, 주술사들, 갈대아 사람들, 점쟁이들의 우두머리로 세웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִיתַי גְּבַר
  english_pob_choice: There is a man
  chosen_korean: 한 사람이 있습니다
  alternatives_korean:
  - 한 사람이 있는데
  - 사람 한 명이 있습니다
  lexicon: HALOT
  rationale: 존재를 알리는 문두 구조를 한국어로 자연스럽게 옮기되, 뒤의 설명절로 이어지는 연결감을 살리기 위해 ‘있는데’를 채택했습니다.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  english_pob_choice: a spirit of the holy gods
  chosen_korean: 거룩한 신들의 영
  alternatives_korean:
  - 거룩한 신들의 한 영
  - 거룩한 하나님의 영
  lexicon: HALOT
  rationale: 아람어 복수형과 궁정 발화의 시점을 살려 ‘신들’을 본문에 유지했습니다. 동시에 ‘영’으로 옮겨 인격적 존재보다는 내재한 능력/영의 표현을 보존했습니다.
- source_word: שָׂכְלְתָנוּ
  english_pob_choice: understanding
  chosen_korean: 총명
  alternatives_korean:
  - 이해
  - 통찰
  lexicon: HALOT
  rationale: 지혜와 병렬되는 인지적 능력으로서, 한국어에서 가장 간결하고 문맥에 맞는 고급어휘인 ‘총명’을 택했습니다.
- source_word: כְּחָכְמַת אֱלָהִין
  english_pob_choice: like the wisdom of the gods
  chosen_korean: 신들의 지혜와 같은
  alternatives_korean:
  - 신들의 지혜 같은
  - 하나님의 지혜와 같은
  lexicon: HALOT
  rationale: 비교구문을 그대로 살려, 본문이 말하는 ‘같음’의 정도를 분명히 했습니다. 단수화하여 신학적으로 조정하지 않고 원문의 복수형을 유지했습니다.
- source_word: גָּזְרִין
  english_pob_choice: diviners
  chosen_korean: 점쟁이들
  alternatives_korean:
  - 점술가들
  - 예언자들
  lexicon: HALOT
  rationale: 바벨론 궁정의 전문직 명칭으로서 운세·판정과 관련된 인물을 가리키므로, 한국어 독자에게 기능이 드러나는 ‘점쟁이들’을 택했습니다.
theological_decisions:
- issue: 아람어 복수형 '신들'을 본문에서 유지할지 여부
  chosen_reading: 본문에는 ‘거룩한 신들’과 ‘신들의 지혜’를 유지합니다.
  alternative_readings:
  - ‘거룩한 하나님’으로 단수화
  - ‘신적인 영/지혜’로 완화
  rationale: 이 구절은 바벨론 왕후의 궁정 발화로서, 화자의 다신교적 표현을 그대로 드러내는 것이 서술 시점을 보존합니다. 단수화는 후대 신학을 본문에 미리 주입할 위험이 있어 주석이 아니라 본문에서 유지하지 않습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘당신의 아버지’의 친족 관계 표현
  chosen_reading: 본문에는 그대로 ‘당신의 아버지’로 둡니다.
  alternative_readings:
  - ‘당신의 선조’
  - ‘당신의 전임자’
  rationale: 아람어의 직역을 유지해 왕조적/궁정적 용법을 드러냅니다. 이 표현은 혈연만이 아니라 계승 관계를 포함할 수 있지만, 그 범위는 본문 밖 설명으로 처리하는 것이 더 투명합니다.
  doctrine_reference: Translation philosophy §1, §5
