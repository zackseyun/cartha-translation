  source_fidelity: 수정이 필요합니다. 본문의 ‘빛과 총명과 지혜, 신들의 지혜와 같은 것’은 지혜 자체가 ‘신들의 지혜와 같은’ 것이라는 비교 구문인데, 초안의 ‘지혜, 곧 신들의 지혜와 같은 것’은 이를 동격 설명처럼 바꾸어 다소 불명확하게 합니다. 또한 마지막 절은 아람어의 반복적 동격 표현을 문법적으로 잘못 연결하여 주어가 중복되었습니다.
  naturalness: ‘그 사람 안에’는 가능하나 ‘그 안에는’이 현대 한국어 성경 문체에서 더 자연스럽습니다. ‘느부갓네살이, 당신의 아버지 왕이’는 비문이므로 ‘느부갓네살 왕, 곧 당신의 아버지께서’로 고쳐야 합니다. 합쇼체에 맞추어 높임 종결과 ‘임명하셨습니다’를 사용했습니다.
  terminology: ‘거룩한 신들의 영’ 및 ‘신들의 지혜’는 화자의 복수 신 표현을 보존합니다. 직업 집단은 서로 구별되는 궁정 직함이므로 ‘점술가들, 주술사들, 갈대아 술사들, 점쟁이들’로 옮겼습니다. ‘갈대아 사람들’은 민족명으로만 이해될 수 있어 여기서는 궁정 지혜자 집단임을 드러내었습니다.
