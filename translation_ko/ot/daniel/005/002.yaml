reference: Daniel 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּלְשַׁאצַּ֞ר אֲמַ֣ר בִּ/טְעֵ֣ם חַמְרָ֗/א לְ/הַיְתָיָה֙ לְ/מָאנֵי֙ דַּהֲבָ֣/א וְ/כַסְפָּ֔/א דִּ֤י הַנְפֵּק֙ נְבוּכַדְנֶצַּ֣ר אֲב֔/וּהִי מִן הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וְ/יִשְׁתּ֣וֹן בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/002.yaml
  text: Belshazzar gave the order[a], as he tasted the wine, to bring the vessels of gold and silver that Nebuchadnezzar his father had taken out of the temple that was in Jerusalem, so that the king and his nobles, his wives and his concubines[b], might drink from them.
  footnotes:
  - marker: a
    text: Aramaic 'his father'; in royal usage this can also mean 'his ancestor' or 'predecessor.'
    reason: alternative_reading
  - marker: b
    text: Or 'while under the influence of the wine'; the Aramaic idiom is literally 'in the taste of the wine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 벨사살은 술의 맛이 오르자[a] 명령하여, 예루살렘에 있던 성전에서 그의 아버지 느부갓네살이 가져온 금과 은의 그릇들을 가져오게 했습니다. 그것으로 왕과 그의 귀족들, 그의 아내들과 그의 첩들이 마시게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 ‘그의 아버지’는 왕실 용례에서 ‘그의 조상’ 또는 ‘그의 선왕’을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַר
  english_pob_choice: gave the order
  chosen_korean: 명령하여
  alternatives_korean:
  - 말하여
  - 지시하여
  lexicon: HALOT
  rationale: 아람어 אֲמַר은 단순 발화보다 지시·명령의 기능을 띠므로, 뒤의 ‘가져오게’와 맞물려 한국어로는 ‘명령하여’가 서술력과 의미를 가장 잘 살립니다.
- source_word: בִּטְעֵם חַמְרָא
  english_pob_choice: as he tasted the wine
  chosen_korean: 술의 맛이 오르자
  alternatives_korean:
  - 포도주의 맛을 보자마자
  - 술에 취한 상태에서
  lexicon: HALOT
  rationale: 직역의 ‘맛’ 이미지를 살리되, 한국어에서 자연스럽게 읽히도록 하면서도 과도한 ‘취함’을 본문 본문에 단정적으로 넣지 않았습니다.
- source_word: מָאנֵי דַּהֲבָא וְכַסְפָּא
  english_pob_choice: the vessels of gold and silver
  chosen_korean: 금과 은의 그릇들
  alternatives_korean:
  - 금과 은의 기물들
  - 금과 은의 용기들
  lexicon: HALOT
  rationale: מָאנֵי는 넓은 범주의 용기·기물을 가리키므로, 성전 문맥과 뒤의 ‘마시게’ 목적을 함께 살리기 위해 ‘그릇들’로 옮겼습니다.
- source_word: אֲבוּהִי
  english_pob_choice: his father
  chosen_korean: 그의 아버지
  alternatives_korean:
  - 그의 선왕
  - 그의 선조
  lexicon: HALOT
  rationale: 왕실 용례에서 ‘아버지’가 조상이나 전임자를 가리킬 수 있지만, 본문은 소스 표면형을 유지하는 것이 우선이므로 본문에는 직역을 두고 주석으로 범위를 열어 두었습니다.
- source_word: לְהַיְתָיָה
  english_pob_choice: to bring
  chosen_korean: 가져오게 했습니다
  alternatives_korean:
  - 가져오도록 했습니다
  - 데려오게 했습니다
  lexicon: HALOT
  rationale: 목적절의 사역 의미를 자연스러운 현대어로 풀어 한국어 동작 흐름을 살렸습니다.
theological_decisions:
- issue: 왕실 혈연 호칭 אֲבוּהִי의 의미 범위
  chosen_reading: 본문에는 ‘그의 아버지’를 유지하고, 왕실 관용적으로 ‘선왕/선조’ 가능성을 각주로 열어 둡니다.
  alternative_readings:
  - 그의 선왕
  - 그의 선조
  rationale: 이 구절의 쟁점은 교리보다 역사·관용 표현의 범위이므로, 본문은 원문 형식을 보존하고 해석 가능성은 주석에서 처리하는 편이 source-grounded합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: בִּטְעֵם חַמְרָא의 체감 강도
  chosen_reading: ‘술의 맛이 오르자’로 옮겨, 본문 자체는 ‘술에 취함’을 단정하지 않습니다.
  alternative_readings:
  - 술에 취하자
  - 술기운이 돌자
  rationale: 원문은 문자적으로 ‘술의 맛 속에서/술의 맛으로’라는 관용구이므로, 문맥상 가능성은 열되 본문에서 강하게 해석을 고정하지 않는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §1, §5
