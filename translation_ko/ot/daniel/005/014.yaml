  source_fidelity: 원문의 화자는 자신이 들은 내용을 말하며, ‘신들의 영’이라는 복수형 표현과 빛·통찰·뛰어난 지혜의 병렬은 정확히 보존되어야 합니다. 초안의 ‘그런데’는 이 절 자체에 대응하는 접속사가 아니며, 마지막의 ‘발견된다고 합니다’는 왕의 직접 발화 안에서 불필요하게 재전언하는 어조가 됩니다.
