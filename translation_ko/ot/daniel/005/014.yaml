id: DAN.5.14
reference: Daniel 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁמְעֵ֣ת עלי/ך דִּ֛י ר֥וּחַ אֱלָהִ֖ין בָּ֑/ךְ וְ/נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה יַתִּירָ֖ה הִשְׁתְּכַ֥חַת בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/014.yaml
  text: And I have heard about you that the spirit of the gods is in you[b][a], and that light and insight and extraordinary wisdom are found in you.
  footnotes:
  - marker: a
    text: Or, 'the spirit of God' or 'the Spirit of God.' The Aramaic is literally 'the spirit of the gods,' reflecting the king's wording.
    reason: alternative_reading
  - marker: b
    text: '''Illumination'' is literally ''light/brightness,'' used here metaphorically for mental clarity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 내가 당신에 대하여 들으니, 신들의 영이 당신 안에 있고, 빛과 통찰과 뛰어난 지혜가 당신 안에서 발견된다고 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하나님의 영', 혹은 '하나님의 성령'. 아람어는 문자적으로 '신들의 영'이며, 이는 왕의 말투를 반영합니다.
    reason: alternative_reading
  - marker: b
    text: '''빛''은 문자적으로는 ''밝음/광명''이며, 여기서는 정신적 명료함을 가리키는 은유입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁמְעֵת עֲלָיִךְ
  english_pob_choice: And I have heard about you
  chosen_korean: 내가 당신에 대하여 들으니
  alternatives_korean:
  - 내가 당신에 대해 들었습니다
  - 나는 당신에 관하여 들었습니다
  lexicon: HALOT
  rationale: 아람어 완료형의 보고 표현을 자연스러운 현대 한국어 보고문으로 옮기되, 궁정 연설의 담화 흐름을 살리기 위해 '들으니'를 사용했습니다.
- source_word: רוּחַ אֱלָהִין
  english_pob_choice: the spirit of the gods
  chosen_korean: 신들의 영
  alternatives_korean:
  - 신들의 성령
  - 하나님의 영
  lexicon: HALOT
  rationale: 화자가 바벨론 왕이므로 복수형 표현을 그대로 살려, 신학적 평탄화 없이 왕의 이교적 관점을 반영했습니다.
- source_word: נַהִירוּ
  english_pob_choice: light / illumination
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 조명
  lexicon: HALOT
  rationale: 이 단어는 문자적으로 '빛/밝음'이지만 여기서는 정신적 명료함의 은유이므로, 가장 직접적인 '빛'으로 옮겼습니다.
- source_word: שָׂכְלְתָנוּ
  english_pob_choice: insight
  chosen_korean: 통찰
  alternatives_korean:
  - 이해력
  - 분별
  lexicon: HALOT
  rationale: 지적 이해와 분별을 가리키는 어휘로 보아, 현대 한국어에서 짧고 구별되는 '통찰'을 선택했습니다.
- source_word: חָכְמָה יַתִּירָה
  english_pob_choice: extraordinary wisdom
  chosen_korean: 뛰어난 지혜
  alternatives_korean:
  - 탁월한 지혜
  - 지극히 뛰어난 지혜
  lexicon: HALOT
  rationale: יַתִּירָה의 초과·탁월 의미를 반영하면서도 과장되지 않게 '뛰어난'으로 옮겼습니다.
- source_word: הִשְׁתְּכַחַת בָּךְ
  english_pob_choice: are found in you
  chosen_korean: 당신 안에서 발견된다고 합니다
  alternatives_korean:
  - 당신 안에 발견된다고 합니다
  - 당신 안에서 드러난다고 합니다
  lexicon: HALOT
  rationale: 동사의 수동적 의미를 살려 '발견되다'로 옮기되, 한국어 문맥상 자연스럽게 '이라고 합니다'로 보고 어조를 보완했습니다.
theological_decisions:
- issue: אֱלָהִין을 단수 신학어로 평탄화할지, 왕의 말투대로 복수 표현을 유지할지
  chosen_reading: '''신들의 영''으로 유지했습니다.'
  alternative_readings:
  - 하나님의 영
  - 하나님께로부터 온 영
  rationale: 본문은 다니엘을 높이 평가하는 바벨론 왕의 말로서, 아람어 복수형을 그대로 보존하는 것이 원문의 화자 관점을 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
