  - 분별
  lexicon: HALOT
  rationale: 지적 이해와 분별을 가리키는 어휘로 보아, 현대 한국어에서 짧고 구별되는 '통찰'을 선택했습니다.
- source_word: חָכְמָה יַתִּירָה
  english_pob_choice: extraordinary wisdom
  chosen_korean: 뛰어난 지혜
  alternatives_korean:
  - 탁월한 지혜
  - 지극히 뛰어난 지혜
  lexicon: HALOT
  rationale: יַתִּירָה의 초과·탁월 의미를 반영하면서도 과장되지 않게 '뛰어난'으로 옮겼습니다.
- source_word: הִשְׁתְּכַחַת בָּךְ
  english_pob_choice: are found in you
  chosen_korean: 당신 안에서 발견된다고 합니다
  alternatives_korean:
  - 당신 안에 발견된다고 합니다
  - 당신 안에서 드러난다고 합니다
  lexicon: HALOT
  rationale: 동사의 수동적 의미를 살려 '발견되다'로 옮기되, 한국어 문맥상 자연스럽게 '이라고 합니다'로 보고 어조를 보완했습니다.
theological_decisions:
- issue: אֱלָהִין을 단수 신학어로 평탄화할지, 왕의 말투대로 복수 표현을 유지할지
  chosen_reading: '''신들의 영''으로 유지했습니다.'
  alternative_readings:
  - 하나님의 영
  - 하나님께로부터 온 영
  rationale: 본문은 다니엘을 높이 평가하는 바벨론 왕의 말로서, 아람어 복수형을 그대로 보존하는 것이 원문의 화자 관점을 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
