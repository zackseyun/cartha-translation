  to: 바로 그 순간, 사람 손의 손가락들이 나와 왕궁 벽의 석회칠 위, 등잔대 맞은편에 글을 썼습니다.[a][b][c][d] 왕은 글을 쓰고 있는 손바닥을 보았습니다.[e]
