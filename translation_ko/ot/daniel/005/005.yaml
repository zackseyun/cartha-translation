id: DAN.5.5
reference: Daniel 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/הּ שַׁעֲתָ֗/ה נפקו אֶצְבְּעָן֙ דִּ֣י יַד אֱנָ֔שׁ וְ/כָֽתְבָן֙ לָ/קֳבֵ֣ל נֶבְרַשְׁתָּ֔/א עַל גִּירָ֕/א דִּֽי כְתַ֥ל הֵיכְלָ֖/א דִּ֣י מַלְכָּ֑/א וּ/מַלְכָּ֣/א חָזֵ֔ה פַּ֥ס יְדָ֖/ה דִּ֥י כָתְבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/005.yaml
  text: At that moment the fingers of a human hand came out and wrote opposite the lampstand on the plaster of the wall of the king’s palace[e][d][c][b][a], and the king saw the palm of the hand that was writing.
  footnotes:
  - marker: a
    text: Or 'fingers of a man’s hand.' The Aramaic אֱנָשׁ can mean 'man' or more generally 'human being.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in front of the lampstand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'on the lime plaster' or 'whitewash' of the wall.
    reason: lexical_alternative
  - marker: d
    text: Or 'the king’s hall'; the Aramaic term can denote a palace or a grand hall within it.
    reason: lexical_alternative
  - marker: e
    text: Or possibly 'the hand' more generally; the exact nuance of פַּס is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 순간 사람 손의 손가락들이 나타나 등잔대 맞은편, 왕궁의 벽 석회칠 위에 글을 썼습니다. 그리고 왕은 글을 쓰는 손바닥을 보았습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 아람어 אֱנָשׁ이 가리킬 수 있는 ‘인간’의 일반적 의미를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘맞은편’은 ‘등잔대 앞’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘석회칠’은 ‘석회 플라스터’나 ‘흰 회칠’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘왕궁’은 ‘왕의 전각’ 또는 ‘왕의 큰 궁전/전당’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: ‘손바닥’은 여기서 ‘손’ 일반을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָה
  english_pob_choice: At that moment
  chosen_korean: 그 순간
  alternatives_korean:
  - 그때
  - 그 시간에
  lexicon: HALOT
  rationale: 아람어 관용구가 사건의 즉각성과 돌발성을 강조하므로, 현대 한국어에서 자연스럽고 압축적인 ‘그 순간’으로 옮겼습니다.
- source_word: אֶצְבְּעָן דִּי יַד אֱנָשׁ
  english_pob_choice: the fingers of a human hand
  chosen_korean: 사람 손의 손가락들
  alternatives_korean:
  - 한 사람의 손가락들
  - 인간의 손가락들
  lexicon: HALOT
  rationale: ‘손가락’과 ‘손’의 결합을 유지해 원문의 이미지와 비정상성을 살렸고, אֱנָשׁ의 일반적 의미를 반영해 ‘사람’으로 옮겼습니다.
- source_word: לָקֳבֵל נֶבְרַשְׁתָּא
  english_pob_choice: opposite the lampstand
  chosen_korean: 등잔대 맞은편
  alternatives_korean:
  - 등잔대 앞
  - 등잔대를 마주한 곳
  lexicon: HALOT
  rationale: לָקֳבֵל의 공간 관계를 ‘맞은편’으로 간결하게 살렸고, נברשתא는 문맥상 ‘등잔대’가 가장 분명합니다.
- source_word: עַל גִּירָא
  english_pob_choice: on the plaster
  chosen_korean: 석회칠 위에
  alternatives_korean:
  - 플라스터 위에
  - 벽회 위에
  lexicon: HALOT
  rationale: gîrā는 벽의 석회 도료/회칠을 가리킬 수 있으므로, 문맥과 이미지에 맞는 ‘석회칠’로 옮겼습니다.
- source_word: דִּי כְתַל הֵיכְלָא דִּי מַלְכָּא
  english_pob_choice: of the wall of the king’s palace
  chosen_korean: 왕궁의 벽
  alternatives_korean:
  - 왕의 궁전 벽
  - 왕의 대궁전 벽
  lexicon: HALOT
  rationale: הֵיכְלָא는 궁전 또는 큰 전각을 뜻하므로, 한국어 성경체에서 자연스럽고 문맥에 맞는 ‘왕궁’으로 정리했습니다.
- source_word: פַּס יְדָה
  english_pob_choice: the palm of the hand
  chosen_korean: 손바닥
  alternatives_korean:
  - 손의 바닥
  - 손바닥 부분
  lexicon: HALOT
  rationale: פַּס의 핵심 의미를 ‘손바닥’으로 살려, 왕이 본 대상이 손 전체가 아니라 쓰는 부분임을 분명히 했습니다.
theological_decisions:
- issue: 초자연적 표지의 서술 방식
  chosen_reading: ‘사람 손의 손가락들’과 ‘글을 썼습니다’로 직설적으로 옮겨, 환시적 기이함을 약화하지 않았습니다.
  alternative_readings:
  - ‘손가락처럼 보이는 것이 나타나’
  - ‘무언가가 글씨를 쓰기 시작했습니다’
  rationale: 본문은 실제로 보이는 표적의 충격을 강조하므로, 해석을 덜어내지 않고 원문이 제시하는 기이한 현상 자체를 보존했습니다.
  doctrine_reference: 다니엘 5장의 계시/심판 표지 서술
- issue: 왕궁/등잔대의 공간 대비
  chosen_reading: ‘등잔대 맞은편’과 ‘왕궁의 벽’으로 구체화해 시각적 대비를 유지했습니다.
  alternative_readings:
  - ‘등불 앞에’
  - ‘궁전의 벽’
  rationale: 장면의 긴박함은 보이는 위치 관계에서 나오므로, 원문의 공간 정보를 흐리지 않도록 했습니다.
  doctrine_reference: 본문 서술의 현장성
