  rationale: הֵיכְלָא는 궁전 또는 큰 전각을 뜻하므로, 한국어 성경체에서 자연스럽고 문맥에 맞는 ‘왕궁’으로 정리했습니다.
- source_word: פַּס יְדָה
  english_pob_choice: the palm of the hand
  chosen_korean: 손바닥
  alternatives_korean:
  - 손의 바닥
  - 손바닥 부분
  lexicon: HALOT
  rationale: פַּס의 핵심 의미를 ‘손바닥’으로 살려, 왕이 본 대상이 손 전체가 아니라 쓰는 부분임을 분명히 했습니다.
theological_decisions:
- issue: 초자연적 표지의 서술 방식
  chosen_reading: ‘사람 손의 손가락들’과 ‘글을 썼습니다’로 직설적으로 옮겨, 환시적 기이함을 약화하지 않았습니다.
  alternative_readings:
  - ‘손가락처럼 보이는 것이 나타나’
  - ‘무언가가 글씨를 쓰기 시작했습니다’
  rationale: 본문은 실제로 보이는 표적의 충격을 강조하므로, 해석을 덜어내지 않고 원문이 제시하는 기이한 현상 자체를 보존했습니다.
  doctrine_reference: 다니엘 5장의 계시/심판 표지 서술
- issue: 왕궁/등잔대의 공간 대비
  chosen_reading: ‘등잔대 맞은편’과 ‘왕궁의 벽’으로 구체화해 시각적 대비를 유지했습니다.
  alternative_readings:
  - ‘등불 앞에’
  - ‘궁전의 벽’
  rationale: 장면의 긴박함은 보이는 위치 관계에서 나오므로, 원문의 공간 정보를 흐리지 않도록 했습니다.
  doctrine_reference: 본문 서술의 현장성
