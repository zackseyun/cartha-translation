base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/025.yaml
  text: 'And this is the inscription that was written: MENE[a], MENE, TEKEL[b], and PARSIN.'
  footnotes:
  - marker: a
    text: 'The Aramaic words are left transliterated because Daniel interprets them in the following verse(s) with wordplay: MENE sounds like ''numbered,'' TEKEL like ''weighed,'' and PARSIN/PERES like ''divided'' and also echoes ''Persians.'''
    reason: lexical_alternative
  - marker: b
    text: '''The inscription'' could also be rendered ''the writing.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것은 기록된 글귀입니다. 「메네, 메네, 테켈, 파르신」입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 표어는 뒤이어 나오는 해석과의 말장난을 살리기 위해 음역을 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기록된 글귀’는 문맥상 자연스럽지만, 원문은 보다 일반적으로 ‘글/기록’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְתָבָא
  english_pob_choice: the inscription
  chosen_korean: 기록된 글귀
  alternatives_korean:
  - 글
  - 글씨
  - 문구
  lexicon: HALOT
  rationale: 벽에 나타난 문맥상 단순한 ‘글’보다, 판독 가능한 표지를 드러내는 ‘기록된 글귀’가 POB의 ‘inscription’ 취지를 자연스럽게 살립니다.
- source_word: מְנֵא
  english_pob_choice: MENE
  chosen_korean: 메네
  alternatives_korean:
  - 번호를 매기다
  - 민아
  lexicon: HALOT
  rationale: 다음 절의 말장난(‘세어졌다’)을 보존하기 위해 음역을 유지했습니다.
- source_word: תְּקֵל
  english_pob_choice: TEKEL
  chosen_korean: 테켈
  alternatives_korean:
  - 저울에 달리다
  - 세겔
  lexicon: HALOT
  rationale: 후속 해석의 말장난(‘달려 보니’)을 살리기 위해 음역을 유지했습니다.
- source_word: וּפַרְסִין
  english_pob_choice: and PARSIN
  chosen_korean: 파르신
  alternatives_korean:
  - 그리고 파르신
  - 그리고 페레스
  - 그리고 나뉨
  lexicon: HALOT
  rationale: 문맥상 신비로운 표어의 형식을 보존해야 하므로 번역하지 않고 음역했습니다. 한국어에서는 제목·구호체처럼 보이는 인용부호 안에서 접속사 ‘그리고’를 반복하지 않았습니다.
theological_decisions:
- issue: 불가해한 글귀의 제시 방식
  chosen_reading: 뜻을 풀기 전까지는 음역을 그대로 제시해, 본문이 의도하는 수수께끼성과 해석의 긴장을 유지했습니다.
  alternative_readings:
  - 의미를 풀어 번역해 바로 ‘세어졌다, 달려 보니, 나뉘었다’로 옮기는 방식
  rationale: 다니엘 5장 26절 이하의 해석이 뒤따르는 구조이므로, 여기서는 해석을 앞당기지 않는 것이 본문의 서사적 효과와 신학적 의도를 더 잘 보존합니다.
  doctrine_reference: 단 5:26-28
