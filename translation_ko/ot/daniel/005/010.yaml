id: DAN.5.10
reference: Daniel 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַלְכְּתָ֕/א לָ/קֳבֵ֨ל מִלֵּ֤י מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי לְ/בֵ֥ית מִשְׁתְּיָ֖/א עללת עֲנָ֨ת מַלְכְּתָ֜/א וַ/אֲמֶ֗רֶת מַלְכָּ/א֙ לְ/עָלְמִ֣ין חֱיִ֔י אַֽל יְבַהֲלוּ/ךְ֙ רַעְיוֹנָ֔/ךְ וְ/זִיוָ֖י/ךְ אַל יִשְׁתַּנּֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/010.yaml
  text: Because of the words of the king and his nobles[a], the queen entered the banquet hall. The queen spoke and said, “O king, live forever! Do not let your thoughts terrify you[b], and do not let your face grow pale.”
  footnotes:
  - marker: a
    text: Or 'answered and said.' The Aramaic idiom can introduce speech either as a response or simply as the beginning of a statement.
    reason: lexical_alternative
  - marker: b
    text: Literally 'your brightnesses do not change,' an idiom referring to the appearance of the face; compare the similar expression in this chapter for a face changing color from fear.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕과 그 귀족들의 말 때문에[a] 왕비가 잔치 집으로 들어와서 말하고 이르렀습니다. “왕이여, 영원히 사십시오. 당신의 생각들이 당신을 두렵게 하지 말고[b], 당신의 얼굴이 변하지도 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 관용구는 ‘~의 말 때문에’뿐 아니라 ‘~에 응답하여’라는 뜻으로도 시작할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 빛/광채가 변하지 말라’는 뜻의 관용구입니다. 여기서는 얼굴의 표정과 혈색이 두려움으로 달라지는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקֳבֵל מִלֵּי
  english_pob_choice: Because of the words
  chosen_korean: 말 때문에
  alternatives_korean:
  - 말로 인하여
  - 그 말에 응하여
  lexicon: HALOT
  rationale: 원인은 전치사 לָקֳבֵל의 핵심 기능이므로 ‘때문에’로 자연스럽게 옮기고, מִלֵּי는 단순한 ‘말들’로 처리해 서술 흐름을 살렸습니다.
- source_word: רַבְרְבָנֹהִי
  english_pob_choice: his nobles
  chosen_korean: 그 귀족들
  alternatives_korean:
  - 그 대신들
  - 그 고관들
  lexicon: HALOT
  rationale: 아람어가 가리키는 고위층 인물을 현대 한국어에서는 ‘귀족들’로 옮기면 신분적 격이 분명하면서도 지나치게 고어적이지 않습니다.
- source_word: לְבֵית מִשְׁתְּיָא
  english_pob_choice: the banquet hall
  chosen_korean: 잔치 집
  alternatives_korean:
  - 연회장
  - 잔칫집
  lexicon: HALOT
  rationale: 직역적 배경을 살리되 문맥상 궁정 연회 장소이므로 ‘잔치 집’으로 옮겼습니다. ‘연회장’은 매끄럽지만 원문의 ‘집’ 이미지를 약화시킵니다.
- source_word: רַעְיוֹנָךְ
  english_pob_choice: your thoughts
  chosen_korean: 당신의 생각들
  alternatives_korean:
  - 당신의 염려들
  - 당신의 마음속 생각들
  lexicon: HALOT
  rationale: 이 명사는 사고·숙고를 가리키므로 ‘생각들’이 가장 직접적입니다. 문맥상 불안이 있지만 그 뉘앙스는 동사에서 드러나게 두었습니다.
- source_word: יְבַהֲלוּךְ
  english_pob_choice: terrify you
  chosen_korean: 당신을 두렵게 하지 말고
  alternatives_korean:
  - 당신을 놀라게 하지 말고
  - 당신을 불안하게 하지 말고
  lexicon: HALOT
  rationale: 동사는 단순한 혼란보다 더 강한 공포·동요를 나타내므로 ‘두렵게 하다’가 가장 적절합니다.
- source_word: זִיוָךְ / יִשְׁתַּנּוֹ
  english_pob_choice: your face grow pale
  chosen_korean: 당신의 얼굴이 변하지도 마십시오
  alternatives_korean:
  - 당신의 얼굴빛이 변하지도 마십시오
  - 당신의 용모가 바뀌지도 마십시오
  lexicon: HALOT
  rationale: 아람어는 얼굴의 ‘빛/겉모습’이 바뀌는 관용구이므로, 색 변화로 좁히지 않고 ‘얼굴이 변하다’로 넓게 옮겨 원문의 표현을 보존했습니다.
theological_decisions:
- issue: 왕실 예법의 축원문 번역
  chosen_reading: “왕이여, 영원히 사십시오”로 옮겨 궁정 인사말의 형식을 유지했습니다.
  alternative_readings:
  - “임금님, 영원히 사십시오”
  - “왕이여, 오래 사십시오”
  rationale: 원문은 왕 앞에서의 정형화된 축원입니다. 한국어에서도 생동감 있는 존칭 축원으로 전달하는 것이 서술 맥락에 맞습니다.
  doctrine_reference: 궁정 예법의 관습적 발화 형식
- issue: 서술문과 직접화법의 존대 수준
  chosen_reading: 서술은 합쇼체로 유지하고, 왕에게 하는 직접 발화는 존칭 명령/축원으로 처리했습니다.
  alternative_readings:
  - 직접화법 전체를 평서형으로 통일
  - 직접화법을 지나치게 고어적으로 번역
  rationale: 화자의 대상이 왕이므로 한국어에서도 경어 체계를 반영해야 하며, 본문 분위기를 해치지 않는 범위에서 현대적 합쇼체를 유지했습니다.
  doctrine_reference: 한국어 화행·존대 체계
