id: DAN.5.18
reference: Daniel 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אנתה מַלְכָּ֑/א אֱלָהָ/א֙ עלי/א מַלְכוּתָ֤/א וּ/רְבוּתָ/א֙ וִ/יקָרָ֣/א וְ/הַדְרָ֔/ה יְהַ֖ב לִ/נְבֻכַדְנֶצַּ֥ר אֲבֽ/וּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/018.yaml
  text: As for you[a], O king, the Most High God gave kingship and greatness and glory and majesty to Nebuchadnezzar your father.
  footnotes:
  - marker: a
    text: Or 'your ancestor' or 'your predecessor'; the Aramaic term literally means 'your father' but can be used more broadly in royal lineage language.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 왕이시니, 지극히 높으신 하나님께서 느부갓네살 당신의 아버지에게 왕권과 위대함과 영광과 위엄을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 조상’ 혹은 ‘당신의 선대’로 볼 수 있습니다. 아람어의 이 말은 문자적으로는 ‘당신의 아버지’이지만, 왕조 계보에서는 더 넓게 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה
  english_pob_choice: As for you
  chosen_korean: 당신은
  alternatives_korean:
  - 당신에게는
  - 당신은 바로
  lexicon: HALOT
  rationale: 앞에 나온 독립 인칭대명사의 강조를 한국어에서는 주제 제시로 처리해, 대조적 직접 호칭의 힘을 살리면서도 문장을 자연스럽게 만들었습니다.
- source_word: אֱלָהָא עִלָּיָא
  english_pob_choice: the Most High God
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지극히 높으신 신
  lexicon: HALOT
  rationale: 아람어의 최고급 표현을 한국어 성경 문체에 맞게 옮겼으며, ‘하나님’으로 표준 신칭을 유지했습니다.
- source_word: מַלְכוּתָא
  english_pob_choice: kingship
  chosen_korean: 왕권
  alternatives_korean:
  - 왕국
  - 통치권
  lexicon: HALOT
  rationale: 여기서는 영토보다 왕에게 부여된 통치적 지위를 가리키므로 ‘왕권’이 문맥을 가장 정확히 반영합니다.
- source_word: וּרְבוּתָא וִיקָרָא וְהַדְרָה
  english_pob_choice: greatness and glory and majesty
  chosen_korean: 위대함과 영광과 위엄
  alternatives_korean:
  - 큰 됨됨이와 영광과 장엄함
  - 위대함과 존귀와 장엄함
  lexicon: HALOT
  rationale: 세 항목의 누적된 궁정어조를 살리기 위해 각각 구별되는 한국어 명사로 옮겼고, ‘위엄’은 왕적 장엄성을 자연스럽게 전달합니다.
- source_word: אֲבוּךְ
  english_pob_choice: your father
  chosen_korean: 당신의 아버지
  alternatives_korean:
  - 당신의 조상
  - 당신의 선대
  lexicon: HALOT
  rationale: 본문의 직접 표현을 보존하되, 아람어의 왕조적 용법이 실제 친부만을 뜻하지 않을 수 있다는 점을 드러내기 위해 직역을 유지했습니다.
theological_decisions:
- issue: ‘your father’의 왕조적 의미
  chosen_reading: 본문은 ‘당신의 아버지’로 직역하고, 그 표현이 ‘조상/선대’까지 포함할 수 있음을 주석으로 처리합니다.
  alternative_readings:
  - 당신의 조상
  - 당신의 선대
  - 당신의 전임자
  rationale: 아람어는 혈연 아버지뿐 아니라 왕조 계승선의 선조를 가리킬 수 있으므로, 본문에서는 원표현의 힘을 지키고 의미 확장은 각주로 분리하는 것이 가장 충실합니다.
  doctrine_reference: DAN.5 문맥의 왕조 언어, 번역 원칙 §3
- issue: 칭호와 예우의 한국어 문체
  chosen_reading: 왕에게의 직접 호칭은 합쇼체를 유지하고, 하나님의 행위는 평서문으로 진술합니다.
  alternative_readings:
  - 더 평이한 현대문체
  - 고전적 성경체
  rationale: 궁정 장면의 위계를 살리면서도 현대 한국어 성경 독자가 자연스럽게 읽도록 하기 위한 문체 선택입니다.
  doctrine_reference: Korean style policy
