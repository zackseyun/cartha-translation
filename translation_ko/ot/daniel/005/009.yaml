  alternative_readings:
  - 몹시 두려워하였고
  - 극도로 공포에 질렸고
  rationale: 동사 בהל의 문맥상 격한 동요는 분명하지만, 이어지는 얼굴빛 변화와 귀족들의 당혹과 함께 읽을 때 ‘불안해졌다’가 의미 범위를 넓게 포괄합니다.
