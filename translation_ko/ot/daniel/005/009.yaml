theological_decisions:
- issue: 왕의 반응을 과장된 공포로 번역할지 여부
  chosen_reading: ‘크게 불안해졌고’로 옮겨, 강한 동요는 살리되 본문이 말하는 시각적·심리적 충격을 균형 있게 반영했습니다.
  alternative_readings:
  - 몹시 두려워하였고
  - 극도로 공포에 질렸고
  rationale: 동사 בהל의 문맥상 격한 동요는 분명하지만, 이어지는 얼굴빛 변화와 귀족들의 당혹과 함께 읽을 때 ‘불안해졌다’가 의미 범위를 넓게 포괄합니다.
  doctrine_reference: 서사 본문의 정서 표현 보존 원칙
