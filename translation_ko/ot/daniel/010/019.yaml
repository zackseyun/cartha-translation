id: DAN.10.19
reference: Daniel 10:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר אַל תִּירָ֧א אִישׁ חֲמֻד֛וֹת שָׁל֥וֹם לָ֖/ךְ חֲזַ֣ק וַ/חֲזָ֑ק וּֽ/בְ/דַבְּר֤/וֹ עִמִּ/י֙ הִתְחַזַּ֔קְתִּי וָ/אֹֽמְרָ֛/ה יְדַבֵּ֥ר אֲדֹנִ֖/י כִּ֥י חִזַּקְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/019.yaml
  text: And he said[a], “Do not fear, man greatly beloved; peace be to you. Be strong, yes, be strong.” And when he spoke with me, I was strengthened and said, “Let my lord speak, for you have strengthened me.”
  footnotes:
  - marker: a
    text: Or “highly esteemed man” or “man much desired.” The Hebrew expression literally reads “man of desires/preciousness,” an idiom of special favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「두려워하지 마십시오, 크게 사랑받는 사람이여. 당신에게 평안이 있기를 바랍니다. 강해지십시오, 참으로 강해지십시오.」 그가 나에게 말할 때 저는 강해졌고, 말했습니다. 「내 주여, 말씀하십시오. 주께서 저를 강하게 하셨으므로 말씀하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “사랑스러움들/귀한 것들의 사람”에 가까운 표현이며, 특별한 호의와 귀히 여김을 받는 사람이라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  english_pob_choice: man greatly beloved
  chosen_korean: 크게 사랑받는 사람
  alternatives_korean:
  - 매우 귀히 여김을 받는 사람
  - 크게 기뻐하는 사람
  - 사랑스러운 사람
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘사랑받는/귀히 여김을 받는’ 특별한 호의를 뜻하므로, 본문이 주는 친밀하고 인격적인 호의를 살려 ‘크게 사랑받는 사람’으로 옮겼습니다.
- source_word: שָׁלוֹם לָךְ
  english_pob_choice: peace be to you
  chosen_korean: 네게 평강이 있기를
  alternatives_korean:
  - 네게 평강이
  - 평강이 너에게
  - 너에게 평강이 있기를
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순 명사가 아니라 축복/기원 공식이므로, 한국어에서도 기원형으로 풀어 ‘평강이 있기를’로 옮겼습니다.
- source_word: חֲזַק וַחֲזָק
  english_pob_choice: Be strong, yes, be strong
  chosen_korean: 강하여라, 참으로 강하여라
  alternatives_korean:
  - 강하여라, 강하여라
  - 힘내어라, 참으로 힘내어라
  - 굳세어라, 굳세어라
  lexicon: HALOT
  rationale: 반복 명령의 강조를 살리되, 한국어에서 어색하지 않게 첫 번째는 기본형, 두 번째는 강조 부사 ‘참으로’로 압축해 중첩된 힘을 보존했습니다.
- source_word: הִתְחַזַּקְתִּי
  english_pob_choice: I was strengthened
  chosen_korean: 나는 힘을 얻고
  alternatives_korean:
  - 나는 강하게 되었고
  - 나는 강해졌고
  - 나는 새 힘을 얻고
  lexicon: HALOT
  rationale: 히트파엘의 결과 상태를 한국어의 자연스러운 결과 표현으로 옮겼습니다. 앞의 ‘강하여라’와의 어휘 연결은 ‘힘을 얻다’로도 충분히 살릴 수 있습니다.
- source_word: יְדַבֵּר אֲדֹנִי
  english_pob_choice: Let my lord speak
  chosen_korean: 내 주께서 말씀하시기를
  alternatives_korean:
  - 내 주께서 말씀하시옵소서
  - 내 주께서 말씀해 주십시오
  - 주여 말씀하소서
  lexicon: HALOT
  rationale: 여기서 אֲדֹנִי는 예언자/천사에 대한 존칭이므로 ‘내 주’로 두었고, 청유/허용의 뜻을 한국어에서 자연스럽게 드러내기 위해 ‘말씀하시기를’로 옮겼습니다.
- source_word: כִּי חִזַּקְתָּנִי
  english_pob_choice: for you have strengthened me
  chosen_korean: 주께서 나를 강하게 하셨기 때문입니다
  alternatives_korean:
  - 주께서 나를 힘나게 하셨기 때문입니다
  - 주께서 나를 굳세게 하셨기 때문입니다
  - 주께서 나를 강건하게 하셨기 때문입니다
  lexicon: HALOT
  rationale: 원문의 ‘강하게 하다’ 동사 קשר를 앞뒤 ‘강하다’ 계열과 맞물리게 살려, 발화 이유를 분명히 하는 인과절로 옮겼습니다.
theological_decisions:
- issue: 천사/하늘 존재에 대한 존칭 표현인 אֲדֹנִי의 처리
  chosen_reading: ‘내 주’는 하나님이 아닌, 다니엘과 대화하는 존재에게 드리는 공손한 호칭으로 유지했습니다.
  alternative_readings:
  - ‘주님’
  - ‘주여’
  - ‘내 주인님’
  rationale: 본문의 문맥상 이는 여호와를 가리키는 칭호가 아니므로, 소문자적 존칭을 한국어에서도 그대로 보존하는 것이 오독을 막습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘힘을 얻다’와 ‘강하게 하다’의 어휘 연결
  chosen_reading: 앞의 격려와 뒤의 결과를 같은 강함 어휘군으로 묶어, 본문의 반복적 강화 효과를 드러냈습니다.
  alternative_readings:
  - ‘새 힘을 얻다’로 분리
  - ‘굳세어지다’로 통일
  rationale: 본문은 ‘강하다’/‘강하게 하다’의 반복으로 심리적·신체적 강화의 흐름을 만들므로, 한국어에서도 그 연결을 유지하는 편이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1
