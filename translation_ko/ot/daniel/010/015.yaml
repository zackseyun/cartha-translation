lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  english_pob_choice: when he spoke / while he was speaking with me
  chosen_korean: 그가 나와 말하고 있을 때
  alternatives_korean:
  - 그가 나와 말했을 때
  - 그가 나와 말하는 동안
  lexicon: WLC; HALOT
  rationale: בְּ + 분사/부정사 구성의 시간적 용법을 자연스럽게 살려, 대화가 진행되는 중의 상황을 나타내면서도 한국어로 매끄럽게 표현했습니다.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 그 말씀들
  alternatives_korean:
  - 이 말씀들
  - 이 말들
  lexicon: HALOT
  rationale: 직전 문맥이 계시적 발화이므로 단순한 '말들'보다 '말씀들'이 더 적절하며, 지시성은 앞뒤 문맥의 대화 상황으로 충분히 전달됩니다.
- source_word: נָתַתִּי פָנַי אַרְצָה
  english_pob_choice: I set my face toward the ground
  chosen_korean: 나는 얼굴을 땅으로 향하게 하고
  alternatives_korean:
  - 나는 얼굴을 땅으로 돌리고
  - 나는 얼굴을 땅에 대고
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지를 유지하되 한국어에서 어색하지 않도록 '얼굴을 땅으로 향하게 하다'로 옮겼습니다.
- source_word: וְנֶאֱלָמְתִּי
  english_pob_choice: and became speechless
  chosen_korean: 말문이 막혔습니다
  alternatives_korean:
  - 침묵하게 되었습니다
  - 말을 잃었습니다
  lexicon: HALOT
  rationale: Niphal 엘ם의 '말할 수 없게 됨'을 자연스러운 현대 한국어로 옮겨, 외부 강제보다는 당사자의 경직과 침묵 상태를 드러냈습니다.
theological_decisions:
- issue: 다니엘의 반응을 어떻게 표현할지
  chosen_reading: 계시 앞에서 자발적으로 압도되어 침묵하게 되는 반응으로 표현했습니다.
  alternative_readings:
  - 외부적으로 침묵당한 것처럼 표현
  - 단순히 '침묵했다'로 축소
  rationale: 문맥상 발화자의 말 앞에서 다니엘이 압도되어 말하지 못하게 되는 장면이므로, 강제성보다 반응의 결과를 살렸습니다.
  doctrine_reference: 계시와 인간의 연약함에 대한 서술
