translation:
  language: ko
  text: 첫째 달 스무나흗날, 나는 큰 강 곁에 있었는데, 그것은 곧 티그리스였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חִדָּקֶל은 티그리스를 가리키는 표준 히브리어 이름입니다.
    reason: source_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  english_pob_choice: On the twenty-fourth day
  chosen_korean: 첫째 달 스무나흗날
  alternatives_korean:
  - 첫째 달 스물넷째 날
  - 첫째 달 스물네 날
  lexicon: HALOT
  rationale: 날짜 공식이므로 한국어에서는 서수형 날짜 표현이 자연스럽습니다. "스무나흗날"은 'twenty-fourth day'에 대응하는 간결하고 표준적인 형식입니다.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  english_pob_choice: of the first month
  chosen_korean: 첫째 달
  alternatives_korean:
  - 첫 번째 달
  - 첫 달
  lexicon: HALOT
  rationale: 달력 문맥에서 הָרִאשׁוֹן은 첫째를 뜻하므로, 한국어 성경 문체에 맞게 "첫째 달"로 옮겼습니다.
- source_word: עַל יַד
  english_pob_choice: by the side of
  chosen_korean: 곁에
  alternatives_korean:
  - 옆에
  - 강가에
  - 가에
  lexicon: HALOT
  rationale: עַל יַד의 공간적 의미를 살리되, 한국어에서는 "곁에"가 가장 자연스럽고 간결합니다. "강가에"는 해석을 더 강하게 좁힐 수 있어 피했습니다.
- source_word: חִדָּקֶל
  english_pob_choice: the Tigris
  chosen_korean: 티그리스
  alternatives_korean:
  - 히데겔
  - 티그리스강
  lexicon: HALOT
  rationale: 영어 POB가 표준 지명인 Tigris를 채택했으므로, 한국어도 널리 알려진 현대 지명인 "티그리스"를 사용했습니다. 뒤의 설명절 "그것은 곧"으로 히브리어 해설 관계를 반영했습니다.
theological_decisions:
- issue: 설명절 הוּא의 처리
  chosen_reading: '"그것은 곧 티그리스였습니다"로 풀이적 설명을 유지했습니다.'
  alternative_readings:
  - '"즉 티그리스였습니다"'
  - '"히데겔 곧 티그리스입니다"'
  rationale: הוּא는 단순 동격 설명이므로, 본문이 가리키는 강의 이름을 풀어주는 방식이 가장 분명합니다. 영어 POB의 "that is"를 한국어로 자연스럽게 옮겼습니다.
  doctrine_reference: 문맥적 동격 설명
- issue: 히브리어 고유명 חִדָּקֶל의 표기
  chosen_reading: 본문에서는 현대 지명 "티그리스"를 사용하고, 원형과의 대응은 설명절로 충분히 보이게 했습니다.
  alternative_readings:
  - 히데겔
  - 티그리스(히데겔)
  rationale: 청중 이해를 위해 알려진 지명인 티그리스를 본문에 두되, 히브리어 명칭과의 관계는 주석 없이도 문장 내 설명으로 드러나게 했습니다.
  doctrine_reference: 지명 번역 관례
