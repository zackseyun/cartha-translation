lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그때 보니
  - 갑자기
  lexicon: HALOT
  rationale: 장면 전환의 돌연함과 주의를 끄는 기능을 살리되, 현대 한국어에서 자연스럽고 공손한 서술 연결로 옮겼습니다.
- source_word: יָד
  english_pob_choice: a hand
  chosen_korean: 한 손
  alternatives_korean:
  - 그 손
  - 손
  lexicon: HALOT
  rationale: 히브리어가 관사 없이 쓰여 특정 대상을 미리 밝히지 않는 점을 반영해, 서술의 긴장감을 유지하는 ‘한 손’으로 옮겼습니다.
- source_word: נָגְעָה בִּי
  english_pob_choice: touched me
  chosen_korean: 나를 만져
  alternatives_korean:
  - 나를 건드려
  - 나를 접촉하여
