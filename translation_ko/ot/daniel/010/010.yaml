  lexicon: HALOT
  rationale: 동사 נוע의 사역형은 몸이 비틀리거나 움직이게 되는 결과를 나타낼 수 있으므로, 문맥상 쓰러진 자세가 바뀌어 엎드러진 상태가 되는 그림을 한국어로 자연스럽게 살렸습니다.
