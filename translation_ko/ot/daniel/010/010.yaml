  rationale: 이 동사는 여기서 단순한 접촉을 가리키므로, 과도한 해석 없이 직접적인 ‘만져’로 옮겼습니다.
- source_word: וַתְּנִיעֵנִי
  english_pob_choice: set me on my knees and the palms of my hands
  chosen_korean: 내 무릎과 손바닥 위에 엎드리게 하였습니다
