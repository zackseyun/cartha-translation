reference: Daniel 10:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֡/י דָּנִיֵּ֣אל אִישׁ חֲ֠מֻדוֹת הָבֵ֨ן בַּ/דְּבָרִ֜ים אֲשֶׁר֩ אָנֹכִ֨י דֹבֵ֤ר אֵלֶ֨י/ךָ֙ וַ/עֲמֹ֣ד עַל עָמְדֶ֔/ךָ כִּ֥י עַתָּ֖ה שֻׁלַּ֣חְתִּי אֵלֶ֑י/ךָ וּ/בְ/דַבְּר֥/וֹ עִמִּ֛/י אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עָמַ֥דְתִּי מַרְעִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/011.yaml
  text: And he said to me[a], “Daniel, man greatly beloved, understand the words that I am speaking to you, and stand in your place, for now I have been sent to you.” And when he spoke this word to me[c][b], I stood trembling.
  footnotes:
  - marker: a
    text: Or “highly esteemed man.” The Hebrew expression literally describes Daniel as a man of preciousness or desirability, functioning here as an honorific.
    reason: lexical_alternative
  - marker: b
    text: Or “stand upright” or “stand at your station.” The Hebrew idiom is literally “stand upon your standing/place.”
    reason: lexical_alternative
  - marker: c
    text: Or “when he spoke this message to me.” Hebrew has “this word,” which can also mean “this matter” or “this message.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말했습니다. “다니엘, 매우 사랑받는 사람[a]이여, 내가 그대에게 하는 그 말들을 깨닫고, 그대의 자리에 서십시오[b]. 이제 내가 그대에게 보내심을 받았기 때문입니다.” 그가 이 말을[c] 내게 하자, 나는 떨며 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘사랑스러움/귀중함의 사람’을 뜻하며, 여기서는 존칭으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 문자적으로 ‘자기 서 있음 위에 서라’에 가깝고, ‘자리에 서라’ 또는 ‘제자리를 지키라’는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘말/일/메시지’의 뜻을 모두 가질 수 있으나, 여기서는 이어지는 발화 문맥상 ‘말’이 가장 직접적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  english_pob_choice: man greatly beloved
  chosen_korean: 크게 사랑받는 사람
  alternatives_korean:
  - 지극히 귀히 여김을 받는 사람
  - 크게 은총을 입은 사람
  - 사랑스러운 사람
  lexicon: HALOT
  rationale: חֲמֻדוֹת는 문자적으로 ‘사랑스러움/귀중함’의 뜻을 가지며, 여기서는 천상의 전달자가 다니엘에게 붙이는 존칭이므로 관계적·존칭적 뉘앙스를 살려 옮겼습니다.
- source_word: הָבֵן בַּדְּבָרִים
  english_pob_choice: understand the words
  chosen_korean: 그 말들을 깨닫고
  alternatives_korean:
  - 그 말씀들을 이해하고
  - 그 일들을 분별하고
  - 그 말의 뜻을 알아듣고
  lexicon: HALOT
  rationale: הָבֵן은 단순 청취가 아니라 내용을 파악하라는 명령이므로, 문맥상 자연스러운 ‘깨닫다’를 택했습니다.
- source_word: וַעֲמֹד עַל עָמְדֶךָ
  english_pob_choice: stand in your place
  chosen_korean: 당신의 자리에서 일어서십시오
  alternatives_korean:
  - 당신의 자리에 서십시오
  - 당신의 위치를 지키십시오
  - 당신의 자리에서 서 있으십시오
  lexicon: HALOT
  rationale: 히브리어는 ‘서다’와 같은 어근을 겹쳐 쓰는 관용구로, 단순한 물리적 기립과 맡은 자리에 바로 서는 태도를 함께 담습니다. 한국어에서는 두 뜻을 모두 살리되 문장 흐름상 자연스럽게 옮겼습니다.
- source_word: שֻׁלַּחְתִּי אֵלֶיךָ
  english_pob_choice: I have been sent to you
  chosen_korean: 내가 당신에게 보내졌기 때문입니다
  alternatives_korean:
  - 내가 당신에게 파견되었기 때문입니다
  - 내가 당신에게 보내진 것입니다
  lexicon: HALOT
  rationale: 수동 완료형은 현재적 효력을 지니므로, 단순 과거보다 현재적 결과를 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 다니엘에 대한 천상적 존칭의 한국어 강도
  chosen_reading: 크게 사랑받는 사람
  alternative_readings:
  - 지극히 귀히 여김을 받는 사람
  - 크게 은총을 입은 사람
  rationale: 본문의 칭호는 다니엘의 개인적 가치보다 하나님/천상의 호의와 존중을 드러내므로, 지나치게 교회식이거나 추상적인 표현보다 직접적이고 존칭적인 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: ‘서라’와 ‘자리에 서라’의 이중 의미
  chosen_reading: 당신의 자리에서 일어서십시오
  alternative_readings:
  - 당신의 자리에 서십시오
  - 당신의 위치를 지키십시오
  rationale: 히브리 관용구가 물리적 자세와 임명된 자리의 회복을 함께 암시하므로, 어느 한쪽으로 평평하게 만들지 않고 두 층위를 모두 남겼습니다.
  doctrine_reference: Translation philosophy §3
