id: DAN.10.16
reference: Daniel 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כִּ/דְמוּת֙ בְּנֵ֣י אָדָ֔ם נֹגֵ֖עַ עַל שְׂפָתָ֑/י וָ/אֶפְתַּח פִּ֗/י וָ/אֲדַבְּרָ/ה֙ וָ/אֹֽמְרָ/ה֙ אֶל הָ/עֹמֵ֣ד לְ/נֶגְדִּ֔/י אֲדֹנִ֗/י בַּ/מַּרְאָה֙ נֶהֶפְכ֤וּ צִירַ/י֙ עָלַ֔/י וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/016.yaml
  text: And behold[a], something like the likeness of a son of man touched my lips. Then I opened my mouth and spoke, and I said to the one standing before me, “My lord, because of the vision my pains have come upon me[c][b], and I have retained no strength.”
  footnotes:
  - marker: a
    text: 'Or more idiomatically, ''one in human likeness'' or ''something like a human form.'' The Hebrew is unusually layered: ''something like the likeness of the sons of man.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'my anguish came upon me' or 'my pangs came upon me.' The Hebrew expression depicts intense distress overtaking Daniel.
    reason: lexical_alternative
  - marker: c
    text: Or 'and no strength remained in me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 사람의 아들들의 형상과 같은 어떤 이가 내 입술을 만졌습니다. 그러자 나는 입을 열어 말했고, 내 앞에 서 있는 이에게 말했습니다. “내 주여, 환상 때문에 고통이 내게 닥쳐왔고[b], 내게는 아무 힘도 남아 있지 않습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람의 아들들의 형상과 같은 어떤 이’입니다. 히브리어는 ‘같은’과 ‘형상/유사함’을 겹쳐 쓴, 의도적으로 간접적인 비교 표현입니다. 여기의 ‘사람의 아들들’은 직함이 아니라 인간들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 고통스러운 경련이 내게 닥쳐왔고’, ‘내 진통이 내게 닥쳐왔고’로 옮길 수 있습니다. 히브리어는 강한 고통이 그를 압도한 상태를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 안에는 아무 힘도 남지 않았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְמוּת בְּנֵי אָדָם
  english_pob_choice: something like the likeness of the sons of man
  chosen_korean: 인자와 비슷한 어떤 이
  alternatives_korean:
  - 사람의 형상과 같은 어떤 이
  - 사람과 같은 형체
  - 사람의 아들들과 같은 듯한 어떤 이
  lexicon: HALOT
  rationale: 비전 묘사의 비교 표현을 살려, 단순한 ‘사람’으로 평면화하지 않으면서도 자연스러운 한국어로 옮겼습니다. 여기서는 직함이 아니라 인간 형상에 가까운 어떤 존재라는 뜻을 드러내는 것이 핵심입니다.
- source_word: נֹגֵעַ עַל שְׂפָתַי
  english_pob_choice: touched my lips
  chosen_korean: 내 입술을 만졌습니다
  alternatives_korean:
  - 내 입술에 닿았습니다
  - 내 입술에 손을 댔습니다
  lexicon: HALOT
  rationale: עַל이 포함되지만 한국어에서는 ‘내 입술을 만졌다’가 가장 자연스럽고, 접촉의 즉시성을 잘 전합니다.
- source_word: הָעֹמֵד לְנֶגְדִּי
  english_pob_choice: the one standing before me
  chosen_korean: 내 앞에 서 있는 그에게
  alternatives_korean:
  - 내 앞에 서 있는 이에게
  - 내 앞에 마주 서 있는 그에게
  lexicon: HALOT
  rationale: לְנֶגֶד의 ‘앞에/마주하여’ 의미를 살리되, 비전 속 인물을 가리키는 문맥에 맞게 간결하게 옮겼습니다.
- source_word: אֲדֹנִי
  english_pob_choice: My lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 주여
  - 내 주인이여
  - 선생님
  lexicon: HALOT
  rationale: 예의 바른 호칭을 유지하되, 야훼의 이름과 구별되는 비-신명칭으로서 문맥상 존칭을 반영했습니다. 다만 한국어에서 ‘주님’이 가진 경외의 뉘앙스를 살려 직역보다 자연스럽게 처리했습니다.
- source_word: בַּמַּרְאָה
  english_pob_choice: because of the vision
  chosen_korean: 환상 때문에
  alternatives_korean:
  - 환상으로 말미암아
  - 환상 때문에 생긴
  lexicon: HALOT
  rationale: 문맥상 원인은 환상 자체이므로, ב의 인과적 용법을 한국어의 ‘때문에’로 가장 직접적으로 나타냈습니다.
- source_word: נֶהֶפְכוּ צִירַי עָלַי
  english_pob_choice: my pains have come upon me
  chosen_korean: 내 고통이 내게 닥쳐왔고
  alternatives_korean:
  - 내 고통이 내 위에 덮쳐왔고
  - 내 통증이 내게 몰려왔고
  - 내 산통 같은 고통이 내게 왔고
  lexicon: HALOT
  rationale: צִירִים의 강한 고통·뒤틀림의 뉘앙스를 살리되, 한국어로는 과도하게 신체화하지 않고 압도적 고통의 도래를 표현했습니다.
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  english_pob_choice: and I have retained no strength
  chosen_korean: 내게는 아무 힘도 남아 있지 않습니다
  alternatives_korean:
  - 나는 아무 힘도 지니지 못했습니다
  - 나는 힘을 붙들지 못했습니다
  - 나는 힘을 보존하지 못했습니다
  lexicon: HALOT
  rationale: עצר의 ‘붙들다/간직하다’ 의미를 한국어의 ‘남아 있지 않습니다’로 자연스럽게 풀어, 현재의 무기력 상태를 명확히 했습니다.
theological_decisions:
- issue: בְּנֵי אָדָם의 해석과 ‘인자’의 사용
  chosen_reading: 예언적/메시아적 직함이 아니라 인간 형상에 대한 비전적 비교로 읽고 ‘인자와 비슷한 어떤 이’로 옮겼습니다.
  alternative_readings:
  - ‘사람의 아들 같은 이’로 직역
  - 메시아적 ‘인자’로 번역
  rationale: 형태상 비교구문이며 문맥상 단수 비전 인물을 묘사할 뿐, 여기서 직함을 부여할 근거가 없습니다. 따라서 제목화하지 않고 인간 유사성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 문맥이 말하지 않는 그리스도론적 함의의 주입 금지'
