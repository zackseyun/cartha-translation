id: DAN.10.8
reference: Daniel 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י וָֽ/אֶרְאֶ֗ה אֶת הַ/מַּרְאָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/לֹ֥א נִשְׁאַר בִּ֖/י כֹּ֑ח וְ/הוֹדִ֗/י נֶהְפַּ֤ךְ עָלַ/י֙ לְ/מַשְׁחִ֔ית וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/008.yaml
  text: So I alone was left and saw this great vision[a], and no strength remained in me; my splendor was turned to ruin upon me[b], and I retained no strength.
  footnotes:
  - marker: a
    text: Or 'this great appearance' or 'this great sight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my appearance was changed to ruin' or 'my vigor was turned to ruin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 나만 홀로 남아 이 큰 환상[a]을 보았습니다. 내게는 아무 힘도 남아 있지 않았고, 내 광채[b]는 파멸로 변했으며, 나는 힘을 전혀 보존하지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 큰 모습’ 또는 ‘이 큰 광경’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 모습은 파멸로 변했고’ 또는 ‘내 기운은 쇠하여 망가졌고’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַ֣רְתִּי לְבַדִּ֔י
  english_pob_choice: I alone was left
  chosen_korean: 나만 홀로 남아
  alternatives_korean:
  - 나 혼자 남아
  - 나만 남아서
  lexicon: HALOT
  rationale: נשארתי의 ‘남다/남겨지다’와 לבדּי의 ‘홀로’라는 강조를 함께 살리되, 합쇼체 문맥에서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הַ/מַּרְאָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את
  english_pob_choice: this great vision
  chosen_korean: 이 큰 환상
  alternatives_korean:
  - 이 큰 이상
  - 이 큰 보임
  lexicon: HALOT
  rationale: 다니엘의 묵시적 문맥에서 מראה는 단순한 ‘모습’보다 계시적 ‘환상’이 더 직접적이어서, POB의 ‘vision’에 대응해 번역했습니다.
- source_word: וְ/הוֹדִ֗/י נֶהְפַּ֤ךְ עָלַ/י֙ לְ/מַשְׁחִ֔ית
  english_pob_choice: my splendor was turned to ruin upon me
  chosen_korean: 내 위엄은 나에게서 무너짐으로 바뀌었고
  alternatives_korean:
  - 내 영광은 나에게서 파멸로 바뀌었고
  - 내 빛남은 나에게서 무너짐으로 바뀌었고
  lexicon: HALOT
  rationale: הוד는 ‘위엄/광채/영예’의 범위를 가지며, 여기서는 그 외양이 급격히 쇠한 상태를 가리키므로 ‘위엄’으로 두고, לְמַשְׁחִית의 파괴적 상태를 ‘무너짐’으로 살렸습니다.
- source_word: וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ
  english_pob_choice: and I retained no strength
  chosen_korean: 나는 조금도 힘을 보존하지 못했습니다
  alternatives_korean:
  - 나는 힘을 조금도 지니지 못했습니다
  - 나는 힘을 간직하지 못했습니다
  lexicon: HALOT
  rationale: עצר는 ‘붙들다/간직하다/보존하다’의 뜻이 있으므로, 단순한 결핍보다 ‘보존하지 못하다’로 옮겨 남아 있던 힘마저 유지되지 못한 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: הַמַּרְאָה의 한국어 처리
  chosen_reading: ‘환상’
  alternative_readings:
  - ‘모습’
  - ‘보임’
  rationale: 본문은 단순 관찰이 아니라 다니엘의 묵시적 경험을 말하므로, 장르와 문맥을 반영해 ‘환상’으로 번역했습니다. 이는 계시적 성격을 흐리지 않으면서도 원어의 범위를 과도하게 좁히지 않습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: הוֹדִי와 לְמַשְׁחִית의 결합 표현
  chosen_reading: ‘내 위엄은 나에게서 무너짐으로 바뀌었고’
  alternative_readings:
  - ‘내 영광은 나에게서 파멸로 바뀌었고’
  - ‘내 외양은 나에게서 망가짐으로 바뀌었고’
  rationale: 문맥상 몸의 쇠약을 묘사하지만 원어는 단순한 육체 파손보다 인물의 정상적 ‘위엄/광채’가 급격히 무너지는 모습을 말합니다. 그래서 지나치게 의역하지 않고 상실의 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
