    rationale: 이 절은 환상으로 인한 다니엘의 신체적 쇠약과 외적 광채의 상실을 묘사합니다. ‘위엄’은 정치적·사회적 권위의 뜻으로 읽히기 쉬우며, ‘나에게서 무너짐’은 한국어 관용에 맞지 않습니다.
