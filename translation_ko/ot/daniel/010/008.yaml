revisions:
- from: 그러므로 나만 홀로 남아 이 큰 환상을 보았고, 내게는 힘이 남아 있지 않았으며, 내 위엄은 나에게서 무너짐으로 바뀌었고, 나는 조금도 힘을 보존하지 못했습니다.[a][b]
  to: 그리하여 나만 홀로 남아 이 큰 환상[a]을 보았습니다. 내게는 아무 힘도 남아 있지 않았고, 내 광채[b]는 파멸로 변했으며, 나는 힘을 전혀 보존하지 못했습니다.
  rationale: 논리적 인과를 덧붙이는 ‘그러므로’를 서사 연결인 ‘그리하여’로 바꾸었습니다. הוֹדִי는 이 쇠약의 문맥에서 ‘위엄’보다 ‘광채’가 더 적절하며, 직역하면 어색해지는 전치사구는 한국어 문장 안에서 무리 없이 처리했습니다. ‘파멸’은 לְמַשְׁחִית의 파괴·훼손의 강도를 보존하고, 용모·기력이라는 가능한 해석은 각주에 남겼습니다.
