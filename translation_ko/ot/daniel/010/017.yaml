  source_fidelity: 수정이 필요합니다. 초안의 ‘이분 같은 내 주의 종’은 זֶה가 가리키는 대상을 부자연스럽게 처리하여 ‘내 주의 종’이라는 자기지칭을 ‘이분 같은 종’으로 바꾸어 버립니다. 또한 원문에 없는 ‘보십시오’를 첨가했습니다. 반복되는 זֶה의 지시성은 ‘내 주의 이 종’과 ‘이러한 내 주’로 보존할 수 있습니다.
