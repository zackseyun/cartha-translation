source:
  edition: WLC
  text: וְ/הֵ֣יךְ יוּכַ֗ל עֶ֤בֶד אֲדֹנִ/י֙ זֶ֔ה לְ/דַבֵּ֖ר עִם אֲדֹ֣נִ/י זֶ֑ה וַ/אֲנִ֤י מֵ/עַ֨תָּה֙ לֹֽא יַעֲמָד בִּ֣/י כֹ֔חַ וּ/נְשָׁמָ֖ה לֹ֥א נִשְׁאֲרָה בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/017.yaml
  text: So how can this servant of my lord speak with my lord like this? As for me[a], from now on no strength remains in me[c][b], and no breath is left in me.
  footnotes:
  - marker: a
    text: Or 'my master' in both occurrences of 'my lord.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'this servant of my lord ... my lord like this,' with the repeated 'this' expressing immediacy; the English smooths the repetition idiomatically.
    reason: lexical_alternative
  - marker: c
    text: Or 'now' for 'from now on.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 주의 이 종이 어찌 이러한 내 주께 말씀드릴 수 있겠습니까?[a] 이제 제게는 힘이 남아 있지 않고,[b] 숨도 남아 있지 않습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이’(זֶה)를 두 번 반복하여, ‘내 주의 이 종’과 눈앞의 ‘이러한 내 주’를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지금’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 נְשָׁמָה는 여기서 ‘영’보다 ‘숨’ 또는 ‘호흡’을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד אֲדֹנִי זֶה
  english_pob_choice: this servant of my lord
  chosen_korean: 이분 같은 내 주의 종
  alternatives_korean:
  - 내 주의 종 이 사람
  - 이 종
  lexicon: HALOT
  rationale: עֶבֶד는 궁정적 겸양의 자기지칭이므로 ‘종’으로 옮기되, זֶה의 지시성을 ‘이분 같은’으로 살려 즉각적인 대면 상황을 드러냈습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주
  alternatives_korean:
  - 내 주인
  - 내 임금
  lexicon: HALOT
  rationale: 인간에게 하는 높임말로서 ‘주인’보다 ‘주’가 더 공손하고 본문의 호칭 격식을 보존합니다.
- source_word: לְדַבֵּר עִם
  english_pob_choice: speak with
  chosen_korean: 말씀드릴 수 있겠습니까
  alternatives_korean:
  - 말할 수 있겠습니까
  - 말을 나눌 수 있겠습니까
  lexicon: HALOT
  rationale: 직역의 ‘말하다/말씀하다 with’를 한국어 공손 표현으로 자연화하되, 존대 화행을 유지했습니다.
- source_word: לֹא יַעֲמָד בִּי כֹחַ
  english_pob_choice: no strength remains in me
  chosen_korean: 내게서 힘이 남아 있지 않고
  alternatives_korean:
  - 내 안에 힘이 서 있지 않고
  - 힘이 내 안에 남아 있지 않고
  lexicon: HALOT
  rationale: ‘서다’의 관용적 뉘앙스를 한국어의 ‘남아 있다’로 풀어, 신체적 기진맥진함을 자연스럽게 전달했습니다.
- source_word: וּנְשָׁמָה לֹא נִשְׁאֲרָה בִי
  english_pob_choice: and no breath is left in me
  chosen_korean: 숨도 내 안에 남아 있지 않습니다
  alternatives_korean:
  - 호흡도 내 안에 남아 있지 않습니다
  - 생기조차 내 안에 남아 있지 않습니다
  lexicon: HALOT
  rationale: נְשָׁמָה는 여기서 영이 아니라 육체적 ‘숨/호흡’을 가리키므로, 병렬 구조를 살려 ‘숨’으로 번역했습니다.
theological_decisions:
- issue: 다니엘의 겸손한 자기호칭과 호칭 격식
  chosen_reading: ‘이분 같은 내 주의 종’과 ‘내 주’로 옮겨, 하급자가 상급자에게 말하는 궁정적 겸양을 드러냈습니다.
  alternative_readings:
  - ‘내 주의 종 이 사람’
  - ‘내 주인’
  rationale: 본문의 인간 관계 호칭을 종교적 용례로 평준화하지 않고, 화자가 느끼는 거리와 경외를 보존하는 것이 문맥상 중요합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve address/register distinctions in direct speech.'
