id: DAN.10.9
reference: Daniel 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֖ע אֶת ק֣וֹל דְּבָרָ֑י/ו וּ/כְ/שָׁמְעִ/י֙ אֶת ק֣וֹל דְּבָרָ֔י/ו וַ/אֲנִ֗י הָיִ֛יתִי נִרְדָּ֥ם עַל פָּנַ֖/י וּ/פָנַ֥/י אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/009.yaml
  text: Then I heard the sound of his words[a], and when I heard the sound of his words, I fell into a deep sleep on my face[b], with my face to the ground.
  footnotes:
  - marker: a
    text: Or 'the voice of his words.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I fell asleep' or 'I was stunned into sleep'; the Hebrew denotes a deep, heavy sleep.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 말의 소리를 들었습니다. 내가 그의 말의 소리를 들었을 때, 나는 얼굴을 땅에 대고 깊이 잠들어 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 말의 음성’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊이 잠들었다’ 혹은 ‘깊은 잠에 빠졌다’. 히브리어는 깊고 무거운 잠을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  english_pob_choice: Then I heard
  chosen_korean: 그의 말의 소리를 들었습니다
  alternatives_korean:
  - 그리고 들었습니다
  - 그때 들었습니다
  lexicon: HALOT
  rationale: 히브리어의 서술 진행을 자연스럽게 살리되, 앞뒤 반복 구조에 맞게 평이한 서술문으로 옮겼습니다.
- source_word: קוֹל דְּבָרָיו
  english_pob_choice: the sound of his words
  chosen_korean: 그의 말의 소리
  alternatives_korean:
  - 그의 말의 음성
  - 그의 말의 음성 소리
  lexicon: HALOT
  rationale: קוֹל은 ‘소리/음성’의 넓은 의미를 가지며, דְּבָרָיו와 합쳐진 표현을 한국어에서는 ‘말의 소리’로 간결하게 살렸습니다.
- source_word: נִרְדָּם
  english_pob_choice: in a deep sleep
  chosen_korean: 깊이 잠들어 있었습니다
  alternatives_korean:
  - 깊은 잠에 빠져 있었습니다
  - 졸도하듯 잠들어 있었습니다
  - 깊은 잠에 들었습니다
  lexicon: HALOT
  rationale: 단순한 수면보다 강한 ‘깊은 잠/혼미한 잠’의 뉘앙스를 살리되, 한국어에서는 상태 서술로 자연스럽게 표현했습니다.
- source_word: עַל פָּנַי וּפָנַי אָרְצָה
  english_pob_choice: on my face, with my face to the ground
  chosen_korean: 얼굴을 땅에 대고
  alternatives_korean:
  - 얼굴을 땅에 박고
  - 엎드려
  lexicon: HALOT
  rationale: 두 표현이 함께 만드는 완전한 엎드림의 이미지를 한국어 관용에 맞게 하나의 동작 구문으로 압축하면서도 과도한 의역은 피했습니다.
theological_decisions:
- issue: 다니엘의 상태 표현
  chosen_reading: 초월적 환상 속에서 몸이 압도되어 깊이 잠든 상태로 서술합니다.
  alternative_readings:
  - 황홀경(트랜스)
  - 단순한 졸음
  rationale: 히브리어 נִרְדָּם은 본문상 깊은 잠/혼미 상태를 뜻하는 것이 가장 자연스러워, 기술적 ‘황홀경’ 해석을 본문에 미리 넣지 않았습니다.
  doctrine_reference: 본문 문맥 우선; 환상 체험의 신체적 압도 묘사
