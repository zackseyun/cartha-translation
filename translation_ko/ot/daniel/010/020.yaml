  rationale: שַׂר는 여기서 단순한 정치 칭호보다 지배적 존재를 가리키는 표현으로 읽히므로, 전통적 왕자보다 「방백」이 위계와 대항 구도를 더 잘 드러냅니다.
- source_word: וְהִנֵּה
