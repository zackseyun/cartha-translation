base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/020.yaml
  text: Then he said[a], “Do you know why I have come to you? And now I will return to fight against the prince of Persia; and when I go out, behold[c][b], the prince of Greece is coming.”
  footnotes:
  - marker: a
    text: 'Or ''and I am going out''; the Hebrew clause is terse, and the exact nuance may be either simple departure or a temporal sequence: ''when I go out.'''
    reason: lexical_alternative
  - marker: b
    text: '''Prince'' here likely refers to a supernatural ruler associated with a nation, though the text does not explicitly label him as such in this verse.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'Javan,' a term commonly referring to Greece or the Greek realm.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「내가 왜 당신에게 왔는지 알고 있습니까? 이제 나는 돌아가서 바사의 방백과 싸우려 합니다. 내가 나가면, 보십시오, 헬라의 방백이 오고 있습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 간결해서 ‘내가 왜 당신에게 왔는지 아십니까’ 또는 ‘내가 왜 당신에게 왔는지 이해하십니까’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘방백’은 이 문맥에서 국가를 관장하는 초월적 통치자를 가리키는 것으로 이해될 수 있습니다.
    reason: theological_note
  - marker: c
    text: ‘헬라’는 히브리어 יָוָן(야완/이완)에 해당하며, 보통 그리스 또는 그리스 세계를 가리킵니다.
    reason: lexical_alternative
