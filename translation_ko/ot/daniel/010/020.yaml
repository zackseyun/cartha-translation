  lexicon: HALOT
  rationale: 강조와 주의를 끄는 감탄사를 현대 한국어에서 자연스럽게 옮기면 「보십시오」가 가장 적절합니다.
- source_word: שַׂר יָוָן
  english_pob_choice: the prince of Greece
  chosen_korean: 헬라의 방백
