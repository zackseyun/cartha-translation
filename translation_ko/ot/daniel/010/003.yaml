id: DAN.10.3
reference: Daniel 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֶ֣חֶם חֲמֻד֞וֹת לֹ֣א אָכַ֗לְתִּי וּ/בָשָׂ֥ר וָ/יַ֛יִן לֹא בָ֥א אֶל פִּ֖/י וְ/ס֣וֹךְ לֹא סָ֑כְתִּי עַד מְלֹ֕את שְׁלֹ֥שֶׁת שָׁבֻעִ֖ים יָמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/003.yaml
  text: I ate no delicacies[a], and no meat or wine entered my mouth, nor did I anoint myself at all[b], until the completion of three full weeks.
  footnotes:
  - marker: a
    text: Literally, 'bread of desirabilities'; that is, choice or pleasant food.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'three weeks of days,' meaning three full weeks.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 별미를 먹지 않았고[a], 내 입에는 고기와 포도주가 들어오지 않았으며, 나는 전혀 몸에 기름을 바르지 않았습니다[b]. 그 일이 세 주가 다 찰 때까지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘바람직한 것들의 빵’이며, 곧 선택되거나 맛있는 음식이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 몸에 기름을 바르는 일상적 몸단장/보양을 가리키며, ‘세 주의 날들’은 곧 세 주가 온전히 찬 기간입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֲמֻדוֹת
  english_pob_choice: delicacies
  chosen_korean: 별미
  alternatives_korean:
  - 귀한 음식
  - 좋은 음식
  - 진미
  lexicon: HALOT
  rationale: 직역하면 ‘바람직한 것들의 빵’이지만, 여기서는 빵 자체보다 절식 대상이 되는 ‘선택된 음식’의 관용 표현이므로 자연스러운 한국어로 ‘별미’가 가장 가깝습니다.
- source_word: בָשָׂר וָיַיִן
  english_pob_choice: meat or wine
  chosen_korean: 고기와 포도주
  alternatives_korean:
  - 육류와 포도주
  - 고기나 포도주
  lexicon: HALOT
  rationale: 식사 금지 항목을 한국어로 자연스럽게 옮기되, ‘포도주’는 종교적 어휘를 덧씌우지 않고 원문의 음식 항목을 그대로 살렸습니다.
- source_word: סוֹךְ ... סָכְתִּי
  english_pob_choice: did I anoint myself at all
  chosen_korean: 전혀 몸에 기름을 바르지 않았습니다
  alternatives_korean:
  - 전혀 몸을 기름으로 바르지 않았습니다
  - 전혀 스스로에게 기름을 바르지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 일상적 몸단장/보양으로 기름을 바르는 행위를 가리키므로, 예배적 ‘기름부음’이 아니라 신체에 기름을 바르는 행위로 풀어야 합니다.
- source_word: שְׁלֹשֶׁת שָׁבֻעִים יָמִים
  english_pob_choice: three full weeks
  chosen_korean: 세 주가 다 찰 때까지
  alternatives_korean:
  - 세 주의 날들이 다 찰 때까지
  - 세 온전한 주가 끝날 때까지
  lexicon: HALOT
  rationale: 직역형 ‘세 주의 날들’은 한국어에서 어색하므로, POB의 ‘three full weeks’에 맞춰 기간이 완결되었음을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 절식과 금욕의 범위
  chosen_reading: 본문은 다니엘이 일정 기간 동안 선택 음식, 고기, 포도주, 몸에 바르는 기름을 모두 삼간 것으로 읽었습니다.
  alternative_readings:
  - 특정한 애곡 관행을 가리키는 것으로만 제한하는 읽기
  - ‘기름 바름’을 단순한 위생이 아닌 의례적 금식 요소로 보는 읽기
  rationale: 히브리어 동사와 POB의 audit trail이 일상적 식음과 몸단장을 함께 금하는 금식 서술임을 보여 주므로, 과도한 의례화 없이 그대로 반영했습니다.
  doctrine_reference: 단 10:2-3의 금식 서술
