  source_fidelity: 대체로 충실합니다. 음식·포도주·몸에 기름을 바르는 행위의 부정과 ‘세 주’의 완결 기간을 잘 반영했습니다. 그러나 마지막의 ‘그 일이 세 주가 다 찰 때까지였습니다’는 히브리어의 지속 행위를 부자연스럽게 명사화하여, ‘그렇게 했습니다’로 바로잡는 것이 필요합니다.
  naturalness: ‘내 입에는 고기와 포도주가 들어오지 않았으며’는 원문의 관용구를 보존하지만 한국어에서는 다소 딱딱합니다. ‘고기와 포도주도 입에 대지 않았으며’가 자연스럽고 동일한 금식 의미를 전달합니다. 기간 표현은 ‘세 주가 온전히 차기까지’가 자연스럽고 ‘three full weeks’를 잘 살립니다.
  terminology: ‘별미’, ‘고기’, ‘포도주’, ‘몸에 기름을 바르다’는 적절합니다. ‘기름부음’처럼 의례적 의미가 강한 표현을 피한 점도 좋습니다. 각주 b는 기간 표현에만 연결하고, 몸에 기름을 바르는 설명은 본문 자체로 충분하므로 분리하는 것이 앵커와 내용의 대응을 명확히 합니다.
