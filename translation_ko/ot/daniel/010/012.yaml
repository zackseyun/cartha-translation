id: DAN.10.12
reference: Daniel 10:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ אַל תִּירָ֣א דָנִיֵּאל֒ כִּ֣י מִן הַ/יּ֣וֹם הָ/רִאשׁ֗וֹן אֲשֶׁ֨ר נָתַ֧תָּ אֶֽת לִבְּ/ךָ֛ לְ/הָבִ֧ין וּ/לְ/הִתְעַנּ֛וֹת לִ/פְנֵ֥י אֱלֹהֶ֖י/ךָ נִשְׁמְע֣וּ דְבָרֶ֑י/ךָ וַ/אֲנִי בָ֖אתִי בִּ/דְבָרֶֽי/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/012.yaml
  text: Then he said to me[a], “Do not fear, Daniel, because from the first day that you set your heart to understand and to humble yourself before your God, your words were heard[b], and I have come because of your words.”
  footnotes:
  - marker: a
    text: Or “to afflict yourself.” The Hebrew can denote self-denial or self-humbling in a devotional context.
    reason: lexical_alternative
  - marker: b
    text: Or “in response to your words.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 제게 말했습니다. “두려워하지 마십시오, 다니엘아. 당신이 깨닫고 당신의 하나님 앞에서 스스로 낮추는 데 마음을 두었던 첫날부터 당신의 말이 들렸습니다. 나는 당신의 말 때문에[a] 왔습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 말에 응답하여.”
    reason: alternative_reading
  - marker: b
    text: ‘스스로 낮추는’은 또한 “스스로를 괴롭게 하는” 또는 “자기를 절제하는” 것으로 옮길 수 있습니다. 히브리어는 경건한 문맥에서 자기 낮춤이나 자기 절제를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 말라
  lexicon: HALOT
  rationale: 천사의 위로와 경고에서 금지 명령을 자연스럽고 단정하게 살리기 위해 ‘두려워하지 마십시오’를 택했습니다.
- source_word: נָתַתָּ אֶת לִבְּךָ לְהָבִין
  english_pob_choice: you set your heart to understand
  chosen_korean: 마음을 두어 깨닫고
  alternatives_korean:
  - 마음을 두어 이해하고
  - 마음을 기울여 깨닫고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음을 두다’를 살리면서, לְהָבִין의 인지적 뜻을 ‘깨닫다’로 자연스럽게 옮겼습니다.
- source_word: וּלְהִתְעַנּוֹת
  english_pob_choice: to humble yourself
  chosen_korean: 스스로를 낮추기로 한
  alternatives_korean:
  - 스스로를 괴롭게 하기로 한
  - 자신을 괴롭게 하기로 한
  lexicon: HALOT
  rationale: 문맥상 경건한 자기 낮춤을 뜻하므로, 영어 POB의 해석을 따라 ‘스스로를 낮추다’로 옮기되, 히브리어의 자기 겸비/자기 고난 뉘앙스를 보존했습니다.
- source_word: נִשְׁמְעוּ דְבָרֶיךָ
  english_pob_choice: your words were heard
  chosen_korean: 당신의 말이 들렸습니다
  alternatives_korean:
  - 당신의 말이 들렸습니다
  - 당신의 기도가 들렸습니다
  lexicon: HALOT
  rationale: דְבָרֶיךָ를 ‘말’로 직역해 원문의 표현을 유지했습니다. ‘기도’는 문맥상 가능하지만 여기서는 본문이 실제로 ‘말들’이라고 말하므로 더 직접적인 표현을 택했습니다.
- source_word: וַאֲנִי בָאתִי בִּדְבָרֶיךָ
  english_pob_choice: I have come because of your words
  chosen_korean: 나는 당신의 말 때문에 왔습니다
  alternatives_korean:
  - 나는 당신의 말에 응답하여 왔습니다
  - 나는 당신의 말 때문에 왔습니다
  lexicon: HALOT
  rationale: בִּדְבָרֶיךָ의 원인/계기 의미를 한국어의 ‘~때문에’로 투명하게 살려, 도착의 이유가 다니엘의 말에 있었다는 점을 분명히 했습니다.
theological_decisions:
- issue: וּלְהִתְעַנּוֹת의 의미 범위
  chosen_reading: 스스로를 낮추기로 한
  alternative_readings:
  - 스스로를 괴롭게 하기로 한
  - 자기 부인을 하기로 한
  rationale: 본문은 다니엘의 경건한 자기 낮춤을 말하지만, 특정 금욕 규범을 세우지는 않습니다. ‘스스로를 낮추다’는 영적 겸비를 살리면서 과도한 의역을 피합니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: בִּדְבָרֶיךָ의 인과성
  chosen_reading: 당신의 말 때문에
  alternative_readings:
  - 당신의 말에 응답하여
  - 당신의 말로 말미암아
  rationale: 사자가 온 계기를 분명히 하되, 사역의 메커니즘을 과하게 설명하지 않기 위해 직접적 인과 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
