id: DAN.10.1
reference: Daniel 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁל֗וֹשׁ לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס דָּבָר֙ נִגְלָ֣ה לְ/דָֽנִיֵּ֔אל אֲשֶׁר נִקְרָ֥א שְׁמ֖/וֹ בֵּלְטְשַׁאצַּ֑ר וֶ/אֱמֶ֤ת הַ/דָּבָר֙ וְ/צָבָ֣א גָד֔וֹל וּ/בִין֙ אֶת הַ/דָּבָ֔ר וּ/בִ֥ינָה ל֖/וֹ בַּ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/001.yaml
  text: In the third year of Cyrus king of Persia[a], a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict; and he understood the word and had understanding in the vision.
  footnotes:
  - marker: a
    text: Or, 'and a great warfare.' The Hebrew phrase can also be rendered more formally in military terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 페르시아 왕 고레스 제삼년에, 벨드사살이라고도 불린 다니엘에게 한 말씀이 계시되었습니다. 그 말씀은 참되었고 큰 분쟁[a]에 관한 것이었습니다. 다니엘은 그 말씀을 깨달았고, 그 환상 가운데서 깨달음을 얻었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 전쟁’ 또는 ‘큰 전투’. 히브리어 구문은 더 직접적인 군사 용어로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבָר
  english_pob_choice: a word
  chosen_korean: 한 말씀
  alternatives_korean:
  - 한 말
  - 한 소식
  - 한 메시지
  lexicon: HALOT
  rationale: 계시의 내용이라는 점을 살리면서도 한국어 성경 문체에서 자연스러운 ‘말씀’을 썼습니다. ‘말’보다 더 공적이고, ‘메시지’보다 원문 어감을 보존합니다.
- source_word: נִגְלָה
  english_pob_choice: was revealed
  chosen_korean: 나타났습니다
  alternatives_korean:
  - 계시되었습니다
  - 드러났습니다
  lexicon: HALOT
  rationale: 니팔형의 ‘드러남/드러내어짐’이라는 수동적 계시 의미를 반영했습니다. 다만 한국어에서는 ‘말씀이 나타났습니다’가 지나치게 둔하지 않고 자연스럽습니다.
- source_word: וְצָבָא גָדוֹל
  english_pob_choice: it concerned a great conflict
  chosen_korean: 큰 전쟁에 관한 것이었으며
  alternatives_korean:
  - 큰 전쟁과 관련된 것이었으며
  - 큰 분쟁에 관한 것이었으며
  - 큰 전쟁이었습니다
  lexicon: HALOT
  rationale: POB가 주석에서 제시한 ‘great warfare’의 여지를 살리되, 본문 흐름상 단순한 군대보다 갈등·전투 상황을 가리키는 넓은 뜻을 한국어로 드러냈습니다.
- source_word: וּבִינָה לֹו בַמַּרְאֶה
  english_pob_choice: had understanding in the vision
  chosen_korean: 그 환상 가운데서 분별력을 얻었습니다
  alternatives_korean:
  - 그 환상 가운데서 이해력을 얻었습니다
  - 그 환상 속에서 깨달음을 얻었습니다
  - 그 환상 가운데서 이해했습니다
  lexicon: HALOT
  rationale: ‘בינה לו’의 수여/소유 뉘앙스를 살려 단순히 ‘이해했다’보다 ‘분별력을 얻었다’로 옮겼습니다. ‘환상’은 다니엘의 계시 문맥에서 מראה의 자연스러운 대응입니다.
theological_decisions:
- issue: ‘큰 전쟁’으로 옮긴 צָבָא גָדוֹל의 해석 범위
  chosen_reading: 군사적 ‘전쟁’이면서도 다니엘 10–12장의 영적·역사적 संघर्ष 전체를 암시하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘큰 군대’
  - ‘큰 분쟁’
  - ‘큰 전쟁/전투’로 좁혀 번역
  rationale: 본문과 문맥은 단순한 병력의 규모보다 계시 내용의 संघर्ष성을 강조합니다. 그래서 영어 POB의 ‘great conflict’와 주석의 ‘great warfare’ 사이 긴장을 한국어에서도 보존했습니다.
  doctrine_reference: Daniel 10–12의 계시적 전쟁 모티프
