revisions:
- from: 페르시아 왕 고레스의 제삼년에 한 말씀이 다니엘에게 나타났습니다. 그는 벨드사살이라 불렸습니다. 그 말은 참되었고 큰 전쟁에 관한 것이었으며, 그는 그 말씀을 깨달았고 그 환상 가운데서 분별력을 얻었습니다.[a]
  to: 페르시아 왕 고레스 제삼년에, 벨드사살이라고도 불린 다니엘에게 한 말씀이 계시되었습니다. 그 말씀은 참되었고 큰 분쟁[a]에 관한 것이었습니다. 다니엘은 그 말씀을 깨달았고, 그 환상 가운데서 깨달음을 얻었습니다.
  rationale: 원문의 수동적 계시 표현을 ‘계시되었습니다’로 명확히 하고, 다니엘의 다른 이름을 관계절 형태로 자연스럽게 처리했습니다. צָבָא גָדוֹל의 의미를 한쪽으로 과도하게 확정하지 않도록 본문에서는 ‘큰 분쟁’을 사용하고 군사적 대안을 각주에 보존했습니다. 각주 앵커와 문구도 해당 어구에 정확히 맞추어 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:49:00Z'
