  text: וְ/רָאִיתִי֩ אֲנִ֨י דָנִיֵּ֤אל לְ/בַדִּ/י֙ אֶת הַ/מַּרְאָ֔ה וְ/הָ/אֲנָשִׁים֙ אֲשֶׁ֣ר הָי֣וּ עִמִּ֔/י לֹ֥א רָא֖וּ אֶת הַ/מַּרְאָ֑ה אֲבָ֗ל חֲרָדָ֤ה גְדֹלָה֙ נָפְלָ֣ה עֲלֵי/הֶ֔ם וַֽ/יִּבְרְח֖וּ בְּ/הֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/007.yaml
  text: And I[a], Daniel, alone saw the vision, and the men who were with me did not see the vision; but a great trembling fell upon them[b], and they fled to hide themselves.
  footnotes:
  - marker: a
    text: Or 'a great terror fell upon them.' The Hebrew חֲרָדָה can denote trembling, dread, or terror.
    reason: lexical_alternative
  - marker: b
    text: Or 'they fled and hid themselves' / 'they fled into hiding.' The Hebrew infinitive בְּהֵחָבֵא expresses the purpose or manner of their flight.
    reason: lexical_alternative
translation:
  language: ko
  text: 나, 다니엘은 홀로 그 환상을 보았고, 나와 함께 있던 사람들은 그 환상을 보지 못했습니다. 그러나 큰 떨림이 그들 위에 내려왔고, 그들은 숨어 달아났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 떨림’은 ‘큰 공포’ 또는 ‘큰 두려움’으로도 옮길 수 있습니다. 히브리어 חֲרָדָה는 떨림, 두려움, 공포를 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숨어 달아났습니다’는 ‘달아나 숨었습니다’ 또는 ‘숨으려고 달아났습니다’로도 옮길 수 있습니다. 히브리어 בְּהֵחָבֵא는 도주의 목적이나 방식을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אֲנִי דָנִיֵּאל
  english_pob_choice: And I, Daniel, alone saw
  chosen_korean: 나, 다니엘은 홀로 보았고
  alternatives_korean:
  - 나 다니엘은 홀로 보았고
  - 내가 다니엘은 홀로 보았고
  lexicon: WLC/HALOT
  rationale: 주어의 강조를 살리기 위해 ‘나, 다니엘’로 옮기고, 완료된 시각 경험은 간단히 ‘보았고’로 처리했습니다.
- source_word: לְבַדִּי
  english_pob_choice: alone
  chosen_korean: 홀로
  alternatives_korean:
  - 혼자
  - 오직 나만
  lexicon: HALOT
  rationale: 배타적 의미를 자연스럽게 살리되, 문맥상 Daniel만 보았다는 대조를 매끄럽게 전달합니다.
- source_word: הַמַּרְאָה
  english_pob_choice: the vision
  chosen_korean: 그 환상
  alternatives_korean:
  - 그 이상
  - 그 보이는 것
  lexicon: HALOT
  rationale: 다니엘서의 묵시 문맥에서는 단순한 ‘모습’보다 계시적 체험을 가리키는 ‘환상’이 더 정확합니다.
- source_word: חֲרָדָה גְדֹלָה
  english_pob_choice: a great trembling
  chosen_korean: 큰 떨림
  alternatives_korean:
  - 큰 두려움
  - 큰 공포
  lexicon: HALOT
  rationale: חֲרָדָה는 두려움과 떨림의 결을 함께 가지므로, 몸의 반응을 포함하는 ‘떨림’으로 옮겨 영어 본문의 선택을 반영했습니다.
- source_word: בְּהֵחָבֵא
  english_pob_choice: to hide themselves
  chosen_korean: 숨어 달아났습니다
  alternatives_korean:
  - 자기들을 숨기려고 달아났습니다
  - 숨어 있었습니다
  lexicon: HALOT
  rationale: 부정사구가 도주의 방식/목적을 나타내므로, 한국어에서는 결과를 드러내는 ‘숨어 달아났습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 다니엘만 환상을 보고 동행자들은 보지 못했으나 두려움은 실제로 임함
  chosen_reading: 동행자들의 반응을 단순 심리 상태가 아니라 외부에서 ‘내려온’ 떨림으로 표현했습니다.
  alternative_readings:
  - 그들이 그냥 몹시 놀랐다고 완화하여 번역할 수 있음
  - ‘공포’로만 옮겨 내적 감정에 한정할 수 있음
  rationale: 히브리어 נָפְלָה עֲלֵיהֶם의 ‘그들 위에 내려왔다’는 이미지와 חזקה한 반응을 보존해야 하므로, 감정의 완화보다 압도성을 살렸습니다.
  doctrine_reference: 본문 관찰에 따른 서술적 선택
