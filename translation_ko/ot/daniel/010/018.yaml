  naturalness: ‘사람의 모습과 같은 이’는 이해되지만 다소 직역투입니다. ‘사람의 모습을 한 이’가 현대 표준 한국어에서 더 자연스럽고, 외양에 관한 서술이라는 점도 유지합니다.
