  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧סֶף וַ/יִּגַּע בִּ֛/י כְּ/מַרְאֵ֥ה אָדָ֖ם וַֽ/יְחַזְּקֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/018.yaml
  text: Again one with the appearance of a man touched me and strengthened me[a].
  footnotes:
  - marker: a
    text: Or, 'like the appearance of a man' or 'one like a man.' The Hebrew describes the figure's visible likeness without explicitly identifying him as merely human.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다시 사람의 모습과 같은 이가 내게 손을 대어 나를 강하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 모습처럼’ 혹은 ‘사람 같은 이’. 히브리어는 이 존재의 겉모양이 사람과 닮았음을 말할 뿐, 그가 단지 인간이라고 명시하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  english_pob_choice: Again
  chosen_korean: 그러자 다시
  alternatives_korean:
  - 그리고
  - 또다시
  lexicon: HALOT
  rationale: 동작의 반복·재개를 나타내는 יסף의 용법을 살려, 사건이 이어져 다시 일어났음을 자연스럽게 표현했습니다.
- source_word: וַיִּגַּע בִּי
  english_pob_choice: touched me
  chosen_korean: 내게 손을 대어
  alternatives_korean:
  - 나를 만져
  - 나를 건드려
  lexicon: HALOT
  rationale: 비전 장면에서의 실제 접촉을 분명히 하면서도, 한국어에서 가장 자연스럽고 문맥에 맞는 신체 접촉 표현으로 옮겼습니다.
- source_word: כְּמַרְאֵה אָדָם
  english_pob_choice: one with the appearance of a man
  chosen_korean: 사람의 모습과 같은 이
  alternatives_korean:
  - 사람의 모습처럼 보이는 이
  - 한 사람 같은 이
  lexicon: HALOT
  rationale: כְּ + מַרְאֶה가 ‘~처럼 보이는/같은’ 외형의 유사성을 나타내므로, 그 존재를 곧바로 사람으로 동일시하지 않도록 했습니다.
- source_word: וַיְחַזְּקֵנִי
  english_pob_choice: strengthened me
  chosen_korean: 나를 강하게 하셨습니다
  alternatives_korean:
  - 나를 강하게 하였습니다
  - 나를 굳세게 하셨습니다
  lexicon: HALOT
  rationale: חזק의 피엘형이 ‘강하게 하다/힘을 주다’의 의미이므로, 단순한 정서적 격려보다 포괄적인 강화의 뜻을 살렸습니다.
theological_decisions:
- issue: 사람의 모습과 같은 이의 정체를 밝힐지 여부
  chosen_reading: 정체를 특정하지 않고 묘사만 유지했습니다.
  alternative_readings:
  - 천사로 해석
  - 성육신 이전의 그리스도로 해석
  rationale: 히브리어 본문은 외형적 유사성과 접촉, 강건하게 함만 말하므로, 본문이 명시하지 않은 신학적 동일시를 번역에 미리 넣지 않았습니다.
  doctrine_reference: 본문이 허용하는 긴장 보존
