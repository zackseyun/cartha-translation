revisions:
- from: 그러나 바사 왕국의 군주가 나를 대적해 이십일 일 동안 버텼습니다. 그런데 보십시오, 가장 높은 군주들 가운데 하나인 미가엘이 나를 도우러 왔습니다. 그리고 나는 거기, 바사의 왕들 곁에 남겨졌습니다.[a]
  to: 그러나 바사 왕국의 군주가 스물하루 동안 나를 맞서고 있었습니다. 보십시오, 으뜸가는 군주들 가운데 하나인 미가엘이 나를 도우러 왔습니다.[a] 그리고 나는 그곳에서 바사의 왕들 곁에 남겨졌습니다.
  rationale: 대적의 지속을 더 정확히 드러내도록 동사를 고치고, 수량 표현을 현대적으로 다듬었습니다. הָרִאשֹׁנִים의 위계 의미와 해석상 여지를 보존하되 자연스러운 표현으로 조정했습니다. 각주 표지를 설명 대상에 연결했으며, ‘바사의 왕들’이라는 원문의 복수형과 ‘곁에’라는 위치 관계는 그대로 유지했습니다.
