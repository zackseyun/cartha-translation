reference: Daniel 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂ֣ר מַלְכ֣וּת פָּרַ֗ס עֹמֵ֤ד לְ/נֶגְדִּ/י֙ עֶשְׂרִ֣ים וְ/אֶחָ֣ד י֔וֹם וְ/הִנֵּ֣ה מִֽיכָאֵ֗ל אַחַ֛ד הַ/שָּׂרִ֥ים הָ/רִאשֹׁנִ֖ים בָּ֣א לְ/עָזְרֵ֑/נִי וַ/אֲנִי֙ נוֹתַ֣רְתִּי שָׁ֔ם אֵ֖צֶל מַלְכֵ֥י פָרָֽס׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/013.yaml
  text: But the prince of the kingdom of Persia stood against me for twenty-one days[a], and behold, Michael, one of the chief princes, came to help me[b], and I was left there beside the kings of Persia.
  footnotes:
  - marker: a
    text: Or 'one of the first princes' or 'one of the foremost princes.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the kings of Persia'; some translations smooth this to 'the king of Persia,' but the Hebrew text is plural.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 바사 왕국의 군주가 나를 대적해 이십일 일 동안 버텼습니다. 그런데 보십시오, 가장 높은 군주들 가운데 하나인 미가엘이 나를 도우러 왔습니다. 그리고 나는 거기, 바사의 왕들 곁에 남겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘가장 먼저인 군주들 가운데 하나’ 또는 ‘가장 뛰어난 군주들 가운데 하나’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר
  english_pob_choice: prince
  chosen_korean: 군주
  alternatives_korean:
  - 방백
  - 통치자
  - 왕자
  lexicon: HALOT
  rationale: 본문의 שַׂר는 단순한 관리자가 아니라 높은 지위의 지배자/수호자라는 뉘앙스를 가지므로, 인간 정치권력과 천상적 존재를 모두 열어 두는 ‘군주’가 한국어에서 가장 절충적입니다.
- source_word: מַלְכוּת פָּרַס
  english_pob_choice: the kingdom of Persia
  chosen_korean: 바사 왕국
  alternatives_korean:
  - 바사의 나라
  - 페르시아 왕국
  lexicon: HALOT
  rationale: מַלְכוּת의 ‘왕국/나라’ 의미를 살리면서, 다니엘서의 통용 지명인 ‘바사’를 사용해 원문의 공식적 결합을 유지했습니다.
- source_word: עֶשְׂרִים וְאֶחָד יוֹם
  english_pob_choice: for twenty-one days
  chosen_korean: 이십일 일 동안
  alternatives_korean:
  - 21일 동안
  - 스물하루 동안
  lexicon: HALOT
  rationale: 지속 기간을 자연스러운 한국어로 옮기되, 숫자 표현은 본문의 수량성을 분명히 드러내도록 했습니다.
- source_word: אַחַד הַשָּׂרִים הָרִאשֹׁנִים
  english_pob_choice: one of the chief princes
  chosen_korean: 가장 높은 군주들 가운데 하나
  alternatives_korean:
  - 수석 군주들 가운데 하나
  - 첫째가는 군주들 가운데 하나
  lexicon: HALOT
  rationale: הָרִאשֹׁנִים의 ‘첫째/우선의’ 뉘앙스를 직역하되, 한국어에서는 위계의 최상위를 드러내는 ‘가장 높은’이 가장 자연스럽습니다.
- source_word: אֵצֶל מַלְכֵי פָרָס
  english_pob_choice: with the kings of Persia
  chosen_korean: 바사의 왕들 곁에
  alternatives_korean:
  - 바사의 왕들과 함께
  - 바사의 왕들 옆에
  lexicon: HALOT
  rationale: אֵצֶל의 ‘곁에, 옆에, 가까이에’라는 공간적 뉘앙스를 살려, POB가 보존한 복수형 ‘왕들’도 함께 반영했습니다.
theological_decisions:
- issue: ‘미가엘’과 여러 ‘군주들’의 존재를 어떻게 드러낼지
  chosen_reading: 본문의 신비한 천상-정치적 긴장을 풀어 설명하지 않고, ‘군주’와 ‘가장 높은 군주들’이라는 표현만 유지했습니다.
  alternative_readings:
  - 천사장 미가엘
  - 천상 군주들
  - 영적 통치자
  rationale: 원문은 שַׂר라는 용어를 쓰며, 해석을 확정하지 않은 채 대적과 도움의 구도를 제시합니다. 한국어에서도 동일한 긴장을 보존하는 것이 번역상 더 충실합니다.
  doctrine_reference: 원문 우선, 해석적 확정 회피
- issue: ‘바사의 왕들’ 복수형 처리
  chosen_reading: 복수형을 그대로 ‘바사의 왕들’로 옮겼습니다.
  alternative_readings:
  - 바사의 왕
  - 바사의 왕권
  - 바사의 여러 왕들
  rationale: 히브리어의 복수형을 평탄화하지 않고 보존해, 본문이 의도하는 역사적/문학적 복합성을 유지합니다.
  doctrine_reference: 원문 형식 보존
