  source_fidelity: ‘버텼습니다’는 페르시아 왕국의 군주가 일정 기간 견뎌 냈다는 뜻으로 읽히기 쉬워, עֹמֵד לְנֶגְדִּי의 대항·대적의 뜻을 충분히 전달하지 못합니다. ‘맞서 있었습니다’는 지속성과 적대적 대립을 자연스럽게 보존합니다. 히브리어의 복수형 ‘바사의 왕들’과 אֵצֶל의 공간적 관계는 유지했습니다.
  naturalness: ‘이십일 일’은 표기상 다소 어색하므로 현대 표준어에서는 ‘스물하루’가 자연스럽습니다. ‘으뜸가는 군주들 가운데 하나’는 위계상 두드러진 군주들 가운데 한 명이라는 뜻을 자연스럽고 절제되게 전달합니다.
  terminology: ‘군주’는 שַׂר의 정치적·천상적 함의를 어느 한쪽으로 한정하지 않으므로 유지할 수 있습니다. ‘미가엘’ 및 ‘바사’도 다니엘서 한국어 전통과 현대 독해에 무리가 없습니다. 각주 표지는 해당 어구 바로 뒤에 두어야 합니다.
