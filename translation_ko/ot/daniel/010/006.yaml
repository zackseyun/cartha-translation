base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/006.yaml
  text: His body was like beryl[a], his face like the appearance of lightning, his eyes like torches of fire, his arms and his feet like the gleam of polished bronze[c][b], and the sound of his words like the sound of a multitude.
  footnotes:
  - marker: a
    text: Or 'topaz,' 'chrysolite,' or another precious stone; the exact identification of Hebrew tarshish is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'like the appearance of burnished bronze.'
    reason: lexical_alternative
  - marker: c
    text: Or 'like the sound of a crowd' or 'like the roar of a multitude.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 몸은 베릴[a] 같았고, 그의 얼굴은 번개의 모습 같았으며, 그의 눈은 불붙은 횃불 같았고, 그의 팔과 발은 윤이 나는 청동[b]의 빛깔 같았으며, 그의 말소리는 많은 무리의 소리[c] 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תַרְשִׁישׁ은 정확한 광물 식별이 불확실하여, ‘황옥’, ‘크리솔라이트’ 또는 다른 보석으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광택 낸 청동의 모습’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘군중의 소리’ 또는 ‘많은 무리의 함성’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְוִיָּתוֹ
  english_pob_choice: His body
  chosen_korean: 그의 몸
  alternatives_korean:
  - 그의 육체
  - 그의 형체
  lexicon: HALOT
  rationale: גְוִיָּה는 몸체나 육체를 가리키며, 환상 묘사에서는 자연스럽고 구체적인 ‘몸’이 가장 잘 맞습니다.
- source_word: כְתַרְשִׁישׁ
  english_pob_choice: like beryl
  chosen_korean: 베릴 같았고
  alternatives_korean:
  - 황옥 같았고
  - 크리소라이트 같았고
  - 다르시스 돌 같았고
  lexicon: HALOT
  rationale: 히브리어 תַרְשִׁישׁ의 정확한 광물 식별은 불확실하므로, 통용되는 보석명 ‘베릴’을 쓰되 주석에서 불확실성을 보존합니다.
- source_word: כְמַרְאֵה בָרָק
  english_pob_choice: like the appearance of lightning
  chosen_korean: 번개의 모습 같았으며
  alternatives_korean:
  - 번개 같았으며
  - 번개의 빛남 같았으며
  lexicon: HALOT
  rationale: מַרְאֶה의 ‘보이는 모습/외형’ 뉘앙스를 살려 ‘번개의 모습’으로 옮겼습니다.
- source_word: כְלַפִּידֵי אֵשׁ
  english_pob_choice: like torches of fire
  chosen_korean: 불붙은 횃불 같았고
  alternatives_korean:
  - 불타는 횃불 같았고
  - 불의 횃불 같았고
  lexicon: HALOT
  rationale: לַפִּיד는 횃불, 불붙은 막대기를 뜻하므로 생생한 시각 이미지를 살리는 ‘불붙은 횃불’이 적절합니다.
- source_word: כְעֵין נְחֹשֶׁת קָלָל
  english_pob_choice: like the gleam of polished bronze
  chosen_korean: 다듬은 놋의 빛깔 같았으며
  alternatives_korean:
  - 광택 낸 놋의 빛 같았으며
  - 번쩍이는 놋의 빛깔 같았으며
  - 광택 있는 놋의 모습 같았으며
  lexicon: HALOT
  rationale: עֵין은 여기서 ‘모습/빛깔’의 뜻이고, קָלָל은 문맥상 닦아낸, 윤이 난 상태를 가리키므로 ‘다듬은 놋의 빛깔’로 옮겼습니다.
- source_word: קוֹל דְּבָרָיו
  english_pob_choice: the sound of his words
  chosen_korean: 그의 말의 소리
  alternatives_korean:
  - 그의 말소리
  - 그의 말하는 소리
  lexicon: HALOT
  rationale: 직역에 가까운 구조를 유지해, 말 자체의 청각적 인상을 드러내는 표현으로 옮겼습니다.
- source_word: כְקוֹל הָמוֹן
  english_pob_choice: like the sound of a multitude
  chosen_korean: 많은 무리의 소리
  alternatives_korean:
  - 군중의 소리
  - 많은 사람들의 소리
  - 떠드는 무리의 소리
  lexicon: HALOT
  rationale: הָמוֹן은 ‘무리’와 ‘웅성거리는 소리’의 뉘앙스를 함께 가지므로, 해석을 과도하게 좁히지 않는 ‘많은 무리의 소리’가 적절합니다.
theological_decisions:
- issue: 환상 속 인물의 정체를 번역문에서 특정할지 여부
  chosen_reading: 본문의 묘사만 따라가며, 그 인물을 천사나 신현으로 단정하지 않고 서술적으로 번역했습니다.
  alternative_readings:
  - 천사적 사자로 명시하기
  - 신현적 현현으로 읽기
  - 선재하신 메시아로 번역문에서 암시하기
  rationale: 이 절 자체는 외형 묘사만 제시할 뿐 정체를 명시하지 않으므로, 번역문에 해석을 덧씌우지 않고 본문이 말하는 범위 안에 머물렀습니다.
  doctrine_reference: Translation philosophy items 1 and 3
