  lexicon: HALOT
  rationale: 히필의 사역성을 반영해 단순히 '알다'가 아니라 이해하게 하다라는 뜻을 살렸고, 현대 한국어에서 자연스럽게 '깨닫게 하다'로 옮겼습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 후일에
  - 끝날에
  lexicon: HALOT
  rationale: 예언적 관용구를 직역에 가깝게 유지하되, 한국어에서 종말론적 뉘앙스를 전달하는 표현으로 옮겼습니다.
- source_word: לַיָּמִים
  english_pob_choice: for days to come
  chosen_korean: 먼 날들에 관한 것
  alternatives_korean:
  - 다가올 날들을 위한 것
  - 오래 뒤의 날들을 위한 것
  lexicon: HALOT
  rationale: 단순한 수량('많은 날')이 아니라 시간적 미래성을 가리키므로, '관한 것'을 덧붙여 환상의 대상이 장차 있을 일임을 분명히 했습니다.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים의 종말론적 관용구 처리
  chosen_reading: 마지막 날들
  alternative_readings:
