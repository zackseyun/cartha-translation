  text: וּ/בָ֨אתִי֙ לַ/הֲבִ֣ינְ/ךָ֔ אֵ֛ת אֲשֶׁר יִקְרָ֥ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֣ית הַ/יָּמִ֑ים כִּי ע֥וֹד חָז֖וֹן לַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
  footnotes:
  - marker: a
    text: Or "in the last days." The Hebrew expression is a prophetic idiom for the future culmination of events.
    reason: alternative_reading
  - marker: b
    text: Or "for many days" or "for future days." The phrase indicates that the vision concerns a time still ahead.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 와서 당신을 깨닫게 하려고 합니다. 곧 당신의 백성에게 마지막 날들에 일어날 일을 말해 드리려는 것입니다. 이는 그 환상이 아직도 먼 날들에 관한 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마지막 날들에”. 이 히브리어 표현은 장차 사건들이 절정에 이를 미래를 가리키는 예언적 관용구입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “많은 날들 동안” 혹은 “다가올 날들을 위해”. 이 표현은 환상이 아직 앞에 있는 시기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  english_pob_choice: And I have come
  chosen_korean: 제가 와서
  alternatives_korean:
  - 그리고 제가 왔습니다
  - 제가 왔습니다
  lexicon: HALOT
  rationale: 완료된 도착을 한국어 자연문으로 풀되, 현재 목적을 밝히는 문맥을 살려 '와서'로 이어 주었습니다.
- source_word: לַהֲבִינְךָ
  english_pob_choice: to make you understand
  chosen_korean: 당신을 깨닫게 하려고 합니다
  alternatives_korean:
  - 당신이 이해하도록
  - 당신에게 깨우침을 주려고 합니다
  lexicon: HALOT
  rationale: 히필의 사역성을 반영해 단순히 '알다'가 아니라 이해하게 하다라는 뜻을 살렸고, 현대 한국어에서 자연스럽게 '깨닫게 하다'로 옮겼습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 후일에
  - 끝날에
  lexicon: HALOT
  rationale: 예언적 관용구를 직역에 가깝게 유지하되, 한국어에서 종말론적 뉘앙스를 전달하는 표현으로 옮겼습니다.
- source_word: לַיָּמִים
  english_pob_choice: for days to come
  chosen_korean: 먼 날들에 관한 것
  alternatives_korean:
  - 다가올 날들을 위한 것
  - 오래 뒤의 날들을 위한 것
  lexicon: HALOT
  rationale: 단순한 수량('많은 날')이 아니라 시간적 미래성을 가리키므로, '관한 것'을 덧붙여 환상의 대상이 장차 있을 일임을 분명히 했습니다.
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים의 종말론적 관용구 처리
  chosen_reading: 마지막 날들
  alternative_readings:
  - 말세
  - 후일
  rationale: 본문의 예언적 긴장을 유지하면서도 한국어 독자가 즉시 마지막 시기를 떠올리게 하는 표현을 택했습니다. 다만 교리적으로 특정 종말 체계를 미리 결정하지는 않도록 너무 기술적인 용어는 피했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
