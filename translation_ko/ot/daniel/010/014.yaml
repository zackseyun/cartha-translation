base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
  footnotes:
  - marker: a
    text: Or "in the last days." The Hebrew expression is a prophetic idiom for the future culmination of events.
    reason: alternative_reading
  - marker: b
    text: Or "for many days" or "for future days." The phrase indicates that the vision concerns a time still ahead.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 온 것은 당신의 백성에게 후일에[a] 일어날 일을 당신이 이해하도록 하기 위해서입니다. 이 환상은 아직도 앞으로 올 날들에[b] 관한 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마지막 날들에.” 이 히브리어 표현은 장차 사건들이 절정에 이를 미래를 가리키는 예언적 관용구입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “많은 날들 동안” 또는 “장래의 날들을 위하여.” 이 표현은 환상이 아직 앞에 있는 시기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  english_pob_choice: And I have come
  chosen_korean: 제가 와서
  alternatives_korean:
  - 그리고 제가 왔습니다
  - 제가 왔습니다
  lexicon: HALOT
  rationale: 완료된 도착을 한국어 자연문으로 풀되, 현재 목적을 밝히는 문맥을 살려 '와서'로 이어 주었습니다.
- source_word: לַהֲבִינְךָ
  english_pob_choice: to make you understand
  chosen_korean: 당신을 깨닫게 하려고 합니다
  alternatives_korean:
  - 당신이 이해하도록
