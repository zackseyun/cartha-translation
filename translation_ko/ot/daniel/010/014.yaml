revisions:
- from: 제가 와서 당신을 깨닫게 하려고 합니다. 곧 당신의 백성에게 마지막 날들에 일어날 일을 말해 드리려는 것입니다. 이는 그 환상이 아직도 먼 날들에 관한 것이기 때문입니다.[a][b]
  to: 내가 온 것은 당신의 백성에게 후일에[a] 일어날 일을 당신이 이해하도록 하기 위해서입니다. 이 환상은 아직도 앞으로 올 날들에[b] 관한 것이기 때문입니다.
  rationale: 원문의 완료된 도착과 목적 관계를 '내가 온 것은 … 하기 위해서입니다'로 재구성하고, 히필 사역형을 '이해하도록 하다'로 옮겼습니다. 원문에 없는 '말하다'를 삭제했으며, 두 시간 표현의 각주를 각각의 본문 어구에 직접 연결했습니다. '후일'은 בְּאַחֲרִית הַיָּמִים의 예언적 미래성을 유지하면서 특정 종말론 체계를 확정하지 않습니다.
