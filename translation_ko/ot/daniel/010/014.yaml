    rationale: 원문은 화자가 다니엘을 이해하게 하려는 목적을 말할 뿐, 별도로 말해 주려 한다는 행위를 표현하지 않습니다.
  - severity: medium
    issue: לַהֲבִינְךָ를 '당신을 깨닫게 하려고'로 옮김
    rationale: 히필은 이해하게 하다는 사역 의미이며, 한국어 '깨닫게 하다'는 본문보다 자각·각성의 의미를 덧입힐 수 있습니다.
  - severity: medium
    issue: 각주 a가 본문 표현과 동일하고, 각주 표지가 해당 어구에 연결되지 않음
