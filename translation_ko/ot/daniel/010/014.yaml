  source_fidelity: 개정이 필요합니다. 초안은 לַהֲבִינְךָ의 사역적 목적을 대체로 반영하지만, '말해 드리려는 것입니다'를 첨가하여 원문에 없는 발화 행위를 도입합니다. 또한 לְעַמְּךָ의 영향을 받는 대상을 '당신의 백성에게'로 유지하되, '당신이 이해하도록'의 목적절 안에 자연스럽게 배치해야 합니다. וּבָאתִי는 현재 목적과 연결되는 완료 행위이므로 '내가 온 것은'이 적절합니다.
  naturalness: 초안의 '제가 와서 당신을 깨닫게 하려고 합니다. 곧 … 말해 드리려는 것입니다'는 문맥상 부자연스럽고, '깨닫게 하다'는 여기서 요구되는 이해시키다의 뜻보다 계시적 자각의 뉘앙스가 강합니다. '이해하도록 하다'가 자연스럽고 정확합니다. 또한 각주 표지는 해당 어구 바로 뒤에 놓아야 합니다.
  terminology: בְּאַחֲרִית הַיָּמִים는 본문에서 '후일에'로 옮기고 '마지막 날들에'를 대안으로 제시하여 예언적 미래성을 보존합니다. לַיָּמִים는 수량적 의미로 한정하지 않고 '앞으로 올 날들에 관한'으로 옮깁니다. '환상'은 적절합니다.
