    text: 또는 ‘진리의 문서에 쓰인 것.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 일들에서 나를 돕는 이.’ 히브리어 표현은 누군가와 함께 굳게 서는 것을 뜻할 수 있으며, ‘이 일들’은 적대 세력이나 논의 중인 사안을 가리킬 수 있습니다.
    reason: alternative_reading
  revision_rationale: The revision restores the explicit passive-recording sense of הָרָשׁוּם and the document sense of כְּתָב, corrects the malformed lexical footnote, and places the interpretive footnote where its scope is transparent. It retains the ambiguity of עַל־אֵלֶּה and does not add any later identification or doctrinal title for Michael.
