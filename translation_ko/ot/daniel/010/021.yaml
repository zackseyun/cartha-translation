revisions:
- from: 그러나 나는 진리의 기록에 있는 것을 당신에게 알려 드리겠습니다[a]. 그리고 이 일들에 맞서 저와 함께 굳게 서는 이는 아무도 없으며, 다만 당신들의 통치자 미가엘[b]뿐입니다.
  to: 그러나 나는 진리의 문서에 기록된 것을 당신에게 알려 드리겠습니다[a]. 이 일들에 맞서 나와 함께 굳게 서는 이는[b] 미가엘, 너희의 통치자 외에는 아무도 없습니다.
  rationale: The revision restores the explicit passive-recording sense of הָרָשׁוּם and the document sense of כְּתָב, corrects the malformed lexical footnote, and places the interpretive footnote where its scope is transparent. It retains the ambiguity of עַל־אֵלֶּה and does not add any later identification or doctrinal title for Michael.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:49:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative opening, the future disclosure, the exclusivity of Michael's support, and the unresolved reference of ‘these.’ However, ‘진리의 기록에 있는 것’ weakens the participial sense of something being recorded/written in a document, and the alternative in footnote a is not idiomatic Korean.
  naturalness: The main clause is generally natural in formal Korean. ‘진리의 문서에 기록된 것’ is clearer and more idiomatic than ‘진리의 기록에 있는 것.’ Moving the second footnote anchor to the expression it explains makes its scope clear.
  terminology: ‘통치자’ is a viable modern rendering of שַׂר and avoids importing ‘archangel.’ ‘너희의’ better reflects the plural possessive suffix than ‘당신들의,’ which can be pragmatically awkward in Korean direct address.
  issues:
  - severity: medium
    issue: The rendering of הָרָשׁוּם בִּכְתָב אֱמֶת is imprecise.
    rationale: ‘진리의 기록에 있는 것’ can mean merely ‘what is in the record,’ whereas the Hebrew specifies what is recorded/written in a writing or document. ‘진리의 문서에 기록된 것’ preserves both elements.
  - severity: medium
    issue: Footnote a contains an unidiomatic and incomplete alternative.
    rationale: ‘진리의 기록된 것’ is not a natural Korean noun phrase and does not properly express the alternative ‘what is written in the writing/document of truth.’
  - severity: low
    issue: The anchor of footnote b does not visibly identify the expression under discussion.
    rationale: The footnote concerns ‘standing firm with me’ and the referent of ‘these,’ so anchoring it after ‘굳게 서는 이는’ gives readers a clearer connection without altering meaning.
  revised_text: 그러나 나는 진리의 문서에 기록된 것을 당신에게 알려 드리겠습니다[a]. 이 일들에 맞서 나와 함께 굳게 서는 이는[b] 미가엘, 너희의 통치자 외에는 아무도 없습니다.
  revised_footnotes:
