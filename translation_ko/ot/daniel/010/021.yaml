id: DAN.10.21
reference: Daniel 10:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲבָל֙ אַגִּ֣יד לְ/ךָ֔ אֶת הָ/רָשׁ֥וּם בִּ/כְתָ֖ב אֱמֶ֑ת וְ/אֵ֨ין אֶחָ֜ד מִתְחַזֵּ֤ק עִמִּ/י֙ עַל אֵ֔לֶּה כִּ֥י אִם מִיכָאֵ֖ל שַׂרְ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/021.yaml
  text: But I will tell you what is recorded in the writing of truth[a]. And there is no one who stands firmly with me against these except Michael[b], your prince.
  footnotes:
  - marker: a
    text: Or 'what is written in the writing of truth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who supports me in these matters.' The Hebrew expression may denote standing strong alongside someone, and 'these' may refer either to hostile powers or to the matters under discussion.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 진리의 문서에 기록된 것을 당신에게 알려 드리겠습니다[a]. 이 일들에 맞서 나와 함께 굳게 서는 이는[b] 미가엘, 너희의 통치자 외에는 아무도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진리의 문서에 쓰인 것.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 일들에서 나를 돕는 이.’ 히브리어 표현은 누군가와 함께 굳게 서는 것을 뜻할 수 있으며, ‘이 일들’은 적대 세력이나 논의 중인 사안을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲבָל
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞절과 대비되는 전환을 자연스러운 현대 한국어 접속사로 옮겼습니다.
- source_word: הָרָשׁוּם בִּכְתָב אֱמֶת
  english_pob_choice: what is recorded in the writing of truth
  chosen_korean: 진리의 기록에 있는 것
  alternatives_korean:
  - 진리의 기록된 것
  - 진리의 문서에 기록된 것
  lexicon: HALOT
  rationale: רָשׁוּם은 ‘기록된’ 상태를, כְּתָב은 기록물/문서를 가리키므로 ‘진리의 기록’으로 간결하게 살렸습니다.
- source_word: מִתְחַזֵּק עִמִּי עַל אֵלֶּה
  english_pob_choice: stands firmly with me against these
  chosen_korean: 저와 함께 굳게 서는 이
  alternatives_korean:
  - 저와 함께 강하게 서는 이
  - 저와 함께 버티는 이
  - 저와 함께 맞서는 이
  lexicon: HALOT
  rationale: 히트파엘의 ‘강하게 서다/굳건히 서다’의 뉘앙스를 살리되, 한국어로는 ‘굳게 서다’가 가장 자연스럽습니다.
- source_word: מִיכָאֵל שַׂרְכֶם
  english_pob_choice: Michael, your prince
  chosen_korean: 당신들의 통치자 미가엘
  alternatives_korean:
  - 당신들의 군주 미가엘
  - 당신들의 왕자 미가엘
  - 너희의 통치자 미가엘
  lexicon: HALOT
  rationale: שַׂר는 맥락상 천상적/통치적 ‘방백’에 해당하므로 현대 한국어에서는 ‘통치자’로 옮겨 과도한 왕자 이미지를 피했습니다.
theological_decisions:
- issue: ‘these’의 지시 대상
  chosen_reading: ‘이 일들’로 옮겨, 대립 중인 세력인지 논의 중인 사안인지 단정하지 않았습니다.
  alternative_readings:
  - ‘이것들에 맞서’
  - ‘이 문제들에 대해’
  rationale: 히브리어의 עַל אֵלֶּה는 문맥상 적대 관계를 암시하지만, 지시 대상은 해석 여지가 있으므로 POB의 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 미가엘의 위상
  chosen_reading: 본문의 직함을 그대로 따라 ‘당신들의 통치자 미가엘’로 두어, 후대의 ‘천사장’ 해석을 본문에 미리 주입하지 않았습니다.
  alternative_readings:
  - 천사장 미가엘
  - 이스라엘의 상징적 대표
  rationale: 본문 자체는 שַׂרְכֶם만 말하므로, 본문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
