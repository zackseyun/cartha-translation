base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/005.yaml
  text: I lifted up my eyes and looked[a], and behold, a man clothed in linen, with his waist girded with the gold of Uphaz.
  footnotes:
  - marker: a
    text: Or 'with fine gold of Uphaz.' The Hebrew expression may emphasize the quality of the gold as well as its source.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 눈을 들어 보니, 보라, 아마포를 입고 허리에 우바스의 금을 띤[a] 한 사람이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘허리에 우바스의 고운 금을 띤’. 히브리어 표현은 금의 산지뿐 아니라 그 품질도 함께 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת עֵינַי
  english_pob_choice: I lifted up my eyes
  chosen_korean: 내가 눈을 들어 보니
  alternatives_korean:
  - 내가 눈을 들어 살펴보니
  - 내가 눈을 들어 보았더니
  lexicon: HALOT
  rationale: 히브리어 관용구인 '눈을 들다'를 살리면서, 이후의 환상 목격 흐름을 자연스럽게 한국어로 옮겼습니다.
- source_word: וָאֵרֶא
  english_pob_choice: and looked
  chosen_korean: 보니
  alternatives_korean:
  - 보고
  - 그리고 보았더니
  lexicon: HALOT
  rationale: 앞의 관용구와 중복을 피하면서, 시각적으로 대상을 확인하는 이어짐을 간결하게 표현했습니다.
- source_word: לָבוּשׁ בַּדִּים
  english_pob_choice: clothed in linen
  chosen_korean: 아마포를 입고 있었고
  alternatives_korean:
  - 삼베옷을 입고 있었고
  - 세마포 옷을 입고 있었고
  lexicon: HALOT
  rationale: בַּדִּים은 린넨/아마포를 가리키므로, 문맥을 과도하게 풀이하지 않고 직설적으로 옮겼습니다.
- source_word: בְּכֶתֶם אוּפָז
  english_pob_choice: with the gold of Uphaz
  chosen_korean: 우바스의 금을 띠고 있는
  alternatives_korean:
  - 우바스의 순금을 띠고 있는
  - 우바스의 고운 금을 띠고 있는
  lexicon: HALOT
  rationale: place name인 אוּפָז는 음역하고, כֶּתֶם의 고급 금속 이미지는 '금을 띠고 있는'으로 유지했습니다. 영어 POB의 'gold of Uphaz'에 맞춰 기본 본문은 직역 쪽을 택했습니다.
theological_decisions:
- issue: 환상 속 인물의 정체
  chosen_reading: 이 구절만으로는 천사, 메시아, 혹은 신현으로 단정하지 않고 단지 '한 사람'의 모습으로 묘사했습니다.
  alternative_readings:
  - 천사로 특정하기
  - 그리스도 전현현으로 해석하기
  rationale: 히브리어 본문은 외형과 옷차림만 제시하므로, 본문이 말하지 않는 정체를 번역문에서 미리 결정하지 않았습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존합니다.
