id: DAN.9.24
reference: Daniel 9:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁבֻעִ֨ים שִׁבְעִ֜ים נֶחְתַּ֥ךְ עַֽל עַמְּ/ךָ֣ וְ/עַל עִ֣יר קָדְשֶׁ֗/ךָ לְ/כַלֵּ֨א הַ/פֶּ֜שַׁע ו/ל/חתם חטאות וּ/לְ/כַפֵּ֣ר עָוֺ֔ן וּ/לְ/הָבִ֖יא צֶ֣דֶק עֹֽלָמִ֑ים וְ/לַ/חְתֹּם֙ חָז֣וֹן וְ/נָבִ֔יא וְ/לִ/מְשֹׁ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/024.yaml
  text: 'Seventy weeks are decreed concerning your people and your holy city: to finish the transgression[a], to seal up sins, to make atonement for iniquity, to bring in everlasting righteousness, to seal up vision and prophet[d][c][b], and to anoint the most holy place.'
  footnotes:
  - marker: a
    text: Hebrew 'seventy sevens'; many understand this as seventy weeks of years.
    reason: lexical_alternative
  - marker: b
    text: Or 'to put an end to sins.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew reads 'vision and prophet'; some ancient and modern interpreters understand this as 'vision and prophecy.'
    reason: alternative_reading
  - marker: d
    text: Or 'to anoint a most holy one'; the Hebrew phrase can refer to the holiest place or thing, and some interpret it personally.
    reason: alternative_reading
translation:
  language: ko
  text: 칠십 주가 네 백성과 네 거룩한 성을 위해 정해졌습니다. 곧 반역을 끝내고, 죄들을 봉인하며, 죄악을 속죄하고, 영원한 의를 가져오며, 환상과 예언을 봉인하고, 가장 거룩한 곳에 기름을 부으려는 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘칠십의 이곱 단위’입니다. 많은 이들은 이를 칠십 주의 해로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄들을 끝내려’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘환상과 예언자’라고 읽습니다. 일부 고대 및 현대 해석자들은 이를 ‘환상과 예언’으로 이해합니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘가장 거룩한 이를 기름 부으려’일 수 있습니다. 히브리어 구는 가장 거룩한 장소나 대상을 가리킬 수 있으며, 일부는 이를 인격적으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁבֻעִים שִׁבְעִים
  english_pob_choice: Seventy weeks
  chosen_korean: 칠십 주
  alternatives_korean:
  - 칠십 이레
  - 칠십 주간
  - 칠십 주의 기간
  lexicon: HALOT
  rationale: שָׁבֻעִים는 문자적으로 ‘주/일곱 단위’이므로, 본문은 해석을 덧붙이지 않은 간결한 표기를 유지했습니다. POB의 각주처럼 ‘주’가 주간인지 칠십의 이곱 단위인지의 여지는 각주로 보존할 수 있습니다.
- source_word: נֶחְתַּךְ
  english_pob_choice: are decreed
  chosen_korean: 정해졌습니다
  alternatives_korean:
  - 작정되었습니다
  - 결정되었습니다
  - 분정되었습니다
  lexicon: HALOT
  rationale: חתך의 수동형은 여기서 ‘정하여지다/결정되다’의 의미이므로, 현대 한국어에서 자연스럽고 명료한 ‘정해졌습니다’를 택했습니다. ‘자르다’의 직역은 문맥상 오해를 낳기 쉽습니다.
- source_word: לְכַלֵּא הַפֶּשַׁע
  english_pob_choice: to finish the transgression
  chosen_korean: 반역을 끝내고
  alternatives_korean:
  - 죄과를 끝내고
  - 범죄를 끝내고
  - 허물을 끝내고
  lexicon: HALOT
  rationale: הַפֶּשַׁע는 단순한 일반 죄보다 강한 ‘반역/배반’의 뉘앙스가 있어, 본문이 지닌 도덕적·언약적 긴장을 살리기 위해 ‘반역’으로 옮겼습니다. 완료의 목적을 살려 동사구로 처리했습니다.
- source_word: וְלַחְתֹּם חטאות
  english_pob_choice: to seal up sins
  chosen_korean: 죄들을 봉인하며
  alternatives_korean:
  - 죄들을 봉하여
  - 죄들을 마감하며
  - 죄들을 ختم하며
  lexicon: HALOT
  rationale: חתם의 기본 이미지는 ‘봉인하다’이므로, ‘봉인하며’로 직역성을 유지했습니다. 복수형 חטאות는 한국어에서도 복수성을 드러내기 위해 ‘죄들’로 옮겼습니다.
- source_word: וּלְכַפֵּר עָוֺן
  english_pob_choice: to make atonement for iniquity
  chosen_korean: 죄악을 속죄하고
  alternatives_korean:
  - 죄악을 속하게 하고
  - 불의를 속죄하고
  - 악을 속죄하고
  lexicon: HALOT
  rationale: כפר는 제의적·신학적 용어이므로, 한국어 교회어의 익숙함을 따르되 본문의 속죄 의미를 보존하는 ‘속죄하다’를 사용했습니다. עָוֺן은 단순한 죄보다 무게 있는 ‘죄악’으로 옮겨 대응시켰습니다.
- source_word: וְלַחְתֹּם חָזוֹן וְנָבִיא
  english_pob_choice: to seal up vision and prophet
  chosen_korean: 환상과 예언을 봉인하고
  alternatives_korean:
  - 환상과 예언자를 봉인하고
  - 환상과 선지자를 봉인하고
  - 환상과 예언을 마감하고
  lexicon: HALOT
  rationale: 여기서의 נָבִיא는 문자적으로 ‘예언자/선지자’이지만, 한국어에서는 본문의 병렬성을 살리기 위해 추상적 표현인 ‘예언’으로 옮기는 편이 자연스럽습니다. 다만 이는 원문이 가진 ‘환상과 예언자’의 문법적 긴장을 완전히 지우지 않기 위한 해석적 선택입니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: the most holy place
  chosen_korean: 가장 거룩한 곳
  alternatives_korean:
  - 지극히 거룩한 곳
  - 지성소
  - 가장 거룩한 것
  lexicon: HALOT
  rationale: 이 표현은 성소 공간을 가리킬 수도, 지극히 거룩한 대상일 수도 있으므로, 개인 해석을 앞세우지 않는 중립적 공간 표현을 택했습니다. ‘지성소’는 교회 용어로 익숙하지만, 원문의 범위를 조금 더 열어 두기 위해 ‘가장 거룩한 곳’으로 옮겼습니다.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים의 지시 대상
  chosen_reading: 가장 거룩한 곳
  alternative_readings:
  - 한 가장 거룩한 사람
  - 지성소
  - 가장 거룩한 것
  rationale: 본문은 사람 해석을 명시하지 않으므로, 메시아적 인물로 미리 확정하지 않고 공간/대상으로 읽을 수 있는 표현을 유지했습니다. 이는 원문이 허용하는 긴장을 보존하려는 POB 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: theological tension is preserved rather than resolved.'
- issue: שָׁבֻעִים의 의미 범위
  chosen_reading: 칠십 주
  alternative_readings:
  - 칠십 이레
  - 칠십 주간
  - 칠십 년주
  rationale: 단위가 본문에 직접 ‘년’으로 표기되지 않으므로, 본문에는 가장 직접적인 표기를 두고 해석적 설명은 각주로 넘겼습니다. 이렇게 해야 독자가 원문과 전통적 해석 가능성을 함께 볼 수 있습니다.
  doctrine_reference: 'Translation philosophy §1 and §3: original-language primacy; preserve ambiguity where genuine.'
