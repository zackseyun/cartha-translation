id: DAN.9.11
reference: Daniel 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל עָֽבְרוּ֙ אֶת תּ֣וֹרָתֶ֔/ךָ וְ/ס֕וֹר לְ/בִלְתִּ֖י שְׁמ֣וֹעַ בְּ/קֹלֶ֑/ךָ וַ/תִּתַּ֨ךְ עָלֵ֜י/נוּ הָ/אָלָ֣ה וְ/הַ/שְּׁבֻעָ֗ה אֲשֶׁ֤ר כְּתוּבָה֙ בְּ/תוֹרַת֙ מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֔ים כִּ֥י חָטָ֖אנוּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/011.yaml
  text: All Israel has transgressed your law and turned aside[a], not listening to your voice. So the curse and the oath that are written in the law of Moses, the servant of God, have been poured out on us, because we have sinned against him.
  footnotes:
  - marker: a
    text: Or 'the sworn curse.' The Hebrew reads 'the curse and the oath,' likely referring to the covenant sanctions sworn in the law of Moses.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘이 주의 율법을 범하고 주의 음성을 듣지 않으려고 돌아섰습니다[a]. 그러므로 모세—하나님의 종—의 율법에 기록된 저주와 맹세가 우리에게 쏟아졌습니다. 이는 우리가 그분께 죄를 지었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맹세된 저주’. 히브리어는 ‘저주와 맹세’라고 되어 있으며, 아마도 모세의 율법에 맹세된 언약 제재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: All Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 이스라엘 전체가
  - 모든 이스라엘이
  lexicon: HALOT
  rationale: ישראל을 공동체 전체로 묶는 표현이므로, ‘온 이스라엘’이 집단적 범위를 자연스럽게 살립니다.
- source_word: עָבְרוּ אֶת תּוֹרָתֶךָ
  english_pob_choice: has transgressed your law
  chosen_korean: 주의 율법을 범하고
  alternatives_korean:
  - 주의 율법을 어기고
  - 주의 율법을 넘어서
  lexicon: HALOT
  rationale: עבר + תורה는 언약적 맥락에서 ‘범하다/어기다’의 뜻이므로, ‘범하다’로 죄책의 뉘앙스를 직접 살렸습니다.
- source_word: וְסוֹר לְבִלְתִּי שְׁמֹעַ בְּקוֹלֶךָ
  english_pob_choice: turned aside, refusing to listen to your voice
  chosen_korean: 주의 음성을 듣지 않으려고 돌아섰습니다
  alternatives_korean:
  - 주의 음성을 듣지 않도록 돌아섰습니다
  - 주의 음성을 거부하며 돌아섰습니다
  lexicon: HALOT
  rationale: סור의 ‘돌이키다/돌아서다’와 부정 목적의 ‘듣지 않으려’는 관계를 함께 살려, 단순한 비청취가 아니라 의도적 이탈을 드러냈습니다.
- source_word: וַתִּתַּךְ עָלֵינוּ
  english_pob_choice: have been poured out on us
  chosen_korean: 우리에게 쏟아졌습니다
  alternatives_korean:
  - 우리 위에 부어졌습니다
  - 우리에게 쏟아져 내렸습니다
  lexicon: HALOT
  rationale: נתך의 ‘붓다/쏟아지다’ 이미지를 유지하면서, 심판이 임한 효과를 한국어로 자연스럽게 표현했습니다.
- source_word: הָאָלָה וְהַשְּׁבֻעָה
  english_pob_choice: the curse and the oath
  chosen_korean: 저주와 맹세
  alternatives_korean:
  - 저주와 서원
  - 저주와 맹세한 저주
  lexicon: HALOT
  rationale: POB의 ‘curse and the oath’를 그대로 두어 두 항을 지웠고, שְׁבוּעָה는 여기서 언약 제재와 연결되는 ‘맹세’로 옮겼습니다.
- source_word: עֶבֶד הָאֱלֹהִים
  english_pob_choice: the servant of God
  chosen_korean: 하나님의 종
  alternatives_korean:
  - 하나님의 종 된 자
  - 하나님의 종인
  lexicon: HALOT
  rationale: 모세에 대한 호칭으로서의 명칭을 살려, 한국어 성서어법에 익숙하면서도 직접적인 ‘하나님의 종’으로 옮겼습니다.
theological_decisions:
- issue: 공동체적 죄책과 1인칭 복수 고백의 병치
  chosen_reading: 앞부분은 이스라엘 공동체 전체를 가리키는 진술로, 뒷부분은 다니엘 자신을 포함한 ‘우리’ 고백으로 살렸습니다.
  alternative_readings:
  - 전 구절을 일관되게 복수로 옮김
  - 전 구절을 다니엘 개인의 고백처럼 축소함
  rationale: 히브리어는 이스라엘 전체의 죄를 말하면서 화자를 그 공동체 안에 포함시킵니다. 한국어도 그 신학적 연대성을 유지해야 합니다.
  doctrine_reference: Translation philosophy §5
- issue: ‘율법’과 언약 제재 표현
  chosen_reading: תּוֹרָה는 ‘율법’으로, ‘저주와 맹세’는 언약에 따른 제재를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - תּוֹרָה를 ‘가르침’으로 완화함
  - ‘저주와 맹세’를 ‘저주받은 맹세’로 합침
  rationale: 이 문맥의 תורה는 단순한 교훈이 아니라 모세 언약의 규정이므로 ‘율법’이 적절하며, 두 항을 합치지 않아 본문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
