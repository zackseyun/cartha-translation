- from: 온 이스라엘이 주의 율법을 범하고 주의 음성을 듣지 않으려고 돌아섰습니다[a]. 그러므로 모세—하나님의 종—의 율법에 기록된 저주와 맹세가 우리에게 쏟아졌습니다. 이는 우리가 그분께 죄를 지었기 때문입니다.
  to: 온 이스라엘이 주의 율법을 범하고 주의 음성을 듣지 않으려고 돌아섰습니다. 그러므로 하나님의 종 모세의 율법에 기록된 저주와 맹세[a]가 우리에게 쏟아졌습니다. 이는 우리가 그분께 죄를 지었기 때문입니다.
