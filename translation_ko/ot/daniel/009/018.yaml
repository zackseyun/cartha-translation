id: DAN.9.18
reference: Daniel 9:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַטֵּ֨ה אֱלֹהַ֥/י אָזְנְ/ךָ֮ וּֽ/שֲׁמָע֒ פקח/ה עֵינֶ֗י/ךָ וּ/רְאֵה֙ שֹֽׁמְמֹתֵ֔י/נוּ וְ/הָ/עִ֕יר אֲשֶׁר נִקְרָ֥א שִׁמְ/ךָ֖ עָלֶ֑י/הָ כִּ֣י לֹ֣א עַל צִדְקֹתֵ֗י/נוּ אֲנַ֨חְנוּ מַפִּילִ֤ים תַּחֲנוּנֵ֨י/נוּ֙ לְ/פָנֶ֔י/ךָ כִּ֖י עַל רַחֲמֶ֥י/ךָ הָ/רַבִּֽים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/018.yaml
  text: Incline your ear[a], my God, and hear; open your eyes and see our desolations and the city that is called by your name. For we are not presenting our pleas before you because of our righteousnesses[b], but because of your abundant mercies.
  footnotes:
  - marker: a
    text: Literally, 'our righteousnesses,' likely referring to righteous acts or claims of righteousness.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''the city over which your name is called.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 주 하나님, 당신의 귀를 기울이시고 들으소서. 당신의 눈을 여시고 우리의 황폐함과 당신의 이름으로 불리는 그 성읍을 보소서. 우리가 우리의 의들 때문에 당신 앞에 우리의 간구를 드리는 것이 아니라, 당신의 많은 긍휼 때문에 드리는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 관용구: ‘이름이 그 위에 불리다.’'
    reason: source_note
  - marker: b
    text: 복수형으로, ‘의로운 행위들’ 또는 ‘의의 주장들’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה אֱלֹהַי אָזְנְךָ וּשֲׁמָע
  english_pob_choice: Incline your ear, my God, and hear
  chosen_korean: 주 하나님, 당신의 귀를 기울이시고 들으소서
  alternatives_korean:
  - 귀를 기울이소서, 나의 하나님
  - 귀를 내리시고 들으소서
  lexicon: HALOT
  rationale: 히브리어의 관용적 청유문을 살려 ‘귀를 기울이다/들으소서’로 옮기되, 직접 호칭을 자연스럽게 살리기 위해 ‘주 하나님’을 앞에 두었습니다.
- source_word: פְּקַח עֵינֶיךָ וּרְאֵה
  english_pob_choice: open your eyes and see
  chosen_korean: 당신의 눈을 여시고
  alternatives_korean:
  - 눈을 뜨시고
  - 눈을 여시며 보소서
  lexicon: HALOT
  rationale: ‘눈을 여시고’는 מקור 텍스트의 ‘눈을 열다’ 관용을 직접 반영하며, 다음 절의 ‘보소서’와 결합해 병렬성을 유지합니다.
- source_word: שֹׁמְמֹתֵינוּ
  english_pob_choice: our desolations
  chosen_korean: 우리의 황폐함
  alternatives_korean:
  - 우리의 황폐한 상태
  - 우리의 황폐한 것들
  lexicon: HALOT
  rationale: 복수형 명사지만 한국어에서는 자연스럽게 상태를 가리키는 ‘황폐함’이 가장 적합하며, 개인 감정이 아니라 공동체의 처참한 상태를 드러냅니다.
- source_word: וְהָעִיר אֲשֶׁר נִקְרָא שִׁמְךָ עָלֶיהָ
  english_pob_choice: and the city that is called by your name
  chosen_korean: 당신의 이름으로 불리는 그 성읍
  alternatives_korean:
  - 당신의 이름이 불리는 성읍
  - 당신의 이름이 그 위에 불리는 그 성읍
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘이름이 그 위에 불리다’를 한국어 자연어로 풀어 ‘당신의 이름으로 불리는’으로 옮겨, 소유·언약적 속성을 보존했습니다.
- source_word: תַּחֲנוּנֵינוּ לְפָנֶיךָ
  english_pob_choice: our pleas before you
  chosen_korean: 우리의 간구를 드리는
  alternatives_korean:
  - 우리의 간청을 올리는
  - 우리의 탄원을 바치는
  lexicon: HALOT
  rationale: ‘간구’는 간절한 호소의 의미를 살리면서 예배적·기도적 맥락에 자연스럽고, ‘드리는’은 לפני의 ‘앞에 내놓다’라는 관용을 현대 한국어로 전달합니다.
- source_word: עַל רַחֲמֶיךָ הָרַבִּים
  english_pob_choice: because of your abundant mercies
  chosen_korean: 당신의 많은 긍휼 때문에
  alternatives_korean:
  - 당신의 풍성한 긍휼 때문에
  - 당신의 abundant mercies 때문에
  lexicon: HALOT
  rationale: רַחֲמִים의 다중성/풍성함을 ‘많은 긍휼’로 옮겨 수량적 뉘앙스를 살렸고, 교회적 상투어보다 본문 자체의 강조를 우선했습니다.
theological_decisions:
- issue: 하나님께 대한 인체 비유적 표현(귀, 눈)의 처리
  chosen_reading: 직역에 가까운 요청형으로 유지했습니다.
  alternative_readings:
  - ‘주의를 기울이소서’, ‘살피소서’ 같은 해석적 완화
  rationale: 본문은 하나님의 주의를 간구하는 구체적 수사이므로, 신체화된 비유를 삭제하지 않고 유지하는 것이 회개의 기도문 구조를 더 잘 드러냅니다.
  doctrine_reference: '번역 원칙: 본문의 평이한 의미를 보존하고, 본문이 허락하는 것 이상으로 완화하지 않음.'
- issue: ‘우리의 의들’의 복수성
  chosen_reading: ‘우리의 의들’로 복수성을 드러냈습니다.
  alternative_readings:
  - ‘우리의 의로움’
  - ‘우리의 의로운 행위들’
  rationale: 히브리어 복수형이 단순한 도덕성보다 여러 ‘의로운 행위/주장’을 가리킬 수 있으므로, 단수화하여 평준화하지 않고 긴장감을 유지했습니다.
  doctrine_reference: 본문이 대조하는 인간 공로와 하나님의 긍휼의 대조를 흐리지 않음.
