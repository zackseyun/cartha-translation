id: DAN.9.20
reference: Daniel 9:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ע֨וֹד אֲנִ֤י מְדַבֵּר֙ וּ/מִתְפַּלֵּ֔ל וּ/מִתְוַדֶּה֙ חַטָּאתִ֔/י וְ/חַטַּ֖את עַמִּ֣/י יִשְׂרָאֵ֑ל וּ/מַפִּ֣יל תְּחִנָּתִ֗/י לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהַ֔/י עַ֖ל הַר קֹ֥דֶשׁ אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
  footnotes:
  - marker: a
    text: Or 'my supplication' or 'my petition.' The Hebrew idiom is literally 'causing my plea to fall before' the LORD.
    reason: lexical_alternative
  - marker: b
    text: The 'holy mountain of my God' refers to Zion/Jerusalem, the site of God's sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 내가 아직 말하고 기도하며, 내 죄와 내 백성 이스라엘의 죄를 고백하고 있었을 때, 내 하나님이신 야훼 앞에서 내 간구를 쏟아 올리고 있었습니다. 이는 내 하나님의 거룩한 산을 두고 한 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘내 간구를 떨어뜨리다/내려놓다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 하나님의 거룩한 산’은 시온/예루살렘, 곧 하나님의 성소가 있는 곳을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר וּמִתְפַּלֵּל
  english_pob_choice: While I was still speaking and praying
  chosen_korean: 내가 아직 말하고 기도하며
  alternatives_korean:
  - 내가 아직 말하면서 기도하고
  - 내가 아직 말하고 기도하는 중에
  lexicon: WLC; HALOT
  rationale: 진행 중인 동작의 시간적 배경을 자연스럽게 살리면서, 히브리어의 연속 분사적 흐름을 유지했습니다.
- source_word: וּמִתְוַדֶּה חַטָּאתִי וְחַטַּאת עַמִּי יִשְׂרָאֵל
  english_pob_choice: confessing my sin and the sin of my people Israel
  chosen_korean: 내 죄와 내 백성 이스라엘의 죄를 고백하고 있었을 때
  alternatives_korean:
  - 내 죄와 내 백성 이스라엘의 죄를 자복하고 있었을 때
  - 내 죄와 내 백성 이스라엘의 죄를 인정하고 있었을 때
  lexicon: WLC; HALOT
  rationale: תודֶה는 죄를 대상으로 하므로 ‘고백하다’가 가장 직접적이며, ‘자복하다’도 가능하지만 현대 합쇼체에서 더 보편적이고 분명합니다.
- source_word: וּמַפִּיל תְּחִנָּתִי לִפְנֵי יְהוָה
  english_pob_choice: presenting my plea before Yahweh
  chosen_korean: 내 하나님이신 야훼 앞에서 내 간구를 쏟아 올리고 있었습니다
  alternatives_korean:
  - 내 하나님이신 야훼 앞에 내 간구를 드리고 있었습니다
  - 내 하나님이신 야훼 앞에서 내 간구를 올리고 있었습니다
  lexicon: WLC; HALOT
  rationale: 직역하면 ‘떨어뜨리다/내려놓다’의 관용구이므로, 단순한 ‘드리다’보다 청원 행위를 생생하게 살리는 ‘쏟아 올리다’를 택했습니다.
- source_word: עַל הַר קֹדֶשׁ אֱלֹהָי
  english_pob_choice: concerning the holy mountain of my God
  chosen_korean: 이는 내 하나님의 거룩한 산을 두고 한 것이었습니다
  alternatives_korean:
  - 내 하나님의 거룩한 산에 관하여 한 것이었습니다
  - 내 하나님의 거룩한 산을 위하여 한 것이었습니다
  lexicon: WLC; HALOT
  rationale: עַל은 여기서 주제/대상을 나타내므로 ‘두고’가 구어적이면서도 ‘관하여’보다 기도문의 청원 초점을 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC; project default
  rationale: 프로젝트 기본 원칙에 따라 여호와가 아니라 학술적 음역인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 신적 이름 יְהוָה의 한국어 처리
  chosen_reading: ‘야훼’로 직역해 언약적 신명성을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 완화 번역
  - ‘여호와’로 전통 교회 번역
  rationale: 본문은 신명사 יְהוָה를 직접 사용하므로, 가려진 칭호보다 고유한 언약 이름을 드러내는 번역이 원문 효과에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
