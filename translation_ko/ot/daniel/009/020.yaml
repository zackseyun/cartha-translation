source:
  edition: WLC
  text: וְ/ע֨וֹד אֲנִ֤י מְדַבֵּר֙ וּ/מִתְפַּלֵּ֔ל וּ/מִתְוַדֶּה֙ חַטָּאתִ֔/י וְ/חַטַּ֖את עַמִּ֣/י יִשְׂרָאֵ֑ל וּ/מַפִּ֣יל תְּחִנָּתִ֗/י לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהַ֔/י עַ֖ל הַר קֹ֥דֶשׁ אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
  footnotes:
  - marker: a
    text: Or 'my supplication' or 'my petition.' The Hebrew idiom is literally 'causing my plea to fall before' the LORD.
    reason: lexical_alternative
  - marker: b
    text: The 'holy mountain of my God' refers to Zion/Jerusalem, the site of God's sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 내가 아직 말하고 기도하며, 내 죄와 내 백성 이스라엘의 죄를 고백하고, 내 하나님의 거룩한 산[b]에 관하여 내 하나님 야훼 앞에 내 간구[a]를 드리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘내 간구를 야훼 앞에 떨어뜨리다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 하나님의 거룩한 산’은 하나님의 성소가 있던 시온, 곧 예루살렘을 가리킵니다.
    reason: cultural_note
