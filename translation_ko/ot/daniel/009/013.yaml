id: DAN.9.13
reference: Daniel 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר כָּתוּב֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/זֹּ֖את בָּ֣אָה עָלֵ֑י/נוּ וְ/לֹֽא חִלִּ֜ינוּ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֵ֗י/נוּ לָ/שׁוּב֙ מֵֽ/עֲוֺנֵ֔/נוּ וּ/לְ/הַשְׂכִּ֖יל בַּ/אֲמִתֶּֽ/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/013.yaml
  text: Just as it is written in the Law of Moses[a], all this calamity has come upon us[c][b], yet we have not sought the favor of Yahweh our God by turning from our iniquities and by gaining insight into your truth.
  footnotes:
  - marker: a
    text: Or 'all this disaster' or 'all this evil.' The Hebrew term can denote calamity or disaster in contexts of judgment.
    reason: lexical_alternative
  - marker: b
    text: Literally 'we have not entreated the face of the LORD our God.' The expression means to seek his favor or mercy.
    reason: lexical_alternative
  - marker: c
    text: Or 'in your truth' or 'by your truth.' The Hebrew can also carry the sense of 'your faithfulness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세의 율법에 기록된 그대로, 이 모든 재앙이 우리에게 임하였는데도 우리는 우리의 불법에서 돌아서고 당신의 진리 안에서 깨닫기 위하여 우리 하나님 야훼의 얼굴을 구하지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 재난’ 또는 ‘이 모든 악’. 히브리어는 심판 문맥에서 재앙이나 재난의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리 하나님 야훼의 얼굴을 간구하지 않았다’입니다. 이 표현은 그의 호의나 긍휼을 구한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 진리 안에서’ 또는 ‘당신의 진리로’. 히브리어는 ‘당신의 신실하심’의 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר כָּתוּב
  english_pob_choice: Just as it is written
  chosen_korean: 기록된 그대로
  alternatives_korean:
  - 기록된 대로
  - 기록된 바와 같이
  lexicon: HALOT
  rationale: 기록된 말씀과 현실의 대응을 자연스럽게 살리면서, 비교의 뉘앙스를 한국어로 간결하게 전달합니다.
- source_word: בְּתוֹרַת מֹשֶׁה
  english_pob_choice: in the Law of Moses
  chosen_korean: 모세의 율법에
  alternatives_korean:
  - 모세의 가르침에
  - 모세의 율법 속에
  lexicon: HALOT
  rationale: 이 문맥의 תּוֹרָה는 일반적 ‘가르침’보다 모세오경적 율법 전승을 가리키므로, POB의 법-언어를 따라 ‘율법’으로 옮겼습니다.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  english_pob_choice: all this calamity
  chosen_korean: 이 모든 재앙
  alternatives_korean:
  - 이 모든 악
  - 이 모든 재난
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 심판으로 닥친 재난이므로, 신학적 오해를 피하는 ‘재앙’이 가장 적절합니다.
- source_word: וְלֹא חִלִּינוּ אֶת פְּנֵי
  english_pob_choice: yet we have not sought the favor of
  chosen_korean: 우리는 ... 얼굴을 구하지 않았습니다
  alternatives_korean:
  - 우리는 ... 은혜를 구하지 않았습니다
  - 우리는 ... 은총을 간구하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘얼굴을 구하다’의 관계적·청원적 의미를 살리기 위해 직역을 유지했습니다. 한국어에서는 ‘얼굴을 구하다’가 낯설 수 있으나, 본문 특유의 관용성을 보존하는 것이 중요합니다.
- source_word: בַּאֲמִתֶּךָ
  english_pob_choice: into your truth
  chosen_korean: 당신의 진리 안에서 깨닫기 위하여
  alternatives_korean:
  - 당신의 진리로
  - 당신의 진리 안으로
  lexicon: HALOT
  rationale: אֱמֶת는 ‘진리’와 ‘신실함/신뢰성’을 모두 가질 수 있으나, 여기서는 회개와 분별의 결합 속에서 ‘당신의 진리’가 가장 자연스럽습니다. ‘깨닫기 위하여’는 하필의 הִשְׂכִּיל의 이해·분별의 뜻을 반영합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유한 언약 이름을 보존하는 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘얼굴을 구하다’ 관용구의 신학적 기능
  chosen_reading: 하나님의 은혜와 호의를 구하는 청원으로 이해
  alternative_readings:
  - 단순한 면담 요청
  - 형식적 예배 행위
  rationale: 이 표현은 단순히 시선을 찾는 뜻이 아니라, 심판 아래서 하나님의 긍휼과 용서를 간구하는 회개적 청원을 뜻합니다. 따라서 문맥상 ‘호의/은혜를 구함’으로 이해해야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve covenantal repentance language'
