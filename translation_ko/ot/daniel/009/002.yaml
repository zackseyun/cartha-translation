  naturalness: ‘그 햇수’를 사용하여 자연스럽고도 격식 있는 합쇼체 문장으로 다듬었습니다. ‘예루살렘의 황폐가 다하기까지’는 לְמַלֹּאות לְחָרְבוֹת의 완료·기간적 의미를 한국어에서 자연스럽게 나타내며, 누가 무엇을 성취하는지 불필요하게 특정하지 않습니다.
