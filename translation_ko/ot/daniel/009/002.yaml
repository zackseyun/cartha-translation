  text: בִּ/שְׁנַ֤ת אַחַת֙ לְ/מָלְכ֔/וֹ אֲנִי֙ דָּֽנִיֵּ֔אל בִּינֹ֖תִי בַּ/סְּפָרִ֑ים מִסְפַּ֣ר הַ/שָּׁנִ֗ים אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶל יִרְמִיָ֣ה הַ/נָּבִ֔יא לְ/מַלֹּ֛אות לְ/חָרְב֥וֹת יְרוּשָׁלִַ֖ם שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/002.yaml
  text: 'In the first year of his reign[a], I, Daniel, understood from the books the number of the years about which the word of Yahweh had come to Jeremiah the prophet, for the completion of the desolations of Jerusalem: seventy years.'
  footnotes:
  - marker: a
    text: Or 'from the scrolls.' The Hebrew term can refer broadly to written documents; 'books' is used in the main text for natural English, while 'scrolls' preserves the ancient medium more explicitly.
    reason: cultural_note
translation:
  language: ko
  text: 그의 통치 첫해에[a] 나 다니엘은 책들에서 예루살렘의 황폐가 끝나는 일흔 해에 관하여 여호와의 말씀이 예언자 예레미야에게 임한 연수의 수를 깨달았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치 첫해에’. 히브리어 표현은 통치 기간의 시작을 가리키는 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/שְׁנַ֤ת אַחַת֙ לְ/מָלְכ֔/וֹ
  english_pob_choice: In the first year of his reign
  chosen_korean: 그의 통치 첫해에
  alternatives_korean:
  - 그의 왕위 첫 해에
  - 그가 왕이 된 첫해에
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 수사 ‘한 해’가 아니라 통치 기간의 시작을 가리키므로, 한국어에서도 자연스럽게 ‘첫해’로 옮겼습니다.
- source_word: בִּינֹתִי בַּ/סְּפָרִים
  english_pob_choice: understood from the books
  chosen_korean: 책들에서 … 깨달았습니다
  alternatives_korean:
  - 두루마리들에서 … 이해했습니다
  - 기록들에서 … 알게 되었습니다
  lexicon: HALOT
  rationale: בַּסְּפָרִים는 넓게는 문서·두루마리를 가리킬 수 있지만, 본문 의미는 다니엘이 기록된 자료를 통해 깨달았다는 점이므로 ‘책들에서’로 두고, 인지 동사를 ‘깨달았습니다’로 옮겼습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 여호와의 말씀
  alternatives_korean:
  - 야훼의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 이 자료의 영어 POB는 יְהוָה를 ‘Yahweh’로 번역하지만, 한국어 교정 전통상 본문 독해의 즉시성과 식별성을 위해 ‘여호와의 말씀’으로 옮겼습니다.
- source_word: לְ/מַלֹּאות
  english_pob_choice: for the completion of
  chosen_korean: 끝나는
  alternatives_korean:
  - 완성되는
  - 이루어지는
  lexicon: HALOT
  rationale: 동사의 목적·결과를 한국어에서 가장 간결하게 드러내기 위해 ‘끝나는’으로 풀어, 예루살렘의 황폐 기간이 종결에 이르는 시점을 나타냈습니다.
- source_word: לְ/חָרְב֥וֹת יְרוּשָׁלִַ֖ם
  english_pob_choice: the desolations of Jerusalem
  chosen_korean: 예루살렘의 황폐
  alternatives_korean:
  - 예루살렘의 황폐함
  - 예루살렘의 황무함
  lexicon: HALOT
  rationale: 히브리어 복수형은 재난의 상태를 강조하므로 단순한 ‘폐허’보다 포괄적인 ‘황폐’가 더 적절합니다.
theological_decisions:
- issue: 이름 ארבע/יהוה의 한국어 처리
  chosen_reading: 본문에는 전통적 한국어 성경 관용에 따라 ‘여호와’로 옮기고, 영어 POB의 야훼 표기는 본문 밖 주석 체계에서 추적할 수 있게 둡니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 예레미야에게 임한 계시를 인용하는 맥락이므로, 한국어 본문에서는 독자가 즉시 पहचान하는 신명 표기를 유지하는 편이 정보 전달에 유리합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
