base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/022.yaml
  text: He made me understand[a], and spoke with me, and said, “Daniel[b], I have now come out to give you insight and understanding.”
  footnotes:
  - marker: a
    text: Or, more formally, 'He made me understand.' The Hebrew verb can be read causatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have gone out' or 'I have come forth.' The Hebrew verb is literally 'gone out/came out,' here referring to the speaker's being sent forth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나를 깨닫게 하고[a] 나와 말하며 이렇게 말했습니다. “다니엘아, 나는 이제 너에게 통찰과 이해를 주려고 나왔다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나에게 이해를 주고.” 히브리어 동사는 문맥상 ‘깨닫게 하다’라는 사역적 의미로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나갔다” 또는 “나아왔다.” 히브리어는 문자적으로 ‘나가다/나오다’이며, 여기서는 말하는 이가 파견되어 나온 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  english_pob_choice: He made me understand
  chosen_korean: 그가 나에게 깨닫게 하시고
  alternatives_korean:
  - 그가 나를 이해하게 하시고
  - 그가 나에게 이해를 주시고
  lexicon: HALOT
  rationale: 히필 계열의 사역적 의미를 살려, 다니엘이 스스로 이해했다기보다 이해하도록 하신 뉘앙스를 반영했습니다.
- source_word: וַיְדַבֵּר עִמִּי
  english_pob_choice: and spoke with me
  chosen_korean: 내게 말씀하시며
  alternatives_korean:
  - 나와 말씀하시며
  - 나에게 말씀하시며
  lexicon: HALOT
  rationale: עִם의 ‘~와 함께’ 성격을 완전히 직역하기보다, 한국어 성경 문맥에서 자연스러운 ‘내게 말씀하시며’로 옮기되 직접성을 유지했습니다.
- source_word: עַתָּה יָצָאתִי
  english_pob_choice: I have now come out
  chosen_korean: 내가 이제 ... 나왔다
  alternatives_korean:
  - 내가 이제 ... 나아왔다
  - 내가 이제 ... 나와 있다
  lexicon: HALOT
  rationale: יָצָאתִי의 문자적 ‘나오다/나가다’ 이미지를 살리면서, 천상의 사자가 파견되어 온 상황에 맞게 한국어에서는 ‘나왔다’로 간결하게 표현했습니다.
- source_word: לְהַשְׂכִּילְךָ בִינָה
  english_pob_choice: to give you insight and understanding
  chosen_korean: 너에게 통찰과 이해를 주려고
  alternatives_korean:
  - 너를 깨닫게 하려고
  - 너에게 지혜와 이해를 주려고
  lexicon: HALOT
  rationale: הַשְׂכִּיל은 ‘깨닫게 하다/통찰을 주다’의 사역적 의미를 갖고, בִינָה는 ‘이해/분별’이므로 두 명사를 병렬로 살렸습니다.
theological_decisions:
- issue: 천사의 파견 표현
  chosen_reading: ‘내가 이제 너에게 통찰과 이해를 주려고 나왔다’로 옮겨, 말하는 주체가 하나님의 명령 아래 파견된 사자라는 점을 드러냈습니다.
  alternative_readings:
  - ‘나는 이제 너에게 통찰과 이해를 주기 위해 나왔다’
  - ‘나는 이제 나가서 너에게 깨달음을 주겠다’
  rationale: 본문의 ‘나왔다’는 단순 이동이 아니라 사명 수행을 위한 파견을 암시하므로, 문맥의 기능을 보존하는 방향을 택했습니다.
  doctrine_reference: 단 9:20-23 문맥
