  to: 그는 나를 깨닫게 하고[a] 나와 말하며 이렇게 말했습니다. “다니엘아, 나는 이제 너에게 통찰과 이해를 주려고 나왔다[b].”
  rationale: 목적격을 바로잡고, 원문의 ‘나와 말하다’를 보존했으며, 본문이 명시하지 않은 높임을 제거했습니다. ‘나왔다’에는 파견이라는 해석을 본문에 삽입하지 않고 각주에서 제한적으로 설명했습니다. 각주 표지도 해당 어휘에 배치했습니다.
