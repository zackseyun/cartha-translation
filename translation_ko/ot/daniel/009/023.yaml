  doctrine_reference: 하나님의 은총과 선택의 언어를 문맥상 보존
- issue: 직접 화법의 존대 수준
  chosen_reading: 천사의 보고는 합쇼체로, 다니엘을 직접 부르는 부분은 반말형 ‘너는’으로 두었습니다.
  alternative_readings:
  - 전체를 합쇼체로 통일
