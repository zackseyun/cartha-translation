source:
  edition: WLC
  text: בִּ/תְחִלַּ֨ת תַּחֲנוּנֶ֜י/ךָ יָצָ֣א דָבָ֗ר וַ/אֲנִי֙ בָּ֣אתִי לְ/הַגִּ֔יד כִּ֥י חֲמוּד֖וֹת אָ֑תָּה וּ/בִין֙ בַּ/דָּבָ֔ר וְ/הָבֵ֖ן בַּ/מַּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/023.yaml
  text: At the beginning of your pleas[a], a word went out, and I have come to tell it, because you are greatly beloved[b]. So consider the word and understand the vision.
  footnotes:
  - marker: a
    text: Or 'a message went out.' Hebrew 'a word went out' can refer to a spoken message or an issued command.
    reason: lexical_alternative
  - marker: b
    text: Or 'you are highly esteemed.' The Hebrew expression conveys that Daniel is especially precious or beloved.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 간구의 시작부터 말씀이 나갔으므로 내가 그것을 전하러 왔습니다. 너는 크게 사랑받는 자이니, 그러므로 그 말씀을 살피고 그 환상을 깨달으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메시지가 나갔습니다.’ 히브리어 ‘말씀이 나갔다’는 말한 내용이나 내려진 명령을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너는 크게 귀히 여김을 받는 자이다.’ 이 히브리어 표현은 다니엘이 특별히 소중히 여겨지고 사랑받는다는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת תַּחֲנוּנֶיךָ
  english_pob_choice: At the beginning of your pleas
  chosen_korean: 네 간구의 시작부터
  alternatives_korean:
  - 네 간청의 시작부터
  - 네 간구가 시작될 때부터
  lexicon: HALOT
  rationale: 시간의 출발점을 나타내는 표현으로, ‘간구’는 תַּחֲנוּנִים의 간절한 탄원 어감을 비교적 잘 살립니다.
- source_word: יָצָא דָבָר
  english_pob_choice: a word went out
  chosen_korean: 말씀이 나갔으므로
  alternatives_korean:
  - 말이 나갔으므로
  - 메시지가 나갔으므로
  - 명령이 내려졌으므로
  lexicon: HALOT
  rationale: 히브리어의 직역적 관용구를 살리되, 문맥상 단순한 언어가 아니라 전달된 신적 선언임을 반영했습니다.
- source_word: וַאֲנִי בָּאתִי לְהַגִּיד
  english_pob_choice: and I have come to tell it
  chosen_korean: 내가 그것을 전하러 왔습니다
  alternatives_korean:
  - 내가 그것을 알리러 왔습니다
  - 내가 그것을 말하러 왔습니다
  lexicon: HALOT
  rationale: הגיד는 단순히 말하다보다 ‘알리다/전하다’가 더 가깝고, 목적을 드러내는 ‘-러 왔습니다’가 자연스럽습니다.
- source_word: חֲמוּדוֹת אָתָּה
  english_pob_choice: you are greatly beloved
  chosen_korean: 너는 크게 사랑받는 자이니
  alternatives_korean:
  - 너는 크게 귀히 여김을 받는 자이니
  - 너는 크게 사랑받는 이이니
  - 너는 크게 귀히 여김을 받는 자입니다
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 חֲמוּדוֹת의 ‘귀하게 여겨짐/사랑받음’의 강도를 유지했습니다.
- source_word: בַּדָּבָר / בַּמַּרְאֶה
  english_pob_choice: the word / the vision
  chosen_korean: 그 말씀 / 그 환상
  alternatives_korean:
  - 그 말 / 그 이상
  - 그 일 / 그 환상
  lexicon: HALOT
  rationale: 앞의 דָבָר와의 어휘 연속성을 위해 ‘말씀’을 택했고, 다니엘서의 מַרְאֶה는 여기서 예언적 ‘환상’이 가장 적절합니다.
theological_decisions:
- issue: חֲמוּדוֹת אָתָּה의 관계적 뉘앙스
  chosen_reading: ‘크게 사랑받는 자’로 번역해 신적 호의와 व्यक्तिगत한 애정을 함께 드러냈습니다.
  alternative_readings:
  - 크게 귀히 여김을 받는 자
  - 크게 존귀한 자
  rationale: 이 표현은 단순한 가치 평가를 넘어 다니엘에게 주어진 하나님의 특별한 호의를 나타내므로, 지나치게 추상적인 표현보다 관계성을 살렸습니다.
  doctrine_reference: 하나님의 은총과 선택의 언어를 문맥상 보존
- issue: 직접 화법의 존대 수준
  chosen_reading: 천사의 보고는 합쇼체로, 다니엘을 직접 부르는 부분은 반말형 ‘너는’으로 두었습니다.
  alternative_readings:
  - 전체를 합쇼체로 통일
  - 직접 화법도 합쇼체로 완화
  rationale: 본문의 대면적·예언적 긴장을 살리기 위해, 성경 내 천상 사자와 인간 대상 사이의 직접적 어조를 보존했습니다.
  doctrine_reference: 화자-청자 관계를 반영하는 서술 등록 유지
