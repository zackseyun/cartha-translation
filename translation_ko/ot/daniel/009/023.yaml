translation:
  language: ko
  text: 간구를 시작할 때에 말씀이 나갔고[a], 크게 사랑받는 이이기 때문에 내가 그것을 알리러 왔습니다[b]. 그러므로 그 말씀을 살피고 그 환상을 깨달으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메시지가 나갔습니다.’ 히브리어 ‘말씀이 나갔다’는 말한 내용이나 내려진 명령을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘크게 귀히 여김을 받는 이입니다.’ 이 히브리어 표현은 다니엘이 특별히 소중히 여겨지고 사랑받는다는 뜻을 담고 있습니다.
    reason: lexical_alternative
