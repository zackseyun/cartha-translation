- from: 그러므로 야훼께서 재앙을 주시려고 그것을 우리에게 내리셨습니다[a]. 이는 야훼 우리 하나님이 그가 행하신 모든 일에서 의로우시기 때문입니다[b][c]. 그러나 우리는 그의 음성에 귀를 기울이지 않았습니다.
  to: 야훼께서 그 재앙[a]을 지켜보시고[b] 우리에게 내리셨습니다. 이는 야훼 우리 하나님께서 그가 행하신 모든 일에 의로우시며, 우리가 그의 음성[c]을 듣지 않았기 때문입니다.
  rationale: 원문의 동사 배열(재앙을 지켜봄 → 그것을 우리에게 가져옴)을 회복하고, 원문에 없는 목적·강한 추론 관계를 제거했습니다. 각주 표지를 실제 설명 대상인 ‘재앙’, ‘지켜보시고’, ‘음성’에 각각 연결했습니다. ‘모든 일에 의로우시며’는 עַל כָּל מַעֲשָׂיו의 범위와 하나님의 의로움에 대한 진술을 유지합니다.
