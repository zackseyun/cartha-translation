id: DAN.9.14
reference: Daniel 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁקֹ֤ד יְהוָה֙ עַל הָ֣/רָעָ֔ה וַ/יְבִיאֶ֖/הָ עָלֵ֑י/נוּ כִּֽי צַדִּ֞יק יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַל כָּל מַֽעֲשָׂי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/לֹ֥א שָׁמַ֖עְנוּ בְּ/קֹלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/014.yaml
  text: So Yahweh kept watch over the disaster and brought it upon us[a], for Yahweh our God is righteous in all the works that he has done[c][b], and we have not listened to his voice.
  footnotes:
  - marker: a
    text: Or 'the calamity.' The Hebrew word can also mean 'evil,' but here it refers to the disaster of judgment brought on the people.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'kept watch over' can also be understood as 'was vigilant concerning' or, more interpretively, 'hastened.'
    reason: lexical_alternative
  - marker: c
    text: '''Listened to his voice'' carries the sense of obeying what he said.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그 재앙[a]을 지켜보시고[b] 우리에게 내리셨습니다. 이는 야훼 우리 하나님께서 그가 행하신 모든 일에 의로우시며, 우리가 그의 음성[c]을 듣지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재난’. 히브리어는 ‘악’이라는 뜻도 될 수 있지만, 여기서는 백성에게 임한 심판의 재앙을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지켜보시고’는 ‘깨어 살피시고’, ‘그 일에 주의를 기울이시고’로도 옮길 수 있습니다. 문맥상 재앙이 임하도록 살피셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 음성을 듣지 않았다’는 단순히 듣지 못했다는 뜻이 아니라, 그가 말씀하신 것을 따르지 않았다는 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: 하나님의 고유명을 제목으로 대체하지 않고, POB 기본 원칙에 따라 음역 형태로 보존했습니다.
- source_word: הָרָעָה
  english_pob_choice: the disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 악
  - 재해
  lexicon: HALOT
  rationale: 문맥상 도덕적 악이 아니라 심판으로 내린 재앙을 가리키므로, 한국어로는 판결적·파국적 뉘앙스가 있는 ‘재앙’이 적절합니다.
- source_word: וַיִּשְׁקֹד
  english_pob_choice: kept watch over
  chosen_korean: 주시려고 그것을 내리셨습니다
  alternatives_korean:
  - 감시하셨습니다
  - 지켜보셨습니다
  - 재촉하셨습니다
  lexicon: HALOT
  rationale: ‘깨어 살피다/주시하다’의 감시적 뉘앙스를 살리되, 결과적으로 재앙을 가져오신다는 문맥을 한국어에서 자연스럽게 풀어 옮겼습니다.
- source_word: שָׁמַעְנוּ בְּקֹלוֹ
  english_pob_choice: we have not listened to his voice
  chosen_korean: 그의 음성에 귀를 기울이지 않았습니다
  alternatives_korean:
  - 그의 목소리를 듣지 않았습니다
  - 그의 말씀을 순종하지 않았습니다
  lexicon: HALOT
  rationale: ‘듣다’가 단순 청취가 아니라 순종을 포함하는 히브리어 관용구이므로, 직역과 의미를 함께 살린 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 행위와 심판의 성격
  chosen_reading: 하나님이 ‘재앙’을 내리셨다고 분명히 말하되, 그 재앙은 도덕적 악이 아니라 의로운 심판으로 제시했습니다.
  alternative_readings:
  - ‘악’을 내리셨다고 옮김
  - ‘재난’으로 완화하여 옮김
  rationale: 본문은 하나님의 의로움을 동시에 진술하므로, 의미를 약화시키지 않으면서도 하나님이 악의 주체라는 오해를 피해야 합니다.
  doctrine_reference: 원어 우선 원칙; 심판 본문의 신학적 긴장을 보존
