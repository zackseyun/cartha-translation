  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, ‘그가 행하신 모든 일에 의로우시며’는 하나님의 행위 전반과 관련된 의로움을 간결하게 표현합니다. ‘그의 음성을 듣지 않았다’는 히브리어 표현을 유지하되 각주에서 순종의 함의를 밝혔습니다.
