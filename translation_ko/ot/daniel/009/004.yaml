  edition: WLC
  text: וָֽ/אֶתְפַּֽלְלָ֛/ה לַ/יהוָ֥ה אֱלֹהַ֖/י וָ/אֶתְוַדֶּ֑ה וָ/אֹֽמְרָ֗/ה אָנָּ֤א אֲדֹנָ/י֙ הָ/אֵ֤ל הַ/גָּדוֹל֙ וְ/הַ/נּוֹרָ֔א שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/004.yaml
  text: And I prayed to Yahweh my God and confessed and said[a], “Please, Lord, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
  footnotes:
  - marker: a
    text: Or “awesome God.” The Hebrew term denotes one who inspires reverent fear.
    reason: lexical_alternative
  - marker: b
    text: Or “keeps the covenant and covenant faithfulness” / “lovingkindness.” The Hebrew חֶסֶד carries covenantal loyalty and mercy.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 야훼, 제 하나님께 기도하며 고백하고 이렇게 말했습니다[a]. 「부디, 주님, 크고 두려우신 하나님[b], 언약을 지키시며 그를 사랑하고 그의 계명들을 지키는 이들에게 인자하심을 베푸시는 분이시여」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말했습니다.” 히브리어 동사열은 기도의 시작을 서술적으로 이어 줍니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “경외를 불러일으키는 하나님.” 히브리어 표현은 두려움과 경외를 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: WLC/표준 음역
  rationale: 본문의 여호와 표기를 학술적 음역인 ‘야훼’로 옮겨, 언약 անուն 자체를 드러내는 POB 원칙을 따랐습니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 제 하나님
  alternatives_korean:
  - 나의 하나님
  - 내 하나님
  lexicon: WLC
  rationale: 1인칭 소유격을 유지하되, 기도 문맥에 자연스러운 현대 합쇼체로 ‘제 하나님’이라고 옮겼습니다.
- source_word: הַנּוֹרָא
  english_pob_choice: awesome / fearsome
  chosen_korean: 두려우신
  alternatives_korean:
  - 경외로우신
  - 어마어마하신
  lexicon: HALOT
  rationale: 단순한 감탄의 ‘awesome’보다, 경외와 떨림을 일으키는 뜻을 살려 ‘두려우신’으로 옮겼습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 신실하심
  - 자비
  lexicon: HALOT
  rationale: 이 절에서는 언약을 지키시는 하나님과 병치되므로, 관계적 충성과 자비를 함께 담는 전통적이면서도 의미 폭이 있는 ‘인자하심’을 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 직접 나온 언약 이름을 보존하는 것이 원문의 신학적 긴장을 가장 잘 드러내므로, 합쇼체 문장 안에서도 고유명사로 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘두려우신 하나님’의 어조
  chosen_reading: 경외를 불러일으키는 하나님이라는 뜻으로 ‘두려우신’ 유지
  alternative_readings:
  - awesome한 하나님
  - 무서우신 하나님
  rationale: 히브리어 נורא는 단순 공포가 아니라 경외와 떨림을 포함하므로, 현대어에서 그 긴장을 가장 직접적으로 살리는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
