  naturalness: ‘두려우신 하나님’은 נוֹרָא의 경외와 떨림의 의미를 살리는 현대적이고 격식 있는 표현입니다. 직접 인용의 표기는 표준적인 큰따옴표로 다듬고, ‘기도하고 고백하며’는 원문의 연속된 동작을 자연스럽게 반영합니다.
