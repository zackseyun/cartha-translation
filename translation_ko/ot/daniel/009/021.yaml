  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ע֛וֹד אֲנִ֥י מְדַבֵּ֖ר בַּ/תְּפִלָּ֑ה וְ/הָ/אִ֣ישׁ גַּבְרִיאֵ֡ל אֲשֶׁר֩ רָאִ֨יתִי בֶ/חָז֤וֹן בַּ/תְּחִלָּה֙ מֻעָ֣ף בִּ/יעָ֔ף נֹגֵ֣עַ אֵלַ֔/י כְּ/עֵ֖ת מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/021.yaml
  text: while I was still speaking in prayer[a], the man Gabriel, whom I had seen in the vision at the beginning, came to me in swift flight at the time of the evening offering.
  footnotes:
  - marker: a
    text: Or, less likely, 'being wearied' or 'in weariness' instead of 'in swift flight.' The Hebrew phrase is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 아직 기도하며 말하고 있을 때, 그 시작에 환상 속에서 보았던 그 남자 가브리엘이 저녁 제사 시간에, 빠른 날갯짓으로 내게 다가왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지쳐서’ 또는 ‘지친 상태로’로도 볼 수 있습니다. 히브리어 구절이 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה
  english_pob_choice: while I was still speaking in prayer
  chosen_korean: 내가 아직 기도하며 말하고 있을 때
  alternatives_korean:
  - 내가 아직 기도 중에 말하고 있을 때
  - 내가 기도 가운데 아직 말하고 있을 때
  lexicon: HALOT
  rationale: 진행 중인 행위를 나타내는 시간 부사구이므로, ‘아직 ... 하고 있을 때’로 옮겨 동시성을 자연스럽게 살렸습니다.
- source_word: הָאִישׁ גַּבְרִיאֵל
  english_pob_choice: the man Gabriel
  chosen_korean: 그 남자 가브리엘
  alternatives_korean:
  - 그 사람 가브리엘
  - 그 남성 가브리엘
  lexicon: HALOT
  rationale: 가브리엘을 환상 속 인간형 모습으로 묘사하는 표현이므로, 직역에 가깝게 ‘그 남자’로 유지했습니다.
- source_word: מֻעָף בִּיעָף
  english_pob_choice: in swift flight
  chosen_korean: 빠른 날갯짓으로
  alternatives_korean:
  - 급히 날아
  - 빠른 비행으로
  - 지친 듯이
  lexicon: HALOT
  rationale: 문구가 난해하므로 POB의 해석을 따라 이동의 의미를 살리되, 한국어에서는 ‘날갯짓’으로 비행 감각을 드러냈습니다.
- source_word: כְּעֵת מִנְחַת עָרֶב
  english_pob_choice: at the time of the evening offering
  chosen_korean: 저녁 제사 시간에
  alternatives_korean:
  - 저녁 제물 드리는 시간에
  - 저녁 곡식제사 시간에
  lexicon: HALOT
  rationale: ‘מִנְחָה’의 제의적 시간표현을 한국어 관용에 맞게 옮기되, 특정 제사 행위의 시간임을 분명히 했습니다.
theological_decisions:
- issue: מֻעָף בִּיעָף의 난해한 의미
  chosen_reading: 가브리엘이 빠른 움직임으로 다가온 것으로 옮겼습니다.
  alternative_readings:
  - 지친 상태로 왔다
  - 지쳐서 왔다
  rationale: 문맥상 다니엘에게 급히 도착하는 장면이므로 이동 의미를 우선하되, 히브리어의 난해함은 번역문에서 과도하게 해소하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
