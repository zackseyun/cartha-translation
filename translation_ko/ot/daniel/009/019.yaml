source:
  edition: WLC
  text: אֲדֹנָ֤/י שְׁמָ֨עָ/ה֙ אֲדֹנָ֣/י סְלָ֔חָ/ה אֲדֹנָ֛/י הַֽקֲשִׁ֥יבָ/ה וַ/עֲשֵׂ֖ה אַל תְּאַחַ֑ר לְמַֽעֲנְ/ךָ֣ אֱלֹהַ֔/י כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל עִירְ/ךָ֖ וְ/עַל עַמֶּֽ/ךָ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/019.yaml
  text: Lord[a], hear! Lord, forgive! Lord, pay attention and act! Do not delay, for your own sake, my God, because your name is called over your city and your people.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'your city and your people are called by your name.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 들으소서! 주님, 용서하소서! 주님, 귀를 기울이시고 행하소서! 나의 하나님, 주님 자신을 위하여 지체하지 마소서. 주님의 이름이 주님의 도성과 주님의 백성 위에 불리기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘주님의 도성과 주님의 백성이 주님의 이름으로 불립니다’라고 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 내 주님
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호칭이므로 한국어 기도체에서 자연스럽고 존칭에 맞는 ‘주님’을 택했습니다.
- source_word: שְׁמָעָה
  english_pob_choice: hear
  chosen_korean: 들으소서
  alternatives_korean:
  - 들어주소서
  - 들어 주십시오
  lexicon: HALOT
  rationale: 청각적 의미를 살리면서 간구의 힘을 유지하려면 ‘들으소서’가 가장 간결하고 직접적입니다.
- source_word: סְלָחָה
  english_pob_choice: forgive
  chosen_korean: 용서하소서
  alternatives_korean:
  - 사하여 주소서
  - 사면하소서
  lexicon: HALOT
  rationale: 회개 기도 문맥에서 סלח의 표준적 의미를 가장 분명하게 드러내는 말은 ‘용서하소서’입니다.
- source_word: הַקֲשִׁיבָה
  english_pob_choice: pay attention
  chosen_korean: 귀를 기울이시고
  alternatives_korean:
  - 주의 깊게 들으시고
  - 유의하시고
  lexicon: HALOT
  rationale: 단순히 듣는 것보다 적극적으로 귀를 돌려 주목하는 뉘앙스를 살리기 위해 ‘귀를 기울이시고’로 옮겼습니다.
- source_word: וַעֲשֵׂה
  english_pob_choice: and act
  chosen_korean: 행하소서
  alternatives_korean:
  - 하시고
  - 행동하소서
  lexicon: HALOT
  rationale: 문맥상 ‘무엇을 하다’의 일반 동사보다 즉각적인 개입을 요구하는 간구이므로 ‘행하소서’가 자연스럽습니다.
- source_word: אַל תְּאַחַר
  english_pob_choice: Do not delay
  chosen_korean: 지체하지 마소서
  alternatives_korean:
  - 늦추지 마소서
  - 미루지 마소서
  lexicon: HALOT
  rationale: 부정 명령의 긴박한 뉘앙스를 현대 한국어 기도문으로 가장 또렷하게 전달합니다.
- source_word: לְמַעַנְךָ
  english_pob_choice: for your own sake
  chosen_korean: 당신의 이름 때문에
  alternatives_korean:
  - 당신을 위하여
  - 당신의 명예를 위해
  lexicon: HALOT
  rationale: 히브리어의 동기 제시를 한국어에서 자연스럽게 풀어, 뒤의 이름-도시-백성 연관과 연결되도록 했습니다.
- source_word: שִׁמְךָ נִקְרָא עַל
  english_pob_choice: your name is called upon
  chosen_korean: 당신의 이름이 … 위에 불리기 때문입니다
  alternatives_korean:
  - 당신의 이름으로 불리기 때문입니다
  - 당신의 이름이 … 위에 불려지기 때문입니다
  lexicon: HALOT
  rationale: ‘이름이 … 위에 불리다’는 소유·귀속의 히브리 관용구를 보존하면서, 한국어에서 이해 가능한 형태로 옮겼습니다.
theological_decisions:
- issue: שִׁמְךָ נִקְרָא עַל의 귀속/소유 관용구
  chosen_reading: ‘당신의 이름이 당신의 도시와 당신의 백성 위에 불리다’로, 하나님 이름의 소유권·언약적 귀속을 드러냈습니다.
  alternative_readings:
  - ‘당신의 도시와 당신의 백성이 당신의 이름으로 불립니다’
  - ‘당신의 이름이 당신의 도시와 당신의 백성 위에 놓여 있습니다’
  rationale: 이 구절은 단순한 명명보다 하나님의 소유와 언약적 동일시를 말하므로, 매끈한 의역보다 히브리어 이미지를 보존하는 번역이 본문의 신학을 더 잘 살립니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
