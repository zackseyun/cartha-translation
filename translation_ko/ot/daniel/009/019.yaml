  terminology: 아도나이는 ‘주님’, אֱלֹהַ이는 ‘나의 하나님’으로 구별했습니다. ‘도성’, ‘백성’, ‘이름이 … 위에 불리다’는 본문의 공적·언약적 귀속 표현을 특정 교리로 과도하게 해석하지 않고 유지합니다.
