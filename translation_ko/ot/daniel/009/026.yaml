- from: 그리고 그 예순두 주 후에, 한 기름부음 받은 이가 끊어질 것이며 그에게는 아무것도 없을 것입니다. 그 도시와 성소를 오는 통치자의 백성이 멸망시킬 것입니다. 그 끝은 홍수처럼 이를 것이며, 끝까지 전쟁이 있을 것입니다. 황폐함이 정해져 있습니다.[a][b][c][d]
