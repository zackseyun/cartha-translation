  rationale: ‘이레’는 שָׁבֻעִים의 다니엘서적 표현을 보존하며, ‘홍수와 함께’는 בַּשֶּׁטֶף를 비교 표현으로 바꾸지 않고 직역에 가깝게 옮깁니다. 모든 각주 표지를 해당 어구에 연결했고, 각주 b에서 본문과 중복된 항목을 실제 대안 독법으로 바로잡았습니다. 복수형 שֹׁמֵמוֹת는 ‘황폐함들이’로 반영하되, 그 의미를 특정 역사 사건이나 신학적 해석으로 좁히지 않았습니다.
