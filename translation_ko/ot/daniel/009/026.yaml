id: DAN.9.26
reference: Daniel 9:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחֲרֵ֤י הַ/שָּׁבֻעִים֙ שִׁשִּׁ֣ים וּ/שְׁנַ֔יִם יִכָּרֵ֥ת מָשִׁ֖יחַ וְ/אֵ֣ין ל֑/וֹ וְ/הָ/עִ֨יר וְ/הַ/קֹּ֜דֶשׁ יַ֠שְׁחִית עַ֣ם נָגִ֤יד הַ/בָּא֙ וְ/קִצּ֣/וֹ בַ/שֶּׁ֔טֶף וְ/עַד֙ קֵ֣ץ מִלְחָמָ֔ה נֶחֱרֶ֖צֶת שֹׁמֵמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/026.yaml
  text: And after the sixty-two weeks[a], an anointed one will be cut off and will have nothing. And the city and the sanctuary the people of the coming ruler will destroy. Its end will come with a flood, and until the end there will be war[d][c][b]; desolations are decreed.
  footnotes:
  - marker: a
    text: Or 'Messiah will be cut off.' The Hebrew reads 'an anointed one,' and interpreters differ on whether this refers specifically to the Messiah.
    reason: alternative_reading
  - marker: b
    text: Or 'and there will be nothing for him,' or 'and no one will be for him.' The Hebrew clause is terse and difficult.
    reason: lexical_alternative
  - marker: c
    text: Or 'the people of a coming prince.'
    reason: lexical_alternative
  - marker: d
    text: Or 'his end will come with a flood.' The referent of 'his/its' is debated.
    reason: alternative_reading
translation:
  language: ko
  text: 그 예순두 이레 후에, 한 기름부음 받은 이가 끊어질 것이며[a] 그에게는 아무것도 없을 것입니다.[b] 그 도시와 성소를 오는 통치자의 백성이 파괴할 것입니다.[c] 그 끝은 홍수와 함께 이를 것이며,[d] 끝까지 전쟁이 있을 것입니다. 황폐함들이 정해져 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메시아가 끊어질 것이다’입니다. 히브리어는 ‘한 기름부음 받은 이’라고 하며, 이것이 특정하게 메시아를 가리키는지에 대해서는 해석이 갈립니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그에게는 아무것도 남지 않을 것이다’ 또는 ‘그에게는 아무도 없을 것이다’입니다. 히브리어 구절은 매우 압축적이고 해석하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다가오는 군주의 백성’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그의 끝은 홍수와 함께 이를 것이다’입니다. 대명사의 지시 대상은 논쟁적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָשִׁיחַ
  english_pob_choice: an anointed one
  chosen_korean: 기름부음 받은 이
  alternatives_korean:
  - 메시아
  - 기름부음 받은 자
  lexicon: HALOT
  rationale: 히브리어가 정관사 없는 מָשִׁיחַ를 쓰므로, 본문 자체의 일반성을 살려 ‘기름부음 받은 이’로 옮겼습니다. POB의 해설처럼 메시아적 이해는 여지로 남기되 본문에서는 단정하지 않았습니다.
- source_word: וְאֵין לוֹ
  english_pob_choice: and will have nothing
  chosen_korean: 그에게는 아무것도 없을 것입니다
  alternatives_korean:
  - 그에게는 아무것도 남지 않을 것입니다
  - 그에게는 아무도 없을 것입니다
  - 그에게는 소유한 것이 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어 구절이 매우 압축적이어서 소유, 지지자, 권리 상실 등을 모두 열어 두어야 합니다. 그래서 특정 의미를 좁히지 않고 결핍의 일반적 의미를 살렸습니다.
- source_word: עַם נָגִיד הַבָּא
  english_pob_choice: the people of the coming ruler
  chosen_korean: 오는 통치자의 백성
  alternatives_korean:
  - 다가오는 통치자의 백성
  - 오는 지도자의 백성
  - 장차 올 통치자의 백성
  lexicon: HALOT
  rationale: נָגִיד는 ‘통치자/지도자/군주’의 폭을 가지므로, 현대 한국어에서 정치적 권위가 드러나는 ‘통치자’를 택했습니다. הַבָּא는 분사적 수식으로 ‘오는’이 가장 자연스럽습니다.
- source_word: וְקִצּוֹ בַשֶּׁטֶף
  english_pob_choice: Its end will come with a flood
  chosen_korean: 그 끝은 홍수처럼 이를 것이며
  alternatives_korean:
  - 그 끝은 홍수와 함께 이를 것이며
  - 그 끝은 범람처럼 이를 것이며
  - 그의 끝은 홍수처럼 이를 것이며
  lexicon: HALOT
  rationale: 대명사 지시가 불분명하므로 POB처럼 ‘그 끝’으로 두어 사건의 귀결을 열어 두었습니다. בַשֶּׁטֶף는 비유적/실제적 범람 이미지를 살려 ‘홍수처럼’으로 옮겼습니다.
- source_word: נֶחֱרֶצֶת שֹׁמֵמֹות
  english_pob_choice: desolations are decreed
  chosen_korean: 황폐함이 정해져 있습니다
  alternatives_korean:
  - 황폐함들이 정해져 있습니다
  - 황폐가 결정되어 있습니다
  - 황폐한 것들이 정해져 있습니다
  lexicon: HALOT
  rationale: נֶחֱרֶצֶת는 확정적으로 정해진 상태를 나타내므로 ‘정해져 있습니다’로 옮겼습니다. שֹׁמֵמוֹת는 복수형/집합적 표현이지만 한국어에서는 자연스럽게 집합 명사 ‘황폐함’으로 처리했습니다.
theological_decisions:
- issue: 마쉬아흐(מָשִׁיחַ)를 본문에서 메시아로 단정할지 여부
  chosen_reading: 본문에는 ‘기름부음 받은 이’로 두고, 메시아 동일시는 열어 둡니다.
  alternative_readings:
  - 메시아
  - 기름부음 받은 자
  rationale: 이 구절은 해석 쟁점이 크고, 히브리어 자체는 특정 인물을 명시적으로 단정하지 않습니다. 따라서 번역은 원문 투명성을 우선하고, 메시아적 독해는 본문 밖에서 검토할 수 있게 남겼습니다.
  doctrine_reference: 'DOCTRINE.md: 제목어는 맥락에 따라 옮기되, 해석 논쟁을 번역으로 봉쇄하지 않는다.'
- issue: וְאֵין לוֹ의 의미를 어떻게 처리할지
  chosen_reading: 결핍의 일반 의미를 살려 ‘그에게는 아무것도 없을 것입니다’로 옮깁니다.
  alternative_readings:
  - 그에게는 아무도 없을 것입니다
  - 그에게는 아무것도 남지 않을 것입니다
  - 그에게는 소유가 없을 것입니다
  rationale: 이 표현은 문법적으로 압축되어 있어 대상을 특정하면 신학적·해석적 방향이 과도하게 결정됩니다. 그래서 번역에서도 상실/결핍의 의미만 유지해 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 열어 둔 긴장은 번역에서 해소하지 않는다.'
