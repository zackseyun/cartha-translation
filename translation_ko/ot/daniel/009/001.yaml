id: DAN.9.1
reference: Daniel 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת אַחַ֗ת לְ/דָרְיָ֛וֶשׁ בֶּן אֲחַשְׁוֵר֖וֹשׁ מִ/זֶּ֣רַע מָדָ֑י אֲשֶׁ֣ר הָמְלַ֔ךְ עַ֖ל מַלְכ֥וּת כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/001.yaml
  text: In the first year of Darius son of Ahasuerus[a], of the offspring of the Medes, who was made king over the kingdom of the Chaldeans—
  footnotes:
  - marker: a
    text: Or 'the Babylonians.' 'Chaldeans' is the Hebrew term, but in this context it can function as a designation for the Babylonian kingdom.
    reason: lexical_alternative
translation:
  language: ko
  text: 메대 사람 아하수에로의 아들 다리오의 첫 해, 곧 갈대아 왕국 위에 왕으로 세움을 받은 사람에 대하여—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 왕국’은 문맥상 ‘바빌로니아’로 기능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת
  english_pob_choice: In the first year
  chosen_korean: 첫 해
  alternatives_korean:
  - 한 해의 첫째 해
  - 제1년
  lexicon: HALOT
  rationale: 연대 표기 관용구이므로 직역보다 한국어에서 자연스러운 ‘첫 해’로 옮겨 regnal dating의 기능을 살렸습니다.
- source_word: מִזֶּרַע מָדָי
  english_pob_choice: of the offspring of the Medes
  chosen_korean: 메대 사람
  alternatives_korean:
  - 메대의 후손
  - 메대 족속의 후손
  lexicon: HALOT
  rationale: זרע의 계보적 의미를 한국어에서는 ‘메대 사람’으로 간결하게 풀어, 혈통/출신을 드러내되 문장을 과도하게 무겁게 만들지 않았습니다.
- source_word: הָמְלַךְ
  english_pob_choice: was made king
  chosen_korean: 왕으로 세움을 받은
  alternatives_korean:
  - 왕이 되었다
  - 왕으로 삼아졌다
  lexicon: HALOT
  rationale: 호팔형의 수동·사역적 뉘앙스를 살려, 단순한 ‘되었다’보다 왕권 수여의 의미가 드러나는 표현을 택했습니다.
- source_word: מַלְכוּת כַּשְׂדִּים
  english_pob_choice: the kingdom of the Chaldeans
  chosen_korean: 갈대아 왕국
  alternatives_korean:
  - 갈대아 사람들의 왕국
  - 바빌로니아 왕국
  lexicon: HALOT
  rationale: 히브리어 표면형 ‘갈대아’를 본문에 유지해 출발점의 어휘를 살리고, 통치 영역은 한국어에서 자연스러운 ‘왕국’으로 옮겼습니다.
theological_decisions:
- issue: 다리오의 즉위 동사 해석
  chosen_reading: ‘왕으로 세움을 받은’으로 옮겨, 본문이 그의 왕위가 자발적 자칭이 아니라 부여된 지위임을 드러냈습니다.
  alternative_readings:
  - ‘왕이 되었다’
  - ‘왕이 되어 다스렸다’
  rationale: 히브리어 호팔형은 수동적 수여를 시사하므로, 권위의 기원까지 드러내는 번역이 본문의 어감을 더 잘 보존합니다.
  doctrine_reference: 본문 문법과 왕권 서술의 역사적 의미
- issue: ‘갈대아인’의 범위
  chosen_reading: 본문에는 ‘갈대아 왕국’을 두고, 주석 없이 영어 POB의 대안 의미를 본문 밖으로 옮기지 않았습니다.
  alternative_readings:
  - ‘바빌로니아 왕국’
  - ‘갈대아 사람들의 나라’
  rationale: 히브리어 어휘 자체는 ‘갈대아’를 지니며, 문맥상 바빌론을 가리킬 수 있어도 본문은 원어 표면을 우선 보존하는 것이 더 투명합니다.
  doctrine_reference: 역사-지리적 용어의 본문 보존 원칙
