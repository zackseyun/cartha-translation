  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֤כֶת בְּ/תֽוֹרֹתָי/ו֙ אֲשֶׁ֣ר נָתַ֣ן לְ/פָנֵ֔י/נוּ בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/010.yaml
  text: and we have not obeyed the voice of Yahweh our God[a], to walk in his laws, which he set before us through his servants the prophets.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of his servants the prophets,'' an idiom meaning ''through his servants the prophets.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 야훼 우리 하나님[a]의 소리를 듣지 않았습니다. 그의 종들인 예언자들을 통해 우리 앞에 두신 그의 율법들 안에서 걷지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 종들의 손으로’라는 관용구를 사용하며, 이는 ‘그의 종들인 예언자들을 통해’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹ֣א שָׁמַ֔עְנוּ
  english_pob_choice: and we have not obeyed
  chosen_korean: 우리는 ... 듣지 않았습니다
  alternatives_korean:
  - 우리는 ... 순종하지 않았습니다
  - 우리는 ... 따르지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 특히 בְּקוֹל과 함께 단순 청취보다 응답적 순종의 뜻을 띠지만, 한국어에서는 ‘소리를 듣지 않다’가 그 불순종을 직접적으로 드러내어 원문의 대립을 살립니다.
- source_word: בְּקוֹל
  english_pob_choice: the voice of
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 명령
  lexicon: HALOT
  rationale: 직역에 가까운 ‘음성’도 가능하지만, 한국어에서 ‘야훼 우리 하나님의 소리’는 원문의 청각적·인격적 표현을 자연스럽게 유지합니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 주 우리 하나님
  lexicon: DOCTRINE.md Contested terms
  rationale: יהוה는 본문 지침에 따라 ‘야훼’로 옮기고, אֱלֹהֵינוּ는 언약적 관계를 살려 ‘우리 하나님’으로 옮겼습니다.
- source_word: בְּ/תֽוֹרֹתָי/ו
  english_pob_choice: in his laws
  chosen_korean: 그의 율법들 안에서
  alternatives_korean:
  - 그의 가르침 안에서
  - 그의 지침들 안에서
  lexicon: HALOT
  rationale: 복수형 תּוֹרוֹת는 구체적인 규범·지시들의 묶음을 가리키므로, 본문의 불순종 문맥에서 ‘율법들’이 가장 직접적입니다.
- source_word: בְּ/יַד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים
  english_pob_choice: through his servants the prophets
  chosen_korean: 그의 종들인 예언자들을 통해
  alternatives_korean:
  - 그의 종들인 선지자들을 통해
  - 예언자들인 그의 종들을 통해
  lexicon: HALOT
  rationale: בְּיַד는 ‘~의 손으로’라는 히브리 관용구로 매개를 뜻하므로 ‘통해’가 자연스럽고, עֲבָדָיו는 여기서 하나님의 공식적 봉사자라는 점을 살려 ‘종들’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 언약 이름을 제목이 아닌 고유명사로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘듣지 않았다’와 ‘순종하지 않았다’의 관계
  chosen_reading: ‘소리를 듣지 않았습니다’
  alternative_readings:
  - ‘순종하지 않았습니다’
  - ‘귀를 기울이지 않았습니다’
  rationale: שׁמע בְּקוֹל의 성경 히브리어 관용은 단순 청취가 아니라 응답적 순종을 포함하지만, 한국어에서는 직접적 부정 진술을 통해 그 불순종의 강도를 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §5
