- from: 그는 우리에게와 우리를 심판한 우리 재판관들에게 말씀하신 자신의 말씀을 확증하셔서, 온 하늘 아래에서는 행해진 적이 없는 큰 재앙을 우리에게 내리셨습니다. 그것은 예루살렘에서 행해진 것과 같습니다.[a]
  to: 그는 우리와 우리를 재판한 재판관들[a]을 거슬러 말씀하신 그의 말씀을 이루시고, 예루살렘에 일어난 것과 같은 큰 재앙을 우리에게 내리셨습니다. 온 하늘 아래 어디에서도 그런 일이 일어난 적이 없었습니다.
  rationale: 원문의 주절과 수단/결과를 ‘말씀을 이루시고 … 재앙을 내리셨습니다’로 보존했습니다. ‘거슬러’로 עַל의 심판 문맥상 적대적 방향을 반영했으며, 재앙이 예루살렘에 일어난 것과 같은 전례 없는 일이었다는 비교절은 별문장으로 명료하게 옮겼습니다. 재판관들의 넓은 통치적 의미 가능성은 본문에 과도하게 해석을 삽입하지 않고, 정확한 위치의 각주로 남겼습니다.
