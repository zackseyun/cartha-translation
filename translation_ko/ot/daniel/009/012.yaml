source:
  edition: WLC
  text: וַ/יָּ֜קֶם אֶת דברי/ו אֲשֶׁר דִּבֶּ֣ר עָלֵ֗י/נוּ וְ/עַ֤ל שֹֽׁפְטֵ֨י/נוּ֙ אֲשֶׁ֣ר שְׁפָט֔וּ/נוּ לְ/הָבִ֥יא עָלֵ֖י/נוּ רָעָ֣ה גְדֹלָ֑ה אֲשֶׁ֣ר לֹֽא נֶעֶשְׂתָ֗ה תַּ֚חַת כָּל הַ/שָּׁמַ֔יִם כַּ/אֲשֶׁ֥ר נֶעֶשְׂתָ֖ה בִּ/ירוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/012.yaml
  text: He has confirmed his words that he spoke against us and against our judges who judged us[a], by bringing upon us a great disaster such as had not been done under all heaven, as it was done in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'our rulers who ruled us' or 'our leaders who governed us.' The Hebrew terms for 'judges' can refer more broadly to governing authorities, not only courtroom judges.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 우리와 우리를 재판한 재판관들[a]을 거슬러 말씀하신 그의 말씀을 이루시고, 예루살렘에 일어난 것과 같은 큰 재앙을 우리에게 내리셨습니다. 온 하늘 아래 어디에서도 그런 일이 일어난 적이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 다스린 통치자들’ 또는 ‘우리를 통치한 지도자들’로 옮길 수 있습니다. 히브리어 ‘재판관들’에 해당하는 말은 법정의 판사들뿐 아니라 더 넓게 통치 권위를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  english_pob_choice: has confirmed
  chosen_korean: 확증하셔서
  alternatives_korean:
  - 세우셔서
  - 이루셔서
  - 실행하셔서
  lexicon: HALOT
  rationale: 하나님이 이미 말씀하신 심판의 말을 실제로 성립시키셨다는 뜻을 살려, ‘확증하다’로 옮겼습니다.
- source_word: דברי/ו
  english_pob_choice: his words
  chosen_korean: 자신의 말씀
  alternatives_korean:
  - 그의 말씀
  - 그 말씀들
  lexicon: HALOT
  rationale: 히브리어 복수형을 너무 기계적으로 드러내기보다, 한국어에서는 자연스러운 ‘자신의 말씀’으로 옮기되 단수화된 의미를 보존했습니다.
- source_word: שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ
  english_pob_choice: our judges who judged us
  chosen_korean: 우리를 심판한 우리 재판관들
  alternatives_korean:
  - 우리 재판관들
  - 우리를 다스린 우리 통치자들
  - 우리를 판결한 우리 재판관들
  lexicon: HALOT
  rationale: שפט 계열의 반복을 살리면서도, 다니엘 문맥에서 단순 법정 판사보다 넓은 통치 권위까지 열어 두기 위해 ‘재판관들’을 택했습니다.
- source_word: רָעָה גְדֹלָה
  english_pob_choice: a great disaster
  chosen_korean: 큰 재앙
  alternatives_korean:
  - 큰 재난
  - 큰 악
  - 큰 재화
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 ‘악’보다 심판으로 닥친 재앙의 뜻이 강하므로, 현대 한국어로 분명한 ‘재앙’이 적합합니다.
theological_decisions:
- issue: ‘우리 재판관들’의 의미 범위
  chosen_reading: 법정 판사만이 아니라 백성을 다스리던 통치 권위까지 포괄할 수 있도록 번역했습니다.
  alternative_readings:
  - ‘우리 판사들’처럼 협소하게 옮김
  - ‘우리 통치자들’로만 옮김
  rationale: 히브리어 שפט는 재판과 통치를 함께 가리킬 수 있으므로, 본문이 지닌 넓은 역사적 의미를 보존하는 쪽을 택했습니다.
  doctrine_reference: lexical semantics of שפט in historical-prayer context
