- source_word: לְאִישׁ יְהוּדָה וּלְיוֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: to the men of Judah, to the inhabitants of Jerusalem
  chosen_korean: 유다 사람들에게, 예루살렘 주민들에게
  alternatives_korean:
