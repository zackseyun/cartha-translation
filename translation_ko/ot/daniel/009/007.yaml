base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
  footnotes:
  - marker: a
    text: Or 'open shame' / 'shame-facedness.' The Hebrew idiom is literally 'shame of face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to every man of Judah.' The Hebrew uses a masculine singular form distributively.
    reason: lexical_alternative
  - marker: c
    text: Or 'because of their treachery' or 'because of their faithlessness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 의는 주님께 있고, 얼굴의 수치[a]는 오늘날처럼 우리에게 있습니다. 곧 유다 사람들[b]과 예루살렘 주민들과, 가까이 있는 이들이든 멀리 있는 이들이든, 주님께서 그들을 쫓아내신 모든 땅에 있는 온 이스라엘에게 있습니다. 이는 그들이 주님께 저지른 불성실[c] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴의 수치’는 히브리어 관용구를 직역에 가깝게 옮긴 것으로, 공개적으로 드러난 수치 또는 낯부끄러움을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유다의 사람’이라는 남성 단수형을 분배적·집합적으로 사용합니다. ‘유다 사람들’로 옮길 수도 있고, ‘유다의 각 사람’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘불성실’은 히브리어 מעל을 옮긴 말로, 언약 관계에서의 불성실·배반을 뜻할 수 있습니다.
    reason: lexical_alternative
