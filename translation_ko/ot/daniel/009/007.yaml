  naturalness: '''얼굴의 부끄러움이 속합니다''와 ''주님께 행한 신실하지 못함''은 현대 표준 한국어에서 부자연스럽습니다. ''얼굴의 수치가 … 있습니다'' 및 ''주님께 저지른 불성실''이 문어적 합쇼체에 자연스럽고 원문의 관용구와 언약적 배신의 뜻을 보존합니다.'
