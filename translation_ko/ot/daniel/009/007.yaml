id: DAN.9.7
reference: Daniel 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/ךָ֤ אֲדֹנָ/י֙ הַ/צְּדָקָ֔ה וְ/לָ֛/נוּ בֹּ֥שֶׁת הַ/פָּנִ֖ים כַּ/יּ֣וֹם הַ/זֶּ֑ה לְ/אִ֤ישׁ יְהוּדָה֙ וּ/לְ/יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם וּֽ/לְ/כָל יִשְׂרָאֵ֞ל הַ/קְּרֹבִ֣ים וְ/הָ/רְחֹקִ֗ים בְּ/כָל הָֽ/אֲרָצוֹת֙ אֲשֶׁ֣ר הִדַּחְתָּ֣/ם שָׁ֔ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֥ר מָֽעֲלוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
  footnotes:
  - marker: a
    text: Or 'open shame' / 'shame-facedness.' The Hebrew idiom is literally 'shame of face.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to every man of Judah.' The Hebrew uses a masculine singular form distributively.
    reason: lexical_alternative
  - marker: c
    text: Or 'because of their treachery' or 'because of their faithlessness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께는 의가 속하고, 우리에게는 오늘날과 같이 얼굴의 부끄러움이 속합니다. 이것은 유다 사람들에게, 예루살렘 주민들에게, 그리고 가까운 이들과 먼 이들을 막론한 온 이스라엘에게 해당합니다. 곧 주님께서 그들을 쫓아내신 모든 땅들에서, 그들이 주님께 행한 신실하지 못함 때문에 그러합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴의 부끄러움’은 히브리어 관용구를 직역한 표현으로, 공개적 수치와 낯부끄러움을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가까운 이들과 먼 이들’은 이스라엘 백성의 지리적 분산을 가리키는 표현입니다.
    reason: source_note
  - marker: c
    text: ‘주님께 행한 신실하지 못함’은 히브리어 מעל의 언약적 불성실, 배반, treachery의 의미를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ ... הַצְּדָקָה
  english_pob_choice: To you ... belongs righteousness
  chosen_korean: 주님께는 의가 속합니다
  alternatives_korean:
  - 주님께는 의가 있습니다
  - 주님께는 의가 돌아갑니다
  lexicon: HALOT
  rationale: 소유·귀속 관계를 한국어의 ‘속하다’로 자연스럽게 옮기되, משפט적·언약적 맥락의 ‘의’를 유지했습니다.
- source_word: בֹּשֶׁת הַפָּנִים
  english_pob_choice: shame of face
  chosen_korean: 얼굴의 부끄러움
  alternatives_korean:
  - 수치
  - 얼굴의 수치
  - 낯부끄러움
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: לְאִישׁ יְהוּדָה וּלְיוֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: to the men of Judah, to the inhabitants of Jerusalem
  chosen_korean: 유다 사람들에게, 예루살렘 주민들에게
  alternatives_korean:
  - 유다의 남자들에게, 예루살렘의 거주자들에게
  - 유다 남자들에게, 예루살렘에 사는 이들에게
  lexicon: HALOT
  rationale: ניסוח의 대표적 남성형을 완전히 지우지 않으면서도 현대 한국어에서 과도하게 성별화되지 않도록 ‘유다 사람들’과 ‘주민들’로 풀었습니다.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  english_pob_choice: those who are near and those who are far away
  chosen_korean: 가까운 이들과 먼 이들을 막론한
  alternatives_korean:
  - 가까운 자들과 먼 자들
  - 가까운 이들과 먼 이들
  lexicon: HALOT
  rationale: 지리적 근접·원거리를 대조하는 표현을 한국어의 포괄적 병렬로 살려, 흩어진 이스라엘의 범위를 분명히 했습니다.
- source_word: בְּמַעֲלָם ... מָעֲלוּ בָךְ
  english_pob_choice: because of their unfaithfulness that they committed against you
  chosen_korean: 주님께 행한 신실하지 못함 때문에
  alternatives_korean:
  - 주님께 대한 그들의 불성실 때문에
  - 주님께 범한 배신 때문에
  lexicon: HALOT
  rationale: מעל의 언약적 배반·불성실의 뜻을 살리되, 문장 흐름상 한국어에서는 ‘행한 신실하지 못함’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: 의와 부끄러움의 대비
  chosen_reading: 본문은 하나님께는 의가, 백성에게는 공개적 부끄러움이 있다는 고백적 대조를 이룹니다.
  alternative_readings:
  - 의를 ‘공의’로 좁혀 읽는 방식
  - 부끄러움을 단순한 ‘수치’로 평준화하는 방식
  rationale: 다니엘의 회개 기도는 하나님의 옳으심과 백성의 마땅한 수치를 병치하며, 이를 약화하지 않기 위해 ‘의’와 ‘얼굴의 부끄러움’을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
- issue: 보편적 귀양 범위와 성별 표지
  chosen_reading: ‘이들/사람들’로 풀되, 원문의 남성 단수 대표형이 지닌 집합적 표지는 과도하게 제거하지 않았습니다.
  alternative_readings:
  - 완전 성중립적 ‘모든 이스라엘 사람들’
  - 직역형 ‘유다의 남자’
  rationale: 현대 한국어의 가독성을 유지하면서도 원문의 분배적 집합표현을 보존하려는 절충입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
