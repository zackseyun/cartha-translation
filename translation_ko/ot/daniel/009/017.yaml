    rationale: וְהָאֵר פָּנֶיךָ는 하나님의 얼굴이 빛을 비춘다는 관용적 청원입니다. ‘주의 얼굴빛을 … 비추소서’는 이 표상을 보존하면서 자연스럽습니다.
  - severity: low
