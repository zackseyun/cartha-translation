id: DAN.9.17
reference: Daniel 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֣ה שְׁמַ֣ע אֱלֹהֵ֗י/נוּ אֶל תְּפִלַּ֤ת עַבְדְּ/ךָ֙ וְ/אֶל תַּ֣חֲנוּנָ֔י/ו וְ/הָאֵ֣ר פָּנֶ֔י/ךָ עַל מִקְדָּשְׁ/ךָ֖ הַ/שָּׁמֵ֑ם לְמַ֖עַן אֲדֹנָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/017.yaml
  text: And now[a], our God, hear the prayer of your servant and his pleas for mercy, and let your face shine upon your sanctuary, which lies desolate, for the Lord’s sake.
  footnotes:
  - marker: a
    text: Or, “for your own sake, O Lord.” The Hebrew reads “for the sake of the Lord,” using a divine title in the third person within direct address.
    reason: alternative_reading
translation:
  language: ko
  text: 이제, 우리 하나님, 주의 종의 기도와 그의 간구를 들으시고, 주의 얼굴을 주의 황폐한 성소 위에 비추소서. 주님의 이름을 위하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님, 주님 자신을 위하여.” 히브리어는 직접 호칭 안에서 ‘주님’이라는 칭호를 3인칭으로 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 기도의 전환부를 자연스럽게 드러내는 시간·담화 표지로 간결한 ‘이제’가 적절합니다.
- source_word: תְּפִלַּת עַבְדְּךָ
  english_pob_choice: the prayer of your servant
  chosen_korean: 주의 종의 기도
  alternatives_korean:
  - 당신의 종의 기도
  - 주의 종이 드리는 기도
  lexicon: HALOT
  rationale: ‘종’이 כאן의 겸손한 자기 호칭을 잘 살리며, 현대 한국어에서도 직접적이고 자연스럽습니다.
- source_word: תַּחֲנוּנָיו
  english_pob_choice: his pleas for mercy
  chosen_korean: 그의 간구
  alternatives_korean:
  - 그의 자비를 구하는 간청
  - 그의 탄원
  lexicon: HALOT
  rationale: 기본 의미는 간절한 청원이며, 문맥상 ‘자비’는 이미 앞의 기도와 겹치므로 짧은 ‘간구’가 적절합니다.
- source_word: וְהָאֵר פָּנֶיךָ
  english_pob_choice: let your face shine
  chosen_korean: 주의 얼굴을 ... 비추소서
  alternatives_korean:
  - 주의 얼굴이 빛나게 하소서
  - 주의 얼굴빛을 비추소서
  lexicon: HALOT
  rationale: 아론의 축복 어법을 살려 ‘얼굴을 비추다’는 직유를 유지하되, 하나님께 드리는 청원체로 ‘비추소서’를 택했습니다.
- source_word: מִקְדָּשְׁךָ הַשָּׁמֵם
  english_pob_choice: your sanctuary, which lies desolate
  chosen_korean: 주의 황폐한 성소
  alternatives_korean:
  - 주의 성소, 황폐한
  - 폐허가 된 주의 성소
  lexicon: HALOT
  rationale: ‘מקדש’는 단순한 ‘성전’보다 넓은 ‘성소’가 더 직접적이며, ‘황폐한’은 מצב을 수식하는 형용사로 압축해 살렸습니다.
- source_word: לְמַעַן אֲדֹנָי
  english_pob_choice: for the Lord’s sake
  chosen_korean: 주님의 이름을 위하여
  alternatives_korean:
  - 주님의 뜻을 위하여
  - 주님을 위하여
  lexicon: HALOT
  rationale: 히브리어의 तीस인칭 호칭을 한국어에서 바로 유지하면 어색하므로, 기도문 관용에 맞는 ‘이름을 위하여’로 의미를 드러냈습니다.
theological_decisions:
- issue: לְמַעַן אֲדֹנָי의 3인칭 호칭을 한국어로 어떻게 처리할지
  chosen_reading: 주님의 이름을 위하여
  alternative_readings:
  - 주님의 위하여
  - 주님 자신을 위하여
  rationale: 원문은 직접 호격 안에서 ‘주님’이라는 칭호를 3인칭처럼 사용합니다. 한국어에서는 이를 직역하면 매끄럽지 않으므로, 기도문에서 널리 이해되는 목적 표현으로 옮기되 자기-영광/자기-이름을 위한 호소라는 힘은 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3; divine-title self-reference in prayer
- issue: וְהָאֵר פָּנֶיךָ의 축복적 표상
  chosen_reading: 주의 얼굴을 ... 비추소서
  alternative_readings:
  - 주의 은혜를 베푸소서
  - 주님의 미소를 비추소서
  rationale: 하나님의 얼굴이 비춘다는 표상은 단순한 호의 이상의 언약적 은총을 뜻하므로, 이를 풀어써 약화시키지 않고 원문 이미지를 유지했습니다.
  doctrine_reference: Aaronic blessing imagery; covenant favor
