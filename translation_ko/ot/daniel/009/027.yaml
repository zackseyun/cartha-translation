id: DAN.9.27
reference: Daniel 9:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִגְבִּ֥יר בְּרִ֛ית לָ/רַבִּ֖ים שָׁב֣וּעַ אֶחָ֑ד וַ/חֲצִ֨י הַ/שָּׁב֜וּעַ יַשְׁבִּ֣ית זֶ֣בַח וּ/מִנְחָ֗ה וְ/עַ֨ל כְּנַ֤ף שִׁקּוּצִים֙ מְשֹׁמֵ֔ם וְ/עַד כָּלָה֙ וְ/נֶ֣חֱרָצָ֔ה תִּתַּ֖ךְ עַל שֹׁמֵֽם׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/027.yaml
  text: And he will make a firm covenant with the many for one week[a], and for half of the week he will put a stop to sacrifice and offering. And on the wing of abominations will come one who makes desolate[e][d][c][b], until the decreed end is poured out on the desolator.
  footnotes:
  - marker: a
    text: Or 'will confirm a covenant' or 'will strengthen a covenant.' The Hebrew verb means to make strong or cause to prevail.
    reason: lexical_alternative
  - marker: b
    text: Or 'sacrifice and grain offering.' The second term can refer more specifically to a grain offering.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'on the wing of abominations.' The phrase is difficult; alternatives include 'on the pinnacle of abominations' or 'upon a wing of abominations.'
    reason: alternative_reading
  - marker: d
    text: Or 'a desolator' / 'one causing desolation.'
    reason: lexical_alternative
  - marker: e
    text: Or 'will be poured out on the one made desolate' or 'on the desolate place.' The final clause is textually stable but syntactically difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 한 이레 동안 많은 사람과 굳은 언약을 맺고, 그 이레의 절반에 제사와 예물을 그치게 할 것입니다. 또 가증한 것들의 날개 위에 황폐하게 하는 자가 임할 것이며, 정해진 끝이 황폐하게 하는 자에게 쏟아질 때까지 그럴 것입니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약을 확인할 것이다’, ‘언약을 강하게 할 것이다’라는 뜻일 수 있습니다. 히브리어 동사는 언약을 굳게 하거나 우세하게 만든다는 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제사와 곡식 예물’. 둘째 용어는 더 구체적으로 소제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘가증한 것들의 날개 위에’입니다. 이 표현은 어렵기 때문에 ‘가증한 것들의 꼭대기에’ 또는 ‘가증한 것들의 날개 위에’ 등으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘황폐하게 하는 자’ / ‘황폐를 일으키는 자’입니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘황폐하게 된 자에게 쏟아질 것이다’ 혹은 ‘황폐한 곳에’입니다. 마지막 절은 본문은 비교적 안정적이지만 문법적으로는 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגְבִּיר
  english_pob_choice: will make a firm
  chosen_korean: 굳은
  alternatives_korean:
  - 확인하는
  - 강하게 하는
  - 굳게 하는
  lexicon: HALOT
  rationale: 히필형의 ‘강하게 하다/굳게 하다’ 의미를 살려, 언약을 ‘굳은 언약’으로 자연스럽게 옮겼습니다.
- source_word: בְּרִית לָרַבִּים
  english_pob_choice: covenant with the many
  chosen_korean: 많은 사람과 … 언약
  alternatives_korean:
  - 많은 사람들과의 언약
  - 무리와의 언약
  - 많은 자와의 언약
  lexicon: HALOT
  rationale: בְּרִית는 단순한 합의가 아니라 무게 있는 ‘언약’이므로 보존했고, לָרַבִּים은 관계를 드러내는 한국어로 ‘많은 사람과’로 옮겼습니다.
- source_word: יַשְׁבִּית זֶבַח וּמִנְחָה
  english_pob_choice: put a stop to sacrifice and offering
  chosen_korean: 제사와 예물을 그치게 할 것입니다
  alternatives_korean:
  - 제사와 소제를 그치게 할 것입니다
  - 제사와 곡식 예물을 그치게 할 것입니다
  - 제사와 제물을 멈추게 할 것입니다
  lexicon: HALOT
  rationale: זֶבַח은 제사, מִנְחָה는 더 구체적으로 예물/소제일 수 있으나, 본문 흐름에서 읽기 쉽도록 본문에는 ‘예물’로 두고 의미 차이는 주석으로 보존했습니다.
- source_word: וְעַל כְּנַף שִׁקּוּצִים מְשֹׁמֵם
  english_pob_choice: And on the wing of abominations will come one who makes desolate
  chosen_korean: 가증한 것들의 날개 위에 황폐하게 하는 자가 임할 것이며
  alternatives_korean:
  - 가증한 것들의 날개 위에 황폐하게 하는 자가 올 것이며
  - 가증한 것들의 날개 위에 황폐케 하는 이가 임할 것이며
  - 가증한 것들의 날개 위에 황폐시키는 자가 올 것이며
  lexicon: HALOT
  rationale: כָּנָף를 문자적으로 ‘날개’로 살려 본문의 난해함을 유지했고, מְשֹׁמֵם은 행위 주체를 드러내는 ‘황폐하게 하는 자’로 옮겼습니다.
- source_word: וְעַד כָּלָה וְנֶחֱרָצָה תִּתַּךְ
  english_pob_choice: until the decreed end is poured out
  chosen_korean: 정해진 끝이 … 쏟아질 때까지
  alternatives_korean:
  - 정해진 끝이 … 쏟아질 때까지
  - 결정된 끝이 … 부어질 때까지
  - 작정된 끝이 … 내려질 때까지
  lexicon: HALOT
  rationale: כָּלָה וְנֶחֱרָצָה는 ‘정해진 끝’으로 압축해 의미를 살렸고, תִּתַּךְ는 종말적 심판의 이미지가 있는 ‘쏟아지다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 ‘그’(he)의 선행사
  chosen_reading: 본문은 지시 대상의 정체를 밝히지 않으므로, ‘그는’으로 남겨 두고 해석을 특정하지 않았습니다.
  alternative_readings:
  - 메시아
  - 앞 절의 오는 지도자
  - 안티오코스 4세 같은 역사적 훼손자
  - 종말적 적그리스도
  rationale: 히브리어 본문 자체가 이 절에서 선행사를 명시하지 않으므로, 논쟁적 해석을 본문에 주입하지 않고 모호성을 유지했습니다.
  doctrine_reference: 본문의 해석적 긴장을 보존합니다.
- issue: 가증한 것들의 날개 위의 표현
  chosen_reading: ‘가증한 것들의 날개 위에’라는 직역을 유지했습니다.
  alternative_readings:
  - 가증한 것들의 끝자락에
  - 가증한 것들의 꼭대기에
  - 가증한 것 위에
  rationale: 이 구절은 어휘적으로 매우 난해하므로, 해결된 의미를 단정하기보다 독자가 원문의 불확실성을 인식하도록 했습니다.
  doctrine_reference: 본문의 해석적 긴장을 보존합니다.
