  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י אֱלֹהֵ֗י/נוּ אֲשֶׁר֩ הוֹצֵ֨אתָ אֶֽת עַמְּ/ךָ֜ מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ בְּ/יָ֣ד חֲזָקָ֔ה וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כַּ/יּ֣וֹם הַ/זֶּ֑ה חָטָ֖אנוּ רָשָֽׁעְנוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
  footnotes:
  - marker: a
    text: Or, 'with a mighty hand.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'made yourself a name,' that is, gained renown.
    reason: lexical_alternative
  - marker: c
    text: Or, 'to this day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 주 하나님, 곧 주의 백성을 강한 손으로 이집트 땅에서 이끌어 내시고 오늘날까지 스스로 이름을 내신 분이여—우리가 죄를 지었고, 악을 행했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강한 손으로’는 ‘능한 손으로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘스스로 이름을 내신’은 곧 명성을 얻으셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘오늘날까지’는 ‘이날까지’ 또는 ‘이처럼 오늘에 이르기까지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  english_pob_choice: O Lord our God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 우리 주 하나님
  - 주 우리의 하나님
  lexicon: HALOT
  rationale: 기도문의 호칭으로 자연스럽고, אֲדֹנָי의 주권적 호칭을 살리면서도 표준어 합쇼체에 맞게 간결하게 옮겼습니다.
- source_word: הוֹצֵאתָ אֶת עַמְּךָ מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: who brought your people out of the land of Egypt
  chosen_korean: 주의 백성을 강한 손으로 이집트 땅에서 이끌어 내시고
  alternatives_korean:
  - 주의 백성을 이집트 땅에서 끌어내시고
  - 주의 백성을 이집트에서 인도하여 내시고
  lexicon: HALOT
  rationale: 출애굽 공식어를 살리되 한국어에서는 ‘이끌어 내시고’가 가장 자연스럽고, ‘이집트 땅’으로 원문의 지리 표현도 유지했습니다.
- source_word: בְּיָד חֲזָקָה
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 능한 손으로
  - 힘센 손으로
  - 큰 손으로
  lexicon: HALOT
  rationale: 직역에 가깝게 하면서도 한국어 관용에 맞는 표현으로, POB의 ‘strong hand’ 선택을 그대로 반영했습니다.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  english_pob_choice: made for yourself a name
  chosen_korean: 스스로 이름을 내신
  alternatives_korean:
  - 스스로 이름을 만드신
  - 자기 이름을 떨치신
  - 명성을 얻으신
  lexicon: HALOT
  rationale: ‘이름을 내다’가 한국어에서 명성 획득의 관용을 잘 살리므로, 원문의 명성/명예 형식을 보존했습니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as it is this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이날까지
  - 이처럼 오늘에 이르기까지
  lexicon: HALOT
  rationale: 문맥상 현재까지 지속되는 공개적 현실을 가리키므로, 한국어에서는 ‘오늘날까지’가 가장 자연스럽게 시간의 지속을 전달합니다.
- source_word: חָטָאנוּ רָשָׁעְנוּ
  english_pob_choice: we have sinned; we have acted wickedly
  chosen_korean: 우리가 죄를 지었고, 악을 행했습니다
  alternatives_korean:
  - 우리가 죄를 지었고, 악하게 행했습니다
  - 우리가 죄를 범했고, 악을 행했습니다
  lexicon: HALOT
  rationale: 두 동사를 구별해 죄책 고백의 반복성과 강도를 살리되, 현대 한국어에서 자연스럽고 공식적인 고백체로 옮겼습니다.
theological_decisions:
- issue: 출애굽 회상과 하나님의 이름/명성 표현
  chosen_reading: 출애굽의 역사와 하나님이 스스로 이름을 내신다는 표현을 비교적 직역적으로 유지했습니다.
  alternative_readings:
  - ‘능력으로 백성을 구해 내시고 명성을 얻으신’처럼 더 풀어 쓰기
  rationale: 이 절은 언약사와 하나님의 공적 명성을 함께 상기시키므로, 의미를 완화하지 않고 원문의 수사와 신학적 무게를 보존하는 쪽이 적절합니다.
  doctrine_reference: 원어 우선, 출애굽 신학, 하나님의 이름/명성의 공적 표지
