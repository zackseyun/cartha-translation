base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
  footnotes:
  - marker: a
    text: Or, 'with a mighty hand.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'made yourself a name,' that is, gained renown.
    reason: lexical_alternative
  - marker: c
    text: Or, 'to this day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 주 우리 하나님, 주의 백성을 강한 손으로[a] 이집트 땅에서 이끌어 내시고 오늘날까지[c] 이름을 떨치신[b] 분이시여—우리가 죄를 지었고 악을 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강한 손으로’는 ‘능한 손으로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이름을 떨치신’은 자신을 위해 명성을 얻으셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘이 날과 같이’이며, ‘오늘날에도 그러하듯’으로도 옮길 수 있습니다.
    reason: lexical_alternative
