theological_decisions:
- issue: 출애굽 회상과 하나님의 이름/명성 표현
  chosen_reading: 출애굽의 역사와 하나님이 스스로 이름을 내신다는 표현을 비교적 직역적으로 유지했습니다.
  alternative_readings:
  - ‘능력으로 백성을 구해 내시고 명성을 얻으신’처럼 더 풀어 쓰기
  rationale: 이 절은 언약사와 하나님의 공적 명성을 함께 상기시키므로, 의미를 완화하지 않고 원문의 수사와 신학적 무게를 보존하는 쪽이 적절합니다.
  doctrine_reference: 원어 우선, 출애굽 신학, 하나님의 이름/명성의 공적 표지
