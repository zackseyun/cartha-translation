  yaml_path: translation/ot/daniel/009/009.yaml
  text: To the Lord our God belong compassion and forgiveness[a], for we have rebelled against him.
  footnotes:
  - marker: a
    text: Or 'mercies and pardons.' The Hebrew uses plural forms for both nouns, which can express abundance or function as abstract nouns.
