translation:
  language: ko
  text: 우리 하나님 주님께는 긍휼과 용서가 있습니다. 우리가 그분께 반역하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 명사를 복수형으로 사용합니다. 이는 풍성함을 나타내거나 추상명사처럼 기능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנָי אֱלֹהֵינוּ
  english_pob_choice: To the Lord our God belong
  chosen_korean: 우리 하나님 주님께는
  alternatives_korean:
  - 주님 우리 하나님께는
  - 우리 주 하나님께는
  lexicon: HALOT
  rationale: 전치사 ל의 소속/귀속 의미를 한국어 조사 ‘께는’으로 살려, 뒤의 명사들이 주님께 속해 있음을 자연스럽게 드러냈습니다.
- source_word: הָרַחֲמִים
  english_pob_choice: compassion
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 연민
  - 긍휼과 자비
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 여기서는 하나님의 자비로운 성품을 가리키는 추상적 용법이므로, 한국어 성서 문맥에서 공인된 ‘긍휼’로 옮겼습니다.
- source_word: וְהַסְּלִחוֹת
  english_pob_choice: forgiveness
  chosen_korean: 용서
  alternatives_korean:
  - 사유
  - 용서들
  - 용서와 사유
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 추상명사 단수로 자연스럽게 표현하는 것이 적절하며, ‘용서’가 본문의 회개 기도 맥락을 잘 드러냅니다.
- source_word: מָרַדְנוּ בּוֹ
  english_pob_choice: we have rebelled against him
  chosen_korean: 우리가 그분께 반역하였기 때문입니다
  alternatives_korean:
  - 우리가 그분을 거슬러 반역하였기 때문입니다
  - 우리가 그분을 거역하였기 때문입니다
  lexicon: HALOT
  rationale: מרד는 일반적 ‘죄’가 아니라 권위에 대한 ‘반역’이므로 이를 약화시키지 않았고, בּוֹ는 한국어 관용에 따라 ‘그분께’로 반영했습니다.
theological_decisions:
- issue: 하나님에 대한 회개의 진술에서 주체-대상 관계 표현
  chosen_reading: ‘우리 하나님 주님께는 … 있습니다’로 소속을 먼저 말하고, 이어서 ‘우리가 그분께 반역하였습니다’로 죄의 방향성을 분명히 했습니다.
  alternative_readings:
  - ‘주님 우리 하나님께는 … 있습니다’
  - ‘우리 하나님께는 … 있습니다’
  rationale: 히브리어 무동사 구문이 강조하는 것은 하나님의 성품이 주님께 속해 있다는 점이므로, 한국어에서도 소속성을 앞세워 기도문의 논리를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: divine mercy in confession/prayer; source-text priority'
