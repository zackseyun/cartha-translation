translation:
  language: ko
  text: 우리 하나님이신 주님께는 자비와 용서가 있습니다.[a] 우리가 주님께 반역하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘자비’와 ‘용서’를 모두 복수형으로 사용합니다. 이 복수형은 풍성함을 나타내거나 추상명사처럼 기능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנָי אֱלֹהֵינוּ
  english_pob_choice: To the Lord our God belong
  chosen_korean: 우리 하나님 주님께는
  alternatives_korean:
  - 주님 우리 하나님께는
  - 우리 주 하나님께는
  lexicon: HALOT
  rationale: 전치사 ל의 소속/귀속 의미를 한국어 조사 ‘께는’으로 살려, 뒤의 명사들이 주님께 속해 있음을 자연스럽게 드러냈습니다.
- source_word: הָרַחֲמִים
  english_pob_choice: compassion
  chosen_korean: 긍휼
  alternatives_korean:
