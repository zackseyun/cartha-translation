id: DAN.9.25
reference: Daniel 9:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תֵדַ֨ע וְ/תַשְׂכֵּ֜ל מִן מֹצָ֣א דָבָ֗ר לְ/הָשִׁיב֙ וְ/לִ/בְנ֤וֹת יְרֽוּשָׁלִַ֨ם֙ עַד מָשִׁ֣יחַ נָגִ֔יד שָׁבֻעִ֖ים שִׁבְעָ֑ה וְ/שָׁבֻעִ֞ים שִׁשִּׁ֣ים וּ/שְׁנַ֗יִם תָּשׁוּב֙ וְ/נִבְנְתָה֙ רְח֣וֹב וְ/חָר֔וּץ וּ/בְ/צ֖וֹק הָ/עִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/025.yaml
  text: 'So know and understand: from the issuing of the word to restore and rebuild Jerusalem until an anointed one[a], a prince, there will be seven weeks, and for sixty-two weeks it will be restored and rebuilt, with plaza and moat[c][b], but in troubled times.'
  footnotes:
  - marker: a
    text: Or 'until Messiah, a ruler' or 'until Messiah the Prince.' The Hebrew reads 'anointed one, ruler/prince.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'seven weeks' may also be rendered 'seven sevens.' Likewise 'sixty-two weeks' may be rendered 'sixty-two sevens.'
    reason: lexical_alternative
  - marker: c
    text: Or 'square and trench.' The Hebrew term rendered 'moat' is uncertain and may denote a trench or defensive ditch.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너는 알아야 하고 깨달아야 합니다. 예루살렘을 회복하고 다시 세우라는 말이 나가는 때부터 기름부음 받은 이[a], 곧 한 통치자까지는 일곱 주[b]가 있고, 다시 예순두 주 동안 그것이 회복되고 다시 세워질 것이며, 광장과 해자[c]가 있으나 환난의 때에 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메시아, 곧 한 통치자까지’로도 옮길 수 있습니다. 히브리어는 ‘기름부음 받은 이, 통치자/왕자’를 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘일곱 주’는 ‘일곱 칠’로도 옮길 수 있습니다. 또한 ‘예순두 주’도 ‘예순두 칠’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘광장과 도랑’으로도 옮길 수 있습니다. 여기서 ‘해자’로 옮긴 히브리어는 뜻이 분명하지 않으며, 도랑이나 방어용 구획을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתֵדַע וְתַשְׂכֵּל
  english_pob_choice: know and understand
  chosen_korean: 알아야 하고 깨달아야 합니다
  alternatives_korean:
  - 알고 이해해야 합니다
  - 알아야 하고 이해해야 합니다
  lexicon: HALOT
  rationale: ידע와 שכל의 인지·분별 촉구를 살리면서, 합쇼체에서 자연스럽게 이어지도록 ‘알다/깨닫다’를 썼습니다.
- source_word: מִן מֹצָא דָבָר
  english_pob_choice: from the issuing of the word
  chosen_korean: 말이 나가는 때부터
  alternatives_korean:
  - 말의 나감부터
  - 말씀이 나가는 때부터
  - 명령이 나가는 때부터
  lexicon: HALOT
  rationale: מוצא의 ‘나감/발출’ 이미지를 살리되, ‘말이 나가는 때’로 자연스럽고 축약 없이 옮겼습니다. ‘명령’은 본문이 직접 밝히지 않으므로 본문에는 두지 않았습니다.
- source_word: עַד מָשִׁיחַ נָגִיד
  english_pob_choice: until an anointed one, a ruler
  chosen_korean: 기름부음 받은 이, 곧 한 통치자까지
  alternatives_korean:
  - 메시아, 곧 한 통치자까지
  - 기름부음 받은 자, 곧 한 왕자까지
  lexicon: HALOT
  rationale: מָשִׁיחַ의 기본 의미를 따라 ‘기름부음 받은 이’로 두고, נָגִיד는 현대 한국어에서 위계가 덜 오해되는 ‘통치자’로 옮겼습니다. ‘메시아’는 해석을 앞당길 수 있어 본문에서는 유보했습니다.
- source_word: שָׁבֻעִים
  english_pob_choice: weeks
  chosen_korean: 주
  alternatives_korean:
  - 주간
  - 칠
  - 세븐(주석 용어)
  lexicon: HALOT
  rationale: 다니엘 9장의 관용구를 드러내기 위해 ‘주’로 옮겨, 단순한 달력상의 ‘주간’보다 칠 단위의 개념을 남겼습니다. POB의 ‘weeks/sevens’ 긴장을 한국어에서도 보존했습니다.
- source_word: רְחוֹב וְחָרוּץ
  english_pob_choice: plaza and moat
  chosen_korean: 광장과 해자
  alternatives_korean:
  - 광장과 도랑
  - 거리와 해자
  - 광장과 참호
  lexicon: HALOT
  rationale: רְחוֹב는 공개된 도시 공간, וְחָרוּץ는 방어용 도랑/구획의 불확실성이 있어, 한국어에서는 가장 중립적이면서도 도시 재건 이미지를 살리는 ‘광장과 해자’를 택했습니다.
theological_decisions:
- issue: מָשִׁיחַ를 본문에서 ‘메시아’로 고정할지 여부
  chosen_reading: 본문은 ‘기름부음 받은 이’로 두고, 메시아 해석은 주석(a)에서 열어 둡니다.
  alternative_readings:
  - 메시아
  - 메시아, 한 통치자
  rationale: 히브리어 어휘 자체는 일반적 ‘기름부음 받은 이’를 뜻하므로, 본문에서 특정 종말론적 인물로 조기 확정하지 않으면서도 전통적 해석 가능성을 각주로 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3; contested messianic rendering principle
- issue: שָׁבֻעִים의 시간 단위를 한국어 본문에서 어떻게 보존할지
  chosen_reading: ‘주’로 번역하고, 대안인 ‘칠/세븐’ 의미는 각주로 남깁니다.
  alternative_readings:
  - 칠
  - 일곱들
  - 칠주
  rationale: 문맥상 기간 단위를 단순한 ‘주간’으로 이해시키기보다, 다니엘서 특유의 예언적 단위인 ‘일곱’의 긴장을 유지하는 것이 본문의 해석 여지를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §3
