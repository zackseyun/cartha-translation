id: DAN.9.3
reference: Daniel 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶתְּנָ֣/ה אֶת פָּנַ֗/י אֶל אֲדֹנָ/י֙ הָֽ/אֱלֹהִ֔ים לְ/בַקֵּ֥שׁ תְּפִלָּ֖ה וְ/תַחֲנוּנִ֑ים בְּ/צ֖וֹם וְ/שַׂ֥ק וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/003.yaml
  text: So I turned my face to the Lord God[a], to seek prayer and pleas for mercy, with fasting, sackcloth[b], and ashes.
  footnotes:
  - marker: a
    text: Or 'I set my face toward the Lord God.' The Hebrew idiom is more literally 'I gave/set my face to.'
    reason: lexical_alternative
  - marker: b
    text: Or 'supplications' for 'pleas for mercy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 내 얼굴을 주 하나님께 돌려, 금식과 굵은 베옷과 재를 쓰고 기도와 간구를 구하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 따라 ‘내 얼굴을 ... 돌려’로 옮겼습니다. 직역하면 ‘내 얼굴을 ...에게 주다/두다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘굵은 베옷’은 애통과 회개의 표지인 שַׂק을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת פָּנַי אֶל
  english_pob_choice: I turned my face to
  chosen_korean: 내 얼굴을 ... 돌려
  alternatives_korean:
  - 내 얼굴을 ... 두어
  - 내 얼굴을 ... 향하여
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘얼굴을 ...에게 두다/주다’의 방향성을 살리면서, 한국어에서는 ‘돌리다’가 자연스럽고 결심의 전환을 잘 드러냅니다.
- source_word: אֲדֹנָי הָאֱלֹהִים
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주, 하나님
  - 주 여호와 하나님
  lexicon: HALOT
  rationale: 본문은 YHWH가 아니라 אֲדֹנָי와 הָאֱלֹהִים의 결합이므로, 전통적 ‘여호와’가 아니라 ‘주 하나님’으로 옮겨 두 호칭을 함께 살렸습니다.
- source_word: לְבַקֵּשׁ תְּפִלָּה וְתַחֲנוּנִים
  english_pob_choice: to seek prayer and pleas for mercy
  chosen_korean: 기도와 간구를 구하여
  alternatives_korean:
  - 기도와 긍휼의 간구를 구하여
  - 기도와 자비의 간청을 구하여
  lexicon: HALOT
  rationale: לְבַקֵּשׁ는 ‘구하다’로, תְּפִלָּה는 일반적 ‘기도’, וְתַחֲנוּנִים은 겸손하고 긴급한 ‘간구’로 옮겨 두 용어의 중복과 차이를 모두 보존했습니다.
- source_word: בְּצוֹם וְשַׂק וָאֵפֶר
  english_pob_choice: with fasting, sackcloth, and ashes
  chosen_korean: 금식과 굵은 베옷과 재를 쓰고
  alternatives_korean:
  - 금식과 베옷과 재로
  - 금식하며 굵은 베옷과 재를 쓰고
  lexicon: HALOT
  rationale: בְּ는 동반 상황을 나타내므로 한국어에서는 ‘...하고’ 구조로 자연스럽게 살렸고, שַׂק은 장례·통회 맥락의 관용적 표현인 ‘굵은 베옷’으로 옮겼습니다.
theological_decisions:
- issue: 기도의 방향성과 예레미야-다니엘 전통의 참회 표현
  chosen_reading: ‘내 얼굴을 ... 돌려’와 ‘금식과 굵은 베옷과 재’는 회개와 애도의 외적 표지를 드러내는 직역적 표현으로 유지했습니다.
  alternative_readings:
  - ‘마음을 기울여’
  - ‘애도하며’
  rationale: 본문은 단순한 내면 태도보다 몸의 방향 전환과 상징 행위를 함께 보여 주므로, 이를 완화하지 않고 보존하는 것이 문맥의 강도를 살립니다.
  doctrine_reference: 다니엘 9장의 회개·중보 기도 문맥
