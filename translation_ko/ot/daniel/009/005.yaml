base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/005.yaml
  text: We have sinned and done wrong and acted wickedly and rebelled[b][a], turning aside from your commandments and your judgments.
  footnotes:
  - marker: a
    text: Or 'committed iniquity' for 'done wrong.' The Hebrew verb carries the sense of acting crookedly or perversely.
    reason: lexical_alternative
  - marker: b
    text: Or 'your ordinances' for 'your judgments.' The Hebrew term can refer to legal decisions, judgments, or prescribed ordinances.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 죄를 지었고, 잘못을 저질렀고, 악하게 행했고, 반역했으며, 당신의 계명들과 당신의 법도들에서 돌아섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָטָאנוּ
  english_pob_choice: We have sinned
  chosen_korean: 우리는 죄를 지었고
  alternatives_korean:
  - 우리는 죄를 지었습니다
  - 우리는 죄를 범했고
  lexicon: HALOT
  rationale: 죄를 짓다를 써서 회개의 고백으로서의 직접성과 현재 완료적 회상성을 살렸습니다.
- source_word: וְעָוִינוּ
  english_pob_choice: and done wrong
  chosen_korean: 잘못을 저질렀고
  alternatives_korean:
  - 불의를 행했고
  - 죄악을 저질렀고
  - 죄를 범했고
  lexicon: HALOT
  rationale: עוה의 ‘비뚤어짐/그릇됨’ 뉘앙스를 한국어의 ‘잘못을 저지르다’로 옮겨, 앞의 ‘죄를 지었다’와 구별되는 도덕적 어긋남을 유지했습니다.
- source_word: וְהִרְשַׁעְנוּ
  english_pob_choice: and acted wickedly
  chosen_korean: 악하게 행했고
  alternatives_korean:
  - 악을 행했고
  - 사악하게 행동했고
  lexicon: HALOT
  rationale: רשע의 행위성을 살리면서도 현대 한국어에서 지나치게 딱딱한 표현을 피하기 위해 ‘악하게 행하다’로 옮겼습니다.
- source_word: וּמָרָדְנוּ
  english_pob_choice: and rebelled
  chosen_korean: 반역했으며
  alternatives_korean:
  - 반항했으며
  - 반란을 일으켰으며
  - 거역했으며
  lexicon: HALOT
  rationale: 언약적 불복종의 강도를 드러내기 위해 단순한 반항보다 강한 ‘반역하다’를 택했습니다.
- source_word: מִמִּצְוֺתֶיךָ
  english_pob_choice: from your commandments
  chosen_korean: 당신의 계명들
  alternatives_korean:
  - 당신의 명령들
  - 당신의 명령
  lexicon: HALOT
  rationale: מצוה의 기본 의미를 따라 ‘계명’으로 옮겼고, 복수형을 유지해 원문의 다중성을 살렸습니다.
- source_word: וּמִמִּשְׁפָּטֶיךָ
  english_pob_choice: and your judgments
  chosen_korean: 당신의 법도들
  alternatives_korean:
  - 당신의 판단들
  - 당신의 심판들
  - 당신의 규례들
  lexicon: HALOT
  rationale: משפט는 법적 판결뿐 아니라 정해진 규범을 가리킬 수 있어, 문맥상 ‘법도들’로 옮겨 계명들과 짝을 이루는 규범성을 살렸습니다.
theological_decisions:
- issue: 연속되는 죄 고백 동사의 누적 효과를 어떻게 보존할지
  chosen_reading: ‘죄를 지었고, 잘못을 저질렀고, 악하게 행했고, 반역했으며…’처럼 각각을 분리해 옮겼습니다.
  alternative_readings:
  - ‘죄를 지었고 악을 행했고 반역했으며…’로 압축
  - ‘죄를 범하고 불의를 행하고 사악하게 굴고…’로 평탄화
  rationale: 히브리어는 유사어를 포개어 죄책의 중첩을 강조하므로, 한국어도 각 동사의 층위를 유지해 고백의 무게를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: מִשְׁפָּטֶיךָ의 번역을 ‘법도들’로 할지 ‘판단들/심판들’로 할지
  chosen_reading: ‘당신의 법도들’
  alternative_readings:
  - ‘당신의 판단들’
  - ‘당신의 심판들’
  - ‘당신의 규례들’
  rationale: 문맥에서 계명과 평행을 이루는 언약 규범을 가리키므로, 한국어에서는 교회적 관용어인 ‘법도’를 사용해 법적·규범적 성격을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
