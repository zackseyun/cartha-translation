  verdict: revise
  source_fidelity: 죄를 짓다, 잘못을 저지르다, 악을 행하다, 반역하다, 그리고 계명과 משפטים에서 떠나다라는 연쇄는 원문의 다섯 고백 표현과 그 누적을 대체로 충실히 반영합니다. 다만 하나님께 드리는 기도에서 ‘당신’은 현대 표준 한국어에서 자연스러운 호칭이 아니며, ‘계명들과 법도들’의 기계적인 복수 표지는 한국어의 집합 명사 용법에 맞지 않습니다.
