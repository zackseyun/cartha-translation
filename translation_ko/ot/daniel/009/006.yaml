id: DAN.9.6
reference: Daniel 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֤א שָׁמַ֨עְנוּ֙ אֶל עֲבָדֶ֣י/ךָ הַ/נְּבִיאִ֔ים אֲשֶׁ֤ר דִּבְּרוּ֙ בְּ/שִׁמְ/ךָ֔ אֶל מְלָכֵ֥י/נוּ שָׂרֵ֖י/נוּ וַ/אֲבֹתֵ֑י/נוּ וְ/אֶ֖ל כָּל עַ֥ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/006.yaml
  text: We have not listened to your servants the prophets[a], who spoke in your name to our kings, our officials, our fathers[b], and to all the people of the land.
  footnotes:
  - marker: a
    text: Or 'have not obeyed.' The Hebrew verb can carry the sense of heeding responsively, not merely hearing.
    reason: lexical_alternative
  - marker: b
    text: Or 'our ancestors.' Literally 'our fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 주님의 종들인 예언자들[a]에게 귀를 기울이지 않았습니다. 그들은 주님의 이름으로 우리의 왕들, 우리의 관리들, 우리의 조상들[b], 그리고 이 땅의 모든 백성에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘순종하지 않았습니다.’ 히브리어 동사는 단순히 듣는 것을 넘어 응답적으로 따르는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 선조들.’ 문자적으로는 ‘우리의 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  english_pob_choice: have not listened
  chosen_korean: 귀를 기울이지 않았습니다
  alternatives_korean:
  - 듣지 않았습니다
  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 ‘듣고 응답하다’의 뜻까지 가질 수 있어, 한국어에서는 ‘귀를 기울이다’가 듣지 않음과 외면한 태도를 함께 드러냅니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주님의 종들
  alternatives_korean:
  - 주님의 하인들
  - 주님의 노예들
  lexicon: HALOT
  rationale: 예언자들을 가리키는 경칭적 표현이므로 ‘종들’이 가장 자연스럽고, 여기서는 종속의 법적 뉘앙스를 전면화하지 않습니다.
- source_word: הַנְּבִיאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들
  alternatives_korean:
  - 선지자들
  - 예언자들
  lexicon: HALOT
  rationale: 히브리어 נביאים의 현대 한국어 대응으로 ‘예언자들’이 직역에 가깝고, 본문의 소명과 발화 기능을 잘 드러냅니다.
- source_word: אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리의 조상들
  alternatives_korean:
  - 우리의 아버지들
  - 우리의 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘우리의 아버지들’이지만, 문맥상 이전 세대를 가리키므로 한국어에서는 자연스러운 ‘조상들’로 옮기되 의미를 보존했습니다.
theological_decisions:
- issue: שָׁמַעְנוּ를 ‘순종하지 않았다’로 명시할지 여부
  chosen_reading: ‘귀를 기울이지 않았습니다’로 옮겨, 불순종의 함의는 문맥에서 드러나게 했습니다.
  alternative_readings:
  - 순종하지 않았습니다
  - 듣지 않았습니다
  rationale: 이 고백은 언약적 불순종을 포함하지만, 동사의 기본 의미를 너무 좁히지 않도록 청취-응답의 폭을 남겨 두는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
