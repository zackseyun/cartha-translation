  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 기도·고백 문맥에 알맞은 격식이 유지됩니다. ‘예언자들에게 귀를 기울이지 않았습니다’와 뒤의 ‘그들은 …에게 말했습니다’의 지시 관계도 명확합니다.
  terminology: ‘주님의 종들’, ‘예언자들’, ‘관리들’은 문맥과 현대적 용례에 적합합니다. אֲבֹתֵינוּ의 문맥상 지시 대상은 ‘조상들’로 자연스럽게 전달되며, 각주가 문자적 표현인 ‘아버지들’을 밝혀 원문의 어휘적 형태도 확인할 수 있게 합니다. 각주 표지는 적절한 단어 뒤에 정확히 배치되어 있습니다.
