base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
  footnotes:
  - marker: a
    text: Hebrew literally, “shame of face,” an idiom for public disgrace or humiliation.
    reason: lexical_alternative
  - marker: b
    text: Or “and to our ancestors” for “our fathers.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 얼굴의 수치[a]는 우리와 우리 왕들과 우리 고관들과 우리 조상들[b]에게 돌아갑니다. 우리가 주께 죄를 지었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 “얼굴의 수치”이며, 공적으로 드러난 수치나 굴욕을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 문자적으로 “우리 아버지들”이며, 여기서는 앞선 세대의 조상들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
