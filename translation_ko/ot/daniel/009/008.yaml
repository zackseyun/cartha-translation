- source_word: וְלַאֲבֹתֵינוּ
  english_pob_choice: and to our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  - 우리 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 문맥상 집단의 선조를 가리키므로 한국어에서는 성중립적이면서도 역사적 집단을 분명히 하는 ‘조상들’로 옮겼습니다.
