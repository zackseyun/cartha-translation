id: DAN.9.8
reference: Daniel 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֗ה לָ֚/נוּ בֹּ֣שֶׁת הַ/פָּנִ֔ים לִ/מְלָכֵ֥י/נוּ לְ/שָׂרֵ֖י/נוּ וְ/לַ/אֲבֹתֵ֑י/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
  footnotes:
  - marker: a
    text: Hebrew literally, “shame of face,” an idiom for public disgrace or humiliation.
    reason: lexical_alternative
  - marker: b
    text: Or “and to our ancestors” for “our fathers.”
    reason: lexical_alternative
translation:
  language: ko
  text: 오 주님, 부끄러움이 우리에게 있습니다 — 곧 우리 왕들과 우리 지도자들과 우리 조상들에게 있습니다. 이는 우리가 주께 죄를 지었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “얼굴의 부끄러움”이라는 관용구로, 공적 수치나 굴욕을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “우리 조상들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: DOCTRINE.md / project default
  rationale: 직접 호칭이므로 한국어 기도문에서 자연스러운 경칭인 ‘주님’으로 옮겼습니다. 본문은 야훼의 호격이지만, 이 절에서는 한국어 독자의 즉시성을 위해 주님을 선택했습니다.
- source_word: בֹּשֶׁת הַפָּנִים
  english_pob_choice: shame of face
  chosen_korean: 부끄러움
  alternatives_korean:
  - 얼굴의 부끄러움
  - 수치
  - 낯부끄러움
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴의 부끄러움’이지만, 한국어에서 같은 관용의 공적 수치 의미를 가장 자연스럽게 전달하는 표현은 ‘부끄러움’입니다. 다만 구체적 관용구는 본문에서 유지하기보다 문맥상 의미를 살렸습니다.
- source_word: לְשָׂרֵינוּ
  english_pob_choice: to our princes
  chosen_korean: 우리 지도자들
  alternatives_korean:
  - 우리 방백들
  - 우리 군왕들
  - 우리 통치자들
  lexicon: HALOT
  rationale: שָׂרִים의 정치적·행정적 의미를 살리되, 한국어에서 ‘princes’의 왕실적 뉘앙스보다 본문 문맥에 맞는 총괄적 호칭인 ‘지도자들’을 택했습니다.
- source_word: וְלַאֲבֹתֵינוּ
  english_pob_choice: and to our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  - 우리 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 문맥상 집단의 선조를 가리키므로 한국어에서는 성중립적이면서도 역사적 집단을 분명히 하는 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 호칭과 한국어 경칭 표현
  chosen_reading: 오 주님
  alternative_readings:
  - 오 야훼
  - 오 주
  rationale: 이 절은 회개의 직접 호소이므로, 예배적 한국어에서 자연스러운 호격 ‘오 주님’을 사용했습니다. 본문 의미를 훼손하지 않으면서도 기도문의 직접성을 살립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
