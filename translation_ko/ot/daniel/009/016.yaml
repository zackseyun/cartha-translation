  verdict: revise
  source_fidelity: 히브리어의 간청법(נָא), 하나님의 분노가 예루살렘으로부터 돌이키기를 바라는 뜻, 그리고 죄와 조상들의 죄악으로 인한 치욕의 상태를 전반적으로 잘 반영했습니다. 다만 ‘도시 예루살렘’은 원문의 עיר를 지나치게 행정적 현대어로 만들며, ‘…에서 돌아가게 하십시오’는 한국어에서 방향과 의미가 다소 불분명합니다.
  naturalness: ‘원하건대’와 ‘하십시오’의 결합은 현대 표준어 합쇼체 기도문으로 다소 어색합니다. ‘부디 … 거두어 주십시오’가 자연스럽고, 하나님께 드리는 간구의 높임말도 유지합니다. ‘성 예루살렘’은 성경 문체에서도 자연스럽습니다.
  terminology: ‘주님’, ‘의로운 행위’, ‘분노와 진노’, ‘조상들의 죄악’, ‘수치’는 적절합니다. ‘조상들’은 여기서 선대 전체를 가리키는 히브리어 ‘아버지들’의 자연스러운 한국어 대응입니다. 다만 각주 a의 첫 대안은 본문 표현과 사실상 중복되므로 의미 있는 대안으로 정리했습니다.
