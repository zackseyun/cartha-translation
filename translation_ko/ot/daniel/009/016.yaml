    rationale: 본문의 ‘의로운 행위’와 각주의 ‘의로운 행위들’은 한국어에서 실질적인 번역 대안이 되기 어렵습니다. 원문의 복수형과 의미 범위를 설명하면서 ‘의로움’과 ‘공의로운 행위’를 대안으로 제시하는 편이 낫습니다.
