id: DAN.9.16
reference: Daniel 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲדֹנָ֗/י כְּ/כָל צִדְקֹתֶ֨/ךָ֙ יָֽשָׁב נָ֤א אַפְּ/ךָ֙ וַ/חֲמָ֣תְ/ךָ֔ מֵ/עִֽירְ/ךָ֥ יְרוּשָׁלִַ֖ם הַר קָדְשֶׁ֑/ךָ כִּ֤י בַ/חֲטָאֵ֨י/נוּ֙ וּ/בַ/עֲוֺנ֣וֹת אֲבֹתֵ֔י/נוּ יְרוּשָׁלִַ֧ם וְ/עַמְּ/ךָ֛ לְ/חֶרְפָּ֖ה לְ/כָל סְבִיבֹתֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/016.yaml
  text: Lord[a], according to all your righteous acts, please let your anger and your wrath turn away from your city Jerusalem, your holy mountain; because through our sins and the iniquities of our fathers[b], Jerusalem and your people have become a reproach to all those around us.
  footnotes:
  - marker: a
    text: Or 'your acts of justice' or 'your righteousness.' The Hebrew is plural, likely pointing to God's righteous deeds rather than only an abstract attribute.
    reason: lexical_alternative
  - marker: b
    text: '''Our fathers'' refers to the prior generations/ancestors of the people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님[a], 주님의 모든 의로운 행위에 따라, 부디 주님의 분노와 진노를 주님의 성 예루살렘, 곧 주님의 거룩한 산에서 거두어 주십시오. 우리의 죄들과 우리 조상들의 죄악 때문에 예루살렘과 주님의 백성은 우리를 둘러싼 모든 이에게 수치가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 모든 의로움’ 또는 ‘주님의 모든 공의로운 행위’로 옮길 수 있습니다. 히브리어는 복수형으로, 추상적 속성만이 아니라 하나님의 의로운 행위들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인이시여
  - 오 주님
  lexicon: HALOT
  rationale: 하나님께 직접 드리는 호격으로는 현대 한국어에서 가장 자연스럽고 경건한 표현인 ‘주님’을 사용했습니다.
- source_word: כְּכָל צִדְקֹתֶיךָ
  english_pob_choice: according to all your righteous acts
  chosen_korean: 주님의 모든 의로운 행위에 따라
  alternatives_korean:
  - 주님의 모든 의로움에 따라
  - 주님의 모든 의로운 일에 따라
  lexicon: HALOT
  rationale: 복수형 צִדְקֹתֶיךָ가 추상적 속성보다 구체적 행위를 가리키는 점을 살려 ‘의로운 행위’로 옮겼습니다.
- source_word: יָשָׁב נָא אַפְּךָ וַחֲמָתְךָ
  english_pob_choice: please let your anger and your wrath turn away
  chosen_korean: 원하건대 주님의 분노와 진노가 ... 돌아가게 하십시오
  alternatives_korean:
  - 부디 주님의 분노와 진노를 거두어 주십시오
  - 주님의 분노와 진노가 물러가게 하십시오
  lexicon: HALOT
  rationale: שׁוב의 방향성을 살려 ‘돌아가게 하다’로 옮기고, נָא의 간청을 ‘원하건대’로 표현했습니다.
- source_word: לְחֶרְפָּה
  english_pob_choice: have become a reproach
  chosen_korean: 수치가 되었습니다
  alternatives_korean:
  - 조롱거리가 되었습니다
  - 욕됨이 되었습니다
  lexicon: HALOT
  rationale: 수치/치욕의 결과 상태를 자연스럽게 드러내면서, 공동체가 주변 민족 앞에서 겪는 부끄러움을 담았습니다.
theological_decisions:
- issue: ‘fathers’의 처리와 공동체적 죄책 고백
  chosen_reading: 우리 조상들의 죄악
  alternative_readings:
  - 우리 아버지들의 죄악
  - 우리 선조들의 죄악
  rationale: 본문의 ‘아버지들’은 앞선 세대를 가리키는 표현이므로, 현대 한국어에서는 의미를 분명히 하되 남성계보로만 좁혀 읽히지 않도록 ‘조상들’로 옮겼습니다.
  doctrine_reference: Translation philosophy §4
- issue: 예루살렘과 백성이 ‘수치’가 된 상태의 표현
  chosen_reading: 예루살렘과 주님의 백성은 ... 수치가 되었습니다
  alternative_readings:
  - 예루살렘과 주님의 백성은 ... 수치입니다
  - 예루살렘과 주님의 백성은 ... 치욕이 되었습니다
  rationale: לְחֶרְפָּה의 결과 상태를 한국어 현재 상태보다 완료된 결과로 드러내는 것이 문맥에 더 잘 맞아 ‘되었습니다’를 택했습니다.
  doctrine_reference: Translation philosophy §3
