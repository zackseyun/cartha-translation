  naturalness: ‘그 위에 지나가게 하십시오’는 직역적이면서도 다소 어색합니다. 시간의 경과가 당사자에게 미친다는 뜻을 자연스럽게 나타내는 ‘그 위로 지나가게 하십시오’가 더 적절합니다. 또한 한국어에서는 ‘-게 하고/-게 하며’로 병렬을 이루면 원문의 청원·명령적 판결 어조와 수동 의미를 함께 나타낼 수 있습니다.
