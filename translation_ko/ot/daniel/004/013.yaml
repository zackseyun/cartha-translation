id: DAN.4.13
reference: Daniel 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִבְבֵ/הּ֙ מִן אנוש/א יְשַׁנּ֔וֹן וּ/לְבַ֥ב חֵיוָ֖ה יִתְיְהִ֣ב לֵ֑/הּ וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/013.yaml
  text: Let his heart be changed from that of a man[a], and let the heart of a beast be given to him, and let seven times pass over him.
  footnotes:
  - marker: a
    text: Or 'seven periods' or 'seven seasons'; the Aramaic term denotes appointed times/periods, and the exact length is not specified here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 마음이 사람의 마음에서 바뀌고, 짐승의 마음이 그에게 주어지며, 일곱 때가 그 위에 지나가게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 עִדָּן은 정해진 때나 기간을 뜻할 수 있어, 정확한 길이는 여기서 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְבֵהּ / לְבַב
  english_pob_choice: his heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 생각
  - 속사람
  lexicon: HALOT
  rationale: 아람어 לְבַב/לִבְבָא의 핵심은 내면 전체이므로, 한국어에서는 문자적 기관인 ‘심장’보다 비유적이면서도 성경적 용법에 가까운 ‘마음’이 가장 자연스럽습니다.
- source_word: מִן אנוש/א
  english_pob_choice: from that of a man
  chosen_korean: 사람의 마음에서
  alternatives_korean:
  - 인간의
  - 사람에게서
  - 사람 같은
  lexicon: HALOT
  rationale: 원문의 비교 출발점을 드러내기 위해 ‘사람의 마음에서’로 옮겼습니다. 영어의 ‘from that of a man’이 풀어 쓴 관계를 한국어에서는 소유격과 조사로 간결하게 재현했습니다.
- source_word: וּ/לְבַב חֵיוָה
  english_pob_choice: and the heart of a beast
  chosen_korean: 짐승의 마음
  alternatives_korean:
  - 짐승의 심장
  - 동물의 마음
  - 야수의 마음
  lexicon: HALOT
  rationale: חֵיוָה는 이 문맥에서 동물 일반보다 왕의 굴욕과 심판을 강조하는 ‘짐승’이 적절합니다. ‘짐승의 마음’은 원문의 병렬 구조를 보존합니다.
- source_word: שִׁבְעָה עִדָּנִין
  english_pob_choice: seven times
  chosen_korean: 일곱 때
  alternatives_korean:
  - 일곱 기간
  - 일곱 계절
  - 일곱 시기
  lexicon: HALOT
  rationale: עִדָּן은 정확한 길이가 특정되지 않은 ‘정해진 때/기간’을 가리키므로, 본문이 의도하는 모호성을 살리기 위해 관용적으로 ‘일곱 때’로 옮겼습니다.
- source_word: יַחְלְפ֥וּן עֲלֽוֹ/הִי
  english_pob_choice: pass over him
  chosen_korean: 그 위에 지나가게 하십시오
  alternatives_korean:
  - 그에게 지나가게 하십시오
  - 그를 지나가게 하십시오
  - 그 위를 스쳐 지나가게 하십시오
  lexicon: HALOT
  rationale: 직역의 ‘지나가다/넘어가다’ 이미지를 살리면서, 시간의 경과가 그에게 미친다는 뜻이 드러나도록 ‘그 위에 지나가게 하십시오’로 옮겼습니다.
theological_decisions:
- issue: 명령형의 화자와 청자 전달
  chosen_reading: 이 절의 동사는 청원형으로 이해하여 한국어에서도 ‘-십시오’ 체를 사용했습니다.
  alternative_readings:
  - 서술형으로 바꾸기
  - 직설적 예언문으로 처리하기
  rationale: 아람어 문장은 선언문이라기보다 왕에게 닥칠 판결의 내용을 청원체처럼 진술하는 형식이므로, 한국어에서도 그 특유의 어조를 살렸습니다.
  doctrine_reference: Daniel 4 문맥의 심판 선고 형식
- issue: 인간성 상실의 성격
  chosen_reading: 본문이 인간의 내면이 짐승의 내면으로 바뀌는 이미지를 제시할 뿐, 여기서 곧바로 문자적 변신인지 정신적 붕괴인지 단정하지는 않았습니다.
  alternative_readings:
  - 문자적 변신으로 단정
  - 비유적 정신질환으로 단정
  rationale: 원문은 ‘사람의 마음이 바뀌고 짐승의 마음이 주어진다’는 표현으로 긴장을 유지하므로, 번역도 그 모호성을 보존해야 합니다.
  doctrine_reference: '번역 철학: 신학적 긴장 보존'
