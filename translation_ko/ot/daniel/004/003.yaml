id: DAN.4.3
reference: Daniel 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִנִּ/י֙ שִׂ֣ים טְעֵ֔ם לְ/הַנְעָלָ֣ה קָֽדָמַ֔/י לְ/כֹ֖ל חַכִּימֵ֣י בָבֶ֑ל דִּֽי פְשַׁ֥ר חֶלְמָ֖/א יְהֽוֹדְעֻנַּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/003.yaml
  text: And by me a decree was issued to bring before me all the wise men of Babylon[a], that they might make known to me the interpretation of the dream.
  footnotes:
  - marker: a
    text: Or 'that they might tell me the meaning of the dream.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 조서를 내려 바벨론의 모든 지혜자들을 내 앞으로 불러들여, 그들이 그 꿈의 해석을 내게 알려 주게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 꿈의 뜻을 내게 말하게 하였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי
  english_pob_choice: And by me
  chosen_korean: 그리고 내게서
  alternatives_korean:
  - 그리고 나로 말미암아
  - 그리고 내게서부터
  lexicon: HALOT
  rationale: מן+1인칭 접미사의 출처·발신 의미를 살려, 조서가 왕에게서 나온 것임을 자연스럽게 나타냈습니다.
- source_word: שִׂים טְעֵם
  english_pob_choice: was issued a decree
  chosen_korean: 조서가 내려져
  alternatives_korean:
  - 조서가 내려졌고
  - 명령이 내려져
  - 칙령이 반포되어
  lexicon: HALOT
  rationale: 시문 행정 문맥에서 'set/place'는 공식 결정의 공포를 뜻하므로, 한국어에서는 '조서가 내려지다'가 가장 자연스럽고 문맥에 맞습니다.
- source_word: לְהַנְעָלָה קָדָמַי
  english_pob_choice: to bring before me
  chosen_korean: 내 앞으로 불러들여
  alternatives_korean:
  - 내 앞으로 데려와
  - 내 앞에 나오게 하여
  - 내 면전에 데려오게 하여
  lexicon: HALOT
  rationale: 왕 앞에 출석시키는 행정적·궁정적 동작을 한국어 관용으로 살렸습니다.
- source_word: חַכִּימֵי בָבֶל
  english_pob_choice: the wise men of Babylon
  chosen_korean: 바벨론의 모든 지혜자들
  alternatives_korean:
  - 바벨론의 모든 박사들
  - 바벨론의 모든 현자들
  lexicon: HALOT
  rationale: 궁정 전문가 집단을 가리키는 표현으로, '지혜자들'이 본문을 드러내면서도 과도한 교회적 용어를 피합니다.
- source_word: פְשַׁר חֶלְמָא
  english_pob_choice: the interpretation of the dream
  chosen_korean: 그 꿈의 해석
  alternatives_korean:
  - 그 꿈의 뜻풀이
  - 그 꿈의 의미
  lexicon: HALOT
  rationale: 다니엘서에서 פשר는 꿈과 신비의 전문 용례이므로 '해석'을 유지했습니다.
- source_word: יְהוֹדְעֻנַּנִי
  english_pob_choice: they might make known to me
  chosen_korean: 알려 주게
  alternatives_korean:
  - 알리게
  - 내게 알려 주게
  - 내게 말해 주게
  lexicon: HALOT
  rationale: 사역적 의미의 '알려 주다'로 מקור의 '알게 하다'를 자연스럽게 반영했습니다.
