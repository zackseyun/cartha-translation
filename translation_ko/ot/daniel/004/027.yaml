id: DAN.4.27
reference: Daniel 4:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר הֲ/לָ֥א דָא הִ֖יא בָּבֶ֣ל רַבְּתָ֑/א דִּֽי אֲנָ֤ה בֱנַיְתַ/הּ֙ לְ/בֵ֣ית מַלְכ֔וּ בִּ/תְקַ֥ף חִסְנִ֖/י וְ/לִ/יקָ֥ר הַדְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/027.yaml
  text: The king answered and said[a], “Is this not Babylon the Great[b], which I myself built as a royal residence by the might of my power and for the glory of my majesty?”
  footnotes:
  - marker: a
    text: Or “great Babylon.”
    reason: lexical_alternative
  - marker: b
    text: Or “for a royal residence” or “for the house of the kingdom.”
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 대답하여 말했습니다[a], “내가 내 힘과 능력으로 내 위엄의 영광을 위하여 왕의 거처로 세운 이 큰 바벨론[b]이 아니겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “대답하여 말했습니다”는 아람어의 관용적 서술 공식을 따른 것입니다.
    reason: source_note
  - marker: b
    text: 또는 “위대한 바벨론”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하며 말했습니다
  - 대답하고 말했습니다
  lexicon: HALOT
  rationale: 아람어의 관용적 서술 공식을 한국어로 자연스럽게 옮기되, ‘대답’과 ‘말하다’의 이중 동사를 살려 원문의 서술 리듬을 반영했습니다.
- source_word: בָּבֶל רַבְּתָא
  english_pob_choice: Babylon the Great
  chosen_korean: 큰 바벨론
  alternatives_korean:
  - 바벨론 대제
  - 큰 바빌론
  lexicon: HALOT
  rationale: 원문의 형용사적 강조를 직역에 가깝게 살려 ‘큰 바벨론’으로 옮겼습니다. 이는 왕의 과장된 자만을 드러내면서도 ‘바벨론’의 고유명사를 보존합니다.
- source_word: לְבֵית מַלְכוּ
  english_pob_choice: as a royal residence / for the house of the kingdom
  chosen_korean: 왕의 거처로
  alternatives_korean:
  - 왕궁으로
  - 왕권의 집으로
  lexicon: HALOT
  rationale: 직역하면 ‘왕국의 집/왕권의 집’이지만, 문맥상 바벨론을 왕의 거처이자 왕권의 중심으로 자랑하는 말이므로 한국어에서는 가장 직접적인 기능을 드러내는 ‘왕의 거처로’를 택했습니다.
- source_word: בִּתְקַף חִסְנִי
  english_pob_choice: by the might of my power
  chosen_korean: 내 능력의 힘으로
  alternatives_korean:
  - 내 힘의 능력으로
  - 내 권세의 힘으로
  lexicon: HALOT
  rationale: 원문의 중첩적이고 자만에 찬 표현을 그대로 살리기 위해 의미를 평평하게 만들지 않고 이중 강조를 유지했습니다. ‘능력’과 ‘힘’의 중복은 네부갓네살의 허세를 드러냅니다.
- source_word: וְלִיקָר הַדְרִי
  english_pob_choice: and for the glory of my majesty
  chosen_korean: 내 위엄의 영광을 위하여
  alternatives_korean:
  - 내 영광스러운 위엄을 위하여
  - 내 영화와 위엄을 위하여
  lexicon: HALOT
  rationale: לִיקָר과 הַדְרִי의 서로 다른 뉘앙스(영광/위엄)를 모두 보존하되, 한국어에서는 자연스러운 소유격 구조로 정리했습니다. 왕이 자기 자신을 과시하는 어조를 유지합니다.
theological_decisions:
- issue: 네부갓네살의 자만이 담긴 수사적 질문의 톤
  chosen_reading: 수사적 질문 형태를 유지하여, 왕의 교만과 자기과시가 독자에게 즉시 드러나도록 했습니다.
  alternative_readings:
  - 평서문으로 완화하여 번역하는 방식
  - 더 강한 감탄문으로 바꾸는 방식
  rationale: 본문은 정보 전달보다 자기고양의 발화를 드러내는 장면이므로, 질문형을 유지하는 것이 서술 의도와 심리적 효과를 가장 잘 보존합니다.
  doctrine_reference: 단 4:27의 교만 경고와 인간 통치의 한계
- issue: ‘바벨론 the Great’의 처리
  chosen_reading: ‘큰 바벨론’으로 옮겨, 기술적 칭호처럼 굳히지 않고 원문의 강조 표현으로 남겼습니다.
  alternative_readings:
  - ‘바벨론 대제’처럼 칭호화하는 방식
  - ‘위대한 바벨론’으로 문학적 확장하는 방식
  rationale: 이 표현은 고유 칭호라기보다 왕의 과장된 자찬에 가깝기 때문에, 칭호화보다 서술적 강조를 유지하는 편이 원문에 충실합니다.
  doctrine_reference: 바벨론의 정치적 자만과 하나님의 주권
