  rationale: אַרְעָא는 여기서 세계적 범위를 띠므로 ‘온 땅’으로 옮겨, 꿈의 보편적 시야를 유지했습니다.
theological_decisions:
- issue: אַרְעָא의 범위
  chosen_reading: ‘땅’으로 옮기되, 범위를 ‘온 땅’으로 확장해 전 지구적 시야를 드러냈습니다.
  alternative_readings:
  - ‘땅’
  - ‘나라’
  rationale: 문맥은 지역적 ‘땅’보다 꿈의 우주적 규모를 강조하므로, POB의 ‘earth’ 판단을 반영해 보편성을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
