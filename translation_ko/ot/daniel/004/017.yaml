base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/017.yaml
  text: The tree that you saw[a], which grew and became strong, whose height reached to the heavens and was visible to all the earth—
  footnotes:
  - marker: a
    text: Aramaic אַרְעָא can also mean 'land'; here 'earth' best fits the global scope of the dream imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 본 그 나무는 자라서 강해졌고, 그 높이가 하늘에 닿았으며 온 땅에 보였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 אַרְעָא는 ‘땅’도 뜻할 수 있으나, 여기서는 꿈의 장면이 전 세계적 규모로 펼쳐지므로 ‘온 땅’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִילָנָא
  english_pob_choice: the tree
  chosen_korean: 그 나무
  alternatives_korean:
  - 그 나무 자체
  - 그 나무가
  lexicon: HALOT
  rationale: 특정한 꿈의 나무를 가리키므로 지시어를 살려 ‘그 나무’로 옮겼습니다.
- source_word: חֲזַיְתָ
  english_pob_choice: you saw
  chosen_korean: 네가 본
  alternatives_korean:
  - 네가 보았던
  - 네가 보신
  lexicon: HALOT
  rationale: 2인칭 단수의 시현 회상을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: רְבָה וּתְקִף
  english_pob_choice: grew and became strong
  chosen_korean: 자라서 강해졌고
  alternatives_korean:
  - 커서 강해졌고
  - 자라나 강해졌고
  - 커지고 강해졌고
  lexicon: HALOT
  rationale: 두 동사의 연속성을 살리되, 나무 이미지에 자연스러운 ‘자라서 강해졌고’로 표현했습니다.
- source_word: רוּמֵהּ / לִשְׁמַיָּא
  english_pob_choice: whose height reached to the heavens
  chosen_korean: 그 높이가 하늘에 닿았고
  alternatives_korean:
  - 그 높이가 하늘에 이르렀고
  - 그 꼭대기가 하늘에 닿았고
  lexicon: HALOT
  rationale: 직역하면 ‘높이/키’의 의미이므로 높이를 살렸고, ‘하늘에 닿다’로 도달의 이미지를 보존했습니다.
- source_word: וַחֲזוֹתֵהּ לְכָל אַרְעָא
  english_pob_choice: was visible to all the earth
  chosen_korean: 온 땅에 보였습니다
  alternatives_korean:
  - 온 땅에서 보였습니다
  - 온 세상에 보였습니다
  lexicon: HALOT
  rationale: אַרְעָא는 여기서 세계적 범위를 띠므로 ‘온 땅’으로 옮겨, 꿈의 보편적 시야를 유지했습니다.
theological_decisions:
- issue: אַרְעָא의 범위
  chosen_reading: ‘땅’으로 옮기되, 범위를 ‘온 땅’으로 확장해 전 지구적 시야를 드러냈습니다.
  alternative_readings:
  - ‘땅’
  - ‘나라’
  rationale: 문맥은 지역적 ‘땅’보다 꿈의 우주적 규모를 강조하므로, POB의 ‘earth’ 판단을 반영해 보편성을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
