  naturalness: ‘내 침상에 누워 있을 때, 나는 내 머리의 환상들 가운데서 보고 있었는데’는 다소 직역적이지만 성서 서술문으로 자연스럽고, 현대 표준어 합쇼체에 맞습니다. ‘보라’는 갑작스러운 주의 환기의 원문 담화 기능을 잘 살립니다.
  terminology: ‘파수꾼, 거룩한 이’는 עִיר וְקַדִּישׁ의 병렬·동격 표현과 그 정체의 비특정성을 보존합니다. 이를 본문에서 ‘천사’로 바꾸지 않은 것은 적절합니다. 각주도 대안이 해석적임을 명시해 유지할 수 있습니다.
