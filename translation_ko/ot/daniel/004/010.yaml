id: DAN.4.10
reference: Daniel 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י וַ/אֲלוּ֙ עִ֣יר וְ/קַדִּ֔ישׁ מִן שְׁמַיָּ֖/א נָחִֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/010.yaml
  text: I was looking in the visions of my head as I lay on my bed[a], and behold, a watcher, a holy one, came down from heaven.
  footnotes:
  - marker: a
    text: Or 'an angelic watcher'; the Aramaic literally reads 'a watcher, a holy one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 누워 있을 때 내 머리의 환상들 가운데서 보고 있었는데, 보라, 한 파수꾼, 한 거룩한 이가 하늘에서 내려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '천사 같은 파수꾼'. 아람어 원문은 문자적으로 '파수꾼, 거룩한 이'라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  english_pob_choice: I was looking
  chosen_korean: 보고 있었는데
  alternatives_korean:
  - 보았습니다
  - 보고 있었습니다
  lexicon: HALOT
  rationale: 지속적인 시각적 인지를 나타내는 서술이므로, 단회 사건보다 진행형 뉘앙스를 살린 '보고 있었는데'가 원문의 과정을 가장 자연스럽게 드러냅니다.
- source_word: בְּחֶזְוֵי רֵאשִׁי
  english_pob_choice: the visions of my head
  chosen_korean: 내 머리의 환상들
  alternatives_korean:
  - 내 머리의 환상 가운데
  - 내 생각 속 환상들
  lexicon: HALOT
  rationale: 원문의 직역 이미지를 유지하되 한국어에서 이해 가능한 표현으로 옮겼습니다. '생각 속'은 해석을 덧붙이므로 피했습니다.
- source_word: עַל מִשְׁכְּבִי
  english_pob_choice: as I lay on my bed
  chosen_korean: 내가 누워 있을 때
  alternatives_korean:
  - 내 침상 위에 누워 있을 때
  - 내 침대에서
  lexicon: HALOT
  rationale: 장소 정보가 분명한 '침상'을 살릴 수 있으나, 한국어에서는 '내가 누워 있을 때'가 더 자연스럽고 문맥상 수면/몽시 상황을 잘 전달합니다.
- source_word: עִיר וְקַדִּישׁ
  english_pob_choice: a watcher, a holy one
  chosen_korean: 한 파수꾼, 한 거룩한 이
  alternatives_korean:
  - 한 감시자, 한 거룩한 이
  - 한 천사, 한 거룩한 이
  lexicon: HALOT
  rationale: 원문의 특유한 아람어 명칭을 보존하기 위해 '파수꾼'을 택했고, 수식적 형용사 '거룩한'은 인칭화된 표현인 '거룩한 이'로 옮겨 병렬적 정체 규정을 살렸습니다.
- source_word: מִן שְׁמַיָּא
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘에서부터
  lexicon: HALOT
  rationale: 원문은 하늘의 출처를 나타내므로 '하늘에서'가 가장 간결하고 자연스럽습니다.
- source_word: נָחִת
  english_pob_choice: came down
  chosen_korean: 내려왔습니다
  alternatives_korean:
  - 내려왔습니다
  - 강림했습니다
  lexicon: HALOT
  rationale: 이동 방향을 분명히 드러내는 기본 동사이므로, 격조 높은 '강림'보다 평서적이고 직접적인 '내려왔습니다'가 적절합니다.
theological_decisions:
- issue: עִיר וְקַדִּישׁ의 신분을 특정할지 여부
  chosen_reading: '''한 파수꾼, 한 거룩한 이''로 직역해, 천사로 특정하지 않았습니다.'
  alternative_readings:
  - 한 천사
  - 하늘의 사자
  rationale: 원문은 일반적인 '천사'가 아니라 독특한 아람어 호칭을 사용하므로, 그 긴장을 보존하는 것이 본문의 관찰 가능한 의미에 충실합니다.
  doctrine_reference: 원문 우선 원칙과 용어 보존
