id: DAN.4.5
reference: Daniel 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַ֣ד אָחֳרֵ֡ין עַל֩ קָֽדָמַ֨/י דָּנִיֵּ֜אל דִּֽי שְׁמֵ֤/הּ בֵּלְטְשַׁאצַּר֙ כְּ/שֻׁ֣ם אֱלָהִ֔/י וְ/דִ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בֵּ֑/הּ וְ/חֶלְמָ֖/א קָֽדָמ֥וֹ/הִי אַמְרֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/005.yaml
  text: 'At last Daniel came in before me—he whose name was Belteshazzar[a], after the name of my god, and in whom is the spirit of the holy gods—and I told the dream before him:'
  footnotes:
  - marker: a
    text: 'Or, ''the Spirit of the holy God'' or ''the spirit of the holy God.'' The Aramaic can be understood differently, but here the king''s wording most naturally reflects his pagan perspective: ''the spirit of the holy gods.'''
    reason: alternative_reading
translation:
  language: ko
  text: 마침내 다니엘이 내 앞에 들어왔습니다. 그는 내 신의 이름을 따라 벨드사살이라 불렸고, 그에게는 거룩한 신들의 영이 있었습니다. 나는 그 앞에서 그 꿈을 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 표현은 ‘거룩한 하나님의 영’ 또는 ‘거룩한 신들의 영’으로 이해될 수 있습니다. 여기서는 느부갓네살의 이교적 관점을 자연스럽게 반영하여 ‘거룩한 신들의 영’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַד אָחֳרֵין
  english_pob_choice: At last
  chosen_korean: 마침내
  alternatives_korean:
  - 끝내
  - 드디어
  lexicon: HALOT
  rationale: 지연 끝에 도착했다는 시간적 뉘앙스를 자연스러운 한국어로 살리면서, 과장 없이 원문의 흐름을 전달합니다.
- source_word: עַל קָדָמַי
  english_pob_choice: came in before me
  chosen_korean: 내 앞에 들어왔습니다
  alternatives_korean:
  - 내 앞에 나아왔습니다
  - 내 존재 앞에 들어왔습니다
  lexicon: HALOT
  rationale: 법정·궁정적 장면에서의 ‘앞에 이르다/들어오다’를 한국어로 간결하게 옮겼습니다.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  english_pob_choice: he whose name was Belteshazzar
  chosen_korean: 그의 이름은 내 신의 이름을 따라 벨드사살이라고 하였고
  alternatives_korean:
  - 그 이름은 벨드사살이었고
  - 벨드사살이라는 이름이었고
  lexicon: HALOT
  rationale: ‘이름이 …라 하였다’는 식의 설명을 살려, 이름의 부여 근거가 되는 바벨론식 개명 의미를 드러냈습니다.
- source_word: וְדִי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ
  english_pob_choice: and in whom is the spirit of the holy gods
  chosen_korean: 그에게는 거룩한 신들의 영이 있습니다
  alternatives_korean:
  - 그에게는 거룩한 신들의 영이 있습니다
  - 그에게는 거룩한 하나님의 영이 있습니다
  lexicon: HALOT
  rationale: 아람어 복수형 ‘신들’과 형용사 복수형을 그대로 반영해, 느부갓네살의 다신교적 표현을 한국어에서도 보존했습니다.
- source_word: וְחֶלְמָא קָדָמוֹהִי אַמְרֵת
  english_pob_choice: and I told the dream before him
  chosen_korean: 그래서 내가 그 꿈을 그 앞에서 말하였습니다
  alternatives_korean:
  - 그래서 내가 그 꿈을 그 앞에서 이야기하였습니다
  - 그리고 그 앞에서 그 꿈을 말하였습니다
  lexicon: HALOT
  rationale: ‘말하다/전하다’와 ‘그 앞에서’의 궁정적 공간감을 유지하면서, 한국어 문장으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: רוּחַ אֱלָהִין קַדִּישִׁין의 신학적 긴장 보존
  chosen_reading: 거룩한 신들의 영
  alternative_readings:
  - 거룩한 하나님의 영
  - 성스러운 신들의 영
  rationale: 화자의 입장이 느부갓네살이므로, 본문이 담은 다신교적 프레이밍을 싱글톤 신앙 고백으로 평탄화하지 않고 그대로 보존했습니다.
  doctrine_reference: 원문 우선 및 번역에서의 신학적 긴장 보존
- issue: 다니엘의 바벨론식 개명 표현
  chosen_reading: 내 신의 이름을 따라 벨드사살이라고 하였고
  alternative_readings:
  - 내 신의 이름에 따라 벨드사살이라 불렸고
  - 내 신의 이름에서 따온 벨드사살이라 하였고
  rationale: 개명은 단순 별명이 아니라 이방 권력이 부여한 정체성 표지이므로, 이름의 출처를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 서사 맥락에서의 정체성 표지 보존
