id: DAN.4.18
reference: Daniel 4:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֗וֹ/הִי תְּדוּר֙ חֵיוַ֣ת בָּרָ֔/א וּ/בְ/עַנְפ֕וֹ/הִי יִשְׁכְּנָ֖ן צִפֲּרֵ֥י שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/018.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field lived, and in its branches the birds of the heavens dwelled.
  footnotes:
  - marker: a
    text: Or 'the birds of the sky.' The Aramaic literally says 'the birds of the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 나무의 잎사귀는 아름답고 열매는 많아서, 그 안에는 모든 이의 먹을거리가 있었습니다. 그 아래에는 들짐승들이 살았고, 그 가지들에는 하늘의 새들이 깃들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 새들’은 아람어의 문자적 표현을 반영한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וְעָפְיֵהּ
  english_pob_choice: its foliage
  chosen_korean: 그 나무의 잎사귀는
  alternatives_korean:
  - 그 나무의 잎은
  - 그 나무의 수관은
  lexicon: HALOT
  rationale: 아람어가 가리키는 것은 나무의 잎이 이루는 덮개이므로, 문맥상 집합성을 살리면서도 현대 한국어에서 자연스러운 ‘잎사귀’로 옮겼습니다.
- source_word: שַׁפִּיר / שַׂגִּיא
  english_pob_choice: beautiful / abundant
  chosen_korean: 아름답고 열매는 많아서
  alternatives_korean:
  - 아름답고 열매는 풍성해서
  - 보기 좋고 열매가 많아서
  lexicon: HALOT
  rationale: 형용사 두 개가 나무의 외형과 결실을 병렬로 묘사하므로, ‘아름답고’와 ‘많아서’로 간결하게 대응시켰습니다.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  english_pob_choice: in it was food for all
  chosen_korean: 그 안에는 모든 이의 먹을거리가 있었습니다
  alternatives_korean:
  - 그 안에는 모든 사람의 먹을 것이 있었습니다
  - 그 안에는 모든 이를 위한 양식이 있었습니다
  lexicon: HALOT
  rationale: 직역의 ‘식물/음식’보다 문맥상 포괄적 생존 공급을 드러내는 ‘먹을거리’가 자연스럽고, ‘모든 이의’로 포괄성을 살렸습니다.
- source_word: חֵיוַת בָּרָא
  english_pob_choice: the beasts of the field
  chosen_korean: 들짐승들이
  alternatives_korean:
  - 들의 짐승들이
  - 들의 야생 짐승들이
  lexicon: HALOT
  rationale: 관용적 성경어인 ‘들짐승’이 원문의 들판에 사는 짐승들을 간결하게 전달합니다.
- source_word: צִפֲּרֵי שְׁמַיָּא
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 새들이
  alternatives_korean:
  - 하늘들의 새들이
  - 하늘 새들이
  lexicon: HALOT
  rationale: 아람어의 직역인 ‘하늘의 새들’을 택하되, 한국어에서는 복수형 ‘하늘들’을 어색하게 만들지 않도록 자연스럽게 다듬었습니다.
theological_decisions:
- issue: 시적 평행법과 서술 톤
  chosen_reading: 나무의 외형, 결실, 공급, 서식 공간을 차례로 보여 주는 서술적 평행법을 살려 평이한 진술문으로 옮겼습니다.
  alternative_readings:
  - 더 문학적인 운문형 번역
  - 더 직역적인 어순 유지
  rationale: 이 절은 상징 해석 이전의 묘사 자체가 중요하므로, 과도한 해설 없이 원문의 이미지 진행을 그대로 드러내는 쪽이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 문맥 우선의 서술 보존
