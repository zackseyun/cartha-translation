  to: 그 나무의 잎사귀는 아름답고 열매는 많았으며, 그 안에는 모든 이를 위한 먹을 것이 있었습니다. 그 아래에는 들짐승들이 살았고, 그 가지들에는 하늘의 새들이 깃들었습니다.[a]
