  text: ע֗וֹד מִלְּתָ/א֙ בְּ/פֻ֣ם מַלְכָּ֔/א קָ֖ל מִן שְׁמַיָּ֣/א נְפַ֑ל לָ֤/ךְ אָֽמְרִין֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א מַלְכוּתָ֖/ה עֲדָ֥ת מִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/028.yaml
  text: 'While the word was still in the king’s mouth[a], a voice fell from heaven: “To you it is said, King Nebuchadnezzar, the kingdom has departed from you.”'
  footnotes:
  - marker: a
    text: Or “the kingdom has been removed from you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 입에 아직 말이 있을 때에 하늘에서 한 음성이 떨어져 말했습니다. 「너에게 말한다, 느부갓네살 왕이여, 왕국이 네게서 떠났습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “왕국이 네게서 제거되었습니다”라고도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד מִלְּתָא בְּפֻם מַלְכָּא
  english_pob_choice: While the word was still in the king’s mouth
  chosen_korean: “왕의 입에 아직 말이 있을 때에”
  alternatives_korean:
  - “왕의 입에 말이 아직 있을 때에”
  - “왕이 아직 말하고 있을 때에”
  lexicon: HALOT
  rationale: 아람어 관용구를 자연스럽게 옮기되, 말이 중단된 순간성을 살리기 위해 ‘아직’과 ‘있을 때에’를 사용했습니다.
- source_word: קָל מִן שְׁמַיָּא נְפַל
  english_pob_choice: a voice fell from heaven
  chosen_korean: “하늘에서 한 음성이 떨어져”
  alternatives_korean:
  - “하늘에서 한 소리가 내려와”
  - “하늘로부터 한 음성이 내려왔습니다”
  lexicon: HALOT
  rationale: ‘음성’은 이어지는 직접 발화와 맞고, ‘떨어져’는 נפל의 직설성을 살리면서도 한국어에서 충분히 자연스럽습니다.
- source_word: לָךְ אָמְרִין
  english_pob_choice: To you it is said
  chosen_korean: “너에게 말했습니다”
  alternatives_korean:
  - “너에게 말합니다”
  - “너에게 이르러 말합니다”
  lexicon: HALOT
  rationale: 아람어의 무인칭적 선포를 한국어에서 가장 읽기 자연스러운 직설로 옮겼습니다. 직접 계시 선언의 형식성을 유지하기 위해 문장 전체를 인용부호로 처리했습니다.
- source_word: מַלְכוּתָה עֲדָת מִנָּךְ
  english_pob_choice: the kingdom has departed from you
  chosen_korean: “왕국이 네게서 떠났습니다”
  alternatives_korean:
  - “왕국이 네게서 옮겨졌습니다”
  - “왕권이 네게서 제거되었습니다”
  lexicon: HALOT
  rationale: ‘왕국’은 본문의 המלכות를 그대로 반영하고, עֲדָת의 이탈 이미지를 ‘떠났습니다’로 살렸습니다. POB의 각주가 허용하는 ‘removed’ 의미도 이 표현 안에 일정 부분 포함됩니다.
theological_decisions:
- issue: 하늘의 음성 표현의 신학적 무게
  chosen_reading: ‘하늘에서 한 음성이 떨어져’로 유지하여 단순한 소리보다 신적 판결의 선포로 읽히게 했습니다.
  alternative_readings:
  - “하늘에서 한 소리가 내려와”
  - “하늘에서 들려오는 소리가”
  rationale: 이 장면은 단순한 음향 묘사가 아니라 하나님의 심판 선언이므로, ‘하늘’과 ‘음성’을 보존해 신적 권위를 약화시키지 않았습니다.
  doctrine_reference: 원문 우선 번역 원칙; 다니엘서의 심판 신탁 문맥
- issue: 직접화법의 존대
  chosen_reading: 느부갓네살에게는 서술부는 합쇼체로, 하나님의 선포는 인용문 안에서 직설형으로 두었습니다.
  alternative_readings:
  - 전체를 간접화로 완화
  - 인용부호 없이 서술문만 사용
  rationale: 본문의 갑작스러운 신적 개입과 명령적 선언을 드러내기 위해, 한국어에서도 화행의 전환을 분명히 유지했습니다.
  doctrine_reference: 표준어 합쇼체와 인용문 내 화행 재현
