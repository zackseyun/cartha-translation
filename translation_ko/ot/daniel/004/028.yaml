revisions:
- from: 왕의 입에 아직 말이 있을 때에 하늘에서 한 음성이 떨어져 말했습니다. 「너에게 말한다, 느부갓네살 왕이여, 왕국이 네게서 떠났습니다.」[a]
  to: 왕이 아직 말을 끝내기도 전에, 하늘에서 음성이 내려와 말했습니다. 「느부갓네살 왕이여, 너에게 이렇게 선포됩니다. 왕국이 네게서 떠났습니다[a].」
  rationale: 문두는 ‘말이 아직 왕의 입에 있는 동안’이라는 관용구가 나타내는 발화 도중의 중단을 자연스러운 한국어로 옮겼습니다. ‘음성이 내려와’는 하늘로부터의 갑작스러운 음성이라는 원문의 이미지를 보존합니다. 무인칭 선포 표현은 ‘너에게 이렇게 선포됩니다’로 반영했으며, 각주 표지는 어휘 대안이 걸리는 동사구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:58Z'
