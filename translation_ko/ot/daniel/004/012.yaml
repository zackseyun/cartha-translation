  lexicon: HALOT
  rationale: 수동·사역적 뉘앙스를 자연스럽게 살리면서도, 아람어의 이미지인 '하늘의 이슬'을 직역에 가깝게 유지했습니다.
- source_word: וְעִם חֵיוְתָא חֲלָקֵהּ
  english_pob_choice: let his portion be with the beasts
  chosen_korean: 그의 몫은 들의 짐승들과 함께하게 하라
