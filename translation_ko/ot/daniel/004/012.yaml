theological_decisions:
- issue: 수목 이미지에서 인물 대상로의 전환
  chosen_reading: '''그루터기''를 유지하되 뒤의 대명사는 ''그의''로 받아, 나무 상징이 느부갓네살에게 적용되는 전환을 드러냈습니다.'
  alternative_readings:
  - 전체를 무인칭적으로 처리하여 '그것의 몫'으로 옮김
  rationale: 아람어는 의도적으로 나무의 이미지에서 왕을 가리키는 인물 지시로 넘어가므로, 그 전환을 평평하게 만들지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
