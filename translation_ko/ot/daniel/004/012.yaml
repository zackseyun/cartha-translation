  lexicon: HALOT
  rationale: אֱסוּר의 결박·속박 의미를 반영하되, POB의 'band'처럼 원형의 형상을 살려 띠로 옮겼습니다. '놋'은 고대 금속 어휘의 결을 살리기 위한 선택입니다.
