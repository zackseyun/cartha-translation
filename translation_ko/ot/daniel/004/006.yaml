id: DAN.4.6
reference: Daniel 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּלְטְשַׁאצַּר֮ רַ֣ב חַרְטֻמַיָּ/א֒ דִּ֣י אֲנָ֣ה יִדְעֵ֗ת דִּ֠י ר֣וּחַ אֱלָהִ֤ין קַדִּישִׁין֙ בָּ֔/ךְ וְ/כָל רָ֖ז לָא אָנֵ֣ס לָ֑/ךְ חֶזְוֵ֨י חֶלְמִ֧/י דִֽי חֲזֵ֛ית וּ/פִשְׁרֵ֖/הּ אֱמַֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/006.yaml
  text: Belteshazzar[a], chief of the magicians, whom I know has the spirit of the holy gods in you, and no mystery is too difficult for you, tell me the visions of my dream that I saw, and its interpretation.
  footnotes:
  - marker: a
    text: Or, 'the Spirit of the holy God' or 'the spirit of the holy God.'
    reason: alternative_reading
translation:
  language: ko
  text: 벨드사살아, 술객들의 우두머리여, 내가 알기로 당신 안에는 거룩한 신들의 영이 있습니다.[a] 어떤 비밀도 당신에게는 어렵지 않습니다. 내가 본 꿈의 환상들과 그 해석을 내게 말해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 하나님의 영’ 또는 ‘거룩한 신의 영’.
    reason: alternative_reading
lexical_decisions:
- source_word: רַב חַרְטֻמַיָּא
  english_pob_choice: chief of the magicians
  chosen_korean: 박사들의 우두머리
  alternatives_korean:
  - 박사들의 우두머리
  - 마술사들의 우두머리
  - 점술가들의 우두머리
  lexicon: HALOT
  rationale: 아람어 חַרְטֻמַיָּא는 다니엘서의 궁정 지혜자 집단을 가리키며, רַב은 그 우두머리라는 뜻입니다. 한국어에서는 ‘magicians’를 직역한 이질감을 줄이면서도 궁정 직함을 살리기 위해 ‘박사들의 우두머리’로 옮겼습니다.
- source_word: ר֣וּחַ אֱלָהִין קַדִּישִׁין
  english_pob_choice: the spirit of the holy gods
  chosen_korean: 거룩한 신들의 영
  alternatives_korean:
  - 거룩한 신들의 영
  - 거룩한 하나님의 영
  - 거룩한 신의 영
  lexicon: HALOT
  rationale: 본문의 복수형 אֱלָהִין과 קַדִּישִׁין을 살려 느부갓네살의 다신교적 표현을 그대로 반영했습니다. 영어 POB의 핵심 판단을 따라 한국어 본문도 복수 표현을 유지했습니다.
- source_word: וְכָל רָז לָא אָנֵס לָךְ
  english_pob_choice: and no mystery is too difficult for you
  chosen_korean: 어떤 비밀도 당신에게 너무 어려운 것이 아닙니다
  alternatives_korean:
  - 어떤 비밀도 당신에게 너무 어려운 것이 아닙니다
  - 어떤 비밀도 당신을 곤란하게 하지 못합니다
  - 어떤 비밀도 당신에게 감당하기 어렵지 않습니다
  lexicon: HALOT
  rationale: רָז는 다니엘서에서 ‘비밀’보다 ‘숨은 일/신비’의 뉘앙스가 있지만, 한국어에서는 문맥상 ‘비밀’이 가장 자연스럽고도 장르적 의미를 유지합니다. לָא אָנֵס לָךְ는 능력의 범위를 말하므로 ‘너무 어려운 것이 아닙니다’로 옮겼습니다.
- source_word: חֶזְוֵי חֶלְמִי דִי חֲזֵית וּפִשְׁרֵהּ
  english_pob_choice: the visions of my dream that I saw, and its interpretation
  chosen_korean: 내가 본 꿈의 환상들과 그것의 해석
  alternatives_korean:
  - 내가 본 꿈의 환상들과 그것의 해석
  - 내가 본 꿈의 모습들과 그 해석
  - 내가 본 꿈 속의 환상들과 그 뜻
  lexicon: HALOT
  rationale: חֶזְוֵי חֶלְמִי는 단순히 ‘꿈’이 아니라 꿈 안에서 본 ‘환상들’을 가리키므로 그 구별을 살렸습니다. פִּשְׁרֵהּ는 다니엘서의 전문 용어인 ‘해석’으로 번역했습니다.
theological_decisions:
- issue: רוּחַ אֱלָהִין קַדִּישִׁין의 복수 표현을 그대로 둘 것인지, 단수로 신학적으로 조정할 것인지
  chosen_reading: 본문 화자의 관점을 따라 ‘거룩한 신들의 영’으로 유지했습니다.
  alternative_readings:
  - 거룩한 하나님의 영
  - 거룩한 신의 영
  rationale: 직접 화자는 바벨론 왕이며, 본문의 형태론과 서술 맥락은 복수 표현을 지지합니다. 후대의 단일신론적 정리를 본문에 미리 주입하지 않도록 긴장을 보존했습니다.
  doctrine_reference: 본문 관점 보존
