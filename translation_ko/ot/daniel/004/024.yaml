id: DAN.4.24
reference: Daniel 4:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָהֵ֣ן מַלְכָּ֗/א מִלְכִּ/י֙ יִשְׁפַּ֣ר עלי/ך ו/חטי/ך בְּ/צִדְקָ֣ה פְרֻ֔ק וַ/עֲוָיָתָ֖/ךְ בְּ/מִחַ֣ן עֲנָ֑יִן הֵ֛ן תֶּהֱוֵ֥א אַרְכָ֖ה לִ/שְׁלֵוְתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/024.yaml
  text: 'Therefore[a], O king, let my counsel be acceptable to you: break off your sins by righteousness, and your iniquities by showing mercy to the poor[b], that there may perhaps be a prolonging of your prosperity.'
  footnotes:
  - marker: a
    text: Or 'redeem your sins by righteousness, and your iniquities by mercy to the poor.' The Aramaic verb can be understood more literally as 'break off' or, in some contexts, 'redeem/deliver.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a prolonging of your tranquility' or 'peace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 왕이여, 제 충고를 받아들이시기 바랍니다. 의로 죄를 끊어 버리시고, 가난한 자에게 자비를 베푸는 것으로 불의를 끊으십시오. 그러면 아마도 당신의 평강이 연장될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘끊어 버리시고’는 문자적으로는 ‘끊다/떼어 내다’에 가깝고, 일부 문맥에서는 ‘속량하다/구속하다’로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’은 문맥상 평온, 안녕, 번영까지 아우를 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그런즉
  - 그러니
  lexicon: HALOT
  rationale: 앞말의 결론을 여는 추론 접속사이므로, 현대 한국어에서 가장 자연스러운 대응인 ‘그러므로’를 택했습니다.
- source_word: מַלְכָּא
  english_pob_choice: O king
  chosen_korean: 왕이여
  alternatives_korean:
  - 임금이여
  - 왕님
  lexicon: HALOT
  rationale: 직접 호격을 살리면서도 공적·궁정적 어조를 유지하는 현대식 호칭으로 ‘왕이여’를 사용했습니다.
- source_word: פְרֻק
  english_pob_choice: break off
  chosen_korean: 끊어 버리시고
  alternatives_korean:
  - 끊어 내시고
  - 떼어 버리시고
  - 버리시고
  lexicon: HALOT
  rationale: 단순한 ‘중단’보다 죄와의 단절을 드러내는 동작성을 살리기 위해 ‘끊어 버리다’를 택했습니다. 이 구절의 비유적 강도를 유지합니다.
- source_word: בְּצִדְקָה
  english_pob_choice: by righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의롭게 하여
  - 공의로
  - 옳게
  lexicon: HALOT
  rationale: 명사 עצה에 대응하는 수단/방식 표현으로, ‘의로’가 가장 간결하게 מקור의 윤리적 행위를 전달합니다.
- source_word: בְּמִחַן עֲנָיִן
  english_pob_choice: by showing mercy to the poor
  chosen_korean: 가난한 자에게 자비를 베푸는 것으로
  alternatives_korean:
  - 가난한 자에게 긍휼을 보이는 것으로
  - 가난한 자를 불쌍히 여김으로
  - 가난한 자에게 긍휼을 행함으로
  lexicon: HALOT
  rationale: 동사적 의미를 분명히 하기 위해 ‘자비를 베풀다’로 풀었고, 대상인 ‘가난한 자’를 유지해 사회적·윤리적 요구를 분명히 했습니다.
- source_word: לִשְׁלֵוְתָךְ
  english_pob_choice: of your prosperity
  chosen_korean: 당신의 평강이
  alternatives_korean:
  - 당신의 평온이
  - 당신의 안녕이
  - 당신의 번영이
  lexicon: HALOT
  rationale: 이 어휘는 평온, 안녕, 번영까지 넓게 뜻할 수 있으므로 문맥상 왕의 삶의 안정과 복리를 함께 포괄하는 ‘평강’으로 옮겼습니다.
theological_decisions:
- issue: ‘죄를 끊어 버리다’와 ‘자비를 베풀다’의 관계를 어떻게 이해할지
  chosen_reading: 이 구절은 자비로운 행위가 죄를 스스로 속죄한다는 뜻이 아니라, 회개가 실제적 의와 자비의 삶으로 드러나야 한다는 촉구로 읽었습니다.
  alternative_readings:
  - 구제를 통해 죄를 ‘속량하다’는 더 강한 의미
  - 선행이 죄값을 대신 갚는다는 해석
  rationale: 아람어 동사의 기본 의미는 ‘끊다/떼어 내다’에 가깝고, 문맥은 윤리적 회개 권면입니다. 따라서 공로적 속죄를 암시하지 않으면서도 본문의 강한 도덕적 요구는 보존했습니다.
  doctrine_reference: 원문 우선 번역; 본문이 요구하는 회개와 실천적 의를 도입된 교리보다 우선해 표현
- issue: הֵן과 아마도의 뉘앙스
  chosen_reading: 결과의 가능성을 열어 두는 ‘아마도’로 옮겨, 단정이 아닌 여지를 남겼습니다.
  alternative_readings:
  - 혹시
  - 어쩌면
  - 만일
  rationale: 예언적 경고 속에서도 결과를 조건부로 제시하는 완곡성을 유지해야 하므로, 한국어에서 자연스럽고 절제된 ‘아마도’를 사용했습니다.
  doctrine_reference: 조건적 경고의 서술 방식 보존
