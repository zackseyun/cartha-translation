revisions:
- from: 그러므로, 왕이여, 제 충고를 받아들이시기 바랍니다. 의로 죄를 끊어 버리시고, 가난한 자에게 자비를 베푸는 것으로 불의를 끊으십시오. 그러면 아마도 당신의 평강이 연장될 것입니다.[a][b]
  to: 그러므로 왕이여, 제 조언을 받아들이시기를 바랍니다. 의로 죄를 끊어 버리시고[a], 가난한 이들에게 자비를 베푸심으로 불의를 끊으십시오. 그리하면 아마도 왕의 평안이 오래 지속될 것입니다.[b]
