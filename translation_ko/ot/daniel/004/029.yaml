base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/029.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
  footnotes:
  - marker: a
    text: Aramaic 'seven times'; possibly 'seven years' or more generally 'seven periods of time.'
    reason: alternative_reading
  - marker: b
    text: '''Men'' here means human beings in contrast to the beasts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들[a]에게서 쫓겨나고, 들짐승과 함께 살게 되며, 소처럼 풀을 먹게 될 것입니다. 또 일곱 때[b]가 당신 위를 지나갈 것이니, 지극히 높으신 분이 사람의 나라를 다스리시며, 자기 뜻대로 그 나라를 누구에게든지 주신다는 것을 당신이 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘사람들’은 짐승과 대조되는 인간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어는 ‘일곱 때’라고 되어 있으며, 문맥상 ‘일곱 해’ 또는 더 일반적으로 ‘일곱 기간’으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: טָֽרְדִ֜ין
  english_pob_choice: you will be driven away
  chosen_korean: 쫓겨나고
  alternatives_korean:
  - 내쫓기고
  - 몰려나고
  - 추방되고
  lexicon: HALOT
  rationale: 동사의 강한 축출 의미를 살리면서, 한국어에서 문맥에 자연스러운 수동적 결과를 간결하게 표현했습니다.
- source_word: אֲנָשָׁא
  english_pob_choice: men
  chosen_korean: 사람들
