  - 인류
  - 인간들
  lexicon: HALOT
  rationale: 짐승과의 대조를 분명히 하되 현대 한국어에서 성별 오해를 줄이기 위해 집합적 표현인 ‘사람들’로 옮겼습니다.
- source_word: שִׁבְעָה עִדָּנִין
  english_pob_choice: seven times
  chosen_korean: 일곱 때
  alternatives_korean:
  - 일곱 기간
  - 일곱 해
  lexicon: HALOT
  rationale: 원문의 시간 표현을 그대로 살려 기간의 길이를 단정하지 않고, 본문이 의도하는 모호성을 유지했습니다.
- source_word: שַׁלִּיט עִלָּיָא
  english_pob_choice: the Most High rules
  chosen_korean: 지극히 높으신 분이 ... 다스리시며
  alternatives_korean:
  - 지극히 높으신 분이 ... 통치하시며
  - 지극히 높으신 분의 다스리심이
  lexicon: HALOT
  rationale: ‘rules’의 통치 의미를 살리되 한국어 성경체에서 자연스러운 동사 ‘다스리시다’를 사용했습니다.
- source_word: בְּמַלְכוּת אֲנָשָׁא
  english_pob_choice: in the kingdom of men
  chosen_korean: 사람의 나라
  alternatives_korean:
  - 사람들의 나라
  - 인간의 나라
  - 사람들 가운데의 나라
  lexicon: HALOT
  rationale: 영어 POB가 유지한 ‘kingdom of men’의 대조를 한국어에서는 자연스러운 단수 집합 표현 ‘사람의 나라’로 압축해 전달했습니다.
theological_decisions:
- issue: ‘seven times’의 기간 해석
  chosen_reading: 일곱 때
  alternative_readings:
  - 일곱 해
  - 일곱 기간
  rationale: 원문은 기간의 정확한 길이를 특정하지 않으므로, 본문이 열어 둔 범위를 유지하는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
- issue: ‘Most High’의 호칭과 서술형 동사
  chosen_reading: 지극히 높으신 분이 ... 다스리시며
  alternative_readings:
  - 지극히 높으신 이가 ... 통치하시며
  - 가장 높으신 분이 ... 다스리시며
  rationale: 하나님의 주권을 부드럽게 약화하지 않기 위해 직설적 통치 표현을 유지했고, 하나님께 대한 서술에서는 공손한 종결을 사용했습니다.
  doctrine_reference: Korean target style, direct address and reverent divine narration
