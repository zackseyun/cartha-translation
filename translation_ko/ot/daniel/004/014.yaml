id: DAN.4.14
reference: Daniel 4:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/גְזֵרַ֤ת עִירִין֙ פִּתְגָמָ֔/א וּ/מֵאמַ֥ר קַדִּישִׁ֖ין שְׁאֵֽלְתָ֑/א עַד דִּבְרַ֡ת דִּ֣י יִנְדְּע֣וּן חַ֠יַּיָּ/א דִּֽי שַׁלִּ֨יט עלי/א בְּ/מַלְכ֣וּת אנוש/א וּ/לְ/מַן דִּ֤י יִצְבֵּא֙ יִתְּנִנַּ֔/הּ וּ/שְׁפַ֥ל אֲנָשִׁ֖ים יְקִ֥ים עלי/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/014.yaml
  text: The sentence is by the decree of the watchers[a], and the decision by the word of the holy ones, so that the living may know that the Most High rules in the kingdom of mankind and gives it to whom he wills[c][b], and sets up over it the lowliest of men.
  footnotes:
  - marker: a
    text: Or 'The sentence is by the decree of the watchers, and the decision is a request by the word of the holy ones.' The Aramaic wording is compressed, and שְׁאֵלְתָא can be rendered 'request' or 'petition.'
    reason: lexical_alternative
  - marker: b
    text: '''Watchers'' is a literal rendering of a Danielic term for heavenly beings; many interpreters understand them to be angels.'
    reason: cultural_note
  - marker: c
    text: Or 'over the kingdom of men' or 'over the kingdom of humanity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일은 깨어 있는 이들[a][b]의 판결에 따른 것이며, 이 결정은 거룩한 이들의 요청에 따른 것입니다. 이는 살아 있는 이들이 지극히 높으신 이께서 인간의 나라를[c] 다스리시고, 그것을 자신이 원하시는 이에게 주시며, 가장 낮은 사람을 그 나라 위에 세우신다는 것을 알게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일은 깨어 있는 이들의 판결에 따른 것이며, 이 결정은 거룩한 이들의 말에 따른 것이다.’ 아람어 표현은 압축되어 있으며, שְׁאֵלְתָא는 ‘요청’, ‘청원’, 또는 문맥상 ‘말’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깨어 있는 이들’은 다니엘서에서 하늘의 존재를 가리키는 문자적 표현입니다. 많은 해석자는 이들을 천사로 이해합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘사람들의 나라’ 또는 ‘인류의 나라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְזֵרַת
  english_pob_choice: by the decree of
  chosen_korean: ~의 명령에서 나온 것
  alternatives_korean:
  - ~의 결정으로부터
  - ~의 조서에 따라
  lexicon: HALOT
  rationale: 아람어 גְזֵרָה는 공식적 판정/결정을 가리키므로, 한국어로는 법정적·권위적 뉘앙스를 살려 ‘명령’으로 옮기고 조사 בְּ의 출처/근거를 자연스럽게 드러냈습니다.
- source_word: עִירִין
  english_pob_choice: the watchers
  chosen_korean: 깨어 있는 자들
  alternatives_korean:
  - 감시자들
  - 천사들
  lexicon: HALOT
  rationale: 용어의 문자적 의미를 살려 다니엘서의 하늘 존재를 암시하는 표현을 유지했습니다. ‘천사들’은 해석을 앞당기므로 본문에는 두지 않았습니다.
- source_word: שְׁאֵלְתָא
  english_pob_choice: the word
  chosen_korean: 그 결정
  alternatives_korean:
  - 그 요청
  - 그 청원
  - 그 말
  lexicon: HALOT
  rationale: 이 낱말은 ‘요청/청원’도 가능하지만, 병행 구조 안에서는 권위 있는 판정의 일부로 기능합니다. 한국어에서는 ‘결정’이 문맥의 법정성과 병행성을 가장 잘 살립니다.
- source_word: קַדִּישִׁין
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 자들
  alternatives_korean:
  - 성도들
  - 거룩한 존재들
  lexicon: HALOT
  rationale: 하늘 회의 장면의 존재들을 가리키므로 교회적 용례인 ‘성도들’보다 직역적인 ‘거룩한 자들’이 더 적합합니다.
- source_word: שַׁלִּיט עִלָּיָא
  english_pob_choice: the Most High rules
  chosen_korean: 지극히 높으신 이가 … 다스리시며
  alternatives_korean:
  - 지극히 높으신 이가 … 주권을 가지시며
  - 지극히 높으신 이가 … 통치하시며
  lexicon: HALOT
  rationale: עִלָּיָא는 칭호로서 ‘지극히 높으신 이’를 뜻하고, שַׁלִּיט은 통치권을 가진 분이 ‘다스리신다’는 동사를 요구합니다.
- source_word: בְּמַלְכוּת אנושׁא
  english_pob_choice: in the kingdom of mankind
  chosen_korean: 사람의 나라에서
  alternatives_korean:
  - 인류의 나라에서
  - 사람들의 나라에서
  lexicon: HALOT
  rationale: אֱנוֹשָׁא는 집합적 인간을 가리키는 표현이므로, 한국어에서는 문맥상 자연스럽고 남성 중심을 과도하게 강조하지 않는 ‘사람의 나라’가 적절합니다.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  english_pob_choice: and gives it to whom he wills
  chosen_korean: 그것을 자기 뜻대로 누구에게든지 주시고
  alternatives_korean:
  - 그것을 원하시는 사람에게 주시고
  - 그것을 그가 뜻하는 자에게 주시고
  lexicon: HALOT
  rationale: יִצְבֵּא는 신적 자유의 의지를 나타내므로 ‘자기 뜻대로’와 ‘누구에게든지’로 권위와 개방성을 함께 살렸습니다.
- source_word: וּשְׁפַל אֲנָשִׁים
  english_pob_choice: the lowliest of men
  chosen_korean: 가장 낮은 사람
  alternatives_korean:
  - 가장 미천한 사람
  - 가장 낮은 자
  lexicon: HALOT
  rationale: 아람어 관용구를 한국어에서 자연스럽게 풀어, 신분적 낮음을 드러내되 과도하게 비하적인 어감은 줄였습니다.
- source_word: יְקִים עֲלַיְהּ
  english_pob_choice: sets up over it
  chosen_korean: 그 위에 세우신다
  alternatives_korean:
  - 그 위에 세우신다
  - 그 위에 임명하신다
  lexicon: HALOT
  rationale: 동사는 ‘세우다/일으키다’의 뜻을 가지므로, 왕권 수여의 이미지를 유지하는 ‘그 위에 세우신다’가 적절합니다.
theological_decisions:
- issue: עִירִין / קַדִּישִׁין의 정체
  chosen_reading: ‘깨어 있는 자들’과 ‘거룩한 자들’을 그대로 유지해 하늘 법정의 이미지를 보존했습니다.
  alternative_readings:
  - 천사들
  - 하늘 존재들
  rationale: 다니엘서 특유의 기술어를 일반화하지 않고 보존하는 것이 본문의 상징적 장면과 심판 선언의 긴장을 살립니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 지극히 높으신 이의 주권 진술
  chosen_reading: 하나님이 사람의 나라를 다스리시고 누구에게든지 주신다는 문장을 직접적으로 살렸습니다.
  alternative_readings:
  - 하나님이 주권을 가지신다
  - 하나님이 통치하신다
  rationale: 이 절의 핵심은 인간 권력의 한계와 하나님의 절대적 수여권이므로, 완곡하게 만들지 않고 문맥의 신학을 선명하게 드러냈습니다.
  doctrine_reference: Daniel 4:14 context
