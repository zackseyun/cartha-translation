  source_fidelity: 초안은 지극히 높으신 이의 인간 세계에 대한 통치와 왕권 수여라는 후반부의 뜻을 대체로 충실히 옮겼습니다. 그러나 앞부분에서 פִּתְגָמָא를 ‘성명’으로 옮긴 것은 문맥의 판결/선고 의미와 맞지 않으며, ‘명령에서 나온 것’, ‘말에 따른 것’은 두 병행 절의 법정적 선언과 שְׁאֵלְתָא의 ‘요청·청원’이라는 어휘적 긴장을 충분히 반영하지 못합니다. 개정문은 이를 ‘일/결정’, ‘판결’, ‘요청’으로 구분하여 보존합니다.
  naturalness: ‘성명’은 현대 한국어에서 공식 발표문을 주로 뜻하여 이 문맥에 부자연스럽습니다. 또한 ‘사람의 나라에서’는 통치 대상과 관련된 문맥에서는 다소 어색합니다. ‘인간의 나라를 다스리시며’와 ‘그 나라 위에 세우신다’가 자연스럽고 원문의 통치·임명 관계를 드러냅니다.
