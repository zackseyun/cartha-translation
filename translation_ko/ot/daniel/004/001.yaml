  - 활기차 있었습니다
  - 흥왕하고 있었습니다
  lexicon: HALOT
  rationale: ‘생기 있게 번성함’이라는 뜻을 살리되, 왕의 상태를 설명하는 문맥에 맞게 자연스러운 동사구로 옮겼습니다.
theological_decisions:
- issue: פּersonal state description in a royal self-report
  chosen_reading: 이 절은 느부갓네살이 꿈 사건 직전 자신의 안정과 번영을 회고하는 자술로 읽었습니다.
  alternative_readings:
  - 단순한 생활 묘사로 약화하기
  - 재물의 풍요만을 강조하기
  rationale: ארמית 형용사 두 개는 내적 평안과 외적 활력을 함께 보여 주므로, 둘 다 살려 왕의 자기 인식의 대비를 준비합니다.
  doctrine_reference: 문맥 주해
