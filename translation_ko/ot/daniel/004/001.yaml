  lexicon: 고유명사 표기 관례
  rationale: 한국어 성경에서 널리 통용되는 고유명사 표기를 따랐습니다.
- source_word: שְׁלֵה
  english_pob_choice: at ease
  chosen_korean: 편안하였고
  alternatives_korean:
  - 안온하였고
  - 평안하였고
  - 안전하였고
  lexicon: HALOT
  rationale: 문맥상 내적 안정과 안락한 상태를 가리키므로, 지나치게 물질적 번영으로 치우치지 않는 ‘편안하였고’로 옮겼습니다.
- source_word: וְרַעְנַן
  english_pob_choice: flourishing
  chosen_korean: 번성하고 있었습니다
  alternatives_korean:
