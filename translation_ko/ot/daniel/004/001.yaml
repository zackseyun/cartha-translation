  text: 나, 느부갓네살은 내 집에서 편안했고 내 궁전에서 번성하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנָה
  english_pob_choice: I
  chosen_korean: 나
  alternatives_korean:
  - 내가
  - 저
  lexicon: HALOT
  rationale: 독립 인칭대명사이므로 한국어에서도 주어를 분명히 드러내는 ‘나’가 자연스럽고, 이어지는 왕 이름과의 병렬 구조를 유지합니다.
- source_word: נְבוּכַדְנֶצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
