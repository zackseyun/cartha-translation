base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/001.yaml
  text: I[a], Nebuchadnezzar[b], was at ease in my house and flourishing in my palace.
  footnotes:
  - marker: a
    text: Or 'secure' for 'at ease'; the Aramaic term can emphasize tranquility or security.
    reason: lexical_alternative
  - marker: b
    text: Or 'thriving' for 'flourishing'; the term conveys vigorous well-being or prosperity.
    reason: lexical_alternative
translation:
  language: ko
  text: 나, 느부갓네살은 내 집에서 편안하였고 내 궁전에서 번성하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנָה
  english_pob_choice: I
  chosen_korean: 나
  alternatives_korean:
  - 내가
  - 저
  lexicon: HALOT
  rationale: 독립 인칭대명사이므로 한국어에서도 주어를 분명히 드러내는 ‘나’가 자연스럽고, 이어지는 왕 이름과의 병렬 구조를 유지합니다.
- source_word: נְבוּכַדְנֶצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부캇네살
  - 네부카드네자르
  lexicon: 고유명사 표기 관례
  rationale: 한국어 성경에서 널리 통용되는 고유명사 표기를 따랐습니다.
- source_word: שְׁלֵה
  english_pob_choice: at ease
  chosen_korean: 편안하였고
  alternatives_korean:
  - 안온하였고
  - 평안하였고
  - 안전하였고
  lexicon: HALOT
  rationale: 문맥상 내적 안정과 안락한 상태를 가리키므로, 지나치게 물질적 번영으로 치우치지 않는 ‘편안하였고’로 옮겼습니다.
- source_word: וְרַעְנַן
  english_pob_choice: flourishing
  chosen_korean: 번성하고 있었습니다
  alternatives_korean:
  - 무성하였습니다
  - 활기차 있었습니다
  - 흥왕하고 있었습니다
  lexicon: HALOT
  rationale: ‘생기 있게 번성함’이라는 뜻을 살리되, 왕의 상태를 설명하는 문맥에 맞게 자연스러운 동사구로 옮겼습니다.
theological_decisions:
- issue: פּersonal state description in a royal self-report
  chosen_reading: 이 절은 느부갓네살이 꿈 사건 직전 자신의 안정과 번영을 회고하는 자술로 읽었습니다.
  alternative_readings:
  - 단순한 생활 묘사로 약화하기
  - 재물의 풍요만을 강조하기
  rationale: ארמית 형용사 두 개는 내적 평안과 외적 활력을 함께 보여 주므로, 둘 다 살려 왕의 자기 인식의 대비를 준비합니다.
  doctrine_reference: 문맥 주해
