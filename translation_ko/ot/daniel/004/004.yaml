  source_fidelity: ‘점성술사들’은 חַרְטֻמַיָּא(마술·비술 관련 궁정 전문가)의 적절한 대응어가 아니며, 오히려 점성술사라는 별도 직능을 뜻합니다. 또한 원문의 정관·문맥상 특정한 꿈을 가리키므로 ‘그 꿈’이 더 충실합니다. 마지막 절의 ‘알려 주지 않았습니다’는 לָא מְהוֹדְעִין לִי의 직접 진술을 적절히 보존합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 네 집단의 병렬과 왕의 1인칭 진술을 분명하게 유지합니다. ‘그들 앞에서’는 קֳדָמֵיהוֹן의 대면·공개적 상황을 무리 없이 반영합니다.
  terminology: חַרְטֻמַיָּא는 ‘마술사들’로, אָשְׁפַיָּא는 ‘주술사들’로 구별했습니다. כַּשְׂדָּיָא는 기술적 집단 명칭일 가능성을 본문에서는 ‘갈대아인들’로 보존하고 각주로 설명했습니다. פִשְׁרָא는 다니엘서의 기술적 용례에 따라 ‘해석’으로 유지했습니다.
  issues:
