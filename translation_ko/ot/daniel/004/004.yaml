    rationale: 영어 POB의 대안 독법 각주(마지막 절)와 ‘갈대아인들’ 문화 각주를 한국어 본문에서 각각 해당 위치에 연결해야 합니다. 초안의 ‘그들 앞에서’ 설명 각주는 영어 감사 기록에 없는 새 주석이며, 대안 독법 각주를 누락합니다.
