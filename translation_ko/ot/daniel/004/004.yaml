    issue: ‘점성술사들’
    rationale: 원문의 첫 직능 חַרְטֻמַיָּא는 마술·비술 관련 전문가를 가리키며, ‘점성술사’는 이 목록에서 원문이 직접 사용하지 않은 특정 직능으로 의미를 좁힙니다.
