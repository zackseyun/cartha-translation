id: DAN.4.4
reference: Daniel 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן עללין חַרְטֻמַיָּ/א֙ אָֽשְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א וְ/חֶלְמָ֗/א אָמַ֤ר אֲנָה֙ קֳדָ֣מֵי/ה֔וֹן וּ/פִשְׁרֵ֖/הּ לָא מְהוֹדְעִ֥ין לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/004.yaml
  text: Then the magicians[a], enchanters, Chaldeans, and diviners came in, and I told the dream before them[b], but they did not make its interpretation known to me.
  footnotes:
  - marker: a
    text: Or, 'they could not make its interpretation known to me.' The Aramaic directly says they did not make it known; inability is a contextual inference reflected in some translations.
    reason: alternative_reading
  - marker: b
    text: '''Chaldeans'' may refer here not merely to an ethnic group but to a class of Babylonian court experts.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 마술사들, 주술사들, 갈대아인들[b], 점복자들이 들어왔습니다. 저는 그들 앞에서 그 꿈을 말했지만, 그들은 그 해석을 저에게 알려 주지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 그 해석을 저에게 알려 줄 수 없었습니다.” 아람어는 직접적으로 그들이 그 해석을 알려 주지 않았다고 말하며, 그들이 할 수 없었다는 뜻은 문맥에서 추론할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘갈대아인들’은 여기서 단순한 민족명만이 아니라 바빌론 궁정의 전문가 집단을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  - 이에
  lexicon: HALOT
  rationale: 아람어 담화 표지로서 다음 사건을 순차적으로 이어 주므로, 현대 한국어에서 자연스러운 시간 연결어인 ‘그때’로 옮겼습니다.
- source_word: חַרְטֻמַיָּא / אָשְׁפַיָּא / כַּשְׂדָּיָא / גָזְרַיָּא
  english_pob_choice: magicians, enchanters, Chaldeans, and diviners
  chosen_korean: 점성술사들과 주술사들, 갈대아인들과 점복자들
  alternatives_korean:
  - 마술사들, 주술사들, 갈대아인들과 점쟁이들
  - 박사들, 주문사들, 갈대아인들과 점복자들
  lexicon: HALOT
  rationale: 네 부류의 바빌론 궁정 전문가 목록을 한국어에서 구별되게 유지하되, 지나치게 교회적이거나 시대착오적인 표현은 피했습니다. ‘갈대아인들’은 POB처럼 직역형 고유명/직능 용법을 보존했습니다.
- source_word: אָמַר אֲנָה קֳדָמֵיהוֹן
  english_pob_choice: I told the dream before them
  chosen_korean: 저는 그들 앞에서 꿈을 말했습니다
  alternatives_korean:
  - 저는 그들 앞에서 그 꿈을 이야기했습니다
  - 저는 그들 앞에서 꿈을 전했습니다
  lexicon: HALOT
  rationale: ‘before them’의 공개적·대면적 뉘앙스를 ‘그들 앞에서’로 살리고, ‘אָמַר’의 직접적 서술을 ‘말했습니다’로 옮겨 아람어의 간결함을 유지했습니다.
- source_word: וּפִשְׁרֵהּ לָא מְהוֹדְעִין לִי
  english_pob_choice: but they did not make its interpretation known to me
  chosen_korean: 그들은 그 해석을 저에게 알려 주지 않았습니다
  alternatives_korean:
  - 그들은 그 해석을 저에게 말해 주지 않았습니다
  - 그들은 그 해석을 저에게 밝히지 않았습니다
  lexicon: HALOT
  rationale: 아람어의 사역적 표현 ‘알려 주다’를 살려, 단순히 ‘할 수 없었다’고 확장하지 않고 원문의 절제된 부정을 보존했습니다.
theological_decisions:
- issue: 마지막 절의 의미를 ‘못했다’로 보강할지, ‘알려 주지 않았다’로 유지할지
  chosen_reading: 원문의 직접 진술대로 ‘알려 주지 않았습니다’로 유지했습니다.
  alternative_readings:
  - 그들은 그 해석을 제게 알릴 수 없었습니다
  - 그들은 그 해석을 제게 알려 주지 못했습니다
  rationale: 아람어는 능력 부정보다 비고지/불통지의 형태를 직접 말하므로, 문맥이 시사하는 무능력은 주석적 함의로 남기고 번역은 원문 수준의 절제를 지켰습니다.
  doctrine_reference: 원문 우선과 의미 확장 자제; 번역에서 추론을 본문에 과도하게 주입하지 않음.
