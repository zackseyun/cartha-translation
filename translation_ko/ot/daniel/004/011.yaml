base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/011.yaml
  text: 'He cried aloud and said thus: ‘Chop down the tree[a], and cut off its branches; strip off its foliage, and scatter its fruit. Let the beasts flee from beneath it[b], and the birds from its branches.’'
  footnotes:
  - marker: a
    text: Or 'cut down the tree.'
    reason: lexical_alternative
  - marker: b
    text: The final clause is elliptical in Aramaic; the sense is that the birds also are to flee from its branches.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 큰 소리로 외쳐 이렇게 말했습니다. 「그 나무를 베어 버리고, 그 가지를 잘라 내며, 그 잎을 벗겨 내고, 그 열매를 흩어 버리십시오. 짐승들이 그 아래에서 달아나고, 새들도 그 가지에서 달아나게 하십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사는 ‘베다/찍어 넘어뜨리다’와 ‘자르다’의 강도가 다를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 아람어에서 생략이 있는 평행구로, 새들도 가지에서 달아나라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרֵא בְחַיִל
  english_pob_choice: He cried aloud
  chosen_korean: 큰 소리로 외쳐
  alternatives_korean:
  - 크게 외쳐
  - 힘차게 외쳐
  lexicon: HALOT
  rationale: 강한 음성으로 외치는 뜻을 자연스러운 합쇼체로 옮기되, 단순한 ‘말하다’보다 공적이고 강한 선언의 뉘앙스를 살렸습니다.
- source_word: גֹּדּוּ אִילָנָא
  english_pob_choice: Chop down the tree
  chosen_korean: 그 나무를 베어 버리고
  alternatives_korean:
  - 그 나무를 찍어 넘어뜨리고
  - 그 나무를 잘라 내고
  lexicon: HALOT
  rationale: 첫 명령은 나무를 통째로 쓰러뜨리는 강한 절단을 가리키므로, ‘베어 버리고’가 힘을 가장 잘 전달합니다.
- source_word: וְקַצִּצוּ עַנְפוֹהִי
  english_pob_choice: and cut off its branches
  chosen_korean: 그 가지를 잘라 내며
  alternatives_korean:
  - 그 가지를 쳐 내며
  - 그 가지를 잘라 버리며
  lexicon: HALOT
  rationale: 두 번째 명령은 첫 번째보다 한 단계 세부적인 절단이므로, ‘잘라 내며’로 구분을 살렸습니다.
- source_word: אַתַּרוּ עָפְיֵהּ / וּבַדַּרוּ אִנְבֵּהּ
  english_pob_choice: strip off its foliage, and scatter its fruit
  chosen_korean: 그 잎사귀를 벗기고, 그 열매를 흩어 버리십시오
  alternatives_korean:
  - 그 잎을 벗기고, 그 열매를 흩어 버리십시오
  - 그 잎사귀를 떼어 내고, 그 열매를 흩어 버리십시오
  lexicon: HALOT
  rationale: ‘잎사귀’는 עָפְיֵהּ의 집합적 잎/잎사귀를, ‘벗기다’는 제거의 동작을, ‘흩어 버리다’는 산개시키는 동작을 자연스럽게 반영합니다.
theological_decisions:
- issue: 명령형 연쇄와 마지막 병렬절의 지시 뉘앙스
  chosen_reading: 연속된 명령문으로 직역하고, 마지막 병렬절도 같은 지시적 힘을 갖는 것으로 처리했습니다.
  alternative_readings:
  - 마지막 절을 단순 서술형으로 낮추는 번역
  - 마지막 절을 더 완화하여 ‘달아나게 하라’ 대신 ‘떠나게 하라’로 번역
  rationale: 아람어는 명령들이 이어지며 마지막 병렬절도 동일한 파괴-추방의 흐름 안에 있으므로, 한국어에서도 지시문으로 유지해야 장면의 압박감이 보존됩니다.
  doctrine_reference: Translation philosophy §5–6
