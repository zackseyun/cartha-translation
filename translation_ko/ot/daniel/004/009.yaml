id: DAN.4.9
reference: Daniel 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֜וֹ/הִי תַּטְלֵ֣ל חֵיוַ֣ת בָּרָ֗/א וּ/בְ/עַנְפ֨וֹ/הִי֙ ידרון צִפֲּרֵ֣י שְׁמַיָּ֔/א וּ/מִנֵּ֖/הּ יִתְּזִ֥ין כָּל בִּשְׂרָֽ/א־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/009.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field found shade, and in its branches the birds of the heavens dwelt, and from it all flesh was fed.
  footnotes:
  - marker: a
    text: Or 'all living creatures.' The Aramaic literally reads 'all flesh,' a biblical idiom for all animate beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 잎사귀는 아름답고 열매는 풍성했으며, 그 안에는 모두에게 먹을 것이 있었습니다. 그 아래에서는 들짐승들이 그늘을 찾았고, 그 가지들에는 하늘의 새들이 깃들었으며, 그로부터 모든 육체가 먹을 것을 공급받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 육체’입니다. 여기서는 모든 살아 있는 존재를 가리키는 성경적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  english_pob_choice: its foliage
  chosen_korean: 그 잎사귀는
  alternatives_korean:
  - 그 잎들
  - 그 수풀
  lexicon: HALOT
  rationale: 나무의 잎 무리를 가리키는 말이므로 단수처럼 처리한 ‘그 잎사귀’가 자연스럽고, 원문의 집합적 이미지를 살릴 수 있습니다.
- source_word: שַׁפִּיר / שַׂגִּיא
  english_pob_choice: beautiful / abundant
  chosen_korean: 아름답고 … 풍성했으며
  alternatives_korean:
  - 아름답고 … 많았으며
  - 곱고 … 충만했으며
  lexicon: HALOT
  rationale: ‘아름답다’는 שַׁפִּיר의 기본 의미를, ‘풍성하다’는 열매가 많다는 שַׂגִּיא의 뉘앙스를 현대 한국어로 자연스럽게 옮깁니다.
- source_word: מָזוֹן לְכֹלָּא
  english_pob_choice: food for all
  chosen_korean: 모든 이에게 먹을 것이
  alternatives_korean:
  - 모든 자를 위한 양식이
  - 모든 이를 위한 먹을거리가
  lexicon: HALOT
  rationale: מָזוֹן은 단순한 ‘식량/양식’보다 문맥상 ‘먹을 것, 먹거리’가 직접적이며, לְכֹלָּא의 보편성을 ‘모든 이에게’로 살렸습니다.
- source_word: תַּטְלֵל חֵיוַת בָּרָא
  english_pob_choice: the beasts of the field found shade
  chosen_korean: 들짐승들이 그늘을 찾았고
  alternatives_korean:
  - 들짐승들이 그 아래에서 쉬었고
  - 들짐승들이 그 아래에 머물렀고
  lexicon: HALOT
  rationale: 동사의 핵심인 ‘그늘을 얻다/찾다’를 살리되, 한국어로는 ‘그늘을 찾다’가 가장 간결하게 원문 이미지를 전달합니다.
- source_word: צִפֲּרֵי שְׁמַיָּא
  english_pob_choice: the birds of the heavens
  chosen_korean: 하늘의 새들이
  alternatives_korean:
  - 하늘의 새들이
  - 하늘의 새떼가
  lexicon: HALOT
  rationale: ‘하늘’은 שְׁמַיָּא의 직역이며, 복수 명사구를 한국어에서는 자연스럽게 단수 속격으로 정리했습니다.
- source_word: כָּל בִּשְׂרָא
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 생명체
  - 모든 살아 있는 것
  lexicon: HALOT
  rationale: 원문의 관용구를 그대로 살려 ‘모든 육체’로 옮겼습니다. 이는 단순한 인체가 아니라 모든 생물 일반을 가리키는 성경적 표현입니다.
theological_decisions:
- issue: כָּל בִּשְׂרָא의 관용적 의미 보존
  chosen_reading: ‘모든 육체’라는 직역을 본문에 유지하되, 독자가 생물 일반을 뜻하는 관용구로 읽도록 합니다.
  alternative_readings:
  - ‘모든 생물’로 명시적으로 풀어쓰기
  - ‘모든 살아 있는 것’으로 의역
  rationale: 이 구절은 교리적 논쟁점은 아니지만, 원문의 성경적 어법과 상호본문성을 살리는 것이 중요하므로 직역을 우선했습니다.
  doctrine_reference: Translation philosophy §3, §5
