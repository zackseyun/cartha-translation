  source_fidelity: 수정이 필요합니다. 초안의 ‘아무것도 아닌 자들’은 사람들이 존재하지 않는다는 뜻으로도 읽힐 수 있으므로, 평가·간주의 뜻을 직접 나타내는 ‘아무것도 아닌 것으로 여겨지며’가 כְּלָה חֲשִׁיבִין에 더 충실합니다. 또한 יְמַחֵא בִידֵהּ의 손을 치는 이미지는 본문에 보존하고, 관용적 의미는 주석으로 설명하는 편이 영어 POB의 번역 방침과 원문 표현을 함께 반영합니다.
  naturalness: ‘땅에 사는 모든 이’와 ‘하늘의 군대’는 현대 표준어의 격식 있는 문체에서 자연스럽습니다. ‘그의 손을 칠’은 낯선 문자적 표현이지만, 바로 붙는 주석이 그 관용적 의미를 밝혀 주므로 의도적으로 보존할 수 있습니다.
  terminology: ‘하늘의 군대’는 חֵיל שְׁמַיָּא의 군사적 비유를 유지하면서 천사나 천체로 범위를 한정하지 않습니다. 주어는 문맥상 지극히 높으신 분이지만 원문과 같이 ‘그는’으로 유지했고, 합쇼체에 맞춰 ‘행하십니다’와 ‘하셨습니까’를 사용했습니다.
