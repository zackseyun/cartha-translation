id: DAN.4.32
reference: Daniel 4:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל דארי אַרְעָ/א֙ כְּ/לָ֣ה חֲשִׁיבִ֔ין וּֽ/כְ/מִצְבְּיֵ֗/הּ עָבֵד֙ בְּ/חֵ֣יל שְׁמַיָּ֔/א ו/דארי אַרְעָ֑/א וְ/לָ֤א אִיתַי֙ דִּֽי יְמַחֵ֣א בִ/ידֵ֔/הּ וְ/יֵ֥אמַר לֵ֖/הּ מָ֥ה עֲבַֽדְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/032.yaml
  text: And all the inhabitants of the earth are regarded as nothing[a], and he does according to his will among the army of heaven and among the inhabitants of the earth; and there is no one who can strike his hand or say to him[b], “What have you done?”
  footnotes:
  - marker: a
    text: Or 'the host of heaven.'
    reason: lexical_alternative
  - marker: b
    text: 'Literally ''strike his hand''; that is, hinder or restrain him. Traditional English: ''stay his hand.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 땅에 사는 모든 이는 아무것도 아닌 것으로 여겨지며, 그는 하늘의 군대[a]와 땅에 사는 이들 가운데서 자신의 뜻대로 행하십니다. 그의 손을 칠[b] 수도, 그에게 “무엇을 하셨습니까?”라고 말할 수도 있는 이는 아무도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘 군대’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손을 치다’입니다. 관용적으로는 그를 막거나 제지한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דארי אַרְעָא
  english_pob_choice: the inhabitants of the earth
  chosen_korean: 땅의 모든 주민
  alternatives_korean:
  - 땅의 거주자들
  - 땅에 사는 사람들
  lexicon: HALOT
  rationale: 거주하는 자들을 가리키는 표현을 자연스러운 현대 한국어로 옮기되, 범위를 넓게 드러내기 위해 ‘모든 주민’을 택했습니다.
- source_word: כְלָה חֲשִׁיבִין
  english_pob_choice: are regarded as nothing
  chosen_korean: 아무것도 아닌 자들로 여겨지며
  alternatives_korean:
  - 무로 여겨지며
  - 아무것도 아닌 것으로 간주되며
  lexicon: HALOT
  rationale: 평가·간주의 의미를 살리면서, 창조주 앞에서 인간의 상대적 무가치를 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: בְּחֵיל שְׁמַיָּא
  english_pob_choice: the army of heaven
  chosen_korean: 하늘 군대
  alternatives_korean:
  - 하늘의 군대
  - 하늘의 군사들
  - 하늘 군대
  lexicon: HALOT
  rationale: חֵיל의 군사적 뉘앙스를 살려 ‘host’보다 더 직역적인 ‘군대’를 택했고, 소유격을 붙여 하늘에 속한 존재들의 영역을 분명히 했습니다.
- source_word: יְמַחֵא בִידֵהּ
  english_pob_choice: can strike his hand
  chosen_korean: 그의 손을 막거나
  alternatives_korean:
  - 그의 손을 치거나
  - 그의 손을 붙들거나
  - 그의 손을 제지하거나
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 이 표현은 관용적으로 ‘막다/제지하다’의 뜻이므로, 한국어 본문에는 관용 의미를 살리되 손의 이미지를 유지했습니다.
- source_word: מָה עֲבַדְתְּ
  english_pob_choice: What have you done?
  chosen_korean: “무엇을 하셨습니까?”
  alternatives_korean:
  - “무엇을 하셨습니까?”
  - “무엇을 하셨습니까?”
  lexicon: HALOT
  rationale: 왕의 직접 반문 형식을 살리면서도, 한국어 문맥상 하나님께 드리는 호칭이 아니라 독백적 도전으로 읽히도록 과도한 경어를 피하지 않되 문어체로 정리했습니다.
theological_decisions:
- issue: ‘he’의 지시 대상과 신성한 주어의 처리
  chosen_reading: 문맥상 지극히 높으신 분이 자신 뜻대로 행하시는 것으로 읽되, 본문 자체는 인칭 대명사 ‘그는’을 유지했습니다.
  alternative_readings:
  - ‘하나님이’로 명시
  - ‘주님이’로 명시
  rationale: 아람어 본문은 문맥이 지시 대상을 밝히지만 여기서는 주어를 삽입하지 않는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘하늘 군대’의 범위
  chosen_reading: 천상 존재들을 특정하지 않고 넓게 열어 둔 ‘하늘 군대’로 옮겼습니다.
  alternative_readings:
  - ‘하늘의 천사들’
  - ‘하늘의 군대’
  rationale: 본문은 천사나 별로 좁혀 말하지 않으므로, 의미 범위를 보존하는 번역이 더 안전합니다.
  doctrine_reference: Translation philosophy §3
