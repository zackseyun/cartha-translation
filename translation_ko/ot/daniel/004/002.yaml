translation:
  language: ko
  text: 내가 꿈을 하나 보았는데, 그 꿈이 나를 두렵게 하였고, 침상에 누워 있을 때 떠오른 생각들과 머릿속의 환상들이 나를 크게 놀라게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘침상에 누워 있을 때의 상념들과 머릿속의 환상들이 나를 불안하게 하였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵ֥לֶם
  english_pob_choice: a dream
  chosen_korean: 한 꿈
  alternatives_korean:
  - 꿈
  - 어떤 꿈
  lexicon: HALOT
  rationale: 아람어 명사 חֵלֶם은 ‘꿈’을 뜻하므로, 영어의 부정관사 효과를 살려 ‘한 꿈’으로 옮겼습니다.
- source_word: חֲזֵ֖ית
  english_pob_choice: I saw
  chosen_korean: 내가 … 보았는데
  alternatives_korean:
  - 내가 보았습니다
  - 내가 … 보았습니다
  lexicon: HALOT
  rationale: 동사 חזי의 단순한 ‘보다’ 의미를 자연스러운 서술체로 살려 ‘보았는데’로 처리했습니다.
- source_word: וִידַחֲלִנַּנִי
  english_pob_choice: and it frightened me
  chosen_korean: 그것이 나를 두렵게 하였고
  alternatives_korean:
  - 그것이 나를 무섭게 하였고
  - 그것이 나를 놀라게 하였고
  lexicon: HALOT
  rationale: דחל은 ‘두려워하게 하다, 무서워하게 하다’의 뜻이므로, 앞의 ‘꿈’이 원인이라는 점을 분명히 하는 수동적·사역적 표현으로 옮겼습니다.
- source_word: וְהַרְהֹרִין עַל מִשְׁכְּבִי
  english_pob_choice: and the thoughts on my bed
  chosen_korean: 내 침상 위의 생각들
  alternatives_korean:
  - 내 침상에서의 생각들
  - 침상 위에서 떠오른 생각들
  lexicon: HALOT
  rationale: הרהר의 뜻을 따라 ‘생각들’로 옮기고, מקום을 나타내는 ‘침상 위’를 유지하여 꿈꾸는 자리의 이미지를 살렸습니다.
- source_word: וְחֶזְוֵי רֵאשִׁי
  english_pob_choice: and the visions of my head
  chosen_korean: 내 머리의 환상들
  alternatives_korean:
  - 내 머리 속의 환상들
  - 내 머리의 이상들
  lexicon: HALOT
  rationale: חזוי는 ‘환상, 보이는 것’의 의미이므로, 히브리식 관용구를 과도하게 직역하기보다 한국어에서 자연스러운 ‘내 머리의 환상들’로 옮겼습니다.
- source_word: יְבַהֲלֻנַּנִי
  english_pob_choice: terrified me
  chosen_korean: 나를 놀라게 하였습니다
  alternatives_korean:
  - 나를 공포에 떨게 하였습니다
  - 나를 떨게 하였습니다
  lexicon: HALOT
  rationale: בהל은 ‘놀라게 하다, 불안하게 하다’의 폭을 가지므로, 앞의 ‘두렵게 하다’와 어감을 구별하면서도 강도를 유지하는 ‘놀라게 하다’를 택했습니다.
theological_decisions:
- issue: ‘visions of my head’의 직역성과 가독성 사이의 균형
  chosen_reading: 히브리식 관용구를 완전히 평탄화하지 않고 ‘내 머리의 환상들’로 옮겨, 꿈-환상-두려움의 연결을 유지했습니다.
  alternative_readings:
  - 내 마음의 환상들
  - 내 머릿속 환상들
  rationale: 원문은 신체 부위를 매개로 한 관용적 표현을 사용하므로, 의미는 분명하게 하되 이미지 자체를 보존하는 편이 소스 충실성에 더 가깝습니다.
  doctrine_reference: source-language imagery and semantic retention
- issue: ‘frightened’와 ‘terrified’의 이중 감정 표현
  chosen_reading: 앞에서는 ‘두렵게 하다’, 뒤에서는 ‘놀라게 하다’로 구분해 반복을 살리면서도 한국어 어감을 다르게 했습니다.
  alternative_readings:
  - 두렵게 하였다… 두렵게 하였다
  - 무섭게 하였다… 놀라게 하였다
  rationale: 원문은 두 동사를 병렬로 두어 체험의 중첩을 강조하므로, 동일어 반복을 피하되 각 동사의 긴장감을 유지했습니다.
  doctrine_reference: Hebrew/Aramaic parallelism
