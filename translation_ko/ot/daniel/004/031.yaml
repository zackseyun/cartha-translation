  source_fidelity: 핵심 내용은 대체로 원문에 충실합니다. 다만 מַנְדְּעִי를 옮긴 ‘지각’은 현대 한국어에서 감각적 지각으로도 흔히 이해되어, 이 문맥의 회복된 이해력·이성이라는 뜻을 충분히 전달하지 못합니다. 또한 각주 표지가 해당 어휘가 아닌 절 끝에 놓여 있어 이동하는 것이 적절합니다.
  naturalness: ‘그 날들의 끝에’와 ‘내 지각이 내게로 돌아왔습니다’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘그 날들이 끝날 때에’와 ‘내 총명이 내게 돌아왔습니다’는 원문의 형식과 문맥을 유지하면서 더 자연스럽습니다. ‘나라는 대대로 이어집니다’도 자연스럽고, 세대 간 지속이라는 관용구를 잘 전달합니다.
  terminology: ‘지극히 높으신 분’은 다니엘서의 신칭으로 적절하며, בָּרְכֵת와 뒤따르는 두 찬양 동사의 구별은 ‘찬송하고 … 찬양하고 높였습니다’로 보존할 수 있습니다. ‘영원히 살아 계시는 분’도 경건한 합쇼체 문체에 자연스럽습니다.
