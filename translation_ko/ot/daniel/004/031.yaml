id: DAN.4.31
reference: Daniel 4:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/קְצָ֣ת יֽוֹמַיָּ/ה֩ אֲנָ֨ה נְבוּכַדְנֶצַּ֜ר עַיְנַ֣/י לִ/שְׁמַיָּ֣/א נִטְלֵ֗ת וּ/מַנְדְּעִ/י֙ עֲלַ֣/י יְת֔וּב ו/ל/עלי/א בָּרְכֵ֔ת וּ/לְ/חַ֥י עָלְמָ֖/א שַׁבְּחֵ֣ת וְ/הַדְּרֵ֑ת דִּ֤י שָׁלְטָנֵ/הּ֙ שָׁלְטָ֣ן עָלַ֔ם וּ/מַלְכוּתֵ֖/הּ עִם דָּ֥ר וְ/דָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/031.yaml
  text: At the end of the days[a], I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding returned to me; and I blessed the Most High, and I praised and honored him who lives forever, for his dominion is an everlasting dominion, and his kingdom is from generation to generation.
  footnotes:
  - marker: a
    text: Or, 'my reason returned to me.' The Aramaic term can denote knowledge, understanding, or reason.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날들의 끝에, 나 느부갓네살은 하늘을 향해 내 눈을 들었고, 내 지각이 내게로 돌아왔습니다. 나는 지극히 높으신 이를 찬송하고, 영원히 살아 계시는 이를 찬양하며 높였습니다. 그의 통치는 영원한 통치이며, 그의 나라는 대대로 이어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지각’은 여기서 지식, 이해, 이성 또는 분별의 회복을 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִקְצָת יֽוֹמַיָּה
  english_pob_choice: At the end of the days
  chosen_korean: 그 날들의 끝에
  alternatives_korean:
  - 그 시기의 끝에
  - 그 날이 다할 때에
  lexicon: HALOT
  rationale: 아람어 관용구의 종결 시점을 살리되, 한국어에서 자연스럽고 문맥상 예언된 기간의 종료를 분명히 드러냅니다.
- source_word: עַיְנַי לִשְׁמַיָּא נִטְלֵת
  english_pob_choice: lifted my eyes to heaven
  chosen_korean: 하늘을 향해 내 눈을 들었고
  alternatives_korean:
  - 하늘을 바라보았고
  - 하늘로 눈을 들었고
  lexicon: HALOT
  rationale: 신체적 동작과 하나님께로의 전환을 함께 드러내는 직역에 가깝게 옮겼습니다.
- source_word: וּמַנְדְּעִי עֲלַי יְתוּב
  english_pob_choice: my understanding returned to me
  chosen_korean: 내 지각이 내게로 돌아왔습니다
  alternatives_korean:
  - 내 이해가 돌아왔습니다
  - 내 이성이 내게로 돌아왔습니다
  lexicon: HALOT
  rationale: מַנְדַּע의 의미 범위(지식, 이해, 이성)를 유지하면서, 본문이 묘사하는 회복을 지나치게 심리학적으로 제한하지 않기 위해 ‘지각’을 택했습니다.
- source_word: שַׁבְּחֵת וְהַדְּרֵת
  english_pob_choice: praised and honored
  chosen_korean: 찬양하며 높였습니다
  alternatives_korean:
  - 찬양하고 존귀하게 하였고
  - 찬송하고 영화롭게 하였습니다
  lexicon: HALOT
  rationale: 두 동사를 한국어에서 완전히 동일시하지 않으면서도, 왕 앞에서 하나님을 높이는 예배적 행위를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 다니엘 4장의 이방 왕 고백에서 하나님의 호칭과 예배 동사의 톤
  chosen_reading: ‘지극히 높으신 이’와 ‘영원히 살아 계시는 이’를 유지하고, 합쇼체 서술로 경외의 분위기를 살렸습니다.
  alternative_readings:
  - ‘가장 높으신 분’
  - ‘영원히 사시는 분’
  rationale: 본문의 공식적 찬양문 구조를 보존하면서, 다니엘서의 대표적 신칭을 표준화해 독자가 화자 전환과 신적 위엄을 바로 알아듣게 했습니다.
  doctrine_reference: Daniel 4:31 doxology and divine kingship
