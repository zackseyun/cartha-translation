base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
  footnotes:
  - marker: a
    text: Or 'my understanding' for 'my reason.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my advisers and my great men sought me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I was restored/confirmed over my kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 내 이성이 내게로 돌아왔고[a], 내 왕국의 영광을 위하여 내 위엄과 광채도 내게로 돌아왔습니다. 내 조언자들과 내 귀족들이 나를 찾았고[b], 나는 내 왕국을 다스리는 자리에 다시 세워졌으며[c], 더욱 큰 위대함이 내게 더하여졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 이해’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 조언자들과 내 귀인들이 나를 찾았다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나는 내 왕국을 다스리는 자리에 회복되었으며’ 또는 ‘굳게 세워졌으며’로 옮길 수 있습니다.
    reason: lexical_alternative
