- from: 그때에 내 총명이 내게로 돌아오고, 내 나라의 영광을 위하여 내 위엄과 내 찬란함도 내게로 돌아왔습니다. 내 조언자들과 내 귀족들이 나를 찾았고, 나는 내 나라 위에 다시 세워졌으며, 뛰어난 큰 위가 내게 더하여졌습니다.[a][b][c]
  to: 그때에 내 이성이 내게로 돌아왔고[a], 내 왕국의 영광을 위하여 내 위엄과 광채도 내게로 돌아왔습니다. 내 조언자들과 내 귀족들이 나를 찾았고[b], 나는 내 왕국을 다스리는 자리에 다시 세워졌으며[c], 더욱 큰 위대함이 내게 더하여졌습니다.
