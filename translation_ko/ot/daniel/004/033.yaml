source:
  edition: WLC
  text: בֵּ/הּ זִמְנָ֞/א מַנְדְּעִ֣/י יְת֣וּב עֲלַ֗/י וְ/לִ/יקַ֨ר מַלְכוּתִ֜/י הַדְרִ֤/י וְ/זִוִ/י֙ יְת֣וּב עֲלַ֔/י וְ/לִ֕/י הַדָּֽבְרַ֥/י וְ/רַבְרְבָנַ֖/י יְבַע֑וֹן וְ/עַל מַלְכוּתִ֣/י הָתְקְנַ֔ת וּ/רְב֥וּ יַתִּירָ֖ה ה֥וּסְפַת לִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
  footnotes:
  - marker: a
    text: Or 'my understanding' for 'my reason.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my advisers and my great men sought me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I was restored/confirmed over my kingdom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 내 총명이 내게로 돌아오고, 내 나라의 영광을 위하여 내 위엄과 내 찬란함도 내게로 돌아왔습니다. 내 조언자들과 내 귀족들이 나를 찾았고, 나는 내 나라 위에 다시 세워졌으며, 뛰어난 큰 위가 내게 더하여졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 이해'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '내 조언자들과 내 큰 사람들(귀인들)이 나를 찾았고'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '내 나라 위에 회복되었으며/확인되었으며'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא / At that time
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시각에
  - 그때
  lexicon: HALOT
  rationale: 아람어 시간표현의 서두 기능을 자연스러운 현대 한국어로 살리면서, 뒤따르는 회복 사건의 순서를 분명하게 보여 줍니다.
- source_word: מַנְדְּעִי / my reason
  english_pob_choice: my reason
  chosen_korean: 내 총명
  alternatives_korean:
  - 내 이성
  - 내 이해
  lexicon: HALOT
  rationale: POB의 'reason'을 문맥상 정신 회복의 의미로 읽어, '총명'으로 옮겨 단순한 지식보다 회복된 정신 능력을 드러냅니다.
- source_word: הַדְרִי וְזִוִי / my majesty and splendor
  english_pob_choice: my majesty and splendor
  chosen_korean: 내 위엄과 내 찬란함
  alternatives_korean:
  - 내 위엄과 내 광채
  - 내 존엄과 내 찬란함
  lexicon: HALOT
  rationale: 왕실 맥락의 두 명사를 각각 구분해, 위엄과 외적 광휘가 함께 회복된다는 점을 드러냈습니다.
- source_word: הַדָּבְרַי וְרַבְרְבָנַי / my counselors and my nobles
  english_pob_choice: my counselors and my nobles
  chosen_korean: 내 조언자들과 내 귀족들
  alternatives_korean:
  - 내 신하들과 내 귀인들
  - 내 자문관들과 내 귀족들
  lexicon: HALOT
  rationale: 궁정 내 직능과 신분을 함께 나타내는 표현으로, '조언자들'과 '귀족들'을 택해 관계와 위계를 살렸습니다.
- source_word: הָתְקְנַת / I was reestablished
  english_pob_choice: I was reestablished
  chosen_korean: 나는 내 나라 위에 다시 세워졌으며
  alternatives_korean:
  - 나는 내 나라 위에 회복되었으며
  - 나는 내 나라 위에 다시 확립되었으며
  lexicon: HALOT
  rationale: 단순한 복귀보다 왕권의 재설정·회복을 함께 담기 위해, 수동적 의미를 살린 '다시 세워졌으며'로 옮겼습니다.
theological_decisions:
- issue: 이 절의 회복이 지닌 신적 행위의 명시성
  chosen_reading: 본문이 직접 말하는 수동형을 따라, 하나님의 직접 언급을 덧붙이지 않고 '돌아오고', '돌아왔습니다', '다시 세워졌으며', '더하여졌습니다'로 번역했습니다.
  alternative_readings:
  - 하나님께서 내 총명을 돌려주셨습니다
  - 하나님께서 나를 내 나라 위에 다시 세우셨습니다
  rationale: 문맥 전체에서는 하나님의 주권이 분명하지만, 이 절 자체는 결과를 수동적으로 진술합니다. 번역에서 본문이 말하는 범위를 넘겨 신적 행위를 명시하지 않는 것이 source-direct합니다.
  doctrine_reference: Original-language primacy; preserve implicit agency when the verse itself remains implicit.
