theological_decisions:
- issue: 이 절의 회복이 지닌 신적 행위의 명시성
  chosen_reading: 본문이 직접 말하는 수동형을 따라, 하나님의 직접 언급을 덧붙이지 않고 '돌아오고', '돌아왔습니다', '다시 세워졌으며', '더하여졌습니다'로 번역했습니다.
  alternative_readings:
  - 하나님께서 내 총명을 돌려주셨습니다
  - 하나님께서 나를 내 나라 위에 다시 세우셨습니다
  rationale: 문맥 전체에서는 하나님의 주권이 분명하지만, 이 절 자체는 결과를 수동적으로 진술합니다. 번역에서 본문이 말하는 범위를 넘겨 신적 행위를 명시하지 않는 것이 source-direct합니다.
  doctrine_reference: Original-language primacy; preserve implicit agency when the verse itself remains implicit.
