lexical_decisions:
- source_word: כֹּלָּא
  english_pob_choice: All this
  chosen_korean: 이 모든 일
  alternatives_korean:
  - 모든 것
  - 이 모든 것이
  lexicon: HALOT
  rationale: 직전 문맥의 선언된 심판 전체를 가리키는 총괄 표현이므로, 한국어에서는 자연스럽게 ‘이 모든 일’로 옮겨 포괄성을 살렸습니다.
- source_word: מְּטָא
  english_pob_choice: came upon
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 임했습니다
  - 닥쳤습니다
  - 다가왔습니다
  lexicon: HALOT
  rationale: 동사의 ‘도착하다/이르다’ 의미와 심판이 인물에게 미친 결과를 함께 반영하되, 현대 한국어에서 문맥상 가장 매끄러운 결과 서술로 표현했습니다.
- source_word: עַל
  english_pob_choice: upon
  chosen_korean: 에게
  alternatives_korean:
  - 위에
  - 에게로
  - 에
  lexicon: HALOT
  rationale: ‘~에게 일어나다’는 한국어 결과 서술에서 판단·재앙이 누구에게 미쳤는지를 자연스럽게 표시합니다.
- source_word: מַלְכָּא
  english_pob_choice: King
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 아람어의 직함을 이름 뒤에 붙인 구조를 살려 ‘느부갓네살 왕’으로 옮겼습니다.
theological_decisions:
- issue: 심판의 도래를 나타내는 동사상 선택
  chosen_reading: ‘일어났습니다’로 옮겨, 사건이 실제로 성취되었다는 서술성을 강조했습니다.
  alternative_readings:
  - 임했습니다
  - 닥쳤습니다
  rationale: 문맥상 예언된 심판이 현실화되었음을 요약하는 종결 구문이므로, 과도하게 시적이거나 강한 정서를 덧씌우지 않는 범위에서 성취 완료를 분명히 했습니다.
  doctrine_reference: 하나님의 선언된 심판의 성취
