    rationale: לְסוֹף는 단수 ‘끝/극점’이며, ‘땅의 끝들’이 문자적 표현일 수 있다는 설명은 근거가 없습니다.
  revised_text: 왕께서 바로 그 왕이십니다. 왕께서는 위대해지고 강해지셨으며, 왕의 위대함은 커져 하늘에 이르렀고, 왕의 통치권은 땅의 끝까지 이르렀습니다.
