  verdict: revise
  source_fidelity: 개정이 필요합니다. 아람어 אַנְתָּה הוּא מַלְכָּא는 호격이 아니라 ‘왕께서 바로 그 왕이십니다’라는 식별 진술입니다. 초안의 ‘왕이여’는 원문에 없는 호격을 도입하고, 이어지는 ‘왕은’은 이 강조적 식별을 충분히 반영하지 못합니다. 나머지 왕의 성장, 위대함의 확장, 하늘에 이름, 땅 끝까지 이르는 통치권은 원문에 충실합니다.
  naturalness: ‘왕께서 바로 그 왕이십니다’와 ‘왕께서는 … 강해지셨으며’는 왕에게 직접 말하는 문맥에서 현대 표준어 합쇼체로 자연스럽습니다. ‘위대함은 커져’는 원문의 반복을 비교적 간결하게 보존합니다.
  terminology: ‘통치권’은 שָׁלְטָן의 통치 권능/지배권을 적절히 나타냅니다. 기존 각주가 ‘땅의 끝들’이 문자적 표현일 수 있다고 한 것은 단수 לְסוֹף אַרְעָא와 맞지 않으므로 삭제했습니다. ‘땅의 끝까지’ 자체가 원문과 영어 POB의 선택을 충실히 반영합니다.
  issues:
