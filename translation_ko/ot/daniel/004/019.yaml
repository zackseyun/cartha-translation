id: DAN.4.19
reference: Daniel 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אנתה ה֣וּא מַלְכָּ֔/א דִּ֥י רְבַ֖ית וּ/תְקֵ֑פְתְּ וּ/רְבוּתָ֤/ךְ רְבָת֙ וּ/מְטָ֣ת לִ/שְׁמַיָּ֔/א וְ/שָׁלְטָנָ֖/ךְ לְ/ס֥וֹף אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/019.yaml
  text: You are the king[a], who has grown great and strong; your greatness has become great and reached to heaven, and your dominion to the end of the earth.
  footnotes:
  - marker: a
    text: Or 'to the ends of the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이여, 왕은 커지고 강해졌으며, 왕의 위대함이 커져 하늘에 미쳤고 왕의 통치권은 땅의 끝까지 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅의 끝’은 문자적으로는 ‘땅의 끝들’도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה הוּא
  english_pob_choice: You are
  chosen_korean: 왕이여
  alternatives_korean:
  - 당신은
  - 왕은
  lexicon: BHS/Aramaic usage
  rationale: 이 구절은 느부갓네살을 직접 지칭하며 해몽자가 왕에게 말하는 장면이므로, 한국어에서는 호격을 살린 ‘왕이여’로 시작해 대상을 분명히 했습니다.
- source_word: רְבַית וּתְקֵפְתְּ
  english_pob_choice: has grown great and strong
  chosen_korean: 커지고 강해졌으며
  alternatives_korean:
  - 크고 강해졌으며
  - 커져서 강해졌으며
  lexicon: HALOT
  rationale: ‘גדל/תקף’의 성장을 나타내는 동사적 뉘앙스를 살려, 형용사 나열보다 ‘커지고 강해졌으며’로 자연스럽게 옮겼습니다.
- source_word: וּרְבוּתָךְ רְבָת
  english_pob_choice: your greatness has become great
  chosen_korean: 왕의 위대함이 커져
  alternatives_korean:
  - 왕의 위대함이 커졌고
  - 왕의 عظ대함이 더 커져
  lexicon: HALOT
  rationale: 동일 어근의 반복을 한국어에서도 살리기 위해 ‘위대함이 커져’로 옮겨, 단순한 ‘위엄’보다 원문의 반복 효과를 보존했습니다.
- source_word: וּמְטָת לִשְׁמַיָּא
  english_pob_choice: and reached to heaven
  chosen_korean: 하늘에 미쳤고
  alternatives_korean:
  - 하늘에 이르렀고
  - 하늘까지 닿았고
  lexicon: HALOT
  rationale: 동사의 도달 의미를 살리면서도 한국어 성경 문체에서 자연스러운 ‘미치다’를 사용해 도달의 극점을 표현했습니다.
- source_word: וְשָׁלְטָנָךְ לְסוֹף אַרְעָא
  english_pob_choice: and your dominion to the end of the earth
  chosen_korean: 왕의 통치권은 땅의 끝까지 이르렀습니다
  alternatives_korean:
  - 왕의 다스림은 땅의 끝까지 이르렀습니다
  - 왕의 주권은 땅 끝까지 이르렀습니다
  lexicon: HALOT
  rationale: ‘dominion’은 단순한 통치 행위보다 통치권/지배권을 뜻하므로 ‘통치권’으로 옮기되, ‘땅의 끝까지’로 원문의 보편적 확장을 보존했습니다.
theological_decisions:
- issue: 왕권의 범위에 대한 과장적 보편 표현
  chosen_reading: 고대 왕실 수사로서의 보편적 과장 표현을 그대로 살려, 실제 정치 지배의 범위를 좁혀 해석하지 않았습니다.
  alternative_readings:
  - 실질적 세계 지배
  - 단지 지역적 제국권
  rationale: 문맥은 신적 계시 안에서 왕의 권세가 극도로 확장되었음을 말하는 수사이므로, 의미를 축소하지 않고 원문의 과장을 유지하는 것이 적절합니다.
  doctrine_reference: 원문의 수사적 긴장을 보존한다.
