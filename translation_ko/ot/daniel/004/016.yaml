  rationale: 개정문은 아람어의 정서적 충격과 시간 표현을 유지하면서 한국어 문장 구조를 자연스럽게 다듬었습니다. 직접화법을 합쇼체로 통일했고, 왕에 대한 호칭을 문맥상 분명한 궁정 존칭으로 바꾸었습니다. 또한 잘못된 각주 앵커를 제거하고, 실제 어휘적 선택이 있는 ‘넋을 잃고 있었으며’에 각주를 정확히 연결했습니다.
