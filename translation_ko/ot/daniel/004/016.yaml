- from: 그때 다니엘, 곧 벨드사살이라고 불리던 사람이 한 시간가량 넋이 나가 있었고, 그의 생각들이 그를 두렵게 했습니다. 왕이 대답하며 말했습니다. “벨드사살아, 꿈이나 그 해석 때문에 두려워하지 말아라.” 벨드사살이 대답하며 말했습니다. “내 주여, 이 꿈은 당신을 미워하는 자들에게나[ [a] ] 그 해석은 당신의 원수들에게나 돌아가기를 바랍니다.”
