  text: אֱדַ֨יִן דָּֽנִיֵּ֜אל דִּֽי שְׁמֵ֣/הּ בֵּלְטְשַׁאצַּ֗ר אֶשְׁתּוֹמַם֙ כְּ/שָׁעָ֣ה חֲדָ֔ה וְ/רַעְיֹנֹ֖/הִי יְבַהֲלֻנֵּ֑/הּ עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר בֵּלְטְשַׁאצַּר֙ חֶלְמָ֤/א וּ/פִשְׁרֵ/א֙ אַֽל יְבַהֲלָ֔/ךְ עָנֵ֤ה בֵלְטְשַׁאצַּר֙ וְ/אָמַ֔ר מרא/י חֶלְמָ֥/א ל/שנאי/ך וּ/פִשְׁרֵ֥/הּ ל/ערי/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/016.yaml
  text: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
  footnotes:
  - marker: a
    text: Or 'was stunned' or 'was astonished.' The Aramaic verb can denote being shocked into silence; here the context favors emotional dismay.
    reason: lexical_alternative
  - marker: b
    text: Literally 'for one hour.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다니엘, 곧 벨드사살이라고 불리던 사람이 한 시간가량 넋이 나가 있었고, 그의 생각들이 그를 두렵게 했습니다. 왕이 대답하며 말했습니다. “벨드사살아, 꿈이나 그 해석 때문에 두려워하지 말아라.” 벨드사살이 대답하며 말했습니다. “내 주여, 이 꿈은 당신을 미워하는 자들에게나[ [a] ] 그 해석은 당신의 원수들에게나 돌아가기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신을 미워하는 자들에게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그때에
  lexicon: HALOT
  rationale: 서사 전개를 자연스럽게 잇는 담화 표지로, 시점 전환의 흐름을 살리면서도 현대 한국어에 자연스럽게 맞췄습니다.
- source_word: אֶשְׁתּוֹמַם
  english_pob_choice: was appalled
  chosen_korean: 넋이 나가 있었고
  alternatives_korean:
  - 충격을 받았고
  - 멍해 있었고
  - 놀라 넋을 잃었고
  lexicon: HALOT
  rationale: 단순한 ‘놀람’보다 말문이 막힐 정도의 충격과 당혹을 나타내므로, 문맥의 정서적 강도를 살리는 표현을 택했습니다.
- source_word: כְּשָׁעָה חֲדָה
  english_pob_choice: for about an hour
  chosen_korean: 한 시간가량
  alternatives_korean:
  - 약 한 시간 동안
  - 거의 한 시간 동안
  - 한 시간쯤
  lexicon: HALOT
  rationale: 직역의 ‘한 시간’ 의미를 유지하되, 관용적인 한국어로 시간의 대략성을 반영했습니다.
- source_word: וְרַעְיֹנֹהִי יְבַהֲלֻנֵּהּ
  english_pob_choice: and his thoughts terrified him
  chosen_korean: 그의 생각들이 그를 두렵게 했고
  alternatives_korean:
  - 그의 생각들이 그를 불안하게 했고
  - 그의 생각들이 그를 어지럽게 했고
  lexicon: HALOT
  rationale: ‘생각들’과 그로 인한 내적 동요를 그대로 옮기되, 원문의 강한 두려움 동사를 살렸습니다.
- source_word: מרא
  english_pob_choice: My lord
  chosen_korean: 내 주여
  alternatives_korean:
  - 주여
  - 내 주님
  - 나의 주인이여
  lexicon: HALOT
  rationale: 왕에 대한 공손한 호칭이므로 관계상 존칭을 유지하되, 신적 호칭으로 오해되지 않도록 문맥에 맞게 처리했습니다.
theological_decisions:
- issue: 다니엘의 아람어 왕호칭 מרא의 한국어 존칭 수준
  chosen_reading: 내 주여
  alternative_readings:
  - 주여
  - 내 주님
  - 내 주인이여
  rationale: 왕에게 드리는 궁정 예법의 존칭이므로, 예수나 하나님께 드리는 종교적 호칭과 구별되면서도 아람어의 공손함을 보존했습니다.
  doctrine_reference: Translation philosophy §6; courtly address distinction
