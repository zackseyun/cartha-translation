base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/008.yaml
  text: The tree grew large and became strong[a], and its height reached to the heavens, and it was visible to the end of the whole earth.
  footnotes:
  - marker: a
    text: Or 'its appearance was to the end of the whole earth.' The Aramaic noun can denote 'appearance/aspect' as well as what is seen, but the context favors the sense of visibility.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 나무는 자라서 크게 되고, 그 높이가 하늘에 이르렀으며, 온 땅의 끝까지 보였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모습이 온 땅의 끝까지 미쳤다.’ 아람어 명사는 ‘모습/외형’과 ‘보이는 것’ 모두를 가리킬 수 있으나, 문맥상 ‘보였다’는 뜻이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְבָה
  english_pob_choice: grew large
  chosen_korean: 자라서 크게 되고
  alternatives_korean:
  - 크게 자라고
  - 커지고
  lexicon: HALOT
  rationale: 동사의 증대·성장 의미를 살리되, 나무 이미지에 자연스러운 현대 한국어로 풀어 옮겼습니다.
- source_word: וּתְקִף
  english_pob_choice: became strong
  chosen_korean: …크게 되고
  alternatives_korean:
  - 강해지고
  - 튼튼해지고
  lexicon: HALOT
  rationale: 이 동사는 ‘강해지다/튼튼해지다’의 뜻이지만, 앞의 ‘자라서 크게 되고’와 함께 성장의 연속을 한 흐름으로 제시했습니다.
- source_word: וְרוּמֵהּ יִמְטֵא לִשְׁמַיָּא
  english_pob_choice: its height reached to the heavens
  chosen_korean: 그 높이가 하늘에 이르렀으며
  alternatives_korean:
  - 그 높이가 하늘에 닿았으며
  - 그 키가 하늘까지 이르렀으며
  lexicon: HALOT
  rationale: ‘높이’는 나무의 elevation을 직접 반영하는 표현이고, ‘하늘에 이르렀으며’는 과장된 비전적 이미지를 자연스럽게 살립니다.
- source_word: וַחֲזוֹתֵהּ לְסוֹף כָּל אַרְעָא
  english_pob_choice: it was visible to the end of the whole earth
  chosen_korean: 온 땅의 끝까지 보였습니다
  alternatives_korean:
  - 온 땅의 끝에서 보였습니다
  - 온 땅의 끝까지 눈에 띄었습니다
  lexicon: HALOT
  rationale: 문맥상 ‘모습/외형’보다 ‘보였다/눈에 띄었다’는 뜻이 적절하므로, 수동적 상태를 한국어 동사로 옮겼습니다.
theological_decisions:
- issue: 우주적 과장 표현의 보존
  chosen_reading: ‘하늘에 이르렀으며’와 ‘온 땅의 끝까지’라는 표현을 그대로 살려 꿈의 과장된 상징성을 유지했습니다.
  alternative_readings:
  - ‘하늘끝까지 닿았으며’
  - ‘세상 끝까지 보였습니다’
  rationale: 본문은 실제 나무의 크기 묘사라기보다 제국적·상징적 확대를 보여 주므로, 이를 완화하지 않고 비전의 장엄함을 보존하는 것이 적절합니다.
  doctrine_reference: 다니엘 4장의 상징적 꿈 환상 해석
