source:
  edition: WLC
  text: דְּנָה֙ חֶלְמָ֣/א חֲזֵ֔ית אֲנָ֖ה מַלְכָּ֣/א נְבוּכַדְנֶצַּ֑ר ו/אנתה בֵּלְטְשַׁאצַּ֜ר פִּשְׁרֵ֣/א אֱמַ֗ר כָּ/ל קֳבֵל֙ דִּ֣י כָּל חַכִּימֵ֣י מַלְכוּתִ֗/י לָֽא יָכְלִ֤ין פִּשְׁרָ/א֙ לְ/הוֹדָ֣עֻתַ֔/נִי ו/אנתה כָּהֵ֔ל דִּ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בָּֽ/ךְ׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/015.yaml
  text: This is the dream that I[a], King Nebuchadnezzar, saw. And you, Belteshazzar, tell its interpretation, because all the wise men of my kingdom are not able to make its interpretation known to me, but you are able, for the spirit of the holy gods is in you.
  footnotes:
  - marker: a
    text: Or, 'the Spirit of the holy God is in you.' The Aramaic forms are plural, but some take the phrase as a singular reference.
    reason: alternative_reading
translation:
  language: ko
  text: 느부갓네살 왕인 내가 본 꿈은 이것입니다. 벨드사살아, 그 해석을 말하십시오. 내 왕국의 모든 지혜자가 그 해석을 내게 알려 줄 수 없지만, 그대는 할 수 있습니다. 거룩한 신들의 영[a]이 그대 안에 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 하나님의 영’. 아람어 형태는 복수형이지만, 이를 단수 지시로 이해하는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה חֶלְמָא
  english_pob_choice: This is the dream
  chosen_korean: 이것이 내가 본 꿈입니다
  alternatives_korean:
  - 이것은 내가 본 꿈입니다
  - 이것이 꿈입니다
  lexicon: HALOT
  rationale: 지시어 דְּנָה와 정관형 חֶלְמָא를 자연스럽게 살리되, 문맥상 바로 앞 꿈을 가리키므로 '이것이'로 시작하고 '내가 본 꿈'으로 과거 시제를 분명히 했습니다.
- source_word: פִּשְׁרֵא אֱמַר
  english_pob_choice: tell its interpretation
  chosen_korean: 그 해석을 말하십시오
  alternatives_korean:
  - 그 해석을 말씀하십시오
  - 해석을 설명하십시오
  lexicon: HALOT
  rationale: פִּשְׁרֵא의 핵심 의미를 '해석'으로 옮기고, 명령형 אֱמַר는 한국어에서 자연스러운 요청인 '말하십시오'로 처리했습니다.
- source_word: כָּל חַכִּימֵי מַלְכוּתִי
  english_pob_choice: all the wise men of my kingdom
  chosen_korean: 내 왕국의 모든 지혜자들
  alternatives_korean:
  - 내 왕국의 모든 현자들
  - 내 나라의 모든 지혜자들
  lexicon: HALOT
  rationale: חַכִּימֵי는 단순한 '똑똑한 사람들'보다 궁중 지혜자/현자 집단을 가리키므로 '지혜자들'이 본문에 더 가깝습니다.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  english_pob_choice: the spirit of the holy gods
  chosen_korean: 거룩한 신들의 영
  alternatives_korean:
  - 거룩한 하나님의 영
  - 거룩한 신의 영
  lexicon: HALOT
  rationale: 아람어 표면형의 복수성(אֱלָהִין, קַדִּישִׁין)을 따라 '신들'로 옮겨, 느부갓네살의 이교적 발화를 본문 수준에서 보존했습니다.
- source_word: בָּךְ
  english_pob_choice: is in you
  chosen_korean: 당신 안에 있기 때문입니다
  alternatives_korean:
  - 당신 안에 있습니다
  - 당신 속에 있기 때문입니다
  lexicon: HALOT
  rationale: 내재를 나타내는 전치사를 한국어의 자연스러운 위치 표현으로 풀어, 인과절 전체를 매끄럽게 만들었습니다.
theological_decisions:
- issue: 아람어 복수형 '거룩한 신들'을 단수 신적 표현으로 완화할지 여부
  chosen_reading: 본문의 표면형을 따라 '거룩한 신들의 영'으로 유지했습니다.
  alternative_readings:
  - 거룩한 하나님의 영
  - 거룩한 신의 영
  rationale: 느부갓네살의 말이라는 서술 맥락과 복수형 형태를 우선시해, 해석적 화해를 본문으로 미리 가져오지 않았습니다. 본문이 가진 신학적 긴장을 보존하는 것이 POB 원칙에 부합합니다.
  doctrine_reference: '번역 원칙: 문법적 표면형 우선, 신학적 긴장 보존'
