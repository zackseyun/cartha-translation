translation:
  language: ko
  text: 열두 달이 끝날 무렵[a], 그는 바벨론 왕국의 왕궁 지붕 위를 거닐고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바벨론 왕국의 왕궁 지붕 위를 거닐고 있었습니다.’ 아람어는 문자적으로 ‘바벨론 왕국의 궁전 위에’라고 하며, 그 위치는 궁전 지붕이나 상부 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/קְצָת יַרְחִין תְּרֵי עֲשַׂר
  english_pob_choice: At the end of twelve months
  chosen_korean: 열두 달이 끝날 무렵
  alternatives_korean:
  - 열두 달 끝에
  - 한 해가 끝날 무렵
  lexicon: HALOT
  rationale: 시간 표현은 기간의 종료를 나타내므로 직역하되, 한국어에서는 ‘끝날 무렵’이 자연스럽고 원문의 시점감을 잘 살립니다.
- source_word: עַל
  english_pob_choice: 'on'
  chosen_korean: 지붕 위를
  alternatives_korean:
  - 궁전 위를
  - 궁전 위에
  lexicon: HALOT
  rationale: 문맥상 ‘궁전의 지붕/상부 구조’로 이해되는 위치이므로, 본문 의미를 드러내는 ‘지붕 위를’로 옮기되 각주로 대안 독법을 남깁니다.
- source_word: הֵיכַל מַלְכוּתָא דִּי בָבֶל
  english_pob_choice: the royal palace of Babylon / the palace of the kingdom of Babylon
  chosen_korean: 바벨론 왕국의 왕궁
  alternatives_korean:
  - 바벨론의 왕궁
  - 바벨론 왕국의 궁전
  lexicon: HALOT
  rationale: הֵיכַל은 여기서 성전이 아니라 왕궁이며, מַלְכוּתָא는 ‘왕권’보다 정치적 실체인 ‘왕국’이 적합합니다. ‘왕궁’은 왕국 소속의 궁전이라는 관계를 자연스럽게 드러냅니다.
- source_word: מְהַלֵּךְ הֲוָה
  english_pob_choice: he was walking
  chosen_korean: 거닐고 있었습니다
  alternatives_korean:
  - 걷고 있었습니다
  - 다니고 있었습니다
  lexicon: HALOT
  rationale: 분사+‘있었다’는 진행상을 나타내므로 ‘거닐고 있었습니다’가 가장 자연스럽고, 왕궁 지붕 위를 걷는 장면의 여유로운 동작도 살립니다.
theological_decisions:
- issue: 장소 표현의 모호성(궁전의 지붕 vs 상부 구조)
  chosen_reading: 본문은 ‘바벨론 왕국의 왕궁 지붕 위’로 옮기고, 각주에서 아람어가 문자적으로는 ‘바벨론 왕국의 궁전 위’라고 함을 밝혔습니다.
  alternative_readings:
  - ‘왕궁 위에’
  - ‘왕궁의 옥상에서’
  rationale: 아람어 עַל הֵיכַל은 위치를 분명히 말하지만 정확한 구조는 문맥으로 추론해야 하므로, 본문에는 자연스러운 독법을 두고 각주로 원문상의 여지를 보존합니다.
  doctrine_reference: source transparency / textual fidelity
