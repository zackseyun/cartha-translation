- source_word: הֵיכַל מַלְכוּתָא דִּי בָבֶל
  english_pob_choice: the royal palace of Babylon / the palace of the kingdom of Babylon
  chosen_korean: 바벨론 왕국의 왕궁
  alternatives_korean:
