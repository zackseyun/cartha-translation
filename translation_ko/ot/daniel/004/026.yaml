  text: At the end of twelve months[a], he was walking on the roof of the royal palace of Babylon.
  footnotes:
  - marker: a
    text: Or 'walking on the roof of the royal palace of Babylon.' The Aramaic literally says 'on the palace of the kingdom of Babylon,' and the location may refer to the palace roof or upper structure.
