id: DAN.4.22
reference: Daniel 4:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָ֣/ךְ טָֽרְדִ֣ין מִן אֲנָשָׁ֡/א וְ/עִם חֵיוַ֣ת בָּרָ/א֩ לֶהֱוֵ֨ה מְדֹרָ֜/ךְ וְ/עִשְׂבָּ֥/א כְ/תוֹרִ֣ין לָ֣/ךְ יְטַֽעֲמ֗וּן וּ/מִ/טַּ֤ל שְׁמַיָּ/א֙ לָ֣/ךְ מְצַבְּעִ֔ין וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עֲלָ֑/יךְ עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/022.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and you will be drenched with the dew of heaven, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
  footnotes:
  - marker: a
    text: Or 'seven periods'; many understand this as 'seven years.'
    reason: alternative_reading
  - marker: b
    text: '''Kingdom of men'' means human rule or the realm of mankind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 사람들에게서 쫓겨나 들의 짐승들과 함께 살게 될 것이며, 소처럼 풀을 먹게 될 것이고 하늘의 이슬에 흠뻑 젖을 것입니다. 일곱 때[a]가 네 위로 지나갈 것이며, 네가 지극히 높으신 이가 사람의 나라[b]를 다스리시고 그가 원하시는 누구에게나 그것을 주신다는 것을 알 때까지 그리될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '일곱 기간'; 많은 이들은 이를 '일곱 해'로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: '''사람의 나라''는 인간의 통치 또는 인류의 영역을 뜻합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָרְדִין
  english_pob_choice: you will be driven away
  chosen_korean: 쫓겨나
  alternatives_korean:
  - 내쫓기고
  - 추방되어
  lexicon: HALOT
  rationale: 강제적 이탈의 뉘앙스를 살리면서, 문맥상 수동적 결과를 자연스러운 한국어로 압축했습니다.
- source_word: אֲנָשָׁא
  english_pob_choice: men
  chosen_korean: 사람들
  alternatives_korean:
  - 인간들
  - 인류
  lexicon: HALOT
  rationale: 문맥의 대조점은 인간 사회와 짐승의 삶이어서, 한국어에서는 성별 표지보다 집단 대비가 더 분명한 '사람들'이 적절합니다.
- source_word: שִׁבְעָה עִדָּנִין
  english_pob_choice: seven times
  chosen_korean: 일곱 때
  alternatives_korean:
  - 일곱 기간
  - 일곱 해
  lexicon: HALOT
  rationale: 아람어 표현의 시간 단위는 의도적으로 넓으므로, 본문처럼 '때'로 옮겨 해석을 확정하지 않았습니다.
- source_word: שַׁלִּיט עִלָּיָא
  english_pob_choice: the Most High rules
  chosen_korean: 지극히 높으신 이가 ... 다스리시며
  alternatives_korean:
  - 지극히 높으신 이가 ... 통치하시며
  - 가장 높으신 분이 ... 군림하시며
  lexicon: HALOT
  rationale: 다니엘서의 관용적 호칭을 살려 '지극히 높으신 이'로 옮기고, 주권 행위를 '다스리시며'로 자연스럽게 표현했습니다.
- source_word: בְּמַלְכֻת אֲנָשָׁא
  english_pob_choice: in the kingdom of men
  chosen_korean: 사람의 나라
  alternatives_korean:
  - 사람들의 나라
  - 인간의 나라
  lexicon: HALOT
  rationale: POB의 각주가 지적하듯 인간 통치/인간의 영역을 뜻하므로, 한국어에서는 간결하게 '사람의 나라'로 옮겨 원문의 대비를 유지했습니다.
- source_word: יִתְּנִנַּהּ
  english_pob_choice: gives it
  chosen_korean: 그것을 주신다는
  alternatives_korean:
  - 그것을 주신다는
  - 그 나라를 주신다는
  lexicon: HALOT
  rationale: 대명사 '그것'은 앞의 나라/통치권을 가리키므로, 본문 흐름을 따라 자연스럽게 이어 주었습니다.
theological_decisions:
- issue: '''일곱 때''의 기간 확정 여부'
  chosen_reading: 본문은 기간을 '일곱 때'로 유지하고, 해석을 '일곱 해'로 확정하지 않았습니다.
  alternative_readings:
  - 일곱 해
  - 일곱 기간
  - 일곱 절기
  rationale: 아람어 עִדָּנִין은 정확한 달력 단위보다 넓어, 본문이 지닌 모호성을 보존하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: '''사람의 나라''의 의미 범위'
  chosen_reading: '''사람의 나라''로 두어 인간 통치/인간 영역의 의미를 열어 두었습니다.'
  alternative_readings:
  - 인간의 나라
  - 인류의 나라
  - 사람들 가운데의 통치
  rationale: 본문은 하나님의 주권과 인간 통치의 대비를 강조하므로, 해석을 한 방향으로 좁히지 않고 원문의 폭을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
