- from: 그리고 너는 사람들[a]에게서 쫓겨나 들의 짐승들과 함께 살게 될 것이며, 소처럼 풀을 먹고 하늘의 이슬에 젖을 것이요, 일곱 때가 너에게 지나갈[b] 때까지, 지극히 높으신 이가 사람의 나라를 다스리시며 자기 뜻대로 누구에게든지 그것을 주신다는 것을 네가 알게 될 것입니다.
