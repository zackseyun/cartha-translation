id: DAN.4.23
reference: Daniel 4:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דִ֣י אֲמַ֗רוּ לְ/מִשְׁבַּ֞ק עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ דִּ֣י אִֽילָנָ֔/א מַלְכוּתָ֖/ךְ לָ֣/ךְ קַיָּמָ֑ה מִן דִּ֣י תִנְדַּ֔ע דִּ֥י שַׁלִּטִ֖ן שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/023.yaml
  text: And because they said to leave the stump of the tree with its roots[a], your kingdom will remain yours from the time that you know that Heaven rules.
  footnotes:
  - marker: a
    text: Or, 'the heavens rule.' The Aramaic uses 'heavens' as a reverential expression for God's sovereign authority.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들이 나무의 그루터기를 그 뿌리와 함께 남겨 두라고 했기 때문에[a], 당신의 왕국은 당신이 하늘이 다스린다는 것을 알게 되는 때부터 당신의 것으로 남을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들이 다스린다.’ 아람어는 하나님의 주권을 가리키는 경외적 표현으로 ‘하늘들’을 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִי אֲמַרוּ
  english_pob_choice: And because they said
  chosen_korean: 그리고 그들이 …라고 했기 때문에
  alternatives_korean:
  - 그리고 …라고 하였으므로
  - 그리고 …라고 말했기 때문에
  lexicon: HALOT
  rationale: 원문의 인과 관계를 살리면서도, 왕에게 주어진 설명문답의 흐름에 맞게 자연스러운 한국어 원인절로 옮겼습니다.
- source_word: לְמִשְׁבַּק עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא
  english_pob_choice: to leave the stump of the tree with its roots
  chosen_korean: 나무의 그루터기를 그 뿌리와 함께 남겨 두라고
  alternatives_korean:
  - 나무의 그루터기와 그 뿌리를 남겨 두라고
  - 나무의 그루터기를 뿌리째 남겨 두라고
  lexicon: HALOT
  rationale: 아람어의 ‘그루터기/뿌리’ 이미지를 보존하되, 한국어에서는 ‘그루터기를 … 뿌리와 함께 남겨 두다’가 가장 분명하게 전달됩니다.
- source_word: מַלְכוּתָךְ לָךְ קַיָּמָה
  english_pob_choice: your kingdom will remain yours
  chosen_korean: 당신의 왕국은 당신의 것으로 남을 것입니다
  alternatives_korean:
  - 당신의 왕국은 당신에게 남아 있을 것입니다
  - 당신의 왕국은 당신에게 굳게 설 것입니다
  lexicon: HALOT
  rationale: קַיָּמָה의 ‘남아 있음/지속됨’을 반영하여, 단순 예언이 아니라 회복을 위한 보존이라는 뜻이 드러나게 했습니다.
- source_word: שַׁלִּטִן שְׁמַיָּא
  english_pob_choice: Heaven rules
  chosen_korean: 하늘이 다스린다는 것을
  alternatives_korean:
  - 하늘이 통치한다는 것을
  - 하늘들이 다스린다는 것을
  lexicon: HALOT
  rationale: POB의 해석대로 שְׁמַיָּא를 하나님을 가리키는 경외적 표현으로 보고, 이를 한국어에서 ‘하늘’로 살리되 동사는 ‘다스리다’로 옮겼습니다.
theological_decisions:
- issue: שְׁמַיָּא를 문자적으로 ‘하늘들’로 둘지, 경외적 메타로 ‘하늘’로 둘지
  chosen_reading: 하늘이 다스린다는 것을
  alternative_readings:
  - 하늘들이 다스린다는 것을
  - 하늘이 통치한다는 것을
  rationale: 다니엘서의 관용적 표현을 살리기 위해 문자적 복수보다 경외적 단수 표현을 택했고, 이는 신학적으로 하나님의 주권을 직접 풀어 쓰지 않으면서도 전달합니다.
  doctrine_reference: 원문 메타포 보존 및 경외적 우회표현 유지
