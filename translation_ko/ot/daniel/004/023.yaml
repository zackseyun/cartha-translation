  to: 그들이 나무의 그루터기를 그 뿌리와 함께 남겨 두라고 하였으므로[a], 왕의 왕국은 왕이 하늘이 다스린다는 것을 알게 되는 때부터 왕에게 남아 있을 것입니다.
