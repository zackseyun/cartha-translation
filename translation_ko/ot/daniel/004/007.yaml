  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י חָזֵ֣ה הֲוֵ֔ית וַ/אֲל֥וּ אִילָ֛ן בְּ/ג֥וֹא אַרְעָ֖/א וְ/רוּמֵ֥/הּ שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/007.yaml
  text: 'These were the visions of my head as I lay on my bed: and behold[a], a tree in the midst of the earth, and its height was great.'
  footnotes:
  - marker: a
    text: Aramaic literally, 'the visions of my head.' The phrase refers to what Nebuchadnezzar saw inwardly in the dream.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 머리 속에 나타난 환상은 이러했습니다. 보십시오, 땅 한가운데에 한 나무가 있었고, 그 높이는 매우 컸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어는 문자적으로 ‘내 머리의 환상들’이라고 합니다. 이 표현은 느부갓네살이 꿈속에서 내적으로 본 것을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וְחֶזְוֵי רֵאשִׁי
  english_pob_choice: These were the visions of my head
  chosen_korean: 내 머리 속에 나타난 환상은 이러했습니다
  alternatives_korean:
  - 내 머리의 환상은 이러했습니다
  - 내 머릿속 환상은 이러했습니다
  lexicon: HALOT
  rationale: 히브리/아람어의 직역적 관용구인 ‘머리의 환상’을 한국어에서는 자연스럽게 풀되, 꿈속에서 내부적으로 본 내용이라는 의미를 유지했습니다.
- source_word: עַל מִשְׁכְּבִי
  english_pob_choice: as I lay on my bed
  chosen_korean: 이러했습니다
  alternatives_korean:
  - 침상에 누워 있을 때
  - 내 침상 위에 누워 있을 때
  lexicon: HALOT
  rationale: 문맥상 앞의 서술형 도입과 결합되는 시간 배경이므로, 한국어에서는 동사구 전체를 매끄럽게 연결해 꿈의 장면 소개로 처리했습니다.
- source_word: וַאֲלוּ
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 환상 서술의 돌출 효과를 살리기 위해 감탄적 지시어로 옮겼습니다. 공적 낭독체에 맞춰 ‘보십시오’를 택했습니다.
- source_word: בְגוֹא אַרְעָא
  english_pob_choice: in the midst of the earth
  chosen_korean: 땅 한가운데에
  alternatives_korean:
  - 땅의 한가운데에
  - 땅의 중앙에
  lexicon: HALOT
  rationale: 아람어의 ‘가운데/한복판’ 의미를 살리되, ‘earth’는 여기서 우주론적 범위보다 시각적 장면성을 드러내는 ‘땅’으로 옮기는 것이 자연스럽습니다.
- source_word: וְרוּמֵהּ שַׂגִּיא
  english_pob_choice: and its height was great
  chosen_korean: 그 높이는 매우 컸습니다
  alternatives_korean:
  - 그 높이는 컸습니다
  - 그 높이는 엄청났습니다
  lexicon: HALOT
  rationale: ‘height’와 ‘great’의 직접 대응을 유지하되, 한국어에서는 ‘매우’로 정도를 드러내어 과도한 의역 없이 원문의 강조를 전달했습니다.
theological_decisions:
- issue: 환상의 위치를 ‘머리’와 ‘머리 속’ 중 어떻게 드러낼지
  chosen_reading: ‘내 머리 속에 나타난 환상’으로 옮겨, 꿈속 내적 시야라는 점을 분명히 했습니다.
  alternative_readings:
  - ‘내 머리의 환상’
  - ‘내 머릿속 환상’
  rationale: 아람어의 직역 표현을 그대로 두면 한국어에서 어색해질 수 있어, 주석 없이도 독자가 환상의 성격을 이해하도록 내부적 시각 경험을 명시했습니다.
  doctrine_reference: 서술 장르의 자연스러운 전달 원칙
- issue: ‘and behold’의 수사적 효과를 어떻게 살릴지
  chosen_reading: ‘보십시오’로 옮겨, 장면 전환의 긴박감과 계시적 주목을 유지했습니다.
  alternative_readings:
  - ‘보라’
  - ‘그리고 보니’
  rationale: 이 표현은 단순한 연결어가 아니라 독자의 시선을 새 장면으로 돌리는 표지이므로, 직설적 명령형보다 공적 문체의 호소형을 사용했습니다.
  doctrine_reference: 본문 수사 구조 보존
