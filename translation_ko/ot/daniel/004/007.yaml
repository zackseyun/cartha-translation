  source_fidelity: 수정 전 번역은 ‘내 침상에 누워 있을 때’(עַל מִשְׁכְּבִי)라는 시간·상황 배경을 생략했습니다. 또한 복수형 ‘환상들’(חֶזְוֵי)을 단수로 옮겼습니다. 수정문은 이 두 요소를 반영하고, ‘보십시오’와 땅 한가운데의 나무라는 환상 도입을 유지합니다.
  naturalness: ‘내 머리 속에 나타난 환상들’은 현대 표준 한국어로 자연스럽고, 주석에서 원문의 직역 관용구를 설명할 수 있습니다. ‘그 높이는 매우 컸습니다’는 한국어 결합이 다소 어색하고 ‘매우’가 원문의 단순한 ‘great’를 불필요하게 강화할 수 있으므로, ‘그 나무는 매우 높았습니다’로 자연스럽게 옮겼습니다.
  terminology: 느부갓네살의 ‘머리의 환상들’이라는 아람어 관용구는 본문에서 ‘머리 속에 나타난 환상들’로 자연스럽게 풀고, 각주에서 문자적 표현을 밝혔습니다. ‘침상’, ‘환상’, ‘보십시오’는 합쇼체의 공적 성경 문체에 적절합니다.
