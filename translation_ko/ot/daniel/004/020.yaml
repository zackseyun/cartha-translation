  text: וְ/דִ֣י חֲזָ֣ה מַלְכָּ֡/א עִ֣יר וְ/קַדִּ֣ישׁ נָחִ֣ת מִן שְׁמַיָּ֡/א וְ/אָמַר֩ גֹּ֨דּוּ אִֽילָנָ֜/א וְ/חַבְּל֗וּ/הִי בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֧ל שְׁמַיָּ֣/א יִצְטַבַּ֗ע וְ/עִם חֵיוַ֤ת בָּרָ/א֙ חֲלָקֵ֔/הּ עַ֛ד דִּֽי שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/020.yaml
  text: And because the king saw a watcher[a], a holy one, coming down from heaven and saying, ‘Cut down the tree and destroy it, but leave the stump of its roots in the earth, with a band of iron and bronze, in the grass of the field, and let him be drenched with the dew of heaven[c][b], and let his portion be with the beasts of the field until seven times pass over him’—
  footnotes:
  - marker: a
    text: Or 'sentinel'; the Aramaic term denotes a heavenly being characterized as watchful.
    reason: lexical_alternative
  - marker: b
    text: Or 'with a fetter of iron and bronze.'
    reason: lexical_alternative
  - marker: c
    text: '''Seven times'' may mean seven periods of time; the text does not specify the exact unit.'
    reason: alternative_reading
translation:
  language: ko
  text: 왕께서 한 깨어 있는 자[a], 곧 한 거룩한 자가 하늘에서 내려와 이렇게 말하는 것을 보셨기 때문입니다. “나무를 베어 쓰러뜨리고 그것을 멸하되, 그 뿌리들의 그루터기는 땅에 남겨 두고, 쇠와 놋의 띠를 두른 채[b] 들의 풀 가운데 있게 하라. 또 그를 하늘의 이슬에 젖게 하고, 그의 몫을 들짐승들과 함께하게 하라. 일곱 때[c]가 그에게 지나갈 때까지 하라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파수꾼’. 아람어 이 단어는 깨어 살피는 하늘 존재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쇠와 놋의 결박을 한 채’.
    reason: lexical_alternative
  - marker: c
    text: ‘일곱 때’는 일곱 기간을 뜻할 수 있으며, 본문은 정확한 시간 단위를 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עִיר
  english_pob_choice: watcher
  chosen_korean: 깨어 있는 자
  alternatives_korean:
  - 감시자
  - 파수꾼
  lexicon: HALOT
  rationale: 다니엘 아람어의 עִיר은 단순한 직분명이 아니라 ‘깨어 있는/잠들지 않는’ 하늘 존재를 가리키므로, 직역적이면서도 의미를 드러내는 ‘깨어 있는 자’로 옮겼습니다.
- source_word: וְקַדִּישׁ
  english_pob_choice: a holy one
  chosen_korean: 거룩한 자
  alternatives_korean:
  - 성스러운 자
  - 성인
  lexicon: HALOT
  rationale: 하늘 존재에 대한 별도의 수식이므로 ‘거룩한 자’로 옮겨, 앞말과 병렬되는 하나의 호칭임을 살렸습니다.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  english_pob_choice: even with a band of iron and bronze
  chosen_korean: 쇠와 놋의 띠로
  alternatives_korean:
  - 쇠와 놋의 결박으로
  - 쇠와 놋으로 된 띠로
  lexicon: HALOT
  rationale: אֱסוּר는 ‘결박/띠’의 뜻이므로 나무 그루터기를 둘러 두는 이미지에 맞게 ‘띠’로 번역했고, נְחָשׁ은 이 금속 문맥에서 전통적으로 ‘놋’이 자연스럽습니다.
- source_word: שִׁבְעָה עִדָּנִין
  english_pob_choice: seven times
  chosen_korean: 일곱 때
  alternatives_korean:
  - 일곱 시기
  - 일곱 기간
  lexicon: HALOT
  rationale: עִדָּן은 정확한 시간 단위가 아니라 시기/때를 가리킬 수 있으므로, POB의 모호성을 살려 ‘일곱 때’로 두었습니다.
theological_decisions:
- issue: 하늘 존재의 분류를 어디까지 특정할 것인가
  chosen_reading: ‘깨어 있는 자, 곧 한 거룩한 자’로 옮겨 본문의 자체 명칭을 유지하고, 천사의 하위 분류로 단정하지 않았습니다.
  alternative_readings:
  - 천사
  - 신적 회의의 일원
  rationale: 본문은 자체 용어를 사용하므로, 해석 체계를 미리 덧씌우지 않고 원문의 신학적 긴장을 보존하는 것이 더 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘일곱 때’의 기간성
  chosen_reading: 정확한 단위로 특정하지 않고 ‘일곱 때’로 유지했습니다.
  alternative_readings:
  - 일곱 기간
  - 칠 년
  rationale: 원문이 기간의 정확한 단위를 밝히지 않으므로, 독자가 본문의 애매성을 그대로 인식하도록 했습니다.
  doctrine_reference: Avoid over-specifying ambiguous prophetic time language.
