  text: בַּ/הּ שַׁעֲתָ֗/א מִלְּתָ/א֮ סָ֣פַת עַל נְבוּכַדְנֶצַּר֒ וּ/מִן אֲנָשָׁ֣/א טְרִ֔יד וְ/עִשְׂבָּ֤/א כְ/תוֹרִין֙ יֵאכֻ֔ל וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּ֥י שַׂעְרֵ֛/הּ כְּ/נִשְׁרִ֥ין רְבָ֖ה וְ/טִפְר֥וֹ/הִי כְ/צִפְּרִֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/030.yaml
  text: At that moment the word was fulfilled against Nebuchadnezzar. He was driven away from among men[a], and he ate grass like oxen, and his body was drenched with the dew of heaven, until his hair grew like eagles’ feathers and his nails like birds’ claws.
  footnotes:
  - marker: a
    text: Or 'his hair grew like vultures’ feathers'; the Aramaic term can refer more broadly to large birds of prey, though 'eagles' is the traditional rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 말씀이 느부갓네살에게 그대로 이루어졌습니다. 그는 사람들 가운데서 쫓겨나 풀을 소처럼 먹었으며, 하늘의 이슬에 몸이 젖었습니다. 그의 머리털은 독수리의 깃털처럼 자라고, 그의 손톱은 새의 발톱처럼 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘독수리’는 전통적 번역이지만, 아람어는 독수리보다 더 넓게 큰 맹금류를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָא / At that moment
  english_pob_choice: At that moment
  chosen_korean: 그때
  alternatives_korean:
  - 그 순간
  - 그 시각
  lexicon: HALOT
  rationale: 아람어 관용구의 즉시성과 판결 직후성을 살리면서, 한국어에서는 간결하고 자연스러운 ‘그때’가 가장 적절합니다.
- source_word: מִלְּתָא סָפַת / the word was fulfilled
  english_pob_choice: the word was fulfilled
  chosen_korean: 그 말씀이 그대로 이루어졌습니다
  alternatives_korean:
  - 그 말씀이 성취되었습니다
  - 그 판결이 이루어졌습니다
  lexicon: HALOT
  rationale: מִלְּתָא는 여기서 선언된 심판의 ‘말씀/선언’을 가리키므로, 단순한 ‘판결’보다 원문과 더 맞는 ‘말씀’으로 옮기고, סָפַת의 완료감을 ‘그대로 이루어졌습니다’로 살렸습니다.
- source_word: וּמִן אֲנָשָׁא טְרִיד / He was driven away from among men
  english_pob_choice: He was driven away from among men
  chosen_korean: 그는 사람들 가운데서 쫓겨나
  alternatives_korean:
  - 그는 사람들 가운데서 내쫓겨
  - 그는 사람들 사이에서 쫓겨나
  lexicon: HALOT
  rationale: אֲנָשָׁא는 인간 사회를 가리키는 일반 명사이므로 ‘사람들 가운데서’로 살렸고, טְרִיד는 강한 추방의 뉘앙스를 가진 ‘쫓겨나’가 자연스럽습니다.
- source_word: וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע / his body was drenched with the dew of heaven
  english_pob_choice: his body was drenched with the dew of heaven
  chosen_korean: 하늘의 이슬에 몸이 젖었습니다
  alternatives_korean:
  - 하늘 이슬에 몸이 흠뻑 젖었습니다
  - 하늘의 이슬로 몸이 젖었습니다
  lexicon: HALOT
  rationale: ‘하늘의 이슬’은 전통적 성경 표현을 유지하되, יִצְטַבַּע의 수동 결과를 한국어의 자연스러운 ‘몸이 젖었습니다’로 옮겼습니다.
- source_word: שַׂעְרֵהּ כְּנִשְׁרִין רְבָה / his hair grew like eagles’ feathers
  english_pob_choice: his hair grew like eagles’ feathers
  chosen_korean: 그의 머리털은 독수리의 깃털처럼 자라고
  alternatives_korean:
  - 그의 머리털은 독수리의 깃처럼 자라고
  - 그의 머리털은 독수리 깃털처럼 자라고
  lexicon: HALOT
  rationale: נִשְׁרִין의 통상 번역인 ‘독수리’를 유지하고, 머리털이 주어이므로 רְבָה를 ‘자라고’로 처리해 장모적 형상을 살렸습니다.
- source_word: וְטִפְרוֹהִי כְצִפְּרִין / and his nails like birds’ claws
  english_pob_choice: and his nails like birds’ claws
  chosen_korean: 그의 손톱은 새의 발톱처럼 되었습니다
  alternatives_korean:
  - 그의 손톱은 새의 발톱 같아졌습니다
  - 그의 손톱은 새의 발톱처럼 자랐습니다
  lexicon: HALOT
  rationale: טִפְרִין은 손톱/발톱을 뜻하며, 새와의 비교에서는 ‘발톱’이 이미지 전달에 더 적합하므로 한국어에서 자연스럽게 ‘되었습니다’로 마무리했습니다.
theological_decisions:
- issue: ‘말씀’과 심판 선언의 관계
  chosen_reading: 하나님의 선포된 말씀이 느부갓네살에게 실제 심판으로 실행되었다는 뜻으로 이해했습니다.
  alternative_readings:
  - 그냥 사건이 일어났다는 서술
  - ‘판결’ 중심의 법정적 번역
  rationale: 원문 מִלְּתָא는 단순한 사건이 아니라 이전에 선포된 하나님의 말씀/선언을 가리키므로, 독자가 심판의 성취를 분명히 읽도록 ‘말씀이 그대로 이루어졌다’로 옮겼습니다.
  doctrine_reference: Daniel 4 문맥의 신적 주권과 예언 성취
- issue: אֲנָשָׁא의 인간성 대비
  chosen_reading: ‘사람들 가운데서’는 성별 구분이 아니라 인간 사회로부터의 추방을 뜻합니다.
  alternative_readings:
  - 인류 가운데서
  - 사람들 사이에서
  rationale: 원문의 대비는 왕이 짐승처럼 되어 인간 공동체에서 배제되었다는 점에 있으므로, 현대 한국어에서 가장 자연스럽고 오해가 적은 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
