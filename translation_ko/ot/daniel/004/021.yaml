base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/021.yaml
  text: 'This is the interpretation[a], O king, and it is a decree of the Most High that has come upon my lord the king:'
  footnotes:
  - marker: a
    text: Or 'the Highest One.' The Aramaic title refers to God as supreme over all rulers.
    reason: lexical_alternative
translation:
  language: ko
  text: '이것이 해석입니다[a], 왕이시여. 그리고 그것은 지극히 높으신 분에게서 나온 명령으로, 제 주 왕에게 임한 것입니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 분’. 이 아람어 칭호는 하나님을 모든 통치자 위에 계신 분으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִשְׁרָא
  english_pob_choice: the interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 뜻풀이
  - 풀이
  - 설명
  lexicon: HALOT
  rationale: 아람어 פִשְׁרָא는 꿈이나 신비의 ‘해석’이라는 뜻이므로, 다니엘서 궁정 맥락에 맞게 간결하고 직접적인 ‘해석’으로 옮겼습니다.
- source_word: מַלְכָּא
  english_pob_choice: O king
  chosen_korean: 왕이시여
  alternatives_korean:
  - 임금이시여
  - 왕님
  lexicon: HALOT
  rationale: 직접 호격을 표하는 궁정 예절을 살리되, 현대 표준어의 공손한 호칭인 ‘왕이시여’로 자연스럽게 옮겼습니다.
- source_word: עִלָּיָא
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  lexicon: HALOT
  rationale: 하나님을 가리키는 최고 주권의 칭호를 한국어에서 자연스럽게 전달하기 위해, 직역적이면서도 인격적 뉘앙스를 유지하는 ‘지극히 높으신 분’을 택했습니다.
- source_word: מָרִי מַלְכָּא
  english_pob_choice: my lord the king
  chosen_korean: 제 주 왕
  alternatives_korean:
  - 제 왕이신 주인
  - 제 군왕
  lexicon: HALOT
  rationale: 아람어의 궁정적 존칭 결합을 반영하여, 관계와 예를 함께 드러내는 ‘제 주 왕’으로 압축했습니다.
theological_decisions:
- issue: עִלָּיָא의 신칭 번역
  chosen_reading: 지극히 높으신 분
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  rationale: 본문은 하나님을 모든 통치자 위에 계신 분으로 제시하므로, ‘지극히 높으신 분’이 칭호의 위엄과 열린 표지를 함께 보존합니다.
  doctrine_reference: 'DOCTRINE.md: 원문의 신학적 긴장을 보존하고, 문맥이 허용하는 범위 안에서 자연스러운 현대 한국어로 옮긴다.'
