id: DAN.6.23
reference: Daniel 6:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלָהִ֞/י שְׁלַ֣ח מַלְאֲכֵ֗/הּ וּֽ/סֲגַ֛ר פֻּ֥ם אַרְיָוָתָ֖/א וְ/לָ֣א חַבְּל֑וּ/נִי כָּ/ל קֳבֵ֗ל דִּ֤י קָֽדָמ֨וֹ/הִי֙ זָכוּ֙ הִשְׁתְּכַ֣חַת לִ֔/י וְ/אַ֤ף קדמי/ך מַלְכָּ֔/א חֲבוּלָ֖ה לָ֥א עַבְדֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/023.yaml
  text: My God sent his angel and shut the mouths of the lions[a], and they have not harmed me, because innocence was found in me before him; and also before you, O king[c][b], I have done no harm.
  footnotes:
  - marker: a
    text: Or 'his messenger.' The Aramaic term can denote either a messenger or an angel; here the miraculous context favors 'angel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'blamelessness' or 'purity was found in me before him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I did no wrong before you, O king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님께서 그의 천사를 보내시고 사자들의 입을 막으셔서 그들이 나를 해치지 못했습니다. 그분 앞에서 내게서 무죄가 드러났기 때문입니다. 또 왕이여, 왕 앞에서도 내가 아무 해도 행하지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 사자’일 수 있습니다. 아람어 단어는 ‘전령’이나 ‘천사’를 가리킬 수 있으나, 여기서는 기적적 구출의 문맥상 ‘천사’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분 앞에서 내게서 결백이 드러났기 때문입니다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕이여, 왕 앞에서 내가 잘못을 행하지 않았습니다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהִי
  english_pob_choice: My God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  lexicon: HALOT
  rationale: 다니엘의 개인적 신앙 고백을 살리면서, 표준 한국어에서 자연스럽고 격식 있는 소유 표현으로 옮겼습니다.
- source_word: מַלְאֲכֵהּ
  english_pob_choice: his angel
  chosen_korean: 그의 천사
  alternatives_korean:
  - 그의 사자
  - 그의 메신저
  lexicon: HALOT
  rationale: 문맥이 초자연적 구원을 분명히 가리키므로, POB의 ‘angel’ 선택을 따라 ‘천사’로 옮겼습니다.
- source_word: וְלָא חַבְּלוּנִי
  english_pob_choice: and they have not harmed me
  chosen_korean: 그들이 나를 해치지 못했습니다
  alternatives_korean:
  - 그들이 나를 다치게 하지 않았습니다
  - 그들이 나를 상하게 하지 못했습니다
  lexicon: HALOT
  rationale: 사자들이 실제로 해를 끼치지 못했다는 결과를 분명히 드러내기 위해 한국어의 자연스러운 부정 가능 표현을 사용했습니다.
- source_word: זָכוּ הִשְׁתְּכַחַת לִי
  english_pob_choice: innocence was found in me before him
  chosen_korean: 그분 앞에서 내게서 무죄가 드러났기 때문입니다
  alternatives_korean:
  - 그분 앞에서 내 안에 무죄가 발견되었기 때문입니다
  - 그분 앞에서 내게서 결백이 나타났기 때문입니다
  lexicon: HALOT
  rationale: 법정적·도덕적 맥락을 반영해 ‘무죄’로 옮기고, 수동적 관용구 ‘was found’는 ‘드러났습니다’로 자연스럽게 살렸습니다.
- source_word: חֲבוּלָה לָא עַבְדֵת
  english_pob_choice: I have done no harm
  chosen_korean: 아무 해도 행하지 않았습니다
  alternatives_korean:
  - 아무 잘못도 저지르지 않았습니다
  - 아무 해도 하지 않았습니다
  lexicon: HALOT
  rationale: 앞절의 ‘harm’과 의미를 맞추되, 왕 앞에서의 부정 진술을 한국어로 매끄럽게 표현했습니다.
theological_decisions:
- issue: מַלְאֲכֵהּ의 번역
  chosen_reading: ‘천사’로 번역해 하나님의 보내신 초자연적 존재를 드러냈습니다.
  alternative_readings:
  - ‘사자’로 번역해 더 문자적으로 처리함
  rationale: 구출의 기적적 문맥상 단순한 인간 사자보다 천사로 읽는 것이 본문 의도에 더 부합합니다. POB의 영어 주석도 이 선택을 지지합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘before him’과 ‘before you, O king’의 병렬 구조
  chosen_reading: 하나님 앞과 왕 앞의 두 차원의 무죄 진술을 모두 유지했습니다.
  alternative_readings:
  - 한 번의 무죄 진술로 압축함
  - 왕 앞 진술을 약화시켜 일반적 무해성으로 처리함
  rationale: 본문은 하나님의 판단과 왕의 법정적 평가를 모두 언급하므로, 두 진술의 긴장을 그대로 보존해야 합니다.
  doctrine_reference: Source transparency principle
