id: DAN.6.8
reference: Daniel 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִתְיָעַ֜טוּ כֹּ֣ל סָרְכֵ֣י מַלְכוּתָ֗/א סִגְנַיָּ֤/א וַֽ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ הַדָּֽבְרַיָּ֣/א וּ/פַחֲוָתָ֔/א לְ/קַיָּמָ֤ה קְיָם֙ מַלְכָּ֔/א וּ/לְ/תַקָּפָ֖ה אֱסָ֑ר דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/גֹ֖ב אַרְיָוָתָֽ/א׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/008.yaml
  text: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
  footnotes:
  - marker: a
    text: Aramaic 'from any god or man'; rendered 'to any god or man' in English because 'make a petition' normally takes the addressee with 'to.'
    reason: lexical_alternative
  - marker: b
    text: Or 'have consulted together.' The verb can emphasize joint deliberation as well as unified agreement.
    reason: lexical_alternative
  - marker: c
    text: Or 'royal decree' for 'royal statute.' The Aramaic legal terms here overlap in the field of decree, statute, and binding injunction.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕국의 모든 고위 관리들[a], 곧 총독들과 사트라프들과 고문들과 지방 관원들이 모여, 왕의 조서를 세우고 금령을 확정하기로 합의했습니다. 그것은 누구든지 삼십 일 동안 왕이신 당신[b][c]을 제외하고 어떤 신이나 사람에게든 청원하면, 사자 굴에 던져 넣는다는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어는 직역하면 ‘왕국의 모든 고위 관리들’보다 넓게 ‘왕국의 모든 고관들’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신에게’가 되지만, 청원 동사와 함께 한국어에서는 ‘왕이신 당신’이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕에게 올린 조서’의 뜻으로 읽을 수 있습니다. 아람어의 법률 용어는 조서, 칙령, 법령의 의미 영역이 겹칩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִתְיָעַטוּ
  english_pob_choice: have agreed together
  chosen_korean: 합의했습니다
  alternatives_korean:
  - 함께 의논했습니다
  - 함께 상의했습니다
  lexicon: HALOT
  rationale: 공동 숙의와 결의가 함께 있는 동사로서, 한국어에서는 자연스럽게 ‘합의했습니다’가 가장 직접적으로 대응합니다.
- source_word: סָרְכֵי מַלְכוּתָא
  english_pob_choice: the high officials of the kingdom
  chosen_korean: 왕국의 모든 고위 관리들
  alternatives_korean:
  - 왕국의 수석 관리들
  - 왕국의 고관들
  lexicon: HALOT
  rationale: 뒤따르는 직함 목록을 포괄하는 상위 집합이므로, 위계가 드러나는 ‘고위 관리들’이 적절합니다.
- source_word: לְקַיָּמָה קְיָם מַלְכָּא וּלְתַקָּפָה אֱסָר
  english_pob_choice: to establish a royal statute and to enforce an injunction
  chosen_korean: 왕의 조서를 세우고 금령을 확정하기로
  alternatives_korean:
  - 왕의 법령을 제정하고 금지령을 시행하기로
  - 왕의 칙령을 세우고 금령을 강화하기로
  lexicon: HALOT
  rationale: 아람어의 법적 표현은 ‘세우다/확정하다’의 결합으로 강한 효력을 뜻하므로, ‘조서’와 ‘금령’으로 살리되 법적 강도를 ‘확정하기로’로 반영했습니다.
- source_word: דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽאֱנָשׁ
  english_pob_choice: that whoever makes a petition to any god or man
  chosen_korean: 누구든지 … 어떤 신이나 사람에게든 청원하면
  alternatives_korean:
  - 누구든지 … 어떤 신이나 사람에게 구하면
  - 누구든지 … 어떤 신이나 사람에게 요청하면
  lexicon: HALOT
  rationale: 법적 금지 조항의 맥락에서 단순한 ‘기도하다’보다 공식적 청원 행위를 뜻하는 ‘청원하다’가 원문의 뜻을 더 잘 드러냅니다.
- source_word: עַד יוֹמִין תְּלָתִין
  english_pob_choice: for thirty days
  chosen_korean: 삼십 일 동안
  alternatives_korean:
  - 삼십 일간
  - 삼십 일 동안에
  lexicon: HALOT
  rationale: 금지의 기간을 자연스러운 현대 한국어로 표시하기 위해 기간 표현을 사용했습니다.
- source_word: יִתְרְמֵא לְגֹב אַרְיָוָתָא
  english_pob_choice: shall be thrown into the lions’ den
  chosen_korean: 사자 굴에 던져 넣는다는 것입니다
  alternatives_korean:
  - 사자 굴에 던져진다는 것입니다
  - 사자들의 굴에 던져 넣는다는 것입니다
  lexicon: HALOT
  rationale: 법적 제재의 폭력성과 결과를 살리기 위해 수동적 표현보다 능동적 처벌문형에 가까운 ‘던져 넣다’를 택했습니다.
theological_decisions:
- issue: 왕을 향한 예외 조항의 호칭
  chosen_reading: ‘왕이신 당신’으로 옮겨, 아람어의 예외 대상이 왕 자신임을 분명히 했습니다.
  alternative_readings:
  - ‘왕이신 당신께만’
  - ‘당신 왕께만’
  rationale: 본문은 ‘당신을 제외하고’라는 정치적 예외를 강조하므로, 호칭을 부드럽게 순화하지 않고 직접적으로 살렸습니다.
  doctrine_reference: 본문 충실성 및 담화 맥락 보존
