revisions:
- from: 그때 고관들과 총독들은 다니엘에게서 왕국의 일과 관련된 비난거리를 찾아내려고 했으나, 아무런 비난거리나 부패를 찾아내지 못했습니다. 그는 신실했기 때문입니다[b], 그의 안에는 아무런 부주의나 부패도 드러나지 않았습니다.
  to: 그때 고관들과 총독들은 왕국의 업무와 관련하여 다니엘을 고발할 근거를 찾아내려고 했으나, 아무런 고발 근거나 부패도 찾아내지 못했습니다. 이는 그가 신뢰할 만한 사람이었고, 그에게서는 아무런 태만이나 부패도 발견되지 않았기 때문입니다[b]
  rationale: ‘고발할 근거’로 법적·행정적 맥락을 명료하게 하고, ‘신뢰할 만한 사람’으로 공직상 신뢰성이라는 מְהֵימַן의 의미를 우선했습니다. ‘태만’과 ‘발견되지 않았다’는 조사·감사 맥락 및 원문의 표현을 자연스럽게 반영합니다. 각주는 본문 선택의 가능한 어휘 대안을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:47:45Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, עִלָּה는 단순한 ‘비난거리’보다 다니엘을 고발할 법적·행정적 근거를 뜻합니다. 또한 מְהֵימַן은 이 문맥에서 종교적 함의가 강해질 수 있는 ‘신실하다’보다 직무상 신뢰성을 분명히 하는 표현이 적절합니다.
  naturalness: 현 번역은 문장 분리가 원문의 인과적 연결을 다소 약화시키고, ‘그의 안에는’은 인격적 결함 진술에는 가능하지만 행정적 조사 맥락에서는 ‘그에게서’가 더 자연스럽습니다. 수정문은 현대 표준 한국어 합쇼체로 자연스럽게 연결합니다.
  terminology: ‘고관들’과 ‘총독들’은 허용 가능한 행정 용어입니다. 다만 ‘고발할 근거’가 עִלָּה의 법정적 의미를 더 정확히 전달하며, ‘신뢰할 만한 사람’은 מְהֵימַן의 공적 신뢰성이라는 문맥을 보존합니다. שָׁלוּ는 ‘태만’으로 옮겨 행정·직무상의 과실이라는 뉘앙스를 살렸습니다.
