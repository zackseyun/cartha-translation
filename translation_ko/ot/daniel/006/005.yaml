reference: Daniel 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/005.yaml
  text: Then the high officials and the satraps were seeking to find a charge against Daniel in matters of the kingdom[a], but they were unable to find any charge or corruption, because he was faithful[c][b], and no negligence or corruption was found in him.
  footnotes:
  - marker: a
    text: Or 'ground for accusation' for 'charge.'
    reason: lexical_alternative
  - marker: b
    text: Or 'trustworthy' for 'faithful.'
    reason: lexical_alternative
  - marker: c
    text: Or 'error' or 'carelessness' for 'negligence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 고관들과 총독들은 왕국의 업무와 관련하여 다니엘을 고발할 근거를 찾아내려고 했으나, 아무런 고발 근거나 부패도 찾아내지 못했습니다. 이는 그가 신뢰할 만한 사람이었고, 그에게서는 아무런 태만이나 부패도 발견되지 않았기 때문입니다[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘충실한 사람이었고’ 또는 ‘신실한 사람이었고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרְכַיָּא
  english_pob_choice: high officials
  chosen_korean: 고관들
  alternatives_korean:
  - 고위 관리들
  - 행정관들
  lexicon: HALOT
  rationale: 아람어 행정 직함을 한국어로 자연스럽게 옮기되, 고위 관료 집단이라는 점을 간명하게 드러내기 위해 ‘고관들’을 택했습니다.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  english_pob_choice: satraps
  chosen_korean: 총독들
  alternatives_korean:
  - 사트라프들
  - 주총독들
  lexicon: HALOT
  rationale: 역사적 용어를 음역할 수도 있으나, 본문 기능상 페르시아 지방 통치자를 가리키므로 한국어 독자가 즉시 이해할 수 있는 ‘총독들’을 택했습니다.
- source_word: עִלָּה
  english_pob_choice: charge
  chosen_korean: 비난거리
  alternatives_korean:
  - 고발 근거
  - 혐의
  lexicon: HALOT
  rationale: 법정적·행정적 맥락에서 ‘charge’는 단순한 비난이 아니라 공격용 근거를 뜻하므로, 문맥상 자연스러운 ‘비난거리’로 옮겼습니다. 각주 a의 다른 가능성도 반영됩니다.
- source_word: מְהֵימַן
  english_pob_choice: faithful
  chosen_korean: 신실했기
  alternatives_korean:
  - 신뢰할 만했기
  - 충실했기
  lexicon: HALOT
  rationale: 여기서는 직무상 신뢰성과 도덕적 성실함을 함께 담는 말이 필요해 ‘신실하다’를 택했습니다. 문맥상 신앙적 호칭이 아니라 관직 수행의 성품을 가리킵니다.
- source_word: שָׁלוּ
  english_pob_choice: negligence
  chosen_korean: 부주의
  alternatives_korean:
  - 실수
  - 태만
  lexicon: HALOT
  rationale: 이 단어는 결함이나 허술함, 직무상 소홀함을 가리키므로, POB의 ‘negligence’에 맞춰 ‘부주의’로 옮겼습니다. 각주 c의 대안도 여기에 대응됩니다.
- source_word: הִשְׁתְּכַחַת עֲלֽוֹהִי
  english_pob_choice: was found in him
  chosen_korean: 그의 안에는 … 드러나지 않았습니다
  alternatives_korean:
  - 그에게서 … 발견되지 않았습니다
  - 그 안에서 … 찾을 수 없었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그에게서 발견되지 않았다’이지만, 한국어에서는 ‘드러나지 않았다’가 더 자연스럽고 본문의 무결성 진술을 분명히 살립니다.
theological_decisions:
- issue: Daniel의 ‘faithful’의 뉘앙스
  chosen_reading: ‘신실했기’로 옮겨 관직상 신뢰성과 성실함을 함께 드러냈습니다.
  alternative_readings:
  - 신뢰할 만했기
  - 충실했기
  rationale: 이 구절은 교리 진술이 아니라 이방 관리들 앞에서 드러난 다니엘의 공적 무결성을 말하므로, 신앙적 칭호로 과도하게 확대하지 않고도 윤리적 무게를 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
