    rationale: 문맥상 관리들이 찾는 것은 단순히 비난할 소재가 아니라 다니엘을 제기·고발할 근거입니다.
  - severity: medium
    issue: ‘신실했기’는 한국어에서 종교적 신앙의 충실성을 연상시킬 수 있습니다.
    rationale: 이 구절의 מְהֵימַן은 다니엘의 공직 수행에서 확인된 신뢰성·성실성을 가리킵니다. ‘신뢰할 만한 사람’이 불필요한 신학적 연상을 피하면서 의미를 보존합니다.
  - severity: low
