  yaml_path: translation/ot/daniel/006/001.yaml
  text: And Darius the Mede received the kingdom[a], being about sixty-two years old.
  footnotes:
  - marker: a
    text: Or "took the kingdom." The Aramaic verb can be rendered more broadly, but "received" more closely reflects the wording and avoids implying a specific mechanism of accession.
    reason: lexical_alternative
translation:
  language: ko
  text: 메대 사람 다리오가 왕국을 받았는데, 그는 약 예순두 살이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕국을 취하였다.” 아람어 동사는 더 넓게 옮길 수 있으나, “받다”가 표현을 더 가깝게 따르며 즉위 방식을 특정하지 않습니다.
    reason: lexical_alternative
