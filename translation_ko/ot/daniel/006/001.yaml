theological_decisions:
- issue: 다리오의 왕국 수임 방식
  chosen_reading: '"받았다"로 옮겨, 다리오가 어떻게 즉위했는지는 본문이 결정하지 않도록 두었습니다.'
  alternative_readings:
  - 왕국을 취했다
  - 왕국을 넘겨받았다
  - 왕이 되었다
  rationale: 본문은 역사적·정치적 메커니즘을 설명하지 않으므로, 원문이 제시하는 제한된 진술만 반영했습니다.
  doctrine_reference: 본문의 역사적 긴장을 해소하지 않고 보존
