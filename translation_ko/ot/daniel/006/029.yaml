source:
  edition: WLC
  text: וְ/דָנִיֵּ֣אל דְּנָ֔ה הַצְלַ֖ח בְּ/מַלְכ֣וּת דָּרְיָ֑וֶשׁ וּ/בְ/מַלְכ֖וּת כּ֥וֹרֶשׁ פרסי/א׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/029.yaml
  text: And this Daniel prospered during the reign of Darius and during the reign of Cyrus the Persian[a].
  footnotes:
  - marker: a
    text: Or, possibly, 'during the reign of Darius, that is, the reign of Cyrus the Persian,' if the two names are understood to refer to the same ruler.
    reason: alternative_reading
translation:
  language: ko
  text: 이 다니엘은 다리오의 통치 기간과 바사 사람 고레스의 통치 기간에 번성하였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 다리오의 통치 기간, 곧 바사 사람 고레스의 통치 기간으로 이해할 수 있습니다. 두 이름이 같은 통치자를 가리킨다고 볼 경우입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה
  english_pob_choice: this
  chosen_korean: 이
  alternatives_korean:
  - 그
  lexicon: HALOT
  rationale: 가리키는 대상이 바로 앞에서 언급된 다니엘임을 살리기 위해 지시 형용사 ‘이’를 사용했습니다.
- source_word: הַצְלַח
  english_pob_choice: prospered
  chosen_korean: 번성하였습니다
  alternatives_korean:
  - 형통하였습니다
  - 성공하였습니다
  lexicon: HALOT
  rationale: 단순한 성공보다 지속적 번성과 형통의 뉘앙스를 함께 담아, 서술적 결론으로서 자연스러운 한국어를 택했습니다.
- source_word: בְּמַלְכוּת
  english_pob_choice: during the reign of
  chosen_korean: 통치 기간에
  alternatives_korean:
  - 왕국에서
  - 다스림 아래
  lexicon: HALOT
  rationale: 문맥상 장소가 아니라 시간 범위를 나타내므로 ‘통치 기간에’로 옮겨 왕권 행사의 기간성을 분명히 했습니다.
- source_word: כּוֹרֶשׁ פרסי
  english_pob_choice: Cyrus the Persian
  chosen_korean: 바사 사람 고레스
  alternatives_korean:
  - 페르시아 사람 고레스
  - 고레스 왕
  lexicon: HALOT
  rationale: ‘פרסי’의 민족/제국 표지를 살려 ‘바사 사람’으로 옮기고, 고유명사 ‘고레스’는 한국어 성경에서 널리 알려진 형태를 따랐습니다.
theological_decisions:
- issue: 다리오와 고레스의 관계를 어떻게 처리할지
  chosen_reading: 두 표현을 그대로 유지하여, 다니엘이 다리오의 통치 기간에도, 고레스의 통치 기간에도 번성했다고 서술했습니다.
  alternative_readings:
  - 다리오와 고레스가 같은 통치자를 가리킨다고 해석
  - 두 왕의 연속된 통치를 조화시켜 설명
  rationale: 본문은 두 이름을 병치할 뿐 관계를 해명하지 않으므로, 번역은 역사적 조화를 강요하지 않고 원문의 긴장을 보존해야 합니다.
  doctrine_reference: 본문이 드러내지 않는 조화는 번역에서 단정하지 않습니다.
