- from: 다니엘은 그 문서가 서명되었다는 것을 알게 되자 자기 집으로 갔습니다. 그의 윗방의 창문들은 예루살렘을 향해 열려 있었고, 그는 하루 세 번 무릎을 꿇고 기도하며 자기 하나님 앞에 감사를 드렸습니다[a][b][c]. 그는 이전부터 그렇게 해 왔습니다.
