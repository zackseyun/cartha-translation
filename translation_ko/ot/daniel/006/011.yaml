id: DAN.6.11
reference: Daniel 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/דָנִיֵּאל כְּ/דִ֨י יְדַ֜ע דִּֽי רְשִׁ֤ים כְּתָבָ/א֙ עַ֣ל לְ/בַיְתֵ֔/הּ וְ/כַוִּ֨ין פְּתִיחָ֥ן לֵ/הּ֙ בְּ/עִלִּיתֵ֔/הּ נֶ֖גֶד יְרוּשְׁלֶ֑ם וְ/זִמְנִין֩ תְּלָתָ֨ה בְ/יוֹמָ֜/א ה֣וּא בָּרֵ֣ךְ עַל בִּרְכ֗וֹ/הִי וּ/מְצַלֵּ֤א וּ/מוֹדֵא֙ קֳדָ֣ם אֱלָהֵ֔/הּ כָּ/ל קֳבֵל֙ דִּֽי הֲוָ֣א עָבֵ֔ד מִן קַדְמַ֖ת דְּנָֽה־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/011.yaml
  text: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
  footnotes:
  - marker: a
    text: Or "the writing had been signed"; the Aramaic refers to the officially written decree being formally enacted.
    reason: lexical_alternative
  - marker: b
    text: Or "facing Jerusalem."
    reason: lexical_alternative
  - marker: c
    text: The phrase "he knelt on his knees" expresses Daniel's prayer posture; the underlying verb is associated with kneeling here in context.
    reason: cultural_note
translation:
  language: ko
  text: 다니엘은 그 문서가 서명되었다는 것을 알고[a] 자기 집으로 갔습니다. 그의 윗방에는 예루살렘을 향해[b] 열린 창문들이 있었고, 그는 하루에 세 번 무릎을 꿇고[c] 기도하며 자기 하나님 앞에 감사를 드렸습니다. 이는 그가 이전부터 해 오던 일이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 글이 서명되었다는 것”; 아람어는 공식적으로 작성된 금령이 효력을 갖게 된 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “예루살렘을 마주하여”.
    reason: lexical_alternative
  - marker: c
    text: “무릎을 꿇고”는 기도 자세를 나타냅니다. 원문은 여기서 ‘무릎’과 함께 쓰여 그 자세를 표현합니다.
    reason: cultural_note
lexical_decisions:
- source_word: רְשִׁים כְּתָבָא
  english_pob_choice: the document had been signed
  chosen_korean: 그 문서가 서명되었다는 것
  alternatives_korean:
  - 그 글이 서명되었다는 것
  - 그 공문이 공표되었다는 것
  lexicon: HALOT
  rationale: 아람어의 공식 문서가 법적으로 효력을 갖게 된 상황을 가리키므로, 한국어에서는 행정·법률 문맥이 드러나는 ‘서명되었다’가 자연스럽고 source-direct입니다.
- source_word: נֶגֶד יְרוּשְׁלֶם
  english_pob_choice: toward Jerusalem
  chosen_korean: 예루살렘을 향해
  alternatives_korean:
  - 예루살렘을 마주하고
  - 예루살렘 쪽으로
  lexicon: HALOT
  rationale: 방향성과 기도의 지향을 함께 살리기 위해 ‘향해’를 택했습니다. 한국어에서 가장 간결하게 orientation을 드러냅니다.
- source_word: בָּרֵךְ עַל בִּרְכֹוהִי
  english_pob_choice: he knelt on his knees
  chosen_korean: 무릎을 꿇고
  alternatives_korean:
  - 무릎 위에 엎드리고
  - 무릎으로 꿇고
  lexicon: HALOT
  rationale: 관용구는 문자적으로 ‘무릎 위에 복을 빌다’가 아니라 자세를 뜻하므로, 행동 자체를 직접 드러내는 ‘무릎을 꿇고’가 가장 정확합니다.
- source_word: מוֹדֵא
  english_pob_choice: gave thanks
  chosen_korean: 감사를 드렸습니다
  alternatives_korean:
  - 감사했습니다
  - 감사드렸습니다
  lexicon: HALOT
  rationale: 하나님 앞에서의 예배적 감사라는 뉘앙스를 살리면서도 현대 한국어에서 자연스럽게 들리는 표현입니다.
theological_decisions:
- issue: 다니엘의 기도 자세와 지속성
  chosen_reading: 본문의 서술을 과장하지 않고, 다니엘이 기존 습관대로 무릎을 꿇고 기도하며 감사한 것으로 옮겼습니다.
  alternative_readings:
  - ‘왕의 금령에도 불구하고’처럼 저항성에 더 무게를 둘 수 있습니다.
  rationale: 히브리/아람어 본문은 이 절에서 다니엘의 행위를 묘사할 뿐, 직접적인 정치적 해석을 덧붙이지 않습니다. 따라서 서술의 중심을 ‘지속된 경건’에 두었습니다.
  doctrine_reference: Translation philosophy §1, §3
