  text: שְׁפַר֙ קֳדָ֣ם דָּרְיָ֔וֶשׁ וַ/הֲקִים֙ עַל מַלְכוּתָ֔/א לַ/אֲחַשְׁדַּרְפְּנַיָּ֖/א מְאָ֣ה וְ/עֶשְׂרִ֑ין דִּ֥י לֶהֱוֺ֖ן בְּ/כָל מַלְכוּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/002.yaml
  text: It seemed good to Darius to appoint over the kingdom one hundred and twenty satraps[a], who would be throughout the whole kingdom.
  footnotes:
  - marker: a
    text: Or 'provincial governors' for 'satraps,' referring to high Persian administrative officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 다리오에게는 왕국 전체에 백이십 명의 사트라프를 세우는 것이 좋게 여겨졌습니다. 이들은 온 왕국에 두루 있게 될 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주(州) 총독들’로 옮길 수 있으며, ‘사트라프’는 페르시아의 고위 지방 행정관을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַר קֳדָם
  english_pob_choice: It seemed good to Darius
  chosen_korean: 다리오에게는 … 좋게 여겨졌습니다
  alternatives_korean:
  - 다리오에게는 … 좋았습니다
  - 다리오에게는 … 합당하게 여겨졌습니다
  lexicon: HALOT
  rationale: 아람어 관용구의 평가적 의미를 살리되, 한국어에서는 자연스러운 수동형 표현으로 왕에게 그렇게 보였다는 판단을 전달했습니다.
- source_word: וַהֲקִים עַל מַלְכוּתָא
  english_pob_choice: to appoint over the kingdom
  chosen_korean: 왕국 전체에 … 사트라프를 세우는
  alternatives_korean:
  - 왕국을 다스리도록 … 사트라프를 임명하는
  - 왕국 위에 … 사트라프를 세우는
  lexicon: HALOT
  rationale: 행정적 맥락의 וַהֲקִים은 단순히 ‘세우다’보다 ‘임명하다’에 가깝지만, 한국어 본문에서는 짧고 직관적인 표현을 택하고, 행정적 대상임은 뒤의 명사로 보완했습니다.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  english_pob_choice: satraps
  chosen_korean: 사트라프
  alternatives_korean:
  - 주(州) 총독
  - 지방 행정관
  lexicon: HALOT
  rationale: 페르시아 고유 행정 직함을 보존해 역사적 색채를 살렸습니다. 전통 교회식 일반어로 풀기보다 음역이 원문 대응에 더 정확합니다.
- source_word: בְּכָל מַלְכוּתָא
  english_pob_choice: throughout the whole kingdom
  chosen_korean: 온 왕국에 두루
  alternatives_korean:
  - 왕국 전체에
  - 온 나라에 두루
  lexicon: HALOT
  rationale: 단순한 ‘안에’보다 분포의 범위를 나타내는 ‘두루’를 써서, 모든 지역에 배치된 행정 구조를 반영했습니다.
theological_decisions:
- issue: 왕권 결정의 표현 방식
  chosen_reading: ‘좋게 여겨졌습니다’로 옮겨, 다리오의 행정 결정을 평가적 진술로 유지했습니다.
  alternative_readings:
  - ‘원했습니다’
  - ‘명령했습니다’
  rationale: 본문은 단순한 명령 서술보다 왕의 판단이 타당하다고 여겨진 상태를 말하므로, 평가적 뉘앙스를 보존하는 쪽이 원문에 가깝습니다.
  doctrine_reference: 서사 본문의 의미론 보존
