revisions:
- from: 그러자 그 사람들은 말했습니다[a]. “우리는 이 다니엘에게서 어떤 빌미도 찾지 못할 것입니다. 다만 그의 하나님의 율법에서 찾을 수 있을 뿐입니다.”
  to: 그러자 이 사람들이 말했습니다. “우리는 이 다니엘을 고발할 아무 근거도[a] 찾아내지 못할 것입니다. 그의 하나님의 율법과 관련해서 그를 고발할 근거를 찾아내지 않는 한은 말입니다.”
  rationale: 원문의 미래적 결론과 ‘~하지 않는 한’의 예외 조건을 회복했습니다. ‘율법과 관련해서’는 בְּדָת의 영역·관계적 의미를 보존하며, 그 율법 자체에 어떤 잘못이 있다는 뜻을 덧붙이지 않습니다. 각주 표지도 설명 대상인 법적 근거 표현으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
