id: DAN.6.6
reference: Daniel 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ אָֽמְרִ֔ין דִּ֣י לָ֧א נְהַשְׁכַּ֛ח לְ/דָנִיֵּ֥אל דְּנָ֖ה כָּל עִלָּ֑א לָהֵ֕ן הַשְׁכַּ֥חְנָֽה עֲל֖וֹ/הִי בְּ/דָ֥ת אֱלָהֵֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/006.yaml
  text: Then these men said[a], ‘We will not find any charge against this Daniel unless we find it against him in the law of his God.’
  footnotes:
  - marker: a
    text: Or “any ground for accusation” for “any charge.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 사람들은 말했습니다[a]. “우리는 이 다니엘에게서 어떤 빌미도 찾지 못할 것입니다. 다만 그의 하나님의 율법에서 찾을 수 있을 뿐입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어떤 고발의 근거도”로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן / Then
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그다음에
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 이어 주는 시간·결과 연결어로, 영어의 Then에 해당하는 현대 한국어 표현으로 옮겼습니다.
- source_word: גֻּבְרַיָּא אִלֵּךְ / these men
  english_pob_choice: these men
  chosen_korean: 그 사람들은
  alternatives_korean:
  - 이 사람들은
  - 그 남자들은
  lexicon: HALOT
  rationale: 본문의 일반 명사성을 살리되 한국어에서는 문맥상 자연한 지시 표현으로 처리했습니다. 이 절에서는 직함보다 말하는 주체의 집단성을 드러내는 것이 더 중요합니다.
- source_word: כָּל עִלָּא / any charge
  english_pob_choice: any charge
  chosen_korean: 어떤 빌미도
  alternatives_korean:
  - 어떤 고발 근거도
  - 어떤 혐의도
  - 어떤 죄목도
  lexicon: HALOT
  rationale: 법정 맥락에서 ‘고발의 근거’라는 뜻이지만, 한국어에서는 상대를 걸어 넘어뜨릴 법적 구실을 뜻하는 ‘빌미’가 가장 자연스럽고 문맥상 날카로운 뉘앙스를 살립니다.
- source_word: בְּדָת אֱלָהֵהּ / in the law of his God
  english_pob_choice: in the law of his God
  chosen_korean: 그의 하나님의 율법
  alternatives_korean:
  - 그의 하나님의 법
  - 그의 신의 율법
  lexicon: HALOT
  rationale: דָת는 여기서 제도적 ‘법/율법’을 뜻하므로 표준 성서 용례에 맞는 ‘율법’으로 옮겼습니다. ‘그의 하나님’은 소유 관계를 유지하면서도 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: ‘charge’의 법정적 성격을 한국어에서 어떻게 드러낼지
  chosen_reading: 직접적인 ‘고발 근거’보다는 더 회화적인 ‘빌미’로 옮겨, 그들이 다니엘을 정죄할 구실을 찾고 있다는 의도를 살렸습니다.
  alternative_readings:
  - 어떤 고발 근거도
  - 어떤 혐의도
  rationale: 이 구절의 핵심은 단순 정보가 아니라 적대적 수사입니다. 한국어 ‘빌미’는 법정적·사회적 구실의 뉘앙스를 함께 담아, 원문의 공격성을 과도하게 완화하지 않습니다.
  doctrine_reference: '번역 원칙: source-direct, 문맥상 힘 있는 의미 보존'
