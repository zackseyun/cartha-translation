  verdict: revise
  source_fidelity: 첫 문장의 ‘다만 그의 하나님의 율법에서 찾을 수 있을 뿐입니다’는 원문의 조건절(‘…에서/…과 관련하여 찾아내지 않는 한’)을 ‘찾을 수 있다’는 단정으로 바꾸어 뜻이 달라집니다. 조건적 예외를 명시해야 합니다.
  naturalness: ‘이 사람들’, ‘고발할 아무 근거도’, ‘~하지 않는 한’은 현대 표준 한국어 합쇼체 서사 문맥에서 자연스럽습니다. ‘율법과 관련해서’는 원문의 전치사구가 지닌 관계·영역의 뜻을 무리 없이 보존합니다.
  terminology: עִלָּא는 법적 आरोप/고발의 근거를 가리키므로 ‘고발할 아무 근거’로 옮겼습니다. דָת אֱלָהֵהּ는 ‘그의 하나님의 율법’으로 유지했습니다. 각주 표지는 해당 어휘에 붙여야 합니다.
