  lexicon: HALOT
  rationale: 아람어 관직어의 상위 행정직이라는 뜻을 현대 한국어에서 자연스럽게 전달하되, 단순한 '관리'보다 지위를 분명히 했습니다.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  english_pob_choice: satraps
  chosen_korean: 총독들
  alternatives_korean:
  - 사트라프들
  - 지방 총독들
  lexicon: HALOT
  rationale: 페르시아 제국의 지방 통치자라는 역사적 배경을 살리면서도, 한국어 본문에서 이해가 쉬운 표준 행정 용어를 택했습니다.
- source_word: הַרְגִּשׁוּ עַל
  english_pob_choice: came before the king
  chosen_korean: 왕에게 몰려와
  alternatives_korean:
  - 왕 앞에 나아와
  - 왕에게 함께 와
  lexicon: HALOT
  rationale: 이 관용구는 단순한 '도착'보다 집단적으로 압박하듯 다가가는 뉘앙스를 가지므로, 본문에는 '몰려와'로 옮기고 해당 집단적 접근을 보존했습니다.
theological_decisions:
- issue: 왕에게 하는 궁정 경례의 의미
  chosen_reading: 「오래 사십시오!」로 옮겨, 문자적으로는 '세세히/영원히 사십시오'라는 공식 축원의 성격을 드러냈습니다.
  alternative_readings:
  - 「영원히 사십시오!」
  - 「만세!」
  rationale: 원문의 관용적 궁정 인사말을 현대 한국어에서 이해 가능하게 하되, 실제로는 불멸 선언이 아니라 왕의 장수를 비는 예식적 축하임을 유지했습니다.
  doctrine_reference: 왕권 예식 언어의 관용적 축원 표현
- issue: 직접 화법의 존칭
  chosen_reading: 왕에 대한 직접 호칭은 「다리오 왕이시여」로 하여 한국어 공손 체계를 반영했습니다.
  alternative_readings:
  - 「다리오 왕」
  - 「왕 다리오시여」
  rationale: 접근하는 신하들의 공적 발화라는 점을 고려하여, 현대 한국어의 예식적 존대가 원문의 궁정적 분위기를 가장 잘 전달합니다.
  doctrine_reference: 담화 화용상 존대 표현
