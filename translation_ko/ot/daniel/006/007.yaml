  naturalness: ‘그러자’, ‘고위 관료들’, ‘총독들’, ‘다리오 왕이시여, 오래 사십시오!’는 현대 표준 한국어 합쇼체로 자연스럽고 궁정 발화의 격식에도 알맞습니다.
