base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/007.yaml
  text: 'Then these high officials and satraps came before the king and said this to him: “King Darius[b][a], live forever!”'
  footnotes:
  - marker: a
    text: Or “assembled before the king,” “came by agreement to the king,” or “came tumultuously to the king.” The Aramaic idiom emphasizes a coordinated collective approach and may imply conspiratorial intent from the context.
    reason: lexical_alternative
  - marker: b
    text: Literally, “King Darius, live for ages.” This is a conventional court acclamation, not a literal claim of immortality.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 그 고위 관료들과 총독들이 왕에게 몰려와 그에게 이렇게 말했습니다. 「다리오 왕이시여, 오래 사십시오!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 관용구는 단순히 '왔다'기보다 여러 관료가 한꺼번에 조직적으로 왕에게 접근했다는 뜻을 담으며, 문맥상 음모적 뉘앙스도 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 「다리오 왕, 오래도록 사십시오」에 가깝습니다. 이는 실제 불멸 주장이라기보다 궁정에서 쓰는 관용적 축원입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그 후
  lexicon: HALOT
  rationale: 서사 전개의 순서를 자연스럽게 잇는 접속 부사로, 단순한 시간표시보다 다음 행동의 전환을 분명히 드러냅니다.
- source_word: סָרְכַיָּא
  english_pob_choice: high officials
  chosen_korean: 고위 관료들
  alternatives_korean:
  - 관리들
  - 수석 관료들
  lexicon: HALOT
  rationale: 아람어 관직어의 상위 행정직이라는 뜻을 현대 한국어에서 자연스럽게 전달하되, 단순한 '관리'보다 지위를 분명히 했습니다.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  english_pob_choice: satraps
  chosen_korean: 총독들
  alternatives_korean:
  - 사트라프들
  - 지방 총독들
  lexicon: HALOT
  rationale: 페르시아 제국의 지방 통치자라는 역사적 배경을 살리면서도, 한국어 본문에서 이해가 쉬운 표준 행정 용어를 택했습니다.
- source_word: הַרְגִּשׁוּ עַל
  english_pob_choice: came before the king
  chosen_korean: 왕에게 몰려와
  alternatives_korean:
  - 왕 앞에 나아와
  - 왕에게 함께 와
  lexicon: HALOT
  rationale: 이 관용구는 단순한 '도착'보다 집단적으로 압박하듯 다가가는 뉘앙스를 가지므로, 본문에는 '몰려와'로 옮기고 해당 집단적 접근을 보존했습니다.
theological_decisions:
- issue: 왕에게 하는 궁정 경례의 의미
  chosen_reading: 「오래 사십시오!」로 옮겨, 문자적으로는 '세세히/영원히 사십시오'라는 공식 축원의 성격을 드러냈습니다.
  alternative_readings:
  - 「영원히 사십시오!」
  - 「만세!」
  rationale: 원문의 관용적 궁정 인사말을 현대 한국어에서 이해 가능하게 하되, 실제로는 불멸 선언이 아니라 왕의 장수를 비는 예식적 축하임을 유지했습니다.
  doctrine_reference: 왕권 예식 언어의 관용적 축원 표현
- issue: 직접 화법의 존칭
  chosen_reading: 왕에 대한 직접 호칭은 「다리오 왕이시여」로 하여 한국어 공손 체계를 반영했습니다.
  alternative_readings:
  - 「다리오 왕」
  - 「왕 다리오시여」
  rationale: 접근하는 신하들의 공적 발화라는 점을 고려하여, 현대 한국어의 예식적 존대가 원문의 궁정적 분위기를 가장 잘 전달합니다.
  doctrine_reference: 담화 화용상 존대 표현
