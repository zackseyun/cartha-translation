  lexicon: HALOT
  rationale: 서사 전개의 순서를 자연스럽게 잇는 접속 부사로, 단순한 시간표시보다 다음 행동의 전환을 분명히 드러냅니다.
- source_word: סָרְכַיָּא
  english_pob_choice: high officials
  chosen_korean: 고위 관료들
  alternatives_korean:
