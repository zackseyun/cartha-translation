  yaml_path: translation/ot/daniel/006/010.yaml
  text: Because of this[a], King Darius signed the document and the injunction.
  footnotes:
  - marker: a
    text: Or 'Therefore, King Darius wrote down the document and the interdict.' The Aramaic can be rendered more formally, but 'signed ... injunction' better conveys the legal force in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 왕 다리우스는 문서와 금령에 서명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러므로 왕 다리우스는 문서와 금령을 기록했습니다.’ 아람어 동사는 ‘기록하다’로도 옮길 수 있습니다. 그러나 여기서는 왕이 법적 효력을 지닌 문서를 공식적으로 승인하는 문맥이므로, ‘서명했습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  english_pob_choice: Because of this
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그 결과
  - 그러하여
  lexicon: HALOT
  rationale: 앞선 이야기의 결과를 나타내는 아람어 관용구이므로, 한국어에서는 자연스러운 인과 접속어 ‘그러므로’로 압축해 전달했습니다.
- source_word: מַלְכָּא דָּרְיָוֶשׁ
  english_pob_choice: King Darius
  chosen_korean: 왕 다리우스
  alternatives_korean:
  - 다리우스 왕
  - 왕 다리오스
  lexicon: HALOT
  rationale: 문맥상 왕호가 앞에 오는 서술을 살리되, 고유명사는 통용 음역인 ‘다리우스’로 옮겼습니다.
- source_word: רְשַׁם
  english_pob_choice: signed
  chosen_korean: 서명했습니다
  alternatives_korean:
  - 기록했습니다
  - 적었습니다
  - 작성했습니다
  lexicon: HALOT
  rationale: 법적 효력을 띤 문서에 왕이 최종적으로 승인하는 행위이므로, 단순한 ‘기록’보다 ‘서명’이 POB의 해석을 한국어로 더 정확히 드러냅니다.
- source_word: כְּתָבָא וֶאֱסָרָא
  english_pob_choice: the document and the injunction
  chosen_korean: 문서와 금령
  alternatives_korean:
  - 문서와 금지령
  - 문서와 칙령
  - 기록과 금령
  lexicon: HALOT
  rationale: ‘문서’는 כְּתָבָא의 서면 문서를, ‘금령’은 법적 구속력을 지닌 금지/제한 명령을 반영하며, 영어 POB의 두 항목 구분을 유지합니다.
theological_decisions:
- issue: 법적 문서의 성격을 어떻게 드러낼지
  chosen_reading: 왕이 단순히 글을 쓴 것이 아니라, 법적 효력을 가진 문서와 금령에 공식적으로 서명한 것으로 읽었습니다.
  alternative_readings:
  - 왕이 문서를 작성하고 금령을 내렸다고 옮길 수 있습니다.
  - 왕이 문서를 기록했다고만 옮길 수도 있습니다.
  rationale: 본문의 문맥은 행정적 기록이 아니라 공적 구속력을 지닌 조서의 발효를 가리키므로, 이를 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 다니엘 6장의 왕령은 인간 권력의 법적 강제를 보여 주는 역사 서술입니다.
