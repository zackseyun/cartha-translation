  text: וַ/אֲמַ֣ר מַלְכָּ֗/א וְ/הַיְתִ֞יו גֻּבְרַיָּ֤/א אִלֵּךְ֙ דִּֽי אֲכַ֤לוּ קַרְצ֨וֹ/הִי֙ דִּ֣י דָֽנִיֵּ֔אל וּ/לְ/גֹ֤ב אַרְיָוָתָ/א֙ רְמ֔וֹ אִנּ֖וּן בְּנֵי/ה֣וֹן וּ/נְשֵׁי/ה֑וֹן וְ/לָֽא מְט֞וֹ לְ/אַרְעִ֣ית גֻּבָּ֗/א עַ֠ד דִּֽי שְׁלִ֤טֽוּ בְ/הוֹן֙ אַרְיָ֣וָתָ֔/א וְ/כָל גַּרְמֵי/ה֖וֹן הַדִּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/025.yaml
  text: Then the king commanded[a], and those men who had maliciously accused Daniel were brought and thrown into the lions’ den—they, their sons, and their wives. And before they reached the bottom of the den, the lions overpowered them and crushed all their bones.
  footnotes:
  - marker: a
    text: Aramaic idiom, literally 'ate his pieces'; that is, they slandered or maliciously accused Daniel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 명령하였습니다. 다니엘을 악의적으로 고발한[a] 그 사람들과 그들의 아들들과 아내들을 끌어다가 사자 굴에 던졌습니다. 그들이 굴의 바닥에 이르기도 전에 사자들이 그들을 제압하고 그들의 모든 뼈를 부수었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 관용구로, 직역하면 ‘그의 조각들을 먹었다’는 뜻이며, 곧 다니엘을 비방하거나 악의적으로 고발했다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר
  english_pob_choice: Then the king commanded
  chosen_korean: 그러자 왕이 명령하였습니다
  alternatives_korean:
  - 그리고 왕이 말하였습니다
  - 그때 왕이 명령했습니다
  lexicon: HALOT
  rationale: 어근은 ‘말하다’이지만, 앞뒤 문맥이 판결 집행과 연결되므로 한국어에서는 ‘명령하다’가 원문의 기능을 더 잘 드러냅니다. ‘그러자’는 서사 진행의 וַ-연속성을 자연스럽게 옮깁니다.
- source_word: אֲכַלוּ קַרְצֹוהִי דִּי דָנִיֵּאל
  english_pob_choice: had maliciously accused Daniel
  chosen_korean: 다니엘을 악의적으로 고발한
  alternatives_korean:
  - 다니엘을 비방한
  - 다니엘을 참소한
  - 다니엘을 해하려고 고발한
  lexicon: HALOT
  rationale: 아람어 관용구를 직역하지 않고, 문맥상 ‘악의적으로 고발하다/참소하다’의 의미를 살려 재현했습니다. ‘고발한’은 법정적 성격을, ‘악의적으로’는 원문의 적대성을 드러냅니다.
- source_word: וּלְגֹב אַרְיָוָתָא רְמוֹ
  english_pob_choice: were ... thrown into the lions’ den
  chosen_korean: 사자 굴에 던졌습니다
  alternatives_korean:
  - 사자 구덩이에 던졌습니다
  - 사자들의 굴에 던졌습니다
  lexicon: HALOT
  rationale: 이 장에서 גּוֹב은 관용적으로 ‘굴/구덩이’이며, 문맥상 한국어 성경 독자에게도 ‘사자 굴’이 가장 자연스럽습니다. ‘던지다’는 폭력적인 처형 행위를 살립니다.
- source_word: אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן
  english_pob_choice: they, their sons, and their wives
  chosen_korean: 그들, 그들의 아들들과 아내들까지
  alternatives_korean:
  - 그들, 그들의 자녀들과 아내들까지
  - 그들과 그들의 아들들과 아내들까지
  lexicon: HALOT
  rationale: 원문은 ‘아들들’(sons)로 구체적으로 말하므로 ‘자녀들’로 일반화하지 않았습니다. 마지막 ‘까지’는 가족 포함의 범위를 강조하는 원문의 병렬을 자연스럽게 살립니다.
- source_word: וְכָל גַּרְמֵיהוֹן הַדִּקוּ
  english_pob_choice: and crushed all their bones
  chosen_korean: 모든 뼈를 부숴 버렸습니다
  alternatives_korean:
  - 모든 뼈를 부수었습니다
  - 온전히 뼈를 부러뜨렸습니다
  - 모든 뼈를 산산이 부쉈습니다
  lexicon: HALOT
  rationale: 동사는 단순 골절보다 더 강한 파괴를 뜻하므로 ‘부숴 버리다’로 폭력성과 완결성을 함께 표현했습니다. ‘모든 뼈’는 전면적 파괴라는 원문의 총체성을 보존합니다.
theological_decisions:
- issue: 가족까지 포함된 처벌의 서술
  chosen_reading: 원문이 말하는 그대로 ‘그들, 그들의 아들들과 아내들까지’를 유지하고, 윤리적 완화나 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘그들의 자녀들’로 완화하기
  - 가족 언급을 생략하기
  rationale: 본문은 왕의 보복적 판결의 범위를 분명히 서술합니다. 번역은 이 역사적 진술의 강도를 약화시키지 않아야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
