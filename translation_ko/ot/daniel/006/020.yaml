base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/020.yaml
  text: Then the king arose at dawn[a], at first light[b], and in haste went to the den of the lions.
  footnotes:
  - marker: a
    text: Or 'at daybreak ... when it became light.' The verse uses two closely related dawn expressions for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''In haste'' may also carry the sense ''in alarm'' or ''in anxious urgency.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 새벽에, 첫빛이 비치자마자 서둘러 사자들의 굴로 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 새벽을 가리키는 서로 가까운 두 표현을 연속해 사용하여 강조합니다.
    reason: source_note
  - marker: b
    text: ‘서둘러’는 ‘불안한 마음으로’, ‘긴급하게’라는 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן / מַלְכָּא
  english_pob_choice: Then the king
  chosen_korean: 그때 왕은
  alternatives_korean:
  - 그런 다음 왕은
  - 그때 그 왕은
  lexicon: WLC; HALOT
  rationale: Aramaic 담화 표지와 정관적 '왕'을 자연스러운 서술 흐름으로 옮기되, 문맥상 특정 왕이므로 따로 설명적 반복은 피했습니다.
- source_word: בִּשְׁפַּרְפָּרָא / בְּנָגְהָא
  english_pob_choice: at dawn / at first light
  chosen_korean: 새벽에, 첫빛이 비치자마자
  alternatives_korean:
  - 동틀 무렵에, 밝아오자마자
  - 새벽녘에, 날이 밝자마자
  lexicon: WLC; HALOT
  rationale: 두 개의 근접한 새벽 표현을 각각 살려, 단순 중복이 아니라 강조라는 원문 효과를 한국어에서도 드러냈습니다.
- source_word: וּבְהִתְבְּהָלָה
  english_pob_choice: and in haste
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 불안한 마음으로 서둘러
  lexicon: HALOT
  rationale: 행동의 속도와 긴급성을 우선 살리면서, 문맥상 가능한 감정적 뉘앙스는 과잉 해석하지 않도록 했습니다.
- source_word: לְגֻבָּא דִי אַרְיָוָתָא
  english_pob_choice: to the den of the lions
  chosen_korean: 사자들의 굴로
  alternatives_korean:
  - 사자 굴로
  - 사자들의 구덩이로
  lexicon: WLC; HALOT
  rationale: 다니엘 6장의 고유한 장소를 한국어 성경 문맥에서 가장 자연스럽고 분명한 '사자들의 굴'로 옮겼습니다.
theological_decisions:
- issue: 새벽 표현의 이중 강조를 어떻게 살릴 것인가
  chosen_reading: 두 시간 표현을 모두 분리해 번역했습니다.
  alternative_readings:
  - 둘 중 하나만 번역해 간결화한다
  - 하나로 합쳐 '이른 새벽'으로 옮긴다
  rationale: 원문은 가까운 새벽 표현을 겹쳐 사용해 긴박함을 강조하므로, 합쳐서 평준화하기보다 둘 다 보존하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 문학적 강조의 보존
