    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 새벽에, 날이 밝자마자[a] 일어나 서둘러[b] 사자들의 굴로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
