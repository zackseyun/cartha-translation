  text: בֵּ/אדַ֜יִן מַלְכָּ֣/א אֲמַ֗ר וְ/הַיְתִיו֙ לְ/דָ֣נִיֵּ֔אל וּ/רְמ֕וֹ לְ/גֻבָּ֖/א דִּ֣י אַרְיָוָתָ֑/א עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר לְ/דָנִיֵּ֔אל אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א ה֖וּא יְשֵׁיזְבִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/017.yaml
  text: Then the king gave the command[a], and they brought Daniel and threw him into the den of lions. The king answered and said to Daniel, “Your God, whom you continually serve[b], he will deliver you.”
  footnotes:
  - marker: a
    text: 'Traditional English: “into the lions’ den.”'
    reason: lexical_alternative
  - marker: b
    text: Or, “may he deliver you.” The Aramaic can be taken by some as expressing a wish, though the main text follows the more direct declarative sense, “he will deliver you.”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 왕은 명령을 내렸고, 그들이 다니엘을 끌고 와서 사자 굴에 던졌습니다. 왕이 다니엘에게 대답하여 말했습니다. "당신이 끊임없이 섬기는 당신의 하나님이 당신을 건져내실 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적 한국어 성경은 “사자 굴”을 자주 “사자 굴 속”으로 풀어 옮깁니다.
    reason: previous_rendering
  - marker: b
    text: 아람어 פָּלַח는 여기서 신에게 드리는 지속적 섬김의 뜻을 가집니다.
    reason: source_note
lexical_decisions:
- source_word: בֵּאדַיִן / אֲמַר
  english_pob_choice: Then the king gave the command
  chosen_korean: 그때 왕은 명령을 내렸고
  alternatives_korean:
  - 그때 왕이 말했고
  - 그때 왕이 명을 내렸고
  lexicon: HALOT
  rationale: 아람어의 사건 전개 표지와 왕의 발화가 실제로는 행정적 지시를 여는 기능을 하므로, 직역적 ‘말했습니다’보다 ‘명령을 내렸고’가 문맥의 힘을 잘 살립니다.
- source_word: וְהַיְתִיו / וּרְמוֹ
  english_pob_choice: they brought ... threw
  chosen_korean: 그들이 다니엘을 끌고 와서 ... 던졌습니다
  alternatives_korean:
  - 그들이 다니엘을 데려와서 ... 넣었습니다
  - 그들이 다니엘을 이끌어 와서 ... 던졌습니다
  lexicon: HALOT
  rationale: ‘가져오다’의 사역적 의미와 ‘던지다’의 거친 동작을 살리되, 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: לְגֻבָּא דִּי אַרְיָוָתָא
  english_pob_choice: into the den of lions
  chosen_korean: 사자 굴에
  alternatives_korean:
  - 사자들의 굴에
  - 사자 우리에
  lexicon: HALOT
  rationale: 아람어의 장소 표현을 간결하게 살리면서, 기존 성경 독자에게도 분명한 ‘사자 굴’로 옮겼습니다.
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  english_pob_choice: Your God, whom you continually serve
  chosen_korean: 당신이 끊임없이 섬기는 당신의 하나님
  alternatives_korean:
  - 당신이 늘 섬기는 당신의 하나님
  - 당신이 계속 섬기는 당신의 하나님
  lexicon: HALOT
  rationale: פָּלַח는 단순 봉사보다 신에게 드리는 섬김의 범위를 가지므로 ‘섬기다’를 유지했고, בִּתְדִירָא는 지속성을 분명히 하도록 ‘끊임없이’로 옮겼습니다.
- source_word: יְשֵׁיזְבִנָּךְ
  english_pob_choice: he will deliver you
  chosen_korean: 당신을 건져내실 것입니다
  alternatives_korean:
  - 당신을 구해 주실 것입니다
  - 당신을 건지실 것입니다
  lexicon: HALOT
  rationale: 위험한 상황에서의 구출·해방을 뜻하므로, 한국어에서 힘을 살리는 ‘건져내다’를 선택했습니다.
theological_decisions:
- issue: 왕의 마지막 진술의 시제·어조
  chosen_reading: 단순 예언형의 확언으로 옮기되, 왕의 믿음 여부를 과장하지 않았습니다.
  alternative_readings:
  - ‘당신을 건져내시기를 바랍니다’ 같은 희망형
  - ‘당신을 건져내실지도 모릅니다’ 같은 불확정형
  rationale: 아람어 형식은 본문 흐름상 직접적인 선언으로 읽을 수 있으므로, 한국어도 ‘건져내실 것입니다’로 옮겨 본문의 긴장과 왕의 기대를 유지했습니다.
  doctrine_reference: 원문이 허용하는 의미 범위를 보존하고, 번역에서 불필요하게 약화하거나 확정하지 않기
