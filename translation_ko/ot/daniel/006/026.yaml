source:
  edition: WLC
  text: בֵּ/אדַ֜יִן דָּרְיָ֣וֶשׁ מַלְכָּ֗/א כְּ֠תַב לְֽ/כָל עַֽמְמַיָּ֞/א אֻמַיָּ֧/א וְ/לִשָּׁנַיָּ֛/א דִּֽי דארין בְּ/כָל אַרְעָ֖/א שְׁלָמְ/כ֥וֹן יִשְׂגֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/026.yaml
  text: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
  footnotes:
  - marker: a
    text: Or “May your peace be multiplied.”
    reason: lexical_alternative
  - marker: b
    text: “In all the earth” reflects the Aramaic wording; in context it refers to the full extent of Darius’s imperial domain.
    reason: cultural_note
translation:
  language: ko
  text: 그때 다리오 왕은 온 땅에 사는 모든 백성, 민족, 언어에게 이렇게 적었습니다. “너희에게 평강이 더욱 넘치기를 바랍니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희의 평강이 곱절로 많아지기를 바랍니다.”
    reason: lexical_alternative
  - marker: b
    text: ‘온 땅’은 문자적으로는 אַרְעָא를 반영하며, 문맥상 다리오의 제국적 통치 범위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그리하여
  lexicon: HALOT
  rationale: 서사 전개를 자연스럽게 잇는 아람어 담화 표지로 이해하여, 현대 한국어에서 시간 순서를 드러내는 ‘그때’로 옮겼습니다.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  english_pob_choice: King Darius
  chosen_korean: 다리오 왕
  alternatives_korean:
  - 왕 다리오
  - 다리오 임금
  lexicon: HALOT
  rationale: 한국어에서 자연스러운 왕호 배치를 따르되, 고유명사와 직함을 분리해 유지했습니다.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  english_pob_choice: to all the peoples, nations, and languages
  chosen_korean: 온 땅에 사는 모든 백성, 민족, 언어에게
  alternatives_korean:
  - 모든 백성과 민족과 언어에게
  - 온 세상의 모든 백성, 민족, 언어에게
  lexicon: HALOT
  rationale: 다니엘서의 관용적 삼중 표현을 살리면서, ‘languages’를 단순한 추상어가 아니라 실제로 함께 지칭되는 집단 범주로 보이게 했습니다.
- source_word: בְּכָל אַרְעָא
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에 사는
  alternatives_korean:
  - 온 땅에
  - 온 나라에
  lexicon: HALOT
  rationale: 직역하면 ‘온 땅’이지만, 문맥상 제국 전체의 범위를 가리키는 관용이므로 주소 대상의 거주 범주를 드러내는 표현으로 풀었습니다.
- source_word: כְּתַב
  english_pob_choice: wrote
  chosen_korean: 적었습니다
  alternatives_korean:
  - 기록했습니다
  - 썼습니다
  lexicon: HALOT
  rationale: 왕의 공문 작성 행위를 현대 한국어에서 자연스럽게 전달하되, 단순한 필기보다 공식적 공문 작성의 뉘앙스를 유지했습니다.
- source_word: שְׁלָמְכוֹן יִשְׂגֵּא
  english_pob_choice: May your peace abound
  chosen_korean: 너희에게 평강이 더욱 넘치기를 바랍니다
  alternatives_korean:
  - 너희의 평강이 더 많아지기를 바랍니다
  - 너희 평강이 번성하기를 바랍니다
  lexicon: HALOT
  rationale: 축복/인사의 공문체를 고려해 명령형보다 바람 표현으로 옮겼고, ‘יִשְׂגֵּא’의 증대 의미는 ‘더욱 넘치다’로 살렸습니다.
theological_decisions:
- issue: 다니엘서 왕의 공식 인사말을 어떤 화행으로 옮길지
  chosen_reading: 축복형 인사로 이해하여 “평강이 더욱 넘치기를 바랍니다”로 옮겼습니다.
  alternative_readings:
  - 직역형 “너희의 평강이 많아지기를”
  - 문어체 직함형 “평강이 많을지어다”
  rationale: 히브리/아람어 왕실 서한의 관용적 인사문으로 읽어, 한국어에서도 강압적 선언보다 축복적 공문 인사로 전달하는 편이 문맥과 기능을 더 잘 반영합니다.
  doctrine_reference: 서신/칙령의 화행 보존 원칙
