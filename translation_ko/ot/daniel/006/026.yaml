revisions:
- from: 그때 다리오 왕은 온 땅에 사는 모든 백성, 민족, 언어에게 이렇게 적었습니다. “너희에게 평강이 더욱 넘치기를 바랍니다.”[a][b]
  to: 그때 다리오 왕은 온 땅에 사는 모든 백성과 민족과 언어에게 다음과 같이 썼습니다. “너희의 평안이 크게 더해지기를 바랍니다.”[a][b]
  rationale: 원문의 서사 연결, 왕의 서신 행위, 수신자 삼중 표현, ‘온 땅’의 수사적 범위, 그리고 평안의 증대를 모두 보존했습니다. 문장을 현대 표준 한국어 합쇼체로 다듬고, 각주 a의 대안은 원문의 증가 의미를 과도하게 특정하지 않도록 조정했으며, 각주 b는 아람어 원어와 문맥적 범위를 명확히 했습니다.
