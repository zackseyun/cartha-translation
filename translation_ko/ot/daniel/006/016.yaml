id: DAN.6.16
reference: Daniel 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֨יִן֙ גֻּבְרַיָּ֣/א אִלֵּ֔ךְ הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/אָמְרִ֣ין לְ/מַלְכָּ֗/א דַּ֤ע מַלְכָּ/א֙ דִּֽי דָת֙ לְ/מָדַ֣י וּ/פָרַ֔ס דִּֽי כָל אֱסָ֥ר וּ/קְיָ֛ם דִּֽי מַלְכָּ֥/א יְהָקֵ֖ים לָ֥א לְ/הַשְׁנָיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/016.yaml
  text: Then these men came by agreement to the king and said to the king[a], "Know, O king[b], that it is a law of the Medes and Persians that any injunction or statute that the king establishes cannot be changed."
  footnotes:
  - marker: a
    text: Or 'came by agreement against the king.' The Aramaic verb can suggest coordinated, insistent action, not merely approach.
    reason: lexical_alternative
  - marker: b
    text: Or 'decree' for 'injunction' and 'ordinance' for 'statute.' The pair emphasizes the full range of legally binding royal enactments.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 사람들은 합심하여 왕에게 나아가 왕에게 말했습니다. "왕이여, 메대와 바사의 법은 왕이 세운 어떤 금령이나 조례도 바꿀 수 없다는 것을 아십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "합의하여 왕을 대항하여". 아람어 동사는 단순한 접근보다, 조직적이고 집요한 행동을 암시할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 "금지령"과 "법령". 두 낱말은 왕이 내리는 법적 조치의 범위를 넓게 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그리하여
  - 그런 다음
  lexicon: HALOT
  rationale: 서술 전환 표지로서 시간적 진행을 자연스럽게 살리면서도 문어체 흐름을 유지합니다.
- source_word: גֻּבְרַיָּא אִלֵּךְ + הַרְגִּשׁוּ עַל
  english_pob_choice: these men came by agreement to the king
  chosen_korean: 그 사람들은 합심하여 왕에게 나아가
  alternatives_korean:
  - 이 사람들은 합의하여 왕에게 다가가
  - 그 사람들은 뜻을 모아 왕에게 몰려가
  lexicon: HALOT
  rationale: 합심하여는 단순 접근이 아니라 서로 뜻을 맞춘 집단적 압박을 드러내며, '왕에게 나아가'는 자연스러운 한국어로 행위의 방향을 살립니다.
- source_word: כָל אֱסָר וּקְיָם
  english_pob_choice: any injunction or statute
  chosen_korean: 어떤 금령이나 조례도
  alternatives_korean:
  - 어떤 금지령이나 법령도
  - 어떤 금령이나 법규도
  lexicon: HALOT
  rationale: אֱסָר는 구속력 있는 금지/명령의 뉘앙스가 있어 금령이 적절하고, קְיָם은 확정된 조문·규정의 성격을 드러내기 위해 조례로 옮겼습니다.
- source_word: לָא לְהַשְׁנָיָה
  english_pob_choice: cannot be changed
  chosen_korean: 바꿀 수 없다는 것을
  alternatives_korean:
  - 변경할 수 없다는 것을
  - 고칠 수 없다는 것을
  lexicon: HALOT
  rationale: 법적 불가변성을 현대 한국어의 직접적 표현으로 옮겨, 왕의 제정이 최종적이라는 의미를 분명히 합니다.
theological_decisions:
- issue: 다니엘서 6:16의 법정 진술 톤과 호칭
  chosen_reading: 왕에게 직접 경고하는 공적·법률적 발화이므로, "왕이여"를 유지해 격식 있는 호칭을 살렸습니다.
  alternative_readings:
  - 왕님
  - 임금님
  rationale: 본문의 궁정 법정 맥락에서 제도적 권위를 직접 호명하는 어조가 중요하므로, 현대어이되 과도하게 사적인 호칭은 피했습니다.
  doctrine_reference: 문맥적 화행 보존
