id: DAN.6.27
reference: Daniel 6:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן קֳדָמַ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י בְּ/כָל שָׁלְטָ֣ן מַלְכוּתִ֗/י לֶהֱוֺ֤ן זאעין וְ/דָ֣חֲלִ֔ין מִן קֳדָ֖ם אֱלָהֵ֣/הּ דִּי דָֽנִיֵּ֑אל דִּי ה֣וּא אֱלָהָ֣/א חַיָּ֗/א וְ/קַיָּם֙ לְ/עָ֣לְמִ֔ין וּ/מַלְכוּתֵ/הּ֙ דִּֽי לָ֣א תִתְחַבַּ֔ל וְ/שָׁלְטָנֵ֖/הּ עַד סוֹפָֽ/א־׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/027.yaml
  text: A decree is issued by me[a], that in all the dominion of my kingdom people are to tremble and fear before the God of Daniel, for he is the living God, enduring forever; and his kingdom will not be destroyed[c][b], and his dominion will be to the end.
  footnotes:
  - marker: a
    text: Or 'revere and fear before the God of Daniel.' The Aramaic pair expresses intense awe; the main text keeps the stronger sense 'tremble and fear.'
    reason: lexical_alternative
  - marker: b
    text: Or 'throughout all the realm of my kingdom.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his dominion is unto the end' or 'his rule lasts to the end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 칙령을 내립니다. 내 왕국의 모든 통치 영역에 있는 사람들은 다니엘의 하나님 앞에서 떨며 두려워해야 합니다. 그분은 살아 계시고 영원히 계시는 하나님이시며, 그의 나라는 파괴되지 않을 것이고 그의 통치는 끝까지 계속될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן קֳדָמַי
  english_pob_choice: by me
  chosen_korean: 내게서 명령이 내려졌으니
  alternatives_korean:
  - 내 앞에서
  - 내게서
  lexicon: HALOT
  rationale: 왕의 칙령 공식에서 출처를 단순한 공간적 ‘앞’이 아니라 권위의 발화로 이해해야 하므로, ‘내게서 명령이 내려졌으니’로 옮겨 왕권 발령의 뉘앙스를 살렸습니다.
- source_word: שִׂים טְעֵם
  english_pob_choice: A decree is issued
  chosen_korean: 명령이 내려졌으니
  alternatives_korean:
  - 칙령이 정해졌으니
  - 내가 칙령을 내리니
  lexicon: HALOT
  rationale: 문자적으로는 ‘명령을 놓다/세우다’이지만, 한국어에서는 공식 공포문체인 ‘명령이 내려지다’가 가장 자연스럽고 행정적 형식도 보존합니다.
- source_word: זאעין וְדָחֲלִין
  english_pob_choice: tremble and fear
  chosen_korean: 떨며 두려워해야 합니다
  alternatives_korean:
  - 경외하며 두려워해야 합니다
  - 떨며 무서워해야 합니다
  lexicon: HALOT
  rationale: 두 동사가 함께 강한 경외와 공포를 나타내므로, POB의 강한 어휘 선택을 따라 ‘떨며 두려워하다’로 유지했습니다. ‘경외’는 의미를 약화시킬 수 있습니다.
- source_word: אֱלָהָא חַיָּא וְקַיָּם לְעָלְמִין
  english_pob_choice: the living God, enduring forever
  chosen_korean: 살아 계신 하나님이시며 영원히 존재하시고
  alternatives_korean:
  - 살아 계신 하나님이시며 영원토록 살아 계시고
  - 살아 계신 하나님이시며 영원히 계시고
  lexicon: HALOT
  rationale: ‘살아 계신 하나님’은 정관적 고백을 살리고, ‘영원히 존재하시고’는 קַיָּם לְעָלְמִין의 지속성과 존재성을 간결하게 드러냅니다.
- source_word: וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
  english_pob_choice: his kingdom will not be destroyed
  chosen_korean: 그의 나라는 무너뜨릴 수 없으며
  alternatives_korean:
  - 그의 나라는 파괴되지 않으며
  - 그의 나라는 무너지지 않으며
  lexicon: HALOT
  rationale: 동사의 결과적 의미는 ‘파괴/파멸’이지만, 한국어에서 하나님의 나라의 불가침성과 완전한 붕괴 불가능성을 함께 담기 위해 ‘무너뜨릴 수 없다’로 옮겼습니다.
- source_word: וְשָׁלְטָנֵהּ עַד סוֹפָא
  english_pob_choice: his dominion will be to the end
  chosen_korean: 그의 통치는 끝까지 이릅니다
  alternatives_korean:
  - 그의 통치는 끝에 이를 것입니다
  - 그의 다스림은 끝까지 지속됩니다
  lexicon: HALOT
  rationale: שָׁלְטָן은 ‘통치/다스림’이 가장 자연스럽고, ‘끝까지 이릅니다’는 종결점과 지속성을 함께 살리면서 문장 흐름을 매끄럽게 합니다.
theological_decisions:
- issue: 왕의 칙령이 다니엘의 하나님에 대한 반응을 강하게 요구하는 표현
  chosen_reading: 사람들이 떨며 두려워해야 합니다
  alternative_readings:
  - 사람들이 경외하며 두려워해야 합니다
  - 사람들이 두려워하고 떨게 해야 합니다
  rationale: 본문의 이중 표현은 단순한 존중보다 강한 공포와 경외를 뜻하므로, 이를 완화하지 않고 현대 한국어로 직접 드러냈습니다.
  doctrine_reference: 원문 어휘의 강도를 보존하고, 후대 신학적 완화 표현을 본문에 덧씌우지 않음.
- issue: 하나님의 나라와 통치의 영속성
  chosen_reading: 무너뜨릴 수 없으며 그의 통치는 끝까지 이릅니다
  alternative_readings:
  - 무너지지 않으며 그의 통치는 끝까지 지속됩니다
  - 파괴되지 않으며 그의 다스림은 영원합니다
  rationale: 본문이 말하는 것은 완전한 붕괴 불가능성과 끝까지 이르는 통치이지, 추상적 교리 문구를 덧붙이는 것이 아니므로 그 범위 안에서만 옮겼습니다.
  doctrine_reference: 본문이 말하는 영속성과 불가파괴성을 과장하지 않고 직접 진술로 보존.
