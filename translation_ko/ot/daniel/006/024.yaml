  lexicon: HALOT
  rationale: 강조된 감정 반응을 한국어에서 유려하게 살리기 위해 ‘매우 기뻐하며’로 옮겼습니다.
- source_word: עֲלֹוהִי
  english_pob_choice: because of him
  chosen_korean: 다니엘 때문에
  alternatives_korean:
  - 그를 인해
  - 그에 대하여
  lexicon: HALOT
  rationale: 왕의 기쁨의 원인을 다니엘에게 돌리는 뜻이므로, 원인 관계를 분명히 드러내는 ‘다니엘 때문에’가 적절합니다.
- source_word: לְהַנְסָקָה / וְהֻסַּק
  english_pob_choice: be brought up / was brought up
  chosen_korean: 끌어올리라고 / 끌어올려졌는데
  alternatives_korean:
  - 올려오라고 / 올려졌는데
  - 꺼내오라고 / 꺼내졌는데
  lexicon: HALOT
  rationale: 구덩이에서 밖으로 이동시키는 동작을 가장 직접적으로 나타내는 한국어가 ‘끌어올리다’이므로, 명령과 수동 모두 같은 어근으로 맞췄습니다.
- source_word: מִן גֻּבָּא
  english_pob_choice: from the pit
  chosen_korean: 구덩이에서
  alternatives_korean:
