  text: בֵּ/אדַ֣יִן מַלְכָּ֗/א שַׂגִּיא֙ טְאֵ֣ב עֲל֔וֹ/הִי וּ/לְ/דָ֣נִיֵּ֔אל אֲמַ֖ר לְ/הַנְסָקָ֣ה מִן גֻּבָּ֑/א וְ/הֻסַּ֨ק דָּנִיֵּ֜אל מִן גֻּבָּ֗/א וְ/כָל חֲבָל֙ לָא הִשְׁתְּכַ֣ח בֵּ֔/הּ דִּ֖י הֵימִ֥ן בֵּ/אלָהֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/024.yaml
  text: Then the king was very glad because of him[a], and he ordered that Daniel be brought up from the pit. So Daniel was brought up from the pit, and no kind of harm was found on him[b], because he had trusted in his God.
  footnotes:
  - marker: a
    text: Or 'from the den.' The Aramaic noun denotes a pit-like enclosure; in this context it is the lions' den.
    reason: lexical_alternative
  - marker: b
    text: Or 'because he had believed his God.' The verb can mean 'trust' or 'believe'; 'trusted' was chosen here to emphasize personal reliance in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 다니엘 때문에 매우 기뻐하며 다니엘을 구덩이에서 끌어올리라고 명령했습니다. 그래서 다니엘이 구덩이에서 끌어올려졌는데, 그에게서는 어떤 해도 발견되지 않았습니다. 이는 그가 자기 하나님을 신뢰했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구덩이’는 아람어 명사의 기본 뜻을 따른 번역이며, 이 문맥에서는 사자 굴을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신뢰하다’는 동사의 가능한 의미인 ‘믿다’와 나란히 설 수 있으며, 이 문맥에서는 인격적 의탁을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 이에
  lexicon: HALOT
  rationale: 아람어 담화 표지로서 사건의 순차 전개를 여는 표현이므로, 현대 한국어에서 자연스러운 시간 연결어인 ‘그때’로 옮겼습니다.
- source_word: שַׂגִּיא טְאֵב
  english_pob_choice: was very glad
  chosen_korean: 매우 기뻐하며
  alternatives_korean:
  - 크게 기뻐하며
  - 몹시 기뻐하며
  lexicon: HALOT
  rationale: 강조된 감정 반응을 한국어에서 유려하게 살리기 위해 ‘매우 기뻐하며’로 옮겼습니다.
- source_word: עֲלֹוהִי
  english_pob_choice: because of him
  chosen_korean: 다니엘 때문에
  alternatives_korean:
  - 그를 인해
  - 그에 대하여
  lexicon: HALOT
  rationale: 왕의 기쁨의 원인을 다니엘에게 돌리는 뜻이므로, 원인 관계를 분명히 드러내는 ‘다니엘 때문에’가 적절합니다.
- source_word: לְהַנְסָקָה / וְהֻסַּק
  english_pob_choice: be brought up / was brought up
  chosen_korean: 끌어올리라고 / 끌어올려졌는데
  alternatives_korean:
  - 올려오라고 / 올려졌는데
  - 꺼내오라고 / 꺼내졌는데
  lexicon: HALOT
  rationale: 구덩이에서 밖으로 이동시키는 동작을 가장 직접적으로 나타내는 한국어가 ‘끌어올리다’이므로, 명령과 수동 모두 같은 어근으로 맞췄습니다.
- source_word: מִן גֻּבָּא
  english_pob_choice: from the pit
  chosen_korean: 구덩이에서
  alternatives_korean:
  - 구덩이로부터
  - 웅덩이에서
  lexicon: HALOT
  rationale: אַר라מית גֻבָּא의 기본 의미를 반영하면서도, 본문 맥락에서 사자의 굴을 가리키는 넓은 의미를 살리기 위해 ‘구덩이’로 번역했습니다.
- source_word: וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ
  english_pob_choice: no kind of harm was found on him
  chosen_korean: 어떤 해도 발견되지 않았습니다
  alternatives_korean:
  - 아무 상처도 발견되지 않았습니다
  - 조금도 해를 입지 않았습니다
  lexicon: HALOT
  rationale: ‘모든 해’의 포괄성을 담으면서도 한국어에서 자연스러운 수동 진술로 ‘어떤 해도 발견되지 않았습니다’라고 옮겼습니다.
- source_word: הֵימִן בֵּאלָהֵהּ
  english_pob_choice: he had trusted in his God
  chosen_korean: 그가 자기 하나님을 신뢰했기 때문입니다
  alternatives_korean:
  - 그가 자기 하나님을 믿었기 때문입니다
  - 그가 자기 하나님께 의지했기 때문입니다
  lexicon: HALOT
  rationale: 해당 동사는 ‘믿다/신뢰하다’의 뜻을 가지며, 여기서는 다니엘의 개인적 의탁을 강조하기 위해 ‘신뢰하다’를 택했습니다.
theological_decisions:
- issue: 다니엘의 보존의 근거
  chosen_reading: 그가 자기 하나님을 신뢰했기 때문입니다
  alternative_readings:
  - 그가 자기 하나님을 믿었기 때문입니다
  rationale: 본문은 다니엘의 보존을 그의 하나님에 대한 신뢰와 직접 연결합니다. 번역도 그 인과 관계를 분명히 유지하되, 그 이상으로 공로론을 덧붙이지 않았습니다.
  doctrine_reference: 본문이 제시하는 인과를 보존하고, 신학적 확대 해석은 자제합니다.
