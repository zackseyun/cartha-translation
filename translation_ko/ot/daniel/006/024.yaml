  rationale: 본문은 다니엘의 보존을 그의 하나님에 대한 신뢰와 직접 연결합니다. 번역도 그 인과 관계를 분명히 유지하되, 그 이상으로 공로론을 덧붙이지 않았습니다.
  doctrine_reference: 본문이 제시하는 인과를 보존하고, 신학적 확대 해석은 자제합니다.
