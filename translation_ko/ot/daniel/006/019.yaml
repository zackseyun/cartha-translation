base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/019.yaml
  text: Then the king went to his palace and spent the night fasting; no entertainment was brought before him[a], and sleep fled from him.
  footnotes:
  - marker: a
    text: Or 'no musicians were brought before him.' The Aramaic term is uncertain and may refer more specifically to entertainers or diversions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 자기 궁전으로 가서 금식하며 밤을 지냈습니다. 그 앞에는 어떤 흥을 돋우는 것[a]도 들이지 않았고, 잠도 그를 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음악가들이 그 앞에 들여지지 않았다.’ 아람어 용어는 확실하지 않으며, 더 구체적으로는 연예인이나 오락거리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא / לְהֵיכְלֵהּ
  english_pob_choice: the king ... to his palace
  chosen_korean: 왕은 자기 궁전으로
  alternatives_korean:
  - 왕은 자기 성으로
  - 왕은 자기 궁으로
  lexicon: HALOT
  rationale: הֵיכַל은 문맥에 따라 궁전/성전이 될 수 있으나, 이 장면은 바사 왕이 밤에 돌아가는 왕궁을 가리키므로 ‘궁전’이 가장 자연스럽습니다.
- source_word: וּבָת טְוָת
  english_pob_choice: spent the night fasting
  chosen_korean: 금식하며 밤을 지냈습니다
  alternatives_korean:
  - 금식하며 밤을 보냈습니다
  - 밤새 금식했습니다
  lexicon: HALOT
  rationale: 동작의 지속과 상태를 함께 살려, 관용적인 한국어로 ‘밤을 지냈습니다’라고 옮겼습니다.
- source_word: וְדַחֲוָן
  english_pob_choice: no entertainment was brought before him
  chosen_korean: 어떤 흥을 돋우는 것
  alternatives_korean:
  - 어떤 오락도
  - 어떤 즐길 거리도
  - 음악도
  lexicon: HALOT
  rationale: 어휘가 불확실하므로 한 가지로 좁히지 않고, POB의 폭넓은 처리에 맞춰 ‘흥을 돋우는 것’으로 두어 공연·오락·흥겨운 유흥의 가능성을 열어 두었습니다.
- source_word: נַדַּת עֲלֽוֹהִי
  english_pob_choice: sleep fled from him
  chosen_korean: 잠도 그를 떠났습니다
  alternatives_korean:
  - 잠도 그에게서 달아났습니다
  - 잠이 그를 떠났습니다
  lexicon: HALOT
  rationale: 의인화된 표현을 살리면서 한국어에서도 자연스럽게 들리도록 ‘잠도 그를 떠났습니다’로 옮겼습니다.
theological_decisions:
- issue: 금식과 잠의 상실을 서술하는 서사 톤
  chosen_reading: 왕의 불안과 금식이 직접 서술되는 사실 진술로 유지했습니다.
  alternative_readings:
  - 경건한 슬픔을 암시하는 쪽으로 완화
  - 감정 표현을 덧붙여 해석적으로 확장
  rationale: 원문은 다니엘을 향한 왕의 반응을 설명하는 서술일 뿐이므로, 해석을 덧붙이지 않고 문면의 긴장만 드러내는 것이 적절합니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: וְדַחֲוָן의 번역 폭
  chosen_reading: ‘흥을 돋우는 것’처럼 포괄어로 처리했습니다.
  alternative_readings:
  - ‘오락’으로 단정
  - ‘음악’으로 특정
  rationale: 히브리-아람어 어휘가 불확실하다는 POB 주석을 반영해, 단정적 특정화를 피하고 본문의 애매성을 보존했습니다.
  doctrine_reference: 사본·어휘 불확실성 보존 원칙
