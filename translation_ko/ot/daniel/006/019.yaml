  source_fidelity: 첫 문장은 왕이 궁전으로 가서 금식하며 밤을 보냈다는 아람어의 서술을 충실히 반영합니다. וְדַחֲוָן의 의미가 불확실한 점은 본문에서 포괄적으로 번역하고 각주에서 대안을 제시하는 방식이 적절합니다. 마지막 절의 잠의 의인화도 유지되어야 합니다.
  naturalness: ‘흥을 돋우는 것’과 ‘그 앞에는 … 들이지 않았고’의 결합은 현대 표준 한국어에서 다소 부자연스럽고 구어적인 인상이 있습니다. ‘아무 오락도 그 앞에 들여오지 않았고’가 문맥상 자연스럽고, 불확실한 어휘를 과도하게 특정하지도 않습니다. ‘잠도 그에게서 달아났습니다’는 의인화를 유지하면서 더 매끄럽습니다.
  terminology: ‘궁전’, ‘금식’, ‘오락’은 현대적이고 격식 있는 서사체에 적합합니다. ‘오락’은 음악가·연예인·유흥거리 등으로 제시되는 וְדַחֲוָן의 여러 해석 중 하나를 단정하지 않는 포괄적 표현이며, 각주가 그 한계를 보완합니다.
  issues:
