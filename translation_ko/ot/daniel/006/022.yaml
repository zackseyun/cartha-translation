translation:
  language: ko
  text: 그때 다니엘이 왕에게 말했습니다. 「왕이여, 영원히 사십시오!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어는 직역하면 ‘왕이 오래 사시기를’에 가까운 관용 축복 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַ֨יִן֙
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그러자
  - 그런 다음
  lexicon: HALOT
  rationale: 서사 진행을 표시하는 아람어 담화 표지를 현대 한국어에서 자연스럽게 옮겼습니다.
- source_word: עִם מַלְכָּ֖א מַלִּ֑ל
  english_pob_choice: spoke with the king
  chosen_korean: 왕에게 말했습니다
  alternatives_korean:
  - 왕과 말했습니다
  - 왕과 함께 말했습니다
  lexicon: HALOT
  rationale: ‘with’의 직접적 대응보다, 발화 상대를 나타내는 한국어 관용을 살려 자연스럽게 전달했습니다.
- source_word: מַלְכָּ֖א
  english_pob_choice: O king
  chosen_korean: 왕이여
  alternatives_korean:
  - 임금님
  - 오 왕이여
  lexicon: HALOT
  rationale: 두 번째 מַלְכָּא는 직접 호칭이므로, 한국어 호격 표지 ‘-이여’를 사용해 존대와 호소의 뉘앙스를 살렸습니다.
- source_word: לְ/עָלְמִ֥ין חֱיִֽי־
  english_pob_choice: Live forever!
  chosen_korean: 영원히 사십시오
  alternatives_korean:
  - 영원히 사소서
  - 영원히 사시기를 바랍니다
  lexicon: HALOT
  rationale: 아람어의 상투적 왕실 축복 공식을 직접 명령형보다 공손한 축원형으로 옮겼습니다.
theological_decisions:
- issue: 왕에게 향한 축원문의 공손도
  chosen_reading: 직접 명령처럼 보이지만 실제 기능은 왕실 축복 인사이므로, 공손한 축원형으로 번역했습니다.
  alternative_readings:
  - 명령형에 가깝게 ‘영원히 사십시오!’
  - 전통 교회어로 ‘만세를 누리소서!’
  rationale: 본문은 왕에게 하는 관용적 축복 인사로 이해하는 것이 문맥과 아람어 관용구에 가장 충실합니다.
  doctrine_reference: 문맥상 왕실 인사 관용구
- issue: 다니엘의 발화체
  chosen_reading: 서술문은 합쇼체로, 직접 발화는 왕을 향한 공손한 호칭을 유지했습니다.
  alternative_readings:
  - 전체를 평서체로 통일
  - 직접 화법도 비격식으로 처리
  rationale: 한국어 독자가 발화의 공적·궁정적 성격을 분명히 인지하도록 했습니다.
  doctrine_reference: 문체/화행 일치
