base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/012.yaml
  text: Then these men came by agreement and found Daniel petitioning and pleading before his God[a][b].
  footnotes:
  - marker: a
    text: Or, 'came together' or 'came tumultuously.' The Aramaic verb likely carries the sense that these men assembled in concert, with a coordinated purpose.
    reason: lexical_alternative
  - marker: b
    text: Or, 'praying and making supplication before his God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이 사람들은 합심하여 와서 다니엘이 그의 하나님 앞에서 간구하고 탄원하는 것을 찾아냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 왔다’, 혹은 ‘소란스럽게 왔다’. 아람어 동사는 이 사람들이 협력하여, 짜고 모여든 뜻을 지닐 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그의 하나님 앞에서 기도하고 간구하는’.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그리하여
  lexicon: HALOT
  rationale: 서사의 진행을 자연스럽게 잇는 시간 표지로, 앞뒤 사건의 연속성을 살리는 현대 한국어 표현입니다.
- source_word: גֻּבְרַיָּא אִלֵּךְ הַרְגִּשׁוּ
  english_pob_choice: these men came by agreement
  chosen_korean: 이 사람들은 합심하여 와서
  alternatives_korean:
  - 이 사람들은 함께 와서
  - 이 사람들은 공모하여 와서
  lexicon: HALOT
  rationale: הַרְגִּשׁוּ의 ‘함께, 의도적으로 움직이다’는 뉘앙스를 살리되, 악의적 결속을 너무 직접적으로 단정하지 않도록 ‘합심하여’로 옮겼습니다.
- source_word: בָּעֵא וּמִתְחַנַּן
  english_pob_choice: petitioning and pleading before his God
  chosen_korean: 간구하고 탄원하는
  alternatives_korean:
  - 빌고 간청하는
  - 간청하고 매달리는
  lexicon: HALOT
  rationale: 두 분사로 된 기도의 행위를 한국어 동사 병렬로 살렸고, ‘탄원’은 מִתְחַנַּן의 간절한 호소를 비교적 정확하게 드러냅니다.
- source_word: קֳדָם אֱלָהֵהּ
  english_pob_choice: before his God
  chosen_korean: 그의 하나님 앞에서
  alternatives_korean:
  - 그의 하나님 앞에
  - 그의 하나님 면전에서
  lexicon: HALOT
  rationale: קֳדָם의 공간적·관계적 의미를 ‘앞에서’로 자연스럽게 옮겨, 기도의 대면성을 분명히 했습니다.
theological_decisions:
- issue: 기도 행위를 표현하는 용어 선택
  chosen_reading: 간구하고 탄원하는
  alternative_readings:
  - 기도하고 간구하는
  - 기도하며 애원하는
  rationale: 본문은 단순한 ‘기도’보다 요청과 호소의 행위를 강조하므로, 두 분사의 중복을 살려 기도의 긴박함과 절박함을 드러내는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 적대자들의 집결 방식
  chosen_reading: 합심하여
  alternative_readings:
  - 함께
  - 무리 지어
  rationale: POB의 ‘came by agreement’가 지닌 공동의 목적성을 살리되, 본문이 명시하지 않은 폭력성이나 혼란을 과하게 주지 않도록 절제했습니다.
  doctrine_reference: Translation philosophy §§1, 6
