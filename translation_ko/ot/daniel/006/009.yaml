id: DAN.6.9
reference: Daniel 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּעַ֣ן מַלְכָּ֔/א תְּקִ֥ים אֱסָרָ֖/א וְ/תִרְשֻׁ֣ם כְּתָבָ֑/א דִּ֣י לָ֧א לְ/הַשְׁנָיָ֛ה כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/009.yaml
  text: Now[a], O king, establish the injunction and sign the document so that it cannot be changed, according to the law of the Medes and Persians[b], which cannot be revoked.
  footnotes:
  - marker: a
    text: Or 'which may not be altered.' The Aramaic emphasizes that the written edict is not to be changed.
    reason: lexical_alternative
  - marker: b
    text: Or 'which cannot be repealed.' Literally, 'which does not pass away,' an idiom for legal irrevocability.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 왕이시여, 금령을 세우시고 문서에 서명하셔서 바꿀 수 없게 하소서. 이는 메대 사람들과 바사 사람들의 법에 따른 것이니, 그것은 폐지될 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바꿀 수 없게’로 옮길 수 있습니다. 아람어는 기록된 조서가 변경되지 않아야 한다는 점을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘폐지될 수 없습니다.’ 직역하면 ‘사라지지 않는다’는 뜻으로, 법적 불가역성을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그러므로
  lexicon: HALOT
  rationale: 화자의 긴급한 요청을 드러내는 담화 표지로서, 한국어에서는 자연스럽고 간결한 ‘이제’가 가장 잘 맞습니다.
- source_word: אֱסָרָא
  english_pob_choice: the injunction
  chosen_korean: 금령
  alternatives_korean:
  - 명령
  - 법령
  - 금지령
  lexicon: HALOT
  rationale: 문맥상 단순한 명령이 아니라 금지 성격의 법적 조치를 가리키므로, ‘금령’이 그 제약성과 공적 효력을 잘 드러냅니다.
- source_word: וְתִרְשֻׁם כְּתָבָא
  english_pob_choice: and sign the document
  chosen_korean: 문서에 서명하시고
  alternatives_korean:
  - 문서를 기록하시고
  - 문서에 날인하시고
  lexicon: HALOT
  rationale: 왕의 공식 승인 행위를 현대 한국어 법률 표현에 가깝게 옮기기 위해 ‘서명하다’를 택했습니다. ‘날인하다’도 가능하지만 본문은 일반적 공적 승인 행위에 초점이 있습니다.
- source_word: דִּי לָא תֶעְדֵּא
  english_pob_choice: which cannot be revoked
  chosen_korean: 바꿀 수 없게
  alternatives_korean:
  - 철회할 수 없게
  - 폐지할 수 없게
  lexicon: HALOT
  rationale: 아람어 관용구는 문서가 다시 변경되지 않는다는 뜻을 강하게 내포하므로, POB 주석의 취지에 따라 ‘변경 불가’의 핵심을 살린 표현을 본문에 두고 뒤에서 법적 불가역성을 보완했습니다.
theological_decisions:
- issue: 페르시아 법의 불가역성을 어떻게 옮길지
  chosen_reading: 본문은 ‘법에 따른 것’과 ‘폐지될 수 없습니다’를 분리해, 왕의 금령이 당시 제국 법체계 안에서 최종 확정된다는 점을 드러냈습니다.
  alternative_readings:
  - ‘돌이킬 수 없습니다’
  - ‘철회될 수 없습니다’
  rationale: 단순한 물리적 변경 불가가 아니라 공적 법적 구속력을 강조하는 절입니다. 한국어에서 ‘폐지’는 제도적 무효화의 뉘앙스를 잘 전달합니다.
  doctrine_reference: '성경의 서술문 해석 원칙: 역사·법률 문맥에서 원문의 법적 효력을 과도하게 약화시키지 않음'
