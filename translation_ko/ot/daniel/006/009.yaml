  source_fidelity: 수정이 필요합니다. 원문의 두 법적 수식어는 각각 문서의 변경 불가와 메대·바사 법의 폐지 불가를 가리킵니다. 현 초안은 이 구분을 대체로 반영하지만, ‘이는 … 따른 것이니, 그것은 …’의 지시 관계가 불명확합니다. 수정문은 두 수식어의 선행사를 분명히 합니다.
  naturalness: 현행 문장은 ‘이는 … 것이니, 그것은 …’이 부자연스럽고 무엇이 폐지될 수 없는지 잠시 모호합니다. ‘폐지될 수 없는 메대와 바사의 법에 따라’로 옮기면 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: ‘금령’은 문맥의 금지 명령을 적절히 나타냅니다. ‘메대와 바사’는 성경 번역의 통상적인 지명·민족 표기이며, ‘폐지될 수 없는’은 법적 불가역성을 정확히 전달합니다. 현행 각주 a는 본문 표현과 사실상 동일하여 대안 기능을 하지 못하므로 교정해야 합니다.
