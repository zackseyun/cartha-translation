source:
  edition: WLC
  text: בֵּ֠/אדַיִן קְרִ֨יבוּ וְ/אָמְרִ֥ין קֳדָם מַלְכָּ/א֮ עַל אֱסָ֣ר מַלְכָּ/א֒ הֲ/לָ֧א אֱסָ֣ר רְשַׁ֗מְתָּ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִבְעֵה֩ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/ג֖וֹב אַרְיָותָ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר יַצִּיבָ֧א מִלְּתָ֛/א כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/013.yaml
  text: 'Then they came near and spoke before the king concerning the king’s injunction: “Did you not sign an injunction that any man who makes a petition to any god or man for thirty days[a], except to you, O king, shall be thrown into the lions’ den?” The king answered and said, “The matter is certain, according to the law of the Medes and Persians[c][b], which cannot be changed.”'
  footnotes:
  - marker: a
    text: Or “decree” or “interdict” for “injunction”; the Aramaic term refers specifically to a binding prohibition.
    reason: lexical_alternative
  - marker: b
    text: “Any man” renders a grammatically masculine singular term used generically in this legal statement; alternatively, “any person.”
    reason: lexical_alternative
  - marker: c
    text: Or “which cannot be revoked” or “which cannot be altered.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 왕에게 가까이 가서 왕의 금지령에 관하여 말했습니다. “왕이시여, 삼십 일 동안[a] 왕께 드리는 것 외에 어떤 신이나 사람에게 청원하는 자는 사자 굴에 던져진다는 금지령에 서명하지 않으셨습니까?” 왕이 대답하여 말했습니다. “그 일은 확실합니다. 이는 변경될 수 없는[c] 메대와 바사의 법[b]에 따른 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삼십 일 동안’은 아람어의 기간 표현을 자연스럽게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘메대와 바사의 법’은 이 구절에서 변경할 수 없는 것으로 제시되는 법을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘취소될 수 없는’, ‘철회될 수 없는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그런 다음
  lexicon: HALOT
  rationale: 서사 진행 표지로서 다음 사건을 자연스럽게 연결하면서, 문맥상의 긴박한 전개를 살렸습니다.
- source_word: עַל אֱסָר מַלְכָּא
  english_pob_choice: concerning the king’s injunction
  chosen_korean: 왕의 금지령에 관하여
  alternatives_korean:
  - 왕의 금령에 관하여
  - 왕의 칙령에 관하여
  lexicon: HALOT
  rationale: 아람어 אֱסָר는 여기서 단순한 칙령보다 ‘금지’의 효력을 가진 구속적 명령을 가리키므로, ‘금지령’이 가장 직접적입니다.
- source_word: כָל אֱנָשׁ
  english_pob_choice: any man
  chosen_korean: 어떤 사람이든지
  alternatives_korean:
  - 어떤 남자든지
  - 누구든지
  lexicon: HALOT
  rationale: 문법상 남성 단수이지만 법률 문맥에서 일반적 인물을 가리키므로, 한국어에서는 성별을 드러내지 않는 자연스러운 일반 표현으로 옮겼습니다.
- source_word: יִבְעֵה מִן כָּל אֱלָהּ וֶאֱנָשׁ
  english_pob_choice: makes a petition to any god or man
  chosen_korean: 어떤 신이나 사람에게든지 청원하면
  alternatives_korean:
  - 어떤 신이나 사람에게든지 구하면
  - 어떤 신이나 사람에게든지 요청하면
  lexicon: HALOT
  rationale: יִבְעֵה는 단순한 ‘묻다’가 아니라 공식적인 청원/간청을 뜻하므로, 법정·궁정 문맥에 맞는 ‘청원하다’를 택했습니다.
- source_word: לָהֵן מִנָּךְ
  english_pob_choice: except to you
  chosen_korean: 왕께만이 아니라
  alternatives_korean:
  - 왕께만
  - 왕 외에는
  lexicon: HALOT
  rationale: 면제 대상이 ‘오직 왕’임을 드러내기 위해, 예외를 분명히 하는 한국어로 옮겼습니다.
- source_word: עַד יוֹמִין תְּלָתִין
  english_pob_choice: for thirty days
  chosen_korean: 삼십 일 동안
  alternatives_korean:
  - 삼십 일간
  - 삼십 일 동안에
  lexicon: HALOT
  rationale: 기간을 나타내는 표현으로 가장 자연스럽고 분명합니다.
- source_word: יַצִּיבָא מִלְּתָא
  english_pob_choice: The matter is certain
  chosen_korean: 그 일은 확실합니다
  alternatives_korean:
  - 그 말은 확실합니다
  - 그 사실은 확실합니다
  lexicon: HALOT
  rationale: 왕의 승인 응답으로서 ‘그 일’이 가장 문맥에 맞고, 원문의 확정성을 자연스럽게 반영합니다.
- source_word: דִּי לָא תֶעְדֵּא
  english_pob_choice: which cannot be changed
  chosen_korean: 변경될 수 없는
  alternatives_korean:
  - 바뀔 수 없는
  - 폐기될 수 없는
  lexicon: HALOT
  rationale: 법적 불가역성을 나타내므로, 한국어 법률 문맥에 맞는 ‘변경될 수 없는’이 가장 적절합니다.
theological_decisions:
- issue: 왕의 금지령의 성격
  chosen_reading: 금지령
  alternative_readings:
  - 명령
  - 칙령
  - 법령
  rationale: 아람어 אֱסָר의 핵심은 단순한 행정 명령이 아니라 금지의 구속력입니다. 따라서 전통적 교회 용어보다 ‘금지령’이 원문의 제재 성격을 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 메대와 바사의 법의 불가역성
  chosen_reading: 변경될 수 없는 메대와 바사의 법
  alternative_readings:
  - 철회될 수 없는
  - 취소될 수 없는
  - 바꿀 수 없는
  rationale: 원문은 왕권도 쉽게 뒤집지 못하는 제국 법의 불가역성을 강조합니다. 한국어로는 ‘변경될 수 없는’이 의미 범위를 넓고 정확하게 전달합니다.
  doctrine_reference: Translation philosophy §1
