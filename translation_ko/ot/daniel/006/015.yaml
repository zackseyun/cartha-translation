  english_pob_choice: until the going down of the sun he kept striving to rescue him
  chosen_korean: 해가 지기까지 그를 구해 내려고 애썼습니다
  alternatives_korean:
  - 해가 질 때까지 그를 구해 내려고 계속 힘썼습니다
