base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/015.yaml
  text: Then the king[a], when he heard the statement, was greatly distressed, and he set his mind on delivering Daniel; and until the going down of the sun he kept striving to rescue him.
  footnotes:
  - marker: a
    text: Or 'was very displeased with himself'; the Aramaic idiom is literally 'was very distressed/displeased upon himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 그 말을 듣고 매우 괴로워했고[a], 다니엘을 구해 내기로 마음먹었습니다. 그리고 해가 지기까지 그를 구하려고 계속 애썼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 자신에게 매우 불쾌해했습니다’; 아람어 관용구는 문자적으로 ‘자기 자신에 대하여 매우 괴로워하거나 불쾌해했다’는 뜻입니다.
    reason: lexical_alternative
