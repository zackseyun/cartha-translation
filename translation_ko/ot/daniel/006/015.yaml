reference: Daniel 6:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱדַ֨יִן מַלְכָּ֜/א כְּ/דִ֧י מִלְּתָ֣/א שְׁמַ֗ע שַׂגִּיא֙ בְּאֵ֣שׁ עֲל֔וֹ/הִי וְ/עַ֧ל דָּנִיֵּ֛אל שָׂ֥ם בָּ֖ל לְ/שֵׁיזָבוּתֵ֑/הּ וְ/עַד֙ מֶֽעָלֵ֣י שִׁמְשָׁ֔/א הֲוָ֥א מִשְׁתַּדַּ֖ר לְ/הַצָּלוּתֵֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/015.yaml
  text: Then the king[a], when he heard the statement, was greatly distressed, and he set his mind on delivering Daniel; and until the going down of the sun he kept striving to rescue him.
  footnotes:
  - marker: a
    text: Or 'was very displeased with himself'; the Aramaic idiom is literally 'was very distressed/displeased upon himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 그 말을 듣고 매우 괴로워하며, 다니엘을 구원할 생각을 품었습니다. 그리고 해가 지기까지 그를 구해 내려고 애썼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 자신에게 매우 불쾌해하였다’; 아람어 관용구는 문자적으로 ‘자기에게 대하여 매우 괴로워/불쾌해하였다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런데
  - 그 후
  lexicon: HALOT
  rationale: 담화 전환 표지로서 시간적 순서를 자연스럽게 이어 주는 현대 한국어로 옮겼습니다.
- source_word: שַׂגִּיא בְּאֵשׁ עֲלֹוהִי
  english_pob_choice: was greatly distressed
  chosen_korean: 매우 괴로워하며
  alternatives_korean:
  - 크게 번민하며
  - 몹시 불쾌해하며
  lexicon: HALOT
  rationale: 직역하면 ‘자기에게 대하여 매우 괴로워/불쾌해하였다’는 관용구이므로, 왕의 강한 내적 동요를 드러내는 ‘괴로워하다’로 옮기되 정도를 살렸습니다.
- source_word: שָׂם בָּל לְשֵׁיזָבוּתֵהּ
  english_pob_choice: he set his mind on delivering him
  chosen_korean: 다니엘을 구원할 생각을 품었습니다
  alternatives_korean:
  - 다니엘을 구해 내기로 마음먹었습니다
  - 다니엘을 건져 내려고 뜻을 두었습니다
  lexicon: HALOT
  rationale: ‘마음/생각을 두다’의 관용을 살리면서, 문맥상 법적 위험에서 건져 내는 의미를 ‘구원하다’로 반영했습니다.
- source_word: וְעַד מֶעָלֵי שִׁמְשָׁא ... לְהַצָּלוּתֵהּ
  english_pob_choice: until the going down of the sun he kept striving to rescue him
  chosen_korean: 해가 지기까지 그를 구해 내려고 애썼습니다
  alternatives_korean:
  - 해가 질 때까지 그를 구해 내려고 계속 힘썼습니다
  - 일몰 때까지 그를 구하려고 부단히 노력했습니다
  lexicon: HALOT
  rationale: ‘해가 지기까지’는 아람어 관용구의 자연스러운 한국어화이며, 지속적 노력은 ‘애썼습니다’로 간결하게 반영했습니다.
theological_decisions:
- issue: 왕의 반응을 ‘자기 자신에게 불쾌해함’으로 볼 수 있는 아람어 관용구 처리
  chosen_reading: 본문에는 왕이 ‘매우 괴로워했다’고 본문 의미를 드러내고, 반사적 뉘앙스는 본문 밖에 두지 않았습니다.
  alternative_readings:
  - ‘자기 자신에게 매우 불쾌해했다’
  - ‘자기 때문에 몹시 언짢아했다’
  rationale: 아람어 관용구는 내적 동요를 분명히 뜻하지만, 여기서는 본문 흐름상 왕의 절박한 당혹과 구출 의지를 전달하는 것이 우선이므로 과도한 자기비난 표현은 채택하지 않았습니다.
  doctrine_reference: '서사 본문 해석: 관용적 심리 묘사의 자연스러운 현대어 재현'
