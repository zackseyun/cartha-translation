  text: מְשֵׁיזִ֣ב וּ/מַצִּ֗ל וְ/עָבֵד֙ אָתִ֣ין וְ/תִמְהִ֔ין בִּ/שְׁמַיָּ֖/א וּ/בְ/אַרְעָ֑/א דִּ֚י שֵׁיזִ֣יב לְ/דָֽנִיֵּ֔אל מִן יַ֖ד אַרְיָוָתָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/028.yaml
  text: who rescues and delivers, and works signs and wonders in heaven and on earth—he who rescued Daniel from the power of the lions.
translation:
  language: ko
  text: 그는 구원하시고 건져 내시며, 하늘과 땅에서 표징과 이적을 행하시는 분이십니다—곧 사자들의 손에서 다니엘을 구원하신 분이십니다.
  philosophy: formal
lexical_decisions:
- source_word: מְשֵׁיזִב וּמַצִּל
  english_pob_choice: rescues and delivers
  chosen_korean: 구원하시고 건져 내시며
  alternatives_korean:
  - 구출하시고 풀어 주시며
  - 건져 주시고 구해 내시며
  lexicon: שׁזב / נצל
  rationale: 두 동사의 병렬을 살려 ‘구원하다’와 ‘건져 내다’로 나누었습니다. 전자는 구출의 넓은 의미를, 후자는 위험한 권세에서의 실제 탈출을 드러냅니다.
- source_word: וְעָבֵד אָתִין וְתִמְהִין
  english_pob_choice: works signs and wonders
  chosen_korean: 표징과 이적을 행하시는
  alternatives_korean:
  - 징조와 기사를 행하시는
  - 표적과 기사를 행하시는
  lexicon: אתין / תמין
  rationale: 다니엘서의 예언적·표현상 어휘를 따라 ‘표징’과 ‘이적’을 택해, 단순한 기적 이상의 하나님의 권위 있는 표시라는 뉘앙스를 살렸습니다.
- source_word: בִּשְׁמַיָּא וּבְאַרְעָא
  english_pob_choice: in heaven and on earth
  chosen_korean: 하늘과 땅에서
  alternatives_korean:
  - 하늘과 땅 위에서
  - 하늘과 땅 가운데서
  lexicon: שְׁמַיָּא / אַרְעָא
  rationale: 아람어 병렬 표현을 자연스러운 한국어 관용으로 옮기되, 영역 전체를 포괄하는 의미가 드러나도록 했습니다.
- source_word: דִּי שֵׁיזִיב לְדָנִיֵּאל מִן יַד אַרְיָוָתָא
  english_pob_choice: he who rescued Daniel from the power of the lions
  chosen_korean: 사자들의 손에서 다니엘을 구원하신 분이십니다
  alternatives_korean:
  - 사자들의 손에서 다니엘을 건져 내신 분이십니다
  - 사자들의 세력에서 다니엘을 구원하신 분이십니다
  lexicon: יַד + אַרְיָוָתָא
  rationale: ‘손’은 아람어의 지배력·권세를 가리키는 관용을 살린 번역이며, POB의 ‘power of the lions’와도 의미상 대응합니다.
theological_decisions:
- issue: 하나님의 구원과 능력의 범위
  chosen_reading: 하나님은 다니엘을 구하신 과거의 행위뿐 아니라, 지금도 구원하시고 건져 내시며 하늘과 땅에서 표징과 이적을 행하시는 분으로 선포됩니다.
  alternative_readings:
  - 단지 과거의 구출 사건만을 회고하는 진술
  - 일반적 찬양문으로만 읽는 방식
  rationale: 현재형 동사들을 살려 하나님의 지속적 속성과 역사적 구원을 함께 드러내는 것이 본문의 찬양/선언 구조에 더 부합합니다.
  doctrine_reference: 하나님의 섭리와 구원 사역
