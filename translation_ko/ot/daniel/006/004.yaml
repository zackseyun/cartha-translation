id: DAN.6.4
reference: Daniel 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱדַ֨יִן֙ דָּנִיֵּ֣אל דְּנָ֔ה הֲוָ֣א מִתְנַצַּ֔ח עַל סָרְכַיָּ֖/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֑/א כָּ/ל קֳבֵ֗ל דִּ֣י ר֤וּחַ יַתִּירָא֙ בֵּ֔/הּ וּ/מַלְכָּ֣/א עֲשִׁ֔ית לַ/הֲקָמוּתֵ֖/הּ עַל כָּל מַלְכוּתָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/004.yaml
  text: Then this Daniel distinguished himself above the high officials and the satraps[a], because an extraordinary spirit was in him[b], and the king planned to set him over the whole kingdom.
  footnotes:
  - marker: a
    text: Or 'an excellent spirit was in him.' The phrase may refer broadly to Daniel's exceptional inner quality, wisdom, or disposition.
    reason: lexical_alternative
  - marker: b
    text: Or 'the king intended to appoint him over the whole kingdom.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이 다니엘은 그 고관들과 사트라프들 위에서 두드러졌습니다. 이는 그에게 탁월한 영이 있었기 때문이며, 왕은 그를 온 나라 위에 세우려 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 뛰어난 영이 있었다.’ 이 표현은 다니엘의 탁월한 내적 자질, 지혜, 또는 성향을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕은 그를 온 나라 위에 임명하려 했습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그리하여
  - 그후
  lexicon: HALOT
  rationale: 서사 전개를 여는 시간 부사로, 현대 한국어에서 자연스럽고 이어지는 사건의 흐름을 살립니다.
- source_word: דָּנִיֵּאל דְּנָה
  english_pob_choice: this Daniel
  chosen_korean: 이 다니엘
  alternatives_korean:
  - 다니엘
  - 바로 이 다니엘
  lexicon: HALOT
  rationale: 지시어가 단순 식별을 넘어 강조를 주므로, 한국어에서도 ‘이’를 살려 두드러진 표현을 유지합니다.
- source_word: מִתְנַצַּח עַל
  english_pob_choice: distinguished himself above
  chosen_korean: …위에서 두드러졌습니다
  alternatives_korean:
  - …보다 뛰어났습니다
  - …위에 있었습니다
  lexicon: HALOT
  rationale: 비교 우위와 지속적 탁월함을 자연스럽게 옮기되, 지배권 부여와는 구별되는 비교 의미를 유지했습니다.
- source_word: רוּחַ יַתִּירָא בֵּהּ
  english_pob_choice: an extraordinary spirit was in him
  chosen_korean: 그에게 탁월한 영이 있었기 때문이며
  alternatives_korean:
  - 그에게 뛰어난 영이 있었기 때문이며
  - 그에게 탁월한 마음가짐이 있었기 때문이며
  lexicon: HALOT
  rationale: 원문이 ‘영’이라고 말하는 은유를 살려, 능력으로만 평평하게 풀지 않고 내적 성격의 탁월함을 보존했습니다.
- source_word: לַהֲקָמוּתֵהּ
  english_pob_choice: to set him
  chosen_korean: 그를 … 세우려 했습니다
  alternatives_korean:
  - 그를 … 임명하려 했습니다
  - 그를 … 올려 세우려 했습니다
  lexicon: HALOT
  rationale: 직역의 ‘세우다’가 원문의 ‘세우게 하다/세우다’라는 폭넓은 뜻을 유지하며, 과도한 관료화 표현을 피합니다.
theological_decisions:
- issue: ‘영’의 의미를 어떻게 처리할 것인가
  chosen_reading: ‘탁월한 영’으로 두고, 그것이 재능인지 성품인지 더 좁혀 규정하지 않았습니다.
  alternative_readings:
  - ‘탁월한 재능’으로 해석
  - ‘탁월한 성품’으로 해석
  - ‘성령’으로 특정
  rationale: 원문과 영어 POB 모두 의미의 범위를 열어 두고 있으므로, 본문이 명시하지 않은 신학적 동일시를 하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
