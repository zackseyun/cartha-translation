  naturalness: ‘그 고관들과 사트라프들 위에서 두드러졌습니다’는 현대 표준 한국어의 비교 표현으로 어색합니다. ‘고위 관리들과 사트라프들보다 뛰어났습니다’가 자연스럽습니다. 또한 각주 표지는 해당 표현 바로 뒤에 두어야 합니다.
