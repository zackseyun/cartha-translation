- from: 그때 돌 하나를 가져다가 굴 입구 위에 놓고, 왕이 자기 인장반지와 그의 귀족들의 인장반지로 그것에 도장을 찍어, 다니엘에 관한 그 어떤 것도 바뀌지 않게 하였습니다.[a]
