id: DAN.6.18
reference: Daniel 6:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵיתָ֨יִת֙ אֶ֣בֶן חֲדָ֔ה וְ/שֻׂמַ֖ת עַל פֻּ֣ם גֻּבָּ֑/א וְ/חַתְמַ֨/הּ מַלְכָּ֜/א בְּ/עִזְקְתֵ֗/הּ וּ/בְ/עִזְקָת֙ רַבְרְבָנ֔וֹ/הִי דִּ֛י לָא תִשְׁנֵ֥א צְב֖וּ בְּ/דָנִיֵּֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/018.yaml
  text: Then a stone was brought and placed over the mouth of the pit[a], and the king sealed it with his signet ring and with the signet rings of his nobles, so that nothing concerning Daniel might be changed.
  footnotes:
  - marker: a
    text: Or, 'so that the matter concerning Daniel might not be altered.' The Aramaic צְבוּ can refer to a matter, intention, or decision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 돌 하나를 가져다가 굴 입구 위에 놓고, 왕이 자기 인장반지와 그의 귀족들의 인장반지로 그것에 도장을 찍어, 다니엘에 관한 그 어떤 것도 바뀌지 않게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다니엘에 관한 그 일/결정이 바뀌지 않게 하려고’. 아람어 צְבוּ는 일, 뜻, 의도, 결정 등을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֲדָה
  english_pob_choice: a stone
  chosen_korean: 돌 하나
  alternatives_korean:
  - 한 돌
  - 돌 한 개
  lexicon: HALOT
  rationale: 아람어 חֲדָה는 ‘하나’의 뜻이어서, ‘돌 하나’가 수량과 문맥의 자연스러움을 함께 살립니다.
- source_word: וְשֻׂמַת עַל פֻּם גֻּבָּא
  english_pob_choice: placed over the mouth of the pit
  chosen_korean: 굴 입구 위에 놓고
  alternatives_korean:
  - 구덩이의 입 위에 놓고
  - 굴의 입 위에 놓고
  lexicon: HALOT
  rationale: פֻּם은 문자적으로 ‘입’이지만 여기서는 개구부를 뜻하므로, 한국어에서는 ‘입구’로 풀어 자연스럽게 옮겼습니다.
- source_word: בְּ/עִזְקְתֵהּ וּ/בְ/עִזְקָת רַבְרְבָנֹוהִי
  english_pob_choice: with his signet ring and with the signet rings of his nobles
  chosen_korean: 자기 인장반지와 그의 귀족들의 인장반지
  alternatives_korean:
  - 자기 도장반지와 그의 귀족들의 도장반지
  - 자기 인장과 그의 귀족들의 인장
  lexicon: HALOT
  rationale: עִזְקְתָא는 봉인에 쓰는 반지를 가리키므로 ‘인장반지’로 구체화했습니다. רַבְרְבָנֹוהִי는 궁정의 높은 사람들을 가리켜, 문맥상 ‘귀족들’이 간결합니다.
- source_word: דִּי לָא תִשְׁנֵא צְבוּ בְּ/דָנִיֵּאל
  english_pob_choice: so that nothing concerning Daniel might be changed
  chosen_korean: 다니엘에 관한 그 어떤 것도 바뀌지 않게
  alternatives_korean:
  - 다니엘에 관한 일이 바뀌지 않게
  - 다니엘에 대한 어떤 결정도 바뀌지 않게
  lexicon: HALOT
  rationale: צְבוּ는 ‘사물/일/의도/결정’까지 포괄할 수 있어, 해석을 과도하게 좁히지 않고 ‘그 어떤 것도’로 넓게 옮겼습니다.
theological_decisions:
- issue: 봉인 행위의 법적·서사적 기능
  chosen_reading: 왕의 봉인은 단순한 장식이 아니라, 다니엘의 처지를 공식적으로 고정하는 법적 조치로 읽었습니다.
  alternative_readings:
  - 단순히 무덤/굴을 닫는 물리적 행위로만 읽기
  - 왕의 개인적 표시로만 읽기
  rationale: 본문의 ‘왕의 인장반지’와 귀족들의 인장반지는 공식성을 강조하므로, 서술의 힘을 살려 법적 구속력을 드러냈습니다.
  doctrine_reference: 본문 주해/서사 기능
