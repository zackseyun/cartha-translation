  text: וּ/כְ/מִקְרְבֵ֣/הּ לְ/גֻבָּ֔/א לְ/דָ֣נִיֵּ֔אל בְּ/קָ֥ל עֲצִ֖יב זְעִ֑ק עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל דָּֽנִיֵּאל֙ עֲבֵד֙ אֱלָהָ֣/א חַיָּ֔/א אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א הַ/יְכִ֥ל לְ/שֵׁיזָבוּתָ֖/ךְ מִן אַרְיָוָתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/021.yaml
  text: And when he came near the den[a], he cried out to Daniel with a distressed voice. The king spoke and said to Daniel, “Daniel, servant of the living God, has your God, whom you continually serve[c][b], been able to deliver you from the lions?”
  footnotes:
  - marker: a
    text: Or “with a grieved/sorrowful voice.”
    reason: lexical_alternative
  - marker: b
    text: Or “whom you continually worship.” The Aramaic verb can denote religious service or worship.
    reason: lexical_alternative
  - marker: c
    text: Or “servant of the living God” could be rendered “slave of the living God,” though here the context favors the honorific sense of devoted service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 굴에 가까이 이르렀을 때, 그는 근심 어린 목소리로 다니엘에게 외쳤습니다. 왕이 다니엘에게 말했습니다. “다니엘, 살아 계신 하나님의 종아, 네가 끊임없이 섬기는 네 하나님이 사자들 가운데서 너를 구해 내실 수 있었느냐?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְמִקְרְבֵהּ
  english_pob_choice: And when he came near
  chosen_korean: 그가 굴에 가까이 이르렀을 때
  alternatives_korean:
  - 그가 굴에 다가갔을 때
  - 그가 굴에 가까이 왔을 때
  lexicon: HALOT
  rationale: 시간적 선행과 이동의 구체성을 살리면서, 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: גֻבָּא
  english_pob_choice: den
  chosen_korean: 굴
  alternatives_korean:
  - 동굴
  - 구덩이
  lexicon: HALOT
  rationale: 사자 굴이라는 문맥에서 한국어로 가장 자연스럽고 즉각적인 대응어는 ‘굴’입니다.
- source_word: בְּקָל עֲצִיב
  english_pob_choice: with a distressed voice
  chosen_korean: 근심 어린 목소리로
  alternatives_korean:
  - 슬픔에 잠긴 목소리로
  - 괴로운 목소리로
  lexicon: HALOT
  rationale: עֲצִיב의 슬픔·괴로움·우려의 뉘앙스를 살리되, 한국어에서 과장되지 않고 정서적으로 정확한 표현을 택했습니다.
- source_word: עֲבֵד אֱלָהָא חַיָּא
  english_pob_choice: servant of the living God
  chosen_korean: 살아 계신 하나님의 종
  alternatives_korean:
  - 살아 계신 하나님의 노예
  - 살아 계신 하나님의 종이
  lexicon: HALOT
  rationale: 여기서 עֲבֵד는 예배 의무보다는 왕이 다니엘을 지칭하는 존칭적 종속 관계를 나타내므로, 본문과 어울리는 ‘종’을 유지했습니다.
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  english_pob_choice: whom you continually serve
  chosen_korean: 네가 끊임없이 섬기는
  alternatives_korean:
  - 네가 계속 예배하는
  - 네가 늘 섬기는
  lexicon: HALOT
  rationale: פָּלַח의 종교적 섬김과 일반적 봉사의 범위를 모두 열어 두기 위해 ‘섬기다’를 택했고, בִּתְדִירָא는 ‘끊임없이’로 옮겨 지속성을 분명히 했습니다.
- source_word: הַיְכִל לְשֵׁיזָבוּתָךְ
  english_pob_choice: has your God ... been able to deliver you
  chosen_korean: 네 하나님이 사자들 가운데서 너를 구해 내실 수 있었느냐
  alternatives_korean:
  - 네 하나님이 너를 구원하실 수 있었느냐
  - 네 하나님이 너를 건져 내실 수 있었느냐
  lexicon: HALOT
  rationale: לְשֵׁיזָבוּתָךְ는 단순한 도움보다 구출·해방의 의미가 강하므로 ‘구해 내시다’를 사용했고, 질문의 완료성은 ‘~수 있었느냐’로 표현했습니다.
theological_decisions:
- issue: עֲבֵד אֱלָהָא חַיָּא의 사회적/종교적 뉘앙스
  chosen_reading: 살아 계신 하나님의 종
  alternative_readings:
  - 살아 계신 하나님의 노예
  rationale: 본문은 다니엘의 예속 상태를 강조하기보다 하나님께 대한 충성된 관계를 칭하는 문맥이므로, 본문이 요구하는 존칭성을 해치지 않는 ‘종’을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-language sensitivity guidelines
- issue: פָּלַח의 의미 범위
  chosen_reading: 네가 끊임없이 섬기는
  alternative_readings:
  - 네가 끊임없이 예배하는
  rationale: 이 동사는 예배 행위에 한정되지 않고 지속적인 신실한 섬김까지 포함하므로, 문맥상 더 넓은 의미를 보존하는 ‘섬기다’가 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
