id: DAN.6.3
reference: Daniel 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עֵ֤לָּא מִנְּ/הוֹן֙ סָרְכִ֣ין תְּלָתָ֔א דִּ֥י דָנִיֵּ֖אל חַֽד מִנְּ/ה֑וֹן דִּֽי לֶהֱוֺ֞ן אֲחַשְׁדַּרְפְּנַיָּ֣/א אִלֵּ֗ין יָהֲבִ֤ין לְ/הוֹן֙ טַעְמָ֔/א וּ/מַלְכָּ֖/א לָֽא לֶהֱוֵ֥א נָזִֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/003.yaml
  text: And over them were three high officials[a], of whom Daniel was one[b], so that these satraps might give account to them and the king might suffer no loss.
  footnotes:
  - marker: a
    text: Or 'might report to them'; the Aramaic phrase can denote giving an account or rendering a report in an administrative sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'the king might not be harmed'; here the sense is likely that the king would incur no administrative or financial loss.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 위에는 세 명의 고위 관리가 있었고, 다니엘은 그들 가운데 한 사람이었습니다. 이 사트랍들은 그 관리들에게 보고하도록[a], 왕이 손실을 입지 않도록 했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 회계를 제출하도록’으로 옮길 수 있습니다. 아람어 표현은 행정적 문맥에서 보고를 하거나 حساب을 제출하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕이 해를 입지 않도록’으로 옮길 수 있습니다. 여기서는 왕이 행정적 또는 재정적 손실을 입지 않는다는 뜻이 더 유력합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵלָּא
  english_pob_choice: And over them were
  chosen_korean: 그리고 그들 위에는
  alternatives_korean:
  - 그리고 그들 위쪽에는
  - 그리고 그들 위에
  lexicon: HALOT
  rationale: 행정적 상하 관계를 자연스럽게 살리면서, 원문의 ‘위에’라는 권력 구조를 그대로 드러냅니다.
- source_word: סָרְכִין תְּלָתָא
  english_pob_choice: three high officials
  chosen_korean: 세 명의 높은 관리
  alternatives_korean:
  - 세 명의 고관
  - 세 명의 총리
  - 세 명의 감독관
  lexicon: HALOT
  rationale: 관직의 정확한 역사적 뉘앙스를 유지하되, 한국어에서 낯설 수 있는 ‘satraps’ 위 계층의 직분을 직관적으로 전달합니다.
- source_word: יָהֲבִין לְהוֹן טַעְמָא
  english_pob_choice: might give account to them
  chosen_korean: 그들에게 보고하게 하고
  alternatives_korean:
  - 그들에게 계정을 바치게 하고
  - 그들에게 대답하게 하고
  - 그들에게 보고를 올리게 하고
  lexicon: HALOT
  rationale: טַעְמָא의 행정 문맥상 ‘보고/답변’의 뜻을 살려, 상급자에 대한 행정 보고 책임을 자연스럽게 표현합니다.
- source_word: וּמַלְכָּא לָא לֶהֱוֵא נָזִק
  english_pob_choice: and the king might suffer no loss
  chosen_korean: 왕이 손해를 보지 않게 하려는 것이었습니다
  alternatives_korean:
  - 왕이 손해를 입지 않게 하려는 것이었습니다
  - 왕이 아무 손실도 보지 않게 하려는 것이었습니다
  - 왕이 피해를 입지 않게 하려는 것이었습니다
  lexicon: HALOT
  rationale: נזק을 물리적 ‘해를 입다’보다 행정·재정적 ‘손해’로 옮겨, 포로기 행정 맥락과 POB의 의미를 반영합니다.
theological_decisions:
- issue: 다니엘을 포함하는 세 고위 관리와 사트랍들의 행정 질서
  chosen_reading: 다니엘은 세 높은 관리 가운데 한 사람으로서 사트랍들을 감독하는 구조에 놓여 있습니다.
  alternative_readings:
  - 다니엘이 세 총독 가운데 하나였습니다.
  - 다니엘이 그들보다 우위의 관리였습니다.
  rationale: 본문의 관심은 신학적 논쟁보다 제국 행정 구조에 있으며, 다니엘의 위치를 ‘그들 가운데 한 사람’으로 옮겨 원문의 계층성을 보존합니다.
  doctrine_reference: 역사서/지혜문학의 서술적 정확성
- issue: ‘왕이 손해를 보지 않게’의 의미
  chosen_reading: 여기서 ‘손해’는 주로 행정적·재정적 손실을 가리킵니다.
  alternative_readings:
  - 신체적 해를 가리킵니다.
  - 일반적 피해를 가리킵니다.
  rationale: 영어 POB의 주석이 제시하듯, 문맥상 왕의 ‘손해 없음’은 신체적 안전보다 왕실 행정과 재정의 보전을 뜻합니다.
  doctrine_reference: 문맥적 의미론
