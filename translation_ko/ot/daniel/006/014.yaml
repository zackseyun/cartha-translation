id: DAN.6.14
reference: Daniel 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֠/אדַיִן עֲנ֣וֹ וְ/אָמְרִין֮ קֳדָ֣ם מַלְכָּ/א֒ דִּ֣י דָנִיֵּ֡אל דִּי֩ מִן בְּנֵ֨י גָלוּתָ֜/א דִּ֣י יְה֗וּד לָא שָׂ֨ם עלי/ך מַלְכָּ/א֙ טְעֵ֔ם וְ/עַל אֱסָרָ֖/א דִּ֣י רְשַׁ֑מְתָּ וְ/זִמְנִ֤ין תְּלָתָה֙ בְּ/יוֹמָ֔/א בָּעֵ֖א בָּעוּתֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/014.yaml
  text: Then they answered and said before the king[a], “Daniel, who is one of the exiles from Judah, pays no attention to you, O king, or to the injunction that you have signed[c][b], but three times a day he makes his petition.”
  footnotes:
  - marker: a
    text: Or 'shows no regard for you.' The Aramaic idiom literally speaks of not setting attention or regard upon the king.
    reason: lexical_alternative
  - marker: b
    text: Or 'interdict' or 'decree' for 'injunction.' The term refers to a binding legal prohibition.
    reason: lexical_alternative
  - marker: c
    text: Literally 'he seeks his petition.' The expression means that he continues making his request in prayer; the recipient is not explicitly named in this clause, though the context identifies Daniel's God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들이 왕 앞에서 대답하여 말했습니다. “다니엘은 유다에서 끌려온 포로들 가운데 한 사람인데, 왕이여, 왕을 전혀 돌아보지 않고, 왕이 서명한 그 금령에도 아랑곳하지 않습니다. 그는 하루에 세 번 기도합니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕에게 주의를 두지 않는다/관심을 두지 않는다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 아람어 표현은 binding legal prohibition, 곧 ‘금령/금지령’의 성격을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 본문은 청원의 대상을 직접 밝히지 않지만, 문맥상 다니엘의 하나님께 드리는 기도임이 분명합니다.
    reason: source_note
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그러자
  - 그때에
  lexicon: HALOT
  rationale: 이야기 진행을 여는 Aramaic 담화 표지로, 한국어에서는 자연스러운 사건 연결어인 ‘그때’가 흐름을 잘 살립니다.
- source_word: קֳדָם מַלְכָּא
  english_pob_choice: before the king
  chosen_korean: 왕 앞에서
  alternatives_korean:
  - 왕 앞에
  - 왕의 면전에서
  lexicon: HALOT
  rationale: 법정·궁정 장면의 정중한 대면을 드러내는 표현으로 ‘왕 앞에서’가 가장 자연스럽고 원문 뉘앙스를 보존합니다.
- source_word: לָא שָׂם עלי/ך ... טְעֵם
  english_pob_choice: pays no attention to you
  chosen_korean: 왕을 전혀 돌아보지 않고
  alternatives_korean:
  - 왕에게 전혀 주의를 기울이지 않고
  - 왕을 아랑곳하지 않고
  lexicon: HALOT
  rationale: 직역의 ‘주의를 두다’는 한국어에서 어색하므로, 원문 관용구의 의미인 ‘heed/pay regard to’의 무시를 자연스럽게 살렸습니다.
- source_word: אֱסָרָא ... רְשַׁמְתָּ
  english_pob_choice: the injunction that you have signed
  chosen_korean: 왕이 서명한 그 금령
  alternatives_korean:
  - 왕이 서명한 그 금지령
  - 왕이 확정한 그 법령
  lexicon: HALOT
  rationale: אֱסָרָא는 이 문맥에서 구속력 있는 금지 조항이므로 ‘금령’이 법적 강제성을 비교적 정확하게 드러냅니다. ‘서명한’은 공포된 문서의 효력을 반영합니다.
- source_word: בָּעֵא בָּעוּתֵהּ
  english_pob_choice: he makes his petition
  chosen_korean: 기도합니다
  alternatives_korean:
  - 청원합니다
  - 간구합니다
  lexicon: HALOT
  rationale: 문맥상 기도의 대상이 하나님임은 분명하지만, 본절의 아람어는 받는 이를 직접 밝히지 않으므로 ‘기도합니다’로 유지해 의미를 과도하게 특정하지 않았습니다.
theological_decisions:
- issue: Daniel의 petition 대상 명시 여부
  chosen_reading: 본문에는 대상 없이 ‘기도합니다’로 두고, 문맥이 하나님께 드리는 기도임을 암시하게 합니다.
  alternative_readings:
  - 하나님께 기도합니다
  - 하나님께 청원합니다
  rationale: 원문은 ‘그의 청원을 구한다’는 식으로 대상이 명시되지 않으므로, 본절 자체에 없는 말을 덧붙이지 않는 것이 source-first 원칙에 맞습니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥 보강은 가능하나 본문에 없는 정보의 삽입은 지양
- issue: “금령”의 법적 강도
  chosen_reading: ‘금령’으로 옮겨 구속력 있는 금지 조항의 성격을 살렸습니다.
  alternative_readings:
  - 법령
  - 조칙
  - 명령
  rationale: 이 단어는 단순한 일반 명령이 아니라 위반이 금지된 공적 문서를 가리키므로, 한국어에서도 법적 억압성을 드러내는 표현이 적절합니다.
  doctrine_reference: 본문의 정치·법정 맥락을 약화시키지 않는 번역 원칙
