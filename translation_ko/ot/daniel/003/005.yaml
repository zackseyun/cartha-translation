id: DAN.3.5
reference: Daniel 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַ֠שְׁרוֹקִיתָ/א קיתרוס סַבְּכָ֤א פְּסַנְתֵּרִין֙ סוּמְפֹּ֣נְיָ֔ה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א תִּפְּל֤וּן וְ/תִסְגְּדוּן֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/005.yaml
  text: At the time when you hear the sound of the horn[a], pipe, lyre, trigon, psaltery, bagpipe, and every kind of music[b], you are to fall down and pay homage to the golden image that King Nebuchadnezzar has set up.
  footnotes:
  - marker: a
    text: Or 'worship'; the Aramaic verb can denote bowing in reverence and, in this context, carries the sense of idolatrous homage.
    reason: alternative_reading
  - marker: b
    text: The identification of 'symphonia' (here rendered 'bagpipe') is uncertain; alternatives such as 'double pipe' are also proposed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 너희가 나팔, 피리, 수금, 삼각형 수금, 비파, 주머니피리, 그리고 모든 종류의 음악 소리를 듣게 되면, 엎드려 느부갓네살 왕이 세운 금상에게 경배해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경배하다’는 문맥에 따라 예배를 뜻할 수도 있지만, 여기서는 왕의 금상에 대한 우상적 복종을 가리킵니다.
    reason: theological_note
  - marker: b
    text: ‘주머니피리’는 סוּמְפֹּנְיָה의 전통적 식별을 반영한 번역이며, 정확한 악기 명칭은 확정되지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעִדָּנָא דִּי
  english_pob_choice: At the time when
  chosen_korean: 그때
  alternatives_korean:
  - 그 시각에
  - 소리가 날 때
  lexicon: HALOT
  rationale: 시간을 여는 조건절이므로 한국어로는 군더더기 없는 ‘그때’가 가장 자연스럽고, 명령 절과의 연결도 분명합니다.
- source_word: קָל
  english_pob_choice: the sound
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 울림
  lexicon: HALOT
  rationale: 여기서는 악기들이 내는 청각적 신호를 가리키므로, 과도하게 해석하지 않는 ‘소리’가 적절합니다.
- source_word: וְתִסְגְּדוּן
  english_pob_choice: pay homage
  chosen_korean: 경배해야 합니다
  alternatives_korean:
  - 절해야 합니다
  - 경의를 표해야 합니다
  lexicon: HALOT
  rationale: 문맥상 우상에게 하는 절과 숭배가 함께 걸려 있어, 한국어에서는 의례적 절보다 더 강한 ‘경배’가 의미를 충분히 드러냅니다. 다만 문맥의 우상성은 본문 자체가 보여 주므로 따로 완화하지 않았습니다.
- source_word: סוּמְפֹּנְיָה
  english_pob_choice: bagpipe
  chosen_korean: 주머니피리
  alternatives_korean:
  - 바그파이프
  - 더블피리
  lexicon: HALOT
  rationale: 기구의 정확한 식별은 불확실하지만, 영어 POB의 ‘bagpipe’를 한국어로 옮기면 기능적 대응이 분명한 ‘주머니피리’가 가장 직접적입니다.
- source_word: לְצֶלֶם דַּהֲבָא
  english_pob_choice: to the golden image
  chosen_korean: 금상에게
  alternatives_korean:
  - 금으로 된 형상에게
  - 황금 우상에게
  lexicon: HALOT
  rationale: ‘형상/우상’보다 한국어 독자에게 즉시 드러나는 ‘금상’이 간결하며, 왕이 세운 대상이 조각상임을 충분히 전달합니다.
theological_decisions:
- issue: תִּפְּלוּן + וְתִסְגְּדוּן의 명령 강도와 우상숭배 뉘앙스
  chosen_reading: ‘엎드려 … 경배해야 합니다’로 옮겨, 단순한 자세 명령이 아니라 우상 앞의 의례적 복종을 드러냈습니다.
  alternative_readings:
  - ‘엎드려 절해야 합니다’
  - ‘무릎을 꿇고 경배해야 합니다’
  rationale: 히브리/아람어 동사는 몸을 낮추는 행위와 숭배 행위를 함께 포함할 수 있으며, 본문은 왕의 금상에 대한 강제적 충성을 요구합니다. 따라서 행동과 종교적 의미를 함께 살리는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3 — source가 지닌 신학적 긴장을 해소하지 않고 보존합니다.
