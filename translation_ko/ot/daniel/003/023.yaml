source:
  edition: WLC
  text: וְ/גֻבְרַיָּ֤/א אִלֵּךְ֙ תְּלָ֣תֵּ/ה֔וֹן שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ נְפַ֛לוּ לְ/גֽוֹא אַתּוּן נוּרָ֥/א יָֽקִדְתָּ֖/א מְכַפְּתִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/023.yaml
  text: And these three men—Shadrach[a], Meshach[b], and Abed-nego—fell bound into the midst of the blazing furnace.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'were thrown into the midst of the blazing furnace.' The Aramaic verb itself is simply 'fell,' though the surrounding context explains that they had been cast in.
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions often read 'the burning fiery furnace.' The Aramaic expression refers to a furnace characterized by blazing fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 세 사람—사드락, 메삭, 아벳느고—은 결박된 채 불타오르는 풀무 가운데에 떨어졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֻבְרַיָּא / אִלֵּךְ / תְּלָתֵּהוֹן
  english_pob_choice: these three men
  chosen_korean: 그 세 사람
  alternatives_korean:
  - 이 세 사람
  - 그 세 남자
  lexicon: HALOT
  rationale: 아람어의 지시어와 수량 표현을 자연스러운 한국어로 옮기되, 본문이 이미 지명된 세 인물을 가리키므로 '사람'이 가장 무난합니다.
- source_word: נְפַלוּ
  english_pob_choice: fell
  chosen_korean: 떨어졌습니다
  alternatives_korean:
  - 쓰러졌습니다
  - 떨어졌습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로 '떨어지다'이므로, 주체가 화덕 안으로 던져진 결과를 간결하게 드러내는 '떨어졌습니다'를 택했습니다.
- source_word: לְגוֹא אַתּוּן נוּרָא יָקִדְתָּא
  english_pob_choice: into the midst of the blazing furnace
  chosen_korean: 불타오르는 풀무 가운데에
  alternatives_korean:
  - 불타는 풀무 속에
  - 타오르는 화덕 가운데에
  lexicon: HALOT
  rationale: '''가운데''는 아람어 לְגוֹא의 ''중앙/내부''를 살리고, ''풀무''는 이 심판 장면의 고유한 전통적 대응어입니다. ''불타오르는''은 נוּרָא יָקִדְתָּא의 강한 화염성을 자연스럽게 반영합니다.'
- source_word: מְכַפְּתִין
  english_pob_choice: bound
  chosen_korean: 결박된 채
  alternatives_korean:
  - 묶인 채
  - 결박된
  lexicon: HALOT
  rationale: 분사형 상태를 한국어의 부사적 표현으로 살려, 그들이 묶인 상태 그대로 화덕에 들어간 장면을 드러냈습니다.
theological_decisions:
- issue: '본문의 서술 방식: ''fell''을 그대로 유지할지, ''던져졌다''를 본문에 명시할지'
  chosen_reading: 본문에는 결과 상태를 중심으로 '떨어졌습니다'를 두고, 던져진 행위는 본문 밖의 문맥이 설명하는 것으로 둡니다.
  alternative_readings:
  - '''던져졌습니다''를 본문에 직접 반영'
  - '''떨어졌습니다''와 각주로 설명'
  rationale: 아람어 동사는 단순히 '떨어지다'이며, POB의 영어 본문도 이를 유지합니다. 문맥상 투입 행위가 분명하지만, 본문 자체는 원문이 말하는 결과를 보존하는 것이 더 정확합니다.
  doctrine_reference: 문자적-문맥적 일치의 원칙
