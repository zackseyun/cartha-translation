    issue: ‘결박되지 않은 채’
    rationale: שְׁרַיִן은 문맥상 이미 결박되었던 사람들의 결박이 풀린 상태입니다. ‘결박되지 않은’은 원래 결박된 적이 없었다는 의미로도 읽힐 수 있으므로 ‘결박이 풀린 채’가 문맥과 어휘 대조를 더 정확히 살립니다.
