id: DAN.3.25
reference: Daniel 3:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָנֵ֣ה וְ/אָמַ֗ר הָֽא אֲנָ֨ה חָזֵ֜ה גֻּבְרִ֣ין אַרְבְּעָ֗ה שְׁרַ֨יִן֙ מַהְלְכִ֣ין בְּ/גֽוֹא נוּרָ֔/א וַ/חֲבָ֖ל לָא אִיתַ֣י בְּ/ה֑וֹן וְ/רֵוֵ/הּ֙ דִּ֣י רביעי/א דָּמֵ֖ה לְ/בַר אֱלָהִֽין־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/025.yaml
  text: He answered and said[a], “Look! I see four men unbound, walking in the midst of the fire, and there is no harm on them; and the appearance of the fourth is like a son of the gods.”
  footnotes:
  - marker: a
    text: Or, following traditional Christian interpretation, 'like the Son of God.' The Aramaic more literally reads 'like a son of the gods,' reflecting Nebuchadnezzar's own perspective.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 대답하여 말했습니다. 「보십시오! 내가 네 사람을 보니 결박되지 않은 채 불 한가운데를 거니는데, 그들에게는 아무 해도 없으며, 넷째의 모습은 신들의 아들과 같습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적 기독교 해석에 따라 ‘하나님의 아들처럼’으로도 옮길 수 있습니다. 그러나 아람어는 더 문자적으로 ‘신들의 아들처럼’이며, 느부갓네살 자신의 관점을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָא
  english_pob_choice: Look!
  chosen_korean: 보십시오!
  alternatives_korean:
  - 보라!
  - 여기 보십시오!
  lexicon: HALOT
  rationale: 아람어 감탄사·지시어가 즉각적인 주목을 요구하므로, 현대 합쇼체에서 자연스럽고 직접적인 「보십시오」로 옮겼습니다.
- source_word: שְׁרַיִן
  english_pob_choice: unbound
  chosen_korean: 결박되지 않은 채
  alternatives_korean:
  - 풀린 채
  - 묶이지 않은 채
  lexicon: HALOT
  rationale: 이전 결박 상태와의 대비를 살리기 위해 단순히 ‘자유로운’보다 몸의 결박이 풀렸다는 점을 드러내는 표현을 택했습니다.
- source_word: וַחֲבָל לָא אִיתַי בְּהוֹן
  english_pob_choice: and there is no harm on them
  chosen_korean: 그들에게는 아무 해도 없으며
  alternatives_korean:
  - 그들 안에는 아무 상처도 없으며
  - 그들은 다치지 않았으며
  lexicon: HALOT
  rationale: 아람어의 부정 존재문을 한국어로 자연스럽게 옮기되, 단순한 상태 묘사로 약화시키지 않도록 ‘아무 해도 없다’는 구조를 살렸습니다.
- source_word: לְבַר אֱלָהִין
  english_pob_choice: like a son of the gods
  chosen_korean: 신들의 아들과 같습니다
  alternatives_korean:
  - 하나님의 아들과 같습니다
  - 신의 아들과 같습니다
  - 신적 존재와 같습니다
  lexicon: HALOT
  rationale: 복수형 ‘신들’과 부정관사적 ‘아들’이라는 아람어 문맥을 유지해, 느부갓네살의 이교적 관점에서 들리는 그대로 번역했습니다. 전통적 기독교적 이해는 본문 주석 쪽의 대안으로 보존하는 것이 더 적절합니다.
theological_decisions:
- issue: 넷째 인물의 정체를 본문 안에서 어떻게 제시할지
  chosen_reading: 왕의 관찰을 그대로 따라, 본문은 ‘신들의 아들과 같습니다’로 두었습니다.
  alternative_readings:
  - 하나님의 아들과 같습니다
  - 천사적 존재 같습니다
  rationale: 이 구절은 느부갓네살의 발화이며, 아람어 자체는 기독론적 확정을 요구하지 않습니다. 따라서 본문은 관찰된 외형을 그대로 전하고, 전통적 그리스도론적 독법은 별도 각주로만 열어 두는 편이 원문 충실성에 부합합니다.
  doctrine_reference: 원문 우선 원칙; 다니엘 3장 내 서술 흐름(특히 3:28)
