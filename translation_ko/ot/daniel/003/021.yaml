source:
  edition: WLC
  text: בֵּ/אדַ֜יִן גֻּבְרַיָּ֣/א אִלֵּ֗ךְ כְּפִ֨תוּ֙ בְּ/סַרְבָּלֵי/הוֹן֙ פטישי/הון וְ/כַרְבְּלָתְ/ה֖וֹן וּ/לְבֻשֵׁי/ה֑וֹן וּ/רְמִ֕יו לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/021.yaml
  text: Then these men were bound in their trousers[a], their tunics, their cloaks, and their other garments[b], and they were thrown into the midst of the blazing furnace.
  footnotes:
  - marker: a
    text: Or 'their turbans' for the second clothing term; the Aramaic word is rare, and its exact referent is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the furnace of burning fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이 사람들은 바지와 튜닉[a]과 망토와 다른 옷을 입은 채 결박되어, 불타는 풀무[b] 한가운데로 던져졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 두 번째 의복 용어는 희귀어여서 정확한 의미가 불확실합니다. 머리쓰개 또는 터번으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘불타는 불의 가마’입니다.
    reason: lexical_alternative
