id: DAN.3.21
reference: Daniel 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֜יִן גֻּבְרַיָּ֣/א אִלֵּ֗ךְ כְּפִ֨תוּ֙ בְּ/סַרְבָּלֵי/הוֹן֙ פטישי/הון וְ/כַרְבְּלָתְ/ה֖וֹן וּ/לְבֻשֵׁי/ה֑וֹן וּ/רְמִ֕יו לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/021.yaml
  text: Then these men were bound in their trousers[a], their tunics, their cloaks, and their other garments[b], and they were thrown into the midst of the blazing furnace.
  footnotes:
  - marker: a
    text: Or 'their turbans' for the second clothing term; the Aramaic word is rare, and its exact referent is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the furnace of burning fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 사람들은 그들의 바지와 속옷과 외투와 다른 옷을 입은 채 결박당해, 타오르는 풀무불 가마 한가운데로 던져졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀어인 두 번째 의복 용어는 정확한 의미가 불확실하여, 전통 번역들처럼 머리쓰개로 볼 여지도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘타오르는 불의 가마’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그러고 나서
  lexicon: HALOT
  rationale: 아람어 담화 표지로 사건의 진행을 잇는 말이므로, 현대 한국어에서 자연스러운 시간 연결어 ‘그때’로 옮겼습니다.
- source_word: כְּפִתוּ
  english_pob_choice: were bound
  chosen_korean: 결박당해
  alternatives_korean:
  - 묶여
  - 포박당해
  lexicon: HALOT
  rationale: 수동적 구속을 나타내므로, 형벌·집행 문맥에 어울리는 ‘결박당해’가 가장 직접적입니다.
- source_word: סַרְבָּלֵיהוֹן פטישי/הון וְכַרְבְּלָתְהוֹן וּלְבֻשֵׁיהוֹן
  english_pob_choice: their trousers, their tunics, their cloaks, and their other garments
  chosen_korean: 그들의 바지와 속옷과 외투와 다른 옷
  alternatives_korean:
  - 그들의 바지와 튜닉과 망토와 다른 옷
  - 그들의 하의와 겉옷과 다른 의복
  lexicon: HALOT
  rationale: 의복 목록의 항목을 한국어로 구분 가능하게 옮기되, 희귀어인 두 번째 항목은 POB의 불확실성을 반영해 특정 전통 용어로 단정하지 않고 ‘속옷’으로 유보적으로 처리했습니다.
- source_word: וּרְמִיו לְגוֹא אַתּוּן נוּרָא יָקִדְתָּא
  english_pob_choice: and they were thrown into the midst of the blazing furnace
  chosen_korean: 타오르는 풀무불 가마 한가운데로 던져졌습니다
  alternatives_korean:
  - 타오르는 화덕 한가운데로 던져졌습니다
  - 불타오르는 용광로 속으로 던져졌습니다
  lexicon: HALOT
  rationale: ‘들어가다’보다 ‘던져지다’가 수동적 투입과 폭력을 살리고, ‘가마 한가운데’가 아람어의 ‘가운데/중심’ 감각을 살립니다.
theological_decisions:
- issue: 아람어 열로븐 표현 אַתּוּן נוּרָא יָקִדְתָּא의 이미지 강도
  chosen_reading: ‘타오르는 풀무불 가마’로 강한 불길과 가마의 이미지를 함께 살렸습니다.
  alternative_readings:
  - ‘불타는 가마’
  - ‘불붙은 화덕’
  rationale: 원문의 중첩된 화염 표현을 완화하지 않고, 한국어에서도 재난의 강도를 분명히 드러내기 위함입니다.
  doctrine_reference: 서사 본문에서의 문자적 이미지 보존 원칙
