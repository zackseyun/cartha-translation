id: DAN.3.33
reference: Daniel 3:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָת֨וֹ/הִי֙ כְּ/מָ֣ה רַבְרְבִ֔ין וְ/תִמְה֖וֹ/הִי כְּ/מָ֣ה תַקִּיפִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/שָׁלְטָנֵ֖/הּ עִם דָּ֥ר וְ/דָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/033.yaml
  text: How great are his signs[a], and how mighty are his wonders! His kingdom is an everlasting kingdom[c][b], and his dominion is from generation to generation.
  footnotes:
  - marker: a
    text: Or 'his marvels.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an eternal kingdom.'
    reason: lexical_alternative
  - marker: c
    text: 'Aramaic: ''with generation and generation,'' an idiom meaning enduring through all generations.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 표적들은 얼마나 크며, 그의 놀라운 일들은 얼마나 강합니까! 그의 나라는 영원한 나라요[c][b], 그의 통치는 대대로 이어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대안으로 ‘그의 기이한 일들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 대안으로 ‘영원한 왕국’ 또는 ‘영구한 나라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 아람어 관용구로, 문자적으로는 ‘세대와 세대와 함께’이지만 모든 세대를 통틀어 계속된다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָתוֹהִי
  english_pob_choice: his signs
  chosen_korean: 그의 표적들
  alternatives_korean:
  - 그의 징조들
  - 그의 기적들
  lexicon: HALOT
  rationale: 아람어 מקור의 뜻은 하나님의 초자연적 표징이므로, 한국어에서는 '표적들'이 의미를 가장 직접적으로 살리면서도 문맥의 경배조를 유지합니다.
- source_word: תִמְהוֹהִי
  english_pob_choice: his wonders
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 경이들
  - 그의 기이한 일들
  lexicon: HALOT
  rationale: 놀라움과 경외를 불러일으키는 행위를 가리키므로 '놀라운 일들'이 'wonders'의 의미와 문체를 자연스럽게 전달합니다.
- source_word: מַלְכוּת עָלַם
  english_pob_choice: an everlasting kingdom
  chosen_korean: 영원한 나라
  alternatives_korean:
  - 영원한 왕국
  - 영구한 나라
  lexicon: HALOT
  rationale: 직역의 '왕국'보다 한국어 성경 문맥에서 하나님의 통치를 가리키는 '나라'가 더 자연스럽고, 형용사 '영원한'이 지속성을 분명히 드러냅니다.
- source_word: עִם דָּר וְדָר
  english_pob_choice: from generation to generation
  chosen_korean: 대대로 이어집니다
  alternatives_korean:
  - 세대에서 세대로
  - 한 세대에서 다음 세대로
  lexicon: HALOT
  rationale: 관용구의 핵심은 세대의 연속성이므로, 한국어에서는 '대대로'로 압축하고 동사 '이어집니다'로 지속성을 살렸습니다.
theological_decisions:
- issue: ‘his’의 지시 대상
  chosen_reading: 문맥상 느부갓네살의 찬양 속에서도 지시 대상은 지극히 높으신 하나님으로 이해하여, 본문에 설명을 덧붙이지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 본문에 ‘그의[곧 하나님의]’처럼 풀어 쓰기
  rationale: 앞뒤 문맥이 하나님의 표적과 통치를 찬양하므로, 독자가 자연스럽게 하나님을 가리킨다고 이해할 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
