- from: 왕이여, 당신이 바빌론 지방의 행정을 맡겨 두신 유다 사람 몇이 있습니다. 그 사람들, 곧 사드락, 메삭, 아벳느고는 당신을 조금도 존중하지 않았습니다. 그들은 당신의 신들을 섬기지 않으며, 당신이 세워 둔 금으로 된 우상에게도 절하지 않습니다.[a][b]
  to: 왕이시여, 왕께서 바빌론 지방의 행정을 맡도록 임명하신 유다 사람 몇 명이 있습니다. 곧 사드락과 메삭과 아벳느고입니다. 이 사람들이 왕을 조금도 존중하지 않았습니다.[a] 그들은 왕의 신들을 섬기지 않으며, 왕께서 세워 두신 금으로 만든 형상에게 절하지도 않습니다.[b]
