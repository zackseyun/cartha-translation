source:
  edition: WLC
  text: אִיתַ֞י גֻּבְרִ֣ין יְהוּדָאיִ֗ן דִּֽי מַנִּ֤יתָ יָתְ/הוֹן֙ עַל עֲבִידַת֙ מְדִינַ֣ת בָּבֶ֔ל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ גֻּבְרַיָּ֣/א אִלֵּ֗ךְ לָא שָׂ֨מֽוּ עלי/ך מַלְכָּ/א֙ טְעֵ֔ם ל/אלהי/ך לָ֣א פָלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א סָגְדִֽין־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/012.yaml
  text: 'There are certain Jewish men whom you have appointed over the administration of the province of Babylon—Shadrach[a], Meshach, and Abed-nego. These men have paid no attention to you, O king: they do not serve your gods[b], and they do not worship the golden image that you have set up.'
  footnotes:
  - marker: a
    text: Or, 'have shown no regard for you' or 'have not heeded you.' The Aramaic idiom literally says they have not 'set' regard/attention toward the king.
    reason: lexical_alternative
  - marker: b
    text: 'The Aramaic uses different verbs here: they do not ''serve'' the king''s gods, and they do not ''worship'' the golden image.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이시여, 왕께서 바빌론 지방의 행정을 맡도록 임명하신 유다 사람 몇 명이 있습니다. 곧 사드락과 메삭과 아벳느고입니다. 이 사람들이 왕을 조금도 존중하지 않았습니다.[a] 그들은 왕의 신들을 섬기지 않으며, 왕께서 세워 두신 금으로 만든 형상에게 절하지도 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 관용구로는 ‘왕에게 주의나 관심을 두지 않았다’에 가깝습니다.
    reason: source_note
  - marker: b
    text: 본문은 서로 다른 두 동사를 사용합니다. 하나는 신들을 ‘섬기다’이고, 다른 하나는 금으로 만든 형상에게 ‘절하다’입니다.
    reason: source_note
lexical_decisions:
- source_word: אִיתַי גֻּבְרִין יְהוּדָאיִן
  english_pob_choice: There are certain Jewish men
  chosen_korean: 유다 사람 몇이 있습니다
  alternatives_korean:
  - 유다인 몇이 있습니다
  - 몇몇 유다 사람입니다
  lexicon: HALOT
  rationale: 존재 구문 אִיתַי와 남성 복수 גֻּבְרִין, 민족 표지 יְהוּדָאיִן을 함께 살리면서, 고발문 특유의 불특정·비난적 어감을 ‘몇이 있습니다’로 자연스럽게 옮겼습니다.
- source_word: דִּי מַנִּיתָ יָתְהוֹן עַל עֲבִידַת מְדִינַת בָּבֶל
  english_pob_choice: whom you have appointed over the administration of the province of Babylon
  chosen_korean: 당신이 바빌론 지방의 행정을 맡겨 두신
  alternatives_korean:
  - 당신이 바빌론 지방의 업무를 맡기신
  - 당신이 바빌론 지방의 관리를 맡겨 두신
  lexicon: HALOT
  rationale: מַנִּיתָ는 ‘임명하다/맡기다’의 뜻을, עֲבִידַת는 이 행정 문맥에서 ‘행정’으로 풀어 공식 직무를 드러냈습니다. ‘바빌론 지방’은 מְדִינַת בָּבֶל의 자연스러운 대응입니다.
- source_word: לָא שָׂמוּ עֲלַיִךְ טְעֵם
  english_pob_choice: have paid no attention to you
  chosen_korean: 당신을 조금도 존중하지 않았습니다
  alternatives_korean:
  - 당신에게 아무런 주의를 두지 않았습니다
  - 당신을 전혀 헤아리지 않았습니다
  lexicon: HALOT
  rationale: 직역하면 ‘당신 위에/향하여 주의나 생각을 두지 않았다’는 관용구이므로, 왕에게 대한 불손함을 살리는 한국어로 옮겼습니다. 영어 POB의 ‘paid no attention’보다 공손한 체계 안에서 모욕성을 드러내기 위해 ‘존중하지 않았습니다’를 택했습니다.
- source_word: לֵאלָהַיִךְ ... פָלְחִין / וּלְצֶלֶם ... סָגְדִין
  english_pob_choice: they do not serve your gods ... they do not worship the golden image
  chosen_korean: 당신의 신들을 섬기지 않으며 ... 금으로 된 우상에게도 절하지 않습니다
  alternatives_korean:
  - 당신의 신들을 섬기지 않으며 ... 금으로 된 형상에도 엎드려 경배하지 않습니다
  - 당신의 신들을 예배하지 않으며 ... 금으로 된 우상에도 절하지 않습니다
  lexicon: HALOT
  rationale: פָלַח는 신에게 드리는 ‘섬김/봉사’를 뜻하므로 ‘섬기다’로, סְגַד는 몸을 굽혀 경배하는 행위를 가리키므로 ‘절하다’로 구별했습니다. ‘우상’은 צֶלֶם의 문맥상 의미를 드러내는 번역입니다.
theological_decisions:
- issue: 두 개의 다른 종교 행위를 구별할지 여부
  chosen_reading: ‘섬기지 않으며’와 ‘절하지 않습니다’를 구별해 번역했습니다.
  alternative_readings:
  - 두 표현을 모두 ‘경배하지 않습니다’로 통일
  - 두 표현을 모두 ‘예배하지 않습니다’로 통일
  rationale: 아람어 본문은 하나는 신들에게 드리는 봉사, 다른 하나는 형상 앞의 경배를 뜻하는 서로 다른 동사를 사용합니다. 이를 구별해야 고발의 논리를 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
