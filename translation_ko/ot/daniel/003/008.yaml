base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/008.yaml
  text: For this reason[a], at that time certain Chaldean men came forward and maliciously accused the Jews.
  footnotes:
  - marker: a
    text: Or "the Judeans." The Aramaic term can denote the people of Judah in ethnic-geographic terms as well as "the Jews."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그때에 몇몇 갈대아 사람들이 나아와 유다 사람들을 모함하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들.” 아람어 용어는 민족-지리적 의미의 ‘유다 사람들’과 ‘유대인들’을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  english_pob_choice: For this reason
  chosen_korean: 그러므로
  alternatives_korean:
  - 이런 이유로
  - 이 때문에
  lexicon: HALOT
  rationale: 원인-결과의 연결을 자연스러운 한국어로 간결하게 살리되, 문맥상 단순한 시간 접속이 아니라 앞선 사건에 대한 결과를 드러냈습니다.
- source_word: בֵּהּ זִמְנָא
  english_pob_choice: at that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시각에
  - 그 무렵에
  lexicon: HALOT
  rationale: 법정/궁정 문맥의 특정 시점을 자연스럽게 지시하는 표현으로 옮겼습니다.
- source_word: וַאֲכַלוּ קַרְצֵיהוֹן
  english_pob_choice: maliciously accused
  chosen_korean: 모함하였습니다
  alternatives_korean:
  - 악의적으로 고발하였습니다
  - 비방하였습니다
  lexicon: HALOT
  rationale: 직역적 “고발하다”보다, 아람어 관용구가 담는 해로운 중상·적대의 뉘앙스를 한국어에서 가장 압축적으로 드러내는 표현을 택했습니다.
- source_word: דִּי יְהוּדָיֵא
  english_pob_choice: the Jews
  chosen_korean: 유다 사람들을
  alternatives_korean:
  - 유대인들을
  - 유다인들을
  lexicon: HALOT
  rationale: 본문의 민족·지리적 지시를 살리기 위해 기본값인 “유다 사람들”을 채택했으며, 영어 POB 각주처럼 “유대인들”도 가능한 해석입니다.
theological_decisions:
- issue: דִּי יְהוּדָיֵא의 민족적/종교적 지시
  chosen_reading: 이 구절에서는 포로기 궁정 서술에 맞게 특정 민족-지역 집단인 ‘유다 사람들’로 옮겼습니다.
  alternative_readings:
  - ‘유대인들’로 번역하여 후대 종교 집단을 더 직접적으로 반영하는 읽기
  rationale: 아람어 용어는 문맥에 따라 유다 사람들/유대인들을 모두 가리킬 수 있으므로, 본문 시대성을 보존하는 번역을 기본으로 하되 의미 범위를 열어 두었습니다.
  doctrine_reference: 역사-문맥 우선 원칙
