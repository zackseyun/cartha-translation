language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַן דִּי לָ֥א יִפֵּ֖ל וְ/יִסְגֻּ֑ד בַּ/הּ שַׁעֲתָ֣/א יִתְרְמֵ֔א לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/006.yaml
  text: And whoever does not fall down and worship shall in that hour be thrown into the midst of a furnace of blazing fire[a].
  footnotes:
  - marker: a
    text: 'Aramaic: ''in that hour,'' an idiom meaning immediately or at once.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 엎드려 절하지 않는 자는 그 순간에 타오르는 불의 풀무 한가운데에 던져질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 ‘그 시간에’는 관용적으로 ‘즉시’ 또는 ‘바로’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  english_pob_choice: And whoever
  chosen_korean: 그리고 누구든지
  alternatives_korean:
  - 그리고 아무나
  - 그리고 누구라도
  - 그리고 누구든지 그러한 자는
  lexicon: HALOT
  rationale: 일반적 조건을 나타내는 아람어 관용구를 한국어의 포괄적 표현인 '누구든지'로 옮겨 범위를 유지했습니다.
- source_word: לָא יִפֵּל
  english_pob_choice: does not fall down
  chosen_korean: 엎드려
  alternatives_korean:
  - 쓰러지지
  - 엎드리지
  - 몸을 굽혀
  lexicon: HALOT
  rationale: 우상 앞의 자세를 가리키므로 단순한 '떨어지다'보다 예배적 몸짓을 드러내는 '엎드리다'가 더 정확합니다.
- source_word: וְיִסְגֻּד
  english_pob_choice: and worship
  chosen_korean: 절하지 않는
  alternatives_korean:
  - 경배하지 않는
  - 숭배하지 않는
  - 절하며 경배하지 않는
  lexicon: HALOT
  rationale: 이미 앞절의 자세를 '엎드리다'로 살렸으므로, 여기서는 그 행위의 종교적 의미를 '절하다'로 간결하게 살렸습니다.
- source_word: בַּהּ שַׁעֲתָא
  english_pob_choice: in that hour
  chosen_korean: 그 순간에
  alternatives_korean:
  - 그 때에
  - 그 시간에
  - 그 바로 그 시간에
  lexicon: HALOT
  rationale: 문자적으로는 '그 시간/그 시각'이지만, 강제 집행의 즉시성을 드러내는 관용구이므로 한국어의 자연스러운 '그 순간에'로 옮겼습니다.
- source_word: נוּרָא יָקִדְתָּא
  english_pob_choice: furnace of blazing fire
  chosen_korean: 타오르는 불의 풀무
  alternatives_korean:
  - 불타는 풀무
  - 활활 타는 불의 풀무
  - 타오르는 불의 용광로
  lexicon: HALOT
  rationale: '''풀무''는 본문의 처형용 화덕 이미지를 살리고, ''타오르는 불''로 아람어의 중첩된 화염 묘사를 반영했습니다.'
theological_decisions:
- issue: 처형 경고의 즉시성 표현
  chosen_reading: ‘그 순간에’로 옮겨 경고의 즉시 집행성을 드러냈습니다.
  alternative_readings:
  - ‘즉시’
  - ‘그 시간에’
  - ‘바로’
  rationale: 아람어 관용구 בַּהּ שַׁעֲתָא는 문자적으로 '그 시간'이지만, 문맥상 왕의 강압적 즉결 처분을 뜻하므로 현대 한국어에서 가장 직접적인 즉시성으로 표현했습니다.
  doctrine_reference: 본문의 역사서술/왕령 맥락에 대한 문체 판단
