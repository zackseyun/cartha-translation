source:
  edition: WLC
  text: בֵּ/אדַ֜יִן קְרֵ֣ב נְבוּכַדְנֶצַּ֗ר לִ/תְרַע֮ אַתּ֣וּן נוּרָ֣/א יָקִֽדְתָּ/א֒ עָנֵ֣ה וְ/אָמַ֗ר שַׁדְרַ֨ךְ מֵישַׁ֧ךְ וַ/עֲבֵד נְג֛וֹ עַבְד֛וֹ/הִי דִּֽי אֱלָהָ֥/א עלי/א פֻּ֣קוּ וֶ/אֱת֑וֹ בֵּ/אדַ֣יִן נָֽפְקִ֗ין שַׁדְרַ֥ךְ מֵישַׁ֛ךְ וַ/עֲבֵ֥ד נְג֖וֹ מִן גּ֥וֹא נוּרָֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/026.yaml
  text: Then Nebuchadnezzar came near to the door of the blazing fiery furnace[a]. He answered and said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out and come here.” Then Shadrach, Meshach[b], and Abed-nego came out from the midst of the fire.
  footnotes:
  - marker: a
    text: Or 'the burning fiery furnace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to the opening/entrance of the furnace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 느부갓네살이 맹렬히 타는 불가마[a]의 문[b]에 가까이 다가가서 대답하여 말했습니다. 「사드락, 메삭, 아벳느고야, 지극히 높으신 하나님의 종들아, 나오라. 이리 오라.」 그러자 사드락, 메삭, 아벳느고가 불 가운데서 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불타는 불가마’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘입구’ 또는 ‘출입구’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그러자
  lexicon: HALOT
  rationale: 서사 전환 표지로서 사건의 순서를 자연스럽게 이어 주는 현대 한국어 표현을 택했습니다.
- source_word: לִתְרַע
  english_pob_choice: to the door
  chosen_korean: 문 앞
  alternatives_korean:
  - 문
  - 출입구
  - 입구
  lexicon: HALOT
  rationale: 문을 지칭하지만, 본문 흐름상 느부갓네살이 화로의 바깥쪽 경계로 다가오는 장면이므로 ‘문 앞’이 자연스럽고 의미를 과도하게 좁히지 않습니다.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  english_pob_choice: the blazing fiery furnace
  chosen_korean: 불타는 불로 된 용광로
  alternatives_korean:
  - 타오르는 불의 용광로
  - 불타는 화덕
  lexicon: HALOT
  rationale: ‘아툰’의 고대 용광로/화덕 이미지를 살리면서, ‘불타는’과 ‘불로 된’으로 중첩된 화염 묘사를 한국어로 중복 반영했습니다. ‘화덕’보다 ‘용광로’가 형벌 장면의 규모와 열기를 더 강하게 드러냅니다.
- source_word: עַבְדֹוהִי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 종
  - 시종들
  - 하인들
  lexicon: HALOT
  rationale: 하나님께 속한 자라는 관계를 드러내는 일반적 종속 표현으로 옮겼습니다. 인간 고용관계의 ‘시종/하인’보다 신분적 종속을 더 직접적으로 나타냅니다.
- source_word: אֱלָהָא עליא
  english_pob_choice: the Most High God
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  lexicon: HALOT
  rationale: 표제적 칭호를 유지하되, 한국어 성경에서 널리 이해되는 존칭형 표현으로 옮겼습니다. ‘Most High’의 최상급 뉘앙스를 보존합니다.
- source_word: פֻּקוּ / וֶאֱתוֹ
  english_pob_choice: come out / come here
  chosen_korean: 나오라. 그리고 이리 오라.
  alternatives_korean:
  - 나오십시오. 그리고 여기로 오십시오.
  - 나와라. 그리고 이리 와라.
  lexicon: HALOT
  rationale: 직접 명령의 두 동사를 구분해, 먼저 ‘나오라’로 خروج을, 이어 ‘이리 오라’로 발화자 쪽으로의 이동을 살렸습니다.
theological_decisions:
- issue: 느부갓네살의 하나님의 칭호 사용
  chosen_reading: ‘지극히 높으신 하나님’으로 번역해, 왕이 야훼의 주권을 인정하는 고백의 강도를 드러냈습니다.
  alternative_readings:
  - ‘가장 높으신 하나님’
  - ‘지존하신 하나님’
  rationale: 본문은 이교 왕의 입에서 나온 참된 인식을 전달하므로, 칭호를 약화하지 않고 직역에 가깝게 유지하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; preserve theological tension rather than resolve it.'
