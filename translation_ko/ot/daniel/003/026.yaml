  naturalness: ‘불타는 불로 된 용광로’는 현대 한국어에서 부자연스럽고 의미가 모호합니다. ‘맹렬히 타는 불가마’는 자연스러우면서도 원문의 강조를 살립니다. 서술은 합쇼체로 유지하고, 왕의 직접 명령은 장면의 권위적 발화를 살려 ‘-라’로 유지할 수 있습니다.
