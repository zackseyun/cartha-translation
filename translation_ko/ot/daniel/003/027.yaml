base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/027.yaml
  text: And the satraps[a], the prefects, the governors, and the king’s counselors gathered together and saw concerning these men that the fire had no power over their bodies, and the hair of their heads was not singed, and their cloaks were not changed, and no smell of fire had come upon them.
  footnotes:
  - marker: a
    text: Or 'their garments'; the Aramaic term for the clothing item is somewhat uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 총독들과 장관들과 지방관들과 왕의 참모들이 함께 모여 이 사람들을 살펴보니, 불이 그들의 몸에 아무런 힘도 미치지 못하였고, 머리털도 그슬리지 않았으며, 그들의 옷도 변하지 않았고, 불 냄새도 그들에게 배지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사본상 의복 명칭은 다소 불확실합니다. 문맥상 옷감의 한 종류를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתְכַּנְּשִׁין
  english_pob_choice: gathered together
  chosen_korean: 함께 모여
  alternatives_korean:
  - 모여
  - 집결하여
  lexicon: HALOT
  rationale: 집합·소집의 동작을 자연스러운 현대 한국어로 살리되, 여러 관리가 한자리에 모였다는 점을 분명히 했습니다.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא / סִגְנַיָּא / פַחֲוָתָא
  english_pob_choice: satraps / prefects / governors
  chosen_korean: 총독들 / 장관들 / 지방관들
  alternatives_korean:
  - 사트라프들 / 집정관들 / 총독들
  - 행정관들 / 부관들 / 주지사들
  lexicon: HALOT
  rationale: 페르시아 행정 직함의 역사성을 유지하되 한국어에서 읽히는 관직명으로 옮겼습니다. '장관'은 본문 맥락의 고위 행정관을 포괄적으로 드러냅니다.
- source_word: וְהַדָּבְרֵי מַלְכָּא
  english_pob_choice: the king’s counselors
  chosen_korean: 왕의 참모들
  alternatives_korean:
  - 왕의 조언자들
  - 왕의 신하들
  lexicon: HALOT
  rationale: 직역하면 '왕의 말하는 자들/조언자들'에 가까우나, 궁정에서 왕에게 자문하는 인물들을 뜻하는 문맥을 따라 '참모들'로 옮겼습니다.
- source_word: לָא שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן
  english_pob_choice: the fire had no power over their bodies
  chosen_korean: 불이 그들의 몸에 아무런 힘도 미치지 못하였고
  alternatives_korean:
  - 불이 그들의 몸을 해치지 못하였고
  - 불이 그들의 몸을 이기지 못하였고
  lexicon: HALOT
  rationale: שׁלט의 지배·권세 의미를 살려 단순한 '영향'보다 '힘이 미치다'로 옮겼습니다. '몸'은 아람어 גֶּשֶׁם의 뜻을 반영합니다.
- source_word: הִתְחָרַךְ / לָא שְׁנוֹ / לָא עֲדָת בְּהוֹן
  english_pob_choice: was not singed / were not changed / had come upon them
  chosen_korean: 그슬리지 않았으며, 그들의 옷도 변하지 않았고, 불 냄새도 그들에게 배지 않았습니다
  alternatives_korean:
  - 싱거지지 않았으며, 그들의 옷도 달라지지 않았고, 불 냄새도 그들에게 나지 않았습니다
  - 타지 않았으며, 그들의 옷도 변색되지 않았고, 불 냄새도 스며들지 않았습니다
  lexicon: HALOT
  rationale: 머리털의 피해 없음을 '그슬리다'로, 옷의 변화 없음은 그대로 '변하지 않다'로, 냄새의 잔류는 한국어 관용에 맞게 '배다'로 살렸습니다.
theological_decisions:
- issue: 불의 무력함과 하나님의 보존
  chosen_reading: 불이 그들의 몸에 아무런 힘도 미치지 못하였다는 표현을 유지해, 단순 생존이 아니라 심판적 불도 하나님의 보호 아래 제압되었음을 드러냈습니다.
  alternative_readings:
  - 불이 그들을 해치지 못했다는 완화된 표현
  - 불이 영향을 주지 못했다는 약한 표현
  rationale: 본문은 단순히 무사했다는 사실 이상으로, 불이 실제로 권세를 행사하지 못했다는 점을 강조합니다. 이를 약화시키지 않기 위해 '힘이 미치지 못하였다'를 택했습니다.
  doctrine_reference: 하나님의 주권적 보존과 기적적 구원
