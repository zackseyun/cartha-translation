reference: Daniel 3:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָנֵ֨ה נְבֽוּכַדְנֶצַּ֜ר וְ/אָמַ֗ר בְּרִ֤יךְ אֱלָהֲ/הוֹן֙ דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ דִּֽי שְׁלַ֤ח מַלְאֲכֵ/הּ֙ וְ/שֵׁיזִ֣ב לְ/עַבְד֔וֹ/הִי דִּ֥י הִתְרְחִ֖צוּ עֲל֑וֹ/הִי וּ/מִלַּ֤ת מַלְכָּ/א֙ שַׁנִּ֔יו וִ/יהַ֣בוּ גשמי/הון דִּ֠י לָֽא יִפְלְח֤וּן וְ/לָֽא יִסְגְּדוּן֙ לְ/כָל אֱלָ֔הּ לָהֵ֖ן לֵ/אלָֽהֲ/הֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/028.yaml
  text: Nebuchadnezzar answered and said[a], “Blessed be the God of Shadrach, Meshach, and Abed-nego, who sent his angel and delivered his servants, who trusted in him, and set aside the king’s command, and gave up their bodies[c][b], that they might not serve or worship any god except their own God.”
  footnotes:
  - marker: a
    text: Or “his messenger.” Some interpreters identify the figure more specifically, but the Aramaic term itself means either “angel” or “messenger.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “changed the king’s word,” meaning they refused or set aside the king’s command.
    reason: lexical_alternative
  - marker: c
    text: Or “bow down to.”
    reason: lexical_alternative
translation:
  language: ko
  text: 느부갓네살이 응답하여 말했습니다. 「샤드락과 메삭과 아벳느고의 하나님은 찬송받으소서. 그분은 자신의 천사를 보내어, 자신을 믿고 왕의 명령을 바꾸어 버리고, 자기들의 몸을 내어주어 다른 어떤 신도 섬기지 않고 절하지 않도록 한 자신의 종들을 건지셨습니다. 오직 자기들의 하나님께만 그렇게 하도록 하신 것입니다。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “왕의 말을 바꾸어 놓고”입니다. 문맥상 왕의 명령을 거부하거나 무시했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “절하지 않기 위하여”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  english_pob_choice: answered and said
  chosen_korean: 응답하여 말했습니다
  alternatives_korean:
  - 대답하여 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 아람어의 관용적 서술 공식을 한국어로 자연스럽게 옮기되, 단순한 '말했습니다'보다 응답의 서두 기능을 살렸습니다.
- source_word: בְּרִיךְ
  english_pob_choice: Blessed be
  chosen_korean: 찬송받으소서
  alternatives_korean:
  - 복되소서
  - 찬양받으소서
  lexicon: HALOT
  rationale: 왕의 축복 선언이면서도 하나님께 드리는 경배적 어조이므로, 한국어 독자에게 자연스러운 예배적 문체인 '찬송받으소서'를 택했습니다.
- source_word: מַלְאֲכֵהּ
  english_pob_choice: his angel
  chosen_korean: 자신의 천사
  alternatives_korean:
  - 자신의 사자
  - 자신의 메신저
  lexicon: HALOT
  rationale: 이 구절의 구원 장면에서는 '천사'가 가장 자연스럽고, 본문이 허용하는 범위를 넘지 않으면서도 POB의 신중한 선택을 반영합니다.
- source_word: וּמִלַּת מַלְכָּא שַׁנִּיו
  english_pob_choice: and set aside the king’s command
  chosen_korean: 왕의 명령을 바꾸어 버리고
  alternatives_korean:
  - 왕의 말을 바꾸어 놓고
  - 왕의 명령을 저버리고
  lexicon: HALOT
  rationale: 직역하면 '왕의 말을 바꾸다'이지만 문맥상 불복종을 뜻하므로, POB의 'set aside'를 살리면서도 한국어에서 의미가 분명한 표현으로 옮겼습니다.
- source_word: וִיהַבוּ גשמי/הון
  english_pob_choice: gave up their bodies
  chosen_korean: 자기들의 몸을 내어주어
  alternatives_korean:
  - 자기들의 몸을 내주어
  - 자기들의 몸을 넘겨주어
  lexicon: HALOT
  rationale: 몸을 위험과 죽음에 맡기는 자발적 헌신을 담아내기 위해, '내어주다'를 사용했습니다.
theological_decisions:
- issue: קביעה מן המלאך—messenger인지 angel인지
  chosen_reading: '''천사''로 번역하되, 추가 식별은 하지 않습니다.'
  alternative_readings:
  - '''사자'''
  - 특정한 현현으로 해석
  rationale: 아람어 어휘는 '천사/사자' 모두 가능하지만, 이 절은 느부갓네살의 진술이며 본문이 더 강한 식별을 요구하지 않으므로 절제된 번역을 유지했습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 범위를 넘어 신학적 결론을 앞서지 않습니다.'
