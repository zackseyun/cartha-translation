review_pass:
  verdict: revise
  source_fidelity: 수정 전 본문은 마지막의 “오직 자기들의 하나님께만 그렇게 하도록 하신 것입니다”가 아람어 본문에 없는 내용을 덧붙이고, ‘그렇게 하도록 하신’의 주체를 하나님으로 읽히게 하여 목적절의 의미를 왜곡합니다. 또한 ‘다른 어떤 신도’는 ‘자기들의 하나님 외에는 어떤 신도’라는 배타 조건을 충분히 드러내지 못합니다. 수정문은 왕의 명령을 거스르고 몸을 내어준 목적, 곧 자기들의 하나님 외의 어떤 신도 섬기거나 경배하지 않으려 했다는 의미를 보존합니다.
  naturalness: 합쇼체와 현대 표준어에 맞추어 ‘대답하여 말했습니다’ 및 ‘찬송을 받으소서’를 사용했습니다. 길게 연결된 관계절은 원문의 수식 관계를 유지하되, 중복되고 비문에 가까운 종결 문장을 제거하여 자연스럽게 정리했습니다.
  terminology: 통용 표기인 ‘사드락, 메삭, 아벳느고’를 사용했습니다. מַלְאֲכֵהּ는 본문에서 ‘천사’로 번역하고 ‘사자’ 가능성을 각주로 보존했습니다. ‘경배하다’는 יִסְגְּדוּן의 종교적 문맥에 적절하며, 더 문자적인 ‘절하다’는 각주로 제시했습니다.
  issues:
  - severity: high
    issue: 본문에 없는 추가 문장과 인과의 왜곡
    rationale: “오직 자기들의 하나님께만 그렇게 하도록 하신 것입니다”는 원문에 없으며, 하나님이 그들에게 그렇게 하게 하셨다는 뜻으로 읽힐 수 있습니다. 원문은 그들이 다른 신을 섬기거나 경배하지 않기 위해 몸을 내어주었다는 목적을 말합니다.
  - severity: medium
    issue: 배타 표현의 불충분성
    rationale: ‘다른 어떤 신도’만으로는 לָהֵן לֵאלָהֲהוֹן(‘자기들의 하나님 외에는’)의 명시적 예외·배타 관계가 약해집니다.
  - severity: medium
    issue: 인명 표기의 비표준성
    rationale: ‘샤드락’보다 한국어 성경 번역과 일반 표준 사용에서 널리 쓰이는 ‘사드락’이 적절합니다.
  - severity: low
    issue: 경배 관련 각주의 방향
    rationale: 본문을 ‘절하지 않다’로 두고 각주에서 ‘절하지 않기 위하여’를 제시한 것은 대안 관계가 분명하지 않습니다. 본문 ‘경배하다’에 대해 문자적 대안 ‘절하다’를 제시하는 편이 정확합니다.
  revised_text: 느부갓네살이 대답하여 말했습니다. “사드락과 메삭과 아벳느고의 하나님은 찬송을 받으소서. 그분께서는 자신의 천사[a]를 보내시어, 그분을 신뢰하고 왕의 명령을 저버리며[b] 자기들의 몸을 내어주어 자기들의 하나님 외에는 어떤 신도 섬기거나 경배하지 않으려 한 그분의 종들을 건지셨습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “사자”입니다. 아람어 낱말은 “천사” 또는 “사자”를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “왕의 말을 바꾸고”입니다. 문맥상 왕의 명령을 거부하거나 저버렸다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “절하다”입니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 종결 문장을 삭제하고, 목적절을 ‘자기들의 하나님 외에는 어떤 신도 섬기거나 경배하지 않으려 한’으로 명확히 복원했습니다. ‘왕의 말을 바꾸다’라는 어휘의 문자적 표현은 본문의 자연스러운 문맥 번역 ‘왕의 명령을 저버리다’와 각주를 통해 함께 보존했습니다. 또한 천사/사자 및 경배/절하다의 어휘적 여지를 각주에 남겼습니다. 경배 관련 각주 [c]는 본문에 실제 앵커가 필요하므로 ‘경배하지 않으려’ 뒤에 붙여야 합니다.
