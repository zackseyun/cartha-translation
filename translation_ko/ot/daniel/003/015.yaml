  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּעַ֞ן הֵ֧ן אִֽיתֵי/כ֣וֹן עֲתִידִ֗ין דִּ֣י בְ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַשְׁרוֹקִיתָ֣/א קיתרס שַׂבְּכָ֡א פְּסַנְתֵּרִין֩ וְ/סוּמְפֹּ֨נְיָ֜ה וְ/כֹ֣ל זְנֵ֣י זְמָרָ֗/א תִּפְּל֣וּן וְ/תִסְגְּדוּן֮ לְ/צַלְמָ֣/א דִֽי עַבְדֵת֒ וְ/הֵן֙ לָ֣א תִסְגְּד֔וּן בַּ/הּ שַׁעֲתָ֣/ה תִתְרְמ֔וֹן לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּ֑/א וּ/מַן ה֣וּא אֱלָ֔הּ דֵּ֥י יְשֵֽׁיזְבִנְ/כ֖וֹן מִן יְדָֽ/י־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/015.yaml
  text: Now if you are ready[a], when you hear the sound of the horn, pipe, lyre, trigon, harp, and bagpipe, and every kind of music, to fall down and worship the image that I have made, well and good. But if you do not worship, in that very hour you will be thrown into the midst of a blazing furnace of fire[d][c][b]. And who is the god who will deliver you out of my hands?
  footnotes:
  - marker: a
    text: Or 'triangular harp' for 'trigon'; the exact instrument denoted by שַׂבְּכָא is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Traditional renderings often have 'psaltery' for 'harp' (פְּסַנְתֵּרִין).
    reason: lexical_alternative
  - marker: c
    text: Or possibly 'double pipe'; the identification of סוּמְפֹּנְיָה is debated. Older English 'symphony' reflects the form of the word, not a modern orchestra.
    reason: lexical_alternative
  - marker: d
    text: 'The Aramaic is elliptical after ''that I have made''; ''well'' is supplied to complete the sense: if they comply, no punishment follows.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제라도, 여러분이 준비되었고 나팔, 피리, 수금, 트리곤, 하프, 백파이프와 모든 종류의 음악 소리를 들을 때, 엎드려 내가 만든 형상에 경배하면 좋습니다. 그러나 여러분이 경배하지 않으면, 그 즉시 타는 불붙은 풀무 한가운데로 던져질 것입니다. 그러면 나의 손에서 여러분을 건져낼 그 신이 도대체 누구이겠습니까?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 악기명은 정확한 동일시가 불확실합니다. ‘트리곤’은 이 불확실성을 보존하는 음역입니다.
    reason: lexical_alternative
  - marker: b
    text: פְּסַנְתֵּרִין은 전통적으로 ‘psaltery’로 옮기기도 하는 악기명입니다.
    reason: lexical_alternative
  - marker: c
    text: סוּמְפֹּנְיָה의 식별은 논쟁적이며, 영어의 ‘bagpipe’는 가능한 대응 가운데 하나입니다.
    reason: lexical_alternative
  - marker: d
    text: 아람어는 ‘내가 만든’ 뒤에 결과가 생략되어 있습니다. ‘좋습니다’는 그 보완된 뜻을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: כְּעַן
  english_pob_choice: Now
  chosen_korean: 이제라도
  alternatives_korean:
  - 지금
  - 이제
  lexicon: HALOT
  rationale: 왕의 재촉과 압박이 담긴 담화 표지이므로 단순한 시간 부사보다 대결적 뉘앙스를 살린 '이제라도'가 자연스럽습니다.
- source_word: אִיתֵיכון עֲתִידִין
  english_pob_choice: you are ready
  chosen_korean: 여러분이 준비되었고
  alternatives_korean:
  - 여러분이 준비되어 있고
  - 여러분이 준비되었으면
  lexicon: HALOT
  rationale: ‘준비되다/예비되다’의 상태를 살려 즉각적인 순종의 조건으로 옮겼습니다.
- source_word: שַׂבְּכָא
  english_pob_choice: trigon
  chosen_korean: 트리곤
  alternatives_korean:
  - 삼각 수금
  - 트라이곤
  lexicon: HALOT
  rationale: 악기의 정확한 동일시가 불확실하므로, 음역하여 불확실성을 보존했습니다.
- source_word: פְּסַנְתֵּרִין
  english_pob_choice: harp
  chosen_korean: 하프
  alternatives_korean:
  - 수금
  - 거문고
  lexicon: HALOT
  rationale: 영어 POB의 현대적 악기명에 맞추되, 한국어에서 널리 이해되는 현대적 악기명으로 옮겼습니다.
- source_word: סוּמְפֹּנְיָה
  english_pob_choice: bagpipe
  chosen_korean: 백파이프
  alternatives_korean:
  - 주머니피리
  - 더블 파이프
  lexicon: HALOT
  rationale: 정확한 악기 식별이 논쟁적이지만, 현대 한국어에서 가장 직관적으로 대응되는 음역·의미 결합 표현을 택했습니다.
- source_word: תִּפְּלוּן וְתִסְגְּדוּן
  english_pob_choice: to fall down and worship
  chosen_korean: 엎드려 … 경배하면
  alternatives_korean:
  - 엎드려 절하고 경배하면
  - 엎드려 숭배하면
  lexicon: HALOT
  rationale: 물리적 자세와 종교적 행위를 분리해, '엎드리다'는 자세를, '경배하다'는 숭배 행위를 각각 살렸습니다.
- source_word: צַלְמָא
  english_pob_choice: image
  chosen_korean: 형상
  alternatives_korean:
  - 상
  - 우상
  lexicon: HALOT
  rationale: 명사 자체는 중립적이므로, 본문이 요구하는 우상성은 문맥으로 드러내고 단어는 비교적 직접적인 '형상'으로 옮겼습니다.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  english_pob_choice: a blazing furnace of fire
  chosen_korean: 타는 불붙은 풀무
  alternatives_korean:
  - 불타는 불풀무
  - 활활 타는 불의 풀무
  lexicon: HALOT
  rationale: 아람어의 중첩된 불 이미지를 한국어로 자연스럽게 압축하되, '풀무'를 유지해 고유한 형벌 도구의 이미지를 보존했습니다.
- source_word: וּמַן הוּא אֱלָהּ
  english_pob_choice: And what god is there
  chosen_korean: 그러면 … 그 신이 도대체 누구이겠습니까?
  alternatives_korean:
  - 그러면 … 어느 신이겠습니까?
  - 그리고 누가 그 신이겠습니까?
  lexicon: HALOT
  rationale: 느부갓네살의 조롱 섞인 도전이므로 단순 정보 질문이 아니라 반어적 도전으로 드러나게 했습니다.
theological_decisions:
- issue: 삽입 동사로 보완되는 아람어의 생략 구조
  chosen_reading: ‘좋습니다’로 조건 충족 시 처벌이 없음을 보완하되, 원문의 간결한 압박감을 해치지 않도록 짧게 처리했습니다.
  alternative_readings:
  - ‘그러면 아무 일도 없을 것입니다’
  - 명시적 보완 없이 직역
  rationale: 영어 POB가 원문의 생략을 보완한 것처럼, 한국어도 문맥상 필수인 결과를 자연스럽게 드러내야 합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: ‘경배’와 ‘형상’의 우상숭배 문맥
  chosen_reading: ‘경배하다’와 ‘형상’을 유지해, 행위의 종교적 성격을 과도하게 해설하지 않고 본문 자체의 우상숭배 대결을 드러냈습니다.
  alternative_readings:
  - ‘절하다’
  - ‘우상에 절하다’
  rationale: 본문은 단순한 예절 동작이 아니라 배타적 충성의 문제를 다루므로, 행위와 대상이 모두 문맥 속에서 분명해야 합니다.
  doctrine_reference: Translation philosophy §1, §5
