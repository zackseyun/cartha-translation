translation:
  language: ko
  text: 그들이 바벨론 왕 느부갓네살에게 이렇게 대답하여 말했습니다. 「왕이여, 영원히 사십시오!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 직역으로는 ‘왕이여, 여러 시대를 사십시오’이지만, 궁정에서 쓰는 정형화된 축복 인사로서 ‘영원히 사십시오’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ
  english_pob_choice: They answered
  chosen_korean: 그들이 … 대답하여
  alternatives_korean:
  - 그들이 … 응답하여
  - 그들이 … 대답했습니다
  lexicon: HALOT
  rationale: 아람어 답변 সূত্র식에서 첫 동사는 ‘대답하다’가 가장 자연스럽고, 뒤의 ‘말하다’와 함께 표준적인 서술 관용구를 이룹니다.
- source_word: וְאָמְרִין
  english_pob_choice: and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하며
  lexicon: HALOT
  rationale: 이 형태는 이 문맥에서 서술 동사로 기능하므로, 한국어에서는 앞 동사와 겹치지 않게 자연스럽게 ‘말했습니다’로 옮겼습니다.
- source_word: לִנְבוּכַדְנֶצַּר מַלְכָּא
  english_pob_choice: to King Nebuchadnezzar
  chosen_korean: 바벨론 왕 느부갓네살에게
  alternatives_korean:
  - 느부갓네살 왕에게
  - 왕 느부갓네살에게
  lexicon: HALOT
  rationale: 수신자를 분명히 하되, 다니엘서의 문맥상 ‘바벨론 왕’이라는 왕호를 앞세우는 것이 한국어로 가장 자연스럽습니다.
- source_word: מַלְכָּא לְעָלְמִין חֱיִי
  english_pob_choice: O king, live forever!
  chosen_korean: 「왕이여, 영원히 사십시오!」
  alternatives_korean:
  - 「왕이여, 오래 사십시오!」
  - 「왕이여, 영원까지 사십시오!」
  lexicon: HALOT
  rationale: 아람어의 궁정 축복 관용구를 직역하기보다, 한국어에서 동일한 공적 경어 축원으로 기능하는 ‘영원히 사십시오’가 의미와 격식을 함께 살립니다.
theological_decisions:
- issue: 궁정 인사말의 종말론적 의미
  chosen_reading: 이 구절의 ‘영원히 사십시오’는 실제 무한 생존을 요청한다기보다 왕에게 드리는 정형화된 충성·축복의 관용구로 읽었습니다.
  alternative_readings:
  - 문자적으로 ‘영원까지 사십시오’로 이해
  - 단순한 과장된 예우 표현으로만 축소
  rationale: 영어 POB 주석이 밝히듯이 이 표현은 표준 궁정 호칭이므로, 한국어도 그 관용성을 드러내되 의미를 과도하게 약화하지 않았습니다.
  doctrine_reference: 고대 근동 궁정 인사 관용구
