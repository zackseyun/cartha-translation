id: DAN.3.3
reference: Daniel 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן מִֽתְכַּנְּשִׁ֡ין אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ֣/א גְדָבְרַיָּ/א֩ דְּתָ֨בְרַיָּ֜/א תִּפְתָּיֵ֗/א וְ/כֹל֙ שִׁלְטֹנֵ֣י מְדִֽינָתָ֔/א לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֣ר מַלְכָּ֑/א ו/קאמין לָ/קֳבֵ֣ל צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/003.yaml
  text: Then the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces were assembled for the dedication of the image that King Nebuchadnezzar had set up, and they stood before the image that Nebuchadnezzar had set up.
  footnotes:
  - marker: a
    text: Or 'statue' for 'image' (Aramaic צַלְמָא); the term can denote a physical image or monumental figure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 총독들과 행정관들과 총리들과 재무관들과 재판관들과 법관들과 모든 지방 관원들이, 느부갓네살 왕이 세운 그 형상의 봉헌식을 위해 모였고, 그들은 느부갓네살이 세운 그 형상 앞에 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형상’(아람어 צַלְמָא)은 물리적 이미지나 기념비적 조형물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּ/אדַ֡יִן מִֽתְכַּנְּשִׁ֡ין
  english_pob_choice: Then ... were assembled
  chosen_korean: 그때에 ... 모였고
  alternatives_korean:
  - 그때에 ... 집결했고
  - 그리하여 ... 모였고
  lexicon: HALOT
  rationale: 아람어 담화 표지와 집합 동사를 자연스러운 현대 한국어 서술로 옮기되, 공적 행사에 맞는 집합의 느낌을 살리기 위해 ‘모였고’를 택했습니다.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא / סִגְנַיָּא / וּפַחֲוָתָא / אֲדַרְגָּזְרַיָּא / גְדָבְרַיָּא / דְּתָבְרַיָּא / תִּפְתָּיֵא
  english_pob_choice: the satraps, the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates
  chosen_korean: 총독들과 행정관들과 총리들과 재무관들과 재판관들과 법관들과
  alternatives_korean:
  - 사트라프들과 대리관들과 지방장관들과 자문관들과 금고관들과 판관들과 집정관들과
  - 지방 총독들과 부총독들과 관리들과 조언자들과 재정관들과 재판관들과 법관들과
  lexicon: HALOT
  rationale: 각 관직명을 지나치게 일반화하지 않고, 영어 POB의 관료 목록에 대응하는 한국어 행정 용어로 옮겼습니다. 다만 한국어 독자가 바로 이해할 수 있도록 기존 교회용 음역보다 뜻 중심 표현을 우선했습니다.
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  english_pob_choice: all the officials of the provinces
  chosen_korean: 모든 지방 관원들
  alternatives_korean:
  - 모든 지방 통치자들
  - 모든 지방의 관료들
  lexicon: HALOT
  rationale: 앞의 열거를 포괄하는 총괄 구문이므로, ‘관원들’로 넓게 묶어 행정적 성격을 유지했습니다.
- source_word: לַחֲנֻכַּת
  english_pob_choice: for the dedication of
  chosen_korean: 봉헌식을 위해
  alternatives_korean:
  - 헌당식을 위해
  - 봉헌을 위해
  lexicon: HALOT
  rationale: 성전 용어에만 갇히지 않는 일반적 헌납/봉헌 의미를 살려 ‘봉헌식’을 택했고, 공적 의례라는 뉘앙스를 반영했습니다.
- source_word: צַלְמָא
  english_pob_choice: image
  chosen_korean: 형상
  alternatives_korean:
  - 우상
  - 상
  - 조형물
  lexicon: HALOT
  rationale: 이 단어는 단순한 ‘상’보다 제의적·기념비적 대상을 넓게 가리킬 수 있어, 우상 숭배의 함의를 드러내면서도 원어의 폭을 보존하는 ‘형상’을 선택했습니다.
- source_word: הֲקֵים
  english_pob_choice: had set up
  chosen_korean: 세운
  alternatives_korean:
  - 세워 둔
  - 세워 놓은
  lexicon: HALOT
  rationale: 반복되는 동작 완료를 한국어 관형형으로 간결하게 처리했습니다.
- source_word: וְקָאמִין לָקֳבֵל
  english_pob_choice: and they stood before
  chosen_korean: 앞에 서 있었습니다
  alternatives_korean:
  - 앞에 서 있었습니다
  - 마주 서 있었습니다
  lexicon: HALOT
  rationale: 의례적 배치와 정면 대치를 드러내기 위해 ‘앞에 서 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: צַלְמָא의 의미를 ‘형상’으로 둘지 ‘우상’으로 둘지
  chosen_reading: 본문의 기본 의미를 살려 ‘형상’으로 번역하고, 해석적 판단인 ‘우상’은 본문 자체에 넣지 않았습니다.
  alternative_readings:
  - 우상
  - 상
  - 조형물
  rationale: 이 절은 아직 대상을 평가하지 않고 단지 왕이 세운 대상의 봉헌식과 그 앞의 집결을 서술하므로, 독자가 뒤의 문맥에서 우상성 판단을 하도록 여지를 남기는 편이 원문에 가깝습니다.
  doctrine_reference: 문맥 우선 원칙; 서술 텍스트의 의미 범위 보존
- issue: ‘봉헌식’의 예배적 뉘앙스
  chosen_reading: ‘봉헌식’으로 옮겨 공적 의례성과 헌납의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 헌당식
  - 봉헌
  rationale: 히브리/아람어 חנכה 계열은 단순 설치가 아니라 공식적 헌정 의례를 가리키므로, 한국어에서도 의례성을 드러내되 과도하게 성전 전용으로 좁히지 않도록 했습니다.
  doctrine_reference: 의례/헌정 의미론
