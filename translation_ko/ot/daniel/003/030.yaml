source:
  edition: WLC
  text: בֵּ/אדַ֣יִן מַלְכָּ֗/א הַצְלַ֛ח לְ/שַׁדְרַ֥ךְ מֵישַׁ֛ךְ וַ/עֲבֵ֥ד נְג֖וֹ בִּ/מְדִינַ֥ת בָּבֶֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/030.yaml
  text: Then the king caused Shadrach[a], Meshach, and Abednego to prosper in the province of Babylon.
  footnotes:
  - marker: a
    text: Or, 'promoted Shadrach, Meshach, and Abednego in the province of Babylon.' The Aramaic verb can denote making someone prosper or succeed, which in this context may include official advancement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 왕은 사드락, 메삭, 아벳느고를 바벨론 지방에서 성공하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사드락, 메삭, 아벳느고를 바벨론 지방에서 승진시켰다.’ 이 아람어 동사는 누군가를 성공하게 하거나 잘되게 만든다는 뜻을 지니며, 이 문맥에서는 공식적인 승진을 포함할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그 후에
  - 이때에
  lexicon: HALOT
  rationale: 앞선 사건의 결과를 이어 주는 담화 표지를 자연스러운 현대 한국어로 살리면서, 서술의 시간 순서를 분명히 했습니다.
- source_word: מַלְכָּא
  english_pob_choice: the king
  chosen_korean: 왕은
  alternatives_korean:
  - 그 왕은
  - 임금은
  lexicon: HALOT
  rationale: 원문은 특정 이름을 반복하지 않고 ‘왕’이라고만 하므로, 이를 그대로 살려 문맥상 느부갓네살 왕을 독자가 파악하게 했습니다.
- source_word: הַצְלַח
  english_pob_choice: caused ... to prosper
  chosen_korean: 번성하게 하였습니다
  alternatives_korean:
  - 형통하게 하였습니다
  - 성공하게 하였습니다
  - 승진시켰습니다
  lexicon: HALOT
  rationale: 동사는 사람을 ‘형통/성공’하게 하거나 번성하게 만드는 뜻을 가지며, 문맥상 행정적 승진 가능성도 있지만 원문의 더 넓은 의미를 보존하기 위해 ‘번성하게 하다’를 택했습니다.
- source_word: בִּמְדִינַת בָּבֶל
  english_pob_choice: in the province of Babylon
  chosen_korean: 바벨론 지방에서
  alternatives_korean:
  - 바벨론의 도에서
  - 바벨론 속주에서
  lexicon: HALOT
  rationale: מְדִינָה는 행정 구획인 ‘지방/속주’를 가리키므로, 당시 제국 행정의 느낌을 유지하면서도 현대 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: הַצְלַח의 의미 범위가 ‘번성’과 ‘승진’ 사이에서 흔들림
  chosen_reading: 본문은 왕이 세 사람을 잘되게 하거나 번성하게 한 결과를 말하며, 행정적 승진은 가능한 함의이지만 본문 자체는 그것을 명시하지 않습니다.
  alternative_readings:
  - ‘승진시켰습니다’로 구체화
  - ‘형통하게 하였습니다’로 더 일반화
  rationale: 영어 POB 주석도 이 동사가 ‘prosper’ 또는 ‘promote’가 될 수 있음을 인정하므로, 한국어 본문은 더 넓은 의미를 유지하고 그 가능성은 주석 취지로 남겨 두었습니다.
  doctrine_reference: 문맥 우선의 번역 원칙
