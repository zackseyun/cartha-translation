  text: וּ/מִ/נִּי֮ שִׂ֣ים טְעֵם֒ דִּי֩ כָל עַ֨ם אֻמָּ֜ה וְ/לִשָּׁ֗ן דִּֽי יֵאמַ֤ר שלה עַ֣ל אֱלָהֲ/ה֗וֹן דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹא הַדָּמִ֣ין יִתְעֲבֵ֔ד וּ/בַיְתֵ֖/הּ נְוָלִ֣י יִשְׁתַּוֵּ֑ה כָּ/ל קֳבֵ֗ל דִּ֣י לָ֤א אִיתַי֙ אֱלָ֣ה אָחֳרָ֔ן דִּֽי יִכֻּ֥ל לְ/הַצָּלָ֖ה כִּ/דְנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/029.yaml
  text: 'And from me a decree is issued: any people[a], nation, or language that speaks anything offensive against the God of Shadrach, Meshach, and Abed-nego shall be torn limb from limb, and his house shall be made a ruin[c][b], because there is no other god who is able to deliver like this.'
  footnotes:
  - marker: a
    text: Or 'utters blasphemy against' the God of Shadrach, Meshach, and Abed-nego.
    reason: lexical_alternative
  - marker: b
    text: Or 'shall be made into pieces' / 'shall be dismembered.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his house shall be made a dunghill,' a traditional rendering of the Aramaic phrase for reducing a house to a disgraceful ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 칙령을 내립니다. 어느 백성, 민족, 언어에 속한 사람이든지 사드락과 메삭과 아벳느고의 하나님을 향하여 모독적인 말을 하면[a], 그 사람은 갈기갈기 찢길 것이며[b], 그의 집은 폐허가 될 것입니다[c]. 이처럼 구원할 수 있는 다른 신은 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사드락과 메삭과 아벳느고의 하나님을 거슬러 부당한 말을 하면’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘토막토막 나게 될 것이며’ 또는 ‘사지가 찢길 것이며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 집은 거름더미가 될 것입니다’로 옮길 수 있습니다. 이 아람어 표현은 집을 수치스러운 폐허로 만드는 것을 뜻하는 관용구로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  english_pob_choice: a decree is issued
  chosen_korean: 나로 말미암아 한 조서가 내리노니
  alternatives_korean:
  - 내가 한 조서를 내리노니
  - 한 조서가 반포되노니
  lexicon: HALOT
  rationale: 아람어 관용구의 왕실 선포를 자연스러운 현대 한국어 공문체로 옮기되, 주체가 왕에게서 나온다는 점을 살리기 위해 ‘나로 말미암아’와 ‘조서’를 택했습니다.
- source_word: כָל עַם אֻמָּה וְלִשָּׁן
  english_pob_choice: people, nation, or language
  chosen_korean: 어떤 백성이나 나라나 언어든지
  alternatives_korean:
  - 백성, 나라, 또는 언어
  - 어떤 백성이든지, 어떤 나라든지, 어떤 언어든지
  lexicon: HALOT
  rationale: 제국 전반을 가리키는 삼중 병렬을 한국어에서도 병렬 구조로 유지했고, ‘언어’를 ‘혀’보다 명료하게 옮겼습니다.
- source_word: יֵאמַר שלה עַל
  english_pob_choice: speaks anything offensive against
  chosen_korean: 무슨 모독적인 말을 하거든
  alternatives_korean:
  - 무엇이든지 그들을 향해 모독을 말하거든
  - 신성모독을 하거든
  lexicon: HALOT
  rationale: 원문의 שלה는 단순한 반대 발화가 아니라 하나님을 향한 공격적·모독적 발화를 가리키므로, 기술적 용어 ‘신성모독’보다 의미를 직접 드러내는 표현을 택했습니다.
- source_word: הַדָּמִין יִתְעֲבֵד
  english_pob_choice: shall be torn limb from limb
  chosen_korean: 그 몸을 토막내고
  alternatives_korean:
  - 사지로 찢고
  - 토막토막 내고
  lexicon: HALOT
  rationale: 원문의 가혹한 사법형을 현대 한국어에서 과장 없이 강하게 전달하도록 ‘토막내다’로 옮겼습니다.
- source_word: נְוָלִי יִשְׁתַּוֵּה
  english_pob_choice: shall be made a ruin
  chosen_korean: 그의 집을 폐허로 삼을지니
  alternatives_korean:
  - 그의 집을 황폐하게 할지니
  - 그의 집을 거름더미로 만들지니
  lexicon: HALOT
  rationale: 본문의 핵심은 집을 수치스러운 폐허로 전락시키는 데 있으므로, 주석적 뉘앙스를 본문에서 과도하게 고정하지 않는 ‘폐허’로 처리했습니다.
- source_word: לָא אִיתַי אֱלָה אָחֳרָן דִּי יִכֻּל לְהַצָּלָה כִּדְנָה
  english_pob_choice: because there is no other god who is able to deliver like this
  chosen_korean: 이는 이와 같이 구원하실 수 있는 다른 신이 없기 때문이니라
  alternatives_korean:
  - 이는 이와 같이 구원할 다른 신이 없기 때문이니라
  - 이는 이와 같이 구원하실 수 있는 다른 하나님이 없기 때문이니라
  lexicon: HALOT
  rationale: 네부갓네살의 발화 자체를 따라 ‘다른 신’으로 두되, 이 문맥의 능력 강조를 ‘구원하실 수 있는’으로 살렸습니다.
theological_decisions:
- issue: 네부갓네살의 하나님 인식의 범위
  chosen_reading: 본문이 말하는 것은 ‘이와 같이 구원하실 수 있는 다른 신이 없음’이지, 완전한 단일신 신앙의 고백을 본문 밖에서 완성하는 것이 아닙니다.
  alternative_readings:
  - 다른 신은 전혀 없다
  - 그분만이 참 하나님이시다
  rationale: 원문의 논지는 이 사건에서 드러난 야훼의 구원 능력의 유일성에 있으며, 그 이상으로 신학적 결론을 확장하면 본문의 긴장을 지워 버릴 수 있습니다.
  doctrine_reference: 본문의 범위를 넘어서는 교리적 확장을 피함
