  terminology: ‘조서’, ‘사드락, 메삭, 아벳느고’, ‘하나님’, ‘다른 신’은 적절합니다. ‘하나님’은 세 사람의 하나님을 지칭하고, 왕의 비교 진술에서는 원문의 일반명사에 맞추어 ‘다른 신’으로 유지했습니다.
