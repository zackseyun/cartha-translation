    issue: 문체가 합쇼체가 아니라 종결법이 혼재됨
    rationale: ‘내리노니/하거든/삼을지니/이니라’는 현대 formal-polite 합쇼체가 아닙니다. 과업의 지정 변종에 맞춰 ‘내립니다/하면/될 것이며/때문입니다’로 통일하는 것이 안전합니다.
