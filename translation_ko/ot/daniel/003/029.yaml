  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 칙령적 수동형 처벌 표현은 ‘그 몸을 토막내고’보다 ‘갈기갈기 찢길 것이며’처럼 옮기는 편이 더 정확하고 자연스럽습니다. ‘이와 같이 구원하실 수 있는 다른 신’이라는 제한된 비교 진술도 유지해야 합니다.
