  text: And the herald cried aloud[a], “To you it is proclaimed, O peoples, nations[b], and languages:”
  footnotes:
  - marker: a
    text: Or 'with might' / 'with a loud voice.' The Aramaic expression literally refers to strength, here describing the force or volume of the herald's cry.
    reason: lexical_alternative
  - marker: b
    text: Aramaic 'they are saying' functions here as an impersonal official formula; hence 'it is proclaimed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 전령이 큰 소리로 외쳤습니다[a]. “백성들과 나라들과 언어들아, 너희에게 선포합니다[b]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힘 있게’, ‘큰 소리로’. 아람어 표현은 문자적으로 ‘힘으로’를 뜻하며, 여기서는 전령의 외침의 세기나 음량을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어의 ‘그들이 말한다’는 여기서 비인칭적 공식 문구로 기능하므로, ‘선포합니다’로 옮겼습니다.
    reason: lexical_alternative
