language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָרוֹזָ֖/א קָרֵ֣א בְ/חָ֑יִל לְ/כ֤וֹן אָֽמְרִין֙ עַֽמְמַיָּ֔/א אֻמַּיָּ֖/א וְ/לִשָּׁנַיָּֽ/א׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/004.yaml
  text: And the herald cried aloud[a], “To you it is proclaimed, O peoples, nations[b], and languages:”
  footnotes:
  - marker: a
    text: Or 'with might' / 'with a loud voice.' The Aramaic expression literally refers to strength, here describing the force or volume of the herald's cry.
    reason: lexical_alternative
  - marker: b
    text: Aramaic 'they are saying' functions here as an impersonal official formula; hence 'it is proclaimed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 전령이 크게 외쳤습니다[a]. 「너희에게 선포합니다. 오 백성들, 나라들, 언어들[b]:」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힘 있게’, ‘큰 소리로’. 아람어 표현은 문자적으로 ‘힘으로’를 뜻하며, 여기서는 전령의 외침의 세기나 음량을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어의 ‘그들이 말한다’는 여기서 비인칭적 공식 문구로 기능하므로, ‘선포합니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרוֹזָא
  english_pob_choice: the herald
  chosen_korean: 전령
  alternatives_korean:
  - 알리는 자
  - 선포자
  lexicon: HALOT
  rationale: 공적인 궁정 선포자라는 역할을 살리기 위해 일반적이면서도 공식적인 ‘전령’을 택했습니다.
- source_word: קָרֵא בְחָיִל
  english_pob_choice: cried aloud
  chosen_korean: 크게 외쳤습니다
  alternatives_korean:
  - 큰 소리로 외쳤습니다
  - 힘 있게 외쳤습니다
  lexicon: HALOT
  rationale: 직역하면 ‘힘으로/힘 있게’이지만, 이 관용구는 소리의 크기와 공개성을 가리키므로 자연스러운 한국어로 옮겼습니다.
- source_word: לְכוֹן אָמְרִין
  english_pob_choice: To you it is proclaimed
  chosen_korean: 너희에게 선포합니다
  alternatives_korean:
  - 너희에게 말합니다
  - 너희에게 전합니다
  lexicon: HALOT
  rationale: 직역의 비인칭 공식문을 한국어 공문체에 맞는 ‘선포합니다’로 옮겨, 선언의 공적 성격을 드러냈습니다.
- source_word: עַמְמַיָּא / אֻמַּיָּא / לִשָּׁנַיָּא
  english_pob_choice: peoples, nations, and languages
  chosen_korean: 백성들, 나라들, 언어들
  alternatives_korean:
  - 민족들, 나라들, 언어들
  - 백성들, 민족들, 언어들
  lexicon: HALOT
  rationale: 세 낱말의 병렬을 유지하되, 첫 두 항목의 미묘한 중복과 구별을 살리기 위해 ‘백성들, 나라들, 언어들’로 옮겼습니다.
theological_decisions:
- issue: 호격의 직접 호소를 한국어에서 어떻게 드러낼지
  chosen_reading: 「오 백성들, 나라들, 언어들」처럼 감탄사 ‘오’를 유지해 공개적 호소의 어조를 살렸습니다.
  alternative_readings:
  - 감탄사를 생략하고 단순 나열로 옮김
  - ‘아’로 번역
  rationale: 원문과 영어 POB가 모두 호격적 부름을 보존하므로, 한국어에서도 공적인 호소의 힘을 약화시키지 않도록 했습니다.
  doctrine_reference: 수사적 호격의 보존
