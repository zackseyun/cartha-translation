  to: 그때에 느부갓네살은 격분으로 가득 차서, 그의 얼굴빛이 사드락과 메삭과 아벳느고를 향해 변했습니다. 그는 대답하여 말했습니다. “풀무를 평소의 일곱 배가 되도록 달구어라.”[a]
