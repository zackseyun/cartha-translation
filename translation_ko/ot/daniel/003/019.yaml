  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
  footnotes:
  - marker: a
    text: Or, 'sevenfold.' The Aramaic expression denotes heating the furnace to seven times its normal intensity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 느부갓네살은 격분으로 가득 차서, 그의 얼굴빛이 사드락과 메삭과 아벳느고를 향해 변했습니다. 그는 대답하여 말했습니다. “풀무를 평소의 일곱 배가 되도록 달구어라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱 배로.’ 아람어 표현은 풀무를 보통 달구는 정도의 일곱 배로 가열하라는 뜻입니다.
    reason: lexical_alternative
