base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
  footnotes:
  - marker: a
    text: Or, 'sevenfold.' The Aramaic expression denotes heating the furnace to seven times its normal intensity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 느부갓네살은 격분으로 가득 차서 그의 얼굴빛이 사드락과 메삭과 아벳느고를 향해 변했습니다. 그리고 그는 대답하며 말하기를, 풀무를 평소보다 일곱 배 더 뜨겁게 달구라고 명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘일곱 배’는 단순한 숫자 계산이라기보다, 풀무의 열기를 관용적으로 극대화하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그리하여
  - 그때
  lexicon: HALOT
  rationale: 아람어 담화 표지로서 사건의 순서를 여는 기능을 살려, 자연스러운 서술형 한국어인 ‘그때에’로 옮겼습니다.
- source_word: הִתְמְלִי חֱמָא
  english_pob_choice: was filled with fury
  chosen_korean: 격분으로 가득 차서
  alternatives_korean:
  - 분노로 가득 차서
  - 격노하여
  lexicon: HALOT
  rationale: ‘가득 차다’의 충만 이미지를 살리면서, חֱמָא의 강한 분노를 ‘격분’으로 옮겨 강도를 유지했습니다.
- source_word: וּצְלֵם אַנְפּוֹהִי אשתנו
  english_pob_choice: the expression of his face was changed
  chosen_korean: 그의 얼굴빛이 … 변했습니다
  alternatives_korean:
  - 그의 얼굴 표정이 변했습니다
  - 그의 얼굴 모습이 변했습니다
  lexicon: HALOT
  rationale: 직역의 ‘얼굴의 형상/모습’보다 한국어 관용에 맞는 ‘얼굴빛’이 원문의 가시적 표정 변화를 더 자연스럽게 전달합니다.
- source_word: עַל דִּי חֲזֵה לְמֵזְיֵהּ
  english_pob_choice: more than it was usually heated
  chosen_korean: 평소보다 일곱 배 더 뜨겁게
  alternatives_korean:
  - 일곱 배 더
  - 평상시보다 일곱 배나 더
  lexicon: HALOT
  rationale: 아람어 관용의 ‘일곱 배’는 단순 배수 이상으로 강한 증폭을 뜻하므로, 문맥상 ‘평소보다’로 기준점을 드러냈습니다.
theological_decisions:
