  chosen_reading: 감정의 폭발과 즉각적인 폭력적 조치의 지시를 있는 그대로 드러냈습니다.
  alternative_readings:
  - ‘노하여’처럼 완화하기
  - ‘화를 내며’로 중립화하기
  rationale: 본문은 단순한 짜증이 아니라 폭발적 분노와 적대적 행동을 보여 주므로, 이를 약화하지 않고 서술했습니다.
  doctrine_reference: 본문 서술 신학(내러티브의 감정·행동 묘사)
