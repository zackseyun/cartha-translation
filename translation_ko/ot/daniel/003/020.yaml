  source_fidelity: 아람어 원문은 왕이 자신의 군대에 속한 용맹한 사람들에게 세 사람을 묶어 불타는 풀무 속으로 던지라고 명령한 내용을 담고 있습니다. 번역은 간접 목적어, 군사적 수식, 결박과 투척의 두 부정사, 그리고 ‘불/타오름/풀무’의 요소를 충실히 반영합니다. 한국어의 ‘풀무 속에 던지라’는 이동의 도착점을 자연스럽게 나타내므로 원문의 ‘속으로’ 의미도 보존합니다.
