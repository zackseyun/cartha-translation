id: DAN.3.20
reference: Daniel 3:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/גֻבְרִ֤ין גִּבָּֽרֵי חַ֨יִל֙ דִּ֣י בְ/חַיְלֵ֔/הּ אֲמַר֙ לְ/כַפָּתָ֔ה לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לְ/מִרְמֵ֕א לְ/אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/020.yaml
  text: And he commanded certain mighty men of valor who were in his army to bind Shadrach[a], Meshach, and Abednego, to throw them into the blazing furnace of fire.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'into the burning fiery furnace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기 군대에 있던 용맹한 몇 사람에게 사드락, 메삭, 아벳느고를 묶어, 타오르는 불의 풀무 속에 던지라고 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘불타는 불의 풀무 속으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגֻבְרִין
  english_pob_choice: certain mighty men of valor
  chosen_korean: 용맹한 몇 사람
  alternatives_korean:
  - 몇몇 용사
  - 용감한 군인들
  - 몇 사람의 용사
  lexicon: HALOT
  rationale: 명령의 직접 목적어를 한국어에서 자연스럽게 풀어 주되, 뒤의 군사적 표현을 살려 '용맹한'으로 강한 전투 인상을 반영했습니다.
- source_word: גִּבָּרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한
  alternatives_korean:
  - 용사다운
  - 강한
  - 용감한
  lexicon: HALOT
  rationale: 이 관용구는 단순한 힘보다 전투적 유능함과 용기를 함께 가리키므로, '용맹한'이 가장 간결하게 대응합니다.
- source_word: דִּי בְחַיְלֵהּ
  english_pob_choice: who were in his army
  chosen_korean: 자기 군대에 있던
  alternatives_korean:
  - 자기 군대에 속한
  - 그의 군대에 속해 있던
  - 그의 군대 안에 있던
  lexicon: HALOT
  rationale: חיל은 여기서 추상적 '힘'이 아니라 군사 집단을 뜻하므로, 현대 한국어에서는 '군대'가 가장 분명합니다.
- source_word: לְמִרְמֵא
  english_pob_choice: to throw
  chosen_korean: 던지라고
  alternatives_korean:
  - 내던지라고
  - 집어던지라고
  - 던져 넣으라고
  lexicon: HALOT
  rationale: 불길한 처형 행위를 자연스럽게 살리면서도, 문장 흐름상 명령형의 간접화법으로 옮겼습니다.
- source_word: לְאַתּוּן נוּרָא יָקִדְתָּא
  english_pob_choice: into the blazing furnace of fire
  chosen_korean: 타오르는 불의 풀무 속에
  alternatives_korean:
  - 불타는 불의 풀무 속에
  - 타는 불의 용광로 속에
  - 타오르는 화덕 속에
  lexicon: HALOT
  rationale: אַתּוּן은 '풀무/화덕'이지만, 본문은 매우 뜨거운 처형용 용기를 가리키므로 전통적 '풀무'를 유지하되 '타오르는 불'로 세 요소를 살렸습니다.
theological_decisions:
- issue: 형벌 도구의 표현 강도
  chosen_reading: '''타오르는 불의 풀무''로 옮겨 단순한 난로가 아니라 처형용 화덕의 위협성을 분명히 드러냈습니다.'
  alternative_readings:
  - '''불타는 풀무'''
  - '''불붙은 화덕'''
  rationale: 문맥은 왕의 폭력적 처형 명령이므로, 장치의 위험성과 공포를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 본문 문맥 보존 원칙
