id: DAN.3.11
reference: Daniel 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַן דִּי לָ֥א יִפֵּ֖ל וְ/יִסְגֻּ֑ד יִתְרְמֵ֕א לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/011.yaml
  text: And whoever does not fall down and worship shall be thrown into the midst of a furnace of blazing fire[a].
  footnotes:
  - marker: a
    text: Or, more formally, 'shall be cast into the midst of a burning fiery furnace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 엎드려 절하지 않는 사람은 타오르는 불의 풀무 가운데에 던져질 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하면, '타오르는 불의 풀무 한가운데에 던져질 것입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  english_pob_choice: And whoever
  chosen_korean: 그리고 누구든지
  alternatives_korean:
  - 그리고 누구나
  - 그리고 어떤 사람이든지
  lexicon: HALOT
  rationale: 아람어의 일반적 조건문을 한국어의 포괄적 표현으로 옮겼고, 앞선 칙령의 진행을 살려 접속사 '그리고'를 유지했습니다.
- source_word: יִפֵּל וְיִסְגֻּד
  english_pob_choice: does not fall down and worship
  chosen_korean: 엎드려 절하지 않는
  alternatives_korean:
  - 엎드려 경배하지 않는
  - 무릎 꿇어 절하지 않는
  lexicon: HALOT
  rationale: 두 동사는 몸을 굽혀 경배하는 행위를 가리키므로, 한국어에서는 자연스럽고 중의적이지 않은 '엎드려 절하다'로 묶어 옮겼습니다.
- source_word: יִתְרְמֵא לְגוֹא
  english_pob_choice: shall be thrown into the midst of
  chosen_korean: 가운데에 던져질 것입니다
  alternatives_korean:
  - 한가운데로 던져질 것입니다
  - 속으로 던져질 것입니다
  lexicon: HALOT
  rationale: 법령 문맥의 수동형 처벌 선언을 살려 '던져질 것입니다'로 옮겼고, לְגוֹא의 공간적 강조는 '가운데에'로 표현했습니다.
- source_word: נוּרָא יָקִדְתָּא
  english_pob_choice: a furnace of blazing fire
  chosen_korean: 타오르는 불의 풀무
  alternatives_korean:
  - 불타는 불의 풀무
  - 활활 타는 풀무
  lexicon: HALOT
  rationale: ‘풀무’는 전통적이면서도 문맥에 맞는 용어이며, 문서화된 강조점인 ‘blazing fire’에 따라 נוּרָא יָקִדְתָּא를 '타오르는 불'로 옮겼습니다.
theological_decisions:
- issue: 공적 칙령의 경고 형식
  chosen_reading: 미래형 선언으로 처리하되, 한국어에서는 공적 판결문의 어조를 살려 '던져질 것입니다'로 옮겼습니다.
  alternative_readings:
  - '''던질 것입니다''로 단순 미래화'
  - '''던져야 합니다''로 명령화'
  rationale: 문맥은 예언이 아니라 왕의 법령이므로, 처벌이 확정된 선언이라는 성격을 드러내는 표현이 적절합니다.
  doctrine_reference: Daniel 3:11의 왕령 문맥
- issue: 경배 동작의 종교적 함의
  chosen_reading: '''절하다''를 사용하되 단순한 예절이 아니라 우상 앞의 경배 행위로 이해되도록 구성했습니다.'
  alternative_readings:
  - '''예배하다'''
  - '''경배하다'''
  rationale: 히브리/아람어의 몸을 굽혀 경배하는 동작과 우상숭배의 의미를 함께 드러내려면, 일상적 동작과 종교적 함의가 모두 살아 있는 표현이 필요합니다.
  doctrine_reference: 우상 숭배 금지의 서술 문맥
