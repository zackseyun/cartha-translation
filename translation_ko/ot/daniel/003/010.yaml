  to: 왕이여, 왕께서는 나팔과 피리와 수금과 삼현금과 양금과 백파이프[a]와 온갖 음악 소리를 듣는 모든 사람이 엎드려 금 신상에게 경배해야 한다는 칙령을 내리셨습니다.
  rationale: 누락된 여섯 번째 악기를 복원하고, 원문의 ‘온갖 종류의 음악’을 그대로 반영했습니다. ‘금 신상’과 ‘엎드려 … 경배하다’는 조각상과 그에 대한 강제적 숭배라는 본문의 의미를 자연스러운 현대 한국어로 보존합니다. 영어 감사 기록의 각주 표지는 본문 단어와 내용이 서로 맞지 않으므로, 한국어 본문에서는 실제로 불확실한 악기명에만 각주를 연결했습니다.
