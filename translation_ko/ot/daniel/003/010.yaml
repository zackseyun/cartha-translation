id: DAN.3.10
reference: Daniel 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אנתה מַלְכָּ/א֮ שָׂ֣מְתָּ טְּעֵם֒ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִשְׁמַ֡ע קָ֣ל קַרְנָ֣/א מַ֠שְׁרֹקִיתָ/א קיתרס שַׂבְּכָ֤א פְסַנְתֵּרִין֙ ו/סיפניה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א יִפֵּ֥ל וְ/יִסְגֻּ֖ד לְ/צֶ֥לֶם דַּהֲבָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/010.yaml
  text: You[a], O king, have issued a decree that every man who hears the sound of the horn, pipe, lyre[b], trigon, psaltery, and bagpipe, and every kind of music, must fall down and worship the golden image.
  footnotes:
  - marker: a
    text: Or 'double pipe' for 'bagpipe'; the exact identification of the Aramaic instrument name is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'everyone' / 'every person'; the Aramaic uses a masculine singular form with generic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이여, 왕께서는 나팔과 피리와 수금과 삼현금과 양금과 백파이프[a]와 온갖 음악 소리를 듣는 모든 사람이 엎드려 금 신상에게 경배해야 한다는 칙령을 내리셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이중 피리’. 아람어 악기명의 정확한 식별은 불확실합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה מַלְכָּא
  english_pob_choice: You, O king
  chosen_korean: 왕이여
  alternatives_korean:
  - 임금님이여
  - 왕님이여
  lexicon: HALOT
  rationale: 직접 호칭의 화용론을 살리기 위해 호격을 두었고, 합쇼체 문맥에 맞게 간결하게 옮겼습니다.
- source_word: שָׂמְתָּ טְּעֵם
  english_pob_choice: have issued a decree
  chosen_korean: 한 명령을 내리셨습니다
  alternatives_korean:
  - 칙령을 내리셨습니다
  - 법령을 반포하셨습니다
  lexicon: HALOT
  rationale: 직역의 ‘세우다’보다 한국어 법률 문맥에서 자연스럽고, 왕의 공적 명령이라는 의미를 보존합니다.
- source_word: וְיִסְגֻּד
  english_pob_choice: worship
  chosen_korean: 절해야 합니다
  alternatives_korean:
  - 경배해야 합니다
  - 숭배해야 합니다
  lexicon: HALOT
  rationale: 이 절은 우상 앞의 몸을 굽히는 행위를 가리키므로, 한국어에서 본문상 물리적 동작과 종교적 예속을 함께 드러내는 ‘절하다’를 택했습니다.
- source_word: לְצֶלֶם דַּהֲבָא
  english_pob_choice: the golden image
  chosen_korean: 그 금상
  alternatives_korean:
  - 그 금으로 된 우상
  - 그 황금상
  lexicon: HALOT
  rationale: ‘image’의 조각상/우상적 대상을 살리면서, 본문 맥락상 금으로 만든 상이라는 점을 분명히 했습니다.
theological_decisions:
- issue: עובד 우상 숭배의 행위 표현
  chosen_reading: ‘엎드려 … 절하다’로 몸의 동작과 숭배 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘엎드려 경배하다’
  - ‘엎드려 예배하다’
  rationale: 본문은 단순한 예의가 아니라 우상에게 강제되는 종교적 복종을 말하므로, 한국어에서도 행위성과 종교성을 동시에 보이도록 했습니다.
  doctrine_reference: Translation philosophy 1, 3
- issue: 아람어 عام성 표현 כָל אֱנָשׁ
  chosen_reading: ‘누구든지’로 옮겨 일반성을 살렸습니다.
  alternative_readings:
  - ‘모든 사람’
  - ‘모든 남자’
  rationale: 문법상 남성 단수이지만 문맥상 일반적 포괄을 나타내므로, 한국어에서는 자연스러운 포괄 표현을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
