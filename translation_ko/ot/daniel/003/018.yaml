revisions:
- from: 하지만 그렇지 않더라도, 왕이시여, 우리가 왕의 신들을 섬기지 않을 것이며, 왕께서 세우신 저 금으로 된 형상에도 절하지 않을 것을 아시기 바랍니다.[a]
