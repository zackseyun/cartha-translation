  rationale: 문두 조건절을 ‘그러나 그렇지 않다면’으로 고쳐 원문의 짧고 생략적인 조건을 보존하고, 양보적 독법은 각주로 처리했습니다. 원문에 없는 ‘저’를 삭제했으며, 각주 표지를 관련 조건절 바로 뒤로 옮겼습니다. 나머지 문장은 원문의 단호한 거부 선언과 현대 합쇼체의 격식을 유지합니다.
