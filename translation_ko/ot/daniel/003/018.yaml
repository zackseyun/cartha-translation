id: DAN.3.18
reference: Daniel 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵ֣ן לָ֔א יְדִ֥יעַ לֶהֱוֵא לָ֖/ךְ מַלְכָּ֑/א דִּ֤י ל/אלהי/ך לָא איתי/נא פָֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א נִסְגֻּֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/018.yaml
  text: But if not[a], let it be known to you, O king, that we will not serve your gods, and we will not bow down to the golden image that you have set up.
  footnotes:
  - marker: a
    text: 'Or, ''But even if not,'' with the implied sense from the previous verse: ''even if he does not deliver us.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그렇지 않다면[a], 왕이시여, 우리가 왕의 신들을 섬기지 않을 것이며, 왕께서 세우신 금으로 된 형상에게 절하지 않을 것을 알아 두십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 그렇지 않더라도’. 앞절의 뜻을 받아 ‘그분이 우리를 구해 주지 않더라도’라는 의미로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵן לָא
  english_pob_choice: But if not
  chosen_korean: 하지만 그렇지 않더라도
  alternatives_korean:
  - 하지만 그렇지 않아도
  - 그러나 그렇지 않더라도
  - 설령 그렇지 않더라도
  lexicon: HALOT
  rationale: 이 아람어 관용구는 앞절의 구원을 전제한 대조적 경우를 여는 말이므로, 간결한 역접·조건 표현으로 살리되 영어처럼 해석을 과도하게 풀지 않았습니다.
- source_word: יְדִיעַ לֶהֱוֵא לָךְ
  english_pob_choice: let it be known to you
  chosen_korean: 아시기 바랍니다
  alternatives_korean:
  - 알게 되십시오
  - 알아 두십시오
  - 왕께 알려 드립니다
  lexicon: HALOT
  rationale: 수동적·격식적 통보 표현을 한국어 공문체에 맞게 옮기되, 왕을 직접 향한 엄중한 선언이라는 어조를 유지했습니다.
- source_word: פָלְחִין
  english_pob_choice: we will not serve
  chosen_korean: 섬기지 않을 것이며
  alternatives_korean:
  - 예배하지 않을 것이며
  - 섬기지 않겠습니다
  - 봉사하지 않을 것이며
  lexicon: HALOT
  rationale: 여기서는 우상 숭배 맥락의 ‘섬기다’가 가장 직접적이며, 단순 봉사보다 종교적 충성을 더 정확히 드러냅니다.
- source_word: צֶלֶם דַּהֲבָא
  english_pob_choice: the golden image
  chosen_korean: 저 금으로 된 형상
  alternatives_korean:
  - 그 금빛 형상
  - 황금 형상
  - 금으로 된 우상
  lexicon: HALOT
  rationale: צֶלֶם은 ‘형상’이 기본값이고, דַּהֲבָא는 재질을 나타내므로 ‘금으로 된 형상’이 원문 구조를 보존합니다. ‘우상’은 해석을 덧붙이므로 본문에는 두지 않았습니다.
- source_word: נִסְגֻּד
  english_pob_choice: we will not bow down
  chosen_korean: 절하지 않을 것을
  alternatives_korean:
  - 엎드려 절하지 않을 것을
  - 절을 하지 않을 것을
  - 무릎 꿇지 않을 것을
  lexicon: HALOT
  rationale: 이 동사는 몸을 낮추는 경배 동작을 가리키므로, 한국어에서는 ‘절하다’가 가장 자연스럽게 그 행위를 전달합니다.
theological_decisions:
- issue: 조건절의 생략된 의미를 얼마나 풀어 쓸지
  chosen_reading: 앞절의 구원 가능성을 전제한 채, '하지만 그렇지 않더라도'로 짧게 유지했습니다.
  alternative_readings:
  - '''왕이 우리를 풀무불에서 건져 주지 않더라도''처럼 명시적으로 풀기'
  - '''설령 그렇게 되지 않더라도''로 더 해석적으로 옮기기'
  rationale: 본문은 구체적 대상이 생략된 채 대조를 이루므로, 이를 과도하게 보충하면 신앙의 긴장과 담대함이 약해집니다. POB의 해석적 여백을 한국어에서도 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
