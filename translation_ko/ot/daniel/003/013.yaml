  source_fidelity: 명령하여 그들을 왕 앞에 오게 했다는 기본 의미와 두 감정 명사의 강조는 잘 반영되었습니다. 그러나 הַיְתָיָה/הֵיתָיוּ의 사역적 ‘데려오다, 불러오다’는 물리적 강제를 특별히 명시하지 않으므로, ‘끌어오다/끌려오다’는 원문보다 강한 뉘앙스를 더합니다.
