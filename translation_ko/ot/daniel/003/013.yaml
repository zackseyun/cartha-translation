  yaml_path: translation/ot/daniel/003/013.yaml
  text: Then Nebuchadnezzar, in rage and fury, commanded that Shadrach, Meshach, and Abed-nego be brought in. Then these men were brought before the king.
translation:
  language: ko
  text: 그러자 느부갓네살은 격분과 분노에 차서 사드락, 메삭, 아벳느고를 데려오라고 명령했습니다. 그러자 그 사람들이 왕 앞에 데려와졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּ/אדַ֤יִן
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그러자
  lexicon: HALOT
  rationale: 담화 표지로서 사건의 다음 순서를 자연스럽게 이어 주는 표현을 택했습니다.
- source_word: בִּ/רְגַ֣ז וַ/חֲמָ֔ה
  english_pob_choice: in rage and fury
  chosen_korean: 격분과 분노 속에서
  alternatives_korean:
  - 분노와 격노 속에서
  - 노와 분노 가운데
  lexicon: HALOT
  rationale: 두 명사의 병렬이 느부갓네살의 격앙된 상태를 강조하므로, 중복된 감정의 강도를 살려 옮겼습니다.
- source_word: אֲמַר֙ לְ/הַיְתָיָ֔ה
  english_pob_choice: commanded that ... be brought in
  chosen_korean: '...를 끌어오라고 명령했습니다'
  alternatives_korean:
  - '...를 데려오라고 명했습니다'
  - '...를 불러오라고 지시했습니다'
  lexicon: HALOT
  rationale: 직역적인 ‘말하다’보다 문맥상 명령의 기능이 분명하므로, 강제적 소환의 뜻이 드러나게 했습니다.
- source_word: הֵיתָ֖יוּ קֳדָ֥ם מַלְכָּֽ/א
  english_pob_choice: were brought before the king
  chosen_korean: 왕 앞에 끌려왔습니다
  alternatives_korean:
  - 왕 앞에 데려와졌습니다
  - 왕의 앞으로 끌려왔습니다
  lexicon: HALOT
  rationale: 수동적 ‘끌려오다’의 뉘앙스와 궁정 장면의 공적 성격을 함께 보존했습니다.
