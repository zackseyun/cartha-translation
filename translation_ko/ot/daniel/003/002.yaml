base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
  footnotes:
  - marker: a
    text: Or 'the statue.' The Aramaic term can refer to an image in general or, in this context, a monumental statue.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 느부갓네살 왕은 사트라프들, 지방 장관들, 총독들, 자문관들, 재무관들, 재판관들, 법관들, 그리고 모든 지방의 관리들을 소집하여, 느부갓네살 왕이 세운 그 형상의 봉헌식에 오게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조각상.’ 아람어 צלם은 일반적으로 ‘형상’을 뜻할 수 있으며, 이 문맥에서는 거대한 기념 조각상을 가리킬 수 있습니다.
    reason: lexical_alternative
