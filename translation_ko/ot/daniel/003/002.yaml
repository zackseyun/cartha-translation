  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְבוּכַדְנֶצַּ֣ר מַלְכָּ֡/א שְׁלַ֡ח לְ/מִכְנַ֣שׁ לַֽ/אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ/א֩ גְדָ֨בְרַיָּ֤/א דְּתָבְרַיָּ/א֙ תִּפְתָּיֵ֔/א וְ/כֹ֖ל שִׁלְטֹנֵ֣י מְדִֽינָתָ֑/א לְ/מֵתֵא֙ לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
  footnotes:
  - marker: a
    text: Or 'the statue.' The Aramaic term can refer to an image in general or, in this context, a monumental statue.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 느부갓네살 왕이 총독들, 지사들, 행정관들, 참사들, 보물 관리들, 재판관들, 법관들, 그리고 모든 지방 관리들을 불러, 느부갓네살 왕이 세운 그 형상의 봉헌식에 오게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조각상.’ 아람어 צלם은 일반적으로는 ‘형상’을 뜻할 수 있으며, 이 문맥에서는 거대한 기념 조각상을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  english_pob_choice: satraps
  chosen_korean: 총독들
  alternatives_korean:
  - 사트랍들
  - Satrap들
  lexicon: HALOT
  rationale: 페르시아 행정 직함을 가리키므로, 뜻을 살리되 한국어 독자에게 즉시 이해되는 ‘총독들’로 옮겼습니다.
- source_word: סִגְנַיָּא / פַחֲוָתָא / אֲדַרְגָּזְרַיָּא / גְדָבְרַיָּא / דְּתָבְרַיָּא / תִּפְתָּיֵא
  english_pob_choice: prefects / governors / counselors / treasurers / judges / magistrates
  chosen_korean: 지사들, 행정관들, 참사들, 보물 관리들, 재판관들, 법관들
  alternatives_korean:
  - 부총독들, 관리들, 고문들, 금고 관리자들, 판관들, 치안관들
  lexicon: HALOT
  rationale: 열거된 여러 관직은 서로 다른 행정·사법 계층을 이루므로, 각각의 기능 차이가 드러나도록 한국어 관직어를 분화해 옮겼습니다.
- source_word: לְמִכְנַשׁ
  english_pob_choice: to assemble
  chosen_korean: 불러 … 오게 했습니다
  alternatives_korean:
  - 모으도록 했습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: ‘불러 오게 하다’는 소집의 결과와 궁정 행정의 목적을 자연스럽게 드러내며, 원문의 목적절을 한국어로 매끈하게 살립니다.
- source_word: צַלְמָא
  english_pob_choice: the image
  chosen_korean: 그 형상
  alternatives_korean:
  - 그 상
  - 그 우상
  - 그 조각상
  lexicon: HALOT
  rationale: 본문의 צלם은 문맥상 거대한 기념 형상을 가리키므로, 우상성으로 미리 좁히지 않고 ‘형상’으로 넓게 유지했습니다.
- source_word: חֲנֻכַּת
  english_pob_choice: the dedication
  chosen_korean: 봉헌식
  alternatives_korean:
  - 헌당식
  - 봉헌
  - 헌정식
  lexicon: HALOT
  rationale: 공적 의례의 성격을 분명히 하면서도, 원문의 ‘dedication’ 의미를 가장 직접적으로 살리는 표현으로 ‘봉헌식’을 택했습니다.
- source_word: הֲקֵים
  english_pob_choice: had set up
  chosen_korean: 세운
  alternatives_korean:
  - 설치한
  - 세워 둔
  lexicon: HALOT
  rationale: 과거 완료의 선행성을 한국어에서 자연스럽게 반영하기 위해 ‘세운’을 사용했습니다.
theological_decisions:
- issue: אַרָמִית administrative title list rendering
  chosen_reading: 관직명들의 배열을 한국어 관직어로 풀어 옮기되, 의미 차이를 흐리지 않도록 직무 성격을 살렸습니다.
  alternative_readings:
  - 모든 명칭을 음역하여 역사성을 강조함
  - 전부 ‘관리들’로 평탄화함
  rationale: 이 절은 예배적 진술이 아니라 제국 행정 소집의 묘사이므로, 독자가 계층적 행정 구조를 파악할 수 있게 하는 것이 본문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 본문 맥락의 역사-서술적 정확성
