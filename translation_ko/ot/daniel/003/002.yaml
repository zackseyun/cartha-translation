  to: 그때 느부갓네살 왕은 사트라프들, 지방 장관들, 총독들, 자문관들, 재무관들, 재판관들, 법관들, 그리고 모든 지방의 관리들을 소집하여, 느부갓네살 왕이 세운 그 형상의 봉헌식에 오게 했습니다.[a]
  rationale: 사트라프라는 차별적 역사 행정 직함을 보존하고, 나머지 관직 열거는 현대 한국어의 격식 있는 표현으로 유지했습니다. 소집의 목적과 형상의 봉헌식이라는 원문의 구문 관계도 더 직접적으로 드러내도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
