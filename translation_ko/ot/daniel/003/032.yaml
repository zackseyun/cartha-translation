id: DAN.3.32
reference: Daniel 3:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָֽתַיָּ/א֙ וְ/תִמְהַיָּ֔/א דִּ֚י עֲבַ֣ד עִמִּ֔/י אֱלָהָ֖/א עלי/א שְׁפַ֥ר קָֽדָמַ֖/י לְ/הַחֲוָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/032.yaml
  text: It has seemed good to me to declare the signs and wonders that the Most High God has done for me[a][b].
  footnotes:
  - marker: a
    text: Or "It seemed good to me to make known"; the Aramaic expression is a formal idiom of royal approval or resolve.
    reason: lexical_alternative
  - marker: b
    text: Literally "has done with me"; the sense is what God has done in relation to or for Nebuchadnezzar.
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 하나님께서 내게 행하신 표적과 기사들을 알리는 것이 내게 좋게 여겨졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나에게 알리기로”; 아람어 표현은 왕의 공적 승인이나 결심을 나타내는 격식 있는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “나와 함께 행하셨다”이지만, 뜻은 하나님이 느부갓네살에게 관계적으로 또는 위하여 행하신 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָתַיָּא / וְתִמְהַיָּא
  english_pob_choice: the signs and wonders
  chosen_korean: 표적과 기사들
  alternatives_korean:
  - 표징과 기이한 일들
  - 징조와 경이들
  lexicon: HALOT
  rationale: 아람어의 짝 표현을 한국어로도 관용적으로 짝지어 옮기되, 성경 문맥에서 익숙한 ‘표적’과 ‘기사’로 옮겨 공적 선포의 격식을 살렸습니다.
- source_word: עֲבַד עִמִּי
  english_pob_choice: has done for me
  chosen_korean: 내게 행하신
  alternatives_korean:
  - 나와 함께 하신
  - 내게서 행하신
  lexicon: HALOT
  rationale: 직역하면 ‘나와 함께’이지만, 여기서는 하나님이 느부갓네살에게 관계적으로 베푸신 행위를 뜻하므로 ‘내게 행하신’이 의미를 가장 자연스럽게 드러냅니다.
- source_word: אֱלָהָא עִלָּיָא
  english_pob_choice: the Most High God
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  lexicon: HALOT
  rationale: 아람어의 최고급 칭호를 한국어에서도 신격의 절대적 높음을 드러내는 ‘지극히 높으신 하나님’으로 옮겼습니다.
- source_word: שְׁפַר קֳדָמַי לְהַחֲוָיָה
  english_pob_choice: It has seemed good to me to declare
  chosen_korean: 알리는 것이 내게 좋게 여겨졌습니다
  alternatives_korean:
  - 선포하는 것이 내게 좋게 여겨졌습니다
  - 밝히는 것이 내게 좋았습니다
  lexicon: HALOT
  rationale: 왕의 칙령체에 나오는 관용구를 직역하지 않고 한국어의 공적 문체로 풀어, ‘좋게 여겨졌습니다’가 의지·결단의 형식을 살리도록 했습니다.
theological_decisions:
- issue: 지극히 높으신 하나님의 호칭 번역
  chosen_reading: ‘지극히 높으신 하나님’으로 번역해 본문의 직접적 칭호를 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 하나님’
  - ‘지존하신 하나님’
  rationale: 이 칭호는 다니엘서에서 하나님을 높이는 핵심 표현이므로, 후대 교회적 명칭으로 바꾸기보다 원문이 지닌 최고위 칭호를 분명히 드러내는 쪽이 본문 충실성에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §2 (Translate titles; transliterate names)'
