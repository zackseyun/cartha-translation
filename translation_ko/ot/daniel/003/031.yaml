base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/031.yaml
  text: 'King Nebuchadnezzar[a], to all peoples, nations[b], and languages that dwell in all the earth: May your peace abound.'
  footnotes:
  - marker: a
    text: Or 'May your peace be multiplied.'
    reason: lexical_alternative
  - marker: b
    text: '''In all the earth'' is a conventional imperial expression and may function rhetorically like ''throughout the whole realm.'''
    reason: cultural_note
translation:
  language: ko
  text: 느부갓네살 왕이 모든 백성과 나라들과 언어들에게, 곧 온 땅에 사는 자들에게 말합니다. “여러분의 평강이 크게 늘어나기를 바랍니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 평강이 크게 불어나기를 바랍니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘온 땅’은 제국 칙령에서 흔한 관용적 표현으로, 실제로는 ‘온 나라 안에’와 비슷한 수사로 기능할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְכָּא
  english_pob_choice: King Nebuchadnezzar
  chosen_korean: 느부갓네살 왕
  alternatives_korean:
  - 왕 느부갓네살
  - 느부갓네살
  lexicon: HALOT
  rationale: 아람어에서 본문은 이름 뒤에 칭호가 붙은 왕실 서두이며, 한국어에서는 자연스럽게 ‘느부갓네살 왕’으로 옮기는 것이 공문체의 호칭을 잘 살립니다.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  english_pob_choice: to all peoples, nations, and languages
  chosen_korean: 모든 백성과 나라들과 언어들에게
  alternatives_korean:
  - 모든 백성과 민족들과 언어들에게
  - 모든 백성과 나라들과 말들에
  lexicon: HALOT
  rationale: 제국 칙령의 삼중 표현을 살리되, 현대 한국어에서 ‘언어들’보다 ‘언어들에게’가 더 직접적이어서 수신 대상을 분명하게 전달합니다.
- source_word: דִּי דארין בְּכָל אַרְעָא
  english_pob_choice: that dwell in all the earth
  chosen_korean: 곧 온 땅에 사는 자들에게
  alternatives_korean:
  - 온 땅에 거하는 자들에게
  - 온 땅에 사는 모든 이들에게
  lexicon: HALOT
  rationale: ‘거하다’보다 ‘사는 자들’이 현대 합쇼체 공문문에 더 자연스럽고, 본문의 거주자 지칭과 제국적 범위를 함께 드러냅니다.
- source_word: שְׁלָמְכֹון יִשְׂגֵּא
  english_pob_choice: May your peace abound
  chosen_korean: 여러분의 평강이 크게 늘어나기를 바랍니다
  alternatives_korean:
  - 여러분의 평강이 번성하기를 바랍니다
  - 여러분의 평안이 풍성해지기를 바랍니다
  lexicon: HALOT
  rationale: שָׁלוֹם 계열의 인사말은 단순한 ‘평안’보다 관계적·총체적 의미가 있어 ‘평강’이 더 적절하며, יִשְׂגֵּא의 ‘증가/불어남’을 자연스럽게 풀었습니다.
theological_decisions:
- issue: 축복형 인사문의 한국어 어조
  chosen_reading: ‘바랍니다’로 옮겨 왕의 공식 축복·선언문 성격을 살리되, 강압적 명령이 아니라 평강을 비는 공적 인사로 읽히게 했습니다.
  alternative_readings:
  - ‘…늘어나길 빕니다’
  - ‘…크게 번성하길 원합니다’
  rationale: 본문은 축복적 선언이므로, 한국어에서도 청중에게 평강을 기원하는 공문체를 유지하는 것이 적절합니다.
  doctrine_reference: Daniel 3:31 as royal proclamation
- issue: ‘온 땅’의 범위
  chosen_reading: ‘온 땅’으로 직역하여 제국적 수사와 보편적 호칭을 함께 보존했습니다.
  alternative_readings:
  - ‘온 나라’
  - ‘온 나라 안에’
  rationale: 영문 POB의 주석처럼 이는 문자적 지리정보라기보다 제국 칙령의 관용적 표현이므로, 한국어에서도 범위를 넓게 유지하는 편이 본문 기능에 부합합니다.
  doctrine_reference: Imperial proclamation formula
