  source_fidelity: 왕의 칙령 표제는 원문에서 발화 동사 없이 수신자와 축원으로 바로 이어집니다. 초안의 ‘말합니다’는 원문에 없는 서술을 보태며, ‘곧’은 관계절을 동격적으로 처리하여 수신자 범위를 다소 흐립니다. 또한 ‘언어들에게’는 원문의 집단 범주를 한국어에서 부자연스럽게 만듭니다.
  naturalness: 수정안은 현대 공문·선포문에 맞는 간결한 표제 형식과 합쇼체 축원 표현을 사용합니다. ‘언어를 사용하는 이들’은 언어가 수신자가 되는 어색함 없이 원문의 언어 집단 범주를 전달합니다.
  terminology: ‘느부갓네살 왕’, ‘백성’, ‘민족’, ‘평강’은 본문의 왕실 칙령과 샬롬 계열 축원의 어조를 무리 없이 보존합니다. ‘온 땅’은 제국적 보편성 수사를 유지하며 주석에서 그 관용성을 설명합니다.
  issues:
