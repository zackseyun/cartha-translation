id: DAN.3.1
reference: Daniel 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א עֲבַד֙ צְלֵ֣ם דִּֽי דְהַ֔ב רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֣ין שִׁ֑ת אֲקִימֵ/הּ֙ בְּ/בִקְעַ֣ת דּוּרָ֔א בִּ/מְדִינַ֖ת בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/001.yaml
  text: King Nebuchadnezzar made an image of gold[a], its height sixty cubits and its width six cubits. He set it up in the plain of Dura[b], in the province of Babylon.
  footnotes:
  - marker: a
    text: Or 'statue of gold.' The Aramaic term can denote an image or statue; 'idol' is also possible in light of the later context, but the main text preserves the more neutral wording of the verse itself.
    reason: lexical_alternative
  - marker: b
    text: A cubit was a standard ancient unit of length, roughly the distance from the elbow to the fingertips.
    reason: cultural_note
translation:
  language: ko
  text: 느부갓네살 왕은 금으로 된 상을 만들었습니다[a]. 그 높이는 육십 규빗이었고 그 너비는 여섯 규빗이었습니다. 그는 그것을 바벨론 도의 두라 평원에 세웠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금상’. 아람어 용어는 형상이나 상을 뜻할 수 있으며, 뒤 문맥을 고려하면 ‘우상’도 가능하지만, 본문은 우선 더 중립적인 표현을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 규빗은 고대의 표준 길이 단위로, 보통 팔꿈치에서 손끝까지의 길이 정도입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲבַד
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 제작했습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 아람어 עֲבַד의 기본 의미를 자연스럽게 살리면서, 우상 제작의 문맥에도 맞는 가장 무난한 현대 한국어입니다.
- source_word: צְלֵם
  english_pob_choice: image
  chosen_korean: 상
  alternatives_korean:
  - 형상
  - 우상
  - 조상
  lexicon: HALOT
  rationale: POB의 ‘image’처럼 원문 자체의 중립성을 유지하되, 한국어에서는 물건으로 세운 거대한 대상으로 읽히는 ‘상’이 가장 자연스럽습니다.
- source_word: רוּמֵהּ / פְּתָיֵהּ / אַמִּין שִׁתִּין / אַמִּין שִׁת
  english_pob_choice: its height ... sixty cubits ... its width ... six cubits
  chosen_korean: 그 높이는 육십 규빗이었고 그 너비는 여섯 규빗이었습니다
  alternatives_korean:
  - 높이는 육십 규빗, 너비는 여섯 규빗
  - 키는 육십 규빗, 넓이는 여섯 규빗
  lexicon: HALOT
  rationale: 치수 정보의 병렬 구조를 한국어에서 명확히 유지했습니다. ‘규빗’은 고대 단위로, POB의 문화적 주석과 맞물려 직역을 보존합니다.
- source_word: אֲקִימֵהּ
  english_pob_choice: He set it up
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 설치했습니다
  - 높이 세웠습니다
  lexicon: HALOT
  rationale: 아람어 동사는 ‘세우다/들어 올려 세우다’의 뜻이어서, 우상이나 기념물을 자리에 놓는 장면에 가장 간결하게 대응합니다.
- source_word: בְּבִקְעַת דּוּרָא
  english_pob_choice: in the plain of Dura
  chosen_korean: 두라 평원에
  alternatives_korean:
  - 두라의 평원에
  - 두라 골짜기에
  lexicon: HALOT
  rationale: בִּקְעָה는 넓은 평지 또는 평원에 가까우므로 ‘평원’이 POB의 ‘plain’을 가장 직접적으로 반영합니다.
- source_word: בִּמְדִינַת בָּבֶל
  english_pob_choice: in the province of Babylon
  chosen_korean: 바벨론 도의
  alternatives_korean:
  - 바벨론 지방의
  - 바빌론 도의
  lexicon: HALOT
  rationale: מְדִינָה는 행정구역을 가리키므로 ‘도’가 ‘province’를 잘 옮깁니다. 고유명사는 성경에서 널리 쓰이는 ‘바벨론’을 택했습니다.
theological_decisions:
- issue: צְלֵם을 ‘우상’으로 미리 규정할지 여부
  chosen_reading: ‘상’으로 번역해 서술을 중립적으로 유지했습니다.
  alternative_readings:
  - 우상
  - 형상
  rationale: 본문은 크기·재질·설치 장소를 말할 뿐, 이 구절 자체에서 곧바로 종교적 평가를 내리지는 않습니다. 따라서 POB처럼 원문이 드러내는 정보에 머물렀습니다.
  doctrine_reference: Translation philosophy §1, §3
