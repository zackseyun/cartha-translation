base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/022.yaml
  text: Because of this, since the king’s command was harsh and the furnace had been heated exceedingly, the flame of the fire killed those men who brought up Shadrach, Meshach, and Abed-nego.
translation:
  language: ko
  text: 이 때문에 왕의 명령이 급박했고 풀무가 몹시 뜨겁게 달구어졌으므로, 불길이 사드락과 메삭과 아벳느고를 데리고 올라간 사람들을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּ/ל קֳבֵל דְּנָה
  english_pob_choice: Because of this
  chosen_korean: 그렇기 때문에
  alternatives_korean:
  - 이 때문에
  - 이런 까닭에
  lexicon: source_phrase
  rationale: 원인-결과를 나타내는 접속 표현으로 자연스럽게 옮기되, 본문의 결론적 전개를 살려 과도하게 장식하지 않았습니다.
- source_word: מִן דִּי מִלַּת מַלְכָּ/א מַחְצְפָה
  english_pob_choice: since the king’s command was harsh
  chosen_korean: 왕의 명령이 엄하고
  alternatives_korean:
  - 왕의 명령이 급박하고
  - 왕의 명령이 거칠고
  lexicon: מִלָּה / מַחְצְפָה
  rationale: מַחְצְפָה는 단순한 ‘긴급함’보다 ‘엄하고 거센’ 뉘앙스가 더 분명하므로, POB의 ‘harsh’를 따라 ‘엄하다’로 옮겼습니다.
- source_word: וְאַתּוּנָא אֵזֵה יַתִּירָא
  english_pob_choice: and the furnace had been heated exceedingly
  chosen_korean: 풀무가 몹시 달구어졌으므로
  alternatives_korean:
  - 풀무가 심하게 달구어졌으므로
  - 풀무가 지극히 뜨거워졌으므로
  lexicon: אַתּוּנָא / אֵזֵה יַתִּירָא
  rationale: ‘heated exceedingly’는 단순한 상태 설명이므로, 능동적·감각적으로 ‘몹시 달구어졌습니다’로 자연스럽게 표현했습니다.
- source_word: שְׁבִיבָא דִּי נוּרָא
  english_pob_choice: the flame of the fire
  chosen_korean: 불꽃이
  alternatives_korean:
  - 불길이
  - 화염이
  lexicon: שְׁבִיבָא
  rationale: 중복 어구 ‘불의 불꽃’의 중복을 한국어에서는 핵심 이미지인 ‘불꽃’으로 압축해 살렸습니다.
theological_decisions:
