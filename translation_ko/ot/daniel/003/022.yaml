  terminology: ‘풀무’, ‘사드락, 메삭, 아벳느고’는 한국어 성경 문맥에서 익숙하고 적절합니다. שְׁבִיבָא דִּי נוּרָא는 한국어에서는 ‘불길’로 옮겨 자연스럽게 불의 화염이라는 뜻을 보존할 수 있습니다.
