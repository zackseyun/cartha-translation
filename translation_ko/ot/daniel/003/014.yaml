  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָנֵ֤ה נְבֻֽכַדְנֶצַּר֙ וְ/אָמַ֣ר לְ/ה֔וֹן הַ/צְדָּ֕א שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לֵֽ/אלָהַ֗/י לָ֤א אִֽיתֵי/כוֹן֙ פָּֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימֶת לָ֥א סָֽגְדִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/014.yaml
  text: Nebuchadnezzar answered and said to them[a], “Is it true, Shadrach, Meshach, and Abed-nego, that you do not serve my god and do not bow down to the golden image that I have set up?”
  footnotes:
  - marker: a
    text: 'Aramaic הַצְדָּא may also mean ''deliberately'' or ''on purpose'': ''Is it deliberate, Shadrach, Meshach, and Abed-nego, that you do not serve my god ... ?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 느부갓네살이 그들에게 대답하여 말했습니다. 「사드락, 메삭, 아벳느고야, 너희가 내 하나님을 섬기지 않고, 내가 세운 금으로 된 형상에 절하지 않는 것이 정말이냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아람어 הַצְדָּא는 여기서 ‘고의로/의도적으로’라는 뜻도 될 수 있습니다. 따라서 “사드락, 메삭, 아벳느고야, 너희가 내 하나님을 섬기지 않는 것이 정말이냐?”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하면서 말했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어/아람어 서술 관용구로서 발화 도입 공식입니다. 한국어에서는 중복을 살리되 자연스럽게 ‘대답하여 말했습니다’로 옮기는 것이 가장 무난합니다.
- source_word: הַצְדָּא
  english_pob_choice: Is it true
  chosen_korean: 정말이냐
  alternatives_korean:
  - 사실이냐
  - 의도적인 것이냐
  lexicon: HALOT
  rationale: 문맥상 왕이 제기하는 핵심은 사실 여부에 대한 추궁입니다. 다만 ‘의도적으로’라는 뉘앙스가 가능하므로 본문은 자연스러운 질문형으로 두고 해석 가능성은 주석으로 남깁니다.
- source_word: פָּלְחִין
  english_pob_choice: serve
  chosen_korean: 섬기지
  alternatives_korean:
  - 봉사하지
  - 예배하지
  lexicon: HALOT
  rationale: 이 동사는 단순한 예배 행위보다 우상에게 드리는 종교적 봉사/섬김을 가리키므로, ‘섬기다’가 ‘serve’의 의미를 가장 잘 살립니다.
- source_word: וּלְצֶלֶם דַּהֲבָא
  english_pob_choice: the golden image
  chosen_korean: 금으로 된 형상
  alternatives_korean:
  - 금 형상
  - 황금 형상
  - 금으로 만든 우상
  lexicon: HALOT
  rationale: צֶלֶם은 이 장면에서 반복되는 ‘형상’이 기본 대응이며, דַּהֲבָא는 재료를 나타내므로 ‘금으로 된 형상’이 직역과 자연스러움의 균형을 이룹니다.
- source_word: סָגְדִין
  english_pob_choice: bow down
  chosen_korean: 절하지
  alternatives_korean:
  - 엎드려 절하지
  - 굽어 절하지
  - 경배하지
  lexicon: HALOT
  rationale: 이 동사는 몸을 굽혀 경의를 표하는 행위를 가리키므로, ‘절하다’가 동작의 핵심을 간결하게 살립니다. 앞의 ‘섬기다’와도 구별됩니다.
theological_decisions:
- issue: ‘serve’와 ‘bow down’의 두 행위를 한국어에서 어떻게 구분할지
  chosen_reading: ‘섬기지’와 ‘절하지’로 구분해 유지했습니다.
  alternative_readings:
  - 둘 다 ‘예배하지’로 통일
  - 둘 다 ‘숭배하지’로 통일
  rationale: 아람어는 우상에 대한 종교적 봉사와 신체적 절을 서로 다른 동사로 구분합니다. 이를 합치면 왕의 고발이 가진 수사적 긴장이 약해지므로, 구별을 유지하는 편이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
- issue: הַצְדָּא의 해석을 본문에서 얼마나 확정할지
  chosen_reading: 본문은 ‘정말이냐’로 옮기고, ‘의도적으로/고의로’라는 가능성은 주석으로 보존합니다.
  alternative_readings:
  - ‘고의로냐’
  - ‘의도적으로냐’
  rationale: 이 표현은 사실 확인과 의도 확인 사이의 긴장을 가집니다. 본문에서는 즉각적인 대화 흐름에 맞는 의미를 택하되, 원문의 해석 여지를 지우지 않도록 합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
