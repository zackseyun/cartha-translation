  source_fidelity: 원문의 아람어는 왕이 놀라 동요한 가운데 급히 일어나 궁정의 관리들에게 세 사람이 결박된 채 불의 한가운데로 던져졌는지를 확인하고, 그들이 이를 긍정하는 장면입니다. 초안의 핵심 사건 전개는 대체로 보존했으나, לְהַדָּבְרוֹהִי를 ‘대언자들’로 옮긴 것은 해당 어휘가 가리키는 궁정의 관리·관료·조언자들과 맞지 않습니다. 또한 각주 표지가 해당 어휘가 나오는 자리와 연결되지 않았습니다.
  naturalness: ‘깜짝 놀라 황급히 일어났습니다’와 ‘왕이시여’는 현대 표준어 합쇼체로 자연스럽습니다. ‘궁정 관리들’은 이 문맥에서 정확하고 자연스러우며, ‘물었습니다’는 아람어의 발화 공식을 한국어의 자연스러운 의문 발화로 옮깁니다.
  terminology: ‘대언자’는 일반적으로 예언자 또는 하나님의 말씀을 대신 전하는 사람을 연상시키므로 궁정 관료를 뜻하는 본문에는 부적절합니다. ‘궁정 관리들’로 고쳤습니다. ‘불 가운데’는 לְגוֹא의 내부·중심 위치를 적절히 반영합니다.
