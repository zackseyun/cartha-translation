revisions:
- from: 그때 느부갓네살 왕은 깜짝 놀라 황급히 일어났습니다[a]. 그는 대언자들에게 말했습니다. "우리가 결박한 세 사람을 불 가운데에 던지지 않았습니까?" 그들이 왕에게 대답했습니다. "그렇습니다[b], 왕이시여."
  to: 그때 느부갓네살 왕은 깜짝 놀라 황급히 일어났습니다. 그는 자기 궁정 관리들[a]에게 물었습니다. “우리가 세 사람을 결박한 채 불 가운데에[b] 던지지 않았습니까?” 그들이 왕에게 대답했습니다. “그렇습니다, 왕이시여.”
  rationale: 궁정 관료를 뜻하는 어휘를 ‘궁정 관리들’로 바로잡고, 원문의 의문 발화를 자연스러운 한국어로 옮겼습니다. 두 각주 표지는 각각 설명 대상인 ‘궁정 관리들’과 ‘불 가운데에’ 뒤로 옮겼습니다. 놀람, 동요 속의 신속한 행동, 세 사람이 결박된 상태, 불의 내부라는 원문의 의미는 유지했습니다.
