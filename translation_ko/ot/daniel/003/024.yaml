source:
  edition: WLC
  text: אֱדַ֨יִן֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א תְּוַ֖הּ וְ/קָ֣ם בְּ/הִתְבְּהָלָ֑ה עָנֵ֨ה וְ/אָמַ֜ר לְ/הַדָּֽבְר֗וֹ/הִי הֲ/לָא֩ גֻבְרִ֨ין תְּלָתָ֜א רְמֵ֤ינָא לְ/גוֹא נוּרָ/א֙ מְכַפְּתִ֔ין עָנַ֤יִן וְ/אָמְרִין֙ לְ/מַלְכָּ֔/א יַצִּיבָ֖א מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/024.yaml
  text: Then King Nebuchadnezzar was astonished and rose up in haste[a]. He answered and said to his counselors, “Did we not throw three men, bound, into the midst of the fire?” They answered and said to the king, “Certainly[b], O king.”
  footnotes:
  - marker: a
    text: Or 'to his officials' or 'to his ministers' for the Aramaic term referring to those serving in the king's court.
    reason: lexical_alternative
  - marker: b
    text: Or simply 'into the fire'; the Aramaic more fully says 'into the midst of the fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 느부갓네살 왕은 깜짝 놀라 황급히 일어났습니다[a]. 그는 대언자들에게 말했습니다. "우리가 결박한 세 사람을 불 가운데에 던지지 않았습니까?" 그들이 왕에게 대답했습니다. "그렇습니다[b], 왕이시여."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 그의 궁정 관리들, 혹은 그의 신하들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 단순히 "불 속에"로 옮길 수도 있으나, 아람어는 더 온전히 "불 가운데에"라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּוַהּ
  english_pob_choice: was astonished
  chosen_korean: 깜짝 놀라
  alternatives_korean:
  - 놀랐습니다
  - 경악했습니다
  lexicon: HALOT
  rationale: 아람어의 놀람·충격 반응을 자연스럽게 살리되, 이어지는 급박한 행동과도 어울리게 했습니다.
- source_word: בְּהִתְבְּהָלָה
  english_pob_choice: in haste
  chosen_korean: 황급히
  alternatives_korean:
  - 서둘러
  - 급히
  lexicon: HALOT
  rationale: 감정적 동요가 섞인 서두름을 간결하게 반영하는 표현입니다.
- source_word: לְהַדָּבְרוֹהִי
  english_pob_choice: to his counselors
  chosen_korean: 대언자들에게
  alternatives_korean:
  - 고문들에게
  - 신하들에게
  - 조언자들에게
  lexicon: HALOT
  rationale: 문맥상 왕이 궁정의 조언·행정 담당자들에게 말하는 장면이므로, 한국어에서는 기능을 드러내는 표현을 택했습니다. 주석[a]로 대안 의미를 열어 두었습니다.
- source_word: לְגוֹא נוּרָא
  english_pob_choice: into the midst of the fire
  chosen_korean: 불 가운데에
  alternatives_korean:
  - 불 속에
  - 불 한가운데에
  lexicon: HALOT
  rationale: 직역의 '가운데'를 살리면서도 한국어로는 '불 가운데에'가 가장 자연스럽고, 원문의 공간적 강세를 충분히 전달합니다.
theological_decisions:
- issue: 왕의 질문과 응답의 공손한 화법
  chosen_reading: 왕의 직접 화법은 현대 한국어에서 자연스러운 공손체로 옮기되, 뒤의 호칭은 "왕이시여"로 유지했습니다.
  alternative_readings:
  - '"왕이여"'
  - '"임금님"'
  rationale: 본문의 궁정적 위계와 종속자의 경외를 드러내기 위해 직접호칭을 공손한 형태로 보존했습니다.
  doctrine_reference: 본문의 서사적 화법과 궁정 예절
- issue: 아람어의 반복된 서술 공식(‘대답하여 말하다’)
  chosen_reading: '"그는 대언자들에게 말했습니다"와 "그들이 왕에게 대답했습니다"로 압축해 한국어의 자연스러움을 확보했습니다.'
  alternative_readings:
  - '"그는 응답하여 말했습니다"'
  - '"그는 말하고 대답했습니다"'
  rationale: 원문의 반복 공식을 과도하게 직역하면 한국어가 부자연스러워지므로, 의미 기능은 유지하고 표현은 다듬었습니다.
  doctrine_reference: 서사 문체와 번역 등가성
