theological_decisions:
- issue: 왕의 질문과 응답의 공손한 화법
  chosen_reading: 왕의 직접 화법은 현대 한국어에서 자연스러운 공손체로 옮기되, 뒤의 호칭은 "왕이시여"로 유지했습니다.
  alternative_readings:
  - '"왕이여"'
  - '"임금님"'
  rationale: 본문의 궁정적 위계와 종속자의 경외를 드러내기 위해 직접호칭을 공손한 형태로 보존했습니다.
  doctrine_reference: 본문의 서사적 화법과 궁정 예절
- issue: 아람어의 반복된 서술 공식(‘대답하여 말하다’)
  chosen_reading: '"그는 대언자들에게 말했습니다"와 "그들이 왕에게 대답했습니다"로 압축해 한국어의 자연스러움을 확보했습니다.'
  alternative_readings:
  - '"그는 응답하여 말했습니다"'
  - '"그는 말하고 대답했습니다"'
  rationale: 원문의 반복 공식을 과도하게 직역하면 한국어가 부자연스러워지므로, 의미 기능은 유지하고 표현은 다듬었습니다.
  doctrine_reference: 서사 문체와 번역 등가성
