  text: הֵ֣ן אִיתַ֗י אֱלָהַ֨/נָא֙ דִּֽי אֲנַ֣חְנָא פָֽלְחִ֔ין יָכִ֖ל לְ/שֵׁיזָבוּתַ֑/נָא מִן אַתּ֨וּן נוּרָ֧/א יָקִֽדְתָּ֛/א וּ/מִן יְדָ֥/ךְ מַלְכָּ֖/א יְשֵׁיזִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
  footnotes:
  - marker: a
    text: Or, more literally, 'If there is [such a case].' The Aramaic opening is idiomatic and refers back to the king's threatened punishment.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''the burning fiery furnace.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'he may deliver us' or 'may he deliver us.' The Aramaic form can be understood differently, though the main text takes it as a confident future assertion.
    reason: alternative_reading
translation:
  language: ko
  text: 만일 그렇다면[a], 우리가 섬기는 하나님은 이 불타는 풀무[b]에서 우리를 건져 내실 수 있으시며, 왕의 손에서도 우리를 건져 내실 것입니다, 왕이여.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 경우라면’ 또는 ‘그렇다면’에 가까운 관용적 조건 표현입니다. 왕이 앞서 제시한 위협을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 ‘불타는 풀무’로 옮깁니다. 아람어는 풀무와 불, 타오름을 거듭 언급하여 불의 강도를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 아람어 동사는 ‘건져 내실 것입니다’로 이해할 수 있으며, ‘건져 내실 수도 있습니다’ 또는 ‘건져 내시기를 바랍니다’로 이해할 여지도 있습니다.
    reason: alternative_reading
