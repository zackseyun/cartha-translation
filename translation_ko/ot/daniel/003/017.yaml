id: DAN.3.17
reference: Daniel 3:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן אִיתַ֗י אֱלָהַ֨/נָא֙ דִּֽי אֲנַ֣חְנָא פָֽלְחִ֔ין יָכִ֖ל לְ/שֵׁיזָבוּתַ֑/נָא מִן אַתּ֨וּן נוּרָ֧/א יָקִֽדְתָּ֛/א וּ/מִן יְדָ֥/ךְ מַלְכָּ֖/א יְשֵׁיזִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
  footnotes:
  - marker: a
    text: Or, more literally, 'If there is [such a case].' The Aramaic opening is idiomatic and refers back to the king's threatened punishment.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''the burning fiery furnace.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'he may deliver us' or 'may he deliver us.' The Aramaic form can be understood differently, though the main text takes it as a confident future assertion.
    reason: alternative_reading
translation:
  language: ko
  text: 만일 그렇다면, 우리가 섬기는 하나님은 이 불타는 풀무에서 우리를 건져내실 수 있으시며, 왕의 손에서도 우리를 건져내실 것입니다, 왕이여.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그렇다면/그 경우라면’에 가까운 관용적 조건문입니다.
    reason: lexical_alternative
  - marker: b
    text: 아람어의 ‘풀무’는 전통적으로 ‘타는 불붙는 풀무’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן אִיתַי
  english_pob_choice: If it is so
  chosen_korean: 만일 그렇다면
  alternatives_korean:
  - 만일 그러하다면
  - 그렇다면
  - 보십시오
  lexicon: HALOT
  rationale: 아람어의 관용적 조건문을 한국어에서 자연스러운 조건 표현으로 풀어 옮겼습니다. 직역식 감탄사보다 문맥의 응답 구조를 분명히 드러냅니다.
- source_word: פָלְחִין
  english_pob_choice: serve
  chosen_korean: 섬기는
  alternatives_korean:
  - 예배하는
  - 경배하는
  - 봉사하는
  lexicon: HALOT
  rationale: 이 동사는 단순한 노동보다 신앙적 섬김을 포함할 수 있으나, 본문에서는 ‘섬기다’가 동사의 형식과 종교적 함의를 함께 가장 직접적으로 살립니다.
- source_word: לְשֵׁיזָבוּתַנָא
  english_pob_choice: to deliver us
  chosen_korean: 우리를 건져내실
  alternatives_korean:
  - 우리를 구원하실
  - 우리를 구해 주실
  - 우리를 구출하실
  lexicon: HALOT
  rationale: 불속과 왕의 손이라는 즉각적 위기에서의 구출을 가리키므로, 물리적 위험에서 꺼내는 의미를 살리는 ‘건져내다’를 택했습니다.
- source_word: מִן אַתּוּן נוּרָא יָקִדְתָּא
  english_pob_choice: from the furnace of blazing fire
  chosen_korean: 이 불타는 풀무에서
  alternatives_korean:
  - 불타는 풀무에서
  - 불붙는 풀무에서
  - 타오르는 화로에서
  lexicon: HALOT
  rationale: 아람어의 ‘풀무’와 ‘불’의 중첩을 보존하되, 한국어에서는 자연스럽게 하나의 관용적 장면으로 읽히도록 정리했습니다.
- source_word: יְשֵׁיזִב
  english_pob_choice: he will deliver
  chosen_korean: 건져내실 것입니다
  alternatives_korean:
  - 건져내시겠습니다
  - 구해 주실 것입니다
  - 건져내실 수 있습니다
  lexicon: HALOT
  rationale: 영어 POB의 문맥 판단처럼 단순 가능성보다 확언에 가깝게 읽히므로, 미래형 확언으로 옮겼습니다. 앞의 ‘수 있으시며’와 함께 능력과 실행을 모두 드러냅니다.
theological_decisions:
- issue: '마지막 동사의 어조: 확언인가, 희망인가'
  chosen_reading: 하나님이 ‘건져내실 것입니다’라는 확언으로 유지했습니다.
  alternative_readings:
  - ‘건져내실 수 있습니다’로 가능성만 제시하는 읽기
  - ‘건져내시기를 바랍니다’라는 기원적 읽기
  rationale: 문맥상 이들은 왕 앞에서 하나님의 능력과 구원을 담대히 증언합니다. 다음 절에서 구원이 없더라도 우상 숭배를 거부한다고 말하므로, 여기서는 약화시키지 않고 확언의 힘을 살리는 것이 더 적절합니다.
  doctrine_reference: 다음 절과 함께 긴장 관계를 보존하는 해석
