theological_decisions:
- issue: 엘리트 제국 의례와 우상 숭배의 강도
  chosen_reading: ‘절했습니다’로 번역해 단순한 정치적 예절이 아니라 우상 앞에서의 종교적 경배를 분명히 했습니다.
  alternative_readings:
  - ‘경배했습니다’
  - ‘경례했습니다’
  rationale: 문맥이 금상에 대한 강제적 종교 행위를 묘사하므로, 원문이 지닌 신학적 긴장을 약화시키지 않기 위해 경배의 의미를 유지했습니다.
  doctrine_reference: Daniel 3장의 우상 숭배 비판 및 제국 충성 요구에 대한 본문 맥락
