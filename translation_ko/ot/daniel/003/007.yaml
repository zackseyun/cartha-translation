base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
  footnotes:
  - marker: a
    text: The exact identification of several instrument names is uncertain. 'Trigon' may refer to a triangular harp, and 'psaltery' may denote a kind of zither or harp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 때문에 그때 모든 백성이 뿔, 피리, 수금, 삼현금, 비파와 모든 종류의 음악 소리를 들었을 때, 모든 백성, 민족, 언어가 엎드려 바벨론 왕 느부갓네살이 세운 금상에 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 열거된 악기 이름들 가운데 몇몇은 정확한 식별이 확실하지 않습니다. ‘삼현금’은 삼각형 모양의 현악기를 가리킬 수 있으며, ‘비파’는 일종의 거문고나 수금일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  english_pob_choice: Therefore
  chosen_korean: 그 때문에
  alternatives_korean:
  - 그러므로
  - 그리하여
  lexicon: HALOT
  rationale: 결과를 이끄는 연결어로서 원문의 인과적 힘을 자연스럽게 살렸습니다.
- source_word: כְּדִי שָׁמְעִין
  english_pob_choice: when ... heard
  chosen_korean: 들었을 때
  alternatives_korean:
  - 듣자
  - 듣는 순간
  lexicon: HALOT
  rationale: 동시·시점 관계를 드러내되, 원문이 과장하는 즉시성은 덧붙이지 않았습니다.
- source_word: שָׁמְעִין כָּל עַמְמַיָּא קָל ...
  english_pob_choice: all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music
  chosen_korean: 모든 백성이 뿔, 피리, 수금, 삼현금, 비파와 모든 종류의 음악 소리를
  alternatives_korean:
  - 모든 민족이 나팔, 피리, 거문고, 삼각금, 비파와 모든 종류의 음악 소리를
  - 모든 백성이 여러 악기의 소리를
  lexicon: HALOT
  rationale: 열거된 악기명을 한국어 독자에게 과도하게 현대화하지 않으면서, POB의 불확실한 악기명 처리도 반영해 가장 보수적으로 옮겼습니다.
- source_word: נָפְלִין ... סָגְדִין
  english_pob_choice: fell down and worshiped
  chosen_korean: 엎드려 ... 절했습니다
  alternatives_korean:
  - 엎드려 경배했습니다
  - 엎드려 숭배했습니다
  lexicon: HALOT
  rationale: 물리적 자세와 종교적 행위를 분리해 표현하여, ‘fell down’과 ‘worshiped’의 이중 동작을 모두 드러냈습니다.
- source_word: צֶלֶם דַּהֲבָא
  english_pob_choice: the golden image
  chosen_korean: 금상
  alternatives_korean:
  - 금으로 만든 형상
  - 금빛 우상
  lexicon: HALOT
  rationale: 문맥상 단순 장식물이 아니라 우상적 형상이므로 ‘상’보다 ‘금상’이 간결하면서도 대상의 공적·우상적 성격을 보존합니다.
theological_decisions:
- issue: 엘리트 제국 의례와 우상 숭배의 강도
  chosen_reading: ‘절했습니다’로 번역해 단순한 정치적 예절이 아니라 우상 앞에서의 종교적 경배를 분명히 했습니다.
  alternative_readings:
  - ‘경배했습니다’
  - ‘경례했습니다’
  rationale: 문맥이 금상에 대한 강제적 종교 행위를 묘사하므로, 원문이 지닌 신학적 긴장을 약화시키지 않기 위해 경배의 의미를 유지했습니다.
  doctrine_reference: Daniel 3장의 우상 숭배 비판 및 제국 충성 요구에 대한 본문 맥락
