base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
  footnotes:
  - marker: a
    text: The exact identification of several instrument names is uncertain. 'Trigon' may refer to a triangular harp, and 'psaltery' may denote a kind of zither or harp.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그때에 모든 민족이 뿔나팔, 피리, 수금, 트리곤, 프살테리온과 모든 종류의 음악 소리를 들었을 때, 모든 민족과 나라와 언어를 쓰는 사람들이 엎드려 바벨론 왕 느부갓네살이 세운 금상에 경배했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 열거된 악기 이름 가운데 몇몇의 정확한 식별은 확실하지 않습니다. ‘트리곤’은 삼각형 모양의 하프를 가리킬 수 있으며, ‘프살테리온’은 일종의 치터나 하프를 가리킬 수 있습니다.
    reason: lexical_alternative
