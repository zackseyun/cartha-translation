id: DAN.11.37
reference: Daniel 11:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל אֱלֹהֵ֤י אֲבֹתָי/ו֙ לֹ֣א יָבִ֔ין וְ/עַל חֶמְדַּ֥ת נָשִׁ֛ים וְ/עַֽל כָּל אֱל֖וֹהַּ לֹ֣א יָבִ֑ין כִּ֥י עַל כֹּ֖ל יִתְגַּדָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/037.yaml
  text: He will show no regard for the gods of his fathers[a], or for the desire of women, or for any god[b], because he will magnify himself above all.
  footnotes:
  - marker: a
    text: Or 'the God of his fathers.' The Hebrew form is plural ('gods of'), but some take it as the familiar idiom for Israel's God.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the desire of women.' This may mean 'what women desire' or 'the one desired by women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 조상들의 신들[a]도, 여인들의 갈망[b]도, 어떤 신도 마음에 두지 않을 것입니다. 그가 모든 것 위에 자신을 높일 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 조상들의 하나님’. 히브리어 형태는 복수(‘조상들의 신들’)이지만, 이스라엘의 하나님을 가리키는 익숙한 관용으로 보는 해석도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘여인들의 갈망’. 이는 ‘여인들이 바라는 것’ 또는 ‘여인들이 원하는 대상’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אֲבֹתָיו
  english_pob_choice: the gods of his fathers
  chosen_korean: 조상들의 신들
  alternatives_korean:
  - 그의 조상들의 하나님
  - 조상들의 하나님
  lexicon: HALOT
  rationale: 히브리어 복수형 אֱלֹהֵי를 살려 복수의 ‘신들’로 옮겼습니다. 다만 전통적 단수 독해 가능성도 커서 각주로 보존합니다.
- source_word: לֹא יָבִין
  english_pob_choice: he will show no regard for
  chosen_korean: 주의를 기울이지 않을 것입니다
  alternatives_korean:
  - 이해하지 않을 것입니다
  - 돌보지 않을 것입니다
  - 마음에 두지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 ‘이해하다’보다 대상을 향해 관심과 배려를 두지 않는 뜻이므로, 현대 한국어에서 자연스럽게 그 의미를 살렸습니다.
- source_word: חֶמְדַּת נָשִׁים
  english_pob_choice: the desire of women
  chosen_korean: 여인들의 갈망
  alternatives_korean:
  - 여인들이 바라는 것
  - 여인들이 원하는 대상
  lexicon: HALOT
  rationale: 히브리어의 모호성을 보존하기 위해 직설적이되 해석을 단정하지 않는 표현을 택했습니다. 영어 POB처럼 여성들의 소망인지, 여인들이 원하는 대상인지 열어 둡니다.
- source_word: כָּל אֱלוֹהַּ
  english_pob_choice: any god
  chosen_korean: 어떤 신
  alternatives_korean:
  - 모든 신
  - 어느 신
  lexicon: HALOT
  rationale: כָּל + 단수형의 분배적 의미를 살려 ‘어떤 신’으로 옮겼습니다. 한국어에서도 전면적 무관심을 자연스럽게 드러냅니다.
- source_word: יִתְגַּדָּל
  english_pob_choice: he will magnify himself above all
  chosen_korean: 스스로를 높일
  alternatives_korean:
  - 스스로를 크게 할
  - 자신을 높일
  lexicon: HALOT
  rationale: 히트파엘의 자기고양 의미를 반영했습니다. 뒤의 ‘모든 것보다’와 결합해 비교의 뜻이 분명히 드러나도록 했습니다.
theological_decisions:
- issue: אֱלֹהֵי אֲבֹתָיו의 단수/복수
  chosen_reading: 본문 형태를 따라 복수 ‘조상들의 신들’로 옮겼습니다.
  alternative_readings:
  - ‘그의 조상들의 하나님’이라는 전통적 단수 독해
  rationale: 형태론적 복수와 문맥의 ‘어떤 신’이 서로 맞물리므로, 해석을 단수로 미리 수렴하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §1: Original-language primacy over translation tradition.'
- issue: חֶמְדַּת נָשִׁים의 모호성
  chosen_reading: ‘여인들의 갈망’으로 두어, 여성들이 갈망하는 대상인지 여인들의 일반적 소망인지 단정하지 않았습니다.
  alternative_readings:
  - ‘여인들이 바라는 것’
  - ‘여인들이 원하는 대상’
  rationale: 히브리어가 실제로 모호하므로, 본문이 허용하는 범위를 넘어서 특정 해석을 고정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
