revisions:
- from: 그때에 많은 이가 남방 왕을 대적하여 일어날 것이며, 당신의 백성 가운데 포악한 자들이 스스로 높아져 환상을 세우려 하나[a][b][c], 그러나 그들은 걸려 넘어질 것입니다.
  to: 그 시기에 많은 이가 남방 왕을 대적하여 일어날 것이며, 당신의 백성 가운데 포악한 자들이 자신을 높여 그 이상을 이루려 하나[a][b][c], 그들은 걸려 넘어질 것입니다.
  rationale: ‘그 시기에’는 히브리어 복수 시간 표현을 자연스럽게 반영합니다. חָזוֹן은 다니엘서의 용어 일관성과 현대 한국어의 명료성을 위해 ‘이상’으로 옮겼습니다. 본문의 ‘그 이상을 이루려’는 לְהַעֲמִיד חָזוֹן의 문맥상 관용적 의미를 자연스럽게 전달하며, ‘확립하려’라는 더 직역적인 가능성은 각주에 보존했습니다. 재귀 동사의 뜻은 ‘자신을 높여’로 명확히 했고, 포악한 집단의 정체는 해석적으로 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:23Z'
