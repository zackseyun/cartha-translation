source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם רַבִּ֥ים יַֽעַמְד֖וּ עַל מֶ֣לֶךְ הַ/נֶּ֑גֶב וּ/בְנֵ֣י פָּרִיצֵ֣י עַמְּ/ךָ֗ יִֽנַּשְּׂא֛וּ לְ/הַעֲמִ֥יד חָז֖וֹן וְ/נִכְשָֽׁלוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/014.yaml
  text: And in those times many will rise up against the king of the South[a], and the violent among your people will lift themselves up to establish the vision[c][b], but they will stumble.
  footnotes:
  - marker: a
    text: Or 'the sons of the violent among your people'; the Hebrew expression is literally more complex than the smooth English rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'to fulfill the vision.'
    reason: alternative_reading
  - marker: c
    text: Or 'will lift themselves up'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 많은 이가 남방 왕을 대적하여 일어날 것이며, 당신의 백성 가운데 포악한 자들이 스스로 높아져 환상을 세우려 하나[a][b][c], 그러나 그들은 걸려 넘어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 백성 가운데 포악한 자들의 아들들’; 히브리어 표현은 매끄러운 한국어보다 더 복합적입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘환상을 이루려’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘스스로 높여’.
    reason: previous_rendering
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  english_pob_choice: And in those times
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그런 때에
  lexicon: HALOT
  rationale: 복수형 ‘때들’의 시간적 배경을 한국어에서 자연스럽게 압축해 옮겼습니다.
- source_word: רַבִּים יַעַמְד֖וּ עַל
  english_pob_choice: many will rise up against
  chosen_korean: 많은 이가 … 대적하여 일어날 것이며
  alternatives_korean:
  - 많은 이가 … 맞서 일어날 것이며
  - 많은 이가 … 대항하여 일어날 것이며
  lexicon: HALOT
  rationale: ‘עמד על’의 적대적 대항을 살리되, 한국어에서 가장 자연스럽게 충돌을 드러내는 ‘대적하여 일어나다’로 옮겼습니다.
- source_word: וּבְנֵי פָּרִיצֵי עַמְּךָ
  english_pob_choice: the violent among your people
  chosen_korean: 당신의 백성 가운데 포악한 자들
  alternatives_korean:
  - 당신의 백성 가운데 폭력적인 자들
  - 당신의 백성 가운데 불법한 자들
  lexicon: HALOT
  rationale: ‘sons of’의 집합적 용법을 살려 ‘자들’로 자연화했고, פָּרִיצִים의 비난조는 ‘포악한’으로 보존했습니다.
- source_word: יִנַּשְּׂא֛וּ
  english_pob_choice: will lift themselves up / will exalt themselves
  chosen_korean: 스스로 높아져
  alternatives_korean:
  - 스스로 높이며
  - 자기를 높여
  lexicon: HALOT
  rationale: 반사적·자기고양의 뉘앙스를 살리되 한국어에서 과도하게 물리적인 이미지를 피했습니다.
- source_word: לְהַעֲמִ֥יד חָז֖וֹן
  english_pob_choice: to establish the vision
  chosen_korean: 환상을 세우려
  alternatives_korean:
  - 환상을 확립하려
  - 환상을 이루려
  lexicon: HALOT
  rationale: ‘העמיד’의 ‘세우다/확립하다’ 의미를 보존하면서, 다니엘서의 ‘חזון’을 ‘환상’으로 직역에 가깝게 옮겼습니다.
- source_word: וְנִכְשָׁלוּ
  english_pob_choice: but they will stumble
  chosen_korean: 그러나 그들은 걸려 넘어질 것입니다
  alternatives_korean:
  - 그러나 그들은 넘어질 것입니다
  - 그러나 그들은 실패할 것입니다
  lexicon: HALOT
  rationale: ‘כשל’의 기본 이미지인 걸림과 넘어짐을 유지해, 결과가 단순 실패인지 더 넓은 붕괴인지 열어 두었습니다.
theological_decisions:
- issue: וּבְנֵי פָּרִיצֵי עַמְּךָ의 집합적 표현 처리
  chosen_reading: ‘당신의 백성 가운데 포악한 자들’로 옮겨, 출신 집단 표지를 과도하게 풀지 않았습니다.
  alternative_readings:
  - ‘당신의 백성 가운데 포악한 자들의 아들들’
  - ‘당신의 백성 가운데 불법한 자들’
  rationale: 본문의 모호성을 유지하면서도, 특정 세력이나 후대 집단을 암시하는 해석을 서두르지 않기 위함입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: לְהַעֲמִיד חָזוֹן의 의미
  chosen_reading: ‘환상을 세우려’로 두어, 그들이 환상을 ‘성취’하는지 ‘확립’하는지의 해석 여지를 남겼습니다.
  alternative_readings:
  - ‘환상을 이루려’
  - ‘환상을 성취하려’
  rationale: 동사는 ‘세우다/확립하다’ 쪽이 더 직접적이지만, 문맥상 그 환상에 대한 행동의 방향이 다의적이어서 주석 가능성을 열어 두는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
