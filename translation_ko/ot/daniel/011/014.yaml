  - 그런 때에
  lexicon: HALOT
  rationale: 복수형 ‘때들’의 시간적 배경을 한국어에서 자연스럽게 압축해 옮겼습니다.
- source_word: רַבִּים יַעַמְד֖וּ עַל
  english_pob_choice: many will rise up against
  chosen_korean: 많은 이가 … 대적하여 일어날 것이며
