  to: 그 여자의 뿌리에서 난 한 가지[a]가 그의 자리에 일어나, 군대를 향해 와서 북방 왕의 요새에 들어가[b] 그들을 상대로 행동하고[c] 우세를 점할 것입니다.[d]
