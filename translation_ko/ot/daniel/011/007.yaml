source:
  edition: WLC
  text: וְ/עָמַ֛ד מִ/נֵּ֥צֶר שָׁרָשֶׁ֖י/הָ כַּנּ֑/וֹ וְ/יָבֹ֣א אֶל הַ/חַ֗יִל וְ/יָבֹא֙ בְּ/מָעוֹז֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/עָשָׂ֥ה בָ/הֶ֖ם וְ/הֶחֱזִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/007.yaml
  text: And one from a branch of her roots shall arise in his place[a], and he shall come against the army and enter the fortress of the king of the north[d][c][b], and he shall act against them and prevail.
  footnotes:
  - marker: a
    text: Or 'from a shoot/offshoot of her roots,' that is, from her family line.
    reason: lexical_alternative
  - marker: b
    text: Or 'enter the stronghold of the king of the north.'
    reason: lexical_alternative
  - marker: c
    text: Or 'deal with them' or 'act among them'; the Hebrew idiom is broad.
    reason: lexical_alternative
  - marker: d
    text: Or 'show strength' or 'gain the upper hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자의 뿌리에서 난 한 가지[a]가 그의 자리에 일어나, 군대를 향해 와서 북방 왕의 요새에 들어가[b] 그들을 상대로 행동하고[c] 우세를 점할 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자의 뿌리에서 난 새순/가지’. 혈통상의 후손을 가리키는 비유적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘북방 왕의 견고한 성에 들어가’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들을 다루고’ 또는 ‘그들 가운데서 행동하고’. 히브리어 관용구는 넓은 의미를 지닙니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘강해질 것입니다’ 또는 ‘힘을 발휘할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  english_pob_choice: shall arise
  chosen_korean: 일어서서
  alternatives_korean:
  - 일어나
  - 등장하여
  lexicon: HALOT
  rationale: 예언적 계승 문맥에서 단순한 ‘서다’보다 ‘일어서다’가 새 인물의 등장과 자리 차지를 자연스럽게 드러냅니다.
- source_word: מִנֵּצֶר שָׁרָשֶׁיהָ
  english_pob_choice: from a branch of her roots
  chosen_korean: 그 뿌리의 한 가지에서 나온
  alternatives_korean:
  - 그 뿌리의 새싹에서 나온
  - 그 뿌리의 가지에서 나온
  lexicon: HALOT
  rationale: 비유를 살리되 한국어에서 자연스럽게 읽히도록 ‘한 가지’로 옮겨, 혈통적 출신이라는 의미를 유지했습니다.
- source_word: בְּמָעוֹז מֶלֶךְ הַצָּפוֹן
  english_pob_choice: the fortress of the king of the north
  chosen_korean: 북방 왕의 요새 안으로
  alternatives_korean:
  - 북방 왕의 요새로
  - 북방 왕의 견고한 성으로
  lexicon: HALOT
  rationale: מָעוֹז의 요새/견고한 성 의미를 반영하면서, 동작의 방향을 나타내는 문맥에 맞게 ‘안으로’로 풀었습니다.
- source_word: וְעָשָׂה בָהֶם
  english_pob_choice: he shall act against them
  chosen_korean: 그들을 대적하여 행동하고
  alternatives_korean:
  - 그들을 상대로 일하고
  - 그들에게 행하고
  lexicon: HALOT
  rationale: 히브리어 관용구의 폭을 유지하면서도 전투 문맥상 적대적 행동임을 분명히 했습니다.
- source_word: וְהֶחֱזִיק
  english_pob_choice: and prevail
  chosen_korean: 마침내 이깁니다
  alternatives_korean:
  - 우세를 점합니다
  - 승리합니다
  lexicon: HALOT
  rationale: 힘을 얻어 우위를 차지한다는 결과를 자연스러운 현대 한국어로 나타내되, 전쟁 맥락의 승리를 분명히 했습니다.
theological_decisions:
- issue: 왕조적 계승을 나타내는 동사의 뉘앙스
  chosen_reading: ‘일어서서’로 번역해 새로운 인물의 등장과 자리 교체를 함께 드러냈습니다.
  alternative_readings:
  - ‘서다’로 더 직역
  - ‘등장하다’로 더 해석적 번역
  rationale: 본문은 단순한 물리적 동작보다 후계/대체의 의미를 지니므로, 직역과 해석 사이의 균형을 취했습니다.
  doctrine_reference: 예언서의 역사 서술에서 문맥이 동사의 계승적 의미를 규정함
- issue: 전쟁 서술의 결과를 표현하는 ‘הֶחֱזִיק’
  chosen_reading: ‘마침내 이깁니다’로 결과 중심의 승리를 표현했습니다.
  alternative_readings:
  - ‘힘을 얻습니다’
  - ‘우세를 점합니다’
  rationale: 문맥상 단순한 내적 강함보다 군사적 성공이 핵심이므로, 결과를 분명히 하는 표현을 택했습니다.
  doctrine_reference: 문맥 우선의 역사-예언 본문 해석
