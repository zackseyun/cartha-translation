id: DAN.11.35
reference: Daniel 11:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הַ/מַּשְׂכִּילִ֣ים יִכָּֽשְׁל֗וּ לִ/צְר֥וֹף בָּ/הֶ֛ם וּ/לְ/בָרֵ֥ר וְ/לַ/לְבֵּ֖ן עַד עֵ֣ת קֵ֑ץ כִּי ע֖וֹד לַ/מּוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
  footnotes:
  - marker: a
    text: Or 'will fall.' The Hebrew verb keeps the image of stumbling and may refer to downfall through persecution or trial.
    reason: lexical_alternative
  - marker: b
    text: Or 'by them' or 'through them' for 'among them'; the Hebrew phrase is concise and may indicate the refining occurs within this group or through what happens to them.
    reason: lexical_alternative
  - marker: c
    text: '''Made white'' is a literal rendering of the Hebrew image, expressing cleansing or purification.'
    reason: lexical_alternative
  - marker: d
    text: Or 'for the appointed time is yet to come.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜 있는 이들 중의 일부는 넘어질 것입니다[a]. 그렇게 하여 그들이 연단되고, 정결하게 되고, 희게 될 것입니다[b][c], 끝의 때까지[d]. 이는 아직 정해진 때를 위한 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘넘어질 것입니다.’ 히브리어 동사는 비틀거리며 넘어지는 이미지를 유지하며, 박해나 시험으로 인한 몰락을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 전치사구는 간결하여, 연단이 이 무리 안에서 또는 그들에게 일어나는 과정을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘희게 될 것입니다’는 히브리어의 문자적 이미지를 살린 표현으로, 정결이나 깨끗함의 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘정해진 때가 아직 오지 않았기까지.’
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הַמַּשְׂכִּילִים
  english_pob_choice: some of those who have insight
  chosen_korean: 지혜 있는 이들 중의 일부
  alternatives_korean:
  - 분별 있는 이들 중의 일부
  - 통찰력 있는 이들 중의 일부
  lexicon: HALOT
  rationale: מִן의 부분적 용법을 살려 ‘중의 일부’로 옮기고, מַשְׂכִּילִים는 단순한 지식인이 아니라 분별/통찰을 지닌 사람들을 가리키므로 자연스러운 표준어로 표현했습니다.
- source_word: יִכָּשְׁלוּ
  english_pob_choice: will stumble
  chosen_korean: 넘어질 것입니다
  alternatives_korean:
  - 실족할 것입니다
  - 쓰러질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘비틀거리며 넘어짐’ 이미지를 살리되, 문맥상 박해나 시련을 포함할 수 있어도 너무 해석적으로 좁히지 않도록 했습니다.
- source_word: לִצְרוֹף ... וּלְבָרֵר וְלַלְבֵּן
  english_pob_choice: to refine ... to purify ... to make white
  chosen_korean: 연단되고, 정결하게 되고, 희게 될 것입니다
  alternatives_korean:
  - 정련되고, 깨끗하게 되고, 하얗게 될 것입니다
  - 제련되고, 정결하게 되고, 희게 될 것입니다
  lexicon: HALOT
  rationale: 연단/정결/희게 함의 3중 이미지를 한국어로 자연스럽게 살리되, 금속 제련의 원문 비유는 ‘연단’으로 반영하고 나머지 두 동사는 결과 상태로 옮겼습니다.
- source_word: עַד עֵת קֵץ
  english_pob_choice: until the time of the end
  chosen_korean: 끝의 때까지
  alternatives_korean:
  - 끝의 때까지
  - 마지막 때까지
  lexicon: HALOT
  rationale: 다니엘서의 관용구를 짧고 직역적으로 보존했습니다. ‘끝의 때’는 종말적 시점을 가리키는 원문의 어감을 유지합니다.
- source_word: כִּי עוֹד לַמּוֹעֵד
  english_pob_choice: for it is still for the appointed time
  chosen_korean: 이는 아직 정해진 때를 위한 것이기 때문입니다
  alternatives_korean:
  - 이는 아직 정해진 때가 남아 있기 때문입니다
  - 이는 아직 정해진 때를 위한 것입니다
  lexicon: HALOT
  rationale: מוֹעֵד를 ‘정해진 때’로 옮겨 하나님의 지정된 시기를 드러내고, 원문의 설명절을 한국어 원인 표현으로 매끈하게 처리했습니다.
theological_decisions:
- issue: 연단 목적절의 뉘앙스
  chosen_reading: 넘어짐은 단순 예측이 아니라 정결과 연단을 위한 목적을 지닌 것으로 옮겼습니다.
  alternative_readings:
  - 단순한 미래 예고로만 읽는 해석
  - 박해를 통한 성화 교리를 더 강하게 명시하는 해석
  rationale: 히브리어의 부정사 연쇄는 목적/결과를 함께 담을 수 있으므로, 본문이 말하는 신적 연단의 기능은 살리되 그 이상을 과도하게 신학화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
