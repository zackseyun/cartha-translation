base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
  footnotes:
  - marker: a
    text: Or 'will fall.' The Hebrew verb keeps the image of stumbling and may refer to downfall through persecution or trial.
    reason: lexical_alternative
  - marker: b
    text: Or 'by them' or 'through them' for 'among them'; the Hebrew phrase is concise and may indicate the refining occurs within this group or through what happens to them.
    reason: lexical_alternative
  - marker: c
    text: '''Made white'' is a literal rendering of the Hebrew image, expressing cleansing or purification.'
    reason: lexical_alternative
  - marker: d
    text: Or 'for the appointed time is yet to come.'
    reason: alternative_reading
translation:
  language: ko
  text: 지혜 있는 이들 중 몇몇은 넘어질 것입니다[a]. 이는 끝의 때까지 그들이 그들 가운데서 연단되고[b], 정결해지며, 희게 되도록 하기 위함입니다[c]. 정해진 때가 아직 남아 있기 때문입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘실족할 것입니다.’ 히브리어 동사는 비틀거리거나 넘어지는 이미지를 유지하며, 박해나 시련으로 인한 몰락을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 가운데서’로 옮긴 히브리어 전치사구는 간결합니다. 이 연단이 이 무리 안에서 일어남을 뜻할 수도 있고, ‘그들에 의해’ 또는 ‘그들을 통하여’라는 관계를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘희게 되다’는 히브리어의 문자적 이미지를 살린 표현이며, 정결하거나 깨끗해짐을 나타냅니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘정해진 때가 아직 오지 않았기 때문입니다.’
    reason: alternative_reading
