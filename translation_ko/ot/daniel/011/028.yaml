id: DAN.11.28
reference: Daniel 11:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשֹׁ֤ב אַרְצ/וֹ֙ בִּ/רְכ֣וּשׁ גָּד֔וֹל וּ/לְבָב֖/וֹ עַל בְּרִ֣ית קֹ֑דֶשׁ וְ/עָשָׂ֖ה וְ/שָׁ֥ב לְ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/028.yaml
  text: Then he will return to his land with great wealth[a], but his heart will be against the holy covenant[b]; and he will act and return to his land.
  footnotes:
  - marker: a
    text: Or 'with great possessions'; the Hebrew term can denote property, goods, or wealth.
    reason: lexical_alternative
  - marker: b
    text: Or 'his heart will be against the holy covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 큰 재물[a]을 가지고 자기 땅으로 돌아오겠지만, 그의 마음은 거룩한 언약[b]을 대적할 것이며, 그는 일을 행하고 자기 땅으로 돌아갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 소유를 가지고’. 히브리어는 재산, 소유물, 재물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 마음은 거룩한 언약을 거스를 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכוּשׁ גָּדוֹל
  english_pob_choice: with great wealth
  chosen_korean: 큰 재물을 가지고
  alternatives_korean:
  - 많은 소유를 가지고
  - 큰 부를 가지고
  - 많은 재물을 가지고
  lexicon: HALOT
  rationale: רְכוּשׁ는 소유물, 재산, 재물을 아우를 수 있으므로, 문맥의 군사·정치적 귀환에 어울리도록 ‘큰 재물’로 옮기되 소유의 넓은 범위를 유지했습니다.
- source_word: וּלְבָבוֹ עַל בְּרִית קֹדֶשׁ
  english_pob_choice: but his heart will be against the holy covenant
  chosen_korean: 그의 마음은 거룩한 언약을 향해 대적할 것입니다
  alternatives_korean:
  - 그의 마음은 거룩한 언약에 נגד할 것입니다
  - 그의 마음은 거룩한 언약을 거스를 것입니다
  - 그의 마음은 거룩한 언약을 향해 있습니다
  lexicon: HALOT
  rationale: לֵבָב + עַל은 단순한 방향 표시보다 적대적 태도를 나타내므로, 직역의 딱딱함보다 한국어에서 자연스럽고 적대감을 분명히 하는 ‘대적하다’를 선택했습니다.
- source_word: וְעָשָׂה
  english_pob_choice: and he will act
  chosen_korean: 그리고 그는 행동하고
  alternatives_korean:
  - 그리고 그는 행할 것이며
  - 그리고 그는 조치할 것입니다
  - 그리고 그는 행하고
  lexicon: HALOT
  rationale: עשה는 의미가 넓어 구체적 목적어를 덧붙이지 않고, 간결하게 ‘행동하다’로 옮겨 히브리어의 압축성을 살렸습니다.
- source_word: וְשָׁב לְאַרְצוֹ
  english_pob_choice: and return to his land
  chosen_korean: 자기의 땅으로 돌아갈 것입니다
  alternatives_korean:
  - 그의 땅으로 돌아갈 것입니다
  - 자기 나라로 돌아갈 것입니다
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 지리적·정치적 ‘땅’을 뜻하는 것이 자연스럽기 때문에 ‘나라’보다 직접적으로 ‘땅’으로 유지했습니다.
theological_decisions:
- issue: ‘거룩한 언약’의 지시 대상
  chosen_reading: 해석을 확정하지 않고 ‘거룩한 언약’ 자체를 유지했습니다.
  alternative_readings:
  - 하나님의 백성과 관련된 언약 질서
  - 유대교
  - 언약 공동체
  rationale: 본문은 설명을 덧붙이지 않고 적대 대상만 제시하므로, 이후 해석의 여지를 남기기 위해 언약 용어를 그대로 보존했습니다.
  doctrine_reference: 본문의 신학적 긴장을 해소하지 않고 보존
