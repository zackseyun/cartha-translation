    text: 또는, ‘그는 남쪽 왕의 왕국으로 들어갈 것이며, 자기 땅으로 돌아갈 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  english_pob_choice: Then he will come
  chosen_korean: 그는 … 들어갈 것입니다
  alternatives_korean:
  - 그는 … 올 것입니다
  - 그는 … 들어가게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 וּבָא는 단순 이동을 뜻하며, 앞선 서술과 이어지는 진행을 한국어로 자연스럽게 나타내기 위해 미래형으로 옮겼습니다.
- source_word: בְּמַלְכוּת
  english_pob_choice: into the realm
  chosen_korean: 나라로
  alternatives_korean:
  - 왕국으로
  - 영역으로
  - 통치권 안으로
  lexicon: HALOT
  rationale: 문맥상 정치·지리적 지배 영역을 가리키므로, 방향을 나타내는 조사와 함께 ‘나라로’로 옮겨 자연스럽게 처리했습니다.
- source_word: מֶלֶךְ הַנֶּגֶב
  english_pob_choice: the king of the South
  chosen_korean: 남쪽 왕
  alternatives_korean:
  - 남방 왕
  - 남쪽의 왕
  - 네게브 왕
  lexicon: HALOT
  rationale: 다니엘 11장의 대립 구도에서 남쪽 세력을 가리키는 관용 표현이므로, ‘남쪽 왕’으로 옮겨 지리적 지정어 기능을 살렸습니다.
- source_word: וְשָׁב אֶל אַדְמָתֽוֹ
  english_pob_choice: but he will return to his own land
  chosen_korean: 자기 땅으로 돌아갈 것입니다
  alternatives_korean:
  - 자기 땅으로 돌아올 것입니다
  - 그의 땅으로 돌아갈 것입니다
  - 자기 땅으로 되돌아갈 것입니다
  lexicon: HALOT
  rationale: אַדְמָה는 문자적으로 땅/토지를 뜻하므로, 소유격을 살린 ‘자기 땅’이 문맥에 가장 자연스럽고 원뜻에도 가깝습니다.
theological_decisions:
- issue: בְּ + 동사 בוא의 방향성 반영
  chosen_reading: ‘들어갈 것입니다’로 옮기되, 전치사 בְ의 방향성을 문맥상 ‘나라로’에 반영했습니다.
  alternative_readings:
  - ‘나라 안으로 들어갈 것입니다’
  - ‘그 나라에 들어갈 것입니다’
  rationale: 도입 동사와 방향 전치사를 분리해 처리하면 히브리어의 진행·방향 감각을 과도하게 평탄화하지 않으면서도 한국어 문장을 자연스럽게 유지할 수 있습니다.
  doctrine_reference: 문맥적 충실성 및 히브리어 통사 보존
- issue: 남쪽 왕의 ‘나라’와 ‘자기 땅’의 대조
  chosen_reading: 침공 대상의 영역과 귀환처를 서로 대조되게 번역했습니다.
  alternative_readings:
  - 두 구절 모두 ‘영역’으로 통일
  - 두 구절 모두 ‘땅’으로 통일
  rationale: 본문은 타자의 지배 영역과 자신의 귀환지를 대비하므로, 같은 단어를 기계적으로 반복하기보다 한국어에서 의미 대조가 드러나도록 조정했습니다.
  doctrine_reference: 문맥적 의미 대비
