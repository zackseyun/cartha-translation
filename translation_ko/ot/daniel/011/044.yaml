  edition: WLC
  text: וּ/שְׁמֻע֣וֹת יְבַהֲלֻ֔/הוּ מִ/מִּזְרָ֖ח וּ/מִ/צָּפ֑וֹן וְ/יָצָא֙ בְּ/חֵמָ֣א גְדֹלָ֔ה לְ/הַשְׁמִ֥יד וּֽ/לְ/הַחֲרִ֖ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
  footnotes:
  - marker: a
    text: Or 'rumors' or 'news' from the east and north.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can mean 'to put under the ban' or 'to devote to destruction,' a stronger and more specific term than the preceding 'destroy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 동쪽과 북쪽에서 오는 소식이 그를 불안하게 할 것이며, 그는 큰 격분으로 나가 많은 사람을 멸하고 또 멸망에 바칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소식’은 여기서 ‘rumors/news/reports’의 중립적 범주를 택한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸망에 바치다’는 히브리어 חרם의 특수한 뉘앙스—단순한 파괴보다 더 강한 전면적 금지·전멸—를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻע֣וֹת
  english_pob_choice: reports
  chosen_korean: 소식
  alternatives_korean:
  - 보고
  - 보고들
  - 뉴스
  - 루머
  lexicon: HALOT
  rationale: 복수형 ‘들려온 것들’이라는 뜻을 자연스럽게 살리면서, 현대 한국어에서 지나치게 신문체가 되지 않게 했습니다. 본문 문맥상 확인된 정보인지 불확실한 소문인지가 열려 있으므로 ‘소식’이 가장 중립적입니다.
- source_word: יְבַהֲלֻ֔הוּ
  english_pob_choice: will alarm him
  chosen_korean: 그를 불안하게 할 것이며
  alternatives_korean:
  - 그를 놀라게 할 것이며
  - 그를 두렵게 할 것이며
  - 그를 혼란스럽게 할 것이며
  lexicon: HALOT
  rationale: בהל의 원뜻인 급작스러운 동요·당황·두려움을 한국어에서 단순한 ‘놀람’보다 넓게 담기 위해 ‘불안하게 하다’를 택했습니다.
- source_word: בְּ/חֵמָ֣א גְדֹלָ֔ה
  english_pob_choice: with great fury
  chosen_korean: 큰 격분으로
  alternatives_korean:
  - 큰 분노로
  - 큰 진노로
  - 큰 맹렬함으로
  lexicon: HALOT
  rationale: חֵמָה의 강한 분노/격앙을 현대적이고 자연스럽게 옮기되, 단순 감정표현보다 행동을 촉발하는 격렬함을 드러내기 위해 ‘격분’을 사용했습니다.
- source_word: וּֽ/לְ/הַחֲרִ֖ים
  english_pob_choice: to devote many to destruction
  chosen_korean: 멸망에 바칠 것입니다
  alternatives_korean:
  - 진멸할 것입니다
  - 진멸에 바칠 것입니다
  - 완전히 멸할 것입니다
  - 저주 아래 두어 멸할 것입니다
  lexicon: HALOT
  rationale: לְהַשְׁמִיד와 구별되는 חרם의 특수한 ‘바쳐진 멸망/금지됨’ 뉘앙스를 살리기 위해, 단순한 ‘멸하다’보다 의도적·전면적 파괴를 드러내는 표현을 택했습니다. ‘바치다’는 헌납의 역설적 구조를 반영합니다.
theological_decisions:
- issue: לְהַשְׁמִיד와 וּלְהַחֲרִים의 구별 보존
  chosen_reading: ‘멸하고 또 멸망에 바칠 것입니다’로 두 동사의 차이를 유지했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘진멸하다’로 평준화
  - ‘없애고 완전히 멸할 것입니다’로 일반화
  rationale: 히브리어는 단순 파괴(הַשְׁמִיד)와 חרם의 특별한 전멸/금지 개념을 구분하므로, 번역에서도 동일어 반복으로 평준화하지 않고 의미 차이를 보존해야 합니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency or documented exception)
