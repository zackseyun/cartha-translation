  - 큰 진노로
  - 큰 맹렬함으로
  lexicon: HALOT
  rationale: חֵמָה의 강한 분노/격앙을 현대적이고 자연스럽게 옮기되, 단순 감정표현보다 행동을 촉발하는 격렬함을 드러내기 위해 ‘격분’을 사용했습니다.
- source_word: וּֽ/לְ/הַחֲרִ֖ים
  english_pob_choice: to devote many to destruction
  chosen_korean: 멸망에 바칠 것입니다
  alternatives_korean:
  - 진멸할 것입니다
  - 진멸에 바칠 것입니다
  - 완전히 멸할 것입니다
  - 저주 아래 두어 멸할 것입니다
  lexicon: HALOT
  rationale: לְהַשְׁמִיד와 구별되는 חרם의 특수한 ‘바쳐진 멸망/금지됨’ 뉘앙스를 살리기 위해, 단순한 ‘멸하다’보다 의도적·전면적 파괴를 드러내는 표현을 택했습니다. ‘바치다’는 헌납의 역설적 구조를 반영합니다.
theological_decisions:
- issue: לְהַשְׁמִיד와 וּלְהַחֲרִים의 구별 보존
  chosen_reading: ‘멸하고 또 멸망에 바칠 것입니다’로 두 동사의 차이를 유지했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘진멸하다’로 평준화
  - ‘없애고 완전히 멸할 것입니다’로 일반화
  rationale: 히브리어는 단순 파괴(הַשְׁמִיד)와 חרם의 특별한 전멸/금지 개념을 구분하므로, 번역에서도 동일어 반복으로 평준화하지 않고 의미 차이를 보존해야 합니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency or documented exception)
