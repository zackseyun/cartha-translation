base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
  footnotes:
  - marker: a
    text: Or 'rumors' or 'news' from the east and north.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can mean 'to put under the ban' or 'to devote to destruction,' a stronger and more specific term than the preceding 'destroy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 동쪽과 북쪽에서 오는 소식이 그를 불안하게 할 것이며, 그는 큰 분노를 품고 나서서 많은 사람을 멸하고 진멸에 바칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소식’은 ‘보고’, ‘뉴스’, ‘소문’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진멸에 바치다’는 히브리어 חרם의 특수한 용법을 반영합니다. 이는 앞의 ‘멸하다’와 달리, 사람들을 멸망시키도록 바치거나 금령 아래 두는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻע֣וֹת
  english_pob_choice: reports
  chosen_korean: 소식
  alternatives_korean:
  - 보고
  - 보고들
  - 뉴스
  - 루머
  lexicon: HALOT
  rationale: 복수형 ‘들려온 것들’이라는 뜻을 자연스럽게 살리면서, 현대 한국어에서 지나치게 신문체가 되지 않게 했습니다. 본문 문맥상 확인된 정보인지 불확실한 소문인지가 열려 있으므로 ‘소식’이 가장 중립적입니다.
- source_word: יְבַהֲלֻ֔הוּ
  english_pob_choice: will alarm him
  chosen_korean: 그를 불안하게 할 것이며
  alternatives_korean:
  - 그를 놀라게 할 것이며
  - 그를 두렵게 할 것이며
  - 그를 혼란스럽게 할 것이며
  lexicon: HALOT
  rationale: בהל의 원뜻인 급작스러운 동요·당황·두려움을 한국어에서 단순한 ‘놀람’보다 넓게 담기 위해 ‘불안하게 하다’를 택했습니다.
- source_word: בְּ/חֵמָ֣א גְדֹלָ֔ה
  english_pob_choice: with great fury
  chosen_korean: 큰 격분으로
  alternatives_korean:
