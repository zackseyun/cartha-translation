id: DAN.11.25
reference: Daniel 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָעֵר֩ כֹּח֨/וֹ וּ/לְבָב֜/וֹ עַל מֶ֣לֶךְ הַ/נֶּגֶב֮ בְּ/חַ֣יִל גָּדוֹל֒ וּ/מֶ֣לֶךְ הַ/נֶּ֗גֶב יִתְגָּרֶה֙ לַ/מִּלְחָמָ֔ה בְּ/חַֽיִל גָּד֥וֹל וְ/עָצ֖וּם עַד מְאֹ֑ד וְ/לֹ֣א יַעֲמֹ֔ד כִּֽי יַחְשְׁב֥וּ עָלָ֖י/ו מַחֲשָׁבֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/025.yaml
  text: And he will stir up his power and his heart against the king of the South with a great army[a], and the king of the South will engage in battle with a very great and mighty army, but he will not stand[b], for they will devise schemes against him.
  footnotes:
  - marker: a
    text: Or 'he will not prevail' / 'he will not hold his ground.' The Hebrew literally reads 'he will not stand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they will plot against him.' The Hebrew uses a cognate expression, literally 'they will think thoughts against him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 큰 군대를 거느리고 남쪽 왕을 향해 자신의 힘을 모으고 마음을 다잡을 것이며, 남쪽 왕도 매우 크고 강한 군대를 거느리고 싸움에 나설 것이나, 남쪽 왕은 버티지 못할 것입니다. 그들이 남쪽 왕을 상대로 계략을 꾸밀 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָעֵר כֹּחוֹ וּלְבָבוֹ
  english_pob_choice: he will stir up his power and his heart
  chosen_korean: 자기의 힘과 마음을 일으킬 것이며
  alternatives_korean:
  - 자기의 힘과 심장을 불러일으킬 것이며
  - 자기의 능력과 결의를 북돋울 것이며
  lexicon: HALOT
  rationale: 히필의 עור는 ‘일으키다/불러일으키다’의 뉘앙스를 가지며, לֵב/לֵבָב은 단순 감정보다 결의와 내적 태도를 포함하므로 ‘힘과 마음’으로 옮겨 군사적 결단을 살렸습니다.
- source_word: מֶלֶךְ הַנֶּגֶב
  english_pob_choice: the king of the South
  chosen_korean: 남쪽 왕
  alternatives_korean:
  - 남방 왕
  - 네게브의 왕
  lexicon: HALOT
  rationale: 다니엘 11장에서 נֶגֶב은 지리적·정치적 방향 용법이므로, 문맥에 가장 자연스러운 ‘남쪽 왕’으로 옮겼습니다.
- source_word: בְּחַיִל גָּדוֹל / בְּחַיִל גָּדוֹל וְעָצוּם עַד מְאֹד
  english_pob_choice: with a great army / with a very great and mighty army
  chosen_korean: 큰 군대 / 매우 크고 강한 군대
  alternatives_korean:
  - 거대한 군대
  - 매우 크고 위력한 군대
  lexicon: HALOT
  rationale: חַיִל은 군사적 맥락에서 ‘군대/군사력’을 뜻하므로 ‘군대’로 풀었고, גָּדוֹל, עָצוּם, עַד מְאֹד의 중첩된 강조는 ‘매우 크고 강한’으로 살렸습니다.
- source_word: וְלֹא יַעֲמֹד
  english_pob_choice: but he will not stand
  chosen_korean: 그는 버티지 못할 것입니다
  alternatives_korean:
  - 그는 서지 못할 것입니다
  - 그는 승리하지 못할 것입니다
  - 그는 굳건히 서지 못할 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘서지 못하다’이지만, 문맥상 패배·지속 실패를 뜻하므로 한국어에서 자연스러운 ‘버티지 못하다’로 옮겨 원문의 관용을 드러냈습니다.
- source_word: יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת
  english_pob_choice: they will devise schemes against him
  chosen_korean: 그를 상대로 계략을 꾸밀 것이기 때문입니다
  alternatives_korean:
  - 그를 상대로 계획을 세울 것이기 때문입니다
  - 그를 해치려 음모를 꾸밀 것이기 때문입니다
  lexicon: HALOT
  rationale: ‘생각들을 생각하다’라는 히브리어 중첩 표현은 적대적 책략을 뜻하므로, 노골적이되 과도하게 확장하지 않는 ‘계략을 꾸미다’가 적절합니다.
