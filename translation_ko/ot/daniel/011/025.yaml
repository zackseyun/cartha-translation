- from: 그가 큰 군대를 거느리고 남쪽 왕을 향해 자기의 힘과 마음을 일으킬 것이며, 남쪽 왕도 매우 크고 강한 군대를 거느리고 싸움에 나설 것이나, 그는 버티지 못할 것입니다. 그들이 그를 상대로 계략을 꾸밀 것이기 때문입니다.
  to: 그가 큰 군대를 거느리고 남쪽 왕을 향해 자신의 힘을 모으고 마음을 다잡을 것이며, 남쪽 왕도 매우 크고 강한 군대를 거느리고 싸움에 나설 것이나, 남쪽 왕은 버티지 못할 것입니다. 그들이 남쪽 왕을 상대로 계략을 꾸밀 것이기 때문입니다.
  rationale: The revision preserves the Hebrew sequence and military imagery while replacing a wooden Korean collocation with an idiomatic equivalent for mobilizing strength and resolve. It also identifies the king of the South explicitly in the final two clauses, faithfully reflecting the contextual referent of the Hebrew singular pronouns and avoiding ambiguity in Korean.
  reviewer_model: gpt-5.6-terra
