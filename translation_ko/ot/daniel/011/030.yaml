revisions:
- from: 깃딤의 배들이 그에게 닥칠 것이며, 그는 낙심할 것입니다. 그러고는 돌아서서 거룩한 언약에 분노하며 행동할 것이며[b], 다시 돌아서서 거룩한 언약을 버리는 자들을 주목할 것입니다.
  to: 깃딤의 배들이 그에게 닥칠 것이며, 그는 낙심할 것입니다. 그는 돌아가 거룩한 언약에 분노하고 행동할 것이며, 다시 돌아가 거룩한 언약을 버리는 자들에게 주목할 것입니다.
  rationale: 원문의 반복된 שׁוּב를 ‘돌아가’와 ‘다시 돌아가’로 보존하고, 목적어 없는 וְעָשָׂה는 ‘행동하다’로 넓게 유지했습니다. 원문에 없는 행동의 대상을 부여하는 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:07Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 사건 순서와 핵심 어휘를 잘 반영합니다. 그러나 וְעָשָׂה는 목적어가 명시되지 않은 넓은 동사인데, 현 각주가 이를 ‘거룩한 언약에 대해’ 행하는 것으로 한정하여 원문에 없는 목적어를 보탭니다.
  naturalness: ‘낙심할 것입니다’, ‘거룩한 언약을 버리는 자들’, ‘주목할 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘돌아서서’보다 문맥상 이동·회귀를 나타내는 ‘돌아가’가 שׁוּב의 반복을 더 직접적으로 드러냅니다.
  terminology: ‘깃딤’, ‘거룩한 언약’은 원문의 지명 및 신학적 표현을 불필요하게 해석적으로 좁히지 않고 보존합니다. ‘행동할 것입니다’는 וְעָשָׂה의 의도적인 넓이를 유지합니다.
  issues:
  - severity: medium
    issue: 각주 b가 ‘행동하다’의 대상을 ‘거룩한 언약에 대해’라고 한정합니다.
    rationale: 히브리어 וְעָשָׂה에는 이 동사의 목적어가 명시되어 있지 않습니다. 본문의 바로 앞 ‘거룩한 언약’에 문법적으로 연결해 행동의 대상을 확정하는 것은 번역상 과도한 보충입니다. 영어 감사 기록의 해당 각주도 본문상 안전한 대안으로 기능하지 않으므로 한국어 본문에는 유지하지 않는 것이 좋습니다.
  revised_text: 깃딤의 배들이 그에게 닥칠 것이며, 그는 낙심할 것입니다. 그는 돌아가 거룩한 언약에 분노하고 행동할 것이며, 다시 돌아가 거룩한 언약을 버리는 자들에게 주목할 것입니다.
