id: DAN.11.30
reference: Daniel 11:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֨אוּ ב֜/וֹ צִיִּ֤ים כִּתִּים֙ וְ/נִכְאָ֔ה וְ/שָׁ֛ב וְ/זָעַ֥ם עַל בְּרִֽית ק֖וֹדֶשׁ וְ/עָשָׂ֑ה וְ/שָׁ֣ב וְ/יָבֵ֔ן עַל עֹזְבֵ֖י בְּרִ֥ית קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/030.yaml
  text: For ships of Kittim will come against him[a], and he will be disheartened. Then he will turn back and rage against the holy covenant, and he will act[b]. He will turn back and pay attention to those who forsake the holy covenant.
  footnotes:
  - marker: a
    text: Or 'ships from Kittim'; Kittim can refer to Cyprus or, more broadly, western maritime powers.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will show regard for' those who forsake the holy covenant.
    reason: lexical_alternative
translation:
  language: ko
  text: 깃딤의 배들이 그에게 닥칠 것이며, 그는 낙심할 것입니다. 그는 돌아가 거룩한 언약에 분노하고 행동할 것이며, 다시 돌아가 거룩한 언약을 버리는 자들에게 주목할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיִּים כִּתִּים
  english_pob_choice: ships of Kittim
  chosen_korean: 깃딤의 배들
  alternatives_korean:
  - 깃딤에서 온 배들
  - 서방의 배들
  - 키프로스의 배들
  lexicon: HALOT
  rationale: צִיִּים는 해상 선박을, כִּתִּים은 깃딤/서방 해상 세력을 가리키므로, ‘깃딤의 배들’이 원문의 지리적 표현을 살리면서도 자연스럽습니다.
- source_word: וְנִכְאָה
  english_pob_choice: and he will be disheartened
  chosen_korean: 낙심할 것입니다
  alternatives_korean:
  - 굴복할 것입니다
  - 눌릴 것입니다
  - 상심할 것입니다
  lexicon: HALOT
  rationale: 전투적·정치적 문맥에서 위압을 받아 기세가 꺾이는 의미이므로, 물리적 파괴보다 심리적 좌절을 드러내는 ‘낙심하다’가 적절합니다.
- source_word: וְזָעַם
  english_pob_choice: and rage against
  chosen_korean: 분노하며
  alternatives_korean:
  - 격분하며
  - 진노하며
  - 격노하며
  lexicon: HALOT
  rationale: 대상에 대한 적대적 분노를 나타내므로, 한국어에서는 뒤의 ‘거룩한 언약에’와 자연스럽게 결합하는 방식으로 옮겼습니다.
- source_word: וְיָבֵן
  english_pob_choice: and pay attention to
  chosen_korean: 주목할 것입니다
  alternatives_korean:
  - 살필 것입니다
  - 눈여겨볼 것입니다
  - 주의를 기울일 것입니다
  lexicon: HALOT
  rationale: 여기서는 단순한 이해보다 특정 집단을 의식하여 관심을 두는 뉘앙스가 강하므로, ‘주목하다’가 영어 POB의 ‘pay attention to’와 가장 가깝습니다.
- source_word: עֹזְבֵי
  english_pob_choice: those who forsake
  chosen_korean: 거룩한 언약을 버리는 자들
  alternatives_korean:
  - 거룩한 언약을 떠나는 자들
  - 거룩한 언약을 저버리는 자들
  lexicon: HALOT
  rationale: עֹזְבֵי는 언약을 떠나거나 버리는 사람들을 가리키므로, 관계 파기를 분명히 드러내는 ‘버리는 자들’이 적절합니다.
theological_decisions:
- issue: ‘거룩한 언약’의 범위
  chosen_reading: 본문의 표현을 그대로 유지하여, 그 언약을 더 좁게 특정하지 않았습니다.
  alternative_readings:
  - 유대인의 언약
  - 하나님이 이스라엘과 맺으신 언약
  rationale: 히브리어는 언약의 정체를 암시하지만, 본문 자체는 범위를 더 구체화하지 않으므로 해석을 확정하지 않고 남겨 두는 것이 좋습니다.
  doctrine_reference: 의미의 긴장을 보존하고 본문이 말하는 수준을 넘지 않음
