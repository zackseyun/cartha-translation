id: DAN.11.23
reference: Daniel 11:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הִֽתְחַבְּר֥וּת אֵלָ֖י/ו יַעֲשֶׂ֣ה מִרְמָ֑ה וְ/עָלָ֥ה וְ/עָצַ֖ם בִּ/מְעַט גּֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/023.yaml
  text: And from the time of an alliance with him[a], he will act deceitfully; and he will rise and become strong with a small nation.
  footnotes:
  - marker: a
    text: Or 'with a few people.' The Hebrew phrase בִּמְעַט גּוֹי is compact and may emphasize either a small nation or a small number of people by whom he becomes strong.
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 동맹을 맺은 뒤부터 그는 속임수를 쓰고, 올라가 적은 민족을 통해 강해질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בִּמְעַט גּוֹי는 직역하면 ‘적은 민족으로/통해’입니다. 이 압축된 표현은 ‘소수의 사람들을 통해’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן הִֽתְחַבְּר֥וּת אֵלָ֖יו
  english_pob_choice: And from the time of an alliance with him
  chosen_korean: 그리고 그와의 동맹으로부터
  alternatives_korean:
  - 그리고 그와 결합한 때로부터
  - 그리고 그와의 연합에서부터
  - 그리고 그와 맺은 동맹으로부터
  lexicon: WLC; HALOT
  rationale: 히브리어의 출발점 전치사와 명사형은 관계의 시작점을 말하지만, 한국어에서는 ‘동맹으로부터’가 정치적 결속의 출발을 가장 자연스럽게 살립니다.
- source_word: יַעֲשֶׂה מִרְמָה
  english_pob_choice: he will act deceitfully
  chosen_korean: 그는 속임수를 행할 것이며
  alternatives_korean:
  - 그는 기만을 행할 것이며
  - 그는 속임수를 부릴 것이며
  - 그는 배신을 행할 것이며
  lexicon: HALOT
  rationale: ‘עשה + 미드마’의 관용적 결합을 직역에 가깝게 살리되, 한국어에서 어색하지 않도록 ‘속임수를 행하다’로 옮겼습니다.
- source_word: וְעָלָה וְעָצַם
  english_pob_choice: and he will rise and become strong
  chosen_korean: 올라가서 ... 강해질 것입니다
  alternatives_korean:
  - 일어나서 ... 강해질 것입니다
  - 올라가서 ... 세력을 얻을 것입니다
  - 일어나 ... ძლ
  lexicon: HALOT
  rationale: עלה는 단순한 상승을 넘어 권력의 고양을, עצם은 강해짐을 뜻하므로, ‘올라가서 강해지다’로 연속된 상승과 강화의 흐름을 유지했습니다.
- source_word: בִּמְעַט גּוֹי
  english_pob_choice: with a small nation
  chosen_korean: 적은 민족으로
  alternatives_korean:
  - 작은 민족으로
  - 소수의 사람들로
  - 적은 나라로
  lexicon: HALOT
  rationale: בִּמְעַט은 수량의 적음을, גּוֹי는 민족/나라를 가리키므로, 한국어에서는 ‘적은 민족’이 본문의 압축성과 모호성을 함께 유지합니다.
theological_decisions:
- issue: בִּמְעַט גּוֹי의 의미 범위
  chosen_reading: ‘적은 민족’으로 두어 규모가 작은 민족집단을 기본 의미로 유지했습니다.
  alternative_readings:
  - ‘소수의 사람들’로 풀어 읽기
  - ‘작은 나라’로 정치 단위를 강조하기
  rationale: 히브리어는 소수의 사람들과 작은 민족/나라를 모두 열어 두지만, 문맥상 정치적 세력의 형성을 말하므로 너무 좁게 개인 집단으로 고정하지 않되, 본문이 허용하는 압축성을 보존했습니다.
  doctrine_reference: 문맥적 해석; 다니엘 11장의 역사-정치적 서술
- issue: 동맹 이후의 전개를 서술하는 시제
  chosen_reading: 미래형 ‘...할 것입니다’를 사용해 예언적 서술의 연속성을 살렸습니다.
  alternative_readings:
  - 현재형 서술
  - 완곡한 미래형 회피
  rationale: 히브리어 연속 동사들은 예언적 서술에서 미래 전개를 나타내므로, 한국어에서도 미래형으로 옮겨 본문의 예언적 긴장을 유지했습니다.
  doctrine_reference: 예언서의 미래-서술 관습
