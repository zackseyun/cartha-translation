source:
  edition: WLC
  text: וְ/שָׁב֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/הֶעֱמִ֣יד הָמ֔וֹן רַ֖ב מִן הָ/רִאשׁ֑וֹן וּ/לְ/קֵ֨ץ הָֽ/עִתִּ֤ים שָׁנִים֙ יָ֣בוֹא ב֔וֹא בְּ/חַ֥יִל גָּד֖וֹל וּ/בִ/רְכ֥וּשׁ רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/013.yaml
  text: Then the king of the north will return and raise a multitude greater than the former one[a]; and at the end of the times, after some years[c][b], he will surely come with a great army and with much equipment.
  footnotes:
  - marker: a
    text: Or 'a great multitude' for 'a multitude.' The Hebrew phrase can explicitly stress size as well as number.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the end of the appointed times, after years.' The Hebrew expression is compressed and may emphasize a set period having run its course.
    reason: lexical_alternative
  - marker: c
    text: Or 'with great supplies' for 'with much equipment.' The Hebrew can refer broadly to possessions or resources accompanying the campaign.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 북방 왕은 돌아와서 이전의 것보다 더 큰 무리를 일으킬 것이며[a], 시대의 끝, 곧 여러 해가 지난 뒤에[b] 반드시 큰 군대와 많은 보급품을 거느리고 올 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전의 것보다 더 큰 무리’로도 옮길 수 있습니다. 히브리어는 수적 규모뿐 아니라 크기까지 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정해진 때의 끝, 곧 여러 해가 지난 뒤’로도 옮길 수 있습니다. 히브리어 표현은 정해진 기간이 다 지나감을 압축해 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘많은 물자와 함께’로도 옮길 수 있습니다. 히브리어는 원정에 동반되는 소유물이나 자원을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ הַצָּפוֹן
  english_pob_choice: the king of the north
  chosen_korean: 북방 왕
  alternatives_korean:
  - 북쪽의 왕
  - 북의 왕
  lexicon: WLC/문맥
  rationale: 다니엘 11장의 반복되는 방향 표지를 살려 직역에 가깝게 옮겼습니다.
- source_word: הָמוֹן רַב
  english_pob_choice: a multitude
  chosen_korean: 무리
  alternatives_korean:
