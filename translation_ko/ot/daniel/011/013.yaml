review_pass:
  verdict: revise
  source_fidelity: 전반적으로 북방 왕의 귀환, 이전보다 더 큰 집단의 동원, 시간 경과 후의 재침공, 큰 군대와 풍부한 물자의 동행을 충실히 반영합니다. 다만 רְכוּשׁ는 ‘보급품’보다 소유물·물자·자원을 넓게 가리키므로, ‘많은 물자’가 원문의 범위를 더 잘 보존합니다. ‘시대의 끝’은 הָעִתִּים의 표현을 한국어에서 부자연스럽게 재현하므로 조정이 필요합니다.
  naturalness: ‘시대의 끝, 곧 여러 해가 지난 뒤’는 현대 표준 한국어에서 다소 직역투이고 시간 관계도 불분명합니다. ‘정해진 때들이 끝날 무렵, 여러 해 후에’는 원문의 압축성과 두 시간 표현을 유지하면서 더 자연스럽습니다. 원문의 ‘함께’에 맞추어 ‘물자와 함께 올 것입니다’로 하는 편이 ‘물자를 거느리고’보다 자연스럽습니다.
  terminology: ‘북방 왕’과 ‘큰 군대’는 다니엘 11장의 반복되는 군사·방향 표지에 적절합니다. ‘무리’는 הָמוֹן의 폭넓은 의미를 유지합니다. ‘많은 물자’는 רְכוּשׁ의 폭넓은 물질적 자원이라는 의미를 보존합니다.
  issues:
  - severity: medium
    issue: ‘시대의 끝’이라는 시간 표현
    rationale: הָעִתִּים는 문맥상 ‘때들/정해진 때들’을 뜻하며, ‘시대의 끝’은 한국어에서 우주론적 시대의 종말처럼 들릴 수 있습니다. ‘정해진 때들이 끝날 무렵’이 더 자연스럽고 어휘 범위에도 맞습니다.
  - severity: medium
    issue: רְכוּשׁ을 ‘보급품’으로 한정함
    rationale: רְכוּשׁ는 보급품에만 한정되지 않고 소유물, 물자, 자원 등을 넓게 뜻합니다. 군사 문맥을 살리면서도 의미를 좁히지 않는 ‘많은 물자’가 안전합니다.
  - severity: low
    issue: 각주 a가 본문의 표현을 그대로 반복함
