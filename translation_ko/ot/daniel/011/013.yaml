  lexicon: HALOT
  rationale: hebrew הָמוֹן의 핵심 의미를 넓게 살려 군사적 맥락을 유지하되, 뒤의 ‘군대’와 중복되지 않도록 간결하게 옮겼습니다.
- source_word: וּבִרְכוּשׁ רָב
  english_pob_choice: with much equipment
  chosen_korean: 많은 보급품
  alternatives_korean:
