  rationale: רְכוּשׁ은 재산·소유물·자원까지 포괄하므로, 원정 동반 자원을 드러내는 ‘보급품’이 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: “with a great army”의 군사적 구체성
  chosen_reading: ‘큰 군대’로 직접 옮겨 실제 군사 동원을 분명히 했습니다.
  alternative_readings:
  - 큰 힘으로
  - 큰 전력으로
  rationale: 문맥이 전쟁 원정이므로 추상화보다 군사 집합을 드러내는 번역이 원문의 의도를 더 잘 전달합니다.
  doctrine_reference: 문맥 우선 원칙
- issue: וְשָׁב의 서술 진행
  chosen_reading: 첫 문장을 ‘그때’로 시작해 연속 서술을 살렸습니다.
  alternative_readings:
  - 그리고 돌아와
  - 그리하여 돌아와
  rationale: 히브리어 접속사의 서사적 진행을 한국어에서 자연스러운 시간 연결로 반영했습니다.
  doctrine_reference: 서사 연결 보존
