id: DAN.11.8
reference: Daniel 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֣ם אֱֽלֹהֵי/הֶ֡ם עִם נְסִֽכֵי/הֶם֩ עִם כְּלֵ֨י חֶמְדָּתָ֜/ם כֶּ֧סֶף וְ/זָהָ֛ב בַּ/שְּׁבִ֖י יָבִ֣א מִצְרָ֑יִם וְ/הוּא֙ שָׁנִ֣ים יַעֲמֹ֔ד מִ/מֶּ֖לֶךְ הַ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/008.yaml
  text: He will also carry off to Egypt their gods[a], with their cast images and with their precious vessels of silver and gold, as plunder; and for some years he will stand aloof from the king of the north.
  footnotes:
  - marker: a
    text: Or, 'for some years he will continue longer than the king of the north,' or 'he will remain stronger than the king of the north for years.' The Hebrew clause is compressed and may be read comparatively rather than as abstention.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 또한 그들의 신들과 그들의 주조한 형상들과 은과 금으로 된 그들의 귀중한 기물들을 노획물로 이집트로 가져갈 것이며, 몇 해 동안 북방 왕과 거리를 두고 지낼 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 북방 왕보다 몇 해 더 오래 지속될 것이다’ 또는 ‘그는 몇 해 동안 북방 왕보다 더 강하게 남아 있을 것이다’. 히브리어 절은 압축되어 있어 비교의 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their gods
  chosen_korean: 그들의 신들
  alternatives_korean:
  - 그들의 신상들
  - 그들의 우상들
  lexicon: HALOT
  rationale: 본문은 복수 형태의 신들을 직접 말하므로 기본적으로 ‘신들’로 옮기되, 우상성은 문맥이 드러냅니다.
- source_word: נְסִכֵיהֶם
  english_pob_choice: their cast images
  chosen_korean: 그들의 부어 만든 우상들
  alternatives_korean:
  - 그들의 주조한 형상들
  - 그들의 금속 우상들
  lexicon: HALOT
  rationale: 주조하여 만든 형상이라는 제작 방식을 살리면서, 한국어에서는 ‘우상들’이 자연스럽고 의미도 분명합니다.
- source_word: כְּלֵי חֶמְדָּתָם
  english_pob_choice: their precious vessels
  chosen_korean: 그들의 귀중한 그릇들
  alternatives_korean:
  - 그들의 값진 기물들
  - 그들의 귀한 기물들
  lexicon: HALOT
  rationale: כְּלֵי는 그릇/기물의 넓은 범위를 가지며, 궁정·성전 맥락에서는 ‘그릇들’이 가장 직접적입니다.
- source_word: בַּשְּׁבִי
  english_pob_choice: as plunder
  chosen_korean: 노략물로
  alternatives_korean:
  - 전리품으로
  - 노획물로
  lexicon: HALOT
  rationale: 전쟁에서 빼앗은 물건이라는 뜻을 한국어 관용에 맞게 간결하게 살렸습니다.
- source_word: יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  english_pob_choice: he will stand aloof from the king of the north
  chosen_korean: 북방 왕에게서 떨어져 있을 것입니다
  alternatives_korean:
  - 북방 왕에게서 물러서 있을 것입니다
  - 북방 왕과 거리를 둘 것입니다
  - 북방 왕을 상대로 공격을 멈출 것입니다
  lexicon: HALOT
  rationale: עָמַד + מִן의 분리/거리 두기 이미지를 살려, 해석을 과도하게 좁히지 않고 현대 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן의 의미
  chosen_reading: 북방 왕과의 직접적 대결이나 개입에서 일정 기간 떨어져 있는 상태를 말하는 것으로 두었습니다.
  alternative_readings:
  - 북방 왕보다 몇 해 더 오래 버틴다는 비교적 의미
  - 북방 왕보다 더 강한 상태로 몇 해 남아 있다는 의미
  rationale: 히브리어가 압축되어 있어 비교적 해석도 가능하지만, 본문은 전쟁 후의 거리 두기 이미지를 더 직접적으로 보여 주므로 이를 본문에 반영하고 다른 가능성은 본문 밖에 남겨 두는 편이 더 투명합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
