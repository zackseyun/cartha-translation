id: DAN.11.20
reference: Daniel 11:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָמַ֧ד עַל כַּנּ֛/וֹ מַעֲבִ֥יר נוֹגֵ֖שׂ הֶ֣דֶר מַלְכ֑וּת וּ/בְ/יָמִ֤ים אֲחָדִים֙ יִשָּׁבֵ֔ר וְ/לֹ֥א בְ/אַפַּ֖יִם וְ/לֹ֥א בְ/מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/020.yaml
  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
  footnotes:
  - marker: a
    text: Or 'a tax collector' or 'an oppressor' for 'an exactor.' The Hebrew term denotes one who exacts tribute or payment.
    reason: lexical_alternative
  - marker: b
    text: Or 'the glory of the kingdom.' The phrase may refer to the most splendid part of the realm or to the kingdom's majesty more generally.
    reason: lexical_alternative
  - marker: c
    text: Or 'but not in anger' or 'not by wrath.' The Hebrew expression is somewhat compressed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 자리에 한 사람이 일어나 그 왕국의 화려함[a][b] 속으로 수금 담당자를 보내겠지만, 그는 며칠 안 되어 부서질 것입니다[c]. 그러나 분노로도, 전쟁으로도 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조세 징수관’이나 ‘압제자’일 수 있습니다. כאן의 표현은 공납이나 대가를 징수하는 자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 왕국의 영광’입니다. 이 표현은 나라의 가장 화려한 부분이나 왕국의 위엄 자체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘분노로’ 혹은 ‘진노로’입니다. 히브리어 표현은 압축되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל כַּנּוֹ
  english_pob_choice: Then one will arise in his place
  chosen_korean: 그의 자리에 한 사람이 일어나
  alternatives_korean:
  - 그의 자리에서 한 사람이 일어나
  - 그 자리에 한 사람이 서게 되며
  lexicon: HALOT
  rationale: 다윗 왕조의 계승 맥락에서 עמד על־כנו는 단순한 ‘서다’가 아니라 ‘대신 일어나다/계승하다’의 뜻이므로, 자연스러운 한국어로 ‘그의 자리에 … 일어나’로 옮겼습니다.
- source_word: מַעֲבִיר נוֹגֵשׂ
  english_pob_choice: who will send an exactor
  chosen_korean: 수금 담당자를 보내겠지만
  alternatives_korean:
  - 조세 징수관을 보내겠지만
  - 압제자를 보내겠지만
  lexicon: HALOT
  rationale: נוגשׂ는 조세·공납을 거두는 자의 뜻이 가능하므로, ‘수금 담당자’로 비교적 넓게 유지해 POB의 ‘exactor’가 지닌 범위를 보존했습니다.
- source_word: הֶדֶר מַלְכֻת
  english_pob_choice: the splendor of the kingdom
  chosen_korean: 그 왕국의 화려함
  alternatives_korean:
  - 그 왕국의 영광
  - 그 나라의 위엄
  lexicon: HALOT
  rationale: הדר는 ‘영광’도 가능하지만 미적·왕실적 ‘화려함/장엄함’의 뉘앙스가 있어, 문맥의 궁정적 장면을 살리면서도 의미 범위를 좁히지 않도록 했습니다.
- source_word: יִשָּׁבֵר
  english_pob_choice: he will be broken
  chosen_korean: 부서질 것입니다
  alternatives_korean:
  - 깨질 것입니다
  - 무너질 것입니다
  - 파멸될 것입니다
  lexicon: HALOT
  rationale: 니팔형 שבר의 이미지가 ‘깨지다/부서지다’에 가깝기 때문에, 직접적이되 과도한 해석을 피하는 ‘부서질 것입니다’를 선택했습니다.
theological_decisions:
- issue: וְלֹא בְאַפַּיִם וְלֹא בְמִלְחָמָה의 종결 방식
  chosen_reading: 그는 분노로도, 전쟁으로도 끝나지 않습니다
  alternative_readings:
  - 그는 분노 때문도 아니고 전쟁 때문도 아닙니다
  - 분노 가운데서도, 전쟁 가운데서도 아닙니다
  rationale: 히브리어는 압축되어 있어 원인이 아닌 방식/매개를 모두 열어 두며, POB의 ‘not in anger and not in battle’를 따라 종말의 방식이 폭력적 공개 충돌이 아님을 드러내도록 했습니다.
  doctrine_reference: Historical-narrative ambiguity; no doctrinal implication beyond the text's compressed causal phrasing.
