revisions:
- from: 그의 자리에 한 사람이 일어나 그 왕국의 화려함[a][b] 속으로 수금 담당자를 보내겠지만, 그는 며칠 안 되어 부서질 것입니다[c]. 그러나 분노로도, 전쟁으로도 아닙니다.
