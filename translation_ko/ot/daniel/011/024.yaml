source:
  edition: WLC
  text: בְּ/שַׁלְוָ֞ה וּ/בְ/מִשְׁמַנֵּ֣י מְדִינָה֮ יָבוֹא֒ וְ/עָשָׂ֗ה אֲשֶׁ֨ר לֹא עָשׂ֤וּ אֲבֹתָי/ו֙ וַ/אֲב֣וֹת אֲבֹתָ֔י/ו בִּזָּ֧ה וְ/שָׁלָ֛ל וּ/רְכ֖וּשׁ לָ/הֶ֣ם יִבְז֑וֹר וְ/עַ֧ל מִבְצָרִ֛ים יְחַשֵּׁ֥ב מַחְשְׁבֹתָ֖י/ו וְ/עַד עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/024.yaml
  text: 'In a time of security he will come into the richest parts of the province[a], and he will do what neither his fathers nor his fathers’ fathers did: he will scatter among them plunder, spoil, and goods; and against fortresses he will devise his plans[c][b], but only until a time.'
  footnotes:
  - marker: a
    text: Or, 'peaceably' or 'unexpectedly' he will enter the richest parts of the province.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he will distribute to them plunder, spoil, and possessions.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'he will plot against strongholds,' or 'until the appointed time.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 평안한 때에 지방의 가장 살진 곳으로 들어오고, 그의 조상들도 그의 조상의 조상들도 하지 못한 일을 할 것입니다. 그는 그들에게 노략한 물건과 전리품과 재물을 흩어 주고, 요새들을 향해서는 자기 계획을 세울 것입니다. 그러나 그것은 한때에 지나지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화롭게’ 혹은 ‘예기치 않게’ 그는 지방의 가장 살진 곳으로 들어올 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 그들에게 노략한 물건과 전리품과 재물을 나누어 줄 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그는 요새들을 상대로 책략을 꾸밀 것입니다.’ 혹은 ‘정해진 때까지.’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשַׁלְוָה
  english_pob_choice: In a time of security
  chosen_korean: 평안한 때에
  alternatives_korean:
  - 안전한 때에
  - 평온한 때에
  - 예기치 않게
  lexicon: HALOT
  rationale: שַׁלְוָה는 평온함·안정·안전을 가리키므로, 전쟁 맥락에서 자연스럽게 읽히는 ‘평안한 때에’로 옮겨 상황의 안정성과 기습적 침투 가능성을 함께 살렸습니다.
- source_word: וּבְמִשְׁמַנֵּי מְדִינָה
  english_pob_choice: into the richest parts of the province
  chosen_korean: 지방의 가장 살진 곳으로
  alternatives_korean:
  - 지방의 가장 기름진 곳으로
  - 나라의 가장 풍요로운 곳으로
  lexicon: HALOT
  rationale: מִשְׁמַנִּים의 문자적 뜻인 ‘살진/기름진’ 이미지를 살리되 한국어에서 자연스럽게 읽히도록 ‘가장 살진 곳’으로 옮겼습니다. מְדִינָה는 행정 구역의 뜻으로 ‘지방’이 무난합니다.
- source_word: בִּזָּה וְשָׁלָל וּרְכוּשׁ
  english_pob_choice: plunder, spoil, and goods
  chosen_korean: 노략한 물건과 전리품과 재물
  alternatives_korean:
  - 약탈물과 전리품과 소유물
  - 전리품과 노획물과 재산
  lexicon: HALOT
  rationale: 세 명사는 서로 겹치지만 완전히 동일하지 않으므로 누적된 어감을 살렸습니다. רְכוּשׁ은 단순한 ‘goods’보다 ‘재물’이 소유·가치를 함께 드러냅니다.
- source_word: וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  english_pob_choice: and against fortresses he will devise his plans
  chosen_korean: 요새들을 향해서는 자기 계획을 세울 것입니다
  alternatives_korean:
  - 요새들을 상대로는 자기 계략을 꾸밀 것입니다
  - 견고한 성들에 맞서 그는 책략을 세울 것입니다
  lexicon: HALOT
  rationale: יְחַשֵּׁב מַחְשְׁבֹתָיו는 직역하면 ‘생각을 생각하다’로, ‘계획/계략을 세우다’의 관용적 표현입니다. מִבְצָרִים은 전쟁 문맥에 맞게 ‘요새들’로 옮겼습니다.
theological_decisions:
- issue: וְעַד עֵת의 시간 한정이 ‘정해진 때’인지 여부
  chosen_reading: 그러나 그것은 한때에 지나지 않을 것입니다
  alternative_readings:
  - 그러나 그것은 정해진 때까지일 것입니다
  - 그러나 그것은 얼마 동안뿐일 것입니다
  rationale: 본문은 단지 ‘그리고/그러나 한때까지’라고만 말하므로, ‘정해진’을 덧붙여 섭리적 확정을 강하게 못 박지 않고 제한성만 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
