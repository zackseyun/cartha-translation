    issue: ‘하지 못한 일’
    rationale: עָשׂוּ의 부정은 ‘하지 않았다’이며, ‘하지 못했다’는 원문에 없는 무능 또는 불가능의 뉘앙스를 더합니다.
  - severity: medium
    issue: ‘한때에 지나지 않을 것입니다’
    rationale: וְעַד עֵת는 ‘한때까지’라는 시간적 한계를 나타냅니다. ‘한때에 지나지 않다’는 기간의 짧음에 초점을 옮기며, ‘까지’의 경계를 충분히 반영하지 못합니다.
