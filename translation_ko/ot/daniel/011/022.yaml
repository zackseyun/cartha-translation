id: DAN.11.22
reference: Daniel 11:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/זְרֹע֥וֹת הַ/שֶּׁ֛טֶף יִשָּׁטְפ֥וּ מִ/לְּ/פָנָ֖י/ו וְ/יִשָּׁבֵ֑רוּ וְ/גַ֖ם נְגִ֥יד בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/022.yaml
  text: The flood-like forces will be swept away from before him and be broken[b][a], and also the prince of the covenant.
  footnotes:
  - marker: a
    text: Literally, 'arms of the flood'; likely an idiom for overwhelming military forces.
    reason: lexical_alternative
  - marker: b
    text: Or 'the leader of the covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 홍수 같은 군대는 그 앞에서 쓸려가고 부서지며, 또한 언약의 군주도 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘홍수의 팔들’입니다. 여기서는 군사적 힘을 가리키는 관용으로 보는 것이 자연합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘언약의 지도자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרֹעוֹת הַשֶּׁטֶף
  english_pob_choice: the flood-like forces
  chosen_korean: 그 홍수 같은 군대
  alternatives_korean:
  - 그 홍수의 팔들
  - 홍수 같은 힘들
  - 홍수 같은 무리
  lexicon: HALOT
  rationale: זְרֹעוֹת를 문자적으로 ‘팔들’로 옮길 수 있지만, 영어 POB가 이미 군사적 힘을 가리키는 관용으로 보았으므로 한국어도 문맥상 자연한 ‘군대’로 풀어 표현하되 ‘홍수 같은’으로 이미지도 살렸습니다.
- source_word: יִשָּׁטְפוּ
  english_pob_choice: will be swept away
  chosen_korean: 쓸려가고
  alternatives_korean:
  - 휩쓸리고
  - 홍수에 휩쓸려 가고
  - 쓸려 버리고
  lexicon: HALOT
  rationale: 홍수 이미지와 수동적 파괴를 살려 ‘쓸려가다’로 옮겼으며, 이어지는 ‘부서지다’와 병렬을 이루도록 현재 서술형으로 정리했습니다.
- source_word: וְיִשָּׁבֵרוּ
  english_pob_choice: and be broken
  chosen_korean: 부서지며
  alternatives_korean:
  - 깨지며
  - 산산이 부서지며
  - 꺾이며
  lexicon: HALOT
  rationale: שבר의 ‘깨지다/부서지다’ 의미를 따라 과도하게 해석하지 않고, 무너짐의 정도를 열어 두는 ‘부서지다’를 택했습니다.
- source_word: נְגִיד בְּרִית
  english_pob_choice: the prince of the covenant
  chosen_korean: 언약의 군주
  alternatives_korean:
  - 언약의 왕자
  - 언약의 지도자
  - 언약의 통치자
  lexicon: HALOT
  rationale: נְגִיד는 왕자라기보다 ‘지도자/통치자’에 가깝지만, 다니엘서의 격을 살리고 영어 POB의 ‘prince’를 반영해 ‘군주’로 옮겼습니다. ‘언약’은 정관계 의미를 유지하기 위해 그대로 살렸습니다.
theological_decisions:
- issue: ‘언약의 군주’의 역사적 인물 식별 여부
  chosen_reading: 번역문에서는 인물을 특정하지 않고 직역형 칭호로 남겼습니다.
  alternative_readings:
  - 대제사장 오니아스 3세
  - 더 일반적인 언약 지도자
  - 메시아적 인물
  rationale: 히브리어 표현 자체가 역사적 동일시를 명시하지 않으므로, 번역에서 해석을 선취하지 않고 긴장을 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: 해석 쟁점을 번역으로 고정하지 않음
