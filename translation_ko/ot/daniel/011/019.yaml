  source_fidelity: 마지막 절 וְלֹא יִמָּצֵא는 문자적으로 ‘발견되지 않을 것이다/찾을 수 없게 될 것이다’입니다. 초안의 ‘보이지 않게 될 것입니다’는 단순히 시야에서 보이지 않는다는 뜻으로 좁혀질 수 있어, ‘발견되다’라는 원문의 표현과 그 간접성을 충분히 보존하지 못합니다. 또한 각주 표지는 해당 어구에 직접 붙이는 편이 적절합니다.
  naturalness: ‘그의 땅의 요새들’과 ‘얼굴을 돌릴 것입니다’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘걸려 넘어지고 쓰러져’는 두 히브리어 동사를 자연스럽게 이어 줍니다.
  terminology: מָעוּזֵּי는 문맥상 ‘요새들’이 적절합니다. ‘더 이상 발견되지 않을 것입니다’는 죽음이나 폐위의 방식을 단정하지 않으면서 לֹא יִמָּצֵא의 수동 표현을 보존합니다.
