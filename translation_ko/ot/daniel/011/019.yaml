id: DAN.11.19
reference: Daniel 11:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשֵׁ֣ב פָּנָ֔י/ו לְ/מָעוּזֵּ֖י אַרְצ֑/וֹ וְ/נִכְשַׁ֥ל וְ/נָפַ֖ל וְ/לֹ֥א יִמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/019.yaml
  text: Then he will turn his face toward the fortresses of his own land[a], but he will stumble and fall[b], and he will not be found.
  footnotes:
  - marker: a
    text: Or 'strongholds' instead of 'fortresses.' The Hebrew term refers broadly to places of strength or defense.
    reason: lexical_alternative
  - marker: b
    text: '''He will not be found'' is an idiomatic way of saying that he disappears from the scene, likely through death or overthrow, without stating the manner explicitly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그는 자기 땅의 요새들을 향해 얼굴을 돌릴 것이지만, 걸려 넘어져 쓰러질 것이며, 보이지 않게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘요새들’이지만, 본문에 따라 ‘견고한 곳들’ 또는 ‘산성들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보이지 않게 될 것입니다’는 히브리어의 ‘발견되지 않는다’를 자연스럽게 옮긴 것으로, 반드시 죽음만을 뜻한다고 단정하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׁב פָּנָיו
  english_pob_choice: Then he will turn his face
  chosen_korean: 그는 … 얼굴을 돌릴 것이지만
  alternatives_korean:
  - 그는 … 얼굴을 향할 것입니다
  - 그는 … 방향을 돌릴 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴을 돌리다’는 방향 전환의 관용구이므로, 한국어에서도 직역보다 자연스러운 동작 표현인 ‘얼굴을 돌리다’로 옮겨 원문 이미지를 살렸습니다.
- source_word: לְמָעוּזֵּי
  english_pob_choice: toward the fortresses
  chosen_korean: 요새들을 향해
  alternatives_korean:
  - 견고한 곳들을 향해
  - 산성들을 향해
  lexicon: HALOT
  rationale: מָעוֹז는 방어·도피의 의미를 가진 ‘요새/보루’ 계열이므로, 문맥에 맞는 군사적 의미를 살려 ‘요새들’을 선택했습니다.
- source_word: וְנִכְשַׁל וְנָפַל
  english_pob_choice: but he will stumble and fall
  chosen_korean: 걸려 넘어져 쓰러질 것이며
  alternatives_korean:
  - 그러나 그는 비틀거리고 넘어질 것이며
  - 하지만 그는 걸려 넘어지고 쓰러질 것입니다
  lexicon: HALOT
  rationale: כשל과 נפל의 연속 동작을 한국어에서 자연스럽게 연결하기 위해 ‘걸려 넘어져 쓰러지다’로 묶어, 실패와 몰락의 누적을 드러냈습니다.
- source_word: וְלֹא יִמָּצֵא
  english_pob_choice: and he will not be found
  chosen_korean: 보이지 않게 될 것입니다
  alternatives_korean:
  - 찾을 수 없게 될 것입니다
  - 더 이상 발견되지 않을 것입니다
  lexicon: HALOT
  rationale: 직역인 ‘발견되지 않는다’보다, 문맥상 현장에서 사라짐을 완곡하게 드러내는 한국어 표현으로 옮기되, 원문의 직접 서술을 과장하지 않도록 했습니다.
theological_decisions:
- issue: ‘not be found’의 함축적 의미
  chosen_reading: 인물의 최종 상태를 단정하지 않고, 장면에서 사라지는 결과를 완곡하게 표현했습니다.
  alternative_readings:
  - 죽임을 당할 것입니다
  - 폐위될 것입니다
  - 흔적 없이 사라질 것입니다
  rationale: 히브리어는 방식이나 원인을 명시하지 않으므로, 한국어도 그 절제를 유지해야 합니다.
  doctrine_reference: 문맥 우선 원칙; 서술의 함축을 넘어서지 않는 번역
