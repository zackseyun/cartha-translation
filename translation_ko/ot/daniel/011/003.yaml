revisions:
- from: 그때에 한 강한 왕이 일어나서 큰 통치권을 행사하며 자기 뜻대로 행할 것입니다.[a]
  to: 그때에 한 강력한 왕이 일어날 것이며, 큰 권세로 다스리고 자기 뜻대로 행할 것입니다.[a]
  rationale: 통치자의 부상, 큰 권세를 지닌 통치, 자기 의지에 따른 행동이라는 히브리어의 세 요소를 보다 직접적이고 자연스러운 현대 한국어 합쇼체로 정리했습니다. 각주에는 כִּרְצוֹנוֹ의 가능한 직역적 대안을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:49:02Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 미래적 예언 서술과 ‘자기 뜻대로’라는 관용 표현을 충실히 옮겼습니다. 다만 מָשַׁל מִמְשָׁל רַב는 단순히 ‘큰 통치권을 행사하다’라기보다 큰 권세/지배를 가지고 다스리는 것을 강조하므로, 이를 더 직접적으로 반영하는 편이 좋습니다. 또한 עָמַד의 문맥상 ‘일어나다’는 왕의 등장·부상을 뜻하므로 ‘일어날 것이며’가 ‘일어나서’보다 미래 서술과 병렬을 더 분명히 합니다.
  naturalness: ‘한 강한 왕’과 ‘큰 통치권을 행사하며’도 이해 가능하지만, 현대 한국어에서는 통치자의 정치적·군사적 위세를 가리킬 때 ‘한 강력한 왕’, ‘큰 권세로 다스리다’가 더 자연스럽고 간결합니다. 합쇼체 미래 서술은 ‘일어날 것이며 … 다스리고 … 행할 것입니다’가 매끄럽습니다.
  terminology: ‘왕’, ‘권세’, ‘다스리다’, ‘자기 뜻대로 행하다’는 본문의 왕권 및 자의적 행동이라는 의미를 과도한 신학적 해석 없이 잘 전달합니다. ‘강력한’은 גִּבּוֹר의 폭넓은 힘·위세를 자연스럽게 포괄합니다.
  issues:
  - severity: low
    issue: ‘큰 통치권을 행사하며’는 מָשַׁל מִמְשָׁל רַב의 표현을 다소 추상적으로 옮깁니다.
    rationale: 히브리어는 통치 행위와 큰 권세/지배의 범위를 함께 강조합니다. ‘큰 권세로 다스리며’는 이 중첩을 더 직접적으로 반영하면서도 자연스럽습니다.
  - severity: low
    issue: ‘일어나서’는 이후 동작의 단순 순서를 다소 강하게 느끼게 합니다.
    rationale: 예언 문맥의 עָמַד는 왕이 부상하거나 등장한다는 뜻이므로, ‘일어날 것이며’가 미래적 전개와 병렬 구조를 더 선명하게 드러냅니다.
  revised_text: 그때에 한 강력한 왕이 일어날 것이며, 큰 권세로 다스리고 자기 뜻대로 행할 것입니다.[a]
  revised_footnotes:
