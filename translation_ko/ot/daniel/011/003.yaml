    reason: lexical_alternative
  revision_rationale: 통치자의 부상, 큰 권세를 지닌 통치, 자기 의지에 따른 행동이라는 히브리어의 세 요소를 보다 직접적이고 자연스러운 현대 한국어 합쇼체로 정리했습니다. 각주에는 כִּרְצוֹנוֹ의 가능한 직역적 대안을 유지했습니다.
