translation:
  language: ko
  text: 그때에 한 강력한 왕이 일어날 것이며, 큰 권세로 다스리고 자기 뜻대로 행할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 뜻에 따라 행할 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  english_pob_choice: Then ... will arise
  chosen_korean: 일어나서
  alternatives_korean:
  - 등장하여
  - 일어서
  lexicon: HALOT
  rationale: 통치자가 역사 무대에 ‘나타나다/등장하다’는 문맥을 살리면서, 현대 한국어에서는 ‘일어나서’가 가장 자연스럽고 서술 흐름도 잘 맞습니다.
- source_word: מֶלֶךְ גִּבּוֹר
  english_pob_choice: a mighty king
  chosen_korean: 한 강한 왕
  alternatives_korean:
  - 한 용맹한 왕
  - 한 힘센 왕
  lexicon: HALOT
  rationale: גִּבּוֹר의 핵심은 힘과 강대함이므로 ‘강한 왕’이 과도한 해석 없이 넓게 대응합니다.
- source_word: וּמָשַׁל מִמְשָׁל רַב
  english_pob_choice: and he will rule with great dominion
  chosen_korean: 큰 통치권을 행사하며
  alternatives_korean:
  - 큰 지배를 하며
  - 큰 권세로 다스리며
  lexicon: HALOT
  rationale: מָשַׁל과 מִמְשָׁל의 말장난 같은 중첩을 한국어에서 너무 직역하면 어색하므로, ‘통치권을 행사하다’로 권위와 범위를 함께 살렸습니다.
- source_word: וְעָשָׂה כִּרְצוֹנוֹ
  english_pob_choice: and do as he pleases
  chosen_korean: 자기 뜻대로 행할 것입니다
  alternatives_korean:
  - 자기 뜻에 따라 행할 것입니다
  - 자기 원하는 대로 할 것입니다
  lexicon: HALOT
  rationale: 직역인 ‘자기 뜻대로’가 히브리어 관용구의 자의적이고 제약 없는 행동을 가장 정확히 전달합니다.
theological_decisions:
- issue: 왕의 절대적 자의성 표현
  chosen_reading: ‘자기 뜻대로 행할 것입니다’로 옮겨, 단순한 성공이 아니라 제한 없는 자기 의지의 실행을 드러냈습니다.
  alternative_readings:
  - ‘자기 원하는 대로 할 것입니다’
  - ‘자기 뜻에 따라 행할 것입니다’
  rationale: 본문은 통치자의 힘보다 그 힘이 제어되지 않고 자기 의지로 행사된다는 점을 강조하므로, 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 문맥상의 왕권 이해; 다니엘 11장의 제국 통치 묘사
