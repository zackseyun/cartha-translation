  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/ישב פָּנָ֛י/ו לְ/אִיִּ֖ים וְ/לָכַ֣ד רַבִּ֑ים וְ/הִשְׁבִּ֨ית קָצִ֤ין חֶרְפָּת/וֹ֙ ל֔/וֹ בִּלְתִּ֥י חֶרְפָּת֖/וֹ יָשִׁ֥יב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/018.yaml
  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
  footnotes:
  - marker: a
    text: Or 'to the islands.' The Hebrew term can refer either to islands or more broadly to coastlands/maritime regions.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the final clauses is difficult. It may mean that a commander 'will put an end to his reproach against him' and 'will turn his reproach back on him,' that is, repay the insult.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 얼굴을 해안 지방으로 돌리고 많은 사람을 사로잡을 것입니다. 그러나 한 지휘관이 그의 수치를 그에게서 그치게 할 것이며, 참으로 그의 수치를 그에게 되돌릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִיִּים은 섬들을 가리킬 수도 있고, 더 넓게는 해안 지방을 가리킬 수도 있습니다.
    reason: source_note
  - marker: b
    text: 이 절의 끝부분은 히브리어 문장이 매우 난해하여, 보응의 의미로 읽는 번역이 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  english_pob_choice: he will turn his face
  chosen_korean: 얼굴을 돌리고
  alternatives_korean:
  - 얼굴을 향하고
  - 그의 얼굴을 돌려
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘얼굴’ 이미지를 살리면서, 한국어에서도 방향 전환을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לאיים
  english_pob_choice: to the coastlands
  chosen_korean: 해안 지방으로
  alternatives_korean:
  - 섬들로
  - 해양 지역으로
  lexicon: HALOT
  rationale: אִיִּים은 섬뿐 아니라 해안 지역까지 가리킬 수 있어, 문맥상 과도하게 좁히지 않는 ‘해안 지방’이 적절합니다.
- source_word: קצין
  english_pob_choice: a commander
  chosen_korean: 한 지휘관
  alternatives_korean:
  - 한 관원
  - 한 장교
  - 한 대장
  lexicon: HALOT
  rationale: 군사적 문맥에서 קָצִין은 지휘 책임을 지닌 인물을 가리키므로, 가장 자연스럽고 구체적인 한국어로 ‘지휘관’을 택했습니다.
- source_word: חרפתו / בלתי חרפתו ישיב לו
  english_pob_choice: his reproach ... indeed, he will repay his reproach to him
  chosen_korean: 그의 수치를 그에게서 그치게 할 것이며, 참으로 그의 수치를 그에게 되돌릴 것입니다
  alternatives_korean:
  - 그의 수치를 그에게 돌려보낼 것입니다
  - 그의 모욕을 그에게 갚을 것입니다
  - 그의 수치를 멈추게 할 뿐 아니라 되돌릴 것입니다
  lexicon: HALOT
  rationale: חֶרְפָּה는 단순한 ‘모욕’보다 공개적 수치와 치욕을 함께 담으므로 ‘수치’가 더 적절합니다. קשה한 שני절은 POB의 재구성처럼 중복을 피하되, 보응/되돌림의 뜻을 살려 번역했습니다.
theological_decisions:
- issue: শেষ two clauses의 관계와 בלתי의 값
  chosen_reading: ‘그의 수치를 그에게서 그치게 할 것이며, 참으로 그의 수치를 그에게 되돌릴 것입니다’로 읽어, 단순한 부정이 아니라 보응과 반전의 의미를 살렸습니다.
  alternative_readings:
  - ‘그의 수치가 그에게로 되돌아가지 않게 할 것입니다’
  - ‘그의 수치를 없애버릴 것입니다’
  rationale: 히브리어의 난해한 종결부는 POB의 최신 재검토처럼 דורשי שתי אפשרויות가 있으나, כאן은 הִשְׁבִּית의 ‘그치게 하다’와 יָשִׁיב의 ‘되돌리다/갚다’를 살려, 수치의 중단과 보응이라는 긴장을 유지하는 것이 본문에 더 가깝습니다.
  doctrine_reference: 원문 우선, 난해한 구문은 해소하지 않고 의미의 긴장을 보존
