  text: ו/ישב פָּנָ֛י/ו לְ/אִיִּ֖ים וְ/לָכַ֣ד רַבִּ֑ים וְ/הִשְׁבִּ֨ית קָצִ֤ין חֶרְפָּת/וֹ֙ ל֔/וֹ בִּלְתִּ֥י חֶרְפָּת֖/וֹ יָשִׁ֥יב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/018.yaml
  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
  footnotes:
  - marker: a
    text: Or 'to the islands.' The Hebrew term can refer either to islands or more broadly to coastlands/maritime regions.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the final clauses is difficult. It may mean that a commander 'will put an end to his reproach against him' and 'will turn his reproach back on him,' that is, repay the insult.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 얼굴을 해안 지방으로[a] 돌리고 많은 것을 사로잡을 것입니다. 그러나 한 지휘관이 그에 대한 그의 모욕을 그치게 하고, 더 나아가 그 모욕을 그에게 되돌릴 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִיִּים은 섬들을 가리킬 수도 있고, 더 넓게는 해안 지방이나 해양 지역을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 종결부는 문법과 대명사 지시 대상이 난해합니다. 여기서는 한 지휘관이 모욕을 그치게 하고 그것을 되돌려 갚는다는 뜻으로 옮겼습니다. ‘그의 모욕이 그에게 되돌아가지 않게 한다’로 이해하는 독법도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  english_pob_choice: he will turn his face
  chosen_korean: 얼굴을 돌리고
  alternatives_korean:
