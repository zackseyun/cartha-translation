id: DAN.11.1
reference: Daniel 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִי֙ בִּ/שְׁנַ֣ת אַחַ֔ת לְ/דָרְיָ֖וֶשׁ הַ/מָּדִ֑י עָמְדִ֛/י לְ/מַחֲזִ֥יק וּ/לְ/מָע֖וֹז לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/001.yaml
  text: And as for me[a], in the first year of Darius the Mede[b], I stood up to strengthen and be a fortress to him.
  footnotes:
  - marker: a
    text: Or more literally, 'I stood ... to strengthen and to be a stronghold for him.'
    reason: lexical_alternative
  - marker: b
    text: In the Hebrew tradition this is Daniel 11:1; in some English versifications it is counted as Daniel 10:21b–11:1 or Daniel 11:1 with slightly different chapter division.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 나[ᵃ]는 메대 사람 다리오의 첫 해에, 그를 강하게 하고 그를 위한 요새가 되기 위해 일어섰습니다[ᵇ].[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나로 말하면’ 또는 ‘나는 … 서 있었다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 전통에서는 다니엘 11:1이며, 일부 영어 절 구분에서는 다니엘 10:21b–11:1 또는 11:1로 다르게 셉니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And as for me
  chosen_korean: 그리고 나
  alternatives_korean:
  - 그리고 나는
  - 나로 말하면
  lexicon: HALOT
  rationale: 접속사와 독립 인칭대명사가 담는 화제 전환과 약한 강조를 살려, 단순한 ‘나는’보다 ‘그리고 나’로 옮겼습니다.
- source_word: בִּשְׁנַת אַחַת
  english_pob_choice: in the first year
  chosen_korean: 첫 해에
  alternatives_korean:
  - 첫째 해에
  - 한 해에
  lexicon: HALOT
  rationale: 즉위 연대 표현으로서 ‘첫 해’가 자연스럽고, 문맥상 단순한 수량 ‘한 해’와 구별됩니다.
- source_word: לְדָרְיָוֶשׁ הַמָּדִי
  english_pob_choice: of Darius the Mede
  chosen_korean: 메대 사람 다리오의
  alternatives_korean:
  - 메대 사람 다리오에게
  - 메대 사람 다리오를 위하여
  lexicon: HALOT
  rationale: 히브리어의 연대 표지 전치사는 한국어에서 소유격·관형격으로 풀어 주는 것이 가장 자연스럽고, ‘메대 사람’은 민족 표지를 그대로 살렸습니다.
- source_word: לְמַחֲזִיק וּלְמָעוֹז
  english_pob_choice: to strengthen and be a fortress to him
  chosen_korean: 그를 강하게 하고 그를 위한 요새가 되기 위해
  alternatives_korean:
  - 그를 강하게 하고 그를 위한 성채가 되기 위해
  - 그를 돕고 그를 위한 요새가 되기 위해
  lexicon: HALOT
  rationale: לְמַחֲזִיק은 ‘강하게 하다/돕다’보다 직접적인 ‘그를 강하게 하다’가 מקור의 사역적 뉘앙스를 살리고, מָעוֹז는 ‘요새/성채’의 실질적 방어 이미지를 유지했습니다.
theological_decisions:
- issue: ‘him’의 지시 대상
  chosen_reading: ‘그’는 문맥상 다리오를 가리키며, 본문은 앞뒤 서술과 이어지는 천상적 화자의 행동을 그대로 유지합니다.
  alternative_readings:
  - 지시 대상을 보다 일반적으로 처리할 수 있음
  - 장절 구분 차이로 앞절과 이어 읽을 수 있음
  rationale: 본문 자체가 신학적 논쟁을 요구하지는 않지만, 지시어를 분명히 두어 역사 서술의 흐름을 보존하는 것이 문맥상 가장 충실합니다.
  doctrine_reference: 문맥 우선 원칙; 단 11:1 내 서술 연결
