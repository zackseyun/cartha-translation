  rationale: 원문의 완료형 동사와 두 목적구의 병렬을 더 직접적이고 자연스러운 합쇼체로 반영했습니다. ‘왕 원년’은 재위 연대 표현을 한국어 성경 문체에 맞게 명료화했으며, 대명사는 원문처럼 유지했습니다. 구조적으로 중복된 각주 호출과 혼용된 표기 역시 바로잡았습니다.
