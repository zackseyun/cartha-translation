reference: Daniel 11:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/עָמְד/וֹ֙ תִּשָּׁבֵ֣ר מַלְכוּת֔/וֹ וְ/תֵחָ֕ץ לְ/אַרְבַּ֖ע רוּח֣וֹת הַ/שָּׁמָ֑יִם וְ/לֹ֣א לְ/אַחֲרִית֗/וֹ וְ/לֹ֤א כְ/מָשְׁל/וֹ֙ אֲשֶׁ֣ר מָשָׁ֔ל כִּ֤י תִנָּתֵשׁ֙ מַלְכוּת֔/וֹ וְ/לַ/אֲחֵרִ֖ים מִ/לְּ/בַד אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/004.yaml
  text: And as soon as he has arisen[a], his kingdom will be broken and divided toward the four winds of heaven, but not to his posterity, and not according to the dominion with which he ruled[b]; for his kingdom will be uprooted and given to others besides these.
  footnotes:
  - marker: a
    text: Or 'descendants.' The Hebrew phrase 'not to his latter end' here refers to those who would come after him in dynastic succession.
    reason: lexical_alternative
  - marker: b
    text: '''Toward the four winds of heaven'' is a Hebrew idiom for being divided in every direction, that is, toward the four points of the compass.'
    reason: cultural_note
translation:
  language: ko
  text: 그가 일어서자마자 그의 왕국은 부서져 하늘의 네 바람 쪽으로 나뉠 것이나, 그의 후손[a]에게 돌아가지도 않고 그가 다스리던 통치권과도 같지 않을 것입니다. 그의 왕국은 뽑혀 이들 외의 다른 이들에게 돌아갈 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 뒤/후대’입니다. 여기서는 왕조적으로 그의 뒤를 이을 후손을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 네 바람’은 사방, 곧 네 방위를 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְעָמְדוֹ
  english_pob_choice: And as soon as he has arisen
  chosen_korean: 그가 일어나자마자
  alternatives_korean:
  - 그가 일어났을 때
  - 그가 일어난 뒤에
  lexicon: HALOT
  rationale: ‘עמד’는 여기서 단순한 자세가 아니라 권력의 등장을 가리키므로, 즉시성을 살린 ‘일어나자마자’가 문맥에 가장 잘 맞습니다.
- source_word: תִּשָּׁבֵר / וְתֵחָץ
  english_pob_choice: will be broken and divided
  chosen_korean: 부서지고 ... 나뉘어질
  alternatives_korean:
  - 깨지고 나뉘어질
  - 산산이 부서지고 분할될
  lexicon: HALOT
  rationale: 두 동사의 연속은 왕국의 붕괴와 분할을 함께 보여 주므로, 한국어에서도 두 동작을 나란히 살려 과도한 의역 없이 옮겼습니다.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  english_pob_choice: toward the four winds of heaven
  chosen_korean: 하늘의 네 바람을 향해
  alternatives_korean:
  - 하늘의 네 방향으로
  - 하늘의 네 바람 쪽으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서 자연스러운 방향 표현인 ‘향해’를 더해 네 방위를 가리키는 뜻을 드러냈습니다.
- source_word: וְלֹא לְאַחֲרִיתוֹ
  english_pob_choice: but not to his posterity
  chosen_korean: 그의 후손에게도
  alternatives_korean:
  - 그의 자손에게도
  - 그의 뒤를 이을 사람들에게도
  lexicon: HALOT
  rationale: 문맥상 왕조 계승을 가리키므로, POB의 해석에 따라 ‘후손’으로 옮기되 부정문과 함께 이어져 ‘...에게도’의 형식을 취했습니다.
- source_word: וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  english_pob_choice: and not according to the dominion with which he ruled
  chosen_korean: 그가 다스렸던 권세와도 같지 않을 것입니다
  alternatives_korean:
  - 그가 행사했던 통치와도 같지 않을 것입니다
  - 그의 शासन 방식과도 같지 않을 것입니다
  lexicon: HALOT
  rationale: מָשְׁל/מָשַׁל의 통치·권세 뉘앙스를 살려 ‘권세’로 옮기고, 동일 어근의 반복은 한국어에서 자연스럽게 ‘다스렸던’으로 풀었습니다.
- source_word: תִנָּתֵשׁ
  english_pob_choice: will be uprooted
  chosen_korean: 뽑혀
  alternatives_korean:
  - 뿌리째 뽑혀
  - 뜯겨
  lexicon: HALOT
  rationale: 식물의 뿌리 뽑힘 이미지를 가진 동사이므로 ‘뽑혀’로 간결하게 살려, 뒤의 ‘주어질’과 함께 전이의 결과를 드러냈습니다.
- source_word: מִלְּבַד אֵלֶּה
  english_pob_choice: besides these
  chosen_korean: 이들 외의 사람들에게
  alternatives_korean:
  - 이들 외에도
  - 이들과는 다른 이들에게
  lexicon: HALOT
  rationale: ‘이들’은 앞서 언급된 수혜자 범위를 가리키므로, 한국어에서는 ‘외의 사람들에게’로 풀어 배제와 대체를 분명히 했습니다.
theological_decisions:
- issue: 역사적 예언의 번역에서 특정 인물 식별을 본문에 삽입할지 여부
  chosen_reading: 본문은 왕국의 붕괴, 분할, 이전을 설명하는 역사-정치적 진술로 옮기고, 특정 인물이나 후대 해석은 넣지 않았습니다.
  alternative_readings:
  - 번역문 안에 역사적 인물 식별을 덧붙이는 해석적 번역
  - 후대 예언 성취를 암시하는 설명 삽입
  rationale: 원문 자체가 말하는 범위를 넘지 않도록 하여, 독자가 본문과 주석을 구분해 읽게 하는 것이 POB의 원칙에 맞습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition'
