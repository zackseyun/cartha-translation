source:
  edition: WLC
  text: וּ/בְ/הִכָּ֣שְׁלָ֔/ם יֵעָזְר֖וּ עֵ֣זֶר מְעָ֑ט וְ/נִלְו֧וּ עֲלֵי/הֶ֛ם רַבִּ֖ים בַּ/חֲלַקְלַקּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/034.yaml
  text: When they stumble[a], they will receive a little help, and many will join themselves to them with smooth words.
  footnotes:
  - marker: a
    text: Or 'with flattery' / 'through flatteries.' The Hebrew literally refers to 'smooth things/words,' a common image for deceptive or flattering speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 넘어질 때에 그들은 적은 도움을 받을 것이며, 많은 사람이 아첨하는 말로 그들에게 합류할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아첨으로’ 또는 ‘교묘한 말로’입니다. 히브리어는 문자적으로 ‘매끄러운 것들’을 뜻하며, 흔히 아첨하거나 속이려는 말을 비유합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּשְׁלָם
  english_pob_choice: When they stumble
  chosen_korean: 그들이 넘어질 때에
  alternatives_korean:
  - 그들이 실족할 때에
  - 그들이 넘어질 때
  lexicon: HALOT
  rationale: בְ + 동사형은 시간적 상황을 나타내므로 ‘~할 때에’로 옮겼고, כשל의 비유를 살리면서도 한국어 자연성을 위해 ‘넘어지다’를 택했습니다.
- source_word: יֵעָזְרוּ עֵזֶר מְעָט
  english_pob_choice: they will receive a little help
  chosen_korean: 작은 도움을 받겠지만
  alternatives_korean:
  - 적은 도움을 받겠지만
  - 조금의 도움을 받겠지만
  - 작은 도움을 받을 것입니다
  lexicon: HALOT
  rationale: עזר의 수동적 의미를 ‘도움을 받다’로 살리고, עֵזֶר מְעָט의 제한성을 ‘작은 도움’으로 간결하게 반영했습니다.
- source_word: וְנִלְווּ עֲלֵיהֶם רַבִּים
  english_pob_choice: many will join themselves to them
  chosen_korean: 많은 사람이 그들에게 … 붙을 것입니다
  alternatives_korean:
  - 많은 사람이 그들에게 합류할 것입니다
  - 많은 사람이 그들과 함께할 것입니다
  - 많은 사람이 그들에게 몸을 의탁할 것입니다
  lexicon: HALOT
  rationale: לוה의 ‘달라붙다/합류하다’ 뉘앙스를 살리되, 한국어에서는 ‘붙다’가 집단에 매달리듯 가세하는 느낌을 가장 직접적으로 전달합니다.
- source_word: בַּחֲלַקְלַקּוֹת
  english_pob_choice: with smooth words
  chosen_korean: 매끄러운 말로
  alternatives_korean:
  - 아첨하는 말로
  - 부드러운 말로
  - 미끈한 말로
  lexicon: HALOT
  rationale: ‘smooth things/words’의 직역 이미지를 유지해, 표면적으로는 부드럽지만 속뜻은 의심스러운 말을 드러내도록 했습니다.
theological_decisions:
- issue: בַּחֲלַקְלַקּוֹת의 수사적 뉘앙스
  chosen_reading: ‘매끄러운 말’은 단순한 유창함이 아니라 설득적이지만 신뢰하기 어려운 말을 가리키는 이미지로 유지했습니다.
  alternative_readings:
  - 아첨하는 말
  - 교묘한 말
  rationale: 본문의 상징적 표현을 완화하지 않고, 독자가 배신적·기만적 언어의 함의를 읽을 수 있도록 했습니다.
  doctrine_reference: 본문 수사와 문맥에 근거한 의미 보존
