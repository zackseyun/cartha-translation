  source_fidelity: 히브리어의 시간적 상황(‘그들이 넘어질 때’), 제한된 도움, 다수가 그들에게 가담함, 그리고 ‘매끄러운 것들’이라는 비유적 수단을 전반적으로 잘 반영했습니다. 다만 ‘-겠지만’은 원문의 단순 접속을 양보·대조 관계로 강화하므로 피하는 편이 낫습니다.
  naturalness: ‘그들에게 매끄러운 말로 붙을 것입니다’는 현대 표준 한국어에서 집단에 합류한다는 뜻으로 다소 어색하며, ‘매끄러운 말’도 이 문맥의 비유를 자연스럽게 전달하지 못합니다. ‘아첨하는 말로 그들에게 합류할 것입니다’가 자연스럽고 문맥상 충실합니다.
