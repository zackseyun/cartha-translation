source:
  edition: WLC
  text: וּ/בְ/עֵ֣ת קֵ֗ץ יִתְנַגַּ֤ח עִמּ/וֹ֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יִשְׂתָּעֵ֨ר עָלָ֜י/ו מֶ֣לֶךְ הַ/צָּפ֗וֹן בְּ/רֶ֨כֶב֙ וּ/בְ/פָ֣רָשִׁ֔ים וּ/בָ/אֳנִיּ֖וֹת רַבּ֑וֹת וּ/בָ֥א בַ/אֲרָצ֖וֹת וְ/שָׁטַ֥ף וְ/עָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/040.yaml
  text: At the time of the end[a], the king of the South will clash with him, and the king of the North will storm against him with chariots, horsemen, and many ships[d][c][b]; he will enter into the lands and sweep through and pass on.
  footnotes:
  - marker: a
    text: Or 'will push at him.' The Hebrew verb literally evokes butting or goring and is used figuratively for hostile collision.
    reason: lexical_alternative
  - marker: b
    text: Or 'will come against him like a storm' / 'like a whirlwind.' The verb carries imagery of violent rushing.
    reason: lexical_alternative
  - marker: c
    text: Or 'countries' for 'lands.' The Hebrew plural can denote multiple territories or nations.
    reason: lexical_alternative
  - marker: d
    text: The pronoun 'him' is left unspecified in the Hebrew text; interpreters differ on its exact referent in context.
    reason: alternative_reading
translation:
  language: ko
  text: 끝의 때에[a] 남방 왕이 그와[d] 충돌하고, 북방 왕이 전차와 기병과 많은 배를 거느리고 그를 향해 맹렬히 밀어닥칠 것입니다[b]. 그는 여러 땅에 들어가 휩쓸고 지나갈 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지막 때에’. 히브리어 표현은 끝에 이르는 정해진 시기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 향해 폭풍처럼 몰려올 것입니다’ 또는 ‘그를 향해 폭풍같이 달려들 것입니다’. 히브리어 동사는 거세고 급격히 몰려드는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여러 나라에’. 히브리어 복수형은 여러 영토나 나라를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그’가 가리키는 대상은 히브리어 본문에서 명시되지 않습니다. 문맥상 그 정확한 지시 대상에 대해서는 해석이 갈립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְעֵת קֵץ
  english_pob_choice: At the time of the end
  chosen_korean: 끝의 때에
  alternatives_korean:
  - 마지막 때에
  - 종말의 때에
  lexicon: HALOT
  rationale: קֵץ와 עֵת의 결합은 종말적 시점을 가리키므로, 한국어에서는 자연스럽게 ‘끝의 때’로 옮겨 예언적 긴장을 살렸습니다.
- source_word: יִתְנַגַּח עִמּוֹ
  english_pob_choice: will clash with him
  chosen_korean: 그와 충돌하고
  alternatives_korean:
  - 그와 부딪치고
  - 그와 들이받고
  - 그를 향해 들이받고
  lexicon: HALOT
  rationale: נגח의 문자적 이미지는 들이받음이지만, 한국어에서는 군사적 대립의 비유를 살려 ‘충돌하다’로 옮기는 편이 더 자연스럽고 원문의 긴장을 유지합니다.
- source_word: וְיִשְׂתָּעֵר עָלָיו
  english_pob_choice: will storm against him
  chosen_korean: 그를 향해 밀어닥칠 것입니다
  alternatives_korean:
  - 그에게 폭풍처럼 달려들 것입니다
  - 그를 향해 폭풍같이 몰려올 것입니다
  - 그를 향해 맹렬히 들이닥칠 것입니다
  lexicon: HALOT
  rationale: 의 동사ית שעֵר는 거세게 몰려드는 이미지를 가지므로, ‘밀어닥치다’로 옮겨 폭풍 같은 군사적 돌진을 현대 한국어로 전달했습니다.
- source_word: וּבְרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת
  english_pob_choice: with chariots, horsemen, and many ships
  chosen_korean: 전차와 기병과 많은 배로
  alternatives_korean:
  - 병거와 기병과 많은 배로
  - 전차와 말 탄 병사와 많은 배로
  - 전차, 기병, 그리고 많은 배로
  lexicon: HALOT
  rationale: 전쟁 장비의 목록을 한국어 군사 어휘로 직접 옮겼고, 마지막의 ‘많은 배’는 해상 전력을 분명히 드러내기 위해 유지했습니다.
- source_word: וּבָא בַאֲרָצ֖וֹת
  english_pob_choice: he will enter the lands
  chosen_korean: 그 땅들로 들어가서
  alternatives_korean:
  - 그 나라들로 들어가서
  - 그 지역들로 들어가서
  - 그 땅으로 들어가서
  lexicon: HALOT
  rationale: 아르צות의 복수성을 살리기 위해 단수화하지 않고 ‘땅들’로 옮겼으며, 전면적 진입의 동작을 ‘들어가서’로 유지했습니다.
- source_word: וְשָׁטַף וְעָבָר
  english_pob_choice: and sweep through and pass on
  chosen_korean: 휩쓸고 지나갈 것입니다
  alternatives_korean:
  - 넘쳐서 지나갈 것입니다
  - 휩쓸고 통과할 것입니다
  - 휩쓸며 지나갈 것입니다
  lexicon: HALOT
  rationale: שׁטף의 범람 이미지를 한국어의 ‘휩쓸다’로, 이어지는 עבר를 ‘지나가다’로 옮겨 연속적이고 파괴적인 진군의 흐름을 살렸습니다.
theological_decisions:
- issue: 끝의 때라는 종말론적 시점의 범위
  chosen_reading: 특정한 달력적 시점을 확정하지 않고 예언 본문이 제시하는 종말적 국면으로 유지했습니다.
  alternative_readings:
  - 정확한 역사 연대를 지시하는 표현으로 좁혀 읽기
  - 최종 종말 사건만 가리키는 표현으로 한정하기
  rationale: 본문은 시점은 제시하지만 구체적 달력 날짜를 밝히지 않으므로, 해석 여지를 보존하는 번역이 원문에 더 충실합니다.
  doctrine_reference: 예언 본문의 시점 표지를 과도하게 특정하지 않음
