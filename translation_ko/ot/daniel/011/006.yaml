base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/006.yaml
  text: At the end of years they will join together[a], and the daughter of the king of the South will come to the king of the North to make an agreement. But she will not retain the strength of her arm, and he and his arm will not stand; and she will be given up, along with those who brought her, and the one who fathered her[b], and the one who supported her in those times.
  footnotes:
  - marker: a
    text: Or 'to make equitable terms' or 'to bring about an upright settlement.' The Hebrew literally speaks of 'making uprightnesses/equities.'
    reason: lexical_alternative
  - marker: b
    text: '''The one who fathered her'' follows the masculine form of the Hebrew participle. Some translations render this as ''child'' or understand a different referent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 몇 해가 지난 끝에 그들이 서로 연합할 것입니다. 남방 왕의 딸이 공정한 조건을 세우기 위해[a] 북방 왕에게 갈 것입니다. 그러나 그녀는 자기 팔의 힘을 유지하지 못할 것이며, 그와 그의 팔도 서지 못할 것입니다. 그녀와 그녀를 데리고 온 자들, 그녀를 낳은 아버지[b], 그리고 그 당시 그녀를 붙들어 준 자는 넘겨질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘협정을 맺기 위해’. 히브리어는 문자적으로 ‘바른 것들’ 또는 ‘공정한 것들’을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 분사는 남성 단수형이므로 ‘그녀를 낳은 아버지’로 옮겼습니다. 일부 번역은 이를 ‘자녀’로 옮기거나 다른 대상을 가리키는 것으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקֵץ שָׁנִים
  english_pob_choice: At the end of years
  chosen_korean: 몇 년이 지나면
  alternatives_korean:
  - 몇 해가 끝날 무렵
  - 세월이 지난 뒤
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 자연문으로 풀되, ‘years’의 기간 경과를 살려 예언적 시점 표시를 유지했습니다.
- source_word: יִתְחַבָּרוּ
  english_pob_choice: they will join together
  chosen_korean: 동맹을 맺을 것입니다
  alternatives_korean:
  - 서로 합류할 것입니다
  - 연합할 것입니다
  lexicon: HALOT
  rationale: 정치적·외교적 결합을 뜻하는 뉘앙스를 분명히 하면서도, 단순 병합보다 관계적 결속을 드러내는 표현으로 옮겼습니다.
- source_word: לַעֲשׂוֹת מֵישָׁרִים
  english_pob_choice: to make an agreement
  chosen_korean: 화친을 이루려 할 것입니다
  alternatives_korean:
  - 공정한 조건을 세우려 할 것입니다
  - 협정을 맺으려 할 것입니다
  lexicon: HALOT
  rationale: מֵישָׁרִים의 문자적 ‘바름/공평함’보다 이 문맥의 외교적 합의 뜻을 우선하되, ‘화친’으로 관계 회복과 협상 모두를 담았습니다.
- source_word: וְלֹא תַעְצֹר כּוֹחַ הַזְּרוֹעַ
  english_pob_choice: she will not retain the strength of her arm
  chosen_korean: 자신의 팔의 힘을 유지하지 못할 것이며
  alternatives_korean:
  - 팔의 힘을 붙들지 못할 것이며
  - 힘을 보존하지 못할 것이며
  lexicon: HALOT
  rationale: ‘팔’의 비유적 힘을 살리되, 한국어에서 자연스러운 ‘유지하다’로 ‘붙들어 보존하다’의 의미를 전달했습니다.
- source_word: וְתִנָּתֵן הִיא
  english_pob_choice: she will be given up
  chosen_korean: 그녀는 넘겨질 것입니다
  alternatives_korean:
  - 그녀는 내어질 것입니다
  - 그녀는 버려질 것입니다
  lexicon: HALOT
  rationale: 수동형 נתן의 정치적·전쟁적 ‘넘겨짐/인도됨’을 직접적으로 반영했습니다.
- source_word: וְהַיֹּלְדָהּ
  english_pob_choice: the one who fathered her
  chosen_korean: 그녀를 낳은 자[a]
  alternatives_korean:
  - 그녀를 낳은 이
  - 그녀의 아버지
  lexicon: HALOT
  rationale: 히브리어 분사 형태가 남성형이지만, 한국어에서는 성별 표시를 과도하게 풀기보다 원문의 문법적 불일치를 드러내는 방식으로 처리했습니다.
theological_decisions:
- issue: 남방/북방 왕의 결속과 몰락을 예언 서술로 어떻게 처리할지
  chosen_reading: 역사적 정치 동맹과 그 실패를 예언적 서술로 평이하게 옮겼습니다.
