revisions:
- from: 몇 년이 지나면 그들이 동맹을 맺을 것입니다. 그리고 남방 왕의 딸이 북방 왕에게 와서 화친을 이루려 할 것입니다. 그러나 그녀는 자신의 팔의 힘을 유지하지 못할 것이며, 그와 그의 팔도 서지 못할 것입니다. 그녀와 그녀를 데리고 온 자들, 그녀를 낳은 자[a], 그리고 그때에 그녀를 붙들고 있던 자들과 함께 그녀는 넘겨질 것입니다.
  to: 몇 해가 지난 끝에 그들이 서로 연합할 것입니다. 남방 왕의 딸이 공정한 조건을 세우기 위해[a] 북방 왕에게 갈 것입니다. 그러나 그녀는 자기 팔의 힘을 유지하지 못할 것이며, 그와 그의 팔도 서지 못할 것입니다. 그녀와 그녀를 데리고 온 자들, 그녀를 낳은 아버지[b], 그리고 그 당시 그녀를 붙들어 준 자는 넘겨질 것입니다.
  rationale: 외교적 표현을 ‘화친’으로 한정하지 않고 원문의 공정한 조건·협정이라는 폭을 보존했습니다. 남성형 분사를 본문과 각주에서 명시했으며, 마지막 열거를 공동 주어로 재구성하여 한국어 문장성을 높였습니다. ‘팔’과 ‘서다’의 은유는 해설적으로 대체하지 않고 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:49:11Z'
