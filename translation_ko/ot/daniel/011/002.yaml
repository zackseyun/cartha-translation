id: DAN.11.2
reference: Daniel 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֱמֶ֖ת אַגִּ֣יד לָ֑/ךְ הִנֵּה עוֹד֩ שְׁלֹשָׁ֨ה מְלָכִ֜ים עֹמְדִ֣ים לְ/פָרַ֗ס וְ/הָֽ/רְבִיעִי֙ יַעֲשִׁ֤יר עֹֽשֶׁר גָּדוֹל֙ מִ/כֹּ֔ל וּ/כְ/חֶזְקָת֣/וֹ בְ/עָשְׁר֔/וֹ יָעִ֣יר הַ/כֹּ֔ל אֵ֖ת מַלְכ֥וּת יָוָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/002.yaml
  text: 'And now I will tell you the truth: behold[a], three more kings will arise for Persia, and the fourth will become far richer than all of them; and when he becomes strong through his riches[c][b], he will stir up everyone against the kingdom of Greece.'
  footnotes:
  - marker: a
    text: Or 'three additional kings will stand up for Persia.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the fourth will gain great wealth beyond all.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he will rouse all against the kingdom of Greece.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 이제 내가 네게 진실을 말하겠습니다: 보십시오, 페르시아에는 아직 세 왕이 더 일어날 것이며, 넷째 왕은 그들 모두보다 훨씬 더 부유해질 것이고, 그의 부로 강해지면 그는 헬라의 나라를 향해 모든 것을 일으킬 것입니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘페르시아를 위한 세 왕이 더 일어날 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘넷째는 모든 것보다 큰 재물을 얻을 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그는 헬라의 나라를 향해 모두를 일으킬 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה אֱמֶת אַגִּיד לָךְ
  english_pob_choice: And now I will tell you the truth
  chosen_korean: 그리고 이제 내가 네게 진실을 말하겠습니다
  alternatives_korean:
  - 이제 내가 네게 진실을 말씀드리겠습니다
  - 그리고 이제 내가 네게 진실을 알려드리겠습니다
  lexicon: HALOT
  rationale: וְעַתָּה의 연결성과 시간감을 살리면서, אַגִּיד의 ‘말하다/알리다’ 의미를 자연스러운 현대어로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적·지시적 강조를 살리되, 현대 한국어에서 문맥상 자연스러운 직접 호소로 옮겼습니다.
- source_word: עוֹד שְׁלֹשָׁה מְלָכִים עֹמְדִים לְפָרַס
  english_pob_choice: three more kings will arise for Persia
  chosen_korean: 페르시아에는 아직 세 왕이 더 일어날 것이며
  alternatives_korean:
  - 페르시아를 위해 세 왕이 더 일어날 것이며
  - 페르시아에서 세 왕이 더 일어날 것이며
  lexicon: HALOT
  rationale: עוֹד의 ‘추가됨’을 ‘아직 … 더’로 살리고, לְפָרַס는 왕조 소속/관계를 나타내는 것으로 보아 ‘페르시아에는’로 옮겼습니다.
- source_word: וְהָרְבִיעִי יַעֲשִׁיר עֹשֶׁר גָּדוֹל מִכֹּל
  english_pob_choice: and the fourth will become far richer than all of them
  chosen_korean: 넷째 왕은 그들 모두보다 훨씬 더 부유해질 것이고
  alternatives_korean:
  - 넷째는 그들 모두보다 훨씬 더 부유해질 것이고
  - 넷째는 큰 재물을 얻어 그들 모두를 뛰어넘을 것이고
  lexicon: HALOT
  rationale: יַעֲשִׁיר + עֹשֶׁר גָּדוֹל의 누적적 강세를 한국어의 비교 표현으로 풀어, 단순한 ‘부자 되다’보다 더 강한 의미를 반영했습니다.
- source_word: וּכְחֶזְקָתוֹ בְעָשְׁרוֹ יָעִיר הַכֹּל
  english_pob_choice: and when he becomes strong through his riches, he will stir up everyone
  chosen_korean: 그리고 그의 부로 강해지면 그는 … 모든 것을 일으킬 것입니다
  alternatives_korean:
  - 그리고 그의 부로 강해지면 그는 모두를 일으킬 것입니다
  - 그리고 그의 부로 강해지면 그는 온 백성을 분발시킬 것입니다
  lexicon: HALOT
  rationale: PBO의 ‘stir up’와 히브리어 יָעִיר의 ‘일으키다/자극하다’ 사이를 고려해 ‘일으키다’로 옮겼습니다. 다만 목적어 הַכֹּל을 한국어로 그대로 살리면 부자연스러워, 문맥상 대상 집합을 가리키는 표현으로 처리했습니다.
- source_word: אֵת מַלְכוּת יָוָן
  english_pob_choice: against the kingdom of Greece
  chosen_korean: 헬라의 나라를 향해
  alternatives_korean:
  - 헬라의 나라에 대하여
  - 헬라의 나라를 상대로
  lexicon: HALOT
  rationale: אֵת의 기능을 본문 문맥상 대립 관계로 이해해 방향성을 드러냈습니다. יָוָן은 다니엘서의 일반적 역사적 지시를 살려 ‘헬라’로 옮겼고, מַלְכוּת는 ‘나라’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 마지막 절의 대립 방향
  chosen_reading: 넷째 왕은 자신의 부와 힘으로 모든 것을 일으켜 헬라의 나라를 향한 정치·군사적 움직임을 촉발합니다.
  alternative_readings:
  - 그는 헬라의 나라를 위해 모든 것을 일으킵니다
  - 그는 헬라의 나라 자체를 일으킵니다
  rationale: 동사 יָעִיר와 뒤따르는 אֵת מַלְכוּת יָוָן의 결합은 단순한 대상 표지가 아니라 대립적·대상적 관계로 읽는 것이 문맥에 가장 잘 맞습니다. 따라서 역사 예고의 긴장을 보존하는 방향으로 번역했습니다.
  doctrine_reference: 문맥상 예언적 역사 서술
