    rationale: 대립 관계가 충분히 드러나지 않고, 무엇을 어떻게 ‘일으키는지’도 한국어에서 어색합니다. 헬라 왕국을 대적하도록 모두를 일으킨다는 표현이 문맥상 의미를 명확히 합니다.
