  rationale: 안전한 수정이 필요합니다. ‘모든 것’을 문맥상 사람들을 가리키는 ‘모두’로 바로잡고, 헬라 왕국에 대한 적대 방향을 분명히 했습니다. 원문의 예언적·정치적 서술을 유지했으며, 특정 역사적 동일시나 교리적 해석은 덧붙이지 않았습니다. 각주도 해당 어구에 직접 연결되도록 재배치했습니다.
