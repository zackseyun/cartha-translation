review_pass:
  verdict: revise
  source_fidelity: 본문의 הַכֹּל은 이 정치·군사 문맥에서 ‘모든 것’보다 사람들의 총체인 ‘모두’를 가리키는 것으로 옮기는 것이 적절합니다. 또한 마지막 구절은 יָעִיר הַכֹּל אֵת מַלְכוּת יָוָן의 통사상 논의의 여지는 있으나, 문맥과 영어 POB 감사 기록을 따라 헬라 왕국에 대항하도록 모두를 동원한다는 뜻으로 번역했습니다. לְפָרַס는 왕조적 관련을 자연스럽게 나타내어 ‘페르시아에’로 옮겼습니다.
  naturalness: 초안의 ‘헬라의 나라를 향해 모든 것을 일으킬 것입니다’는 한국어로 부자연스럽고, ‘모든 것’이 사물 전체를 뜻하는 것처럼 들려 문맥에도 맞지 않습니다. ‘헬라 왕국을 대적하도록 모두를 일으킬 것입니다’는 현대 표준어 합쇼체에서 자연스럽고 의미가 분명합니다.
  terminology: יָוָן은 다니엘서의 전통적 한국어 성서 용례를 고려하여 ‘헬라’로 유지하되, מַלְכוּת는 ‘왕국’으로 옮겨 통치 영역이라는 뜻을 더 분명히 했습니다. ‘부’와 ‘부유해지다’는 עֹשֶׁר 및 강조된 יַעֲשִׁיר의 의미를 자연스럽게 전달합니다.
