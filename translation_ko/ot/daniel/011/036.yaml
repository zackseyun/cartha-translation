  source_fidelity: 대체로 원문을 충실히 옮겼습니다. 그러나 וְעַל(‘~을 거슬러/대항하여’)의 적대적 방향은 ‘~께 대하여’보다 더 분명히 드러내는 것이 좋습니다. 또한 נִפְלָאוֹת는 복수형이므로 ‘놀라운 말들’로 옮길 수 있습니다. נֶחֱרָצָה는 단지 시간상 ‘이미’라는 뜻을 명시하지 않으므로 이를 본문에서 빼는 편이 안전합니다.
