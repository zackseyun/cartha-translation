    rationale: 이 문맥의 עַל은 단순한 화제·대상 표지보다 ‘~을 거슬러/대항하여’라는 방향을 나타냅니다. ‘거슬러’를 사용하면 원문의 대결적 뉘앙스를 보존합니다.
