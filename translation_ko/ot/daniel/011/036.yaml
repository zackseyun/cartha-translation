id: DAN.11.36
reference: Daniel 11:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשָׂ֨ה כִ/רְצוֹנ֜/וֹ הַ/מֶּ֗לֶךְ וְ/יִתְרוֹמֵ֤ם וְ/יִתְגַּדֵּל֙ עַל כָּל אֵ֔ל וְ/עַל֙ אֵ֣ל אֵלִ֔ים יְדַבֵּ֖ר נִפְלָא֑וֹת וְ/הִצְלִ֨יחַ֙ עַד כָּ֣לָה זַ֔עַם כִּ֥י נֶחֱרָצָ֖ה נֶעֱשָֽׂתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/036.yaml
  text: And the king will do as he pleases[a]. He will exalt himself and magnify himself above every god, and against the God of gods he will speak astonishing things. And he will prosper until the indignation is finished[c][b], for what has been decreed will be done.
  footnotes:
  - marker: a
    text: Or 'marvelous things.' The Hebrew can denote extraordinary or wondrous things; here the context suggests shocking, arrogant speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'until the wrath is completed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for what is determined shall be done.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕은 자기 뜻대로 행할 것입니다. 그는 스스로 높아지고, 모든 신보다 자신을 높일 것이며, 신들의 하나님께 대하여 놀라운 말을 할 것입니다. 그는 진노가 끝날 때까지 형통할 것이니, 이는 이미 정해진 것이 이루어질 것이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘놀라운/기이한 것들’이라는 뜻도 가질 수 있습니다. 그러나 여기서는 문맥상 충격적이고 오만한 발언을 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진노가 완성될 때까지’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이미 정해진 것이 이루어질 것입니다.’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה כִרְצוֹנוֹ
  english_pob_choice: will do as he pleases
  chosen_korean: 자기 뜻대로 행할 것입니다
  alternatives_korean:
  - 자기 इच्छा대로 행할 것입니다
  - 자기 원하는 대로 행할 것입니다
  lexicon: HALOT
  rationale: כִרְצוֹנוֹ의 ‘자기 뜻/의지’라는 의미를 자연스러운 현대 한국어로 옮기되, 자의적 독주라는 뉘앙스를 살렸습니다.
- source_word: וְיִתְרוֹמֵם וְיִתְגַּדֵּל
  english_pob_choice: will exalt himself / magnify himself
  chosen_korean: 스스로 높아지고, 모든 신보다 자신을 높일
  alternatives_korean:
  - 스스로 높이며, 크게 자랑할
  - 자기를 높이며, 자신을 크게 만들
  lexicon: HALOT
  rationale: 두 반사형 동사를 중복된 자기고양으로 살려, 단순한 승격이 아니라 의도적 자만과 교만을 드러내도록 했습니다.
- source_word: עַל כָּל אֵל
  english_pob_choice: above every god
  chosen_korean: 모든 신보다 자신을 높일
  alternatives_korean:
  - 모든 신 위에
  - 모든 신보다 높아질
  lexicon: HALOT
  rationale: עַל은 이 문맥에서 우월·초월의 비교를 나타내므로 ‘~보다’로 풀어 비교의 힘을 분명히 했습니다.
- source_word: וְעַל אֵל אֵלִים
  english_pob_choice: against the God of gods
  chosen_korean: 신들의 하나님께 대하여
  alternatives_korean:
  - 신들의 하나님을 거슬러
  - 신들의 하나님에게 대하여
  lexicon: HALOT
  rationale: 문맥상 최고신을 가리키는 표현이므로 ‘하나님’으로 옮기되, 히브리어의 충돌감을 살려 ‘대하여’로 공격의 방향을 유지했습니다.
- source_word: יְדַבֵּר נִפְלָאוֹת
  english_pob_choice: will speak astonishing things
  chosen_korean: 놀라운 말을 할 것입니다
  alternatives_korean:
  - 경이로운 말을 할 것입니다
  - 기이한 말을 할 것입니다
  - 괴이한 말을 할 것입니다
  lexicon: HALOT
  rationale: נִפְלָאוֹת는 본래 ‘놀라운/기이한 것들’이지만, POB의 해석대로 이 문맥에서는 경탄보다 충격과 오만을 드러내는 발화로 이해해 중립적이면서도 이상한 힘을 담았습니다.
- source_word: עַד כָּלָה זַעַם
  english_pob_choice: until the indignation is finished
  chosen_korean: 진노가 끝날 때까지
  alternatives_korean:
  - 분노가 끝날 때까지
  - 격분이 끝날 때까지
  lexicon: HALOT
  rationale: 예언 문맥에서 זַעַם은 단순한 감정 분노보다 하나님의 진노/격노에 가깝기에, 한국어 ‘진노’가 문맥과 어감을 가장 잘 반영합니다.
- source_word: כִּי נֶחֱרָצָה נֶעֱשָׂתָה
  english_pob_choice: for what has been decreed will be done
  chosen_korean: 이미 정해진 것이 이루어질 것이기 때문입니다
  alternatives_korean:
  - 결정된 것이 이루어질 것이기 때문입니다
  - 정해진 일이 행해질 것이기 때문입니다
  lexicon: HALOT
  rationale: ‘정해짐’과 ‘실행됨’의 두 층위를 한국어로 간결하게 연결해, 신적 작정의 확정성과 성취를 함께 드러냈습니다.
theological_decisions:
- issue: אֵל אֵלִים의 지칭과 한국어 호칭
  chosen_reading: ‘신들의 하나님’으로 옮겨 최고신을 가리키는 대비를 살렸습니다.
  alternative_readings:
  - ‘신들의 신’
  - ‘신들의 하나님’ 대신 ‘하나님 중의 하나님’
  rationale: 히브리어의 격언적 최고 칭호를 그대로 살리되, 본문 앞의 ‘모든 신’과 대조되는 유일신적 의미를 분명히 하기 위해 전통적 ‘하나님’을 유지했습니다.
  doctrine_reference: Translation philosophy §1
- issue: זַעַם의 성격
  chosen_reading: ‘진노’로 번역해 하나님의 심판적 분노를 염두에 두게 했습니다.
  alternative_readings:
  - ‘분노’
  - ‘격분’
  rationale: 다니엘의 묵시·예언 문맥에서는 개인 감정이 아니라 정해진 때가 있는 신적 진노로 읽는 것이 더 자연스럽습니다.
  doctrine_reference: Translation philosophy §3
