id: DAN.11.21
reference: Daniel 11:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָמַ֤ד עַל כַּנּ/וֹ֙ נִבְזֶ֔ה וְ/לֹא נָתְנ֥וּ עָלָ֖י/ו ה֣וֹד מַלְכ֑וּת וּ/בָ֣א בְ/שַׁלְוָ֔ה וְ/הֶחֱזִ֥יק מַלְכ֖וּת בַּ/חֲלַקְלַקּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/021.yaml
  text: And in his place a despised man will arise[a], on whom they had not bestowed the majesty of kingship[b]; he will come in quietly and seize the kingdom by intrigues.
  footnotes:
  - marker: a
    text: Or 'peaceably' for 'quietly' (בְשַׁלְוָה), emphasizing an appearance of calm or security rather than open aggression.
    reason: lexical_alternative
  - marker: b
    text: Or 'by flatteries' for 'by intrigues' (בַּחֲלַקְלַקּוֹת), highlighting deceptive smooth speech as the means of gaining power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 자리에 경멸받는 사람이 일어날 것입니다[a]. 사람들은 그에게 왕권의 위엄을 주지 않았습니다[b]. 그는 조용히 들어와 간계로 나라를 차지할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화롭게’로도 옮길 수 있습니다. 이는 בְשַׁלְוָה의 ‘조용함/안정됨’이라는 뉘앙스를 반영합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그에게 왕권의 영광을 주지 않았다’로도 옮길 수 있습니다. הוֹד는 ‘위엄’과 ‘영광’의 범위를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  english_pob_choice: will arise
  chosen_korean: 일어날 것입니다
  alternatives_korean:
  - 등장할 것입니다
  - 일어설 것입니다
  lexicon: HALOT
  rationale: 다니엘의 계승 문맥에서 ‘일어나다’는 권력의 등장과 승계를 자연스럽게 나타내며, 예언적 미래형도 유지합니다.
- source_word: נִבְזֶה
  english_pob_choice: a despised man
  chosen_korean: 경멸받는 사람
  alternatives_korean:
  - 멸시받는 사람
  - 천대받는 사람
  - 비천한 사람
  lexicon: HALOT
  rationale: 수동적 평가어로서 ‘경멸받는’이 מקור의 수치를 직접 드러내며, ‘사람’은 האנוש적 대상임을 분명히 합니다.
- source_word: הוֹד מַלְכוּת
  english_pob_choice: the majesty of kingship
  chosen_korean: 왕권의 위엄
  alternatives_korean:
  - 왕의 위엄
  - 통치의 위엄
  - 왕권의 권위
  lexicon: HALOT
  rationale: הוֹד의 ‘위엄’과 מַלְכוּת의 ‘왕권/통치’를 함께 살려, 단순한 영토가 아니라 왕위의 존엄을 뜻한다는 점을 보존합니다.
- source_word: בְשַׁלְוָה
  english_pob_choice: he will come in quietly
  chosen_korean: 조용히
  alternatives_korean:
  - 평온하게
  - 평화롭게
  - 태연히
  lexicon: HALOT
  rationale: 이 문맥에서는 공개적 공격이 아니라 눈에 띄지 않는 접근을 말하므로, ‘평화롭게’보다 ‘조용히’가 더 정확합니다.
- source_word: בַּחֲלַקְלַקּוֹת
  english_pob_choice: by intrigues
  chosen_korean: 간계로
  alternatives_korean:
  - 아첨으로
  - 매끄러운 말로
  - 속임수로
  lexicon: HALOT
  rationale: ‘매끄러움/미끄러움’에서 나온 표현으로, 정치적 책략과 기만을 가리키므로 ‘간계로’가 본문 의도를 잘 드러냅니다.
theological_decisions:
- issue: 정치적 왕위 찬탈의 묘사
  chosen_reading: 본절은 합법적 계승이 아니라, 외형상 평온하게 접근해 간계로 왕권을 장악하는 인물을 묘사합니다.
  alternative_readings:
  - 중립적인 통치 시작으로 완화해서 읽는 해석
  - 단순히 지혜로운 정치술로 축소하는 해석
  rationale: ‘경멸받는 사람’, ‘왕권의 위엄을 주지 않음’, ‘조용히’, ‘간계로’가 함께 작동해 정당성 결여와 책략적 장악을 강조합니다.
  doctrine_reference: 단 11장 문맥상의 제국 권력 비판
