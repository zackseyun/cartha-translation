base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/029.yaml
  text: At the appointed time he will return and come into the south[a], but it will not be as the former or as the latter.
  footnotes:
  - marker: a
    text: Or, 'but it will not be as before and as afterward.' The Hebrew leaves the comparison compressed and somewhat elliptical.
    reason: lexical_alternative
translation:
  language: ko
  text: 정해진 때에 그가 돌아와 남쪽으로 들어가겠지만, 이전과 같지도 않고 이후와 같지도 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전과 같지도 않고 후와 같지도 않을 것입니다.’ 히브리어는 비교 대상을 압축하여 다소 생략된 형태로 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד
  english_pob_choice: At the appointed time
  chosen_korean: 정한 때에
  alternatives_korean:
  - 임명된 때에
  - 정해진 때에
  lexicon: HALOT
  rationale: מוֹעֵד는 여기서 절기보다 ‘정해진/약정된 때’를 가리키므로, 시간의 특정성을 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: יָשׁוּב
  english_pob_choice: he will return
  chosen_korean: 그가 돌아와
  alternatives_korean:
  - 그가 되돌아와
  - 그가 돌아갈
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아오다/되돌아가다’ 가운데, 군사적 이동 문맥에 맞게 가장 자연스럽게 ‘돌아와’로 옮겼습니다.
- source_word: וּבָא בַנֶּגֶב
  english_pob_choice: and come into the south
  chosen_korean: 남쪽으로 들어가겠지만
  alternatives_korean:
  - 남쪽으로 가겠지만
  - 남쪽에 들어가겠지만
  lexicon: HALOT
  rationale: נֶגֶב는 다니엘 11장 문맥에서 지리 명칭보다 북쪽과 대조되는 ‘남쪽’이 적절하므로, 이동 방향을 드러내는 ‘남쪽으로 들어가다’로 옮겼습니다.
- source_word: כָרִאשֹׁנָה ... וְכָאַחֲרֹנָה
  english_pob_choice: as the former ... as the latter
  chosen_korean: 이전과 같지도 않고 이후와 같지도 않을 것입니다
  alternatives_korean:
  - 처음과 같지도 않고 나중과 같지도 않을 것입니다
  - 전과 후와 같지도 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 비교 대상이 압축된 병렬구문이므로, ‘former/latter’를 직역하기보다 한국어에서 같은 긴장을 살리는 대구 표현으로 옮겼습니다.
theological_decisions:
- issue: 다니엘 11:29의 압축된 비교문을 어떻게 처리할지
  chosen_reading: 비교의 대상을 풀어쓰되, 본문의 축약성을 유지하여 ‘이전과 같지도 않고 이후와 같지도 않을 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘처음과 나중과 같지 않을 것입니다’
  - ‘그전처럼도 그후처럼도 아닐 것입니다’
  rationale: 히브리어는 ‘the former / the latter’의 대구를 축약적으로 제시하므로, 해설을 덧붙이지 않고 비교의 방향만 분명히 했습니다.
  doctrine_reference: 문맥 해설이 아닌 본문 의미 보존의 원칙
