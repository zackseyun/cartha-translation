revisions:
- from: 그의 아들들이 떨쳐 일어나 많은 군대를 모을 것이며, 한 사람이 반드시 와서 범람하듯 밀려들어 지나갈 것입니다[b]. 그러고 나서 그는 돌아와 그의 요새까지 전쟁을 일으킬 것입니다.
  to: 그의 아들들은 분쟁을 일으키고 수많은 병력을 모을 것이며, 그들 가운데 한 사람은 반드시 와서 범람하듯 밀려들어 지나갈 것입니다. 그 뒤 그는 돌아와 그의 요새에 이르기까지 다시 전쟁에 나설 것입니다[b].
  rationale: 복수에서 단수로 바뀌는 원문의 문법적 긴장을 ‘그들 가운데 한 사람’과 이어지는 ‘그’로 보존하되, 그 인물을 역사적으로 특정하지 않았습니다. 마지막 군사 행동은 한국어의 자연스러운 결합을 위해 ‘다시 전쟁에 나서다’로 옮겼으며, 요새의 소유주가 불명확하다는 점은 본문과 각주에서 그대로 유지했습니다. 각주 앵커는 실제로 설명하는 ‘그의 요새’ 어구 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:43Z'
review_pass:
  verdict: revise
  source_fidelity: 복수인 ‘그의 아들들’에서 단수 행위자로 전환되는 점, 부정사 절대형이 더하는 강조(‘반드시’), 그리고 요새의 소유주가 불명확한 점은 대체로 잘 보존되었습니다. 다만 마지막 ‘그의 요새까지 전쟁을 일으킬 것입니다’는 ‘까지’의 수식 관계가 어색하고, 히브리어의 재차 전쟁에 나서는 동작을 더 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘떨쳐 일어나’는 문맥상 가능하지만 군사적 충돌을 나타내는 동사로는 다소 막연합니다. ‘분쟁을 일으키고’ 및 ‘다시 전쟁에 나설 것입니다’가 현대 표준어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: ‘아들들’, ‘병력’, ‘요새’는 왕조 및 군사 문맥에 적절합니다. ‘요새’의 소유자를 특정하지 않아 본문의 해석상 불확실성도 유지됩니다.
