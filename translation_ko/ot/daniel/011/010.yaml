id: DAN.11.10
reference: Daniel 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/בנ/ו יִתְגָּר֗וּ וְ/אָסְפוּ֙ הֲמוֹן֙ חֲיָלִ֣ים רַבִּ֔ים וּ/בָ֥א ב֖וֹא וְ/שָׁטַ֣ף וְ/עָבָ֑ר וְ/יָשֹׁ֥ב ו/יתגרו עַד מעז/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/010.yaml
  text: His sons will stir themselves up and assemble a multitude of great forces[a], and one will certainly come and overflow and pass through[b]; then he will return and stir up war as far as his fortress.
  footnotes:
  - marker: a
    text: Or 'he will surely come'; the Hebrew shifts from plural ('his sons') to singular, likely focusing on one son in particular.
    reason: alternative_reading
  - marker: b
    text: Or 'up to his stronghold.' The Hebrew leaves the owner of the fortress implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들이 떨쳐 일어나 많은 군대를 모을 것이며, 한 사람이 반드시 와서 범람하듯 밀려들어 지나갈 것입니다[b]. 그러고 나서 그는 돌아와 그의 요새까지 전쟁을 일으킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그의 요새까지.’ 히브리어는 그 요새의 소유주를 암시만 할 뿐 분명히 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנָיו
  english_pob_choice: His sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: בנים은 이 왕조적 문맥에서 남성 후계자들을 가리키므로, 보다 넓은 ‘자녀들’보다 ‘아들들’이 원문의 범위를 더 정확히 반영합니다.
- source_word: יִתְגָּרוּ
  english_pob_choice: will stir themselves up
  chosen_korean: 떨쳐 일어나
  alternatives_korean:
  - 전쟁을 벌일 것입니다
  - 분쟁에 나설 것입니다
  lexicon: HALOT
  rationale: 히트파엘 גרה의 반사적 뉘앙스를 살려, 단순한 ‘전쟁하다’보다 스스로 분쟁 국면으로 들어가는 움직임을 드러냈습니다.
- source_word: וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים
  english_pob_choice: and assemble a multitude of great forces
  chosen_korean: 많은 군대를 모을 것이며
  alternatives_korean:
  - 큰 군세의 무리를 모을 것이며
  - 많은 병력을 집결시킬 것이며
  lexicon: HALOT
  rationale: הֲמוֹן과 חֲיָלִים의 집합적 군사 이미지를 한국어에서 자연스럽게 살리면서도 과도하게 장황해지지 않도록 ‘많은 군대’를 택했습니다.
- source_word: וּבָא בּוֹא
  english_pob_choice: and one will certainly come
  chosen_korean: 한 사람이 반드시 와서
  alternatives_korean:
  - 그가 반드시 올 것이며
  - 한 사람이 분명히 와서
  lexicon: HALOT
  rationale: 동사와 부정사 절대형의 강조를 ‘반드시’로 옮겼고, 히브리어의 복수에서 단수로의 전환을 본문처럼 유지하기 위해 특정 인물을 지시하지 않고 ‘한 사람’으로 두었습니다.
- source_word: וְשָׁטַף וְעָבָר
  english_pob_choice: and overflow and pass through
  chosen_korean: 범람하듯 밀려들어 지나갈 것입니다
  alternatives_korean:
  - 넘쳐흐르며 지나갈 것입니다
  - 홍수처럼 휩쓸고 지나갈 것입니다
  lexicon: HALOT
  rationale: שטף와 עבר의 연속적 진격 이미지를 한국어에서도 강하게 드러내기 위해, 문자적 의미를 살리되 군사적 비유가 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: עַד מָעֻזֹּה
  english_pob_choice: as far as his fortress
  chosen_korean: 그의 요새까지
  alternatives_korean:
  - 그의 견고한 요새까지
  - 그의 성채까지
  lexicon: HALOT
  rationale: מָעוֹז는 ‘요새/보루/성채’의 의미가 가능하지만, 문맥상 군사적 방어 거점을 가장 직접적으로 나타내는 ‘요새’를 택했습니다.
theological_decisions:
- issue: 복수에서 단수로의 전환(‘그의 아들들’ → ‘한 사람’)
  chosen_reading: 본문의 문법적 전환을 그대로 드러내되, 누구를 가리키는지는 번역에서 특정하지 않았습니다.
  alternative_readings:
  - ‘그가 반드시 올 것입니다’로 매끄럽게 통일하기
  - 특정 아들을 역사적으로 지목하여 번역에 반영하기
  rationale: 히브리어가 의도적으로 복수에서 단수로 이동하므로, 해석적 결론을 번역문에 넣기보다 원문의 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 본문의 해석적 긴장을 보존하고 번역이 해석을 대체하지 않도록 함
- issue: ‘그의 요새’의 소유주가 अस्प명확한 점
  chosen_reading: 소유자를 밝히지 않고 ‘그의 요새’로 남겼습니다.
  alternative_readings:
  - ‘그들의 요새’로 평탄화하기
  - 역사적 대상자를 지정해 번역문에 반영하기
  rationale: 히브리어 소유격은 단수이지만 지시 대상이 본문상 분명하지 않으므로, 불확실성을 유지하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 본문의 해석적 긴장을 보존하고 번역이 해석을 대체하지 않도록 함
