  - 행합니다
  lexicon: HALOT
  rationale: עשה의 기본 의미를 살리되, 군사·정치 문맥에서 자연스러운 현대 한국어로는 ‘행하다’가 범위를 넓게 보존합니다.
- source_word: הַבָּא אֵלָיו
  english_pob_choice: the one who comes against him
  chosen_korean: 그를 향해 오는 자
  alternatives_korean:
