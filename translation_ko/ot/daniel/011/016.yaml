id: DAN.11.16
reference: Daniel 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַ֨עַשׂ הַ/בָּ֤א אֵלָי/ו֙ כִּ/רְצוֹנ֔/וֹ וְ/אֵ֥ין עוֹמֵ֖ד לְ/פָנָ֑י/ו וְ/יַעֲמֹ֥ד בְּ/אֶֽרֶץ הַ/צְּבִ֖י וְ/כָלָ֥ה בְ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/016.yaml
  text: And the one who comes against him will do as he pleases[a], and no one will stand before him. He will stand in the Beautiful Land[b], and it will be consumed in his hand.
  footnotes:
  - marker: a
    text: Or 'the glorious land.' The Hebrew expression denotes a land of beauty or splendor and refers here to the land of Israel/Judah.
    reason: lexical_alternative
  - marker: b
    text: Or 'and he will bring destruction in his hand' / 'and it will be consumed in his hand.' The Hebrew phrase is compact and may emphasize either destructive power under his control or the land's being brought to ruin.
    reason: alternative_reading
translation:
  language: ko
  text: 그를 향해 오는 자는 자기 뜻대로 행할 것이고, 그의 앞에 맞설 자는 아무도 없을 것입니다. 그는 아름다운 땅에 서게 될 것이며, 그것은 그의 손으로 황폐하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광스러운 땅’. 이 히브리어 표현은 아름다움이나 찬란함의 땅을 뜻하며, 여기서는 이스라엘/유다의 땅을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 손에 의해 황폐하게 될 것입니다’ / ‘그의 손으로 황폐하게 될 것입니다’. 이 히브리어 구는 매우 압축되어 있어, 그의 통제 아래 있는 파괴력을 강조할 수도 있고, 땅이 황폐하게 되는 것을 말할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַעַשׂ
  english_pob_choice: will do
  chosen_korean: 행할 것입니다
  alternatives_korean:
  - 할 것입니다
  - 행합니다
  lexicon: HALOT
  rationale: עשה의 기본 의미를 살리되, 군사·정치 문맥에서 자연스러운 현대 한국어로는 ‘행하다’가 범위를 넓게 보존합니다.
- source_word: הַבָּא אֵלָיו
  english_pob_choice: the one who comes against him
  chosen_korean: 그를 향해 오는 자
  alternatives_korean:
  - 그에게 오는 자
  - 그를 대적하러 오는 자
  lexicon: HALOT
  rationale: 직역된 공간적 의미를 유지하면서도 이 문맥의 적대적 뉘앙스를 한국어에서 과도하게 해석하지 않도록 했습니다.
- source_word: בְּאֶרֶץ הַצְּבִי
  english_pob_choice: in the Beautiful Land
  chosen_korean: 아름다운 땅
  alternatives_korean:
  - 영광스러운 땅
  - 아름다운 나라
  lexicon: HALOT
  rationale: הַצְּבִי의 ‘아름다움/찬란함’ 이미지를 직접 살렸고, 다니엘서의 지리적 지칭은 본문 안에서 드러나므로 본문에는 중립적으로 유지했습니다.
- source_word: וְכָלָה בְיָדוֹ
  english_pob_choice: and it will be consumed in his hand
  chosen_korean: 그의 손으로 황폐하게 될 것입니다
  alternatives_korean:
  - 그의 손에서 소진될 것입니다
  - 그의 손에 의해 멸망할 것입니다
  lexicon: HALOT
  rationale: כָלָה의 소멸/파괴 의미를 살리면서도, POB가 지적한 압축된 표현의 해석 여지를 한국어에서 유지하려고 했습니다.
theological_decisions:
- issue: ‘Beautiful Land’의 지시 대상
  chosen_reading: 다니엘의 역사-환상 문맥에서 이스라엘/유다의 땅을 가리키는 지리적 명칭으로 유지했습니다.
  alternative_readings:
  - 보다 일반적인 미학적 표현으로만 읽기
  rationale: 본문이 지닌 역사적·상징적 긴장을 본문 안에서 보존하기 위해, 본문에서는 해석을 과도하게 확정하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 범위 안에서 지리적 지칭을 보존
