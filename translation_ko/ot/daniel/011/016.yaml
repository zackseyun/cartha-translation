  source_fidelity: 마지막 절 וְכָלָה בְיָדוֹ는 매우 압축적인 표현이며, ‘그 땅이 그의 손으로 황폐하게 될 것’이라고 땅을 문법적 대상으로 확정하는 번역은 가능한 해석이지만 본문의 모호성을 좁힙니다. 본문에는 ‘그의 손에는 멸망이 있을 것’으로 옮겨 파괴력이 그의 지배 아래 있음을 보존하는 편이 안전합니다. הַבָּא אֵלָיו는 이 군사 문맥에서 ‘그를 대적하여 오는 자’가 자연스럽고 문맥 충실합니다.
  naturalness: 합쇼체의 미래 진술로 자연스럽습니다. ‘그의 손에는 멸망이 있을 것입니다’는 원문의 짧고 다소 타원적인 표현을 한국어에서 과도한 보충 없이 전달합니다.
