id: DAN.11.39
reference: Daniel 11:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשָׂ֞ה לְ/מִבְצְרֵ֤י מָֽעֻזִּים֙ עִם אֱל֣וֹהַּ נֵכָ֔ר אֲשֶׁ֥ר הכיר יַרְבֶּ֣ה כָב֑וֹד וְ/הִמְשִׁילָ/ם֙ בָּֽ/רַבִּ֔ים וַ/אֲדָמָ֖ה יְחַלֵּ֥ק בִּ/מְחִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/039.yaml
  text: And he will act against the strongest fortresses with a foreign god[a]. Those whom he acknowledges, he will increase with honor, and he will make them rule over many[d][c][b], and he will divide land for a price.
  footnotes:
  - marker: a
    text: Or 'with fortified strongholds' / 'for the fortresses of strongholds'; the Hebrew phrase is compressed and may be understood slightly differently.
    reason: lexical_alternative
  - marker: b
    text: Or 'by means of a foreign god.' The preposition 'with' may express either accompaniment or instrumentality.
    reason: lexical_alternative
  - marker: c
    text: Or 'those who acknowledge him.' The Hebrew could be taken differently, though 'those whom he acknowledges' best fits the verbal form and following pronoun.
    reason: alternative_reading
  - marker: d
    text: Or 'he will apportion land for payment' or 'as a reward.' The phrase indicates a transactional distribution of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가장 견고한 요새들에 맞서 외국의 신과 함께[a][b] 행동할 것입니다. 그가 인정하는 자들에게[c] 영예를 더해 주고, 그들로 하여금 많은 이들을 다스리게 하며, 땅을 대가로 나누어 줄 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요새화된 강한 성채들에 대하여’로도 볼 수 있습니다. 히브리어 구문은 압축되어 있어 약간 다르게 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘외국의 신을 수단으로’로도 볼 수 있습니다. 히브리어 전치사 עִם은 동반이나 도구성을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그를 인정하는 자들’로도 볼 수 있습니다. 히브리어는 다르게 읽을 가능성이 있으나, 여기서는 동사 형태와 뒤의 대명사에 따라 ‘그가 인정하는 자들’이 가장 잘 맞습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘땅을 지불 대가로 나누어 줄’ 또는 ‘보상으로 나누어 줄’로도 옮길 수 있습니다. 이 표현은 거래적인 토지 분배를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  english_pob_choice: And he will act
  chosen_korean: 그는 … 행동할 것입니다
  alternatives_korean:
  - 그는 … 행할 것입니다
  - 그는 … 할 것입니다
  lexicon: HALOT
  rationale: עשה의 넓은 의미를 살리되, 이 군사·정치 문맥에서는 ‘행동하다’가 자연스럽고 목적어와의 관계를 과도하게 풀지 않습니다.
- source_word: לְמִבְצְרֵי מָעֻזִּים
  english_pob_choice: against the strongest fortresses
  chosen_korean: 가장 견고한 요새들에 맞서
  alternatives_korean:
  - 견고한 성채들에 맞서
  - 강한 요새들에 대하여
  lexicon: HALOT
  rationale: מִבְצָר와 מָעוֹז의 결합이 가리키는 견고한 방어 거점을 한국어로 자연스럽게 옮기되, 전투적 방향성을 ‘맞서’로 드러냈습니다.
- source_word: עִם אֱלוֹהַּ נֵכָר
  english_pob_choice: with a foreign god
  chosen_korean: 외국의 신과 함께
  alternatives_korean:
  - 낯선 신과 함께
  - 이방 신과 함께
  lexicon: HALOT
  rationale: עִם의 동반성/수단성의 여지를 남기면서, נֵכָר를 ‘외국의’로 옮겨 이 신의 이질성과 정치적 외래성을 함께 드러냈습니다.
- source_word: וְהִמְשִׁילָם בָּרַבִּים
  english_pob_choice: he will make them rule over many
  chosen_korean: 그들로 하여금 많은 이들을 다스리게 할 것이며
  alternatives_korean:
  - 그들로 많은 이들을 통치하게 할 것이며
  - 그들에게 많은 사람들 위에 권세를 주어 다스리게 할 것이며
  lexicon: HALOT
  rationale: 히필 형태의 ‘다스리게 하다’를 직접 살리면서, בָּרַבִּים을 ‘많은 이들/많은 사람들’로 옮겨 지배 범위를 분명히 했습니다.
- source_word: וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  english_pob_choice: and he will divide land for a price
  chosen_korean: 땅을 대가를 받고 나누어 줄 것입니다
  alternatives_korean:
  - 땅을 값을 받고 분배할 것입니다
  - 땅을 보수로 나누어 줄 것입니다
  lexicon: HALOT
  rationale: אֲדָמָה를 ‘땅’으로, מְחִיר를 ‘대가’로 옮겨 거래·보상 성격을 드러내되, 정확한 금전 형태는 확정하지 않았습니다.
theological_decisions:
- issue: ‘그가 인정하는 자들’의 주체와 의미
  chosen_reading: 문맥상 왕이 특정 지지자들을 인정하고 그들에게 영예와 권세를 줍니다.
  alternative_readings:
  - 외국의 신을 인정하는 자들이 보상받는다는 뜻일 수 있습니다.
  - 왕을 인정하는 자들이 보상받는다는 뜻일 수 있습니다.
  rationale: 히브리어는 הִכִּיר의 3인칭 남성 단수 주어를 가장 자연스럽게 왕으로 읽게 하며, 뒤의 목적어 대명사와도 잘 맞습니다. 따라서 더 구체적인 신학적 해석을 강요하지 않고 정치적 후원을 보존합니다.
  doctrine_reference: 본문의 긴장을 보존하고 특정 해석을 과도하게 확정하지 않음.
