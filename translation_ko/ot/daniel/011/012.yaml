id: DAN.11.12
reference: Daniel 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִשָּׂ֥א הֶ/הָמ֖וֹן ירום לְבָב֑/וֹ וְ/הִפִּ֛יל רִבֹּא֖וֹת וְ/לֹ֥א יָעֽוֹז׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/012.yaml
  text: And when the multitude is carried away[a], his heart will be lifted up, and he will cast down tens of thousands[c][b], but he will not prevail.
  footnotes:
  - marker: a
    text: Or 'And the multitude will be lifted up/taken away.' The Hebrew verb can be understood as 'be lifted up' or 'be carried away/removed'; the context of military defeat favors 'carried away.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his heart will be lifted up,' an idiom for becoming proud.
    reason: cultural_note
  - marker: c
    text: Or 'he will not become strong.' The Hebrew may emphasize either failure to prevail or failure to consolidate strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무리가 끌려갈 때[a], 그의 마음은 교만해지고[b] 수만 명을 쓰러뜨리겠지만, 그는 우세를 얻지 못할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끌려가다’로 옮긴 히브리어 동사는 ‘들려 올려지다’ 또는 ‘옮겨지다’로도 이해될 수 있습니다. 그러나 전쟁 문맥에서는 패배한 무리가 끌려가거나 제거되는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 마음은 높아지다’는 히브리어 관용구로, 교만해진다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그는 강해지지 못할 것입니다.’ 히브리어 동사는 강해지는 것과 우세를 확보하는 것 어느 쪽을 강조할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשָּׂא הֶהָמוֹן
  english_pob_choice: when the multitude is carried away
  chosen_korean: 군대가 끌려가듯 사로잡힐 때
  alternatives_korean:
  - 무리가 끌려갈 때
  - 무리가 들어 올려질 때
  lexicon: HALOT
  rationale: נשא의 수동형은 ‘들려 올려지다’와 ‘끌려가다/사로잡히다’가 모두 가능하지만, 전쟁 맥락에서 패전 후 포로가 되어 끌려가는 뉘앙스가 자연스럽습니다. הָמוֹן은 ‘무리’보다 여기서는 군사적 집단을 드러내는 ‘군대’가 문맥 적합성이 높습니다.
- source_word: ירום לְבָב֑וֹ
  english_pob_choice: his heart will be lifted up
  chosen_korean: 그의 마음은 교만해지고
  alternatives_korean:
  - 그의 마음은 높아지고
  - 그의 마음은 들리게 되고
  lexicon: HALOT
  rationale: ‘마음이 높아지다/들리다’는 히브리어 관용구의 의미가 교만함이므로, 한국어에서는 의미를 분명히 드러내는 ‘교만해지고’로 옮겼습니다.
- source_word: וְהִפִּיל רִבֹּאוֹת
  english_pob_choice: he will cast down tens of thousands
  chosen_korean: 수만 명을 쓰러뜨리겠지만
  alternatives_korean:
  - 수만 명을 무너뜨리겠지만
  - 수만 명을 넘어뜨리겠지만
  lexicon: HALOT
  rationale: הפיל의 사역적 의미는 ‘쓰러뜨리다/무너뜨리다’인데, 전투 문맥에서 사람들을 죽이거나 패배시키는 결과를 포괄할 수 있어 ‘쓰러뜨리다’가 가장 자연스럽습니다. רִבֹּאות은 ‘수만’이 현대 한국어에서 명확합니다.
- source_word: וְלֹא יָעוֹז
  english_pob_choice: but he will not prevail
  chosen_korean: 그는 이기지 못할 것입니다
  alternatives_korean:
  - 그는 강해지지 못할 것입니다
  - 그는 우세해지지 못할 것입니다
  lexicon: HALOT
  rationale: עוֹז/עָזַז 계열은 ‘강하다’의 뜻이지만, 여기서는 앞의 군사적 성공에도 불구하고 결국 승리하지 못한다는 결론이 핵심이므로 ‘이기지 못하다’가 문맥상 가장 적절합니다.
theological_decisions:
- issue: 히브리어 관용구 ‘마음이 높아지다’의 처리
  chosen_reading: 직역 대신 ‘교만해지고’로 옮겨 의미를 드러냈습니다.
  alternative_readings:
  - 그의 마음은 높아질 것입니다
  - 그의 마음은 들릴 것입니다
  rationale: 이 표현은 단순한 감정 변화가 아니라 오만과 자만의 상태를 가리키므로, 독자가 곧바로 의미를 이해하도록 한국어 관용 표현으로 풀었습니다.
  doctrine_reference: 지혜문학/예언서의 관용구 해석 원칙
- issue: 전쟁 서술에서 ‘수만 명을 쓰러뜨리다’의 범위
  chosen_reading: 전투적 패배와 살상을 함께 포괄하는 표현으로 처리했습니다.
  alternative_readings:
  - 수만 명을 죽이겠지만
  - 수만 명을 무찌르겠지만
  rationale: 히브리어 히필은 단순한 물리적 낙하보다 ‘패배시키다/쓰러뜨리다’의 결과를 담을 수 있어, 과도하게 협소하거나 과도하게 구어적인 표현을 피했습니다.
  doctrine_reference: 서사적 전쟁 표현의 의미 범위
