  to: 그는 아름다운 땅[a]에 들어갈 것이며, 많은 이들이[b] 넘어질 것입니다. 그러나 이들은 그의 손에서 벗어날 것입니다. 곧 에돔과 모압과 암몬 자손의 으뜸입니다.
