base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/041.yaml
  text: 'He will enter into the Beautiful Land[a], and many will stumble; but these will escape from his hand: Edom, Moab[c][b], and the foremost of the sons of Ammon.'
  footnotes:
  - marker: a
    text: Or 'the glorious land' or 'the pleasant land.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'many'; the implied referent may be people or lands.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''the chief of the Ammonites.'' Hebrew: ''the foremost of the sons of Ammon.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아름다운 땅[a]에 들어갈 것이며, 많은 이들이[b] 넘어질 것입니다. 그러나 이들은 그의 손에서 벗어날 것입니다. 곧 에돔과 모압과 암몬 자손의 으뜸입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광스러운 땅’ 또는 ‘기쁜 땅’이라고도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘많은’이라고만 합니다. 생략된 대상은 사람일 수도 있고 땅이나 나라일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶרֶץ הַצְּבִי / Beautiful Land
  english_pob_choice: Beautiful Land
  chosen_korean: 아름다운 땅
  alternatives_korean:
  - 영광스러운 땅
  - 아름다운 나라
  - 기쁜 땅
  lexicon: HALOT
  rationale: צבי는 아름다움·아름다움의 광채·바람직함을 모두 가질 수 있으므로, 본문의 지리적 지칭을 살리면서도 해석을 과도하게 좁히지 않는 ‘아름다운 땅’이 가장 직접적입니다.
- source_word: יִכָּשֵׁלוּ
  english_pob_choice: will stumble
  chosen_korean: 넘어질 것입니다
  alternatives_korean:
  - 걸려 넘어질 것입니다
  - 실족할 것입니다
  - 무너질 것입니다
  lexicon: HALOT
  rationale: כשל의 기본 이미지는 ‘비틀거리다/걸려 넘어지다’이므로, 군사적 패배의 함의를 유지하면서도 한국어에서 자연스러운 ‘넘어질 것입니다’로 옮겼습니다.
- source_word: וְאֵלֶּה יִמָּלְטוּ מִיָּדוֹ
  english_pob_choice: these will escape from his hand
  chosen_korean: 그의 손에서 벗어날 것입니다
  alternatives_korean:
  - 그의 손에서 탈출할 것입니다
  - 그의 손에서 빠져나갈 것입니다
  - 그의 권세에서 벗어날 것입니다
  lexicon: HALOT
  rationale: ‘손’은 권세·통제의 구체적 은유를 담고 있으므로 그대로 살렸고, ימלט의 ‘도망하다/벗어나다’는 한국어에서 가장 간결한 ‘벗어날 것입니다’로 표현했습니다.
- source_word: וְרֵאשִׁית בְּנֵי עַמּוֹן
  english_pob_choice: the foremost of the sons of Ammon
  chosen_korean: 암몬 자손의 으뜸
  alternatives_korean:
  - 암몬 자손의 우두머리
  - 암몬 족속의 수장
  - 암몬 자손의 선두
  lexicon: HALOT
  rationale: רֵאשִׁית는 ‘첫머리/으뜸/주요한 부분’의 뜻을 가질 수 있어, ‘암몬 자손의 으뜸’이 히브리어 구조를 비교적 직접적으로 보존합니다.
theological_decisions:
- issue: ‘여러분/사람들’처럼 암시된 목적어를 보충할지 여부
  chosen_reading: 히브리어의 생략을 유지해 ‘많은 이들이’로 처리했습니다.
  alternative_readings:
