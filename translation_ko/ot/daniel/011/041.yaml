  source_fidelity: ‘그의 손에서 벗어날 것입니다’와 지명 및 ‘암몬 자손의 으뜸’은 히브리어의 표현과 구조를 대체로 충실히 반영합니다. 다만 וּבָא는 화자·독자 쪽으로의 이동을 뜻하지 않으므로 ‘들어올’보다 중립적인 ‘들어갈’이 적절합니다. 또한 וְרַבּוֹת는 명시된 명사가 없는 여성 복수형으로, 사람과 땅/나라 가운데 무엇을 가리키는지 확정되지 않습니다. 한국어 본문의 ‘많은 이들이’는 자연스럽지만 사람으로 좁히므로, 그 한계를 설명하는 각주가 필요합니다.
  naturalness: ‘아름다운 땅에 들어갈 것이며’가 ‘들어올 것이고’보다 문어적 성경 문맥에서 자연스럽고, 합쇼체 문장 연결에도 잘 맞습니다. ‘암몬 자손의 으뜸’은 다소 직역적이지만 원문의 불투명성과 구성 관계를 보존하는 데 적절합니다.
