id: DAN.11.33
reference: Daniel 11:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַשְׂכִּ֣ילֵי עָ֔ם יָבִ֖ינוּ לָֽ/רַבִּ֑ים וְ/נִכְשְׁל֞וּ בְּ/חֶ֧רֶב וּ/בְ/לֶהָבָ֛ה בִּ/שְׁבִ֥י וּ/בְ/בִזָּ֖ה יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/033.yaml
  text: And those among the people who have insight will give understanding to the many[a], but they will stumble by sword and by flame, by captivity and by plunder[d][c][b], for days.
  footnotes:
  - marker: a
    text: Or 'the wise' for 'those among the people who have insight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will instruct many' or 'will cause many to understand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'fall' for 'stumble.' The Hebrew image can denote collapse, defeat, or death in persecution.
    reason: lexical_alternative
  - marker: d
    text: Or 'into captivity' for 'by captivity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성 중에서 깨달은 사람들은 많은 사람에게 깨닫게 할 것입니다[a]. 그러나 그들은 칼과 불꽃과 포로 됨과 약탈로 넘어질 것이며, 여러 날 동안 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜로운 사람들’ 혹은 ‘분별 있는 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּילֵי
  english_pob_choice: those among the people who have insight
  chosen_korean: 백성 중에서 깨달은 사람들
  alternatives_korean:
  - 지혜로운 사람들
  - 분별 있는 사람들
  - 통찰이 있는 사람들
  lexicon: HALOT
  rationale: 피엘 계열 분사로서 ‘이해/분별이 있는 사람들’의 성격을 살려, 단순한 지식보다 공동체 안에서 식별하는 사람들임을 드러냈습니다.
- source_word: יָבִינוּ לָרַבִּים
  english_pob_choice: will give understanding to the many
  chosen_korean: 많은 사람에게 깨닫게 할 것입니다
  alternatives_korean:
  - 많은 사람을 가르칠 것입니다
  - 많은 사람에게 이해를 줄 것입니다
  - 많은 사람을 깨닫게 할 것입니다
  lexicon: HALOT
  rationale: 히필 ‘이해하게 하다/가르치다’의 사역적 뉘앙스를 한국어에서 자연스럽게 ‘깨닫게 하다’로 옮겼습니다. ‘많은 사람에게’는 ל의 방향성을 살립니다.
- source_word: וְנִכְשְׁלוּ
  english_pob_choice: but they will stumble
  chosen_korean: 그러나 그들은 … 넘어질 것이며
  alternatives_korean:
  - 그러나 그들은 … 넘어질 것이고
  - 그러나 그들은 … 쓰러질 것이며
  - 그러나 그들은 … 걸려 넘어질 것이며
  lexicon: HALOT
  rationale: ‘stumble’의 비유를 살리되, 심한 박해 속의 좌절·패배까지 포괄할 수 있도록 직역에 가까운 ‘넘어질’로 옮겼습니다.
- source_word: בִּשְׁבִי וּבְבִזָּה
  english_pob_choice: by captivity and by plunder
  chosen_korean: 포로 됨과 약탈로
  alternatives_korean:
  - 포로 생활과 약탈로
  - 포로 됨과 노략질로
  - 포로와 노략으로
  lexicon: HALOT
  rationale: שׁבי는 상태를 가리키는 ‘포로 됨’으로, בִּזָּה는 현대 독자가 이해하기 쉬운 ‘약탈’로 옮겨 두 고난의 항목을 병렬로 유지했습니다.
theological_decisions:
- issue: ‘깨달은 사람들’이 ‘많은 사람’에게 주는 역할을 어떻게 표현할지
  chosen_reading: 가르치는 기능을 지나치게 좁히지 않고, 사역적 결과를 드러내는 ‘깨닫게 할 것입니다’로 번역했습니다.
  alternative_readings:
  - 많은 사람을 가르칠 것입니다
  - 많은 사람에게 이해를 줄 것입니다
  rationale: 히필은 단순한 내부 이해가 아니라 타인에게 이해를 전달하는 사역을 포함할 수 있으므로, 의미를 넓게 보존하되 과도한 해석은 피했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
