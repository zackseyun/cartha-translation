  text: וְ/אֹכְלֵ֧י פַת בָּג֛/וֹ יִשְׁבְּר֖וּ/הוּ וְ/חֵיל֣/וֹ יִשְׁט֑וֹף וְ/נָפְל֖וּ חֲלָלִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/026.yaml
  text: Those who eat his food will break him[a], and his army will be swept away[c][b], and many slain will fall.
  footnotes:
  - marker: a
    text: Or, 'those who eat the bread of his table,' an idiom for close associates or dependents who betray him from within.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'break him,' a figurative expression for bringing about his ruin.
    reason: lexical_alternative
  - marker: c
    text: 'The verb evokes flood imagery: ''his army will overflow / be swept away.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 음식을 먹는 자들이 그를 무너뜨릴 것이며,[a][b] 그의 군대가 넘쳐흐를 것이고,[c] 많은 사람이 죽임을 당해 쓰러질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 음식을 먹는 자들’은 왕의 음식을 함께 먹는 측근이나 신하들을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그를 깨뜨릴 것이다’라고 하며, 그의 몰락을 가리키는 비유적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 물이 넘쳐흐르는 모습을 나타내며, 여기서는 그의 군대가 물처럼 밀려드는 이미지를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכְלֵי פַת בָּגוֹ
  english_pob_choice: those who eat his food
  chosen_korean: 그의 음식을 먹는 자들
  alternatives_korean:
  - 그의 상을 먹는 자들
  - 그의 빵을 먹는 자들
  - 그의 식탁의 빵을 먹는 자들
  lexicon: HALOT
  rationale: 왕의 식사를 함께하는 측근이라는 관용적 의미를 살리되, 본문에 없는 ‘식탁’을 본문화하지 않기 위해 ‘그의 음식을 먹는 자들’로 옮겼습니다.
- source_word: יִשְׁבְּרֻהוּ
  english_pob_choice: will break him
  chosen_korean: 그를 무너뜨릴 것이며
  alternatives_korean:
  - 그를 부러뜨릴 것이며
  - 그를 파괴할 것이며
  - 그를 산산이 부술 것이며
  lexicon: HALOT
  rationale: שׁבר의 비유적 ‘꺾음/파멸’ 이미지를 한국어에서 자연스럽고도 직역에 가까운 ‘무너뜨리다’로 살렸습니다.
- source_word: יִשְׁטוֹף
  english_pob_choice: will be swept away
  chosen_korean: 쓸려가고
  alternatives_korean:
  - 넘쳐흐르고
  - 휩쓸려 가고
  - 홍수처럼 덮쳐가고
  lexicon: HALOT
  rationale: 홍수 이미지가 담긴 שטף를 군대에 대한 피동적 재난으로 나타내기 위해 ‘쓸려가다’로 옮겼습니다.
- source_word: חֲלָלִים רַבִּים
  english_pob_choice: many slain will fall
  chosen_korean: 많은 사람들이 죽임을 당해 쓰러질 것입니다
  alternatives_korean:
  - 많은 죽은 자들이 쓰러질 것입니다
  - 많은 살해된 자들이 쓰러질 것입니다
  - 많은 전사자가 쓰러질 것입니다
  lexicon: HALOT
  rationale: חֲלָלִים의 ‘죽임을 당한 자들’이라는 뜻을 드러내면서, 한국어에서 더 자연스러운 서술형으로 풀어 옮겼습니다.
