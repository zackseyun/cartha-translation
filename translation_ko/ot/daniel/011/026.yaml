  source_fidelity: 수정이 필요합니다. וְחֵילוֹ יִשְׁטוֹף는 문자적으로 ‘그의 군대/병력이 넘쳐흐를 것이다’라는 능동적 홍수 비유입니다. 초안의 ‘그의 군대는 쓸려가고’는 군대가 피동적으로 패퇴·휩쓸려 간다는 뜻으로 주어와 동사의 관계를 뒤집습니다. 이는 영어 POB 감사 기록의 수동 번역도 따르지 않아야 하는 원문의 문제입니다.
  naturalness: ‘그의 음식을 먹는 자들’과 ‘그를 무너뜨릴 것입니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘그의 군대가 넘쳐흐를 것이며’는 원문의 의도적인 홍수 이미지를 보존하면서도 문맥상 군대의 밀려드는 진군을 자연스럽게 나타냅니다.
  terminology: ‘음식을 먹는 자들’은 פַת בָּגוֹ의 궁정 의존 관계 관용구를 과도하게 본문화하지 않고 잘 전달합니다. ‘무너뜨리다’는 שבר의 비유적 파멸 의미에 적절합니다. ‘죽임을 당해 쓰러지다’는 חֲלָלִים רַבִּים의 피살자들이 쓰러짐을 적절히 반영합니다.
