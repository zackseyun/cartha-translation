id: DAN.11.32
reference: Daniel 11:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַרְשִׁיעֵ֣י בְרִ֔ית יַחֲנִ֖יף בַּ/חֲלַקּ֑וֹת וְ/עַ֛ם יֹדְעֵ֥י אֱלֹהָ֖י/ו יַחֲזִ֥קוּ וְ/עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/032.yaml
  text: He will corrupt with smooth words those who act wickedly against the covenant[b][a], but the people who know their God will stand firm and take action.
  footnotes:
  - marker: a
    text: Or 'with flattery' or 'by flatteries.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will be strong and act.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 언약을 거스르며 악을 행하는 자들을 매끄러운 말로 타락시키지만, 자기 하나님을 아는 백성은 굳게 서서 행동할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘매끄러운 말로’는 ‘아첨으로’ 혹은 ‘아첨하는 말로’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘굳게 서서 행동할 것입니다’는 ‘강해질 것이며 행할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְשִׁיעֵי בְרִית
  english_pob_choice: those who act wickedly against the covenant
  chosen_korean: 언약을 거스르며 악을 행하는 자들
  alternatives_korean:
  - 언약을 범하는 자들
  - 언약을 배반하는 악인들
  - 언약에 대하여 악을 행하는 자들
  lexicon: HALOT
  rationale: רשע의 분사형은 단순한 신분표지보다 ‘악을 행하는 자들’이라는 행위성을 드러내며, בְרִית와 결합할 때는 언약 자체를 겨냥한 위반의 관계를 한국어로 자연스럽게 풀어 주는 것이 좋습니다.
- source_word: יַחֲנִיף
  english_pob_choice: he will corrupt
  chosen_korean: 타락시키지만
  alternatives_korean:
  - 부패시키지만
  - 불경하게 만들지만
  - 사악하게 만들지만
  lexicon: HALOT
  rationale: חנף의 히필은 ‘경건하지 않게 만들다/타락시키다’의 뜻이 가능하므로, POB의 ‘corrupt’를 살리되 도덕·종교적 타락의 결과를 드러내는 한국어로 옮겼습니다.
- source_word: בַּחֲלַקּוֹת
  english_pob_choice: with smooth words
  chosen_korean: 매끄러운 말로
  alternatives_korean:
  - 아첨으로
  - 매끈한 말로
  - 아첨하는 말로
  lexicon: HALOT
  rationale: 직역하면 ‘매끄러운 것들/매끈한 것들’이지만 관용적으로는 유창하고 아첨하는 말을 가리키므로, 은유를 유지하면서도 한국어로 자연스러운 ‘매끄러운 말로’를 택했습니다.
- source_word: יַחֲזִקוּ
  english_pob_choice: will stand firm
  chosen_korean: 굳게 서서
  alternatives_korean:
  - 강해질 것이며
  - 견고할 것이며
  - 굳세게 버틸 것이며
  lexicon: HALOT
  rationale: חזק의 히필을 단순한 ‘강하다’보다, 박해 상황에서의 지속적 저항과 충성을 드러내는 ‘굳게 서다’로 옮기면 문맥의 힘이 살아납니다.
- source_word: וְעָשׂוּ
  english_pob_choice: and take action
  chosen_korean: 행동할 것입니다
  alternatives_korean:
  - 그리고 행할 것입니다
  - 그리고 할 것입니다
  - 그리고 일할 것입니다
  lexicon: HALOT
  rationale: עשה는 매우 넓은 동사이지만 이 문맥에서는 수동적 생존이 아니라 결단 있는 대응을 뜻하므로, 과도한 해석 없이도 의미를 선명하게 하는 ‘행동하다’를 사용했습니다.
theological_decisions:
- issue: 대조 구조의 강조
  chosen_reading: 언약을 거스르는 자들은 타락시키고, 하나님을 아는 백성은 굳게 서서 행동한다는 대조를 분명히 드러냈습니다.
  alternative_readings:
  - 대조를 약하게 하여 단순한 순차 서술로 옮길 수도 있습니다.
  rationale: 히브리어 문장은 배교자와 신실한 백성을 정면으로 대비하므로, 한국어에서도 ‘하지만’과 동사 선택을 통해 이 신학적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
