source:
  edition: WLC
  text: וְ/יָבֹא֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/יִשְׁפֹּךְ֙ סֽוֹלֲלָ֔ה וְ/לָכַ֖ד עִ֣יר מִבְצָר֑וֹת וּ/זְרֹע֤וֹת הַ/נֶּ֨גֶב֙ לֹ֣א יַעֲמֹ֔דוּ וְ/עַם֙ מִבְחָרָ֔י/ו וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/015.yaml
  text: Then the king of the north will come and heap up a siege ramp and capture a fortified city[a], and the forces of the south will not stand, nor his choice troops[b], for there will be no strength to stand.
  footnotes:
  - marker: a
    text: Or 'the arms of the south,' with 'arms' used metaphorically for military power or forces.
    reason: lexical_alternative
  - marker: b
    text: Or 'his chosen people'; the phrase likely refers in context to the king of the south's select troops or elite forces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 북방 왕이 와서 공성토를 쌓아 올리고 견고한 성읍을 점령할 것이며, 남쪽의 군세는 버티지 못하고, 그의 정예병도 버티지 못할 것이니, 버틸 힘이 없을 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 '공성토'는 성을 포위하기 위해 쌓는 공성 시설을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어의 '그의 뽑힌/선택된 사람들'은 여기서는 남쪽 왕의 정예병을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ הַצָּפוֹן
  english_pob_choice: the king of the north
  chosen_korean: 북방 왕
  alternatives_korean:
  - 북쪽 왕
  - 북의 왕
  lexicon: HALOT
  rationale: 다니엘 11장의 반복되는 정치·지리적 대칭을 살리기 위해 방향을 붙인 통치 호칭으로 옮겼습니다.
- source_word: וְיִשְׁפֹּךְ סֹלֲלָה
  english_pob_choice: heap up a siege ramp
  chosen_korean: 공성토를 쌓아 올리고
  alternatives_korean:
  - 포위 둔덕을 쌓고
  - 공성 둔덕을 쌓아 올리고
  lexicon: HALOT
  rationale: מְ/סֹלֲלָה는 성을 공격하기 위한 포위용 토목 공사를 가리키므로, 현대 한국어에서 의미가 분명한 '공성토'로 옮겼습니다.
- source_word: עִיר מִבְצָרוֹת
  english_pob_choice: a fortified city
  chosen_korean: 견고한 성읍
  alternatives_korean:
  - 요새화된 성읍
  - 견고한 도시
  lexicon: HALOT
  rationale: 구문 전체의 관용적 의미는 '성채 같은 도시'이므로, 군사적 방어성이 드러나는 '견고한 성읍'으로 자연스럽게 옮겼습니다.
- source_word: וּזְרֹעוֹת הַנֶּגֶב
  english_pob_choice: the forces of the south
  chosen_korean: 남쪽의 군세
  alternatives_korean:
  - 남쪽의 팔들
  - 남방의 군력
  lexicon: HALOT
  rationale: '''팔들''은 히브리어 비유를 보존하지만 한국어에서는 군사력의 은유가 즉시 드러나지 않으므로, 문맥상 의미를 드러내는 ''군세''를 택했습니다.'
- source_word: וְעַם מִבְחָרָיו
  english_pob_choice: nor his choice troops
  chosen_korean: 그의 정예병도
  alternatives_korean:
  - 그의 선발 병력도
  - 그의 뽑힌 사람들도
  lexicon: HALOT
  rationale: 문맥상 남쪽 왕의 선별된 군사력을 가리키므로, '정예병'이 가장 자연스럽고 군사적 의미를 분명히 전달합니다.
- source_word: לַעֲמֹד
  english_pob_choice: to stand
  chosen_korean: 버티지 못할
  alternatives_korean:
  - 맞서지 못할
  - 서 있지 못할
  lexicon: HALOT
  rationale: 동사 '서다'의 군사적 관용법을 한국어에서는 전투에서 '버티다/버티지 못하다'로 옮겨, 항전 실패의 뜻을 살렸습니다.
theological_decisions:
- issue: 남쪽의 군대와 정예병을 나타내는 비유적 표현의 처리
  chosen_reading: 히브리어 '팔들'의 직역을 피하고, 문맥상 군사력을 가리키는 표현으로 옮겼습니다.
  alternative_readings:
  - '''남쪽의 팔들''처럼 비유를 직접 보존하는 번역'
  - '''남쪽의 군력''처럼 추상화하는 번역'
  rationale: 예언-역사적 서술에서 독자가 즉시 이해해야 할 핵심은 군사적 패배이므로, 은유를 한국어에서 기능적으로 풀어 전달했습니다.
  doctrine_reference: 문맥 충실성 원칙
