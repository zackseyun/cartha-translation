id: DAN.11.42
reference: Daniel 11:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִשְׁלַ֥ח יָד֖/וֹ בַּ/אֲרָצ֑וֹת וְ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א תִהְיֶ֖ה לִ/פְלֵיטָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/042.yaml
  text: He will stretch out his hand against the countries[a], and the land of Egypt will not escape.
  footnotes:
  - marker: a
    text: Or, 'will have no escape.' The Hebrew literally says 'will not be for escape.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 여러 나라를 향해 자기 손을 내밀 것이며, 이집트 땅도 피하지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘도피를 위해 있지 않을 것이다’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: וְיִשְׁלַח יָדוֹ
  english_pob_choice: will stretch out his hand
  chosen_korean: 자기 손을 내밀 것이며
  alternatives_korean:
  - 손을 뻗을 것이며
  - 손을 펼칠 것이며
  - 손을 뻗어 공격할 것이며
  lexicon: HALOT
  rationale: 히브리어 관용구를 따라 ‘손을 내밀다’로 유지하되, 군사적 압박의 뉘앙스가 드러나도록 자연스럽게 옮겼습니다.
- source_word: בָּאֲרָצוֹת
  english_pob_choice: against the countries
  chosen_korean: 여러 나라를 향해
  alternatives_korean:
  - 나라들을 향해
  - 땅들을 향해
  - 여러 지역을 향해
  lexicon: HALOT
  rationale: 전치사의 대립/공격 방향을 살리면서, 복수형 ‘countries’에 해당하는 자연스러운 현대 한국어 표현으로 다듬었습니다.
- source_word: וְאֶרֶץ מִצְרַיִם
  english_pob_choice: and the land of Egypt
  chosen_korean: 이집트 땅도
  alternatives_korean:
  - 이집트 땅은
  - 이집트도
  - 이집트 땅 또한
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’ 표현을 보존해 지리적 강조를 살렸고, 문맥상 뒤의 예외 불가능성을 위해 ‘도’를 붙였습니다.
- source_word: לֹא תִהְיֶה לִפְלֵיטָה
  english_pob_choice: will not escape
  chosen_korean: 피하지 못할 것입니다
  alternatives_korean:
  - 도피처가 되지 못할 것입니다
  - 탈출하지 못할 것입니다
  - 구원받지 못할 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘피할/도피할 수 있는 상태가 되지 않다’는 뜻이므로, 한국어에서는 결과적으로 ‘피하지 못하다’가 가장 자연스럽습니다.
