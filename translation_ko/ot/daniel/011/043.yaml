source:
  edition: WLC
  text: וּ/מָשַׁ֗ל בְּ/מִכְמַנֵּי֙ הַ/זָּהָ֣ב וְ/הַ/כֶּ֔סֶף וּ/בְ/כֹ֖ל חֲמֻד֣וֹת מִצְרָ֑יִם וְ/לֻבִ֥ים וְ/כֻשִׁ֖ים בְּ/מִצְעָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/043.yaml
  text: And he will rule over the treasures of gold and silver[a], and over all the precious things of Egypt[b]; and the Libyans and Cushites will be in his train.
  footnotes:
  - marker: a
    text: Or 'treasures of gold and silver' for 'the hidden stores of gold and silver.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Libyans and Ethiopians will follow at his steps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 금과 은의 숨겨진 곳들을, 곧 이집트의 모든 귀한 것들을 다스릴 것이며, 리비아 사람들과 구스 사람들은 그의 뒤를 따를 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금과 은의 숨겨진 곳들’ — 히브리어는 감추어 둔 저장처의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 수행단에 있게 될 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁל
  english_pob_choice: And he will rule over
  chosen_korean: 다스릴 것입니다
  alternatives_korean:
  - 통치할 것입니다
  - 주권을 행사할 것입니다
  lexicon: HALOT
  rationale: מָשַׁל은 여기서 지배하거나 통치하는 뜻이므로, 현대 한국어에서 자연스러운 ‘다스리다’로 옮기되 지배의 의미를 유지했습니다.
- source_word: בְּמִכְמַנֵּי הַזָּהָב וְהַכֶּסֶף
  english_pob_choice: the hidden stores of gold and silver
  chosen_korean: 금과 은의 숨겨진 곳들
  alternatives_korean:
  - 금과 은의 보물들
  - 금과 은의 감추어진 저장고들
  lexicon: HALOT
  rationale: מִכְמָן은 감추어 둔 저장된 것들을 가리키므로, POB의 ‘hidden stores’에 맞춰 ‘숨겨진 곳들’로 살려 두었고, 단순한 ‘보물’보다 감춰진 보관처의 뉘앙스를 유지했습니다.
- source_word: חֲמֻדוֹת מִצְרָיִם
  english_pob_choice: all the precious things of Egypt
  chosen_korean: 이집트의 모든 귀한 것들
  alternatives_korean:
  - 이집트의 모든 보물
  - 이집트의 모든 소중한 것들
  lexicon: HALOT
  rationale: חֲמֻדוֹת는 값지고 바람직한 것들을 뜻하므로, 재물에 한정하지 않고 ‘귀한 것들’로 옮겨 가치의 범위를 넓게 유지했습니다.
- source_word: לֻבִים וְכֻשִׁים
  english_pob_choice: the Libyans and Cushites
  chosen_korean: 리비아 사람들과 구스 사람들
  alternatives_korean:
  - 리비아인들과 구스인들
  - 루빔들과 쿠쉬인들
  lexicon: HALOT
  rationale: 민족명은 한국어 성경 가독성을 위해 음역보다 뜻 번역을 택하되, ‘구스’는 역사적-지리적 명칭을 보존했습니다.
- source_word: בְּמִצְעָדָיו
  english_pob_choice: will be in his train
  chosen_korean: 그의 뒤를 따를 것입니다
  alternatives_korean:
  - 그의 행렬에 있을 것입니다
  - 그의 발걸음을 따를 것입니다
  lexicon: HALOT
  rationale: ‘in his train’은 단순한 위치가 아니라 수행·추종의 그림이므로, 자연스럽게 ‘그의 뒤를 따르다’로 옮겼습니다.
theological_decisions:
- issue: 민족명과 지리명 번역의 역사성
  chosen_reading: ‘구스 사람들’로 번역해 고대 지리-민족 명칭을 보존했습니다.
  alternative_readings:
  - ‘에티오피아 사람들’
  - ‘구시 사람들’
  rationale: 본문은 현대 국가명보다 고대의 역사적 범주를 가리키므로, 후대 국가명으로 치환하면 시기상 어긋날 수 있습니다.
  doctrine_reference: 성경 본문 역사성 및 문맥 우선 원칙
