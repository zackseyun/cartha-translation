id: DAN.11.45
reference: Daniel 11:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִטַּע֙ אָהֳלֶ֣י אַפַּדְנ֔/וֹ בֵּ֥ין יַמִּ֖ים לְ/הַר צְבִי קֹ֑דֶשׁ וּ/בָא֙ עַד קִצּ֔/וֹ וְ/אֵ֥ין עוֹזֵ֖ר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/045.yaml
  text: He will pitch the tents of his royal pavilion between the seas and the beautiful holy mountain[a]; yet he will come to his end[b], and there will be no one to help him.
  footnotes:
  - marker: a
    text: Or 'his palace,' 'his palatial tent,' or 'his pavilion.' The rare word likely refers to a royal residence or state pavilion.
    reason: lexical_alternative
  - marker: b
    text: Or 'the glorious holy mountain.' The Hebrew expression may denote the holy mountain in its beauty or splendor, likely referring to Zion/Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 바다들 사이와 아름답고 거룩한 산에 자기 왕실 천막들을 칠 것이나[a], 끝이 이르며[b] 그를 도와줄 자가 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 궁전’, ‘그의 궁정 천막’, ‘그의 천막식 거처’. 이 희귀어는 왕실 거처나 의전용 천막을 가리키는 말일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영광스럽고 거룩한 산’. 이 히브리어 표현은 그 아름다움이나 광채에 있는 거룩한 산을 가리킬 수 있으며, 아마도 시온/예루살렘을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִטַּע
  english_pob_choice: He will pitch
  chosen_korean: 칠 것이나
  alternatives_korean:
  - 설 것이나
  - 세울 것이나
  - 칠 것입니다
  lexicon: HALOT
  rationale: 천막을 대상으로 하는 נטע는 ‘심다’보다 ‘치다/세우다’의 관용적 뜻이 자연스럽고, 문맥상 군사적 왕실 진영의 이미지를 살리기에 ‘치다’가 적절합니다.
- source_word: אָהֳלֵי אַפַּדְנוֹ
  english_pob_choice: the tents of his royal pavilion
  chosen_korean: 자기 왕실 천막들
  alternatives_korean:
  - 자기 궁전 천막들
  - 자기 왕실 막사들
  - 자기 궁정 천막들
  lexicon: HALOT
  rationale: 희귀어 אַפַּדְנוֹ는 왕실 거처/의전용 천막을 가리킬 가능성이 크므로, ‘궁전’처럼 고정 건물을 암시하기보다 ‘왕실 천막들’로 옮겨 텐트 이미지와 위엄을 함께 보존했습니다.
- source_word: בֵּין יַמִּים לְהַר צְבִי קֹדֶשׁ
  english_pob_choice: between the seas and the beautiful holy mountain
  chosen_korean: 바다들 사이와 아름답고 거룩한 산에
  alternatives_korean:
  - 바다들 사이와 아름답고 거룩한 산 사이에
  - 바다와 바다 사이에 있는 아름답고 거룩한 산에
  - 바다들 사이와 영광스러운 거룩한 산에
  lexicon: HALOT
  rationale: יַמִּים의 복수와 לְ의 방향/위치를 살리되, 한국어에서는 ‘~에’가 전체 구문을 가장 자연스럽게 받습니다. צְבִי를 전통적 ‘영광’보다 현대어 ‘아름답고’로 풀어 의미를 직접 드러냈습니다.
- source_word: וּבָא עַד קִצּוֹ
  english_pob_choice: yet he will come to his end
  chosen_korean: 끝이 이르며
  alternatives_korean:
  - 그는 끝에 이를 것이며
  - 그러나 그는 끝에 이를 것이며
  - 그는 종말에 이를 것이며
  lexicon: HALOT
  rationale: ‘come to his end’의 관용적 종결 의미를 보존하면서, 한국어에서 자연스러운 결과 표현으로 압축했습니다. 주어의 귀속을 분명히 하기 위해 앞절의 ‘그는’이 이어집니다.
- source_word: וְאֵין עוֹזֵר לוֹ
  english_pob_choice: and there will be no one to help him
  chosen_korean: 그를 도와줄 자가 없을 것입니다
  alternatives_korean:
  - 그를 돕는 이가 없을 것입니다
  - 그를 도울 사람이 없을 것입니다
  - 도와줄 자가 전혀 없을 것입니다
  lexicon: HALOT
  rationale: עוזר는 ‘돕는 자/도와주는 자’이므로, 서술적이면서도 원문의 단절감을 살리는 ‘도와줄 자가 없을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 11:45의 왕 인물 식별을 본문에서 확정할지 여부
  chosen_reading: 본문은 단순히 ‘그’로 유지하고, 특정 역사적·종말론적 인물로 식별하지 않았습니다.
  alternative_readings:
  - 안티오쿠스 4세 에피파네스
  - 종말론적 적그리스도
  - 유형론적/복합적 통치자
  rationale: 히브리어 본문은 3인칭 형태만 사용하며, 인물 식별은 해석상 쟁점이므로 번역문에 특정 해석을 주입하지 않는 것이 원문에 가장 충실합니다.
  doctrine_reference: 해석 쟁점을 본문에서 보존
