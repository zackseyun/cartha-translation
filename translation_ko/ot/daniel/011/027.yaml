source:
  edition: WLC
  text: וּ/שְׁנֵי/הֶ֤ם הַ/מְּלָכִים֙ לְבָבָ֣/ם לְ/מֵרָ֔ע וְ/עַל שֻׁלְחָ֥ן אֶחָ֖ד כָּזָ֣ב יְדַבֵּ֑רוּ וְ/לֹ֣א תִצְלָ֔ח כִּי ע֥וֹד קֵ֖ץ לַ/מּוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/027.yaml
  text: As for both of them[a], the kings—their hearts are set on evil, and at one table they will speak lies, but it will not succeed[c][b], for the end is still for the appointed time.
  footnotes:
  - marker: a
    text: Or 'they will speak falsehood' or 'they will tell lies.'
    reason: lexical_alternative
  - marker: b
    text: Or 'but it will not prosper.' The Hebrew verb is feminine singular, likely referring impersonally to their scheme or outcome.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the end is yet for the appointed time.' The wording emphasizes that the outcome awaits a fixed time.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 둘의 마음은 악을 향해 있고, 한 식탁에서 거짓을 말하겠지만, 그것은 성공하지 못할 것입니다. 왜냐하면 끝은 아직 정해진 때를 기다리고 있기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거짓을 말할 것입니다” 또는 “거짓말을 할 것입니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “성공하지 못할 것입니다.” 히브리어 동사는 여성 단수형으로, 아마 그들의 계획이나 결과를 비인칭적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “끝은 아직 정해진 때를 위한 것입니다.” 이 표현은 결과가 정해진 시점을 기다린다는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵיהֶם הַמְּלָכִים
  english_pob_choice: As for both of them, the kings
  chosen_korean: 그들 둘의 마음은
  alternatives_korean:
  - 두 왕의 마음은
  - 그 둘인 왕들의 마음은
  lexicon: HALOT
  rationale: 두 왕을 다시 지시하는 표현으로 이해했고, 한국어에서는 주어를 앞에 내세워 문맥상 대상 전환을 자연스럽게 드러냈습니다.
- source_word: לְבָבָם לְמֵרָע
  english_pob_choice: their hearts are set on evil
  chosen_korean: 마음은 악을 향해 있고
  alternatives_korean:
  - 마음이 악에 기울어 있고
  - 마음이 악을 행하려 하고
  lexicon: HALOT
  rationale: 직역적 '악을 위해'보다, 의도와 성향이 고정된 상태를 한국어 관용으로 살렸습니다.
- source_word: וְעַל שֻׁלְחָן אֶחָד כָּזָב יְדַבֵּרוּ
  english_pob_choice: and at one table they will speak lies
  chosen_korean: 한 식탁에서 거짓을 말하겠지만
  alternatives_korean:
  - 한 상에서 거짓말을 하겠지만
  - 같은 식탁에서 거짓을 말하겠지만
  lexicon: HALOT
  rationale: שֻׁלְחָן을 문자 그대로 '식탁'으로 옮겨 공동 자리에서의 외교적 기만 이미지를 보존했습니다.
- source_word: וְלֹא תִצְלָח
  english_pob_choice: but it will not succeed
  chosen_korean: 그것은 성공하지 못할 것입니다
  alternatives_korean:
  - 그것은 이루어지지 못할 것입니다
  - 그것은 번성하지 못할 것입니다
  lexicon: HALOT
  rationale: 여성 단수 동사의 비인칭적 용법을 반영해, 그들의 속임수/계획 전체를 가리키는 중성적 한국어로 옮겼습니다.
- source_word: ע֥וֹד קֵ֖ץ לַמּוֹעֵד
  english_pob_choice: for the end is still for the appointed time
  chosen_korean: 왜냐하면 끝은 아직 정해진 때를 기다리고 있기 때문입니다
  alternatives_korean:
  - 왜냐하면 끝은 아직 정한 때를 향해 있기 때문입니다
  - 왜냐하면 끝은 아직 정해진 때를 위한 것이기 때문입니다
  lexicon: HALOT
  rationale: עוֹד과 מוֹעֵד의 시간성을 살리면서, 자연스러운 현대 한국어로 '정해진 때'를 택해 고정된 시점을 분명히 했습니다.
theological_decisions:
- issue: The verse’s failure clause uses an impersonal feminine singular verb, leaving the referent of 'it' somewhat open.
  chosen_reading: '''그것은 성공하지 못할 것입니다''로 옮겨 그들의 공모 전체를 가리키는 비인칭적 뜻을 유지했습니다.'
  alternative_readings:
  - '''그들의 계획은 성공하지 못할 것입니다''로 구체화하기'
  - '''그것은 번성하지 못할 것입니다''로 보다 넓게 옮기기'
  rationale: 본문은 계획/결과를 암시하지만 직접 명시하지 않으므로, 의미를 분명히 하되 해석을 과도하게 확정하지 않았습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
