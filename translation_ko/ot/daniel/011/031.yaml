id: DAN.11.31
reference: Daniel 11:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/זְרֹעִ֖ים מִמֶּ֣/נּוּ יַעֲמֹ֑דוּ וְ/חִלְּל֞וּ הַ/מִּקְדָּ֤שׁ הַ/מָּעוֹז֙ וְ/הֵסִ֣ירוּ הַ/תָּמִ֔יד וְ/נָתְנ֖וּ הַ/שִּׁקּ֥וּץ מְשׁוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/031.yaml
  text: And forces from him will arise[a], and they will profane the sanctuary fortress, and remove the regular burnt offering[d][c][b], and set up the abomination that desolates.
  footnotes:
  - marker: a
    text: Or 'arms' or 'military forces' for 'forces.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sanctuary, the fortress'; possibly 'the fortified sanctuary.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the regular/continual'; this refers to the regular daily burnt offering.
    reason: lexical_alternative
  - marker: d
    text: Or 'the abomination causing desolation.'
    reason: alternative_reading
translation:
  language: ko
  text: 그에게서 군대가 일어나 성소, 곧 요새를 더럽히고, 매일 드리는 번제를 없애며, 황폐하게 하는 가증한 것을 세울 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘팔들’ 혹은 ‘군사력’으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘성소, 곧 요새’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘정기적/지속적’의 뜻으로, 여기서는 매일 드리는 번제를 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘황폐하게 하는 가증한 것’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּזְרֹעִים
  english_pob_choice: forces
  chosen_korean: 군대
  alternatives_korean:
  - 부대
  - 무력
  - 무장 세력
  lexicon: HALOT
  rationale: 군사적·정치적 맥락에서 ‘팔들’의 관용적 의미를 자연스럽게 드러내면서도, 한국어 독자가 즉시 이해할 수 있게 합니다.
- source_word: וְחִלְּלוּ
  english_pob_choice: they will profane
  chosen_korean: 더럽히고
  alternatives_korean:
  - 모독하고
  - 속되게 하고
  - 더럽혀
  lexicon: HALOT
  rationale: 성소를 향한 행위를 한국어 성경어휘로는 ‘더럽히다’가 가장 직접적이며, ‘profane’의 성스러운 것에 대한 훼손을 잘 반영합니다.
- source_word: הַמִּקְדָּשׁ הַמָּעוֹז
  english_pob_choice: the sanctuary fortress
  chosen_korean: 성소, 곧 요새
  alternatives_korean:
  - 요새 같은 성소
  - 성소인 요새
  - 견고한 성소
  lexicon: HALOT
  rationale: 히브리어의 병렬·동격적 압축을 살리기 위해 두 명사를 모두 드러내되, 한국어에서는 ‘곧’으로 설명적 동격을 표시했습니다.
- source_word: הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 매일 드리는 번제
  alternatives_korean:
  - 정규 번제
  - 항상 드리는 제사
  - 지속적인 번제
  lexicon: HALOT
  rationale: 다니엘 문맥에서 반복되는 성전 제의의 정기성을 한국어로 분명히 하되, POB의 ‘burnt offering’에 해당하는 번제 용어를 유지했습니다.
- source_word: הַשִּׁקּוּץ מְשׁוֹמֵם
  english_pob_choice: the abomination that desolates
  chosen_korean: 황폐하게 하는 가증한 것
  alternatives_korean:
  - 황폐를 가져오는 가증한 것
  - 멸망케 하는 혐오스러운 것
  - 황폐시키는 가증한 우상
  lexicon: HALOT
  rationale: ‘가증한 것’은 שִׁקּוּץ의 우상적 혐오성을 살리고, ‘황폐하게 하는’은 פע동 분사의 능동적 효과를 한국어로 자연스럽게 옮깁니다.
theological_decisions:
- issue: הַמִּקְדָּשׁ הַמָּעוֹז의 관계를 어떻게 드러낼지
  chosen_reading: ‘성소, 곧 요새’로 옮겨 두 명사의 긴밀한 결합을 보존했습니다.
  alternative_readings:
  - ‘요새화된 성소’
  - ‘성소 요새’
  - ‘견고한 성소’
  rationale: 히브리어는 두 명사를 압축적으로 붙여 놓아 정확히 어느 쪽이 수식어인지 단정하기 어렵습니다. 한국어에서도 그 긴장을 풀어버리지 않고, 동격 표지로만 최소한의 해석을 더했습니다.
  doctrine_reference: Translation philosophy §3
- issue: הַתָּמִיד의 구체화 정도
  chosen_reading: ‘매일 드리는 번제’로 구체화했습니다.
  alternative_readings:
  - ‘항상 드리는 제물’
  - ‘정기 제물’
  - ‘늘 드리는 제사’
  rationale: 다니엘의 제의 문맥에서는 단순한 ‘계속되는 것’이 아니라 정기적 희생제사를 가리키는 뜻이 분명합니다. 의미를 분명히 하되 문맥이 허용하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
