  chosen_korean: 황폐하게 하는 가증한 것
  alternatives_korean:
  - 황폐를 가져오는 가증한 것
  - 멸망케 하는 혐오스러운 것
  - 황폐시키는 가증한 우상
  lexicon: HALOT
  rationale: ‘가증한 것’은 שִׁקּוּץ의 우상적 혐오성을 살리고, ‘황폐하게 하는’은 פע동 분사의 능동적 효과를 한국어로 자연스럽게 옮깁니다.
theological_decisions:
- issue: הַמִּקְדָּשׁ הַמָּעוֹז의 관계를 어떻게 드러낼지
  chosen_reading: ‘성소, 곧 요새’로 옮겨 두 명사의 긴밀한 결합을 보존했습니다.
  alternative_readings:
  - ‘요새화된 성소’
  - ‘성소 요새’
  - ‘견고한 성소’
  rationale: 히브리어는 두 명사를 압축적으로 붙여 놓아 정확히 어느 쪽이 수식어인지 단정하기 어렵습니다. 한국어에서도 그 긴장을 풀어버리지 않고, 동격 표지로만 최소한의 해석을 더했습니다.
  doctrine_reference: Translation philosophy §3
- issue: הַתָּמִיד의 구체화 정도
  chosen_reading: ‘매일 드리는 번제’로 구체화했습니다.
  alternative_readings:
  - ‘항상 드리는 제물’
  - ‘정기 제물’
  - ‘늘 드리는 제사’
  rationale: 다니엘의 제의 문맥에서는 단순한 ‘계속되는 것’이 아니라 정기적 희생제사를 가리키는 뜻이 분명합니다. 의미를 분명히 하되 문맥이 허용하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
