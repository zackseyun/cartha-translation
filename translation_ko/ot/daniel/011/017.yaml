id: DAN.11.17
reference: Daniel 11:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשֵׂ֣ם פָּ֠נָי/ו לָ/ב֞וֹא בְּ/תֹ֧קֶף כָּל מַלְכוּת֛/וֹ וִ/ישָׁרִ֥ים עִמּ֖/וֹ וְ/עָשָׂ֑ה וּ/בַ֤ת הַ/נָּשִׁים֙ יִתֶּן ל֣/וֹ לְ/הַשְׁחִיתָ֔/הּ וְ/לֹ֥א תַעֲמֹ֖ד וְ/לֹא ל֥/וֹ תִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/017.yaml
  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
  footnotes:
  - marker: a
    text: Or 'and equitable terms will be with him,' or 'and an agreement will be made with him.' The Hebrew phrase 'upright ones' is difficult in context and may refer either to persons with him or to fair terms/arrangements.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the daughter of women,' likely referring to a royal daughter given in marriage; many understand this historically as a political marriage alliance.
    reason: cultural_note
  - marker: c
    text: The Hebrew suffix in 'to destroy it/her' is feminine singular and may refer either to the woman ('to ruin her') or to a feminine antecedent such as a kingdom or plan.
    reason: lexical_alternative
  - marker: d
    text: Or 'but it will not stand' or 'but she will not succeed.' The feminine verb may refer to the woman or to the scheme.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 온 왕국의 힘을 다해 오기로 마음먹고, 그와 함께 정당한 조건들을 내세워 일을 실행할 것입니다.[a] 그는 여인들의 딸을[b] 그에게 주어 그것을 멸하려 하나[c], 그녀는 성공하지 못할 것이며[d], 그를 위한 사람이 되지도 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 함께 바른 사람들이 있을 것이다’, ‘그와 함께 공정한 조건들이 있을 것이다’, 또는 ‘그와 합의가 이루어질 것이다’. 히브리어 ‘곧은 자들/바른 것들’이라는 표현은 이 문맥에서 난해하며, 사람들 또는 공정한 조건·합의를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘여인들의 딸’입니다. 대개 정치적 혼인을 위해 주어진 왕실의 딸로 이해됩니다.
    reason: cultural_note
  - marker: c
    text: ‘그것을 멸하려’에 해당하는 히브리어 목적어 접미사는 여성 단수입니다. 이는 그 여인, 또는 왕국이나 계획 같은 여성형 선행사를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘그러나 그녀/그것은 서지 못할 것이다’입니다. 여성 단수 동사는 그 여인 또는 그 계략을 가리킬 수 있으며, ‘성공하지 못할 것이다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשֵׂם פָּנָיו
  english_pob_choice: he will set his face
  chosen_korean: 얼굴을 정하고
  alternatives_korean:
  - 얼굴을 향하고
  - 결심하고
  lexicon: HALOT
  rationale: 히브리어 관용구의 결연한 의도를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘얼굴을 정하고’로 옮겼습니다.
- source_word: וִישָׁרִים עִמּוֹ
  english_pob_choice: upright ones will be with him
  chosen_korean: 바른 것들이 그와 함께할 것입니다
  alternatives_korean:
  - 바른 사람들이 그와 함께할 것입니다
  - 공정한 협의가 그와 함께할 것입니다
  - 바른 조건들이 그와 함께할 것입니다
  lexicon: HALOT
  rationale: 이 구절은 문맥상 인물인지, 공정한 조건/합의인지가 애매하므로, 어휘상 ‘straight/upright’의 핵심을 살리면서도 해석을 과도하게 고정하지 않는 표현을 택했습니다.
- source_word: וּבַת הַנָּשִׁים
  english_pob_choice: the daughter of women
  chosen_korean: 여인들의 딸
  alternatives_korean:
  - 여자들의 딸
  - 여인 가운데의 딸
  - 여인의 딸
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 유지해 왕실 혼인용 여인이라는 역사적 함의를 암시하되, 본문 자체보다 더 좁게 풀이하지는 않았습니다.
- source_word: לְהַשְׁחִיתָהּ
  english_pob_choice: to destroy it
  chosen_korean: 그를 멸하려고
  alternatives_korean:
  - 그것을 멸하려고
  - 그녀를 멸하려고
  - 그것을 파멸시키려고
  lexicon: HALOT
  rationale: 목적격 접미사가 여성 단수라 대상이 여인인지, 앞선 여성형 선행사인지 애매하므로, POB의 주석적 긴장을 반영해 관계 대명사를 한국어로는 ‘그를’로 두었습니다.
- source_word: וְלֹא לוֹ תִהְיֶה
  english_pob_choice: and she will not be for him
  chosen_korean: 그에게 속하지도 않을 것입니다
  alternatives_korean:
  - 그의 것이 되지도 않을 것입니다
  - 그에게 속한 자가 되지도 않을 것입니다
  - 그 편이 되지도 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 관계적·소유적 뉘앙스를 보존하면서, 혼인·동맹 맥락에 맞게 ‘속하다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여성형 동사의 지시 대상과 정치적 혼인 표현의 처리
  chosen_reading: 본문은 인물과 계획/왕국 사이의 지시가 흔들리는 난구절로 보고, 한국어 본문에서는 그 모호성을 가능한 한 유지했습니다.
  alternative_readings:
  - 그 여인이 멸망할 것이다
  - 그 계략이 성공하지 못할 것이다
  - 그 왕국/계획이 서지 못할 것이다
  rationale: 본문이 의도적으로 남긴 문법적 긴장을 해소해 버리면 해석 범위가 과도하게 좁아지므로, 독자가 주석을 통해 검토할 수 있도록 모호성을 보존했습니다.
  doctrine_reference: 본문비평/해석학적 신중성
