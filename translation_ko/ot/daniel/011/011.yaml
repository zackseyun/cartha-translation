revisions:
- from: 그때 남방 왕은 격분하여 나가서 북방 왕과 싸울 것입니다. 그리고 그는 큰 무리를 일으키겠지만, 그 무리는 그의 손에 넘겨질 것입니다.[a][b][c]
  to: 그때 남방 왕은 격분하여 나가서 북방 왕과 싸울 것입니다.[a][b] 북방 왕은 큰 무리를 일으킬 것이나, 그 무리는 남방 왕의 손에 넘겨질 것입니다.[c]
  rationale: 북방 왕이 큰 무리를 일으키고 그 무리가 남방 왕에게 넘겨지는 대명사 관계를 한국어에서 명시하여 원문의 문맥적 지시를 보존했습니다. 또한 각주 표지를 해당 어구에 연결했습니다. ‘손’의 비유적 이미지는 본문에 유지하고 각주로 의미를 설명했습니다.
  reviewer_model: gpt-5.6-terra
