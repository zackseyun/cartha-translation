id: DAN.11.11
reference: Daniel 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִתְמַרְמַר֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יָצָ֕א וְ/נִלְחַ֥ם עִמּ֖/וֹ עִם מֶ֣לֶךְ הַ/צָּפ֑וֹן וְ/הֶעֱמִיד֙ הָמ֣וֹן רָ֔ב וְ/נִתַּ֥ן הֶ/הָמ֖וֹן בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/011.yaml
  text: Then the king of the South will become enraged and go out and fight with him[a], with the king of the North; and he will raise up a great multitude[c][b], but the multitude will be given into his hand.
  footnotes:
  - marker: a
    text: Or 'will be stirred up' / 'will become embittered.' The Hebrew verb conveys intense inner agitation leading to action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fight with him, with the king of the North'—that is, engage in battle against him.
    reason: lexical_alternative
  - marker: c
    text: '''Into his hand'' is a Hebrew idiom meaning ''into his power.'''
    reason: cultural_note
translation:
  language: ko
  text: 그때 남방 왕은 격분하여 나가서 북방 왕과 싸울 것입니다. 그리고 그는 큰 무리를 일으키겠지만, 그 무리는 그의 손에 넘겨질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘격동될 것입니다’ / ‘쓰라린 마음이 될 것입니다’. 히브리어 동사는 강한 내적 동요가 행동으로 이어지는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그와 싸울 것입니다, 곧 북방 왕과’라는 뜻으로, 그를 상대로 전쟁을 벌인다는 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 손에’는 히브리어 관용구로 ‘그의 권세 아래로’라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִתְמַרְמַר
  english_pob_choice: will become enraged
  chosen_korean: 격분하여
  alternatives_korean:
  - 분개하여
  - 격해져서
  - 격앙되어
  lexicon: HALOT
  rationale: 히트파엘형은 강한 내적 동요가 분노로 표출되는 뉘앙스를 가지므로, 문맥의 전투적 긴장을 살려 ‘격분하여’로 옮겼습니다.
- source_word: מֶלֶךְ הַנֶּגֶב / מֶלֶךְ הַצָּפוֹן
  english_pob_choice: the king of the South / the king of the North
  chosen_korean: 남방 왕 / 북방 왕
  alternatives_korean:
  - 남쪽 왕 / 북쪽 왕
  - 남의 왕 / 북의 왕
  lexicon: HALOT
  rationale: 다니엘 11장의 고정된 지정학적 칭호이므로, 방향성을 유지하는 직역형 표현인 ‘남방 왕’과 ‘북방 왕’을 사용했습니다.
- source_word: וְהֶעֱמִיד הָמוֹן רָב
  english_pob_choice: he will raise up a great multitude
  chosen_korean: 큰 무리를 일으키겠지만
  alternatives_korean:
  - 큰 군대를 모으겠지만
  - 큰 무리를 세우겠지만
  - 큰 무리를 일으키고
  lexicon: HALOT
  rationale: העמיד는 ‘세우다’의 원의미에서 확장되어 군사적 ‘모으다/일으키다’의 뜻이 되므로, 군사적 동원과 숫자의 크기를 함께 드러내는 ‘일으키다’를 택했습니다.
- source_word: וְנִתַּן הֶהָמוֹן בְּיָדוֹ
  english_pob_choice: the multitude will be given into his hand
  chosen_korean: 그 무리는 그의 손에 넘겨질 것입니다
  alternatives_korean:
  - 그 무리는 그의 손에 주어질 것입니다
  - 그 무리는 그의 권세 아래로 넘겨질 것입니다
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구로 ‘권세/통제 아래’의 뜻이므로, 관용을 살리면서도 한국어로 자연스럽게 들리도록 ‘넘겨질 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 관계를 나타내는 עִם의 처리
  chosen_reading: ‘북방 왕과 싸울 것입니다’로 옮겨, 뒤따르는 동격 표현과 함께 적대적 대결임을 분명히 했습니다.
  alternative_readings:
  - ‘북방 왕과 더불어 싸울 것입니다’
  - ‘북방 왕을 상대로 싸울 것입니다’
  rationale: 본문의 עִם은 동맹이 아니라 전투 상대를 가리키는 문맥적 사용이므로, 한국어에서는 오해를 피하도록 적대 관계를 분명히 했습니다.
  doctrine_reference: 문맥적 구문 해석
- issue: ‘그의 손에’의 관용적 의미
  chosen_reading: 직역 이미지를 유지하되, 의미상 ‘권세 아래로 넘겨짐’이라는 힘의 전이를 드러냈습니다.
  alternative_readings:
  - ‘그의 손에 주어질 것입니다’
  - ‘그의 권세에 넘어갈 것입니다’
  rationale: 히브리어의 신체 이미지(손)를 보존하는 것이 본문의 힘을 살리면서도, 독자가 ‘권세/통제’의 뜻을 이해하도록 돕습니다.
  doctrine_reference: 히브리적 관용구
