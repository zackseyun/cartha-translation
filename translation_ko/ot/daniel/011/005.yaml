id: DAN.11.5
reference: Daniel 11:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶחֱזַ֥ק מֶֽלֶךְ הַ/נֶּ֖גֶב וּ/מִן שָׂרָ֑י/ו וְ/יֶחֱזַ֤ק עָלָי/ו֙ וּ/מָשָׁ֔ל מִמְשָׁ֥ל רַ֖ב מֶמְשַׁלְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/005.yaml
  text: Then the king of the South will grow strong[a], but one of his commanders will grow stronger than he and will rule, and his dominion will be a great dominion.
  footnotes:
  - marker: a
    text: Or, 'and from among his princes one will become strong over him.' The Hebrew can be rendered more literally, but the main text expresses the comparative force in clearer English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 남쪽 왕이 강성해질 것입니다[a]. 그러나 그의 방백들 가운데 하나가 그보다 더 강성해져서 다스릴 것이며, 그의 통치는 큰 통치가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그의 방백들 가운데 하나가 그보다 강해질 것입니다.’ 히브리어는 더 문자적으로 옮길 수 있지만, 본문은 비교의 힘을 더 분명하게 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶחֱזַק מֶלֶךְ הַנֶּגֶב
  english_pob_choice: will grow strong / the king of the South
  chosen_korean: 남쪽 왕이 강성해질 것입니다
  alternatives_korean:
  - 남방 왕이 강해질 것입니다
  - 남쪽의 왕이 세력을 얻을 것입니다
  lexicon: HALOT
  rationale: מֶלֶךְ הַנֶּגֶב은 Daniel에서 반복되는 정치적 칭호이므로 ‘남쪽 왕’으로 직역하고, חזק은 단순한 힘이 아니라 정치·군사적 세력 확대를 뜻해 ‘강성해지다’로 옮겼습니다.
- source_word: וּמִן שָׂרָיו
  english_pob_choice: but one of his commanders
  chosen_korean: 그러나 그의 방백들 가운데 하나가
  alternatives_korean:
  - 그리고 그의 방백들 가운데 하나가
  - 그의 장군들 중 하나가
  lexicon: HALOT
  rationale: שַׂר는 이 문맥에서 일반 ‘왕자’보다 통치권 아래의 고관·지휘관을 가리키므로 ‘방백’으로 옮겼고, מִן은 ‘…가운데 하나’로 자연스럽게 풀었습니다.
- source_word: וְיֶחֱזַק עָלָיו וּמָשָׁל
  english_pob_choice: will grow stronger than he and will rule
  chosen_korean: 그보다 더 강성해져서 다스릴 것이며
  alternatives_korean:
  - 그를 이기고 다스릴 것이며
  - 그 위에 강해져 통치할 것이며
  lexicon: HALOT
  rationale: חזק + עַל은 단순한 ‘강하다’보다 상대를 압도하는 우위를 뜻하므로 ‘그보다 더 강성해지다’로, 뒤의 מָשָׁל은 통치 행위를 분명히 하는 ‘다스리다’로 옮겼습니다.
- source_word: מִמְשָׁל רַב מֶמְשַׁלְתּוֹ
  english_pob_choice: a great dominion / his dominion
  chosen_korean: 그의 통치는 큰 통치가 될 것입니다
  alternatives_korean:
  - 그의 다스림은 큰 통치가 될 것입니다
  - 그의 통치는 큰 권세가 될 것입니다
  lexicon: HALOT
  rationale: מִמְשָׁל과 מֶמְשָׁלָה의 반복과 어근 유희를 살리기 위해 ‘통치’의 반복을 유지했고, רַב은 규모를 드러내는 ‘큰’으로 간결하게 처리했습니다.
theological_decisions:
- issue: 예언적 미래 시제와 역사 서술의 긴장
  chosen_reading: 미래형 ‘-할 것입니다’를 사용해 예언의 형식을 살리되, 문장 흐름은 한국어 서술문으로 자연스럽게 구성했습니다.
  alternative_readings:
  - 현재형 서술
  - 과거형 예언 완결체
  rationale: 다니엘 11장은 예언적 전망을 현재 사건처럼 전개하므로, 한국어에서는 독자가 미래 예언으로 인식하도록 미래형을 유지하는 것이 소스의 기능을 가장 잘 반영합니다.
  doctrine_reference: 예언문체와 역사 서술의 장르 구분
