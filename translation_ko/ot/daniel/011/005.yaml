  to: 그때 남쪽 왕이 강성해질 것입니다[a]. 그러나 그의 고관들 가운데 한 사람이 그보다 더 강성해져 다스릴 것이며, 그의 지배 영역은 광대할 것입니다.
  rationale: 현대적이면서도 격식 있는 합쇼체를 유지하도록 ‘방백들 가운데 하나’를 ‘고관들 가운데 한 사람’으로 다듬었습니다. 마지막 절은 어색한 직역식 반복을 피하고, 큰 지배권 또는 광대한 통치 영역이라는 מִמְשָׁל רַב מֶמְשַׁלְתּוֹ의 의미를 자연스럽게 전달하도록 수정했습니다. 각주는 접속사와 עָלָיו의 보다 문자적인 대안을 보존하되 본문의 비교적 번역 원리를 명시했습니다.
