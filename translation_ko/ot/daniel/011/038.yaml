id: DAN.11.38
reference: Daniel 11:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֶ/אֱלֹ֨הַּ֙ מָֽעֻזִּ֔ים עַל כַּנּ֖/וֹ יְכַבֵּ֑ד וְ/לֶ/אֱל֜וֹהַּ אֲשֶׁ֧ר לֹא יְדָעֻ֣/הוּ אֲבֹתָ֗י/ו יְכַבֵּ֛ד בְּ/זָהָ֥ב וּ/בְ/כֶ֛סֶף וּ/בְ/אֶ֥בֶן יְקָרָ֖ה וּ/בַ/חֲמֻדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/038.yaml
  text: Instead[a], he will honor a god of fortresses in his place; he will honor a god whom his fathers did not know with gold, silver, precious stones[c][b], and desirable things.
  footnotes:
  - marker: a
    text: Or 'a god of strongholds.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'upon his base' or 'on his pedestal'; the phrase is difficult and may mean 'in his place' or 'instead of him.'
    reason: alternative_reading
  - marker: c
    text: Or 'precious things' or 'treasures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 대신 그는 요새의 신을 그 자리에 높이고, 그의 조상들이 알지 못하던 신을 금과 은과 귀한 돌과 값진 것들로 높일 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강한 곳들의 신’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 받침 위에’ 또는 ‘그의 기단 위에’이며, 문맥상 ‘그의 자리에서’ 또는 ‘대신에’라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘귀한 것들’ 혹은 ‘보물들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֶאֱלֹהַּ מָעֻזִּים
  english_pob_choice: a god of fortresses
  chosen_korean: 요새의 신
  alternatives_korean:
  - 견고한 곳들의 신
  - 요새들의 신
  lexicon: HALOT
  rationale: מָעֻזִּים는 방어·요새의 의미를 가지므로, 문맥의 군사적 긴장을 살려 ‘요새의 신’으로 옮겼습니다. POB의 설명적 표현을 따라 특정 신명은 밝히지 않았습니다.
- source_word: עַל כַּנּוֹ
  english_pob_choice: in his place
  chosen_korean: 그 자리에
  alternatives_korean:
  - 그의 받침 위에
  - 그의 자리 대신
  lexicon: HALOT
  rationale: 문구가 압축적이고 해석이 어려우므로, 문맥상 대비되는 ‘그 자리에’로 자연스럽게 옮겼습니다. 이는 POB의 의미역 번역을 반영합니다.
- source_word: יְכַבֵּד
  english_pob_choice: he will honor
  chosen_korean: 높일 것입니다
  alternatives_korean:
  - 존귀하게 할 것입니다
  - 영광을 돌릴 것입니다
  lexicon: HALOT
  rationale: כבד의 사역적 의미는 ‘존귀하게 하다/존중하다’이지만, 우상에게 바치는 행위라는 문맥에서 한국어로는 ‘높이다’가 가장 간결하고 자연스럽습니다. 두 번 반복되는 동사를 같은 어휘로 맞추었습니다.
- source_word: אֲבֹתָיו
  english_pob_choice: his fathers
  chosen_korean: 그의 조상들이
  alternatives_korean:
  - 그의 아버지들이
  - 그의 선조들이
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 한국어에서는 관용적으로 ‘조상들’로 옮겨 세대적·혈통적 의미를 살렸습니다.
- source_word: בְּזָהָב וּבְכֶסֶף וּבְאֶבֶן יְקָרָה וּבַחֲמֻדוֹת
  english_pob_choice: with gold, silver, precious stones, and desirable things
  chosen_korean: 금과 은과 귀한 돌과 값진 것들
  alternatives_korean:
  - 금과 은과 보석과 보물들
  - 금과 은과 귀중한 돌과 탐나는 것들
  lexicon: HALOT
  rationale: 열거된 가치품을 한국어로 자연스럽게 유지하되, אֶבֶן יְקָרָה는 단수형이지만 목록 안에서는 ‘귀한 돌’로, וַחֲמֻדוֹת는 포괄적 가치 표현이므로 ‘값진 것들’로 옮겼습니다.
theological_decisions:
- issue: 우상 숭배를 나타내는 반복 동사 יְכַבֵּד의 한국어 톤
  chosen_reading: ‘높이다’로 반복 번역하여 숭배·헌정의 행위를 드러냈습니다.
  alternative_readings:
  - ‘존귀하게 하다’
  - ‘영광을 돌리다’
  rationale: 본문은 단순한 존중이 아니라 이방 신에 대한 공적 헌정 행위를 말하므로, 한국어에서도 예배적·정치적 뉘앙스가 살아나는 표현을 택했습니다.
  doctrine_reference: 우상 숭배의 본질을 흐리지 않도록 의미를 보존함
- issue: מָעֻזִּים의 신격화 여부
  chosen_reading: 특정 역사적 신명으로 확정하지 않고 ‘요새의 신’으로 묘사했습니다.
  alternative_readings:
  - 전쟁의 신
  - 성채의 신
  - 특정 제국 신
  rationale: 본문 자체가 신의 정체를 명시하지 않으므로, 해석을 과도하게 확정하지 않고 원문의 모호성을 보존했습니다.
  doctrine_reference: 번역은 본문의 애매성을 유지해야 함
