translation:
  language: ko
  text: 부디 당신의 종들을 열흘 동안 시험해 보십시오. 저희에게 씨앗에서 난 음식[a]을 주어 먹게 하고, 물을 주어 마시게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
