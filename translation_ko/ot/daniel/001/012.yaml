  text: Please test your servants for ten days[a], and let us be given vegetables to eat and water to drink.
  footnotes:
  - marker: a
    text: Or 'foods from seeds' or 'seed-food'; the Hebrew term refers broadly to plant-based food grown from seed.
    reason: lexical_alternative
translation:
  language: ko
  text: 청하오니, 당신의 종들을 열흘 동안 시험해 보십시오. 그리고 우리에게 씨앗에서 난 음식과 물을 주어 먹고 마시게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘씨앗에서 난 음식’, ‘씨앗 음식’으로도 옮길 수 있습니다. 히브리어는 씨앗에서 난 식물성 음식을 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַס נָא
  english_pob_choice: Please test
  chosen_korean: 청하오니, … 시험해 보십시오
  alternatives_korean:
  - 부디 … 시험해 주십시오
  - 시험해 보십시오
  lexicon: HALOT
  rationale: יוּ절의 공손한 요청과 시험의 의미를 함께 살려, 현대 한국어에서 자연스러운 공손 청유 표현으로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 다니엘의 자기 호칭은 상급자에게 대한 겸손한 신하적 표현이므로, 본문의 사회적 예의를 살려 ‘종들’로 옮겼습니다.
- source_word: מִן הַזֵּרֹעִים
  english_pob_choice: vegetables
  chosen_korean: 씨앗에서 난 음식
  alternatives_korean:
  - 채소
  - 씨앗 음식
  - 식물성 음식
  lexicon: HALOT
  rationale: English POB의 각주가 밝히듯 원어는 단순한 ‘채소’보다 씨앗에서 난 식물성 음식을 넓게 가리키므로, 본문은 직역 성격을 유지하고 의미 범주는 각주로 보완했습니다.
- source_word: וְנֹאכְלָה וּמַיִם וְנִשְׁתֶּה
  english_pob_choice: and water to drink
  chosen_korean: 그리고 우리에게 … 물을 주어 먹고 마시게 하십시오
  alternatives_korean:
  - 그리고 우리에게 … 물을 주십시오
  - 그리고 우리가 … 먹고 마시게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 병렬 요청 구조를 한국어에서 자연스럽게 풀어, ‘주다’와 ‘먹고 마시다’의 목적 관계를 살렸습니다.
theological_decisions:
- issue: 다니엘의 요청 어조
  chosen_reading: 청원은 신앙적 항변이 아니라 왕궁 관리에게 드리는 정중한 시험 요청으로 처리했습니다.
  alternative_readings:
  - 더 강한 도전적 말투
  - 단순한 정보 전달
  rationale: נָא와 공손한 종 호칭이 함께 있어, 본문은 대결적 선언보다 예의 있는 시험 제안으로 읽는 것이 원문에 더 가깝습니다.
  doctrine_reference: 본문 문맥과 서사 화용
