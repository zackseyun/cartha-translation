    text: 또는 ‘채소’ 또는 ‘씨앗 음식’으로 옮길 수 있습니다. 히브리어는 씨앗에서 난 식물성 음식을 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַס נָא
  english_pob_choice: Please test
