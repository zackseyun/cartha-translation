source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן הָֽ/אֱלֹהִים֙ אֶת דָּ֣נִיֵּ֔אל לְ/חֶ֖סֶד וּֽ/לְ/רַחֲמִ֑ים לִ/פְנֵ֖י שַׂ֥ר הַ/סָּרִיסִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/009.yaml
  text: And God gave Daniel favor and compassion before the chief of the eunuchs[a].
  footnotes:
  - marker: a
    text: Or 'the chief of the court officials' or 'the chief of the palace officials'; the Hebrew term can refer either to literal eunuchs or to royal officers more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 다니엘에게 그 궁정의 내시들[a] 앞에서 호의와 동정을 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁정 관리들의 우두머리’ 또는 ‘궁전 관리들의 우두머리’; 히브리어 용어는 문자적 내시뿐 아니라 왕실 관료를 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 허락하셨습니다
  - 베푸셨습니다
  lexicon: HALOT
  rationale: נתן의 서술적 완료를 하나님의 주도적 행위로 직접 살려, 자연스러운 서술체인 ‘주셨습니다’로 옮겼습니다.
- source_word: לְחֶסֶד
  english_pob_choice: favor
  chosen_korean: 호의
  alternatives_korean:
  - 은혜
  - 호감
  - 총애
  lexicon: HALOT
  rationale: 문맥상 언약적 ‘인애’보다 다니엘이 관리의 눈에 긍정적 평가를 받는 뜻이므로, 관계적 호의를 나타내는 ‘호의’가 가장 적절합니다.
- source_word: וּלְרַחֲמִים
  english_pob_choice: compassion
  chosen_korean: 동정
  alternatives_korean:
  - 긍휼
  - 자비
  - 연민
  lexicon: HALOT
  rationale: 복수 명사 רחמים는 상대에 대한 부드러운 연민과 호의적 마음을 가리키므로, ‘호의’와 짝을 이루는 ‘동정’으로 옮겨 감정적 반응을 살렸습니다.
- source_word: שַׂר הַסָּרִיסִים
  english_pob_choice: the chief of the eunuchs
  chosen_korean: 그 궁정의 내시들
  alternatives_korean:
  - 내시들의 우두머리
  - 궁정 관리들의 우두머리
  - 시종장
  lexicon: HALOT
  rationale: סָרִיסִים는 문자적으로 ‘내시들’을 뜻하지만, 본문 주석이 밝히듯 궁정 관리 전반을 가리킬 수도 있으므로, 본문에는 직역을 유지하되 ‘궁정의’로 관료적 배경을 보완했습니다.
theological_decisions:
- issue: סָרִיסִים의 지칭 범위
  chosen_reading: 본문은 ‘내시들’로 직역하고, 주석에서 궁정 관리의 가능성을 열어 둡니다.
  alternative_readings:
  - 궁정 관리들
  - 궁전 관리들
  rationale: 원문은 실제 내시일 수도, 더 넓은 왕실 관료일 수도 있어 해석을 단정하지 않는 것이 좋습니다. 다만 본문은 POB의 직접성을 따라 문자적 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §3, §5
