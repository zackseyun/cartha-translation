  source_fidelity: 원문의 לִפְנֵי שַׂר הַסָּרִיסִים는 다니엘이 ‘내시들의 우두머리’의 관점에서 호의와 긍휼을 얻는 상황을 나타냅니다. 초안은 ‘그 궁정의 내시들 앞에서’로 옮겨 שַׂר(우두머리)를 누락하고, 다니엘에게 호의와 동정을 직접 주신 듯한 문장 관계를 만들었습니다.
  naturalness: ‘다니엘이 … 호의와 긍휼을 얻게 하셨습니다’는 하나님의 주도적 행위와 해당 관리의 태도를 모두 자연스럽게 드러냅니다. ‘동정’은 한국어에서 낮추어 보거나 불쌍히 여기는 뉘앙스가 비교적 강하므로, רחמים에는 ‘긍휼’이 더 적절합니다.
