translation:
  language: ko
  text: 그가 이 일에 관하여 그들의 말을 듣고, 열흘 동안 그들을 시험하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע לָהֶם
  english_pob_choice: listened to them
  chosen_korean: 그들에게 귀를 기울였고
  alternatives_korean:
  - 그들의 말을 들었고
  - 그들에게 들었고
  - 그들을 따랐고
  lexicon: HALOT
  rationale: שׁמע + לְ는 단순한 청취보다 ‘듣고 받아들이다/귀를 기울이다’의 뉘앙스를 가질 수 있어, 제안을 수용하는 문맥을 살리면서도 ‘순종했다’보다 약하게 옮겼습니다.
- source_word: לַדָּבָר הַזֶּה
  english_pob_choice: in this matter
  chosen_korean: 이 일에
  alternatives_korean:
  - 이 문제에
  - 이 말에
  - 이 제안에
  lexicon: HALOT
  rationale: דָּבָר는 여기서 특정한 요청·사안 전체를 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘이 일’로 옮겼습니다.
- source_word: וַיְנַסֵּם
  english_pob_choice: tested them
  chosen_korean: 시험하였습니다
  alternatives_korean:
  - 검증하였습니다
  - 테스트하였습니다
  - 시험해 보았습니다
  lexicon: HALOT
  rationale: נסה의 피엘은 ‘시험하다/검사하다’의 뜻이므로, 식이 변화의 효력을 가늠하는 문맥에 맞게 ‘시험하다’로 유지했습니다.
- source_word: יָמִים עֲשָׂרָה
  english_pob_choice: for ten days
  chosen_korean: 열흘 동안
  alternatives_korean:
  - 열흘 동안에
  - 열흘간
  - 열흘
  lexicon: HALOT
  rationale: 지속 기간의 목적격 표현은 한국어에서 ‘동안’이 가장 자연스러워, 시험이 지속된 기간임을 분명히 했습니다.
theological_decisions:
- issue: '도입부 동사의 뉘앙스: 단순 청취 vs. 수용/허락'
  chosen_reading: ‘귀를 기울였고’로 옮겨, 말의 내용에 주의를 기울여 받아들인 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘들었고’
  - ‘허락했고’
  - ‘순종했고’
  rationale: 본문은 단순히 소리를 들은 것이 아니라 Daniel의 요청을 받아들여 시험 기간을 허락하는 장면이므로, 과도한 순종 언어는 피하면서도 수용의 의미를 드러내는 번역이 적절합니다.
  doctrine_reference: 서술문 맥락의 의미 보존
- issue: 공식적 서술체의 시제와 문체
  chosen_reading: 과거 서술을 합쇼체로 정리하여 ‘하였습니다’ 체를 사용했습니다.
  alternative_readings:
  - ‘했다’
  - ‘하였나이다’
  - ‘하였습니다’
  rationale: 현대 표준어의 공식적 문체를 유지하면서도 본문 서술의 객관성을 살리기 위해 합쇼체로 통일했습니다.
  doctrine_reference: 문체 일관성
