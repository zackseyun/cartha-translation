  source_fidelity: 수정이 필요합니다. 초안은 비교 대상의 순서를 바꾸고(‘점성술사와 마술사’), אַשָּׁפִים를 근거 없이 ‘점성술사’로 특정했으며, ‘그것은’이라는 대명사가 원문의 직접 목적어인 네 사람을 흐립니다. 또한 ‘그 나라의 모든 점성술사와 마술사보다’라는 문장은 왕이 그들에게 물은 사안과 비교하는 듯한 일시적 모호성을 만듭니다. 수정문은 왕이 그들에게 물은 모든 지혜와 분별의 사안에서 그들이 왕국 전역의 두 궁정 전문가 집단보다 우월하다고 판단했음을 보존합니다.
  naturalness: ‘왕은 그들이 … 뛰어나다고 판단하셨습니다’는 וַיִּמְצָאֵם의 평가적 ‘발견/판정’ 용법을 자연스러운 현대 합쇼체로 표현합니다. ‘온 나라에 있는’은 בְּכָל־מַלְכוּתוֹ의 범위를 매끄럽게 나타냅니다.
  terminology: הַחַרְטֻמִּים는 ‘마술사’, הָאַשָּׁפִים는 지나친 특정화를 피한 ‘주문술사’로 순서대로 옮겼습니다. ‘점성술사’는 두 번째 용어의 가능한 번역일 수는 있어도 본문 번역에서 확정할 수 없으므로 각주에서만 대안으로 남깁니다.
