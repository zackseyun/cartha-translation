id: DAN.1.20
reference: Daniel 1:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹ֗ל דְּבַר֙ חָכְמַ֣ת בִּינָ֔ה אֲשֶׁר בִּקֵּ֥שׁ מֵ/הֶ֖ם הַ/מֶּ֑לֶךְ וַֽ/יִּמְצָאֵ֞/ם עֶ֣שֶׂר יָד֗וֹת עַ֤ל כָּל הַֽ/חַרְטֻמִּים֙ הָֽ/אַשָּׁפִ֔ים אֲשֶׁ֖ר בְּ/כָל מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/020.yaml
  text: And in every matter of wisdom and understanding that the king asked of them[b][a], he found them ten times better than all the magicians and enchanters who were in all his kingdom.
  footnotes:
  - marker: a
    text: Literally, 'ten hands above.' The Hebrew idiom expresses marked superiority; compare 'ten times better.'
    reason: lexical_alternative
  - marker: b
    text: Or 'magicians and astrologers.' The second term refers to a class of Babylonian wise men, but its precise English equivalent is uncertain.
    reason: alternative_reading
translation:
  language: ko
  text: 왕이 그들에게 물은 지혜와 분별에 관한 모든 일에서, 왕은 그들이 온 나라에 있는 모든 마술사와 주문술사[b]보다 열 배나[a] 뛰어나다고 판단하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘열 손 위’이지만, 여기서는 현저한 우위를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주문술사’로 옮긴 두 번째 용어는 바빌론 궁정의 지혜자 집단을 가리키지만, 정확한 한국어 대응어는 확정적이지 않습니다. ‘점성술사’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל דְּבַר חָכְמַת בִּינָה
  english_pob_choice: And in every matter of wisdom and understanding
  chosen_korean: 그리고 지혜와 분별에 관한 모든 일에서
  alternatives_korean:
  - 그리고 지혜와 깨달음의 모든 일에서
  - 그리고 지혜와 이해의 모든 사안에서
  lexicon: HALOT
  rationale: דְּבַר은 여기서 ‘말’이 아니라 평가 대상이 되는 ‘일/사안’의 뜻이므로, 한국어에서는 자연스럽게 ‘일’로 옮기고 ‘지혜와 분별’로 두 명사를 살렸습니다.
- source_word: אֲשֶׁר בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ
  english_pob_choice: that the king asked of them
  chosen_korean: 왕이 그들에게 물었던 것을
  alternatives_korean:
  - 왕이 그들에게 요구했던 것을
  - 왕이 그들에게 요청했던 것을
  lexicon: HALOT
  rationale: בקש + מן은 문맥상 ‘묻다/요구하다/요청하다’ 모두 가능하지만, 시험하고 자문하는 장면이므로 한국어에서는 ‘물었다’가 가장 자연스럽고 의미를 과도하게 좁히지 않습니다.
- source_word: עֶשֶׂר יָדוֹת עַל
  english_pob_choice: ten times better than
  chosen_korean: 열 배나 뛰어나다고 여기셨습니다
  alternatives_korean:
  - 열 손 위라고 여기셨습니다
  - 열 배로 더 낫다고 여기셨습니다
  lexicon: HALOT
  rationale: 직역하면 ‘열 손 위’이지만, 영어 POB가 관용적 의미를 살려 ‘ten times better’로 처리했으므로 한국어도 수치를 보존하면서 관용적으로 ‘열 배나 뛰어나다’로 옮겼습니다.
- source_word: הַחַרְטֻמִּים ... הָאַשָּׁפִים
  english_pob_choice: the magicians and enchanters
  chosen_korean: 점성술사와 마술사
  alternatives_korean:
  - 마술사와 주술사
  - 박사들과 주문술사
  lexicon: HALOT
  rationale: 두 직함 모두 바빌론 궁정의 지혜자/주술사 범주를 가리키므로, 지나치게 현대적이거나 교회적 어휘를 피하면서 한국어 독자가 즉시 구분할 수 있는 직능 명칭으로 옮겼습니다.
- source_word: בְּכָל מַלְכוּתֽוֹ
  english_pob_choice: who were in all his kingdom
  chosen_korean: 그 나라의 모든 곳에 있는
  alternatives_korean:
  - 그의 온 나라에 있는
  - 그의 모든 왕국에 있는
  lexicon: HALOT
  rationale: מלכותו는 느부갓네살의 지배 영역 전체를 가리키므로 ‘그 나라의 모든 곳’으로 자연스럽게 확장해 한국어 독자가 범위를 바로 이해하게 했습니다.
theological_decisions:
- issue: 궁정 지혜자 호칭을 얼마나 구체화할 것인가
  chosen_reading: 직함의 대체 의미를 완전히 특정하지 않고, 문맥상 바빌론 궁정의 마술/주술 전문 집단으로 보이게 했습니다.
  alternative_readings:
  - ‘마술사와 점성가’로 더 구체화
  - ‘박사와 술객’처럼 전통 교회어로 처리
  rationale: 본문의 두 히브리어 용어는 정확한 대응어가 완전히 확정되지 않으므로, 비교 대상을 분명히 하되 과도한 전문화는 피하는 것이 원문의 긴장과 POB의 투명성에 맞습니다.
  doctrine_reference: '번역 원칙: 어휘적 불확실성을 해소하기보다 드러내기'
- issue: 평가 주어의 태도 표현
  chosen_reading: ‘여기셨습니다’로 옮겨, 왕의 평가/판단 행위를 드러냈습니다.
  alternative_readings:
  - ‘찾으셨습니다’로 직역
  - ‘발견하셨습니다’로 더 문자적으로 처리
  rationale: וַיִּמְצָאֵם은 단순 발견보다 평가적 판단을 포함하므로, 한국어에서도 왕의 판단을 자연스럽게 드러내는 표현을 택했습니다.
  doctrine_reference: 서사문에서 평가 동사의 의미 범위를 보존하는 번역
