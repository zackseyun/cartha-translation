  to: 왕이 그들에게 물은 지혜와 분별에 관한 모든 일에서, 왕은 그들이 온 나라에 있는 모든 마술사와 주문술사[b]보다 열 배나[a] 뛰어나다고 판단하셨습니다.
  rationale: 원문의 문장 구조를 따라 ‘왕이 그들에게 물은 모든 사안’과 ‘왕이 그들을 다른 궁정 전문가들보다 우월하다고 판단함’을 명확히 연결했습니다. עֶשֶׂר יָדוֹת의 수치적 과장과 비교 의미는 ‘열 배나’ 및 각주로 보존했고, 논쟁적인 궁정 직함은 본문에서 과도하게 특정하지 않았습니다.
