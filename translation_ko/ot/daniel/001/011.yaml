id: DAN.1.11
reference: Daniel 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּנִיֵּ֖אל אֶל הַ/מֶּלְצַ֑ר אֲשֶׁ֤ר מִנָּה֙ שַׂ֣ר הַ/סָּֽרִיסִ֔ים עַל דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/011.yaml
  text: Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel[a], Hananiah, Mishael, and Azariah,
  footnotes:
  - marker: a
    text: Or 'the chief official'; the Hebrew term translated 'eunuchs' can in some contexts refer more broadly to royal court officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다니엘이 환관장[a]이 다니엘과 하나냐와 미사엘과 아사랴를 맡도록 임명한 청지기에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘최고 관리’. 히브리어에서 ‘환관들’로 옮긴 말은 어떤 문맥에서는 더 넓게 궁정 관료를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그래서 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어에서는 자연스러운 시간 부사구로 옮겨, 순서를 살리면서도 문어체 흐름을 유지했습니다.
- source_word: הַמֶּלְצַר
  english_pob_choice: the steward
  chosen_korean: 관리
  alternatives_korean:
  - 청지기
  - 감독관
  - 시종장
  lexicon: HALOT
  rationale: POB의 영어는 직역형 직함을 택했지만, 한국어에서는 이 역할을 가장 무리 없이 드러내는 일반 직함으로 풀어 옮겼습니다.
- source_word: שַׂר הַסָּרִיסִים
  english_pob_choice: the chief of the eunuchs
  chosen_korean: 환관장
  alternatives_korean:
  - 환관들의 우두머리
  - 내시들의 장
  - 궁정 관리들의 우두머리
  lexicon: HALOT
  rationale: 직역하면 ‘환관들의 우두머리’이지만, 한국어에서는 관직의 핵심 의미를 짧게 드러내는 합성어로 옮겼습니다. 본문 각주로 ‘환관’이 경우에 따라 궁정 관료를 넓게 가리킬 수 있음을 보완합니다.
- source_word: מִנָּה ... עַל
  english_pob_choice: had appointed ... over
  chosen_korean: '... 위에 세운'
  alternatives_korean:
  - '... 위에 임명한'
  - '...를 맡긴'
  - '...을 책임지게 한'
  lexicon: HALOT
  rationale: 임명과 감독 책임을 함께 담아야 하므로, ‘위에 세운’으로 권한 부여와 상관 관계를 압축해 표현했습니다.
theological_decisions:
- issue: סָרִיסִים의 범위
  chosen_reading: 본문에서는 ‘환관장’으로 옮기되, 역사적 맥락상 궁정 관료를 넓게 가리킬 가능성은 각주로 열어 둡니다.
  alternative_readings:
  - ‘내시장’으로 고정
  - ‘궁정 관리장’으로 일반화
  rationale: 히브리어 용어가 문자적 환관을 뜻할 수 있으나, 일부 문맥에서는 궁정 관료 전체를 가리킬 수 있다는 POB의 주석을 한국어 본문에서 지우지 않기 위해서입니다.
  doctrine_reference: 문헌학/역사적 맥락 보존
- issue: 문장 종결과 인용
  chosen_reading: 다니엘의 발화를 평서형 보고문으로 번역해, 직접화법을 과도하게 구어화하지 않았습니다.
  alternative_readings:
  - 말했습니다 대신 ‘이르되’ 사용
  - 직접 인용형으로 재구성
  rationale: 서사문체를 유지하면서도 현대 한국어의 자연스러움을 확보하기 위한 선택입니다.
  doctrine_reference: 문체 일관성
