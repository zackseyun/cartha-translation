  source_fidelity: 본문의 ‘내시들’은 히브리어 סָרִיס의 가능한 좁은 의미이지만, 이 어휘는 실제 내시뿐 아니라 궁정 관리도 가리킬 수 있습니다. 따라서 본문에서는 더 넓은 의미를 채택하고 대안을 각주로 보존하는 것이 원문의 어휘적 불확실성을 더 충실히 반영합니다. 또한 왕실 계통과 귀족이라는 병렬 출신 범주를 ‘왕실 혈통에 속한 이들과 귀족들’로 명료하게 나타냈습니다.
  naturalness: 초안의 ‘왕족의 후손들과 귀족들 가운데서’는 서로 다른 범주의 표현 방식이 병렬되어 다소 어색합니다. ‘왕실 혈통에 속한 이들과 귀족들 중에서’는 현대 표준 한국어에서 자연스럽고 의미도 분명합니다.
  terminology: 본문의 ‘자기 내시들의 우두머리’와 각주의 ‘또는 자기 내시들의 우두머리’가 동일하여 각주가 실질적인 대안을 제공하지 못합니다. 본문을 ‘궁정 관리들의 우두머리’로 하고, ‘내시들’을 각주 대안으로 제시해야 합니다. 아스브나스는 히브리어 이름 אַשְׁפְּנַז을 자연스럽게 음역한 형태입니다.
