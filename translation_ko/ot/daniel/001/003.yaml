  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ לְ/אַשְׁפְּנַ֖ז רַ֣ב סָרִיסָ֑י/ו לְ/הָבִ֞יא מִ/בְּנֵ֧י יִשְׂרָאֵ֛ל וּ/מִ/זֶּ֥רַע הַ/מְּלוּכָ֖ה וּ/מִן הַֽ/פַּרְתְּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/003.yaml
  text: Then the king told Ashpenaz[a], the chief of his court officials, to bring some of the sons of Israel, both from the royal offspring and from the nobles,
  footnotes:
  - marker: a
    text: Or 'the chief of his eunuchs.' The Hebrew term can denote either literal eunuchs or high royal officials more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 자기 내시들의 우두머리 아스프나스에게 이스라엘 자손들 가운데서, 곧 왕족의 후손들과 귀족들 가운데서 몇 사람을 데려오라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 내시들의 우두머리’. 히브리어 이 단어는 문자 그대로의 내시나 더 넓은 궁정 관리들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... told
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 지시했습니다
  lexicon: HALOT
  rationale: 서사 진행을 드러내는 waw 연속의 값을 살려 ‘그때’로 옮기고, 뒤의 목적절(데려오라고)과의 관계를 자연스럽게 반영하기 위해 ‘말했습니다’를 택했습니다.
- source_word: רַב סָרִיסָיו
  english_pob_choice: the chief of his court officials
  chosen_korean: 자기 내시들의 우두머리
  alternatives_korean:
  - 자기 궁정 관리들의 우두머리
  - 자기 내시들의 책임자
  lexicon: HALOT
  rationale: סָרִיס은 문맥상 ‘내시’ 또는 넓게는 궁정 관리로도 이해될 수 있어, 본문이 허용하는 좁은 의미를 본문에 두고 POB의 주석적 긴장을 반영했습니다.
- source_word: מִבְּנֵי יִשְׂרָאֵל וּמִזֶּרַע הַמְּלוּכָה וּמִן הַפַּרְתְּמִים
  english_pob_choice: some of the sons of Israel, both from the royal offspring and from the nobles
  chosen_korean: 이스라엘 자손들 가운데서, 곧 왕족의 후손들과 귀족들 가운데서 몇 사람
  alternatives_korean:
  - 이스라엘 자손들 가운데서, 곧 왕실의 씨와 귀족들 가운데서 몇 사람
  - 이스라엘 자손들 가운데서, 곧 왕족과 귀족들 가운데서 몇 사람
  lexicon: HALOT
  rationale: 세 겹의 출신 범주를 한국어에서도 분명히 보이도록 ‘가운데서’와 ‘곧’을 사용해 병렬 구조를 살렸고, זֶרַע는 직역적인 ‘씨’보다 의미가 분명한 ‘후손들’로 옮겼습니다.
theological_decisions:
- issue: 왕의 명령이 제국의 동화 정책과 포로 공동체의 정체성 형성에 미치는 효과
  chosen_reading: 본문은 단순한 인사 명령이 아니라, 바벨론 왕권이 이스라엘의 젊은 귀족층을 선별해 체제에 흡수하려는 조치를 보여줍니다.
  alternative_readings:
  - 중립적인 궁정 인재 선발로만 읽기
  - 단순한 왕실 시종 모집으로 축소해 읽기
  rationale: 다니엘서의 서사 맥락상 이 명령은 포로민의 정체성 재편을 겨냥한 정치적 조치로 기능하므로, 이를 약화시키지 않도록 했습니다.
  doctrine_reference: 성도의 정체성 보존과 제국 권력 아래서의 신실함
- issue: סָרִיס의 번역 선택
  chosen_reading: 본문 본래의 긴장을 보존하기 위해 ‘내시들’로 옮기되, 한국어 독자에게 궁정 관료 의미가 함께 읽히도록 문맥을 열어 두었습니다.
  alternative_readings:
  - 의미를 넓혀 ‘궁정 관리들’로만 번역하기
  - 전통적으로 ‘환관’으로 좁혀 번역하기
  rationale: 히브리어가 실제 내시와 고위 관리 둘 다를 가리킬 수 있으므로, 어느 한쪽으로만 단정하지 않고 본문과 주석의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 충실성 및 어휘의 다의성 보존
