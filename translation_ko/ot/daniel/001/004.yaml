source:
  edition: WLC
  text: יְלָדִ֣ים אֲשֶׁ֣ר אֵֽין בָּ/הֶ֣ם כָּל מאום וְ/טוֹבֵ֨י מַרְאֶ֜ה וּ/מַשְׂכִּילִ֣ים בְּ/כָל חָכְמָ֗ה וְ/יֹ֤דְעֵי דַ֨עַת֙ וּ/מְבִינֵ֣י מַדָּ֔ע וַ/אֲשֶׁר֙ כֹּ֣חַ בָּ/הֶ֔ם לַ/עֲמֹ֖ד בְּ/הֵיכַ֣ל הַ/מֶּ֑לֶךְ וּֽ/לֲ/לַמְּדָ֥/ם סֵ֖פֶר וּ/לְשׁ֥וֹן כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/004.yaml
  text: young men in whom there was no defect at all[a], good in appearance, skillful in all wisdom, knowledgeable in learning, discerning in understanding, and who had the ability to stand in the king’s palace[c][b], and to teach them the literature and language of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'to serve in the king’s palace' or 'to attend in the king’s court'; literally 'to stand in the king’s palace.'
    reason: lexical_alternative
  - marker: b
    text: '''Literature'' renders a term that can more literally mean ''writing,'' ''book,'' or scribal learning.'
    reason: lexical_alternative
  - marker: c
    text: '''Chaldeans'' may in context refer broadly to Babylonians, but the Hebrew specifically uses ''Chaldeans.'''
    reason: cultural_note
translation:
  language: ko
  text: 곧 아무 흠도 없고 용모가 아름다우며, 모든 지혜에 능통하고 지식을 갖추며 학문을 이해하고, 왕의 궁정에서 설 역량이 있는 청년들을 데려오고, 그들에게 갈대아 사람들의 글[b]과 언어[c]를 가르치게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕의 궁정에 서다’이며, 궁정에 출입하여 복무하거나 왕 앞에 시중든다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘글’은 여기서 단일한 책이 아니라 서기관적 문자 교육이나 문헌 학습을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘갈대아 사람들’은 문맥상 바빌로니아인을 넓게 가리킬 수 있지만, 히브리어 본문은 구체적으로 ‘갈대아 사람들’이라고 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְלָדִים
  english_pob_choice: young men
  chosen_korean: 청년들
  alternatives_korean:
  - 젊은이들
  - 소년들
  - 아이들
  lexicon: HALOT
  rationale: 궁정 선발 문맥에서 ילָדִים은 미성년 아동보다 복무에 적합한 젊은 남성을 가리키므로, 한국어로는 자연스럽고 문맥에 맞는 ‘청년들’이 가장 적절합니다.
- source_word: אֵין בָּהֶם כָּל מְאוּם
  english_pob_choice: in whom there was no defect at all
  chosen_korean: 외모에 흠이 전혀 없고
  alternatives_korean:
  - 온전히 결함이 없고
  - 흠이 하나도 없고
  - 흠잡을 데가 없고
  lexicon: HALOT
  rationale: כָּל מְאוּם의 전면적 부정력을 살리되, 궁정 선발의 신체적 조건을 한국어로 자연스럽게 드러내기 위해 ‘외모에 흠이 전혀 없고’로 옮겼습니다.
- source_word: טוֹבֵי מַרְאֶה
  english_pob_choice: good in appearance
  chosen_korean: 보기에 좋으며
  alternatives_korean:
  - 잘생기고
  - 외모가 좋으며
  - 보기 좋으며
  lexicon: HALOT
  rationale: 평가적 형용사로서의 외적 아름다움을 유지하면서도 과도하게 구어적이지 않도록 ‘보기에 좋으며’로 번역했습니다.
- source_word: מַשְׂכִּילִים בְּכָל חָכְמָה
  english_pob_choice: skillful in all wisdom
  chosen_korean: 모든 지혜에 능하고
  alternatives_korean:
  - 모든 지혜에 숙련되고
  - 온갖 지혜에 능하고
  - 모든 지혜에 총명하고
  lexicon: HALOT
  rationale: שכל은 단순한 지식보다 ‘능숙함/슬기’를 포함하므로, ‘능하고’로 능력과 숙련의 뜻을 함께 살렸습니다.
- source_word: יֹדְעֵי דַעַת / מְבִינֵי מַדָּע
  english_pob_choice: knowing knowledge / discerning in understanding
  chosen_korean: 지식에 밝으며, 통찰에 분별력이 있고
  alternatives_korean:
  - 지식을 알고 이해를 분별하며
  - 지식을 아는 자들로서 이해를 분별하며
  - 아는 것과 깨닫는 것에 통달하며
  lexicon: HALOT
  rationale: 히브리어의 중첩된 명사구를 기계적으로 반복하지 않고, 지식과 이해의 누적된 강도를 한국어 관용으로 살려 ‘지식에 밝으며, 통찰에 분별력이 있고’로 옮겼습니다.
- source_word: כֹּחַ בָּהֶם לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ
  english_pob_choice: had the ability to stand in the king’s palace
  chosen_korean: 왕의 궁에서 설 수 있는 능력이 있으며
  alternatives_korean:
  - 왕의 궁정에 설 수 있는 힘이 있으며
  - 왕의 궁정에 나아가 섬길 능력이 있으며
  - 왕의 궁에 서서 시중들 능력이 있으며
  lexicon: HALOT
  rationale: ‘서다’의 궁정 봉사 관용구를 보존하면서, 한국어에서는 ‘능력’으로 כֹּחַ의 적합성/역량을 자연스럽게 전달했습니다.
- source_word: סֵפֶר
  english_pob_choice: the literature
  chosen_korean: 갈대아 사람들의 글
  alternatives_korean:
  - 갈대아 사람들의 문학
  - 갈대아 사람들의 글쓰기
  - 갈대아 사람들의 서책
  lexicon: HALOT
  rationale: 여기서 סֵפֶר은 단일한 책보다 서기관적 문자 교육을 가리키므로, ‘문학’보다 더 직접적인 ‘글’로 옮겨 교육 내용의 성격을 살렸습니다.
- source_word: לְשׁוֹן כַּשְׂדִּים
  english_pob_choice: language of the Chaldeans
  chosen_korean: 갈대아 사람들의 언어를
  alternatives_korean:
  - 갈대아어를
  - 갈대아 사람들의 말을
  - 갈대아인의 언어를
  lexicon: HALOT
  rationale: 히브리어가 구체적으로 ‘갈대아 사람들’의 언어를 말하므로, 고유 민족명을 유지한 채 현대 한국어로는 ‘언어’를 택했습니다.
theological_decisions:
- issue: 궁정 입회/대기 동사 לַעֲמֹד의 의미를 어떻게 살릴 것인가
  chosen_reading: ‘왕의 궁에서 설 수 있는 능력이 있으며’로 직역적 이미지를 보존했습니다.
  alternative_readings:
  - 왕의 궁정에서 섬길 수 있는 능력이 있으며
  - 왕 앞에 설 수 있는 자들이며
  rationale: 본문의 핵심은 단순한 신체적 ‘서 있음’이 아니라 왕 앞에서 복무할 자격이 있다는 궁정 관용구입니다. 직역 이미지를 유지하되 한국어 문장에서는 능력 표현으로 자연스럽게 풀었습니다.
  doctrine_reference: 궁정 봉사/소명 표현에 대한 본문 관찰
- issue: כַּשְׂדִּים의 지시 대상을 어떻게 처리할 것인가
  chosen_reading: ‘갈대아 사람들’로 유지했습니다.
  alternative_readings:
  - 바빌론 사람들
  - 갈대아인들
  rationale: 문맥상 바빌로니아 권력층을 가리킬 수 있지만, 히브리어 본문은 구체적으로 ‘갈대아 사람들’을 사용합니다. 본문의 어휘를 보존해 역사적·민족적 표지를 유지했습니다.
  doctrine_reference: 본문 어휘 보존 원칙
