id: DAN.1.8
reference: Daniel 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּנִיֵּאל֙ עַל לִבּ֔/וֹ אֲשֶׁ֧ר לֹֽא יִתְגָּאַ֛ל בְּ/פַתְבַּ֥ג הַ/מֶּ֖לֶךְ וּ/בְ/יֵ֣ין מִשְׁתָּ֑י/ו וַ/יְבַקֵּשׁ֙ מִ/שַּׂ֣ר הַ/סָּרִיסִ֔ים אֲשֶׁ֖ר לֹ֥א יִתְגָּאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/008.yaml
  text: But Daniel resolved in his heart that he would not defile himself with the king’s food or with the wine he drank[a], and he sought permission from the chief of the eunuchs that he might not defile himself.
  footnotes:
  - marker: a
    text: Or 'the chief official' / 'the commander of the court officials'; the Hebrew term can refer either to literal eunuchs or to high royal officials more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 다니엘은 왕의 음식과 왕이 마시는 포도주로 자기를 더럽히지 않기로 마음에 정하여, 자기를 더럽히지 않도록 해 달라고 환관들의 우두머리에게 허락을 구했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환관’은 문자적 의미를 따른 번역입니다. 이 히브리어는 문자 그대로의 환관이나 더 넓게는 궁정의 고위 관리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... עַל לִבּוֹ
  english_pob_choice: resolved in his heart
  chosen_korean: 마음에 결심하고
  alternatives_korean:
  - 마음에 두고
  - 마음에 정하고
  - 속으로 결심하고
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 결단을 살리되, 한국어에서 자연스럽고 현대적인 표현으로 옮겼습니다.
- source_word: יִתְגָּאַל
  english_pob_choice: defile himself
  chosen_korean: 스스로를 더럽히지
  alternatives_korean:
  - 자기를 부정하게 하지
  - 자기를 더럽히지
  - 부정을 타지
  lexicon: HALOT
  rationale: 의식적·도덕적 오염의 넓은 뜻을 좁히지 않고, 원문의 ‘더럽히다’ 계열 의미를 분명하게 반영했습니다.
- source_word: פַתְבַּג הַמֶּלֶךְ
  english_pob_choice: the king’s food
  chosen_korean: 왕의 음식
  alternatives_korean:
  - 왕의 진수성찬
  - 왕의 상의 음식
  - 왕의 음식물
  lexicon: HALOT
  rationale: 지정된 궁정 식량이라는 소속 관계를 유지하면서도, 과도하게 호화로운 뉘앙스를 덧붙이지 않도록 간명하게 옮겼습니다.
- source_word: יֵין מִשְׁתָּיו
  english_pob_choice: the wine he drank
  chosen_korean: 그가 마시는 포도주
  alternatives_korean:
  - 그의 잔치 포도주
  - 그가 마시던 포도주
  - 왕의 포도주
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 ‘그의 마심/잔치’라는 소유·관계 구조를 한국어로 유지했습니다.
- source_word: שַׂר הַסָּרִיסִים
  english_pob_choice: the chief of the eunuchs
  chosen_korean: 환관들의 우두머리
  alternatives_korean:
  - 내시들의 우두머리
  - 궁정 관리들의 우두머리
  - 환관장
  lexicon: HALOT
  rationale: 문맥상 궁정 고위직을 가리킬 수 있으나, 기본 어휘는 ‘환관’이므로 본문은 투명하게 옮기고, 기능적 의미는 존칭적 직함 표현으로 자연화했습니다.
- source_word: וַיְבַקֵּשׁ
  english_pob_choice: he sought permission
  chosen_korean: 허락을 구했습니다
  alternatives_korean:
  - 요청했습니다
  - 청했습니다
  - 구했습니다
  lexicon: HALOT
  rationale: 단순히 ‘찾다’가 아니라 상급자에게 정식으로 요청하는 맥락을 한국어 관용으로 풀었습니다.
theological_decisions:
- issue: 다니엘이 피하려 한 ‘더럽힘’의 성격
  chosen_reading: 본문의 범위를 넘지 않도록, 제의적 부정인지 율법 위반인지 우상 제물 관련인지 특정하지 않고 ‘더럽히지’로 유지했습니다.
  alternative_readings:
  - 부정하게 하지
  - 율법을 어기지
  - 우상과 연루되지 않게
  rationale: 히브리어는 ‘더럽히다’만 말하며 원인을 해설하지 않습니다. 해석 논쟁을 본문 밖에서 해결하지 않고 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 만큼만 말하고, 논쟁점은 해설로 남긴다.'
- issue: סָרִיסִים의 번역 범위
  chosen_reading: 본문에는 ‘환관들의 우두머리’를 두고, 주석 없이도 읽히는 한국어로 직역하되, 어휘 자체가 궁정 관료를 넓게 가리킬 수 있는 점은 보존했습니다.
  alternative_readings:
  - 궁정 관리들의 우두머리
  - 궁중 시종들의 우두머리
  - 환관장
  rationale: 히브리어는 문자적 의미와 기능적 의미가 겹칩니다. 본문에서는 투명성을 우선하고, 넓은 행정적 뜻을 완전히 지우지 않는 표현을 택했습니다.
  doctrine_reference: '번역 원칙: 문맥상 가능한 다의성을 임의로 단정하지 않는다.'
