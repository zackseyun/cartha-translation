id: DAN.1.17
reference: Daniel 1:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/יְלָדִ֤ים הָ/אֵ֨לֶּה֙ אַרְבַּעְתָּ֔/ם נָתַ֨ן לָ/הֶ֧ם הָֽ/אֱלֹהִ֛ים מַדָּ֥ע וְ/הַשְׂכֵּ֖ל בְּ/כָל סֵ֣פֶר וְ/חָכְמָ֑ה וְ/דָנִיֵּ֣אל הֵבִ֔ין בְּ/כָל חָז֖וֹן וַ/חֲלֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/017.yaml
  text: As for these four youths[a], God gave them knowledge and insight in every kind of literature and wisdom[b]; and Daniel had understanding in every vision and dream.
  footnotes:
  - marker: a
    text: Or 'in every book'; the Hebrew expression likely refers more broadly to written learning or literature.
    reason: lexical_alternative
  - marker: b
    text: Or 'understood every vision and dream.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 네 청년에게 하나님께서 모든 문헌[a]과 지혜에 관하여 지식과 총명을 주셨습니다. 또한 다니엘에게는 모든 환상과 꿈[b]을 이해하는 능력이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문헌’은 히브리어 ‘책’을 뜻하는 말의 넓은 의미를 반영한 것으로, 여기서는 개별 책들뿐 아니라 글로 된 학문과 배움을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다니엘은 모든 환상과 꿈에 관하여 이해력이 있었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/יְלָדִים הָ/אֵלֶּה אַרְבַּעְתָּם
  english_pob_choice: these four youths
  chosen_korean: 이 네 청년
  alternatives_korean:
  - 이 네 젊은이
  - 이 네 소년
  lexicon: HALOT
  rationale: יְלָדִים은 문자적으로 어린이/젊은이를 가리키지만, 궁정 교육의 맥락에서는 나이를 드러내되 유치하게 들리지 않는 ‘청년’이 가장 자연스럽습니다.
- source_word: נָתַן לָהֶם הָאֱלֹהִים
  english_pob_choice: God gave them
  chosen_korean: 하나님이 … 주셨고
  alternatives_korean:
  - 하나님이 … 주셨습니다
  - 하나님이 … 허락하셨고
  lexicon: HALOT
  rationale: נתן의 기본 의미를 직접 살려 ‘주셨고’로 옮겼습니다. 동사의 단순한 선물을 통해 지혜의 출처가 하나님임을 분명히 드러냅니다.
- source_word: מַדָּע וְהַשְׂכֵּל בְּכָל סֵפֶר וְחָכְמָה
  english_pob_choice: knowledge and insight in every kind of literature and wisdom
  chosen_korean: 모든 글과 지혜에 관한 지식과 총명
  alternatives_korean:
  - 모든 문서와 지혜에 대한 지식과 통찰
  - 모든 책과 지혜에 관한 지식과 이해력
  lexicon: HALOT
  rationale: סֵפֶר은 직역하면 ‘책’이지만 여기서는 문헌/학문 자료를 가리키는 표현이므로 ‘글’로 넓게 옮겼습니다. הַשְׂכֵּל은 ‘총명’으로 옮겨 지식과 나란히 가는 인지적 능력을 살렸습니다.
- source_word: בְּכָל חָזוֹן וַחֲלֹמוֹת
  english_pob_choice: in every vision and dream
  chosen_korean: 모든 환상과 꿈
  alternatives_korean:
  - 모든 이상과 꿈
  - 모든 묵시와 꿈
  lexicon: HALOT
  rationale: חָזוֹן은 예언적/계시적 ‘환상’으로 옮기는 것이 문맥에 맞습니다. חֲלֹמוֹת은 일반적인 ‘꿈’으로 옮겨 다니엘의 계시 관련 이해를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하나님이 지혜와 총명을 주시는 주체로 제시되는 방식
  chosen_reading: 본문의 능력은 네 청년의 내재적 자질이 아니라 하나님이 주시는 선물로 제시됩니다.
  alternative_readings:
  - 단순한 교육 성취
  - 자연적 재능의 발달
  rationale: 주어 הָאֱלֹהִים와 동사 נָתַן의 조합을 그대로 살려, 능력의 원천이 하나님임을 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §1
- issue: 다니엘의 ‘모든 환상과 꿈’에 대한 이해의 범위
  chosen_reading: 다니엘이 모든 환상과 꿈을 ‘깨달았다’고 하되, 그것이 모든 경우의 수를 무차별적으로 해석했다는 뜻으로 과도하게 한정하지 않았습니다.
  alternative_readings:
  - 다니엘이 모든 환상과 꿈을 직접 받았다
  - 다니엘이 단지 꿈 문학을 배웠다
  rationale: הֵבִין은 단순 지식보다 이해/분별을 뜻하므로, ‘깨달았습니다’로 옮겨 이해의 결과를 보이면서도 해석인지 수용인지 불필요하게 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3
