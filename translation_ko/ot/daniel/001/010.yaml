reference: Daniel 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר שַׂ֤ר הַ/סָּרִיסִים֙ לְ/דָ֣נִיֵּ֔אל יָרֵ֤א אֲנִי֙ אֶת אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁ֣ר מִנָּ֔ה אֶת מַאֲכַלְ/כֶ֖ם וְ/אֶת מִשְׁתֵּי/כֶ֑ם אֲשֶׁ֡ר לָ/מָּה֩ יִרְאֶ֨ה אֶת פְּנֵי/כֶ֜ם זֹֽעֲפִ֗ים מִן הַ/יְלָדִים֙ אֲשֶׁ֣ר כְּ/גִֽילְ/כֶ֔ם וְ/חִיַּבְתֶּ֥ם אֶת רֹאשִׁ֖/י לַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/010.yaml
  text: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
  footnotes:
  - marker: a
    text: Or 'the chief official.' The Hebrew term for 'eunuchs' can also refer more broadly to royal court officials.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'your faces gloomy' or 'troubled.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'you would make my head liable to the king,' an idiom meaning to put his life in danger before the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 환관들의 우두머리가 다니엘에게 말했습니다. “나는 왕, 곧 내 주님이신 왕께서 너희 음식과 너희 마실 것을 정하셨으므로 두렵습니다. 왜 그가 너희 얼굴이 너희 또래의 젊은이들보다 더 초췌한 것을 보게 해야 합니까? 그러면 너희가 왕 앞에서 내 머리를 위태롭게 할 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환관들’은 이 히브리어가 궁정 관리들을 더 넓게 가리킬 수도 있음을 반영한 번역입니다.
    reason: source_note
  - marker: b
    text: ‘초췌한’은 문자적으로는 ‘근심한/침울한 얼굴’에 해당하는 표현을 문맥상 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 머리를 위태롭게 하다’는 왕 앞에서 생명을 잃을 위험에 처하게 한다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הַסָּרִיסִים
  english_pob_choice: the chief of the eunuchs
  chosen_korean: 환관들의 우두머리
  alternatives_korean:
  - 환관들의 수장
  - 궁정 관리들의 우두머리
  - 내시들의 우두머리
  lexicon: HALOT
  rationale: סָרִיס는 문맥상 환관이자 궁정 관리일 수 있으므로, 본문이 지닌 궁정 직책의 현실감을 살리면서도 한국어에서 직함으로 자연스러운 ‘우두머리’를 택했습니다.
- source_word: יָרֵא אֲנִי
  english_pob_choice: I fear
  chosen_korean: 나는 ... 두렵습니다
  alternatives_korean:
  - 나는 두렵습니다
  - 나는 염려합니다
  - 나는 무서워합니다
  lexicon: HALOT
  rationale: 현재형의 지속적 염려를 나타내므로, 단순 감정 표현인 ‘무서워합니다’보다 상황적 경계심을 드러내는 ‘두렵습니다’가 더 가깝습니다.
- source_word: אֶת מַאֲכַלְכֶם וְאֶת מִשְׁתֵּיכֶם
  english_pob_choice: your food and your drink
  chosen_korean: 너희 음식과 너희 마실 것
  alternatives_korean:
  - 너희 음식과 너희 음료
  - 너희 식사와 너희 음료
  - 너희 음식과 너희 술
  lexicon: HALOT
  rationale: 마실 대상이 포도주로 명시되지 않으므로, 과도하게 좁히지 않고 ‘마실 것’으로 옮겨 원문의 일반성을 보존했습니다.
- source_word: פְּנֵי/כֶם זֹעֲפִים
  english_pob_choice: your faces looking worse
  chosen_korean: 너희 얼굴이 ... 더 초췌한
  alternatives_korean:
  - 너희 얼굴이 ... 더 근심 어린
  - 너희 얼굴이 ... 더 침울한
  - 너희 얼굴이 ... 더 수척한
  lexicon: HALOT
  rationale: 직역하면 ‘근심/침울한 얼굴’이지만, 비교 맥락에서 외형상 더 나빠 보이는 상태를 가리키므로 ‘초췌한’이 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: וְחִיַּבְתֶּם אֶת רֹאשִׁי לַמֶּלֶךְ
  english_pob_choice: Then you would endanger my head with the king
  chosen_korean: 너희가 ... 내 머리를 위태롭게 할 것입니다
  alternatives_korean:
  - 너희가 ... 내 목숨을 위태롭게 할 것입니다
  - 너희가 ... 왕 앞에서 내 머리를 내놓게 할 것입니다
  - 너희가 ... 왕에게 내 머리를 책임지게 할 것입니다
  lexicon: HALOT
  rationale: ‘머리’는 생명에 대한 관용구이므로, 이를 완전히 풀어 쓰기보다 이미지와 경고의 강도를 살려 ‘내 머리를 위태롭게 하다’로 옮겼습니다.
theological_decisions:
- issue: 왕의 호칭과 직접 화법의 예절 수준
  chosen_reading: 직접 인용문 안에서 궁정 예절에 맞는 존대 표현을 유지하되, 한국어 본문은 현대 합쇼체로 정리했습니다.
  alternative_readings:
  - 더 평이한 구어체
  - 전통적 성경체 존대
  rationale: 본문은 바벨론 궁정의 상하 관계를 반영하므로, 과도한 평어화나 고어체보다 현대 문체의 존대가 원문의 사회적 긴장을 잘 전달합니다.
  doctrine_reference: 서사적 담화의 화용론
