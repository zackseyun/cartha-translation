reference: Daniel 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/מִ/קְצָת֙ הַ/יָּמִ֔ים אֲשֶׁר אָמַ֥ר הַ/מֶּ֖לֶךְ לַ/הֲבִיאָ֑/ם וַ/יְבִיאֵ/ם֙ שַׂ֣ר הַ/סָּרִיסִ֔ים לִ/פְנֵ֖י נְבֻכַדְנֶצַּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/018.yaml
  text: And at the end of the days that the king had said to bring them in[a], the chief of the eunuchs brought them before Nebuchadnezzar.
  footnotes:
  - marker: a
    text: Or 'the chief official' / 'the commander of the court officials.' The Hebrew term can denote a eunuch or, more broadly, a royal court officer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 왕이 그들을 데려오라고 말한 날들이 끝나자, 내시들의 우두머리가 그들을 느부갓네살 앞에 데려왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내시들의 우두머리’는 ‘궁정 관리들의 우두머리’로도 옮길 수 있습니다. 히브리어 סָרִיס는 문자적으로 내시를 뜻하지만, 더 넓게는 왕실 궁정 관리도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִקְצָת הַיָּמִים
  english_pob_choice: And at the end of the days
  chosen_korean: 날들이 끝나자
  alternatives_korean:
  - 그 날수의 끝에
  - 정해진 날들이 지난 뒤에
  lexicon: HALOT
  rationale: מִקְצָת הַיָּמִים는 정해진 기간의 끝을 가리키므로, 한국어에서는 자연스럽게 ‘날들이 끝나자’로 옮겨 시간의 종결을 드러냈습니다.
- source_word: אֲשֶׁר אָמַר הַמֶּלֶךְ לַהֲבִיאָם
  english_pob_choice: that the king had said to bring them in
  chosen_korean: 왕이 그들을 데려오라고 말한
  alternatives_korean:
  - 왕이 그들을 끌어오라고 명령한
  - 왕이 그들을 데려오게 한
  lexicon: HALOT
  rationale: אָמַר는 기본적으로 ‘말하다’이지만 여기서는 왕의 이전 지시를 가리키므로, 지나치게 강한 ‘명령하다’보다 POB의 시제 감각을 살린 ‘말한’이 적절합니다.
- source_word: וַיְבִיאֵם
  english_pob_choice: brought them
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 가져왔습니다
  - 인도했습니다
  lexicon: HALOT
  rationale: בוא의 히필은 ‘오게 하다/데려오다’의 뜻이므로, 궁정 맥락에서 대상자를 상전 앞에 이끈다는 뉘앙스를 살려 ‘데려왔습니다’로 옮겼습니다.
- source_word: שַׂר הַסָּרִיסִים
  english_pob_choice: the chief of the eunuchs
  chosen_korean: 내시들의 우두머리
  alternatives_korean:
  - 환관들의 우두머리
  - 궁정 관리들의 우두머리
  lexicon: HALOT
  rationale: סָרִיס은 여기서 문자적으로 ‘내시’를 가리키는 표현이 가장 직접적이지만, 궁정 관리까지 포괄할 수 있어 주석적 여지를 남겨 둔 POB의 판단을 한국어에서는 ‘내시들의 우두머리’로 반영했습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에
  alternatives_korean:
  - 면전에
  - 앞으로
  lexicon: HALOT
  rationale: לִפְנֵי는 누군가의 면전/앞에 서는 뜻이므로, 간결하고 자연스러운 ‘앞에’가 본문 의미를 잘 전달합니다.
