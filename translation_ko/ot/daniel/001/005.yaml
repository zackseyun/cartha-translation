  - 지정하고
  - 배정하고
  lexicon: HALOT
  rationale: 행정적으로 몫을 배당하는 뜻이므로, 왕의 조처를 자연스럽게 살리는 ‘정해 주고’가 적절합니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: a daily portion
  chosen_korean: 매일 몫
  alternatives_korean:
  - 날마다의 몫
  - 매일의 배급
  - 하루하루의 몫
  lexicon: HALOT
  rationale: 날마다 정해지는 할당분이라는 뜻을 간결하게 살렸습니다.
- source_word: מִפַּת בַּג הַמֶּלֶךְ
  english_pob_choice: from the king’s food
  chosen_korean: 왕의 음식
  alternatives_korean:
  - 왕의 진수성찬
  - 왕의 상차림
  - 왕의 진미
  lexicon: HALOT
  rationale: 직역에 가깝게 두되, 왕실 연회 음식이라는 문맥을 무리 없이 드러내기 위해 ‘왕의 음식’을 택했습니다.
- source_word: וּמִיֵּין מִשְׁתָּיו
  english_pob_choice: from the wine he drank
  chosen_korean: 그가 마시는 포도주
  alternatives_korean:
  - 왕이 마시는 포도주
  - 왕의 포도주
  - 잔치 포도주
  lexicon: HALOT
  rationale: 히브리어의 ‘그의 마심/연회’ 표현을 그대로 살려, 공급원이 왕 자신에게 속한 포도주임을 드러냈습니다.
- source_word: וּלְגַדְּלָם
  english_pob_choice: to bring them up
  chosen_korean: 그들을 길러 내도록
  alternatives_korean:
  - 그들을 기르도록
  - 그들을 양육하도록
  - 그들을 자라게 하도록
  lexicon: HALOT
  rationale: 단순한 교육보다 양육·훈련의 뉘앙스를 함께 담는 한국어로 옮겼습니다.
- source_word: יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: they were to stand before the king
  chosen_korean: 왕 앞에 서게 하였습니다
  alternatives_korean:
  - 왕을 섬기게 하였습니다
  - 왕을 알현하게 하였습니다
  - 왕 앞에 나오게 하였습니다
  lexicon: HALOT
  rationale: 궁정 관용구인 ‘stand before’의 형식을 유지하면서, 왕실 시종·근무의 의미가 드러나도록 했습니다.
theological_decisions:
- issue: 궁정 관용구 ‘stand before the king’의 처리
  chosen_reading: 직역형을 유지해 단순한 면담이 아니라 왕의 시중이나 봉직을 뜻하는 표현으로 남겼습니다.
  alternative_readings:
