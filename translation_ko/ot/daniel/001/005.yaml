    rationale: a는 ‘왕의 음식’, b는 ‘그 기간이 끝나면’, c는 ‘왕 앞에 서다’에 각각 붙여 독자가 주석의 범위를 분명히 알 수 있게 해야 합니다.
  - severity: low
