source:
  edition: WLC
  text: וַ/יְמַן֩ לָ/הֶ֨ם הַ/מֶּ֜לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֗/וֹ מִ/פַּת בַּ֤ג הַ/מֶּ֨לֶךְ֙ וּ/מִ/יֵּ֣ין מִשְׁתָּ֔י/ו וּֽ/לְ/גַדְּלָ֖/ם שָׁנִ֣ים שָׁל֑וֹשׁ וּ/מִ֨/קְצָתָ֔/ם יַֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/005.yaml
  text: And the king assigned to them a daily portion from the king’s food and from the wine he drank[a], and to bring them up for three years[c][b]; and at the end of them they were to stand before the king.
  footnotes:
  - marker: a
    text: Or 'from the king’s delicacies' or 'from the king’s rich food.' The Hebrew refers to provisions from the royal table and may imply luxury food.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'at the end of them,' referring to the end of the three years.
    reason: lexical_alternative
  - marker: c
    text: '''Stand before the king'' is a court expression meaning to appear in royal service or attendance.'
    reason: cultural_note
translation:
  language: ko
  text: 왕은 그들에게 왕의 음식[a]과 자신이 마시는 포도주에서 날마다 먹을 몫을 정해 주고, 석 해 동안 그들을 기르도록 하였습니다. 그 기간이 끝나면[b] 그들은 왕 앞에 서게 되어 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 음식’은 왕실 상차림의 진수성찬이나 좋은 음식들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 끝에서’로, 곧 석 해가 끝나는 시점을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘왕 앞에 서다’는 왕 앞에 나아가 봉사하거나 시중드는 궁정 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַן
  english_pob_choice: assigned
  chosen_korean: 정해 주고
  alternatives_korean:
