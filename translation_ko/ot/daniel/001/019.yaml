id: DAN.1.19
reference: Daniel 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אִתָּ/ם֮ הַ/מֶּלֶךְ֒ וְ/לֹ֤א נִמְצָא֙ מִ/כֻּלָּ֔/ם כְּ/דָנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָ֑ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/019.yaml
  text: The king spoke with them[a], and among them all no one was found like Daniel, Hananiah, Mishael, and Azariah; so they stood before the king.
  footnotes:
  - marker: a
    text: Or 'and they entered the king’s service.' The Hebrew literally says 'they stood before the king,' a court expression for serving in royal presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 그들과 이야기했고, 그들 모두 가운데 다니엘, 하나냐, 미사엘, 아사랴와 같은 사람은 하나도 발견되지 않았습니다. 그러므로 그들은 왕 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕 앞에 서다’입니다. 이는 궁정에서 왕을 섬기거나 시종하는 것을 가리키는 표현으로도 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם
  english_pob_choice: spoke with them
  chosen_korean: 그들과 말하였는데
  alternatives_korean:
  - 그들과 이야기하였는데
  - 그들과 대화하였는데
  lexicon: HALOT
  rationale: דבר עם의 직접적 대화를 자연스러운 현대 한국어로 옮기되, 지나치게 구어적인 표현은 피했습니다.
- source_word: וְלֹא נִמְצָא מִכֻּלָּם
  english_pob_choice: and among them all no one was found
  chosen_korean: 그들 모두 가운데서 … 하나도 발견되지 않았습니다
  alternatives_korean:
  - 그들 모두 가운데서는 아무도 발견되지 않았습니다
  - 그들 가운데 아무도 발견되지 않았습니다
  lexicon: HALOT
  rationale: נמצא의 수동적 ‘발견되다’ 의미를 살리고, מִכֻּלָּם의 비교 범위를 ‘그들 모두 가운데서’로 반영했습니다.
- source_word: כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  english_pob_choice: like Daniel, Hananiah, Mishael, and Azariah
  chosen_korean: 다니엘과 하나냐와 미사엘과 아사랴와 같은 사람
  alternatives_korean:
  - 다니엘, 하나냐, 미사엘, 아사랴와 같은 사람
  - 다니엘과 하나냐와 미사엘과 아사랴처럼
  lexicon: HALOT
  rationale: כְּ의 비교 의미를 ‘같은 사람’으로 살려, 네 인물을 단순 나열하는 것보다 ‘같음/비교’의 초점을 분명히 했습니다.
- source_word: וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  english_pob_choice: so they stood before the king
  chosen_korean: 그래서 그들은 왕 앞에 서게 되었습니다
  alternatives_korean:
  - 그래서 그들은 왕 앞에 섰습니다
  - 그래서 그들은 왕의 앞에 나아갔습니다
  lexicon: HALOT
  rationale: ‘서다’의 문자적 이미지를 유지하되, 궁정 맥락상 결과를 드러내는 ‘서게 되었습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 궁정 용례로서 ‘왕 앞에 서다’의 의미
  chosen_reading: 본절의 ‘왕 앞에 서다’는 단순한 위치 표현이 아니라 왕을 수행하는 궁정 봉사의 관용구로 이해할 수 있으나, 본문에는 문자적 이미지를 우선 살렸습니다.
  alternative_readings:
  - 왕을 섬기게 되었습니다
  - 왕의 시종이 되었습니다
  rationale: 영어 POB의 주석처럼 히브리어는 문자적으로 ‘왕 앞에 서다’라고 말하며, 이 관용구의 봉사 의미는 주석에서 설명하는 편이 본문 충실도에 더 맞습니다.
  doctrine_reference: 궁정 서술의 관용적 표현 해석
