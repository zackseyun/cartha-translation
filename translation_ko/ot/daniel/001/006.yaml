- source_word: בָהֶם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 안에
  - 그들 가운데서
  - 그들 속에
  lexicon: HALOT
  rationale: 앞선 집단 속에 포함됨을 나타내므로 ‘그들 가운데’가 가장 자연스럽고 문맥에도 정확합니다.
- source_word: מִבְּנֵי יְהוּדָה
