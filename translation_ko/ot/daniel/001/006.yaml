  text: 그들 가운데, 곧 유다의 아들들 가운데는 다니엘, 하나냐, 미사엘, 아사랴가 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... were
  chosen_korean: 있었습니다
  alternatives_korean:
  - 있었습니다
  - 있었는데
  - 있게 되었습니다
  lexicon: HALOT
  rationale: 서술 도입의 와우연결과 존재 진술을 자연스러운 한국어 과거형으로 살리되, 지나치게 문자적인 ‘그리고 ... 있었습니다’보다 문맥에 맞게 정리했습니다.
- source_word: בָהֶם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 안에
  - 그들 가운데서
  - 그들 속에
  lexicon: HALOT
  rationale: 앞선 집단 속에 포함됨을 나타내므로 ‘그들 가운데’가 가장 자연스럽고 문맥에도 정확합니다.
- source_word: מִבְּנֵי יְהוּדָה
  english_pob_choice: from the sons of Judah
  chosen_korean: 유다의 아들들 가운데
  alternatives_korean:
  - 유다의 아들들 가운데
  - 유다 사람들 가운데
  - 유다 지파의 사람들 가운데
  lexicon: HALOT
  rationale: 히브리어의 직역적 표현인 ‘유다의 아들들’을 유지하되, 한국어에서는 출신 범주를 밝히는 ‘가운데’로 풀어 자연스럽게 옮겼습니다.
- source_word: דָּנִיֵּאל, חֲנַנְיָה, מִישָׁאֵל, וַעֲזַרְיָה
  english_pob_choice: Daniel, Hananiah, Mishael, and Azariah
  chosen_korean: 다니엘, 하나냐, 미사엘, 아사랴
  alternatives_korean:
