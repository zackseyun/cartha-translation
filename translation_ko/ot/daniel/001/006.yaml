  text: And among them[a], from the sons of Judah, were Daniel, Hananiah, Mishael, and Azariah.
  footnotes:
  - marker: a
    text: Or 'from the Judeans.' The Hebrew reads more literally 'from the sons of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 유다 자손으로는 다니엘, 하나냐, 미사엘, 아사랴가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유다 사람들.” 히브리어는 직역하면 “유다의 아들들 가운데서”입니다.
    reason: בני יהודה의 관용적 집단 명칭과 가능한 현대 한국어 표현을 밝혀, 본문의 ‘유다 자손’이 개인적 직계 아들만을 뜻하는 것으로 오해되지 않게 합니다.
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... were
  chosen_korean: 있었습니다
