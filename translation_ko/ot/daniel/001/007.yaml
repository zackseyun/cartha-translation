id: DAN.1.7
reference: Daniel 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם לָ/הֶ֛ם שַׂ֥ר הַ/סָּרִיסִ֖ים שֵׁמ֑וֹת וַ/יָּ֨שֶׂם לְ/דָֽנִיֵּ֜אל בֵּ֣לְטְשַׁאצַּ֗ר וְ/לַֽ/חֲנַנְיָה֙ שַׁדְרַ֔ךְ וּ/לְ/מִֽישָׁאֵ֣ל מֵישַׁ֔ךְ וְ/לַ/עֲזַרְיָ֖ה עֲבֵ֥ד נְגֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/007.yaml
  text: 'And the chief of the eunuchs gave them names: he gave Daniel the name Belteshazzar[a], Hananiah the name Shadrach, Mishael the name Meshach, and Azariah the name Abed-nego.'
  footnotes:
  - marker: a
    text: Or 'the chief official' or 'the commander of the court officials'; the Hebrew term can denote a eunuch or, by extension, a royal court official.
    reason: lexical_alternative
translation:
  language: ko
  text: 내시들의 우두머리[a]가 그들에게 이름들을 지어 주었습니다. 그는 다니엘에게는 벨드사살이라는 이름을, 하나냐에게는 사드락이라는 이름을, 미사엘에게는 메삭이라는 이름을, 아사랴에게는 아벳느고라는 이름을 지어 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내시’는 이 본문에서 문자적 의미의 내시를 가리킬 수도 있고, 넓은 의미로 궁정 관리를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... שֵׁמוֹת
  english_pob_choice: gave them names
  chosen_korean: 이름들을 지어 주었습니다
  alternatives_korean:
  - 이름들을 주었습니다
  - 이름들을 붙였습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘두다/놓다’와 ‘이름’의 결합은 관용적으로 새 이름을 부여하는 뜻이므로, 한국어에서는 ‘지어 주다’가 자연스럽고 의미를 분명히 드러냅니다.
- source_word: שַׂר הַסָּרִיסִים
  english_pob_choice: the chief of the eunuchs
  chosen_korean: 내시장들의 우두머리
  alternatives_korean:
  - 내시들의 우두머리
  - 궁정 관리들의 우두머리
  lexicon: HALOT
  rationale: סָרִיס는 기본적으로 ‘내시’지만 궁정 관리를 가리킬 수 있어, 본문 맥락을 살리면서도 POB의 lexical note를 반영해 직역 쪽인 ‘내시장들의 우두머리’로 옮겼습니다.
- source_word: לְדָנִיֵּאל ... בֵּלְטְשַׁאצַּר
  english_pob_choice: he gave Daniel the name Belteshazzar
  chosen_korean: 다니엘에게는 벨드사살이라는 이름을
  alternatives_korean:
  - 다니엘을 벨드사살이라 불렀습니다
  - 다니엘에게 벨드사살을 주었습니다
  lexicon: HALOT
  rationale: 반복되는 목적어 구조를 한국어에서도 살려, 각 인물에게 ‘…이라는 이름을’ 부여하는 방식으로 번역했습니다.
- source_word: שַׁדְרַךְ / מֵישַׁךְ / עֲבֵד נְגוֹ
  english_pob_choice: Shadrach / Meshach / Abed-nego
  chosen_korean: 사드락 / 메삭 / 아벳느고
  alternatives_korean:
  - 샤드락 / 메삭 / 아벳느고
  - 아벳느고
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 통용되는 한국어 음역을 따랐습니다. ‘아벳느고’는 두 요소 형태를 반영하는 관용 표기를 유지했습니다.
theological_decisions:
- issue: 이방 궁정이 히브리 청년들에게 새 이름을 부여하는 행위의 의미
  chosen_reading: 지배권 아래 편입시키는 상징적 재명명으로 옮겼습니다.
  alternative_readings:
  - 단순한 별칭 부여
  - 행정적 명부 작성
  rationale: 본문은 단순 호칭 변경이 아니라 정체성 재구성을 암시하므로, 한국어에서도 새 이름 부여의 강한 뉘앙스가 드러나도록 했습니다.
  doctrine_reference: 포로기 정체성/언약 백성의 이름 변경 모티프
