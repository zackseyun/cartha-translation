  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/קְצָת֙ יָמִ֣ים עֲשָׂרָ֔ה נִרְאָ֤ה מַרְאֵי/הֶם֙ ט֔וֹב וּ/בְרִיאֵ֖י בָּשָׂ֑ר מִן כָּל הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֥ג הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/015.yaml
  text: And at the end of ten days, their appearance seemed better, and they were healthier in flesh than all the youths who were eating the king’s food.
translation:
  language: ko
  text: 열 날이 지난 뒤에 그들의 얼굴은 더 좋아 보였고, 그들은 왕의 음식을 먹던 모든 청년들보다 더 살이 찼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/קְצָת֙ יָמִ֣ים עֲשָׂרָ֔ה
  english_pob_choice: At the end of ten days
  chosen_korean: 열 날이 지난 뒤에
  alternatives_korean:
  - 열흘이 지난 뒤에
  - 열 날 끝에
  lexicon: 기간 표현
  rationale: 히브리어는 기간의 경과를 나타내며, 한국어에서는 자연스럽고 읽기 쉬운 ‘열 날이 지난 뒤에’가 원문 의미를 잘 반영합니다.
- source_word: נִרְאָ֤ה מַרְאֵי/הֶם֙ ט֔וֹב
  english_pob_choice: their appearance seemed better
  chosen_korean: 그들의 얼굴은 더 좋아 보였고
  alternatives_korean:
  - 그들의 용모는 더 좋아 보였고
  - 그들의 모습은 더 좋아 보였고
  lexicon: 외모/인상 표현
  rationale: נִרְאָה는 ‘보이다/여겨지다’의 뉘앙스가 있어 단정적 ‘좋아졌다’보다 POB의 ‘seemed better’를 살린 ‘더 좋아 보였고’가 원문에 가깝습니다.
- source_word: וּ/בְרִיאֵ֖י בָּשָׂ֑ר
  english_pob_choice: healthier in flesh
  chosen_korean: 더 살이 찼습니다
  alternatives_korean:
  - 더 건강해 보였습니다
  - 더 살갗이 건강했습니다
  lexicon: 신체 상태 표현
  rationale: 직역하면 ‘살에서 건강한/튼튼한’이지만, 한국어에서는 외형적 대조를 자연스럽게 드러내는 ‘더 살이 찼습니다’가 문맥상 가장 직접적입니다.
- source_word: פַּתְבַּ֥ג הַ/מֶּֽלֶךְ
  english_pob_choice: the king’s food
  chosen_korean: 왕의 음식을
  alternatives_korean:
  - 왕의 진미를
  - 왕의 상에서 나온 음식을
  lexicon: 궁정 식사 표현
  rationale: פַּתְבַּג는 궁정에서 제공된 음식 전체를 가리키므로, POB의 평이한 표현을 따라 ‘왕의 음식’으로 옮겼습니다.
theological_decisions:
- issue: 결과의 성격(겉으로 보이는 변화 vs 실제 변화)
  chosen_reading: ‘더 좋아 보였고’라고 옮겨, 관찰된 외형상 차이를 분명히 했습니다.
  alternative_readings:
  - ‘더 좋아졌다’
  - ‘더 건강해졌다’
  rationale: 히브리어 동사는 여기서 관찰자의 시야에 비친 모습을 강조하므로, 확정적 진술보다 ‘보였다’가 본문 긴장을 보존합니다.
  doctrine_reference: 본문 관찰 서술
