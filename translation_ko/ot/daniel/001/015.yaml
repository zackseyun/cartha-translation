  source_fidelity: 첫 절반의 ‘더 좋아 보였고’는 נִרְאָה(보이다)의 관찰적 뉘앙스를 적절히 보존합니다. 그러나 בְּרִיאֵי בָשָׂר는 단순히 체중이 늘었다는 뜻보다 몸이 잘 여물고 튼튼한 상태를 가리키므로, ‘더 살이 찼습니다’는 의미를 다소 좁히고 현대 한국어에서 건강함보다 체중 증가를 우선 연상시킵니다.
  naturalness: ‘열흘이 지난 뒤’와 ‘왕의 음식을 먹는 모든 젊은이’는 자연스럽고 합쇼체 문맥에 알맞습니다. ‘몸이 더 튼튼했습니다’는 비교 구문에서 자연스럽고 공적인 성경 문체에도 적합합니다.
  terminology: מַרְאֵיהֶם은 ‘용모’로 옮겨 외관을 뜻하는 말임을 더 분명히 했습니다. בְּרִיאֵי בָשָׂר는 ‘몸이 더 튼튼했습니다’로 옮겨 신체적 건강과 충실함의 뜻을 보존했습니다. פַּתְבַּג הַמֶּלֶךְ은 ‘왕의 음식’으로 유지했습니다.
