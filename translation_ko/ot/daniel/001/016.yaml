id: DAN.1.16
reference: Daniel 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/מֶּלְצַ֗ר נֹשֵׂא֙ אֶת פַּתְבָּגָ֔/ם וְ/יֵ֖ין מִשְׁתֵּי/הֶ֑ם וְ/נֹתֵ֥ן לָ/הֶ֖ם זֵרְעֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/016.yaml
  text: So the steward kept taking away their choice food and the wine they were to drink[b][a], and kept giving them vegetables.
  footnotes:
  - marker: a
    text: Or 'their portion of the king's delicacies.' The Hebrew פַּתְבָּגָם refers to the specially assigned royal food.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'pulse.' The Hebrew זֵרְעֹנִים refers to food from plants or seeds, likely vegetables and legumes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그 관리자는 그들에게 배정된 진수성찬[a]과 그들이 마실 포도주를 거두어 가고, 그들에게 채소[b]를 주곤 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 배정된 왕실 음식’ 또는 ‘그들의 진수성찬 몫’. 히브리어 פַּתְבָּגָם은 왕실에서 특별히 배정한 음식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 ‘콩류’ 또는 ‘식물성 음식’으로 옮기기도 합니다. 히브리어 זֵרְעֹנִים은 씨앗에서 나는 식품, 곧 채소와 콩류를 포함하는 식물성 음식을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְצַר
  english_pob_choice: the steward
  chosen_korean: 그 시종
  alternatives_korean:
  - 그 감독관
  - 그 하인
  lexicon: HALOT
  rationale: 문맥상 왕의 음식을 관리하며 지급을 맡은 관리이므로, 기능을 살려 자연스럽게 옮겼습니다. '시종'은 지위의 낮음보다 역할 수행을 드러내며, '감독관'은 다소 과도하게 공식적입니다.
- source_word: נֹשֵׂא
  english_pob_choice: kept taking away
  chosen_korean: 계속 거두어 가고
  alternatives_korean:
  - 거두어 가고
  - 빼앗아 가고
  lexicon: HALOT
  rationale: 지속적·반복적 행위를 나타내는 분사적 용법을 살려 '계속'을 넣었습니다. '빼앗다'는 강제성을 지나치게 부각할 수 있어 문맥보다 강합니다.
- source_word: פַּתְבָּגָם
  english_pob_choice: their choice food
  chosen_korean: 그들의 선택된 음식
  alternatives_korean:
  - 그들의 왕의 진수성찬 몫
  - 그들의 좋은 음식
  lexicon: HALOT
  rationale: 왕의 특별 배정 음식이라는 의미를 살리면서도 한국어로 과도하게 관용화하지 않기 위해 직역에 가까운 표현을 택했습니다. '선택된'은 allotted/specially assigned의 뉘앙스를 반영합니다.
- source_word: זֵרְעֹנִים
  english_pob_choice: vegetables
  chosen_korean: 채소
  alternatives_korean:
  - 콩류
  - 풀로 만든 음식
  lexicon: HALOT
  rationale: 씨앗·식물성 식품을 가리키는 넓은 뜻을 현대 한국어에서 가장 자연스럽게 전달하는 말로 '채소'를 택했습니다. 전통적 '펄스'에 해당하는 협의어보다 읽기 쉽습니다.
theological_decisions:
- issue: 지속적 행위의 서술 방식
  chosen_reading: 한 번의 행동이 아니라 반복되는 공급 조절을 드러내기 위해 '계속 거두어 가고… 계속 주었습니다'로 옮겼습니다.
  alternative_readings:
  - 거두어 가고… 주었습니다
  - 거두어 갔고… 주었습니다
  rationale: 히브리어 분사들과 와우 연속의 문맥은 관습적·반복적 행위를 시사하므로, 한국어에서도 그 지속성을 살리는 편이 원문의 서술 효과를 보존합니다.
  doctrine_reference: 서술적 뉘앙스 보존
