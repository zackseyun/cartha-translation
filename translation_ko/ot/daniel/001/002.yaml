id: DAN.1.2
reference: Daniel 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֲדֹנָ֨/י בְּ/יָד֜/וֹ אֶת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֗ה וּ/מִ/קְצָת֙ כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יְבִיאֵ֥/ם אֶֽרֶץ שִׁנְעָ֖ר בֵּ֣ית אֱלֹהָ֑י/ו וְ/אֶת הַ/כֵּלִ֣ים הֵבִ֔יא בֵּ֖ית אוֹצַ֥ר אֱלֹהָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/002.yaml
  text: And the Lord gave Jehoiakim king of Judah into his hand[a], along with some of the vessels of the house of God. He brought them to the land of Shinar, to the house of his god[c][b], and he brought the vessels into the treasury of his god.
  footnotes:
  - marker: a
    text: Or 'delivered Jehoiakim king of Judah into his hand.'
    reason: lexical_alternative
  - marker: b
    text: Shinar is the ancient name for Babylonia.
    reason: cultural_note
  - marker: c
    text: Or 'temple of his god' and 'treasury/storehouse of his god.' The Hebrew uses 'house' for both God's house and the Babylonian deity's house.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 유다 왕 여호야김을 그의 손에 넘기시고[a], 하나님의 집의 기물 일부도 함께 넘기셨습니다. 그는 여호야김과 그 기물들을 시날 땅[b], 그의 신의 집[c]으로 가져갔고, 그 기물들을 그의 신의 보물창고에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 왕 여호야김을 그의 손에 주셨다’.
    reason: lexical_alternative
  - marker: b
    text: 시날은 바빌로니아의 옛 이름입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그의 신의 성전으로’ 및 ‘그의 신의 보물창고로’. 히브리어는 하나님의 집과 바빌로니아 신의 집에 모두 ‘집’이라는 말을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 넘기셨고
  alternatives_korean:
  - 주셨고
  - 건네주셨고
  - 내주셨고
  lexicon: HALOT
  rationale: 하나님이 주체인 נתן은 단순한 ‘주다’보다 적대자에게 넘겨지는 뉘앙스가 분명하므로, 문맥의 주권적 양도를 살려 ‘넘기셨고’로 옮겼습니다.
- source_word: בְּיָדוֹ
  english_pob_choice: into his hand
  chosen_korean: 그의 손에
  alternatives_korean:
  - 그의 권세에
  - 그의 통제 아래에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘손’의 구체적 이미지를 보존했고, 권세의 의미는 한국어에서도 자연스럽게 전달됩니다.
- source_word: וּמִקְצָת כְּלֵי בֵית הָאֱלֹהִים
  english_pob_choice: along with some of the vessels of the house of God
  chosen_korean: 하나님의 집 그릇 몇 개도 함께
  alternatives_korean:
  - 하나님의 집의 기물 일부도 함께
  - 하나님의 전의 그릇 몇 점도 함께
  lexicon: HALOT
  rationale: כְּלֵי는 성전 기구를 가리키는 물건들이므로 ‘그릇’으로 두되, ‘몇 개’로 수량의 일부성을 살렸습니다. ‘하나님의 집’은 본문의 반복된 집-집 대조를 유지하기 위해 그대로 보존했습니다.
- source_word: בֵּית אֱלֹהָיו / בֵּית אוֹצַר אֱלֹהָיו
  english_pob_choice: to the house of his god / into the treasury of his god
  chosen_korean: 그의 신의 집으로 / 그 그의 신의 보물 창고에
  alternatives_korean:
  - 그의 신전으로 / 그의 신의 창고로
  - 그의 신의 성전으로 / 그의 신의 보물집에
  lexicon: HALOT
  rationale: 히브리어는 두 곳 모두 ‘집’(בֵּית)을 반복해 우상 숭배의 공간성과 대비를 강화하므로, 번역에서도 ‘집’을 유지했습니다. אוֹצָר는 보관 장소의 의미를 살려 ‘보물 창고’로 옮겼습니다.
theological_decisions:
- issue: 여호야김을 누가 넘겼는가에 대한 주권 표현
  chosen_reading: ‘주께서 … 그의 손에 넘기셨다’로 옮겨, 사건의 최종 주체가 하나님이심을 분명히 했습니다.
  alternative_readings:
  - ‘주께서 … 허락하셨다’
  - ‘주께서 … 패하게 하셨다’
  rationale: נתן + 주어가 주께로 제시되므로, 단순 허용으로 완화하지 않고 본문의 신학적 긴장을 그대로 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 신적 주권과 역사 속 심판의 표명(단 1:2 문맥)
- issue: ‘하나님의 집’과 ‘그의 신의 집’의 반복
  chosen_reading: 두 표현 모두 ‘집’으로 유지해 유다의 하나님과 바벨론 신의 공간적 대조를 드러냈습니다.
  alternative_readings:
  - ‘성전’과 ‘신전’으로 구분
  - ‘집’과 ‘사당’으로 구분
  rationale: 영어 POB의 주석처럼 히브리어는 같은 단어를 반복하므로, 한국어에서도 동일 어휘를 유지해 의도된 대조를 흐리지 않았습니다.
  doctrine_reference: 문학적 대구와 우상 숭배 비판의 보존
