  verdict: revise
  source_fidelity: 주어 אֲדֹנָי는 적절히 ‘주께서’로 옮겼고, 여호야김과 하나님의 집 기물 일부를 그의 손에 넘기신 주권적 행위도 보존했습니다. 다만 초안의 ‘그것들을’은 사람과 기물이 함께 가리켜지는 복수 목적어를 한국어에서 부자연스럽고 비인격적으로 처리하므로, 여호야김과 기물을 명시하는 편이 원문의 지시 대상을 더 정확히 전달합니다.
  naturalness: ‘하나님의 집 그릇 몇 개’와 ‘보물 창고’는 다소 구어적이거나 결합이 어색합니다. ‘하나님의 집의 기물 일부’, ‘보물창고’가 현대 표준어의 격식 있는 성경 문체에 더 자연스럽습니다. 각주 표지는 해당 지명과 표현 바로 뒤에 배치했습니다.
  terminology: ‘주’, ‘하나님의 집’, ‘그의 신의 집’을 유지하여 히브리어의 집-집 대조를 보존했습니다. כְּלֵי는 일반 식기를 뜻할 수 있는 ‘그릇’보다 성소 물품에 알맞은 ‘기물’로 옮겼습니다. 이방 신은 소문자 의미의 ‘신’으로 유지했습니다.
  issues:
