revisions:
- from: 주께서 유다 왕 여호야김을 그의 손에 넘기셨고[a], 하나님의 집 그릇 몇 개도 함께 넘기셨습니다. 그는 그것들을 시날 땅으로, 그의 신의 집으로 가져갔고[c][b], 그 그릇들을 그의 신의 보물 창고에 두었습니다.
  to: 주께서는 유다 왕 여호야김을 그의 손에 넘기시고[a], 하나님의 집의 기물 일부도 함께 넘기셨습니다. 그는 여호야김과 그 기물들을 시날 땅[b], 그의 신의 집[c]으로 가져갔고, 그 기물들을 그의 신의 보물창고에 두었습니다.
  rationale: 문맥상 ‘넘기다’는 נתן의 단순한 어휘를 과도하게 해석하지 않으면서도 적대자의 손에 넘겨짐을 자연스럽게 나타내므로 유지했습니다. 기물의 일부성과 하나님의 집/그의 신의 집이라는 반복을 보존하고, 혼합 복수 대명사의 한국어상 문제를 명시적 병렬 목적어로 해결했습니다. 각주 a는 실제 어휘 대안을 제시하도록 바로잡았으며, b와 c의 표지 위치를 해당 표현에 맞추었습니다.
