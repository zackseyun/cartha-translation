    issue: ‘그것들을’의 혼합 지시 대상 처리
    rationale: 히브리어 복수 접미사는 앞의 여호야김과 기물 일부를 함께 가리키는 것으로 이해되며, 한국어 ‘그것들’은 인물인 여호야김을 사물화하여 어색합니다. 두 대상을 명시했습니다.
