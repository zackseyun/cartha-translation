  to: 그때 우리의 모습과 왕의 음식을 먹는 젊은이들의 모습을 당신 앞에서 보이게 하시고, 당신이 보시는 대로 당신의 종들을 대하십시오.[a]
  rationale: 원문의 수동적 ‘보이다’ 요청을 한국어의 자연스러운 사역 구문인 ‘보이게 하시고’로 옮기고, ‘하다/대하다’의 관용 표현을 현대 합쇼체에 맞게 바로잡았습니다. 왕실 식량이라는 פַּתְבַּג의 어휘 범위는 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
