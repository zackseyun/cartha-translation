  text: וְ/יֵרָא֤וּ לְ/פָנֶ֨י/ךָ֙ מַרְאֵ֔י/נוּ וּ/מַרְאֵה֙ הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֣ג הַ/מֶּ֑לֶךְ וְ/כַ/אֲשֶׁ֣ר תִּרְאֵ֔ה עֲשֵׂ֖ה עִם עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/013.yaml
  text: Then let our appearance and the appearance of the youths who are eating the king’s food be seen before you[a], and according to what you see, deal with your servants.
  footnotes:
  - marker: a
    text: Or 'the king’s portion' or 'the king’s delicacies.' The Hebrew term refers to royal provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 우리의 모습과 왕의 음식을 먹는 젊은이들의 모습을 당신 앞에서 보이게 하시고, 당신이 보시는 대로 당신의 종들을 대하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음식’은 왕이 제공하는 식량을 가리키며, ‘왕의 몫’ 또는 ‘진미’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרָאוּ לְפָנֶיךָ
  english_pob_choice: let our appearance ... be seen before you
  chosen_korean: 우리의 모습과 … 모습이 당신 앞에서 드러나게 하십시오
  alternatives_korean:
  - 당신 앞에서 보이게 하십시오
  - 당신 앞에서 살펴보게 하십시오
  lexicon: HALOT
  rationale: 주어의 외형 상태를 공식적으로 확인해 달라는 요청이므로, 영어의 'be seen'을 살려 한국어에서는 '드러나게 하십시오'로 자연스럽게 옮겼습니다.
- source_word: מַרְאֵינוּ / מַרְאֵה הַיְלָדִים
  english_pob_choice: our appearance / the appearance of the youths
  chosen_korean: 우리의 모습 / 그 젊은이들의 모습
  alternatives_korean:
  - 우리의 외모 / 그 소년들의 외모
  - 우리의 얼굴빛 / 그 젊은이들의 얼굴빛
  lexicon: HALOT
  rationale: מַרְאֶה는 눈에 보이는 외형을 가리키므로 '모습'이 가장 무난하며, יְלָדִים은 궁정 훈련 맥락에서 '젊은이들'이 적절합니다.
- source_word: פַּתְבַּג הַמֶּלֶךְ
  english_pob_choice: the king’s food
  chosen_korean: 왕의 음식
  alternatives_korean:
  - 왕의 식사
  - 왕의 진수성찬
  - 왕의 진미
  lexicon: HALOT
  rationale: 페르시아계 차용어로서 왕실 식량/음식을 뜻하므로, POB의 직역 지향을 따라 '왕의 음식'으로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 하인들
  - 당신의 노예들
  lexicon: HALOT
  rationale: 여기서는 다니엘이 관리에게 공손히 말하는 맥락이므로 신분적 강조보다 예의가 우선되어 '종들'이 가장 자연스럽습니다.
theological_decisions:
- issue: 공손한 청유와 명령형의 어조
  chosen_reading: '"…드러나게 하십시오" / "행하십시오"로 정중한 청유형을 유지했습니다.'
  alternative_readings:
  - 직설형으로 옮겨 서술적으로 처리
  - 더 강한 명령형으로 옮김
  rationale: 원문은 관리에게 제시하는 요청이므로, 한국어에서도 합쇼체 청유를 써서 공적·대화적 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 원문의 화행과 장면 기능 보존'
