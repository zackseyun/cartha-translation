  verdict: revise
  source_fidelity: ‘드러나게 하십시오’는 외형이 ‘보이게/제시되게’ 한다는 원문의 요청보다 ‘숨겨진 것이 밝혀지다’라는 뉘앙스를 더합니다. 또한 עשה עם의 관용 표현은 ‘종들에게 행하십시오’보다 ‘종들을 대하십시오’로 옮기는 것이 의미와 한국어 문법에 더 충실합니다.
  naturalness: 초안의 마지막 문장 ‘당신의 종들에게 행하십시오’는 현대 한국어에서 목적어와 동반/대상 표현이 어색합니다. ‘보시는 대로 당신의 종들을 대하십시오’가 합쇼체의 공손한 요청 어조를 자연스럽게 유지합니다.
  terminology: ‘젊은이들’, ‘왕의 음식’, ‘종들’은 궁정 훈련 및 공손한 자기지칭의 문맥에 적절합니다. 왕의 음식에 관한 각주는 왕실 제공 식량이라는 어휘 범위를 적절히 밝혀야 합니다.
  issues:
