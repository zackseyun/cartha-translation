- from: 지혜로운 사람들은 궁창의 밝음처럼 빛날 것이고, 많은 사람을 의롭게 하는 이들은 영원히 또 영원히 별들처럼 빛날 것입니다.[a][b]
  to: 분별 있는 이들은 궁창[a]의 광채처럼 빛날 것이며, 많은 사람을 의롭게 하는 이들은 별들처럼 영원히, 영원토록 빛날 것입니다.[b]
  rationale: 현대 표준어 합쇼체의 자연스러운 병렬 구조로 다듬고, הַמַּשְׂכִּילִים의 분별·통찰의 뜻, מַצְדִּיקֵי의 인과적 의미와 해석상 여지, 그리고 לְעוֹלָם וָעֶד의 강조를 보존했습니다. 각주 내용과 위치를 해당 어휘 및 해석 쟁점에 맞게 바로잡았습니다.
