  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ֨/מַּשְׂכִּלִ֔ים יַזְהִ֖רוּ כְּ/זֹ֣הַר הָ/רָקִ֑יעַ וּ/מַצְדִּיקֵי֙ הָֽ/רַבִּ֔ים כַּ/כּוֹכָבִ֖ים לְ/עוֹלָ֥ם וָ/עֶֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/003.yaml
  text: And those who have insight will shine like the brightness of the expanse[a], and those who make the many righteous[c][b], like the stars forever and ever.
  footnotes:
  - marker: a
    text: Or 'the wise' for 'those who have insight.'
    reason: lexical_alternative
  - marker: b
    text: Or 'those who turn the many to righteousness'; the Hebrew may also be understood more literally as 'those who make the many righteous' or 'those who justify the many.'
    reason: alternative_reading
  - marker: c
    text: '''The expanse'' refers to the broad dome of the heavens; traditional English often has ''firmament.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람들은 궁창의 밝음처럼 빛날 것이고, 많은 사람을 의롭게 하는 이들은 영원히 또 영원히 별들처럼 빛날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘궁창’은 하늘의 넓게 펼쳐진 돔을 가리키며, 전통 번역의 ‘궁창’ 의미를 유지합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 더 문자적으로는 ‘많은 사람을 의롭게 하는 이들’ 또는 ‘많은 사람을 의롭다 하시는 이들’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂכִּלִים
  english_pob_choice: those who have insight
  chosen_korean: 지혜로운 사람들
  alternatives_korean:
  - 분별 있는 사람들
  - 통찰력 있는 사람들
  - 깨달은 사람들
  lexicon: HALOT
  rationale: 분사형이 가리키는 성격을 한국어로 자연스럽게 옮기되, 예언적·지혜문학적 맥락에서 널리 이해되는 ‘지혜로운 사람들’로 간결하게 살렸습니다.
- source_word: כְּזֹהַר הָרָקִיעַ
  english_pob_choice: like the brightness of the expanse
  chosen_korean: 궁창의 밝음처럼
  alternatives_korean:
  - 궁창의 광채처럼
  - 하늘의 밝음처럼
  - 궁창의 빛남처럼
  lexicon: HALOT
  rationale: רָקִיעַ를 ‘궁창’으로, זֹהַר를 ‘밝음’으로 옮겨 원문의 우주적 이미지와 POB의 source-oriented 선택을 유지했습니다.
- source_word: וּמַצְדִּיקֵי הָרַבִּים
  english_pob_choice: those who make the many righteous
  chosen_korean: 많은 사람을 의롭게 하는 이들
  alternatives_korean:
  - 많은 사람을 의롭게 하는 자들
  - 많은 사람을 의인으로 만드는 이들
  - 많은 사람을 의로 이끄는 이들
  lexicon: HALOT
  rationale: צדק의 히필 분사를 결과적으로 ‘의롭게 하다’로 옮겨, ‘justify’의 법정적 뉘앙스로만 고정하지 않고 원문의 인과적 의미를 살렸습니다.
- source_word: לְעוֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원히 또 영원히
  alternatives_korean:
  - 영원토록
  - 영원히
  - 세세토록
  lexicon: HALOT
  rationale: 겹말 구조의 강조를 한국어에서도 그대로 살려, 단순한 ‘영원히’보다 반복의 힘을 드러냈습니다.
theological_decisions:
- issue: מַצְדִּיקֵי הָרַבִּים의 신학적 뉘앙스
  chosen_reading: ‘많은 사람을 의롭게 하는 이들’로 옮겨, 행위가 다른 이들의 의로움에 미치는 인과적 의미를 보존했습니다.
  alternative_readings:
  - ‘많은 사람을 의롭다 하시는 이들’
  - ‘많은 사람을 의로 이끄는 이들’
  - ‘많은 사람을 변호하는 이들’
  rationale: 본문은 종말론적 보상 약속 속에서 ‘많은 사람’에 대한 의롭게 함의 역할을 말하며, 후대의 단일한 교리 용어로 환원하지 않는 편이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
