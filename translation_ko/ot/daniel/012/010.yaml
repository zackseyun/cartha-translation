  verdict: revise
  source_fidelity: 첫 두 히트파엘 동사는 문맥상 수동·중간 의미로 자연스럽게 이해될 수 있고, 셋째 니팔은 수동 의미입니다. 기존 본문의 ‘자신을 정결하게 하고 자신을 희게 하며’는 문법적으로 가능하나 한국어에서는 부자연스럽고, 특히 ‘자신을 희게 하다’가 인위적으로 자신을 표백한다는 뜻으로 들릴 수 있습니다. ‘정결하게 되고 희게 되며 단련될 것입니다’는 색채 이미지와 정련 비유를 보존하면서 원문의 중간·수동적 열린 의미를 충실히 반영합니다. ‘악인들은 악하게 행할 것이며, 악인 가운데 아무도 깨닫지 못할 것입니다’는 히브리어의 동족어 강조와 전체 부정을 자연스럽게 재현합니다.
  naturalness: 개정문은 현대 표준 한국어의 합쇼체에 맞고, ‘악한 사람들/모든 악한 사람’의 어색한 반복과 ‘이해하다’의 기계적 반복을 줄이면서도 원문의 대조와 반복을 유지합니다. ‘분별 있는 이들’과 ‘깨달을 것입니다’는 마지막 절의 마스킬림과 בין의 어휘적 연결을 자연스럽게 드러냅니다.
  terminology: ‘정결하게 되다’, ‘희게 되다’, ‘단련되다’는 정결·백색·금속 정련의 세 이미지를 각각 보존합니다. הַמַּשְׂכִּלִים는 일반적 지적 능력보다 분별·통찰의 뜻을 지니므로 ‘분별 있는 이들’이 적절합니다. 각주에서 가능한 ‘지혜로운 이들’ 번역도 유지합니다.
