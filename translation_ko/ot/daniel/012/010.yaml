id: DAN.12.10
reference: Daniel 12:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
  footnotes:
  - marker: a
    text: Or, 'Many will be purified and made white and refined.' The first two Hebrew verbs can be understood with a passive sense, though their forms also allow the reflexive nuance reflected in the main text.
    reason: alternative_reading
  - marker: b
    text: Or, 'the wise will understand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 자신을 정결하게 하고 자신을 희게 하며 단련될 것입니다[a]. 그러나 악한 사람들은 악을 행할 것이며, 모든 악한 사람은 이해하지 못할 것입니다[b]. 그러나 깨달음이 있는 사람들은 이해할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘많은 사람이 정결하게 되고 희게 되며 단련될 것입니다.’ 처음 두 히브리어 동사는 수동적으로도 이해될 수 있지만, 그 형태는 본문에 반영된 반사적 뉘앙스도 허용합니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘지혜로운 사람들은 이해할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  english_pob_choice: will purify themselves
  chosen_korean: 자신을 정결하게 하다
  alternatives_korean:
  - 스스로 깨끗해지다
  - 정결하게 되다
  lexicon: HALOT
  rationale: 히트파엘의 반사적/중간적 뉘앙스를 살려 ‘자신을 정결하게 하다’로 옮기되, 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: יִתְלַבְּנוּ
  english_pob_choice: make themselves white
  chosen_korean: 자신을 희게 하다
  alternatives_korean:
  - 희어지다
  - 스스로 희게 되다
  lexicon: HALOT
  rationale: ‘희게 하다’는 원문의 흰색 이미지와 정결의 비유를 유지하며, 앞 절과 병렬을 이루도록 했습니다.
- source_word: הַמַּשְׂכִּלִים
  english_pob_choice: those who have insight
  chosen_korean: 깨달음이 있는 사람들
  alternatives_korean:
  - 지혜로운 사람들
  - 분별 있는 사람들
  lexicon: HALOT
  rationale: 다니엘서 문맥에서 단순한 일반 지혜보다 ‘깨달음/분별’을 강조하므로, 이해하는 자들과의 대비를 살려 번역했습니다.
theological_decisions:
- issue: 첫 세 동사의 행위 주체를 능동/수동 가운데 어떻게 드러낼지
  chosen_reading: 첫 두 동사는 반사적 표현으로, 세 번째는 수동적 종결형으로 구분하여 번역했습니다.
  alternative_readings:
  - 많은 사람이 정결하게 되고 희게 되며 단련될 것입니다.
  rationale: 히브리어 형태가 첫 두 동사에서는 반사적/중간적 뉘앙스를, 셋째 동사에서는 더 명시적인 수동성을 보이므로, 그 차이를 한국어에서도 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘악한 사람들’과 ‘모든 악한 사람’의 반복을 어떻게 처리할지
  chosen_reading: ‘악한 사람들’과 ‘모든 악한 사람’을 각각 살려 반복의 강조를 유지했습니다.
  alternative_readings:
  - 악인들은 악을 행할 것이며, 그들은 이해하지 못할 것입니다.
  rationale: 히브리어의 어근 반복과 총체적 부정 구조를 완화하지 않고, 악의 지속성과 인식의 부재를 강조하는 문장 구조를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
