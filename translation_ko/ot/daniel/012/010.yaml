    rationale: 히브리어 히트파엘은 반사적 의미만이 아니라 중간적 또는 수동적으로도 쓰일 수 있습니다. 본문은 한국어의 자연스러운 중간·수동 표현을 사용하고, 반사적 해석은 각주로 제시하는 편이 더 정확합니다.
  - severity: low
