translation:
  language: ko
  text: 그가 아마포 옷을 입은 그 사람에게 말했습니다. 그는 강 물 위에 서 있었습니다. 「이 놀라운 일들의 끝은 언제입니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “강 물 위에.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “이 놀라운 일들의 끝이 언제입니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאִישׁ
  english_pob_choice: to the man
  chosen_korean: 그 사람에게
  alternatives_korean:
  - 그 남자에게
  - 그 사람에게
  lexicon: HALOT
  rationale: 문맥상 이미 식별 가능한 존재이므로 ‘그 사람’으로 옮기되, 한국어에서는 주격 반복을 피하고 자연스럽게 목적격으로 처리했습니다.
- source_word: לְבוּשׁ הַבַּדִּים
  english_pob_choice: clothed in linen
  chosen_korean: 아마포 옷을 입은
  alternatives_korean:
  - 삼베 옷을 입은
  - 아마포를 입은
  - 아마포 옷을 입은
  lexicon: HALOT
  rationale: בַּדִּים은 린넨 계열의 옷감을 가리키므로, 성경 문맥에서 널리 쓰이는 ‘아마포’를 선택해 고상한 환상 장면의 톤을 살렸습니다.
- source_word: מִמַּעַל לְמֵימֵי הַיְאֹר
  english_pob_choice: who was above the waters of the river
  chosen_korean: 강 물 위에 서 있었습니다
  alternatives_korean:
  - 강 물 위에 있었습니다
  - 강물 위에 서 있었습니다
  - 강 위에 있었습니다
  lexicon: HALOT
  rationale: מִמַּעַל은 단순한 ‘위에/위쪽에’의 위치를 나타내므로, ‘서 있었습니다’로 현장감을 살리되 의미를 넘어서지 않도록 했습니다. ‘יְאֹר’는 이 문맥에서 특정 강명보다 환상 속 강으로 보는 것이 안전합니다.
- source_word: הַפְּלָאוֹת
  english_pob_choice: these wonders
  chosen_korean: 이 놀라운 일들
  alternatives_korean:
  - 이 기이한 일들
  - 이 경이로운 일들
  - 이 놀라운 일들
  lexicon: HALOT
  rationale: פלא의 핵심은 놀라움/경이로움에 있으므로 ‘놀라운 일들’로 옮겨, 단순한 ‘기적’보다 더 넓은 의미를 유지했습니다.
theological_decisions:
- issue: 인물 식별을 어디까지 밝힐 것인가
  chosen_reading: 히브리어가 제공하는 서술만 따라, 화자와 아마포 옷 입은 인물을 추가 식별하지 않았습니다.
  alternative_readings:
  - 아마포 옷 입은 이를 천사로 명시하는 읽기
  - 아마포 옷 입은 이를 그리스도로 보는 읽기
  rationale: 본문 자체는 그들의 정체를 명시하지 않으므로, 신학적 해석을 번역문에 선반영하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
