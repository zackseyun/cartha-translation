  source_fidelity: 수정이 필요합니다. 히브리어의 אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר는 ‘아마포 옷을 입은 그 사람’을 수식합니다. 초안처럼 문장을 나누면 둘째 문장의 ‘그는’이 화자인지 아마포 옷을 입은 사람인지 불분명해지며, 관계절 연결도 약화됩니다. 또한 מִמַּעַל은 단지 ‘위에/위쪽에’를 뜻하므로 ‘서 있었습니다’는 본문에 없는 자세를 보탭니다. עַד מָתַי와 קֵץ הַפְּלָאוֹת는 ‘이 놀라운 일들의 끝은 언제입니까?’로 충실히 옮길 수 있습니다.
  naturalness: ‘강물’은 현대 표준어에서 붙여 쓰는 것이 자연스럽습니다. 관계절을 명사구 안에 유지한 ‘강물 위에 있는 아마포 옷을 입은 그 사람에게’는 화자와 피수식자를 혼동하지 않으면서도 현대 한국어 문장으로 자연스럽습니다. 인용문은 합쇼체 의문형으로 유지했습니다.
  terminology: בַּדִּים의 ‘아마포 옷’과 פלא의 ‘놀라운 일들’은 적절합니다. 인물의 정체를 천사나 그리스도로 특정하지 않은 점도 본문에 충실합니다.
