  - severity: low
    issue: 기존 각주가 본문보다 원문의 분사 의미를 더 잘 반영함
    rationale: 기존 각주의 ‘기다리며’는 단순 대안이 아니라 본문에 반영되어야 할 핵심 문법 의미입니다. 각주는 ‘행복합니다’라는 어휘 대안으로 조정합니다.
