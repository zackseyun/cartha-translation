lexical_decisions:
- source_word: אַשְׁרֵי
  english_pob_choice: Blessed is
  chosen_korean: 복됩니다
  alternatives_korean:
  - 행복합니다
  - 복 있는 사람은
  lexicon: HALOT
  rationale: 예언서의 복 선언을 자연스러운 합쇼체로 옮기면서도, 단순한 감정 상태보다 하나님 앞에서의 복됨을 드러내기 위해 ‘복됩니다’를 택했습니다.
- source_word: הַמְחַכֶּה
  english_pob_choice: the one who waits
  chosen_korean: 기다렸다가
  alternatives_korean:
  - 기다리는 사람은
  - 기다리는 자는
  lexicon: HALOT
  rationale: 현재분사의 지속적 의미를 살리되, 뒤의 ‘이르다’와 함께 한국어에서 더 자연스러운 완료·도달 뉘앙스를 주기 위해 ‘기다렸다가’로 옮겼습니다.
- source_word: וְיַגִּיעַ לְיָמִים
  english_pob_choice: and reaches the 1,335 days
  chosen_korean: 1,335일에 이르는
  alternatives_korean:
  - 1,335일에 도달하는
  - 1,335일에 도착하는
  lexicon: HALOT
  rationale: נגע의 ‘도달하다/이르다’ 의미를 시간표현에 맞게 처리하여, 날짜 자체를 목적어로 삼는 원문의 시간 종착점을 살렸습니다.
- source_word: אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  english_pob_choice: 1,335
  chosen_korean: 1,335일
  alternatives_korean:
  - 천삼백삼십오일
  lexicon: HALOT
  rationale: 히브리어 수사를 현대 한국어 가독성에 맞게 숫자로 옮기되, 시간 단위인 ‘일’을 분명히 밝혔습니다.
theological_decisions:
- issue: 1,335일의 성격을 번역에서 해석할지 여부
  chosen_reading: 번역문은 단순히 ‘복됨’과 ‘도달’의 진술만 남기고, 이 수치를 상징적·문자적 기간으로 판정하지 않았습니다.
  alternative_readings:
  - 문자적 종말 시한으로 명시
  - 상징적 수치로 풀이
  rationale: 원문 자체가 이 숫자의 성격을 설명하지 않으므로, 해석 논쟁을 번역이 선행해서 닫지 않도록 했습니다.
  doctrine_reference: 종말론적 긴장은 번역에서 보존해야 합니다.
