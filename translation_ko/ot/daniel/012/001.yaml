id: DAN.12.1
reference: Daniel 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִיא֩ יַעֲמֹ֨ד מִֽיכָאֵ֜ל הַ/שַּׂ֣ר הַ/גָּד֗וֹל הָ/עֹמֵד֮ עַל בְּנֵ֣י עַמֶּ/ךָ֒ וְ/הָיְתָה֙ עֵ֣ת צָרָ֔ה אֲשֶׁ֤ר לֹֽא נִהְיְתָה֙ מִֽ/הְי֣וֹת גּ֔וֹי עַ֖ד הָ/עֵ֣ת הַ/הִ֑יא וּ/בָ/עֵ֤ת הַ/הִיא֙ יִמָּלֵ֣ט עַמְּ/ךָ֔ כָּל הַ/נִּמְצָ֖א כָּת֥וּב בַּ/סֵּֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/001.yaml
  text: And at that time Michael[a], the great prince who stands over the sons of your people, will arise. And there will be a time of distress such as has not happened since there was a nation until that time. And at that time your people will escape[c][b], everyone who is found written in the book.
  footnotes:
  - marker: a
    text: Or 'who stands for the sons of your people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a time of trouble.'
    reason: lexical_alternative
  - marker: c
    text: Or 'will be delivered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 그대 백성의 아들들을 위하여 서 있는 큰 군주 미가엘이 일어날 것입니다. 나라가 생긴 이래 그때까지 없었던 고난의 때가 있을 것입니다[b]. 그때에 그대의 백성, 곧 책에 기록되어 있는 모든 사람은 벗어날 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘환난의 때’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘구출될 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  english_pob_choice: will arise
  chosen_korean: 일어날 것입니다
  alternatives_korean:
  - 서 있을 것입니다
  - 나설 것입니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘서다’이지만, 미가엘이 보호자로서 결정적으로 행동하기 시작하는 문맥이므로 ‘일어나다’가 POB의 ‘will arise’를 한국어로 자연스럽게 옮기면서도 동작성을 유지합니다.
- source_word: הַשַּׂר הַגָּדוֹל
  english_pob_choice: the great prince
  chosen_korean: 큰 군주
  alternatives_korean:
  - 큰 왕자
  - 큰 통치자
  - 큰 방백
  lexicon: HALOT
  rationale: שַׂר는 본문에서 천상적 권위자를 가리키므로 한국어 관용에서 오해가 적고 위계적 느낌을 살리는 ‘군주’를 택했습니다.
- source_word: בְּנֵי עַמֶּךָ
  english_pob_choice: the sons of your people
  chosen_korean: 그대 백성의 자손들
  alternatives_korean:
  - 그대 백성의 아들들
  - 그대의 백성
  lexicon: HALOT
  rationale: ‘sons of’의 남성형을 무성별화해 지우기보다, 계보적·집단적 의미를 살리는 ‘자손들’로 옮겨 원문 구조를 보존했습니다.
- source_word: יִמָּלֵט
  english_pob_choice: will escape
  chosen_korean: 구출될 것입니다
  alternatives_korean:
  - 도망칠 것입니다
  - 피할 것입니다
  - 구원될 것입니다
  lexicon: HALOT
  rationale: 이 동사는 ‘탈출하다/벗어나다’의 뜻이지만, 문맥상 하나님께서 남겨 두신 백성이 재난에서 건져지는 의미가 강하므로 ‘구출되다’로 옮겨 POB의 대안 의미를 반영했습니다.
theological_decisions:
- issue: 미가엘의 행동 방식
  chosen_reading: ‘일어날 것입니다’로 옮겨, 미가엘이 백성을 위해 결정적으로 개입하는 장면을 살렸습니다.
  alternative_readings:
  - 정적인 ‘서 있을 것입니다’
  - 법정적 뉘앙스가 강한 ‘일어나 변호할 것입니다’
  rationale: 본문은 천사론을 해설하기보다 보호자의 등장과 행동을 말하므로, 해석을 과도하게 좁히지 않고 본문의 긴장감을 유지했습니다.
  doctrine_reference: 본문의 서술을 해석으로 대체하지 않음
- issue: יִמָּלֵט의 구출/탈출 의미
  chosen_reading: ‘구출될 것입니다’로 번역해 재난 속 보존과 구원을 함께 열어 두었습니다.
  alternative_readings:
  - ‘도망칠 것입니다’처럼 단순 탈출로 읽는 방식
  - ‘구원될 것입니다’처럼 종말론적 구원으로만 읽는 방식
  rationale: 문맥은 국가적·종말론적 환난이지만, 동사의 기본 의미와 서술의 층위를 모두 살리기 위해 ‘구출’이 가장 균형적입니다.
  doctrine_reference: 의미를 단일 교리로 축소하지 않음
