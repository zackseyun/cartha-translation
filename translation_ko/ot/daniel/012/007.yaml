  source_fidelity: 초안은 아마포를 입은 사람, 양손을 들어 맹세함, 영원히 사시는 이에 대한 맹세, 그리고 거룩한 백성의 ‘손’이 뜻하는 힘이라는 핵심을 대체로 반영합니다. 그러나 첫 문장에서 ‘강물 위에 있는 그 사람의 왼손과 오른손’이라고 연결되어, 강물 위에 있는 대상이 사람인지 손인지가 문법적으로 흐려지고, 그 사람이 손을 든다는 주절 구조도 무너집니다. 또한 히브리어의 순서대로 ‘오른손과 왼손’을 제시하는 편이 안전합니다. 시간 표현에 관한 영어 POB 각주 a의 내용과 위치가 한국어 각주에 반영되지 않았으므로 이를 바로잡습니다.
