id: DAN.12.7
reference: Daniel 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת הָ/אִ֣ישׁ לְב֣וּשׁ הַ/בַּדִּ֗ים אֲשֶׁ֣ר מִ/מַּעַל֮ לְ/מֵימֵ֣י הַ/יְאֹר֒ וַ/יָּ֨רֶם יְמִינ֤/וֹ וּ/שְׂמֹאל/וֹ֙ אֶל הַ/שָּׁמַ֔יִם וַ/יִּשָּׁבַ֖ע בְּ/חֵ֣י הָ/עוֹלָ֑ם כִּי֩ לְ/מוֹעֵ֨ד מֽוֹעֲדִ֜ים וָ/חֵ֗צִי וּ/כְ/כַלּ֛וֹת נַפֵּ֥ץ יַד עַם קֹ֖דֶשׁ תִּכְלֶ֥ינָה כָל אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/007.yaml
  text: Then I heard the man clothed in linen[a], who was above the waters of the river, and he raised his right hand and his left hand to heaven and swore by him who lives forever that it would be for a time, times, and half a time; and when the shattering of the power of the holy people is finished[b], all these things will be completed.
  footnotes:
  - marker: a
    text: Or, more literally, 'for an appointed time, appointed times, and half'; many understand this as 'for a year, two years, and half a year.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the hand of the holy people'; 'hand' here likely means power or strength.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나는 아마포 옷을 입은 그 사람[a], 곧 강 물 위에 있는 그 사람의 왼손과 오른손을 하늘로 들어, 영원히 살아 계신 분을 두고 맹세하는 것을 들었습니다. 그것은 한 때, 두 때, 그리고 반 때가 될 것이며, 거룩한 백성의 힘이 부서지는 일이 끝나면[b] 이 모든 일이 끝날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아마포를 입은 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘거룩한 백성의 손’은 여기서 힘이나 권세를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבוּשׁ הַבַּדִּים
  english_pob_choice: clothed in linen
  chosen_korean: 아마포 옷을 입은
  alternatives_korean:
  - 아마포로 옷 입은
  - 아마포 옷차림의
  lexicon: HALOT
  rationale: ‘הַבַּדִּים’은 아마포를 가리키므로, 인물을 묘사하는 자연스러운 현대 한국어로 ‘아마포 옷을 입은’이 적절합니다.
- source_word: וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ
  english_pob_choice: he raised his right hand and his left hand
  chosen_korean: 왼손과 오른손을 하늘로 들어
  alternatives_korean:
  - 오른손과 왼손을 하늘로 들어
  - 양손을 하늘로 들어
  lexicon: HALOT
  rationale: 히브리어는 양손을 각각 명시하므로 두 손을 모두 드는 맹세 동작을 살리되, 한국어 어순은 자연스럽게 조정했습니다.
- source_word: בְּחֵי הָעוֹלָם
  english_pob_choice: by him who lives forever
  chosen_korean: 영원히 살아 계신 분을 두고
  alternatives_korean:
  - 영원히 살아 계신 이를 두고
  - 영원토록 사시는 분을 두고
  lexicon: HALOT
  rationale: 맹세 공식의 신적 대상을 분명히 하면서도, 직역투를 피하고 한국어에서 자연스러운 서약 표현으로 옮겼습니다.
- source_word: נַפֵּץ יַד עַם קֹדֶשׁ
  english_pob_choice: the shattering of the power of the holy people
  chosen_korean: 거룩한 백성의 힘이 부서지는 일
  alternatives_korean:
  - 거룩한 백성의 권세가 무너지는 일
  - 거룩한 백성의 손이 부서지는 일
  lexicon: HALOT
  rationale: ‘손’은 문맥상 힘/권세를 뜻하는 메토님이므로, POB의 의미를 따라 ‘힘’으로 옮겼습니다. ‘부서지는 일’은 파괴의 이미지를 유지합니다.
- source_word: תִּכְלֶינָה כָל אֵלֶּה
  english_pob_choice: all these things will be completed
  chosen_korean: 이 모든 일이 끝날 것입니다
  alternatives_korean:
  - 이 모든 일이 완성될 것입니다
  - 이 모든 일이 마무리될 것입니다
  lexicon: HALOT
  rationale: 종말론적 문맥에서 ‘완성’보다 사건의 종결을 드러내는 ‘끝날 것입니다’가 더 자연스럽고, 소멸이 아니라 예언의 완료를 나타냅니다.
theological_decisions:
- issue: ‘한 때, 두 때, 그리고 반 때’의 시간 표현
  chosen_reading: 수치를 풀어 쓰지 않고, 히브리어의 난해한 종말론적 관용구를 그대로 살렸습니다.
  alternative_readings:
  - 한 해, 두 해, 그리고 반 해
  - 정해진 때, 정해진 때들, 그리고 반
  rationale: 본문 자체가 기간의 정확한 단위를 설명하지 않으므로, 해석을 앞서지 않도록 모호성을 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 맹세 대상의 표기
  chosen_reading: ‘영원히 살아 계신 분’을 직접 밝혀 하나님께 대한 맹세임을 분명히 했습니다.
  alternative_readings:
  - 그분께
  - 영원히 살아 계신 이를
  rationale: 히브리어의 서약 공식은 신적 인격을 가리키므로, 독자가 맹세의 대상이 하나님임을 분명히 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §6
