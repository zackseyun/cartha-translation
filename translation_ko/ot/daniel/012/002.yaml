    rationale: '''그들 가운데 어떤 이들은 ... 어떤 이들은''은 אֵלֶּה ... וְאֵלֶּה의 ''이들은 ... 저들은'' 대조를 ''some ... others''로 평탄화합니다.'
  - severity: medium
    issue: '''멸시로 나아갈 것입니다''의 의미 부가'
    rationale: 히브리어는 두 결과를 병렬하여 제시할 뿐 '나아가다'라는 이동 행위를 말하지 않습니다. 또한 '멸시로 나아가다'는 한국어로도 부자연스럽고 멸시를 당한다는 뜻이 불명확합니다.
  - severity: low
    issue: 각주 a의 '모든 사람' 부정 방식
    rationale: 원문은 '모든'이라고 명시하지 않는다는 뜻이지, 반드시 '모든 사람이 아니다'라고 단정하는 것은 아닙니다. 표현을 '명시하지 않습니다'로 조정해 해석적 쟁점을 열어 두었습니다.
