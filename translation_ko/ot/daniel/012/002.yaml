revisions:
- from: 땅의 티끌 속에서 잠든 사람들 가운데 많은 이들이 깨어날 것입니다[a]. 그들 가운데 어떤 이들은 영원한 생명으로, 어떤 이들은 치욕과 영원한 멸시로 나아갈 것입니다[b][c].
  to: 땅의 티끌 가운데 잠든 이들 중 많은 이들이 깨어날 것입니다[a]. 이들은 영원한 생명에 이르고, 저들은 치욕과 영원한 멸시를 받게 될 것입니다[b][c].
  rationale: 원문의 '많은'을 유지하고, 잠과 깨어남의 비유를 보존했습니다. 특히 두 집단을 가리키는 대조 지시사를 살리고, 부정적 결과를 향한 이동이라는 불필요한 의미를 제거했습니다. 두 부정적 명사는 계속 পৃথ পৃথ하게 번역했으며, 논쟁적인 부활 범위는 각주에서도 결정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:26Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 '많은', '잠든', '깨어나다', '영원한 생명' 및 부정적 결과의 두 항은 대체로 충실합니다. 다만 원문의 대조 표현 אֵלֶּה ... וְאֵלֶּה는 '그들 가운데 어떤 이들은 ... 어떤 이들은'보다 '이들은 ... 저들은'으로 보존하는 편이 더 정확합니다. 또한 '치욕과 영원한 멸시로 나아갈 것입니다'는 목적지를 향해 이동한다는 뜻을 보태므로, 수동적 결과를 자연스럽게 나타내도록 고쳤습니다.
  naturalness: 합쇼체는 적절합니다. '땅의 티끌 가운데 잠든 이들 중 많은 이들'은 원문의 소속 관계와 매장/죽음의 이미지를 자연스럽게 유지합니다. 결과 절은 '영원한 생명에 이르고' 및 '치욕과 영원한 멸시를 받게 될 것입니다'로 다듬어 현대 한국어에서 더 명료하게 했습니다.
  terminology: '''영원한 생명''은 확립된 자연스러운 표현입니다. חֲרָפוֹת와 דִרְאוֹן의 구별은 ''치욕''과 ''영원한 멸시''로 유지했습니다. ''멸시를 받다''는 이들이 멸시의 대상이 된다는 문맥상 의미를 분명히 하며, 각주에서 ''혐오''라는 대안을 보존합니다.'
