id: DAN.12.2
reference: Daniel 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רַבִּ֕ים מִ/יְּשֵׁנֵ֥י אַדְמַת עָפָ֖ר יָקִ֑יצוּ אֵ֚לֶּה לְ/חַיֵּ֣י עוֹלָ֔ם וְ/אֵ֥לֶּה לַ/חֲרָפ֖וֹת לְ/דִרְא֥וֹן עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/002.yaml
  text: And many of those sleeping in the dust of the earth will awake[a], these to everlasting life, and those to reproaches[c][b], to everlasting contempt.
  footnotes:
  - marker: a
    text: Or 'multitudes of those sleeping in the dust of the earth.' The Hebrew says 'many,' not explicitly 'all.'
    reason: alternative_reading
  - marker: b
    text: Or 'to shame' for 'to reproaches.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to everlasting abhorrence.' Compare Isaiah 66:24, where a related idea appears in a judgment context.
    reason: cross_reference
translation:
  language: ko
  text: 땅의 티끌 가운데 잠든 이들 중 많은 이들이 깨어날 것입니다[a]. 이들은 영원한 생명에 이르고, 저들은 치욕과 영원한 멸시를 받게 될 것입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '땅의 티끌 가운데 잠든 이들의 큰 무리.' 히브리어는 '많은'이라고 할 뿐, '모든'이라고 명시하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '수치'로 '치욕'을 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '영원한 혐오'로 옮길 수 있습니다. 이사야 66:24의 관련 표현과 비교할 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: רַבִּים
  english_pob_choice: many
  chosen_korean: 많은 이들
  alternatives_korean:
  - 많은 사람들
  - 무리
  lexicon: HALOT
  rationale: 히브리어는 '많은'이라는 직접적 의미를 가지므로, 범위를 '모든'으로 넓히지 않고 자연스러운 한국어로 '많은 이들'이라 옮겼습니다.
- source_word: מִיְּשֵׁנֵי אַדְמַת עָפָר
  english_pob_choice: of those sleeping in the dust of the earth
  chosen_korean: 땅의 티끌 속에서 잠든 사람들 가운데
  alternatives_korean:
  - 땅의 먼지 속에서 잠든 이들 가운데
  - 땅의 흙먼지 속에서 잠든 자들 가운데
  lexicon: HALOT
  rationale: '''잠든''으로 죽음을 비유하는 표현을 살리고, ''אַדְמַת עָפָר''의 흙/티끌 이미지를 한국어에서 가장 자연스럽게 드러내도록 ''땅의 티끌 속''으로 옮겼습니다.'
- source_word: יָקִיצוּ
  english_pob_choice: will awake
  chosen_korean: 깨어날 것입니다
  alternatives_korean:
  - 일어날 것입니다
  - 잠에서 깰 것입니다
  lexicon: HALOT
  rationale: 동사의 핵심 뜻인 '깨다/깨어나다'를 살려 부활의 맥락을 드러내되, '일어나다'처럼 다른 동작을 덧붙이지 않았습니다.
- source_word: חֲרָפוֹת
  english_pob_choice: reproaches
  chosen_korean: 치욕
  alternatives_korean:
  - 수치
  - 모욕
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 자연스럽게 집합적 의미를 살려 '치욕'으로 옮겼고, 사회적 수치의 뉘앙스를 보존했습니다.
- source_word: דִרְאוֹן
  english_pob_choice: contempt
  chosen_korean: 멸시
  alternatives_korean:
  - 경멸
  - 혐오
  lexicon: HALOT
  rationale: '''영원한''과 결합하는 अंतिम적 심판의 뉘앙스를 살리기 위해 현대 한국어에서 분명한 ''멸시''를 선택했습니다.'
theological_decisions:
- issue: רַבִּים의 범위
  chosen_reading: '''많은 이들''로 번역해, 히브리어가 말하는 범위를 열어 둡니다.'
  alternative_readings:
  - '''모든 사람들''로 해석해 보편적 부활로 단정하기'
  - '''무리''로 바꿔 수량성을 약화시키기'
  rationale: 본문은 '많은'이라고 말할 뿐이므로, 부활의 범위를 교리적으로 미리 확정하지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: 부정적 종착의 표현
  chosen_reading: '''치욕과 영원한 멸시''로 두 항을 구분해 옮깁니다.'
  alternative_readings:
  - '''수치와 영원한 혐오''로 합치기'
  - '''수치와 영원한 경멸''로 단순화하기'
  rationale: 히브리어의 복수 명사와 단수 명사가 함께 주는 엄중한 대비를 살려, 부정적 운명을 한 표현으로 뭉개지 않았습니다.
  doctrine_reference: Translation philosophy §1 and §3
