id: DAN.12.4
reference: Daniel 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה דָֽנִיֵּ֗אל סְתֹ֧ם הַ/דְּבָרִ֛ים וַ/חֲתֹ֥ם הַ/סֵּ֖פֶר עַד עֵ֣ת קֵ֑ץ יְשֹׁטְט֥וּ רַבִּ֖ים וְ/תִרְבֶּ֥ה הַ/דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/004.yaml
  text: But you[a], Daniel, shut up the words and seal the book until the time of the end. Many will roam about[b], and knowledge will increase.
  footnotes:
  - marker: a
    text: Or 'the scroll.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Many will run to and fro'; the Hebrew may also suggest searching through something, yielding the sense 'Many will search through, and knowledge will increase.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 너 다니엘아, 그 말들을 닫아 두고 이 책을 마지막 때까지 봉인하라. 많은 사람이 이리저리 돌아다닐 것이며, 지식이 늘어날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두루마리.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘많은 사람이 이리저리 오가며’라는 뜻일 수 있으며, 히브리어는 ‘많은 사람이 찾아 살피면’이라는 의미도 시사할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה דָנִיֵּאל
  english_pob_choice: But you, Daniel
  chosen_korean: 그러나 너 다니엘아
  alternatives_korean:
  - 그리고 너 다니엘아
  - 너 다니엘아
  lexicon: WLC
  rationale: 대조를 나타내는 וְ를 ‘그러나’로 살리고, 직접 호명은 한국어 어순에 맞게 앞에 배치했습니다.
- source_word: סְתֹם הַדְּבָרִים
  english_pob_choice: shut up the words
  chosen_korean: 그 말들을 닫아 두고
  alternatives_korean:
  - 그 말들을 봉하여 두고
  - 그 말들을 감추고
  lexicon: HALOT
  rationale: סתם의 ‘닫다/막다’라는 구체적 이미지를 살리되, 한국어에서는 ‘닫아 두다’가 의미를 자연스럽게 전달합니다.
- source_word: חֲתֹם הַסֵּפֶר
  english_pob_choice: seal the book
  chosen_korean: 이 책을 마지막 때까지 봉인하라
  alternatives_korean:
  - 그 책을 봉하라
  - 이 두루마리를 봉인하라
  lexicon: HALOT
  rationale: חתם의 문서 봉인 의미를 ‘봉인하다’로 옮겼고, ספר는 문맥상 ‘책’이 가능하지만 물질문화적 뉘앙스를 살린 대안도 열어 두었습니다.
- source_word: יְשֹׁטְטוּ רַבִּים
  english_pob_choice: Many will roam about
  chosen_korean: 많은 사람이 이리저리 돌아다닐 것이며
  alternatives_korean:
  - 많은 사람이 이리저리 달려다닐 것이며
  - 많은 사람이 두루 살필 것이며
  lexicon: HALOT
  rationale: שוטט의 이동·배회 의미를 기본으로 하되, 해석을 한쪽으로 좁히지 않기 위해 ‘이리저리 돌아다니다’를 택했습니다.
- source_word: וְתִרְבֶּה הַדָּעַת
  english_pob_choice: and knowledge will increase
  chosen_korean: 지식이 늘어날 것입니다
  alternatives_korean:
  - 지식이 증가할 것입니다
  - 앎이 많아질 것입니다
  lexicon: HALOT
  rationale: דעת은 여기서 일반적인 ‘지식’이 가장 직접적이므로, 읽기 쉬운 현대어로 옮기되 증대의 의미를 유지했습니다.
theological_decisions:
- issue: יְשֹׁטְטוּ רַבִּים의 해석 범위
  chosen_reading: 본문은 많은 사람이 실제로 이리저리 움직이거나, 혹은 책을 찾아 살피는 뜻까지 포함할 수 있는 열린 표현으로 유지했습니다.
  alternative_readings:
  - 많은 사람이 문자 그대로 왕래할 것입니다.
  - 많은 사람이 그 책을 뒤져 살필 것입니다.
  rationale: 히브리어 동사는 물리적 이동과 탐색적 왕래 모두 가능하므로, 본문이 허용하는 긴장을 해치지 않도록 단정하지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve ambiguity where the source permits it.'
