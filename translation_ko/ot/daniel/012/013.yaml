  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֖ה לֵ֣ךְ לַ/קֵּ֑ץ וְ/תָנ֛וּחַ וְ/תַעֲמֹ֥ד לְ/גֹרָלְ/ךָ֖ לְ/קֵ֥ץ הַ/יָּמִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/013.yaml
  text: But as for you[a], go to the end[d][c][b]; and you will rest and stand in your allotted place at the end of the days.
  footnotes:
  - marker: a
    text: Or 'until the end.'
    reason: lexical_alternative
  - marker: b
    text: '''You will rest'' likely refers to Daniel''s death before the final consummation.'
    reason: lexical_alternative
  - marker: c
    text: Or 'stand for your lot'—that is, receive your allotted portion or inheritance.
    reason: lexical_alternative
  - marker: d
    text: The phrase 'at the end of the days' is an eschatological expression; compare Daniel 12:2.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 당신은 끝으로 가십시오. 당신은 쉬고, 날들의 끝에 당신에게 정해진 몫을 받기 위해 일어서게 될 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끝까지’.
    reason: alternative_reading
  - marker: b
    text: ‘쉬고’는 다니엘이 최종 성취 전에 죽음을 맞는다는 뜻으로 이해될 가능성이 큽니다.
    reason: theological_note
  - marker: c
    text: 또는 ‘당신의 몫을 위하여 서게 될 것입니다’—곧 당신에게 정해진 몫이나 상속을 받는다는 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘날들의 끝에’는 종말론적 표현입니다. 다니엘 12:2와 비교해 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But as for you
  chosen_korean: 그러나 당신은
  alternatives_korean:
  - 그리고 당신은
  - 하지만 당신은
  lexicon: HALOT
  rationale: 대조를 나타내는 전환이므로 단순한 연결인 ‘그리고’보다 ‘그러나’로 처리해 문맥의 대비를 드러냈습니다.
- source_word: לֵךְ לַקֵּץ
  english_pob_choice: go to the end
  chosen_korean: 끝까지 가야 합니다
  alternatives_korean:
  - 끝으로 가야 합니다
  - 끝에 이르러야 합니다
  lexicon: HALOT
  rationale: לֵךְ와 לַקֵּץ의 결합을 자연스러운 한국어로 옮기되, POB의 ‘to the end’가 지닌 종착점 방향을 살려 ‘끝까지’로 표현했습니다.
- source_word: וְתָנֻחַ
  english_pob_choice: you will rest
  chosen_korean: 쉬고
  alternatives_korean:
  - 안식하고
  - 휴식하고
  lexicon: HALOT
  rationale: 직역의 ‘쉬다’가 원문의 의미를 가장 직접적으로 전하며, 죽음을 명시하지 않고도 문맥상 암시를 열어 두었습니다.
- source_word: וְתַעֲמֹד לְגֹרָלְךָ
  english_pob_choice: and stand in your allotted place
  chosen_korean: 당신의 정해진 몫을 따라 일어설 것입니다
  alternatives_korean:
  - 당신의 몫을 위해 설 것입니다
  - 당신의 몫에 서게 될 것입니다
  - 당신의 분깃을 따라 일어날 것입니다
  lexicon: HALOT
  rationale: עָמַד의 ‘서다’와 גּוֹרָל의 ‘몫/분깃’ 이미지를 살리면서, 종말론적 맥락에서 독자가 이해할 수 있도록 ‘정해진 몫’과 ‘일어설’로 옮겼습니다.
- source_word: לְקֵץ הַיָּמִין
  english_pob_choice: at the end of the days
  chosen_korean: 세상의 끝날에
  alternatives_korean:
  - 날들의 끝에
  - 그 날들의 끝에
  - 마지막 날에
  lexicon: HALOT
  rationale: 관용적 종말 표현을 한국어로 자연화하되, 단순한 시간 종결보다 종말론적 뉘앙스가 살아 있도록 ‘세상의 끝날’로 옮겼습니다.
theological_decisions:
- issue: וְתַעֲמֹד의 종말론적 의미를 어디까지 드러낼 것인가
  chosen_reading: 본문에는 직접 ‘부활’이라는 말을 넣지 않고 ‘일어설 것입니다’로 두어, 맥락이 암시하는 소망을 열어 두었습니다.
  alternative_readings:
  - 부활할 것입니다
  - 다시 설 것입니다
  rationale: 단어 자체는 문자적으로 ‘서다’이므로, 본문을 과잉 해석하지 않으면서도 다니엘 12장의 부활적 문맥은 독자가 읽어낼 수 있게 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
