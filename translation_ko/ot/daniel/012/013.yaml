revisions:
- from: 그러나 당신은 끝까지 가야 합니다. 그러면 당신은 쉬고, 세상의 끝날에 당신의 정해진 몫을 따라 일어설 것입니다.[a][b][c][d]
  to: 그러나 당신은 끝으로 가십시오. 당신은 쉬고, 날들의 끝에 당신에게 정해진 몫을 받기 위해 일어서게 될 것입니다.[a][b][c][d]
  rationale: 원문에 없는 ‘세상’을 제거하고, 직접 명령형을 복원했습니다. 또한 לְגֹרָלְךָ를 ‘정해진 몫을 따라’로 처리한 의미상 오류를 바로잡아, 배정된 몫을 받는다는 뜻을 자연스럽게 드러냈습니다. ‘쉬다’와 ‘일어서다’는 원문이 남겨 둔 죽음 및 부활의 함의를 명시적 교리 진술로 바꾸지 않고 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:48:24Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 대조적 호격, 명령(‘가십시오’), 이어지는 미래 진술(‘쉬고… 일어서게 될 것입니다’)은 유지할 수 있습니다. 그러나 초안의 ‘세상의 끝날’은 הַיָּמִים(‘그 날들’)에 없는 ‘세상’을 추가하며, ‘정해진 몫을 따라’는 לְגֹרָלְךָ의 ‘당신에게 배정된 몫/분깃을 위해·받기 위해’라는 관계를 정확히 나타내지 못합니다. ‘끝까지 가야 합니다’도 원문의 직접 명령보다 의무 진술로 들립니다.
  naturalness: ‘그러나 당신은 끝으로 가십시오’는 현대 한국어 합쇼체에서 자연스럽고, 원문의 방향성 및 다소 절제된 표현을 보존합니다. ‘날들의 끝에’는 다소 문어적이지만 종말론적 관용구의 모호성을 보존하는 데 적절합니다. ‘당신에게 정해진 몫을 받기 위해 일어서게 될 것입니다’는 한국어로 자연스럽게 뜻을 전달하면서도 ‘일어서다’의 원어 어휘상을 유지합니다.
  terminology: גּוֹרָל은 ‘정해진 몫’으로 옮길 수 있으나 ‘따라’와 결합하면 의미가 달라집니다. לְקֵץ הַיָּמִין은 ‘세상의 끝날’로 특정하지 말고 ‘날들의 끝’으로 옮겨야 합니다. ‘쉬다’와 ‘일어서다’는 각각 죽음과 부활을 본문에서 과도하게 명시하지 않는 적절한 표현입니다.
