  text: וַ/אֲנִ֥י שָׁמַ֖עְתִּי וְ/לֹ֣א אָבִ֑ין וָ/אֹ֣מְרָ֔/ה אֲדֹנִ֕/י מָ֥ה אַחֲרִ֖ית אֵֽלֶּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
  footnotes:
  - marker: a
    text: Or “what is the end of these things?”
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 들었습니다만, 이해하지 못했습니다. 그래서 저는 말했습니다. 「내 주인이시여, 이 일들의 끝이 어떻게 되겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일들의 끝이 무엇이겠습니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: As for me
  chosen_korean: 저는
  alternatives_korean:
  - 그리고 저는
  - 하지만 저는
  lexicon: HALOT
  rationale: 문두의 독립 인칭대명사는 다니엘의 개인적 시점을 드러내므로, 한국어에서는 자연스러운 주제 표지인 ‘저는’으로 옮겨 강조를 살렸습니다.
- source_word: שָׁמַעְתִּי
  english_pob_choice: I heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다만
  - 들었지만
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 ‘듣다’이므로 청각적 수용을 직접적으로 표현했습니다.
- source_word: וְלֹא אָבִין
  english_pob_choice: but I did not understand
  chosen_korean: 이해하지 못했습니다
  alternatives_korean:
  - 알지 못했습니다
  - 깨닫지 못했습니다
  lexicon: HALOT
  rationale: בין은 이 문맥에서 단순 청취가 아니라 의미 파악의 실패를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘이해하다’를 택했습니다.
- source_word: מָה אַחֲרִית אֵלֶּה
  english_pob_choice: what will be the outcome of these things?
  chosen_korean: 이 일들의 끝이 어떻게 되겠습니까?
  alternatives_korean:
  - 이 일들의 결과가 어떻게 되겠습니까?
  - 이 일들의 끝은 무엇입니까?
  lexicon: HALOT
  rationale: אַחֲרִית는 ‘끝’과 ‘결말/귀결’을 모두 포괄할 수 있으므로, 종말론적 질문의 무게를 살리면서도 한국어로 자연한 ‘끝이 어떻게 되겠습니까?’로 옮겼습니다.
theological_decisions:
- issue: אֲדֹנִי의 호칭 처리
  chosen_reading: 천상의 해석자를 향한 존칭으로 읽고, ‘내 주인이시여’로 옮겼습니다.
  alternative_readings:
  - 하나님께 드리는 ‘주님’
  - 단순한 ‘선생님’
  rationale: 직접 문맥은 계시를 전달하는 존재에게 말하는 장면이므로, 신성을 단정하는 번역을 피하면서도 공손한 호칭을 유지했습니다.
  doctrine_reference: 원문 문맥 우선, 신학적 식별을 번역에서 과도하게 확정하지 않음
