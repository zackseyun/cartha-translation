  source_fidelity: 히브리어의 개인적 시점(וַאֲנִי), 들었으나 이해하지 못한 대조, 이어지는 발화, 그리고 ‘이 일들의 끝/귀결’에 관한 질문을 충실히 반영합니다. 다만 אֲדֹנִי를 ‘내 주인이시여’로 옮기면 현대 한국어에서 소유 관계의 ‘주인’을 강하게 뜻하여, 천상적 해석자에게 드리는 존칭이라는 원문의 기능을 좁히고 부자연스럽게 만듭니다.
  naturalness: ‘저는 들었습니다만’보다 ‘저는 들었지만’이 현대 문어 합쇼체에서 더 자연스럽고, 두 절의 공통 주어는 두 번째에서 생략해도 명료합니다. ‘내 주여’는 이 문맥의 격식 있는 호칭으로 자연하며, 신적 호칭인지 천상적 전달자인지를 번역이 과도하게 결정하지 않습니다.
