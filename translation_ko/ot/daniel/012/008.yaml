translation:
  language: ko
  text: 저는 들었지만 이해하지 못했습니다. 그래서 말했습니다. “내 주여, 이 일들의 끝[a]은 어떻게 되겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
