source:
  edition: WLC
  text: וּ/מֵ/עֵת֙ הוּסַ֣ר הַ/תָּמִ֔יד וְ/לָ/תֵ֖ת שִׁקּ֣וּץ שֹׁמֵ֑ם יָמִ֕ים אֶ֖לֶף מָאתַ֥יִם וְ/תִשְׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/011.yaml
  text: And from the time that the regular offering is removed and the abomination that desolates is set up[b][a], there will be 1,290 days.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the daily sacrifice.' The Hebrew תָּמִיד is a cultic shorthand for the regular/continual temple offering.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the abomination of desolation' or 'the desolating abomination.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 정기 제사[a]가 제거되고 황폐하게 하는 가증한 것[b]이 세워지는 때부터 1,290일이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘일일 제사’. 히브리어 תָּמִיד은 정기적·계속적인 성전 제사를 가리키는 축약 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘황폐의 가증한 것’, ‘황폐케 하는 가증한 것’.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵעֵת
  english_pob_choice: And from the time
  chosen_korean: 그리고 … 때부터
  alternatives_korean:
  - 그때부터
  - 그리고 그 시점부터
  lexicon: HALOT
  rationale: מִן + עֵת의 시간적 출발점을 살리면서, 한국어에서는 문맥을 자연스럽게 이어 주는 ‘그리고’와 ‘때부터’로 옮겼습니다.
- source_word: הוּסַר הַתָּמִיד
  english_pob_choice: the regular offering is removed
  chosen_korean: 정기 제사가 제거되고
  alternatives_korean:
  - 매일 드리는 제사가 제거되고
  - 상시 제사가 제거되고
  lexicon: HALOT
  rationale: תָּמִיד은 ‘일일 제사’라는 전통 번역보다, 본문이 가리키는 지속적/정기적 성격을 드러내는 ‘정기 제사’가 더 직접적이라고 보았습니다.
- source_word: שִׁקּוּץ שֹׁמֵם
  english_pob_choice: the abomination that desolates
  chosen_korean: 황폐하게 하는 가증한 것
  alternatives_korean:
  - 멸망시키는 가증한 것
  - 황폐케 하는 혐오스러운 것
  - 멸망의 가증한 것
  lexicon: HALOT
  rationale: שִׁקּוּץ의 강한 혐오·우상숭배 뉘앙스를 ‘가증한 것’으로 살리고, שֹׁמֵם의 분사적 기능은 ‘황폐하게 하는’으로 풀어 자연스러운 한국어로 옮겼습니다.
- source_word: יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים
  english_pob_choice: there will be 1,290 days
  chosen_korean: 1,290일이 될 것입니다
  alternatives_korean:
  - 1,290일이 있을 것입니다
  - 1,290일입니다
  lexicon: HALOT
  rationale: 히브리어의 짧은 결과 진술을 한국어 완결문으로 만들되, 예언적 문맥에 맞는 미래형을 유지했습니다.
theological_decisions:
- issue: שִׁקּוּץ שֹׁמֵם의 관용적 전통 번역 처리
  chosen_reading: 본문에는 의미를 직접 드러내는 ‘황폐하게 하는 가증한 것’을 두고, 전통적 관용구는 주석에서 대응하도록 합니다.
  alternative_readings:
  - ‘멸망의 가증한 것’
  - ‘황폐케 하는 가증한 것’
  rationale: 다니엘서의 전통적 표현을 무시하지 않으면서도, 현재 절의 히브리어 분사 כוח/기능을 한국어에서 분명히 보이게 하는 쪽이 본문 이해에 유익합니다.
  doctrine_reference: Translation philosophy §3, §5
