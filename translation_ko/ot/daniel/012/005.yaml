  source_fidelity: 원문의 וְרָאִיתִי אֲנִי דָנִיֵּאל은 다니엘의 1인칭 자기 지시와 새로운 환상을 보는 행위를 나타냅니다. 초안의 ‘나, 다니엘이’는 주격 조사가 이름에 붙어 동격 구성이 어색합니다. 또한 אֲחֵרִים은 정체를 특정하지 않으므로 ‘사람’보다 ‘이’가 안전합니다. 양쪽 강둑이라는 위치 대조는 유지되어야 합니다.
  naturalness: ‘강 이쪽/저쪽 언덕’은 뜻은 전달하지만 강의 bank에는 ‘기슭’이 더 자연스럽고 정확합니다. ‘나 다니엘이 보니’는 현대 성경 번역의 격식 있는 서술에서 자연스럽게 자기지시적 강조를 보존합니다.
  terminology: ‘다른 두 이’는 두 존재를 천사나 인간으로 규정하지 않아 원문 및 영어 POB의 중립성을 지킵니다. ‘기슭’은 שָׂפָה의 문맥상 ‘강둑/강가’를 적절히 옮깁니다.
  issues:
