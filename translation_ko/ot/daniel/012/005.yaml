id: DAN.12.5
reference: Daniel 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָאִ֨יתִי֙ אֲנִ֣י דָנִיֵּ֔אל וְ/הִנֵּ֛ה שְׁנַ֥יִם אֲחֵרִ֖ים עֹמְדִ֑ים אֶחָ֥ד הֵ֨נָּה֙ לִ/שְׂפַ֣ת הַ/יְאֹ֔ר וְ/אֶחָ֥ד הֵ֖נָּה לִ/שְׂפַ֥ת הַ/יְאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/005.yaml
  text: 'Then I[a], Daniel, looked, and behold, two others were standing: one on this bank of the river, and one on that bank of the river.'
  footnotes:
  - marker: a
    text: Or 'one on this side of the riverbank, and one on that side of the riverbank.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 나, 다니엘이 보았습니다. 보십시오, 또 다른 두 사람이 서 있었는데, 하나는 강 이쪽 언덕에, 하나는 강 저쪽 언덕에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강 이쪽/저쪽’은 문자적으로는 ‘강변의 이편/저편’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  english_pob_choice: Then I ... looked
  chosen_korean: 그때 나 ... 보았습니다
  alternatives_korean:
  - 그때 내가 보았습니다
  - 그리고 내가 보았습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진전을 살리기 위해 ‘그때’로 이어 주고, 시각적 장면 전환을 자연스럽게 나타내기 위해 ‘보았습니다’를 택했습니다.
- source_word: אֲנִי דָנִיֵּאל
  english_pob_choice: I, Daniel
  chosen_korean: 나, 다니엘
  alternatives_korean:
  - 저, 다니엘
  - 내가 다니엘
  lexicon: HALOT
  rationale: 명시적 1인칭 대명사와 이름의 자기지시적 강조를 살리기 위해 주어를 분리해 ‘나, 다니엘’로 옮겼습니다.
- source_word: שְׁנַיִם אֲחֵרִים
  english_pob_choice: two others
  chosen_korean: 또 다른 두 사람
  alternatives_korean:
  - 두 사람 더
  - 두 명의 다른 이들
  lexicon: HALOT
  rationale: עֹמְדִים과 결합된 인물 묘사이므로 한국어에서는 자연스럽게 ‘두 사람’으로 풀되, ‘אֲחֵרִים’의 구별성은 ‘또 다른’으로 반영했습니다.
- source_word: לִשְׂפַת הַיְאֹר
  english_pob_choice: on this bank / on that bank of the river
  chosen_korean: 강 이쪽 언덕에, 하나는 강 저쪽 언덕에
  alternatives_korean:
  - 강 이편 언덕에, 하나는 강 저편 언덕에
  - 강 이쪽 가장자리에, 하나는 강 저쪽 가장자리에
  lexicon: HALOT
  rationale: לִשְׂפַת는 문자적으로 ‘강가/강변’이지만, 대조되는 위치를 분명히 드러내기 위해 POB의 ‘this bank / that bank’를 따라 ‘이쪽/저쪽’ 표현을 사용했습니다.
theological_decisions:
- issue: 두 사람의 정체를 특정할지 여부
  chosen_reading: 본문이 말하는 그대로 ‘또 다른 두 사람’으로 두고, 천사 등으로 특정하지 않았습니다.
  alternative_readings:
  - 두 천사
  - 두 하늘 존재
  rationale: 히브리어 본문은 이 절에서 그들을 단지 ‘다른 둘’로만 제시하므로, 본문이 허용하는 범위를 넘는 신학적 특정은 피했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
