  text: And he said[a], “Go your way, Daniel, because the words are concealed and sealed until the time of the end.”
  footnotes:
  - marker: a
    text: Or “shut up and sealed.” The Hebrew uses two passive participles to describe the words as inaccessible until the appointed end.
