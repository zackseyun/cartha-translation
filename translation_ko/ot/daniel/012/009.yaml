  text: And he said[a], “Go your way, Daniel, because the words are concealed and sealed until the time of the end.”
  footnotes:
  - marker: a
    text: Or “shut up and sealed.” The Hebrew uses two passive participles to describe the words as inaccessible until the appointed end.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. “가십시오, 다니엘이여. 그 말들은 끝의 때까지 감추어져 있고 봉인되어 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리, “닫혀 있고 봉인되어 있다.” 히브리어는 두 수동 분사로 이 말들이 끝의 때까지 접근할 수 없는 상태임을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도 히브리어 wayyiqtol의 이어짐을 반영했습니다.
- source_word: לֵךְ
