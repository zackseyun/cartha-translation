translation:
  language: ko
  text: 그리고 그가 말했습니다. “가십시오, 다니엘이여. 그 말들은 끝의 때까지 감추어지고 봉인되어 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 수동 분사로 말씀들이 지금은 접근할 수 없는 상태임을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도 히브리어 wayyiqtol의 이어짐을 반영했습니다.
- source_word: לֵךְ
  english_pob_choice: Go your way
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 가십시오, 길을 가십시오
  lexicon: HALOT
  rationale: 직접 명령을 간결하게 살리되, 한국어에서 부자연스러운 관용구인 ‘네 길로 가라’식 표현은 피했습니다.
- source_word: סְתֻמִים וַחֲתֻמִים
  english_pob_choice: concealed and sealed
  chosen_korean: 감추어지고 봉인되어 있습니다
  alternatives_korean:
  - 닫혀 있고 봉인되어 있습니다
  - 숨겨지고 봉인되어 있습니다
  - 감추어지고 인봉되어 있습니다
  lexicon: HALOT
  rationale: 두 수동 분사를 각각 살려 접근 불가 상태를 나타냈습니다. ‘봉인되어 있습니다’는 חתם의 문서 봉인 이미지를 직접 반영합니다.
- source_word: עַד עֵת קֵץ
  english_pob_choice: until the time of the end
  chosen_korean: 끝의 때까지
  alternatives_korean:
  - 마지막 때까지
  - 끝의 시간까지
  - 종말의 때까지
  lexicon: HALOT
  rationale: 다니엘서의 종말론적 표현을 살리면서도 한국어에서 자연스럽게 읽히도록 직역과 관용을 절충했습니다.
theological_decisions:
