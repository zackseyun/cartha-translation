  naturalness: ‘그날에 나는 … 모든 사람을 벌하겠습니다’는 현대의 격식 있는 합쇼체로 자연스럽습니다. ‘자기 주인들의 집’은 다소 표시적인 표현이나, 원문의 복수성을 보존하면서 관계를 분명히 하는 안전한 표현입니다.
  terminology: ‘벌하겠습니다’, ‘문지방’, ‘폭력과 속임수’는 예언서 심판 문맥과 히브리어 어휘에 충실합니다. 문지방 관습의 정확한 의미는 확정하지 않았으며, ‘주인’은 신적 호칭으로 단정하지 않았습니다.
