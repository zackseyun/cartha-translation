id: ZEP.1.9
reference: Zephaniah 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָקַדְתִּ֗י עַ֧ל כָּל הַ/דּוֹלֵ֛ג עַל הַ/מִּפְתָּ֖ן בַּ/יּ֣וֹם הַ/ה֑וּא הַֽ/מְמַלְאִ֛ים בֵּ֥ית אֲדֹנֵי/הֶ֖ם חָמָ֥ס וּ/מִרְמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/009.yaml
  text: And on that day I will punish all who leap over the threshold[b][a], who fill their masters’ house with violence and deceit.
  footnotes:
  - marker: a
    text: Or 'who skip over the threshold.' The phrase may refer to a known ritual or superstitious practice, possibly echoing the threshold taboo in 1 Samuel 5:5; others take it more figuratively of aggressive intruders.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'their masters’ house'; some translations read 'their lord’s house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 나는 문지방을 뛰어넘어[a] 자기 주인들의 집을[b] 폭력과 속임수로 채우는 모든 사람을 벌하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문지방을 뛰어넘는’은 히브리어 표현을 문자적으로 옮긴 것입니다. 이는 알려진 의례나 미신적 관습을 가리킬 수 있으며 1사무엘 5:5의 문지방 금기와 관련된 것으로 보기도 합니다. 다른 견해로는 난폭하게 침입하는 자들을 비유적으로 가리킨다고 봅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 주인들의 집’입니다. 일부 번역은 이를 ‘그들의 주의 집’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  english_pob_choice: I will punish
  chosen_korean: 나는 벌하겠습니다
  alternatives_korean:
  - 나는 징벌하겠습니다
  - 나는 심판하겠습니다
  - 나는 그들을 찾아 물으겠습니다
  lexicon: HALOT
  rationale: 예언서 심판 문맥에서 פקד는 단순 방문보다 책임을 물어 벌하는 뜻이 분명하므로, 현대 한국어에서 자연스러운 ‘벌하다’로 옮겼습니다.
- source_word: הַדּוֹלֵג עַל הַמִּפְתָּן
  english_pob_choice: who leaps over the threshold
  chosen_korean: 문지방을 뛰어넘는
  alternatives_korean:
  - 문지방을 건너뛰는
  - 문지방을 뛰어오르는
  lexicon: HALOT
  rationale: 동사의 구체적 이미지를 살려 문자적으로 옮겼습니다. 본문이 암시할 수 있는 관습이나 미신을 본문 밖에서 풀지 않고 유지했습니다.
- source_word: בֵּית אֲדֹנֵיהֶם
  english_pob_choice: their masters’ house
  chosen_korean: 자기 주인의 집
  alternatives_korean:
  - 그들의 주인들의 집
  - 자기들의 주인 집
  - 그들의 주인의 집
  lexicon: HALOT
  rationale: 히브리어는 복수 형태이지만 한국어에서는 자연스럽게 관계를 드러내기 위해 ‘자기 주인’으로 옮겼습니다. 소유 관계의 사회적 뉘앙스를 살리되, 문맥상 불필요한 어색함은 피했습니다.
- source_word: חָמָס וּמִרְמָה
  english_pob_choice: with violence and deceit
  chosen_korean: 폭력과 속임수
  alternatives_korean:
  - 포악과 속임수
  - 폭행과 기만
  - 폭력과 기만
  lexicon: HALOT
  rationale: חָמָס와 מִרְמָה의 도덕적·사회적 악을 함께 드러내는 가장 직접적인 대응으로 ‘폭력과 속임수’를 선택했습니다. 두 명사의 병렬도 자연스럽게 유지됩니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언적 시간 공식을 현대 문장으로 간결하게 살리기 위해 ‘그날에’로 옮겼습니다.
theological_decisions:
- issue: ‘문지방을 뛰어넘는’ 표현의 처리
  chosen_reading: 본문의 낯선 이미지를 해설하지 않고 그대로 보존했습니다.
  alternative_readings:
  - 문지방 금기 같은 미신적 관습으로 구체화
  - 침입자나 약탈자의 비유로 풀어 번역
  rationale: 본문 자체가 그 관습의 의미를 설명하지 않으므로, 해석을 본문에 덧씌우기보다 독자가 원문 이미지의 긴장을 느끼도록 두는 것이 원문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘자기 주인’의 복수성
  chosen_reading: 히브리어 복수 소유 형태를 한국어에서 자연스럽게 처리하되, 사회적 착취 관계를 흐리지 않았습니다.
  alternative_readings:
  - 그들의 주인들의 집
  - 그들의 주인의 집
  rationale: 문법적으로는 복수 소유가 맞지만, 한국어에서는 ‘자기 주인’이 가장 자연스럽고 본문 문맥의 착취 구조도 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §1
