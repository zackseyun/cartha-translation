  source_fidelity: 원문의 아도나이 יְהוִה는 ‘여호와 주 하나님’처럼 세 호칭을 나열한 형태가 아니라, 신명 יְהוָה를 포함하는 복합 호칭입니다. 또한 קְרֻאָיו의 어휘 주석 표지는 해당 표현에 붙어야 합니다. 나머지 절의 제사 및 성별 이미지는 유지되어야 합니다.
  naturalness: ‘주 야훼’, ‘야훼의 날’, ‘제물을 마련하셨고’는 현대 표준 한국어 합쇼체에서 자연스럽고 엄숙한 예언서 문체를 유지합니다. ‘거룩하게 구별하셨습니다’는 הִקְדִּישׁ의 제의적 의미를 이해 가능한 한국어로 드러냅니다.
