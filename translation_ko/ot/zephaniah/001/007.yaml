id: ZEP.1.7
reference: Zephaniah 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ֕ס מִ/פְּנֵ֖י אֲדֹנָ֣/י יְהוִ֑ה כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה כִּֽי הֵכִ֧ין יְהוָ֛ה זֶ֖בַח הִקְדִּ֥ישׁ קְרֻאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/007.yaml
  text: Be silent before the Lord GOD[a], for the day of Yahweh is near; for Yahweh has prepared a sacrifice; he has consecrated his invited ones.
  footnotes:
  - marker: a
    text: Or 'his guests,' 'his summoned ones,' or 'his called ones.' In context, this likely refers to those whom the LORD has summoned for the sacrificial judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와 주 하나님[a] 앞에서 잠잠하십시오. 여호와의 날이 가깝습니다. 여호와께서 희생 제물을 준비하셨고, 그분이 초청하신 자들을 거룩하게 구별하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 손님들’, ‘그분이 소집하신 자들’, ‘그분이 부르신 자들’로 볼 수 있습니다. 문맥상 이는 재앙적 희생을 위해 여호와께서 소집하신 자들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַס
  english_pob_choice: Be silent
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 조용히 하십시오
  - 침묵하십시오
  - 잠잠하시오
  lexicon: HALOT
  rationale: 명령형의 엄숙하고 긴급한 침묵 요청을 현대 한국어로 자연스럽게 살리기 위해 ‘잠잠하십시오’를 택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와
  - 주 야훼
  - 주님 하나님
  lexicon: HALOT
  rationale: 합성 호칭의 경외감을 살리면서도 한국어에서 어색한 ‘주 여호와’의 중첩을 피하기 위해 ‘주 하나님’으로 옮겼습니다. 다만 본문은 야훼를 유지해야 하므로 주석으로 처리했습니다.
- source_word: זֶבַח
  english_pob_choice: a sacrifice
  chosen_korean: 희생 제물
  alternatives_korean:
  - 제사
  - 희생 제사
  - 희생물
  lexicon: HALOT
  rationale: 문맥상 단순한 제사 행위보다 재앙적 희생의 이미지를 드러내는 말이어서 ‘희생 제물’이 가장 직접적입니다.
- source_word: קְרֻאָיו
  english_pob_choice: his invited ones
  chosen_korean: 그분이 초청하신 자들
  alternatives_korean:
  - 그분의 초청자들
  - 그분이 부르신 자들
  - 그분의 손님들
  lexicon: HALOT
  rationale: 초대/호출의 수동적 의미를 살리되, 본문이 그 대상의 정체를 곧바로 규정하지 않으므로 ‘초청하신 자들’로 남겨 두었습니다.
theological_decisions:
- issue: YHWH의 표기와 호칭 결합
  chosen_reading: 본문에서는 ‘여호와’를 유지하고, 합성 호칭은 ‘주 하나님’으로 처리했습니다.
  alternative_readings:
  - 야훼 주 하나님
  - 주 여호와
  - 주님 주 하나님
  rationale: 원문의 신명(יהוה)을 본문에서 드러내면서도 한국어 문장 흐름을 자연스럽게 유지하기 위한 절충입니다. 합성 호칭의 긴박한 경외감은 살리고, 여호와/야훼 표기는 주석에서 설명합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH'
- issue: 희생 제물과 초청받은 자들의 정체를 본문에서 확정하지 않음
  chosen_reading: 제사적 이미지 자체를 보존하고, ‘초청하신 자들’의 정체는 본문에서 단정하지 않았습니다.
  alternative_readings:
  - 침략자들을 가리킨다고 분명히 밝히기
  - 희생될 자들로 직역하기
  - 손님으로 풀어쓰기
  rationale: 시적 압축과 신학적 긴장을 유지하기 위해, 원문이 드러내지 않는 해석을 본문에 덧붙이지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
