revisions:
- from: 그리고 야훼를 따르다가 돌아선 자들과, 야훼를 찾지 않고 그에게 묻지 않는 자들입니다.[a][b][c]
  to: 또한 야훼를 따르던 데서 돌아선 자들과, 야훼를 찾지도 않고 그에게 묻지도 않는 자들입니다.[a][b][c]
  rationale: The revision retains the supplied formal-polite sentence framing while making the coordination and the Hebrew idiom more natural and precise in Korean. It also strengthens the paired negation (‘찾지도 않고 … 묻지도 않는’) without imposing a theological distinction beyond the lexical contrast already present.
