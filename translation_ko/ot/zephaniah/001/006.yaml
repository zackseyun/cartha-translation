id: ZEP.1.6
reference: Zephaniah 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/נְּסוֹגִ֖ים מֵ/אַחֲרֵ֣י יְהוָ֑ה וַ/אֲשֶׁ֛ר לֹֽא בִקְשׁ֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א דְרָשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/006.yaml
  text: and those who turn back from following Yahweh[c][b][a], and who do not seek Yahweh or inquire of him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH.'
    reason: alternative_reading
  - marker: b
    text: Or 'those who draw back from following the LORD.'
    reason: lexical_alternative
  - marker: c
    text: The final clause may also be rendered 'and have not sought him,' using a broader sense of 'inquire/seek' for the Hebrew verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼를 따르다가 돌아선 자들과, 야훼를 찾지 않고 그에게 묻지 않는 자들입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 고유명사 YHWH는 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘야훼를 따르다가 돌아선 자들’은 직역하면 ‘야훼 뒤에서 물러난 자들’이라는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 ‘그에게 묻지 않은’보다 더 넓은 의미로 ‘그를 찾지 않은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּסוֹגִים
  english_pob_choice: those who turn back
  chosen_korean: 돌아선 자들
  alternatives_korean:
  - 물러선 자들
  - 뒤로 물러간 자들
  - 배교한 자들
  lexicon: HALOT
  rationale: נסוג/סוג의 핵심은 뒤로 물러나거나 돌아서는 움직임이므로, 현대 한국어로 자연스럽고 문맥의 배반 뉘앙스를 살릴 수 있는 ‘돌아선 자들’을 택했습니다.
- source_word: מֵאַחֲרֵי יְהוָה
  english_pob_choice: from following Yahweh
  chosen_korean: 야훼를 따르다가
  alternatives_korean:
  - 야훼 뒤를 떠나
  - 야훼를 뒤로하고
  - 야훼를 따르던 길에서
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘뒤에서 떠남’은 단순한 위치가 아니라 추종을 그만두는 뜻이므로, 한국어에서는 ‘따르다’를 살려 제자도/언약적 추종의 이미지를 보존했습니다.
- source_word: בִקְשׁוּ ... דְרָשֻׁהוּ
  english_pob_choice: seek ... inquire of him
  chosen_korean: 찾지 않고 그에게 묻지 않는
  alternatives_korean:
  - 구하지 않고 그에게 묻지 않는
  - 찾지 않고 그를 찾지 않는
  - 구하지도 않고 찾지도 않는
  lexicon: HALOT
  rationale: 두 동사를 모두 ‘찾다’로 처리하면 반복이 되지만, 드러나는 의미 차이가 약해집니다. 따라서 בקש는 ‘찾다’, דרש는 하나님께 나아가 확인·의탁하는 뜻을 살려 ‘묻다’로 구분했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 본문은 하나님의 고유명사를 직접 사용하므로, 관습적 호칭인 ‘주님’ 대신 신명기적 언약 이름을 드러내는 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: ‘seek’와 ‘inquire of him’의 구분
  chosen_reading: ‘찾지’와 ‘묻지’로 구분해, 야훼를 향한 적극적 추구와 그분께 의탁해 확인하는 행위를 함께 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘찾지’로 통일
  - 둘 다 ‘구하지’로 통일
  rationale: 예언서의 병렬은 언약적 무관심을 중첩해 강조하므로, 한국어에서도 두 동사의 의미를 지나치게 평준화하지 않는 것이 좋습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5 (consistency of key terms, or documented exception)'
