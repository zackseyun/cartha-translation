source:
  edition: WLC
  text: וַ/הֲצֵרֹ֣תִי לָ/אָדָ֗ם וְ/הָֽלְכוּ֙ כַּֽ/עִוְרִ֔ים כִּ֥י לַֽ/יהוָ֖ה חָטָ֑אוּ וְ/שֻׁפַּ֤ךְ דָּמָ/ם֙ כֶּֽ/עָפָ֔ר וּ/לְחֻמָ֖/ם כַּ/גְּלָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/017.yaml
  text: And I will bring distress on mankind[a], and they will walk like the blind, because they have sinned against Yahweh; their blood will be poured out like dust[b], and their flesh like dung.
  footnotes:
  - marker: a
    text: Or 'humankind.' The Hebrew 'man' is singular but collective in sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'their entrails' / 'their bowels,' reflecting a more specific understanding of the Hebrew term.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 사람에게 고통을 내리겠으므로 그들이 눈먼 사람들처럼 걸을 것이니, 그들이 야훼께 죄를 지었기 때문이다. 그들의 피는 먼지처럼 쏟아지고, 그들의 살은 배설물처럼 될 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사람’은 단수형이지만 집합적인 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 장기들’ / ‘그들의 창자들’. 히브리어 표현을 더 구체적으로 이해한 경우입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצֵרֹתִי
  english_pob_choice: I will bring distress
  chosen_korean: 내가 … 고통을 내리겠으므로
  alternatives_korean:
  - 내가 … 환난을 주겠으므로
  - 내가 … 괴롭게 하겠으므로
  lexicon: HALOT
  rationale: צרר의 사역형은 단순한 감정보다 압박과 재난을 주는 행위를 가리키므로, ‘고통을 내리다’가 심판적 강도를 유지합니다.
- source_word: לָאָדָם
  english_pob_choice: mankind
  chosen_korean: 사람에게
  alternatives_korean:
  - 인류에게
  - 인간에게
  lexicon: HALOT
  rationale: 히브리어 אָדָם은 여기서 집합적 의미로 쓰였으므로, 한국어에서는 자연스럽게 ‘사람에게’로 옮겨 대표성과 보편성을 살렸습니다.
- source_word: כַּעִוְרִים
  english_pob_choice: like the blind
  chosen_korean: 눈먼 사람들처럼
  alternatives_korean:
  - 소경들처럼
  - 맹인들처럼
  lexicon: HALOT
  rationale: 비유적 집합 표현을 살리면서도 현대 한국어에서 직관적인 표현을 택했습니다. ‘맹인’보다 서술 문맥에 덜 관용적입니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 원문 고유명과 예언자적 언약 어조를 보존했습니다.
- source_word: וְשֻׁפַּךְ דָּמָם
  english_pob_choice: their blood will be poured out
  chosen_korean: 그들의 피는 … 쏟아지고
  alternatives_korean:
  - 그들의 피는 … 부어지고
  - 그들의 피는 … 흘러내리고
  lexicon: HALOT
  rationale: שפך + דם의 관용적 폭력 심판 이미지를 ‘쏟아지다’로 직역성 있게 살렸습니다.
- source_word: כַּגְּלָלִים
  english_pob_choice: like dung
  chosen_korean: 배설물처럼
  alternatives_korean:
  - 똥처럼
  - 거름처럼
  lexicon: HALOT
  rationale: גללים은 직설적으로는 배설물을 뜻하지만, 현대 공적 문체에서는 ‘배설물’이 원어의 혐오감과 낮아짐을 전달하면서도 과도한 구어성을 피합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 구절은 심판 선언 속에서 언약 이름을 직접 사용하므로, 일반 호칭보다 고유한 신명 표기를 유지하는 것이 원문의 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה / YHWH → 야훼'
- issue: אָדָם의 집합적 의미
  chosen_reading: 사람에게
  alternative_readings:
  - 인류에게
  - 인간에게
  rationale: 단수형이지만 집합적 의미라는 주석을 한국어 본문에서 과도하게 성별화하지 않으면서도 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
