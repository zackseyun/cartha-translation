  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 원문 고유명과 예언자적 언약 어조를 보존했습니다.
- source_word: וְשֻׁפַּךְ דָּמָם
  english_pob_choice: their blood will be poured out
  chosen_korean: 그들의 피는 … 쏟아지고
  alternatives_korean:
  - 그들의 피는 … 부어지고
  - 그들의 피는 … 흘러내리고
  lexicon: HALOT
  rationale: שפך + דם의 관용적 폭력 심판 이미지를 ‘쏟아지다’로 직역성 있게 살렸습니다.
- source_word: כַּגְּלָלִים
  english_pob_choice: like dung
  chosen_korean: 배설물처럼
  alternatives_korean:
