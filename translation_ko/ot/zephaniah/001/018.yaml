source:
  edition: WLC
  text: גַּם כַּסְפָּ֨/ם גַּם זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה וּ/בְ/אֵשׁ֙ קִנְאָת֔/וֹ תֵּאָכֵ֖ל כָּל הָ/אָ֑רֶץ כִּֽי כָלָ֤ה אַךְ נִבְהָלָה֙ יַֽעֲשֶׂ֔ה אֵ֥ת כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/018.yaml
  text: Neither their silver nor their gold will be able to deliver them on the day of Yahweh’s wrath[a], and in the fire of his jealousy all the earth will be consumed; for he will make a complete, indeed sudden[c][b], end of all the inhabitants of the earth.
  footnotes:
  - marker: a
    text: Or 'all the land' / 'all the inhabitants of the land.' Hebrew אֶרֶץ can mean either 'land' or 'earth'; the broader sense is adopted here because of the verse’s sweeping judgment language.
    reason: alternative_reading
  - marker: b
    text: Or 'by the fire of his zeal.' The Hebrew noun can mean 'jealousy' or 'zeal'; 'jealousy' is retained in the main text to preserve the covenantal nuance.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'a complete, indeed sudden, end' reflects a difficult Hebrew expression. Alternatives include 'a full, terrifying end' or 'a complete end—yes, a dreadful one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 은도 그들의 금도 야훼의 분노의 날[a]에 그들을 건져 내지 못할 것입니다. 그분의 질투의 불길[b]에 온 땅이 삼켜질 것이니, 이는 그분께서 땅의 모든 주민을 완전히, 참으로 갑작스럽게 멸망시키실[c] 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅 전체’/‘그 땅의 모든 주민’. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘온 세상’을 뜻할 수 있습니다. 이 절의 전면적인 심판 어조를 따라 본문에서는 넓은 의미를 취했습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분의 열심의 불’. 히브리어 קִנְאָה는 ‘질투’와 ‘열심’을 모두 뜻할 수 있으나, 언약적 배타성을 살리기 위해 본문에서는 ‘질투’를 유지했습니다.
    reason: lexical_alternative
  - marker: c
    text: 난해한 히브리어 표현을 반영한 번역입니다. 대안으로는 ‘완전한, 참으로 두려운 끝’ 또는 ‘완전한 끝—참으로 끔찍한 끝’도 가능합니다.
    reason: lexical_alternative
