  lexicon: HALOT
  rationale: אֶרֶץ는 ‘땅’과 ‘지구/온 세상’을 모두 가질 수 있으나, 반복되는 전면적 심판 표현을 살려 ‘온 땅’과 ‘땅의 모든 주민’으로 자연스럽게 연결했습니다.
- source_word: כָּלָה אַךְ נִבְהָלָה יַעֲשֶׂה
