  rationale: 문맥의 누적 표현이 심판의 범위를 넓게 그리므로, 즉각적 역사 배경을 해치지 않으면서도 총체성을 드러내는 ‘온 땅’이 적절합니다.
  doctrine_reference: 'English audit: Scope of הָאָרֶץ in this verse'
