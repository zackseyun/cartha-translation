  rationale: עֶבְרָה는 예언서의 심판 맥락에서 ‘분노’보다도 ‘진노’/‘격노’가 가능하지만, 본문 흐름에서 가장 직접적인 감정-심판 표현을 살려 ‘분노’로 옮겼습니다.
- source_word: קִנְאָתוֹ
  english_pob_choice: his jealousy
  chosen_korean: 그의 질투
  alternatives_korean:
  - 그의 열심
  - 그의 열정
  lexicon: HALOT
  rationale: 언약적 배타성을 드러내는 קִנְאָה의 기본 긴장을 살리기 위해, 완곡한 ‘열심’보다 직설적인 ‘질투’를 선택했습니다.
- source_word: כָּל הָאָרֶץ / כָּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all the earth / all the inhabitants of the earth
  chosen_korean: 온 땅 / 땅의 모든 주민
  alternatives_korean:
  - 온 땅 / 온 땅의 주민들
