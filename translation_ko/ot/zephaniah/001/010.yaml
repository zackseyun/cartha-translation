source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה ק֤וֹל צְעָקָה֙ מִ/שַּׁ֣עַר הַ/דָּגִ֔ים וִֽ/ילָלָ֖ה מִן הַ/מִּשְׁנֶ֑ה וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/הַ/גְּבָעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/010.yaml
  text: And on that day[a], declares Yahweh, there will be the sound of a cry from the Fish Gate, and a wail from the Second Quarter[c][b], and a great crash from the hills.
  footnotes:
  - marker: a
    text: Or 'the sound of an outcry.'
    reason: lexical_alternative
  - marker: b
    text: The 'Second Quarter' was likely a district of Jerusalem; Hebrew 'Mishneh.'
    reason: cultural_note
  - marker: c
    text: Or 'a great destruction' or 'a great breaking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 물고기 문에서는 부르짖는 소리가 나고[a], 제2구역에서는 통곡 소리가 들리며[b], 언덕들에서는 큰 붕괴가 일어날 것이라고 야훼께서 선언하십니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외침의 소리’.
    reason: lexical_alternative
  - marker: b
    text: ‘제2구역’은 아마 예루살렘의 한 구역을 가리킵니다. 히브리어는 ‘미슈네(Mishneh)’입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘큰 파괴’ 또는 ‘큰 파열’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה / בַּיּוֹם הַהוּא
  english_pob_choice: there will be / on that day
  chosen_korean: 그날에 … 일어날 것입니다
  alternatives_korean:
  - 그날에 … 있습니다
  - 그날에 … 될 것입니다
  lexicon: HALOT
  rationale: 예언적 미래 공식을 한국어로 자연스럽게 살리면서, 뒤따르는 소리·통곡·무너짐의 연속을 담기 위해 ‘일어날 것입니다’를 선택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언서의 공식을 현대 한국어 합쇼체로 옮기되, 본문 속 발화 표지를 분명히 하기 위해 ‘말씀입니다’를 썼습니다.
- source_word: קוֹל צְעָקָה
  english_pob_choice: the sound of a cry
  chosen_korean: 외치는 소리
  alternatives_korean:
  - 부르짖는 소리
  - 통곡 소리
  lexicon: HALOT
  rationale: 히브리어의 ‘소리/외침’ 결합을 살리면서도 한국어에서 더 자연스러운 관용으로 옮겼습니다. 단순한 감정 표현보다 경고성 있는 외침의 뉘앙스를 유지합니다.
- source_word: מִשַּׁעַר הַדָּגִים / מִן הַמִּשְׁנֶה
  english_pob_choice: from the Fish Gate / from the Second Quarter
  chosen_korean: 물고기 문 / 제2구역
  alternatives_korean:
  - 어문(魚門) / 둘째 구역
  - 물고기 성문 / 제2지구
  lexicon: HALOT
  rationale: 두 표현 모두 예루살렘의 지명으로 보이므로, 영어 POB의 지시를 따라 장소명으로 처리했습니다. ‘제2구역’은 히브리어 Mishneh의 지리적 기능을 드러냅니다.
- source_word: וִילָלָה
  english_pob_choice: a wail
  chosen_korean: 통곡이
  alternatives_korean:
  - 애곡이
  - 울부짖음이
  lexicon: HALOT
  rationale: 재난·심판 맥락에서 강한 애도와 절규를 뜻하는 말로, 한국어에서는 ‘통곡’이 가장 직접적이고 자연스럽습니다.
- source_word: וְשֶׁבֶר גָּדוֹל
  english_pob_choice: a great crash
  chosen_korean: 큰 무너짐
  alternatives_korean:
  - 큰 파괴
  - 큰 붕괴
  lexicon: HALOT
  rationale: שבר는 파괴, 부서짐, 붕괴를 아우르지만, 본문이 소리의 연쇄를 이루므로 ‘무너짐’이 파괴와 청각적 충격을 함께 살립니다.
theological_decisions:
