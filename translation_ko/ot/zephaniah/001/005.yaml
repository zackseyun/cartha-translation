  source_fidelity: 현 번역은 지붕 위의 천체 숭배자와 여호와 및 밀곰을 함께 두고 맹세하는 자들을 ‘곧’으로 연결하여 동일 집단으로 한정합니다. 히브리어는 וְאֶת의 반복으로 두 대상을 병렬로 열거하므로 이를 분리해야 합니다. 또한 본절은 앞 절의 ‘끊어 버리겠다’에 딸린 목적어 연속이므로 종결 표현 ‘입니다’는 원문에 없는 서술을 더합니다.
