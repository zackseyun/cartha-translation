id: ZEP.1.5
reference: Zephaniah 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁתַּחֲוִ֥ים עַל הַ/גַּגּ֖וֹת לִ/צְבָ֣א הַ/שָּׁמָ֑יִם וְ/אֶת הַ/מִּֽשְׁתַּחֲוִים֙ הַ/נִּשְׁבָּעִ֣ים לַֽ/יהוָ֔ה וְ/הַ/נִּשְׁבָּעִ֖ים בְּ/מַלְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/005.yaml
  text: those who bow down on the rooftops to the host of heaven[a], and those who bow down, who swear by Yahweh and swear by Milcom.
  footnotes:
  - marker: a
    text: Or 'by their king'; some understand the name here as 'Molech.'
    reason: alternative_reading
translation:
  language: ko
  text: 지붕들 위에서 하늘의 군대에게 절하는 자들, 곧 여호와를 두고 맹세하면서 밀곰을 두고 맹세하는 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 왕’을 뜻할 수 있습니다. 어떤 이들은 이 이름을 ‘몰렉’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּשְׁתַּחֲוִים
  english_pob_choice: those who bow down
  chosen_korean: 절하는 자들
  alternatives_korean:
  - 엎드려 경배하는 자들
  - 경배하는 자들
  lexicon: HALOT
  rationale: שׁחה의 기본 동작인 몸을 굽혀 절함을 살리면서, 문맥상 우상 숭배의 행위임도 드러나게 했습니다.
- source_word: עַל הַגַּגּוֹת
  english_pob_choice: on the rooftops
  chosen_korean: 지붕들 위에서
  alternatives_korean:
  - 옥상에서
  - 지붕 위에서
  lexicon: HALOT
  rationale: 히브리어의 복수형을 살려 '지붕들'로 옮기고, 장소 부사구는 직설적으로 처리했습니다.
- source_word: לִצְבָא הַשָּׁמַיִם
  english_pob_choice: to the host of heaven
  chosen_korean: 하늘의 군대에게
  alternatives_korean:
  - 하늘의 군상에게
  - 하늘 군대에게
  lexicon: HALOT
  rationale: צָבָא הַשָּׁמַיִם은 천체를 신격화한 대상에 대한 표현이므로, 문자적이면서도 우상 숭배의 대상임이 드러나는 '하늘의 군대'를 택했습니다.
- source_word: הַנִּשְׁבָּעִים לַיהוָה
  english_pob_choice: who swear by the LORD
  chosen_korean: 여호와를 두고 맹세하는 자들
  alternatives_korean:
  - 여호와의 이름으로 맹세하는 자들
  - 여호와께 맹세하는 자들
  lexicon: HALOT
  rationale: ל + יהוה의 맹세 관용구를 한국어 관용에 맞게 '~을 두고 맹세하다'로 옮겨, 맹세의 대상/근거를 드러냈습니다.
- source_word: בְּמַלְכָּם
  english_pob_choice: by Milcom
  chosen_korean: 밀곰을 두고
  alternatives_korean:
  - 그들의 왕을 두고
  - 몰렉을 두고
  lexicon: HALOT
  rationale: 본문의 자음형은 암몬 신 밀곰으로 읽는 해석이 문맥에 가장 잘 맞으므로 본문에는 고유명사를 유지했습니다.
theological_decisions:
- issue: בְּמַלְכָּם의 정체
  chosen_reading: 본문에는 밀곰을 두고 맹세하는 것으로 옮기고, 대안 해석은 각주로 보존합니다.
  alternative_readings:
  - 그들의 왕
  - 몰렉
  rationale: 예언자는 여호와와 또 다른 충성의 대상에 대한 혼합적 맹세를 책망하고 있으므로, 신격 이름으로 읽는 것이 대칭과 문맥을 가장 잘 설명합니다. 다만 자음형이 다른 이해도 허용하므로 단정적으로 소거하지 않도록 했습니다.
  doctrine_reference: '번역 원칙 §3: 문서화된 긴장을 보존하고 함부로 해소하지 않기'
- issue: 여호와의 표기
  chosen_reading: 고유명사 יהוה는 본문에서 여호와로 표기했습니다.
  alternative_readings:
  - 야훼
  rationale: 이 프로젝트의 기본 표기는 여호와이므로, 본문에서는 그 표기를 유지하되 학술적 대안은 번역 관례상 별도 처리하지 않았습니다.
  doctrine_reference: 프로젝트 표준 용례
