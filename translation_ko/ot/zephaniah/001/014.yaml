id: ZEP.1.14
reference: Zephaniah 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָר֤וֹב יוֹם יְהוָה֙ הַ/גָּד֔וֹל קָר֖וֹב וּ/מַהֵ֣ר מְאֹ֑ד ק֚וֹל י֣וֹם יְהוָ֔ה מַ֥ר צֹרֵ֖חַ שָׁ֥ם גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/014.yaml
  text: 'The great day of Yahweh is near—near and coming very quickly. The sound of the day of Yahweh: there the warrior cries out bitterly.'
  footnotes:
  - marker: a
    text: Or 'The voice of the day of the LORD'; Hebrew qol can mean 'sound,' 'voice,' or 'noise.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the mighty man cries out bitterly there.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 큰 날이 가깝습니다—가깝고도 매우 빠르게 다가옵니다. 야훼의 날의 소리! 거기서 용사는 쓰라리게 부르짖습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 날의 목소리’일 수 있습니다. 히브리어 qol은 ‘소리’, ‘목소리’, ‘잡음’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거기서 힘센 사람이 쓰라리게 부르짖습니다.’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문이 신명기적 고유명 יְהוָה를 직접 쓰므로, 프로젝트 기본어인 ‘야훼’를 사용해 신적 호칭이 아니라 고유명을 드러냈습니다.
- source_word: קָרוֹב
  english_pob_choice: is near
  chosen_korean: 가깝습니다
  alternatives_korean:
  - 가까이 있습니다
  - 임박했습니다
  lexicon: HALOT
  rationale: 반복되는 임박성을 한국어로 자연스럽게 살리기 위해 ‘가깝습니다’를 택했습니다.
- source_word: וּמַהֵר מְאֹד
  english_pob_choice: and coming very quickly
  chosen_korean: 매우 빠르게 다가옵니다
  alternatives_korean:
  - 매우 급히 다가옵니다
  - 아주 빨리 오고 있습니다
  lexicon: HALOT
  rationale: ‘빠르게’와 ‘다가옵니다’로 속도와 접근의 두 요소를 함께 살려, 시간적 임박성을 과장 없이 전달했습니다.
- source_word: קוֹל
  english_pob_choice: The sound of
  chosen_korean: 소리
  alternatives_korean:
  - 목소리
  - 외침
  lexicon: HALOT
  rationale: קוֹל이 ‘소리/목소리/소음’을 모두 가질 수 있으므로, 여기서는 의미를 좁히지 않는 ‘소리’로 두었습니다.
- source_word: גִּבּוֹר
  english_pob_choice: the warrior
  chosen_korean: 용사
  alternatives_korean:
  - 힘센 사람
  - 전사
  lexicon: HALOT
  rationale: 문맥상 심판 앞에서 무너지는 전투적 인물을 가리키므로, 한국어에서 자연스럽고 강한 이미지의 ‘용사’로 옮겼습니다.
- source_word: מַר צֹרֵחַ
  english_pob_choice: cries out bitterly
  chosen_korean: 쓰라리게 부르짖습니다
  alternatives_korean:
  - 비참하게 외칩니다
  - 쓴소리로 부르짖습니다
  lexicon: HALOT
  rationale: מַר의 감정적 고통을 ‘쓰라리게’로, צֹרֵחַ의 강한 울부짖음을 ‘부르짖습니다’로 옮겨 절망의 음성을 살렸습니다.
theological_decisions:
- issue: ‘야훼의 날’의 예언적 위기감 전달
  chosen_reading: ‘야훼의 큰 날’과 ‘매우 빠르게 다가옵니다’로 임박한 심판의 긴박함을 살렸습니다.
  alternative_readings:
  - ‘야훼의 날’
  - ‘야훼의 크고 두려운 날’
  rationale: 히브리어는 ‘큰 날’과 ‘매우 빠름’을 나란히 두어 심판의 중대성과 임박성을 강조하므로, 한국어도 두 축을 모두 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
