  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵילִ֖ילוּ יֹשְׁבֵ֣י הַ/מַּכְתֵּ֑שׁ כִּ֤י נִדְמָה֙ כָּל עַ֣ם כְּנַ֔עַן נִכְרְת֖וּ כָּל נְטִ֥ילֵי כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/011.yaml
  text: Wail[a], inhabitants of the Mortar, for all the merchant people are destroyed[b]; all who weigh out silver are cut off.
  footnotes:
  - marker: a
    text: Hebrew Maktesh, literally 'mortar'; likely the name of a market district in Jerusalem, perhaps so called because of its hollow shape or bustling trade.
    reason: alternative_reading
  - marker: b
    text: Or 'all the people of Canaan.' Here 'Canaan' is likely used in the sense of 'merchant(s),' a known Hebrew usage in commercial contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 「마곳에 사는 주민들아, 통곡하십시오. 모든 상인 백성이 망하였고, 은을 달아 주는 자들이 모두 끊어졌습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마크테쉬(Maktesh), 문자적으로는 ‘절구’입니다. 아마도 예루살렘의 한 시장 지구 이름으로, 그 움푹한 지형이나 상업 활동 때문에 그렇게 불렸을 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘가나안의 모든 백성’. 여기서는 ‘가나안’이 상인들을 뜻하는 말로 쓰였을 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 통곡하십시오
  alternatives_korean:
  - 애곡하십시오
  - 울부짖으십시오
  lexicon: HALOT
  rationale: 예언적 심판 문맥의 강한 애곡 명령을 공손한 합쇼체로 살리기 위해 ‘통곡하십시오’를 택했습니다.
- source_word: הַמַּכְתֵּשׁ
  english_pob_choice: the Mortar
  chosen_korean: 마곳
  alternatives_korean:
  - 마절구
  - 메크테쉬
  lexicon: HALOT
  rationale: 어근의 문자적 의미인 ‘절구’보다 지명적 용법을 살려 본문에는 지명처럼 처리하고, 현대 한국어에서 낯선 직역을 피했습니다.
- source_word: כָּל עַם כְּנַעַן
  english_pob_choice: all the merchant people
  chosen_korean: 모든 상인 백성
  alternatives_korean:
  - 가나안의 온 백성
  - 모든 상인들
  lexicon: HALOT
  rationale: ‘가나안’이 상인/무역상이라는 관용적 뜻으로 쓰인 점을 반영해, 집합명사 ‘백성’을 유지하면서 상업적 의미를 분명히 했습니다.
- source_word: כָּל נְטִילֵי כָסֶף
  english_pob_choice: all who weigh out silver
  chosen_korean: 은을 달아 주는 자들
  alternatives_korean:
  - 은을 저울질하는 자들
  - 은을 취급하는 자들
  lexicon: HALOT
  rationale: 문맥상 단순 소지가 아니라 거래를 위해 은을 계량하는 사람들을 가리키므로 ‘달아 주는’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 심판 명령의 한국어 문체
  chosen_reading: 직설적 경고를 유지하되, 본문 바깥의 해설을 넣지 않고 명령형을 그대로 살렸습니다.
  alternative_readings:
  - 완곡한 호소형
  - 설명적 문장형
  rationale: 히브리어 명령 ‘הֵילִילוּ’의 긴박한 심판 음성을 약화하지 않기 위해 직접 명령을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 예언서의 심판 선포와 청중 소환 방식
- issue: ‘כְּנַעַן’의 의미 범주
  chosen_reading: 지명 ‘가나안’보다 직업명 ‘상인’의 의미를 본문 의미로 반영했습니다.
  alternative_readings:
  - 가나안 사람들
  - 가나안의 백성
  rationale: 영문 POB의 주석처럼 상업 맥락에서 ‘가나안’이 상인을 뜻하는 용례가 있어, 문맥상 의미를 우선하는 번역이 필요합니다.
  doctrine_reference: 어휘의 관용적 의미와 본문 문맥 우선 원칙
