  source_fidelity: 본문의 ‘마곳’은 히브리어 הַמַּכְתֵּשׁ(Maktesh)와 연결되는 통용 가능한 음역으로 보기 어렵고, 주석의 ‘마크테쉬’와도 불일치합니다. 또한 각주 표지가 해당 어구가 아니라 문장 끝에 함께 놓여 있어 대안 독법의 범위가 불명확합니다. ‘은을 달아 주는’은 거래 상대에게 은을 건네는 뜻으로도 읽혀, 은을 계량하는 행위를 더 분명히 나타낼 필요가 있습니다.
  naturalness: ‘마크테쉬에 사는 주민들아’와 ‘통곡하십시오’는 현대 표준 한국어의 예언적 합쇼체로 자연스럽습니다. ‘은을 달아 재는 자들’은 상업적 계량 행위를 명료하고 자연스럽게 전달합니다.
