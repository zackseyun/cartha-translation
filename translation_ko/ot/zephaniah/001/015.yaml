id: ZEP.1.15
reference: Zephaniah 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: י֥וֹם עֶבְרָ֖ה הַ/יּ֣וֹם הַ/ה֑וּא י֧וֹם צָרָ֣ה וּ/מְצוּקָ֗ה י֤וֹם שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה י֥וֹם חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/015.yaml
  text: That day is a day of wrath[a], a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom[c][b], a day of clouds and thick darkness.
  footnotes:
  - marker: a
    text: Or 'a day of fury' for 'a day of wrath.'
    reason: lexical_alternative
  - marker: b
    text: '''Ruin and devastation'' may also be rendered ''desolation and destruction.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'a day of cloud and thick darkness'; the Hebrew uses singular nouns in a poetic sequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날은 분노의 날입니다[a]. 곤란과 괴로움의 날이며, 파멸과 황폐의 날[b], 어둠과 캄캄함의 날[c], 구름과 짙은 흑암의 날입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘격노의 날’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파멸과 황폐’는 ‘황폐와 멸망’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘캄캄함’은 히브리어의 점층적 표현을 살린 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: י֥וֹם עֶבְרָ֖ה
  english_pob_choice: a day of wrath
  chosen_korean: 분노의 날
  alternatives_korean:
  - 진노의 날
  - 격노의 날
  lexicon: HALOT
  rationale: עֶבְרָה는 넘쳐흐르는 격한 분노를 가리키므로, 예언서 심판 문맥에서 가장 자연스럽고 무게 있는 대응인 ‘분노’로 옮겼습니다.
- source_word: צָרָ֣ה וּמְצוּקָ֗ה
  english_pob_choice: distress and anguish
  chosen_korean: 곤란과 괴로움
  alternatives_korean:
  - 고통과 압박
  - 환난과 고통
  lexicon: HALOT
  rationale: 두 명사는 압박 아래 놓인 고통 상태를 중첩적으로 묘사하므로, 한국어에서도 의미를 구분해 ‘곤란’과 ‘괴로움’으로 병렬해 긴박감을 살렸습니다.
- source_word: שֹׁאָה וּמְשׁוֹאָה
  english_pob_choice: ruin and devastation
  chosen_korean: 파멸과 황폐
  alternatives_korean:
  - 황폐와 멸망
  - 재난과 파괴
  lexicon: HALOT
  rationale: 두 단어는 서로 유사하지만 반복·강조의 시적 누적을 이루므로, ‘파멸’과 ‘황폐’로 두 겹의 붕괴 이미지를 살렸습니다.
- source_word: חֹשֶׁךְ וַאֲפֵלָה
  english_pob_choice: darkness and gloom
  chosen_korean: 어둠과 캄캄함
  alternatives_korean:
  - 어둠과 짙은 어둠
  - 흑암과 암흑
  lexicon: HALOT
  rationale: 첫째는 일반적 ‘어둠’, 둘째는 더 짙은 농도의 ‘캄캄함’으로 구분해 히브리어의 점층 구조를 자연스러운 현대어로 반영했습니다.
- source_word: עָנָן וַעֲרָפֶל
  english_pob_choice: clouds and thick darkness
  chosen_korean: 구름과 짙은 흑암
  alternatives_korean:
  - 구름과 깊은 어둠
  - 구름과 암운
  lexicon: HALOT
  rationale: עָנָן은 단수적 시형이지만 한국어에서는 집합적 ‘구름’이 자연스럽고, עֲרָפֶל은 신현적 뉘앙스를 살려 ‘짙은 흑암’으로 옮겼습니다.
theological_decisions:
- issue: ‘그 날’의 범위와 종말론적 확정 여부
  chosen_reading: 반복되는 ‘~의 날’ 구조를 야훼의 심판의 날로 유지하되, 특정 역사 사건이나 최종 종말로 단정하지 않았습니다.
  alternative_readings:
  - 유다에 대한 임박한 역사적 심판으로만 읽기
  - 최종 종말 심판으로만 읽기
  rationale: 히브리어는 시적으로 판단의 성격을 누적할 뿐 범위를 스스로 한정하지 않으므로, 본문의 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
