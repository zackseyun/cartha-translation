id: ZEP.1.4
reference: Zephaniah 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָטִ֤יתִי יָדִ/י֙ עַל יְהוּדָ֔ה וְ/עַ֖ל כָּל יוֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/הִכְרַתִּ֞י מִן הַ/מָּק֤וֹם הַ/זֶּה֙ אֶת שְׁאָ֣ר הַ/בַּ֔עַל אֶת שֵׁ֥ם הַ/כְּמָרִ֖ים עִם הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/004.yaml
  text: And I will stretch out my hand against Judah and against all the inhabitants of Jerusalem[a], and I will cut off from this place the remnant of Baal, the name of the idolatrous priests along with the priests[b],
  footnotes:
  - marker: a
    text: Or 'the memory of the idolatrous priests.' Hebrew 'the name of the idolatrous priests' is an idiom for removing even their remembrance.
    reason: lexical_alternative
  - marker: b
    text: '''Idolatrous priests'' renders Hebrew kemarim, a term for pagan or syncretistic priests, distinguished here from the ordinary ''priests.'''
    reason: cultural_note
translation:
  language: ko
  text: “내가 유다와 예루살렘의 모든 주민을 향해 내 손을 뻗고, 이곳에서 바알의 남은 것과 우상 숭배 제사장들의 이름[a]을 제사장들과 함께 끊어 버리겠습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘우상 숭배 제사장들의 이름’은 그들의 기억까지 지워 버린다는 관용 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘우상 숭배 제사장들’은 일반 제사장과 구별되는 이교적 또는 혼합주의적 제사장들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָטִיתִי יָדִי
  english_pob_choice: I will stretch out my hand
  chosen_korean: 손을 뻗어
  alternatives_korean:
  - 손을 내밀어
  - 손을 들어
  lexicon: HALOT
  rationale: 심판 행위를 뜻하는 관용구를 직역에 가깝게 살리되, 한국어에서는 자연스럽게 ‘손을 뻗어’로 옮겼습니다.
- source_word: עַל יְהוּדָה וְעַל כָּל יוֹשְׁבֵי יְרוּשָׁלָם
  english_pob_choice: against Judah and against all the inhabitants of Jerusalem
  chosen_korean: 유다와 예루살렘의 모든 주민에게
  alternatives_korean:
  - 유다와 예루살렘의 모든 거주자들에게
  - 유다와 예루살렘의 모든 사람들에게
  lexicon: HALOT
  rationale: עַל의 적대적 방향을 한국어 조사로 과도하게 반복하지 않고, 심판의 대상임을 문맥상 분명히 했습니다.
- source_word: שְׁאָר הַבַּעַל
  english_pob_choice: the remnant of Baal
  chosen_korean: 바알의 남은 것
  alternatives_korean:
  - 바알의 남은 자
  - 바알의 남은 흔적
  lexicon: HALOT
  rationale: ‘남은 것’은 바알 숭배의 잔존물을 가리키는 압축된 표현을 비교적 그대로 살립니다.
- source_word: שֵׁם הַכְּמָרִים
  english_pob_choice: the name of the idolatrous priests
  chosen_korean: 우상 숭배하는 제사장들의 이름
  alternatives_korean:
  - 우상 제사장들의 이름
  - 카마림의 이름
  - 그 우상 숭배 제사장들의 명칭
  lexicon: HALOT
  rationale: כְּמָרִים의 의미를 독자에게 드러내기 위해 해석어를 쓰되, ‘이름’이라는 히브리어 관용을 유지했습니다.
- source_word: עִם הַכֹּהֲנִים
  english_pob_choice: along with the priests
  chosen_korean: 제사장들과 함께
  alternatives_korean:
  - 제사장들과 더불어
  - 제사장들과 더해서
  lexicon: HALOT
  rationale: כֹּהֲנִים은 일반 제사장을 가리키므로 별도 구분이 드러나도록 앞의 ‘우상 숭배하는 제사장들’과 대비시켰습니다.
theological_decisions:
- issue: כְּמָרִים과 כֹּהֲנִים의 구별
  chosen_reading: ‘우상 숭배하는 제사장들’과 ‘제사장들’을 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘제사장들’로 통일
  - כְּמָרִים을 음역해 ‘카마림’으로 표기
  rationale: 본문의 심판 대상이 두 부류로 나뉜다는 점을 살려야 하므로, 단순 평준화보다 의미 차이를 드러내는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: ‘이름’의 관용적 삭제
  chosen_reading: ‘이름’을 본문에 그대로 두어 완전한 제거의 이미지를 살렸습니다.
  alternative_readings:
  - 기억까지 없애다
  - 흔적까지 없애다
  rationale: 히브리어 관용어의 강도를 완화하지 않고, 심판의 전면성을 한국어 독자에게도 보이게 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
