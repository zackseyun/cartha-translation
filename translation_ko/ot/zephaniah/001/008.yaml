id: ZEP.1.8
reference: Zephaniah 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ זֶ֣בַח יְהוָ֔ה וּ/פָקַדְתִּ֥י עַל הַ/שָּׂרִ֖ים וְ/עַל בְּנֵ֣י הַ/מֶּ֑לֶךְ וְ/עַ֥ל כָּל הַ/לֹּבְשִׁ֖ים מַלְבּ֥וּשׁ נָכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/008.yaml
  text: And on the day of Yahweh’s sacrifice[a], I will punish the officials, the king’s sons[c][b], and all who wear foreign clothing.
  footnotes:
  - marker: a
    text: Or 'the sacrifice of the LORD'; the phrase may also evoke a sacrificial feast prepared by the LORD in judgment (cf. Zeph 1:7).
    reason: lexical_alternative
  - marker: b
    text: '''Officials'' may also be rendered ''princes'' or ''rulers.'''
    reason: lexical_alternative
  - marker: c
    text: That is, garments associated with foreign peoples; the expression may imply adoption of foreign customs or loyalties, not merely non-native fabric.
    reason: cultural_note
translation:
  language: ko
  text: 야훼의 희생 제사 날에 나는 관원들과 왕의 아들들과 외국 옷을 입는 모든 사람을 벌할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ''주님의 제사''; 이 표현은 야훼께서 심판을 위해 마련하신 제의적 희생 잔치를 암시할 수도 있습니다(참조: 스바냐 1:7).'
    reason: lexical_alternative
  - marker: b
    text: '''관원들''은 ''방백들'' 또는 ''통치자들''로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: 곧 외국 사람들과 연관된 의복을 가리키며, 단지 비토착 직물만이 아니라 외국 관습이나 충성의 채택을 함의할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton을 고유명으로 드러내기 위해 '야훼'를 사용했습니다. '주님'은 호칭으로 완화되고, '여호와'는 학술적 일관성보다 교회 전통을 우선합니다.
- source_word: זֶבַח
  english_pob_choice: the LORD’s sacrifice
  chosen_korean: 희생 제사
  alternatives_korean:
  - 제사
  - 희생의 제사
  - 희생 잔치
  lexicon: HALOT
  rationale: 문맥상 심판을 위한 제의적 희생을 가리키므로, 단순한 '제사'보다 희생의 성격을 드러내는 '희생 제사'가 더 가깝습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관원들
  alternatives_korean:
  - 공직자들
  - 통치자들
  - 방백들
  lexicon: HALOT
  rationale: שׂרים는 고위 통치 계층을 가리키며, 여기서는 '관원들'이 행정적·정치적 지위를 비교적 중립적으로 전달합니다.
- source_word: וּפָקַדְתִּי עַל
  english_pob_choice: I will punish
  chosen_korean: 벌할 것입니다
  alternatives_korean:
  - 징벌할 것입니다
  - 심판을 내릴 것입니다
  - 문책할 것입니다
  lexicon: HALOT
  rationale: פקד + על의 심판 문맥은 단순 방문이 아니라 punitive visitation이므로, 현대 한국어에서 직접적이고 자연스러운 '벌하다'를 선택했습니다.
- source_word: מַלְבּוּשׁ נָכְרִי
  english_pob_choice: foreign clothing
  chosen_korean: 외국 옷
  alternatives_korean:
  - 외국 의복
  - 이방의 옷
  - 외래 복장
  lexicon: HALOT
  rationale: 외국 사람들과 연관된 복장을 뜻하므로 직역에 가깝게 옮겼습니다. '외국 옷'은 문자적이지만 현대 독자가 이해 가능한 표현입니다.
theological_decisions:
- issue: 야훼의 희생 제사 표현이 단순 제의인지 심판 잔치인지
  chosen_reading: 본문은 야훼께서 예비하신 심판의 제의적 희생을 가리키는 표현으로 읽고, 한국어에는 '희생 제사'를 두어 양가성을 남겼습니다.
  alternative_readings:
  - 야훼의 제사
  - 야훼가 마련하신 희생 잔치
  rationale: 직전 절의 심판 이미지와 연결되므로, 단순한 종교 의례로 환원하지 않고 제의와 심판의 긴장을 함께 보존하는 것이 본문 취지에 맞습니다.
  doctrine_reference: ZEP.1.7-8 문맥 주해; judgment-sacrifice motif
