id: ZEP.1.13
reference: Zephaniah 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה חֵילָ/ם֙ לִ/מְשִׁסָּ֔ה וּ/בָתֵּי/הֶ֖ם לִ/שְׁמָמָ֑ה וּ/בָנ֤וּ בָתִּים֙ וְ/לֹ֣א יֵשֵׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/לֹ֥א יִשְׁתּ֖וּ אֶת יֵינָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/013.yaml
  text: Their wealth will become plunder[a], and their houses a desolation; they will build houses but not inhabit them[b], and plant vineyards but not drink their wine.
  footnotes:
  - marker: a
    text: Or 'their goods' or, less likely in this context, 'their strength/army' for 'their wealth.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their houses a desolation,' a compact expression meaning their houses will become ruined and deserted.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 재산은 노획물이 되고, 그들의 집들은 황무지가 될 것입니다. 그들은 집을 짓겠지만 거기에 살지 못하고, 포도원을 심겠지만 그들의 포도주를 마시지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֵיל은 문맥에 따라 ‘재산’, ‘부’, ‘힘’, ‘군사력’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 집들은 황무지/황폐’라는 압축 표현으로, 집들이 폐허가 되고 버려질 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  english_pob_choice: their wealth
  chosen_korean: 그들의 재산
  alternatives_korean:
  - 그들의 부
  - 그들의 소유
  - 그들의 힘
  lexicon: HALOT
  rationale: חֵיל는 문맥에 따라 재산, 자원, 힘, 군사력까지 가리킬 수 있으나, 이 절의 심판 선포와 평행 구조에서는 소유물 전체를 가리키는 ‘재산’이 가장 자연스럽습니다.
- source_word: לִמְשִׁסָּה
  english_pob_choice: plunder
  chosen_korean: 노획물이
  alternatives_korean:
  - 약탈물이
  - 전리품이
  - 노략물이
  lexicon: HALOT
  rationale: ‘노획물’은 약탈로 빼앗긴 것을 분명히 드러내면서도 현대 한국어에서 지나치게 구어적이지 않아 본문의 심판 이미지를 잘 살립니다.
- source_word: וּבָתֵּיהֶם לִשְׁמָמָה
  english_pob_choice: and their houses a desolation
  chosen_korean: 그들의 집들은 황무지가 될 것입니다
  alternatives_korean:
  - 그들의 집들은 황폐함이 될 것입니다
  - 그들의 집들은 황무함이 될 것입니다
  - 그들의 집들은 폐허가 될 것입니다
  lexicon: HALOT
  rationale: לִשְׁמָמָה의 결과 상태를 한국어에서 가장 자연스럽게 풀어 ‘황무지가 될 것입니다’로 옮겼습니다. 명사구의 압축성을 한국어로 그대로 살리기보다 의미를 분명히 드러냈습니다.
- source_word: וְלֹא יֵשֵׁבוּ
  english_pob_choice: but not live in them
  chosen_korean: 거기에 살지 못하고
  alternatives_korean:
  - 그 안에 거하지 못하고
  - 그 안에 살지 못하고
  - 거기에서 거주하지 못하고
  lexicon: HALOT
  rationale: ישב는 ‘살다/거주하다/거하다’의 뜻이 있지만, 집을 짓는 행위와의 대비를 살리기 위해 현대 한국어의 자연스러운 표현인 ‘살지 못하고’를 택했습니다.
- source_word: וְלֹא יִשְׁתּוּ אֶת יֵינָם
  english_pob_choice: but not drink their wine
  chosen_korean: 그들의 포도주를 마시지 못할 것입니다
  alternatives_korean:
  - 그들의 술을 마시지 못할 것입니다
  - 그 포도주를 마시지 못할 것입니다
  - 그들이 빚은 포도주를 마시지 못할 것입니다
  lexicon: HALOT
  rationale: ‘포도주’는 원문이 가리키는 포도원의 소산을 분명히 반영합니다. 소유 대명사도 원문의 소유 관계를 유지하기 위해 그대로 살렸습니다.
