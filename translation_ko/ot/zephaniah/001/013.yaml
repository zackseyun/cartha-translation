  rationale: 히브리어 동사 형태가 예언 맥락에서 미래 지시로 기능하므로, 한국어 독자가 심판의 전망을 즉시 이해하도록 미래형을 택했습니다.
  doctrine_reference: 예언문맥의 시제 관례
