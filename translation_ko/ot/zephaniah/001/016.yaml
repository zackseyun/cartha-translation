source:
  edition: WLC
  text: י֥וֹם שׁוֹפָ֖ר וּ/תְרוּעָ֑ה עַ֚ל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וְ/עַ֖ל הַ/פִּנּ֥וֹת הַ/גְּבֹהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/016.yaml
  text: a day of trumpet and battle cry against the fortified cities and against the high battlements[a][b].
  footnotes:
  - marker: a
    text: Or "a day of trumpet and alarm" or "a day of trumpet and shouting." The Hebrew term translated "battle cry" can denote a loud shout, alarm signal, or war cry; the military sense is favored by the context of attack on fortified cities.
    reason: lexical_alternative
  - marker: b
    text: Literally "the high corners." This likely refers to elevated corner fortifications or corner towers of city walls.
    reason: lexical_alternative
translation:
  language: ko
  text: 나팔과 전투 함성의 날, 곧 견고한 성읍들과 높은 성곽 위를 향한 날입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘나팔과 함성/경보’로도 옮길 수 있습니다. 여기서는 성읍 공격의 문맥을 따라 군사적 의미를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘높은 모퉁이들’입니다. 이는 성벽의 높은 모퉁이 방어 시설이나 망대를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹם
  english_pob_choice: a day of
  chosen_korean: …의 날
  alternatives_korean:
  - 날
  - …하는 날
  lexicon: HALOT
  rationale: 문맥상 야훼의 심판 날을 이어지는 명사구로 묘사하므로, 자연스러운 한국어로 ‘…의 날’ 구조를 유지했습니다.
- source_word: שׁוֹפָר
  english_pob_choice: trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 트럼펫
  - 쇼파르
  lexicon: HALOT
  rationale: 의례·경보용 뿔나팔을 가리키므로, 한국어 성경에서 널리 쓰이며 의미도 전달하는 ‘나팔’을 택했습니다.
- source_word: תְרוּעָה
  english_pob_choice: battle cry
  chosen_korean: 전투 함성
  alternatives_korean:
  - 함성
  - 경보
  - 전쟁 함성
  lexicon: HALOT
  rationale: 문맥이 요새화된 성읍들을 향한 공격이므로 단순한 외침보다 군사적 울림이 드러나는 ‘전투 함성’이 적절합니다.
- source_word: הַפִּנּוֹת הַגְּבֹהוֹת
  english_pob_choice: the high battlements
  chosen_korean: 높은 성곽
  alternatives_korean:
  - 높은 모퉁이들
  - 높은 성곽의 모퉁이
  - 높은 방어 시설
  lexicon: HALOT
  rationale: 직역하면 ‘높은 모퉁이들’이지만, 성벽의 돌출된 방어 지점이나 모퉁이 망대류를 가리키는 문맥이어서 한국어로는 과도한 특정화 없이 ‘높은 성곽’으로 옮겼습니다.
theological_decisions:
- issue: 심판의 날을 전쟁 경보의 이미지로 제시하는 표현
  chosen_reading: ‘나팔과 전투 함성의 날’로 옮겨 심판의 급박성과 공격성을 살렸습니다.
  alternative_readings:
  - ‘나팔과 경보의 날’
  - ‘나팔과 전쟁 함성의 날’
  rationale: 본문은 포위전과 성읍 공격의 맥락 안에 있으므로, 단순한 의식적 소리보다 군사적·심판적 긴장감을 유지하는 것이 소스의 힘을 더 잘 반영합니다.
  doctrine_reference: 스바냐 1장 문맥의 야훼 심판 선언
