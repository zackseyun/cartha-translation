reference: Zephaniah 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל צְפַנְיָה֙ בֶּן כּוּשִׁ֣י בֶן גְּדַלְיָ֔ה בֶּן אֲמַרְיָ֖ה בֶּן חִזְקִיָּ֑ה בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֥לֶךְ יְהוּדָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/001.yaml
  text: 'The word of Yahweh that came to Zephaniah son of Cushi[a], son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon[b], king of Judah:'
  footnotes:
  - marker: a
    text: Hezekiah may refer to King Hezekiah, which would make Zephaniah of royal descent, but the text itself does not explicitly identify him as the king.
    reason: cross_reference
  - marker: b
    text: Cushi can also be understood as 'Cushite,' but here it is rendered as a personal name within the genealogy.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀은 유다의 왕 아몬의 아들 요시야 시대에 구시의 아들, 그달랴의 아들, 아마랴의 아들, 히스기야의 아들 스바냐에게 임했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히스기야는 히스기야 왕을 가리킬 수도 있지만, 본문은 그를 왕으로 분명히 밝히지는 않습니다.
    reason: cross_reference
  - marker: b
    text: 구시는 '구스 사람'으로도 이해할 수 있지만, 여기서는 족보 안의 개인 이름으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말씀
  - 야훼께서 하신 말씀
  lexicon: HALOT
  rationale: 예언서 서문의 정형구를 따라 דְּבַר־יְהוָה를 '…의 말씀'으로 옮기되, יְהוָה는 프로젝트 기본값에 따라 '야훼'로 처리했습니다.
- source_word: אֲשֶׁר הָיָה אֶל
  english_pob_choice: that came to
  chosen_korean: …에게 임했습니다
  alternatives_korean:
  - …에게 임했습니다
  - …에게 이르렀습니다
  - …에게 왔습니다
  lexicon: HALOT
  rationale: 예언적 계시가 선지자에게 '임하다/이르다'는 한국어 관용이 히브리어 관용구를 자연스럽게 살리므로, 단순한 물리적 이동보다 계시 도달의 뉘앙스를 살렸습니다.
- source_word: כּוּשִׁי
  english_pob_choice: Cushi
  chosen_korean: 구시
  alternatives_korean:
  - 쿠시
  - 구시 사람
  lexicon: HALOT
  rationale: 족보 안에서 인명으로 기능하므로 고유명사 음역을 따르되, 한국어 표기 관행에 맞춰 '구시'로 옮겼습니다.
- source_word: חִזְקִיָּה
  english_pob_choice: Hezekiah
  chosen_korean: 히스기야
  alternatives_korean:
  - 히즈기야
  - 히즈키야
  lexicon: HALOT
  rationale: 성경 인명으로 정착된 한국어 음역을 따랐습니다. 본문이 그를 왕으로 명시하지 않으므로 이름만 유지했습니다.
- source_word: בִּימֵי יֹאשִׁיָּהוּ בֶן אָמֹון מֶלֶךְ יְהוּדָה
  english_pob_choice: in the days of Josiah son of Amon, king of Judah
  chosen_korean: 유다 왕 아몬의 아들 요시야의 시대에
  alternatives_korean:
  - 유다 왕 아몬의 아들 요시야의 때에
  - 유다 왕 아몬의 아들 요시야의 시대에
  lexicon: HALOT
  rationale: בִּימֵי는 '…의 시대에/때에'로 자연스럽게 옮길 수 있으며, 왕의 통치 시기를 가리키는 문맥이므로 '시대에'를 택했습니다.
theological_decisions:
- issue: 히스기야의 신원 암시
  chosen_reading: 본문에는 단지 '히스기야'라는 이름만 두고, 왕 히스기야로 단정하는 해석은 본문 밖의 정보로 처리했습니다.
  alternative_readings:
  - 히스기야를 왕 히스기야로 명시하기
  - 족보 주석에서만 왕실 연관 가능성을 언급하기
  rationale: 히브리어는 그의 칭호를 제시하지 않으므로, 번역 본문에서는 역사적 가능성을 확정하지 않고 이름의 문법적 기능을 그대로 보존하는 것이 더 충실합니다.
  doctrine_reference: 원문 우선, 본문이 말하지 않는 역사적 확정은 번역 본문에 삽입하지 않음
