  text: I will utterly sweep away everything from the face of the earth[a], declares Yahweh.
  footnotes:
  - marker: a
    text: 'Or ''I will completely remove everything from the face of the ground/land.'' The Hebrew uses an emphatic verbal construction: literally, ''Gathering, I will gather away.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 땅의 표면에서 모든 것을 완전히 쓸어버리겠다[a]—야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅/토지의 표면에서 모든 것을 완전히 제거하겠다.’ 히브리어는 강조적 동사구를 사용하며, 문자적으로는 ‘거두어, 내가 거두어버리겠다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֹף אָסֵף
  english_pob_choice: I will utterly sweep away
  chosen_korean: 완전히 쓸어버리겠다
  alternatives_korean:
  - 완전히 제거하겠다
  - 모두 거둬가겠다
  - 철저히 없애겠다
  lexicon: HALOT
  rationale: 부정적 심판 맥락에서 히브리어의 강조적 동사구가 단순한 ‘거두어 모음’이 아니라 전면적 제거를 뜻하므로, 반복 강조와 파괴성을 함께 드러내는 표현을 택했습니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the earth
  chosen_korean: 땅의 표면에서
  alternatives_korean:
  - 땅 위에서
  - 땅의 얼굴에서
  - 땅에서
  lexicon: HALOT
  rationale: ‘face of’의 관용을 한국어로 자연스럽게 옮기되, 원문의 표면/지면 이미지를 살려 ‘땅의 표면’으로 렌더링했습니다.
- source_word: הָאֲדָמָה
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅/토지
  - 땅덩이
  - 지면
  lexicon: HALOT
  rationale: POB의 ‘earth’는 여기서 보편적 심판 범위를 나타내지만, 한국어에서는 장중함을 유지하면서도 ‘땅’이 ‘지면’보다 더 자연스럽고 문맥상 포괄적입니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: —야훼의 말씀입니다
  alternatives_korean:
  - —야훼께서 선언하십니다
  - —야훼의 선언입니다
  - —야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 공식문을 한국어에서 가장 분명하게 살리기 위해 ‘말씀입니다’로 처리했고, 고유명사 יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와 대신 야훼로 표기하는 하나님의 이름
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 원문에 직접 나타난 언약적 신명(神名)을 존칭 대체어가 아니라 음역으로 보존하여, 원문이 가진 고유명사성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
