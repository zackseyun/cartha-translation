  source_fidelity: 개정이 필요합니다. 히브리어는 ‘걸림돌들’과 ‘악인들’을 심판의 대상으로 연이어 제시하며, 둘 사이의 정확한 관계는 압축되어 있습니다. 초안의 ‘악인들과 함께 하는 걸림돌들’은 걸림돌이 악인과 동반한다는 수식 관계를 확정하여 원문의 압축성과 목적어 병렬을 충분히 반영하지 못합니다. 이를 ‘걸림돌들과 악인들을’로 옮겨 두 대상을 함께 심판하신다는 뜻을 보존하되, 원문이 명시하지 않는 관계는 부가하지 않았습니다. 또한 반복되는 אָסֵף의 선언을 한국어에서도 독립된 반복으로 유지했습니다.
  naturalness: ‘땅의 표면’은 문어적이지만 현대 한국어 성경 문체에서 자연스럽고, מֵעַל פְּנֵי הָאֲדָמָה의 공간적 관용구를 잘 반영합니다. 요청된 현대 합쇼체에 맞추어 미래 선언과 인용 종결을 ‘-겠습니다’와 ‘말씀입니다’로 통일했습니다. 각주 표지도 해당 낱말 바로 뒤로 옮겼습니다.
  terminology: ‘야훼’, ‘사람’, ‘짐승’, ‘걸림돌’, ‘끊어 버리다’는 각각 יְהוָה, אָדָם, בְּהֵמָה, מַכְשֵׁלוֹת, הִכְרַתִּי의 의미와 예언적 심판 문맥에 적절합니다. ‘걸림돌’은 ‘넘어지게 하는 것’이라는 대안 번역을 각주로 유지합니다.
