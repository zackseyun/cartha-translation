    rationale: 히브리어의 ‘걸림돌들 אֶת 악인들’은 해석상 난점이 있으나, ‘함께 하는’은 걸림돌의 성격을 특정합니다. 한국어 병렬 목적어는 양자를 심판 대상에 포함하면서 논쟁적인 관계를 강제하지 않습니다.
