base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/003.yaml
  text: I will sweep away man and beast[a]; I will sweep away the birds of the heavens and the fish of the sea, and the stumbling blocks with the wicked[d][c][b]. And I will cut off man from the face of the ground,” declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'humankind.' Hebrew 'man' (אָדָם) is used here in a collective sense for humanity.
    reason: lexical_alternative
  - marker: b
    text: Or 'the birds of the sky.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the causes of stumbling' for 'the stumbling blocks.'
    reason: lexical_alternative
  - marker: d
    text: Or 'from the face of the earth.' Hebrew 'ground' may intentionally echo earlier judgment language.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 사람과 짐승을 쓸어버리겠습니다[a]. 내가 하늘의 새들[b]과 바다의 물고기들과 걸림돌들[c]과 악인들을 쓸어버리겠습니다. 또 내가 사람을 땅의 표면에서 끊어 버리겠습니다[d]. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류.’ 여기의 ‘사람’은 אָדָם의 집합적 용법을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘의 새들.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘넘어지게 하는 것들.’
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘땅의 얼굴에서.’ 히브리어는 앞선 심판 표현을 의도적으로 메아리칠 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֵף
  english_pob_choice: I will sweep away
  chosen_korean: 쓸어버리겠다
  alternatives_korean:
  - 거두어버리겠다
  - 제거하겠다
  - 완전히 없애겠다
  lexicon: HALOT
  rationale: 심판 문맥의 אָסֵף는 단순한 ‘모으다’보다 제거·소거의 힘이 강하므로, 반복되는 행위를 한국어로도 강하게 살리기 위해 ‘쓸어버리다’를 택했습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  - 남자
  lexicon: HALOT
  rationale: 여기서는 짐승과 병렬되고 뒤에서 다시 총칭으로 반복되므로, 대표적 인류를 가리키는 뜻을 살리되 현대 한국어에서 자연스러운 ‘사람’으로 옮겼습니다.
- source_word: הַמַּכְשֵׁלוֹת אֶת הָרְשָׁעִים
  english_pob_choice: the stumbling blocks with the wicked
  chosen_korean: 악인들과 함께 하는 걸림돌들
  alternatives_korean:
  - 악인들과 함께 있는 걸림돌들
  - 악인과 더불어 있는 걸림돌들
  - 악인들의 걸림돌들
  lexicon: HALOT
  rationale: POB의 ‘with the wicked’는 히브리어의 압축된 연결을 드러내기 위해 부드러운 동반 관계로 처리했으며, ‘걸림돌들’은 מקור의 장애·넘어짐 유발 물건/요인을 직접 반영합니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: from the face of the ground
  chosen_korean: 땅의 표면에서
  alternatives_korean:
  - 땅의 얼굴에서
  - 땅 위에서
  - 땅의 지면에서
  lexicon: HALOT
  rationale: 직역적 ‘얼굴’은 한국어에서 부자연스러워, 히브리어 관용구의 공간감을 유지하면서도 문어체로 자연스러운 ‘땅의 표면에서’를 사용했습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 언약적 고유명을 ‘야훼’로 옮겨 신학적 식별성을 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 심판의 총체성 표현
  chosen_reading: 쓸어버리겠다 / 끊어버리겠다
  alternative_readings:
  - 제거하겠다 / 없애겠다
  - 멸망시키겠다
  rationale: 본문은 피조물 범주 전체와 인간을 포괄하는 종말론적 심판을 말하므로, 완전한 제거의 강도를 약화시키지 않는 동사를 선택했습니다.
  doctrine_reference: Translation philosophy §4; source context of prophetic judgment
