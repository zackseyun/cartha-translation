  - 너를 학대하는 자들
  lexicon: HALOT
  rationale: ענה의 ‘괴롭히다/압제하다’ 범위를 반영하되, 여성 단수 مخاط자에 대한 직접호칭을 자연스럽게 살렸습니다.
- source_word: הַצֹּלֵעָה / הַנִּדָּחָה
  english_pob_choice: the lame / the outcast
  chosen_korean: 저는 자와 쫓겨난 자
  alternatives_korean:
  - 절뚝거리는 자와 내쫓긴 자
  - 다리를 저는 자와 추방된 자
  lexicon: HALOT
  rationale: 히브리어 여성형 단수의 집합적/의인화 효과를 유지하면서, POB의 해석처럼 공동체 전체의 약함과 추방을 함께 드러냈습니다.
- source_word: וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם
  english_pob_choice: I will make them a praise and a name
  chosen_korean: 그들을 찬양과 명성으로 삼겠습니다
  alternatives_korean:
  - 그들을 찬양과 이름으로 삼겠습니다
  - 그들을 찬송과 명예로 삼겠습니다
  lexicon: HALOT
  rationale: ‘make them’의 변형된 신분 선언을 살리되, ‘a name’은 한국어에서 더 자연스러운 ‘명성’으로 옮겼습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in every land
  chosen_korean: 모든 땅에서
  alternatives_korean:
  - 온 땅에서
  - 온 나라에서
  lexicon: HALOT
  rationale: 포로·산포 맥락에서 분배적 의미를 살려 ‘모든 땅’으로 옮겼습니다.
theological_decisions:
- issue: 회복의 역전 구조
  chosen_reading: 수치를 당하던 자리 자체가 찬양과 명성의 자리로 뒤바뀝니다.
  alternative_readings:
  - 단순히 명예를 회복한다
  - 수치만 제거한다
  rationale: 본문은 단순 복구가 아니라 수치의 장소/상태가 긍정적 정체성으로 전환되는 역전을 말하므로, 그 변화를 드러내는 방향을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
