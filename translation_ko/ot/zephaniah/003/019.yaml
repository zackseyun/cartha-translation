  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֥י עֹשֶׂ֛ה אֶת כָּל מְעַנַּ֖יִ/ךְ בָּ/עֵ֣ת הַ/הִ֑יא וְ/הוֹשַׁעְתִּ֣י אֶת הַ/צֹּלֵעָ֗ה וְ/הַ/נִּדָּחָה֙ אֲקַבֵּ֔ץ וְ/שַׂמְתִּי/ם֙ לִ/תְהִלָּ֣ה וּ/לְ/שֵׁ֔ם בְּ/כָל הָ/אָ֖רֶץ בָּשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/019.yaml
  text: Behold[a], at that time I will deal with all your oppressors, and I will save the lame and gather the outcast[d][c][b], and I will make them a praise and a name in every land where they were put to shame.
  footnotes:
  - marker: a
    text: Or 'those who afflict you.' The Hebrew verb can denote afflicting, oppressing, or humbling.
    reason: lexical_alternative
  - marker: b
    text: Or 'the one who limps' and 'the one driven away'; the Hebrew uses feminine singular forms, likely personifying the afflicted community.
    reason: lexical_alternative
  - marker: c
    text: Or 'in all the earth.'
    reason: lexical_alternative
  - marker: d
    text: The final phrase is difficult Hebrew; it may also be understood more literally as 'in their shame.' The translation follows the contextual sense, 'where they were put to shame.'
    reason: textual_variant
translation:
  language: ko
  text: 보십시오. 그때에 내가 너의 모든 압제자들에게 조치를 취하겠습니다.[a] 다리를 저는 자들과 쫓겨난 자들을 구원하고 모으며,[b] 그들이 수치를 당하던 모든 땅에서 그들이 찬양과 명성이 되게 하겠습니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너를 괴롭히는 자들’ 또는 ‘너를 낮추는 자들’로도 옮길 수 있습니다. 동사는 괴롭히다, 압제하다, 낮추다의 의미 범위를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘절뚝거리는 이’와 ‘쫓겨난 이’를 뜻하는 여성 단수형을 사용합니다. 이는 고통받는 공동체를 의인화한 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘온 땅에서’.
    reason: lexical_alternative
  - marker: d
    text: 마지막 표현은 난해합니다. 더 문자적으로는 ‘그들의 수치 가운데서’로 이해할 수 있으며, 본문은 문맥에 따라 ‘그들이 수치를 당하던 모든 땅에서’로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
