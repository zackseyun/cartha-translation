  to: 보십시오. 그때에 내가 너의 모든 압제자들에게 조치를 취하겠습니다.[a] 다리를 저는 자들과 쫓겨난 자들을 구원하고 모으며,[b] 그들이 수치를 당하던 모든 땅에서 그들이 찬양과 명성이 되게 하겠습니다.[c][d]
  rationale: The revision preserves the source’s deliberately unspecified decisive action against the oppressors, clarifies the lame image in modern Korean, consistently uses formal-polite style, and renders the final phrase contextually while documenting its literal ambiguity. It does not resolve whether the feminine singular forms are strictly individual or personified-community language.
