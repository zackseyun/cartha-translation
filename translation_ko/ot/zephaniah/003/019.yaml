  - 보세요
  lexicon: HALOT
  rationale: 예언적 선언의 엄중한 도입을 살리기 위해 감탄형 ‘보라’를 택했습니다.
- source_word: מְעַנַּיִךְ
  english_pob_choice: your oppressors
  chosen_korean: 너를 괴롭히는 모든 자
  alternatives_korean:
