  naturalness: ‘먹이를 뜯고’보다 목축 이미지와 일반 한국어 용법에 모두 자연스러운 ‘풀을 뜯고’가 적절합니다. 또한 각주 표지는 해당 표현 뒤에 각각 배치하는 편이 독자의 연결을 명확하게 합니다.
