  text: שְׁאֵרִ֨ית יִשְׂרָאֵ֜ל לֹֽא יַעֲשׂ֤וּ עַוְלָה֙ וְ/לֹא יְדַבְּר֣וּ כָזָ֔ב וְ/לֹֽא יִמָּצֵ֥א בְּ/פִי/הֶ֖ם לְשׁ֣וֹן תַּרְמִ֑ית כִּֽי הֵ֛מָּה יִרְע֥וּ וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/013.yaml
  text: The remnant of Israel will do no wrong and speak no lies[a], and no deceitful tongue will be found in their mouth; for they will graze and lie down[b], with no one to make them afraid.
  footnotes:
  - marker: a
    text: Or 'no tongue of deceit will be found in their mouth.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause uses pastoral imagery: ''they will graze and lie down,'' like a flock living in safety.'
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘의 남은 자들은 불의를 행하지 않고 거짓을 말하지 않을 것이며, 그들의 입에서는 속이는 말이 나오지 않을 것입니다.[a] 이는 그들이 풀을 뜯고 누우며, 아무도 그들을 두렵게 하지 못할 것이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 입에서 속임의 혀가 발견되지 않을 것이다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘풀을 뜯고 누우다’는 양 떼가 안전하게 먹고 쉬는 목가적 이미지를 보존한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  english_pob_choice: The remnant of Israel
  chosen_korean: 이스라엘의 남은 자
  alternatives_korean:
  - 이스라엘의 남은 자들
  - 이스라엘의 남은 무리
  lexicon: HALOT
  rationale: שְׁאֵרִית는 예언서에서 보존된 ‘남은 자’의 의미를 가지므로, 한국어에서도 신학적 뉘앙스를 살려 ‘남은 자’로 옮겼습니다.
- source_word: יַעֲשׂוּ עַוְלָה
  english_pob_choice: will do no wrong
  chosen_korean: 불의를 행하지 않고
  alternatives_korean:
  - 잘못을 행하지 않고
  - 부당함을 행하지 않고
  lexicon: HALOT
  rationale: עַוְלָה는 불의/그릇됨/부당함의 범위를 가지므로, 자연스럽고 넓은 의미를 살려 ‘불의를 행하지 않고’로 옮겼습니다.
- source_word: יְדַבְּרוּ כָזָב
  english_pob_choice: speak no lies
  chosen_korean: 거짓을 말하지 않을 것이며
  alternatives_korean:
  - 거짓말하지 않을 것이며
  - 허위를 말하지 않을 것이며
  lexicon: HALOT
  rationale: כָזָב는 ‘거짓/허위’이므로, 동사의 직접성을 살려 표준적이고 명료한 ‘거짓을 말하다’로 번역했습니다.
- source_word: לְשׁוֹן תַּרְמִית
  english_pob_choice: deceitful tongue
  chosen_korean: 속이는 혀
  alternatives_korean:
  - 기만의 혀
  - 속임의 혀
  lexicon: HALOT
  rationale: 직역된 신체 이미지인 ‘혀’를 유지하되, תַּרְמִית의 기만성을 드러내기 위해 ‘속이는’으로 옮겼습니다. POB의 ‘deceitful tongue’에 해당합니다.
- source_word: יִרְעוּ וְרָבְצוּ
  english_pob_choice: they will graze and lie down
  chosen_korean: 먹이를 뜯고 누울 것이며
  alternatives_korean:
  - 풀을 뜯고 누울 것이며
  - 먹고 누울 것이며
  lexicon: HALOT
  rationale: יִרְעוּ와 וְרָבְצוּ는 목자-양의 목가적 이미지를 이루므로, ‘먹이를 뜯고 누우다’로 그 구체적 장면을 살렸습니다.
- source_word: אֵין מַחֲרִיד
  english_pob_choice: with no one to make them afraid
  chosen_korean: 그들을 두려워하게 할 자가 없기 때문입니다
  alternatives_korean:
  - 그들을 두렵게 할 자가 없기 때문입니다
  - 그들을 무서워하게 할 자가 없기 때문입니다
  lexicon: HALOT
  rationale: מַחֲרִיד은 ‘두렵게 하다/겁주다’의 주체를 가리키므로, 인격적 행위자를 드러내는 문장으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘남은 자’의 예언적 의미
  chosen_reading: שְׁאֵרִית를 단순한 잔여가 아니라 하나님이 보존하신 공동체를 가리키는 ‘남은 자’로 번역했습니다.
  alternative_readings:
  - 남은 무리
  - 남은 사람들
  rationale: 예언서의 문맥에서는 신학적으로 축적된 ‘남은 자’ 용례가 있으므로, 본문이 의도하는 회복된 공동체의 의미를 유지하는 것이 타당합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 목가적 이미지 보존
  chosen_reading: 마지막 절의 ‘먹이를 뜯고 누울 것’이라는 양 떼 이미지를 보존했습니다.
  alternative_readings:
  - 먹고 쉬며
  - 평안히 살 것이며
  rationale: 본문은 안전을 추상적으로 말하기보다 목축적 평화를 그리므로, 이미지를 유지해야 독자가 예언적 어조를 그대로 이해할 수 있습니다.
  doctrine_reference: Translation philosophy §1, §6
