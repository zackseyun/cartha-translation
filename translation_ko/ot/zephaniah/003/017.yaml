revisions:
- from: 야훼 당신의 하나님께서 당신 가운데 계십니다. 그는 구원하시는 용사이십니다. 그가 당신 때문에 기뻐하시며 즐거워하시고, 그의 사랑 안에서 잠잠하시며, 당신 때문에 노래하며 기뻐 외치십니다.[a]
  to: 야훼, 당신의 하나님께서 당신 가운데 계십니다. 그분은 구원하시는 능하신 분이십니다. 그분은 당신을 두고 기쁨으로 기뻐하실 것이며, 그의 사랑 안에서 잠잠하실 것이며[a], 당신을 두고 노래로 크게 기뻐하실 것입니다.
  rationale: 원문의 절 구조와 미래적 흐름을 보존하도록 다듬었습니다. עָלַיִךְ는 ‘당신을 두고’로 옮겨 인과적 뉘앙스를 피했고, יָשִׂישׂ בְּשִׂמְחָה는 하나의 기쁨 행위로 유지했습니다. יַחֲרִישׁ는 명시된 목적어 없이 번역하고, 잘 알려진 목적어 첨가 및 ‘새롭게 하다’ 독법은 정확한 위치의 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:41Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘당신 때문에’는 עָלַיִךְ(‘당신을 두고/당신 위에’)를 다소 부자연스럽고 인과적으로 들리게 옮깁니다. 또한 יָשִׂישׂ בְּשִׂמְחָה의 동사와 기쁨의 명사를 ‘기뻐하시며 즐거워하시고’로 처리하여 원문의 한 동작을 둘로 늘렸습니다. 미완료형의 미래적 전개도 한국어 본문에서 명시하는 편이 적절합니다.
  naturalness: ‘당신을 두고’는 이 문맥에서 하나님이 시온을 향하여 기뻐하시는 대상을 자연스럽게 나타냅니다. ‘기쁨으로 … 기뻐하실 것이며’는 다소 반복적이지만 원문의 강조를 보존하면서 현대 한국어로 이해 가능합니다. 각 절을 병렬적인 미래형으로 맞추어 예언적 문맥과 합쇼체 문체를 유지했습니다.
  terminology: ‘야훼’, ‘하나님’, ‘구원하시는 능하신 분’은 신명과 핵심 어휘를 충실히 반영합니다. גִּבּוֹר의 용사적 함의는 ‘능하신 분’보다 약해질 수 있으나, ‘구원하시는 용사’가 한국어에서 하나님을 전쟁 수행자로 지나치게 한정해 들릴 수 있는 점을 피하면서 ‘mighty one’의 넓은 의미를 살립니다. יַחֲרִישׁ의 목적어 없는 모호성은 ‘그의 사랑 안에서 잠잠하실 것이며’로 보존했습니다.
  issues:
  - severity: medium
    issue: ‘당신 때문에’가 עָלַיִךְ의 관계를 인과적으로 들리게 함
    rationale: עַל은 여기서 기쁨의 대상에 대한 ‘~을 두고/향하여’를 나타내며, ‘때문에’는 그 기쁨의 원인을 설명하는 표현으로 의미를 다소 좁힙니다.
  - severity: medium
    issue: 첫 기쁨의 표현이 원문의 한 동사와 한 전치사구를 두 개의 동사로 확대함
    rationale: יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה는 ‘당신을 두고 기쁨으로 기뻐하다’라는 하나의 술어 구조입니다. ‘기뻐하시며 즐거워하시고’는 불필요하게 동작을 추가합니다.
  - severity: low
    issue: 각 미완료형의 미래적 진행이 일관되게 드러나지 않음
    rationale: 문맥상 현재적 확신으로도 번역할 수 있으나, 영어 POB 및 히브리어의 예언적 연속에 맞춰 ‘~하실 것입니다/것이며’로 통일하면 더 분명합니다.
  - severity: low
    issue: 각주 표지가 해당 구절 바로 뒤에 놓이지 않음
    rationale: 대안 독법은 יַחֲרִישׁ בְּאַהֲבָתוֹ에만 관련되므로, 표지를 ‘잠잠하실 것이며’ 뒤에 두어 앵커를 명확히 해야 합니다.
