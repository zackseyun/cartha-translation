source:
  edition: WLC
  text: יְהוָ֧ה אֱלֹהַ֛יִ/ךְ בְּ/קִרְבֵּ֖/ך גִּבּ֣וֹר יוֹשִׁ֑יעַ יָשִׂ֨ישׂ עָלַ֜יִ/ךְ בְּ/שִׂמְחָ֗ה יַחֲרִישׁ֙ בְּ/אַ֣הֲבָת֔/וֹ יָגִ֥יל עָלַ֖יִ/ךְ בְּ/רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/017.yaml
  text: Yahweh your God is in your midst[a], a mighty one who saves; he will rejoice over you with gladness; he will be quiet in his love; he will exult over you with singing.
  footnotes:
  - marker: a
    text: Or, 'he will quiet you with his love.' Another less likely interpretive rendering is, 'he will renew you in his love.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼, 당신의 하나님께서 당신 가운데 계십니다. 그분은 구원하시는 능하신 분이십니다. 그분은 당신을 두고 기쁨으로 기뻐하실 것이며, 그의 사랑 안에서 잠잠하실 것이며[a], 당신을 두고 노래로 크게 기뻐하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 사랑으로 당신을 잠잠하게 하실 것이며.’ 덜 유력한 해석으로는 ‘그의 사랑 안에서 당신을 새롭게 하실 것이며’가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약 이름인 YHWH를 지시하는 고유명사이므로, POB의 원칙에 따라 титული인 ‘주’보다 음역인 ‘야훼’를 본문에 반영했습니다.
- source_word: בְּקִרְבֵּךְ
  english_pob_choice: in your midst
  chosen_korean: 당신 가운데
  alternatives_korean:
  - 당신 안에
  - 당신들 가운데
  lexicon: HALOT
  rationale: 여성 단수로 주소된 시온/예루살렘의 공동체적 임재를 자연스러운 현대 한국어로 살리기 위해 ‘당신 가운데’로 옮겼습니다.
- source_word: גִּבּוֹר יוֹשִׁיעַ
  english_pob_choice: a mighty one who saves
  chosen_korean: 구원하시는 용사
  alternatives_korean:
  - 구원하시는 용맹한 분
  - 구원하시는 힘센 분
  - 구원하시는 전사
  lexicon: HALOT
  rationale: 명사적 힘과 구원 행위를 함께 보여 주는 결합이므로, 형용사적 ‘구원하시는’과 실질 명사 ‘용사’를 조합해 힘과 구원의 뉘앙스를 보존했습니다.
- source_word: יָשִׂישׂ ... יָגִיל
  english_pob_choice: he will rejoice ... he will exult
  chosen_korean: 기뻐하시며 즐거워하시고 ... 기뻐 외치십니다
  alternatives_korean:
  - 즐거워하시며 기뻐하시고 ... 크게 기뻐하십니다
  - 환호하시며 즐거워하시고 ... 외치십니다
  lexicon: HALOT
  rationale: 두 동사가 모두 넘치는 기쁨을 뜻하므로, 한국어에서도 서로 같은 말로 평면화하지 않도록 ‘기뻐하시며 즐거워하시고’와 ‘기뻐 외치십니다’로 구분했습니다.
- source_word: יַחֲרִישׁ בְּאַהֲבָתוֹ
  english_pob_choice: he will be quiet in his love
  chosen_korean: 그의 사랑 안에서 잠잠하시며
  alternatives_korean:
  - 그의 사랑으로 당신을 잠잠하게 하시며
  - 그의 사랑 안에서 조용히 계시며
  - 그의 사랑 안에서 침묵하시며
  lexicon: HALOT
  rationale: 히브리어는 ‘잠잠하다/침묵하다’의 가장 직접적인 뜻을 가지며, 본문에 없는 목적어를 덧붙이지 않도록 수동적·목적어 없는 ‘잠잠하시며’를 택했습니다.
theological_decisions:
- issue: יׄחריש בְּאַהֲבָתוֹ의 해석
  chosen_reading: 본문의 모호성을 보존하여 ‘그의 사랑 안에서 잠잠하시며’로 옮겼습니다.
  alternative_readings:
  - 그의 사랑으로 당신을 잠잠하게 하시며
  - 그의 사랑 안에서 당신을 새롭게 하시며
  rationale: POB가 본문 자체의 문법적 긴장을 유지하므로, 해석을 확정해 버리는 ‘당신을 잠잠하게 하시며’보다 원문이 직접 허용하는 의미 범위를 남겨 두는 번역이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
