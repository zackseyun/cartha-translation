    rationale: הִשְׁחִיתוּ는 이 문맥에서 목적어 ‘그들의 모든 행위’를 취하는 단일 동사입니다. 초안은 이를 ‘타락시켰고’와 ‘부패시켰습니다’로 중복 번역하여 문법과 의미를 훼손합니다.
  - severity: medium
