id: ZEP.3.7
reference: Zephaniah 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֜רְתִּי אַךְ תִּירְאִ֤י אוֹתִ/י֙ תִּקְחִ֣י מוּסָ֔ר וְ/לֹֽא יִכָּרֵ֣ת מְעוֹנָ֔/הּ כֹּ֥ל אֲשֶׁר פָּקַ֖דְתִּי עָלֶ֑י/הָ אָכֵן֙ הִשְׁכִּ֣ימוּ הִשְׁחִ֔יתוּ כֹּ֖ל עֲלִילוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/007.yaml
  text: I said[a], ‘Surely you will fear me; you will accept correction. Then her dwelling would not be cut off, according to all that I had appointed against her.’ But instead, they rose early[b]; they corrupted all their deeds.
  footnotes:
  - marker: a
    text: Or, possibly, “Then her dwelling would not be cut off, despite all that I had appointed against her.”
    reason: alternative_reading
  - marker: b
    text: “Rose early” is a Hebrew idiom that can imply eagerness or persistence.
    reason: cultural_note
translation:
  language: ko
  text: 내가 말했습니다. 「너는 분명히 나를 두려워하고 훈계를 받아들일 것입니다. 그러면 그녀의 거처는 내가 그녀에게 정해 놓은 모든 것에 따라 끊어지지 않았을 것입니다.」 그러나 그들은 일찍 일어나 그들의 모든 행위를 망쳐 놓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀의 거처는 내가 그녀에게 정해 놓은 모든 것에도 불구하고 끊어지지 않았을 것입니다”로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘일찍 일어나다’는 히브리어 관용구로, 열심이나 지속성을 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 내가 말하였다
  alternatives_korean:
  - 내가 생각하였다
  lexicon: HALOT
  rationale: 직접 화자 발화를 유지하는 것이 히브리어 1인칭 완료형의 문면과 잘 맞으며, ‘생각하였다’보다 선언적 대조가 분명합니다.
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 오직
  - 참으로
  lexicon: HALOT
  rationale: 여기서 אַךְ는 제한보다는 기대와 확신을 나타내므로, 예언적 확신을 살리는 ‘분명히’가 적절합니다.
- source_word: תִּירְאִי אוֹתִי / תִּקְחִי מוּסָר
  english_pob_choice: you will fear me; you will accept correction
  chosen_korean: 나를 두려워하며, 훈계를 받아들일 것이다
  alternatives_korean:
  - 나를 경외하며, 교훈을 받을 것이다
  - 나를 두려워하며, 징계를 받아들일 것이다
  lexicon: HALOT
  rationale: 하나님을 향한 ירא는 단순 감정보다 경외/두려움을 함께 담지만, 한국어에서는 직역성이 높은 ‘두려워하다’를 유지하고 מוסר는 교육적 훈육의 뉘앙스를 살려 ‘훈계’로 옮겼습니다.
- source_word: וְלֹא יִכָּרֵת מְעוֹנָהּ כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  english_pob_choice: her dwelling would not be cut off, according to all that I had appointed against her
  chosen_korean: 그녀의 거처는, 내가 그녀에게 내린 모든 일에 따라, 끊어지지 않았을 것이다
  alternatives_korean:
  - 그녀의 거처는, 내가 그녀에게 정해 둔 모든 것에 따라, 끊어지지 않았을 것이다
  - 그녀의 거처는, 내가 그녀에게 내린 모든 재앙에 따라, 끊어지지 않았을 것이다
  lexicon: HALOT
  rationale: כרת의 수동형은 ‘끊어지다’가 가장 직접적이며, מְעוֹן은 개인/도시의 거처를 뜻하므로 ‘거처’로 옮겼습니다. פָּקַד은 문맥상 심판으로 ‘내리다’가 가능하지만, 해석을 과도하게 고정하지 않기 위해 보다 중립적인 표현을 택했습니다.
- source_word: הִשְׁכִּימוּ
  english_pob_choice: they rose early
  chosen_korean: 새벽부터 일어나
  alternatives_korean:
  - 일찍 일어나
  - 부지런히
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 관용구로 살리되, 본문이 전달하는 성급함/열심의 뉘앙스를 유지하기 위해 ‘새벽부터 일어나’로 옮겼습니다.
- source_word: הִשְׁחִיתוּ כֹּל עֲלִילוֹתָם
  english_pob_choice: they corrupted all their deeds
  chosen_korean: 타락시켰고, 그들의 모든 행위를 부패시켰습니다
  alternatives_korean:
  - 모든 행위를 망쳤고
  - 모든 행위를 악하게 했습니다
  lexicon: HALOT
  rationale: שׁחת의 도덕적·파괴적 의미를 함께 살리기 위해 ‘타락시키다/부패시키다’를 사용했고, עֲלִילוֹת은 단순 행동보다 행위 전반을 가리켜 ‘모든 행위’로 옮겼습니다.
theological_decisions:
- issue: 여성 단수와 복수 동사의 대상 전환
  chosen_reading: ‘그녀의 거처’는 예루살렘/시온의 의인화된 여성 단수로, 뒤의 복수 동사는 그 안의 주민 전체를 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 도시를 의인화하지 않고 단순히 집합명사로 볼 수 있습니다.
  rationale: 히브리어의 성별·수 일치를 평탄화하지 않고 그대로 드러내야, 예언적 수사에서 도시와 백성의 긴장이 보존됩니다.
  doctrine_reference: 예언서 수사와 집합적 인격화의 문법적 보존
- issue: פָּקַדְתִּי עָלֶיהָ의 심판 뉘앙스
  chosen_reading: ‘내가 그녀에게 내린 모든 일’로 옮겨, 이미 집행된 심판이라기보다 정해진 심판의 범주를 넓게 드러냈습니다.
  alternative_readings:
  - ‘내가 그녀에게 명령한 모든 심판’
  - ‘내가 그녀에게 방문한 모든 벌’
  rationale: 이 구절은 문법적으로 압축되어 있어 과도한 확정을 피해야 하므로, 심판의 의도를 암시하되 한국어에서 자연스럽게 읽히는 중립적 표현을 택했습니다.
  doctrine_reference: 본문의 문법적 모호성을 보존하는 번역 원칙
