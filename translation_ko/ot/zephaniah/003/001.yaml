lexical_decisions:
- source_word: ה֥וֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 아아
  - 슬프도다
  - 불행하여라
  lexicon: HALOT
  rationale: 예언서의 책망·심판 선언에 맞는 관용 표현으로, 영어 POB의 ‘Woe’에 대응해 경고와 애도의 뉘앙스를 함께 살렸습니다.
- source_word: מֹרְאָ֖ה
  english_pob_choice: rebellious
  chosen_korean: 반역하고
  alternatives_korean:
  - 패역한
  - 거역하는
  - 불순종하는
  lexicon: HALOT
  rationale: 어근 מרה의 핵심은 권위에 대한 거역이므로, 형용사형으로 굳히기보다 동사적 느낌의 ‘반역하고’로 옮겨 도시의 지속적 태도를 드러냈습니다.
- source_word: וְ/נִגְאָלָ֑ה
  english_pob_choice: and defiled
  chosen_korean: 더럽혀진
  alternatives_korean:
  - 오염된
  - 부정해진
  - 더러워진
  lexicon: HALOT
  rationale: 이 형태는 문맥상 ‘속량하다’의 일반적 의미가 아니라 부정·오염의 상태를 가리키므로, 제의적·도덕적 훼손을 함께 살리는 ‘더럽혀진’을 택했습니다.
- source_word: הַ/יּוֹנָֽה
  english_pob_choice: the oppressing one
  chosen_korean: 포악한 자여
  alternatives_korean:
  - 압제하는 자여
  - 학대하는 자여
  - 비둘기여
  lexicon: HALOT
  rationale: 문맥과 평행 구조상 ‘비둘기’보다 도시의 폭압적 성격을 지시하는 표현으로 이해되므로, 대상의 성격을 직접 드러내는 ‘포악한 자여’로 옮겼습니다.
theological_decisions:
- issue: 예언적 탄식과 심판 선언의 톤
  chosen_reading: ‘화 있을진저’로 시작해 도시를 직접 호명하는 책망 구조를 유지했습니다.
  alternative_readings:
  - ‘아아’처럼 더 탄식형으로 완화하는 번역
  - 평서문으로 바꾸어 선언성을 약화하는 번역
  rationale: 히브리어 הוֹי는 단순 감탄이 아니라 예언적 심판 선고의 공식이므로, 한국어에서도 강한 경고와 դատ판의 울림을 보존해야 합니다.
  doctrine_reference: 예언서의 심판 선포 형식
- issue: ‘더럽혀진’의 도덕적·제의적 함의
  chosen_reading: 도시의 상태를 단순한 위생적 더러움이 아니라 언약적·제의적 부정함까지 포함하는 것으로 읽었습니다.
  alternative_readings:
  - 오직 도덕적 타락만 가리키는 읽기
  - 오직 외적 오염으로 제한하는 읽기
  rationale: 예언 문맥에서 ‘defiled’는 공동체 전체의 죄와 부정 상태를 포괄하므로, 한국어에서도 포괄적 의미를 유지하는 것이 적절합니다.
  doctrine_reference: 구약의 정결/부정 개념
