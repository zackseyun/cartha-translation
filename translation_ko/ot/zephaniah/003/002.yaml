id: ZEP.3.2
reference: Zephaniah 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א שָֽׁמְעָה֙ בְּ/ק֔וֹל לֹ֥א לָקְחָ֖ה מוּסָ֑ר בַּֽ/יהוָה֙ לֹ֣א בָטָ֔חָה אֶל אֱלֹהֶ֖י/הָ לֹ֥א קָרֵֽבָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/002.yaml
  text: She did not obey the voice[a]; she did not accept correction. She did not trust in Yahweh[d][c][b]; she did not draw near to her God.
  footnotes:
  - marker: a
    text: Or 'did not listen to the voice' or 'did not heed the voice.' The Hebrew idiom can emphasize obedient listening.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not receive discipline' or 'did not take instruction.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'YHWH'; rendered 'the LORD' in keeping with the translation's standard practice.
    reason: alternative_reading
  - marker: d
    text: Or 'did not approach.' 'Draw near' may carry both relational and worship-related overtones.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 목소리에 순종하지 않았고[a] 훈계를 받아들이지 않았습니다[b]. 야훼를 신뢰하지 않았으며[c] 자기 하나님께 가까이 나아가지 않았습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목소리를 듣지 않았다’, ‘목소리에 귀를 기울이지 않았다’. 히브리어 관용구는 순종적 경청을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘교정을 받아들이지 않았다’, ‘징계를 받아들이지 않았다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘YHWH’를 가리키며, 본 번역은 이를 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘다가오지 않았다’. ‘가까이 나아가다’는 관계적·예배적 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה בְּקוֹל
  english_pob_choice: did not obey the voice
  chosen_korean: 목소리에 순종하지 않았고
  alternatives_korean:
  - 목소리를 듣지 않았고
  - 목소리에 귀를 기울이지 않았고
  lexicon: HALOT
  rationale: שׁמע עם בְּקוֹל은 단순 청취보다 순종적 경청을 뜻하므로, ‘순종하다’로 옮겨 관용구의 힘을 살렸습니다.
- source_word: לָקְחָה מוּסָר
  english_pob_choice: did not accept correction
  chosen_korean: 교훈을 받아들이지 않았습니다
  alternatives_korean:
  - 훈계를 받지 않았습니다
  - 징계를 받아들이지 않았습니다
  lexicon: HALOT
  rationale: מוּסָר은 훈계·징계·교훈을 아우르지만, 여기서는 선지자적 책망에 대한 거부이므로 ‘교훈’과 ‘받아들이다’가 자연스럽습니다.
- source_word: בַּיהוָה
  english_pob_choice: did not trust in Yahweh
  chosen_korean: 야훼를 신뢰하지 않았고
  alternatives_korean:
  - 여호와를 신뢰하지 않았고
  - 주를 신뢰하지 않았고
  lexicon: HALOT
  rationale: 원문이 여호와 이름을 직접 쓰므로 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다. 전치사 בְּ는 한국어에서 목적어를 직접 취하는 ‘신뢰하다’로 충분히 드러납니다.
- source_word: קָרֵבָה
  english_pob_choice: did not draw near
  chosen_korean: 가까이 나아가지 않았습니다
  alternatives_korean:
  - 가까이 오지 않았습니다
  - 다가서지 않았습니다
  lexicon: HALOT
  rationale: קרב는 관계적·예배적 접근을 포함할 수 있어, ‘가까이 나아가다’가 가장 넓은 뉘앙스를 보존합니다.
theological_decisions:
- issue: 예루살렘을 가리키는 여성 단수 인칭의 처리
  chosen_reading: 문맥상 암시된 도시를 드러내지 않고, 여성 대명사 ‘그녀’를 유지했습니다.
  alternative_readings:
  - 예루살렘은 목소리에 순종하지 않았고…
  - 그 도성은 목소리에 순종하지 않았고…
  rationale: 히브리어 동사들이 여성 단수로 도시를 의인화하므로, 대상을 풀어쓰지 않고 인칭을 유지하는 편이 원문의 문학적 효과를 살립니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: יהוה의 표기
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문헌적·학술적 표기를 따라 여호와의 언약 이름을 드러내되, 전통 교회어인 ‘주님’으로 평준화하지 않았습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
