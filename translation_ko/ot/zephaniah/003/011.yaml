revisions:
- from: 그날에는 네가 나에게 반역한 모든 행위로 말미암아 부끄러워하지 않을 것입니다. 그때 내가 네 한가운데에서 네 교만으로 즐거워하는 자들을 제거하겠고, 네가 다시는 내 거룩한 산에서 교만하게 굴지 않을 것입니다.[a][b]
  to: 그날에는 네가 나에게 반역한 모든 행위 때문에 수치를 당하지 않을 것입니다.[a] 그때에 내가 네 가운데서 네 교만을 자랑하며 기뻐하는 자들을 제거하겠고,[b] 너는 더 이상 내 거룩한 산에서 교만하게 굴지 않을 것입니다.
  rationale: 수치에 관한 동사의 의미 범위를 본문과 각주에 균형 있게 반영하고, 교만하게 기뻐하는 이들을 가리키는 히브리어 구성 표현을 자연스러운 현대 한국어로 다듬었습니다. 또한 각주 표지를 해당 어구에 직접 연결하고, 마지막 절을 합쇼체 예언 문장으로 매끄럽게 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:40Z'
