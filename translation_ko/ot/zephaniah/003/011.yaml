source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִ/כֹּ֣ל עֲלִילֹתַ֔יִ/ךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ בִּ֑/י כִּי אָ֣ז אָסִ֣יר מִ/קִּרְבֵּ֗/ךְ עַלִּיזֵי֙ גַּאֲוָתֵ֔/ךְ וְ/לֹֽא תוֹסִ֧פִי לְ/גָבְהָ֛ה ע֖וֹד בְּ/הַ֥ר קָדְשִֽׁ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/011.yaml
  text: On that day you will not be put to shame because of all your deeds by which you rebelled against me[a], for then I will remove from your midst those who exult in your pride[b], and you will no longer be haughty on my holy mountain.
  footnotes:
  - marker: a
    text: Or 'you will not be ashamed.' The Hebrew verb can be rendered either as the state of shame or as being put to shame/disgraced.
    reason: lexical_alternative
  - marker: b
    text: Or 'your proudly exultant ones.' The Hebrew expression refers to people characterized by arrogant rejoicing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에는 네가 나에게 반역한 모든 행위 때문에 수치를 당하지 않을 것입니다.[a] 그때에 내가 네 가운데서 네 교만을 자랑하며 기뻐하는 자들을 제거하겠고,[b] 너는 더 이상 내 거룩한 산에서 교만하게 굴지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '부끄러워하지 않을 것입니다.' 히브리어 동사는 부끄러움의 상태를 가리킬 수도 있고, 수치나 치욕을 당함을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '네 교만으로 환호하는 자들.' 히브리어 표현은 교만과 결부되어 기뻐하며 환호하는 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵבֹושִׁי
  english_pob_choice: you will not be put to shame
  chosen_korean: 부끄러워하지 않을 것입니다
  alternatives_korean:
  - 수치를 당하지 않을 것입니다
  - 부끄럽지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 실제 수치/치욕의 상태를 가리키므로 단순한 내면 감정보다 결과를 드러내는 표현을 택했습니다. 합쇼체에서는 자연스럽게 '부끄러워하지 않을 것입니다'가 가장 매끄럽습니다.
- source_word: מִכֹּל עֲלִילֹתַיִךְ
  english_pob_choice: because of all your deeds
  chosen_korean: 네가 ... 모든 행위로 말미암아
  alternatives_korean:
  - 네 모든 행위 때문에
  - 네 모든 소행 때문에
  lexicon: HALOT
  rationale: עֲלִילֹת은 일반적인 '행위'보다 도덕적 색채가 있는 '행위/소행'에 가깝지만, 뒤의 '반역한'이 의미를 규정하므로 본문 흐름에 맞게 '행위로 말미암아'로 옮겼습니다.
- source_word: פָּשַׁעַתְּ בִּי
  english_pob_choice: you rebelled against me
  chosen_korean: 나에게 반역한
  alternatives_korean:
  - 나를 거역한
  - 나를 배반한
  - 나에게 죄를 지은
  lexicon: HALOT
  rationale: פשע는 단순한 범죄보다 언약적 반역의 의미가 강하므로 '반역하다'로 옮겨 관계적·신학적 긴장을 보존했습니다.
- source_word: עַלִּיזֵי גַּאֲוָתֵךְ
  english_pob_choice: those who exult in your pride
  chosen_korean: 네 교만으로 즐거워하는 자들
  alternatives_korean:
  - 네 교만을 기뻐하는 자들
  - 네 교만에 환호하는 자들
  - 네 교만에 들떠 있는 자들
  lexicon: HALOT
  rationale: עַלִּיזֵי는 '즐거워하는/환호하는 자들'이고, גַּאֲוָה는 여기서 부정적으로 '교만'입니다. 영어 POB의 의미를 따라 사람들의 성향을 드러내는 표현으로 번역했습니다.
- source_word: בְּהַר קָדְשִׁי
  english_pob_choice: on my holy mountain
  chosen_korean: 내 거룩한 산에서
  alternatives_korean:
  - 내 거룩한 산 위에서
  - 내 성산에서
  lexicon: HALOT
  rationale: 히브리어의 장소적 표현을 자연스러운 한국어로 옮기되, '내 거룩한 산'이라는 시온의 표지를 유지했습니다.
theological_decisions:
- issue: 부끄러움의 부정이 죄책의 부정으로 읽힐 가능성
  chosen_reading: 이 절은 과거의 실제 반역을 지우는 것이 아니라, 그 죄로 인한 수치가 하나님의 정화와 제거 행위로 끝난다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 죄가 없었던 것처럼 읽히게 하는 번역
  - 단순히 감정적 수치심이 사라진다는 번역
  rationale: 앞 절의 '반역한'과 뒤의 '내가 ... 제거하겠고'가 원인이 죄와 제거 행위에 있음을 분명히 하므로, 죄책과 회복의 긴장을 함께 살려야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
