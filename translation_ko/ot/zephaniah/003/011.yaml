  source_fidelity: 히브리어의 미래형, 반역(פשׁע), 공동체 내부로부터의 제거, 교만한 기쁨의 대상, 그리고 더 이상 성산에서 교만하지 않게 됨을 대체로 충실히 반영합니다. 다만 תֵבוֹשִׁי는 문맥상 단순한 감정적 부끄러움보다 수치/치욕을 당하는 상태를 포함하므로 본문 표현을 보완하는 것이 좋습니다. עַלִּיזֵי גַּאֲוָתֵךְ는 '네 교만으로 즐거워하는'보다 교만을 자랑하며 기뻐하는 이들이라는 의미가 더 자연스럽고 분명합니다.
  naturalness: 초안의 마지막 문장인 '네가 다시는 ... 교만하게 굴지 않을 것입니다'는 문법상 가능하나, 앞뒤의 호칭 및 예언적 문체와 결합할 때 다소 어색합니다. '너는 더 이상 ... 교만하게 굴지 않을 것입니다'가 현대 한국어 합쇼체에서 더 매끄럽습니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 것이 독해와 주석 연결에 적절합니다.
  terminology: '''반역한''은 פָּשַׁעַתְּ בִּי의 언약적 거역 의미를 잘 살립니다. ''거룩한 산''도 원문의 표현을 충실히 보존합니다. ''수치를 당하지''는 본문의 수치/치욕 의미를 더 잘 드러내며, 각주에서 ''부끄러워하지''라는 대안을 제시합니다.'
