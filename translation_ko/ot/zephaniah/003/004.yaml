revisions:
- from: 그 여자의 예언자들은 무모하고 배신하는 자들입니다. 그 여자의 제사장들은 거룩한 것을 더럽혔고, 율법에 폭력을 저질렀습니다.[a][b]
  to: 그 도성의 예언자들은 경솔하고 배신을 일삼는 자들입니다. 그 도성의 제사장들은 거룩한 것을[a] 더럽혔고, 율법을[b] 유린했습니다.
  rationale: 도시를 가리키는 여성형 소유 접미사의 문맥적 지시를 ‘그 도성의’로 바로잡고, חמס의 폭력적 침해 의미를 자연스러운 한국어 관용 표현인 ‘율법을 유린했습니다’로 옮겼습니다. קֹדֶשׁ과 תּוֹרָה의 의미 범위는 본문과 각주에서 유지했으며, 각주 표지를 해당 단어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:38Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그 여자’는 여성형 접미사가 가리키는 의인화된 예루살렘/도성을 한국어에서 문자 그대로 여성으로 지칭하여, 본문의 도시 의인화를 부정확하고 부자연스럽게 만듭니다. ‘그 도성의’가 소유 관계와 지시 대상을 충실히 보존합니다. חָמְסוּ תּוֹרָה는 ‘율법에 폭력을 저질렀습니다’보다 목적어를 취하는 ‘율법을 유린했습니다’가 자연스럽고, 율법에 가해진 폭력적 침해라는 비유를 잘 살립니다.
  naturalness: ‘그 여자의’는 성인 여성 소유자를 뜻하는 것으로 읽혀 문맥에 맞지 않습니다. 또한 ‘율법에 폭력을 저질렀습니다’는 현대 한국어에서 어색한 결합입니다. ‘경솔하고 배신을 일삼는 자들’과 ‘율법을 유린했습니다’는 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘예언자’, ‘제사장’, ‘거룩한 것’, ‘율법’은 적절합니다. קֹדֶשׁ의 폭을 보존하여 ‘성소’로 한정하지 않았습니다. 각주 표지는 해당 어휘 바로 뒤에 두어야 합니다.
  issues:
