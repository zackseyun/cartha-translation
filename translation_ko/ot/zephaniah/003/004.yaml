    rationale: 3인칭 여성형 접미사는 이 문맥에서 의인화된 예루살렘/도성을 가리킵니다. ‘그 여자’는 실제 여성 인물을 가리키는 듯하여 지시 대상을 왜곡합니다.
  - severity: medium
    issue: ‘율법에 폭력을 저질렀습니다’의 어색한 결합과 부적절한 조사
    rationale: 히브리어 동사는 율법을 직접 목적어로 하며 폭력적으로 침해한다는 뜻입니다. 한국어에서는 ‘율법을 유린했습니다’가 자연스럽고 의미를 보존합니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 함께 배치됨
    rationale: 각주 a와 b는 각각 קֹדֶשׁ 및 תּוֹרָה의 번역 대안을 설명하므로 ‘거룩한 것’과 ‘율법’ 바로 뒤에 연결되어야 합니다.
