id: ZEP.3.4
reference: Zephaniah 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְבִיאֶ֨י/הָ֙ פֹּֽחֲזִ֔ים אַנְשֵׁ֖י בֹּֽגְד֑וֹת כֹּהֲנֶ֨י/הָ֙ חִלְּלוּ קֹ֔דֶשׁ חָמְס֖וּ תּוֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/004.yaml
  text: Her prophets are reckless[a], treacherous men; her priests have profaned the holy[b]; they have done violence to the law.
  footnotes:
  - marker: a
    text: Or "the sanctuary" or "holy things" for "what is holy."
    reason: lexical_alternative
  - marker: b
    text: Or "instruction" for "the law" (Hebrew torah).
    reason: lexical_alternative
translation:
  language: ko
  text: 그 도성의 예언자들은 경솔하고 배신을 일삼는 자들입니다. 그 도성의 제사장들은 거룩한 것을[a] 더럽혔고, 율법을[b] 유린했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성소” 또는 “거룩한 것들”.
    reason: קֹדֶשׁ은 문맥상 성소나 거룩한 것들을 가리킬 수도 있으나, 본문은 대상을 명시적으로 한정하지 않습니다.
  - marker: b
    text: 또는 “가르침”. 히브리어는 토라입니다.
    reason: תּוֹרָה는 율법뿐 아니라 가르침 또는 교훈을 뜻할 수도 있습니다.
lexical_decisions:
- source_word: נְבִיאֶיהָ
  english_pob_choice: her prophets
  chosen_korean: 그 여자의 예언자들
  alternatives_korean:
  - 그녀의 예언자들
  - 그 도성의 예언자들
  lexicon: WLC/HALOT
  rationale: 3인칭 여성 소유 접미사는 의인화된 예루살렘을 가리키므로, 소유 관계를 살리되 자연스러운 현대 한국어로 옮겼습니다.
- source_word: פֹּחֲזִים
  english_pob_choice: reckless
  chosen_korean: 무모하고
  alternatives_korean:
  - 경솔하고
  - 방탕하고
  - 오만하고
  lexicon: HALOT
  rationale: 이 형용사는 절제 없고 경솔한 태도를 뜻하므로, ‘무모하고’로 옮겨 도덕적·행동적 경솔함을 함께 드러냈습니다.
- source_word: אַנְשֵׁי בֹּגְדוֹת
  english_pob_choice: treacherous men
  chosen_korean: 배신하는 자들
  alternatives_korean:
  - 배반하는 자들
  - 배신의 사람들
  - 간사한 자들
  lexicon: HALOT
  rationale: 직역하면 ‘배신/배반의 사람들’이지만, 반복적 배신의 성격을 담는 한국어로는 ‘배신하는 자들’이 가장 자연스럽고 강합니다.
- source_word: חִלְּלוּ קֹדֶשׁ
  english_pob_choice: have profaned what is holy
  chosen_korean: 거룩한 것을 더럽혔고
  alternatives_korean:
  - 거룩함을 더럽혔고
  - 성소를 더럽혔고
  - 거룩한 것을 훼손했고
  lexicon: HALOT
  rationale: קֹדֶשׁ은 문맥상 성소로 한정되지 않고 거룩한 것 전체를 가리킬 수 있으므로, 그 범위를 유지하는 ‘거룩한 것’으로 옮겼습니다.
- source_word: חָמְסוּ תּוֹרָה
  english_pob_choice: have done violence to the law
  chosen_korean: 율법에 폭력을 저질렀습니다
  alternatives_korean:
  - 율법을 짓밟았습니다
  - 율법을 폭력적으로 다뤘습니다
  - 율법을 유린했습니다
  lexicon: HALOT
  rationale: חמס는 단순한 불순종보다 폭력적 침해의 뉘앙스가 강하므로, ‘폭력을 저질렀습니다’로 옮겨 법/질서에 대한 가해성을 보존했습니다.
theological_decisions:
- issue: קֹדֶשׁ의 범위
  chosen_reading: 성소로 좁히지 않고 거룩한 것 전체를 가리키는 넓은 표현으로 유지했습니다.
  alternative_readings:
  - 성소
  - 거룩한 것들
  rationale: 히브리어는 대상을 명시적으로 한정하지 않으므로, 본문이 가진 비난의 폭을 보존하는 쪽이 번역 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
