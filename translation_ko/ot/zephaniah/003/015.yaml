  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘당신의 원수도 돌이키셨습니다’는 목적격이 없어 원수가 스스로 돌아선다는 뜻으로 읽힐 수 있으며, 히브리어 פִּנָּה의 타동적 의미(원수를 물리치다/돌려 보내다)를 충분히 전달하지 못합니다. 또한 ‘당신 한가운데’는 한국어에서 부자연스럽습니다. 나머지 핵심 요소, 즉 야훼라는 신명, 이스라엘의 왕이라는 칭호, 판결의 복수, 그리고 רָע의 의미 범위는 유지할 수 있습니다.
  naturalness: ‘당신’은 현대 한국어에서 청자에 대한 대립적·친밀한 뉘앙스를 흔히 지니며, 도시를 향한 예언적 호칭으로는 어색합니다. 본문의 여성 단수 مخاطبة는 한국어에서 ‘네’로 자연스럽게 옮길 수 있습니다. 문장을 분리하여 히브리어의 선언적 병렬도 자연스럽게 보존했습니다.
  terminology: יְהוָה는 지침과 영어 POB를 따라 ‘야훼’로 유지했습니다. מֶלֶךְ יִשְׂרָאֵל은 ‘이스라엘의 왕이신 야훼’로 하여 한국어의 자연스러운 동격/관형 구조를 사용했습니다. מִשְׁפָּטַיִךְ는 본문에서 ‘네게 내린 판결들’로 명시하되, 형벌이라는 문맥적 해석은 각주에 보존했습니다. רָע는 ‘악’으로 두고 재앙·해악의 문맥적 가능성을 각주로 제시했습니다.
