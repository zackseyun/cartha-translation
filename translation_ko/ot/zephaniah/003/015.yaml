    rationale: 도시를 향한 히브리어 여성 단수 호칭은 한국어에서 ‘네 가운데’가 더 자연스럽고, ‘당신’이 지닌 현대 대화체의 특수한 뉘앙스를 피할 수 있습니다.
  - severity: low
