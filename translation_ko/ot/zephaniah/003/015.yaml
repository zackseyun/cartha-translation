  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵסִ֤יר יְהוָה֙ מִשְׁפָּטַ֔יִ/ךְ פִּנָּ֖ה אֹֽיְבֵ֑/ךְ מֶ֣לֶךְ יִשְׂרָאֵ֤ל יְהוָה֙ בְּ/קִרְבֵּ֔/ךְ לֹא תִֽירְאִ֥י רָ֖ע עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/015.yaml
  text: Yahweh has taken away your judgments[a]; he has turned away your enemy. The King of Israel, Yahweh, is in your midst[b]; you will fear evil no more.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the judgments against you' or 'your sentence.'
    reason: lexical_alternative
  - marker: b
    text: '''Evil'' here may mean ''disaster'' or ''calamity'' in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신의 판결들을 치워 버리셨고, 당신의 원수도 돌이키셨습니다. 이스라엘의 왕 야훼께서 당신 한가운데 계시니, 당신은 더 이상 악을 두려워하지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 판결들’은 문맥상 ‘당신에게 내린 판결들’ 또는 ‘당신의 형벌’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악’은 이 문맥에서 ‘재앙’ 또는 ‘해악’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  english_pob_choice: has taken away
  chosen_korean: 치워 버리셨고
  alternatives_korean:
  - 제거하셨고
  - 없애셨고
  - 치우셨고
  lexicon: HALOT
  rationale: 히필 형태의 סור는 ‘치우다/제거하다/없애다’의 뜻이므로, 결과가 분명히 사라진다는 점을 살려 자연스러운 완료 표현으로 옮겼습니다.
- source_word: מִשְׁפָּטַיִךְ
  english_pob_choice: your judgments
  chosen_korean: 당신의 판결들
  alternatives_korean:
  - 당신에게 내린 판결들
  - 당신의 심판들
  - 당신의 판결
  lexicon: HALOT
  rationale: 이 어형은 문자적으로는 ‘당신의 판결들’이지만, 문맥상 시온 위에 놓인 불리한 사법적 선고를 가리키므로 ‘판결들’로 옮기고 복수감을 유지했습니다.
- source_word: פִּנָּה
  english_pob_choice: has turned away
  chosen_korean: 돌이키셨습니다
  alternatives_korean:
  - 물리치셨습니다
  - 돌려보내셨습니다
  - 멀리하셨습니다
  lexicon: HALOT
  rationale: ‘돌리다/치우다’의 방향 이동을 살리면서, 적을 밀어낸 효과가 드러나도록 ‘돌이키다’를 사용했습니다.
- source_word: מֶלֶךְ יִשְׂרָאֵל יְהוָה
  english_pob_choice: The King of Israel, Yahweh
  chosen_korean: 이스라엘의 왕 야훼
  alternatives_korean:
  - 이스라엘의 왕이신 야훼
  - 야훼, 이스라엘의 왕
  - 이스라엘의 왕이신 주 야훼
  lexicon: HALOT
  rationale: עמ시적 칭호 구조를 그대로 따라 ‘이스라엘의 왕 야훼’로 옮겨, 신적 칭호와 고유명을 분리하지 않고 붙여 읽히게 했습니다.
- source_word: בְּקִרְבֵּךְ
  english_pob_choice: in your midst
  chosen_korean: 당신 한가운데
  alternatives_korean:
  - 당신 가운데
  - 당신의 한가운데에
  - 당신들 가운데
  lexicon: HALOT
  rationale: 언약적 임재의 관용구를 유지하면서도 현대 한국어에서 자연스러운 공간 표현인 ‘한가운데’로 옮겼습니다.
- source_word: רָע
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 재앙
  - 해악
  - 불행
  lexicon: HALOT
  rationale: 문맥상 재앙적 의미가 강하지만, 영어 POB가 보존한 어휘적 긴장을 따라 본문에는 더 넓은 의미의 ‘악’을 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  - 주님
  rationale: 본문의 여호와 대체어를 사용하지 않고 신적 고유명 자체를 드러내기 위해 ‘야훼’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רָע의 의미 범위
  chosen_reading: 악
  alternative_readings:
  - 재앙
  - 해악
  - 불행
  rationale: 이 절은 구원 선언 안에서 위협의 부재를 말하므로 ‘재앙’이 문맥상 가능하지만, 본문이 가진 도덕적/경험적 폭을 보존하기 위해 본문에는 ‘악’을 두었습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
