revisions:
- from: 야훼께서 당신의 판결들을 치워 버리셨고, 당신의 원수도 돌이키셨습니다. 이스라엘의 왕 야훼께서 당신 한가운데 계시니, 당신은 더 이상 악을 두려워하지 않을 것입니다.[a][b]
  to: 야훼께서 네게 내린 판결들을 없애시고 네 원수를 물리치셨습니다. 이스라엘의 왕이신 야훼께서 네 가운데 계십니다. 너는 더 이상 악을 두려워하지 않을 것입니다.[a][b]
  rationale: 원수에 대한 동사의 타동적 의미를 ‘물리치셨습니다’로 분명히 하고, 수신자 지시를 도시를 향한 예언 문체에 자연스러운 ‘네/너’로 통일했습니다. 판결들의 복수와 각주의 문맥적 대안, 야훼라는 신명, ‘악’의 의도적인 의미 폭은 유지했습니다. 두 번째 절을 독립 문장으로 처리하여 히브리어에 없는 강한 인과 접속을 추가하지 않았습니다.
