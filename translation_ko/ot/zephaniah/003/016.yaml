  text: בַּ/יּ֣וֹם הַ/ה֔וּא יֵאָמֵ֥ר לִ/ירֽוּשָׁלִַ֖ם אַל תִּירָ֑אִי צִיּ֖וֹן אַל יִרְפּ֥וּ יָדָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/016.yaml
  text: On that day it will be said to Jerusalem[a], “Do not fear”; to Zion, “Do not let your hands grow weak.”
  footnotes:
  - marker: a
    text: Or, 'Do not let your hands drop' / 'Do not let your hands be slack.' The Hebrew idiom speaks of losing strength, resolve, or courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 예루살렘에는 이렇게 말할 것입니다. "두려워하지 마라." 시온에게는 "네 손이 약해지지 않게 하라"고 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 손이 축 늘어지지 않게 하라’, ‘네 손이 힘없이 처지지 않게 하라’. 히브리어 관용구는 힘, 결의, 용기를 잃는 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: BDB
  rationale: 예언서의 표준적인 시간 표현을 현대 한국어로 자연스럽게 옮기되, 종말론적·예언적 지시성을 유지했습니다.
- source_word: יֵאָמֵר
  english_pob_choice: it will be said
  chosen_korean: 이렇게 말할 것입니다
  alternatives_korean:
  - 말할 것입니다
  - 말해질 것입니다
  lexicon: HALOT
  rationale: 불특정 주체의 수동적 진술을 한국어에서 자연스럽게 풀어, 누가 말하는지 특정하지 않는 원문 구성을 살렸습니다.
- source_word: אַל תִּירָאִי
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마라
  alternatives_korean:
  - 무서워하지 마라
  - 두려워하지 마십시오
  lexicon: HALOT
  rationale: 여성 단수 대상에게 주어지는 금지형 명령을 직설적이고 간결하게 옮겼습니다. 인용문 안의 직접 명령이므로 평서체보다 명령형이 적합합니다.
- source_word: אַל יִרְפּוּ יָדָיִךְ
  english_pob_choice: Do not let your hands grow weak
  chosen_korean: 네 손이 약해지지 않게 하라
  alternatives_korean:
  - 네 손을 떨구지 마라
  - 네 손이 축 늘어지지 않게 하라
  - 네 손이 풀리지 않게 하라
  lexicon: HALOT
  rationale: ‘손’과 함께 쓰인 רפה의 관용적 의미인 힘·결의·용기의 약화를 살리면서, 문자적 이미지도 유지했습니다.
theological_decisions:
- issue: 예루살렘/시온의 인격화된 직접 호칭
  chosen_reading: 예루살렘과 시온을 각각 여성 단수의 직접 호칭으로 유지했습니다.
  alternative_readings:
  - 예루살렘 사람들에게
  - 시온의 백성에게
  rationale: 히브리어는 도시에 인격을 부여해 직접 말하므로, 이를 집단 설명으로 바꾸지 않고 원문의 수사 구조를 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the prophetic personification without interpretive expansion.'
