source:
  edition: WLC
  text: בָּ/עֵ֤ת הַ/הִיא֙ אָבִ֣יא אֶתְ/כֶ֔ם וּ/בָ/עֵ֖ת קַבְּצִ֣/י אֶתְ/כֶ֑ם כִּֽי אֶתֵּ֨ן אֶתְ/כֶ֜ם לְ/שֵׁ֣ם וְ/לִ/תְהִלָּ֗ה בְּ/כֹל֙ עַמֵּ֣י הָ/אָ֔רֶץ בְּ/שׁוּבִ֧/י אֶת שְׁבוּתֵי/כֶ֛ם לְ/עֵינֵי/כֶ֖ם אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/020.yaml
  text: At that time I will bring you in[a], and at that time I will gather you; for I will make you a name and a praise among all the peoples of the earth, when I restore your fortunes before your eyes, says Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'when I restore your captivity' or 'when I bring back your captives.' The Hebrew idiom refers broadly to restoring those who have suffered exile or calamity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 내가 너희를 데려오고, 그때에 내가 너희를 모을 것이며, 내가 너희를 땅의 모든 민족들 가운데서 이름과 찬양이 되게 할 것이기 때문입니다. 내가 너희의 포로된 형편을 너희 눈앞에서 돌려놓을 때에 말입니다. 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 포로 상태를 회복할 때’로도 옮길 수 있습니다. 히브리어 관용구는 포로 귀환만이 아니라 재난에서의 전반적 회복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא / וּבָעֵת
  english_pob_choice: At that time / and at that time
  chosen_korean: 그때에 / 그때에
  alternatives_korean:
  - 그 시기에
  - 그 때가 되면
  lexicon: HALOT
  rationale: 예언 문맥의 반복 시간표현을 자연스러운 현대 한국어로 살리면서, 두 절의 병렬 구조를 유지했습니다.
- source_word: אָבִיא אֶתְכֶם
  english_pob_choice: I will bring you in
  chosen_korean: 내가 너희를 데려오고
  alternatives_korean:
  - 내가 너희를 데리고 들어오고
  - 내가 너희를 인도하고
  lexicon: HALOT
  rationale: 히필형의 ‘데려오다/가져오다’ 느낌을 살리되, 한국어에서 목적어가 사람일 때 가장 자연스러운 동사를 택했습니다.
- source_word: אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  english_pob_choice: I will make you a name and a praise
  chosen_korean: 너희를 … 이름과 찬양이 되게 할
  alternatives_korean:
  - 너희를 … 명성과 찬양이 되게 할
  - 너희에게 … 이름과 찬양을 주어
  lexicon: HALOT
  rationale: 직역의 이미지를 유지하되 한국어 어법상 ‘~이 되게 하다’로 풀어, ‘이름’과 ‘찬양’이 공동체의 명성과 영예를 가리키는 점을 드러냈습니다.
- source_word: שְׁבוּתֵיכֶם
  english_pob_choice: restore your fortunes
  chosen_korean: 너희의 포로된 형편을 돌려놓을
  alternatives_korean:
  - 너희의 포로 상태를 회복할
  - 너희 포로를 돌이킬
  lexicon: HALOT
  rationale: POB의 주석처럼 이 숙어는 단순한 ‘포로’보다 포로/재난에서의 회복을 포괄하므로, ‘포로된 형편’으로 의미를 넓혀 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 공용 번역 관행 + 프로젝트 용례
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮기고, 서술 종결은 예언자적 선포 공식에 맞게 ‘말씀하십니다’로 처리했습니다.
theological_decisions:
- issue: 예언자적 선포 공식의 종결 형식
  chosen_reading: 야훼께서 말씀하십니다.
  alternative_readings:
  - 야훼의 말씀이니라
  - 야훼께서 이르십니다.
  rationale: 현대 합쇼체를 유지하면서도 예언문서의 공적 선포 성격을 보존하기 위해, 직접 화법이 아닌 선포 공식을 사용했습니다.
  doctrine_reference: 예언서 문체와 공적 계시 전달의 보존
