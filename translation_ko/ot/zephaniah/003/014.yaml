id: ZEP.3.14
reference: Zephaniah 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָנִּי֙ בַּת צִיּ֔וֹן הָרִ֖יעוּ יִשְׂרָאֵ֑ל שִׂמְחִ֤י וְ/עָלְזִי֙ בְּ/כָל לֵ֔ב בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/014.yaml
  text: Sing for joy[a], daughter Zion; shout aloud, Israel! Rejoice and exult with all your heart, daughter Jerusalem!
  footnotes:
  - marker: a
    text: Or 'Daughter of Zion' and 'Daughter of Jerusalem.' The Hebrew uses a personified city expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 딸 시온아, 기뻐하며 노래하라[a]. 이스라엘아, 소리 높여 외치라! 온 마음으로 기뻐하고 환호하라, 딸 예루살렘아!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온의 딸’, ‘예루살렘의 딸’로도 옮길 수 있습니다. 히브리어는 의인화된 도성 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  english_pob_choice: Sing for joy
  chosen_korean: 기뻐하며 노래하라
  alternatives_korean:
  - 환호하라
  - 노래하라
  lexicon: HALOT
  rationale: 히브리어 רנן의 기쁨에 찬 소리 내어 부르는 뜻을 살리기 위해, 단순한 ‘노래하다’보다 ‘기뻐하며 노래하라’로 옮겨 음악성과 환희를 함께 드러냈습니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 딸 시온
  alternatives_korean:
  - 시온의 딸
  - 오 시온의 딸
  lexicon: HALOT
  rationale: 의인화된 도성 호칭을 자연스러운 한국어로 유지하면서, 원문의 간결한 호격성을 보존하기 위해 ‘딸 시온’으로 옮겼습니다.
- source_word: הָרִיעוּ
  english_pob_choice: shout aloud
  chosen_korean: 소리 높여 외치라
  alternatives_korean:
  - 큰 소리로 외치라
  - 환성을 올리라
  lexicon: HALOT
  rationale: 공적이고 우렁찬 환호를 가리키는 동사이므로, 단순한 외침보다 집합적·축제적 뉘앙스를 살리는 ‘소리 높여 외치라’를 선택했습니다.
- source_word: וְעָלְזִי
  english_pob_choice: and exult
  chosen_korean: 환호하라
  alternatives_korean:
  - 크게 기뻐하라
  - 즐거워하라
  lexicon: HALOT
  rationale: שמח와 구별되는 들뜬 기쁨의 강도를 살리기 위해 ‘기뻐하다’보다 한층 강한 ‘환호하라’를 사용했습니다.
theological_decisions:
- issue: 의인화된 도성 호칭의 처리
  chosen_reading: ‘딸 시온’, ‘딸 예루살렘’으로 직역해, 도시를 인격적으로 부르는 예언적 호칭을 드러냈습니다.
  alternative_readings:
  - ‘시온의 딸’, ‘예루살렘의 딸’
  - 호격을 약화한 일반 명사화
  rationale: 본문은 도시를 딸로 부르는 시적·예언적 수사이므로, 이를 평이한 지명으로 바꾸지 않고 독자가 원문의 정서를 이해하도록 유지했습니다.
  doctrine_reference: 예언서의 시적 의인화와 언약 공동체에 대한 호칭
