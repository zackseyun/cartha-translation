id: ZEP.3.6
reference: Zephaniah 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִכְרַ֣תִּי גוֹיִ֗ם נָשַׁ֨מּוּ֙ פִּנּוֹתָ֔/ם הֶחֱרַ֥בְתִּי חֽוּצוֹתָ֖/ם מִ/בְּלִ֣י עוֹבֵ֑ר נִצְדּ֧וּ עָרֵי/הֶ֛ם מִ/בְּלִי אִ֖ישׁ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/006.yaml
  text: I have cut off nations[a]; their corner towers are laid waste. I have made their streets desolate, with no one passing through. Their cities are devastated, without a man[c][b], with no inhabitant.
  footnotes:
  - marker: a
    text: Or 'their corners,' possibly referring to corner fortifications or towers.
    reason: lexical_alternative
  - marker: b
    text: Or 'their squares' or 'their open places.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'without a man'; an idiom here for complete depopulation.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러 민족을 끊어 버렸습니다[a]. 그들의 모퉁이망대는 폐허가 되었습니다. 내가 그들의 거리들을 황폐하게 하여, 지나가는 사람도 없게 했습니다. 그들의 도시들은 황폐해져[b], 사람도[c] 없고 거주자도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 모퉁이들’로도 옮길 수 있으며, 성곽의 모퉁이 구조물이나 망대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광장들’ 혹은 ‘열린 공간들’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘남자 없이’라는 뜻의 관용구로, 여기서는 도시가 완전히 사람이 살지 않는 상태를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְרַתִּי
  english_pob_choice: I have cut off
  chosen_korean: 내가 … 끊어 버렸습니다
  alternatives_korean:
  - 내가 … 끊었습니다
  - 내가 … 멸하였습니다
  lexicon: HALOT
  rationale: 히필 כרת의 핵심은 ‘끊다/제거하다’이므로, 한국어도 구체적 동작감을 살린 ‘끊어 버리다’로 옮겼습니다. 예언적 과거 표현은 문맥상 현재적 효력을 지닌 선언으로 읽어 자연스럽게 과거 완료형을 사용했습니다.
- source_word: פִּנּוֹתָם
  english_pob_choice: their corner towers
  chosen_korean: 그들의 모퉁이망대
  alternatives_korean:
  - 그들의 모퉁이
  - 그들의 성곽 모퉁이
  - 그들의 망대
  lexicon: HALOT
  rationale: 문자적으로는 ‘그들의 모퉁이’이지만, 도시 파괴 문맥에서는 성곽의 모퉁이 구조물이나 망대를 가리킬 수 있어 POB의 해석을 따라 ‘모퉁이망대’로 구체화했습니다.
- source_word: חוּצוֹתָם
  english_pob_choice: their streets
  chosen_korean: 그들의 거리들
  alternatives_korean:
  - 그들의 광장들
  - 그들의 열린 공간들
  - 그들의 길거리들
  lexicon: HALOT
  rationale: חוּץ의 복수형은 도시의 거리나 공공 공간을 가리킬 수 있으므로, 가장 직접적이고 현대적인 대응어인 ‘거리들’을 택했습니다.
- source_word: מִבְּלִי עוֹבֵר
  english_pob_choice: with no one passing through
  chosen_korean: 지나가는 사람도 없게
  alternatives_korean:
  - 지나가는 자도 없게
  - 지나가는 이도 없게
  lexicon: HALOT
  rationale: ‘with no one passing through’의 지속적 부재를 한국어 부사절로 자연스럽게 재현했습니다. 단순한 결과가 아니라 통행이 완전히 끊긴 상태를 드러냅니다.
- source_word: מִבְּלִי אִישׁ
  english_pob_choice: without a man
  chosen_korean: 사람도
  alternatives_korean:
  - 남자도
  - 아무도
  lexicon: HALOT
  rationale: 히브리어는 단수 남성 명사 אִישׁ를 쓰지만, 한국어에서는 앞뒤의 ‘거주자도 없습니다’와 함께 도시의 완전한 무인 상태를 드러내기 위해 문맥상 ‘사람도’로 처리했습니다. POB의 남성성 표시를 본문에서는 살리지 않고 각주로 보완했습니다.
- source_word: מֵאֵין יוֹשֵׁב
  english_pob_choice: with no inhabitant
  chosen_korean: 거주자도 없습니다
  alternatives_korean:
  - 사는 사람도 없습니다
  - 거하는 자도 없습니다
  lexicon: HALOT
  rationale: יוֹשֵׁב는 ‘거주하는 자/사는 사람’이므로, 문어체이면서도 자연스러운 ‘거주자’로 옮겼습니다. 앞 구절과 병행을 이루도록 ‘없습니다’를 반복했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 시제와 화행
  chosen_reading: 하나님이 이미 행하신 것처럼 과거형으로 말하는 예언적 완결 표현으로 번역했습니다.
  alternative_readings:
  - 현재형 선언(‘끊습니다’)
  - 미래형 예고(‘끊을 것입니다’)
  rationale: 히브리어 완료형은 예언적 확정성을 드러내며, 여기서는 단순한 과거 회상보다 심판의 확실성을 선포하는 말투가 핵심입니다. 한국어도 그 확정성을 살리되 현대적 문체로 자연스럽게 처리했습니다.
  doctrine_reference: 예언 문체의 완료형(확정적 과거) 이해
- issue: אִישׁ의 성별 표지와 총체적 무인 상태
  chosen_reading: 본문에는 ‘사람도’로 자연화하되, 성별이 있는 히브리어 표현은 각주로 보존했습니다.
  alternative_readings:
  - ‘남자도’로 직역
  - ‘아무도’로 중성화
  rationale: 이 구절은 도시의 완전한 폐허를 나타내는 관용구이므로, 한국어 본문에서는 의미 전달을 우선하되 원문의 남성 단수 형식은 각주에서 설명하는 편이 가장 투명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
