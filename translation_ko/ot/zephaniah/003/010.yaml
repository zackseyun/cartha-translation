id: ZEP.3.10
reference: Zephaniah 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כ֑וּשׁ עֲתָרַ/י֙ בַּת פוּצַ֔/י יוֹבִל֖וּ/ן מִנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/010.yaml
  text: From beyond the rivers of Cush, my worshipers, the daughter of my dispersed ones, will bring my offering.
  footnotes:
  - marker: a
    text: Or 'my suppliants' instead of 'my worshipers.' The Hebrew term likely refers to those who pray or entreat, and by extension those who worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'the daughter of my scattered ones.' The Hebrew expression is compact and may function as a poetic title for a dispersed community.
    reason: alternative_reading
  - marker: c
    text: '''Cush'' refers to the ancient region south of Egypt, not precisely the same as modern Ethiopia.'
    reason: cultural_note
translation:
  language: ko
  text: 구스[c]의 강들 너머에서 내게 간구하는 이들[a], 곧 내 흩어진 이들의 딸[b]이 나에게 드릴 예물을 가져올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내게 간구하는 이들’은 ‘내 예배자들’ 또는 ‘내 간구자들’로도 옮길 수 있습니다. 히브리어는 본래 간구하거나 청원하는 사람을 가리키며, 문맥상 예배하는 이들을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 흩어진 이들의 딸’은 압축된 시적 표현입니다. 분산된 공동체를 가리키는 집합적·의인화된 명칭일 수 있으며, 이 구절에서 앞의 ‘내게 간구하는 이들’과의 정확한 문법적 관계는 불확정적입니다.
    reason: alternative_reading
  - marker: c
    text: ‘구스’는 현대 에티오피아와 정확히 동일하지 않은, 이집트 남쪽의 고대 지역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מֵעֵבֶר לְנַהֲרֵי כוּשׁ
  english_pob_choice: From beyond the rivers of Cush
  chosen_korean: 구스의 강들 저편에서
  alternatives_korean:
  - 구스의 강 건너편에서
  - 구스 강들 너머에서
  lexicon: HALOT
  rationale: מֵעֵבֶר는 경계 너머/저편을 뜻하므로 한국어에서도 ‘저편에서’로 지리적 방향성을 자연스럽게 살렸습니다. כוּשׁ은 현대 국가명이 아니라 고대 지명인 구스로 옮겼습니다.
- source_word: עֲתָרַי
  english_pob_choice: my worshipers
  chosen_korean: 내 예배자들
  alternatives_korean:
  - 내 간구하는 자들
  - 내 구하는 자들
  lexicon: HALOT
  rationale: 어근 עתר는 간구하다/청원하다의 뜻이 강하지만, 문맥상 여호와께 나아와 섬기는 사람들을 가리키므로 한국어에서는 ‘예배자들’이 예배적 의미를 더 자연스럽게 드러냅니다.
- source_word: בַּת פוּצַי
  english_pob_choice: the daughter of my dispersed ones
  chosen_korean: 내 흩어진 자들의 딸
  alternatives_korean:
  - 내 흩어진 자들의 딸
  - 내 흩어진 이들의 딸
  lexicon: HALOT
  rationale: בַּת는 집합적·의인화된 표현을 유지하는 것이 중요하므로 ‘딸’을 그대로 살렸습니다. פוץ의 분산/흩어짐을 ‘흩어진 자들’로 옮겨 포로·산재된 공동체 이미지를 보존했습니다.
- source_word: מִנְחָתִי
  english_pob_choice: my offering
  chosen_korean: 내 예물
  alternatives_korean:
  - 내 제물
  - 내 헌물
  lexicon: HALOT
  rationale: מִנְחָה는 제의적 ‘예물/헌물’과 상위자에게 바치는 ‘공물’의 폭이 있으나, 여기서는 하나님께 드리는 문맥이므로 특정 제사 종류로 좁히지 않는 ‘예물’이 적절합니다.
theological_decisions:
- issue: עֲתָרַי의 의미 범위
  chosen_reading: ‘예배자들’로 옮겨 간구하는 자라는 어감은 보존하되, 문맥상 하나님께 나아와 경배하는 공동체를 드러냈습니다.
  alternative_readings:
  - ‘간구하는 자들’로 더 직역하기
  - ‘청하는 자들’로 옮기기
  rationale: 이 절은 열방이 예물을 가지고 오는 회복의 장면이므로, 단순한 청원자를 넘어 예배 공동체를 가리키는 방향이 더 잘 전달됩니다.
  doctrine_reference: 시 22:27; 사 56:7
