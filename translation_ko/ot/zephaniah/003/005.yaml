id: ZEP.3.5
reference: Zephaniah 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֤ה צַדִּיק֙ בְּ/קִרְבָּ֔/הּ לֹ֥א יַעֲשֶׂ֖ה עַוְלָ֑ה בַּ/בֹּ֨קֶר בַּ/בֹּ֜קֶר מִשְׁפָּט֨/וֹ יִתֵּ֤ן לָ/אוֹר֙ לֹ֣א נֶעְדָּ֔ר וְ/לֹֽא יוֹדֵ֥עַ עַוָּ֖ל בֹּֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/005.yaml
  text: Yahweh is righteous in her midst; he does no injustice[a]. Morning by morning he brings his justice to light; it does not fail. But the unjust knows no shame.
  footnotes:
  - marker: a
    text: Or 'he brings his judgment to light.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 그 성읍 한가운데에 계시며 의로우십니다. 그분은 불의를 행하지 않으십니다. 아침마다 그분의 공의를[a] 빛 가운데 드러내시며, 그것이 빠지는 일이 없습니다. 그러나 불의한 자는 수치를 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 심판’을 빛 가운데 드러내신다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/Hebrew Tetragrammaton
  rationale: 원문 고유명사 יהוה를 제목어가 아닌 신명으로 살리기 위해 음역인 ‘야훼’를 사용했습니다. 이는 POB의 ‘Yahweh’ 처리와 대응합니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로우십니다
  alternatives_korean:
  - 의롭습니다
  - 의인입니다
  lexicon: HALOT
  rationale: 야훼의 성품을 나타내는 서술형 형용사로서 ‘의롭다’보다 공적·언약적 성격을 함께 담는 ‘의로우십니다’가 적절합니다.
- source_word: לֹא יַעֲשֶׂה עַוְלָה
  english_pob_choice: he does no injustice
  chosen_korean: 그는 불의를 행하지 않으십니다
  alternatives_korean:
  - 그는 불의를 하지 않으십니다
  - 그는 죄악을 행하지 않으십니다
  lexicon: HALOT
  rationale: עַוְלָה는 단순한 ‘잘못’보다 도덕적·법적 ‘불의’를 가리키므로, 행위 동사와 함께 자연스럽게 ‘불의를 행하지 않으십니다’로 옮겼습니다.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  english_pob_choice: Morning by morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 매일 아침
  - 아침마다 아침마다
  lexicon: HALOT
  rationale: 히브리어 반복은 지속적·정기적 행위를 나타내므로, 한국어에서는 관용적인 반복 부사 ‘아침마다’로 압축해 살렸습니다.
- source_word: מִשְׁפָּטוֹ
  english_pob_choice: his justice
  chosen_korean: 그의 공의
  alternatives_korean:
  - 그의 심판
  - 그의 판결
  lexicon: HALOT
  rationale: 문맥상 앞의 ‘의로우심’과 뒤의 ‘불의’와 평행을 이루는 개념은 판결 한 번보다 지속되는 공적 정의이므로 ‘공의’가 더 적절합니다.
- source_word: וְלֹא יוֹדֵעַ עַוָּל בֹּשֶׁת
  english_pob_choice: But the unjust knows no shame
  chosen_korean: 그러나 불의한 자는 수치를 알지 못합니다
  alternatives_korean:
  - 그러나 불의한 자는 부끄러움을 알지 못합니다
  - 그러나 악인은 수치를 모릅니다
  lexicon: HALOT
  rationale: עַוָּל은 형용사적 명사로 ‘불의한 자’가 자연스럽고, בֹּשֶׁת는 내적 도덕 감각의 결핍을 드러내는 ‘수치’가 원문 긴장을 잘 반영합니다.
theological_decisions:
- issue: בְּקִרְבָּהּ의 지시 대상과 성별 표지
  chosen_reading: 여성형 어미를 유지해 예루살렘/시온을 가리키는 ‘그들 한가운데서’(=도시 공동체의 중심)로 읽되, 문장 전체는 한국어 자연성을 위해 ‘그들 한가운데서’로 옮겼습니다.
  alternative_readings:
  - 그녀 한가운데서
  - 그 도시의 한가운데서
  rationale: 히브리어는 여성형 접미사를 사용해 의인화된 도시를 가리키지만, 한국어에서 ‘그녀’가 다소 부자연스러울 수 있어 문맥의 공동체적 공간성을 살린 표현으로 조정했습니다.
  doctrine_reference: translation philosophy §4 (gender-accurate over gender-neutral)
- issue: מִשְׁפָּטוֹ의 의미 선택
  chosen_reading: ‘공의’로 번역해 야훼의 지속적이고 드러나는 정의 행위를 강조했습니다.
  alternative_readings:
  - 심판
  - 판결
  rationale: 이 절은 야훼의 성품과 악인의 수치를 대조하므로, 단회적 판결보다 지속되는 정의의 প্রকাশ을 가리키는 ‘공의’가 더 넓은 문맥에 부합합니다.
  doctrine_reference: translation philosophy §5 (consistency of key terms, or documented exception)
