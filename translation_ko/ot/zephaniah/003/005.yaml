  to: 야훼께서는 그 성읍 한가운데에 계시며 의로우십니다. 그분은 불의를 행하지 않으십니다. 아침마다 그분의 공의를[a] 빛 가운데 드러내시며, 그것이 빠지는 일이 없습니다. 그러나 불의한 자는 수치를 알지 못합니다.
  rationale: 여성 단수 도시 지시 대상은 한국어에서 성별 표지를 강제하지 않으면서 ‘그 성읍’으로 명확히 했습니다. 원문의 반복적 시간 표현, 공의의 공개적 현현, 그리고 그것이 결코 결여되지 않음을 자연스러운 합쇼체로 보존했습니다. 각주는 해당 히브리어 명사 מִשְׁפָּטוֹ에 정확히 연결했습니다.
  reviewer_model: gpt-5.6-terra
