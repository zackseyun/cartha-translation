language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֤ן חַכּוּ לִ/י֙ נְאֻם יְהוָ֔ה לְ/י֖וֹם קוּמִ֣/י לְ/עַ֑ד כִּ֣י מִשְׁפָּטִ/י֩ לֶ/אֱסֹ֨ף גּוֹיִ֜ם לְ/קָבְצִ֣/י מַמְלָכ֗וֹת לִ/שְׁפֹּ֨ךְ עֲלֵי/הֶ֤ם זַעְמִ/י֙ כֹּ֚ל חֲר֣וֹן אַפִּ֔/י כִּ֚י בְּ/אֵ֣שׁ קִנְאָתִ֔/י תֵּאָכֵ֖ל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/008.yaml
  text: Therefore wait for me[a], declares Yahweh, for the day when I rise up for plunder; for my judgment is to gather nations, to assemble kingdoms, to pour out on them my indignation, all my burning anger[c][b]; for in the fire of my jealousy all the earth will be consumed.
  footnotes:
  - marker: a
    text: Or, “for the day when I rise up for prey.” The Hebrew term rendered “as a witness” is difficult and may be understood differently.
    reason: alternative_reading
  - marker: b
    text: “Jealousy” may also be rendered “zeal.”
    reason: lexical_alternative
  - marker: c
    text: “Earth” may also be translated “land,” but the broader context of nations and kingdoms supports the wider sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내게 기다리십시오[a] — 야훼의 선언입니다 — 내가 일어나 징벌하는 날을 위하여; 내 심판은 나라들을 모으고, 왕국들을 집결시키고, 내 분노를 그들 위에 쏟아붓기 위한 것이니, 곧 내 질투의 불로 온 땅이 삼켜질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “나를 노략할 날을 위하여.” 히브리어 לְעַד는 뜻이 어려워 다르게 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַכּוּ לִי
  english_pob_choice: wait for me
  chosen_korean: 내게 기다리십시오
  alternatives_korean:
  - 나를 기다리십시오
  - 나를 기다려 주십시오
  lexicon: HALOT
  rationale: משולח imperative plural with ל marks waiting directed toward 야훼이므로, 한국어에서도 대상을 분명히 드러내는 ‘내게 기다리십시오’가 자연스럽고 문맥상 압박을 보존합니다.
- source_word: לְיוֹם קוּמִי לְעַד
  english_pob_choice: for the day when I rise up as a witness
  chosen_korean: 내가 일어나 징벌하는 날을 위하여
  alternatives_korean:
  - 내가 일어나 증언하는 날을 위하여
  - 내가 일어나 노략할 날을 위하여
  lexicon: HALOT
  rationale: לְעַד는 본문 전승상 의미가 어려워 ‘증언/증거’와 ‘노략/징벌’ 계열 해석이 갈리므로, 바로 이어지는 משפטי와 열방을 모아 심판하는 문맥에 맞는 징벌의 뜻을 본문에 반영했습니다.
- source_word: זַעְמִי / כֹּל חֲרוֹן אַפִּי
  english_pob_choice: my indignation / all my burning anger
  chosen_korean: 내 분노 / 내 분노가 가득한 분노
  alternatives_korean:
  - 내 격분 / 내 타오르는 분노
  - 내 노여움 / 내 맹렬한 노여움
  lexicon: HALOT
  rationale: 두 개의 분노 표현이 병렬로 있어 어휘를 과도하게 평준화하지 않고, 첫 항은 ‘분노’, 둘째는 ‘내 분노를 가득한 분노’가 아니라 문맥에 맞는 강도 상승으로 풀어 ‘분노를 쏟아붓기’와 ‘불’ 이미지가 살아나도록 했습니다.
- source_word: בְּאֵשׁ קִנְאָתִי
  english_pob_choice: in the fire of my jealousy
  chosen_korean: 내 질투의 불로
  alternatives_korean:
  - 내 열정의 불로
  - 내 열심의 불로
  lexicon: HALOT
  rationale: קִנְאָה는 여기서 언약적 배타성을 지키는 하나님의 질투를 가리키므로, 한국어의 ‘열심’보다 ‘질투’가 원뜻과 신학적 긴장을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 고유 신명 יְהוָה는 음역형 ‘야훼’로 옮겨, 예언자적 발화의 직접성을 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 이사야적 예언 선언문에서의 문체
  chosen_reading: 선지자 선언구를 ‘야훼의 선언입니다’로 처리
  alternative_readings:
  - ‘주께서 말씀하십니다’
  - ‘여호와의 말씀이니라’
  rationale: 예언 공식 נְאֻם יְהוָה의 권위를 살리되 현대 합쇼체에 맞춰 격식을 유지했습니다. 직접 인용이 아니므로 청자 호칭의 문체 전환은 없습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension/ambiguity in footnotes)
