id: ZEP.3.3
reference: Zephaniah 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂרֶ֣י/הָ בְ/קִרְבָּ֔/הּ אֲרָי֖וֹת שֹֽׁאֲגִ֑ים שֹׁפְטֶ֨י/הָ֙ זְאֵ֣בֵי עֶ֔רֶב לֹ֥א גָרְמ֖וּ לַ/בֹּֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/003.yaml
  text: Her officials within her are roaring lions[a]; her judges are evening wolves that leave nothing for the morning.
  footnotes:
  - marker: a
    text: Or, more literally, 'they do not leave a bone until morning.' The Hebrew idiom pictures total, ravenous consumption.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍 안에 있는 관리들은 포효하는 사자들입니다. 그 재판관들은 저녁의 늑대들로서 아침까지 아무것도 남기지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리, 더 직역하면 ‘그들은 아침까지 뼈 하나도 남기지 않는다’입니다. 이 히브리어 관용구는 완전하고 탐욕스러운 포식을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  english_pob_choice: her officials
  chosen_korean: 그 성읍의 관리들
  alternatives_korean:
  - 그녀의 대신들
  - 그녀의 통치자들
  - 그 성읍의 지도자들
  lexicon: HALOT
  rationale: שַׂר는 왕자뿐 아니라 통치 관료, 고관, 관리까지 아우를 수 있으므로, 이 문맥의 공적 지도층을 현대 한국어로 가장 자연스럽고 정확하게 드러내는 ‘관리들’을 택했습니다.
- source_word: בְקִרְבָּהּ
  english_pob_choice: within her
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그 가운데
  - 그 한복판에서
  - 그 성읍의 내부에서
  lexicon: HALOT
  rationale: 직역적 의미는 ‘그 한가운데/내부’이지만, 한국어에서는 앞의 ‘성읍’과 자연스럽게 이어지는 ‘그 안에서’가 본문의 내부성을 간결하게 보존합니다.
- source_word: אֲרָיוֹת שֹׁאֲגִים
  english_pob_choice: roaring lions
  chosen_korean: 포효하는 사자들
  alternatives_korean:
  - 으르렁거리는 사자들
  - 포효하는 사자들입니다
  - 울부짖는 사자들
  lexicon: HALOT
  rationale: שֹׁאֲגִים은 맹수의 사나운 울부짖음/포효를 가리키므로, ‘포효하는’이 사자의 위협성과 공격성을 가장 잘 살립니다.
- source_word: זְאֵבֵי עֶרֶב
  english_pob_choice: evening wolves
  chosen_korean: 저녁의 늑대들
  alternatives_korean:
  - 황혼의 늑대들
  - 저물녘 늑대들
  - 저녁때의 늑대들
  lexicon: HALOT
  rationale: 직역 구조인 ‘저녁의 늑대들’을 유지해, 해질 무렵 활동하는 포식자의 이미지를 선명하게 보존했습니다.
- source_word: לֹא גָרְמוּ לַבֹּקֶר
  english_pob_choice: they leave nothing for the morning
  chosen_korean: 아침까지 아무것도 남기지 않습니다
  alternatives_korean:
  - 아침까지 뼈도 남기지 않습니다
  - 아침까지 흔적도 남기지 않습니다
  - 아침을 위해 아무것도 남겨 두지 않습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘뼈를 아침까지 남기지 않는다’는 뜻으로 잔혹한 완전 포식을 묘사하지만, 본문이 의도하는 전면적 약탈의 힘을 현대 한국어로 가장 분명하게 전달하는 표현을 택했습니다.
theological_decisions:
- issue: 도시 지도자들에 대한 예언적 비난의 직설성
  chosen_reading: 지도층을 사자와 늑대의 이미지로 비유해, 공적 책임을 가진 이들의 포식성과 폭력을 강하게 드러냈습니다.
  alternative_readings:
  - 보다 완화된 도덕적 비판으로 옮김
  - ‘관료’ 대신 중립적인 ‘지도자’로 약화
  rationale: 본문은 단순한 부패 지적이 아니라 공동체를 집어삼키는 폭력을 고발하므로, 은유의 공격성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 예언서의 사회윤리적 심판 언어
