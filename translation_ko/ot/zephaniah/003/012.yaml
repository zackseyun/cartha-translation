  text: וְ/הִשְׁאַרְתִּ֣י בְ/קִרְבֵּ֔/ךְ עַ֥ם עָנִ֖י וָ/דָ֑ל וְ/חָס֖וּ בְּ/שֵׁ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/012.yaml
  text: But I will leave in your midst a people humble and lowly[a], and they will take refuge in the name of Yahweh.
  footnotes:
  - marker: a
    text: Or 'a people afflicted and poor' or 'a poor and needy people.' The Hebrew terms can emphasize social affliction and poverty as well as humility and lowliness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 너희 한가운데에 겸손하고 낮은 백성을 남겨 둘 것이며, 그들은 야훼의 이름에 피난할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난받고 가난한 백성’ 혹은 ‘가난하고 궁핍한 백성’으로도 옮길 수 있습니다. 히브리어 두 말은 사회적 억압과 빈곤뿐 아니라 겸손과 낮아짐도 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  english_pob_choice: But I will leave
  chosen_korean: 그러나 내가 남겨 둘 것이며
  alternatives_korean:
  - 그리고 내가 남겨 둘 것이며
  - 내가 남겨 둘 것이며
  - 내가 남겨 두게 할 것이며
  lexicon: HALOT
  rationale: 히필형은 ‘남게 하다/남겨 두다’의 사역적 의미를 가지므로 능동적 하나님의 행위를 살렸고, 선행 문맥의 심판과 대비되는 전환을 한국어 ‘그러나’로 옮겼습니다.
- source_word: בְקִרְבֵּךְ
  english_pob_choice: in your midst
  chosen_korean: 너희 한가운데에
  alternatives_korean:
  - 너희 가운데에
  - 너희 가운데서
  - 너희 안에
  lexicon: HALOT
  rationale: 예루살렘을 여성 단수로 부르는 집합적 주소를 한국어에서는 복수적 공동체 감각이 자연스러운 ‘너희 한가운데에’로 옮겨, 도시/공동체 내부라는 공간성을 보존했습니다.
- source_word: עָנִי וָדָל
  english_pob_choice: humble and lowly
  chosen_korean: 겸손하고 낮은
  alternatives_korean:
  - 가난하고 궁핍한
  - 억눌리고 가난한
  - 겸손하고 가난한
  lexicon: HALOT
  rationale: 두 형용사는 사회적 비천함과 의존성을 함께 가리킬 수 있으므로, POB의 판단을 따라 경제적 빈곤만으로 좁히지 않고 ‘겸손하고 낮은’으로 처리해 신학적·사회적 긴장을 유지했습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름에
  alternatives_korean:
  - 야훼의 이름으로
  - 야훼의 이름 안에
  - 주님의 이름에
  lexicon: HALOT
  rationale: בְּ + ‘이름’은 그 이름이 나타내는 인격과 권위에 의지함을 뜻하므로 ‘이름에 피난하다’라는 동사를 살렸고, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: עָנִי וָדָל의 의미 범위
  chosen_reading: ‘겸손하고 낮은 백성’으로 번역하여 사회적 가난과 하나님께 의존하는 낮은 자세를 함께 드러냈습니다.
  alternative_readings:
  - 가난하고 궁핍한 백성
  - 억눌리고 가난한 백성
  rationale: 문맥상 남겨진 남은 자의 상태는 단순한 경제적 빈곤만이 아니라 야훼께 피난하는 태도와 연결되므로, 두 차원을 함께 살리는 표현이 더 충실합니다.
  doctrine_reference: optimal equivalence; remnant theology
