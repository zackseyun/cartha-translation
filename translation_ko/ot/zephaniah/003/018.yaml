source:
  edition: WLC
  text: נוּגֵ֧י מִ/מּוֹעֵ֛ד אָסַ֖פְתִּי מִמֵּ֣/ךְ הָי֑וּ מַשְׂאֵ֥ת עָלֶ֖י/הָ חֶרְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/018.yaml
  text: I have gathered those grieving over the appointed festival from you[a]; they were a reproach upon her[c][b], a burden.
  footnotes:
  - marker: a
    text: Or 'those afflicted from the appointed assembly'; the Hebrew is difficult, and the phrase may refer either to people grieving because they are deprived of the festival or to those removed from the festal gathering.
    reason: alternative_reading
  - marker: b
    text: Or 'I gathered' or, in prophetic context, 'I will gather.'
    reason: lexical_alternative
  - marker: c
    text: The pronoun 'her' likely refers to Zion/Jerusalem.
    reason: cross_reference
translation:
  language: ko
  text: 나는 네게서 절기로 말미암아 애통하는 이들을 모았습니다[a][b]. 그들은 그 성읍에 수치가 되는 짐이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 어려우며, 이 표현은 절기 모임을 잃어 애통하는 이들을 가리킬 수도 있고 절기 모임에서 제외되거나 멀어진 이들을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내가 모았다’로, 예언적 문맥에서는 ‘내가 모으겠다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 성읍’은 여성 단수 대명사를 풀어 옮긴 것이며, 시온 또는 예루살렘을 가리킬 가능성이 큽니다.
    reason: cross_reference
lexical_decisions:
- source_word: נוּגֵי מִמּוֹעֵד
  english_pob_choice: those grieving over the appointed festival
  chosen_korean: 절기에 대해 슬퍼하는 이들
  alternatives_korean:
  - 절기로 인해 슬퍼하는 이들
  - 정해진 절기로 애통하는 이들
  - 절기 때문에 괴로워하는 이들
  lexicon: HALOT
  rationale: נוּגֵי는 슬픔·애통의 상태를 가리키는 분사적 표현이므로, 사람을 주어로 살려 ‘슬퍼하는 이들’로 옮겼습니다. מִמּוֹעֵד은 절기와 관련된 근거를 나타내므로 ‘절기에 대해’로 처리해 예배 절기의 상실이라는 뉘앙스를 살렸습니다.
- source_word: מִמֵּךְ
  english_pob_choice: from you
  chosen_korean: 너에게서
  alternatives_korean:
  - 네게서
  - 네 안에서
  - 너로부터
  lexicon: HALOT
  rationale: 2인칭 여성 단수 어미가 지시하는 시온/예루살렘을 직접 살리기 위해 자연스러운 현대 한국어인 ‘너에게서’로 옮겼습니다.
- source_word: מַשְׂאֵת
  english_pob_choice: a burden
  chosen_korean: 수치
  alternatives_korean:
  - 짐
  - 부담
  - 치욕
  lexicon: HALOT
  rationale: 문맥상 단순한 물리적 ‘짐’보다 공동체에 얹힌 사회적 수치·수모가 핵심이므로, 뒤의 חֶרְפָּה와 함께 읽힐 때 의미를 분명히 드러내는 ‘수치’를 택했습니다.
- source_word: חֶרְפָּה
  english_pob_choice: a reproach
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 모욕
  - 수모
  lexicon: HALOT
  rationale: חרפה는 공적 모욕과 수치의 의미를 가지므로, 한국어에서 가장 직접적으로 대응되는 ‘수치’로 옮겼습니다. 앞의 ‘수치’와 겹치지만, 두 명사는 מקור에서 병렬적으로 놓인 압축 표현이라 중복을 일부 유지하는 편이 원문에 가깝습니다.
theological_decisions:
- issue: 마지막 절의 압축적 관계구문 처리
  chosen_reading: 그들은 그에게는, 곧 수치였습니다.
  alternative_readings:
  - 그들은 그 위에 수치의 짐이었습니다.
  - 그들은 그녀에게 수치가 되는 짐이었습니다.
  - 그들은 그녀 위의 수치였습니다.
  rationale: 히브리어는 ‘부담/짐’과 ‘수치’를 압축적으로 병치하여 관계를 완전히 해명하지 않습니다. 한국어에서도 해석을 과도하게 풀지 않고, ‘수치’가 공동체와 시온에 얹힌 상태임을 남겨 두는 쪽이 원문 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
