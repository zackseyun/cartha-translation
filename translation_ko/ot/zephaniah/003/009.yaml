id: ZEP.3.9
reference: Zephaniah 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אָ֛ז אֶהְפֹּ֥ךְ אֶל עַמִּ֖ים שָׂפָ֣ה בְרוּרָ֑ה לִ/קְרֹ֤א כֻלָּ/ם֙ בְּ/שֵׁ֣ם יְהוָ֔ה לְ/עָבְד֖/וֹ שְׁכֶ֥ם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/009.yaml
  text: For then I will change the speech of the peoples to a pure speech[c][b][a], so that all of them may call on the name of Yahweh and serve him with one accord.
  footnotes:
  - marker: a
    text: Hebrew literally, 'I will turn to the peoples a pure lip.' The phrase may mean purified speech, purified lips, or a restored pure language.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
  - marker: c
    text: Hebrew literally, 'with one shoulder,' an idiom for united service or acting shoulder to shoulder.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 만민에게서 순수한 말을 바꾸어 주어 그들 모두가 야훼의 이름을 부르고 한마음으로 그를 섬기게 하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 만민에게 순수한 입술을 돌리겠다’에 가깝습니다. 여기에는 정결하게 된 말, 정화된 입술, 또는 회복된 순수한 언어라는 뜻이 모두 가능할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 하나님의 이름 יְהוָה는 본문에서 직접 쓰인 신명이며, 다른 번역 전통에서는 ‘주님’으로 옮기기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘한 어깨로’는 함께 힘을 모아 섬긴다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז אֶהְפֹּךְ
  english_pob_choice: For then I will change
  chosen_korean: 그때 내가 … 바꾸어 주어
  alternatives_korean:
  - 그때 내가 … 바꾸겠습니다
  - 그때 내가 … 변화시키겠습니다
  - 그때 내가 … 뒤집겠습니다
  lexicon: HALOT
  rationale: הפך는 ‘뒤집다/바꾸다/변하다’의 범위가 있으므로, 여기서는 결과를 새 상태로 옮기는 의미를 살려 ‘바꾸어 주어’로 옮겼습니다.
- source_word: עַמִּים שָׂפָה בְרוּרָה
  english_pob_choice: the speech of the peoples to a pure speech
  chosen_korean: 만민에게서 순수한 말
  alternatives_korean:
  - 백성들에게 순결한 입술
  - 민족들의 깨끗한 언어
  - 만민의 순수한 언어
  lexicon: HALOT
  rationale: שָׂפָה는 문자적으로 ‘입술’이지만 여기서는 발화/언어를 가리키는 메타포이므로, 현대 한국어에서 자연스러운 ‘말’을 택하되 정결·정화의 뉘앙스를 ‘순수한’으로 살렸습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: the name of Yahweh
  chosen_korean: 야훼의 이름
  alternatives_korean:
  - 여호와의 이름
  - 주님의 이름
  lexicon: HALOT
  rationale: 본문의 신명문자 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, ‘이름을 부르다’라는 예배적 관용구를 그대로 유지했습니다.
- source_word: לְעָבְדוֹ שְׁכֶם אֶחָד
  english_pob_choice: and serve him with one accord
  chosen_korean: 한마음으로 그를 섬기게
  alternatives_korean:
  - 어깨를 맞대고 그를 섬기게
  - 한 어깨로 그를 섬기게
  - 뜻을 합하여 그를 섬기게
  lexicon: HALOT
  rationale: עבד는 ‘섬기다’와 예배의 뉘앙스를 함께 가지므로 넓게 살렸고, שְׁכֶם אֶחָד의 ‘one shoulder’ 관용구는 한국어 관용 표현 ‘한마음으로’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 YHWH를 직접 사용하므로, 프로젝트 기준에 따라 언약적 신명 표기를 보존하는 ‘야훼’를 본문에 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘one shoulder’ 관용구의 번역
  chosen_reading: 한마음으로
  alternative_readings:
  - 어깨를 나란히 하여
  - 한 어깨로
  - 어깨를 맞대고
  rationale: 히브리어의 문자적 이미지는 유지할 가치가 있으나, 이 절의 핵심은 분열된 백성이 하나로 모여 섬기는 연합이므로 한국어 독자가 즉시 이해할 수 있는 합심의 의미를 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: preserve theological tension rather than resolve it'
