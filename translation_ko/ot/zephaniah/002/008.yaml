  text: 「나는 모압의 비방과 암몬 자손들의 욕설을 들었습니다[a]. 그들은 그것으로 내 백성을 모욕하고, 그들의 경계를 대적하여 스스로를 높였습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
