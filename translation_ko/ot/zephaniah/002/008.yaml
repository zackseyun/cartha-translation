id: ZEP.2.8
reference: Zephaniah 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמַ֨עְתִּי֙ חֶרְפַּ֣ת מוֹאָ֔ב וְ/גִדּוּפֵ֖י בְּנֵ֣י עַמּ֑וֹן אֲשֶׁ֤ר חֵֽרְפוּ֙ אֶת עַמִּ֔/י וַ/יַּגְדִּ֖ילוּ עַל גְּבוּלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/008.yaml
  text: I have heard the reproach of Moab and the insults of the sons of Ammon[b][a], with which they reproached my people and magnified themselves against their border.
  footnotes:
  - marker: a
    text: Or 'the Ammonites' for 'the sons of Ammon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'boasted against their border' or 'magnified themselves against their territory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「나는 모압의 수치와 암몬 자손의 모욕을 들었습니다. 그들이 내 백성을 모욕하고, 그들의 경계에 대하여 스스로 커졌기 때문입니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 사람들’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 영토를 향하여 스스로 커졌습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  english_pob_choice: I have heard
  chosen_korean: 나는 … 들었습니다
  alternatives_korean:
  - 나는 … 들었습니다
  - 나는 … 들었소
  lexicon: HALOT
  rationale: 완료된 사실이 현재의 심판 선언으로 이어지는 예언자적 발화를 살려, 한국어에서는 자연스러운 완료형으로 옮겼습니다.
- source_word: חֶרְפַּת
  english_pob_choice: the reproach
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 모욕
  lexicon: HALOT
  rationale: 공적 수치와 경멸의 뜻을 함께 담기 위해 ‘수치’를 택했습니다. ‘모욕’도 가능하지만 뒤의 גִּדּוּפֵי와의 반복을 피했습니다.
- source_word: גִדּוּפֵי
  english_pob_choice: the insults
  chosen_korean: 모욕
  alternatives_korean:
  - 욕설
  - 비방
  lexicon: HALOT
  rationale: 상대를 향한 공격적 언사를 가리키므로 현대 한국어에서 분명한 ‘모욕’이 적절합니다.
- source_word: וַיַּגְדִּילוּ
  english_pob_choice: magnified themselves
  chosen_korean: 스스로 커졌기 때문입니다
  alternatives_korean:
  - 스스로 위대해졌기 때문입니다
  - 교만해졌기 때문입니다
  lexicon: HALOT
  rationale: 히필의 ‘크게 하다’라는 이미지를 직접 살려, 해석을 덧붙이기보다 자기과시적 우월 행위를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: עַל גְּבוּלָם의 지시 대상
  chosen_reading: ‘그들의 경계’는 직전의 ‘내 백성’을 가리키는 것으로 이해하되 본문에는 그대로 유지했습니다.
  alternative_readings:
  - 그들 자신의 경계
  - 그들의 영토
  rationale: 히브리어는 3인칭 복수 소유격을 보존하고 있어, 본문에서는 문법적 형식을 살리면서도 문맥상 유다의 경계를 뜻하는 것으로 읽었습니다.
  doctrine_reference: 문맥 우선의 서술 보존
