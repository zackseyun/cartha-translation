source:
  edition: WLC
  text: נוֹרָ֤א יְהוָה֙ עֲלֵי/הֶ֔ם כִּ֣י רָזָ֔ה אֵ֖ת כָּל אֱלֹהֵ֣י הָ/אָ֑רֶץ וְ/יִשְׁתַּֽחֲווּ ל/וֹ֙ אִ֣ישׁ מִ/מְּקוֹמ֔/וֹ כֹּ֖ל אִיֵּ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/011.yaml
  text: Yahweh will be fearsome against them[a], for he will make all the gods of the earth waste away; and they will bow down to him, each from his own place[b], all the coastlands of the nations.
  footnotes:
  - marker: a
    text: Or 'will famish all the gods of the earth.' The Hebrew verb literally refers to becoming lean or emaciated.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the islands of the nations.' 'Coastlands' is a common prophetic term for distant maritime peoples and regions.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 그들을 두렵게 하실 것입니다. 이는 그분께서 땅의 모든 신들을 쇠약하게 하실 것이기 때문입니다.[a] 모든 나라의 해안 지역 사람들이[b] 저마다 자기 처소에서 그분께 엎드려 경배할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 모든 신들을 굶주리게 하실 것입니다.’ 히브리어 동사는 문자적으로 여위고 쇠약해지는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 나라의 섬들.’ ‘해안 지역’은 먼 바닷가 지역과 민족을 가리키는 예언서의 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא יְהוָה עֲלֵיהֶם
  english_pob_choice: Yahweh will be fearsome against them
  chosen_korean: 야훼는 그들에게 두려운 분이십니다
  alternatives_korean:
  - 야훼는 그들 위에 두려운 분이십니다
  - 야훼는 그들에게 두려우신 분이십니다
  lexicon: HALOT
  rationale: נוֹרָא는 단순한 상태보다 ‘두려움을 일으키는’ 성격을 가리키므로, 한국어에서는 ‘두려운 분’으로 옮겨 야훼의 위엄과 심판성을 살렸습니다.
- source_word: רָזָה אֵת כָּל אֱלֹהֵי הָאָרֶץ
  english_pob_choice: he will make all the gods of the earth waste away
  chosen_korean: 땅의 모든 신들을 쇠약하게 하시기 때문입니다
  alternatives_korean:
  - 땅의 모든 신들을 마르게 하시기 때문입니다
  - 땅의 모든 신들을 파리하게 하시기 때문입니다
  lexicon: HALOT
  rationale: רָזָה는 문자적으로 ‘여위다/쇠약해지다’의 뜻이므로, 우상 숭배의 결과까지 설명하지 않고도 원문 이미지가 살아 있는 ‘쇠약하게 하시다’를 택했습니다.
- source_word: וְיִשְׁתַּחֲווּ לוֹ
  english_pob_choice: and they will bow down to him
  chosen_korean: 그분께 엎드려 경배할 것이며
  alternatives_korean:
  - 그분께 절할 것이며
  - 그분께 경배할 것이며
  lexicon: HALOT
  rationale: 히브리어 동사는 몸을 낮추는 행위와 예배를 함께 담으므로, ‘엎드려 경배하다’로 옮겨 물리적 동작과 예배적 의미를 함께 살렸습니다.
- source_word: כֹּל אִיֵּי הַגּוֹיִם
  english_pob_choice: all the coastlands of the nations
  chosen_korean: 모든 나라의 해안 지역
  alternatives_korean:
  - 모든 나라의 섬들
  - 모든 나라의 해안들
  lexicon: HALOT
  rationale: אִיִּים은 문맥상 문자적 섬보다 먼 해안 지방을 가리키는 예언서 관용어로 자주 쓰이므로, ‘해안 지역’으로 옮겨 지리적·시적 범위를 함께 반영했습니다.
theological_decisions:
- issue: 야훼의 ‘두려움’ 표현을 현대 한국어에서 어떻게 유지할지
  chosen_reading: ‘두려운 분’으로 직역에 가깝게 유지해, 심판의 위엄이 약화되지 않도록 했습니다.
  alternative_readings:
  - ‘경외로우신 분’
  - ‘두려움을 주시는 분’
  rationale: 본문은 단순한 감정이 아니라 열방 앞에 드러나는 야훼의 위협적 권위를 말하므로, 부드럽게 순화하기보다 원문의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 마지막 절의 예배가 예루살렘 중심의 순례인지 분산된 열방 예배인지
  chosen_reading: ‘각자 자기 처소에서’로 옮겨, 열방이 각자의 위치에서 야훼께 경배하는 그림을 살렸습니다.
  alternative_readings:
  - ‘각자 제자리에’
  - ‘예루살렘으로 올라가’
  rationale: מִן(‘~에서’)이 분산된 출처를 분명히 하므로, 본문이 명시하지 않은 순례 이동을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
