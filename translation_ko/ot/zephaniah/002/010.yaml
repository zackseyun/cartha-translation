  source_fidelity: 본문의 심판 결과와 그 근거를 대체로 충실히 옮겼습니다. 다만 ‘야훼 만군’은 히브리어 신명 칭호의 소유 관계를 한국어에서 충분히 드러내지 못하며, ‘그들 위로’도 바로 앞의 대상을 가리키지만 다소 불명확합니다.
  naturalness: ‘교만에 대한 보응입니다’와 ‘조롱하고 … 높였기 때문입니다’는 현대 표준어 합쇼체로 자연스럽습니다. 신명 칭호는 ‘만군의 야훼’가 더 명료하고 자연스럽습니다.
  terminology: יהוה צבאות는 음역한 신명 ‘야훼’와 צבאות의 의미인 ‘만군’을 모두 보존하되, ‘만군의 야훼’로 관계를 명시하는 것이 적절합니다. 각주에서 ‘자랑’을 ‘교만’보다 약한 말이라고 규정할 언어적 근거는 불충분하므로 중립적인 어휘 대안으로 고칩니다.
