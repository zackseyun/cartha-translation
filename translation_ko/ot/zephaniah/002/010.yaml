  text: זֹ֥את לָ/הֶ֖ם תַּ֣חַת גְּאוֹנָ֑/ם כִּ֤י חֵֽרְפוּ֙ וַ/יַּגְדִּ֔לוּ עַל עַ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/010.yaml
  text: This will be their lot in return for their pride[a], because they taunted and magnified themselves against the people of Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 그들의 교만[a]에 대한 보응입니다. 그들이 야훼 만군의 백성을 조롱하고 자신들을 그들 위로 높였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘교만’보다 더 약하게 ‘자랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת לָהֶם תַּחַת
  english_pob_choice: This will be their lot in return for
  chosen_korean: 이것은 그들의 보응입니다
  alternatives_korean:
  - 이것은 그들에게 닥칠 일입니다
  - 이것은 그들이 받을 몫입니다
  lexicon: HALOT
  rationale: 문맥상 심판의 결과를 가리키므로, 결과/보응의 의미를 살려 현대 한국어로 간결하게 옮겼습니다.
- source_word: גְּאוֹנָם
  english_pob_choice: their pride
  chosen_korean: 그들의 교만
  alternatives_korean:
  - 그들의 자만
  - 그들의 오만
  lexicon: HALOT
  rationale: 심판 문맥에서 גְּאוֹן은 단순한 위엄보다 자만한 교만을 뜻하므로, 가장 직접적인 ‘교만’을 택했습니다.
- source_word: חֵרְפוּ
  english_pob_choice: they taunted
  chosen_korean: 조롱하고
  alternatives_korean:
  - 비난하고
  - 모욕하고
  - 욕되게 하고
  lexicon: HALOT
  rationale: 원문의 수치 주기와 경멸을 나타내는 동사로서, 한국어에서는 ‘조롱하다’가 가장 자연스럽고 강한 대응입니다.
- source_word: וַיַּגְדִּלוּ עַל
  english_pob_choice: and magnified themselves against
  chosen_korean: 자신들을 그들 위로 높였기
  alternatives_korean:
  - 자신들을 그들 위에 크게 했기
  - 그들보다 스스로를 높였기
  - 그들 위에 군림했기
  lexicon: HALOT
  rationale: 히필 동사의 자기 고양/자기 과장의 뉘앙스를 살리기 위해 ‘자신들을 … 높이다’로 옮겼고, עַל의 대상을 ‘그들 위로’로 드러냈습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군
  alternatives_korean:
  - 야훼 만군의 하나님
  - 야훼 만군의 주
  lexicon: HALOT
  rationale: 이 본문은 고유명 יְהוָה를 쓰므로 ‘야훼’를 유지하고, צְבָאוֹת는 전통적이지만 의미를 드러내는 ‘만군’으로 옮겼습니다.
theological_decisions:
- issue: יהוה / YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신적 고유명 יְהוָה를 직접 사용하므로, 명칭을 대체하지 않고 음역하여 하나님의 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for יְהוָה YHWH'
- issue: 야훼 צְבָאוֹת의 재현
  chosen_reading: 야훼 만군
  alternative_readings:
  - 야훼 만군의 하나님
  - 야훼 만군의 주
  rationale: צְבָאוֹת의 군사적·우주적 위엄을 짧고 직접적으로 전달하기 위해 ‘만군’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Divine titles; translation philosophy §1, §6'
