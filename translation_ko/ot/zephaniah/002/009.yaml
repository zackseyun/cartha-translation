  - 내 백성의 남은 사람들
  lexicon: HALOT
  rationale: 예언서의 중요한 신학 용어인 ‘remnant’를 ‘남은 자’로 보존했습니다.
- source_word: וְיֶתֶר גוי
  english_pob_choice: and the remainder of my nation
  chosen_korean: 내 민족의 남은 이
