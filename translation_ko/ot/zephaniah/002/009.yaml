id: ZEP.2.9
reference: Zephaniah 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֡נִי נְאֻם֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כִּֽי מוֹאָ֞ב כִּ/סְדֹ֤ם תִּֽהְיֶה֙ וּ/בְנֵ֤י עַמּוֹן֙ כַּֽ/עֲמֹרָ֔ה מִמְשַׁ֥ק חָר֛וּל וּ/מִכְרֵה מֶ֥לַח וּ/שְׁמָמָ֖ה עַד עוֹלָ֑ם שְׁאֵרִ֤ית עַמִּ/י֙ יְבָזּ֔וּ/ם וְ/יֶ֥תֶר גוי יִנְחָלֽוּ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/009.yaml
  text: Therefore[a], as I live, declares Yahweh of hosts, the God of Israel, Moab will surely become like Sodom, and the sons of Ammon like Gomorrah—a place overgrown with weeds, a salt pit, and a perpetual desolation. The remnant of my people will plunder them[b], and the remainder of my nation will inherit them.
  footnotes:
  - marker: a
    text: Or, more formally, 'a possession of nettles.' The Hebrew phrase is difficult; the translation conveys the image of abandoned land overtaken by thorny weeds.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Ammonites'; literally, 'the sons of Ammon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 내가 살아 있음을 두고 맹세합니다. 만군의 야훼, 이스라엘의 하나님이 말씀하십니다. 모압은 반드시 소돔처럼, 암몬 자손은 고모라처럼 될 것이니, 그것들은 가시덤불의 자리와 소금 구덩이, 그리고 영원한 황폐가 될 것입니다. 내 백성의 남은 자가 그들을 약탈하고[b], 내 민족의 남은 이가 그들을 차지할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘쐐기풀의 자리’라고도 옮길 수 있습니다. 히브리어 구문은 난해하며, 본 번역은 버려진 땅이 가시성 잡초로 덮인 이미지를 전달합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘암몬 사람들’입니다. 문자적으로는 ‘암몬의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그래서
  lexicon: HALOT
  rationale: 앞 문맥의 심판 선언을 논리적으로 받는 결론 표지이므로, 합쇼체 문맥에서 가장 자연스러운 ‘그러므로’로 옮겼습니다.
- source_word: חַי אָנִי
  english_pob_choice: as I live
  chosen_korean: 내가 살아 있음을 두고 맹세합니다
  alternatives_korean:
  - 내가 살아 있습니다
  - 살아 있는 나를 두고
  lexicon: HALOT
  rationale: 히브리어의 서약 공식이므로 단순 진술보다 맹세의 힘이 드러나도록 한국어로 자연스럽게 풀었습니다.
- source_word: יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh of hosts, the God of Israel
  chosen_korean: 만군의 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 만군의 주님, 이스라엘의 하나님
  - 만군의 야훼, 이스라엘의 주
  lexicon: HALOT
  rationale: 본문의 고유한 신적 칭호를 살려 ‘야훼’를 유지하고, צְבָאוֹת는 관용적이면서도 의미가 분명한 ‘만군’으로 옮겼습니다.
- source_word: מִמְשַׁק חָרוּל
  english_pob_choice: a place overgrown with weeds
  chosen_korean: 가시덤불의 자리
  alternatives_korean:
  - 쐐기풀의 자리
  - 잡초가 무성한 자리
  lexicon: HALOT
  rationale: 어려운 식생 표현이지만, 폐허가 된 땅의 이미지를 살리기 위해 넓은 의미의 가시덤불 표현으로 옮겼습니다.
- source_word: וּמִכְרֵה מֶלַח
  english_pob_choice: a salt pit
  chosen_korean: 소금 구덩이
  alternatives_korean:
  - 소금 광산
  - 소금 웅덩이
  lexicon: HALOT
  rationale: 황폐하고 쓸모없는 땅의 비유를 유지하기 위해 산업적 ‘광산’보다 직역에 가까운 ‘소금 구덩이’를 택했습니다.
- source_word: שְׁאֵרִית עַמִּי
  english_pob_choice: The remnant of my people
  chosen_korean: 내 백성의 남은 자
  alternatives_korean:
  - 내 백성의 남은 무리
  - 내 백성의 남은 사람들
  lexicon: HALOT
  rationale: 예언서의 중요한 신학 용어인 ‘remnant’를 ‘남은 자’로 보존했습니다.
- source_word: וְיֶתֶר גוי
  english_pob_choice: and the remainder of my nation
  chosen_korean: 내 민족의 남은 이
  alternatives_korean:
  - 내 민족의 나머지
  - 내 나라의 남은 이
  lexicon: HALOT
  rationale: 이중 평행을 살리면서 גוי의 집단성을 반영해 ‘민족’으로 옮겼고, 남은 집단을 자연스러운 한국어로 나타냈습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
