revisions:
- from: 그 땅은 유다 집의 남은 자들에게 속하게 될 것이며, 그 위에서 그들이 풀을 뜯을 것입니다. 아스글론의 집들에서 그들이 저녁에 누울 것입니다. 이는 그들의 하나님이신 야훼께서 그들을 살피시고 그들의 형편을 회복하실 것이기 때문입니다.[a]
  to: 그 해안 지대는 유다 집의 남은 자들에게 돌아갈 것이며, 그곳에서 그들은 양 떼를 먹일 것입니다. 그들은 저녁에 아스글론의 집들에서 누울 것입니다. 이는 그들의 하나님이신 야훼께서 그들을 돌보시고[a] 그들의 형편을 회복하실 것이기 때문입니다.[b]
  rationale: 해안 지역이라는 문맥상 지시를 명시하고, 목축 행위가 사람 자신이 풀을 먹는 것으로 오해되지 않도록 자연스러운 한국어 목적어를 보충했습니다. 기존 각주의 혼입 오류를 수정했으며, 영어 POB 감사 기록에 있는 פקד 및 회복 관용구의 대안 의미를 적절한 앵커와 함께 보존했습니다. 신학적 해석을 추가하지 않고 원문의 회복 약속과 목축 이미지를 유지했습니다.
