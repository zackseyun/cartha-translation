  text: וְ/הָ֣יָה חֶ֗בֶל לִ/שְׁאֵרִ֛ית בֵּ֥ית יְהוּדָ֖ה עֲלֵי/הֶ֣ם יִרְע֑וּ/ן בְּ/בָתֵּ֣י אַשְׁקְל֗וֹן בָּ/עֶ֨רֶב֙ יִרְבָּצ֔וּ/ן כִּ֧י יִפְקְדֵ֛/ם יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/שָׁ֥ב שבות/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/007.yaml
  text: And the coastland shall belong to the remnant of the house of Judah; on it they shall pasture. In the houses of Ashkelon they shall lie down at evening, for Yahweh their God will attend to them and restore their fortunes.
  footnotes:
  - marker: a
    text: Or 'will visit them' / 'will care for them.' The Hebrew verb can denote attentive intervention, whether for blessing or judgment; here the context favors gracious restoration.
    reason: lexical_alternative
  - marker: b
    text: Or 'bring back their captives.' The Hebrew idiom often means to restore a people's former condition or fortunes.
    reason: alternative_reading
translation:
  language: ko
  text: 그 땅은 유다 집의 남은 자들에게 속하게 될 것이며, 그 위에서 그들이 풀을 뜯을 것입니다. 아스글론의 집들에서 그들이 저녁에 누울 것입니다. 이는 그들의 하나님이신 야훼께서 그들을 살피시고 그들의 형편을 회복하실 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 보통 ‘포로들을 돌려보내다’보다 넓게, 한 ժողովրդի의 형편과 운명을 회복하는 뜻으로도 쓰입니다.
    reason: source_note
lexical_decisions:
- source_word: חֶבֶל
  english_pob_choice: coastland
  chosen_korean: 그 땅
  alternatives_korean:
  - 해안 지대
  - 해변 지역
  - 영토
  lexicon: HALOT
  rationale: 문맥상 블레셋 해안 지역을 가리키지만, 한국어에서는 앞절의 심판 대상 지역을 자연스럽게 이어 주는 중립적 지시로 ‘그 땅’이 가장 간결합니다.
- source_word: שְׁאֵרִית
  english_pob_choice: remnant
  chosen_korean: 남은 자들
  alternatives_korean:
  - 남은 무리
  - 잔존자들
  lexicon: HALOT
  rationale: 예언서에서 보존된 언약 공동체라는 뉘앙스를 살리기 위해 단순한 수량적 ‘나머지’보다 ‘남은 자들’을 택했습니다.
- source_word: יִרְעוּן
  english_pob_choice: shall pasture
  chosen_korean: 풀을 뜯을 것입니다
  alternatives_korean:
  - 목초지에서 지낼 것입니다
  - 목축할 것입니다
  - 풀을 먹일 것입니다
  lexicon: HALOT
  rationale: 동사가 본래 ‘풀을 뜯다/먹이다’의 목축 이미지를 갖기 때문에, 땅을 이용해 가축을 풀 뜯게 하는 구체성을 살렸습니다.
- source_word: יִרְבָּצוּן
  english_pob_choice: shall lie down
  chosen_korean: 누울 것입니다
  alternatives_korean:
  - 쉬게 될 것입니다
  - 몸을 뉘일 것입니다
  - 엎드릴 것입니다
  lexicon: HALOT
  rationale: 저녁의 정착과 휴식을 나타내는 구체적 동작을 간단히 살리기 위해 ‘누울 것입니다’로 옮겼습니다.
- source_word: יִפְקְדֵם
  english_pob_choice: will attend to them
  chosen_korean: 그들을 살피시고
  alternatives_korean:
  - 그들을 방문하시고
  - 그들을 돌보시고
  - 그들을 찾아오시고
  lexicon: HALOT
  rationale: פקד는 ‘방문하다/돌보다/살피다/개입하다’의 폭이 넓어, 여기서는 회복을 위한 호의적 개입이라는 문맥에 맞게 ‘살피다’로 풀었습니다.
- source_word: וְשָׁב שְׁבוּתָם
  english_pob_choice: restore their fortunes
  chosen_korean: 그들의 형편을 회복하실 것이기 때문입니다
  alternatives_korean:
  - 그들의 포로됨을 돌이키실 것이기 때문입니다
  - 그들의 포로를 돌아오게 하실 것이기 때문입니다
  - 그들의 운명을 회복하실 것이기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 포로 귀환보다 삶의 상태 전반의 회복을 뜻할 수 있으므로, ‘형편을 회복하다’로 넓게 옮겼습니다.
theological_decisions:
- issue: 여호와의 고유명사 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 제목이 아닌 고유명사로서 ‘야훼’를 유지해 원문 표지를 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: פקד의 의미 범위
  chosen_reading: 호의적 돌봄과 개입을 나타내는 ‘살피다’
  alternative_readings:
  - 심문하다
  - 징계하다
  - 방문하다
  rationale: 이 절은 심판보다 회복을 말하므로, פקד의 여러 뜻 가운데 구원적 돌봄의 방향을 드러내는 번역을 채택했습니다.
  doctrine_reference: Translation philosophy §1, §3
