  lexicon: HALOT
  rationale: 가나안과 블레셋 땅의 병치가 지닌 수사적 동일시를 살리면서, ‘블레셋 사람’으로 민족·지역의 결합을 드러냈습니다.
- source_word: וְהַאֲבַדְתִּיךְ מֵאֵין יוֹשֵׁב
  english_pob_choice: and I will destroy you until no inhabitant remains
