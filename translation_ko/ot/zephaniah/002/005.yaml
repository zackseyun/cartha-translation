  text: ה֗וֹי יֹֽשְׁבֵ֛י חֶ֥בֶל הַ/יָּ֖ם גּ֣וֹי כְּרֵתִ֑ים דְּבַר יְהוָ֣ה עֲלֵי/כֶ֗ם כְּנַ֨עַן֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךְ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/005.yaml
  text: Woe[a], inhabitants of the seacoast, nation of the Cherethites! The word of Yahweh is against you, Canaan, land of the Philistines; and I will destroy you until no inhabitant remains.
  footnotes:
  - marker: a
    text: Hebrew כְּרֵתִים may also be rendered 'Cherethites,' the more traditional English spelling of the ethnonym.
    reason: lexical_alternative
translation:
  language: ko
  text: 화 있으라, 해안의 주민들, 그렛 사람의 나라여! 야훼의 말씀이 너희를 향합니다 — 가나안, 블레셋 사람의 땅아! 내가 너를 멸하여, 거주하는 자가 하나도 남지 않게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그렛 사람’은 히브리어 כְּרֵתִים의 직역·음역에 가깝고, 전통적 영어 표기인 ‘Cherethites’에 대응합니다.
    reason: lexical_alternative
lexical_decisions:
