  - 야훼의 말씀이 너희를 대적합니다
  lexicon: HALOT
  rationale: דבר יהוה의 예언 공식과 עַל의 방향성을 살려, 심판의 적대적 ‘against’ 의미를 한국어로 과도하게 풀지 않고 유지했습니다.
- source_word: כְּנַעַן אֶרֶץ פְּלִשְׁתִּים
  english_pob_choice: Canaan, land of the Philistines
  chosen_korean: 가나안, 블레셋 사람의 땅
  alternatives_korean:
