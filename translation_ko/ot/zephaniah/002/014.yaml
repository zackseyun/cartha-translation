  lexicon: HALOT
  rationale: רבץ는 짐승이 눕거나 쉬는 모습을 가리키므로 ‘누울 것이다’가 이미지와 문맥을 가장 자연스럽게 살립니다.
- source_word: כָּל חַיְתוֹ גוֹי
  english_pob_choice: every beast of the nations
  chosen_korean: 모든 민족의 짐승들도
  alternatives_korean:
