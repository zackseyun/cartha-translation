  lexicon: HALOT
  rationale: 문구가 난해하지만, POB의 소스 판단을 따라 ‘민족들/나라들’의 짐승이라는 표면 구조를 유지하되 한국어에서는 자연스럽게 ‘모든 민족의 짐승들’로 옮겼습니다.
- source_word: קָאַת / קִפֹּד
  english_pob_choice: desert owl / hedgehog
  chosen_korean: 사막 올빼미와 고슴도치
  alternatives_korean:
  - 사막 부엉이와 고슴도치
  - 펠리컨과 고슴도치
  - 사막 올빼미와 두더지쥐
  lexicon: HALOT
  rationale: 두 동물명은 식별이 불확실하므로, POB의 선택을 따라 폐허 이미지를 살리는 현대적 명칭을 쓰되 불확실성은 본문 밖에서 관리합니다.
- source_word: בְּכַפְתֹּרֶיהָ
  english_pob_choice: among her capitals
  chosen_korean: 그 기둥머리들 사이에서
  alternatives_korean:
  - 그 주두들 사이에서
  - 그 장식기둥머리들 사이에서
  lexicon: HALOT
  rationale: כפתור는 여기서 건축적 장식이나 기둥머리를 가리키는 것으로 보이므로, 한국어 독자가 곧바로 형상을 떠올릴 수 있게 ‘기둥머리들’로 옮겼습니다.
- source_word: כִּי אַרְזָה עֵרָה
  english_pob_choice: for her cedarwork has been laid bare
  chosen_korean: 이는 그 향나무 장식이 드러났기 때문입니다
  alternatives_korean:
  - 이는 그 향나무 가공이 벗겨졌기 때문입니다
  - 이는 그 향나무 판넬이 드러났기 때문입니다
  lexicon: HALOT
  rationale: ארז는 문맥상 향나무 재질의 건축 장식/판넬을 가리키므로, ‘장식’으로 풀어 건축적 의미를 분명하게 했습니다.
