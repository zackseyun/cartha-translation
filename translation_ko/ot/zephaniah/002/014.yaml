  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָבְצ֨וּ בְ/תוֹכָ֤/הּ עֲדָרִים֙ כָּל חַיְת/וֹ ג֔וֹי גַּם קָאַת֙ גַּם קִפֹּ֔ד בְּ/כַפְתֹּרֶ֖י/הָ יָלִ֑ינוּ ק֠וֹל יְשׁוֹרֵ֤ר בַּֽ/חַלּוֹן֙ חֹ֣רֶב בַּ/סַּ֔ף כִּ֥י אַרְזָ֖ה עֵרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/014.yaml
  text: Herds will lie down in her midst[a], every beast of the nations; both the desert owl and the hedgehog will spend the night among her capitals. A voice will sing in the window; devastation will be on the threshold[c][b], for her cedarwork has been laid bare.
  footnotes:
  - marker: a
    text: The identification of the Hebrew animal names is uncertain. 'Desert owl' may also be rendered 'pelican.'
    reason: lexical_alternative
  - marker: b
    text: Or 'porcupine' for 'hedgehog.' The exact species denoted by the Hebrew term is debated.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'every beast of a nation' or similar; the phrase is difficult, likely meaning 'every kind of beast.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 가운데에 떼들이 누울 것이며, 모든 민족의 짐승들도 그러할 것입니다. 사막 올빼미와 고슴도치도 그 기둥머리들 사이에서 밤을 지낼 것입니다. 창문에서는 한 음성이 노래하고, 문지방에는 황폐가 있을 것입니다. 이는 그 향나무 장식이 드러났기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동물명은 식별이 불확실합니다. ‘사막 올빼미’는 ‘펠리컨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고슴도치’ 대신 ‘호저’로 옮길 수도 있습니다. 히브리어가 정확히 어떤 종을 가리키는지는 논쟁적입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘모든 종류의 짐승’ 또는 이와 비슷한 뜻일 수 있으며, 문구 자체가 난해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ בְתוֹכָהּ
  english_pob_choice: Herds will lie down in her midst
  chosen_korean: 그 가운데에 떼들이 누울 것이며
  alternatives_korean:
  - 그 한가운데에 가축 떼가 눕게 될 것입니다
  - 그 가운데에서 무리들이 쉬게 될 것입니다
  lexicon: HALOT
  rationale: רבץ는 짐승이 눕거나 쉬는 모습을 가리키므로 ‘누울 것이다’가 이미지와 문맥을 가장 자연스럽게 살립니다.
- source_word: כָּל חַיְתוֹ גוֹי
  english_pob_choice: every beast of the nations
  chosen_korean: 모든 민족의 짐승들도
  alternatives_korean:
  - 모든 종류의 짐승도
  - 모든 나라의 짐승도
  lexicon: HALOT
  rationale: 문구가 난해하지만, POB의 소스 판단을 따라 ‘민족들/나라들’의 짐승이라는 표면 구조를 유지하되 한국어에서는 자연스럽게 ‘모든 민족의 짐승들’로 옮겼습니다.
- source_word: קָאַת / קִפֹּד
  english_pob_choice: desert owl / hedgehog
  chosen_korean: 사막 올빼미와 고슴도치
  alternatives_korean:
  - 사막 부엉이와 고슴도치
  - 펠리컨과 고슴도치
  - 사막 올빼미와 두더지쥐
  lexicon: HALOT
  rationale: 두 동물명은 식별이 불확실하므로, POB의 선택을 따라 폐허 이미지를 살리는 현대적 명칭을 쓰되 불확실성은 본문 밖에서 관리합니다.
- source_word: בְּכַפְתֹּרֶיהָ
  english_pob_choice: among her capitals
  chosen_korean: 그 기둥머리들 사이에서
  alternatives_korean:
  - 그 주두들 사이에서
  - 그 장식기둥머리들 사이에서
  lexicon: HALOT
  rationale: כפתור는 여기서 건축적 장식이나 기둥머리를 가리키는 것으로 보이므로, 한국어 독자가 곧바로 형상을 떠올릴 수 있게 ‘기둥머리들’로 옮겼습니다.
- source_word: כִּי אַרְזָה עֵרָה
  english_pob_choice: for her cedarwork has been laid bare
  chosen_korean: 이는 그 향나무 장식이 드러났기 때문입니다
  alternatives_korean:
  - 이는 그 향나무 가공이 벗겨졌기 때문입니다
  - 이는 그 향나무 판넬이 드러났기 때문입니다
  lexicon: HALOT
  rationale: ארז는 문맥상 향나무 재질의 건축 장식/판넬을 가리키므로, ‘장식’으로 풀어 건축적 의미를 분명하게 했습니다.
theological_decisions:
- issue: 폐허를 묘사하는 예언적 시제와 의인화된 도시 이미지
  chosen_reading: 미래형으로 옮기되, 도시를 여성 대명사 ‘그’로 받아 폐허가 된 도시가 짐승의 거처가 되는 예언적 심상을 살렸습니다.
  alternative_readings:
  - 현재형 서술
  - 도시 명시 반복
  rationale: 히브리어의 예언적 진술과 의인화된 도시를 한국어에서 자연스럽게 재현하기 위한 선택입니다.
  doctrine_reference: 예언문체/의인화
