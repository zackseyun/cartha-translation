base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/013.yaml
  text: And he will stretch out his hand against the north and destroy Assyria[a], and he will make Nineveh a desolation, dry like the wilderness.
  footnotes:
  - marker: a
    text: Or 'like the desert.' The Hebrew midbar can denote wilderness, pastureland, or desert-like wasteland depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분께서 북쪽을 대적하여 손을 뻗으시고 앗수르를 멸망시키시며, 니느웨를 황무지로, 광야처럼 메마른 땅으로 만드실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사막처럼’으로 옮길 수 있습니다. 히브리어 미드바르는 문맥에 따라 광야, 목초지, 사막 같은 황무지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵט יָדוֹ
  english_pob_choice: he will stretch out his hand
  chosen_korean: 그분이 … 손을 뻗으시고
  alternatives_korean:
  - 그분이 … 손을 펴시고
  - 그분이 … 손을 내미시고
  lexicon: HALOT
  rationale: נטה는 손과 함께 심판 행위를 나타내는 관용구이므로, 추상화하지 않고 한국어에서도 ‘손을 뻗다’로 구체적 이미지를 살렸습니다.
- source_word: עַל צָפוֹן
  english_pob_choice: against the north
  chosen_korean: 북쪽을 향해
  alternatives_korean:
  - 북쪽을 거슬러
  - 북쪽에 대하여
  lexicon: HALOT
  rationale: 문맥상 파괴 행위의 대상이 되는 방향을 나타내므로 단순한 ‘~을 향해’보다 심판의 방향성을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: וִיאַבֵּד אֶת אַשּׁוּר
  english_pob_choice: and destroy Assyria
  chosen_korean: 앗수르를 멸하시며
  alternatives_korean:
  - 앗수르를 파멸하시며
  - 앗수르를 멸망시키시며
  lexicon: HALOT
  rationale: Hiphil אבד는 ‘멸하다/파멸하다’의 원인적 의미를 가지므로, 인격적이고 강한 심판 동사를 선택했습니다.
- source_word: לִשְׁמָמָה צִיָּה כַּמִּדְבָּר
  english_pob_choice: a desolation, dry like the wilderness
  chosen_korean: 황폐한 곳, 광야처럼 메마른 곳
  alternatives_korean:
  - 황무지, 사막처럼 마른 곳
  - 폐허, 들판처럼 메마른 곳
  lexicon: HALOT
  rationale: שְׁמָמָה와 צִיָּה, מִדְבָּר의 연쇄를 살려 ‘황폐함’과 ‘메마름’을 분리해 표현했고, מִדְבָּר는 ‘광야’가 한국어 성서어법에서 가장 가까운 대응어이므로 이를 택했습니다.
theological_decisions:
- issue: 하나님의 신체적 표현을 그대로 살릴지 여부
  chosen_reading: ‘손을 뻗으시고’로 유지해 하나님의 심판 행위를 구체적 이미지로 보존했습니다.
  alternative_readings:
  - ‘행하실 것이며’처럼 추상화
  - ‘권능을 드러내시고’로 의역
  rationale: 히브리어 본문은 신체 비유를 통해 심판의 능동성과 직접성을 드러내므로, 이를 완화하지 않는 것이 원문 수사에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
