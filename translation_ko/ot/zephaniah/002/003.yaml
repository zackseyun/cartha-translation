  text: בַּקְּשׁ֤וּ אֶת יְהוָה֙ כָּל עַנְוֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר מִשְׁפָּט֖/וֹ פָּעָ֑לוּ בַּקְּשׁוּ צֶ֨דֶק֙ בַּקְּשׁ֣וּ עֲנָוָ֔ה אוּלַי֙ תִּסָּ֣תְר֔וּ בְּ/י֖וֹם אַף יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/003.yaml
  text: Seek Yahweh[a], all you humble of the land, who have carried out his justice; seek righteousness, seek humility[d][c][b]; perhaps you will be hidden in the day of Yahweh’s anger.
  footnotes:
  - marker: a
    text: Or 'all you humble of the earth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'who have done his ordinance' or 'who have practiced his judgment.'
    reason: lexical_alternative
  - marker: c
    text: '''Righteousness'' may also be rendered ''justice.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'perhaps you may be hidden' or 'perhaps you will be sheltered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 찾으십시오, 그분의 공의[b]를 행하는 땅[a]의 모든 겸손한 이들이여. 의[c]를 찾으십시오. 겸손을 찾으십시오. 아마도 여러분은 야훼의 분노의 날에 숨겨질 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '온 세상'으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그분의 법도' 혹은 '그분의 판단'으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '''의''는 여기서 ''정의''로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: d
    text: 또는 '아마도 여러분은 감춰질 것입니다' 혹은 '아마도 여러분은 보호받을 것입니다'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקְּשׁוּ
  english_pob_choice: Seek
  chosen_korean: 찾으십시오
  alternatives_korean:
  - 구하십시오
  - 찾아 구하십시오
  lexicon: HALOT
  rationale: 히브리어 בַּקְּשׁוּ는 단순한 탐색이 아니라 적극적 추구의 명령이므로, 현대 한국어에서는 직접적이고 자연스러운 명령형인 '찾으십시오'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신성명을 тит울이 아닌 고유명으로 드러내기 위해 '야훼'를 사용했습니다.
- source_word: עַנְוֵי הָאָרֶץ
  english_pob_choice: you humble of the land
  chosen_korean: 땅의 모든 겸손한 이들
  alternatives_korean:
  - 땅의 온유한 이들
  - 땅의 모든 온유한 이들
  - 땅의 겸손한 이들
  lexicon: HALOT
  rationale: עַנְוֵי는 '겸손한/온유한/낮은'의 뜻이며, 앞뒤의 '겸손'과의 평행을 살려 '겸손한 이들'로 옮겼습니다. הָאָרֶץ는 여기서 공동체를 가리키는 '땅'이 자연스럽습니다.
- source_word: אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ
  english_pob_choice: who have carried out his justice
  chosen_korean: 그분의 정의를 행한 자들
  alternatives_korean:
  - 그분의 법도를 행한 자들
  - 그분의 판단을 행한 자들
  - 그분의 공의를 실행한 자들
  lexicon: HALOT
  rationale: פָּעָלוּ는 '행하다/실행하다'의 뜻이므로 '행한'으로 살렸고, מִשְׁפָּט는 여기서 사회·윤리적 '정의'의 뉘앙스가 강해 '정의'로 번역했습니다.
- source_word: צֶדֶק
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: HALOT
  rationale: צֶדֶק은 문맥상 윤리적 올바름을 가리키며, 한국어 성서 어휘로는 '의'가 가장 압축적이고 본문 흐름과도 잘 맞습니다.
- source_word: עֲנָוָה
  english_pob_choice: humility
  chosen_korean: 겸손
  alternatives_korean:
  - 온유
  - 낮아짐
  lexicon: HALOT
  rationale: 명사 עֲנָוָה는 '겸손/온유/낮아짐'을 뜻하므로, 앞의 '겸손한 이들'과 어휘를 맞추어 '겸손'으로 번역했습니다.
- source_word: אוּלַי
  english_pob_choice: perhaps
  chosen_korean: 아마도
  alternatives_korean:
  - 어쩌면
  - 혹시
  lexicon: HALOT
  rationale: אוּלַי의 불확실성을 한국어의 '아마도'로 자연스럽게 표현했습니다.
- source_word: תִּסָּתְרוּ
  english_pob_choice: you will be hidden
  chosen_korean: 숨겨질 것입니다
  alternatives_korean:
  - 감춰질 것입니다
  - 숨을 것입니다
  - 보호받을 것입니다
  lexicon: HALOT
  rationale: 니팔형 סתר의 수동적 의미를 살려 '숨겨질 것입니다'로 옮겼고, '보호받을'처럼 해석을 앞서가지 않도록 했습니다.
- source_word: בְּיוֹם אַף יְהוָה
  english_pob_choice: in the day of Yahweh’s anger
  chosen_korean: 야훼의 분노의 날
  alternatives_korean:
  - 야훼의 진노의 날
  - 야훼의 노여움의 날
  lexicon: HALOT
  rationale: אַף는 여기서 '분노/진노'를 뜻하므로 직역에 가까운 '분노'를 택했고, 관용적 표현인 '날'과 자연스럽게 결합했습니다.
theological_decisions:
- issue: 명령문의 수신자와 호칭의 톤
  chosen_reading: 예언자적 호소를 살려 직접 호명하는 형태로 '땅의 모든 겸손한 이들아'를 유지했습니다.
  alternative_readings:
  - 단순 서술형으로 완화하는 방식
  - 호칭을 생략하는 방식
  rationale: 원문은 청중을 직접 부르는 호소문이므로, 한국어에서도 대상을 분명히 드러내는 호격을 유지해야 본문의 긴박감이 보존됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve rhetorical force and direct address.'
- issue: אוּלַי의 가능성 표현
  chosen_reading: '''아마도''로 번역해 약속의 확정성을 과도하게 강화하지 않았습니다.'
  alternative_readings:
  - '''반드시''로 확정하는 해석'
  - 구원을 전제하는 단정적 번역
  rationale: 원문은 분명한 개연성 표현을 사용하므로, 심판 날의 구원을 조건부 가능성으로 남겨 두는 것이 본문의 긴장을 살립니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
