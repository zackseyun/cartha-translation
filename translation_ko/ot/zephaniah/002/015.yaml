revisions:
- from: 이것은 활기를 띠던 성읍으로, 안전하게 거주하며 마음속으로 ‘나만이 있고 나 외에는 없다’라고 말하던 곳입니다. 어찌 이리도 황폐하게 되어 들짐승의 눕는 곳이 되었습니까! 그 곁을 지나가는 자마다 휘파람을 불고 손을 흔들 것입니다.[a][b]
  to: 이것이 즐거워하던 성읍, 안심하고 살면서 마음속으로 ‘나는 있고 나 외에는 아무것도 없다’라고 말하던 곳입니다. 어찌 이 성읍이 황폐한 곳[a], 들짐승이 눕는 곳이 되었습니까! 그곳을 지나가는 사람마다 휘파람을 불고[b] 손을 흔들 것입니다.
  rationale: 원문의 문장 구조와 의인화된 도시의 자기선언을 유지하되, הָעַלִּיזָה의 의미를 더 직접적으로 옮기고, 각주를 해당 본문 어휘에 정확히 연결했습니다. ‘나는 있고 나 외에는 아무것도 없다’는 히브리어의 과장된 배타성 및 신적 유일성 언어를 흉내 낸 효과를 보존하며 특정 교리적 해석을 덧붙이지 않습니다.
  reviewer_model: gpt-5.6-terra
