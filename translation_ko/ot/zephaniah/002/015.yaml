base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/015.yaml
  text: This is the exultant city that lived securely[a], that said in her heart, ‘I am, and there is none besides me.’ How she has become a desolation[b], a resting place for wild animals! Everyone who passes by her will hiss and wave his hand.
  footnotes:
  - marker: a
    text: Or, “an object of horror.” The Hebrew term can include the sense of appalling devastation, not only physical desolation.
    reason: lexical_alternative
  - marker: b
    text: Or, “will whistle.” The Hebrew verb can denote a sharp sound of astonishment or derision.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 즐거워하던 성읍, 안심하고 살면서 마음속으로 ‘나는 있고 나 외에는 아무것도 없다’라고 말하던 곳입니다. 어찌 이 성읍이 황폐한 곳[a], 들짐승이 눕는 곳이 되었습니까! 그곳을 지나가는 사람마다 휘파람을 불고[b] 손을 흔들 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경악의 대상’. 히브리어는 단순한 물리적 황폐함뿐 아니라 경악을 자아내는 파괴의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘휘파람을 불 것이다’. 히브리어 동사는 놀라움이나 조롱의 날카로운 소리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִיר הָעַלִּיזָה
  english_pob_choice: the exultant city
  chosen_korean: 활기를 띠던 성읍
  alternatives_korean:
  - 즐거워하던 성읍
  - 환호하던 성읍
  - 흥겨웠던 성읍
  lexicon: HALOT
  rationale: הָעַלִּיזָה의 핵심은 단순한 기쁨보다 들뜸과 자기만족이 섞인 활기입니다. ‘활기를 띠던’은 그 분위기를 살리면서도 문맥의 교만한 자기연출을 덜 약화시킵니다.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  english_pob_choice: that lived securely
  chosen_korean: 안전하게 거주하며
  alternatives_korean:
  - 안전히 살며
  - 안전하게 살던
  - 평안히 거주하며
  lexicon: HALOT
  rationale: 지속적인 상태를 나타내는 분사구문이므로 ‘거주하며’로 현재적 지속성을 살렸습니다. ‘안전하게’는 לָבֶטַח의 안정된 거처라는 의미를 자연스럽게 전달합니다.
- source_word: אֲנִי וְאַפְסִי עוֹד
  english_pob_choice: I am, and there is none besides me
  chosen_korean: 나만이 있고 나 외에는 없다
  alternatives_korean:
  - 나는 있고 나 외에는 아무도 없다
  - 나만 있고 그 밖에는 없다
  - 나는 존재하고 내 밖에는 없다
  lexicon: HALOT
  rationale: 이 표현은 배타적 자기신격화의 과장된 자기선언이므로, ‘나만이 있고 나 외에는 없다’로 직접적이고도 자연스럽게 옮겼습니다. 영어 POB처럼 여호와께 쓰이는 독점적 언어의 울림을 보존합니다.
- source_word: יִשְׁרֹק יָנִיעַ יָדֹו
  english_pob_choice: will hiss and wave his hand
  chosen_korean: 휘파람을 불고 손을 흔들 것입니다
  alternatives_korean:
  - 휘파람을 불고 손을 흔들 것입니다
  - 야유하며 손을 흔들 것입니다
  - 휘파람을 불며 손을 저을 것입니다
  lexicon: HALOT
  rationale: יִשְׁרֹק은 경탄과 조롱이 섞인 소리를 가리킬 수 있어 ‘휘파람을 불고’로 옮겼고, יָנִיעַ יָדוֹ는 정확한 제스처를 과도하게 특정하지 않도록 ‘손을 흔들 것입니다’로 처리했습니다.
- source_word: לְשַׁמָּה מַרְבֵּץ לַחַיָּה
  english_pob_choice: a desolation, a resting place for wild animals
  chosen_korean: 황폐하게 되어 들짐승의 눕는 곳
  alternatives_korean:
  - 황폐가 되어 들짐승의 거처
  - 황무지가 되어 들짐승의 쉬는 곳
  - 폐허가 되어 들짐승의 서식지가
  lexicon: HALOT
  rationale: לְשַׁמָּה는 단순한 ‘황폐함’보다 재난적 폐허를 가리킬 수 있으나, 본문 흐름상 문장형으로 자연스럽게 풀어 ‘황폐하게 되어’로 옮겼습니다. מַרְבֵּץ는 짐승이 눕는 장소라는 뜻이 분명하므로 ‘눕는 곳’이 가장 직접적입니다.
theological_decisions:
- issue: 도시의 자기선언에 담긴 신성 모방의 뉘앙스
  chosen_reading: ‘나만이 있고 나 외에는 없다’
  alternative_readings:
  - ‘나는 있고 나 외에는 아무도 없다’
  - ‘나만 있고 그 밖에는 없다’
  rationale: 이 말은 단순한 자만이 아니라, 하나님께만 합당한 독점적 존재 언어를 도시가 자기 자신에게 돌리는 아이러니를 형성합니다. 그래서 완곡하게 낮추지 않고 직접적인 배타성 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
