  text: הִֽתְקוֹשְׁשׁ֖וּ וָ/ק֑וֹשּׁוּ הַ/גּ֖וֹי לֹ֥א נִכְסָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/001.yaml
  text: Gather yourselves together[a], yes, gather, O shameless nation,
  footnotes:
  - marker: a
    text: Or, more literally, “O nation not desired” or “O nation without longing.” The Hebrew expression is difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 모여들라[a], 참으로 모여들라, 오 수치 모르는 나라여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “원치 않는 나라” 또는 “갈망받지 못한 나라”입니다. 히브리어 표현은 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְקוֹשְׁשׁוּ
  english_pob_choice: Gather yourselves together
  chosen_korean: 모여들라
  alternatives_korean:
  - 스스로 모이라
  - 모여라
  - 자신들을 거두라
  lexicon: HALOT
  rationale: 히트폴렐 명령형 복수의 자기지시적·집합적 뉘앙스를 살려, 자연스러운 문맥에서 공동체를 향한 소집 명령으로 옮겼습니다.
- source_word: וָ/ק֑וֹשּׁוּ
  english_pob_choice: yes, gather
  chosen_korean: 참으로 모여들라
  alternatives_korean:
  - 그리고 모여들라
  - 또 모여들라
  - 곧 모여들라
  lexicon: HALOT
  rationale: 두 번째 명령은 첫 명령을 강조하므로, 단순 접속보다 강조 부사로 반복의 압박감을 살렸습니다.
- source_word: לֹ֥א נִכְסָֽף
  english_pob_choice: shameless
  chosen_korean: 수치 모르는
  alternatives_korean:
  - 원치 않음의
  - 갈망받지 못한
  - 바라지 않은
  lexicon: HALOT
  rationale: POB의 본문 렌더링이 해석적 의미인 'shameless'를 택하지만, 히브리어의 더 직설적인 '원치 않음/갈망받지 못함'의 긴장을 유지하도록 직역적 표현을 본문에 자연스럽게 반영했습니다.
theological_decisions:
- issue: 예언적 호명에서의 수치/부끄러움의 의미
  chosen_reading: ‘수치 모르는’은 단순한 심리 상태가 아니라, 회개 없이 자기 수집조차 필요한 완고함을 드러내는 예언적 책망으로 이해했습니다.
  alternative_readings:
  - ‘원치 않는 나라’로 중립적으로 읽기
  - ‘갈망받지 못한 나라’로 더 문자적으로 읽기
  rationale: 문맥상 단순한 선호의 부재보다 도덕적·언약적 수치를 강조하는 것이 경고의 힘을 더 잘 보존합니다.
  doctrine_reference: 예언서의 책망과 회개의 촉구
