reference: Zephaniah 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/טֶ֨רֶם֙ לֶ֣דֶת חֹ֔ק כְּ/מֹ֖ץ עָ֣בַר י֑וֹם בְּ/טֶ֣רֶם לֹא יָב֣וֹא עֲלֵי/כֶ֗ם חֲרוֹן֙ אַף יְהוָ֔ה בְּ/טֶ֨רֶם֙ לֹא יָב֣וֹא עֲלֵי/כֶ֔ם י֖וֹם אַף יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/002.yaml
  text: before the decree gives birth—before the day passes away like chaff—before the burning anger of Yahweh comes upon you[c][b][a], before the day of Yahweh’s anger comes upon you.
  footnotes:
  - marker: a
    text: Or 'before the decree takes effect.' The Hebrew literally says 'before the decree gives birth,' using birth imagery for the emergence or execution of the decree.
    reason: lexical_alternative
  - marker: b
    text: Or 'before the day passes by like chaff.' The Hebrew is compact and poetic, and the exact relation between 'day' and 'like chaff' may be understood slightly differently in English.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the burning anger of the LORD' ... 'the day of the LORD’s anger.'
    reason: cross_reference
translation:
  language: ko
  text: 명령이 태어나기 전에, 날이 겨처럼 지나가기 전에, 야훼의 타오르는 분노가 여러분에게 임하기 전에, 야훼의 분노의 날이 여러분에게 이르기 전에.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘명령이 태어나기 전에’는 히브리어의 직역적 은유로, ‘명령이 발효되기 전에/집행되기 전에’라는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘날이 겨처럼 지나가기 전에’는 히브리어의 압축된 시적 표현을 살린 번역으로, ‘날이 겨처럼 스쳐 지나가기 전에’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘야훼의 타오르는 분노’는 히브리어의 ‘불붙는 분노’ 관용구를 살린 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: בְּטֶרֶם
  english_pob_choice: before
  chosen_korean: ~하기 전에
  alternatives_korean:
  - ~보다 앞서
  - ~전에
  lexicon: HALOT
  rationale: 반복되는 시간표지를 한국어에서 가장 자연스럽게 살리면서, 경고의 긴박한 누적을 유지합니다.
- source_word: לֶדֶת חֹק
  english_pob_choice: the decree gives birth
  chosen_korean: 명령이 태어나기 전에
  alternatives_korean:
  - 명령이 출산하기 전에
  - 명령이 발효되기 전에
  lexicon: HALOT
  rationale: 히브리어의 출생 은유를 그대로 살리되, 한국어에서는 ‘태어나다’가 가장 자연스럽고 직관적으로 은유성을 보존합니다.
- source_word: כְּמֹץ עָבַר י֑וֹם
  english_pob_choice: the day passes away like chaff
  chosen_korean: 날이 겨처럼 지나가기 전에
  alternatives_korean:
  - 날이 쭉정이처럼 지나가기 전에
  - 날이 겨와 같이 지나가기 전에
  lexicon: HALOT
  rationale: ‘겨’로 번역해 가벼워서 바람에 날리는 이미지를 분명히 하고, 동사 ‘지나가다’로 시적 압축을 유지합니다.
- source_word: חֲרוֹן אַף יְהוָה
  english_pob_choice: the burning anger of Yahweh
  chosen_korean: 야훼의 타오르는 분노
  alternatives_korean:
  - 야훼의 불타는 분노
  - 야훼의 맹렬한 분노
  lexicon: HALOT
  rationale: ‘חֲרוֹן’의 열기/타오름을 살려 직역에 가깝게 옮기고, תְּטראגרמא톤은 프로젝트 기본값에 따라 ‘야훼’로 옮깁니다.
- source_word: י֖וֹם אַף יְהוָֽה
  english_pob_choice: the day of Yahweh’s anger
  chosen_korean: 야훼의 분노의 날
  alternatives_korean:
  - 야훼의 진노의 날
  - 야훼의 노여움의 날
  lexicon: HALOT
  rationale: 속격 관계를 간결하게 살려, 본문이 말하는 ‘분노의 날’이라는 심판적 표현을 분명히 드러냅니다.
theological_decisions:
- issue: 야훼(יְהוָה) 표기
  chosen_reading: 본문의 하나님의 이름을 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 기본 원칙에 따라, 칭호로 대체하지 않고 신적 고유명사를 드러내어 본문의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 출생 은유의 보존
  chosen_reading: ‘명령이 태어나다’라는 은유를 유지했습니다.
  alternative_readings:
  - 명령이 집행되기 전에
  - 명령이 효력을 발하기 전에
  rationale: 히브리어가 가진 생생한 출생 이미지를 추상적 행정 표현으로 평탄화하지 않고, 예언적 경고의 긴박함을 살립니다.
  doctrine_reference: Translation philosophy §1, §3
