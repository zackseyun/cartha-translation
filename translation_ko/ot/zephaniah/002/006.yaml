  text: 바닷가가 목초지가 되고, 목자들을 위한 우물과 양 떼를 위한 우리들이 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבֶל הַיָּם
  english_pob_choice: the seacoast
  chosen_korean: 바닷가
  alternatives_korean:
  - 해안
  - 바닷가 지역
  - 바다 변
  lexicon: חֶבֶל / יָם
  rationale: 지리적 범위를 담되 현대 한국어에서 자연스럽고 간결한 ‘바닷가’로 옮겼습니다.
- source_word: נְוֹת
  english_pob_choice: pastures
  chosen_korean: 목초지
  alternatives_korean:
  - 풀밭
  - 목장
  - 초지
  lexicon: נוה
  rationale: 목축에 필요한 풀밭이라는 뜻을 분명히 드러내기 위해 ‘목초지’를 선택했습니다.
- source_word: כְּרֹת רֹעִים
  english_pob_choice: wells for shepherds
  chosen_korean: 목자들을 위한 우물
  alternatives_korean:
  - 목자들의 우물
  - 목자들을 위한 샘
  - 목자들을 위한 물웅덩이
  lexicon: כרת / רעה
  rationale: POB의 ‘wells’를 따라, 목축 현장에서 필요한 물 공급처를 직설적으로 드러내는 ‘우물’을 썼습니다.
- source_word: גִּדְרֹת צֹאן
  english_pob_choice: enclosures for flocks
  chosen_korean: 양 떼를 위한 우리들
  alternatives_korean:
  - 양 떼의 우리
  - 양 떼를 위한 울타리
  - 가축 우리
  lexicon: גדר / צאן
  rationale: ‘flocks’와 대응되는 집합적 이미지를 살려 복수형 ‘우리들’로 옮겼습니다.
theological_decisions:
- issue: 심판 이후의 회복을 농경·목축 이미지로 제시하는 방식
  chosen_reading: 이 절은 해안 지역의 황폐함이 목축 가능한 거처로 바뀌는 장면을 구체적 생계 이미지로 제시한다고 읽었습니다.
  alternative_readings:
  - 일반적인 번영 선언으로 완화하는 읽기
  - 상징적 회복으로만 처리하는 읽기
  rationale: 히브리어 시문은 장소의 전환을 물질적으로 묘사하므로, 상징만 남기지 않고 우물과 우리 같은 구체물을 유지했습니다.
  doctrine_reference: 예언서의 심판-회복 도식
