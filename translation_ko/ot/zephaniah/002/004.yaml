    rationale: 한국어 ‘그’는 통상 남성 인물을 가리킵니다. 히브리어 접미사는 여성으로 문법화된 도시를 가리키므로, ‘아스돗은 한낮에 내쫓길 것이며’처럼 처리하는 편이 정확하고 자연스럽습니다.
  - severity: medium
    issue: 가사 관련 각주 표지가 아스돗 절 뒤에 놓였고, 한낮 관련 각주가 누락됨
