  lexicon: HALOT
  rationale: שממה의 심판적 의미인 황폐·파괴 상태를 현대 한국어에서 가장 자연스럽게 나타냈습니다.
- source_word: בַּצָּהֳרַיִם
  english_pob_choice: at noon
  chosen_korean: 한낮에
  alternatives_korean:
  - 정오에
  - 대낮에
  lexicon: HALOT
  rationale: ‘정오/한낮’의 시간표시를 살리면서, 공개적이고 대낮에 벌어지는 수치를 강조하는 문맥을 반영했습니다.
- source_word: יְגָרְשׁוּהָ
  english_pob_choice: they will drive her out
  chosen_korean: 그를 쫓아낼 것이며
  alternatives_korean:
  - 그녀를 쫓아낼 것이며
  - 그것을 쫓아낼 것이며
  - 그를 추방할 것이며
  lexicon: HALOT
  rationale: 도시를 의인화한 히브리어의 여성형 대명사는 한국어에서 자연스럽지 않아 성별 표지를 옮기지 않고 ‘그’를 사용했습니다.
- source_word: תֵּעָקֵר
  english_pob_choice: will be uprooted
  chosen_korean: 뿌리째 뽑힐 것입니다
  alternatives_korean:
  - 뽑혀 나갈 것입니다
  - 근원에서 뽑힐 것입니다
  lexicon: HALOT
  rationale: עקר의 비유적 제거 이미지를 한국어 관용구 ‘뿌리째 뽑히다’로 가장 분명하게 전달했습니다.
