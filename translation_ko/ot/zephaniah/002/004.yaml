base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/004.yaml
  text: For Gaza will be abandoned[a], and Ashkelon a desolation; Ashdod—they will drive her out at noon[b], and Ekron will be uprooted.
  footnotes:
  - marker: a
    text: 'Hebrew likely contains wordplay: ''Gaza'' (ʿAzzah) and ''abandoned'' (ʿazuvah) sound similar.'
    reason: lexical_alternative
  - marker: b
    text: Or 'at midday.' The phrase emphasizes that Ashdod's expulsion will happen in broad daylight, not under cover of darkness.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 가사는 버려질 것이며, 아스글론은 황무지가 될 것입니다. 아스돗은—한낮에 그들이 그를 쫓아낼 것이며[a]—에그론은 뿌리째 뽑힐 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘가사’(ʿAzzah)와 ‘버려질’(ʿazuvah)의 유사한 소리를 통해 말장난을 암시할 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러므로
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: HALOT
  rationale: 앞선 부르심/심판 선언과의 인과·결론 관계를 한국어에서 자연스럽게 잇기 위해 ‘그러므로’를 택했습니다.
- source_word: עֲזוּבָה תִהְיֶה
  english_pob_choice: will be abandoned
  chosen_korean: 버려질 것이며
  alternatives_korean:
