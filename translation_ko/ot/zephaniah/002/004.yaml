  source_fidelity: ‘כִּי’는 앞선 권면의 근거를 제시하므로 ‘그러므로’보다 ‘이는’이 적절합니다. 또한 아스돗을 받는 히브리어 여성 단수 접미사는 도시를 가리키는데, 초안의 ‘그를’은 한국어에서 남성 인물을 가리켜 지시 대상과 문법적 자연스러움을 해칩니다. 이를 도시명 반복과 피동 표현으로 바로잡았습니다. 원문의 불특정 복수 행위자는 한국어 피동으로 무리 없이 보존됩니다.
  naturalness: 열거되는 심판 선언은 ‘이는 … 것이며’ 구조와 일관된 합쇼체 미래형으로 자연스럽게 표현했습니다. 대시로 삽입된 구문은 한국어에서는 쉼표를 사용한 직선적 열거가 더 자연스럽습니다.
  terminology: 통용 성경 지명인 가사, 아스글론, 아스돗, 에그론을 유지했습니다. ‘뿌리째 뽑힐 것입니다’는 עקר의 비유를 정확하고 자연스럽게 전달합니다. 가사-버려질의 히브리어 음성 유사성 주석은 해당 지명 바로 뒤에 옮겼고, 원문 및 영어 감사 기록의 ‘한낮’ 주석도 추가했습니다.
