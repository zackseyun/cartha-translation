  - 황폐해질 것이며
  lexicon: HALOT
  rationale: עזב의 수동적 결과를 간결하게 살리되, ‘가사’와의 말장난 가능성도 과도하게 설명하지 않고 열어 두었습니다.
- source_word: לִשְׁמָמָה
