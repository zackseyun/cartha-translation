  lexicon: HALOT
  rationale: גַּם의 포함·첨가 의미를 '도'로 자연스럽게 살리고, אַתֶּם의 직접 호칭을 한국어 어순에 맞게 앞에 배치했습니다.
- source_word: כּוּשִׁים
  english_pob_choice: Cushites
  chosen_korean: 구스 사람들
  alternatives_korean:
