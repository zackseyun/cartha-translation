  - 에티오피아 사람들
  lexicon: HALOT
  rationale: 지명/민족명 כּוּשִׁים은 현대 지리명으로 바꾸기보다 '구스'를 음역해 원문 지시 대상을 보존하는 것이 적절합니다.
- source_word: חַֽלְלֵי חַרְבִּי הֵמָּה
  english_pob_choice: will be slain by my sword
  chosen_korean: 내 칼에 죽임을 당할 것입니다
  alternatives_korean:
  - 내 칼에 쓰러질 것입니다
  - 내 칼에 죽은 자들입니다
  lexicon: HALOT
  rationale: חַלְלֵי는 '죽임을 당한 자들'의 뜻이므로 결과적 피해를 한국어 수동 표현으로 옮겼고, חַרְבִּי는 '내 칼'로 직역해 심판의 구체적 이미지를 유지했습니다.
theological_decisions:
