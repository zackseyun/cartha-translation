  rationale: 히브리어의 서술절은 예언 문맥에서 장차 임할 심판을 말하므로, 한국어에서도 미래형으로 옮겨 본문의 선고적 힘을 분명히 했습니다.
  doctrine_reference: 예언 문체의 미래적 확정성
