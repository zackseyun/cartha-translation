  text: עָבְשׁ֣וּ פְרֻד֗וֹת תַּ֚חַת מֶגְרְפֹ֣תֵי/הֶ֔ם נָשַׁ֨מּוּ֙ אֹֽצָר֔וֹת נֶהֶרְס֖וּ מַמְּגֻר֑וֹת כִּ֥י הֹבִ֖ישׁ דָּגָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
  footnotes:
  - marker: a
    text: Hebrew פְרֻדוֹת is rare and uncertain; it likely refers to seeds or grain kernels. Some render it more specifically as 'seed-corns' or 'grains.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew מֶגְרְפֹתֵיהֶם is also uncertain. The translation 'their clods' follows the agricultural context ('beneath their clods'), but others render it 'their furrows' or even 'their hoes/shovels.'
    reason: lexical_alternative
translation:
  language: ko
  text: 씨앗들은 그들의 흙덩이 아래에서 말라버렸습니다[a]. 창고들은 황폐해지고, 곳간들은 무너졌습니다[b]. 이는 곡식이 말라버렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְרֻדוֹת는 드문 말로, 여기서는 씨앗 또는 씨알을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מֶגְרְפֹתֵיהֶם는 뜻이 불확실합니다. 여기서는 농경 문맥에 따라 ‘흙덩이’로 옮겼지만, ‘고랑들’, ‘쟁기/삽’으로도 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְשׁוּ פְרֻדוֹת
  english_pob_choice: The seeds have shriveled
  chosen_korean: 씨앗들은 ... 말라버렸습니다
  alternatives_korean:
  - 씨앗들은 ... 쪼그라들었습니다
  - 씨알들은 ... 말라버렸습니다
  lexicon: HALOT
  rationale: 희귀한 פְרֻדוֹת의 불확실성을 반영하되, 문맥상 토양 아래의 씨앗/씨알을 가리키는 뜻을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: תַּחַת מֶגְרְפֹתֵיהֶם
  english_pob_choice: beneath their clods
  chosen_korean: 그들의 흙덩이 아래에서
  alternatives_korean:
  - 그들의 고랑 아래에서
  - 그들의 쟁기 아래에서
  lexicon: HALOT
  rationale: 문맥상 곡식이 덮인 흙덩이를 가리키는 해석이 가장 일관되므로, 영어 POB의 선택을 따라 공간 관계를 분명하게 살렸습니다.
- source_word: נָשַׁמּוּ אֹצָרוֹת נֶהֶרְסוּ מַמְּגֻרוֹת
  english_pob_choice: the storehouses are desolate, the granaries are torn down
  chosen_korean: 창고들은 황폐해지고, 곳간들은 무너졌습니다
  alternatives_korean:
  - 저장고들은 황폐해지고, 곡물창고들은 허물어졌습니다
  - 창고들은 폐허가 되었고, 곳간들은 부서졌습니다
  lexicon: HALOT
  rationale: אֹצָרוֹת와 מַמְּגֻרוֹת를 농경 맥락에 맞게 저장 시설로 옮기고, נָשַׁמּוּ/נֶהֶרְסוּ의 파괴 상태를 한국어 동사로 자연스럽게 표현했습니다.
- source_word: הֹבִישׁ דָּגָן
  english_pob_choice: because the grain has dried up
  chosen_korean: 이는 곡식이 말라버렸기 때문입니다
  alternatives_korean:
