  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
  footnotes:
  - marker: a
    text: Hebrew פְרֻדוֹת is rare and uncertain; it likely refers to seeds or grain kernels. Some render it more specifically as 'seed-corns' or 'grains.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew מֶגְרְפֹתֵיהֶם is also uncertain. The translation 'their clods' follows the agricultural context ('beneath their clods'), but others render it 'their furrows' or even 'their hoes/shovels.'
    reason: lexical_alternative
translation:
  language: ko
  text: 씨앗들은[a] 흙덩이[b] 아래에서 말라버렸습니다. 창고들은 황폐해졌고, 곳간들은 무너졌습니다. 이는 곡식이 말라버렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְרֻדוֹת는 드문 말로 뜻이 불확실합니다. 여기서는 씨앗 또는 씨알을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מֶגְרְפֹתֵיהֶם는 뜻이 불확실합니다. 여기서는 농경 문맥에 따라 ‘흙덩이’로 옮겼지만, ‘고랑들’ 또는 ‘괭이/삽’으로도 볼 수 있습니다.
    reason: lexical_alternative
