review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ‘금식일’은 원문의 צוֹם(금식)에 없는 ‘날’을 더하며, ‘거룩히 선포하십시오’는 קדשׁ(거룩하게 구별하다)와 ‘선포하다’를 혼합합니다. 또한 ‘모아 … 데려가고’는 원문의 한 명령(아스פוּ)을 두 동작으로 풀어 원문 구조를 다소 바꿉니다.
  naturalness: ‘금식을 거룩하게 구별하십시오’, ‘엄숙한 집회를 소집하십시오’, ‘… 집에 모으십시오’는 현대 표준어 합쇼체로 자연스럽고, 공적 예배 소집의 격식을 유지합니다.
  terminology: 야훼, 하나님, 장로들, 부르짖으십시오는 적절합니다. בֵּית יְהוָה는 문맥상 성전을 가리키지만, ‘야훼 너희 하나님의 집’은 원문의 ‘집’ 표현을 보존하는 안전한 번역입니다.
  issues:
