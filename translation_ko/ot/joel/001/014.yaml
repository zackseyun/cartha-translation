  to: 금식을 거룩하게 구별하십시오. 엄숙한 집회를 소집하십시오. 장로들과 땅[a]의 모든 주민을 야훼 너희 하나님의 집에 모으고, 야훼께 부르짖으십시오.
  rationale: 원문의 네 명령을 각각 보존했습니다. קדשׁ는 ‘거룩하게 구별하다’로, קרא עֲצָרָה는 ‘엄숙한 집회를 소집하다’로, אסף는 사람들을 하나님의 집에 ‘모으다’로 옮겼습니다. הָאָרֶץ의 의미 범위는 본문에서는 ‘땅’으로 유지하고 각주에서 ‘세상/온 땅’ 가능성을 밝혔습니다.
