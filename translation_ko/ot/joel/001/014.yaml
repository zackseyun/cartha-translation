  - severity: medium
    issue: ‘장로들과 … 주민을 모아 … 집으로 데려가고’
    rationale: אִסְפוּ는 장로들과 주민을 하나님의 집에 모으라는 단일 명령입니다. ‘데려가고’는 별도의 이동 행위를 추가하고 접속 구조를 변경합니다.
  - severity: low
