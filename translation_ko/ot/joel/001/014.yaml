id: JOL.1.14
reference: Joel 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַדְּשׁוּ צוֹם֙ קִרְא֣וּ עֲצָרָ֔ה אִסְפ֣וּ זְקֵנִ֗ים כֹּ֚ל יֹשְׁבֵ֣י הָ/אָ֔רֶץ בֵּ֖ית יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/זַעֲק֖וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/014.yaml
  text: Consecrate a fast; call a solemn assembly. Gather the elders[a], all the inhabitants of the land, to the house of Yahweh your God, and cry out to Yahweh.
  footnotes:
  - marker: a
    text: Or "all the inhabitants of the earth." The Hebrew word can mean either "land" or "earth"; here the local sense fits the temple-centered summons in context.
    reason: alternative_reading
translation:
  language: ko
  text: 금식을 거룩하게 구별하십시오. 엄숙한 집회를 소집하십시오. 장로들과 땅[a]의 모든 주민을 야훼 너희 하나님의 집에 모으고, 야훼께 부르짖으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘땅’은 ‘세상’ 또는 ‘온 땅’으로도 옮길 수 있습니다. 그러나 여기서는 성전을 중심으로 한 소집이라는 문맥상 지역적 의미가 더 알맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ צוֹם
  english_pob_choice: Consecrate a fast
  chosen_korean: 금식일을 거룩히 선포하십시오
  alternatives_korean:
  - 금식을 거룩히 구별하십시오
  - 금식을 성별하십시오
  lexicon: HALOT
  rationale: קדשׁ의 예배적·공적 성격을 살리면서 한국어에서는 ‘거룩히 선포하다’가 금식의 공식적 제정이라는 의미를 자연스럽게 드러냅니다.
- source_word: עֲצָרָה
  english_pob_choice: a solemn assembly
  chosen_korean: 엄숙한 모임
  alternatives_korean:
  - 거룩한 모임
  - 엄정한 집회
  lexicon: HALOT
  rationale: 이 명사는 절제되고 경건한 집회를 가리키므로, 교회 용어의 관습에만 기대지 않고 ‘엄숙한 모임’으로 옮겨 공적·의례적 무게를 살렸습니다.
- source_word: בֵּית יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: the house of Yahweh your God
  chosen_korean: 야훼 너희 하나님의 집
  alternatives_korean:
  - 야훼 너희 하나님 전으로
  - 야훼 너희 하나님의 성전으로
  lexicon: HALOT
  rationale: ‘house’는 여기서 성전/성소를 가리키지만, 원문 자체의 표현을 보존하기 위해 ‘집’으로 두었습니다. 소유격 ‘너희 하나님’도 그대로 살렸습니다.
- source_word: וְזַעֲקוּ
  english_pob_choice: and cry out
  chosen_korean: 부르짖으십시오
  alternatives_korean:
  - 외치십시오
  - 간구하십시오
  lexicon: HALOT
  rationale: זעק의 강한 애통·호소의 뉘앙스를 반영하여 단순한 ‘외치다’보다 긴급한 청원성을 드러내는 ‘부르짖다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문의 고유신명사 יְהוָה를 전통적 호칭어가 아니라 학술적 음역 ‘야훼’로 일관되게 옮겨, 본문이 가진 고유명칭성을 보존했습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: 땅의 모든 주민
  alternative_readings:
  - 땅의 모든 사람들
  - 온 땅의 주민
  rationale: 욜 1장의 문맥은 성전을 중심으로 한 유다 지역의 회개 소집이므로, 보편적 ‘세상’보다 지역적·언약적 범위를 드러내는 ‘땅’이 더 적절합니다.
  doctrine_reference: 'Translation philosophy §1: 원어 우선과 문맥 우선'
- issue: 직접 명령체의 격식
  chosen_reading: 금식일을 거룩히 선포하십시오 / ... 부르짖으십시오
  alternative_readings:
  - 선포하라 / 부르짖어라
  rationale: 예언적 공적 호소의 어조를 살리되 현대 출판용 한국어 합쇼체를 유지하기 위해 존대 명령형을 사용했습니다.
  doctrine_reference: 'Korean target style: modern formal-polite (합쇼체)'
