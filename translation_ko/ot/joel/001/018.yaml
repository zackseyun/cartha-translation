  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה נֶּאֶנְחָ֣ה בְהֵמָ֗ה נָבֹ֨כוּ֙ עֶדְרֵ֣י בָקָ֔ר כִּ֛י אֵ֥ין מִרְעֶ֖ה לָ/הֶ֑ם גַּם עֶדְרֵ֥י הַ/צֹּ֖אן נֶאְשָֽׁמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/018.yaml
  text: How the animals groan! The herds of cattle wander in confusion[a], because there is no pasture for them[b]; even the flocks of sheep suffer.
  footnotes:
  - marker: a
    text: Or 'are bewildered' or 'are perplexed.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bear guilt' / 'are held guilty.' The Hebrew verb can carry judicial overtones; here it likely means the sheep suffer the consequences of the devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 가축들이 어찌 신음합니까! 소 떼는 혼란에 빠져 헤맵니다.[a] 그들에게 목초지가 없기 때문입니다. 양 떼마저 고통을 겪습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼란스러워합니다’ 또는 ‘당혹해합니다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄책을 짊어집니다’ 또는 ‘유죄로 여겨집니다’. 히브리어 동사는 법정적 함의를 가질 수 있으나, 여기서는 양 떼가 황폐의 결과를 겪는다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  english_pob_choice: How
  chosen_korean: 어찌
  alternatives_korean:
  - 어떻게
  - 얼마나
  lexicon: HALOT
  rationale: 탄식의 감탄사로 시작하는 מקור의 뉘앙스를 살리기 위해, 단순 의문보다 감정이 실린 ‘어찌’를 택했습니다.
- source_word: בְהֵמָה
  english_pob_choice: the animals
  chosen_korean: 짐승들
  alternatives_korean:
  - 동물들이
  - 가축들이
  lexicon: HALOT
  rationale: 집합적 표현으로서의 넓은 범위를 살리되, 바로 뒤에 소 떼가 따로 나오는 점을 고려해 너무 좁은 ‘가축들’보다 포괄적인 ‘짐승들’이 적합합니다.
- source_word: נָבֹכוּ
  english_pob_choice: wander in confusion
  chosen_korean: 어리둥절하여 헤매는
  alternatives_korean:
  - 혼란에 빠져 헤매는
  - 당황하여 헤매는
  - 어리둥절해하는
  lexicon: HALOT
  rationale: ‘혼란/당혹’의 의미와 이동의 이미지를 함께 살리기 위해 상태 표현과 동작을 결합한 한국어로 옮겼습니다.
- source_word: נֶאְשָׁמוּ
  english_pob_choice: suffer
  chosen_korean: 고통을 겪습니다
  alternatives_korean:
  - 죄책을 짊어집니다
  - 유죄가 됩니다
  - 수치를 당합니다
  lexicon: HALOT
  rationale: 이 동사는 본래 죄책/책임의 법정적 뉘앙스를 가질 수 있지만, 여기서는 양이 도덕적으로 유죄라는 뜻이 아니라 황폐의 결과를 겪는다는 의미이므로 그 긴장을 보존하면서도 과도한 법정적 해석을 피했습니다.
theological_decisions:
- issue: 동물에게 אשם 계열 동사를 적용하는 방식
  chosen_reading: 양 떼가 도덕적 유죄를 지는 것이 아니라, 재앙의 결과로 고통을 겪는 것으로 읽었습니다.
  alternative_readings:
  - 양 떼가 유죄가 됩니다
  - 양 떼가 죄책을 짊어집니다
  - 양 떼가 황폐해집니다
  rationale: 문맥은 땅과 생태계가 겪는 언약적 심판의 황폐이며, 동물에게 윤리적 죄책을 직접 부과하면 본문의 긴장을 넘어선 해석이 됩니다. 그래서 법정적 함의는 남기되 의미를 과장하지 않도록 했습니다.
  doctrine_reference: 해석의 긴장을 보존하고, 본문이 말하지 않는 교리적 단정을 덧씌우지 않습니다.
