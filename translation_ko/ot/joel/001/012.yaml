  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
  footnotes:
  - marker: a
    text: Or possibly 'the apricot tree'; the precise species denoted by Hebrew tappuach is uncertain.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''from humankind'' / ''from humanity.'' Hebrew: ''from the sons of man.'''
    reason: alternative_reading
translation:
  language: ko
  text: 포도나무가 말랐고 무화과나무가 시들었으며, 석류나무와 함께 종려나무와 사과나무도 말랐습니다. 들의 모든 나무가 말랐으니, 이는 사람의 자손에게서 기쁨이 말랐기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사과나무’는 히브리어 tappuach의 전통적 번역이지만, 정확한 식물종은 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람의 자손’은 히브리어의 직역입니다. 문맥상 ‘인류’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן / הוֹבִישָׁה
  english_pob_choice: the vine / has dried up
  chosen_korean: 포도나무가 말랐고
