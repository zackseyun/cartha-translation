- source_word: הַתְּאֵנָה / אֻמְלָלָה
  english_pob_choice: the fig tree / has withered
  chosen_korean: 무화과나무가 시들었으며
  alternatives_korean:
  - 무화과나무가 말랐으며
  - 무화과가 시들었으며
  lexicon: HALOT
  rationale: תְּאֵנָה는 열매보다 나무를 가리키는 목록으로 읽는 것이 적절하며, אֻמְלָלָה는 ‘시들다’가 ‘말라 버리다’와 구별되는 약화·축 늘어짐의 뉘앙스를 잘 담습니다.
- source_word: רִמּוֹן / תָּמָר / תַפּוּחַ
  english_pob_choice: the pomegranate / the palm / the apple tree
  chosen_korean: 석류나무와 함께 종려나무와 사과나무도
  alternatives_korean:
  - 석류나무와 종려나무와 사과나무도
  - 석류와 종려나무와 사과나무도
  lexicon: HALOT
  rationale: 열거되는 식물명들은 한국어에서 나무 이름으로 옮겨 주는 것이 문맥상 분명하며, גַּם은 단순 첨가의 ‘함께/또’로 살려 목록의 흐름을 유지했습니다.
- source_word: כָּל עֲצֵי הַשָּׂדֶה / יָבֵשׁוּ / כִּי הֹבִישׁ שָׂשׂוֹן
  english_pob_choice: all the trees of the field have dried up / Indeed, joy has dried up
  chosen_korean: 들의 모든 나무가 말랐으니, 이는 사람의 자손에게서 기쁨이 말랐기 때문입니다.
  alternatives_korean:
  - 밭의 모든 나무가 말랐으니, 이는 사람의 자손에게서 기쁨이 말랐기 때문입니다.
  - 들판의 모든 나무가 말랐으니, 이는 사람의 자손에게서 기쁨이 말랐기 때문입니다.
  lexicon: HALOT
  rationale: עֲצֵי הַשָּׂדֶה는 직역하면 ‘들의 나무들’이지만 한국어에서는 ‘들의 모든 나무’가 더 자연스럽고, כִּי는 결과·설명의 ‘이는 … 때문입니다’로 옮겨 애가의 논리적 연결을 드러냈습니다.
