  - 인류에게서
  - 사람들에게서
  lexicon: HALOT
  rationale: בְּנֵי אָדָם의 대표적 인칭 표현을 그대로 살리되, 한국어에서는 ‘사람의 자손’이 원문의 관용적이고 시적인 인류 지시를 보존합니다.
theological_decisions:
- issue: בְּנֵי אָדָם의 성중립화 여부
  chosen_reading: ‘사람의 자손’으로 원문의 남성 대표 표현을 유지했습니다.
  alternative_readings:
