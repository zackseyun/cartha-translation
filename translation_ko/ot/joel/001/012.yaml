  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
  footnotes:
  - marker: a
    text: Or possibly 'the apricot tree'; the precise species denoted by Hebrew tappuach is uncertain.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''from humankind'' / ''from humanity.'' Hebrew: ''from the sons of man.'''
    reason: alternative_reading
translation:
  language: ko
  text: 포도나무는 말랐고 무화과나무는 시들었습니다. 석류나무도, 종려나무와 사과나무[a]도, 들의 모든 나무가 말랐습니다. 참으로 기쁨이 사람의 자손에게서[b] 말라 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사과나무’는 히브리어 תַּפּוּחַ(tappuach)의 전통적 번역입니다. 정확한 식물종은 불확실하며, ‘살구나무’일 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘사람의 아들들에게서’입니다. 문맥상 ‘인류에게서’ 또는 ‘인간에게서’라는 뜻입니다.
    reason: alternative_reading
