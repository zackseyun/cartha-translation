  text: 그것이 내 포도나무를 황폐하게 하고 내 무화과나무를 부서진 잔해로 만들었습니다[a]. 그것이 그 무화과나무를 완전히 벗기고 내던졌으며, 그 가지들이 하얗게 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 무화과나무를 그루터기로’; 히브리어 명사는 드물며, ‘그루터기들’이나 부서진 잔해를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것의 새순들/덩굴들이 하얗게 되었습니다’; 아마도 껍질이 벗겨져 드러난 나무의 흰 속살을 묘사합니다.
    reason: lexical_alternative
