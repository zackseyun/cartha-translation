  rationale: 어휘가 매우 희귀해 단정적 단일 의미로 잠그기보다, 본문은 읽히는 이미지에 집중하고 각주로 의미 범위를 열어 두는 것이 출처 충실성에 더 부합합니다.
  doctrine_reference: source-critical lexical restraint
