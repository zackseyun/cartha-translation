  text: שָׂ֤ם גַּפְנִ/י֙ לְ/שַׁמָּ֔ה וּ/תְאֵנָתִ֖/י לִ/קְצָפָ֑ה חָשֹׂ֤ף חֲשָׂפָ/הּ֙ וְ/הִשְׁלִ֔יךְ הִלְבִּ֖ינוּ שָׂרִיגֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/007.yaml
  text: It has made my vine a desolation and my fig tree splinters[a]; it has stripped it bare and thrown it down[b]; its branches have turned white.
  footnotes:
  - marker: a
    text: Or 'my fig tree into splinters'; the Hebrew noun is rare and may also suggest 'stumps' or shattered remains.
    reason: lexical_alternative
  - marker: b
    text: Or 'its shoots/tendrils have become white,' likely describing exposed wood after the bark has been stripped away.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 내 포도나무를 황폐하게 하고 내 무화과나무를 조각내었습니다[a]. 그것이 그것을 벌거벗겨 내던졌으니[b], 그 가지들이 하얗게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 무화과나무를 그루터기로’; 히브리어 명사는 드물며, ‘그루터기들’이나 부서진 잔해를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것의 새순/덩굴이 하얗게 되었습니다’; 아마도 껍질이 벗겨져 드러난 나무의 흰 속살을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם
  english_pob_choice: has made
  chosen_korean: 황폐하게 하고
  alternatives_korean:
  - 만들었습니다
  - 되게 했습니다
  - 황폐로 만들었습니다
  lexicon: HALOT
  rationale: ‘두다/놓다’의 기본 의미보다 לְשַׁמָּה와 결합한 결과 상태를 살려, 한국어에서는 ‘황폐하게 하다’로 옮기는 것이 자연스럽습니다.
- source_word: גַּפְנִי
  english_pob_choice: my vine
  chosen_korean: 내 포도나무
  alternatives_korean:
  - 내 포도밭
  - 내 덩굴나무
  lexicon: HALOT
  rationale: 히브리어 גֶּפֶן은 ‘포도나무’이므로, 영어 POB의 ‘my vine’에 맞추되 한국어에서는 식물체를 분명히 드러내는 ‘포도나무’가 적절합니다.
- source_word: לִקְצָפָה
  english_pob_choice: splinters
  chosen_korean: 조각내었습니다
  alternatives_korean:
  - 부서졌습니다
  - 그루터기가 되었습니다
  - 산산조각이 되었습니다
  lexicon: HALOT
  rationale: 희귀어로서 파괴된 나무의 잔해를 가리키는 뉘앙스를 살려, 본문에는 동적 표현으로 ‘조각내었습니다’를 두고, 어휘 난점을 각주로 남겼습니다.
- source_word: וְהִשְׁלִיךְ
  english_pob_choice: thrown it down
  chosen_korean: 내던졌으니
  alternatives_korean:
  - 내버렸으니
  - 던져 버렸으니
  - 내팽개쳤으니
  lexicon: HALOT
  rationale: 히필의 강한 던짐/내침을 한국어 동사 ‘내던지다’로 살려, 단순한 폐기보다 폭력적 파괴의 감각을 유지했습니다.
- source_word: שָׂרִיגֶיהָ
  english_pob_choice: its branches
  chosen_korean: 그 가지들
  alternatives_korean:
  - 그 새순들
  - 그 덩굴들
  - 그 가지치기한 부분들
  lexicon: HALOT
  rationale: שָׂרִיג은 포도나무의 덩굴·새순까지 가리킬 수 있지만, 뒤의 ‘하얗게 되었습니다’와 함께 나무의 드러난 가지를 말하는 것으로 보아 한국어에서는 가장 넓고 자연스러운 ‘가지들’을 선택했습니다.
theological_decisions:
- issue: 희귀어 לִקְצָפָה의 처리
  chosen_reading: 본문에는 ‘조각내었습니다’로 옮기고, 각주에서 ‘그루터기/부서진 잔해’ 가능성을 밝혔습니다.
  alternative_readings:
  - 그루터기가 되었습니다
