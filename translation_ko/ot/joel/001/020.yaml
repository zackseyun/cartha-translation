  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם בַּהֲמ֥וֹת שָׂדֶ֖ה תַּעֲר֣וֹג אֵלֶ֑י/ךָ כִּ֤י יָֽבְשׁוּ֙ אֲפִ֣יקֵי מָ֔יִם וְ/אֵ֕שׁ אָכְלָ֖ה נְא֥וֹת הַ/מִּדְבָּֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/020.yaml
  text: Even the beasts of the field pant for you[a], because the channels of water have dried up[c][b], and fire has consumed the pastures of the wilderness.
  footnotes:
  - marker: a
    text: Or 'toward you.' The Hebrew expression can be rendered more literally with directional force; 'for you' is chosen because it fits the English idiom 'pant for.'
    reason: lexical_alternative
  - marker: b
    text: Or 'watercourses' or 'streams' for 'channels of water.'
    reason: lexical_alternative
  - marker: c
    text: Or 'grazing places' for 'pastures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들판의 짐승들까지도 주님께로 헐떡입니다[a]. 물길들이 말랐고[b], 불이 광야의 목초지를[c] 삼켰기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 향하여’. 히브리어 표현은 방향성을 더 직접적으로 담을 수 있지만, ‘헐떡입니다’와는 ‘주님께로’가 한국어로 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘수로들’이나 ‘시내들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘풀밭’이나 ‘목장 자리’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲמוֹת שָׂדֶה
  english_pob_choice: the beasts of the field
  chosen_korean: 들판의 짐승들
  alternatives_korean:
  - 들판의 짐승들
  - 들짐승들
  - 야생 짐승들
  lexicon: HALOT
  rationale: בהמות שדה는 단순 가축보다 넓은 의미의 들짐승/야생동물을 가리키므로, 자연스럽고 간결한 ‘들판의 짐승들’로 옮겼습니다.
- source_word: תַּעֲרֹג אֵלֶיךָ
  english_pob_choice: pant for you
  chosen_korean: 주님께로 헐떡입니다
  alternatives_korean:
  - 주님을 향해 헐떡입니다
  - 주님께로 갈망합니다
  - 주님께로 목말라합니다
  lexicon: HALOT
  rationale: ערג는 목마름 속의 헐떡임과 갈망을 함께 담으므로, 물리적 절박함을 살리는 ‘헐떡입니다’를 택했고, 방향성을 ‘께로’로 반영했습니다.
- source_word: אֲפִיקֵי מָיִם
  english_pob_choice: the channels of water
  chosen_korean: 물의 시내들
  alternatives_korean:
  - 물길이
  - 물의 통로가
  - 시내들이
  lexicon: HALOT
  rationale: אפיקים은 물이 흐르던 골짜기/수로를 뜻하므로, 한국어로는 읽기 자연스러운 ‘물의 시내들’이 원문의 건조한 수로 이미지를 비교적 잘 보존합니다.
- source_word: נְאוֹת הַמִּדְבָּר
  english_pob_choice: the pastures of the wilderness
  chosen_korean: 광야의 풀밭
  alternatives_korean:
  - 광야의 목초지
  - 광야의 풀밭들
  - 광야의 초지
  lexicon: HALOT
  rationale: נאות는 목초지·풀밭·목장 자리를 가리키므로, 시각적 이미지가 분명한 ‘풀밭’으로 옮겨 광야의 황폐함을 드러냈습니다.
theological_decisions:
- issue: 2인칭 단수 접미사 אֵלֶיךָ의 호칭 대상
  chosen_reading: 문맥상 하나님께 드리는 방향성을 살려 ‘주님께로’로 번역했습니다.
  alternative_readings:
  - 비인격적 갈망으로 처리
  - ‘주님을 향해’로 더 직역
  rationale: 직전 문맥이 재난 속 탄식과 기도의 흐름을 이루므로, 동물들의 헐떡임도 하나님을 향한 방향성으로 읽는 것이 본문 흐름에 가장 잘 맞습니다.
  doctrine_reference: 문맥 우선의 지시 대상 해석을 유지하며, 해석적 긴장을 과도하게 평탄화하지 않습니다.
