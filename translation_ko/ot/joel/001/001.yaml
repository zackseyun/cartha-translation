  terminology: ‘야훼’, ‘말씀’, ‘임했습니다’는 원문의 신명, 예언 계시 관용구, 합쇼체 격식에 잘 맞습니다. פְּתוּאֵל은 한국어 성경에서 통용되는 ‘브두엘’로 유지합니다. 대안 각주는 영어 감사 기록의 lexical alternative에 맞추어 ‘말씀/메시지’의 대안으로 조정하고, 신명 각주는 한국어 전통 표기인 ‘여호와’를 밝혀야 합니다.
