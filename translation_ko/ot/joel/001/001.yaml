lexical_decisions:
- source_word: דְּבַר יְהוָה
  english_pob_choice: The word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  lexicon: HALOT
  rationale: 예언서의 관용구인 ‘YHWH의 말씀’을 그대로 살려, דְּבַר의 형식적·신학적 연결을 보존했습니다. ‘말씀’이 한국어 성경에서 가장 자연스럽고도 원문에 충실합니다.
- source_word: אֲשֶׁר הָיָה אֶל
  english_pob_choice: that came to
  chosen_korean: 임했습니다
  alternatives_korean:
  - 왔습니다
  - 전해졌습니다
  - 있었습니다
  lexicon: HALOT
  rationale: 이 표현은 예언적 계시가 예언자에게 ‘이르다/임하다’는 관용구이므로, 문어체 한국어에서 자연스러운 ‘임했습니다’로 옮겼습니다. 단순 이동이 아니라 계시의 도착을 드러냅니다.
- source_word: יוֹאֵל בֶּן פְּתוּאֵל
  english_pob_choice: Joel son of Pethuel
  chosen_korean: 요엘, 브두엘의 아들
  alternatives_korean:
  - 요엘, 브두엘의 아들인
  - 브두엘의 아들 요엘
  - 요엘, 베두엘의 아들
  lexicon: HALOT
  rationale: 고유명사는 한국어 성서에서 통용되는 ‘요엘’을 따르고, בֶּן은 친족관계 표지이므로 ‘아들’로 직역했습니다. 이름 표기는 널리 쓰이는 음역을 우선했습니다.
theological_decisions:
- issue: יהוה(YHWH) divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 원문이 직접 하나님의 고유명 יְהוָה를 사용하므로, 한국어 본문에서도 제목어가 아니라 신명 표기 ‘야훼’를 유지했습니다. 이는 POB의 본문 투명성과 사본-원문 대조 가능성을 살립니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
