  rationale: 본문은 재난 앞에서 농업 종사자들을 향한 예언자의 선포이므로, 명령형의 긴박함과 공개적 수치를 흐리지 않는 것이 소스에 충실합니다.
  doctrine_reference: 예언서 문체와 수사에 대한 본문 중심 해석
