  yaml_path: translation/ot/joel/001/011.yaml
  text: Be ashamed[a], farmers; wail, vinedressers, over the wheat and over the barley[b], because the harvest of the field has perished.
  footnotes:
  - marker: a
    text: Or 'Be dismayed' or 'Be put to shame.' The Hebrew verb can carry either emotional distress or public shame; the main text keeps the direct imperative force.
    reason: lexical_alternative
  - marker: b
    text: Or 'howl' for 'wail.' The Hebrew verb denotes a loud cry of grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 농부들아, 부끄러워하십시오[a]. 포도 재배자들아, 밀과 보리 때문에 통곡하십시오[b]. 밭의 수확이 망하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당황하십시오’, ‘수치를 당하십시오’. 히브리어 동사는 감정적 당혹과 공적 수치를 모두 나타낼 수 있으므로, 본문은 직접적인 명령형을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘울부짖으십시오’. 히브리어 동사는 슬픔으로 크게 외치는 것을 뜻합니다.
    reason: lexical_alternative
