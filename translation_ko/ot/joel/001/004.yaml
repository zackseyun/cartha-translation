translation:
  language: ko
  text: 갉아 먹는 메뚜기가 남긴 것을 무리 지어 다니는 메뚜기가 먹고, 무리 지어 다니는 메뚜기가 남긴 것을 뛰는 메뚜기가 먹고, 뛰는 메뚜기가 남긴 것을 삼켜 먹는 메뚜기가 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 네 표현은 메뚜기의 종류나 발육 단계를 가리킬 수 있으나, 정확한 동물학적 구별은 확실하지 않습니다. ‘갉아 먹는’, ‘무리 지어 다니는’, ‘뛰는’, ‘삼켜 먹는’은 가능한 의미를 드러낸 번역입니다.
    reason: lexical_alternative
