  rationale: 히브리어 용어의 정확한 분류는 불확실하므로, 본문이 강조하는 것은 분류학이 아니라 먹어 치우는 재난의 누적이라는 점을 보존했습니다.
  doctrine_reference: '본문 주해 원칙: 의미 보존과 과도한 확정 회피'
