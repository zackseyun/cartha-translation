  text: What the cutting locust left[a], the swarming locust ate; and what the swarming locust left, the hopping locust ate; and what the hopping locust left, the devouring locust ate.
  footnotes:
  - marker: a
    text: The four Hebrew terms likely refer to kinds or stages of locusts, but their exact zoological distinctions are uncertain; possible renderings include 'gnawing,' 'swarming,' 'hopping,' and 'devouring' locust.
    reason: lexical_alternative
translation:
  language: ko
  text: 무엇이 남아 있든, 그 여물벌레가 먹어 버렸습니다. 무엇이 그 여물벌레에 남았든, 그 메뚜기가 먹어 버렸습니다. 무엇이 그 메뚜기에 남았든, 그 누리벌레가 먹어 버렸습니다. 무엇이 그 누리벌레에 남았든, 그 메뚜깟벌레가 먹어 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 네 표현은 메뚜기의 종류 또는 단계들을 가리킬 가능성이 있지만, 정확한 생물학적 구분은 확실하지 않습니다.
    reason: lexical_alternative
