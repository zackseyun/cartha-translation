base_translation:
  language: en
  yaml_path: translation/ot/joel/001/008.yaml
  text: Wail like a virgin clothed in sackcloth for the husband of her youth[a][b].
  footnotes:
  - marker: a
    text: Or 'girded with sackcloth.'
    reason: lexical_alternative
  - marker: b
    text: '''Husband'' may also be understood as ''betrothed,'' since the image is poetic and culturally compressed.'
