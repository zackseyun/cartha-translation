translation:
  language: ko
  text: “처녀처럼 울며, 젊은 시절의 남편을 위해 굵은 베옷을 입은 자처럼 하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “베옷으로 띠를 두른”이라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘남편’은 문맥상 ‘약혼자’로도 이해될 수 있습니다. 시적 이미지가 압축되어 있기 때문입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִי
  english_pob_choice: Wail
  chosen_korean: 울며
  alternatives_korean:
  - 통곡하며
  - 곡하며
  lexicon: HALOT
  rationale: 명령형 여성 단수의 애도 호소로서, 한국어에서는 감정의 강도를 살리되 문맥상 자연스러운 “울며”를 택했습니다.
- source_word: כִּבְתוּלָה
  english_pob_choice: like a virgin
  chosen_korean: 처녀처럼
  alternatives_korean:
  - 동정녀처럼
  - 미혼의 젊은 여자처럼
  lexicon: HALOT
  rationale: 비교를 나타내는 כ의 기능을 살려 “처럼”으로 옮기고, בְּתוּלָה는 청춘/미혼의 이미지를 포함하는 기본 의미를 반영해 “처녀”로 옮겼습니다.
- source_word: חֲגֻרַת שַׂק
  english_pob_choice: clothed in sackcloth
  chosen_korean: 굵은 베옷을 입은
  alternatives_korean:
  - 베옷을 띠로 두른
  - 애통의 베옷을 걸친
  lexicon: HALOT
  rationale: 히브리어의 문자적 뜻은 ‘베옷으로 띠를 띤’이지만, 한국어에서는 애도 의복 상태를 자연스럽게 드러내는 “굵은 베옷을 입은”이 문맥에 더 적절합니다.
- source_word: בַּעַל נְעוּרֶיהָ
  english_pob_choice: husband of her youth
  chosen_korean: 젊은 시절의 남편
  alternatives_korean:
  - 어릴 적 남편
  - 청춘의 남편
  - 젊은 시절의 약혼자
  lexicon: HALOT
  rationale: בַּעַל은 관계상 ‘남편’이 기본값이지만, 영어 POB가 지적하듯 betrothed 가능성도 있으므로 본문에서는 해석을 덜 강요하는 “젊은 시절의 남편”으로 옮겨 긴장을 보존했습니다.
theological_decisions:
- issue: ‘처녀’와 ‘남편’의 결합이 주는 문화적 압축과 해석 긴장
  chosen_reading: 본문의 압축된 애도 이미지를 그대로 유지하되, 약혼자 등으로 본문 의미를 미리 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘젊은 신부처럼’으로 풀어 씀
  - ‘약혼자’를 본문에 반영
  rationale: 히브리어는 시적 압축을 사용하므로, 번역이 문화적 긴장을 해소해 버리기보다 독자가 그 긴장을 보도록 남겨 두는 것이 원문 효과를 더 잘 살립니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
