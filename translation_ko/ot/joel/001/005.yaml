  yaml_path: translation/ot/joel/001/005.yaml
  text: Wake up[a], you drunkards, and weep; wail, all you drinkers of wine, over the sweet wine, because it has been cut off from your mouth.
  footnotes:
  - marker: a
    text: Or 'new wine' or 'fresh wine' for the Hebrew עָסִיס.
    reason: lexical_alternative
translation:
  language: ko
  text: 술 취한 자들아, 깨어나 울어라. 포도주를 마시는 모든 자들아, 달콤한 포도주 때문에 통곡하여라. 그것이 너희 입에서 끊어졌기 때문이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָסִיס는 ‘새 포도주’ 또는 ‘신선한 포도주’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקִיצוּ
  english_pob_choice: Wake up
  chosen_korean: 깨어나
  alternatives_korean:
  - 일어나
  - 잠에서 깨라
  lexicon: HALOT
  rationale: 명령형 복수로서 잠에서 깨는 촉구를 자연스러운 현대 한국어로 옮기되, 선지자적 경고의 급박함을 살렸습니다.
- source_word: שִׁכּוֹרִים
  english_pob_choice: you drunkards
  chosen_korean: 술 취한 자들아
  alternatives_korean:
  - 술주정뱅이들아
  - 취한 자들아
  lexicon: HALOT
  rationale: 호격으로 부르는 뉘앙스를 살리면서, 습관적 특성을 드러내는 ‘drunkards’를 과도하게 비하적이지 않게 옮겼습니다.
- source_word: עָסִיס
  english_pob_choice: the sweet wine
  chosen_korean: 달콤한 포도주
  alternatives_korean:
  - 새 포도주
  - 신선한 포도주
  - 달콤한 술
  lexicon: HALOT
  rationale: 문맥상 맛있고 즐기는 음료를 가리키므로, 기술적 표현보다 의미를 바로 전달하는 ‘달콤한 포도주’를 택했습니다.
- source_word: נִכְרַת מִפִּיכֶם
  english_pob_choice: has been cut off from your mouth
  chosen_korean: 너희 입에서 끊어졌기 때문이다
  alternatives_korean:
  - 너희 입에서 사라졌기 때문이다
  - 너희 입에서 잘려 나갔기 때문이다
  lexicon: HALOT
  rationale: ‘끊어지다’는 히브리어의 절단/제거 이미지를 유지하면서, 한국어에서는 원인절로 자연스럽게 연결됩니다.
theological_decisions:
- issue: עַל עָסִיס의 호소 대상
  chosen_reading: ‘달콤한 포도주 때문에’로 옮겨, 상실의 대상이 즐기던 음료 자체임을 분명히 했습니다.
  alternative_readings:
  - ‘새 포도주 때문에’
  - ‘포도주를 두고’
  rationale: 이 절은 단순한 금주 권면이 아니라, 포도주의 공급이 끊긴 재난에 대한 애곡을 말하므로 상실의 초점을 살렸습니다.
  doctrine_reference: 예언서 문맥과 농경 재난의 표상
- issue: 명령형 연쇄의 강도
  chosen_reading: ‘깨어나 울어라… 통곡하여라’로 반복적 애가 명령을 유지했습니다.
  alternative_readings:
  - ‘깨어서 우십시오’
  - ‘깨어 울라’
  rationale: 히브리어의 연속 명령형이 주는 긴박하고 공개적인 애곡의 톤을 보존했습니다.
  doctrine_reference: 예언적 탄식의 수사
