translation:
  language: ko
  text: 술 취한 자들이여, 깨어나십시오. 우십시오. 포도주를 마시는 모든 이들이여, 달콤한 포도주[a]를 두고 통곡하십시오. 그것이 여러분의 입에서 끊어졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָסִיס는 ‘새 포도주’ 또는 ‘신선한 포도주’로도 옮길 수 있습니다.
    reason: lexical_alternative
