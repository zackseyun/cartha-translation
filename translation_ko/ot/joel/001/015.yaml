id: JOL.1.15
reference: Joel 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲהָ֖הּ לַ/יּ֑וֹם כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה וּ/כְ/שֹׁ֖ד מִ/שַׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/015.yaml
  text: Alas for the day! For the day of Yahweh is near[a], and it comes like destruction from the Almighty.
  footnotes:
  - marker: a
    text: 'Hebrew has a wordplay: ''like destruction from Shaddai'' (the Almighty).'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 그 날이여! 야훼의 날이 가까우니, 그것은 전능자로부터 오는 파멸처럼 다가옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어에는 말놀이가 있습니다: ‘파멸처럼’(שֹׁד)과 ‘샤다이’(전능자).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ / לַיּוֹם
  english_pob_choice: Alas for the day!
  chosen_korean: 아, 그 날이여!
  alternatives_korean:
  - 아, 그 날이여!
  - 슬프도다, 그 날이여!
  - 아, 그 날을 어찌합니까!
  lexicon: HALOT
  rationale: 감탄사 אֲהָהּ의 애도와 경악을 현대 한국어의 자연스러운 탄식으로 옮기되, לַיּוֹם의 대상성을 살려 ‘그 날이여’로 대상이 되는 날을 직접 부릅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 POB 기본값에 따라 제목어가 아니라 신명 표기로 옮겨, 예언서의 언약적 신명성을 보존합니다.
- source_word: וּכְשֹׁד
  english_pob_choice: and it comes like destruction
  chosen_korean: 그것은 … 파멸처럼 다가옵니다
  alternatives_korean:
  - 그것은 … 파괴처럼 다가옵니다
  - 그것은 … 황폐처럼 다가옵니다
  lexicon: HALOT
  rationale: שֹׁד는 폭력적 붕괴와 황폐를 가리키므로, 한국어에서는 ‘파멸’이 문맥과 심상을 가장 직접적으로 전달합니다.
- source_word: מִשַׁדַּי
  english_pob_choice: from the Almighty
  chosen_korean: 전능자로부터
  alternatives_korean:
  - 전능자에게서
  - 샤다이로부터
  lexicon: HALOT
  rationale: 샤다이의 통상 의미를 따라 ‘전능자’로 옮기되, 원문의 음성 유희를 살릴 수 있도록 한국어 본문은 의미 중심으로 처리합니다.
theological_decisions:
- issue: 여호와의 날/야훼의 날 표현
  chosen_reading: ‘야훼의 날’로 옮겨 예언적 심판의 고유 표현을 유지했습니다.
  alternative_readings:
  - ‘주님의 날’
  - ‘여호와의 날’
  rationale: 본문은 יְהוָה의 날을 가리키므로, POB의 신명 표기 원칙에 따라 고유명사성을 보존하는 ‘야훼의 날’을 채택합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שֹׁד / שַׁדַּי의 말놀이
  chosen_reading: ‘파멸처럼 … 전능자로부터’로 옮겨, 의미를 본문에 두고 말놀이의 긴장은 주석으로 보존했습니다.
  alternative_readings:
  - ‘샤다이로부터 오는 파멸처럼’
  - ‘전능자로부터 오는 황폐처럼’
  rationale: 히브리어는 ‘파멸’과 ‘샤다이’ 사이의 음성 유사성을 활용하지만, 한국어 본문에서 억지 운율을 만들기보다 의미를 분명히 하고 각주로 텍스트 효과를 설명하는 편이 더 충실합니다.
  doctrine_reference: 원문 수사 및 POB footnote 관례
