id: JOL.1.19
reference: Joel 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵלֶ֥י/ךָ יְהוָ֖ה אֶקְרָ֑א כִּ֣י אֵ֗שׁ אָֽכְלָה֙ נְא֣וֹת מִדְבָּ֔ר וְ/לֶ֣הָבָ֔ה לִהֲטָ֖ה כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/019.yaml
  text: To you[a], O Yahweh, I call, for fire has devoured the pastures of the wilderness[c][b], and flame has scorched all the trees of the field.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'grazing places' for 'pastures.'
    reason: lexical_alternative
  - marker: c
    text: Or 'has burned up' for 'has scorched.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 제가 주님께 부르짖습니다. 이는 불이 광야의 목초지를 삼키고, 불꽃이 들의 모든 나무를 그슬렀기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문에는 יהוה(YHWH)가 있으며, 전통적으로는 ‘주님’으로 옮겨집니다.
    reason: alternative_reading
  - marker: b
    text: ‘목초지’ 대신 ‘가축이 풀 뜯는 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그슬렀다’ 대신 ‘불살랐다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  english_pob_choice: To you
  chosen_korean: 주님께
  alternatives_korean:
  - 주님에게
  - 주께
  lexicon: HALOT
  rationale: 2인칭 남성 단수 여격을 한국어에서 자연스럽게 나타내기 위해 ‘-께’를 썼으며, 시적 호소의 방향성을 분명히 했습니다.
- source_word: אֶקְרָא
  english_pob_choice: I call
  chosen_korean: 부르짖습니다
  alternatives_korean:
  - 부릅니다
  - 외칩니다
  lexicon: HALOT
  rationale: 문맥이 기도/탄원에 가까워 단순한 ‘부르다’보다 절박한 호소를 드러내는 표현을 택했습니다.
- source_word: נְאוֹת מִדְבָּר
  english_pob_choice: the pastures of the wilderness
  chosen_korean: 광야의 목초지
  alternatives_korean:
  - 광야의 풀밭
  - 광야의 목장터
  - 광야의 들판
  lexicon: HALOT
  rationale: נְאוֹת은 이 문맥에서 가축이 풀 뜯는 장소를 가리키므로, ‘목초지’가 ‘pastures’의 기능과 시적 이미지를 잘 살립니다.
- source_word: לִהֲטָה
  english_pob_choice: has scorched
  chosen_korean: 그슬렀습니다
  alternatives_korean:
  - 불살랐습니다
  - 타들게 했습니다
  - 그을렸습니다
  lexicon: HALOT
  rationale: 앞 절의 ‘삼키다’와 병렬을 이루면서 불의 열기가 표면을 검게 그을리는 느낌을 살리기 위해 ‘그슬렀다’를 선택했습니다.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  english_pob_choice: all the trees of the field
  chosen_korean: 들의 모든 나무
  alternatives_korean:
  - 밭의 모든 나무
  - 들판의 모든 나무
  - 들의 나무
  lexicon: HALOT
  rationale: הַשָּׂדֶה는 문자적으로 ‘들/밭’이지만, 시어로는 열린 자연 공간을 가리키므로 ‘들’이 간결하고 자연스럽습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 יהוה가 직접 나오므로, 본 프로젝트의 기준에 따라 신적 고유명사로 ‘야훼’를 유지해야 하지만, 본 구절의 수신호성 발화에서는 한국어 직접 호칭을 자연스럽게 하기 위해 서두의 호칭은 ‘주님’으로 두고 본문 의미를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
