  naturalness: ‘야훼여, 제가 주께 부르짖습니다’ is natural, reverent modern Korean in formal-polite style and avoids the awkward repetition that would result from repeating ‘야훼’ as both vocative and postpositional addressee. Footnote markers are placed at the words to which they apply.
  terminology: ‘광야의 목초지’ appropriately renders נְאוֹת מִדְבָּר. ‘들의 모든 나무’ suitably reflects כָּל עֲצֵי הַשָּׂדֶה. ‘그슬렀습니다’ remains a defensible rendering of לִהֲטָה and retains the distinction from the preceding ‘삼켰습니다.’
