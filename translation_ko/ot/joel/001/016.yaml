id: JOL.1.16
reference: Joel 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֛וֹא נֶ֥גֶד עֵינֵ֖י/נוּ אֹ֣כֶל נִכְרָ֑ת מִ/בֵּ֥ית אֱלֹהֵ֖י/נוּ שִׂמְחָ֥ה וָ/גִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/016.yaml
  text: Is not food cut off before our eyes[b][a], joy and gladness from the house of our God?
  footnotes:
  - marker: a
    text: Or 'from the temple of our God.' The Hebrew reads 'from the house of our God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'joy and rejoicing.' The second term can carry the sense of exultant rejoicing.
    reason: lexical_alternative
translation:
  language: ko
  text: 양식이 우리 눈앞에서 끊어졌고, 우리 하나님의 집에서 기쁨과 즐거움이 사라지지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 하나님의 성전에서’로 옮길 수 있습니다. 히브리어는 문자 그대로 ‘우리 하나님의 집에서’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기쁨과 환호’로도 옮길 수 있습니다. 둘째 명사는 격앙된 환호의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Is not
  chosen_korean: ~하지 않았습니까?
  alternatives_korean:
  - ~아닙니까?
  - 정말 ~입니까?
  lexicon: HALOT
  rationale: 반어적 질문의 힘을 살리면서 현대 한국어의 자연스러운 확인 질문으로 옮겼습니다.
- source_word: נֶגֶד עֵינֵינוּ
  english_pob_choice: before our eyes
  chosen_korean: 우리 눈앞에서
  alternatives_korean:
  - 우리의 눈앞에
  - 우리 앞에서
  lexicon: HALOT
  rationale: ‘눈앞에서’가 ‘공개적으로, 보이는 데서’라는 관용적 뉘앙스를 가장 자연스럽게 전달합니다.
- source_word: אֹכֶל נִכְרָת
  english_pob_choice: food is cut off
  chosen_korean: 양식이 ... 끊어졌고
  alternatives_korean:
  - 먹을 것이 ... 끊어졌고
  - 음식이 ... 사라졌고
  lexicon: HALOT
  rationale: אֹכֶל은 단순한 음식보다 생존을 위한 양식의 느낌이 있어, 한국어에서도 시적·비극적 울림이 있는 ‘양식’으로 옮겼습니다.
- source_word: מִבֵּית אֱלֹהֵינוּ
  english_pob_choice: from the house of our God
  chosen_korean: 우리 하나님의 집에서
  alternatives_korean:
  - 우리 하나님의 성전에서
  - 우리 하나님의 집으로부터
  lexicon: HALOT
  rationale: 본문의 직역성을 따라 ‘집’을 살리되, 한국어 문맥상 장소 출발점은 조사 ‘에서’로 자연스럽게 표현했습니다.
- source_word: שִׂמְחָה וָגִיל
  english_pob_choice: joy and gladness
  chosen_korean: 기쁨과 즐거움
  alternatives_korean:
  - 기쁨과 환호
  - 기쁨과 환희
  lexicon: HALOT
  rationale: 두 명사의 병렬을 한국어의 익숙한 한 쌍으로 옮겨 시적 평행성을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 생략된 동사 범위
  chosen_reading: 후반부도 앞부분과 연결된 한 문장 안에서, 성전/하나님의 집에서 기쁨과 즐거움이 사라진 것으로 읽었습니다.
  alternative_readings:
  - 후반부를 별도의 독립 진술로 나누어 읽는 방식
  - ‘기쁨과 즐거움’만을 전면에 두고 식량 결핍과 분리하는 방식
  rationale: 히브리어 시의 평행법상 후반부는 앞 동사를 공유하는 생략 구조로 이해하는 것이 가장 자연스럽고, 재난이 생계와 예배의 즐거움을 함께 끊어 버렸다는 탄식을 보존합니다.
  doctrine_reference: 히브리 시의 평행법과 생략 구조
