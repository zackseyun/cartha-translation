id: JOL.1.6
reference: Joel 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי גוֹי֙ עָלָ֣ה עַל אַרְצִ֔/י עָצ֖וּם וְ/אֵ֣ין מִסְפָּ֑ר שִׁנָּי/ו֙ שִׁנֵּ֣י אַרְיֵ֔ה וּֽ/מְתַלְּע֥וֹת לָבִ֖יא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/006.yaml
  text: For a nation has come up against my land[a], mighty and without number; its teeth are the teeth of a lion[b], and it has the fangs of a lioness.
  footnotes:
  - marker: a
    text: Or 'a people.' The Hebrew גוי is literally 'nation/people' and is used here metaphorically for the invading plague.
    reason: lexical_alternative
  - marker: b
    text: Or 'a great lion' or simply 'a lion.' The Hebrew לָבִיא can denote a powerful mature lion; many translations render it 'lioness' in this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 땅[a]에 하나의 나라가 올라왔기 때문입니다. 그것은 강하고 셀 수 없으며, 그 이빨은 사자의 이빨[b]이고, 그 입천장에는 암사자의 송곳니가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성.’ 히브리어 גוי는 문자적으로 ‘나라/민족’을 뜻하며, 여기서는 침입하는 재앙을 비유적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 사자’ 혹은 단순히 ‘사자.’ 히브리어 לָבִיא는 힘센 성체 사자를 가리킬 수 있으며, 많은 번역본은 이 구절을 ‘암사자’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: HALOT
  rationale: 문맥상 앞선 탄식의 근거를 제시하는 연결이므로, 현대 한국어에서는 원인·설명의 기능을 살려 ‘이는 … 때문입니다’로 자연스럽게 옮겼습니다.
- source_word: גוֹי
  english_pob_choice: nation
  chosen_korean: 하나의 나라
  alternatives_korean:
  - 민족
  - 백성
  - 나라
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘나라/민족’이지만, 여기서는 침입 세력을 의인화한 비유이므로 ‘하나의 나라’로 유지해 본문의 비유적 힘을 살렸습니다.
- source_word: שִׁנָּיו / מְתַלְּעוֹת
  english_pob_choice: its teeth / fangs
  chosen_korean: 이빨 / 송곳니
  alternatives_korean:
  - 이 / 턱
  - 어금니
  lexicon: HALOT
  rationale: 표준 한국어에서 짐승의 공격적 이미지를 가장 직접적으로 전달하는 표현은 ‘이빨’과 ‘송곳니’이므로, 시적 병행을 살리면서도 의미를 분명히 했습니다.
theological_decisions:
- issue: 침입 세력을 문자적 동물군이 아니라 군사적 비유로 유지할지 여부
  chosen_reading: 본문의 ‘나라’ 비유를 그대로 두어, 요엘서가 메뚜기 재앙을 침략군처럼 묘사하는 표현력을 유지했습니다.
  alternative_readings:
  - ‘메뚜기 떼’로 풀어 설명하기
  - ‘침략자들’로 의미를 풀어쓰기
  rationale: 원문은 גוי(나라)를 사용하며, 본문 주변이 이 재앙을 전쟁 언어로 묘사하므로, 해석어를 본문에 끼워 넣지 않고 비유를 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy 1, 3, 5
