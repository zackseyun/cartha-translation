translation:
  language: ko
  text: 곡식제물과 전제는 야훼의 집에서 끊어졌습니다[a]. 제사장들은 애도합니다[c][b], 야훼를 섬기는 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡식제물과 전제가 야훼의 집에서 끊어졌습니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘야훼의 집’, 곧 성전/성소입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼를 섬기는 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכְרַת
  english_pob_choice: are cut off
  chosen_korean: 끊어졌습니다
  alternatives_korean:
  - 끊어집니다
  - 없어졌습니다
  lexicon: HALOT
  rationale: 완료된 결과를 나타내면서도 제의가 중단된 상태를 자연스럽게 드러내므로, 문맥의 애가조에 맞는 한국어로 옮겼습니다.
- source_word: מִנְחָה
  english_pob_choice: grain offering
  chosen_korean: 곡식제물
  alternatives_korean:
  - 소제
  - 곡식 헌물
  lexicon: HALOT
  rationale: 전통적 교회 용어인 ‘소제’보다 본문의 제의적·물질적 성격을 드러내는 ‘곡식제물’이 더 직접적입니다.
- source_word: נֶסֶךְ
  english_pob_choice: drink offering
  chosen_korean: 전제
  alternatives_korean:
  - 술제물
  - 포도주제물
  lexicon: HALOT
  rationale: 제의적 전문용어로서 간결하고 정착된 ‘전제’를 사용하되, 본문의 ‘붓는 제물’ 의미를 해치지 않도록 했습니다.
- source_word: מִבֵּית יְהוָה
  english_pob_choice: from the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 야훼의 성전에서
  - 여호와의 집에서
  lexicon: HALOT
  rationale: ‘house’의 직역을 살려 ‘집’으로 두고, 본문 주석이 시사하는 성전 의미는 문맥으로 드러나게 했습니다. יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מְשָׁרְתֵי יְהוָה
  english_pob_choice: the ministers of Yahweh
  chosen_korean: 야훼를 섬기는 자들
  alternatives_korean:
  - 야훼의 일꾼들
  - 야훼의 봉사자들
  lexicon: HALOT
  rationale: 분사형이 지칭하는 기능을 살려 단순한 신분명보다 ‘섬기는 자들’로 옮겨, 제사장들의 직무적 정체성을 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 신명기적 고유명사를 사용하므로, 대체 칭호인 ‘주님’보다 고유명사 ‘야훼’를 유지하는 것이 원문 가시성과 소스 추적성에 유리합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
