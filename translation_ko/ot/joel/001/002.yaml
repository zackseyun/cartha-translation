source:
  edition: WLC
  text: שִׁמְעוּ זֹאת֙ הַ/זְּקֵנִ֔ים וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל יוֹשְׁבֵ֣י הָ/אָ֑רֶץ הֶ/הָ֤יְתָה זֹּאת֙ בִּֽ/ימֵי/כֶ֔ם וְ/אִ֖ם בִּ/ימֵ֥י אֲבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/002.yaml
  text: 'Hear this[a], you elders, and give ear, all inhabitants of the land: Has this happened in your days[b], or in the days of your fathers?'
  footnotes:
  - marker: a
    text: Or 'all inhabitants of the earth.' The Hebrew word can mean either 'land' or 'earth'; here 'land' best fits the immediate context.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''in the days of your ancestors.'' Hebrew: ''your fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 늙은이들아, 이 말을 들으십시오. 땅의 모든 주민들아, 귀를 기울이십시오. 이런 일이 너희의 날에 있었습니까? 아니면 너희 조상들의 날에 있었습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 여기서 ‘땅’으로도, 넓게는 ‘세상’으로도 옮길 수 있지만, 문맥상 ‘땅’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 조상들’은 히브리어의 ‘너희 아버지들’을 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  english_pob_choice: Hear this
  chosen_korean: 이 말을 들으십시오
  alternatives_korean:
  - 이것을 들으십시오
  - 이 말을 들어보십시오
  lexicon: HALOT
  rationale: 명령형 복수의 직접 호소를 살리되, 한국어에서는 지시대명사 ‘이것’보다 ‘이 말’이 문맥상 더 자연스럽고 예언적 경고의 대상이 분명해집니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: you elders
  chosen_korean: 늙은이들아
  alternatives_korean:
  - 장로들아
  - 노인들아
  lexicon: HALOT
  rationale: 히브리어는 연장자 집단을 직접 호명하는 표현입니다. POB의 ‘elders’는 공동체 지도층 뉘앙스를 담지만, 본문 자체에는 직분 표지가 없으므로 한국어에서는 가장 직접적인 연장자 호칭을 택했습니다.
- source_word: כֹּל יוֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all inhabitants of the land
  chosen_korean: 땅의 모든 주민들
  alternatives_korean:
  - 땅에 사는 모든 사람들
  - 온 땅의 주민들
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅/나라’ 범위를 따라, 여기서는 문맥상 유다 지역을 가리키는 ‘땅’으로 옮겼습니다. ‘주민들’은 집합적 표현을 자연스럽게 살립니다.
- source_word: בִּימֵיכֶם / בִּימֵי אֲבֹתֵיכֶם
  english_pob_choice: in your days / in the days of your fathers
  chosen_korean: 너희의 날에 / 너희 조상들의 날에
  alternatives_korean:
  - 너희 시대에 / 너희 조상들의 시대에
  - 너희 때에 / 너희 조상들의 때에
  lexicon: HALOT
  rationale: 히브리어의 시간 관용구를 직역하기보다 한국어에서 자연스러운 ‘날’로 유지했습니다. יחד עם זאת, ‘fathers’는 성별이 표시된 복수형이므로 POB의 설명을 따라 ‘조상들’보다 더 문자적인 ‘조상들’ 표현을 택할 수 있으나, 본문에서는 관용구의 자연성을 우선했습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: ‘땅’으로 이해하되, 보편적 ‘세상’으로 확대하지 않습니다.
  alternative_readings:
  - 세상
  - 온 땅
  - 나라
  rationale: 예언자적 호소의 수신자는 ‘장로들’과 ‘땅의 주민들’로 한정되며, 문맥상 특정 지역 공동체를 지칭하는 것이 가장 설득력 있습니다. 따라서 우주적 확대 해석은 본문에 과도합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: 늙은이들아의 호칭 톤
  chosen_reading: 직접적 호명으로 처리하고, 예언적 경고의 긴박함을 살립니다.
  alternative_readings:
  - 장로들아
  - 노인들아
  rationale: 본문은 단순한 정보 전달이 아니라 공동체 전체를 흔드는 예언적 소환입니다. 한국어에서 ‘늙은이들아’는 다소 거칠 수 있으나, 수신 대상의 직접성과 긴급성을 보존하는 효과가 있습니다.
  doctrine_reference: Translation philosophy §2
