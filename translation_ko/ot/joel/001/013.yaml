id: JOL.1.13
reference: Joel 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חִגְר֨וּ וְ/סִפְד֜וּ הַ/כֹּהֲנִ֗ים הֵילִ֨ילוּ֙ מְשָׁרְתֵ֣י מִזְבֵּ֔חַ בֹּ֚אוּ לִ֣ינוּ בַ/שַּׂקִּ֔ים מְשָׁרְתֵ֖י אֱלֹהָ֑/י כִּ֥י נִמְנַ֛ע מִ/בֵּ֥ית אֱלֹהֵי/כֶ֖ם מִנְחָ֥ה וָ/נָֽסֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/013.yaml
  text: Gird yourselves and mourn[a], O priests; wail, you ministers of the altar. Come, spend the night in sackcloth, you ministers of my God[b], because grain offering and drink offering are withheld from the house of your God.
  footnotes:
  - marker: a
    text: Hebrew literally 'Gird yourselves'; the sense here is to put on sackcloth for mourning.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''from the temple of your God.'' Hebrew: ''from the house of your God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 옷을 갖춰 입고[a] 애통하십시오, 제사장들아. 울부짖으십시오, 제단의 일꾼들아. 와서 굵은 베옷을 입고 밤을 지내십시오, 나의 하나님을 섬기는 일꾼들아[b]. 곡식제물과 전제물이 여러분의 하나님의 집에서 끊어졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적 뜻은 ‘허리를 동여매라’이지만, 여기서는 애곡용 복장을 갖추라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분의 하나님의 집에서.’ 히브리어는 ‘여러분의 하나님의 집에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ
  english_pob_choice: Gird yourselves
  chosen_korean: 옷을 갖춰 입고
  alternatives_korean:
  - 허리를 동여매고
  - 띠를 띠고
  - 굵은 베옷을 입고
  lexicon: HALOT
  rationale: 직역상 ‘동여매다’의 뜻이지만, 이 문맥에서는 이어지는 애곡과 굵은 베옷 언급 때문에 애곡 복장의 준비를 가리키는 관용으로 읽히므로 한국어에서는 자연스럽게 ‘옷을 갖춰 입고’로 옮겼습니다.
- source_word: וְסִפְדוּ
  english_pob_choice: and mourn
  chosen_korean: 애통하십시오
  alternatives_korean:
  - 슬퍼하십시오
  - 곡하십시오
  - 한탄하십시오
  lexicon: HALOT
  rationale: 장례·애곡 문맥의 동사로서 감정적 슬픔보다 공적 애곡 행위를 나타내므로, 명령형의 강도를 살려 ‘애통하십시오’로 옮겼습니다.
- source_word: מְשָׁרְתֵי מִזְבֵּחַ
  english_pob_choice: you ministers of the altar
  chosen_korean: 제단의 일꾼들
  alternatives_korean:
  - 제단의 섬기는 자들
  - 제단의 봉사자들
  - 제단의 사역자들
  lexicon: HALOT
  rationale: 제사장 직무를 가리키는 공적 표현이지만, 한국어에서 ‘minister’의 교회적 뉘앙스를 피하면서도 섬김의 기능을 살리기 위해 ‘일꾼들’로 옮겼습니다.
- source_word: מִנְחָה וָנָסֶךְ
  english_pob_choice: grain offering and drink offering
  chosen_korean: 곡식제물과 전제물
  alternatives_korean:
  - 소제와 전제
  - 곡식예물과 술제물
  - 곡식제사와 전제
  lexicon: HALOT
  rationale: 문맥상 일반 제물이 아니라 성전 제사 용어이므로, POB의 구별을 따라 곡식제물과 전제물로 옮겨 제의적 의미를 보존했습니다.
theological_decisions:
- issue: אֱלֹהָי / אֱלֹהֵיכֶם의 1인칭/2인칭 구분
  chosen_reading: ‘나의 하나님’과 ‘여러분의 하나님’을 구분해 유지했습니다.
  alternative_readings:
  - 둘 다 ‘하나님’으로 평준화
  - ‘우리 하나님’으로 통일
  rationale: 히브리어는 예언자의 1인칭 소유와 제사장들을 향한 2인칭 소유를 의도적으로 구분하므로, 한국어에서도 그 수사적 대조를 보존했습니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
