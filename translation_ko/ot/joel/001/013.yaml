  source_fidelity: 첫 명령 חִגְרוּ는 문맥상 애곡 복장을 암시하지만 문자적으로는 ‘허리를 동여매다’입니다. 초안의 ‘옷을 갖춰 입고’는 그 구체적 동작을 일반화하므로, 본문에서는 직역을 유지하고 각주로 문맥적 의미를 설명하는 편이 안전합니다. מְשָׁרְתֵי는 ‘일꾼’보다 ‘섬기는 이들’이 성전 봉사의 역할을 더 정확히 드러냅니다. ‘나의 하나님’과 ‘여러분의 하나님’의 대조, 곡식제물과 전제물의 중단은 유지했습니다.
  naturalness: 합쇼체와 현대 표준어에 맞추어 호격을 ‘-이들이여’로 통일하고, ‘굵은 베옷을 입은 채 밤을 지내십시오’로 자연스럽게 다듬었습니다. 또한 b 각주는 실제로 설명하는 ‘여러분의 하나님의 집’에 붙여 각주 위치와 내용을 일치시켰습니다.
  terminology: מִנְחָה와 נֶסֶך는 각각 ‘곡식제물’과 ‘전제물’로 유지했습니다. ‘제단을 섬기는 이들’ 및 ‘나의 하나님을 섬기는 이들’은 מְשָׁרְתֵי의 제의적 봉사 의미를 보존하면서 특정 교단의 직분 명칭을 피합니다.
