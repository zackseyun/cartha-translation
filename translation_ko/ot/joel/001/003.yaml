id: JOL.1.3
reference: Joel 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָלֶ֖/יהָ לִ/בְנֵי/כֶ֣ם סַפֵּ֑רוּ וּ/בְנֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וּ/בְנֵי/הֶ֖ם לְ/ד֥וֹר אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/003.yaml
  text: Tell your children about it[a], and let your children tell their children, and their children tell another generation.
  footnotes:
  - marker: a
    text: Hebrew 'your sons ... their sons ... their sons'; here 'children' is used because the context is the transmission of memory through successive generations generally, not male offspring only.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 너희 자녀들에게 이야기하십시오. 그리고 너희 자녀들은 그들의 자녀들에게, 그들의 자녀들은 다른 세대에게 이야기하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘너희 아들들 … 그들의 아들들 … 그들의 아들들’은 성별을 좁히지 않는 세대 전승의 의미를 살려 ‘자녀들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיהָ
  english_pob_choice: about it
  chosen_korean: 그것을
  alternatives_korean:
  - 그 일에 대해
  - 그것에 관해
  lexicon: HALOT
  rationale: 여기서 3인칭 여성 단수 접미사는 앞선 재앙/사건을 가리키므로, 한국어에서는 자연스럽게 지시대명사 ‘그것’을 써서 그 사건을 전달하는 뜻을 살렸습니다.
- source_word: בְּנֵיכֶם / בְּנֵיהֶם
  english_pob_choice: your children / their children
  chosen_korean: 너희 자녀들 / 그들의 자녀들
  alternatives_korean:
  - 너희 아들들 / 그들의 아들들
  lexicon: HALOT
  rationale: בנים은 문자적으로 ‘아들들’이지만, 이 구절은 세대 간 기억 전승이 핵심이므로 성별을 좁히지 않는 ‘자녀들’이 문맥에 더 정확합니다.
- source_word: סַפֵּרוּ
  english_pob_choice: Tell
  chosen_korean: 이야기하십시오
  alternatives_korean:
  - 말하십시오
  - 전하십시오
  lexicon: HALOT
  rationale: 피엘 명령형의 반복적·의도적 전달을 한국어에서는 ‘이야기하다’가 가장 자연스럽고, 다음 세대로 기억을 전수하라는 흐름도 잘 드러냅니다.
- source_word: לְדוֹר אַחֵר
  english_pob_choice: another generation
  chosen_korean: 다른 세대
  alternatives_korean:
  - 다음 세대
  - 한 세대 뒤
  lexicon: HALOT
  rationale: ‘another generation’은 단순히 한 단계 뒤만이 아니라 이어질 또 다른 세대를 뜻하므로, 범위를 덜 제한하는 ‘다른 세대’가 적절합니다.
theological_decisions:
- issue: 세대 전승의 명령형 연쇄
  chosen_reading: 명령형을 유지해 재난의 기억을 후대에 의도적으로 전수하라는 촉구로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘이야기할 것입니다’로 옮김
  - 권고형으로 약화해 ‘이야기해야 합니다’로 옮김
  rationale: 히브리어는 명령형 연쇄를 통해 공동체적 기억 전승을 강조하므로, 한국어에서도 지시적 힘을 보존하는 것이 본문의 의도를 가장 잘 반영합니다.
  doctrine_reference: 신명기적 기억 전승, 공동체 교육의 명령
- issue: 성별 포괄 번역
  chosen_reading: ‘아들들’ 대신 ‘자녀들’을 사용했습니다.
  alternative_readings:
  - 원문 형식을 따라 ‘아들들’로 직역함
  rationale: 히브리어 בנים은 형식상 ‘아들들’이지만, 본문 기능상 세대 전체를 아우르는 후손을 가리키므로 문맥상 포괄 의미를 살리는 것이 타당합니다.
  doctrine_reference: 문맥 우선의 번역 원리
