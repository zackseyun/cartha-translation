base_translation:
  language: en
  yaml_path: translation/ot/joel/001/010.yaml
  text: The field is devastated; the ground mourns[a], for the grain is devastated, the new wine has dried up, the oil has failed.
  footnotes:
  - marker: a
    text: Or 'the fresh oil has withered' / 'the olive oil has failed.' The Hebrew term refers to fresh oil, usually olive oil, as part of the staple produce triad 'grain, new wine, and oil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 밭은 황폐해졌습니다. 땅은 슬퍼합니다[a]. 곡식이 황폐해졌기 때문입니다. 새 포도주가 말라버렸고, 기름이 시들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅이 애도합니다’입니다. 의인화된 표현을 살리기 위해 ‘슬퍼합니다’로 옮겼습니다.
    reason: lexical_alternative
