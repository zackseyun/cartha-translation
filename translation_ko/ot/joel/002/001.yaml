  source_fidelity: 본문의 주요 어휘와 명령형의 긴박성은 대체로 잘 반영되었습니다. 그러나 יִרְגְּזוּ는 주민들에게 ‘떨게 하라’고 명령하여 그들을 떨게 만들라는 뜻이라기보다, 그들이 떨 것이라는 결과적·예언적 진술(또는 허용적 권고)입니다. 또한 קָרוֹב는 ‘가까이 왔다’보다 ‘가깝다’가 더 직접적입니다.
  naturalness: ‘그 땅의 모든 주민이 떨게 하십시오’는 현대 한국어에서 독자가 주민들을 떨게 만들라는 사역 명령으로 이해할 수 있습니다. ‘그 땅의 모든 주민은 떨 것입니다’가 자연스럽고 원문의 흐름에도 맞습니다. 인과 관계를 ‘이는’으로 연결하면 문장 흐름도 매끄럽습니다.
  terminology: ‘시온’, ‘나팔’, ‘내 거룩한 산’, ‘경보를 울리십시오’, ‘야훼의 날’은 적절합니다. 대안 독법 각주는 אֶרֶץ가 걸린 ‘그 땅의 모든 주민’에 붙어야 하며, 현 각주 본문은 대안이 아니라 본문과 같은 표현을 반복하고 있습니다.
