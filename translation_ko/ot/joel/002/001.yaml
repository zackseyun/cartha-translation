source:
  edition: WLC
  text: תִּקְע֨וּ שׁוֹפָ֜ר בְּ/צִיּ֗וֹן וְ/הָרִ֨יעוּ֙ בְּ/הַ֣ר קָדְשִׁ֔/י יִרְגְּז֕וּ כֹּ֖ל יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּֽי בָ֥א יוֹם יְהוָ֖ה כִּ֥י קָרֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/001.yaml
  text: Blow a horn in Zion[a], and sound an alarm on my holy mountain; let all the inhabitants of the land tremble, for the day of Yahweh is coming—indeed, it is near.
  footnotes:
  - marker: a
    text: Or 'all the inhabitants of the earth.' The Hebrew אֶרֶץ can mean either 'land' or 'earth' depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 시온에서 나팔을 불고, 내 거룩한 산에서 경보를 울리십시오. 그 땅의 모든 주민[a]은 떨 것입니다. 야훼의 날이 오고 있기 때문입니다. 참으로 그 날이 가깝습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 세상의 모든 주민.’ 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘온 세상’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  english_pob_choice: Blow a horn
  chosen_korean: 나팔을 불고
  alternatives_korean:
  - 뿔나팔을 불고
  - 뿔나팔을 불며
  lexicon: HALOT
  rationale: שׁוֹפָר는 금관악기가 아니라 의례적 신호용 뿔나팔이지만, 한국어 본문에서는 간결하고 자연스러운 ‘나팔을 불다’가 기능을 가장 직접적으로 드러냅니다.
- source_word: וְהָרִיעוּ
  english_pob_choice: sound an alarm / raise an alarm
  chosen_korean: 경보를 울리십시오
  alternatives_korean:
  - 함성을 지르십시오
  - 소리를 지르십시오
  - 나팔을 불어 경고하십시오
  lexicon: HALOT
  rationale: 뒤이어 오는 경고 맥락에서 רוע의 강한 소란·경고 의미를 살리기 위해 단순 ‘외치다’보다 ‘경보를 울리다’가 더 적절합니다.
- source_word: בְּהַר קָדְשִׁי
  english_pob_choice: on my holy mountain
  chosen_korean: 내 거룩한 산
  alternatives_korean:
  - 내 성산
  - 내 거룩한 산 위
  lexicon: HALOT
  rationale: 히브리어의 소유격을 직접 살려 ‘내 거룩한 산’으로 옮기고, 전치사 בְּ는 앞 동사와 자연스럽게 연결되는 장소 부사어로 처리했습니다.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all the inhabitants of the land
  chosen_korean: 그 땅의 모든 주민
  alternatives_korean:
  - 땅의 모든 주민
  - 온 땅의 모든 주민
  - 그 땅에 사는 모든 사람
  lexicon: HALOT
  rationale: 이 문맥은 시온과 거룩한 산을 기준으로 한 지역적·언약적 배경이 강하므로, 기본값을 ‘땅’으로 두어 ‘land’의 가능성을 살렸습니다.
- source_word: יוֹם יְהוָה
  english_pob_choice: the day of Yahweh
  chosen_korean: 야훼의 날
  alternatives_korean:
  - 여호와의 날
  - 주님의 날
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 예언 표현의 여호와 이름은 ‘야훼’로 옮기고, 관용구는 직역해 ‘야훼의 날’로 유지했습니다.
- source_word: כִּי קָרֽוֹב
  english_pob_choice: indeed, it is near
  chosen_korean: 참으로, 그것은 가까이 왔습니다
  alternatives_korean:
  - 정말로, 그것은 가깝습니다
  - 실로, 그것은 가까워졌습니다
  lexicon: HALOT
  rationale: 두 번째 כִּי의 강조·설명 기능을 한국어에서 ‘참으로’로 살리고, 임박성을 현재 진행 감각의 ‘가까이 왔습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יוֹם יְהוָה의 종말론적 긴박성
  chosen_reading: ‘오고 있습니다’와 ‘가까이 왔습니다’의 이중 표현으로 임박성과 도래를 함께 드러냅니다.
  alternative_readings:
  - ‘옵니다’
  - ‘이미 왔습니다’
  rationale: 히브리어는 예언적 현재와 임박한 미래의 긴장을 함께 품고 있으므로, 한쪽으로 평평하게 만들지 않고 두 표현을 병치해 긴박감을 보존했습니다.
  doctrine_reference: 예언적 현재와 임박한 심판의 긴장 보존
- issue: יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’로 표기합니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 본문은 신명기적 예언에서 하나님의 언약 სახელ을 직접 사용하므로, 본 프로젝트 기본값에 따라 고유 이름을 드러내는 번역을 따릅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
