  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּקְע֥וּ שׁוֹפָ֖ר בְּ/צִיּ֑וֹן קַדְּשׁוּ צ֖וֹם קִרְא֥וּ עֲצָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/015.yaml
  text: Blow a trumpet in Zion[a]; consecrate a fast[c][b]; call a solemn assembly.
  footnotes:
  - marker: a
    text: Or 'ram's horn' for 'trumpet' (שׁוֹפָר), emphasizing the specific instrument used for alarm or sacred summons.
    reason: lexical_alternative
  - marker: b
    text: Or 'sanctify a fast.' The Hebrew verb means to set apart as holy for a sacred purpose.
    reason: lexical_alternative
  - marker: c
    text: Or 'call/proclaim a sacred assembly.' The Hebrew עֲצָרָה denotes a formal religious gathering marked by solemnity.
    reason: lexical_alternative
translation:
  language: ko
  text: 시온에서 나팔을 불어라[a]. 금식을 거룩하게 선포하고[b] — 엄숙한 모임을 소집하라[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양각나팔’. שׁוֹפָר는 공적 경고나 거룩한 소집에 쓰이는 특정 악기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘금식을 성별하라’. 히브리어 동사는 금식을 거룩한 목적으로 따로 구별하라는 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘엄숙한 성회를 소집하라’. עֲצָרָה는 엄숙함이 짙은 공식 종교 집회를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ / שׁוֹפָר
  english_pob_choice: Blow a trumpet
  chosen_korean: 나팔을 불어라
  alternatives_korean:
  - 뿔나팔을 불어라
  - 양각나팔을 불어라
  - 소리를 내라
  lexicon: HALOT
  rationale: 명령형 동사 תקע와 שׁוֹפָר의 관용적 결합을 살려, 공적 경고와 거룩한 소집의 울림을 자연스러운 한국어로 전달했습니다.
- source_word: בְּצִיּוֹן
  english_pob_choice: in Zion
  chosen_korean: 시온에서
  alternatives_korean:
  - 시온 안에서
  - 시온 위에서
  lexicon: HALOT
  rationale: 전치사 ב의 기본적인 장소 의미를 반영하여, 예언적 명령이 내려지는 장소를 간결하게 표기했습니다.
- source_word: קַדְּשׁוּ צוֹם
  english_pob_choice: consecrate a fast
  chosen_korean: 금식을 거룩하게 선포하고
  alternatives_korean:
  - 금식을 성별하고
  - 금식을 성화하고
  - 금식을 거룩하게 하라
  lexicon: HALOT
  rationale: קדשׁ의 ‘거룩하게 구별하다’는 의미를 살리되, 한국어에서 ‘금식’을 공동체적으로 공표하는 뉘앙스가 함께 드러나도록 ‘선포하다’를 보강했습니다.
- source_word: עֲצָרָה
  english_pob_choice: call a solemn assembly
  chosen_korean: 엄숙한 모임을 소집하라
  alternatives_korean:
  - 엄숙한 성회를 소집하라
  - 거룩한 집회를 부르라
  - 엄숙한 집회를 선포하라
  lexicon: HALOT
  rationale: עֲצָרָה의 공식적·종교적 집회 성격을 살리면서, ‘solemn’의 무게를 ‘엄숙한’으로 옮기고 ‘call’의 소집 의미를 ‘소집하다’로 표현했습니다.
theological_decisions:
- issue: 공동체적 회개를 위한 예언적 명령문의 어조
  chosen_reading: 짧은 연속 명령형으로 유지해, 재난 앞에서 공동체를 즉시 불러 모으는 긴박감을 살렸습니다.
  alternative_readings:
  - 문장형 서술로 완화하여 표현할 수 있음
  - 권고형으로 부드럽게 바꿀 수 있음
  rationale: 본문은 예언자의 직접적 명령이 연속되는 구조이므로, 한국어도 명령형을 유지하는 것이 수사적 힘과 긴급성을 가장 잘 보존합니다.
  doctrine_reference: 예언서의 회개 촉구와 공동체 소집의 문맥(욜 2:15-17)
