  source_fidelity: 첫째와 셋째 명령은 대체로 원문에 충실합니다. 그러나 קַדְּשׁוּ צוֹם은 ‘금식을 거룩하게 선포하고’가 아니라 ‘금식을 성별/거룩하게 구별하십시오’라는 독립 명령입니다. ‘선포하고’는 원문에 없는 공표 의미를 더하며, 세 명령의 병렬 구조도 약화합니다.
  naturalness: 초안의 ‘불어라’, ‘소집하라’는 해라체이므로 요구된 현대 합쇼체와 일치하지 않습니다. ‘부십시오/성별하십시오/소집하십시오’로 통일하면 현대적인 공적 명령문으로 자연스럽습니다.
  terminology: ‘성별하다’는 קדשׁ의 의례적·공동체적 구별 의미를 정확히 전달합니다. עֲצָרָה에는 종교 집회의 성격이 있으므로 ‘엄숙한 성회’가 적절합니다. 각주 대안은 본문 선택어와 중복되지 않도록 조정했습니다.
