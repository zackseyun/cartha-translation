  - 침입하는 인간 군대로 한정
  - 둘을 겹친 예언적 이미지로 설명
  rationale: 본문은 עַם을 사용하며 참조 대상을 확정하지 않으므로, 해석의 긴장을 보존하기 위해 의미를 좁히지 않았습니다.
  doctrine_reference: 본문의 의도적 모호성 보존
