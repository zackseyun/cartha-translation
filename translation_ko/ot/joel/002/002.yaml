  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: י֧וֹם חֹ֣שֶׁךְ וַ/אֲפֵלָ֗ה י֤וֹם עָנָן֙ וַ/עֲרָפֶ֔ל כְּ/שַׁ֖חַר פָּרֻ֣שׂ עַל הֶֽ/הָרִ֑ים עַ֚ם רַ֣ב וְ/עָצ֔וּם כָּמֹ֗/הוּ לֹ֤א נִֽהְיָה֙ מִן הָ֣/עוֹלָ֔ם וְ/אַֽחֲרָי/ו֙ לֹ֣א יוֹסֵ֔ף עַד שְׁנֵ֖י דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/002.yaml
  text: A day of darkness and gloom[a], a day of clouds and thick darkness; like dawn spread over the mountains, a great and mighty people comes. Nothing like it has ever been from of old, and after it there will not again be any[c][b], through the years of generation after generation.
  footnotes:
  - marker: a
    text: Or 'like blackness spread over the mountains,' if שַׁחַר is taken in a rarer sense; more likely 'like dawn' in keeping with normal Hebrew usage and the image of something spreading rapidly across the hills.
    reason: lexical_alternative
  - marker: b
    text: '''A great and mighty people'' may refer to an invading army, a locust swarm described in military terms, or a deliberately blended prophetic image.'
    reason: alternative_reading
  - marker: c
    text: Literally 'until years of generation and generation,' an idiom for an indefinitely long succession of generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 어둠과 짙은 암흑의 날, 구름과 짙은 어둠의 날입니다. 산들 위에 퍼지는 새벽빛 같아, 크고 강한 백성이 옵니다. 그와 같은 것은 옛적부터 없었고, 그 뒤로도 세대와 세대의 세월 동안 다시는 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: שַׁחַר는 드물게 ‘검은 어둠’으로도 이해될 수 있으나, 보통은 ‘새벽’이며 여기서는 퍼져 나가는 이미지와도 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘세대와 세대’는 문자적으로는 ‘세대와 세대의 해들’이지만, 오래도록 이어지는 기간을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁךְ / אֲפֵלָה
  english_pob_choice: darkness and gloom
  chosen_korean: 어둠과 짙은 암흑
  alternatives_korean:
  - 어둠과 캄캄함
  - 어둠과 캄캄한 어둠
  lexicon: HALOT
  rationale: 두 어휘를 단순 반복하지 않고, 첫째는 기본어인 어둠, 둘째는 더 강한 암흑으로 옮겨 히브리어의 점층을 살렸습니다.
- source_word: עָנָן / עֲרָפֶל
  english_pob_choice: clouds and thick darkness
  chosen_korean: 구름과 짙은 어둠
  alternatives_korean:
  - 구름과 두터운 어둠
  - 구름과 짙은 먹구름
  lexicon: HALOT
  rationale: 시적 병행을 살리되, 한국어에서 자연스러운 '짙은 어둠'으로 עֲרָפֶל의 가림과 중압감을 표현했습니다.
- source_word: כְּשַׁחַר פָּרֻשׂ עַל הֶהָרִים
  english_pob_choice: like dawn spread over the mountains
  chosen_korean: 산들 위에 퍼지는 새벽빛 같아
  alternatives_korean:
  - 산들 위에 퍼지는 새벽처럼
  - 산들 위로 펼쳐지는 새벽빛 같아
  lexicon: HALOT
  rationale: POB의 각주가 지적하듯 שַׁחַר은 보통 '새벽'이므로, '새벽빛'으로 옮겨 퍼져 나가는 이미지와 자연스러운 한국어를 함께 살렸습니다.
- source_word: עַם רַב וְעָצוּם
  english_pob_choice: a great and mighty people
  chosen_korean: 크고 강한 백성
  alternatives_korean:
  - 크고 힘센 백성
  - 큰 무리요 강한 백성
  lexicon: HALOT
  rationale: עַם을 군대나 메뚜기로 좁히지 않고 '백성'으로 유지하되, רַב과 עָצוּם의 중첩을 '크고 강한'으로 간명하게 반영했습니다.
- source_word: שְׁנֵי דּוֹר וָדוֹר
  english_pob_choice: through the years of generation after generation
  chosen_korean: 세대와 세대의 세월 동안
  alternatives_korean:
  - 세대와 세대의 해 동안
  - 대대로 이어지는 세월 동안
  lexicon: HALOT
  rationale: 직역하면 '세대와 세대의 해들'이지만, 한국어에서는 관용적으로 '세대와 세대의 세월 동안'이 문맥의 장구한 지속을 가장 잘 드러냅니다.
theological_decisions:
- issue: ‘크고 강한 백성’의 정체
  chosen_reading: 정체를 특정하지 않고 그대로 '백성'으로 두었습니다.
  alternative_readings:
