  text: וְ/אִ֤ישׁ אָחִי/ו֙ לֹ֣א יִדְחָק֔וּ/ן גֶּ֥בֶר בִּ/מְסִלָּת֖/וֹ יֵֽלֵכ֑וּ/ן וּ/בְעַ֥ד הַ/שֶּׁ֛לַח יִפֹּ֖לוּ לֹ֥א יִבְצָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/008.yaml
  text: No man crowds his brother; each goes on his own path. Though they fall through the weapon[a], they do not break ranks.
  footnotes:
  - marker: a
    text: Or 'they are not cut off' (or 'they are not stopped'). The final clause is lexically difficult; the main text reflects the contextual sense of an army whose formation is not broken.
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 자기 형제를 밀치지 않으며, 각자 자기 길로 갑니다. 무기 사이로 넘어져도 그들은 대열을 흐트러뜨리지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 끊기지 않는다’(또는 ‘멈추지 않는다’)로도 옮길 수 있습니다. 마지막 절은 어휘적으로 어려우며, 본문 번역은 대열이 깨지지 않는 군대의 문맥적 의미를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אָחִיו
  english_pob_choice: No man crowds his brother
  chosen_korean: 아무도 자기 형제를 밀치지 않으며
  alternatives_korean:
  - 아무도 자기 형제를 누르지 않으며
  - 한 사람도 자기 형제를 밀지 않으며
  lexicon: HALOT
  rationale: אִישׁ אָחִיו의 분배적 표현을 한국어에서 자연스럽게 살리기 위해 ‘아무도 … 않으며’로 옮기고, דחק의 압박감을 ‘밀치다’로 렌더링했습니다.
- source_word: בִּמְסִלָּתוֹ
  english_pob_choice: on his own path
  chosen_korean: 각자 자기 길로
  alternatives_korean:
  - 자기 행로로
  - 자기 도로로
  - 자기 진로로
  lexicon: HALOT
  rationale: מְסִלָּה는 문자적으로는 ‘큰길/포장된 길’이지만, 전후 문맥에서 각자의 정렬된 진행선을 가리키므로 한국어에서는 자연스러운 ‘길’로 옮겼습니다.
- source_word: וּבְעַד הַשֶּׁלַח
  english_pob_choice: through the weapon
  chosen_korean: 무기 사이를 뚫고 넘어져도
  alternatives_korean:
  - 무기를 지나 넘어져도
  - 창 사이를 뚫고 넘어져도
  - 무기 너머로 넘어져도
  lexicon: HALOT
  rationale: שֶׁלַח는 특정 무기보다 ‘무기/투사무기’의 넓은 의미가 있어, 문맥의 전투적 긴장을 살리되 과도하게 특정화하지 않도록 ‘무기’로 옮겼습니다.
- source_word: לֹא יִבְצָעוּ
  english_pob_choice: they do not break ranks
  chosen_korean: 그들은 대열을 무너뜨리지 않습니다
  alternatives_korean:
  - 그들은 대열에서 이탈하지 않습니다
  - 그들은 멈추지 않습니다
  - 그들은 끊기지 않습니다
  lexicon: HALOT
  rationale: בצע는 해석이 어려우므로, POB의 문맥적 판단인 ‘break ranks’를 따라 군대의 질서가 깨지지 않는다는 뜻을 한국어 관용으로 표현했습니다.
theological_decisions:
- issue: 군대 비유의 유지
  chosen_reading: 전투 중에도 질서정연하게 전진하는 군대의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 일반적인 행진 묘사로 완화하는 읽기
  - 단순한 개인들의 이동으로 읽는 해석
  rationale: 본문의 동사 배열과 POB의 주해는 혼란한 집단이 아니라 통제된 군사적 진격을 가리키므로, 이를 희석하지 않고 반영하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 본문 내 이미지 및 문맥 해석
- issue: ‘넘어져도’와 ‘대열을 무너뜨리지 않는다’의 긴장
  chosen_reading: 충돌과 낙상은 있어도 전열 붕괴는 없다는 대비를 유지했습니다.
  alternative_readings:
  - ‘상처 입어도’로 완화하는 읽기
  - ‘멈추지 않는다’로 일반화하는 읽기
  rationale: 히브리어는 낙상과 비붕괴를 병치하므로, 어려움이 있어도 진격이 계속된다는 본문의 긴장을 그대로 드러내는 편이 적절합니다.
  doctrine_reference: 본문의 수사적 대비
