base_translation:
  language: en
  yaml_path: translation/ot/joel/002/012.yaml
  text: “Yet even now,” declares Yahweh[a], “return to me with all your heart, and with fasting, and with weeping, and with mourning.”
  footnotes:
  - marker: a
    text: Or 'turn back to me'; the verb can also carry the sense 'repent' in covenant contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: “그러나 이제라도” 야훼께서 말씀하십니다. “온 마음을 다하여 내게로 돌아오고, 금식하며, 울며, 슬퍼하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아오다’는 문맥상 ‘돌이키다’ 또는 회개하다의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם עַתָּה
  english_pob_choice: Yet even now
  chosen_korean: 그러나 이제라도
  alternatives_korean:
  - 그리고 이제도
  - 이제라도
  lexicon: HALOT
  rationale: 전환과 긴박성을 함께 살리기 위해 역접적 전환어 ‘그러나’와 시간 부사 ‘이제라도’를 결합했습니다. 이는 심판 문맥 뒤에 오는 자비의 호소라는 뉘앙스를 자연스럽게 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언자적 공식을 현대 한국어 합쇼체로 옮기되, 여호와 대신 המקרא의 고유명사인 ‘야훼’를 유지했습니다. ‘말씀하십니다’는 선언형의 엄숙함을 살리면서도 한국어 문장으로 자연스럽습니다.
- source_word: שֻׁבוּ עָדַי
  english_pob_choice: return to me
  chosen_korean: 내게로 돌아오고
  alternatives_korean:
  - 내게로 돌아서고
  - 회개하고 내게로 오고
  lexicon: HALOT
  rationale: שוב의 기본 의미인 ‘돌아오다’를 살려 관계적 귀환을 표현했습니다. ‘회개하다’는 해석을 앞세우므로, 본문이 직접 말하는 방향성인 ‘내게로’와 결합된 ‘돌아오고’를 택했습니다.
- source_word: בְּכָל לְבַבְכֶם
  english_pob_choice: with all your heart
  chosen_korean: 온 마음을 다하여
  alternatives_korean:
  - 마음을 다하여
  - 전심으로
  lexicon: HALOT
  rationale: ‘לֵב/לֵבָב’의 내면 전체를 가리키는 관용을 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘온 마음을 다하여’를 선택했습니다. 이는 단순 감정이 아니라 의지와 중심 전체를 뜻합니다.
theological_decisions:
- issue: 야훼 이름의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 음역해 고유한 언약 이름을 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 하나님의 이름 자체를 직접 사용하므로, 제목적 대체어보다 고유명사를 보존하는 것이 원문 의미와 문서의 번역 원칙에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 죄책 고백보다 관계적 회복을 먼저 드러내는 שׁוּב
  chosen_reading: ‘돌아오다’로 옮겨 하나님께 향하는 관계적 귀환을 우선 드러냈습니다.
  alternative_readings:
  - 회개하다
  - 돌이키다
  rationale: 본문은 회개의 내적 상태를 완전히 배제하지 않지만, 직접 명령은 ‘내게로 돌아오라’입니다. 따라서 도덕적 용어로 축소하지 않고 언약 관계의 복귀를 중심에 두었습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
