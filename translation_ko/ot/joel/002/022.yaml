source:
  edition: WLC
  text: אַל תִּֽירְאוּ֙ בַּהֲמ֣וֹת שָׂדַ֔י כִּ֥י דָשְׁא֖וּ נְא֣וֹת מִדְבָּ֑ר כִּֽי עֵץ֙ נָשָׂ֣א פִרְי֔/וֹ תְּאֵנָ֥ה וָ/גֶ֖פֶן נָתְנ֥וּ חֵילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/022.yaml
  text: Do not fear[a], beasts of the field, for the pastures of the wilderness have become green; for the tree bears its fruit, the fig tree and the vine have given their wealth.
  footnotes:
  - marker: a
    text: Or 'have yielded their produce' or 'have given their full yield.' The Hebrew 'strength' here likely refers to productive power or abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 두려워하지 마십시오, 들짐승들아. 광야의 풀밭이 푸르게 되었고, 나무가 열매를 맺으며, 무화과나무와 포도나무가 풍성한 소출을 내었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 힘을 내었습니다’. 또는 ‘그들의 생산물을 내었습니다’, ‘온전한 수확을 내었습니다’. 히브리어 ‘힘’은 여기서 식물의 생산력, 곧 풍성한 소출을 가리킬 수 있습니다.
    reason: lexical_alternative
