  lexicon: HALOT
  rationale: 부정 명령의 직접 호소를 살리되, 현대 한국어 합쇼체로 자연스럽고 단정하게 옮겼습니다.
- source_word: בַּהֲמוֹת שָׂדַי
  english_pob_choice: beasts of the field
  chosen_korean: 들의 짐승들
  alternatives_korean:
