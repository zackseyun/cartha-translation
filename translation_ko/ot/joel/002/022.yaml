  lexicon: HALOT
  rationale: בהמות는 일반적인 짐승/동물을 가리키고, שָׂדַי는 들판의 배경을 주므로 직역보다 자연스러운 한국어 관용을 택했습니다.
- source_word: נְאֹות מִדְבָּר
  english_pob_choice: the pastures of the wilderness
  chosen_korean: 광야의 풀밭
  alternatives_korean:
  - 광야의 목초지
  - 광야의 풀 먹이는 곳
  lexicon: HALOT
  rationale: נְאֹות은 목초지·풀밭의 뜻이므로 '풀밭'으로 간명하게 살리고, מִדְבָּר은 사막보다 성경적 배경에 맞는 '광야'로 옮겼습니다.
- source_word: נָתְנוּ חֵילָם
  english_pob_choice: have given their strength
  chosen_korean: 자기들의 힘을 내어 주었습니다
  alternatives_korean:
  - 자기들의 힘을 주었습니다
  - 자기들의 생산력을 내어 주었습니다
  - 자기들의 풍요를 내어 주었습니다
  lexicon: HALOT
  rationale: חֵיל은 여기서 물질적 '재물'보다 식물이 내는 생산력/풍성함의 힘을 가리키므로, 비유를 유지하면서도 문맥에 맞게 '힘'으로 번역했습니다.
theological_decisions:
- issue: 식물과 들짐승을 향한 금지 명령의 화법
  chosen_reading: 자연을 향해 직접 명령하는 예언적 수사로, 대상에게 실제 인격적 청자를 전제한 말투를 그대로 살렸습니다.
  alternative_readings:
  - 3인칭 서술로 완화하는 번역
  - 대상을 생략해 일반 진술로 처리하는 번역
  rationale: 히브리어 원문은 들짐승에게 직접 말을 거는 형식이므로, 수사적 긴장을 약화시키지 않고 그대로 전달하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 예언 문체의 직접 호소와 창조 세계의 회복 이미지
