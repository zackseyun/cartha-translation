  rationale: חֵיל은 여기서 물질적 '재물'보다 식물이 내는 생산력/풍성함의 힘을 가리키므로, 비유를 유지하면서도 문맥에 맞게 '힘'으로 번역했습니다.
theological_decisions:
- issue: 식물과 들짐승을 향한 금지 명령의 화법
  chosen_reading: 자연을 향해 직접 명령하는 예언적 수사로, 대상에게 실제 인격적 청자를 전제한 말투를 그대로 살렸습니다.
  alternative_readings:
