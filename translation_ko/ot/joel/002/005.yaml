source:
  edition: WLC
  text: כְּ/ק֣וֹל מַרְכָּב֗וֹת עַל רָאשֵׁ֤י הֶֽ/הָרִים֙ יְרַקֵּד֔וּ/ן כְּ/קוֹל֙ לַ֣הַב אֵ֔שׁ אֹכְלָ֖ה קָ֑שׁ כְּ/עַ֣ם עָצ֔וּם עֱר֖וּךְ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/005.yaml
  text: Like the sound of chariots[a], they leap on the tops of the mountains; like the sound of a flame of fire consuming stubble[c][b]; like a mighty people arrayed for battle.
  footnotes:
  - marker: a
    text: Or 'they skip' or 'they dance'; the Hebrew verb can denote lively springing movement. Here it is rendered 'they leap' to fit the military advance imagery.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'on the heads of the mountains.'
    reason: lexical_alternative
  - marker: c
    text: Or 'prepared for war' / 'drawn up for battle.' The Hebrew emphasizes ordered military formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 병거들의 소리처럼, 그들은 산들의 꼭대기에서 뛰어오릅니다. 마치 짚을 삼키는 불꽃의 소리 같고, 마치 전투를 위해 정렬된 강한 백성 같습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '산들의 머리 위'입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불꽃’은 히브리어 לַהַב의 기본 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 '전투를 위해 배열된/정렬된'의 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקוֹל מַרְכָּב֗וֹת
  english_pob_choice: Like the sound of chariots
  chosen_korean: 마치 병거들의 소리처럼
  alternatives_korean:
  - 마치 전차들의 소리처럼
  - 마치 전쟁 병거의 소리처럼
  lexicon: HALOT
  rationale: כְּקוֹל은 비교를 나타내는 '마치 … 소리처럼'이 자연스럽고, מַרְכָּבוֹת은 기본적으로 병거/전차를 뜻하므로 본문 이미지에 맞게 '병거'로 옮겼습니다.
- source_word: עַל רָאשֵׁי הֶהָרִים
  english_pob_choice: on the tops of the mountains
  chosen_korean: 산들의 꼭대기에서
  alternatives_korean:
  - 산들의 머리 위에서
  - 산봉우리 위에서
  lexicon: HALOT
  rationale: 직역하면 '산들의 머리 위'이지만, 한국어에서는 같은 이미지를 살리면서도 자연스러운 '산들의 꼭대기에서'가 적절합니다.
- source_word: יְרַקֵּד֔וּן
  english_pob_choice: they leap
  chosen_korean: 뛰어오릅니다
  alternatives_korean:
  - 뛰어넘습니다
  - 뛰어돕니다
  - 춤추듯 뛰어오릅니다
  lexicon: HALOT
  rationale: רקד는 뛰다/뛰어오르다/춤추다의 뜻을 가지지만, 여기서는 전진하는 군대의 역동성을 살려 '뛰어오릅니다'로 옮겼습니다.
- source_word: לַהַב אֵשׁ אֹכְלָה קָשׁ
  english_pob_choice: like the sound of a flame of fire consuming stubble
  chosen_korean: 마치 짚을 삼키는 불꽃의 소리 같고
  alternatives_korean:
  - 마치 짚을 태우는 불꽃의 소리 같고
  - 마치 짚을 먹어 치우는 불길의 소리 같고
  lexicon: HALOT
  rationale: לַהַב אֵשׁ은 '불꽃'으로, אֹכְלָה는 '삼키는/먹는'의 능동적 이미지를 살려 직역성을 유지했습니다. קָשׁ은 짚보다 짚단·겨도 가능하지만, 한국어 관용에서 '짚'이 가장 즉각적으로 건조한 연소 재료를 전달합니다.
- source_word: כְּעַם עָצוּם עֱרוּךְ מִלְחָמָה
  english_pob_choice: like a mighty people arrayed for battle
  chosen_korean: 마치 전투를 위해 정렬된 강한 백성 같습니다
  alternatives_korean:
  - 마치 싸움을 위해 늘어선 강한 백성 같습니다
  - 마치 전쟁을 위해 진을 친 강한 백성 같습니다
  lexicon: HALOT
  rationale: עָצוּם은 강한/강력한/막강한의 의미가 있어 군사적 맥락에서는 '강한'이 무난하며, עָרוּךְ מִלְחָמָה는 '전투를 위해 정렬된'으로 번역해 군대식 배열의 이미지를 보존했습니다.
theological_decisions:
- issue: 비유의 누적과 군사적-우주적 심판 이미지
  chosen_reading: 이 절은 실제 전쟁 병력의 묘사라기보다, 신적 심판이 다가올 때의 압도적 소음과 질주를 연속된 비유로 제시하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 전쟁군 묘사로 읽기
  - 음향적 비교를 약화시키고 사건 서술로 읽기
  rationale: 반복되는 כְּ(마치/처럼)가 연속적으로 사용되므로, 본문은 동일 대상을 다양한 감각적 이미지로 중첩해 그려내는 시적 묘사로 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 예언서의 시적 심판 묘사
