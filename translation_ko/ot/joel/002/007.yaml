  source_fidelity: 핵심 동작과 군사 비유는 대체로 충실합니다. 그러나 כְּאַנְשֵׁי מִלְחָמָה의 자연스러운 한국어 표현으로는 ‘전쟁하는 사람들’보다 ‘전쟁하는 이들’이 적절하며, 희귀 동사 יְעַבְּטוּן의 불확실성과 ‘대열을 흐트러뜨리지 않는다’라는 가능한 이해를 각주에 반영할 필요가 있습니다.
  naturalness: ‘전쟁하는 사람들처럼’은 문법적으로 가능하지만 군사적 병렬에서 다소 장황하고 어색합니다. ‘용사들처럼 … 전쟁하는 이들처럼’이 현대 표준어 문체에서 더 자연스럽습니다. ‘자기들의 길’은 ‘그들의 길’로 다듬는 편이 자연스럽습니다.
  terminology: גִּבּוֹרִים은 ‘용사들’, אַנְשֵׁי מִלְחָמָה는 ‘전쟁하는 이들’로 구별하여 옮겼습니다. חוֹמָה는 ‘성벽’, אֹרְחוֹת은 ‘길’로 유지했습니다. 본문은 합쇼체 종결을 일관되게 사용합니다.
  issues:
