source:
  edition: WLC
  text: כְּ/גִבּוֹרִ֣ים יְרֻצ֔וּ/ן כְּ/אַנְשֵׁ֥י מִלְחָמָ֖ה יַעֲל֣וּ חוֹמָ֑ה וְ/אִ֤ישׁ בִּ/דְרָכָי/ו֙ יֵֽלֵכ֔וּ/ן וְ/לֹ֥א יְעַבְּט֖וּ/ן אֹרְחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/007.yaml
  text: Like warriors they run[a]; like men of war they climb the wall. Each goes in his own way[b], and they do not swerve from their paths.
  footnotes:
  - marker: a
    text: Or 'like soldiers' or 'like fighting men' for 'like men of war.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they do not break rank.' The Hebrew verb is rare and may denote not deviating from formation or course.
    reason: lexical_alternative
translation:
  language: ko
  text: 용사들처럼 그들이 달리고, 전쟁하는 이들처럼[a] 성벽을 오릅니다. 저마다 자기 길로 가며, 그들의 길에서 벗어나지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군사들처럼’ 또는 ‘싸우는 이들처럼’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 희귀 동사는 ‘빗나가지 않는다’ 또는 ‘어긋나지 않는다’로도 옮길 수 있습니다. 문맥상 ‘대열을 흐트러뜨리지 않는다’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגִבּוֹרִים / כְּאַנְשֵׁי מִלְחָמָה
  english_pob_choice: Like warriors / like men of war
  chosen_korean: 전사들처럼 / 전쟁하는 사람들처럼
  alternatives_korean:
  - 용사들처럼 / 군사들처럼
  - 싸우는 사람들처럼
  lexicon: WLC; HALOT
  rationale: 두 군사 비유를 모두 살리되, '전사들'로 첫 절의 강한 전투 이미지를, '전쟁하는 사람들'로 שני 번째의 직역성을 유지했습니다.
- source_word: יְרֻצוּן
  english_pob_choice: they run
  chosen_korean: 달려가고
  alternatives_korean:
  - 달리고
  - 내달리고
  lexicon: WLC; HALOT
  rationale: ירוץ의 빠른 돌진감을 살리기 위해 단순한 '달리다'보다 동작성이 강한 '달려가다'를 택했습니다.
- source_word: יַעֲלוּ חוֹמָה
  english_pob_choice: they climb the wall
  chosen_korean: 성벽을 오릅니다
  alternatives_korean:
  - 성벽을 올라갑니다
  - 벽을 기어오릅니다
  lexicon: WLC; HALOT
  rationale: עלה + חומה의 문자적 의미를 따라 '성벽을 오르다'로 옮기되, 한국어에서는 목적어를 앞세워 자연스럽게 정리했습니다.
- source_word: וְאִישׁ בִּדְרָכָיו יֵלֵכוּן
  english_pob_choice: Each goes in his own way
  chosen_korean: 각자 자기 길로 가며
  alternatives_korean:
  - 각 사람은 자기 길을 가며
  - 사람마다 자기 길로 가며
  lexicon: WLC; HALOT
  rationale: אִישׁ의 분배적 의미를 '각자'로 살리고, דְּרָכָיו를 '자기 길'로 옮겨 개인별 질서정연한 진행을 드러냈습니다.
- source_word: וְלֹא יְעַבְּטוּן אֹרְחוֹתָם
  english_pob_choice: they do not swerve from their paths
  chosen_korean: 자기들의 길에서 벗어나지 않습니다
  alternatives_korean:
  - 자기들의 길에서 비켜나지 않습니다
  - 자기들의 길에서 어긋나지 않습니다
  lexicon: WLC; HALOT
  rationale: יְעַבְּטוּן은 희귀동사라 문맥상 '벗어나지 않다/빗나가지 않다'의 의미를 살리는 것이 적절하여, 한국어에서는 자연스러운 비유적 표현으로 정리했습니다.
theological_decisions:
- issue: 군사 비유의 성별 표지 유지
  chosen_reading: '''전사들처럼'', ''전쟁하는 사람들처럼'', ''각자 자기 길''을 유지했습니다.'
  alternative_readings:
  - 성별을 중화해 '병사들처럼', '각자 자기 길로'로 옮기는 방식
  rationale: 히브리어는 남성형 군사 비유와 분배적 단수 구문을 사용하므로, 본문의 표지된 표현을 중화하지 않고 그대로 드러내는 편이 स्रोत의 힘을 더 정확히 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
