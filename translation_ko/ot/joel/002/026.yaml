base_translation:
  language: en
  yaml_path: translation/ot/joel/002/026.yaml
  text: You will surely eat and be satisfied[a], and you will praise the name of Yahweh your God, who has dealt wondrously with you[c][b]; and my people will never again be put to shame.
  footnotes:
  - marker: a
    text: 'Or, ''You shall eat in plenty and be full.'' The Hebrew uses an emphatic construction: ''eating you will eat.'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'who has done wondrous things for you.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'and my people shall not be put to shame forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 마음껏 먹고 배부를 것이며, 너희에게 놀라운 일을 행하신 너희의 하나님 야훼의 이름을 찬양할 것입니다[a][b]. 내 백성은 다시는 수치를 당하지 않을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희는 풍성히 먹고 배부를 것이다.’ 히브리어는 ‘먹되 먹을 것이다’라는 강조형을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희를 위해 놀라운 일을 행하신.’
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 백성은 영원히 수치를 당하지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אָכוֹל
  english_pob_choice: You will surely eat
  chosen_korean: 너희는 충분히 먹고
  alternatives_korean:
  - 너희는 반드시 먹고
  - 너희는 넉넉히 먹고
  lexicon: HALOT
  rationale: 히브리어의 동사+부정사 절대형은 강조를 나타내므로, 한국어에서는 ‘충분히’로 강한 충족의 뜻을 살리되 과도한 해석은 피했습니다.
- source_word: וְשָׂבוֹעַ
  english_pob_choice: and be satisfied
  chosen_korean: 배부를 것이며
  alternatives_korean:
  - 만족할 것이며
  - 배가 부를 것이며
  lexicon: HALOT
  rationale: 식사의 결과로 ‘배부름/만족’에 이르는 뜻이므로, 자연스러운 현대 한국어인 ‘배부르다’를 택했습니다.
- source_word: שֵׁם יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: the name of Yahweh your God
  chosen_korean: 너희의 하나님 여호와의 이름을
  alternatives_korean:
  - 너희 하나님 야훼의 이름을
  - 너희의 하나님이신 여호와의 이름을
  lexicon: HALOT
  rationale: 원문은 ‘이름’과 하나님의 언약적 자기계시를 가리키므로 ‘이름을 찬양하다’의 구조를 유지했고, יְהוָה는 본 문맥의 기존 영어 주석 전통을 따라 여호와로 옮겼습니다.
- source_word: אֲשֶׁר עָשָׂה עִמָּכֶם לְהַפְלִיא
  english_pob_choice: who has dealt wondrously with you
  chosen_korean: 그분은 너희에게 놀랍게 행하셨습니다
  alternatives_korean:
  - 그분은 너희와 함께 놀라운 일을 행하셨습니다
  - 그분은 너희를 위하여 놀라운 일을 행하셨습니다
  lexicon: HALOT
  rationale: עִם의 관계성과 לְהַפְלִיא의 ‘경이롭게 행하다’는 뜻을 담기 위해, 한국어에서는 ‘너희에게 놀랍게 행하셨습니다’로 간결하게 처리했습니다.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  english_pob_choice: and my people will never again be put to shame
  chosen_korean: 내 백성은 영원히 다시는 수치를 당하지 않을 것입니다
  alternatives_korean:
  - 내 백성은 영원히 부끄러움을 당하지 않을 것입니다
  - 내 백성은 다시는 수치를 당하지 않을 것입니다
  lexicon: HALOT
  rationale: בושׁ는 단순한 내적 감정보다 공개적 수치를 뜻하므로 ‘수치를 당하다’로 옮겼고, לְעוֹלָם의 영속성을 ‘영원히 다시는’으로 중첩해 강조했습니다.
theological_decisions:
- issue: 여호와(יהוה)의 표기
