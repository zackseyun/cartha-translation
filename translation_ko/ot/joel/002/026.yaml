  rationale: 이 절은 하나님의 언약 이름을 직접 부르므로 고유명칭을 유지해야 했습니다. 이번 초안은 기존 영어 주석 전통과 한국어 가독성을 고려해 여호와를 택했습니다.
  doctrine_reference: 'POB contested terms: YHWH rendering'
- issue: 마지막 보증문의 시간·강도
  chosen_reading: 영원히 다시는 수치를 당하지 않을 것입니다
  alternative_readings:
  - 영원히 수치를 당하지 않을 것입니다
  - 다시는 수치를 당하지 않을 것입니다
  rationale: 원문의 לְעוֹלָם은 지속적 보증을, 부정 동사는 수치의 종결을 나타내므로 둘 다 살려 회복의 완전성을 분명히 했습니다.
  doctrine_reference: Joel restoration promise
