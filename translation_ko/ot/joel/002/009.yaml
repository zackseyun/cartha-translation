id: JOL.2.9
reference: Joel 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/עִ֣יר יָשֹׁ֗קּוּ בַּֽ/חוֹמָה֙ יְרֻצ֔וּ/ן בַּ/בָּתִּ֖ים יַעֲל֑וּ בְּעַ֧ד הַ/חַלּוֹנִ֛ים יָבֹ֖אוּ כַּ/גַּנָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/009.yaml
  text: They rush through the city[a]; they run on the wall; they climb into the houses; they enter through the windows like a thief.
  footnotes:
  - marker: a
    text: Or 'in the city' for 'through the city'; the Hebrew preposition is literally 'in,' but the English rendering reflects movement within the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성읍 안을 질주하고, 성벽 위를 달리며, 집들 안으로 올라가고, 창문을 통해 도둑처럼 들어옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 בָּעִיר는 문자적으로 ‘성읍 안에’라는 뜻이지만, 이동의 문맥에서는 성읍 내부를 가로지르며 움직이는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעִיר / יָשֹׁקּוּ
  english_pob_choice: rush through the city
  chosen_korean: 성읍 안에서 질주하며
  alternatives_korean:
  - 성읍을 질주하며
  - 도성 안을 급히 달리며
  - 성읍 안을 내달리며
  lexicon: HALOT
  rationale: בָּעִיר의 위치 개념과 יָשֹׁקּוּ의 급박한 움직임을 함께 살려, 단순한 ‘안에’보다 침입적이고 혼란스러운 이동을 드러내는 표현으로 옮겼습니다.
- source_word: בַּחוֹמָה / יְרֻצוּן
  english_pob_choice: run on the wall
  chosen_korean: 성벽 위를 달리고
  alternatives_korean:
  - 성벽 위에서 달리고
  - 성벽을 따라 달리고
  - 담 위를 달리고
  lexicon: HALOT
  rationale: ‘wall’은 문맥상 도시 성벽을 가리키므로 ‘성벽’으로 구체화했고, 보행이 아니라 빠른 돌진의 반복을 보여 주는 동사 흐름을 살려 ‘달리고’로 옮겼습니다.
- source_word: בַּבָּתִּים / יַעֲלוּ
  english_pob_choice: climb into the houses
  chosen_korean: 집으로 올라가며
  alternatives_korean:
  - 집들로 올라가며
  - 집 안으로 올라가며
  - 집에 기어오르며
  lexicon: HALOT
  rationale: יַעֲלוּ의 기본 의미는 ‘올라가다’이므로, 침입의 방식이 드러나도록 하되 과도하게 해석하지 않는 범위에서 ‘집으로 올라가며’로 처리했습니다.
- source_word: בְּעַד הַחַלּוֹנִים / יָבֹאוּ / כַּגַּנָּב
  english_pob_choice: enter through the windows like a thief
  chosen_korean: 창문을 통해 도둑처럼 들어옵니다
  alternatives_korean:
  - 창문으로 들어오며 도둑처럼 행동합니다
  - 창문 사이로 들어오며 도둑처럼 들어옵니다
  - 창문을 넘어 도둑처럼 들어옵니다
  lexicon: HALOT
  rationale: בְּעַד은 ‘~을 통해’라는 통로 개념을 분명히 하므로 ‘창문을 통해’로 직역했고, כַּגַּנָּב의 비교를 ‘도둑처럼’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 침입하는 주체의 정체를 특정할지 여부
  chosen_reading: 대명사를 ‘그들은’으로 유지해, 무엇을 가리키는지 이 절에서 단정하지 않았습니다.
  alternative_readings:
  - 메뚜기 떼로 명시하기
  - 군대로 명시하기
  rationale: 히브리어는 이 절에서 복수 동사만 사용하며 명시적 명사를 두지 않아, 앞 문맥의 이미지가 의도적으로 중첩됩니다. 그 긴장을 풀지 않고 유지하는 것이 본문의 효과를 가장 잘 보존합니다.
  doctrine_reference: 문맥적 이미지의 중첩을 보존
