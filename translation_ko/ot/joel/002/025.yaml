source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֤י לָ/כֶם֙ אֶת הַ/שָּׁנִ֔ים אֲשֶׁר֙ אָכַ֣ל הָֽ/אַרְבֶּ֔ה הַ/יֶּ֖לֶק וְ/הֶ/חָסִ֣יל וְ/הַ/גָּזָ֑ם חֵילִ/י֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר שִׁלַּ֖חְתִּי בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/025.yaml
  text: I will restore to you the years that the swarming locust has eaten—the hopper[a], the destroyer[b], and the cutter—my great army that I sent among you.
  footnotes:
  - marker: a
    text: The four Hebrew terms likely refer to kinds or stages of locusts. Their exact zoological distinctions are uncertain; alternatives include 'creeping locust,' 'devourer,' and 'gnawer.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that I sent against you.' The Hebrew preposition can be understood in more than one way here.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 너희에게, 메뚜기 떼가 먹어 버린 그 해들—서리고, 갉아먹고, 베어 먹는 그것들—곧 내가 너희 가운데 보낸 나의 큰 군대를 되돌려 주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 네 메뚜기 명칭은 정확한 곤충학적 구분이 확실하지 않으며, ‘기어 다니는 메뚜기’, ‘먹어 치우는 것’, ‘갉아먹는 것’ 같은 대안이 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희에게’ 또는 ‘너희를 향해’로도 옮길 수 있습니다. 히브리어 전치사는 여기서 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  english_pob_choice: I will restore
  chosen_korean: 되돌려 주겠습니다
  alternatives_korean:
  - 회복시켜 주겠습니다
  - 갚아 주겠습니다
  - 보상하겠습니다
  lexicon: HALOT
  rationale: 피엘 שלם은 ‘갚다/보상하다/온전하게 하다’의 뜻을 가질 수 있으나, 문맥상 메뚜기 재앙으로 잃어버린 세월을 메워 준다는 의미이므로 ‘되돌려 주다’가 가장 자연스럽고 회복의 뉘앙스를 살립니다.
- source_word: הַשָּׁנִים
  english_pob_choice: the years
  chosen_korean: 그 해들
  alternatives_korean:
  - 그 세월
  - 그 해의 수확들
  - 그 해들의 손실
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그 해들’이므로 이를 유지하되, 한국어에서 기간 전체를 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: הָאַרְבֶּה הַיֶּלֶק וְהֶחָסִיל וְהַגָּזָם
  english_pob_choice: the swarming locust—the hopper, the destroyer, and the cutter
  chosen_korean: 메뚜기 떼가 먹어 버린 … 서리고, 갉아먹고, 베어 먹는 그것들
  alternatives_korean:
  - 서로 다른 종류의 메뚜기—움직이는 것, 파괴하는 것, 자르는 것
  - 메뚜기 떼—서리개, 파괴자, 절단자
  lexicon: HALOT
  rationale: 네 개의 히브리어 용어는 정확한 분류가 불확실한 메뚜기 관련 명칭들로, POB처럼 기능적 의미를 살리되 과도한 곤충학적 확정을 피했습니다. ‘서리다/갉아먹다/베어 먹다’는 서로 구별되는 파괴상을 드러냅니다.
- source_word: חֵילִי הַגָּדוֹל
  english_pob_choice: my great army
  chosen_korean: 나의 큰 군대
  alternatives_korean:
  - 나의 큰 군세
  - 나의 강한 군대
  - 나의 큰 무리
  lexicon: HALOT
  rationale: חיל은 군대/군세/군력의 뜻이 있으나, 이 구절은 메뚜기 재앙을 군사적 이미지로 부르므로 ‘군대’가 은유와 신학적 무게를 가장 잘 보존합니다.
- source_word: אֲשֶׁר שִׁלַּחְתִּי בָּכֶם
  english_pob_choice: that I sent among you
  chosen_korean: 내가 너희 가운데 보낸
  alternatives_korean:
  - 내가 너희에게 보낸
  - 내가 너희를 치러 보낸
  - 내가 너희 안으로 보낸
  lexicon: HALOT
  rationale: בכם은 ‘너희 가운데/너희 안에’로도 읽을 수 있어, 공동체와 땅 한가운데로 침투한 재앙의 이미지를 살리는 ‘너희 가운데’가 가장 무난합니다.
theological_decisions:
- issue: 메뚜기 재앙을 문자적 곤충 재앙과 군사적 은유 중 어떻게 처리할지
  chosen_reading: 문자적 메뚜기 재앙을 말하면서 군사적 은유를 덧씌운 표현으로 유지합니다.
  alternative_readings:
  - 인간 군대에 대한 비유로만 처리
  - 상징적 재난 일반으로 완화
  rationale: 본문은 네 개의 메뚜기 관련 명칭을 열거한 뒤 이를 ‘나의 큰 군대’라고 부르므로, 두 층위를 모두 지켜야 합니다. 어느 한쪽으로만 환원하면 원문의 긴장을 잃게 됩니다.
  doctrine_reference: 하나님의 주권 아래 있는 심판/재앙의 서술
- issue: 하나님이 재앙의 ‘보내심’을 직접 책임지시는가
  chosen_reading: ‘내가 … 보낸’으로 직접 귀속시킵니다.
  alternative_readings:
  - 허용만 하신 것으로 완화
  - 간접적 허용 표현으로 조정
  rationale: 히브리어 1인칭 완료형 שִׁלַּחְתִּי는 직접적 행위를 말하므로, 이를 완화하지 않고 그대로 옮기는 것이 본문에 충실합니다.
  doctrine_reference: 하나님의 주권과 심판의 직접성
