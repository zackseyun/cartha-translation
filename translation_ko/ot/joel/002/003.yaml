    rationale: 문법적으로 가능하지만, 원문의 ‘그 앞의 땅’과 공간적 대조를 또렷하게 보이려면 ‘그 뒤의 땅은’으로 병행시키는 것이 더 자연스럽고 명료합니다.
  - severity: medium
