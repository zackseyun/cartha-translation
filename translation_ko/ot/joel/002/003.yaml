  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/פָנָי/ו֙ אָ֣כְלָה אֵ֔שׁ וְ/אַחֲרָ֖י/ו תְּלַהֵ֣ט לֶֽהָבָ֑ה כְּ/גַן עֵ֨דֶן הָ/אָ֜רֶץ לְ/פָנָ֗י/ו וְ/אַֽחֲרָי/ו֙ מִדְבַּ֣ר שְׁמָמָ֔ה וְ/גַם פְּלֵיטָ֖ה לֹא הָ֥יְתָה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/003.yaml
  text: Before it[a], fire devours; behind it, a flame blazes. The land before it is like the garden of Eden, but behind it is a desolate wilderness; indeed, nothing escapes it.
  footnotes:
  - marker: a
    text: Or 'no survivor remains for it' / 'there is no escape from it.' The Hebrew noun can emphasize either escape or survivor/remnant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 앞에서는 불이 삼키고, 그 뒤에서는 불꽃이 타오릅니다. 그 앞의 땅은 에덴동산 같고, 그 뒤는 황폐한 광야이며, 참으로 아무것도 그것에서 벗어나지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무 생존자도 그것을 위해 남지 않는다’ / ‘그것에서 벗어날 길이 없다.’ 히브리어 명사는 탈출과 생존자/남은 자 중 어느 쪽도 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו / וְאַחֲרָיו
  english_pob_choice: before it / behind it
  chosen_korean: 그 앞에서는 / 그 뒤에서는
  alternatives_korean:
  - 그 앞에는 / 그 뒤에는
  - 그 앞에서는 / 그 뒤에는
  lexicon: HALOT
  rationale: 전후 대칭을 살리기 위해 위치를 나타내는 부사구로 옮겼고, 집단적 침략력을 가리키는 단수 대명사의 뉘앙스는 한국어의 ‘그’로 자연스럽게 받았습니다.
- source_word: אָכְלָה אֵשׁ
  english_pob_choice: fire devours
  chosen_korean: 불이 삼키고
  alternatives_korean:
  - 불이 먹어치우고
  - 불이 소멸시키고
  lexicon: HALOT
  rationale: 완결된 파괴를 강하게 드러내는 동사를 택해, 단순한 ‘타다’보다 소멸적 이미지를 살렸습니다.
- source_word: תְּלַהֵט לֶהָבָה
  english_pob_choice: a flame blazes
  chosen_korean: 불꽃이 타오릅니다
  alternatives_korean:
  - 불꽃이 불타오릅니다
  - 불길이 치솟습니다
  lexicon: HALOT
  rationale: 피엘의 격렬한 화염 이미지를 반영해 ‘타오르다’를 택했고, 시각적 병행을 위해 ‘불꽃’으로 옮겼습니다.
- source_word: כְּגַן עֵדֶן
  english_pob_choice: like the garden of Eden
  chosen_korean: 에덴동산 같고
  alternatives_korean:
  - 에덴의 동산 같고
  - 에덴의 낙원 같고
  lexicon: HALOT
  rationale: 창세기적 암시를 분명히 하면서도 한국어 성경에서 널리 알려진 고유명사 형태를 유지했습니다.
- source_word: מִדְבַּר שְׁמָמָה
  english_pob_choice: a desolate wilderness
  chosen_korean: 황폐한 광야
  alternatives_korean:
  - 적막한 광야
  - 쓸쓸한 황무지
  lexicon: HALOT
  rationale: ‘황폐함’과 ‘광야’의 결합으로 파괴된 풍경을 간결하게 드러내되, ‘광야’의 사막적·황량한 정서를 살렸습니다.
- source_word: פְּלֵיטָה לֹא הָיְתָה לוֹ
  english_pob_choice: nothing escapes it
  chosen_korean: 아무것도 그것에서 벗어나지 못합니다
  alternatives_korean:
  - 아무도 그것을 피하지 못합니다
  - 피해 간 것은 아무것도 없습니다
  lexicon: HALOT
  rationale: פְּלֵיטָה의 escape/survivor 중 ‘도피·탈출’ 의미를 살려, 최종 절멸의 포괄성을 ‘벗어나지 못하다’로 옮겼습니다.
theological_decisions:
- issue: 전쟁/재앙의 주체를 가리키는 단수 대명사 처리
  chosen_reading: 집단적 침략력을 하나의 주체로 보고 ‘그/그것’ 계열로 일관되게 번역했습니다.
  alternative_readings:
  - 모두 복수로 풀어 ‘그들’로 번역
  - 개별 인격체처럼 ‘그’로만 번역
  rationale: 히브리어는 단수 접미사를 사용하지만 문맥상 집단적 침략군을 가리키므로, 한국어에서는 무생물적이면서도 집단 지시가 가능한 ‘그것’을 유지하는 편이 원문 긴장을 가장 잘 보존합니다.
  doctrine_reference: 문맥적 집단 단수(collective singular)
