  yaml_path: translation/ot/joel/002/013.yaml
  text: Tear your hearts and not your garments[a], and return to Yahweh your God, for he is gracious and compassionate, slow to anger and abundant in steadfast love[b], and relenting concerning the disaster.
  footnotes:
  - marker: a
    text: Or 'rend your hearts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'relenting concerning the disaster'; that is, withholding threatened judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 마음을 찢고 옷을 찢지 말며, 너희 하나님 야훼께 돌아오십시오. 그는 은혜롭고 긍휼이 많으며, 노하기를 더디 하시고, 사랑이 풍성하시며, 재앙에 대하여 뜻을 돌이키십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 마음을 찢으라.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘재앙에 대하여 뜻을 돌이키는’이라는 뜻입니다. 곧 위협된 심판을 거두신다는 말입니다.
    reason: lexical_alternative
