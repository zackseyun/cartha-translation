theological_decisions:
- issue: 신적 속성 목록의 한국어 톤
  chosen_reading: ‘은혜롭고 긍휼이 많으며…’로 신적 자비와 인내를 격식 있는 현대어로 제시합니다.
  alternative_readings:
  - ‘자비로우시며…’
  - ‘인자하시며…’
  rationale: 히브리어의 고전적 언약 공식(은혜/긍휼/노하기를 더디 함/사랑 풍성함)을 현대 합쇼체로 유지해, 전통적 의미를 흐리지 않으면서도 구어적 자연성을 확보했습니다.
  doctrine_reference: Divine attribute formula in OT prophetic speech
- issue: וְנִחָם עַל הָרָעָה의 신학적 긴장
  chosen_reading: ‘재앙에 대하여 뜻을 돌이키십니다’
  alternative_readings:
  - ‘재앙을 거두십니다’
  - ‘재앙에 대해 마음을 바꾸십니다’
  rationale: 하나님이 선포하신 심판을 회개에 응답하여 유보하신다는 의미를 살리되, 하나님이 오류를 범하거나 학습하신다는 함의를 피합니다. 원문의 인격적·예언적 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
