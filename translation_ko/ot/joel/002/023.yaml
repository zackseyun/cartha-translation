id: JOL.2.23
reference: Joel 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י צִיּ֗וֹן גִּ֤ילוּ וְ/שִׂמְחוּ֙ בַּ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם כִּֽי נָתַ֥ן לָ/כֶ֛ם אֶת הַ/מּוֹרֶ֖ה לִ/צְדָקָ֑ה וַ/יּ֣וֹרֶד לָ/כֶ֗ם גֶּ֛שֶׁם מוֹרֶ֥ה וּ/מַלְק֖וֹשׁ בָּ/רִאשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/023.yaml
  text: And you[a], children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain for righteousness[c][b]; and he causes the rain to come down for you—the early rain and the latter rain as before.
  footnotes:
  - marker: a
    text: Or, 'the teacher for righteousness' or 'the teacher of righteousness.' The Hebrew word moreh can mean either 'teacher' or 'early rain'; the surrounding mention of rain favors 'early rain' here.
    reason: alternative_reading
  - marker: b
    text: Or, 'in just measure' or 'for your vindication.' The Hebrew phrase literally reads 'for righteousness.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'in the first month.' The Hebrew can also be read as a calendrical reference, though 'as before' fits the restoration context well.
    reason: alternative_reading
translation:
  language: ko
  text: 시온의 자녀들아, 너희는 야훼, 너희 하나님 안에서 기뻐하고 즐거워하십시오. 그분께서 너희에게 의를 위하여 이른 비를[a][b] 주셨으니, 너희를 위하여 비를 내려 주십니다. 곧 이른 비와 늦은 비를 전과 같이[c] 내려 주십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 번역으로는 ‘의를 위한 스승’ 또는 ‘의의 스승’이 가능합니다. 히브리어 מוֹרֶה는 ‘스승’과 ‘이른 비’ 둘 다를 뜻할 수 있으나, 주변의 비에 대한 언급은 여기서는 ‘이른 비’를 더 강하게 뒷받침합니다.
    reason: alternative_reading
  - marker: b
    text: 다른 번역으로는 ‘바른 분량으로’ 또는 ‘너희의 권리를 옹호하기 위하여’가 가능합니다. 히브리어 לִצְדָקָה는 문자적으로 ‘의를 위하여’입니다.
    reason: lexical_alternative
  - marker: c
    text: 다른 번역으로는 ‘처음에’ 또는 ‘첫째 달에’가 가능합니다. 히브리어 בָּרִאשׁוֹן은 달력상의 지시일 수도 있으나, 회복의 문맥에서는 ‘전과 같이’가 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  english_pob_choice: children of Zion
  chosen_korean: 시온의 자녀들아
  alternatives_korean:
  - 시온의 아들들아
  - 시온의 백성들아
  lexicon: HALOT
  rationale: בְנֵי는 문자적으로 ‘아들들’이지만, 집합적 호칭으로 쓰여 남성만 가리키지 않으므로 ‘자녀들’이 자연스럽고 언약적 뉘앙스를 보존합니다.
- source_word: גִּילוּ וְשִׂמְחוּ
  english_pob_choice: rejoice and be glad
  chosen_korean: 기뻐하고 즐거워하십시오
  alternatives_korean:
  - 환호하고 기뻐하십시오
  - 기뻐하고 환희하십시오
  lexicon: HALOT
  rationale: 두 명령형의 병렬과 강조를 살리면서, 현대 한국어에서 자연스러운 두 겹의 기쁨 표현으로 옮겼습니다.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  english_pob_choice: in Yahweh your God
  chosen_korean: 야훼 너희 하나님 안에서
  alternatives_korean:
  - 야훼 너희 하나님에게서
  - 주 너희 하나님 안에서
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 두고, בְּ의 영역/대상을 살려 ‘안에서’로 옮겼습니다.
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  english_pob_choice: the early rain for righteousness
  chosen_korean: 의를 위한 이른 비
  alternatives_korean:
  - 공의를 위한 이른 비
  - 의를 위한 봄비
  - 의로운 이른 비
  lexicon: HALOT
  rationale: 문맥의 ‘비’, ‘이른 비’, ‘늦은 비’가 이어지므로 מוֹרֶה는 ‘이른 비’로 보는 것이 가장 강하며, לִצְדָקָה는 ‘의’의 어휘적·신학적 무게를 보존하기 위해 직역에 가깝게 남겼습니다.
- source_word: וַיּוֹרֶד לָכֶם גֶּשֶׁם
  english_pob_choice: and he causes the rain to come down for you
  chosen_korean: 너희를 위해 비를 내려 주시되
  alternatives_korean:
  - 너희에게 비를 내려 주시고
  - 너희를 위해 비를 내리시며
  lexicon: HALOT
  rationale: 히필형 ירד의 사역성을 살리면서 한국어에서는 ‘비를 내려 주시다’가 가장 자연스럽고 분명합니다.
- source_word: מוֹרֶה וּמַלְקוֹשׁ בָּרִאשׁוֹן
  english_pob_choice: the early rain and the latter rain as before
  chosen_korean: 이른 비와 늦은 비를 전과 같이
  alternatives_korean:
  - 이른 비와 늦은 비를 처음처럼
  - 이른 비와 늦은 비를 이전처럼
  lexicon: HALOT
  rationale: בָּרִאשׁוֹן은 문맥상 달력 정보보다 회복의 의미인 ‘전과 같이’가 더 적절하여, 두 계절비의 정상적 পুন회복을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: לִצְדָקָה의 의미를 ‘의’로 보존할지 ‘의로운/공정한 분량’으로 풀어쓸지
  chosen_reading: 본문에는 ‘의를 위한’으로 두어 צדקה의 신학적·언약적 어휘를 유지했습니다.
  alternative_readings:
  - 공의를 위한
  - 바른 분량으로
  - 너희의 vindication을 위해
  rationale: 이 표현은 단순한 양의 적절성보다 하나님의 의로운 행위와 관련된 핵심 어휘이므로, 의미를 완화하지 않고 유지하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: מורה의 의미를 ‘스승’으로 읽는 해석 가능성
  chosen_reading: 주된 본문은 ‘이른 비’로 번역했습니다.
  alternative_readings:
  - 스승
  - 의의 스승
  - 의의 교사
  rationale: 바로 뒤에 ‘비’와 ‘이른 비와 늦은 비’가 이어져 농경적 문맥이 매우 강하므로, ‘스승’ 해석은 각주로만 남기는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
