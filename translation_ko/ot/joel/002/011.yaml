id: JOL.2.11
reference: Joel 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה נָתַ֤ן קוֹל/וֹ֙ לִ/פְנֵ֣י חֵיל֔/וֹ כִּ֣י רַ֤ב מְאֹד֙ מַחֲנֵ֔/הוּ כִּ֥י עָצ֖וּם עֹשֵׂ֣ה דְבָר֑/וֹ כִּֽי גָד֧וֹל יוֹם יְהוָ֛ה וְ/נוֹרָ֥א מְאֹ֖ד וּ/מִ֥י יְכִילֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/011.yaml
  text: And Yahweh gives his voice before his army[a], for his camp is exceedingly great; for mighty is the one who does his word[c][b]. For the day of Yahweh is great and exceedingly dreadful—who can endure it?
  footnotes:
  - marker: a
    text: Or 'utters his voice.' The Hebrew is literally 'gives his voice.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the one who executes his command.' Hebrew 'his word' can imply a command in this context.
    reason: lexical_alternative
  - marker: c
    text: Or 'very terrible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 그의 군대 앞에서 그의 소리를 내십니다[a]. 그의 진이 심히 크기 때문입니다. 그는 자기 말씀을 행하는 이가 능하기 때문입니다[b]. 여호와의 날이 크고 심히 두렵습니다[c] — 누가 그것을 견딜 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 음성을 내십니다.’ 히브리어는 문자적으로 ‘그의 소리를 줍니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 명령을 행하는 이.’ כאן의 ‘말씀’은 문맥상 명령을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘매우 무섭습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה / יְהוָה
  english_pob_choice: Yahweh / the LORD
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 시편·예언서에서의 신적 이름은 본문 고유성을 살리기 위해 표준 교회어인 ‘주님’ 대신 고유명사 형태로 옮겼습니다.
- source_word: נָתַן קוֹלוֹ
  english_pob_choice: gives his voice
  chosen_korean: 그의 소리를 내십니다
  alternatives_korean:
  - 그의 음성을 주십니다
  - 그의 소리를 선포하십니다
  - 그의 음성을 발하십니다
  lexicon: HALOT
  rationale: 히브리어의 직역성 있는 ‘give his voice’ 계열을 따라 ‘소리를 내다’로 옮겨, 단순히 말하는 것보다 압도적 발성을 드러냈습니다.
- source_word: חֵיל / מַחֲנֵהוּ
  english_pob_choice: army / camp
  chosen_korean: 군대 / 진
  alternatives_korean:
  - 군대 / 진영
  - 군사력 / 진영
  - 군대 / 야영지
  lexicon: HALOT
  rationale: חֵיל은 조직된 군사력을, מַחֲנֶה는 군사적 ‘진’의 이미지를 살리는 말로 구분해 번역했습니다.
- source_word: עֹשֵׂה דְבָרוֹ
  english_pob_choice: the one who does his word
  chosen_korean: 그의 말씀을 행하는 이
  alternatives_korean:
  - 그의 말씀을 실행하는 이
  - 그의 명령을 실행하는 이
  - 그의 말씀을 하는 이
  lexicon: HALOT
  rationale: POB의 ‘does his word’를 따라 ‘행하다’를 택하되, דָּבָר의 폭을 살려 ‘명령’으로 좁히지 않고 ‘말씀’으로 옮겼습니다.
- source_word: וְנוֹרָא מְאֹד
  english_pob_choice: exceedingly dreadful
  chosen_korean: 심히 두렵습니다
  alternatives_korean:
  - 매우 무섭습니다
  - 대단히 두렵습니다
  - 지극히 두렵습니다
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 נוֹרָא의 공포감을 현대 한국어로 자연스럽게 살리기 위해 ‘두렵습니다’를 택했습니다.
theological_decisions:
- issue: 여호와의 날과 그 군대의 관계
  chosen_reading: 본문은 여호와의 날의 심판성과, 그 아래 놓인 군대가 여호와의 소리에 응답하는 존재임을 함께 유지합니다.
  alternative_readings:
  - 단순한 메뚜기 재앙의 비유로만 읽는 것
  - 순수한 인간 군대로만 읽는 것
  rationale: 히브리어의 소유격과 ‘그의 말씀을 행하는 이’라는 표현을 그대로 살려, 본문이 의도적으로 남겨 둔 이미지의 긴장을 보존했습니다.
  doctrine_reference: 예언서 이미지와 신적 주권
