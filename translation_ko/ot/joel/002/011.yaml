- from: 여호와께서 그의 군대 앞에서 그의 소리를 내십니다[a]. 그의 진이 심히 크기 때문입니다. 그는 자기 말씀을 행하는 이가 능하기 때문입니다[b]. 여호와의 날이 크고 심히 두렵습니다[c] — 누가 그것을 견딜 수 있겠습니까?
  to: 여호와께서 자신의 군대 앞에서 음성을 발하십니다[a]. 그의 진영이 심히 크고, 그의 말씀을 행하는 이가 강하기 때문입니다[b]. 여호와의 날은 크고 심히 두렵습니다[c]. 누가 그것을 견딜 수 있겠습니까?
  rationale: The revision corrects the mistranslated participial clause by rendering ‘the one who carries out his word’ as the subject who is strong. It also improves prophetic Korean style (‘음성을 발하십니다’), clarifies the military camp as ‘진영,’ retains the causal relation of both כי clauses, and repairs the Korean-language footnote. No interpretive decision is made about whether the army imagery denotes locusts, human forces, or both.
