  lexicon: HALOT
  rationale: יֶקֶב은 포도즙을 받아내는 틀/통을 가리키므로 ‘포도즙 틀’이 장면을 더 분명히 드러냅니다. 동사의 이미지는 ‘넘치다’로 살렸습니다.
- source_word: תִּירוֹשׁ וְיִצְהָר
  english_pob_choice: new wine and oil
  chosen_korean: 새 포도주와 기름
  alternatives_korean:
  - 새 포도주와 새 기름
  - 포도주와 올리브 기름
  lexicon: HALOT
  rationale: תִּירוֹשׁ은 새 포도주, יִצְהָר은 산물로서의 기름을 뜻하므로 ‘새 포도주와 기름’이 원문 어휘를 과도하게 풀지 않으면서도 한국어로 자연스럽습니다.
