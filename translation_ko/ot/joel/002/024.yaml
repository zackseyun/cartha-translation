  rationale: גֹּרֶן은 곡식을 타작하는 장소이므로 ‘타작마당’이 직접적이며, 결과 상태를 미래로 말하는 문맥에 ‘가득 찰 것이다’가 자연스럽습니다.
- source_word: בָּר
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 알곡
  - 곡물
  lexicon: HALOT
  rationale: בָּר은 특정 품종보다 타작된 곡물을 넓게 가리키므로, 현대 한국어에서는 ‘곡식’이 가장 무난하고 과도하게 특정하지 않습니다.
- source_word: וְהֵשִׁיקוּ הַיְקָבִים
  english_pob_choice: the vats will overflow
  chosen_korean: 포도즙 틀들은 ... 넘칠 것입니다
