lexical_decisions:
- source_word: וּמָלְאוּ הַגֳּרָנוֹת
  english_pob_choice: The threshing floors will be filled
  chosen_korean: 타작마당들은 곡식으로 가득 찰 것이며
  alternatives_korean:
