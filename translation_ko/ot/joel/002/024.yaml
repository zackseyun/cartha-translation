translation:
  language: ko
  text: 타작마당들은 곡식으로 가득 찰 것이며, 포도즙 틀들은 새 포도주와 기름으로 넘칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도즙 틀들이 새 포도주와 올리브 기름으로 넘칠 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ הַגֳּרָנוֹת
  english_pob_choice: The threshing floors will be filled
  chosen_korean: 타작마당들은 곡식으로 가득 찰 것이며
  alternatives_korean:
  - 타작마당들은 가득 채워질 것이며
  - 타작마당들은 곡식으로 채워질 것이며
  lexicon: HALOT
  rationale: גֹּרֶן은 곡식을 타작하는 장소이므로 ‘타작마당’이 직접적이며, 결과 상태를 미래로 말하는 문맥에 ‘가득 찰 것이다’가 자연스럽습니다.
- source_word: בָּר
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 알곡
  - 곡물
  lexicon: HALOT
  rationale: בָּר은 특정 품종보다 타작된 곡물을 넓게 가리키므로, 현대 한국어에서는 ‘곡식’이 가장 무난하고 과도하게 특정하지 않습니다.
- source_word: וְהֵשִׁיקוּ הַיְקָבִים
  english_pob_choice: the vats will overflow
  chosen_korean: 포도즙 틀들은 ... 넘칠 것입니다
  alternatives_korean:
  - 포도주 틀들은 ... 넘칠 것입니다
  - 독들은 ... 넘칠 것입니다
  lexicon: HALOT
  rationale: יֶקֶב은 포도즙을 받아내는 틀/통을 가리키므로 ‘포도즙 틀’이 장면을 더 분명히 드러냅니다. 동사의 이미지는 ‘넘치다’로 살렸습니다.
- source_word: תִּירוֹשׁ וְיִצְהָר
  english_pob_choice: new wine and oil
  chosen_korean: 새 포도주와 기름
  alternatives_korean:
  - 새 포도주와 새 기름
  - 포도주와 올리브 기름
  lexicon: HALOT
  rationale: תִּירוֹשׁ은 새 포도주, יִצְהָר은 산물로서의 기름을 뜻하므로 ‘새 포도주와 기름’이 원문 어휘를 과도하게 풀지 않으면서도 한국어로 자연스럽습니다.
theological_decisions:
- issue: 풍요의 회복을 농업 이미지로 유지할지 여부
  chosen_reading: 추상화하지 않고 타작마당, 포도즙 틀, 새 포도주, 기름의 농경 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 하나님의 공급이 풍성하다는 식으로 의미를 일반화할 수 있습니다.
  rationale: 이 절은 회복의 축복을 구체적인 수확과 생산물의 충만으로 제시하므로, 이미지를 일반화하면 예언적 생동감이 약해집니다.
  doctrine_reference: 예언서의 상징적 풍요 묘사
