  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/פָנָי/ו֙ רָ֣גְזָה אֶ֔רֶץ רָעֲשׁ֖וּ שָׁמָ֑יִם שֶׁ֤מֶשׁ וְ/יָרֵ֨חַ֙ קָדָ֔רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/010.yaml
  text: Before him the earth quakes[a]; the heavens tremble. The sun and the moon grow dark[b], and the stars withdraw their brightness.
  footnotes:
  - marker: a
    text: Or 'At his presence the earth trembles.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the stars gather in their brightness,' that is, they withdraw their light.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 앞에서 땅은 떨리고 하늘은 진동합니다. 해와 달은 어두워지고[a], 별들은 자기 빛을 거두어들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 임재에서 땅이 떤다’는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְפָנָיו
  english_pob_choice: Before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그의 임재 앞에서
  - 그 앞에
  - 그 앞에서, 그 존재 앞에서
  lexicon: HALOT
  rationale: לְפָנָיו의 관계적·공간적 의미를 자연스러운 한국어로 살리되, ‘임재’처럼 해석을 과잉 고정하지 않았습니다.
- source_word: רָגְזָה אֶרֶץ / רָעֲשׁוּ שָׁמָיִם
  english_pob_choice: the earth quakes / the heavens tremble
  chosen_korean: 땅은 떨리고 하늘은 진동합니다
  alternatives_korean:
  - 땅은 흔들리고 하늘은 떨립니다
  - 땅은 요동하고 하늘은 떨립니다
  lexicon: HALOT
  rationale: 병행 구조를 살려 두 동사를 구분했고, ‘진동합니다’로 하늘의 장엄한 동요를 조금 더 강하게 드러냈습니다.
- source_word: שֶׁמֶשׁ וְיָרֵחַ קָדָרוּ
  english_pob_choice: The sun and the moon grow dark
  chosen_korean: 해와 달은 어두워지고
  alternatives_korean:
  - 해와 달은 캄캄해지고
  - 해와 달은 그늘지며
  lexicon: HALOT
  rationale: קָדָרוּ의 ‘어두워지다/흑암해지다’ 의미를 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: וְכוֹכָבִים אָסְפוּ נָגְהָם
  english_pob_choice: the stars withdraw their brightness
  chosen_korean: 별들은 자기 빛을 거두어들입니다
  alternatives_korean:
  - 별들은 빛을 거둡니다
  - 별들은 자기 광채를 거둬들입니다
  - 별들은 빛을 접습니다
  lexicon: HALOT
  rationale: אָסְפוּ의 ‘모으다/거두다’ 관용을 살리면서, נָגְהָם을 ‘빛’으로 풀어 별빛이 사라지는 장면을 드러냈습니다.
theological_decisions:
- issue: 우주적 흔들림의 범위
  chosen_reading: 이 구절의 우주적 혼란 이미지를 그대로 살려, 단순한 비유나 특정 종말론 체계로 환원하지 않았습니다.
  alternative_readings:
  - 침공 공포를 묘사하는 순수한 비유로 축소
  - 명시적인 종말 예언으로 단정
  rationale: 예언시의 장엄함과 해석의 여지를 보존하는 것이 원문의 긴장을 가장 잘 반영합니다.
  doctrine_reference: 예언적 이미지의 중의성을 보존
