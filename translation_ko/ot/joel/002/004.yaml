base_translation:
  language: en
  yaml_path: translation/ot/joel/002/004.yaml
  text: Their appearance is like the appearance of horses[a], and like horsemen[b], so they run.
  footnotes:
  - marker: a
    text: Or 'its appearance is like the appearance of horses.' The Hebrew uses a singular suffix ('his/its appearance'), but the referent is collective, so English may render it collectively as 'their appearance.'
    reason: lexical_alternative
  - marker: b
    text: '''Horsemen'' may also be rendered ''mounted riders'' or ''cavalry.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 모습은 말들의 모습과 같고, 기마병들 같으므로, 그렇게 달려갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 접미사를 사용하지만, 문맥상 집합체를 가리키므로 한국어에서는 복수로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기마병들’은 ‘말탄 사람들’ 또는 ‘기병들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְאֵה / מַרְאֵהוּ
  english_pob_choice: like the appearance of / their appearance
  chosen_korean: 그들의 모습은 … 모습과 같고
  alternatives_korean:
  - 그들의 외양은 … 외양과 같고
  - 그들의 모양은 … 모양과 같고
  lexicon: HALOT
  rationale: מַרְאֶה는 눈에 보이는 겉모습을 가리키므로 ‘모습’으로 옮겨 반복되는 비교 구조를 살렸습니다. 영어 POB의 collective reading도 한국어에서는 자연스럽게 ‘그들의 모습’으로 반영했습니다.
- source_word: סוּסִים
  english_pob_choice: horses
  chosen_korean: 말들
  alternatives_korean:
  - 말
  - 군마들
  lexicon: HALOT
  rationale: 직역 가능한 일반 명사로서 ‘말들’이 가장 자연스럽고, 군사적 비유를 해치지 않으면서도 원문의 기본 의미를 유지합니다.
- source_word: וּכְפָרָשִׁים
  english_pob_choice: and like horsemen
  chosen_korean: 기마병들 같고
  alternatives_korean:
  - 말탄 사람들 같고
  - 기병들 같고
  lexicon: HALOT
  rationale: פָּרָשִׁים는 단순한 ‘타는 사람’보다 군사적 성격이 분명하므로, 한국어에서는 ‘기마병들’이 이미지와 병렬을 가장 잘 드러냅니다.
- source_word: יְרוּצוּן
  english_pob_choice: they run
  chosen_korean: 그렇게 달려갑니다
  alternatives_korean:
  - 그렇게 달립니다
  - 그렇게 달려옵니다
  lexicon: HALOT
  rationale: רוץ의 기본 뜻인 ‘달리다’를 유지하되, 앞의 비유가 묘사하는 돌진성을 살리기 위해 ‘달려갑니다’를 택했습니다. ‘그렇게’는 כֵּן의 비교 결과를 자연스럽게 받습니다.
theological_decisions:
- issue: 집합적 주어의 수 표현
  chosen_reading: 영어 POB의 collective singular 해석을 따라, 단수 접미사의 흔적을 살리기보다 한국어에서는 복수 주어 ‘그들의 모습’으로 옮겼습니다.
  alternative_readings:
  - 그것의 모습은 말들의 모습과 같고
  - 그의 모습은 말들의 모습과 같고
  rationale: 문맥상 침략 무리는 집합체로 묘사되며, 한국어에서는 ‘그것/그의’보다 복수 지시가 독자에게 더 분명합니다. 다만 설명은 생략하되 본문 의미는 유지합니다.
  doctrine_reference: 본문 문법과 집합적 지시 대상의 재현
