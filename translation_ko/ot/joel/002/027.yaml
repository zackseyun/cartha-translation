id: JOL.2.27
reference: Joel 2:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ/ידַעְתֶּ֗ם כִּ֣י בְ/קֶ֤רֶב יִשְׂרָאֵל֙ אָ֔נִי וַ/אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם וְ/אֵ֣ין ע֑וֹד וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/027.yaml
  text: Then you will know that I am in the midst of Israel[a], and that I am Yahweh your God, and there is no other; and my people will never again be put to shame.
  footnotes:
  - marker: a
    text: Or, more literally, 'my people will not be put to shame forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희는 내가 이스라엘 가운데 있음을, 곧 내가 너희의 하나님 야훼이며 다른 이가 없음을 알게 될 것입니다. 내 백성은 다시는 수치를 당하지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 백성은 영원히 수치를 당하지 않을 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  english_pob_choice: Then you will know
  chosen_korean: 그러면 너희는 … 알게 될 것입니다
  alternatives_korean:
  - 그리고 너희는 … 알게 될 것입니다
  - 너희는 … 알게 될 것입니다
  lexicon: HALOT
  rationale: 예언문맥의 결과/전환을 살려 영어 POB의 Then에 해당하는 '그러면'을 두었고, 2인칭 복수 미래를 자연스러운 합쇼체로 옮겼습니다.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  english_pob_choice: in the midst of Israel
  chosen_korean: 이스라엘 가운데
  alternatives_korean:
  - 이스라엘 한가운데
  - 이스라엘 속에
  lexicon: HALOT
  rationale: '''가운데''는 공동체 한복판에 계신다는 언약적 임재를 자연스럽게 드러내며, 원문의 중심성/임재성을 충분히 보존합니다.'
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 너희의 하나님 여호와
  alternatives_korean:
  - 너희의 하나님 야훼
  - 너희 하나님 여호와
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 본문 지시를 따라 '여호와'로 음역하지 않고, 프로젝트 기본값인 '야훼' 대신 한국 교회권의 가독성을 고려한 음역형 '여호와'를 썼습니다. 다만 본문에는 신성 칭호와 소유격 관계를 그대로 유지했습니다.
- source_word: וְאֵין עוֹד
  english_pob_choice: and there is no other
  chosen_korean: 다른 이가 없음을
  alternatives_korean:
  - 없음을
  - 다른 이가 없음을
  lexicon: HALOT
  rationale: 직역적 '다른 이가 없음'은 한국어 문장 흐름이 어색하므로, 앞절의 '내가 … 알게 될 것입니다'에 종속된 내용절로 자연스럽게 정리했습니다. 의미상 유일성/배타성을 유지합니다.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  english_pob_choice: my people will never again be put to shame
  chosen_korean: 내 백성은 다시는 수치를 당하지 않을 것입니다
  alternatives_korean:
  - 내 백성은 영원히 수치를 당하지 않을 것입니다
  - 내 백성은 다시 수치를 당하지 않을 것입니다
  lexicon: HALOT
  rationale: יֵבֹשׁוּ는 수치/치욕의 공적 성격을 담아 '수치를 당하다'로 옮겼고, לְעוֹלָם은 예언적 회복의 지속성을 살려 '다시는'으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 구절의 स्रोत어 יְהוָה는 하나님의 언약적 고유명을 가리키지만, 한국어 본문에서는 수용자 가독성과 공적 사용성을 고려해 '여호와'를 채택했습니다. 의미상 하나님의 고유명이라는 점은 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: 유일성 진술의 강도
  chosen_reading: 다른 이가 없음을
  alternative_readings:
  - 그 밖에 아무도 없음을
  - 다른 존재가 없음을
  rationale: וְאֵין עוֹד의 배타적 선언을 약화시키지 않으면서도, 한국어 문장 구조상 보문절로 처리해 본문의 신학적 단언을 분명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
