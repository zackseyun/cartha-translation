  to: 그러면 너희는 내가 이스라엘 가운데 있음을, 곧 내가 너희의 하나님 야훼이며 다른 이가 없음을 알게 될 것입니다. 내 백성은 다시는 수치를 당하지 않을 것입니다.[a]
