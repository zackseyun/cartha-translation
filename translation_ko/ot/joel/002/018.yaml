id: JOL.2.18
reference: Joel 2:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְקַנֵּ֥א יְהוָ֖ה לְ/אַרְצ֑/וֹ וַ/יַּחְמֹ֖ל עַל עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/018.yaml
  text: Then Yahweh became jealous for his land and had compassion on his people[a].
  footnotes:
  - marker: a
    text: Or, "was zealous for his land." The Hebrew verb can express either jealousy or zeal; here it denotes the LORD's ardent covenant concern for what is his.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서는 자기의 땅을 두고 질투하시고 자기 백성을 불쌍히 여기셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기의 땅을 두고 열심을 내셨습니다.” 히브리어 동사 קנא는 질투와 열심을 모두 나타낼 수 있는데, 여기서는 야훼께서 자기의 것에 대해 보이시는 언약적 관심을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנֵּא / became jealous
  english_pob_choice: became jealous
  chosen_korean: 질투하시고
  alternatives_korean:
  - 열심을 내시고
  - 열정적으로 돌보시고
  - 질투하셨습니다
  lexicon: HALOT
  rationale: 하나님께 쓰인 קנא의 언약적·소유권적 뉘앙스를 살리기 위해 ‘질투하다’를 택했습니다. ‘열심’은 의미를 완화할 수 있어 본문의 긴장감을 덜 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 계약적 고유명사인 여호와의 이름을 표제어로 드러내기 위해 ‘야훼’로 옮겼습니다. 이는 본문에서 титул이 아니라 신적 이름을 보존하는 선택입니다.
- source_word: לְאַרְצוֹ / for his land
  english_pob_choice: for his land
  chosen_korean: 자기의 땅을 두고
  alternatives_korean:
  - 자기 땅을 위하여
  - 자기의 땅을 향하여
  - 자기의 나라를 두고
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 추상적 ‘국가’보다 언약적 소속을 지닌 ‘땅’이 자연스럽습니다. ‘~을 두고’는 לְ의 대상성과 קנא와의 결합을 한국어로 살린 표현입니다.
- source_word: וַיַּחְמֹל / had compassion
  english_pob_choice: had compassion
  chosen_korean: 불쌍히 여기셨습니다
  alternatives_korean:
  - 긍휼히 여기셨습니다
  - 가엾게 여기셨습니다
  - 불쌍히 여기셨다
  lexicon: HALOT
  rationale: חמל의 핵심은 불쌍히 여겨 아끼는 마음과 그에 따른 자비입니다. 현대 한국어에서 가장 직접적이고 자연스럽게 그 정서를 드러내는 표현으로 ‘불쌍히 여기셨습니다’를 택했습니다.
theological_decisions:
- issue: 하나님의 ‘질투’와 ‘긍휼’의 병렬
  chosen_reading: 야훼께서는 자기의 땅을 두고 질투하시고 자기 백성을 불쌍히 여기셨습니다.
  alternative_readings:
  - 야훼께서는 자기의 땅을 두고 열심을 내시고 자기 백성을 불쌍히 여기셨습니다.
  rationale: קנא의 의미를 ‘열심’으로만 좁히지 않고, 언약적 소유와 배타적 사랑의 긴장을 드러내기 위해 ‘질투하시고’를 본문에 유지했습니다. 이는 하나님의 거룩한 소유권과 회복 의지를 함께 보존합니다.
  doctrine_reference: 언약적 질투/거룩한 사랑의 병존; 의미 범위 보존
