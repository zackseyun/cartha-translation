    text: 히브리어 관용구로, 직역하면 ‘크게 행하다’이며 문맥상 ‘큰일을 하다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 말고
  alternatives_korean:
  - 무서워하지 말고
  - 두려워 말고
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지 명령을 자연스러운 현대 한국어로 옮겼습니다. ‘두려워하지 말고’는 간결하면서도 예언적 호소의 어조를 살립니다.
- source_word: אֲדָמָה
  english_pob_choice: O land
  chosen_korean: 땅아
  alternatives_korean:
  - 땅이여
  - 토지여
  - 대지여
  lexicon: HALOT
  rationale: 이 표현은 의인화된 땅을 부르는 호격이므로 ‘땅아’로 옮겼습니다. ‘땅’은 농경·영토적 문맥을 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: גִּילִי וּשְׂמָחִי
  english_pob_choice: rejoice and be glad
  chosen_korean: 기뻐하며 즐거워하십시오
  alternatives_korean:
  - 기뻐하고 즐거워하십시오
  - 환호하며 즐거워하십시오
  lexicon: HALOT
  rationale: 두 명령형을 구분해 병렬의 강화 효과를 살렸습니다. ‘기뻐하다’와 ‘즐거워하다’를 함께 써서 단순 반복을 피하고 시적 평행법을 유지했습니다.
- source_word: הִגְדִּיל יְהוָה לַעֲשׂוֹת
  english_pob_choice: has done great things
  chosen_korean: 큰일을 행하셨기 때문입니다
  alternatives_korean:
  - 크게 행하셨기 때문입니다
  - 큰일들을 이루셨기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 직역보다 ‘큰일을 행하다’가 의미를 더 정확하게 드러냅니다. 완료형은 원문의 성취를 반영하여 ‘행하셨기 때문입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 원문에 있는 신성4문자 יְהוָה는 주어의 인격적 이름이므로 직함 대신 ‘야훼’로 옮겼습니다. 이는 POB의 본문 원칙과 일치합니다.
theological_decisions:
- issue: 여호와(הִגְדִּיל יְהוָה)의 이름 표기
  chosen_reading: 야훼를 본문에 직접 표기하여, 하나님이 이스라엘에게 계시하신 언약적 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문은 단순한 호칭이 아니라 고유한 신적 이름을 사용합니다. 따라서 한국어 전통의 대체 표현보다 स्रोत 직해를 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
