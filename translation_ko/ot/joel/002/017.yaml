review_pass:
  verdict: revise
  source_fidelity: 본문은 제사장들의 탄원, 야훼의 이름, ‘유업’, 그리고 מָשָׁל의 주된 문맥상 의미인 공적 조롱을 대체로 충실히 옮깁니다. 다만 마지막 לָמָּה יֹאמְרוּ는 ‘말하지 않게 하소서’보다 ‘어찌하여 ... 말하게 하시겠습니까?’라는 수사적 물음으로 드러내는 편이 원문의 논증적 탄원을 더 정확히 보존합니다. 또한 לִמְשָׁל בָּם גּוֹיִם에는 ‘조롱의 말거리’와 ‘나라들이 그들을 다스림’이라는 해석 가능성이 있으므로, 선택한 본문 의미를 유지하되 대안은 각주로 밝혀야 합니다.
  naturalness: ‘야훼를 섬기는 제사장들’, ‘성전 현관과 제단 사이’, ‘조롱거리가 되게 하지 마소서’는 현대 표준어 합쇼체에서 자연스럽고 예배·예언서 문맥에 알맞습니다. 마지막 문장을 수사 의문문으로 고치면 기도문의 호소력이 자연스럽게 살아납니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. מְשָׁרְתֵי יְהוָה는 일반적인 ‘이들’보다 직분을 분명히 하는 ‘야훼를 섬기는 제사장들’로 옮겼습니다. אוּלָם은 ‘성전 현관’으로 명료하게 번역하고, מָשָׁל의 문맥상 의미는 ‘조롱거리’로 유지했습니다.
  issues:
  - severity: medium
    issue: 마지막 수사적 물음이 청원문으로 평탄화됨
    rationale: לָמָּה יֹאמְרוּ בָעַמִּים은 직역하면 ‘어찌하여 민족들 사이에서 그들이 말하겠습니까?’라는 수사적 호소입니다. ‘말하지 않게 하소서’도 의도는 전달하지만 원문의 물음 형식과 논증을 약화합니다.
  - severity: medium
    issue: לִמְשָׁל בָּם גּוֹיִם의 대안 해석에 대한 각주가 없음
    rationale: 문맥상 ‘나라들 가운데 조롱거리/말거리’가 적절하지만, 이 구절은 ‘나라들이 그들을 다스리게’로도 해석되어 왔습니다. 논쟁적 모호성을 숨기지 않도록 해당 구절에 각주 표지를 두어야 합니다.
  - severity: low
    issue: ‘주랑’은 현대 독자에게 건축 위치가 다소 불명확함
    rationale: אוּלָם은 성전의 입구 홀·현관을 가리킵니다. ‘성전 현관’은 현대어에서 더 즉시 이해되며, 각주로 ‘주랑/포르티코’ 대안을 제시할 수 있습니다.
  revised_text: 야훼를 섬기는 제사장들은 성전 현관과 제단 사이에서 울며 이렇게 말해야 합니다. 「야훼여, 주의 백성을 불쌍히 여기시고, 주의 유업이 수치와 조롱거리가 되게 하지 마소서.[a] 어찌하여 민족들 사이에서 ‘그들의 하나님이 어디 있느냐?’ 하고 말하게 하시겠습니까?」
  revised_footnotes:
