  - marker: b
    text: ‘성전 현관’은 성전 입구의 홀 또는 주랑(포르티코)을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 마지막 절을 원문의 수사적 질문으로 회복하고, 해석상 논의되는 לִמְשָׁל בָּם גּוֹיִם의 대안을 본문 의미를 변경하지 않는 각주로 보존했습니다. ‘성전 현관’을 채택해 אוּלָם의 건축적 의미를 현대 한국어로 명료하게 했습니다.
