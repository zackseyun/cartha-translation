    text: 또는 ‘주의 유업을 수치에 넘기시어 나라들이 그들을 다스리게 하지 마소서.’ 히브리어 표현은 나라들 사이에서 조롱의 말거리가 되는 뜻 또는 외국 나라들의 지배에 넘겨지는 뜻으로 이해될 수 있습니다. 이 문맥에서는 뒤따르는 조롱의 질문 때문에 조롱의 말거리라는 뜻이 더 적절합니다.
