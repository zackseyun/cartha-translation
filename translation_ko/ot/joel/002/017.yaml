base_translation:
  language: en
  yaml_path: translation/ot/joel/002/017.yaml
  text: Let the priests[a], the ministers of Yahweh, weep between the portico and the altar, and let them say, “Spare your people, Yahweh, and do not make your inheritance a reproach, a byword among the nations. Why should they say among the peoples[b], ‘Where is their God?’”
  footnotes:
  - marker: a
    text: Or, 'between the vestibule and the altar' or 'between the porch and the altar.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'do not give your inheritance over to disgrace, for the nations to rule over them.' The Hebrew phrase may be understood either as becoming a mocking byword or as being handed over to foreign domination; the context here favors the sense of public taunt.
    reason: alternative_reading
translation:
  language: ko
  text: 제사장들, 곧 야훼를 섬기는 이들이 주랑과 제단 사이에서 울게 하십시오. 그들이 이렇게 말하게 하십시오. 「야훼여, 주의 백성을 불쌍히 여기시고, 주의 유업을 수치가 되게 하지 마시며, 나라들 가운데에서 조롱거리가 되게 하지 마소서. 민족들 사이에서 ‘그들의 하나님이 어디 있느냐?’ 하고 말하지 않게 하소서」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주랑’은 성전 건축 맥락의 ‘포르티코/현관’을 옮긴 말입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: בֵּין הָאוּלָם וְלַמִּזְבֵּחַ
  english_pob_choice: between the portico and the altar
  chosen_korean: 주랑과 제단 사이
  alternatives_korean:
  - 현관과 제단 사이
  - 포르티코와 제단 사이
  lexicon: HALOT
  rationale: אוּלָם은 성전의 출입부를 가리키는 건축 용어이므로, 한국어로는 자연스럽고 격식 있는 ‘주랑’이 가장 가까우며 예배 공간의 대비도 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 일반 호칭이 아니라 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 하나님 이름의 직접성을 보존했습니다.
- source_word: לִמְשָׁל בָּם גּוֹיִם
  english_pob_choice: a byword among the nations
  chosen_korean: 나라들 가운데에서 조롱거리가 되게
  alternatives_korean:
  - 나라들 가운데에서 속담이 되게
  - 나라들 가운데에서 통치받게
  lexicon: HALOT
  rationale: 여기서 מָשָׁל은 지배가 아니라 조롱성 있는 말거리/속담의 뜻이므로, ‘조롱거리’로 옮겨 문맥의 수치와 타자의 조소를 드러냈습니다.
- source_word: בָעַמִּים / גּוֹיִם
  english_pob_choice: among the peoples / among the nations
  chosen_korean: 나라들 가운데에서 / 민족들 사이에서
  alternatives_korean:
  - 열국 가운데에서 / 백성들 사이에서
  - 이방 민족들 가운데에서
  lexicon: HALOT
  rationale: 두 표현을 구분해 번역해 히브리어의 병렬을 살렸습니다. 첫 번째는 국가들, 마지막은 더 넓은 ‘민족들’의 뉘앙스로 보았습니다.
theological_decisions:
- issue: 야훼의 이름을 직접 부르는 기도문의 어조
  chosen_reading: 한국어 본문에서도 직접 호칭형 기도문으로 유지했습니다.
  alternative_readings:
  - 주여로 완화해 번역
  - 서술형으로 바꾸어 간접화
  rationale: 히브리어는 공동체의 절박한 탄원으로서 하나님의 이름을 직접 부르므로, 한국어에서도 그 긴박한 청원을 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: divine name and direct address'
