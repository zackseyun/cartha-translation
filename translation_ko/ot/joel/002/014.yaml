  source_fidelity: ‘돌이켜서 뜻을 돌이키시고’는 שוב와 נחם의 연쇄를 반영하려는 의도는 있으나, 한국어에서는 같은 어근의 반복처럼 들립니다. 또한 ‘그분 뒤에 복되게 하실 것을 남기실지’는 בְּרָכָה(복) 및 ‘남기다’의 목적어 관계를 정확하고 자연스럽게 나타내지 못합니다. 수정문은 불확실성(‘누가 알겠습니까?’), 심판에서의 전환, 그리고 남겨지는 구체적 복인 소제와 전제를 보존합니다.
  naturalness: ‘그분께서 돌이켜 뜻을 거두시고, 그 뒤에 복, 곧 … 소제와 전제를 남기실지’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 히브리어의 수사적 질문 아래 이어지는 가능성을 명료하게 표현합니다. 복수 2인칭은 ‘당신들의’보다 직접 호칭인 ‘너희’가 더 자연스럽습니다.
  terminology: ‘야훼’, ‘소제’, ‘전제’는 원문의 신명과 제의 용어를 충실히 반영합니다. מִנְחָה가 이 문맥에서 특히 곡식제물을 뜻할 수 있다는 각주는 ‘소제’ 바로 뒤에 두어 앵커와 대상어를 일치시켰습니다.
