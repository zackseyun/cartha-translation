base_translation:
  language: en
  yaml_path: translation/ot/joel/002/014.yaml
  text: Who knows? He may turn and relent[a], and leave behind him a blessing—an offering and a drink offering for Yahweh your God.
  footnotes:
  - marker: a
    text: Or “a grain offering and a drink offering.” The Hebrew מִנְחָה often refers specifically to a grain offering in sacrificial contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 알겠습니까? 그분께서 돌이켜 뜻을 거두시고, 그 뒤에 복, 곧 너희 하나님 야훼께 드릴 소제[a]와 전제를 남기실지 누가 알겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소제’로 옮긴 히브리어 מִנְחָה는 제의 문맥에서 특히 ‘곡식제물’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ֥י יוֹדֵ֖עַ
  english_pob_choice: Who knows?
  chosen_korean: 누가 알겠습니까?
  alternatives_korean:
  - 아무도 알 수 없습니다
  - 누가 알 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 불확실성을 한국어의 자연스러운 질문형으로 살리되, 예언적 긴장을 유지했습니다.
- source_word: יָשׁוּב וְנִחָם
  english_pob_choice: turn and relent
  chosen_korean: 돌이켜서 뜻을 돌이키시고
  alternatives_korean:
  - 돌이켜서 애곡하시고
  - 돌이켜서 후회하시고
  - 돌이켜서 마음을 바꾸시고
  lexicon: HALOT
  rationale: שוב과 נחם의 결합을 단순한 위치 이동이 아니라 심판 선언의 전환으로 읽어, 하나님의 판단적 조치가 누그러지는 의미를 한국어로 전달했습니다.
- source_word: מִנְחָה וָנֶסֶךְ
  english_pob_choice: an offering and a drink offering
  chosen_korean: 소제와 전제
  alternatives_korean:
  - 곡식제물과 전제
  - 곡식제물과 술제물
  - 제물과 전제
  lexicon: HALOT
  rationale: 문맥상 מִנְחָה는 제의적 ‘소제’가 가장 정확하며, וָנֶסֶךְ는 전통적 제의 용어인 ‘전제’가 स्रोत의 제의적 병렬을 가장 분명하게 드러냅니다.
- source_word: לַ/יהוָה אֱלֹהֵי/כֶם
  english_pob_choice: for Yahweh your God
  chosen_korean: 야훼 당신들의 하나님께
  alternatives_korean:
  - 야훼 너희 하나님께
  - 주 너희 하나님께
  - 여호와 당신들의 하나님께
  lexicon: HALOT
  rationale: 본문의 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 공동체적 직접 호칭의 복수 2인칭은 공손하지만 복수성을 지닌 ‘당신들의’로 살렸습니다.
theological_decisions:
- issue: 하나님의 ‘돌이키심’과 인간적 후회 표현의 긴장
  chosen_reading: ‘뜻을 돌이키시고’로 번역해, 하나님이 잘못을 시인하신다는 뜻이 아니라 경고된 심판을 유보하실 수 있다는 예언적 긴장을 보존했습니다.
  alternative_readings:
  - 마음을 바꾸시고
  - 후회하시고
  - 자비를 베푸시고
  rationale: ח נחם은 예언문맥에서 심판의 철회를 가리키는 관용적 표현이므로, 하나님의 무오성과 긴장을 해소하지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장 보존)
