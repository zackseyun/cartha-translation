base_translation:
  language: en
  yaml_path: translation/ot/joel/002/006.yaml
  text: Before him peoples writhe[b][a]; all faces grow pale.
  footnotes:
  - marker: a
    text: Or 'At his presence, peoples are in anguish.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all faces gather פָארוּר,' an idiom commonly understood to mean that faces turn pale.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 앞에서 민족들이 몸부림치고[a], 모든 얼굴이 창백해집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 나타나실 때 민족들이 고통합니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘모든 얼굴이 פָארוּר를 모은다’는 식의 표현으로, 일반적으로 얼굴이 창백해진다는 관용으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפָּנָיו
  english_pob_choice: Before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그의 앞에서
  - 그 앞에
  lexicon: HALOT
  rationale: מִן + פָּנִים의 관용구를 자연스러운 한국어로 옮기되, 특정 대상을 단정하지 않고 문맥의 인칭적 대립감을 살리기 위해 ‘그 앞에서’로 처리했습니다.
- source_word: יָחִילוּ
  english_pob_choice: writhe
  chosen_korean: 몸부림치고
  alternatives_korean:
  - 고통으로 몸부림치고
  - 떨고
  - 괴로워하며
  lexicon: HALOT
  rationale: 이 동사는 떨림보다 신체적 고통과 격심한 동요를 더 강하게 드러내므로, 합쇼체 문맥에서 자연스러운 ‘몸부림치다’로 살렸습니다.
- source_word: כָּל פָּנִים
  english_pob_choice: all faces
  chosen_korean: 모든 얼굴이
  alternatives_korean:
  - 모든 낯이
  - 온 얼굴이
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 그대로 살려 ‘모든 얼굴’로 옮겼습니다. ‘얼굴’은 뒤의 색 변화 표현과도 잘 맞습니다.
- source_word: פָארוּר
  english_pob_choice: grow pale / paleness
  chosen_korean: 창백해집니다
  alternatives_korean:
  - 하얘집니다
  - 창백함을 띱니다
  - 색이 사라집니다
  lexicon: HALOT
  rationale: 희귀 어휘지만 문맥상 공포로 인한 탈색, 즉 창백함을 가리키는 관용으로 이해하는 것이 가장 자연스럽습니다. 한국어에서는 상태 변화를 분명히 보여 주는 ‘창백해집니다’가 적절합니다.
theological_decisions:
- issue: מִפָּנָיו의 3인칭 단수 지시 대상
  chosen_reading: ‘그’로 번역하여, 앞선 재난의 주체가 누구인지 확정하지 않고 모호성을 유지했습니다.
  alternative_readings:
  - 여호와 앞에서
  - 그것 앞에서
  - 그분 앞에서
  rationale: 문맥상 주체를 여호와, 침공 세력, 또는 ‘그 날’로 좁힐 수 있으므로, 해석을 앞서 고정하지 않고 히브리어의 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
