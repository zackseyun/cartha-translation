source:
  edition: WLC
  text: וְֽ/אֶת הַ/צְּפוֹנִ֞י אַרְחִ֣יק מֵ/עֲלֵי/כֶ֗ם וְ/הִדַּחְתִּי/ו֮ אֶל אֶ֣רֶץ צִיָּ֣ה וּ/שְׁמָמָה֒ אֶת פָּנָ֗י/ו אֶל הַ/יָּם֙ הַ/קַּדְמֹנִ֔י וְ/סֹפ֖/וֹ אֶל הַ/יָּ֣ם הָ/אַֽחֲר֑וֹן וְ/עָלָ֣ה בָאְשׁ֗/וֹ וְ/תַ֨עַל֙ צַחֲנָת֔/וֹ כִּ֥י הִגְדִּ֖יל לַ/עֲשֽׂוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/020.yaml
  text: And I will remove the northerner far from you[a], and I will drive him into a dry and desolate land, his front into the eastern sea and his rear into the western sea; his stench will rise, and his foul smell will rise[c][b], because he has done great things.
  footnotes:
  - marker: a
    text: 'Or, ''the northern army.'' Hebrew: ''the northerner,'' a singular, personified expression.'
    reason: lexical_alternative
  - marker: b
    text: '''The eastern sea'' likely refers to the Dead Sea, and ''the western sea'' to the Mediterranean Sea.'
    reason: cultural_note
  - marker: c
    text: Or, 'because he has acted arrogantly.' The Hebrew idiom is literally 'because he has done great things,' which here likely carries a negative sense from the context.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 북쪽 사람을 너희에게서 멀리 제거하고, 그를 메마르고 황폐한 땅으로 몰아내며, 그의 앞은 동쪽 바다로, 그의 뒤는 서쪽 바다로 가게 하겠습니다. 그의 악취가 올라오고, 그의 고약한 냄새가 올라올 것입니다. 이는 그가 큰일을 행하였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수로 된 인격화 표현인 ‘북쪽 사람’을 씁니다. 문맥상 북에서 오는 침입 세력 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘동쪽 바다’는 아마 사해를, ‘서쪽 바다’는 지중해를 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그가 교만하게 행동하였기 때문입니다’. 히브리어 관용구는 문자적으로는 ‘그가 큰일을 행하였다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצְּפוֹנִי
  english_pob_choice: the northerner
  chosen_korean: 북쪽 사람
  alternatives_korean:
  - 북쪽 자
  - 북사람
  - 북쪽의 자
  lexicon: HALOT
  rationale: 히브리어 단수 표현과 인격화된 대상을 살리되, 한국어에서는 '북쪽 사람'이 가장 자연스럽고 몸통을 갖춘 단수 인물을 유지합니다.
- source_word: אַרְחִיק
  english_pob_choice: I will remove ... far
  chosen_korean: 멀리 제거하고
  alternatives_korean:
  - 멀리 치워 버리고
  - 멀리 두고
  - 멀리 옮기고
  lexicon: HALOT
  rationale: 사역형의 '멀게 하다/멀리하다'와 제거의 동작을 함께 드러내기 위해 '멀리 제거하다'를 택했습니다.
- source_word: אֶרֶץ צִיָּה וּשְׁמָמָה
  english_pob_choice: a dry and desolate land
  chosen_korean: 메마르고 황폐한 땅
  alternatives_korean:
  - 건조하고 황폐한 땅
  - 메마르고 황량한 땅
  - 바짝 마른 황무지
  lexicon: HALOT
  rationale: צִיָּה의 건조함과 שְׁמָמָה의 황폐함을 간결하게 살리기 위해 '메마르고 황폐한 땅'으로 옮겼습니다.
- source_word: הַיָּם הַקַּדְמֹנִי / הַיָּם הָאַחֲרוֹן
  english_pob_choice: the eastern sea / the western sea
  chosen_korean: 동쪽 바다 / 서쪽 바다
  alternatives_korean:
  - 동해 / 서해
  - 앞바다 / 뒷바다
  - 동쪽의 바다 / 서쪽의 바다
  lexicon: HALOT
  rationale: 히브리어의 방향 지시 표현을 본문에서 그대로 살려 지리적 해석을 과도하게 좁히지 않도록 했습니다.
- source_word: בָאְשׁוֹ / צַחֲנָתוֹ
  english_pob_choice: his stench / his foul smell
  chosen_korean: 악취 / 고약한 냄새
  alternatives_korean:
  - 구린내 / 심한 냄새
  - 악취 / 악한 냄새
  - 썩은 냄새 / 고약한 냄새
  lexicon: HALOT
  rationale: 서로 비슷한 두 명사를 한국어에서도 중복을 피하면서 병렬로 살려, 혐오스러운 냄새의 반복 강조를 유지했습니다.
- source_word: כִּי הִגְדִּיל לַעֲשׂוֹת
  english_pob_choice: because he has done great things
  chosen_korean: 이는 그가 큰일을 행하였기 때문입니다
  alternatives_korean:
  - 이는 그가 스스로를 크게 하였기 때문입니다
  - 이는 그가 교만하게 행동하였기 때문입니다
  - 이는 그가 엄청난 일을 저질렀기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문에서는 직역에 가깝게 유지하되, 문맥상 부정적 뉘앙스는 심판받는 대상이라는 흐름이 드러내도록 했습니다.
theological_decisions:
- issue: '''북쪽 사람''의 정체'
  chosen_reading: 특정 민족명으로 좁히지 않고, 인격화된 침입자/재앙의 주체로 유지합니다.
  alternative_readings:
  - 앗수르나 바벨론 같은 역사적 국가
  - 메뚜기 재앙의 의인화
  - 북쪽에서 오는 문자적 바람
  rationale: 본문 자체가 단수 인칭과 신체 이미지로 그려진 대상을 보여 주므로, 해석을 한쪽으로 고정하지 않고 원문의 인격화를 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve source-level ambiguity where the text does not resolve it.'
- issue: '''큰일을 행하였다''의 뉘앙스'
  chosen_reading: 본문에서는 히브리어 관용구를 유지하고, 문맥이 그 행위를 부정적으로 평가함을 그대로 드러냅니다.
  alternative_readings:
  - 교만하게 행하였다
  - 엄청난 해악을 저질렀다
  - 스스로를 크게 하였다
  rationale: 같은 관용구가 다른 문맥에서는 긍정적으로도 쓰이므로, 본문에서 이를 해설적으로 풀기보다 원형을 보존해 의미의 긴장을 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
