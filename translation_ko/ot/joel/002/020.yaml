- source_word: הַיָּם הַקַּדְמֹנִי / הַיָּם הָאַחֲרוֹן
  english_pob_choice: the eastern sea / the western sea
  chosen_korean: 동쪽 바다 / 서쪽 바다
  alternatives_korean:
  - 동해 / 서해
  - 앞바다 / 뒷바다
  - 동쪽의 바다 / 서쪽의 바다
  lexicon: HALOT
