- from: 내가 북쪽 사람을 너희에게서 멀리 제거하고, 그를 메마르고 황폐한 땅으로 몰아내며, 그의 앞은 동쪽 바다로, 그의 뒤는 서쪽 바다로 가게 하겠습니다. 그의 악취가 올라오고, 그의 고약한 냄새가 올라올 것입니다. 이는 그가 큰일을 행하였기 때문입니다.[a][b][c]
  to: 내가 북쪽의 자를[a] 너희에게서 멀리 물리치고, 그를 메마르고 황폐한 땅으로 몰아내겠습니다. 그의 앞부분은 동쪽 바다로, 뒷부분은 서쪽 바다로[b] 향하게 하겠습니다. 그의 악취가 올라오고, 그의 고약한 냄새가 올라올 것입니다. 이는 그가 큰일을 했기 때문입니다.[c]
  rationale: 원문의 단수 인격화와 정체의 모호성을 보존하기 위해 ‘북쪽 사람’을 ‘북쪽의 자’로 바꾸었습니다. 축출과 거리의 의미는 ‘멀리 물리치고’로 자연화했으며, 앞부분과 뒷부분이 서로 다른 바다를 향하는 이미지를 명료하게 했습니다. 마지막 관용구는 문맥상 부정적일 수 있으나 본문에서는 ‘큰일을 했다’로 유지하고 대안 해석을 각주에 두었습니다. 각주 표지도 해당 어구에 직접 연결했습니다.
