  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִסְפוּ עָ֞ם קַדְּשׁ֤וּ קָהָל֙ קִבְצ֣וּ זְקֵנִ֔ים אִסְפוּ֙ עֽוֹלָלִ֔ים וְ/יֹנְקֵ֖י שָׁדָ֑יִם יֵצֵ֤א חָתָן֙ מֵֽ/חֶדְר֔/וֹ וְ/כַלָּ֖ה מֵ/חֻפָּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/016.yaml
  text: Gather the people[a]; consecrate the assembly; gather the elders; gather the children, even the nursing infants. Let the bridegroom come out from his room[c][b], and the bride from her chamber.
  footnotes:
  - marker: a
    text: Or 'the old men' for 'the elders.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'those nursing at the breasts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from her canopy'; the Hebrew term can refer to a wedding canopy or bridal chamber.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성을 모으십시오. 회중을 거룩하게 구별하십시오. 장로들을[a] 모으고, 어린아이들을, 곧 젖먹이들까지 모으십시오. 신랑은 자기 방에서, 신부는 자기 신방에서[b] 나오게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나이 든 남자들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘후파’는 혼례 천막이나 덮개를 가리킬 수도 있고 신방을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ / עָם / קִבְצ֣וּ
  english_pob_choice: Gather the people / gather the elders
  chosen_korean: 백성들을 모으십시오 / 장로들을 모으고
  alternatives_korean:
  - 모으십시오
  - 불러 모으십시오
  - 집합시키십시오
  lexicon: HALOT
  rationale: 두 개의 명령형 동사를 모두 ‘모으다’로 살리되, 첫 항목은 대상이 되는 공동체를 ‘백성들’, 뒤의 항목은 ‘장로들’로 구분해 반복 명령의 긴박함을 자연스럽게 드러냈습니다.
- source_word: קַדְּשׁוּ קָהָל
  english_pob_choice: consecrate the assembly
  chosen_korean: 회중을 거룩하게 구별하십시오
  alternatives_korean:
  - 회중을 성별하십시오
  - 회중을 성화하십시오
  - 회중을 거룩하게 하십시오
  lexicon: HALOT
  rationale: קדשׁ의 성소적·의례적 ‘구별’ 의미를 살리기 위해 단순한 도덕적 ‘거룩하게 하다’보다 ‘거룩하게 구별하다’를 택했습니다. ‘회중’은 모인 공동체의 집합적 성격을 드러냅니다.
- source_word: עוֹלָלִים / יֹנְקֵי שָׁדָיִם
  english_pob_choice: the children, even the nursing infants
  chosen_korean: 아이들을, 곧 젖먹이들까지
  alternatives_korean:
  - 어린아이들을, 곧 젖먹이들까지
  - 유아들을, 곧 젖먹이들까지
  - 아이들을, 심지어 젖가슴을 빠는 아이들까지
  lexicon: HALOT
  rationale: עוֹלָלִים과 그 다음 구를 구분해, 더 넓은 ‘아이들’과 가장 어린 ‘젖먹이들’의 포괄성을 한국어로 자연스럽게 옮겼습니다. 직역적 표현은 가능하지만 한국어 공적 문체에서는 완곡한 ‘젖먹이들’이 적절합니다.
- source_word: חָתָן / כַלָּה / חֶדֶר / חֻפָּה
  english_pob_choice: the bridegroom ... from his room ... the bride ... from her chamber
  chosen_korean: 신랑은 자기 방에서, 신부는 자기 신방에서 나오게 하십시오
  alternatives_korean:
  - 신랑은 자기 방에서, 신부는 자기 혼인 천막에서 나오게 하십시오
  - 신랑은 자기 내실에서, 신부는 자기 혼례 처소에서 나오게 하십시오
  - 신랑은 자기 방에서, 신부는 자기 혼례방에서 나오게 하십시오
  lexicon: HALOT
  rationale: חֶדֶר는 일반적으로 ‘방/내실’, חֻפָּה는 혼례의 덮개나 신방을 가리킬 수 있어 문맥상 신랑·신부의 혼례 공간으로 이해하는 것이 자연스럽습니다. POB의 ‘from her chamber’와 같이 의미를 과도하게 좁히지 않으면서도 한국어 독자가 바로 이해할 수 있게 ‘신방’을 택했습니다.
theological_decisions:
- issue: 거룩하게 구별하라는 명령의 성격
  chosen_reading: ‘거룩하게 구별하십시오’로 번역해 의례적·언약적 소집의 긴장을 유지했습니다.
  alternative_readings:
  - 성별하십시오
  - 성화하십시오
  - 성결하게 하십시오
  rationale: 이 문맥은 단순 집회 공지가 아니라 금식과 회개를 위한 공적 소집입니다. לכן קדשׁ의 의미를 ‘구별’로 살려, 공동체를 하나님께 바쳐진 상태로 부르시는 강도를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 장로들의 사회적 지위
  chosen_reading: ‘장로들’로 번역해 연령보다 공동체 대표성에 초점을 두었습니다.
  alternative_readings:
  - 늙은 남자들
  - 노인들
  rationale: 본문은 백성, 회중, 아이들, 젖먹이들, 신랑과 신부까지 아우르는 총체적 소집을 말하므로, זְקֵנִים은 단순한 나이층보다 공동체의 대표자들을 가리키는 뜻이 강합니다.
  doctrine_reference: Translation philosophy §1
