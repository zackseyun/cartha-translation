    reason: lexical_alternative
translation:
  language: ko
  text: 내가 하늘과 땅에 이적들을 베풀겠으니 — 피와 불과 연기 기둥입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘연기 기둥들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will give
  chosen_korean: 내가 … 베풀겠으니
  alternatives_korean:
  - 내가 … 주겠으니
  - 내가 … 주겠습니다
  - 내가 … 보이겠으니
  lexicon: HALOT
  rationale: נתן의 기본 의미인 ‘주다/베풀다/두다’를 살리되, 예언문맥에서 ‘이적들을 베풀다’는 한국어로 자연스럽고 표적의 공적 제시를 잘 드러냅니다.
- source_word: מוֹפְתִים
  english_pob_choice: wonders
  chosen_korean: 이적들
  alternatives_korean:
  - 표적들
  - 놀라운 일들
  - 기이한 일들
  lexicon: HALOT
  rationale: מוֹפְתִים은 단순한 기적보다 경외를 일으키는 표징을 가리키므로, 한국어에서 성경적 용례가 분명한 ‘이적들’이 적절합니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘에
  - 하늘에서
  lexicon: HALOT
  rationale: 히브리어 복수형의 뉘앙스를 존중하되, 한국어에서는 ‘하늘에’보다 위치를 분명히 하는 ‘하늘과 땅에’가 병렬 구조를 가장 자연스럽게 살립니다.
- source_word: וְתִימֲרוֹת עָשָׁן
  english_pob_choice: columns of smoke
  chosen_korean: 연기 기둥
  alternatives_korean:
  - 연기 기둥들
  - 연기의 기둥
  - 연기 줄기
  lexicon: HALOT
  rationale: תימרות는 위로 치솟는 기둥 모양의 형상을 가리키므로, POB의 ‘columns of smoke’에 맞춰 직역성이 있는 ‘연기 기둥’으로 옮겼습니다.
theological_decisions:
- issue: 종말적 징조의 성격
  chosen_reading: 하늘과 땅에 나타나는 하나님의 심판/개입의 징조로서, 문자적·상징적 층위를 확정하지 않고 유지합니다.
  alternative_readings:
  - 순전한 자연현상으로 제한
  - 상징적 재난 이미지로만 이해
  rationale: 본문은 피와 불과 연기라는 강렬한 표징을 제시하지만, 그 정확한 발생 방식은 확정하지 않습니다. 번역은 이 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3
