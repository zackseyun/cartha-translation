  source_fidelity: 히브리어의 미래 동사 וְנָתַתִּי와 그 뒤의 동격적 목록은 대체로 반영되었으나, 초안의 대시 뒤 ‘피와 불과 연기 기둥입니다’는 현재의 서술문처럼 들려 원문의 미래 예언문과 목록의 관계를 흐립니다. תִּימֲרוֹת는 복수형이므로 ‘기둥들’로 나타내는 편이 안전합니다.
  naturalness: ‘내가 … 베풀겠으니 — …입니다’는 합쇼체 안에서도 문장 종결과 연결이 부자연스럽습니다. 목록을 ‘이적들, 곧 …’으로 동사에 직접 연결하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘이적들’은 מוֹפְתִים의 경이롭고 표징적인 성격을 적절히 보존합니다. ‘하늘과 땅’도 우주적 대조를 자연스럽게 전달합니다. ‘연기 기둥들’은 תִּימֲרוֹת עָשָׁן의 복수 및 형상을 충실히 옮깁니다.
