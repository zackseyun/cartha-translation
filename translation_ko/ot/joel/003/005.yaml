source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֧ל אֲשֶׁר יִקְרָ֛א בְּ/שֵׁ֥ם יְהוָ֖ה יִמָּלֵ֑ט כִּ֠י בְּ/הַר צִיּ֨וֹן וּ/בִ/ירוּשָׁלִַ֜ם תִּֽהְיֶ֣ה פְלֵיטָ֗ה כַּֽ/אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה וּ/בַ֨/שְּׂרִידִ֔ים אֲשֶׁ֥ר יְהוָ֖ה קֹרֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/005.yaml
  text: And it will happen that everyone who calls on the name of Yahweh will be delivered[a]; for on Mount Zion and in Jerusalem there will be escape, as Yahweh has said[c][b], among the survivors whom Yahweh calls.
  footnotes:
  - marker: a
    text: Or 'whoever calls upon the name of the LORD will escape.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'there will be פְלֵיטָה,' which can mean 'escape,' 'deliverance,' or 'escaped survivors/remnant.'
    reason: lexical_alternative
  - marker: c
    text: The verse holds together both human calling on the LORD and the survivors whom the LORD calls.
    reason: cross_reference
translation:
  language: ko
  text: 그러면 야훼의 이름을 부르는 모든 사람은 구원을 받을 것입니다[a]. 시온 산과 예루살렘에는 피할 길이 있을 것이니[c][b], 야훼께서 말씀하신 대로입니다. 살아남은 사람들 가운데, 야훼께서 부르시는 이들이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 이름을 부르는 누구든지 구원을 받을 것이다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘피할 길/피함/탈출’의 뜻인 פְלֵיטָה를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 야훼를 부르는 인간의 응답과, 살아남은 이들을 야훼께서 부르시는 하나님의 주도권을 함께 붙들고 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: יִקְרָא בְּשֵׁם יְהוָה
  english_pob_choice: calls on the name of Yahweh
  chosen_korean: 야훼의 이름을 부르는
  alternatives_korean:
  - 야훼의 이름을 부르는
  - 야훼의 이름을 부르짖는
  lexicon: HALOT
  rationale: ‘부르다’는 히브리어 관용구의 기본 의미를 살리면서, 예배적·호소적 의미를 한국어로 자연스럽게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 이름을 제목어로 바꾸지 않고, 프로젝트 기본값에 따라 음역해 유지합니다.
- source_word: יִמָּלֵט
  english_pob_choice: will be delivered
  chosen_korean: 구원을 받을 것입니다
  alternatives_korean:
  - 구출될 것입니다
  - 벗어날 것입니다
  - 피할 것입니다
  lexicon: HALOT
  rationale: 심판 맥락에서의 ‘피함/구출’ 가능성을 살리되, 결과를 자연스러운 한국어로 풀어 ‘구원’을 선택했습니다. 다만 다음 절의 ‘피할 길’과 연결되도록 문맥상 보존했습니다.
- source_word: תִּהְיֶה פְלֵיטָה
  english_pob_choice: there will be escape
  chosen_korean: 피할 길이 있을 것이니
  alternatives_korean:
  - 구원이 있을 것이니
  - 도피가 있을 것이니
  - 탈출이 있을 것이니
  lexicon: HALOT
  rationale: פְלֵיטָה의 핵심인 ‘피함/도피/탈출’을, 한국어에서 문맥상 가장 자연스럽고 이해하기 쉬운 ‘피할 길’로 옮겼습니다. 단순 추상명사보다 실제적인 회피 가능성을 드러냅니다.
- source_word: וּבַשְּׂרִידִים
  english_pob_choice: among the survivors
  chosen_korean: 살아남은 사람들 가운데
  alternatives_korean:
  - 남은 사람들 가운데
  - 생존자들 가운데
  - 남겨진 자들 가운데
  lexicon: HALOT
  rationale: ‘survivors’의 직접적 의미를 살리면서도, 현대 한국어에서 덜 기술적인 표현으로 정리했습니다.
theological_decisions:
- issue: 사람이 야훼의 이름을 부르는 응답과, 야훼께서 살아남은 이들을 부르시는 주도권의 병치
  chosen_reading: 본문의 두 주체를 모두 살려, 인간의 부름과 하나님의 부르심이 함께 드러나도록 옮겼습니다.
  alternative_readings:
  - 뒤의 ‘야훼께서 부르시는 이들’을 부연설명으로 약화시키기
  - 앞의 약속을 뒤의 ‘부르심’에 종속시키기
  rationale: 히브리어는 인간의 호소와 하나님의 주권적 부르심을 동시에 제시하므로, 어느 한쪽으로 정리하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: פְלֵיטָה의 번역을 ‘구원’보다 ‘피할 길’로 구체화
  chosen_reading: 심판을 통과해 살아남는 맥락을 살려 ‘피할 길’로 구체화했습니다.
  alternative_readings:
  - 구원이 있을 것이니
  - 도피가 있을 것이니
  - 생존이 있을 것이니
  rationale: 문맥은 추상적 구원 개념보다 재앙을 피해 남는 현실적 장면을 가리키므로, 본문의 힘을 약화시키지 않는 범위에서 구체적으로 번역했습니다.
  doctrine_reference: Joel 3:5 judgment-and-survival context
