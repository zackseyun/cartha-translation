revisions:
- from: 그러면 야훼의 이름을 부르는 모든 사람은 구원을 받을 것입니다[a]. 시온 산과 예루살렘에는 피할 길이 있을 것이니[c][b], 야훼께서 말씀하신 대로입니다. 살아남은 사람들 가운데, 야훼께서 부르시는 이들이 있습니다.
  to: 그때에 야훼의 이름을 부르는 사람은 누구나 피하게 될 것입니다[a]. 시온 산과 예루살렘에는 야훼께서 말씀하신 대로 피하여 살아남는 이들이 있을 것이며[c][b], 야훼께서 부르시는 이들도 그들 가운데 있을 것입니다.
  rationale: 수정문은 יִמָּלֵט를 ‘피하게 되다’로 옮겨 심판 속 탈출의 의미를 직접 나타내고, פְלֵיטָה는 ‘피하여 살아남는 이들’로 번역하여 명사의 구체적 의미를 보존했습니다. 마지막 절은 앞 문장에 연결해 원문의 병치를 살렸으며, 각주에서는 인간의 부름과 야훼의 부르심의 관계를 교리적으로 규정하지 않았습니다.
