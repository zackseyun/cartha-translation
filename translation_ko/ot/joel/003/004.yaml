revisions:
- from: 해가 어두움으로 바뀌고, 달이 피로 바뀌기 전에, 곧 크고 두려운 야훼의 날이 오기 전에 그러합니다.[a][b][c]
  to: 해가 어둠으로 바뀌고 달이 피로 바뀌며, 크고 두려운 야훼의 날이 오기 전에 그러할 것입니다.[a][b][c]
