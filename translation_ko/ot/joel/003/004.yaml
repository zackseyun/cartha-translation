source:
  edition: WLC
  text: הַ/שֶּׁ֨מֶשׁ֙ יֵהָפֵ֣ךְ לְ/חֹ֔שֶׁךְ וְ/הַ/יָּרֵ֖חַ לְ/דָ֑ם לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/004.yaml
  text: The sun will be turned to darkness[a], and the moon to blood[c][b], before the coming of the great and fearful day of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the moon into blood,' that is, blood-red. The Hebrew expression is literally 'to blood.'
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
  - marker: c
    text: Or 'the great and awesome day of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 어둠으로 바뀌고 달이 피로 바뀌며, 크고 두려운 야훼의 날이 오기 전에 그러할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘피로’라고 되어 있습니다. ‘핏빛으로’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼’는 하나님의 이름인 히브리어 יְהוָה(YHWH)를 음역한 것입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘크고 경외로운 야훼의 날’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ / יֵהָפֵךְ לְחֹשֶׁךְ
  english_pob_choice: the sun will be turned to darkness
  chosen_korean: 해가 어두움으로 바뀌고
  alternatives_korean:
  - 해가 어둠으로 바뀌고
  - 해가 어두워지고
  lexicon: HALOT
  rationale: 피동적 변화의 결과를 살리기 위해 ‘바뀌고’를 택했고, לְחֹשֶׁךְ의 결과 상태는 ‘어두움’으로 옮겼습니다.
- source_word: וְהַיָּרֵחַ לְדָם
  english_pob_choice: and the moon to blood
  chosen_korean: 달이 피로 바뀌기 전에
  alternatives_korean:
  - 달이 피로 변하기 전에
  - 달이 핏빛으로 바뀌기 전에
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현 ‘to blood’를 본문에서 그대로 살리되, 한국어에서 자연스럽게 결과 변화를 드러내기 위해 ‘피로 바뀌다’로 옮겼습니다.
- source_word: בּוֹא יוֹם יְהוָה הַגָּדוֹל וְהַנּוֹרָא
  english_pob_choice: before the coming of the great and fearful day of Yahweh
  chosen_korean: 곧 크고 두려운 야훼의 날이 오기 전에
  alternatives_korean:
  - 크고 두려운 야훼의 날이 오기 전에
  - 크고 경외로운 야훼의 날이 오기 전에
  lexicon: HALOT
  rationale: בּוֹא를 ‘오다’로 자연스럽게 살리고, הַגָּדוֹל은 ‘크고’, הַנּוֹרָא는 경외와 두려움을 함께 담는 ‘두려운’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 고유명사 음역 ‘야훼’를 사용해 하나님의 이름을 보존했습니다.
theological_decisions:
- issue: 우주적 표징 언어의 처리
  chosen_reading: 해와 달의 변화를 문자 그대로 단정하지 않고, 예언적 종말 표지 언어로서의 강한 이미지를 본문에서 유지했습니다.
  alternative_readings:
  - 해가 캄캄해지고 달이 핏빛이 된다 같은 설명적 완화
  - 상징성만 드러내는 의역
  rationale: 본문은 ‘어두움’과 ‘피’라는 극적인 예언 이미지를 사용하므로, 그 긴장과 충격을 풀어 설명하지 않고 그대로 전달하는 것이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
- issue: YHWH의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문이 신명기를 가리키는 대명사가 아니라 고유한 신적 이름을 직접 사용하므로, 이를 번역어로 대체하지 않고 음역해 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
