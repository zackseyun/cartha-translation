source:
  edition: WLC
  text: וְ/הָיָ֣ה אַֽחֲרֵי כֵ֗ן אֶשְׁפּ֤וֹךְ אֶת רוּחִ/י֙ עַל כָּל בָּשָׂ֔ר וְ/נִבְּא֖וּ בְּנֵי/כֶ֣ם וּ/בְנֽוֹתֵי/כֶ֑ם זִקְנֵי/כֶם֙ חֲלֹמ֣וֹת יַחֲלֹמ֔וּ/ן בַּח֣וּרֵי/כֶ֔ם חֶזְיֹנ֖וֹת יִרְאֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/001.yaml
  text: And it will happen afterward that I will pour out my Spirit on all flesh[a]; and your sons and your daughters will prophesy, your old men will dream dreams[b], your young men will see visions.
  footnotes:
  - marker: a
    text: Or 'on all humanity' / 'on all people'; Hebrew 'on all flesh.'
    reason: lexical_alternative
  - marker: b
    text: '''My Spirit'' could also be rendered ''my spirit,'' but the context of prophetic empowerment favors the divine Spirit.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 후에 내가 내 영[b]을 모든 육체 위에 부어 줄 것입니다.[a] 너희 아들과 딸들은 예언하고, 너희 나이 든 남자들은 꿈을 꾸며, 너희 젊은 남자들은 이상을 볼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 인류 위에’, ‘모든 사람 위에’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘모든 육체 위에’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 영’은 문맥상 하나님의 영을 가리키는 표현으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אַחֲרֵי כֵן
  english_pob_choice: And it will happen afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그리고 그 후에
  - 이 일이 있은 뒤에
  - 그 후에 일이 일어날 것입니다
  lexicon: HALOT
  rationale: 예언적 시간표지의 관용구를 한국어에서 자연스럽고 간결하게 살려, 뒤따를 사건의 전개를 분명히 했습니다.
- source_word: רוּחִי
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 성령
  - 내 영혼
  - 내 영을
  lexicon: HALOT
  rationale: 히브리어 본문은 소유격 ‘내’와 ‘영’의 표현을 쓰므로, 본문 밀착형으로 ‘내 영’을 택했습니다. 다만 문맥상 하나님의 영을 가리키는 것은 분명하므로 한국어에서 불필요한 신학적 완곡어는 피했습니다.
- source_word: עַל כָּל בָּשָׂר
  english_pob_choice: on all flesh
  chosen_korean: 모든 육체 위에
  alternatives_korean:
  - 모든 사람 위에
  - 온갖 사람에게
  - 모든 육신 위에
  lexicon: HALOT
  rationale: ‘בָּשָׂר’의 문자적 이미지를 유지해 ‘모든 육체’로 옮겼고, 전치사 ‘עַל’은 한국어에서 자연스러운 ‘위에’로 살렸습니다. POB가 보존한 폭넓은 범위를 유지합니다.
- source_word: בְּנֵיכֶם וּבְנוֹתֵיכֶם
  english_pob_choice: your sons and your daughters
  chosen_korean: 너희 아들딸
  alternatives_korean:
  - 너희 아들과 딸
  - 너희 아들과 너희 딸
  - 너희 자녀
  lexicon: HALOT
  rationale: 남녀 자녀를 둘 다 명시하는 병렬성을 살리되, 한국어에서 간결하게 읽히도록 합친 표현을 사용했습니다.
- source_word: זִקְנֵיכֶם ... בַּחוּרֵיכֶם
  english_pob_choice: your old men ... your young men
  chosen_korean: 너희 늙은이들 ... 너희 젊은이들
  alternatives_korean:
  - 너희 노인들 ... 너희 청년들
  - 너희 늙은 남자들 ... 너희 젊은 남자들
  - 너희 장로들 ... 너희 젊은이들
  lexicon: HALOT
  rationale: 여기서는 직분보다 연령 대비가 핵심이므로, ‘늙은이들/젊은이들’로 평행 구조를 가장 직접적으로 드러냈습니다.
- source_word: חֲלֹמוֹת יַחֲלֹמוּן / חֶזְיֹנוֹת יִרְאוּ
  english_pob_choice: will dream dreams / will see visions
  chosen_korean: 꿈을 꾸고 / 이상을 볼 것입니다
  alternatives_korean:
  - 꿈을 꿈꾸고 / 환상을 볼 것입니다
  - 꿈들을 꾸고 / 이상들을 볼 것입니다
  - 꿈을 꾸며 / 환상을 보게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 반복 강조는 한국어에서 ‘꿈을 꾸고’로, 예언적 계시는 ‘이상’을 표준적이고 문맥상 적절한 용어로 옮겼습니다.
theological_decisions:
- issue: ‘רוּחִי’의 신학적 범위
  chosen_reading: 하나님의 영을 가리키는 표현으로 이해하되, 본문에서는 ‘내 영’으로 직역해 개념을 과도하게 규정하지 않았습니다.
  alternative_readings:
  - 내 성령
  - 내 영혼
  - 내 영기
  rationale: 예언·계시의 결과가 이어지므로 신적 영의 뜻이 강하지만, 히브리어 본문 자체의 표현을 보존해 번역에서 해석을 앞서지 않게 했습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘כָּל בָּשָׂר’의 범위
  chosen_reading: ‘모든 육체’로 유지해 범위를 넓게 남겼습니다.
  alternative_readings:
  - 모든 사람
  - 모든 인류
  - 모든 인간
  rationale: 이 표현이 가리키는 포괄성이 본문상 중요하므로, 한국어에서도 좁게 정리하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
