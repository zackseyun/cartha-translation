  source_fidelity: 히브리어의 첨가·강조(וְגַם), 남성·여성 노예의 병렬, 복수 시간 표현, 그리고 하나님의 ‘내 영’을 부어 주시는 은유는 대체로 충실히 반영되었습니다. 다만 강조의 범위가 더 분명하게 드러나도록 ‘까지’를 사람들의 집단에 붙이는 편이 적절합니다.
  naturalness: 현 초안도 이해 가능하지만, ‘내 영을 남자 노예들과 여자 노예들 위에까지’보다 ‘남자 노예들과 여자 노예들에게까지 내 영을’이 현대 한국어 어순에서 더 자연스럽고 강조의 초점이 명료합니다.
  terminology: ‘남자 노예들/여자 노예들’은 עֲבָדִים와 שְׁפָחוֹת의 성별 및 예속 상태를 적절히 보존합니다. ‘내 영’은 원문의 표현을 과도하게 ‘성령’으로 구체화하지 않아 적절합니다. 기존 각주는 본문과 사실상 같은 표현을 대안으로 제시하므로 유효한 어휘 대안이 되도록 고쳐야 합니다.
