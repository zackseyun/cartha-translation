    rationale: 히브리어 וְגַם은 노예 집단까지 포함한다는 강조입니다. ‘여자 노예들 위에까지’라는 배열은 마지막 명사구에만 강조가 걸리는 듯 보일 수 있으므로, ‘남자 노예들과 여자 노예들에게까지’로 옮기면 두 집단 전체에 대한 포괄과 강조가 자연스럽게 드러납니다.
  - severity: low
    issue: 각주의 대안 표현이 본문과 실질적으로 구별되지 않음
    rationale: 기존 각주의 인용문은 본문 핵심 명사구와 동일하여 ‘또는’으로 제시할 만한 번역 대안이 아닙니다. 성별을 명시하지 않는 ‘노예들과 여종들’을 대안으로 제시하면 원문의 어휘적 선택과 번역상의 차이를 설명할 수 있습니다.
