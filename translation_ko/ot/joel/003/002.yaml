  text: וְ/גַ֥ם עַל הָֽ/עֲבָדִ֖ים וְ/עַל הַ/שְּׁפָח֑וֹת בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֶשְׁפּ֖וֹךְ אֶת רוּחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/002.yaml
  text: And even on the male slaves and on the female slaves[a], in those days I will pour out my Spirit.
  footnotes:
  - marker: a
    text: Or "the slaves and the female servants." The Hebrew terms denote male and female persons in servile status; "slaves" is used here to preserve the bonded social reality.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 날들에 나는 남자 노예들과 여자 노예들에게까지 내 영을 부어 주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “노예들과 여종들.” 히브리어 표현은 예속된 처지의 남성과 여성을 가리킵니다. 여기서는 그 사회적 예속 상태를 드러내기 위해 “노예”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And even
  chosen_korean: 그리고 …까지
  alternatives_korean:
  - 그리고 또한
  - 심지어
  lexicon: HALOT
  rationale: 첨가성과 강조를 함께 살리기 위해 ‘그리고’에 범위 확장감을 주는 ‘…까지’를 결합했습니다.
- source_word: הָעֲבָדִים / הַשְּׁפָחוֹת
  english_pob_choice: the male slaves / the female slaves
  chosen_korean: 남자 노예들 / 여자 노예들
  alternatives_korean:
  - 남종들 / 여종들
  - 종들 / 여종들
  - 노예들 / 노예 여자들
  lexicon: HALOT
  rationale: 이 구절은 성별 대조와 더불어 예속된 사회적 처지를 강조하므로, 완곡한 ‘종’보다 ‘노예’가 원문의 힘을 더 직접적으로 드러냅니다.
- source_word: בַּיָּמִים הָהֵמָּה
  english_pob_choice: in those days
  chosen_korean: 그 날들에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언적 시간표현을 자연스럽게 옮기되, 복수형의 포괄적 시간대를 유지하기 위해 ‘그 날들에’로 번역했습니다.
- source_word: אֶשְׁפּוֹךְ אֶת רוּחִי
  english_pob_choice: I will pour out my Spirit
  chosen_korean: 나는 내 영을 부어 주겠습니다
  alternatives_korean:
  - 내 영을 쏟아붓겠습니다
  - 내 성령을 부어 주겠습니다
  lexicon: HALOT
  rationale: ‘붓다’는 히브리어 שפך의 은유를 자연스럽게 살리며, 본문에 분명히 ‘성령’이 아니라 ‘내 영’으로 되어 있으므로 용어를 과하게 해석하지 않았습니다.
theological_decisions:
- issue: רוּחִי의 한국어 표기와 신학적 구체화
  chosen_reading: 내 영
  alternative_readings:
  - 내 성령
  - 나의 영
  rationale: 문맥상 하나님의 영을 가리키지만, 본문 자체는 ‘내 영’이라고 말하므로 번역에서 그 긴장을 유지했습니다. '성령'은 의미상 타당하지만 본문보다 더 구체화합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve tension where genuine ambiguity exists)
