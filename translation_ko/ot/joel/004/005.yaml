source:
  edition: WLC
  text: אֲשֶׁר כַּסְפִּ֥/י וּ/זְהָבִ֖/י לְקַחְתֶּ֑ם וּ/מַֽחֲמַדַּ/י֙ הַ/טֹּבִ֔ים הֲבֵאתֶ֖ם לְ/הֵיכְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/005.yaml
  text: because you took my silver and my gold[a], and brought my precious things into your temples.
  footnotes:
  - marker: a
    text: Or 'into your palaces.' The Hebrew word can mean either 'temples' or 'palaces'; 'temples' is preferred here because the context suggests cultic appropriation of what belongs to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희가 내 은과 내 금을 가져가고, 내 귀한 것들을 너희 신전들로 가져갔기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신전들’은 ‘궁전들’로도 옮길 수 있습니다. 히브리어 היכל은 두 의미를 모두 가질 수 있지만, 여기서는 하나님께 속한 것들을 제의적으로 전용한 맥락이 더 잘 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 것입니다
  - 한 것입니다
  lexicon: HALOT
  rationale: 문맥상 선행하는 심판 선언의 이유를 밝히는 종속절이므로, 한국어에서도 원인·이유를 분명히 드러내는 표현이 자연스럽습니다.
- source_word: כַּסְפִּי וּזְהָבִי
  english_pob_choice: my silver and my gold
  chosen_korean: 내 은과 내 금
  alternatives_korean:
  - 나의 은과 나의 금
  - 내 은과 금
  lexicon: HALOT
  rationale: 소유격을 직접 살리되 한국어에서 간결하고 성경문체에 어울리는 ‘내 은과 내 금’을 택했습니다.
- source_word: מַחֲמַדַּי הַטֹּבִים
  english_pob_choice: my precious things
  chosen_korean: 내 소중한 것들
  alternatives_korean:
  - 내 귀한 것들
  - 내 소중한 보물
  lexicon: HALOT
  rationale: 히브리어의 ‘바람직하고 귀한 것들’이라는 의미를 과도한 해석 없이 살리기 위해, 가치 있는 물건들을 포괄하는 ‘소중한 것들’로 옮겼습니다.
- source_word: לְהֵיכְלֵיכֶם
  english_pob_choice: into your temples
  chosen_korean: 당신들의 신전으로
  alternatives_korean:
  - 당신들의 궁전으로
  - 당신들의 성전으로
  lexicon: HALOT
  rationale: היכל은 ‘신전/궁전’ 모두 가능하지만, 본문은 하나님의 소유물을 이방의 제의 공간으로 옮긴 신성모독을 강조하므로 ‘신전’이 더 적절합니다.
theological_decisions:
- issue: לְהֵיכְלֵיכֶם의 의미 범위
  chosen_reading: 이방 민족이 약탈물을 자기들의 제의적 공간으로 옮긴 것으로 읽어 ‘신전’으로 번역합니다.
  alternative_readings:
  - 왕궁/궁전으로 읽을 수 있음
  rationale: 문맥이 단순한 전리품 이동이 아니라 하나님께 속한 것의 탈취와 전용을 고발하므로, 예배·우상숭배의 맥락을 드러내는 번역이 본문의 힘을 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, §5
