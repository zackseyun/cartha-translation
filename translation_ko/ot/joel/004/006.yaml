  source_fidelity: 히브리어의 대격 목적어(유다와 예루살렘의 자손들), 매매 행위, 매수자, 목적절은 대체로 반영되었습니다. 그러나 ‘팔아, … 하였습니다’는 목적을 나타내는 לְמַעַן을 다소 어색하게 연결하며, ‘그들의 경계에서’는 מֵעַל גְּבוּלָם의 영토 이탈 의미를 한국어에서 충분히 자연스럽게 전달하지 못합니다.
  naturalness: ‘유다와 예루살렘의 아들들’ 및 ‘그리스 사람들의 아들들에게’는 히브리어 구조를 지나치게 직역하여 현대 표준 한국어에서 부자연스럽습니다. ‘자손’과 ‘그리스인들’을 사용하되, 원문의 직역 가능성은 각주로 보존하는 편이 자연스럽습니다.
  terminology: 고유명사 ‘유다’, ‘예루살렘’, ‘그리스인’은 적절합니다. בני는 이 문맥에서 민족·주민을 가리키는 관용적 표현이므로 ‘자손’이 한국어에서 안전하면서도 원문에 가깝습니다. גבול은 ‘경계’뿐 아니라 ‘영토’를 뜻할 수 있으므로 본문에서는 ‘영토’가 ‘그들의 땅에서 멀리’라는 뜻을 더 분명히 합니다.
