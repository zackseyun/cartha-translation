  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
  footnotes:
  - marker: a
    text: Hebrew 'to the sons of the Greeks'; this may also be rendered more idiomatically 'to the Greeks.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from their territory' for 'from their border.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그들을 그들의 영토에서 멀리 떨어지게 하려고 유다 자손과 예루살렘 자손을 그리스인들에게 팔았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그리스 사람들의 아들들에게’입니다. ‘그리스인들에게’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영토’는 ‘경계’, ‘변경’ 또는 ‘영역’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: and the sons of
  chosen_korean: ~의 아들들
