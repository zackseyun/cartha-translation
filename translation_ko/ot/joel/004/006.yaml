source:
  edition: WLC
  text: וּ/בְנֵ֤י יְהוּדָה֙ וּ/בְנֵ֣י יְרוּשָׁלִַ֔ם מְכַרְתֶּ֖ם לִ/בְנֵ֣י הַ/יְּוָנִ֑ים לְמַ֥עַן הַרְחִיקָ֖/ם מֵ/עַ֥ל גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/006.yaml
  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
  footnotes:
  - marker: a
    text: Hebrew 'to the sons of the Greeks'; this may also be rendered more idiomatically 'to the Greeks.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from their territory' for 'from their border.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다와 예루살렘의 아들들을 너희가 그리스 사람들의 아들들에게 팔아, 그들을 그들의 경계에서 멀리 떨어뜨리려고 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그리스 사람들의 아들들’입니다. 더 자연스럽게는 ‘그리스 사람들에게’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경계’는 ‘경계/변경/영역’에 해당할 수 있으며, 문맥상 ‘그들의 지역’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: and the sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 사람들
  - ~의 자손들
  lexicon: HALOT
  rationale: 히브리어 בני의 직역적 족속/민족 표현을 살리되, 한국어에서는 자연스럽게 관계를 드러내기 위해 ‘~의 아들들’로 옮겼습니다.
- source_word: מְכַרְתֶּם
  english_pob_choice: you sold
  chosen_korean: 팔아
  alternatives_korean:
  - 팔았습니다
  - 팔았습니다만
  lexicon: HALOT
  rationale: 예언적 책망의 연속 동작을 한국어에서 자연스럽게 이어 주기 위해 ‘팔아’로 처리했습니다.
- source_word: לִבְנֵי הַיְּוָנִים
  english_pob_choice: to the sons of the Greeks
  chosen_korean: 그리스 사람들의 아들들
  alternatives_korean:
  - 그리스인들에게
  - 헬라인들의 아들들에게
  - 그리스 사람들에게
  lexicon: HALOT
  rationale: POB의 ‘sons of the Greeks’를 따라 원문의 בני 구조를 유지하면서, יונים의 통용 의미를 반영해 ‘그리스 사람들’로 옮겼습니다.
- source_word: מֵעַל גְּבוּלָם
  english_pob_choice: from their border
  chosen_korean: 그들의 경계에서
  alternatives_korean:
  - 그들의 변경에서
  - 그들의 국경에서
  - 그들의 지역에서
  lexicon: HALOT
  rationale: גבול은 경계/변경/영역을 모두 가질 수 있으므로, 문맥상 추방·이격의 공간적 의미를 살려 ‘경계’로 옮겼습니다.
theological_decisions:
- issue: 포로화/인신매매의 가혹함을 직설적으로 드러낼지 여부
  chosen_reading: ‘팔아’로 직설적으로 옮겨, 예언자의 고발이 지닌 윤리적 무게를 약화시키지 않았습니다.
  alternative_readings:
  - ‘넘겨’
  - ‘내주어’
  rationale: 원문 מכר의 핵심은 실제 매매 행위이며, 문맥상 유다 자손을 이방에게 넘긴 죄를 고발하므로 완화 표현을 쓰지 않았습니다.
  doctrine_reference: 예언서의 언약적 심판과 사회적 정의
