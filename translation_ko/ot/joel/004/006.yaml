revisions:
- from: 유다와 예루살렘의 아들들을 너희가 그리스 사람들의 아들들에게 팔아, 그들을 그들의 경계에서 멀리 떨어뜨리려고 하였습니다.[a][b]
  to: 너희는 그들을 그들의 영토에서 멀리 떨어지게 하려고 유다 자손과 예루살렘 자손을 그리스인들에게 팔았습니다.[a][b]
  rationale: 목적을 나타내는 히브리어 구문을 ‘… 하려고 … 팔았습니다’로 명확히 재구성하고, 한국어에서 부자연스러운 ‘아들들’의 반복은 ‘자손’과 ‘그리스인들’로 다듬었습니다. גבול의 공간적 의미는 본문에서 ‘영토’로 자연스럽게 표현하고 대안 번역은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:35Z'
