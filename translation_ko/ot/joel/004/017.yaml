  edition: WLC
  text: וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם שֹׁכֵ֖ן בְּ/צִיּ֣וֹן הַר קָדְשִׁ֑/י וְ/הָיְתָ֤ה יְרוּשָׁלִַ֨ם֙ קֹ֔דֶשׁ וְ/זָרִ֥ים לֹא יַֽעַבְרוּ בָ֖/הּ עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/017.yaml
  text: Then you will know that I am Yahweh your God[a], dwelling in Zion, my holy mountain. And Jerusalem will be holy, and strangers will pass through her no more.
  footnotes:
  - marker: a
    text: Or 'foreigners.' The Hebrew זָרִים refers to outsiders; in this context it likely means those who do not belong in the holy city, not necessarily every non-Israelite person in every sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 너희는 내가 야훼, 곧 너희 하나님이며 시온에 거하는 나의 거룩한 산에 거하는 이인 줄 알게 될 것입니다. 예루살렘은 거룩한 곳이 될 것이며, 이방인은 다시는 그리로 지나가지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이방인’은 여기서 반드시 모든 비이스라엘인을 뜻하기보다, 거룩한 도시에 속하지 않는 외인을 가리키는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  english_pob_choice: Then you will know
  chosen_korean: 그때에 너희는 … 알게 될 것입니다
  alternatives_korean:
  - 그리고 너희는 … 알게 될 것입니다
  - 그러므로 너희는 … 알게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 결과를 드러내는 연결이므로 ‘그때에’로 순차·결과 의미를 살렸고, ידע의 인지적·체험적 인식을 ‘알게 될 것입니다’로 자연스럽게 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼, 곧 너희 하나님
  alternatives_korean:
  - 야훼 너희 하나님
  - 주 너희 하나님
  lexicon: HALOT
  rationale: 여호와 대신 하나님의 고유명칭을 음역한 ‘야훼’를 따르고, 소유 관계는 ‘너희 하나님’으로 분명히 했습니다. 쉼표와 ‘곧’은 동격을 드러냅니다.
- source_word: שֹׁכֵן בְּצִיּוֹן הַר קָדְשִׁי
  english_pob_choice: dwelling in Zion, my holy mountain
  chosen_korean: 시온에 거하는 나의 거룩한 산에 거하는 이
  alternatives_korean:
  - 시온에 거하시는 나의 거룩한 산
  - 시온에 거하시는 거룩한 나의 산
  lexicon: HALOT
  rationale: שֹׁכֵן의 분사성을 살려 ‘거하는 이’로 옮겨 주체를 유지했습니다. ‘거룩한 산’은 소유격 ‘나의’를 함께 살려 히브리어의 ‘내 거룩한 산’ 구조를 반영합니다.
- source_word: וְזָרִים לֹא יַעַבְרוּ בָהּ עוֹד
  english_pob_choice: strangers will pass through her no more
  chosen_korean: 이방인은 다시는 그리로 지나가지 못할 것입니다
  alternatives_korean:
  - 낯선 사람들은 다시는 그리로 지나가지 못할 것입니다
  - 외국인들은 다시는 그리로 지나가지 못할 것입니다
  lexicon: HALOT
  rationale: זָרִים은 단순 민족 범주보다 성소를 침범하는 ‘외인/이방인’의 뉘앙스가 강하므로, 성결 문맥에 맞게 ‘이방인’으로 옮겼습니다. עבר בּ는 ‘지나가다’의 이동 이미지를 유지했습니다.
theological_decisions:
- issue: 예루살렘의 거룩함과 외인의 통과 금지
  chosen_reading: 예루살렘은 거룩한 곳이 될 것이며, 이방인은 다시는 그리로 지나가지 못할 것입니다
  alternative_readings:
  - 예루살렘은 거룩해질 것이며, 외국인은 다시는 그곳을 지나지 못할 것입니다
  - 예루살렘은 거룩할 것이며, 낯선 사람들은 다시는 그곳을 통과하지 못할 것입니다
  rationale: 본문은 예루살렘의 성결과 그 성결을 더럽힐 수 있는 침입의 종식을 함께 말합니다. ‘이방인’은 단순한 민족적 배제가 아니라 거룩한 도시에 속하지 않는 자들을 가리킨다는 긴장을 보존합니다.
  doctrine_reference: 홀리니스/시온 회복 문맥
