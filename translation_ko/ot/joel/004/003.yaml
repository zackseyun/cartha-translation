id: JOL.4.3
reference: Joel 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל עַמִּ֖/י יַדּ֣וּ גוֹרָ֑ל וַ/יִּתְּנ֤וּ הַ/יֶּ֨לֶד֙ בַּ/זּוֹנָ֔ה וְ/הַ/יַּלְדָּ֛ה מָכְר֥וּ בַ/יַּ֖יִן וַ/יִּשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/003.yaml
  text: And they cast lots for my people[a]; they gave a boy for a prostitute, and sold a girl for wine[b], and drank it.
  footnotes:
  - marker: a
    text: Or 'they gave a boy to a prostitute.' The Hebrew verb is literally 'gave,' but in context it describes an exploitative exchange.
    reason: lexical_alternative
  - marker: b
    text: Or 'they cast lots over my people.' The Hebrew idiom refers to dividing people as spoil by lot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 백성을 두고 제비를 뽑았으며[a], 소년을 창녀와 바꾸고, 소녀를 포도주 값에 팔아넘기고, 마셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성을 두고 제비를 뽑았습니다.’ 히브리어 관용구는 사람들을 제비로 나누어 전리품처럼 분배하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל עַמִּי יַדּוּ גוֹרָל
  english_pob_choice: they cast lots for my people
  chosen_korean: 내 백성을 두고 제비를 뽑았으며
  alternatives_korean:
  - 내 백성에게 제비를 던졌으며
  - 내 백성을 상대로 제비를 뽑았으며
  lexicon: HALOT
  rationale: יָדָה גוֹרָל은 관용적으로 '제비를 뽑다'이고, עַל/אֶל은 그 대상이 되는 사람들을 가리키므로 한국어는 자연스럽게 '내 백성을 두고 제비를 뽑다'로 옮겼습니다.
- source_word: וַיִּתְּנוּ הַיֶּלֶד בַּזּוֹנָה
  english_pob_choice: they gave a boy for a prostitute
  chosen_korean: 소년을 창녀와 바꾸고
  alternatives_korean:
  - 소년을 창녀에게 주고
  - 소년을 창녀를 위해 주고
  - 소년을 창녀와 맞바꾸고
  lexicon: HALOT
  rationale: 기본 동사는 '주다'이지만 문맥상 착취적 교환을 뜻하므로, 문법적 직역보다 교환 관계를 드러내는 '바꾸다'를 택해 원문의 냉혹함을 살렸습니다.
- source_word: וְהַיַּלְדָּה מָכְרוּ בַיַּיִן
  english_pob_choice: and sold a girl for wine
  chosen_korean: 소녀를 포도주 값에 팔아넘기고
  alternatives_korean:
  - 소녀를 포도주를 받고 팔고
  - 소녀를 포도주를 대가로 팔고
  lexicon: HALOT
  rationale: מָכַר은 분명히 '팔다'이며, בַּיַּיִן은 교환의 대가를 나타내므로 '포도주 값에'로 옮겨 거래의 폭력성을 유지했습니다.
- source_word: וַיִּשְׁתּוּ
  english_pob_choice: and drank it
  chosen_korean: 마셨습니다
  alternatives_korean:
  - 그것을 마셨습니다
  - 그리고 마셨습니다
  lexicon: HALOT
  rationale: 마지막 동사는 앞선 포도주를 가리키는 암시적 목적어를 가지므로, 한국어에서는 불필요한 대명사를 덧붙이지 않고 간결하게 처리했습니다.
theological_decisions:
- issue: 포로·전리품의 착취를 어떻게 드러낼 것인가
  chosen_reading: ‘제비를 뽑다’와 ‘바꾸고/팔아넘기고’의 병치를 그대로 살려, 사람을 전리품처럼 분배하는 폭력을 직접적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 '분배했다'나 '나누었다'로 낮추는 번역
  - 도덕적 해설을 덧붙여 의미를 풀어쓰는 번역
  rationale: 원문은 단순한 거래가 아니라 사람을 물건처럼 취급하는 심판 사유를 고발하므로, 그 긴장을 약화시키지 않는 직설적 표현이 필요합니다.
  doctrine_reference: 예언서의 사회악 고발과 인간의 형상 훼손에 대한 성경적 증언
