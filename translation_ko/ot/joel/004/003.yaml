  terminology: ‘내 백성’, ‘제비를 뽑다’, ‘소년’, ‘소녀’, ‘포도주’는 적절합니다. ‘창녀와 맞바꾸다’는 원문의 충격적인 교환 관계를 유지하면서도, 특정한 거래 방식 이상의 해석을 덧붙이지 않습니다.
