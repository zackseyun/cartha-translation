id: JOL.4.11
reference: Joel 4:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ע֣וּשׁוּ וָ/בֹ֧אוּ כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/011.yaml
  text: Hasten and come[a], all you nations from every side, and gather yourselves there. Bring down your mighty ones[b], O Yahweh.
  footnotes:
  - marker: a
    text: Or 'Make haste and come … and assemble there.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Send down, O LORD, your warriors.' The Hebrew 'your mighty ones' may refer generally to the LORD's powerful agents, without specifying whether they are human or heavenly.
    reason: alternative_reading
translation:
  language: ko
  text: 서둘러 오십시오, 사방에서 오는 모든 민족들아. 그곳에 모이십시오. 야훼여, 당신의 강한 자들을 내려보내십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֣וּשׁוּ וָ/בֹ֧אוּ
  english_pob_choice: Hasten and come
  chosen_korean: 서두르며 오십시오
  alternatives_korean:
  - 서둘러 오십시오
  - 급히 오십시오
  lexicon: HALOT
  rationale: 두 명령형의 긴박성을 한국어의 자연스러운 공손 명령으로 압축해 살렸습니다. '오십시오'는 합쇼체를 유지하면서도 부름의 직접성을 보존합니다.
- source_word: כָֽל הַ/גּוֹיִ֛ם
  english_pob_choice: all you nations
  chosen_korean: 모든 민족들아
  alternatives_korean:
  - 모든 나라들아
  - 모든 민족들
  lexicon: HALOT
  rationale: 문맥상 열방을 직접 부르는 호격이므로 한국어에서도 호격 어미를 드러냈습니다. '민족들'은 대상 집단의 일반성을 잘 살립니다.
- source_word: מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה
  english_pob_choice: from every side, and gather yourselves there
  chosen_korean: 사방에서 모여 그곳에 집결하십시오
  alternatives_korean:
  - 사방에서 모여 그곳에 모이십시오
  - 사방에서 모여 거기 모이십시오
  lexicon: HALOT
  rationale: '''מִסָּבִיב''의 둘러싼 방향성을 ''사방에서''로 살리고, 재귀적 뉘앙스가 있는 ''וְנִקְבָּצוּ''는 단순 ''모이다''보다 한층 더 집합적이고 소집된 느낌의 ''집결하십시오''로 옮겼습니다.'
- source_word: הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ
  english_pob_choice: Bring down your mighty ones, O Yahweh
  chosen_korean: 야훼여, 주님의 용사들을 내려보내십시오
  alternatives_korean:
  - 야훼여, 주님의 용사들을 끌어내리십시오
  - 야훼여, 주님의 용사들을 보내십시오
  lexicon: HALOT
  rationale: 히필 명령형의 하향 이동 이미지를 '내려보내십시오'로 표현했습니다. '용사들'은 גִּבּוֹרִים의 군사적/능력자적 범위를 살리면서도, 그 정체를 인간이나 천상 존재로 단정하지 않게 합니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 출처 텍스트의 여호와 이름을 프로젝트 기본값에 따라 '야훼'로 옮기고, 직접 호격은 '-여'로 표시했습니다. 전통 교회어인 '주님'은 신적 호칭이지만 כאן의 고유명칭을 가리기 때문에 채택하지 않았습니다.
theological_decisions:
- issue: 기브보레카(גִּבּוֹרֶיךָ)의 정체를 특정할 것인가
  chosen_reading: 주님의 용사들
  alternative_readings:
  - 주님의 영웅들
  - 주님의 강한 자들
  - 천상 군대
  rationale: 본문은 그 대상을 인간 전사인지 천상 존재인지 분명히 규정하지 않으므로, 한국어도 군사적 힘을 드러내되 과도하게 특정하지 않는 '용사들'을 택했습니다. 이는 영어 POB가 유지한 신학적 유보를 보존합니다.
  doctrine_reference: 본문의 의도된 모호성 보존
- issue: 히브리어 하나님의 이름 יְהוָה의 처리
  chosen_reading: 야훼여
  alternative_readings:
  - 주님이여
  - 여호와여
  rationale: 문서화된 프로젝트 기준에 따라 고유명칭을 보존해 번역하며, 예언적 호칭의 직접성을 유지하기 위해 호격형으로 마무리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
