  to: 서둘러 오십시오, 사방에서 오는 모든 민족들아. 그곳에 모이십시오. 야훼여, 당신의 강한 자들을 내려보내십시오.
  rationale: The revision retains the urgent double imperative, the vocative address to all nations, their convergence from every side, and the command to gather at the designated place. It renders the final plea with Yahweh's name and preserves the deliberately unspecified identity of 'your mighty ones.'
