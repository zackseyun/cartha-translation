  text: יֵע֨וֹרוּ֙ וְ/יַעֲל֣וּ הַ/גּוֹיִ֔ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט כִּ֣י שָׁ֗ם אֵשֵׁ֛ב לִ/שְׁפֹּ֥ט אֶת כָּל הַ/גּוֹיִ֖ם מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/012.yaml
  text: Let the nations awaken and come up to the Valley of Jehoshaphat[a], for there I will sit to judge all the surrounding nations.
  footnotes:
  - marker: a
    text: Jehoshaphat likely echoes the meaning 'the LORD judges,' reinforcing the scene of divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들은 깨어나 여호사밧 골짜기로 올라오십시오. 내가 그곳에 앉아 주변의 모든 민족을 심판하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호사밧’이라는 이름은 ‘야훼께서 심판하신다’라는 뜻을 암시하며, 이 심판 장면을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵע֨וֹרוּ
  english_pob_choice: Let ... awaken
  chosen_korean: 깨어나
  alternatives_korean:
  - 일어나
  - 자극을 받아
  - 잠에서 깨어나
  lexicon: HALOT
  rationale: 문맥상 전투와 심판을 향한 소환이므로, 단순한 기상보다 행동을 촉구하는 ‘깨어나’가 메타포를 자연스럽게 살립니다.
- source_word: וְיַעֲל֣וּ
  english_pob_choice: and come up
  chosen_korean: 올라와서 ... 가게 하십시오
  alternatives_korean:
  - 올라오고
  - 올라가고
  - 올라오게 하십시오
  lexicon: HALOT
  rationale: עלה의 상향 이동을 살리면서, 한국어에서는 목적지까지의 이동을 함께 드러내는 ‘올라와서 … 가게 하십시오’가 가장 자연스럽습니다.
- source_word: עֵמֶק יְהוֹשָׁפָט
  english_pob_choice: the Valley of Jehoshaphat
  chosen_korean: 여호사밧 골짜기
  alternatives_korean:
  - 여호사밧 계곡
  - 야훼께서 심판하시는 골짜기
  lexicon: HALOT
  rationale: 고유명사는 음역으로 보존하되, ‘골짜기’로 지형 의미를 분명히 했습니다. 이름 속 ‘야훼가 심판하신다’는 뜻은 본문이 아니라 주석층에서 다루는 것이 적절합니다.
- source_word: כִּי שָׁ֗ם אֵשֵׁ֛ב לִ/שְׁפֹּ֥ט
  english_pob_choice: for there I will sit to judge
  chosen_korean: 거기에서 내가 앉아 ... 심판하겠습니다
  alternatives_korean:
  - 거기서 내가 앉아 ... 재판하겠습니다
  - 거기에서 내가 자리에 앉아 ... 판결하겠습니다
  - 거기에서 내가 앉아 ... 판단하겠습니다
  lexicon: HALOT
  rationale: ישב + לשפוט의 재판관 이미지가 핵심이므로 ‘앉아’와 ‘심판하겠습니다’를 결합해 법정적 장면을 보존했습니다.
- source_word: כָּל הַ/גּוֹיִ֖ם מִ/סָּבִֽיב
  english_pob_choice: all the surrounding nations
  chosen_korean: 사방의 모든 민족
  alternatives_korean:
  - 둘러싼 모든 민족
  - 주위의 모든 민족
  - 사방에 있는 모든 민족
  lexicon: HALOT
  rationale: מִסָּבִיב의 둘러싼 공간성을 한국어 관용에 맞게 ‘사방’으로 옮겨, 포위된 전면적 심판의 느낌을 살렸습니다.
theological_decisions:
- issue: 여호사밧이라는 지명에 담긴 심판 의미를 본문에 직접 풀어쓸지 여부
  chosen_reading: 본문에는 고유명사로 유지하고, 의미적 중첩은 주석층에서 처리합니다.
  alternative_readings:
  - ‘야훼께서 심판하시는 골짜기’로 번역
  - ‘주님이 심판하시는 골짜기’로 번역
  rationale: 원문은 지명을 불러오면서 심판 주제를 강화하지만, 이름 자체를 번역하면 고유명사성과 시적 암시가 약해집니다. 따라서 본문은 음역을 유지하고 의미는 별도 주석으로 보존하는 편이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; preserve theological tension rather than resolve it.'
