  source_fidelity: 개정이 필요합니다. 초안의 ‘올라와서 여호사밧 골짜기로 가게 하십시오’는 עלה(올라가다/올라오다)의 단일 이동을 ‘올라오다’와 ‘가다’라는 두 이동으로 풀어 원문의 간결한 소환을 흐립니다. ‘여호사밧 골짜기로 올라오십시오’는 원문의 상향 이동과 목적지를 직접 보존합니다. 또한 מִסָּבִיב은 심판 대상인 민족들이 사방에/주변에 있음을 나타내므로 ‘주변의 모든 민족’이 더 명료합니다.
  naturalness: ‘민족들이 … 가게 하십시오’는 한국어에서 명령의 대상과 청자가 분리되어 다소 어색하고, 특히 앞선 ‘올라와서’와 결합하면 불필요하게 우회적입니다. 직접적인 예언자적 소환인 ‘민족들은 깨어나 … 올라오십시오’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘여호사밧 골짜기’는 고유명사 음역 원칙에 맞고, ‘심판’은 שפט의 법정적·신적 심판 의미를 적절히 보존합니다. 이름의 어원적 암시는 본문이 아니라 각주에서 처리하는 것이 적절합니다.
