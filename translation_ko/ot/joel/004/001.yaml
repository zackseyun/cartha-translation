  source_fidelity: 개정이 필요합니다. 초안은 כִּי의 연결·근거 기능을 사실상 생략하고, שׁוּב אֶת־שְׁבוּת의 관용구를 단수의 ‘포로’로 한정하여 공동체의 회복이라는 넓은 의미를 좁힙니다. 또한 원문은 다음 절로 이어지는 시간 종속절인데 ‘때입니다’로 독립 완결문을 만들었습니다.
  naturalness: ‘그날들과 그때에’는 띄어쓰기와 병렬 표현 면에서 ‘그 날들과 그 때에’가 더 자연스럽습니다. ‘포로를 다시 돌리다’는 현대 한국어에서 부자연스럽고 목적어의 지시도 불분명합니다. 본문의 미완결 구문은 쉼표로 유지하는 편이 원문의 연결을 충실히 반영합니다.
  terminology: 유다와 예루살렘은 표준 표기를 유지합니다. שׁוּב אֶת־שְׁבוּת는 본문에서 ‘형편을 회복하다’로 관용적 의미를 옮기고, 포로·포로 상태 관련 대안은 각주에 보존하는 것이 영어 POB의 선택 및 히브리어의 의미 범위에 부합합니다.
