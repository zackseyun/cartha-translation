base_translation:
  language: en
  yaml_path: translation/ot/joel/004/001.yaml
  text: For behold[a], in those days and at that time, when I restore the fortunes of Judah and Jerusalem,
  footnotes:
  - marker: a
    text: Or, 'when I restore the captivity of Judah and Jerusalem' or 'when I bring back the captives of Judah and Jerusalem.' The Hebrew expression is an idiom for restoring a people from distress, often with exile in view.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 참으로 그 날들과 그 때에, 내가 유다와 예루살렘의 형편을 회복할[a] 때에,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다와 예루살렘의 포로 상태를 되돌릴’ 또는 ‘유다와 예루살렘의 포로들을 돌아오게 할’. 이 히브리어 표현은 고난이나 억압에서 공동체의 형편을 회복한다는 뜻의 관용구이며, 흔히 포로 생활로부터의 귀환을 염두에 둡니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / הִנֵּה
  english_pob_choice: For behold
  chosen_korean: 보라
  alternatives_korean:
  - 이는
  - 보십시오
  lexicon: HALOT
  rationale: 예언 문맥의 주의 환기와 긴박감을 살리되, 한국어에서는 앞선 원인 접속사와 감탄표지를 한 번에 자연스럽게 드러내는 ‘보라’가 가장 압축적입니다.
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  english_pob_choice: in those days, and at that time
  chosen_korean: 그날들과 그때에
  alternatives_korean:
  - 그 날들에, 그 때에
  - 그 시절과 그때에
  lexicon: HALOT
  rationale: 평행한 시간표현을 한국어에서도 중첩된 종말론적 시점으로 전달하기 위해 직역에 가깝게 옮겼습니다.
- source_word: אֲשֶׁר אשוב אֶת שְׁבֻת
  english_pob_choice: when I restore the fortunes
  chosen_korean: 내가 … 포로를 다시 돌릴 때입니다
  alternatives_korean:
  - 내가 … 포로 됨을 회복할 때입니다
  - 내가 … 포로를 돌아오게 할 때입니다
  lexicon: HALOT
  rationale: POB의 각주가 밝히듯 이 표현은 ‘포로/포로 상태’와 관련된 관용구이므로, 본문에서는 ‘포로를 다시 돌리다’로 옮겨 관용적 의미와 포로 귀환의 배경을 함께 보존했습니다.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  english_pob_choice: Judah and Jerusalem
  chosen_korean: 유다와 예루살렘
  alternatives_korean:
  - 유다와 예루살렘성
  - 유다와 예루살렘 사람들
  lexicon: HALOT
  rationale: 고유명사는 표준 음역을 따르고, 병렬 목적어로서 공동체와 중심 도시를 함께 지시하는 구문을 그대로 살렸습니다.
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת의 의미 범위
  chosen_reading: 본문은 ‘포로를 다시 돌리다’로 옮겨 포로 귀환과 회복의 이중 뉘앙스를 열어 둡니다.
  alternative_readings:
  - 포로 상태를 회복하다
  - 운명을 회복하다
  rationale: 히브리어 관용구는 단순한 심리적 회복보다 포로 귀환을 포함할 수 있으므로, 한국어에서도 지나치게 추상화하지 않고 역사적 회복의 방향을 보존하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
