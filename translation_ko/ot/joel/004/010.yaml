id: JOL.4.10
reference: Joel 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤תּוּ אִתֵּי/כֶם֙ לַֽ/חֲרָב֔וֹת וּ/מַזְמְרֹֽתֵי/כֶ֖ם לִ/רְמָחִ֑ים הַֽ/חַלָּ֔שׁ יֹאמַ֖ר גִּבּ֥וֹר אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/010.yaml
  text: Beat your plowshares into swords[a], and your pruning hooks into spears; let the weak say[b], “I am a warrior.”
  footnotes:
  - marker: a
    text: This reverses the imagery of Isa 2:4 and Mic 4:3, where weapons are beaten into farming tools.
    reason: cross_reference
  - marker: b
    text: Or “I am mighty,” “I am strong.” The Hebrew גִּבּוֹר can denote a mighty man, strong man, or warrior; here the military context favors “warrior.”
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 농기구를 칼로, 너희 전정가지를 창으로 쳐 만드십시오. 약한 자도 “나는 용사입니다”라고 말하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이미지는 이사야 2:4와 미가 4:3의 “칼을 쳐서 보습을 만들며”라는 평화의 표현을 거꾸로 뒤집습니다.
    reason: cross_reference
  - marker: b
    text: 또는 “나는 강합니다”, “나는 힘이 셉니다.” 히브리어 גִּבּוֹר은 용사, ძლ한 자, 강한 자를 뜻할 수 있는데, 여기서는 전투 문맥상 “용사”가 가장 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתּוּ / אִתֵּיכֶם
  english_pob_choice: Beat your plowshares
  chosen_korean: 너희는 농기구를 칼로 쳐 만드십시오
  alternatives_korean:
  - 너희는 쟁기를 칼로 바꾸십시오
  - 너희는 쟁지날을 칼로 두드리십시오
  lexicon: HALOT
  rationale: WLC의 כֹּתּוּ는 ‘쳐서 부수다/만들다’의 구체적 동작이고, אִתֵּיכֶם은 농사 도구를 가리키므로, 한국어에서는 이미지가 자연스럽게 살아나는 ‘쳐 만드십시오’를 택했습니다.
- source_word: וּמַזְמְרֹתֵיכֶם
  english_pob_choice: and your pruning hooks
  chosen_korean: 너희 전정가지를
  alternatives_korean:
  - 너희 가지치기 칼을
  - 너희 가지치기 낫을
  lexicon: HALOT
  rationale: מַזְמֵרָה는 포도나무를 치는 전정 도구이므로, 한국어 성경 문맥에서 이해되기 쉬운 ‘전정가지’로 옮겼습니다.
- source_word: לַחֲרָבוֹת / לִרְמָחִים
  english_pob_choice: into swords ... into spears
  chosen_korean: 칼로 ... 창으로
  alternatives_korean:
  - 칼날로 ... 창으로
  - 검으로 ... 창으로
  lexicon: HALOT
  rationale: חֲרָבוֹת와 רְמָחִים은 각각 무기 전환의 대상이므로, 현대 한국어에서 즉시 이해되는 ‘칼’과 ‘창’이 원문의 전투적 대비를 가장 분명하게 드러냅니다.
- source_word: גִּבּוֹר
  english_pob_choice: a warrior
  chosen_korean: 용사
  alternatives_korean:
  - 강한 사람
  - 장사
  - 영웅
  lexicon: HALOT
  rationale: גִּבּוֹר는 단순한 ‘강함’보다 전투 가능한 ‘용사/전사’의 뜻이 강하므로, 문맥상 ‘나는 용사입니다’가 가장 적절합니다.
theological_decisions:
- issue: 예언적 역전 이미지의 보존
  chosen_reading: 평화의 상징인 농기구를 무기로 바꾸라는 명령으로 옮겨, 이사야 2:4/미가 4:3의 반전을 독자가 바로 알아차리게 했습니다.
  alternative_readings:
  - 이미지를 완화하여 일반적인 전쟁 준비 진술로 옮김
  - 농기구와 무기의 대응을 약화시킴
  rationale: 본문은 의도적으로 익숙한 평화 예언의 이미지를 뒤집고 있으므로, 이를 한국어 본문에서 유지하는 것이 원문의 수사와 심판 맥락을 보존합니다.
  doctrine_reference: 원문 우선 원칙; 본문 상호참조적 긴장을 보존
