id: JOL.4.9
reference: Joel 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קִרְאוּ זֹאת֙ בַּ/גּוֹיִ֔ם קַדְּשׁ֖וּ מִלְחָמָ֑ה הָעִ֨ירוּ֙ הַ/גִּבּוֹרִ֔ים יִגְּשׁ֣וּ יַֽעֲל֔וּ כֹּ֖ל אַנְשֵׁ֥י הַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/009.yaml
  text: 'Proclaim this among the nations: Consecrate war; stir up the warriors[a]. Let all the men of war draw near; let them come up.'
  footnotes:
  - marker: a
    text: Or 'Prepare for war.' Hebrew 'Consecrate war' uses cultic language for setting battle apart.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 여러 민족 가운데서 선포하십시오. 전쟁을 거룩히 구별하십시오. 용사들을 깨우십시오. 전쟁의 모든 사람은 가까이 오게 하십시오. 올라오게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁을 준비하십시오.’ 히브리어 ‘전쟁을 거룩히 구별하십시오’는 전투를 따로 떼어 세우는 예배적 언어를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְאוּ זֹאת
  english_pob_choice: Proclaim this
  chosen_korean: 이것을 … 선포하십시오
  alternatives_korean:
  - 이것을 … 외치십시오
  - 이것을 … 알리십시오
  lexicon: HALOT
  rationale: קרא의 공적인 선언 의미를 살려, 단순한 외침보다 공식적이고 공개적인 ‘선포하십시오’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 여러 민족 가운데서
  alternatives_korean:
  - 나라들 가운데서
  - 민족들 가운데서
  lexicon: HALOT
  rationale: 여기서 גּוֹיִם은 이방 민족 전체를 가리키므로, NT식 ‘이방인’보다 문맥에 맞는 ‘여러 민족’이 자연스럽습니다.
- source_word: קַדְּשׁוּ מִלְחָמָה
  english_pob_choice: Consecrate war
  chosen_korean: 전쟁을 거룩히 구별하십시오
  alternatives_korean:
  - 전쟁을 성별하십시오
  - 전쟁을 준비하십시오
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 ‘거룩하게 구별하다’이므로, 단순 준비로 완화하지 않고 예배적·성별적 뉘앙스를 살렸습니다.
- source_word: הָעִירוּ הַגִּבּוֹרִים
  english_pob_choice: stir up the warriors
  chosen_korean: 용사들을 깨우십시오
  alternatives_korean:
  - 전사들을 격동시키십시오
  - 용사들을 일으키십시오
  lexicon: HALOT
  rationale: העיר는 ‘깨우다, 불러일으키다’의 사역형이므로, 전투적 호소를 살리는 ‘깨우십시오’가 적절합니다.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: all the men of war
  chosen_korean: 전쟁의 모든 사람
  alternatives_korean:
  - 전쟁의 모든 전사
  - 전쟁에 속한 모든 남자
  lexicon: HALOT
  rationale: 히브리어의 남성형 표현을 그대로 드러내되, 현대 한국어에서 과도하게 낡은 관용구를 피하기 위해 직역적 구조를 유지했습니다.
theological_decisions:
- issue: קדשׁ를 전쟁 준비로 약화할지, 거룩한 구별로 살릴지
  chosen_reading: ‘전쟁을 거룩히 구별하십시오’로 본문에서 cultic force를 유지합니다.
  alternative_readings:
  - 전쟁을 준비하십시오
  - 전쟁을 성별하십시오
  rationale: 예언서의 전쟁 소집은 단순 군사 동원 이상의 언어를 사용하므로, 성별/거룩 구별의 긴장을 지우지 않는 번역이 원문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3, §5
