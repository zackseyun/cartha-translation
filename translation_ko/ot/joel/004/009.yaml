  source_fidelity: 대체로 충실합니다. קִרְאוּ, בַּגּוֹיִם, קַדְּשׁוּ, הָעִירוּ의 명령형 흐름과, 뒤의 두 청유형(‘가까이 오게 하십시오/올라오게 하십시오’)을 잘 반영합니다. 다만 ‘전쟁의 모든 사람’은 אַנְשֵׁי הַמִּלְחָמָה(전투에 속한 사람들, 곧 전사들)를 한국어에서 부자연스럽고 불명확하게 전달합니다.
  naturalness: ‘전쟁의 모든 사람은’은 현대 표준 한국어의 자연스러운 군사 표현이 아닙니다. ‘모든 전사’가 문맥상 전투원을 분명히 가리키며 자연스럽습니다. 또한 각주 표지는 해당 표현인 ‘전쟁을 거룩히 구별하십시오’ 바로 뒤에 두는 편이 연결 관계를 명확히 합니다.
