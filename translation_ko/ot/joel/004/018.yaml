  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא יִטְּפ֧וּ הֶ/הָרִ֣ים עָסִ֗יס וְ/הַ/גְּבָעוֹת֙ תֵּלַ֣כְנָה חָלָ֔ב וְ/כָל אֲפִיקֵ֥י יְהוּדָ֖ה יֵ֣לְכוּ מָ֑יִם וּ/מַעְיָ֗ן מִ/בֵּ֤ית יְהוָה֙ יֵצֵ֔א וְ/הִשְׁקָ֖ה אֶת נַ֥חַל הַ/שִּׁטִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/018.yaml
  text: And in that day the mountains will drip sweet wine[a], and the hills will flow with milk, and all the streambeds of Judah will flow with water; and a spring will come out from the house of Yahweh and will water the Valley of Shittim.
  footnotes:
  - marker: a
    text: Or, “the valley of acacias” or “the Wadi of the Acacias.”
    reason: alternative_reading
translation:
  language: ko
  text: 그날에 산들이 달콤한 포도즙을 흘리고, 언덕들은 젖을 흘리며, 유다의 모든 시내들은 물로 흘러가고, 야훼의 집에서 샘이 나와 시띰 골짜기에 물을 대겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아카시아 골짜기” 혹은 “아카시아의 와디”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  english_pob_choice: And in that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날이 오면
  - 그날에 그러할 것입니다
  lexicon: HALOT
  rationale: 예언적 미래를 여는 관용구로서 한국어에서는 간결한 시간 표지 ‘그날에’가 가장 자연스럽고, 영어의 종결 감탄을 과도하게 옮기지 않습니다.
- source_word: יִטְּפוּ הֶהָרִים עָסִיס
  english_pob_choice: the mountains will drip sweet wine
  chosen_korean: 산들이 달콤한 포도즙을 흘리고
  alternatives_korean:
  - 산들이 새 포도즙을 흘리고
  - 산들이 달콤한 술을 흘리고
  lexicon: HALOT
  rationale: עָסִיס는 막 짜낸 포도즙/새 포도즙의 뜻이므로, 현대 한국어에서 의미가 분명한 ‘포도즙’으로 옮기되 풍성함을 살리기 위해 ‘달콤한’을 붙였습니다.
- source_word: וְהַגְּבָעוֹת תֵּלַכְנָה חָלָב
  english_pob_choice: and the hills will flow with milk
  chosen_korean: 언덕들은 젖을 흘리며
  alternatives_korean:
  - 언덕들은 우유를 흘리며
  - 언덕들은 젖이 흐르며
  lexicon: HALOT
  rationale: 히브리어의 ‘가다’ 동사는 문맥상 풍성하게 흐름을 뜻하므로 ‘흘리다’로 옮겼고, חָלָב는 성경적 이미지에 맞게 ‘젖’이 가장 직접적입니다.
- source_word: וְכָל אֲפִיקֵי יְהוּדָה יֵלְכוּ מָיִם
  english_pob_choice: and all the streambeds of Judah will flow with water
  chosen_korean: 유다의 모든 시내들은 물로 흘러가고
  alternatives_korean:
  - 유다의 모든 시내 골짜기들은 물로 흐르고
  - 유다의 모든 골짜기들은 물로 흐르고
  lexicon: HALOT
  rationale: אֲפִיקֵי는 건천의 골짜기/시내 바닥을 가리키므로 ‘시내들’로 압축해도 이미지가 유지되며, ‘물로 흘러가고’는 앞뒤 평행을 살립니다.
- source_word: מַעְיָן מִבֵּית יְהוָה
  english_pob_choice: a spring will come out from the house of Yahweh
  chosen_korean: 야훼의 집에서 샘이 나와
  alternatives_korean:
  - 야훼의 집에서 샘이 솟아나와
  - 야훼의 집으로부터 샘이 나와
  lexicon: HALOT
  rationale: מַעְיָן은 자연 샘이므로 ‘샘’이 가장 직접적이며, מִבֵּית는 출처를 나타내어 ‘야훼의 집에서’로 옮겼습니다.
- source_word: נַחַל הַשִּׁטִּים
  english_pob_choice: the Valley of Shittim
  chosen_korean: 시띰 골짜기에
  alternatives_korean:
  - 시띰 골짜기를
  - 아카시아 골짜기에
  lexicon: HALOT
  rationale: 영어 POB가 지명 ‘Shittim’을 본문에 유지하므로, 한국어도 표준 음역 ‘시띰’을 살려 지명성을 보존했습니다.
theological_decisions:
- issue: YHWH(יְהוָה)의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 이름표시를 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 프로젝트 기본값대로 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 시띰(הַשִּׁטִּים)의 지명성 유지
  chosen_reading: 시띰 골짜기
  alternative_readings:
  - 아카시아 골짜기
  - 아카시아 나무 골짜기
  rationale: 문맥상 지명으로 읽는 전통과 영어 POB의 보존 선택을 따라, 식물 일반명으로 평탄화하지 않고 지명적 여운을 살렸습니다.
  doctrine_reference: POB lexical note on נַחַל הַשִּׁטִּים
