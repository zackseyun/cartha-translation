  to: 그날에는 산들이 단 포도주를 흘리고, 언덕들에서는 젖이 흐르며, 유다의 모든 물길에는 물이 흐를 것입니다. 또 야훼의 집에서 샘이 솟아나 싯딤 골짜기에 물을 댈 것입니다.[a]
  rationale: 미래 예언의 서술을 일관된 합쇼체로 정비하고, 물길과 물의 관계를 자연스럽게 바로잡았습니다. 샘이 물을 공급하는 주체임을 3인칭 미래형으로 회복했으며, עָסִיס와 שִׁטִּים의 번역은 영어 POB의 선택 및 한국어 성서 관용을 고려하되 싯딤의 대안적 어원·번역 가능성은 각주에 보존했습니다.
