  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָכַרְתִּ֞י אֶת בְּנֵי/כֶ֣ם וְ/אֶת בְּנֽוֹתֵי/כֶ֗ם בְּ/יַד֙ בְּנֵ֣י יְהוּדָ֔ה וּ/מְכָר֥וּ/ם לִ/שְׁבָאיִ֖ם אֶל גּ֣וֹי רָח֑וֹק כִּ֥י יְהוָ֖ה דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/008.yaml
  text: And I will sell your sons and your daughters into the hand of the sons of Judah[a], and they will sell them to the Sabeans, to a distant nation[b]; for Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or 'to a far-off nation.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the Sabeans,' that is, the people of Sheba.
    reason: cultural_note
translation:
  language: ko
  text: 내가 너희의 아들들과 딸들을 유다의 아들들의 손에 넘겨 팔 것이며, 그들이 그것들을 사베 사람들에게, 먼 나라로 팔 것이니, 이는 야훼께서 말씀하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼 나라로’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사베 사람들’, 곧 스바의 사람들입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמָכַרְתִּי
  english_pob_choice: And I will sell
  chosen_korean: 내가 … 넘겨 팔 것이며
  alternatives_korean:
  - 내가 팔 것이며
  - 내가 넘겨주어 팔 것이며
  lexicon: HALOT
  rationale: 히브리어 מכר의 핵심인 ‘팔다’를 살리되, 문맥상 심판의 역전을 드러내기 위해 ‘넘겨 팔다’로 자연스럽게 옮겼습니다.
- source_word: בְּנֵיכֶם ... בְּנוֹתֵיכֶם
  english_pob_choice: your sons and your daughters
  chosen_korean: 너희의 아들들과 딸들
  alternatives_korean:
  - 너희 자녀들
  lexicon: HALOT
  rationale: 원문이 남녀 자식을 분명히 구별하므로 ‘자녀들’로 중화하지 않고 ‘아들들과 딸들’로 보존했습니다.
- source_word: בְּנֵי יְהוּדָה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다의 아들들의 손에
  alternatives_korean:
  - 유다 사람들의 손에
  - 유다 자손의 손에
  lexicon: HALOT
  rationale: 문자적으로 ‘유다의 아들들’이라는 친족 표현을 유지해, 뒤이어 이어지는 되팔기 이미지와 연결되도록 했습니다.
- source_word: שְׁבָאִים
  english_pob_choice: the Sabeans
  chosen_korean: 사베 사람들
  alternatives_korean:
  - 스바 사람들
  - 스바인들
  lexicon: HALOT
  rationale: 히브리어가 가리키는 것은 스바의 사람들로, 한국어 외래어 표기 관행을 따라 ‘사베 사람들’로 옮겼습니다.
- source_word: גּוֹי רָחוֹק
  english_pob_choice: a distant nation
  chosen_korean: 먼 나라
  alternatives_korean:
  - 먼 민족
  - 먼 나라 백성
  lexicon: HALOT
  rationale: גּוֹי는 ‘나라/민족’ 범위를 가지지만, 현대 한국어에서는 ‘먼 나라’가 자연스럽고 원문의 거리감을 잘 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본 기록의 기본 용례에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용해 신명 자체를 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 직접 신명기적 언약 სახელ이 아니라 יְהוָה를 사용하므로, POB 기준에 맞춰 ‘야훼’로 옮겨 신적 발화의 특정성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
