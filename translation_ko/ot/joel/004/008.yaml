revisions:
- from: 내가 너희의 아들들과 딸들을 유다의 아들들의 손에 넘겨 팔 것이며, 그들이 그것들을 사베 사람들에게, 먼 나라로 팔 것이니, 이는 야훼께서 말씀하셨기 때문입니다.[a][b]
  to: 내가 너희의 아들들과 딸들을 유다 자손의 손에 팔아넘길 것이며, 그들은 그들을 먼 나라의 스바 사람들에게[b] 팔 것입니다.[a] 이는 야훼께서 말씀하셨기 때문입니다.
  rationale: 인신 매매라는 원문의 कठोर한 보복 이미지를 완화하지 않고 ‘팔아넘기다/팔다’로 보존했습니다. 사람 지시 대명사, 스바의 표준 표기, 그리고 ‘먼 나라’와 스바 사람들의 관계를 바로잡았으며, 각주 표지를 해당 낱말에 배치했습니다.
