source:
  edition: WLC
  text: הִנְ/נִ֣י מְעִירָ֔/ם מִן הַ֨/מָּק֔וֹם אֲשֶׁר מְכַרְתֶּ֥ם אֹתָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִׁבֹתִ֥י גְמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/007.yaml
  text: Look[a], I am stirring them up from the place where you sold them[b], and I will return your recompense on your own head.
  footnotes:
  - marker: a
    text: Or 'I am rousing them up.' The Hebrew verb can mean 'awaken,' 'rouse,' or 'stir up.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will repay you'; literally, 'I will return your recompense on your head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 내가 그들을 당신들이 그들을 판 곳에서 일으키며, 당신들의 보응을 당신들의 머리 위에 되돌리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 깨우며’라는 뜻일 수 있습니다. 히브리어 동사는 ‘깨우다’, ‘일으키다’, ‘자극하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신들에게 갚아주겠습니다’라는 뜻일 수 있습니다. 문자적으로는 ‘당신들의 보응을 당신들의 머리 위에 되돌리겠습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look, I
  chosen_korean: 보라, 내가
  alternatives_korean:
  - 보십시오, 제가
  - 보시라, 내가
  lexicon: HALOT
  rationale: 주의를 끄는 신적 선언의 도입부로서, 현대 한국어에서 자연스럽고 긴박한 ‘보라’가 영어 POB의 ‘Look’ 기능을 가장 잘 살립니다.
- source_word: מְעִירָם
  english_pob_choice: am stirring them up
  chosen_korean: 그들을 … 일으키며
  alternatives_korean:
  - 그들을 … 깨우며
  - 그들을 … 불러 일으키며
  lexicon: HALOT
  rationale: עור의 히필은 ‘깨우다/일으키다/자극하다’의 범위를 가지므로, 여기서는 포로 상태에서의 출현과 귀환을 드러내는 중립적 동사 ‘일으키다’가 적합합니다.
- source_word: גְמֻלְכֶם
  english_pob_choice: your recompense
  chosen_korean: 당신들의 보응
  alternatives_korean:
  - 당신들의 보상
  - 당신들이 받은 대가
  lexicon: HALOT
  rationale: גמול은 단순한 금전적 보상이 아니라 행위에 대한 상응한 되갚음이라는 보복적 뉘앙스를 가지므로, ‘보응’이 이를 가장 압축적으로 살립니다.
- source_word: בְּרֹאשְׁכֶם
  english_pob_choice: on your own head
  chosen_korean: 당신들의 머리 위에
  alternatives_korean:
  - 당신들 자신의 머리 위에
  - 그 머리 위에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 되갚음이 죄인에게 되돌아오는 이미지를 유지했습니다. 한국어에서는 ‘머리 위에’가 자연스러운 재앙/책임 귀속 표현입니다.
theological_decisions:
- issue: ‘그들을 일으키며’의 범위
  chosen_reading: 하나님이 흩어져 팔린 사람들을 그 처지에서 밖으로 불러내어 돌아오게 하시는 적극적 행위로 이해했습니다.
  alternative_readings:
  - 단순히 감정적으로 깨우시는 뜻
  - 군사적으로 선동하시는 뜻
  rationale: 문맥이 ‘그들을 판 곳에서’라는 구체적 장소를 제시하므로, 내면 각성이나 군사 동원으로 좁히지 않고 귀환을 가능케 하는 하나님의 적극적 개입으로 옮기는 것이 가장 정확합니다.
  doctrine_reference: 포로 회복과 하나님의 주권적 심판
- issue: ‘보응’을 ‘머리 위에 되돌리겠습니다’로 옮김
  chosen_reading: 죄에 상응하는 되갚음이 그 행위자에게 되돌아온다는 보복적 정의를 보존했습니다.
  alternative_readings:
  - 단순히 ‘벌하겠다’로 의역
  - ‘갚아주겠다’로 중립화
  rationale: 히브리어는 추상적 처벌어보다 구체적 ‘보응’을 되돌리는 이미지이므로, 문장의 도덕적 대칭성과 심판의 긴장을 그대로 살리는 것이 좋습니다.
  doctrine_reference: 하나님의 공의와 응보
