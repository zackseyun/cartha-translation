source:
  edition: WLC
  text: וַ/יהוָ֞ה מִ/צִּיּ֣וֹן יִשְׁאָ֗ג וּ/מִ/ירוּשָׁלִַ֨ם֙ יִתֵּ֣ן קוֹל֔/וֹ וְ/רָעֲשׁ֖וּ שָׁמַ֣יִם וָ/אָ֑רֶץ וַֽ/יהוָה֙ מַֽחֲסֶ֣ה לְ/עַמּ֔/וֹ וּ/מָע֖וֹז לִ/בְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/016.yaml
  text: And Yahweh roars from Zion and gives his voice from Jerusalem[a], and the heavens and the earth quake; but Yahweh is a refuge for his people[b], and a stronghold for the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'utters his voice.' The Hebrew literally says 'gives his voice,' an idiom for speaking loudly or thunderously.
    reason: lexical_alternative
  - marker: b
    text: Or more idiomatically, 'for the children of Israel' or 'for the people of Israel.' The Hebrew reads 'for the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 시온에서 포효하시고 예루살렘에서 그의 음성을 내십니다[a]. 하늘과 땅이 흔들립니다. 그러나 야훼께서는 자기 백성에게 피난처가 되시고 이스라엘 자손에게 요새가 되십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 음성을 발하십니다’. 히브리어는 문자적으로 ‘그의 음성을 주다’라고 하며, 크게 또는 천둥처럼 말한다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 더 직역하여 ‘이스라엘의 아들들에게’. 히브리어는 문자 그대로 ‘이스라엘의 아들들’이라고 합니다. ‘이스라엘 자손’은 한국어의 관용적인 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙대로 신적 이름 YHWH는 관용적 대체어가 아니라 음역형인 ‘야훼’로 옮겨, 언약 이름의 식별성을 살렸습니다.
- source_word: יִשְׁאָג
  english_pob_choice: roars
  chosen_korean: 부르짖으시고
  alternatives_korean:
  - 우르르 울리시고
  - 포효하시고
  lexicon: HALOT
  rationale: שור의 짐승 같은 강한 울부짖음을 한국어에서 자연스럽게 드러내는 동사로 ‘부르짖다’를 택해, 단순 발화보다 더 강한 음성을 살렸습니다.
- source_word: יִתֵּן קוֹלוֹ
  english_pob_choice: gives his voice
  chosen_korean: 그의 소리를 내십니다
  alternatives_korean:
  - 그의 음성을 내십니다
  - 그의 소리를 발하십니다
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘그의 소리를 주다’이지만, 한국어에서는 관용적으로 ‘소리를 내다’가 가장 가깝고, 강한 음성의 표현도 유지합니다.
- source_word: שָׁמַיִם וָאָרֶץ
  english_pob_choice: the heavens and the earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘들과 땅
  - 천지
  lexicon: HALOT
  rationale: 시적 평행을 살리면서도 현대 한국어에서 자연스러운 우주적 총칭인 ‘하늘과 땅’으로 옮겼습니다.
- source_word: מַחֲסֶה
  english_pob_choice: a refuge
  chosen_korean: 피난처
  alternatives_korean:
  - 피난소
  - 도피처
  lexicon: HALOT
  rationale: 보호와 숨김의 의미를 지닌 מַחֲסֶה를 한국어에서 가장 직접적으로 드러내는 ‘피난처’로 번역했습니다.
- source_word: מָעוֹז
  english_pob_choice: a stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 산성
  - 견고한 성
  lexicon: HALOT
  rationale: 피난처와 대구를 이루는 방어적 이미지로서 ‘요새’가 현대 한국어에서 가장 간결하고 힘 있게 대응합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 형태를 보존하되, 한국어에서는 성별 표지가 과도하지 않으면서도 원문 형식을 반영하는 관용형 ‘이스라엘 자손’을 택했습니다.
theological_decisions:
- issue: 여호와/야훼의 현현 음성 묘사
  chosen_reading: 야훼께서 시온에서 부르짖으시고 예루살렘에서 그의 소리를 내십니다
  alternative_readings:
  - 야훼께서 시온에서 포효하시고…
  - 야훼께서 시온에서 말씀하시고…
  rationale: 이 절은 단순 정보 전달이 아니라 시온에서 들려오는 신현적 음성을 강조하므로, 약화된 ‘말씀하시고’보다 강한 음성 이미지가 드러나는 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2; divine self-disclosure in prophetic theophany
- issue: 문장 종결의 대조 관계
  chosen_reading: 하늘과 땅이 흔들리지만, 야훼께서는 그의 백성에게 피난처가 되시며…
  alternative_readings:
  - 하늘과 땅이 흔들리고 야훼께서는…
  - 그러나 야훼께서는…
  rationale: 원문의 대조는 우주적 심판의 진동 속에서도 언약 백성에 대한 보호를 강조하므로, 한국어에서도 ‘지만’으로 전환해 긴장을 선명하게 살렸습니다.
  doctrine_reference: DOCTRINE.md Poetic parallelism and contrast
