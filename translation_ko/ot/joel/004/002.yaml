source:
  edition: WLC
  text: וְ/קִבַּצְתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וְ/ה֣וֹרַדְתִּ֔י/ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט וְ/נִשְׁפַּטְתִּ֨י עִמָּ֜/ם שָׁ֗ם עַל עַמִּ֨/י וְ/נַחֲלָתִ֤/י יִשְׂרָאֵל֙ אֲשֶׁ֣ר פִּזְּר֣וּ בַ/גּוֹיִ֔ם וְ/אֶת אַרְצִ֖/י חִלֵּֽקוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/002.yaml
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat[a], and there I will enter into judgment with them on behalf of my people and my inheritance, Israel[b], whom they scattered among the nations and divided up my land.
  footnotes:
  - marker: a
    text: Or 'because of my people and my inheritance, Israel' or 'concerning my people and my inheritance, Israel.' The Hebrew preposition can be understood in more than one closely related judicial sense.
    reason: alternative_reading
  - marker: b
    text: '''The Valley of Jehoshaphat'' is a place name; the name itself may echo the idea ''the LORD judges.'''
    reason: cultural_note
translation:
  language: ko
  text: 내가 모든 나라를 모아 여호사밧 골짜기로 내려보내고, 거기서 그들과 더불어 내 백성과 내 기업 이스라엘에 관하여 판결하겠습니다. 그들은 그들을 나라들 가운데에 흩어 버렸고, 내 땅을 나누어 가졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호사밧 골짜기’는 지명입니다. 이름 자체는 ‘야훼께서 심판하신다’는 뜻을 떠올리게 할 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 전치사 עַל은 이 문맥에서 ‘~에 관하여’, ‘~때문에’, ‘~을 두고’ 등으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קִבַּצְתִּי
  english_pob_choice: I will gather
  chosen_korean: 모아
  alternatives_korean:
  - 모으겠습니다
  - 집결시키겠습니다
  lexicon: HALOT
  rationale: קבץ의 기본 의미인 ‘모으다/모이다’를 자연스러운 한국어로 옮겼습니다. 군사적·재판적 소집의 뉘앙스는 다음 절의 판결 문맥이 보완합니다.
- source_word: הוֹרַדְתִּים
  english_pob_choice: bring them down
  chosen_korean: 내려보내고
  alternatives_korean:
  - 끌어내리고
  - 내려가게 하고
  lexicon: HALOT
  rationale: 히필의 사역적 방향성을 살리면서, ‘골짜기’와 결합하는 한국어로는 ‘내려보내다’가 가장 자연스럽습니다.
- source_word: עַל עַמִּי וְנַחֲלָתִי יִשְׂרָאֵל
  english_pob_choice: on behalf of my people and my inheritance, Israel
  chosen_korean: 내 백성과 내 기업 이스라엘에 관하여
  alternatives_korean:
  - 내 백성과 내 기업 이스라엘 때문에
  - 내 백성과 내 기업 이스라엘에 대하여
  lexicon: HALOT
  rationale: עַל의 법정적·주제적 범위를 살려 ‘~에 관하여’로 옮겼습니다. ‘내 기업’은 נַחֲלָה의 언약적 소유 개념을 유지합니다.
- source_word: חִלֵּקוּ
  english_pob_choice: divided up
  chosen_korean: 나누어 가졌습니다
  alternatives_korean:
  - 분할했습니다
  - 나누었습니다
  lexicon: HALOT
  rationale: 단순한 분리가 아니라 실제 점유를 동반한 분할임을 드러내기 위해 ‘나누어 가졌다’로 옮겼습니다. 한국어에서는 결과를 드러내는 표현이 가장 분명합니다.
theological_decisions:
- issue: 여호사밧 골짜기 지명 처리
  chosen_reading: 여호사밧 골짜기
  alternative_readings:
  - 야훼가 심판하시는 골짜기
  - 주께서 심판하시는 골짜기
  rationale: 본문은 지명으로 제시하므로 음역을 유지했습니다. 이름의 어원적 함의는 본문 밖의 해설로 남기는 편이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §2 (proper nouns as toponyms unless the text itself explicates the meaning)
- issue: 판결 동사의 법정적 뉘앙스
  chosen_reading: 판결하겠습니다
  alternative_readings:
  - 심판하겠습니다
  - 송사하겠습니다
  rationale: נשפטתי עם는 단순 선언보다 법정적 판결/다툼의 성격을 가지므로, 현대 한국어에서는 ‘판결하다’가 그 절차성과 공적 판단을 가장 균형 있게 드러냅니다.
  doctrine_reference: Translation philosophy §3 (preserve juridical tension rather than flatten it)
