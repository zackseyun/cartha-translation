revisions:
- from: 내가 모든 나라를 모아 여호사밧 골짜기로 내려보내고, 거기서 그들과 더불어 내 백성과 내 기업 이스라엘에 관하여 판결하겠습니다. 그들은 그들을 나라들 가운데에 흩어 버렸고, 내 땅을 나누어 가졌습니다.[a][b]
  to: 내가 모든 나라를 모아 여호사밧 골짜기[a]로 내려보내고, 거기서 내 백성, 곧 내 유산인 이스라엘[b]을 두고 그들과 재판을 벌이겠습니다. 그들이 이스라엘을 나라들 가운데 흩어 버리고 내 땅을 나누었기 때문입니다.
  rationale: 원문의 법정적 표현과 관계절의 지시 대상을 분명히 하고, ‘나누어 가졌다’가 추가하던 점유 의미를 제거했습니다. ‘내 유산인 이스라엘’은 נַחֲלָה의 상속·소유 언어를 유지하면서 현대 표준어에서 ‘내 기업 이스라엘’보다 자연스럽게 다듬은 것입니다. עַל의 해석상 열려 있는 범위는 본문에서 ‘~을 두고’로 절제하여 옮기고 각주에 대안을 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:40Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 משפט עם(‘그들과 재판/법적 다툼을 벌이다’)는 단순히 그들을 대상으로 판결을 선고한다는 뜻보다 법정적 대결의 뉘앙스를 지닙니다. 또한 관계절의 목적어는 이스라엘이며, חִלֵּקוּ는 땅을 ‘나누었다/분할했다’는 뜻이지 점유 결과를 명시하지 않습니다.
  naturalness: 초안의 ‘그들과 더불어 … 판결하겠습니다’는 현대 한국어에서 다소 부자연스럽고, 이어지는 ‘그들은 그들을’은 두 대상을 식별할 수 없습니다. ‘그들과 … 재판을 벌이겠습니다’ 및 ‘그들이 이스라엘을’이 자연스럽고 분명합니다.
  terminology: ‘여호사밧 골짜기’는 지명으로 유지합니다. נַחֲלָה는 현대적으로 이해 가능한 ‘유산’으로 옮기되, 이스라엘이 하나님의 백성이자 유산이라는 동격 관계를 ‘곧’으로 드러냈습니다. עַל의 여러 법정적 의미는 각주에서 보존합니다.
  issues:
  - severity: medium
    issue: ‘그들과 더불어 … 판결하겠습니다’
    rationale: נשפטתי עם은 상대방과 법적 판단/다툼을 수행하는 표현입니다. ‘판결하다’는 한국어에서 주로 사건에 대해 판결을 선고하는 행위를 가리켜 ‘그들과 더불어’와의 결합이 어색합니다.
  - severity: high
    issue: ‘그들은 그들을 나라들 가운데에 흩어 버렸고’
    rationale: 주어인 나라들과 목적어인 이스라엘이 모두 ‘그들’로 표기되어 지시 대상이 불명확합니다. 원문의 관계절은 나라들이 이스라엘을 흩었다는 뜻입니다.
  - severity: medium
    issue: ‘내 땅을 나누어 가졌습니다’
    rationale: חִלֵּקוּ는 ‘나누다, 분할하다’이며, ‘가졌다’는 원문에 명시되지 않은 점유 결과를 덧붙입니다.
  - severity: medium
    issue: 각주 표지가 절 끝에 함께 배치됨
    rationale: 지명 각주와 전치사 עַל의 대안 읽기는 각각 ‘여호사밧 골짜기’와 해당 משפט절에 붙어야 독자가 각주의 대상을 정확히 알 수 있습니다.
