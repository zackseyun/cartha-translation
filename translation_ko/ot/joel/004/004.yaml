reference: Joel 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/גַם מָה אַתֶּ֥ם לִ/י֙ צֹ֣ר וְ/צִיד֔וֹן וְ/כֹ֖ל גְּלִיל֣וֹת פְּלָ֑שֶׁת הַ/גְּמ֗וּל אַתֶּם֙ מְשַׁלְּמִ֣ים עָלָ֔/י וְ/אִם גֹּמְלִ֤ים אַתֶּם֙ עָלַ֔/י קַ֣ל מְהֵרָ֔ה אָשִׁ֥יב גְּמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
  footnotes:
  - marker: a
    text: Or, 'What have you to do with me?' The Hebrew idiom is a confrontational challenge.
    reason: lexical_alternative
  - marker: b
    text: Or 'districts' or 'territories' of Philistia.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 또, 두로와 시돈아, 또 블레셋의 모든 지역아, 너희가 나와 무슨 상관이 있느냐? 너희가 내게 보복을 갚아 주려느냐? 그렇다면 너희가 내게 보복을 갚아 주는 바로 그 일을, 내가 신속하고도 빠르게 너희 머리 위로 되돌려 주겠다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나와 무슨 상관이 있느냐’는 히브리어 관용구로, 강한 대립이나 거절의 뜻을 담고 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘블레셋의 지역’은 ‘지구/영토’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם מָה אַתֶּם לִי
  english_pob_choice: And also, what are you to me
  chosen_korean: 그리고 또 … 너희가 나와 무슨 상관이 있느냐
  alternatives_korean:
  - 너희가 나에게 무슨 상관이 있느냐
  - 너희가 내게 무슨 일인가
  lexicon: HALOT
  rationale: 히브리어 관용구의 대립·도전 뉘앙스를 살리기 위해 관계 단절을 묻는 표현으로 옮겼습니다.
- source_word: צֹר וְצִידוֹן
  english_pob_choice: Tyre and Sidon
  chosen_korean: 두로와 시돈
  alternatives_korean:
  - 티레와 시돈
  - 두로와 시돈
  lexicon: 표준 성경 고유명사
  rationale: 한국어 성경에서 널리 통용되는 지명을 사용했습니다.
- source_word: וְכֹל גְּלִילוֹת פְּלָשֶׁת
  english_pob_choice: and all the regions of Philistia
  chosen_korean: 블레셋의 모든 지역
  alternatives_korean:
  - 블레셋의 모든 지구
  - 블레셋의 모든 영토
  lexicon: HALOT
  rationale: גְּלִילוֹת은 지역/구역의 뜻이므로 ‘지역’이 가장 자연스럽고, פְּלָשֶׁת은 사람보다 땅 이름으로 처리했습니다.
- source_word: הַגְּמוּל / גֹּמְלִים
  english_pob_choice: recompense / repaying
  chosen_korean: 보복을 갚아 주다 / 보복을 갚아 주는
  alternatives_korean:
  - 되갚다
  - 응징하다
  lexicon: HALOT
  rationale: 두 어근의 반복을 살리면서도, 한국어에서 משפט적·보응적 힘이 드러나도록 ‘보복’을 앞세웠습니다.
- source_word: קַל מְהֵרָה
  english_pob_choice: swiftly and quickly
  chosen_korean: 신속하고도 빠르게
  alternatives_korean:
  - 즉시
  - 재빨리
  lexicon: HALOT
  rationale: 중첩된 속도 표현을 둘 다 유지해 긴박감을 살렸습니다.
- source_word: בְּרֹאשְׁכֶם
  english_pob_choice: on your own head
  chosen_korean: 너희 머리 위로
  alternatives_korean:
  - 너희 머리에
  - 너희 머리로
  lexicon: HALOT
  rationale: 히브리 관용구의 결과 귀착 이미지를 살리되, 한국어로는 ‘위로 되돌려 주다’와 함께 자연스럽게 구성했습니다.
theological_decisions:
- issue: 보응의 직접성
  chosen_reading: 하나님의 직접적 보복 선언을 약화하지 않고, 원문의 응보·되돌림 이미지를 그대로 드러냈습니다.
  alternative_readings:
  - 일반적인 결과 진술로 완화
  - 비인격적 인과로 완화
  rationale: 반복된 גמל/גמול과 ‘머리 위로’ 관용구가 심판적 보응을 분명히 말하므로, 이를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 신적 심판의 응보적 성격을 유지
