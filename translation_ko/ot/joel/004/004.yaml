base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
  footnotes:
  - marker: a
    text: Or, 'What have you to do with me?' The Hebrew idiom is a confrontational challenge.
    reason: lexical_alternative
  - marker: b
    text: Or 'districts' or 'territories' of Philistia.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 또, 두로와 시돈과 블레셋의 모든 지역들아[b], 너희가 나와 무슨 상관이 있느냐[a]? 너희가 나에게 보복을 하려 하느냐? 너희가 나에게 보복을 한다면, 내가 신속하게, 지체 없이 너희의 보복을 너희 머리 위에 되갚겠다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나와 무슨 상관이 있느냐’는 히브리어 관용구로, 강한 대립이나 거절의 뜻을 담고 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘지역들’은 ‘지구들’ 또는 ‘영토들’로도 옮길 수 있습니다.
    reason: lexical_alternative
