revisions:
- from: 이집트는 황폐함이 되고, 에돔은 황폐한 광야가 될 것입니다. 이는 유다의 자손들에게 행한 폭력 때문입니다. 그들이 그들의 땅에서 무죄한 피를 흘렸기 때문입니다.[a][b][c]
  to: 이집트는 황폐지가 되고, 에돔은 황폐한 광야가 될 것입니다. 이는 그들이 유다 자손들에게 가한 폭력[a][b]과 유다 자손의 땅에서 무죄한 피[c]를 흘린 일 때문입니다.
  rationale: 대명사의 한국어상 지시 혼동을 피하기 위해 בְּאַרְצָם의 문맥상 선행사인 유다 자손을 ‘유다 자손의 땅’으로 명시했습니다. 이집트와 에돔이 폭력을 가하고 피를 흘린 주체라는 원문의 관계절도 ‘그들이’로 유지했습니다. 각주 표지는 해당 어구 바로 뒤로 옮겼고, 문체와 명사적 표현을 현대 합쇼체에 맞게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:35Z'
