- source_word: חֲמַס בְּנֵי יְהוּדָה
  english_pob_choice: the violence done to the sons of Judah
  chosen_korean: 유다의 자손들에게 행한 폭력
  alternatives_korean:
  - 유다의 자손들에 대한 폭력
  - 유다 자손에게 가한 폭력
  lexicon: HALOT
  rationale: חָמָס는 단순한 ‘폭력’보다 부당하고 잔혹한 폭력을 포함하므로, 한국어에서는 자연스러운 ‘폭력’으로 옮기되 대상 관계를 분명히 했습니다.
- source_word: נָקִיא
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
