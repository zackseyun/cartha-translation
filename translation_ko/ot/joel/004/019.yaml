source:
  edition: WLC
  text: מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה תִֽהְיֶ֔ה וֶ/אֱד֕וֹם לְ/מִדְבַּ֥ר שְׁמָמָ֖ה תִּֽהְיֶ֑ה מֵֽ/חֲמַס֙ בְּנֵ֣י יְהוּדָ֔ה אֲשֶׁר שָׁפְכ֥וּ דָם נָקִ֖יא בְּ/אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/019.yaml
  text: Egypt will become a desolation[a], and Edom a desolate wilderness, because of the violence done to the sons of Judah[c][b], whose innocent blood they shed in their land.
  footnotes:
  - marker: a
    text: Or 'for the violence against the sons of Judah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Judah'; this may function collectively for the people of Judah.
    reason: lexical_alternative
  - marker: c
    text: Or 'the blood of the innocent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트는 황폐함이 되고, 에돔은 황폐한 광야가 될 것입니다. 이는 유다의 자손들에게 행한 폭력 때문입니다. 그들이 그들의 땅에서 무죄한 피를 흘렸기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 자손들에 대한 폭력 때문에’로 번역할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘유다의 자손들’은 유다 백성 전체를 가리키는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘무죄한 자의 피’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: HALOT
  rationale: 지명은 현대 한국어 표준 외래 지명인 이집트를 사용해 자연스럽게 옮기되, 본문이 민족/땅을 가리키는 점은 문맥으로 보존했습니다.
- source_word: לִשְׁמָמָה תִהְיֶה
  english_pob_choice: will become a desolation
  chosen_korean: 황폐함이 되고
  alternatives_korean:
  - 황폐하게 될 것입니다
  - 황폐가 될 것입니다
  lexicon: HALOT
  rationale: שְׁמָמָה의 명사성을 살려 단순 형용사보다 상태 변화의 결과를 나타내는 명사구로 옮겼습니다.
- source_word: לְמִדְבַּר שְׁמָמָה
  english_pob_choice: a desolate wilderness
  chosen_korean: 황폐한 광야
  alternatives_korean:
  - 황폐의 광야
  - 황폐한 사막
  lexicon: HALOT
  rationale: מִדְבָּר의 기본 뜻인 광야를 살리고, שְׁמָמָה는 그 상태를 수식하는 형용사로 처리해 중복을 피했습니다.
- source_word: חֲמַס בְּנֵי יְהוּדָה
  english_pob_choice: the violence done to the sons of Judah
  chosen_korean: 유다의 자손들에게 행한 폭력
  alternatives_korean:
  - 유다의 자손들에 대한 폭력
  - 유다 자손에게 가한 폭력
  lexicon: HALOT
  rationale: חָמָס는 단순한 ‘폭력’보다 부당하고 잔혹한 폭력을 포함하므로, 한국어에서는 자연스러운 ‘폭력’으로 옮기되 대상 관계를 분명히 했습니다.
- source_word: נָקִיא
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 결백한 피
  - 죄 없는 피
  lexicon: HALOT
  rationale: נָקִיא의 무죄·결백 의미를 살려 관용적으로 ‘무죄한 피’로 옮겼습니다. 이는 살해된 자들이 दोष이 없었음을 직접 드러냅니다.
theological_decisions:
- issue: בְּאַרְצָם의 소유격 참조
  chosen_reading: ‘그들의 땅’은 유다의 자손들을 가리킵니다.
  alternative_readings:
  - 이집트와 에돔의 땅을 가리킨다
  - 의도적 모호성으로 남긴다
  rationale: 가까운 선행사와 문맥상 자연스러운 해석은 유다의 자손들입니다. 그래서 ‘그들의 땅’으로 옮겨 원문이 주는 고발의 초점을 보존했습니다.
  doctrine_reference: 본문의 문맥적 참조를 우선하되, 실제로 애매한 경우에만 긴장을 남깁니다.
