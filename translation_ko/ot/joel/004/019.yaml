  naturalness: ‘황폐함이 되고’보다 ‘황폐지가 되고’가 현대 표준 한국어에서 더 자연스럽고, 두 인과절을 하나로 연결하면 원문의 문장 구조와 흐름을 더 잘 반영합니다.
  terminology: 이집트, 에돔, 유다, 광야, 폭력, 무죄한 피는 적절합니다. ‘유다 자손’은 히브리어 표현을 보존하며, 집합적 의미 가능성은 주석으로 처리하는 것이 좋습니다.
