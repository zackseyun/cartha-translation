    issue: ‘오십시오, 내려가십시오’
    rationale: 히브리어 רְדוּ는 포도주 틀을 밟는 행위를 가리킵니다. 단순한 하강으로 번역하면 바로 뒤의 포도주 틀 이미지와 연결되는 핵심 동작이 누락됩니다. 영어 감사 이력의 ‘go down’보다 원어 본문을 우선해야 합니다.
  - severity: medium
    issue: ‘포도즙 틀’과 ‘포도주 틀들’
    rationale: גת와 יקבים은 동일한 ‘틀’의 복수가 아니라 포도를 밟는 틀과 즙을 받는 통들입니다. 현 번역은 용어가 부자연스럽고 시설 구별을 약화합니다.
  revised_text: 낫을 대십시오. 추수가 무르익었습니다. 오십시오, 밟으십시오. 포도를 짜는 틀이 가득 찼고, 포도즙 받는 통들이 넘칩니다. 그들의 악이 크기 때문입니다.
