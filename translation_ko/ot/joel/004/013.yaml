base_translation:
  language: en
  yaml_path: translation/ot/joel/004/013.yaml
  text: Send in the sickle, for the harvest is ripe. Come, go down, for the winepress is full; the vats overflow, for their evil is great.
translation:
  language: ko
  text: 낫을 대십시오. 추수가 무르익었습니다. 오십시오, 밟으십시오. 포도를 짜는 틀이 가득 찼고, 포도즙 받는 통들이 넘칩니다. 그들의 악이 크기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְח֣וּ מַגָּ֔ל
  english_pob_choice: Send in the sickle
  chosen_korean: 낫을 보내십시오
  alternatives_korean:
  - 낫을 들이대십시오
  - 낫을 보내어 거두십시오
  lexicon: שלח + מגל
  rationale: 동사 ‘보내다’와 도구명사 ‘낫’을 직접 살려 수확 개시의 명령형을 유지했습니다.
- source_word: בֹּ֤אֽוּ רְדוּ֙
  english_pob_choice: Come, go down
  chosen_korean: 오십시오, 내려가십시오
  alternatives_korean:
  - 오십시오, 내려오십시오
  - 오라, 내려가라
  lexicon: בוא + ירד
  rationale: POB의 ‘go down’을 반영해 포도밭/틀로 내려가는 동작을 분명히 하고, 합쇼체로 정리했습니다.
- source_word: מָ֣לְאָה גַּ֔ת ... הַ/יְקָבִ֔ים
  english_pob_choice: the winepress is full; the vats overflow
  chosen_korean: 포도즙 틀이 가득 찼고, 포도주 틀들은 넘칩니다
  alternatives_korean:
  - 포도즙 틀이 가득 찼고, 틀들이 넘칩니다
  - 포도즙 틀이 가득하고, 포도즙 통들이 넘칩니다
  lexicon: גת + יקבים
  rationale: גת와 יקבים의 이미지 차이를 살리되, 한국어로는 두 용기를 모두 ‘틀’ 계열로 옮겨 수확-압착 장면을 유지했습니다.
- source_word: רַבָּ֖ה רָעָתָֽם
  english_pob_choice: their evil is great
  chosen_korean: 그들의 악이 큽니다
  alternatives_korean:
  - 그들의 악이 매우 큽니다
  - 그들의 죄악이 큽니다
  lexicon: רע
  rationale: 도덕적 평가를 완곡하게 바꾸지 않고 ‘악’으로 직역해 원문의 책임 진술을 분명히 했습니다.
theological_decisions:
- issue: 심판 이미지의 유지
  chosen_reading: 수확과 포도즙 틀 이미지를 심판의 절박한 명령으로 그대로 유지했습니다.
  alternative_readings:
  - 농사 비유로 순화하기
  - 상징성을 약화해 일반적 재난 묘사로 번역하기
  rationale: 본문은 농경 언어를 통해 종말적 심판을 선포하므로, 이미지의 날카로움을 약화하지 않았습니다.
  doctrine_reference: 요엘서의 주의 날 심판 주제
