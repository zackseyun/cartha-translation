source:
  edition: WLC
  text: הֲמוֹנִ֣ים הֲמוֹנִ֔ים בְּ/עֵ֖מֶק הֶֽ/חָר֑וּץ כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה בְּ/עֵ֖מֶק הֶ/חָרֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/014.yaml
  text: Multitudes[a], multitudes in the Valley of Decision! For the day of Yahweh is near in the Valley of Decision.
  footnotes:
  - marker: a
    text: Or 'the Valley of Judgment' or 'the Valley of Threshing.' The Hebrew term carries connotations of decisive verdict and may also evoke threshing imagery.
    reason: alternative_reading
translation:
  language: ko
  text: 수많은 무리, 수많은 무리가 결정의 골짜기에 있습니다! 야훼의 날이 결정의 골짜기에 가깝습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판결의 골짜기’ 또는 ‘타작의 골짜기’로 옮길 수 있습니다. 히브리어 표현은 결정적인 판결과 타작의 이미지를 함께 떠올리게 할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמוֹנִים
  english_pob_choice: Multitudes
  chosen_korean: 무리들
  alternatives_korean:
  - 떼들
  - 큰 무리들
  - 수많은 무리들
  lexicon: HALOT
  rationale: 반복되는 복수명사로서 규모와 긴박감을 살리기 위해 ‘무리들’을 택했고, 두 번의 반복도 원문의 수사 효과를 유지합니다.
- source_word: בְּעֵמֶק הֶחָרוּץ
  english_pob_choice: in the Valley of Decision
  chosen_korean: 결단의 골짜기
  alternatives_korean:
  - 판결의 골짜기
  - 심판의 골짜기
  - 타작의 골짜기
  lexicon: HALOT
  rationale: 헤브루어 표현이 निर्ण정·판결의 의미와 타작 이미지까지 겹칠 수 있으므로, 본문은 ‘결단’으로 옮겨 핵심의미를 살리고 다른 가능성은 주석으로 남겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 사용 지침(프로젝트 기본 용례)
  rationale: 여호와 대체어가 아니라 신명기의 고유명을 드러내는 음역으로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: ‘결단의 골짜기’의 의미 폭 보존
  chosen_reading: 주된 본문은 ‘결단의 골짜기’로 두되, 판결·타작의 가능성을 각주로 보조합니다.
  alternative_readings:
  - 판결의 골짜기
  - 타작의 골짜기
  rationale: 예언적 표현의 다층성을 평면화하지 않기 위해 단정적 ‘심판’으로만 좁히지 않고, 원문의 의미 폭을 보존했습니다.
  doctrine_reference: Translation philosophy §3; contested terms
