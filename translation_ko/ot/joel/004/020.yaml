id: JOL.4.20
reference: Joel 4:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִ/יהוּדָ֖ה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וִ/ירוּשָׁלִַ֖ם לְ/ד֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/020.yaml
  text: But Judah will be inhabited forever[a], and Jerusalem from generation to generation.
  footnotes:
  - marker: a
    text: Or 'And Judah will dwell forever.' The Hebrew verb can be rendered more literally as 'dwell' or 'sit,' but in this land/city context it likely means 'be inhabited' or 'remain inhabited.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유다에는 영원히 사람이 살고, 예루살렘에도 대대로 사람이 살 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 תֵּשֵׁב는 문자적으로 ‘앉다’, ‘살다’, ‘거주하다’를 뜻합니다. 이 지역·도시 문맥에서는 ‘사람이 살 것이다’ 또는 ‘거주될 것이다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוּדָ֖ה
  english_pob_choice: But Judah
  chosen_korean: 그러나 유다
  alternatives_korean:
  - 그리고 유다
  - 유다
  lexicon: HALOT
  rationale: 문맥상 앞선 심판 선언과 대조를 이루는 연결이므로 ‘그러나’로 반영하고, 지명/지역명으로서 ‘유다’를 유지했습니다.
- source_word: תֵּשֵׁ֑ב
  english_pob_choice: will be inhabited
  chosen_korean: 사람이 살 것이며
  alternatives_korean:
  - 거주할 것이며
  - 거할 것이며
  - 살게 될 것이며
  lexicon: HALOT
  rationale: יישב는 כאן 인물의 ‘앉다’보다 땅·도시가 ‘거주되다/사람이 살다’는 뜻이 자연스럽습니다. 한국어에서는 수동형을 과도하게 살리기보다 “사람이 살다”로 옮겨 의미를 분명히 했습니다.
- source_word: לְ/ד֥וֹר וָ/דֽוֹר
  english_pob_choice: from generation to generation
  chosen_korean: 대로 대대로
  alternatives_korean:
  - 대대로
  - 세세토록
  - 모든 세대에 걸쳐
  lexicon: HALOT
  rationale: 반복 구조를 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘대대로’ 계열 표현을 사용했습니다.
theological_decisions:
- issue: 유다와 예루살렘의 지속성 표현
  chosen_reading: 본문의 약속을 유다와 예루살렘이 계속 거주될 것이라는 सीधे한 예언으로 옮기되, 성취의 방식은 특정 교리로 한정하지 않았습니다.
  alternative_readings:
  - 문자적 정치적 영속성으로 한정
  - 상징적·교회론적 성취로 한정
  rationale: 히브리어 본문은 지속적 거주를 말하지만 그 성취의 범위나 방식은 규정하지 않으므로, 해석적 결론을 번역에 덧씌우지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
