lexical_decisions:
- source_word: שֶׁמֶשׁ
  english_pob_choice: the sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  lexicon: HALOT
  rationale: 시적 병행에서 자연스러운 한국어는 ‘해’이며, 우주적 심판 이미지를 간결하게 살립니다.
- source_word: וְ/יָרֵחַ
  english_pob_choice: and the moon
  chosen_korean: 달
  alternatives_korean:
  - 월
  - 달님
  lexicon: HALOT
  rationale: יָרֵחַ는 달(천체)을 가리키므로 표준어로 ‘달’이 가장 직접적입니다.
- source_word: קָדָרוּ
  english_pob_choice: grow dark
  chosen_korean: 어두워지고
  alternatives_korean:
  - 어둡게 되고
  - 캄캄해지고
  - 어두워집니다
  lexicon: HALOT
  rationale: Qal 완료형의 변화 상태를 한국어 진행형으로 자연스럽게 옮겨 ‘점점 어두워짐’의 뉘앙스를 살렸습니다.
- source_word: נָגְהָם
  english_pob_choice: their brightness
  chosen_korean: 자기 빛
  alternatives_korean:
  - 그들의 빛
  - 자기 광채
  - 자기 밝음
  lexicon: HALOT
  rationale: נֹגַהּ의 ‘빛/광휘’를 별의 고유한 발광으로 풀어 주되, 소유격을 자연스럽게 한국어화했습니다.
theological_decisions:
- issue: 우주적 어둠의 예언적 이미지 해석
  chosen_reading: 이 구절의 표현을 문자적·상징적 의미를 미리 단정하지 않고, 예언적 심판의 우주적 징조로 그대로 드러냈습니다.
  alternative_readings:
  - 문자적 천문 현상
  - 은유적 심판 묘사
  - 묵시적 상징 언어
  rationale: 히브리어는 간결한 시적 진술만 제시하므로, 번역은 해석을 결론내리기보다 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: 신학적 긴장을 해소하지 않고 보존한다.'
