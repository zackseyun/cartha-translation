id: JOL.4.21
reference: Joel 4:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִקֵּ֖יתִי דָּמָ֣/ם לֹֽא נִקֵּ֑יתִי וַֽ/יהוָ֖ה שֹׁכֵ֥ן בְּ/צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/021.yaml
  text: I will avenge their blood that I have not avenged[a], and Yahweh dwells in Zion.
  footnotes:
  - marker: a
    text: Or, 'I will not leave their blood unpunished.' The Hebrew repeats the same verb with negation, allowing either the sense of avenging bloodshed or not leaving it unpunished.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 아직 갚지 않은 그들의 피를 갚겠습니다[a]. 야훼께서 시온에 거하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그들의 피를 벌하지 않은 채로 두지 않겠다.” 히브리어는 같은 동사를 부정과 함께 반복하므로, 피 흘림에 보복한다는 뜻이나 그것을 벌하지 않고 그대로 두지 않는다는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקֵּיתִי
  english_pob_choice: I will avenge
  chosen_korean: 내가 … 갚아 주겠다고 / 갚겠으며
  alternatives_korean:
  - 내가 … 깨끗하게 하겠다고
  - 내가 … 용서하겠다고
  - 내가 … 무죄로 하겠다고
  lexicon: HALOT
  rationale: 문맥이 열방에 대한 심판과 피의 보복에 있으므로, 여기서는 ‘깨끗하게 하다’보다 죄값을 갚다/보복하다의 방향을 살린 ‘갚다’가 원문 기능을 더 잘 드러냅니다.
- source_word: דָּמָם
  english_pob_choice: their blood
  chosen_korean: 그들의 피
  alternatives_korean:
  - 그들의 피 흘림
  - 그들의 피의 죄책
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 살리되, 문맥상 무고한 피 흘림에 대한 책임이 함께 들리도록 ‘그들의 피’로 옮겼습니다.
- source_word: לֹא נִקֵּיתִי
  english_pob_choice: which I have not avenged
  chosen_korean: 내가 갚지 않았던
  alternatives_korean:
  - 내가 갚지 않은
  - 내가 벌하지 않았던
  - 내가 무죄로 돌리지 않았던
  lexicon: HALOT
  rationale: 반복된 동사와 부정의 긴장을 유지하면서, 앞절의 ‘갚다’와 대응되도록 과거 미완료 느낌의 ‘갚지 않았던’으로 처리했습니다.
- source_word: שֹׁכֵן בְּצִיּוֹן
  english_pob_choice: dwells in Zion
  chosen_korean: 시온에 거하십니다
  alternatives_korean:
  - 시온에 거주하십니다
  - 시온에 머무르십니다
  lexicon: HALOT
  rationale: 하나님의 지속적 임재를 가리키는 분사이므로 ‘거하십니다’가 가장 자연스럽고, 주어가 야훼인 점을 살려 높임 종결을 사용했습니다.
theological_decisions:
- issue: 야훼의 임재와 심판 선언을 한 절에 어떻게 연결할지
  chosen_reading: 피의 보복/변호와 시온 거주를 병렬로 두어, 심판 행위가 하나님의 시온 임재와 분리되지 않게 했습니다.
  alternative_readings:
  - 후반절을 단순한 배경 진술로 약화시키는 읽기
  - ‘거하십니다’를 일반적 존재 진술로만 처리하는 읽기
  rationale: 원문은 ‘피를 갚겠다’와 ‘야훼께서 시온에 거하신다’를 접속사로 나란히 놓아, 시온에 임재하시는 하나님이 곧 정의를 실행하시는 분임을 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
