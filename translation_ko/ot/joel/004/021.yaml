  source_fidelity: 원문의 반복된 נקה 동사와 부정, 그리고 피에 관한 사법적·보복적 문맥은 유지할 수 있습니다. 다만 현 번역의 ‘갚아 주겠다고, … 갚겠으며’는 원문에 없는 인용·연결 구조를 만들고 문장 관계를 흐립니다.
  naturalness: ‘내가 아직 갚지 않은 그들의 피를 갚겠습니다’는 한국어 문장 구조로 자연스럽고, 하나님 발화에는 합쇼체 ‘갚겠습니다’를, 서술에는 높임말 ‘거하십니다’를 일관되게 사용합니다.
  terminology: ‘야훼’, ‘시온’, ‘거하다’는 적절합니다. ‘그들의 피’는 히브리어의 직설성을 보존하며, 보복의 의미는 ‘갚다’로 문맥상 전달됩니다.
