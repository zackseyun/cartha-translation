  rationale: 원문의 어려운 반복 구문을 ‘아직 갚지 않은 … 피를 갚겠습니다’로 간결하게 재현하여, 이전에 갚지 않았던 피에 이제 보응한다는 영어 POB의 선택을 보존했습니다. 대안 해석은 각주에서 유지하되, 한국어 어법에 맞게 다듬었습니다.
