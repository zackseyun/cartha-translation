id: 1CH.17.12
reference: 1 Chronicles 17:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
  footnotes:
  - marker: a
    text: Or 'temple' for 'house'; the Hebrew word is literally 'house' and in context refers to the sanctuary Solomon would build.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나를 위해 집을 지을 것이며, 나는 그의 왕좌를 영원히 견고하게 세울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 문자적으로는 הבית(집)이며, 문맥상 솔로몬이 지을 성전을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  english_pob_choice: He
  chosen_korean: 그는
  alternatives_korean:
  - 그가
  lexicon: HALOT
  rationale: 독립 인칭대명사로서 강조 기능이 있으므로 주어를 분명히 드러내는 ‘그는’이 자연스럽습니다.
- source_word: יִבְנֶה לִּי בָּיִת
  english_pob_choice: will build a house for me
  chosen_korean: 나를 위해 집을 지을 것이며
  alternatives_korean:
  - 나를 위해 한 집을 지을 것이며
  - 나를 위해 성전을 지을 것이며
  lexicon: HALOT
  rationale: בַּיִת의 기본 의미를 살려 ‘집’으로 두되, 관계를 나타내는 לִּי는 목적과 이익을 담아 ‘나를 위해’로 옮겼습니다.
- source_word: וְכֹנַנְתִּי אֶת כִּסְאוֹ
  english_pob_choice: and I will establish his throne
  chosen_korean: 나는 그의 왕좌를 영원히 견고하게 세울 것입니다
  alternatives_korean:
  - 나는 그의 왕좌를 세울 것입니다
  - 나는 그의 왕좌를 굳게 세울 것입니다
  lexicon: HALOT
  rationale: כִּסֵּא를 왕권의 자리로 보고 ‘왕좌’로 옮겼고, כון의 확정·견고화 의미를 ‘견고하게 세우다’로 반영했습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: 지속성을 나타내는 관용구이므로 가장 직접적인 대응인 ‘영원히’를 사용했습니다.
theological_decisions:
- issue: בָּיִת을 ‘집’으로 유지할지 ‘성전’으로 해석할지
  chosen_reading: 집으로 번역해 본문의 어휘를 유지했습니다.
  alternative_readings:
  - 성전
  - 성소
  rationale: 원문은 ‘집’이라고 말하며, 문맥상 성전을 가리키더라도 번역문은 더 구체화하지 않고 독자가 맥락에서 이해하도록 두는 편이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 다윗 언약의 ‘영원히’의 범위
  chosen_reading: ‘영원히’로 직역해 약속의 강도를 그대로 살렸습니다.
  alternative_readings:
  - 영구히
  - 끝까지
  rationale: 본문이 스스로 말하는 지속성을 약화하거나 신학적 쟁점을 미리 정리하지 않도록, 원문의 단언을 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §3
