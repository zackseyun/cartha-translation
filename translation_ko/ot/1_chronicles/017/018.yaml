source:
  edition: WLC
  text: מַה יּוֹסִ֨יף ע֥וֹד דָּוִ֛יד אֵלֶ֖י/ךָ לְ/כָב֣וֹד אֶת עַבְדֶּ֑/ךָ וְ/אַתָּ֖ה אֶֽת עַבְדְּ/ךָ֥ יָדָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/018.yaml
  text: What more can David add before you for honoring your servant? You know your servant.
  footnotes:
  - marker: a
    text: Or 'What more can David say to you for the honor shown to your servant?' The verb 'say' is supplied in some translations to smooth the Hebrew, but it is not explicit in the text.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase rendered 'for honoring your servant' is difficult and may also be understood as 'for the honor of your servant' or 'to honor your servant.'
    reason: alternative_reading
translation:
  language: ko
  text: 주의 종을 높여 주신 일에 관하여 다윗이 주께 더 무엇을 덧붙일 수 있겠습니까?[a][b] 주께서는 주의 종을 아십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주의 종을 높여 주신 일에 관하여 다윗이 주께 더 무슨 말씀을 드릴 수 있겠습니까?” 히브리어 본문에는 ‘말하다’가 명시되어 있지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘주의 종을 높여 주신 일에 관하여’는 문법적으로 압축되어 있습니다. ‘주의 종의 영예에 관하여’ 또는 ‘주의 종을 영화롭게 하시려고’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יּוֹסִיף עוֹד
  english_pob_choice: What more can David add
  chosen_korean: 다윗이 … 드릴 수 있는 것이 무엇이 더 있겠습니까?
  alternatives_korean:
  - 다윗이 … 더할 수 있는 것이 무엇이 있겠습니까?
  - 다윗이 … 더 말할 수 있는 것이 무엇이 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어에서 자연스럽게 살리면서도, 본문에 없는 '말하다'를 본문으로 끼워 넣지 않기 위해 '드릴 수 있는 것'으로 옮겼습니다.
- source_word: אֵלֶיךָ
  english_pob_choice: before you
  chosen_korean: 주께
  alternatives_korean:
  - 주 앞에
  - 주께서 계신 앞에서
  lexicon: HALOT
  rationale: 이 접속 표현은 단순한 방향어보다 하나님께 드리는 직접 호소의 맥락을 가지므로, 합쇼체 기도문에 맞게 '주께'로 간결하게 표현했습니다.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  english_pob_choice: for honoring your servant
  chosen_korean: 주의 종을 높여 주신 일에 대하여
  alternatives_korean:
  - 주의 종의 영광을 위하여
  - 주의 종을 영화롭게 하신 일에 대해
  lexicon: HALOT
  rationale: לְ + כָבוֹד + 목적어의 압축된 구조를 한국어로 직역하면 어색하므로, 문맥상 하나님이 다윗을 높이신 은혜를 드러내는 방향으로 풀어 옮겼습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 당신의 종
  - 주의 노예
  lexicon: HALOT
  rationale: 이 절에서는 왕실-기도문 맥락에서 봉사적 자기호칭이므로 프로젝트 기본값대로 '종'을 사용했고, '노예'의 강한 결속 뉘앙스는 전면에 두지 않았습니다.
theological_decisions:
- issue: לְכָבוֹד אֶת עַבְדֶּךָ의 난해한 의미
  chosen_reading: 본문은 다윗이 하나님 앞에서 자신에게 베푸신 높임을 두고 감탄하는 말로 이해하여, 이를 '주의 종을 높여 주신 일에 대하여'로 옮겼습니다.
  alternative_readings:
  - '''주의 종의 영광을 위하여'''
  - '''주의 종을 영화롭게 하시려고'''
  - '''주의 종에게 영광을 주시기 위해'''
  rationale: 히브리어가 압축되어 있어 정확한 관계를 단정하기 어렵지만, 문맥상 주어는 하나님이고 초점은 다윗에게 주어진 높임입니다. 한국어에서는 그 의미를 자연스럽게 드러내되, 과도한 신학적 해설은 덧붙이지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 허용하는 범위 내에서만 해석을 반영
