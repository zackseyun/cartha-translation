id: 1CH.17.1
reference: 1 Chronicles 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: Now it happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
  footnotes:
  - marker: a
    text: Or 'under tent curtains.' The Hebrew יְרִיעוֹת refers to fabric curtains, especially those of a tent or tabernacle.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 자기 집에 살고 있을 때, 그가 예언자 나단에게 말했습니다. “보십시오, 나는 백향목 집에 살고 있는데 야훼의 언약궤는 휘장 아래에 있습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천막 휘장 아래에 있습니다’. 히브리어 יְרִיעוֹת은 특히 천막이나 성막에 쓰이는 천으로 된 휘장을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: Now it happened, when
  chosen_korean: 그 일이 일어났습니다. ... ~할 때
  alternatives_korean:
  - 그리고 ...
  - 그때 ...
  lexicon: HALOT
  rationale: 도입형 서사 전환과 시간 부사절을 현대 한국어로 자연스럽게 풀되, 본문의 새 장면 개시 기능을 살리기 위해 ‘그 일이 일어났습니다’로 옮겼습니다.
- source_word: יָשַׁב ... יוֹשֵׁב
  english_pob_choice: was living ... am living
  chosen_korean: 살고 있을 때 ... 살고 있는데
  alternatives_korean:
  - 거주하고 있을 때 ... 거주하고 있는데
  - 앉아 있을 때 ... 앉아 있는데
  lexicon: HALOT
  rationale: ישב의 주거 의미를 따라 ‘살다’를 택해 집 안에 거주하는 상황을 자연스럽게 표현했고, 서술과 직접화법의 반복도 유지했습니다.
- source_word: בְּבֵית הָאֲרָזִים
  english_pob_choice: in a house of cedar
  chosen_korean: 백향목 집
  alternatives_korean:
  - 백향목으로 된 집
  - 삼나무 집
  lexicon: HALOT
  rationale: 히브리어의 ‘cedar’를 한국어 성경 관용에 맞는 ‘백향목’으로 옮기되, 원문의 ‘집 of cedar’ 구조와 대비 효과를 살리기 위해 간결하게 표현했습니다.
- source_word: נָתָן הַנָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 나단 예언자
  alternatives_korean:
  - 예언자 나단
  - 나단 선지자
  lexicon: HALOT
  rationale: 고유명사와 직함을 유지하되, 예언자/선지자 중에서는 현대 표준어에 맞는 ‘예언자’를 택했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐요
  lexicon: HALOT
  rationale: 화자의 주의를 끄는 지시어를 합쇼체 직접화법에 맞게 ‘보십시오’로 옮겨, 다윗이 나단에게 정중하게 말하는 어조를 반영했습니다.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 언약의 궤
  - 여호와의 언약궤
  lexicon: HALOT
  rationale: ‘언약궤’는 한국어 성경에서 안정된 대응어이며, 문맥상 ‘브리트’의 관계를 포함한 궤를 가리키므로 자연스럽게 합성해 옮겼습니다. दिव
- source_word: תַּחַת יְרִיעוֹת
  english_pob_choice: is under curtains
  chosen_korean: 휘장 아래에 있습니다
  alternatives_korean:
  - 커튼 아래에 있습니다
  - 천막 휘장 아래에 있습니다
  lexicon: HALOT
  rationale: יְרִיעוֹת의 천막성 직물/휘장 의미를 살리되, 현대 한국어에서 더 자연스럽고 의례적 뉘앙스가 있는 ‘휘장’으로 옮겼습니다.
theological_decisions:
