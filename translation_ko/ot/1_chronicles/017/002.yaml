  verdict: revise
  source_fidelity: 히브리어는 나단이 다윗에게 ‘네 마음에 있는 모든 것을 행하라. 하나님이 너와 함께 계신다’고 말하는 짧은 권면입니다. 초안은 핵심 의미를 충실히 옮겼으나, 직접 인용 안에서 ‘네’와 ‘당신’을 함께 사용하여 대상 지시와 말투의 일관성이 흔들립니다.
  naturalness: 합쇼체 직접 발화에서는 ‘당신 마음에’와 ‘당신과’로 통일하는 편이 자연스럽고 안정적입니다. ‘행하십시오’는 원문의 넓은 동사 עשה의 직접성을 유지하는 적절한 격식 표현입니다.
  terminology: אֱלֹהִים은 ‘하나님’으로 적절히 번역되었습니다. 하나님을 주어로 높이는 현대 한국어 성경 문체에 따라 ‘하나님께서 … 계십니다’로 쓰는 것이 자연스럽습니다. ‘마음’은 לֵבָב의 의지·뜻이라는 표현을 보존합니다.
  issues:
