  text: 나단이 다윗에게 말했습니다. “네 마음에 있는 모든 것을 행하십시오. 하나님이 당신과 함께 계십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 마음 속에 있는 모든 것’을 뜻합니다.
