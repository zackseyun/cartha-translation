lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 이어 주는 과거 서술로 옮겼습니다. 한국어 성경 문체에서는 단순한 ‘말하다’가 가장 직접적이고 무난합니다.
- source_word: כֹּל אֲשֶׁר
  english_pob_choice: all that
  chosen_korean: 모든 것
  alternatives_korean:
  - 그 모든 것
  - 무엇이든
  lexicon: HALOT
  rationale: ‘마음에 있는’ 대상의 전부를 가리키므로, 범위를 유지하면서도 한국어로 자연스러운 ‘모든 것’이 적합합니다.
- source_word: בִּלְבָבְךָ
  english_pob_choice: is in your heart
  chosen_korean: 네 마음에 있는
  alternatives_korean:
  - 네 속에 있는
  - 네 생각 속에 있는
  lexicon: HALOT
  rationale: לֵב/לֵבָב의 내적 의지와 뜻을 ‘마음’으로 옮겨 원문의 인류학적 표현을 살렸습니다. 다만 한국어에서는 ‘마음에 있는’이 가장 자연스럽습니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 그 하나님
  - 하느님
  lexicon: HALOT
  rationale: 원문은 YHWH가 아니라 אֱלֹהִים이므로 ‘주님’이 아니라 ‘하나님’으로 옮겼습니다. 한국어 개신교 표준어에 맞는 명칭도 유지했습니다.
theological_decisions:
- issue: 하나님의 임재 표현
  chosen_reading: ‘하나님이 당신과 함께 계십니다’
  alternative_readings:
  - ‘하나님이 네와 함께 있습니다’
  - ‘하나님이 너와 함께하십니다’
  rationale: עִמָּךְ는 단순한 동행이 아니라 보호와 지지를 포함한 임재를 나타내므로, 한국어에서는 ‘함께 계십니다’가 그 의미를 가장 잘 드러냅니다. 다윗에 대한 예언적/격려적 발화이지만, 본문 자체는 직접 인용 안에서 높임을 요구하지 않으므로 중립적 공손체를 유지했습니다.
  doctrine_reference: Original-language primacy; divine presence language in narrative Hebrew
