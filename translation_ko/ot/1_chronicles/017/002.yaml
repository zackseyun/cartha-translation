  to: 나단이 다윗에게 말했습니다. “당신 마음에 있는 모든 것을 행하십시오. 하나님께서 당신과 함께 계십니다.”
  rationale: 직접 인용의 청자 지칭을 합쇼체에 맞게 ‘당신’으로 일관되게 고치고, 하나님 주어에 자연스러운 높임을 적용했습니다. 의미를 중복하는 각주는 삭제했습니다. 원문의 명령, ‘마음’ 비유, 하나님의 함께하심을 모두 유지했습니다.
