id: 1CH.17.11
reference: 1 Chronicles 17:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
  footnotes:
  - marker: a
    text: Literally, 'to go with your fathers,' a Hebrew idiom for dying and joining one's ancestors.
    reason: cultural_note
translation:
  language: ko
  text: 그때가 되면, 네 날이 다 차서 네 조상들과 함께 가게 될 때[a], 내가 네 뒤를 이어 네 후손을 일으키겠습니다. 그는 네 아들들 가운데 하나일 것이며, 내가 그의 나라를 굳게 세우겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘네 조상들과 함께 가다’이며 죽어 선조들 가운데로 들어감을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그리고 그때가 되면
  alternatives_korean:
  - 그리고 그럴 것입니다
  - 그리고 그것이 될 것입니다
  lexicon: HALOT
  rationale: 예언적 전환 공식을 한국어에서 자연스럽게 옮기되, 지나치게 직역적이거나 경직된 표현은 피했습니다.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  english_pob_choice: to go to be with your fathers
  chosen_korean: 당신의 조상들과 함께 가게 될 때에
  alternatives_korean:
  - 당신의 조상들과 함께 가게 될 때
  - 당신의 조상들과 더불어 가게 될 때에
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리면서, 죽음을 가리키는 의미가 한국어에서 과도하게 완곡해지지 않도록 했습니다.
- source_word: זַרְעֲךָ
  english_pob_choice: your offspring
  chosen_korean: 당신의 씨
  alternatives_korean:
  - 당신의 후손
  - 당신의 자손
  lexicon: HALOT
  rationale: 계보적 약속의 집단-단수 감각을 살리기 위해 ‘씨’를 유지했습니다. 이는 단순한 생물학적 ‘후손’보다 언약적 연속성을 더 잘 드러냅니다.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  english_pob_choice: who shall be one of your sons
  chosen_korean: 그는 당신의 아들들 가운데 하나가 될 것이며
  alternatives_korean:
  - 그는 당신의 아들들 중 하나가 될 것이며
  - 그는 당신의 아들들 가운데서 나오게 될 것이며
  lexicon: HALOT
  rationale: ‘one of your sons’의 부분적 의미를 자연스럽게 풀어, 약속된 후손이 다윗 자신의 아들 계열에 속함을 분명히 했습니다.
- source_word: וַהֲכִינוֹתִי אֶת מַלְכוּתֽוֹ
  english_pob_choice: I will establish his kingdom
  chosen_korean: 내가 그의 왕국을 굳게 세우겠습니다
  alternatives_korean:
  - 내가 그의 왕국을 세우겠습니다
  - 내가 그의 나라를 확고히 하겠습니다
  lexicon: HALOT
  rationale: הכין의 ‘굳게 세우다/확립하다’ 의미를 살리면서, 왕권의 안정성과 지속성을 강조했습니다. ‘왕국’은 동적 통치보다 제도적·다윗 왕조적 범위를 잘 드러냅니다.
theological_decisions:
- issue: 다윗 언약의 즉각적 역사 의미와 메시아적 함의
  chosen_reading: 본문 자체는 다윗의 후손이자 그의 아들 가운데 하나인 왕에 대한 약속으로 옮기고, 명시적 메시아 칭호는 덧붙이지 않았습니다.
  alternative_readings:
  - 본문에 더 분명한 메시아적 표현을 삽입하는 번역
  rationale: 이 절은 우선 다윗 왕조의 계승을 말하므로, 본문이 직접 말하지 않는 내용을 번역문에 앞서 넣지 않는 것이 원문 충실성에 부합합니다. 다만 정경적 문맥에서의 메시아적 의미는 남겨 둡니다.
  doctrine_reference: Translation philosophy §§1, 3
