source:
  edition: WLC
  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
  footnotes:
  - marker: a
    text: Or 'great and awesome things.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'driving out nations from before your people'; some understand the final word order differently because the parallel in 2 Samuel 7:23 is textually difficult.
    reason: textual_variant
translation:
  language: ko
  text: 주님, 주님의 백성 이스라엘과 같은 민족이 어디에 있겠습니까? 하나님께서 한 백성을 자기에게 속한 백성으로 삼으려고 찾아오셨고, 큰일과 두려운 일들로 주님의 이름을 위하여 이름을 내시며, 주님의 백성 앞에서 민족들을 몰아내셨습니다. 주님께서 이집트에서 구속하신 그 백성을 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘큰일과 두려운 일들’도 가능하지만, 본문은 하나님의 위엄 있는 행위를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘민족들을’은 히브리어 복수어를 따른 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וּמִי כְּעַמְּךָ יִשְׂרָאֵל
  english_pob_choice: And who is like your people Israel
  chosen_korean: 주님의 백성 이스라엘과 같은 민족이 어디에 있겠습니까?
  alternatives_korean:
  - 이스라엘, 주님의 백성 같은 민족이 어디에 있겠습니까?
  - 주님의 백성 이스라엘과 견줄 민족이 어디에 있겠습니까?
  lexicon: HALOT
  rationale: 수사 의문을 자연스러운 합쇼체로 옮기되, ‘your people Israel’의 언약적 소유 관계를 ‘주님의 백성’으로 살렸습니다.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  english_pob_choice: one nation on the earth
  chosen_korean: 같은 민족
  alternatives_korean:
  - 하나의 민족
  - 땅 위의 하나뿐인 민족
  lexicon: HALOT
  rationale: 히브리어의 유일성 강조를 한국어로 간결하게 드러내기 위해 ‘같은 민족’으로 옮겼습니다. ‘한 민족’보다 비교의 뉘앙스가 살아납니다.
- source_word: לִפְדּוֹת לוֹ עָם
  english_pob_choice: to redeem for himself as a people
  chosen_korean: 자기에게 속한 백성으로 삼으려고
  alternatives_korean:
  - 자기 백성으로 구속하려고
  - 자기에게 속한 한 백성으로 구속하려고
  lexicon: HALOT
  rationale: פדה의 ‘구속/속량’ 의미는 뒤의 ‘이집트에서 구속하신’으로 분명히 살리고, כאן의 목적절은 결과를 자연스럽게 드러내는 ‘자기에게 속한 백성으로 삼으려고’로 옮겼습니다.
- source_word: גְּדֻלּוֹת וְנֹרָאוֹת
  english_pob_choice: great and fearsome deeds
  chosen_korean: 큰일과 두려운 일들
  alternatives_korean:
  - 크고 두려운 일들
  - 큰 능력과 두려운 일들
  lexicon: HALOT
  rationale: ‘deeds/acts’에 해당하는 명사를 한국어에서 자연스럽게 보완하고, נוראות의 강한 경외감을 ‘두려운’으로 유지했습니다.
- source_word: לָשׂוּם לְךָ שֵׁם
  english_pob_choice: to make for yourself a name
  chosen_korean: 주님의 이름을 위하여 이름을 내시며
  alternatives_korean:
  - 주님을 위해 이름을 세우시며
  - 주님의 이름을 내시며
  lexicon: HALOT
  rationale: 히브리어의 관용구를 직역만 하지 않고 ‘이름을 내다’로 살리되, 목적을 분명히 하려고 ‘위하여’와 결합했습니다.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ
  english_pob_choice: driving out nations from before your people
  chosen_korean: 주님의 백성 앞에서 민족들을 몰아내셨습니다
  alternatives_korean:
  - 주님의 백성 앞에서 민족들을 쫓아내셨습니다
  - 주님의 백성 앞에서 민족들을 내쫓으셨습니다
  lexicon: HALOT
  rationale: ‘from before your people’의 공간적 표현을 한국어로 자연스럽게 옮기고, 추방 동작은 ‘몰아내다’로 유지했습니다.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  english_pob_choice: whom you redeemed from Egypt
  chosen_korean: 주님께서 이집트에서 구속하신 그 백성을 말입니다.
  alternatives_korean:
  - 주님께서 이집트에서 속량하신 그 백성을 말입니다
  - 주님께서 이집트에서 구원하신 그 백성을 말입니다
  lexicon: HALOT
  rationale: 마지막 절은 앞의 진술을 다시 확인하는 결말로 보고, פדה의 핵심 의미를 ‘구속하신’으로 번역했습니다.
theological_decisions:
- issue: 하나님의 자기 이름 세우기와 영광 언어
  chosen_reading: ‘주님의 이름을 위하여 이름을 내시며’로, 하나님이 구속 행위를 통해 자신의 이름과 명성을 드러내신다는 뜻을 보존했습니다.
  alternative_readings:
  - 주님 자신을 영화롭게 하시며
  - 주님의 이름을 세우시며
  rationale: 본문은 하나님의 구원 행위가 그분의 이름을 드러내는 목적을 분명히 말하므로, 이를 완화하지 않고 직접적으로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: נוראות의 정서 강도
  chosen_reading: ‘두려운 일들’로 옮겨 경외와 두려움을 함께 남겼습니다.
  alternative_readings:
  - 놀라운 일들
  - 무서운 일들
  rationale: ‘awesome’처럼 약해지기 쉬운 표현을 피하고, 하나님의 행위를 둘러싼 경외의 무게를 유지했습니다.
  doctrine_reference: Translation philosophy §6
