revisions:
- from: 주님, 주님의 백성 이스라엘과 같은 민족이 어디에 있겠습니까? 하나님께서 한 백성을 자기에게 속한 백성으로 삼으려고 찾아오셨고, 큰일과 두려운 일들로 주님의 이름을 위하여 이름을 내시며, 주님의 백성 앞에서 민족들을 몰아내셨습니다. 주님께서 이집트에서 구속하신 그 백성을 말입니다.[a][b]
  to: 주님의 백성 이스라엘과 같은 민족, 곧 땅 위의 한 민족이 또 어디에 있겠습니까? 하나님께서 한 백성을 자신의 백성으로 삼으시려고 구속하러 가셔서, 큰일과 두려운 일들[a]을 행하심으로 주님의 이름을 드높이시고, 주님께서 이집트에서 구속하신 주님의 백성 앞에서 민족들을 몰아내셨습니다.[b]
  rationale: 땅 위의 ‘한 민족’이라는 유일성의 비교, 하나님이 구속하러 ‘가신’ 행위, 구속의 목적, 하나님의 이름을 드높이심, 그리고 이집트에서 구속된 백성 앞에서 민족들을 몰아내심을 모두 보존했습니다. 한국어 합쇼체의 기도체 문맥에 맞추어 ‘주님’으로 호칭하되, 히브리어의 ‘하나님’과 2인칭 호칭의 전환도 유지했습니다.
  reviewer_model: gpt-5.6-terra
