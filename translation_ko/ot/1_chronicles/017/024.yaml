  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
  footnotes:
  - marker: a
    text: Or, 'The LORD of hosts, the God of Israel, is Israel’s God.' The Hebrew reads more literally, 'is God for Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''House'' here carries the sense of David’s royal house or dynasty.'
    reason: cultural_note
translation:
  language: ko
  text: 그 말씀이 굳게 세워지게 하시고, 주님의 이름이 영원히 높임을 받게 하소서. 이렇게 말하게 하소서. ‘만군의 야훼, 이스라엘의 하나님은 이스라엘을 위한 하나님이십니다[a].’ 또한 주님의 종 다윗의 집[b]이 주님 앞에서 굳게 세워지게 하소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 하나님.’ 히브리어는 더 직역하면 ‘이스라엘에게/이스라엘을 위하여 하나님’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 여기서 다윗의 왕조, 곧 왕실 계보를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  english_pob_choice: May it be established
  chosen_korean: 그것이 확립되게 하소서
  alternatives_korean:
  - 그것이 세워지게 하소서
  - 그것이 견고해지게 하소서
  lexicon: HALOT
  rationale: 기도문의 청유적 용법을 살려 ‘확립되다’로 옮기되, 뒤의 ‘확립되게’와 대응시켜 언약의 안정성을 드러냈습니다.
- source_word: וְיִגְדַּל שִׁמְךָ
  english_pob_choice: may your name be magnified
  chosen_korean: 주님의 이름이 영원히 높임을 받게 하소서
  alternatives_korean:
  - 주님의 이름이 영원히 크게 되게 하소서
  - 주님의 이름이 영원히 존귀하게 되게 하소서
  lexicon: HALOT
  rationale: ‘이름’을 단순 평판이 아니라 드러난 위엄으로 이해해, ‘높임을 받다’로 수동적 존귀를 살렸습니다.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  english_pob_choice: is God for Israel
  chosen_korean: 이스라엘을 위한 하나님
  alternatives_korean:
  - 이스라엘의 하나님
  - 이스라엘에게 하나님
  lexicon: HALOT
  rationale: לְיִשְׂרָאֵל의 관계·유익의 방향을 살려 소유격으로 완전히 흡수하지 않고 ‘...을 위한’으로 옮겼습니다.
- source_word: וּבֵית דָּוִיד
  english_pob_choice: the house of David
  chosen_korean: 다윗의 집
  alternatives_korean:
  - 다윗 왕조
  - 다윗의 왕실
  lexicon: HALOT
  rationale: 문자적으로 ‘집’을 유지하되, 본문의 왕조적 의미는 독자가 문맥에서 읽도록 두었습니다.
- source_word: נָכוֹן לְפָנֶיךָ
  english_pob_choice: be established before you
  chosen_korean: 주님 앞에서 확립되게 하소서
  alternatives_korean:
  - 주님 앞에 굳게 서게 하소서
  - 주님 앞에서 견고하게 되게 하소서
  lexicon: HALOT
  rationale: ‘앞에서’는 관계적·언약적 현존을 가리키므로 ‘주님 앞에서’로 살리고, נָכוֹן의 상태적 의미를 ‘확립되다’로 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 텍스트상으로 יְהוָה가 직접 나오므로, POB 기준에 따라 고유명사로서 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 직접 화자 표지와 기도체
  chosen_reading: 청유형 기도문으로 처리하여 ‘하소서’ 체를 사용했습니다.
  alternative_readings:
  - 직설 미래형
  - 명령형
  rationale: 다윗의 응답 기도이므로 예언 진술보다 소원·간구의 어조가 본문 기능에 더 맞습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
