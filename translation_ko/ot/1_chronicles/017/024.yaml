revisions:
- from: 그것이 확립되게 하시고, 주님의 이름이 영원히 높임을 받게 하소서. 이렇게 말합니다. ‘만군의 야훼, 이스라엘의 하나님은 이스라엘을 위한 하나님이십니다.’ 또한 주님의 종 다윗의 집이 주님 앞에서 확립되게 하소서.[a][b]
  to: 그 말씀이 굳게 세워지게 하시고, 주님의 이름이 영원히 높임을 받게 하소서. 이렇게 말하게 하소서. ‘만군의 야훼, 이스라엘의 하나님은 이스라엘을 위한 하나님이십니다[a].’ 또한 주님의 종 다윗의 집[b]이 주님 앞에서 굳게 세워지게 하소서.
  rationale: 문맥상 앞선 약속을 받는 첫 동사의 주어를 ‘그 말씀’으로 밝혀 한국어의 지시 대상을 분명히 했습니다. לֵאמֹר를 소원 기도문의 연결 표현인 ‘이렇게 말하게 하소서’로 고쳤으며, 각주 표지를 실제 설명 대상에 재배치했습니다. 야훼의 이름, 만군의 칭호, 이스라엘과의 관계를 나타내는 לְ의 열린 의미, 그리고 다윗 집의 왕조적 뉘앙스는 유지했습니다.
  reviewer_model: gpt-5.6-terra
