  source_fidelity: 히브리어의 소원법적 연속, ‘이름’의 높아짐, לְיִשְׂרָאֵל의 관계적 표현, 그리고 다윗의 ‘집’의 왕조적 의미를 전반적으로 잘 반영합니다. 다만 לֵאמֹר는 현재 서술인 ‘이렇게 말합니다’가 아니라 앞의 소원을 그 내용과 연결하는 ‘이렇게 말하여/말하게 하시고’로 옮겨야 합니다. 첫 동사의 여성 단수 주어는 문맥상 앞선 하나님의 말씀을 가리키므로 ‘그 말씀이’로 명시하는 것이 한국어에서 안전합니다.
  naturalness: ‘이렇게 말합니다’는 기도문 안에서 갑자기 서술자의 현재 발화처럼 들리며, 인용문 뒤에 문장이 이미 끝난 듯한 단절을 만듭니다. ‘이렇게 말하게 하시고’는 히브리어의 לֵאמֹר와 앞선 소원법을 자연스럽게 연결합니다. 각주도 해당 낱말 또는 구절 바로 뒤에 배치하는 편이 독자에게 명료합니다.
