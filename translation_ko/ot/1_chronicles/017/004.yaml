- from: 가서 다윗, 내 종에게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 너는 나를 위하여 그 집을 짓지 못합니다. 그 집은 내가 거기에 거주할 집입니다.’[a]
  to: 가서 내 종 다윗에게 이렇게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 나를 위하여 내가 거할 그 집을 지을 사람은 당신이 아닙니다.’
  rationale: 원문의 단일 문장 구조와 לֹא אַתָּה의 강조를 보존하고, ‘거하다’의 주체가 야훼임을 한국어에서 자연스럽게 드러냈습니다. 원문에 없는 설명 문장과 그에 딸린 주석 표지를 제거했습니다.
