  text: לֵ֤ךְ וְ/אָמַרְתָּ֙ אֶל דָּוִ֣יד עַבְדִּ֔/י כֹּ֖ה אָמַ֣ר יְהוָ֑ה לֹ֥א אַתָּ֛ה תִּבְנֶה לִּ֥/י הַ/בַּ֖יִת לָ/שָֽׁבֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
  footnotes:
  - marker: a
    text: Or, “You shall not build for me the house to dwell in,” or more literally, “Not you shall build for me the house to dwell in.”
    reason: lexical_alternative
  - marker: b
    text: That is, the house intended as the LORD’s dwelling place; i.e., the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 다윗, 내 종에게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 너는 나를 위하여 그 집을 짓지 못합니다. 그 집은 내가 거기에 거주할 집입니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 야훼의 거처가 될 집, 곧 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 나의 종
  - 내 노예
  lexicon: HALOT
  rationale: 다윗에 대한 왕적-언약적 호칭으로서 ‘종’이 가장 자연스럽고, 본문의 봉사/소속 관계를 살리면서도 ‘노예’가 주는 과도한 구속 의미를 피합니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 격식을 살리되, 본문 지침에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: לֹא אַתָּה תִּבְנֶה
  english_pob_choice: You shall not build
  chosen_korean: 너는 … 짓지 못합니다
  alternatives_korean:
  - 너는 … 지을 수 없습니다
  - 너는 … 건축하지 못합니다
  lexicon: HALOT
  rationale: 히브리어는 단순 금지라기보다 다윗이 그 건축 주체가 아님을 강조하므로, 합쇼체로도 강한 부정 능력 표현을 써서 의미를 살렸습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 그 성전
  - 그 집
  lexicon: HALOT
  rationale: 히브리어의 ‘집’을 그대로 유지해 원문을 따르되, 문맥상 야훼의 거처를 가리키는 의미는 후반구로 충분히 드러납니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 지침의 기본값에 따라 언약적 신명은 ‘야훼’로 옮겨, 전통적 대체어보다 원문 표지를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘집’의 구체화 여부
  chosen_reading: 그 집
  alternative_readings:
  - 그 성전
  rationale: 히브리어는 실제로 ‘집’이라 말하므로, 성전으로 풀어 쓰지 않고 문맥이 요구하는 의미만 보존했습니다.
  doctrine_reference: 'Translation philosophy #1, #5'
