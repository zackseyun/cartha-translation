id: 1CH.17.13
reference: 1 Chronicles 17:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִי֙ אֶֽהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִֽהְיֶה לִּ֣/י לְ/בֵ֑ן וְ/חַסְדִּ/י֙ לֹא אָסִ֣יר מֵֽ/עִמּ֔/וֹ כַּ/אֲשֶׁ֣ר הֲסִיר֔וֹתִי מֵ/אֲשֶׁ֥ר הָיָ֖ה לְ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
  footnotes:
  - marker: a
    text: Or 'I will be his father, and he will be my son.'
    reason: lexical_alternative
  - marker: b
    text: '''The one who was before you'' refers to Saul, David''s predecessor as king.'
    reason: cross_reference
translation:
  language: ko
  text: 나는 그에게 아버지가 되고, 그는 내게 아들이 될 것입니다. 그리고 나는 내 변함없는 사랑을 그에게서 거두지 않을 것이니, 이는 내가 당신보다 앞선 그에게서 그것을 거두었던 것과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '그에게 아버지가 되고, 그는 내게 아들이 될 것이다'입니다.
    reason: lexical_alternative
  - marker: b
    text: '''당신보다 앞선 그''는 사울을 가리킵니다.'
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  english_pob_choice: I will be a father to him
  chosen_korean: 나는 그에게 아버지가 되고
  alternatives_korean:
  - 나는 그의 아버지가 되고
  - 나는 그에게 아버지로 있을 것이고
  lexicon: HALOT
  rationale: 히브리어의 존재동사+전치사구 구조를 살려 관계적 선언을 자연스러운 현대 한국어로 옮겼습니다. '그의 아버지'보다 '그에게 아버지가'가 원문의 방향성을 더 직접적으로 드러냅니다.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  english_pob_choice: and he will be a son to me
  chosen_korean: 그는 내게 아들이 될 것입니다
  alternatives_korean:
  - 그는 내 아들이 될 것입니다
  - 그는 내게 아들로 있을 것입니다
  lexicon: HALOT
  rationale: 앞절과 평행을 이루는 언약적/관계적 표현을 유지했습니다. '내 아들'도 가능하지만, '내게 아들이'가 히브리어의 '나에게 ~로' 구조를 더 잘 반영합니다.
- source_word: חַסְדִּי
  english_pob_choice: my steadfast love
  chosen_korean: 내 변함없는 사랑
  alternatives_korean:
  - 내 인자
  - 내 신실한 사랑
  - 내 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적이고 지속적인 뉘앙스를 살리되, 현대 한국어에서 의미가 분명하도록 '변함없는 사랑'으로 옮겼습니다. '긍휼'이나 단순한 '사랑'으로 좁히지 않았습니다.
- source_word: לֹא אָסִיר מֵעִמּוֹ / כַּאֲשֶׁר הֲסִירוֹתִי
  english_pob_choice: I will not remove ... from him / as I removed it
  chosen_korean: 내 변함없는 사랑을 그에게서 거두지 않을 것이니 ... 그것을 거두었던 것과 같습니다
  alternatives_korean:
  - 내 변함없는 사랑을 그에게서 옮기지 않을 것이니 ... 그것을 옮겼던 것과 같습니다
  - 내 변함없는 사랑을 그에게서 빼앗지 않을 것이니 ... 그것을 빼앗았던 것과 같습니다
  lexicon: HALOT
  rationale: '''סור''의 기본 의미를 한국어 동사 ''거두다''로 자연스럽게 옮겨, ''remove/take away''의 반복을 살렸습니다. 앞절의 목적어가 이미 정해져 있으므로 뒤에서는 ''그것''으로 받아 주어야 합니다.'
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  english_pob_choice: from the one who was before you
  chosen_korean: 당신보다 앞선 그에게서
  alternatives_korean:
  - 당신 앞에 있던 그에게서
  - 당신보다 먼저 있던 그에게서
  - 당신 앞선 자에게서
  lexicon: HALOT
  rationale: 사울을 직접 이름 붙이지 않고 '당신보다 앞선 그'라는 우회적 표현을 보존했습니다. 여기서 '앞선'은 공간이 아니라 왕위의 선행을 뜻합니다.
theological_decisions:
- issue: 다윗 언약의 부자 관계 표현
  chosen_reading: '''아버지''와 ''아들''의 직접적 관계 언어를 그대로 유지했습니다.'
  alternative_readings:
  - 그를 아버지처럼 돌보겠다 / 그는 내게 속한 아들이 될 것이다
  rationale: 이 구절은 단순 비유가 아니라 왕권과 언약을 드러내는 친자 관계 언어이므로, 해석적으로 완화하지 않고 직접 보존하는 것이 본문의 힘을 살립니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 4
- issue: חֶסֶד의 언약적 의미
  chosen_reading: '''변함없는 사랑''으로 옮겼습니다.'
  alternative_readings:
  - 인자
  - 자비
  - 언약 충성
  rationale: 이 표현은 감정적 호의와 언약적 신실함을 함께 담아야 하므로, 한쪽으로 치우치지 않는 '변함없는 사랑'이 가장 균형적입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5
