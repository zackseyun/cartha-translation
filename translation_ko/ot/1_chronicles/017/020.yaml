source:
  edition: WLC
  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
  footnotes:
  - marker: a
    text: Or, "there is no god except you" / "there is no God apart from you."
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주와 같은 분은 아무도 없으며, 주 외에는 하나님도 없으시니, 우리가 귀로 들은 모든 일 가운데서도 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주 외에는 신이 없다” / “주와 떨어져서는 하나님이 없다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문이 하나님의 고유명 YHWH를 사용하므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지했습니다.
- source_word: אֵין כָּמֹוךָ
  english_pob_choice: there is none like you
  chosen_korean: 주와 같은 분은 아무도 없으며
  alternatives_korean:
  - 주와 같은 분은 없습니다
  - 주와 같은 이는 아무도 없으며
  lexicon: HALOT
  rationale: 존재 부정과 비교 구문을 자연스러운 합쇼체로 옮겨, ‘아무도 없다’는 핵심과 비교의 의미를 함께 살렸습니다.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  english_pob_choice: and there is no God besides you
  chosen_korean: 주 외에는 하나님도 없으시니
  alternatives_korean:
  - 주밖에는 하나님이 없으시니
  - 주 외에는 신도 없으시니
  lexicon: HALOT
  rationale: 유일신 고백의 강도를 살리기 위해 ‘하나님’으로 옮기되, 배타적 의미를 분명히 하는 ‘외에는’ 구조를 택했습니다.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ
  english_pob_choice: in all that we have heard
  chosen_korean: 우리가 귀로 들은 모든 일 가운데서도
  alternatives_korean:
  - 우리가 들은 모든 일 가운데서도
  - 우리가 들은 바 모든 일에서
  lexicon: HALOT
  rationale: ‘귀로 들은’은 원문의 청각적 강조를 살리고, ‘모든 일 가운데서도’는 אָשֶׁר שָׁמַעְנוּ의 총괄적 범위를 자연스럽게 반영합니다.
- source_word: בְּאָזְנֵינוּ
  english_pob_choice: with our own ears
  chosen_korean: 귀로 들은
  alternatives_korean:
  - 우리 귀로 들은
  - 우리의 귀로 들은
  lexicon: HALOT
  rationale: 직역적이지만 한국어로는 ‘귀로 들은’이 관용적으로 직접 목격에 준하는 firsthand hearing을 가장 간결하게 드러냅니다.
theological_decisions:
- issue: יִהוה(YHWH)의 한국어 표기
  chosen_reading: ‘야훼’로 표기해 언약적 고유성을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - ‘여호와’로 전통화
  rationale: 원문이 고유명으로 하나님의 이름을 직접 부르므로, 번역어에서 그 고유성을 지우지 않기 위해 프로젝트 기본값을 따랐습니다.
  doctrine_reference: 'Contested terms: יהוה / YHWH → 야훼'
- issue: ‘하나님도 없으시니’의 배타성
  chosen_reading: 단순 비교가 아니라 다른 참된 신의 부재를 말하는 유일신 고백으로 유지했습니다.
  alternative_readings:
  - 단지 ‘비길 자가 없다’는 비교
  - 다신론적 맥락의 상대 비교
  rationale: 히브리어의 ‘너 외에는 하나님이 없다’는 진술을 약화시키지 않고, 본문의 신학적 강도를 그대로 드러냈습니다.
  doctrine_reference: 'Affirmations; Translation philosophy #3'
