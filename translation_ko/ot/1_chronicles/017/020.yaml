  naturalness: ‘우리가 우리 귀로 들은 모든 것에 따르면’은 원문의 청각 강조를 보존하면서 현대 한국어 합쇼체에서 자연스럽습니다. ‘하나님도 없으시니’와 문장 끝의 ‘그렇습니다’는 이 문맥에서 덜 자연스럽습니다.
