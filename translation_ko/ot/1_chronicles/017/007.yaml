source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
  footnotes:
  - marker: a
    text: Or "from the sheepfold" for "from the pasture."
    reason: lexical_alternative
  - marker: b
    text: Or "leader" or "prince" for "ruler."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 당신은 내 종 다윗에게 이렇게 말하십시오. 만군의 야훼께서 이렇게 말씀하십니다. “내가 너를 목장에서, 양 떼를 따르던 자리에서 데려다가 내 백성 이스라엘의 통치자가 되게 하였습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목장’은 כאן의 נָוֶה를 자연스럽게 옮긴 표현입니다. 직역하면 ‘초장/목초지’ 또는 ‘양 우리’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘통치자’는 נָגִיד의 의미를 풀어 옮긴 것입니다. 문맥에 따라 ‘지도자’, ‘우두머리’, ‘군주’로도 번역할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러므로
  lexicon: HALOT
  rationale: 전환 표지인 וְ와 עַתָּה의 결합을 살려 단순한 시간 부사보다 앞선 말씀에서 이어지는 결론적 전개를 드러냈습니다.
- source_word: לְעַבְדִּי
  english_pob_choice: to my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종인
  - 내 일꾼
  lexicon: HALOT
  rationale: 다윗에 대한 언약적 호칭을 ‘종’으로 옮겨 공적인 소명과 주종 관계를 유지했고, 본문은 노예적 신분보다 하나님의 소속을 강조합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 야훼께서 만군의 주로서
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값인 ‘야훼’로, צְבָאוֹת는 관용적이면서도 범위를 보존하는 ‘만군’으로 옮겼습니다.
- source_word: מִן הַנָּוֶה
  english_pob_choice: from the pasture
  chosen_korean: 목장에서
  alternatives_korean:
  - 초장에서
  - 목초지에서
  - 양 우리에서
  lexicon: HALOT
  rationale: 문맥상 목자 이미지에 맞는 자연스러운 현대어로 옮겼고, EN POB의 ‘pasture’ 선택을 반영하되 한국어로는 ‘목장’이 가장 직관적입니다.
- source_word: מִן אַחֲרֵי הַצֹּאן
  english_pob_choice: from following the flock
  chosen_korean: 양 떼를 따르던 자리에서
  alternatives_korean:
  - 양 떼 뒤에서
  - 양 떼를 치던 때에서
  - 양 떼를 따르던 곳에서
  lexicon: HALOT
  rationale: ‘뒤따르다’의 동작성을 살리면서 한국어에서 어색한 직역을 피하기 위해 ‘자리’로 상황을 풀어 주었고, 목자-양 떼 대비를 유지했습니다.
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지도자
  - 군주
  - 다스리는 이
  lexicon: HALOT
  rationale: נָגִיד의 단순한 ‘leader’보다 더 강한 공적 통치 책임을 드러내면서도 ‘왕’으로 과도하게 좁히지 않기 위해 ‘통치자’를 택했습니다.
theological_decisions:
- issue: 다윗에 대한 עַבְדִּי의 신학적 뉘앙스
  chosen_reading: ‘내 종 다윗’으로 번역해 언약적 소명과 하나님의 주권 아래 있는 신분을 드러냈습니다.
  alternative_readings:
  - ‘내 노예 다윗’
  - ‘내 일꾼 다윗’
  rationale: 이 구절은 다윗의 매인 신분보다 하나님의 선택과 위임을 강조하므로, 한국어에서는 ‘종’이 가장 균형 있게 본문 의미를 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested terms — servant/slave context dependence
