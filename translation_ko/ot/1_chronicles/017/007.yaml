  source_fidelity: 히브리어의 전환 표현, 명령, 신적 발화 공식, 다윗의 목자였던 배경, 그리고 이스라엘 위에 세우신 통치 직분을 대체로 충실히 옮겼습니다. 다만 מִן אַחֲרֵי הַצֹּאן은 ‘양 떼를 따르던 자리’라기보다 양 떼를 뒤따르며 돌보던 상태·일에서 데려내셨다는 뜻이므로, ‘자리’라는 보충은 피하는 편이 더 가깝습니다.
  naturalness: ‘당신은’은 한국어 성경 문체와 합쇼체에서 불필요하고 다소 부자연스럽습니다. 주어를 생략하여 ‘내 종 다윗에게 이렇게 말하십시오’라고 하면 자연스럽습니다. ‘양 떼를 따라다니던 데서’는 원문의 목자 이미지를 유지하면서도 현대 한국어로 자연스럽습니다.
  terminology: ‘내 종’, ‘만군의 야훼’, ‘통치자’는 각각 עַבְדִּי, יְהוָה צְבָאוֹת, נָגִיד에 적절합니다. ‘통치자’는 왕이라는 후대의 특정 칭호로 좁히지 않으면서 공적 권위를 잘 나타냅니다. 각주 a에는 본문과 무관한 ‘כאן의’가 포함되어 있어 삭제해야 하며, 각주 표지는 해당 낱말 바로 뒤에 두는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 각주 a에 ‘כאן의’라는 불필요하고 부정확한 히브리어 표현이 들어 있습니다.
