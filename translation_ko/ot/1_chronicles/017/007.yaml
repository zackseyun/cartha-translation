base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
  footnotes:
  - marker: a
    text: Or "from the sheepfold" for "from the pasture."
    reason: lexical_alternative
  - marker: b
    text: Or "leader" or "prince" for "ruler."
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 내 종 다윗에게 이렇게 말하십시오. 만군의 야훼께서 이렇게 말씀하십니다. “내가 너를 목장[a]에서, 양 떼를 따라다니던 데서 데려다가 내 백성 이스라엘의 통치자[b]가 되게 하였습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목장’으로 옮긴 נָוֶה는 문맥상 ‘초장’, ‘목초지’ 또는 ‘양 우리’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘통치자’로 옮긴 נָגִיד는 문맥에 따라 ‘지도자’, ‘우두머리’ 또는 ‘군주’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
