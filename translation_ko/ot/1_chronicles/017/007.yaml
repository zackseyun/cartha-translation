  - 내 일꾼
  lexicon: HALOT
  rationale: 다윗에 대한 언약적 호칭을 ‘종’으로 옮겨 공적인 소명과 주종 관계를 유지했고, 본문은 노예적 신분보다 하나님의 소속을 강조합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 야훼께서 만군의 주로서
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값인 ‘야훼’로, צְבָאוֹת는 관용적이면서도 범위를 보존하는 ‘만군’으로 옮겼습니다.
- source_word: מִן הַנָּוֶה
  english_pob_choice: from the pasture
  chosen_korean: 목장에서
  alternatives_korean:
  - 초장에서
  - 목초지에서
  - 양 우리에서
  lexicon: HALOT
  rationale: 문맥상 목자 이미지에 맞는 자연스러운 현대어로 옮겼고, EN POB의 ‘pasture’ 선택을 반영하되 한국어로는 ‘목장’이 가장 직관적입니다.
- source_word: מִן אַחֲרֵי הַצֹּאן
  english_pob_choice: from following the flock
  chosen_korean: 양 떼를 따르던 자리에서
  alternatives_korean:
  - 양 떼 뒤에서
  - 양 떼를 치던 때에서
  - 양 떼를 따르던 곳에서
  lexicon: HALOT
  rationale: ‘뒤따르다’의 동작성을 살리면서 한국어에서 어색한 직역을 피하기 위해 ‘자리’로 상황을 풀어 주었고, 목자-양 떼 대비를 유지했습니다.
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 통치자
  alternatives_korean:
  - 지도자
  - 군주
  - 다스리는 이
  lexicon: HALOT
  rationale: נָגִיד의 단순한 ‘leader’보다 더 강한 공적 통치 책임을 드러내면서도 ‘왕’으로 과도하게 좁히지 않기 위해 ‘통치자’를 택했습니다.
theological_decisions:
- issue: 다윗에 대한 עַבְדִּי의 신학적 뉘앙스
  chosen_reading: ‘내 종 다윗’으로 번역해 언약적 소명과 하나님의 주권 아래 있는 신분을 드러냈습니다.
  alternative_readings:
  - ‘내 노예 다윗’
  - ‘내 일꾼 다윗’
  rationale: 이 구절은 다윗의 매인 신분보다 하나님의 선택과 위임을 강조하므로, 한국어에서는 ‘종’이 가장 균형 있게 본문 의미를 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested terms — servant/slave context dependence
