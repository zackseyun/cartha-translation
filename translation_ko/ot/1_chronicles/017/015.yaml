    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 말과 이 모든 환상에 따라, 나단이 다윗에게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: According to all these words
  chosen_korean: 이 모든 말에 따라
  alternatives_korean:
  - 이 모든 말씀에 따라
  - 이 모든 일에 따라
  lexicon: HALOT
  rationale: דְּבָרִים는 문맥상 전달된 예언적 발언을 가리키므로, '말'이 원문의 언어적 성격을 가장 직접적으로 살립니다.
- source_word: וּכְכֹל הֶחָזוֹן הַזֶּה
  english_pob_choice: and according to all this vision
  chosen_korean: 이 모든 환상에 따라
  alternatives_korean:
  - 이 모든 계시를 따라
  - 이 모든 묵시를 따라
  lexicon: HALOT
  rationale: חָזוֹן은 예언적 '환상/계시'를 뜻하므로, 한국어에서는 비교적 직역적인 '환상'을 택해 시현-계시의 성격을 보존했습니다.
- source_word: כֵּן דִּבֶּר
  english_pob_choice: so Nathan spoke
  chosen_korean: 나단이 … 말했습니다
  alternatives_korean:
  - 나단이 … 말하였습니다
  - 나단이 … 이르렀습니다
  lexicon: HALOT
  rationale: כֵּן은 앞의 내용과의 합치를 나타내므로 '…에 따라'로 앞문장에 연결하고, דִּבֶּר는 예언 전달의 표준 동사로서 자연스러운 '말했습니다'로 옮겼습니다.
- source_word: נָתָן אֶל דָּוִיד
  english_pob_choice: Nathan spoke to David
  chosen_korean: 나단이 다윗에게
  alternatives_korean:
  - 나단이 다윗에게로
  - 나단이 다윗을 향해
  lexicon: HALOT
  rationale: אֶל은 수신자 표지이므로 한국어에서는 조사 '에게'로 간결하게 처리했습니다.
