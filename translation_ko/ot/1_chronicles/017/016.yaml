base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
  footnotes:
  - marker: a
    text: Or 'my household,' 'my family,' or 'my dynasty' for 'my house.' The Hebrew 'house' can refer to David's household and, in this context, his royal line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗 왕이 들어가 여호와 앞에 앉아 말했습니다. 「나는 누구이며, 여호와 하나님이시여, 또 내 집이 무엇이기에 주께서 나를 여기까지 이르게 하셨습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 집’은 문맥에 따라 ‘내 가문’, ‘내 가족’, 또는 ‘내 왕조’를 가리킬 수 있습니다.
    reason: lexical_alternative
