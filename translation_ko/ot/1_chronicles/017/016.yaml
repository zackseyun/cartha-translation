theological_decisions:
- issue: 여호와의 표기와 직접 호칭
  chosen_reading: 본문에서는 ‘여호와’를 유지하고, ‘여호와 하나님이시여’로 직접 호칭을 드러냈습니다.
  alternative_readings:
  - 야훼
  - 여호와 하나님
  rationale: 이 구절은 다윗의 기도체 직접 발화이므로, 한국어 독자가 호격과 경외의 정서를 분명히 느끼도록 정중한 직접 호칭으로 옮겼습니다. 동시에 본문 전통과 프로젝트 용어를 고려해 ‘여호와’를 유지했습니다.
  doctrine_reference: POB Korean drafting convention for divine name and vocative prayer address
- issue: ‘내 집’의 범위
  chosen_reading: ‘내 집’을 본문에 두고, 가문/왕조의 함의를 열어 두었습니다.
  alternative_readings:
  - 내 가문
  - 내 왕조
  - 내 가정
  rationale: 이 구절의 ‘집’은 단순한 주거가 아니라 다윗의 혈통과 왕통을 포함할 수 있으므로, 해석을 고정하지 않고 원어의 넓이를 보존했습니다.
  doctrine_reference: 2 Samuel 7 / 1 Chronicles royal-house motif
