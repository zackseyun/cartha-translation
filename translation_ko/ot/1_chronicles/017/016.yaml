  rationale: 히브리어 ‘집’의 기본 이미지를 유지하되, 이 문맥에서 가문·왕통까지 함의할 수 있도록 너무 좁히지 않았습니다.
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
