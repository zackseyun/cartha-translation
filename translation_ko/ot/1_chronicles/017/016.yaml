- from: 그때 다윗 왕이 들어가 여호와 앞에 앉아 말했습니다. 「나는 누구이며, 여호와 하나님이시여, 또 내 집이 무엇이기에 주께서 나를 여기까지 이르게 하셨습니까?」[a]
  to: 그때 다윗 왕이 들어가서 야훼 앞에 앉아 말했습니다. “야훼 하나님이시여, 저는 누구이며 제 집[a]은 무엇이기에 주께서 저를 여기까지 이르게 하셨습니까?”
