  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
  footnotes:
  - marker: a
    text: Or 'evildoers' for 'the sons of wickedness.'
    reason: lexical_alternative
  - marker: b
    text: Or 'as formerly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 백성 이스라엘을 위해 한 곳을 정하고 그들을 심어 두겠습니다[a]. 그들은 자기 자리에 살며 더 이상 요동하지 않을 것이고, 악한 자들의 아들들이 다시는 그들을 억누르지 못할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 세우겠습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘처음과 같이’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  english_pob_choice: I will appoint a place
  chosen_korean: 한 곳을 정하고
  alternatives_korean:
  - 한 곳을 마련하고
  - 한 자리를 세우고
  lexicon: HALOT
  rationale: שׂוּם의 기본 의미인 ‘두다/정하다’를 살리되, מָקוֹם과 함께 쓰인 문맥상 하나님이 백성의 거처를 지정하시는 뜻이므로 ‘한 곳을 정하다’로 자연스럽게 옮겼습니다.
- source_word: וּנְטַעְתִּיהוּ
  english_pob_choice: and plant them
  chosen_korean: 그들을 심어 두겠습니다
  alternatives_korean:
  - 그들을 심겠습니다
  - 그들을 심어 놓겠습니다
  lexicon: HALOT
  rationale: נָטַע의 ‘심다’ 이미지를 유지하면서, 백성을 땅에 안정적으로 정착시키는 의미를 드러내기 위해 ‘심어 두다’를 택했습니다.
- source_word: וְשָׁכַן תַּחְתָּיו
  english_pob_choice: and they will dwell in their own place
  chosen_korean: 그들은 자기 자리에 살며
  alternatives_korean:
  - 그들은 자기 처소에 살며
  - 그들은 그들의 자리 아래 살며
  lexicon: HALOT
  rationale: תַּחְתָּיו의 직역은 어색하므로, 앞뒤의 ‘심다’와 ‘요동하지 않다’의 흐름에 맞게 안정된 거주를 뜻하는 ‘자기 자리’로 옮겼습니다.
- source_word: יִרְגַּז עוֹד
  english_pob_choice: be disturbed no more
  chosen_korean: 더 이상 요동하지 않을 것이고
  alternatives_korean:
  - 더는 흔들리지 않을 것이고
  - 더 이상 불안해하지 않을 것이고
  lexicon: HALOT
  rationale: רָגַז는 단순한 감정 불안보다 외적 충격으로 ‘요동하다/흔들리다’의 뜻이 강하므로, 국가적 안전의 맥락을 살려 번역했습니다.
- source_word: בְנֵי עַוְלָה
  english_pob_choice: the sons of wickedness
  chosen_korean: 악한 자들의 아들들
  alternatives_korean:
  - 불의의 아들들
  - 악인들
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 보존해 수사적 강도를 살렸고, 필요할 경우 ‘악인들’로 평이하게 옮길 수 있음을 염두에 두었습니다.
- source_word: לְבַלֹּתוֹ
  english_pob_choice: wear them down
  chosen_korean: 그들을 억누르지 못할 것입니다
  alternatives_korean:
  - 그들을 소모시키지 못할 것입니다
  - 그들을 괴롭히지 못할 것입니다
  lexicon: HALOT
  rationale: בלה의 ‘닳게 하다/소모시키다’ 의미를 한국어에서 자연스러운 억압 표현으로 풀어, 지속적 가해를 드러냈습니다.
theological_decisions:
- issue: 이스라엘 공동체를 지칭하는 복수 처리
  chosen_reading: ‘그들을’로 옮겨 공동체 전체에 대한 언약 약속임을 분명히 했습니다.
  alternative_readings:
  - ‘그것을’로 단수 처리
  - ‘이스라엘’을 반복해 설명
  rationale: 히브리어는 집합적 단수와 복수 표현을 오가지만, 문맥상 백성 공동체가 분명하므로 한국어에서는 복수 대명사가 뜻을 더 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘악한 자들의 아들들’의 수사적 직설성
  chosen_reading: 전통적 교회어로 완화하지 않고 직역적 수사를 유지했습니다.
  alternative_readings:
  - ‘악인들’로 평이하게 조정
  - ‘불의한 자들’로 윤색
  rationale: 본문의 표현은 적대 세력에 대한 강한 규정이므로, 의미를 약화시키지 않기 위해 히브리어 관용구의 거칠음을 일정 부분 보존했습니다.
  doctrine_reference: Translation philosophy §1
