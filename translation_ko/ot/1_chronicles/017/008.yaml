  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
  footnotes:
  - marker: a
    text: Or 'I will make you renowned'; Hebrew 'I will make for you a name.'
    reason: lexical_alternative
  - marker: b
