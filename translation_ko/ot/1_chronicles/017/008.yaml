  alternatives_korean:
  - 제가 당신의 모든 원수들을 당신 앞에서 제거했고
  - 제가 당신 앞에서 당신의 모든 원수들을 멸했고
  lexicon: HALOT
  rationale: כרת의 ‘끊어 내다/제거하다’ 이미지를 살리기 위해 ‘끊어 버리다’를 택했고, מִפָּנֶיךָ는 ‘당신 앞에서’로 옮겼습니다.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם כְּשֵׁם הַגְּדוֹלִים אֲשֶׁר בָּאָרֶץ
  english_pob_choice: I will make for you a name like the name of the great ones who are on the earth
  chosen_korean: 제가 당신을 위해 땅의 위대한 자들의 이름과 같은 이름을 만들어 드리겠습니다
  alternatives_korean:
  - 제가 당신을 위해 땅의 위대한 자들처럼 이름을 만들어 드리겠습니다
  - 제가 당신에게 큰 명성을 주어 땅의 위대한 자들과 같은 이름을 얻게 하겠습니다
  lexicon: HALOT
  rationale: שֵׁם을 ‘이름’으로 유지해 히브리어 관용을 보존했고, ‘위대한 자들’은 지위와 명성을 포괄하는 표현으로 처리했습니다.
theological_decisions:
- issue: '시제 구성: 과거의 신실함과 미래의 약속이 한 절에 함께 나타남'
  chosen_reading: 첫 두 절은 과거 회고로, 마지막 절은 미래 약속으로 구분해 번역했습니다.
  alternative_readings:
  - 모든 절을 과거로 옮김
  - 모든 절을 미래로 옮김
  rationale: 본문은 야훼의 이미 이루어진 동행과 제거를 회고한 뒤, 다윗에게 이름을 세워 주겠다는 약속으로 전환합니다. 한국어에서도 그 긴장을 유지하는 것이 문맥상 가장 분명합니다.
  doctrine_reference: 사무엘하 7장 병행구의 언약적 약속 구조
