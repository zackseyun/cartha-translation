revisions:
- from: 그리고 제가 당신과 함께 있었습니다. 당신이 어디로 가든지 제가 당신의 모든 원수들을 당신 앞에서 끊어 버렸고, 제가 당신을 위해 땅의 위대한 자들의 이름과 같은 이름을 만들어 드리겠습니다.[a][b]
  to: 내가 당신과 함께 있었습니다. 당신이 어디로 갔든지, 내가 당신 앞에서 당신의 모든 원수를 끊어 없앴습니다. 내가 당신에게 땅[b]에 있는 위대한 자들의 이름과 같은 이름을 만들어 주겠습니다.[a]
  rationale: 과거 회고와 미래 약속의 시제를 분명히 하고, 원문의 비유적 ‘이름’을 유지했습니다. 또한 현대 표준 한국어의 합쇼체에 맞추되, 하나님이 자신을 낮추는 듯한 ‘제가/드리다’는 피했습니다. 각주 표지를 해당 어구 바로 뒤로 옮겨 구조와 의미 연결을 명확히 했습니다.
