    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제가 당신과 함께 있었습니다. 당신이 어디로 가든지 제가 당신의 모든 원수들을 당신 앞에서 끊어 버렸고, 제가 당신을 위해 땅의 위대한 자들의 이름과 같은 이름을 만들어 드리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 명성을 만들어 드리겠습니다’; 히브리어는 직역하면 ‘당신을 위해 이름을 만들겠다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅 안에 있는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  english_pob_choice: I was with you
  chosen_korean: 제가 당신과 함께 있었습니다
  alternatives_korean:
  - 제가 당신과 함께했습니다
  - 제가 당신과 함께 있어 왔습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 회고적 진술을 자연스러운 한국어 과거로 옮기되, 임재와 동행의 뜻을 분명히 했습니다.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  english_pob_choice: wherever you went
  chosen_korean: 당신이 어디로 가든지
  alternatives_korean:
  - 당신이 가는 모든 곳에서
  - 당신이 가셨던 모든 곳에서
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 반복적·포괄적 의미를 살린 관용적 표현입니다.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ מִפָּנֶיךָ
  english_pob_choice: I cut off all your enemies from before you
  chosen_korean: 제가 당신의 모든 원수들을 당신 앞에서 끊어 버렸고
  alternatives_korean:
  - 제가 당신의 모든 원수들을 당신 앞에서 제거했고
  - 제가 당신 앞에서 당신의 모든 원수들을 멸했고
  lexicon: HALOT
  rationale: כרת의 ‘끊어 내다/제거하다’ 이미지를 살리기 위해 ‘끊어 버리다’를 택했고, מִפָּנֶיךָ는 ‘당신 앞에서’로 옮겼습니다.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם כְּשֵׁם הַגְּדוֹלִים אֲשֶׁר בָּאָרֶץ
  english_pob_choice: I will make for you a name like the name of the great ones who are on the earth
  chosen_korean: 제가 당신을 위해 땅의 위대한 자들의 이름과 같은 이름을 만들어 드리겠습니다
  alternatives_korean:
  - 제가 당신을 위해 땅의 위대한 자들처럼 이름을 만들어 드리겠습니다
  - 제가 당신에게 큰 명성을 주어 땅의 위대한 자들과 같은 이름을 얻게 하겠습니다
  lexicon: HALOT
  rationale: שֵׁם을 ‘이름’으로 유지해 히브리어 관용을 보존했고, ‘위대한 자들’은 지위와 명성을 포괄하는 표현으로 처리했습니다.
theological_decisions:
- issue: '시제 구성: 과거의 신실함과 미래의 약속이 한 절에 함께 나타남'
  chosen_reading: 첫 두 절은 과거 회고로, 마지막 절은 미래 약속으로 구분해 번역했습니다.
  alternative_readings:
  - 모든 절을 과거로 옮김
  - 모든 절을 미래로 옮김
  rationale: 본문은 야훼의 이미 이루어진 동행과 제거를 회고한 뒤, 다윗에게 이름을 세워 주겠다는 약속으로 전환합니다. 한국어에서도 그 긴장을 유지하는 것이 문맥상 가장 분명합니다.
  doctrine_reference: 사무엘하 7장 병행구의 언약적 약속 구조
