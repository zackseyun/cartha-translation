  source_fidelity: 히브리어의 과거 회고(‘내가 함께 있었다’, ‘내가 원수들을 끊어 없앴다’)와 미래 약속(‘내가 이름을 만들어 주겠다’)의 구분은 유지해야 합니다. 다만 초안의 ‘어디로 가든지’는 회고적 과거 맥락에 맞게 ‘어디로 갔든지’로 고치는 것이 정확합니다. מִפָּנֶיךָ의 공간적 표현도 ‘당신 앞에서’로 보존했습니다.
  naturalness: 초안의 ‘제가/드리겠습니다’는 하나님이 다윗에게 말씀하는 문맥에서 화자가 자신을 낮추는 인상을 주며, ‘명성을 만들어 드리겠습니다’도 현대 한국어에서 자연스럽지 않습니다. ‘내가 … 만들어 주겠습니다’로 고치고, 각 절을 완결된 합쇼체 문장으로 구성했습니다.
  terminology: שֵׁם은 본문에서 ‘이름’으로 유지하여 명성·명망이라는 히브리어 관용을 보존했습니다. הַגְּדֹלִים은 불필요하게 성별을 한정하지 않는 ‘위대한 자들’로 옮겼습니다. אָרֶץ의 ‘땅/그 땅’ 범위의 가능성은 각주로 남겼습니다.
