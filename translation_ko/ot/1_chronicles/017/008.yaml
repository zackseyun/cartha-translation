translation:
  language: ko
  text: 내가 당신과 함께 있었습니다. 당신이 어디로 갔든지, 내가 당신 앞에서 당신의 모든 원수를 끊어 없앴습니다. 내가 당신에게 땅[b]에 있는 위대한 자들의 이름과 같은 이름을 만들어 주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 당신에게 명성을 주겠습니다.’ 히브리어를 직역하면 ‘내가 당신을 위해 이름을 만들겠다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅에 있는 위대한 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
