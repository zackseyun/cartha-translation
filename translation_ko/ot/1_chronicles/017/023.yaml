base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
  footnotes:
  - marker: a
    text: Or 'his dynasty' or 'his family line.' The Hebrew 'house' can refer to a household, lineage, or royal dynasty in this covenant context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 야훼여, 주의 종과 그의 집에 관하여 주께서 말씀하신 그 말씀이 영원히 확립되게 하시고, 주께서 말씀하신 대로 행하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 이 언약의 문맥에서 가문, 혈통, 또는 왕조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문 고유명사인 여호와의 이름을 표준 학술 음역인 ‘야훼’로 옮겨 POB의 이름 보존 원칙을 따랐습니다.
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 그 말씀
  alternatives_korean:
  - 그 말
  - 그 약속
  - 그 일
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘말’보다 하나님이 하신 발화를 가리키는 ‘말씀’이 문맥상 더 자연스럽고, 앞뒤의 ‘말씀하신’과도 대응됩니다.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  english_pob_choice: concerning your servant and concerning his house
  chosen_korean: 주의 종과 그의 집에 관하여
  alternatives_korean:
  - 주의 종과 그의 가문에 관하여
  - 주의 종과 그의 왕조에 관하여
  - 주의 종과 그의 집안에 관하여
  lexicon: HALOT
  rationale: ‘집’은 본문이 지닌 언약적 표현을 보존하기 위해 그대로 두되, 한국어에서는 조사와 어순을 조정해 자연스럽게 만들었습니다.
- source_word: יֵאָמֵן
  english_pob_choice: be established
  chosen_korean: 확립되게 하시고
  alternatives_korean:
  - 세워지게 하시고
  - 견고하게 하시고
  - 확인되게 하시고
  lexicon: HALOT
  rationale: 니팔형의 ‘굳게 서다/확증되다’ 의미를 살리면서, 간구문에 맞는 동사형으로 옮겼습니다.
theological_decisions:
- issue: ‘his house’의 의미 범위
  chosen_reading: 본문에는 ‘그의 집’을 유지하고, 다윗 언약에서 가문/왕조를 가리킬 수 있는 여지를 열어 둡니다.
  alternative_readings:
  - 그의 왕조
  - 그의 가문
  - 그의 집안
  rationale: 원문은 covenantal ‘house’를 사용하므로 해석어를 앞세워 좁히기보다, 본문 표현을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 기도체의 명령형 어조
  chosen_reading: 하나님께 드리는 직접 청원으로 ‘행해 주십시오’를 사용했습니다.
  alternative_readings:
  - 행하여 주십시오
  - 해 주십시오
  - 하옵소서
  rationale: 현대 합쇼체로 존대를 유지하면서도 히브리어의 간구적 뉘앙스를 살렸습니다.
  doctrine_reference: Korean target style
