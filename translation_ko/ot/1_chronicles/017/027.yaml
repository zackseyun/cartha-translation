reference: 1 Chronicles 17:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
  footnotes:
  - marker: a
    text: Or 'you have undertaken to bless' or 'you have consented to bless.'
    reason: lexical_alternative
  - marker: b
    text: '''House'' here likely carries dynastic force, not merely the physical dwelling.'
    reason: cultural_note
  - marker: c
    text: Or 'and may it be blessed forever.' The Hebrew can be taken by some as expressing a wish, though the form is more naturally read as a statement of enduring blessedness.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 주님께서는 주의 종의 집을 복 주시기로 기뻐하셨으니, 그것이 주님 앞에 영원히 있게 하셨습니다. 주님, 주님께서 복 주셨으니, 그것은 영원히 복받은 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기뻐하셨으니’는 ‘기꺼이 하셨으니’, ‘허락하셨으니’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘집’은 단순한 건물이 아니라 다윗 왕조의 가문을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 마지막 절은 ‘영원히 복되게 하셨습니다’ 또는 ‘영원히 복받게 하셨습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 장면 전환을 자연스러운 현대 한국어로 옮기되, 원문의 전환 기능을 살려 간결하게 처리했습니다.
- source_word: הוֹאַלְתָּ
  english_pob_choice: you have been pleased
  chosen_korean: 기뻐하셨으니
  alternatives_korean:
  - 기꺼이 하셨으니
  - 허락하셨으니
  - 마음에 들어 하셨으니
  lexicon: HALOT
  rationale: 이 동사는 단순한 실행보다 기꺼이 받아들임/호의적 동의를 드러내므로, 문맥상 하나님의 은혜로운 뜻을 살리는 표현을 택했습니다.
- source_word: בֵּית עַבְדְּךָ
  english_pob_choice: the house of your servant
  chosen_korean: 주의 종의 집
  alternatives_korean:
  - 주의 종의 가문
  - 주의 종의 가정
  - 주의 종의 집안
  lexicon: HALOT
  rationale: 여기서 ‘집’은 물리적 건물보다 다윗 계열의 후손과 가문을 가리키므로, 한국어에서도 ‘집’으로 두되 ‘주의 종’과 결합해 왕조적 의미를 유지했습니다.
- source_word: לְעוֹלָם לְפָנֶיךָ
  english_pob_choice: that it may be before you forever
  chosen_korean: 주님 앞에 영원히 있게 하셨습니다
  alternatives_korean:
  - 주님 앞에 영원히 있도록 하셨습니다
  - 주님 앞에 영원히 서 있게 하셨습니다
  lexicon: HALOT
  rationale: ‘앞에’는 단순한 시간 표현이 아니라 하나님 앞에서의 지속적 존속을 뜻하므로, 관계적·언약적 뉘앙스를 살려 옮겼습니다.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  english_pob_choice: and it is blessed forever
  chosen_korean: 영원히 복받은 것입니다
  alternatives_korean:
  - 영원히 복된 것입니다
  - 영원히 복을 받은 상태입니다
  lexicon: HALOT
  rationale: 분사형의 상태적 의미를 살려 선언적으로 옮겼고, ‘복받은’으로 이미 주어진 복의 지속 상태를 나타냈습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 화자가 하나님께 직접 말하는 기도문이므로 한국어 본문에서는 호칭형 ‘주님’이 가장 자연스럽습니다. 다만 본문 내에서 고유명사보다 직접 호명 기능이 강하므로 대화체 호칭을 우선했습니다.
  doctrine_reference: POB name-rendering policy for divine address
- issue: 마지막 절의 문법적 성격
  chosen_reading: 선언적 상태 진술
  alternative_readings:
  - 소망/청원적 표현
  - 미래적 예언
  rationale: 히브리어 분사형은 명령이나 청원보다 이미 복 주신 결과로서 지속되는 상태를 진술하는 것이 자연스럽습니다. 따라서 ‘복받은 것입니다’로 선언형을 유지했습니다.
  doctrine_reference: WLC participle usage in resultative constructions
