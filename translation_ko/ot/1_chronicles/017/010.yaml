  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
  footnotes:
  - marker: a
    text: Or, 'the LORD will build a house for you,' that is, establish a dynasty for you.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이스라엘 내 백성 위에 사사들을 세웠던 때로부터입니다. 내가 모든 원수들을 굴복시킬 것입니다. 또한 너에게 말합니다. 야훼께서 너를 위하여 집을 세우실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘주께서 너를 위하여 집을 세우실 것이다,’ 곧 너를 위한 왕조를 확립하실 것이다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִיָּמִים
  english_pob_choice: from the days
  chosen_korean: ~때로부터
  alternatives_korean:
  - ~날들로부터
  - 그 날들부터
  lexicon: HALOT
  rationale: 시간의 기원을 나타내는 전치사구로, 한국어에서는 ‘~때로부터’가 가장 자연스럽고 문맥의 회고적 시작점을 잘 드러냅니다.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים עַל עַמִּי יִשְׂרָאֵל
  english_pob_choice: when I appointed judges over my people Israel
  chosen_korean: 내가 이스라엘 내 백성 위에 사사들을 세웠던
  alternatives_korean:
  - 내가 이스라엘 내 백성 위에 사사들을 임명했던
  - 내가 이스라엘 내 백성 위에 사사들을 명령했던
  lexicon: HALOT
  rationale: צוה는 문자적으로 ‘명하다’이지만, 여기서는 사사를 백성 위에 두는 제도적 임명을 가리키므로 ‘세우다’가 영어 POB의 ‘appointed’를 한국어로 가장 적절하게 옮깁니다.
- source_word: וְהִכְנַעְתִּי
  english_pob_choice: I will subdue
  chosen_korean: 굴복시킬 것입니다
  alternatives_korean:
  - 복종시킬 것입니다
  - 낮추실 것입니다
  lexicon: HALOT
  rationale: 대적들을 대상으로 한 동사의 힘을 살리기 위해 ‘굴복시키다’를 택했습니다. ‘낮추다’는 의미는 맞지만 한국어에서 전투적 정복의 뉘앙스가 약합니다.
- source_word: וָאַגִּד לָךְ
  english_pob_choice: Moreover, I tell you
  chosen_korean: 또한 너에게 말합니다
  alternatives_korean:
  - 또 내가 너에게 말하겠습니다
  - 그리고 내가 너에게 선언합니다
  lexicon: HALOT
  rationale: נגד의 선언적 뉘앙스를 살리되, 한국어에서는 이어지는 계시적 진술을 간결하게 연결하는 표현이 자연스럽습니다.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  english_pob_choice: Yahweh will build you a house
  chosen_korean: 야훼께서 너를 위하여 집을 세우실 것입니다
  alternatives_korean:
  - 야훼께서 너를 위해 집을 지으실 것입니다
  - 야훼께서 너를 위하여 집을 마련하실 것입니다
  lexicon: HALOT
  rationale: ‘집’은 본문의 핵심 말장난을 보존하며, ‘세우다’는 동사도 히브리어 בנה의 건축/설립 의미를 함께 담습니다. ‘세우다’는 한국어에서 다소 제도적·관계적 확장도 허용합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명사는 ‘야훼’로 옮기며, 전통적 대치어인 ‘주님’은 본문의 고유명사성을 약화시킵니다.
theological_decisions:
- issue: ‘집’의 의미를 본문에서 어떻게 보존할 것인가
  chosen_reading: ‘집’을 그대로 유지하여 다윗 왕조를 가리키는 확장 의미는 문맥이 받쳐 주도록 두었습니다.
  alternative_readings:
  - 야훼께서 너를 위하여 왕조를 세우실 것입니다
  rationale: 히브리어 בַּיִת의 이중 의미(물리적 집/가문·왕조)를 번역이 미리 해소하지 않도록 해야 본문의 문학적 긴장이 살아납니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, #5'
