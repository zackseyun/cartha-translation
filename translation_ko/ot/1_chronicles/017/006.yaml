reference: 1 Chronicles 17:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
  footnotes:
  - marker: a
    text: The parallel passage in 2 Samuel 7:7 reads 'tribes of Israel' (with some witnesses reflecting 'leaders' or 'scepters') rather than 'judges of Israel.' Chronicles' Hebrew text here reads 'judges.'
    reason: textual_variant
translation:
  language: ko
  text: 내가 이스라엘 온 땅 가운데 어디를 다니든지, 이스라엘의 어느 재판관에게도 내가 한마디라도 말한 적이 있느냐? 나는 그들에게 내 백성을 기르라고 명령한 바 있는데, “왜 너희는 나를 위해 백향목 집을 짓지 않았느냐?” 하고 말한 적이 있느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 본문은 평행본문인 2사무엘 7:7의 '이스라엘의 지파들'과 다르게, 역대기 본문의 히브리어는 '이스라엘의 재판관들'이라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי בְּכָל יִשְׂרָאֵל
  english_pob_choice: I have walked among all Israel
  chosen_korean: 이스라엘 온 땅 가운데 어디를 다니든지
  alternatives_korean:
  - 이스라엘 가운데 두루 다니든지
  - 온 이스라엘 가운데서 걸어 다니든지
  lexicon: HALOT
  rationale: 하나님이 백성 가운데서 함께 ‘다니신’ 이동·임재의 이미지를 살리면서, 한국어에서는 ‘걸어 다니다’보다 자연스러운 ‘다니시다/다니든지’로 옮겼습니다.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  english_pob_choice: the judges of Israel
  chosen_korean: 이스라엘의 어느 재판관
  alternatives_korean:
  - 이스라엘의 어느 사사
  - 이스라엘의 지도자
  lexicon: HALOT
  rationale: 열왕·통치자의 직분을 가리키는 본문으로서, 사사기의 전형적 용어를 기계적으로 고정하기보다 현대 독자가 이해할 수 있는 ‘재판관’으로 옮기되, 히브리어의 직분 표지를 유지했습니다.
- source_word: לִרְעוֹת אֶת עַמִּי
  english_pob_choice: to shepherd my people
  chosen_korean: 내 백성을 기르라고
  alternatives_korean:
  - 내 백성을 치라고
  - 내 백성을 목양하라고
  lexicon: HALOT
  rationale: רעה의 목자-통치 비유를 살리면서도 한국어에서는 ‘목양하다’가 다소 문어적이므로, 비유성과 통치 책임을 함께 드러내는 ‘기르다’로 옮겼습니다.
- source_word: בֵּית אֲרָזִים
  english_pob_choice: a house of cedar
  chosen_korean: 백향목 집
  alternatives_korean:
  - 삼나무 집
  - 백향목으로 지은 집
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 반영하면서, 성경적 격조가 있는 재료명 ‘백향목’을 유지했습니다.
theological_decisions:
- issue: Chronicles의 'judges of Israel'를 사무엘하 평행본문의 다른 표현과 조화할지 여부
  chosen_reading: 역대기의 현존 히브리어를 따라 '이스라엘의 어느 재판관'으로 본문에 반영했습니다.
  alternative_readings:
  - 사무엘하 평행본문을 따라 '이스라엘의 지파들/지도자들'로 조화시키는 방식
  rationale: 본문의 문학적·사본학적 차이를 지워버리지 않고, 역대기의 실제 어휘를 우선하는 것이 원문 우선 원칙에 더 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
