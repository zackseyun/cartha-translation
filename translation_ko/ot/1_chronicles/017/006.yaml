- from: 내가 이스라엘 온 땅 가운데 어디를 다니든지, 이스라엘의 어느 재판관에게도 내가 한마디라도 말한 적이 있느냐? 나는 그들에게 내 백성을 기르라고 명령한 바 있는데, “왜 너희는 나를 위해 백향목 집을 짓지 않았느냐?” 하고 말한 적이 있느냐?[a]
  to: 내가 온 이스라엘 가운데 두루 다닌 어느 곳에서든, 내 백성을 목자처럼 돌보도록 내가 명령한 이스라엘의 재판관들[a] 가운데 한 사람에게라도 ‘왜 너희는 나를 위하여 백향목으로 지은 집을 짓지 않았느냐?’라고 한마디라도 말한 적이 있습니까?
