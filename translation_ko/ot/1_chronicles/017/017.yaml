source:
  edition: WLC
  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
  footnotes:
  - marker: a
    text: Or, 'you have shown me the future generations of men,' or 'you have regarded me as a man of high degree.' The Hebrew of the final clause is difficult and admits several interpretations.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님, 이것은 주께서 보시기에 작은 일이었습니다. 그러나 주의 종의 집에 대하여 먼 장래까지 말씀하셨으며, 야훼 하나님, 저를 높은 지위에 있는 사람의 경우처럼 여기셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 매우 어렵고 여러 해석이 가능합니다. “저에게 사람들의 미래 세대를 보여 주셨다” 또는 “저를 높은 지위의 사람으로 여기셨다”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת
  english_pob_choice: this was a small thing
  chosen_korean: 이것은 ... 작은 일이었습니다
  alternatives_korean:
  - 이것은 별것 아니었습니다
  - 이것은 너무 적은 일이었습니다
  lexicon: HALOT
  rationale: קטן의 관용적 의미를 살려 하나님의 관점에서 ‘작은 일’이라는 평가를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְּעֵינֶיךָ
  english_pob_choice: in your eyes
  chosen_korean: 하나님 보시기에
  alternatives_korean:
  - 당신의 눈에
  - 당신의 시야에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 ‘보시기에’로 옮겨 평가와 판단의 의미를 드러냈습니다.
- source_word: לְמֵרָחוֹק
  english_pob_choice: for a long time to come
  chosen_korean: 먼 장래까지
  alternatives_korean:
  - 오랜 미래까지
  - 먼 훗날까지
  lexicon: HALOT
  rationale: 시간적 거리감을 담는 표현으로, 다윗의 집에 대한 장차의 약속을 자연스럽게 전달합니다.
- source_word: וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  english_pob_choice: you have regarded me according to the rank of man on high
  chosen_korean: 저를 높은 지위의 사람처럼 여기셨습니다
  alternatives_korean:
  - 저를 높은 지위의 사람의 질서대로 여기셨습니다
  - 저를 높이 오른 사람의 범주로 보셨습니다
  lexicon: HALOT
  rationale: 마지막 절은 본문상 난해하므로, POB의 난해성 보존 원칙에 따라 ‘고귀한 인간 지위에 비유하여 대하심’이라는 핵심을 유지하면서도 한국어로 과도하게 어색하지 않게 옮겼습니다.
theological_decisions:
- issue: יְהוָה אֱלֹהִים의 호칭 처리
  chosen_reading: 야훼 하나님
  alternative_readings:
  - 여호와 하나님
  - 주 하나님
  rationale: 본문의 고유명 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, सीधे 호칭의 병치를 살리기 위해 ‘하나님’을 덧붙였습니다.
  doctrine_reference: YHWH transliteration default; preserve divine name
- issue: 마지막 절의 난해한 비교구문 보존
  chosen_reading: 저를 높은 지위의 사람처럼 여기셨습니다
  alternative_readings:
  - 저를 높은 지위의 사람으로 여기셨습니다
  - 저를 사람의 높은 지위에 따라 여기셨습니다
  rationale: 히브리어의 모호성을 단정적으로 풀지 않고, 다윗이 비범하게 높임받았다는 의미를 보존하면서도 해석을 과도하게 고정하지 않았습니다.
  doctrine_reference: Translation philosophy §3 — preserve theological tension rather than resolve it
