base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
  footnotes:
  - marker: a
    text: Hebrew literally, 'have uncovered the ear of your servant,' an idiom meaning 'have revealed to your servant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'establish a dynasty for him'; 'house' here likely carries the sense of an enduring royal line as well as a household.
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 저의 하나님이시여, 주께서 주의 종에게 그를 위하여 집을 세우실 것이라고 알려 주셨으므로[a], 주의 종은 주님 앞에서 기도할 담대함을 얻었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘주의 종의 귀를 드러내셨습니다’라는 관용구이며, ‘주의 종에게 알려 주셨습니다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 여기서 물리적인 집뿐 아니라 다윗 계열의 지속되는 왕가를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  english_pob_choice: have revealed to your servant
  chosen_korean: 주의 종에게 당신께서 아시게 하셨습니다
  alternatives_korean:
  - 주의 종의 귀를 여셨습니다
  - 주의 종에게 드러내셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘귀를 드러내다/여다’의 뜻을 한국어로 자연스럽게 옮기되, 계시의 의미가 분명히 드러나도록 ‘아시게 하셨습니다’로 처리했습니다.
- source_word: בָּיִת
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 가문
  - 왕조
  lexicon: HALOT
  rationale: 본문이 다윗 언약의 층위 있는 의미를 지니므로, 주된 이미지를 살리기 위해 ‘집’을 유지했습니다. ‘가문’이나 ‘왕조’는 해석을 앞당기는 표현이라 본문에는 두지 않았습니다.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  english_pob_choice: has found courage to pray
  chosen_korean: 기도할 담대함을 얻었습니다
  alternatives_korean:
  - 기도할 용기를 찾았습니다
  - 기도할 마음을 얻었습니다
  lexicon: HALOT
  rationale: ‘찾다’로 직역하면 한국어에서 어색하므로, 동사구가 나타내는 내적 결단과 담대함의 뉘앙스를 살려 ‘담대함을 얻었습니다’로 옮겼습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주님의 임재 안에서
  lexicon: HALOT
  rationale: 기도의 위치 관계를 간결하고 자연스럽게 드러내는 표준적 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘house’의 다층적 의미 유지
  chosen_reading: 본문은 ‘집’으로 두고, 왕조/가문 의미는 본문 밖에서 열어 둡니다.
  alternative_readings:
  - ‘왕조’로 명시적으로 번역
  - ‘가문’으로 풀이
  rationale: 히브리어 בָּיִת는 여기서 물리적 집과 다윗 계열의 지속적 혈통을 함께 암시하므로, 한쪽으로 단정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, §5
