source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
  footnotes:
  - marker: a
    text: Or 'And I will set him in my house and over my kingdom forever.' The Hebrew preposition can be rendered more woodenly, but the main text preserves the parallel phrasing and broader sense.
    reason: lexical_alternative
  - marker: b
    text: The 'him' may refer immediately to David's royal descendant, especially Solomon, while also contributing to the broader Davidic promise later understood messianically.
    reason: alternative_reading
  - marker: c
    text: '''My house'' may denote God''s house in a broad covenantal sense; some understand it more specifically as the temple or as God''s royal household.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 내가 그를 내 집과 내 나라에 영원히 세울 것이며, 그의 왕좌는 영원히 견고할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사구는 더 문자적으로는 ‘내 집 위에, 내 나라 위에’로도 옮길 수 있지만, 본문은 병행 구조와 넓은 의미를 살려 ‘내 집과 내 나라에’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그를’은 즉각적으로는 다윗의 왕적 후손, 특히 솔로몬을 가리킬 수 있지만, 더 넓게는 다윗 언약의 계보와 메시아적 기대까지 함께 열어 둡니다.
    reason: alternative_reading
  - marker: c
    text: ‘내 집’은 문맥에 따라 하나님의 집, 곧 성전이나 왕실 가문/언약 영역을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  english_pob_choice: But I will establish him
  chosen_korean: 그러나 내가 그를 … 세울 것이며
  alternatives_korean:
  - 그러나 내가 그를 확립할 것이며
  - 그러나 내가 그를 세워 둘 것이며
  - 그러나 내가 그를 굳게 세울 것이며
  lexicon: HALOT
  rationale: העמיד의 사역형은 위치를 세우고 굳게 서게 하는 뜻이므로, 왕조적·언약적 문맥에서 자연스러운 ‘세우다’로 옮기되, 앞선 경고와의 대조는 ‘그러나’로 살렸습니다.
- source_word: בְּבֵיתִי
  english_pob_choice: in my house
  chosen_korean: 내 집
  alternatives_korean:
  - 내 집 안에
  - 내 집에서
  - 내 가문
  lexicon: HALOT
  rationale: בְּ + בית의 기본 의미를 직접 반영해 ‘내 집’으로 옮기고, 성전·왕실·언약적 가문을 한쪽으로 좁히지 않도록 했습니다.
- source_word: וּבְמַלְכוּתִי
  english_pob_choice: and in my kingdom
  chosen_korean: 내 나라
  alternatives_korean:
  - 내 왕국
  - 내 통치
  - 내 나라 안에
  lexicon: HALOT
  rationale: מלכות는 왕권의 영역을 가리키므로 현대 한국어에서 자연스럽고 포괄적인 ‘나라’로 옮겼습니다. 문맥상 통치 영역을 뜻하지만, ‘왕국’보다 덜 경직되고 병행 구조도 유지합니다.
- source_word: נָכוֹן
  english_pob_choice: will be established
  chosen_korean: 견고할 것입니다
  alternatives_korean:
  - 확립될 것입니다
  - 안정될 것입니다
  - 굳게 설 것입니다
  lexicon: HALOT
  rationale: נכון은 ‘굳다, 확고하다, 확립되다’의 의미가 있어 왕좌의 안정성을 드러내는 ‘견고하다’가 적절합니다. 앞 절의 ‘세우다’와도 어휘상 대응이 됩니다.
theological_decisions:
- issue: 히브리어 부사구 עַד הָעוֹלָם / עַד עוֹלָם의 반복
  chosen_reading: 두 번 모두 ‘영원히’로 옮겨, 언약적 지속성과 왕위의 영속성을 분명히 했습니다.
  alternative_readings:
  - 영구히
  - 세세토록
  - 끝없이
  rationale: 문맥은 דוד 왕조에 대한 지속적 약속을 말하므로, 오늘날 독자가 즉시 이해할 수 있는 ‘영원히’가 가장 직접적입니다. 반복을 그대로 살려 약속의 강도를 유지했습니다.
  doctrine_reference: 다윗 언약의 지속성과 메시아적 성취 가능성을 열어 두는 번역입니다.
- issue: ‘내 집’과 ‘내 나라’의 범위
  chosen_reading: 본문에서는 각각 ‘내 집’, ‘내 나라’로 직역해 성전/왕조/통치의 층위를 한 해석으로 고정하지 않았습니다.
  alternative_readings:
  - 내 성전과 내 왕국
  - 내 가문과 내 통치
  rationale: 원문은 층위가 겹치는 표현을 사용하므로, 번역에서 미리 단정하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 다층적 의미를 보존합니다.
