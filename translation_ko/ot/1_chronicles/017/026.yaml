translation:
  language: ko
  text: 이제 야훼여, 주님은 하나님이시며, 주님의 종에 대하여 이 좋은 일을 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 종에 대하여 이 좋은 약속을 말씀하셨습니다’라고 옮길 수 있습니다. 히브리어는 문자적으로 ‘이 좋은 일’을 뜻합니다.
    reason: lexical_alternative
