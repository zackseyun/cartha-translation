  terminology: 야훼는 원문의 신명 יְהוָה 및 프로젝트의 Yahweh 방침을 충실히 반영합니다. ‘하나님’, ‘주님의 종’, ‘말씀하셨습니다’도 문맥과 높임말에 적절합니다. ‘좋은 일’은 הַטּוֹבָה הַזֹּאת의 비해석적 표현을 유지합니다.
