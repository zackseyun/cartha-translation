  alternative_readings:
  - 야훼여, 주님께서는 하나님이십니다
  - 여호와여, 주님은 하나님이십니다
  rationale: 원문은 יְהוָה와 הָאֱלֹהִים을 함께 사용하며, 전자는 언약 이름, 후자는 하나님 되심의 진술입니다. 한국어에서도 두 요소를 구분해 재현하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
