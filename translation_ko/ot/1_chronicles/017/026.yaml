  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
  footnotes:
  - marker: a
    text: Or 'you spoke this good promise concerning your servant.' The Hebrew says literally, 'you spoke this good thing concerning your servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 야훼여, 주님께서는 하나님이시며, 주님의 종에게 이 좋은 일을 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 종에게 이 좋은 약속을 말씀하셨습니다’라고 옮길 수 있습니다. 히브리어는 문자적으로 ‘이 좋은 일’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문에 직접 있는 언약 이름을 살리기 위해 전통적 대체어인 ‘주님’보다 음역형 ‘야훼’를 채택했습니다.
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 연결 접속사의 흐름과 기도 문맥의 전환을 함께 살리기 위해 ‘그리고 이제’로 옮겼습니다.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  english_pob_choice: you are God
  chosen_korean: 주님께서는 하나님이시며
  alternatives_korean:
  - 주님은 하나님이십니다
  - 주님께서 바로 하나님이십니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 인칭구문을 한국어에서는 자연스러운 동일시 진술로 옮기되, 합쇼체 기도문체를 유지했습니다.
- source_word: וַתְּדַבֵּר עַל
  english_pob_choice: you have spoken concerning
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말씀해 오셨습니다
  - 말해 주셨습니다
  lexicon: HALOT
  rationale: ‘말씀하다’가 하나님 말씀의 품격과 원문의 발화 행위를 가장 직접적으로 반영합니다. ‘concerning’은 뒤의 목적어로 자연스럽게 처리했습니다.
- source_word: הַטּוֹבָה הַזֹּאת
  english_pob_choice: this good thing
  chosen_korean: 이 좋은 일
  alternatives_korean:
  - 이 좋은 것
  - 이 선한 약속
  lexicon: HALOT
  rationale: 히브리어의 직역형 ‘좋은 것’은 한국어에서 다소 어색하여, 문맥상 다윗에게 하신 은혜로운 선언을 가리키는 표현으로 ‘좋은 일’을 택했습니다.
theological_decisions:
- issue: 다윗의 기도에서 하나님의 이름과 직접 호칭을 어떻게 분리할지
  chosen_reading: 첫 호칭은 ‘야훼여’로, 뒤의 동일시 진술은 ‘주님께서는 하나님이시며’로 분리했습니다.
  alternative_readings:
  - 야훼여, 주님께서는 하나님이십니다
  - 여호와여, 주님은 하나님이십니다
  rationale: 원문은 יְהוָה와 הָאֱלֹהִים을 함께 사용하며, 전자는 언약 이름, 후자는 하나님 되심의 진술입니다. 한국어에서도 두 요소를 구분해 재현하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
