source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
  footnotes:
  - marker: a
    text: Or 'were their God.' The Hebrew can be rendered more statively, but the main text reflects the covenant-establishing force in context.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서는 주님의 백성 이스라엘을 영원히 주님의 백성으로 삼으셨으며, 주님, 야훼께서는 그들의 하나님이 되셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 하나님이셨습니다.’ 히브리어는 보다 상태적으로 옮길 수도 있으나, 본문 문맥은 언약을 세우는 힘을 드러냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  english_pob_choice: you made
  chosen_korean: 삼으셨으며
  alternatives_korean:
  - 주셨으며
  - 만드셨으며
  - 되게 하셨으며
  lexicon: HALOT
  rationale: 단순한 ‘주다’보다, 뒤따르는 ‘주님의 백성으로’와 함께 언약적 구성·설정의 뜻을 살려 ‘삼으셨다’로 옮겼습니다.
- source_word: עַמְּךָ יִשְׂרָאֵל
  english_pob_choice: your people Israel
  chosen_korean: 주님의 백성 이스라엘
  alternatives_korean:
  - 이스라엘인 주님의 백성
  - 이스라엘, 주님의 백성
  lexicon: HALOT
  rationale: 히브리어의 소유관계와 동격 구조를 살려 ‘주님의 백성 이스라엘’로 배열했습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝까지
  - 세세토록
  lexicon: HALOT
  rationale: 지속의 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님, 야훼
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 문맥상 호격으로 부르면서도, 본문의 신명은 ‘야훼’로 보존했습니다. 앞의 ‘주님’은 한국어 호칭을 살리고 뒤의 ‘야훼’는 원문 고유명을 드러냅니다.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  english_pob_choice: became their God
  chosen_korean: 그들의 하나님이 되셨습니다
  alternatives_korean:
  - 그들의 하나님이셨습니다
  - 그들의 하나님으로 계셨습니다
  lexicon: HALOT
  rationale: 완료형이 드러내는 언약적 성립을 한국어에서는 ‘되셨습니다’로 옮겨, 단순 상태 진술보다 관계의 성립을 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 처리와 호격 표현
  chosen_reading: ‘주님, 야훼’로 옮겨, 호격과 고유명을 함께 보존했습니다.
  alternative_readings:
  - ‘야훼’만 사용
  - ‘주님’만 사용
  rationale: 본문의 직접 호칭을 살리면서도 신명 자체를 지우지 않기 위한 선택입니다. 한국어 문장 흐름상 호격 ‘주님’을 앞에 두고, 본문 정보로서 ‘야훼’를 덧붙였습니다.
  doctrine_reference: 신명 보존과 호칭의 구별
- issue: הָיִיתָ לָהֶם לֵאלֹהִים의 언약적 완료
  chosen_reading: ‘그들의 하나님이 되셨습니다’
  alternative_readings:
  - ‘그들의 하나님이셨습니다’
  - ‘그들의 하나님으로 계셨습니다’
  rationale: 이 표현은 존재 본질의 변화가 아니라 언약 관계의 성립을 가리키므로, ‘되셨습니다’가 문맥의 힘을 가장 잘 드러냅니다.
  doctrine_reference: 언약 공식의 관계적 성립
