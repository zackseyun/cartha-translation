lexical_decisions:
- source_word: וַיְהִי ... בַּלַּיְלָה הַהוּא
  english_pob_choice: But ... that night
  chosen_korean: 그러나 그날 밤
  alternatives_korean:
  - 그리고 그날 밤
  - 그날 밤에
  lexicon: HALOT
  rationale: 서두의 וַיְהִי는 서사 진행을 여는 표현이므로 자연스러운 한국어 서술로 옮겼고, 앞 문맥과의 완만한 대비를 살려 ‘그러나’로 시작했습니다. ‘그날 밤’은 הַהוּא의 지시성을 보존합니다.
- source_word: דְּבַר אֱלֹהִים
  english_pob_choice: the word of God
  chosen_korean: 하나님의 말씀
  alternatives_korean:
  - 하나님에게서 온 말씀
  - 하나님의 메시지
  lexicon: HALOT
  rationale: 예언적 계시 공식으로서 דָּבָר의 격식을 살려 ‘말씀’으로 옮겼습니다. ‘하나님에게서 온 말씀’도 가능하지만, 본문이 가진 정형적인 계시 표현의 무게를 더 직접적으로 드러내기 위해 ‘하나님의 말씀’을 택했습니다.
- source_word: אֶל נָתָן
  english_pob_choice: to Nathan
  chosen_korean: 나단에게
  alternatives_korean:
  - 나단을 향해
  - 나단 앞으로
  lexicon: HALOT
  rationale: 수신 대상을 나타내는 אֶל은 한국어에서 가장 자연스럽게 ‘-에게’로 대응됩니다. 고유명사 나단은 통용 표기를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: 히브리어 직설화 표지 לֵאמֹר를 한국어 성경의 관용인 ‘말씀하셨습니다’로 처리해, 앞의 계시 동사와 함께 직접 발화가 시작됨을 분명히 했습니다.
theological_decisions:
- issue: נָתַן에게 임한 계시의 형식
  chosen_reading: 하나님의 말씀이 나단에게 임하여 말씀하셨습니다
  alternative_readings:
  - 하나님의 말씀이 나단에게 왔습니다
  - 하나님에게서 한 말씀이 나단에게 왔습니다
  rationale: 히브리어 서사에서 ‘말씀이 임하다’는 예언자적 계시를 가리키는 정형 표현이므로, 단순 이동보다 계시의 주도성과 권위를 드러내는 표현을 유지했습니다.
  doctrine_reference: 예언적 계시의 정형 표현을 보존
