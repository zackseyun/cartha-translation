source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
  footnotes:
  - marker: a
    text: 'Or: ''I have been from tent to tent, and from tabernacle to tabernacle.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이스라엘을 데리고 올라온 날부터 오늘에 이르기까지, 나는 집에 거주한 적이 없습니다. 그러나 나는 장막에서 장막으로, 또 거처에서 거처로[a] 옮겨 다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: “장막에서 장막으로, 성막에서 성막으로 옮겨 다녔습니다.”'
    reason: משכן은 ‘거처’ 외에 성소의 기술적 명칭인 ‘성막’으로도 옮길 수 있습니다.
lexical_decisions:
- source_word: לֹא יָשַׁבְתִּי בְּבַיִת
  english_pob_choice: I have not lived in a house
  chosen_korean: 집에 거주한 적이 없습니다
  alternatives_korean:
  - 집에 살지 않았습니다
  - 집에 머문 적이 없습니다
  lexicon: HALOT
  rationale: ישב는 거주하다/살다의 뜻이 자연스러우므로, '거주하다'를 써서 지속적 거주 부재를 분명히 했습니다. בית는 일반적인 집으로 옮겨, 성전으로 과도하게 구체화하지 않았습니다.
- source_word: מִן הַיּוֹם ... עַד הַיּוֹם הַזֶּה
  english_pob_choice: from the day ... to this day
  chosen_korean: 그날부터 오늘에 이르기까지
  alternatives_korean:
  - 그날로부터 오늘까지
  - 그날 이후 오늘까지
  lexicon: HALOT
  rationale: 히브리어의 시작점-종착점 구조를 한국어의 시간 범위 표현으로 자연스럽게 옮겼습니다.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  english_pob_choice: I brought up Israel
  chosen_korean: 이스라엘을 데리고 올라온
  alternatives_korean:
  - 이스라엘을 끌어올린
  - 이스라엘을 이끌고 올라온
  lexicon: HALOT
  rationale: עלה의 사역형을 살리되 한국어에서는 출애굽의 인도 행위를 드러내는 '데리고 올라오다'가 가장 자연스럽습니다. 단순한 이동보다 하나님의 주도성을 보존합니다.
- source_word: מֵאֹהֶל אֶל אֹהֶל וּמִמִּשְׁכָּן
  english_pob_choice: from tent to tent and from dwelling place to dwelling place
  chosen_korean: 장막에서 장막으로, 그리고 거처에서 거처로
  alternatives_korean:
  - 장막에서 장막으로, 그리고 성막에서 성막으로
  - 장막에서 장막으로, 그리고 거주처에서 거주처로
  lexicon: HALOT
  rationale: 반복 구조를 한국어에서도 그대로 살려 '에서 … 으로'를 반복했습니다. משכן은 문맥상 기술적 '성막'보다 이동하는 거처의 뜻이 더 두드러져 '거처'로 옮겼습니다.
theological_decisions:
- issue: בית와 משכן의 성소 표현을 후대 성전 용어로 바꿀지 여부
  chosen_reading: '''집''과 ''거처/장막''을 유지해, 고정된 성전 개념을 본문에 덧씌우지 않았습니다.'
  alternative_readings:
  - '''성전''으로 옮김'
  - '''성막''을 기술 용어로 사용'
  rationale: 본문의 대비는 '고정된 집'과 '이동하는 장막'이지, 후대 성전 제도의 확정적 언급이 아닙니다. 따라서 독자가 히브리어의 유동성과 대비를 그대로 이해하도록 했습니다.
  doctrine_reference: 원어 우선 원칙; 역사적 문맥 보존
- issue: '''I have gone''의 이동 뉘앙스를 한국어로 어떻게 반영할지'
  chosen_reading: '''옮겨 다녔습니다''로 풀어, 장막에서 장막으로 이동하는 지속성을 드러냈습니다.'
  alternative_readings:
  - '''다녔습니다'''
  - '''있었습니다'''
  rationale: 히브리어의 와우 연속 및 장소 이동 문맥은 단순 존재보다 이동 경로를 강조합니다. 한국어에서도 그 동태를 살리는 편이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 최적 대응 번역 원칙
