  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
  footnotes:
  - marker: a
    text: 'Or ''according to your will.'' Hebrew: ''according to your heart.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew shifts from singular 'all this greatness' to plural 'all the great things,' likely using the singular as a collective summary and the plural for its expressions.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주의 종을 위하고 주의 마음에 따라, 주께서는 이 모든 عظ대함을 행하셔서 이 모든 큰 일들을 알게 하셨습니다.[a] [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 뜻에 따라’. 히브리어는 문자적으로 ‘주의 마음에 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 ‘이 모든 위대함’과 복수 ‘이 모든 큰 일들’로 바뀌어, 단수는 집합적 요약이고 복수는 그 구체적 표현들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
