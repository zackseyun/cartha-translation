theological_decisions:
- issue: 하나님의 내적 의향을 가리키는 ‘마음’ 비유 보존
  chosen_reading: ‘주의 마음’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘주의 뜻’으로 의미 해석
  - ‘주의 계획’으로 설명
  rationale: 원문은 하나님의 내적 의향을 ‘마음’으로 말하므로, 이를 해석어로 바꾸면 비유와 신학적 긴장이 약해집니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 Preserve theological tension rather than resolve it'
