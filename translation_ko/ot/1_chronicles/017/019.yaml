translation:
  language: ko
  text: 야훼여, 주의 종을 위하시고 주의 마음에 따라[a] 이 모든 큰일을 행하시어 모든 큰일들을 알게 하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 뜻에 따라’. 히브리어는 문자적으로 ‘주의 마음에 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 앞에서 단수 ‘이 모든 위대함’을, 뒤에서 복수 ‘모든 큰일들’을 사용합니다. 단수는 집합적 요약이고 복수는 그 구체적 표현들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
