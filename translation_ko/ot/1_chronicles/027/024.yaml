reference: 1 Chronicles 27:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
  footnotes:
  - marker: a
    text: Or 'was not included' or 'was not recorded.' The Hebrew literally says 'did not go up,' an idiom for being entered into an official record.
    reason: lexical_alternative
  - marker: b
    text: '''the chronicles'' refers to the royal annals or official record associated with King David.'
    reason: cultural_note
translation:
  language: ko
  text: 요압, 스루야의 아들,은 세기 시작했으나 끝내지 못했습니다. 그리고 이 일로 이스라엘에 진노가 임했습니다[a]. 그리고 그 수는 다윗 왕의 역대기에 기록되지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 위에 진노가 있었다/일어났다’는 식으로 말합니다. 문맥상 심판적 진노를 가리키지만, 여기서는 행위자를 직접 밝히지 않았습니다.
    reason: theological_note
  - marker: b
    text: ‘역대기’는 다윗 왕과 관련된 왕실 연대기, 곧 공식 기록을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  english_pob_choice: began to count
  chosen_korean: 세기 시작했으나
  alternatives_korean:
  - 계수하기 시작했으나
  - 인구를 세기 시작했으나
  lexicon: HALOT
  rationale: החל + מנה의 연결을 자연스러운 한국어로 살리되, 본문이 말하는 ‘세기’를 직접 드러내어 ‘인구조사’로 과도하게 구체화하지 않았습니다.
- source_word: וְלֹא כִלָּה
  english_pob_choice: but he did not finish
  chosen_korean: 끝내지 못했습니다
  alternatives_korean:
  - 완료하지 못했습니다
  - 마치지 못했습니다
  lexicon: HALOT
  rationale: כלה의 핵심 의미인 ‘완성/종결’을 간결하게 옮겼습니다.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  english_pob_choice: and because of this wrath came upon Israel
  chosen_korean: 이 일로 이스라엘에 진노가 임했습니다
  alternatives_korean:
  - 이 일로 이스라엘에 분노가 임했습니다
  - 이 일로 이스라엘 위에 진노가 내렸습니다
  lexicon: HALOT
  rationale: קצף을 문맥상 하나님의 심판적 ‘진노’로 옮기되, 영어 POB처럼 행위자를 명시하지 않고 ‘임했습니다’로 자연스럽게 표현했습니다.
- source_word: בְּמִסְפַּ֥ר דִּבְרֵי הַיָּמִים
  english_pob_choice: in the account of the chronicles
  chosen_korean: 역대기에
  alternatives_korean:
  - 기록된 역대기에
  - 왕의 역대기 기록에
  lexicon: HALOT
  rationale: דברי הימים의 관용구를 한국어 성경에서 통용되는 ‘역대기’로 간결하게 살리되, ‘기록’의 행정적 뉘앙스는 앞뒤 문맥으로 충분히 전달된다고 보았습니다.
- source_word: לַמֶּלֶךְ דָּוִיד
  english_pob_choice: of King David
  chosen_korean: 다윗 왕의
  alternatives_korean:
  - 다윗 왕에게 속한
  - 다윗 왕의
  lexicon: HALOT
  rationale: 소유/관계 표시를 자연스러운 소유격으로 옮겼습니다.
theological_decisions:
- issue: 진노의 주체를 명시할지 여부
  chosen_reading: 본문의 문언을 따라 주체를 밝히지 않고 ‘진노가 임했습니다’로 두었습니다.
  alternative_readings:
  - 여호와의 진노가 임했습니다
  - 하나님의 진노가 임했습니다
  rationale: 히브리어는 여기서 행위자를 직접 말하지 않으므로, 문맥상 가능한 신학적 해석을 본문에 미리 삽입하지 않기 위해 암시를 유지했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 문맥적 함의를 해설과 주석으로 다루기
