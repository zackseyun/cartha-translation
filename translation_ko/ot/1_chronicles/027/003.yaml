  lexicon: HALOT
  rationale: 히브리어의 족보적 표현을 살리되, 한국어에서는 ‘아들들’보다 ‘후손들/자손들’이 더 자연스럽기 때문에 문맥에 맞는 족보적 의미로 풀었습니다.
- source_word: הָרֹאשׁ
