  - 최고 책임자
  lexicon: HALOT
  rationale: 군사 행정 문맥에서 רֹאשׁ은 직함적 의미의 ‘머리/우두머리’를 가리키므로, 기능을 분명히 하는 표현을 택했습니다.
- source_word: שָׂרֵי הַצְּבָאוֹת
  english_pob_choice: the commanders of the divisions
  chosen_korean: 군대 지휘관들
  alternatives_korean:
  - 군대의 지휘관들
  - 부대 지휘관들
  lexicon: HALOT
  rationale: 문맥상 월별 편성된 군사 부대를 가리키므로, 지나치게 추상적인 ‘군대의 장관들’ 대신 실제 지휘 체계를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 출신 계보 표현의 범위
  chosen_reading: ‘베레스의 아들들 중에서’로 직역적 계보 표현을 유지하되, 한국어에서는 족보적 소속을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘베레스의 후손들 가운데서’
  - ‘베레스의 자손들 중에서’
  rationale: 히브리어는 문자적으로 ‘아들들’이지만, 족보/씨족 표지로 쓰이는 표현이어서 의미를 넓혀 이해시키는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 족보적/언약적 공동체 표지에 대한 성경 문맥 이해
