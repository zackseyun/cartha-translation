  text: מִן בְּנֵי פֶ֗רֶץ הָ/רֹ֛אשׁ לְ/כָל שָׂרֵ֥י הַ/צְּבָא֖וֹת לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
  footnotes:
  - marker: a
    text: Or 'the descendants of Perez.' The Hebrew literally says 'the sons of Perez,' a genealogical expression that can refer to a wider line of descent.
    reason: lexical_alternative
  - marker: b
    text: Or 'the commanders of the armies.' The Hebrew term often means 'armies' or 'hosts,' but in this chapter it refers to the organized monthly military divisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 베레스의 아들들 중에서, 그가 첫째 달의 모든 군대 지휘관을 관할하는 우두머리였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베레스의 후손들’입니다. 히브리어는 문자적으로 ‘베레스의 아들들’이라고 하지만, 족보적 표현으로 더 넓은 후손 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘군대의 지휘관들’입니다. 히브리어의 צְבָאוֹת는 보통 ‘군대들’ 또는 ‘군대의 무리들’을 뜻하지만, 이 장에서는 월별로 편성된 군사 부대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
