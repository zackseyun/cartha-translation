  yaml_path: translation/ot/1_chronicles/027/033.yaml
  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
  footnotes:
  - marker: a
    text: Or 'companion' or 'associate'; the Hebrew term can denote a friend generally, and in a royal context may also imply a trusted court companion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아히도벨은 왕의 조언자였고, 아르키 사람 후새는 왕의 친구였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘친구’는 일반적인 친구를 뜻할 수도 있고, 왕실 문맥에서는 왕의 신임을 받는 궁정의 동반자나 측근을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹעֵץ
  english_pob_choice: counselor
  chosen_korean: 조언자
  alternatives_korean:
  - 상담자
  - 고문
  lexicon: HALOT
  rationale: 왕실 직분 문맥에서 ‘조언자’가 counsel을 가장 자연스럽게 옮기며, 단순한 친절한 친구가 아니라 공식적 자문 역할을 드러냅니다.
- source_word: לַמֶּלֶךְ
  english_pob_choice: to the king
  chosen_korean: 왕의
  alternatives_korean:
  - 왕에게
  - 왕을 위한
  lexicon: HALOT
  rationale: 히브리어 ל의 관계·봉사 의미를 한국어에서는 소유격 구조로 자연스럽게 살려 ‘왕의 조언자’로 옮겼습니다.
- source_word: הָאַרְכִּי
  english_pob_choice: the Archite
  chosen_korean: 아르키 사람
  alternatives_korean:
  - 아르키인
  - 아르크 사람
  lexicon: HALOT
  rationale: 지명/출신을 나타내는 형용사형이므로, 현대 한국어에서 읽기 쉬운 민족·출신 표지로 풀어 옮겼습니다.
- source_word: רֵעַ
  english_pob_choice: friend
  chosen_korean: 친구
  alternatives_korean:
  - 동료
  - 동반자
  - 친밀한 동료
  lexicon: HALOT
  rationale: 본문의 기본 어휘값은 ‘친구’이며, 궁정 맥락에서의 공적 친밀성을 암시하되 본문 자체가 더 구체적인 관직명을 말하지는 않으므로 과도한 설명을 피했습니다.
theological_decisions:
- issue: 궁정 용어의 직분성 유지
  chosen_reading: 아히도벨과 후사이를 단순 인물 소개가 아니라 왕실 내 기능을 지닌 두 인물의 병렬 진술로 읽어, ‘조언자’와 ‘친구’의 차이를 유지했습니다.
  alternative_readings:
  - 둘 다 일반적 인간관계 표현으로 평탄화하기
  - 후사이를 ‘측근’ 등으로 더 해석적으로 옮기기
  rationale: 히브리어는 두 구를 대등하게 배치하지만 서로 다른 관계어를 사용하므로, 번역에서도 직분/역할의 대비가 드러나도록 했습니다.
  doctrine_reference: 본문 주석 수준의 역사·사회적 의미 보존
