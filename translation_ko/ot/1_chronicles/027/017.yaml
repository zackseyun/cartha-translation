  source_fidelity: 히브리어는 행정 명부의 병렬 구조로 ‘레위에 대하여/레위를 위해서는 하사뱌, 그무엘의 아들; 아론에 대하여/아론을 위해서는 사독’이라고 합니다. ‘~을 맡은 이는’은 이 문맥에서 לְ의 담당 관계를 자연스럽게 드러내며, 아론이라는 조상 이름의 환유도 본문에서 과도하게 풀어쓰지 않습니다.
  naturalness: ‘레위 지파를 맡은 이는 …이며, 아론을 맡은 이는 …입니다’는 현대 표준어 합쇼체에서 명부 문장으로 자연스럽습니다. 원문의 간결한 대구도 유지합니다.
  terminology: 고유명사 קְמוּאֵל은 ‘므두엘’이 아니라 통용 한국어 성경 음역인 ‘그무엘’로 바로잡아야 합니다. חֲשַׁבְיָה도 통용 표기인 ‘하사뱌’를 사용했습니다. ‘아론’은 원문대로 유지하고, 아론 계열 제사장 집단을 가리킬 가능성은 각주에서만 설명합니다.
