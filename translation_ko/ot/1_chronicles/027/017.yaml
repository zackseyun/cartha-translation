  to: 레위 지파를 맡은 이는 그무엘의 아들 하사뱌이며, 아론을 맡은 이는 사독입니다.[a]
  rationale: 원문의 담당 집단과 그 책임자를 짝짓는 명부 형식은 유지했습니다. 안전한 필수 수정은 קְמוּאֵל의 잘못된 음역을 ‘그무엘’로 고친 것입니다. 아론을 가리키는 환유는 원문처럼 본문에 보존하고 각주로만 설명했습니다.
