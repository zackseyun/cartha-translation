base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/017.yaml
  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
  footnotes:
  - marker: a
    text: Hebrew 'for Aaron,' likely meaning the Aaronic priestly house or the Aaronites.
    reason: cultural_note
translation:
  language: ko
  text: 레위를 맡은 이는 하사브야, 곧 므두엘의 아들입니다. 아론을 맡은 이는 사독입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아론을 위하여’는 아론 자손, 곧 아론 계열의 제사장 집단을 가리키는 말일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  english_pob_choice: for Levi
  chosen_korean: 레위를 맡은 이는
  alternatives_korean:
  - 레위를 위하여
  - 레위에 속한 이는
  - 레위 사람들을 맡은 이는
  lexicon: HALOT
  rationale: 행정 명부에서 לְ는 특정 가문/지파를 담당하는 배치를 나타내므로, 한국어에서는 ‘~를 맡은 이는’로 관계를 드러내는 것이 ‘for Levi’의 기능을 가장 자연스럽게 옮깁니다.
- source_word: חֲשַׁבְיָה בֶן קְמוּאֵל
  english_pob_choice: Hashabiah son of Kemuel
  chosen_korean: 하사브야, 곧 므두엘의 아들
  alternatives_korean:
  - 하사브야, 곧 케무엘의 아들
  - 하사브야, 케무엘의 아들
  lexicon: HALOT
  rationale: 고유명사는 음역하되, בֶן은 족보·신원 표지로서 한국어의 ‘아들’로 옮겨 관계를 분명히 했습니다.
- source_word: לְ/אַהֲרֹן
  english_pob_choice: for Aaron
  chosen_korean: 아론을 맡은 이는
  alternatives_korean:
  - 아론을 위하여
  - 아론에 속한 이는
  - 아론 가문을 맡은 이는
  lexicon: HALOT
  rationale: 본문은 ‘아론’이라는 선조 이름으로 제사장 집단을 가리키므로, 메시아적 해석이나 설명을 본문에 풀어쓰지 않고 기능만 살려 옮겼습니다.
- source_word: צָדוֹק
  english_pob_choice: Zadok
  chosen_korean: 사독
  alternatives_korean:
  - 자독
  lexicon: standard proper name
  rationale: 한국어 성경에서 널리 쓰이는 고유명사 형태를 따라 음역했습니다.
theological_decisions:
- issue: ‘아론’을 본문에서 어떻게 이해시키는가
  chosen_reading: 본문에는 ‘아론’을 그대로 두고, 그가 가리키는 제사장 계통은 암시 수준으로 유지합니다.
  alternative_readings:
  - 아론 가문을 맡은 이는
  - 아론 자손을 맡은 이는
  rationale: 히브리어는 פשוט히 ‘아론’이라 말하며, 행정 목록의 간결성을 유지합니다. 설명을 본문에 덧붙이면 원문의 표현을 넘어서게 되므로, 직접적 표현을 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy), §2 (translate titles; transliterate names)
