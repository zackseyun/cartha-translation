  - marker: b
    text: 원문은 ‘그의 분할/부대 위에’라는 구조를 가집니다.
    reason: source_note
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  english_pob_choice: The ninth, for the ninth month
  chosen_korean: 아홉째 달을 위한 아홉째 사람
