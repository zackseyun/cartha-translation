  lexicon: 행정/군사 단위
  rationale: מַחֲלֻקְתּוֹ는 조직된 차례·배치를 가리키므로, ‘반열’로 질서를 살리고 ‘맡은 사람’으로 감독 관계를 분명히 했습니다.
