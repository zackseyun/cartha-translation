  rationale: 본문은 제사장/군사 편제를 기록하는 역사 서술이므로, 의미를 과장하거나 약화하지 않고 행정 구조를 드러내는 번역이 적절합니다.
  doctrine_reference: 성경의 역사 서술은 실제 공동체 질서를 증언한다는 서술 신뢰성
