  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: ko
  text: 아홉째 달을 위한 아홉째 사람은 아나돗 사람 아비에셀이며, 그의 반열을 맡은 사람은 이만사천 명이었습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘아나돗 사람’은 지명에서 온 형용사 표현입니다.
