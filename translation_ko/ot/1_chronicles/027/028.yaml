  chosen_korean: 올리브나무
  alternatives_korean:
  - 올리브나무들
  - 감람나무
  - 올리브들
  lexicon: HALOT
  rationale: 문맥이 과수 관리 목록이므로 열매가 아니라 나무를 뜻하게 옮겼고, 현대 한국어에서는 ‘올리브나무’가 가장 분명합니다.
- source_word: וְהַשִּׁקְמִים
  english_pob_choice: the sycamore trees
  chosen_korean: 무화과뽕나무
  alternatives_korean:
  - 시컴어 나무
  - 뽕무화과나무
  - 시컴어-무화과나무
  lexicon: HALOT
  rationale: שִׁקְמִים은 성경적 ‘sycamore-fig tree’ 계열을 가리키므로, 식물종을 더 분명히 드러내는 ‘무화과뽕나무’로 옮겼습니다.
- source_word: בַּשְּׁפֵלָה
  english_pob_choice: in the Shephelah
  chosen_korean: 쉐펠라
  alternatives_korean:
  - 저지대
  - 낮은 지역
  - 쉐펠라 지방
  lexicon: HALOT
  rationale: 이 표현은 유다의 지리적 고유명사로 기능하므로, 설명어보다 지역명 자체를 보존하는 쪽이 본문의 역사성을 더 잘 살립니다.
- source_word: הַגְּדֵרִי
  english_pob_choice: the Gederite
  chosen_korean: 그데리 사람
  alternatives_korean:
  - 게델 사람
  - 그데르 사람
  - 그데르 출신 사람
  lexicon: HALOT
  rationale: גְּדֵרִי는 지명 유래의 민족형 형용사이므로, 한국어에서는 ‘~사람’으로 옮겨 출신을 드러냈습니다.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  english_pob_choice: the stores of oil
  chosen_korean: 기름 곳간
  alternatives_korean:
  - 기름 저장고
  - 기름 창고
  - 기름의 저장물
  lexicon: HALOT
  rationale: 저장 시설과 저장물을 함께 포괄하는 표현이므로, 한국어의 관용적 조합인 ‘기름 곳간’으로 간결하게 살렸습니다.
theological_decisions:
- issue: 행정 직책과 재산 관리의 표현
  chosen_reading: 이 구절은 왕국의 농산물과 저장고를 맡은 행정 책임자들의 배치를 기록한 것으로, 직역보다 관리 책임의 관계를 드러내는 번역을 택했습니다.
  alternative_readings:
  - 단순한 위치 표시로 읽는 번역
  - 재산 목록으로만 읽는 번역
  rationale: 히브리어 עַל의 행정적 용법과 목록 문맥을 반영해야, 본문이 말하는 통치 구조와 관리 범위가 분명해집니다.
  doctrine_reference: 본문 주해 원리
