base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
  footnotes:
  - marker: a
    text: Or “in the lowland.” “The Shephelah” refers to the foothill region of Judah.
    reason: cultural_note
  - marker: b
    text: “Sycamore trees” may also be rendered “sycamore-fig trees.”
    reason: lexical_alternative
translation:
  language: ko
  text: 쉐펠라[a]에 있는 올리브나무와 무화과뽕나무[b]는 게델 사람 바알하난이 맡았고, 기름 저장고는 요아스가 맡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쉐펠라’는 유다의 저지대 지역을 가리키는 지리명입니다.
    reason: cultural_note
  - marker: b
    text: ‘무화과뽕나무’는 ‘시컴어나무’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: Over
  chosen_korean: ~의 관리자
  alternatives_korean:
  - ~을 맡은 사람
  - ~의 책임자
  - ~을 다스리는 자
  lexicon: HALOT
  rationale: 행정 목록의 עַל은 단순한 ‘위에’가 아니라 특정 영역을 맡은 책임 관계를 가리키므로, 한국어에서는 자연스러운 직함인 ‘관리자’로 옮겼습니다.
- source_word: הַזֵּיתִים
