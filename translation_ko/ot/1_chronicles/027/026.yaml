revisions:
- from: 그리고 들에서 일하는 사람들과 땅을 경작하는 일을 맡은 이들은 에즈리, 곧 글룹의 아들이었습니다.
  to: 밭일을 하며 땅을 경작하는 이들을 맡은 사람은 글룹의 아들 에스리였습니다.
  rationale: 원문의 행정적 구문을 따라 에스리를 감독자 주어로, 밭일과 토지 경작에 종사하는 사람들을 그의 관할 대상으로 바로잡았습니다. 두 농업 표현은 원문의 병렬적·보충적 표현을 보존하기 위해 모두 유지했습니다.
