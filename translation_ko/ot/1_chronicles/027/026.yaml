source:
  edition: WLC
  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
  footnotes:
  - marker: a
    text: Or 'the workers of the field.' The Hebrew participial expression can be rendered more compactly.
    reason: lexical_alternative
  - marker: b
    text: Or 'for working the soil.' The phrase refers to agricultural cultivation.
    reason: lexical_alternative
translation:
  language: ko
  text: 밭일을 하며 땅을 경작하는 이들을 맡은 사람은 글룹의 아들 에스리였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And over
  chosen_korean: 그리고 … 맡은
  alternatives_korean:
  - 그리고 … 맡았습니다
  - 그 위에는
  - 또 그들을 맡은
  lexicon: HALOT
  rationale: 행정 명단에서 עַל은 특정 업무를 감독·총괄하는 뜻이므로, 한국어에서는 ‘맡은’으로 자연스럽게 감독 의미를 살렸습니다.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  english_pob_choice: those who did the work of the field
  chosen_korean: 들에서 일하는 사람들
  alternatives_korean:
  - 밭일을 하는 사람들
  - 밭의 일을 하는 사람들
  - 들의 일을 하는 사람들
  lexicon: HALOT
  rationale: 히브리어 분사구는 단순히 ‘일하는 자들’이 아니라 농업 현장에서 일하는 사람들을 가리키므로, 문맥상 자연스러운 한국어로 옮겼습니다.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  english_pob_choice: for the cultivation of the ground
  chosen_korean: 땅을 경작하는 일
  alternatives_korean:
  - 땅을 가꾸는 일
  - 흙을 일구는 일
  - 토지를 경작하는 일
  lexicon: HALOT
  rationale: עֲבֹדָה + אֲדָמָה는 단순한 ‘섬김’이 아니라 농사짓는 경작을 뜻하므로, ‘경작하는 일’로 뜻을 분명히 했습니다.
- source_word: עֶזְרִי בֶּן כְּלוּב
  english_pob_choice: Ezri son of Chelub
  chosen_korean: 에즈리, 곧 글룹의 아들
  alternatives_korean:
  - 에즈리, 글룹의 아들
  - 에즈리, 켈룹의 아들
  lexicon: BDB
  rationale: 고유명사는 음역하되, בן은 족보·행정 문맥의 표준 표현인 ‘아들’로 옮겼습니다. 영어 표기 Chelub은 한국어 음역으로 ‘글룹’이 가장 무난합니다.
