  text: לִ/בְנֵ֣י אֶפְרַ֔יִם הוֹשֵׁ֖עַ בֶּן עֲזַזְיָ֑הוּ לַ/חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יוֹאֵ֖ל בֶּן פְּדָיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
  footnotes:
  - marker: a
    text: Hoshea is alternatively spelled 'Hosea' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임 자손에게는 아자시야의 아들 호세아가 있었고, 므낫세 반 지파에게는 브다야의 아들 요엘이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 호세아는 영어에서 ‘Hosea’로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  english_pob_choice: For the sons of
  chosen_korean: ~자손에게는
  alternatives_korean:
  - ~아들들에게는
  - ~후손들에게는
  lexicon: HALOT
  rationale: 지파 명단의 배정 문맥에서 ל는 담당 대상을 나타내므로 ‘~에게는’으로 풀어 자연스러운 행정 목록 문체를 살렸고, בְנֵי는 혈통·지파 표지를 유지하는 의미로 ‘자손’으로 옮겼습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 아들
  - ~의 자
  lexicon: HALOT
  rationale: 히브리어 계보·명단의 표준 연결 표현이므로 직역성이 높은 ‘~의 아들’을 사용했습니다.
- source_word: לַ/חֲצִי שֵׁבֶט
  english_pob_choice: for the half-tribe
  chosen_korean: 므낫세 반 지파
  alternatives_korean:
  - 므낫세의 반 지파
  - 므낫세의 절반 지파
  lexicon: HALOT
  rationale: חֲצִי שֵׁבֶט은 한국어에서 관용적인 ‘반 지파’로 옮기되, 소속을 분명히 하려고 ‘므낫세 반 지파’로 자연스럽게 정리했습니다.
- source_word: הוֹשֵׁעַ
  english_pob_choice: Hoshea
  chosen_korean: 호세아
  alternatives_korean:
  - 호세아
  - 호세아(호세아/호셰아)
  lexicon: HALOT
  rationale: 영문 POB의 각주가 ‘Hoshea’의 대안 철자 ‘Hosea’를 밝히므로, 한국어에서는 더 널리 알려진 성경 인명 형태 ‘호세아’를 택해도 본문 의미가 유지됩니다.
- source_word: פְּדָיָהוּ
  english_pob_choice: Pedaiah
  chosen_korean: 브다야
  alternatives_korean:
  - 브다야
  - 페다야
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 통용되는 음역을 따르되, 히브리어 어형에 맞춘 표기 ‘브다야’를 사용했습니다.
