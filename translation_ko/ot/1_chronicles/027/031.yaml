    text: 또는 “하갈 사람”으로 옮길 수 있습니다. 히브리어의 민족이나 출신을 나타내는 형태는 두 방식으로 음역될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַצֹּאן
  english_pob_choice: Over the flocks
  chosen_korean: 가축 떼 위에는
  alternatives_korean:
  - 양 떼 위에는
  - 가축 떼를 맡아
  lexicon: HALOT
  rationale: עַל은 이 행정 목록에서 ‘관리 책임’의 관계를 나타내므로, 자연스러운 한국어로 ‘~위에는’이라고 옮겨 담당 영역을 먼저 제시했습니다.
- source_word: יָזִיז הַהַגְרִי
  english_pob_choice: Jaziz the Hagrite
  chosen_korean: 야지즈가 있었는데, 그는 하그리 사람입니다
  alternatives_korean:
  - 야지즈 하그리 사람
  - 야지즈 하그리 사람입니다
  lexicon: HALOT
  rationale: 고유명사 יָזִיז는 음역하고, הַגְרִי는 족속 표지를 살려 ‘하그리 사람’으로 옮겨 인물명과 민족/계통 표지를 함께 드러냈습니다.
- source_word: שָׂרֵי הָרְכוּשׁ
  english_pob_choice: officers over the property
  chosen_korean: 재산을 맡은 관리들이었습니다
  alternatives_korean:
  - 재산의 관리들이었습니다
  - 재산을 감독하는 관리들이었습니다
  lexicon: HALOT
  rationale: שָׂרִים은 여기서 귀족이 아니라 왕실 재산을 관리하는 행정 책임자를 가리키므로, ‘관리들’로 옮기되 ‘맡은’으로 책임 관계를 분명히 했습니다.
- source_word: הָרְכוּשׁ אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  english_pob_choice: the property that belonged to King David
  chosen_korean: 다윗 왕에게 속한 재산
  alternatives_korean:
  - 다윗 왕의 재산
  - 다윗 왕에게 속한 소유물
  lexicon: HALOT
  rationale: רְכוּשׁ은 소유물·재산의 의미이므로 ‘재산’으로 번역했고, 관계절은 소유 귀속을 분명히 하는 ‘속한’으로 처리했습니다.
