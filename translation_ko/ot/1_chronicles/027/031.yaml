translation:
  language: ko
  text: 가축 떼를 맡은 이는 하그리 사람 야지즈였습니다[a]. 이들은 모두 다윗 왕의 재산을 맡은 관리들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
