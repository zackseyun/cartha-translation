revisions:
- from: 제칠째, 곧 일곱째 달의 차례는 에브라임 자손 가운데서 온 헤렙스 사람 헬렉스이며, 그의 반열에는 이만 사천 명이 있었습니다.[a]
  to: 일곱째, 곧 일곱째 달을 맡은 이는 에브라임 자손 가운데서 온 펠론 사람[a] 헬레스이며, 그의 부대는 이만 사천 명이었습니다.
  rationale: 본문의 명단식 타원 구조는 유지하되 한국어에서 필요한 최소한의 보충으로 월별 담당과 순번을 명확히 했습니다. 잘못된 인명 및 씨족 명칭 음역을 바로잡고, 논쟁 가능한 씨족 명칭의 대안은 본문에 강제하지 않고 해당 어구에 연결된 각주로 보존했습니다.
