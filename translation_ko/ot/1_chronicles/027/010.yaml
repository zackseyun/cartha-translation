  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
  footnotes:
  - marker: a
    text: Or possibly 'the Paltite,' reflecting a different traditional identification of Helez's clan designation.
    reason: alternative_reading
translation:
  language: ko
  text: 제칠째, 곧 일곱째 달의 차례는 에브라임 자손 가운데서 온 헤렙스 사람 헬렉스이며, 그의 반열에는 이만 사천 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헤렙스 사람’은 히브리어 הַפְּלוֹנִי의 음역을 따른 것이며, 다른 전통에서는 ‘팔티 사람’으로도 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִיעִי
