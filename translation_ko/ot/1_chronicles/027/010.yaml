  lexicon: HALOT
  rationale: לְ + חֹדֶשׁ의 배정·담당 의미를 살리되, 한국어에서는 직역보다 명단 항목의 소속을 드러내는 표현이 자연스럽습니다.
- source_word: מִן בְּנֵי אֶפְרָיִם
  english_pob_choice: from the sons of Ephraim
