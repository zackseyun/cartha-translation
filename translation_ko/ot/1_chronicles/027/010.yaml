  lexicon: HALOT
  rationale: 수사 표현은 한국어 성경체에서 통용되는 ‘이만 사천 명’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: גנ칭/족속 명칭의 음역과 군사 명단의 문체
  chosen_reading: 이 절은 서술이 아니라 편제 명단이므로, 인물명과 지파 소속을 중심으로 간결한 공문체로 옮겼습니다.
  alternative_readings:
  - 더 설명적인 군사 서술로 풀어쓰기
  - 현대 행정문서체로 재구성
  rationale: 본문의 기능이 연대기적 명단 제시에 있으므로, 의미를 덧붙이지 않고 항목성을 유지하는 것이 본문의 의도를 가장 잘 반영합니다.
  doctrine_reference: 성경 본문 장르 보존
