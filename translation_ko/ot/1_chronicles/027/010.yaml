  lexicon: HALOT
  rationale: 명사 없이 서수만 놓인 열거 구조를 살려, 군대 명단의 순번을 자연스러운 한국어 서수로 옮겼습니다.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
