  rationale: 이 장의 군사 편제 의미를 한국어로 압축해 나타내면서도, ‘그의 반열’로 지휘 하위 단위를 드러냈습니다.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
