base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
  footnotes:
  - marker: a
    text: Or possibly 'the Paltite,' reflecting a different traditional identification of Helez's clan designation.
    reason: alternative_reading
translation:
  language: ko
  text: 일곱째, 곧 일곱째 달을 맡은 이는 에브라임 자손 가운데서 온 펠론 사람[a] 헬레스이며, 그의 부대는 이만 사천 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘펠론 사람’은 히브리어 본문의 음역입니다. 다른 전통에서는 ‘팔디 사람’으로도 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  english_pob_choice: The seventh
  chosen_korean: 제칠째
  alternatives_korean:
