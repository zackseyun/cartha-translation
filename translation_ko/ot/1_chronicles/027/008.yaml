  - 장교였고
  lexicon: HALOT
  rationale: 군사 편제의 책임자를 가리키므로 ‘지휘관’이 가장 직접적이고 현대적인 대응입니다.
- source_word: הַיִּזְרָח
  english_pob_choice: the Izrahite
  chosen_korean: 이즈라 사람
  alternatives_korean:
  - 이즈라 사람
  - 이즈라히 사람
  - 세라 사람
  lexicon: HALOT
  rationale: 히브리어 지명/족칭 형식을 한국어에서 무리 없이 옮기기 위해 ‘~사람’ 구조를 사용했고, 전통적 동화형 ‘세라 사람’은 본문에서 택하지 않았습니다.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  english_pob_choice: and over his division were
  chosen_korean: 그의 부서는
  alternatives_korean:
  - 그의 분대는
  - 그의 반은
  - 그의 사단은
  lexicon: HALOT
  rationale: מַחֲלֻקָה는 이 장의 반복 용례상 월별 군사 분편을 뜻하므로, 행정적·군사적 의미를 살려 ‘부서’로 옮겼습니다.
theological_decisions:
