  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Or, “the Zerahite.” The Hebrew gentilic here is traditionally rendered that way in some versions.
    reason: lexical_alternative
translation:
  language: ko
  text: 다섯째 달을 맡은 다섯째 부대의 지휘관은 이스라 사람 삼훗이었고, 그의 부대에는 이만 사천 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “세라 사람”. 일부 번역은 여기의 히브리어 족칭을 전통적으로 그렇게 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  english_pob_choice: The fifth
  chosen_korean: 다섯째 달에는
  alternatives_korean:
  - 다섯째에는
  - 다섯째 달에
  lexicon: HALOT
  rationale: 문맥상 월별 군사 편제를 가리키므로, 서수 표현을 ‘다섯째 달’로 자연스럽게 풀어 한국어 행정문체에 맞추었습니다.
- source_word: הַשַּׂר
  english_pob_choice: the commander
  chosen_korean: 지휘관이었고
  alternatives_korean:
