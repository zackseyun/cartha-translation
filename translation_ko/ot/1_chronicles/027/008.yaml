base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Or, “the Zerahite.” The Hebrew gentilic here is traditionally rendered that way in some versions.
    reason: lexical_alternative
translation:
  language: ko
  text: 다섯째 달에는 이즈라 사람 샴훗이 지휘관이었고, 그의 부서는 이만 사천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “세라 사람”. 일부 번역은 여기의 히브리어 족칭을 전통적으로 그렇게 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  english_pob_choice: The fifth
  chosen_korean: 다섯째 달에는
  alternatives_korean:
  - 다섯째에는
  - 다섯째 달에
  lexicon: HALOT
  rationale: 문맥상 월별 군사 편제를 가리키므로, 서수 표현을 ‘다섯째 달’로 자연스럽게 풀어 한국어 행정문체에 맞추었습니다.
- source_word: הַשַּׂר
  english_pob_choice: the commander
  chosen_korean: 지휘관이었고
  alternatives_korean:
  - 사령관이었고
  - 대장이었고
  - 장교였고
  lexicon: HALOT
  rationale: 군사 편제의 책임자를 가리키므로 ‘지휘관’이 가장 직접적이고 현대적인 대응입니다.
- source_word: הַיִּזְרָח
  english_pob_choice: the Izrahite
  chosen_korean: 이즈라 사람
  alternatives_korean:
  - 이즈라 사람
  - 이즈라히 사람
  - 세라 사람
  lexicon: HALOT
  rationale: 히브리어 지명/족칭 형식을 한국어에서 무리 없이 옮기기 위해 ‘~사람’ 구조를 사용했고, 전통적 동화형 ‘세라 사람’은 본문에서 택하지 않았습니다.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  english_pob_choice: and over his division were
  chosen_korean: 그의 부서는
  alternatives_korean:
  - 그의 분대는
  - 그의 반은
  - 그의 사단은
  lexicon: HALOT
  rationale: מַחֲלֻקָה는 이 장의 반복 용례상 월별 군사 분편을 뜻하므로, 행정적·군사적 의미를 살려 ‘부서’로 옮겼습니다.
theological_decisions:
- issue: 족칭 הַיִּזְרָח의 음역과 전통적 조화
  chosen_reading: 본문 형태를 따라 ‘이즈라 사람’으로 옮기고, 전통적으로 보이는 조화형은 본문에 넣지 않았습니다.
  alternative_readings:
  - 세라 사람
  - 세라 사람(조화형)
  rationale: 열왕기/역대기 계열의 족칭 표기가 전승 간에 흔들리지만, 이 절의 히브리어 형태 자체를 우선 반영하는 것이 원문 추적성에 더 유리합니다.
  doctrine_reference: 본문비평/역사적 지명 표기
