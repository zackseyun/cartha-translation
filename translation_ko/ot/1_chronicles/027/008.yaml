  alternative_readings:
  - 세라 사람
  - 세라 사람(조화형)
  rationale: 열왕기/역대기 계열의 족칭 표기가 전승 간에 흔들리지만, 이 절의 히브리어 형태 자체를 우선 반영하는 것이 원문 추적성에 더 유리합니다.
  doctrine_reference: 본문비평/역사적 지명 표기
