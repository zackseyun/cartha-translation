    rationale: 이름에는 ח와 ד가 포함되며, ‘여히드야후’가 한국어 음역 관행 안에서 원어 이름의 형태를 더 잘 보존합니다.
  - severity: low
    issue: 각주가 본문 표현을 그대로 ‘또는’으로 제시합니다.
    rationale: 현 본문도 ‘암나귀들’이므로 대안 번역으로서 정보를 제공하지 못합니다. 어휘적 성별 특정성만 설명하는 주석으로 고칩니다.
