base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
  footnotes:
  - marker: a
    text: Or 'the she-donkeys.' The Hebrew term refers specifically to female donkeys.
    reason: lexical_alternative
translation:
  language: ko
  text: 낙타들을 맡은 이는 이스마엘 사람 오빌이었고, 암나귀들을 맡은 이는 메로놋 사람 여히드야후였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 암컷 나귀를 특별히 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַגְּמַלִּים
  english_pob_choice: Over the camels
  chosen_korean: 낙타들은 …의 관할이었고
  alternatives_korean:
  - 낙타들 위에는
  - 낙타들을 맡은 이는
  lexicon: HALOT
  rationale: 행정적 감독 관계를 한국어로 자연스럽게 드러내기 위해 ‘관할’로 풀었으며, 반복되는 רשימה 문맥의 관리 책임 뉘앙스를 살렸습니다.
- source_word: הָאֲתֹנוֹת
  english_pob_choice: the female donkeys
  chosen_korean: 암나귀들
  alternatives_korean:
  - 나귀들
  - 암당나귀들
  lexicon: HALOT
  rationale: 히브리어 אָתוֹן의 성별 표시를 보존하기 위해 ‘암나귀들’로 옮겼습니다.
- source_word: הַיִּשְׁמְעֵאלִי
  english_pob_choice: the Ishmaelite
  chosen_korean: 이스마엘 사람
  alternatives_korean:
  - 이스마엘 사람인
  - 이스마엘 족속
  lexicon: HALOT
  rationale: 족속/출신 표지를 한국어의 자연스러운 인칭 집단 표현으로 옮기되, ‘사람’으로 간단히 식별 기능을 유지했습니다.
- source_word: הַמֵּרֹנֹתִי
  english_pob_choice: the Meronothite
  chosen_korean: 메론 사람
  alternatives_korean:
  - 메로놋 사람
  - 메론옷 사람
  lexicon: HALOT
  rationale: 지명계 형용사를 한국어에서 이해 가능한 귀속 표현으로 처리해, 인명 표지 기능을 살리면서도 과도한 음차를 피했습니다.
theological_decisions:
- issue: 문장 구조를 행정적 ‘관할’로 옮길지, 단순한 위치 전치사 ‘위에’로 둘지
  chosen_reading: 관리 책임을 나타내는 관할 구문으로 옮겼습니다.
  alternative_readings:
  - 낙타들 위에는
  - 낙타들을 맡은 이는
  rationale: 이 절은 궁정 자산 관리 명단이므로, מקור의 עַל가 단순 공간 관계가 아니라 감독·책임을 뜻하는 점을 반영해야 합니다.
  doctrine_reference: 역사서의 행정 목록 해석 원칙
- issue: ‘여드야후’의 정체 표기를 이스라엘식 이름 음차로 유지할지
  chosen_reading: 여드야후라 하는
  alternative_readings:
  - 예드야후라 하는
  - 여드야라 하는
  rationale: 히브리어 איש명 יֶחְדְּיָהוּ의 종결부 יהו를 한국어 음차에서 보존하여 원어 식별성을 높였습니다.
  doctrine_reference: 고유명사 음역 원칙
