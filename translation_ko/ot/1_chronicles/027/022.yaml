lexical_decisions:
- source_word: לְ/דָן
  english_pob_choice: For Dan
  chosen_korean: 단 지파에는
  alternatives_korean:
  - 단을 위해
  - 단에게
  - 단에 대하여
  lexicon: HALOT
  rationale: 족보가 아니라 행정적 배치를 표시하는 표제이므로, ‘For Dan’의 기능을 살려 한국어에서는 ‘단 지파에는’으로 자연스럽게 옮겼습니다.
- source_word: עֲזַרְאֵל
  english_pob_choice: Azarel
  chosen_korean: 아자렐
  alternatives_korean:
  - 아사렐
  - 아자레엘
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관례에 따라 옮겼으며, 영어 POB의 표기와도 잘 맞는 ‘아자렐’을 택했습니다.
- source_word: שָׂרֵי
  english_pob_choice: leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 지도자
  - 우두머리들
  - 관리들
  - 방백들
  lexicon: HALOT
  rationale: 지파 행정 문맥에서 통치·대표 기능을 드러내면서도 현대 한국어에서 자연스러운 ‘지도자들’을 선택했습니다.
theological_decisions:
- issue: שָׂרֵי의 위계적 뉘앙스
  chosen_reading: ‘지도자들’로 옮겨, 통치권자의 행정적 대표성을 드러냈습니다.
  alternative_readings:
  - ‘방백들’로 옮김
  - ‘장관들’로 옮김
  rationale: 본문은 이스라엘 지파들의 책임자를 요약하는 명단이므로, 지나치게 왕정적이거나 관료적인 표현보다 문맥상 기능을 분명히 하는 번역이 적절합니다.
  doctrine_reference: 본문의 역사서 행정표현
