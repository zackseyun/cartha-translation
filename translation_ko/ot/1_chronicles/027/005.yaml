  text: שַׂ֣ר הַ/צָּבָ֤א הַ/שְּׁלִישִׁי֙ לַ/חֹ֣דֶשׁ הַ/שְּׁלִישִׁ֔י בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע הַ/כֹּהֵ֖ן רֹ֑אשׁ וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Or, 'Benaiah son of Jehoiada the priest, chief'; the Hebrew can be read more literally this way, but the sense is likely that Jehoiada was a leading priest.
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째 달의 셋째 달에 맡은 군대의 지휘관은 제사장 여호야다의 아들 브나야였으며, 그의 부대에는 이만사천 명이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  english_pob_choice: the commander
  chosen_korean: 군대의 지휘관
  alternatives_korean:
  - 군대의 사령관
  - 군대의 대장
  lexicon: HALOT
  rationale: שַׂר는 통치자·지휘관을 뜻하며, הַצָּבָא와 결합해 군사 지휘 직책을 가리키므로 ‘지휘관’이 가장 자연스럽고 본문의 기능을 잘 드러냅니다.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  english_pob_choice: of the third division for the third month
  chosen_korean: 셋째 달의 셋째 달에 맡은
  alternatives_korean:
  - 셋째 달을 위한 셋째 부대의
  - 셋째 달의 셋째 부대의
  lexicon: HALOT
  rationale: 히브리어는 월별 편제의 반복 구조를 압축해 말하므로, 문맥상 ‘부대’의 소속과 ‘셋째 달’의 배정을 함께 풀어 읽는 방식으로 옮겼습니다.
- source_word: הַכֹּהֵן רֹאשׁ
  english_pob_choice: the chief
  chosen_korean: 제사장
  alternatives_korean:
  - 수제사장
  - 우두머리 제사장
  lexicon: HALOT
  rationale: 여기서는 제사장 여호야다가 브나야의 아버지로 소개되며, 히브리어는 ‘제사장’과 ‘머리/우두머리’의 결합이지만 본문 흐름상 여호야다의 신분을 밝히는 역할이 핵심이므로, 의미를 과장하지 않고 ‘제사장’으로 옮겼습니다.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  english_pob_choice: and in his division were
  chosen_korean: 그의 부대에는
  alternatives_korean:
  - 그의 편제에는
  - 그의 분대에는
  lexicon: HALOT
  rationale: מַחֲלֻקָה는 이 장에서 군사 편제를 가리키므로, 인원수를 자연스럽게 이어 주는 한국어로 ‘부대’가 적절합니다.
theological_decisions:
- issue: הַכֹּהֵן רֹאשׁ의 처리
  chosen_reading: 여호야다를 ‘제사장’으로만 표시하고 별도의 직함 확장을 하지 않았습니다.
  alternative_readings:
  - 제사장-우두머리
  - 수제사장
  rationale: 히브리어의 어순상 직역하면 ‘제사장, 우두머리’의 여지가 있지만, 본문 문맥에서 과도한 직함 확정은 원문이 요구하는 범위를 넘을 수 있어 절제된 번역을 택했습니다.
  doctrine_reference: 본문의 직분 서술은 역사적 정보 전달에 해당하며 교리적 쟁점은 크지 않습니다.
