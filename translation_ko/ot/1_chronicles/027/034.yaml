translation:
  language: ko
  text: 아히도벨 다음에는 브나야의 아들 여호야다와 아비아달이 있었고[a], 요압은 왕의 군대 사령관이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아히도벨 다음에, 브나야의 아들 여호야다와 아비아달’입니다. 히브리어는 여기서 동사를 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  english_pob_choice: After ... came
  chosen_korean: 다음에는
  alternatives_korean:
