  rationale: שַׂר צָבָא는 군사 지휘 책임자를 가리키므로 ‘사령관’이 의미를 가장 분명하게 전달하며, לַמֶּלֶךְ는 왕에게 속한 직분이라는 관계를 압축해 반영했습니다.
