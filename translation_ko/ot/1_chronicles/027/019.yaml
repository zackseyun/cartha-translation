  - 스불론의
  lexicon: HALOT
  rationale: 여기서 ל는 열거된 지파 담당의 배정을 나타내므로, 행정적·대표적 의미를 살려 ‘~을 위하여’로 옮겼습니다.
- source_word: יִשְׁמַעְיָהוּ
  english_pob_choice: Ishmaiah
  chosen_korean: 이스마야
  alternatives_korean:
