  lexicon: 고유명사 표기
  rationale: 히브리어 אישׁמעיהו 이름을 현대 한국어 음역으로 옮기되, 지나친 음절 분절 없이 읽기 쉬운 형태를 택했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
