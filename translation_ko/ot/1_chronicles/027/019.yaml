  - ~의 아들인
  lexicon: HALOT
  rationale: 계보·식별 공식에서 בן은 직계 부자를 뜻하므로, 한국어에서는 간결하게 ‘아들’로 표현했습니다.
- source_word: עֹבַדְיָהוּ
  english_pob_choice: Obadiah
  chosen_korean: 오바댜
  alternatives_korean:
  - 오바디야
  - 오바댜후
  lexicon: 고유명사 표기
  rationale: 한국어 성경에서 널리 알려진 인명 형식을 우선해 가독성과 일관성을 확보했습니다.
- source_word: לְ/נַפְתָּלִי
  english_pob_choice: for Naphtali
  chosen_korean: 납달리를 위하여
  alternatives_korean:
  - 납달리에게
  - 납달리의
  lexicon: HALOT
  rationale: 첫 번째 절과 같은 방식으로, 지파에 배정된 담당이라는 뜻을 살려 번역했습니다.
- source_word: יְרִימוֹת
  english_pob_choice: Jerimoth
  chosen_korean: 여리못
  alternatives_korean:
  - 예리못
  - 제리못
  lexicon: 고유명사 표기
  rationale: 히브리어 이름 ירימות의 한국어 음역으로, 기존 성경식 독법을 존중하면서도 현대 표기를 유지했습니다.
- source_word: עַזְרִיאֵל
  english_pob_choice: Azriel
  chosen_korean: 아스리엘
  alternatives_korean:
  - 아즈리엘
  - 아즈리엘
  lexicon: 고유명사 표기
  rationale: 히브리어 자음군을 한국어 음역으로 자연스럽게 풀어 읽기 쉬운 형태를 택했습니다.
