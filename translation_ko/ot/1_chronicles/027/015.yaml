base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Or 'belonging to Othniel' or 'descended from Othniel.' The Hebrew construction likely indicates family or clan affiliation.
    reason: lexical_alternative
  - marker: b
    text: Some parallel traditions read the name as 'Heled' rather than 'Heldai.'
    reason: cross_reference
translation:
  language: ko
  text: 열두 번째, 곧 열두 번째 달을 맡은 이는 옷니엘 계열의[a] 네도바 사람 헬다이였으며, 그의 부대는 이만 사천 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘옷니엘의’입니다. 이 표현은 옷니엘과의 가문 또는 씨족상의 관계를 가리킬 수 있으나, 그 정확한 관계는 분명하지 않습니다.
    reason: lexical_alternative
