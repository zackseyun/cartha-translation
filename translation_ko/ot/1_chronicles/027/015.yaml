theological_decisions:
- issue: לְעָתְנִיאֵל의 관계 표기
  chosen_reading: 직접 소속 단정 대신 혈연·가문·소속의 여지를 남기는 표현으로 처리했습니다.
  alternative_readings:
  - 옷니엘의
  - 옷니엘에게서 난
  - 옷니엘의 후손
  rationale: 히브리어 ל는 여기서 단순 고용 관계보다 더 넓은 친족/가문 소속을 가리킬 수 있어, 본문의 애매성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 계보·부대 편제 표기의 해석 원칙
- issue: 전열 번호와 달 담당의 병렬 구조
  chosen_reading: 순번과 달 담당을 분리해 읽히도록 번역했습니다.
  alternative_readings:
  - 열두째 달에 열두째인 헬다이
  - 열두째 달의 열두째 병사
  rationale: 히브리어의 행정적 목록 구조를 한국어에서도 분명하게 드러내기 위해 병렬성을 유지했습니다.
  doctrine_reference: 본문 구조 보존 원칙
