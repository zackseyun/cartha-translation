  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Literally, 'and over his division, twenty-four thousand'—the Hebrew is elliptical, and English supplies 'were' to express the unit's size.
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 달의 첫째 반열은 자브디엘의 아들 야소브암이 맡았고, 그 반열에는 이만 사천 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 반열 위에 이만 사천 명’이라는 식으로 동사를 생략한 절입니다. 한국어에서는 인원수 진술을 위해 ‘있었습니다’를 보충했습니다.
    reason: source_note
