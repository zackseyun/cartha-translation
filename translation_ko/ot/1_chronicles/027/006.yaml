  chosen_korean: 삼십인
  alternatives_korean:
  - 서른 명
  - 삼십 명의 전사들
  - 삼십인 무리
  lexicon: HALOT
  rationale: 특정 숫자 집단을 가리키는 관용적 명칭이므로, ‘삼십인’으로 옮겨 고유 집단명처럼 읽히게 했습니다.
- source_word: וְעַל הַשְּׁלֹשִׁים
  english_pob_choice: and over the Thirty
  chosen_korean: 삼십인 위에
  alternatives_korean:
