base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
  footnotes:
  - marker: a
    text: Or 'He was Benaiah, a mighty warrior among the Thirty and over the Thirty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람은 베나야였습니다.[a] 그는 **삼십인**에 속한 **용사**였고, **삼십인**을 거느렸습니다. 그의 **부대**는 그의 아들 암미사밧의 지휘 아래 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 베나야였습니다. 그는 삼십인 가운데 있는 용사이며 삼십인 위에 있었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  english_pob_choice: a mighty man
  chosen_korean: 용사
  alternatives_korean:
  - 강한 사람
  - 무사
  - 용맹한 사람
  lexicon: HALOT
  rationale: 역사적·군사적 맥락에서 גִּבּוֹר는 단순한 ‘힘센 사람’보다 전투적 능력을 지닌 인물을 가리키므로, 한국어에서는 자연스럽고도 의미를 보존하는 ‘용사’로 옮겼습니다.
- source_word: הַשְּׁלֹשִׁים
  english_pob_choice: the Thirty
  chosen_korean: 삼십인
  alternatives_korean:
  - 서른 명
  - 삼십 명의 전사들
  - 삼십인 무리
  lexicon: HALOT
  rationale: 특정 숫자 집단을 가리키는 관용적 명칭이므로, ‘삼십인’으로 옮겨 고유 집단명처럼 읽히게 했습니다.
- source_word: וְעַל הַשְּׁלֹשִׁים
  english_pob_choice: and over the Thirty
  chosen_korean: 삼십인 위에
  alternatives_korean:
  - 삼십인의 지휘관으로
  - 삼십인 위에 있는
  - 삼십인을 거느리고
  lexicon: HALOT
  rationale: עַל은 여기서 단순한 공간적 ‘위’가 아니라 집단 위에 있는 권위·감독을 나타내므로, 직설적으로 ‘위에’라고 하여 위계 관계를 보존했습니다.
- source_word: מַחֲלֻקְתּוֹ
  english_pob_choice: his division
  chosen_korean: 분대
  alternatives_korean:
  - 부대
  - 그의 차례
  - 그의 부서
  lexicon: HALOT
  rationale: 역대기 27장의 문맥상 교대 편성된 군사 단위를 뜻하므로, 현대 한국어에서 그 기능을 가장 분명하게 드러내는 ‘분대’를 택했습니다.
theological_decisions:
- issue: 베나야의 위상과 두 표현의 병치
  chosen_reading: ‘삼십인 가운데서도 용사’와 ‘삼십인 위에’라는 두 표현을 모두 살려, 베나야가 엘리트 전사 집단의 일원이면서 동시에 그 위에 있는 인물임을 드러냈습니다.
  alternative_readings:
  - ‘삼십인의 우두머리’로 단순화
  - ‘삼십인 가운데 뛰어난 용사’로 위계 삭제
  rationale: 히브리어는 소속과 우위를 함께 말하므로, 어느 한쪽을 지우지 않고 병렬로 보존하는 것이 본문의 긴장을 가장 잘 반영합니다.
  doctrine_reference: 본문의 역사 서술 보존
