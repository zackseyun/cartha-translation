translation:
  language: ko
  text: 이 사람은 베나야였습니다. 그는 **삼십인** 가운데서도 **용사**였고, **삼십인 위에** 있었습니다. 그의 **분대**는 그의 아들 암미사밧 아래에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 베나야였습니다. 그는 삼십인 가운데 있는 용사이며 삼십인 위에 있었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: גִּבּוֹר
  english_pob_choice: a mighty man
  chosen_korean: 용사
  alternatives_korean:
  - 강한 사람
  - 무사
  - 용맹한 사람
  lexicon: HALOT
  rationale: 역사적·군사적 맥락에서 גִּבּוֹר는 단순한 ‘힘센 사람’보다 전투적 능력을 지닌 인물을 가리키므로, 한국어에서는 자연스럽고도 의미를 보존하는 ‘용사’로 옮겼습니다.
- source_word: הַשְּׁלֹשִׁים
