  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
  footnotes:
  - marker: a
    text: Hebrew literally, 'that which was in the vineyards'; this likely refers to the vineyards' produce rather than the vineyards themselves.
    reason: lexical_alternative
  - marker: b
    text: Or 'storehouses of wine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 포도원들을 맡은 사람은 라맛 사람 시므이였고, 포도주 저장고들에 둘 포도원 소출을 맡은 사람은 시프미 사람 삽디였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘포도원들 안에 있는 것’이라고 합니다. 문맥상 포도원 자체가 아니라 그 소출을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֹצְרוֹת는 ‘저장고들’ 또는 ‘창고들’로도 옮길 수 있습니다.
    reason: lexical_alternative
