  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
  footnotes:
  - marker: a
    text: Hebrew literally, 'that which was in the vineyards'; this likely refers to the vineyards' produce rather than the vineyards themselves.
    reason: lexical_alternative
  - marker: b
    text: Or 'storehouses of wine.'
    reason: lexical_alternative
translation:
  language: ko
  text: 포도원들 위에는 라마 사람 시므이가 있었고, 포도원들의 소출을 위한 포도주 저장고들 위에는 시브마 사람 잡디가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '포도원들 안에 있던 것'이지만, 문맥상 포도원 자체보다 그 소출을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֹצְרוֹת는 여기서 포도주를 보관하는 저장 시설, 곧 '포도주 창고/저장고'의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
