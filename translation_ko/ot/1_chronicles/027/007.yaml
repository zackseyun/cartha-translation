  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'and Zebadiah his son succeeded him.' The Hebrew says literally 'after him,' indicating succession.
    reason: lexical_alternative
translation:
  language: ko
  text: 넷째 달을 맡은 이는 요압의 형제 아사헬이었고, 그의 아들 스바댜가 그 뒤를 이었으며, 그의 분반에는 이만 사천 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 뒤에’를 뜻하지만, 이 문맥에서는 승계를 가리킵니다.
    reason: alternative_reading
