  rationale: 이 장의 편제 문맥에서는 군사적/조직적 ‘분할된 단위’를 뜻하므로, ‘분반’으로 옮겨 구조적 의미를 살렸습니다.
theological_decisions:
- issue: 'אַחֲרָיו의 해석: 단순한 시간적 ‘뒤에’인가, 승계인가'
  chosen_reading: 본문에서는 직역의 흔적을 살리되, 한국어 본문은 ‘그 뒤를 이었다’로 승계 의미를 분명히 했습니다.
  alternative_readings:
  - 그 뒤에 있었습니다
  - 그 뒤에 있었습니다(직역)
  rationale: 영문 POB 주석도 이 표현이 승계를 뜻한다고 밝혀 주므로, 독자가 관직/배치의 흐름을 오해하지 않도록 승계 의미를 본문에 반영했습니다.
  doctrine_reference: 본문 해석상의 문맥 결정
