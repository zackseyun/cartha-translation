  text: 열한째 달을 맡은 사람은 에브라임 자손 가운데 브라돈 사람인 브나야였고, 그의 부대는 이만 사천 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  english_pob_choice: For the twelfth month
  chosen_korean: 열두째 달에는
