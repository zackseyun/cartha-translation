  rationale: 문맥상 군사 편제를 가리키므로 ‘부서’를 택했고, 전치사적 ‘על’을 담당/관할의 뜻으로 자연스럽게 옮겼습니다.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  english_pob_choice: twenty-four thousand
  chosen_korean: 이만 사천 명
  alternatives_korean:
  - 스물네 천 명
  - 24,000명
  lexicon: HALOT
  rationale: 히브리어 수량을 한국어 관용 수사로 옮겼습니다.
