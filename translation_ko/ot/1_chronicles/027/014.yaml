  lexicon: HALOT
  rationale: 히브리어의 관용적 월차 표지를 한국어 자연문으로 옮기되, 해당 달의 담당 배치를 분명히 드러내기 위해 조사 ‘에는’을 붙였습니다.
- source_word: בְּנָיָה
