  text: 열두째 달에는 베냐야 곧 브라손 사람으로서 에브라임 자손 가운데 한 사람이 그의 부서를 맡았으며, 그의 부대는 이만 사천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
