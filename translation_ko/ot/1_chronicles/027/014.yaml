  - 피라톤 사람
  lexicon: HALOT
  rationale: 지명형 형용사를 한국어에서는 ‘~사람’으로 옮겨 출신지를 자연스럽게 나타냈습니다.
- source_word: מִן בְּנֵי אֶפְרָיִם
  english_pob_choice: from the sons of Ephraim
  chosen_korean: 에브라임 자손 가운데 한 사람
  alternatives_korean:
