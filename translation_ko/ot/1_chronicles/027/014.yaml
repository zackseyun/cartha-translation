  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Or 'from Ephraim.' The Hebrew more literally reads 'from the sons of Ephraim,' indicating tribal descent.
    reason: lexical_alternative
translation:
