  rationale: 인명은 현대 한국어 음역 관행에 따라 표기했습니다.
- source_word: הַפִּרְעָתוֹנִי
  english_pob_choice: the Pirathonite
  chosen_korean: 브라손 사람
  alternatives_korean:
