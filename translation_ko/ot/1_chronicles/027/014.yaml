  lexicon: HALOT
  rationale: ‘sons of Ephraim’을 직역하되, 단순한 혈통보다 지파적 소속을 드러내는 표현으로 살렸습니다.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  english_pob_choice: and over his division were
  chosen_korean: 그의 부서를 맡았으며
