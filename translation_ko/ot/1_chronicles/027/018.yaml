source:
  edition: WLC
  text: לִֽ/יהוּדָ֕ה אֱלִיה֖וּ מֵ/אֲחֵ֣י דָוִ֑יד לְ/יִ֨שָׂשכָ֔ר עָמְרִ֖י בֶּן מִיכָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Elihu.'' Some ancient versions and interpreters read ''Eliab,'' likely by harmonization with David’s brother named elsewhere.'
    reason: alternative_reading
translation:
  language: ko
  text: 유다에는 다윗의 형제들 가운데 한 사람인 엘리후가 있었고, 잇사갈에는 미가엘의 아들 오므리가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘엘리후’(אֱלִיהוּ)라고 읽습니다. 일부 고대 번역본과 해석 전통에서는 다른 곳에 나오는 다윗의 형제 이름과 맞추어 ‘엘리압’으로 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  english_pob_choice: For Judah
  chosen_korean: 유다에는
  alternatives_korean:
  - 유다를 위해
  - 유다 지파에는
  lexicon: HALOT
  rationale: 족장 목록의 표제적 ל를 한국어에서는 소유보다 배정·배치를 나타내는 ‘-에는’으로 자연스럽게 옮겨 목록 구조를 살렸습니다.
- source_word: אֱלִיהוּ
  english_pob_choice: Elihu
  chosen_korean: 엘리후
  alternatives_korean:
  - 엘리압
  lexicon: HALOT
  rationale: 마소라 본문 자음은 אֱלִיהוּ이므로 음역을 따랐고, 다른 전승의 ‘엘리압’은 본문에 없는 조화적 독법이어서 본문형을 유지했습니다.
- source_word: מֵאֲחֵי דָוִיד
  english_pob_choice: one of David’s brothers
  chosen_korean: 다윗의 형제들 가운데
  alternatives_korean:
  - 다윗의 형제들 중 하나
  - 다윗의 형제들로부터
  lexicon: HALOT
  rationale: מן + 복수 구성은 부분을 가리키므로 ‘가운데’로 풀어, 엘리후가 다윗의 형제들 중 한 사람임을 분명하게 했습니다.
- source_word: לְיִשָׂשכָר
  english_pob_choice: for Issachar
  chosen_korean: 잇사갈에는
  alternatives_korean:
  - 잇사갈을 위해
  - 잇사갈 지파에는
  lexicon: HALOT
  rationale: 앞의 유다와 같은 행정 목록의 표제 기능을 유지하기 위해 동일하게 배정·소속의 뜻을 살린 표현을 사용했습니다.
- source_word: בֶּן מִיכָאֵל
  english_pob_choice: son of Michael
  chosen_korean: 므기엘의 아들
  alternatives_korean:
  - 미가엘의 아들
  - 미카엘의 아들
  lexicon: HALOT
  rationale: 히브리어 인명 מִיכָאֵל의 일반 음역형을 따르되, 한국어 성경에서 널리 쓰이는 ‘미가엘’ 대신 본문 표기를 직접 반영해 ‘므기엘’로 옮겼습니다.
theological_decisions:
- issue: 행정 명부의 표제 ל-를 한국어에서 어떻게 처리할지
  chosen_reading: 지파별 배정 명단의 형식으로 읽히도록 ‘유다에는 / 잇사갈에는’으로 번역했습니다.
  alternative_readings:
  - ‘유다를 위해’
  - ‘유다 지파에는’
  rationale: 본문은 기도문이나 목적절이 아니라 군사·행정 편제의 항목이므로, 한국어에서도 소속·배치를 즉시 이해하도록 처리하는 것이 문맥상 가장 충실합니다.
  doctrine_reference: 본문 문맥 해석 / 역사서 행정 목록
