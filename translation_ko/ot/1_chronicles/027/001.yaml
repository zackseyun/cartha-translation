revisions:
- from: 이스라엘 자손은 그 수에 따라—곧 조상의 집안의 우두머리들과 천부장들과 백부장들과, 왕을 섬기며 매달 들어오고 나가는 부서들의 모든 일에 일하는 그들의 관리들이었습니다. 각 부서는 모두 이만사천 명이었습니다.
  to: 이스라엘 자손의 수에 따른 편성은 다음과 같습니다. 조상의 집안 우두머리들과 천부장들과 백부장들과 그들의 관리들은 왕을 섬기며, 해의 모든 달에 한 달씩 들어오고 나가는 부대들의 모든 일을 맡았습니다. 각 부대는 이만 사천 명이었습니다.
  rationale: 원문의 명사열을 한국어에서 독립된 편성 소개로 처리하여, 이스라엘 자손 자체가 관리들이었다는 오해를 없앴습니다. 왕을 섬기는 이들의 월별 교대 부대 관련 업무라는 원문의 행정·군사적 흐름, 그리고 각 부대 24,000명이라는 수량을 보존했습니다. 본문에 별도의 주석 표지가 없으므로 새 주석은 추가하지 않았습니다.
