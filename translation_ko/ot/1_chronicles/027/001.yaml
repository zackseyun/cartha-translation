id: 1CH.27.1
reference: 1 Chronicles 27:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: Now the sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
  footnotes:
  - marker: a
    text: Or 'The Israelites,' a more idiomatic collective rendering of 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'heads of fathers’ houses,' a clan-based administrative term.
    reason: cultural_note
  - marker: c
    text: That is, the divisions rotated into and out of royal service month by month.
    reason: cross_reference
translation:
  language: ko
  text: 이스라엘 자손은 그 수에 따라—곧 조상의 집안의 우두머리들과 천부장들과 백부장들과, 왕을 섬기며 매달 들어오고 나가는 부서들의 모든 일에 일하는 그들의 관리들이었습니다. 각 부서는 모두 이만사천 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: Now the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘인들
  lexicon: HALOT
  rationale: 직역적 대응을 유지하되, 한국어에서는 서술문 첫머리의 'Now'를 따로 드러내기보다 문맥상 자연스럽게 생략할 수 있어 집합명사로 옮겼습니다.
- source_word: לְמִסְפָּרָם
  english_pob_choice: according to their number
  chosen_korean: 그 수에 따라
  alternatives_korean:
  - 그들의 수에 따라
  - 수에 따라
  lexicon: HALOT
  rationale: 편성의 기준이 되는 '수'라는 행정적 의미를 살리면서 한국어에서 가장 간결하고 자연스럽게 표현했습니다.
- source_word: רָאשֵׁי הָאָבוֹת
  english_pob_choice: the heads of fathers’ houses
  chosen_korean: 조상의 집안의 우두머리들
  alternatives_korean:
  - 아버지들의 집의 우두머리들
  - 가문 우두머리들
  - 족장들
  lexicon: HALOT
  rationale: 히브리어의 친족-행정 용어를 보존하기 위해 '집안'을 넣었고, 관용적이지만 구조를 약화시키는 '족장들'은 피했습니다.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  english_pob_choice: the commanders of thousands and of hundreds
  chosen_korean: 천부장들과 백부장들
  alternatives_korean:
  - 천 명의 지휘관들과 백 명의 지휘관들
  - 천인장들과 백인장들
  lexicon: HALOT
  rationale: 군사·행정적 직함으로서 한국어 성경에서 널리 이해되는 대응을 택해 기능을 분명히 했습니다.
- source_word: וְשֹׁטְרֵיהֶם
  english_pob_choice: their officers
  chosen_korean: 그들의 관리들
  alternatives_korean:
  - 그들의 장관들
  - 그들의 서기관들
  - 그들의 감독관들
  lexicon: HALOT
  rationale: שֹׁטְרִים은 이 문맥에서 군사 지휘라기보다 행정 집행을 맡는 관리층을 가리키므로, 뜻을 과장하지 않는 '관리들'로 옮겼습니다.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  english_pob_choice: who served the king
  chosen_korean: 왕을 섬기며
  alternatives_korean:
  - 왕을 섬기고 있는
  - 왕을 시중들며
  - 왕을 봉사하며
  lexicon: HALOT
  rationale: ongoing participle의 지속성을 살리면서도 한국어 문장 안에서 자연스럽게 연결되도록 현재분사형으로 처리했습니다.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  english_pob_choice: in every matter of the divisions
  chosen_korean: 부서들의 모든 일에
  alternatives_korean:
  - 분대들의 모든 일에
  - 부대들의 모든 일에서
  - 분담된 모든 일에
  lexicon: HALOT
  rationale: דָּבָר의 '일/사무' 의미와 מַחְלְקוֹת의 조직적 분할을 함께 담기 위해, 문맥상 '부서'와 '일'을 결합했습니다.
theological_decisions:
- issue: 문두의 וּבְנֵי יִשְׂרָאֵל 처리
  chosen_reading: 서술적 연결어 'Now'를 따로 두지 않고 곧바로 '이스라엘 자손은'으로 시작했습니다.
  alternative_readings:
  - '''그리고 이스라엘 자손은'''
  - '''이제 이스라엘 자손은'''
  rationale: 히브리어 ו는 여기서 단순한 접속보다 문단 전환 표지에 가깝지만, 한국어에서는 두드러진 '이제/그리고'를 넣지 않아도 의미가 살아납니다. 장르의 행정적 서술을 간결하게 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 서술 접속의 문체적 처리
- issue: הַבָּאָה וְהַיֹּצֵאת의 순환 의미
  chosen_reading: 매달 들어오고 나가는 부서들로 옮겨, 왕실 근무의 교대 순환을 분명히 했습니다.
  alternative_readings:
  - '''들어오고 나가는'''
  - '''출입하는'''
  - '''교대로 들어오고 나가는'''
  rationale: 이 표현은 단순 이동이 아니라 정기 교대 근무를 뜻합니다. 한국어에서도 행정적 순환이라는 기능이 분명해야 하므로 '매달'과 함께 풀어 옮겼습니다.
  doctrine_reference: 성전/왕실 조직의 순번 서술
