translation:
  language: ko
  text: 이스라엘의 지파들을 맡은 이들은 다음과 같습니다. 르우벤 사람들의 지도자[a]는 지그리의 아들 엘리에셀이었고, 시므온 사람들의 지도자는 마아가의 아들 스바댜였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָגִיד는 ‘지도자’ 외에도 ‘우두머리’, ‘통치자’, ‘왕자’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
