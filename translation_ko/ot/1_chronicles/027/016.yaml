  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
  footnotes:
  - marker: a
    text: Or 'chief,' 'prince,' or 'ruler' for Hebrew נָגִיד.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘의 지파들에 대한 일은 이러합니다. 르우벤 사람들에게는 아들들 엘리에셀의 아들 지그리의 아들 엘리에셀이 지도자였고, 시므온 사람들에게는 마아가의 아들 스바댜가 지도자였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָגִיד는 ‘지도자’ 외에도 ‘우두머리’, ‘통치자’, ‘왕자’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: And over
  chosen_korean: 그리고 …에 대한 일은
  alternatives_korean:
  - 그리고 … 위에는
  - 그리고 …에 대하여
  lexicon: BDB
  rationale: 행정 목록의 새 항목을 여는 연결어이므로, 단순한 접속과 주제 전환을 함께 살리는 표현을 택했습니다.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: the tribes of Israel
  chosen_korean: 이스라엘의 지파들
  alternatives_korean:
