  lexicon: HALOT
  rationale: 지파들의 목록이라는 점을 자연스럽게 드러내면서도 집합적 의미를 유지했습니다.
- source_word: נָגִיד
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
