  lexicon: HALOT
  rationale: 이름은 음역했고, ‘아들’ 구문은 한국어에서 중복되기 쉬워 본문 흐름상 자연스럽게 정리했습니다; 다만 원문의 친족 표지는 명시적으로 남겨 두어야 하므로 본문에는 patronymic을 유지했습니다.
theological_decisions:
- issue: נָגִיד의 권위 범주
  chosen_reading: 공적 직책을 가리키는 행정적 지도자로 이해했습니다.
  alternative_readings:
  - 왕실적 ‘군주’ 뉘앙스
  - 부족 전체를 대표하는 ‘우두머리’ 뉘앙스
  rationale: 열왕적 칭호로 과도하게 제한하면 문맥의 행정 목록 성격이 흐려지므로, 중립적이면서도 권위를 담는 ‘지도자’로 번역했습니다.
  doctrine_reference: 본문 맥락 우선의 어휘 선택
- issue: 민족명 접미사의 집단성
  chosen_reading: ‘르우벤 사람들/시므온 사람들’로 번역해 지파 집단을 분명히 했습니다.
  alternative_readings:
  - 개인 이름처럼 ‘르우벤/시므온’만 제시
  - ‘르우벤 지파/시므온 지파’의 직역
  rationale: 본문은 개인이 아니라 지파 단위의 책임 분배를 말하므로, 독자가 오해하지 않도록 집단성을 명확히 드러냈습니다.
  doctrine_reference: 이스라엘 지파 구조의 서술 정확성
