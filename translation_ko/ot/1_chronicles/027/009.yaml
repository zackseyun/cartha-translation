  lexicon: HALOT
  rationale: מַחֲלֻקָה는 이 장의 행정적·군사적 편성 단위를 가리키므로, 한국어에서는 군사적 기능이 드러나는 ‘부대’로 옮겼습니다.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  english_pob_choice: twenty-four thousand
  chosen_korean: 이만 사천 명
  alternatives_korean:
