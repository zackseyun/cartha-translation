  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: ko
  text: 여섯째는 여섯째 달을 맡은 이라, 즉 이께스의 아들, 드고아 사람입니다. 그의 부대에는 이만 사천 명이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  english_pob_choice: The sixth
  chosen_korean: 여섯째는
  alternatives_korean:
  - 여섯째
  - 여섯 번째는
  lexicon: HALOT
  rationale: 열거형 직책 표지의 축약 표현으로 보아, 한국어도 주어를 보충하지 않고 순번을 앞세운 간결한 표현을 택했습니다.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  english_pob_choice: for the sixth month
  chosen_korean: 여섯째 달을 맡은
  alternatives_korean:
  - 여섯째 달의
  - 여섯째 달에 배정된
  lexicon: HALOT
  rationale: ל + חודש는 이 문맥에서 배정된 복무 시기를 가리키므로, 단순한 소속보다 ‘맡은’으로 일정 배치를 드러냈습니다.
- source_word: הַתְּקוֹעִי
  english_pob_choice: the Tekoite
  chosen_korean: 드고아 사람
  alternatives_korean:
  - 드고아 출신
  - 드고아 사람인
  lexicon: HALOT
  rationale: 지명에서 온 관형형은 한국어에서 자연스럽게 출신 표지인 ‘드고아 사람’으로 옮겼습니다.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  english_pob_choice: and over his division were
  chosen_korean: 그의 부대에는
  alternatives_korean:
  - 그의 분대 위에는
  - 그의 부대 위에는
  lexicon: HALOT
  rationale: מַחֲלֻקָה는 이 장의 행정적·군사적 편성 단위를 가리키므로, 한국어에서는 군사적 기능이 드러나는 ‘부대’로 옮겼습니다.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  english_pob_choice: twenty-four thousand
  chosen_korean: 이만 사천 명
  alternatives_korean:
  - 스물네 천 명
  - 이십사 천 명
  lexicon: HALOT
  rationale: 한국어 수사 관용에 맞게 현대적 표기로 정리하되, 인원 단위를 명시해 군사 집계임을 분명히 했습니다.
theological_decisions:
- issue: 본문의 행정적 열거 형식
  chosen_reading: 인명과 복무 월, 그리고 부대 규모를 담은 군사 행정 기록으로 읽어 자연스러운 한국어에 반영했습니다.
  alternative_readings:
  - 단순한 명단식 열거
  - 왕실 조직의 일반 명부
  rationale: 이 절은 신학적 확장보다 조직 편성의 기록성이 핵심이므로, 의미를 덧붙이지 않고 행정적 리듬을 유지했습니다.
  doctrine_reference: 역대상 27장의 군사 조직 편성 문맥
