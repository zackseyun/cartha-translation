  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִֽ/יהוֹנָתָ֤ן דּוֹד דָּוִיד֙ יוֹעֵ֔ץ אִישׁ מֵבִ֥ין וְ/סוֹפֵ֖ר ה֑וּא וִֽ/יחִיאֵ֥ל בֶּן חַכְמוֹנִ֖י עִם בְּנֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
  footnotes:
  - marker: a
    text: Or 'the royal princes.' The Hebrew reads 'the king’s sons.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says literally 'was with the king’s sons'; some understand this to imply service or supervision among them.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나단[a]은 다윗의 숙부로서 조언자요, 통찰력 있는 사람이며 서기관[b]이었습니다. 그리고 하크모니 사람 여이엘은 왕의 아들들과 함께 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 왕자들’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘왕의 아들들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘왕의 아들들과 함께 있었다’라고 말합니다. 어떤 해석은 이것을 그들 곁에서의 봉사나 감독을 암시하는 표현으로 봅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  english_pob_choice: uncle
  chosen_korean: 숙부
  alternatives_korean:
  - 삼촌
  - 외삼촌
  - 아저씨
  lexicon: HALOT
  rationale: 문맥상 다윗과의 친족 관계를 가리키므로 일반적인 친족 호칭으로 옮겼습니다. 한국어에서는 중립적이고 비교적 정확한 친족어인 ‘숙부’를 택해 가족 관계를 분명히 했습니다.
- source_word: יוֹעֵץ
  english_pob_choice: counselor
  chosen_korean: 조언자
  alternatives_korean:
  - 상담자
  - 고문
  - 자문관
  lexicon: HALOT
  rationale: 궁정에서 공식적으로 조언하는 직무를 나타내므로, 현대 한국어에서 직함 느낌을 살리면서도 과도하게 관료화하지 않는 ‘조언자’를 사용했습니다.
- source_word: אִישׁ מֵבִין
  english_pob_choice: a man of understanding
  chosen_korean: 통찰력 있는 사람
  alternatives_korean:
  - 이해심 있는 사람
  - 분별력 있는 사람
  - 깨달음이 있는 사람
  lexicon: HALOT
  rationale: 직역형 표현보다 문맥상 요나단의 분별과 이해 능력을 자연스럽게 드러내는 표현을 택했습니다. 성별 표지는 한국어에서 본문 의미를 좌우하지 않으므로 일반명사로 옮겼습니다.
- source_word: סוֹפֵר
  english_pob_choice: scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 문서 담당관
  - 서기
  lexicon: HALOT
  rationale: 궁정 행정 맥락에서 문자와 기록을 담당하는 관직을 가리키므로, 전통적이지만 의미가 넓은 ‘서기관’을 선택했습니다. 한국어 성경에서 익숙하면서도 단순한 필사자보다 넓은 행정 기능을 담습니다.
- source_word: בְּנֵי הַמֶּלֶךְ
  english_pob_choice: the king’s sons
  chosen_korean: 왕의 아들들
  alternatives_korean:
  - 왕자들
  - 왕의 자녀들
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘아들들’이라고 말하므로 성별을 보존해 옮겼습니다. ‘왕자들’은 문맥상 가능하지만 원문보다 해석이 앞서므로 본문에는 두지 않았습니다.
theological_decisions:
- issue: 요나단의 직책들을 현대 한국어로 옮길 때 직함을 과도하게 제도화할지 여부
  chosen_reading: 궁정 문맥을 유지하되 ‘조언자, 통찰력 있는 사람, 서기관’으로 비교적 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 자문관, 현명한 인물, 비서관
  - 고문, 분별력 있는 사람, 문서관
  rationale: 본문은 왕실 행정에서의 역할을 나열하지만, 구체적 관직명을 단정하기보다 원문의 서술적 범위를 보존하는 편이 안전합니다.
  doctrine_reference: 원문 충실성과 역사서 서술의 맥락 보존
