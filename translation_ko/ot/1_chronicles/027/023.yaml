source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
  footnotes:
  - marker: a
    text: Or, 'did not take their number.' The Hebrew idiom is literally 'did not lift up their number,' meaning 'did not count them' or 'did not take a census of them.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'like the stars of heaven.' This echoes the LORD's promise to make Israel exceedingly numerous.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 다윗은 스무 살 이하인 사람들의 수를 세지 않았습니다.[a] 이는 야훼께서 이스라엘을 하늘의 별들처럼 많게 하시겠다고 말씀하셨기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 수를 세지 않았다’. 히브리어 관용구는 문자적으로 ‘그들의 수를 들어 올리지 않았다’는 뜻이며, 그들을 계수하거나 인구조사에 포함하지 않았다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘의 별들처럼’. 이는 이스라엘을 매우 많게 하시겠다는 야훼의 약속을 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא נָשָׂא ... מִסְפָּרָם
  english_pob_choice: did not count them
  chosen_korean: 그 수를 … 세지 않았습니다
  alternatives_korean:
  - 그들을 계수하지 않았습니다
  - 그들의 수를 들지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘수’를 들어 올리다/세다의 뜻으로, 인구조사를 하지 않았다는 의미입니다. 한국어에서는 자연스럽게 ‘그 수를 세다’로 옮기는 것이 가장 직접적입니다.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  english_pob_choice: from twenty years old and under
  chosen_korean: 스무 살 이하로
  alternatives_korean:
  - 스무 살부터 아래로
  - 스무 살과 그 아래로
  - 스무 살 이하의 연령은
  lexicon: HALOT
  rationale: 인구조사 대상의 하한선을 나타내는 연령 표현이므로, 현대 한국어에서는 ‘스무 살 이하’가 가장 자연스럽고 정확합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Standard transliteration policy
  rationale: 원문의 고유 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 번역어 ‘주’와 구별되는 고유명성을 보존했습니다.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  english_pob_choice: like the stars of the heavens
  chosen_korean: 하늘의 별들처럼
  alternatives_korean:
  - 하늘들의 별들처럼
  - 하늘의 별들같이
  - 하늘의 별처럼
  lexicon: HALOT
  rationale: ‘하늘들’의 복수감을 완전히 풀어 쓰기보다, 한국어에서 익숙한 ‘하늘의 별들처럼’이 비유의 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 야훼의 언약적 약속을 근거로 한 다윗의 인구 조사 제외
  chosen_reading: 다윗이 스무 살 이하를 세지 않은 이유를, 야훼의 ‘이스라엘을 심히 번성하게 하겠다’는 말씀에 대한 근거로 제시했습니다.
  alternative_readings:
  - 단순한 행정상 제외
  - 후대 편집자의 설명
  rationale: 본문의 כי는 단순 배경이 아니라 다윗의 행동 이유를 직접 제시합니다. 따라서 약속의 성격을 약화시키지 않고 원문의 인과관계를 드러내는 번역이 필요합니다.
  doctrine_reference: 언약적 복수 약속(창 15:5; 22:17; 출 1:7의 배경과 연결)
