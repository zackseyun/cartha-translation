source:
  edition: WLC
  text: וְ/עַ֞ל מַחֲלֹ֣קֶת הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֗י דּוֹדַ֤י הָ/אֲחוֹחִי֙ וּ/מַ֣חֲלֻקְתּ֔/וֹ וּ/מִקְל֖וֹת הַ/נָּגִ֑יד וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
  footnotes:
  - marker: a
    text: Or, 'and his division, and Mikloth the leader'; the Hebrew sequence is compressed, and interpreters differ on whether Mikloth is named as second-in-command within Dodai's division or as the one set over it.
    reason: alternative_reading
translation:
  language: ko
  text: 둘째 달의 반차를 맡은 이는 아호아 사람 도대였고, 믹롯은 그의 반차를 지휘하는 사람이었습니다. 그의 반차에는 이만 사천 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 반차와 지휘관 믹롯’으로 옮길 수 있습니다. 히브리어 어순이 압축되어 있어, 믹롯을 도대의 반차에 딸린 지휘관으로 볼지 그 반차를 맡은 지휘관으로 볼지에 대해 해석이 갈립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת / מַחֲלֻקְתּוֹ
  english_pob_choice: division / his division
  chosen_korean: 반차 / 그의 반차
  alternatives_korean:
  - 편성
  - 부대
  - 조
  lexicon: HALOT
  rationale: 1역대기 27장의 군사-행정적 순번 편제를 가리키므로, 한국어에서는 전통적으로 통용되면서도 조직 단위를 드러내는 ‘반차’가 원문의 기능을 잘 살립니다.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  english_pob_choice: the second month
  chosen_korean: 둘째 달
  alternatives_korean:
  - 두 번째 달
  - 둘째 달에
  lexicon: HALOT
  rationale: 월 순서를 나타내는 직설적 표현이므로 간결한 ‘둘째 달’로 옮겼습니다.
- source_word: הָאֲחוֹחִי
  english_pob_choice: the Ahohite
  chosen_korean: 아호아 사람
  alternatives_korean:
  - 아호하시 사람
  - 아호핫 사람
  lexicon: HALOT
  rationale: 족속/출신 표시로 보이는 형용사를 현대 독자가 알아보기 쉬운 지명·출신형 표현으로 처리했습니다. 영어 POB의 ‘the Ahohite’에 대응하되, 한국어에서는 자연스러운 고유명사식 표현을 택했습니다.
- source_word: הַנָּגִיד
  english_pob_choice: the leader
  chosen_korean: 감독하였고
  alternatives_korean:
  - 지도하였고
  - 대장으로 있었고
  - 리더였습니다
  lexicon: HALOT
  rationale: 문맥상 믹롯이 그 반차 위에 있는 감독자/책임자라는 관계를 나타내므로, 명사구를 동사구로 풀어 ‘감독하였고’로 옮겨 위계 관계를 분명히 했습니다.
theological_decisions:
- issue: וְעַל־מַחֲלֻקְתּוֹ의 관계 표현
  chosen_reading: ‘그의 반차를 감독하였고’로 처리하여 믹롯의 감독 직분을 분명히 했습니다.
  alternative_readings:
  - ‘그리고 그의 반차 위에 있는 믹롯은’
  - ‘그리고 그의 반차를 맡은 믹롯은’
  rationale: 히브리어는 압축되어 있어 믹롯이 반차의 책임자인지, 반차에 속한 인물인지가 해석상 갈립니다. 영어 POB의 주석처럼 문장 구조의 압축을 드러내되, 본문에서는 가장 자연스러운 책임자 읽기를 택했습니다.
  doctrine_reference: 본문 해석상의 구조 문제로, 교리 사안은 아닙니다.
