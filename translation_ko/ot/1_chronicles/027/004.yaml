revisions:
- from: 둘째 달의 반차는 도대야 아호아 사람이며, 믹롯은 그의 반차를 감독하였고, 그의 반차에는 이만사천 명이 있었습니다.[a]
  to: 둘째 달의 반차를 맡은 이는 아호아 사람 도대였고, 믹롯은 그의 반차를 지휘하는 사람이었습니다. 그의 반차에는 이만 사천 명이 있었습니다.[a]
  rationale: 인명은 원문의 형태에 맞춰 ‘도대’로 바로잡았습니다. 본문은 영어 POB와 같이 믹롯이 도대의 반차를 지휘한다는 자연스러운 해석을 따르되, 논쟁되는 압축 구문은 각주에서 어느 한쪽으로 과도하게 단정하지 않도록 수정했습니다. ‘반차’와 ‘아호아 사람’은 문맥과 한국어 성경 용례에 맞아 유지했습니다.
