base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
  footnotes:
  - marker: a
    text: 'Or ''for the Zerahite.'' The Hebrew expression may be taken more woodenly as a singular gentilic, but in context it likely denotes clan affiliation: ''of the Zerahites.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여덟째[각주 [a]], 곧 여덟째 달에 속한 사람은 시브개가며, 그는 후사 사람이며 세라 사람 계통입니다. 그의 부대는 이만사천 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세라 사람에게 속한’. 히브리어 표현은 더 문자적으로는 단수 지명형처럼 읽힐 수 있지만, 문맥상 씨족 소속을 가리키는 말로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי / לַחֹדֶשׁ הַשְּׁמִינִי
  english_pob_choice: The eighth / for the eighth month
  chosen_korean: 여덟째[각주 a], 곧 여덟째 달에 속한 사람
  alternatives_korean:
  - 여덟째 달을 맡은 사람
  - 여덟째, 여덟째 달을 위한 사람
  lexicon: HALOT
  rationale: 히브리어는 명시적 직함 없이 머리말에 서수와 월표현을 배치한 행정 목록 형식이므로, 한국어에서는 그 함축을 살리되 문맥상 ‘달에 속한 사람’으로 풀어 주었습니다.
- source_word: סִבְּכַי
