  rationale: 히브리어는 명시적 직함 없이 머리말에 서수와 월표현을 배치한 행정 목록 형식이므로, 한국어에서는 그 함축을 살리되 문맥상 ‘달에 속한 사람’으로 풀어 주었습니다.
