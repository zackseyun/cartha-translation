  chosen_korean: 시브개
  alternatives_korean:
  - 시벡개
  - 시브가이
  lexicon: 표준 음역 관행
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역을 따랐습니다.
- source_word: הַחֻשָׁתִי
  english_pob_choice: the Hushathite
  chosen_korean: 후사 사람
  alternatives_korean:
  - 후사 사람 계통의
  - 후샤 사람
  lexicon: HALOT
  rationale: 지명/씨족 표지를 한국어에서는 ‘~사람’으로 옮겨 출신 또는 소속을 자연스럽게 드러냈습니다.
- source_word: לַזַּרְחִי
  english_pob_choice: of the Zerahites
  chosen_korean: 세라 사람 계통
  alternatives_korean:
  - 세라 사람
  - 세라 족속
  - 세라 사람들
  lexicon: HALOT
  rationale: 이 ל 표지는 계통/소속을 나타내므로, 단순한 소유보다 씨족 소속을 분명히 하는 ‘계통’을 보탰습니다.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  english_pob_choice: and over his division were
  chosen_korean: 그의 부대는
  alternatives_korean:
  - 그의 편대는
  - 그의 분대는
  - 그의 구역은
  lexicon: HALOT
  rationale: 문맥상 군사 행정 단위를 가리키므로 ‘부대’로 옮겼고, 한국어 문장에서는 관계표현을 자연스럽게 풀어 주었습니다.
