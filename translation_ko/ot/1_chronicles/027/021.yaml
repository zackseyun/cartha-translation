lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  english_pob_choice: for the half-tribe of Manasseh
  chosen_korean: “므낫세 반 지파의”
  alternatives_korean:
  - “므낫세의 반 지파의”
  - “므낫세 반의”
  lexicon: HALOT
  rationale: 행정 명단의 소속을 나타내므로 ‘반 지파’로 옮겨 자연스럽게 소속 관계를 드러냈습니다.
- source_word: גִּלְעָדָ/ה
  english_pob_choice: in Gilead
  chosen_korean: “길르앗에는”
  alternatives_korean:
  - “길르앗에서”
  - “길르앗 지역에”
  lexicon: HALOT
  rationale: 지리적 표지를 한국어 조사로 간결하게 처리해 명단의 열거감을 살렸습니다.
- source_word: בֶּן זְכַרְיָהוּ
  english_pob_choice: son of Zechariah
  chosen_korean: “아버지는 스가랴이며”
  alternatives_korean:
  - “스가랴의 아들”
  - “스가랴의 아들입니다”
  lexicon: HALOT
  rationale: 히브리어 족보 공식의 관계를 한국어로 명료하게 드러내기 위해 ‘아버지’ 서술형을 택했고, 이름은 통용 표기 ‘스가랴’를 사용했습니다.
- source_word: יַעֲשִׂיאֵל
  english_pob_choice: Jaasiel
  chosen_korean: “야아시엘”
  alternatives_korean:
  - “야시엘”
  - “자아시엘”
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역했고, 영어 POB의 주석상 대안 철자(Jashiel)는 본문보다 주석으로 처리하는 것이 적절합니다.
