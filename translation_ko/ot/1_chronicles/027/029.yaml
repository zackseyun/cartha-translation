base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
  footnotes:
  - marker: a
    text: Or 'the cattle' instead of 'the herds.'
    reason: lexical_alternative
  - marker: b
    text: Sharon was the coastal plain region of Israel; 'the Sharonite' means a man from Sharon.
    reason: cultural_note
translation:
  language: ko
  text: 샤론에서 풀을 뜯는 소 떼[a]를 맡은 사람은 샤론 사람 시트라이[b]였고, 골짜기에 있는 소 떼를 맡은 사람은 아들라이의 아들 사밧이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가축 떼’.
    reason: lexical_alternative
  - marker: b
    text: 샤론은 이스라엘의 해안 평야 지역입니다. ‘샤론 사람’은 샤론 출신 사람을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: over
  chosen_korean: ~ 위에는
  alternatives_korean:
  - ~을 맡아
  - ~을 감독하여
  lexicon: HALOT
  rationale: 행정 목록의 ‘over’를 한국어로는 담당 범위를 나타내는 ‘~ 위에는’으로 옮겨, 감독·책임의 뉘앙스를 간결하게 살렸습니다.
- source_word: הַבָּקָר הָרֹעִים
  english_pob_choice: the herds grazing
  chosen_korean: 풀을 뜯는 가축들
  alternatives_korean:
  - 풀을 뜯는 떼
  - 방목 중인 가축들
  - 가축 떼
  lexicon: HALOT
  rationale: בקר는 여기서 집단적 가축을 가리키므로 ‘가축들’로 옮기고, רֹעִים의 상태를 ‘풀을 뜯는’으로 반영했습니다.
- source_word: שטרי הַשָּׁרוֹנִי
  english_pob_choice: Shitrai the Sharonite
  chosen_korean: 시트라이, 곧 샤론 사람
  alternatives_korean:
  - 시트라이, 샤론 출신 사람
  - 시트라이, 샤론 사람
  lexicon: BDB
  rationale: 고유명사와 지명형을 분리해, 인명이 시트라이이고 הַשָּׁרוֹנִי는 샤론 출신을 뜻하는 관계 형용사임을 분명히 했습니다.
- source_word: בָּעֲמָקִים
  english_pob_choice: in the valleys
  chosen_korean: 골짜기들의
  alternatives_korean:
  - 골짜기들에
  - 계곡들의
  lexicon: HALOT
  rationale: 복수형 עמקים를 직역해 ‘골짜기들’로 옮겼고, 속격 구조를 살려 ‘골짜기들의 가축들’로 처리했습니다.
