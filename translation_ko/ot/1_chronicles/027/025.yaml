  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
  footnotes:
  - marker: a
    text: Or 'in the field'; the Hebrew singular likely has a collective sense here, referring to rural areas as distinct from cities, villages, and towers.
    reason: lexical_alternative
  - marker: b
    text: '''Jehonathan'' reflects the fuller Hebrew name form here; some English versions shorten it to ''Jonathan.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 곳간들을 맡은 이는 아디엘의 아들 아스마웻이었고, 농촌 지역과 성읍들과 마을들과 망대들에 있는 곳간들을 맡은 이는 웃시야의 아들 여호나단이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל / עַל
  english_pob_choice: Over ... was
  chosen_korean: ~을 맡은 사람은
  alternatives_korean:
  - ~위에 있었습니다
  - ~을 관할했습니다
  lexicon: HALOT
  rationale: 행정 목록에서 עַל은 단순한 위치보다 감독·책임을 나타내므로, 한국어에서는 자연스럽게 ‘맡은 사람’으로 풀어 책임의 의미를 드러냈습니다.
- source_word: אֹצְרוֹת
  english_pob_choice: treasuries
  chosen_korean: 곳간들
  alternatives_korean:
  - 보물고들
  - 창고들
  - 재무창고들
  lexicon: HALOT
  rationale: 이 구절의 אֹצְרוֹת는 왕실 및 지역 저장 시설을 가리키므로, 현대 한국어에서 기능을 잘 드러내는 ‘곳간들’이 가장 무난합니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the countryside
  chosen_korean: 들판에 있는
  alternatives_korean:
  - 들판의
  - 시골에 있는
  - 전원에 있는
  lexicon: HALOT
  rationale: 문맥상 ‘성읍들, 마을들, 망대들’과 대비되는 농촌 지역 전체를 가리키므로, POB의 해석을 따라 ‘들판에 있는’으로 옮겨 넓은 농촌권을 살렸습니다.
- source_word: יְהוֹנָתָן
  english_pob_choice: Jehonathan
  chosen_korean: 여호나단
  alternatives_korean:
  - 요나단
  lexicon: standard transliteration
  rationale: 히브리어 본문은 더 긴 이름형 יְהוֹנָתָן을 쓰므로, 축약형 ‘요나단’ 대신 ‘여호나단’을 택해 원형을 반영했습니다.
