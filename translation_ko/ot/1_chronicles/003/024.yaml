  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
  footnotes:
  - marker: a
    text: The Hebrew spelling of the first listed name is unusual. 'Hodaviah' follows the most likely conventional identification; possible alternatives include 'Hodiah' or a more phonetic transliteration such as 'Hodevahu.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 엘리오에나이의 아들들은 호다비야, 엘리아십, 펠라야, 악굽, 요하난, 들라야, 그리고 아난니로, 모두 일곱이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이름의 히브리어 철자는 이례적이어서, 본문에서는 POB의 통용 식별명인 ‘호다비야’를 따랐습니다. 가능한 대안으로는 ‘호디야’ 또는 보다 음가에 가까운 ‘호데바후’가 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자녀들은
  - 그리고 …의 후손들은
  lexicon: HALOT
  rationale: 계보 문맥에서 בְּנֵי는 직계 아들뿐 아니라 후손을 가리킬 수 있지만, 여기서는 목록 서문의 형식을 살려 ‘아들들’로 옮기는 것이 가장 정확합니다.
- source_word: אֶלְיוֹעֵינַי
  english_pob_choice: Elyoenai
  chosen_korean: 엘리오에나이
  alternatives_korean:
  - 엘리오에나이
  - 엘리오나이
  lexicon: HALOT
  rationale: 고유명사는 음역하며, 본문 자음에 따른 표기와 기존 영어형을 함께 고려해 ‘엘리오에나이’로 옮겼습니다.
- source_word: הדיוהו
  english_pob_choice: Hodaviah
  chosen_korean: 호다비야
  alternatives_korean:
  - 호디야
  - 호데바후
  lexicon: HALOT
  rationale: 이 이름은 철자상 이례적이지만, POB의 문헌학적 판단에 따라 통용되는 식별명인 ‘호다비야’를 본문에 유지하는 것이 계보 표기상 가장 안정적입니다.
- source_word: שִׁבְעָה
  english_pob_choice: seven
  chosen_korean: 모두 일곱
  alternatives_korean:
  - 일곱 명
  - 총 일곱
  lexicon: HALOT
  rationale: 숫자는 명시적으로 보존해야 하며, 계보의 총합을 강조하는 문맥이므로 ‘모두 일곱’으로 자연스럽게 풀어 옮겼습니다.
