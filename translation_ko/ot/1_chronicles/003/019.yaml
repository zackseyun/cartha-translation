id: 1CH.3.19
reference: 1 Chronicles 3:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י פְדָיָ֔ה זְרֻבָּבֶ֖ל וְ/שִׁמְעִ֑י וּ/בֶן זְרֻבָּבֶל֙ מְשֻׁלָּ֣ם וַ/חֲנַנְיָ֔ה וּ/שְׁלֹמִ֖ית אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
  footnotes:
  - marker: a
    text: Hebrew reads singular 'the son of Zerubbabel.' Because the verse then names Meshullam and Hananiah, many understand this as a textual irregularity or as genealogical usage functioning collectively; hence 'the sons of Zerubbabel' in the main text.
    reason: textual_variant
translation:
  language: ko
  text: 브다야의 아들들은 스룹바벨과 시므이였습니다.[a] 스룹바벨의 아들들은 므술람과 하나냐였고, 그들의 누이는 슬로밋이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘스룹바벨의 아들’(단수)로 읽히지만, 이어지는 두 남성 이름 때문에 많은 해석자들은 이를 본문의 불규칙 또는 족보에서의 집합적 용법으로 이해합니다. 그래서 본문에는 ‘스룹바벨의 아들들’로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  english_pob_choice: The sons of Pedaiah
  chosen_korean: 브다야의 아들들
  alternatives_korean:
  - 브다야의 자손들
  - 브다야의 아들들이
  lexicon: HALOT
  rationale: 족보 문맥의 בנים는 기본적으로 ‘아들들’로 옮기는 것이 가장 직접적이며, 소유격 표현으로 자연스럽게 연결했습니다.
- source_word: וּבֶן זְרֻבָּבֶל
  english_pob_choice: And the sons of Zerubbabel
  chosen_korean: 스룹바벨의 아들들은
  alternatives_korean:
  - 스룹바벨의 아들은
  - 스룹바벨의 아들
  lexicon: HALOT
  rationale: 히브리어 본문은 단수 ‘아들’이지만, 이어지는 이름들이 복수이므로 POB의 본문 취지를 따라 복수로 풀어 옮겼습니다.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  english_pob_choice: and Shelomith was their sister
  chosen_korean: 그의 누이동생은 슬로밋이었습니다
  alternatives_korean:
  - 그들의 누이는 슬로밋이었습니다
  - 슬로밋은 그들의 누이였습니다
  lexicon: HALOT
  rationale: אֲחוֹתָם의 인칭접미사는 앞선 두 남성 이름을 가리키므로, 한국어에서는 더 자연스러운 단수 지시 ‘그의 누이동생’으로 처리했습니다.
- source_word: זְרֻבָּבֶל / שִׁמְעִי / מְשֻׁלָּם / וַחֲנַנְיָה / שְׁלֹמִית
  english_pob_choice: Zerubbabel / Shimei / Meshullam / Hananiah / Shelomith
  chosen_korean: 스룹바벨 / 시므이 / 므술람 / 하나냐 / 슬로밋
  alternatives_korean:
  - 스룹바벨 / 시므이 / 메술람 / 하나냐 / 셀로밋
  lexicon: 표준 외래어 표기
  rationale: 한국어 성경에서 널리 통용되는 인명 표기를 우선해 가독성과 일관성을 유지했습니다.
theological_decisions:
- issue: 히브리어 단수 בֶן('아들')과 이어지는 복수 인명 목록의 불일치
  chosen_reading: 본문은 한국어 본문에서 복수 ‘아들들’로 자연스럽게 조정하되, 각주로 히브리어 단수 읽기를 알립니다.
  alternative_readings:
  - 단수 그대로 ‘아들’로 직역
  - 본문에 ‘스룹바벨의 아들’로 두고 해석을 독자에게 맡김
  rationale: 족보 목록의 실제 지시 대상은 두 남성 이름과 한 여성 이름이므로, 독자가 본문 의미를 오해하지 않도록 POB의 해석을 따라 복수로 제시하는 것이 적절합니다.
  doctrine_reference: 본문비평 및 족보 표현 관례
- issue: 족보식 서술에서의 시제 보완
  chosen_reading: 한국어에서는 계보 진술을 위해 ‘-였습니다’로 보충했습니다.
  alternative_readings:
  - '무서술형 ‘브다야의 아들들: 스룹바벨과 시므이’'
  - 현재형 ‘…입니다’
  rationale: 히브리어 족보문은 보통 계사 없이 병렬되므로, 한국어에서는 읽기 자연성을 위해 과거 서술을 보완하되 의미를 추가하지는 않았습니다.
  doctrine_reference: 문체/서술 관례
