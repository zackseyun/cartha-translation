base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
  footnotes:
  - marker: a
    text: Shallum is commonly identified with Jehoahaz in 2 Kings 23:30–34 and Jeremiah 22:11; the Chronicler here preserves the name Shallum in Josiah’s genealogy.
    reason: cross_reference
translation:
  language: ko
  text: 요시야의 아들들은 이러합니다. 맏아들 여호난, 둘째 여호야김, 셋째 시드기야, 넷째 살룸입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 살룸은 흔히 2열왕기 23:30–34와 예레미야 22:11의 여호아하스와 동일인으로 이해됩니다. 그러나 역대기 기자는 여기서 요시야의 족보 안에 ‘살룸’이라는 이름을 보존합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 그리고 아들들은
  - 아들들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְנֵי는 직계 아들을 가리키므로, 자연스러운 한국어로 ‘아들들’로 옮기되 선행 맥락을 이어 주는 표현은 문장부호로 처리했습니다.
- source_word: הַבְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: בכור의 출생 순서와 지위를 함께 살리는 말은 ‘맏아들’이 가장 자연스럽고, 제도적 뉘앙스가 강한 ‘장자’보다 족보 서술에 맞습니다.
- source_word: יֹאשִׁיָּהוּ
  english_pob_choice: Josiah
  chosen_korean: 요시야
  alternatives_korean:
  - 요시아
  lexicon: 고유명사 관행
  rationale: 히브리어 אישי 이름은 한국어 성서 관행에 따라 ‘요시야’로 옮겼습니다.
- source_word: יוֹחָנָן
  english_pob_choice: Johanan
  chosen_korean: 여호난
  alternatives_korean:
  - 요하난
  - 요하난
  lexicon: 고유명사 관행
  rationale: 히브리어 יוֹחָנָן의 음가를 반영해 한국어 성서 관행에 맞는 ‘여호난’을 사용했습니다.
- source_word: יְהוֹיָקִים
  english_pob_choice: Jehoiakim
  chosen_korean: 여호야김
  alternatives_korean:
  - 여호야킴
  lexicon: 고유명사 관행
  rationale: 왕명으로 굳어진 한국어 형태를 따르되, 히브리어 철자와 대응되는 표준 성서 음역을 유지했습니다.
- source_word: צִדְקִיָּהוּ
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 치드기야
  - 시드키야
  lexicon: 고유명사 관행
  rationale: 한국어 성서에서 통용되는 왕명을 따랐습니다.
- source_word: שַׁלּוּם
  english_pob_choice: Shallum
  chosen_korean: 살룸
  alternatives_korean:
  - 샬룸
  lexicon: 고유명사 관행
  rationale: 히브리어 אישי 이름 שַׁלּוּם은 한국어 성서 관행에 따라 ‘살룸’으로 옮겼습니다.
theological_decisions:
- issue: 요시야의 아들 목록과 열왕기/예레미야의 알려진 계승 순서 차이
  chosen_reading: 본문의 족보적 배열을 그대로 살려 네 아들을 순서대로 제시하고, 역사적 동일시 문제는 본문 밖으로 두었습니다.
  alternative_readings:
  - 열왕기하 23장 및 예레미야 22장의 계승 서술에 맞추어 이름 순서를 조정하는 번역
  - 살룸을 여호아하스와 연결해 본문에 설명을 삽입하는 번역
  rationale: 역대기 본문은 왕위 계승사가 아니라 요시야의 아들들을 족보 형식으로 배열합니다. 그래서 원문의 순서를 보존하는 것이 가장 source-grounded합니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
