source:
  edition: WLC
  text: וּ/בְנֵ֥י שְׁכַנְיָ֖ה שְׁמַעְיָ֑ה וּ/בְנֵ֣י שְׁמַעְיָ֗ה חַטּ֡וּשׁ וְ֠/יִגְאָל וּ/בָרִ֧יחַ וּ/נְעַרְיָ֛ה וְ/שָׁפָ֖ט שִׁשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
  footnotes:
  - marker: a
    text: The Hebrew text says 'six,' though only five names are listed here in the Masoretic Text. This may reflect a textual issue or an omitted name in transmission.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 스가냐의 아들들은 스마야이고, 스마야의 아들들은 핫두스[a], 이갈, 바리야, 느아랴, 사밧, 여섯 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마소라 본문은 ‘여섯’이라고 하지만, 여기에는 이름이 다섯 개만 열거되어 있습니다. 이는 본문상의 문제이거나 전승 과정에서 이름 하나가 빠진 것을 반영할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - 그리고 …의 후손들은
  lexicon: HALOT
  rationale: 족보 공식의 직접 대응으로 ‘아들들’을 유지하되, 한국어 문장성은 위해 서술형으로 옮겼습니다.
- source_word: בָרִיחַ
  english_pob_choice: Bariah
  chosen_korean: 바라야
  alternatives_korean:
  - 바리아
  - 베리야
  lexicon: HALOT
  rationale: 마소라 본문의 자음형에 맞춰 인명으로 음역했으며, 익숙한 다른 이름을 끌어오지 않았습니다.
- source_word: יִגְאָל
  english_pob_choice: Igal
  chosen_korean: 이갈
  alternatives_korean:
  - 이가알
  - 지가알
  lexicon: HALOT
  rationale: 인명은 음역하되, 영어 POB의 선택을 따라 한국어 독음에 자연스러운 ‘이갈’을 택했습니다.
- source_word: שִׁשָּׁה
  english_pob_choice: six
  chosen_korean: 여섯 명
  alternatives_korean:
  - 여섯
  - 6명
  lexicon: HALOT
  rationale: 문맥상 인원수를 가리키므로 숫자만이 아니라 사람 수를 드러내는 ‘여섯 명’으로 옮겼습니다.
theological_decisions:
- issue: 본문의 이름 수와 숫자 표기 불일치
  chosen_reading: 본문은 이름이 다섯 개만 열거되지만 끝에 ‘여섯’이라고 적힌 마소라 본문의 긴장을 그대로 보존했습니다.
  alternative_readings:
  - 이름 하나를 추정해 보충하기
  - 숫자를 ‘다섯’으로 조정하기
  rationale: POB 영어본도 조화시키지 않고 본문상의 불일치를 드러내므로, 한국어도 동일한 방식으로 보존해야 합니다.
  doctrine_reference: 본문비평 / 사본 전승 주의
- issue: 족보 문체의 현대 한국어 표현
  chosen_reading: 반복되는 ‘And the sons of’를 직역하되 한국어 문장으로는 매끄럽게 연결했습니다.
  alternative_readings:
  - 자손들/후손들로 완화하기
  rationale: 계보의 구조를 드러내는 것이 우선이므로, 전형적이지만 덜 직접적인 일반화는 피했습니다.
  doctrine_reference: '번역 원칙: source transparency'
