base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
  footnotes:
  - marker: a
    text: 'The Hebrew syntax is compressed and somewhat difficult. It reads literally, ''And the son of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah, the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'' Some interpreters understand part of the sequence more broadly as a line of descendants rather than immediate sons.'
    reason: alternative_reading
translation:
  language: ko
  text: '그리고 하나냐의 아들들은: 블랏야와 여사야이며, 르바야의 아들들, 아르난의 아들들, 오바댜의 아들들, 세가냐의 아들들입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문장은 압축되어 있어, 일부 해석은 이 목록을 곧바로 ‘아들들’만이 아니라 더 넓은 후손 계열로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן / בְּנֵי
  english_pob_choice: And the son of / the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 아들들
  - 그리고 …의 자손들은
  lexicon: HALOT
  rationale: 히브리어 본문은 첫머리에 단수형 בן과 뒤따르는 반복적 בני를 함께 쓰는 압축된 족보 표현이어서, 한국어에서는 자연스럽게 풀어 쓰되 반복 구조를 유지해 ‘…의 아들들’로 옮겼습니다.
- source_word: חֲנַנְיָה
  english_pob_choice: Hananiah
  chosen_korean: 하나냐
  alternatives_korean:
  - 한나냐
  - 하난야
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 ‘하나냐’로 옮겼습니다.
- source_word: פְּלַטְיָה
  english_pob_choice: Pelatiah
  chosen_korean: 블랏야
  alternatives_korean:
  - 펠라티야
  - 플랏야
  lexicon: HALOT
  rationale: 고유명사는 음가를 반영해 음역했고, 끝의 -야 요소를 살려 표기했습니다.
- source_word: וִישַׁעְיָה
  english_pob_choice: and Jeshaiah
  chosen_korean: 여사야
  alternatives_korean:
  - 예사야
  - 이사야
  lexicon: HALOT
  rationale: 동일 어근의 더 익숙한 ‘이사야’와 구별되는 별도 인명으로서, 본문 고유형을 살려 음역했습니다.
- source_word: בְּנֵי רְפָיָה / בְּנֵי אַרְנָן / בְּנֵי עֹבַדְיָה / בְּנֵי שְׁכַנְיָה
  english_pob_choice: the sons of Rephaiah, the sons of Arnan, the sons of Obadiah, the sons of Shecaniah
  chosen_korean: 르바야의 아들들, 아르난의 아들들, 오바댜의 아들들, 세가냐의 아들들
  alternatives_korean:
  - 르바야 자손들, 아르난 자손들, 오바댜 자손들, 세가냐 자손들
  lexicon: HALOT
  rationale: 반복되는 족보 공식은 원문 구조를 따라 ‘~의 아들들’로 직역에 가깝게 유지했고, 족보상 세대 간격이 반드시 즉시적 아들 관계만은 아닐 수 있다는 해석 여지를 보존했습니다.
theological_decisions:
- issue: 압축된 족보 구문의 해석 범위
  chosen_reading: 문장 구조는 그대로 두되, 한국어 본문은 ‘…의 아들들’ 반복을 유지하여 직계와 후손 가능성을 모두 열어 둡니다.
  alternative_readings:
  - 자연스럽게 풀어 ‘…의 자손들’로 통일
  - 이름들을 재배열하여 계열 명단으로 해석
  rationale: 본문이 매우 압축되어 있어 과도한 문장 정리보다 원문의 족보 형식을 보존하는 편이 독자가 원문의 불확실성을 인식하는 데 도움이 됩니다.
  doctrine_reference: '성경 본문 해석 원칙: 본문이 허용하는 범위를 넘는 세부 관계 확정 자제'
