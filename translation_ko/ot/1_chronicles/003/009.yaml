  rationale: 히브리어 אֲחוֹתָם은 직설적으로 ‘그들의 자매/누이’를 뜻하므로, 연령을 덧붙이는 ‘여동생’보다 중립적인 ‘자매’가 원문의 범위를 더 잘 보존합니다.
