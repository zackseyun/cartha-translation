translation:
  language: ko
  text: 다윗의 아들들은 이들이 모두이며, 첩들의 아들들은 그 밖에 있었고, 다말은 그들의 자매였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘첩들의 아들들을 제외하고’로도 옮길 수 있습니다. 히브리어 구문은 앞의 총수에서 그 아들들을 뺀 것으로도, मुख्य 목록 밖에 덧붙인 것으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
