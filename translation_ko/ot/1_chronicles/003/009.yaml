base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
  footnotes:
  - marker: a
    text: Or 'apart from the sons of the concubines.' The Hebrew phrase may be understood as excluding those sons from the preceding total or as noting them additionally outside the main list.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 모두 다윗의 아들들이었습니다. 이들 외에 첩들의 아들들이 있었으며, 다말은 그들의 자매였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘첩들의 아들들을 제외하고’로도 옮길 수 있습니다. 히브리어 구문은 그 아들들을 앞의 총수에서 제외하는 것으로도, 주된 목록 밖에 덧붙이는 것으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  english_pob_choice: All these
  chosen_korean: 이들이 모두
  alternatives_korean:
  - 모두
  - 이 모든 사람들
  lexicon: HALOT
  rationale: 총계를 되짚는 요약 표현이므로 앞서 열거된 아들들을 가리키는 지시성과 합쳐 자연스럽게 옮겼습니다.
- source_word: בְּנֵי דָוִיד
  english_pob_choice: David’s sons
  chosen_korean: 다윗의 아들들
  alternatives_korean:
  - 다윗의 자녀들
  - 다윗의 아들들
  lexicon: HALOT
  rationale: 히브리어 בְּנֵי는 남성 복수이므로 ‘아들들’이 정확하며, 고유명사 ‘다윗’은 한국어 성경 관용에 맞게 옮겼습니다.
- source_word: מִלְּבַד
  english_pob_choice: besides
  chosen_korean: 그 밖에 있었고
  alternatives_korean:
  - 외에
  - 제외하고
  - 또한
  lexicon: HALOT
  rationale: 앞의 열거와 구별되는 부가 항목을 나타내므로, 단순한 제외보다 계보 문맥에 맞는 ‘그 밖에’로 처리했습니다.
- source_word: בְּנֵי פִילַגְשִׁים
  english_pob_choice: the sons of the concubines
  chosen_korean: 첩들의 아들들
  alternatives_korean:
  - 첩들의 자녀들
  - 다윗의 첩들의 아들들
  lexicon: HALOT
  rationale: 직역상 ‘첩들의 아들들’이 가장 가깝고, 문맥상 다윗의 가계를 가리키므로 소유격을 중복하지 않았습니다.
theological_decisions:
- issue: 다말의 관계 표현
  chosen_reading: 다말은 그들의 자매였습니다.
  alternative_readings:
  - 다말은 그들의 누이였습니다.
  - 다말은 그들의 여동생이었습니다.
  rationale: 히브리어 אֲחוֹתָם은 직설적으로 ‘그들의 자매/누이’를 뜻하므로, 연령을 덧붙이는 ‘여동생’보다 중립적인 ‘자매’가 원문의 범위를 더 잘 보존합니다.
  doctrine_reference: 가계 목록의 관계 표현 보존
