  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
  footnotes:
  - marker: a
    text: Or 'apart from the sons of the concubines.' The Hebrew phrase may be understood as excluding those sons from the preceding total or as noting them additionally outside the main list.
