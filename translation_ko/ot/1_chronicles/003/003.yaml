theological_decisions:
- issue: 에글라의 정체를 미가와 동일시하는 해석
  chosen_reading: 본문이 말하는 대로, 에글라를 단지 다윗의 아내로 표기하고 동일시 해석은 넣지 않았습니다.
  alternative_readings:
  - 에글라를 미가와 동일시하기
  - 에글라의 특별한 지위를 암시하기
  rationale: 히브리어는 רק עֶגְלָה אִשְׁתּוֹ라고만 말하며, 본문 자체는 더 이상의 설명을 주지 않습니다. 따라서 추정을 번역문에 흡수하지 않고 보류했습니다.
  doctrine_reference: 본문이 제시하지 않는 동일시를 덧붙이지 말고, 해석의 긴장을 유지합니다.
