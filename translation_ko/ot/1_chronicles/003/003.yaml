  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
  footnotes:
  - marker: a
    text: Or 'to Abital' / 'to Eglah,' that is, 'born to Abital' and 'born to Eglah.' The Hebrew preposition is rendered idiomatically here in genealogical English as 'by.'
    reason: lexical_alternative
  - marker: b
    text: Some interpreters identify Eglah with Michal, but the text itself does not state this.
    reason: alternative_reading
translation:
  language: ko
  text: 다섯째는 아비달에게서 난 스바댜요, 여섯째는 그의 아내 에글라에게서 난 이드르암입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ל는 이 족보 문맥에서 “~에게서 난”이라는 출생 관계를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 해석자들은 에글라를 미가와 동일시하지만, 본문 자체는 그렇게 말하지 않습니다.
    reason: alternative_reading
