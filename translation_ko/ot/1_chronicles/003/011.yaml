theological_decisions:
- issue: 족보에서의 ‘아들’ 용례
  chosen_reading: 직계 아들로만 좁히지 않고 족보적 계승 진술로 읽되, 번역은 ‘아들’로 유지했습니다.
  alternative_readings:
