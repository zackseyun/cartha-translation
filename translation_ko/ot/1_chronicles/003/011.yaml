translation:
  language: ko
  text: 여호람은 그의 아들[a][b]이며, 아하시야는 그의 아들이고, 요아스는 그의 아들[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들’은 족보에서 때때로 더 먼 후손을 가리킬 수 있으나, 이 절은 왕실 계승 목록을 압축해 제시하므로 여기서는 ‘아들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여호람’은 ‘요람’(Joram)으로도 표기됩니다.
    reason: alternative_reading
  - marker: c
    text: ‘요아스’는 ‘여호아스’(Jehoash)로도 표기됩니다.
    reason: alternative_reading
