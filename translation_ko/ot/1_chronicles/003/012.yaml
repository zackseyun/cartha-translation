translation:
  language: ko
  text: 그의 아들은 아마시야이고, 아마시야의 아들은 아사랴[a]이며, 아사랴의 아들은 요담입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 ‘아사랴’이며, 이 왕은 다른 곳에서 ‘웃시야’로도 알려져 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  english_pob_choice: Amaziah
  chosen_korean: 아마시야
  alternatives_korean:
  - 아마지야
  lexicon: HALOT
  rationale: 고유명사는 본문 형태를 따라 음역하되, 한국어 성경에서 널리 통용되는 왕 이름 형태를 우선해 옮겼습니다.
- source_word: בְנוֹ
  english_pob_choice: his son
  chosen_korean: 아들
  alternatives_korean:
  - 그의 아들
  - 자손
  lexicon: HALOT
  rationale: 계보 문맥의 בְנוֹ를 직설적으로 ‘아들’로 옮겨, 영어 POB의 ‘his son’이 드러내는 직접적 부자 관계를 유지했습니다.
- source_word: עֲזַרְיָה
  english_pob_choice: Azariah
  chosen_korean: 아사랴
  alternatives_korean:
  - 아사리야
  - 웃시야
  lexicon: HALOT
  rationale: 히브리어 본문 형태가 עֲזַרְיָה이므로 이를 직접 반영했습니다. 다른 이름형인 ‘웃시야’는 본절 자체의 표면형을 가리지 않기 위해 채택하지 않았습니다.
- source_word: יוֹתָם
  english_pob_choice: Jotham
  chosen_korean: 요담
  alternatives_korean:
  - 요담
  - 여담
  lexicon: HALOT
  rationale: 통용되는 한국어 음역을 사용하되, 본문의 고유명사 계열을 일관되게 유지했습니다.
theological_decisions:
- issue: 왕실 계보의 축약 가능성
  chosen_reading: 문자 그대로 ‘아들’의 반복을 유지했습니다.
  alternative_readings:
  - ‘후손’으로 일반화하여 계보의 축약 가능성을 드러냄
  rationale: 히브리어가 בְנוֹ를 세 번 반복하므로, 계보가 때로 세대를 압축할 수 있더라도 본문 표면의 친자 관계 표현을 보존하는 것이 더 투명합니다.
  doctrine_reference: Translation philosophy §1, §5
