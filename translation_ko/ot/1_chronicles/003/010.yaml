translation:
  language: ko
  text: 솔로몬의 아들은 르호보암이요, 그의 아들은 아비야요[a], 그의 아들은 아사요, 그의 아들은 여호사밧이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘아비야’입니다. 열왕기에서는 같은 왕이 ‘아비얌’이라는 변이형으로도 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן
  english_pob_choice: And the son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - 그리고 ~의 아들
  - 아들이
  lexicon: HALOT
  rationale: 계보 문맥에서 연속되는 소유·혈통 관계를 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
