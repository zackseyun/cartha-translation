base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Abijah.'' In 1–2 Kings the same king is also referred to by the variant name ''Abijam.'''
    reason: alternative_reading
translation:
  language: ko
  text: 솔로몬의 아들은 르호보암이요, 그의 아들은 아비야요[a], 그의 아들은 아사요, 그의 아들은 여호사밧이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘아비야’입니다. 열왕기상·하에서는 같은 왕이 ‘아비얌’이라는 변이형으로도 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן
  english_pob_choice: And the son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - 그리고 ~의 아들
  - 아들이
  lexicon: HALOT
  rationale: 계보 문맥에서 연속되는 소유·혈통 관계를 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: שְׁלֹמֹה
  english_pob_choice: Solomon
  chosen_korean: 솔로몬
  alternatives_korean:
  - 솔로몬왕
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 굳어진 형태를 따랐습니다.
- source_word: בְנ/וֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그 아들
  - 아들
  lexicon: HALOT
  rationale: 3인칭 남성 단수 접미사는 계보의 반복 리듬을 살리면서도 한국어에서는 '그의 아들'이 가장 직역에 가깝고 자연스럽습니다.
- source_word: אֲבִיָּה
  english_pob_choice: Abijah
  chosen_korean: 아비야
  alternatives_korean:
  - 아비얌
  lexicon: HALOT
  rationale: 본문에 있는 히브리어 이름형을 그대로 반영했습니다. 영어 주석의 변이형 'Abijam'은 역대기의 본문 형태가 아니므로 본문에는 넣지 않았습니다.
