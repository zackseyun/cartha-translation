base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
  footnotes:
  - marker: a
    text: Hebrew simply reads “five,” summarizing the five names just listed; English may supply “there were” for smoothness, but the text is elliptical.
    reason: lexical_alternative
  - marker: b
    text: The final name is written as two Hebrew elements, “Jushab Hesed,” but is best understood as a single compound personal name, here rendered “Jushab-hesed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 하수바와 오헬과 베레갸와 하사댜와 유샤브-헤세드,[b] 다섯입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞의 다섯 이름을 요약하여 단지 “다섯”이라고만 합니다. 한국어 문장으로 끝맺기 위해 “입니다”를 보탰습니다.
    reason: source_note
  - marker: b
    text: 마지막 이름은 히브리어에서 두 요소로 적히지만, 하나의 합성 인명으로 이해하는 것이 자연스럽습니다. 그래서 하이픈으로 묶어 표기했습니다.
    reason: lexical_alternative
lexical_decisions:
