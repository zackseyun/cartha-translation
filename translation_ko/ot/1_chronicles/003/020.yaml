  source_fidelity: 개정이 필요합니다. 여러 인명의 히브리어 모음과 자음값이 초안에 정확히 반영되지 않았습니다. 특히 חֲשֻׁבָה는 ‘하수바’, בֶרֶכְיָה는 ‘베레갸’, חֲסַדְיָה는 ‘하사댜’, יֻשַׁב חֶסֶד는 ‘유샤브-헤세드’가 원문 형태에 더 충실합니다. 마지막 חָמֵשׁ은 앞의 다섯 이름을 요약하는 단독 수사입니다.
  naturalness: ‘그리고 … 그리고 …’의 반복보다, 한국어 족보 열거법인 ‘-와/-과’를 사용한 뒤 ‘다섯입니다’로 맺는 편이 현대 표준어 합쇼체에서 자연스럽습니다. 수사의 축약성도 유지됩니다.
  terminology: 고유명사는 번역하지 않고 히브리어 발음 형태를 따라 음역했습니다. 합성 인명 유샤브-헤세드는 하이픈으로 한 이름임을 드러냈습니다. ‘헤세드’를 신학 용어로 번역하지 않은 것은 이 문맥에서 인명의 구성 요소이기 때문입니다.
