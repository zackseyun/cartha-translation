source:
  edition: WLC
  text: וַ/חֲשֻׁבָ֡ה וָ֠/אֹהֶל וּ/בֶרֶכְיָ֧ה וַֽ/חֲסַדְיָ֛ה י֥וּשַׁב חֶ֖סֶד חָמֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
  footnotes:
  - marker: a
    text: Hebrew simply reads “five,” summarizing the five names just listed; English may supply “there were” for smoothness, but the text is elliptical.
    reason: lexical_alternative
  - marker: b
    text: The final name is written as two Hebrew elements, “Jushab Hesed,” but is best understood as a single compound personal name, here rendered “Jushab-hesed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 하슈바, 오헬, 브레기야, 하사디야, 그리고 유솹-헤세드—다섯입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞의 다섯 이름을 요약하며 단지 “다섯”이라고만 적습니다. 한국어에서는 문맥상 서술을 보완할 수 있지만, 여기서는 축약성을 살리기 위해 그대로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 마지막 이름은 히브리어에서 두 요소로 적히지만 하나의 합성 인명으로 이해하는 것이 자연스럽습니다. 그래서 하이픈으로 묶어 표기했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  english_pob_choice: and Hashubah
  chosen_korean: 그리고 하슈바
  alternatives_korean:
  - 그리고 하쉬바
  - 그리고 하숩바
  lexicon: HALOT
  rationale: 사람 이름이므로 음역했으며, 히브리어 자음군과 모음을 무리 없이 반영하는 표기로 하슈바를 택했습니다.
- source_word: וָ֠/אֹהֶל
  english_pob_choice: Ohel
  chosen_korean: 오헬
  alternatives_korean:
  - 오헤ل
  - 장막
  lexicon: HALOT
  rationale: 이 자리에서는 일반명사 '장막'이 아니라 인명으로 기능하므로, 음역을 유지했습니다.
- source_word: וּ/בֶרֶכְיָ֧ה
  english_pob_choice: Berekiah
  chosen_korean: 브레기야
  alternatives_korean:
  - 베레기야
  - 베레키야
  lexicon: HALOT
  rationale: 끝의 -יה를 한국어 성경 이름 관례에 따라 -기야로 옮기되, 자음값을 살려 브레기야로 적었습니다.
- source_word: וַֽ/חֲסַדְיָ֛ה
  english_pob_choice: Hasadiah
  chosen_korean: 하사디야
  alternatives_korean:
  - 하사댜
  - 하사야
  lexicon: HALOT
  rationale: 히브리어 고유명사를 직접 음역했으며, 결말의 -iah를 -야로만 줄이지 않고 이름 형태를 보존했습니다.
- source_word: י֥וּשַׁב חֶ֖סֶד
  english_pob_choice: Jushab-hesed
  chosen_korean: 유솹-헤세드
  alternatives_korean:
  - 유솹헤세드
  - 요셉-헤세드
  lexicon: HALOT
  rationale: 히브리어에서 두 요소로 적혔지만 하나의 합성 인명으로 기능하므로 하이픈을 살려 표기했습니다. '헤세드'는 히브리어 חֶסֶד의 표준 음역을 따랐습니다.
- source_word: חָמֵשׁ
  english_pob_choice: five
  chosen_korean: 다섯입니다
  alternatives_korean:
  - 다섯
  - 다섯 명입니다
  lexicon: HALOT
  rationale: 마지막 수사가 앞선 이름들을 요약하는 간결한 족보식 표현이므로, 한국어에서는 독자 친화적으로 서술형을 취했습니다.
theological_decisions:
- issue: 족보의 축약된 수사 처리
  chosen_reading: ‘다섯입니다’로 마무리해 앞선 다섯 이름을 요약하는 축약을 드러냈습니다.
  alternative_readings:
  - ‘다섯’
  - ‘총 다섯입니다’
  rationale: 히브리어 본문은 엘립시스가 있는 수사적 결말이므로, 보태지 않으면서도 한국어 문장으로 자연스럽게 전달했습니다.
  doctrine_reference: 본문 비평/서술 문체
