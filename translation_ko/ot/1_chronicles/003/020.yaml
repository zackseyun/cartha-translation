  - 하사야
  lexicon: HALOT
  rationale: 히브리어 고유명사를 직접 음역했으며, 결말의 -iah를 -야로만 줄이지 않고 이름 형태를 보존했습니다.
- source_word: י֥וּשַׁב חֶ֖סֶד
  english_pob_choice: Jushab-hesed
  chosen_korean: 유솹-헤세드
