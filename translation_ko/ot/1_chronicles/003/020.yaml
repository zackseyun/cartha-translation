  - 요셉-헤세드
  lexicon: HALOT
  rationale: 히브리어에서 두 요소로 적혔지만 하나의 합성 인명으로 기능하므로 하이픈을 살려 표기했습니다. '헤세드'는 히브리어 חֶסֶד의 표준 음역을 따랐습니다.
- source_word: חָמֵשׁ
