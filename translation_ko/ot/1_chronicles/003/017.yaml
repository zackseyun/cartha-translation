    text: '또는, ‘포로가 된 여고냐의 아들들: 그의 아들 스알디엘.’ 히브리어 אַסִּר는 고유명사 ‘앗시르’로도, ‘포로’ 또는 ‘갇힌 사람’이라는 보통명사로도 읽을 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 아들
