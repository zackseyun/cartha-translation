  lexicon: WLC genealogical usage
  rationale: 계보 문맥에서 בְנֵי는 단순한 ‘아들들’로, ו는 연결어 ‘그리고’로 옮겨 계보의 연속성을 드러냈습니다.
- source_word: יְכָנְיָה
