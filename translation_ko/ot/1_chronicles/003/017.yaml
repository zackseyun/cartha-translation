base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
  footnotes:
  - marker: a
    text: 'Or, ''And the sons of Jeconiah the captive: Shealtiel his son.'' The Hebrew אַסִּר can be read either as the proper name Assir or as the common noun ''captive/prisoner.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 여고냐의 아들들은 앗시르와 그의 아들 스알디엘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는, ‘포로 여고냐의 아들들: 그의 아들 스알디엘.’ 히브리어 אַסִּר는 고유명사 ‘앗시르’로도, ‘포로/갇힌 자’라는 공통명사로도 읽을 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 아들
  - …의 아들들은
  lexicon: WLC genealogical usage
  rationale: 계보 문맥에서 בְנֵי는 단순한 ‘아들들’로, ו는 연결어 ‘그리고’로 옮겨 계보의 연속성을 드러냈습니다.
- source_word: יְכָנְיָה
  english_pob_choice: Jeconiah
  chosen_korean: 여고냐
  alternatives_korean:
  - 여고니야
  - 여고냐스
  lexicon: HALOT
  rationale: 히브리어 인명은 한국어 성경에서 널리 통용되는 음역형 ‘여고냐’를 사용했습니다.
- source_word: אַסִּר
  english_pob_choice: Assir
  chosen_korean: 앗시르
  alternatives_korean:
  - 포로
  - 갇힌 자
  lexicon: HALOT
  rationale: 본문의 계보 표기에서는 고유명사로 읽는 해석을 따라 음역했으며, 공통명사적 의미는 각주로 보존했습니다.
- source_word: שְׁאַלְתִּיאֵל
  english_pob_choice: Shealtiel
  chosen_korean: 스알디엘
  alternatives_korean:
  - 세알디엘
  - 살디엘
  lexicon: HALOT
  rationale: 히브리어 인명을 표준 음역에 맞춰 ‘스알디엘’로 옮겼습니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그 아들
  - 그의 자손
  lexicon: HALOT
  rationale: 소유 접미사는 계보에서 자연스럽게 ‘그의 아들’로 옮기는 것이 가장 직접적입니다.
theological_decisions:
- issue: אַסִּר의 의미를 고유명사로 볼지 ‘포로/갇힌 자’로 볼지
  chosen_reading: 본문에는 고유명사 ‘앗시르’를 두고, 대안 해석은 각주로 제시했습니다.
  alternative_readings:
  - 여고냐 포로의 아들들
  - 여고냐, 곧 포로의 아들들
  rationale: 계보문의 나열 구조와 마소라 본문의 표기는 이름으로 읽는 해석을 지지하지만, 공통명사적 독법도 가능하므로 본문-각주 구분으로 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve genuine ambiguity in a footnote.'
