- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그 아들
  - 그의 자손
  lexicon: HALOT
  rationale: 소유 접미사는 계보에서 자연스럽게 ‘그의 아들’로 옮기는 것이 가장 직접적입니다.
theological_decisions:
- issue: אַסִּר의 의미를 고유명사로 볼지 ‘포로/갇힌 자’로 볼지
  chosen_reading: 본문에는 고유명사 ‘앗시르’를 두고, 대안 해석은 각주로 제시했습니다.
  alternative_readings:
  - 여고냐 포로의 아들들
  - 여고냐, 곧 포로의 아들들
  rationale: 계보문의 나열 구조와 마소라 본문의 표기는 이름으로 읽는 해석을 지지하지만, 공통명사적 독법도 가능하므로 본문-각주 구분으로 긴장을 보존했습니다.
