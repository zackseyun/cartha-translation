  - marker: a
    text: In 2 Samuel 5:14 and related parallels, she is called Bathsheba, daughter of Eliam.
    reason: alternative_reading
  - marker: b
    text: Hebrew Shimea; the parallel in 2 Samuel 5:14 has Shammua.
    reason: textual_variant
translation:
  language: ko
  text: 예루살렘에서 그에게서 난 자들은 이들이었습니다. 시므아[a], 쇼밥, 나단[b], 솔로몬—네 사람은 밧수아 곧 암미엘의 딸에게서 났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사무엘하 5:14 및 관련 평행본문에서는 그녀를 엘리암의 딸 밧세바라고 부릅니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 시므아이며, 사무엘하 5:14의 평행본문에는 샴무아가 있습니다.
    reason: textual_variant
