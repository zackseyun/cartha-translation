source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'Now these were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
  footnotes:
  - marker: a
    text: In the parallel list at 2 Samuel 3:3, this son is called Chileab rather than Daniel.
    reason: alternative_reading
translation:
  language: ko
  text: 다음은 헤브론에서 다윗에게 태어난 다윗의 아들들입니다. 맏아들은 이스르엘 여인 아히노암에게서 난 암논이고, 둘째는 갈멜 여인 아비가일에게서 난 다니엘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 병행 본문인 2사무엘 3:3에서는 이 아들을 다니엘이 아니라 길르압이라고 부릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  english_pob_choice: Now these were
  chosen_korean: 이것이 …이며
  alternatives_korean:
  - 이들은 …입니다
  - 그리고 이것들은 …입니다
  lexicon: WLC
  rationale: 계보 목록의 도입부로서 새 항목을 열되, 현대 한국어에서 자연스러운 진술형으로 연결했습니다.
- source_word: בְּנֵי דָויִד
  english_pob_choice: David’s sons
  chosen_korean: 다윗의 아들들
  alternatives_korean:
  - 다윗의 자녀들
  - 다윗의 아들들입니다
  lexicon: HALOT
  rationale: 히브리어의 남성 특정 계보 표현을 그대로 살려 ‘아들들’로 옮겼습니다.
- source_word: אֲשֶׁר נוֹלַד ל֖וֹ בְּחֶבְרוֹן
  english_pob_choice: who were born to him in Hebron
  chosen_korean: 헤브론에서 그에게서 태어난
  alternatives_korean:
  - 헤브론에서 그에게 난
  - 헤브론에서 그가 낳은
  lexicon: HALOT
  rationale: נולד의 수동성과 ל־의 관계를 살려, 다윗이 직접 행위자라는 뉘앙스로 과도하게 바꾸지 않고 출생 관계를 표현했습니다.
- source_word: הַבְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째
  - 장자
  lexicon: HALOT
  rationale: 계보 문맥에서 בכור의 서열·지위 의미를 한국어의 ‘맏아들’로 자연스럽게 옮겼습니다.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית / לַאֲבִיגַיִל הַכַּרְמְלִית
  english_pob_choice: by Ahinoam the Jezreelite / by Abigail the Carmelite
  chosen_korean: 아히노암 곧 이스르엘 여인에게서 난 / 아비가일 곧 갈멜 여인에게서 난
  alternatives_korean:
  - 아히노암, 이스르엘 사람에게서 난 / 아비가일, 갈멜 사람에게서 난
  - 아히노암, 이스르엘 여자에게서 난 / 아비가일, 갈멜 여자에게서 난
  lexicon: HALOT
  rationale: לְ가 어머니를 가리키는 계보 용법이므로 ‘에게서 난’으로 옮겼고, gentilic 형용사는 출신을 드러내는 설명구로 풀었습니다.
theological_decisions:
- issue: 2사무엘 3:3과의 이름 차이(다니엘 vs. 길르압/칠레압 계열)
  chosen_reading: 본문은 역대기 עצמו의 형태인 ‘다니엘’을 따르고, 차이는 주석 없이 본문 밖 정보로 처리하지 않았습니다.
  alternative_readings:
  - 2사무엘 병행 본문의 다른 이름을 본문에 반영
  - 동일 인물을 암시하는 보조 번역을 덧붙임
  rationale: 이 절의 히브리어 본문은 분명히 다니엘을 제시하므로, 병행 본문의 차이는 각주로만 처리하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 본문비평/평행본문 처리 원칙
