revisions:
- from: 이것이 다윗의 아들들이며, 헤브론에서 그에게서 태어난 자들입니다. 맏아들은 아히노암 곧 이스르엘 여인에게서 난 암논이요, 둘째는 아비가일 곧 갈멜 여인에게서 난 다니엘입니다.[a]
  to: 다음은 헤브론에서 다윗에게 태어난 다윗의 아들들입니다. 맏아들은 이스르엘 여인 아히노암에게서 난 암논이고, 둘째는 갈멜 여인 아비가일에게서 난 다니엘입니다.[a]
  rationale: 히브리어의 목록 도입, 출생 관계, 출생지, 맏아들·둘째의 순서, 어머니의 출신 표지를 모두 유지하면서 도입부를 문법적으로 완결된 현대 한국어 합쇼체로 고쳤습니다. 병행 본문의 이명은 본문에 섞지 않고 다니엘에 붙은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
