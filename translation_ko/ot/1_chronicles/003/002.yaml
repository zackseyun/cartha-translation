theological_decisions:
- issue: 계보에서의 ‘딸’ 표현
  chosen_reading: ‘딸에게서 난’으로 옮겨, 마아가와 달매의 관계를 직접 계보적으로 드러냈습니다.
  alternative_readings:
  - ‘딸’
  - ‘손녀’
  rationale: 원문은 בַּת(딸)을 직접 사용하며, 영어 POB도 기본값을 ‘daughter of’로 두고 각주에서만 ‘granddaughter’ 가능성을 제시합니다. 본문은 직접 अर्थ를 유지하고, 더 먼 후손 가능성은 본문 밖으로 남기는 것이 원문 긴장을 보존합니다.
  doctrine_reference: 계보 본문 해석 원칙
- issue: 서수 목록의 문체
  chosen_reading: ‘세 번째… 네 번째…’처럼 목록 표지를 분명히 해 계보의 순차성을 살렸습니다.
  alternative_readings:
  - ‘셋째… 넷째…’
  rationale: 본문은 다윗의 아들들 목록이므로 서수의 배열이 의미 구조의 핵심입니다. 현대 독자가 즉시 파악할 수 있는 형식을 택했습니다.
  doctrine_reference: 서술 명료성
