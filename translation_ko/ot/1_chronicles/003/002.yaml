  text: 셋째는 그술 왕 달매의 딸[a] 마아가에게서 난 아들 압살롬입니다. 넷째는 학깃에게서 난 아들 아도니야입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בַּת(딸)은 계보 문맥에서 더 먼 여성 후손을 가리킬 수도 있습니다. 그러나 이 절은 가장 직접적으로는 ‘달매의 딸’을 뜻합니다.
    reason: lexical_alternative
