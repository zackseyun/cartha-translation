  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
  footnotes:
  - marker: a
    text: Or possibly 'granddaughter of Talmai,' since 'daughter' can sometimes denote a more remote female descendant in genealogical contexts; the Hebrew here most directly reads 'daughter of Talmai king of Geshur.'
