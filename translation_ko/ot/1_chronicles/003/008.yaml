translation:
  language: ko
  text: 엘리사마와 엘리아다와 엘리벨렛, 모두 아홉 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 5–8절에 열거된 아들들의 수를 합하면 모두 아홉이라는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: אֱלִישָׁמָע
  english_pob_choice: Elishama
  chosen_korean: 엘리사마
  alternatives_korean:
  - 엘리시마
  - 엘리샤마
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 번역하지 않고 현대 한국어 음역으로 옮겼습니다. 영어 POB의 Elishama에 맞추되, 한국어 발음 관행상 ‘엘리사마’가 가장 자연스럽습니다.
- source_word: אֶלְיָדָע
  english_pob_choice: Eliada
  chosen_korean: 엘야다
  alternatives_korean:
  - 엘리아다
  - 엘리야다
  lexicon: 고유명사 음역
  rationale: 영어 POB의 Eliada를 따르되, 히브리어 자음 배열을 반영해 한국어 음역은 ‘엘야다’가 더 직접적입니다.
- source_word: אֱלִיפֶלֶט
  english_pob_choice: Eliphelet
  chosen_korean: 엘리벨렛
  alternatives_korean:
  - 엘리페렛
  - 엘리펠렛
  lexicon: 고유명사 음역
  rationale: 영어 POB의 Eliphelet을 한국어 음운에 맞게 옮겼습니다. 히브리어의 중간 자음과 모음값을 과도하게 해석하지 않고 음역 중심으로 처리했습니다.
- source_word: תִּשְׁעָה
  english_pob_choice: nine
  chosen_korean: 아홉
  alternatives_korean:
  - '9'
  - 아홉 명
  lexicon: HALOT
  rationale: 문장 끝의 총계 표현이므로 수사적으로 자연스러운 한국어 수사 ‘아홉’으로 옮겼습니다. 본문 자체가 목록의 합계를 말하므로 ‘명’을 덧붙이지 않았습니다.
theological_decisions:
- issue: 절 끝의 총계 표현 처리
  chosen_reading: 목록에 열거된 이름들을 합산한 결론적 총계로서 단순히 ‘—아홉입니다’로 옮겼습니다.
  alternative_readings:
  - ‘총 아홉입니다’
  - ‘아홉 명입니다’
  rationale: 히브리어 תִּשְׁעָה는 별도 설명어 없이 총수를 제시합니다. 영어 POB도 주석으로 문맥적 총계를 밝혔으므로, 본문은 간결하게 수량을 제시하고 의미는 주석으로 보완하는 편이 원문에 가깝습니다.
  doctrine_reference: 문맥적 수량 표현 처리
