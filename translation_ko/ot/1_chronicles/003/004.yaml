  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: ko
  text: 여섯이 헤브론에서 그에게서 태어났습니다. 그는 그곳에서 칠 년과 여섯 달 동안 다스렸고, 예루살렘에서는 삼십삼 년 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  english_pob_choice: Six
  chosen_korean: 여섯
  alternatives_korean:
  - 이 여섯
  lexicon: HALOT
  rationale: 앞선 아들 목록을 가리키는 수사이므로, 자연스러운 한국어로 단순히 ‘여섯’이라 옮겼습니다.
- source_word: נוֹלַד לוֹ
  english_pob_choice: were born to him
  chosen_korean: 그에게서 태어났습니다
  alternatives_korean:
  - 그에게서 났습니다
  - 그가 낳았습니다
  lexicon: HALOT
  rationale: 히브리어 수동형을 살리면서도 한국어에서 출생의 결과를 자연스럽게 드러내기 위해 ‘그에게서 태어났습니다’로 옮겼습니다.
- source_word: וַיִּמְלָךְ שָׁם
  english_pob_choice: and he reigned there
  chosen_korean: 그는 그곳에서 ... 다스렸고
  alternatives_korean:
  - 그는 그곳에서 통치했고
  - 그는 그곳에서 왕으로 있었고
  lexicon: HALOT
  rationale: מלך의 왕권 행사를 반영해 ‘다스리다’를 택했으며, 반복을 줄이기 위해 뒤의 절에도 같은 동사를 유지했습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘에서
  lexicon: HALOT
  rationale: 장소 부사격은 한국어에서 자연스럽게 ‘예루살렘에서는’으로 처리해 앞 절의 ‘그곳에서’와 대비를 살렸습니다.
