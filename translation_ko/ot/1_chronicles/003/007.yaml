lexical_decisions:
- source_word: נֹגַהּ
  english_pob_choice: Nogah
  chosen_korean: 노가
  alternatives_korean:
  - 노가흐
  lexicon: HALOT
  rationale: 족보의 인명은 뜻풀이보다 음역이 적절하므로, 영어 POB의 Nogah에 맞춰 한국어로는 자연스러운 음역인 ‘노가’를 택했습니다. 끝의 거센음 표기는 한국어 독자에게 불필요하므로 과도하게 드러내지 않았습니다.
- source_word: נֶפֶג
  english_pob_choice: Nepheg
  chosen_korean: 네벡
  alternatives_korean:
  - 네페그
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 원문 의도를 가장 직접적으로 반영합니다. 영어 POB의 Nepheg를 한국어 음운에 맞춰 ‘네벡’으로 옮겼습니다.
- source_word: יָפִיעַ
  english_pob_choice: Japhia
  chosen_korean: 야피아
  alternatives_korean:
  - 자피아
  lexicon: HALOT
  rationale: 영어 POB가 주는 표준 음역 Japhia를, י의 어두를 살려 한국어에서는 ‘야피아’로 옮겼습니다. 영어식 철자 J를 그대로 따르는 것보다 히브리어 자음을 더 직접적으로 반영합니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 과
  alternatives_korean:
  - 그리고
  lexicon: 문장 연결 조사
  rationale: 히브리어 접속사 וְ는 나열을 잇는 단순 연결이므로 한국어에서는 ‘과’로 간결하게 처리했습니다.
