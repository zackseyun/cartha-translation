base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
  footnotes:
  - marker: a
    text: 'Hebrew is terse: ''Jeconiah his son, Zedekiah his son.'' This may be read as a simple genealogical sequence, though interpreters differ on whether both names are sons of Jehoiakim or whether Zedekiah is son of Jeconiah in the line as stated here.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 여호야김의 아들들은 이렇습니다. 여고냐, 그의 아들; 시드기야, 그의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 매우 압축적입니다: ‘여고냐, 그의 아들; 시드기야, 그의 아들.’ 이는 단순한 계보의 순서로 읽을 수도 있습니다. 두 이름이 모두 여호야김의 아들인지, 아니면 여기 적힌 순서대로 시드기야가 여고냐의 아들인지에 대해서는 해석이 갈립니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵ֖י
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은 이렇습니다
  alternatives_korean:
  - 그리고 …의 아들들은
  - 그리고 …의 아들들
  lexicon: HALOT
  rationale: 계보 목록을 여는 접속과 복수형 ‘아들들’을 살리되, 한국어에서는 자연스럽게 목록 도입 표현으로 풀었습니다.
- source_word: יְהוֹיָקִ֑ים
  english_pob_choice: Jehoiakim
  chosen_korean: 여호야김
  alternatives_korean:
  - 요야김
  lexicon: HALOT
  rationale: 히브리어 고유명사의 표준 음역을 따랐습니다.
- source_word: בְנ֖/וֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그 아들
  - 아들
  lexicon: HALOT
  rationale: 반복되는 소유격 표시를 한국어의 ‘그의 아들’로 직역해, 계보문의 반복 구조를 드러냈습니다.
- source_word: יְכָנְיָ֥ה
  english_pob_choice: Jeconiah
  chosen_korean: 여고냐
  alternatives_korean:
  - 여고냐
  - 여고니야
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 쓰이는 표준 음역을 우선했습니다. 영어 POB의 ‘Jeconiah’에 해당하는 이름입니다.
- source_word: צִדְקִיָּ֥ה
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 시드키야
  lexicon: HALOT
  rationale: 한국어에서 확립된 고유명사 음역을 사용했습니다.
theological_decisions:
- issue: 히브리어의 매우 압축된 계보 구문 처리
  chosen_reading: 본문의 반복 구조를 따라 ‘여고냐 그의 아들, 시드기야 그의 아들’로 옮기고, 두 이름의 관계를 본문이 말하는 대로 남겨 두었습니다.
  alternative_readings:
  - ‘여호야김의 아들들은 여고냐와 시드기야입니다’처럼 관계를 매끈하게 정리하는 번역
  - 시드기야를 여고냐의 아들로 한정하는 해석
  rationale: 히브리어는 각 이름 뒤에 ‘그의 아들’을 반복하지만, 누가 누구의 아들인지의 최종 정리는 본문 자체가 아니라 해석에 달려 있습니다. 그래서 번역문은 계보의 압축성과 모호성을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
