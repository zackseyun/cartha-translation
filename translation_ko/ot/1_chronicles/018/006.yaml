reference: 1 Chronicles 18:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
  footnotes:
  - marker: a
    text: Or 'stationed forces' or more literally 'put' in Aram of Damascus; the Hebrew verb itself is simply 'placed,' with 'garrisons' understood from the military context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Aram'; traditionally 'Syria' or 'the Syrians.'
    reason: alternative_reading
  - marker: c
    text: Or 'delivered David' or 'saved David'; in this battle context, 'gave victory' expresses the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 다마스쿠스 아람에 주둔군을 두었습니다[a]. 아람 사람들은[b] 다윗의 종이 되어 조공을 바쳤습니다. 야훼께서 다윗이 가는 곳마다 그에게 승리를 주셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주둔군을 배치했다” 혹은 더 문자적으로 “두었다”로도 옮길 수 있습니다. 히브리어 동사 자체는 단순히 ‘두다/놓다’이며, 군사적 문맥에서 ‘주둔군’이 함축됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘아람’을 따른 번역입니다. 전통적으로는 ‘시리아’ 또는 ‘시리아 사람들’로 옮기기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “다윗을 구원하셨다” 혹은 “다윗을 건지셨다”로 옮길 수 있습니다. 이 전투 문맥에서는 “승리를 주셨다”가 뜻을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: placed garrisons
  chosen_korean: 주둔군을 두었습니다
  alternatives_korean:
  - 배치했습니다
  - 두었습니다
  lexicon: HALOT
  rationale: 히브리어 בסיס 동사는 문자적으로는 ‘두다/놓다’이지만, 전쟁 문맥과 ‘다마스쿠스의 아람’이라는 장소표현상 군사 거점이 함축되므로 ‘주둔군을 두다’로 옮겨 원문의 군사적 의미를 드러냈습니다.
- source_word: אֲרָם דַּרְמֶשֶׂק
  english_pob_choice: in Aram of Damascus
  chosen_korean: 다마스쿠스의 아람
  alternatives_korean:
  - 아람 다마스쿠스
  - 다마스쿠스의 아람 사람들
  lexicon: HALOT
  rationale: 히브리어는 지역명 아람과 다마스쿠스를 함께 제시하므로, 전통적 ‘시리아’보다 원문의 민족·지역 명칭을 보존하는 ‘다마스쿠스의 아람’이 더 직접적입니다.
- source_word: עֲבָדִים
  english_pob_choice: servants
  chosen_korean: 종
  alternatives_korean:
  - 신하
  - 노예
  lexicon: HALOT
  rationale: 정치적으로 복속된 상태를 가리키지만, 본문이 강조하는 것은 다윗에게 예속된 신분입니다. POB의 기본값인 ‘종’을 써서 복속 관계를 드러내되, 여기서는 노예제의 구체성을 과도하게 덧씌우지 않았습니다.
- source_word: נֹשְׂאֵי מִנְחָה
  english_pob_choice: bringing tribute
  chosen_korean: 조공을 바쳤습니다
  alternatives_korean:
  - 조공을 가져왔습니다
  - 예물을 바쳤습니다
  lexicon: HALOT
  rationale: מִנְחָה는 단순한 선물보다 상위 군주에게 드리는 공물의 성격이 강하므로, 현대 한국어에서 가장 자연스럽고 정치적 맥락을 살리는 ‘조공을 바치다’로 옮겼습니다.
- source_word: וַיּוֹשַׁע יְהוָה
  english_pob_choice: Yahweh gave victory
  chosen_korean: 야훼께서 … 승리를 주셨습니다
  alternatives_korean:
  - 야훼께서 구원하셨습니다
  - 야훼께서 건지셨습니다
  lexicon: HALOT
  rationale: 전투 문맥에서 יָשַׁע의 의미는 단순한 일반적 ‘구원’보다 군사적 성공을 포함하므로, POB의 해석을 따라 ‘승리를 주다’로 옮겨 전쟁 서술의 힘을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 신명은 POB 원칙에 따라 칭호가 아닌 고유명으로 옮겨 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 전쟁 서술에서의 יָשַׁע 해석
  chosen_reading: ‘구원하다’의 일반 의미를 유지하되, 전쟁 맥락에서는 ‘승리를 주다’로 한국어화했습니다.
  alternative_readings:
  - ‘구원하셨습니다’
  - ‘건지셨습니다’
  rationale: 본문은 군사적 승리의 결과를 설명하므로, 신학적으로 ‘구원’의 넓은 의미를 잃지 않으면서도 독자가 사건의 성격을 즉시 이해하도록 전쟁 관용을 반영했습니다.
  doctrine_reference: Narrative usage of יָשַׁע in battle contexts; POB translation policy for contextual equivalence
- issue: 예속 표현 עֲבָדִים의 강도
  chosen_reading: ‘종’으로 번역해 정치적 복속을 드러내되, 출애굽/속박 본문의 ‘노예’로 과잉 강등하지 않았습니다.
  alternative_readings:
  - ‘노예’
  - ‘신하’
  rationale: 이 구절은 포로·노예제 규정이 아니라 패전국의 조공 관계를 말하므로, 본문의 역사적·정치적 무게를 유지하면서도 의미를 과도하게 확장하지 않는 번역이 필요합니다.
  doctrine_reference: Lexical distinction between political vassalage and chattel slavery
