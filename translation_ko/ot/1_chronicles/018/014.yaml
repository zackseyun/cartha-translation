  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֗י עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
  footnotes:
  - marker: a
    text: Or 'judgment and righteousness.' The Hebrew pair combines legal justice with moral rightness in describing David's rule.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 온 이스라엘의 왕으로 다스렸으며, 그의 모든 백성에게 정의와 의를 행하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판과 의’입니다. 히브리어의 이 짝은 다윗의 통치를 법적 정의와 도덕적 바름을 함께 담아 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 다스렸고
  alternatives_korean:
  - 통치하였고
  - 왕노릇하였고
  lexicon: HALOT
  rationale: מלך의 왕권 행사를 자연스러운 역사 서술로 옮기되, 현대 한국어에서 어색하지 않으면서도 지배의 뜻을 살리기 위해 ‘다스리다’를 택했습니다.
- source_word: עַל כָּל יִשְׂרָאֵל
  english_pob_choice: over all Israel
  chosen_korean: 온 이스라엘을
  alternatives_korean:
  - 모든 이스라엘 위에
  - 이스라엘 전체를
  lexicon: HALOT
  rationale: עַל + מלך의 지배 범위를 한국어에서는 목적어처럼 자연스럽게 풀어 ‘온 이스라엘을’로 옮겼습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 심판과 의
  - 정의와 공의
  lexicon: HALOT
  rationale: 이 왕정 문맥의 זוג합을 한국어에서 구분되게 살리기 위해 מִשְׁפָּט은 ‘정의’, צְדָקָה는 ‘의’로 옮겼습니다. ‘공의’는 전통적이지만 두 항목의 구별이 다소 희미해질 수 있습니다.
- source_word: לְכָל עַמּוֹ
  english_pob_choice: to all his people
  chosen_korean: 그의 모든 백성에게
  alternatives_korean:
  - 그의 모든 백성을 위해
  - 모든 그의 백성에게
  lexicon: HALOT
  rationale: ל의 수혜/대상 의미를 한국어 조사 ‘-에게’로 자연스럽게 반영했고, עַם은 이 문맥에서 정치·언약적 공동체를 가리키므로 ‘백성’이 적절합니다.
theological_decisions:
- issue: מִשְׁפָּט וּצְדָקָה의 번역에서 법정적 정의와 도덕적 의의 긴장 보존
  chosen_reading: ‘정의와 의’로 두 항목을 구분해 다윗의 통치를 법적 공정성과 도덕적 올바름을 함께 지닌 것으로 드러냈습니다.
  alternative_readings:
  - 정의와 공의
  - 심판과 의
  rationale: 원문 זוג합의 풍성함을 보존해야 하므로, 둘을 하나로 평면화하지 않고 한국어에서 구별되는 두 어휘를 사용했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
