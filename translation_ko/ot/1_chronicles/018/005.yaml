  - 도와주러
  lexicon: HALOT
  rationale: עזר의 기본 의미인 ‘돕다’를 자연스러운 목적 표현 ‘도우러’로 옮겼습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐죽였습니다
  alternatives_korean:
  - 쳐서 죽였습니다
