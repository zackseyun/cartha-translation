  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
  footnotes:
  - marker: a
    text: Or, 'the Arameans of Damascus'; traditionally, 'the Syrians of Damascus.'
    reason: lexical_alternative
  - marker: b
    text: The name is spelled 'Hadadezer' here; some parallel passages have the variant 'Hadarezer.'
    reason: alternative_reading
translation:
  language: ko
  text: 다메섹의 아람 사람들[a]이 소바 왕 하닷에셀[b]을 도우러 왔습니다. 다윗은 아람 사람 이만 이천 명을 쳐서 쓰러뜨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다메섹의 아람’; 전통적으로는 ‘다메섹의 시리아 사람들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 여기서 ‘하닷에셀’로 적혀 있으며, 일부 평행 본문에는 변이형 ‘하다르에셀’이 나옵니다.
    reason: alternative_reading
