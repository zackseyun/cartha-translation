base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
  footnotes:
  - marker: a
    text: Or, 'the Arameans of Damascus'; traditionally, 'the Syrians of Damascus.'
    reason: lexical_alternative
  - marker: b
    text: The name is spelled 'Hadadezer' here; some parallel passages have the variant 'Hadarezer.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 다메섹의 아람이 소바 왕 하닷에셀을 도우러 왔습니다[a][b]. 다윗은 아람 사람 이만이천 명을 쳐죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다메섹의 아람 사람들’; 전통적으로는 ‘다메섹의 시리아 사람들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 여기서 ‘하닷에셀’로 적혀 있으며, 일부 평행 본문에는 변이형 ‘하다르에셀’이 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  english_pob_choice: Aram of Damascus
  chosen_korean: 다메섹의 아람
  alternatives_korean:
  - 다메섹의 아람 사람들
  - 다메섹의 시리아
  lexicon: HALOT
  rationale: אֲרַם은 ‘아람’으로 보존하고, 지명 קשר를 ‘다메섹의’로 풀어 원문의 민족-지역적 의미를 살렸습니다.
- source_word: לַעְזוֹר
  english_pob_choice: to help
  chosen_korean: 도우러
  alternatives_korean:
  - 돕기 위해
  - 도와주러
  lexicon: HALOT
  rationale: עזר의 기본 의미인 ‘돕다’를 자연스러운 목적 표현 ‘도우러’로 옮겼습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐죽였습니다
  alternatives_korean:
  - 쳐서 죽였습니다
  - 무찔렀습니다
  - 쳤습니다
  lexicon: HALOT
  rationale: 전투 맥락의 נכה는 단순한 ‘쳤다’보다 실제 전사 발생을 드러내는 표현이 적절하며, 이어지는 사망 인원과도 부합합니다.
- source_word: בַּאֲרָם
  english_pob_choice: of Aram
  chosen_korean: 아람 사람
  alternatives_korean:
  - 아람의
  - 아람 중에서
  lexicon: HALOT
  rationale: ‘아람 사람 이만이천 명’은 한국어에서 자연스럽고, 집합명사적 의미를 분명히 전달합니다.
theological_decisions:
- issue: 전쟁 서술의 폭력성 정도
  chosen_reading: וַיַּךְ를 완곡하게 낮추지 않고 ‘쳐죽였습니다’로 옮겼습니다.
  alternative_readings:
  - 무찔렀습니다
  - 패배시켰습니다
  rationale: 본문은 단순한 패전이 아니라 대규모 사상자를 분명히 말하므로, 전투의 실제 치명성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 서술의 사실성과 원문 강도 보존 원칙
