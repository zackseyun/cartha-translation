    rationale: 원문의 לוֹ와 -וֹ는 다윗을 가리키지만, 한국어 문장에서는 ‘그의’가 하도람 또는 도우를 가리킬 수 있습니다. ‘다윗의 안부’로 명시하는 것이 자연스럽고 충실합니다.
