source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
  footnotes:
  - marker: a
    text: Or 'to inquire of him concerning peace.' The Hebrew idiom uses 'peace' in the sense of well-being or welfare.
    reason: lexical_alternative
  - marker: b
    text: Or 'and to congratulate him.' The verb literally means 'to bless him,' here in a diplomatic setting after victory.
    reason: lexical_alternative
  - marker: c
    text: Literally 'for Hadadezer was a man of wars with Tou,' an idiom meaning that Hadadezer had been at war with Tou.
    reason: lexical_alternative
  - marker: d
    text: The Hebrew text ends with 'and all the articles of gold and silver and bronze'; English supplies 'he sent' from the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그는 자기 아들 하도람을 다윗 왕에게 보내어, 그의 평안을 묻고 그를 축복하게 하였습니다. 이는 다윗이 하닷에셀이었던 그를 쳐서 무찔렀기 때문입니다. 하닷에셀은 도우와 늘 전쟁을 벌이던 사람이었습니다. 또 그는 금과 은과 놋으로 된 온갖 기물도 보냈습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''평안을 묻고''는 히브리어 관용구로, 문자적으로는 ''평화에 대하여 묻다''의 뜻입니다.'
    reason: lexical_alternative
  - marker: b
    text: '''축복하게''는 이 문맥에서 ''축하하다''의 뉘앙스도 포함할 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: '''늘 전쟁을 벌이던 사람''은 히브리어의 ''전쟁의 사람''이라는 관용적 표현을 풀어 옮긴 것입니다.'
    reason: lexical_alternative
  - marker: d
    text: 마지막 문구는 문맥상 사절단이 함께 가져온 품목을 가리키며, 본문에는 '보냈다'가 생략되어 있습니다.
    reason: source_note
lexical_decisions:
- source_word: לְשָׁלוֹם
  english_pob_choice: to ask about his welfare
  chosen_korean: 그의 평안을 묻고
  alternatives_korean:
  - 그의 안부를 묻고
  - 그의 평안을 알아보고
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 단순한 인사가 아니라 상대의 평안/안녕을 확인하는 것입니다. '평안'은 שָׁלוֹם의 의미를 살리면서도 한국어에서 자연스럽습니다.
- source_word: וּלְבָרֲכוֹ
  english_pob_choice: and to bless him
  chosen_korean: 그를 축복하게 하였습니다
  alternatives_korean:
  - 그를 축복하고
  - 그에게 축복을 전하게 하였습니다
  lexicon: HALOT
  rationale: 문자적으로는 '축복하다'이지만, 외교적 상황에서는 축하의 뉘앙스가 겹칩니다. 그래도 원문 동사를 살려 '축복하게'로 옮겼습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 쳐서 무찔렀기 때문입니다
  alternatives_korean:
  - 쳐서 쓰러뜨렸기 때문입니다
  - 쳐서 패배시켰기 때문입니다
  lexicon: HALOT
  rationale: 전투 결과를 나타내는 동사로서, 죽음을 암시하지 않으면서도 군사적 패배를 드러내는 표현이 필요합니다. '무찔렀다'는 이를 자연스럽게 전달합니다.
- source_word: אִישׁ מִלְחֲמוֹת
  english_pob_choice: had been at war
  chosen_korean: 늘 전쟁을 벌이던 사람이었습니다
  alternatives_korean:
  - 전쟁을 일삼던 사람이었습니다
  - 전쟁의 사람이었습니다
  lexicon: HALOT
  rationale: 직역하면 '전쟁의 사람'이지만 한국어에서는 비자연스럽습니다. 영어 POB가 취한 관용적 의미를 따라, 하닷에셀과 도우 사이에 지속적 적대 관계가 있었음을 분명하게 했습니다.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  english_pob_choice: all kinds of articles of gold and silver and bronze
  chosen_korean: 금과 은과 놋으로 된 온갖 기물
  alternatives_korean:
  - 금과 은과 놋으로 된 온갖 물건
  - 금·은·놋으로 된 모든 기물
  lexicon: HALOT
  rationale: כְּלֵי는 기물/도구/그릇 등 문맥상 'articles'에 해당하는 넓은 범위의 물품을 가리킵니다. 고대 금속 목록의 뉘앙스를 살려 '놋'을 유지했습니다.
theological_decisions:
- issue: ידיעה와 축복의 외교적 의미
  chosen_reading: 여기서 '평안을 묻고'와 '축복하게'는 왕실 사절의 외교적 인사와 축하를 가리키며, 종교적 의식으로 제한하지 않았습니다.
  alternative_readings:
  - 단순한 종교적 축복으로 읽기
  - 평화 협정 요청으로만 읽기
  rationale: 문맥은 전쟁 승리 후 파견된 사절이므로, שָׁלוֹם과 ברך는 외교적 예우와 축하의 의미가 함께 있습니다. 원문이 허용하는 범위를 넘지 않도록 표현했습니다.
  doctrine_reference: 고대 근동 왕실 외교 관습과 본문 문맥
- issue: נכה의 강도
  chosen_reading: '''쳐서 무찔렀다''로 번역해 패배를 분명히 하되, 본문이 직접 말하지 않는 죽음은 덧붙이지 않았습니다.'
  alternative_readings:
  - 죽였다
  - 완전히 멸했다
  rationale: 히브리어 동사는 군사적 타격을 나타내지만 반드시 사망을 뜻하지는 않습니다. 본문의 정보량을 넘지 않도록 절제했습니다.
  doctrine_reference: 본문의 서술 범위 존중
