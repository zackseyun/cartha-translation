source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע עַל הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵי דָוִ֥יד הָ/רִאשֹׁנִ֖ים לְ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
  footnotes:
  - marker: a
    text: Or 'Cherethites,' the traditional English form of the group name.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the first ones' or 'the foremost ones'; likely a title for leading court officials.
    reason: lexical_alternative
  - marker: c
    text: Literally 'to/at the hand of the king,' an idiom for close attendance or service.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야다의 아들 브나야는 케렛 사람들과 펠렛 사람들을 맡고 있었으며,[a] 다윗의 아들들은 왕의 곁에서[c] 으뜸가는 이들이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘케렛 사람들’은 히브리어 집단명입니다. 전통적인 영어 표기는 ‘Cherethites’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘첫 사람들’ 또는 ‘앞선 사람들’입니다. 여기서는 궁정의 수석 관리들을 가리킬 가능성이 높습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘왕의 손에’입니다. 왕 가까이에서 섬기거나 보좌함을 나타내는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַכְּרֵתִי וְהַפְּלֵתִי
  english_pob_choice: was over the Kerethites and the Pelethites
  chosen_korean: 케렛 사람들과 펠렛 사람들을 맡았고
  alternatives_korean:
  - 케렛 사람들과 펠렛 사람들 위에 있었고
  - 케렛 사람들과 펠렛 사람들의 감독이었고
  lexicon: HALOT
  rationale: עַל은 여기서 지배·책임의 관계를 나타내므로 '맡다'로 옮겨 행정적/군사적 감독을 자연스럽게 살렸습니다. 고유 집단명은 음역해 원문의 집단성을 보존했습니다.
- source_word: הָרִאשֹׁנִים
  english_pob_choice: the chief officials
  chosen_korean: 첫째 자리에 있는 관리들
  alternatives_korean:
  - 수석 관리들
  - 으뜸가는 자들
  - 첫째 되는 자들
  lexicon: HALOT
  rationale: 직역하면 '처음의/앞선 사람들'이지만, 궁정 문맥에서는 서열상 우두머리들을 가리키므로 '첫째 자리에 있는 관리들'로 옮겨 계층적 의미를 드러냈습니다.
- source_word: לְיַד הַמֶּלֶךְ
  english_pob_choice: at the king’s side
  chosen_korean: 왕의 곁에서
  alternatives_korean:
  - 왕의 손에
  - 왕의 옆에서
  - 왕을 가까이 모시며
  lexicon: HALOT
  rationale: 관용적으로 '왕의 손에/곁에'라는 가까운 시종의 뜻을 가지므로, 한국어에서는 '왕의 곁에서'가 그 친밀한 배치를 가장 자연스럽게 살립니다.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 브네야후는 여호야다의 아들로서
  alternatives_korean:
  - 브나야는 여호야다의 아들로서
  - 브네야후, 여호야다의 아들
  lexicon: HALOT
  rationale: 인명은 현대 음역을 따르되, 히브리어 בשם בניהו를 반영해 '브네야후'로 옮겼습니다. 부친 관계는 한국어 서술에 맞게 '여호야다의 아들로서'로 풀었습니다.
theological_decisions:
- issue: 궁정 직무를 지시하는 הָרִאשֹׁנִים의 의미
  chosen_reading: 다윗의 아들들을 단순한 왕자들이 아니라 왕실의 서열상 우두머리급 관리로 이해했습니다.
  alternative_readings:
  - 다윗의 아들들 자체를 '첫째들'로 보는 읽기
  - 단순히 '앞선 자들'로만 보는 읽기
  rationale: 문맥상 왕의 곁에서 봉사하는 궁정 직무 목록이므로, '첫째 자리에 있는 관리들'로 옮겨 서열과 직무를 함께 드러내는 것이 본문 의도에 가장 가깝습니다.
  doctrine_reference: 왕정기 궁정 행정과 본문 문맥 해석
