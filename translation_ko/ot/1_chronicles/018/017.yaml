revisions:
- from: 그리고 브네야후는 여호야다의 아들로서 케렛 사람들과 펠렛 사람들을 맡았고, 다윗의 아들들은 왕의 곁에서 첫째 자리에 있는 관리들이었습니다.[a][b][c]
  to: 여호야다의 아들 브나야는 케렛 사람들과 펠렛 사람들을 맡고 있었으며,[a] 다윗의 아들들은 왕의 곁에서[c] 으뜸가는 이들이었습니다.[b]
  rationale: 본문은 브나야의 감독 책임, 다윗의 아들들의 왕실 내 우선적 지위, 그리고 왕에게 가까이 봉사하는 관계를 보존합니다. הָרִאשֹׁנִים에 대한 ‘궁정 관리’ 해석은 가능성이 높은 해석으로 각주에 두어, 본문이 지닌 어휘적 여지를 유지했습니다. 각주 표지도 각각의 설명 대상 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:37Z'
