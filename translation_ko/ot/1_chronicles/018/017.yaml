  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 הָרִאשֹׁנִים는 문자적으로 ‘첫째 자리에 있는 관리들’이라기보다 ‘앞선 이들/으뜸가는 이들’이며, 궁정 관리라는 해석은 가능하지만 본문 자체보다 한 단계 구체적입니다. 이를 본문에서는 덜 단정적으로 옮기고 각주에서 설명하는 편이 적절합니다.
  naturalness: ‘첫째 자리에 있는 관리들’은 현대 한국어에서 다소 부자연스럽고 직역투입니다. ‘으뜸가는 이들이었습니다’가 자연스럽고 서열상의 의미를 보존합니다. 인명은 통용 성경 표기인 ‘브나야’를 사용하는 것이 독자에게 더 익숙합니다.
  terminology: ‘케렛 사람들’과 ‘펠렛 사람들’은 집단명을 음역한 것으로 허용됩니다. ‘브네야후’보다 통용 표기인 ‘브나야’를 사용했습니다. לְיַד הַמֶּלֶךְ는 ‘왕의 곁에서’로 적절하며, 그 관용적 배경은 각주에서 설명할 수 있습니다.
