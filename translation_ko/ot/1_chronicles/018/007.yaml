  source_fidelity: 히브리어는 다윗이 하닷에셀의 종들에게 있던 금 방패들을 취하고 예루살렘으로 가져간 두 동작을 구별합니다. 초안은 두 동사를 모두 ‘가져오다’로 옮겨 첫 동작과 둘째 동작의 구별이 사라지고 표현이 중복됩니다. ‘종들 위에’는 원문에 가깝지만 한국어로는 매우 부자연스러우므로, 군사 장비 문맥에서 자연스러운 ‘종들이 지니고 있던’으로 옮기는 것이 안전합니다.
  naturalness: ‘가져와서 예루살렘으로 가져왔습니다’는 같은 동사의 불필요한 반복이며, 앞의 ‘가져와서’는 기준점도 불명확합니다. ‘취하여 예루살렘으로 가져왔습니다’는 현대 한국어의 격식 있는 성경 문체로 자연스럽고 두 히브리어 동사를 드러냅니다.
  terminology: ‘하닷에셀’, ‘종들’, ‘금 방패들’, ‘예루살렘’은 유지할 수 있습니다. 이름 변이 주석은 하다레셀이라는 변이를 명확히 제시하고, 금 방패 주석은 ‘입힘인지’ 같은 불완전한 명사형을 피해야 합니다.
