  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֗יד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ עַ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
  footnotes:
  - marker: a
    text: Or 'golden shields'; the Hebrew may refer to shields overlaid with gold.
    reason: lexical_alternative
  - marker: b
    text: '''Servants'' here likely means Hadadezer''s royal retainers or military attendants, not necessarily household slaves in the narrow modern sense.'
    reason: cultural_note
  - marker: c
    text: Some textual traditions and the parallel in 2 Samuel spell the name 'Hadarezer.'
    reason: textual_variant
translation:
  language: ko
  text: 다윗은 하닷에셀의 종들 위에 있던 금 방패들을 가져와서 예루살렘으로 가져왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금으로 입힌 방패들’일 수 있습니다. 히브리어는 금이 재질인지 입힘인지 다소 열려 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘종들’은 반드시 현대적 의미의 노예만을 가리키기보다, 하닷에셀의 궁정 수행원이나 군사 시종을 포함할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 이름은 마소라 본문을 따라 ‘하닷에셀’로 옮겼습니다. 다른 전승과 사무엘하 평행 본문에는 ‘하닷에셀/하다레셀’의 철자 변이가 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 취했습니다
  - 빼앗았습니다
  lexicon: HALOT
  rationale: 문맥상 전리품을 취한 의미이지만, 한국어에서는 첫 동작을 자연스럽게 드러내는 ‘가져왔습니다’가 간결하고 과도한 해석을 피합니다.
- source_word: שִׁלְטֵי הַזָּהָב
  english_pob_choice: the shields of gold
  chosen_korean: 금 방패들
  alternatives_korean:
  - 황금 방패들
  - 금으로 입힌 방패들
  lexicon: HALOT
  rationale: 히브리어의 소유/재질 구문을 자연스럽게 옮기되, POB의 ‘shields of gold’ 취지를 반영해 재질 중심으로 렌더링했습니다.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  english_pob_choice: the servants of Hadadezer
  chosen_korean: 하닷에셀의 종들
  alternatives_korean:
  - 하닷에셀의 신하들
  - 하닷에셀의 시종들
  lexicon: HALOT
  rationale: עבדים의 기본값인 ‘종’을 유지해 원문 표현을 투명하게 살렸습니다. 왕실·군사 맥락의 완화는 본문이 아니라 주석에서 다루는 편이 더 source-grounded합니다.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  english_pob_choice: and brought them to Jerusalem
  chosen_korean: 예루살렘으로 가져왔습니다
  alternatives_korean:
  - 예루살렘으로 데려왔습니다
  - 예루살렘으로 운반했습니다
  lexicon: HALOT
  rationale: ביא의 사역형을 한국어 ‘가져오다’로 옮겨 목적지 이동을 자연스럽게 표현했습니다. 대상이 방패들이므로 ‘데려오다’보다 ‘가져오다’가 더 정확합니다.
theological_decisions:
- issue: עבדים의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘종들’로 직역해 원문이 가진 사회적 위계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘신하들’로 완화함
  - ‘부하들’로 일반화함
  rationale: 본문은 단순한 일반 수행원보다 하닷에셀 소속의 종속적 인물을 가리키는 표현을 유지합니다. 현대 감수성보다 원문 투명성을 우선했습니다.
  doctrine_reference: 본문 충실성 원칙
