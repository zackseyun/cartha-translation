revisions:
- from: 다윗은 하닷에셀의 종들 위에 있던 금 방패들을 가져와서 예루살렘으로 가져왔습니다.[a][b][c]
  to: 다윗은 하닷에셀의 종들이 지니고 있던 금 방패들을 취하여 예루살렘으로 가져왔습니다.[a][b][c]
  rationale: 첫 동사 לקח는 ‘취하여’로, 뒤의 사역형 בוא는 ‘가져왔습니다’로 구별하여 원문의 동작 순서와 의미를 보존했습니다. ‘종들이 지니고 있던’은 장비가 사람들 위에/에게 있었다는 히브리어 표현을 군사 문맥에 맞게 자연스러운 한국어로 옮긴 것입니다. 각주들은 영어 POB 감사 기록의 대안, 문화적 설명, 본문 변이 정보를 유지하면서 문장을 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:36Z'
