  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/טִּבְחַ֤ת וּ/מִ/כּוּן֙ עָרֵ֣י הֲדַדְעֶ֔זֶר לָקַ֥ח דָּוִ֛יד נְחֹ֖שֶׁת רַבָּ֣ה מְאֹ֑ד בָּ֣/הּ עָשָׂ֣ה שְׁלֹמֹ֗ה אֶת יָ֤ם הַ/נְּחֹ֨שֶׁת֙ וְ/אֶת הָֽ/עַמּוּדִ֔ים וְ/אֵ֖ת כְּלֵ֥י הַ/נְּחֹֽשֶׁת׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: ko
  text: 또 티브핫과 숙, 곧 하닷에셀의 여러 성읍에서 다윗은 매우 많은 청동을 가져왔습니다. 그것으로 솔로몬이 청동 바다와 기둥들과 청동 기구들을 만들었습니다.
  philosophy: formal
lexical_decisions:
- source_word: נְחֹשֶׁת / bronze
  english_pob_choice: bronze
  chosen_korean: 청동
  alternatives_korean:
  - 놋
  - 구리
  lexicon: 청동
  rationale: POB의 'bronze'를 한국어에서는 현대 문어에서 가장 자연스럽고 기술적인 '청동'으로 옮겼습니다. '놋'은 전통적이지만 재료 감각이 덜 분명하고, '구리'는 여기서의 합금 뉘앙스를 약화시킵니다.
- source_word: וּמִ/טִּבְחַת ... וּ/מִ/כּוּן
  english_pob_choice: from Tibhath and from Cun
  chosen_korean: 티브핫과 숙
  alternatives_korean:
  - 디브핫과 군
  - 티브핫과 군
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 음역으로 처리하되, 널리 알려진 표기와 본문 자음 형태를 함께 고려했습니다. '숙'은 본문의 כּוּן을 한국어에서 간결하게 옮긴 형태입니다.
- source_word: בָּהּ / with it
  english_pob_choice: with it
  chosen_korean: 그것으로
  alternatives_korean:
  - 그 청동으로
  - 그것으로써
  lexicon: 대명사 참조
  rationale: 히브리어 הנם/? 대명사 지시를 문맥상 청동을 가리키는 것으로 받아 '그것으로'라고 옮겼습니다. POB의 'with it'을 기계적으로 반복하기보다 한국어에서 도구·재료의 의미를 자연스럽게 드러냅니다.
- source_word: יָם הַנְּחֹשֶׁת
  english_pob_choice: the bronze sea
  chosen_korean: 청동 바다
  alternatives_korean:
  - 놋바다
  - 놋 물통
  lexicon: 전문용어
  rationale: 성막/성전 기물의 관용적 명칭을 직역해 '청동 바다'로 유지했습니다. 전통적 '놋바다'도 가능하지만, 본문의 재료 용어와의 일관성을 위해 '청동'을 택했습니다.
theological_decisions:
- issue: שלמה가 가져온 청동의 용도와 'with it'의 연결
  chosen_reading: 솔로몬은 그 청동으로 성전 기물을 만들었습니다.
  alternative_readings:
  - 솔로몬은 그것을 가지고 성전 기물들을 만들었습니다.
  - 그 청동으로 솔로몬이 만들었습니다.
  rationale: 히브리어 בָּהּ는 앞의 '많은 청동'을 가리키며, 목적은 솔로몬의 제작 행위를 설명합니다. 한국어에서는 도구/재료 관계를 분명히 하되, 원문의 인과와 지시 관계를 유지했습니다.
  doctrine_reference: 본문-문맥 일치, 성전 기구 서술
