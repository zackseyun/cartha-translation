  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֕ע תֹּ֖עוּ מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔יד אֶת כָּל חֵ֖יל הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
  footnotes:
  - marker: a
    text: Hebrew 'Tou'; the parallel account in 2 Samuel 8:9 has 'Toi.'
    reason: alternative_reading
translation:
  language: ko
  text: 하맛의 왕 투가 다윗이 소바 왕 하닷에셀의 모든 군대를 쳐부쉈다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘투’로 읽지만, 사무엘하 8:9의 평행 본문에는 ‘도이’가 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: When ... heard
  chosen_korean: 소식을 들었습니다
  alternatives_korean:
  - 들었습니다
  - 듣고는
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 뒤이어 올 내용을 준비하는 '들었다'의 시간적 기능을 한국어로 매끄럽게 옮겼습니다.
- source_word: תֹּעוּ
  english_pob_choice: Tou
  chosen_korean: 투
  alternatives_korean:
  - 토이
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 원칙이므로, 역대기 형태인 Tou를 표준 한국어 표기인 '투'로 옮겼습니다.
- source_word: הִכָּה
  english_pob_choice: had struck down
  chosen_korean: 쳐부쉈다는
  alternatives_korean:
  - 쳤다는
  - 무찔렀다는
  - 격파했다는
  lexicon: HALOT
  rationale: 군사적 문맥의 נכה는 단순한 '쳤다'보다 패배의 결과를 더 분명히 드러내므로, 원문의 강한 타격감을 살리는 표현을 택했습니다.
- source_word: חֵיל
  english_pob_choice: army
  chosen_korean: 군대
  alternatives_korean:
  - 군사들
  - 군력
  - 군세
  lexicon: HALOT
  rationale: 이 문맥에서는 추상적 힘보다 실제 전투 부대를 가리키므로 '군대'가 가장 분명합니다.
