translation:
  language: ko
  text: 하맛의 왕 투가 다윗이 소바 왕 하닷에셀의 모든 군대를 쳐부쉈다는 소식을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘투’로 읽지만, 사무엘하 8:9의 평행 본문에는 ‘도이’가 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: When ... heard
  chosen_korean: 소식을 들었습니다
  alternatives_korean:
  - 들었습니다
  - 듣고는
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 뒤이어 올 내용을 준비하는 '들었다'의 시간적 기능을 한국어로 매끄럽게 옮겼습니다.
- source_word: תֹּעוּ
