  rationale: 군사적 문맥의 נכה는 단순한 '쳤다'보다 패배의 결과를 더 분명히 드러내므로, 원문의 강한 타격감을 살리는 표현을 택했습니다.
- source_word: חֵיל
  english_pob_choice: army
