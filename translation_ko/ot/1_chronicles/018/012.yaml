translation:
  language: ko
  text: 그리고 스루야의 아들 아비새가 소금 골짜기에서 에돔 사람 만팔천 명을 쳐 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְשַׁ֣י
  english_pob_choice: And Abishai
  chosen_korean: 그리고 아비새가
  alternatives_korean:
  - 아비새가
  - 또 아비새가
  lexicon: HALOT
  rationale: 문두의 ו는 서술의 연결을 살려 ‘그리고’로 옮기고, 인명은 관용적인 한국어 음역 ‘아비새’를 유지했습니다.
- source_word: בֶּן צְרוּיָ֗ה
  english_pob_choice: son of Zeruiah
  chosen_korean: 스루야의 아들
  alternatives_korean:
  - 스루야의 아들인
  - 스루야의 아들 아비새가
  lexicon: HALOT
  rationale: 직계 혈연 표지를 자연스러운 한국어 소유 표현으로 옮겨 인물 식별 기능을 보존했습니다.
- source_word: הִכָּ֤ה
  english_pob_choice: struck down
  chosen_korean: 쳐 죽였습니다
  alternatives_korean:
  - 쳐서 무찔렀습니다
  - 쳐 죽였습니다
  - 쳐서 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: 전투 문맥과 뒤따르는 수효를 반영해 단순한 ‘치다’보다 결과를 분명히 드러내는 표현을 택하되, 본문의 폭력성을 약화하지 않았습니다.
- source_word: אֶת אֱדוֹם
  english_pob_choice: eighteen thousand Edomites
  chosen_korean: 에돔 사람 만팔천 명을
  alternatives_korean:
  - 에돔 만팔천 명을
  - 에돔 사람들 만팔천 명을
  lexicon: HALOT
  rationale: 히브리어의 מקום/민족명 ‘에돔’을 전투 피해 대상인 사람들로 이해해 ‘에돔 사람’으로 명시함으로써 영어 POB의 의미 결정을 반영했습니다.
- source_word: בְּ/גֵיא הַמֶּלַח
  english_pob_choice: in the Valley of Salt
  chosen_korean: 소금 골짜기에서
  alternatives_korean:
  - 소금 골짜기 안에서
  - 소금 골짜기에서
  lexicon: HALOT
  rationale: 지명적 표현을 직역하되, 한국어에서 자연스러운 처소 조사 ‘에서’로 전투 장소를 나타냈습니다.
