  - 주님
  lexicon: יהוה
  rationale: 히브리어 원문 고유명사에 맞추어 프로젝트 기본값인 "야훼"를 사용했습니다.
- source_word: הָלַךְ
  english_pob_choice: went
  chosen_korean: 가는 곳마다
  alternatives_korean:
  - 가는 대로
