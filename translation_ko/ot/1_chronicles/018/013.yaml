  text: He placed garrisons in Edom, and all Edom became slaves to David. And the LORD gave David victory wherever he went.
translation:
  language: ko
  text: 그는 에돔에 수비대를 두었고, 온 에돔은 다윗에게 종이 되었습니다. 야훼께서 다윗이 가는 곳마다 그를 구원하셨습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: '"수비대"는 문맥상 군사 주둔을 드러내는 번역입니다.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어 עֲבָדִים은 강한 예속을 뜻하므로, 영어 POB의 "slaves"를 반영해 "종"으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְצִיבִים
  english_pob_choice: garrisons
  chosen_korean: 수비대
  alternatives_korean:
  - 주둔군
  - 주둔대
  lexicon: 불특정 군사 주둔을 가리키는 일반 명사
  rationale: 문맥상 에돔에 배치된 군사 주둔을 자연스럽게 드러내면서도 과도하게 해석하지 않는 표준어 표현으로 옮겼습니다.
- source_word: עֲבָדִים
