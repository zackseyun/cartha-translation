  lexicon: הלך
  rationale: 단순 이동이 아니라 다윗의 모든 행로와 상황 전반을 포괄하는 관용적 의미를 살리기 위해 이렇게 옮겼습니다.
theological_decisions:
- issue: יְהוָה가 다윗에게 주시는 결과를 어떻게 표현할지
  chosen_reading: '"구원하셨습니다"로 옮겨, 단순한 성공이 아니라 야훼의 적극적 구원 행위를 드러냈습니다.'
  alternative_readings:
  - '"이기게 하셨습니다"'
  - '"승리를 주셨습니다"'
  rationale: 히브리어 וַיּוֹשַׁע는 문자적으로 "구원하다"이며, 전투 맥락에서 그 결과가 승리로 나타나지만 원어의 더 넓은 구원 행위를 보존하는 것이 좋습니다.
  doctrine_reference: 구원/승리의 이중 의미 보존
