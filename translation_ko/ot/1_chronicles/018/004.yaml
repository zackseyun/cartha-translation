base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
  footnotes:
  - marker: a
    text: Hebrew 'all the chariotry/chariots'; because the verb means to hamstring, the phrase is understood metonymically of the horses belonging to the chariot force.
    reason: lexical_alternative
  - marker: b
    text: 2 Samuel 8:4 has '1,700 horsemen' rather than '7,000 horsemen.' This is a parallel-passage numerical difference in the textual tradition.
    reason: textual_variant
translation:
  language: ko
  text: 다윗은 그에게서 병거 1,000대, 기병 7,000명[b], 보병 20,000명을 사로잡았습니다. 다윗은 모든 병거 말들[a]의 뒷다리 힘줄을 끊어 못 쓰게 하였으나, 그 가운데 100대의 병거에 쓸 만큼은 남겨 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘모든 병거’입니다. 그러나 동사가 말의 힘줄을 끊는 행위를 뜻하므로, 여기서는 병거 부대에 속한 말들을 가리키는 메토님으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 사무엘하 8:4에는 ‘기병 1,700명’이라고 되어 있으며, 여기의 ‘7,000명’과 차이가 있습니다. 이는 병행 본문의 수치가 다른 본문 전승상의 차이입니다.
    reason: textual_variant
