  rationale: 원문의 군사 용어와 수치를 유지하면서, 말의 힘줄을 끊는 동작을 정확히 번역했습니다. 마지막 절은 앞선 ‘병거’의 메토님을 따라 병거 100대에 쓸 말을 남긴 의미를 드러냈습니다. 메토님 주석과 병행구절의 수치 차이 주석을 각각 해당 본문 요소에 연결했습니다.
