revisions:
- from: 다윗은 그에게서 병거 1,000대, 기병 7,000명, 보병 20,000명을 사로잡았습니다. 그리고 다윗은 모든 병거의 말들을 불구로 만들었지만, 그중 100병거에 해당하는 만큼은 남겨 두었습니다.[a][b]
