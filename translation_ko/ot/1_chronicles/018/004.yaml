  text: וַ/יִּלְכֹּד֩ דָּוִ֨יד מִמֶּ֜/נּוּ אֶ֣לֶף רֶ֗כֶב וְ/שִׁבְעַ֤ת אֲלָפִים֙ פָּֽרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִיד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
  footnotes:
  - marker: a
    text: Hebrew 'all the chariotry/chariots'; because the verb means to hamstring, the phrase is understood metonymically of the horses belonging to the chariot force.
    reason: lexical_alternative
  - marker: b
    text: 2 Samuel 8:4 has '1,700 horsemen' rather than '7,000 horsemen.' This is a parallel-passage numerical difference in the textual tradition.
    reason: textual_variant
translation:
  language: ko
  text: 다윗은 그에게서 병거 1,000대, 기병 7,000명, 보병 20,000명을 사로잡았습니다. 그리고 다윗은 모든 병거의 말들을 불구로 만들었지만, 그중 100병거에 해당하는 만큼은 남겨 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘모든 병거’는 뒤의 ‘말들을 불구로 만들다’와 함께 읽을 때 병거 부대의 말들을 가리키는 메토님으로 이해됩니다.
    reason: source_note
  - marker: b
    text: 마지막 절은 히브리어 직역보다 자연스러운 한국어를 위해 ‘100병거에 해당하는 만큼’으로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 사로잡았습니다
  alternatives_korean:
  - 붙잡았습니다
  - 탈취했습니다
  lexicon: HALOT
  rationale: 전쟁 맥락에서 לָכַד는 적을 전리품처럼 ‘사로잡다’는 뜻이므로, 현대 한국어에서는 ‘사로잡았습니다’가 가장 자연스럽고 의미도 분명합니다.
- source_word: אֶלֶף רֶכֶב
  english_pob_choice: 1,000 chariots
  chosen_korean: 병거 1,000대
  alternatives_korean:
  - 병거 1,000개
  - 전차 1,000대
  lexicon: HALOT
  rationale: רֶכֶב은 수사와 함께 셀 수 있는 전투 병거로 읽는 것이 자연스러워 ‘병거 1,000대’로 옮겼습니다.
- source_word: פָּרָשִׁים
  english_pob_choice: horsemen
  chosen_korean: 기병 7,000명
  alternatives_korean:
  - 말탄 병사 7,000명
  - 기마병 7,000명
  lexicon: HALOT
  rationale: 말을 탄 전투원을 가리키므로 군사 용어로 통용되는 ‘기병’이 적절하며, 인원수와도 잘 맞습니다.
- source_word: אִישׁ רַגְלִי
  english_pob_choice: foot soldiers
  chosen_korean: 보병 20,000명
  alternatives_korean:
  - 걸어서 싸우는 군사 20,000명
  - 보졸 20,000명
  lexicon: HALOT
  rationale: 직역하면 ‘발의 사람’이지만, 현대 군사 한국어에서는 ‘보병’이 가장 정확하고 읽기 쉽습니다.
- source_word: וַיְעַקֵּר
  english_pob_choice: hamstrung
  chosen_korean: 불구로 만들었지만
  alternatives_korean:
  - 햄스트링을 끊었지만
  - 절름발이로 만들었지만
  lexicon: HALOT
  rationale: 말의 힘줄을 끊어 전투에 쓰지 못하게 하는 행위이므로, 한국어에서는 과도하게 생소한 전문어보다 의미를 드러내는 ‘불구로 만들었습니다’가 적절합니다.
- source_word: אֶת כָּל הָרֶכֶב
  english_pob_choice: all the chariot horses
  chosen_korean: 모든 병거의 말들
  alternatives_korean:
  - 모든 병거를
  - 모든 병거 병력
  lexicon: HALOT
  rationale: 문자적으로는 ‘병거’를 말하지만, 바로 앞의 ‘말들을 불구로 만들다’와 함께 보아 병거 부대에 딸린 말들을 가리키는 것으로 이해하는 것이 소스에 충실합니다.
theological_decisions:
- issue: 전투 전리품을 전부 파괴하지 않고 일부를 남겨 두는 마지막 절
  chosen_reading: 다윗은 병거 전력을 무력화하되, 100병거에 해당하는 만큼은 남겨 두었습니다.
  alternative_readings:
  - 단순히 100개의 병거를 남겨 두었습니다
  - 100병거분의 말들을 남겨 두었습니다
  rationale: 히브리어의 마지막 절은 이전 문맥의 메토님(‘병거’가 병거 말들을 가리킴)을 이어 받아 남겨 둔 양을 말하므로, ‘100병거에 해당하는 만큼’이라고 풀어 소스의 긴장과 의미를 함께 살렸습니다.
  doctrine_reference: 본문 해석상의 메토님 및 전쟁 서술의 문맥
