  rationale: 히브리어의 마지막 절은 이전 문맥의 메토님(‘병거’가 병거 말들을 가리킴)을 이어 받아 남겨 둔 양을 말하므로, ‘100병거에 해당하는 만큼’이라고 풀어 소스의 긴장과 의미를 함께 살렸습니다.
