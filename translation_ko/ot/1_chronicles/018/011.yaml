base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
  footnotes:
  - marker: a
    text: Or 'them'; the pronoun refers to the bronze articles mentioned in the previous verse.
    reason: cross_reference
  - marker: b
    text: Or 'taken' or 'borne away'; the Hebrew verb can mean 'lifted/carried,' here in the sense of taking spoil or tribute from conquered nations.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Ammon,' that is, the Ammonites.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 왕은 에돔과 모압과 암몬 사람들[c]과 블레셋 사람들과 아말렉, 곧 모든 나라에서 거두어 온[b] 은과 금과 함께 이것들도[a] 야훼께 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들도’. 이 대명사는 바로 앞 절에 나온 청동 기구들을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘가져온’ 또는 ‘옮겨 온’. 히브리어 동사는 ‘들어 올리다/나르다’라는 뜻이 있으며, 여기서는 정복한 나라들로부터 전리품이나 조공을 취한 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘암몬의 자손들’이며, 곧 암몬 사람들을 뜻합니다.
    reason: lexical_alternative
