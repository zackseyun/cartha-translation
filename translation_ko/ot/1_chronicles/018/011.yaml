source:
  edition: WLC
  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
  footnotes:
  - marker: a
    text: Or 'them'; the pronoun refers to the bronze articles mentioned in the previous verse.
    reason: cross_reference
  - marker: b
    text: Or 'taken' or 'borne away'; the Hebrew verb can mean 'lifted/carried,' here in the sense of taking spoil or tribute from conquered nations.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Ammon,' that is, the Ammonites.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗 왕은 이들도 야훼께, 곧 모든 나라에서—에돔과 모압과 암몬 자손과 블레셋 사람들과 아말렉에게서—그가 거둬 온 은과 금과 함께 바쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을’. 이 대명사는 바로 앞 절에 나온 청동 기구들을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘거둬 온’ ‘옮겨 온’. 히브리어 동사는 ‘들어 올리다/옮기다’의 뜻이 있으며, 여기서는 정복한 나라들로부터 전리품이나 조공을 취한 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘암몬의 자손들’, 곧 암몬 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  english_pob_choice: also these
  chosen_korean: 이들도
  alternatives_korean:
  - 그들도
  - 이것들도
  lexicon: HALOT
  rationale: 가리키는 대상은 바로 앞 절의 청동 기구들이므로, 문맥상 ‘이들도’가 지시 관계를 가장 자연스럽게 드러냅니다.
- source_word: הִקְדִּישׁ
  english_pob_choice: dedicated
  chosen_korean: 바쳤습니다
  alternatives_korean:
  - 바쳤습니다
  - 구별하여 드렸습니다
  - 성별했습니다
  lexicon: HALOT
  rationale: 제의적 맥락에서 단순한 헌납보다 ‘바치다’가 자연스럽고, 원문의 ‘거룩하게 구별하다’는 의미도 함께 살릴 수 있습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼께
  - 주님께
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 하나님의 고유명사를 ‘야훼’로 옮기고, 여격 표지에 맞게 ‘-께’를 붙였습니다.
- source_word: אֲשֶׁר נָשָׂא
  english_pob_choice: that he had carried off
  chosen_korean: 그가 거둬 온
  alternatives_korean:
  - 그가 가져온
  - 그가 빼앗아 온
  - 그가 옮겨 온
  lexicon: HALOT
  rationale: נָשָׂא의 ‘들고 옮기다/가져오다’와 전리품 문맥을 함께 반영해, 약탈의 뉘앙스를 과도하게 강화하지 않는 ‘거둬 오다’로 옮겼습니다.
- source_word: מִבְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬인들
  - 암몬 자손
  lexicon: HALOT
  rationale: 히브리어의 직역형을 살리되, 한국어 독자가 이해하기 쉬운 성경식 민족명으로 정리했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명 사본 표지를 고유명사로 드러내기 위해 ‘야훼’를 유지했습니다. 이는 프로젝트의 표준 용례와도 일치합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
