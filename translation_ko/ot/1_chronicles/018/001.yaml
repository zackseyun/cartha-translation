base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
  footnotes:
  - marker: a
    text: Literally, 'its daughters,' an idiom referring to the smaller towns or villages dependent on Gath.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 후에 다윗이 블레셋 사람들을 쳐서 그들을 굴복시키고, 블레셋 사람의 손에서 가드와 그 주변 마을들을 빼앗았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그 딸들’이지만, 여기서는 가드에 종속된 작은 도시나 마을을 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이런 일 뒤에
  lexicon: HALOT
  rationale: 서사 전환의 시간 표현을 자연스럽게 살리면서도, 히브리어의 단순한 순차 표지를 과하게 풀지 않기 위해 ‘이 일 후에’를 택했습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck
  chosen_korean: 쳐서
  alternatives_korean:
  - 쳤습니다
  - 무찔렀습니다
  lexicon: HALOT
  rationale: נכה의 구체적 군사 동사를 살리기 위해 ‘쳐서’를 사용했습니다. 결과를 직접 해석한 ‘무찔렀습니다’보다 원문의 동작성에 가깝습니다.
- source_word: וַיַּכְנִיעֵם
  english_pob_choice: subdued them
  chosen_korean: 그들을 굴복시키고
  alternatives_korean:
  - 그들을 복종시키고
  - 그들을 제압하고
  lexicon: HALOT
  rationale: כנע의 사역형은 상대를 굴복·복속시키는 뜻이므로, 군사적·정치적 맥락을 살려 ‘굴복시키고’로 옮겼습니다.
- source_word: וּבְנֹתֶיהָ
  english_pob_choice: its surrounding towns
  chosen_korean: 그 주변 마을들
  alternatives_korean:
  - 그 딸 마을들
  - 그 종속 마을들
  - 그 주변 촌락들
  lexicon: HALOT
  rationale: 직역하면 ‘그 딸들’이지만, 이는 가드에 딸린 소도시·촌락을 뜻하는 관용어이므로 의미를 드러내는 ‘그 주변 마을들’로 옮기고, 직역의 뉘앙스는 본문 주석 없이 본문에 과도하게 드러내지 않았습니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: 손에서
  alternatives_korean:
  - 권세에서
  - 지배 아래에서
  lexicon: HALOT
  rationale: ‘from the hand of’의 소유·지배 관용구를 한국어에서도 그대로 살려, 빼앗긴 대상의 통제 관계를 보이도록 했습니다.
