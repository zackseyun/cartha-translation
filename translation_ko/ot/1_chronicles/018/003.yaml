  source_fidelity: 현 번역은 חֲמָתָה를 ‘하맛으로 가서’로, 그리고 בְּלֶכְתּוֹ의 이동 주체를 하닷에셀로 해석하여 ‘하맛으로 가서 … 하닷에셀을 쳤습니다’라는 구조를 만들었습니다. 그러나 하맛 방향 표지는 ‘소바’의 지리적 한정으로 읽는 것이 문맥과 구문에 더 적절하며, ‘가던’ 주체는 하닷에셀입니다. 수정문은 이 관계를 반영합니다.
