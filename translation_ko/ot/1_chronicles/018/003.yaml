base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
  footnotes:
  - marker: a
    text: Or 'to restore his control' or more literally 'to set up his hand' at the Euphrates River.
    reason: lexical_alternative
  - marker: b
    text: The name is spelled 'Hadadezer' here; the parallel in 2 Samuel 8:3 has the variant form often rendered 'Hadarezer.'
    reason: textual_variant
translation:
  language: ko
  text: 다윗이 하맛으로 가서 유프라테스 강에서 자신의 권세를 세우려던 소바 왕 하닷에셀을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 통치를 회복하려고’ 혹은 더 문자적으로는 ‘자기 손을 세우려고’.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 여기서 ‘하닷에셀’로 표기되며, 사무엘하 8:3의 평행 본문에는 흔히 ‘하닷아셀’로 옮기는 이형이 있습니다.
    reason: textual_variant
