  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
  footnotes:
  - marker: a
    text: Or 'to restore his control' or more literally 'to set up his hand' at the Euphrates River.
    reason: lexical_alternative
  - marker: b
    text: The name is spelled 'Hadadezer' here; the parallel in 2 Samuel 8:3 has the variant form often rendered 'Hadarezer.'
    reason: textual_variant
translation:
  language: ko
  text: 다윗은 하맛 방면 소바의 왕 하닷에셀을 쳤습니다. 그가 유프라테스 강에서 자기 권세를 확립하려고 가던 때였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 통치를 회복하려고’; 더 문자적으로는 ‘자기 손을 세우려고’.
    reason: lexical_alternative
