  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
  footnotes:
  - marker: a
    text: The parallel in 2 Samuel 8:17 reads 'Ahimelech son of Abiathar' rather than 'Abimelech son of Abiathar.' The translation follows the Hebrew text of Chronicles here.
    reason: textual_variant
translation:
  language: ko
  text: 사독의 아들 아히둡과 아비아달의 아들 아비멜렉은 제사장이었고, 사와사는 서기관이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 병행본문인 2사무엘 8:17에는 ‘아비멜렉’ 대신 ‘아히멜렉’이 나오지만, 여기서는 역대기의 히브리 본문을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  english_pob_choice: Zadok
  chosen_korean: 사독
  alternatives_korean:
  - 자독
  lexicon: 고유명사
  rationale: 히브리어 고유명사 Zadok은 한국어 성경에서 널리 굳어진 ‘사독’으로 옮겼습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 자손
  - 후손
  lexicon: HALOT
  rationale: 여기서는 행정 명단 안의 직접적인 부자 관계를 가리키므로 ‘아들’이 가장 자연스럽습니다.
- source_word: כֹּהֲנִים
  english_pob_choice: priests
  chosen_korean: 제사장이었습니다
  alternatives_korean:
  - 제사장들이었습니다
  - 제사장이었습니다
  lexicon: HALOT
  rationale: 문맥상 제의 직분을 가리키므로 일반 행정관이 아니라 ‘제사장’으로 옮기는 것이 원문에 충실합니다.
- source_word: סוֹפֵר
  english_pob_choice: secretary
  chosen_korean: 서기관이었습니다
  alternatives_korean:
  - 비서였습니다
  - 기록관이었습니다
  lexicon: HALOT
  rationale: 왕실 행정 직책으로서의 סוֹפֵר는 한국어에서 ‘서기관’이 가장 가까우며, 본문의 관직 성격도 잘 드러냅니다.
theological_decisions:
- issue: 2사무엘 8:17과의 인명 변이 반영
  chosen_reading: 역대기의 히브리 본문대로 ‘아비멜렉’으로 옮겼습니다.
  alternative_readings:
  - 2사무엘의 병행처럼 ‘아히멜렉’으로 맞추는 읽기
  rationale: POB의 영어 본문이 역대기의 히브리 본문을 따르고 있으므로, 병행본문의 형태를 평준화하지 않고 본문의 차이를 유지했습니다.
  doctrine_reference: 본문 비평 / 사본 변이
