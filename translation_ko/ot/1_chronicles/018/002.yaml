  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became slaves to David, bringing tribute.
  footnotes:
  - marker: a
    text: Or 'servants to David, bearing gifts.' The Hebrew terms can be rendered more generally, but in this conquest context 'slaves' and 'tribute' best reflect the sense of subjugation and payment from a vassal people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 모압을 쳤고, 모압 사람들은 다윗에게 노예가 되어 조공을 바쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗에게 종들이 되어 예물을 가져오는 자들’로 옮길 수 있습니다. 히브리어 표현은 더 일반적으로도 번역할 수 있지만, 정복의 맥락에서는 ‘노예’와 ‘조공’이 예속과 강제 납부의 의미를 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: struck
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 공격했습니다
  - 무찔렀습니다
  - 쳤습니다
  lexicon: HALOT
  rationale: 히브리어 נכה의 기본 이미지는 ‘치다/치게 하다’이므로, 군사적 승리를 담되 과도하게 해석하지 않는 ‘치다’를 살렸습니다.
- source_word: מוֹאָב
  english_pob_choice: Moab / the Moabites
  chosen_korean: 모압 / 모압 사람들
  alternatives_korean:
  - 모압
  - 모압인들
  - 모압 사람들
  lexicon: HALOT
  rationale: 첫 번째는 공격 대상인 국가명으로 ‘모압’이라 하고, 뒤의 문맥은 패배한 집단을 가리키므로 자연스럽게 ‘모압 사람들’로 옮겼습니다.
- source_word: עֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 신하
  - 백성
  lexicon: HALOT
  rationale: 정복 이후의 종속 관계가 분명하므로, 완곡한 ‘종’보다 속박된 신분을 드러내는 ‘노예’가 원문과 영문 POB의 의미를 더 잘 보존합니다.
- source_word: נֹשְׂאֵי מִנְחָה
  english_pob_choice: bringing tribute
  chosen_korean: 조공을 바쳤습니다
  alternatives_korean:
  - 예물을 가져왔습니다
  - 공물을 바쳤습니다
  - 조공을 바쳤습니다
  lexicon: HALOT
  rationale: מִנְחָה는 여기서 예배용 제물이 아니라 정복자에게 바치는 정치적 공물/조공이므로, 관계의 비대칭을 드러내는 ‘조공’이 적절합니다.
theological_decisions:
- issue: 정복 전쟁의 종속 표현
  chosen_reading: ‘노예’와 ‘조공’으로 정복과 예속의 강도를 분명히 드러냈습니다.
  alternative_readings:
  - ‘종’과 ‘예물’로 완화하여 번역할 수 있습니다.
  - ‘신하’와 ‘공물’로 정치적 표현을 택할 수 있습니다.
  rationale: 본문은 단순한 예우가 아니라 전쟁 후 강제적 종속을 말하므로, 의미를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md의 bonded-status 관련 번역 원칙 및 POB의 slavery-distinction policy
- issue: 합쇼체 서술문
  chosen_reading: 서술은 현대 표준어 합쇼체로 유지했습니다.
  alternative_readings:
  - 고전적 문어체로 옮길 수 있습니다.
  - 구어체로 더 평이하게 옮길 수 있습니다.
  rationale: 본문의 역사 서술을 현대 한국어 성경 문체로 자연스럽게 전달하기 위한 선택입니다.
  doctrine_reference: Korean target style guideline
