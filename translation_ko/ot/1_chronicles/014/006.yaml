lexical_decisions:
- source_word: נֹגַהּ
  english_pob_choice: Nogah
  chosen_korean: 노가
  alternatives_korean:
  - 노가흐
  - 노가
  lexicon: HALOT
  rationale: 고유명사는 뜻풀이보다 음역이 우선이므로, 영어 POB의 Nogah를 한국어 표기인 노가로 옮겼습니다. 끝의 ה를 굳이 드러내지 않는 더 짧은 음역도 가능하지만, 한국어 표기는 자연스러운 노가가 적절합니다.
- source_word: נֶפֶג
  english_pob_choice: Nepheg
  chosen_korean: 네벡
  alternatives_korean:
  - 네펙
  - 네페그
  lexicon: HALOT
  rationale: 고유명사이므로 표준 음역을 따랐습니다. 영어 POB의 Nepheg에 대응해 한국어에서는 자음군 발음을 살린 네벡이 가장 간결합니다.
- source_word: יָפִיעַ
  english_pob_choice: Japhia
  chosen_korean: 야피아
  alternatives_korean:
  - 자피아
  - 야피야
  lexicon: HALOT
  rationale: 히브리어 איש명에서 ראשי י는 한국어 음역으로 보통 야-로 옮길 수 있으므로, 영어 관습형 Japhia의 음가를 반영해 야피아로 적었습니다.
