  source_fidelity: 핵심 동사와 통사 관계는 대체로 충실합니다. 다만 히브리어 עַמּוֹ(‘그의 백성’)의 소유격은 야훼와 다윗 중 어느 쪽을 가리키는지 논의되는 표현이므로, 본문의 ‘자기 백성’은 한국어 재귀 표현으로서 원문의 소유격 형태와 참조의 여지를 충분히 보존하지 못합니다.
