base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
  footnotes:
  - marker: a
    text: Or 'his kingdom had been lifted up on high.'
    reason: lexical_alternative
  - marker: b
    text: That is, Israel as the LORD's people; some take 'his people' to refer to David's people.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗은 야훼께서 자신을 이스라엘의 왕으로 세우셨음을 알았습니다. 그의 왕권이 자기 백성 이스라엘을 위하여 크게 높아졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 왕권이 위로 높이 들려졌기 때문입니다.”
    reason: alternative_reading
  - marker: b
    text: 즉 야훼의 백성 이스라엘을 뜻합니다. 어떤 이들은 ‘자기 백성’을 다윗의 백성으로 이해하기도 합니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיֵּדַע
  english_pob_choice: knew
  chosen_korean: 알았습니다
  alternatives_korean:
  - 알게 되었습니다
  - 깨달았습니다
  lexicon: HALOT
  rationale: 서술의 사실 인지를 자연스럽게 전하며, 지나치게 해석적인 ‘깨달았습니다’보다 פשוט한 ‘알았습니다’가 원문에 가깝습니다.
- source_word: הֱכִינוֹ לְמֶלֶךְ
  english_pob_choice: had established him as king
  chosen_korean: 자신을 이스라엘의 왕으로 세우셨음
  alternatives_korean:
  - 자신을 왕으로 세우셨음
  - 자신을 왕으로 확립하셨음
  lexicon: HALOT
  rationale: הכין의 ‘세우다/설립하다’ 의미를 살려 왕위에 두신 행위를 표현했고, לְמֶלֶךְ는 ‘왕으로’로 자연스럽게 옮겼습니다.
- source_word: נִשֵּׂאת לְמַעְלָה
  english_pob_choice: had been greatly exalted
  chosen_korean: 크게 높아졌기
  alternatives_korean:
  - 높이 올려졌기
  - 위로 들려졌기
  lexicon: HALOT
  rationale: 수동적 ‘높아지다’의 의미를 살리되, 한국어에서는 ‘크게 높아지다’가 왕권의 고양을 가장 자연스럽게 드러냅니다.
- source_word: בַּעֲבוּר עַמּוֹ יִשְׂרָאֵל
  english_pob_choice: for the sake of his people Israel
  chosen_korean: 자기 백성 이스라엘을 위하여
  alternatives_korean:
  - 이스라엘 자기 백성을 위해
  - 자기 백성 이스라엘의 유익을 위하여
  lexicon: HALOT
  rationale: בַּעֲבוּר의 목적·유익 의미를 따라 ‘위하여’로 옮겼고, כאן의 소유대명사는 문맥상 야훼를 가리키므로 ‘자기 백성’으로 풀었습니다.
theological_decisions:
- issue: ‘his people’의 소유격 참조 대상
  chosen_reading: ‘자기 백성’은 야훼의 백성을 가리킵니다.
  alternative_readings:
  - 다윗의 백성을 가리킨다
  rationale: 역대기의 문맥상 이스라엘은 다윗의 소유가 아니라 야훼의 언약 백성입니다. 따라서 소유격은 하나님께 돌려 읽는 것이 본문 흐름에 맞습니다.
  doctrine_reference: 역대기 문맥의 언약 백성 이해
