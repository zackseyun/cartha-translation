    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 예루살렘에서 아내들을 더 맞이하였고[a], 다윗은 아들들과 딸들을 더 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '더 많은 여자들을 아내로 맞이하였다'. 히브리어는 문자적으로 '아내들을 더 취하였다'라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 맞이하였고
  alternatives_korean:
  - 취하였고
  - 데려갔고
  - 취득하였고
  lexicon: HALOT
  rationale: לָקַח의 기본 뜻인 '취하다/가지다'를 살리되, 한국어에서는 배우자 관계에 맞게 '맞이하다'가 가장 자연스럽고 과도한 해석을 피합니다.
- source_word: עֽוֹד
  english_pob_choice: more
  chosen_korean: 더
  alternatives_korean:
  - 또
  - 추가로
  lexicon: HALOT
  rationale: 여기서는 수량의 증가를 나타내므로, '더'가 앞뒤 절 모두에 자연스럽게 걸리는 간결한 대응입니다.
- source_word: נָשִׁים
  english_pob_choice: wives
  chosen_korean: 아내들
  alternatives_korean:
  - 여인들
  - 부인들
  lexicon: HALOT
  rationale: 문맥상 단순한 '여인들'보다 결혼 관계를 드러내는 '아내들'이 מקור의 관계적 의미를 더 정확히 반영합니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 자녀를 두었습니다
  lexicon: HALOT
  rationale: 남성 주어의 ילד는 '아버지가 되다/낳다'의 뜻이므로, 현대 한국어에서는 '낳았습니다'가 가장 직설적이고 자연스럽습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들들과 딸들
  alternatives_korean:
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어가 성별을 명시하므로, 일반화된 '자녀들'보다 '아들들과 딸들'이 정보 손실을 줄입니다.
theological_decisions:
- issue: 다윗의 다처와 번식에 대한 서술 방식
  chosen_reading: 평가를 덧붙이지 않고 사실 서술로만 옮겼습니다.
  alternative_readings:
  - 암시적 비판이나 승인 어조를 더함
  rationale: 본문은 다윗이 아내들을 더 맞이하고 자녀를 더 낳았다고 보고할 뿐, 이 절 자체에서 도덕적 평가를 제시하지 않으므로 서술적 어조를 유지해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
