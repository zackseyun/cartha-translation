translation:
  language: ko
  text: 다윗의 이름이 모든 땅에 퍼져 나갔고, 야훼께서 모든 민족에게 다윗에 대한 두려움을 안겨 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗의 명성이 모든 땅에 퍼져 나갔다.’
    reason: lexical_alternative
  - marker: b
    text: 즉, 야훼께서 모든 민족이 다윗을 두려워하게 하셨다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 퍼졌고
  alternatives_korean:
  - 퍼져 나갔고
  - 나갔고
  - 알려졌고
  lexicon: WLC / HALOT
  rationale: ‘이름이 나가다’는 히브리어 관용을 한국어에서 자연스럽게 살리기 위해 ‘퍼졌고’를 택했습니다. 단순한 ‘알려졌고’보다 원문의 확장 이미지를 더 잘 보존합니다.
- source_word: שֵׁם
  english_pob_choice: name
  chosen_korean: 이름
  alternatives_korean:
  - 명성
  - 평판
  lexicon: WLC / HALOT
  rationale: 히브리어의 ‘이름’은 여기서 명성·명망을 가리키는 환유이므로, 원문의 표현을 살려 ‘이름’으로 옮겼습니다.
- source_word: בְּכָל הָאֲרָצוֹת
  english_pob_choice: into all the lands
  chosen_korean: 온 땅에
  alternatives_korean:
  - 모든 땅에
  - 모든 나라에
  - 모든 지역에
  lexicon: WLC / HALOT
  rationale: 복수형 ‘땅들/지역들’의 넓은 범위를 한국어에서 가장 자연스럽게 나타내기 위해 ‘온 땅에’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC / HALOT
  rationale: 본문의 신명사 표기를 관례적 대체어인 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 고유신명 ‘야훼’로 옮겼습니다.
- source_word: נָתַן אֶת פַּחְדּוֹ
  english_pob_choice: put the fear of him
  chosen_korean: 그에 대한 두려움을 두셨습니다
  alternatives_korean:
  - 그를 두려워하게 하셨습니다
  - 그에 대한 공포를 두셨습니다
  - 그에 대한 경외를 두셨습니다
  lexicon: WLC / HALOT
  rationale: ‘두려움을 두다’는 פחד + על의 관용을 비교적 직설적으로 옮기며, 대상이 다윗임을 드러내기 위해 ‘그에 대한’으로 풀었습니다. ‘경외’는 의미를 약화시킬 수 있어 피했습니다.
theological_decisions:
- issue: פַּחְדּוֹ의 소유격 지시 대상
  chosen_reading: 소유격은 다윗을 가리키므로, 야훼께서 ‘그에 대한 두려움’을 모든 민족 위에 두신 것으로 옮겼습니다.
  alternative_readings:
  - ‘그의 두려움’으로 옮겨 야훼를 지시하는 읽기
  - ‘야훼를 두려워함’이라는 의미로 해석하는 읽기
  rationale: 문맥이 다윗의 이름이 여러 땅에 퍼진 결과로 열국이 다윗을 두려워하게 된 상황을 말하므로, 다윗 지시가 가장 자연스럽습니다. 사무엘/역대기 병행 전통도 같은 방향을 지지합니다.
  doctrine_reference: 문맥 우선의 대명사 지시 해석
- issue: ‘온 땅’과 ‘모든 민족’의 범위 표현
  chosen_reading: 히브리어의 ארצות와 גויים를 각각 한국어의 ‘온 땅’, ‘모든 민족’으로 자연화했습니다.
  alternative_readings:
  - ‘모든 나라들’
  - ‘모든 땅들’
  rationale: 원문은 주변 지역 전체와 민족 집단 전체를 폭넓게 가리키므로, 의미를 살리되 한국어로도 읽히는 범위 표현을 택했습니다.
  doctrine_reference: 원문 범위 보존과 자연스러운 수용어 선택
