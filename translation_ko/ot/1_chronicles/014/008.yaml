id: 1CH.14.8
reference: 1 Chronicles 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי נִמְשַׁ֨ח דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל כָּל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑יד וַ/יִּשְׁמַ֣ע דָּוִ֔יד וַ/יֵּצֵ֖א לִ/פְנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
  footnotes:
  - marker: a
    text: Or, 'went out to meet them' or 'went out against them.' The Hebrew literally says 'went out before them,' which may imply military confrontation without stating it explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 다윗이 온 이스라엘의 왕으로 기름부음을 받았다는 것을 듣고, 모든 블레셋 사람들이 다윗을 찾으려고 올라왔습니다. 다윗은 그 소식을 듣고 그들 앞에 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 앞에 나아갔다’입니다. 문맥상 ‘그들을 맞으러 나아갔다’ 또는 ‘그들을 대적하러 나아갔다’는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְשַׁח
  english_pob_choice: had been anointed
  chosen_korean: 기름부음을 받았다는 것
  alternatives_korean:
  - 왕이 되었다는 것
  - 기름부음받았다는 것
  lexicon: HALOT
  rationale: 히브리어 נמשׁח의 기본 의미를 살려 ‘기름부음을 받다’로 옮기되, 절 안의 ‘왕’과 결합해 결과 상태를 자연스럽게 표현했습니다.
- source_word: עַל כָּל יִשְׂרָאֵל
  english_pob_choice: over all Israel
  chosen_korean: 온 이스라엘의 왕으로
  alternatives_korean:
  - 온 이스라엘 위에
  - 온 이스라엘을 다스리는 왕으로
  lexicon: HALOT
  rationale: 왕권을 가리키는 עַל의 관계를 한국어에서는 ‘~의 왕으로’로 자연스럽게 풀어, 통치 범위를 분명히 했습니다.
- source_word: כָל פְּלִשְׁתִּים
  english_pob_choice: all the Philistines
  chosen_korean: 모든 블레셋 사람들
  alternatives_korean:
  - 블레셋 사람들 모두
  - 블레셋 전체
  lexicon: HALOT
  rationale: 집합적 표현을 그대로 살려 ‘모든 블레셋 사람들’로 옮겼습니다. 본문이 말하는 집단 전체의 움직임을 유지합니다.
- source_word: לִפְנֵיהֶם
  english_pob_choice: went out before them
  chosen_korean: 그들 앞에 나아갔습니다
  alternatives_korean:
  - 그들을 맞으러 나아갔습니다
  - 그들 앞에서 나아갔습니다
  - 그들을 대적하려고 나아갔습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그들 앞에/앞으로’이므로 그 이미지를 살리되, 한국어에서는 ‘나아가다’로 풀어 자연스럽게 했습니다.
theological_decisions:
- issue: ‘went out before them’의 군사적 함의
  chosen_reading: 본문은 직접적으로 전투를 말하지 않고 ‘그들 앞에 나아갔습니다’라고 하여, 이후의 대치 가능성은 남기되 문장 자체의 절제된 표현을 유지했습니다.
  alternative_readings:
  - 그들을 맞으러 나아갔습니다
  - 그들을 대적하러 나아갔습니다
  rationale: 영어 POB 주석처럼 히브리어는 명시적 전투보다 대면의 이미지를 먼저 제시하므로, 해석을 과도하게 앞서가지 않도록 했습니다.
  doctrine_reference: 본문 의미의 절제와 서술 충실성
- issue: ‘all the Philistines’의 집합성
  chosen_reading: ‘모든 블레셋 사람들’로 옮겨 집단 전체의 움직임이라는 서술을 유지했습니다.
  alternative_readings:
  - 블레셋 군대 전체
  - 블레셋 온 무리
  rationale: 본문은 ‘블레셋 전체’라는 집합적 서술을 사용하므로, 군사조직으로만 좁히지 않고 원문 폭을 보존했습니다.
  doctrine_reference: 서사적 집합명사 보존
