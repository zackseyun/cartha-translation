base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
  footnotes:
  - marker: a
    text: Or 'envoys' for 'messengers.' The Hebrew term can denote official representatives in a royal context.
    reason: lexical_alternative
  - marker: b
    text: Or 'to build him a palace.' Hebrew 'house' can refer to a royal residence, but the main text preserves the more literal wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 두로의 왕 히람이 다윗에게 사신들과 함께 백향목 재목과 석공들과 목수들을 보냈습니다. 그것은 그를 위해 집을 짓게 하려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사신들’ 대신 ‘전령들’로도 옮길 수 있습니다. 히브리어는 왕실 문맥에서 공식 대표를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 위해 궁전을 짓게 하려는 것이었습니다’로도 옮길 수 있습니다. 히브리어 ‘집’은 왕실 거처를 가리킬 수 있지만, 본문은 더 문자적인 표현을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 전령들
  - 메신저들
  - 외교 사절들
  lexicon: HALOT
  rationale: 왕실 문맥에서 단순한 전달자보다 공식 대표라는 뉘앙스가 있어, POB의 ‘messengers’에 맞추되 한국어에서는 자연스러운 ‘사신들’로 옮겼습니다.
- source_word: וַעֲצֵי אֲרָזִים
  english_pob_choice: cedar timber
  chosen_korean: 백향목 재목
  alternatives_korean:
  - 백향목 목재
  - 백향목 나무
  - 백향목 통나무
  lexicon: HALOT
  rationale: 건축 자재를 가리키므로 살아 있는 나무가 아니라 목재/재목으로 번역하는 것이 원문 의미를 더 정확히 드러냅니다.
- source_word: חָרָשֵׁי קִיר
  english_pob_choice: masons
  chosen_korean: 석공들
  alternatives_korean:
  - 벽돌공들
  - 담장공들
  - 돌일꾼들
  lexicon: HALOT
  rationale: קִיר가 ‘벽’이지만 문맥상 석재 건축 기술자를 가리키므로, 간결하고 자연스러운 ‘석공들’이 적절합니다.
- source_word: חָרָשֵׁי עֵצִים
  english_pob_choice: carpenters
  chosen_korean: 목수들
  alternatives_korean:
  - 목재 장인들
  - 나무공들
  - 목공들
  lexicon: HALOT
  rationale: 나무를 다루는 기술자를 뜻하므로 표준적인 직업명인 ‘목수들’로 옮겼습니다.
theological_decisions:
- issue: בַּיִת의 의미가 단순한 ‘집’인지 왕궁/궁전인지
  chosen_reading: 본문은 기본어휘인 ‘집’을 살리되, 한국어에서는 왕궁을 뜻할 수 있는 문맥적 가능성을 과잉 해석하지 않고 ‘집’으로 유지했습니다.
  alternative_readings:
  - 궁전
  - 왕궁
  - 궁실
  rationale: 영어 POB도 ‘house’를 유지하며 주석으로 대안 의미를 표시합니다. 본문은 원문 어휘를 보존하고, 해석적 확대는 본문 밖으로 두는 편이 소스 충실도에 맞습니다.
  doctrine_reference: source fidelity / lexical restraint
