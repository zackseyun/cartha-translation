  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
  footnotes:
  - marker: a
    text: Or, 'will you deliver them into my hand?' The Hebrew idiom is literally 'give them into my hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 하나님께 여쭈었습니다. “제가 블레셋 사람들을 치러 올라가야 하겠습니까? 그들을 제 손에 넘겨주시겠습니까?[a]” 야훼께서 그에게 말씀하셨습니다. “올라가라. 내가 그들을 네 손에 넘겨주겠다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 제 손에 주시겠습니까?’ 히브리어 관용구를 직역하면 ‘그들을 내 손에 주다’이며, 적을 자기 권세 아래 두는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  english_pob_choice: inquired of God
  chosen_korean: 하나님께 물으며
  alternatives_korean:
  - 하나님께 여쭈며
  - 하나님께 문의하며
  lexicon: HALOT
  rationale: שׁאל의 이 문맥은 단순한 질문이 아니라 하나님의 뜻을 구하는 행위이므로, 한국어도 ‘물으며’로 신탁적 문의의 성격을 살렸습니다.
- source_word: הַאֶעֱלֶה ... עַל פְּלִשְׁתִּים
  english_pob_choice: Shall I go up against the Philistines
  chosen_korean: 제가 블레셋 사람들을 치러 올라가야 하겠습니까?
  alternatives_korean:
  - 제가 블레셋 사람들에게 올라가야 하겠습니까?
  - 제가 블레셋 사람들과 싸우러 올라가야 하겠습니까?
  lexicon: HALOT
  rationale: עלה의 군사적 ‘올라가다’와 על + ժողովրդի의 대항 의미를 함께 반영해, 한국어에서는 전투 의미를 드러내는 ‘치러 올라가다’로 옮겼습니다.
- source_word: וּנְתַתָּם בְּיָדִי / וּנְתַתִּים בְּיָדֶךָ
  english_pob_choice: give them into my hand / give them into your hand
  chosen_korean: 그들을 제 손에 넘겨주시겠습니까? / 내가 그들을 네 손에 넘겨주겠다.
  alternatives_korean:
  - 그들을 제 손안에 주시겠습니까?
  - 그들을 제 권세 아래 두시겠습니까?
  lexicon: HALOT
  rationale: ביד의 관용구를 직역적으로 살려 ‘손에 넘겨주다’로 통일해, 적을 권능 아래 두는 히브리어 이미지를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 여호와/주 대용을 따르지 않고, 프로젝트 기본 원칙에 따라 신명 자체를 음역한 ‘야훼’를 사용했습니다.
