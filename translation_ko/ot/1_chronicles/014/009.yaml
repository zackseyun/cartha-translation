translation:
  language: ko
  text: 블레셋 사람들이 와서 르바임 골짜기에 퍼져 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘르바임 골짜기를 습격했습니다.’ 히브리어 동사는 군대가 퍼져 나가거나 전개하는 것을 뜻할 수 있으며, 문맥에 따라 적대적인 침입이나 습격을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  english_pob_choice: Now the Philistines
  chosen_korean: 그러자 블레셋 사람들이
  alternatives_korean:
  - 그리고 블레셋 사람들이
  - 블레셋 사람들이
  lexicon: HALOT
  rationale: פְלִשְׁתִּים은 민족명으로 ‘블레셋 사람들’이 자연스럽고, 앞의 접속 ו는 서술 흐름상 ‘그러자’로 옮겨 사건 전개를 살렸습니다.
- source_word: בָּאוּ
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 이르러
  lexicon: HALOT
  rationale: 완료형 בוא는 서사에서 단순 과거로 처리하는 것이 자연스러우며, 뒤의 동사와 이어지는 동작의 전개를 살려 ‘와서’로 옮겼습니다.
- source_word: וַיִּפְשְׁטוּ
  english_pob_choice: raided
  chosen_korean: 습격했습니다
  alternatives_korean:
  - 공격했습니다
  - 퍼졌습니다
  - 침입했습니다
  lexicon: HALOT
  rationale: 이 문맥의 פשט는 단순히 ‘퍼지다’가 아니라 적대적 군사 침입/약탈의 뉘앙스가 강하므로, 이를 드러내는 ‘습격하다’가 가장 가깝습니다.
- source_word: בְּעֵמֶק רְפָאִים
  english_pob_choice: the Valley of Rephaim
  chosen_korean: 르바임 골짜기를
  alternatives_korean:
  - 르바임의 골짜기를
  - 르바임 평지로
  lexicon: HALOT
  rationale: עֵמֶק은 ‘골짜기’가 표준적이며, רְפָאִים은 지명으로 기능하므로 음역해 ‘르바임 골짜기’로 옮겼습니다.
