  to: 그들은 그곳에 그들의 신들을 버려 두고 갔습니다[a]. 다윗이 명령하자[b], 그것들을 불에 태웠습니다.
  rationale: 마지막 동사를 능동으로 바로잡아 히브리어 동사형의 행위성을 보존했습니다. 목적어 ‘그것들을’은 앞 절의 ‘신들’을 가리키며, 히브리어에서 문맥상 생략된 목적어를 한국어 문법과 명료성을 위해 드러낸 것입니다. ‘신들’이라는 본문 어휘와 ‘우상들’이라는 각주 대안의 구분은 유지했습니다.
  reviewer_model: gpt-5.6-terra
