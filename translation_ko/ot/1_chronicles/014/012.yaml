  source_fidelity: 수정이 필요합니다. וַיִּשָּׂרְפוּ는 여기서 수동형이 아니라 능동 복수형으로, 앞서 버려 둔 신들을 누군가가 불태운 행위를 가리킵니다. 따라서 ‘그것들은 불에 타 버렸습니다’는 행위 주체를 지우고 수동적·자동적 결과처럼 만드는 문제가 있습니다. 마지막 절은 목적어를 한국어에서 명시하여 능동으로 옮기는 것이 안전합니다.
  naturalness: ‘자기들의’보다 문맥상 소유를 자연스럽게 나타내는 ‘그들의’가 더 매끄럽습니다. ‘버려 두고 갔습니다’는 도주 과정에서 남겨 둔 의미를 자연스럽게 전달합니다. ‘다윗이 명령하자’는 문맥상 가능한 기능적 번역이며, 뒤 절을 능동으로 고치면 문장 연결도 자연스럽습니다.
  terminology: אֱלֹהֵיהֶם을 본문에서 ‘그들의 신들’로 유지하고 ‘우상들’은 각주 대안으로 둔 선택은 적절합니다. 다만 각주의 ‘제의용 형상’은 현대 한국어로 다소 전문적이고 어색하므로 ‘예배에 쓰던 형상’으로 다듬습니다.
