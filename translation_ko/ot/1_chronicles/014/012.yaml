id: 1CH.14.12
reference: 1 Chronicles 14:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת אֱלֹֽהֵי/הֶ֑ם וַ/יֹּ֣אמֶר דָּוִ֔יד וַ/יִּשָּׂרְפ֖וּ בָּ/אֵֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
  footnotes:
  - marker: a
    text: Or 'their idols.' The Hebrew literally says 'their gods,' though the referent is likely their cult images.
    reason: lexical_alternative
  - marker: b
    text: 'The parallel account in 2 Samuel 5:21 reads more actively: ''and David and his men carried them away.'' Chronicles instead says they were burned with fire at David''s order.'
    reason: cross_reference
translation:
  language: ko
  text: 그들은 그곳에 그들의 신들을 버려 두고 갔습니다[a]. 다윗이 명령하자[b], 그것들을 불에 태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 우상들’입니다. 히브리어는 문자적으로 ‘그들의 신들’이라고 말하지만, 가리키는 대상은 아마도 그들이 예배에 쓰던 형상일 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 평행 본문인 사무엘하 5:21은 더 적극적으로 ‘다윗과 그의 부하들이 그것들을 가져갔다’고 말합니다. 역대기는 여기서 다윗의 명령 뒤에 그것들을 불에 태웠다고 전합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ שָׁם
  english_pob_choice: they left there
  chosen_korean: 그들은 그곳에 ... 버려 두었고
  alternatives_korean:
  - 그들은 거기서 ... 떠났고
  - 그들은 거기서 ... 버렸고
  lexicon: HALOT
  rationale: עזב의 기본 뜻을 살리되, 문맥상 단순한 위치 이동보다 ‘버려 두다’가 남겨 두고 달아난 뉘앙스를 더 잘 드러냅니다.
- source_word: אֶת אֱלֹהֵיהֶם
  english_pob_choice: their gods
  chosen_korean: 자기들의 신들을
  alternatives_korean:
  - 그들의 신들을
  - 그들의 우상들을
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그들의 신들’이므로 이를 유지했습니다. ‘우상들’은 의미상 가능하지만, 본문 자체의 어휘보다 해석이 앞서는 표현이어서 본문 의미는 각주로만 보완했습니다.
- source_word: וַיֹּאמֶר דָּוִיד
  english_pob_choice: David gave the order
  chosen_korean: 다윗이 명령하자
  alternatives_korean:
  - 다윗이 말하자
  - 다윗이 명령했고
  lexicon: HALOT
  rationale: 직역하면 ‘다윗이 말했다’이지만, 이어지는 소각 행위로 보아 발화의 기능이 명령이므로 한국어에서도 그 기능을 드러냈습니다.
- source_word: וַיִּשָּׂרְפוּ בָּאֵשׁ
  english_pob_choice: they were burned with fire
  chosen_korean: 그것들은 불에 타 버렸습니다
  alternatives_korean:
  - 그것들은 불로 태워졌습니다
  - 그것들은 불에 타 버렸습니다
  lexicon: HALOT
  rationale: 수동적 결과를 살리면서 한국어로는 가장 자연스럽게 ‘불에 타 버리다’로 옮겼습니다. 히브리어가 직접 목적어를 드러내지 않으므로, 앞선 ‘신들’을 받는 대명사로 처리했습니다.
theological_decisions:
- issue: ‘신들’과 ‘우상들’ 사이의 번역 선택
  chosen_reading: 본문은 ‘신들’로 옮기고, 각주에서 우상/조각상 가능성을 밝힙니다.
  alternative_readings:
  - ‘우상들’로 본문화
  - ‘조각상들’로 본문화
  rationale: 히브리어 어휘를 먼저 보존해야 하므로 본문에는 ‘신들’을 두고, 문맥상 예배용 형상일 가능성은 주석으로만 처리했습니다. 이는 원문 우선 원칙을 지키면서도 독자가 오해하지 않게 합니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
