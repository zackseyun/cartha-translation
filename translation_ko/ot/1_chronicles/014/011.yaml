base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
  footnotes:
  - marker: a
    text: Baal-perazim sounds like 'lord/master of breakings through' or 'place of breakthroughs,' echoing David's statement that God 'broke through' his enemies.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 바알-브라심[a]으로 올라가자 다윗이 거기에서 그들을 쳐부수었습니다. 다윗이 말했습니다. “하나님께서 내 손을 통해 내 적들을 물이 터져 나가듯이 돌파하셨습니다.” 그러므로 그곳의 이름을 바알-브라심이라 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바알-브라심’은 ‘돌파의 주’ 또는 ‘돌파가 일어난 곳’처럼 들리는 지명이며, 다윗의 ‘돌파하셨습니다’와 말장난을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  english_pob_choice: they went up
  chosen_korean: 올라가자
  alternatives_korean:
  - 갔습니다
  - 진격하자
  lexicon: HALOT
  rationale: עלה의 군사적 이동은 기본적으로 ‘올라가다’가 가장 직접적이며, 전투 문맥의 방향성을 한국어로 자연스럽게 살렸습니다.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  english_pob_choice: Baal-perazim
  chosen_korean: 바알-브라심
  alternatives_korean:
  - 바알-페라짐
  - 파열의 주
  lexicon: HALOT
  rationale: 고유 지명은 음역을 유지하는 것이 본문에 충실하며, 본문의 말장난은 각주로 설명하는 편이 적절합니다.
- source_word: וַיַּכֵּם
  english_pob_choice: David struck them down
  chosen_korean: 그들을 쳐부수었습니다
  alternatives_korean:
  - 그들을 쳤습니다
  - 그들을 무찔렀습니다
  lexicon: HALOT
  rationale: 전투 맥락의 נכה는 단순 타격보다 패퇴시키는 의미가 강하므로, ‘쳐부수다’가 구체적 전투 결과를 잘 드러냅니다.
- source_word: פָּרַץ
  english_pob_choice: has broken through
  chosen_korean: 돌파하셨습니다
  alternatives_korean:
  - 뚫고 지나가셨습니다
  - 터뜨려 지나가셨습니다
  lexicon: HALOT
  rationale: פרץ의 핵심은 ‘뚫고 나감/돌파함’이며, 앞의 지명 바알-브라심과의 말장난을 한국어에서 살리기 위해 ‘돌파’로 옮겼습니다.
- source_word: בְּיָדִי
  english_pob_choice: by my hand
  chosen_korean: 내 손을 통해
  alternatives_korean:
  - 내 손으로
  - 내가
  lexicon: HALOT
  rationale: 히브리어 관용구의 도구성과 매개성을 보존하면서도 한국어로는 ‘통해’가 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님의 주도성과 다윗의 도구성
  chosen_reading: 하나님께서 승리를 주도하시되 다윗의 손을 수단으로 사용하신 것으로 옮겼습니다.
  alternative_readings:
  - 다윗이 적을 이겼다고만 옮기기
  - 하나님이 직접만 행한 것으로만 옮기기
  rationale: 단수 주어와 ‘내 손을 통해’가 함께 있으므로, 신적 주도성과 인간 매개를 둘 다 보존해야 본문의 신학이 살아납니다.
  doctrine_reference: Translation philosophy §3
