  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל ע֤וֹד דָּוִיד֙ בֵּֽ/אלֹהִ֔ים וַ/יֹּ֤אמֶר ל/וֹ֙ הָֽ/אֱלֹהִ֔ים לֹ֥א תַֽעֲלֶ֖ה אַֽחֲרֵי/הֶ֑ם הָסֵב֙ מֵֽ/עֲלֵי/הֶ֔ם וּ/בָ֥אתָ לָ/הֶ֖ם מִ/מּ֥וּל הַ/בְּכָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
  footnotes:
  - marker: a
    text: Hebrew 'the baca trees'; the exact species is uncertain. Traditional English versions often read 'mulberry trees.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 하나님께 다시 물으니, 하나님께서 그에게 말씀하셨습니다. "그들을 따라 올라가지 마십시오. 그들 뒤로 돌아가서, 발삼나무들 맞은편에서 그들을 치러 가십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 식물명은 정확한 종이 확실하지 않습니다. 전통역은 흔히 ‘뽕나무들’로 옮기지만, 여기서는 ‘발삼나무들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַ֨ל ... בֵּאלֹהִ֔ים
  english_pob_choice: inquired of God again
  chosen_korean: 하나님께 다시 물으니
  alternatives_korean:
  - 하나님께 다시 문의하니
  - 하나님께 다시 여쭙자
  lexicon: HALOT
  rationale: שאל with ב는 단순한 ‘묻다’보다 신탁을 구하는 ‘문의하다/물어보다’의 뜻이 있어, 자연스러운 한국어로는 ‘하나님께 다시 물으니’가 그 consultative 의미를 잘 살립니다.
- source_word: לֹ֥א תַֽעֲלֶ֖ה אַחֲרֵי/הֶ֑ם
  english_pob_choice: You shall not go up after them
  chosen_korean: 그들을 따라 올라가지 마십시오
  alternatives_korean:
  - 그들 뒤를 따라 올라가지 마십시오
  - 그들을 추격하지 마십시오
  lexicon: HALOT
  rationale: עלה의 기본 이미지인 ‘올라가다’를 살리되, 군사적 맥락에서의 진군 금지를 한국어로 자연스럽게 전달하기 위해 ‘따라 올라가지 마십시오’로 옮겼습니다.
- source_word: הָסֵב֙ מֵֽ/עֲלֵי/הֶ֔ם
  english_pob_choice: Circle around from behind them
  chosen_korean: 그들 뒤로 돌아가서
  alternatives_korean:
  - 그들로부터 돌아서서
  - 그들 뒤를 크게 돌아가서
  lexicon: HALOT
  rationale: הסב는 방향을 바꾸어 우회하라는 군사적 지시이므로, POB의 해석을 따라 ‘그들 뒤로 돌아가서’로 옮겨 우회·배후 접근의 의미를 드러냈습니다.
- source_word: הַ/בְּכָאִֽים
  english_pob_choice: the balsam trees
  chosen_korean: 발삼나무들
  alternatives_korean:
  - 바카나무들
  - 뽕나무들
  lexicon: HALOT
  rationale: 식물명은 어원이 불확실하므로, 전통적 ‘뽕나무들’보다 사전적 판단을 반영한 ‘발삼나무들’을 택해 구체성을 유지했습니다.
theological_decisions:
- issue: 직접 화자의 표지와 하나님 말씀의 구어체/문어체 처리
  chosen_reading: 서술문은 합쇼체로 유지하고, 직접 인용은 명령형을 사용해 하나님의 지시가 직접적으로 들리도록 했습니다.
  alternative_readings:
  - 모든 문장을 평서형으로 완화
  - 인용문도 서술형으로 처리
  rationale: 본문은 왕의 전술 지시를 넘어 하나님의 직접 명령을 전달하므로, 인용문 내부의 금지·명령을 분명히 살리는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 계시의 직접성, 신적 명령의 권위
