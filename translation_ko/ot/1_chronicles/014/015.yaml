  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
  footnotes:
  - marker: a
    text: Or 'baca trees' or traditionally 'mulberry trees'; the precise species denoted by the Hebrew is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네가 뽕나무들[a] 꼭대기에서 행진하는 소리를 들을 때, 그때 전쟁으로 나아가십시오. 이는 하나님께서 네 앞에 나아가 블레셋 사람들의 진영을 치시러 가셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바카나무들’, 전통적으로는 ‘뽕나무들’로도 옮깁니다. 이 히브리어가 가리키는 정확한 수종은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
