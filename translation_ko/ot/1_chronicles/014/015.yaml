  rationale: 히필 부정사는 목적을 나타내므로 ‘치시러’로 간명하게 옮겨, 앞선 행위의 목적을 드러냈습니다.
theological_decisions:
- issue: 하나님이 전쟁을 주도하시는 표현
  chosen_reading: 하나님께서 네 앞에 나아가 블레셋 사람들의 진영을 치시러 가셨기 때문입니다.
  alternative_readings:
  - 하나님께서 네 앞서 가셨기 때문입니다
  - 하나님께서 이미 네 앞에 나가 계시기 때문입니다
  rationale: 본문의 핵심은 다윗의 군사행동보다 하나님이 먼저 나아가 승리를 여신다는 점이므로, 전쟁 주도권이 하나님께 있음을 분명히 보존했습니다.
  doctrine_reference: 섭리와 하나님의 선행적 구원 행동
