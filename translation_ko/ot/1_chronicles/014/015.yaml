  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
  footnotes:
  - marker: a
    text: Or 'baca trees' or traditionally 'mulberry trees'; the precise species denoted by the Hebrew is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 발삼나무들[a] 꼭대기에서 행진하는 소리를 들을 때, 그때 전투에 나아가십시오. 하나님께서 블레셋 사람들의 진영을 치시려고 당신보다 앞서 나아가셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
