translation:
  language: ko
  text: 그리하여 다윗은 하나님께서 그에게 명령하신 대로 행했고, 그들은 기브온에서 게셀에 이르기까지 블레셋 군대를 쳐부수었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행했고
  alternatives_korean:
  - 했습니다
  - 하였습니다
  lexicon: HALOT
  rationale: עשה는 여기서 단순한 실행·순종의 행위를 나타내므로, ‘명령하신 대로 행하다’가 문맥을 가장 자연스럽게 살립니다.
- source_word: צִוָּהוּ
  english_pob_choice: had commanded him
  chosen_korean: 그에게 명령하신
  alternatives_korean:
  - 그에게 명하신
  - 그에게 지시하신
  lexicon: HALOT
  rationale: צוה는 분명한 명령을 뜻하므로 ‘명령하신’이 직결되고, 선행한 하나님의 명령을 한국어 서술 속에서 자연스럽게 드러냅니다.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  english_pob_choice: the Philistine army
  chosen_korean: 블레셋 군대
  alternatives_korean:
  - 블레셋 진영
  - 블레셋의 진
  lexicon: HALOT
  rationale: 마하네는 문자적으로 ‘진영’이지만 전투 문맥에서 군사 집단을 가리키는 환유로 쓰이므로, POB의 해석을 따라 ‘군대’로 옮겼습니다.
- source_word: וַיַּכּוּ
  english_pob_choice: they struck down
  chosen_korean: 쳐부수었습니다
  alternatives_korean:
  - 쳐죽였습니다
  - 무찔렀습니다
  lexicon: HALOT
  rationale: 복수 동사 형태와 전투 맥락을 살리면서, 단순한 ‘이겼다’보다 강한 타격·패배의 뉘앙스를 주는 표현을 택했습니다.
theological_decisions:
- issue: וַיַּכּוּ의 복수 주어를 한국어에서 어떻게 살릴지
  chosen_reading: ‘그들은’으로 옮겨 다윗과 그의 군사들이 함께 행동한 복수 주어를 드러냈습니다.
  alternative_readings:
  - ‘다윗이’로 단수화함
  - 주어를 생략함
  rationale: 히브리어 동사는 복수형이며, 서술 맥락도 다윗의 군사적 수행을 포함하므로 복수성을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 문법적 복수 주어 보존
