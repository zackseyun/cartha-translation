  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
  footnotes:
  - marker: a
    text: Hebrew 'the camp of the Philistines'; here rendered 'the Philistine army' because 'camp' likely refers metonymically to the military force.
