  rationale: 본문 자체는 남성 이름들을 나열하지만, 사용된 히브리어 형식은 일반적인 ‘아들들’이 아니므로 원문의 형태적 긴장을 보존했습니다.
  doctrine_reference: 본문 형태 관찰(lexical morphology)
