  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
  footnotes:
  - marker: a
    text: Or 'the ones born to him in Jerusalem.' The Hebrew expression is literally 'the born ones' and does not use the ordinary noun for 'sons,' though all the names listed are male.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 예루살렘에서 그에게서 태어난 자들의 이름입니다. 샴무아, 쇼바브, 나단, 그리고 솔로몬입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘태어난 자들’에 가깝고, 일반적인 ‘아들들’이라는 명사는 쓰지 않습니다. 다만 여기 나열된 이름들은 모두 남성입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  english_pob_choice: And these are the names of
  chosen_korean: 이것들은 … 이름입니다
  alternatives_korean:
  - 그리고 이것들은 … 이름입니다
  - 이름들은 이렇습니다
  lexicon: HALOT
  rationale: 열거를 여는 지시 표현과 ‘이름들’의 구조를 한국어로 자연스럽게 살리되, 과도한 직역은 피했습니다.
- source_word: הַיְלוּדִים
