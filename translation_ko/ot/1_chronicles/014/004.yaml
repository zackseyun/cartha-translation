  source_fidelity: ‘그에게서 태어난’은 히브리어의 소유·관계 표현(‘그에게 있었던/그에게 속한’)을 한국어에서 생물학적 출처로 다소 과도하게 한정합니다. 또한 문맥상 ‘그’가 다윗임을 밝혀 주는 편이 한국어 문장으로 자연스럽습니다. ‘예루살렘에서 다윗에게 태어난’은 출생 장소와 부친 관계를 정확히 전달합니다.
  naturalness: 초안은 뜻이 대체로 분명하지만, ‘이것들은 … 이름입니다’보다 열거를 도입하는 ‘다음은 … 이름입니다’가 현대 한국어 성경 문체에서 더 자연스럽습니다. 이름 열거 뒤에 다시 ‘입니다’를 붙이는 방식은 불필요하게 반복되므로 콜론으로 처리합니다.
  terminology: ‘샴무아, 쇼바브, 나단, 솔로몬’은 통용되는 한국어 성경 인명 표기와 부합합니다. הַיְלוּדִים는 통상 명사 ‘아들들’이 아니라 ‘태어난 자들’이라는 분사형이므로 ‘태어난 자들’을 유지할 수 있습니다. 각주에는 영어 감사 기록의 대안 번역(‘그에게 태어난 자들’)도 반영하는 것이 적절합니다.
