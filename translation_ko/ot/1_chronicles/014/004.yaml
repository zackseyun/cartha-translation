  lexicon: HALOT
  rationale: 직역의 소유 관계를 한국어에서 가장 자연스럽게 드러내는 표현으로, ‘태어난’과 결합해 출생의 출처를 분명히 했습니다.
- source_word: בִּירוּשָׁלִָם
