  rationale: 전치사 ב의 장소 의미를 표준적인 국명+조사로 옮겼습니다.
theological_decisions:
- issue: הַיְלוּדִים의 성별을 한국어에서 어떻게 표시할지
  chosen_reading: 성별을 드러내지 않는 ‘태어난 자들’로 처리했습니다.
  alternative_readings:
