  - 태어난 아들들
  lexicon: HALOT
  rationale: 히브리어는 통상적 ‘아들들’이 아니라 ‘태어난 것들/자들’이라는 형식을 쓰므로, 성별을 단정하지 않는 ‘태어난 자들’로 옮겼습니다.
- source_word: אֲשֶׁר הָיוּ לוֹ
  english_pob_choice: to him
  chosen_korean: 그에게서
  alternatives_korean:
