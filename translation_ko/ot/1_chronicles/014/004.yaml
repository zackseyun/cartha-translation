    rationale: 이름 목록 뒤의 ‘입니다’는 앞 문장의 ‘이름입니다’와 겹칩니다. 콜론 뒤 목록으로 제시하면 더 자연스럽고 원문의 목록 구조도 잘 드러납니다.
  - severity: low
