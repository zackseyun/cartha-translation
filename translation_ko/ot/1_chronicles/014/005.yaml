  text: 이브하르, 엘리수아, 그리고 엘펠렛입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִבְחָ֥ר
  english_pob_choice: Ibhar
  chosen_korean: 이브하르
  alternatives_korean:
  - 지브하르
  lexicon: 고유명사 음역
  rationale: 히브리어 인명은 번역하지 않고 음역해야 하므로, POB의 기본형 Ibhar에 맞춰 이브하르로 옮겼습니다. 영어의 Jibhar는 관행적 대안이지만 본문 읽기에는 직접 음역형이 더 적합합니다.
- source_word: אֱלִישׁוּעַ
  english_pob_choice: Elishua
  chosen_korean: 엘리수아
  alternatives_korean:
  - 엘리샤마
  lexicon: 고유명사 음역
  rationale: 역대기 본문의 마소라 본문에 따른 이름을 직접 음역했습니다. 사무엘하 평행본문의 엘리샤마는 교차본문 변이로서 주석적으로만 남겨야 합니다.
- source_word: אֶלְפָּֽלֶט
  english_pob_choice: Elpelet
  chosen_korean: 엘펠렛
  alternatives_korean:
  - 엘팔렛
  lexicon: 고유명사 음역
  rationale: 히브리어 철자와 모음을 최대한 반영하는 음역을 택했습니다. 영어의 Elpalet은 관행적 철자 대안이지만, 한국어에서는 엘펠렛이 더 직접적입니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  lexicon: 접속사 처리
  rationale: 인명 목록의 단순 병렬 연결이므로, 현대 한국어에서 자연스러운 ‘그리고’를 사용했습니다.
