  lexicon: 고유명사 음역
  rationale: 역대기 본문의 마소라 본문에 따른 이름을 직접 음역했습니다. 사무엘하 평행본문의 엘리샤마는 교차본문 변이로서 주석적으로만 남겨야 합니다.
- source_word: אֶלְפָּֽלֶט
  english_pob_choice: Elpelet
  chosen_korean: 엘펠렛
  alternatives_korean:
  - 엘팔렛
  lexicon: 고유명사 음역
  rationale: 히브리어 철자와 모음을 최대한 반영하는 음역을 택했습니다. 영어의 Elpalet은 관행적 철자 대안이지만, 한국어에서는 엘펠렛이 더 직접적입니다.
- source_word: וְ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  lexicon: 접속사 처리
  rationale: 인명 목록의 단순 병렬 연결이므로, 현대 한국어에서 자연스러운 ‘그리고’를 사용했습니다.
