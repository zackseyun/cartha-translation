base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/007.yaml
  text: and Elishama[a], and Beeliada, and Eliphelet.
  footnotes:
  - marker: a
    text: In the parallel list at 2 Samuel 5:16, the name appears as 'Eliada.' Here the Hebrew text reads 'Beeliada.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 엘리사마와 브엘랴다[a]와 엘리벨렛입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 병행 본문인 사무엘하 5:16에서는 이 이름이 ‘엘랴다’로 나옵니다. 그러나 여기의 히브리어 본문은 ‘브엘랴다’라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  english_pob_choice: and Elishama
  chosen_korean: 엘리사마
  alternatives_korean:
  - 엘리샤마
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 표준적인 한국어 음역형을 사용했습니다. 접속사 ו는 한국어의 열거 연결로 옮겼습니다.
- source_word: וּ/בְעֶלְיָדָע
  english_pob_choice: and Beeliada
  chosen_korean: 브에리야다
  alternatives_korean:
  - 비엘리야다
  - 엘리야다
  lexicon: HALOT
  rationale: 히브리어 자음 형태 בְעֶלְיָדָע를 반영하여 본문 표기를 따랐습니다. 병행본문의 Eliada가 아니라 여기의 Beeliada를 본문대로 살렸습니다.
- source_word: וֶ/אֱלִיפָלֶט
  english_pob_choice: and Eliphelet
  chosen_korean: 엘리벨렛
  alternatives_korean:
  - 엘리펠렛
  - 엘리파렛
  lexicon: HALOT
  rationale: 히브리어 אֱלִיפָלֶט의 음을 따른 고유명사 음역입니다. 영어 POB의 Eliphelet에 해당하는 표준적 한국어 음역을 택했습니다.
theological_decisions:
- issue: 병행본문의 인명 차이
  chosen_reading: 이 절은 마소라 본문의 Beeliada를 본문에 반영하고, 병행본문의 Eliada 차이는 따로 드러내지 않았습니다.
  alternative_readings:
  - 병행본문을 따라 엘리야다로 옮김
  rationale: 기본 본문은 WLC의 वर्तमान 표기를 따르는 것이 원칙이므로, 대조 전승은 번역문이 아니라 주석/각주로 처리하는 편이 본문 충실성을 높입니다.
  doctrine_reference: 본문비평 및 병행본문 처리 원칙
- issue: 열거문의 접속사 처리
  chosen_reading: 세 이름을 단순 열거로 연결했습니다.
  alternative_readings:
  - 문장형으로 풀어 설명함
  rationale: 히브리어 명사열거의 간결함을 유지하는 것이 본문의 기능에 가장 가깝습니다.
  doctrine_reference: 서술 최소화 원칙
