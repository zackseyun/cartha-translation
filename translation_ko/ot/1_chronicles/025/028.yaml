    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  english_pob_choice: for the twenty-first
  chosen_korean: 스물한째 몫이며
  alternatives_korean:
  - 스물한째를 위하여
  - 스물하나째 몫이며
  lexicon: HALOT
  rationale: 이 절은 제비/몫의 순서를 나열하므로, 한국어에서는 순번을 자연스럽게 드러내는 ‘스물한째 몫’으로 옮기고, ל의 배정을 문맥상 반영했습니다.
- source_word: לְ/הוֹתִיר
  english_pob_choice: Hothir
  chosen_korean: 호디르
  alternatives_korean:
  - 호티르
  - 호드르
  lexicon: 고유명사 음역
  rationale: 문맥상 제비를 받은 인명으로 이해되므로 이름은 음역했고, 현대 한국어 표기 관행에 맞춰 ‘호디르’로 옮겼습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그의 자녀들
  - 그의 아들들
  lexicon: HALOT
  rationale: בנים은 여기서 성별이 분명한 ‘아들들’의 뜻이므로, 계보·명단 문맥을 살려 ‘그의 아들들’로 번역했습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제들
  - 그의 친족들
  lexicon: HALOT
  rationale: 문자적으로는 ‘형제들’이므로 이를 유지했고, 씨족 구성원까지 넓힐 수 있는 의미는 본문에 없으므로 ‘친족들’로 풀지 않았습니다.
theological_decisions:
- issue: 명단 형식의 절에서 숫자 표현을 어떻게 한국어로 전달할지
  chosen_reading: 의미를 살려 ‘스물한째 몫’으로 옮겨, 본문이 제비의 순서를 기록한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘스물하나와 호디르’처럼 직역
