base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
  footnotes:
  - marker: a
    text: Or, more formally, 'the prophets with lyres, harps, and cymbals.' The Hebrew can be read with 'the prophets' in apposition to Asaph, Heman, and Jeduthun.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'sons of Asaph, Heman, and Jeduthun'; this may refer to their descendants or guild members, not only immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: '다윗과 군대의 지휘관들은 봉사를 위하여 아삽과 헤만과 여두둔의 아들들[a][b]을 구별했습니다. 그들은 수금과 비파와 심벌즈로 예언하던 이들이었습니다. 그들이 맡은 봉사의 일을 하는 사람들의 수는 다음과 같았습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘수금과 비파와 심벌즈로 예언하는 예언자들.’ 히브리어의 ‘예언자들’은 아삽과 헤만과 여두둔을 동격으로 가리키는 것으로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘아삽, 헤만, 여두둔의 아들들’은 그들의 친아들뿐 아니라 후손이나 길드 구성원까지 가리킬 수 있습니다.
    reason: lexical_alternative
