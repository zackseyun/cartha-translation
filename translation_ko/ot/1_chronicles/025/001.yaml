base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
  footnotes:
  - marker: a
    text: Or, more formally, 'the prophets with lyres, harps, and cymbals.' The Hebrew can be read with 'the prophets' in apposition to Asaph, Heman, and Jeduthun.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'sons of Asaph, Heman, and Jeduthun'; this may refer to their descendants or guild members, not only immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗과 군대의 지휘관들은 아삽의 아들들, 헤만과 여두둔의 아들들을 예배의 일로 구별하여 세웠습니다. 그들은 수금과 비파와 심벌즈를 가지고 예언하였으며, 그 수는 곧 그들의 일에 속한 일꾼들의 수였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘수금과 비파와 심벌즈를 가진 예언자들.’ 히브리어는 ‘예언자들’을 아삽·헤만·여두둔과 동격으로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘아삽, 헤만, 여두둔의 아들들’은 그들의 친아들뿐 아니라 후손이나 길드 구성원까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְדֵּל
  english_pob_choice: set apart
  chosen_korean: 구별하여 세웠습니다
  alternatives_korean:
  - 분리했습니다
  - 나누어 세웠습니다
  - 따로 세웠습니다
  lexicon: HALOT
  rationale: בדל의 ‘나누다/구별하다’ 의미를 살리면서, 예배·직무 문맥에서 단순 분리보다 직무 지정의 뉘앙스를 자연스럽게 담았습니다.
- source_word: שָׂרֵי הַצָּבָא
  english_pob_choice: the commanders of the army
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군대의 지휘자들
  - 군의 장관들
  - 군대의 장수들
  lexicon: HALOT
  rationale: צָבָא를 ‘군대’로, שָׂרִים을 ‘지휘관들’로 옮겨 군사 지도층을 분명하게 하되, 역대기의 행정적 배경도 열어 두었습니다.
- source_word: הנביאים
  english_pob_choice: who prophesied
  chosen_korean: 예언하였으며
  alternatives_korean:
  - 예언자들이었으며
  - 예언하는 자들이며
  - 예언했습니다
  lexicon: HALOT
  rationale: 히브리어의 명사적 형태를 한국어에서는 동사적으로 풀어, 음악과 결부된 예언 행위를 자연스럽게 드러냈습니다.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  english_pob_choice: the men for the work of their service
  chosen_korean: 그들의 일에 속한 일꾼들
  alternatives_korean:
  - 그 봉사의 일을 맡은 사람들
  - 그 일의 일꾼들
  - 그들의 봉사에 속한 사람들
  lexicon: HALOT
  rationale: מְלָאכָה와 עֲבֹדָה의 중첩을 단순한 ‘기술자들’로 좁히지 않고, 지정된 직무에 종사하는 사람들로 넓게 살렸습니다.
theological_decisions:
- issue: הַנְּבִיאִים을 독립 명사로 볼지, 음악을 통한 예언 활동으로 볼지
  chosen_reading: ‘예언하였으며’로 옮겨, 아삽·헤만·여두둔의 무리가 악기 연주를 통해 예언하는 것으로 읽히게 했습니다.
  alternative_readings:
  - ‘예언자들’
  - ‘그 예언자들’
  rationale: 본문은 이들을 단순한 직함으로만 부르기보다 악기와 함께 예언하는 사역으로 연결하므로, 그 긴장을 해소하지 않고 한국어 동사 표현으로 보존했습니다.
  doctrine_reference: source tension preserved; optimal equivalence
