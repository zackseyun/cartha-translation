  source_fidelity: 수정이 필요합니다. 초안의 ‘교사와 학생까지도’와 ‘똑같이 했습니다’는 히브리어의 병렬 범주를 하나의 부가적 범주와 서술로 재구성하여, 누가 무엇을 했는지를 다소 불분명하게 만듭니다. מֵבִין은 문맥상 교사일 수 있으나 본래 ‘이해하는 자, 숙련자’이므로 ‘숙련자’가 더 안전합니다.
  naturalness: ‘작은 자나 큰 자나, 숙련자나 배우는 자나’라는 병렬 표현은 현대 표준 한국어에서 자연스럽고, 제비뽑기에 모두 동등하게 참여하거나 동등하게 배정되었음을 간결하게 드러냅니다. ‘맡을 직무를 정하려고’는 מִשְׁמֶרֶת의 배정 의미를 자연스럽게 표현합니다.
  terminology: ‘제비를 뽑다’는 וַיַּפִּילוּ גּוֹרָלוֹת에 적절합니다. ‘숙련자’는 מֵבִין의 넓은 의미를 보존하며, ‘배우는 자’는 תַּלְמִיד의 학습자 의미를 자연스럽게 반영합니다. ‘작은 자와 큰 자’는 직역 관용구로 유지하되 각주에서 의미를 설명합니다.
