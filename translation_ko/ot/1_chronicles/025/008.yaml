theological_decisions:
- issue: 지위 차이의 무효화 표현
  chosen_reading: ‘작은 자나 큰 자나 … 똑같이 했습니다’로 번역해, 제비뽑기가 지위와 상관없이 공평하게 이루어졌음을 드러냈습니다.
  alternative_readings:
  - ‘작은 자와 큰 자를 막론하고’
  - ‘서열에 상관없이’
  rationale: 본문의 관용구는 단순한 나열이 아니라 모든 등급을 동일하게 대우했다는 의미이므로, 이를 한국어 문장 전체에서 분명히 보여 주는 것이 소스 충실성과 해설성을 함께 만족합니다.
  doctrine_reference: 공평한 분배와 공동체 내 역할 배정에 관한 성경적 원리
