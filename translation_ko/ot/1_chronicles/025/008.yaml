  chosen_korean: 임무
  alternatives_korean:
  - 직무
  - 책임
  - 맡은 일
  lexicon: WLC/HALOT
  rationale: 문맥상 성전/레위인의 배정된 역할을 가리키므로 ‘임무’가 기능적 의미를 간결하게 살립니다.
- source_word: כַּ/קָּטֹן כַּ/גָּדֹול
  english_pob_choice: the small as well as the great
  chosen_korean: 작은 자나 큰 자나
  alternatives_korean:
  - 작은 자와 큰 자
