  - 낮은 자나 높은 자나
  lexicon: WLC/HALOT
  rationale: 히브리어 관용구인 ‘작은/큰’은 신분이나 지위의 차이를 막론한 동등 처리를 뜻하므로, 그 뉘앙스를 살려 ‘작은 자나 큰 자나’로 옮겼습니다.
- source_word: מֵבִין עִם תַּלְמִיד
  english_pob_choice: the teacher with the student
  chosen_korean: 교사와 학생까지도
  alternatives_korean:
  - 이해하는 자와 배우는 자까지도
  - 교사와 학생
  - 전문가와 배우는 사람까지도
  lexicon: WLC/HALOT
  rationale: מֵבִין은 문자적으로는 ‘이해하는 자’이지만, 뒤의 תַּלְמִיד과 대응되는 관계를 현대 한국어에서 가장 분명하게 드러내기 위해 ‘교사와 학생’으로 옮겼습니다.
theological_decisions:
- issue: 지위 차이의 무효화 표현
  chosen_reading: ‘작은 자나 큰 자나 … 똑같이 했습니다’로 번역해, 제비뽑기가 지위와 상관없이 공평하게 이루어졌음을 드러냈습니다.
  alternative_readings:
  - ‘작은 자와 큰 자를 막론하고’
  - ‘서열에 상관없이’
  rationale: 본문의 관용구는 단순한 나열이 아니라 모든 등급을 동일하게 대우했다는 의미이므로, 이를 한국어 문장 전체에서 분명히 보여 주는 것이 소스 충실성과 해설성을 함께 만족합니다.
  doctrine_reference: 공평한 분배와 공동체 내 역할 배정에 관한 성경적 원리
