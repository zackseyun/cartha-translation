source:
  edition: WLC
  text: וַ/יַּפִּ֜ילוּ גּוֹרָל֣וֹת מִשְׁמֶ֗רֶת לְ/עֻמַּת֙ כַּ/קָּטֹ֣ן כַּ/גָּד֔וֹל מֵבִ֖ין עִם תַּלְמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/008.yaml
  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
  footnotes:
  - marker: a
    text: Or 'the one who understands with the learner,' preserving the more literal sense of מֵבִין as 'one who understands' or 'expert.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'small and great,' an idiom meaning all were treated alike regardless of rank or status.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 맡을 직무를 정하려고 제비를 뽑았습니다. 작은 자나 큰 자나[a], 숙련자나 배우는 자나[b] 모두 제비를 뽑았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘작은 자와 큰 자’는 낮은 지위의 사람과 높은 지위의 사람을 모두 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 מֵבִין은 문자적으로 ‘이해하는 자’이며, 여기서는 ‘숙련자’ 또는 ‘전문가’를 뜻할 수 있습니다. 뒤의 תַּלְמִיד은 ‘배우는 자’ 또는 ‘학생’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָל֣וֹת
  english_pob_choice: they cast lots
  chosen_korean: 제비를 뽑았습니다
  alternatives_korean:
  - 제비를 던졌습니다
  - 제비를 가렸습니다
  - 제비를 뽑아 정했습니다
  lexicon: WLC/HALOT
  rationale: 히필형과 ‘lots’의 결합은 선발을 위한 제비뽑기 관용구이므로, 자연스러운 한국어로 ‘제비를 뽑다’가 가장 직접적입니다.
- source_word: מִשְׁמֶרֶת
