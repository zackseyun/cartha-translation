  text: The third was Zaccur[a], his sons and his brothers, twelve.
  footnotes:
  - marker: a
    text: Or, in context, 'the third lot fell to Zaccur; his sons and his brothers were twelve.' The noun 'lot' is implied from the surrounding verses rather than repeated here.
    reason: lexical_alternative
translation:
  language: ko
  text: 셋째는 삭굴이며, 그의 아들들과 그의 형제들은 열두 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘셋째 몫은’이라고 할 수도 있습니다. ‘몫’은 앞뒤 절에서 암시되지만 이 절의 히브리어 본문에는 반복되어 나오지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  english_pob_choice: The third
  chosen_korean: 셋째는
  alternatives_korean:
  - 셋째
  - 세 번째는
  - 셋째 몫은
  lexicon: HALOT
  rationale: 문맥상 이어지는 분배 목록의 항목 표지이므로, 영어 POB의 간결한 목록형 표현을 따라 한국어도 자연스럽게 ‘셋째는’으로 옮겼습니다.
- source_word: זַכּוּר
  english_pob_choice: Zaccur
  chosen_korean: 자쿠르
  alternatives_korean:
  - 작쿠르
  - 자꾸르
  lexicon: HALOT
  rationale: 고유명사는 음역이 원칙이므로, 현대 외래어 표기 관행에 맞춰 ‘자쿠르’로 옮겼습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 자식들
  lexicon: HALOT
  rationale: 3인칭 남성 복수 소유형이므로 성별을 지운 ‘자녀들’보다 직역에 가까운 ‘아들들’을 유지했습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제들 및 친족들
