  lexicon: HALOT
  rationale: אחים의 기본 의미를 살려 ‘형제들’로 옮겼고, 구체적 형제 관계를 흐리는 확장 번역은 피했습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열둘
  alternatives_korean:
  - 열두 명
  - 열둘입니다
  lexicon: HALOT
  rationale: 히브리어의 명사 없이 끝나는 수사 구조를 반영해, 목록의 총수를 간결하게 ‘열둘’로 처리했습니다.
