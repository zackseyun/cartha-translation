lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  english_pob_choice: The third
  chosen_korean: 셋째는
  alternatives_korean:
  - 셋째
  - 세 번째는
  - 셋째 몫은
  lexicon: HALOT
  rationale: 문맥상 이어지는 분배 목록의 항목 표지이므로, 영어 POB의 간결한 목록형 표현을 따라 한국어도 자연스럽게 ‘셋째는’으로 옮겼습니다.
- source_word: זַכּוּר
  english_pob_choice: Zaccur
  chosen_korean: 자쿠르
  alternatives_korean:
  - 작쿠르
  - 자꾸르
  lexicon: HALOT
  rationale: 고유명사는 음역이 원칙이므로, 현대 외래어 표기 관행에 맞춰 ‘자쿠르’로 옮겼습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
