  - severity: low
    issue: 영어 감사 기록에 있는 세 주석의 앵커와 내용이 한국어 초안에 누락됨
    rationale: 대안적 읽기와 이형 표기 정보를 보존하려면 해당 인명에 주석 앵커를 달아야 합니다. 이는 본문 의미를 변경하지 않습니다.
