id: 1CH.25.4
reference: 1 Chronicles 25:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הֵימָ֑ן בְּנֵ֣י הֵימָ֡ן בֻּקִּיָּ֡הוּ מַתַּנְיָ֡הוּ עֻ֠זִּיאֵל שְׁבוּאֵ֨ל וִֽ/ירִימ֜וֹת חֲנַנְיָ֣ה חֲנָ֗נִי אֱלִיאָ֤תָה גִדַּ֨לְתִּי֙ וְ/רֹמַ֣מְתִּי עֶ֔זֶר יָשְׁבְּקָ֣שָׁה מַלּ֔וֹתִי הוֹתִ֖יר מַחֲזִיאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
  footnotes:
  - marker: a
    text: Some interpreters have suggested that part of this list can be read as a phrase rather than only as names, especially around 'Giddalti' and 'Romamti-ezer'; in context, this translation treats them as personal names in a roster.
    reason: alternative_reading
  - marker: b
    text: '''Jeremoth'' may also be rendered ''Jerimoth.'''
    reason: lexical_alternative
  - marker: c
    text: '''Shebuel'' may also be rendered ''Shubael.'''
    reason: lexical_alternative
translation:
  language: ko
  text: '헤만에게: 헤만의 아들들은 부키야, 맛다냐, 웃시엘, 세부엘, 예리못, 하나냐, 하나니, 엘리아다, 깃달티, 로맘티에셀이, 요스베카사, 말로디, 호디르, 마하시옷입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/הֵימָן
  english_pob_choice: To Heman
  chosen_korean: 헤만에게
  alternatives_korean:
  - 헤만에게로
  - 헤만을 위하여
  lexicon: HALOT
  rationale: לְ의 배정·귀속 뉘앙스를 따라 이 명단이 헤만에게 배속된 항목임을 자연스럽게 드러내기 위해 ‘-에게’를 택했습니다.
- source_word: בְּנֵי הֵימָן
  english_pob_choice: the sons of Heman
  chosen_korean: 헤만의 아들들은
  alternatives_korean:
  - 헤만의 자손들은
  - 헤만의 아들들
  lexicon: HALOT
  rationale: 명단 맥락에서 בני는 혈연적 후손을 가리키되, 여기서는 직역감이 분명한 ‘아들들’이 가장 적합합니다.
- source_word: וִֽ/ירִימוֹת
  english_pob_choice: Jeremoth
  chosen_korean: 예리못
  alternatives_korean:
  - 예레못
  - 예리모트
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 자음열에 맞춰 현대 음역으로 옮기되, 한국어 본문에서 읽기 쉬운 형태를 선택했습니다.
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  english_pob_choice: Romamti-ezer
  chosen_korean: 로맘티에셀
  alternatives_korean:
  - 로맘티-에셀
  - 로맘티에제르
  - ‘나는 도움을 높였다’
  lexicon: HALOT
  rationale: 문맥상 동사구가 아니라 복합 고유명사로 처리해야 하므로 이름성을 보존하되, 한국어에서는 하이픈보다 붙여 읽는 방식이 더 자연스러워 붙여 적었습니다.
- source_word: יָשְׁבְּקָשָׁה
  english_pob_choice: Joshbekashah
  chosen_korean: 요스베카사
  alternatives_korean:
  - 요시베카사
  - 요슈베카사
  lexicon: 고유명사 표기 관행
  rationale: 표준 음역에 따라 초성의 j/y 계열을 한국어 ‘요-’로 옮기고, 어형을 과도하게 해석하지 않고 고유명사로 처리했습니다.
theological_decisions:
- issue: 이 목록의 일부 이름들을 문장으로 읽을지, 사람 이름 목록으로 읽을지
  chosen_reading: 헤만의 아들들에 속한 사람 이름들의 목록으로 읽었습니다.
  alternative_readings:
  - ‘내가 높였다’류의 의미가 드러나는 구절로 읽기
  rationale: 이 문맥은 성전 음악 직무 배치 명단이므로, 이름들 속에 숨은 문장화를 만들기보다 인명 목록으로 옮기는 것이 저자의 의도에 가장 충실합니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
