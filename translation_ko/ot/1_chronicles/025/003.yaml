  text: לִ/ידוּת֑וּן בְּנֵ֣י יְדוּת֡וּן גְּדַלְיָ֡הוּ וּ/צְרִ֡י וִֽ֠/ישַׁעְיָהוּ חֲשַׁבְיָ֨הוּ וּ/מַתִּתְיָ֜הוּ שִׁשָּׁ֗ה עַל֩ יְדֵ֨י אֲבִי/הֶ֤ם יְדוּתוּן֙ בַּ/כִּנּ֔וֹר הַ/נִּבָּ֕א עַל הֹד֥וֹת וְ/הַלֵּ֖ל לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
  footnotes:
  - marker: a
    text: The Hebrew text lists five names here but then says 'six.' Some interpreters infer that another son is omitted from the list, or that Jeduthun himself is counted.
    reason: textual_variant
  - marker: b
    text: Or 'prophesying with the lyre for thanksgiving and praise to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여두둔에 대하여는 여두둔의 아들들 곧 그달랴, 스리, 여사야, 하사뱌, 맛디땨, 여섯 명이니 — 그들의 아버지 여두둔의 지휘 아래, 그는 수금을 타며 감사와 찬양으로 예언하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이름이 다섯 개인데 여기서는 ‘여섯’이라고 합니다. 누락된 아들이 있었거나, 여두둔 자신을 포함했을 가능성이 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘수금을 타며 감사와 찬양을 예언하는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  english_pob_choice: Of Jeduthun
  chosen_korean: 여두둔에 대하여는
  alternatives_korean:
  - 여두둔의
  - 여두둔에게 속한
  lexicon: HALOT
  rationale: 장부식 표제의 ל를 한국어로 자연스럽게 풀어, 해당 분조의 표제를 드러내는 표현으로 옮겼습니다.
- source_word: בְּנֵי יְדוּתוּן
  english_pob_choice: the sons of Jeduthun
  chosen_korean: 여두둔의 아들들
  alternatives_korean:
  - 여두둔의 자손들
  - 여두둔의 아들들
  lexicon: HALOT
  rationale: 문맥상 제의 음악 직무를 맡은 가문 구성원을 가리키므로, 직역적이면서도 자연한 ‘아들들’을 택했습니다.
- source_word: בַּכִּנּוֹר
  english_pob_choice: with the lyre
  chosen_korean: 수금을 타며
  alternatives_korean:
  - 비파를 타며
  - 거문고를 타며
  lexicon: HALOT
  rationale: כִּנּוֹר의 표준적인 한국어 대응을 전통적으로는 ‘비파’로도 옮기지만, 본문은 연주 행위를 강조하므로 ‘수금을 타며’로 처리했습니다.
- source_word: הַנִּבָּא עַל הֹדוֹת וְהַלֵּל
  english_pob_choice: who prophesied ... giving thanks and praise
  chosen_korean: 감사와 찬양으로 예언하였습니다
  alternatives_korean:
  - 감사와 찬양을 하며 예언하였습니다
  - 감사와 찬양을 두고 예언하였습니다
  lexicon: HALOT
  rationale: נבא의 예언 행위를 그대로 살리되, ‘עַל הֹדוֹת וְהַלֵּל’의 기능을 수단/양태로 받아 한국어에서 자연스럽게 연결했습니다.
theological_decisions:
- issue: 레위 찬양 사역을 ‘예언’으로 부르는 표현
  chosen_reading: 본문의 예언 언어를 약화시키지 않고 ‘예언하였습니다’를 유지했습니다.
  alternative_readings:
  - 찬양을 인도하였습니다
  - 영감받은 찬양을 드렸습니다
  rationale: 역대기는 성전 음악을 단순한 공연이 아니라 예언적 행위로 서술하므로, 그 신학적 범주를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3, source-driven theological tension
