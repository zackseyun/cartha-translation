  lexicon: HALOT
  rationale: 명단 공식에서 ‘형제들’은 공동 배속된 친족 집단을 가리키는 가장 직접적인 대응어이므로 그대로 살렸습니다.
- source_word: שְׁנֵים עָשָׂר
