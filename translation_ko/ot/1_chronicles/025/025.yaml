  source_fidelity: 히브리어의 배정 목록 공식과 인명 및 수량을 대체로 반영합니다. 다만 한글 인명 ‘하난니’는 חֲנָנִי의 통용 음역 ‘하나니’로 고쳐야 합니다. 또한 ‘그의 아들과 그의 형제들이 열둘’이라는 현재 문장은 열둘이라는 수가 하나니를 제외한 뒤의 집단만 가리키는 듯하게 읽힐 수 있으므로, 원문의 목록 전체에 수량이 붙는 구조를 드러내는 것이 좋습니다.
  naturalness: ‘열여덟째는 … 모두 열둘입니다’는 반복되는 명단의 문체를 유지하면서 현대 표준 한국어로 자연스럽습니다. ‘아들들’과 ‘형제들’을 병렬로 명시하면 수량 집계의 범위도 명료해집니다.
  terminology: חֲנָנִי는 ‘하나니’로 표기하는 것이 한국어 성경의 통용 인명 표기 및 히브리어 음가에 적절합니다. בָּנָיו와 וְאֶחָיו는 각각 ‘그의 아들들’과 ‘그의 형제들’로 유지합니다. 각주에서는 원문에 ‘제비’가 명시되지 않았다는 점을 보존하되, 문맥적 함의를 단정적으로 확대하지 않습니다.
