  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''under the hand of''; the idiom denotes direction, supervision, or agency.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in song' or 'in singing.'
    reason: lexical_alternative
  - marker: c
    text: The exact distinction between the instruments rendered 'harps' and 'lyres' is uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 이 모든 사람은 그들의 아버지의 지휘 아래, 야훼의 집에서의 음악에 맞추어 — 즉 심벌즈, 수금, 그리고 비파로 — 하나님의 집의 봉사를 위해, 왕의 지휘 아래 있었습니다. 아삽과 여두둔과 헤만입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘손 아래에’라는 뜻이지만, 여기서는 지휘·감독의 관용적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노래 안에서’ 또는 ‘노래로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘수금’과 ‘비파’로 옮긴 두 악기의 정확한 구분은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  english_pob_choice: under the direction of their father
  chosen_korean: 그들의 아버지의 지휘 아래
  alternatives_korean:
  - 그들의 아버지의 손 아래
  - 그들의 아버지에 의해
  lexicon: HALOT
  rationale: 직역의 ‘손’ 관용구를 살리기보다, 이 문맥의 감독·통솔 의미를 한국어로 자연스럽게 드러내기 위해 ‘지휘 아래’로 옮겼습니다.
- source_word: בַּשִּׁיר
  english_pob_choice: in the music
  chosen_korean: 음악에 맞추어
  alternatives_korean:
  - 노래 가운데
  - 노래로
  lexicon: HALOT
  rationale: 악기들과 성전 봉사가 함께 나오는 문맥이므로 단일한 ‘노래’보다 집합적 의미인 ‘음악’이 더 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: POB default
  rationale: POB의 표준 원칙에 따라 언약 이름 יְהוָה는 ‘야훼’로 옮기고, 전통적 교회 용어인 ‘여호와’는 쓰지 않았습니다.
- source_word: בִּמְצִלְתַּיִם נְבָלִים וְכִנֹּרוֹת
  english_pob_choice: with cymbals, harps, and lyres
  chosen_korean: 즉 심벌즈, 수금, 그리고 비파로
  alternatives_korean:
  - 즉 제금, 비파, 그리고 수금으로
  - 즉 심벌즈, 하프, 그리고 리라로
  lexicon: HALOT
  rationale: 세 악기의 구분을 유지하되, 한국어에서 통용성과 구별성을 함께 고려해 ‘심벌즈, 수금, 비파’로 옮겼습니다.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  english_pob_choice: for the service of the house of God
  chosen_korean: 하나님의 집의 봉사를 위해
  alternatives_korean:
  - 하나님의 집의 섬김을 위해
  - 하나님의 집의 일을 위해
  lexicon: HALOT
  rationale: 제의적·성전적 맥락의 עֲבֹדָה를 ‘봉사’로 옮겨, 일반적인 ‘일’보다 예배 봉사의 성격을 살렸습니다.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  english_pob_choice: under the direction of the king
  chosen_korean: 왕의 지휘 아래
  alternatives_korean:
  - 왕의 명령 아래
  - 왕의 손 아래
  lexicon: HALOT
  rationale: 앞의 동일한 관용구와 평행을 이루도록, 왕의 승인이나 감독이라는 뜻을 ‘지휘 아래’로 일관되게 표현했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 여호와/야훼를 가리키는 언약명 יְהוָה를 직접 사용하므로, POB 원칙에 따라 ‘야훼’로 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
