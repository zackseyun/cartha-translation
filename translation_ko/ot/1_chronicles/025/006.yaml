revisions:
- from: 이 모든 사람은 그들의 아버지의 지휘 아래, 야훼의 집에서의 음악에 맞추어 — 즉 심벌즈, 수금, 그리고 비파로 — 하나님의 집의 봉사를 위해, 왕의 지휘 아래 있었습니다. 아삽과 여두둔과 헤만입니다.[a][b][c]
  to: 이 모든 사람은 아버지의 지휘 아래[a] 야훼의 집에서 음악을 맡아[b] 심벌즈와 수금과 비파로[c] 하나님의 집에서 봉사하기 위하여, 왕과 아삽과 여두둔과 헤만의 지휘 아래 있었습니다.
  rationale: 음악 담당이라는 בַּשִּׁיר의 집합적·직무적 의미를 ‘음악을 맡아’로 반영하고, 악기는 그 봉사의 수단으로 연결했습니다. 마지막 열거는 원문의 다소 압축된 통솔 관계를 한국어에서 ‘왕과 아삽과 여두둔과 헤만의 지휘 아래’로 풀어, 이름들을 독립적인 명사문으로 오독하지 않게 했습니다. 이는 왕의 감독과 세 지도자의 역할이 함께 제시되는 구문을 자연스럽게 보존하는 번역입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:49Z'
