  source_fidelity: 초안의 ‘음악에 맞추어’는 בַּשִּׁיר(음악/노래 가운데)의 뜻을 ‘음악에 맞춰 연주하다’로 바꾸어, 원문의 담당·봉사 문맥을 충분히 반영하지 못합니다. 또한 끝의 아삽·여두둔·헤만은 독립 서술문 ‘…입니다’로 처리할 수 없으며, 왕의 감독 및 이 세 음악 지도자와 관련된 통솔 관계 안에 연결되어야 합니다.
  naturalness: ‘그들의 아버지의 지휘’와 ‘하나님의 집의 봉사’는 다소 직역투입니다. ‘아버지의 지휘’, ‘하나님의 집에서 봉사하기 위하여’가 현대 표준어 문장으로 더 자연스럽습니다. 악기 열거도 본문 안에 자연스럽게 연결하는 편이 좋습니다.
  terminology: 야훼, 아삽, 여두둔, 헤만은 적절합니다. נְבָלִים와 כִּנֹּרוֹת의 불확실한 구분은 ‘수금’과 ‘비파’로 구별하여 유지하되 각주로 유보하는 것이 적절합니다.
