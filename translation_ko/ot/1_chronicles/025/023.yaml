  lexicon: BDB
  rationale: 인명은 음역하되, 히브리어 형태 חֲנַנְיָהוּ를 비교적 직접적으로 반영하는 표기를 택했습니다.
- source_word: בָּנָיו וְאֶחָיו
  english_pob_choice: his sons and his brothers
  chosen_korean: 그의 아들들과 그의 형제들
  alternatives_korean:
  - 그의 아들들과 친족들
  - 그의 자녀들과 형제들
  lexicon: HALOT
  rationale: בָּנִים은 ‘아들들’이 직접적 의미이고, אָח은 여기서 동류 집단의 ‘형제들’로 옮기는 것이 가장 자연스럽습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열둘입니다
  alternatives_korean:
  - 열둘
  - 열두 명입니다
  lexicon: HALOT
  rationale: 마지막 수사는 앞의 집단 전체의 수를 가리키므로, 한국어에서는 문장 종결형으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 본문의 ‘열둘’이 가리키는 범위
  chosen_reading: ‘하나냐후와 그의 아들들과 그의 형제들’ 전체의 수를 열둘로 이해합니다.
  alternative_readings:
  - 하나냐후의 아들들과 형제들만 열둘로 이해
  - 본문의 수를 별도 배열 정보로만 처리
  rationale: 히브리어는 서술동사 없이 목록 끝에 총수를 붙이는 방식이므로, 가장 직접적인 독법은 앞선 집단 전체의 인원 수를 나타내는 것으로 읽는 것입니다.
  doctrine_reference: 본문 문맥 해석
