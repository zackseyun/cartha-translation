  - 열일곱째 분배는
  lexicon: HALOT
  rationale: 문맥상 제비뽑기 목록의 배정을 뜻하므로, 한국어에서는 목적어 표지보다 항목 표제로 자연스러운 「열일곱째는」이 원문의 순번·배정 의미를 가장 직접적으로 드러냅니다.
- source_word: לְיָשְׁבְּקָשָׁה
  english_pob_choice: to Joshbekashah
  chosen_korean: 요스브갓사에게
  alternatives_korean:
  - 요스벡사에게
  - 요스브카사에게
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 한국어 음역으로 옮겼고, לְ의 방향·귀속 관계를 자연스럽게 살리기 위해 「-에게」를 사용했습니다.
- source_word: בָּנָיו וְאֶחָיו
  english_pob_choice: his sons and his brothers
  chosen_korean: 그의 아들과 그의 형제들
  alternatives_korean:
  - 그의 아들들과 그의 형제들
  - 그의 자녀들과 그의 형제들
  lexicon: HALOT
  rationale: בָּנָיו는 일반적 자녀가 아니라 아들을 가리키므로 「아들」로 좁혀 옮겼고, וְאֶחָיו는 혈족 포함 가능성이 있어도 직접 의미인 「형제들」을 유지했습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열두 명입니다
  alternatives_korean:
