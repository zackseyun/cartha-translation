base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/022.yaml
  text: 'For the fifteenth[a], to Jeremoth: his sons and his brothers[b], twelve.'
  footnotes:
  - marker: a
    text: Literally, 'For the fifteenth, to Jeremoth.' The word 'lot' is implied by the repeated pattern in this chapter but is not stated in Hebrew here.
    reason: cross_reference
  - marker: b
    text: Or 'for Jeremoth.' The Hebrew preposition can mark assignment in this list.
    reason: lexical_alternative
translation:
  language: ko
  text: 열다섯째는 여레못에게, 그의 아들들과 그의 형제들이 모두 열둘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘제비’가 직접 나오지 않지만, 이 장의 반복되는 배정 공식에서 ‘제비’가 암시됩니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘여레못을 위하여’. 히브리어 לִירֵמוֹת의 접두사 ל는 이 목록에서 배정 대상을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  english_pob_choice: For the fifteenth
  chosen_korean: 열다섯째는
  alternatives_korean:
  - 열다섯째는 그의 몫으로
  - 열다섯째는 그에게
  lexicon: HALOT
  rationale: 이 표현은 이 장의 반복되는 제비/배정 공식 안에서 서수값을 가지므로, 본문에 없는 ‘제비’는 본문에 넣지 않고 한국어도 간결하게 서수 중심으로 옮겼습니다.
- source_word: לִירֵמוֹת
  english_pob_choice: to Jeremoth
  chosen_korean: 여레못에게
  alternatives_korean:
  - 여레못을 위하여
  - 여레못에게로
  lexicon: HALOT
  rationale: 앞의 ל는 이 목록에서 배정 대상임을 표시하므로 ‘-에게’로 자연스럽게 풀었습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들과
  alternatives_korean:
  - 그의 자녀들과
  - 그의 아들들
  lexicon: HALOT
  rationale: 히브리어가 성별 구분이 있는 ‘아들들’을 직접 가리키므로, 중립화하지 않고 그대로 반영했습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제들과
  - 그의 친족들
  lexicon: HALOT
  rationale: 문맥상 혈연·가족 집단을 가리키는 ‘형제들’을 직역하되, 한국어에서는 자연스러운 열거로 정리했습니다.
theological_decisions:
- issue: 본문에 명시되지 않은 ‘제비’ 보충 여부
  chosen_reading: 본문에는 없는 ‘제비’를 본문에 넣지 않고, 반복되는 장르적 공식은 역주 없이 서수 표현으로만 반영했습니다.
  alternative_readings:
  - 열다섯째 제비는
  - 열다섯째 몫은
  rationale: 영문 POB도 ‘lot’이 암시되지만 히브리어에 없다고 주석하므로, 본문은 원문에 충실하게 유지하는 편이 더 투명합니다.
  doctrine_reference: 본문 충실성 및 주석 분리 원칙
- issue: 숫자 ‘열둘’의 통사 처리
  chosen_reading: ‘그의 아들들과 그의 형제들 열둘입니다’로 두어 총수를 집단 전체에 귀속시켰습니다.
  alternative_readings:
  - 그의 아들들, 그의 형제들 열둘입니다
  - 그의 아들들과 그의 형제들, 모두 열둘입니다
  rationale: 히브리어는 항목 전체의 수를 말하므로, 한국어도 그 수가 해당 집단의 총합임을 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: 직역-의미 균형 원칙
