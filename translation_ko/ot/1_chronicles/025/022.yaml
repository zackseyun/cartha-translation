  source_fidelity: 히브리어의 배정 표지 ל, 여레못이라는 이름, ‘그의 아들들과 그의 형제들’, 그리고 총수 열둘을 대체로 충실히 반영했습니다. 다만 한국어 본문의 ‘열다섯째는’은 원문의 ‘열다섯째에게/열다섯째를 위하여’라는 배정 구조를 다소 약화시키며, [a] 각주가 설명하는 ‘제비’의 암시와도 연결이 약합니다.
