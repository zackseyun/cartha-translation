  - 감독 아래
  lexicon: HALOT
  rationale: 직역인 '손으로'는 한국어에서 뜻이 모호하므로, 본문의 관리·통제 의미를 드러내는 '지휘 아래'로 옮겼습니다.
- source_word: הַנִּבָּא
