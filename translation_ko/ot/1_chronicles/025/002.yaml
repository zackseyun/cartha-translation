  source_fidelity: 원문의 명단 표제와 반복되는 ‘아삽의 아들들’을 유지해야 하며, 단수 분사 הַנִּבָּא는 아들들이 아니라 아삽을 수식합니다. 따라서 아삽이 왕의 지시에 따라 예언했고, 그 아들들은 그 아삽의 지휘 아래 있었다는 관계를 한국어 문장에서 분명히 해야 합니다.
