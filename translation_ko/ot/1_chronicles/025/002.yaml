  rationale: 히브리어 인명 נְתַנְיָה를 음역하되, 한국어 성경에서 널리 익숙한 전통적 형태를 우선 반영했습니다.
- source_word: עַל יַד / עַל יְדֵי
  english_pob_choice: under the direction of / under the direction of
  chosen_korean: 지휘 아래
  alternatives_korean:
