revisions:
- from: 아삽의 아들들은 이러합니다. 자쿠르, 요셉, 느다냐, 아사렐라 — 아삽의 아들들이며 — 아삽의 지휘 아래, 곧 왕의 지휘 아래 예언하던 이들입니다.[a]
  to: 아삽의 아들들은 삭굴, 요셉, 느다냐, 아사렐라입니다. 이들은 왕의 지시에 따라 예언하던 아삽의 지휘 아래에 있었습니다.[a]
  rationale: 명단의 내용은 그대로 보존하되, 단수 분사가 아삽을 수식한다는 문법적 관계를 명확히 했습니다. ‘왕의 지시에 따라 예언하던 아삽’은 원문의 두 עַל־יַד 관용구가 각각 아삽에 대한 아들들의 종속과 왕에 대한 아삽의 종속을 나타내는 구조를 자연스럽게 드러냅니다. 각주도 두 관용구의 직역 가능성을 제시하면서 본문의 의미를 변경하지 않습니다.
