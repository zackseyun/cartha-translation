translation:
  language: ko
  text: 아삽의 아들들은 삭굴, 요셉, 느다냐, 아사렐라입니다. 이들은 왕의 지시에 따라 예언하던 아삽의 지휘 아래에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하면, ‘아삽의 손을 통하여 … 왕의 손을 통하여.’ 이 히브리어 관용구는 대행, 감독 또는 지휘의 뜻을 나타냅니다.
    reason: lexical_alternative
