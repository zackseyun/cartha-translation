  - 예언자로 섬기던
  lexicon: HALOT
  rationale: 성전 음악 맥락 속에서도 נבא의 예언 행위를 약화시키지 않기 위해 '예언하던'으로 옮겨 현재적 활동성을 살렸습니다.
theological_decisions:
- issue: 아삽의 음악 사역과 '예언'의 관계
  chosen_reading: 본문의 신학적 진술을 유지해, 아삽의 활동을 단순한 연주가 아니라 '예언'으로 번역했습니다.
  alternative_readings:
  - 영감받아 노래하던
  - 예언적인 음악을 하던
  rationale: 역대기의 용례는 성전 음악가들의 활동을 נבא로 표현하므로, 이를 완화하면 본문이 주장하는 예언적 성격이 희석됩니다.
  doctrine_reference: 원어 우선 원칙; 본문이 지닌 예언-예배의 긴장을 보존
