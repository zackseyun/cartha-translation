  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
  footnotes:
  - marker: a
    text: Or 'by the hand of Asaph ... by the hand of the king.' The Hebrew idiom denotes agency, supervision, or direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 아삽의 아들들은 이러합니다. 자쿠르, 요셉, 느다냐, 아사렐라 — 아삽의 아들들이며 — 아삽의 지휘 아래, 곧 왕의 지휘 아래 예언하던 이들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아삽의 손으로 … 왕의 손으로.' 이 히브리어 관용구는 대행, 감독, 또는 지휘의 의미를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי / בְּנֵי אָסָף
  english_pob_choice: Of the sons of Asaph / sons of Asaph
  chosen_korean: 아삽의 아들들은
  alternatives_korean:
  - 아삽의 아들들에게
  - 아삽의 아들들 가운데
  lexicon: HALOT
  rationale: 계보 목록의 표제를 자연스럽게 살리면서도, 반복되는 '아삽의 아들들'을 유지해 소속 관계를 분명히 했습니다.
- source_word: זַכּוּר
