translation:
  language: ko
  text: 여덟째는 여사야와 그의 아들들과 그의 형제들로, 모두 열두 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '문맥을 반영하면 ‘여덟째 몫: 여사야, 그의 아들들과 그의 형제들, 열둘’로도 옮길 수 있습니다. 이 절의 ‘몫’은 앞뒤 목록 문맥에서 보충되는 말입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  english_pob_choice: the eighth
  chosen_korean: 여덟째는
  alternatives_korean:
  - 여덟째 몫은
  - 여덟째 분배는
  lexicon: HALOT
  rationale: 본문에는 ‘제비/몫’에 해당하는 단어가 직접 없으므로, 영어 POB처럼 문맥이 요구하는 순번만 살려 ‘여덟째는’으로 옮겼습니다.
- source_word: יְשַׁעְיָהוּ
  english_pob_choice: Jeshaiah
  chosen_korean: 여사야
  alternatives_korean:
  - 여사야후
  lexicon: 표준 음역
  rationale: 인명은 번역하지 않고 음역해야 하며, 한국어 본문에서는 읽기 자연성을 위해 통용되는 음역형 ‘여사야’를 택했습니다.
- source_word: בָּנָיו וְאֶחָיו
  english_pob_choice: his sons and his brothers
  chosen_korean: 그의 아들들과 그의 형제들
  alternatives_korean:
  - 그의 자녀들과 그의 형제들
  - 그의 아들들과 그의 친족들
  lexicon: HALOT
  rationale: בנים은 여기서 남성 복수 ‘아들들’이 가장 직접적이고, אחים도 기본 의미인 ‘형제들’로 유지해 가족 관계의 구체성을 보존했습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 모두 열두 명이었습니다
  alternatives_korean:
  - 열둘이었습니다
  - 열두 명이었습니다
  lexicon: HALOT
  rationale: 히브리어는 동사를 생략한 간결한 열거식 문장이므로, 한국어에서는 누계임을 분명히 하되 과도한 설명 없이 ‘모두 열두 명이었습니다’로 자연스럽게 옮겼습니다.
