    text: 직역하면 ‘일곱째, 예사렐라, 그의 아들과 그의 형제들, 열둘’입니다. ‘돌아갔습니다’는 앞뒤 문맥의 제비배정 공식을 따라 보충한 표현입니다.
    reason: lexical_alternative
