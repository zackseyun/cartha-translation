base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/021.yaml
  text: The fourteenth was Mattithiah[a], his sons and his brothers, twelve.
  footnotes:
  - marker: a
    text: Literally, 'For fourteen, Mattithiah.' In context throughout this list, the number refers to the fourteenth lot or division.
    reason: lexical_alternative
translation:
  language: ko
  text: 열네 번째는 맛디디야와 그의 아들들과 그의 형제들, 모두 열두 명입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אַרְבָּעָה עָשָׂר
  english_pob_choice: The fourteenth
  chosen_korean: 열네 번째는
  alternatives_korean:
  - 열네 번째는
  - 열네 번째 몫은
  - 열네 번째로는
  lexicon: WLC
  rationale: 이 절은 제비/분류 목록의 반복 공식이므로, 본문에 없는 ‘제비’는 덧붙이지 않고 순번만 자연스럽게 드러냈습니다.
- source_word: מַתִּתְיָהוּ
  english_pob_choice: Mattithiah
  chosen_korean: 맛디디야
  alternatives_korean:
  - 맛디디야후
  - 마타디야
  lexicon: 한국어 성경 인명 관행
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역을 따랐습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 아들들
  lexicon: WLC
  rationale: 히브리어는 성별이 분명한 ‘아들들’을 뜻하므로, 일반화하지 않고 직접적으로 옮겼습니다.
- source_word: וְ/אֶחָי/ו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제들
  - 그의 친족들
  - 그의 형제자매들
  lexicon: WLC
  rationale: 히브리어는 동류 집단의 ‘형제들’을 가리키므로, 더 넓은 ‘친족들’보다 원문에 가깝게 옮겼습니다.
theological_decisions:
- issue: 총원 표현의 자연스러운 처리
  chosen_reading: 마지막에 ‘모두 열두 명입니다’로 총원을 밝혔습니다.
  alternative_readings:
  - 열두 명이었습니다
  - 합하여 열두 명입니다
  rationale: 히브리어의 שְׁנֵים עָשָׂר는 목록 전체의 합계를 제시하므로, 한국어에서도 독자가 바로 이해하도록 총원 구조를 분명히 했습니다.
  doctrine_reference: 본문의 서술 구조 반영
