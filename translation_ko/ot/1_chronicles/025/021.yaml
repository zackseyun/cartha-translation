  text: The fourteenth was Mattithiah[a], his sons and his brothers, twelve.
  footnotes:
  - marker: a
    text: Literally, 'For fourteen, Mattithiah.' In context throughout this list, the number refers to the fourteenth lot or division.
    reason: lexical_alternative
translation:
  language: ko
  text: 열넷째[a]는 맛디디야와 그의 아들들과 그의 형제들, 모두 열두 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “열넷째로는 맛디디야”입니다. 이 목록 전체의 문맥에서 이 수는 열넷째 제비 또는 부서를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אַרְבָּעָה עָשָׂר
  english_pob_choice: The fourteenth
  chosen_korean: 열네 번째는
