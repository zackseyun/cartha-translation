translation:
  language: ko
  text: 열두째는 하사뱌에게 — 그의 아들들과 그의 형제들, 열둘이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “열둘”로 더 문자적으로 옮길 수 있습니다. 그러나 이 장은 제비를 순서대로 열거하므로 문맥상 서수인 “열두째”가 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  english_pob_choice: the twelfth
  chosen_korean: 열두째
  alternatives_korean:
