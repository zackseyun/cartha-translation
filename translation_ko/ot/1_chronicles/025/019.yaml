base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/019.yaml
  text: the twelfth to Hashabiah[a], his sons and his brothers, twelve.
  footnotes:
  - marker: a
    text: Or "the twelve," taken more literally; context favors the ordinal sense, "the twelfth," because this chapter lists the lots in sequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 열두 번째[a] 제비는 하사뱌와 그의 아들들과 그의 형제들에게 돌아갔으며, 모두 열두 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문자적으로 “열둘”. 그러나 이 장은 제비를 순서대로 열거하므로, 문맥상 “열두 번째”라는 서수 의미가 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  english_pob_choice: the twelfth
  chosen_korean: 열두째
  alternatives_korean:
  - 열둘째
  - 열두 번째
  lexicon: HALOT
  rationale: 이 문맥은 제비를 순서대로 열거하는 목록이므로, 숫자 자체보다 서수로 옮기는 것이 원문의 기능을 더 정확히 드러냅니다.
- source_word: לַחֲשַׁבְיָה
  english_pob_choice: to Hashabiah
  chosen_korean: 하사뱌에게
  alternatives_korean:
  - 하사뱌를 향해
  - 하사뱌에게로
  lexicon: HALOT
  rationale: ל 접두사는 이 항목이 특정 인물에게 배정됨을 나타내므로, 한국어에서는 ‘~에게’가 가장 자연스럽고 간결합니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: בנים은 여기서 일반적 ‘자녀’보다 남자 후손을 가리키므로, 성별을 보존해 ‘아들들’로 옮겼습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  - 그의 형제와 친족들
  lexicon: HALOT
  rationale: 이 명부에서는 אחים의 기본 의미인 ‘형제들’이 가장 직접적이며, 필요 이상의 확대 해석을 피하는 것이 좋습니다.
