  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
  footnotes:
  - marker: a
    text: Or, more idiomatically in the context of casting lots, 'The first lot fell for Asaph, for Joseph.'
    reason: lexical_alternative
  - marker: b
    text: Gedaliahu is often anglicized as 'Gedaliah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 제비는 아삽의 몫으로 요셉에게 나왔고[a], 둘째 제비는 그달리야에게 나왔으며, 그와 그의 형제들과 아들들은 모두 열두 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제비를 뽑는 문맥에서는 ‘첫째 제비가 떨어졌고’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  english_pob_choice: The first lot came out
  chosen_korean: 첫째 제비는 ...에게로 나왔고
