  lexicon: 고유명사 표기
  rationale: 히브리어 형태의 -yahu 어미를 드러내기 위해 음역을 보존했습니다.
- source_word: וְאֶחָיו וּבָנָיו
  english_pob_choice: and his brothers and his sons
  chosen_korean: 그의 형제들과 아들들
  alternatives_korean:
