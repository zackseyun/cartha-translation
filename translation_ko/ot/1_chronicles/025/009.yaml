base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
  footnotes:
  - marker: a
    text: Or, more idiomatically in the context of casting lots, 'The first lot fell for Asaph, for Joseph.'
    reason: lexical_alternative
  - marker: b
    text: Gedaliahu is often anglicized as 'Gedaliah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 제비는 아삽 곧 요셉에게로 나왔고[a], 둘째는 그달리야후였는데, 그는 그의 형제들과 아들들[b]과 함께 모두 열두 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제비를 뽑는 문맥에서는 ‘첫째 제비가 떨어졌고’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그달리야후는 영어권에서 흔히 ‘Gedaliah’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  english_pob_choice: The first lot came out
  chosen_korean: 첫째 제비는 ...에게로 나왔고
  alternatives_korean:
  - 첫째 제비가 떨어졌고
  - 첫째 제비가 나왔고
  lexicon: HALOT
  rationale: 제비를 뽑는 맥락에서 결과가 ‘나왔다’는 구체적 이미지가 원문과 영어 POB의 감각을 잘 보존합니다.
- source_word: לְאָסָף לְיוֹסֵף
  english_pob_choice: for Asaph, for Joseph
  chosen_korean: 아삽 곧 요셉에게로
