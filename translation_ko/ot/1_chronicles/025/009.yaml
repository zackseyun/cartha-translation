  lexicon: HALOT
  rationale: 관계 명사를 그대로 살리되 한국어 문장 흐름을 위해 소유 대명사 반복은 한 번만 두었습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 모두 열두 명
  alternatives_korean:
  - 열두 명
  - 열둘
  lexicon: HALOT
  rationale: 마지막 수량 표시는 인원 합계를 뜻하므로 자연스러운 한국어로 ‘명’을 보탰습니다.
