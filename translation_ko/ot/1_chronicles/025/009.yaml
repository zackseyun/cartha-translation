- source_word: לְאָסָף לְיוֹסֵף
  english_pob_choice: for Asaph, for Joseph
  chosen_korean: 아삽 곧 요셉에게로
  alternatives_korean:
  - 아삽을 위하여, 요셉을 위하여
  - 아삽에게, 요셉에게
  lexicon: HALOT
  rationale: 첫 번째 소속 집단과 그 안의 특정 인물을 함께 표시하는 배분 의미를 살리기 위해 ‘...에게로’와 ‘곧’을 사용했습니다.
- source_word: גְּדַלְיָהוּ
  english_pob_choice: Gedaliah / Gedaliahu
