  lexicon: HALOT
  rationale: 이 절의 반복 공식에서 לְ는 각 순번의 배정을 가리키므로, 자연스러운 목록 문맥에 맞게 ‘열아홉째는’으로 옮겼습니다.
- source_word: לְ/מַלּוֹתִי
  english_pob_choice: Mallothi
  chosen_korean: 말로디
