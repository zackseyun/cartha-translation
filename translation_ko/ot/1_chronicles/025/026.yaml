  rationale: 고유명사는 음역이 원칙이므로, 한국어 표기 관례에 맞게 말로디로 옮겼습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘아들들’이라고 말하므로, 족보·명단 문맥에서도 성별을 지운 완곡어 대신 직역에 가깝게 살렸습니다.
- source_word: וְ/אֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  lexicon: HALOT
  rationale: 기본 어휘 의미는 ‘형제들’이므로, 행정적·씨족적 넓은 뜻 가능성은 남기되 본문 표지는 유지했습니다.
