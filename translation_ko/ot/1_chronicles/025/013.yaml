base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/013.yaml
  text: the sixth[a], Bukkiah; his sons and his brothers, twelve.
  footnotes:
  - marker: a
    text: Or, more explicitly in context, 'the sixth lot fell to Bukkiah, his sons and his brothers, twelve.' The Hebrew list style leaves 'lot fell to' implied from the surrounding verses.
    reason: lexical_alternative
translation:
  language: ko
  text: 여섯째는 부기야후와 그의 아들들과 그의 형제들, 모두 열둘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 명시적으로는 ‘여섯째 제비가 부기야후와 그의 아들들과 그의 형제들에게 돌아갔으며, 모두 열둘이었다’입니다. 히브리어 목록 문체는 앞뒤 절에서 드러나는 ‘제비가 돌아가다’를 생략합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  english_pob_choice: the sixth
  chosen_korean: 여섯째는
  alternatives_korean:
  - 여섯째
  - 여섯째 몫은
  - 여섯 번째
  lexicon: HALOT
  rationale: 목록형 배정 문맥에서 관사+서수는 앞뒤 문맥에 의해 ‘여섯째 몫/차례’가 함축되므로, 한국어에서는 간결하게 주어처럼 처리해 목록의 압축된 구성을 살렸습니다.
- source_word: בֻקִּיָּהוּ
  english_pob_choice: Bukkiah
  chosen_korean: 부기야후
  alternatives_korean:
  - 북기야
  - 부기야
  lexicon: 고유명사 음역
  rationale: 인명은 번역하지 않고 원음에 가깝게 음역했습니다. 본문 형태가 히브리어 인명 Bukkiyahu이므로 영어식 약화형 Bukkiah보다 원형을 더 직접 반영했습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 자식들
  lexicon: HALOT
  rationale: 히브리어는 성별이 분명한 ‘아들들’이며, 족보/배정 목록의 문맥상 중성화하지 않고 직접적으로 옮겼습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제자매들
  - 그의 친족들
  - 그의 동료들
  lexicon: HALOT
  rationale: 기본 의미는 남성 형제들이므로 ‘형제들’이 가장 직접적입니다. 행정/직무 목록의 맥락이지만, 원문의 친족 표지를 지우지 않기 위해 완화하지 않았습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열둘입니다
  alternatives_korean:
  - 열둘
  - 열두 명입니다
  - 열둘이었습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 수량 종결을 한국어에서는 서술형으로 자연스럽게 옮겼습니다. ‘명’을 덧붙이지 않아 원문의 압축성을 유지했습니다.
theological_decisions:
- issue: 목록형 서술에서 생략된 ‘제비/몫’의 보충 여부
  chosen_reading: 본문에는 없지만 문맥상 ‘여섯째 몫/차례’가 함축되어 있으므로, 본문은 그대로 두고 의미는 목록 구조로 드러냈습니다.
  alternative_readings:
  - ‘여섯째 몫은 부기야후입니다’처럼 보충하여 명시
  - 영어 POB의 각주 내용을 본문에 반영
  rationale: 히브리어는 매우 압축된 목록 문체를 사용하며, 없는 말을 본문에 삽입하면 원문의 형태적 긴장을 약화시킬 수 있습니다. 따라서 본문은 간결하게 유지하고, 필요한 해석은 독자가 문맥에서 읽도록 했습니다.
  doctrine_reference: 성경 본문 보존 원칙, 문맥 보충의 절제
- issue: ‘형제들’의 범위
  chosen_reading: 직역 우선으로 ‘형제들’을 유지했습니다.
  alternative_readings:
  - ‘친족들’로 일반화
  - ‘동료들’로 기능적 해석
  rationale: 목록/족보 문맥에서 히브리어 אחים는 남성 형제 관계를 기본값으로 가지며, 범위를 넓히면 혈연 표지가 희미해집니다. 본문의 정확성을 위해 직접 대응을 택했습니다.
  doctrine_reference: 본문 충실성, 문맥 우선 해석
