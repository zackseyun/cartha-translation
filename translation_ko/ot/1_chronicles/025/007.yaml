  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
  footnotes:
  - marker: a
    text: Or 'for the LORD.' The Hebrew preposition can express direction or purpose in this context of musical service.
    reason: lexical_alternative
  - marker: b
    text: Or 'all who had understanding,' that is, all who were competent or expert in the musical work.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께[a] 노래하는 법을 배운, 모두 숙련된[b] 그들의 형제들과 합한 수는 이백팔십팔 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 위하여.’ 이 문맥에서 히브리어 전치사는 음악적 섬김의 방향이나 목적을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이해력이 있는 모든 이들,’ 곧 음악 활동에 능숙하거나 전문가인 모든 이들입니다.
    reason: lexical_alternative
