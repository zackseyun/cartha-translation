  yaml_path: translation/ot/1_chronicles/025/020.yaml
  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
  footnotes:
  - marker: a
    text: Literally, 'For the thirteenth, Shubael.' The word 'lot' is implied from the surrounding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 열세째는 수바엘이니, 그의 아들들과 그의 형제들은 열둘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘열세째를 위해’입니다. ‘제비’는 주변 문맥에서 암시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  english_pob_choice: The thirteenth
  chosen_korean: 열세째는
  alternatives_korean:
  - 열세 번째는
  - 열세째 사람은
  - 열세째 몫은
  lexicon: WLC
  rationale: 문맥상 제비로 나눈 순번을 가리키므로, 영어 POB의 간결한 목록체를 따라 ‘열세째는’으로 자연스럽게 옮겼습니다. 본문에 ‘제비’는 직접 없으므로 본문에는 보태지 않았습니다.
- source_word: שׁוּבָאֵל
  english_pob_choice: Shubael
  chosen_korean: 수바엘
  alternatives_korean:
  - 슈바엘
  - 쉬바엘
  lexicon: 고유명사 음역
  rationale: 인명은 음역으로 처리했으며, 표준 외래어식 표기를 따라 수바엘로 적었습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들과
  alternatives_korean:
  - 그의 자녀들과
  - 그의 아들과
  lexicon: WLC
  rationale: 히브리어는 일반적인 자녀가 아니라 남성 복수 ‘아들들’을 뜻하므로, 성별 정보를 유지해 번역했습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들은
  alternatives_korean:
  - 그의 형제들과
  - 그의 친족들은
  - 그의 형제들
  lexicon: WLC
  rationale: 직역하면 ‘형제들’이지만, 이 계열 명단에서는 같은 분조에 속한 남성 친족/동료를 포함할 수 있어도 어휘 자체는 ‘형제들’이므로 그대로 살렸습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 열둘입니다
  alternatives_korean:
  - 열둘이었다
  - 열둘
  lexicon: WLC
  rationale: 마지막 수량 표시는 서술적으로 ‘열둘입니다’로 옮겨, 목록 항목의 종결감을 살렸습니다.
theological_decisions:
- issue: 제비/순번 표현의 보충 여부
  chosen_reading: 본문에는 없지만, 문맥상 열거되는 분배 순서를 나타내는 순번으로만 처리하고 ‘제비’는 본문에 넣지 않았습니다.
  alternative_readings:
  - 열세 번째 제비는
  - 열세째 몫은
  rationale: 영어 POB 주석처럼 주변 문맥에 의해 제비 개념이 암시되지만, 히브리어 본문 자체에는 없으므로 본문을 과도하게 확장하지 않았습니다.
  doctrine_reference: 본문충실 원칙
