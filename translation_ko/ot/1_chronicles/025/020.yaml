translation:
  language: ko
  text: 열세 번째[a]는 수바엘이며, 그의 아들들과 형제들은 모두 열둘입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘열세 번째를 위하여’입니다. ‘제비’라는 말은 주변 문맥에서 암시됩니다.
