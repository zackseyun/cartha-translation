  rationale: 문맥이 제비를 나누는 목록이므로 단순 서수가 자연스럽고, ל의 배정 의미를 살려 한국어 조사는 문장 주제 표지처럼 처리했습니다.
- source_word: לְ/מַחֲזִיא֔וֹת
