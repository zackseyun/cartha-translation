  rationale: אחים는 이 목록에서 혈연적 형제들을 가리키므로 ‘형제’로 직역했고, 뒤의 서술과 연결되도록 주제 표지를 사용했습니다.
theological_decisions:
- issue: 열둘의 수량을 구성하는 방식
  chosen_reading: ‘그의 아들과 그의 형제는 열둘’로 유지했습니다.
  alternative_readings:
