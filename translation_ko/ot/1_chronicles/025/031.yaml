translation:
  language: ko
  text: 그는 제24번째[a] 로마므티에셀의 아들들과 그의 형제들, 열둘이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제24번째’입니다. 이 절은 이 장 전체에서 제24번째 제비나 분배 몫을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: לְ/אַרְבָּעָה וְ/עֶשְׂרִים
  english_pob_choice: for the twenty-fourth
  chosen_korean: 제24번째
  alternatives_korean:
  - 스물넷째
  - 24번째 몫
  lexicon: HALOT
  rationale: 문맥상 제비로 배정된 순서를 가리키므로 한국어에서는 서수로 자연스럽게 옮겼습니다. 영어 POB처럼 ‘몫/제비’를 본문에 과도하게 덧붙이지 않고, 필요하면 각주로 보완합니다.
- source_word: לְ/רוֹמַמְתִּי עָזֶר
  english_pob_choice: Romamti-ezer
  chosen_korean: 로마므티에셀
  alternatives_korean:
  - 로마므티에저
  - 로마므티 에셀
  lexicon: 고유명사 음역
  rationale: 인명은 번역하지 않고 음역했습니다. 히브리어 복합 이름의 연속성을 살리기 위해 하이픈 대신 한국어에서는 한 단어로 붙여 표기했습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들과
  alternatives_korean:
  - 그의 자녀들과
  - 그의 자식들과
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘아들들’을 뜻하므로 성중립화하지 않고 그대로 옮겼습니다. 한국어에서는 다음의 ‘형제들’과 함께 자연스럽게 연결되도록 조사만 보정했습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  - 그의 동료들
  lexicon: HALOT
  rationale: 기본 의미는 ‘형제들’입니다. 이 명단 문맥에서는 친족 또는 공동체 구성원을 가리킬 수 있으나, 어휘 의미를 우선해 직역했습니다.
- source_word: שְׁנֵ֥ים עָשָֽׂר
  english_pob_choice: twelve
  chosen_korean: 열둘
  alternatives_korean:
  - 열두 명
  - 12명
  lexicon: HALOT
  rationale: 총원 숫자를 간결하게 제시하는 구조를 살려 ‘열둘’로 옮겼습니다. 인원임이 분명하므로 별도의 명사 ‘명’은 본문에 덧붙이지 않았습니다.
theological_decisions:
- issue: 명단/족보 문맥의 수사 방식
  chosen_reading: 서술적 문장을 유지하되, 수량과 배정의 기능이 드러나도록 ‘제24번째’로 옮겼습니다.
  alternative_readings:
  - ‘제24번째 몫’으로 명시
  - ‘스물넷째’로 더 구어적으로 처리
  rationale: 본문은 제비뽑기 분배표의 한 항목으로, 내용은 단순 기록이지만 배정의 순서가 핵심입니다. 한국어에서는 서수 표기가 가장 투명하게 원문 기능을 드러냅니다.
  doctrine_reference: 본문해석/역사서 서술
