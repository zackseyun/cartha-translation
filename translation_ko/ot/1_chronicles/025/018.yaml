  source_fidelity: 히브리어의 명단 순번(열두 번째), 아사렐, 그의 아들들과 형제들, 그리고 집단의 총수 열둘을 모두 반영합니다. 다만 초안의 ‘그의 아들과 그의 형제들, 열둘입니다’는 마지막 수가 앞선 집단 전체의 수라는 관계를 다소 불분명하게 만듭니다.
  naturalness: ‘제 십이째’는 현대 표준 한국어에서 부자연스럽고 ‘제’와 ‘째’의 결합도 불필요하게 중첩됩니다. ‘열두 번째는’ 및 ‘모두 열두 명이었습니다’가 명단 문맥과 합쇼체에 자연스럽습니다.
  terminology: ‘아사렐’은 본문 인명 표기로 유지할 수 있습니다. 그러나 현 각주의 ‘아사렐로도 옮길 수 있습니다’는 본문 표기와 동일하여 대안 독음을 제공하지 못합니다. 영어 감사 기록의 Azareel 대안에 상응하여 ‘아자리엘’을 제시하는 것이 적절합니다.
