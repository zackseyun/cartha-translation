lexical_decisions:
- source_word: עַשְׁתֵּֽי עָשָׂ֣ר
  english_pob_choice: the twelfth
  chosen_korean: 제 십이째
  alternatives_korean:
  - 열두째
  - 열둘째
  lexicon: HALOT
  rationale: 명단의 순번을 가리키는 문맥이므로 단순 수사보다 서수 표현이 필요합니다. 한국어에서는 ‘제 십이째’가 가장 자연스럽고, 원문의 순번성을 분명히 드러냅니다.
- source_word: עֲזַרְאֵ֔ל
  english_pob_choice: Azarel
  chosen_korean: 아사렐
  alternatives_korean:
  - 아자렐
  - 아자리엘
  lexicon: 고유명사 음역
  rationale: 인명은 번역하지 않고 음역해야 합니다. 기존 한국어 음역 관행을 고려하되, 본문의 인명 형태를 최대한 직접적으로 옮겼습니다.
- source_word: בָּנָ֥י/ו
  english_pob_choice: his sons
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그의 자녀
  - 그의 아들들
  lexicon: HALOT
  rationale: 히브리어는 분명히 ‘아들들’을 뜻하므로 성별이 중립적인 ‘자녀’보다 원문에 더 밀착한 표현을 택했습니다. 한국어에서는 뒤의 열둘과 함께 자연스럽게 읽히도록 단수형 명사구로 묶었습니다.
- source_word: וְ/אֶחָ֖י/ו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 동료들
  - 그의 친족들
  lexicon: HALOT
  rationale: 직역하면 ‘형제들’이 가장 직접적입니다. 문맥상 친족이나 동료를 포함할 수 있으나, 근거 없이 의미를 넓히지 않았습니다.
- source_word: שְׁנֵ֥ים עָשָֽׂר
  english_pob_choice: twelve
  chosen_korean: 열둘
  alternatives_korean:
  - 열두 명
  - 열두
  lexicon: HALOT
  rationale: 마지막 숫자는 그 무리를 이루는 총인원을 나타냅니다. 한국어에서는 명사 생략이 자연스럽기 때문에 ‘열둘입니다’로 간결하게 처리했습니다.
