  lexicon: HALOT
  rationale: 고유명사는 통용되는 한국어 음역을 따랐습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그의 자녀
  - 그의 아들들
  lexicon: HALOT
  rationale: בנים은 여기서 성별이 분명한 ‘아들들’이므로, 족보·명단 문맥을 살려 ‘그의 아들’로 옮겼습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제
  alternatives_korean:
