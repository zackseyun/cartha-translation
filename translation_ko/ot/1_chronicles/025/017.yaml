  - 그의 친족
  - 그의 동료들
  lexicon: HALOT
  rationale: אחים의 기본 의미를 따라 직역하되, 이 명단 문맥에서 친족/동일 계열 구성원일 가능성은 본문에 덧붙이지 않고 열거의 투명성을 우선했습니다.
theological_decisions:
- issue: 명단식 배정 표현의 압축성
  chosen_reading: ‘열째는 시므이입니다’로 간단히 처리하여 순번과 인물을 바로 드러냅니다.
  alternative_readings:
  - ‘열째 몫은 시므이에게 돌아갔습니다’
  - ‘열째 제비는 시므이였습니다’
  rationale: 히브리어는 짧은 명사구로 순번만 제시하므로, 본문이 말하는 바를 과잉 해석하지 않으면서 한국어 독자가 즉시 이해하도록 간결하게 옮겼습니다.
  doctrine_reference: 본문은 교리 진술이 아니라 성전 봉사 분담 명단입니다.
