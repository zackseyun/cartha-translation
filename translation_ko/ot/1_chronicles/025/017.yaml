lexical_decisions:
- source_word: הָעֲשִׂירִי
  english_pob_choice: the tenth
  chosen_korean: 열째
  alternatives_korean:
  - 열 번째
  - 열째 몫
  - 열째 순번
  lexicon: HALOT
  rationale: 문맥상 앞뒤 절과 함께 제비뽑기/배정의 순서를 가리키므로, 영어 POB의 간명한 처리에 맞춰 한국어도 ‘열째’로 자연스럽게 옮겼습니다.
