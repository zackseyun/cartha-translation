source:
  edition: WLC
  text: הַ/חֲמִישִׁ֣י נְתַנְיָ֔הוּ בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
  footnotes:
  - marker: a
    text: Or, in context, 'The fifth lot was for Nethaniah; his sons and his brothers were twelve.' The Hebrew omits words such as 'lot' or 'was for,' which are inferred from the surrounding list.
    reason: alternative_reading
translation:
  language: ko
  text: 다섯째[a]는 느다냐후였고, 그의 아들들과 형제들은 열두 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘다섯 번째 제비’ 또는 ‘다섯 번째 분조’를 가리킬 수 있습니다. 히브리어 본문에는 ‘제비’나 ‘…에게 돌아갔다’와 같은 말이 명시되어 있지 않고, 앞뒤의 목록 문맥에서 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  english_pob_choice: The fifth
  chosen_korean: 넷째
  alternatives_korean:
  - 다섯째
  - 다섯 번째
  lexicon: HALOT
  rationale: 본문은 연속된 제비/분조 목록의 서수 표현을 축약형으로 제시하므로, 한국어도 목록 항목으로 자연스럽게 풀어 썼습니다. 다만 본문 자체에 ‘제비’가 명시되지 않으므로 이를 본문에 넣지는 않았습니다.
- source_word: נְתַנְיָהוּ
  english_pob_choice: Nethaniah
  chosen_korean: 느다냐후
  alternatives_korean:
  - 느다니야
  - 넷냐후
  lexicon: transliteration
  rationale: 고유명사는 음역으로 처리하되, 현대 표기 일관성을 위해 ‘느다냐후’로 옮겼습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: 히브리어 בן의 남성 복수형과 3인칭 남성 단수 접미사는 이 구문에서 분명히 ‘아들들’을 뜻하므로, 성별이 중립적인 ‘자녀들’은 피했습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  lexicon: HALOT
  rationale: אח의 복수형은 기본적으로 ‘형제들’을 뜻하므로, 혈족 일반으로 넓히지 않고 직역에 가깝게 옮겼습니다.
- source_word: שְׁנֵ֥ים עָשָֽׂר
  english_pob_choice: twelve
  chosen_korean: 열둘이었습니다
  alternatives_korean:
  - 열두 명이었습니다
  - 열둘
  lexicon: HALOT
  rationale: 열거문의 결말인 수사이므로 단독으로 두기보다 문맥상 자연한 서술형으로 풀어 마감했습니다.
