lexical_decisions:
- source_word: הַתְּשִׁיעִי
  english_pob_choice: The ninth was
  chosen_korean: 열째는 …였습니다
  alternatives_korean:
  - 아홉째는 …였습니다
  - 제9조는 …였습니다
  lexicon: WLC
  rationale: 히브리어는 목록의 일련번호를 간결하게 제시하는 형식이라, 한국어도 같은 목록문체로 간단히 옮겼습니다. 다만 본문 배열상 인물명과 함께 자연스럽게 읽히도록 ‘였습니다’를 보완했습니다.
- source_word: מַתַּנְיָהוּ
  english_pob_choice: Mattanyahu
  chosen_korean: 마트냐후
  alternatives_korean:
  - 마트냐아후
  - 맛다냐
  lexicon: HALOT
  rationale: 영문 POB의 주석처럼 히브리어 음형을 더 직접 반영하는 음역을 택했습니다. 전통적 한국 교회식 이름보다 원어 형태를 살리는 쪽이 이 절의 계보 목록에 더 적합합니다.
- source_word: בָּנָיו וְאֶחָיו
  english_pob_choice: his sons and his brothers
  chosen_korean: 그의 아들들과 그의 형제들
  alternatives_korean:
  - 그의 자녀들과 그의 형제들
  - 그의 아들들과 친족들
  lexicon: HALOT
  rationale: 히브리어는 분명히 남성 후손과 형제를 가리키므로, 성중립적 완화보다 직접적인 친족 호칭을 유지했습니다. 목록 맥락에서 간결하고 정확합니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: twelve
  chosen_korean: 모두 열둘
  alternatives_korean:
  - 열둘
  - 합하여 열둘
  lexicon: HALOT
  rationale: 히브리어의 간결한 총계를 한국어에서도 그대로 살리되, ‘모두’를 넣어 앞의 사람들 전체 합계를 분명히 했습니다.
theological_decisions:
- issue: 목록형 절에서 암시된 서술어 보완
  chosen_reading: ‘열째는 …였습니다’로 암시된 계사를 보완했습니다.
  alternative_readings:
  - ‘열째, 마트냐후…’처럼 계사를 생략함
  - ‘열째는 마트냐후였습니다’처럼 더 평이하게 정리함
  rationale: 히브리어 명사구 목록은 생략이 많지만, 한국어 합쇼체 본문에서는 완전한 서술문이 더 자연스럽습니다. 다만 원문의 압축성을 해치지 않도록 최소한으로 보완했습니다.
  doctrine_reference: 번역 문체/담화 구조
- issue: 족보·편성 목록의 인물명 음역
  chosen_reading: ‘마트냐후’로 음역했습니다.
  alternative_readings:
  - ‘맛다냐’로 전통화함
  - ‘마태냐후’로 근접 음역함
  rationale: 이 절은 신학적 용어보다 원형 보존이 중요한 고유명사 목록입니다. 전통적 익숙함보다 원문 음형의 식별 가능성을 우선했습니다.
  doctrine_reference: 고유명사 번역 원칙
