translation:
  language: ko
  text: 스무 번째는 엘리아다와 그의 아들들과 그의 형제들, 열둘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 풀어 말하면, ‘스무 번째 몫은 엘리아다와 그의 아들들과 그의 형제들, 곧 열둘입니다.’라고 할 수 있습니다. 이 문맥에서는 ‘몫/제비’가 반복 구조상 생략되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  english_pob_choice: for the twentieth
  chosen_korean: 스무 번째는
  alternatives_korean:
  - 스무 번째를 위하여
  - 스무 번째 몫은
  lexicon: HALOT
  rationale: 반복되는 제비뽑기 목록의 구조를 따라, ל의 배분 의미를 한국어 자연문으로 옮겨 ‘스무 번째는’으로 처리했습니다.
- source_word: לֶֽ/אֱלִיָּתָה
  english_pob_choice: Eliathah
  chosen_korean: 엘리아다
  alternatives_korean:
  - 엘리야다
  - 엘리아타
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 히브리어 이름을 한국어로 무리 없이 읽히게 했습니다.
- source_word: בָּנָי/ו וְ/אֶחָי/ו
  english_pob_choice: his sons and his brothers
  chosen_korean: 그의 아들들과 그의 형제들
  alternatives_korean:
  - 그의 자녀들과 그의 형제들
  - 그의 아들과 형제들
  lexicon: HALOT
  rationale: בנים은 남자 후손인 ‘아들들’로, אחים은 문맥상 혈족 표지를 보존하는 ‘형제들’로 옮겼습니다.
- source_word: שְׁנֵ֥ים עָשָֽׂר
  english_pob_choice: twelve
  chosen_korean: 열둘입니다
  alternatives_korean:
  - 열둘
  - 열두 명입니다
  lexicon: HALOT
  rationale: 히브리어는 보어 없이 총수를 덧붙이는 목록식 표현이므로, 한국어에서도 간결하게 ‘열둘입니다’로 처리했습니다.
theological_decisions:
- issue: 제비뽑기 목록의 축약된 서술 방식
  chosen_reading: 목록식 배치를 살려 보충 설명을 최소화했습니다.
  alternative_readings:
  - ‘열두 명이었습니다’처럼 서술어를 완전화
  - ‘그는 아들들과 형제들과 함께 열둘입니다’처럼 풀어쓰기
  rationale: 본문은 왕복된 족보/직무 배정 목록의 일부로, 히브리어의 압축된 병렬 구조를 유지하는 편이 원문 효과를 더 잘 드러냅니다.
  doctrine_reference: 본문 구조 보존 원칙
- issue: ‘형제들’의 관계 범위
  chosen_reading: 직역적 친족어인 ‘형제들’을 유지했습니다.
  alternative_readings:
  - ‘친족들’
  - ‘동족들’
  rationale: English POB도 ‘brothers’를 유지하며 관계 범위를 넓히지 않았으므로, 혈족적 표현을 그대로 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 어휘 보존 원칙
