  source_fidelity: 히브리어는 제비로 정해진 순번 목록에서 ‘스무 번째에/스무 번째 몫으로 엘리아다에게, 그의 아들들과 그의 형제들, 열둘’이라고 압축하여 말합니다. 초안은 인명과 친족어 및 총수를 정확히 옮겼으나, ‘스무 번째는’은 배정·제비의 목록이라는 구조를 본문에서 다소 흐리게 합니다.
  naturalness: ‘스무 번째 제비는 … 모두 열둘입니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, 명단의 압축된 형식을 유지합니다. ‘모두’를 넣어 열둘이 엘리아다를 포함한 전체 집단의 수임을 분명히 합니다.
  terminology: ‘엘리아다’는 한국어 성경 전통에서 통용되는 이 인명의 표기로 유지할 수 있습니다. ‘아들들’과 ‘형제들’은 בָּנָיו와 אֶחָיו의 친족 표현을 불필요하게 넓히지 않습니다. 문맥상 함축된 ‘제비’는 본문에 보충하되 각주에서 이를 밝혀야 합니다.
