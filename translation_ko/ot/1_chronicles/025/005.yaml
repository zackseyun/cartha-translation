revisions:
- from: 이 모든 사람은 헤만의 아들들입니다. 그는 왕의 선견자였으며, 하나님의 말씀으로 호른을 높이는 사람이었습니다. 하나님께서는 헤만에게 아들 열넷과 딸 셋을 주셨습니다.[a][b]
  to: 이들은 모두 뿔을 높이기 위하여 하나님의 말씀과 관련하여[b] 왕의 선견자였던 헤만의 아들들입니다.[a] 하나님께서는 헤만에게 아들 열넷과 딸 셋을 주셨습니다.
  rationale: ‘호른’을 ‘뿔’로 바로잡고, 각주를 해당 표현에 연결했습니다. ‘뿔을 높이기 위하여’는 원문의 목적 표현을 보존하며, 뿔이 누구를 가리키는지는 본문과 각주 모두에서 해석으로 한정하지 않았습니다. ‘하나님의 말씀과 관련하여’는 전치사 בְּ의 관계를 하나로 단정하지 않으면서 자연스러운 한국어를 제공합니다.
  reviewer_model: gpt-5.6-terra
