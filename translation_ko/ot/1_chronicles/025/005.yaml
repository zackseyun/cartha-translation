source:
  edition: WLC
  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
  footnotes:
  - marker: a
    text: Or 'to raise up the horn.' The Hebrew 'horn' is a figurative image for strength, honor, or exalted status.
    reason: lexical_alternative
  - marker: b
    text: Or 'the king’s seer in matters of God' or 'by the words of God.' The Hebrew phrase is compact and may denote Heman’s role in relation to divine revelation.
    reason: alternative_reading
translation:
  language: ko
  text: 이 모든 사람은 헤만의 아들들입니다. 그는 왕의 선견자였으며, 하나님의 말씀으로 호른을 높이는 사람이었습니다. 하나님께서는 헤만에게 아들 열넷과 딸 셋을 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호른’은 성경에서 힘, 명예, 높아진 지위를 가리키는 상징적 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 간결하여, ‘하나님의 말씀으로’, ‘하나님의 일들에 관하여’, 또는 ‘하나님의 말씀에 의해’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹזֵה
  english_pob_choice: seer
  chosen_korean: 선견자
  alternatives_korean:
  - 예언자
  - 환시자
  lexicon: HALOT
  rationale: Chronicles의 궁정-예언자적 직함을 살리면서도, 단순한 '예언자'보다 관찰·통찰의 뉘앙스를 유지하기 위해 '선견자'를 택했습니다.
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  english_pob_choice: in the words of God
  chosen_korean: 하나님의 말씀으로
  alternatives_korean:
  - 하나님의 일들에 관하여
  - 하나님의 말씀 가운데
  lexicon: HALOT
  rationale: 히브리어의 압축된 구성을 한국어에서 자연스럽게 풀어, 헤만의 역할이 하나님의 말씀/계시에 관련됨을 드러내면서도 문장의 애매성을 과도하게 해소하지 않도록 했습니다.
- source_word: לְהָרִים קָרֶן
  english_pob_choice: to exalt the horn
  chosen_korean: 호른을 높이는
  alternatives_korean:
  - 뿔을 높이는
  - 권세를 높이는
  lexicon: HALOT
  rationale: '''horn''의 상징적 이미지를 보존하기 위해 직역 계열을 유지했습니다. 본문의 비유를 해석어로 바꾸면 원문의 힘과 중의성이 약해집니다.'
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  english_pob_choice: And God gave Heman
  chosen_korean: 하나님께서는 헤만에게
  alternatives_korean:
  - 하나님께서 헤만을 주셨습니다
  - 하나님께서 헤만에게 주셨습니다
  lexicon: HALOT
  rationale: 히브리어의 수여 구문을 자연스러운 한국어로 옮기되, 자녀를 '주셨다'는 출생/은혜의 뉘앙스를 살렸습니다.
- source_word: בָנִים ... וּבָנוֹת
  english_pob_choice: sons ... daughters
  chosen_korean: 아들 열넷과 딸 셋
  alternatives_korean:
  - 아들들 열넷과 딸들 셋
  - 남자 자녀 열넷과 여자 자녀 셋
  lexicon: HALOT
  rationale: 성별 구분을 유지하면서도 한국어에서 가장 자연스러운 수량 표현으로 정리했습니다.
theological_decisions:
- issue: '''호른'' 비유를 해석어로 바꿀지 여부'
  chosen_reading: 상징 이미지를 유지해 '호른'을 그대로 살렸습니다.
  alternative_readings:
  - 권세를 높이다
  - 명예를 높이다
  rationale: 본문은 무엇의 horn인지와 그 의미를 단일 개념으로 환원하지 않으므로, 비유를 보존해 원문의 긴장과 시적 힘을 유지했습니다.
  doctrine_reference: 원문 우선, 은유 보존
