  lexicon: HALOT
  rationale: 정형화된 격려 표현으로, ‘담대하다’가 אמץ의 결을 가장 자연스럽게 담습니다.
- source_word: וְאַל תֵּחָת
  english_pob_choice: and do not be dismayed
  chosen_korean: 낙심하지 마십시오
