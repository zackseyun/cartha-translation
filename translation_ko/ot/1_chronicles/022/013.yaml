base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
  footnotes:
  - marker: a
    text: Or 'you will succeed.' The Hebrew verb can denote either prospering or succeeding.
    reason: lexical_alternative
  - marker: b
    text: Or 'the decrees and the ordinances.' The two Hebrew legal terms are distinct and are preserved with separate English renderings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 당신은 번영할 것입니다[a]. 곧 야훼께서 모세에게 이스라엘을 위하여 명하신 규례들과 법도들을 지키고 행하기를 주의하면 말입니다. 강하고 담대하십시오. 두려워하지 말고, 낙심하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 성공할 것입니다.’ 히브리어 동사는 번영과 성공 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּצְלִיחַ
  english_pob_choice: you will prosper
  chosen_korean: 번영할 것입니다
