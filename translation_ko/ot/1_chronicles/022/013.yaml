  - 규례들과 법규들을 행하기
  - 규례들과 판단들을 행하기
  lexicon: HALOT
  rationale: 두 법적 용어를 서로 구별해 살리되, 한국어에서는 ‘지키고 행하다’가 관용적으로 순종의 의미를 가장 분명하게 전달합니다.
