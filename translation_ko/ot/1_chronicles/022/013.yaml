  rationale: 히필 צלח는 ‘잘 되다/번영하다/성공하다’의 폭이 있어, 여기서는 언약적 순종의 결과를 살리는 ‘번영하다’가 가장 자연스럽습니다.
- source_word: לַעֲשׂוֹת אֶת הַחֻקִּים וְאֶת הַמִּשְׁפָּטִים
