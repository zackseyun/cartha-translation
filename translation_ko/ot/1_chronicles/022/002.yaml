source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
  footnotes:
  - marker: a
    text: Or 'the sojourners' or 'the resident aliens.' The Hebrew refers to non-Israelite residents living in the land.
    reason: lexical_alternative
  - marker: b
    text: Or 'cut stones' or 'hewn stones.'
    reason: lexical_alternative
  - marker: c
    text: That is, the temple.
    reason: cross_reference
translation:
  language: ko
  text: 다윗은 이스라엘 땅에 있는 나그네들을 모으라고 명령하고, 다듬은 돌을 깎을 석공들을 세워 하나님의 집을 짓게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류민들’ 혹은 ‘거주 외국인들’입니다. 히브리어는 이스라엘 땅에 살던 비이스라엘계 주민을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깎은 돌’ 혹은 ‘돌을 다듬은 것’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 성전을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: ordered
  chosen_korean: 명령하고
  alternatives_korean:
  - 말하고
  - 지시하고
  lexicon: HALOT
  rationale: ‘말하다’의 문자값보다 뒤따르는 목적절과 함께 나타나는 지시의 힘을 살려 ‘명령하고’로 옮겼습니다.
- source_word: הַגֵּרִים
  english_pob_choice: the foreigners
  chosen_korean: 나그네들
  alternatives_korean:
  - 외국인들
  - 거류민들
  - 이방인들
  lexicon: HALOT
  rationale: 문맥상 이스라엘 땅 안에 거주하는 비이스라엘계 주민을 가리키므로, 전통적 성서 어휘를 살리되 현대 한국어에서 낯설지 않은 ‘나그네들’을 택했습니다.
- source_word: אַבְנֵי גָזִית
  english_pob_choice: dressed stones
  chosen_korean: 다듬은 돌
  alternatives_korean:
  - 다듬은 석재
  - 깎은 돌
  - 다듬어 놓은 돌
  lexicon: HALOT
  rationale: 건축용으로 정형 가공된 돌이라는 뜻을 자연스럽게 드러내는 표현으로 ‘다듬은 돌’을 선택했습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 전
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지해 본문이 말하는 ‘집’ 이미지를 살렸고, 해석어인 ‘성전’은 본문 밖의 설명으로 남겼습니다.
theological_decisions:
- issue: הַגֵּרִים의 공동체 내 지위 표현
  chosen_reading: 이스라엘 땅에 있는 나그네들
  alternative_readings:
  - 외국인들
  - 거류민들
  - 이방인들
  rationale: 이 용례는 단순 관광객이 아니라 이스라엘 안에서 함께 거주하는 비이스라엘계 주민을 뜻하므로, 공동체적·거주적 긴장을 함께 담는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: בֵּית הָאֱלֹהִים의 해석어 처리
  chosen_reading: 하나님의 집
  alternative_readings:
  - 하나님의 성전
  - 하나님의 전
  rationale: 본문은 후대적 설명어보다 원문 표현을 우선하므로, 템플을 뜻하더라도 직역형을 본문에 두는 것이 원문의 의미 범위를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
