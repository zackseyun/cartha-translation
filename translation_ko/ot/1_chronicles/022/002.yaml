revisions:
- from: 다윗은 이스라엘 땅에 있는 나그네들을 모으라고 명령하고, 다듬은 돌을 깎을 석공들을 세워 하나님의 집을 짓게 했습니다.[a][b][c]
  to: 다윗은 이스라엘 땅에 있는 거류민들[a]을 모으라고 명령했습니다. 그리고 하나님의 집[c]을 짓는 데 쓸 다듬은 돌[b]을 깎도록 석공들을 세웠습니다.
  rationale: 거주하는 비이스라엘계 주민이라는 הַגֵּרִים의 의미를 ‘거류민들’로 바로잡고, 석공을 세운 일과 돌을 깎는 일 및 성전 건축 목적의 문법 관계를 한국어에서 명확히 재구성했습니다. ‘하나님의 집’은 원문의 표현을 보존했으며, 각주는 대응 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:53Z'
review_pass:
  verdict: revise
  source_fidelity: ‘나그네들’은 이동 중인 여행자라는 뜻이 강하여, 이스라엘 땅에 거주하는 비이스라엘계 주민을 뜻하는 הַגֵּרִים를 충분히 반영하지 못합니다. 또한 현 초안의 ‘석공들을 세워 하나님의 집을 짓게 했습니다’는 석공들이 집 자체를 건축하게 했다는 뜻으로 읽힐 수 있으나, 원문은 그들을 다듬은 돌을 채석·가공하도록 세운 목적을 말합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서, ‘거류민’과 ‘~하는 데 쓸’이라는 표현으로 거주 지위와 작업의 목적 관계를 분명하고 자연스럽게 드러냅니다.
  terminology: בֵּית הָאֱלֹהִים는 본문의 직역에 따라 ‘하나님의 집’으로 유지합니다. אַבְנֵי גָזִית는 건축용으로 가공된 돌이라는 뜻의 ‘다듬은 돌’로 옮깁니다. הַגֵּרִים는 ‘거류민들’로 옮겨 ‘나그네’의 일시 체류 뉘앙스를 피합니다.
