  naturalness: ‘보십시오’와 합쇼체 서술은 자연스럽습니다. 다만 ‘무게를 달 수 없을 만큼 많았습니다’는 이유절을 분명히 하여 ‘너무 많아서 무게를 달 수 없었습니다’로 하면 히브리어의 인과관계와 한국어 흐름이 더 명료합니다. 마지막의 ‘거기에’는 재목과 돌을 가리키는 대명사로 다소 막연하므로 ‘그것들에’가 더 직접적입니다.
