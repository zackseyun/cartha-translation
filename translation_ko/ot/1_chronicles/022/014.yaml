  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Now behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
  footnotes:
  - marker: a
    text: Or 'in my poverty.' The Hebrew can denote affliction, hardship, or poverty.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a thousand thousands.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and you shall add to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 내가 고난 가운데[a] 여호와의 집을 위하여 금 십만 달란트와 은 백만 달란트[b]를 준비하였고, 놋과 철은 너무 많아서 무게를 달 수 없었습니다. 나는 재목과 돌도 준비하였으니, 당신도 그것들에 더하십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 궁핍 가운데’. 히브리어는 고난, 곤궁, 가난의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘천 천’(a thousand thousands)입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신도 그것들에 더할 수 있습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: בְעָנְיִי
  english_pob_choice: in my affliction
  chosen_korean: 고난 가운데
  alternatives_korean:
  - 내 괴로움 가운데
  - 내 궁핍 가운데
  - 내 환난 가운데
  lexicon: HALOT
  rationale: עֳנִי는 ‘고난/괴로움/궁핍’의 폭이 있으므로, 문맥상 다윗의 처지와 수고를 자연스럽게 드러내는 ‘고난 가운데’로 옮겼습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: for the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 여호와의 성전
  - 여호와의 궁정
  lexicon: HALOT
  rationale: 히브리어의 ‘집’(בַּיִת) 이미지를 살려 직역에 가깝게 옮겼고, 역대기 문맥에서 성전의 뜻임은 자연스럽게 읽히도록 했습니다.
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  english_pob_choice: for the bronze and the iron there is no weighing
  chosen_korean: 놋과 철은 무게를 달 수 없을 만큼
  alternatives_korean:
  - 놋과 철은 무게가 없을 만큼
  - 놋과 철은 셀 수 없을 만큼
  lexicon: HALOT
  rationale: אֵין מִשְׁקָל은 ‘무게가 없다’가 아니라 ‘무게를 달지 못한다/달 수 없다’는 뜻이므로, 과정의 불가능을 드러내는 표현으로 옮겼습니다.
- source_word: וַעֲלֵי־הֶם תּוֹסִיף
  english_pob_choice: you may add to them
  chosen_korean: 당신도 거기에 더하십시오
  alternatives_korean:
  - 당신은 거기에 더할 수 있습니다
  - 거기에 더하셔도 됩니다
  - 거기에 더하십시오
  lexicon: HALOT
  rationale: כתיב은 다윗이 솔로몬에게 남기는 권고/허용의 뉘앙스를 가지므로, 한국어에서는 자연스러운 준명령형으로 처리했습니다.
