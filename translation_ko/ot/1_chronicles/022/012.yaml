  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
  footnotes:
  - marker: a
    text: Or 'give you charge over Israel'; the Hebrew verb can also be understood as 'command you concerning Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the instruction of the LORD your God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 야훼께서 당신에게 지혜와 명철을 주시고, 당신을 이스라엘 위에 세우셔서, 당신이 야훼 당신의 하나님의 율법을 지키게 하시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 위에 너를 맡기셔서’로도 옮길 수 있습니다. 여기서 히브리어 동사는 ‘이스라엘에 관해 명령하다’로도 이해될 수 있지만, 왕권 문맥에서는 위임·임명의 뜻이 살아납니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘야훼 당신의 하나님의 교훈’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
