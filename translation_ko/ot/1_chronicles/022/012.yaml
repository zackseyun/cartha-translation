  lexicon: HALOT
  rationale: 여기서는 제한·집중을 나타내는 뉘앙스이므로, 문두에서 소망을 한정하는 한국어 ‘오직’이 가장 자연스럽고 source-direct합니다.
- source_word: שֵׂכֶל וּבִינָה
  english_pob_choice: insight and understanding
  chosen_korean: 지혜와 명철
  alternatives_korean:
  - 통찰과 이해
  - 분별과 이해
  - 지혜와 이해력
  lexicon: HALOT
  rationale: 두 단어의 의미를 구분하되 자연스러운 한국어 짝을 살리기 위해 ‘지혜와 명철’을 택했습니다. ‘명철’은 practical understanding의 뉘앙스를 담아 쌍을 유지합니다.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  english_pob_choice: command you concerning Israel
  chosen_korean: 당신을 이스라엘 위에 세우셔서
  alternatives_korean:
  - 당신에게 이스라엘에 관해 명령하셔서
  - 이스라엘을 맡기셔서
  - 이스라엘을 다스리게 하셔서
  lexicon: HALOT
  rationale: צוה + עַל이 왕권 문맥에서 단순한 ‘명령하다’보다 위임·임명의 뜻을 띨 수 있으므로, 문맥상 드러나는 통치 위임을 살린 표현을 택했습니다.
- source_word: וְלִשְׁמוֹר אֶת תּוֹרַת יְהוָה
  english_pob_choice: that you may keep the law of Yahweh
  chosen_korean: 야훼 당신의 하나님의 율법을 지키게
  alternatives_korean:
  - 야훼 당신의 하나님의 가르침을 지키게
  - 야훼 당신의 하나님의 교훈을 지키게
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 언약적 규범을 가리키므로 ‘율법’이 가장 분명합니다. ‘지키게’는 목적절의 의미를 자연스럽게 드러냅니다.
