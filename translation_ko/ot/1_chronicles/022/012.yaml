translation:
  language: ko
  text: 다만 야훼께서 당신에게 지혜와 명철을 주시고, 이스라엘을 당신에게 맡기시어[a] 당신의 하나님 야훼의 율법을 지키게 하시기를 바랍니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘에 관하여 당신에게 명령하시어’로 옮길 수 있습니다. 히브리어 동사는 보통 ‘명령하다’라는 뜻이지만, 이 문맥에서는 이스라엘에 대한 위임 또는 책임을 맡기는 뜻으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 하나님 야훼의 교훈’으로 옮길 수 있습니다.
    reason: lexical_alternative
