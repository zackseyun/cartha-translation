translation:
  language: ko
  text: 그때 다윗이 말했습니다[a]. “이것이 야훼 하나님의 집이며, 이것이 이스라엘을 위한 번제의 제단입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼 하나님의 성전입니다.” 히브리어는 “야훼 하나님의 집”이라고 되어 있습니다.
