  - marker: b
    text: 또는 “이스라엘을 위한 번제 제단입니다.” 히브리어의 단수 ‘번제’는 일반적 의미로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִיד
  english_pob_choice: Then David said
  chosen_korean: 그때 다윗이 말했습니다
  alternatives_korean:
  - 그리고 다윗이 말했습니다
  - 그리하여 다윗이 말했습니다
  lexicon: HALOT
  rationale: וַיֹּאמֶר는 서술 진행을 여는 연속형이므로 한국어에서는 자연스러운 시간 전개를 살려 ‘그때’로 옮기고, 다윗의 발화는 합쇼체로 처리했습니다.
- source_word: בֵּית יְהוָה הָאֱלֹהִים
  english_pob_choice: the house of Yahweh God
  chosen_korean: 야훼 하나님의 집
  alternatives_korean:
  - 야훼 하나님의 성전
  - 야훼 하나님의 집
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘집’(בֵּית)이라고 말하므로, 문맥상 성전이라 하더라도 해석어보다 원문어를 우선해 ‘집’으로 옮겼습니다.
- source_word: לְעֹלָה
  english_pob_choice: for burnt offering
  chosen_korean: 번제의
  alternatives_korean:
  - 번제를 위한
  - 번제용
  lexicon: HALOT
  rationale: לְעֹלָה는 목적/용도를 나타내며, 한국어에서는 명사 수식을 자연스럽게 살려 ‘번제의 제단’으로 옮기는 것이 가장 간결합니다.
- source_word: לְיִשְׂרָאֵל
  english_pob_choice: for Israel
  chosen_korean: 이스라엘을 위한
  alternatives_korean:
  - 이스라엘을 위하여
  - 이스라엘의
  lexicon: HALOT
  rationale: 전치사 לְ는 단순 소속보다 목적·수혜의 뉘앙스를 띠므로 ‘이스라엘을 위한’이 원문의 기능을 잘 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 사람이 아닌 고유한 언약 이름을 보존하기 위해 전통적 대치어인 ‘주님’ 대신 음역형 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: בֵּית יְהוָה הָאֱלֹהִים의 번역 범위
  chosen_reading: 집
  alternative_readings:
  - 성전
  - 성전 집
  rationale: 이 구절은 성전의 기능을 말하지만 히브리어 표현 자체는 ‘집’이므로, 해석을 덧붙이기보다 원문 형식을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy over translation tradition'
