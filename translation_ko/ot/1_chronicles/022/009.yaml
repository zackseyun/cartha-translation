    rationale: מִסָּבִיב은 앞의 '모든 원수'를 다시 명명하는 말이라기보다 '사방에서'라는 포괄적 위치·상황을 덧붙입니다.
  - severity: medium
    issue: 각주 a가 '보십시오'에 붙어 있으나 내용은 이름 어순의 대안임
    rationale: 각주 내용과 표지의 위치가 일치하지 않습니다. 또한 영어 POB 감사 기록의 이름 설명 문화 주석도 한국어 각주에 반영하는 것이 적절합니다.
