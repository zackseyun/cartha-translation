id: 1CH.22.9
reference: 1 Chronicles 22:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
  footnotes:
  - marker: a
    text: Or, 'his name will be Solomon.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew links 'Solomon' with 'peace' (shalom), and also speaks of him as a 'man of rest.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 당신에게 아들이 태어날 것입니다. 그는 평안의 사람이 될 것이며, 내가 그의 모든 원수들로부터, 곧 사방의 원수들로부터 그를 쉬게 하겠습니다. 그의 이름은 솔로몬이 될 것이니, 내가 그의 날에 이스라엘에 평강과 고요를 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '그의 이름은 솔로몬이 될 것이다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끌고 엄숙하게 선포하는 감탄사를 현대 합쇼체 명령형으로 옮겼습니다. '보라'보다 청중을 향한 직접성이 있고, 서술의 긴장도 유지합니다.
- source_word: אִישׁ מְנוּחָה
  english_pob_choice: a man of rest
  chosen_korean: 평안의 사람
  alternatives_korean:
  - 안식의 사람
  - 쉼의 사람
  lexicon: HALOT
  rationale: 직역하면 '쉼의 사람'이지만 한국어에서는 다소 부자연스러워, 문맥의 의미인 안정과 평온을 살려 '평안의 사람'으로 옮겼습니다. 다만 뒤의 '쉬게 하겠습니다'와의 연결은 유지했습니다.
- source_word: וַהֲנִחוֹתִי לוֹ
  english_pob_choice: and I will give him rest
  chosen_korean: 내가 ... 그를 쉬게 하겠습니다
  alternatives_korean:
  - 내가 ... 그에게 안식을 주겠습니다
  - 내가 ... 그를 편안히 하겠습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 '쉬게 하다/안식을 주다' 의미를 살리면서, 앞의 '평안의 사람'과의 반복을 한국어로도 드러내기 위해 '쉬게 하겠습니다'를 택했습니다.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  english_pob_choice: Solomon will be his name
  chosen_korean: 그의 이름은 솔로몬이 될 것이니
  alternatives_korean:
  - 솔로몬이 그의 이름이 될 것이니
  - 그의 이름은 솔로몬이겠습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 설명 구조를 자연스러운 한국어 어순으로 옮겼습니다. 고유명사는 관례에 따라 '솔로몬'을 사용했습니다.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  english_pob_choice: peace and quiet
  chosen_korean: 평강과 고요
  alternatives_korean:
  - 평화와 고요
  - 평강과 평온
  lexicon: HALOT
  rationale: '''שָׁלוֹם''은 신학적으로는 ''평강''이 가장 적절하고, ''שֶׁקֶט''은 ''고요/조용함''의 뜻이므로 서로 구별되게 옮겼습니다. 영어 POB의 ''peace and quiet''도 이 이중성을 반영합니다.'
- source_word: בְּיָמָיו
  english_pob_choice: in his days
  chosen_korean: 그의 날에
  alternatives_korean:
  - 그의 시대에
  - 그가 사는 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 보다 직결적으로 살리되, 한국어 문장 흐름에 맞게 '그의 날에'로 옮겼습니다.
theological_decisions:
- issue: 히브리어 인사/선포 표현의 격식
  chosen_reading: '''보십시오''로 시작해 엄숙한 선언의 분위기를 유지했습니다.'
  alternative_readings:
  - 보라
  - 봐라
  rationale: 이 구절은 다윗에게 주어지는 신적 예고이므로, 지나치게 구어적인 표현보다 합쇼체의 격식을 살리는 것이 본문의 권위를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§2, 5
- issue: 평안/평강/고요의 삼중 어휘
  chosen_reading: '''평안의 사람'', ''평강'', ''고요''로 서로 다른 히브리어 어휘를 구분해 옮겼습니다.'
  alternative_readings:
  - 모두 평화로 통일
  rationale: 원문은 מְנוּחָה, שָׁלוֹם, שֶׁקֶט의 뜻 차이를 함께 살립니다. 한국어에서도 동일어 반복으로 뭉개지지 않도록 구분하여 번역하는 것이 해석상 더 정직합니다.
  doctrine_reference: Translation philosophy §§2, 5
