  terminology: ‘야훼’, ‘안식’, ‘내 손에 넘겨주다’, ‘정복되다’는 적절합니다. 신명은 고유명으로 유지했으며, עַמּוֹ의 소유 대명사는 본문에서 야훼를 가리키는 것으로 옮기되 각주에서 다윗을 가리킬 가능성을 보존했습니다.
