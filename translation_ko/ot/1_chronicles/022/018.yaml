revisions:
- from: 야훼 너희 하나님이 너희와 함께 계시지 않느냐? 그리고 그분이 너희에게 사방으로부터 안식을 주시지 않았느냐? 이는 그분이 그 땅의 주민들을 내 손에 넘기셨기 때문입니다. 그리하여 그 땅은 야훼 앞과 그의 백성 앞에 정복되었습니다.[a]
  to: 너희의 하나님 야훼께서 너희와 함께 계시지 않습니까? 그분께서 너희에게 사방에 안식을 주시지 않았습니까? 그분께서 그 땅의 주민들을 내 손에 넘겨주셨으며, 그 땅은 야훼 앞에서, 또 그의 백성 앞에서 정복되었습니다.[a]
  rationale: 수사 의문을 현대 공식 합쇼체로 통일하고, ‘사방에 안식’을 통해 מִסָּבִיב의 문맥상 의미를 자연스럽게 반영했습니다. 또한 כִּי 이하의 두 병렬 절을 ‘…넘겨주셨으며’로 연결하여 원문의 관계를 보존했습니다. עַמּוֹ의 지시 대상에 관한 대안은 본문을 과도하게 단정하지 않도록 각주에 유지했습니다.
