id: 1CH.22.18
reference: 1 Chronicles 22:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
  footnotes:
  - marker: a
    text: Or, 'and in the sight of his people.' The pronoun in 'his people' is best taken to refer to the LORD, though some may understand it as referring to David.
    reason: alternative_reading
translation:
  language: ko
  text: 너희의 하나님 야훼께서 너희와 함께 계시지 않습니까? 그분께서 너희에게 사방에 안식을 주시지 않았습니까? 그분께서 그 땅의 주민들을 내 손에 넘겨주셨으며, 그 땅은 야훼 앞에서, 또 그의 백성 앞에서 정복되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 백성이 보는 앞에서’. ‘그의’는 가장 자연스럽게 야훼를 가리키지만, 다윗을 가리킨다고 볼 여지도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유 신명 표기
  rationale: POB의 מקור론적 원칙에 따라 테트라그람마톤을 존칭 대체어가 아닌 고유명으로 옮기기 위해 ‘야훼’를 사용했습니다.
- source_word: הֲלֹא
  english_pob_choice: Is not
  chosen_korean: …지 않느냐
  alternatives_korean:
  - …않습니까
  - …아닙니까
  lexicon: HALOT
  rationale: 기대 답을 전제하는 수사 의문이므로 한국어에서는 반문형 종결로 자연스럽게 살렸습니다.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  english_pob_choice: given you rest on every side
  chosen_korean: 너희에게 사방으로부터 안식을 주시지 않았느냐
  alternatives_korean:
  - 너희에게 사방에서 쉼을 주시지 않았느냐
  - 너희를 둘러싼 모든 곳에서 쉬게 하지 않으셨느냐
  lexicon: HALOT
  rationale: נוח/הניח의 ‘안식을 주다, 쉬게 하다’ 의미를 살리고, מִסָּבִיב는 전쟁 문맥의 관용구로 ‘사방으로부터’로 옮겼습니다.
- source_word: נָתַן בְּיָדִי
  english_pob_choice: given ... into my hand
  chosen_korean: 내 손에 넘기셨기 때문입니다
  alternatives_korean:
  - 내 손에 주셨기 때문입니다
  - 내 권세 아래 넘기셨기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘넘겨 주다/맡기다’ 뉘앙스를 살리면서 한국어에서 가장 자연스럽고 힘 있는 표현을 택했습니다.
- source_word: וְלִפְנֵי עַמּוֹ
  english_pob_choice: before his people
  chosen_korean: 그의 백성 앞에
  alternatives_korean:
  - 그분의 백성 앞에
  - 그의 백성의 눈앞에
  lexicon: HALOT
  rationale: 앞의 병행구 ‘야훼 앞에’와 대응시키되, 대명사 ‘his’의 지시 대상을 본문 흐름대로 야훼로 유지했습니다.
theological_decisions:
- issue: ‘his people’의 대명사 지시 대상
  chosen_reading: ‘his’는 야훼를 가리키도록 번역했습니다.
  alternative_readings:
  - ‘his’가 다윗을 가리킨다고 볼 수 있습니다.
  - 대명사 지시를 모호하게 두는 번역이 가능합니다.
  rationale: 가장 가까운 선행사이자 앞 절의 병행 구조가 야훼와 그의 백성을 짝지으므로, 본문이 요구하는 최소한의 해석을 따라 옮겼습니다.
  doctrine_reference: 해석상 긴장을 과도하게 해소하지 않고, 문맥이 지지하는 지시 대상을 우선 반영합니다.
