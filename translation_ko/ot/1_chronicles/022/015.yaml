  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
  footnotes:
  - marker: a
    text: Or 'and every skilled worker.' The Hebrew is literally masculine singular, 'every skilled man,' used here in a representative sense for skilled laborers.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신 곁에는 많은 일꾼들이 있습니다. 곧 돌을 다듬는 석공들과 돌과 나무를 다루는 기술자들, 그리고 온갖 일에 능숙한 모든 사람이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘온갖 일에 능숙한 모든 남자’로 되어 있습니다. 여기서 남성 단수 표현은 숙련된 노동자들을 대표하여 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְּךָ
  english_pob_choice: And with you
  chosen_korean: 그리고 당신과 함께
  alternatives_korean:
  - 당신과 함께
  - 또 당신과 함께
  lexicon: HALOT
  rationale: 직접적 동반 관계와 앞 문맥과의 연결을 살리기 위해 ‘그리고 … 함께’로 옮겼습니다.
- source_word: לָרֹב
  english_pob_choice: in abundance
  chosen_korean: 풍부합니다
  alternatives_korean:
  - 많습니다
  - 매우 많습니다
  lexicon: HALOT
  rationale: 수량이 넉넉하다는 뜻을 현대 한국어에서 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: חֹצְבִים
  english_pob_choice: stonecutters
  chosen_korean: 돌을 다듬는 사람들
  alternatives_korean:
  - 석공들
  - 돌을 깨는 사람들
  lexicon: HALOT
  rationale: 건축 문맥상 돌을 가공하는 기능을 분명히 하되, 한국어에서 지나치게 협소하거나 고어적인 표현은 피했습니다.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  english_pob_choice: craftsmen of stone and wood
  chosen_korean: 돌과 나무로 일하는 기술자들
  alternatives_korean:
  - 돌과 나무의 장인들
  - 돌과 나무의 기술자들
  lexicon: HALOT
  rationale: חָרָשׁ의 숙련된 기술자라는 의미를 살리면서, 재료를 다루는 작업 범위를 한국어로 자연스럽게 표현했습니다.
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  english_pob_choice: and every skilled man for every kind of work
  chosen_korean: 모든 일에 능숙한 모든 숙련자들
  alternatives_korean:
  - 모든 일에 능숙한 모든 기술자들
  - 모든 종류의 일에 능한 모든 사람들
  lexicon: HALOT
  rationale: 여기서 חָכָם은 지적 ‘지혜’보다 실무적 숙련을 가리키므로 ‘숙련자’로 옮겼고, 전칭적 의미를 살리기 위해 앞뒤를 모두 포괄적으로 표현했습니다.
theological_decisions:
- issue: חָכָם의 남성 단수 형식과 대표성
  chosen_reading: 모든 숙련자들
  alternative_readings:
  - 모든 숙련한 남자들
  - 모든 숙련자
  rationale: 히브리어는 남성 단수 형식을 쓰지만, 이 절의 문맥은 공사에 참여하는 숙련 인력을 대표적으로 말하므로 한국어에서는 성별을 굳이 드러내지 않고 집합적으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
