revisions:
- from: 그리고 당신과 함께 일꾼이 풍부합니다. 곧 돌을 다듬는 사람들과 돌과 나무로 일하는 기술자들과, 모든 일에 능숙한 모든 숙련자들입니다.[a]
  to: 당신 곁에는 많은 일꾼들이 있습니다. 곧 돌을 다듬는 석공들과 돌과 나무를 다루는 기술자들, 그리고 온갖 일에 능숙한 모든 사람이 있습니다.[a]
  rationale: 원문의 열거 구조와 풍부한 수량의 뜻을 자연스러운 한국어 문장으로 재구성했습니다. 불필요한 전칭의 중복을 제거하고, 기술 직능의 의미를 명료하게 했습니다. 각주는 히브리어의 남성 단수 형식과 대표적 용법을 설명하되 본문을 부자연스럽게 성별화하지 않습니다.
  reviewer_model: gpt-5.6-terra
