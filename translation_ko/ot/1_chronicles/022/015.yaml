  - severity: medium
    issue: ‘모든 일에 능숙한 모든 숙련자들’이 전칭 표현을 중복합니다.
    rationale: וְכָל חָכָם בְּכָל מְלָאכָה는 ‘온갖 일에 능숙한 모든 사람’ 정도이며, 한국어에서 ‘모든’의 반복은 부자연스럽습니다.
  - severity: low
