lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: Then ... commanded
  chosen_korean: 그때 ... 명령했습니다
  alternatives_korean:
  - 그리고 ... 명령했습니다
  - 지시했습니다
  lexicon: HALOT
  rationale: 연속 서술을 나타내는 와우연결형의 흐름을 살리면서, צוה의 강한 권위성을 한국어 ‘명령했습니다’로 직접 반영했습니다.
- source_word: שָׂרֵי יִשְׂרָאֵל
  english_pob_choice: all the leaders of Israel
  chosen_korean: 이스라엘의 모든 지도자들
  alternatives_korean:
  - 이스라엘의 모든 관리들
  - 이스라엘의 모든 통치자들
  lexicon: HALOT
  rationale: שָׂרִים의 넓은 행정·통치적 의미를 살려, 현대 독자에게 자연스러운 ‘지도자들’을 택했습니다.
- source_word: לַעְזֹר
  english_pob_choice: to help
  chosen_korean: 돕도록
  alternatives_korean:
  - 도와
  - 보조하도록
  lexicon: HALOT
  rationale: עזר의 기본 뜻을 가장 직접적으로 옮겨, 솔로몬을 실질적으로 지원하라는 뜻을 분명히 했습니다.
- source_word: לִשְׁלֹמֹה בְנוֹ
  english_pob_choice: Solomon his son
  chosen_korean: 자기의 아들 솔로몬
  alternatives_korean:
  - 솔로몬, 자기의 아들
  - 자기의 아들인 솔로몬
  lexicon: HALOT
  rationale: 히브리어의 소유관계와 동격을 자연스러운 한국어 어순으로 재배열하면서도, 솔로몬이 다윗의 아들임을 분명히 유지했습니다.
