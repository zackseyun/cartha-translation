  naturalness: ‘야훼의 말씀이 내게 임했습니다. 말씀하시기를’은 현대 표준어에서 예언 공식의 뜻을 자연스럽고 명료하게 전달합니다. 직접 인용도 합쇼체로 일관되게 다듬었습니다.
  terminology: ‘야훼’, ‘말씀’, ‘내 이름을 위한 집’을 유지했습니다. ‘집’은 본문에 보존하고 성전이라는 지시 대상은 주석에서만 밝혔습니다.
