- from: 그러나 야훼의 말씀이 내게 임하여 말씀하셨습니다. “네가 많은 피를 흘렸고 큰 전쟁들을 치렀으니, 내 이름을 위한 집을 너는 건축하지 못할 것이다. 네가 내 앞에서 땅에 많은 피를 흘렸기 때문이다.”[a][b][c][d]
  to: 야훼의 말씀이 내게 임했습니다. 말씀하시기를, “당신은 많은 피를 흘렸고[a] 큰 전쟁들을 치렀습니다[b]. 그러므로 당신은 내 이름을 위한 집[c]을 짓지 못할 것입니다. 당신이 내 앞에서 땅에[d] 많은 피를 흘렸기 때문입니다.”
  rationale: 역접적 의미를 제거하고, ‘말씀이 임함’과 그 뒤의 인용을 분명히 구분했습니다. 원문의 두 혈흘림 진술, 전쟁 수행, ‘내 이름을 위한 집’, 그리고 ‘내 앞에서 땅에’라는 표현을 유지했습니다. 또한 모든 각주를 해당 어구에 직접 연결했습니다.
