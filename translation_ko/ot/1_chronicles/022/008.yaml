  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
  footnotes:
  - marker: a
    text: Or 'blood in abundance' for 'much blood.'
    reason: lexical_alternative
  - marker: b
    text: Or 'waged great wars.'
    reason: lexical_alternative
  - marker: c
    text: That is, the temple; Hebrew 'a house for my name.'
    reason: cultural_note
  - marker: d
    text: Or 'to the ground' for 'on the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼의 말씀이 내게 임하여 말씀하셨습니다. “네가 많은 피를 흘렸고 큰 전쟁들을 치렀으니, 내 이름을 위한 집을 너는 건축하지 못할 것이다. 네가 내 앞에서 땅에 많은 피를 흘렸기 때문이다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피가 많은 양’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 전쟁들을 벌였다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 성전입니다. 히브리어는 ‘내 이름을 위한 집’이라고 합니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘땅으로’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה / וַיְהִי עָלַי
  english_pob_choice: the word of Yahweh came to me
  chosen_korean: “야훼의 말씀이 내게 임하여”
  alternatives_korean:
  - “야훼의 말씀이 내게 왔습니다”
  - “야훼의 말씀이 내 위에 있었습니다”
  lexicon: WLC + POB audit trail
  rationale: 예언자적 공식인 ‘말씀이 … 임하다’를 살리면서, פָּעַל idiom의 수동적·계시적 뉘앙스를 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: דָּם לָרֹב / דָּמִים רַבִּים
  english_pob_choice: much blood
  chosen_korean: “많은 피를 흘렸고”
  alternatives_korean:
  - “피를 많이 흘렸고”
  - “피가 많았고”
  lexicon: WLC + HALOT
  rationale: ‘피’ 자체보다 ‘흘리다’까지 포함해 혈통이 아니라 유혈행위를 분명히 드러내며, ‘많은’은 מקור의 양적 강조를 보존합니다.
- source_word: וּמִלְחָמוֹת גְּדֹלֹות עָשִׂיתָ
  english_pob_choice: fought great wars
  chosen_korean: “큰 전쟁들을 치렀으니”
  alternatives_korean:
  - “큰 전쟁들을 싸웠으니”
  - “큰 전쟁들을 하였으니”
  lexicon: HALOT
  rationale: 직역적 ‘하다/만들다’보다 한국어에서 자연스러운 ‘치르다’가 전쟁 수행의 의미를 잘 드러내며, 복수형도 유지했습니다.
- source_word: לִשְׁמִי / בַּיִת
  english_pob_choice: a house for my name
  chosen_korean: “내 이름을 위한 집”
  alternatives_korean:
  - “내 이름을 위한 집”
  - “내 이름을 위한 성전”
  lexicon: HALOT
  rationale: ‘집’은 히브리어의 표면 표현을 유지해 성전-집 모티프를 보존하고, ‘내 이름을 위한’도 언약적 목적 구문을 그대로 살렸습니다.
- source_word: אַרְצָה לְפָנָי
  english_pob_choice: on the earth before me
  chosen_korean: “땅에 … 내 앞에서”
  alternatives_korean:
  - “땅에 … 내 앞에서”
  - “땅으로 … 내 앞에서”
  lexicon: HALOT
  rationale: ‘אַרְצָה’를 ‘땅에’로 옮겨 피 흘림의 장소성을 유지하고, ‘내 앞에서’로 하나님의 시야 앞에서의 행위를 분명히 했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 고유명사 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본 항목은 단순 호칭이 아니라 언약적 신명 자체이므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 사용해 מקור의 직접성을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘집’과 성전 의미
  chosen_reading: 본문의 ‘집’을 그대로 두고, 성전 의미는 주석 없이 본문 표현으로 유지했습니다.
  alternative_readings:
  - ‘성전’
  rationale: 히브리어가 실제로는 ‘집’을 말하므로, 해석어 ‘성전’으로 대체하면 집-성전 모티프가 약화될 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #5'
