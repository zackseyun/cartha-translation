source:
  edition: WLC
  text: עַתָּ֗ה תְּנ֤וּ לְבַבְ/כֶם֙ וְ/נַפְשְׁ/כֶ֔ם לִ/דְר֖וֹשׁ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/ק֗וּמוּ וּ/בְנוּ֙ אֶת מִקְדַּשׁ֙ יְהוָ֣ה הָֽ/אֱלֹהִ֔ים לְ/הָבִ֞יא אֶת אֲר֣וֹן בְּרִית יְהוָ֗ה וּ/כְלֵי֙ קֹ֣דֶשׁ הָֽ/אֱלֹהִ֔ים לַ/בַּ֖יִת הַ/נִּבְנֶ֥ה לְ/שֵׁם יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'give your heart and your soul' to seek the LORD your God.
    reason: lexical_alternative
  - marker: b
    text: '''House'' here refers to the temple building to be constructed for the LORD''s name.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 여러분은 마음과 영혼을 다하여 야훼 여러분의 하나님을 찾으십시오[a]. 일어나서 야훼 하나님의 성소를 건축하여, 야훼의 언약궤와 하나님의 거룩한 기구들을 야훼의 이름을 위해 지어질 집으로 들여놓으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마음과 영혼을 내어라/바쳐라’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  english_pob_choice: set your heart and your soul
  chosen_korean: 마음과 영혼을 다하여
  alternatives_korean:
  - 마음을 두고 영혼을 두어
  - 마음과 혼을 바쳐
  lexicon: HALOT
  rationale: 히브리어의 이중 내면 요소를 유지하되, 한국어에서는 ‘다하여’가 결단과 전념을 자연스럽게 드러내므로 직역보다 더 읽기 좋은 대응으로 잡았습니다.
- source_word: לִדְרוֹשׁ
  english_pob_choice: to seek
  chosen_korean: 찾으십시오
  alternatives_korean:
  - 구하십시오
  - 찾아 구하십시오
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 דָּרַשׁ은 단순 정보 탐색보다 간절히 찾고 구하는 의미이므로, 문맥상 가장 직접적인 ‘찾으십시오’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 학술 전사인 ‘야훼’를 사용했습니다.
- source_word: מִקְדַּשׁ
  english_pob_choice: the sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 성소 건물
  lexicon: HALOT
  rationale: 문맥상 아직 지어질 건축물을 가리키지만, 이어지는 ‘집’과 구별되는 거룩한 공간이라는 점을 살려 ‘성소’로 옮겼습니다.
- source_word: כְלֵי קֹדֶשׁ
  english_pob_choice: the holy vessels
  chosen_korean: 거룩한 기구들
  alternatives_korean:
  - 거룩한 그릇들
  - 성물들
  lexicon: HALOT
  rationale: כֵּלִים은 예배용 도구 전반을 가리키므로, 전통적이지만 다소 낯선 ‘기구들’이 문맥상 가장 넓고 정확합니다.
theological_decisions:
- issue: 여호와/야훼의 표기와 반복
  chosen_reading: 본절의 יְהוָה는 모두 ‘야훼’로 옮기고, 반복을 그대로 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 언약의 이름을 반복해 강조하므로, 이를 일반 호칭으로 완화하지 않고 동일 표기 ‘야훼’를 유지하는 것이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘야훼 하나님’과 ‘하나님’의 병치
  chosen_reading: ‘야훼 하나님’과 ‘하나님의 거룩한 기구들’을 병치해 히브리어의 호칭 반복을 살렸습니다.
  alternative_readings:
  - 야훼, 여러분의 하나님
  - 야훼 하나님
  rationale: 원문은 동일 절 안에서 ‘야훼 여러분의 하나님’과 ‘야훼 하나님/하나님’을 연속 배치하여 강조하므로, 한국어에서도 신적 명칭의 중첩을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
