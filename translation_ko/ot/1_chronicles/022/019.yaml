revisions:
- from: 이제 여러분은 마음과 영혼을 다하여 야훼 여러분의 하나님을 찾으십시오[a]. 일어나서 야훼 하나님의 성소를 건축하여, 야훼의 언약궤와 하나님의 거룩한 기구들을 야훼의 이름을 위해 지어질 집으로 들여놓으십시오.
  to: 이제 마음과 영혼을 바쳐 야훼, 여러분의 하나님을 찾으십시오[a]. 일어나 야훼 하나님의 성소를 세우십시오. 이는 야훼의 언약궤와 하나님의 거룩한 기구들을 야훼의 이름을 위하여 지어질 그 집[b]으로 들여놓기 위한 것입니다.
  rationale: The revision preserves the Hebrew’s paired inner faculties and imperative imagery, clarifies the appositional divine title in idiomatic Korean, and makes the infinitive’s purpose relationship explicit. It also restores the English audit trail’s explanatory note for ‘house.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal commands, the divine name, sanctuary, ark, and holy vessels. However, ‘마음과 영혼을 다하여’ slightly recasts the Hebrew imperative ‘give/set your heart and soul’ as an adverbial expression, and the purpose relation of the final infinitive is clearer when expressed explicitly. The source’s qualifier ‘the house being built for the name of Yahweh’ should remain attached to ‘house.’
  naturalness: The register is appropriately modern formal-polite. ‘야훼 여러분의 하나님’ is less natural than appositional ‘야훼, 여러분의 하나님,’ and separating the final purpose clause improves Korean readability without reducing formal equivalence.
  terminology: ‘야훼,’ ‘하나님,’ ‘성소,’ ‘언약궤,’ and ‘거룩한 기구들’ are suitable. Retain both ‘마음’ and ‘영혼’ to reflect the Hebrew pair. Add the omitted temple-building cultural note corresponding to the English audit trail, anchored at ‘집.’
  issues:
  - severity: medium
    issue: The lexical-alternative footnote is retained, but the main rendering ‘마음과 영혼을 다하여’ does not as closely preserve the source’s imperative to give/direct both faculties.
    rationale: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם is literally an imperative to give one’s heart and soul; ‘마음과 영혼을 바쳐’ preserves both the verbal image and the paired terms while remaining natural in context.
  - severity: low
    issue: The appositional phrase ‘Yahweh your God’ is rendered without punctuation as ‘야훼 여러분의 하나님.’
    rationale: Korean formal prose reads the divine name and its apposition more clearly as ‘야훼, 여러분의 하나님.’
  - severity: medium
    issue: The cultural note on ‘house’ found in the English POB audit trail is absent.
    rationale: The note helps distinguish the house as the temple building and should be supplied with an anchor at ‘집,’ without altering the translation.
  revised_text: 이제 마음과 영혼을 바쳐 야훼, 여러분의 하나님을 찾으십시오[a]. 일어나 야훼 하나님의 성소를 세우십시오. 이는 야훼의 언약궤와 하나님의 거룩한 기구들을 야훼의 이름을 위하여 지어질 그 집[b]으로 들여놓기 위한 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘마음과 영혼을 내어라’ 또는 ‘바쳐라’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘집’은 야훼의 이름을 위하여 세워질 성전 건물을 가리킵니다.
    reason: cultural_note
  revision_rationale: The revision preserves the Hebrew’s paired inner faculties and imperative imagery, clarifies the appositional divine title in idiomatic Korean, and makes the infinitive’s purpose relationship explicit. It also restores the English audit trail’s explanatory note for ‘house.’
