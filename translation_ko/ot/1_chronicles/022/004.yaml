theological_decisions:
- issue: 재목의 의미 범위
  chosen_reading: ‘백향목 재목’으로 옮겨, 단순한 ‘나무’가 아니라 성전 건축에 쓰일 가공된 자재라는 점을 드러냈습니다.
  alternative_readings:
  - 백향목 나무
  - 백향목 목재
  rationale: 문맥상 솔로몬 성전 준비를 위한 물자 조달이므로, 원문의 חומר적·건축적 의미를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성전 준비 기사(역대상 22장) 맥락
