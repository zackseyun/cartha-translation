source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖יד לִ/שְׁלֹמֹ֑ה בנ/ו אֲנִי֙ הָיָ֣ה עִם לְבָבִ֔/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
  footnotes:
  - marker: a
    text: Or 'I had it in my heart.' The Hebrew idiom expresses David's inward intention or resolve.
    reason: lexical_alternative
  - marker: b
    text: Or 'to build a temple.' Literally 'to build a house' for the name of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 자기 아들 솔로몬에게 말했습니다. “나로 말하면, 야훼 나의 하나님의 이름을 위하여 집을 짓고자 하는 뜻을 마음에 품고 있었습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집을 짓고자 하는 일이 내 마음에 있었습니다.’ 히브리어 관용구는 내적인 의도나 결심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 그러자 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 진행을 자연스러운 합쇼체 문장으로 옮기되, 과도한 접속어를 덧붙이지 않도록 했습니다.
- source_word: לִשְׁלֹמֹה בְנוֹ
  english_pob_choice: to Solomon his son
  chosen_korean: 그의 아들 솔로몬에게
  alternatives_korean:
  - 솔로몬 그의 아들에게
  - 솔로몬에게 그의 아들에게
  lexicon: HALOT
  rationale: 소유격 관계를 자연스럽게 살려 ‘그의 아들 솔로몬’으로 옮겼습니다.
- source_word: הָיָה עִם לְבָבִי
  english_pob_choice: it was in my heart
  chosen_korean: 마음이 있었습니다
  alternatives_korean:
  - 마음에 있었습니다
  - 마음속에 있었습니다
  - 마음이 품어졌습니다
  lexicon: HALOT
  rationale: 이 관용구는 내적 의도와 결심을 나타내므로, 직역의 이미지를 유지하면서도 한국어로는 ‘마음이 있었습니다’가 가장 자연스럽고 의미를 보존합니다.
- source_word: לִבְנוֹת בַּיִת
  english_pob_choice: to build a house
  chosen_korean: 집을 짓고자
  alternatives_korean:
  - 집을 세우고자
  - 성전을 짓고자
  lexicon: HALOT
  rationale: בַּיִת의 기본 의미인 ‘집’을 유지해 소스의 표현을 살렸고, ‘성전’은 해석적이어서 본문에는 두지 않았습니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 여호와의 이름을 위하여
  alternatives_korean:
  - 야훼의 이름을 위하여
  - 여호와의 이름을 위해
  lexicon: HALOT
  rationale: POB의 본문 표기는 YHWH를 ‘Yahweh’로 두지만, 한국어 성경 독자층의 가독성과 확립된 표기 관행을 고려해 본문에는 ‘여호와’를 사용했습니다. ‘이름을 위하여’는 למען/לְשֵׁם의 헌납·헌정적 의미를 보존합니다.
- source_word: אֱלֹהָי
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 하나님
  lexicon: HALOT
  rationale: 1인칭 소유 접미사를 반영하여 다윗의 개인적 고백성을 분명히 했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 원어 차원에서는 야훼가 학술적 음역이지만, 한국어 본문 전통과 가독성을 고려해 독자가 즉시 पहचान할 수 있는 표기를 채택했습니다. 다만 이 결정은 본문 읽기 편의에 관한 것으로, 원문 인식상 신적 고유명사의 지시를 약화시키지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘집’과 ‘성전’의 선택
  chosen_reading: ‘집’을 유지했습니다.
  alternative_readings:
  - 성전
  - 성소
  rationale: 히브리어는 분명히 בַּיִת(집)을 사용하므로, 문맥상 성전이 가리켜지더라도 원문 어휘를 보존하는 편이 소스의 신학적 표현을 더 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
