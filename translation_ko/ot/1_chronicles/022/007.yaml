  to: 다윗이 자기 아들 솔로몬에게 말했습니다. “나로 말하면, 야훼 나의 하나님의 이름을 위하여 집을 짓고자 하는 뜻을 마음에 품고 있었습니다[a].”
  rationale: 신명 יְהוָה를 프로젝트 방침에 맞게 ‘야훼’로 바로잡고, 명시적 1인칭의 강조는 ‘나로 말하면’으로 보존했습니다. 히브리어 관용구는 한국어에서 자연스러운 ‘뜻을 마음에 품고 있었습니다’로 옮겼으며, בַּיִת의 문자적 표현인 ‘집’을 유지했습니다. 남긴 각주는 실제로 설명하는 관용구에 직접 연결했습니다.
