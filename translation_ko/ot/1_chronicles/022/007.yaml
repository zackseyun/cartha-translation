  source_fidelity: 히브리어의 명시적 1인칭 주어 אֲנִי와 ‘마음에 두다/품다’라는 관용구를 더 분명히 반영해야 합니다. 또한 יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 옮겨야 합니다. בַּיִת는 해석적인 ‘성전’ 대신 ‘집’으로 유지하는 것이 적절합니다.
  naturalness: ‘마음이 있었습니다’는 의도를 나타내기는 하나 한국어에서는 다소 불완전하고 어색합니다. ‘뜻을 마음에 품고 있었습니다’가 현대 표준어 합쇼체에서 자연스럽고 원문의 관용적 의미도 잘 전달합니다.
