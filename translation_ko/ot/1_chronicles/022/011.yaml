  naturalness: ‘야훼께서 너와 함께하시고, 네가 … 건축하기를 바랍니다’는 현대 표준 한국어의 격식 있는 축원 표현으로 자연스럽습니다. ‘네 하나님 야훼의 집’은 원문의 ‘야훼, 네 하나님’이라는 동격·소유 관계를 한국어에서 자연스럽게 표현합니다.
