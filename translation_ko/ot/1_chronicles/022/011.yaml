base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
  footnotes:
  - marker: a
    text: Or, 'and may you succeed'; the Hebrew verb can mean 'prosper' or 'succeed.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'the temple of the LORD your God.' Literally, 'the house of the LORD your God.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'as he promised regarding you.' The Hebrew more literally says, 'as he has spoken concerning you.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제, 내 아들아, 야훼께서 너와 함께하시어 네가 형통하여 야훼 너의 하나님 집을 건축하되, 그가 너에 관하여 말씀하신 바와 같이 하라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형통하여’는 히브리어 동사가 ‘형통하다’ 또는 ‘성공하다’의 뜻을 가질 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼 너의 하나님 집’입니다. 문맥상 ‘야훼 너의 하나님 성전’으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 더 문자적으로 ‘그가 너에 관하여 말씀하신 바와 같이’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그제서야
  lexicon: HALOT
  rationale: 담화 전환을 여는 시간 부사로서 자연스럽고 간결한 한국어 대응은 ‘이제’입니다.
- source_word: בְנִי
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: HALOT
  rationale: 아버지 다윗의 직접 호칭이므로 2인칭 대화체를 살린 ‘내 아들아’가 관계와 정서를 가장 잘 드러냅니다.
- source_word: יְהִי יְהוָה עִמָּךְ
  english_pob_choice: may Yahweh be with you
  chosen_korean: 야훼께서 너와 함께하시어
  alternatives_korean:
  - 야훼께서 너와 함께하시기를
  - 야훼께서 너와 함께 계시어
  lexicon: HALOT
  rationale: יַהְוֶה의 이름은 본문 전통에 따라 ‘야훼’로 옮기고, יְהִי의 축복·기원적 힘은 ‘-하시어’로 이어지는 소망형으로 살렸습니다.
- source_word: וְהִצְלַחְתָּ
  english_pob_choice: may you prosper
  chosen_korean: 네가 형통하여
  alternatives_korean:
  - 네가 성공하여
  - 네가 잘되며
  lexicon: HALOT
  rationale: 동사의 성공/형통 의미를 보존하되, 성전 건축 문맥에 어울리는 포괄적이고 문어적인 ‘형통하다’를 택했습니다.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  english_pob_choice: the house of Yahweh your God
  chosen_korean: 야훼 너의 하나님 집
  alternatives_korean:
  - 야훼 너의 하나님 성전
  - 야훼 너의 하나님의 집
  lexicon: HALOT
  rationale: 히브리어의 직역적 표현인 ‘집’을 유지해 신학적 상징성을 살렸고, 전통적 해석어인 ‘성전’은 해석적이므로 본문에는 두지 않았습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  english_pob_choice: as he has spoken concerning you
  chosen_korean: 그가 너에 관하여 말씀하신 바와 같이
  alternatives_korean:
  - 그가 너에 대해 말씀하신 대로
  - 그가 너를 두고 말씀하신 바와 같이
  lexicon: HALOT
  rationale: דבר + על의 ‘~에 관하여 말하다’ 의미를 그대로 살려, 약속을 덧씌우기보다 ‘말씀하신 바’라는 본문적 표현을 유지했습니다.
