  text: 이제 내 아들아, 야훼께서 너와 함께하시고, 네가 형통하여 그분께서 너에 관하여 말씀하신 대로 네 하나님 야훼의 집을 건축하기를 바랍니다.[a][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형통하여’로 옮긴 히브리어 동사는 ‘성공하다’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 하나님 야훼의 집’입니다. 문맥상 ‘네 하나님 야훼의 성전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그분께서 너에 관하여 약속하신 대로’로 옮길 수 있습니다. 히브리어 표현은 문자적으로 ‘그분께서 너에 관하여 말씀하신 대로’입니다.
    reason: alternative_reading
