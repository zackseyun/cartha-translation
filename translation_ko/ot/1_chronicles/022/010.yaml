source:
  edition: WLC
  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
  footnotes:
  - marker: a
    text: Or 'temple for my name.' The Hebrew reads literally 'house for my name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내 이름을 위한 집을 지을 것이며, 그는 내게 아들이 되고 나는 그에게 아버지가 될 것이며, 나는 그의 왕국의 왕좌를 이스라엘 위에 영원히 세울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 이름을 위한 성전’입니다. 히브리어는 문자적으로 ‘내 이름을 위한 집’이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת / לִשְׁמִי
  english_pob_choice: house for my name
  chosen_korean: 내 이름을 위한 집
  alternatives_korean:
  - 내 이름을 위한 성전
  - 내 이름을 위한 집성소
  lexicon: HALOT
  rationale: בית는 기본적으로 ‘집’이며, לִשְׁמִי의 구조를 살려 ‘내 이름을 위한 집’으로 옮기면 본문의 직설적 표현과 전용된 공간이라는 의미를 함께 보존합니다.
- source_word: לְבֵן / לְאָב
  english_pob_choice: a son ... a father
  chosen_korean: 아들이 되고 ... 아버지가 될
  alternatives_korean:
  - 아들이 되며 ... 아버지가 될
  - 아들로 ... 아버지로
  lexicon: HALOT
  rationale: 관계적 술어를 한국어답게 자연스럽게 풀어 주되, 단순 비유가 아니라 언약적 부자 관계라는 직접성을 유지했습니다.
- source_word: וַהֲכִינוֹתִי
  english_pob_choice: I will establish
  chosen_korean: 세울 것입니다
  alternatives_korean:
  - 견고히 세울 것입니다
  - 확립할 것입니다
  lexicon: HALOT
  rationale: כּוּן 히필의 ‘견고하게 세우다/확립하다’의 의미를 왕좌와 결합해 자연스럽게 옮겼습니다.
- source_word: כִּסֵּא מַלְכוּתוֹ
  english_pob_choice: the throne of his kingdom
  chosen_korean: 그의 왕국의 왕좌
  alternatives_korean:
  - 그의 왕국의 보좌
  - 그의 왕권의 왕좌
  lexicon: HALOT
  rationale: ‘왕좌’로 כסא를 살리고, ‘왕국’으로 מלכות의 통치 영역을 드러내어 왕조적 약속의 중첩을 보존했습니다.
theological_decisions:
- issue: 아버지-아들 언약 공식의 직역성
  chosen_reading: ‘그는 내게 아들이 되고 나는 그에게 아버지가 될 것입니다’라는 관계 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘나는 그를 아들처럼 대할 것입니다’
  - ‘그와 친자 관계를 맺을 것입니다’
  rationale: 히브리어는 비유를 완화하지 않고 관계를 직접 진술하므로, 즉시적 대상인 솔로몬과 더 넓은 다윗 언약의 긴장을 함께 보존하기 위해 직역적 표현을 택했습니다.
  doctrine_reference: 언약 신학과 다윗 왕조 약속을 해설 없이 보존
