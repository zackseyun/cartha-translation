base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
  footnotes:
  - marker: a
    text: Or 'young and tender.' The Hebrew adjective can denote softness or delicacy; here it likely refers to Solomon's immaturity or inexperience.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''the temple.'' Hebrew: ''the house.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'for renown and beauty' / 'for a name and for glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말하였습니다. 「내 아들 솔로몬은 어리고 미숙합니다. 그리고 야훼를 위해 지을 집은 모든 땅에서 이름과 아름다움을 위해 매우 크게 지어져야 합니다. 이제 내가 그것을 준비하겠습니다.」 그래서 다윗은 죽기 전에 많이 준비하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어리고 미숙합니다’는 히브리어의 ‘젊고 연약한/부드러운’ 뉘앙스를 문맥에 따라 풀이한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 히브리어의 직역이며, 문맥상 여호와의 성소를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이름과 아름다움’은 ‘명성/영광’ 또는 ‘명예와 장엄함’의 뜻을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר וָרָךְ
  english_pob_choice: young and inexperienced
  chosen_korean: 어리고 미숙합니다
  alternatives_korean:
  - 어리고 연약합니다
  - 젊고 미숙합니다
  - 소년 같고 미숙합니다
  lexicon: HALOT
  rationale: 나עַר는 연령의 어림을, וָרָךְ는 문자적으로 ‘부드러운/연약한’ 뜻을 가지지만 여기서는 솔로몬의 준비 부족을 설명하므로 ‘미숙하다’가 문맥상 가장 분명합니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 집
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘집’이므로, 해석어인 ‘성전’보다 원문 표현을 살려 ‘집’으로 두었습니다.
- source_word: לְהַגְדִּיל לְמַעְלָה לְשֵׁם וּלְתִפְאֶרֶת
  english_pob_choice: must be made exceedingly great in fame and splendor
  chosen_korean: 매우 크게 지어져야 합니다…이름과 아름다움을 위해
  alternatives_korean:
  - 극진히 영화롭게 지어져야 합니다
  - 크게 높여져야 합니다…명성과 영광을 위해
  - 매우 웅장하게 지어져야 합니다…이름과 화려함을 위해
  lexicon: HALOT
  rationale: 반복된 전치사구를 한국어에서도 목적/결과의 뉘앙스로 살려 ‘이름과 아름다움을 위해’로 옮겼습니다. ‘아름다움’은 תִפְאֶרֶת의 외적 장엄함을 자연스럽게 전달합니다.
- source_word: לָרֹב
  english_pob_choice: abundant preparations
  chosen_korean: 많이 준비하였습니다
  alternatives_korean:
  - 풍성하게 준비하였습니다
  - 충분히 준비하였습니다
  - 많은 준비를 하였습니다
  lexicon: HALOT
  rationale: 마지막 절의 양적 강조를 한국어에서 자연스럽게 드러내기 위해 ‘많이 준비하였습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 야훼
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로 프로젝트 기본 원칙에 따라 고유한 언약명인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: בית의 번역을 ‘집’으로 둘지 ‘성전’으로 둘지
  chosen_reading: 집
  alternative_readings:
  - 성전
  rationale: 원문은 하우스/집을 말하며, 문맥이 성소를 가리키더라도 해석어로 바꾸지 않고 원문 어휘를 보존했습니다.
  doctrine_reference: 'Translation philosophy: source-direct wording over interpretive smoothing'
