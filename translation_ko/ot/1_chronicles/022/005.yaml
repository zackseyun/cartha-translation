base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
  footnotes:
  - marker: a
    text: Or 'young and tender.' The Hebrew adjective can denote softness or delicacy; here it likely refers to Solomon's immaturity or inexperience.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''the temple.'' Hebrew: ''the house.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'for renown and beauty' / 'for a name and for glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말하였습니다. 「내 아들 솔로몬은 어리고 미숙합니다.[a] 야훼를 위하여 지을 이 집[b]은 온 땅에 명성과 영광을 드러내도록 지극히 크게 지어져야 합니다.[c] 그러므로 이제 내가 이를 위하여 준비하겠습니다.」 그래서 다윗은 죽기 전에 풍성히 준비하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어리고 미숙합니다’는 히브리어의 ‘젊고 연약한/부드러운’ 뉘앙스를 문맥에 따라 풀이한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 히브리어의 직역이며, 문맥상 야훼의 성소를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘명성과 영광’은 직역하면 ‘이름과 영화’이며, ‘명예와 장엄함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר וָרָךְ
  english_pob_choice: young and inexperienced
  chosen_korean: 어리고 미숙합니다
  alternatives_korean:
