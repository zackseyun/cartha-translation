id: 1CH.22.3
reference: 1 Chronicles 22:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַרְזֶ֣ל לָ֠/רֹב לַֽ/מִּסְמְרִ֞ים לְ/דַלְת֧וֹת הַ/שְּׁעָרִ֛ים וְ/לַֽ/מְחַבְּר֖וֹת הֵכִ֣ין דָּוִ֑יד וּ/נְחֹ֥שֶׁת לָ/רֹ֖ב אֵ֥ין מִשְׁקָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
  footnotes:
  - marker: a
    text: Or 'hinges' for 'fastenings'; the Hebrew term is broader and refers generally to connecting or joining pieces.
    reason: lexical_alternative
  - marker: b
    text: Or 'too much to weigh' for 'beyond weighing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 문의 문짝들과 연결물에 쓸 못들을 위해 철을 매우 많이 준비했고, 놋도 무게를 달 수 없을 만큼 많이 준비했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경첩’으로 번역할 수 있습니다. 히브리어는 더 넓게 ‘잇는 부속물’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무게를 달 수 없을 만큼’, 곧 너무 많아 달아 볼 수 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזֶל
  english_pob_choice: iron
  chosen_korean: 철
  alternatives_korean:
  - 강철
  - 금속
  lexicon: HALOT
  rationale: 건축 자재 목록에서 בַרְזֶל은 문자 그대로 철을 가리키므로, 자연스럽고 직접적인 ‘철’로 옮겼습니다.
- source_word: לָרֹב
  english_pob_choice: in abundance
  chosen_korean: 매우 많이
  alternatives_korean:
  - 풍성하게
  - 풍부하게
  - 많이
  lexicon: HALOT
  rationale: 수량이 많음을 나타내는 표현이므로, 합쇼체 문맥에서 자연스럽게 읽히는 ‘매우 많이’로 풀었습니다.
- source_word: מִּסְמְרִים / דַלְתוֹת הַשְּׁעָרִים / מְחַבְּרוֹת
  english_pob_choice: nails ... the doors of the gates ... fastenings
  chosen_korean: 못들 ... 문의 문짝들 ... 연결물
  alternatives_korean:
  - 못 ... 성문 문짝들 ... 경첩
  - 못 ... 문들의 문짝들 ... 고정 장치
  lexicon: HALOT
  rationale: 문맥상 건축용 철물의 나열이므로 ‘못’은 직역하고, דַלְתוֹת은 문짝/문판의 뜻을 살려 ‘문의 문짝들’로, מְחַבְּרוֹת은 특정 부품을 단정하지 않고 연결 기능을 살려 ‘연결물’로 옮겼습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성경 한국어 전통과 재료 문맥을 함께 고려하면, 건축·성전 재료로는 ‘놋’이 가장 자연스럽고 널리 통용됩니다.
- source_word: אֵין מִשְׁקָל
  english_pob_choice: without weight
  chosen_korean: 무게를 달 수 없을 만큼 많이
  alternatives_korean:
  - 무게가 없을 만큼
  - 저울로 달 수 없을 만큼
  - 헤아릴 수 없을 만큼
  lexicon: HALOT
  rationale: 직역하면 ‘무게가 없다’이지만, 관용적으로는 너무 많아 달 수 없다는 뜻이므로 의미를 드러내는 방식으로 옮겼습니다.
theological_decisions:
- issue: 문리적 사물 목록의 번역에서 고정된 교회 용어를 쓸지 여부
  chosen_reading: 성전 건축 준비를 위한 철물과 금속 자재의 실제적 목록으로 읽어, 과도한 상징화를 피하고 물질적 의미를 유지했습니다.
  alternative_readings:
  - 상징적 헌신의 표현으로 넓게 해석
  - 영적 준비의 은유로 완화
  rationale: 본문은 다윗이 성전 건축을 위해 자재를 준비한 역사 서술이므로, 물질 명칭과 수량 과장을 그대로 살리는 것이 가장 충실합니다.
  doctrine_reference: 역사서 본문 해석 원칙; 본문 장르 우선
- issue: ‘연결물’의 구체성
  chosen_reading: מְחַבְּרוֹת을 특정 부품으로 단정하지 않고, ‘연결물’처럼 넓은 기능어로 처리했습니다.
  alternative_readings:
  - 경첩
  - 이음쇠
  - 고정 장치
  rationale: 히브리어가 일반적으로 ‘잇는/연결하는 것’을 뜻하므로, 기능은 보존하되 해석적 단정을 줄이는 것이 원문의 긴장을 더 잘 살립니다.
  doctrine_reference: 어휘 의미 범위 보존 원칙
