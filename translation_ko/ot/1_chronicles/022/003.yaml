  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
  footnotes:
  - marker: a
    text: Or 'hinges' for 'fastenings'; the Hebrew term is broader and refers generally to connecting or joining pieces.
    reason: lexical_alternative
  - marker: b
    text: Or 'too much to weigh' for 'beyond weighing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 성문 문짝들과 연결물[a]에 쓸 못을 위해 철을 매우 많이 준비했고, 놋도 너무 많아 무게를 달 수 없을 만큼 준비했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경첩’. 히브리어는 더 넓게, 서로 잇거나 연결하는 부속물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘무게가 없었다’입니다. 너무 많아 무게를 달 수 없었다는 뜻입니다.
    reason: lexical_alternative
