theological_decisions:
- issue: 문장의 마지막이 축복/기원인지 단순 미래 진술인지
  chosen_reading: ‘야훼께서 당신과 함께 계시기를 바랍니다’로 기원형을 택했습니다.
  alternative_readings:
  - ‘야훼께서 당신과 함께 계십니다’
  - ‘야훼께서 당신과 함께 계실 것입니다’
  rationale: 히브리어 וִיהִי의 용법은 여기서 단순 서술보다 소망·축복의 뉘앙스가 강하므로, 한국어에서도 기원형으로 옮기는 편이 원문 기능을 더 잘 드러냅니다.
  doctrine_reference: WLC 문장 양태(ווי־히 jussive)
