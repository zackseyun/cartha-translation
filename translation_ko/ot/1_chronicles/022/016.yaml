  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
  footnotes:
  - marker: a
    text: Or, 'there is no counting' / 'they are beyond counting.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'bronze'; 'copper' is also possible for the metal term in some contexts.
    reason: lexical_alternative
  - marker: c
    text: Or, 'and the LORD will be with you' or 'and let the LORD be with you.' The Hebrew form can express a wish or blessing.
    reason: alternative_reading
translation:
  language: ko
  text: 금과 은과 청동과 철은 헤아릴 수가 없습니다. 일어나서 일하십시오. 그리고 야훼께서 당신과 함께 계시기를 바랍니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤아릴 수가 없다’, ‘셀 수 없이 많다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נחושת는 문맥에 따라 ‘구리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼께서 당신과 함께 계실 것입니다’, ‘야훼께서 당신과 함께 계십니다’. 히브리어 형식은 소망이나 축복을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
