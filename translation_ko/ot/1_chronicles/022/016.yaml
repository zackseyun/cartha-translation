  lexicon: HALOT
  rationale: 히브리어 관용구가 나타내는 '셀 수 없음'을 한국어 관용으로 자연스럽게 살리되, 과도한 의역은 피했습니다.
- source_word: קוּם וַעֲשֵׂה
  english_pob_choice: Rise up and work
  chosen_korean: 일어나서 일하십시오
