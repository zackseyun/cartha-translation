base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
  footnotes:
  - marker: a
    text: Or 'a temple for the LORD.' The Hebrew literally says 'a house for the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 자기 아들 솔로몬을 불러, 이스라엘의 하나님이신 야훼를 위하여 집을 짓도록 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 위한 성전’이라고 할 수 있습니다. 히브리어는 문자적으로 ‘야훼를 위한 집’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה
  english_pob_choice: Then he called for Solomon
  chosen_korean: 그는 자기 아들 솔로몬을 불러
  alternatives_korean:
  - 그리고 솔로몬을 불렀습니다
  - 그는 솔로몬을 소환했습니다
  lexicon: HALOT
  rationale: קרא 뒤에 ל와 인명이 오므로 단순한 ‘부르다/불러오다’의 뜻이 자연스럽고, ‘불러’가 서술 흐름도 잘 살립니다.
- source_word: בְנוֹ
  english_pob_choice: his son
  chosen_korean: 자기 아들
  alternatives_korean:
  - 그의 아들
  - 자신의 아들
  lexicon: HALOT
  rationale: 소유 대명사의 관계를 분명히 하면서 한국어 문맥에서는 ‘자기 아들’이 가장 자연스럽습니다.
- source_word: וַיְצַוֵּהוּ
  english_pob_choice: and commanded him
  chosen_korean: 그에게 명령했습니다
  alternatives_korean:
  - 그에게 지시했습니다
  - 그에게 당부했습니다
  lexicon: HALOT
  rationale: צוה는 권위 있는 명령을 뜻하므로, 완곡한 표현보다 ‘명령했습니다’가 원문의 강도를 잘 드러냅니다.
- source_word: לִבְנוֹת בַּיִת
  english_pob_choice: to build a house
  chosen_korean: 한 집을 짓도록
  alternatives_korean:
  - 집을 짓게
  - 성전을 짓도록
  lexicon: HALOT
  rationale: בַּיִת의 기본 의미는 ‘집’이지만 이 문맥에서는 성전이므로, 본문 형식을 살리면서도 이해 가능하도록 ‘한 집’으로 옮겼습니다. ‘짓도록’은 명령의 목적을 자연스럽게 나타냅니다.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: for Yahweh, the God of Israel
  chosen_korean: 야훼, 곧 이스라엘의 하나님을 위하여
  alternatives_korean:
  - 야훼, 이스라엘의 하나님께
  - 이스라엘의 하나님 야훼를 위하여
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기준에 따라 ‘야훼’로 옮기고, ‘אֱלֹהֵי יִשְׂרָאֵל’은 동격 설명으로 풀어 ‘곧 이스라엘의 하나님’이라 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와의 언약 이름을 직접 사용하므로, 프로젝트 기본값에 따라 한국어 본문에도 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
