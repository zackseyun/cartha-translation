  rationale: 서수형사로서 앞선 배당 목록의 순서를 가리키므로, 현대 한국어의 자연스러운 목록체인 '셋째는'을 사용했습니다.
- source_word: לִשְׂעֹרִים
  english_pob_choice: to Seorim
  chosen_korean: 스오림에게
