lexical_decisions:
- source_word: לְחָרִם
  english_pob_choice: to Harim
  chosen_korean: 하림에게
  alternatives_korean:
  - 하림을 위해
  - 하림을 위하여
  lexicon: HALOT
  rationale: הִ prefixed לְ marks assignment in this lot list, so 한국어는 소유나 목적보다 배당의 방향을 살려 '-에게'로 옮겼습니다.
- source_word: הַשְּׁלִישִׁי
  english_pob_choice: the third
  chosen_korean: 셋째는
  alternatives_korean:
  - 세 번째는
  - 제3은
  lexicon: HALOT
  rationale: 서수형사로서 앞선 배당 목록의 순서를 가리키므로, 현대 한국어의 자연스러운 목록체인 '셋째는'을 사용했습니다.
- source_word: לִשְׂעֹרִים
  english_pob_choice: to Seorim
  chosen_korean: 스오림에게
  alternatives_korean:
  - 세오림에게
  - 스어림에게
  lexicon: HALOT
  rationale: 히브리어 고유명사를 현대 외래어 표기법에 따라 음역하되, 기존 성경 관용형이 없는 이름이므로 음가를 최대한 보존해 옮겼습니다.
- source_word: הָרְבִעִי
  english_pob_choice: the fourth
  chosen_korean: 넷째는
  alternatives_korean:
  - 네 번째는
  - 제4는
  lexicon: HALOT
  rationale: 앞 항목과 평행을 이루는 서수 표현이므로, 한국어에서도 목록의 간결함을 유지하는 '넷째는'으로 처리했습니다.
