  lexicon: HALOT
  rationale: 히브리어 고유명사를 현대 외래어 표기법에 따라 음역하되, 기존 성경 관용형이 없는 이름이므로 음가를 최대한 보존해 옮겼습니다.
- source_word: הָרְבִעִי
