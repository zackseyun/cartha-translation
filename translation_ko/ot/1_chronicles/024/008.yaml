  alternatives_korean:
  - 하림을 위해
  - 하림을 위하여
  lexicon: HALOT
  rationale: הִ prefixed לְ marks assignment in this lot list, so 한국어는 소유나 목적보다 배당의 방향을 살려 '-에게'로 옮겼습니다.
- source_word: הַשְּׁלִישִׁי
  english_pob_choice: the third
  chosen_korean: 셋째는
