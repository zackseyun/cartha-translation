  rationale: 열거 구조를 유지하기 위해 각각의 서수만 대응시켰고, 앞 항목들과의 병렬성을 위해 종결을 달리하지 않았습니다.
- source_word: יְרִיָּהוּ / אֲמַרְיָהוּ / יַחֲזִיאֵל / יְקַמְעָם
  english_pob_choice: Jeriah / Amariah / Jahaziel / Jekameam
