  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
  footnotes:
  - marker: a
    text: 'Hebrew list syntax is elliptical: literally, ''And the sons of Jeriah: Amariah the second, Jahaziel the third, Jekameam the fourth.'' English may also render the ordinals with an implied verb: ''Amariah was the second,'' etc.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여리야의 아들들은 둘째 아마랴, 셋째 야하시엘, 넷째 여가므암입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 ‘여리야의 아들들: 아마랴 둘째, 야하시엘 셋째, 여가므암 넷째’처럼 동사가 생략된 목록식 구문입니다. 서수의 정확한 관계는 문맥에 따라 이해됩니다.'
    reason: lexical_alternative
lexical_decisions:
