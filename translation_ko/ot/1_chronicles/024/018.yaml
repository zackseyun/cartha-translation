translation:
  language: ko
  text: 들라야에게는 스물세 번째가, 마아시야에게는 스물네 번째가 돌아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/דְלָיָ֨הוּ֙
  english_pob_choice: for Delaiah
  chosen_korean: 드라야에게는
  alternatives_korean:
  - 드라야에게
  - 드라야를 위한
  lexicon: HALOT
  rationale: 앞의 ל는 이 문맥에서 배정·할당을 나타내므로, 한국어에서는 “-에게는”으로 자연스럽게 처리해 분배 목록의 성격을 살렸습니다.
- source_word: שְׁלֹשָׁ֣ה וְ/עֶשְׂרִ֔ים
  english_pob_choice: the twenty-third
  chosen_korean: 스물세 번째
  alternatives_korean:
  - 스물셋
  - 제23
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘셋과 스물’이지만, 목록의 순번을 나타내는 문맥이므로 서수형 “스물세 번째”가 가장 정확합니다.
- source_word: לְ/מַֽעַזְיָ֖הוּ
  english_pob_choice: for Maaziah
  chosen_korean: 마아시야에게는
  alternatives_korean:
  - 마아시야에게
  - 마아시야를 위한
  lexicon: HALOT
  rationale: 앞의 ל를 앞 항목과 동일하게 할당 표시로 보고, 이름은 음역하여 목록형 문장의 평행성을 유지했습니다.
- source_word: אַרְבָּעָ֥ה וְ/עֶשְׂרִֽים׃
  english_pob_choice: the twenty-fourth
  chosen_korean: 스물네 번째
  alternatives_korean:
  - 스물넷
  - 제24
  lexicon: HALOT
  rationale: 문맥상 기수보다 서수의 기능을 하므로 “스물네 번째”로 옮겨 인접 절과의 번호 매김을 분명히 했습니다.
