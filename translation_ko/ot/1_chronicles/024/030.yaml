translation:
  language: ko
  text: 그리고 모시의 아들들은 마흘리와 에델과 여리못입니다. 이들은 조상들의 가문에 따른 레위 자손들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 ירימות는 ‘예리못’으로도 음역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 ...의 아들들은
  alternatives_korean:
  - 그다음 모시의 아들들은
  - 모시의 아들들은
  lexicon: HALOT
  rationale: 계보 목록을 여는 연결어와 소속 관계를 자연스럽게 살리기 위해 ‘그리고 ...의 아들들은’으로 옮겼습니다.
- source_word: וּ/בְנֵי מוּשִׁי
  english_pob_choice: And the sons of Mushi
  chosen_korean: 모시의 아들들
  alternatives_korean:
  - 무시의 아들들
  lexicon: HALOT
  rationale: 고유명사는 통용되는 음역 관습을 따르되, 본문 계보 맥락에서 ‘아들들’을 유지했습니다.
- source_word: וִ/ירִימֹת
  english_pob_choice: Jeremoth
  chosen_korean: 여리못
  alternatives_korean:
  - 예레못
  - 예리못
  lexicon: HALOT
  rationale: 히브리어 이름을 한국어 음역으로 옮겼고, 영어 주석의 대안 철자(Jerimoth)는 본문보다 약한 표기 차이이므로 본문에는 반영하지 않았습니다.
- source_word: לְ/בֵית אֲבֹתֵי/הֶם
  english_pob_choice: according to their fathers' houses
  chosen_korean: 조상들의 가문에 따른
  alternatives_korean:
  - 그들의 조상 집안에 따른
  - 아버지들의 집안에 따라
  lexicon: HALOT
  rationale: 문자적으로는 ‘아버지들의 집’이지만, 한국어에서는 계보·행정적 단위인 ‘가문’이 관용적이어서 의미를 더 분명하게 드러냈습니다.
theological_decisions:
- issue: 레위 지파 계보 표현의 범위
  chosen_reading: ‘레위 사람들’로 옮겨, 단순 혈통 표지가 아니라 레위 지파 전체의 계보적 분류임을 드러냈습니다.
  alternative_readings:
  - ‘레위인들’
  - ‘레위 지파 사람들’
  rationale: 본문의 בְּנֵי הַלְוִיִּם은 개별 직분보다 집단적 혈통 분류를 가리키므로, 계보 문맥을 살려 번역했습니다.
  doctrine_reference: 민수기 3–4장, 역대상 23–24장 계보/직무 문맥
