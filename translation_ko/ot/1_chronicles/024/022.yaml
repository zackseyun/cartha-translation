    text: Or 'to the Izharite.' The Hebrew preposition can be rendered either way in this administrative list; 'for' reflects the assignment sense in context.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of'' may also function more broadly as ''descendants of'' in genealogical lists.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이사갈 사람에게는 셀로못이, 셀로못의 아들들에게는 야핫이 할당되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이사갈 사람에게는’으로 옮긴 ל는 이 명단 문맥에서 배정의 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아들들’은 족보 목록에서는 더 넓게 ‘후손들’의 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
