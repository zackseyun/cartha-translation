translation:
  language: ko
  text: 빌가에게는 열다섯째가, 임멜에게는 열여섯째가 돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘열다섯’과 ‘열여섯’이지만, 제비 순번 문맥에서는 서수인 ‘열다섯째’와 ‘열여섯째’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  english_pob_choice: for Bilgah
  chosen_korean: 빌가에게는
  alternatives_korean:
  - 빌가에게
  - 빌가 몫으로
  lexicon: HALOT
  rationale: לְ가 이 목록에서는 배정·귀속을 나타내므로, 한국어에서는 분배의 결과를 드러내는 조사와 함께 자연스럽게 옮겼습니다.
- source_word: חֲמִשָּׁה עָשָׂר
  english_pob_choice: the fifteenth
  chosen_korean: 열다섯째
  alternatives_korean:
  - 열다섯
  - 제15
  lexicon: HALOT
  rationale: 문맥이 제비뽑기로 정해진 순번이므로, 단순한 수사보다 서수형인 열다섯째가 원문 기능을 더 정확히 반영합니다.
- source_word: לְ/אִמֵּר
  english_pob_choice: for Immer
  chosen_korean: 임멜에게는
  alternatives_korean:
  - 임멜에게
  - 임멜 몫으로
  lexicon: HALOT
  rationale: ביל가와 같은 분배 공식으로, לְ의 귀속 의미를 살려 같은 방식으로 처리했습니다.
- source_word: שִׁשָּׁה עָשָׂר
  english_pob_choice: the sixteenth
  chosen_korean: 열여섯째
  alternatives_korean:
  - 열여섯
  - 제16
  lexicon: HALOT
  rationale: 앞의 항목과 동일하게 열거된 제비 순번이므로, 서수형으로 옮겨 연속성을 보존했습니다.
theological_decisions:
- issue: 제사장 반열 배정 목록의 표현 방식
  chosen_reading: 제비로 배정된 순서를 한국어에서도 서수형과 귀속 표현으로 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 열다섯, 열여섯으로 처리
  - 빌가, 임멜의 몫이라고 완곡하게 표현
  rationale: 이 절은 신학적 해석보다 행정적·제의적 배정 기록이 핵심이므로, 원문의 분배 구조가 흐려지지 않도록 직결된 표현을 유지했습니다.
  doctrine_reference: 민수기 26장과 1역대기 24장의 제사장 직무 배정 문맥
