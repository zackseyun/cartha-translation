  text: for Bilgah[a], the fifteenth; for Immer, the sixteenth.
  footnotes:
  - marker: a
    text: 'Literally, ''fifteen'' and ''sixteen''; in this context of numbered lots, the sense is ordinal: ''the fifteenth'' and ''the sixteenth.'''
