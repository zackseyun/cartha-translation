  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
  footnotes:
  - marker: a
    text: Or 'one group with another'; the Hebrew literally says 'these with those.'
    reason: lexical_alternative
  - marker: b
    text: Or 'princes/leaders of the sanctuary and princes/leaders of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이 사람들과 저 사람들을 제비로 나누었습니다[a]. 이는 성소의 감독들과 하나님의 감독들이 엘르아살의 자손들과 이다말의 자손들 가운데 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 무리를 다른 무리와’. 히브리어는 문자적으로 ‘이것들과 저것들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  english_pob_choice: they divided them
  chosen_korean: 그들은 … 나누었습니다
  alternatives_korean:
  - 그들은 … 분배했습니다
  - 그들은 … 구분했습니다
  lexicon: HALOT
  rationale: חלק의 분할 의미를 직접 살리되, 제비를 통한 배분 상황에 맞게 자연스러운 서술형으로 옮겼습니다.
- source_word: בְּגוֹרָל֖וֹת
  english_pob_choice: by lots
  chosen_korean: 제비로
  alternatives_korean:
  - 제비를 통해
  - 제비 뽑기로
  lexicon: HALOT
  rationale: גורלות는 배정을 위한 제비뽑기를 가리키므로, 한국어에서는 관용적이고 간결한 ‘제비로’가 원문의 수단성을 잘 드러냅니다.
- source_word: אֵלֶּה עִם אֵלֶּה
  english_pob_choice: these with those
  chosen_korean: 이 사람들과 저 사람들
  alternatives_korean:
  - 이쪽과 저쪽
  - 이 무리와 저 무리
  lexicon: HALOT
  rationale: 히브리어의 짧은 대구를 한국어에서도 대응시키기 위해, 단순한 지시 대명사 반복의 느낌을 살려 옮겼습니다.
- source_word: שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  english_pob_choice: officers of the sanctuary and officers of God
  chosen_korean: 성소의 감독들과 하나님의 감독들
  alternatives_korean:
  - 성소의 지도자들과 하나님의 지도자들
  - 성소의 장관들과 하나님의 장관들
  lexicon: HALOT
  rationale: שָׂרִים는 일반적 ‘지도자’보다 직무를 드러내는 ‘감독’이 이 문맥에 더 적절하며, קֹדֶשׁ은 추상적 ‘거룩’보다 성소 기관을 가리키는 것으로 이해해 옮겼습니다.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  english_pob_choice: from the sons of Eleazar and from the sons of Ithamar
  chosen_korean: 엘르아살의 자손들과 이다말의 자손들 가운데
  alternatives_korean:
  - 엘르아살의 아들들과 이다말의 아들들 가운데
  - 엘르아살 자손들과 이다말 자손들 가운데
  lexicon: HALOT
  rationale: בְּנֵי는 족보 표현으로 ‘자손들’이 가장 자연스럽고, 전치사의 분포를 한국어의 ‘가운데’로 풀어 원문의 소속 범위를 분명히 했습니다.
theological_decisions:
- issue: 제비뽑기의 기능과 신적 질서
  chosen_reading: 제비는 임의성보다, 성소 봉사의 적격한 두 계열을 공정하게 배정하는 수단으로 옮겼습니다.
  alternative_readings:
  - 단순히 무작위 배분
  - 행정적 편의에 따른 구분
  rationale: 문맥상 제비뽑기는 사람의 판단을 대체하는 공정한 분배 장치이며, 뒤의 이유절이 그 배경을 설명합니다.
  doctrine_reference: 섭리와 공정한 분배에 대한 성경적 이해
