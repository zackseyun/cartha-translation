  text: 그들은 이들과 저들을 함께 제비로 나누었습니다[a]. 엘르아살 자손과 이다말 자손 가운데 성소의 지도자들과 하나님의 지도자들이 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
