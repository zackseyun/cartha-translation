  rationale: 수정문은 제비뽑기의 주체와 공개적 증인들을 그대로 보존하면서, 난해한 마지막 히브리어 구절을 가문 간의 대등한 취급이라는 최소한의 문맥적 의미로 옮겼습니다. ‘어린’이라는 연령 중심의 표현과 원문에 없는 ‘모두가 그러했다’는 독립 서술은 제거했습니다. 각주들은 לְעֻמַּת의 어휘적 여지와 마지막 구절의 단수·분배적 해석을 보존합니다.
