revisions:
- from: 이들도 아론의 아들인 자기 형제들과 나란히 제비를 뽑았는데, 다윗 왕과 사독과 아히멜렉과 제사장들과 레위 사람들의 족장들 앞에서, 곧 우두머리 아버지 가문들과 그들의 어린 형제들 모두가 그러했습니다.[a][b]
