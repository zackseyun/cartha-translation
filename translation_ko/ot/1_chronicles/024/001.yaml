base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'Now these were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
  footnotes:
  - marker: a
    text: Or 'courses' for 'divisions'; the Hebrew refers to arranged priestly groupings.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 아론의 아들들의 계열입니다. 아론의 아들들은 나답, 아비후, 엘르아살, 그리고 이다말이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 히브리어는 전통적 의미의 제사장 ‘반열/조’처럼 편성된 집단을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי ... מַחְלְקוֹתָם
  english_pob_choice: Now these were the divisions of the sons of Aaron
  chosen_korean: 이것은 아론의 아들들의 계열입니다
  alternatives_korean:
  - 이것은 아론의 아들들의 분열입니다
  - 이것은 아론의 아들들의 반열입니다
  - 이것은 아론의 아들들의 분배입니다
  lexicon: HALOT
  rationale: מַחְלְקוֹתָם은 정리된 제사장 집단의 ‘분류/편제’를 가리키므로, 한국어에서는 문맥에 맞게 ‘계열’로 자연스럽게 옮겨 POB의 ‘divisions’가 뜻하는 편성된 단위성을 살렸습니다.
- source_word: בְּנֵי אַהֲרֹן
  english_pob_choice: the sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론의 자손들
  - 아론의 아들
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 그대로 반영하되, 계보 표지로서 가장 직역적인 ‘아론의 아들들’을 유지했습니다.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  english_pob_choice: Nadab and Abihu, Eleazar and Ithamar
  chosen_korean: 나답, 아비후, 엘르아살, 그리고 이다말
  alternatives_korean:
  - 나답과 아비후, 엘르아살과 이다말
  - 나다브와 아비후, 엘르아살과 이다말
  lexicon: 고유명사 표기
  rationale: 사람 이름은 현대 외래어 표기법과 한국어 성경에서 통용되는 형태를 따라 옮겼으며, 마지막 연결어 ‘그리고’를 써서 목록의 종결을 자연스럽게 했습니다.
theological_decisions:
- issue: 제사장 계열의 서술을 ‘divisions’로 볼지 ‘courses’로 볼지
  chosen_reading: 한국어 본문은 ‘계열’로 두어 편제된 제사장 단위라는 의미를 드러냈습니다.
  alternative_readings:
  - ‘반열’로 번역하여 전통적 교회 용어를 따르는 읽기
  - ‘분과’로 더 일반화하는 읽기
  rationale: 본문 자체는 아론의 아들들을 제사장 직무를 위한 정렬된 단위로 소개하므로, 전통 용어를 무조건 따르기보다 문맥상 조직화된 그룹이라는 뜻을 드러내는 표현을 택했습니다.
  doctrine_reference: 민수기 3–4장 및 역대기 제사장 편제 문맥
