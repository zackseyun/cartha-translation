review_pass:
  verdict: revise
  source_fidelity: 본문의 계보 명부 구조와 ‘남은 레위 자손’이라는 뜻은 대체로 잘 반영했습니다. 다만 יֶחְדְּיָהוּ는 통상 한국어 성경 표기와 음역상 ‘여히드야’가 적절하며, ‘여드야후’는 히브리어 자음 배열과 어말 -yahu 형태를 충분히 반영하지 못합니다. 또한 영어 감사 기록의 각주 b는 원문의 첫 구절에 대한 대안 번역인데, 현 초안처럼 문장 끝에 두 각주를 함께 붙이면 해당 범위가 불분명합니다.
  naturalness: ‘레위의 남은 자손은 이러합니다’와 반복되는 ‘~의 자손은’은 현대 한국어의 족보·명부 문맥에서 자연스럽고, 정중한 문체에도 적합합니다.
  terminology: ‘레위’, ‘암람’, ‘수바엘’은 무난합니다. יֶחְדְּיָהוּ는 ‘여히드야’로 바로잡는 것이 한국어 성경의 관례 및 히브리어 이름의 형태에 더 잘 맞습니다.
  issues:
  - severity: medium
    issue: 인명 ‘여드야후’의 음역
    rationale: 히브리어 יֶחְדְּיָהוּ는 여히드야(Yeḥdəyāhû)에 해당합니다. ‘여드야후’는 ח와 י의 요소를 누락하거나 재배열한 형태여서 원문 충실성과 통용 성경 명명 관례 면에서 수정이 필요합니다.
  - severity: low
    issue: 각주 b의 부착 위치가 불명확함
    rationale: 각주 b는 ‘레위의 남은 자손’에 대한 대안 번역이므로 해당 어구 직후에 붙여야 합니다. 문장 끝의 [a][b]는 두 각주가 모두 마지막 인명 또는 전체 문장에 걸리는 것처럼 보이게 합니다.
  revised_text: 레위의 남은 자손은[a] 이러합니다. 암람의 자손은 수바엘이며, 수바엘의 자손은 여히드야입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘레위의 나머지 자손’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이 명부에서 생략적으로 표현합니다. 개인 이름은 각 씨족 갈래의 우두머리나 대표자를 가리킬 가능성이 큽니다.
    reason: cultural_note
  revision_rationale: 인명 יֶחְדְּיָהוּ를 원문 형태와 한국어 성경의 통용 표기에 맞추어 ‘여히드야’로 수정했습니다. 대안 번역 각주는 해당 어구 뒤에 직접 연결하고, 명부의 생략 구조에 관한 주석은 본문에 표시할 필수 앵커가 없으므로 별도 주석으로 보존했습니다. 본문의 간결한 명부 형식과 원문의 의미는 유지했습니다.
