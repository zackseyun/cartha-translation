  - 암람에게 속한 자손은
  lexicon: HALOT
  rationale: 반복되는 명부 공식은 한국어에서 주어-서술 구조보다 ‘~의 자손은’이 더 자연스럽고 원문의 족보적 분류를 잘 드러냅니다.
- source_word: שׁוּבָאֵל
  english_pob_choice: Shubael
  chosen_korean: 수바엘
  alternatives_korean:
  - 슈바엘
  - 쉬바엘
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역하되, 히브리어 שׁוּבָאֵל의 자음·모음 흐름을 반영해 ‘수바엘’로 옮겼습니다.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  english_pob_choice: for the sons of Shubael
  chosen_korean: 수바엘의 자손은
  alternatives_korean:
  - 수바엘의 아들들은
  - 수바엘에게 속한 자손은
  lexicon: HALOT
  rationale: 앞 항과 같은 족보 공식이 반복되므로, 한국어에서도 동일하게 ‘~의 자손은’으로 맞춰 목록의 리듬을 유지했습니다.
- source_word: יֶחְדְּיָהוּ
  english_pob_choice: Jehdeiah
  chosen_korean: 여드야후
  alternatives_korean:
  - 예드야후
  - 여드야
  - 제드야후
  lexicon: HALOT
  rationale: 끝의 -יהו를 한국어 음역에서 ‘-야후’로 살려 히브리어 형태를 드러냈으며, 족보 기록의 고유명사임을 보존했습니다.
theological_decisions:
- issue: 족보 명부의 생략 구조를 한국어에서 어떻게 드러낼지
  chosen_reading: 이 구절은 인물 이름이 곧 가문 대표를 가리키는 생략적 명부이므로, 설명을 덧붙이지 않고 간결한 족보 문장으로 옮겼습니다.
  alternative_readings:
  - 각 이름 뒤에 ‘가문 대표’라는 설명을 본문에 풀어 쓰는 방식
  - 직역하여 어색한 열거형 문장으로 두는 방식
  rationale: 원문은 행정적·족보적 약식 표기이므로, 본문은 간결하게 유지하고 필요한 해설은 주석 대신 번역 결정으로만 반영하는 것이 가장 충실합니다.
  doctrine_reference: 역대기 족보 문맥의 서술 관습
