base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
  footnotes:
  - marker: a
    text: 'Hebrew is elliptical in this roster: the personal names likely stand for the family head or representative of each clan branch.'
    reason: cultural_note
  - marker: b
    text: Or 'the rest of the sons of Levi.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위의 남은 자손은 이러합니다. 암람의 자손은 수바엘이며, 수바엘의 자손은 여드야후입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 족보에서 생략적입니다. 개인 이름은 각 씨족 갈래의 우두머리나 대표자를 가리킬 가능성이 큽니다.
    reason: source_note
  - marker: b
    text: 또는 ‘레위의 나머지 자손’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַ/נּוֹתָרִים
  english_pob_choice: And for the remaining sons of Levi
  chosen_korean: 레위의 남은 자손은
  alternatives_korean:
  - 레위의 남은 아들들은
  - 레위의 나머지 자손은
  lexicon: HALOT
  rationale: 계보·명부 문맥에서 הַנּוֹתָרִים는 단순히 ‘남은’ 사람들을 가리키므로, 한국어에서는 문맥상 자연스러운 ‘남은 자손’으로 옮겼습니다.
- source_word: לִ/בְנֵי עַמְרָם
  english_pob_choice: for the sons of Amram
  chosen_korean: 암람의 자손은
  alternatives_korean:
