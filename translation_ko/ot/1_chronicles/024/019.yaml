revisions:
- from: 이들은 그들의 직무와 섬김을 위한 임명된 분담이었습니다. 곧 야훼의 집에 들어가서, 아론 그들의 조상 아래서, 이스라엘의 하나님 야훼께서 그에게 명하신 대로 그들의 규례를 따르는 일이었습니다.[a][b]
  to: 이것이 그들이 야훼의 집에 들어가 섬기도록 정해진 직무 분담이며, 그들의 조상 아론의 감독 아래, 이스라엘의 하나님 야훼께서 그에게 명하신 그들의 규례[a]에 따른 것입니다.[b]
  rationale: The revision renders the opening as an explanatory nominal clause, preserves the purpose of entering Yahweh's house for service, renders Aaron as both their ancestor and the administrator under whose oversight the order operated, and keeps the divine title and the antecedent of ‘him’ (Aaron). The two notes are retained with corrected anchors and Korean wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:15:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft weakens the syntax and sense of the Hebrew. פְּקֻדָּתָם is an ordered assignment/division, not an awkward 'appointed share,' and בְּיַד אַהֲרֹן denotes Aaron's administrative oversight, not merely being 'below Aaron, their ancestor.' The revision retains the relation of the prescribed order to entrance for temple service and the singular pronoun referring to Aaron.
  naturalness: The draft is not natural Korean in such phrases as '직무와 섬김을 위한 임명된 분담,' '아론 그들의 조상 아래서,' and '규례를 따르는 일이었습니다.' The revised wording is modern formal Korean while retaining the compact formal style of the source.
  terminology: '''직무 분담,'' ''섬기도록,'' ''규례,'' and ''감독 아래'' accurately convey the cultic-administrative terminology without importing denominational interpretation. ''야훼'' consistently renders יהוה. Footnote markers are repositioned to the words they explain.'
  issues:
  - severity: high
    issue: The phrase '아론 그들의 조상 아래서' mistranslates and is ungrammatical.
    rationale: בְּיַד אַהֲרֹן means under Aaron's hand in the sense of agency, administration, or oversight. אֲבִיהֶם ('their father/ancestor') modifies Aaron and must not be absorbed into the idiom as 'their ancestor below.'
  - severity: high
    issue: The Korean sentence misconstrues the nominal construction and produces an unnatural predicate.
    rationale: '''그들의 직무와 섬김을 위한 임명된 분담이었습니다'' conflates the appointed divisions with service and does not naturally express the purpose clause לַעֲבֹדָתָם לָבוֹא.'
  - severity: medium
    issue: Footnote anchors occur only at the end of the sentence and do not identify their referents.
    rationale: The lexical-alternative note belongs with '규례,' and the idiom note belongs with the phrase rendering בְּיַד אַהֲרֹן.
  revised_text: 이것이 그들이 야훼의 집에 들어가 섬기도록 정해진 직무 분담이며, 그들의 조상 아론의 감독 아래, 이스라엘의 하나님 야훼께서 그에게 명하신 그들의 규례[a]에 따른 것입니다.[b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들에게 정해진 절차’로 옮길 수 있습니다. 히브리어는 규례, 규정, 또는 정해진 절차를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘아론의 손 아래’입니다. 히브리어 관용구로서 아론의 관리나 감독 아래 있음을 뜻합니다.
    reason: lexical_alternative
  revision_rationale: The revision renders the opening as an explanatory nominal clause, preserves the purpose of entering Yahweh's house for service, renders Aaron as both their ancestor and the administrator under whose oversight the order operated, and keeps the divine title and the antecedent of ‘him’ (Aaron). The two notes are retained with corrected anchors and Korean wording.
