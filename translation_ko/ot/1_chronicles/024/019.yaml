base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
  footnotes:
  - marker: a
    text: Or 'according to their prescribed order.' The Hebrew term can denote an ordinance, rule, or prescribed procedure.
    reason: lexical_alternative
  - marker: b
    text: Literally 'under/by the hand of Aaron,' an idiom for administration or authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 그들의 직무와 섬김을 위한 임명된 분담이었습니다. 곧 야훼의 집에 들어가서, 아론 그들의 조상 아래서, 이스라엘의 하나님 야훼께서 그에게 명하신 대로 그들의 규례를 따르는 일이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 정해진 절차에 따라'로 옮길 수 있습니다. 히브리어는 정해진 규범이나 절차를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '아론의 손 아래서'입니다. 히브리어 관용구로서 관리 또는 권위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  english_pob_choice: their appointed duties
  chosen_korean: 임명된 분담
  alternatives_korean:
  - 지정된 직무
  - 임명된 직무
  - 배정된 임무
  lexicon: HALOT
  rationale: פקיד 계열의 명사는 여기서 제의적 역할의 지정과 배치를 가리키므로, '임명된 분담'이 공식적 배정과 실제 책임을 함께 드러냅니다.
- source_word: לַעֲבֹדָתָם
  english_pob_choice: for their service
  chosen_korean: 그들의 섬김
  alternatives_korean:
  - 그들의 봉사
  - 그들의 봉직
  - 그들의 일
  lexicon: HALOT
  rationale: 제사장 문맥의 עֲבֹדָה는 단순 노동보다 성소 섬김을 뜻하므로, '섬김'이 제의적 의미를 비교적 자연스럽게 살립니다.
- source_word: כְּמִשְׁפָּטָם
  english_pob_choice: according to their ordinance
  chosen_korean: 그들의 규례를 따르는
  alternatives_korean:
  - 그들의 규정에 따른
  - 그들의 정한 절차에 따른
  - 그들의 명령에 따른
  lexicon: HALOT
  rationale: מִשְׁפָּט은 여기서 판결이 아니라 정해진 제도적 규범을 가리키므로, '규례'로 옮겨 제사 질서의 성격을 보존했습니다.
- source_word: בְּיַד אַהֲרֹן
  english_pob_choice: under the hand of Aaron
  chosen_korean: 아론 그들의 조상 아래서
  alternatives_korean:
  - 아론의 손 아래서
  - 아론의 권한 아래서
  - 아론의 관리 아래서
  lexicon: HALOT
  rationale: 직역하면 '아론의 손 아래'이지만, 한국어에서는 손의 관용구를 그대로 살리기보다 권위와 감독 아래 있음을 드러내는 표현이 필요해 '아론 그들의 조상 아래서'로 처리했습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 주, 이스라엘의 하나님
  - 여호와, 이스라엘의 하나님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 고유한 언약 이름 יְהוָה는 본문 원어의 직접성을 살려 '야훼'로 옮겼고, '이스라엘의 하나님'은 동격으로 유지했습니다.
theological_decisions:
- issue: 제의적 질서와 권위의 표현인 'under the hand of Aaron'
  chosen_reading: 아론 그들의 조상 아래서
  alternative_readings:
  - 아론의 손 아래서
  - 아론의 권한 아래서
  - 아론의 관리 아래서
  rationale: 이 표현은 단순한 신체 비유가 아니라 아론의 제사장적 감독과 계승 질서를 나타내므로, 한국어에서도 권위 아래 있다는 뜻이 분명히 들리도록 했습니다.
  doctrine_reference: 성전 봉사 질서와 제사장 계승 구조
