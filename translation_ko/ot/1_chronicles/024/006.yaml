  lexicon: HALOT
  rationale: 분배 결과를 문서로 남긴 행위를 자연스러운 현대 한국어로 옮기되, 단순한 '쓰기'보다 공식적 등록의 뜻을 살렸습니다.
- source_word: הַסֹּפֵר
