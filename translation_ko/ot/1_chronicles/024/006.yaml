theological_decisions:
- issue: בֵּית אָב אֶחָד / אָחֻז אָחֻז의 압축된 분배 표현
  chosen_reading: '''한 아버지 집''과 ''또 한 아버지 집''으로 옮겨, 엘르아살 계열과 이다말 계열에서 교대로 하나씩 취해진 분배의 뜻을 드러냈습니다.'
  alternative_readings:
  - '''한 조상의 집'''
  - '''한 가문이 엘르아살을 위해, 또 하나가 이다말을 위해 취해졌습니다'''
  rationale: 히브리어의 압축된 반복을 풀되, 번역문이 추첨·교번 선택의 행정적 의미를 유지하도록 했습니다.
  doctrine_reference: 본문의 제사장 계열 분배 방식에 대한 역사적 서술
