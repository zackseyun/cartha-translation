  rationale: סֹפֵר는 공식 문서 작성자라는 직분을 가리키므로, 역사적·행정적 역할을 드러내는 '서기관'이 가장 적합합니다.
- source_word: מִן הַלֵּוִי
  english_pob_choice: from among the Levites
  chosen_korean: 레위 사람 가운데서
  alternatives_korean:
  - 레위 사람 중에서
  - 레위 사람에게서
  lexicon: HALOT
  rationale: מן의 부분적 의미를 살려 스마야가 레위 집단에 속한 인물임을 분명히 했습니다.
- source_word: לִפְנֵי
