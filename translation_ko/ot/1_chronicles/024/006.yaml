  text: וַֽ/יִּכְתְּבֵ֡/ם שְֽׁמַֽעְיָה֩ בֶן נְתַנְאֵ֨ל הַ/סּוֹפֵ֜ר מִן הַ/לֵּוִ֗י לִ/פְנֵ֨י הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ וְ/צָד֣וֹק הַ/כֹּהֵ֗ן וַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֶבְיָתָ֔ר וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם בֵּֽית אָ֣ב אֶחָ֗ד אָחֻז֙ לְ/אֶלְעָזָ֔ר וְ/אָחֻ֥ז אָחֻ֖ז לְ/אִיתָמָֽר־־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
  footnotes:
  - marker: a
    text: 'Hebrew is compressed: ''one father’s house taken for Eleazar, and taken, taken for Ithamar.'' The sense is that family heads were selected in turn from the Eleazar and Ithamar lines.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람 가운데서 서기관인 스마야, 느다넬의 아들이 왕과 고관들과 제사장 사독과 아비아달의 아들 아히멜렉과 제사장들과 레위 사람들의 족장들 앞에서 그것을 기록하였는데, 엘르아살을 위한 한 아버지 집과 이다말을 위한 또 한 아버지 집이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축되어 있어 직역하면 '엘르아살을 위해 하나, 이다말을 위해 하나'처럼 들립니다. 문맥상 두 계열에서 번갈아 가며 가문을 배정했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  english_pob_choice: recorded them
  chosen_korean: 기록하였는데
  alternatives_korean:
