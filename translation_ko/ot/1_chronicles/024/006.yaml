- from: 레위 사람 가운데서 서기관인 스마야, 느다넬의 아들이 왕과 고관들과 제사장 사독과 아비아달의 아들 아히멜렉과 제사장들과 레위 사람들의 족장들 앞에서 그것을 기록하였는데, 엘르아살을 위한 한 아버지 집과 이다말을 위한 또 한 아버지 집이었습니다.[a]
  to: 레위 사람들 가운데서 서기관으로 일하던 느다넬의 아들 스마야가 왕과 고관들과 제사장 사독과 아비아달의 아들 아히멜렉과 제사장들과 레위 사람들의 가문 우두머리들 앞에서 그들을 기록했습니다. 엘르아살 계열에서는 한 가문을 뽑고, 이다말 계열에서도 한 가문을 뽑았습니다.[a]
