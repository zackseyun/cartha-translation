  source_fidelity: 앞부분은 스마야의 신분과 기록 행위, 그리고 입회자들을 대체로 충실히 옮겼습니다. 그러나 마지막 절의 אָחֻז(‘취해지다/선발되다’)를 ‘...집이었습니다’로 번역하여 가문들이 선발·배정되는 핵심 동작이 빠졌습니다.
  naturalness: ‘레위 사람 가운데서 서기관인 스마야, 느다넬의 아들이’는 수식 관계가 다소 어색합니다. ‘레위 사람들 가운데서 서기관으로 일하던 느다넬의 아들 스마야’가 현대 한국어 문장으로 더 자연스럽습니다. ‘족장들’은 원문의 가문 단위 행정 용어를 충분히 드러내지 못하므로 ‘가문의 우두머리들’로 명시하는 것이 좋습니다.
