source:
  edition: WLC
  text: וַ/יִּמָּצְא֣וּ בְֽנֵי אֶלְעָזָ֡ר רַבִּ֞ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִן בְּנֵ֥י אִיתָמָ֖ר וַֽ/יַּחְלְק֑וּ/ם לִ/בְנֵ֨י אֶלְעָזָ֜ר רָאשִׁ֤ים לְ/בֵית אָבוֹת֙ שִׁשָּׁ֣ה עָשָׂ֔ר וְ/לִ/בְנֵ֧י אִיתָמָ֛ר לְ/בֵ֥ית אֲבוֹתָ֖/ם שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
  footnotes:
  - marker: a
    text: Or 'as heads of the warriors' for 'as heads of the mighty men.' The Hebrew גְּבָרִים can denote strong or valiant men, not merely adult males.
    reason: lexical_alternative
  - marker: b
    text: '''Fathers’ houses'' refers to ancestral family clans or households, a standard kinship-administrative unit in Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 엘르아살의 아들들이 이다말의 아들들보다, 곧 용사들의 우두머리로서, 더 많다고[a] 밝혀졌습니다. 그래서 그들을 이렇게 나누었습니다. 엘르아살의 아들들에게는 아버지의 집의 우두머리가 열여섯이었고, 이다말의 아들들에게는 그들의 아버지의 집에 따라 여덟이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גְּבָרִים는 단순한 ‘남자들’뿐 아니라 ‘용사들’ 또는 유력한 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아버지의 집’은 이스라엘의 족속·가문을 가리키는 표준적인 친족-행정 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  english_pob_choice: were found to be
  chosen_korean: 밝혀졌습니다
  alternatives_korean:
  - 알려졌습니다
  - 드러났습니다
  - 판명되었습니다
  lexicon: HALOT
  rationale: 단순히 ‘발견되었다’보다, 두 집안의 수적 우세가 판정된 결과를 자연스럽게 나타냅니다.
- source_word: רַבִּים לְרָאשֵׁי הַגְּבָרִים
  english_pob_choice: more numerous, as heads of the mighty men
  chosen_korean: 곧 용사들의 우두머리로서, 더 많다고
  alternatives_korean:
  - 곧 용사들의 우두머리로서, 수가 더 많다고
  - 곧 남자들의 우두머리로서, 더 많다고
  - 곧 유력한 사람들의 우두머리로서, 더 많다고
  lexicon: HALOT
  rationale: 헤브라이어의 비교 표현과 ‘רָאשֵׁי הַגְּבָרִים’의 직역성을 살리되, 한국어에서는 ‘용사들의 우두머리’로 다소 역동적이지만 원문의 위계적 표현을 유지했습니다.
- source_word: וַיַּחְלְקוּם
  english_pob_choice: they divided them thus
  chosen_korean: 그래서 그들을 이렇게 나누었습니다
  alternatives_korean:
  - 그래서 그들을 분배했습니다
  - 그래서 그들을 나누어 배정했습니다
  - 그래서 그들을 이렇게 분배했습니다
  lexicon: HALOT
  rationale: 문맥상 제사 직무 집단을 몫으로 배정하는 뜻이므로, 한국어의 자연스러운 행정적 표현으로 옮겼습니다.
- source_word: בֵּית אָבוֹת / בֵית אֲבוֹתָם
  english_pob_choice: fathers’ houses / according to their fathers’ houses
  chosen_korean: 아버지의 집 / 그들의 아버지의 집에 따라
  alternatives_korean:
  - 조상의 집 / 그들의 조상의 집에 따라
  - 가문의 집 / 그들의 가문의 집에 따라
  - 아버지 집안 / 그들의 아버지 집안에 따라
  lexicon: HALOT
  rationale: ‘fathers’ houses’는 이스라엘의 족속·가문 단위를 가리키므로, 본문의 행정·족보 용어를 보존하는 방향으로 번역했습니다.
theological_decisions:
- issue: ‘גְּבָרִים’의 인식 범위
  chosen_reading: 이 표현을 단순한 성별 지칭보다 ‘유력한/용맹한 남자들’의 집합을 가리키는 것으로 보고 ‘용사들의 우두머리’로 옮겼습니다.
  alternative_readings:
  - 남자들의 우두머리
  - 유력한 사람들의 우두머리
  - 강한 사람들의 우두머리
  rationale: 영어 POB가 주석에서 이 단어의 의미 범위를 넓게 잡고 있어, 한국어도 그 긴장을 살려 위계와 역량을 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 역대기 24장 제사장 반열의 행정적 배분
