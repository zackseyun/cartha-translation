  source_fidelity: ‘용사들의 우두머리’는 גְּבָרִים를 문맥상 지나치게 군사화하며, 제사장 가문의 대표자와 반열을 세는 문맥에 맞지 않습니다. 또한 본문의 수량은 엘르아살 계통에서 나온 가문 대표자의 수가 더 많았음을 말합니다.
  naturalness: ‘아버지의 집의 우두머리’와 ‘그들의 아버지의 집에 따라 여덟이었습니다’는 한국어에서 소유 관계와 서술 관계가 다소 어색합니다. ‘조상 집안의 우두머리’ 및 ‘…여덟을 배정했습니다’가 현대 표준어 문장으로 자연스럽습니다.
  terminology: 고유명사 ‘엘르아살’, ‘이다말’은 유지했습니다. בֵּית אָבוֹת는 직역적 ‘아버지의 집’보다 해당 제도적 의미를 명확히 하는 ‘조상 집안’으로 옮기고 주석으로 보완했습니다.
