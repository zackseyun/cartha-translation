revisions:
- from: 엘르아살의 아들들이 이다말의 아들들보다, 곧 용사들의 우두머리로서, 더 많다고[a] 밝혀졌습니다. 그래서 그들을 이렇게 나누었습니다. 엘르아살의 아들들에게는 아버지의 집의 우두머리가 열여섯이었고, 이다말의 아들들에게는 그들의 아버지의 집에 따라 여덟이었습니다[b].
  to: 엘르아살의 자손 가운데서 가문의 우두머리가 이다말의 자손 가운데서보다 더 많이 나왔습니다[a]. 그래서 그들을 다음과 같이 나누었습니다. 엘르아살의 자손에게는 조상 집안의 우두머리 열여섯을, 이다말의 자손에게는 그들의 조상 집안에 따라 여덟을 배정했습니다[b].
  rationale: 군사적 의미를 불필요하게 확정한 ‘용사들’을 가문 편성 문맥에 맞는 ‘가문의 우두머리’로 바로잡았습니다. 두 수량이 각 계통에 배정된 가문 대표자의 수임을 한국어 문장 안에서 분명히 했으며, 원문의 비교와 ‘그들의 조상 집안에 따라’라는 한정을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:42Z'
