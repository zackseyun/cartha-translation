  text: וַ/יֶּֽחָלְקֵ֣/ם דָּוִ֔יד וְ/צָדוֹק֙ מִן בְּנֵ֣י אֶלְעָזָ֔ר וַ/אֲחִימֶ֖לֶךְ מִן בְּנֵ֣י אִיתָמָ֑ר לִ/פְקֻדָּתָ֖/ם בַּ/עֲבֹדָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
  footnotes:
  - marker: a
    text: Or 'divided them for their assigned duties in their service.' The Hebrew phrase combines ideas of appointment, oversight, or ordered assignment.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 사독과 함께, 곧 엘르아살의 자손 중에서 나온 자와 이다말의 자손 중에서 나온 자를 그들의 직임에 따라 그들의 섬김에 따라 나누었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 섬김에서 맡겨진 직무에 따라 그들을 나누었습니다.’ 히브리어는 임명, 감독, 질서 있는 배정의 뜻을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  english_pob_choice: divided them
  chosen_korean: 나누었습니다
  alternatives_korean:
  - 분배했습니다
  - 구분했습니다
  - 조직했습니다
  lexicon: HALOT
  rationale: חלק의 기본 의미를 살려 인위적으로 풀기보다 ‘나누다’로 옮기되, 문맥상 제사 직무 배치를 자연스럽게 읽히도록 했습니다.
- source_word: וְצָדוֹק
  english_pob_choice: with Zadok
  chosen_korean: 사독과 함께
  alternatives_korean:
  - 그리고 사독
  - 사독과
  lexicon: HALOT
  rationale: 단순 접속사보다 협력 관계를 드러내는 한국어 관용이므로 ‘~과 함께’로 옮겼습니다.
- source_word: לִפְקֻדָּתָם
  english_pob_choice: according to their appointment
  chosen_korean: 그들의 직임에 따라
  alternatives_korean:
  - 그들의 임명에 따라
  - 그들의 맡겨진 순서에 따라
  - 그들의 감독 아래
  lexicon: HALOT
  rationale: פקדה는 여기서 임명·배정·직분의 질서를 함께 담고 있으므로, 행정적이면서도 기능적 의미를 살린 ‘직임’이 가장 균형적입니다.
- source_word: בַּעֲבֹדָתָם
  english_pob_choice: in their service
  chosen_korean: 그들의 섬김에 따라
  alternatives_korean:
  - 그들의 봉사에서
  - 그들의 제사봉사 안에서
  - 그들의 섬김 가운데
  lexicon: HALOT
  rationale: עבודה는 일반적 ‘일’보다 제사장 직무의 봉사성을 드러내므로, 교회 용어를 과하게 덧씌우지 않는 ‘섬김’을 택했습니다.
theological_decisions:
- issue: 제사장 계열과 직무 배정의 표현
  chosen_reading: 본문의 행정적·제의적 배치를 살려, ‘직임’과 ‘섬김’을 분리해 번역했습니다.
  alternative_readings:
  - ‘직분’으로 통일하기
  - ‘봉사’만 사용하기
  rationale: 이 구절은 계보 정보와 제사 직무 배정이 함께 있으므로, 한 단어로 뭉개기보다 두 축을 모두 보존하는 것이 원문의 이해를 더 정확히 반영합니다.
  doctrine_reference: 역대상 24장 제사장 반차 정비의 문맥
