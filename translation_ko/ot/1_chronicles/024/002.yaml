base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
  footnotes:
  - marker: a
    text: Or 'in the presence of their father.' The Hebrew phrase can be understood spatially ('before/in the presence of') or temporally ('before,' that is, during their father’s lifetime).
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나답과 아비후는 아버지보다 먼저 죽었고, 그들에게는 아들이 없었으므로 엘르아살과 이다말이 제사장 직분을 수행하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아버지 앞에서'로도 옮길 수 있습니다. 히브리어 구는 공간적으로도('앞에서/면전에서') 시간적으로도('~전에', 곧 아버지의 생전에) 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었고
  alternatives_korean:
  - 사망했고
  - 죽었습니다
  lexicon: HALOT
  rationale: 과거 서술의 단순 동사를 자연스럽게 옮기되, 뒤 절과의 연결을 위해 연결형 '-고'를 사용했습니다.
- source_word: לִפְנֵי אֲבִיהֶם
  english_pob_choice: before their father
  chosen_korean: 아버지보다 먼저
  alternatives_korean:
  - 아버지 앞에서
  - 아버지의 생전에
  lexicon: HALOT
  rationale: 본문의 핵심은 시간상 선행이므로 한국어에서는 가장 직접적인 시간 표현으로 옮겼습니다. 공간적 뉘앙스는 유지 가능하지만 문맥상 부차적입니다.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  english_pob_choice: they had no sons
  chosen_korean: 그들에게는 아들이 없었으므로
  alternatives_korean:
  - 자녀가 없었으므로
  - 그들에게는 아들이 없었고
  lexicon: HALOT
  rationale: בָּנִים의 직접 의미인 '아들들'을 살리되, 한국어에서는 원인·결과를 부드럽게 이어 주는 '-으므로'가 적절합니다.
- source_word: וַיְכַהֲנוּ
  english_pob_choice: served as priests
  chosen_korean: 제사장 직분을 수행하였습니다
  alternatives_korean:
  - 제사장으로 섬겼습니다
  - 제사장으로 봉사하였습니다
  - 제사장 일을 하였습니다
  lexicon: HALOT
  rationale: כָּהַן의 동사적 의미를 살려 단순한 신분 진술보다 '직분 수행'으로 옮겼습니다. 이는 제사장 사역의 행위를 분명히 드러냅니다.
theological_decisions:
- issue: 아론 생전/면전 의미가 겹치는 'before their father'의 처리
  chosen_reading: 시간적 선행을 본문 본뜻으로 두고, '아버지보다 먼저'로 번역했습니다.
  alternative_readings:
  - 아버지 앞에서
  - 아버지의 생전에
  rationale: 히브리어 לִפְנֵי는 공간적 의미도 가능하지만, 여기서는 나답과 아비후의 죽음이 아론의 생전이었음을 말하는 시간적 의미가 더 직접적입니다.
  doctrine_reference: 본문 문맥상 역사 서술
