  text: בְּנֵ֤י עֻזִּיאֵל֙ מִיכָ֔ה לִ/בְנֵ֥י מִיכָ֖ה שמור׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/024.yaml
  text: 'The sons of Uzziel: Micah[a]; of the sons of Micah: Shamir.'
  footnotes:
  - marker: a
    text: Or "Shemor" for the final personal name; the Hebrew spelling שמור can be represented either way in English transliteration.
