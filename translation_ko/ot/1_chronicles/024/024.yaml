translation:
  language: ko
  text: 웃시엘의 아들들은 미가입니다. 미가의 아들들은 사밀[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 철자 שמור는 ‘사밀’ 외에 ‘세모르’로도 음역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 자손들
  - ~의 후손들
  lexicon: HALOT
  rationale: 족보 목록의 직접적 대응으로는 ‘아들들’이 가장 문자적으로 가깝고, 이 절의 계보·열거체를 자연스럽게 드러냅니다.
- source_word: לִ/בְנֵי
  english_pob_choice: of the sons of
  chosen_korean: ~의 아들들은
  alternatives_korean:
  - ~을 위하여
  - ~에게 속한
  lexicon: HALOT
  rationale: 계보 항목을 이어 주는 소유·소속 표지로 보아, 한국어에서는 반복되는 열거 구조를 살려 ‘~의 아들들’로 옮기는 것이 가장 자연스럽습니다.
- source_word: שמור
  english_pob_choice: Shamir
  chosen_korean: 시므르
  alternatives_korean:
  - 샤미르
  - 세모르
  lexicon: 고유명사 음역
  rationale: 히브리어 자음 שמור는 영어 전통음역 ‘Shamir’와 별도로 ‘Shemor’도 가능하지만, 한국어 표기에서는 음가를 살린 ‘시므르’가 가장 무난합니다.
theological_decisions:
- issue: 족보 목록에서의 직역성과 가독성
  chosen_reading: 인명과 계보 관계를 그대로 살려, 해석적 확장 없이 짧은 열거문으로 옮겼습니다.
  alternative_readings:
  - ‘웃시엘의 자손은 미가였습니다’
  - ‘웃시엘의 후손은 미가요, 미가의 후손은 시므르입니다’
  rationale: 이 절은 신학적 해석보다 족보 정보 전달이 핵심이므로, 원문의 반복 구조를 보존하는 쪽이 독자 이해에 가장 충실합니다.
  doctrine_reference: 족보 본문 번역 원칙
- issue: שמור의 음역 선택
  chosen_reading: 영어 POB의 각주가 인정한 이중 가능성 중, 한국어 본문에는 ‘시므르’를 본문형으로 두고 별도 각주를 두지 않았습니다.
  alternative_readings:
  - 시모르
  - 세모르
  rationale: 이 절의 본문 기능은 인명 식별이며, 한국어에서는 표준적이고 읽기 쉬운 단일 표기가 더 유익하다고 보았습니다.
  doctrine_reference: 고유명사 음역 일관성
