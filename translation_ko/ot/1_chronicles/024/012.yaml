  text: לְ/אֶלְיָשִׁיב֙ עַשְׁתֵּ֣י עָשָׂ֔ר לְ/יָקִ֖ים שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/012.yaml
  text: the eleventh to Eliashib[b][a], the twelfth to Jakim.
  footnotes:
  - marker: a
    text: Or 'for Eliashib ... for Jakim.' The Hebrew preposition can be rendered either way in this assignment list.
    reason: lexical_alternative
  - marker: b
    text: Literally 'eleven ... twelve'; in context these function as ordinals in the sequence of lots.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리아십에게는 열한째가, 야김에게는 열둘째가 돌아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 לְ 는 이 배정 목록에서 ‘-에게’ 또는 ‘-을 위하여’로 모두 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘열한… 열둘’은 이 문맥에서 순번을 나타내는 서수로 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  english_pob_choice: to Eliashib
  chosen_korean: 엘리아십에게는
  alternatives_korean:
  - 엘리아십을 위하여
  - 엘리아십에게
  lexicon: HALOT
  rationale: 목록형 분배 문맥에서 לְ 는 배정의 방향을 나타내므로 한국어에서는 ‘-에게’로 자연스럽게 살렸습니다. 인명은 음역해 엘리아십으로 옮겼습니다.
- source_word: עַשְׁתֵּי עָשָׂר
  english_pob_choice: the eleventh
  chosen_korean: 열한째
  alternatives_korean:
  - 열한
  - 열한 번째
  lexicon: HALOT
  rationale: 앞선 제비/분배 목록 속에서 순번 기능을 하므로 한국어도 서수로 처리했습니다. 짧은 목록 열거에는 ‘열한째’가 가장 간결합니다.
- source_word: לְ/יָקִים
  english_pob_choice: to Jakim
  chosen_korean: 야김에게는
  alternatives_korean:
  - 야김을 위하여
  - 야긴에게는
  lexicon: HALOT
  rationale: 두 번째 לְ 도 배정 표지로 보고 ‘-에게’로 옮겼습니다. 히브리어 철자에 더 직접적인 음역은 야김이며, 익숙한 야긴보다 원문 대응성이 높습니다.
- source_word: שְׁנֵים עָשָׂר
  english_pob_choice: the twelfth
  chosen_korean: 열둘째
  alternatives_korean:
  - 열둘
  - 열두 번째
  lexicon: HALOT
  rationale: 이 표현도 목록에서 순번을 이루는 서수로 기능하므로 ‘열둘째’로 번역했습니다.
theological_decisions:
- issue: 제비/분배 목록의 압축된 행정 문체
  chosen_reading: 본문은 제사장 직분의 배정을 간단한 순번 목록으로 제시하므로, 설명어를 보태지 않고 배정 결과만 간결하게 옮겼습니다.
  alternative_readings:
  - ‘제비를 뽑아 엘리아십에게…’처럼 제비 개념을 본문에 덧붙이는 번역
  - 명시되지 않은 ‘몫/분깃’을 보충하는 번역
  rationale: 히브리어 원문 자체는 배정명과 서수만 제시하며, POB 영어도 ‘to’와 서수로 최소한의 의미만 드러냅니다. 따라서 한국어도 행정 목록의 압축성을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 문맥상 제사장 반열의 질서 있는 배분(1대상 24장)
