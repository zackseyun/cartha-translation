  lexicon: HALOT
  rationale: 앞의 ‘일곱째’와 대칭을 이루도록 ‘여덟째는’으로 옮겨 순번 목록의 리듬을 살렸습니다.
theological_decisions:
- issue: 제사장 반열 배정 목록의 문장 기능
  chosen_reading: 이 절은 서술문이라기보다 각 반열의 배정 결과를 간명하게 제시하는 목록 항목으로 보았습니다.
  alternative_readings:
  - 보다 직역적으로 ‘학고스에게’ / ‘아비야에게’만 두는 방식
  - ‘위하여’로 목적 뉘앙스를 살리는 방식
  rationale: 문맥상 제비뽑기식 배정의 결과를 전달하는 목록이므로, 한국어에서도 ‘돌아갔습니다’로 결과성을 드러내면서도 원문의 배정 의미를 유지했습니다.
  doctrine_reference: 역대기 24장의 제사장 직무 분배 문맥
