- source_word: לְהַקּוֹץ
  english_pob_choice: to Hakkoz
  chosen_korean: 학고스에게
  alternatives_korean:
  - 학고스에게
  - 학고스를 위해
  lexicon: HALOT
  rationale: 배분·지정의 ל를 한국어 여격 조사 ‘에게’로 자연스럽게 옮겨, 제비뽑기/배정 목록의 의미를 살렸습니다.
- source_word: הַשְּׁבִעִי
  english_pob_choice: the seventh
  chosen_korean: 일곱째는
  alternatives_korean:
  - 일곱째
  - 일곱 번째는
  lexicon: HALOT
  rationale: 히브리어 정관사 붙은 서수형을 목록 문맥에 맞게 ‘일곱째는’으로 처리해 순서 배정을 분명히 했습니다.
- source_word: לַאֲבִיָּה
  english_pob_choice: to Abijah
  chosen_korean: 아비야에게
