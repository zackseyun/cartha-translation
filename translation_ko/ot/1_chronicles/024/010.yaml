- source_word: לְהַקּוֹץ
  english_pob_choice: to Hakkoz
  chosen_korean: 학고스에게
  alternatives_korean:
  - 학고스에게
  - 학고스를 위해
  lexicon: HALOT
  rationale: 배분·지정의 ל를 한국어 여격 조사 ‘에게’로 자연스럽게 옮겨, 제비뽑기/배정 목록의 의미를 살렸습니다.
