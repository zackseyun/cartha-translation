translation:
  language: ko
  text: 미가의 형제는 이시야이고, 이시야의 아들 가운데서는 스가랴입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִי
  english_pob_choice: The brother of
  chosen_korean: 형제는
  alternatives_korean:
  - 형은
  - 형제는
  - 오라비는
  lexicon: HALOT
  rationale: 족보식 나열에서 관계를 자연스럽게 풀어 주되, 원문의 친족 관계를 유지하기 위해 ‘형제’로 옮겼습니다.
- source_word: מִיכָה
  english_pob_choice: Micah
  chosen_korean: 미가
  alternatives_korean:
  - 미카
  lexicon: HALOT
  rationale: 고유명사는 한국어 성서 관용 표기를 따르는 것이 가장 자연스럽습니다.
- source_word: יִשִּׁיָּה
  english_pob_choice: Isshiah
  chosen_korean: 이시야
  alternatives_korean:
  - 이시아
  - 예시야
  lexicon: HALOT
  rationale: 이름의 히브리어 형태를 반영해 음역했고, 영어 전통 표기의 변이 가능성은 본문이 아니라 주석으로 처리하지 않았습니다.
- source_word: לִבְנֵי יִשִּׁיָּה
  english_pob_choice: of the sons of Isshiah
  chosen_korean: 이시야의 아들 가운데서는
  alternatives_korean:
  - 이시야의 아들들에게서는
  - 이시야의 아들들 가운데
  lexicon: HALOT
  rationale: 족보 맥락의 ל + ‘아들들’은 소속/후손 관계를 나타내므로, ‘~가운데서는’으로 자연스럽게 풀어 소집단 범주를 드러냈습니다.
- source_word: זְכַרְיָהוּ
  english_pob_choice: Zechariah
  chosen_korean: 스가랴
  alternatives_korean:
  - 제카르야후
  - 즈가랴
  lexicon: HALOT
  rationale: 한국어 성서에서 널리 쓰이는 관용형을 사용했습니다.
