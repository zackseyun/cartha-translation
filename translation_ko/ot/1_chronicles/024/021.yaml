  rationale: ראש는 문자적으로 ‘머리’이지만 여기서는 행정적·대표적 지위를 뜻하므로, 현대 한국어에서 계보 목록에 어울리는 ‘수장’으로 옮겼습니다.
- source_word: יִשִּׁיָּֽה
  english_pob_choice: Isshiah
  chosen_korean: 이시야
  alternatives_korean:
