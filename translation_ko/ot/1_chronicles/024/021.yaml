  - 르하브야의 아들들 가운데
  lexicon: HALOT
  rationale: בני는 직역 가능한 ‘아들들’로 유지하고, 목록적 소속을 나타내는 ל는 ‘가운데서는’으로 처리해 해당 집단 내 대표자를 가리키는 뜻을 살렸습니다.
- source_word: הָ/רֹ֖אשׁ
