  rationale: 족보·편제 목록에서 ל는 항목 표지를 이루므로, 관계를 드러내는 ‘-에게’로 옮겨 해당 분기와 연결된 항목임을 보이게 했습니다.
- source_word: לִ/בְנֵ֣י רְחַבְיָ֔הוּ
  english_pob_choice: from the sons of Rehabiah
  chosen_korean: 르하브야의 아들들 가운데서는
