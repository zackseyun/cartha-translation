  lexicon: HALOT
  rationale: לְ는 이 목록에서 배정·귀속을 나타내므로 한국어로는 여격 조사와 함께 ‘돌아갔습니다’로 자연스럽게 옮겨 분배의 뜻을 살렸습니다. 인명은 표준 음역 ‘예수아’를 따랐습니다.
- source_word: הַתְּשִׁיעִי
  english_pob_choice: the ninth
  chosen_korean: 아홉째로
  alternatives_korean:
  - 아홉째
  - 제9번으로
  lexicon: HALOT
  rationale: 정관사 붙은 서수는 이 연속 목록에서 순번을 가리키므로, 한국어에서는 서술적 형식보다 부사격 ‘아홉째로’가 문맥상 가장 자연스럽습니다.
- source_word: לִשְׁכַנְיָהוּ
  english_pob_choice: to Shecaniah
  chosen_korean: 스가냐에게는
  alternatives_korean:
  - 스가냐에게
  - 스가냐에게 돌아갔습니다
  lexicon: HALOT
  rationale: 앞의 לְ와 같은 배정 의미이므로 동일하게 여격으로 처리했습니다. 인명은 현대 표기 관행에 맞춰 ‘스가냐’로 옮겼습니다.
- source_word: הָעֲשִׂירִי
  english_pob_choice: the tenth
  chosen_korean: 열째로
  alternatives_korean:
  - 열째
  - 제10번으로
  lexicon: HALOT
  rationale: 서수의 관사 포함 형태는 앞 절과 병렬을 이루는 순번 표지이므로, 한국어에서도 ‘열째로’로 맞춰 간결하게 반영했습니다.
