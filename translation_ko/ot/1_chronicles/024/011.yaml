  rationale: 앞의 לְ와 같은 배정 의미이므로 동일하게 여격으로 처리했습니다. 인명은 현대 표기 관행에 맞춰 ‘스가냐’로 옮겼습니다.
- source_word: הָעֲשִׂירִי
  english_pob_choice: the tenth
  chosen_korean: 열째로
  alternatives_korean:
  - 열째
  - 제10번으로
  lexicon: HALOT
  rationale: 서수의 관사 포함 형태는 앞 절과 병렬을 이루는 순번 표지이므로, 한국어에서도 ‘열째로’로 맞춰 간결하게 반영했습니다.
