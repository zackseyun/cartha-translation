translation:
  language: ko
  text: 첫째 제비는 여호야립에게, 둘째는 여다야에게 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: came out
  chosen_korean: 나왔습니다
  alternatives_korean:
  - 떨어졌습니다
  - 돌아갔습니다
  lexicon: HALOT
  rationale: 제비를 뽑는 문맥에서 ‘나오다’는 히브리어 יצא의 기본 의미를 자연스럽게 살리면서도 한국어로 무리 없이 읽힙니다.
- source_word: הַגּוֹרָל
  english_pob_choice: lot
  chosen_korean: 제비
  alternatives_korean:
  - 제비뽑기
  - 운명
  lexicon: HALOT
  rationale: 문맥상 성직 조를 정하는 제비를 가리키므로, 한국어 성경에서 익숙한 ‘제비’가 가장 간결하고 정확합니다.
- source_word: לִיהוֹיָרִיב / לִידַעְיָה
  english_pob_choice: for Jehoiarib / for Jedaiah
  chosen_korean: 여호야립에게 / 여다야에게
  alternatives_korean:
  - 여호야립을 위해 / 여다야를 위해
  - 여호야립에게로 / 여다야에게로
  lexicon: HALOT
  rationale: ל 접두사는 배정의 수혜자를 표시하므로, 한국어에서는 여격 조사 ‘-에게’를 사용해 분배 결과를 자연스럽게 나타냅니다.
