  lexicon: HALOT
  rationale: 문맥상 성직 조를 정하는 제비를 가리키므로, 한국어 성경에서 익숙한 ‘제비’가 가장 간결하고 정확합니다.
- source_word: לִיהוֹיָרִיב / לִידַעְיָה
