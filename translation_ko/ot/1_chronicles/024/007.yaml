  - 여호야립에게로 / 여다야에게로
  lexicon: HALOT
  rationale: ל 접두사는 배정의 수혜자를 표시하므로, 한국어에서는 여격 조사 ‘-에게’를 사용해 분배 결과를 자연스럽게 나타냅니다.
