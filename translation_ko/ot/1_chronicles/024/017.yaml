  rationale: 족보식 배분 목록에서 לְ는 소유보다 배정 대상을 나타내므로, 한국어에서는 자연스럽게 ‘-에게는’으로 옮겨 각 항목의 배정 의미를 살렸습니다.
- source_word: אֶחָד וְ/עֶשְׂרִים
  english_pob_choice: the twenty-first
