    text: Or 'descendants of Ham.' The Hebrew genealogical formula 'sons of' can denote immediate sons or broader lineal descendants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Mizraim'; traditionally associated with Egypt. Here the transliteration is retained because the term appears in a genealogical list as a proper name alongside Cush, Put, and Canaan.
    reason: lexical_alternative
