  text: 미디안의 아들들은 에바와 에벨과 하녹[a]과 아비다와 엘다아입니다. 이들은 모두 그두라의 아들들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하녹’은 히브리어 חֲנוֹךְ의 음역입니다. 영어 성경에서는 흔히 ‘Enoch’로 표기합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
