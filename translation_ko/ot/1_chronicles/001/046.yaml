base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
  footnotes:
  - marker: a
    text: Or 'Aioth,' a variant transliteration of the city name.
    reason: lexical_alternative
translation:
  language: ko
  text: 후삼이 죽고, 브닷의 아들 하닷이 그의 뒤를 이어 다스렸습니다. 그는 모압의 들에서 미디안을 친 자이며, 그의 성읍 이름은 아위스였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아이옷’; 이 지명의 음역 변형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 세상을 떠나고
  lexicon: HALOT
  rationale: נָמוּת의 서술형을 직역에 가깝게 옮기되, 연속 서술의 흐름을 살려 연결어미 ‘-고’로 처리했습니다.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 다스렸습니다
  alternatives_korean:
  - 그 자리를 대신해 왕이 되었습니다
  - 그의 자리에 즉위했습니다
  lexicon: HALOT
  rationale: מלך와 תחתיו의 결합을 한국어에서 자연스럽게 풀어, 단순한 왕위 교체이면서도 ‘그의 뒤를 이어’라는 대체 관계를 드러냈습니다.
- source_word: הַמַּכֶּה אֶת מִדְיָן
  english_pob_choice: who struck Midian
  chosen_korean: 미디안을 친 자이며
  alternatives_korean:
  - 미디안을 쳐서 이긴 자이며
  - 미디안을 공격한 자이며
  lexicon: HALOT
  rationale: נכה의 기본 의미를 살려 ‘치다’로 옮겼고, POB의 관계절을 따라 하닷의 식별적 행위를 덧붙였습니다.
- source_word: בִּשְׂדֵה מוֹאָב
  english_pob_choice: in the field of Moab
  chosen_korean: 모압의 들에서
  alternatives_korean:
  - 모압의 들판에서
  - 모압 땅에서
  lexicon: HALOT
  rationale: שָׂדֶה의 문자적 이미지를 유지하면서도 한국어에서 자연스러운 ‘들’로 옮겨 지리적 전장을 드러냈습니다.
- source_word: עיות
  english_pob_choice: Avith
  chosen_korean: 아위스
  alternatives_korean:
  - 아이옷
  - 아빗
  lexicon: HALOT
  rationale: 지명은 음역하되, 본문 전승 차이로 인한 변이 가능성을 고려해 현대 한국어 표기 형태로 옮겼습니다.
