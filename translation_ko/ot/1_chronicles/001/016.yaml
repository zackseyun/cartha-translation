  - 아르와드 사람들
  - 아르와드 족속
  lexicon: HALOT
  rationale: 히브리어는 형태상 단수형이지만 집합적으로 한 민족/집단을 가리키므로, 한국어에서는 ‘사람들’로 집합성을 드러내는 것이 source와 영어 POB의 처리에 가장 가깝습니다.
