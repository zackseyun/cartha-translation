  - 하맛 족속
  lexicon: HALOT
  rationale: 하맛에 속한 주민 집단을 뜻하는 gentilic이므로, 한국어에서도 지명+‘사람들’ 구조로 민족/집단 의미를 자연스럽게 살렸습니다.
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 또
  alternatives_korean:
  - 그리고
  - 및
  lexicon: BDB
  rationale: 족보/열거 문맥에서 항목을 이어 주는 접속을 한국어에서는 반복적인 ‘그리고’보다 간결한 ‘또’로 옮기는 편이 자연스럽고, object marker의 기능적 부담을 과도하게 드러내지 않습니다.
theological_decisions:
- issue: 이 절의 집합명사 처리
  chosen_reading: 단수형 gentilic을 민족/씨족 단위의 복수 집합으로 읽어 ‘사람들’로 번역했습니다.
  alternative_readings:
  - 단수형에 맞춰 ‘아르왓 사람’처럼 옮김
  - ‘족속’으로 보다 고어적/집단적 표현 사용
  rationale: 본문의 족보적 열거는 개인이 아니라 집단을 나열하므로, 형태상 단수라도 집합적 의미를 드러내는 것이 독자 이해와 source 의미에 더 충실합니다.
  doctrine_reference: 창세기 10장 계열의 민족 목록 읽기; 민족/씨족 표기 관례
