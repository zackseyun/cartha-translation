  source_fidelity: 히브리어의 세 민족명은 형태상 단수 남성형이지만 이 족보적 민족 목록에서는 집합적으로 쓰였습니다. 초안의 ‘사람들’ 처리는 이 집합성을 적절히 드러냅니다. 그러나 원문에서 앞 절의 ‘낳다’가 이어져 목적어들을 지배하는데, ‘말합니다’는 원문에 없는 발화 행위를 도입하여 본문 의미를 바꿉니다.
