  chosen_korean: 세마르 사람들
  alternatives_korean:
  - 세마르 사람
  - 제마르 사람들
  - 세마르 족속
  lexicon: HALOT
  rationale: 지명 Zemar/Simyra에 연결된 집합 명사로 보아, 음역은 하되 한국어에서는 복수 집합을 나타내는 ‘사람들’을 붙였습니다.
- source_word: הַחֲמָתִי
  english_pob_choice: the Hamathites
  chosen_korean: 하맛 사람들
  alternatives_korean:
