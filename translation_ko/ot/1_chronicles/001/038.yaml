translation:
  language: ko
  text: 그리고 세일의 아들들은[a] 로단, 쇼발, 시브온, 아나, 디손, 에셀, 디산입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 족보 문맥에서 직접 아들뿐 아니라 후손이나 씨족 구성원을 가리킬 수도 있습니다. 여기서는 정형적인 족보 표현을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - …의 아들들이
  lexicon: HALOT
  rationale: 족보 서술의 공식적 도입을 살리되, 한국어에서는 문맥상 자연스러운 목록 연결을 위해 ‘그리고’를 유지했습니다.
- source_word: שֵׂעִיר
  english_pob_choice: Seir
  chosen_korean: 세일
  alternatives_korean:
  - 시르
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역인 ‘세일’을 채택했습니다.
- source_word: צִבְעוֹן
  english_pob_choice: Zibeon
  chosen_korean: 시브온
  alternatives_korean:
  - 지브온
  lexicon: HALOT
  rationale: 히브리어 자음값을 살려 ‘시브온’으로 옮기고, 한국어에서 익숙한 형태보다 원음 대응을 우선했습니다.
- source_word: דִישֹׁן / דִישָׁן
  english_pob_choice: Dishon / Dishan
  chosen_korean: 디손 / 디산
  alternatives_korean:
  - 디숀 / 디샨
  - 디손 / 디샨
  lexicon: HALOT
  rationale: 서로 다른 두 이름의 히브리어 철자 차이를 한국어에서도 구별되게 드러내기 위해 끝소리를 달리 표기했습니다.
theological_decisions:
- issue: 족보 표현 ‘sons of’의 범위
  chosen_reading: ‘아들들’로 직역하되, 이 계보 항목이 직접 아들뿐 아니라 후손/씨족 구성원을 포함할 수 있다는 의미 확장은 본문 자체에 맡겼습니다.
  alternative_readings:
  - ‘자손들’로 일반화
  - ‘씨족들’로 해석적 확대
  rationale: 히브리어 בְּנֵי의 족보적 관용을 보존해야 하므로, 원문이 허용하는 범위 이상의 해석은 피했습니다.
  doctrine_reference: 창세기·역대기 족보 용례
