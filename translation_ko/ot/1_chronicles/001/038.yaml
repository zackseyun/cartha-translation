translation:
  language: ko
  text: 그리고 세일의 아들들은 로단, 쇼발, 시브온, 아나, 디손, 에셀, 디산입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 족보 문맥에서 직접 아들뿐 아니라 후손이나 씨족 구성원을 가리킬 수도 있습니다. 여기서는 형식적인 족보 표현을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - …의 아들들이
  lexicon: HALOT
  rationale: 족보 서술의 공식적 도입을 살리되, 한국어에서는 문맥상 자연스러운 목록 연결을 위해 ‘그리고’를 유지했습니다.
- source_word: שֵׂעִיר
