  rationale: 문장 끝의 요약 절은 한국어에서 자연스럽게 과거 회고형으로 처리하되, 앞의 אַלּוּף를 일관되게 ‘족장’으로 유지해 명단의 결론을 분명히 했습니다.
theological_decisions:
- issue: 족보 목록에서 אַלּוּף의 사회적 지위 표현
