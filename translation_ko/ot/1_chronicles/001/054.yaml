  rationale: 에돔 족보/명단에서 אַלּוּף는 부족 또는 씨족의 우두머리를 가리키므로, 현대 한국어에서 명단 문맥에 자연스럽고 위계가 드러나는 ‘족장’으로 옮겼습니다.
