  alternative_readings:
  - ‘공작’처럼 전통 번역어를 쓰는 방식
  - ‘지도자’로 완화하는 방식
  rationale: 본문은 서열 귀족이 아니라 에돔 족장 목록을 제시하므로, 전통적 교회 용어보다 원문 사회구조를 드러내는 표현이 적합합니다.
  doctrine_reference: 역사·족보 본문 해석
