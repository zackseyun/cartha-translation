source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְר֑וֹד ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת גִּבּ֖וֹר בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
  footnotes:
  - marker: a
    text: Or 'on the earth.' Hebrew אֶרֶץ can mean 'land' or 'earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구스가 니므롯을 낳았습니다[a]. 그는 땅에서 용사로 되기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅 위에서’. 히브리어 אֶרֶץ는 ‘땅’이나 ‘땅/세상’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כּוּשׁ
  english_pob_choice: And Cush
  chosen_korean: 구스가
  alternatives_korean:
  - 그리고 구스는
  - 또 구스는
  lexicon: HALOT
  rationale: 계보 문맥의 פשוט한 접속을 한국어에서는 자연스럽게 주어 표지로 풀어 쓰되, 고유명사 כּוּשׁ은 표준 음역인 ‘구스’로 옮겼습니다.
- source_word: יָלַד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳아 주었습니다
  lexicon: HALOT
  rationale: 계보 문맥에서 ילד는 직접적인 출생 관계를 나타내므로, 현대 한국어에서 가장 자연스럽고 간명한 ‘낳다’로 옮겼습니다.
- source_word: גִּבּוֹר
  english_pob_choice: a mighty one
  chosen_korean: 용사로
  alternatives_korean:
  - 용맹한 사람으로
  - 힘센 자로
  - 장사로
  lexicon: HALOT
  rationale: גִּבּוֹר는 단순한 힘의 크기보다 ‘영웅적/전사적 인물’의 뉘앙스를 가질 수 있어, 문맥상 넓은 의미를 유지하면서도 자연스러운 ‘용사’로 옮겼습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅에서
  - 땅 위에서
  - 나라에서
  lexicon: HALOT
  rationale: אֶרֶץ의 기본 의미 범위를 살려 ‘땅’으로 옮겼고, 영어 본문의 ‘land’보다 더 넓은 ‘earth’의 가능성은 본문 안에서 강제하지 않도록 한국어 본문에서는 중립적으로 처리했습니다.
theological_decisions:
- issue: גִּבּוֹר의 성격을 ‘용사’로 옮길지 ‘강한 자’로 완화할지
  chosen_reading: 니므롯을 본문이 말하는 대로 ‘용사’로 제시합니다.
  alternative_readings:
  - 강한 자
  - 영웅
  - 힘센 자
  rationale: 본문은 니므롯의 두드러진 위상을 간단히 진술할 뿐, 그 성격을 완화하거나 도덕적으로 해석하라고 요구하지 않습니다. 따라서 전통적 교회어보다 원문의 인상에 가까운 ‘용사’를 유지합니다.
  doctrine_reference: Translation philosophy §3 (의미를 약화시키지 않고 긴장을 보존함)
