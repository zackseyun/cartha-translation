base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
  footnotes:
  - marker: a
    text: Hebrew 'Alian'; the parallel genealogy in Genesis 36:23 reads 'Alvan.'
    reason: alternative_reading
  - marker: b
    text: Chronicles reads 'Shephi'; the parallel in Genesis 36:23 reads 'Shepho.'
    reason: alternative_reading
translation:
  language: ko
  text: 소발의 아들들은 알리안[a], 마나핫, 에발, 셰피[b], 오남입니다. 또 시브온의 아들들은 아야와 아나입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘알리안’으로 읽힙니다. 병행 족보인 창세기 36:23에는 ‘알반’이 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 역대기는 ‘셰피’로 읽히며, 병행 본문인 창세기 36:23에는 ‘셰포’가 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서는 בְּנֵי를 직역한 ‘~의 아들들’이 가장 자연스럽고, 이름 목록의 직접적 혈연 관계를 분명히 드러냅니다.
- source_word: עַלְיָן
  english_pob_choice: Alian
  chosen_korean: 알리안
  alternatives_korean:
  - 알반
  - 알바ן
  lexicon: 표준 음역
  rationale: 본문의 마소라 자음 형태를 직접 반영하는 음역을 택했습니다. 병행 본문의 다른 전승은 다르지만, 이 절 자체의 형태에 맞춰 옮겼습니다.
- source_word: שְׁפִי
  english_pob_choice: Shephi
  chosen_korean: 셰피
  alternatives_korean:
  - 셰포
  lexicon: 표준 음역
  rationale: 역대기의 철자 형태를 따라 음역했습니다. 창세기 병행 본문의 다른 전승보다, 이 절의 히브리어 형태를 우선했습니다.
- source_word: צִבְעוֹן
  english_pob_choice: Zibeon
  chosen_korean: 시브온
  alternatives_korean:
  - 지브온
  lexicon: 표준 음역
  rationale: 고유명사는 관용적인 한글 음역보다도 히브리어 자음값을 반영한 표기를 택해 족보 목록의 인명 형태를 유지했습니다.
