  - ‘이스라엘, 곧 야곱’으로 보충
  rationale: 이 절은 번역 전통상 예상되는 이름을 바꾸기보다 히브리어가 실제로 사용하는 칭호를 보존하는 것이 더 충실합니다. 이는 교리 문제라기보다 원문 충실성의 문제입니다.
