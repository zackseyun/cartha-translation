  lexicon: HALOT
  rationale: 족보 문맥에서 ילד 히필은 자녀를 낳게 하다라는 뜻이므로, 현대 한국어의 자연스러운 족보 표현인 ‘낳았습니다’로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 아들들은
  - 아들들은 곧
  - 아들들은 다음과 같습니다
  lexicon: HALOT
  rationale: 히브리어 족보식 진술의 다음 계보 항목을 자연스럽게 드러내기 위해 ‘아들들은’으로 옮겼습니다.
- source_word: וְיִשְׂרָאֵל
  english_pob_choice: and Israel
  chosen_korean: 이스라엘
  alternatives_korean:
