id: 1CH.1.51
reference: 1 Chronicles 1:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּהְיוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עליה אַלּ֥וּף יְתֵֽתס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
  footnotes:
  - marker: a
    text: Genesis 36:40 has the corresponding name as 'Alvah.' Chronicles here reads 'Aliah.'
    reason: textual_variant
  - marker: b
    text: Older English versions often render אַלּוּף as 'duke'; here it denotes an Edomite clan or tribal chief.
    reason: lexical_alternative
  - marker: c
    text: Timna may also be spelled 'Timnah' in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: '하닷이 죽었습니다[a]. 그리고 에돔의 우두머리들은 이러합니다: 우두머리 팀나, 우두머리 알리아[b], 우두머리 예드렛입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 36:40에는 대응하는 이름이 ‘알바’로 나옵니다. 역대기 본문은 여기에서 ‘알리아’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: ‘팀나’는 영어 전통의 표기에서 ‘팀나/팀낳’로도 적힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽었습니다 — 그리고
  - 죽었고
  lexicon: HALOT
  rationale: 서사 진행형 완료 동사로서 단순 과거의 자연스러운 한국어 서술을 택했습니다.
- source_word: אַלּוּפֵי / אַלּוּף
  english_pob_choice: chiefs of / Chief
  chosen_korean: 우두머리들 / 우두머리
  alternatives_korean:
  - 족장들 / 족장
  - 지도자들 / 지도자
  - 두목들 / 두목
  lexicon: HALOT
  rationale: 에돔 계보·지파 목록에서 אַלּוּף는 단순한 행정 관직보다 씨족 우두머리의 성격이 강하므로, 현대 한국어에서는 문맥을 드러내는 ‘우두머리’가 가장 직접적입니다.
- source_word: תִּמְנָע
  english_pob_choice: Timna
  chosen_korean: 팀나
  alternatives_korean:
  - 팀나아
  - 팀나
  lexicon: transliteration
  rationale: 인명은 표준 음역으로 옮겼고, 영어 POB의 Timna에 대응하도록 간결하게 처리했습니다.
- source_word: עליה
  english_pob_choice: Aliah
  chosen_korean: 알리아
  alternatives_korean:
  - 알바
  - 알리아
  lexicon: transliteration
  rationale: 역대기 본문의 철자 עליה를 따라 음역했습니다. 사무/창세기 병행형 Alvah는 각주로만 반영하는 편이 본문 충실성에 맞습니다.
theological_decisions:
- issue: 역대기와 창세기의 인명 병행형 차이
  chosen_reading: 본문은 역대기의 형태 ‘알리아’를 따르되, 병행 본문에서 ‘알바’와 대응된다는 점을 각주로 드러냈습니다.
  alternative_readings:
  - 창세기 병행형을 따라 ‘알바’로 통일
  - 각주 없이 본문만 번역
  rationale: 출처 본문(WLC)의 자형을 우선하고, 문헌상 병행 전승 차이를 숨기지 않는 것이 감사 가능한 번역 원칙에 부합합니다.
  doctrine_reference: 본문비평/병행본문 처리 원칙
- issue: אַלוּף의 한국어 대응
  chosen_reading: 전통 교회 용어인 ‘공작’ 대신 문맥상 씨족 우두머리의 의미를 살리는 ‘우두머리’를 사용했습니다.
  alternative_readings:
  - 공작
  - 족장
  - 지도자
  rationale: 영어 POB가 ‘duke’를 피하고 ‘chiefs’로 설명한 것처럼, 에돔 족보의 정치·씨족적 의미를 가장 투명하게 드러내기 위한 선택입니다.
  doctrine_reference: 어휘 투명성 원칙
