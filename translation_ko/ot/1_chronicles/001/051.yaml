source:
  edition: WLC
  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּהְיוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עליה אַלּ֥וּף יְתֵֽתס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
  footnotes:
  - marker: a
    text: Genesis 36:40 has the corresponding name as 'Alvah.' Chronicles here reads 'Aliah.'
    reason: textual_variant
  - marker: b
    text: Older English versions often render אַלּוּף as 'duke'; here it denotes an Edomite clan or tribal chief.
    reason: lexical_alternative
  - marker: c
    text: Timna may also be spelled 'Timnah' in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: '하닷이 죽었습니다. 에돔의 우두머리들은 다음과 같았습니다: 우두머리 팀나[a], 우두머리 알리아[b], 우두머리 예뎃입니다[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘팀나’는 영어 음역에서 ‘Timnah’로도 표기됩니다.
    reason: lexical_alternative
  - marker: b
    text: 창세기 36:40에서는 이에 해당하는 이름이 ‘알바’로 나옵니다. 역대기 본문은 여기에서 ‘알리아’로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 히브리어 ‘알루프’는 여기서 에돔의 씨족 또는 부족의 우두머리를 가리킵니다. 오래된 영어 번역들은 흔히 ‘공작’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
