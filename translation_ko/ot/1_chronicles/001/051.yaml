  terminology: אַלּוּף는 에돔의 씨족·부족 지도자 목록에서 ‘우두머리’로 번역할 수 있습니다. ‘공작’은 고어적이며 현대의 유럽 귀족 작위를 연상시킬 수 있으므로 피하는 것이 적절합니다.
