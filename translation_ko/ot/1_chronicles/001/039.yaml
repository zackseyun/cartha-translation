base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
  footnotes:
  - marker: a
    text: In the parallel genealogy at Genesis 36:22, the name appears as Hemam rather than Homam.
    reason: textual_variant
translation:
  language: ko
  text: 로단의 아들은 호리와 호맘[a]이었고, 로단의 누이는 딤나였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 36:22의 병행 족보에서는 호맘의 이름이 ‘헤맘’으로 나타납니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - 그리고 ~의 아들들
  - 자녀들
  lexicon: HALOT
  rationale: 족보 문맥에서는 בְּנֵי를 ‘아들들’로 옮기는 것이 가장 직접적이며, 앞의 접속사 וּ는 자연스러운 한국어 문장에서는 생략할 수 있습니다.
- source_word: לוֹטָן
  english_pob_choice: Lotan
  chosen_korean: 롯단
  alternatives_korean:
  - 로탄
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다. 한국어 성경에서 굳어진 형태가 없으므로 표준 외래어 표기에 따라 음역했습니다.
- source_word: חֹרִי / וְהוֹמָם
  english_pob_choice: Hori and Homam
  chosen_korean: 호리와 호맘
  alternatives_korean:
  - 호리와 헤맘
  lexicon: 고유명사 음역
  rationale: 본문의 자음형과 영어 POB의 처리에 따라 두 인명 모두 음역했습니다. 병행 본문에서의 Hemam 변이는 주석으로만 다루는 것이 적절합니다.
- source_word: וַאֲחוֹת לוֹטָן תִּמְנָע
  english_pob_choice: and Lotan’s sister was Timna
  chosen_korean: 롯단의 누이는 팀나였습니다
  alternatives_korean:
  - 롯단의 여동생은 팀나였습니다
  - 롯단의 자매는 팀나였습니다
  lexicon: HALOT
  rationale: אֲחוֹת는 친족 관계의 ‘누이/자매’이지만, 족보 서술에서 한국어로는 ‘누이’가 가장 자연스럽고 간결합니다. קשר 문맥의 관계를 분명히 하기 위해 계사 ‘였습니다’를 보충했습니다.
