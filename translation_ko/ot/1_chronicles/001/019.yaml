base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
  footnotes:
  - marker: a
    text: Or 'the land was divided.' The Hebrew can refer either to the whole earth or to a land/territory; the text does not specify the nature of the division.
    reason: lexical_alternative
translation:
  language: ko
  text: 에벨에게는 두 아들이 태어났습니다. 한 아들의 이름은 펠렉[a]이었는데, 그의 시대에 땅이 나뉘었기 때문입니다. 그의 형제의 이름은 욕단이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅이 나뉘었다.’ 히브리어는 온 땅인지 어떤 땅/영토인지 모두 가리킬 수 있으며, 분열의 성격은 본문이 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
