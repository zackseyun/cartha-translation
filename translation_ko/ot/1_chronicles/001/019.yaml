theological_decisions:
- issue: הָאָרֶץ의 범위(온 땅/땅, 영토)
  chosen_reading: 본문의 해석 여지를 열어 두기 위해 ‘땅이 나뉘었기’로 번역했습니다.
  alternative_readings:
