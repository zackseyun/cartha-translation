    text: Hebrew Shelah; compare the traditional form 'Salah' in some translations and related genealogical passages.
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions often read 'Arphaxad' for Arpachshad, reflecting a Greek-influenced form of the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 아르박삿은 셀라를 낳았고, 셀라는 에벨을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적 한국어 번역에서는 이 이름을 ‘살라’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 영어 성경은 이 이름을 ‘Arphaxad’로 적기도 하는데, 이는 그리스어 영향의 전통형입니다.
    reason: lexical_alternative
