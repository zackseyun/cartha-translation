    text: Hebrew Shelah; compare the traditional form 'Salah' in some translations and related genealogical passages.
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions often read 'Arphaxad' for Arpachshad, reflecting a Greek-influenced form of the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 아르박삿[b]은 셀라[a]를 낳았고, 셀라는 에벨을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘셀라’이며, 전통적 한국어 번역에서는 이 이름을 ‘살라’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 전통 영어 성경은 이 이름을 그리스어의 영향을 받은 전통형인 ‘Arphaxad’로 적기도 합니다.
    reason: lexical_alternative
