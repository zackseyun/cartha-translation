    issue: ‘나피시’가 통용 한국어 성서 인명 표기 ‘나비스’와 다릅니다.
    rationale: נָפִישׁ의 한국어 성서 관용 표기는 ‘나비스’입니다. 고유명사는 특별한 음역 원칙이 제시되지 않는 한 통용 표기를 유지하는 편이 독자 인식과 용어 일관성에 적절합니다.
  - severity: low
