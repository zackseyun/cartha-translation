  rationale: 히브리어의 식별문을 한국어에서는 ‘이들은 …입니다’로 자연스럽게 재현했습니다.
- source_word: בְּנֵי יִשְׁמָעֵאל
  english_pob_choice: sons of Ishmael
  chosen_korean: 이스마엘의 아들들
  alternatives_korean:
