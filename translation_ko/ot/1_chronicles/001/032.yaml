  rationale: 족보문맥에서 출산 행위를 간결하게 서술하는 표준 표현으로 옮겼습니다.
- source_word: וּבְנֵי יָקְשָׁן
  english_pob_choice: And the sons of Jokshan
  chosen_korean: 또한 욕산의 아들들은
