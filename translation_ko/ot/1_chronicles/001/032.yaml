base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
  footnotes:
  - marker: a
    text: Genesis 25:1 calls Keturah Abraham’s wife; here the Chronicler specifically calls her his concubine.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 게투라[a]의 아들들, 곧 아브라함의 첩은 이러합니다. 그녀가 즘란과 욕산과 메단과 미디안과 이스박과 수아를 낳았습니다. 또한 욕산의 아들들은 스바와 드단입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 25:1에서는 게투라를 아브라함의 아내라고 하지만, 여기서는 역대기 저자가 그녀를 아브라함의 첩이라고 분명히 말합니다.
    reason: cross_reference
lexical_decisions:
