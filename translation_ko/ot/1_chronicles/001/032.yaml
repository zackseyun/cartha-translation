  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
  footnotes:
  - marker: a
    text: Genesis 25:1 calls Keturah Abraham’s wife; here the Chronicler specifically calls her his concubine.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 게투라[a]의 아들들, 곧 아브라함의 첩은 이러합니다. 그녀가 즘란과 욕산과 메단과 미디안과 이스박과 수아를 낳았습니다. 또한 욕산의 아들들은 스바와 드단입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 25:1에서는 게투라를 아브라함의 아내라고 하지만, 여기서는 역대기 저자가 그녀를 아브라함의 첩이라고 분명히 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들
  alternatives_korean:
  - 또 …의 아들들
  - 그리고 …의 자손들
  lexicon: HALOT
  rationale: 족보 목록의 연결과 반복 구조를 살리기 위해 연결사와 ‘아들들’을 유지했습니다.
- source_word: פִּילֶגֶשׁ
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 소실
  lexicon: HALOT
  rationale: 히브리어 פִּילֶגֶשׁ의 사회적 하위 지위를 드러내는 직접 대응어로 ‘첩’이 가장 간결하고 본문 긴장을 보존합니다.
- source_word: יָלְדָה
  english_pob_choice: she bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 해산했습니다
  - 출산했습니다
  lexicon: HALOT
  rationale: 족보문맥에서 출산 행위를 간결하게 서술하는 표준 표현으로 옮겼습니다.
- source_word: וּבְנֵי יָקְשָׁן
  english_pob_choice: And the sons of Jokshan
  chosen_korean: 또한 욕산의 아들들은
  alternatives_korean:
  - 그리고 욕산의 아들들은
  - 욕산의 아들들은
  lexicon: HALOT
  rationale: 반복되는 족보 도입 공식을 그대로 살려 다음 하위 목록이 시작됨을 분명히 했습니다.
theological_decisions:
- issue: Keturah의 지위 표현
  chosen_reading: ‘아브라함의 첩’으로 번역하여 본문이 명시한 פִּילֶגֶשׁ을 그대로 반영했습니다.
  alternative_readings:
  - ‘아브라함의 아내’
  - ‘아브라함의 후처’
  rationale: 역대기 본문은 창세기 25:1과 달리 Keturah를 첩으로 지칭하므로, 조화시키지 않고 본문의 직접 표현을 유지하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
