theological_decisions:
- issue: Keturah의 지위 표현
  chosen_reading: ‘아브라함의 첩’으로 번역하여 본문이 명시한 פִּילֶגֶשׁ을 그대로 반영했습니다.
  alternative_readings:
  - ‘아브라함의 아내’
  - ‘아브라함의 후처’
  rationale: 역대기 본문은 창세기 25:1과 달리 Keturah를 첩으로 지칭하므로, 조화시키지 않고 본문의 직접 표현을 유지하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
