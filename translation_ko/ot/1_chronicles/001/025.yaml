lexical_decisions:
- source_word: עֵבֶר
  english_pob_choice: Eber
  chosen_korean: 에벨
  alternatives_korean:
  - 헤벨
  lexicon: HALOT
  rationale: 족보의 고유명사이므로 음역하며, 영어 POB의 Eber에 맞춰 표준적 음역형인 에벨을 채택했습니다. 영어 전통의 Heber에 해당하는 다른 표기는 한국어 본문에서는 본문음역보다 덜 자연스럽습니다.
- source_word: פֶּלֶג
  english_pob_choice: Peleg
  chosen_korean: 벨렉
  alternatives_korean:
  - 펠렉
  lexicon: HALOT
  rationale: 문맥상 ‘나뉨’이라는 일반명사가 아니라 족보의 인명이므로 의미 번역하지 않고 음역했습니다. 한국어 성서 음역 관행에 따라 벨렉을 택했습니다.
- source_word: רְעוּ
  english_pob_choice: Reu
  chosen_korean: 르우
  alternatives_korean:
  - 레우
  - 레우
  lexicon: HALOT
  rationale: 족보의 인명으로서 의미를 덧붙이지 않고 음역했습니다. 영어 POB의 Reu를 한국어 표기 관행에 맞게 르우로 옮겼습니다.
