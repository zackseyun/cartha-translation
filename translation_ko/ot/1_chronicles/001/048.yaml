  source_fidelity: 원문의 왕위 계승 공식(‘삼라가 죽고, 그를 대신하여 … 사울이 왕이 되었다’)은 대체로 잘 반영되었습니다. 다만 מֵרְחֹבוֹת הַנָּהָר는 ‘하천가 르호봇’보다 ‘그 강가의 르호봇’이라는 지명적 표현으로 옮기는 편이 정관사가 있는 ‘그 강’과 르호봇의 관계를 더 충실히 드러냅니다.
  naturalness: ‘하천가 르호봇의 사울’은 다소 압축적이고 ‘하천’은 여기의 정관사 있는 נהר의 지시성을 약화합니다. ‘그 강가의 르호봇 출신 사울’은 현대 표준 한국어로 자연스럽고 장소 소속을 분명하게 합니다.
