  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of' can function genealogically for immediate sons or broader descendants; here it introduces Japheth's line in list form.
