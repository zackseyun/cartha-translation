    text: 히브리어 ‘아들들’은 족보에서 직계 아들뿐 아니라 더 넓은 후손을 가리킬 수 있습니다. 여기서는 야벳의 계보를 목록 형식으로 소개합니다.
    reason: lexical_alternative
