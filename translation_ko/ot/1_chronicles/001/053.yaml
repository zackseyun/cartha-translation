lexical_decisions:
- source_word: אַלּוּף
  english_pob_choice: chief
  chosen_korean: 족장
  alternatives_korean:
  - 지도자
  - 우두머리
  - 지파장
  lexicon: HALOT
  rationale: 에돔 족장 명단에서 אַלּוּף는 씨족/부족의 우두머리를 가리키므로, 현대 한국어로는 ‘족장’이 가장 간결하고 계층적 의미를 잘 살립니다.
- source_word: קְנַז
  english_pob_choice: Kenaz
  chosen_korean: 게나스
  alternatives_korean:
  - 케나스
  lexicon: 고유명사 음역
  rationale: 인명은 음역하는 것이 적절하며, 현대 외래어 표기 관행에 맞춰 ‘게나스’로 옮겼습니다.
- source_word: תֵּימָן
  english_pob_choice: Teman
  chosen_korean: 데만
  alternatives_korean:
  - 테만
  lexicon: 고유명사 음역
  rationale: 이 항목도 족장 명단의 고유명사로 처리하는 것이 문맥에 맞아, 이름형 음역으로 옮겼습니다.
- source_word: מִבְצָר
  english_pob_choice: Mibzar
  chosen_korean: 밉사르
  alternatives_korean:
  - 미브자르
  lexicon: 고유명사 음역
  rationale: 족장 명단의 끝에 오는 고유명사이므로 번역하지 않고 음역했습니다.
theological_decisions:
- issue: אַלּוּף의 직함을 어떻게 처리할지
  chosen_reading: ‘족장’으로 옮겨 씨족/부족 지도자라는 사회적 직함을 드러냈습니다.
  alternative_readings:
  - ‘지도자’로 더 일반화할 수 있음
  - ‘공작’처럼 전통 번역어를 사용할 수 있음
  rationale: 본문은 에돔의 족장 목록으로, 현대 독자가 이해할 수 있으면서도 관직의 성격을 보존하는 번역이 필요합니다.
  doctrine_reference: 역사서의 족보/명단 본문 해석 원칙
- issue: 고유명사를 뜻풀이하지 않고 음역할지
  chosen_reading: 게나스, 데만, 밉사르로 음역했습니다.
  alternative_readings:
  - 지명/집단명으로 의미를 풀어 옮길 수 있음
  rationale: 이 구절은 족장들의 명단 형식이므로, 이름의 어원보다 명단 구조를 보존하는 것이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 문맥 우선의 번역 원칙
