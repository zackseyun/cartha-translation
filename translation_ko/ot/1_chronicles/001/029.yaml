base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
  footnotes:
  - marker: a
    text: Nebaioth is traditionally also spelled Nebajoth in some English translations.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 그들의 족보입니다. 이스마엘의 맏아들은 네바욧[a]이고, 그 다음은 게달, 아드브엘, 밉삼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 네바욧은 한국어 성경에서 느바욧 등으로도 옮겨집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹתָם
  english_pob_choice: their generations
  chosen_korean: 그들의 족보
  alternatives_korean:
  - 그들의 نسل
  - 그들의 자손
  - 그들의 계보
  lexicon: HALOT
  rationale: 족보는 genealogical heading으로서 תּוֹלְדוֹת의 문맥상 기능을 가장 자연스럽게 옮기며, 단순한 ‘자손’보다 기록체의 형식을 더 잘 보존합니다.
- source_word: בְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: 문맥상 이스마엘의 아들 목록을 이끄는 표지이므로 ‘맏아들’이 가장 자연스럽고, ‘장자’보다 현대 한국어에서 덜 제도적입니다.
- source_word: נְבָיוֹת
  english_pob_choice: Nebaioth
  chosen_korean: 네바욧
  alternatives_korean:
  - 느바욧
  - 네바옷
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역하되, 영어 POB의 표준형 Nebaioth에 대응하는 한국어 형태로 옮겼습니다.
- source_word: קֵדָר
  english_pob_choice: Kedar
  chosen_korean: 게달
  alternatives_korean:
  - 케달
  - 그달
  lexicon: HALOT
  rationale: 히브리어 קֵדָר의 자음과 모음을 반영한 음역으로, 성경 인명·지명에서 통용되는 한국어 표기를 따랐습니다.
- source_word: אַדְבְּאֵל
  english_pob_choice: Adbeel
  chosen_korean: 아드브엘
  alternatives_korean:
  - 앗브엘
  - 아드벨
  lexicon: HALOT
  rationale: 히브리어 자모 배열을 최대한 반영한 음역으로, 고유명사의 형태를 유지합니다.
- source_word: מִבְשָׂם
  english_pob_choice: Mibsam
  chosen_korean: 밉삼
  alternatives_korean:
  - 미브삼
  - 밉사므
  lexicon: HALOT
  rationale: 어말 자음과 모음 구조를 반영하여 간결하게 음역했습니다.
theological_decisions:
- issue: 족보 문구의 서술 기능
  chosen_reading: ‘이것이 그들의 족보입니다’로 현재형 서술을 유지했습니다.
  alternative_readings:
  - ‘이것들은 그들의 자손이었습니다’
  - ‘이것들은 그들의 계보입니다’
  rationale: 히브리어의 표제문 성격을 살려 기록 서두처럼 읽히게 하되, 과거형으로 닫아버리지 않도록 했습니다.
  doctrine_reference: 성경 본문의 장르와 기록 형식 보존
