translation:
  language: ko
  text: 셈의 아들들은 엘람, 앗수르, 아르박삿, 룻, 아람, 우스, 훌, 게델, 메섹입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 10:23의 병행 족보에는 ‘메섹’ 대신 ‘마스’가 나옵니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי שֵׁם
  english_pob_choice: The sons of Shem
  chosen_korean: 셈의 자손은
  alternatives_korean:
  - 셈의 아들들은
  - 셈의 후손은
  lexicon: HALOT
  rationale: 족보 서문의 בני는 직역하면 ‘아들들’이지만, 한국어 족보 문맥에서는 ‘자손’이 자연스럽고 범위도 정확하게 드러납니다.
- source_word: עֵילָם
  english_pob_choice: Elam
  chosen_korean: 엘람
  alternatives_korean:
  - 일람
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 표기했습니다.
- source_word: אַשּׁוּר
  english_pob_choice: Asshur
  chosen_korean: 앗수르
  alternatives_korean:
  - 아수르
  - 앗시리아
  lexicon: HALOT
  rationale: 여기서는 국가명 ‘앗시리아’가 아니라 셈의 계보에 놓인 고유 인명으로 보아 음역을 유지했습니다.
- source_word: אַרְפַּכְשַׁד
  english_pob_choice: Arpachshad
  chosen_korean: 아르박삿
  alternatives_korean:
  - 아르박삿드
  - 아르파크삿
  lexicon: HALOT
  rationale: 히브리어 형태를 따라 전통적 한국어 음역보다 원형에 더 가까운 표기를 택했습니다.
- source_word: לוּד
  english_pob_choice: Lud
  chosen_korean: 룻
  alternatives_korean:
  - 루드
  lexicon: HALOT
  rationale: 히브리어 자음과 모음값을 반영한 음역으로 적었습니다.
- source_word: גֶתֶר
  english_pob_choice: Gether
  chosen_korean: 게델
  alternatives_korean:
  - 게데르
  - 게터
  lexicon: HALOT
  rationale: 고유명사의 표준화된 한국어 음역이 없으므로 발음 가능한 형태로 옮겼습니다.
- source_word: מֶשֶׁךְ
  english_pob_choice: Meshech
  chosen_korean: 메섹
  alternatives_korean:
  - 메셰크
  - 메섹
  lexicon: HALOT
  rationale: 히브리어 고유명사 음역을 따랐고, 병행구의 변이독법은 각주로 처리했습니다.
theological_decisions:
- issue: 병행 족보의 변이독법 처리
  chosen_reading: 열왕적/족보적 나열 본문은 본문 표기대로 옮기되, 창세기 10:23의 병행 본문이 ‘마스’를 보인다는 점은 각주로 남겼습니다.
  alternative_readings:
  - 본문에 맞추어 ‘메섹’만 제시
  - 창세기 병행을 따라 ‘마스’로 본문 수정
  rationale: WLC 본문은 메섹이며, POB의 영어 각주가 병행구 변이를 명시하므로 한국어 본문은 본문독법을 유지하고 변이는 주석으로 보존하는 것이 가장 투명합니다.
  doctrine_reference: 본문비평과 병행구 비교 원칙
- issue: 족보적 관계 표현
  chosen_reading: ‘sons of’를 ‘자손’으로 옮겨 남성 직계만이 아니라 족보상의 후손 전체를 가리키는 기능을 살렸습니다.
  alternative_readings:
  - ‘아들들’로 직역
  - ‘후손들’로 의역
  rationale: 이 장르는 인명 목록을 통해 계보를 제시하므로, 한국어 독자에게 족보 기능을 자연스럽게 전달하는 표현이 적절합니다.
  doctrine_reference: 족보 서술 관례
