  chosen_reading: 이 절은 신학적 해석보다 계보적 연관을 전달하는 본문이므로, 의미 확장 없이 고유명사와 종족명을 직역·음역 중심으로 유지했습니다.
  alternative_readings:
  - 지명/민족명으로 풀어 번역하기
