  source_fidelity: 원문은 미스라임이 네 집단(לודיים, עֲנָמִים, לְהָבִים, נַפְתֻּחִים)을 낳았다는 계보 진술입니다. 초안의 ‘낳았습니다’는 יָלַד의 계보적 용법을 충실히 반영합니다. 그러나 לודיים은 ‘루딧’보다 ‘루딤’, עֲנָמִים은 ‘아님’보다 ‘아나밈’으로 옮기는 편이 자음 형태와 원문상의 이름을 정확히 보존합니다.
  naturalness: ‘미스라임이 … 사람들을 낳았습니다’는 계보 문맥에서 자연스럽고 현대 표준 한국어 합쇼체에도 맞습니다. 집단명 뒤의 ‘사람들’은 영어식 민족명 접미사를 한국어로 명시하는 안전한 방식입니다.
  terminology: ‘미스라임’은 족보 속 고유명사로 적절합니다. 종족명은 임의로 한국어식 어미를 붙인 ‘루딧’이나 축약된 ‘아님’ 대신, 원문 음역인 ‘루딤’, ‘아나밈’, ‘레하빔’, ‘납두힘’을 사용해야 합니다. 각 명칭의 역사적 동일시를 본문에 부가하지 않습니다.
