  rationale: 본문의 정보량은 계보 관계 자체에 있으므로, 독자가 원문에 있는 족속명들을 그대로 추적할 수 있도록 보존하는 것이 적절합니다.
  doctrine_reference: 창세기-역대기 족보 본문에 대한 서술적 충실성 원칙
