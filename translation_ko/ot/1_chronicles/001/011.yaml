  rationale: 계보에서의 जन्म/출생 관계를 한국어에서 가장 자연스럽고 직접적으로 드러내는 동사로 옮겼습니다.
- source_word: לודיים / עֲנָמִים / לְהָבִים / נַפְתֻּחִים
