id: 1CH.1.43
reference: 1 Chronicles 1:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
  footnotes:
  - marker: a
    text: Or, 'before a king reigned over the sons of Israel.' The Hebrew is literally 'before the reigning of a king for/over the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 이것은 에돔 땅에서 왕들이 다스린 이들입니다 — 이스라엘 자손 위에 어떤 왕도 다스리기 전입니다: 브에르의 아들 벨라와, 그의 도시 이름은 디나바입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 자손 위에 한 왕이 다스리기 전입니다.’ 히브리어는 문자적으로 ‘이스라엘 자손을 위해/위에 한 왕의 다스림 이전에’라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these are
  chosen_korean: 그리고 이것은
  alternatives_korean:
  - 이것들은
  - 그리고 이들은
  lexicon: HALOT
  rationale: 목록을 여는 연결어와 지시어를 살리되, 한국어에서는 자연스러운 소개 표현인 ‘그리고 이것은’으로 처리했습니다.
- source_word: מָלְכוּ
  english_pob_choice: who reigned
  chosen_korean: 다스린
  alternatives_korean:
  - 통치한
  - 왕 노릇한
  lexicon: HALOT
  rationale: מלך의 왕권 행사를 한국어 동사로 자연스럽게 옮겼습니다. ‘다스리다’는 본문의 왕적 통치를 무난하게 반영합니다.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  english_pob_choice: before any king reigned
  chosen_korean: 어떤 왕도 다스리기 전입니다
  alternatives_korean:
  - 한 왕이 다스리기 전입니다
  - 왕이 다스리기 전에
  lexicon: HALOT
  rationale: 히브리어의 단수적 시간 표현을 살리면서도 한국어에서는 부자연스러운 직역을 피했습니다. ‘어떤 왕도’는 영어 POB의 audit trail과 부합하며, 선행 왕권 부재를 분명히 합니다.
- source_word: בֶּלַע בֶּן בְּעוֹר
  english_pob_choice: Bela son of Beor
  chosen_korean: 브에르의 아들 벨라
  alternatives_korean:
  - 벨라, 브에르의 아들
  - 벨라, 베올의 아들
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 족보식 표현인 ‘아들’ 구조를 그대로 유지했습니다. 브에르는 기존 음역 관례보다 원형에 가까운 표기를 선택했습니다.
- source_word: וְשֵׁם עִירוֹ
  english_pob_choice: and the name of his city was
  chosen_korean: 그의 도시 이름은
  alternatives_korean:
  - 그리고 그의 성읍 이름은
  - 그의 도시의 이름은
  lexicon: HALOT
  rationale: 히브리어 명사문을 한국어로 간결하게 옮겼습니다. ‘성읍’보다 ‘도시’가 현대 독자에게 더 투명하므로 이를 택했습니다.
theological_decisions:
- issue: 왕정 시기 이전의 역사적 표지
  chosen_reading: 이 구절은 에돔의 왕들 목록을 제시하면서, 이스라엘에 왕이 생기기 이전이라는 시간 표지를 분명히 합니다.
  alternative_readings:
  - 단순한 연대 정보만 제시하는 것으로 약화해 읽는 것
  rationale: 본문의 대비는 이스라엘 왕정의 시작 이전이라는 역사적 맥락을 강조합니다. 이를 흐리지 않기 위해 시간 표지를 또렷하게 유지했습니다.
  doctrine_reference: 구속사적 역사 서술의 문맥 보존
- issue: ‘어떤 왕도’의 범위 표현
  chosen_reading: ‘어떤 왕도’로 옮겨 선행 왕권의 부재를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘한 왕이’로 직역하는 것
  - ‘아무 왕도’로 옮기는 것
  rationale: 히브리어의 단수형을 한국어에서 과도하게 문자화하지 않으면서, 문맥상 ‘before a king reigned’가 뜻하는 선행 부재를 가장 분명하게 전달합니다.
  doctrine_reference: 본문 의미의 명료성
