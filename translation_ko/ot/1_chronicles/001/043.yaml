  source_fidelity: 핵심 의미는 대체로 반영했으나, לִבְנֵי יִשְׂרָאֵל은 문법상 ‘이스라엘 자손을 위하여/에게’의 관계를 지니므로 주본문에서 단정적으로 ‘위에’라고만 옮기기보다 그 관계를 보존하는 표현이 적절합니다. 또한 히브리어의 명사문과 인명·지명 표기를 더 정확하고 자연스럽게 다듬을 필요가 있습니다.
  naturalness: ‘이것은 … 이들입니다’는 지시 대상과 서술어의 호응이 어색하고, 대시 뒤의 독립절 및 ‘와, 그의 도시 이름은’의 연결도 현대 한국어 문장으로 부자연스럽습니다. 목록 도입 문장과 벨라에 관한 명사문을 매끄럽게 연결했습니다.
  terminology: 왕의 통치는 ‘다스리다’로 유지했습니다. בְּעוֹר는 ‘브올’, דִּנְהָבָה는 히브리어 음가를 반영해 ‘디나하바’로 옮겼습니다. עִיר는 현대 독자에게 자연스러운 ‘도시’ 대신 성서의 정주지를 가리키는 ‘성읍’을 사용하되, 문체는 합쇼체로 유지했습니다.
