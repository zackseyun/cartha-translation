translation:
  language: ko
  text: 아나의 아들은 디손입니다. 그리고 디손의 아들은 함란[a], 에스반, 이드란, 그리고 그란입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 36:26의 평행 족보에는 ‘헴단’이 나옵니다. 본문은 여기서 마소라 본문의 ‘함란’을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  - 후손
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 남성 계열을 가리키는 기본 표현이므로, 본문 구조를 가장 직접적으로 살려 ‘아들’로 옮겼습니다.
- source_word: עֲנָה
  english_pob_choice: Anah
  chosen_korean: 아나
  alternatives_korean:
  - 아낙
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사를 표준 음역에 따라 ‘아나’로 옮겼습니다.
- source_word: דִּישׁוֹן
  english_pob_choice: Dishon
  chosen_korean: 디손
  alternatives_korean:
  - 디숀
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사를 음역하여 동일 인물명을 두 절에 걸쳐 일관되게 ‘디손’으로 유지했습니다.
- source_word: חַמְרָן
  english_pob_choice: Hamran
  chosen_korean: 함란
  alternatives_korean:
  - 헴단
  lexicon: 고유명사 표기
  rationale: 본문의 마소라 본문을 따라 חַמְרָן을 음역해 ‘함란’으로 옮겼습니다. 창세기 36:26의 평행형 ‘헴단’은 본문이 아니라 각주로 처리하는 것이 적절합니다.
- source_word: יִתְרָן
  english_pob_choice: Ithran
  chosen_korean: 이드란
  alternatives_korean:
  - 이트란
  - 예드란
  lexicon: 고유명사 표기
  rationale: 자음열을 반영해 고유명사를 음역했으며, 영어식 관행형보다 원문 형태에 더 가깝게 ‘이드란’으로 잡았습니다.
- source_word: כְרָן
  english_pob_choice: Keran
  chosen_korean: 그란
  alternatives_korean:
  - 케란
  lexicon: 고유명사 표기
  rationale: 자음열을 따라 음역하되, 같은 족보 항목들 사이에서 지나친 영어식 표기를 피하고 원문 기반으로 ‘그란’으로 옮겼습니다.
