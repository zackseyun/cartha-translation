language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִשְׁמָ֣ע וְ/דוּמָ֔ה מַשָּׂ֖א חֲדַ֥ד וְ/תֵימָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/030.yaml
  text: Mishma[a], Dumah, Massa, Hadad, and Tema.
  footnotes:
  - marker: a
    text: Genesis 25:15 has 'Hadar' in the parallel list; 1 Chronicles reads 'Hadad.'
    reason: textual_variant
translation:
  language: ko
  text: 미스마, 두마, 맛사, 하닷, 그리고 데마입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 25:15의 평행 족보에는 ‘하다르’가 나오며, 역대기 본문은 ‘하닷’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מִשְׁמָע
  english_pob_choice: Mishma
  chosen_korean: 미스마
  alternatives_korean:
  - 미슈마
  - 미쉬마
  lexicon: 고유명사
  rationale: 족보의 인명으로 보아 음역하는 것이 맞으며, 영어 POB의 Mishma에 맞춰 표준적인 음역을 사용했습니다.
- source_word: וְ/דוּמָה
  english_pob_choice: and Dumah
  chosen_korean: 두마
  alternatives_korean:
  - 그리고 두마
  - 두마와
  lexicon: 고유명사
  rationale: דוּמָה는 고유명사이므로 음역하고, 목록의 접속은 한국어에서 쉼표와 병렬 구조로 자연스럽게 드러냈습니다.
- source_word: מַשָּׂא
  english_pob_choice: Massa
  chosen_korean: 맛사
  alternatives_korean:
  - 마사
  - 마싸
  lexicon: 고유명사
  rationale: 문맥상 ‘짐/부담’이 아니라 족보 항목의 이름이므로 음역했습니다. 영어 POB의 Massa를 반영해 단순한 음역형을 택했습니다.
- source_word: חֲדַד
  english_pob_choice: Hadad
  chosen_korean: 하닷
  alternatives_korean:
  - 하다드
  lexicon: 고유명사
  rationale: 족보의 인명으로 음역했습니다. 영어 POB가 지적한 대로 창세기 평행구는 Hadar이지만, 역대기의 본문 읽기 Hadad를 따릅니다.
- source_word: וְ/תֵימָא
  english_pob_choice: and Tema
  chosen_korean: 데마
  alternatives_korean:
  - 그리고 데마
  lexicon: 고유명사
  rationale: תֵימָא는 고유명사이므로 음역했습니다. 마지막 항목의 병렬 목록 구조를 한국어에서도 간결하게 살렸습니다.
theological_decisions:
- issue: 족보 목록의 번역 방식
  chosen_reading: 의미 번역보다 음역을 유지해 인명 목록의 계보적 기능을 드러냈습니다.
  alternative_readings:
  - 미스마를 다른 뜻으로 풀어 번역하기
  - 현대 독자 친화적으로 이름 일부를 의역하기
  rationale: 본문은 인물들의 계보를 열거하는 장르이므로, 이름을 번역하지 않고 보존하는 것이 저자의 의도와 독자의 추적 가능성을 가장 잘 지킵니다.
  doctrine_reference: 성경 본문 보존과 계보 본문의 역사성
- issue: Hadad / Hadar 본문 차이
  chosen_reading: 본문의 하닷을 본문 읽기로 두고, 평행 본문의 차이는 주석으로 처리하지 않았습니다.
  alternative_readings:
  - 창세기 25:15의 하닷/하다르 변이를 본문에 반영하기
  - 중립적으로 하다르로 맞추기
  rationale: 역대기 본문의 마소라 본문이 Hadad이므로, 본문 자체를 우선하고 평행 본문 변이는 영어 POB의 사역 원칙을 따라 별도 주석 없이 유지했습니다.
  doctrine_reference: 본문 비평과 정경 내 평행본문 처리
