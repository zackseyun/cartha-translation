  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
  footnotes:
  - marker: a
    text: Or "after him." The Hebrew expression literally means "under/in place of him" and marks royal succession.
    reason: lexical_alternative
translation:
  language: ko
  text: 하닷이 죽었고, 그의 뒤를 이어 마스레가 출신의 삼라가 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 뒤를 이어’는 히브리어가 문자적으로는 ‘그의 아래/자리에’라는 뜻으로 왕위 계승을 나타내는 관용구입니다.
    reason: lexical_alternative
