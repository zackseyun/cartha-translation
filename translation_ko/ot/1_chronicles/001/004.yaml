  - 노아
  lexicon: HALOT
  rationale: 고유명사는 의미 번역이 아니라 표준 음역으로 처리하는 것이 족보 목록의 형식에 가장 잘 맞습니다.
- source_word: שֵׁם
  english_pob_choice: Shem
  chosen_korean: 셈
  alternatives_korean:
  - 셈
  lexicon: HALOT
  rationale: 문맥상 ‘이름’이 아니라 인명이며, 족보에서는 통상적 음역을 유지하는 것이 소스 구조를 가장 직접적으로 반영합니다.
- source_word: חָם
  english_pob_choice: Ham
  chosen_korean: 함
  alternatives_korean:
  - 함
  lexicon: HALOT
  rationale: 고유명사로서 표준 음역을 사용했습니다.
- source_word: וָ/יָפֶת
  english_pob_choice: and Japheth
  chosen_korean: 그리고 야벳
  alternatives_korean:
  - 야벳
  lexicon: HALOT
  rationale: 히브리어 접속사 ו를 분명히 드러내기 위해 ‘그리고’를 살렸고, יפת는 통용 음역인 ‘야벳’으로 옮겼습니다.
