base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
  footnotes:
  - marker: a
    text: Literally, 'from there the Philistines came out.' The Hebrew most naturally links this clause to the Casluhites here in Chronicles, though Genesis 10:14 has the same wording and the broader tradition also associates the Philistines with Caphtor (cf. Amos 9:7; Jeremiah 47:4).
    reason: cross_reference
translation:
  language: ko
  text: 그리고 바드루스 사람들과, 가슬루 사람들—그들로부터 블레셋 사람들이 나왔으며—그리고 갑도르 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그곳에서 블레셋 사람들이 나왔다’입니다. 역대상에서는 이 절이 가장 자연스럽게 여기의 가슬루 사람들과 연결되지만, 창세기 10:14의 같은 표현 및 더 넓은 전승은 블레셋과 갑도르의 연관도 함께 보여 줍니다.
    reason: cross_reference
lexical_decisions:
- source_word: פַּתְרֻסִים
  english_pob_choice: Pathrusites
  chosen_korean: 바드루스 사람들
  alternatives_korean:
  - 파트루스 사람들
  - 파트루시스 사람들
  lexicon: 고유명사 음역
  rationale: 히브리어 지명/족속명 פַּתְרֻסִים을 한국어 음역으로 옮기되, 고유명사 관행에 맞춰 종족명임을 드러내기 위해 ‘사람들’을 붙였습니다.
- source_word: כַּסְלֻחִים
  english_pob_choice: Casluhites
  chosen_korean: 가슬루 사람들
  alternatives_korean:
  - 카슬루 사람들
  - 가슬루히 사람들
  lexicon: 고유명사 음역
  rationale: 족속명 כַּסְלֻחִים은 의미를 풀기보다 음역으로 보존하는 것이 원문 정보에 충실하므로, 한국어 음가에 맞게 음역했습니다.
- source_word: מִשָּׁם
  english_pob_choice: from whom ... came
  chosen_korean: 그들로부터 … 나왔으며
  alternatives_korean:
  - 거기서 … 나왔으며
  - 그곳에서 … 나왔으며
  lexicon: HALOT
  rationale: 문자적으로는 ‘거기서’이지만, 족보 문맥에서는 바로 앞 족속에서 기원했음을 뜻하므로 한국어에서는 인과·기원 관계가 드러나도록 ‘그들로부터’로 옮겼습니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 필리스티아 사람들
  - 블레셋 족속
  lexicon: 고유명사 전통형
  rationale: פְּלִשְׁתִּים은 한국어 성경에서 널리 알려진 전통형 ‘블레셋 사람들’이 의미 전달과 가독성에 가장 적절합니다.
- source_word: כַּפְתֹּרִים
  english_pob_choice: Caphtorites
  chosen_korean: 갑도르 사람들
  alternatives_korean:
  - 갑돌 사람들
  - 카프트르 사람들
  lexicon: 고유명사 음역
  rationale: כַּפְתֹּרִים은 지명 카프토르와 연관된 족속명이므로, 한국어 음역으로 처리해 고유명사성을 유지했습니다.
theological_decisions:
- issue: 족보 목록에서 관계절의 연결 방식
  chosen_reading: ‘가슬루 사람들—그들로부터 블레셋 사람들이 나왔으며—’로 묶어, 관계절이 바로 앞 족속을 가리키는 본문 흐름을 드러냈습니다.
  alternative_readings:
  - ‘가슬루 사람들(그곳에서 블레셋 사람들이 나왔으며)’
  - ‘가슬루 사람들과, 블레셋 사람들이 거기서 나왔고, 그리고 갑도르 사람들’
  rationale: 역대상 본문은 창세기 10:14와 같은 표현을 공유하지만, 여기서는 가장 자연스럽게 가슬루 사람들에게 연결됩니다. 본문이 유지하는 족보적 기원을 흐리지 않도록 한국어에서도 그 연결을 명시했습니다.
  doctrine_reference: 본문비평/상호본문성
