  source_fidelity: 히브리어 מִשָּׁם은 ‘그곳에서/거기서’라는 장소 부사입니다. 문맥상 가슬루 사람들과 관련된 기원으로 이해될 수 있으나, 본문은 ‘그들로부터’라고 직접 말하지 않습니다. 따라서 본문에는 공간적 표현을 보존하고, 그 연결 문제는 각주에서 설명하는 것이 원문과 영어 POB 감사 기록에 더 충실합니다.
  naturalness: 현 초안의 대시 삽입과 문장 끝의 ‘입니다’는 족보 열거 문맥에서 다소 부자연스럽습니다. 괄호로 관계절을 처리하고 ‘...과 ...과 ...입니다’로 열거를 정리하면 현대 한국어 합쇼체에 자연스럽습니다.
  terminology: ‘블레셋 사람들’은 적절합니다. ‘바드루스/가슬루/갑도르’는 히브리어 자음에 가까운 음역으로 허용되며, 족속명임을 위해 ‘사람들’을 붙인 방식도 일관됩니다. 다만 ‘그들로부터’는 용어 문제가 아니라 원문의 장소 표현을 혈통 관계로 확정하는 해석적 번역입니다.
