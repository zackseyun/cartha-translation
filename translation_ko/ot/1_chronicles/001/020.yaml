base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/020.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
  footnotes:
  - marker: a
    text: Or 'became the father of'; traditionally, 'begot.'
    reason: lexical_alternative
translation:
  language: ko
  text: 욕단은 알모닷과 셀렙과 하살마웻과 예라를 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָקְטָן
  english_pob_choice: Joktan
  chosen_korean: 요ктан
  alternatives_korean:
  - 욕단
  lexicon: HALOT
  rationale: 고유명사이므로 음역하는 것이 적절하며, 기존 영어 성경의 Joktan에 대응하는 표준적인 한국어 표기는 욕단입니다.
- source_word: יָלַד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생겨나게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 יָלַד는 출생/혈통 관계를 표시하므로, 한국어에서는 간결하고 자연스러운 ‘낳았습니다’가 적합합니다.
- source_word: אַלְמוֹדָד
  english_pob_choice: Almodad
  chosen_korean: 알모닷
  alternatives_korean:
  - 알모다드
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 음가와 관용적 성경 표기 가능성을 고려하면 알모닷이 더 간결합니다.
- source_word: שָׁלֶף
  english_pob_choice: Sheleph
  chosen_korean: 세렙
  alternatives_korean:
  - 셀레프
  - 셜렙
  lexicon: HALOT
  rationale: 고유명사 음역으로 처리하며, 히브리어 자음과 모음을 한국어로 자연스럽게 옮기면 세렙이 무난합니다.
- source_word: חֲצַרְמָוֶת
  english_pob_choice: Hazarmaveth
  chosen_korean: 하사르마웻
  alternatives_korean:
  - 하살마웻
  - 하살르마벳
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 히브리어 자음군과 어말 어감을 살려 하사르마웻으로 옮깁니다.
- source_word: יָרַח
  english_pob_choice: Jerah
  chosen_korean: 야라
  alternatives_korean:
  - 예라
  - 여라
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 영어 관용형 Jerah를 한국어로 옮길 때는 야라가 가장 자연스럽습니다.
