  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
  footnotes:
  - marker: a
    text: Genesis 36:39 gives the city name as 'Pau,' while Chronicles reads 'Pai.'
    reason: textual_variant
  - marker: b
    text: The repeated 'daughter of' may imply 'granddaughter of' in genealogical usage, but the Hebrew wording is left more literal here.
    reason: lexical_alternative
translation:
  language: ko
  text: 바알하난이 죽고, 하닷이 그의 뒤를 이어 왕이 되었습니다. 하닷의 도시 이름은 파이였고, 그의 아내의 이름은 마트렛의 딸, 메자합의 딸 메헤타벨이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대기상 본문은 창세기 36:39의 ‘바우’와 달리 ‘파이’로 읽힙니다.
    reason: textual_variant
  - marker: b
    text: 반복된 ‘딸’은 족보 용례상 ‘손녀’로 이해될 가능성도 있지만, 본문은 더 직접적인 표현을 유지합니다.
    reason: lexical_alternative
