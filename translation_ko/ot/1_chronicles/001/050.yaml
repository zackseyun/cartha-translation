  rationale: 본문은 신학적 논증보다 계보 기록이므로, 과장 없이 정보 전달을 우선하는 것이 원문 기능에 맞습니다.
  doctrine_reference: 역대상 족보 서술의 역사-기록 장르
- issue: בַּת의 반복
  chosen_reading: ‘딸’ 표현을 그대로 유지해 반복된 계보 형식을 보존했습니다.
  alternative_readings:
  - ‘손녀’로 해석하여 정리
