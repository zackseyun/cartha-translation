base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
  footnotes:
  - marker: a
    text: Genesis 36:39 gives the city name as 'Pau,' while Chronicles reads 'Pai.'
    reason: textual_variant
  - marker: b
    text: The repeated 'daughter of' may imply 'granddaughter of' in genealogical usage, but the Hebrew wording is left more literal here.
    reason: lexical_alternative
translation:
  language: ko
  text: 바알하난이 죽고 그의 자리에 하닷이 왕이 되었습니다. 그의 도시 이름은 파이였고, 그의 아내의 이름은 마트렛의 딸, 메사합의 딸 메헤타벨이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 크로니클스의 본문은 창세기 36:39의 ‘바우’와 달리 ‘파이’로 읽힙니다.
    reason: textual_variant
  - marker: b
    text: 반복된 ‘딸’은 족보 용례상 ‘손녀’로 이해될 가능성도 있지만, 본문은 더 직접적인 표현을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 죽었고
  lexicon: HALOT
  rationale: 서술의 연속성을 살리기 위해 진행형 연결어미로 처리했습니다. 영어 POB의 단순한 ‘died’를 반영하되, 왕위 계승 서술에 자연스럽게 연결됩니다.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 자리에 하닷이 왕이 되었습니다
  alternatives_korean:
  - 그의 자리에 통치했습니다
  - 그를 대신하여 다스렸습니다
  lexicon: HALOT
  rationale: מלך의 왕위 계승 의미를 살려 ‘왕이 되었습니다’로 옮겼고, תחתיו는 직역적이면서도 자연한 ‘그의 자리에’로 처리했습니다.
- source_word: וְשֵׁם עִירוֹ פָּעִי
  english_pob_choice: The name of his city was Pai
  chosen_korean: 그의 도시 이름은 파이였고
  alternatives_korean:
  - 그의 성읍 이름은 파이였고
  - 그 도시의 이름은 파이였고
  lexicon: HALOT
  rationale: 성읍/도시 가운데 본문은 일반적으로 이해 가능한 ‘도시’로 옮겼고, 이름 제시 형식을 유지했습니다.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  english_pob_choice: daughter of Matred, daughter of Mezahab
  chosen_korean: 마트렛의 딸, 메사합의 딸 메헤타벨
  alternatives_korean:
  - 마트렛의 딸이며 메사합의 손녀인 메헤타벨
  - 마트렛의 딸, 메사합의 손녀 메헤타벨
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘딸’ 표현을 본문 수준에서는 그대로 유지해 계보 형식을 보존했습니다. 두 번째 관계가 ‘손녀’일 가능성은 있으나, 본문 자체는 더 직접적으로 ‘딸’을 말합니다.
- source_word: מֵי זָהָב
  english_pob_choice: Mezahab
  chosen_korean: 메사합
  alternatives_korean:
  - 메자합
  - 메자하브
  lexicon: HALOT
  rationale: 족보 고유명사는 음역을 택했고, 한국어 표기는 읽기 쉬운 표준 음가로 정리했습니다.
theological_decisions:
- issue: 족보·왕위 계승 공식의 문체
  chosen_reading: 사실 서술형으로 평이하게 옮겨 계보적 연속성과 왕위 승계의 흐름을 드러냈습니다.
  alternative_readings:
