  - 히위족
  lexicon: HALOT
  rationale: 문맥상 족속/민족을 가리키므로 영어 POB의 복수 집합 의미를 따라 ‘사람들’로 풀었습니다.
- source_word: הָעַרְקִי
  english_pob_choice: the Arkites
  chosen_korean: 아르키 사람들
  alternatives_korean:
  - 아르키인들
  - 아르키족
  lexicon: HALOT
  rationale: 고유한 집단명으로 보고 음역을 유지하되, 집합적 의미는 ‘사람들’로 나타냈습니다.
- source_word: הַסִּינִי
  english_pob_choice: the Sinites
  chosen_korean: 시니 사람들
  alternatives_korean:
  - 시니인들
  - 시니족
  lexicon: HALOT
  rationale: 계보 목록의 민족명으로 이해하여, 영어 POB의 복수형 처리에 맞춰 집단성을 드러냈습니다.
theological_decisions:
- issue: 족속명에 대한 한국어 집합 명칭 처리
  chosen_reading: 개별 인물명이 아니라 민족/부족 집단을 가리키므로 ‘사람들’로 번역했습니다.
  alternative_readings:
