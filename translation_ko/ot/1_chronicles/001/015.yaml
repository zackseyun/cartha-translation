  rationale: 고유한 집단명으로 보고 음역을 유지하되, 집합적 의미는 ‘사람들’로 나타냈습니다.
- source_word: הַסִּינִי
  english_pob_choice: the Sinites
  chosen_korean: 시니 사람들
