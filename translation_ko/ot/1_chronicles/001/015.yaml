translation:
  language: ko
  text: 그리고 히위 사람들과 아르키 사람들과 시니 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 히브리어는 정관사와 함께 단수의 족속형을 쓰지만, 족보적 문맥에서는 민족이나 부족 집단을 가리키므로 한국어에서는 복수 집합 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  lexicon: HALOT
  rationale: 연결 접속사 ו를 자연스러운 한국어 연결어 ‘그리고’로 옮기고, 직접목적어 표지는 한국어에서 따로 표시하지 않았습니다.
