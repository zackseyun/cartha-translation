    reason: lexical_alternative
  - marker: c
    text: 히브리어 형태를 더 엄밀히 옮기면 Jared보다 Yered에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵינָן
  english_pob_choice: Kenan
  chosen_korean: 게난
  alternatives_korean:
  - 가이난
  - 카이난
  lexicon: HNp
  rationale: 히브리어 고유명사를 음역하되, 영어 POB의 Kenan에 대응하는 간결한 현대 한국어 표기를 택했습니다. 그리스어·라틴어 영향형을 따르기보다 히브리어 자음군을 반영하는 음가를 우선했습니다.
- source_word: מַהֲלַלְאֵל
  english_pob_choice: Mahalalel
  chosen_korean: 마할랄엘
  alternatives_korean:
  - 마할랄엘
  - 마할라렐
  lexicon: HNp
  rationale: 고유명사이므로 번역하지 않고 음역했습니다. 영어 전통형보다 히브리어 형태를 더 직접적으로 보이게 하는 표기를 선택했습니다.
- source_word: יָרֶד
  english_pob_choice: Jared
  chosen_korean: 야렛
  alternatives_korean:
  - 자렛
  - 예렛
  lexicon: HNp
  rationale: 영어 관습형 Jared보다 히브리어 יָרֶד의 자음과 모음값을 더 가깝게 반영하는 음역을 택했습니다. 본문은 이름의 뜻을 풀이하지 않고 족보 명단을 그대로 전달합니다.
theological_decisions:
- issue: 족보 이름들의 표기 원칙
  chosen_reading: 이 절은 인물 이름의 연속을 간결하게 제시하는 족보이므로, 의미 번역 없이 음역을 유지했습니다.
  alternative_readings:
  - 이름 뜻을 살린 번역
  - 영어 전통형을 그대로 따르는 표기
  rationale: 원문은 서술이 아니라 족보 항목 나열이며, 독자가 인물 계보를 추적하는 것이 핵심이므로 음역이 가장 충실합니다.
  doctrine_reference: 성경 족보의 역사적·문헌적 기능
