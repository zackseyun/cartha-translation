translation:
  language: ko
  text: 야완의 아들들은 엘리사와 다시스와 깃딤과 로다님입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 10:4에는 ‘로다님’ 대신 ‘도다님’이 나옵니다. 이는 이 이름의 본문 이문을 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥의 기본 표현을 따르되, 현대 한국어에서는 서술적으로 자연스러운 복수 주어 형태로 옮겼습니다.
- source_word: יָוָן
  english_pob_choice: Javan
  chosen_korean: 야완
  alternatives_korean:
  - 야반
  - 이오니아
  lexicon: HALOT
  rationale: 고유명사로 음역하되, 히브리어 יָוָן의 한국어 음가를 반영해 야완으로 옮겼습니다.
- source_word: כִּתִּים
  english_pob_choice: Kittim
  chosen_korean: 깃딤
  alternatives_korean:
  - 키팀
  - 깃팀
  lexicon: HALOT
  rationale: כ의 음가를 살리면서도 전통 음역과 현대 표기를 절충해 깃딤으로 옮겼습니다.
- source_word: וְרוֹדָנִים
  english_pob_choice: and Rodanim
  chosen_korean: 로다님
  alternatives_korean:
  - 도다님
  lexicon: HALOT
  rationale: 열왕기상/창세기의 평행형과 다른 역대기의 본문형을 따라 로다님으로 두고, 다른 전승은 각주로 처리했습니다.
theological_decisions:
- issue: 본문상 이름 형태 변이(로다님 vs. 도다님)를 어떻게 처리할지
  chosen_reading: 본문은 역대기 본문의 로다님을 따르고, 창세기 10:4의 도다님은 각주로 제시합니다.
  alternative_readings:
  - 도다님을 본문에 반영
  - 변이 언급 없이 단일 표기
  rationale: 제시된 본문이 역대기이므로 MT의 읽기인 로다님을 유지해야 하며, 평행 본문과의 차이는 독자가 확인할 수 있도록 각주로 남기는 것이 적절합니다.
  doctrine_reference: 본문비평 / 평행본문 처리
- issue: 족보의 בני를 혈연적 '아들들'로 번역할지, 보다 넓은 '자손들'로 번역할지
  chosen_reading: 문맥상 족보 공식이므로 '아들들'을 유지합니다.
  alternative_readings:
  - 자손들
  - 후손들
  rationale: 이 구절은 민족/지파의 기원을 나열하는 족보 형식이어서, 넓은 의미를 담더라도 기본 표지인 '아들들'을 보존하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 족보 문체 / 문학 형식
