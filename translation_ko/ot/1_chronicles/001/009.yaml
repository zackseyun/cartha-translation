id: 1CH.1.9
reference: 1 Chronicles 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַ/חֲוִילָ֔ה וְ/סַבְתָּ֥א וְ/רַעְמָ֖א וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖א שְׁבָ֥א וּ/דְדָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
  footnotes:
  - marker: a
    text: Sabta is traditionally rendered 'Sabtah.'
    reason: lexical_alternative
  - marker: b
    text: Raama is traditionally rendered 'Raamah'; some English readers may also think of the distinct name 'Ramah.'
    reason: lexical_alternative
  - marker: c
    text: Sabteca is traditionally rendered 'Sabtechah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구스의 아들들은 세바, 하윌라, 삽다, 라아마, 삽드가였습니다. 라아마의 아들들은 스바와 드단이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 자손들
  - ~의 후손들
  lexicon: HALOT
  rationale: 족보 공식에서 בְּנֵי는 직계 아들뿐 아니라 후손을 가리킬 수 있지만, 본문 구조를 가장 직접적으로 살리기 위해 ‘아들들’로 옮겼습니다.
- source_word: סְבָא
  english_pob_choice: Seba
  chosen_korean: 세바
  alternatives_korean:
  - 스바
  lexicon: HALOT
  rationale: 고유명사로서 음역하되, 한국어 음역 관행에 맞게 ‘세바’로 옮겼습니다.
- source_word: סַבְתָּא
  english_pob_choice: Sabta
  chosen_korean: 삽다
  alternatives_korean:
  - 삽타
  lexicon: HALOT
  rationale: 영어 본문이 ‘Sabta’를 택한 점을 반영해 최종 -h를 덧붙이지 않고 음가에 맞게 옮겼습니다. 전통적 대안 ‘Sabtah’에 해당하는 표기는 주석 없이 본문만 유지했습니다.
- source_word: רַעְמָא
  english_pob_choice: Raama
  chosen_korean: 라아마
  alternatives_korean:
  - 라마
  - 라아마
  lexicon: HALOT
  rationale: 족보 고유명사를 음역했습니다. 전통적 ‘Raamah’와 구별되도록, 영어 POB의 선택을 반영해 ‘라아마’로 옮겼습니다.
- source_word: סַבְתְּכָא
  english_pob_choice: Sabteca
  chosen_korean: 삽드가
  alternatives_korean:
  - 삽데가
  - 삽테가
  lexicon: HALOT
  rationale: 영어 본문의 ‘Sabteca’에 해당하는 히브리어 자음 배열을 한국어 음역으로 반영했습니다. 전통적 영어 형태와의 차이는 본문 의미를 바꾸지 않으므로 별도 주석 없이 처리했습니다.
- source_word: שְׁבָא
  english_pob_choice: Sheba
  chosen_korean: 스바
  alternatives_korean:
  - 세바
  lexicon: HALOT
  rationale: 동일 철자의 다른 이름들과 혼동을 피하면서도, 한국어 성경에서 널리 쓰이는 음역 관행에 맞게 옮겼습니다.
- source_word: דְדָן
  english_pob_choice: Dedan
  chosen_korean: 드단
  alternatives_korean:
  - 데단
  lexicon: HALOT
  rationale: 고유명사를 음역했습니다. 히브리어 자음 구조를 충실히 반영하는 쪽으로 옮겼습니다.
