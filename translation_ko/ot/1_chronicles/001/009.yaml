  source_fidelity: 히브리어 본문의 두 족보 표지(‘구스의 아들들’, ‘라아마의 아들들’)와 다섯 이름 및 라아마의 두 아들을 빠짐없이 충실하게 옮겼습니다. 첫 목록의 세바(סבא)와 둘째 목록의 스바(שבא)를 한국어에서 구별한 것은 원문의 자음 차이를 보존하며, 영어 POB의 Seba/Sheba 구별과도 부합합니다.
  naturalness: ‘구스의 아들들은 …였습니다. 라아마의 아들들은 …이었습니다.’는 족보 목록에 자연스럽고 현대 표준어 합쇼체 문체에도 맞습니다.
  terminology: 구스, 하윌라, 삽다, 라아마, 삽드가, 드단 등의 음역은 일관되고 적절합니다. ‘아들들’은 원문의 בְּנֵי를 직접적으로 반영하며, 족보 문맥에서 허용되는 표현입니다.
