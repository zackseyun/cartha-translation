lexical_decisions:
- source_word: וּ/כְנַעַן
  english_pob_choice: And Canaan
  chosen_korean: 그리고 가나안
  alternatives_korean:
  - 가나안은
  - 그런데 가나안은
  lexicon: HALOT
  rationale: 계보 문맥의 연결 접속을 살리면서 고유명사 가나안을 표준 표기로 옮겼습니다.
- source_word: יָלַד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 출생시켰습니다
  lexicon: HALOT
  rationale: 남성 주어가 계보 안에서 자손을 두는 뜻이므로, 현대 한국어에서 자연스럽고 직설적인 ‘낳다’를 사용했습니다.
- source_word: בְּכֹר/וֹ
  english_pob_choice: his firstborn
  chosen_korean: 맏아들
