  text: וַ/יָּ֖מָת בָּ֑לַע וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו יוֹבָ֥ב בֶּן זֶ֖רַח מִ/בָּצְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
  footnotes:
  - marker: a
    text: Or "of Bozrah." The Hebrew preposition can mark origin or association with the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 벨라가 죽고[a], 세라의 아들 요밥이 보스라에서 그의 뒤를 이어 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보스라의’입니다. 히브리어 전치사 מִ는 출신이나 그 도시와의 연관을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 죽었고
  lexicon: HALOT
  rationale: 연속되는 사건을 나타내는 wayyiqtol을 한국어 서술문에서는 자연스럽게 연결하여 ‘죽고’로 옮겼습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕이 되었습니다
  - 즉위했습니다
  lexicon: HALOT
  rationale: 왕위 승계 공식에서 מלך의 핵심은 통치/왕권 행사이므로, 짧고 자연스러운 서술인 ‘다스렸습니다’로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그 자리를 대신하여
  - 그를 대신하여
  - 그의 자리에
  lexicon: HALOT
  rationale: 승계 문맥에서 תחת+대명사는 단순한 위치가 아니라 전임자의 자리를 이어받는 뜻이므로, 한국어 승계 표현으로 풀어 옮겼습니다.
- source_word: מִבָּצְרָה
  english_pob_choice: from Bozrah
  chosen_korean: 보스라에서
  alternatives_korean:
  - 보스라 사람인
  - 보스라 출신으로
  - 보스라의
  lexicon: HALOT
  rationale: מִן은 출신지나 연고를 나타낼 수 있어, 기본값인 ‘에서’로 옮기되 지명 연관 가능성을 주석으로 남겼습니다.
theological_decisions:
- issue: 왕위 승계 공식의 의미 보존
  chosen_reading: ‘그의 뒤를 이어 다스렸습니다’로 승계와 통치 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘그를 대신하여 왕이 되었습니다’
  - ‘그 자리를 이어 통치했습니다’
  rationale: 히브리어 왕정 서술의 간결한 공식성을 유지하면서도, 단순한 교체가 아니라 실제 통치 개시를 나타내도록 했습니다.
  doctrine_reference: 역대기 왕조 서술의 역사적-서술적 문맥
