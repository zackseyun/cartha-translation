  terminology: 인명 ‘벨라’, ‘요밥’, ‘세라’와 지명 ‘보스라’는 적절합니다. 왕위 계승 문맥에서는 ‘왕이 되었습니다’가 מלך의 왕권 취득을 더 정확히 나타냅니다.
