  source_fidelity: 전반적인 사건 순서와 왕위 승계의 의미는 잘 반영했습니다. 그러나 וַיִּמְלֹךְ는 이 왕위 계승 공식에서 단순히 ‘다스리다’보다 ‘왕이 되다/왕으로 다스리기 시작하다’를 분명히 하는 편이 적절합니다. 또한 מִבָּצְרָה의 출신·연고 의미를 ‘보스라 출신’으로 직접 드러낼 수 있습니다.
