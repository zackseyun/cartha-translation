translation:
  language: ko
  text: 에셀의 아들들은 빌한, 사아완[a], 야아간[b]이며, 디손의 아들들은 우스와 아란입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 ‘사아완’으로 되어 있으나, 창세기 36:27의 병행 족보에는 ‘사완’으로 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문에는 ‘야아간’으로 되어 있으나, 창세기 36:27의 병행 족보에는 ‘아간’으로 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 표지로 기능하므로, 가장 직접적인 대응인 ‘아들들’로 옮겨 계보의 구조를 분명히 했습니다.
- source_word: זַעֲוָן
  english_pob_choice: Zaavan
  chosen_korean: 자완
  alternatives_korean:
  - 자아반
  - 자아완
  lexicon: 고유명사 음역
  rationale: 히브리어 자음과 모음 구조를 반영한 음역으로 처리했고, 영어 POB의 대안 표기 Zavan에 해당하는 이름형도 함께 고려할 수 있도록 했습니다.
- source_word: יַעֲקָן
  english_pob_choice: Jaakan
  chosen_korean: 야간
  alternatives_korean:
  - 야아칸
  - 아간
  lexicon: 고유명사 음역
  rationale: 역대기의 히브리어 형태를 따라 음역했으며, 창세기 병행구의 Akan이라는 대안형과의 차이를 보존했습니다.
- source_word: עוּץ
  english_pob_choice: Uz
  chosen_korean: 우스
  alternatives_korean:
  - 우즈
  lexicon: 고유명사 음역
  rationale: 한국어 성경 전통에서 널리 쓰이는 ‘우스’를 유지해 인지 가능성을 높이면서도 히브리어 עוּץ의 표기를 반영했습니다.
theological_decisions:
- issue: 족보 구문에서 'sons of'를 어떻게 처리할지
  chosen_reading: 문맥상 직계 혈연 표지로 읽고 ‘아들들’로 직역했습니다.
  alternative_readings:
  - ‘자손들’로 넓게 이해하는 번역
  rationale: 이 절은 역사 서술 내 족보 항목이므로, 직계 목록 구조를 흐리지 않는 표현이 가장 자연스럽고 원문 충실합니다.
  doctrine_reference: 역대상 1장 족보 문맥
