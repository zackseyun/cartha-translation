base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
  footnotes:
  - marker: a
    text: Hebrew Zaavan; the parallel genealogy in Genesis 36:27 reads Zavan.
    reason: alternative_reading
  - marker: b
    text: Hebrew Jaakan; the parallel genealogy in Genesis 36:27 reads Akan.
