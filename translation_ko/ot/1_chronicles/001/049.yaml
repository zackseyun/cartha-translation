    text: 인명은 히브리어 이름을 음역한 것입니다. ‘아크볼’은 전통적 한국어 성경에서 ‘악볼’로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 세상을 떠나고
  lexicon: HALOT
  rationale: 서사적 왕위 계승 공식에서 단순한 죽음을 평이하게 알리는 동사로 옮겼습니다. 문장 연결을 위해 연결형 ‘-고’를 사용했습니다.
- source_word: שָׁאוּל
  english_pob_choice: Shaul
  chosen_korean: 사울
  alternatives_korean:
  - 샤울
  lexicon: HALOT
  rationale: 이름의 전통적 한국어 성경형인 ‘사울’을 사용하되, 히브리어 שָׁאוּל의 통상적인 한국어 음역 관례를 따랐습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 자리에
  alternatives_korean:
  - 그를 대신하여
  - 그의 대신에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 왕위 승계 문맥에서 תַּחַת+대명사는 ‘대신/자리에’의 교체 의미를 가지므로, 자연스러운 현대 한국어로 ‘그의 자리에’라고 옮겼습니다.
- source_word: בֶּן עַכְבּוֹר
  english_pob_choice: son of Akbor
  chosen_korean: 아크볼의 아들
  alternatives_korean:
  - 악볼의 아들
  - 아크보르의 아들
  lexicon: HALOT
  rationale: 계보 문맥의 בֶּן은 직계 관계를 뜻하므로 ‘아들’을 유지했습니다. 이름은 영어 POB의 ‘Akbor’에 맞춰 ‘아크볼’로 음역했습니다.
