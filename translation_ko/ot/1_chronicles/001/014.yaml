  terminology: 여부스, 아모리, 기르가스는 한국어 성서 용례와 히브리어 음가에 부합하는 민족명입니다. ‘사람들’은 히브리어의 형태상 단수 민족형이 집합적으로 쓰인 의미를 자연스럽게 반영합니다.
