  - severity: medium
    issue: 원문에 없는 종결 서술어 ‘입니다’
    rationale: 이 절은 앞 절의 ‘가나안이 낳은’ 목록을 계속하는 목적어 열거입니다. ‘입니다’를 넣으면 독립적인 계사 문장이 되어 원문의 구문 관계를 흐립니다.
  - severity: low
    issue: 각 민족을 포괄하는 각주 표현의 단수성
    rationale: 각주는 세 단수 민족형 각각의 집합적 용법을 설명하므로 ‘한 민족 집단’보다 ‘각 민족 집단’이라고 하는 편이 정확합니다.
