  source_fidelity: 본문은 엘리바스의 아들들을 열거하며, 딤나와 아말렉도 같은 목록에 포함합니다. 이 구조를 유지해야 합니다. 다만 한국어 성경 인명 표기 관례와 각주 표지의 대상이 바로잡힐 필요가 있습니다.
  naturalness: ‘…입니다’는 현대 합쇼체로 자연스럽습니다. 쉼표로 연결한 족보식 열거도 자연스럽습니다.
