id: 1CH.1.36
reference: 1 Chronicles 1:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
  footnotes:
  - marker: a
    text: Genesis 36:12 identifies Timna as Eliphaz's concubine and Amalek as her son. Here Chronicles presents both names within the list of Eliphaz's sons.
    reason: cross_reference
  - marker: b
    text: Hebrew Zephi; Genesis 36:11 has the variant form Zepho.
    reason: textual_variant
translation:
  language: ko
  text: 엘리바스의 아들들은 데만, 오말, 스비[b], 가담, 그나스, 딤나[a], 아말렉입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대상 1:36은 딤나와 아말렉을 엘리바스의 아들 목록 안에 둡니다. 창세기 36:12는 딤나를 엘리바스의 첩으로, 아말렉을 딤나의 아들로 제시합니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 형태는 צפי이며, 창세기 36:11에는 흔히 ‘스보’로 옮기는 변형형이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בן의 복수형은 가장 직접적으로 ‘아들들’로 옮기는 것이 원문 구조를 가장 잘 드러냅니다.
- source_word: צְפִי
  english_pob_choice: Zephi
  chosen_korean: 제피
  alternatives_korean:
  - 제포
  - 제피오
  lexicon: HALOT
  rationale: 열왕기상/역대기의 족보 이름은 현대 음역으로 처리하되, 역대기의 형태 צפי를 반영해 영어 POB의 Zephi에 대응하는 ‘제피’로 옮겼습니다.
- source_word: תִמְנָע
  english_pob_choice: Timna
  chosen_korean: 딤나
  alternatives_korean:
  - 팀나
  - 팀나
  lexicon: HALOT
  rationale: 이 절의 철자와 모음형에 따라 개인명으로 읽어 ‘딤나’로 음역했습니다. 같은 이름의 다른 전승형은 별도 절에서 다를 수 있습니다.
theological_decisions:
- issue: 역대상 1:36의 딤나와 아말렉 배열을 창세기 36장과 조화시킬지 여부
  chosen_reading: 본문은 엘리바스의 아들 목록 안에 딤나와 아말렉을 함께 제시하는 역대기의 표현을 그대로 따랐습니다.
  alternative_readings:
  - 딤나를 첩, 아말렉을 그 아들로 설명하여 창세기 36:12와 조화시키는 읽기
  rationale: 원문은 설명을 덧붙이지 않고 족보 목록을 제시하므로, 번역도 본문이 말하는 범위를 넘지 않도록 유지했습니다.
  doctrine_reference: 번역 원칙 §1 (원문 우선) 및 §3 (평행본문의 긴장을 본문 안에 남김)
