  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
  footnotes:
  - marker: a
    text: Traditionally, 'Jobab' for 'Yobab.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the land of Teman' or 'from the land of the Temanite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요밥이 죽고, 그의 뒤를 이어 데만 사람들의 땅에서 온 후삼이 왕이 되어 다스렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요밥’은 전통적으로 ‘욥밥’으로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘데만 사람들의 땅’은 ‘데만 땅’ 또는 ‘데만 사람의 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
