  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
  footnotes:
  - marker: a
    text: Or 'leader,' 'chief,' or 'ruler' of the house of God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아사랴는 힐기야의 아들이고, 힐기야는 므술람의 아들이며, 므술람은 사독의 아들이고, 사독은 메라욧의 아들이며, 메라욧은 아히둡의 아들이었습니다. 아사랴는 하나님의 집을 맡은 책임자였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책임자’는 히브리어 ‘나기드’를 옮긴 것으로, 문맥에 따라 ‘지도자’, ‘우두머리’, 또는 ‘통치자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  english_pob_choice: and Azariah
  chosen_korean: 그리고 … 아사랴
  alternatives_korean:
  - 아사랴
  lexicon: HALOT
  rationale: 연결 접속사 וַ를 살려 앞 절의 족보 열거가 이어짐을 드러냈고, 인명은 표준 음역으로 옮겼습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: …의 아들
  alternatives_korean:
  - …의 자손
  - …의 후손
  lexicon: HALOT
  rationale: 반복되는 족보식 בֶן을 한국어에서도 가장 직접적인 친족 표현인 ‘…의 아들’로 옮겨 계보의 형식을 보존했습니다.
- source_word: נְגִיד
  english_pob_choice: chief officer
  chosen_korean: 감독
  alternatives_korean:
  - 지도자
  - 우두머리
  - 통치자
  lexicon: HALOT
  rationale: 성전 맥락에서 נְגִיד는 단순한 서열 호칭보다 맡은 일을 감독하는 직분적 의미가 강하므로, 현대 한국어에서 기능을 드러내는 ‘감독’으로 옮겼습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집안
  lexicon: HALOT
  rationale: 영어 POB의 ‘house of God’를 그대로 따르되, 한국어에서도 히브리어 표현의 직역성을 살려 ‘하나님의 집’으로 옮겼습니다.
