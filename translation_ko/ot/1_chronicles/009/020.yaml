source:
  edition: WLC
  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
  footnotes:
  - marker: a
    text: Or 'And Phinehas son of Eleazar was chief over them formerly.' The Hebrew order allows the temporal term 'formerly' to be connected closely either with 'had been chief' or with the whole clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 비느하스, 엘르아살의 아들은 전에 그들 위의 지도자였으며, 야훼께서 그와 함께 계셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엘르아살의 아들 비느하스가 전에 그들 위의 지도자였다.’ 히브리어 어순상 ‘전에’는 ‘지도자였으며’와도, 문장 전체와도 가깝게 연결될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  english_pob_choice: And Phinehas
  chosen_korean: 그리고 비느하스
  alternatives_korean:
  - 비느하스
  lexicon: 고유명사
  rationale: 앞의 וּ를 연결어 ‘그리고’로 살리고, 인명은 표준 음역인 ‘비느하스’로 옮겼습니다.
- source_word: בֶּן אֶלְעָזָר
  english_pob_choice: son of Eleazar
  chosen_korean: 엘르아살의 아들
  alternatives_korean:
  - 엘르아살의 아들인
  - 엘르아살의 아들이
  lexicon: 계보/친족 관계 표현
  rationale: 히브리어 친족관계 구문을 자연스러운 소유격 구조로 옮겨 관계를 분명히 했습니다.
- source_word: נָגִיד
  english_pob_choice: chief
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 책임자
  - 통치자
  lexicon: HALOT נָגִיד
  rationale: 문맥상 특정 집단 위에 선 책임 있는 지위를 가리키므로, ‘통치자’보다 과장되지 않는 ‘지도자’가 적절합니다.
- source_word: לְפָנִים
  english_pob_choice: formerly
  chosen_korean: 전에
  alternatives_korean:
  - 옛날에
  - 예전에
  - 이전에는
  lexicon: HALOT לְפָנִים
  rationale: 시간 부사로서의 용법을 간결하게 살려, ‘전에는’보다 문장 흐름이 자연스러운 ‘전에’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 공개 번역 원칙에 따라 신적 고유명은 대체 호칭이 아니라 ‘야훼’로 옮겼습니다.
- source_word: עִמּוֹ
  english_pob_choice: was with him
  chosen_korean: 그와 함께 계셨습니다
  alternatives_korean:
  - 그와 함께 있었습니다
  - 그와 함께하셨습니다
  lexicon: HALOT עִם
  rationale: 하나님의 임재와 호의를 나타내는 표현이므로, 현대어이면서도 존칭을 반영한 ‘함께 계셨습니다’로 옮겼습니다.
theological_decisions:
- issue: נָגִיד의 지위 표현
  chosen_reading: ‘지도자’는 행정·공동체적 우두머리의 의미를 드러내되, 군주적 뉘앙스는 억제합니다.
  alternative_readings:
  - 통치자
  - 우두머리
  - 책임자
  rationale: 역대기 문맥에서 비느하스의 지위는 왕권이 아니라 공동체 내 선도적 역할로 읽히므로, 과도한 정치적 의미를 피했습니다.
  doctrine_reference: '문맥 신학: 성막/레위 공동체의 직분과 지도력'
