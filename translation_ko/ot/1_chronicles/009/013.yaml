id: 1CH.9.13
reference: 1 Chronicles 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
  footnotes:
  - marker: a
    text: Or 'kinsmen.' The Hebrew 'brothers' can denote wider clan relations, not only literal siblings.
    reason: lexical_alternative
  - marker: b
    text: Or 'valiant men' or 'capable men.' The phrase is an honorific expression for strength or proven ability, not necessarily military combat in this context.
    reason: lexical_alternative
  - marker: c
    text: Literally 'the house of God'; that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 형제들은 아버지들의 가문의 우두머리였는데, 1,760명의 용맹한 사람들이었으며, 하나님의 집의 사역을 위한 일이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족들’입니다. 히브리어 ‘형제들’은 문자적 형제보다 더 넓은 씨족 관계를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘용사들’ 혹은 ‘유능한 사람들’입니다. 이 표현은 이 문맥에서 꼭 전투 병력을 뜻하는 것은 아니라, 힘과 능력을 드러내는 존칭적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘하나님의 집’이며, 곧 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 같은 지파 사람들
  lexicon: HALOT
  rationale: 히브리어 אָח의 복수형은 문자적 형제뿐 아니라 친족·씨족 관계까지 포함할 수 있으므로, POB의 ‘brothers’를 따라 기본 표지를 살리되 한국어에서도 가장 직접적인 대응인 ‘형제들’을 택했습니다.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  english_pob_choice: heads of their fathers’ houses
  chosen_korean: 아버지들의 가문의 우두머리
  alternatives_korean:
  - 조상 가문의 우두머리
  - 족장들
  lexicon: HALOT
  rationale: פקיד적·계보적 관용구를 한국어로 옮길 때 ‘집안’보다 ‘가문’이 בית אבות의 구조를 더 분명히 보존하므로, ‘우두머리’로 רָאשִׁים을 직접 반영했습니다.
- source_word: גִּבּוֹרֵי חֵיל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 사람들
  alternatives_korean:
  - 용사들
  - 유능한 사람들
  - 힘센 사람들
  lexicon: HALOT
  rationale: 이 표현은 전투만 가리키는 말이 아니라 능력과 위엄을 겸한 सम्मान어이므로, 문맥상 성전 봉사를 수행하는 이들에 맞게 ‘용맹한 사람들’로 옮겨 군사적 과잉을 피했습니다.
- source_word: מְלֶאכֶת עֲבוֹדַת בֵּית הָאֱלֹהִים
  english_pob_choice: for the work of the service of the house of God
  chosen_korean: 하나님의 집의 사역을 위한 일
  alternatives_korean:
  - 하나님의 집의 봉사를 위한 일
  - 하나님의 집에서 하는 섬김의 일
  lexicon: HALOT
  rationale: מְלָאכָה와 עֲבוֹדָה를 각각 ‘일’과 ‘사역’으로 나눠 두 명사를 모두 보이게 하되, ‘하나님의 집’을 유지해 원문 표현의 직접성을 살렸습니다.
theological_decisions:
- issue: בֵּית הָאֱלֹהִים의 번역
  chosen_reading: 하나님의 집
  alternative_readings:
  - 성전
  - 하나님의 성전
  rationale: 원문은 ‘집’(house)이라고 말하며, 문맥상 성전을 가리키더라도 더 해석적인 ‘성전’보다 직역에 가까운 ‘하나님의 집’이 원문의 표현과 신학적 울림을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: source-direct rendering'
