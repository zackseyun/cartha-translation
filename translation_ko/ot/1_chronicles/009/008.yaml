  - 계보상 아들
  rationale: 본문은 명시적 혈통 사슬을 제시하므로 의미를 완화하지 않고 직역에 가깝게 유지하는 것이 적절합니다.
  doctrine_reference: 족보 본문의 역사성 및 계보 표지 보존
