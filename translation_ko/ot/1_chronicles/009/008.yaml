  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
  footnotes:
  - marker: a
    text: Hebrew personal names are transliterated rather than translated; some names also appear in English with variant spellings such as Jibneiah or Raguel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이브니야, 여로함의 아들, 엘라, 웃시의 아들, 미그리의 아들, 그리고 메술람, 스바댜의 아들, 르우엘의 아들, 이브니야의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 인명들은 번역하지 않고 음역했습니다. 영어 POB도 일부 이름에 Jibneiah, Raguel 같은 이문형을 병기합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
