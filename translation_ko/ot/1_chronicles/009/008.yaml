theological_decisions:
- issue: 족보 문맥에서 בֶּן의 범위
  chosen_reading: 직계 부자 관계를 기본값으로 두되, 한국어에서는 족보적 연쇄를 그대로 드러내기 위해 ‘아들’로 반복했습니다.
  alternative_readings:
