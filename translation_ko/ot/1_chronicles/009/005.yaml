translation:
  language: ko
  text: 그리고 실로 사람들 중에서는 맏아들 아사야와 그의 아들들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적인 씨족명 식별에 따라 ‘셀론 사람들’로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִן
  english_pob_choice: And from
  chosen_korean: 그리고 …에게서는
  alternatives_korean:
  - 그리고 …에서
  - …에게서
  lexicon: HALOT
  rationale: 목록을 이어 주는 접속의 힘을 살리면서, 족보 문맥에서 출신 집단을 자연스럽게 드러내기 위해 ‘그리고 …에게서는’로 옮겼습니다.
- source_word: הַ/שִּׁילוֹנִי
  english_pob_choice: the Shilonites
  chosen_korean: 실론 사람들
  alternatives_korean:
  - 실론 사람
  - 실로 사람들
  lexicon: HALOT
  rationale: 이 형태는 문맥상 한 개인이 아니라 씨족/집단을 가리키므로 복수 집합 표현을 택했습니다. 본문 자음형을 따라 직접적으로 옮기되, 전통적 이명 가능성은 각주로 남깁니다.
- source_word: הַ/בְּכֹר
  english_pob_choice: the firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: 가계 목록에서 בכור는 단순히 나이가 많은 사람이 아니라 가족 내 장자 지위를 뜻하므로, 현대 한국어에서 자연스럽고 뜻을 살리는 ‘맏아들’을 선택했습니다.
- source_word: וּ/בָנָיו
  english_pob_choice: and his sons
  chosen_korean: 그리고 그의 아들들이
  alternatives_korean:
  - 그리고 그의 자녀들이
  - 그리고 아들들이
  lexicon: HALOT
  rationale: בנים의 직접적 의미인 ‘아들들’을 유지했고, 목록의 평행 구조를 따라 관계를 분명히 하기 위해 소유 표현을 붙였습니다.
