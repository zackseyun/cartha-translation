  text: 또 그돌과 아히오와 스가랴와 미글롯입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְד֣וֹר
  english_pob_choice: and Gedor
  chosen_korean: 그돌
  alternatives_korean:
  - 게돌
  - 게도르
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역하되, 영어 POB의 표준형 Gedor에 맞추어 한국어에서는 히브리어 자음값을 살린 ‘그돌’을 택했습니다.
- source_word: וְ/אַחְי֔וֹ
  english_pob_choice: and Ahio
  chosen_korean: 아히오
  alternatives_korean:
  - 아시오
  - 아히요
  lexicon: HALOT
  rationale: 고유명사이므로 음역하고, 영어 POB의 표준형 Ahio를 한국어 음성에 자연스럽게 옮겼습니다.
- source_word: וּ/זְכַרְיָ֖ה
  english_pob_choice: and Zechariah
  chosen_korean: 스가랴
  alternatives_korean:
  - 제카랴
  - 스가리아
  lexicon: HALOT
  rationale: 이 이름은 한국어 성경에서 널리 굳어진 형태인 ‘스가랴’를 사용해 가독성과 일관성을 살렸습니다.
- source_word: וּ/מִקְלֽוֹת
  english_pob_choice: and Mikloth
  chosen_korean: 미글롯
  alternatives_korean:
  - 미클롯
  - 미글로스
  lexicon: HALOT
  rationale: 영어 POB의 Mikloth에 대응해 고유명사를 음역했으며, 어말 자음군은 한국어 음절 구조에 맞게 ‘미글롯’으로 옮겼습니다.
