  - 자카랴
  lexicon: 고유명사 표기 관례
  rationale: 히브리어 אישי명 זְכַרְיָה는 한국어 성경에서 널리 정착된 ‘스가랴’로 옮기는 것이 가독성과 인지도에 가장 적합합니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들로서
  alternatives_korean:
  - ~의 아들
  - ~의 후손으로
  lexicon: HALOT
  rationale: 문맥상 즉각적인 부자 관계를 가리키므로 ‘후손’보다 직접적인 ‘아들’이 더 정확합니다.
- source_word: שֹׁעֵר
  english_pob_choice: gatekeeper
  chosen_korean: 문지기
  alternatives_korean:
  - 문수문장
  - 대문지기
  - 문을 지키는 자
  lexicon: HALOT
  rationale: 성소 문을 맡은 사람이라는 직분적 의미를 살리면서도, 한국어에서 자연스럽고 문맥에 맞는 ‘문지기’가 가장 명확합니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회의 장막
  - 증거막
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘회막’은 한국어 성경에서 고정된 성소 명칭으로 널리 쓰이며, 원문의 성소 용어를 간결하게 전달합니다.
theological_decisions:
- issue: 성소 명칭의 번역 방식
  chosen_reading: אֹהֶל מוֹעֵד를 ‘회막’으로 옮겨 성소의 기능을 드러냈습니다.
  alternative_readings:
  - ‘만남의 장막’으로 더 직역
  - ‘장막’으로 일반화
  rationale: 본문은 단순한 천막이 아니라 야훼께서 백성과 만나시는 지정된 성소를 가리키므로, 관용적으로 굳어진 성경 용어를 유지하는 것이 의미를 가장 잘 전달합니다.
  doctrine_reference: 출 27:21; 민 17:4
