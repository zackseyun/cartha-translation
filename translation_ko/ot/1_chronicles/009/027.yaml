  source_fidelity: 원문의 עֲלֵיהֶם מִשְׁמֶרֶת은 ‘경비/파수의 임무가 그들에게 맡겨져 있었다’는 뜻입니다. 초안의 ‘그들을 향해 지켜야 할 책임’은 עֲלֵיהֶם을 잘못 처리하여 의미가 불명확합니다. 또한 מַפְתֵּחַ는 문맥상 매일 아침 여는 직무를 가리킬 수 있으나 문자적으로는 ‘열쇠’이므로, 본문에서는 기능적 의미를 번역하고 해당 위치에 각주를 두는 것이 적절합니다.
  naturalness: ‘하나님의 집 둘레에서 밤을 지냈습니다’와 ‘아침마다 여는 일을 맡고 있었습니다’는 현대 표준어 합쇼체로 자연스럽습니다. 다만 ‘이는 그들을 향해 지켜야 할 책임이 있었기 때문이며’는 비문에 가깝고 자연스럽지 않습니다.
