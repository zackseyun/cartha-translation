  text: וּ/סְבִיב֥וֹת בֵּית הָ/אֱלֹהִ֖ים יָלִ֑ינוּ כִּֽי עֲלֵי/הֶ֣ם מִשְׁמֶ֔רֶת וְ/הֵ֥ם עַל הַ/מַּפְתֵּ֖חַ וְ/לַ/בֹּ֥קֶר לַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
  footnotes:
  - marker: a
    text: Or, more literally, 'they were over the key'; the Hebrew may refer either to custody of the key or to responsibility for opening the house of God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하나님의 집 둘레에서 밤을 지냈습니다[a]. 이는 그들을 향해 지켜야 할 책임이 있었기 때문이며, 그들은 아침마다 여는 일을 맡고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘열쇠 위에’로도 읽을 수 있으나, 여기서는 성전의 문을 여는 책임을 가리키는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
