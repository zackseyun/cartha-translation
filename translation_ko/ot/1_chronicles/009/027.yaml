  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
  footnotes:
  - marker: a
    text: Or, more literally, 'they were over the key'; the Hebrew may refer either to custody of the key or to responsibility for opening the house of God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하나님의 집 둘레에서 밤을 지냈습니다. 경비 임무가 그들에게 맡겨져 있었고, 그들은 아침마다 여는 일을 맡고 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘열쇠를 맡고 있었다’라고도 이해할 수 있습니다. 문맥상 이는 하나님의 집을 아침마다 여는 책임을 가리킬 수 있습니다.
    reason: lexical_alternative
