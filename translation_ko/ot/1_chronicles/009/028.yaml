  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
  footnotes:
  - marker: a
    text: Or 'the articles of service' or 'the utensils used in the service.' The Hebrew term can refer broadly to vessels, utensils, or implements.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 중 일부는 섬김의 기구를 맡았으니, 이는 그들이 그것들을 수대로 들여오고 수대로 내보냈기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּלֵי הָעֲבוֹדָה는 넓게는 ‘기구’, ‘도구’, ‘집기’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  english_pob_choice: Some of them
  chosen_korean: 그들 중 일부는
  alternatives_korean:
  - 그들 중 몇몇은
  - 그들 가운데 일부는
  lexicon: HALOT
  rationale: מִן + 대명사 접미사는 전체 집단에서 떼어낸 부분을 가리키므로, 현대 한국어에서는 ‘그들 중 일부는’이 가장 자연스럽게 분수적 의미를 전달합니다.
- source_word: עַל כְּלֵי הָעֲבוֹדָה
  english_pob_choice: were in charge of the vessels of service
  chosen_korean: 섬김의 기구를 맡았으니
  alternatives_korean:
  - 섬김의 기구들을 감독하였으니
  - 예배의 기구를 맡았으니
  - 봉사에 쓰는 기구를 맡았으니
  lexicon: HALOT
  rationale: עַל은 사람과 직무에 붙을 때 감독·책임의 의미를 띠므로 ‘맡다’로 옮겼고, כְּלֵי הָעֲבוֹדָה는 성전 봉사에 쓰이는 기구들이라는 점을 살려 직역에 가까운 ‘섬김의 기구’로 표현했습니다.
- source_word: בְמִסְפָּר ... וּבְמִסְפָּר
  english_pob_choice: by count ... by count
  chosen_korean: 수대로 ... 수대로
  alternatives_korean:
  - 숫자대로 ... 숫자대로
  - 계수하여 ... 계수하여
  - 정해진 수대로 ... 정해진 수대로
  lexicon: HALOT
  rationale: 반복되는 בְמִסְפָּר는 단순한 수량이 아니라 정확한 계수·관리의 의미를 강조하므로, 행정적이고 간결한 ‘수대로’로 반복을 살렸습니다.
- source_word: יְבִיאוּם / יוֹצִיאוּם
  english_pob_choice: they brought them in / took them out
  chosen_korean: 들여오고 / 내보냈기
  alternatives_korean:
  - 들여오고 / 꺼냈기
  - 가져오고 / 가져갔기
  - 들어오게 하고 / 내보내기
  lexicon: HALOT
  rationale: הִפְעִיל 동사들은 ‘들여오다/내보내다’의 관리·반출입 의미를 가지며, 문맥상 창고 물품의 출납을 가리키므로 한국어에서도 대칭을 살려 옮겼습니다.
theological_decisions:
- issue: 성전 기구의 관리 책임을 어떻게 드러낼 것인가
  chosen_reading: 이 절은 단순 보관이 아니라 정해진 수량에 따른 출납 관리 책임을 말한다고 보았습니다.
  alternative_readings:
  - 단순히 물건을 옮기는 행위로만 읽는 번역
  - 예배 용품을 대하는 일반적 태도로 완화하는 번역
  rationale: 반복되는 ‘수대로’와 출납 동사의 대칭이 행정적 엄밀성을 강조하므로, 그 긴장을 살려야 본문의 의도가 보존됩니다.
  doctrine_reference: 성전 질서와 레위인 직무에 관한 본문적 맥락
