    rationale: ‘경비 임무’를 명시하면 명사의 직무·근무 의미와 원문의 종결 표현을 더 정확히 전달합니다.
  revised_text: 그들과 그들의 아들들은 야훼의 집, 곧 장막의 집의 문들을 맡아 경비 임무를 수행하였습니다.[a]
