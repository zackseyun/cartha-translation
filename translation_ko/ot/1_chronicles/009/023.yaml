  verdict: revise
  source_fidelity: 초안은 עַל הַשְּׁעָרִים의 관리·책임 의미를 ‘문들을 맡았는데’로 대체로 잘 반영하고, ‘야훼의 집’과 ‘장막의 집’의 병치도 보존합니다. 그러나 뒤이어 ‘장막의 집의 문들을 맡아’라고 다시 번역하여 원문에 없는 ‘문들’을 반복하고, 동일한 직무를 중복 서술합니다. לְמִשְׁמָרוֹת는 경비/파수 임무를 가리키므로 이를 명시하는 편이 충실합니다.
  naturalness: ‘야훼의 집, 곧 장막의 집의 문들’은 다소 낯선 원문의 표현을 보존하면서도 문법적으로 자연스럽습니다. ‘맡아 경비 임무를 수행하였습니다’는 현대 표준어 합쇼체로 자연스럽고, 관리 책임과 경비 직무를 모두 드러냅니다.
  terminology: ‘야훼’는 제시된 영어 POB의 신명 표기와 일치합니다. בנים의 남성 후손 의미는 ‘아들들’로 유지합니다. ‘장막의 집’은 원문의 직역적 긴장을 보존하며, ‘성막의 집’은 해석적 대안으로 각주에 남깁니다.
  issues:
