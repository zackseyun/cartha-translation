  edition: WLC
  text: וְ/הֵ֨ם וּ/בְנֵי/הֶ֜ם עַל הַ/שְּׁעָרִ֧ים לְ/בֵית יְהוָ֛ה לְ/בֵ֥ית הָ/אֹ֖הֶל לְ/מִשְׁמָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
  footnotes:
  - marker: a
    text: 'Or ''the house of the tabernacle.'' Hebrew: ''the house of the tent.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 그들의 아들들은 야훼의 집의 문들을 맡았는데, 곧 장막의 집의 문들을 맡아 지키는 자들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘성막의 집’. 히브리어: ‘장막의 집’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  english_pob_choice: They
  chosen_korean: 그들과
  alternatives_korean:
  - 그리고 그들은
  - 그들은
  lexicon: HALOT
  rationale: 문맥상 새 주어를 다시 받는 용법이므로, 한국어에서는 앞절과의 연결을 살리되 자연스럽게 ‘그들과’로 처리했습니다.
- source_word: וּבְנֵיהֶם
  english_pob_choice: and their sons
  chosen_korean: 그들의 아들들은
  alternatives_korean:
  - 그들의 자녀들은
  - 그 아들들도
  lexicon: HALOT
  rationale: 히브리어 בנים은 여기서 세습적 직무를 잇는 남자 후손을 가리키므로, 더 넓은 ‘자녀들’보다 ‘아들들’이 정확합니다.
- source_word: עַל הַשְּׁעָרִים
  english_pob_choice: were over the gates
  chosen_korean: 문들을 맡았는데
  alternatives_korean:
  - 문들 위에 있었는데
  - 문들을 감독했는데
  lexicon: HALOT
  rationale: עַל은 단순한 위치가 아니라 관리·책임의 의미를 띠므로, ‘맡다’로 책임성을 살리고 한국어 어감을 자연스럽게 했습니다.
- source_word: לְבֵית הָאֹהֶל
  english_pob_choice: the house of the tent
  chosen_korean: 장막의 집
  alternatives_korean:
  - 성막의 집
  - 텐트의 집
  lexicon: HALOT
  rationale: 원문 표현인 ‘집’+‘장막/텐트’를 살리면서도 한국어에서 이해 가능한 직역형으로 유지했습니다. 전통적 해석어인 ‘성막’은 가능하지만, 원문의 형식을 더 직접적으로 반영하는 표현을 택했습니다.
theological_decisions:
- issue: ‘야훼의 집’과 ‘장막의 집’의 관계
  chosen_reading: 두 표현을 같은 대상에 대한 부연 설명으로 보고, ‘곧’으로 apposition을 드러냈습니다.
  alternative_readings:
  - 두 장소를 별개의 곳으로 이해함
  - ‘장막의 집’을 곧바로 ‘성막’으로 해석해 단일화함
  rationale: 역대기 문맥에서 현재의 성전 봉사를 옛 장막 전통과 연결하는 긴장이 있으므로, 그 관계를 평평하게 만들지 않고 함께 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
