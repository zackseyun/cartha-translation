  to: 그들과 그들의 아들들은 야훼의 집, 곧 장막의 집의 문들을 맡아 경비 임무를 수행하였습니다.[a]
  rationale: 원문에 없는 ‘문들’과 ‘맡다’의 반복을 제거하고, ‘야훼의 집’과 ‘장막의 집’의 동격적 병치를 유지했습니다. 또한 לְמִשְׁמָרוֹת를 ‘경비 임무’로 번역하여 문들을 관리하는 역할과 경비 근무의 목적을 모두 드러냈습니다.
