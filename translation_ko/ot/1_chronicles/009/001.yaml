id: 1CH.9.1
reference: 1 Chronicles 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
  footnotes:
  - marker: a
    text: Or 'was reckoned by genealogies' or 'was registered by genealogy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because of their trespass' or 'because of their faithlessness.' The Hebrew term carries the sense of covenantal breach or unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 온 이스라엘이 족보로 등록되었고[a], 보십시오, 그들은 이스라엘 왕들의 책에 기록되어 있습니다[b]. 그리고 유다는 자기의 불성실함으로 인해 바빌론으로 사로잡혀 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘족보로 계산되었다’, ‘족보로 등록되었다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 범법 때문에’, ‘그들의 불성실함 때문에’. 이 히브리어는 언약적 위반 또는 불성실함의 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  english_pob_choice: was enrolled by genealogy
  chosen_korean: 족보로 등록되었고
  alternatives_korean:
  - 족보에 따라 등록되었고
  - 족보로 계열이 기록되었고
  - 족보로 기재되었고
  lexicon: HALOT
  rationale: 히트파엘 יחס는 단순 계산이 아니라 혈통·계보를 행정적으로 확인하여 기록하는 뜻이므로, 현대 한국어의 공문서 감각을 살려 ‘족보로 등록되다’로 옮겼습니다.
- source_word: וְהִנָּם
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오,
  - 그리고 보십시오
  lexicon: HALOT
  rationale: 화자의 주의를 끄는 제시 표현이므로, 구어적이되 공적 문체에 맞는 ‘보십시오’로 옮겨 강조를 살렸습니다.
- source_word: כְּתוּבִים עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: they are written in the Book of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 책에 기록되어 있습니다
  alternatives_korean:
  - 이스라엘 왕들의 책에 쓰여 있습니다
  - 이스라엘 왕들의 기록책에 적혀 있습니다
  lexicon: HALOT
  rationale: ‘책’은 공식 기록문서의 의미를 살리며, כְּתוּבִים의 상태적 수동을 ‘기록되어 있습니다’로 자연스럽게 반영했습니다.
- source_word: בְּמַעֲלָם
  english_pob_choice: because of their unfaithfulness
  chosen_korean: 자기의 불성실함으로 인해
  alternatives_korean:
  - 그들의 배신으로 인해
  - 그들의 범죄 때문에
  - 그들의 언약적 불성실함으로 인해
  lexicon: HALOT
  rationale: מַעַל은 단순한 잘못보다 신실함을 저버린 언약적 배신의 뉘앙스를 가지므로, POB의 ‘unfaithfulness’를 한국어에서 가장 직접적으로 드러내는 ‘불성실함’으로 옮겼습니다.
theological_decisions:
- issue: בְּמַעֲלָם의 성격
  chosen_reading: 유다의 포로기는 단순한 정치적 사건이 아니라 언약을 저버린 불성실함에 대한 심판으로 제시됩니다.
  alternative_readings:
  - 일반적 범죄에 대한 징벌
  - 막연한 실패의 결과
  rationale: 문맥상 מַעַל은 하나님께 대한 covenantal breach를 가리키므로, ‘불성실함’이라는 표현을 통해 도덕적·언약적 책임을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: הָגְלוּ의 태
  chosen_reading: ‘사로잡혀 갔습니다’로 옮겨, 유다가 스스로 떠난 것이 아니라 끌려간 수동적 포로 상태를 드러냈습니다.
  alternative_readings:
  - 바빌론으로 갔습니다
  - 바빌론으로 옮겨졌습니다
  rationale: 호팔 수동은 주체적 이동보다 강제 이주를 나타내므로, 심판의 무게를 약화시키지 않도록 수동성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
