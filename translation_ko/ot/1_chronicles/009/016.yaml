  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
  footnotes:
  - marker: a
    text: Or 'who lived in the settlements of Netophah'—the Hebrew gentilic can be represented either by the people-group ('Netophathites') or by the place name ('Netophah').
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 오바댜는 스마야의 아들이요, 갈랄의 손자이며, 여두둔의 증손이고, 그리고 베레기야는 아사의 아들이요, 엘가나의 손자이며, 네토바 사람들의 마을에 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네토바 사람들의 마을’은 히브리어 지명형을 사람집단 표현으로 옮긴 것입니다. 영어 POB처럼 ‘네토바’라는 지명으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
