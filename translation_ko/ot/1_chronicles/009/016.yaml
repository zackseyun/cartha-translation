  lexicon: HALOT
  rationale: חַצְרֵי를 단순한 '뜰'이 아니라 거주지·촌락의 뜻으로 보고, האנ ethnicon을 '네토바 사람들'로 풀어 한국어에서 의미를 분명히 했습니다.
