  rationale: 히브리어 족보식 בן의 직계·연속 관계를 한국어에서도 자연스럽게 드러내기 위해, 본문에 나온 연쇄를 그대로 단계적으로 옮겼습니다.
- source_word: הַ/יּוֹשֵׁב בְּ/חַצְרֵי נְטוֹפָתִי
