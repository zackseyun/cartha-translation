base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
  footnotes:
  - marker: a
    text: 'Or, more literally, ''And to Azel: six sons.'' The English smooths a common Hebrew genealogical formula.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his firstborn' identifies Azrikam as Azel's firstborn son.
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀에게는 아들이 여섯 있었으며, 그들의 이름은 이러합니다. 그의 맏아들 아스리감[a], 이스마엘, 스아랴, 오바댜, 하난입니다. 이들은 아셀의 아들들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 맏아들’은 아스리감이 아셀의 첫째 아들임을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָצֵל
  english_pob_choice: Azel had
  chosen_korean: 아셀에게는 ... 있었습니다
  alternatives_korean:
  - 아셀에게
  - 아셀에게서
  lexicon: HALOT
  rationale: 족보 공식의 ל는 소유·계승을 나타내므로, 한국어에서는 자연스럽게 ‘~에게는’으로 풀어 아셀의 자녀 관계를 드러냈습니다.
- source_word: שִׁשָּׁה בָנִים
  english_pob_choice: six sons
  chosen_korean: 여섯 아들
  alternatives_korean:
  - 여섯 자녀
  - 여섯 아들들
  lexicon: HALOT
  rationale: בָנִים는 일반 자녀가 아니라 ‘아들들’을 뜻하므로 성별이 유지되는 표현을 택했습니다.
- source_word: בֹּכְרוּ
  english_pob_choice: his firstborn
  chosen_korean: 그의 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 그의 장자
  lexicon: HALOT
  rationale: 형태는 아셀의 첫아들임을 가리키므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘맏아들’로 옮겼습니다.
- source_word: אֵלֶּה בְּנֵי אָצַל
  english_pob_choice: These were the sons of Azel
  chosen_korean: 이들은 아셀의 아들들입니다
  alternatives_korean:
  - 이들은 아셀의 아들들이었습니다
  - 이들은 아셀의 아들들입니다
  lexicon: HALOT
  rationale: 마무리 족보 공식은 앞의 목록을 요약하므로, 반복 대신 한국어에서 읽기 자연스러운 결어로 처리했습니다.
