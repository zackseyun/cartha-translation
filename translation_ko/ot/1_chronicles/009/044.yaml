base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
  footnotes:
  - marker: a
    text: 'Or, more literally, ''And to Azel: six sons.'' The English smooths a common Hebrew genealogical formula.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his firstborn' identifies Azrikam as Azel's firstborn son.
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀에게는 여섯 아들이 있었는데, 그들의 이름은 이렇습니다. 아스리감, 그의 맏아들, 이스마엘, 스아랴, 오벳야, 하난입니다. 이들은 아셀의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 맏아들’에 따라, 아스리감이 아셀의 첫째 아들임을 분명히 한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָצֵל
  english_pob_choice: Azel had
  chosen_korean: 아셀에게는 ... 있었습니다
  alternatives_korean:
  - 아셀에게
  - 아셀에게서
  lexicon: HALOT
  rationale: 족보 공식의 ל는 소유·계승을 나타내므로, 한국어에서는 자연스럽게 ‘~에게는’으로 풀어 아셀의 자녀 관계를 드러냈습니다.
- source_word: שִׁשָּׁה בָנִים
  english_pob_choice: six sons
  chosen_korean: 여섯 아들
  alternatives_korean:
