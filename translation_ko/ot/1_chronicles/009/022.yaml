    issue: ‘문설주에서’
    rationale: 문설주는 문 양옆의 기둥/세로 부재를 뜻하며, סַף는 일반적으로 문지방 또는 문턱을 뜻합니다.
  - severity: low
    issue: ‘신뢰받는 직무에 세웠습니다’의 어색함
    rationale: 원문의 압축된 행정적 표현을 반영하려는 의도는 타당하지만, 한국어에서는 직무가 ‘신뢰받는다’고 하기보다 신뢰를 바탕으로 맡겨진 직무라고 표현하는 편이 자연스럽습니다.
  - severity: low
    issue: 각주의 ‘그들의 신실함 안에’
    rationale: 직역 투의 한국어로 자연스럽지 않습니다. 원문의 가능한 대안을 유지하면서 자연스러운 표현으로 바꿀 필요가 있습니다.
