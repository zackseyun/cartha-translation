  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
  footnotes:
  - marker: a
    text: Or, "David and Samuel the seer established them because of their faithfulness," or "established them in their faithfulness."
    reason: alternative_reading
translation:
  language: ko
  text: 이렇게 선택된 모든 사람은 문지기들로서 문설주에서 근무했는데, 모두 이백십이 명이었습니다. 그들은 각자의 마을에서 족보에 따라 등록되었습니다. 다윗과 선견자 사무엘이 그들을 신뢰받는 직무에 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다윗과 선견자 사무엘이 그들의 신실함 때문에 그들을 세웠다” 또는 “그들의 신실함 안에 그들을 세웠다.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרוּרִים
  english_pob_choice: who were chosen
  chosen_korean: 선택된
  alternatives_korean:
  - 뽑힌
  - 택함을 받은
  - 선발된
  lexicon: HALOT
  rationale: 선별되어 역할을 맡은 사람이라는 뜻을 자연스럽게 살리면서도 과도한 신학적 색채를 덜어냅니다.
- source_word: לְשֹׁעֲרִים
  english_pob_choice: as gatekeepers
  chosen_korean: 문지기들로서
  alternatives_korean:
  - 문지기로
  - 성문 지기들로서
  - 문을 지키는 자들로서
  lexicon: HALOT
  rationale: שֹׁעֵר의 기본 의미인 문을 지키는 사람을 살리되, 성전/회중 문맥에서 익숙한 표현인 문지기를 사용했습니다.
- source_word: בַּסִּפִּים
  english_pob_choice: at the thresholds
  chosen_korean: 문설주에서
  alternatives_korean:
  - 문지방에서
  - 출입문에서
  - 문턱에서
  lexicon: HALOT
  rationale: סַף는 문지방/출입 경계의 뜻이므로, 단순히 ‘문’보다 더 구체적인 문설주/문지방 계열 표현이 원문에 가깝습니다.
- source_word: בֶּאֱמוּנָתָם
  english_pob_choice: in their office of trust
  chosen_korean: 신뢰받는 직무에
  alternatives_korean:
  - 그들의 신실함 안에
  - 신실한 직분에
  - 믿음직한 직책에
  lexicon: HALOT
  rationale: אֱמוּנָה는 신실함, 신뢰성, 믿을 만함을 모두 포함할 수 있어, 여기서는 제도적 배치의 의미를 살린 ‘신뢰받는 직무’가 가장 균형적입니다.
- source_word: הָרֹאֶה
  english_pob_choice: the seer
  chosen_korean: 선견자
  alternatives_korean:
  - 예언자
  - 보는 자
  - 선지자
  lexicon: HALOT
  rationale: 사무엘에 붙은 고유 호칭을 ‘선견자’로 유지해, 일반적인 예언자와 구별되는 역사적·문학적 색채를 보존했습니다.
theological_decisions:
- issue: בֶּאֱמוּנָתָם의 의미를 개인적 신실함으로만 볼지, 맡겨진 직무의 신뢰성으로 볼지
  chosen_reading: 여기서는 다윗과 사무엘이 그들을 신뢰할 만한 직무에 세웠다는 행정적 의미를 본문에 반영했습니다.
  alternative_readings:
  - 그들의 신실함 때문에 세웠다
  - 그들을 그들의 신실함 안에 세웠다
  rationale: 문맥이 성전 문지기들의 조직과 등록을 말하므로, 본문은 개인 덕목만이 아니라 맡겨진 공적 역할의 신뢰성을 함께 가리키는 것으로 읽는 것이 더 자연스럽습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it'
