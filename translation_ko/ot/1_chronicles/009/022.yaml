revisions:
- from: 이렇게 선택된 모든 사람은 문지기들로서 문설주에서 근무했는데, 모두 이백십이 명이었습니다. 그들은 각자의 마을에서 족보에 따라 등록되었습니다. 다윗과 선견자 사무엘이 그들을 신뢰받는 직무에 세웠습니다.[a]
  to: 문지방을 지키도록 뽑힌 사람은 모두 이백십이 명이었습니다. 그들은 각자의 마을에서 족보에 따라 등록되었습니다. 다윗과 선견자 사무엘은 그들을 신뢰를 바탕으로 맡겨진 직무에 세웠습니다.[a]
  rationale: 문지기들이 지킨 위치를 ‘문지방’으로 바로잡아 원어의 공간적 의미를 보존했습니다. 마지막 절은 본문의 행정적·직무적 의미를 유지하되 한국어 어법에 맞게 다듬었고, בֶּאֱמוּנָתָם의 신실함 관련 대안은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:08:24Z'
review_pass:
  verdict: revise
  source_fidelity: ‘문설주’는 히브리어 סַף(문지방, 문턱)를 정확히 옮기지 못합니다. 또한 마지막 구절의 בֶּאֱמוּנָתָם은 신뢰할 만한 직무/신실함의 뜻을 지니므로, 본문에서는 행정적 의미를 자연스럽게 살리되 각주에서 대안을 보존하는 것이 적절합니다.
  naturalness: ‘문지방을 지키도록 뽑힌’이 ‘문설주에서 근무했는데’보다 현대 표준 한국어에서 자연스럽고, 원문의 역할과 장소 관계도 더 명료하게 나타냅니다. ‘신뢰받는 직무’는 다소 어색하므로 ‘신뢰를 바탕으로 맡겨진 직무’로 다듬었습니다.
  terminology: ‘문지기’, ‘선견자’, ‘족보에 따라 등록되다’는 적절합니다. ‘문지방’은 סַף에 맞고, 사무엘의 고유 호칭인 ‘선견자’를 유지했습니다.
  issues:
