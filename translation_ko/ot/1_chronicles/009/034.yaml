  source_fidelity: 원문의 ‘레위 사람들의 아버지 집안의 우두머리들’, ‘그들의 계보에 따라’, 그리고 반복되는 רָאשִׁים(우두머리들)은 모두 드러나야 합니다. 초안의 ‘족장들’은 반복된 일반적 ‘우두머리들’보다 의미를 지나치게 특정하며, ‘그들의 대대로 따진’은 문법적으로 부자연스럽습니다.
