source:
  edition: WLC
  text: אֵלֶּה֩ רָאשֵׁ֨י הָ/אָב֧וֹת לַ/לְוִיִּ֛ם לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
  footnotes:
  - marker: a
    text: Or “chiefs” or “heads” for “chief men.” The Hebrew repeats the same root used earlier in the verse for emphasis.
    reason: lexical_alternative
  - marker: b
    text: “Fathers’ houses” refers to clan or ancestral family units, not merely individual households.
    reason: cultural_note
translation:
  language: ko
  text: 이들은 그들의 계보에 따른 레위 사람들의 조상 집안 우두머리들입니다. 이들은 우두머리들이었으며 예루살렘에 살았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상 집안’은 개별 가구보다 씨족 또는 조상 중심의 가문 단위를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘우두머리들’이라는 같은 말을 반복하여 그들의 지위를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: רָאשֵׁי
  english_pob_choice: heads of
  chosen_korean: 우두머리들
  alternatives_korean:
  - 머리들
  - 수장들
  - 지도자들
  lexicon: HALOT
  rationale: 반복되는 רֹאשׁ 계열 표현을 자연스러운 현대 한국어로 옮기되, 단순한 직책명보다 공동체의 우두머리라는 의미를 드러내려 했습니다.
- source_word: הָאָבוֹת
  english_pob_choice: the fathers’ houses
  chosen_korean: 아버지 집안의
  alternatives_korean:
  - 족장 집안의
  - 선조의 집안의
  - 아버지들의 집안의
  lexicon: HALOT
  rationale: 역대기에서 가리키는 씨족/가문 단위를 살리기 위해 문자적이면서도 한국어에서 이해 가능한 ‘아버지 집안’으로 옮겼습니다.
- source_word: לְתֹלְדוֹתָם
  english_pob_choice: according to their generations
  chosen_korean: 그들의 대대로 따진
  alternatives_korean:
  - 그들의 نسل에 따라
  - 그들의 세대에 따라
  - 그들의 족보에 따라
  lexicon: HALOT
  rationale: תּוֹלְדוֹת의 계보적 의미를 반영해 단순한 시간 순서가 아니라 혈통의 이어짐을 나타내도록 했습니다.
- source_word: רָאשִׁים
  english_pob_choice: heads
  chosen_korean: 족장들
  alternatives_korean:
  - 우두머리들
  - 머리들
  - 수장들
  lexicon: HALOT
  rationale: 앞의 ‘우두머리들’과 같은 어근 반복을 너무 부자연스럽게 재현하기보다, 지위가 높은 씨족 대표라는 점을 드러내는 ‘족장들’로 옮겼습니다.
theological_decisions:
- issue: 레위 사람들의 사회적 지위를 어떻게 드러낼지
  chosen_reading: 단순한 개인 가정보다 레위인 공동체 안의 씨족 대표층을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 레위인의 가문 책임자들로 볼 수 있음
  - 단순한 거주자 목록으로 볼 수 있음
  rationale: 문맥상 행정적·계보적 목록이므로, 개인적인 거주 정보가 아니라 레위 지파 내부의 대표적 가문 구조를 보여 주는 표현으로 유지했습니다.
  doctrine_reference: 민수기 1장; 역대기 족보 전통
