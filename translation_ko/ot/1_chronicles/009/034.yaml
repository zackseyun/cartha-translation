  terminology: בֵּית־אָבוֹת는 개별 가구가 아니라 씨족적 조상 가문 단위이므로 ‘조상 집안’과 주석으로 처리하는 것이 적절합니다. רָאשִׁים은 ‘족장들’보다 원문의 반복을 보존하는 ‘우두머리들’이 안전합니다.
