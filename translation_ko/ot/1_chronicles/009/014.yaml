id: 1CH.9.14
reference: 1 Chronicles 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
  footnotes:
  - marker: a
    text: Or “from the descendants of Merari.” The Hebrew expression “sons of” can denote a broader clan lineage, though “sons of Merari” is retained in the main text for formal transparency.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위 사람들 가운데서는 므라리의 아들들[a] 가운데 속한 스마야가 있었습니다. 그는 핫숩의 아들이며, 아스리감의 아들이며, 하사뱌의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 “아들들”은 여기서 더 넓은 씨족 계통을 가리킬 수도 있습니다. 본문은 히브리어의 표현을 드러내기 위해 “므라리의 아들들”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  english_pob_choice: And from
  chosen_korean: 그리고 … 가운데서는
  alternatives_korean:
  - 그리고 …에서
  - 또 …에서
  lexicon: HALOT
  rationale: 앞선 목록과의 연결을 살리면서, 문맥상 부분집합을 도입하는 기능을 한국어로 자연스럽게 드러내기 위해 ‘그리고 … 가운데서는’으로 옮겼습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 족보·명부 문맥에서 לְוִיִּם은 집단적 구성원을 가리키므로, ‘레위 사람들’로 옮겨 인물 목록의 성격을 유지했습니다.
- source_word: בְּנֵי מְרָרִי
  english_pob_choice: from the sons of Merari
  chosen_korean: 므라리의 아들들 가운데 한 사람
  alternatives_korean:
  - 므라리의 아들들 가운데서
  - 므라리의 자손들 가운데 한 사람
  lexicon: HALOT
  rationale: 히브리어 ‘sons of’는 여기서 넓은 씨족 소속을 뜻할 수 있으므로, 본문 의미를 보존하면서도 한국어에서 무리 소속을 자연스럽게 나타내는 표현을 택했습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: …의 아들
  alternatives_korean:
  - …의 자손
  lexicon: HALOT
  rationale: 연속 족보 구조에서는 ‘아들’이 가장 직접적이고 투명한 대응이므로, 영어 POB의 형식을 따라 계보 사슬을 유지했습니다.
