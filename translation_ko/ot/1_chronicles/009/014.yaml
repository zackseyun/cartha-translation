revisions:
- from: 그리고 레위 사람들 가운데서는, 세마야—하슈브의 아들, 아즈리캄의 아들, 하사브야의 아들, 므라리의 아들들 가운데 한 사람—이 있었습니다.[a]
  to: 그리고 레위 사람들 가운데서는 므라리의 아들들[a] 가운데 속한 스마야가 있었습니다. 그는 핫숩의 아들이며, 아스리감의 아들이며, 하사뱌의 아들이었습니다.
  rationale: The revision removes the unnecessary ‘one person’ implication, places the Merarite clan affiliation directly with Shemaiah, uses standard Korean biblical names, and recasts the genealogy in clear modern formal-polite Korean. The footnote remains anchored to ‘아들들’ and preserves the possible broader clan sense.
  reviewer_model: gpt-5.6-terra
