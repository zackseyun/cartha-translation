  yaml_path: translation/ot/1_chronicles/009/006.yaml
  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
  footnotes:
  - marker: a
    text: Or, 'Jeuel and his brothers, six hundred and ninety,' if the relationship is taken distributively with Jeuel as the representative head of the clan. The Hebrew suffix in 'their brothers' is plural, but English versions sometimes smooth it to singular for readability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 세라의 자손 중에서는 여우엘과 그의 형제들이 있으니, 모두 육백구십 명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 복수 접미사는 문자적으로는 ‘그들의 형제들’이지만, 여우엘을 대표로 한 씨족 전체를 가리키는 분배적 표현으로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  english_pob_choice: And from
  chosen_korean: 그리고 … 중에서는
  alternatives_korean:
  - 그리고 …에서
  - 또 …에서
  lexicon: HALOT
  rationale: 열거형 계보 문맥에서 앞절과의 연결을 살리면서, 한국어에서는 ‘중에서는’이 소속 집단을 자연스럽게 드러냅니다.
- source_word: בְּנֵי זֶרַח
  english_pob_choice: the sons of Zerah
  chosen_korean: 세라의 자손
  alternatives_korean:
  - 세라의 아들들
  - 세라의 후손
  lexicon: HALOT
  rationale: בְּנֵי는 족보·명부에서 혈통 집단을 가리키므로, 직역적이면서도 문맥상 넓은 씨족 뜻을 살리는 ‘자손’이 적절합니다.
- source_word: יְעוּאֵל
  english_pob_choice: Jeuel
  chosen_korean: 여우엘
  alternatives_korean:
  - 예우엘
  - 제우엘
  lexicon: 고유명사 표기
  rationale: 히브리어 이름을 현대 한국어 외래어 표기 감각에 맞게 음역했습니다.
- source_word: וַ/אֲחֵי/הֶם
  english_pob_choice: and their brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그들의 형제들
  - 그의 동족들
  lexicon: HALOT
  rationale: 히브리어 어미는 복수지만, 영어 POB 주석처럼 제유적·분배적 관계에서 대표 인물 여우엘에게 귀속되는 뜻으로 읽을 수 있어 한국어에서는 문맥상 자연스러운 단수 대명사로 옮겼습니다.
- source_word: שֵׁשׁ מֵא֥וֹת וְ/תִשְׁעִים
  english_pob_choice: six hundred and ninety
  chosen_korean: 육백구십 명
  alternatives_korean:
  - 육백구십
  - 690명
  lexicon: HALOT
  rationale: 명부의 인원수이므로 한국어에서 단위 ‘명’을 보태 의미를 분명히 했고, 성경체에 맞게 숫자는 한글로 풀어 썼습니다.
theological_decisions:
- issue: 족보 항목의 집단 표기 방식
  chosen_reading: 개인명 뒤의 ‘그의 형제들’은 여우엘을 대표로 하는 씨족/동족 집단을 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - 히브리어 복수 접미사를 그대로 살려 ‘그들의 형제들’로 옮김
  - 여우엘과 별개 인물 집단으로 이해함
  rationale: 영어 POB가 지적하듯 이 구절은 단순한 친형제라기보다 족보 명부의 집단 표기일 가능성이 높아, 한국어에서는 대표-집단 관계가 드러나도록 처리하는 편이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 족보/씨족 명부 해석
