  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
  footnotes:
  - marker: a
    text: Or, 'Jeuel and his brothers, six hundred and ninety,' if the relationship is taken distributively with Jeuel as the representative head of the clan. The Hebrew suffix in 'their brothers' is plural, but English versions sometimes smooth it to singular for readability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 세라의 자손 가운데서는 여우엘과 그들의 형제들[a], 모두 육백구십 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 형제들’이라고 합니다. 명부 문맥에서는 여우엘을 그 씨족의 대표로 보아 ‘그의 형제들’로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  english_pob_choice: And from
  chosen_korean: 그리고 … 중에서는
  alternatives_korean:
  - 그리고 …에서
  - 또 …에서
  lexicon: HALOT
  rationale: 열거형 계보 문맥에서 앞절과의 연결을 살리면서, 한국어에서는 ‘중에서는’이 소속 집단을 자연스럽게 드러냅니다.
- source_word: בְּנֵי זֶרַח
