lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And some of
  chosen_korean: 그리고 … 가운데 일부는
  alternatives_korean:
  - 그리고 … 중 일부는
  - 또 … 가운데 일부는
  - …에서 일부는
  lexicon: HALOT
  rationale: 문맥상 단순 출처 표시보다 부분집합을 나타내므로, 영어 POB의 partitive 감각을 살려 ‘… 가운데 일부는’으로 옮겼습니다.
- source_word: בְּנֵי הַכֹּהֲנִים
  english_pob_choice: the sons of the priests
  chosen_korean: 제사장들의 아들들
  alternatives_korean:
  - 제사장의 아들들
  - 제사장 가문의 자손들
  - 제사장 자손들
  lexicon: HALOT
  rationale: 역대기의 족보/직무 목록 문맥을 살려 혈연적·가문적 표현을 유지했습니다. 한국어에서도 자연스럽고 원문의 구조를 보존합니다.
- source_word: רֹקְחֵי
  english_pob_choice: compounders
  chosen_korean: 조제자
  alternatives_korean:
  - 혼합하는 사람들
  - 배합자
  - 향을 만드는 사람들
  lexicon: HALOT
  rationale: 어근은 향료를 배합·제조하는 사람들을 가리키므로, 직역적이면서도 현대 한국어에서 이해되는 ‘조제자’를 선택했습니다.
- source_word: הַמִּרְקַחַת לַבְּשָׂמִים
  english_pob_choice: the ointment of spices
  chosen_korean: 향료를 위한 향기로운 기름
  alternatives_korean:
  - 향료의 기름
  - 향료를 위한 기름
  - 향료의 혼합물
  lexicon: HALOT
  rationale: 히브리어는 조제된 향품/향유 계열의 물질을 가리키므로, 영어 POB의 설명을 참고하되 본문은 ‘향기로운 기름’으로 풀어 의미를 분명하게 했습니다.
theological_decisions:
- issue: 제사장 아들들의 역할 표현
  chosen_reading: 본절은 제사장 가문에 속한 일부가 성전 관련 향품 조제 업무를 맡았다는 직무 기록으로 읽었습니다.
  alternative_readings:
  - 단순한 가정 내 직업 묘사로 읽기
  - 의식용 향유 제조만을 가리키는 것으로 좁게 읽기
  rationale: 역대기는 성전 봉사 조직과 직무 분담을 열거하는 문맥이므로, 제사장 가문 구성원들의 실제 사역 역할을 드러내는 번역이 가장 적절합니다.
  doctrine_reference: 역대기 성전 직무와 레위/제사장 조직에 관한 문맥
