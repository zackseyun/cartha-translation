  rationale: 고유명사는 한국어 성경에서 통용되는 표기를 우선해 음역했습니다.
- source_word: וִיהוֹיָרִיב
  english_pob_choice: Jehoiarib
  chosen_korean: 여호야립
  alternatives_korean:
  - 여호야리브
  - 예호야립
  lexicon: standard Korean biblical transliteration
  rationale: 히브리어 고유명사의 관용적 한국어 음역을 따르되, 영어 POB의 인명 열거와 대응되도록 유지했습니다.
- source_word: וְיָכִין
  english_pob_choice: and Jakin
  chosen_korean: 야긴
  alternatives_korean:
  - 그리고 야긴
  - 여긴
  lexicon: standard Korean biblical transliteration
  rationale: 마지막 항목 앞의 접속은 문장 첫머리의 열거구에서 한국어로 중복하지 않고, 이름은 통용 음역으로 옮겼습니다.
