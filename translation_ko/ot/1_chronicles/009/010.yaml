  rationale: 목록의 다음 항목을 이어 주는 연결성과 분류 의미를 함께 살리기 위해, 단순한 출처 표시보다 자연스러운 한국어 목록 도입구로 옮겼습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제사장 계층
  lexicon: HALOT
  rationale: כהנים의 표준 의미를 직접 반영해 직역하되, 집단 열거 문맥이므로 복수형을 분명히 했습니다.
- source_word: יְדַעְיָה
  english_pob_choice: Jedaiah
  chosen_korean: 여다야
  alternatives_korean:
