  - ‘후손’으로 완화
  rationale: 영어 POB가 반복되는 ‘son of’를 그대로 살리면서도, 족보가 종종 세대 압축을 허용한다는 점을 한국어 문장 내부에서 무리 없이 드러내기 위해서입니다.
  doctrine_reference: 성경 족보 해석의 일반 원칙
- issue: בְּנֵי בִּנְיָמִן의 부족 표지성
  chosen_reading: ‘베냐민의 아들들’을 사용해 혈통-부족 소속을 함께 보이도록 했습니다.
  alternative_readings:
  - ‘베냐민 자손’
  - ‘베냐민 사람들’
  rationale: 본문은 단순한 개인 목록이 아니라 부족 단위의 족보적 표지를 제공하므로, 직역성과 의미를 함께 살리는 표현을 택했습니다.
  doctrine_reference: 구약 족보와 지파 정체성
