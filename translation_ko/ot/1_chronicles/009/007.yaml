base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the sons of Benjamin.' This refers to members of the tribe of Benjamin.
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats 'son of' throughout the genealogy; this may denote direct sonship or a genealogical descendant.
    reason: cultural_note
  - marker: c
    text: The name Hodaviah is spelled differently in some related genealogical traditions.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 베냐민의 아들들 가운데서는 살루가 있었는데, 그는 므술람의 아들이요, 호다위야의 아들이요, 하스누아의 아들이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘베냐민의 아들들’은 여기서 베냐민 지파에 속한 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 족보에서 ‘아들’ 표현을 반복하며, 이는 직계 아들일 수도 있고 족보적 후손일 수도 있습니다.
    reason: cultural_note
  - marker: c
    text: 호다위야는 관련 족보 전승들에서 철자가 다르게 나타나기도 합니다.
    reason: textual_variant
