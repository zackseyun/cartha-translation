reference: 1 Chronicles 9:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַתִּתְיָה֙ מִן הַ/לְוִיִּ֔ם ה֥וּא הַ/בְּכ֖וֹר לְ/שַׁלֻּ֣ם הַ/קָּרְחִ֑י בֶּ/אֱמוּנָ֕ה עַ֖ל מַעֲשֵׂ֥ה הַ/חֲבִתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
  footnotes:
  - marker: a
    text: Or 'faithfully'; the Hebrew phrase can describe either Mattithiah's trustworthy manner or his being placed in a trusted charge.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term refers to a kind of baked cake, possibly griddle cakes.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 레위 사람들 가운데서는 맛디디야가 있었는데, 그는 고라 사람 술룸의 맏아들이었으며, 납작한 떡 만드는 일을 맡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맡았습니다’는 כאן의 ‘신뢰/신실함’ 관용을 행정적 위임으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘납작한 떡’은 히브리어의 구운 떡 종류를 가리키는 말로, 정확한 조리 방식은 문맥상 확정되지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  english_pob_choice: And Mattithiah
  chosen_korean: 맛디디야
  alternatives_korean:
  - 그리고 맛디디야
  lexicon: 표준 음역
  rationale: 고유명사는 현대 한국어 음역으로 옮기고, 문맥상 앞뒤 인명 열거와 자연스럽게 이어지도록 했습니다.
- source_word: מִן הַלְוִיִּם
  english_pob_choice: from the Levites
  chosen_korean: 레위 사람들 가운데서는
  alternatives_korean:
  - 레위 사람들 중에서
  - 레위 사람들로부터
  lexicon: HALOT
  rationale: מן의 소속/출신 의미를 살리되, 한국어에서는 ‘가운데서’가 집합 속 한 사람을 지목하는 데 가장 자연스럽습니다.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  english_pob_choice: the firstborn of Shallum
  chosen_korean: 술룸의 맏아들이었으며
  alternatives_korean:
  - 술룸의 첫째 아들이었으며
  - 술룸의 장남이었으며
  lexicon: HALOT
  rationale: בכור의 기본 의미를 ‘맏아들’로 옮겨 혈연 관계를 분명히 했습니다. ‘장남’은 자연스럽지만 다소 현대적 행정어감이 강합니다.
- source_word: הַקָּרְחִי
  english_pob_choice: the Korahite
  chosen_korean: 고라 사람
  alternatives_korean:
  - 고라 족속
  - 고라 자손
  lexicon: HALOT
  rationale: 계보적 소속을 나타내는 형용사를 한국어에서는 ‘~사람’으로 풀어 독자가 즉시 이해하도록 했습니다.
- source_word: בֶּאֱמוּנָה עַל מַעֲשֵׂה הַחֲבִתִּים
  english_pob_choice: was entrusted with the work of the flat cakes
  chosen_korean: 납작한 떡 만드는 일을 맡았습니다
  alternatives_korean:
  - 납작한 떡의 일을 맡았습니다
  - 납작한 떡 작업을 맡았습니다
  lexicon: HALOT
  rationale: בֶּאֱמוּנָה는 여기서 신실함의 추상명사보다 ‘맡다/신뢰받아 맡겨지다’의 책임 관용구가 더 적합하므로 동사구로 옮겼습니다. הַחֲבִתִּים은 구체적인 음식 항목으로, ‘납작한 떡’이 문화적 배경을 과장하지 않으면서도 뜻을 전달합니다.
theological_decisions:
- issue: בֶּאֱמוּנָה의 의미가 ‘신실하게’인지 ‘신뢰받아 맡겨진’인지
  chosen_reading: ‘맡았습니다’로 처리해 책임과 위임의 의미를 드러냈습니다.
  alternative_readings:
  - 신실하게
  - 충성스럽게
  - 신뢰 가운데
  rationale: 이 문맥은 인물의 도덕적 태도보다 성전/성물 관련 실무 배치를 설명하므로, 영어 POB의 관찰처럼 ‘trust’의 의미를 한국어 서술에 반영하는 편이 원문 기능을 더 잘 보존합니다.
  doctrine_reference: 역대기 인명/직무 목록의 행정적 서술
- issue: כָּרְחִי를 전통적 교회 용어 대신 어떻게 옮길지
  chosen_reading: ‘고라 사람’으로 옮겨 계보 표지를 직설적으로 드러냈습니다.
  alternative_readings:
  - 고라 족속
  - 고라 자손
  rationale: 이 절은 특정 집단의 출신 표시가 핵심이므로, 독자가 관계를 바로 읽을 수 있는 소박한 계보 표현을 택했습니다.
  doctrine_reference: 역대상 족보·성전 직무 맥락
