  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
  footnotes:
  - marker: a
    text: 'Hebrew: "And his son, the firstborn: Abdon, then Zur, Kish, Baal, Ner, and Nadab." The conjunction before each name is represented idiomatically in English as a list.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 맏아들은 압돈이었고, 그다음은 술, 기스, 바알, 네르, 나답이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어는 “그의 아들, 곧 맏아들: 압돈, 그다음은 술, 기스, 바알, 네르, 나답”의 직역형을 보이지만, 한국어에서는 이름 목록을 자연스러운 열거로 옮겼습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ הַבְּכוֹר
  english_pob_choice: And his firstborn son
  chosen_korean: 그의 맏아들
  alternatives_korean:
