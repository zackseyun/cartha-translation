  lexicon: 표준 외래어 표기
  rationale: 연속되는 이름 목록에서 영어 POB처럼 첫 항목 이후의 연결을 자연스러운 한국어 목록 표현 ‘그다음은’으로 풀어냈습니다.
- source_word: וּבַ֥עַל
  english_pob_choice: Baal
  chosen_korean: 바알
  alternatives_korean:
  - 바알로
  lexicon: 표준 외래어 표기
  rationale: 족보 속 인명이므로 신명칭이나 완곡어법으로 바꾸지 않고 히브리어 형태를 그대로 음역했습니다.
theological_decisions:
