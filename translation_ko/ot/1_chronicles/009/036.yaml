  - 그의 장자
  lexicon: HALOT
  rationale: הַבְּכוֹר는 족보 문맥에서 ‘firstborn’의 직접 대응인 ‘맏아들’로 옮겨, 혈통상의 서열을 분명히 드러냈습니다.
- source_word: עַבְדּוֹן
