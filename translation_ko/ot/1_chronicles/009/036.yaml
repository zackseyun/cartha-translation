  rationale: 원문은 족보 목록의 인명을 직접 제시하므로, 후대 신학적 불편을 이유로 형태를 바꾸지 않는 것이 source-direct 원칙에 맞습니다.
  doctrine_reference: Translation philosophy §1, §2
