    rationale: 히브리어 נֵר는 음가상 Ner이며, 표준 한국어 성경 인명 전통에서는 ‘넬’로 표기됩니다. 같은 족보의 다른 인명들과도 일관된 한국어 성경식 표기를 위해 ‘넬’이 적절합니다.
