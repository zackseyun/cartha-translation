  source_fidelity: 본문의 족보 구조와 ‘맏아들’의 의미는 잘 반영되었습니다. 다만 נֵר(Ner)는 표준 한국어 성경 인명 표기와 본문 내 음역 일관성상 ‘넬’로 고치는 것이 적절합니다. 또한 현 각주는 히브리어의 직역형이라고 하면서 ‘그다음은’을 포함하여, 원문의 반복 접속사 구조를 정확히 설명하지 못합니다.
  naturalness: 합쇼체 문장과 이름 열거는 자연스럽습니다. ‘그다음은’은 영어 POB의 관용적 목록 처리를 따르므로 유지할 수 있으나, 이는 원문의 접속사가 낳는 단순한 열거를 한국어답게 표현한 것임을 각주에서 분명히 하는 편이 좋습니다.
  terminology: ‘맏아들’, ‘압돈’, ‘술’, ‘기스’, ‘바알’, ‘나답’은 적절합니다. 인명 נֵר는 한국어 성경의 통용 표기인 ‘넬’이 적절합니다. ‘바알’은 이 문맥에서 인명으로 그대로 보존해야 합니다.
