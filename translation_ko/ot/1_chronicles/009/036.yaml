  lexicon: HALOT
  rationale: הַבְּכוֹר는 족보 문맥에서 ‘firstborn’의 직접 대응인 ‘맏아들’로 옮겨, 혈통상의 서열을 분명히 드러냈습니다.
- source_word: עַבְדּוֹן
  english_pob_choice: Abdon
  chosen_korean: 압돈
  alternatives_korean:
  - 아브돈
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 현대 한글 음역으로 처리했으며, 히브리어 자음군을 반영해 ‘압돈’으로 옮겼습니다.
- source_word: וְצ֣וּר
  english_pob_choice: then Zur
  chosen_korean: 그다음은 술
  alternatives_korean:
  - 그리고 술
