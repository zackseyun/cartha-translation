translation:
  language: ko
  text: 그의 맏아들은 압돈이었고, 그다음은 술, 기스, 바알, 넬, 나답이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “그의 아들, 곧 맏아들인 압돈과 술과 기스와 바알과 넬과 나답”처럼 이름들을 접속사로 이어 열거합니다. 한국어에서는 이를 자연스러운 목록으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ הַבְּכוֹר
  english_pob_choice: And his firstborn son
  chosen_korean: 그의 맏아들
  alternatives_korean:
