  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
  footnotes:
  - marker: a
    text: 'Hebrew spells the father''s name in two slightly different forms in this verse: ''Merib-baal'' and a shortened form ''Meri-baal.'' The translation regularizes the name for clarity.'
    reason: textual_variant
  - marker: b
    text: In the parallel genealogy, 1 Samuel 14:49 names Saul's son 'Jonathan' rather than 'Jehonathan.' Here the Chronicler's Hebrew form is Jehonathan.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 여호나단의 아들은 메립바알이었고, 메립바알은 미가를 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 절에서 같은 인물을 ‘메립바알’과 줄어든 형태 ‘메리바알’로 두 가지 방식으로 적습니다. 한국어는 이해를 위해 한 형태로 정규화했습니다.
    reason: textual_variant
  - marker: b
    text: 사무엘상 14:49에서는 사울의 아들을 ‘여호나단’이 아니라 ‘요나단’이라고 부릅니다. 여기서는 역대기의 히브리어 형태를 따랐습니다.
    reason: cross_reference
