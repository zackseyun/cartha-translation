  source_fidelity: 문두의 ‘이제’는 히브리어 본문에 명시되지 않았고, ‘첫째로 정착한’은 הָרִאשֹׁנִים을 부자연스럽게 순서 부사로 처리합니다. 또한 בַּאֲחֻזָּתָם בְּעָרֵיהֶם은 ‘그들의 소유지와 성읍들에’로 보존하는 편이 원문에 더 충실합니다.
  naturalness: ‘처음 거주한 이들’이라는 표현이 현대 표준 한국어에서 자연스럽고, 역사 서술의 격식 있는 합쇼체 문장으로도 적절합니다. ‘자기 소유지의 자기 도시들’처럼 반복되는 재귀 표현은 피하는 것이 좋습니다.
  terminology: יִשְׂרָאֵל은 열거된 사람들을 가리키므로 ‘이스라엘 사람들’이 적절합니다. ‘제사장들’, ‘레위 사람들’, ‘성전 봉사자들’도 정확합니다. נְתִינִים 관련 각주는 해당 용어인 ‘성전 봉사자들’에 붙여야 합니다.
