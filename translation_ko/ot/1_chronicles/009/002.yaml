revisions:
- from: 이제 첫째로 정착한 사람들로서, 자기 소유지의 자기 도시들에 살던 자들은 이스라엘 사람들과 제사장들과 레위 사람들과 성전 봉사자들이었습니다.[a]
  to: 그들의 소유지와 성읍들에 처음 거주한 이들은 이스라엘 사람들과 제사장들과 레위 사람들과 성전 봉사자들이었습니다.[a]
  rationale: 명시되지 않은 담화 표지 ‘이제’를 삭제하고, ‘처음 거주한 이들’로 הָרִאשֹׁנִים과 יֹשְׁבִים의 결합을 자연스럽고 충실하게 옮겼습니다. 소유지와 성읍이라는 원문의 두 장소 표현 및 집단 열거를 유지했으며, 느디님 각주 표지를 해당 번역어 뒤로 옮겼습니다.
