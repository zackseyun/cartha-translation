  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: Now the first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
  footnotes:
  - marker: a
    text: Or, 'the Nethinim,' a traditional transliteration for a class assigned to temple service.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 첫째로 정착한 사람들로서, 자기 소유지의 자기 도시들에 살던 자들은 이스라엘 사람들과 제사장들과 레위 사람들과 성전 봉사자들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘느디님’으로 옮길 수 있으며, 이는 성전 봉사에 배정된 한 부류를 가리키는 전통 음역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים
  english_pob_choice: the inhabitants / who lived
  chosen_korean: 정착한 사람들
  alternatives_korean:
  - 거주하던 사람들
  - 사는 사람들
  lexicon: HALOT
  rationale: ישׁב의 분사로서 ‘살다/거주하다’의 뜻을 살리되, 문맥상 역사적 정착을 드러내는 ‘정착한’이 자연스럽습니다.
- source_word: הָרִאשֹׁנִים
  english_pob_choice: the first
  chosen_korean: 이제 첫째로
  alternatives_korean:
  - 첫 번째로
  - 먼저
  lexicon: HALOT
  rationale: 문두의 시간적·서술적 전환을 반영하면서, ‘first’의 순서감을 한국어에서 부드럽게 전달합니다.
- source_word: בַּאֲחֻזָּתָם
  english_pob_choice: in their possession
  chosen_korean: 자기 소유지
  alternatives_korean:
  - 자기 소유
  - 그들의 기업
  lexicon: HALOT
  rationale: אֲחֻזָּה는 단순 소유가 아니라 세습적 보유지의 뉘앙스를 가지므로, 문맥에 맞게 ‘소유지’로 옮겼습니다.
- source_word: וְהַנְּתִינִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 봉사자들
  alternatives_korean:
  - 느디님
  - 성전 일꾼들
  lexicon: HALOT
  rationale: 기능을 드러내는 번역을 본문에 두고, 전통 음역인 ‘느디님’은 본문보다 각주에 두는 POB 처리와 일치합니다.
theological_decisions:
- issue: יִשְׂרָאֵל의 문맥상 범주
  chosen_reading: ‘이스라엘 사람들’로 옮겨, 제사장·레위 사람·성전 봉사자와 나란히 열거된 넓은 집단을 드러냈습니다.
  alternative_readings:
  - 이스라엘
  - 이스라엘 백성
  rationale: 여기서는 민족명 자체보다 그 구성원들을 가리키는 열거 항목으로 기능하므로, 한국어에서는 인물을 분명히 하는 표현이 더 투명합니다.
  doctrine_reference: 역사-서술 문맥에서의 집합명사 처리
