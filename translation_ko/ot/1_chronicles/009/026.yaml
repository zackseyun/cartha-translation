id: 1CH.9.26
reference: 1 Chronicles 9:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
  footnotes:
  - marker: a
    text: Or 'in faithfulness' / 'faithfully'; the Hebrew emphasizes the reliability or trustworthiness with which these four gatekeepers held their office.
    reason: lexical_alternative
  - marker: b
    text: Or 'treasuries' for 'storehouses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 네 명의 용맹한 문지기들은 레위 사람들이었으며, 충실하게 하나님의 집에 있는 방들과 창고들을 맡아 관리했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶאֱמוּנָה
  english_pob_choice: were entrusted
  chosen_korean: 맡았습니다
  alternatives_korean:
  - 신실하게
  - 믿음으로
  - 충실하게
  lexicon: HALOT
  rationale: 이 문맥에서는 추상명사 אֱמוּנָה의 ‘신실함/신뢰성’이 직무를 맡은 신분으로 풀리므로, 한국어에서는 ‘맡다’로 행정적 책임과 신뢰받는 위임을 자연스럽게 드러냈습니다.
- source_word: גִּבֹּרֵי
  english_pob_choice: mighty
  chosen_korean: 용사
  alternatives_korean:
  - 용맹한 사람들
  - 강한 사람들
  - 두드러진 사람들
  lexicon: HALOT
  rationale: 여기서 גִּבֹּר는 단순한 힘보다 중요한 직무를 수행하는 유력한 사람들을 가리키므로, 성전 문지기라는 직무와 맞는 ‘용사’로 옮겼습니다.
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 대문지기들
  - 문을 지키는 사람들
  - 수문장들
  lexicon: HALOT
  rationale: 성전 봉사자 문맥에서 הַשֹּׁעֲרִים은 표준적으로 ‘문지기들’이 가장 자연스럽고 정확합니다.
- source_word: הַלְוִיִּם
  english_pob_choice: who were Levites
  chosen_korean: 레위 사람들인데
  alternatives_korean:
  - 레위 사람들인
  - 레위인들인데
  - 곧 레위 사람들이었습니다
  lexicon: HALOT
  rationale: 문지기들이 곧 레위인이라는 동격 설명을 한국어에서는 쉼표로 끊어 ‘레위 사람들인데’라고 처리해, 신분 식별을 살리면서 문장을 부드럽게 만들었습니다.
- source_word: הַלְּשָׁכוֹת
  english_pob_choice: the chambers
  chosen_korean: 방들
  alternatives_korean:
  - 방
  - 별실들
  - 부속 방들
  lexicon: HALOT
  rationale: 성전 맥락의 לְשָׁכוֹת은 기능적으로 분리된 실내 공간을 뜻하므로, 한국어에서는 간결한 ‘방들’로 옮기되 복수성을 유지했습니다.
- source_word: הָאֹצְרוֹת
  english_pob_choice: the storehouses
  chosen_korean: 창고들
  alternatives_korean:
  - 곳간들
  - 보물창고들
  - 창고
  lexicon: HALOT
  rationale: אֹצְרוֹת는 저장 공간 전반을 가리키므로, 금전적 의미로 한정되지 않는 ‘창고들’이 문맥상 가장 무난합니다.
theological_decisions:
- issue: 성전 직무의 위임을 나타내는 בֶאֱמוּנָה의 처리
  chosen_reading: ‘맡았습니다’로 옮겨, 신실함을 추상적으로 설명하기보다 실제 관리 책임을 진다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘신실하게’로 직역
  - ‘충실하게’로 번역
  rationale: 히브리어의 신실성 어휘가 이 절에서는 직분 수행의 신뢰성과 연결되므로, 단순 품성 진술보다 직무 위임의 함의를 드러내는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 성전 봉사의 책임성과 청지기 직분 이해
- issue: הֵמָּה הַלְוִיִּם의 동격 관계
  chosen_reading: 문지기들을 별도 집단이 아니라 레위 사람들로 식별하는 동격 구조를 유지했습니다.
  alternative_readings:
  - ‘그들은 레위 사람들이었습니다’
  - ‘레위 사람들, 곧 그들입니다’
  rationale: 본문은 문지기 직무의 정체성을 레위 지파와 연결해 설명하므로, 그 연결을 약화하지 않도록 동격을 분명히 했습니다.
  doctrine_reference: 레위인의 성전 봉사 배치
