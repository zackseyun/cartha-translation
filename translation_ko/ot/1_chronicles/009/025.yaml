  source_fidelity: ‘자기 마을들에 있으면서 … 와야 했습니다’는 마을에 있는 상태로 와야 한다는 부자연스럽고 상충된 뜻으로 읽힙니다. בְּחַצְרֵיהֶם은 형제들이 거주하는 장소를 수식합니다. 또한 לְשִׁבְעַת הַיָּמִים의 기본 뜻은 ‘칠 일 동안’이며, 교대 주기라는 해석은 각주로 보존하는 것이 안전합니다.
  naturalness: 수정문은 ‘마을에 사는’이 형제들을 자연스럽게 수식하게 하고, 행정·봉사 문맥에 맞는 현대 한국어 합쇼체 서술을 유지합니다.
  terminology: ‘형제들’, ‘마을’, ‘이들과 함께’를 유지하여 원문의 친족/동료 관계와 지시어를 과도하게 특정하지 않았습니다. ‘오도록 되어 있었습니다’는 문맥상 예정된 봉사를 나타내되 강한 법규 명령으로 단정하지 않습니다.
