base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
  footnotes:
  - marker: a
    text: Or 'for seven days'; the Hebrew phrase likely refers to a seven-day rotation of service.
    reason: lexical_alternative
  - marker: b
    text: Literally 'with these,' referring to those already serving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 형제들, 곧 자기 마을에 사는 이들은 때때로 칠 일 동안 이들과 함께 오도록 되어 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칠 일마다’. 히브리어 표현은 칠 일 동안의 봉사 기간을 뜻할 수 있으며, 칠 일 단위의 교대를 가리킨다고 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이들과 함께’입니다. ‘이들’은 앞 문맥에서 언급된 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제들은
  alternatives_korean:
  - 그들의 친족들은
  - 그들과 같은 지파 사람들은
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 형제들’이므로 기본 의미를 살리고, 이 문맥의 친족적·동료적 확장 가능성은 주석 없이도 ‘형제들’이 충분히 전달합니다.
- source_word: בְּחַצְרֵיהֶם
  english_pob_choice: in their villages
  chosen_korean: 자기 마을들에 있으면서
  alternatives_korean:
  - 자기 정착지들에 있으면서
  - 자기 뜰들에 있으면서
  lexicon: HALOT
  rationale: Chronicles의 거주 맥락에서는 חָצֵר를 ‘마을들/정착지들’로 옮기는 것이 자연스럽고, 성전 뜰의 의미로 오해될 가능성을 줄입니다.
- source_word: לְשִׁבְעַת הַיָּמִים
  english_pob_choice: in every seven days
  chosen_korean: 매 칠 일마다
  alternatives_korean:
  - 칠 일 동안
  - 칠 일마다
  - 일주일마다
  lexicon: HALOT
  rationale: 본문은 7일 간격의 순환 근무를 가리키므로 ‘매 칠 일마다’가 원문의 반복 주기를 가장 직접적으로 드러냅니다.
- source_word: עִם אֵלֶּה
  english_pob_choice: with these
  chosen_korean: 이들과 함께
  alternatives_korean:
  - 이들과
  - 이 사람들과 함께
  lexicon: HALOT
  rationale: 직역의 ‘with these’는 앞서 언급된 근무 중인 사람들을 가리키므로, 한국어에서는 대상을 분명히 하되 지시어의 관계를 유지한 ‘이들과 함께’로 옮겼습니다.
theological_decisions:
- issue: 근무 교대의 규범적 성격
  chosen_reading: 이 구절은 레위인/문지기들의 정해진 교대 근무를 서술하는 행정 문장으로 읽었습니다.
  alternative_readings:
  - 단순 방문 또는 자발적 동행으로 읽는 해석
  - 예배적 순번보다 일반적 거주 이동으로 읽는 해석
  rationale: ‘매 칠 일마다’와 ‘때때로’가 반복적 의무를 가리키므로, 서술을 제도화된 교대 규정으로 유지하는 것이 문맥에 가장 부합합니다.
  doctrine_reference: 역사서 문맥의 제의 질서와 성전 봉사 규정
