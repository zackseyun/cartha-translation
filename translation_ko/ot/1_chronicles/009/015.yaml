theological_decisions:
- issue: 족보 연결어의 압축 여부
  chosen_reading: 각 인명 사이의 접속을 모두 살려 족보 목록의 연속성을 드러냈습니다.
  alternative_readings:
  - 인명만 나열하고 접속사는 생략함
  - 쉼표 위주로만 처리함
  rationale: 원문과 영어 POB가 모두 연속 열거를 보존하므로, 한국어도 ‘그리고’와 쉼표로 순차 관계를 분명히 했습니다.
  doctrine_reference: 족보 본문의 문자적-기록적 성격 보존
