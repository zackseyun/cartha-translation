  source_fidelity: 히브리어의 접속사와 인명 열거 및 맛다냐의 계보(미가–스그리–아삽)는 대체로 반영되어 있습니다. 그러나 현재 문장은 ‘미가의 아들, 스그리의 아들, 아삽의 아들 맛다냐’로 읽혀 각 ‘아들’ 관계의 방향과 수식 범위가 불분명합니다. 히브리어의 연쇄는 ‘맛다냐, 미가의 아들, 스그리의 아들, 아삽의 아들’입니다.
