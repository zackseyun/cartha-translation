  text: 또 박박갈과 헤레스와 갈랄과, 아삽의 아들 스그리의 아들 미가의 아들 맛다냐였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בן은 족보에서 더 먼 계통의 후손을 뜻할 수도 있으나, 여기서는 족보 사슬을 따라 ‘아들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 히브리어 이름은 מִיכָא(미카)이며, 흔히 ‘미가’로 표기되는 מִיכָה와 철자가 다릅니다.
    reason: lexical_alternative
