  text: וּ/בַקְבַּקַּ֥ר חֶ֖רֶשׁ וְ/גָלָ֑ל וּ/מַתַּנְיָה֙ בֶּן מִיכָ֔א בֶּן זִכְרִ֖י בֶּן אָסָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
  footnotes:
  - marker: a
    text: Hebrew "son of" can sometimes denote a more remote descendant, but here it is rendered literally in the genealogical chain.
    reason: lexical_alternative
  - marker: b
    text: The name "Mica" reflects the Hebrew form here; some readers may expect the more familiar "Micah."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바크박카르와 헤레스와 갈랄과, 미가의 아들, 스그리의 아들, 아삽의 아들 맛다냐였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בן은 족보에서 더 먼 계통의 후손을 뜻할 수도 있으나, 여기서는 족보 사슬을 그대로 따라 직역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 מִיכָא는 흔한 ‘미가’와는 다른 이름 형식으로, 본문 형식을 구별해 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
