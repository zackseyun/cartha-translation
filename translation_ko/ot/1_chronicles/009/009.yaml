  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶם֙ לְ/תֹ֣לְדוֹתָ֔/ם תְּשַׁ֥ע מֵא֖וֹת וַ/חֲמִשִּׁ֣ים וְ/שִׁשָּׁ֑ה כָּל אֵ֣לֶּה אֲנָשִׁ֔ים רָאשֵׁ֥י אָב֖וֹת לְ/בֵ֥ית אֲבֹתֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
  footnotes:
  - marker: a
    text: Or “by their genealogies.” The Hebrew term refers to lines of descent or family records.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “heads of fathers’ houses,” a clan-based genealogical designation.
    reason: cultural_note
translation:
  language: ko
  text: 그들의 형제들은 그들의 계보에 따르면 아홉백쉰여섯 명이었습니다. 이들은 모두 그들 조상 집안에 속한 가문의 우두머리들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계보’는 출생과 혈통의 계승 관계, 또는 그것을 기록한 족보를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가문의 우두머리’는 히브리어의 족보·씨족 조직을 나타내는 표현입니다. ‘조상 집안’은 개인의 가정이 아니라 부계로 이어진 집안 단위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 일가들
  lexicon: HALOT
  rationale: 족보 문맥에서 אָח는 혈연 공동체를 가리킬 수 있지만, 한국어에서는 ‘형제들’이 원문 kinship 용어를 가장 직접적으로 살립니다.
- source_word: לְתֹלְדוֹתָם
  english_pob_choice: according to their generations
  chosen_korean: 그들의 족보대로
  alternatives_korean:
  - 그들의 계보에 따라
  - 그들의 가문 기록대로
  lexicon: HALOT
  rationale: תּוֹלְדוֹת는 여기서 출생·계승의 줄기와 족보 기록을 가리키므로, 한국어 성경 문맥에서 가장 투명한 ‘족보’로 옮겼습니다.
- source_word: רָאשֵׁי אָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 아버지 가문의 우두머리들
  alternatives_korean:
  - 조상 집안의 우두머리들
  - 아비 집의 수장들
  lexicon: HALOT
  rationale: 히브리어의 기술적 족장 표현을 살리기 위해 ‘아버지 가문’ 구조를 유지하되, 한국어에서는 이해를 돕는 ‘우두머리들’을 사용했습니다.
- source_word: לְבֵית אֲבֹתֵיהֶם
  english_pob_choice: in their fathers’ households
  chosen_korean: 자기 아버지의 집안에서
  alternatives_korean:
  - 그들의 조상 집안에서
  - 그들의 아버지의 가문 안에서
  lexicon: HALOT
  rationale: 앞선 표현과 중복을 피하면서도 בית/household의 가문·가계적 의미를 자연스럽게 드러내기 위해 ‘집안’으로 옮겼습니다.
theological_decisions:
- issue: 족보 숫자와 신원 표기 방식
  chosen_reading: 이 절은 개인의 서술이 아니라 족보적 집단과 가문 질서를 기록한 것으로, 수사적으로 평이하게 풀되 기술적 의미는 유지했습니다.
  alternative_readings:
  - ‘형제들’을 ‘친족들’로 완화하여 집단적 의미를 강조하는 읽기
  - ‘우두머리들’을 ‘지도자들’로 일반화하는 읽기
  rationale: 역대기는 족보와 가문 질서를 드러내는 책이므로, 문화적 제도를 흐리지 않도록 기술적 표현을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역대기 족보의 역사·공동체적 증언
