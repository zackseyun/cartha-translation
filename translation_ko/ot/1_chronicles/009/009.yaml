    rationale: 히브리어 אָבוֹת는 이 문맥에서 조상·부계 가문을 나타내는 복수형이며, 족보상의 집안 단위를 뜻합니다.
  - severity: medium
    issue: 후반절의 ‘자기 아버지의 집안에서 아버지 가문의 우두머리들’이 원문의 가문 구조를 불명확하고 부자연스럽게 만듭니다.
    rationale: ‘가문의 우두머리들’과 그들이 속한 ‘조상 집안’을 구분하면 רָאשֵׁי אָבוֹת와 לְבֵית אֲבֹתֵיהֶם의 관계가 더 명료해집니다.
