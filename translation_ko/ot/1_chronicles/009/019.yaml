  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
  footnotes:
  - marker: a
    text: Or 'keepers of the gates of the tent.' The Hebrew literally says 'keepers of the thresholds of the tent.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 고라의 아들 고레의 아들 아비아삽의 아들 살룸과, 그의 아버지의 집에서 나온 그의 형제들 곧 고라 사람들은 회막의 문설주의 일을 맡은 직무를 담당했으며, 여호와의 진영의 문을 지키던 그들의 조상들도 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘성막의 문설주’ 또는 ‘장막의 문지방’을 뜻합니다.
    reason: source_note
  - marker: b
    text: 히브리어 ‘여호와’는 신적 이름 YHWH를 나타냅니다.
    reason: ot_citation
lexical_decisions:
- source_word: וְשַׁלּוּם
  english_pob_choice: And Shallum
  chosen_korean: 그리고 … 살룸
  alternatives_korean:
  - 이제 … 살룸
  - 또 살룸
  lexicon: HALOT
  rationale: 앞말과 이어지는 단순 접속이므로 ‘그리고’로 처리해 연결성을 살렸습니다.
- source_word: הַסִּפִּים
  english_pob_choice: the thresholds
  chosen_korean: 문설주의
  alternatives_korean:
  - 문지방의
  - 문턱의
  - 문설주의
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘문설주/문지방’에 해당하므로, 문맥상 ‘문’으로 넓히지 않고 구체적 이미지인 ‘문설주’로 옮겼습니다.
- source_word: לָאֹהֶל
  english_pob_choice: of the tent
  chosen_korean: 회막의
  alternatives_korean:
  - 장막의
  - 성막의
  - 천막의
  lexicon: HALOT
  rationale: 원문은 단순히 ‘tent’이지만, 이 문맥의 성소 가리킴을 한국어에서 자연스럽고 분명하게 전달하기 위해 ‘회막’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주
  lexicon: HALOT
  rationale: 이 본문의 영어 POB는 본문에서 ‘the LORD’로 옮기고 각주로 YHWH를 밝히므로, 한국어 본문도 통상적 성경 가독성을 위해 ‘여호와’로 처리했습니다.
theological_decisions:
- issue: 성소 용어를 ‘tent’의 문자형과 문맥 기능 사이에서 어떻게 처리할지
  chosen_reading: ‘회막’으로 옮기되, ‘문설주’와의 병렬을 유지해 성소 출입 관리의 구체성을 살렸습니다.
  alternative_readings:
  - 장막
  - 성막
  - 천막
  rationale: 원문은 성소를 가리키는 동시에 단어 자체는 ‘tent’이므로, 한국어에서는 독자 친화성과 문맥의 성소 의미를 함께 살리는 표현이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, original-language primacy over translation tradition
- issue: YHWH 표기
  chosen_reading: 본문에서는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 제공된 영어 POB의 본문 운용을 따라 한국어 독자에게 즉시 인지되는 전통적 표기를 유지했습니다. 본문 각주로는 원문 신명 표기를 설명할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
