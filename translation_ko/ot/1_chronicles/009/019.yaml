  naturalness: 수정문은 한국어 계보 표현을 자연스럽게 유지하면서, 주어인 살룸과 그의 형제들 및 고라 사람들의 관계를 명료하게 드러냅니다. ‘있었습니다’처럼 역할을 흐리는 표현 대신 직무를 수행했다는 뜻을 분명히 했습니다.
