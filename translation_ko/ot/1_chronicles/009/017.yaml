base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
  footnotes:
  - marker: a
    text: Or 'their kinsmen'; the Hebrew literally says 'their brothers,' which in such lists can refer either to biological brothers or to fellow clan members.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지기들은 살룸과 악굽과 달몬과 아히만과 그들의 형제들이었습니다.[a] 살룸이 우두머리였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 친족들’입니다. 히브리어는 문자적으로 ‘그들의 형제들’이라고 하며, 이런 목록에서는 혈연 형제나 같은 씨족 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 성문지기들
  - 문을 지키는 자들
  lexicon: HALOT
  rationale: 성전 맥락의 ‘gatekeepers’는 문을 지키는 직분을 가리키므로, 간결하고 현대적인 ‘문지기들’로 옮겼습니다.
- source_word: שַׁלּוּם / עַקּוּב / טַלְמֹן / אֲחִימָן
  english_pob_choice: Shallum / Akkub / Talmon / Ahiman
  chosen_korean: 셀룸 / 악굽 / 달몬 / 아히만
  alternatives_korean:
  - 샬룸 / 앗굽 / 탈몬 / 아히만
  lexicon: 고유명사
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역하되, 한국어 성서 전통에서 널리 정착된 형태가 있으면 우선했습니다.
- source_word: אֲחִיהֶם
  english_pob_choice: their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 동족들
  lexicon: HALOT
  rationale: 히브리어의 직역을 살리되, 족속·계보 목록에서 친족 집단을 가리킬 수 있는 넓은 뜻도 함께 유지했습니다.
- source_word: הָרֹאשׁ
  english_pob_choice: the chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 수장
  - 머리
  lexicon: HALOT
  rationale: 단순한 ‘머리’보다 지위와 통솔권을 분명히 드러내는 현대 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: 목록에서의 אֲחִיהֶם의 범위
  chosen_reading: ‘그들의 형제들’로 옮기되, 혈연 형제에만 한정하지 않고 같은 집단에 속한 구성원까지 열려 있는 표현으로 유지했습니다.
  alternative_readings:
  - ‘그들의 친족들’로 완화
  - ‘그들과 함께한 사람들’로 해석
  rationale: 족보·직분 목록에서 ‘형제들’은 문자적으로는 형제를 뜻하지만, 문맥상 동족/친족 집단을 포함할 수 있으므로 본문이 지닌 범위를 좁히지 않았습니다.
  doctrine_reference: 족보 및 성전 직분 목록의 문맥적 용법
