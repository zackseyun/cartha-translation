  text: עוּתַ֨י בֶּן עַמִּיה֤וּד בֶּן עָמְרִי֙ בֶּן אִמְרִ֣י בֶן בני/מן בְּנֵי פֶ֖רֶץ בֶּן יְהוּדָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
  footnotes:
  - marker: a
    text: 'Hebrew textual tradition here is difficult; the word rendered ''Bani'' may alternatively be read ''from,'' which would yield: ''son of Imri, from the sons of Perez son of Judah.'' The main text follows the genealogical-name reading because it best fits the sequence of names.'
    reason: textual_variant
translation:
  language: ko
  text: 웃대는 아미훗의 아들이요, 오므리의 아들이요, 임리의 아들이요, 바니의 아들이요, 베레스의 자손인 유다의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문 전승이 난해합니다. 여기서는 연속된 인명으로 읽는 본문을 따랐지만, '바니'를 '에서/부터'로 읽으면 '임리의 아들, 베레스의 자손인 유다의 아들'이 됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  english_pob_choice: Uthai
  chosen_korean: 웃대
  alternatives_korean:
  - 우대
  - 우타이
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 한국어 음역으로 옮기되, 현대 표기에서 읽기 쉬운 형태인 '웃대'를 택했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - ~의 아들
  - ~의 후손
  lexicon: HALOT
  rationale: 족보 문맥의 בֶּן은 직접적으로 '아들'이 가장 투명하므로, 반복 구조를 살려 '아들'로 옮겼습니다.
- source_word: בני/מן
  english_pob_choice: Bani / from
  chosen_korean: 바니
  alternatives_korean:
  - 바니
  - from(에서/부터)
  lexicon: HALOT
  rationale: 본문의 모호한 형태는 인명 '바니'로 읽는 본문을 따르되, 본문 흐름에 맞는 족보 연결을 유지했습니다.
theological_decisions:
- issue: 족보의 압축된 계보 표현
  chosen_reading: '''베레스의 자손인 유다의 아들''로 옮겨, 베레스-유다 계열 소속을 한 문장 안에서 모두 드러냈습니다.'
  alternative_readings:
  - '''유다의 베레스 자손'''
  - '''유다 지파의 베레스 계열'''
  rationale: 히브리어는 계보를 압축해 제시하므로, 직역만으로는 소속 관계가 흐려질 수 있습니다. 한국어에서는 관계를 자연스럽게 풀되 원문의 계보 정보를 유지했습니다.
  doctrine_reference: 족보 본문 해석 원칙
