  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
  footnotes:
  - marker: a
    text: 'Hebrew textual tradition here is difficult; the word rendered ''Bani'' may alternatively be read ''from,'' which would yield: ''son of Imri, from the sons of Perez son of Judah.'' The main text follows the genealogical-name reading because it best fits the sequence of names.'
    reason: textual_variant
translation:
  language: ko
  text: 웃대는 암미훗의 아들이요, 오므리의 아들이요, 임리의 아들이요, 바니의 아들이며, 유다의 아들 베레스의 자손 가운데 속한 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문 전승은 이 부분에서 난해합니다. 본문은 연속된 인명으로 읽어 '바니'를 따랐습니다. 그러나 이를 '에서/부터'로 읽으면, '임리의 아들이며, 유다의 아들 베레스의 자손 가운데 속한 사람입니다'라는 뜻이 됩니다.
    reason: textual_variant
