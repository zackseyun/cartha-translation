translation:
  language: ko
  text: 그리고 아다야는 여로함의 아들이고, 여로함은 바스훌의 아들이며, 바스훌은 말기야의 아들입니다. 또 마아새는 아디엘의 아들이고, 아디엘은 야세라의 아들이며, 야세라는 므술람의 아들이고, 므술람은 므실레밋[a]의 아들이며, 므실레밋은 임멜의 아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְשִׁלֵּמִית는 여기서 ‘므실레밋’으로 옮겼습니다. 이와 관련된 이름 형태가 다른 곳에서는 ‘므실레못’으로 나타납니다.
    reason: lexical_alternative
