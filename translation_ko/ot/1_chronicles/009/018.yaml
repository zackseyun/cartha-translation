source:
  edition: WLC
  text: וְֽ/עַד הֵ֔נָּה בְּ/שַׁ֥עַר הַ/מֶּ֖לֶךְ מִזְרָ֑חָ/ה הֵ֚מָּה הַ/שֹּׁ֣עֲרִ֔ים לְ/מַחֲנ֖וֹת בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
  footnotes:
  - marker: a
    text: Or 'Until now' or 'Up to that point.' The Hebrew idiom can be understood as a temporal note of continuation.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the camps' or 'for the companies of the sons of Levi.' The Hebrew term can denote camps or organized divisions depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때까지 그들은 동쪽에 있는 왕의 문에 있었습니다.[a] 그들은 레위 자손의 진영들을 담당한 문지기들이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지금까지’, ‘그 시점까지’로도 옮길 수 있습니다. 히브리어 관용구는 시간의 지속을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘진들’, ‘부대들’로도 옮길 수 있습니다. 히브리어 מַחֲנוֹת는 문맥에 따라 ‘진’, ‘집단’, ‘편제된 무리’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  english_pob_choice: Until then
  chosen_korean: 그때까지
  alternatives_korean:
  - 지금까지
  - 그 시점까지
  lexicon: HALOT
  rationale: 반복된 상태가 특정 시점까지 이어졌다는 뜻을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְּשַׁעַר הַמֶּלֶךְ מִזְרָחָה
  english_pob_choice: at the king’s gate on the east
  chosen_korean: 동쪽에 있는 왕의 문에
  alternatives_korean:
  - 왕의 동쪽 문에
  - 동쪽 왕문에
  lexicon: HALOT
  rationale: בְּ는 위치를 나타내므로 ‘~에’로 풀고, מִזְרָחָה의 방향성을 살려 동쪽 위치를 분명히 했습니다.
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 문을 지키는 자들
  - 성문지기들
  lexicon: HALOT
  rationale: 직무를 분명히 드러내는 일반적 한국어로 옮기되, 성전/행정 문맥의 전문성을 해치지 않도록 했습니다.
- source_word: לְמַחֲנוֹת בְּנֵי לֵוִי
  english_pob_choice: for the camps of the sons of Levi
  chosen_korean: 레위 자손의 진을 위한
  alternatives_korean:
  - 레위 자손의 진들을 위한
  - 레위 자손의 부대들을 위한
  lexicon: HALOT
  rationale: מַחֲנוֹת의 기본 의미인 ‘진’이 조직된 집단을 가리키므로, POB의 ‘camps’를 따라 군사적/행정적 집단성을 보존했습니다.
theological_decisions:
- issue: מַחֲנוֹת의 집단성 표현
  chosen_reading: ‘진’으로 옮겨 레위 자손의 조직된 소속 집단을 나타냈습니다.
  alternative_readings:
  - ‘부대’로 옮겨 행정 단위를 강조할 수 있습니다.
  - ‘캠프’로 음역성 표현을 택할 수 있습니다.
  rationale: 문맥은 단순한 숙영지가 아니라 레위 자손의 편제된 집단을 가리키므로, 한국어 성경에서도 의미 범위를 넓게 보존하는 쪽이 적절합니다.
  doctrine_reference: 민 2장, 대상 23–26장의 레위인 조직 문맥
- issue: 왕의 문과 동쪽 위치의 결합
  chosen_reading: 왕의 문이 동쪽에 있다는 공간 정보를 하나의 절로 간결하게 제시했습니다.
  alternative_readings:
  - ‘왕의 동쪽 문’으로 합성할 수 있습니다.
  - ‘동쪽 왕문’으로 더 압축할 수 있습니다.
  rationale: 히브리어의 위치 표지를 과도하게 해석하지 않고, 단순한 지리적 표기임을 유지했습니다.
  doctrine_reference: 문맥상 지리/행정 기록
