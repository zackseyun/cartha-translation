  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
  footnotes:
  - marker: a
    text: Eshbaal is called Ish-bosheth in 2 Samuel 2:8 and related passages.
    reason: alternative_reading
translation:
  language: ko
  text: 네르가 기스를 낳았고, 기스는 사울을 낳았으며, 사울은 요나단과 말기-수아와 아비나답과 에스바알을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에스바알은 사무엘하 2:8 등 관련 본문에서 이스보셋으로 불립니다.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 계보 문맥에서 히필 ילד은 ‘낳다/아버지가 되다’의 계보적 의미이므로, 현대 한국어에서 자연스럽고 간결한 ‘낳았습니다’로 옮겼습니다.
- source_word: וְ/נֵר
  english_pob_choice: Ner
  chosen_korean: 네르
  alternatives_korean:
  - 느르
  - 너르
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사 נֵר를 현대 한국어 음역 원칙에 따라 네르로 옮겼습니다.
- source_word: וְ/קִ֖ישׁ
  english_pob_choice: Kish
  chosen_korean: 기스
  alternatives_korean:
