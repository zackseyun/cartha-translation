  lexicon: 고유명사 음역
  rationale: 히브리어 קִישׁ는 통용 표기보다 원음에 가까운 현대 음역으로 기스로 옮겼습니다.
- source_word: מַלְכִּי שׁוּעַ
  english_pob_choice: Malchi-shua
  chosen_korean: 말기-수아
  alternatives_korean:
  - 말기수아
  - 말기-슈아
  lexicon: 고유명사 음역
  rationale: 두 요소로 이루어진 이름의 결합성을 살리기 위해 하이픈을 유지하고, 음역은 현대 한국어 표기로 옮겼습니다.
- source_word: אֶשְׁבָּעַל
  english_pob_choice: Eshbaal
  chosen_korean: 에스바알
  alternatives_korean:
