base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
  footnotes:
  - marker: a
    text: Eshbaal is called Ish-bosheth in 2 Samuel 2:8 and related passages.
    reason: alternative_reading
translation:
  language: ko
  text: 넬이 기스를 낳았고, 기스는 사울을 낳았으며, 사울은 요나단, 말기수아, 아비나답, 에스바알을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에스바알은 사무엘하 2:8 등 관련 본문에서 이스보셋으로 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 계보 문맥에서 히필 ילד은 ‘낳다/아버지가 되다’의 계보적 의미이므로, 현대 한국어에서 자연스럽고 간결한 ‘낳았습니다’로 옮겼습니다.
- source_word: וְ/נֵר
  english_pob_choice: Ner
  chosen_korean: 네르
  alternatives_korean:
  - 느르
  - 너르
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사 נֵר를 현대 한국어 음역 원칙에 따라 네르로 옮겼습니다.
- source_word: וְ/קִ֖ישׁ
  english_pob_choice: Kish
  chosen_korean: 기스
  alternatives_korean:
  - 키쉬
  lexicon: 고유명사 음역
  rationale: 히브리어 קִישׁ는 통용 표기보다 원음에 가까운 현대 음역으로 기스로 옮겼습니다.
- source_word: מַלְכִּי שׁוּעַ
  english_pob_choice: Malchi-shua
  chosen_korean: 말기-수아
  alternatives_korean:
  - 말기수아
  - 말기-슈아
  lexicon: 고유명사 음역
  rationale: 두 요소로 이루어진 이름의 결합성을 살리기 위해 하이픈을 유지하고, 음역은 현대 한국어 표기로 옮겼습니다.
- source_word: אֶשְׁבָּעַל
  english_pob_choice: Eshbaal
  chosen_korean: 에스바알
  alternatives_korean:
  - 이스보셋
  lexicon: 고유명사 음역
  rationale: 역대기의 히브리 본문이 אֶשְׁבָּעַל을 읽으므로 본문형을 따라 에스바알로 옮기고, 사무엘서의 다른 이름형은 본문 밖에서만 고려했습니다.
theological_decisions:
- issue: 역대기의 족보가 사무엘서의 다른 이름형과 만나는 지점
  chosen_reading: 본문의 에스바알을 그대로 유지하고, 사무엘서의 이스보셋과의 대응은 본문 밖에서만 인지하도록 합니다.
  alternative_readings:
  - 이스보셋으로 조화
  - 이름을 둘 다 본문에 병기
  rationale: 역대기의 서기관 본문을 직접 반영해야 하므로, 다른 전승의 이름으로 평준화하지 않고 본문 형태를 보존했습니다.
  doctrine_reference: 본문비평/정경 내 병행 전승
