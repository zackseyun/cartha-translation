  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'to/for the four winds'; here 'winds' means the four directions or quarters.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지기들은 동쪽, 서쪽, 북쪽, 남쪽의 네 방향에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 바람들’을 뜻하지만, 여기서는 동서남북의 네 방위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  english_pob_choice: at the four directions
  chosen_korean: 네 방향에
  alternatives_korean:
  - 네 바람에
  - 네 모퉁이에
  - 네 방위에
  lexicon: HALOT
  rationale: רוּחוֹת는 문자적으로는 ‘바람들’이지만, 이어지는 동서남북과 함께 공간적 방위를 뜻하므로 ‘네 방향’이 가장 자연스럽습니다.
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 성문지기들
  - 문을 지키는 자들
  lexicon: HALOT
  rationale: 성전 맥락의 מקצוע적 명칭이지만, 본절은 단순한 직무 표지로 쓰이므로 현대 한국어에서 바로 이해되는 ‘문지기들’이 적절합니다.
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  english_pob_choice: east, west, north, and south
  chosen_korean: 동쪽, 서쪽, 북쪽, 남쪽
  alternatives_korean:
  - 동, 서, 북, 남
  - 해 뜨는 쪽, 바다 쪽, 북쪽, 남쪽
  lexicon: HALOT
  rationale: 열거된 히브리어 방위어를 한국어의 표준 방위 표현으로 옮겨, 목록 구조를 그대로 살렸습니다.
theological_decisions:
- issue: רוּחוֹת의 의미를 ‘바람’이 아니라 방위로 옮길지 여부
  chosen_reading: 문맥상 ‘바람들’의 문자성을 살리기보다, 본문이 가리키는 지리적 네 방위를 직접 드러내는 번역을 택했습니다.
  alternative_readings:
  - 네 바람들
  - 네 바람의 방향
  rationale: 히브리어 표현의 관용적 의미가 이어지는 방위 목록에 의해 명확하므로, 독자가 본문의 기능을 바로 이해하도록 옮기는 것이 적절합니다.
  doctrine_reference: 본문 해석의 문맥 우선 원칙
