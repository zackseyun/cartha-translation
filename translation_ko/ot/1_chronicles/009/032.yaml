id: 1CH.9.32
reference: 1 Chronicles 9:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן בְּנֵ֧י הַ/קְּהָתִ֛י מִן אֲחֵי/הֶ֖ם עַל לֶ֣חֶם הַֽ/מַּעֲרָ֑כֶת לְ/הָכִ֖ין שַׁבַּ֥ת שַׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
  footnotes:
  - marker: a
    text: Traditionally 'the showbread' or 'the bread of the Presence.' The Hebrew literally refers to bread arranged or set out in order.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 고핫 자손 중에서 그들의 형제들 가운데 일부는 차림빵을 맡아, 안식일마다 그것을 준비하는 일을 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘진설병’ 또는 ‘여호와 앞에 차려 놓은 빵’이라고도 합니다. 히브리어는 문자적으로 ‘배열된/차려 놓은 빵’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And some of
  chosen_korean: 그리고 ... 가운데 일부는
  alternatives_korean:
  - 그리고 ... 중에서
  - 그리고 일부는
  lexicon: HALOT
  rationale: 부분집합을 나타내는 מן의 뜻을 살려, 전체 집단 중 일부를 뽑아낸다는 의미를 자연스럽게 드러냈습니다.
- source_word: בְּנֵי הַקְּהָתִי
  english_pob_choice: the sons of the Kohathites
  chosen_korean: 고핫 자손
  alternatives_korean:
  - 고핫 사람들의 자손
  - 고핫 족속의 자손
  lexicon: HALOT
  rationale: 히브리어의 씨족/가문 표현을 한국어 성경에서 익숙한 족보형 어법으로 옮기되, 과도하게 풀지 않았습니다.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  english_pob_choice: the bread of the arrangement
  chosen_korean: 차림빵
  alternatives_korean:
  - 진설빵
  - 진설된 빵
  - 차려 놓은 빵
  lexicon: HALOT
  rationale: 전통적 교회 용어보다 원문이 가리키는 '차려 놓은/배열된 빵'의 의미를 더 직접적으로 살렸고, 조탁된 제의 용어로도 읽히도록 했습니다.
- source_word: שַׁבַּת שַׁבָּת
  english_pob_choice: Sabbath by Sabbath
  chosen_korean: 안식일마다
  alternatives_korean:
  - 안식일마다 반복해서
  - 안식일마다 차례로
  lexicon: HALOT
  rationale: 반복 구조의 분배적 뜻을 한국어의 자연스러운 시간 부사로 옮겼습니다.
theological_decisions:
- issue: 제사장/성막 직무 용어의 번역 수위
  chosen_reading: 직무의 기능을 설명적으로 유지하되, 원문이 암시하는 성막 질서와 배분을 흐리지 않도록 했습니다.
  alternative_readings:
  - 더 전통적인 제의어휘로 고정하는 번역
  - 현대적 행정 표현으로만 풀어 쓰는 번역
  rationale: 본문은 역사 서술 속 레위인 직무 분담을 말하므로, 제의적 맥락을 보존하면서도 현대 독자가 이해할 수 있게 옮기는 것이 적절합니다.
  doctrine_reference: 민수기 4장; 레위기 24:5-9
- issue: '''형제들''의 범위'
  chosen_reading: 그들의 형제들
  alternative_readings:
  - 그들의 친족들
  - 그들 동족들
  rationale: 히브리어 אָחֵיהֶם는 직접적으로 '형제들'을 뜻하므로, 성별-포괄적 재해석보다 원문 직결 표현을 유지했습니다.
  doctrine_reference: HALOT / WLC 문맥
