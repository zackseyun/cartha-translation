revisions:
- from: 그리고 고핫 자손 중에서 그들의 형제들 가운데 일부는 차림빵을 맡아, 안식일마다 그것을 준비하는 일을 했습니다.[a]
  to: 그리고 고핫 자손 가운데 그들의 형제들 중 일부는 차려 놓은 빵을 맡아 안식일마다 그것을 준비했습니다.[a]
  rationale: 비정착 합성어인 ‘차림빵’을 원문의 배열·차림 의미가 드러나는 ‘차려 놓은 빵’으로 고쳤습니다. 담당 직무(‘맡아’)와 안식일마다 반복되는 준비는 유지했습니다. 각주는 전통적 명칭과 히브리어의 문자적 의미를 구별하여 제시했습니다.
  reviewer_model: gpt-5.6-terra
