  source_fidelity: 본문의 계보 관계와 인명 배열은 대체로 원문에 충실합니다. 그러나 야라(יַעְרָה)는 한국어 음역에서 ‘야아라’로 옮기는 편이 원문의 모음 구조와 통용되는 성서 인명 표기에 더 적절하며, זִמְרִי는 ‘시므리’로 바로잡는 것이 좋습니다. 가장 중요한 문제로, 주석의 평행 본문 참조는 열왕기상이 아니라 역대상 8:36입니다.
