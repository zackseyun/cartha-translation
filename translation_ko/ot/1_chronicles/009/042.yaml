  terminology: 아하스, 알레멧, 아스마웻, 모사는 통용되는 한국어 성서 인명 표기와 잘 맞습니다. 야아라와 시므리로 수정하여 인명 표기의 정확성과 일관성을 높였습니다. 본문의 ‘낳다’는 남성 계보에서 히브리어 הוֹלִיד의 부친 관계를 관습적으로 전달합니다.
