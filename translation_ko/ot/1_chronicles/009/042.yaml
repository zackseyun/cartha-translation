base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
  footnotes:
  - marker: a
    text: The parallel genealogy in 1 Chronicles 8:36 reads 'Jehoaddah' instead of 'Jarah.' The Chronicles manuscripts here read 'Jarah,' which is retained in the main text.
    reason: textual_variant
translation:
  language: ko
  text: 아하스는 야아라[a]를 낳았고, 야아라는 알레멧과 아스마웻과 시므리를 낳았으며, 시므리는 모사를 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대상 8:36의 평행 계보에는 ‘야아라’ 대신 ‘여호앗다’가 나옵니다. 이 절의 역대기 사본들은 ‘야아라’를 읽으므로, 본문에는 이를 유지했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았고 / 낳았으며
  alternatives_korean:
  - 아버지가 되었습니다
  - 생겨났습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 히필 ילד은 ‘아버지가 되다/낳다’의 의미이므로, 현대 한국어에서는 자연스럽고 계보 관계를 분명히 하는 ‘낳다’로 옮겼습니다.
- source_word: יַעְרָה
  english_pob_choice: Jarah
  chosen_korean: 야라
  alternatives_korean:
  - 자라
  - 야라
  lexicon: 고유명사 음역
  rationale: 히브리어 인명은 번역하지 않고 음역하는 것이 원문 대응에 가장 충실하므로, 영어 POB의 Jarah에 해당하는 형태를 한국어 음역으로 옮겼습니다.
- source_word: עָלֶמֶת / עַזְמָוֶת / זִמְרִי / מוֹצָא
  english_pob_choice: Alemeth / Azmaveth / Zimri / Moza
  chosen_korean: 알레멧 / 아스마웻 / 즈므리 / 모사
  alternatives_korean:
  - 알레메트 / 아즈마벳 / 지므리 / 모자
  lexicon: 고유명사 음역
  rationale: 본절의 나머지 인명도 원문 형태를 따라 음역했으며, 기존 관용형을 무조건 따르기보다 히브리어 자음 구조를 비교적 직접적으로 반영했습니다.
theological_decisions:
- issue: 족보 동사의 반복을 어떻게 처리할 것인가
  chosen_reading: 각 세대의 관계를 분명히 드러내기 위해 ‘낳다’를 반복했습니다.
  alternative_readings:
  - 한 번만 반복하고 뒤는 생략하는 방식
  - ‘아버지가 되었다’로 완곡하게 처리하는 방식
  rationale: 원문은 연속된 계보 진술로서 세대 연결을 강조하므로, 한국어에서도 같은 동사를 반복해 구조와 의미를 유지하는 편이 좋습니다.
  doctrine_reference: 족보 본문은 신학적 해설보다 계보 관계의 정확한 전달이 우선입니다.
