  source_fidelity: 히브리어는 이들을 레위 사람들에 속한 가문 우두머리인 노래하는 이들로 소개하고, 그들이 방들에 있으며 희귀한 표현 פטירים로 다른 의무에서 면제된 상태였음을 설명합니다. 이어 ‘밤낮으로 그들에게 그 일이 맡겨져 있었기’ 때문에 그러했다고 말합니다. 수정문은 이 책임의 뉘앙스를 ‘그 일이 그들에게 맡겨져 있었다’로 더 직접적으로 반영합니다.
