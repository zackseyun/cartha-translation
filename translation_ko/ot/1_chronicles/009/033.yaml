id: 1CH.9.33
reference: 1 Chronicles 9:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
  footnotes:
  - marker: a
    text: Or 'exempt' or 'released'; the Hebrew term is rare and likely means they were freed from other duties because of their continual responsibility for the singing service.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 레위 사람들의 가문 우두머리인 노래하는 이들이며, 방들에 머물면서 다른 의무는 면제되었으니[a], 밤낮으로 그 일이 그들에게 맡겨져 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 드문 표현은 ‘자유로운’, ‘면제된’ 또는 ‘풀려난’으로 옮길 수 있습니다. 이는 계속되는 노래 직무 때문에 다른 의무에서 면제되었다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  english_pob_choice: the singers
  chosen_korean: 노래하는 자들
  alternatives_korean:
  - 가수들
  - 노래꾼들
  lexicon: HALOT
  rationale: 히브리어 분사형은 노래에 종사하는 자들을 가리키므로, 기능을 드러내면서도 문맥을 과장하지 않는 ‘노래하는 자들’이 적절합니다.
- source_word: רָאשֵׁי אָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 조상 집안의 우두머리
  alternatives_korean:
  - 가문의 우두머리
  - 조상들의 집안 우두머리
  lexicon: HALOT
  rationale: 역대기에서 자주 나오는 족장/가문 구조를 살리기 위해, 평이하지만 구조가 보이는 ‘조상 집안의 우두머리’로 옮겼습니다.
- source_word: בַּלְּשָׁכוֹת
  english_pob_choice: in the chambers
  chosen_korean: 방들에
  alternatives_korean:
  - 방들 안에
  - 방에서
  - 성전 방들에
  lexicon: HALOT
  rationale: לשכה는 ‘방, 방들, 별실’의 뜻이 있으므로, 본문에 없는 ‘성전’은 덧붙이지 않고 공간 표현을 유지했습니다.
- source_word: פטירים
  english_pob_choice: free from duty
  chosen_korean: 다른 직무에서 자유로웠으니
  alternatives_korean:
  - 직무에서 면제되었으니
  - 다른 의무에서 풀려 있었으니
  lexicon: HALOT
  rationale: 희귀한 형태이지만 문맥상 다른 레위 직무에서 면제된 뜻이므로, POB의 ‘free from duty’를 한국어로 자연스럽게 풀어 썼습니다.
- source_word: בַּמְּלָאכָה
  english_pob_choice: the work
  chosen_korean: 이 일
  alternatives_korean:
  - 그 일
  - 그 일거리
  - 그 직무
  lexicon: HALOT
  rationale: מלאכה는 일반적 ‘일, 작업’이지만 여기서는 계속되는 성전 봉사 맥락이므로, 앞의 ‘다른 직무’와 대조되도록 ‘이 일’로 번역했습니다.
theological_decisions:
- issue: leisure versus exemption nuance in פטירים
  chosen_reading: 이들은 한가해서가 아니라, 지속적인 노래 봉사를 위해 다른 직무에서 자유롭게 된 사람들로 제시했습니다.
  alternative_readings:
  - 그들은 방들에 있으면서 그냥 면제되어 있었다.
  - 그들은 봉사에서 해방되어 있었다.
  rationale: 히브리어와 POB 주석은 이 표현이 단순한 면책이 아니라 계속되는 노래 책임 때문에 다른 의무에서 풀려난 상태를 뜻한다고 보므로, 그 긴장을 유지했습니다.
  doctrine_reference: 레위기/역대기 제의 직무 이해
