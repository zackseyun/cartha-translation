base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and Rephaiah his son, Eleasah his son, Azel his son.' The English supplies 'was' in the first clause to make the genealogical sequence read naturally.
    reason: lexical_alternative
translation:
  language: ko
  text: 모사는 비느아를 낳았고, 그의 아들은 르바야였으며, 그의 아들은 엘르아사였고, 그의 아들은 아셀이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그리고 그의 아들 르바야, 그의 아들 엘르아사, 그의 아들 아셀’의 연쇄입니다. 한국어는 족보 문맥이 자연스럽게 읽히도록 첫 절에 서술동사를 보충했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  english_pob_choice: Moza
  chosen_korean: 모사
  alternatives_korean:
  - 모자
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사 מוֹצָא를 한국어 외래어 표기 관행에 맞게 옮겼습니다. 영어 POB의 Moza처럼 인명으로 처리하되, 한국어에서는 ‘모사’가 발음과 형태를 비교적 자연스럽게 반영합니다.
- source_word: הוֹלִ֣יד
  english_pob_choice: fathered
  chosen_korean: 낳았고
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳았습니다
  - 낳았으며
  lexicon: HALOT
  rationale: 족보 문맥의 הוֹלִיד는 단순한 출생 서술보다 ‘~를 낳다/낳게 하다’의 계보적 관계를 나타내므로, 현대 한국어에서 자연스러운 ‘낳았습니다’ 계열로 옮겼습니다. 영어 POB의 fathered와 같은 족보적 힘을 유지합니다.
- source_word: וּרְפָיָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ
  english_pob_choice: and his son was Rephaiah, his son Eleasah, his son Azel
  chosen_korean: 그의 아들은 르바야였으며, 그의 아들은 엘르아사였고, 그의 아들은 아셀이었습니다
  alternatives_korean:
  - 그의 아들 르바야, 그의 아들 엘르아사, 그의 아들 아셀
  - 르바야가 그의 아들이었고, 그의 아들이 엘르아사였고, 그의 아들이 아셀이었습니다
  lexicon: 족보 구문 / 고유명사 음역
  rationale: 히브리어의 탈동사적 족보 연쇄를 한국어에서 읽기 자연스럽게 풀어, 관계를 반복해 이어 주었습니다. 영어 POB가 첫 절에 ‘was’를 보충한 것과 같은 방식으로, 한국어도 ‘-였으며 / -었습니다’를 사용해 계보의 연속을 분명히 했습니다.
