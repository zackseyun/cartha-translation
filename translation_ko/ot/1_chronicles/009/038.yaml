id: 1CH.9.38
reference: 1 Chronicles 9:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ם וְ/אַף הֵ֗ם נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירֽוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
  footnotes:
  - marker: a
    text: Hebrew Shimeam; some translations read 'Shimea,' likely by harmonization with parallel genealogical forms.
    reason: alternative_reading
  - marker: b
    text: Or 'before their brothers' / 'near their brothers' for 'opposite their brothers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 미글롯은 시므암[a]을 낳았습니다. 그들도 예루살렘에서 자기 형제들 맞은편에, 자기 형제들과 함께 살았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘시므암’이라고 합니다. 일부 번역은 평행 족보의 형태와 조화시켜 ‘시므아’로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘형제들 맞은편에’는 문맥상 ‘형제들 앞에’, ‘형제들 곁에’, 또는 ‘형제들 근처에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  english_pob_choice: Mikloth
  chosen_korean: 미글롯
  alternatives_korean:
  - 믹롯
  - 미클롯
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사이므로 음역하되, 현대 한국어 표기에서 읽기 자연스러운 형태로 옮겼습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 히필 ילד는 ‘낳다/아버지가 되다’의 생식 관계를 뜻하므로, 간결하고 직접적인 ‘낳았습니다’가 적절합니다.
- source_word: שִׁמְאָם
  english_pob_choice: Shimeam
  chosen_korean: 시므암
  alternatives_korean:
  - 시마암
  - 시메암
  lexicon: 고유명사 음역
  rationale: 본문의 자음형에 따라 ‘Shimeam’을 반영해 음역했습니다. 영어 각주가 말하듯 일부 전통은 유사형 ‘Shimea’로 조화시키지만, 본문형을 우선했습니다.
- source_word: נֶגֶד
  english_pob_choice: opposite
  chosen_korean: 맞은편에
  alternatives_korean:
  - 마주하여
  - 앞에
  - 대하여
  lexicon: HALOT
  rationale: נֶגֶד의 공간적 대응 관계를 살리면서, 이 거주 진술에서 자연스럽고 오해가 적은 표현으로 옮겼습니다.
- source_word: עִם אֲחֵיהֶם
  english_pob_choice: with their brothers
  chosen_korean: 자기 형제들과 함께
  alternatives_korean:
  - 그들의 형제들과 함께
  - 형제들 곁에
  lexicon: HALOT
  rationale: 반복된 ‘their brothers’를 그대로 살려 근접성과 연대감을 유지했습니다. ‘형제들’은 직역이지만 여기서는 혈족/동족 관계를 무난히 드러냅니다.
theological_decisions:
- issue: 족보 서술의 중복 표현 보존
  chosen_reading: ‘맞은편에, 자기 형제들과 함께’라는 이중 표현을 모두 유지했습니다.
  alternative_readings:
  - ‘형제들 근처에’로 평준화
  - 한 번만 ‘형제들 가운데’로 압축
  rationale: 히브리어는 공간 관계를 두 번 반복하며 거주상의 근접성과 구별을 함께 드러냅니다. 이를 매끈하게 하나로 합치면 본문이 가진 강조가 약해집니다.
  doctrine_reference: '본문 관찰: 히브리어 נגד + עִם의 병렬'
- issue: 족보 동사의 생식 의미
  chosen_reading: ‘낳았습니다’로 직접 옮겼습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’
  - ‘낳게 했습니다’
  rationale: 족보에서 הוֹלִיד는 단순한 친족 연결이 아니라 실제 계보 생성을 말하므로, 현대 한국어에서도 가장 직접적인 생식 관계 표현을 택했습니다.
  doctrine_reference: 족보/계보 서술의 통상적 히필 용례
