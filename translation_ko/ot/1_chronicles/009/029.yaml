translation:
  language: ko
  text: 그리고 그들 중 일부는 그릇들a과 모든 거룩한 그릇들, 그리고 고운 가루와 포도주와 기름과 유향과 향료를 맡도록 임명되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소의 모든 그릇들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם / מְמֻנִּים
  english_pob_choice: And some of them were appointed
  chosen_korean: 그들 중 일부는 … 임명되었습니다
  alternatives_korean:
  - 그들 가운데 일부는 … 맡겨졌습니다
  - 그들 중 몇 사람은 … 세워졌습니다
  lexicon: HALOT
  rationale: מן의 부분적 의미를 살려 ‘그들 중 일부’로 옮기고, 수동 분사 מְמֻנִּים은 직무 부여를 나타내므로 ‘임명되었습니다’가 가장 직접적입니다.
- source_word: הַכֵּלִים / כָּל כְּלֵי הַקֹּדֶשׁ
  english_pob_choice: the vessels / all the holy vessels
  chosen_korean: 그릇들 / 모든 거룩한 그릇들
  alternatives_korean:
  - 기물들 / 모든 성소의 기물들
  - 용기들 / 모든 성물
  lexicon: HALOT
  rationale: 성전 맥락의 כֵּלִים은 일반적인 ‘기구’보다 ‘그릇들’이 자연스럽고, ‘holy’는 제의적 구별을 반영해 ‘거룩한’으로 유지했습니다.
- source_word: הַסֹּלֶת / הַיַּיִן / הַשֶּׁמֶן / הַלְּבוֹנָה / הַבְּשָׂמִים
  english_pob_choice: the fine flour, the wine, the oil, the frankincense, and the spices
  chosen_korean: 고운 가루와 포도주와 기름과 유향과 향료
  alternatives_korean:
  - 고운 밀가루와 포도주와 기름과 유향과 향신료
  - 고운 가루와 포도주와 기름과 향과 향료
  lexicon: HALOT
  rationale: סֹלֶת은 제물용 ‘고운 가루’가 정확하고, לְבוֹנָה는 일반 ‘향’이 아니라 ‘유향’이며, בְּשָׂמִים은 제의적 방향성까지 포괄하는 ‘향료’가 무난합니다.
theological_decisions:
- issue: 제의적 용어의 현대 한국어 처리
  chosen_reading: ‘거룩한 그릇들’과 ‘유향’ 등 제의 전용 어휘를 유지해 성전 관리의 구체성을 드러냈습니다.
  alternative_readings:
  - ‘성소의 기물들’로 완화
  - ‘향’으로 일반화
  rationale: 본문은 성전 재물과 물품의 관리 항목을 열거하므로, 전통 교회어보다 제의적 구체성을 보존하는 것이 원문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 성전/제사 관련 역사서 본문 해석
