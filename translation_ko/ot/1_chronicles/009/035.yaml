  - marker: a
    text: Or 'the founder of Gibeon' or 'the chief of Gibeon'; Hebrew literally 'the father of Gibeon.'
    reason: lexical_alternative
  - marker: b
    text: The name is also spelled 'Jeuel' in some representations of the Hebrew; compare the parallel in 1 Chronicles 8:29.
    reason: textual_variant
