  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
  footnotes:
  - marker: a
    text: Or "the everlastingness" or "the preeminence" for "the victory"; the Hebrew נֵצַח here may denote enduring supremacy as well as triumph.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 위대함과 능력과 아름다움과 승리[a]와 위엄은 야훼께 속합니다. 하늘과 땅에 있는 모든 것이 야훼의 것이기 때문입니다. 야훼여, 나라는 야훼의 것이며, 야훼께서는 모든 것 위에 으뜸으로 높으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘승리’로 옮긴 히브리어 נֵצַח은 문맥에 따라 ‘영원함’ 또는 ‘탁월함/우위’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문에 직접 나타난 신적 이름을 살려, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 호칭의 반복을 살리기 위해 앞뒤 모두 동일하게 유지했습니다.
- source_word: הַגְּדֻלָּה / הַגְּבוּרָה / הַתִּפְאֶרֶת / הַנֵּצַח / הַהוֹד
  english_pob_choice: the greatness / the power / the splendor / the victory / the majesty
  chosen_korean: 위대함 / 능력 / 아름다움 / 승리 / 위엄
  alternatives_korean:
  - 위대함 / 힘 / 영광 / 영원함 / 영광
  - 위대함 / 힘 / 영광 / 탁월함 / 존귀
  lexicon: HALOT
  rationale: 다섯 명사 연쇄의 수사적 병렬을 유지하되, 각 항목의 의미 차이를 살렸습니다. 특히 נֵצַח은 문맥상 ‘승리’로 두고, 영어 POB가 보존한 해석상의 긴장도 footnote로 반영했습니다.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  english_pob_choice: for everything in the heavens and on the earth
  chosen_korean: 하늘들과 땅에 있는 모든 것이
  alternatives_korean:
  - 하늘과 땅에 있는 모든 것이
  - 하늘과 땅의 모든 것이
  lexicon: HALOT
  rationale: כֹל의 포괄성을 살려 ‘모든 것’으로 옮기고, אַל/שָׁמַיִם의 복수형을 반영해 ‘하늘들’로 유지했습니다.
- source_word: הַמַּמְלָכָה
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 통치
  - 왕국
  lexicon: HALOT
  rationale: 왕권적 지배를 가리키지만, 시편적 찬양 문맥에서 가장 직관적인 한국어는 ‘나라’입니다. 다만 본문의 선포적 힘을 살리기 위해 소유 구조를 분명히 했습니다.
- source_word: וְהַמִּתְנַשֵּׂא לְכֹל לְרֹאשׁ
  english_pob_choice: and you are exalted as head over all
  chosen_korean: 주님은 만물 위에 머리로 높임을 받으십니다
  alternatives_korean:
  - 주님은 만물 위에 머리로 높으십니다
  - 주님은 모든 것 위에 우두머리로 높임을 받으십니다
  lexicon: HALOT
  rationale: 분사 מתנשא를 형용사적으로 고정하지 않고, 문맥에 맞게 ‘높임을 받으십니다’로 옮겨 왕권적 선포를 살렸습니다. לְרֹאשׁ은 관용적으로 ‘머리로’ 처리해 위계적 우두머리의 의미를 드러냈습니다.
theological_decisions:
- issue: 원문 직역에서의 찬양 호칭 반복
  chosen_reading: ‘야훼여’와 ‘주님’의 반복을 유지해, 소유와 통치의 이중 선포를 보존했습니다.
  alternative_readings:
  - 호칭을 하나로 통일하여 반복을 줄이는 번역
  - 모든 מקום을 ‘여호와’로 통일하는 번역
  rationale: 본문은 ‘주님의 것’이라는 소유 선언과 ‘주님은… 높임을 받으십니다’라는 통치를 병렬로 제시합니다. 반복을 줄이면 수사적 강조가 약해집니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
- issue: נֵצַח의 의미 범위
  chosen_reading: ‘승리’로 두되, 영속적 우월성의 가능성은 열어 둡니다.
  alternative_readings:
  - 영원함
  - 탁월함/우위
  - 전승적 해석에 따른 영광
  rationale: 열거된 왕권 찬양 항목 속에서 ‘승리’가 가장 자연스럽지만, 히브리어 자체는 지속적 우세/영속성까지 품을 수 있습니다. 따라서 본문은 ‘승리’로 읽고 의미의 긴장은 보존합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
