    issue: ‘주님은 만물 위에 머리로 높임을 받으십니다’의 수동 표현
    rationale: וְהַמִּתְנַשֵּׂא는 여기서 야훼의 높으심·최고 지위를 선포합니다. ‘높임을 받으십니다’는 외부 주체가 높인다는 수동 의미를 불필요하게 강화하며, ‘머리로’도 현대어에서 부자연스럽습니다.
