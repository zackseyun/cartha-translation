base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
  footnotes:
  - marker: a
    text: Or 'delight in integrity' for 'take pleasure in uprightness.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your people who are found here,' that is, 'who are present here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 하나님이시여, 주께서 마음을 살피시고 올바름을 기뻐하신다는 것을 저는 압니다.[a] 저는 마음의 정직함으로 이 모든 것을 자원하여 드렸고, 이제 기쁨으로 여기 있는 주의 백성이[b] 주께 자원하여 드리는 것을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정직함을 기뻐하신다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여기에서 발견된 주의 백성’이며, 문맥상 ‘여기 있는 주의 백성’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  english_pob_choice: test the heart
  chosen_korean: 마음을 살피시고
  alternatives_korean:
  - 마음을 시험하시고
  - 마음을 검증하시고
  lexicon: HALOT
  rationale: בֹּחֵן은 단순 관찰보다 판별을 위한 살핌·시험의 뜻이 있어, 현대 한국어에서는 문맥상 자연한 ‘살피시다’로 옮기되 평가적 의미를 유지했습니다.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  english_pob_choice: take pleasure in uprightness
  chosen_korean: 올바름을 기뻐하시는
  alternatives_korean:
  - 정직함을 기뻐하시는
  - 정직을 받아들이시는
  lexicon: HALOT
  rationale: מֵישָׁרִים의 ‘곧음/올바름’과 תִּרְצֶה의 ‘기뻐하다, 받아들이다’를 함께 살려, 하나님이 도덕적 바름을 기쁘게 여기신다는 뜻을 드러냈습니다.
- source_word: בְּיֹשֶׁר לְבָבִי
  english_pob_choice: in the uprightness of my heart
  chosen_korean: 마음의 바름으로
  alternatives_korean:
  - 마음의 정직함으로
  - 올바른 마음으로
  lexicon: HALOT
  rationale: 히브리어의 상태·방식을 나타내는 표현을 한국어 조사 ‘-으로’로 자연스럽게 풀어, 다윗의 헌신이 내적 바름에서 나왔음을 보이게 했습니다.
- source_word: הִתְנַדַּבְתִּי / לְהִתְנַדֶּב
  english_pob_choice: have willingly offered / willingly offer
  chosen_korean: 자원하여 드렸고 / 자원하여 드리는
  alternatives_korean:
  - 기꺼이 바쳤고 / 기꺼이 바치는
  - 자발적으로 드렸고 / 자발적으로 드리는
  lexicon: HALOT
  rationale: נדב의 자원성은 예배·헌납 문맥에서 ‘자원하여 드리다’가 가장 직접적이며, 앞뒤 절의 동사 반복도 한국어에서 유지했습니다.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  english_pob_choice: your people who are present here
  chosen_korean: 여기 있는 주의 백성
  alternatives_korean:
  - 여기 있는 주의 백성들
  - 여기 حاضر한 주의 백성
  lexicon: HALOT
  rationale: נמצא의 ‘여기에 있다, حاضر하다’라는 문맥적 뜻을 따라 길게 풀이하기보다 ‘여기 있는’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 하나님께서 마음을 ‘시험하신다’는 표현의 어조
  chosen_reading: ‘마음을 살피시고’로 옮겨, 하나님의 전지와 심사 기능을 함께 드러냈습니다.
  alternative_readings:
  - 마음을 시험하시고
  - 마음을 검증하시고
  rationale: 한국어 ‘시험하다’는 종종 유혹을 주는 뉘앙스를 띠므로, 여기서는 स्रोत의 평가적 의미를 보존하면서 오해를 줄이는 방향을 택했습니다.
  doctrine_reference: 하나님의 전지와 공의로운 심판
- issue: ‘마음의 바름’이 단순 감정이 아닌 내적 정직성/의도임을 드러내는 방식
  chosen_reading: ‘마음의 바름’으로 표기해 인간의 내적 태도와 의도를 포괄했습니다.
  alternative_readings:
  - 정직한 마음
  - 내적 정직성
  rationale: 히브리어 לֵבָב은 감정만이 아니라 생각·의지·동기를 포함하는데, 한국어 ‘마음’이 이 넓은 범위를 가장 자연스럽게 담습니다.
  doctrine_reference: 성서적 인간 이해(내적 մարդ/마음의 통합성)
