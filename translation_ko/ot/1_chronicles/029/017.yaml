revisions:
- from: 나의 하나님이시여, 주께서는 마음을 살피시고 올바름을 기뻐하시는 것을 제가 압니다. 나는 마음의 바름으로 이 모든 것을 자원하여 드렸고, 이제 여기 있는 주의 백성이 주께 즐거움으로 자원하여 드리는 것을 보았습니다.[a][b]
  to: 나의 하나님이시여, 주께서 마음을 살피시고 올바름을 기뻐하신다는 것을 저는 압니다.[a] 저는 마음의 정직함으로 이 모든 것을 자원하여 드렸고, 이제 기쁨으로 여기 있는 주의 백성이[b] 주께 자원하여 드리는 것을 보았습니다.
  rationale: 문장의 높임말과 인칭을 일관되게 다듬고, ‘마음의 바름’을 더 자연스러운 ‘마음의 정직함’으로 바꾸었습니다. בְשִׂמְחָה가 화자의 관찰을 수식하도록 ‘이제 기쁨으로 … 보았습니다’로 배치했습니다. 무의미하게 중복된 각주 a를 유효한 어휘 대안으로 고치고, 각주 b를 설명 대상인 ‘여기 있는 주의 백성’에 직접 연결했습니다.
