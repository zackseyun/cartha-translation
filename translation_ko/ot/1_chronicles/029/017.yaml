  source_fidelity: 본문의 핵심 의미는 대체로 잘 옮겼습니다. 다만 בְשִׂמְחָה는 영어 감사본의 판단처럼 다윗의 ‘봄’에 수식되는 것으로 처리하는 편이 더 충실하며, 현 초안의 ‘주의 백성이 주께 즐거움으로 ... 드리는’은 기쁨이 백성의 드림을 수식하는 것으로 읽히기 쉽습니다.
  naturalness: ‘마음의 바름’은 이해 가능하지만 현대 표준어에서는 ‘마음의 정직함’이 더 자연스럽고 분명합니다. 또한 첫 문장의 ‘주께서는 … 것을 제가 압니다’보다 ‘주께서 … 하신다는 것을 저는 압니다’가 합쇼체 문장으로 매끄럽습니다.
  terminology: ‘마음을 살피시다’, ‘올바름’, ‘자원하여 드리다’는 문맥과 높임말에 적절합니다. 다만 각주 a는 본문 표현을 그대로 반복하여 대안 기능을 하지 못하므로 실제 어휘 대안을 제시해야 합니다. 각주 b는 ‘여기 있는’에 붙여 해당 히브리어 표현과 연결하는 것이 적절합니다.
