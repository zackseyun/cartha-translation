  text: 그가 이스라엘을 다스린 기간은 사십 년이었습니다. 그는 헤브론에서 칠 년을 다스렸고, 예루살렘에서 삼십삼 년을 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  english_pob_choice: The days that he reigned
  chosen_korean: 그가 이스라엘 위에 다스린 날은
  alternatives_korean:
  - 그가 이스라엘 위에 다스린 기간은
  - 그가 이스라엘을 다스린 햇수는
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간량 표현을 살리되, 한국어에서는 자연스럽게 ‘날’로 옮겨 재임 기간을 나타냈습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘 위에
  alternatives_korean:
  - 이스라엘을 다스리던
  - 이스라엘을 다스려
  lexicon: HALOT
  rationale: מָלַךְ과 함께 쓰인 עַל은 통치 대상을 나타내므로, ‘위에’로 왕권의 지배 관계를 간결하게 드러냈습니다.
- source_word: בְּחֶבְרוֹן ... וּבִירוּשָׁלִַם
  english_pob_choice: In Hebron ... and in Jerusalem
  chosen_korean: 헤브론에서 ... 예루살렘에서
  alternatives_korean:
  - 헤브론에... 예루살렘에
  - 헤브론 안에서... 예루살렘 안에서
  lexicon: HALOT
  rationale: 장소를 나타내는 전치사는 한국어의 부사격 조사 ‘에서’가 가장 자연스럽고, 통치의 거주·재임 장소를 분명히 합니다.
- source_word: שְׁלֹשִׁים וְשָׁלוֹשׁ
  english_pob_choice: thirty-three
  chosen_korean: 삼십삼 년
  alternatives_korean:
  - 서른셋 해
  - 33년
  lexicon: HALOT
  rationale: 히브리어 수사를 한국어 성경 문체에 맞게 한자식 수사로 옮겨 병렬 구조를 유지했습니다.
theological_decisions:
- issue: 본문이 다윗의 통치 기간을 세 번에 걸쳐 요약하는 방식
  chosen_reading: 연대기적 요약을 그대로 유지해, 총 기간과 헤브론·예루살렘의 분배를 모두 드러냈습니다.
  alternative_readings:
  - 한 문장으로 압축해 기간만 제시
  - ‘왕위에 있었다’처럼 완곡하게 표현
  rationale: 이 절은 신학적 해석보다 역사적 연대 요약이 핵심이므로, 원문의 반복 구조와 수치를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 역사서 본문 충실성
