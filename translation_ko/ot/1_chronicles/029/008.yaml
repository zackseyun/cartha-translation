  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of Jehiel,'' an idiom meaning under Jehiel''s care or supervision.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보석이 있는 사람은 누구나 그것을 야훼의 집 보물 창고에 드리고, 게르손 사람 여히엘의 관리 아래 맡겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “여히엘의 손으로”이며, 여기서는 여히엘의 관리와 책임 아래 맡겼다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  english_pob_choice: Whoever had
  chosen_korean: 누구든지 자기에게 있던
  alternatives_korean:
  - 누구든지 함께 발견된
  - 그와 함께 있던 사람이
  lexicon: HALOT
  rationale: נמצא אִתּוֹ는 소유·소지 상황을 가리키는 관용적 표현이므로, 한국어에서는 자연스럽게 ‘자기에게 있던’으로 풀어 주는 것이 분배적 의미를 가장 잘 살립니다.
- source_word: אֲבָנִים
  english_pob_choice: precious stones
  chosen_korean: 보석
  alternatives_korean:
  - 돌
  - 귀한 돌
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 돌이 아니라 성전 헌물로 드린 가치 있는 돌들을 가리키므로, 영어 POB의 해석을 반영해 ‘보석’으로 옮겼습니다.
- source_word: לְאוֹצַר
  english_pob_choice: to the treasury
  chosen_korean: 곳간에
  alternatives_korean:
  - 보물창고에
  - 창고에
  lexicon: HALOT
  rationale: אוֹצָר는 성전 재물의 보관처를 뜻하므로 ‘곳간’이 현대 한국어에서 기능을 가장 무난하게 드러내며, 단순한 창고보다 헌납품 보관의 뉘앙스를 살립니다.
- source_word: עַל יַד
  english_pob_choice: into the care of
  chosen_korean: 관리 아래
  alternatives_korean:
  - 손에 맡겨
  - 감독 아래
  lexicon: HALOT
  rationale: ‘by the hand of’라는 직역보다, 위탁·감독의 관용적 뜻을 드러내는 ‘관리 아래’가 여히엘의 책임 있는 보관을 더 분명하게 전달합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
