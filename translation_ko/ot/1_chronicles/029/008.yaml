  - 주
  rationale: 본문의 신명은 일반 호칭으로 바꾸지 않고 고유명사로 드러내는 것이 원문 존중에 부합하므로, POB 기준에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
