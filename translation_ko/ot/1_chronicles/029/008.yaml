  source_fidelity: ‘그핫 사람’은 히브리어 הַגֵּרְשֻׁנִּי(게르손 사람/게르손 사람인)를 잘못 옮긴 것으로, 반드시 수정해야 합니다. 또한 원문은 헌물을 여히엘의 책임 아래 두었다는 뜻이므로, 이를 한 문장 안에서 ‘맡겼습니다’로 연결하면 의미 관계가 더 충실하게 드러납니다.
