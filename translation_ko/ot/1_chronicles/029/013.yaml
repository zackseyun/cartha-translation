translation:
  language: ko
  text: 이제, 우리 하나님, 우리는 주께 감사드리며 주의 영광의 이름을 찬양합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환을 나타내는 연결어로, 한국어에서는 군더더기 없이 ‘이제’로 옮기는 것이 자연스럽습니다.
- source_word: אֱלֹהֵינוּ
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 하나님
  - 오 우리 하나님
  lexicon: HALOT
  rationale: 1인칭 복수 소유격이 붙은 직접 호칭이므로 ‘우리 하나님’이 가장 간결하고 현대적입니다.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  english_pob_choice: we give thanks to you
  chosen_korean: 우리는 주께 감사드리며
  alternatives_korean:
  - 우리는 주께 감사합니다
  - 우리는 주를 감사하며
  lexicon: HALOT
  rationale: ידה의 예배적 용례를 따라 ‘감사드리다’로 옮기고, 병렬 구조를 살리기 위해 동사형으로 유지했습니다.
- source_word: וּמְהַלְלִים
  english_pob_choice: and praise
  chosen_korean: 그리고 찬양합니다
  alternatives_korean:
  - 그리고 찬송합니다
  - 그리고 높입니다
  lexicon: HALOT
  rationale: הלל의 기본 의미를 한국어 예배어법에서 자연스럽게 드러내는 ‘찬양하다’를 택했습니다.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  english_pob_choice: the name of your glory
  chosen_korean: 주의 영광의 이름
  alternatives_korean:
  - 주의 영광의 이름에
  - 주의 영광스러운 이름
  lexicon: HALOT
  rationale: 문자적 구조를 보존하면서도 한국어에서 자연스러운 소유관계로 옮겼습니다. ‘이름’은 하나님의 드러난 명예와 존귀를 가리키는 성경적 표현으로 유지했습니다.
theological_decisions:
- issue: ‘이름’ 표현의 신학적 보존
  chosen_reading: 주의 영광의 이름
  alternative_readings:
  - 주의 영광스러운 이름
  - 주의 영광을
  rationale: 본문은 단순히 ‘영광’을 말하는 것이 아니라 하나님에게 속한 ‘이름’ 표현을 통해 그분의 드러난 존귀와 명성을 강조하므로, 그 신학적 함의를 유지했습니다.
  doctrine_reference: Translation philosophy §1 and §6
