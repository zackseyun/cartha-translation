base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: Now the acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
  footnotes:
  - marker: a
    text: Or 'the words/matters of David the king, the first and the last.' The Hebrew idiom refers to the events or acts of his reign.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'written on/upon the words of Samuel ... Nathan ... Gad'; here 'records' conveys that these are written source documents.
    reason: lexical_alternative
  - marker: c
    text: Both Hebrew titles רֹאֶה and חֹזֶה are rendered 'seer' here; alternatively, חֹזֶה could be rendered 'visionary' to preserve the lexical distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 다윗 왕의 처음부터 마지막까지의 행적은, 사무엘 선지자의 기록과 나단 선지자의 기록과 갓 선지자의 기록에 기록되어 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘행적’은 히브리어 דִּבְרֵי의 관용적 의미를 풀어 옮긴 것입니다. 직역하면 ‘말들/일들’이지만, 여기서는 다윗 통치의 사건과 일들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사무엘… 나단… 갓의 말들 위에/안에 기록되어 있다’는 식으로 적지만, 한국어에서는 문헌 출처를 가리키는 자연스러운 표현으로 ‘기록되어 있습니다’를 사용했습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 רֹאֶה와 חֹזֶה는 서로 다른 예언자 호칭이지만, 한국어 본문에서는 둘 다 ‘선지자’로 옮겼습니다. 다른 가능성으로는 ‘선견자/환상가’가 있으나, 본문 의미를 유지하면서 읽기 쉽게 하려는 선택입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבְרֵי דָּוִיד הַמֶּלֶךְ
  english_pob_choice: the acts of David the king
  chosen_korean: 다윗 왕의 처음부터 마지막까지의 행적
  alternatives_korean:
  - 다윗 왕의 말들
  - 다윗 왕의 일들
  - 다윗 왕의 사건들
  lexicon: HALOT
  rationale: דִּבְרֵי는 문자적으로는 ‘말/일’이지만, 왕의 통치 전체를 요약하는 관용구에서는 그의 통치 행적을 가리키므로 ‘행적’이 자연스럽고 문맥에 맞습니다.
- source_word: הָרִאשֹׁנִים וְהָאֲחרֹנִים
  english_pob_choice: the former and the latter / from first to last
  chosen_korean: 처음부터 마지막까지
  alternatives_korean:
  - 전과 후의
  - 처음과 마지막의
  - 이전과 이후의
  lexicon: HALOT
  rationale: 이 표현은 시작과 끝 전체를 가리키는 히브리어 관용적 머리-말(pair)이라서, 한국어로는 ‘처음부터 마지막까지’가 가장 자연스럽게 전체 범위를 드러냅니다.
- source_word: כְּתוּבִים עַל דִּבְרֵי
  english_pob_choice: are written in the records of
  chosen_korean: 기록되어 있습니다
  alternatives_korean:
  - 쓰여 있습니다
  - 적혀 있습니다
  - 문서에 남아 있습니다
  lexicon: HALOT
  rationale: עַל과 כְּתוּבִים의 결합은 특정 문헌 자료를 가리키므로, 단순히 ‘쓰여 있다’보다 ‘기록되어 있습니다’가 문헌적 의미를 더 정확히 전달합니다.
- source_word: שְׁמוּאֵל הָרֹאֶה / גָּד הַחֹזֶה
  english_pob_choice: Samuel the seer / Gad the seer
  chosen_korean: 사무엘 선지자 / 갓 선지자
  alternatives_korean:
  - 사무엘 선견자 / 갓 선견자
  - 사무엘 보는 자 / 갓 보는 자
  lexicon: HALOT
  rationale: רֹאֶה와 חֹזֶה는 서로 다른 예언자 호칭이지만, 한국어에서는 둘 다 표준적으로 ‘선지자’로 옮겨도 본문의 핵심 대비가 훼손되지 않습니다. 여기서는 문맥상 인물의 소스 문헌을 밝히는 기능이 중심이므로 ‘기록’과 결합한 자연스러운 표현을 택했습니다.
- source_word: נָתָן הַנָּבִיא
  english_pob_choice: Nathan the prophet
  chosen_korean: 나단 선지자
  alternatives_korean:
  - 나단 예언자
  - 나단 예언자
  lexicon: HALOT
  rationale: נָבִיא는 한국어 성경 전통에서 ‘선지자’로 널리 쓰이며, 본문에서는 나단의 직함을 분명히 밝히는 역할을 합니다.
theological_decisions:
- issue: Three prophetic sources named as written authorities
  chosen_reading: 본문의 세 인물은 모두 다윗 통치에 대한 기록을 남긴 권위 있는 예언자적 기록자로 제시했습니다.
  alternative_readings:
  - 단순한 역사 자료 목록으로만 읽기
  - 예언의 권위보다 연대기적 정보만 강조하기
  rationale: 이 절은 다윗의 행적이 예언자적 기록 전승 안에 محفوظ되어 있음을 보여 주며, 예언자들이 역사 기록자 역할도 수행했음을 드러냅니다. 따라서 본문 기능을 약화시키지 않도록 ‘기록’과 직함을 함께 살렸습니다.
  doctrine_reference: 역사-계시의 연결과 성경 내 기록 전승에 대한 일반적 이해
