  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁלֹ֧שֶׁת אֲלָפִ֛ים כִּכְּרֵ֥י זָהָ֖ב מִ/זְּהַ֣ב אוֹפִ֑יר וְ/שִׁבְעַ֨ת אֲלָפִ֤ים כִּכַּר כֶּ֨סֶף֙ מְזֻקָּ֔ק לָ/ט֖וּחַ קִיר֥וֹת הַ/בָּתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
  footnotes:
  - marker: a
    text: Or 'of Ophir gold.' The Hebrew can be understood as specifying gold sourced from Ophir or as a descriptive genitive.
    reason: lexical_alternative
  - marker: b
    text: '''Talents'' is a unit of weight, not a reference to skill or ability.'
    reason: cultural_note
translation:
  language: ko
  text: 세 천 개의 금 달란트[a], 곧 오빌의 금에서 나온 것이며, 정련한 은 칠천 달란트[b]로, 집들의 벽을 입히게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '오빌의 금'으로 이해할 수 있습니다. 히브리어는 오빌에서 난 금을 뜻할 수도 있고, 오빌 금이라는 수식적 속격으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''달란트''는 재능이 아니라 무게 단위입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים
  english_pob_choice: three thousand
  chosen_korean: 세 천 개
  alternatives_korean:
  - 삼천
  - 세 천
  lexicon: HALOT
  rationale: 수사구를 직역하되 현대 한국어에서 무리 없이 읽히도록 분리 표기를 유지했습니다.
- source_word: כִּכְּרֵי / כִּכַּר
  english_pob_choice: talents
  chosen_korean: 달란트
  alternatives_korean:
  - 재능
  - 무게 단위
  lexicon: HALOT
  rationale: 영어 POB의 'talents'는 재능이 아니라 무게 단위이므로, 한국어에서도 성경적·역사적 단위로 통용되는 달란트를 사용했습니다.
- source_word: מִזְּהַב אוֹפִיר
  english_pob_choice: from the gold of Ophir
  chosen_korean: 오빌의 금에서 나온
  alternatives_korean:
  - 오빌 금의
  - 오빌에서 난 금
  lexicon: HALOT
  rationale: מִ-의 출처 의미를 살려 '에서 나온'으로 옮겨, 오빌 산 금의 출처·품질 뉘앙스를 보존했습니다.
- source_word: מְזֻקָּק
  english_pob_choice: refined
  chosen_korean: 정련한
  alternatives_korean:
  - 순수한
  - 정제한
  lexicon: HALOT
  rationale: 금속의 제련·정련 과정을 나타내는 분사이므로, 문맥상 가장 정확한 한국어를 택했습니다.
- source_word: לָטוּחַ קִירוֹת הַבָּתִּים
  english_pob_choice: to overlay the walls of the buildings
  chosen_korean: 집들의 벽을 입히게
  alternatives_korean:
  - 건물들의 벽에 덮게
  - 집 벽에 입히게
  lexicon: HALOT
  rationale: 금속을 표면에 입히는 뜻을 살려 '입히다'를 사용했고, 복수형을 따라 '집들의 벽'으로 옮겼습니다.
theological_decisions:
- issue: הַבָּתִּים의 범위
  chosen_reading: 문맥상 성전 관련 건축물들을 가리키는 넓은 뜻으로 보고 '집들'을 유지했습니다.
  alternative_readings:
  - 성전 방들
  - 건물들
  rationale: 히브리어는 문자적으로 '집들'이지만, 영어 POB도 domestic 'houses'보다 구조물 전체를 염두에 둔 읽기를 택했습니다. 따라서 과도하게 좁히지 않고 문맥을 드러내는 번역을 유지했습니다.
  doctrine_reference: 문맥 우선 원칙
