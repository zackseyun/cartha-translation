  source_fidelity: 원문의 수량과 금속 종류, 오빌의 금이라는 출처 표현, 정련한 은, 그리고 건축물 벽을 금속으로 입히는 목적을 보존해야 합니다. 초안의 ‘입히게 하셨습니다’는 원문에 없는 사역·존칭 주어를 도입하며, 앞 절에서 이어지는 다윗의 ‘드렸습니다’라는 동작을 제대로 반영하지 못합니다.
  naturalness: ‘세 천 개의 금 달란트’는 현대 한국어의 수량 표현으로 부자연스럽습니다. ‘금 삼천 달란트’가 자연스럽고 단위 수량도 정확히 드러냅니다. 문맥상 성전 부속 구조물을 가리키는 ‘הַבָּתִּים’는 ‘집들’보다 ‘건물들’이 자연스럽습니다.
  terminology: ‘달란트’와 ‘정련한 은’은 적절합니다. ‘오빌에서 난 금’은 מִן의 출처 의미를 자연스럽게 반영합니다. ‘벽에 입히기 위해’는 לָטוּחַ의 금속 피복 의미를 보존합니다.
  issues:
