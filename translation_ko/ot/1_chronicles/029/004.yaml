source:
  edition: WLC
  text: שְׁלֹ֧שֶׁת אֲלָפִ֛ים כִּכְּרֵ֥י זָהָ֖ב מִ/זְּהַ֣ב אוֹפִ֑יר וְ/שִׁבְעַ֨ת אֲלָפִ֤ים כִּכַּר כֶּ֨סֶף֙ מְזֻקָּ֔ק לָ/ט֖וּחַ קִיר֥וֹת הַ/בָּתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
  footnotes:
  - marker: a
    text: Or 'of Ophir gold.' The Hebrew can be understood as specifying gold sourced from Ophir or as a descriptive genitive.
    reason: lexical_alternative
  - marker: b
    text: '''Talents'' is a unit of weight, not a reference to skill or ability.'
    reason: cultural_note
translation:
  language: ko
  text: 오빌에서 난 금 삼천 달란트[a]와 정련한 은 칠천 달란트[b]를 건물들의 벽에 입히기 위해 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오빌의 금’. 히브리어는 오빌에서 난 금을 뜻할 수도 있고, ‘오빌 금’이라는 수식 표현으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘달란트’는 재능이 아니라 무게 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים
  english_pob_choice: three thousand
  chosen_korean: 세 천 개
  alternatives_korean:
  - 삼천
  - 세 천
  lexicon: HALOT
  rationale: 수사구를 직역하되 현대 한국어에서 무리 없이 읽히도록 분리 표기를 유지했습니다.
- source_word: כִּכְּרֵי / כִּכַּר
  english_pob_choice: talents
  chosen_korean: 달란트
  alternatives_korean:
