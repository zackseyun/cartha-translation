revisions:
- from: 세 천 개의 금 달란트[a], 곧 오빌의 금에서 나온 것이며, 정련한 은 칠천 달란트[b]로, 집들의 벽을 입히게 하셨습니다.
  to: 오빌에서 난 금 삼천 달란트[a]와 정련한 은 칠천 달란트[b]를 건물들의 벽에 입히기 위해 드렸습니다.
  rationale: 수량 표현을 현대 표준어에 맞게 ‘금 삼천 달란트’로 바로잡고, 오빌 금의 출처라는 해석 가능성을 각주로 유지했습니다. 목적 부정사 ‘벽에 입히기 위해’를 정확히 옮기고, 앞 절에서 이어지는 헌납 동사를 ‘드렸습니다’로 보완했습니다. ‘건물들’은 원문의 복수형과 성전 건축 문맥을 보존하면서 불필요하게 범위를 좁히지 않습니다.
