  - 무게 단위
  lexicon: HALOT
  rationale: 영어 POB의 'talents'는 재능이 아니라 무게 단위이므로, 한국어에서도 성경적·역사적 단위로 통용되는 달란트를 사용했습니다.
- source_word: מִזְּהַב אוֹפִיר
  english_pob_choice: from the gold of Ophir
  chosen_korean: 오빌의 금에서 나온
  alternatives_korean:
  - 오빌 금의
  - 오빌에서 난 금
  lexicon: HALOT
  rationale: מִ-의 출처 의미를 살려 '에서 나온'으로 옮겨, 오빌 산 금의 출처·품질 뉘앙스를 보존했습니다.
- source_word: מְזֻקָּק
  english_pob_choice: refined
  chosen_korean: 정련한
  alternatives_korean:
  - 순수한
  - 정제한
  lexicon: HALOT
  rationale: 금속의 제련·정련 과정을 나타내는 분사이므로, 문맥상 가장 정확한 한국어를 택했습니다.
- source_word: לָטוּחַ קִירוֹת הַבָּתִּים
  english_pob_choice: to overlay the walls of the buildings
  chosen_korean: 집들의 벽을 입히게
  alternatives_korean:
  - 건물들의 벽에 덮게
  - 집 벽에 입히게
  lexicon: HALOT
  rationale: 금속을 표면에 입히는 뜻을 살려 '입히다'를 사용했고, 복수형을 따라 '집들의 벽'으로 옮겼습니다.
theological_decisions:
- issue: הַבָּתִּים의 범위
  chosen_reading: 문맥상 성전 관련 건축물들을 가리키는 넓은 뜻으로 보고 '집들'을 유지했습니다.
  alternative_readings:
  - 성전 방들
  - 건물들
  rationale: 히브리어는 문자적으로 '집들'이지만, 영어 POB도 domestic 'houses'보다 구조물 전체를 염두에 둔 읽기를 택했습니다. 따라서 과도하게 좁히지 않고 문맥을 드러내는 번역을 유지했습니다.
  doctrine_reference: 문맥 우선 원칙
