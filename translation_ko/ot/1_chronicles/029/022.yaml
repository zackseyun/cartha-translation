  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
  footnotes:
  - marker: a
    text: Or 'in the presence of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'again' for 'a second time.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they anointed him before the LORD as ruler'; the Hebrew may express dedication to the LORD or action done in his presence.
    reason: alternative_reading
  - marker: d
    text: '''Ruler'' translates Hebrew nagid, also rendered ''prince'' or ''leader'' in some contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 그들은 야훼 앞에서 먹고 마셨으며, 큰 기쁨으로 다윗의 아들 솔로몬을 다시 왕으로 세웠고, 그를 야훼를 위하여 통치자로, 사독을 제사장으로 기름부었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 임재 앞에서
  - 야훼 앞
  lexicon: HALOT
  rationale: 문맥상 장소나 태도가 아니라 야훼를 마주한 예배적 상황을 가리키므로, 직역에 가깝고 자연스러운 ‘앞에서’를 택했습니다.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  english_pob_choice: with great joy
  chosen_korean: 큰 기쁨으로
  alternatives_korean:
  - 큰 즐거움으로
  - 매우 기쁘게
  lexicon: HALOT
  rationale: בְּ + 명사는 한국어에서 부사적 수단/양태로 옮기기 쉬우며, ‘큰 기쁨으로’가 축제적 분위기를 가장 간결하게 살립니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 다시
  alternatives_korean:
  - 두 번째로
  - 둘째 번으로
  lexicon: HALOT
  rationale: 원문은 재차 세우는 반복을 표시하지만, 한국어에서는 ‘다시’가 가장 자연스럽게 그 반복성을 전달합니다.
- source_word: וַיַּמְלִיכוּ
  english_pob_choice: they made ... king
  chosen_korean: 왕으로 세웠고
  alternatives_korean:
  - 왕이 되게 했고
  - 왕으로 삼았고
  lexicon: HALOT
  rationale: 히필 동사의 사역 의미를 살리면서도 현대 한국어에서 즉위 행위를 자연스럽게 표현했습니다.
- source_word: לְנָגִיד
  english_pob_choice: as ruler
  chosen_korean: 통치자로
  alternatives_korean:
  - 지도자로
  - 다스리는 자로
  lexicon: HALOT
  rationale: נָגִיד은 단순 직함보다 통치 권한이 있는 지위를 가리키므로, ‘통치자’가 ‘ruler’의 권위와 기능을 가장 분명히 드러냅니다.
- source_word: לְכֹהֵן
  english_pob_choice: as priest
  chosen_korean: 제사장으로
  alternatives_korean:
  - 사제로
  - 제관으로
  lexicon: HALOT
  rationale: קדושה/예배 맥락의 공적 직분을 가리키므로, 한국어 성서 독자에게 가장 투명한 ‘제사장’이 적절합니다.
- source_word: בֶן דָּוִיד
  english_pob_choice: son of David
  chosen_korean: 다윗의 아들
  alternatives_korean:
  - 다윗의 자손
  - 다윗의 아들인
  lexicon: HALOT
  rationale: 솔로몬의 계보 표시를 그대로 유지해 다윗 왕조 문맥을 분명히 드러냅니다.
theological_decisions:
- issue: 야훼 앞에서의 예배와 왕위 수여가 함께 놓인 구조
  chosen_reading: 예배 행위와 정치적 즉위가 분리되지 않은 채, 야훼 앞에서 공동체적으로 확인된 왕권으로 표현했습니다.
  alternative_readings:
  - 단순히 ‘야훼의 임재 안에서’로 일반화하기
  - 왕위 수여만 강조하기
  rationale: 본문은 단순한 식사 장면이 아니라 야훼 앞에서의 축제와 즉위가 결합된 장면이므로, 예배적·정치적 긴장을 함께 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
