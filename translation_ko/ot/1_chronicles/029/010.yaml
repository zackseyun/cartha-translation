source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
  footnotes:
  - marker: a
    text: Or, 'God of Israel, our Father,' if 'our Father' is taken as a direct address to God rather than as referring to Israel/Jacob.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 온 회중의 눈앞에서 야훼를 송축하고 다윗이 말했습니다. “야훼여, 이스라엘의 하나님, 우리 조상, 영원부터 영원까지 복되십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 조상’으로 옮긴 אָבִינוּ는 문맥상 이스라엘/야곱을 가리킬 수 있으며, 하나님께 직접 말하는 ‘우리 아버지’로도 읽을 여지가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 송축하고
  alternatives_korean:
  - 축복하고
  - 찬송하고
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 ברך의 예배적 용법은 단순한 ‘칭찬’보다 ‘송축’이 동사 의미와 예전적 톤을 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신명기적 본명 표기를 따라, 대체 호칭이 아니라 고유명으로서 ‘야훼’를 유지했습니다.
- source_word: כָּל הַקָּהָל
  english_pob_choice: all the assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 집회
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 가리키므로, 제도적 ‘교회’보다 여기서는 공적 집회를 드러내는 ‘회중’이 적절합니다.
- source_word: אָבִינוּ
  english_pob_choice: our father
  chosen_korean: 우리 조상
  alternatives_korean:
  - 우리 아버지
  - 우리 선조
  lexicon: HALOT
  rationale: 문맥상 ‘우리의 아버지’로 하나님께 직접 호칭하기보다 이스라엘/야곱을 가리키는 족장적 표현이므로, 그 의미를 한국어로는 ‘우리 조상’으로 풀어 중의성을 보존했습니다.
theological_decisions:
- issue: אָבִינוּ의 지시 대상
  chosen_reading: ‘우리 조상’은 이스라엘의 조상 야곱/이스라엘을 가리키는 것으로 두었습니다.
  alternative_readings:
  - ‘우리 아버지’를 하나님께 직접 드리는 호칭으로 읽기
  rationale: 히브리어 결합은 ‘이스라엘의 하나님’에 이어 족장 호칭이 붙는 구조가 자연스러우며, 번역에서 신학적 해석을 미리 고정하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 해석상 중의성은 주석으로 남기고 본문은 과잉정리하지 않습니다.
