base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
  footnotes:
  - marker: a
    text: Or 'come from you' or 'are from your presence'; Hebrew literally, 'from before you.'
    reason: lexical_alternative
  - marker: b
    text: '''Honor'' may also be rendered ''glory.'''
    reason: lexical_alternative
  - marker: c
    text: '''To make great'' can also mean ''to exalt.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 부와 존귀[b]가 주님 앞에서[a] 나오며, 주님께서는 모든 것을 다스리십니다. 주님의 손에는 능력과 권능이 있으며, 주님의 손에는 모두를 크게 하시고[c] 강하게 하실 능력이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘당신 앞에서’입니다.
    reason: source_note
  - marker: b
    text: ‘존귀’는 ‘영광’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘크게 하시다’는 ‘높이시다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  english_pob_choice: riches
  chosen_korean: 부
  alternatives_korean:
  - 재물
  - 부요
  lexicon: HALOT
  rationale: 문맥상 하나님께서 베푸시는 물질적 번영을 가리키므로, 고상한 문어체의 '부'가 'riches'의 의미를 간결하게 살립니다.
- source_word: הַכָּבוֹד
  english_pob_choice: honor
  chosen_korean: 존귀
  alternatives_korean:
  - 영광
  - 명예
  lexicon: HALOT
  rationale: '''riches''와의 병렬에서 사회적 지위와 위신을 함께 가리키는 말이므로, 전통적 교회어휘보다 ''존귀''가 원문 의미를 더 직접적으로 반영합니다.'
- source_word: מִלְּפָנֶיךָ
  english_pob_choice: come from before you
  chosen_korean: 주님 앞에서부터 나오며
  alternatives_korean:
  - 주님께로부터 나오며
  - 주님의 임재에서 나오며
  lexicon: HALOT
  rationale: 히브리어의 '앞/얼굴 앞' 이미지를 유지하면서, 한국어에서는 자연스럽게 '앞에서부터 나오며'로 옮겨 원문의 공간적 표현을 보존했습니다.
- source_word: מוֹשֵׁל בַּכֹּל
  english_pob_choice: you rule over all
  chosen_korean: 만물 위에 다스리십니다
  alternatives_korean:
  - 모든 것을 다스리십니다
  - 모든 것 위에 주권자이십니다
  lexicon: HALOT
  rationale: 통치의 지속적 행위를 살리되, 한국어에서는 왕권적 뉘앙스를 '만물 위에 다스리십니다'로 풀어 자연스럽게 표현했습니다.
- source_word: בְּיָדְךָ כֹּחַ וּגְבוּרָה
  english_pob_choice: In your hand are power and might
  chosen_korean: 주님의 손에는 능력과 권능이 있으며
  alternatives_korean:
  - 주님의 손에는 힘과 용맹이 있으며
  - 주님의 손에는 능력과 능력이 있으며
  lexicon: HALOT
  rationale: '''손''의 구체적 은유를 살리고, כֹּחַ는 ''능력'', גְבוּרָה는 더 강한 ''권능''으로 구분해 두 명사를 겹치지 않게 했습니다.'
- source_word: לְגַדֵּל וּלְחַזֵּק
  english_pob_choice: to make great and to strengthen
  chosen_korean: 크게 하시고 강하게 하실
  alternatives_korean:
  - 높이시고 굳게 하실
  - 크게 만드시고 강하게 하실
  lexicon: HALOT
  rationale: 동사의 목적어 없는 일반적 능력을 살리기 위해, 한국어에서는 '하시다' 구조로 풀어 하나님의 주권적 행위를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: '''riches''와 ''honor''의 결합을 한국어 교회어휘로 어떻게 살릴지'
  chosen_reading: 부와 존귀
  alternative_readings:
  - 재물과 영광
  - 부와 명예
  rationale: 원문은 물질적 번영과 사회적 존귀를 병렬합니다. '영광'은 כָּבוֹד의 가능한 뜻이지만, 여기서는 하나님이 베푸시는 지위와 위신을 가리키는 쪽이 더 직접적이어서 '존귀'를 택했습니다.
  doctrine_reference: HALOT; 원문 병렬 구조 보존
- issue: '''in your hand''의 은유를 직역할지 의미화할지'
  chosen_reading: 주님의 손에는
  alternative_readings:
  - 주님의 능력 안에는
  - 주님의 권세 아래에는
  rationale: 하나님의 주권과 행위 능력을 손의 은유로 제시하는 것이 시편적·역대기적 표현의 핵심이므로, 은유를 유지해 신학적 이미지를 보존했습니다.
  doctrine_reference: 원문 은유 보존; 신적 주권 표상
