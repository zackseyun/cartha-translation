  to: 야훼께서 온 이스라엘이 보는 앞에서 솔로몬을 지극히 크게 하시고, 그에게 그보다 먼저 이스라엘을 다스린 어느 왕에게도 없었던 왕권의 위엄을 주셨습니다.[a]
