  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
  footnotes:
  - marker: a
    text: Or 'royal splendor' or 'majesty of kingship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 온 이스라엘이 보는 앞에서 솔로몬을 지극히 크게 하시고, 그에게 그보다 먼저 이스라엘을 다스린 어느 왕에게도 없었던 왕권의 위엄을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕권의 광휘’, ‘왕의 위엄’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  english_pob_choice: made ... exceedingly great
  chosen_korean: 더욱 크게 하시고
  alternatives_korean:
  - 크게 하시고
  - 지극히 크게 하시고
  lexicon: HALOT
  rationale: 히필 동사의 ‘크게 하다’ 의미에 לְמַעְלָה의 강화가 더해져, 한국어에서는 자연스럽게 ‘더욱 크게’로 압축해 과장 없이 증강의 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명기적 고유명사는 관례적 대체어가 아니라 하나님의 이름 자체이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  english_pob_choice: in the sight of all Israel
  chosen_korean: 온 이스라엘의 눈앞에서
  alternatives_korean:
  - 온 이스라엘 앞에서
  - 온 이스라엘이 보는 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구가 공적인 인지·목격을 뜻하므로, 직역을 피하면서도 공개성은 유지되는 ‘눈앞에서’를 택했습니다.
- source_word: הוֹד מַלְכוּת
  english_pob_choice: royal majesty
  chosen_korean: 왕권의 위엄
  alternatives_korean:
  - 왕의 위엄
  - 왕권의 영화
  - 왕권의 광휘
  lexicon: HALOT
  rationale: הוֹד는 위엄·광휘를, מַלְכוּת는 왕권/왕의 통치를 가리키므로 둘을 함께 살려 ‘왕권의 위엄’으로 번역했습니다.
- source_word: עַל כָּל מֶלֶךְ ... עַל יִשְׂרָאֵל
  english_pob_choice: on any king before him over Israel
  chosen_korean: 이스라엘 위에 있던 어느 왕에게도 없었던
  alternatives_korean:
  - 이스라엘을 다스리던 어떤 왕에게도 없었던
  - 그 이전 이스라엘의 어떤 왕에게도 없었던
  lexicon: HALOT
  rationale: ‘위에’는 왕권의 지배 관계를, ‘어느 왕에게도 없었던’은 비교절의 독특함을 살려 원문의 왕권 비교를 유지합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 주어 자리에 고유 신명사를 사용하므로, 제목어 대체가 아니라 하나님의 이름 자체를 드러내는 번역을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
