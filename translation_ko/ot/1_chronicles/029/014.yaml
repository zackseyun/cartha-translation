  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
  footnotes:
  - marker: a
    text: Or, more formally, 'that we should have strength to offer willingly thus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 누구이며, 내 백성이 누구이기에 이처럼 자원하여 드릴 수 있겠습니까?[a] 모든 것은 주께로부터 온 것이며, 우리는 주의 손에서 받아 주께 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘이처럼 자원하여 드릴 힘을 지녔다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי / But
  english_pob_choice: But
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 또한
  - 그러나
  lexicon: HALOT
  rationale: 겸손한 수사적 전환을 자연스럽게 살리면서, 문맥의 반전·격하를 한국어로 가장 매끄럽게 표현합니다.
- source_word: מִי אֲנִי וּמִי עַמִּי / who am I, and who are my people
  english_pob_choice: who am I, and who are my people
  chosen_korean: 내가 누구이며, 내 백성이 누구이기에
  alternatives_korean:
  - 나는 누구이며, 내 백성은 누구이기에
  - 내가 어떤 사람이기에, 내 백성이 어떤 사람이기에
  lexicon: HALOT
  rationale: מִי의 직접적 의미인 ‘누구’와, 자격 없음의 수사적 뉘앙스를 함께 살리기 위해 질문형으로 옮겼습니다.
- source_word: נַעְצֹר כֹּחַ לְהִתְנַדֵּב כָּזֹאת / we should be able to offer willingly like this
  english_pob_choice: we should be able to offer willingly like this
  chosen_korean: 이처럼 자원하여 드릴 수 있겠습니까
  alternatives_korean:
  - 이처럼 자원할 힘이 있겠습니까
  - 이처럼 기꺼이 드릴 수 있겠습니까
  lexicon: HALOT
  rationale: ‘힘을 억제/보유하다’라는 어법을 직역하기보다, 문맥상 의미인 ‘자원하여 드릴 수 있는 능력’으로 풀어 합쇼체의 수사적 질문에 맞췄습니다.
- source_word: מִמְּךָ הַכֹּל / everything comes from you
  english_pob_choice: everything comes from you
  chosen_korean: 모든 것은 주께로부터 왔고
  alternatives_korean:
  - 모든 것은 주에게서 나오며
  - 모든 것이 주께로부터 옵니다
  lexicon: HALOT
  rationale: 원천과 소유의 관계를 드러내기 위해 ‘주께로부터 왔고’로 옮겼습니다.
- source_word: וּמִיָּדְךָ נָתַנּוּ לָךְ / from your hand we have given to you
  english_pob_choice: from your hand we have given to you
  chosen_korean: 우리가 주께 드린 것도 주의 손에서 받은 것입니다
  alternatives_korean:
  - 주의 손에서 받아 주께 드린 것입니다
  - 주의 손에서 받은 것을 주께 드렸습니다
  lexicon: HALOT
  rationale: ‘주의 손’이라는 히브리식 이미지를 유지하되, 한국어에서는 ‘드린 것도’와 ‘받은 것’의 대조로 의미를 분명히 했습니다.
theological_decisions:
- issue: 하나님의 선행적 공급과 인간의 헌물
  chosen_reading: 헌물은 인간의 소유를 자율적으로 내는 것이 아니라, 먼저 주께서 주신 것을 다시 주께 드리는 것이라는 점을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘우리가 주께 드렸다’로만 옮겨 공헌의 행위 자체를 강조할 수 있습니다.
  rationale: 히브리어는 모든 것이 하나님께로부터 왔고, 드린 것조차 주의 손에서 받은 것임을 말하므로, 그 신학적 긴장을 한국어에서도 분명히 보존했습니다.
  doctrine_reference: 창조주 하나님의 소유권과 인간의 응답적 헌신
