source:
  edition: WLC
  text: כִּֽי גֵרִ֨ים אֲנַ֧חְנוּ לְ/פָנֶ֛י/ךָ וְ/תוֹשָׁבִ֖ים כְּ/כָל אֲבֹתֵ֑י/נוּ כַּ/צֵּ֧ל יָמֵ֛י/נוּ עַל הָ/אָ֖רֶץ וְ/אֵ֥ין מִקְוֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
  footnotes:
  - marker: a
    text: Or 'strangers' / 'foreigners' for 'sojourners.'
    reason: lexical_alternative
  - marker: b
    text: Or 'resident aliens' for 'temporary residents.'
    reason: lexical_alternative
  - marker: c
    text: '''There is no hope'' here refers to the fleeting nature of human life on earth, not to the absence of hope in God.'
    reason: cross_reference
translation:
  language: ko
  text: 우리는 주님 앞에서 나그네[a]이며 거류민[b]입니다. 우리의 모든 조상도 그러했습니다. 우리가 땅 위에서 사는 날들은 그림자와 같으며, 소망이 없습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나그네’는 타지에 머무는 이, 곧 이방인이나 외국인으로도 옮길 수 있는 말을 번역한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거류민’은 정착민과 구별되는 거주자, 곧 ‘임시 거주자’ 또는 ‘거주 외국인’으로도 옮길 수 있는 말입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘소망이 없습니다’는 문맥상 땅 위에서 사는 인간 생명의 덧없음을 말합니다. ‘기대할 것이 없습니다’로도 옮길 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: גֵרִים
  english_pob_choice: sojourners
  chosen_korean: 나그네
  alternatives_korean:
  - 거류민
  - 외국인
  - 낯선 사람
  lexicon: HALOT
  rationale: גֵר는 단순한 '낯선 사람'보다 타지에서 임시로 머무는 사람의 지위를 가리키므로, 현대 한국어에서는 '나그네'가 가장 자연스럽게 그 사회적·존재론적 뉘앙스를 살립니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주님 앞에서는
  alternatives_korean:
  - 주님 앞에
  - 주님의 임재 안에서
  lexicon: HALOT
  rationale: 직역된 '당신의 얼굴 앞에'의 의미를 한국어로 자연스럽게 풀어, 하나님을 향한 대면성과 종속성을 함께 드러내기 위해 '주님 앞에서는'으로 옮겼습니다.
- source_word: תוֹשָׁבִים
  english_pob_choice: temporary residents
  chosen_korean: 거류민
  alternatives_korean:
  - 임시 거주자
  - 체류자
  - 거주 외국인
  lexicon: HALOT
  rationale: תוֹשָׁב는 완전한 토착민이 아닌 거주자를 뜻하므로, 앞의 '나그네'와 평행을 이루면서도 지속적 거주의 제한성을 드러내는 '거류민'이 적절합니다.
- source_word: כַּצֵּל
  english_pob_choice: like a shadow
  chosen_korean: 그림자와 같고
  alternatives_korean:
  - 그림자처럼
  - 그늘과 같고
  lexicon: HALOT
  rationale: 히브리어의 비유를 그대로 살려 인생의 덧없음과 실체 없음의 이미지를 보존하기 위해 '그림자와 같고'로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: וְאֵין מִקְוֶה의 의미
  chosen_reading: '''소망이 없습니다''로 번역하되, 문맥상 이는 땅에서의 인간 생명의 덧없음에 대한 진술로 이해합니다.'
  alternative_readings:
  - 희망이 없습니다
  - 기대할 것이 없습니다
  rationale: מִקְוֶה는 문맥상 '소망/기대'를 뜻할 수 있으며, 이 구절은 하나님 안의 소망 자체를 부정하기보다 인간 생명의 유한함을 강조합니다. 한국어에서는 현대적이고 분명한 '소망이 없습니다'가 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 문맥 보존 원칙; 인간의 유한성과 하나님의 소망을 구별함
