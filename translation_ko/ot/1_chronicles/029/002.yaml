  naturalness: ‘금은 금의 것들에’와 같은 표현은 현대 표준 한국어에서 부자연스럽고 문장 성분도 불완전합니다. ‘금으로 만들 것에는 금을’처럼 옮기면 원문의 반복과 배정 관계를 자연스럽게 살릴 수 있습니다. מִלּוּאִים은 돌 자체로 단정한 ‘끼움돌’보다 ‘끼움 장식’이 더 적절합니다.
  terminology: ‘내 하나님’만 유지해야 하며 ‘여호와’는 삭제해야 합니다. שֹׁהַם은 전통적으로 ‘오닉스’로 옮기되 식별 불확실성을 주석으로 밝혀야 합니다. פוּךְ은 ‘안티몬’과 관련된 난해한 재료이므로 ‘안티몬 돌’이라는 보수적 표현과 설명 주석이 적절합니다. שַׁיִשׁ의 ‘대리석’도 전통적 번역으로 두되 불확실성을 밝혀야 합니다.
  issues:
