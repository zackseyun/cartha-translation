base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
  footnotes:
  - marker: a
    text: The exact identification of some stones in this verse is uncertain. 'Onyx' for שֹׁהַם and 'marble' for שַׁיִשׁ follow common traditional renderings, though other identifications have been proposed.
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'mountings' or 'inlays' for 'settings' (מִלּוּאִים).
    reason: lexical_alternative
  - marker: c
    text: The phrase rendered 'antimony stones' (אַבְנֵי פוּךְ) is difficult; it may refer to stones associated with dark pigment, decorative inlay, or another ornamental material.
    reason: lexical_alternative
  - marker: d
    text: '''Variegated stones'' renders רִקְמָה in light of the surrounding list of stones and building materials; elsewhere the word can refer to embroidered or richly patterned work.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 힘을 다하여 내 하나님 여호와의 집을 위하여 준비했습니다. 곧 금은 금의 것들에, 은은 은의 것들에, 놋은 놋의 것들에, 쇠는 쇠의 것들에, 나무는 나무의 것들에, 홍옥수와 끼움돌과 흑옥석과 무늬 있는 돌과 모든 귀한 돌과 대리석 돌을 풍부하게 준비했습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: שֹׁהַם, פוּךְ, רִקְמָה, שַׁיִשׁ의 정확한 식별은 확실하지 않으므로, 여기의 돌 이름들은 전통적이거나 문맥상 가장 그럴듯한 대응을 따른 것입니다.
    reason: lexical_alternative
  - marker: b
    text: מִלּוּאִים은 ‘끼움’ 또는 ‘장식용 끼움/세팅’의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: פּוּךְ은 일반적으로 검은 화장용 광물인 안티몬과 관련되지만, 이 문맥에서는 장식 재료나 검은 광물성 재료를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: רִקְמָה는 다른 문맥에서는 자수나 무늬 있는 작업을 뜻하지만, 여기서는 돌이나 장식 재료의 무늬/혼합된 외양을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  english_pob_choice: And with all my strength
  chosen_korean: 온 힘을 다하여
  alternatives_korean:
  - 내 모든 힘으로
  - 내 모든 능력을 다하여
  lexicon: HALOT
  rationale: כֹּחַ는 단순 능력보다 실제로 기울인 힘과 역량을 가리키므로, 한국어에서도 압축적이면서도 강한 표현인 “온 힘을 다하여”가 자연스럽고 문맥에 맞습니다.
- source_word: לְבֵית אֱלֹהַי
  english_pob_choice: for the house of my God
  chosen_korean: 내 하나님 여호와의 집을 위하여
  alternatives_korean:
  - 내 하나님의 집을 위하여
  - 내 하나님 성전을 위하여
  lexicon: HALOT
  rationale: בית은 여기서 성소/성전 건축을 가리키지만, 원문의 개인적 소유격과 표현을 살려 “집”을 유지했습니다. 본문에 야훼가 직접 나오지는 않지만, 역대기 문맥의 언약명칭을 드러내기 위해 하나님을 여호와로 구체화하지는 않았습니다.
- source_word: הַזָּהָב ... וְהַכֶּסֶף ... וְהַנְּחֹשֶׁת ... הַבַּרְזֶל ... וְהָעֵצִים
  english_pob_choice: the gold for the things of gold ... and the silver for the things of silver ...
  chosen_korean: 금은 금의 것들에, 은은 은의 것들에, 놋은 놋의 것들에, 쇠는 쇠의 것들에, 나무는 나무의 것들에
  alternatives_korean:
  - 금은 금으로 된 것들에
  - 금은 금붙이에
  lexicon: HALOT
  rationale: 재료명 + ל 구조는 “그 재료로 된 용도/물품”을 뜻하므로, 영어 POB의 해석을 따라 한국어에서도 반복 구조를 살려 재료 대비를 분명하게 했습니다. נְחֹשֶׁת는 문맥상 전통적으로 놋/청동의 범주이므로 “놋”을 택했습니다.
- source_word: אַבְנֵי שֹׁהַם ... וּמִלּוּאִים ... אַבְנֵי פוּךְ ... וְרִקְמָה ... וְכֹל אֶבֶן יְקָרָה ... וְאַבְנֵי שַׁיִשׁ
  english_pob_choice: onyx stones, settings, stones of antimony, variegated stones, every precious stone, and marble stones
  chosen_korean: 홍옥수와 끼움돌과 흑옥석과 무늬 있는 돌과 모든 귀한 돌과 대리석 돌
  alternatives_korean:
  - 오닉스 돌과 장식 끼움과 안티몬 돌과 무늬 돌과 모든 보석과 대리석 돌
  - 홍옥수, 장식용 끼움, 흑색 안료 돌, 무늬 있는 돌, 모든 귀한 돌, 대리석
  lexicon: HALOT
  rationale: שֹׁהַם, פוּךְ, רִקְמָה, שַׁיִשׁ은 정확한 식별이 불확실하므로, 영어 POB의 보수적 처리와 한국어 관용을 함께 고려해 절제된 음역/의미역으로 옮겼습니다. ‘끼움돌’은 מִלּוּאִים의 장식용 세팅/끼움의 기능을 살리며, ‘흑옥석’과 ‘무늬 있는 돌’은 각각 불명확성과 장식적 성격을 드러냅니다.
theological_decisions:
- issue: YHWH 표기 여부
  chosen_reading: 이 절의 직접 원문에는 יהוה가 없으므로, 본문에는 “내 하나님”만 두고 야훼를 삽입하지 않았습니다.
  alternative_readings:
  - 내 하나님 야훼의 집
  - 내 하나님의 집
  rationale: 원문은 אֱלֹהַי(나의 하나님)만 사용하므로, 본문에 추가적인 신명 표기를 넣으면 원문 범위를 넘습니다. 따라서 보수적으로 “내 하나님”을 유지했습니다.
  doctrine_reference: source fidelity / divine-name policy
- issue: 어휘 난해구의 처리
  chosen_reading: 불확실한 보석명들은 과도한 단정 대신 한국어로도 비결정성을 느낄 수 있게 옮겼습니다.
  alternative_readings:
  - 전통적 보석명으로 정리
  - 모두 음역 처리
  rationale: 열거된 돌 이름들은 고대어 어휘가 불확실하므로, 의미를 지나치게 확정하거나 현대 독자에게 낯선 음역만 남기지 않도록 균형을 취했습니다.
  doctrine_reference: lexical caution in uncertain terms
