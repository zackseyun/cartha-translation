    rationale: 히브리어 본문은 לְבֵית אֱלֹהַי, 곧 ‘내 하나님의 집을 위하여’라고만 하며 יהוה는 없습니다. 초안의 자체 해설과도 모순됩니다.
  - severity: high
    issue: שֹׁהַם을 ‘홍옥수’로, אַבְנֵי פוּךְ을 ‘흑옥석’으로 옮긴 것은 지나치게 확정적이며 근거가 약합니다.
    rationale: שֹׁהַם의 전통적 번역은 오닉스이나 정확한 광물 식별은 불확실합니다. פוּךְ은 안티몬/검은 안료와 관련된 난해어이지 ‘흑옥석’이라는 특정 보석명으로 확정할 근거가 없습니다.
  - severity: medium
    issue: 재료 배정 구절이 부자연스럽고 의미가 불명료합니다.
    rationale: ‘금은 금의 것들에’는 현대 한국어에서 자연스럽지 않습니다. 재료로 만들 물품에 재료를 배정한다는 לַ 구조를 ‘금으로 만들 것에는 금을’으로 밝혀야 합니다.
