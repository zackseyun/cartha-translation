base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
  footnotes:
  - marker: a
    text: Or 'Please bless the LORD your God.' The particle נָא can add entreaty or urgency.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says they 'prostrated themselves' before 'the LORD and the king.' The wording describes bodily homage; some translations render the action toward the king as 'paid homage.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 다윗이 온 회중에게 말했습니다. “이제[a] 여러분의 하나님 야훼를 찬양하십시오.” 그러자 온 회중이 야훼, 곧 그들 조상의 하나님을 찬양하고, 야훼와 왕 앞에서 머리를 숙이고 엎드려 절했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “부디 여러분의 하나님 야훼를 찬양하십시오.” 히브리어 נָא는 간청이나 긴급함의 뉘앙스를 더할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 회중이 야훼와 왕 앞에서 ‘머리를 숙이고’ ‘엎드렸다’고 말합니다. 이는 몸으로 나타내는 경의의 자세를 묘사하며, 왕에게 향한 행위를 ‘경의를 표했다’로 옮기는 번역도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  english_pob_choice: Now bless
  chosen_korean: 이제 …를 찬양하십시오
  alternatives_korean:
  - 지금 …를 축복하십시오
  - 부디 …를 찬송하십시오
  lexicon: HALOT
  rationale: ברך의 여기서는 하나님을 향한 공적 찬양/복된 선포의 의미가 강하므로, 한국어에서는 자연스럽고 합쇼체인 “찬양하십시오”로 옮기되 נָא의 긴급·간청 뉘앙스를 “이제”로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 공동체 관용형 대신 본문 고유명인 YHWH의 학문적 음역을 유지해 하나님의 이름이라는 점을 드러냈습니다.
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 총회
  - 모인 백성
  lexicon: HALOT
  rationale: 이 문맥의 קָהָל은 예배적·공적 자리에서 모인 사람들을 가리키므로, 현대 한국어에서 자연스러운 “회중”을 택했습니다.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲוּ
  english_pob_choice: bowed their heads and prostrated themselves
  chosen_korean: 엎드려 절했습니다
  alternatives_korean:
  - 고개를 숙이고 엎드려 절했습니다
  - 몸을 굽혀 절했습니다
  lexicon: HALOT
  rationale: 두 동작을 한국어에서 자연스럽게 한 묶음으로 표현하되, 본문의 몸짓적 경외를 살리기 위해 “엎드려 절했습니다”를 사용했습니다.
theological_decisions:
- issue: 야훼와 왕 앞에 드리는 몸짓의 범위
  chosen_reading: 같은 몸짓을 하나님과 왕 모두에게 연결하되, “야훼 앞과 왕 앞에”로 구분을 유지했습니다.
  alternative_readings:
  - 왕에게도 예배를 드렸다는 식의 평탄화
  - 왕에게는 단순한 경의를 표했다는 해석적 축소
  rationale: 히브리어는 두 객체 모두에 대해 동일한 자세 동사를 사용하므로, 번역도 그 긴장을 보존해야 합니다. 다만 한국어에서는 “엎드려 절했습니다”로 번역해 예배와 경의를 동일시하지 않도록 했습니다.
  doctrine_reference: '번역 원칙 #3: 신학적 긴장을 해소하지 말고 본문에 남겨 둔다.'
