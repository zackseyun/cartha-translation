  source_fidelity: 원문의 명사구 나열은 금과 은이 각각 금·은으로 만들 물건에 쓰이고, 장인들이 수행할 모든 작업을 위한 것임을 뜻합니다. 초안의 ‘...일은 장인들의 손을 통하여 이루어집니다’는 목적·용도의 나열을 현재의 수동 사건으로 바꾸므로 바로잡아야 합니다. לַיהוָה는 여기서 ‘여호와께’보다 ‘여호와를 위하여’가 더 직접적입니다. לְמַלֹּאות יָדוֹ는 본문에서 직역을 유지하고 주석으로 제의적 용례를 밝혀, 의미를 단정하지 않았습니다.
  naturalness: ‘자기 손을 채울 사람’은 현대 일상어로는 낯설지만, 의도적으로 보존한 히브리어 관용구이며 각주가 이를 설명합니다. 나머지는 현대 표준어 합쇼체로 자연스럽게 정리했습니다.
  terminology: ‘여호와’는 제시된 한국어 프로젝트 관례와 일치합니다. ‘장인들의 손으로 할 온갖 일’은 בְּיַד חָרָשִׁים의 실행 주체와 ‘손’의 이미지를 보존합니다. 각주의 ‘성별이나 제의적 봉헌’은 관용구의 가능한 함의를 제시하되 특정 교리적 해석을 강요하지 않습니다.
