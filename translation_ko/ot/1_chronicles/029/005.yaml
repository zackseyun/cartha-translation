  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/זָּהָ֤ב לַ/זָּהָב֙ וְ/לַ/כֶּ֣סֶף לַ/כֶּ֔סֶף וּ/לְ/כָל מְלָאכָ֖ה בְּ/יַ֣ד חָרָשִׁ֑ים וּ/מִ֣י מִתְנַדֵּ֔ב לְ/מַלֹּ֥אות יָד֛/וֹ הַ/יּ֖וֹם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
  footnotes:
  - marker: a
    text: Literally, 'to fill his hand.' This Hebrew idiom can refer to consecration or presenting an offering for sacred service.
    reason: lexical_alternative
translation:
  language: ko
  text: 금은 금으로 만들 물건을 위하여, 은은 은으로 만들 물건을 위하여, 또 모든 종류의 일은 장인들의 손을 통하여 이루어집니다. 오늘 누구든지 자원하여 자신의 손을 여호와께 채우겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 손을 채우다’입니다. 이 관용구는 성별이나 제의적 봉헌을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַזָּהָב ... לַזָּהָב / וְלַכֶּסֶף לַכֶּסֶף
  english_pob_choice: gold for the things of gold / silver for the things of silver
  chosen_korean: 금은 금으로 만들 물건을 위하여 / 은은 은으로 만들 물건을 위하여
  alternatives_korean:
  - 금은 금을 위하여 / 은은 은을 위하여
  - 금은 금세공품을 위하여 / 은은 은세공품을 위하여
  lexicon: HALOT
  rationale: 반복된 목적격 표현은 재료가 같은 재질의 성물/기물을 위해 구비된다는 뜻이므로, ‘만들 물건’을 보충해 뜻을 분명히 하되 과도한 의역은 피했습니다.
- source_word: וּלְכָל מְלָאכָה
  english_pob_choice: and for every kind of work
  chosen_korean: 또 모든 종류의 일
  alternatives_korean:
  - 또 모든 공역
  - 또 모든 제작 일
  lexicon: HALOT
  rationale: מְלָאכָה는 여기서 성전 건축에 필요한 작업 전반을 가리키므로, 현대 한국어에서 자연스러운 ‘모든 종류의 일’로 넓이를 살렸습니다.
- source_word: בְּיַד חָרָשִׁים
  english_pob_choice: by the hands of craftsmen
  chosen_korean: 장인들의 손을 통하여
  alternatives_korean:
  - 장인들의 손으로
  - 장인들에 의해
  lexicon: HALOT
  rationale: 직역의 ‘손’ 이미지를 살리되 한국어에서는 도구적 표현으로 읽히도록 ‘통하여’를 택해, 숙련된 장인에 의한 실행이라는 뜻을 유지했습니다.
- source_word: וּמִי מִתְנַדֵּב
  english_pob_choice: And who is willing
  chosen_korean: 오늘 누구든지 자원하여
  alternatives_korean:
  - 오늘 누구든지 기꺼이
  - 오늘 누가 자원하겠습니까
  lexicon: HALOT
  rationale: התנדב는 자원/기꺼이 드리는 뉘앙스이므로, 청중을 향한 수사적 요청에 맞게 ‘자원하여’로 옮겼습니다.
- source_word: לְמַלֹּאות יָדוֹ
  english_pob_choice: to fill his hand
  chosen_korean: 자신의 손을 여호와께 채우겠습니까
  alternatives_korean:
  - 자신의 손을 채우겠습니까
  - 자신의 손을 성별하겠습니까
  lexicon: HALOT
  rationale: 이 관용구는 문자적으로 ‘손을 채우다’이며, 제의적 봉헌/임직의 함의를 잃지 않도록 본문에는 직역을 유지했습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 여호와께
  alternatives_korean:
  - 야훼께
  - 주님께
  lexicon: HALOT
  rationale: 이 프로젝트의 본문 관례에 맞추어 야훼 고유명을 표준 한국어 성경 관용인 ‘여호와’로 옮겼습니다.
theological_decisions:
- issue: לְמַלֹּאות יָדוֹ의 제의적 의미
  chosen_reading: ‘손을 채우다’의 직역을 본문에 두어, 자원 헌납과 성별/임직의 제의적 함의를 함께 보이도록 했습니다.
  alternative_readings:
  - ‘헌신하다’로 풀어씀
  - ‘임직하다’로 특정화
  rationale: 문맥상 단순한 금전 제공만이 아니라 성전 사업에 참여하려는 헌신의 초청이므로, 해석을 과도하게 특정하지 않으면서도 제의적 배경을 드러내는 것이 적절합니다.
  doctrine_reference: POB translation philosophy §1, §3, §6
