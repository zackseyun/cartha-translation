  source_fidelity: ‘이스라엘의’가 히브리어에서는 ‘지파들’을 수식하므로, 첫 항목을 ‘이스라엘의 족장들’로 한정하지 않고 ‘가문의 우두머리들’로 옮기는 편이 본문의 결속 관계를 더 충실히 반영합니다. 왕의 일과 관련된 이들은 ‘감독자’로 단정하기보다 본문의 שָׂרִים에 맞게 ‘관리들’로 번역하는 것이 안전합니다.
