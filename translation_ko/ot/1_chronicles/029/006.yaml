source:
  edition: WLC
  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
  footnotes:
  - marker: a
    text: Or “offered willingly” or “volunteered.” The Hebrew verb emphasizes a freewill response; in this context it likely refers to voluntary giving.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the fathers’ houses,” referring to ancestral or clan-based family divisions.
    reason: cultural_note
  - marker: c
    text: “The thousands and the hundreds” refers to military or administrative units, and thus to their commanders.
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 가문의 우두머리들[a], 이스라엘 지파들의 지도자들, 천부장들과 백부장들[b], 그리고 왕의 일을 맡은 관리들이 자원하여 헌물을 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아버지들의 집들’은 씨족·가문 단위를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘천 명’과 ‘백 명’은 군사적 또는 행정적 단위를 가리키며, 여기서는 그 지휘관들을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  english_pob_choice: gave willingly
  chosen_korean: 자원하여 드렸습니다
  alternatives_korean:
  - 기꺼이 드렸습니다
  - 자발적으로 드렸습니다
  lexicon: HALOT
  rationale: 동사의 자원성은 살리되, 문맥상 단순한 ‘지원’이 아니라 실제 헌납을 가리키므로 ‘드렸습니다’를 붙여 번역했습니다.
- source_word: שָׂרֵי הָאָבוֹת
  english_pob_choice: the leaders of the fathers’ houses
  chosen_korean: 이스라엘의 족장들
  alternatives_korean:
  - 조상의 집들의 지도자들
  - 족장들
  lexicon: HALOT
  rationale: ‘fathers’ houses’는 족보적·씨족적 단위를 가리키므로 한국어에서는 의미를 살려 ‘족장들’로 옮기고, 앞의 ‘이스라엘의’로 범위를 분명히 했습니다.
- source_word: שָׂרֵי שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of the tribes of Israel
  chosen_korean: 각 지파의 지도자들
  alternatives_korean:
  - 이스라엘 지파들의 지도자들
  - 이스라엘의 지파 지도자들
  lexicon: HALOT
  rationale: 지파 단위의 통치·대표자를 자연스럽게 드러내기 위해 ‘각 지파의 지도자들’로 옮겼습니다.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  english_pob_choice: the commanders of the thousands and of the hundreds
  chosen_korean: 천부장들과 백부장들
  alternatives_korean:
  - 천인대장들과 백인대장들
  - 천 명과 백 명의 지휘관들
  lexicon: HALOT
  rationale: ‘천-백’ 단위는 고대 군사·행정 단위를 가리키므로 한국어 관용어인 ‘천부장/백부장’이 가장 직접적입니다.
- source_word: מְלֶאכֶת הַמֶּלֶךְ
  english_pob_choice: the king’s work
  chosen_korean: 왕의 일의 감독자들
  alternatives_korean:
  - 왕의 일
  - 왕의 업무를 맡은 자들
  lexicon: HALOT
  rationale: 문맥상 ‘왕의 일’은 특정 사업의 수행을 뜻하며, 직함이 아니라 담당 역할을 나타내므로 POB의 ‘overseers’에 맞춰 ‘감독자들’로 풀었습니다.
theological_decisions:
- issue: 자원하여 드린 행위의 성격
  chosen_reading: 본문은 강제 헌납이 아니라 지도자들의 자발적이고 기꺼운 헌납을 강조합니다.
  alternative_readings:
  - 단순히 ‘제공했다’는 중립적 읽기
  - 직책상 의무를 수행했다는 읽기
  rationale: 히트파엘 형태의 נדב와 문맥이 자유의사를 분명히 하므로, 자원성을 한국어 본문에서 분명히 드러냈습니다.
  doctrine_reference: 자원 헌신/자발적 헌물
