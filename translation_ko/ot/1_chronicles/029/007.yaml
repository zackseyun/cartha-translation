source:
  edition: WLC
  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a myriad and eight thousand talents of bronze,'' that is, eighteen thousand talents.'
    reason: lexical_alternative
  - marker: b
    text: A 'daric' was a Persian gold coin.
    reason: cultural_note
  - marker: c
    text: A 'talent' was a large unit of weight, not a modern 'talent' in the sense of ability.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 하나님의 집을 위한 일에 금 오천 달란트와 다릭[a] 만 개, 은 만 달란트, 청동 만 팔천 달란트[b], 그리고 철 십만 달란트를 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다릭’은 페르시아의 금화입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 ‘일만과 팔천 달란트’라고 하며, 합계는 1만 8천 달란트입니다. ‘달란트’는 큰 무게 단위입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲבוֹדַת
  english_pob_choice: for the service of
  chosen_korean: 봉사를 위해
  alternatives_korean:
  - 일을 위해
  - 섬김을 위해
  lexicon: HALOT
  rationale: עֲבוֹדָה는 ‘일’과 ‘봉사/섬김’의 뜻을 함께 가질 수 있으며, 여기서는 하나님 집에 드리는 헌납의 목적을 드러내기 위해 ‘봉사’를 택했습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집
  lexicon: HALOT
  rationale: 원문은 직역하면 ‘하나님의 집’이며, ‘성전’은 의미상 가능하지만 원문보다 더 구체적인 해석을 덧붙이므로 기본형을 유지했습니다.
- source_word: אֲדַרְכֹנִים
  english_pob_choice: darics
  chosen_korean: 다릭
  alternatives_korean:
  - 다릭 금화
  - 금화
  lexicon: HALOT
  rationale: 페르시아 금화의 고유명칭을 음역해 역사적 특수성을 보존했습니다. 본문에서는 독해를 위해 단수형이 아닌 복수 표지와 함께 자연스럽게 처리했습니다.
- source_word: כִּכָּרִים
  english_pob_choice: talents
  chosen_korean: 달란트
  alternatives_korean:
  - 무게 단위 달란트
  - 무게 단위
  lexicon: HALOT
  rationale: כִּכָּר은 현대어 ‘재능’이 아니라 무게 단위이므로, POB의 관례에 따라 ‘달란트’로 옮겼습니다.
- source_word: וּשְׁמוֹנַת אֲלָפִים
  english_pob_choice: eighteen thousand
  chosen_korean: 만 팔천
  alternatives_korean:
  - 십만에 팔천
  - 팔천
  lexicon: HALOT
  rationale: 히브리어는 앞의 ‘만’(10,000)에 이어 ‘여덟 천’을 더해 총 18,000을 뜻하므로, 한국어에서는 합산값을 풀어 ‘만 팔천’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 제물/헌납의 성격을 어떻게 드러낼지
  chosen_reading: ‘드렸습니다’로 번역해 금속과 화폐의 단순 전달이 아니라 성전 봉사를 위한 헌납임을 분명히 했습니다.
  alternative_readings:
  - 주었습니다
  - 바쳤습니다
  rationale: 문맥상 다윗과 백성이 성전 공사를 위한 예물을 자발적으로 헌납하는 장면이므로, 한국어에서도 헌납의 성격이 살아나도록 했습니다.
  doctrine_reference: Temple dedication and offerings in 1 Chronicles 29
