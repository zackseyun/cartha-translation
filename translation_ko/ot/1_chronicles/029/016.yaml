  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
  footnotes:
  - marker: a
    text: Or 'all this wealth' or 'all this store'; the Hebrew term refers to the large quantity of materials amassed for the temple.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from your hand it is.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and all is yours.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오 야훼 우리 하나님이여, 우리가 주님의 거룩한 이름을 위하여 주님께 집을 건축하도록 준비한 이 모든 풍성함은 주님의 손에서 나온 것이며, 모든 것은 주님의 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풍성함’은 כאן의 הֶהָמוֹן가 가리킬 수 있는 ‘많은 양, 재물, 축적된 물자’의 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘주님의 손에서 그것입니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 문자적으로 ‘모든 것이 주님의 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 야훼 우리 하나님이여
  lexicon: HALOT
  rationale: 여호와 대신 야훼를 사용하여 언약 নাম을 직접 반영했고, 호격이므로 문두에 ‘오’를 두어 기도체를 살렸습니다.
- source_word: כֹּל הֶהָמוֹן הַזֶּה
  english_pob_choice: all this abundance
  chosen_korean: 이 모든 풍성함
  alternatives_korean:
  - 이 모든 풍요
  - 이 모든 재물
  - 이 모든 무리
  lexicon: HALOT
  rationale: הָמוֹן은 단순한 ‘무리’보다 여기서는 성전 건축을 위해 모아 둔 많은 물량을 가리키므로, 의미를 살려 ‘풍성함’으로 옮겼습니다.
- source_word: מִיָּדְךָ הִיא
  english_pob_choice: is from your hand
  chosen_korean: 주님의 손에서 나온 것이며
  alternatives_korean:
  - 주님의 손에서 온 것이며
  - 주님의 손에 있는 것이며
  - 주님의 손에서 비롯된 것이며
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘주님의 손에서 그것입니다’이므로, 손의 이미지와 출처 의미를 살려 자연스럽게 표현했습니다.
- source_word: וּלְךָ הַכֹּל
  english_pob_choice: all things are yours
  chosen_korean: 모든 것은 주님의 것입니다
  alternatives_korean:
  - 모든 것이 주님의 것입니다
  - 모든 것은 주님의 소유입니다
  lexicon: HALOT
  rationale: 소유 관계를 분명히 하되, 현대 한국어에서 자연스럽고 경건한 표현인 ‘주님의 것입니다’를 택했습니다.
theological_decisions:
- issue: 기도문에서의 호칭과 2인칭 존대
  chosen_reading: ‘야훼 우리 하나님이여… 주님의…’로 시작하고, 하나님께 직접 말하는 부분은 존대형을 유지했습니다.
  alternative_readings:
  - ‘야훼 우리 하나님…’
  - ‘오 주님…’
  rationale: 원문은 직접 기도하는 호격이므로 한국어에서도 경건한 호칭을 드러내야 하며, 하나님께 대한 직접 대화는 합쇼체/존대형이 적절합니다.
  doctrine_reference: 공적 기도문 번역 원칙
