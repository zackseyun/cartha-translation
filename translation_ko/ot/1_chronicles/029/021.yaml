source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
  footnotes:
  - marker: a
    text: Or more smoothly, 'on the following day.' The Hebrew is literally 'on the next day after that day.'
    reason: lexical_alternative
  - marker: b
    text: '''Drink offerings'' refers to liquid offerings poured out with the animal sacrifices; alternatively, ''libations.'''
    reason: cultural_note
  - marker: c
    text: Or 'on behalf of all Israel.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그날의 이튿날 야훼께 희생제물을 바치고[a] 번제물을 올렸습니다. 곧 황소 천 마리, 숫양 천 마리, 어린양 천 마리와 그에 딸린 전제물[b], 그리고 온 이스라엘을 위한[c] 많은 희생제물이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문맥의 ‘희생제물’은 번제와 구별되는 일반적인 희생 제물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘전제물’은 희생제물과 함께 부어 드리는 액체 제물을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘온 이스라엘을 위해’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ / זְבָחִים
  english_pob_choice: They sacrificed sacrifices
  chosen_korean: 제물을 드리고
  alternatives_korean:
  - 희생제물을 바치고
  - 제사드리고
  lexicon: HALOT
  rationale: זבח 계열은 제의적 희생을 가리키므로, 한국어에서는 중복을 피하면서도 제의 행위를 드러내는 ‘제물을 드리다’로 옮겼습니다. ‘제사드리다’는 본문에 있는 제물의 구체성을 다소 약화시킬 수 있습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: WLC source form יהוה
  rationale: 원문이 신명기적 계약명인 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: עֹלוֹת
  english_pob_choice: burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 전번제물
  lexicon: HALOT
  rationale: 제의 용어로서 עֹלוֹת은 전부 불태우는 번제를 뜻하므로, 현대 한국어에서 자연스러운 ‘번제물’로 옮겼습니다.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  english_pob_choice: on the next day after that day
  chosen_korean: 그 다음 날
  alternatives_korean:
  - 그 날의 다음 날
  - 그 후 다음 날
  lexicon: HALOT
  rationale: 히브리어는 강조된 시간 표현이지만, 한국어에서는 같은 순서를 자연스럽게 살리기 위해 ‘그 다음 날’로 간결하게 옮겼습니다.
- source_word: וְנִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그들의 전제물
  alternatives_korean:
  - 그들의 술제물
  - 그들의 붓는 제물
  lexicon: HALOT
  rationale: נסך는 희생제물과 함께 부어 드리는 전제(灌奠)를 가리키므로, 전통적이면서도 의미를 유지하는 ‘전제물’로 옮겼습니다.
theological_decisions:
- issue: לְכָל יִשְׂרָאֵל의 범위
  chosen_reading: 온 이스라엘을 위하여
  alternative_readings:
  - 모든 이스라엘을 위해
  - 이스라엘 전체를 대표하여
  rationale: ל은 여기서 수혜/지향의 폭을 나타내므로, 본문이 말하는 공동체적 범위를 그대로 드러내는 ‘온 이스라엘을 위하여’가 가장 무난합니다. 대표 대속의 뉘앙스는 본문보다 강하므로 넣지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
