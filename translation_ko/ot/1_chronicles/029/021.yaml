revisions:
- from: 그들은 야훼께 제물을 드리고, 그 다음 날 번제물도 야훼께 올렸습니다. 곧 수송아지 천 마리, 숫양 천 마리, 어린양 천 마리와 그들의 전제물, 그리고 온 이스라엘을 위하여 많은 제물을 드렸습니다.[a][b][c]
  to: 그들은 그날의 이튿날 야훼께 희생제물을 바치고[a] 번제물을 올렸습니다. 곧 황소 천 마리, 숫양 천 마리, 어린양 천 마리와 그에 딸린 전제물[b], 그리고 온 이스라엘을 위한[c] 많은 희생제물이었습니다.
  rationale: 시간구를 문두로 옮겨 두 제의 행위 모두에 적용됨을 분명히 했고, פָּרִים을 ‘황소’로 바로잡았습니다. 제의 용어의 구별과 원문의 수량 및 ‘온 이스라엘을 위한’ 범위는 보존했습니다. 각주 앵커도 각각의 해당 어구에 배치했습니다.
