  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֤וּ הָ/עָם֙ עַל הִֽתְנַדְּבָ֔/ם כִּ֚י בְּ/לֵ֣ב שָׁלֵ֔ם הִֽתְנַדְּב֖וּ לַ/יהוָ֑ה וְ/גַם֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ שָׂמַ֖ח שִׂמְחָ֥ה גְדוֹלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
  footnotes:
  - marker: a
    text: Or 'because of their freewill offering'; the Hebrew verb/root emphasizes voluntary, willing giving.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with a whole heart,' expressing undivided sincerity or integrity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 백성은 자원하여 드렸기 때문에 기뻐하였고, 또 온전한 마음으로 야훼께 자원하여 드렸기 때문에 기뻐하였습니다. 다윗 왕도 큰 기쁨으로 기뻐하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 자원하는 예물 때문에’. 히브리어 동사/어근은 자발적이고 기꺼운 드림을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘온전한 마음으로’입니다. 이는 나뉘지 않은 진심과 성실함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ / שָׂמַח שִׂמְחָה גְדוֹלָה
  english_pob_choice: rejoiced / rejoiced with great joy
  chosen_korean: 기뻐하였고 / 큰 기쁨으로 기뻐하였습니다
  alternatives_korean:
  - 즐거워하였고 / 매우 기뻐하였습니다
  - 환호하였고 / 크게 기뻐하였습니다
  lexicon: HALOT
  rationale: 히브리어의 반복된 기쁨 어근을 살려, 단순히 ‘기뻐하다’에 수식어를 더해 강한 반복 효과를 유지했습니다.
- source_word: הִתְנַדְּבָם / הִתְנַדְּבוּ
  english_pob_choice: had offered willingly
  chosen_korean: 자원하여 드렸기 때문에
  alternatives_korean:
  - 기꺼이 바쳤기 때문에
  - 자발적으로 바쳤기 때문에
  lexicon: HALOT
  rationale: נדב의 히트파엘은 의무가 아닌 자원성을 강조하므로, 헌금/헌물을 드리는 문맥에 맞게 ‘자원하여 드리다’로 옮겼습니다.
- source_word: בְּלֵב שָׁלֵם
  english_pob_choice: with a whole heart
  chosen_korean: 온전한 마음으로
  alternatives_korean:
  - 완전한 마음으로
  - 한결같은 마음으로
  - 온 마음을 다해
  lexicon: HALOT
  rationale: 직역적 ‘whole heart’의 의미를 한국어 관용 속에서 가장 자연스럽게 드러내는 표현으로, 분열되지 않은 성실성과 진정성을 보존합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명사 표기를 학술적 음역 ‘야훼’로 일관되게 옮겨, 언약명 자체를 가리키는 직접성을 유지했습니다.
- source_word: דָּוִיד הַמֶּלֶךְ
  english_pob_choice: David the king
  chosen_korean: 다윗 왕도
  alternatives_korean:
  - 왕 다윗도
  - 다윗 왕께서도
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 자연스러운 한국어로 풀되, 문맥의 병렬성과 서술 리듬을 유지했습니다.
theological_decisions:
