base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
  footnotes:
  - marker: a
    text: Or 'that came upon him.' The Hebrew idiom is literally 'that passed over him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the kingdoms of the countries.' The Hebrew has the plural 'lands,' referring to the surrounding territories or nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 모든 통치와 용맹, 그리고 그와 이스라엘과 모든 땅의 왕국들[b] 위로 지나간 때들[a]에 대한 기록입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘그 위로 지나간’이며, ‘그에게 닥친’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 복수형 ‘땅들’을 사용하여 주변 지역이나 민족들을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְכוּתוֹ
  english_pob_choice: his reign
  chosen_korean: 그의 통치
  alternatives_korean:
  - 그의 왕국
  - 그의 다스림
  lexicon: HALOT
  rationale: 문맥이 다윗의 생애와 활동을 요약하는 종결 공식이므로, ტერიტorial한 ‘왕국’보다 지속적인 통치의 의미를 담은 ‘통치’가 더 잘 맞습니다.
- source_word: גְבוּרָתוֹ
  english_pob_choice: his might
  chosen_korean: 그의 용맹
  alternatives_korean:
  - 그의 힘
  - 그의 권능
  lexicon: HALOT
  rationale: 통치와 병렬을 이루는 단어로서 단순한 힘보다 다윗의 전투적 강함과 위력을 드러내는 ‘용맹’이 자연스럽습니다.
- source_word: הָעִתִּים אֲשֶׁר עָבְרוּ עָלָיו
  english_pob_choice: the times that passed over him
  chosen_korean: 그와… 위로 지나간 시대들
  alternatives_korean:
  - 그에게 닥친 시기들
  - 그가 겪은 때들
  lexicon: HALOT
  rationale: POB가 보존한 히브리어 관용구 ‘지나가다’의 이미지를 살리되, 한국어에서 어색하지 않도록 ‘시대들’로 옮겼습니다.
- source_word: וְעַל יִשְׂרָאֵל וְעַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  english_pob_choice: and over Israel and over all the kingdoms of the lands
  chosen_korean: 이스라엘에게, 또한 모든 땅의 모든 나라들 위로
  alternatives_korean:
  - 이스라엘 위로, 또한 모든 땅의 모든 나라들 위로
  - 이스라엘과 모든 땅의 모든 나라들 위로
  lexicon: HALOT
  rationale: 반복되는 전치사 עַל의 병렬성을 한국어에서도 ‘위로’로 최대한 유지했고, ‘땅들/나라들’의 복수 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 이 절의 성격
  chosen_reading: 다윗의 통치와 그가 겪은 역사적 시기를 함께 묶어 기록한 결론적 사료 요약으로 읽었습니다.
  alternative_readings:
  - 단순한 연대기적 마무리
  - 왕권의 영광만을 강조하는 진술
  rationale: 본문은 왕권과 힘뿐 아니라 ‘그에게/이스라엘에게/모든 나라들 위로 지나간 시대들’을 함께 언급하여, 영광과 환난을 모두 포괄하는 결산적 서술로 읽는 것이 더 정확합니다.
  doctrine_reference: 문맥 주해
