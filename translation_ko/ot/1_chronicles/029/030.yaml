- from: 그의 통치와 그의 용맹, 그리고 그와 이스라엘에게, 또한 모든 땅의 모든 나라들 위로 지나간 시대들에 대한 기록입니다.[a][b]
  to: 그의 모든 통치와 용맹, 그리고 그와 이스라엘과 모든 땅의 왕국들[b] 위로 지나간 때들[a]에 대한 기록입니다.
