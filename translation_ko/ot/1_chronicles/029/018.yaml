base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
  footnotes:
  - marker: a
    text: Hebrew “Israel”; many readers may expect “Jacob” in this patriarchal formula, but the text here reads “Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “keep this forever as the inclination of the thoughts of the heart of your people.”
    reason: alternative_reading
  - marker: c
    text: Or “establish their heart toward you.”
    reason: lexical_alternative
  - marker: d
    text: Or 'in the intentions of the thoughts of the heart of your people'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼 하나님, 아브라함과 이삭과 이스라엘 우리 조상들의 하나님, 이것을 영원히 당신의 백성의 마음 생각의 의향으로 지켜 주시고, 그들의 마음을 당신께로 굳게 세워 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 흔히 예상되는 ‘야곱’이 아니라 ‘이스라엘’이라고 적고 있습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘이것을 영원히 당신의 백성의 마음 생각의 성향으로 지켜 주십시오.’
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그들의 마음을 당신께로 굳게 세워 주십시오.’
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문에 직접 יְהוָה가 나오므로 프로젝트 기본값대로 고유 이름을 ‘야훼’로 옮겨 언약적 이름을 드러냈습니다.
- source_word: אֱלֹהֵי
  english_pob_choice: God of
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님의
  - 하나님
  lexicon: HALOT
  rationale: 족장 이름들과 결합한 관형 구조를 한국어에서는 ‘…하나님’으로 자연스럽게 풀어, 호칭의 관계를 분명히 했습니다.
- source_word: שֳׁמְרָה
  english_pob_choice: keep
  chosen_korean: 지켜 주십시오
  alternatives_korean:
  - 보존해 주십시오
  - 간직해 주십시오
  lexicon: HALOT
  rationale: 기도문의 청유로서 단순 보존보다 지속적 보호와 유지의 뉘앙스를 살려 ‘지켜 주십시오’로 옮겼습니다.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב
  english_pob_choice: the intentions of the thoughts of the heart
  chosen_korean: 마음 생각의 의향
  alternatives_korean:
  - 마음 생각의 의도
  - 마음 생각의 경향
  lexicon: HALOT
  rationale: ‘יֵצֶר’의 의향/성향과 ‘מַחְשְׁבוֹת’의 생각을 함께 살리되, 한국어에서 과도하게 장황해지지 않도록 ‘마음 생각의 의향’으로 압축했습니다.
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  english_pob_choice: and direct their heart toward you
  chosen_korean: 그들의 마음을 당신께로 굳게 세워 주십시오
  alternatives_korean:
  - 그들의 마음을 당신께로 향하게 해 주십시오
  - 그들의 마음을 당신께로 확고히 해 주십시오
  lexicon: HALOT
  rationale: ‘כון’의 ‘세우다/굳게 하다/정하다’의 뜻을 반영해 단순 방향성보다 결의의 고정과 정렬을 함께 드러냈습니다.
theological_decisions:
- issue: 여호와/주가 아닌 יְהוָה의 표기
  chosen_reading: 본문의 언약명은 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 Tetragrammaton을 직접 사용하므로, 전통적 대체어보다 본문 고유명을 보존하는 쪽이 source-direct 원칙에 부합합니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
- issue: ‘우리 조상들’의 성별-정확성
  chosen_reading: ‘아브라함과 이삭과 이스라엘 우리 조상들’로 옮겼습니다.
  alternative_readings:
  - 우리 조상들
  - 우리 선조들
  rationale: 히브리어 복수 남성형 אֲבֹתֵינוּ를 반영해, 족장 언약 문맥의 남성 복수 표지를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
