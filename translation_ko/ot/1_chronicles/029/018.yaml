    reason: alternative_reading
  - marker: c
    text: Or “establish their heart toward you.”
    reason: lexical_alternative
  - marker: d
    text: Or 'in the intentions of the thoughts of the heart of your people'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼, 우리 조상 아브라함과 이삭과 이스라엘[a]의 하나님이시여, 이것이 영원히 당신의 백성이 마음에 품은 생각의 성향으로 남아 있게 해 주시고[b], 그들의 마음을 당신께로 향하게 해 주십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 흔히 예상되는 ‘야곱’이 아니라 ‘이스라엘’이라고 적고 있습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘이것을 영원히 당신의 백성이 마음에 품은 생각의 성향으로 지켜 주십시오.’
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그들의 마음을 당신께로 굳게 세워 주십시오.’
    reason: lexical_alternative
