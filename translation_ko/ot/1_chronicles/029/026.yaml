  text: And David son of Jesse reigned over all Israel.
translation:
  language: ko
  text: 그리고 이새의 아들 다윗은 온 이스라엘을 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  english_pob_choice: And David
  chosen_korean: 그리고 … 다윗은
  alternatives_korean:
  - 이제 다윗은
  - 다윗은
  lexicon: HALOT
  rationale: וְ의 단순 접속을 자연스러운 문맥 연결어 ‘그리고’로 옮겼고, 고유명사 דוד는 통용되는 ‘다윗’으로 표기했습니다.
- source_word: בֶּן יִשָׁי
  english_pob_choice: son of Jesse
  chosen_korean: 이새의 아들
  alternatives_korean:
  - 이새의 아들인
  - 이새의 아들 다윗
  lexicon: HALOT
  rationale: 씨족적 식별을 나타내는 구성형을 한국어 관용에 맞게 ‘이새의 아들’로 옮겨, 계보 정보를 보존했습니다.
- source_word: מָלַךְ
  english_pob_choice: reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕 노릇했습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 단순한 즉위가 아니라 왕권을 행사한 상태이므로, 한국어에서는 ‘다스리다’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: כָּל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 전부
  lexicon: HALOT
  rationale: כָּל의 총체성을 살리되 한국어 성서문맥에서 자연스러운 ‘온 이스라엘’로 옮겨 범위를 분명히 했습니다.
