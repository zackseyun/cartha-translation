  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
  footnotes:
  - marker: a
    text: Or 'palace' or simply 'temple' for 'the temple-fortress.' The Hebrew term is an unusual word for a grand or fortified structure and here refers to the sanctuary David prepared for Solomon to build.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내 아들 솔로몬에게 완전한 마음을 주셔서, 주의 명령들과 주의 증거들과 주의 규례들을 지키고, 그 모든 것을 행하며, 내가 예비한 요새 곧 성전을 건축하게 하옵소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בִּירָה는 성채, 요새, 궁성 또는 궁전 같은 뜻을 가질 수 있습니다. 이곳에서는 다윗이 솔로몬에게 맡긴 성전 건축을 가리키므로, 한국어 본문에서는 ‘요새 곧 성전’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב שָׁלֵם
  english_pob_choice: a whole heart
  chosen_korean: 완전한 마음
  alternatives_korean:
  - 온전한 마음
  - 한결같은 마음
  - 전심
  lexicon: HALOT
  rationale: שָׁלֵם의 핵심은 완전함과 온전함이며, לֵבָב은 내면의 중심을 가리키므로 한국어로는 자연스러운 합쇼체 문맥에서 ‘완전한 마음’이 가장 직접적입니다.
- source_word: מִצְוֺתֶיךָ / עֵדְוֺתֶיךָ / חֻקֶּיךָ
  english_pob_choice: your commandments, your testimonies, and your statutes
  chosen_korean: 주의 명령들과 주의 증거들과 주의 규례들
  alternatives_korean:
  - 주의 계명들과 주의 증언들과 주의 율례들
  - 주의 명령들과 주의 증거들과 주의 법도들
  lexicon: HALOT
  rationale: 세 개의 법적 용어를 서로 구별되게 살리기 위해 각각 ‘명령들/증거들/규례들’로 옮겼습니다. ‘증거들’은 עֵדְוֺת의 언약적·증언적 성격을, ‘규례들’은 고정된 규정을 드러냅니다.
- source_word: וְלִבְנוֹת הַבִּירָה
  english_pob_choice: and to build the fortress / temple-fortress
  chosen_korean: 요새 곧 성전을 건축하며
  alternatives_korean:
  - 요새를 건축하며
  - 성전 곧 요새를 건축하며
  - 성전-요새를 건축하며
  lexicon: HALOT
  rationale: בִּירָה는 요새·성채·궁성의 뜻을 가질 수 있으나, 이 문맥에서는 다윗이 준비한 성전 프로젝트를 가리킵니다. ‘요새’로 기본 의미를 살리되, 독자가 문맥상 성전을 오해하지 않도록 ‘곧 성전’을 덧붙였습니다.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  english_pob_choice: that I have prepared
  chosen_korean: 내가 예비한
  alternatives_korean:
  - 내가 준비한
  - 내가 마련한
  lexicon: HALOT
  rationale: כון의 히필은 ‘예비하다/준비하다’의 뜻이므로, 다윗의 사전 준비를 자연스러운 현대 한국어로 담는 ‘예비한’을 택했습니다.
theological_decisions:
- issue: בִּירָה의 한국어 처리에서 성전과 요새의 긴장 유지
  chosen_reading: 본문의 기본 의미를 ‘요새’로 살리되, 다윗이 준비한 성전이라는 문맥을 반영해 ‘곧 성전’을 덧붙였습니다.
  alternative_readings:
  - 성전으로만 번역
  - 요새로만 번역
  - 성전-요새로 직역
  rationale: 히브리어의 특이한 어휘적 색채를 지우지 않으면서도, 역대기의 문맥상 이 구조물이 성전 프로젝트임을 분명히 해야 합니다. 따라서 의미를 한쪽으로 평탄화하지 않고 둘 다 보이도록 처리했습니다.
  doctrine_reference: Translation philosophy §1, §5
