  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
  footnotes:
  - marker: a
    text: Literally, 'gave the hand under Solomon the king,' a Hebrew idiom for submitting oneself or pledging loyalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 관리들과 용사들, 그리고 다윗 왕의 모든 아들들도 솔로몬 왕에게 자신을 복종시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 ‘손을 솔로몬 왕 아래에 주다’라는 관용구로, 자신을 복종시키거나 충성을 맹세한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  english_pob_choice: officials
  chosen_korean: 관리들
  alternatives_korean:
  - 지도자들
  - 관원들
  - 귀족들
  lexicon: HALOT
  rationale: שורש שׂר는 궁정·행정 맥락에서 높은 지위의 사람들을 가리키므로, 현대 한국어에서 군사적 뉘앙스를 과도하게 띠지 않는 ‘관리들’이 자연스럽습니다.
- source_word: גִּבֹּרִים
  english_pob_choice: mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 용맹한 자들
  - 전사들
  - 힘센 자들
  lexicon: HALOT
  rationale: 문맥상 용맹하고 뛰어난 남자들을 가리키므로, 전통적으로 널리 쓰이면서도 현대 독자가 이해하기 쉬운 ‘용사들’이 적절합니다.
