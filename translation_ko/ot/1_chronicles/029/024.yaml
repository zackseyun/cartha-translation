  - 복종을 표했습니다
  - 자신을 그 아래에 두었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘손을 아래에 주다’이지만, 실제 의미는 상급자에게 굴복·복속하는 행위이므로 그 힘을 드러내기 위해 ‘자신을 복종시켰습니다’로 옮겼습니다.
theological_decisions:
