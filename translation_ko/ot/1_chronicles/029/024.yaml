  chosen_reading: 모든 집단이 솔로몬의 왕권 아래 자신을 두는 행위로 읽었습니다.
  alternative_readings:
  - 단순한 정치적 지지 선언
  - 형식적 충성 표명
  rationale: 히브리어 관용구가 단순 지지보다 더 강한 복속을 뜻하므로, 왕권 승인의 강도를 약화하지 않도록 표현했습니다.
  doctrine_reference: 본문 주해상 왕권 승인에 대한 역사서적 진술
