source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
  footnotes:
  - marker: a
    text: Or 'a special treasure' or 'my own treasure'; the Hebrew term refers to valued personal property.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the house of my God' in the phrase 'because of my delight in the house of my God.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for the sanctuary' for 'for the holy house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 더욱이, 내 하나님 집에 대한 나의 기쁨으로 말하자면, 나는 금과 은으로 된 나만의 보배로운 재산을 가지고 있습니다[a]. 나는 그것을 내 하나님 집에, 곧 내가 거룩한 집을 위해 미리 마련한 모든 것보다 더하여 드렸습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘특별한 보물’ 또는 ‘나의 소유’; 히브리어는 가치 있는 개인 소유물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 하나님 집을 위해’ — ‘내 하나님 집에 대한 나의 기쁨’에 연결될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성소를 위해’ — ‘거룩한 집’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  english_pob_choice: Moreover
  chosen_korean: 더욱이
  alternatives_korean:
  - 그리고 더하여
  - 또한
  lexicon: HALOT
  rationale: 문맥상 앞선 말에 덧붙는 추가 진술이므로, 현대 한국어에서 자연스럽고 강조도 있는 ‘더욱이’가 적절합니다.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  english_pob_choice: because of my delight in the house of my God
  chosen_korean: 내 하나님 집에 대한 나의 기쁨으로 말하자면
  alternatives_korean:
  - 내가 내 하나님 집을 기뻐하기 때문에
  - 내 하나님 집 안에서의 나의 즐거움으로
  lexicon: HALOT
  rationale: בְּרְצוֹתִי의 원인/동기 의미를 살리되, בְּבֵית אֱלֹהַי와 연결된 ‘기쁨’을 자연스럽게 표현했습니다.
- source_word: סְגֻלָּה
  english_pob_choice: a personal treasure
  chosen_korean: 나만의 보배로운 재산
  alternatives_korean:
  - 개인적인 보물
  - 특별한 보배
  lexicon: HALOT
  rationale: 이 어휘는 귀중한 사적 소유를 가리키므로, 왕의 개인적 소유와 성전 헌납의 대비가 드러나도록 ‘보배로운 재산’으로 옮겼습니다.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  english_pob_choice: over and above all that I have prepared
  chosen_korean: 내가 거룩한 집을 위해 미리 마련한 모든 것보다 더하여
  alternatives_korean:
  - 내가 준비한 모든 것 외에
  - 내가 마련한 모든 것 위에
  lexicon: HALOT
  rationale: לְמַעְלָה의 ‘더함/초과’ 의미를 분명히 드러내기 위해 비교 구조로 옮겼습니다.
- source_word: לְבֵית הַקֹּדֶשׁ
  english_pob_choice: for the holy house
  chosen_korean: 거룩한 집
  alternatives_korean:
  - 성소
  - 성전
  lexicon: HALOT
  rationale: 본문이 반복해서 בֵּית를 사용하므로 ‘집’을 유지하되, קדש의 형용사적 의미를 살려 ‘거룩한 집’으로 번역했습니다.
theological_decisions:
- issue: 성전 용어의 일관성 유지
  chosen_reading: 집 / 거룩한 집
  alternative_readings:
  - 성전 / 성소
  - 성전집
  rationale: 히브리어가 의도적으로 בֵּית(집)을 반복하므로, ‘성전’으로 바꾸기보다 ‘집’을 유지해야 야훼의 거처라는 언약적 뉘앙스가 보존됩니다.
  doctrine_reference: Translation philosophy §1, §5
