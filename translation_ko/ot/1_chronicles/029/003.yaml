    text: Or 'a special treasure' or 'my own treasure'; the Hebrew term refers to valued personal property.
    reason: lexical_alternative
  - marker: b
    text: Or 'for the house of my God' in the phrase 'because of my delight in the house of my God.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for the sanctuary' for 'for the holy house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 더욱이 나는 내 하나님의 집을 기뻐하기 때문에[b], 금과 은으로 된 나의 특별한 재산을 가지고 있으며[a], 내가 거룩한 집을 위해 마련한 모든 것에 더하여 그것을 내 하나님의 집에 드렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘특별한 보물’ 또는 ‘나 자신의 재산’; 히브리어는 가치 있는 개인 소유물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 하나님의 집을 위하여’; ‘내 하나님의 집을 기뻐하기 때문에’라는 구절의 관계에 대한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성소를 위해’; ‘거룩한 집’을 가리킵니다.
    reason: lexical_alternative
