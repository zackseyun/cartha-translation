  source_fidelity: 수정이 필요합니다. 초안의 ‘내 하나님 집에 대한 나의 기쁨으로 말하자면’은 히브리어 בִּרְצוֹתִי의 동기·원인 관계를 화제 전환 표현으로 약화합니다. 또한 둘째 문장의 ‘그것’은 선행사와의 연결이 가능하나, 본문 어순을 조정하면 금과 은의 개인 소유물을 드렸다는 뜻과 기존 준비물에 ‘더하여’ 드렸다는 비교 관계가 더 분명해집니다.
  naturalness: ‘기쁨으로 말하자면’은 이 문맥에서 현대 한국어로 부자연스럽고, ‘나만의 보배로운 재산’도 다소 중복되고 구어적입니다. ‘내 하나님의 집을 기뻐하기 때문에’ 및 ‘나의 특별한 재산’은 합쇼체 문체 안에서 자연스럽고 원문의 동기를 명료하게 나타냅니다.
  terminology: בַּיִת의 반복은 ‘집’으로, בֵּית הַקֹּדֶשׁ은 ‘거룩한 집’으로 유지할 수 있습니다. סְגֻלָּה는 성전 마련분과 대조되는 개인의 귀중한 소유를 뜻하므로 ‘나의 특별한 재산’으로 옮깁니다. 각주 b는 첫 번째 ‘내 하나님의 집’에, 각주 c는 ‘거룩한 집’에 붙여 해당 대안의 적용 범위를 바로잡아야 합니다.
