translation:
  language: ko
  text: 그는 좋은 노년에 이르러, 날수에 만족하고[a] 재물과 존귀를 누리다가 죽었습니다. 그의 아들 솔로몬이 그의 뒤를 이어 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘날들로 충만한’이며 ‘날수에 만족한’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׂיבָה טוֹבָה
  english_pob_choice: in a good old age
  chosen_korean: 좋은 노년에
  alternatives_korean:
  - 좋은 늙은 나이에
  - 복된 노년에
  - 장수한 뒤에
  lexicon: HALOT
  rationale: 히브리어 בְּ + שֵׂיבָה טוֹבָה는 죽음의 시기와 상태를 함께 나타내는 관용구이므로, 자연스럽게 ‘좋은 노년에’로 옮겨 그 평가적 뉘앙스를 살렸습니다.
- source_word: שְׂבַע יָמִים
  english_pob_choice: full of days
  chosen_korean: 날수에 만족한 채
  alternatives_korean:
  - 날수로 가득한
  - 만족한 날들로
  - 날이 차도록
  lexicon: HALOT
  rationale: 직역하면 ‘날들로 충만한’이지만, 한국어에서는 관용구의 의미를 살리면서도 소리를 지나치게 어색하게 만들지 않도록 ‘날수에 만족한 채’로 번역했습니다.
- source_word: עֹשֶׁר וְכָבוֹד
  english_pob_choice: riches, and honor
  chosen_korean: 재물과 존귀가 있는
  alternatives_korean:
  - 부와 존귀가 있는
  - 재물과 명예가 있는
  - 부귀와 존귀가 있는
  lexicon: HALOT
  rationale: עֹשֶׁר은 물질적 부를, כָבוֹד은 여기서 왕의 사회적 위신과 존귀를 가리키므로 ‘재물과 존귀’로 구분해 옮겼습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그를 이어 다스렸습니다
  alternatives_korean:
  - 그의 자리에 왕이 되었습니다
  - 그를 대신하여 통치했습니다
  - 그의 뒤를 이어 다스렸습니다
  lexicon: HALOT
  rationale: 왕위 계승 공식의 תַּחְתָּיו는 단순한 시간적 ‘뒤’보다 ‘그 자리를 이어서/대신하여’의 뜻이므로, 군림의 결과를 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 솔로몬의 즉위와 다윗의 죽음을 연결하는 왕위 계승 공식의 처리
  chosen_reading: ‘그를 이어 다스렸습니다’로 옮겨, 단순 사망 보고가 아니라 정당한 계승과 하나님의 섭리 아래 이루어진 전환이라는 역사서의 흐름을 살렸습니다.
  alternative_readings:
  - ‘그의 자리를 대신했습니다’
  - ‘그의 뒤를 이어 왕이 되었습니다’
  rationale: 히브리어 문장은 개인의 죽음과 왕권의 연속성을 함께 말하므로, 계승의 공적 성격이 드러나도록 번역하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역대기 왕조사와 섭리적 계승 서술
