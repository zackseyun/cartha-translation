base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'satisfied with days' for the Hebrew idiom 'full of days.'
