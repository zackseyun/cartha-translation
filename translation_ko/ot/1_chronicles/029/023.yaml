  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
  footnotes:
  - marker: a
    text: Or 'listened to him' / 'heeded him.' The Hebrew can denote hearing attentively, but in this royal context it carries the sense of obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬은 그의 아버지 다윗을 대신하여 왕으로서 야훼의 왕좌에 앉았고, 번성하였으며, 온 이스라엘이 그에게 순종하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 말을 들었다’, ‘그의 말에 귀를 기울였다’. 히브리어는 ‘주의하여 듣다’라는 뜻일 수 있으나, 왕권 문맥에서는 순종의 의미도 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: sat
  chosen_korean: 앉았고
  alternatives_korean:
  - 즉위하였고
  - 왕좌에 올랐고
  lexicon: HALOT
  rationale: 직역하면 ‘앉다’이지만 왕위 취임 맥락에서는 즉위 의미가 내포됩니다. 한국어에서는 ‘왕좌에 앉다’가 원문의 구체적 표현을 살리면서 자연스럽습니다.
- source_word: כִּסֵּא יְהוָה
  english_pob_choice: the throne of Yahweh
  chosen_korean: 야훼의 왕좌
  alternatives_korean:
  - 야훼의 보좌
  - 야훼의 왕위
  lexicon: HALOT
  rationale: 소스의 속격 구조를 그대로 살려, 다윗 왕조의 왕권이 야훼의 통치 아래 있음을 드러내는 표현으로 옮겼습니다.
- source_word: תַּחַת דָּוִיד אָבִי/ו
  english_pob_choice: in place of David his father
  chosen_korean: 다윗 그의 아버지의 자리를 이어
  alternatives_korean:
  - 다윗 그의 아버지 대신에
  - 다윗 그의 아버지 다음에
  lexicon: HALOT
  rationale: תחת는 단순한 시간적 ‘뒤에’보다 계승·대체의 뜻이 강하므로, 왕위 계승의 의미가 드러나도록 ‘자리를 이어’로 번역했습니다.
- source_word: וַיִּשְׁמְעוּ אֵלָי/ו
  english_pob_choice: listened to him
  chosen_korean: 그에게 순종하였습니다
  alternatives_korean:
  - 그의 말을 들었습니다
  - 그에게 귀를 기울였습니다
  lexicon: HALOT
  rationale: 왕에게 향한 청종은 단순 청취보다 복종의 의미를 띠므로, 영어 POB의 주석 취지에 맞게 ‘순종하다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 왕좌와 솔로몬의 왕권 관계
  chosen_reading: 솔로몬의 왕위가 야훼의 왕좌 위에 놓인 것으로, 다윗 왕조의 통치가 야훼의 대리적 통치 아래 있음을 보존했습니다.
  alternative_readings:
  - 단순한 왕실 즉위 서술로 축소하기
  - ‘야훼의 왕좌’를 풀어서 일반적 왕좌로 바꾸기
  rationale: 역대기는 솔로몬의 왕권을 정치적 사실 이상으로, 야훼의 주권 아래 있는 신정적 계승으로 제시합니다. 그래서 그 신학적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6; Contested terms table for יְהוָה
