- from: 그때 솔로몬이 다윗 그의 아버지의 자리를 이어 야훼의 왕좌에 왕으로 앉았고, 그는 번성하였으며, 온 이스라엘이 그에게 순종하였습니다.[a]
  to: 그때 솔로몬은 그의 아버지 다윗을 대신하여 왕으로서 야훼의 왕좌에 앉았고, 번성하였으며, 온 이스라엘이 그에게 순종하였습니다.[a]
  rationale: 왕위 계승과 왕의 직분을 나타내는 히브리어 표현을 더 자연스러운 현대 한국어 어순으로 재구성하였습니다. ‘야훼의 왕좌’와 ‘순종하였습니다’는 유지하여 원문의 신학적 표현 및 왕권 문맥의 청종 의미를 보존했습니다. 각주의 미번역 영어를 한국어로 바로잡고, 대안적 해석의 여지를 유지했습니다.
