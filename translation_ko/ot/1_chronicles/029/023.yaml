    rationale: ‘다윗 그의 아버지의 자리를 이어 야훼의 왕좌에 왕으로 앉았고’는 ‘자리를 이어’와 ‘왕으로 앉다’가 중첩되어 읽기 어렵습니다. ‘그의 아버지 다윗을 대신하여 왕으로서’는 תחת의 계승 의미와 לְמֶלֶךְ의 직분 의미를 자연스럽게 전달합니다.
  - severity: low
    issue: 각주에 영어 표현이 남아 있습니다.
    rationale: ‘attentively hearing’은 한국어 독자를 위한 각주에서 ‘주의하여 듣다’ 등으로 번역해야 합니다.
  revised_text: 그때 솔로몬은 그의 아버지 다윗을 대신하여 왕으로서 야훼의 왕좌에 앉았고, 번성하였으며, 온 이스라엘이 그에게 순종하였습니다.[a]
