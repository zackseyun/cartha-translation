base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
  footnotes:
  - marker: a
    text: Or 'from all Israel's picked men.' The Hebrew phrase refers to select or choice warriors.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Aram'; that is, the Aramean forces.
    reason: cultural_note
translation:
  language: ko
  text: 요압은 전쟁의 정면과 후면이 자기에게 맞서 있는 것을 보고, 온 이스라엘에서 정예병을 골라 아람과 맞서도록 그들을 배치했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '이스라엘의 뽑힌/선발된 자들'이라는 뜻일 수 있습니다. 문맥상 정예 전투원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 '아람'은 아람인들, 곧 아람 군대를 가리킵니다.
    reason: cultural_note
