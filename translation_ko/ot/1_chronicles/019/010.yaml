  rationale: לִקְרַאת의 대면·대적 뉘앙스를 살려, 단순한 만남이 아니라 전투적 대치를 뜻하는 한국어로 처리했습니다.
theological_decisions:
- issue: 아람(아람 사람들) 표기
  chosen_reading: 본문의 고유명사 형태를 따라 '아람'으로 유지했습니다.
  alternative_readings:
  - 아람 사람들
  - 아람 군대
  rationale: 히브리어 מקור의 고유명사성을 보존하는 것이 원문-대응성을 높이며, 문맥상 적대 세력임은 동사구로 충분히 드러납니다.
  doctrine_reference: 원문 고유명사 보존 원칙
