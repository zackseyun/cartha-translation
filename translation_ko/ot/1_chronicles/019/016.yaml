  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
  footnotes:
  - marker: a
    text: Or 'from across the Euphrates'; the Hebrew reads simply 'from beyond the River.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'Syria/Syrians'; Hebrew 'Aram/Arameans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아람이 이스라엘 앞에서 자신들이 패배한 것을 보고, 사신들을 보내어 강 건너편에 있던 아람 사람들을 데려냈는데, 그들 앞에는 하닷에셀의 군대 사령관 쇼바크가 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유프라테스 강 건너편에서’; 히브리어는 단지 ‘강 건너편’이라고만 합니다.
    reason: alternative_reading
  - marker: b
    text: 전통적으로는 ‘시리아/시리아 사람들’로도 옮겼지만, 히브리어는 ‘아람/아람 사람들’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  english_pob_choice: Aram / the Arameans
  chosen_korean: 아람 / 아람 사람들
  alternatives_korean:
  - 시리아 / 시리아 사람들
  - 아람 사람들 / 아람
  lexicon: HALOT
  rationale: 지명과 민족명을 함께 살리기 위해 앞에서는 ‘아람’, 대상 집단은 ‘아람 사람들’로 구분했습니다. 전통적 ‘시리아’는 본문 히브리어의 직접성을 약화시킵니다.
- source_word: נִגְּפוּ
  english_pob_choice: had been defeated
  chosen_korean: 패배한
  alternatives_korean:
  - 쳐부수인
  - 무찔린
  - 패주한
  lexicon: HALOT
  rationale: 전쟁 맥락에서 נִגְּפוּ는 단순한 타격보다 전투 패배를 뜻하므로, 현대 한국어로는 ‘패배한’이 가장 자연스럽고 정확합니다.
- source_word: מֵעֵבֶר הַנָּהָר
  english_pob_choice: from beyond the River
  chosen_korean: 강 건너편에 있던
  alternatives_korean:
  - 강 너머에서 온
  - 유프라테스 강 건너편에서 온
  - 강 너머
  lexicon: HALOT
  rationale: 히브리어는 단지 ‘강’이라고만 하므로, 본문을 보존해 ‘강 건너편’으로 옮겼습니다. 역사적 배경상 유프라테스를 가리킬 수 있지만 본문 자체에는 이름이 없습니다.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  english_pob_choice: the commander of Hadadezer’s army
  chosen_korean: 하닷에셀의 군대 사령관
  alternatives_korean:
  - 하닷에셀의 군대 대장
  - 하닷에셀 군대의 지휘관
  lexicon: HALOT
  rationale: שַׂר צְבָא는 군사 지휘관을 뜻하는 관용구이므로, 현대 한국어에서 격식 있고 분명한 ‘군대 사령관’으로 옮겼습니다.
- source_word: לִפְנֵיהֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에는
  alternatives_korean:
  - 그들 앞에서
  - 그들 선두에
  - 그들 앞쪽에
  lexicon: HALOT
  rationale: 직역하면 ‘그들 앞에’이지만, 군사 이동에서 선두 위치를 나타내므로 ‘그들 앞에는’이 가장 자연스럽습니다.
theological_decisions:
- issue: ‘아람’과 ‘아람 사람들’의 이중 표현
  chosen_reading: 지명과 민족명을 구분해 유지했습니다.
  alternative_readings:
  - 전부 ‘시리아’로 통일
  - 전부 ‘아람’으로 통일
  rationale: 히브리어가 같은 어근을 지명과 사람 집단에 모두 쓰므로, 한국어에서도 그 차이를 드러내는 편이 본문의 의미를 더 정확히 보존합니다.
  doctrine_reference: 본문의 역사서술 정확성 및 원어 대응 원칙
