revisions:
- from: 하닷에셀의 종들은 자신들이 이스라엘 앞에서 패배한 것을 보고 다윗과 화친하고 그를 섬겼습니다. 그리고 아람은 더 이상 암몬 자손을 돕고자 하지 않았습니다.[a]
  to: 하닷에셀의 신하들은 자기들이 이스라엘에게 패배한 것을 보고 다윗과 화친하여 그를 섬겼습니다. 그리고 아람은 더 이상 암몬 자손을 돕고자 하지 않았습니다.[a]
  rationale: 정치적·군사적 문맥의 עַבְדֵי를 ‘신하들’로 바로잡고, 군사적 패배의 관계를 ‘이스라엘에게’로 자연스럽게 표현했습니다. 그 외에는 원문의 어순과 의미, 특히 아람의 집합적 주어와 ‘더 이상 … 돕고자 하지 않았다’는 지속 중단의 뜻을 유지했습니다.
