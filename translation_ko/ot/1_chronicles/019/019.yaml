  edition: WLC
  text: וַ/יִּרְא֞וּ עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥ימוּ עִם דָּוִ֖יד וַ/יַּֽעַבְדֻ֑/הוּ וְ/לֹא אָבָ֣ה אֲרָ֔ם לְ/הוֹשִׁ֥יעַ אֶת בְּנֵי עַמּ֖וֹן עֽוֹד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
  footnotes:
  - marker: a
    text: Or 'the Ammonites' for 'the sons of Ammon.' The Hebrew expression is literally 'sons of Ammon' and functions as an ethnic designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 하닷에셀의 신하들은 자기들이 이스라엘에게 패배한 것을 보고 다윗과 화친하여 그를 섬겼습니다. 그리고 아람은 더 이상 암몬 자손을 돕고자 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 사람들’. 히브리어 표현은 문자적으로 ‘암몬의 아들들’이며, 민족을 가리키는 명칭으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 신하들
  - 종복들
  lexicon: HALOT
  rationale: 왕권 아래의 종속 관계를 드러내면서도 한국어에서 자연스럽고, 단순한 관료적 '신하들'보다 원문의 종속성을 더 분명히 반영합니다.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  english_pob_choice: made peace with David
  chosen_korean: 화친하고
  alternatives_korean:
  - 평화를 맺고
  - 화해하고
  - 평화조약을 맺고
  lexicon: HALOT
  rationale: שלם의 외교적·군사적 의미를 살려 '화친하다'로 옮기면 단순 감정적 화해보다 전쟁 후의 정치적 평화 성립을 잘 드러냅니다.
- source_word: וַיַּעַבְדֻהוּ
  english_pob_choice: served him
  chosen_korean: 그를 섬겼습니다
  alternatives_korean:
  - 그의 종이 되었습니다
  - 그에게 복종했습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미를 유지하되, 전후 문맥상 다윗에게 예속된 상태를 한국어로 자연스럽게 표현합니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬의 아들들
  - 암몬 사람들
  lexicon: HALOT
  rationale: 족속을 가리키는 표준적 번역으로, 영어 POB의 각주가 지적하듯 직역 가능한 표현이지만 한국어 성경 독자에게는 '자손'이 가장 자연스럽고 원문 구조도 보존합니다.
theological_decisions:
- issue: 아람이 암몬 자손을 돕지 않겠다고 한 부분의 의미
  chosen_reading: 군사 동맹 차원의 지원 거부로 이해하여 '돕고자 하지 않았습니다'로 옮겼습니다.
  alternative_readings:
  - 구원하려 하지 않았습니다
  - 구출하려 하지 않았습니다
  rationale: לְהוֹשִׁיעַ는 여기서 구원론적 '구하다'보다 전쟁 동맹 속 '돕다/구원하다'의 의미가 더 적절하므로, 맥락상 과도한 신학적 뉘앙스를 피했습니다.
  doctrine_reference: 문맥 우선 원칙
