  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנ֣וּסוּ גַם הֵ֗ם מִ/פְּנֵי֙ אַבְשַׁ֣י אָחִ֔י/ו וַ/יָּבֹ֖אוּ הָ/עִ֑ירָ/ה וַ/יָּבֹ֥א יוֹאָ֖ב יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
  footnotes:
  - marker: a
    text: Hebrew 'Aram'; this refers to the Aramean forces, traditionally rendered 'the Syrians.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Abishai, his brother,' that is, Joab's brother.
    reason: lexical_alternative
translation:
  language: ko
  text: 암몬 자손이 아람이 달아난 것을 보고, 그들도 아비새 그의 형제 앞에서 달아나 성 안으로 들어갔습니다. 그러자 요압은 예루살렘으로 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본절의 ‘아람’은 아람 군대를 가리키며, 영어 POB의 설명처럼 전통적으로는 ‘시리아’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 형제’는 문맥상 요압을 가리킵니다. 영어 POB의 각주처럼 ‘아비새, 그의 형제’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬인들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 살리되, 집단 전체를 가리키는 민족명으로 이해되므로 ‘암몬 자손’이 가장 본문에 가깝습니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  - 아람 사람들
  lexicon: HALOT
  rationale: POB의 음역 방침을 따라 고유명사 ‘아람’을 유지했습니다. 각주 없이 전통적 지리명 ‘시리아’로 바꾸지 않았습니다.
- source_word: מִפְּנֵי אַבְשַׁי אָחִיו
  english_pob_choice: before Abishai his brother
  chosen_korean: 아비새 그의 형제 앞에서
  alternatives_korean:
  - 아비새, 그의 형제 앞에서
  - 아비새, 요압의 형제 앞에서
  lexicon: HALOT
  rationale: 전투 문맥의 מִפְּנֵי는 ‘~앞에서/앞을 향해’의 퇴각 관용을 살리는 표현으로 옮겼고, ‘그의 형제’는 요압을 가리키는 문맥을 유지했습니다.
- source_word: וַיָּבֹאוּ הָעִירָה
  english_pob_choice: entered the city
  chosen_korean: 성 안으로 들어갔습니다
  alternatives_korean:
  - 도성으로 들어갔습니다
  - 성읍으로 들어갔습니다
  lexicon: HALOT
  rationale: 방향 어미가 있는 도시 진입을 자연스러운 현대 한국어로 살리면서, 히브리어의 이동 방향성을 유지했습니다.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  english_pob_choice: Then Joab came to Jerusalem
  chosen_korean: 그러자 요압은 예루살렘으로 갔습니다
  alternatives_korean:
  - 그때 요압은 예루살렘으로 갔습니다
  - 그리고 요압은 예루살렘으로 갔습니다
  lexicon: HALOT
  rationale: וַיָּבֹא의 단순 이동을 ‘갔습니다’로 옮겨, 본문이 명시하지 않는 ‘돌아갔다’는 의미를 덧붙이지 않았습니다.
