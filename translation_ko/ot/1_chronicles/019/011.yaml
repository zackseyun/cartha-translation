id: 1CH.19.11
reference: 1 Chronicles 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
  footnotes:
  - marker: a
    text: Hebrew literally, 'gave into the hand of Abishai his brother,' an idiom for entrusting to his authority or command.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 나머지 군대를 그의 형 아비새의 지휘 아래에 두었고, 그들은 암몬 사람들을 맞으려고 전투 진형을 갖추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그의 형 아비새의 손에 주었다’로, 누구의 권위와 명령 아래에 맡겼다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  english_pob_choice: the rest of the troops
  chosen_korean: 나머지 군대
  alternatives_korean:
  - 나머지 백성
  - 남은 군사들
  lexicon: HALOT
  rationale: 전쟁 문맥에서 הָעָם는 단순한 ‘백성’보다 전투 인력을 가리키므로, 자연스러운 한국어로 군사 집단을 드러내는 ‘군대’가 적절합니다.
- source_word: נָתַן בְּיַד
  english_pob_choice: put ... under the command of
  chosen_korean: 지휘 아래에 두었고
  alternatives_korean:
  - 손에 넘기고
  - 권한 아래에 맡기고
  - 지휘에 맡기고
  lexicon: HALOT
  rationale: 직역하면 ‘손에 주다’이지만, 여기서는 사람을 어떤 이의 권위와 명령 아래에 맡긴다는 관용적 의미이므로 ‘지휘 아래에 두다’가 가장 분명합니다.
- source_word: וַיַּעַרְכוּ
  english_pob_choice: they drew up in battle formation
  chosen_korean: 전투 진형을 갖추었습니다
  alternatives_korean:
  - 전열을 갖추었습니다
  - 배열을 갖추었습니다
  - 전투 대형으로 섰습니다
  lexicon: HALOT
  rationale: 군사적 맥락의 ערך는 단순 배치보다 ‘전투를 위한 진형 정비’를 뜻하므로, ‘전투 진형을 갖추다’가 의미를 잘 살립니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 사람들
  alternatives_korean:
  - 암몬 족속
  - 암몬인들
  lexicon: HALOT
  rationale: 민족명으로서 자연스럽고 널리 쓰이는 표기는 ‘암몬 사람들’이며, 본문 맥락에도 무리가 없습니다.
theological_decisions:
- issue: 군사 지휘 표현의 의미 보존
  chosen_reading: ‘지휘 아래에 두었다’로 번역해 권위 위임의 관용어를 드러냈습니다.
  alternative_readings:
  - ‘손에 주었다’처럼 직역함
  - ‘맡겼다’로 완화함
  rationale: 히브리어 관용구 נָתַן בְּיַד는 단순 전달이 아니라 통제권과 책임의 위임을 뜻하므로, 독자가 본문의 지휘 구조를 바로 이해하도록 의미를 드러냈습니다.
  doctrine_reference: 서사 본문의 행위와 권위 구조를 왜곡 없이 전달하는 번역 원칙
- issue: 히브리어 군사 서술의 동시성
  chosen_reading: ‘그들은 ... 갖추었습니다’로 마무리해 앞절 행동과 연결된 연속 서술을 유지했습니다.
  alternative_readings:
  - 과거형을 더 강하게 분리함
  - 두 문장을 분리해 번역함
  rationale: 히브리어 וַ-연속 서술은 이야기의 흐름을 이어 주므로, 한국어에서도 매끄러운 과거 서술로 연결해 서사의 긴박감을 살렸습니다.
  doctrine_reference: 서사체의 연속성과 사건 진행 보존
