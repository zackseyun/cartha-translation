theological_decisions:
- issue: 전투 상황에서의 לִתְשׁוּעָה / ישע의 의미
  chosen_reading: 두 표현을 모두 ‘구원/구해 주다’ 계열로 유지하되, 전쟁 맥락의 실제 구출 요청으로 읽히도록 했습니다.
  alternative_readings:
  - ‘도와 주다’로 완화
  - ‘건져 주다’로 더 구체화
  rationale: 이 구절의 의미는 추상적 구원론보다 동맹 관계의 군사적 구출 약속에 있으므로, 신학적 용어로 과도하게 일반화하지 않았습니다.
  doctrine_reference: 본문 맥락(열왕/역대의 전쟁 서사)과 히브리어 동사 어휘
- issue: 예의체의 선택
  chosen_reading: 직접 청자에게는 ‘당신’과 명령형 청유를 사용해 공식적 약속의 어조를 유지했습니다.
  alternative_readings:
  - ‘네가’/‘너’로 비격식화
  - 완곡한 서술체로 전환
  rationale: 본문의 상호 약속 문맥을 살리면서도 현대 표준어 합쇼체에 맞추기 위한 선택입니다.
  doctrine_reference: 한국어 문체 규범 및 POB 번역 방침
