- source_word: וְהוֹשַׁעְתִּיךָ
  english_pob_choice: I will save you / I will rescue you
  chosen_korean: 내가 당신을 구해 드리겠습니다
  alternatives_korean:
  - 내가 당신을 구원하겠습니다
