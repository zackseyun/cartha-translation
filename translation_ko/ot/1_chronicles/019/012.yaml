id: 1CH.19.12
reference: 1 Chronicles 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק מִמֶּ֨/נִּי֙ אֲרָ֔ם וְ/הָיִ֥יתָ לִּ֖/י לִ/תְשׁוּעָ֑ה וְ/אִם בְּנֵ֥י עַמּ֛וֹן יֶֽחֶזְק֥וּ מִמְּ/ךָ֖ וְ/הוֹשַׁעְתִּֽי/ךָ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
  footnotes:
  - marker: a
    text: Or, more literally, “If Aram is stronger than me … and if the sons of Ammon are stronger than you.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “you shall be to me for salvation,” an idiom for coming to aid or deliver in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 말했습니다. 「아람이 나보다 강하면, 당신은 나의 구원이 되어 주십시오. 그러나 암몬 자손이 당신보다 강하면, 내가 당신을 구해 드리겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “아람이 나보다 강하면 …”처럼 비교 구조를 이룹니다.
    reason: alternative_reading
  - marker: b
    text: ‘구원이 되어 주십시오’는 히브리어의 “나에게 구원이 되다”라는 관용적 표현을 한국어로 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그는 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그때 그가 말했습니다
  lexicon: WLC narrative wayyiqtol
  rationale: 히브리어 서사 연결을 자연스럽게 옮기되, 현대 한국어 합쇼체에 맞춰 평이한 서술로 처리했습니다.
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק) מִן
  english_pob_choice: is too strong / are too strong
  chosen_korean: 나보다 강하면 / 당신보다 강하면
  alternatives_korean:
  - 나를 이기면 / 당신을 이기면
  - 나보다 세면 / 당신보다 세면
  - 나를 압도하면 / 당신을 압도하면
  lexicon: HALOT
  rationale: 비교 구문 מן을 한국어의 ‘~보다 강하다’로 옮겨 전투 맥락의 비교적 힘을 보존했습니다.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  english_pob_choice: you shall be my salvation
  chosen_korean: 나의 구원이 되어 주십시오
  alternatives_korean:
  - 나를 구원해 주십시오
  - 나를 위한 구원이 되어 주십시오
  - 나를 구해 주십시오
  lexicon: HALOT
  rationale: 직역적 ‘구원이 되다’의 구조를 살리되, 한국어에서는 도움 요청의 관용을 반영해 자연스럽게 표현했습니다.
- source_word: וְהוֹשַׁעְתִּיךָ
  english_pob_choice: I will save you / I will rescue you
  chosen_korean: 내가 당신을 구해 드리겠습니다
  alternatives_korean:
  - 내가 당신을 구원하겠습니다
  - 내가 당신을 건져 드리겠습니다
  - 내가 당신을 도와드리겠습니다
  lexicon: HALOT
  rationale: ישע의 Hiphil이 실제 구출·구원의 행동을 뜻하므로 ‘구해 드리겠습니다’가 문맥상 가장 자연스럽고, 앞의 ‘구원’과도 대응됩니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬인의 자손
  - 암몬 백성
  lexicon: HALOT
  rationale: 본문의 직조를 따라 히브리어 표현을 보존하면서, 한국어 성경에서 익숙한 종족 표기를 사용했습니다.
theological_decisions:
- issue: 전투 상황에서의 לִתְשׁוּעָה / ישע의 의미
  chosen_reading: 두 표현을 모두 ‘구원/구해 주다’ 계열로 유지하되, 전쟁 맥락의 실제 구출 요청으로 읽히도록 했습니다.
  alternative_readings:
  - ‘도와 주다’로 완화
  - ‘건져 주다’로 더 구체화
  rationale: 이 구절의 의미는 추상적 구원론보다 동맹 관계의 군사적 구출 약속에 있으므로, 신학적 용어로 과도하게 일반화하지 않았습니다.
  doctrine_reference: 본문 맥락(열왕/역대의 전쟁 서사)과 히브리어 동사 어휘
- issue: 예의체의 선택
  chosen_reading: 직접 청자에게는 ‘당신’과 명령형 청유를 사용해 공식적 약속의 어조를 유지했습니다.
  alternative_readings:
  - ‘네가’/‘너’로 비격식화
  - 완곡한 서술체로 전환
  rationale: 본문의 상호 약속 문맥을 살리면서도 현대 표준어 합쇼체에 맞추기 위한 선택입니다.
  doctrine_reference: 한국어 문체 규범 및 POB 번역 방침
