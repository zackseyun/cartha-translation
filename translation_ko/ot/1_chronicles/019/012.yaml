  lexicon: HALOT
  rationale: ישע의 Hiphil이 실제 구출·구원의 행동을 뜻하므로 ‘구해 드리겠습니다’가 문맥상 가장 자연스럽고, 앞의 ‘구원’과도 대응됩니다.
