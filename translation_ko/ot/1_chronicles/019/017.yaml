  - severity: low
    issue: 각주가 본문과 동일한 표현을 ‘또는’으로 제시합니다.
    rationale: 현 본문도 ‘그들은 그와 싸웠습니다’이고 각주의 대안도 동일하여 실질적인 대안이 아닙니다. 히브리어 עִמּוֹ의 문자적 의미인 ‘그와 함께’를 제시하고 문맥상 적대적 의미임을 설명해야 합니다.
