base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
  footnotes:
  - marker: a
    text: Or, 'and they fought against him.' The Hebrew expression literally uses 'with him,' but in context it clearly describes battle against David.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 소식이 다윗에게 전해지자, 그는 온 이스라엘을 모아 요단강을 건너 그들에게로 가서 그들 맞은편에 진을 쳤습니다. 그러자 다윗은 아람을 맞서 전쟁하기 위해 진을 쳤고, 그들은 그와 싸웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 그와 싸웠습니다.’ 히브리어는 문자적으로 ‘그와 함께’라고 하지만, 문맥상 다윗에 대한 적대적 전투를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  english_pob_choice: When it was reported to David
  chosen_korean: 그 소식이 다윗에게 전해지자
  alternatives_korean:
  - 다윗에게 보고되자
  - 다윗이 들었을 때
  lexicon: HALOT
  rationale: 수동형 보고 전달을 한국어의 자연스러운 사건 도착 표현으로 살리되, 원문의 비인칭성을 유지했습니다.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  english_pob_choice: drew up in battle formation against them
  chosen_korean: 그들 맞은편에 진을 쳤습니다
  alternatives_korean:
  - 그들에 맞서 전열을 갖추었습니다
  - 그들에 맞서 전투 대형을 갖추었습니다
  lexicon: HALOT
  rationale: ערך의 군사적 배열 의미를 ‘진을 치다’로 옮겨 전투 배치의 뉘앙스를 살렸습니다.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  english_pob_choice: Then David drew up for battle to meet Aram
  chosen_korean: 다윗은 아람을 맞서 전쟁하기 위해 진을 쳤고
  alternatives_korean:
  - 다윗은 아람을 맞이하려고 전열을 갖추었고
  - 다윗은 아람과 맞서 싸우기 위해 진을 쳤고
  lexicon: HALOT
  rationale: לִקְרַאת의 ‘맞서/맞이하러’ 방향성과 מִלְחָמָה의 전쟁 의미를 함께 드러내되, 문맥상 군사 행동으로 자연스럽게 표현했습니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 아람 사람들
  - 시리아
  lexicon: HALOT
  rationale: 지리·민족 명칭을 본문 그대로 음역하여, 후대의 지명 환치나 해석적 확장을 피했습니다.
theological_decisions:
- issue: 전투 동사의 방향성(‘with him’ vs ‘against him’)
  chosen_reading: 마지막 절은 ‘그들은 그와 싸웠습니다’로 옮겨, 원문의 עִמּוֹ가 문맥상 적대적 전투를 뜻함을 드러냈습니다.
  alternative_readings:
  - 그들은 그와 함께 싸웠습니다
  - 그와 맞서 싸웠습니다
  rationale: 히브리어는 전치사 ‘with’를 쓰지만, 서술 전체가 다윗과 아람의 전쟁을 말하므로 한국어에서는 적대 관계를 분명히 해야 합니다.
  doctrine_reference: 문맥 우선의 의미 판별
- issue: 군사적 진영 배치의 묘사
  chosen_reading: ‘진을 치다’와 ‘맞은편에’로 전장을 그려, 단순 이동이 아니라 교전 준비를 나타냈습니다.
  alternative_readings:
  - 전열을 갖추다
  - 배치하다
  rationale: ערך의 군사적 배열 의미를 살리면서, 독자가 본문을 전투 장면으로 즉시 이해하도록 했습니다.
  doctrine_reference: 서사 문맥 보존
