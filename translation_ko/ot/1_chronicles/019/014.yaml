  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
  footnotes:
  - marker: a
    text: Or 'before the Arameans' / 'against Aram.' The Hebrew reads 'before Aram,' using the proper name and a spatial idiom in a battle context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이렇게 요압과 그와 함께한 백성이 전쟁을 위해 아람 앞에 나아가자, 그들은 그의 앞에서 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아람 앞에’라고 하며, 전투 문맥에서 아람 군대 앞을 가리키는 공간적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: advanced
  chosen_korean: 나아가자
  alternatives_korean:
  - 다가가자
  - 전진하자
  - 접근하자
  lexicon: HALOT
  rationale: 전투 문맥에서 단순한 ‘가까이 가다’보다 적진을 향해 움직여 교전에 이르는 흐름을 살리는 표현이므로 ‘나아가다’를 택했습니다.
- source_word: לִפְנֵי אֲרָם
  english_pob_choice: before Aram
  chosen_korean: 아람 앞에
  alternatives_korean:
  - 아람을 향해
  - 아람에 맞서
  - 아람 앞에서
  lexicon: HALOT
  rationale: 히브리어의 공간적 관용구를 살려 ‘앞에’로 옮겨, 해석을 덧씌운 ‘맞서’보다 원문 구도를 보존했습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 전쟁을 위해
  alternatives_korean:
  - 전투를 위해
  - 싸우기 위해
  - 전쟁하러
  lexicon: HALOT
  rationale: 목적을 나타내는 לַ 접속을 살려 ‘~을 위해’로 옮겼고, 전투 문맥의 군사적 목적을 분명히 했습니다.
- source_word: וַיָּנּוּסוּ מִפָּנָיו
  english_pob_choice: they fled before him
  chosen_korean: 그들은 그의 앞에서 도망쳤습니다
  alternatives_korean:
  - 그들은 그의 앞에서 달아났습니다
  - 그들은 그를 피해 달아났습니다
  - 그들은 그 앞에서 물러났습니다
  lexicon: HALOT
  rationale: נוס의 기본 의미는 ‘달아나다/도망치다’이므로 패주 뉘앙스를 살려 ‘도망쳤습니다’로 옮겼고, מִפָּנָיו의 ‘before him’은 ‘그의 앞에서’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: לִפְנֵי의 공간적 관용구를 전투 해석어로 약화할지 여부
  chosen_reading: ‘아람 앞에’로 옮겨 히브리어의 공간적 표현을 유지했습니다.
  alternative_readings:
  - ‘아람을 향해’
  - ‘아람과 맞서’
  rationale: 본문은 방향성과 마주섬을 암시하지만, 본문 자체는 ‘맞서다’라는 명시적 동사를 쓰지 않으므로 해석을 최소화해 원문의 긴장을 보존했습니다.
  doctrine_reference: 원문 관용구 보존 원칙
