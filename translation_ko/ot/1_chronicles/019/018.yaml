source:
  edition: WLC
  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
  footnotes:
  - marker: a
    text: The parallel passage in 2 Samuel 10:18 reads 'seven hundred chariots and forty thousand horsemen.' Chronicles here reads 'seven thousand charioteers and forty thousand foot soldiers.'
    reason: textual_variant
  - marker: b
    text: Shophach is called Shobach in the parallel account in 2 Samuel 10:16, 18.
    reason: alternative_reading
translation:
  language: ko
  text: 아람이 이스라엘 앞에서 도망하였고, 다윗은 아람 사람 가운데서 칠천 명의 전차병과 사만 명의 보병을 죽였으며, 군대의 지휘관 소박을 죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 평행본문 사무엘하 10:18은 ‘칠백 대의 전차와 사만 명의 기병’으로 전하며, 역대기는 여기서 ‘칠천 명의 전차병과 사만 명의 보병’이라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 소박은 사무엘하 10:16, 18의 평행본문에서 ‘쇼박’으로도 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּנָס ... מִלִּפְנֵי יִשְׂרָאֵל
  english_pob_choice: Aram fled before Israel
  chosen_korean: 이스라엘 앞에서 도망하였고
  alternatives_korean:
  - 이스라엘 앞에서 달아났고
  - 이스라엘 앞에서 물러났고
  lexicon: HALOT
  rationale: 전투 패배를 나타내는 관용을 한국어로 자연스럽게 옮기되, ‘before Israel’의 대면 구도를 유지했습니다.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  english_pob_choice: seven thousand charioteers
  chosen_korean: 칠천 명의 전차병
  alternatives_korean:
  - 칠천 대의 전차
  - 칠천 명의 전차 군사
  lexicon: HALOT
  rationale: רֶכֶב을 단순히 전차 수량으로 두기보다 전차 병력을 가리키는 메톤미로 이해하여, 한국어에서는 전투 병종을 드러내는 ‘전차병’으로 옮겼습니다.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  english_pob_choice: forty thousand foot soldiers
  chosen_korean: 사만 명의 보병
  alternatives_korean:
  - 사만 명의 족병
  - 사만 명의 보병병력
  lexicon: HALOT
  rationale: ‘man of foot’라는 관용을 현대 한국어의 군사 용어인 ‘보병’으로 옮겨 의미를 분명히 했습니다.
- source_word: שׁוֹפַךְ
  english_pob_choice: Shophach
  chosen_korean: 소박
  alternatives_korean:
  - 쇼팍
  - 쇼바크
  lexicon: HALOT
  rationale: 역대기의 철자 형태를 따라 현대 외래어 표기식으로 옮기되, 사무엘서 평행본문의 ‘Shobach’와의 차이는 각주로 처리할 수 있는 이름 변이입니다.
theological_decisions:
- issue: 전투 서술의 직역 정도
  chosen_reading: 승리와 패주를 드러내는 본문의 군사적 진술을 그대로 살려, 승리의 규모를 약화시키지 않고 전달했습니다.
  alternative_readings:
  - 의역하여 전투에서 크게 이겼다고 풀어쓰기
  - 동사들을 완화하여 물러났다고만 표현하기
  rationale: 이 구절은 역사 서술이므로 원문의 승전·패주·처형 진술을 축소하지 않는 것이 본문 의미를 보존합니다.
  doctrine_reference: 성경 본문의 역사적 진술 보존 원칙
