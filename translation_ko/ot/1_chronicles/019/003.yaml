source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵי עַמּ֜וֹן לְ/חָנ֗וּן הַֽ/מְכַבֵּ֨ד דָּוִ֤יד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַחֲמִ֑ים הֲ/לֹ֡א בַּ֠/עֲבוּר לַ/חְקֹ֨ר וְ/לַ/הֲפֹ֤ךְ וּ/לְ/רַגֵּל֙ הָ/אָ֔רֶץ בָּ֥אוּ עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
  footnotes:
  - marker: a
    text: Or “in your eyes.” The Hebrew idiom refers to Hanun’s perception or judgment.
    reason: lexical_alternative
  - marker: b
    text: Or “to overturn.” The Hebrew verb can mean to turn over or overturn; here it likely carries the sense of hostile subversion.
    reason: lexical_alternative
translation:
  language: ko
  text: 암몬 사람의 방백들이 하나눈에게 말했습니다. “다윗이 당신 아버지를 당신의 눈에 높여 주는 것이, 그가 당신에게 위로하는 사람들을 보냈기 때문입니까? 그의 신하들이 이 땅을 찾고, 뒤엎고, 엿보러 당신에게 온 것이 아니겠습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 눈에’는 히브리어 관용구로, 한눈의 인식이나 판단을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘뒤엎고’는 히브리어 הפך의 문자적 의미를 살리면서, 여기서는 적대적 전복의 뉘앙스를 담습니다.
    reason: theological_note
lexical_decisions:
- source_word: שָׂרֵי
  english_pob_choice: princes
  chosen_korean: 방백들
  alternatives_korean:
  - 지도자들
  - 관원들
  lexicon: HALOT
  rationale: שָׂרִים은 고위 통치자나 관원을 가리키므로, 권위 있는 정치적 지위를 드러내는 ‘방백들’이 문맥에 가장 잘 맞습니다.
- source_word: הַמְכַבֵּד
  english_pob_choice: honoring
  chosen_korean: 높여 주는
  alternatives_korean:
  - 존중하는
  - 존귀하게 하는
  lexicon: HALOT
  rationale: כבד의 ‘존중하다/영예롭게 하다’ 뜻을 살리면서, 히브리어의 의심 섞인 발화를 한국어로 자연스럽게 옮길 수 있는 표현을 택했습니다.
- source_word: בְּעֵינֶיךָ
  english_pob_choice: in your sight
  chosen_korean: 당신의 눈에
  alternatives_korean:
  - 당신 보기에
  - 당신의 시각에서
  lexicon: HALOT
  rationale: 직역에 가까운 관용구로서 ‘눈에’가 원문의 비유를 보존합니다. POB의 각주처럼 판단·인식의 관용 표현임을 드러냅니다.
- source_word: לַחְקֹר וְלַהֲפֹךְ וּלְרַגֵּל
  english_pob_choice: to search out, to overthrow, and to spy out
  chosen_korean: 찾고, 뒤엎고, 엿보러
  alternatives_korean:
  - 수색하고, 전복하고, 정탐하러
  - 조사하고, 뒤집고, 염탐하러
  lexicon: HALOT
  rationale: ‘찾다’는 חקר의 수색·탐색을, ‘뒤엎다’는 הפך의 적대적 전복 뉘앙스를, ‘엿보다’는 רגל의 정탐 의미를 비교적 직접적으로 반영합니다.
theological_decisions:
- issue: 암몬 방백들의 발화가 의도하는 적대적 정탐의 뉘앙스
  chosen_reading: ‘뒤엎고’로 옮겨 단순한 조사보다 적대적 전복 의도를 드러냈습니다.
  alternative_readings:
  - ‘뒤집고’
  - ‘전복하고’
  rationale: 히브리어 הפך는 문자적으로는 ‘뒤집다’지만, 여기서는 정치·군사적 맥락에서 해를 끼치려는 의도를 내포하므로, 의미를 분명히 하는 번역이 필요합니다.
  doctrine_reference: 본문 문맥의 역사서적 의미론
