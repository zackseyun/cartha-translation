  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: ko
  text: 이 일 후에 암몬 자손의 왕 나하스가 죽고 그의 아들이 그를 대신하여 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이후에
  - 그리고 이 일 뒤에
  lexicon: HALOT
  rationale: 서사 전환을 자연스럽게 살리면서도 히브리어의 시간 표지를 직접 반영하는 표현으로 옮겼습니다.
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 세상을 떠나고
  - 별세하고
  lexicon: HALOT
  rationale: 원문의 מות는 단순히 ‘죽다’이므로, 완곡한 표현보다 직접적인 ‘죽고’가 원뜻에 가깝습니다.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  english_pob_choice: king of the Ammonites
  chosen_korean: 암몬 자손의 왕
  alternatives_korean:
  - 암몬 사람들의 왕
  - 암몬 족속의 왕
  lexicon: HALOT
  rationale: 히브리어의 ‘암몬의 아들들’ 구조를 그대로 드러내어 혈연·민족 집단 표지를 유지했습니다.
- source_word: וַיִּמְלֹךְ בְּנֹו תַּחְתָּיו
  english_pob_choice: his son reigned in his place
  chosen_korean: 그의 아들이 그를 대신하여 왕이 되었습니다
  alternatives_korean:
  - 그의 아들이 그의 자리에 왕이 되었습니다
  - 그의 아들이 대신하여 다스리게 되었습니다
  lexicon: HALOT
  rationale: מלך의 왕위 계승 의미를 살리되, 한국어에서는 ‘왕이 되다’가 가장 자연스럽고 ‘그를 대신하여’가 תַּחְתָּיו의 승계 의미를 잘 드러냅니다.
