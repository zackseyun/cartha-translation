translation:
  language: ko
  text: 다윗이 듣고 요압과 용사들의 온 군대를 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보고를 받았습니다’나 ‘그것을 알게 되었습니다’.
