lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 듣게 되었습니다
  - 소식을 들었습니다
  - 보고를 받았습니다
  lexicon: HALOT
  rationale: 서술형에서는 ‘듣다’가 가장 직접적이며 자연스럽고, 문맥상 전달된 소식을 접했다는 함의도 함께 담을 수 있습니다.
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 내보냈습니다
  lexicon: HALOT
  rationale: 군사 서술에서 שלח은 단순한 발송이 아니라 사람을 보내는 행위를 뜻하므로, 표준적이고 명료한 ‘보냈습니다’가 적절합니다.
- source_word: צָבָא הַגִּבּוֹרִים
  english_pob_choice: and all the army of the mighty men
  chosen_korean: 모든 군대, 곧 용사들
  alternatives_korean:
  - 모든 군대, 곧 강한 용사들
  - 모든 전군, 곧 용사들
  lexicon: HALOT
  rationale: ‘군대’로 צָבָא의 조직된 군사력을 살리고, ‘용사들’로 הַגִּבּוֹרִים의 관용적 의미를 옮겨 ‘mighty men’의 정체성을 유지했습니다.
