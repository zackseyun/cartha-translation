  text: וַ/יֵּצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּֽעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הָ/עִ֑יר וְ/הַ/מְּלָכִ֣ים אֲשֶׁר בָּ֔אוּ לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
  footnotes:
  - marker: a
    text: Or 'the Ammonites came out.' The Hebrew reads more literally, 'the sons of Ammon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'arrayed themselves for battle.' The Hebrew idiom refers to arranging troops in battle formation.
    reason: lexical_alternative
  - marker: c
    text: Or 'at the gate of the city,' though the Hebrew word is more generally 'entrance/opening' than the usual term for 'gate.'
    reason: lexical_alternative
  - marker: d
    text: That is, the allied kings were stationed separately from the Ammonite forces, out in the field.
    reason: cultural_note
translation:
  language: ko
  text: 암몬 자손들이 나와서 성읍 어귀에서 전투를 위해 전열을 갖추었고,[a][b][c] 와 있던 왕들은 들에 따로 있었습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “암몬 사람들이 나왔다.” 히브리어는 더 문자적으로 “암몬의 아들들”이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “전투 대형을 갖추었다.” 히브리어 관용구는 병력을 전투 진형으로 정렬하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “성읍의 문에서.” 다만 히브리어는 보통의 ‘문’보다 더 일반적인 ‘입구/어귀’를 씁니다.
    reason: lexical_alternative
  - marker: d
    text: 즉, 동맹 왕들은 암몬 군대와 떨어져 들판에 따로 배치되어 있었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 살리되, 한국어에서는 자연스러운 민족명 구조인 ‘암몬 자손’으로 옮겼습니다.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  english_pob_choice: drew up for battle
  chosen_korean: 전열을 갖추어 싸우고
  alternatives_korean:
  - 싸우기 위해 진을 치고
  - 전투 대형을 갖추고
  lexicon: HALOT
  rationale: ערך+מלחמה는 단순히 ‘싸웠다’가 아니라 전투 진형을 갖추는 군사 관용구이므로, 그 전술적 의미를 드러냈습니다.
- source_word: פֶּתַח הָעִיר
  english_pob_choice: at the entrance of the city
  chosen_korean: 성읍의 어귀에서
  alternatives_korean:
  - 성읍의 문에서
  - 성읍의 입구에서
  lexicon: HALOT
  rationale: 본문은 통상적인 ‘문’이 아니라 ‘어귀/입구’를 쓰므로, POB의 취지를 따라 ‘어귀’로 번역해 어휘적 차이를 보존했습니다.
- source_word: לְבַדָּם
  english_pob_choice: by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 그들끼리
  - 홀로
  lexicon: HALOT
  rationale: 연합한 왕들이 암몬 군대와 분리되어 배치되었음을 간단히 드러내는 말로 ‘따로’가 가장 자연스럽습니다.
