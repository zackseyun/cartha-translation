revisions:
- from: 그들은 가서 그 사람들에 대해 다윗에게 알렸습니다. 그러자 그는 그들을 맞으러 사람을 보냈습니다. 그 사람들은 크게 수치를 당했기 때문입니다. 왕이 말했습니다. “너희는 너희 수염이 다시 자랄 때까지 여리고에 머물다가, 그다음에 돌아오십시오.”[a][b]
  to: 그들은 가서 그 사람들에 관하여 다윗에게 알렸습니다. 그러자 다윗은 그들을 맞이하러 보냈습니다.[a] 그 사람들이 크게 수치를 당했기 때문입니다.[b] 왕이 말했습니다. “여리고에 머무르십시오. 여러분의 수염이 다시 자라면 돌아오십시오.”
  rationale: 파견된 대상을 본문에서 보충하지 않아 히브리어의 미명시성을 보존했습니다. 또한 수치에 관한 어휘 각주를 해당 구절에 직접 연결했습니다. 왕의 직접 명령은 요청된 현대 합쇼체를 유지하되, 원문의 두 명령을 한국어에서 자연스럽게 두 문장으로 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:15:38Z'
