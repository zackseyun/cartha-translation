  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ וַ/יַּגִּ֨ידוּ לְ/דָוִ֤יד עַל הָֽ/אֲנָשִׁים֙ וַ/יִּשְׁלַ֣ח לִ/קְרָאתָ֔/ם כִּי הָי֥וּ הָ/אֲנָשִׁ֖ים נִכְלָמִ֣ים מְאֹ֑ד וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ שְׁב֣וּ בִֽ/ירֵח֔וֹ עַ֛ד אֲשֶׁר יְצַמַּ֥ח זְקַנְ/כֶ֖ם וְ/שַׁבְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
  footnotes:
  - marker: a
    text: Or 'he sent messengers to meet them'; the Hebrew does not state the object explicitly, though messengers are naturally implied.
    reason: lexical_alternative
  - marker: b
    text: '''Greatly humiliated'' could also be rendered ''deeply ashamed'' or ''utterly disgraced.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 가서 그 사람들에 대해 다윗에게 알렸습니다. 그러자 그는 그들을 맞으러 사람을 보냈습니다. 그 사람들은 크게 수치를 당했기 때문입니다. 왕이 말했습니다. “너희는 너희 수염이 다시 자랄 때까지 여리고에 머물다가, 그다음에 돌아오십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들을 맞으러 사람을 보냈습니다’는 히브리어가 파견된 대상을 명시하지 않는 점을 반영한 번역입니다. 문맥상 사절이 암시되지만 본문에는 직접 나오지 않습니다.
    reason: source_note
  - marker: b
    text: ‘크게 수치를 당했기’는 ‘깊이 부끄러워했다’, ‘완전히 수치를 당했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  english_pob_choice: told David about the men
  chosen_korean: 그 사람들에 대해 다윗에게 알렸습니다
  alternatives_korean:
  - 다윗에게 그 사람들에 관해 보고했습니다
  - 다윗에게 그 사람들에 대해 전했습니다
  lexicon: HALOT
  rationale: הגיד는 단순히 소식을 전하거나 알리는 뜻이므로, 문맥상 자연스러운 ‘알렸습니다’로 옮기되 עַל의 보고 대상을 ‘그 사람들에 대해’로 드러냈습니다.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  english_pob_choice: he sent to meet them
  chosen_korean: 그들을 맞으러 사람을 보냈습니다
  alternatives_korean:
  - 그들을 맞으러 보냈습니다
  - 그들을 만나러 사람들을 보냈습니다
  lexicon: HALOT
  rationale: 히브리어는 파견된 대상이 명시되지 않지만, 앞뒤 문맥상 사절/사람이 자연스럽게 암시되므로 한국어에서는 의미를 분명히 하되 과도한 확정은 피했습니다.
- source_word: נִכְלָמִים מְאֹד
  english_pob_choice: greatly humiliated
  chosen_korean: 크게 수치를 당했기 때문입니다
  alternatives_korean:
  - 매우 부끄러워했기 때문입니다
  - 심히 수치를 당했기 때문입니다
  lexicon: HALOT
  rationale: נכלם은 단순한 내적 감정보다 공적 수치와 굴욕을 포함하므로, ‘수치를 당하다’로 사회적 수모를 살렸습니다.
- source_word: שְׁבוּ בִירֵחוֹ
  english_pob_choice: Stay in Jericho
  chosen_korean: 여리고에 머물다가
  alternatives_korean:
  - 여리고에 머무르십시오
  - 여리고에 머물러 있으십시오
  lexicon: HALOT
  rationale: שׁב의 명령형은 여기서 거주·체류의 뜻이므로 ‘머물다’가 가장 자연스럽습니다. 이어지는 절차를 살려 ‘머물다가’로 연결했습니다.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  english_pob_choice: until your beards have grown back
  chosen_korean: 너희 수염이 다시 자랄 때까지
  alternatives_korean:
  - 너희 수염이 자랄 때까지
  - 너희 수염이 다시 길어질 때까지
  lexicon: HALOT
  rationale: צמח는 ‘자라다, 돋다’의 의미이므로, 이미 깎인 수염이 회복되는 상황을 반영해 ‘다시 자랄 때까지’로 옮겼습니다.
- source_word: וְשַׁבְתֶּם
  english_pob_choice: then return
  chosen_korean: 그다음에 돌아오십시오
  alternatives_korean:
  - 그리고 돌아오십시오
  - 그때 돌아오십시오
  lexicon: HALOT
  rationale: ‘עד אשר’ 뒤의 հաջորդ 행동을 한국어에서 분명하게 보여 주기 위해 순차 표지 ‘그다음에’를 사용했습니다.
theological_decisions:
- issue: 왕의 명령 화법과 인용문 내부의 존대 수준
  chosen_reading: 직접 인용 안에서는 왕의 명령을 현대 공손 명령형으로 옮겨, 대화 상대에게 주어지는 공식적 지시라는 점을 살렸습니다.
  alternative_readings:
  - 너희는 … 돌아오너라
  - … 돌아오십시오
  rationale: 히브리어는 단순한 명령이지만, 한국어 합쇼체 본문에서는 왕의 공적 지시를 지나치게 평어로 낮추지 않으면서도 현대 문체를 유지하는 것이 적절합니다.
  doctrine_reference: 서사 본문에서 화자·청자 관계를 드러내는 번역 관례
