language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂכְּר֣וּ לָ/הֶ֡ם שְׁנַיִם֩ וּ/שְׁלֹשִׁ֨ים אֶ֜לֶף רֶ֗כֶב וְ/אֶת מֶ֤לֶךְ מַעֲכָה֙ וְ/אֶת עַמּ֔/וֹ וַ/יָּבֹ֕אוּ וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֣י מֵידְבָ֑א וּ/בְנֵ֣י עַמּ֗וֹן נֶאֶסְפוּ֙ מֵ/עָ֣רֵי/הֶ֔ם וַ/יָּבֹ֖אוּ לַ/מִּלְחָמָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
  footnotes:
  - marker: a
    text: Or 'the Ammonites' for 'the sons of Ammon.' The Hebrew is literally 'sons of Ammon,' a standard ethnic designation.
    reason: lexical_alternative
  - marker: b
    text: '''Chariots'' may also denote a chariot force or chariotry collectively, not necessarily a count of individual vehicles only.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 삼만이천 대의 병거와 마아가의 왕과 그의 백성을 고용했습니다. 그들은 와서 메드바 앞에 진을 쳤고, 암몬 자손은 자기들의 성읍들에서 모여 전투에 나아왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  english_pob_choice: they hired for themselves
  chosen_korean: 그들은 …를 고용했습니다
  alternatives_korean:
  - 그들은 …를 빌렸습니다
  - 그들은 …를 마련했습니다
  lexicon: HALOT
  rationale: שׂכר의 핵심 의미는 ‘고용하다/임금 주고 사들이다’이므로, 전쟁 동맹을 돈으로 산 뉘앙스를 살리되 한국어에서는 목적어를 자연스럽게 풀어 ‘고용했습니다’로 옮겼습니다.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף רֶכֶב
  english_pob_choice: thirty-two thousand chariots
  chosen_korean: 삼만이천 대의 병거
  alternatives_korean:
  - 삼만이천 병거
  - 삼만이천 전차
  lexicon: HALOT
  rationale: 수사는 한국어 관용대로 정리했고, רֶכֶב은 여기서 전투용 수레/차량을 가리키므로 ‘병거’를 택해 군사적 집합체 의미를 유지했습니다.
- source_word: מֶלֶךְ מַעֲכָה וְאֶת עַמּוֹ
  english_pob_choice: the king of Maacah with his people
  chosen_korean: 마아가 왕과 그의 백성을 비롯하여
  alternatives_korean:
  - 마아가 왕과 그의 사람들을
  - 마아가 왕과 그의 군대를
  lexicon: HALOT
  rationale: עַם은 기본적으로 ‘백성’이지만 군사 맥락에서는 전투력까지 포함할 수 있어, 영어 POB처럼 범위를 좁히지 않고 ‘백성’으로 남겼습니다.
- source_word: לִפְנֵי מֵידְבָא
  english_pob_choice: before Medeba
  chosen_korean: 메드바 앞에 진을 쳤고
  alternatives_korean:
  - 메드바 맞은편에
  - 메드바 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי는 지리·군사 문맥에서 ‘앞에/맞은편에’의 뜻이므로, 진영 배치를 드러내는 동사와 함께 자연스럽게 옮겼습니다.
- source_word: בְנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬의 아들들
  - 암몬 사람들
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘암몬의 아들들’이지만, 한국어 성경에서 족속 표지로 널리 쓰이는 ‘자손’이 문맥상 자연스럽고 원문 구조도 드러냅니다.
