id: 1CH.19.4
reference: 1 Chronicles 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֤י דָוִיד֙ וַֽ/יְגַלְּחֵ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַד הַ/מִּפְשָׂעָ֑ה וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
  footnotes:
  - marker: a
    text: The parallel in 2 Samuel 10:4 specifies that Hanun shaved off half of their beards. Chronicles states only that he 'shaved them.'
    reason: cross_reference
  - marker: b
    text: Or 'up to the buttocks.' The Hebrew refers to the rear/buttocks area, emphasizing public humiliation through exposure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 하눈은 다윗의 종들을 데려다가 그들을 면도하고[a], 그들의 옷을 반쯤, 엉덩이까지 잘라[b], 그들을 돌려보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사무엘하 10:4의 평행본문은 하눈이 그들의 수염 절반을 깎았다고 더 구체적으로 말합니다. 역대기는 단지 ‘그들을 면도했다’고만 합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘엉덩이 부위까지’. 히브리어는 뒤쪽, 곧 엉덩이 부위를 가리키며, 공개적 수치를 주는 노출을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 시종들
  - 하인들
  - 노예들
  lexicon: HALOT
  rationale: 여기서는 다윗을 섬기던 신하/수종의 지위를 가리키므로 ‘종들’이 가장 무난하며, 본문이 포로적 소유 상태를 강조하지는 않습니다.
- source_word: וַיְגַלְּחֵם
  english_pob_choice: shaved them
  chosen_korean: 그들을 깎고
  alternatives_korean:
  - 그들의 수염을 밀어버리고
  - 그들을 면도하고
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘깎다/밀다’라는 동사를 쓰며, 역대기 자체에는 수염 대상이 명시되지 않으므로 그 불특정성을 살렸습니다.
- source_word: מַדְוֵיהֶם / בַּחֵצִי עַד הַמִּפְשָׂעָה
  english_pob_choice: their garments in half up to the hips
  chosen_korean: 그들의 옷을 엉덩이까지 반으로 잘라서
  alternatives_korean:
  - 그들의 옷을 엉덩이까지 잘라서 반만 남기고
  - 그들의 옷을 엉덩이까지 반으로 찢어서
  - 그들의 옷을 엉덩이까지, 곧 엉덩이 부위까지 잘라서
  lexicon: HALOT
  rationale: 본문의 초점은 공개적 수치심을 주는 옷의 절단에 있으며, ‘엉덩이까지’가 히브리어의 신체 부위를 비교적 직접적으로 드러냅니다.
- source_word: וַיְשַׁלְּחֵם
  english_pob_choice: sent them away
  chosen_korean: 그들을 돌려보냈습니다
  alternatives_korean:
  - 그들을 내보냈습니다
  - 그들을 보내버렸습니다
  - 그들을 해산시켰습니다
  lexicon: HALOT
  rationale: 단순 파견이 아니라 모욕 뒤에 내쫓는 뉘앙스가 있어 ‘돌려보내다’가 문맥상 적절합니다.
theological_decisions:
- issue: 수치와 모욕의 노출 표현
  chosen_reading: ‘옷을 엉덩이까지 반으로 잘라서’라고 옮겨, 본문의 공개적 수치심을 완곡하게 누그러뜨리지 않았습니다.
  alternative_readings:
  - ‘엉덩이까지’ 대신 ‘엉덩이 부위까지’로 완화
  - ‘반으로 잘라서’ 대신 ‘반쯤 잘라서’
  rationale: 역대기 본문은 굴욕적 노출을 의도적으로 강조하므로, 한국어도 그 폭력을 명확히 드러내야 합니다.
  doctrine_reference: 본문의 역사서 서술과 수치-모욕의 서사 기능
