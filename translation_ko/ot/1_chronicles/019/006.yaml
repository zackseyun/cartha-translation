  terminology: 하눈, 아람-나하라임, 아람-마아가, 소바 및 달란트는 적절합니다. 병거와 기병은 רֶכֶב וּפָרָשִׁים을 충실하게 옮깁니다. 각주의 내용과 본문 앵커가 서로 대응하지 않아 바로잡아야 합니다.
