- from: 암몬 자손이 자신들이 다윗에게 미움을 샀다는 것을 보았을 때, 하눈과 암몬 자손은 은 천 달란트를 보내어 아람-나하라임과 아람-마아가와 소바에서 자기들을 위해 병거와 기병을 고용했습니다.[a][b]
  to: 암몬 사람들이 자신들이 다윗에게 미움을 사게 된 것을 알자,[a] 하눈과 암몬 사람들은 은 천 달란트를 보내어 자기들을 위해 아람-나하라임[b]과 아람-마아가와 소바에서 병거와 기병을 고용했습니다.
  rationale: 문맥상의 인식 동사를 ‘알자’로 다듬고, 민족 집단명은 자연스러운 ‘암몬 사람들’로 통일했습니다. 또한 두 각주를 실제로 설명하는 본문 표현에 각각 배치하고, 히브리어 관용구의 문자적 설명을 더 정확히 정리했습니다. 그 밖의 지명, 금액 단위, 군사 용어 및 수혜 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:15:21Z'
