  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וַיִּרְאוּ는 이 문맥에서 단순 시각 행위보다 상황을 ‘알게 되다/깨닫다’라는 인식으로 옮기는 것이 자연스럽습니다. הִתְבָּאֲשׁוּ עִם דָּוִד의 관용적 의미도 ‘다윗에게 미움을 사게 되다’로 적절히 반영되었습니다.
