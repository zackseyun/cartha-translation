id: 1CH.19.6
reference: 1 Chronicles 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
  footnotes:
  - marker: a
    text: Aram-naharaim is traditionally understood as 'Aram of the Two Rivers,' that is, Mesopotamia.
    reason: cultural_note
  - marker: b
    text: 'Hebrew: ''had become odious''—literally, ''had made themselves stink'' to David, an idiom for becoming offensive or detestable.'
    reason: lexical_alternative
translation:
  language: ko
  text: 암몬 사람들이 자신들이 다윗에게 미움을 사게 된 것을 알자,[a] 하눈과 암몬 사람들은 은 천 달란트를 보내어 자기들을 위해 아람-나하라임[b]과 아람-마아가와 소바에서 병거와 기병을 고용했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘다윗에게 자신들이 악취를 풍기게 되었다’는 뜻입니다. 이는 누군가에게 불쾌하거나 혐오스러운 존재가 되었다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 아람-나하라임은 전통적으로 ‘두 강의 아람’, 곧 메소포타미아로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 사람들
  lexicon: HALOT
  rationale: 민족 집단을 가리키는 표현이므로, 본문 구조를 살리기 위해 ‘암몬 자손’으로 옮겼습니다.
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  english_pob_choice: had become odious to David
  chosen_korean: 다윗에게 미움을 샀다는 것
  alternatives_korean:
  - 다윗에게 역겨운 존재가 되었다는 것
  - 다윗에게 오물이 된 것
  lexicon: HALOT
  rationale: 히트파엘의 관용구는 문자적으로는 ‘냄새가 나게 되다’이지만, 한국어 본문에서는 의미를 자연스럽게 드러내면서도 ‘다윗에게’라는 대상 관계를 보존했습니다.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  english_pob_choice: a thousand talents of silver
  chosen_korean: 은 천 달란트
  alternatives_korean:
  - 은 1,000 달란트
  - 은 천 달란트의 כסף
  lexicon: HALOT
  rationale: כִּכָּר를 ‘달란트’로 옮겨 전통적 무게 단위를 유지했고, כסף는 문맥상 ‘은’으로 간명하게 표현했습니다.
- source_word: לִשְׂכֹּר לָהֶם
  english_pob_choice: to hire for themselves
  chosen_korean: 자기들을 위해 ... 고용했습니다
  alternatives_korean:
  - 자기들을 위해 ... 사게 했습니다
  - 자기들에게 ... 고용하게 했습니다
  lexicon: HALOT
  rationale: לָהֶם의 이익/수혜 뉘앙스를 살리기 위해 목적어적 반사 의미를 ‘자기들을 위해’로 풀었습니다.
- source_word: אֲרַם נַהֲרַיִם, אֲרַם מַעֲכָה, וּמִצּוֹבָה
  english_pob_choice: Aram-naharaim, Aram-maacah, and Zobah
  chosen_korean: 아람-나하라임과 아람-마아가와 소바
  alternatives_korean:
  - 아람-나하라임과 마아가의 아람과 소바
  - 메소포타미아와 마아가와 소바
  lexicon: HALOT
  rationale: 고유 지명은 음역을 유지해 본문 흐름을 보존했고, ‘나하라임’은 POB의 문화적 주석을 본문이 아닌 각주로 둘 수 있는 이름 형태로 남겼습니다.
theological_decisions:
- issue: ‘다윗에게 미움을 샀다’는 관용구의 강도
  chosen_reading: 직역적 잔혹성보다 관계적 적대 상태를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘다윗에게 역겨운 존재가 되었다’
  - ‘다윗의 눈에 악취가 되었다’
  rationale: 본문은 감각적 은유를 통해 적대의 심화를 보여 주므로, 한국어에서도 그 결과 상태를 분명히 하되 과도한 직역으로 읽기 부담을 높이지 않도록 했습니다.
  doctrine_reference: 문맥상 역사 서술; 교리적 쟁점 없음
