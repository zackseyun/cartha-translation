source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
  footnotes:
  - marker: a
    text: Or, 'and let us be strong' or 'and let us strengthen ourselves.' The Hebrew verb is reflexive/intensive.
    reason: lexical_alternative
  - marker: b
    text: Or, 'and the LORD will do what is good in his eyes.' The Hebrew form can be read as either volitional or predictive in context.
    reason: alternative_reading
translation:
  language: ko
  text: 힘을 내십시오. 우리 백성과 우리 하나님의 성읍들을 위하여 우리도 힘을 냅시다[a]. 야훼께서 보시기에 좋은 일을 하시기를 바랍니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리도 강해집시다’, ‘우리 스스로를 강하게 합시다’. 히브리어 동사는 반사·강조의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 보시기에 좋은 일을 하실 것입니다’. 문맥상 이 동사는 의지형이나 예측형으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  english_pob_choice: Be strong
  chosen_korean: 힘을 내십시오
  alternatives_korean:
  - 강건하십시오
  - 담대하십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형의 직접적인 격려를 한국어 합쇼체로 자연스럽게 옮겼습니다. 전투적 맥락에서 단순한 상태 묘사보다 결의 있는 격려를 드러냅니다.
- source_word: וְנִתְחַזְּקָה
  english_pob_choice: and let us be strong
  chosen_korean: 그리고 우리도 힘을 내자
  alternatives_korean:
  - 그리고 우리도 강해지자
  - 그리고 우리 스스로를 강하게 하자
  lexicon: HALOT
  rationale: 히트파엘의 반사·강조 뉘앙스를 살리되, 한국어에서는 과도한 직역보다 공동체적 결의 표현인 '우리도 힘을 내자'가 가장 자연스럽습니다.
- source_word: עָרֵי אֱלֹהֵינוּ
  english_pob_choice: the cities of our God
  chosen_korean: 우리 하나님의 도시들
  alternatives_korean:
  - 우리 하나님의 성읍들
  - 우리 하나님의 성들
  lexicon: HALOT
  rationale: '''성읍''은 전통적이지만 현대 한국어에서는 다소 낯설 수 있어, 원문의 소유 관계를 분명히 하면서도 읽기 쉬운 ''도시들''을 택했습니다. ''우리 하나님의''는 도시들의 소속이 하나님께 있음을 보존합니다.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 약속에 따라 신명기는 '야훼'로 옮겼습니다. 전통적 대체어 '주'는 여기서 고유 სახელ을 지우므로 사용하지 않았습니다.
- source_word: הַטּוֹב בְּעֵינָיו
  english_pob_choice: what is good in his eyes
  chosen_korean: 그의 눈에 좋으신 일
  alternatives_korean:
  - 그의 눈에 좋은 일
  - 그가 보시기에 좋은 일
  lexicon: HALOT
  rationale: 히브리 관용구를 한국어에서도 이미지가 살아 있도록 살렸습니다. '좋으신'은 문맥상 하나님을 향한 존중을 반영하되, 판단 기준이 하나님의 시각에 있음을 유지합니다.
theological_decisions:
- issue: '마지막 절의 העתיד형(미완료형) 해석: 선언인가, 소망/위탁인가'
  chosen_reading: '''야훼께서 ... 하시기를 바랍니다''로 소망·위탁의 어조를 살렸습니다.'
  alternative_readings:
  - '''야훼께서 ... 하실 것입니다'''
  - '''야훼께서 ... 하십시오'''
  rationale: 문맥상 인간의 결의 뒤에 결과를 하나님께 맡기는 말투가 어울립니다. 예언적 확언으로 고정하기보다, 원문의 긴장을 보존하는 소망형 표현이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
