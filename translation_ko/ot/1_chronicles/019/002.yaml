  - severity: low
    issue: חֶסֶד의 ‘은혜’ 번역
    rationale: ‘은혜’가 불가능한 것은 아니지만, 이 문맥에서는 신학적 또는 위계적 시혜의 연상을 줄일 수 있는 ‘호의’가 더 정확하고 현대적입니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주는 ‘그의 아버지 일로’라는 עַל אָבִיו의 해석과 관련되므로 해당 구절 바로 뒤에 배치하는 편이 앵커가 명확합니다.
  revised_text: 다윗이 말했습니다. “나는 그의 아버지가 내게 호의를 베풀었으므로, 나하스의 아들 하눈에게 호의를 베풀겠습니다.” 그래서 다윗은 그의 아버지 일로[a] 그를 위로하려고 사절들을 보냈습니다. 다윗의 종들은 암몬 사람들의 땅에 있는 하눈에게 와서 그를 위로하려고 했습니다.
