revisions:
- from: 다윗이 말했습니다. “나는 그의 아버지가 내게 은혜를 베풀었으므로, 나하스의 아들 하눈에게도 은혜를 베풀겠습니다.” 그래서 다윗은 그의 아버지에 관하여 그를 위로하려고 사자들을 보냈습니다. 다윗의 종들이 암몬 자손의 땅, 하눈에게로 가서 그를 위로하러 갔습니다.[a]
  to: 다윗이 말했습니다. “나는 그의 아버지가 내게 호의를 베풀었으므로, 나하스의 아들 하눈에게 호의를 베풀겠습니다.” 그래서 다윗은 그의 아버지 일로[a] 그를 위로하려고 사절들을 보냈습니다. 다윗의 종들은 암몬 사람들의 땅에 있는 하눈에게 와서 그를 위로하려고 했습니다.
  rationale: 문법적 중복을 제거하고 목적을 나타내는 히브리어 부정사 לְנַחֲמוֹ를 두 차례 모두 ‘위로하려고’로 반영했습니다. חֶסֶד는 문맥상 상호적 선의인 ‘호의’로 통일했습니다. 아버지의 죽음이라는 애도 맥락은 각주로 제시하여 본문의 표현을 불필요하게 확정적으로 확장하지 않았습니다.
  reviewer_model: gpt-5.6-terra
