id: 1CH.19.2
reference: 1 Chronicles 19:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
  footnotes:
  - marker: a
    text: Or 'to console him over his father.' The Hebrew expression indicates that the consolation was occasioned by his father's death.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 말했습니다. “나는 그의 아버지가 내게 호의를 베풀었으므로, 나하스의 아들 하눈에게 호의를 베풀겠습니다.” 그래서 다윗은 그의 아버지 일로[a] 그를 위로하려고 사절들을 보냈습니다. 다윗의 종들은 암몬 사람들의 땅에 있는 하눈에게 와서 그를 위로하려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지의 죽음으로 인해’로 옮길 수 있습니다. 히브리어 표현은 아버지의 죽음을 계기로 한 위로를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: kindness
  chosen_korean: 은혜를 베풀다
  alternatives_korean:
  - 친절을 베풀다
  - 인자함을 보이다
  - 호의를 베풀다
  lexicon: HALOT
  rationale: חֶסֶד는 이 문맥에서 상호적 호의와 충성을 포함한 선의이므로, 단순한 친절보다 관계적 베풂을 드러내는 ‘은혜를 베풀다’가 더 적절합니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 사신들
  - 메신저들
  lexicon: HALOT
  rationale: 여기서는 외교 사절이지만, 히브리어 기본 뜻인 ‘보내진 사람들’을 살려 전통적으로도 쓰이는 ‘사자들’로 옮겼습니다.
- source_word: לְנַחֲמוֹ
  english_pob_choice: to comfort him
  chosen_korean: 위로하려고
  alternatives_korean:
  - 위로하기 위해
  - 조문하려고
  - 슬픔을 달래주려고
  lexicon: HALOT
  rationale: נחם은 상실을 겪은 자를 위로하는 뜻이므로, 목적을 나타내는 ‘위로하려고’가 자연스럽고 의미를 정확히 전달합니다.
- source_word: עַל אָבִיו
  english_pob_choice: concerning his father
  chosen_korean: 그의 아버지에 관하여
  alternatives_korean:
  - 그의 아버지 때문에
  - 그의 아버지를 두고
  - 아버지의 일로
  lexicon: HALOT
  rationale: 여기서 עַל은 조문/위로의 계기를 나타내므로, 죽음의 사유를 지나치게 단정하지 않으면서도 관계를 드러내는 ‘그의 아버지에 관하여’로 옮겼습니다.
theological_decisions:
- issue: 다윗의 의도 표현과 조문 맥락
  chosen_reading: ‘그의 아버지가 내게 은혜를 베풀었으므로…’와 ‘그를 위로하려고’로, 상호 호의와 상실에 대한 조문을 함께 드러냈습니다.
  alternative_readings:
  - ‘그의 아버지가 내게 친절을 베풀었으므로…’
  - ‘그의 아버지의 죽음을 위로하려고’
  rationale: 본문은 정치적 관계 속 호의 보답과 장례/애도 맥락을 함께 담고 있으므로, 둘을 모두 보존하는 번역이 소스의 긴장을 가장 잘 살립니다.
  doctrine_reference: '서사 본문 해석: חסד와 애도 관습의 문맥적 의미'
