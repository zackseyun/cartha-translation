source:
  edition: WLC
  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
  footnotes:
  - marker: a
    text: 'Hebrew: ''among the peoples''; alternatively, ''among the nations.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'his acts'; the Hebrew term refers to what he has done.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 감사하라[a]; 그의 이름을 부르라; 그의 행적을 백성들 가운데 알리라[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 고유명사 יהוה를 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘민족들’ 또는 ‘나라들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  english_pob_choice: Give thanks
  chosen_korean: 감사하라
  alternatives_korean:
  - 찬양하라
  - 감사드리라
  lexicon: HALOT
  rationale: 히필 명령형으로 하나님께 드리는 응답을 나타내므로, 현대 한국어에서 가장 자연스럽고 예배 맥락에 맞는 ‘감사하라’로 옮겼습니다.
- source_word: לַֽיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 하나님의 이름을 보존하기 위해 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 관계격 ‘-께’를 붙여 감사의 대상임을 분명히 했습니다.
- source_word: קִרְא֣וּ בִ/שְׁמ֔/וֹ
  english_pob_choice: call on his name
  chosen_korean: 그의 이름을 부르라
  alternatives_korean:
  - 그의 이름을 부르라
  - 그의 이름을 불러 의지하라
  - 그의 이름으로 부르라
  lexicon: HALOT
  rationale: ‘이름을 부르다’는 단순 호명보다 하나님을 향한 호소와 예배적 호출을 포함하므로, 직역에 가까우면서도 자연스러운 현대 한국어로 유지했습니다.
- source_word: הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו
  english_pob_choice: make his deeds known among the peoples
  chosen_korean: 그의 행적을 백성들 가운데 알리라
  alternatives_korean:
  - 그의 행적을 만민 가운데 알리라
  - 그의 일을 백성들 가운데 알리라
  - 그의 행사를 민족들 가운데 알리라
  lexicon: HALOT
  rationale: הוֹדִיעוּ의 사역적 의미를 ‘알리다’로 살리고, עַמִּים는 POB의 ‘peoples’에 맞춰 ‘백성들’로 옮겼습니다. עֲלִילוֹת는 단순 ‘행위’보다 드러난 ‘행적’이 더 자연스럽고 문맥상 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신적 칭호가 아니라 고유한 언약명 יהוה를 사용하므로, 한국어 본문에서도 이를 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
