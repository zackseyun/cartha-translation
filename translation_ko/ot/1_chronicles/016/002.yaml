lexical_decisions:
- source_word: וַיְכַל מֵהַעֲלוֹת
  english_pob_choice: When David finished offering up
  chosen_korean: 다윗이 번제와 화목제물을 드리기를 마치자
  alternatives_korean:
  - 다윗이 번제와 화목제물을 드리는 일을 마쳤을 때
  - 다윗이 번제와 화목제물을 바치기를 마치자
  lexicon: HALOT
  rationale: כלה + מן + infinitive는 ‘~하기를 마치다’의 완료 의미를 가지므로, 한국어에서도 시간 연결을 살려 자연스럽게 옮겼습니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 완전번제
  lexicon: HALOT
  rationale: עֹלָה는 제사 용어로 표준적인 ‘번제’가 가장 정확하고 간결합니다.
- source_word: וְהַשְּׁלָמִים
  english_pob_choice: the peace offerings
  chosen_korean: 화목제물
  alternatives_korean:
  - 평화제물
  - 친교제물
  - 화목제
  lexicon: HALOT
  rationale: שְׁלָמִים는 평화·화목·친교의 뉘앙스를 모두 가지므로, 한국어에서는 이 범위를 드러내는 ‘화목제물’을 택했습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 여호와의 이름으로
  - 주님의 이름으로
  lexicon: HALOT
  rationale: בְּשֵׁם은 ‘~의 이름으로’가 가장 직접적이며, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 본문의 신적 명칭 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 일반 호칭이 아니라 언약적 고유명인 Tetragrammaton을 직접 사용하므로, 제목적 대체어보다 고유명 표기가 원문 의미를 더 분명히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
