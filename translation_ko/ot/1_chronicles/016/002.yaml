base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
  footnotes:
  - marker: a
    text: Or “the fellowship offerings” or “the offerings of well-being.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 번제와 화목제물을 드리기를 마치자, 야훼의 이름으로 백성에게 복을 빌어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “화목제물”이나 “평안제물”입니다.
