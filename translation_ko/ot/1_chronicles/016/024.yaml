source:
  edition: WLC
  text: סַפְּר֤וּ בַ/גּוֹיִם֙ אֶת כְּבוֹד֔/וֹ בְּ/כָל הָ/עַמִּ֖ים נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: ko
  text: 민족들 가운데에서는 그의 영광을, 모든 백성들 가운데에서는 그의 놀라운 일들을 선포하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  english_pob_choice: Declare
  chosen_korean: 선포하십시오
  alternatives_korean:
  - 알리십시오
  - 전하십시오
  - 말하십시오
  lexicon: HALOT
  rationale: ספר의 분사적/명령형 맥락에서 공적인 발표와 선전의 뜻이 강하므로, 단순한 '말하다'보다 예배적이고 공개적인 명령형인 '선포하십시오'가 적절합니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데에서는
  alternatives_korean:
  - 나라들 가운데에서는
  - 이방들 가운데에서는
  - 민족들 중에서
  lexicon: HALOT
  rationale: גּוֹיִם은 이 문맥에서 이스라엘 밖의 여러 집단을 가리키는 '민족들'이 자연스럽고, ב의 범위감을 살리기 위해 '가운데에서는'으로 옮겼습니다.
- source_word: נִפְלְאֹתָיו
  english_pob_choice: his wondrous deeds
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 기이한 일들
  - 그의 경이로운 일들
  - 그의 놀라운 행적
  lexicon: HALOT
  rationale: פלא 계열은 사람을 놀라게 하는 하나님의 특별한 행위를 가리키므로, 결과보다 행위 자체를 드러내는 '놀라운 일들'이 가장 자연스럽습니다.
- source_word: בְּכָל־הָעַמִּים
  english_pob_choice: among all the peoples
  chosen_korean: 모든 백성들 가운데에서는
  alternatives_korean:
  - 모든 민족들 가운데에서는
  - 모든 사람들 가운데에서는
  - 모든 백성들 중에서
  lexicon: HALOT
  rationale: עַמִּים은 앞의 גּוֹיִם과 병렬을 이루는 '백성들/민족들'이지만, 시적 평행을 살리기 위해 한국어에서는 '백성들'을 택해 반복을 완화했습니다.
- source_word: כְבוֹדוֹ
  english_pob_choice: his glory
  chosen_korean: 그의 영광을
  alternatives_korean:
  - 그의 존귀를
  - 그의 위엄을
  - 그의 영화를
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님의 무게감과 존귀를 가리키는 표준어휘이므로, 한국어 성경 전통과의 연결성도 고려해 '영광'을 유지했습니다.
theological_decisions:
- issue: ‘여호와’에 해당하는 하나님의 이름 표기 문제
  chosen_reading: 이 절은 시편/역대기 찬양 문맥에서 야훼의 영광과 행위를 선포하라는 명령으로 읽고, 인칭대명사 '그의'는 그분을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 하나님의 일반칭을 명시하는 방식
  - 전통적 교회 용례인 '여호와'를 사용하는 방식
  rationale: 본문에는 고유명사가 직접 나타나지 않지만, 바로 앞뒤 문맥상 찬양의 대상은 야훼입니다. 현행 프로젝트 기본값에 따라 본문은 대명사만 보존하고, 문맥상 지시 대상을 해석합니다.
  doctrine_reference: Translation philosophy §1, §3; OT citation context
