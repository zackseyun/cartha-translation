id: 1CH.16.1
reference: 1 Chronicles 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
  footnotes:
  - marker: a
    text: Or 'inside the tent' or 'within the tent'; the Hebrew phrase can denote being within something, though literally it is 'in the midst of the tent.'
    reason: lexical_alternative
  - marker: b
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하나님의 궤를 가져와 다윗이 그것을 위해 쳐 둔 장막 가운데에 두고, 하나님 앞에서 번제와 화목제를 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  english_pob_choice: brought in
  chosen_korean: 가져와
  alternatives_korean:
  - 가져왔습니다
  - 안으로 들여왔습니다
  lexicon: HALOT
  rationale: 궤를 장막 안으로 이동시키는 방향성이 분명하므로, 단순한 '가져왔다'보다 '가져와'가 이어지는 동작을 더 자연스럽게 드러냅니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님께 속한 궤
  lexicon: HALOT
  rationale: 히브리어는 여기서 단순히 '하나님의 궤'라고 말하므로, '언약궤'를 덧붙여 범위를 넓히지 않고 직접적으로 옮겼습니다.
- source_word: בְּתוֹךְ הָאֹהֶל
  english_pob_choice: in the midst of the tent
  chosen_korean: 장막 가운데에
  alternatives_korean:
  - 장막 안에
  - 장막 안쪽에
  lexicon: HALOT
  rationale: בְּתוֹךְ는 '가운데/한복판'의 공간감을 살릴 수 있어, 단순한 '안에'보다 '가운데에'가 본문의 구체성을 더 잘 보존합니다.
- source_word: עֹלוֹת וּשְׁלָמִים
  english_pob_choice: burnt offerings and peace offerings
  chosen_korean: 번제와 화목제
  alternatives_korean:
  - 번제와 평화제
  - 번제와 교제제물
  lexicon: HALOT
  rationale: 제의적 용어의 구분을 유지하기 위해 전통적이고도 의미가 분명한 '번제'와 '화목제'를 사용했습니다.
theological_decisions:
- issue: 장막의 성격
  chosen_reading: הָאֹהֶל을 '장막'으로 옮겨, 모세의 성막으로 단정하지 않고 다윗이 마련한 임시 거처라는 본문의 직접 정보를 살렸습니다.
  alternative_readings:
  - 성막
  - 천막
  rationale: 본문은 다윗이 그것을 위해 친 장막이라고만 말하므로, '성막'은 뒤의 제의적 연상을 과도하게 불러올 수 있습니다.
  doctrine_reference: Translation philosophy §1
