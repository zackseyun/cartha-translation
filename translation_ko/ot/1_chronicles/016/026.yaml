id: 1CH.16.26
reference: 1 Chronicles 16:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
  footnotes:
  - marker: a
    text: Or 'the nations' instead of 'the peoples.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew conjunction is literally ''and,'' but here it carries a contrasting sense: ''but the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 모든 백성의 신들은 우상들이지만, 야훼께서 하늘들을 만드셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הָעַמִּים은 '백성들' 또는 '나라들/민족들'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 접속사 ו는 문자적으로 '그리고'이지만, 여기서는 대조적 의미의 '하지만'으로 읽는 것이 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעַמִּים
  english_pob_choice: the gods of the peoples
  chosen_korean: 모든 백성의 신들
  alternatives_korean:
  - 민족들의 신들
  - 나라들의 신들
  lexicon: HALOT
  rationale: הָעַמִּים은 기본적으로 'peoples'이므로 '백성들'로 옮기되, 문맥상 보편적 대조를 드러내기 위해 '모든'을 살렸습니다.
- source_word: אֱלִילִים
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 헛것들
  - 무가치한 우상들
  lexicon: HALOT
  rationale: 이 단어는 우상을 가리키며 멸시적 뉘앙스가 있으나, 본문 대조를 흐리지 않도록 기본적이고 직접적인 '우상들'로 옮겼습니다.
- source_word: וַיהוָה
  english_pob_choice: but Yahweh
  chosen_korean: 야훼께서
  alternatives_korean:
  - 그러나 야훼께서
  - 그리고 야훼께서
  lexicon: HALOT
  rationale: 히브리어 접속사는 형식상 '그리고'이지만 문맥상 강한 대조를 이루므로 한국어에서는 앞절과의 대비를 자연스럽게 드러내는 어순과 조사를 사용했습니다.
- source_word: שָׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘들을
  alternatives_korean:
  - 하늘
  - 하늘들
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 '하늘들을'로 옮겨 창조 진술의 폭과 원문 형식을 함께 살렸습니다.
- source_word: עָשָׂה
  english_pob_choice: made
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 창조하셨습니다
  lexicon: HALOT
  rationale: '''עשה''는 넓게 ''만들다/행하다''를 뜻하므로, 창조적 행위를 담되 과도하게 해석적이지 않은 ''만드셨습니다''를 선택했습니다.'
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 주어진 POB 기준에 따라 여호와 대신 학술적 음역인 '야훼'를 사용해 고유한 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 대조 접속의 처리
  chosen_reading: 우상들이지만
  alternative_readings:
  - 우상들이며
  - 우상들이고
  rationale: 본문은 열방의 신들과 야훼를 날카롭게 대조하므로, 한국어에서도 반대 관계가 분명히 드러나도록 '지만'을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source-text sense in readable Korean'
