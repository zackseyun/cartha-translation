  lexicon: HALOT
  rationale: '''עשה''는 넓게 ''만들다/행하다''를 뜻하므로, 창조적 행위를 담되 과도하게 해석적이지 않은 ''만드셨습니다''를 선택했습니다.'
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 주어진 POB 기준에 따라 여호와 대신 학술적 음역인 '야훼'를 사용해 고유한 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 대조 접속의 처리
  chosen_reading: 우상들이지만
  alternative_readings:
