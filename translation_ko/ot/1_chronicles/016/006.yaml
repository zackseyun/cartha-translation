  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
  footnotes:
  - marker: a
    text: Or, 'were continually blowing the trumpets before the ark of the covenant of God.' The Hebrew does not state the verb explicitly, though this is likely the intended sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 브나야와 야하시엘은 제사장으로서 하나님의 언약궤 앞에서 늘 나팔을 들고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 '불다'에 해당하는 동사를 직접 말하지 않으므로, 본문은 문자적으로는 '나팔과 함께'라는 상태를 말합니다. 문맥상 나팔을 부는 뜻이 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָ֥הוּ וְ/יַחֲזִיאֵ֖ל
  english_pob_choice: And Benaiah and Jahaziel
  chosen_korean: 브나야와 야하시엘
  alternatives_korean:
