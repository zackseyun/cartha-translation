base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
  footnotes:
  - marker: a
    text: Or, 'were continually blowing the trumpets before the ark of the covenant of God.' The Hebrew does not state the verb explicitly, though this is likely the intended sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 브나야와 야하시엘 두 제사장은 늘 하나님의 언약궤 앞에서 나팔을 가지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 '불다'에 해당하는 동사가 명시되어 있지 않습니다. 문자적으로는 제사장들이 나팔들과 함께 하나님의 언약궤 앞에 계속 있었음을 말하며, 문맥상 나팔을 부는 일을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָ֥הוּ וְ/יַחֲזִיאֵ֖ל
  english_pob_choice: And Benaiah and Jahaziel
  chosen_korean: 브나야와 야하시엘
  alternatives_korean:
  - 브나야와 여하시엘
  - 브나야와 야하시엘
  lexicon: HALOT
  rationale: 두 인명은 음역으로 처리하되, 한국어 성경에서 널리 쓰이는 브나야를 유지하고 יַחֲזִיאֵל은 어형에 가까운 야하시엘로 옮겼습니다.
- source_word: הַ/כֹּהֲנִ֑ים
  english_pob_choice: the priests
  chosen_korean: 제사장으로서
  alternatives_korean:
  - 제사장들
  - 제사장들이
  lexicon: HALOT
  rationale: 두 인물을 직함으로 규정하는 관계를 살리기 위해 서술 속에서 직분을 표시했고, 문맥상 단순 복수보다 직분적 용법이 더 분명합니다.
- source_word: בַּ/חֲצֹצְר֣וֹת
  english_pob_choice: with the trumpets
  chosen_korean: 나팔을 들고 있었습니다
  alternatives_korean:
  - 나팔과 함께 있었습니다
  - 나팔을 가지고 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 명시적 동사 없이 도구/동반 관계만 말하므로, 한국어에서는 자연스럽게 '나팔을 들고 있었습니다'로 옮겨 지속적 봉사의 상태를 드러냈습니다.
- source_word: תָּמִיד
  english_pob_choice: continually
  chosen_korean: 늘
  alternatives_korean:
  - 항상
  - 계속
  lexicon: HALOT
  rationale: תָּמִיד의 지속성을 현대 한국어에서 간결하게 살리기 위해 '늘'을 택했습니다.
- source_word: לִ/פְנֵי אֲר֥וֹן בְּרִית הָ/אֱלֹהִים
  english_pob_choice: before the ark of the covenant of God
  chosen_korean: 하나님의 언약궤 앞에서
  alternatives_korean:
  - 하나님의 언약궤 앞에
  - 하나님의 언약궤 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי의 공간·예배적 위치를 '앞에서'로 자연스럽게 옮겼고, '언약궤'는 한국어 성경의 정착된 용례를 따랐습니다.
theological_decisions:
- issue: 히브리어 본문에 '불다'라는 동사가 명시되지 않는 점을 한국어에서 어떻게 처리할지
  chosen_reading: 본문의 상태 묘사를 살리되, 한국어 자연성을 위해 '나팔을 들고 있었습니다'로 완화해 번역했습니다.
  alternative_readings:
  - 나팔과 함께 있었습니다
  - 나팔을 불었습니다
  rationale: 원문은 제사장과 나팔, 그리고 지속적 위치를 말하지만 동사를 직접 주지 않으므로, '불었습니다'처럼 행동을 앞세우는 해석은 피하고 문맥상 가능한 봉사 상태를 나타냈습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; avoid adding action not explicit in the source.'
