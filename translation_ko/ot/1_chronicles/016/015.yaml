translation:
  language: ko
  text: 그의 언약을 영원히 기억하십시오[a]. 그가 천대에 걸쳐 명하신 말씀을.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 천대에 걸쳐 명하신 약속’.
