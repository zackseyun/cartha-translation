lexical_decisions:
- source_word: זִכְרוּ
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 기억하십시오!
  - 되새기십시오
  lexicon: HALOT
  rationale: 공동체를 향한 명령형을 현대 한국어 합쇼체로 자연스럽게 옮기되, 단순한 인지보다 지속적인 기억의 요청을 살려 ‘기억하십시오’로 옮겼습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 늘
  - 영속적으로
  lexicon: HALOT
  rationale: משך(duration)의 의미를 현대적이고 자연스러운 표현인 ‘영원히’로 옮겨, 시간의 무한한 지속을 분명히 했습니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 그의 언약
  alternatives_korean:
  - 그의 계약
  - 그의 조약
  - 그의 맹세
  lexicon: HALOT
  rationale: אָ지קת과 신학적 관계를 가진 בְּרִית는 성경적 맥락에서 ‘언약’이 가장 직접적이며, 전통적 교회어보다 원어 의미를 안정적으로 전달합니다.
- source_word: דָּבָר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 약속
  - 일
  lexicon: HALOT
  rationale: 직역상 ‘말’/‘말씀’이 가능하지만, 앞의 ‘언약’과 병렬을 이루며 하나님이 명하신 내용이라는 점을 살려 ‘말씀’으로 옮겼습니다. 다만 ‘약속’의 뉘앙스는 주해상 가능한 대안으로 각주에 남겼습니다.
- source_word: צִוָּה
  english_pob_choice: he commanded
  chosen_korean: 명하신
  alternatives_korean:
  - 명령하신
  - 지시하신
  - 정하신
  lexicon: HALOT
  rationale: צוה의 기본 의미인 ‘명하다’를 보존하되, 이어지는 관형절에서 자연스럽게 읽히도록 ‘명하신’으로 처리했습니다.
- source_word: לְאֶלֶף דּוֹר
  english_pob_choice: for a thousand generations
  chosen_korean: 천대에 걸쳐
  alternatives_korean:
  - 천 대 동안
  - 천 세대에 걸쳐
  - 천 세대 동안
  lexicon: HALOT
  rationale: 세대의 연속성을 살리면서 한국어에서 가장 자연스러운 지속 표현인 ‘천대에 걸쳐’로 옮겼습니다. 수사적 과장인지 문자적 수치인지 결정하지 않고 원문의 시간을 그대로 보존했습니다.
theological_decisions:
- issue: דָּבָר의 핵심 의미를 ‘말씀’으로 둘지 ‘약속’으로 둘지
  chosen_reading: 본문에는 ‘말씀’을 두고, ‘약속’ 가능성은 각주로 보존했습니다.
  alternative_readings:
  - 약속
  - 말
  - 일
  rationale: 문맥상 언약적 의미가 강하지만, 히브리어 דָּבָר 자체는 ‘말씀/말’의 넓은 뜻을 가지므로 본문에서 이를 유지했습니다. 주해적으로 읽기 쉬운 ‘약속’은 제거하지 않고 각주로 남겨 원문과 해석 가능성을 함께 드러냈습니다.
  doctrine_reference: '번역 원칙: 원어 우선 및 해석의 긴장 보존'
