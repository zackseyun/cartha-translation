base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
  footnotes:
  - marker: a
    text: Or 'his presence' (literally, 'his face').
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼와 그분의 능력을 찾으십시오. 끊임없이 그분의 얼굴을 찾으십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 임재’(직역하면 ‘그분의 얼굴’).
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  english_pob_choice: Seek
  chosen_korean: 찾으십시오
  alternatives_korean:
  - 구하십시오
  - 찾아보십시오
  lexicon: HALOT
  rationale: דרש의 핵심은 하나님을 적극적으로 추구하고 찾는 행위이므로, 권면문맥에 자연스러운 ‘찾으십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה는 번역어 대체가 아니라 고유한 신명으로 보아, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְעֻזּוֹ
  english_pob_choice: and his strength
  chosen_korean: 그의 힘
  alternatives_korean:
  - 그의 능력
  - 그의 강함
  lexicon: HALOT
  rationale: עֹז는 여기서 하나님의 능력/힘을 뜻하므로, 현대 한국어에서 직접적이고 자연스러운 ‘힘’이 가장 잘 대응합니다.
- source_word: פָנָיו
  english_pob_choice: his face
  chosen_korean: 그의 얼굴
  alternatives_korean:
  - 그의 임재
  - 그의 앞
  lexicon: HALOT
  rationale: 문자적으로는 ‘얼굴’이지만, 본문이 유지하는 시적·관계적 이미지를 살리기 위해 본문에는 직역을 두고, 해석적 의미는 각주로 보완했습니다.
theological_decisions:
- issue: פָנָיו의 의미 범위
  chosen_reading: 본문은 ‘그의 얼굴’을 유지하고, 각주로 ‘임재’ 가능성을 밝힙니다.
  alternative_readings:
  - 그의 임재
  - 그의 앞
  rationale: 히브리어 관용구는 실제로는 임재를 가리킬 수 있지만, 원문 이미지와 긴장을 지우지 않기 위해 직역을 보존했습니다.
  doctrine_reference: Source-transparency principle; lexical tension preserved
- issue: יהוה의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 신명은 호칭으로 완화하지 않고 고유명사로 드러내는 것이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
