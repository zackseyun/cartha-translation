  naturalness: 초안의 ‘이는 그날그날의 요구에 따른 일이었습니다’는 앞 절의 목적 구문을 독립적인 설명문으로 바꾸고 다소 부자연스럽습니다. ‘날마다 정해진 일에 따라 … 섬기도록 하였습니다’가 현대 한국어 합쇼체로 자연스럽고 관계도 정확합니다.
