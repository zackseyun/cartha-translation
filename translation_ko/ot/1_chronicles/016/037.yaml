base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
  footnotes:
  - marker: a
    text: Or 'as each day required'; Hebrew literally, 'according to the matter of a day in its day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 언약궤 앞에 아삽과 그의 형제들을 남겨 두고, 그들이 날마다 정해진 일에 따라 궤 앞에서 계속 섬기도록 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 날이 요구하는 대로’; 히브리어 직역은 ‘그 날에 그 날의 일에 따라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָב
  english_pob_choice: he left
  chosen_korean: 남겨 두어
  alternatives_korean:
  - 두었다
  - 남겨 두었다
  - 배치하였다
  lexicon: HALOT
  rationale: 행정적·조치적 뉘앙스를 살리면서도, 단순한 '떠났다'보다 여기서는 사람들을 특정 장소에 지속적으로 두었다는 뜻이 드러나도록 옮겼습니다.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: before the ark of the covenant of Yahweh
  chosen_korean: 여호와의 언약궤 앞에
  alternatives_korean:
  - 여호와의 언약궤 앞에서
  - 여호와의 언약궤 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי는 공간적으로 '앞에'가 가장 자연스럽고, 언약궤를 중심으로 한 예배적 배치를 보존하기 위해 직역에 가깝게 유지했습니다.
- source_word: לְשָׁרֵת
  english_pob_choice: to minister
  chosen_korean: 섬기게 하였으니
  alternatives_korean:
  - 봉사하게 하였으니
  - 시중들게 하였으니
  - 직무를 맡게 하였으니
  lexicon: HALOT
  rationale: 제의적 봉사의 뜻을 살리되 한국어에서 어색하지 않도록 '섬기다'로 옮겼습니다. '봉사하다'는 의미는 가깝지만 예배 맥락에서 다소 건조할 수 있습니다.
- source_word: תָּמִיד
  english_pob_choice: continually
  chosen_korean: 늘
  alternatives_korean:
  - 항상
  - 끊임없이
  - 계속
  lexicon: HALOT
  rationale: 예배의 지속성을 간결하게 드러내면서, 현대 한국어에서 지나치게 강한 '끊임없이'보다 자연스럽게 읽히도록 했습니다.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: according to each day's requirement
  chosen_korean: 그날그날의 요구에 따른 일
  alternatives_korean:
  - 매일의 필요에 따른 일
  - 각 날의 요구에 따라
  - 그날의 일에 맞게
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻을 살려, 문자 그대로의 '날의 일'보다는 각 날에 필요한 분량·책무를 가리키는 의미가 드러나도록 옮겼습니다.
