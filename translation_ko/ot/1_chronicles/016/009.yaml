  source_fidelity: 세 동사는 모두 복수 명령형으로 정확히 반영되었습니다. לֹו의 반복도 ‘그에게’로 보존되었고, בְּכָל נִפְלְאֹתָיו의 포괄성 및 복수성도 ‘그의 모든 놀라운 일들’에 반영되었습니다. 다만 שִׂיחוּ בְּ…는 여기서 ‘…을 전하십시오’보다 ‘…을 말하다/이야기하다’가 원문의 발화·언급 의미와 결합 방식에 더 직접적으로 համապատ합니다.
  naturalness: ‘그의 모든 놀라운 일들을 전하십시오’는 목적어만 있고 전달 대상이나 매체가 제시되지 않아 현대 한국어에서는 다소 어색하고 의미가 ‘선포하다’ 쪽으로 좁아질 수 있습니다. ‘이야기하십시오’는 공적 권면 문맥의 외적 발화를 자연스럽게 표현하면서도 원문의 의미 범위를 유지합니다. 나머지 두 문장은 합쇼체 명령으로 자연스럽습니다.
  terminology: ‘찬송을 부르십시오’는 זמר의 음악적·찬양적 의미를 적절히 살립니다. ‘놀라운 일들’도 נִפְלְאֹתָיו의 경이로운 행위를 평이하고 현대적인 한국어로 전달합니다. 신학적으로 과도하게 특정 전통의 용어를 강요하지 않습니다.
