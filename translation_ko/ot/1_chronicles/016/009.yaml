translation:
  language: ko
  text: 그에게 노래하십시오. 그에게 찬송을 부르십시오. 그의 모든 놀라운 일들을 이야기하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 놀라운 일들을 말하십시오’ 혹은 ‘그의 모든 놀라운 일들을 묵상하십시오’로도 옮길 수 있습니다. 히브리어 동사는 말로 이야기하는 뜻과 묵상하는 뜻을 모두 지닐 수 있으나, 여기서는 공적 권면의 문맥상 외적으로 말하는 뜻이 더 적절합니다.
    reason: lexical_alternative
