base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
  footnotes:
  - marker: a
    text: Or 'tell of all his wonders' or 'meditate on all his wondrous deeds.' The Hebrew verb can carry either spoken or reflective nuance, though the public exhortation context favors an outward verbal sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 노래하십시오. 그에게 찬송을 부르십시오. 그의 모든 놀라운 일들을 전하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 놀라운 일들을 말하십시오’ 혹은 ‘그의 모든 놀라운 일들을 묵상하십시오’로도 옮길 수 있습니다. 히브리어 동사는 말로 전하는 뜻과 묵상하는 뜻을 모두 지닐 수 있으나, 여기서는 공적 권면의 문맥상 외적으로 말하는 뜻이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  english_pob_choice: Sing
  chosen_korean: 노래하십시오
  alternatives_korean:
  - 부르십시오
  - 노래하라
  lexicon: HALOT
  rationale: 히브리어 שׁיר의 기본 뜻은 노래하다이므로, 직접적이고 자연스러운 명령형으로 옮겼습니다.
- source_word: זַמְּרוּ
  english_pob_choice: sing praises
  chosen_korean: 찬송을 부르십시오
  alternatives_korean:
  - 찬양하십시오
  - 노래하십시오
  - 연주하십시오
  lexicon: HALOT
  rationale: זמר의 예배적 뉘앙스를 살리면서 앞의 ‘노래하십시오’와 구별되도록 ‘찬송을 부르다’로 옮겼습니다.
- source_word: שִׂיחוּ
  english_pob_choice: speak of
  chosen_korean: 전하십시오
  alternatives_korean:
  - 말하십시오
  - 이야기하십시오
  - 전해 주십시오
  lexicon: HALOT
  rationale: 공적 권면의 문맥에서 שׂיח는 단순 묵상보다 말로 알리고 전하는 뜻이 더 자연스러워, ‘전하십시오’로 옮겼습니다.
- source_word: נִפְלְאֹתָיו
  english_pob_choice: his wondrous deeds
  chosen_korean: 그의 모든 놀라운 일들
  alternatives_korean:
  - 그의 모든 놀라운 행적
  - 그의 모든 기이한 일들
  - 그의 모든 경이로운 일들
  lexicon: HALOT
  rationale: פלא 계열의 의미인 경이로움과 실제 행위를 함께 살리기 위해 ‘놀라운 일들’로 옮겼고, כל의 포괄성을 ‘모든’으로 반영했습니다.
theological_decisions:
- issue: 공적 예배 권면의 어조
  chosen_reading: 명령형을 유지해 회중에게 하나님을 향한 공개적 찬양과 선포를 촉구하는 표현으로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화하는 번역
  - 묵상 중심으로 옮기는 번역
  rationale: 이 절은 노래, 찬송, 선포의 연속 명령으로 이루어져 있어, 공적 예배의 외적 행위를 분명히 드러내는 것이 본문 의도에 부합합니다.
  doctrine_reference: 예배와 증언의 공적 성격
