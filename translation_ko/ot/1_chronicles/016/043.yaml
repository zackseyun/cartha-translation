  text: וַ/יֵּלְכ֥וּ כָל הָ/עָ֖ם אִ֣ישׁ לְ/בֵית֑/וֹ וַ/יִּסֹּ֥ב דָּוִ֖יד לְ/בָרֵ֥ךְ אֶת בֵּיתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
  footnotes:
  - marker: a
    text: Or 'his house.' The Hebrew word can refer either to the physical house or to the household/family associated with it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모든 백성이 각자 자기 집으로 갔고, 다윗은 자기 집안을 축복하려고 돌아섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘집’은 여기서 건물뿐 아니라 가족과 가정 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 온 회중
  - 모든 사람들
  lexicon: HALOT
  rationale: עם의 기본 의미를 따라 공동체 전체를 가리키되, 이 장면의 문맥상 ‘회중’보다 중립적인 ‘백성’이 더 자연스럽습니다.
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각자
  alternatives_korean:
  - 각 사람
  - 각 남자
  lexicon: HALOT
  rationale: 분배적 용법을 살리면서도 한국어에서는 성별 표지가 불필요하게 전면화되지 않도록 ‘각자’로 옮겼습니다.
- source_word: לְבֵיתוֹ
  english_pob_choice: to his house
  chosen_korean: 자기 집으로
  alternatives_korean:
  - 자기 집으로 돌아가
  - 자기 집에
  lexicon: HALOT
  rationale: 히브리어의 직선적인 이동 표현을 살려 ‘집으로’로 옮겼고, 문맥상 각자의 거처를 뜻하는 자연스러운 한국어로 처리했습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his household
  chosen_korean: 자기 집안
  alternatives_korean:
  - 자기 집
  - 자기 가정
  lexicon: HALOT
  rationale: 마지막 בַּיִת은 건물보다 가정 구성원을 포함한 घरेल적 영역을 가리키므로, 영어의 ‘household’에 맞춰 ‘집안’으로 옮겼습니다.
- source_word: וַיִּסֹּב לְבָרֵךְ
  english_pob_choice: turned to bless
  chosen_korean: 축복하려고 돌아섰습니다
  alternatives_korean:
  - 축복하려고 몸을 돌렸습니다
  - 축복하려고 향했습니다
  lexicon: HALOT
  rationale: סבב의 기본 동작인 ‘돌다/돌아서다’를 살리되, 목적 표현 לְבָרֵךְ는 결과보다 의도를 드러내는 ‘축복하려고’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 다윗의 행위가 단순한 인사인지, 제의적 축복인지
  chosen_reading: 다윗이 자기 집안을 향해 실제로 축복 행위를 하려는 것으로 옮겼습니다.
  alternative_readings:
  - 가정에 인사를 하려는 정도로 완화
  - ‘축복하다’를 ‘복을 빌다’로 약화
  rationale: 브라크의 목적 부정사와 문맥은 단순한 인사보다 축복 행위를 가리키며, 이를 약화하면 장면의 신학적 무게가 줄어듭니다.
  doctrine_reference: 축복 언어의 실제 효력과 언약적 의미를 보존하는 번역 원칙
