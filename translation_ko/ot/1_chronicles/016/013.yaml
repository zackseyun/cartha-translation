  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
  footnotes:
  - marker: a
    text: Or 'seed of Israel'; the Hebrew uses a collective singular for descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'children of Jacob'; Hebrew literally 'sons of Jacob.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his elect.'
