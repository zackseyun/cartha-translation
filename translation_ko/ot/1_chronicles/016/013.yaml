  rationale: 수식 관계를 드러내도록 ‘그의 종’을 ‘이스라엘’ 앞에, ‘그의 택하신’을 ‘야곱의 자손들’ 앞에 두었습니다. 이는 원문의 어순을 기계적으로 따르기보다 히브리어 소유격 접미사의 지시 관계와 병렬 호격을 한국어에서 정확하고 자연스럽게 재현합니다. ‘후손들/자손들’은 זֶרַע의 집합적 의미와 בְּנֵי의 혈통 공동체 용법을 보존하며, 각주는 해당 표현에 직접 연결했습니다.
