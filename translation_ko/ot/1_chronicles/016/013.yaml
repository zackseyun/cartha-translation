  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
  footnotes:
  - marker: a
    text: Or 'seed of Israel'; the Hebrew uses a collective singular for descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'children of Jacob'; Hebrew literally 'sons of Jacob.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his elect.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이스라엘의 자손들, 그의 종이요

    야곱의 자손들, 그의 택하신 자들아.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 집합적 단수로 ‘씨/후손’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야곱의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 택함을 받은 자들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  english_pob_choice: offspring
  chosen_korean: 자손들
  alternatives_korean:
  - 씨
  - 후손들
  lexicon: HALOT
  rationale: 집합적 단수로 쓰인 posterity의 뜻을 자연스러운 현대 한국어로 옮기되, 단순한 식물성 ‘씨’보다 사람의 후손을 분명히 드러내기 위해 ‘자손들’을 택했습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 노예
  lexicon: HALOT
  rationale: 여기서는 이스라엘이 야훼께 속한 언약적 호칭이므로 사회적 예속을 강하게 띠는 ‘노예’보다 관계적·호칭적 의미를 살린 ‘종’이 더 적절합니다.
- source_word: בְּנֵי יַעֲקֹב
  english_pob_choice: sons of Jacob
  chosen_korean: 야곱의 자손들
  alternatives_korean:
  - 야곱의 아들들
  - 야곱의 자녀들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘야곱의 아들들’이지만, 한국어 성경 문맥에서는 혈통적 공동체 전체를 가리키는 관용을 살려 ‘자손들’로 옮기는 것이 더 자연스럽습니다.
- source_word: בְּחִירָיו
  english_pob_choice: his chosen ones
  chosen_korean: 그의 택하신 자들
  alternatives_korean:
  - 그의 택함을 받은 자들
  - 그의 선택된 자들
  lexicon: HALOT
  rationale: plural noun의 복수성을 살리면서도, 동사적 뉘앙스가 있는 ‘택하신’으로 옮겨 선택 행위의 결과를 분명히 했습니다.
theological_decisions:
- issue: 3인칭 소유격 ‘his’의 지시 대상
  chosen_reading: ‘그의’는 하나님을 가리키며, 이스라엘과 야곱의 공동체가 하나님께 속한 종이자 택하신 자들로 제시됩니다.
  alternative_readings:
  - 시적 병렬 속에서 더 느슨한 지시로 읽을 수 있으나, 문맥상 하나님 소유를 가리키는 것이 자연스럽습니다.
  rationale: 문맥상 여호와의 행하심을 기억하라는 소환 속에서 공동체 정체성을 규정하는 표현이므로, 소유격을 그대로 살려 신학적 긴장을 흐리지 않았습니다.
  doctrine_reference: 언약 백성의 선택과 소속
- issue: ‘זרע’의 집합적 단수 처리
  chosen_reading: 집합적 단수의 의미를 한국어 복수형 ‘자손들’로 풀어 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘씨’로 직역할 수 있으나 한국어에서 오해를 부를 수 있습니다.
  rationale: 원문은 후손 전체를 가리키는 집합 표현이므로, 의미를 보존하면서도 오해를 줄이는 쪽을 택했습니다.
  doctrine_reference: 집합 명사의 번역
