base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
  footnotes:
  - marker: a
    text: Or 'in the instruction of the LORD' for 'in the law of the LORD'; Hebrew torah can mean both 'law' and 'instruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 번제단 위에서 아침과 저녁으로 항상 야훼께 번제물을 드리고, 야훼의 율법에 기록된 모든 것대로, 곧 그가 이스라엘에게 명령하신 대로 하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 율법’ 대신 ‘야훼의 가르침’으로도 옮길 수 있습니다. 히브리어 토라는 ‘율법’과 ‘가르침’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת עֹלוֹת
  english_pob_choice: to offer burnt offerings
  chosen_korean: 번제물을 드리고
  alternatives_korean:
  - 번제물을 바치고
  - 번제물을 올리고
  lexicon: HALOT
  rationale: 제의적 문맥에서 히필 형태의 ‘올리다’는 제물을 드리다/바치다의 의미로 굳어져 있으므로, 현대 한국어에서 자연스럽고 소스 의미를 보존하는 ‘드리고’를 선택했습니다.
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단 위에서
  alternatives_korean:
  - 번제단에서
  - 번제제단에서
  lexicon: HALOT
  rationale: 히브리어는 특정 번제용 제단을 가리키므로, 한국어로는 직역어보다 기능을 드러내는 ‘번제단’이 더 분명합니다. 위치 관계는 ‘위에서’로 자연스럽게 살렸습니다.
- source_word: תָּמִיד לַבֹּקֶר וְלָעָרֶב
  english_pob_choice: continually, morning and evening
  chosen_korean: 아침과 저녁으로 항상
  alternatives_korean:
  - 항상 아침과 저녁으로
  - 계속하여 아침과 저녁에
  lexicon: HALOT
  rationale: תָּמִיד의 규칙적·지속적 성격을 ‘항상’으로, 이어지는 시간 부사를 ‘아침과 저녁으로’로 옮겨 제의의 일상적 반복을 드러냈습니다.
- source_word: בְּתוֹרַת יְהוָה
  english_pob_choice: the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 가르침
  - 야훼의 토라
  lexicon: HALOT
  rationale: 토라에는 ‘율법/가르침’의 범위가 있으나, 여기서는 제의와 규범을 포함한 성문 규정을 가리키므로 일반 독자에게 명료한 ‘율법’을 택했습니다.
theological_decisions:
