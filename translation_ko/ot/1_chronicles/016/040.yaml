  - 주님
  rationale: 본문에 직접 나타난 야훼의 고유명을 보존하기 위해 전통적 대체어 대신 ‘야훼’를 사용했습니다. 이는 본문이 강조하는 언약적 명칭을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
