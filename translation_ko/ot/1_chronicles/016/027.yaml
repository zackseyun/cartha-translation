  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
  footnotes:
  - marker: a
    text: Or 'in his dwelling place' or 'in his sanctuary.' The Hebrew says 'in his place,' a broader expression than the parallel wording in Psalm 96:6.
    reason: alternative_reading
translation:
  language: ko
  text: 존귀와 위엄이 그분 앞에 있으며[a], 능력과 기쁨은 그분의 처소에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 거처에’ 혹은 ‘그분의 성소에’. 히브리어는 더 넓은 표현인 ‘그분의 곳/처소에’라고 말합니다. 시편 96:6의 평행 구절보다 범위가 넓습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  english_pob_choice: splendor
  chosen_korean: 존귀
  alternatives_korean:
  - 영광
  - 화려함
  - 광채
  lexicon: HALOT
  rationale: הוֹד는 장엄하고 품위 있는 빛남을 가리키므로, 시적 병행 속에서 הָדָר와 겹치지 않도록 ‘존귀’로 옮겼습니다.
- source_word: הָדָר
  english_pob_choice: majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 존엄
  - 장엄함
  - 영광
  lexicon: HALOT
  rationale: הָדָר는 왕적·장엄한 품위를 뜻하므로, 앞의 ‘존귀’와 짝을 이루는 ‘위엄’이 가장 자연스럽습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그분 앞에
  alternatives_korean:
  - 그분의 앞에
  - 그분의 면전에서
  lexicon: HALOT
  rationale: 직역하면 ‘그의 앞/얼굴 앞’이지만, 한국어에서는 ‘그분 앞에’가 공간적·관계적 의미를 자연스럽게 살립니다.
- source_word: בִּמְקֹמוֹ
  english_pob_choice: in his place
  chosen_korean: 그분의 처소에
  alternatives_korean:
  - 그분의 장소에
  - 그분의 거처에
  - 그분의 성소에
  lexicon: HALOT
  rationale: 히브리어는 넓은 의미의 ‘곳/자리’이므로 본문을 넓게 살리면서도 예배 맥락을 고려해 ‘처소’로 옮겼습니다.
theological_decisions:
- issue: מְקוֹמוֹ를 성소로 좁혀 읽을지 여부
  chosen_reading: 본문은 넓은 의미의 ‘그분의 처소’로 유지했습니다.
  alternative_readings:
  - 그분의 성소
  - 그분의 거처
  rationale: 열왕기/역대기 문맥은 예배적이지만, 역대상 본문은 시편 96:6의 ‘성소’와 달리 ‘그의 מקום’이라고 말하므로, 조화시키지 않고 열린 의미를 보존했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; preserve source-level nuance.'
