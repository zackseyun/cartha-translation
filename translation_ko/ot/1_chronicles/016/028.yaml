lexical_decisions:
- source_word: הָבוּ
  english_pob_choice: Ascribe
  chosen_korean: 돌리십시오
  alternatives_korean:
  - 드리십시오
  - 돌려드리십시오
  - 인정하십시오
  lexicon: HALOT
  rationale: 제의적·찬양적 명령문에서 הָבוּ는 무언가를 실제로 이동시키기보다 야훼께 마땅한 것을 인정하여 돌리는 뜻이므로, 합쇼체에서 자연스러운 ‘돌리십시오’로 옮겼습니다.
- source_word: מִשְׁפְּחוֹת עַמִּים
  english_pob_choice: families of the peoples
  chosen_korean: 만민의 가족들
  alternatives_korean:
  - 민족들의 가족들
  - 백성들의 족속들
  - 민족들의 족속들
  lexicon: HALOT
  rationale: מִשְׁפְּחוֹת는 ‘가족/족속’ 계열의 친족 단위를, עַמִּים은 복수의 ‘백성들/민족들’을 가리키므로, 보편적 초청을 살리면서도 현대 한국어로 자연스럽게 ‘만민의 가족들’로 옮겼습니다.
- source_word: כָּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명예
  - 존귀
  lexicon: HALOT
  rationale: 찬양문맥의 כָּבוֹד는 ‘영광’이 가장 직접적이고 관용적인 대응이므로 그대로 살렸습니다.
- source_word: וָעֹז
  english_pob_choice: and strength
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 능력
  - 권능
  lexicon: HALOT
  rationale: עֹז는 ‘힘/강함’의 뜻이므로, ‘영광’과 병렬되는 하나님의 속성을 간결하게 드러내는 ‘힘’으로 번역했습니다.
theological_decisions:
