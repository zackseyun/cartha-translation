source:
  edition: WLC
  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
  footnotes:
  - marker: a
    text: Or 'throughout all the land,' if אֶרֶץ is taken in a more localized sense; here 'earth' is preferred because the context emphasizes the LORD's worldwide rule.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew divine name is YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 야훼[b], 우리의 하나님이십니다. 그분의 심판은 온 땅에[a] 미칩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 지역에’. 히브리어 에레츠는 문맥에 따라 ‘땅’, ‘나라’, 또는 ‘지역’을 뜻할 수 있습니다. 여기서는 문맥의 보편적 범위를 따라 ‘온 땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 하나님의 이름은 YHWH입니다. 한국어 성경에서는 전통적으로 ‘여호와’로, 영어 성경에서는 흔히 ‘the LORD’로 대체하여 옮기지만, 여기서는 고유 이름을 따라 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  english_pob_choice: He is
  chosen_korean: 그분은 …이십니다
  alternatives_korean:
  - 그분은 …입니다
  - 그는 …입니다
  lexicon: HALOT
  rationale: 독립 인칭대명사 הוּא의 강조를 살리기 위해 주어를 분명히 두고, 한국어는 자연스럽게 서술격을 보충해 합쇼체로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공동체적 관용어인 ‘주님’ 대신, 본문이 직접 가리키는 신명사 טetragrammaton을 음역한 ‘야훼’를 사용해 이름 자체를 보존했습니다.
- source_word: מִשְׁפָּטָיו
  english_pob_choice: his judgments
  chosen_korean: 그분의 심판
  alternatives_korean:
  - 그분의 판단
  - 그분의 공의
  - 그분의 규례
  lexicon: HALOT
  rationale: מִשְׁפָּט은 문맥상 하나님의 통치적 판결과 न्याय/심판을 가리키므로, 추상적 ‘공의’나 규례적 ‘법도’보다 ‘심판’이 형태와 의미를 함께 살립니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 땅 가운데
  - 온 세상에
  - 온 땅 전역에
  lexicon: HALOT
  rationale: אֶרֶץ를 이 문맥의 보편적 범위로 읽어 ‘땅/세상’의 포괄성을 유지했고, 한국어에서는 간결한 ‘온 땅에’가 자연스럽습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유 이름을 직접 사용하므로, 제목형 대체어보다 이름 자체를 드러내는 번역이 더 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מִשְׁפָּטָיו의 신학적 뉘앙스
  chosen_reading: 심판
  alternative_readings:
  - 공의
  - 법도
  - 판결
  rationale: 이 절은 야훼의 통치가 온 땅에 미친다는 선언이므로, 단순한 윤리적 ‘공의’보다 왕권적·재판적 의미의 ‘심판’이 본문의 힘을 더 정확히 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
