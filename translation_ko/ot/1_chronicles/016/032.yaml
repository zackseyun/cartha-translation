source:
  edition: WLC
  text: יִרְעַ֤ם הַ/יָּם֙ וּ/מְלוֹא֔/וֹ יַעֲלֹ֥ץ הַ/שָּׂדֶ֖ה וְ/כָל אֲשֶׁר בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
  footnotes:
  - marker: a
    text: Or 'Let the sea roar.' The Hebrew verb can denote a loud rumbling or roaring sound.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'its fullness'; that is, everything that fills the sea.
    reason: lexical_alternative
translation:
  language: ko
  text: 바다가 우레를 치게 하며, 그 가운데 있는 모든 것이; 들이 기뻐 뛰게 하며, 그 안에 있는 모든 것이.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다가 울부짖게 하라’로 옮길 수 있습니다. 히브리어 동사는 큰 우르릉거림이나 울부짖는 소리를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 충만함’입니다. 곧 바다를 가득 채우는 모든 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  english_pob_choice: thunder
  chosen_korean: 우레를 치게 하다
  alternatives_korean:
  - 울부짖게 하다
  - 소리를 내게 하다
  lexicon: HALOT
  rationale: רעם의 강한 굉음·천둥 이미지를 살려 ‘우레를 치다’로 옮기면 시적 힘이 유지되며, 바다를 주어로 둘 때도 자연스럽습니다.
- source_word: וּמְלוֹאוֹ
  english_pob_choice: all that fills it
  chosen_korean: 그 가운데 있는 모든 것
  alternatives_korean:
  - 그 충만함
  - 그 안에 가득한 모든 것
  lexicon: HALOT
  rationale: 직역의 ‘충만함’보다 현재 한국어 독자에게는 ‘가운데 있는 모든 것’이 바다를 채우는 것들을 분명하게 전달합니다.
- source_word: יַעֲלֹץ
  english_pob_choice: exult
  chosen_korean: 기뻐 뛰게 하다
  alternatives_korean:
  - 즐거워하게 하다
  - 환호하게 하다
  lexicon: HALOT
  rationale: עלץ의 들뜬 기쁨과 환희를 단순한 ‘기뻐하다’보다 강하게 살리기 위해 동사구로 옮겼습니다.
- source_word: וְכָל אֲשֶׁר בּוֹ
  english_pob_choice: and all that is in it
  chosen_korean: 그 안에 있는 모든 것
  alternatives_korean:
  - 그 속에 있는 모든 것
  - 거기에 있는 모든 것
  lexicon: HALOT
  rationale: 앞의 ‘들’에 대한 관계절로서 포괄성을 유지하면서도 한국어 문장으로 자연스럽게 연결되게 했습니다.
theological_decisions:
- issue: 시적 병행에서 자연물 전체를 의인화하는 방식
  chosen_reading: 바다와 들을 각각 능동적으로 환호하는 피조물로 번역했습니다.
  alternative_readings:
  - 자연스럽게 소리가 나게 하다로 완화하는 번역
  - 단순한 서술형으로 바꾸는 번역
  rationale: 본문은 창조 세계가 야훼를 찬양하는 장면을 의인화로 표현하므로, 그 역동성을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 시편적 창조 찬양의 의인화
