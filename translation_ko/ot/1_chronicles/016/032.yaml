  text: 바다와 그 안에 가득한 모든 것이 우레를 치게 하시고[a][b], 들과 그 안에 있는 모든 것이 기뻐 뛰게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다가 울부짖게 하라’로 옮길 수 있습니다. 히브리어 동사는 큰 우르릉거림이나 울부짖는 소리를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 충만함’입니다. 곧 바다를 가득 채우는 모든 것을 뜻합니다.
    reason: lexical_alternative
