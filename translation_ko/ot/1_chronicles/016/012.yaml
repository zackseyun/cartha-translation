lexical_decisions:
- source_word: זִכְרוּ
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 기억하라
  lexicon: HALOT
  rationale: 복수 명령형의 촉구를 현대 합쇼체로 자연스럽게 옮기되, 단순 회상이 아니라 의도적 소환의 뉘앙스를 살렸습니다.
- source_word: נִפְלְאֹתָיו
  english_pob_choice: his wondrous deeds
  chosen_korean: 그의 놀라운 일들
  alternatives_korean:
  - 그의 경이로운 행위들
  - 그의 놀라운 행적들
  lexicon: HALOT
  rationale: פלאות는 단순한 '놀라움'보다 하나님이 행하신 경이로운 일들을 가리키므로, 행위성을 살린 '일들'을 택했습니다.
- source_word: מֹפְתָיו
  english_pob_choice: his signs
  chosen_korean: 그의 표적들
  alternatives_korean:
  - 그의 징조들
  - 그의 이적들
  lexicon: HALOT
  rationale: מופת는 하나님 권능을 증언하는 표지/징표의 성격이 강해, 전통적이면서도 본문 의미를 드러내는 '표적들'로 옮겼습니다.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  english_pob_choice: and the judgments of his mouth
  chosen_korean: 그의 입의 심판들
  alternatives_korean:
  - 그의 입의 판결들
  - 그의 입에서 나온 법규들
  lexicon: HALOT
  rationale: משפט는 문맥상 선언된 판결과 규범적 판정을 함께 포괄할 수 있어, 직역을 유지하면서도 한국어에서 자연스러운 '심판들'을 택했습니다.
theological_decisions:
- issue: 세 개의 병렬 항목을 한국어에서 어떻게 구분할지
  chosen_reading: '''놀라운 일들'' / ''표적들'' / ''입의 심판들''로 서로 다른 표현을 유지했습니다.'
  alternative_readings:
  - '''놀라운 일들'' / ''기적들'' / ''입의 규례들'''
  - 세 항목을 모두 '일들'로 평준화
  rationale: 히브리어는 병렬구조 안에서 서로 겹치지만 같은 의미는 아닌 어휘를 사용하므로, 의미를 한 단어로 평준화하지 않고 차이를 보존했습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
