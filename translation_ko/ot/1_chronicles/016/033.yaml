- source_word: הָ/אָֽרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 세상
  - 나라
  lexicon: HALOT
  rationale: 이 시구는 우주적 심판을 말하지만, 히브리어 הָאָרֶץ는 기본적으로 ‘땅/대지’를 가리키므로 한국어에서는 문맥상 넓은 범위를 유지하되 자연스러운 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: בָא의 시적 시제/상에 대한 처리
