  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
  footnotes:
  - marker: a
    text: Or 'will shout for joy.' The Hebrew verb can denote jubilant ringing out, whether sung or shouted.
    reason: lexical_alternative
  - marker: b
    text: Or 'he is coming to judge the earth.' The Hebrew form can express a coming action with vivid certainty in poetic context.
    reason: lexical_alternative
  - marker: c
    text: Or 'the land,' if taken more locally; here the wider cosmic context favors 'the earth.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 숲의 나무들이 야훼 앞에서 기뻐 노래할 것입니다[a]. 그가 땅[c]을 심판하러 오십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기뻐 외칠 것입니다.’ 히브리어 동사는 노래하거나 외치는 듯한 환희의 울림을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 땅을 심판하러 오고 계십니다.’ 히브리어 형태는 시적 문맥에서 임박하거나 확실한 오심을 생생하게 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 땅.’ 더 국지적으로 이해할 수도 있으나, 여기서는 우주적 찬양의 문맥상 ‘땅’이 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְרַנְּנ֖וּ
