id: 1CH.16.33
reference: 1 Chronicles 16:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
  footnotes:
  - marker: a
    text: Or 'will shout for joy.' The Hebrew verb can denote jubilant ringing out, whether sung or shouted.
    reason: lexical_alternative
  - marker: b
    text: Or 'he is coming to judge the earth.' The Hebrew form can express a coming action with vivid certainty in poetic context.
    reason: lexical_alternative
  - marker: c
    text: Or 'the land,' if taken more locally; here the wider cosmic context favors 'the earth.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 숲의 나무들이 야훼 앞에서 기뻐 노래할 것입니다[a][b][c]. 그가 땅을 심판하러 오시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기뻐 외칠 것입니다.’ 히브리어 동사는 노래하듯 울려 퍼지는 환호를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 땅을 심판하러 오고 계십니다.’ 시적 문맥에서는 현재적 확실성을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세상.’ 여기서는 더 넓은 우주적 문맥 때문에 ‘땅’이 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְרַנְּנ֖וּ
  english_pob_choice: will sing for joy
  chosen_korean: 기뻐 노래할 것입니다
  alternatives_korean:
  - 기쁨으로 외칠 것입니다
  - 환호할 것입니다
  - 즐겁게 노래할 것입니다
  lexicon: HALOT
  rationale: 히필/피엘 계열의 רנן은 단순한 기쁨보다 환호성 섞인 즐거운 울림을 뜻하므로, 한국어에서는 ‘기뻐 노래하다’가 시적 성격을 살리면서도 과도하게 평이하지 않습니다.
- source_word: מִ/לִּ/פְנֵ֣י
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 임재 앞에서
  lexicon: HALOT
  rationale: 하나님 임재의 자리에서 벌어지는 행위를 자연스러운 합쇼체로 옮기기 위해 ‘앞에서’로 처리했습니다.
- source_word: יְהוָ֔ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 문서화된 원칙에 따라 신적 고유명사는 대체 호칭이 아니라 음역형 ‘야훼’로 옮겼습니다.
- source_word: הָ/אָֽרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 세상
  - 나라
  lexicon: HALOT
  rationale: 이 시구는 우주적 심판을 말하지만, 히브리어 הָאָרֶץ는 기본적으로 ‘땅/대지’를 가리키므로 한국어에서는 문맥상 넓은 범위를 유지하되 자연스러운 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: בָא의 시적 시제/상에 대한 처리
  chosen_reading: 그가 땅을 심판하러 오시기 때문입니다
  alternative_readings:
  - 그가 땅을 심판하러 오기 때문입니다
  - 그가 땅을 심판하러 오십니다
  rationale: 현재형적 확실성의 뉘앙스를 살리되, 한국어에서는 뒤의 부정사구 ‘심판하러 오시기 때문입니다’가 예언적 확실성을 가장 자연스럽게 전달합니다.
  doctrine_reference: 예언시의 완료/현재형 확실성 표기 원칙
