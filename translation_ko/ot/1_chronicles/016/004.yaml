  naturalness: 현 문장은 ‘기억하게 하고’가 무엇을 기억하게 하는지 드러나지 않아 어색하며, ‘야훼, 이스라엘의 하나님을’도 동격어의 순서와 쉼표 때문에 자연스럽지 않습니다. ‘이스라엘의 하나님 야훼를’로 바로잡고 각 목적 동사를 병렬로 처리하면 현대 한국어 합쇼체 문장으로 자연스럽습니다.
