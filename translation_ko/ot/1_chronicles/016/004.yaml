  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
  footnotes:
  - marker: a
    text: Or 'to commemorate' or 'to make mention.' The Hebrew verb can denote causing remembrance in a liturgical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 언약궤 앞에서 섬기며, 기억하게 하고, 감사하고, 야훼, 이스라엘의 하나님을 찬양하도록 레위 사람들 가운데 일부를 임명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기념하게 하고’, 또는 ‘기억을 불러오게 하고’로도 옮길 수 있습니다. 히브리어 동사는 전례적 맥락에서 기억을 일으키게 하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: He appointed
  chosen_korean: 임명했습니다
  alternatives_korean:
  - 지정했습니다
  - 맡겼습니다
  - 두었습니다
  lexicon: HALOT
  rationale: 관리·직무 배정의 문맥에서 단순한 ‘주다/두다’보다 ‘임명하다’가 대상자들의 예배 직무 배치를 가장 자연스럽게 드러냅니다.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  english_pob_choice: before the ark of Yahweh
  chosen_korean: 야훼의 언약궤 앞에서
  alternatives_korean:
  - 야훼의 궤 앞에서
  - 야훼의 언약궤 앞
  - 주님의 궤 앞에서
  lexicon: HALOT
  rationale: ‘언약궤’는 אַרוֹן의 기능을 분명히 드러내며, לִפְנֵי는 예배적 위치를 나타내는 ‘앞에서’로 옮기는 것이 정확합니다.
- source_word: וּלְהַזְכִּיר
  english_pob_choice: to commemorate
  chosen_korean: 기억하게 하고
  alternatives_korean:
  - 기념하고
  - 상기하게 하고
  - 기억을 불러일으키고
  lexicon: HALOT
  rationale: 이 동사는 단순한 기념이 아니라 예배적 맥락에서 ‘기억나게 함/기억을 불러옴’의 뉘앙스를 가지므로, 한국어에서도 그 동작성을 살린 표현이 적절합니다.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  english_pob_choice: to give thanks, and to praise
  chosen_korean: 감사하고, … 찬양하도록
  alternatives_korean:
  - 감사하고, … 찬미하도록
  - 감사하며, … 찬양하도록
  - 감사하고, … 높이도록
  lexicon: HALOT
  rationale: הוֹדָה와 הִלֵל은 예배적 감사와 찬양의 병렬이므로 각각 ‘감사하다’와 ‘찬양하다’로 직접 옮겼습니다.
