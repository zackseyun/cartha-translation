  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
  footnotes:
  - marker: a
    text: Or 'to commemorate' or 'to make mention.' The Hebrew verb can denote causing remembrance in a liturgical sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 레위 사람들 가운데 일부를 야훼의 언약궤 앞에서 섬기며, 기념하고[a], 감사하며, 이스라엘의 하나님 야훼를 찬양하도록 임명했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기억을 불러일으키고’ 또는 ‘기억하게 하고’로도 옮길 수 있습니다. 히브리어 동사는 전례적 맥락에서 기억을 일으키게 하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: He appointed
  chosen_korean: 임명했습니다
  alternatives_korean:
  - 지정했습니다
  - 맡겼습니다
  - 두었습니다
  lexicon: HALOT
