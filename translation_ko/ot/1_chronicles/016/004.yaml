- source_word: לִפְנֵי אֲרוֹן יְהוָה
  english_pob_choice: before the ark of Yahweh
  chosen_korean: 야훼의 언약궤 앞에서
  alternatives_korean:
  - 야훼의 궤 앞에서
  - 야훼의 언약궤 앞
  - 주님의 궤 앞에서
  lexicon: HALOT
  rationale: ‘언약궤’는 אַרוֹן의 기능을 분명히 드러내며, לִפְנֵי는 예배적 위치를 나타내는 ‘앞에서’로 옮기는 것이 정확합니다.
- source_word: וּלְהַזְכִּיר
  english_pob_choice: to commemorate
  chosen_korean: 기억하게 하고
  alternatives_korean:
  - 기념하고
  - 상기하게 하고
  - 기억을 불러일으키고
  lexicon: HALOT
  rationale: 이 동사는 단순한 기념이 아니라 예배적 맥락에서 ‘기억나게 함/기억을 불러옴’의 뉘앙스를 가지므로, 한국어에서도 그 동작성을 살린 표현이 적절합니다.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  english_pob_choice: to give thanks, and to praise
  chosen_korean: 감사하고, … 찬양하도록
  alternatives_korean:
  - 감사하고, … 찬미하도록
  - 감사하며, … 찬양하도록
  - 감사하고, … 높이도록
  lexicon: HALOT
  rationale: הוֹדָה와 הִלֵל은 예배적 감사와 찬양의 병렬이므로 각각 ‘감사하다’와 ‘찬양하다’로 직접 옮겼습니다.
