id: 1CH.16.23
reference: 1 Chronicles 16:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to Yahweh.'' The divine name יְהוָה is rendered ''the LORD'' in keeping with the project''s default practice.'
    reason: alternative_reading
  - marker: b
    text: Or 'announce good news of his salvation day after day.' The verb carries the sense of bringing or proclaiming good news.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅이여, 야훼께 노래하십시오. 날마다 그의 구원을 선포하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁירוּ
  english_pob_choice: Sing
  chosen_korean: 노래하십시오
  alternatives_korean:
  - 찬양하십시오
  - 노래를 부르십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 שׁיר의 직접적 의미를 살려, 해석을 덧붙이지 않고 자연스러운 합쇼체 명령으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 원문에 나온 신성표현 יהוה를 프로젝트 기본값대로 ‘야훼’로 옮기고, 여격을 ‘-께’로 처리했습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅이여
  alternatives_korean:
  - 모든 땅이여
  - 온 세상이여
  lexicon: HALOT
  rationale: 호명형의 시적 울림을 살리면서, ‘all the earth’의 보편적 초청을 한국어로 자연스럽게 드러냈습니다.
- source_word: בַּשְּׂרוּ
  english_pob_choice: proclaim
  chosen_korean: 선포하십시오
  alternatives_korean:
  - 복음을 전하십시오
  - 좋은 소식을 알리십시오
  lexicon: HALOT
  rationale: בשׂר의 ‘기쁜 소식을 전하다’라는 뜻을 반영하되, 시문맥에서 간결한 공적 선포의 뉘앙스를 살려 ‘선포하다’로 옮겼습니다.
- source_word: מִיּוֹם אֶל יוֹם
  english_pob_choice: from day to day
  chosen_korean: 날마다
  alternatives_korean:
  - 날마다 계속하여
  - 하루하루
  lexicon: HALOT
  rationale: 반복성과 지속성을 가장 간결하게 전달하는 한국어 관용 표현을 택했습니다.
- source_word: יְשׁוּעָתוֹ
  english_pob_choice: his salvation
  chosen_korean: 그의 구원
  alternatives_korean:
  - 그의 구원의 소식
  - 그의 구원하심
  lexicon: HALOT
  rationale: יְשׁוּעָה의 핵심 의미를 따라 ‘구원’으로 옮겼고, 소유격 대명사를 그대로 반영했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 원문이 תְּטְרַגְרָמָטוֹן יהוה를 직접 사용하므로, 프로젝트 기본 규범에 따라 고유 신명인 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
