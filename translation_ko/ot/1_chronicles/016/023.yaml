  source_fidelity: 히브리어의 복수 명령형 두 개(‘노래하라’, ‘기쁜 소식을 전하라’)와 호명구 ‘온 땅’, 그리고 지속 표현 ‘날마다’를 충실히 반영합니다. יְשׁוּעָתוֹ의 소유격과 ‘구원’의 폭넓은 의미도 보존합니다.
  naturalness: “온 땅이여”라는 시적 호명과 합쇼체 명령형 “노래하십시오/선포하십시오”의 결합은 예배시 문맥에서 자연스럽고 일관됩니다. “날마다”도 מִיּוֹם אֶל יוֹם의 반복성을 간결하게 전달합니다.
  terminology: יהוה를 프로젝트 규범에 따라 “야훼”로 옮겼으며, יְשׁוּעָה는 교파적 의미를 덧붙이지 않은 “구원”으로 적절히 번역했습니다. בשׂר의 좋은 소식 전달 의미는 “선포하십시오”로 무리 없이 포괄됩니다.
