translation:
  language: ko
  text: 그는 이스라엘의 모든 사람에게, 곧 남자에서 여자에 이르기까지, 각 사람에게 빵 한 덩이와 고기 한 몫과 건포도 떡 하나씩 나누어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶשְׁפָּר는 희귀어라 뜻이 분명하지 않으며, 많은 해석은 여기서 고기 한 몫으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
