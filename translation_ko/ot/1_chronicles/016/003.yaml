  rationale: 본문은 distributive אִישׁ와 ‘남자에서 여자’라는 관용구를 함께 사용하므로, 둘 다 살려야 원문의 포괄성과 대비가 보존됩니다.
  doctrine_reference: 문맥적/해석학적 일관성
