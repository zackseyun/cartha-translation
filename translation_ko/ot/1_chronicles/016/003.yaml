  rationale: 전통적으로 건포도 떡으로 이해되는 항목이므로, 현대 한국어에서 가장 직관적인 ‘건포도 떡’으로 옮겼습니다.
theological_decisions:
- issue: רַב-수혜자 범위의 표현과 성별 포괄성
  chosen_reading: ‘이스라엘의 모든 사람에게… 남자에서 여자에 이르기까지’로 옮겨, 수혜 범위의 포괄성과 원문의 성별 대비를 함께 유지했습니다.
  alternative_readings:
  - ‘이스라엘 모든 남자에게’
