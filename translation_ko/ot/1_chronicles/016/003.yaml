translation:
  language: ko
  text: 그는 이스라엘의 모든 사람, 곧 남자부터 여자까지 각 사람에게 빵 한 덩이와 고기 한몫과 건포도 떡 하나를 나누어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶשְׁפָּר는 드물게 나오는 말로 정확한 뜻이 확실하지 않습니다. ‘한 몫’ 또는 다른 음식물을 뜻할 수 있으며, 많은 해석은 여기서 고기 한몫으로 이해합니다.
    reason: lexical_alternative
