    rationale: 현 표지는 ‘이름’ 뒤에 있으나, 각주의 내용은 본문에 명시된 יהוה/‘야훼’의 표기에 관한 것입니다. ‘야훼’ 뒤에 두어 지시 대상을 분명히 하는 것이 좋습니다.
  revised_text: 그의 거룩한 이름으로 자랑하십시오. 야훼[a]를 찾는 이들의 마음이 기뻐하기를 바랍니다.
