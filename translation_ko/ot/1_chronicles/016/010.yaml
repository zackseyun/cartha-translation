  source_fidelity: 첫 절의 ‘그의 거룩한 이름으로 자랑하십시오’는 히브리어 בְּ(‘~으로/안에서’)와 히트파엘 명령형의 의미를 대체로 충실히 반영합니다. 그러나 둘째 절의 יִשְׂמַח는 시적·권유적 용법의 ‘기뻐하기를 바란다/기뻐하게 하라’가 아니라, 마음을 어떤 이가 기쁘게 ‘만들라’는 사역 명령으로 옮겨져 의미가 바뀌었습니다.
  naturalness: ‘마음이 기뻐하기를 바랍니다’는 현대 표준어 합쇼체에서 시적 권유·소망을 자연스럽게 표현합니다. 또한 각주 표지는 신명 야훼가 실제로 나오는 곳에 두는 편이 독자에게 명확합니다.
  terminology: ‘야훼’는 제시된 POB 표기 원칙 및 히브리어 יהוה에 일치합니다. ‘거룩한 이름’도 적절합니다.
