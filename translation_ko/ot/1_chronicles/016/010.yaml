    reason: ot_citation
lexical_decisions:
- source_word: הִתְהַלְלוּ
  english_pob_choice: Boast
  chosen_korean: 자랑하십시오
  alternatives_korean:
  - 영광을 돌리십시오
  - 기뻐 뛰십시오
  lexicon: HALOT
  rationale: 히트파엘 명령형 복수로서 ‘자랑하다/자부하다’의 뉘앙스가 강하므로, 대상 안에서의 적극적 찬양을 살리는 ‘자랑하십시오’가 가장 가깝습니다.
- source_word: בְּשֵׁם קָדְשׁוֹ
  english_pob_choice: in his holy name
  chosen_korean: 그의 거룩한 이름으로
  alternatives_korean:
  - 그의 거룩한 이름 안에서
  - 그의 거룩한 이름에 대하여
  lexicon: HALOT
  rationale: בְּשֵׁם은 보통 ‘~으로/안에서’의 영역·근거를 나타내며, כאן에서는 이름을 자랑의 근거로 삼는 뜻이므로 ‘그의 거룩한 이름으로’가 자연스럽고 원문 구조도 드러냅니다.
- source_word: מְבַקְשֵׁי יְהוָה
  english_pob_choice: those who seek Yahweh
  chosen_korean: 야훼를 찾는 이들
  alternatives_korean:
  - 야훼를 구하는 사람들
  - 야훼를 찾는 자들
  lexicon: HALOT
  rationale: פעל사 현재분사 복수의 지속적 성격을 살려 ‘찾는 이들’로 옮겼고, יְהוָה는 본문의 고유명으로 POB 기준에 따라 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: יהוה(테트라그람마톤) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문이 하나님의 고유명 יְהוָה를 직접 사용하므로, 일반 칭호로 치환하지 않고 이름 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
