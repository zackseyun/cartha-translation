base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
  footnotes:
  - marker: a
    text: 'Hebrew: ''his brothers, the priests.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 사독 제사장과 그의 동료 제사장들은 야훼의 장막 앞, 곧 기브온에 있는 산당에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “그의 형제들, 곧 제사장들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק הַכֹּהֵן
  english_pob_choice: Zadok the priest
  chosen_korean: 사독 제사장
  alternatives_korean:
  - 사독, 제사장
  - 사독 대제사장
  lexicon: HALOT
  rationale: 고유명사는 통용 표기인 ‘사독’으로 옮기고, הַכֹּהֵן은 직함을 붙여 ‘제사장’으로 간단히 반영했습니다.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  english_pob_choice: and his fellow priests
  chosen_korean: 그의 동료 제사장들
  alternatives_korean:
  - 그의 형제들, 제사장들
  - 그의 형제 제사장들
  lexicon: HALOT
  rationale: 직역하면 ‘그의 형제들, 제사장들’이지만, 문맥상 혈연보다 함께 섬기는 제사장 무리를 가리키므로 ‘동료 제사장들’이 자연스럽고 정확합니다.
- source_word: מִשְׁכַּן יְהוָה
  english_pob_choice: the tabernacle of Yahweh
  chosen_korean: 야훼의 장막
  alternatives_korean:
  - 야훼의 성막
  - 야훼의 거처
  lexicon: HALOT
  rationale: מִשְׁכָּן은 성막/장막의 뜻을 지니므로 한국어에서는 ‘장막’으로 옮겨 원문의 성소 이미지를 유지했습니다. 하나님의 이름은 본 프로젝트 기본값에 따라 ‘야훼’로 반영했습니다.
- source_word: בַּבָּמָה אֲשֶׁר בְּגִבְעוֹן
  english_pob_choice: at the high place that was in Gibeon
  chosen_korean: 기브온에 있는 산당에
  alternatives_korean:
  - 기브온에 있는 높은 곳에
  - 기브온의 산당에
  lexicon: HALOT
  rationale: בָּמָה는 예배 장소로서의 ‘산당’이 가장 직접적이며, כאן은 위치를 설명하는 관계절이므로 한국어에서는 자연스럽게 한 덩어리로 처리했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 번역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 용례를 따르며, 본문이 직접 사용하는 언약 이름을 드러내기 위해 전통적 대체어보다 고유한 이름을 유지했습니다.
  doctrine_reference: 'POB default terminology: YHWH → 야훼'
