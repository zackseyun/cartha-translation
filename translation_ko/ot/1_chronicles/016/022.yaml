base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
  footnotes:
  - marker: a
    text: Or 'my anointed'; literally, 'my anointed ones.' The Hebrew term is related to 'Messiah,' but here it refers more broadly to those anointed by God, not specifically to the Messiah.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 기름부음받은 사람들을[a] 건드리지 말며, 내 예언자들을 해치지 마십시오.
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어는 복수형으로, 직역하면 ‘나의 기름부음받은 이들’입니다. 여기서는 단수적 메시아 호칭이 아니라 하나님께 구별된 사람들을 넓게 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  english_pob_choice: touch
  chosen_korean: 건드리지 말며
  alternatives_korean:
  - 손대지 말며
  - 만지지 말며
  - 접촉하지 말며
  lexicon: HALOT
  rationale: נגע의 기본 의미를 살리되, 금지문의 공격적 뉘앙스를 한국어에서 자연스럽게 드러내기 위해 ‘건드리다’를 택했습니다.
- source_word: בִּמְשִׁיחָי
  english_pob_choice: my anointed ones
  chosen_korean: 나의 기름부음받은 사람들
  alternatives_korean:
  - 나의 기름부음받은 자들
  - 나의 메시아들
  lexicon: HALOT
  rationale: 히브리어 복수형과 1인칭 소유격을 반영해, 특정 메시아가 아니라 하나님께 구별된 사람들을 가리키는 일반적 뜻으로 옮겼습니다.
- source_word: וּבִנְבִיאַי
  english_pob_choice: my prophets
  chosen_korean: 내 예언자들
  alternatives_korean:
  - 내 선지자들
  - 내 예언자들
  lexicon: HALOT
  rationale: נָבִיא의 직접적 의미를 살려 ‘예언자들’로 옮겼고, 문맥상 하나님의 대변자라는 기능을 드러냅니다.
- source_word: תָּרֵעוּ
  english_pob_choice: harm
  chosen_korean: 해치지 마십시오
  alternatives_korean:
  - 상하게 하지 마십시오
  - 악을 행하지 마십시오
  - 손상시키지 마십시오
  lexicon: HALOT
  rationale: רעע의 금지형을 구체적인 신체 손상보다 넓은 ‘해치다’로 옮겨, 평행구와 어조에 맞는 자연스러운 경고문으로 만들었습니다.
theological_decisions:
- issue: מְשִׁיחָי를 ‘메시아’로 고정하지 않는 문제
  chosen_reading: ‘기름부음받은 사람들’로 옮겨, 본문이 말하는 하나님의 위임받은 이들을 가리키도록 했습니다.
  alternative_readings:
  - ‘나의 메시아들’
  - ‘나의 기름부음받은 자들’
  rationale: 이 구절의 משיח은 단수 종말론적 메시아가 아니라 하나님께서 세우신 복수의 사람들을 가리키므로, 기독론적 의미를 본문 밖에서 앞당겨 넣지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: 본문이 직접 말하지 않는 신학적 특정화는 피하고, 원문의 의미 범위를 보존한다.'
