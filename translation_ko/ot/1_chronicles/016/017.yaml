source:
  edition: WLC
  text: וַ/יַּעֲמִידֶ֤/הָ לְ/יַעֲקֹב֙ לְ/חֹ֔ק לְ/יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
  footnotes:
  - marker: a
    text: Or 'He established it.' The Hebrew verb can carry the sense of causing something to stand firm.
    reason: lexical_alternative
  - marker: b
    text: Or 'an eternal covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 야곱에게는 율례로, 이스라엘에게는 영원한 언약으로 확정하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 세우셨습니다.’ 히브리어 동사는 무엇인가를 굳게 서게 한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원한 언약으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  english_pob_choice: He confirmed it
  chosen_korean: 확정하셨습니다
  alternatives_korean:
  - 세우셨습니다
  - 확립하셨습니다
  - 굳게 하셨습니다
  lexicon: HALOT
  rationale: 히필형 עמד는 ‘서게 하다, 굳게 하다, 확정하다’의 뜻을 가질 수 있으므로, 문맥상 언약을 유효하게 세우는 의미를 한국어로 자연스럽게 살렸습니다.
- source_word: לְחֹק
  english_pob_choice: as a statute
  chosen_korean: 율례로
  alternatives_korean:
  - 규례로
  - 법령으로
  - 법규로
  lexicon: HALOT
  rationale: חֹק은 고정된 규정·정해진 법도를 가리키므로, 한국어 성경에서 가장 안정적인 대응인 ‘율례’가 형식성과 언약적 뉘앙스를 함께 살립니다.
- source_word: בְּרִית עוֹלָם
  english_pob_choice: as an everlasting covenant
  chosen_korean: 영원한 언약으로
  alternatives_korean:
  - 영속하는 언약으로
  - 영구한 언약으로
  - 영원한 계약으로
  lexicon: HALOT
  rationale: בְּרִית는 ‘언약’으로 유지하고, עוֹלָם은 문맥상 ‘영원한’이 가장 자연스럽고 전통적인 의미를 직접 전달합니다.
theological_decisions:
- issue: ‘그것’의 지시 대상
  chosen_reading: 문맥상 앞절들에 언급된 언약적 약속/맹세를 가리키는 대명사로 두었습니다.
  alternative_readings:
  - 맹세만을 더 구체적으로 가리킨다고 볼 수도 있습니다.
  rationale: 히브리어 여성형 목적격 접미사는 앞선 언약·맹세 문맥 전체를 가리킬 수 있으므로, 한국어에서도 좁게 특정하지 않고 ‘그것’을 유지해 해석의 폭을 보존했습니다.
  doctrine_reference: '번역 원칙: 문맥이 허용하는 해석의 긴장을 불필요하게 해소하지 않음'
