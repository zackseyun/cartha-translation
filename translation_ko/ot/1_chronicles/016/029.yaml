  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
  footnotes:
  - marker: a
    text: Or, 'in the splendor of holiness'; possibly, 'in holy attire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 그의 이름에 합당한 영광을 돌리십시오. 예물을 가져오고 그의 앞에 나오십시오[a]. 야훼께 거룩한 아름다움 가운데서 엎드려 경배하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩의 광휘 가운데서’; 아마도 ‘거룩한 옷차림으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본문의 신성명 יהוה를 POB의 원칙에 따라 음역한 ‘야훼’로 옮겨, 예배 공식에서의 고유한 언약적 호칭을 드러냈습니다.
- source_word: כְּבוֹד שְׁמוֹ
  english_pob_choice: the glory due his name
  chosen_korean: 그의 이름에 합당한 영광
  alternatives_korean:
  - 그의 이름의 영광
  - 그의 이름에 드려야 할 영광
  lexicon: HALOT
  rationale: 직역적 소유구조보다 ‘합당한’으로 책임/응당함의 뉘앙스를 살려, 이름에 속한 영광이 아니라 이름에 마땅히 돌려야 할 영광임을 나타냈습니다.
- source_word: הִשְׁתַּחֲוּ
  english_pob_choice: Bow down
  chosen_korean: 엎드려 경배하십시오
  alternatives_korean:
  - 절하십시오
  - 엎드리십시오
  lexicon: HALOT
  rationale: 동사의 신체적 굴복과 예배 행위를 함께 드러내기 위해 ‘엎드려 경배하다’로 옮겼습니다.
- source_word: בְּהַדְרַת קֹדֶשׁ
  english_pob_choice: in holy splendor
  chosen_korean: 거룩한 아름다움 가운데서
  alternatives_korean:
  - 거룩한 영광 가운데서
  - 거룩한 옷차림으로
  lexicon: HALOT
  rationale: 구절의 시적 압축성을 유지하면서도 ‘거룩’의 영역 안에 있는 아름다움/광휘를 살렸고, 가능한 의복적 함의는 본문이 강제하지 않으므로 본문 안에서는 열어 두었습니다.
theological_decisions:
- issue: 야훼의 호칭을 한국어에서 어떻게 드러낼지
  chosen_reading: 본문의 언약명 יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 시편적 예배 명령에서 고유신명 사용이 의미상 중요하므로, 일반적인 대체어보다 원문 표지를 보존하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
