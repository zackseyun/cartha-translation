  naturalness: 현행 ‘말씀하기를’은 현대 한국어 성경 문장으로 부자연스럽고, 인용문 안의 청원 동사들이 연결형과 종결형으로 혼재합니다. 수정문은 합쇼체 명령과 청원을 일관되게 사용하면서 예배문으로도 자연스럽습니다.
  terminology: ‘우리 구원의 하나님이시여’는 히브리어 구성 표현을 자연스럽게 살립니다. ישׁע는 ‘구원하시고’, נצל은 ‘건져 내 주십시오’로 구별했습니다. גּוֹיִם은 후대의 신학적 범주를 피하여 ‘민족들’로 유지했습니다. ‘주의 찬양 가운데서 자랑하게’는 히트파엘의 환희·자랑 의미와 בְּ의 관계를 함께 보존합니다.
