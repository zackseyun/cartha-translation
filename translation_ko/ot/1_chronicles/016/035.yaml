id: 1CH.16.35
reference: 1 Chronicles 16:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
  footnotes:
  - marker: a
    text: Or “from the Gentiles,” though here the sense is more broadly “from the nations/peoples.”
    reason: lexical_alternative
  - marker: b
    text: Or “boast in your praise” or “exult in your praise.”
    reason: lexical_alternative
translation:
  language: ko
  text: 말씀하기를, 「우리의 구원의 하나님이시여, 우리를 구원하시고 우리를 모으시며 민족들 가운데서 우리를 건져 내소서[a]. 그리하여 우리가 주의 거룩한 이름에 감사하고 주의 찬양을 자랑하게 하소서[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “민족들로부터”로도 옮길 수 있습니다. 여기서는 더 넓게 “민족들 가운데서”라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “주의 찬양 안에서 자랑하게” 혹은 “주의 찬양 안에서 기뻐하게”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִמְרוּ
  english_pob_choice: And say
  chosen_korean: 말씀하기를
  alternatives_korean:
  - 그리고 말하기를
  - 이르기를
  lexicon: HALOT
  rationale: 공동체의 응답을 이끄는 명령형을 한국어 예배문체에 맞게 자연스럽게 옮기되, 문장의 도입부 기능을 살리기 위해 ‘말씀하기를’로 처리했습니다.
- source_word: הוֹשִׁיעֵנוּ
  english_pob_choice: Save us
  chosen_korean: 우리를 구원하시고
  alternatives_korean:
  - 우리를 구해 주시고
  - 우리를 건지시고
  lexicon: HALOT
  rationale: ישׁע의 기본 의미를 가장 직접적으로 반영하여 ‘구원하시고’로 옮겼습니다. 뒤의 נצל과 구별되도록 같은 계열의 ‘구하다/건지다’로 평면화하지 않았습니다.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  english_pob_choice: O God of our salvation
  chosen_korean: 우리의 구원의 하나님이시여
  alternatives_korean:
  - 우리의 구원을 베푸시는 하나님이시여
  - 우리 구원의 하나님이시여
  lexicon: HALOT
  rationale: 직역 구조를 유지하면서 한국어 호격을 살려 ‘하나님이시여’로 번역했습니다. ‘구원’의 출처가 하나님께 있음을 분명히 했습니다.
- source_word: וְקַבְּצֵנוּ
  english_pob_choice: gather us
  chosen_korean: 우리를 모으시며
  alternatives_korean:
  - 우리를 모아 주시며
  - 우리를 불러 모으시며
  lexicon: HALOT
  rationale: קבץ의 집합·회복 뉘앙스를 살려 ‘모으시며’로 옮겼습니다. 앞뒤 동사들과 병렬을 이루도록 연결형으로 처리했습니다.
- source_word: וְהַצִּילֵנוּ מִן הַגּוֹיִם
  english_pob_choice: deliver us from the nations
  chosen_korean: 민족들 가운데서 우리를 건져 내소서
  alternatives_korean:
  - 나라들로부터 우리를 구해 내소서
  - 이방 민족들로부터 우리를 구원하소서
  lexicon: HALOT
  rationale: גוים을 이 본문 맥락에 따라 ‘민족들’로 옮겼고, נצל은 앞의 ‘구원’과 구별되는 해방·구출의 의미를 살려 ‘건져 내소서’로 번역했습니다.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  english_pob_choice: that we may give thanks to your holy name
  chosen_korean: 그리하여 우리가 주의 거룩한 이름에 감사하고
  alternatives_korean:
  - 그리하여 우리가 주의 거룩한 이름을 찬양하고
  - 그리하여 우리가 주의 거룩한 이름에 감사드리고
  lexicon: HALOT
  rationale: לְהוֹדוֹת는 כאן 감사의 목적을 나타내므로 ‘감사하고’로 옮겼습니다. ‘거룩한 이름’은 שֵׁם קָדְשֶׁךָ의 직결 구조를 유지합니다.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  english_pob_choice: and glory in your praise
  chosen_korean: 주의 찬양을 자랑하게 하소서
  alternatives_korean:
  - 주의 찬양 가운데서 기뻐하게 하소서
  - 주의 찬양 속에서 영광을 삼게 하소서
  lexicon: HALOT
  rationale: 히트파엘 לְהִשְׁתַּבֵּחַ는 단순한 칭찬이 아니라 하나님을 두고 기뻐하며 자랑하는 적극적 반응을 가리키므로, ‘자랑하게 하소서’로 옮겨 원문의 강도를 살렸습니다.
theological_decisions:
- issue: 마지막 절의 לְהִשְׁתַּבֵּחַ를 전통적 ‘영광’ 언어로 순화할지 여부
  chosen_reading: ‘자랑하게 하소서’로 번역해 공동체가 하나님의 찬양 안에서 능동적으로 기뻐하고 드높이는 의미를 드러냈습니다.
  alternative_readings:
  - 영광을 돌리게 하소서
  - 찬양 가운데 기뻐하게 하소서
  rationale: 히브리어는 하나님을 향한 적극적 자부·환희를 포함하므로, 의미를 약화시키는 일반적 경구보다 본문의 힘을 드러내는 표현을 택했습니다.
  doctrine_reference: 시 34:2의 유사 용례와 POB 번역 원칙
- issue: גוים의 범위를 ‘이방인’으로 좁힐지 여부
  chosen_reading: ‘민족들’로 옮겨 역사적·문맥적 의미를 유지했습니다.
  alternative_readings:
  - 이방인들
  - 열국
  rationale: 이 본문은 신약의 유대인/이방인 구분이 아니라 주변 민족들 가운데서의 구출을 말하므로, 후대 교리적 범주를 덧씌우지 않는 번역이 필요합니다.
  doctrine_reference: 구약 역사 맥락
