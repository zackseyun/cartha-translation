base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh''; rendered ''the LORD'' following the translation''s standard practice for the divine name.'
    reason: alternative_reading
  - marker: b
    text: Or 'his covenant faithfulness endures forever.' The Hebrew word חֶסֶד carries the sense of loyal, covenantal love.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼[a]께 감사하십시오. 그분은 선하시고, 그분의 한결같은 사랑[b]은 영원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 원문은 하나님의 이름 יְהוָה를 직접 사용합니다. 본 번역은 프로젝트 기본값에 따라 이를 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 חֶסֶד는 ‘한결같은 사랑’과 함께 ‘언약적 신실하심’의 뜻도 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  english_pob_choice: Give thanks
  chosen_korean: 감사하라
  alternatives_korean:
  - 찬양하라
  - 감사드립니다
