  lexicon: HALOT
  rationale: 히필 명령형 ידה는 이 감사·찬양 공식에서 ‘감사하다’가 가장 직접적이고 관용적인 대응입니다. 합쇼체 문맥에서 명령형도 자연스럽게 살렸습니다.
- source_word: לַ/יהוָה֙
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: WLC
  rationale: 원문이 여호와의 이름을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약적 고유성을 유지했습니다.
- source_word: ט֔וֹב
  english_pob_choice: good
  chosen_korean: 선하시기
  alternatives_korean:
  - 좋으시기
  - 선하기
  - 은혜로우시기
  lexicon: HALOT
  rationale: 하나님께 대한 טוֹב는 단순한 ‘좋다’보다 도덕적·혜택적 선하심을 가리키므로, 한국어에서는 ‘선하시다’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: חַסְדּֽ/וֹ
  english_pob_choice: his steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 신실하심
  - 자애
  lexicon: HALOT
  rationale: חֶסֶד는 언약적 사랑과 신실함을 함께 담는 말입니다. 본 절의 예배적 반복구에서는 한국어 성경에서 널리 쓰이면서도 그 결을 비교적 잘 보존하는 ‘인자하심’을 택했습니다.
theological_decisions:
- issue: 여호와 이름의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 신명기적 고유명사 יְהוָה가 직접 나오므로, 독자가 언약 이름을 알아볼 수 있도록 ‘야훼’로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד의 신학적 뉘앙스
  chosen_reading: 인자하심
  alternative_readings:
  - 언약적 신실하심
  - 변함없는 사랑
  - 긍휼
  rationale: 이 절은 야훼의 성품을 찬양하는 전례적 반복구이므로, 사랑과 신실함이 함께 보이는 용어가 필요합니다. ‘인자하심’은 그 긴장을 비교적 간결하게 살립니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
