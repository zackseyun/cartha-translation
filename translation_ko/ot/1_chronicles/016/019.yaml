  lexicon: HALOT
  rationale: ב + היה의 시간적 용법을 한국어의 자연스러운 시간 부사구로 옮기되, 문맥상 주어를 살린 합쇼체 표현으로 처리했습니다.
- source_word: מְתֵי מִסְפָּר
