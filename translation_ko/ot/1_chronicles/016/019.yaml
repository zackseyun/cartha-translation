  - 적은 인원이었고
  lexicon: HALOT
  rationale: 관용구의 핵심인 ‘countable few’의 의미를 살려, 현대 한국어에서 가장 간결하고 자연스러운 표현으로 옮겼습니다.
- source_word: כִּמְעַט
  english_pob_choice: very few
  chosen_korean: 아주 적었으며
  alternatives_korean:
  - 거의 없었으며
  - 정말 적었으며
  - 거의 몇 되지 않았으며
  lexicon: HALOT
  rationale: כמעט가 앞의 적음을 강하게 강조하므로, 단순 수량보다 강한 감각을 주는 ‘아주 적었으며’로 옮겼습니다.
- source_word: וְגָרִים
  english_pob_choice: and sojourners
  chosen_korean: 나그네였습니다
  alternatives_korean:
  - 거주하는 외국인이었습니다
  - 잠시 머무는 이방인이었습니다
  - 체류자였습니다
  lexicon: HALOT
  rationale: גור의 ‘임시 거주자, 이주하여 머무는 자’라는 뜻을 살려, 성경적·사회적 뉘앙스를 유지하는 ‘나그네’로 옮겼습니다.
theological_decisions:
- issue: 땅의 소유권과 체류 신분의 대비
  chosen_reading: ‘그 땅에서 나그네였습니다’로 옮겨, 언약 백성이 아직 정착한 소유자가 아니라 외부 체류자였다는 대비를 드러냈습니다.
  alternative_readings:
  - ‘그 땅에 머무는 사람들이었습니다’
  - ‘그 땅의 이방인이었습니다’
  rationale: 문맥의 회상적 강조는 숫자적 적음뿐 아니라 정착 이전의 불안정한 신분을 함께 말하므로, 이를 약화시키지 않도록 했습니다.
  doctrine_reference: 언약 역사/아브라함 전승
- issue: 합쇼체와 직접 진술의 긴장
  chosen_reading: 서술은 합쇼체로 유지하고, 복합절 내부의 쉼표와 대시로 히브리어의 점층적 강조를 살렸습니다.
  alternative_readings:
  - 더 직역적인 분절
  - 더 구어적인 재서술
  rationale: 공적 낭독에 적합한 문체를 유지하면서도 원문의 누적 강조를 보존하기 위한 결정입니다.
  doctrine_reference: 문체/낭독 전통
