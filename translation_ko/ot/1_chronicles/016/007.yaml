  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'David appointed at the head/chief place Asaph and his brothers to give thanks to the LORD,' or 'David for the first time appointed Asaph and his brothers to give thanks to the LORD.' The Hebrew phrase is idiomatic and may emphasize priority, leadership, or initial institution.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 다윗은 처음으로 아삽과 그의 형제들을 야훼께 감사하게 하도록 임명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘처음으로’는 히브리어 בָּרֹאשׁ의 관용적 의미를 반영한 것이며, ‘우두머리로/수위에’라는 뜻도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא + אָז
  english_pob_choice: On that day then
  chosen_korean: 그날에
  alternatives_korean:
  - 그날에 그러고는
  - 그날에 그때
  lexicon: HALOT
  rationale: 두 시간 표지가 함께 있어 한국어에서는 간결하게 하나의 시간부사구로 묶어 자연스럽게 옮기되, 서사적 전환감은 문맥이 살립니다.
- source_word: נָתַן בְּיַד
  english_pob_choice: appointed
  chosen_korean: 임명했습니다
  alternatives_korean:
  - 맡겼습니다
  - 지정했습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 '주다'가 아니라 직무 부여/배치의 뜻이므로, 감사 직무를 공식적으로 맡기는 뉘앙스의 '임명했습니다'가 가장 잘 맞습니다.
- source_word: בָּרֹאשׁ
  english_pob_choice: first
  chosen_korean: 처음으로
  alternatives_korean:
  - 맨 처음
  - 첫째로
  - 우두머리로
  lexicon: HALOT
  rationale: 이 표현은 관용적으로 우선성이나 최초 제정을 나타낼 수 있으므로, 본문 흐름에 맞게 시간적 의미를 살린 '처음으로'를 채택했습니다.
- source_word: לְהֹדוֹת לַיהוָה
  english_pob_choice: to give thanks to Yahweh
  chosen_korean: 야훼께 감사하게 하도록
  alternatives_korean:
  - 야훼께 감사드리도록
  - 야훼를 찬양하게 하도록
  lexicon: HALOT
  rationale: 히필 부정사구는 '감사하다'의 행위를 수행하도록 하는 목적을 나타내므로, 한국어에서는 목적보어를 포함한 자연스러운 서술로 풀었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본 용례에 따라 신적 이름은 '야훼'로 옮겨, 본문의 고유 신명과 언약적 호칭을 보존했습니다.
theological_decisions:
- issue: בָּרֹאשׁ의 의미가 '처음으로'인지 '수위/우두머리로'인지
  chosen_reading: 본문은 다윗이 아삽과 그의 형제들을 감사 직무에 처음으로 세운 최초 제정을 말하는 것으로 옮겼습니다.
  alternative_readings:
  - 아삽과 그의 형제들을 우두머리 자리에 세워
  - 아삽과 그의 형제들을 수위에 세워
  rationale: 주석 전통처럼 우선순위·직위 의미가 가능하지만, 여기서는 감사 봉사의 최초 설치라는 역사적 문맥이 더 자연스러워 '처음으로'를 본문에 반영했습니다.
  doctrine_reference: Narrative-historical reading; lexical ambiguity of בראש
