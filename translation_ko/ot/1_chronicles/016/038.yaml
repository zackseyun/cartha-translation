base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
  footnotes:
  - marker: a
    text: Hebrew 'their brothers'; some translations smooth this to 'his brothers' to clarify the relationship, but the main text follows the plural suffix of the received Hebrew text.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 오벧에돔과 그들의 형제들[a], 예순여덟 명이었습니다. 또 여두둔의 아들 오벧에돔과 호사는 문지기였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘그들의 형제들’이라는 복수 소유 접미사를 사용합니다. 일부 번역은 관계를 분명히 하려고 ‘그의 형제들’로 매끄럽게 옮기지만, 본문은 복수형을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵ֥ד אֱדֹ֛ם
  english_pob_choice: And Obed-edom
  chosen_korean: 그리고 오벧-에돔
  alternatives_korean:
  - 또 오벧-에돔
  - 오벧-에돔
  lexicon: HALOT
  rationale: 목록을 잇는 וְ는 한국어에서도 단순 접속사 ‘그리고’로 살리고, 고유명사는 통용되는 음역을 따랐습니다.
- source_word: וַ/אֲחֵי/הֶ֖ם
  english_pob_choice: and their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그의 형제들
  - 형제들과
  lexicon: HALOT
  rationale: 받은 본문의 3인칭 복수 접미사를 반영해 ‘그들의’로 옮겼고, 영어 POB의 각주가 지적하듯 관계를 매끄럽게 바꾸지 않았습니다.
- source_word: שִׁשִּׁ֣ים וּ/שְׁמוֹנָ֑ה
  english_pob_choice: sixty-eight
  chosen_korean: 예순여덟 명
  alternatives_korean:
  - 예순과 여덟 명
  - 68명
  lexicon: HALOT
  rationale: 히브리어 수사를 현대 한국어의 자연스러운 표현으로 옮기되, 인원수임을 분명히 하려고 ‘명’을 보탰습니다.
- source_word: לְ/שֹׁעֲרִֽים
  english_pob_choice: were gatekeepers
  chosen_korean: 문지기였습니다
  alternatives_korean:
  - 문지기로 있었습니다
  - 문지기 직분이 있었습니다
  lexicon: HALOT
  rationale: לְ + 명사는 직분/기능을 나타내므로 단순한 목적어가 아니라 역할의 서술로 이해해 ‘문지기였습니다’로 옮겼습니다.
theological_decisions:
- issue: 가계·직분 표기의 압축성
  chosen_reading: ‘오벧-에돔은 여디둔의 아들인 호사와 함께 문지기였습니다’로, 족보적 지정과 직분을 모두 드러냈습니다.
  alternative_readings:
  - ‘오벧-에돔과 호사는 문지기였습니다’
  - ‘오벧-에돔의 아들 여디둔과 호사는 문지기였습니다’
  rationale: 문맥상 두 번째 절은 오벧-에돔을 다시 지시하며 그에 대한 추가 설명을 붙이므로, 관계를 흐리지 않도록 인물 식별과 직분을 함께 살렸습니다.
  doctrine_reference: 역대기 족보/성전 봉사 표기
