  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
  footnotes:
  - marker: a
    text: Or 'awesome.' The Hebrew means inspiring awe and reverent fear; 'to be feared' preserves that force more clearly in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 크시고 크게 찬양받으실 분이며, 모든 신들보다 두려워할 분이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외로운’. 히브리어는 경외와 경건한 두려움을 불러일으키는 뜻을 담고 있으므로, 이 문맥에서는 ‘두려워할’이 그 힘을 더 분명히 살립니다.
    reason: lexical_alternative
