base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
  footnotes:
  - marker: a
    text: Or 'awesome.' The Hebrew means inspiring awe and reverent fear; 'to be feared' preserves that force more clearly in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 위대하시며 크게 찬양받으실 분이시고, 모든 신들보다 더 두려워해야 할 분[a]이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외심을 불러일으키는 분’. 히브리어는 경외와 경건한 두려움을 불러일으키는 뜻을 담고 있으므로, 이 문맥에서는 ‘두려워해야 할 분’이 그 의미를 더 분명히 드러냅니다.
    reason: lexical_alternative
