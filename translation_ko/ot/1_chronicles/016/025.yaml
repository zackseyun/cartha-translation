theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 문서의 표준 용례에 따라 Tetragrammaton을 고유명사 ‘야훼’로 옮겨 하나님의 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נוֹרָא의 신학적 뉘앙스
  chosen_reading: 두려워할 분
  alternative_readings:
  - 경외로운 분
  - 어마어마한 분
  rationale: 본문은 단순한 ‘멋짐’이 아니라 하나님을 향한 경외 섞인 두려움을 말하므로, 그 긴장을 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6
