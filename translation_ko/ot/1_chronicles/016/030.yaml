  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
  footnotes:
  - marker: a
    text: Or 'it will not totter' or 'it will not be shaken.' The Hebrew image is of firm stability.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅이여, 그 앞에서 떨라. 참으로 세상은 굳게 세워졌으니, 흔들리지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요동하지 않을 것입니다’, ‘흔들리지 않을 것입니다’. 히브리어 이미지는 견고한 안정입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  english_pob_choice: Tremble
  chosen_korean: 떨라
  alternatives_korean:
  - 두려워하라
  - 몸부림치라
  - 전율하라
  lexicon: HALOT
  rationale: ער의 의례적·신현적 명령을 한국어로 자연스럽게 살리면서, 단순한 공포보다 하나님의 임재 앞에서의 떨림을 전달합니다.
- source_word: מִלְּפָנָיו
  english_pob_choice: before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그분의 앞에서
  - 그의 임재 앞에서
  lexicon: HALOT
  rationale: 직역성은 유지하되, 예배 문맥에서의 경외적 자세를 가장 간결하게 드러내는 표현으로 다듬었습니다.
- source_word: תִּכּוֹן / בַּל תִּמּוֹט
  english_pob_choice: is established / it shall not be moved
  chosen_korean: 굳게 세워졌으니, 흔들리지 않을 것입니다
  alternatives_korean:
  - 견고히 서 있으니, 흔들리지 않을 것입니다
  - 확립되었으니, 요동하지 않을 것입니다
  lexicon: HALOT
  rationale: ‘세워지다’와 ‘흔들리다’의 대응을 살려 시적 안정의 이미지를 보존했고, POB의 ‘not be moved’가 지닌 견고함을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: כָּל הָאָרֶץ / תֵּבֵל
  english_pob_choice: all the earth / the world
  chosen_korean: 온 땅 / 세상
  alternatives_korean:
  - 온 세상
  - 땅 전체
  lexicon: HALOT
  rationale: 첫 절의 포괄적 대상은 ‘온 땅’으로, 뒤의 세계 질서 진술은 ‘세상’으로 구분해 히브리어의 우주적 범위를 살렸습니다.
theological_decisions:
- issue: 세계의 안정성 표현
  chosen_reading: 이 구절은 하나님이 세우신 질서 아래 세상이 견고하다는 뜻으로 옮기고, 절대적 정지나 물리학적 진술로 좁히지 않았습니다.
  alternative_readings:
  - ‘흔들리지 않는다’를 더 문자적으로만 읽어 절대적 불가동성으로 이해하는 방식
  - ‘흔들림 없이 서 있다’로 완화하는 방식
  rationale: 히브리어 시어의 신학적 핵심은 창조 세계의 안전성과 하나님의 통치 아래 있는 견고함이므로, 그 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; Original-language primacy over translation tradition.'
