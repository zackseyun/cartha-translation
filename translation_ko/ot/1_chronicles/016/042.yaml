base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
  footnotes:
  - marker: a
    text: Or 'gatekeepers'; the Hebrew literally says 'for/at the gate,' which may denote assigned gate duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 함께 헤만과 여두둔이 있었고, 나팔과 제금을 가지고 소리를 내게 하였으며, 하나님의 노래를 위한 악기들도 있었고, 여두둔의 아들들은 문에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문지기들’일 수 있습니다. 히브리어는 문자적으로 ‘문을 위해/문에’라고 하며, 지정된 문지기 직무를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  english_pob_choice: And with them were
  chosen_korean: 그들과 함께 …이 있었고
  alternatives_korean:
  - 그들과 함께
  - 그들과 함께 있었습니다
  lexicon: HALOT
  rationale: 동반 인물을 자연스러운 한국어 문장으로 풀되, 원문의 함께함을 보존했습니다.
- source_word: לְמַשְׁמִיעִים
  english_pob_choice: for sounding aloud
  chosen_korean: 소리를 내게 하였으며
  alternatives_korean:
  - 소리를 내도록
  - 크게 울리게 하였으며
  - 울려 퍼지게 하였으며
  lexicon: HALOT
  rationale: 히브리어의 사역적 의미(‘듣게 하다/들리게 하다’)를 살려, 악기들의 공적 발성을 분명히 드러냈습니다.
- source_word: וּכְלֵי שִׁיר
  english_pob_choice: instruments for the songs
  chosen_korean: 하나님의 노래를 위한 악기들
  alternatives_korean:
  - 노래의 악기들
  - 찬양의 악기들
  - 노래를 위한 악기들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘노래의 악기들’도 가능하지만, 문맥상 예배용 악기라는 점을 드러내면서도 원문의 소유/관계 구조를 유지했습니다.
- source_word: לַשָּׁעַר
  english_pob_choice: were at the gate
  chosen_korean: 문에 있었습니다
  alternatives_korean:
  - 문에 있었습니다
  - 문을 지켰습니다
  - 문지기 직무를 맡았습니다
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘문/성문에’라고 말하므로 그 표현을 우선 살리고, 문지기 직무 여부는 본문 자체보다 좁혀 말하지 않았습니다.
theological_decisions:
- issue: 성전/예배 음악의 기능을 어떻게 드러낼 것인가
  chosen_reading: ‘하나님의 노래를 위한 악기들’로 번역해, 음악이 하나님께 속한 예배 행위임을 드러냈습니다.
  alternative_readings:
  - ‘하나님의 노래의 악기들’
  - ‘하나님을 위한 악기들’
  rationale: 히브리어 소유격을 과도하게 풀지 않으면서도, 단순한 세속 음악이 아니라 예배 맥락의 악기임을 분명히 하기 위함입니다.
  doctrine_reference: 성전 봉사와 예배의 구별
