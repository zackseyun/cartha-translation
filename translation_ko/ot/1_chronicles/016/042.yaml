  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
  footnotes:
  - marker: a
    text: Or 'gatekeepers'; the Hebrew literally says 'for/at the gate,' which may denote assigned gate duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 함께 헤만과 여두둔이 있었고, 소리를 내기 위한 나팔과 제금과 하나님의 노래를 위한 악기들도 있었으며, 여두둔의 아들들은 문에[a] 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문지기들’일 수 있습니다. 히브리어는 문자적으로 ‘문을 위해/문에’라고 하며, 지정된 문지기 직무를 가리킬 수 있습니다.
    reason: lexical_alternative
