source:
  edition: WLC
  text: אֲשֶׁ֤ר כָּרַת֙ אֶת אַבְרָהָ֔ם וּ/שְׁבוּעָת֖/וֹ לְ/יִצְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
  footnotes:
  - marker: a
    text: Literally, 'which he cut with Abraham,' a Hebrew idiom meaning 'made a covenant with Abraham.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 아브라함과 맺으신 언약이며, 그분이 이삭에게 하신 맹세입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: which
  chosen_korean: 그것은
  alternatives_korean:
  - 그것이
  - 이는
  lexicon: HALOT
  rationale: 앞절의 ‘언약’을 가리키는 관계절이므로, 한국어에서는 관계대명사식 직역보다 지시 표현으로 자연스럽게 이어 주었습니다.
- source_word: כָּרַת אֶת אַבְרָהָם
  english_pob_choice: made with Abraham
  chosen_korean: 아브라함과 맺으신
  alternatives_korean:
  - 아브라함과 맺은
  - 아브라함과 언약을 자르신
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘언약을 자르다’를 한국어에서는 ‘맺다’로 옮겨 언약 체결의 의미를 분명히 하되, 문맥상 하나님을 주어로 한 존칭형으로 처리했습니다.
- source_word: וּשְׁבוּעָתוֹ
  english_pob_choice: and his oath
  chosen_korean: 그의 맹세는
  alternatives_korean:
  - 그의 맹세와
  - 그리고 그의 맹세는
  lexicon: HALOT
  rationale: 명사 ‘맹세’로 본문 대구를 살리고, 소유격 ‘-וֹ’를 ‘그의’로 유지해 앞의 언약과 병렬 구조를 보존했습니다.
- source_word: לְיִצְחָק
  english_pob_choice: to Isaac
  chosen_korean: 이삭에게 하신
  alternatives_korean:
  - 이삭에게
  - 이삭을 향한
  lexicon: HALOT
  rationale: לְ를 단순히 ‘~에게’로 옮기되, 맹세의 방향성과 발화성을 드러내기 위해 ‘하신’으로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 언약과 맹세의 병렬 표현
  chosen_reading: ‘아브라함과 맺으신 것’과 ‘이삭에게 하신 그의 맹세’로 병렬을 유지했습니다.
  alternative_readings:
  - 둘 다 단순히 ‘약속’으로 통일
  - ‘맹세’를 생략하고 언약만 강조
  rationale: 히브리어는 ‘언약’과 ‘맹세’를 나란히 두어 하나님의 언약 신실성을 강조하므로, 두 항을 모두 살려 신학적 긴장을 지키는 것이 본문에 충실합니다.
  doctrine_reference: 언약 신실성, 창세기 15장 및 26장의 약속 전승
