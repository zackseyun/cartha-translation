  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
  footnotes:
  - marker: a
    text: Or, 'who were specified by name' or 'who were named individually.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''for his steadfast love is forever,'' a recurring liturgical refrain.'
    reason: cultural_note
translation:
  language: ko
  text: 그들과 함께 헤만과 여두둔과, 나머지 택함 받은 사람들이 있었는데, 이들은 이름으로 지정되어 야훼께 감사하게 된 사람들이었습니다. 그의 한결같은 사랑은 영원합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘이름으로 지정된’ 혹은 ‘개별적으로 이름이 불린’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘그의 한결같은 사랑은 영원합니다.’ 반복되는 전례적 후렴입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  english_pob_choice: And with them were
  chosen_korean: 그들과 함께 … 있었습니다
  alternatives_korean:
  - 그리고 그들과 함께 있었습니다
  - 그들과 함께 있었습니다
  lexicon: HALOT
  rationale: 앞 문맥에 이어지는 동반 관계를 자연스럽게 살리기 위해 ‘그들과 함께’로 옮기고, 서술은 합쇼체 과거형으로 처리했습니다.
- source_word: הֵימָן / וִידוּתוּן
  english_pob_choice: Heman / Jeduthun
  chosen_korean: 헤만 / 여두둔
  alternatives_korean:
  - 헤만 / 예두둔
  - 헤만 / 야두둔
  lexicon: 고유명사 표기 관례
  rationale: 성경 인명은 현대 외래어 표기와 기존 한국어 성경 관용을 함께 고려해 ‘헤만’, ‘여두둔’으로 옮겼습니다.
- source_word: וּשְׁאָר הַבְּרוּרִים
  english_pob_choice: the rest of those chosen
  chosen_korean: 나머지 택함 받은 사람들
  alternatives_korean:
  - 나머지 선택된 사람들
  - 남은 택자들
  lexicon: HALOT
  rationale: בָּרוּר/בָּחַר 계열의 선택 의미를 살리되, 한국어에서 자연스러운 ‘택함 받은 사람들’로 옮겼습니다. 원문의 ‘나머지’도 보존했습니다.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  english_pob_choice: who were designated by name
  chosen_korean: 이름으로 지정되어
  alternatives_korean:
  - 이름으로 지목되어
  - 이름대로 불려
  lexicon: HALOT
  rationale: נקד의 수동형이 단순한 ‘이름붙임’보다 공식적 지정·호명 뉘앙스를 가지므로 ‘이름으로 지정되어’로 옮겼습니다.
- source_word: לְהֹדוֹת לַיהוָה
  english_pob_choice: to give thanks to Yahweh
  chosen_korean: 야훼께 감사하게 된
  alternatives_korean:
  - 야훼께 감사하도록
  - 야훼께 감사드리도록
  lexicon: HALOT
  rationale: 예배 문맥에서 הוֹדָה는 ‘감사하다/감사드리다’가 적절하며, 원문의 목적 표현을 한국어에서 자연스럽게 풀어 ‘감사하게 된’으로 표현했습니다. YHWH는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  english_pob_choice: for his steadfast love endures forever
  chosen_korean: 그의 한결같은 사랑은 영원합니다
  alternatives_korean:
  - 그의 인자하심은 영원합니다
  - 그의 변함없는 사랑은 영원합니다
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·지속적 의미를 한국어에서 ‘한결같은 사랑’으로 전달했고, לְעוֹלָם은 시간 지속을 분명히 하여 ‘영원합니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 중 divine name 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 YHWH를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약 이름을 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 문장 끝 예배 공식의 정서
  chosen_reading: ‘그의 한결같은 사랑은 영원합니다’
  alternative_readings:
  - 그의 인애는 영원합니다
  - 그의 사랑은 영원합니다
  rationale: 본문은 감사의 이유를 제시하는 전례적 후렴이므로, 단순한 일반적 사랑보다 언약적 지속성을 드러내는 표현을 택했습니다.
  doctrine_reference: 시편 전례 후렴 및 본문 반복 구조
