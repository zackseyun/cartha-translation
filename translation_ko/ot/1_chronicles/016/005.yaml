reference: 1 Chronicles 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָסָ֥ף הָ/רֹ֖אשׁ וּ/מִשְׁנֵ֣/הוּ זְכַרְיָ֑ה יְעִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִֽ/יחִיאֵ֡ל וּ/מַתִּתְיָ֡ה וֶ/אֱלִיאָ֡ב וּ/בְנָיָהוּ֩ וְ/עֹבֵ֨ד אֱדֹ֜ם וִֽ/יעִיאֵ֗ל בִּ/כְלֵ֤י נְבָלִים֙ וּ/בְ/כִנֹּר֔וֹת וְ/אָסָ֖ף בַּֽ/מְצִלְתַּ֥יִם מַשְׁמִֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
  footnotes:
  - marker: a
    text: Or 'and his second was Zechariah.' The Hebrew term indicates second rank relative to Asaph.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew distinguishes two stringed instruments: nebalim and kinnorot, rendered here ''harps'' and ''lyres.'''
    reason: cultural_note
translation:
  language: ko
  text: 아삽은 우두머리였고, 그 다음은 스가랴였으며, 여이엘, 스미라못, 여히엘, 맛디디야, 엘리압, 브나야, 오벧에돔, 여이엘이 있었고, 수금과 비파 악기를 들었으며, 아삽은 심벌즈를 울렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  english_pob_choice: the chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 머리
  lexicon: HALOT
  rationale: 명사 רֹאשׁ가 여기서는 신체 부위가 아니라 서열과 책임을 가리키므로, 인물 목록에서 자연스러운 ‘우두머리’로 옮겼습니다.
- source_word: וּמִשְׁנֵהוּ
  english_pob_choice: and second to him was
  chosen_korean: 그 다음은
  alternatives_korean:
  - 그의 다음 서열은
  - 그에게서 두 번째는
  lexicon: HALOT
  rationale: 히브리어가 아삽에 대한 2위 서열을 나타내므로, 한국어에서는 관계를 풀어 ‘그 다음은’으로 간결하게 드러냈습니다.
- source_word: בִּכְלֵי נְבָלִים / וּבְכִנֹּרוֹת
  english_pob_choice: with instruments of harps and lyres
  chosen_korean: 수금과 비파 악기를 들었으며
  alternatives_korean:
  - 수금과 비파로
  - 수금과 비파 악기와 함께
  lexicon: HALOT
  rationale: כְּלֵי가 ‘악기/도구들’의 뜻이므로 ‘악기를’로 살리고, נְבָלִים·כִנּוֹרוֹת의 두 현악기를 각각 ‘수금’과 ‘비파’로 구분했습니다.
- source_word: בַּמְצִלְתַּיִם מַשְׁמִיעַ
  english_pob_choice: and Asaph sounded the cymbals
  chosen_korean: 아삽은 심벌즈를 울렸습니다
  alternatives_korean:
  - 아삽은 심벌즈를 쳤습니다
  - 아삽은 심벌즈 소리를 내었습니다
  lexicon: HALOT
  rationale: מַשְׁמִיעַ의 사역적 의미를 살리되, 한국어에서는 ‘울리다’가 악기를 소리 나게 하다의 뜻을 자연스럽게 전달합니다.
theological_decisions:
- issue: 인물 호칭과 위계 표현
  chosen_reading: ‘우두머리’와 ‘그 다음은’으로 서열 관계를 분명히 드러냈습니다.
  alternative_readings:
  - ‘지도자’와 ‘두 번째는’
  - ‘머리’와 ‘그의 둘째는’
  rationale: 이 구절은 예배 음악 담당자들의 배치를 설명하므로, 신학적 해석을 덧붙이기보다 본문의 조직적 의미를 그대로 전달하는 것이 적절합니다.
  doctrine_reference: 본문 맥락상 제사·예배 조직의 질서
