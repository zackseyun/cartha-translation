lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  english_pob_choice: they wandered / went about
  chosen_korean: 다녔습니다
  alternatives_korean:
  - 떠돌았습니다
  - 이리저리 다녔습니다
  - 옮겨 다녔습니다
  lexicon: HALOT
  rationale: 히트파엘의 반복적·분산적 이동을 한국어에서는 ‘다녔습니다’로 자연스럽게 살렸습니다. ‘떠돌았습니다’는 유랑의 뉘앙스가 더 강해 문맥을 좁힐 수 있습니다.
- source_word: מִגּוֹי אֶל גּוֹי
  english_pob_choice: from nation to nation
  chosen_korean: 나라에서 나라로
  alternatives_korean:
  - 민족에서 민족으로
  - 국가에서 국가로
  lexicon: HALOT
  rationale: גּוֹי는 여기서 ‘민족’보다 ‘나라’가 더 자연스럽고, 뒤의 מַמְלָכָה와 병행을 이루기에도 적절합니다.
- source_word: וּמִמַּמְלָכָה
  english_pob_choice: and from one kingdom
  chosen_korean: 한 왕국에서
  alternatives_korean:
  - 왕국에서
  - 한 나라에서
  lexicon: HALOT
  rationale: מַמְלָכָה를 ‘왕국’으로 옮겨 גּוֹי의 ‘나라’와 어휘를 구별했습니다. 원문에는 수사가 없지만 분배적 의미를 살리기 위해 ‘한’을 넣었습니다.
- source_word: אֶל עַם אַחֵר
  english_pob_choice: to another people
  chosen_korean: 다른 민족에게로
  alternatives_korean:
  - 다른 백성에게로
  - 다른 사람들에게로
  lexicon: HALOT
  rationale: עַם은 집단성을 지닌 ‘민족’으로 옮기는 것이 가장 무난하며, אַחֵר의 ‘다른’도 그대로 살렸습니다. 한국어에서는 방향을 드러내는 ‘-에게로’가 מתאים합니다.
