base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
  footnotes:
  - marker: a
    text: Or, “from eternity to eternity” or “forever and ever.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “Amen, and praise to the LORD” / “Amen, and praise the LORD”; the Hebrew expression is compact, and the sense is that the people responded with amen and praise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 이스라엘의 하나님은 영원부터 영원까지[a] 찬송받으소서. 그러자 온 백성이 「아멘!」 하고 야훼를 찬양했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “영원부터 영원까지”는 ‘영원에서 영원으로’, ‘세세토록’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “아멘, 그리고 야훼를 찬양하라” 또는 “아멘과 야훼께 드리는 찬양”으로도 이해될 수 있는 압축된 표현입니다. 여기서는 백성이 아멘으로 응답하고 야훼를 찬양한 것으로 옮겼습니다.
    reason: lexical_alternative
