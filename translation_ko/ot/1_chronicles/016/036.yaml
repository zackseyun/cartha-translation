theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약 이름을 직접 사용하므로, 호칭 대체보다 고유명사 표기를 유지해 स्रोत의 신학적 구분을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 백성의 응답 형태
  chosen_reading: 「아멘!」 하고 야훼를 찬양했습니다
  alternative_readings:
  - 「아멘, 그리고 야훼를 찬양하라」
  - 「아멘, 야훼를 찬양하라」
  rationale: 히브리어는 아멘과 찬양이 압축된 집합적 응답이므로, 직접 인용문으로 나누기보다 서술문으로 풀어 공적 응답의 의미를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve compact liturgical sense without over-expanding'
