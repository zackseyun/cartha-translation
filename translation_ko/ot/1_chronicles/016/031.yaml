translation:
  language: ko
  text: 하늘은 기뻐하고, 땅은 즐거워하며, 민족들 가운데에서 「야훼께서 다스리십니다!」라고 말하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ / וְתָגֵל
  english_pob_choice: Let the heavens rejoice / and let the earth be glad
  chosen_korean: 하늘들은 기뻐하고, 땅은 즐거워하며
  alternatives_korean:
  - 하늘들이 기뻐하고, 땅이 즐거워하며
  - 하늘은 기뻐하고, 땅은 기뻐하며
  lexicon: HALOT
  rationale: 두 동사는 시적 평행법의 권면형 흐름을 살리기 위해 명령형보다 청유형으로 옮겼고, שׂמח와 גיל의 차이를 살려 '기뻐하다'와 '즐거워하다'를 구별했습니다.
- source_word: הַשָּׁמַיִם / הָאָרֶץ
  english_pob_choice: the heavens / the earth
  chosen_korean: 하늘들 / 땅
  alternatives_korean:
  - 하늘 / 세상
  - 하늘들 / 땅
  lexicon: HALOT
  rationale: 시편적 우주 찬양 공식이므로 지리적 '땅'보다 우주적 대비가 살아 있는 '하늘들'과 '땅'으로 옮겼습니다.
- source_word: בַגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데에서
  alternatives_korean:
  - 열방 가운데에서
  - 나라들 가운데에서
  - 이방인들 가운데에서
  lexicon: HALOT
  rationale: גוים는 이 구절에서 유대-이방 대조어보다 세계의 여러 민족을 가리키므로, 오해를 줄이기 위해 '민족들'을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성명은 대체 호칭이 아니라 고유명사이므로, 프로젝트 기본값대로 '야훼'를 사용했습니다.
- source_word: מָלָךְ
  english_pob_choice: reigns
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 왕이 되셨습니다
  - 통치하십니다
  - 다스리십니다
  lexicon: HALOT
  rationale: מלך의 즉위/왕권 선포를 한국어의 현재적 왕권 진술인 '다스리십니다'로 옮겨, 단순 과거 완료보다 현재 통치의 공표를 드러냈습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 יְהוָה를 직접 사용하므로, 직함 대체보다 고유 신명 보존이 본문의 신학적 힘을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
