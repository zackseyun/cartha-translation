  text: לֵ/אמֹ֗ר לְ/ךָ֙ אֶתֵּ֣ן אֶֽרֶץ כְּנָ֔עַן חֶ֖בֶל נַחֲלַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/018.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
  footnotes:
  - marker: a
    text: Hebrew shifts from singular ('to you') to plural ('your inheritance'), likely moving from the patriarch addressed to his descendants as the covenant heirs.
    reason: lexical_alternative
  - marker: b
    text: Or 'allotment' for 'portion'; the Hebrew word literally refers to a cord or measured line and by extension a measured share of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하기를, “내가 너희에게 가나안 땅, 곧 너희 몫의 유산을 주겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너에게’(단수)와 ‘너희의 유산’(복수)을 나란히 두어, 족장에게 주신 약속이 그의 후손 공동체에 적용됨을 드러냅니다.
    reason: theological_note
  - marker: b
    text: 히브리어 חֶבֶל은 문자적으로 ‘줄/측량선’이지만, 땅 분배 문맥에서는 ‘분깃’이나 ‘몫’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  english_pob_choice: to you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너에게
  - 당신에게
  lexicon: HALOT
  rationale: 본문은 뒤의 ‘너희의 유산’과 함께 단수-복수의 전환을 보이므로, 대상이 족장 한 사람에서 그 후손 공동체로 확장됨을 드러내기 위해 복수형을 살렸습니다.
- source_word: אֶתֵּן
  english_pob_choice: I will give
  chosen_korean: 주겠습니다
  alternatives_korean:
  - 드리겠습니다
  - 줄 것입니다
  lexicon: HALOT
  rationale: 언약적 약속의 미래적 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 서술형으로 옮겼습니다.
- source_word: אֶרֶץ כְּנָעַן
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안 지방
  lexicon: HALOT
  rationale: ‘땅’이 히브리어 אֶרֶץ의 구체적 토지·영토 감각을 가장 직접적으로 살리므로, 표준적인 성서 번역 관용을 따랐습니다.
- source_word: חֶבֶל נַחֲלַתְכֶם
  english_pob_choice: the portion of your inheritance
  chosen_korean: 곧 너희 몫의 유산
  alternatives_korean:
  - 곧 너희 상속분
  - 곧 너희의 기업
  - 곧 너희에게 정해진 분깃
  lexicon: HALOT
  rationale: חֶבֶל은 문자적으로는 ‘줄/측량선’이지만 분배된 몫을 뜻하므로 ‘몫’으로, נַחֲלָה는 상속된 소유를 뜻하므로 ‘유산’으로 옮겨 측량-분배와 상속의 의미를 함께 살렸습니다.
theological_decisions:
- issue: 단수와 복수의 병치
  chosen_reading: ‘너에게’ 대신 문맥상 공동체를 드러내는 ‘너희에게’를 사용해, 족장에게 주신 약속이 그의 후손에게 이어진다는 점을 보존했습니다.
  alternative_readings:
  - 단수로 통일하여 ‘너에게’와 ‘너의 유산’으로 번역
  - 의미를 풀어 ‘너와 네 후손에게’로 번역
  rationale: 히브리어는 수적으로 긴장을 유지하므로 이를 평준화하지 않고, 약속의 수신자와 유산의 귀속 대상을 함께 드러내는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
