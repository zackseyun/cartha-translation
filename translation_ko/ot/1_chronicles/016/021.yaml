    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아무도 그들을 억압하도록 허락하지 않으셨고, 그들을 위해 왕들을 꾸짖으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
