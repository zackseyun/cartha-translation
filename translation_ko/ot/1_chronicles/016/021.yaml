lexical_decisions:
- source_word: הִנִּיחַ
  english_pob_choice: allowed
  chosen_korean: 허락하지 않으셨고
  alternatives_korean:
  - 허용하지 않으셨고
  - 내버려 두지 않으셨고
  lexicon: HALOT
  rationale: 사역형의 ‘허락하다/허용하다’ 뜻을 살려, 하나님이 그 행위를 용인하지 않으셨다는 보호의 의미를 자연스럽게 나타냈습니다.
- source_word: לְעָשְׁקָם
  english_pob_choice: to oppress them
  chosen_korean: 그들을 억압하도록
  alternatives_korean:
  - 그들을 학대하도록
  - 그들을 착취하도록
  lexicon: HALOT
  rationale: עָשַׁק의 핵심 의미인 압제·억압을 간결하게 살려, 역사 서술 맥락에 맞는 강한 피해 의미를 유지했습니다.
- source_word: וַיּוֹכַח
  english_pob_choice: rebuked
  chosen_korean: 꾸짖으셨고
  alternatives_korean:
  - 책망하셨고
  - 질책하셨고
  lexicon: HALOT
  rationale: 왕들을 향한 하나님의 대응은 단순한 교정보다 공개적 책망에 가까워 ‘꾸짖다’가 가장 직접적입니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: on their account
  chosen_korean: 그들을 위해
  alternatives_korean:
  - 그들 때문에
  - 그들 편에서
  lexicon: HALOT
  rationale: עַל의 관계적·보호적 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 표현으로, ‘그들 때문에’보다 긍정적 보호 의미를 분명히 했습니다.
theological_decisions:
- issue: 문맥상 주어의 보충
  chosen_reading: 주어는 앞문맥의 여호와/하나님을 가리키므로 한국어에서는 ‘그는’으로 보충했습니다.
  alternative_readings:
  - 무주어로 처리
  - 명시적으로 ‘하나님은’이라고 반복
  rationale: 히브리어 본문은 앞선 문맥의 주어를 이어받으며, 한국어는 서술의 명료성을 위해 대명사를 보충하되 신학적 주체를 새로 확장하지 않도록 했습니다.
  doctrine_reference: 문맥 연속성과 원문 주어 상속 원칙
