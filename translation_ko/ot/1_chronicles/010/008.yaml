  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים לְ/פַשֵּׁ֖ט אֶת הַֽ/חֲלָלִ֑ים וַֽ/יִּמְצְא֤וּ אֶת שָׁאוּל֙ וְ/אֶת בָּנָ֔י/ו נֹפְלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: Now it happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
  footnotes:
  - marker: a
    text: Or 'the following day.'
    reason: lexical_alternative
  - marker: b
    text: The verb 'strip' refers to removing spoil such as armor or clothing from the battle dead.
    reason: cultural_note
translation:
  language: ko
  text: 다음 날에 블레셋 사람들이 전리품을 벗기려고 왔는데, 사울과 그의 아들들이 길보아 산에 엎드러져 있는 것을 발견했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 표현은 전투 직후의 ‘다음 날’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벗기다’는 전사한 자에게서 갑옷이나 의복 같은 전리품을 떼어 내는 행위를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  english_pob_choice: on the next day
  chosen_korean: 다음 날에
  alternatives_korean:
  - 그 다음 날에
  - 이튿날에
  lexicon: HALOT
  rationale: 전투 직후의 다음 시간을 자연스러운 현대 한국어로 옮기되, 사건의 순서를 분명히 유지했습니다.
- source_word: לְפַשֵּׁט
  english_pob_choice: to strip
  chosen_korean: 전리품을 벗기려고
  alternatives_korean:
  - 벗기려고
  - 벗기며
  - 노략하려고
  lexicon: HALOT
  rationale: 이 동사는 시체에서 갑옷이나 옷을 벗기는 행위를 가리키므로, 단순한 약탈보다 몸에서 떼어 내는 행위를 드러내는 표현을 택했습니다.
- source_word: הַחֲלָלִים
  english_pob_choice: the slain
  chosen_korean: 엎드러져 있는 것을
  alternatives_korean:
  - 죽은 자들을
  - 전사한 이들을
  lexicon: HALOT
  rationale: 전투 서사에서 ‘the slain’의 구체성을 살리되, 한국어에서는 뒤의 발견 동사와 자연스럽게 연결되도록 상태 중심으로 옮겼습니다.
- source_word: נֹפְלִים
  english_pob_choice: fallen
  chosen_korean: 엎드러져 있는
  alternatives_korean:
  - 쓰러져 있는
  - 넘어져 있는
  lexicon: HALOT
  rationale: 히브리어의 ‘fallen’ 이미지를 유지하면서, 전투에서 쓰러진 상태를 생생하게 전달하는 표현을 선택했습니다.
theological_decisions:
- issue: 블레셋 사람들이 시신에서 무엇을 취하려 했는지의 표현 강도
  chosen_reading: ‘전리품을 벗기려고’로 옮겨, 갑옷과 옷 등 전장에서 취할 수 있는 것을 벗겨 내는 행위로 드러냈습니다.
  alternative_readings:
  - ‘약탈하려고’
  - ‘벗기려고’
  rationale: 문맥상 단순한 약탈보다 전사한 자들의 장비와 의복을 벗겨 가는 구체적 행위가 핵심이므로, 문화적 배경을 지나치게 완화하지 않는 쪽을 택했습니다.
  doctrine_reference: 본문의 역사 서술에 대한 직역-설명 균형
