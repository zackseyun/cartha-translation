base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
  footnotes:
  - marker: a
    text: Or 'all his household' or 'all his family.' The Hebrew says 'all his house,' which can refer to a household or family line rather than a physical building.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울과 그의 세 아들과 그의 온 집안[a]이 함께 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘집’은 실제 건물보다 가정, 집안, 가문을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: So Saul died
  chosen_korean: 그러므로 사울이 죽고
  alternatives_korean:
  - 그리고 사울이 죽었습니다
  - 그리하여 사울이 죽었습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol의 결과적 흐름을 살려, 단순한 접속보다 원인·결과의 자연스러운 진행을 담았습니다.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  english_pob_choice: and his three sons
  chosen_korean: 그의 세 아들도
  alternatives_korean:
  - 그리고 그의 세 아들
  - 그리고 세 아들도
  lexicon: HALOT
  rationale: ‘세 아들’이라는 수량 표현과 소유격을 자연스럽게 옮기되, 본문의 병렬성을 살려 ‘도’로 앞절과 이어지게 했습니다.
- source_word: וְכָל בֵּיתוֹ
  english_pob_choice: and all his house
  chosen_korean: 그의 온 집도
  alternatives_korean:
  - 그의 모든 집도
  - 그의 온 가문도
  - 그의 온 가족도
  lexicon: HALOT
  rationale: בַּיִת/בֵּית의 넓은 의미를 살려 ‘집’으로 직역하되, 실제 건물이 아니라 가문·가족 집단을 가리키는 뉘앙스를 반영하기 위해 ‘온’으로 범위를 드러냈습니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 모두 함께
  - 한꺼번에
  lexicon: HALOT
  rationale: 사울, 아들들, 그리고 그의 집이 공동으로 죽었다는 집합적 의미를 가장 간결하게 표현했습니다.
theological_decisions:
- issue: ‘온 집’의 범위
  chosen_reading: 본문은 사울의 전체 친족에 대한 절대적·전면적 주장으로 확장하지 않고, 사울에게 속한 집단이 함께 죽었다는 진술로 유지했습니다.
  alternative_readings:
  - 온 가족
  - 온 가문
  - 모든 식구
  rationale: 히브리어 בֵּיתוֹ는 가정, 집안, 가문을 아우를 수 있으므로, 문맥을 넘어서 범위를 좁히거나 확대하지 않고 본문의 넓이를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
