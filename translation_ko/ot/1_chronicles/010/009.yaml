id: 1CH.10.9
reference: 1 Chronicles 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨פְשִׁיטֻ֔/הוּ וַ/יִּשְׂא֥וּ אֶת רֹאשׁ֖/וֹ וְ/אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר אֶת עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
  footnotes:
  - marker: a
    text: Or 'their images.' The Hebrew term can refer to idol-images; 'idols' is chosen because the context is cultic and polemical.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그를 벗기고, 그의 머리와 그의 무기를 가져갔으며, 블레셋 온 땅에 두루 소식을 보내어 그들의 우상들[a]과 백성에게 알렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 형상들’. 히브리어는 우상 형상들을 가리킬 수 있으며, 여기서는 문맥상 ‘우상들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  english_pob_choice: They stripped him
  chosen_korean: 그를 벗기고
  alternatives_korean:
  - 그를 벗겼고
  - 그의 갑옷을 벗기고
  lexicon: HALOT
  rationale: פּשט는 전투 맥락에서 옷이나 갑옷을 벗기는 뜻이므로, 본문이 직접 말하지 않는 ‘갑옷’을 덧붙이지 않고 간결하게 옮겼습니다.
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  english_pob_choice: took his head
  chosen_korean: 그의 머리를 가져갔으며
  alternatives_korean:
  - 그의 머리를 취했으며
  - 그의 머리를 들고 갔으며
  lexicon: HALOT
  rationale: נשא는 ‘들다/가지다/옮기다’의 넓은 의미가 있어, 전리품처럼 취해 간 뉘앙스를 살려 ‘가져갔다’로 옮겼습니다.
- source_word: כֵּלָיו
  english_pob_choice: his weapons
  chosen_korean: 그의 무기를
  alternatives_korean:
  - 그의 갑옷을
  - 그의 장비를
  - 그의 도구를
  lexicon: HALOT
  rationale: כְּלִי는 넓게 ‘도구/기구/무기’를 가리키지만, 전투와 왕의 시신 맥락에서는 ‘무기’가 가장 자연스럽습니다.
- source_word: וַיְשַׁלְּחוּ
  english_pob_choice: sent word
  chosen_korean: 사람을 보내
  alternatives_korean:
  - 사람들을 보내
  - 소식을 보냈으며
  - 전령들을 보냈으며
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘보내다’이므로, 목적절의 ‘알리다’ 행위를 수행할 매개를 한국어에서 자연스럽게 보충해 ‘사람을 보내’로 옮겼습니다.
- source_word: עֲצַבֵּיהֶם
  english_pob_choice: their idols
  chosen_korean: 그들의 우상들과
  alternatives_korean:
  - 그들의 형상들과
  - 그들의 우상들에게
  lexicon: HALOT
  rationale: עצב는 문맥상 우상/형상을 뜻하며, POB의 ‘idols’를 따라 ‘우상들’로 옮겼습니다. 대상이 병렬되는 구조를 살려 뒤의 ‘백성’과 함께 목적어처럼 처리했습니다.
theological_decisions:
- issue: 블레셋 땅을 두루 돌며 ‘소식을 전하게’ 하는 행위의 목적 표현
  chosen_reading: 전리품의 승리를 우상들과 백성에게 공적으로 알리는 의미로 이해하여, 중립적 ‘소식을 전하게’로 옮겼습니다.
  alternative_readings:
  - 그들의 우상들에게 복음을 전하게
  - 그들의 우상들과 백성에게 선포하게
  rationale: בשר는 여기서 구원의 ‘복음’이 아니라 전쟁 승리의 공적 알림이므로, 신학적으로 오해를 줄 수 있는 ‘복음’은 피하고 문맥상 중립적인 표현을 택했습니다.
  doctrine_reference: 우상 숭배에 대한 구약의 polemical context
