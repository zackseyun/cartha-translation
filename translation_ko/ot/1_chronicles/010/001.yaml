base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: Now the Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
  footnotes:
  - marker: a
    text: Hebrew 'every man of Israel fled'; the singular 'man' functions collectively here.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 이스라엘과 싸웠습니다. 이스라엘 사람들은[a] 블레셋 사람들 앞에서 도망하여 길보아 산에서 쓰러져 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 각 사람’입니다. 여기서는 단수형이 집합적으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  english_pob_choice: Now the Philistines
  chosen_korean: 이제 블레셋 사람들이
  alternatives_korean:
  - 그리고 블레셋 사람들이
  - 블레셋 사람들이
  lexicon: HALOT
  rationale: 문장 첫머리의 ו는 서술 전환을 자연스럽게 표시하도록 ‘이제’로 옮길 수 있고, 민족명은 표준 음역인 ‘블레셋 사람들’이 가장 안정적입니다.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  english_pob_choice: fought against Israel
  chosen_korean: 이스라엘과 싸웠습니다
  alternatives_korean:
  - 이스라엘에 대하여 싸웠습니다
  - 이스라엘과 전쟁하였습니다
  lexicon: HALOT
  rationale: ב와 결합한 לחם은 적대적 교전의 뜻이므로 ‘~과 싸우다’가 가장 직접적이며, 과도하게 격식적인 ‘전쟁하다’보다 문맥에 잘 맞습니다.
- source_word: וַיִּפְּלוּ חֲלָלִים
  english_pob_choice: fell slain
  chosen_korean: 쓰러져 죽었습니다
  alternatives_korean:
  - 쓰러져 전사했습니다
  - 죽임을 당해 쓰러졌습니다
  lexicon: HALOT
  rationale: חֲלָלִים은 전투에서 죽은 자들을 가리키므로 결과를 분명히 하되, 군사적 함의를 유지하는 ‘쓰러져 죽었습니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 결과를 서술하는 방식
  chosen_reading: 본문의 전쟁 보고를 그대로 유지해, 이스라엘의 패배와 사망을 완화하지 않고 직서적으로 표현했습니다.
  alternative_readings:
  - 완곡하게 ‘피해를 입었습니다’로 옮김
  - 해석을 덧붙여 패전의 원인을 설명함
  rationale: 열왕/역대기의 역사 서술은 사건 자체를 있는 그대로 전달하는 것이 중요하므로, 본문이 말하는 군사적 참패를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 성경 역사서의 서술적 진실성
