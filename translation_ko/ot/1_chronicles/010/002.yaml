  source_fidelity: ‘바짝 뒤쫓다’는 דבק + אחרי가 전투 문맥에서 나타내는 밀착 추격의 강도를 잘 살립니다. 그러나 ‘쳐죽였습니다’는 נכה의 기본 의미인 ‘치다/쓰러뜨리다’보다 사망을 명시하여 의미를 좁히며, 영어 POB의 ‘struck down’보다도 강합니다. ‘쳐서 쓰러뜨렸습니다’가 원문의 표현 범위를 보존합니다.
  naturalness: ‘쳐죽였습니다’는 현대 표준어에서 다소 거칠고 구어적인 어감을 지녀 합쇼체 성경 문체에 적합하지 않습니다. ‘쳐서 쓰러뜨렸습니다’는 자연스럽고 격식 있는 서술입니다. 인명 ‘말기수아’는 하이픈 없이 쓰는 것이 한국어 성경식 표기와 일반적인 고유명사 표기에 더 자연스럽습니다.
  terminology: ‘블레셋 사람들’, ‘사울’, ‘요나단’, ‘아비나답’, ‘말기수아’, ‘사울의 아들들’은 적절합니다. 영어 감사 기록의 추격 강도 관련 주석을 한국어에도 연결하여 어휘 선택의 근거와 대안을 드러내는 것이 좋습니다.
