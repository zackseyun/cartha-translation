  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
  footnotes:
  - marker: a
    text: Or 'pursued Saul and his sons closely.' The Hebrew verb literally has the sense of 'clinging' and here describes relentless pursuit in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 사울과 그의 아들들을 바짝 뒤쫓았고[a], 블레셋 사람들이 요나단과 아비나답과 말기수아, 곧 사울의 아들들을 쳐서 쓰러뜨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사울과 그의 아들들을 가까이 추격하였고.” 히브리어 동사는 본래 ‘달라붙다’라는 뜻을 지니며, 여기서는 전투 중 집요하고 바짝 뒤쫓는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ אַחֲרֵי
  english_pob_choice: pressed hard after / pursued closely
  chosen_korean: 바짝 뒤쫓았고
  alternatives_korean:
  - 가까이 뒤쫓았고
  - 집요하게 뒤쫓았고
  - 추격했고
  lexicon: HALOT
  rationale: דבק의 ‘달라붙다/붙다’라는 뉘앙스가 전투 문맥에서 단순한 ‘추격’보다 강한 압박을 나타내므로, 그 긴박함을 살려 ‘바짝 뒤쫓다’로 옮겼습니다.
- source_word: וַיַּכּוּ
  english_pob_choice: struck down
  chosen_korean: 쳐죽였습니다
  alternatives_korean:
  - 죽였습니다
  - 쳤습니다
  - 무찔렀습니다
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다/치며 쓰러뜨리다’이지만, 바로 뒤에 나오는 인물들의 죽음이 분명하므로 결과를 드러내는 ‘쳐죽이다’가 문맥상 가장 분명합니다.
- source_word: פְלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들이
  alternatives_korean:
  - 블레셋 족속이
  - 블레셋이
  lexicon: HALOT
  rationale: 민족명은 한국어 성경 관용에 따라 ‘블레셋 사람들’로 옮기되, 반복되는 주어를 그대로 살려 전투 서술의 강조를 유지했습니다.
- source_word: בְּנֵי שָׁאוּל
  english_pob_choice: the sons of Saul
  chosen_korean: 사울의 아들들
  alternatives_korean:
  - 사울의 아들들이
  - 사울의 자녀들
  lexicon: HALOT
  rationale: 히브리어는 남자 후손을 가리키므로 ‘아들들’이 정확하며, 이어지는 이름들과도 일치합니다.
