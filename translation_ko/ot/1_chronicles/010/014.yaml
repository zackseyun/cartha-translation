  source_fidelity: 본문의 인과관계와 야훼를 주어로 하는 죽음 및 왕권 이전의 진술은 대체로 충실합니다. 다만 각주 a의 ‘야훼를 상의하다’는 한국어 결합으로 성립하지 않으며, 각주 표지는 해당 어휘 바로 뒤에 두는 편이 원문의 대안 어휘와의 연결을 정확히 드러냅니다.
  naturalness: ‘그는 … 그를 죽이셨고’는 문맥상 이해할 수 있으나, 사울과 야훼를 명시하면 대명사 지시와 높임의 주체가 더 분명해집니다. ‘넘기셨습니다’는 여기서 왕권을 다윗에게 이전하셨다는 뜻을 자연스럽게 전달합니다.
  terminology: ‘야훼’, ‘왕권’, ‘이새의 아들 다윗’은 원문 및 프로젝트의 용어 선택에 적절합니다. דרש ב의 대안은 ‘야훼께 묻다’로 제시할 수 있으며, ‘상의하다’는 ‘야훼와 상의하다’ 또는 ‘야훼께 묻다’로만 자연스럽습니다.
  issues:
