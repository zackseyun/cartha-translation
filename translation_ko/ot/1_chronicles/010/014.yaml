  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
  footnotes:
  - marker: a
    text: Or 'inquire of the LORD' or 'consult the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the kingdom'; alternatively 'the kingship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사울은 야훼를 찾지 않았으므로[a], 야훼께서 그를 죽이시고 왕권을[b] 이새의 아들 다윗에게 넘기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 묻다’ 또는 ‘야훼와 상의하다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 왕권’입니다. 또는 ‘왕위’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  english_pob_choice: seek Yahweh
  chosen_korean: 야훼를 찾지 않았으므로
  alternatives_korean:
  - 야훼께 묻지 않았으므로
  - 야훼를 구하지 않았으므로
  lexicon: HALOT
  rationale: דרש with ב plus a divine object는 ‘찾다/묻다/상담하다’의 범위를 가지며, 여기서는 왕이 하나님의 뜻을 구하지 않은 책임을 드러내므로 ‘야훼를 찾지 않았다’가 가장 자연스럽고 넓게 대응합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명 יְהוָה는 이 프로젝트 기본 원칙에 따라 титул이 아니라 신적 고유명으로 ‘야훼’로 옮겼습니다.
- source_word: וַיְמִיתֵהוּ
  english_pob_choice: he put him to death
  chosen_korean: 그를 죽이셨고
  alternatives_korean:
  - 그를 죽게 하셨고
  - 그를 죽이셨습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 단순한 ‘죽다’보다 능동적 처치를 드러냈고, 문맥상 주어는 야훼이므로 한국어에서도 주어를 자연스럽게 반영했습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 왕권
  alternatives_korean:
  - 나라
  - 왕국
  - 왕위
  lexicon: HALOT
  rationale: מְלוּכָה는 여기서 지리적 왕국보다 통치권의 이전을 가리키므로, ‘왕권’이 ‘turned the kingdom over’의 권위 이전 의미를 더 정확히 드러냅니다.
theological_decisions:
- issue: 하나님의 직접적 죽음 행위 표현
  chosen_reading: 본문의 직접적 서술을 따라 야훼께서 그를 죽이셨다고 옮겼습니다.
  alternative_readings:
  - 야훼께서 그가 죽도록 허락하셨습니다
  - 야훼께서 그의 죽음을 가져오셨습니다
  rationale: 원문은 연속 동사의 주체를 야훼로 제시하고 히필 형태로 사역적 행위를 말하므로, 허용하심으로 완화하지 않고 본문의 긴장을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 섭리와 인과를 번역에서 미리 해소하지 않음
