  source_fidelity: 히브리어의 서술 순서와 핵심 의미(사울이 죽은 것을 본 무기 담당자가 그 역시 칼 위에 쓰러져 죽음)는 대체로 충실합니다. 다만 ‘무기 든 자’는 נֹשֵׂא כֵלָיו가 가리키는 군사적 직책보다 단지 무기를 소지한 사람으로 읽힐 수 있습니다.
  naturalness: ‘칼 위에 엎드려’는 현대 한국어에서 다소 부자연스럽고, 칼 위에 엎드린 자세를 묘사하는 듯 들릴 수 있습니다. ‘칼 위에 쓰러져’가 원문의 동작을 더 직접적으로 보존하면서 자연스럽습니다.
  terminology: ‘무기 담당자’는 현대 표준어에서 군사적 역할을 자연스럽게 나타내며, 각주에서 문자적 표현인 ‘그의 무기를 드는 자’를 보완할 수 있습니다. ‘칼’은 חֶרֶב에 적절하며, 원문에 없는 소유격은 첨가하지 않았습니다.
