source:
  edition: WLC
  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל הַ/חֶ֖רֶב וַ/יָּמֹֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
  footnotes:
  - marker: a
    text: Or, more literally, 'the bearer of his weapons.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'fell on the sword' is an idiom for killing oneself with a sword.
    reason: cultural_note
translation:
  language: ko
  text: 그의 무기 든 자가 사울이 죽은 것을 보고, 그도 칼 위에 엎드려 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 무기를 드는 자’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘칼 위에 엎드리다’는 자결을 가리키는 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: his armor-bearer
  chosen_korean: 그의 무기 든 자
  alternatives_korean:
  - 그의 갑옷 든 자
  - 그의 무기 담당자
  lexicon: HALOT
  rationale: 직역하면 ‘그의 무기를 드는 자’이지만, 본문의 군사적 역할을 나타내는 표현으로는 한국어에서도 기능을 드러내는 말이 가장 자연스럽습니다. 전통 교회어인 ‘병기 든 자’보다 현대 표준어에 가까운 ‘무기 든 자’를 택했습니다.
- source_word: וַיִּפֹּל עַל הַחֶרֶב
  english_pob_choice: fell on the sword
  chosen_korean: 칼 위에 엎드려
  alternatives_korean:
  - 칼에 떨어져
  - 검 위에 엎드려
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘칼 위에 떨어지다’이지만, 문맥상 자결을 가리키는 관용 표현입니다. 한국어에서는 그 관용성을 살려 ‘엎드려’로 옮겨, 단순한 낙상처럼 들리지 않게 했습니다.
- source_word: מֵת / וַיָּמֹת
  english_pob_choice: was dead / and died
  chosen_korean: 죽은 것을 보고 … 죽었습니다
  alternatives_korean:
  - 죽었음을 보고 … 죽었습니다
  - 죽은 것을 보고 … 숨졌습니다
  lexicon: HALOT
  rationale: 앞절의 상태 확인과 뒤절의 결과를 분명히 하기 위해 ‘죽은 것을 보고’와 ‘죽었습니다’를 대응시켰습니다. 서술의 긴박한 연속을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 자결을 드러내는 관용 표현의 처리
  chosen_reading: ‘칼 위에 엎드려 죽었습니다’로 옮겨, 본문의 자결 의미를 완곡하게 지우지 않았습니다.
  alternative_readings:
  - ‘칼에 몸을 던져 죽었습니다’
  - ‘칼로 자결했습니다’
  rationale: 본문의 관용구는 단순한 사고사가 아니라 자결을 뜻합니다. 한국어에서도 그 의미를 명확히 보존하되, 본문이 허용하는 범위 안에서 지나치게 해설적으로 풀지는 않았습니다.
  doctrine_reference: 본문 서술의 역사적·문학적 의미 보존
