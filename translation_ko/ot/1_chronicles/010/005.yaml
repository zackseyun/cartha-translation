  to: 그의 무기 담당자가 사울이 죽은 것을 보고, 그도 칼 위에 쓰러져 죽었습니다.[a][b]
  rationale: 군사적 직책을 뜻하는 표현을 현대 표준어에 맞게 ‘무기 담당자’로 다듬고, 원문의 ‘칼 위에 쓰러지다’라는 동작을 자연스럽게 유지했습니다. 각주는 직역 가능성과 해당 표현의 문맥상 의미를 각각 명확히 하며, 원문에 없는 ‘자기 칼’이나 과도하게 해설적인 표현은 넣지 않았습니다.
