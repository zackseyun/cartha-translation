base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
  footnotes:
  - marker: a
    text: Or 'plain' for 'valley.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'all the men of Israel,' using masculine language rather than a gender-neutral term.
    reason: lexical_alternative
  - marker: c
    text: Or 'settled in them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 골짜기에 있던 이스라엘의 모든 남자가 그들이 도망한 것과 사울과 그의 아들들이 죽은 것을 보자, 그들은 자기들의 성읍을 버리고 달아났습니다. 그러자 블레셋 사람들이 와서 거기에서 살았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’로 옮긴 עֵמֶק은 경우에 따라 ‘평야’로도 번역될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 성중립 표현이 아니라 남성형 ‘남자들’을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘살았습니다’는 여기서 ‘거주하다/정착하다’의 의미를 담습니다.
    reason: lexical_alternative
lexical_decisions:
