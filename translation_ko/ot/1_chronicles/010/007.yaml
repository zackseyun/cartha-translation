  - 골짜기에 있는
  lexicon: HALOT
  rationale: עֵמֶק의 기본 의미를 따라 ‘골짜기’로 옮겼고, 서술 흐름에 맞게 ‘있던’으로 자연스럽게 처리했습니다.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  english_pob_choice: they abandoned their cities
  chosen_korean: 자기들의 성읍을 버리고
  alternatives_korean:
  - 자기들의 도시를 버리고
