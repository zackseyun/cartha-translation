  lexicon: HALOT
  rationale: עָזַב의 ‘버리다/떠나다’ 뉘앙스 가운데, 전쟁 상황에서의 방치·포기를 드러내는 ‘버리다’가 가장 가깝습니다. ‘성읍’은 도시보다 고전적이지만 도시국가적 맥락을 더 잘 살립니다.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  english_pob_choice: and lived in them
  chosen_korean: 거기에서 살았습니다
  alternatives_korean:
  - 그 안에 살았습니다
  - 거기에 거주했습니다
  lexicon: HALOT
  rationale: יָשַׁב의 기본적 의미를 현대 한국어의 평이한 ‘살다’로 옮겨 점령 후 거주를 분명히 했습니다.
