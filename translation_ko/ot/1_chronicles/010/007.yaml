  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
  footnotes:
  - marker: a
    text: Or 'plain' for 'valley.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'all the men of Israel,' using masculine language rather than a gender-neutral term.
    reason: lexical_alternative
  - marker: c
    text: Or 'settled in them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 골짜기에 있던 이스라엘의 모든 남자가 그들이 도망한 것과 사울과 그의 아들들이 죽은 것을 보자, 그들은 자기들의 성읍을 버리고 달아났습니다. 그러자 블레셋 사람들이 와서 거기에서 살았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘골짜기’로 옮긴 עֵמֶק은 경우에 따라 ‘평야’로도 번역될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 성중립 표현이 아니라 남성형 ‘남자들’을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘살았습니다’는 여기서 ‘거주하다/정착하다’의 의미를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  english_pob_choice: all the men of Israel
  chosen_korean: 이스라엘의 모든 남자
  alternatives_korean:
  - 이스라엘의 모든 사람
  - 이스라엘의 모든 남성
  lexicon: HALOT
  rationale: 히브리어가 분명히 남성형 표현을 쓰므로, 문맥의 전투 장면과 함께 성별 표지를 살려 ‘남자’로 옮겼습니다.
- source_word: אֲשֶׁר בָּעֵמֶק
  english_pob_choice: who were in the valley
  chosen_korean: 골짜기에 있던
  alternatives_korean:
  - 평야에 있던
  - 골짜기에 있는
  lexicon: HALOT
  rationale: עֵמֶק의 기본 의미를 따라 ‘골짜기’로 옮겼고, 서술 흐름에 맞게 ‘있던’으로 자연스럽게 처리했습니다.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  english_pob_choice: they abandoned their cities
  chosen_korean: 자기들의 성읍을 버리고
  alternatives_korean:
  - 자기들의 도시를 버리고
  - 자기들의 성읍을 떠나고
  lexicon: HALOT
  rationale: עָזַב의 ‘버리다/떠나다’ 뉘앙스 가운데, 전쟁 상황에서의 방치·포기를 드러내는 ‘버리다’가 가장 가깝습니다. ‘성읍’은 도시보다 고전적이지만 도시국가적 맥락을 더 잘 살립니다.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  english_pob_choice: and lived in them
  chosen_korean: 거기에서 살았습니다
  alternatives_korean:
  - 그 안에 살았습니다
  - 거기에 거주했습니다
  lexicon: HALOT
  rationale: יָשַׁב의 기본적 의미를 현대 한국어의 평이한 ‘살다’로 옮겨 점령 후 거주를 분명히 했습니다.
