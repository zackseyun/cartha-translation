  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
  footnotes:
  - marker: a
    text: Or “and make sport of me,” “and mistreat me,” or “and deal shamefully with me.”
    reason: lexical_alternative
  - marker: b
    text: Literally “these uncircumcised ones.”
    reason: lexical_alternative
  - marker: c
    text: Or “thrust me through with it” could be rendered “pierce me with it” or “stab me with it.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사울이 자기 갑옷 든 자에게 말했습니다. “네 칼을 뽑아 나를 찔러라. 이 할례받지 않은 자들이 와서 나를 학대할까 하노라.” 그러나 그의 갑옷 든 자는 매우 두려워하여 그렇게 하려 하지 않았습니다. 그래서 사울은 칼을 취하고 그 위에 엎어졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나를 찔러 꿰뚫어라,” “나를 찔러 죽여라”로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “이 할례받지 않은 자들”입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “학대할까”는 “조롱할까,” “능욕할까,” “못되게 다룰까”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  english_pob_choice: his armor-bearer
  chosen_korean: 자기 갑옷 든 자
  alternatives_korean:
  - 무기를 드는 자
  - 무기 든 종
  lexicon: HALOT
  rationale: 군사 문맥에서 관용적인 뜻을 살리되, ‘armor-bearer’를 직역에 가깝게 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: שְׁלֹף חַרְבְּךָ
  english_pob_choice: Draw your sword
  chosen_korean: 네 칼을 뽑아
  alternatives_korean:
  - 네 칼을 꺼내
  - 네 칼을 빼어
  lexicon: HALOT
  rationale: 검을 칼집에서 빼는 동작을 가장 자연스럽게 전달하는 동사로 ‘뽑다’를 선택했습니다.
- source_word: וְדָקְרֵנִי בָהּ
  english_pob_choice: thrust me through with it
  chosen_korean: 나를 찔러라
  alternatives_korean:
  - 나를 꿰뚫어라
  - 나를 찔러 죽여라
  lexicon: HALOT
  rationale: ‘찔러라’가 무기로 관통시키려는 급박한 뜻을 살리면서도 과도한 덧붙임 없이 원문에 가깝습니다.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  english_pob_choice: these uncircumcised men
  chosen_korean: 이 할례받지 않은 자들이
  alternatives_korean:
  - 이 할례받지 않은 사람들
  - 이 할례 없는 자들
  lexicon: HALOT
  rationale: 원문의 경멸적 집단 지칭을 그대로 드러내기 위해 ‘할례받지 않은 자들’로 옮겼습니다.
- source_word: וְהִתְעַלְּלוּ בִי
  english_pob_choice: and abuse me
  chosen_korean: 나를 학대할까
  alternatives_korean:
  - 나를 조롱할까
  - 나를 못되게 다룰까
  - 나를 능욕할까
  lexicon: HALOT
  rationale: 히트파엘의 함의인 굴욕적·가학적 대우를 포괄하면서도, 한국어로는 ‘학대하다’가 가장 중립적이고 포괄적입니다.
- source_word: וְלֹא אָבָה
  english_pob_choice: was not willing
  chosen_korean: 그렇게 하려 하지 않았습니다
  alternatives_korean:
  - 원하지 않았습니다
  - 응하지 않았습니다
  lexicon: HALOT
  rationale: ‘אָבָה’의 의지/동의 거부를 한국어 문맥에 자연스럽게 풀어 썼습니다.
- source_word: וַיִּפֹּל עָלֶיהָ
  english_pob_choice: fell on it
  chosen_korean: 그 위에 엎어졌습니다
  alternatives_korean:
  - 그 위에 쓰러졌습니다
  - 그 위에 떨어졌습니다
  lexicon: HALOT
  rationale: 칼 위로 몸을 던져 자결하는 장면을 한국어로 분명하게 전달하되, 원문의 간결한 동작을 유지했습니다.
theological_decisions:
- issue: 사울이 두려워한 ‘mistreat/abuse’의 수위
  chosen_reading: ‘학대할까’로 옮겨, 수치와 폭력을 아우르는 모호성을 유지했습니다.
  alternative_readings:
  - ‘조롱할까’
  - ‘능욕할까’
  - ‘못되게 다룰까’
  rationale: 히브리어는 구체적 방식보다 수치스럽고 가혹한 대우 자체를 가리키므로, 과도하게 특정한 정서를 피하고 원문이 허용하는 넓은 범위를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
