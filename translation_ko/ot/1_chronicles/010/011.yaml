lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  english_pob_choice: When ... heard
  chosen_korean: …듣고
  alternatives_korean:
  - …들었습니다
  - …들었을 때
  lexicon: HALOT
  rationale: 와우 연속의 서술 전개를 한국어에서는 뒤 절로 이어지는 연결형 ‘-고’로 자연스럽게 살렸습니다.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  english_pob_choice: all Jabesh-gilead
  chosen_korean: 온 야베스 길르앗
  alternatives_korean:
  - 야베스 길르앗의 모든 사람
  - 야베스 길르앗 사람들 모두
  lexicon: HALOT
  rationale: 히브리어의 직역적 지명구성을 살리되, 문맥상 공동체 전체를 가리키는 의미를 한국어에서 간결하게 반영했습니다.
- source_word: לְשָׁאוּל
  english_pob_choice: to Saul
  chosen_korean: 사울에게
  alternatives_korean:
  - 사울을 향하여
  - 사울에게 대하여
  lexicon: HALOT
  rationale: ל의 표적/수혜 대상 용법을 가장 직접적으로 드러내는 조사 ‘에게’를 사용했습니다.
