source:
  edition: WLC
  text: וַ/יָּקוּמוּ֮ כָּל אִ֣ישׁ חַיִל֒ וַ/יִּשְׂא֞וּ אֶת גּוּפַ֣ת שָׁא֗וּל וְ/אֵת֙ גּוּפֹ֣ת בָּנָ֔י/ו וַ/יְבִיא֖וּ/ם יָבֵ֑ישָׁ/ה וַ/יִּקְבְּר֨וּ אֶת עַצְמוֹתֵי/הֶ֜ם תַּ֤חַת הָ/אֵלָה֙ בְּ/יָבֵ֔שׁ וַ/יָּצ֖וּמוּ שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
  footnotes:
  - marker: a
    text: Or 'under the terebinth.' The Hebrew אֵלָה can refer to a large tree of the terebinth/oak type.
    reason: lexical_alternative
  - marker: b
    text: The broader narrative identifies the location as Jabesh-gilead; here the Hebrew text abbreviates it to 'Jabesh.'
    reason: cross_reference
translation:
  language: ko
  text: 그러자 모든 용사들이 일어나 사울의 시체와 그의 아들들의 시체를 옮겨 야베스[b]로 가져왔습니다. 그들은 그들의 뼈를 야베스의 상수리나무[a] 아래에 묻고, 일곱 날 동안 금식했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵלָה는 상수리나무류의 큰 나무 또는 테레빈트를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이곳의 지명은 본문에서 간단히 ‘야베스’로 적히며, 더 넓은 서술에서는 ‘길르앗 야베스’로 확인됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  english_pob_choice: all the valiant men
  chosen_korean: 모든 용사들
  alternatives_korean:
  - 모든 힘센 사람들
  - 모든 무사들
  lexicon: HALOT
  rationale: 아ִישׁ חַיִל은 전투적 용기와 군사적 역량을 지닌 사람들을 가리키는 관용구이므로, 자연스러운 현대어로는 ‘용사들’이 가장 잘 살립니다.
- source_word: גּוּפַת ... גּוּפֹת
  english_pob_choice: the body of Saul and the bodies of his sons
  chosen_korean: 사울의 시체와 그의 아들들의 시체
  alternatives_korean:
  - 사울의 몸과 그의 아들들의 몸
  - 사울의 주검과 그의 아들들의 주검
  lexicon: HALOT
  rationale: 히브리어 גּוּפָה는 죽은 몸/시체를 뜻하므로, 문맥상 완곡하게 돌리지 않고 ‘시체’로 옮겨 원문의 구체성을 유지했습니다.
- source_word: תַּחַת הָאֵלָה
  english_pob_choice: under the oak
  chosen_korean: 떡갈나무 아래
  alternatives_korean:
  - 느릅나무 같은 큰 나무 아래
  - 상수리나무 아래
  lexicon: HALOT
  rationale: אֵלָה는 떡갈나무/테레빈트 계열의 큰 나무를 가리킬 수 있어, 본문에는 가장 익숙한 ‘떡갈나무’를 택하되 의미 범위를 보존했습니다.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  english_pob_choice: and fasted seven days
  chosen_korean: 일곱 날 동안 금식했습니다
  alternatives_korean:
  - 일곱 날 금식했습니다
  - 칠 일 동안 금식했습니다
  lexicon: HALOT
  rationale: 히브리어의 기간 표현을 자연스러운 한국어로 풀어 ‘일곱 날 동안’으로 옮기면서, 장례와 애도의 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: 장례 후 금식의 성격
  chosen_reading: 전쟁의 참혹함과 사울 집안의 죽음을 애도하는 공동체적 금식으로 이해해, 본문이 암시하는 애도의 무게를 그대로 살렸습니다.
  alternative_readings:
  - 단순한 의식적 단식
  - 정결 예식
  rationale: 문맥상 장례와 연결된 애도 행위이므로, 의례적 일반화보다 애도의 의미를 우선했습니다.
  doctrine_reference: 사무엘상·역대기 전승의 장례/애도 관행
