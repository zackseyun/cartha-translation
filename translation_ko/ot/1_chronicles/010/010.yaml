  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשִׂ֨ימוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית אֱלֹהֵי/הֶ֑ם וְ/אֶת גֻּלְגָּלְתּ֥/וֹ תָקְע֖וּ בֵּ֥ית דָּגֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
  footnotes:
  - marker: a
    text: Or 'his head.' The Hebrew term can refer to the skull or head, but 'skull' more precisely reflects the noun used here.
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of their gods' / 'the temple of Dagon.' The Hebrew literally says 'house,' a common term for a deity's temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그의 갑옷을 그들의 신들의 집에 두고, 그의 해골을 다곤의 집에 박아 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘머리’. 히브리어 용어는 해골이나 머리를 가리킬 수 있지만, 여기서는 ‘해골’이 더 정확합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 신전’ / ‘다곤 신전’. 히브리어는 문자적으로 ‘집’이라고 하며, 신의 신전을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  english_pob_choice: They put
  chosen_korean: 두고
  alternatives_korean:
  - 놓고
  - 두었습니다
  - 두었습니다
  lexicon: HALOT
  rationale: 히브리어 שׂים의 기본 뜻인 ‘두다/놓다’를 자연스러운 현대 문장으로 옮겼습니다. 동작의 결과 상태를 보여 주는 문맥이어서 ‘두다’가 적절합니다.
- source_word: כֵּלָיו
  english_pob_choice: his armor
  chosen_korean: 그의 갑옷
  alternatives_korean:
  - 그의 무기
  - 그의 장비
  - 그의 물품
  lexicon: HALOT
  rationale: 영어 POB의 개정처럼 전투용 장비 가운데 갑옷을 가리키는 읽기가 문맥상 가장 자연스럽습니다. ‘무기’보다 더 구체적으로, 전투 후 탈취된 군사 장비라는 점을 드러냅니다.
- source_word: בֵּית אֱלֹהֵיהֶם / בֵּית דָּגוֹן
  english_pob_choice: the house of their gods / the house of Dagon
  chosen_korean: 그들의 신들의 집 / 다곤의 집
  alternatives_korean:
  - 그들의 신전 / 다곤 신전
  - 그들의 신들의 성전 / 다곤 성전
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’을 유지해 히브리어 표현을 살렸습니다. ‘신전’도 가능하지만 원문의 어휘적 직설성을 보존하려고 ‘집’을 택했습니다.
- source_word: גֻּלְגָּלְתּוֹ
  english_pob_choice: his skull
  chosen_korean: 해골
  alternatives_korean:
  - 머리
  - 두개골
  lexicon: HALOT
  rationale: 히브리어 어휘가 머리보다 더 좁은 ‘두개골/해골’의 뜻을 가지므로, 한국어에서도 더 구체적인 ‘해골’을 선택했습니다. 시각적으로도 본문의 잔혹한 느낌을 과도하게 완화하지 않습니다.
- source_word: תָקְעוּ
  english_pob_choice: they fastened
  chosen_korean: 박아 두었습니다
  alternatives_korean:
  - 고정했습니다
  - 붙들어 매었습니다
  - 꽂아 두었습니다
  lexicon: HALOT
  rationale: 문맥상 단순 보관이 아니라 전시 목적의 고정입니다. ‘박아 두다’는 강한 부착·고정의 느낌을 주면서도 영어 POB의 ‘fastened’를 무리 없이 반영합니다.
theological_decisions:
- issue: 이방 신전과 우상 이름의 표기
  chosen_reading: ‘그들의 신들의 집’과 ‘다곤의 집’으로 옮겨, 원문의 우상숭배적 맥락을 그대로 드러냈습니다.
  alternative_readings:
  - ‘그들의 신전’
  - ‘다곤 신전’
  rationale: 본문은 사울의 패배를 단순한 전리품 보관이 아니라 이방 신들의 승리 과시로 묘사합니다. 그래서 완화된 종교 용어보다 원문의 직설성을 유지하는 쪽을 택했습니다.
  doctrine_reference: 우상숭배 서술의 직역 원칙
- issue: 신체 부위의 구체성
  chosen_reading: ‘해골’로 옮겨 원문의 더 직접적인 신체 표현을 살렸습니다.
  alternative_readings:
  - ‘머리’
  rationale: 영어 POB도 각주에서 ‘head’보다 ‘skull’이 더 정확하다고 밝혔습니다. 한국어에서도 이를 반영해 본문의 충격성과 구체성을 보존했습니다.
  doctrine_reference: 어휘-의미 정밀성
