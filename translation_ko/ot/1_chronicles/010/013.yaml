id: 1CH.10.13
reference: 1 Chronicles 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
  footnotes:
  - marker: a
    text: Or 'for the breach of faith in which he broke faith against the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''A medium'' refers to a person who seeks information from the dead or from spirits; compare 1 Samuel 28:7.'
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 사울은 야훼께 범죄하여 불충실하게 행한 그 불충실함 때문에 죽었습니다. 곧 야훼의 말씀을 지키지 않았고, 또 신접한 자에게 물어보았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불충실함’은 원문의 מָעַל/מָעַל의 언약적 배반을 드러내는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신접한 자’는 죽은 자나 영에게 묻는 매개자를 가리킵니다(삼상 28:7 참조).
    reason: cultural_note
lexical_decisions:
- source_word: בְּמַעֲלוֹ / מָעַל
  english_pob_choice: for his unfaithfulness by which he was unfaithful
  chosen_korean: 범죄하여 불충실하게 행한 그 불충실함
  alternatives_korean:
  - 그의 허물
  - 그가 저지른 배반
  - 그의 신실하지 못함
  lexicon: HALOT
  rationale: מָעַל의 핵심은 단순한 일반 범죄보다 언약적 불충실입니다. 한국어에서는 ‘불충실함’으로 의미를 살리되, 동사형 ‘불충실하게 행한’으로 영어의 반복 구조를 반영했습니다.
- source_word: בַּיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: WLC
  rationale: 본문은 신적 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮기고 여격 조사 ‘-께’를 붙여 사울의 불충실의 방향을 드러냈습니다.
- source_word: עַל דְּבַר יְהוָה
  english_pob_choice: because of the word of the LORD
  chosen_korean: 야훼의 말씀을 지키지 않았고
  alternatives_korean:
  - 야훼의 말씀 때문에
  - 야훼의 말씀에 관하여
  lexicon: HALOT
  rationale: 히브리어 구문은 앞의 불충실함을 구체화하는 설명절이므로, 다음 절의 ‘지키지 않았다’와 결합해 원문의 인과와 내용을 자연스럽게 드러냈습니다.
- source_word: שָׁמָר
  english_pob_choice: keep
  chosen_korean: 지키지 않았고
  alternatives_korean:
  - 관찰하지 않았고
  - 간수하지 않았고
  lexicon: HALOT
  rationale: 언약적 맥락에서 שָׁמָר는 ‘지키다/준수하다’가 가장 적절합니다. 한국어 성경 전통을 따르되 현대어로 자연스럽게 처리했습니다.
- source_word: לִשְׁאוֹל ... בָּאוֹב לִדְרֹשׁ
  english_pob_choice: he asked counsel of a medium, to inquire
  chosen_korean: 신접한 자에게 물어보았기 때문입니다
  alternatives_korean:
  - 무당에게 묻기 위해
  - 영매에게 문의했기 때문입니다
  lexicon: HALOT
  rationale: אוֹב는 죽은 자나 영에게 묻는 금지된 매개자를 가리키므로, 현대 독자가 이해할 수 있게 ‘신접한 자’로 옮겼습니다. ‘물어보다’는 לִדְרֹשׁ의 문의/상담 의미를 과도하게 약화하지 않으면서 자연스럽습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 언약 이름 יְהוָה를 직접 쓰므로, 프로젝트 기본값대로 ‘야훼’를 유지했습니다. 이는 일반적인 대체 칭호보다 본문의 신적 고유성을 더 분명히 드러냅니다.
  doctrine_reference: DOCTRINE.md Contested terms — יהוה / YHWH → 야훼
- issue: 사울의 죄에 대한 규정
  chosen_reading: 불충실함
  alternative_readings:
  - 허물
  - 배신
  rationale: 본문은 단순한 도덕적 실패가 아니라 야훼와 그의 말씀에 대한 언약적 불충실을 말합니다. 따라서 한국어에서도 ‘불충실함’을 중심어로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6; consistency of key terms §5
