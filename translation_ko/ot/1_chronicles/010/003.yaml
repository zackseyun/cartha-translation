  text: וַ/תִּכְבַּ֤ד הַ/מִּלְחָמָה֙ עַל שָׁא֔וּל וַ/יִּמְצָאֻ֖/הוּ הַ/מּוֹרִ֣ים בַּ/קָּ֑שֶׁת וַ/יָּ֖חֶל מִן הַ/יּוֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/003.yaml
  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
  footnotes:
  - marker: a
    text: Or, 'he was in great anguish because of the archers.' The Hebrew verb can be understood as severe distress rather than physical wounding.
    reason: lexical_alternative
translation:
  language: ko
  text: 전투가 사울을 향해 거세졌고, 활 쏘는 자들이 그를 찾아냈으며, 그는 활 쏘는 자들에 의해 상처를 입었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה עַל שָׁאוּל
  english_pob_choice: The battle grew heavy against Saul
  chosen_korean: 전투가 사울을 향해 거세졌고
  alternatives_korean:
  - 전투가 사울에게 무거워졌고
  - 전투가 사울을 압박했고
  lexicon: HALOT
  rationale: כבד의 ‘무거워지다’ 이미지를 살리되, 전투 문맥에서 자연스러운 한국어로 ‘거세지다’라고 옮겨 전투의 압박과 강도를 드러냈습니다.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  english_pob_choice: the archers
  chosen_korean: 활 쏘는 자들
  alternatives_korean:
  - 활잡이들
  - 활을 쏘는 자들
  lexicon: HALOT
  rationale: 직역하면 ‘활로 쏘는 자들’이지만, 한국어에서는 기능을 드러내는 ‘활 쏘는 자들’이 자연스럽고 원문의 군사적 행위를 보존합니다.
- source_word: וַיִּמְצָאֻהוּ
  english_pob_choice: found him
  chosen_korean: 그를 찾아냈으며
  alternatives_korean:
  - 그를 발견했으며
  - 그에게 닿았으며
  lexicon: HALOT
  rationale: מצא의 기본 의미를 따라 ‘찾아내다’로 옮겨, 전투 중 그를 결국 붙잡은 듯한 뉘앙스를 살렸습니다.
- source_word: וַיָּחֶל מִן הַיּוֹרִים
  english_pob_choice: he was badly wounded by the archers
  chosen_korean: 그는 활 쏘는 자들에 의해 상처를 입었습니다.
  alternatives_korean:
  - 그는 활 쏘는 자들에 의해 크게 상처를 입었습니다
  - 그는 활 쏘는 자들 때문에 괴로워했습니다
  lexicon: HALOT
  rationale: 형태상 난해한 וַיָּחֶל은 물리적 부상으로 읽는 POB의 선택을 따르되, 영어 개정에서 삭제된 ‘badly’를 과장 없이 반영해 ‘상처를 입었습니다’로 옮겼습니다.
theological_decisions:
- issue: וַיָּחֶל의 해석 범위
  chosen_reading: 물리적 부상으로 읽었습니다.
  alternative_readings:
  - 극심한 고통/공포를 뜻하는 내적 괴로움
  - 활 쏘는 자들 때문에 큰 고통을 겪음
  rationale: 본문의 전개와 병행 본문 전승을 고려할 때, 사울이 화살에 맞아 상처를 입었다는 읽기가 가장 직접적이며 서사 흐름에 부합합니다.
  doctrine_reference: 본문 서사 해석
