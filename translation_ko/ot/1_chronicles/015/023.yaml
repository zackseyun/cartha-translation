  source_fidelity: 히브리어 שֹׁעֲרִים는 복수의 ‘문지기들’이며, לָאָרוֹן은 언약궤에 대한 직무 배정 또는 그 곁의 위치를 나타낼 수 있습니다. 본문의 ‘언약궤를 맡은 문지기들’은 배정의 뜻을 자연스럽게 반영하되, 각주에서 가능한 위치적 이해를 보완해야 합니다.
  naturalness: ‘언약궤를 맡은 문지기들이었습니다’는 현대 표준 한국어의 합쇼체로 자연스럽습니다. 복수 직무자를 ‘문지기들’로 드러내는 편이 원문의 복수형에도 더 가깝습니다.
