  lexicon: HALOT
  rationale: 성소·성전 문맥에서 שערים는 단순한 경비보다 출입문을 맡는 직무를 가리키므로, 자연스러운 현대 한국어로 '문지기'를 택했습니다.
- source_word: לָאָרוֹן
  english_pob_choice: for the ark
  chosen_korean: 언약궤를 맡은
