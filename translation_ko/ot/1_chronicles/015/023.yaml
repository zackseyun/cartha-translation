  chosen_reading: 직무 배정으로 이해하여 '언약궤를 맡은'이라고 옮겼습니다.
  alternative_readings:
  - 언약궤 곁의
  - 언약궤 앞의
  - 언약궤를 위한
  rationale: 영어 POB도 'for the ark'로 임무 부여를 우선했고, 히브리어 ל의 문맥상 관계를 한국어에서 가장 분명하게 살리려면 책임의 배정을 드러내는 표현이 적절합니다.
  doctrine_reference: 성소 봉사 직무의 기능적 표현
