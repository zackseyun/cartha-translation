  text: 베레갸와 엘가나는 언약궤를 맡은 문지기들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약궤 곁의 문지기들’. 히브리어 전치사는 언약궤에 대한 직무 배정이나 그 곁의 위치를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּרֶכְיָה / אֶלְקָנָה
  english_pob_choice: Berechiah and Elkanah
  chosen_korean: 베레기야와 엘가나
