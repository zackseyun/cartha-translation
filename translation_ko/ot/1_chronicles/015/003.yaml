base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
  footnotes:
  - marker: a
    text: Or 'to Jerusalem'; Hebrew uses the preposition 'to,' but English commonly says people are assembled 'at' a place.
    reason: lexical_alternative
  - marker: b
    text: Or 'which he had prepared for him'; the pronoun could be rendered more literally, though in context it most naturally refers to the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 예루살렘에서 온 이스라엘을 모두 모아 야훼의 궤를 그가 그것을 위해 마련한 그곳으로 옮기게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예루살렘에서’는 히브리어 전치사 אֶל의 직역인 ‘예루살렘으로’보다 한국어에서 집회의 결과 장소를 더 자연스럽게 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것을 위해’는 대명사 목적어를 사물인 궤에 연결한 해석입니다. 히브리어 대명사는 문맥상 가장 자연스럽게 궤를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  english_pob_choice: assembled
  chosen_korean: 모아
  alternatives_korean:
  - 소집하여
  - 집결시켜
  lexicon: HALOT
  rationale: 히필형 קהל은 ‘모으다/집합하게 하다’의 뜻이므로, 자연스러운 현대 한국어 동사 ‘모아’로 옮겨 공개적인 집회를 간결하게 드러냈습니다.
- source_word: אֶל יְרוּשָׁלִָם
  english_pob_choice: at Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘으로
  - 예루살렘 안에서
  lexicon: HALOT
  rationale: 집결의 결과가 예루살렘이라는 장소에 형성된다는 점을 한국어에서는 ‘~에서’가 가장 자연스럽게 나타냅니다.
- source_word: אֲרוֹן יְהוָה
  english_pob_choice: the ark of Yahweh
  chosen_korean: 야훼의 궤
  alternatives_korean:
  - 야훼의 언약궤
  - 여호와의 궤
  lexicon: HALOT
  rationale: 본문의 ארון은 단순히 ‘궤’이며, יְהוָה는 POB 원칙에 따라 ‘야훼’로 옮겨 소스의 고유 이름을 보존했습니다.
- source_word: מְקוֹמוֹ
  english_pob_choice: its place
  chosen_korean: 그곳
  alternatives_korean:
  - 그 위치
  - 그 자리
  lexicon: HALOT
  rationale: 지시대명사와 장소명사 결합을 자연스럽게 풀어, 궤의 목적지를 가리키는 ‘그곳’으로 간결하게 표현했습니다.
- source_word: ל/וֹ
  english_pob_choice: for it
  chosen_korean: 그것을 위해
  alternatives_korean:
  - 그를 위해
  - 그에게
  lexicon: HALOT
  rationale: 문맥상 대명사의 선행사는 궤이므로, 대상이 사물임을 드러내는 ‘그것을 위해’로 번역해 모호성을 줄였습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 신성한 칭호가 아니라 언약 이름을 포함하므로, POB 방침에 따라 하나님의 고유 이름을 유지하는 쪽이 원문의 식별력을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
