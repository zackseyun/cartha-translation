base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/006.yaml
  text: 'For the sons of Merari: Asaiah the chief[a], and 220 of his brothers.'
  footnotes:
  - marker: a
    text: Or 'kinsmen' for 'brothers,' since the Hebrew term can refer more broadly to male members of the same clan or family group.
    reason: lexical_alternative
translation:
  language: ko
  text: 므라리의 아들들에게는 아사야가 우두머리였고, 그의 형제들이 이백이십 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 같은 씨족이나 가문 구성원까지 가리킬 수 있는 히브리어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי מְרָרִי
  english_pob_choice: For the sons of Merari
  chosen_korean: 므라리의 아들들에게는
  alternatives_korean:
  - 므라리의 아들들에 대하여는
  - 므라리의 자손들에게는
  lexicon: HALOT
  rationale: 목록의 항목을 자연스럽게 연결하면서도 히브리어의 족속/가문 표현을 살리기 위해 ‘아들들’로 옮겼습니다. 문맥상 도입 표지이므로 ‘에게는’으로 처리했습니다.
- source_word: עֲשָׂיָ֣ה הַ/שָּׂ֔ר
  english_pob_choice: Asaiah the chief
  chosen_korean: 아사야가 우두머리였고
  alternatives_korean:
  - 아사야가 지도자였고
  - 아사야가 장관이었고
  lexicon: HALOT
  rationale: שַׂר는 이 문맥에서 지위가 있는 ‘우두머리/지도자’의 뜻이 적절하며, 왕족 뉘앙스의 ‘군주’는 피했습니다. 한국어에서는 자연스럽게 서술하기 위해 ‘-였고’로 연결했습니다.
- source_word: וְ/אֶחָי/ו
  english_pob_choice: and 220 of his brothers
  chosen_korean: 그의 형제들이
  alternatives_korean:
  - 그의 동족들이
  - 그의 친족들이
  lexicon: HALOT
  rationale: 히브리어 אחים는 같은 씨족 구성원까지 넓게 가리킬 수 있지만, 본문과 POB의 기본 선택을 따라 가장 직접적인 ‘형제들’로 옮겼습니다.
- source_word: מָאתַ֥יִם וְ/עֶשְׂרִֽים
  english_pob_choice: '220'
  chosen_korean: 이백이십 명
  alternatives_korean:
  - 220명
  - 이백 스무 명
  lexicon: HALOT
  rationale: 히브리어 수사는 의미를 그대로 전달하는 것이 핵심이므로, 한국어 본문에서는 읽기 쉬운 한자어 수사 표현을 사용했습니다.
