  language: ko
  text: 그래서 제사장들과 레위인들이 야훼, 이스라엘의 하나님께 드릴 언약궤를 메어 올리기 위해 스스로를 거룩하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '스스로를 거룩하게 했습니다'이며, 다른 가능 번역으로는 '스스로를 성별했습니다'가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
