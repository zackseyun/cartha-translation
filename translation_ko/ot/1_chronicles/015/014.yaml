translation:
  language: ko
  text: 그래서 제사장들과 레위인들은 야훼, 이스라엘의 하나님의 궤를 올리기 위해 스스로를 거룩하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
