base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/007.yaml
  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
  footnotes:
  - marker: a
    text: Or 'Gershon,' following a more familiar traditional English form of the clan name; the Hebrew here reads Gershom.
    reason: alternative_reading
  - marker: b
    text: '''Brothers'' here refers to male members of the same Levitical family group, not necessarily Joel''s immediate siblings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게르손의 아들들은 요엘, 곧 그 우두머리와 그의 형제 130명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘게르손’은 한국어 성경에서 더 익숙한 전통형입니다. 히브리어 표기 자체는 Gershom입니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘형제’는 요엘의 직계 형제만이 아니라 같은 레위 씨족의 남성 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  english_pob_choice: For the sons of
  chosen_korean: 게르손의 아들들은
  alternatives_korean:
  - 게르손의 자손들은
  - 게르손의 아들들을 위하여
  lexicon: HALOT
  rationale: 목록을 여는 분배적 표현으로서, 문맥상 특정 레위 씨족을 가리키므로 한국어에서는 자연스럽게 ‘~의 아들들은’으로 옮겼습니다.
- source_word: גֵּרְשׁוֹם
  english_pob_choice: Gershom
  chosen_korean: 게르손
  alternatives_korean:
  - 게르솜
  lexicon: HALOT
  rationale: 히브리어 표기상 Gershom이지만, 레위 계통명은 전통적으로 게르손으로 더 널리 알려져 있어 한국어 독자의 식별성을 고려해 반영했습니다.
- source_word: הַ/שָּׂר
  english_pob_choice: the chief
  chosen_korean: 그 우두머리
  alternatives_korean:
  - 그 지도자
  - 그 수장
  lexicon: HALOT
  rationale: שַׂר의 핵심 의미를 살리되, 행정적·씨족 목록 문맥에서 위계와 대표성을 드러내는 한국어로 옮겼습니다.
- source_word: וְ/אֶחָי/ו
  english_pob_choice: and his brothers
  chosen_korean: 그리고 그의 형제
  alternatives_korean:
  - 그리고 그의 친족
  - 그리고 같은 씨족 사람들
  lexicon: HALOT
  rationale: 직역의 ‘형제’를 기본으로 유지하되, 이 용례가 즉시 직계 형제만을 뜻하지 않고 같은 레위 씨족 구성원을 포함할 수 있음을 문맥상 허용합니다.
theological_decisions:
- issue: 씨족/가문 명칭의 통용형과 본문형 사이의 긴장
  chosen_reading: 본문형에 가까운 ‘게르손’ 대신 통용성이 높은 ‘게르손’ 계열 표기를 사용하되, 다른 절에서의 전통형과 혼동되지 않도록 문맥을 유지했습니다.
  alternative_readings:
  - 게르솜
  - 그르솀
  rationale: 이 절은 레위 분파 목록의 식별이 중요하므로, 독자가 흔히 아는 한국어 성경 인명 관습을 일부 수용하되 본문의 씨족 표지를 흐리지 않도록 했습니다.
  doctrine_reference: 본문-문맥 우선 원칙
