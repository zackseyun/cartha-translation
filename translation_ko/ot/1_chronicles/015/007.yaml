  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
  footnotes:
  - marker: a
    text: Or 'Gershon,' following a more familiar traditional English form of the clan name; the Hebrew here reads Gershom.
    reason: alternative_reading
  - marker: b
    text: '''Brothers'' here refers to male members of the same Levitical family group, not necessarily Joel''s immediate siblings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게르솜 자손으로는 우두머리 요엘과 그의 형제 130명이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘게르손’은 이 레위 씨족 이름에 쓰이는 더 익숙한 전통적 표기입니다. 그러나 히브리어 본문은 ‘게르솜’(Gershom)이라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘형제’는 요엘의 친형제만이 아니라 같은 레위 씨족의 남성 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
