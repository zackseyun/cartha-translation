lexical_decisions:
- source_word: בִּנְבָלִים
  english_pob_choice: with harps
  chosen_korean: 수금으로
  alternatives_korean:
  - 하프로
  - 비파로
  lexicon: HALOT
  rationale: נבלים은 현악기를 가리키므로 한국어 성경의 자연스러운 대응인 ‘수금’을 사용해 음향 악기를 구체적으로 드러냈습니다. ‘-으로’는 영어 POB의 도구적 with를 반영합니다.
- source_word: עַל עֲלָמוֹת
  english_pob_choice: according to Alamoth
  chosen_korean: 아얄롯에 따라
  alternatives_korean:
  - 알라못에 따라
  - 처녀들에 따라
  - 고음으로
  lexicon: HALOT
  rationale: עֲלָמוֹת은 문자적으로는 ‘처녀들’과 관련되지만, 여기서는 음악 지시로 쓰인 것으로 보이므로 음역 ‘아얄롯’을 유지했습니다. ‘에 따라’는 POB의 according to를 옮겨 정확한 기술적 의미를 단정하지 않도록 합니다.
- source_word: וּזְכַרְיָה ... וּבְנָיָהוּ
  english_pob_choice: and Zechariah ... and Benaiah
  chosen_korean: 그리고 스가랴, 아시엘, 스미라못, 여히엘, 운니, 엘리압, 마아세야, 브나야
  alternatives_korean:
  - 그리고 스가랴, 아시엘, 스미라못, 여히엘, 운니, 엘리압, 마아세야, 베나야
  - 스가랴와 아시엘, 스미라못, 여히엘, 운니, 엘리압, 마아세야, 그리고 브나야
  lexicon: Korean biblical proper names
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 형태를 우선하고, 확립이 덜한 이름은 현대 음역으로 옮겼습니다. 마지막 이름 앞의 연결을 자연스러운 한국어 열거로 처리했습니다.
theological_decisions:
- issue: Musical term עֲלָמוֹת의 기술적 의미를 어디까지 밝힐지
  chosen_reading: 의미를 단정하지 않고 음역 ‘아얄롯’과 ‘에 따라’를 유지했습니다.
  alternative_readings:
  - ‘고음으로’처럼 기능을 풀어 옮김
  - ‘처녀들에 따라’처럼 문자적 의미를 반영
  rationale: 본문은 연주 지시를 전하지만 정확한 음악 용어의 범위는 확정하기 어렵습니다. 따라서 독자가 과도하게 의미를 고정하지 않도록 보수적으로 처리했습니다.
  doctrine_reference: '성경 번역 원칙: 불확실한 기술 용어는 확정적 해석보다 원문 보존을 우선'
