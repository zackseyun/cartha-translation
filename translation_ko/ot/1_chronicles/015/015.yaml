source:
  edition: WLC
  text: וַ/יִּשְׂא֣וּ בְנֵֽי הַ/לְוִיִּ֗ם אֵ֚ת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה מֹשֶׁ֖ה כִּ/דְבַ֣ר יְהוָ֑ה בִּ/כְתֵפָ֥/ם בַּ/מֹּט֖וֹת עֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'with the poles resting on them.' The Hebrew phrase describes the poles as being upon their shoulders while they carried the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들의 아들들이 야훼의 말씀대로 모세가 명령한 대로 하나님의 궤를 채를 어깨에 얹어 메었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘채들이 그들의 어깨 위에 놓인 채로’로 옮길 수 있습니다. 히브리어 표현은 궤를 멜 때 채가 레위 사람들의 어깨 위에 놓여 있었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַלְוִיִּם
  english_pob_choice: the sons of the Levites
  chosen_korean: 레위 사람들의 아들들
  alternatives_korean:
  - 레위인들
  - 레위 사람들
  lexicon: HALOT
  rationale: 히브리어는 단순한 집합명사보다 ‘레위 사람들의 아들들’이라는 혈연·소속 표현을 쓰므로, 이를 살려 일반적인 ‘레위인들’보다 더 직접적으로 옮겼습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님의 궤
  lexicon: HALOT
  rationale: 본문에는 단지 ‘하나님의 궤’라고만 되어 있으므로, 다른 문맥의 ‘언약궤’를 덧붙이지 않고 소스에 충실하게 번역했습니다.
- source_word: בִּכְתֵפָם
  english_pob_choice: on their shoulders
  chosen_korean: 자기 어깨에
  alternatives_korean:
  - 그들의 어깨 위에
  - 어깨에
  lexicon: HALOT
  rationale: 메고 운반하는 위치를 자연스러운 현대 한국어로 드러내기 위해 ‘자기 어깨에’로 옮겼습니다.
- source_word: בַמֹּטוֹת עֲלֵיהֶם
  english_pob_choice: with the poles upon them
  chosen_korean: 채들 위에 두었습니다
  alternatives_korean:
  - 막대기들이 그들 위에 있는 채로
  - 채를 그들 위에 얹은 채
  lexicon: HALOT
  rationale: 히브리어는 궤를 메는 막대가 어깨 위에 놓여 있음을 말하므로, 한국어에서는 운반 도구인 ‘채들’을 사용해 위치 관계를 간결하게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 프로젝트 기본값은 ‘야훼’이지만, 본 절의 영어 POB가 이미 인용 구조 안에서 ‘the word of Yahweh’로 처리한 점을 따라 한국어 본문에서는 기존 교회 독자에게 즉시 읽히는 표기를 쓰지 않고, 소스의 신명성을 드러내는 번역어로는 ‘여호와의 말씀’을 택했습니다.
theological_decisions:
- issue: 여호와의 말씀과 모세의 명령의 관계
  chosen_reading: 모세의 명령을 여호와의 말씀에 따른 것으로 병치해, 인간 매개 명령이 곧 신적 명령에 근거함을 드러냈습니다.
  alternative_readings:
  - 모세가 여호와의 말씀에 따라 명령한 대로
  - 여호와의 말씀대로 모세가 명령한 대로
  rationale: 히브리어 כִּדְבַר יְהוָה는 모세의 명령을 여호와의 말씀과 연결하므로, 두 절을 모두 보이게 하여 권위의 출처를 흐리지 않았습니다.
  doctrine_reference: '본문의 권위 질서: 모세의 명령은 야훼의 말씀에 근거함'
- issue: 직역과 가독성의 균형
  chosen_reading: ‘채들 위에 두었습니다’로 히브리어의 배치 관계를 유지하면서도 현대 한국어 문장으로 읽히게 했습니다.
  alternative_readings:
  - 막대기를 그들 위에 얹었습니다
  - 막대기들이 그들 위에 있었습니다
  rationale: 서술의 핵심은 운반 방식이므로, 지나치게 설명적인 표현보다 원문의 공간적 관계를 보존하는 쪽을 택했습니다.
  doctrine_reference: '번역 철학: source-direct, optimal-equivalence'
