  verdict: revise
  source_fidelity: 현 번역은 ‘채들 위에 두었습니다’라고 하여 궤를 채 위에 놓는 행위처럼 만들고, ‘자기 어깨에 멘 채’와 결합되어 운반 수단의 관계도 뒤바꿉니다. 히브리어는 레위 사람들의 어깨 위에 채를 얹어 궤를 멘 것을 말합니다. 또한 כִּדְבַר יְהוָה는 모세의 명령이 야훼의 말씀에 따른 것임을 나타냅니다.
  naturalness: ‘레위 사람들의 아들들’은 원문의 혈연·소속 표현을 보존하지만 다소 무겁습니다. 그러나 문장 전체는 ‘채를 어깨에 얹어 메었습니다’로 하면 현대 표준 한국어의 합쇼체로 자연스럽고 명료합니다.
  terminology: אֲרוֹן הָאֱלֹהִים은 ‘하나님의 궤’가 적절하며, 본문에 없는 ‘언약’을 보태지 않아야 합니다. יְהוָה는 제공된 프로젝트 결정 및 영어 감사 기록에 맞추어 ‘야훼’로 통일하는 것이 적절합니다. מֹטוֹת는 운반용 ‘채’로 옮길 수 있습니다.
