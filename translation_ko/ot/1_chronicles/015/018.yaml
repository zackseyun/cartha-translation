  source_fidelity: 히브리어의 בֵּן וְיַעֲזִיאֵל은 마소라 본문상 ‘벤’과 ‘야아시엘’을 접속사로 연결한 별개의 이름들로 읽는 것이 가장 직접적입니다. 따라서 영어 POB 감사 기록의 ‘Ben-Jaaziel’ 결합은 본문 표기와 맞지 않습니다. 또한 הַשֹּׁעֲרִים은 문맥상 마지막의 오벧에돔과 여이엘을 설명하는 것으로 자연스럽게 처리해야 합니다.
  naturalness: 초안의 ‘여이엘로서, 문지기들이었습니다’는 문장 결속이 부자연스럽고, ‘둘째 순번의 사람들’도 명단 소개 문맥에서는 다소 어색합니다. ‘둘째 반열에 속한 이들은’과 마지막 두 사람을 별도 절로 처리하면 현대 표준 한국어로 자연스럽습니다.
  terminology: ‘형제들’은 동료 레위인을 가리킬 수 있으나 원문의 표현을 보존하는 적절한 번역입니다. ‘둘째 반열’은 הַמִּשְׁנִים의 집단적 구분을 과도하게 서열화하지 않고 잘 드러냅니다. 인명은 한국어 성경의 통용 표기에 맞추어 엘리블레후, 믹네야, 오벧에돔으로 바로잡았습니다.
