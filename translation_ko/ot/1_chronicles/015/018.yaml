    rationale: WLC는 בֵּן 뒤에 접속사 וְ가 붙은 יַעֲזִיאֵל을 두어 ‘벤과 야아시엘’이라는 명단 구조를 제시합니다. 합성 이름으로 처리하면 원문의 인명 수와 접속 구조를 변경합니다.
