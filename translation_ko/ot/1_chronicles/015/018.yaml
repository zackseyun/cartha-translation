  text: וְ/עִמָּ/הֶ֖ם אֲחֵי/הֶ֣ם הַ/מִּשְׁנִ֑ים זְכַרְיָ֡הוּ בֵּ֡ן וְ/יַֽעֲזִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִ/יחִיאֵ֣ל וְ/עֻנִּ֡י אֱלִיאָ֡ב וּ/בְנָיָ֡הוּ וּ/מַֽעֲשֵׂיָ֡הוּ וּ/מַתִּתְיָהוּ֩ וֶ/אֱלִ֨יפְלֵ֜הוּ וּ/מִקְנֵיָ֨הוּ וְ/עֹבֵ֥ד אֱדֹ֛ם וִֽ/יעִיאֵ֖ל הַ/שֹּׁעֲרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
  footnotes:
  - marker: a
    text: Or 'their brothers, the second group' / 'their brothers of the second order.' The Hebrew expression likely distinguishes a secondary rank among the Levites or musicians.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 함께한 그들의 형제들, 곧 둘째 순번의 사람들은 스가랴, 벤-야아시엘, 스미라못, 여히엘, 운니, 엘리압, 브나야, 마아세야, 맛디댜, 엘리벨훼, 믹네야, 오벳-에돔, 여이엘로서, 문지기들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘둘째’는 단순 서수가 아니라 레위인이나 음악가들 가운데의 하위 구분을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם אֲחֵיהֶם
  english_pob_choice: And with them were their brothers
  chosen_korean: 그들과 함께한 그들의 형제들
  alternatives_korean:
  - 그들과 함께한 친족들
  - 그들과 함께 있던 그들의 형제들
  lexicon: HALOT
  rationale: 동반을 나타내는 וְעִמָּהֶם과 혈연/동류 관계를 나타내는 אֲחֵיהֶם을 함께 살리기 위해 직역에 가까운 ‘그들과 함께한 그들의 형제들’을 택했습니다.
- source_word: הַמִּשְׁנִים
  english_pob_choice: of the second rank
  chosen_korean: 둘째 순번의 사람들
  alternatives_korean:
  - 둘째 등급의 사람들
  - 두 번째 무리
  - 둘째 반열의 사람들
  lexicon: HALOT
  rationale: 문맥상 단순한 서수보다 레위인/문지기 집단의 구분을 가리키므로, 서열을 너무 단정하지 않으면서도 구분성을 드러내는 표현으로 옮겼습니다.
- source_word: בֵּן וְיַעֲזִיאֵל
  english_pob_choice: Ben-Jaaziel
  chosen_korean: 벤-야아시엘
  alternatives_korean:
  - 벤-자아시엘
  - 벤-여아시엘
  lexicon: SBL transliteration / modern Korean transliteration
  rationale: 영어 POB의 수정판처럼 בֵּן을 별도 인물로 나누지 않고 합성 고유명으로 보아 하이픈으로 처리했습니다.
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 문지기들
  - 문 앞을 지키는 사람들
  - 성문을 지키는 사람들
  lexicon: HALOT
  rationale: 성전 문맥에서 기능을 가장 직접적으로 드러내는 말은 ‘문지기들’이므로, ‘gatekeepers’의 표준적 현대 한국어 대응을 사용했습니다.
theological_decisions:
- issue: 명단의 종결 표지
  chosen_reading: 마지막의 הַשֹּׁעֲרִים을 명단 전체를 규정하는 호격이 아니라, 마지막 인물들까지 포함한 동일 직무 집단의 설명으로 처리했습니다.
  alternative_readings:
  - ‘...와 여이엘, 문지기들이었습니다’처럼 마지막 인물만 수식
  - ‘...와 여이엘, 그 문지기들이었습니다’처럼 전체 명단의 설명
  rationale: 히브리어 문장 구조와 영어 POB의 처리를 따라, 마지막 명단 뒤에 직무 설명이 붙는 것으로 읽는 편이 자연스럽습니다.
  doctrine_reference: 본문 구조/문법
