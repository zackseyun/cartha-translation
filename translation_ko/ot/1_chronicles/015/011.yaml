source:
  edition: WLC
  text: וַ/יִּקְרָ֣א דָוִ֔יד לְ/צָד֥וֹק וּ/לְ/אֶבְיָתָ֖ר הַ/כֹּֽהֲנִ֑ים וְ/לַ/לְוִיִּ֗ם לְ/אֽוּרִיאֵ֤ל עֲשָׂיָה֙ וְ/יוֹאֵ֣ל שְׁמַֽעְיָ֔ה וֶ/אֱלִיאֵ֖ל וְ/עַמִּינָדָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: ko
  text: 그때 다윗이 사독과 아비아달 곧 제사장들과 레위 사람들을 불렀습니다. 곧 우리엘, 아사야, 요엘, 스마야, 엘리엘, 아미나답입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘레위 사람들’ 앞의 ל는 소집의 대상을 표시합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called for
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: 여기서는 다윗이 특정 인물들을 자신 앞으로 오게 하도록 부르는 행위이므로, 간결하고 자연스러운 ‘불렀습니다’가 영어 POB의 ‘called for’와 원문의 소집 의미를 함께 살립니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 그 제사장들
  - 제사장들
  lexicon: HALOT
  rationale: 사독과 아비아달의 직분을 가리키는 말이므로 직역하되, 한국어에서는 반복되는 관사 기능을 따로 표시하지 않고 ‘제사장들’로 자연스럽게 옮겼습니다.
- source_word: וְלַלְוִיִּם
  english_pob_choice: and for the Levites
  chosen_korean: 레위 사람들을
  alternatives_korean:
  - 레위인들을
  - 그리고 레위 사람들을
  lexicon: HALOT
  rationale: 원문의 ל가 소집의 대상을 표시하므로, 한국어에서는 목적격으로 풀어 ‘레위 사람들을’이라고 옮겨 소환의 흐름을 분명히 했습니다.
- source_word: לְאוּרִיאֵל ... וְעַמִּינָדָב
  english_pob_choice: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab
  chosen_korean: 우리엘, 아사야, 요엘, 스마야, 엘리엘, 아미나답
  alternatives_korean:
  - 우리엘, 아사야, 요엘, 셰마야, 엘리엘, 암미나답
  lexicon: HALOT
  rationale: 인명은 현대 한국어 음역 관행에 따라 옮겼습니다. ‘שְׁמַעְיָה’는 한국어 성경에서 흔히 ‘스마야’로 쓰이는 전통적 표기를 반영했고, 나머지는 발음에 가깝게 음역했습니다.
theological_decisions:
- issue: 제사장들과 레위 사람들을 한 문장 안에서 어떻게 연결할지
  chosen_reading: 다윗이 사독과 아비아달 곧 제사장들과 레위 사람들을 모두 불러, 예배 행정에 필요한 인원을 함께 소집한 것으로 드러냈습니다.
  alternative_readings:
  - 제사장들만 따로 부르고 레위 사람들은 별도로 언급하는 읽기
  - 레위 사람들을 단순 정보열거로만 보는 읽기
  rationale: 원문은 제사장과 레위 사람들을 모두 다윗의 소집 대상로 제시하므로, 한국어에서도 두 집단이 함께 호출되었다는 점을 보존하는 것이 문맥상 중요합니다.
  doctrine_reference: 역대상 15장 문맥의 성전 행정과 예배 질서
