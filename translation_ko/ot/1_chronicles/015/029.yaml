source:
  edition: WLC
  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
  footnotes:
  - marker: a
    text: Or, 'rejoicing' or 'making merry' for 'celebrating.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 언약궤가 다윗의 성읍에 이르렀을 때, 사울의 딸 미갈이 창문으로 내다보다가 다윗 왕이 춤추며 즐거워하는[a] 것을 보고, 그녀는 마음속으로 그를 멸시하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘축제에 참여하는’ 또는 ‘흥겨워하는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 계약궤
  - 야훼의 증거궤
  lexicon: HALOT
  rationale: ‘아론 בְּרִית’는 ‘언약궤’가 자연스러운 관용구이며, יְהוָה는 본 항목의 원문 기반 관례에 따라 ‘야훼’로 옮겼습니다.
- source_word: בָּא עַד עִיר דָּוִיד
  english_pob_choice: came to the city of David
  chosen_korean: 다윗의 성읍에 이르렀을 때
  alternatives_korean:
  - 다윗의 성읍에 도착했을 때
  - 다윗의 성읍까지 왔을 때
  lexicon: HALOT
  rationale: בוא + עַד는 도착/도달의 뜻이므로 ‘이르렀을 때’가 자연스럽고, 서술 흐름도 잘 살립니다.
- source_word: מְרַקֵּד וּמְשַׂחֵק
  english_pob_choice: dancing and playing
  chosen_korean: 춤추며 즐거워하는
  alternatives_korean:
  - 춤추며 노는
  - 춤추며 뛰노는
  - 춤추며 장단을 맞추는
  lexicon: HALOT
  rationale: מְרַקֵּד는 ‘춤추다’가 직접적이고, מְשַׂחֵק은 이 행렬 맥락에서 단순한 놀이보다 공개적 기쁨/흥겨움이어서 ‘즐거워하는’이 과도한 해석 없이 의미를 전달합니다.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  english_pob_choice: and she despised him in her heart
  chosen_korean: 그녀는 마음속으로 그를 멸시하였습니다
  alternatives_korean:
  - 그녀는 속으로 그를 업신여겼습니다
  - 그녀는 마음에 그를 깔보았습니다
  lexicon: HALOT
  rationale: בזה는 강한 경멸/멸시를 뜻하므로 약화하지 않고 ‘멸시하다’로 옮겼고, בְּלִבָּהּ은 내면성을 드러내는 ‘마음속으로’로 처리했습니다.
theological_decisions:
- issue: 야훼의 직접 표기와 왕명 호칭의 결합
  chosen_reading: ‘야훼의 언약궤’와 ‘다윗 왕’을 함께 써서, 신적 임재의 도착과 왕의 행위를 대비적으로 드러냈습니다.
  alternative_readings:
  - ‘주님의 언약궤’
  - ‘다윗, 왕’의 더 직역적인 어순
  rationale: 이 구절은 언약궤의 도착과 미갈의 반응을 대조하므로, 원문이 강조하는 서술축을 흐리지 않도록 이름과 호칭을 자연스럽게 병렬했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
