base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
  footnotes:
  - marker: a
    text: Or 'to make them heard' / 'to sound aloud.' The Hebrew infinitive literally means 'to cause to be heard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 노래하는 사람들은 헤만과 아삽과 에단이었고, 청동 심벌로 소리가 들리게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “울리게 하다.” 히브리어 부정사는 문자적으로 “듣게 하다”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  english_pob_choice: The singers
  chosen_korean: 노래하는 이들
  alternatives_korean:
  - 노래꾼들
  - 가수들
  - 음악하는 이들
  lexicon: WLC participle of שׁרר/שׁיר
  rationale: 단순히 직업명을 붙이기보다, 문맥상 예배 음악을 맡은 사람들을 가리키므로 ‘노래하는 이들’이 자연스럽고 원문의 기능을 드러냅니다.
- source_word: בִּמְצִלְתַּיִם
  english_pob_choice: with cymbals
  chosen_korean: 놋제 심벌로
  alternatives_korean:
  - 심벌로
  - 놋 심벌로
  - 청동 심벌로
  lexicon: HALOT
  rationale: ב의 도구적 용법을 살려 ‘-로’로 옮기고, נְחֹשֶׁת의 금속 재질을 ‘놋제’로 표현해 악기의 재질을 분명히 했습니다.
- source_word: לְהַשְׁמִיעַ
  english_pob_choice: to sound aloud
  chosen_korean: 소리를 높여 내었습니다
  alternatives_korean:
  - 소리나게 하였습니다
  - 들리게 하였습니다
  - 큰소리로 울리게 하였습니다
  lexicon: HALOT
  rationale: 히필 부정사로서 ‘듣게 하다/들리게 하다’의 뜻이므로, 단순히 소리를 내는 것이 아니라 또렷하고 두드러지게 울리게 하는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 고유명사의 음역과 목록 구조
  chosen_reading: 헤만, 아삽, 그리고 에단
  alternative_readings:
