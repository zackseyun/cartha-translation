  to: 레위인들은 요엘의 아들 헤만과, 그의 형제들 가운데 베레갸의 아들 아삽과, 므라리의 아들들 가운데 그들의 형제인 구사야의 아들 에단을 세웠습니다.[a][b]
  rationale: 단일 동사 아래의 세 병렬 목적어라는 히브리어 구문을 한국어 문장 하나로 재구성했습니다. ‘그들의 형제인’은 אֲחֵיהֶם의 소유격 관계를 보존하며, 그 정확한 선행사를 과도하게 해석하지 않습니다. 본문의 씨족 표현과 각주 기능도 유지했습니다.
