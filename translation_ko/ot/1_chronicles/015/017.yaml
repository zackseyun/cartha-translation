  text: וַ/יַּעֲמִ֣ידוּ הַ/לְוִיִּ֗ם אֵ֚ת הֵימָ֣ן בֶּן יוֹאֵ֔ל וּ/מִ֨ן אֶחָ֔י/ו אָסָ֖ף בֶּן בֶּֽרֶכְיָ֑הוּ וּ/מִן בְּנֵ֤י מְרָרִי֙ אֲחֵי/הֶ֔ם אֵיתָ֖ן בֶּן קֽוּשָׁיָֽהוּ־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
  footnotes:
  - marker: a
    text: Or 'set in place' / 'stationed'; the Hebrew verb can denote causing someone to stand in an assigned role.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the sons of Merari'; that is, from the Merarite clan.
    reason: cultural_note
translation:
  language: ko
  text: 레위인들은 헤만—요엘의 아들—을 세우고, 그의 형제들 가운데에서는 아삽—베레갸의 아들—을, 그리고 므라리의 아들들 가운데, 곧 그들의 형제들 가운데에서는 에단—구사야의 아들—을 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘세우다’ 외에도 ‘정해진 자리로 서게 하다’, ‘직분에 배치하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘므라리의 아들들 가운데’입니다. 즉, 므라리 계열의 레위 씨족을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 지정했습니다
  - 배치했습니다
  lexicon: HALOT
  rationale: 히필 어간은 단순한 ‘서다’가 아니라 어떤 사람을 맡은 자리/역할에 두게 하는 뜻이므로, 문맥상 레위인의 조직 행위를 자연스럽게 드러내는 ‘세우다’를 택했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위인들은
  alternatives_korean:
  - 레위 사람들은
  - 레위 지파 사람들은
  lexicon: HALOT
  rationale: 정체성 표지가 분명한 집단명으로서 한국어 성경 관용과 가독성을 함께 살려 ‘레위인들’을 사용했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 아들인
  - 의 아들
  lexicon: HALOT
  rationale: 족보 표지인 בן은 관계를 직접 드러내므로, 이름 사이에서 간결한 ‘아들’로 옮겨 계보 구조를 보존했습니다.
- source_word: וּמִן אֶחָיו / אֲחֵיהֶם
  english_pob_choice: from his brothers / their brothers
  chosen_korean: 그의 형제들 가운데 / 그들의 형제들 가운데
  alternatives_korean:
  - 그의 형제들 중에서
  - 그들의 친족들 가운데
  lexicon: HALOT
  rationale: מן의 선택 범위 뉘앙스를 살리기 위해 단순 소유격보다 ‘가운데’로 옮겼고, חֲמָיו가 아닌 ‘형제들’의 직접 의미를 유지했습니다.
- source_word: וּמִן בְּנֵי מְרָרִי
  english_pob_choice: and from the sons of Merari
  chosen_korean: 그리고 므라리의 아들들 가운데
  alternatives_korean:
  - 그리고 므라리 자손들 가운데
  - 그리고 므라리인들 가운데
  lexicon: HALOT
  rationale: 본문의 문자적 족보 표현을 그대로 드러내는 것이 문맥상 더 투명하므로, POB와 같이 씨족적 표현을 유지했습니다.
theological_decisions:
- issue: 레위인들 사이의 선출/지정 표현
  chosen_reading: 단순한 행정 임명이라기보다, 예배 음악 직무를 맡도록 레위인들이 특정 인물들을 공식적으로 세운 것으로 옮겼습니다.
  alternative_readings:
  - 레위인들이 그들을 선출했습니다
  - 레위인들이 그들을 조직했습니다
  rationale: 문맥은 제사장적 예배 질서 안에서의 공식 지정이므로, 권위 있는 직무 부여의 의미를 살리는 번역이 더 적절합니다.
  doctrine_reference: 역대상 15장 문맥의 성전 예배 질서
