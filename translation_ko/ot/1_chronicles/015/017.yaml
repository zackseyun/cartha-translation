    rationale: אֲחֵיהֶם은 ‘므라리의 아들들’을 다시 풀이하는 ‘곧’ 절이라기보다 병렬된 관계 표지입니다. ‘므라리의 아들들 가운데 그들의 형제인 …’으로 옮기면 원문의 표현을 보존하면서도 자연스럽습니다.
