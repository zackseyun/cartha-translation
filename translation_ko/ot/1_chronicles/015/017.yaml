  source_fidelity: 초안은 인명과 계보 관계, 그리고 레위인들이 세 사람을 공식 직무에 세웠다는 핵심 뜻을 대체로 충실히 전달합니다. 다만 히브리어에는 동사 하나가 세 명의 목적어에 걸리는데, 초안은 마지막에 ‘세웠습니다’를 반복하여 구조를 불필요하게 나눕니다. 또한 ‘므라리의 아들들 가운데, 곧 그들의 형제들 가운데’는 원문의 병렬적 관계를 한국어에서 부자연스럽고 다소 혼동되게 만듭니다.
  naturalness: 이름을 대시로 삽입하고 마지막 동사를 반복하는 방식보다, 세 인물을 한 문장의 병렬 목적어로 배열하는 편이 현대 표준 한국어 합쇼체에서 훨씬 자연스럽습니다. ‘그들의 형제인’은 원문의 소유격이 지닌 선행사상의 여지를 보존합니다.
  terminology: ‘레위인들’, ‘므라리의 아들들’, ‘아들’, 그리고 인명 표기는 적절합니다. ‘세웠습니다’는 이 문맥에서 직무에 두거나 임명했다는 뜻을 무리 없이 전달하며, 각주로 가능한 의미 범위를 보완할 수 있습니다.
