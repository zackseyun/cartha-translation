base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
  footnotes:
  - marker: a
    text: Or 'were sounding the trumpets.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for these trumpets often refers to the straight priestly trumpets used in worship.
    reason: cultural_note
  - marker: c
    text: Or 'doorkeepers for the ark.'
    reason: lexical_alternative
translation:
  language: ko
  text: 스바냐, 여호사밧, 느다넬, 아마새, 스가랴, 브나야, 엘리에셀이 제사장으로서 야훼의 궤 앞에서 나팔을 불고 있었고, 오벧에돔과 여히야는 궤의 문지기였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나팔을 불고 있었습니다.’
    reason: lexical_alternative
  - marker: b
    text: 여기서 나팔은 예배에 쓰이던 곧은 제사장 나팔을 가리키는 경우가 많습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘궤의 문지기들이었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장으로서
  alternatives_korean:
  - 제사장들이
  - 그 제사장들은
  lexicon: HALOT
  rationale: 열거된 인물들이 제사장 집단에 속함을 분명히 하면서, 한국어에서는 서술어 자리에 자연스럽게 붙는 부사격 표현으로 처리했습니다.
- source_word: מחצצרים בַּחֲצֹצְרֹות
  english_pob_choice: were blowing the trumpets
  chosen_korean: 나팔을 불고 있었고
  alternatives_korean:
  - 나팔을 불고 있었고
  - 나팔을 불었고
  - 나팔 소리를 내고 있었고
  lexicon: HALOT
  rationale: 분사형의 지속·동시 진행 뉘앙스를 살리기 위해 ‘불고 있었고’를 택했고, 원문의 제의적 나팔이라는 점은 문맥상 ‘나팔’로 충분히 드러납니다.
- source_word: לִפְנֵי אֲרוֹן הָאֱלֹהִים
  english_pob_choice: before the ark of God
  chosen_korean: 야훼의 궤 앞에서
  alternatives_korean:
  - 하나님의 궤 앞에서
  - 하나님의 언약궤 앞에서
  lexicon: HALOT
  rationale: 본문의 אֱלֹהִים은 일반적 ‘하나님’이지만, 이 장의 궤가 야훼의 임재를 상징하는 예배 맥락임을 반영해 ‘야훼의 궤’로 옮겼습니다.
- source_word: שֹׁעֲרִים לָאָרוֹן
  english_pob_choice: gatekeepers for the ark
  chosen_korean: 궤의 문지기였습니다
  alternatives_korean:
  - 궤의 문지기였습니다
  - 궤를 지키는 자들이었습니다
  - 궤의 문지기 역할을 했습니다
  lexicon: HALOT
  rationale: POB의 ‘gatekeepers’는 성전 직무의 문지기라는 기능을 나타내므로 ‘문지기’가 가장 직접적이며, לָאָרוֹן의 관계를 ‘궤의’로 자연스럽게 풀었습니다.
- source_word: וְעֹבֵד אֱדֹם וִיחִיָּה
  english_pob_choice: Obed-edom and Jehiah
  chosen_korean: 오벧에돔과 여히야
  alternatives_korean:
  - 오벧에돔과 여히야
  - 오벳에돔과 여하야
  lexicon: BHS onomastics / standard Korean biblical forms
  rationale: 널리 쓰이는 한국어 성경형 이름을 우선하되, 히브리어 음가에 비교적 가까운 형태를 유지했습니다.
theological_decisions:
- issue: 아론의 궤를 ‘하나님의 궤’가 아니라 ‘야훼의 궤’로 옮길지 여부
  chosen_reading: ‘야훼의 궤’로 번역했습니다.
  alternative_readings:
  - 하나님의 궤
  - 하나님의 언약궤
  rationale: 히브리어 אֱלֹהִים의 직역만 따르면 일반명사처럼 보일 수 있으나, 본문은 야훼의 임재와 예배 행위가 중심인 언약궤 장면이므로 POB의 야훼 표기를 따라 신학적 초점을 분명히 했습니다.
  doctrine_reference: 언약궤/야훼 임재의 성서신학
