source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
  footnotes:
  - marker: a
    text: Or, “Consecrate yourselves.” The Hebrew verb refers to ritual sanctification.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. “너희는 레위 사람들의 조상 가문 우두머리들입니다. 너희와 너희 형제들은 자신을 성별하십시오.[a] 그리고 이스라엘의 하나님 야훼의 궤를 내가 그것을 위해 준비한 곳으로 올려 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 자신을 거룩하게 하십시오.” 히브리어 동사는 의례적 성별을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  english_pob_choice: the heads of the fathers’ houses of the Levites
  chosen_korean: 레위 사람의 조상 집들의 우두머리들
  alternatives_korean:
  - 레위 사람의 아버지 집들의 우두머리들
  - 레위 사람의 가문 우두머리들
  lexicon: HALOT
  rationale: 지파·가문 구조를 드러내는 רָאשֵׁי הָאָבוֹת를 한국어로는 ‘조상 집들’로 옮겨, 단순한 ‘가족’보다 히브리 사회 구조를 더 투명하게 보이게 했습니다.
- source_word: הִתְקַדְּשׁוּ
  english_pob_choice: Sanctify yourselves
  chosen_korean: 거룩하게 하여
  alternatives_korean:
  - 자신을 성별하여
  - 스스로를 거룩하게 하여
  lexicon: HALOT
  rationale: 히트파엘의 의례적 정결·성별 의미를 살리되, 현대 한국어 문맥에서 자연스러운 명령형으로 풀어 ‘거룩하게 하여’로 옮겼습니다.
- source_word: וְהַעֲלִיתֶם
  english_pob_choice: bring up
  chosen_korean: 메고 올라가십시오
  alternatives_korean:
  - 올려 가십시오
  - 가져 올라가십시오
  lexicon: HALOT
  rationale: 궤 운반의 실제 동작을 반영하기 위해 ‘올라가다’보다 ‘메고 올라가다’를 택해, 언약궤를 물리적으로 옮기는 뉘앙스를 드러냈습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 야훼 하나님, 이스라엘의 하나님
  alternatives_korean:
  - 야훼, 이스라엘의 하나님
  - 여호와 하나님, 이스라엘의 하나님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יְהוָה는 ‘야훼’로 옮기고, 동격구 ‘하나님, 이스라엘의 하나님’을 그대로 유지해 신명과 호칭을 분리해 보이게 했습니다.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  english_pob_choice: to the place I have prepared for it
  chosen_korean: 내가 그것을 위해 준비한 곳으로
  alternatives_korean:
  - 내가 그것을 위해 마련한 곳으로
  - 내가 준비해 둔 곳으로
  lexicon: HALOT
  rationale: 본문에 명시되지 않은 ‘곳’은 문맥상 필수이므로 자연스럽게 보충하되, ‘준비한’으로 히브리어 완료형의 성격을 살렸습니다.
theological_decisions:
- issue: 공식 발화의 존댓말과 인용문 내부 명령형 처리
  chosen_reading: 서술문은 합쇼체로, 인용문 안의 직접 명령은 공적 지시의 성격에 맞게 ‘하십시오’체로 처리했습니다.
  alternative_readings:
  - 인용문 전체를 평서형으로 통일
  - 더 격식 있는 옛말 종결
  rationale: 다윗의 지시가 군중 설교가 아니라 제의적 명령이므로, 현대 표준어의 공적 명령형이 원문의 기능을 가장 잘 전달합니다.
  doctrine_reference: Narrative register and direct speech conventions in Korean
- issue: 야훼의 이름을 본문에 직접 드러낼지 여부
  chosen_reading: 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’으로 순화
  - ‘여호와’로 전통화
  rationale: 히브리어 본문에 יְהוָה가 직접 나오며, POB 원칙상 신명은 가려 쓰지 않고 원문 가시성을 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
