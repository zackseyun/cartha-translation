translation:
  language: ko
  text: 하나님이 레위 사람들, 곧 야훼의 언약궤를 메고 있던 사람들을 도우시는 가운데, 그들은 수송아지 일곱 마리와 숫양 일곱 마리를 제물로 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
