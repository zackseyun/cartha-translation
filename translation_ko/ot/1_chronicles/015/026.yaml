translation:
  language: ko
  text: 하나님이 야훼의 언약궤를 메고 있던 레위 사람들을 도우셨을 때, 그들은 수송아지 일곱 마리와 숫양 일곱 마리를 제물로 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּעְזֹר הָאֱלֹהִים
  english_pob_choice: when God helped
  chosen_korean: 하나님이 … 도우시는 가운데
  alternatives_korean:
  - 하나님이 도우실 때
  - 하나님이 도우실 때에
  lexicon: HALOT
  rationale: בְּ + infinitive construct는 시간적 상황을 나타내므로, 단순한 과거 서술보다 진행 중인 상황을 드러내는 ‘…도우시는 가운데’가 자연스럽고 원문의 흐름을 잘 살립니다.
- source_word: הַלְוִיִּם נֹשְׂאֵי
  english_pob_choice: the Levites who were carrying
  chosen_korean: 레위 사람들, 곧 … 메고 있던 사람들
  alternatives_korean:
  - 레위 사람들, 곧 … 나르고 있던 사람들
  - 레위 사람들, 곧 … 메고 가던 사람들
  lexicon: HALOT
  rationale: נֹשְׂאֵי는 ‘지고/메는 사람들’이라는 분사이므로, 언약궤에 대해 한국어 성서 문맥에 익숙한 ‘메다’를 사용하되, 진행 중인 동작을 위해 ‘메고 있던’으로 옮겼습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 계약궤
  - 야훼의 언약궤
  lexicon: HALOT
  rationale: בְּרִית는 관용적으로 ‘언약’이며, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ‘언약궤’는 한국어에서 가장 직결되는 합성 표현입니다.
- source_word: וַיִּזְבְּחוּ
  english_pob_choice: they sacrificed
  chosen_korean: 제물로 드렸습니다
  alternatives_korean:
  - 희생제사를 드렸습니다
  - 희생으로 바쳤습니다
  lexicon: HALOT
  rationale: זבח의 제의적 의미를 살리면서도 한국어에서 자연스러운 제사 문맥을 위해 ‘제물로 드리다’를 택했습니다. 단순한 ‘죽였다’가 아니라 제의 행위를 분명히 합니다.
theological_decisions:
- issue: ‘주’가 아니라 고유명사 ‘야훼’로 표기하는지
  chosen_reading: 본문의 יְהוָה는 고유명사로서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 프로젝트는 예외가 없는 한 Tetragrammaton을 제목이 아니라 이름으로 드러내는 원칙을 따르므로, 여기서도 문맥상 인용형이 아니라 본문 표지로 ‘야훼’를 사용합니다.
  doctrine_reference: Tetragrammaton rendering policy
