base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/005.yaml
  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
  footnotes:
  - marker: a
    text: Or 'his kinsmen'; 'brothers' here likely refers to fellow members of the Kohathite clan, not necessarily only biological siblings.
    reason: lexical_alternative
translation:
  language: ko
  text: 고핫 자손에게는 우르엘이 수장이며, 그의 형제는 120명입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 형제들’은 여기서 고핫 씨족의 동료 구성원을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קְהָת
  english_pob_choice: For the sons of Kohath
  chosen_korean: 고핫 자손에게는
  alternatives_korean:
  - 고핫의 아들들에게는
  - 고핫 자손들에 대하여
  lexicon: HALOT
  rationale: 목록 문맥에서 לִ은 해당 분파를 소개하는 표지로 보이며, בני는 혈통뿐 아니라 집단을 가리키므로 ‘자손’이 자연스럽고 합쇼체 서술에도 잘 맞습니다.
- source_word: הַשָּׂר
  english_pob_choice: the chief
  chosen_korean: 수장
  alternatives_korean:
  - 지도자
  - 우두머리
  - 족장
  lexicon: HALOT
  rationale: שַׂר는 행정적·집단적 우두머리를 가리키므로, 왕족 뉘앙스가 강한 ‘왕자’보다 중립적인 ‘수장’이 이 목록의 의미를 더 잘 드러냅니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제는
  alternatives_korean:
  - 그의 친족은
  - 그의 동료들은
  lexicon: HALOT
  rationale: 직역상 ‘형제들’이지만, 문맥상 같은 고핫 분파의 구성원을 가리킬 수 있으므로 본문에는 ‘형제’로 두고, 집단적 의미는 문맥이 받치게 했습니다.
theological_decisions:
- issue: 분파 명단에서의 호칭 방식
  chosen_reading: 제의적·행정적 명단으로 읽고, ‘수장’과 숫자 표기를 통해 소속 집단의 조직성을 살렸습니다.
  alternative_readings:
  - ‘지도자’로 완화하여 일반적 리더십으로 읽는 방식
  - ‘족장’으로 전통적 가문 수장으로 읽는 방식
  rationale: 본문은 레위 분파의 인원 배치 명단이므로, 서술을 신학적으로 확대하지 않고 조직적 배치를 드러내는 번역이 원문 의도에 가깝습니다.
  doctrine_reference: 민수기 3장, 4장과 역대기 15장의 레위인 편성 문맥
- issue: אֶחָיו의 범위
  chosen_reading: ‘형제’라는 직접 표현을 유지하되, 여기서는 생물학적 형제에만 한정되지 않는 같은 씨족 구성원까지 포함할 수 있는 표현으로 처리했습니다.
  alternative_readings:
  - ‘친족’으로 명시해 혈연 범위를 넓히는 방식
  - ‘동료’로 바꾸어 집단성을 강조하는 방식
  rationale: POB의 영어 주석이 이미 씨족 구성원 가능성을 밝혔으므로, 본문은 원어의 직접성을 유지하고 해석 여지는 주석에 맡기는 편이 더 투명합니다.
  doctrine_reference: 레위 지파 내부의 씨족 용례와 집단 명칭 관례
