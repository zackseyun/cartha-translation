translation:
  language: ko
  text: 맛디댜와 엘리블레후와 믹네야와 오벧에돔과 여이엘과 아사시야는 비파로 셰미닛에 맞추어 인도하도록 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘셰미닛’은 정확한 뜻이 확실하지 않은 음악 용어입니다. ‘여덟째에 따라’ 또는 ‘저음역으로’라고 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַתִּתְיָהוּ ... וַעֲזַזְיָהוּ
  english_pob_choice: Mattithiah ... Azaziah
  chosen_korean: 맛디댜 … 아사사야
  alternatives_korean:
  - 맛디디야 … 아자지야
  - 맛디디야후 … 아자자후
  lexicon: 고유명사 표기 정책
  rationale: 히브리어 인명을 현대 한국어 음역으로 옮기되, 한국 성경에서 널리 알려진 형태와 원어 자음을 함께 고려해 자연스럽게 표기했습니다.
- source_word: בְּכִנֹּרוֹת
  english_pob_choice: with lyres
  chosen_korean: 비파를 들어
  alternatives_korean:
  - 비파로
  - 수금으로
  lexicon: HALOT
  rationale: כִּנּוֹר는 현대 학술 용례상 ‘비파’가 가장 가까우므로, 도구격 ב를 살려 연주 수단을 자연스럽게 표현했습니다.
- source_word: עַל הַשְּׁמִינִית
  english_pob_choice: according to the Sheminith
  chosen_korean: 셰미닛에 따라
  alternatives_korean:
  - 여덟째에 따라
  - 저음역에 따라
  lexicon: HALOT
  rationale: 이 표현은 기술적 음악 용어로서 정확한 뜻이 불확실하므로, 음역어를 유지해 불확실성을 보존하고 ‘따라’로 기능을 드러냈습니다.
- source_word: לְנַצֵּחַ
  english_pob_choice: were to lead
  chosen_korean: 인도하는 사람이었습니다
  alternatives_korean:
  - 지휘하는 사람이었습니다
  - 이끄는 사람이었습니다
  lexicon: HALOT
  rationale: 음악 문맥에서 נצח는 단순히 ‘이기다’가 아니라 편성·연주를 주도하고 지휘하는 뜻이므로, 관계절로 풀어 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 음악 지시어의 불확실성 보존
  chosen_reading: ‘셰미닛’은 번역어로 단정하지 않고 음역해, 원문의 기술적·모호한 성격을 유지했습니다.
  alternative_readings:
  - ‘여덟째’로 해석
  - ‘저음역’으로 해석
  rationale: 본문은 특정 악상 지시를 전제하지만 의미가 확정되지 않으므로, 해석을 과도하게 고정하지 않는 것이 원문 충실에 더 가깝습니다.
  doctrine_reference: 성경 번역의 원문 충실성과 해석 유보 원칙
- issue: 명단 구문의 서술 방식
  chosen_reading: ‘…는 비파를 들어 셰미닛에 따라 인도하는 사람이었습니다’로, 명단 속 기능을 서술적으로 풀었습니다.
  alternative_readings:
  - ‘…는 …로 인도하는 자들이었습니다’
  - ‘…는 …를 지휘하였습니다’
  rationale: 히브리어 목적/역할 표지를 한국어에서 자연스럽게 드러내면서도, 지나치게 직함화하지 않고 문맥상 음악적 역할을 분명히 했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
