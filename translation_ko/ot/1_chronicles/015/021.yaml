  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
  footnotes:
  - marker: a
    text: Or 'with lyres on the eighth' or 'with lyres in the lower octave.' The Hebrew phrase 'according to the Sheminith' is a musical term whose precise meaning is uncertain.
