  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְנַנְיָ֥הוּ שַֽׂר הַ/לְוִיִּ֖ם בְּ/מַשָּׂ֑א יָסֹר֙ בַּ/מַּשָּׂ֔א כִּ֥י מֵבִ֖ין הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
  footnotes:
  - marker: a
    text: Or 'directed the singing ... because he was skillful in it.' The Hebrew word מַשָּׂא usually means 'burden' or 'carrying,' but some take it here in a musical sense because of the surrounding references to singers and musicians.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew repeats the same noun: ''in the carrying ... in the carrying.'' The translation renders the second occurrence idiomatically as ''at it.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위 사람들의 우두머리인 그나냐는 운반을 감독했습니다[a]. 그는 그것에 능숙했기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노래를 감독했습니다… 그것에 능숙했기’로도 옮길 수 있습니다. 히브리어 마사(מַשָּׂא)는 보통 ‘짐, 운반’을 뜻하지만, 주변의 노래하는 사람들과 음악가 언급 때문에 여기서는 음악적 의미로 이해하는 견해도 있습니다.
    reason: alternative_reading
  - marker: b
    text: '히브리어는 같은 명사를 반복합니다: ‘운반에서 … 운반에서.’ 번역에서는 두 번째를 관용적으로 ‘그것에’로 옮겼습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  english_pob_choice: Chenaniah
  chosen_korean: 그나냐
  alternatives_korean:
  - 체나니아
  - 케나니야
  lexicon: 고유명사 음역
  rationale: 히브리어 인명은 현대 한국어 외래어 표기 관행에 따라 음역하되, 한국어 성경에서 비교적 자연스러운 형태인 ‘그나냐’를 택했습니다.
- source_word: שַׂר הַלוִיִּם
  english_pob_choice: chief of the Levites
  chosen_korean: 레위 사람들의 우두머리
  alternatives_korean:
  - 레위인들의 감독
  - 레위 사람들의 지도자
  - 레위 사람들의 수장
  lexicon: HALOT
  rationale: שַׂר은 행정·직무 맥락에서 ‘우두머리/지도자’의 뜻이므로, 직역보다 자연스럽게 그의 감독적 지위를 드러내는 표현을 택했습니다.
- source_word: בְּמַשָּׂא / בַּמַּשָּׂא
  english_pob_choice: the carrying / at it
  chosen_korean: 운반을 / 그것에
  alternatives_korean:
  - 짐 나름을 / 그 일에
  - 나르는 일을 / 그 일에
  - 운반하는 일에 / 운반하는 일에
  lexicon: HALOT
  rationale: 마사(מַשָּׂא)는 기본적으로 ‘짐, 운반’의 뜻이므로 본문 흐름에 따라 ‘운반’으로 옮겼고, 두 번째 반복은 한국어에서 자연스럽게 ‘그것에’로 처리해 반복을 살렸습니다.
- source_word: מֵבִין הוּא
  english_pob_choice: he was skillful
  chosen_korean: 능숙했기
  alternatives_korean:
  - 이해했기
  - 분별력이 있었기
  - 숙련되어 있었기
  lexicon: HALOT
  rationale: בין의 분사형은 단순한 지적 이해보다 실제적 숙련과 능숙함을 가리키므로, 문맥에 맞게 ‘능숙하다’로 번역했습니다.
theological_decisions:
- issue: מַשָּׂא의 의미가 운반인지 음악인지
  chosen_reading: 본문은 우선 ‘운반’으로 번역하고, 음악적 해석은 각주로만 제시합니다.
  alternative_readings:
  - ‘노래/노래하는 일’로 이해하는 해석
  rationale: 주변 문맥에 음악가 언급이 있어 음악적 독법이 가능하지만, 히브리어의 가장 직접적인 의미와 서술 문맥을 본문에 반영하는 것이 우선이므로 운반을 기본값으로 유지했습니다.
  doctrine_reference: 본문 해석의 우선순위와 다의어 처리
