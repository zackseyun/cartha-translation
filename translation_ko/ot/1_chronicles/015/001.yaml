reference: 1 Chronicles 15:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
  footnotes:
  - marker: a
    text: Or, 'and pitched a tent for himself.' The Hebrew suffix can be read as referring either to the ark or to David, though the immediate context favors the ark.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 다윗의 성에 자신을 위하여 집들을 짓고, 하나님의 궤를 위한 자리를 마련하고, 그것을 위하여 장막을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 자신을 위하여 장막을 쳤습니다.’ 히브리어 접미사는 궤나 다윗을 가리킬 수 있지만, 바로 앞 문맥은 궤를 가리키는 쪽을 더 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ / בָתִּים
  english_pob_choice: made houses
  chosen_korean: 집들을 짓고
  alternatives_korean:
  - 집들을 만들고
  - 거처들을 마련하고
  - 건물들을 지어
  lexicon: HALOT
  rationale: עשה는 넓게 ‘하다/만들다’이지만, כאן은 בָתִּים와 결합해 주거용 구조물을 가리키므로 한국어에서는 자연스럽게 ‘짓다’로 옮기되 복수는 ‘집들을’로 드러냈습니다.
- source_word: בְּעִיר דָּוִיד
  english_pob_choice: in the city of David
  chosen_korean: 다윗의 성에
  alternatives_korean:
  - 다윗 성에
  - 다윗의 도시 안에
  lexicon: HALOT
  rationale: 지명구는 관용적인 성경 한국어 표현을 따르되, 원문의 고유명사적 지시를 유지하도록 ‘다윗의 성’으로 옮겼습니다.
- source_word: וַיָּכֶן מָקוֹם לַאֲרוֹן הָאֱלֹהִים
  english_pob_choice: he prepared a place for the ark of God
  chosen_korean: 하나님의 궤를 위한 곳을 준비하고
  alternatives_korean:
  - 하나님의 궤를 위한 자리를 마련하고
  - 하나님의 궤가 들어갈 장소를 준비하고
  lexicon: HALOT
  rationale: כּוּן의 ‘준비하다/마련하다’ 의미를 살려 ‘곳’을 직역에 가깝게 두었고, אֲרוֹן הָאֱלֹהִים은 한국어 성경의 익숙한 ‘하나님의 궤’로 옮겼습니다.
- source_word: וַיֶּט אֹהֶל
  english_pob_choice: pitched a tent
  chosen_korean: 장막을 쳤습니다
  alternatives_korean:
  - 텐트를 쳤습니다
  - 장막을 펼쳤습니다
  - 천막을 쳤습니다
  lexicon: HALOT
  rationale: נטה는 אוהל과 함께 ‘장막/천막을 치다’의 관용적 의미이므로, 고전적 어법의 ‘장막을 쳤습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: וַיֶּט לוֹ אֹהֶל의 대명사 지시 대상
  chosen_reading: 마지막 대명사는 궤를 가리키는 것으로 이해해 ‘그것을 위하여 장막을 쳤습니다’로 옮겼습니다.
  alternative_readings:
  - ‘자기 자신을 위하여 장막을 쳤습니다’로 옮길 수 있습니다.
  rationale: 바로 앞의 문맥이 ‘하나님의 궤를 위한 곳’을 준비하는 내용이어서, 마지막 절도 같은 대상을 이어 받는 읽기가 가장 자연스럽고 문맥에 부합합니다.
  doctrine_reference: 문맥 우선의 대명사 지시 해석
