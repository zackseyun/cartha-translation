  to: 그는 다윗의 성에 자신을 위하여 집들을 짓고, 하나님의 궤를 위한 자리를 마련하고, 그것을 위하여 장막을 쳤습니다.[a]
  rationale: 첫 절의 재귀적 수혜 표현을 현대 한국어에 맞게 바로잡고, ‘장소’를 문맥상 더 자연스러운 ‘자리’로 다듬었습니다. 마지막 대명사는 문맥상 궤로 번역하되, 다윗을 가리킬 수 있는 문법적 가능성은 각주에 유지했습니다.
