review_pass:
  verdict: revise
  source_fidelity: 원문의 순서와 핵심 어휘를 대체로 충실히 옮겼습니다. 다만 ‘자기에게 집들을 짓고’는 לוֹ의 재귀적 여격을 한국어로 부자연스럽게 처리하므로 ‘자신을 위하여 집들을 짓고’로 고치는 것이 적절합니다. 마지막 לוֹ는 궤를 가리키는 번역을 유지하되, 가능한 다른 지시 대상은 각주로 보존해야 합니다.
  naturalness: ‘자기에게 집들을 짓고’는 현대 표준 한국어에서 어색하며, 집을 짓는 수혜자를 나타내는 표현으로도 불명확합니다. ‘자신을 위하여 집들을 짓고’가 자연스럽고 원문 의미에도 맞습니다. ‘곳’도 가능하지만, 궤를 둘 물리적 장소라는 문맥에서는 ‘자리’가 더 자연스럽습니다.
  terminology: ‘다윗의 성’, ‘하나님의 궤’, ‘장막을 쳤습니다’는 안정적이고 적절한 성경 용어입니다. ‘하나님의 궤를 위한 자리’는 לַאֲרוֹן הָאֱלֹהִים의 목적 관계를 자연스럽게 드러냅니다.
  issues:
