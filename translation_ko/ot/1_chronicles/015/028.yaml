id: 1CH.15.28
reference: 1 Chronicles 15:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
  footnotes:
  - marker: a
    text: Or 'with a shout'; the Hebrew term can denote a loud cry of celebration or acclamation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'shofar,' traditionally a horn, distinct from the 'trumpets' mentioned next.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 이스라엘이 야훼의 언약궤를 외침과 나팔 소리와 트럼펫과 제금 소리로, 또 비파와 수금으로 연주하며 메어 올리고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외침’은 환호성이나 큰 소리의 외침까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나팔’은 כאן의 שׁוֹפָר를 가리키며, 뒤의 ‘트럼펫’과는 다른 악기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל מַעֲלִים
  english_pob_choice: And all Israel was bringing up
  chosen_korean: 온 이스라엘이 … 메어 올리고 있었습니다
  alternatives_korean:
  - 온 이스라엘이 … 올리고 있었습니다
  - 온 이스라엘이 … 들어 올리고 있었습니다
  lexicon: WLC; HALOT
  rationale: 히필 분사형의 지속적 진행을 살려 과거 진행형으로 옮기고, ‘올리다’에 궤를 메는 행위를 드러내기 위해 ‘메어 올리다’를 택했습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 언약의 궤
  - 야훼의 궤
  lexicon: WLC; HALOT
  rationale: 히브리어의 소유-수식 연쇄를 자연스럽게 압축하되, ‘언약궤’의 전승된 명칭과 ‘야훼’라는 신명 표기를 함께 보존했습니다.
- source_word: תְרוּעָה
  english_pob_choice: shouting
  chosen_korean: 외침
  alternatives_korean:
  - 함성
  - 환호
  lexicon: HALOT
  rationale: 의식적·축제적 큰 소리를 뜻하는 폭넓은 의미를 살리면서도, 한국어에서 가장 중립적인 음성 표현인 ‘외침’을 택했습니다.
- source_word: שׁוֹפָר
  english_pob_choice: a horn
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 숫양뿔 소리
  - 쇼파르 소리
  lexicon: HALOT
  rationale: שׁוֹפָר와 뒤의 חֲצֹצְרוֹת를 구별해야 하므로 일반 독자가 이해하기 쉬운 ‘나팔’보다 ‘나팔 소리’를 사용하되, 별도 악기인 트럼펫과 중복되지 않게 했습니다.
- source_word: חֲצֹצְרוֹת
  english_pob_choice: trumpets
  chosen_korean: 트럼펫
  alternatives_korean:
  - 나팔
  - 은나팔
  lexicon: HALOT
  rationale: 앞의 שׁוֹפָר와 다른 제의용 금관악기라는 구별을 살리기 위해 외래어 ‘트럼펫’을 채택했습니다.
- source_word: מְצִלְתָּיִם
  english_pob_choice: cymbals
  chosen_korean: 제금
  alternatives_korean:
  - 심벌즈
  - 징
  lexicon: HALOT
  rationale: 성경에서 통용되는 금속 타악기 명칭인 ‘제금’을 써서 예배 행렬의 악기 목록이라는 문맥을 살렸습니다.
- source_word: נְבָלִים וְכִנֹּרוֹת
  english_pob_choice: harps and lyres
  chosen_korean: 비파와 수금
  alternatives_korean:
  - 하프와 리라
  - 비파와 하프
  lexicon: HALOT
  rationale: 두 현악기를 한국어 성경에서 널리 구별해 온 전통 용례를 따르되, 서로 다른 두 악기라는 점을 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 신명은 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본절은 Tetragrammaton을 직접 사용하므로, 존칭 대체어보다 고유 신명 표기를 드러내는 것이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
