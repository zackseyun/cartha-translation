base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: ko
  text: 그리하여 다윗과 이스라엘의 장로들과 천 명 단위의 지휘관들이 오벧에돔의 집에서 야훼의 언약궤를 올려 모시려고 기쁨 가운데 나아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... הַהֹלְכִים
  english_pob_choice: So ... went
  chosen_korean: 그리하여 ... 나아갔습니다
  alternatives_korean:
  - 그리고 ... 갔습니다
  - 그리하여 ... 갔습니다
  lexicon: HALOT
  rationale: 서술 도입 기능을 살려 결과·전환을 나타내는 ‘그리하여’로 옮기고, 행진하는 움직임은 ‘나아갔습니다’로 표현해 문맥의 진행감을 살렸습니다.
- source_word: שָׂרֵי הָאֲלָפִים
  english_pob_choice: the commanders of the thousands
  chosen_korean: 천명의 지휘관들
  alternatives_korean:
  - 천인대의 지휘관들
  - 천부장들
  lexicon: HALOT
  rationale: ‘알라핌’의 군사·행정 단위를 살려 직역에 가까운 ‘천명의 지휘관들’로 옮겼고, 전통적 관용어인 ‘천부장들’은 본문의 구조를 덜 드러내어 제외했습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 언약의 궤
  - 언약궤
  lexicon: HALOT
  rationale: 히브리어의 소유 연쇄를 간결하게 살려 ‘야훼의 언약궤’로 옮겼습니다. ‘언약의 궤’보다 한국어에서 더 자연스럽고, ‘언약궤’라는 본문 핵심 명칭을 유지합니다.
- source_word: בְּשִׂמְחָה
  english_pob_choice: with joy
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 기쁨으로
  - 즐거움 가운데
  lexicon: HALOT
  rationale: 전치사 בְּ의 상황·태도 의미를 살려 행위의 분위기를 나타내는 ‘기쁨 가운데’로 옮겼습니다. 단순한 정서가 아니라 행진의 태도를 보여 줍니다.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  english_pob_choice: from the house of Obed-edom
  chosen_korean: 오벳-에돔의 집
  alternatives_korean:
  - 오벳-에돔 집에서
  - 오벳에돔의 집
  lexicon: HALOT
  rationale: 고유명사를 현대 외래어 표기법에 따라 음역하고, 소유 관계는 한국어의 자연스러운 ‘~의 집’으로 유지했습니다.
theological_decisions:
- issue: 야훼의 고유 이름과 국문 표기
  chosen_reading: יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 텔라그람마톤을 직접 사용하므로, 제목어 ‘주님’으로 대체하지 않고 고유 이름을 드러내는 번역을 택했습니다. 이는 POB의 이름 보존 원칙과 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
