id: 1CH.15.13
reference: 1 Chronicles 15:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
  footnotes:
  - marker: a
    text: Or, 'Because at the first the LORD our God made a breach against us.' The Hebrew opening is compressed and may also imply that the Levites were not involved in the first attempt to bring up the ark.
    reason: alternative_reading
  - marker: b
    text: Or, 'we did not inquire of him according to the prescribed rule.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 처음에 여러분이 없었을 때 야훼 우리 하나님께서 우리를 치셨기 때문입니다. 우리는 그분을 규례대로 찾지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘처음에’는 압축된 히브리어 표현을 풀어 옮긴 것으로, 문맥상 앞선 실패한 운반 시도를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그분을 그 규례에 따라 찾지 않았다’입니다. 여기서 ‘찾다’는 단순한 탐색보다 예배적 문의와 절차적 준수를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה
  english_pob_choice: you were not there the first time
  chosen_korean: 처음에 여러분이 없었을 때
  alternatives_korean:
  - 처음에
  - 그 첫번에 여러분이 없었을 때
  - 처음 시도할 때 여러분이 없었기 때문에
  lexicon: HALOT
  rationale: 히브리어는 압축된 표현이라 문맥상 생략된 의미를 드러내야 하므로, ‘여러분이 없었을 때’로 앞선 실패한 첫 시도를 가리키는 뜻을 한국어에서 분명히 했습니다.
- source_word: פָּרַץ
  english_pob_choice: broke out against
  chosen_korean: 우리를 치셨기 때문입니다
  alternatives_korean:
  - 우리를 향해 터져 나오셨기 때문입니다
  - 우리 가운데 틈을 내셨기 때문입니다
  - 우리를 향해 무너뜨리셨기 때문입니다
  lexicon: HALOT
  rationale: פָּרַץ는 단순한 물리적 ‘틈’보다 하나님의 심판적 돌발을 담으므로, 자연스러운 현대어로 ‘치셨다’고 옮겨 심판의 강도를 살렸습니다.
- source_word: דְרַשְׁנֻהוּ
  english_pob_choice: we did not seek him
  chosen_korean: 우리는 그분을 찾지 않았습니다
  alternatives_korean:
  - 우리는 그분께 묻지 않았습니다
  - 우리는 그분을 구하지 않았습니다
  - 우리는 그분을 상의하지 않았습니다
  lexicon: HALOT
  rationale: דָּרַשׁ는 ‘찾다/구하다/묻다’의 범위가 있으나, 이 문맥에서는 예배와 절차의 부적절함을 함께 포괄하는 ‘찾지 않았다’가 가장 자연스럽습니다.
- source_word: כַּמִּשְׁפָּט
  english_pob_choice: according to the ordinance
  chosen_korean: 규례대로
  alternatives_korean:
  - 법도대로
  - 정해진 절차대로
  - 명령대로
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 법정 판결이 아니라 언약적·예전적 규범을 가리키므로, 한국어 성경에서 익숙하면서도 규범성을 유지하는 ‘규례’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기는 전통적 대체어가 아니라 음역인 ‘야훼’로 옮겨, 원문의 고유한 하나님의 이름을 보존했습니다.
theological_decisions:
- issue: 첫 절의 압축된 주어·상황 보충
  chosen_reading: 첫 시도에서 레위인들의 부재가 암시되므로, 한국어 본문에 이를 약간 풀어 말해 문맥을 드러냈습니다.
  alternative_readings:
  - 그 첫에, 야훼 우리 하나님께서 우리를 치셨습니다
  - 처음에 여러분이 이 일을 하지 않았기 때문에 야훼 우리 하나님께서 우리를 치셨습니다
  rationale: 히브리어는 매우 압축되어 있으나 앞뒤 문맥이 실패한 언약궤 운반 사건을 분명히 가리키므로, 과도한 해석을 더하지 않는 범위에서 의미를 명시했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: פָּרַץ의 심판적 성격
  chosen_reading: 하나님께서 거룩함을 훼손한 행위에 대해 돌발적으로 심판하신 것으로 이해해 ‘우리를 치셨다’고 표현했습니다.
  alternative_readings:
  - 우리 가운데 틈을 내셨습니다
  - 우리에게서 돌파하셨습니다
  rationale: 본문은 단순한 사건 설명이 아니라 하나님의 거룩한 임재 앞에서의 심판을 강조하므로, 그 무게를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §6
