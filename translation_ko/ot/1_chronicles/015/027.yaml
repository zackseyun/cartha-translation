review_pass:
  verdict: revise
  source_fidelity: ‘이제’는 히브리어 본문에 없는 담화 표지이므로 삭제해야 합니다. מְעִיל은 ‘예복’으로 한정하기보다 ‘겉옷’이 적절하며, ‘언약궤’는 문맥상 가능하더라도 원문은 단지 ‘궤’라고 합니다. 난해한 הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים는 본문에서 ‘운반 일을 맡은 우두머리’로 보수적으로 옮기고 대안 독해를 각주에 남기는 것이 원문의 난점을 보존합니다.
  naturalness: 초안의 ‘사람들에게도 그러했으며’는 병렬된 주어들을 받는 방식이 어색합니다. ‘모두 그 옷을 입고 있었습니다’로 하면 다윗 및 열거된 이들이 같은 겉옷을 입었다는 뜻이 자연스럽고 분명해집니다. 에봇은 별도 문장으로 처리하여 추가 의복임을 드러냈습니다.
  terminology: 고유명사는 한국어 성경 전통에 맞추어 ‘그나냐’로 표기했습니다. מְעִיל은 ‘고운 아마포 겉옷’, אֵפוֹד בָּד는 음역을 보존한 ‘아마포 에봇’으로 옮겼습니다. ‘노래하는 이들’은 הַמְשֹׁרְרִים의 기본 의미를 유지합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘이제’가 추가되어 있습니다.
    rationale: וְ는 여기서 시간 부사 ‘이제’를 명시하지 않으므로, 한국어 본문에 담화 표지를 보태지 않는 편이 원문에 충실합니다.
  - severity: medium
    issue: ‘예복’ 및 ‘언약궤’가 원문의 표현을 각각 의례성과 언약 개념으로 좁히거나 보충합니다.
    rationale: מְעִיל은 겉옷을 뜻하며, הָאָרוֹן은 이 절에서 단지 ‘궤’입니다. 문맥적 추론을 본문 어휘에 덧붙이지 않는 것이 안전합니다.
  - severity: high
    issue: 난해한 직함 구문을 ‘노래하는 자들의 지도자’로 확정했고, 각주 표지가 앞의 의복 표현에 잘못 붙어 있습니다.
    rationale: הַמַּשָּׂא는 통상 ‘짐/운반’과 관련되며 해당 구문은 논쟁적입니다. 본문은 보수적으로 번역하고, 난구절 자체에 각주 표지를 두어 대안 독해를 제시해야 합니다.
  - severity: medium
    issue: ‘그레냐’는 כְנַנְיָה의 통용 한국어 표기와 다릅니다.
    rationale: 한국어 성경의 통용 표기인 ‘그나냐’를 사용하면 이름 식별이 안정적입니다.
