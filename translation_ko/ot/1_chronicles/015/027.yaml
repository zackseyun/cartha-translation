revisions:
- from: 이제 다윗은 고운 아마포 예복을 입고 있었고[a], 언약궤를 메고 가는 모든 레위 사람들과 노래하는 자들과, 그리고 노래하는 자들의 지도자 그레냐는 사람들에게도 그러했으며, 다윗의 몸에는 아마포 에봇이 있었습니다.
  to: 다윗은 고운 아마포 겉옷을 입고 있었고, 궤를 메고 가는 모든 레위 사람과 노래하는 이들과 운반 일을 맡은 우두머리 그나냐[a]도 모두 그 옷을 입고 있었습니다. 다윗은 또 아마포 에봇을 입고 있었습니다.
  rationale: 원문에 없는 ‘이제’를 제거하고, מְעִיל과 הָאָרוֹן을 과도하게 해석하지 않은 표현으로 바로잡았습니다. 난해한 그나냐의 직함은 הַמַּשָּׂא의 기본 의미를 반영하여 본문에 보수적으로 남기되, 대안적 독해는 해당 구절에 연결된 각주로 보존했습니다. 또한 열거된 사람들이 같은 겉옷을 입었다는 문장 구조를 자연스러운 합쇼체로 정리했습니다.
  reviewer_model: gpt-5.6-terra
