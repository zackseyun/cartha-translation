base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: Now David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
  footnotes:
  - marker: a
    text: Or possibly, 'Chenaniah, leader of the singing' or 'leader of the music.' The Hebrew phrase is difficult.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗은 고운 아마포 겉옷을 입고 있었고, 궤를 메고 가는 모든 레위 사람과 노래하는 이들과 운반 일을 맡은 우두머리 그나냐[a]도 모두 그 옷을 입고 있었습니다. 다윗은 또 아마포 에봇을 입고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노래를 맡은 지도자’ 또는 ‘음악의 지도자’로 볼 수 있습니다. 히브리어 구절은 해석하기 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל / was clothed with
  english_pob_choice: was clothed with
  chosen_korean: 예복을 입고 있었고
  alternatives_korean:
  - 옷을 입고 있었고
  - 두르고 있었고
  - 입혀져 있었고
  lexicon: HALOT
  rationale: מְכֻרְבָּל은 단순한 착용보다 ‘특정한 옷차림으로 입은 상태’를 나타내므로, 문맥상 의식용 복장을 드러내는 ‘예복을 입고 있었다’로 옮겼습니다.
- source_word: מְעִיל בּוּץ / robe of fine linen
  english_pob_choice: robe of fine linen
  chosen_korean: 고운 아마포 예복
  alternatives_korean:
  - 세마포 겉옷
  - 고운 아마포 겉옷
  - 고운 베옷
  lexicon: HALOT
  rationale: מְעִיל은 겉옷/예복 성격의 옷이고 בּוּץ는 고급 아마포이므로, 의미를 살리면서도 자연스러운 한국어로 ‘고운 아마포 예복’이라 했습니다.
- source_word: הַמַּשָּׂא הַמְשֹׁרְרִים / the carrying of the singers
  english_pob_choice: the carrying of the singers
  chosen_korean: 노래하는 자들의 지도자
  alternatives_korean:
  - 노래하는 일의 지도자
  - 노래하는 자들의 수장
  - 노래하는 자들을 맡은 지도자
  lexicon: HALOT
  rationale: 히브리어 구문은 난해하여 직역하면 한국어에서 더 불명료해질 수 있으므로, 영어 POB가 제시한 난구절의 의미 흐름을 따라 합리적 독해로 처리했습니다.
- source_word: אֵפוֹד בָּד / a linen ephod
  english_pob_choice: a linen ephod
  chosen_korean: 아마포 에봇
  alternatives_korean:
  - 세마포 에봇
  - 아마 에봇
  - 리넨 에봇
  lexicon: HALOT
  rationale: 에봇은 제의적 의복 명칭이므로 음역을 유지했고, בָּד는 표준어로 ‘아마포’가 가장 자연스럽습니다.
- source_word: וְעַל דָּוִיד / and on David was
  english_pob_choice: and on David was
  chosen_korean: 다윗의 몸에는
  alternatives_korean:
  - 다윗 위에는
  - 다윗 위에 있었고
  - 다윗에게는
  lexicon: HALOT
  rationale: 히브리어의 ‘~위에 있었다’는 구조를 한국어에서 자연스럽게 살리기 위해, 신체 착용 상태를 분명히 하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 다윗의 에봇 착용의 함의
  chosen_reading: 본문이 말하는 것은 다윗이 아마포 에봇을 입고 있었다는 사실이며, 여기서 곧바로 제사장 직분을 단정하지는 않았습니다.
  alternative_readings:
  - 다윗을 제사장적으로 묘사한다고 해석하기
  - 예복 일반으로 완화하기
  rationale: 본문은 복장 사실을 제시할 뿐이므로, 교리적 결론을 앞서 넣지 않고 원문의 긴장을 그대로 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하지 않는 교리적 추론을 번역에 주입하지 않음
- issue: 난해한 직함 구문 처리
  chosen_reading: 노래하는 자들의 지도자
  alternative_readings:
  - 노래의 지도자
  - 음악의 지도자
  - 노래하는 자들의 carrying
  rationale: 마소라 본문의 어색한 구문을 한국어에서 지나치게 억지스럽게 보존하기보다, 본문이 가리키는 행정적/의식적 역할을 가장 무리 없이 드러내는 쪽으로 정리했습니다.
  doctrine_reference: 의미 보존 우선, 과도한 문자주의 회피
