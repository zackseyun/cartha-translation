  - 우스엘의 아들들에 대하여
  lexicon: HALOT
  rationale: 부속격 לְ가 목록의 항목을 도입하는 용법이므로 자연스러운 목록 서두인 ‘…의 아들들에게는’으로 옮겼습니다. בנים의 족속/가문 표현도 함께 살렸습니다.
- source_word: הַ/שָּׂר
  english_pob_choice: the chief
  chosen_korean: 수령
  alternatives_korean:
  - 지도자
  - 고관
  - 방백
  lexicon: HALOT
  rationale: 행정적·대표적 직함을 나타내므로, ‘chief’의 한국어 대응으로 관직적 뉘앙스가 있는 ‘수령’을 택했습니다.
- source_word: וְ/אֶחָי/ו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  - 그의 형제들 및 일가
  lexicon: HALOT
  rationale: 아ח는 여기서 혈족/동류 집단을 가리킬 수 있으나, 목록 문맥에서는 직역에 가까운 ‘형제들’이 가장 간명합니다.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  english_pob_choice: one hundred and twelve
  chosen_korean: 백십이 명
  alternatives_korean:
  - 한백 열둘
  - 112명
  lexicon: HALOT
  rationale: 인원수이므로 한국어 수사 관용에 따라 ‘명’을 보충했고, 서술체에 맞게 ‘백십이 명’으로 적었습니다.
theological_decisions:
- issue: 직함 הַשָּׂר의 한국어 격조
  chosen_reading: ‘수령’으로 옮겨 단순한 ‘지도자’보다 공적 대표직 느낌을 살렸습니다.
  alternative_readings:
