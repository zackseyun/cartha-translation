  text: לִ/בְנֵ֖י אֱלִֽיצָפָ֑ן שְׁמַֽעְיָ֥ה הַ/שָּׂ֖ר וְ/אֶחָ֥י/ו מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
  footnotes:
  - marker: a
    text: Or 'kinsmen' for 'brothers'; the Hebrew term can extend beyond literal siblings to fellow clan members in genealogical or military lists.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사반 자손에게는 시마야가 수장이었고, 그의 형제 이백 명이 함께 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי
  english_pob_choice: For the sons of
  chosen_korean: 엘리사반 자손에게는
  alternatives_korean:
  - 엘리사반의 아들들에게는
  - 엘리사반 집안에게는
  lexicon: HALOT
  rationale: 문맥상 족보적·씨족적 목록이므로 ‘sons of’를 단순 혈연 아들보다 집단 표지인 ‘자손’으로 옮겨, 목록 도입의 기능을 자연스럽게 살렸습니다.
- source_word: הַ/שָּׂר
  english_pob_choice: the chief
  chosen_korean: 수장이었고
  alternatives_korean:
  - 지도자였고
  - 대장이었고
  - 우두머리였고
  lexicon: HALOT
  rationale: 이 목록에서는 특정 직책명보다 가족 집단을 대표하는 우두머리의 뜻이므로 ‘수장’이 가장 무리 없이 원의를 전달합니다.
- source_word: וְ/אֶחָ֥י/ו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제
  alternatives_korean:
  - 그의 친족
  - 그의 동족
  - 그의 형제들
  lexicon: HALOT
  rationale: 히브리어 אָח은 친족까지 넓게 가리킬 수 있지만, 한국어에서는 족보·명단 문맥에서 ‘형제’가 가장 직접적이며, 수량 표현과 함께 집단 구성원을 자연스럽게 드러냅니다.
- source_word: מָאתָֽיִם
  english_pob_choice: two hundred
  chosen_korean: 이백 명
  alternatives_korean:
  - 200명
  - 두백 명
  lexicon: HALOT
  rationale: 히브리어 수사를 한국어 관용에 맞게 ‘이백 명’으로 옮겼습니다.
