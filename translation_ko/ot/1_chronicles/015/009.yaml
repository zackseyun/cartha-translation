  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
  footnotes:
  - marker: a
    text: Or 'kinsmen' for 'brothers'; the Hebrew literally reads 'his brothers,' likely referring to male members of the clan group represented by Eliel.
    reason: lexical_alternative
translation:
  language: ko
  text: 헤브론의 아들들에게는 엘리엘, 곧 지도자와 그의 형제 팔십 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘그의 형제들’이라고 읽히며, 이 문맥에서는 엘리엘이 대표하는 씨족의 남성 구성원을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  english_pob_choice: For the sons of
  chosen_korean: 헤브론의 아들들에게는
  alternatives_korean:
  - 헤브론의 자손들에게는
  - 헤브론 자손에게는
  lexicon: HALOT
  rationale: לִבְנֵי는 족보·씨족 목록에서 소속 집단을 가리키므로, 한국어에서도 소유격 구조로 자연스럽게 옮기되 ‘아들들’의 혈연적 표현을 유지했습니다.
- source_word: הַשָּׂר
  english_pob_choice: the chief
  chosen_korean: 지도자
  alternatives_korean:
  - 우두머리
  - 대장
  - 제후
  lexicon: HALOT
  rationale: 이 문맥의 שַׂר는 씨족 대표의 직분을 뜻하므로, 군사적 뉘앙스가 강한 ‘대장’보다 중립적인 ‘지도자’가 더 적절합니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제 팔십 명
  alternatives_korean:
  - 그의 친족 팔십 명
  - 그의 형제들 팔십 명
  lexicon: HALOT
  rationale: 직역상 ‘그의 형제들’이지만, POB의 주석처럼 씨족 구성원을 가리킬 가능성이 있어 한국어 본문은 그대로 두고 자연스럽게 수량을 붙였습니다.
theological_decisions:
- issue: 족보 목록에서 ‘형제’의 범위
  chosen_reading: 본문은 ‘그의 형제들’을 유지하되, 씨족 단위의 구성원을 가리키는 표현으로 이해할 수 있게 했습니다.
  alternative_readings:
  - ‘친족’으로 완화해 번역
  - ‘동족’으로 해석해 번역
  rationale: 히브리어는 문자적으로 ‘형제들’이며, POB도 그 문자성을 유지하면서 주석으로 씨족적 의미 가능성을 밝혔습니다. 본문은 문언을 보존하고, 해석은 주석에서 처리하는 편이 소스 충실성에 맞습니다.
  doctrine_reference: 족보/씨족 용례의 문맥적 해석
