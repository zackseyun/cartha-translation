    reason: source_note
  revision_rationale: 제금이 포함된 악기 목록에 맞추어 ‘현악기들’을 ‘음악 악기’로 고쳤습니다. 또한 다윗의 지시와 노래하는 레위인들의 수행을 명확히 드러내도록 문장을 재구성했습니다. ‘목소리를 높이다’는 לְהָרִים בְּקוֹל의 직역적 관용을 보존하며, 각주는 논쟁 가능성이 있는 마지막 전치사구의 범위를 열어 둡니다.
