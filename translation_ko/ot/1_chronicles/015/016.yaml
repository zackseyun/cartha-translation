id: 1CH.15.16
reference: 1 Chronicles 15:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִיד֮ לְ/שָׂרֵ֣י הַ/לְוִיִּם֒ לְ/הַֽעֲמִ֗יד אֶת אֲחֵי/הֶם֙ הַ/מְשֹׁ֣רְרִ֔ים בִּ/כְלֵי שִׁ֛יר נְבָלִ֥ים וְ/כִנֹּר֖וֹת וּ/מְצִלְתָּ֑יִם מַשְׁמִיעִ֥ים לְ/הָרִֽים בְּ/ק֖וֹל לְ/שִׂמְחָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
  footnotes:
  - marker: a
    text: Or 'to lift up the voice with joy'; the Hebrew expression is literally 'to raise with a sound/voice for joy.'
    reason: lexical_alternative
  - marker: b
    text: '''Their brothers'' refers to their fellow Levites.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 다윗은 레위 사람들의 지도자들에게 그들의 형제들[a], 곧 노래하는 이들을 세워, 비파와 수금과 제금 같은 음악 악기를 울리며 크게 소리를 내어 기쁨으로 목소리를 높이게 하라고 말했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 형제들’은 같은 레위 사람들을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 표현은 문자적으로 ‘소리/목소리를 높여 기쁨으로(또는 기쁨을 위하여)’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: לְשָׂרֵי הַ/לְוִיִּם
  english_pob_choice: the leaders of the Levites
  chosen_korean: 레위 사람들의 지도자들
  alternatives_korean:
  - 레위 사람들의 우두머리들
  - 레위 사람들의 관리들
  lexicon: HALOT
  rationale: שָׂרִים는 문맥상 행정적·조직적 지도자를 가리키므로, 한국어로는 자연스럽고 분명한 ‘지도자들’이 가장 적절합니다.
- source_word: אֶת אֲחֵי/הֶם
  english_pob_choice: their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 동료 레위 사람들
  - 그들의 친족들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘형제들’을 유지하되, 문맥상 같은 레위 지파의 구성원을 가리키므로 자연스러운 한국어로 옮겼습니다.
- source_word: הַ/מְשֹׁרְרִ֔ים
  english_pob_choice: the singers
  chosen_korean: 노래하는 사람들
  alternatives_korean:
  - 가수들
  - 찬양하는 사람들
  lexicon: HALOT
  rationale: שׁיר의 분사형으로 ‘노래하는 사람들’이 가장 직접적입니다. 현대 한국어에서 ‘가수들’은 직업적 뉘앙스가 있어 덜 적합합니다.
- source_word: בִּ/כְלֵי שִׁ֛יר
  english_pob_choice: with musical instruments
  chosen_korean: 현악기들
  alternatives_korean:
  - 음악 도구들
  - 노래 악기들
  lexicon: HALOT
  rationale: 문맥에 바로 이어지는 나열이 비파·수금·제금이므로, 포괄어로 ‘현악기들’을 두어 악기 사용을 자연스럽게 연결했습니다.
- source_word: נְבָלִ֥ים וְ/כִנֹּר֖וֹת וּ/מְצִלְתָּ֑יִם
  english_pob_choice: harps, lyres, and cymbals
  chosen_korean: 비파와 수금과 제금
  alternatives_korean:
  - 하프와 리라와 심벌즈
  - 비파들과 수금들과 제금들
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 통용되는 전통적 악기명인 ‘비파, 수금, 제금’을 사용해 정확성과 가독성을 함께 살렸습니다.
- source_word: מַשְׁמִיעִ֥ים
  english_pob_choice: sounding aloud
  chosen_korean: 소리를 크게 내어
  alternatives_korean:
  - 울리며
  - 소리가 나게 하며
  lexicon: HALOT
  rationale: 히필 분사의 ‘들리게 하다’는 의미를 한국어 동작으로 옮겨, 단순한 발생이 아니라 공개적·강한 발성을 드러냈습니다.
- source_word: לְ/הָרִֽים בְּ/ק֖וֹל
  english_pob_choice: lifting up the voice
  chosen_korean: 소리를 높이게 하였습니다
  alternatives_korean:
  - 목소리를 높이게 하였습니다
  - 음성을 들어 올리게 하였습니다
  lexicon: HALOT
  rationale: 직역의 ‘소리/목소리를 높이다’를 살리되, 한국어에서 자연스러운 관용 표현으로 옮겼습니다.
- source_word: לְ/שִׂמְחָֽה
  english_pob_choice: of joy
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 기뻐하면서
  lexicon: HALOT
  rationale: 끝의 לְשִׂמְחָה는 목적·상태를 함께 띠므로, 행위의 분위기를 살리는 ‘기쁨으로’가 가장 무난합니다.
theological_decisions:
- issue: 악기와 찬양 행위의 표현
  chosen_reading: 본문은 레위 지도자들이 예배 음악을 조직하도록 다윗이 지시한 역사적 장면으로 보고, 예배적 용어를 지나치게 신학화하지 않고 서술했습니다.
  alternative_readings:
  - 성전 찬양의 제도화에 대한 강조로 읽기
  - 단순한 음악 공연 묘사로 축소하기
  rationale: 히브리어 동사의 조직적 명령과 악기 목록이 함께 있어, 예배 행정과 찬양 행위가 동시에 드러납니다. 한국어에서도 그 긴장을 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 성전 예배와 레위 직무에 관한 역사 서술(대상 15장 맥락)
