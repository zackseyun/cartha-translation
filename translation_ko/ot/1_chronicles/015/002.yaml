source:
  edition: WLC
  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
  footnotes:
  - marker: a
    text: Or, 'The ark of God is not to be carried by anyone except the Levites.' The Hebrew is elliptical and leaves the implied subject unstated.
    reason: lexical_alternative
  - marker: b
    text: '''Minister to him'' may also be rendered ''serve him.'' The Hebrew verb often refers to sacred or liturgical service.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 말했습니다. “레위 사람들 외에는 아무도 하나님의 궤를 메어서는 안 됩니다. 야훼께서 그들을 야훼의 궤를 메고 그분을 섬기는 일을 영원히 하도록 택하셨기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 주어가 생략되어 있습니다. ‘하나님의 궤는 레위 사람들만 메어야 합니다’라고도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘섬기다’는 여기서 일반적인 봉사보다 성소에서 드리는 봉사의 의미를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז / Then
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그런 다음
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 이어 주는 시간 부사로, 앞선 사건 이후 다윗의 발언이 이어짐을 간결하게 보여 줍니다.
- source_word: אֲרוֹן הָאֱלֹהִים / the ark of God
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님의 상자
  lexicon: HALOT
  rationale: 이 문맥의 성물은 ‘궤’가 가장 직접적이고 표준적인 대응어이며, ‘언약궤’는 본문에 없는 수식이어서 덧붙이지 않았습니다.
- source_word: הַלְוִיִּם / the Levites
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: ‘레위 사람들’은 한국어에서 자연스럽고, 집단 정체성을 분명히 하면서도 과도한 교회용어화를 피합니다.
- source_word: לָשֵׂאת ... וּלְשָׁרְתוֹ / to carry ... and to minister to him
  english_pob_choice: to carry ... and to minister to him
  chosen_korean: 메고 ... 그분을 섬기도록
  alternatives_korean:
  - 메고 ... 그분께 수종들도록
  - 메고 ... 그분께 봉사하도록
  lexicon: HALOT
  rationale: ‘메다’는 성물을 어깨에 지는 물리적 행위를 자연스럽게 나타내고, ‘섬기다’는 성소 봉사의 넓은 의미를 살리되 지나치게 교회적이지 않게 유지합니다.
- source_word: עַד עוֹלָם / forever
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: 선택의 지속성을 나타내는 관용적 표현으로, 본문의 영속성을 한국어에서 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: וּלְשָׁרְתוֹ의 대명사 지시 대상
  chosen_reading: 대명사 ‘그분’은 야훼를 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 궤를 가리켜 ‘그것을 섬기도록’으로 이해하는 읽기
  rationale: 가장 직접적인 신학적·문맥적 선행사는 야훼이며, 레위인의 봉사는 성물 자체보다 야훼께 드리는 봉사로 이해하는 것이 본문의 예배적 의미를 더 잘 드러냅니다.
  doctrine_reference: Levitical service language in the Torah/Chronicles
- issue: 지시 대상을 살려 반복된 ‘야훼’ 유지
  chosen_reading: ‘야훼의 궤’를 두 번 모두 유지해 주어 본문의 반복과 강조를 살렸습니다.
  alternative_readings:
  - ‘주님의 궤’로 통일
  - 한 번만 이름을 쓰고 나머지는 생략
  rationale: 이 절은 야훼의 선택과 소유를 반복적으로 강조하므로, 신명기적 고유명칭을 유지하는 편이 원문의 신학적 초점을 보존합니다.
  doctrine_reference: Tetragrammaton rendering policy
