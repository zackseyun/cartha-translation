base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
  footnotes:
  - marker: a
    text: Or, “and he will dwell in Jerusalem forever.” The Hebrew verb may be understood as expressing the LORD’s settled, enduring dwelling there.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 다윗이 이렇게 말하였기 때문입니다. “야훼, 이스라엘의 하나님께서 자기 백성에게 안식을 주셨고 예루살렘에 영원히 거하십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분은 예루살렘에 영원히 거하실 것입니다.” 히브리어 동사는 야훼께서 그곳에 지속적이고 확정되게 거하심을 나타내는 것으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
