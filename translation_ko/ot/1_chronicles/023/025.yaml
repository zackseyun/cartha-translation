  rationale: 본 프로젝트 기본값에 따라 신적 고유명사 יְהוָה는 직역적 호칭이 아니라 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: הֵנִיחַ
  english_pob_choice: has given rest
  chosen_korean: 안식을 주셨고
