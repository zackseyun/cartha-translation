  lexicon: HALOT
  rationale: 영속적·정착된 거주를 나타내는 שכן의 의미를 살려 ‘거하십니다’로 옮겨, 예루살렘에 대한 지속적 임재를 드러냈습니다.
theological_decisions:
- issue: 여호와의 이름과 임재 진술
  chosen_reading: ‘야훼’와 현재형 ‘거하십니다’로, 하나님의 언약적 이름과 예루살렘에 대한 지속적 임재를 함께 드러냈습니다.
  alternative_readings:
  - ‘여호와’로 표기
  - ‘거하셨습니다’로 과거화
  rationale: 본문은 하나님의 이름 יְהוָה를 직접 사용하며, 다윗의 말은 예루살렘에 대한 하나님의 정착된 임재를 신학적으로 진술합니다. 현재형은 그 지속성을 과도하게 시제화하지 않으면서 자연스럽게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
