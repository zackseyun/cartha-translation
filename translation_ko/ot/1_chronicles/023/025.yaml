  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
  footnotes:
  - marker: a
    text: Or, “and he will dwell in Jerusalem forever.” The Hebrew verb may be understood as expressing the LORD’s settled, enduring dwelling there.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 말하기를, "야훼, 이스라엘의 하나님께서 자기 백성에게 안식을 주셨고, 예루살렘에 영원히 거하십니다"라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분은 예루살렘에 영원히 거하실 것입니다.” 히브리어 동사는 여호와의 지속적이고 확정된 거처를 나타내는 것으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר דָּוִיד
