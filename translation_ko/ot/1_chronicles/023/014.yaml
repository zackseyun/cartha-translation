  rationale: אִישׁ הָאֱלֹהִים은 관용적으로 ‘하나님의 사람’이며, 문맥상 삽입된 호명구를 자연스럽게 풀어 합쇼체로 연결했습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들은
  alternatives_korean:
  - 그 아들들은
  - 아들들은
  lexicon: 아들
  rationale: 소유 대명사를 분명히 살려 모세의 자손을 직접 가리키도록 했습니다.
- source_word: יִקָּרְאוּ עַל
  english_pob_choice: were counted among
  chosen_korean: 레위 지파에 속해 기록되었습니다
  alternatives_korean:
  - 레위 지파에 기록되었습니다
  - 레위 지파에 포함되어 شمار되었습니다
  lexicon: 계수/기록
  rationale: עַל은 소속·귀속의 방향을 나타내며, POB의 ‘counted among’을 따라 단순한 호칭이 아니라 족속 등록의 의미를 살렸습니다.
- source_word: שֵׁבֶט הַלֵּוִי
