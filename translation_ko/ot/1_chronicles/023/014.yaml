  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  english_pob_choice: Moses, the man of God
  chosen_korean: 모세는 하나님의 사람인데
  alternatives_korean:
  - 모세는 하나님의 사람이며
  - 모세, 하나님의 사람은
  lexicon: 모세 / 하나님의 사람
  rationale: אִישׁ הָאֱלֹהִים은 관용적으로 ‘하나님의 사람’이며, 문맥상 삽입된 호명구를 자연스럽게 풀어 합쇼체로 연결했습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들은
  alternatives_korean:
  - 그 아들들은
  - 아들들은
  lexicon: 아들
  rationale: 소유 대명사를 분명히 살려 모세의 자손을 직접 가리키도록 했습니다.
- source_word: יִקָּרְאוּ עַל
  english_pob_choice: were counted among
  chosen_korean: 레위 지파에 속해 기록되었습니다
  alternatives_korean:
  - 레위 지파에 기록되었습니다
  - 레위 지파에 포함되어 شمار되었습니다
  lexicon: 계수/기록
  rationale: עַל은 소속·귀속의 방향을 나타내며, POB의 ‘counted among’을 따라 단순한 호칭이 아니라 족속 등록의 의미를 살렸습니다.
- source_word: שֵׁבֶט הַלֵּוִי
  english_pob_choice: the tribe of Levi
  chosen_korean: 레위 지파
  alternatives_korean:
  - 레위의 지파
  - 레위 지파 안에
  lexicon: 지파
  rationale: יִשְׂרָאֵל 족보 문맥의 표준 표현으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 모세의 아들들이 레위 지파에 ‘속한다/기록된다’는 진술의 성격
  chosen_reading: 혈통상 레위 지파의 일원이라기보다, 레위 지파 명부에 포함되어 등록되었다는 행정·족보적 진술로 옮겼습니다.
  alternative_readings:
  - 레위 지파에 속한다고 직역하는 해석
  - ‘불리었다/호명되었다’로 번역하는 완화 해석
  rationale: 히브리어 יִקָּרְאוּ עַל은 단순 호칭보다 명부·귀속의 의미가 강하며, 영어 POB의 ‘counted among’도 이 점을 반영하므로 족보 등록의 뉘앙스를 유지했습니다.
  doctrine_reference: 민수기 3장, 역대상 족보 문맥
