  rationale: יִשְׂרָאֵל 족보 문맥의 표준 표현으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 모세의 아들들이 레위 지파에 ‘속한다/기록된다’는 진술의 성격
  chosen_reading: 혈통상 레위 지파의 일원이라기보다, 레위 지파 명부에 포함되어 등록되었다는 행정·족보적 진술로 옮겼습니다.
  alternative_readings:
  - 레위 지파에 속한다고 직역하는 해석
  - ‘불리었다/호명되었다’로 번역하는 완화 해석
  rationale: 히브리어 יִקָּרְאוּ עַל은 단순 호칭보다 명부·귀속의 의미가 강하며, 영어 POB의 ‘counted among’도 이 점을 반영하므로 족보 등록의 뉘앙스를 유지했습니다.
  doctrine_reference: 민수기 3장, 역대상 족보 문맥
