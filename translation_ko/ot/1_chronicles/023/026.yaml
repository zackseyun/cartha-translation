  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
  footnotes:
  - marker: a
    text: Or 'there is no need for the Levites to carry the tabernacle and all its vessels for its service.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위인들도 성막과 그 모든 기구를 성막 봉사를 위하여 더 이상 운반할 필요가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위인들에게는 성막과 그 모든 기구를 성막 봉사를 위하여 운반할 필요가 없습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And also
  chosen_korean: 그리고 …에도
  alternatives_korean:
  - 또한
  - 그리고 또한
  lexicon: HALOT
  rationale: 앞선 내용에 덧붙이는 접속과 강조를 함께 살리기 위해 ‘그리고’에 ‘에도’를 붙여 여전히 레위인을 포함한 추가 진술임을 드러냈습니다.
- source_word: לַלוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위인에게도
  alternatives_korean:
  - 레위인들도
  - 레위인에게
  lexicon: HALOT
  rationale: ל의 수혜/관련 대상 용법을 자연스러운 한국어로 옮기기 위해 직접 주어화하기보다 ‘-에게도’로 처리했습니다.
- source_word: אֵין לָשֵׂאת
  english_pob_choice: no longer need to carry
  chosen_korean: 더 이상 … 메고 다닐 필요가 없습니다
  alternatives_korean:
  - 더 이상 … 운반할 필요가 없습니다
  - 더 이상 … 지닐 필요가 없습니다
  lexicon: HALOT
  rationale: 문맥상 금지가 아니라 임무의 종료이므로 ‘필요가 없습니다’로 옮겼고, תָּשֵׂאת의 구체적 동작성을 반영해 ‘메고 다니다’를 택했습니다.
- source_word: הַמִּשְׁכָּן וְאֶת כָּל כֵּלָיו
  english_pob_choice: the tabernacle and all its utensils
  chosen_korean: 성막과 그 모든 기구
  alternatives_korean:
  - 성막과 그 모든 그릇들
  - 성막과 그 모든 용기들
  - 성막과 그 모든 도구들
  lexicon: HALOT
  rationale: מִשְׁכָּן은 제의 문맥에서 표준적으로 ‘성막’이 적절하며, כֵּלִים은 성막 봉사에 쓰이는 물품 전체를 포괄하므로 ‘기구’가 가장 자연스럽습니다.
- source_word: לַעֲבֹדָתוֹ
  english_pob_choice: for its service
  chosen_korean: 그 섬김을 위해
  alternatives_korean:
  - 그 봉사를 위해
  - 그 직무를 위해
  - 그 예식을 위해
  lexicon: HALOT
  rationale: 대명사 접미사는 성막을 가리키므로 ‘그 섬김’으로 관계를 보존했고, 제의적 맥락에서 ‘봉사/직무’보다 중립적인 ‘섬김’을 택했습니다.
theological_decisions:
- issue: 레위인의 운반 의무가 ‘더 이상 필요 없음’으로 표현되는 문제
  chosen_reading: 이 절은 레위인에게 성막 운반이 금지되었다기보다, 그 임무가 더 이상 요구되지 않게 되었음을 말합니다.
  alternative_readings:
  - 레위인들이 성막을 운반해서는 안 된다는 금지문
  - 레위인들의 운반 직무가 폐지되었다는 행정적 진술
  rationale: 히브리어 אֵין לָשֵׂאת은 존재론적 금지보다 실무적 필요의 부재를 가리키므로, POB의 의미를 따라 기능적 종료로 읽는 것이 적절합니다.
  doctrine_reference: 레위 직무 재편과 성막 봉사 질서
- issue: ‘그리고’와 ‘에도’의 결합으로 앞선 문맥과의 연속성을 살린 문제
  chosen_reading: 이 절은 앞선 레위 직무 설명을 이어받는 추가 진술로 읽었습니다.
  alternative_readings:
  - 독립된 새 명령문으로 읽는 것
  - 단순 병렬 정보로만 읽는 것
  rationale: וְגַם의 첨가적 힘을 살려 문맥 연결성을 유지하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 문맥 연결과 서사적 연속성
