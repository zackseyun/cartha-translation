revisions:
- from: 그리고 레위인에게도, 성막과 그 모든 기구를 그 섬김을 위해 더 이상 메고 다닐 필요가 없습니다.[a]
  to: 그리고 레위인들도 성막과 그 모든 기구를 성막 봉사를 위하여 더 이상 운반할 필요가 없습니다.[a]
  rationale: 원문의 첨가적 접속(וְגַם), 레위인과 관련된 진술(לַלְוִיִּם), 운반 필요의 부재(אֵין לָשֵׂאת), 그리고 성막과 모든 기구를 모두 보존했습니다. ‘운반하다’는 נָשָׂא의 의미 범위를 보존하며, ‘성막 봉사’는 접미사의 성막 지시를 명확하게 합니다. 각주에는 여격 구성을 반영한 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:15:21Z'
