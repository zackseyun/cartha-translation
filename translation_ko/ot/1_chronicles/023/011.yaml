id: 1CH.23.11
reference: 1 Chronicles 23:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי יַ֣חַת הָ/רֹ֔אשׁ וְ/זִיזָ֖ה הַ/שֵּׁנִ֑י וִ/יע֤וּשׁ וּ/בְרִיעָה֙ לֹֽא הִרְבּ֣וּ בָנִ֔ים וַ/יִּֽהְיוּ֙ לְ/בֵ֣ית אָ֔ב לִ/פְקֻדָּ֖ה אֶחָֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
  footnotes:
  - marker: a
    text: Zizah is rendered by some English versions as 'Ziza.'
    reason: lexical_alternative
  - marker: b
    text: Or 'one ancestral house for one division' / 'for one reckoning.' The Hebrew refers to a single paternal clan counted as one administrative unit.
    reason: lexical_alternative
translation:
  language: ko
  text: 야핫은 첫째이고 시사는 둘째였습니다[a]. 여우스와 브리아는 아들이 많지 않았으므로, 한 부계 가문으로 묶여 한 단위로 계수되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시사’는 히브리어 זִיזָה의 한국어 성경 통용 표기입니다. 영어 번역에서는 Zizah 또는 Ziza로 표기합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘한 아버지의 집을 위하여, 하나의 계수로’입니다. ‘아버지의 집’은 부계를 따라 구성된 친족·가문 단위이며, 여기서는 두 사람이 하나의 계수 단위로 취급되었음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַת הָרֹאשׁ
  english_pob_choice: the first
  chosen_korean: 첫째
  alternatives_korean:
  - 첫 번째
  - 맏이
  - 수석
  lexicon: HALOT
  rationale: ראש은 이 문맥에서 ‘머리’보다 순서상의 1순위를 뜻하므로, 인명과 결합해 자연스럽고 직접적인 ‘첫째’로 옮겼습니다.
- source_word: זִיזָה הַשֵּׁנִי
  english_pob_choice: Zizah the second
  chosen_korean: 지자가 둘째
  alternatives_korean:
  - 지자가 두 번째
  - 지자
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역으로 처리했고, הַשֵּׁנִי는 단순한 순서 표지이므로 ‘둘째’로 옮겼습니다.
- source_word: לֹא הִרְבּוּ בָנִים
  english_pob_choice: did not have many sons
  chosen_korean: 아들이 많지 않았으므로
  alternatives_korean:
  - 아들을 많이 낳지 않았으므로
  - 아들이 많지 않아
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘아들들을 번성시키다’의 뜻을 살리되, 한국어에서는 ‘아들이 많지 않았다’가 가장 자연스럽고 성별 표지를 유지합니다.
- source_word: לְבֵית אָב
  english_pob_choice: one father’s house
  chosen_korean: 하나의 아버지 집
  alternatives_korean:
  - 한 조상 집안
  - 한 부친 가문
  - 하나의 족장 집안
  lexicon: HALOT
  rationale: בית אב은 행정적·족속적 단위를 가리키므로, 전통 교회어보다 구조를 드러내는 직역형을 유지했습니다.
- source_word: לִפְקֻדָּה אֶחָת
  english_pob_choice: for one reckoning
  chosen_korean: 한 번의 계수로
  alternatives_korean:
  - 한 번의 계수 아래
  - 하나의 편제로
  - 한 번의 등록으로
  lexicon: HALOT
  rationale: פקודה는 여기서 ‘임무’가 아니라 계수·등록·편제의 의미가 강하므로, 군더더기 없이 ‘계수’로 옮겨 행정적 단위를 드러냈습니다.
theological_decisions:
- issue: 가계/직분 단위의 표현을 어떻게 살릴 것인가
  chosen_reading: ‘하나의 아버지 집으로, 한 번의 계수로 되었습니다’로 옮겨 혈연 단위와 행정적 편제를 함께 드러냈습니다.
  alternative_readings:
  - ‘한 조상 집안으로, 한 번의 등록으로 되었습니다’
  - ‘한 가문으로 하나로 شمار되었습니다’
  rationale: 본문은 단순한 가족 수보다 레위 계열의 조직화와 편제를 말하므로, 혈연적 표현과 행정적 표현을 함께 보존하는 것이 원문의 의도를 가장 잘 전달합니다.
  doctrine_reference: 1 Chronicles 23장의 레위 조직 정리
- issue: 고유명사 표기와 순서 표현
  chosen_reading: 인명은 한국어 음역을 따르고, 순서 표지는 ‘첫째/둘째’로 간결하게 처리했습니다.
  alternative_readings:
  - ‘지자(자자)’, ‘첫 번째/두 번째’
  rationale: 본문의 핵심은 계보적 순서와 편제이므로, 낯선 전통 용어보다 현대 한국어에서 즉시 이해되는 순서 표현이 적절합니다.
  doctrine_reference: 성경 번역의 명료성 원칙
