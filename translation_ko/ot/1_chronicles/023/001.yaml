    text: Or 'advanced in years'; literally 'old and full of days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 늙어 나이가 많았고, 그의 아들 솔로몬을 이스라엘의 왕으로 세웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִ֥יד זָקֵ֖ן
  english_pob_choice: Now David was old
  chosen_korean: 다윗은 늙어
  alternatives_korean:
  - 다윗은 나이가 많았고
  - 다윗은 늙었습니다
  lexicon: HALOT
  rationale: זָקֵן은 단순한 연령 진술이므로, 현대 한국어에서는 자연스럽고 간결한 ‘늙어’로 옮겨 노령 상태를 드러냈습니다.
- source_word: וְ/שָׂבַ֣ע יָמִ֑ים
  english_pob_choice: and full of days
  chosen_korean: 나이가 많았고
  alternatives_korean:
  - 날들로 가득했고
  - 날이 충분했고
  - 많은 날을 누렸고
  lexicon: HALOT
  rationale: ‘full of days’는 직역하면 어색하므로, 한국어에서는 관용적 의미를 살려 노년과 수명의 충만함을 함께 드러내는 ‘나이가 많았고’로 처리했습니다.
- source_word: וַ/יַּמְלֵ֛ךְ
  english_pob_choice: he made ... king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕으로 삼았습니다
  - 즉위하게 했습니다
  - 왕이 되게 했습니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살리면서도, 의식적 즉위 장면을 덧붙이지 않는 ‘왕으로 세웠습니다’가 가장 무난합니다.
- source_word: אֶת שְׁלֹמֹ֥ה בְנ֖/וֹ
  english_pob_choice: his son Solomon
  chosen_korean: 그의 아들 솔로몬을
  alternatives_korean:
  - 솔로몬 그의 아들을
  - 아들 솔로몬을
  lexicon: HALOT
  rationale: 히브리어의 소유 관계를 유지하면서 한국어 어순에 맞게 ‘그의 아들 솔로몬을’로 옮겼습니다.
- source_word: עַל יִשְׂרָאֵֽל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘의 왕으로
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘을 다스리도록
  - 이스라엘 위에 군림하도록
  lexicon: HALOT
  rationale: ‘over Israel’의 통치 대상을 한국어에서는 보통 ‘이스라엘의 왕’으로 풀어 자연스럽게 표현했습니다.
