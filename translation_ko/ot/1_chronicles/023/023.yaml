  lexicon: HALOT
  rationale: 족보 문맥에서 직계 남자 후손을 가리키는 기본 표현이므로, 영어 POB의 'sons of'에 맞춰 한국어도 가장 직접적인 '아들들'로 옮겼습니다.
- source_word: מוּשִׁי
