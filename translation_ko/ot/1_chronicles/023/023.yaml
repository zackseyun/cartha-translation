    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 자손들
  - ~의 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 직계 남자 후손을 가리키는 기본 표현이므로, 영어 POB의 'sons of'에 맞춰 한국어도 가장 직접적인 '아들들'로 옮겼습니다.
- source_word: מוּשִׁי
  english_pob_choice: Mushi
  chosen_korean: 므시
  alternatives_korean:
  - 무시
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사 מוּשִׁי를 현대 한국어 음역으로 옮겼습니다.
- source_word: מַחְלִי
  english_pob_choice: Mahli
  chosen_korean: 마흘리
  alternatives_korean:
  - 말리
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사 מַחְלִי의 표준적 음역을 따랐습니다.
- source_word: וְ/עֵדֶר וִ/ירֵמֹת
  english_pob_choice: and Eder, and Jeremoth
  chosen_korean: 와 에델과 예레못
  alternatives_korean:
  - 그리고 에더와 예레못
  - 에델과 예리못
  lexicon: 고유명사 음역
  rationale: 연결 접두사를 자연스러운 한국어 접속으로 처리하고, שתי 고유명사를 현대 음역으로 옮겼습니다. 영어 주석에 있는 Jerimoth 철자 변이도 예레못의 대안 표기로 이해할 수 있습니다.
- source_word: שְׁלֹשָׁה
  english_pob_choice: three
  chosen_korean: 모두 셋
  alternatives_korean:
  - 세 사람
  - 셋이었습니다
  lexicon: HALOT
  rationale: 마지막 총계 표현을 한국어에서 자연스럽게 드러내기 위해 열거 뒤에 요약 수량을 붙였습니다. '모두 셋'은 목록+총합 구조를 보존하면서 문장 흐름도 유지합니다.
theological_decisions:
- issue: 족보 목록의 번역 톤
  chosen_reading: 설명이나 의미 확장을 넣지 않고 단순 열거로 유지했습니다.
  alternative_readings:
  - '''아들들''을 ''자손들''로 완화'
  - 인물 관계를 풀어 설명
  rationale: 이 절은 신학적 해석보다 계보 정보 전달이 핵심이므로, 원문의 간결한 목록 구조를 그대로 드러내는 것이 최선입니다.
  doctrine_reference: 역사-계보 본문의 문맥 보존 원칙
