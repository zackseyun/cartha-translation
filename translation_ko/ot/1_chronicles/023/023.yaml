  alternatives_korean:
  - 무시
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사 מוּשִׁי를 현대 한국어 음역으로 옮겼습니다.
- source_word: מַחְלִי
  english_pob_choice: Mahli
  chosen_korean: 마흘리
  alternatives_korean:
  - 말리
  lexicon: 고유명사 음역
