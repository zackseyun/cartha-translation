- source_word: וְ/עֵדֶר וִ/ירֵמֹת
  english_pob_choice: and Eder, and Jeremoth
  chosen_korean: 와 에델과 예레못
  alternatives_korean:
  - 그리고 에더와 예레못
  - 에델과 예리못
  lexicon: 고유명사 음역
  rationale: 연결 접두사를 자연스러운 한국어 접속으로 처리하고, שתי 고유명사를 현대 음역으로 옮겼습니다. 영어 주석에 있는 Jerimoth 철자 변이도 예레못의 대안 표기로 이해할 수 있습니다.
- source_word: שְׁלֹשָׁה
  english_pob_choice: three
  chosen_korean: 모두 셋
  alternatives_korean:
  - 세 사람
  - 셋이었습니다
  lexicon: HALOT
  rationale: 마지막 총계 표현을 한국어에서 자연스럽게 드러내기 위해 열거 뒤에 요약 수량을 붙였습니다. '모두 셋'은 목록+총합 구조를 보존하면서 문장 흐름도 유지합니다.
