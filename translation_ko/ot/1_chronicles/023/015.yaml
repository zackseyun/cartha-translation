  lexicon: HALOT
  rationale: 이 절의 히브리어 형태는 גֵּרְשֹׁם이므로, 같은 계열의 다른 이름 형태인 ‘게르숀’으로 바꾸지 않고 ‘게르솜’으로 옮겼습니다.
