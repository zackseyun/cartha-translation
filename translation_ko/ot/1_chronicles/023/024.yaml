  text: אֵ֣לֶּה בְנֵֽי לֵוִי֩ לְ/בֵ֨ית אֲבֹתֵי/הֶ֜ם רָאשֵׁ֧י הָ/אָב֣וֹת לִ/פְקוּדֵי/הֶ֗ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם עֹשֵׂה֙ הַ/מְּלָאכָ֔ה לַ/עֲבֹדַ֖ת בֵּ֣ית יְהוָ֑ה מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
  footnotes:
  - marker: a
    text: Hebrew 'head by head,' literally 'by their skulls/heads,' an idiom meaning each individual was counted separately.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 조상 가문별 레위 자손, 곧 가문의 우두머리들입니다. 그들은 그들의 등록에 따라, 이름의 수대로 한 사람 한 사람[a] 계수되어, 야훼의 집에서 봉사하는 일을 하는 스무 살 이상인 이들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 머리들에 따라’입니다. 각 사람이 개별적으로 계수되었음을 뜻하는 히브리어 관용입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם / רָאשֵׁי הָאָבוֹת
  english_pob_choice: by their fathers’ houses; the heads of the fathers’ houses
  chosen_korean: 그들의 조상의 집안의 우두머리들
  alternatives_korean:
  - 그들의 아비들의 집안에 속한 우두머리들
  - 조상 가문의 우두머리들
  lexicon: HALOT
  rationale: 레위 지파의 가문 단위를 가리키는 표현이므로 ‘조상의 집안’으로 옮기고, 대표자라는 뜻을 살려 ‘우두머리들’로 처리했습니다.
- source_word: לִפְקוּדֵיהֶם / בְּמִסְפַּר שֵׁמוֹת / לְגֻלְגְּלֹתָם
  english_pob_choice: according to those counted of them; by the number of names; head by head
  chosen_korean: 그들 가운데서 계수된 자들의 우두머리들로서, 이름의 수대로, 머리씩 계수되어
  alternatives_korean:
  - 등록된 사람들의 수에 따라
  - 이름별로, 한 사람씩
  lexicon: HALOT
  rationale: 원문의 인구조사적 누계 표현을 살리기 위해 ‘계수된 자들’, ‘이름의 수대로’, ‘머리씩’으로 대응했습니다. 특히 ‘머리씩’은 영어 POB의 ‘head by head’가 보존한 히브리어 관용을 반영합니다.
- source_word: עֹשֵׂה הַמְּלָאכָה לַעֲבֹדַת בֵּית יְהוָה
  english_pob_choice: doing the work for the service of the house of Yahweh
  chosen_korean: 야훼의 집의 봉사를 위한 일을 하는 자들이며
  alternatives_korean:
  - 야훼의 집에서 섬기는 일을 하는 자들이며
  - 야훼의 집의 사역을 담당하는 자들이며
  lexicon: HALOT
  rationale: מְלָאכָה는 단순 노동이 아니라 지정된 업무를 가리키므로 ‘일’로, עֲבֹדָה는 성전 관련 봉사/섬김의 의미를 살려 ‘봉사’로 옮겼습니다. ‘사역’은 후대 교회 용어가 강해 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 음역하여, 고유한 언약 이름을 제목이 아닌 호칭으로 대체하지 않도록 했습니다.
- source_word: מִבֶּן עֶשְׂרִ֥ים שָׁנָ֖ה וָמָעְלָה
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살부터 그 이상입니다
  alternatives_korean:
  - 스무 살 이상입니다
  - 스무 살부터 위입니다
  lexicon: HALOT
  rationale: 최소 연령 기준을 현대 한국어로 자연스럽게 옮기면서도 ‘and upward’의 상한 없음과 출발점을 분명히 했습니다.
theological_decisions:
- issue: 레위인의 성전 봉사 연령 기준 표현
  chosen_reading: ‘스무 살부터 그 이상입니다’로, 봉사 자격의 시작점을 분명히 했습니다.
  alternative_readings:
  - ‘스무 살 이상입니다’
  - ‘스무 살부터입니다’
  rationale: 본문은 단순 연령 정보가 아니라 성전 봉사를 위한 자격 기준을 제시하므로, 시작점과 계속성을 함께 드러내는 표현을 선택했습니다.
  doctrine_reference: 역대기 문맥의 레위 성전 봉사 규정
