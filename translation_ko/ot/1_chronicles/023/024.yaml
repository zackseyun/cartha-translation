  verdict: revise
  source_fidelity: 초안은 레위 자손과 조상 가문의 우두머리라는 기본 의미 및 ‘스무 살 이상’의 연령 기준을 대체로 반영합니다. 그러나 לִפְקוּדֵיהֶם는 그들이 계수·등록된 사항을 말하는데, 초안의 ‘그들 가운데서 계수된 자들의 우두머리들’은 이를 ‘계수된 사람들의 우두머리’라는 별도 수식 관계로 바꾸어 원문의 구조와 의미를 벗어납니다. 또한 ‘머리씩 계수되어’는 원문의 개별 계수 관용을 다소 부자연스럽게 중복합니다.
  naturalness: ‘조상의 집안의 우두머리들’, ‘그들 가운데서 계수된 자들의 우두머리들로서’가 연속되어 문장 구조가 무겁고 지시 관계가 불명확합니다. ‘조상 가문별’, ‘그들의 등록에 따라’, ‘한 사람 한 사람’으로 정리하면 현대 표준어 합쇼체에서 자연스럽고 의미도 명료합니다.
