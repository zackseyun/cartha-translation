revisions:
- from: 이것들이 레위 자손입니다. 곧 그들의 조상의 집안의 우두머리들, 곧 그들 가운데서 계수된 자들의 우두머리들로서, 이름의 수대로, 머리씩 계수되어, 야훼의 집의 봉사를 위한 일을 하는 자들이며, 이들은 스무 살부터 그 이상입니다.[a]
  to: 이들은 조상 가문별 레위 자손, 곧 가문의 우두머리들입니다. 그들은 그들의 등록에 따라, 이름의 수대로 한 사람 한 사람[a] 계수되어, 야훼의 집에서 봉사하는 일을 하는 스무 살 이상인 이들입니다.
  rationale: 조상 가문에 따른 분류와 가문의 우두머리라는 두 요소를 분명히 하고, 등록·계수 관련 표현이 우두머리들의 신분을 잘못 수식하지 않도록 바로잡았습니다. ‘한 사람 한 사람’은 히브리어의 ‘머리/두개골에 따라’라는 인구 계수 관용의 기능을 자연스럽게 전달하며, 직역적 표현은 각주에 보존했습니다. ‘야훼’, 성전 봉사 업무, 스무 살 이상의 기준은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:15:45Z'
