translation:
  language: ko
  text: 웃시엘의 아들들은 첫째가 미가[a]이고 둘째가 잇시야[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘머리’입니다. 이 족보 문맥에서는 ‘첫째’로 이해할 수 있으며, ‘우두머리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 음역 방식에 따라 ‘이시야’, ‘예사야’ 등으로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
