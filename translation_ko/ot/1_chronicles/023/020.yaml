  text: בְּנֵ֖י עֻזִּיאֵ֑ל מִיכָ֣ה הָ/רֹ֔אשׁ וְ/יִשִּׁיָּ֖ה הַ/שֵּׁנִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/020.yaml
  text: 'The sons of Uzziel: Micah the first[b][a], and Isshiah the second.'
  footnotes:
  - marker: a
    text: Or 'Micah the chief'; Hebrew literally 'Micah the head.'
    reason: lexical_alternative
  - marker: b
    text: The name 'Isshiah' is rendered variously in English versions, including 'Jeshaiah' and 'Ishshiah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우스엘의 아들들은 미가가 첫째이고, 이시야가 둘째입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ראשׁ’는 문자적으로 ‘머리’이지만, 족보·명부 문맥에서는 서열상 ‘첫째/첫 번째’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘Isshiah’는 영어 성경들에서 ‘Jeshaiah’ 또는 ‘Ishshiah’로도 옮겨집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: -의 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 직접적인 부자 관계를 가리키므로, 영어 POB의 직역적 선택을 살려 ‘아들들’로 옮기는 것이 가장 자연스럽습니다.
- source_word: הָרֹאשׁ
  english_pob_choice: the first
  chosen_korean: 첫째
  alternatives_korean:
  - 머리
  - 우두머리
  - 첫 번째
  lexicon: HALOT
  rationale: 문자적으로는 ‘머리’이지만, 뒤의 ‘둘째’와 짝을 이루는 계수적 표지이므로 한국어에서는 서열을 드러내는 ‘첫째’가 문맥에 가장 잘 맞습니다.
- source_word: וְיִשִּׁיָּה
  english_pob_choice: and Isshiah
  chosen_korean: 이시야
  alternatives_korean:
  - 이사야
  - 이숴야
  - 예사야
  lexicon: transliteration
  rationale: 히브리어 자음형에 가까운 음역을 택했습니다. 영어 전통형(יְשַׁעְיָה/이사야 계열)과 구별되도록, POB의 ‘Isshiah’에 맞춰 한국어 표기를 정했습니다.
- source_word: הַשֵּׁנִי
  english_pob_choice: the second
  chosen_korean: 둘째
  alternatives_korean:
  - 두 번째
  - 두째
  lexicon: HALOT
  rationale: 족보 열거에서 서수 표현으로 쓰였으므로, 현대 한국어에서 자연스러운 ‘둘째’로 옮겼습니다.
theological_decisions:
- issue: 족보 항목의 서열 표현
  chosen_reading: ‘첫째 / 둘째’로 서열을 분명히 드러내되, 본문이 말하는 범위를 넘겨 지위나 권위를 신학적으로 확장하지 않았습니다.
  alternative_readings:
  - ‘첫 번째 / 두 번째’
  - ‘우두머리 / 두 번째’
  rationale: 본문의 핵심은 서열 표지이지 교리적 명칭이 아니므로, 과도한 해석을 피하면서도 원문의 기능을 살려 번역했습니다.
  doctrine_reference: 성경 족보의 문학적 기능
- issue: 이름 음역의 일관성
  chosen_reading: ‘우스엘’, ‘미가’, ‘이시야’로 음역해 고유명사를 번역하지 않았습니다.
  alternative_readings:
  - '의미역(예: 이름 뜻 반영)'
  rationale: 고유명사는 본문이 전달하는 식별 정보이므로 의미 풀이보다 표준 음역이 본문 충실성과 검증 가능성을 높입니다.
  doctrine_reference: 고유명사 처리 원칙
