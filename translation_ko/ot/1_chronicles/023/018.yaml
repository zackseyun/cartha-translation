  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי의 직접적 의미를 살려 “아들들”로 옮기되, 현대 한국어의 자연스러움을 위해 소유격 표현으로 구성했습니다.
- source_word: יִצְהָר
  english_pob_choice: Izhar
  chosen_korean: “이스할”
  alternatives_korean:
