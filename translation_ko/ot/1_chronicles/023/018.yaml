  text: '이스할의 아들들은: 셀로밋, 우두머리였습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: “아들들”
  alternatives_korean:
  - “자손들”
  - “후손들”
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי의 직접적 의미를 살려 “아들들”로 옮기되, 현대 한국어의 자연스러움을 위해 소유격 표현으로 구성했습니다.
- source_word: יִצְהָר
  english_pob_choice: Izhar
  chosen_korean: “이스할”
  alternatives_korean:
  - “이스하르”
  - “잇사할”
  lexicon: 고유명사 표기 관례
  rationale: 히브리어 고유명사는 통용되는 한국어 음역에 따라 표기했습니다.
- source_word: שְׁלֹמִית
  english_pob_choice: Shelomith
  chosen_korean: “셀로밋”
  alternatives_korean:
  - “셜로밋”
  - “세로밋”
  lexicon: 고유명사 표기 관례
  rationale: 히브리어 고유명사는 현대 한국어 음역 관례에 맞춰 옮겼습니다.
- source_word: הָרֹאשׁ
  english_pob_choice: the chief
  chosen_korean: “우두머리”
  alternatives_korean:
  - “지도자”
  - “머리”
  - “첫째”
  lexicon: HALOT
  rationale: 문맥상 조직·족보 목록에서의 지위 표시이므로, 영어 POB의 “the chief”를 한국어로 자연스럽고 직관적인 지위명인 “우두머리”로 옮겼습니다.
theological_decisions:
- issue: הָרֹאשׁ의 지위 표현을 어떻게 한국어로 드러낼지
  chosen_reading: 이 구절은 셀로밋을 단순한 이름 나열이 아니라 해당 계열의 대표적 인물로 제시합니다.
  alternative_readings:
  - 단순히 이름 뒤에 역점을 두지 않고 “그 머리”처럼 직역
  - “첫째”로 목록 순서만 강조
  rationale: 히브리어의 정관사 결합 표현은 족보/직무 목록에서 지위와 선두성을 나타내므로, 의미를 살려 지위 표현으로 반영했습니다.
  doctrine_reference: 족보 및 직무 서술의 문법적-의미적 기능
- issue: בְּנֵי의 집합적 의미
  chosen_reading: “이스할의 아들들”은 혈연 후손 집단을 가리키는 족보적 표현입니다.
  alternative_readings:
  - “이스할의 자손들”
  - “이스할의 후손들”
  rationale: 원문은 직계 아들 이상을 포함할 수 있는 족보 관용법이지만, 표면 형식은 ‘아들들’이므로 그 형태를 유지했습니다.
  doctrine_reference: 족보 언어의 표면 형식 보존
