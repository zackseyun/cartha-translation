- source_word: זִינָא
  english_pob_choice: Zina
  chosen_korean: 지나
  alternatives_korean:
  - 지자
  - 시자
  lexicon: 표준 음역
  rationale: 본문 자음형은 Zina에 해당하므로 이를 반영해 지나로 옮겼습니다. 관련 절의 이형 표기 ‘Zizah’는 본문이 아니라 주석에서만 처리했습니다.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  english_pob_choice: These were the sons of Shimei—four.
  chosen_korean: 이들은 시므이의 아들 넷입니다.
  alternatives_korean:
  - 이들은 시므이의 아들들 네 명입니다
  - 이들이 시므이의 아들 넷입니다
  lexicon: HALOT
  rationale: 명사절을 한국어 족보 문체로 자연스럽게 정리하되, 총계인 ‘넷’을 명시해 원문의 결론을 분명히 했습니다.
