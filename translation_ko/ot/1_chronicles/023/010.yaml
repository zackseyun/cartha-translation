base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
  footnotes:
  - marker: a
    text: Some translations read the second name as “Zizah” (compare 1 Chr 23:11); the Hebrew here reads Zina.
    reason: lexical_alternative
translation:
  language: ko
  text: 시므이의 아들들은 야핫, 지나, 여우스, 브리아입니다. 이들은 시므이의 아들 넷입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 번역본은 둘째 이름을 ‘지사’로 읽습니다(대상 23:11 비교). 여기서는 히브리어 본문에 따라 ‘지나’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: ~의 아들들은
  alternatives_korean:
  - 그리고 ~의 아들들은
  - ~의 아들들
  lexicon: HALOT
  rationale: 족보 목록의 단순 연결과 소속 관계를 자연스럽게 살리기 위해 ‘~의 아들들은’으로 옮겼습니다.
- source_word: שִׁמְעִי
  english_pob_choice: Shimei
  chosen_korean: 시므이
