translation:
  language: ko
  text: 시므이의 아들들은 야핫, 지나, 여우스, 브리아입니다. 이들은 시므이의 아들 넷입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 번역은 둘째 이름을 ‘Zizah’로 읽습니다(1 Chr 23:11 비교). 여기서는 히브리어 본문에 따라 ‘지나’로 옮겼습니다.
    reason: lexical_alternative
