  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
  footnotes:
  - marker: a
    text: Or 'and for all the offering up of burnt offerings to the LORD.' The Hebrew uses an infinitive plus the noun 'burnt offerings' to express the sacrificial act.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 번제 곧 야훼께 드리는 번제를 위한 일과, 안식일과 초하루와 정해진 절기에 드리는 일은 수효대로, 그에 대한 규례에 따라, 항상 야훼 앞에서 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘번제들을 올리는 일과 번제들에 대한 일’로 옮길 수 있습니다. 히브리어는 부정사와 명사 ‘번제들’을 함께 써 제사 행위를 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  english_pob_choice: and for all
  chosen_korean: 그리고 모든
  alternatives_korean:
  - 그리고 전부의
  - 그리고 모든 것에 대한
  lexicon: HALOT
  rationale: 목록의 다음 항목을 이어 주는 접속부로 보아 자연스러운 행정·제의 문맥의 ‘그리고 모든’으로 옮겼습니다.
- source_word: הַעֲלוֹת עֹלוֹת
  english_pob_choice: the burnt offerings offered
  chosen_korean: 번제 곧 … 번제를 위한 일
  alternatives_korean:
  - 번제를 드리는 일
  - 번제를 올리는 일
  lexicon: HALOT
  rationale: 히브리어는 ‘번제를 올리는 행위’라는 동작을 강조하므로, 단순 명사가 아니라 제의적 수행을 드러내는 표현으로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 주어진 POB 규범에 따라 신명은 ‘야훼’로 옮기며, 제사 문맥에서의 대상 표지도 그대로 보존했습니다.
- source_word: כְּמִשְׁפָּט
  english_pob_choice: according to the ordinance
  chosen_korean: 그에 대한 규례에 따라
  alternatives_korean:
  - 규례대로
  - 율법대로
  lexicon: HALOT
  rationale: 여기서 מִשְׁפָּט은 일반적 ‘판결’이 아니라 제의에 관한 규정이므로, ‘규례’로 옮겨 행정적·예식적 성격을 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기와 제의 문맥의 경외성
  chosen_reading: ‘야훼’와 ‘야훼 앞에서’로 일관해, 제사 행위가 언약 하나님 앞에서 이루어지는 점을 분명히 했습니다.
  alternative_readings:
  - ‘여호와’로 표기
  - ‘주 앞에서’로 완화
  rationale: 원문이 직접 신명 יְהוָה를 사용하므로, 본문이 가진 언약적·제의적 긴장을 약화하지 않도록 직접 표기를 유지했습니다.
  doctrine_reference: POB terminology for YHWH
