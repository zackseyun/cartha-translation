    issue: ‘맡겼습니다’의 주체와 의미
    rationale: 히브리어 열거는 앞 절의 레위인들의 직무를 계속 설명합니다. ‘맡겼습니다’는 그들이 업무를 남에게 위임하거나 배정했다는 뜻이 될 수 있으므로, ‘맡았습니다’로 고쳐야 합니다.
  - severity: medium
    issue: מְשׂוּרָה를 ‘되’로 번역함
    rationale: מְשׂוּרָה는 일반적인 측정량·계량을 뜻하며, 현대 한국의 특정 용량 단위인 ‘되’를 본문에 부여하지 않는 편이 원문의 포괄성을 보존합니다.
  - severity: low
    issue: ‘웨이퍼’의 등록(register)과 ‘잘 섞은 것’의 표현
    rationale: ‘웨이퍼’는 현대 상업 식품을 연상시켜 제의 문맥에 덜 어울립니다. רְקִיקִים의 얇은 빵이라는 뜻을 ‘무교병으로 만든 얇은 과자’로 나타내고, 수동 분사 מֻּרְבָּכֶת은 ‘섞어 만든 것’으로 자연스럽게 표현할 수 있습니다.
