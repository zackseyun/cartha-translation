  text: 그리고 차려 놓은 빵과, 곡식 제사를 위한 고운 가루와, 무교병의 웨이퍼와, 철판 위에 구운 것과, 잘 섞은 것과, 모든 되와 치수에 관한 일을 맡겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진설병’, ‘하나님 앞에 차려 놓은 빵’. 히브리어는 문자적으로는 ‘차림/배열의 빵’입니다.
    reason: lexical_alternative
