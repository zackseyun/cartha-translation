  source_fidelity: 초안은 아론 계열 제사장을 돕는 레위인의 성전 직무라는 기본 뜻과 야훼/하나님의 명칭 구별을 잘 보존합니다. 그러나 עַל이 나타내는 관리·책임의 범위를 ‘곧’과 ‘관여하는’으로 처리하여 약화했고, 마지막 ‘일의 작업’은 מַעֲשֵׂה עֲבֹדַת의 중첩을 부자연스럽게 옮겼습니다.
  naturalness: ‘야훼의 집의 일’, ‘모든 거룩한 것의 정결’, ‘하나님의 집의 일의 작업에 관여하는’은 현대 표준 한국어 문장으로 다소 경직되거나 어색합니다. 동사를 병렬하여 책임과 업무를 분명히 하면 합쇼체 문체에서 더 자연스럽습니다.
  terminology: ‘아론의 아들들’, ‘야훼’, ‘하나님의 집’은 적절합니다. 집합적 קֹדֶשׁ은 문맥상 ‘성물’로 자연스럽게 옮길 수 있으나, 더 넓은 ‘거룩한 것’을 뜻할 수 있음을 각주로 남깁니다. מַעֲמָדָם 및 לְיַד의 대안도 각주로 보존합니다.
