id: 1CH.23.28
reference: 1 Chronicles 23:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
  footnotes:
  - marker: a
    text: Or 'their station' or 'their office' for 'their duty.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'at the hand of the sons of Aaron,' that is, serving alongside or assisting them.
    reason: lexical_alternative
  - marker: c
    text: Or 'the purification of every holy thing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 맡겨진 직무[a]는 야훼의 집에서 섬기는 일에 아론의 아들들을 도와[b], 뜰과 방들을 맡아 돌보며, 모든 성물[c]을 정결하게 하고, 하나님의 집에서 하는 봉사의 일을 맡는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 자리’ 또는 ‘그들의 직분’.
    reason: מַעֲמָדָם은 맡겨진 직무뿐 아니라 배정된 자리나 직분을 뜻할 수 있습니다.
  - marker: b
    text: 직역하면 ‘아론의 아들들의 곁/손에’.
    reason: לְיַד는 문자적으로 곁에서 섬김을 나타내며, 여기서는 보조하는 역할을 뜻합니다.
  - marker: c
    text: 또는 ‘모든 거룩한 것’.
    reason: לְכָל קֹדֶשׁ은 성물을 가리킬 수 있으나, 더 넓게 모든 거룩한 것을 뜻할 수도 있습니다.
lexical_decisions:
- source_word: מַעֲמָדָם
  english_pob_choice: their duty
  chosen_korean: 그들의 직분
  alternatives_korean:
  - 그들의 임무
  - 그들의 자리
  - 그들의 직위
  lexicon: HALOT
  rationale: 문맥상 성전 봉사의 배정된 역할을 가리키므로, 기능을 드러내는 ‘직분’이 가장 자연스럽고도 공적입니다.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  english_pob_choice: to assist the sons of Aaron
  chosen_korean: 아론의 아들들을 도와
  alternatives_korean:
  - 아론의 아들들 곁에서
  - 아론의 아들들 아래서
  - 아론의 아들들과 함께
  lexicon: HALOT
  rationale: 직역하면 ‘손/곁에’이지만, 여기서는 제사장들을 보조하는 관계를 뜻하므로 ‘도와’가 idiomatic하게 의미를 살립니다.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  english_pob_choice: concerning the courts and the chambers
  chosen_korean: 곧 뜰과 방들과
  alternatives_korean:
  - 뜰과 방들에 대하여
  - 뜰과 골방들과
  - 뜰과 침방들과
  lexicon: HALOT
  rationale: עַל은 책임 범위를 나타내므로 한국어에서는 열거를 자연스럽게 풀어 ‘곧’으로 이어 주고, 성전 구조 용어는 ‘뜰’과 ‘방들’로 옮겼습니다.
- source_word: טָהֳרַת לְכָל קֹדֶשׁ
  english_pob_choice: the purification of all that is holy
  chosen_korean: 모든 거룩한 것의 정결
  alternatives_korean:
  - 모든 거룩한 것의 정결함
  - 모든 거룩한 것들의 정결
  - 모든 성물의 정결
  lexicon: HALOT
  rationale: קֹדֶשׁ은 집합적으로 ‘거룩한 것들/거룩한 것’ 모두를 가리킬 수 있어, 범위를 넓게 유지하는 ‘모든 거룩한 것’이 적절합니다.
- source_word: בֵּית יְהוָה / בֵּית הָאֱלֹהִים
  english_pob_choice: the house of Yahweh / the house of God
  chosen_korean: 야훼의 집 / 하나님의 집
  alternatives_korean:
  - 여호와의 집 / 하나님의 집
  - 주님의 집 / 하나님의 집
  lexicon: HALOT
  rationale: 본문이 여호와 이름과 일반 명칭을 구별해 사용하므로, 프로젝트 기본값에 따라 ‘야훼’와 ‘하나님의 집’을 구분해 살렸습니다.
theological_decisions:
- issue: לְיַד의 관계를 한국어에서 어떻게 드러낼 것인가
  chosen_reading: ‘아론의 아들들을 도와’로 보조·협력의 관계를 분명히 드러냈습니다.
  alternative_readings:
  - ‘아론의 아들들 곁에서’
  - ‘아론의 아들들 아래서’
  rationale: 이 표현은 레위인의 종속적이되 실제적인 보조 역할을 나타내며, 한국어에서는 위계보다 봉사 기능이 더 직접적으로 이해되도록 옮기는 것이 좋습니다.
  doctrine_reference: 성전 봉사와 제사장 보조의 질서에 관한 문맥적 해석
