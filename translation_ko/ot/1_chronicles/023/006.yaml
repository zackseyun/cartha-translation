  text: 다윗은 레위 자손, 곧 게르손과 고핫과 므라리를 여러 조로 나누었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “레위 자손을 여러 조로 나누었는데, 게르손과 고핫과 므라리를 위한 조들이었다.” 히브리어에서 ‘게르손’ 앞의 전치사는 이 세 이름이 앞선 ‘레위 자손’을 설명하는 목록인지, 각 조의 소속을 나타내는지와 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  english_pob_choice: divided them
  chosen_korean: 나누어 주었습니다
  alternatives_korean:
