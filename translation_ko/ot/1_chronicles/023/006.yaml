  rationale: 히브리어의 친족·계보 표지를 유지하되, 한국어에서는 목적격보다 ‘위해’가 배치의 목적을 자연스럽게 드러냅니다.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  english_pob_choice: Gershon, Kohath, and Merari
  chosen_korean: 게르손, 그핫, 그리고 므라리
  alternatives_korean:
  - 게르손, 고핫, 그리고 므라리
  - 게르손과 그핫과 므라리
  lexicon: HALOT
  rationale: 세 레위 씨족 이름은 한국어 음역의 일반적 표기를 따르되, 본문이 목록임을 분명히 하려고 쉼표와 ‘그리고’를 사용했습니다.
