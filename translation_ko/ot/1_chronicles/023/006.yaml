lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  english_pob_choice: divided them
  chosen_korean: 나누어 주었습니다
  alternatives_korean:
  - 분배했습니다
  - 나눴습니다
  - 배정했습니다
  lexicon: HALOT
  rationale: 3인칭 복수 목적어를 가진 ‘나누다/배분하다’의 분사적 완료 의미를 살리되, 레위인들의 직무 배치를 자연스럽게 드러내기 위해 ‘나누어 주었습니다’로 옮겼습니다.
- source_word: מַחְלְקוֹת
  english_pob_choice: into divisions
  chosen_korean: 분류들
  alternatives_korean:
  - 분반
  - 조
  - 반열
  lexicon: HALOT
  rationale: 레위인의 조직된 편제를 가리키므로 ‘division’의 직역인 ‘분류들’이 문맥상 가장 가까우며, 한국어에서도 제도적 분할의 뜻을 전달합니다.
- source_word: לִבְנֵי לֵוִי
  english_pob_choice: for the sons of Levi
  chosen_korean: 레위 자손을 위해
  alternatives_korean:
  - 레위의 아들들을 위해
  - 레위 사람들을 위해
  lexicon: HALOT
  rationale: 히브리어의 친족·계보 표지를 유지하되, 한국어에서는 목적격보다 ‘위해’가 배치의 목적을 자연스럽게 드러냅니다.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  english_pob_choice: Gershon, Kohath, and Merari
  chosen_korean: 게르손, 그핫, 그리고 므라리
  alternatives_korean:
  - 게르손, 고핫, 그리고 므라리
  - 게르손과 그핫과 므라리
  lexicon: HALOT
  rationale: 세 레위 씨족 이름은 한국어 음역의 일반적 표기를 따르되, 본문이 목록임을 분명히 하려고 쉼표와 ‘그리고’를 사용했습니다.
