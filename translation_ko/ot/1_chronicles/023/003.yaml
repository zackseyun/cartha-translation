  lexicon: HALOT
  rationale: 직역하면 ‘그들의 머리/머릿수로, 남자별로’라는 개별 인구조사의 관용구이므로, ‘머릿수로’와 ‘남자별로’로 그 구체성과 남성 한정을 함께 살렸습니다.
