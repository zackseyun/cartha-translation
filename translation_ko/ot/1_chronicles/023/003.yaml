base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
  footnotes:
  - marker: a
    text: Hebrew literally, 'by their heads, as men'; the expression indicates an individual count of adult males.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인들은 서른 살부터 그 이상으로 계수되었고, 그들의 수는 머릿수로, 곧 남자별로 삼만팔천 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 머리로, 남자들로’라는 뜻이며, 각 성인 남자를 개별적으로 계산했다는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  english_pob_choice: were counted
  chosen_korean: 계수되었고
  alternatives_korean:
  - 세어졌고
  - 번호가 매겨졌고
  - 등록되었고
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살려 레위인들이 ‘세어지는’ 대상임을 드러내되, 현대 한국어에서 자연스러운 공문체 어감을 유지했습니다.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  english_pob_choice: from thirty years old and upward
  chosen_korean: 서른 살부터 그 이상으로
  alternatives_korean:
  - 서른 살부터 위로
  - 서른 살 이상부터
  - 서른 살부터 올라
  lexicon: HALOT
  rationale: 자격 연령의 하한을 나타내는 관용구로 보고, 한국어에서는 ‘서른 살부터 그 이상으로’가 가장 자연스럽게 범위를 전달합니다.
- source_word: לְגֻלְגְּלֹתָם לִגְבָרִים
  english_pob_choice: by heads, man by man
  chosen_korean: 머릿수로, 곧 남자별로
  alternatives_korean:
  - 머리수로, 곧 사람별로
  - 머릿수로, 사람마다
  - 두상별로, 남자마다
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 머리/머릿수로, 남자별로’라는 개별 인구조사의 관용구이므로, ‘머릿수로’와 ‘남자별로’로 그 구체성과 남성 한정을 함께 살렸습니다.
