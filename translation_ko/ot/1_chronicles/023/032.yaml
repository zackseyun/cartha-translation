  text: 그들은 회막을 맡아 지키는 일과 거룩한 곳을 맡아 지키는 일[a]과 아론의 아들들, 곧 그들의 형제들이 맡은 일을 지켜서 야훼의 집에서 섬기는 일을 하여야 했습니다.
  philosophy: optimal-equivalence
  footnotes:
