base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
  footnotes:
  - marker: a
    text: Or “Shelomith,” a common alternative transliteration of the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 시므이의 아들들은 셀로못[a], 하지엘, 그리고 하란—세 사람입니다. 이들은 라단의 아버지들의 집안의 우두머리들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘셀로밋’. 이 이름의 흔한 다른 음역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  english_pob_choice: The sons of Shimei
  chosen_korean: 시므이의 아들들은
  alternatives_korean:
  - 시므이의 자손들은
  - 시므이의 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 바로 뒤의 세 인물을 직접 지칭하므로, 보다 넓은 ‘자손들’보다 구체적인 ‘아들들’이 원문에 가깝습니다.
- source_word: שלמות
  english_pob_choice: Shelomoth
  chosen_korean: 셀로못
  alternatives_korean:
  - 셀로밋
  lexicon: HALOT
  rationale: 히브리어 자음 형태와 POB의 영어 선택을 따라 이 절에서는 ‘셀로못’으로 음역했습니다. 영어 각주가 말하듯 다른 전통적 음역인 ‘Shelomith’에 해당하는 대안도 있습니다.
- source_word: וַחֲזִיאֵל
  english_pob_choice: Haziel
  chosen_korean: 하지엘
  alternatives_korean:
  - 하지엘
  lexicon: HALOT
  rationale: 히브리어 이름 חֲזִיאֵל을 직접 음역하되, 한국어 표기법에 맞춰 ‘하지엘’로 옮겼습니다.
- source_word: רָאשֵׁי הָאָבוֹת
  english_pob_choice: heads of the fathers’ houses
  chosen_korean: 아버지들의 집안의 우두머리들
  alternatives_korean:
  - 가문들의 수장들
  - 아버지 집안들의 머리들
  lexicon: HALOT
  rationale: 역대기에서 관용적으로 쓰이는 혈족·가문 단위를 살려 ‘아버지들의 집안’을 유지했고, רָאשֵׁי는 직역에 가까운 ‘우두머리들’로 옮겼습니다.
theological_decisions:
- issue: 족보 요약 표현의 수치 보존
  chosen_reading: ‘세 사람입니다’로 שְׁלֹשָׁה를 분명히 드러냈습니다.
  alternative_readings:
  - 문맥상 생략하여 자연스럽게 처리함
  - ‘세 명’으로 일반화함
  rationale: 원문은 이름 셋 뒤에 총수를 덧붙여 족보 항목을 요약하므로, 숫자 정보를 명시적으로 보존하는 편이 원문의 구조를 더 잘 드러냅니다.
  doctrine_reference: 본문 구조 보존 원칙
