  text: 시므이의 아들들은 셀로못[a], 하지엘, 그리고 하란—세 사람입니다. 이들은 라단의 조상 가문의 우두머리들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘셀로밋’. 이 이름의 흔한 다른 음역입니다.
