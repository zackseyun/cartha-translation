  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 원칙이므로, POB의 기본형에 맞춰 ‘라단’으로 옮겼습니다.
- source_word: וְשִׁמְעִי
  english_pob_choice: and Shimei
  chosen_korean: 시므이
  alternatives_korean:
  - 그리고 시므이
  lexicon: HALOT
  rationale: 열거 구조상 한국어에서는 첫 항목 뒤에 쉼표로 이어지는 방식이 더 자연스러워, 접속사 ‘그리고’를 생략해도 원문의 병렬 관계가 유지됩니다.
