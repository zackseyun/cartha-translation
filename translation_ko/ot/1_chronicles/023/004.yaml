translation:
  language: ko
  text: 이들 가운데 야훼의 집 일을 감독할 사람이 이만 사천 명이었고, 관리와 재판관이 육천 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  english_pob_choice: Of these
  chosen_korean: 이 가운데에서
  alternatives_korean:
  - 이들 중에서
  - 이들 가운데서
  lexicon: HALOT
  rationale: 앞서 언급된 레위인들 가운데서 한 부분을 가리키는 분할적 표현이므로, 한국어에서는 자연스러운 ‘이 가운데에서’로 풀어 부분성을 살렸습니다.
- source_word: לְנַצֵּחַ עַל מְלֶאכֶת
  english_pob_choice: were to oversee the work of
  chosen_korean: 일을 감독하는
  alternatives_korean:
  - 일을 맡아 다스리는
  - 일을 관리하는
  - 일을 감독하여 맡는
  lexicon: HALOT
  rationale: נצלח 계열의 כאן은 음악적 ‘인도’가 아니라 업무 감독/지휘의 뜻이므로, 행정·관리 맥락에 맞게 ‘감독하는’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 구절의 개정 영어 POB가 고유명으로서 Yahweh를 택했지만, 한국어 본문은 현재 POB의 한국어 전통 용례와 가독성을 고려해 ‘여호와’로 옮겼습니다.
- source_word: וְשֹׁטְרִים וְשֹׁפְטִים
  english_pob_choice: officers and judges
  chosen_korean: 관리들과 재판관들
  alternatives_korean:
  - 관리들과 판관들
  - 관리들과 집행관들
  lexicon: HALOT
  rationale: שֹׁטְרִים은 단순한 ‘관리자’보다 행정 집행을 맡은 관리층을 뜻하므로 ‘관리들’로, שֹׁפְטִים은 사법 기능을 드러내는 ‘재판관들’로 옮겼습니다.
theological_decisions:
- issue: 구약 본문에서 신명기적 언약명 יְהוָה의 처리
  chosen_reading: 본문에서는 ‘여호와’로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 한국어 성경 독자층의 식별성과 POB의 현행 한국어 표기 관행을 우선해 본문 표기는 ‘여호와’로 두되, 원어의 고유명성은 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
