  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
  footnotes:
  - marker: a
    text: Or 'the princes of Israel,' 'the officials of Israel,' or 'the chiefs of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이스라엘의 모든 지도자와 제사장들과 레위인들을 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 모든 지도자’는 원문의 שָׂרֵי יִשְׂרָאֵל에 대한 번역으로, 문맥상 ‘이스라엘의 고관들’, ‘이스라엘의 관리들’, 또는 ‘이스라엘의 수장들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  english_pob_choice: And he gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 소집했습니다
  - 모아들였습니다
  lexicon: HALOT
  rationale: אסף는 ‘모으다, 불러 모으다’의 뜻이므로, 서술 진행을 자연스럽게 살리면서도 공식적인 문맥에 맞는 ‘모았습니다’로 옮겼습니다.
- source_word: שָׂרֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of Israel
  chosen_korean: 이스라엘의 모든 지도자
  alternatives_korean:
  - 이스라엘의 모든 지휘관
  - 이스라엘의 모든 통치자
  - 이스라엘의 모든 우두머리
  lexicon: HALOT
  rationale: שָׂרִים는 문맥상 ‘지도자, 수장, 우두머리’의 범위가 가능하므로, ‘지도자’로 옮겨 현대 한국어에서 가장 자연스럽고 문맥에 맞게 처리했습니다.
- source_word: וְהַכֹּהֲנִים
  english_pob_choice: and the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 그리고 제사장들
  - 또한 제사장들
  lexicon: HALOT
  rationale: 정관사와 접속을 한국어에서는 별도 표지 없이 복수 명사로 자연스럽게 반영했습니다.
- source_word: וְהַלְוִיִּם
  english_pob_choice: and the Levites
  chosen_korean: 레위인들
  alternatives_korean:
  - 그리고 레위인들
  - 또한 레위인들
  lexicon: HALOT
  rationale: 고유 집단명은 관용적인 한국어 성경 용례를 따르되, 원문의 민족·직분 집단을 분명히 드러내는 형태로 옮겼습니다.
