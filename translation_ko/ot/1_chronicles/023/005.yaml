  rationale: 성전 행정 문맥에서 שער의 역할을 맡은 사람을 자연스럽게 가리키는 말로, 현대 한국어에서는 '문지기'가 가장 직접적이고 이해하기 쉽습니다.
- source_word: מְהַֽלְלִים לַ/יהוָה
