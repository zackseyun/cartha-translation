translation:
  language: ko
  text: 그리고 문지기 사천 명과, 찬양하기 위해 내가 만든 기구들[a]로 야훼를 찬양하는 사천 명이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내가 찬양하기 위해 만든 기구들’입니다. ‘찬양하기 위해’의 목적어는 명시되어 있지 않으며, 문맥상 이 기구들은 찬양에 쓰는 악기들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֲרִים
  english_pob_choice: gatekeepers
  chosen_korean: 문지기
  alternatives_korean:
  - 문지기들
