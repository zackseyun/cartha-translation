  lexicon: HALOT
  rationale: הלך의 분사형은 계속적 역할을 나타내므로, 현재적·직역적 뉘앙스를 살리되 예배 문맥에 맞는 '찬양하는'으로 옮겼습니다.
- source_word: בַּ/כֵּלִים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל
  english_pob_choice: with the instruments that I made to praise him
