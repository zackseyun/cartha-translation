  - 내가 예배를 위해 만든 도구들을 가지고
  lexicon: HALOT
  rationale: כֵּלִים은 넓게는 '도구/기구'를 뜻하므로, 음악적 의미를 단정하기보다 본문이 허용하는 범위 안에서 '도구들'로 남겼습니다. לְהַלֵּל은 목적의 부정사이므로 '찬양하도록'으로 자연스럽게 표현했습니다.
