  rationale: 성전 행정 문맥에서 שער의 역할을 맡은 사람을 자연스럽게 가리키는 말로, 현대 한국어에서는 '문지기'가 가장 직접적이고 이해하기 쉽습니다.
- source_word: מְהַֽלְלִים לַ/יהוָה
  english_pob_choice: praising Yahweh
  chosen_korean: 야훼를 찬양하는
  alternatives_korean:
  - 야훼를 찬송하는
  - 야훼를 찬미하는
  lexicon: HALOT
  rationale: הלך의 분사형은 계속적 역할을 나타내므로, 현재적·직역적 뉘앙스를 살리되 예배 문맥에 맞는 '찬양하는'으로 옮겼습니다.
- source_word: בַּ/כֵּלִים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל
  english_pob_choice: with the instruments that I made to praise him
  chosen_korean: 내가 그들을 찬양하도록 만든 도구들을 가지고
  alternatives_korean:
  - 내가 찬양하기 위해 만든 악기들을 가지고
  - 내가 예배를 위해 만든 도구들을 가지고
  lexicon: HALOT
  rationale: כֵּלִים은 넓게는 '도구/기구'를 뜻하므로, 음악적 의미를 단정하기보다 본문이 허용하는 범위 안에서 '도구들'로 남겼습니다. לְהַלֵּל은 목적의 부정사이므로 '찬양하도록'으로 자연스럽게 표현했습니다.
