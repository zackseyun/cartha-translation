source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וַ/יִּשָּׂא֥וּ/ם בְּנֵי קִ֖ישׁ אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
  footnotes:
  - marker: a
    text: Or, more literally, 'took them as wives.'
    reason: lexical_alternative
  - marker: b
    text: '''Their brothers'' likely refers to close clan relatives in the related family line, not necessarily uterine brothers.'
    reason: cultural_note
translation:
  language: ko
  text: 엘르아살이 죽고 아들이 없고 딸들만 있었는데, 기스의 아들들—그들의 형제들—이 그들을 아내로 맞았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들을 아내로 맞았습니다’는 보다 직역하면 ‘그들을 아내로 삼았습니다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 형제들’은 여기서 반드시 같은 어머니에게서 난 형제만이 아니라, 가까운 씨족 친족을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 세상을 떠나고
  lexicon: HALOT
  rationale: מות의 기본 의미를 직접 살려 완곡어법보다 평이한 ‘죽고’로 옮겼습니다.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  english_pob_choice: had no sons, but only daughters
  chosen_korean: 아들이 없고 딸들만 있었는데
  alternatives_korean:
  - 아들이 없었고 딸들만 있었는데
  - 아들은 없고 딸들만 있었는데
  lexicon: HALOT
  rationale: בנים을 여기서는 뒤의 ‘딸들’과의 대비에 따라 ‘아들들’로 구체화했고, כי אם의 배타적 의미를 ‘만’으로 간결하게 살렸습니다.
- source_word: וַיִּשָּׂאוּם
  english_pob_choice: married them
  chosen_korean: 그들을 아내로 맞았습니다
  alternatives_korean:
  - 그들과 결혼했습니다
  - 그들을 아내로 삼았습니다
  lexicon: HALOT
  rationale: נשא의 ‘아내로 맞다/취하다’는 결혼 관용구를 반영하되 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: אֲחֵיהֶם
  english_pob_choice: their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 형제들
  lexicon: HALOT
  rationale: 문자적으로 ‘형제들’을 유지해 족보 문맥의 친족 관계를 보존했고, 필요시 넓은 친족을 뜻할 수 있다는 주석 가능성을 남겼습니다.
theological_decisions:
- issue: 족보 서술에서 ‘형제들’의 범위
  chosen_reading: 본문은 딸들의 ‘형제들’을 말하지만, 문맥상 같은 계통의 가까운 친족까지 포함할 수 있는 족보적 표현으로 읽었습니다.
  alternative_readings:
  - 문자 그대로 같은 부모에게서 난 형제
  - 단순히 더 넓은 친족 관계
  rationale: 영문 POB의 주석처럼, 족보·씨족 문맥에서는 혈연상 형제라기보다 같은 가문/지파 내 가까운 친족을 가리킬 수 있습니다.
  doctrine_reference: 족보·씨족 용례에 대한 문맥적 해석
