base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
  footnotes:
  - marker: a
    text: Or, more literally, 'took them as wives.'
    reason: lexical_alternative
  - marker: b
    text: '''Their brothers'' likely refers to close clan relatives in the related family line, not necessarily uterine brothers.'
    reason: cultural_note
translation:
  language: ko
  text: 엘르아살은 죽었고, 아들은 없었으며 딸들만 있었습니다. 기스의 아들들, 곧 그 딸들의 형제들이 그 딸들을 아내로 맞았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 딸들을 아내로 맞았습니다’는 더 직역하면 ‘그 딸들을 아내로 삼았습니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 딸들의 형제들’은 반드시 친형제들만을 뜻하지 않고, 관련된 가문 계통의 가까운 씨족 친족을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽고
  alternatives_korean:
  - 죽었습니다
  - 세상을 떠나고
