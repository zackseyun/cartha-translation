  text: בְּנֵ֥י עַמְרָ֖ם אַהֲרֹ֣ן וּ/מֹשֶׁ֑ה וַ/יִּבָּדֵ֣ל אַהֲרֹ֡ן לְֽ/הַקְדִּישׁ/וֹ֩ קֹ֨דֶשׁ קָֽדָשִׁ֤ים הֽוּא וּ/בָנָי/ו֙ עַד עוֹלָ֔ם לְ/הַקְטִיר֩ לִ/פְנֵ֨י יְהוָ֧ה לְ/שָׁרְת֛/וֹ וּ/לְ/בָרֵ֥ךְ בִּ/שְׁמ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
  footnotes:
  - marker: a
    text: Or 'holy of holies.' The Hebrew expression is literally 'holiness of holinesses,' a superlative meaning 'most holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 암람의 아들들은 아론과 모세입니다. 아론은, 그와 그의 아들들은 영원히, 지극히 거룩하게 하도록[a] 구별되었으며, 야훼 앞에서 분향하고, 그를 섬기며, 그의 이름으로 영원히 축복하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 거룩한 것(성물)’이라는 뜻입니다. 히브리어 표현은 문자적으로 ‘거룩함들의 거룩함’으로, 최상급을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  english_pob_choice: The sons of Amram
  chosen_korean: 암람의 아들들
  alternatives_korean:
  - 암람의 자손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי를 직역해 ‘아들들’로 옮겼고, 뒤이어 아론과 모세를 바로 제시하므로 ‘자손들’보다 직접적입니다.
- source_word: וַיִּבָּדֵל
  english_pob_choice: was set apart
  chosen_korean: 구별되었으며
  alternatives_korean:
  - 분리되었으며
  - 따로 떼어 놓였으며
  lexicon: HALOT
  rationale: בדל의 핵심은 특별한 목적을 위한 분리이므로, 제의적 맥락에서 ‘구별되다’가 가장 자연스럽습니다.
- source_word: לְהַקְדִּישׁוֹ
  english_pob_choice: to sanctify him
  chosen_korean: 지극히 거룩하게 하도록
  alternatives_korean:
  - 성별하도록
  - 거룩하게 하도록
  - 성화하도록
  lexicon: HALOT
  rationale: 히필의 קדש는 ‘거룩하게 하다/성별하다’의 뜻이지만, 여기서는 곧 이어지는 קֹדֶשׁ קָדָשִׁים과 연결되어 ‘지극히 거룩하게’로 풀어 제의적 강도를 살렸습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩하게
  alternatives_korean:
  - 가장 거룩하게
  - 지성소처럼
  lexicon: HALOT
  rationale: 이 표현은 ‘지극히 거룩한 것/존재’를 나타내는 최상급 관용구이므로, 성소 지명인 ‘지성소’로 오해되지 않도록 서술적으로 옮겼습니다.
- source_word: לְהַקְטִיר
  english_pob_choice: to burn incense
  chosen_korean: 분향하고
  alternatives_korean:
  - 향을 피우고
  - 향을 태우고
  lexicon: HALOT
  rationale: 제사장 직무 문맥에서 קטר는 향을 피우는 행위를 가리키므로 ‘분향하다’가 가장 간결하고 정확합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 본문의 신명 표기를 따라 ‘야훼’로 옮겼고, לִפְנֵי는 공간적·관계적 임재를 함께 살려 ‘앞에서’로 번역했습니다.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  english_pob_choice: and to bless in his name
  chosen_korean: 그의 이름으로 영원히 축복하게 하셨습니다
  alternatives_korean:
  - 그의 이름으로 축복하게 하셨습니다
  - 그 이름으로 복을 빌게 하셨습니다
  lexicon: HALOT
  rationale: בִּשְׁמוֹ는 이름의 권위 아래에서의 축복을 뜻하므로, ‘그의 이름으로’로 살리고 제사장적 행위를 ‘축복하다’로 옮겼습니다.
theological_decisions:
- issue: ‘to minister to him’의 목적어와 제의적 방향
  chosen_reading: ‘그를 섬기며’의 ‘그’는 문맥상 야훼를 가리키며, 아론의 직무가 하나님께 향한 섬김임을 살렸습니다.
  alternative_readings:
  - 아론을 섬기며
  - 아론에게 봉사하며
  rationale: 바로 앞의 ‘야훼 앞에서’와 뒤의 축복 직무가 제사장 직무의 대상이 하나님임을 분명히 하므로, 문맥상 하나님을 목적어로 이해했습니다.
  doctrine_reference: 제사장 직무의 하나님 지향성
