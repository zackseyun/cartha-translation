  lexicon: WLC; genealogical formula
  rationale: 계보 목록의 도입부를 한국어에서 자연스러운 머리말처럼 처리하되, 원문의 열거 시작을 살리기 위해 간결한 서술형으로 옮겼습니다.
- source_word: רְחַבְיָה הָרֹאשׁ
  english_pob_choice: Rehabiah was the chief
  chosen_korean: 르하뱌가 우두머리였고
  alternatives_korean:
  - 르하뱌가 머리였고
  - 르하뱌가 지도자였고
  lexicon: HALOT
  rationale: הָרֹאשׁ는 이 문맥에서 단순한 신체 부위가 아니라 지위와 우선성을 나타내므로, 한국어에서는 관용적으로 ‘우두머리’로 옮겨 그 지위를 분명히 했습니다.
- source_word: וּבְנֵי רְחַבְיָה רָבוּ לְמָעְלָה
  english_pob_choice: but the sons of Rehabiah became very many
  chosen_korean: 그러나 르하뱌의 아들들은 매우 많아졌습니다.
  alternatives_korean:
  - 그리고 르하뱌의 아들들은 매우 많아졌습니다
  - 르하뱌의 아들들은 매우 번성했습니다
  lexicon: HALOT
  rationale: רָבוּ לְמָעְלָה의 ‘증가/번성’과 ‘매우’의 강화를 함께 살려, 결과 상태를 자연스럽게 나타내는 ‘매우 많아졌습니다’로 옮겼습니다.
