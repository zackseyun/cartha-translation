  - marker: a
    text: Or "multiplied greatly."
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리에셀의 아들들은 이러합니다. 르하뱌가 우두머리였고, 엘리에셀에게는 다른 아들이 없었습니다. 그러나 르하뱌의 아들들은 매우 많아졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “매우 번성했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  english_pob_choice: 'The sons of Eliezer:'
  chosen_korean: 엘리에셀의 아들들은 이러합니다.
  alternatives_korean:
