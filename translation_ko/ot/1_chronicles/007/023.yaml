  to: 그는 아내와 동침하였고, 아내는 임신하여 아들을 낳았습니다. 그는 그 아들의 이름을 브리아라고 불렀습니다.[a] 이는 재앙[b]이 그의 집안에 있었기 때문입니다.[c]
