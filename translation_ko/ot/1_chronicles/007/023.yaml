base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
  footnotes:
  - marker: a
    text: Or 'he named him Beriah.'
    reason: lexical_alternative
  - marker: b
    text: '''Disaster'' here refers to calamity or misfortune that had struck his household, not moral evil.'
    reason: lexical_alternative
  - marker: c
    text: Or 'because calamity was in his house.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 아내와 동침하였고, 아내는 임신하여 아들을 낳았습니다. 그는 그 아들의 이름을 브리아라고 불렀습니다.[a] 이는 재앙[b]이 그의 집안에 있었기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 브리아라고 이름하였습니다.’
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘재앙’은 도덕적 악이 아니라 그의 집안에 닥친 재난이나 불운을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 집안에 재난이 있었기 때문에.’
    reason: alternative_reading
