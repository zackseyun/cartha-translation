translation:
  language: ko
  text: 납달리의 아들들은 야흐지엘, 구니, 에셀, 살룸이며, 이들은 빌하의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 46:24에는 이 이름이 ‘실렘’으로 나옵니다. 역대기 본문은 여기서 ‘살룸’이라고 읽습니다.
    reason: alternative_reading
