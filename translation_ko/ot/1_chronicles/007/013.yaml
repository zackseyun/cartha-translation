theological_decisions:
- issue: 역대기의 본문형이 창세기 46:24의 평행 이름과 다름
  chosen_reading: 본문대로 ‘살룸’으로 번역하고, 평행 본문과의 차이는 각주로 표시합니다.
  alternative_readings:
