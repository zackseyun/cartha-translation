  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בן의 복수형은 여기서 바로 이어지는 남성 이름들을 가리키므로, 자연스러운 한국어로는 ‘아들들’이 가장 직접적입니다.
