  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִתְיַחְשָׂ֣/ם לְ/תֹלְדוֹתָ֗/ם רָאשֵׁי֙ בֵּ֣ית אֲבוֹתָ֔/ם גִּבּוֹרֵ֖י חָ֑יִל עֶשְׂרִ֥ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
  footnotes:
  - marker: a
    text: Or 'registered by genealogy.' The Hebrew verb refers to being entered in a genealogical record.
    reason: lexical_alternative
  - marker: b
    text: '''Fathers’ houses'' is a clan-based household term, referring to ancestral family units rather than merely nuclear families.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 족보에 따라 기록되었는데, 조상 가문의 우두머리들이었으며, 용맹한 전사들이었습니다. 그 수는 이만 이백 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  english_pob_choice: They were enrolled by genealogy
  chosen_korean: 족보에 따라 기록되었는데
  alternatives_korean:
  - 족보로 등록되었는데
  - 족보에 따라 등재되었는데
  lexicon: HALOT
  rationale: 히트파엘 형태의 יחשׂ는 역대기 문맥에서 족보 명부에 들어가다/기록되다의 뜻이므로, 행정적·족보적 의미를 살린 표현으로 옮겼습니다.
- source_word: לְתֹלְדוֹתָם
  english_pob_choice: according to their generations
  chosen_korean: 족보에 따라
  alternatives_korean:
  - 그들의 نسل에 따라
  - 세대에 따라
  - 가계에 따라
  lexicon: HALOT
  rationale: תּוֹלְדוֹת는 세대라기보다 혈통·계보의 흐름을 가리키므로, 앞의 족보 맥락과 자연스럽게 이어지도록 압축해 옮겼습니다.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  english_pob_choice: as heads of their fathers’ houses
  chosen_korean: 조상 가문의 우두머리들이었으며
  alternatives_korean:
  - 조상 집안의 우두머리들이었으며
  - 아버지들의 집의 우두머리들이었으며
  lexicon: HALOT
  rationale: ‘fathers’ houses’는 씨족 단위의 가문 표현이므로, 직역보다 독자가 이해하기 쉬운 ‘조상 가문’으로 옮기되 집단적 구조는 유지했습니다.
- source_word: גִּבּוֹרֵי חָיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 전사들이었습니다
  alternatives_korean:
  - 용맹한 사람들었습니다
  - 강한 용사들이었습니다
  lexicon: HALOT
  rationale: 해당 관용구는 단순한 힘보다 전투적 용기와 유능함을 함께 담으므로, 현대 한국어에서 자연스러운 ‘용맹한 전사들’로 옮겼습니다.
