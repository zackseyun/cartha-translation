id: 1CH.7.31
reference: 1 Chronicles 7:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּ/מַלְכִּיאֵ֑ל ה֖וּא אֲבִ֥י ברזות׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/031.yaml
  text: 'The sons of Beriah: Heber and Malchiel[b][a]; he was the father of Birzaith.'
  footnotes:
  - marker: a
    text: Or 'ancestor of' or 'founder of' Birzaith; in genealogical contexts, 'father of' may indicate a clan or settlement founder rather than an immediate biological father.
    reason: lexical_alternative
  - marker: b
    text: The name 'Birzaith' may also be rendered 'Birzoth' or 'Berazoth' in English transliteration.
    reason: alternative_reading
translation:
  language: ko
  text: 브리아의 아들들은 헤벨과 말기엘이며, 그는 브리사잇의 아버지였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보 문맥에서는 ‘아버지’가 곧바로 생물학적 부친만이 아니라 조상이나 창시자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘브리사잇’은 영어 전통에서 Birzoth, Berazoth처럼 다르게 음역될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 아들들이
  - 아들들은 그리고
  lexicon: HALOT
  rationale: 족보 문맥에서 ‘sons of’는 직계 자녀 목록을 여는 관용 표현이므로, 한국어도 자연스럽게 ‘아들들은’으로 옮겨 목록 구조를 살렸습니다.
- source_word: בְרִיעָה
  english_pob_choice: Beriah
  chosen_korean: 브리아
  alternatives_korean:
  - 베리아
  - 베르야
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 옮겼으며, 영어 POB의 Beriah에 대응하는 표준적 표기를 택했습니다.
- source_word: חֶבֶר
  english_pob_choice: Heber
  chosen_korean: 헤벨
  alternatives_korean:
  - 헤버
  - 헤브론
  lexicon: HALOT
  rationale: 히브리어 인명 חֶבֶר는 한국어 음역에서 ‘헤벨’이 자연스럽고 원음에 더 가깝습니다.
- source_word: הוּא אֲבִי
  english_pob_choice: he was the father of
  chosen_korean: 그는 …의 아버지였습니다
  alternatives_korean:
  - 그는 …의 조상이었습니다
  - 그는 …의 시조였습니다
  lexicon: HALOT
  rationale: 족보에서 ‘아버지’는 생물학적 부친뿐 아니라 혈통·집단·정착지의 기원자를 가리킬 수 있으므로, 본문은 직역을 유지하되 그 문맥적 여지를 살렸습니다.
- source_word: ברזות
  english_pob_choice: Birzaith
  chosen_korean: 브리사잇
  alternatives_korean:
  - 브리조스
  - 베라조스
  lexicon: HALOT
  rationale: 희귀한 지명/씨족명으로 보이므로, 영어 POB의 보수적 음역을 따라 한국어도 해석을 덧붙이지 않고 음역했습니다.
theological_decisions:
- issue: 족보에서 ‘아버지’의 범위
  chosen_reading: ‘아버지였습니다’를 유지해 생물학적 부친이 아닌 창시자/조상 의미까지 포괄하도록 했습니다.
  alternative_readings:
  - ‘조상이었습니다’로 완화
  - ‘시조였습니다’로 해석
  rationale: 영어 POB 주석이 지적하듯 족보의 ‘father of’는 혈연보다 더 넓은 기원 관계를 뜻할 수 있으므로, 본문은 해석을 고정하지 않는 직역을 택했습니다.
  doctrine_reference: 족보 본문 해석 원칙
- issue: 브리사잇의 정체
  chosen_reading: 지명 또는 씨족명으로 열어 두었습니다.
  alternative_readings:
  - 단순 고유인명으로 처리
  - 특정 지명으로 단정
  rationale: 희귀 표기라 본문만으로 범주를 확정하기 어려우므로, 영어 POB의 신중한 음역을 따라 의미를 과도하게 확정하지 않았습니다.
  doctrine_reference: 본문 비확정성 보존 원칙
