- from: 야훼께서 이렇게 말씀하십니다. 「야플렛의 아들들은 파삭, 비므할, 그리고 아쉬밧입니다. 이들은 야플렛의 아들들입니다」.[a][b]
  to: 야플렛의 아들은 파삭, 비므할, 아쉬밧입니다.[a] 이들은 야플렛의 아들입니다.
  rationale: 원문에 없는 신적 화자 도입과 직접 인용 형식을 제거하여 족보 서술의 형태를 회복했습니다. בְנֵי를 ‘아들’로, אֵלֶּה를 ‘이들은’으로 옮겨 반복되는 족보 요약 공식을 보존했습니다. 필요한 음역 대안만 파삭에 연결된 각주로 남기고, 한국어 번역에 적용되지 않는 시제 설명 각주는 حذف했습니다.
