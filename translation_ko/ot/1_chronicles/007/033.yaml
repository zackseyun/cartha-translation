source:
  edition: WLC
  text: וּ/בְנֵ֣י יַפְלֵ֔ט פָּסַ֥ךְ וּ/בִמְהָ֖ל וְ/עַשְׁוָ֑ת אֵ֖לֶּה בְּנֵ֥י יַפְלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
  footnotes:
  - marker: a
    text: Or 'Pasah' for the first name listed; English transliterations of Hebrew personal names vary.
    reason: lexical_alternative
  - marker: b
    text: Or 'These are the sons of Japhlet.' The Hebrew demonstrative formula can be rendered with either present or past tense in English genealogical style.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「야플렛의 아들들은 파삭, 비므할, 그리고 아쉬밧입니다. 이들은 야플렛의 아들들입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 영어와 한국어 모두에서 음역 차이가 있을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 족보 문맥의 히브리어 지시어는 영어처럼 현재형·과거형 어느 쪽으로도 옮길 수 있으나, 한국어에서는 요약형 ‘이들은’이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי / בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְנֵי는 가장 직접적으로 ‘아들들’을 뜻하므로, 영어 POB의 ‘sons of’에 맞추어 간명하게 옮겼습니다.
- source_word: יַפְלֵט
  english_pob_choice: Japhlet
  chosen_korean: 야플렛
  alternatives_korean:
  - 자플렛
  - 야프렛
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 번역하지 않고 음역해야 하므로, 현대 한국어 독법에 맞는 야플렛으로 옮겼습니다.
- source_word: פָּסַךְ
  english_pob_choice: Pasach
  chosen_korean: 파삭
  alternatives_korean:
  - 파사흐
  - 파사
  lexicon: 고유명사 음역
  rationale: 끝 자음 כ를 반영해 파삭으로 음역했고, 영어 주석의 대안 표기 Pasah에 대응하는 지나친 완화는 피했습니다.
- source_word: וּבִמְהָל
  english_pob_choice: Bimhal
  chosen_korean: 비므할
  alternatives_korean:
  - 비말
  - 빔할
  lexicon: 고유명사 음역
  rationale: 중간의 자음군을 살려 비므할로 옮겨, 영어 POB의 Bimhal과 대응시키되 한국어 표기 가능성을 유지했습니다.
- source_word: וְעַשְׁוָת
  english_pob_choice: Ashvath
  chosen_korean: 아쉬밧
  alternatives_korean:
  - 아쉬와트
  - 아쉬왓
  lexicon: 고유명사 음역
  rationale: שׁו 계열의 발음을 한국어로 자연스럽게 반영하면서도, 종결 자음을 통해 이름의 분절을 보존했습니다.
- source_word: אֵלֶּה
  english_pob_choice: These were
  chosen_korean: 이들은
  alternatives_korean:
  - 이들은 …입니다
  - 이것들이
  lexicon: HALOT
  rationale: 족보의 요약 공식인 אֵלֶּה를 한국어의 자연스러운 지시어 ‘이들은’으로 옮겨, 목록의 마무리 기능을 살렸습니다.
theological_decisions:
- issue: 족보 문장의 화자 표지와 직접화법 처리
  chosen_reading: 직접 인용 없이 서술형으로만 옮기지 않고, 본문 전체를 야훼의 말씀 도입부로 처리했습니다.
  alternative_readings:
  - 중립적인 족보 서술로만 제시
  - 화자 표지 없이 단순 목록으로 제시
  rationale: 원문 자체는 직접 인용 표지를 포함하지 않지만, 본 절이 앞뒤 문맥상 성경 본문 서술로 읽히므로, 본문 내부에서 추가적인 신학적 의미를 만들지 않도록 최소한으로 처리했습니다.
  doctrine_reference: 성경 본문의 화자와 서술층위 보존
