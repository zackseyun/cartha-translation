    rationale: 히브리어는 ‘그의 아들 사밧, 그의 아들 수델라’라는 계보 나열입니다. ‘그의 아들’을 별도 인물처럼 두면 문법적 관계가 무너지고, ‘웃랄’은 수델라(Shuthelah)에 대응하지 않습니다.
