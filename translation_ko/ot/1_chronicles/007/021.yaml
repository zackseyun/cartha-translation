  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 연결된 나열 구조를 그대로 살렸습니다.
- source_word: אַנְשֵׁי גַת֙ הַ/נּוֹלָדִ֣ים בָּ/אָ֔רֶץ
  english_pob_choice: the men of Gath who were born in the land
  chosen_korean: 가드 사람들 곧 그 땅에서 태어난 사람들이
  alternatives_korean:
  - 가드의 사람들, 그 땅에서 태어난 자들이
