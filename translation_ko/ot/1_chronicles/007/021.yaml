  to: 그의 아들 사밧, 그의 아들 수델라, 그리고 에셀과 엘르앗이 있었습니다. 그 땅에서 태어난 가드 사람들이 그들을 죽였습니다. 그들이 그들의 가축을 가져가려고 내려갔기 때문입니다.[a][b]
  rationale: 계보 접미사 ‘그의 아들’을 각각 사밧과 수델라에 연결하고, 수델라의 음역을 바로잡았습니다. 가드 사람들을 수식하는 출생 표현을 동격화하지 않았으며, ‘빼앗다’의 추가 뉘앙스를 피하여 원문의 ‘가져가다’를 살렸습니다. 대명사의 문맥상 지시는 본문에서 과도하게 단정하지 않고 각주로 밝혔습니다.
