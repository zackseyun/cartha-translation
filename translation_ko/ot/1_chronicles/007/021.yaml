  - 사밧과 아들 웃랄
  lexicon: HALOT
  rationale: 히브리어의 반복되는 ‘그의 아들’ 구조를 한국어 족보식 표현으로 자연스럽게 옮기되, 소유 관계를 분명히 유지했습니다.
- source_word: וְ/עֵ֣זֶר וְ/אֶלְעָ֑ד
  english_pob_choice: and Ezer and Elead
  chosen_korean: 에셀과 엘르앗
