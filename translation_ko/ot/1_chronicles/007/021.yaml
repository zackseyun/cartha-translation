base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
  footnotes:
  - marker: a
    text: Or 'the native-born men of Gath.' The Hebrew literally says 'the men of Gath, the ones born in the land.'
    reason: lexical_alternative
  - marker: b
    text: The subject of 'had gone down' is contextually Ezer and Elead, the nearest plural antecedents.
    reason: cross_reference
translation:
  language: ko
  text: 사밧과 그의 아들, 웃랄과 그의 아들, 에셀과 엘르앗이 있었는데, 가드 사람들 곧 그 땅에서 태어난 사람들이 그들을 죽였습니다. 그들이 자기들의 가축을 빼앗으러 내려갔기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 땅에서 태어난 가드 사람들’입니다. 영어 POB의 취지에 따라 의미를 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘그들이’는 앞에 가장 가까이 나온 복수 인물인 에셀과 엘르앗을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/זָבָ֥ד בְּנ֛/וֹ וְ/שׁוּתֶ֥לַח בְּנ֖/וֹ
  english_pob_choice: Zabad his son ... and Shuthelah his son
  chosen_korean: 사밧과 그의 아들, 웃랄과 그의 아들
