  - 그들의 가축 떼
  lexicon: HALOT
  rationale: מִקְנֶה의 기본 의미를 반영해 ‘가축’으로 옮기고, 소유 주체를 분명히 하기 위해 재귀적 표현을 사용했습니다.
theological_decisions:
- issue: 이 절의 인과절과 사건 순서
  chosen_reading: ‘그들이 자기들의 가축을 빼앗으러 내려갔기 때문입니다’로 옮겨, 살해 사건 이전의 이동 목적을 분명히 했습니다.
  alternative_readings:
  - ‘가축을 취하러 내려갔습니다’
  - ‘가축을 빼앗으려고 내려갔기 때문입니다’
  rationale: 히브리어의 כי와 יָרְדוּ의 선후 관계를 한국어에서도 분명히 보여 주어, 원문의 사건 전개와 이유를 그대로 드러내기 위함입니다.
  doctrine_reference: 본문의 역사 서술 정확성
- issue: ‘그 땅에서 태어난 사람들’의 의미
  chosen_reading: 문자적 표현을 유지하되 ‘곧’으로 풀어, 원문의 출생지/토착민 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘토박이 가드 사람들’
  - ‘그 땅의 원주민들’
  rationale: 원문의 표현은 단순 거주민보다 출생지에 초점이 있어, 해석을 지나치게 좁히지 않으면서도 의미를 전달하는 쪽을 택했습니다.
  doctrine_reference: 본문의 어휘적 뉘앙스 보존
