  lexicon: HALOT
  rationale: 히브리어의 직역적 표현인 ‘그 땅에서 태어난’을 살리되, 한국어에서의 의미 전달을 위해 설명적 동격 ‘곧’를 넣어 자연스럽게 했습니다.
- source_word: וַ/הֲרָג֗וּ/ם
  english_pob_choice: killed them
  chosen_korean: 그들을 죽였습니다
  alternatives_korean:
