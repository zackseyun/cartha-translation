  verdict: revise
  source_fidelity: 현 초안은 족보 표기인 בְּנוֹ를 ‘그의 아들’이라는 독립된 나열 항목처럼 처리하여 원문의 계보 관계를 훼손합니다. 또한 שׁוּתֶלַח의 음역 ‘웃랄’은 원어와 맞지 않습니다. ‘곧’을 사용한 동격 처리도 ‘그 땅에서 태어난’이 가드 사람들을 수식하는 원문의 구조를 부정확하게 만듭니다. 수정문은 이들을 바로잡고, 살해 이유를 나타내는 כִּי와 ‘내려가다’ 및 ‘가축을 가져가다’를 보존합니다.
  naturalness: 수정문은 현대 표준 한국어의 정중한 문체를 유지하면서 족보식 나열을 ‘그의 아들 사밧, 그의 아들 수델라’로 자연스럽고 명료하게 제시합니다. 두 번째 문장의 대명사 지시는 본문에 남겨 두고 각주에서 문맥상 선행사를 설명합니다.
  terminology: 고유명사는 사밧, 수델라, 에셀, 엘르앗으로 음역합니다. מִקְנֶה는 포괄적인 ‘가축’으로, לקח은 ‘가져가려고’로 옮겨 ‘빼앗다’보다 원문의 기본 의미에 가깝게 유지했습니다.
