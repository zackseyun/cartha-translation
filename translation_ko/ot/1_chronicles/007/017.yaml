  lexicon: 고유명사
  rationale: 인명은 현대 한국어 음역 관례에 따라 옮겼습니다.
- source_word: בְּדָן
  english_pob_choice: Bedan
  chosen_korean: 베단
  alternatives_korean:
  - 비단
  lexicon: 고유명사
  rationale: 인명은 표준 음역으로 처리했습니다.
- source_word: אֵלֶּה
  english_pob_choice: These were
  chosen_korean: 이들은
  alternatives_korean:
  - 이들은 곧
  - 이 사람들은
  lexicon: HALOT
  rationale: 히브리어 지시어를 족보적 요약 표현으로 살려, 단순 지시가 아니라 앞선 계보를 묶어 주는 문장 기능을 드러냈습니다.
theological_decisions:
- issue: 족보 요약절의 관계 표시
  chosen_reading: ‘이들은’으로 시작해 앞의 ‘우람의 아들들’과 뒤의 ‘길르앗의 아들들’ 사이의 계보적 연결을 한 문장 안에 유지했습니다.
  alternative_readings:
  - 두 문장으로 분리
  - ‘이는’으로 직역
  rationale: 본문은 단순한 이름 나열이 아니라 계보를 되짚어 연결하는 요약이므로, 관계를 흐리지 않는 범위에서 한국어의 자연스러운 서술로 정리했습니다.
  doctrine_reference: 족보 본문 해석의 문맥 우선 원칙
