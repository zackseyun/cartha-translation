  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
  footnotes:
  - marker: a
    text: Hebrew 'These [are/were] the sons of Gilead...' The clause may function as a genealogical summary linking Ulam's line back through Gilead, Machir, and Manasseh.
    reason: lexical_alternative
translation:
  language: ko
  text: 우람의 아들들은 베단입니다. 이들은 길르앗의 아들들 — 마길의 아들, 곧 므낫세의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘이들은 …의 아들들’은 계보 요약문처럼 기능하여, 우람의 계통을 길르앗·마길·므낫세로 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 그리고 아들들은
  - 아들들
  lexicon: HALOT
  rationale: 족보 문맥의 정형 표현을 살려 ‘아들들’로 옮기되, 한국어에서는 문두의 연결을 자연스럽게 하기 위해 서술형으로 구성했습니다.
- source_word: אוּלָם
  english_pob_choice: Ulam
  chosen_korean: 우람
  alternatives_korean:
