base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
  footnotes:
  - marker: a
    text: Or 'to console him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임, 곧 그들의 아버지는 여러 날 동안 애도하였고, 그의 형제들이 그를 위로하러 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  english_pob_choice: mourned
  chosen_korean: 슬퍼하였고
  alternatives_korean:
  - 애도하였고
  - 상중에 있었고
  lexicon: HALOT
  rationale: 히트파엘 형태의 אבל은 죽음과 관련된 애도/비탄의 상태를 가리키므로, 문맥상 자연스럽고 과도하게 의식적이지 않은 ‘슬퍼하다’로 옮겼습니다.
- source_word: אֲבִיהֶם
  english_pob_choice: their father
  chosen_korean: 자기 아버지를
  alternatives_korean:
  - 그들의 아버지를
  - 그 아버지를
  lexicon: HALOT
  rationale: 3인칭 복수 접미사는 직전의 아들들을 가리키므로, 한국어에서는 소유 대명사보다 관계를 분명히 하는 ‘자기 아버지’를 택했습니다.
- source_word: יָמִים רַבִּים
  english_pob_choice: for many days
  chosen_korean: 여러 날 동안
  alternatives_korean:
  - 오랜 날 동안
  - 오랫동안
  lexicon: HALOT
  rationale: 히브리어 관용구의 지속 기간을 한국어에서 자연스럽게 풀어 주는 표현으로, ‘여러 날 동안’이 원문의 양감을 비교적 직접적으로 살립니다.
- source_word: לְנַחֲמֽוֹ
  english_pob_choice: to comfort him
  chosen_korean: 그를 위로하러
  alternatives_korean:
  - 그를 위로하려고
  - 그를 달래러
  lexicon: HALOT
  rationale: נחם의 기본 의미는 슬픔 속의 사람을 위로하는 것이므로, 목적을 드러내는 부사형으로 옮겨 문장 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 애도 동사의 정서 강도
  chosen_reading: ‘슬퍼하였고’로 번역해 애도 행위의 사실은 유지하되 한국어에서 지나치게 장례 절차적 뉘앙스를 고정하지 않았습니다.
  alternative_readings:
  - ‘애도하였고’
  - ‘통곡하였고’
  rationale: 본문은 아버지의 상실에 대한 장기간의 비탄을 말하지만, 뒤 절의 위로 방문과 연결될 수 있도록 의미를 과장하지 않는 번역이 적절합니다.
  doctrine_reference: 서사 문맥의 감정 표현
