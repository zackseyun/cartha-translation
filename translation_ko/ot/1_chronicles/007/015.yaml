source:
  edition: WLC
  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
  footnotes:
  - marker: a
    text: Or, 'and the name of the second son was Zelophehad.' The Hebrew says simply 'the second,' leaving the referent implicit.
    reason: alternative_reading
translation:
  language: ko
  text: 마길은 후빔과 수빔을 위해 아내를 맞았습니다. 그의 누이의 이름은 마아가였고, 둘째의 이름은 슬로브핫이었습니다. 그리고 슬로브핫에게는 딸들이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘째 아들의 이름은 슬로브핫이었습니다.’ 히브리어는 단지 ‘둘째’라고만 하여, 지시 대상이 생략되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  english_pob_choice: took a wife
  chosen_korean: 아내를 맞았습니다
  alternatives_korean:
  - 아내를 데려왔습니다
  - 결혼했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리되, 뒤의 לְחֻפִּים וּלְשֻׁפִּים가 ‘후빔과 수빔을 위해’라는 방향성을 가지므로, 마길 자신이 아니라 그들을 위해 혼인 중개를 한 뉘앙스를 유지했습니다.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  english_pob_choice: for Huppim and for Shuppim
  chosen_korean: 후빔과 수빔을 위해
  alternatives_korean:
  - 후빔과 수빔에게
  - 후빔과 수빔을 위하여
  lexicon: HALOT
  rationale: 반복된 לְ를 한국어에서도 목적/대상 의미로 드러내어, 이 혼인이 그 둘을 위한 것임을 보이게 했습니다.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  english_pob_choice: and the name of the second was Zelophehad
  chosen_korean: 둘째의 이름은 슬로브핫이었습니다
  alternatives_korean:
  - 둘째 아들의 이름은 슬로브핫이었습니다
  - 다른 이의 이름은 슬로브핫이었습니다
  lexicon: HALOT
  rationale: 히브리어가 פשוט하게 ‘둘째’라고만 하므로, 본문이 공급하지 않는 ‘아들’을 본문에 넣지 않고 간결한 형태를 유지했습니다. 이름은 한국어 성경에서 통용되는 음역인 슬로브핫을 사용했습니다.
theological_decisions:
- issue: ‘the second’의 생략된 지시 대상
  chosen_reading: 본문의 압축성을 살려 ‘둘째’로 두고, 지시 대상을 본문 안에서 보충하지 않았습니다.
  alternative_readings:
  - 둘째 아들
  - 다른 아들
  rationale: 이는 교리 문제라기보다 서술상의 압축입니다. 원문이 암시하는 대상을 독자가 추론할 수는 있어도, 번역문이 해석을 앞세워 명시하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3, §5
