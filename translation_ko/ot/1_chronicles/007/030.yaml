  lexicon: HALOT
  rationale: 고유명사는 음역하며, 한국어 표기에서는 ‘임나’가 영어 POB의 Imnah를 가장 자연스럽게 옮깁니다.
- source_word: יִשְׁוָה
  english_pob_choice: Ishvah
  chosen_korean: 이스와
  alternatives_korean:
  - 이슈아
  lexicon: HALOT
  rationale: 마소라 모음에 따른 직접 음역을 따랐고, 관련 전승형보다 이 절의 형태를 우선했습니다.
- source_word: יִשְׁוִי
  english_pob_choice: Ishvi
  chosen_korean: 이스위
  alternatives_korean:
  - 이스이
  - 이슈이
  lexicon: HALOT
  rationale: 히브리어 표기와 발음을 최대한 반영해 음역했습니다.
- source_word: שֶׂרַח אֲחוֹתָם
  english_pob_choice: Serah their sister
  chosen_korean: 그들의 누이 세라
  alternatives_korean:
