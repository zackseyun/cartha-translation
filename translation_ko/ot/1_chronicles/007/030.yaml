  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
  footnotes:
  - marker: a
    text: 'Hebrew name spellings vary in English tradition: ''Imnah'' may also appear as ''Jimnah,'' ''Ishvah'' as ''Ishuah,'' and ''Ishvi'' as ''Ishui.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀의 아들들은 임나, 이스와, 이스위, 브리아, 그리고 그들의 누이 세라였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 표기는 전승에 따라 달리 나타납니다. ‘임나’는 ‘짐나’로, ‘이스와’는 ‘이슈아’로, ‘이스위’는 ‘이슈이’로도 나타날 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 직계 자녀 목록을 이끌므로, 기본값인 ‘아들들’이 가장 직접적입니다.
- source_word: יִמְנָה
