  text: בְּנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֥רַח אֲחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
  footnotes:
  - marker: a
    text: 'Hebrew name spellings vary in English tradition: ''Imnah'' may also appear as ''Jimnah,'' ''Ishvah'' as ''Ishuah,'' and ''Ishvi'' as ''Ishui.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀의 아들들은 임나, 이스와, 이스위, 브리아, 그리고 그들의 누이 세라였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 전승에서 히브리어 이름의 철자는 다르게 표기되기도 합니다. ‘임나’는 ‘짐나’로, ‘이스와’는 ‘이슈아’로, ‘이스위’는 ‘이슈이’로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 직계 자녀 목록을 이끌므로, 기본값인 ‘아들들’이 가장 직접적입니다.
- source_word: יִמְנָה
  english_pob_choice: Imnah
  chosen_korean: 임나
  alternatives_korean:
  - 짐나
  lexicon: HALOT
  rationale: 고유명사는 음역하며, 한국어 표기에서는 ‘임나’가 영어 POB의 Imnah를 가장 자연스럽게 옮깁니다.
- source_word: יִשְׁוָה
  english_pob_choice: Ishvah
  chosen_korean: 이스와
  alternatives_korean:
  - 이슈아
  lexicon: HALOT
  rationale: 마소라 모음에 따른 직접 음역을 따랐고, 관련 전승형보다 이 절의 형태를 우선했습니다.
- source_word: יִשְׁוִי
  english_pob_choice: Ishvi
  chosen_korean: 이스위
  alternatives_korean:
  - 이스이
  - 이슈이
  lexicon: HALOT
  rationale: 히브리어 표기와 발음을 최대한 반영해 음역했습니다.
- source_word: שֶׂרַח אֲחוֹתָם
  english_pob_choice: Serah their sister
  chosen_korean: 그들의 누이 세라
  alternatives_korean:
  - 그들의 자매 세라
  - 누이 세라
  lexicon: HALOT
  rationale: אֲחוֹתָם의 3인칭 복수 접미사를 살려 ‘그들의 누이’로 옮겼고, 여성 명칭은 세라로 음역했습니다.
