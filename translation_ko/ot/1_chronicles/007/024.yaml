base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
  footnotes:
  - marker: a
    text: Or possibly 'and his daughter, Sheerah'; the Hebrew conjunction can be carried over more literally, but English genealogy style often smooths it to 'His daughter was Sheerah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'and the upper'; 'Beth-horon' is understood from the previous phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 딸 세에라가 아래 벧호론과 위 벧호론, 그리고 웃센-세에라를 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그의 딸, 세에라’로도 옮길 수 있습니다. 히브리어 접속사는 더 직역될 수 있지만, 계보문에서는 소유 관계를 자연스럽게 풀어 쓰는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 ‘벧호론’이 반복되지 않고 ‘위쪽’만 적혀 있지만, 앞 구절과의 평행으로 벧호론이 생략된 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  english_pob_choice: His daughter was Sheerah
  chosen_korean: 그의 딸은 세에라였으며
  alternatives_korean:
  - 그리고 그의 딸은 세에라였습니다
  - 그의 딸은 세에라였습니다
  lexicon: HALOT
  rationale: 계보 문맥의 소유·동격 구조를 살려 ‘그의 딸은 …였으며’로 옮기고, 인명은 음역하되 한국어 표기에서는 세에라로 적었습니다.
- source_word: וַתִּבֶן
  english_pob_choice: she built
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 지었습니다
  - 건축하였습니다
  lexicon: HALOT
  rationale: 도시·지명에 대한 בנה는 단순한 건축보다 ‘세우다’가 더 자연스럽고, 본문의 행위가 두 성읍과 한 지명 설립에 걸친 것으로 읽히도록 했습니다.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן / הָעֶלְיוֹן
  english_pob_choice: Lower Beth-horon / Upper Beth-horon
  chosen_korean: 아래 벧호론과 위 벧호론
  alternatives_korean:
  - 하부 벧호론과 상부 벧호론
  - 아래 벧호론과 위의 벧호론
  lexicon: HALOT
  rationale: 지명 בית חורון은 통용되는 음역을 따르고, 수식어 הַתַּחְתּוֹן / הָעֶלְיוֹן은 한국어에서 ‘아래/위’로 자연스럽게 옮겼습니다.
- source_word: אֻזֵּן שֶׁאֱרָה
  english_pob_choice: Uzzen-sheerah
  chosen_korean: 웃센-세에라
  alternatives_korean:
  - 우젠-세에라
  - 웃젠-세에라
  lexicon: HALOT
  rationale: 하이픈이 있는 단일 지명으로 처리해 두 요소를 분리하지 않되, 한국어 음역은 표준 외래어식에 가깝게 구성했습니다.
