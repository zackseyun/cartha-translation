  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'she named him Peresh.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew genealogies often use 'sons' in a specifically male sense; here the term is retained rather than generalized to 'children.'
    reason: cultural_note
translation:
  language: ko
  text: 마아가가 아들[a]을 낳았습니다. 그리고 그의 이름을 페레시라 불렀고, 그의 형제의 이름은 세레스였으며, 그의 아들들은 울람과 라겜이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그가 페레시라고 이름 지었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 해산했습니다
  - 아들을 두었습니다
  lexicon: WLC/HALOT
  rationale: 족보 문맥에서 ילד의 완료적 서술은 한국어로 ‘낳았습니다’가 가장 자연스럽고, 영어 POB의 간결한 genealogical register도 잘 반영합니다.
- source_word: אֵשֶׁת מָכִיר
  english_pob_choice: the wife of Machir
  chosen_korean: 마아가가
  alternatives_korean:
  - 마아가, 마길의 아내가
  - 마아가, 마길의 아내
  lexicon: WLC/HALOT
  rationale: 본문의 주어는 마아가이며, 이어지는 관계표현은 한국어에서 본문 흐름상 중복을 피하고 자연스럽게 처리하는 것이 적절합니다.
- source_word: וַתִּקְרָא שְׁמוֹ
  english_pob_choice: she called his name
  chosen_korean: 그의 이름을 페레시라 불렀고
  alternatives_korean:
  - 그의 이름을 페레시라 지었고
  - 그를 페레시라 불렀고
  lexicon: WLC/HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서는 ‘이름을 …라 불렀다’가 가장 근접하고 자연스럽습니다. ‘그를 …라 불렀다’는 한국어 관용상 다소 어색합니다.
- source_word: שְׁמ/וֹ
  english_pob_choice: his name
  chosen_korean: 그의 이름
  alternatives_korean:
  - 이름을
  - 그 이름
  lexicon: WLC/HALOT
  rationale: 관계절 앞의 대명사 연결을 한국어로 명시해 족보 구문을 분명하게 유지했습니다.
- source_word: שָׁרֶשׁ / אוּלָם / וָרָקֶם
  english_pob_choice: Sheresh / Ulam / Rakem
  chosen_korean: 세레스 / 울람 / 라겜
  alternatives_korean:
  - 셔레시 / 울람 / 라켐
  - 쉐레시 / 울람 / 라켐
  lexicon: WLC/HALOT
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역하되, 한국어 성경에서 통용 가능성이 높은 형태를 우선했습니다.
theological_decisions:
- issue: וּבָנָיו의 수사적 범위
  chosen_reading: ‘그의 아들들’로 번역해 남성 후손을 분명히 했습니다.
  alternative_readings:
  - 그의 자녀들
  - 그의 후손들
  rationale: 족보에서 בנים은 통상 남성 자손을 가리키므로, 성별을 중화하지 않고 본문의 계보적 정확성을 유지했습니다.
  doctrine_reference: 족보 표현의 원어 의미 보존
