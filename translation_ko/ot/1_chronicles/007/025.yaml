  text: וְ/רֶ֣פַח בְּנ֗/וֹ וְ/רֶ֧שֶׁף וְ/תֶ֛לַח בְּנ֖/וֹ וְ/תַ֥חַן בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/025.yaml
  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
  footnotes:
  - marker: a
    text: 'Hebrew genealogies often omit an explicit verb; the sequence is a list of descendants: ''Rephah his son, Resheph, Telah his son, Tahan his son.'''
    reason: cultural_note
translation:
  language: ko
  text: 그의 아들은 레파, 르셰프, 그의 아들은 들라, 그의 아들은 다한이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ / בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아들
  - 그 아들
  lexicon: WLC; English POB audit trail
  rationale: 족보 문맥에서 생략된 서술어를 보충해 관계를 분명히 하되, 영어 POB의 반복된 친족 공식을 따라 ‘그의 아들’로 옮겼습니다.
- source_word: רֶפַח
  english_pob_choice: Rephah
  chosen_korean: 레파
  alternatives_korean:
  - 레퍄
  - 르파흐
  lexicon: HALOT
  rationale: 인명은 번역하지 않고 음역하되, 한국어 표기법에 따라 읽기 쉬운 형태로 옮겼습니다.
- source_word: רֶשֶׁף
  english_pob_choice: Resheph
  chosen_korean: 르셰프
  alternatives_korean:
  - 레셰프
  - 레쉐프
  lexicon: HALOT
  rationale: 족보에 나온 고유명사로 보고 음역했습니다. 일반명사적 의미 가능성보다 문맥상 인명으로 읽는 해석을 따랐습니다.
- source_word: תֶלַח
  english_pob_choice: Telah
  chosen_korean: 들라
  alternatives_korean:
  - 텔라
  - 텔라흐
  lexicon: HALOT
  rationale: 인명으로 기능하므로 음역했습니다. 영어 POB의 읽기 쉬운 형태를 한국어 표기로 반영했습니다.
- source_word: תַחַן
  english_pob_choice: Tahan
  chosen_korean: 다한
  alternatives_korean:
  - 타한
  - 타하ן
  lexicon: HALOT
  rationale: 족보 항목의 고유명사이므로 음역했습니다. 한국어 음운 체계에 맞춰 표기했습니다.
theological_decisions:
- issue: 족보식 나열에서 동사의 생략을 어떻게 드러낼지
  chosen_reading: 별도의 동사를 과도하게 보태지 않고, ‘그의 아들 …’이라는 반복 구조로 족보의 나열감을 유지했습니다.
  alternative_readings:
  - 그의 아들이 레파였고…
  - 레파, 레셰프, 들라, 다한
  rationale: 히브리어 원문은 명시적 서술동사 없이 계보 항목을 연속적으로 제시합니다. 한국어에서도 이 구조를 살려 원문의 압축성을 유지했습니다.
  doctrine_reference: 성경 번역의 형식 충실성과 계보 문체 보존
