  text: בְּנֵ֖י צוֹפָ֑ח ס֧וּחַ וְ/חַרְנֶ֛פֶר וְ/שׁוּעָ֖ל וּ/בֵרִ֥י וְ/יִמְרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
  footnotes:
  - marker: a
    text: Or “descendants of Zophah.” In genealogical lists, Hebrew בְּנֵי can sometimes denote broader lineage, though “sons of” is the more direct rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 코파의 아들들은 수아, 하르네페르, 슈알, 베리, 이므라입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보 문맥에서는 בְּנֵי가 ‘아들들’보다 넓게 ‘후손들’로 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 아들일 수도 있고 넓게는 혈통 구성원을 가리킬 수도 있지만, 기본값은 POB의 ‘The sons of’에 맞춰 직접적인 관계를 살리는 것입니다.
- source_word: צוֹפָח
  english_pob_choice: Zophah
  chosen_korean: 코파
  alternatives_korean:
  - 조파
  - 소파
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 성서 관용과 발음 가능성을 고려해 ‘코파’로 옮겼습니다.
- source_word: סוּחַ
  english_pob_choice: Suah
  chosen_korean: 수아
  alternatives_korean:
  - 수하
  lexicon: HALOT
  rationale: 히브리어 이름을 현대 한국어 표기 관행에 맞게 음역했습니다.
- source_word: חַרְנֶפֶר
  english_pob_choice: Harnepher
  chosen_korean: 하르네페르
  alternatives_korean:
  - 하르네퍼
  lexicon: HALOT
  rationale: 히브리어 자음을 따라 고유명사를 음역했습니다.
- source_word: שׁוּעָל
  english_pob_choice: Shual
  chosen_korean: 슈알
  alternatives_korean:
  - 수알
  lexicon: HALOT
  rationale: 족보의 인명으로 기능하므로 일반명사 의미를 두지 않고 음역했습니다.
- source_word: בֵרִי
  english_pob_choice: Beri
  chosen_korean: 베리
  alternatives_korean:
  - 베에리
  lexicon: HALOT
  rationale: MT의 철자에 맞춰 간결하게 음역했습니다.
- source_word: יִמְרָה
  english_pob_choice: Imrah
  chosen_korean: 이므라
  alternatives_korean:
  - 임라
  lexicon: HALOT
  rationale: 고유명사를 현대 한국어로 음역했으며, 영어 POB의 Imrah에 대응하도록 했습니다.
theological_decisions:
- issue: 족보 문맥의 בְּנֵי 범위
  chosen_reading: ‘아들들’로 직역하되, 이 절 자체에서는 범위를 넓혀 해석하지 않았습니다.
  alternative_readings:
  - ‘후손들’로 확장해 번역
  rationale: 영어 POB도 각주로 ‘descendants’ 가능성을 열어 두지만, 본문은 가장 직접적인 혈연 표현을 유지하는 편이 원문과 족보 형식에 더 충실합니다.
  doctrine_reference: 족보 용례의 문맥 우선 원칙
