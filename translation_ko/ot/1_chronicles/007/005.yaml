  text: וַ/אֲחֵי/הֶ֗ם לְ/כֹל֙ מִשְׁפְּח֣וֹת יִשָׂשכָ֔ר גִּבּוֹרֵ֖י חֲיָלִ֑ים שְׁמוֹנִ֤ים וְ/שִׁבְעָה֙ אֶ֔לֶף הִתְיַחְשָׂ֖/ם לַ/כֹּֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
  footnotes:
  - marker: a
    text: Or 'their kinsmen' or 'their relatives'; Hebrew 'brothers' can extend beyond immediate siblings in clan and genealogical contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'were registered by genealogy.' The Hebrew verb refers to being entered in genealogical records.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 형제들[a]은 잇사갈의 모든 가문에 속한 용맹한 용사들이었는데, 족보에 등록된 이들은 모두 팔만 칠천 명이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 여기서 직계 형제뿐 아니라 씨족·친족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘족보에 등록된’은 히브리어 동사가 족보 명부에 등재되거나 계보에 따라 등록되는 것을 뜻함을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제들은
