  lexicon: HALOT
  rationale: 관용구의 전투적·강인한 뉘앙스를 살려 ‘용맹한 용사들’로 옮겼고, 서술 흐름에 맞게 종결은 합쇼체로 처리했습니다.
- source_word: הִתְיַחְשָׂם
  english_pob_choice: enrolled by genealogy
  chosen_korean: 족보에 등록되었습니다
  alternatives_korean:
