  rationale: מִשְׁפָּחָה는 단순 가족보다 씨족·가문에 가깝기 때문에 ‘가문’으로 옮겨 족보 맥락을 유지했습니다.
- source_word: גִּבּוֹרֵי חֲיָלִים
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 용사들이었으니
