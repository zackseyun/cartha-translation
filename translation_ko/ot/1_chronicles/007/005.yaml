  text: וַ/אֲחֵי/הֶ֗ם לְ/כֹל֙ מִשְׁפְּח֣וֹת יִשָׂשכָ֔ר גִּבּוֹרֵ֖י חֲיָלִ֑ים שְׁמוֹנִ֤ים וְ/שִׁבְעָה֙ אֶ֔לֶף הִתְיַחְשָׂ֖/ם לַ/כֹּֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
  footnotes:
  - marker: a
    text: Or 'their kinsmen' or 'their relatives'; Hebrew 'brothers' can extend beyond immediate siblings in clan and genealogical contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'were registered by genealogy.' The Hebrew verb refers to being entered in genealogical records.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 형제들은 잇사갈의 모든 가문에 따라 용맹한 용사들이었으니, 모두 팔만칠천 명이었으며 족보에 등록되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 여기서 직계 형제뿐 아니라 씨족·친족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘등록되었습니다’는 히브리어 동사가 족보 명부에 들어간다는 뜻을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제들은
  alternatives_korean:
  - 그들의 친족들은
  - 그들의 친척들은
  lexicon: HALOT
  rationale: אָח는 직계 형제뿐 아니라 족보·씨족 문맥에서 친족 집단을 가리킬 수 있으므로, 직역을 살리되 한국어에서는 자연스러운 복수 주어로 옮겼습니다.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  english_pob_choice: throughout all the families of Issachar
  chosen_korean: 잇사갈의 모든 가문에 따라
  alternatives_korean:
  - 잇사갈의 모든 가족들 가운데
  - 잇사갈의 모든 씨족에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 단순 가족보다 씨족·가문에 가깝기 때문에 ‘가문’으로 옮겨 족보 맥락을 유지했습니다.
- source_word: גִּבּוֹרֵי חֲיָלִים
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 용사들이었으니
  alternatives_korean:
  - 용맹한 전사들이었으니
  - 힘센 용사들이었으니
  - 강한 전사들이었습니다
  lexicon: HALOT
  rationale: 관용구의 전투적·강인한 뉘앙스를 살려 ‘용맹한 용사들’로 옮겼고, 서술 흐름에 맞게 종결은 합쇼체로 처리했습니다.
- source_word: הִתְיַחְשָׂם
  english_pob_choice: enrolled by genealogy
  chosen_korean: 족보에 등록되었습니다
  alternatives_korean:
  - 족보에 올라 있었습니다
  - 계보에 등록되었습니다
  - 족보에 기록되었습니다
  lexicon: HALOT
  rationale: 히트파엘의 족보 등재 의미를 분명히 하기 위해 ‘등록되었습니다’로 옮겼으며, ‘족보’가 한국어 성경 독자에게 가장 직접적인 대응어입니다.
theological_decisions:
- issue: 계보·인구 집계의 문체
  chosen_reading: 숫자와 족보 등록을 행정적 사실로 평이하게 진술했습니다.
  alternative_readings:
  - ‘계수되었습니다’로 옮길 수 있음
  - ‘족보에 기록되었습니다’로 더 완곡하게 옮길 수 있음
  rationale: 이 절은 신학적 해석보다 역사·계보적 기록이 핵심이므로, 의미를 과장하지 않고 원문의 등록·집계 성격을 유지했습니다.
  doctrine_reference: 역대기 족보 기록의 역사성/계보성
