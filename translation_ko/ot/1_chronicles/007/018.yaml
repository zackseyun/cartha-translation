translation:
  language: ko
  text: 그의 누이 함몰레겟은 이스호드와 아비에셀과 마할라를 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  english_pob_choice: His sister
  chosen_korean: 그의 누이
  alternatives_korean:
  - 그의 자매
  - 그리고 그의 누이
  lexicon: HALOT
  rationale: 계보 문맥에서 소유 접미사의 인칭을 그대로 살려 관계를 분명히 하고, 한국어에서는 굳이 접속사까지 드러내지 않아도 자연스럽습니다.
- source_word: הַמֹּלֶכֶת
  english_pob_choice: Hammoleketh
  chosen_korean: 함몰레겟
  alternatives_korean:
  - 함몰레케트
  - 몰레겟
  - 여왕
  lexicon: HALOT
  rationale: 문맥상 직함이 아니라 인명으로 처리해야 하므로 음역을 택했습니다. 영어 POB의 주석대로 어원상 ‘여왕/다스리는 이’와 연결되지만, 본문에서는 고유명사로 보는 것이 가장 타당합니다.
- source_word: יָלְדָה
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 낳아주었습니다
  lexicon: HALOT
  rationale: 계보에서 여성 주어의 ילד는 한국어 성경체에서 자연스럽게 ‘낳다’로 옮기는 것이 직접적이며, 생물학적 모성을 분명히 보여 줍니다.
- source_word: אִישְׁהוֹד
  english_pob_choice: Ishhod
  chosen_korean: 이스호드
  alternatives_korean:
  - 이쉬호드
  - 이시호드
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 감각에 맞게 음역했고, 한국어에서 읽기 쉬운 형태로 정리했습니다.
theological_decisions:
- issue: 계보 목록의 문체
  chosen_reading: 서술을 평이하게 옮기되, 계보 본문의 사실 진술성을 유지했습니다.
  alternative_readings:
  - 더 장중한 문어체로 옮김
  - 친근한 구어체로 완화함
  rationale: 본절은 신학적 해석보다 족보 기록의 전달이 핵심이므로, 수식 없이 간결한 사실 서술을 유지하는 것이 원문 의도에 부합합니다.
  doctrine_reference: 성경 본문의 역사·계보 기록성
