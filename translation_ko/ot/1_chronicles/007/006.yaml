theological_decisions:
- issue: 족보식 생략문을 한국어에서 어떻게 보완할지
  chosen_reading: ‘베냐민의 아들들은 …입니다’로 관계를 드러내되, 원문의 간결한 족보 형식을 유지했습니다.
  alternative_readings:
  - '‘베냐민: 벨라, 베커, 여디아엘—세 사람입니다.’'
  - ‘베냐민에게는 벨라, 베커, 여디아엘이 세 명 있었습니다.’
  rationale: 히브리어는 서술어가 생략된 족보식 문장입니다. 한국어에서는 독자가 즉시 이해할 수 있도록 ‘아들들’ 관계를 풀어 주되, 과도한 서술 추가는 피했습니다.
