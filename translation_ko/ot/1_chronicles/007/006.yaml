base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/006.yaml
  text: 'The sons of Benjamin: Bela[a], Beker, and Jediael—three.'
  footnotes:
  - marker: a
    text: Traditional English versions often spell the second name 'Becher'; the Hebrew form here may be represented more directly as 'Beker.'
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민의 아들들은 벨라, 베커, 그리고 여디아엘—세 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘베커’는 전통적 영어형 ‘Becher’보다 히브리어 철자에 더 직접적인 음역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִן
  english_pob_choice: Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 벤야민
  lexicon: 고유명사 표기
  rationale: 지파 이름과 인명으로서 표준적인 성서 한국어 표기를 따랐습니다. 영어 POB가 의미상 ‘Benjamin의 아들들’을 보완한 점을 반영해, 한국어에서도 소유 관계를 분명히 했습니다.
- source_word: בֶּלַע
  english_pob_choice: Bela
  chosen_korean: 벨라
  alternatives_korean:
  - 베라
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다.
- source_word: בֶּכֶר
  english_pob_choice: Beker
  chosen_korean: 베커
  alternatives_korean:
  - 베헤르
  - 벡헬
  - 베셰르
  lexicon: 고유명사 표기
  rationale: 영어 POB가 주석으로 밝힌 대로 히브리어 철자에 더 직접적인 형태를 반영해 ‘베커’로 옮겼습니다. 전통적 영어형 ‘Becher’를 그대로 따르지 않았습니다.
- source_word: שְׁלֹשָׁה
  english_pob_choice: three
  chosen_korean: 세 사람
  alternatives_korean:
  - 셋
  - 세 명
  lexicon: HALOT
  rationale: 마지막의 수사는 앞의 세 이름을 합산하는 요약이므로, 한국어에서는 사람 수를 분명히 하는 ‘세 사람’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 족보식 생략문을 한국어에서 어떻게 보완할지
  chosen_reading: ‘베냐민의 아들들은 …입니다’로 관계를 드러내되, 원문의 간결한 족보 형식을 유지했습니다.
  alternative_readings:
  - '‘베냐민: 벨라, 베커, 여디아엘—세 사람입니다.’'
  - ‘베냐민에게는 벨라, 베커, 여디아엘이 세 명 있었습니다.’
  rationale: 히브리어는 서술어가 생략된 족보식 문장입니다. 한국어에서는 독자가 즉시 이해할 수 있도록 ‘아들들’ 관계를 풀어 주되, 과도한 서술 추가는 피했습니다.
  doctrine_reference: 본문 장르 보존과 문맥 명료화
