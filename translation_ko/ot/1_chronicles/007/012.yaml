  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons of Aher.'' The text is syntactically difficult: the plural ''sons'' stands with the singular name Hushim. Some take ''Aher'' as a proper name; others understand it as ''another.'''
    reason: lexical_alternative
  - marker: b
    text: Some English traditions render the names as 'Shephupham' and 'Hupham' in light of related genealogical parallels.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 숩빔과 훕빔은 이르의 아들들이었고, 후심은 아헬의 자손들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아헬의 아들들’입니다. 문장 구조가 난해합니다. ‘후심’은 한 사람의 이름으로 볼 수도, 집단 이름으로 볼 수도 있으며, ‘아헬’은 고유명사로 볼 수도 있고 ‘다른 이’라는 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  english_pob_choice: And Shuppim
  chosen_korean: 시룹빔
  alternatives_korean:
  - 셰푸밤
  - 슈빔
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 관련 족보 평행본문의 이형 표기를 고려하면서도 본문 철자에 맞는 음을 우선 반영했습니다.
- source_word: וְ/חֻפִּם
  english_pob_choice: and Huppim
  chosen_korean: 후빔
  alternatives_korean:
  - 후밤
  - 후핌
  lexicon: HALOT
  rationale: 고유명사이므로 번역하지 않고 음역했습니다. 앞 이름과 병렬을 이루는 족보 항목의 형식을 살렸습니다.
- source_word: בְּנֵי עִיר
  english_pob_choice: were the sons of Ir
  chosen_korean: 이르의 아들들이었고
  alternatives_korean:
  - 이르의 자손들이었고
  - 이르에게 속한 아들이었고
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 기본적으로 ‘아들들’로 옮기는 것이 가장 직접적이어서, 한국어에서는 자연스러운 서술형으로 처리했습니다.
- source_word: בְּנֵי אַחֵר
  english_pob_choice: was the son of Aher
  chosen_korean: 아헤르의 아들이었습니다
  alternatives_korean:
  - 아헤르의 아들들이었습니다
  - 다른 사람의 아들이었습니다
  lexicon: HALOT
  rationale: 히브리어는 형태상 복수지만, 영어 POB가 지적한 대로 족보상 단수 지시로 읽히는 압축 표현이므로 한국어도 단수 서술로 맞췄습니다. אַחֵר는 고유명사로 처리했습니다.
theological_decisions:
- issue: 족보의 압축된 문법과 단수/복수 불일치
  chosen_reading: ‘후심은 아헤르의 아들이었습니다’로 읽어, 형태상의 복수 표현보다 족보가 의도하는 단수 계열관계를 드러냈습니다.
  alternative_readings:
  - ‘후심은 아헤르의 아들들이었습니다’
  - ‘후심은 다른 사람의 아들이었습니다’
  rationale: 본문은 문법적으로 난해하지만, 계보 목록의 관용적 압축과 이름 표기를 우선하여 독자가 관계를 오해하지 않도록 했습니다.
  doctrine_reference: 본문비평/주해적 결정
