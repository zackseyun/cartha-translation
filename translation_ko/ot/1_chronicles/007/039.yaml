base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/039.yaml
  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
  footnotes:
  - marker: a
    text: Or 'And the sons of Ulla.' The Hebrew begins with a conjunction, but English genealogical style often omits it.
    reason: lexical_alternative
  - marker: b
    text: Ulla may also be spelled 'Ula' in English transliteration.
    reason: lexical_alternative
  - marker: c
