    reason: lexical_alternative
translation:
  language: ko
  text: 울라의 아들들은 아라, 한니엘, 리시아입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들은
  alternatives_korean:
  - 그리고 ~의 아들들은
  - ~의 자손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי를 ‘아들들’로 옮기는 것이 가장 직접적이며, 영어 POB처럼 접속사 וּ를 별도로 살리지 않아도 의미가 자연스럽게 전달됩니다.
- source_word: עֻלָּא
  english_pob_choice: Ulla
  chosen_korean: 울라
  alternatives_korean:
  - 우라
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리했습니다. 한국어에서는 ‘울라’가 영어 POB의 표기와도 가장 가깝고, 히브리어 자음 배열을 무리 없이 반영합니다.
- source_word: חַנִּיאֵל
  english_pob_choice: Hanniel
  chosen_korean: 하니엘
  alternatives_korean:
  - 한니엘
  lexicon: HALOT
  rationale: 영어 POB의 Hanniel을 따르되, 한국어 음역에서는 장음과 이중 자음의 표기를 과도하게 살리지 않고 발음상 자연스러운 ‘하니엘’로 옮겼습니다.
- source_word: רִצְיָא
  english_pob_choice: Rizia
  chosen_korean: 리지아
  alternatives_korean:
  - 리지야
  - 리시아
  lexicon: HALOT
  rationale: 히브리어 자음과 모음을 반영한 음역입니다. 영어 POB의 Rizia를 한국어로 옮길 때 끝의 -ia를 ‘-지아’로 처리하는 것이 자연스럽습니다.
