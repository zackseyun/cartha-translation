base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
  footnotes:
  - marker: a
    text: Or 'women' instead of 'wives'; the Hebrew נָשִׁים can bear either sense, but 'wives' best fits the genealogical and household context here.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase 'troops for the army of war' is a compressed military expression, also renderable as 'military divisions for battle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 함께, 그들의 세대별로 조상들의 집안에 따라 전투 부대의 병력[b]은 3만 6천 명이었습니다. 이는 그들이 아내들[a]과 아들들을 많이 두었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָשִׁים은 문맥에 따라 ‘아내들’ 또는 ‘여자들’을 뜻할 수 있습니다. 여기서는 족보와 가정의 문맥상 ‘아내들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 직역하면 ‘전쟁을 위한 군대의 부대들’에 가까운 압축된 군사 표현입니다. ‘전투 부대들’ 또는 ‘전쟁을 위한 군사 부대들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  english_pob_choice: And with them
  chosen_korean: 그들과 함께
  alternatives_korean:
  - 그들 위에
  - 그들 곁에
  lexicon: HALOT
  rationale: 문맥상 소유·동반 관계를 나타내는 표현이므로, 공간적 의미의 ‘위에’보다 ‘함께’가 계수 목록의 문맥에 자연스럽고 원문 의도를 잘 살립니다.
- source_word: לְתֹלְדוֹתָם
  english_pob_choice: by their generations
  chosen_korean: 그들의 نسل대로
  alternatives_korean:
  - 그들의 세대에 따라
  - 그들의 족보대로
  lexicon: HALOT
  rationale: תולדות는 혈통·계보적 분류를 가리킬 수 있으므로, 여기서는 씨족/가계 단위를 드러내는 방향으로 옮겼습니다. 다만 한국어 표기 오류 방지를 위해 최종 출력은 “그들의 세대대로”가 아니라 “그들의 세대대로”로 사용합니다.
- source_word: לְבֵית אֲבוֹתָם
  english_pob_choice: according to their fathers' houses
  chosen_korean: 그들의 조상 집안에 따라
  alternatives_korean:
  - 그들의 아버지의 집에 따라
  - 그들의 가문에 따라
  lexicon: HALOT
  rationale: 히브리어의 표준적 친족·씨족 표현을 직역에 가깝게 옮기되, 현대 한국어에서 이해 가능한 ‘집안’으로 풀어 혈연 기반 단위를 보존했습니다.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  english_pob_choice: troops for the army of war
  chosen_korean: 전쟁용 군대
  alternatives_korean:
  - 전투를 위한 군대
  - 전쟁의 군대
  - 전투 부대
  lexicon: HALOT
  rationale: 원문은 ‘부대/무리’와 ‘군대/전군’, ‘전쟁’이 겹친 압축 군사 표현입니다. 한국어에서는 과도한 중첩을 줄이되 군사적 힘을 살려 ‘전쟁용 군대’로 옮겼습니다.
- source_word: הִרְבּוּ נָשִׁים וּבָנִים
  english_pob_choice: for they had many wives and sons
  chosen_korean: 그들이 아내와 아들을 많이 두었기 때문입니다
  alternatives_korean:
  - 그들에게 아내와 아들이 많았기 때문입니다
  - 그들이 많은 아내와 아들을 두었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘많게 하다’는 관용적으로 ‘많이 두다/많다’로 자연스럽게 옮길 수 있습니다. נָשִׁים은 여기에서 가정·후손 설명에 가장 잘 맞는 ‘아내’로 렌더링했습니다.
theological_decisions:
- issue: 가계와 군사력의 연결
  chosen_reading: 군사 인원의 규모를 가계·조상 집안·자녀 수와 연결한 족보적 설명으로 읽었습니다.
  alternative_readings:
  - 단순한 인구 통계 설명으로만 읽기
  - 전쟁 동원의 역사 기록으로만 읽기
  rationale: 문장은 군사 숫자를 족보 항목 속에 삽입해 그 수가 대가족 구조와 연결됨을 설명하므로, 혈연·가문 배경을 드러내는 번역이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 역사서의 족보-공동체 기억 기능
