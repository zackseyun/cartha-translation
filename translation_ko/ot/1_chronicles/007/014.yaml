id: 1CH.7.14
reference: 1 Chronicles 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
  footnotes:
  - marker: a
    text: Or, 'The descendants of Manasseh.' In genealogies, 'sons' can sometimes function more broadly for descendants.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Aramean woman'; traditionally 'the Syrian.'
    reason: lexical_alternative
  - marker: c
    text: '''Father of Gilead'' may also carry the sense ''ancestor'' or ''founder'' in genealogical usage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세의 아들들은 아스리엘입니다[a]. 그의 아람 사람 첩이 그를 낳았고[b], 그녀가 길르앗의 아버지 마길을 낳았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보에서는 ‘아들들’이 ‘자손들’을 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아람 사람’입니다. 전통 번역에서는 ‘시리아 사람’으로도 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘길르앗의 아버지’는 족보 용례에서 ‘조상’ 또는 ‘시조’의 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  english_pob_choice: The sons of Manasseh
  chosen_korean: 므낫세의 아들들은
  alternatives_korean:
  - 므낫세의 자손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 아들뿐 아니라 후손 전체를 가리킬 수 있으나, 형식을 살린 직역형을 기본으로 두고 주석으로 확장 가능성을 남겼습니다.
- source_word: פִּילַגְשׁוֹ
  english_pob_choice: his concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후처
  lexicon: HALOT
  rationale: פִּילֶגֶשׁ는 ‘첩’이 가장 직접적이고 정확한 대응어이며, 완곡한 ‘후처’는 원문의 법적·사회적 뉘앙스를 약화시킬 수 있습니다.
- source_word: הָאֲרַמִּיָּה
  english_pob_choice: Aramean
  chosen_korean: 아람 사람
  alternatives_korean:
  - 아람인
  - 시리아 사람
  lexicon: HALOT
  rationale: 지명·민족 형용사를 한국어에서는 자연스럽게 ‘아람 사람’으로 풀어, 전통적이지만 시대착오적일 수 있는 ‘시리아 사람’을 피했습니다.
- source_word: יָלְדָה אֶת מָכִיר
  english_pob_choice: she bore Machir
  chosen_korean: 그녀가 길르앗의 아버지 마길을 낳았습니다
  alternatives_korean:
  - 그녀가 마길을 낳았습니다
  - 마길을 낳았습니다
  lexicon: HALOT
  rationale: 히브리어의 두 번째 출산 진술을 살려 ‘낳았습니다’를 반복했고, אַבִי גִלְעָד는 족보 관용에 따라 ‘길르앗의 아버지’로 옮겼습니다.
theological_decisions:
- issue: 아비(אָב)의 족보적 의미
  chosen_reading: ‘길르앗의 아버지 마길’로 직역하되, 혈통상의 아버지뿐 아니라 족보상의 조상/시조라는 가능성을 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - ‘길르앗의 조상 마길’
  - ‘길르앗의 시조 마길’
  rationale: 문맥상 족보 표지어로서의 אָב는 즉각적인 친부를 가리킬 수도 있지만, 계보적 수장/기원을 뜻할 수도 있어, 본문에는 가장 형식에 충실한 표현을 두는 것이 안전합니다.
  doctrine_reference: 족보 표현의 관용적 용법
- issue: 아람 민족 표지
  chosen_reading: ‘아람 사람’으로 옮겨 민족·출신 배경을 분명히 했습니다.
  alternative_readings:
  - ‘시리아 사람’
  rationale: ‘시리아’는 이후의 지리·정치적 명칭을 불러와 원문 시대의 민족 표지를 흐릴 수 있으므로, 원어의 아람 정체성을 직접 반영했습니다.
  doctrine_reference: 역사-지리적 정확성
