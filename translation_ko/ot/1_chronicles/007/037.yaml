base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/037.yaml
  text: Bezer[a], Hod, Shamma, Shilshah, Ithran[c][b], and Beera.
  footnotes:
  - marker: a
    text: Hebrew spelling here supports the name form 'Shamma'; some English versions use 'Shammah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Jethran' for Ithran, reflecting a more traditional English anglicization of the Hebrew name.
    reason: lexical_alternative
  - marker: c
    text: Or 'Be'era,' a more explicit transliteration of the Hebrew aleph in the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 베셀, 홋, 삼마, 실사, 이드란, 브에라입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  english_pob_choice: Bezer
  chosen_korean: 베셀
  alternatives_korean:
  - 베저
  - 베저르
  lexicon: HALOT
  rationale: 족보에 나오는 고유명사이므로 음역하되, 한국어 표기는 외래어 표기법에 따라 자음값을 자연스럽게 반영했습니다.
- source_word: הוֹד
  english_pob_choice: Hod
  chosen_korean: 호드
  alternatives_korean:
  - 호ד
  lexicon: HALOT
  rationale: 이 단어는 여기서 ‘위엄’ 같은 일반명사보다 인명으로 기능하므로 음역을 택했습니다.
- source_word: שַׁמָּא
  english_pob_choice: Shamma
  chosen_korean: 삼마
  alternatives_korean:
  - 샴마
  - 샤마
  lexicon: HALOT
  rationale: 히브리어 철자와 POB의 ‘Shamma’ 선택을 반영해 인명으로 음역했습니다.
- source_word: יִתְרָן
  english_pob_choice: Ithran
  chosen_korean: 이드란
  alternatives_korean:
  - 이쓰란
  - 이트란
  lexicon: HALOT
  rationale: 초성 י를 한국어에서 자연스럽게 옮겨 인명으로 음역했습니다. POB가 지적한 전통적 ‘Jethran’은 영어식 관습이므로 따르지 않았습니다.
- source_word: בְאֵרָא
  english_pob_choice: Beera
  chosen_korean: 베에라
  alternatives_korean:
  - 베라
  - 베에르아
  lexicon: HALOT
  rationale: 마지막 성문절개음(אָ/א)을 드러내기 위해 두 음절로 음역하여, POB의 ‘Be'era’ 계열 선택을 한국어에서 반영했습니다.
