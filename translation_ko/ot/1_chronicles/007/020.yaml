- source_word: שׁוּתָלַח
  english_pob_choice: Shuthelah
  chosen_korean: 셔델라
  alternatives_korean:
  - 수델라
  - 슈델라
  lexicon: HALOT
  rationale: 족보 인명은 한국어 성경에서 널리 쓰이는 음역을 우선했으며, 여기서는 인명 표기를 자연스럽게 맞췄습니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그의 자손
  - 그의 후손
  lexicon: HALOT
  rationale: 문자적으로는 ‘그의 아들’이며, 족보의 단계적 연결을 그대로 드러내기 위해 직역했습니다.
- source_word: וְתַחַת
  english_pob_choice: and Tahath
  chosen_korean: 다핫
  alternatives_korean:
