  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
  footnotes:
  - marker: a
    text: Hebrew 'son' in genealogies can sometimes denote a more remote descendant, but the text literally reads 'his son' at each step.
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임의 아들들은 이렇습니다. 셔델라와 그의 아들 베렛과 그의 아들 다핫과 그의 아들 엘르아다와 그의 아들 다핫입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보에서는 ‘아들’이 더 먼 후손을 가리킬 수도 있지만, 본문은 각 단계마다 문자적으로 ‘그의 아들’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
