  - 에브라임의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥에서 목록을 여는 표지로 기능하므로, 한국어에서는 자연스러운 제시형으로 풀어 쓰되 뒤의 열거가 이어지도록 했습니다.
