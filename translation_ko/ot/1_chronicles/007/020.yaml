  rationale: 여기서는 공통명사/전치사가 아니라 인명으로 읽히므로, 족보의 반복 이름을 음역으로 처리했습니다.
- source_word: וְאֶלְעָדָה
  english_pob_choice: and Eleadah
  chosen_korean: 엘르아다
  alternatives_korean:
  - 엘아다
  lexicon: HALOT
  rationale: 고유명사를 음역했으며, 한국어에서 익숙한 성경식 표기를 반영했습니다.
theological_decisions:
- issue: 족보의 בן(son) 반복이 혈연의 직접 아들 관계인지 더 넓은 후손 관계인지
  chosen_reading: 본문의 반복 구조를 유지해 모두 ‘그의 아들’로 옮기고, 계보상의 축약 가능성은 본문 밖에서 해석할 수 있도록 열어 두었습니다.
  alternative_readings:
  - 그의 후손
  - 그의 자손
  rationale: 히브리어 בן은 족보에서 더 먼 후손을 가리킬 수 있지만, 본문 자체는 각 단계마다 ‘his son’을 반복하므로 이를 완화하지 않는 편이 원문 충실합니다.
  doctrine_reference: 족보 해석의 범위는 본문 문법과 문맥에 따르며, 직계/원계의 구분은 주석적 판단 영역입니다.
