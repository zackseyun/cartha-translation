  source_fidelity: 본문의 네 이름과 총수는 대체로 반영되어 있습니다. 다만 고유명사 표기는 표준 한국어 성경 이름 형태(돌라, 부아, 야숩, 시므론)로 바로잡는 것이 안전합니다. 또한 현 각주 b의 ‘창세기 46:13 ... Ishvi’라는 대조는 원문 및 해당 평행 목록과 맞지 않습니다. 창세기 46:13에는 이 자리의 이름이 יוב(통상 ‘욥’)으로 나타나므로, 현 각주는 삭제해야 합니다.
  naturalness: ‘잇사갈의 아들은 … 넷입니다’는 족보 열거에 자연스럽고 현대의 격식 있는 합쇼체에 맞습니다. 각주 표지도 해당 이름 바로 뒤에 두는 편이 명확합니다.
  terminology: 잇사갈, 돌라, 부아, 야숩, 시므론은 한국어 성경 번역에서 널리 쓰이는 고유명사 표기이며, 마소라 본문의 이름 형태를 충실히 구별합니다. ‘부와’는 다른 족보의 평행 형태에 대한 각주에서만 제시합니다.
