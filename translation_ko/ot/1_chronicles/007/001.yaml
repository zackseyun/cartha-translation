  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
  footnotes:
  - marker: a
    text: Hebrew Puah; some English traditions have 'Puvah' based on a parallel form in other genealogical lists.
    reason: alternative_reading
  - marker: b
    text: Hebrew Jashub; Genesis 46:13 has the parallel name form 'Ishvi.'
    reason: cross_reference
translation:
  language: ko
  text: 잇사갈의 아들들은 툴라, 푸아, 야슈브, 그리고 심론—넷이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 Puah에 해당하는 형태를 보이며, 다른 전승에서는 Puvah로도 적습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문은 Jashub에 해당하는 형태를 보입니다. 창세기 46:13의 평행 구절에는 ‘Ishvi’가 나타납니다.
    reason: cross_reference
