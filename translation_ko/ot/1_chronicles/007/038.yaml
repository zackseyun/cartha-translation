base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/038.yaml
  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
  footnotes:
  - marker: a
    text: Pispa may also be rendered 'Pispah,' reflecting a more letter-for-letter transliteration of the final Hebrew consonant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여델의 아들들은 예분네와 피스바와 아라입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피스바’는 영어 POB의 각주처럼, 끝 자음 ה를 더 글자 단위로 반영한 ‘피스파’의 대안 표기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자녀들은
  - 또 여델의 아들들은
  lexicon: HALOT
  rationale: 족보 형식의 בְּנֵי는 표준적으로 ‘아들들’로 옮겨 계보적 문체를 살렸습니다. 앞의 접속사는 목록을 자연스럽게 잇는 ‘그리고’로 처리했습니다.
- source_word: יֶתֶר
  english_pob_choice: Jether
  chosen_korean: 여델
  alternatives_korean:
  - 제델
  - 예델
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경의 통용 표기와 발음 관행을 우선해 옮겼습니다. 이 이름은 한국어에서 ‘여델’이 자연스럽습니다.
- source_word: יְפֻנֶּה
  english_pob_choice: Jephunneh
  chosen_korean: 예분네
  alternatives_korean:
  - 여분네
  - 예후네
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리했습니다. 영어 POB의 Jephunneh에 대응하는 히브리어 이름을 한국어 발음에 맞게 옮겼습니다.
- source_word: וּפִסְפָּה
  english_pob_choice: Pispa
  chosen_korean: 피스바
  alternatives_korean:
  - 피스파
  - 피스바흐
  lexicon: HALOT
  rationale: 영어 POB의 본문 선택이 Pispa이므로 한국어도 이를 따르되, 어말 ה가 약화되는 음역 관행을 반영해 ‘피스바’로 옮겼습니다.
- source_word: וַאְרָא
  english_pob_choice: and Ara
  chosen_korean: 아라
  alternatives_korean:
  - 아레
  - 아르아
  lexicon: HALOT
  rationale: 마지막 인명도 한국어 음역으로 옮겼고, 목록의 마지막 항목이므로 접속사를 반복하지 않았습니다.
