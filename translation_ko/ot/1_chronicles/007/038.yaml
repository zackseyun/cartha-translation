  terminology: 족보의 בְּנֵי는 ‘아들들’로 유지했습니다. 인명은 예델, 여분네, 비스바, 아라로 바로잡았습니다. 영어 감사 기록의 Pispa/Pispah 대안은 한국어 본문에 별도 각주로 유지할 필요가 없으며, 초안 각주는 히브리어 ה와 ‘피스파’의 관계를 부정확하게 설명합니다.
