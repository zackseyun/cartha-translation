base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/038.yaml
  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
  footnotes:
  - marker: a
    text: Pispa may also be rendered 'Pispah,' reflecting a more letter-for-letter transliteration of the final Hebrew consonant.
