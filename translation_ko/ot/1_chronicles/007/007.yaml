  source_fidelity: 전반적으로 이름 목록과 등록 인원은 정확합니다. 그러나 히브리어의 ‘다섯’은 열거된 다섯 사람 전체를 수식하며, 이들은 ‘각각 가문의 우두머리’라는 뜻입니다. 현 번역의 ‘그들은 다섯 가문의 우두머리였고’는 다섯 가문이 있었다는 뜻으로도 읽혀 원문의 결속을 충분히 드러내지 못합니다.
