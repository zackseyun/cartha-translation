  to: 벨라의 아들들은 에즈본, 웃시, 웃시엘, 여리못, 그리고 이리였습니다. 이 다섯 사람은 각 가문의 우두머리이며 용맹한 전사들이었고, 그들의 족보 등록 인원은 2만 2천 34명이었습니다.[a]
