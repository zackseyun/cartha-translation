base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
  footnotes:
  - marker: a
    text: Or 'their genealogy' or 'their registration by genealogy.' The Hebrew term refers to being entered in genealogical records.
    reason: lexical_alternative
translation:
  language: ko
  text: 벨라의 아들들은 에즈본, 웃시, 웃시엘, 여리못, 그리고 이리였습니다. 그들은 다섯 가문의 우두머리였고, 용맹한 전사들이었으며, 그들의 족보 등록은 2만 2천 34명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 족보’ 또는 ‘그들의 족보에 의한 등록’. 이 히브리어 표현은 족보 기록에 이름이 올라가는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 자손들
  - 그리고 ~의 아들들
  lexicon: HALOT
  rationale: 족보 문맥에서 בני는 보통 남계의 후손을 가리키지만, 여기서는 이름 목록이 바로 뒤따르므로 직역에 가까운 ‘아들들’이 가장 투명합니다.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 다섯 가문의 우두머리
  alternatives_korean:
  - 다섯 조상의 집의 우두머리
  - 다섯 족장의 집안 우두머리
  lexicon: HALOT
  rationale: ‘아버지들의 집’이라는 관용적 족장/가문 구조를 한국어에서 자연스럽게 드러내기 위해 ‘가문’과 ‘우두머리’를 택했습니다.
- source_word: גִּבּוֹרֵי חֲיָלִים
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 전사들
  alternatives_korean:
  - 용맹한 사람들
  - 전투에 능한 용사들
  lexicon: HALOT
  rationale: 이 표현은 단순한 힘이 아니라 전투적 역량을 가진 남자들을 가리키므로, ‘전사들’이 의미를 분명히 합니다.
- source_word: וְהִתְיַחְשָׂם
  english_pob_choice: their genealogical enrollment
  chosen_korean: 그들의 족보 등록
  alternatives_korean:
  - 그들의 족보 기재
  - 그들의 계보 등록
  lexicon: HALOT
  rationale: 히트파엘 יחס의 의미를 ‘족보에 기재되다’로 이해해, 수동적 결과를 드러내는 명사구로 옮겼습니다.
