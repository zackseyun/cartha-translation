id: 1CH.7.40
reference: 1 Chronicles 7:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל אֵ֣לֶּה בְנֵי אָ֠שֵׁר רָאשֵׁ֨י בֵית הָ/אָב֤וֹת בְּרוּרִים֙ גִּבּוֹרֵ֣י חֲיָלִ֔ים רָאשֵׁ֖י הַ/נְּשִׂיאִ֑ים וְ/הִתְיַחְשָׂ֤/ם בַּ/צָּבָא֙ בַּ/מִּלְחָמָ֔ה מִסְפָּרָ֣/ם אֲנָשִׁ֔ים עֶשְׂרִ֥ים וְ/שִׁשָּׁ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
  footnotes:
  - marker: a
    text: Or 'their genealogy was recorded' / 'they were registered by genealogy.' The Hebrew verb often refers to genealogical enrollment in Chronicles.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 사람은 아셀의 아들들이며, 아버지의 집들의 우두머리들, 선별된 용사들, 용맹한 전사들, 지도자들 가운데 으뜸인 자들이었으며, 그들은 전쟁을 위한 군대에 소집되어 등록되었습니다. 그들의 남자 수는 이만 육천 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 아버지의 집들의 우두머리들
  alternatives_korean:
  - 족장들
  - 가문의 우두머리들
  lexicon: HALOT
  rationale: 열왕기·역대기의 족보 문맥에 나오는 관용구를 살리되, 현대 한국어에서 이해 가능한 형태로 직역성을 유지했습니다.
- source_word: בְּרוּרִים
  english_pob_choice: select men
  chosen_korean: 선별된 용사들
  alternatives_korean:
  - 선택된 사람들
  - 뽑힌 용사들
  lexicon: HALOT
  rationale: 선발되거나 가려진 사람이라는 상태를 드러내면서, 군사 문맥을 고려해 '용사들'로 풀었습니다.
- source_word: גִּבּוֹרֵי חֲיָלִים
  english_pob_choice: mighty warriors
  chosen_korean: 용맹한 전사들
  alternatives_korean:
  - 능력 있는 전사들
  - 힘센 전사들
  lexicon: HALOT
  rationale: 히브리어의 강함과 전투성을 함께 나타내기 위해 '용맹한'과 '전사들'을 사용했습니다.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  english_pob_choice: chief leaders
  chosen_korean: 지도자들 가운데 으뜸인 자들
  alternatives_korean:
  - 지도자들의 우두머리들
  - 수령들 가운데 으뜸인 자들
  lexicon: HALOT
  rationale: 직역하면 '지도자들의 우두머리들'이지만 한국어에서 중첩이 지나치므로, 위계의 최상위를 드러내는 방식으로 옮겼습니다.
- source_word: וְהִתְיַחְשָׂם
  english_pob_choice: they were enrolled for service in the army
  chosen_korean: 소집되어 등록되었습니다
  alternatives_korean:
  - 계보로 등록되었습니다
  - 군역에 등록되었습니다
  lexicon: HALOT
  rationale: 역대기에서 יחס 계열 동사는 계보 등록을 뜻할 수 있으나, 여기서는 곧바로 군사 동원과 연결되므로 결과를 드러내는 '소집되어 등록'으로 옮겼습니다.
- source_word: מִסְפָּרָם אֲנָשִׁים
  english_pob_choice: Their number in men
  chosen_korean: 그들의 남자 수
  alternatives_korean:
  - 남자의 수는
  - 그 수는 남자들로
  lexicon: HALOT
  rationale: 히브리어가 인원수를 '사람들/남자들'로 계수하는 표현이므로, 계산 단위를 보존해 번역했습니다.
theological_decisions:
- issue: 군사 등록과 계보 등록의 관계
  chosen_reading: 본문은 단순한 병력 집계가 아니라, 가문 계보에 속한 사람들을 전쟁을 위해 공식적으로 편제한 것을 말합니다.
  alternative_readings:
  - 단순한 인구 조사
  - 계보만 강조한 행정 기록
  rationale: 이 절의 동사는 역대기에서 계보 등록을 가리킬 수 있지만, 전후 문맥이 군사 편성에 있으므로 두 의미를 함께 살려야 합니다.
  doctrine_reference: 역대기 문맥의 족보-군사 편제 이해
- issue: רָאשֵׁי הַנְּשִׂיאִים의 위계 표현
  chosen_reading: '''지도자들 가운데 으뜸인 자들''로 옮겨, 정치적 왕권보다 집단 내 우선순위를 드러냈습니다.'
  alternative_readings:
  - 왕자들의 우두머리들
  - 제후들의 우두머리들
  rationale: '''왕자''나 ''제후''는 한국어에서 왕정적·봉건적 뉘앙스를 강하게 띠므로, 본문의 위계성은 유지하면서 과도한 제도적 함의를 피했습니다.'
  doctrine_reference: 역대기 용어의 사회적 위계 표현
