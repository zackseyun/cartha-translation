source:
  edition: WLC
  text: וּ/בְנֵ֣י תוֹלָ֗ע עֻזִּ֡י וּ/רְפָיָ֡ה וִֽ֠/ירִיאֵל וְ/יַחְמַ֨י וְ/יִבְשָׂ֜ם וּ/שְׁמוּאֵ֗ל רָאשִׁ֤ים לְ/בֵית אֲבוֹתָ/ם֙ לְ/תוֹלָ֔ע גִּבּ֥וֹרֵי חַ֖יִל לְ/תֹלְדוֹתָ֑/ם מִסְפָּרָ/ם֙ בִּ/ימֵ֣י דָוִ֔יד עֶשְׂרִֽים וּ/שְׁנַ֥יִם אֶ֖לֶף וְ/שֵׁ֥שׁ מֵאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
  footnotes:
  - marker: a
    text: Or 'chiefs' or 'leaders' of their fathers’ houses.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'mighty men of valor' can also be rendered 'mighty warriors' or 'valiant men.'
    reason: lexical_alternative
  - marker: c
    text: Or 'by their generations' or 'in their genealogies.'
    reason: lexical_alternative
translation:
  language: ko
  text: Tola의 아들들은 이러합니다. 우찌, 르바야, 여리엘, 야흐매, 입삼, 그리고 사무엘입니다. 그들은 Tola에 속한 자기들의 아버지의 집들의 우두머리들이며, 세대에 따라 용맹한 용사들이었습니다. 다윗 시대에 그들의 수는 이만이천육백 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  english_pob_choice: The sons of Tola
  chosen_korean: Tola의 아들들
  alternatives_korean:
  - Tola의 자손들
  - Tola의 아들들입니다
  lexicon: HALOT
  rationale: 족보 목록의 직접적인 친자·후손 표현을 살리기 위해 ‘아들들’로 옮겼습니다. 소속 관계는 뒤의 문구로 보완했습니다.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  english_pob_choice: heads of their fathers’ houses
  chosen_korean: 자기들의 아버지의 집들의 우두머리들
  alternatives_korean:
  - 그들의 아버지 집의 지도자들
  - 가문의 우두머리들
  lexicon: HALOT
  rationale: ‘아버지의 집’이라는 족보·씨족 단위를 유지하면서, רָאשִׁים의 직역인 ‘우두머리들’을 살렸습니다.
- source_word: לְתוֹלָע
  english_pob_choice: belonging to Tola
  chosen_korean: Tola에 속한
  alternatives_korean:
  - Tola를 위한
  - Tola에게 속한
  lexicon: HALOT
  rationale: 단순 소속을 나타내는 관계를 자연스러운 한국어로 옮겼습니다. ‘위하여’보다 혈통·소속의 의미가 분명합니다.
- source_word: גִּבּוֹרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 용사들
  alternatives_korean:
  - 힘센 용사들
  - 용맹한 사람들
  - 무공의 장정들
  lexicon: HALOT
  rationale: 상투적 어구의 전투적·용맹한 뉘앙스를 살리되, 한국어로는 자연스럽게 ‘용사들’로 정리했습니다.
- source_word: לְתֹלְדוֹתָם
  english_pob_choice: according to their generations
  chosen_korean: 세대에 따라
  alternatives_korean:
  - 그들의 계보에 따라
  - 그들의 족보대로
  lexicon: HALOT
  rationale: תולדות의 족보적 의미를 반영하되, 현대 한국어에서 매끄럽게 읽히는 표현으로 옮겼습니다. 족보성은 전체 문맥이 보완합니다.
- source_word: בִּימֵי דָוִיד
  english_pob_choice: in the days of David
  chosen_korean: 다윗 시대에
  alternatives_korean:
  - 다윗의 날들에
  - 다윗의 때에
  lexicon: HALOT
  rationale: 히브리어의 관용적 시간 표현을 자연스럽게 현대 한국어로 옮겼습니다.
