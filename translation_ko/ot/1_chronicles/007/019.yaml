  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
  footnotes:
  - marker: a
    text: Or 'descendants of Shemida.' In genealogies, 'sons' can sometimes function more broadly for male descendants, though the immediate context here supports 'sons.'
    reason: lexical_alternative
