lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: were
  chosen_korean: 이었습니다
  alternatives_korean:
  - 되었습니다
  - 있었습니다
  lexicon: HALOT
  rationale: 족보 목록에서 היה의 완료적 서술은 단순한 존재 진술로 자연스럽게 옮기는 것이 적절하여, 과도한 동적 의미를 더하지 않았습니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
