  text: 스미다의 아들들[가]은 아히안, 세겜, 릭히, 그리고 아니암이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 또는 ‘스미다의 자손들’. 족보에서 ‘아들들’은 때때로 남성 자손들을 더 넓게 가리킬 수 있으나, 여기의 직접적인 문맥은 ‘아들들’을 뒷받침합니다.
    reason: lexical_alternative
