  lexicon: HALOT
  rationale: 족보 문맥에서 남계 계보를 가리키는 기본 표현을 살려, 영어 POB의 ‘sons of’에 대응하는 직역형으로 옮겼습니다.
- source_word: שְׁמִידָע
  english_pob_choice: Shemida
  chosen_korean: 스미다
  alternatives_korean:
  - 세미다
  - 셰미다
  lexicon: standard_transliteration
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다. 영어 POB의 Shemida를 참고하되, 한국어 외래어 표기 감각에 맞게 처리했습니다.
- source_word: אַחְיָן / שֶׁכֶם / לִקְחִי / אֲנִיעָם
  english_pob_choice: Ahian / Shechem / Likhi / Aniam
  chosen_korean: 아히안, 세겜, 릭히, 아니암
