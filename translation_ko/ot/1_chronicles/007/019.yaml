  lexicon: standard_transliteration
  rationale: 각 인명은 번역하지 않고 음역했습니다. ‘Shechem’은 지명과 겹치지만 여기서는 족보의 인명이므로 한국어 성경 관용음 ‘세겜’을 사용했습니다.
