id: 1CH.7.34
reference: 1 Chronicles 7:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
  footnotes:
  - marker: a
    text: Hebrew genealogical formulas often use 'sons of' for male descendants or clan members, not only immediate sons.
    reason: cultural_note
  - marker: b
    text: Some English versions spell the third name 'Jehubbah' and others 'Hubbah'; the Hebrew form permits transliteration variation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셰멜의 아들은 아히, 로흐가, 예후바, 아람이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보 공식에서 “아들들”은 직계 아들뿐 아니라 후손이나 씨족 구성원을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 이 이름은 영어 성경 전통에서 Jehubbah 또는 Hubbah처럼 다양하게 적힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들은
  alternatives_korean:
  - 그리고 …의 자손은
  - 그리고 …의 자녀들은
  lexicon: HALOT
  rationale: 족보 서술에서는 בן의 복수형이 직계 아들만이 아니라 가문 구성원 전체를 가리킬 수 있으므로, 한국어에서도 자연스러운 족보형 표현으로 옮겼습니다.
- source_word: שָׁמֶר
  english_pob_choice: Shemer
  chosen_korean: 셰멜
  alternatives_korean:
  - 세멜
  - 쉐멜
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 음역이 원칙이며, 기존 영어 POB의 Shemer에 대응해 한국어 표기를 간결하게 옮겼습니다.
- source_word: אֲחִי
  english_pob_choice: Ahi
  chosen_korean: 아히
  alternatives_korean:
  - 아치
  - 아키
  lexicon: 고유명사 음역
  rationale: 이름으로 기능하므로 어근 의미를 살리기보다 음역했습니다.
- source_word: ו/רוהגה
  english_pob_choice: Rohgah
  chosen_korean: 로흐가
  alternatives_korean:
  - 로가
  - 로하가
  lexicon: 고유명사 음역
  rationale: 히브리어 자음열의 이름으로 보고 음역했으며, 영어 POB의 Rohgah에 대응하는 한국어 음가를 택했습니다.
- source_word: יחבה
  english_pob_choice: Jehubbah
  chosen_korean: 예후바
  alternatives_korean:
  - 예후바흐
  - 여후바
  lexicon: 고유명사 음역
  rationale: 영어 본문이 주는 전통적 철자(Jehubbah)를 반영하되, 히브리어 고유명사 음역으로 한국어 표기를 정리했습니다.
theological_decisions:
- issue: 족보 সূত্র의 “sons of” 표현 범위
  chosen_reading: “아들”을 기본으로 하되 족보 문맥 전체로는 가문/계열 구성원을 가리킬 수 있는 표현으로 이해하게 했습니다.
  alternative_readings:
  - “자손”으로 넓게 옮김
  - “아들들”로 직역
  rationale: 원문 족보 공식의 관용적 용법을 보존하면서도 한국어 독자가 혈연 집단 서술임을 오해하지 않도록 했습니다.
  doctrine_reference: 족보 문맥의 관용적 בן שימוש
