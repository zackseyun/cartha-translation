  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
  footnotes:
  - marker: a
    text: The Hebrew form for the first son is unusual (יעיש). It is rendered 'Jeush' following the likely intended proper name in this genealogy; possible alternatives include 'Jaaish' or 'Jaish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여디야엘의 아들들은 빌한입니다. 빌한의 아들들은 예우스, 베냐민, 에훗, 게나나, 제단, 다르시스, 아히샤하르입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태(יעיש)는 비정상적이지만, 문맥과 영어 POB의 판단에 따라 ‘예우스’로 옮겼습니다. 가능한 다른 표기는 ‘예아이스’ 또는 ‘야이쉬’입니다.
    reason: lexical_alternative
