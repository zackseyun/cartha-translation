translation:
  language: ko
  text: 여디아엘의 아들은 빌한이었고, 빌한의 아들들은 여우스[a], 베냐민, 에훗, 그나아나, 세단, 다시스, 아히샤하르입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문의 이 이름은 ‘יעיש’라는 이례적인 형태입니다. 여기서는 족보에서 통상 예상되는 이름을 따라 ‘여우스’로 옮겼습니다. 다른 음역으로는 ‘야이스’ 또는 ‘야이쉬’가 가능합니다.
    reason: lexical_alternative
