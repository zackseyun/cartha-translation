  rationale: 이 절은 서술보다 계보 정보 전달이 중심이므로, 원문 배열을 최대한 보존하는 편이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: 성경 본문의 계보 표기 보존 원칙
