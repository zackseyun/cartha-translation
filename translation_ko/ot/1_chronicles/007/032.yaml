  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חֶ֨בֶר֙ הוֹלִ֣יד אֶת יַפְלֵ֔ט וְ/אֶת שׁוֹמֵ֖ר וְ/אֶת חוֹתָ֑ם וְ/אֵ֖ת שׁוּעָ֥א אֲחוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/032.yaml
  text: Heber fathered Japhlet[a], Shomer, Hotham[b], and Shua their sister.
  footnotes:
  - marker: a
    text: Or 'Shemer' for Shomer.
    reason: lexical_alternative
  - marker: b
    text: Or 'Shuah' for Shua.
    reason: lexical_alternative
translation:
  language: ko
  text: 헤벨은 야플렛과 쇼메르와 호탐과 그들의 누이 수아를 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘셔머’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘슈아’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חֶבֶר
  english_pob_choice: Heber
  chosen_korean: 헤벨
  alternatives_korean:
  - 헤버
  - 헤브르
  lexicon: HALOT
  rationale: 고유명사이므로 음역하되, 현대 한국어 표기 관행에 맞춰 헤벨로 옮겼습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생산했습니다
  lexicon: HALOT
  rationale: 계보 문맥의 히필 ילד는 자녀를 ‘낳다/낳게 하다’의 계보적 의미를 가지므로, 현대 한국어에서 자연스럽고 직설적인 ‘낳았습니다’로 옮겼습니다.
- source_word: שׁוֹמֵר
  english_pob_choice: Shomer
  chosen_korean: 쇼메르
  alternatives_korean:
  - 셔머
  lexicon: HALOT
  rationale: 영어 POB가 표시한 Shomer를 따라 음역하되, 히브리어 자음·모음값을 비교적 직접 반영하는 형태를 택했습니다.
- source_word: שׁוּעָא
  english_pob_choice: Shua
  chosen_korean: 수아
  alternatives_korean:
  - 슈아
  lexicon: HALOT
  rationale: 본문 형태를 음역하면 수아가 자연스럽고, 영어 POB의 대안인 Shuah에 대한 본문 주석적 여지를 해치지 않습니다.
theological_decisions:
- issue: 아우르지 않는 가족 호칭 표현
  chosen_reading: אֲחוֹתָם־־־은 ‘그들의 누이’로 옮겨, 바로 앞의 남자 형제들에 대한 집합적 소유 관계를 드러냈습니다.
  alternative_readings:
  - 그의 누이
  - 그 여동생
  rationale: 히브리어 3인칭 복수 접미사를 살려, 수아가 앞에 열거된 형제들의 누이임을 명확히 하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 본문 의미 보존 및 계보 서술의 문맥적 일치
