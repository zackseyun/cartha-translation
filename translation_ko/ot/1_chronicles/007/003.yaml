source:
  edition: WLC
  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
  footnotes:
  - marker: a
    text: Or 'five chief men' or 'five family heads.' The Hebrew literally says 'five heads, all of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우시의 아들들은 이스라히야였습니다. 이스라히야의 아들들은 미가엘과 오바디야와 요엘과 잇시야였으니, 모두 다섯 명의 우두머리들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다섯 머리들, 그들 모두’입니다. 족보 문맥에서는 ‘다섯 우두머리들’ 또는 ‘다섯 가문의 대표자들’의 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 그리고 아들들은
  - 아들들이
  lexicon: HALOT
  rationale: 족보 공식에서 בְּנֵי는 보통 ‘아들들’로 옮기며, 접속사 וְ는 목록의 연속성을 살려 앞절과 자연스럽게 이어 주었습니다.
- source_word: עֻזִּי
  english_pob_choice: Uzzi
  chosen_korean: 우시
  alternatives_korean:
  - 웃지
  - 우찌
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관례에 따라 옮겼습니다.
- source_word: יִזְרַחְיָה
  english_pob_choice: Izrahiah
  chosen_korean: 이스라히야
  alternatives_korean:
  - 이즈라히야
  - 이즈라야
  lexicon: HALOT
  rationale: 고유명사로서 음역을 유지했고, 같은 인물을 두 번 반복하는 본문 구조도 그대로 반영했습니다.
- source_word: רָאשִׁים
  english_pob_choice: heads
  chosen_korean: 우두머리들
  alternatives_korean:
  - 머리들
  - 족장들
  - 가문의 우두머리들
  lexicon: HALOT
  rationale: 직역하면 ‘머리들’이지만, 족보 문맥에서는 지파·가문 단위의 대표자를 가리키므로 ‘우두머리들’로 옮겨 의미를 드러냈습니다.
theological_decisions:
- issue: רָאשִׁים의 족보적 의미
  chosen_reading: ‘다섯 명의 우두머리들’로 번역해, 단순한 신체 부위 은유가 아니라 가문 대표자라는 기능적 의미를 드러냈습니다.
  alternative_readings:
  - ‘다섯 명의 머리들’
  - ‘다섯 가문의 우두머리들’
  rationale: 본문의 숫자와 함께 쓰인 רָאשִׁים은 족보 목록에서 지위·대표성을 나타내므로, 한국어에서도 그 기능이 분명히 읽히도록 했습니다.
  doctrine_reference: 족보 문맥의 사회적 호칭/대표성
- issue: ‘five, all of them’의 강조
  chosen_reading: ‘모두 다섯 명의 우두머리들이었습니다’로 처리해, ‘다섯’과 ‘모두’의 중복 강조를 살렸습니다.
  alternative_readings:
  - ‘다섯, 모두 그들입니다’
  - ‘모두 다섯 명이었습니다’
  rationale: 히브리어 כֻּלָּם은 열거된 인물 전체를 가리키는 요약 강조이므로, 한국어에서도 반복을 살려 결론을 분명하게 했습니다.
  doctrine_reference: 문법적 강조 표현
