translation:
  language: ko
  text: 웃시의 아들은 이스라히야였습니다. 이스라히야의 아들들은 미가엘과 오바댜와 요엘과 잇시야였으니, 곧 모두 다섯 우두머리였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다섯 우두머리, 그들 모두’입니다. 족보 문맥에서 ‘우두머리’는 가문의 대표자 또는 지도자를 뜻할 수 있습니다. 히브리어 본문은 네 이름을 열거한 뒤 ‘다섯’이라고 말합니다.
    reason: lexical_alternative
