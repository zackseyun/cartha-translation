lexical_decisions:
- source_word: לַעְדָּן
  english_pob_choice: Ladan
  chosen_korean: 라단
  alternatives_korean:
  - 라아단
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역했으며, 영어 POB의 주 음역인 Ladan을 따라 한국어에서는 라단으로 옮겼습니다. 영어 주석이 제시한 Laadan 가능성은 동일 철자에 대한 대안적 음역이므로 각주로 처리하는 것이 적절합니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아들
  - 그 자손
  lexicon: HALOT
  rationale: 직역하면 ‘그의 아들’이며, 족보 문맥에서도 가장 자연스럽고 원문 구조를 잘 드러냅니다.
- source_word: עַמִּיהוּד
  english_pob_choice: Ammihud
  chosen_korean: 암미훗
  alternatives_korean:
  - 암미후드
  lexicon: HALOT
  rationale: 고유명사를 현대 한국어 음역으로 옮겼습니다. 영어 POB의 표준형 Ammihud에 대응하되 한국어 표기 관례에 따라 훗으로 적었습니다.
- source_word: אֱלִישָׁמָע
  english_pob_choice: Elishama
  chosen_korean: 엘리사마
  alternatives_korean:
  - 엘리샤마
  - 엘리사마
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역했습니다. 영어 POB의 Elishama를 한국어 음운에 맞게 엘리사마로 옮겼습니다.
