    issue: ‘그의 형인’이 אָחִיו의 관계를 ‘형’으로 한정합니다.
    rationale: אָח은 형 또는 동생을 포함하는 ‘형제’이며, 이 절 자체에는 연령 관계를 판단할 근거가 없습니다.
  - severity: medium
    issue: ‘조바’는 צוֹפַח의 첫 자음 צ의 음역으로 부정확합니다.
    rationale: צ는 /ts/ 계열 자음이므로 한국어에서는 ‘소바’(또는 음역 체계에 따라 ‘초바’)가 ‘조바’보다 원문에 가깝습니다. 한국어 성경 음역 전통의 ‘소바’를 채택합니다.
  - severity: low
