  chosen_reading: 이 절은 특별한 신학적 강조보다 혈통 정보를 간결히 전달하는 족보 표현으로 처리했습니다.
  alternative_readings:
  - 인물들의 의미를 보충하는 설명적 번역
  - 관계를 풀어쓴 해설적 번역
  rationale: 히브리어가 단순한 계보 열거이므로, 본문의 정보량을 넘지 않도록 직역에 가까운 간결한 문장으로 유지했습니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
