base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/035.yaml
  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
  footnotes:
  - marker: a
    text: Or possibly 'Zophach' for the name צוֹפַח, depending on transliteration convention for the final Hebrew letter ח.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 형인 헤렘의 아들은 조바, 임나, 셀레시, 그리고 아말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 자음 ח의 음가 처리에 따라 이 이름은 ‘조바’ 외에 다른 음역 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  english_pob_choice: The son of
  chosen_korean: 아들은
  alternatives_korean:
  - 그리고 아들은
  - 그 아들은
  lexicon: HALOT
  rationale: 족보 문맥의 בֵּן을 한국어에서는 자연스럽게 ‘아들’로 옮기고, 문두 접속사는 과도하게 드러내지 않았습니다.
- source_word: הֵלֶם
  english_pob_choice: Helem
  chosen_korean: 헤렘
  alternatives_korean:
  - 헬렘
  - 헤럼
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 표기 관행에 맞춰 ‘헤렘’으로 옮겼습니다.
- source_word: אָחִיו
  english_pob_choice: his brother
  chosen_korean: 그의 형인
  alternatives_korean:
  - 그의 동생인
  - 그의 형제인
  lexicon: HALOT
  rationale: 문맥상 앞선 인물을 가리키는 친족관계를 보존하되, 족보에서 자연스러운 한국어로 ‘그의 형인’이라고 옮겼습니다.
- source_word: צוֹפַח
  english_pob_choice: Zophah
  chosen_korean: 조바
  alternatives_korean:
  - 조파
  - 소바
  lexicon: HALOT
  rationale: 히브리어 자음 ח의 음가를 어떻게 옮길지에 따라 로마자 표기가 갈릴 수 있으나, 한국어 음역은 발음 중심으로 ‘조바’로 처리했습니다.
theological_decisions:
