  text: 그의 형제 헬렘의 아들은 소바[a], 임나, 셀레시, 아말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 צופח은 마지막 자음 ח를 드러내어 ‘소바흐’로도 음역할 수 있습니다.
