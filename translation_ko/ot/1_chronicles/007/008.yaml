- from: 그리고 베겔의 아들들은 제미라, 요아시, 엘리에셀, 엘리오에나이, 오므리, 예레못, 아비야, 아낫돗, 그리고 알레멧입니다. 이들은 모두 베겔의 아들들입니다.[a]
  to: 그리고 베겔의 아들들은 스미라, 요아스, 엘리에셀, 엘료에내, 오므리, 여레못[a], 아비야, 아나돗, 알레멧입니다. 이들은 모두 베겔의 아들들입니다.
  rationale: 본문의 계보 구조와 ‘아들들’이라는 혈연 표현은 유지했습니다. 다만 히브리어 본문과 한국어 성경의 통용 음역에 맞추어 인명들을 바로잡고, 여레못의 음역 변이를 설명하는 각주를 해당 이름 뒤로 옮겼습니다.
