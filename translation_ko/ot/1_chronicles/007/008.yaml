id: 1CH.7.8
reference: 1 Chronicles 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
  footnotes:
  - marker: a
    text: Jeremoth may also be spelled 'Jerimoth' in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 베겔의 아들들은 스미라, 요아스, 엘리에셀, 엘료에내, 오므리, 여레못[a], 아비야, 아나돗, 알레멧입니다. 이들은 모두 베겔의 아들들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여레못은 음역에 따라 ‘예리못’으로도 표기될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자녀들은
  - 또 …의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥의 공식적인 계보 표현을 살리기 위해 ‘아들들’로 옮기고, सूची 구조를 반영해 접속사 ‘그리고’를 유지했습니다.
- source_word: בֶכֶר
  english_pob_choice: Becher
  chosen_korean: 베겔
  alternatives_korean:
  - 베허
  - 베헤르
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경 관행에 맞게 음역했으며, 표준 외래어 표기에서 가장 자연스러운 형태로 처리했습니다.
- source_word: זְמִירָה
  english_pob_choice: Zemirah
  chosen_korean: 제미라
  alternatives_korean:
  - 제미라흐
  - 즈미라
  lexicon: HALOT
  rationale: 인명은 영어 전통형을 그대로 음차하기보다 한국어 음가에 맞는 표기를 택해 읽기와 음성 재현을 균형 있게 반영했습니다.
- source_word: יְרֵמוֹת
  english_pob_choice: Jeremoth
  chosen_korean: 예레못
  alternatives_korean:
  - 예리못
  - 예레모스
  lexicon: HALOT
  rationale: 영어 본문이 지적한 철자 변이(Jeremoth/Jerimoth)는 한국어 본문에서는 한 형태로 정리하되, 히브리어 자음군을 반영한 음역으로 옮겼습니다.
- source_word: עֲנָתוֹת
  english_pob_choice: Anathoth
  chosen_korean: 아낫돗
  alternatives_korean:
  - 아나돗
  - 아낫도스
  lexicon: HALOT
  rationale: 지명/인명 겸용 가능성이 있으나 여기서는 족보의 고유명사로 처리해, 히브리어 음가를 보존하는 음역을 택했습니다.
theological_decisions:
- issue: 족보 서술의 반복 종결
  chosen_reading: “이들은 모두 베겔의 아들들입니다”로 뒤의 총괄 문장을 분명히 살렸습니다.
  alternative_readings:
  - 문장 없이 이름 목록만 제시
  - “모두 베겔의 자손입니다”로 완화
  rationale: 히브리어의 결론부 כָּל אֵלֶּה בְּנֵי בָכֶר을 단순 요약하지 않고, 명시적 총괄로 옮겨 계보의 확정성을 유지했습니다.
  doctrine_reference: 본문의 역사-계보적 진술 보존 원칙
- issue: 족보에서의 성별/혈연 용어
  chosen_reading: בְּנֵי를 기본값대로 ‘아들들’로 옮겼습니다.
  alternative_readings:
  - ‘자녀들’
  - ‘후손들’
  rationale: 족보 공식어를 완화하면 원문의 계보 형식이 흐려지므로, 문맥상 남성 계보 표지를 분명하게 드러내는 번역을 유지했습니다.
  doctrine_reference: 계보 본문의 형식 보존
