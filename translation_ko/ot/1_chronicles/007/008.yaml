  source_fidelity: 원문의 족보 도입구, 아홉 인명, 그리고 “이들은 모두 베겔의 아들들”이라는 총괄 문장은 모두 보존되어야 합니다. 그러나 초안의 몇몇 인명 음역(특히 요아시, 엘리에셀, 엘리오에나이, 예레못, 아낫돗)은 히브리어 발음 및 한국어 성경의 통용 표기와 잘 맞지 않습니다.
