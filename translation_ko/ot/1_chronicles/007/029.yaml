  lexicon: HALOT
  rationale: ‘요셉의 아들들’이라는 족보적 표현을 유지하면서, 뒤의 동격 ‘이스라엘의 아들’ 관계를 ‘곧’으로 분명히 했습니다.
theological_decisions:
- issue: 이스라엘/요셉 지파의 족보적 동일시
  chosen_reading: 마지막 절은 요셉의 아들들을 이스라엘의 아들들로 식별하는 동격 설명으로 처리했습니다.
  alternative_readings:
  - 단순한 출신 표지로 완화
  - ‘이스라엘 자손’이라는 집합명으로 일반화
  rationale: 히브리어의 בן יִשְׂרָאֵל는 단순 수사보다 족보적 정체성 확인을 강하게 드러내므로, 동격을 보존하는 편이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 창세기 48장, 여호수아 16장/17장 지파 분배 전승
