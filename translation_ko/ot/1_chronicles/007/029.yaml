  text: וְ/עַל יְדֵ֣י בְנֵי מְנַשֶּׁ֗ה בֵּית שְׁאָ֤ן וּ/בְנֹתֶ֨י/הָ֙ תַּעְנַ֣ךְ וּ/בְנֹתֶ֔י/הָ מְגִדּ֥וֹ וּ/בְנוֹתֶ֖י/הָ דּ֣וֹר וּ/בְנוֹתֶ֑י/הָ בְּ/אֵ֨לֶּה֙ יָשְׁב֔וּ בְּנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
  footnotes:
  - marker: a
    text: Or 'villages' for 'daughter towns'; the Hebrew literally says 'daughters,' a common expression for dependent settlements around a main city.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the side of the sons of Manasseh'; the Hebrew idiom can be rendered more literally, but here it refers to territorial adjacency or border.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세 자손의 영토 경계를 따라[b] 벧스안과 그 딸 성읍들[a], 다아낙과 그 딸 성읍들, 므깃도와 그 딸 성읍들, 돌과 그 딸 성읍들이 있었습니다. 이곳들에는 이스라엘의 아들인 요셉의 아들들이 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘딸 성읍들’은 히브리어의 문자적 표현으로, 중심 성읍에 딸린 주변 정착지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘므낫세 자손의 곁에/옆에’라고 말합니다. 이 지리 목록에서는 므낫세 자손의 영토에 인접하거나 그 경계를 따라 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
