source:
  edition: WLC
  text: וְ/עַל יְדֵ֣י בְנֵי מְנַשֶּׁ֗ה בֵּית שְׁאָ֤ן וּ/בְנֹתֶ֨י/הָ֙ תַּעְנַ֣ךְ וּ/בְנֹתֶ֔י/הָ מְגִדּ֥וֹ וּ/בְנוֹתֶ֖י/הָ דּ֣וֹר וּ/בְנוֹתֶ֑י/הָ בְּ/אֵ֨לֶּה֙ יָשְׁב֔וּ בְּנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
  footnotes:
  - marker: a
    text: Or 'villages' for 'daughter towns'; the Hebrew literally says 'daughters,' a common expression for dependent settlements around a main city.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the side of the sons of Manasseh'; the Hebrew idiom can be rendered more literally, but here it refers to territorial adjacency or border.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세 자손의 경계에는 벧스안과 그 딸 성읍들, 다아낙과 그 딸 성읍들, 므깃도와 그 딸 성읍들, 돌과 그 딸 성읍들이 있었습니다. 이곳들에 요셉의 아들들, 곧 이스라엘의 아들들이 살았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘딸 성읍들’은 히브리어의 문자적 표현으로, 중심 성읍에 종속된 주변 정착지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 첫머리는 문자적으로는 ‘므낫세 자손의 곁에/옆에’에 가깝지만, 문맥상 영토 경계를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  english_pob_choice: along the borders of
  chosen_korean: 경계에는
  alternatives_korean:
  - 가에
  - 곁에
  - 변두리에
  lexicon: HALOT
  rationale: 지리 목록에서의 관용구로서 ‘경계’가 문맥상 가장 정확하고 자연스럽습니다. 영어 POB의 border 감각을 반영하면서도 ‘손’의 직역을 피했습니다.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  english_pob_choice: and its daughter towns
  chosen_korean: 그 딸 성읍들
  alternatives_korean:
  - 그 마을들
  - 그 종속 정착지들
  - 그 딸들
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘딸들’을 살리되, 한국어에서는 독자가 지리적 종속 촌락을 이해하도록 ‘성읍들’과 결합했습니다.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / מְגִדּוֹ / דּוֹר
  english_pob_choice: Beth-shean / Taanach / Megiddo / Dor
  chosen_korean: 벧스안 / 다아낙 / 므깃도 / 돌
  alternatives_korean:
  - 벧산 / 타아낙 / 메기도 / 도르
  lexicon: HALOT
  rationale: 현대 표기법에 따른 음역을 따르되, 한국 교회권에서 널리 알려진 형태와 지명 인식을 함께 고려했습니다.
- source_word: בְּנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  english_pob_choice: the sons of Joseph son of Israel
  chosen_korean: 요셉의 아들들, 곧 이스라엘의 아들들
  alternatives_korean:
  - 요셉의 자손들, 이스라엘의 아들들
  - 이스라엘의 아들인 요셉의 아들들
  lexicon: HALOT
  rationale: ‘요셉의 아들들’이라는 족보적 표현을 유지하면서, 뒤의 동격 ‘이스라엘의 아들’ 관계를 ‘곧’으로 분명히 했습니다.
theological_decisions:
- issue: 이스라엘/요셉 지파의 족보적 동일시
  chosen_reading: 마지막 절은 요셉의 아들들을 이스라엘의 아들들로 식별하는 동격 설명으로 처리했습니다.
  alternative_readings:
  - 단순한 출신 표지로 완화
  - ‘이스라엘 자손’이라는 집합명으로 일반화
  rationale: 히브리어의 בן יִשְׂרָאֵל는 단순 수사보다 족보적 정체성 확인을 강하게 드러내므로, 동격을 보존하는 편이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 창세기 48장, 여호수아 16장/17장 지파 분배 전승
