  lexicon: HALOT
  rationale: 현대 표기법에 따른 음역을 따르되, 한국 교회권에서 널리 알려진 형태와 지명 인식을 함께 고려했습니다.
- source_word: בְּנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  english_pob_choice: the sons of Joseph son of Israel
  chosen_korean: 요셉의 아들들, 곧 이스라엘의 아들들
  alternatives_korean:
  - 요셉의 자손들, 이스라엘의 아들들
