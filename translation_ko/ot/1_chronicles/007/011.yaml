  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
  footnotes:
  - marker: a
    text: Or “descendants of Jediael.” The Hebrew “sons of” can function broadly in genealogical lists.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “heads of the fathers’ houses,” that is, clan or family heads.
    reason: cultural_note
  - marker: c
    text: Or “mighty men of valor.”
    reason: lexical_alternative
  - marker: d
    text: Literally “those going out to the army for war,” an idiom for men available or eligible for military duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 모두 야디엘의 아들들로서, 조상 가문의 우두머리들이며, 용맹한 전사들이었습니다. 모두 합하여 만 칠천 이백 명이었으며, 전쟁에 나갈 수 있는 사람들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אֵלֶּה
  english_pob_choice: All these
  chosen_korean: 이들은 모두
  alternatives_korean:
  - 이 모든 사람들은
  - 이들은
  lexicon: HALOT
  rationale: 총계를 도입하는 요약구로, 히브리어의 간결함을 살리면서 불필요한 명사 추가를 피했습니다.
- source_word: בְּנֵי יְדִיעֲאֵל
  english_pob_choice: sons of Jediael
  chosen_korean: 야디엘의 아들들
  alternatives_korean:
  - 야디엘의 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 ‘sons of’는 넓게는 후손을 뜻할 수 있지만, 원형을 따라 더 직접적인 ‘아들들’로 옮겼습니다.
- source_word: לְרָאשֵׁי הָאָבוֹת
  english_pob_choice: according to the heads of the fathers’ houses
  chosen_korean: 조상 가문의 우두머리들
  alternatives_korean:
  - 아버지들의 집의 우두머리들
  - 족장들
  lexicon: HALOT
  rationale: 이 표현은 혈연·씨족 단위의 수장을 가리키므로, 한국어에서 자연스럽고 의미를 보존하는 ‘조상 가문의 우두머리들’로 옮겼습니다.
- source_word: גִּבּוֹרֵי חֲיָלִים
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 전사들
  alternatives_korean:
  - 용사들
  - 무용한 사람들
  lexicon: HALOT
  rationale: 전투 능력과 용맹을 함께 나타내는 관용구이므로, 현대 한국어에서 자연스럽고 전투적 뉘앙스를 살리는 표현을 택했습니다.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  english_pob_choice: able to go out in the army for war
  chosen_korean: 전쟁에 나갈 수 있는 사람들이었습니다
  alternatives_korean:
  - 군대에 나가 전쟁할 수 있는 사람들
  - 전쟁을 위해 군대에 출동할 수 있는 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘군대로 나가는 자들’이라는 관용구로, 군역 가능자라는 뜻을 자연스러운 한국어로 풀었습니다.
