  to: 그들의 소유지와 거주지는 벧엘과 그 딸 마을들이었고, 동쪽으로는 나아란[a], 서쪽으로는 게셀과 그 딸 마을들, 또 세겜과 그 딸 마을들에서 아야[b]와 그 딸 마을들까지였습니다.[c]
