base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
  footnotes:
  - marker: a
    text: Naaran is rendered by some as 'Naarah' based on a related place-name tradition elsewhere.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'daughter towns' is an idiom for smaller dependent towns or villages belonging to a larger city.
    reason: cultural_note
  - marker: c
    text: The Hebrew text reads 'Ayyah'; some ancient witnesses and translations instead reflect 'Gaza.'
    reason: textual_variant
translation:
  language: ko
  text: 그들의 소유지와 거주지는 벧엘과 그 딸 마을들이었고, 동쪽으로는 나아란[a], 서쪽으로는 게셀과 그 딸 마을들, 또 세겜과 그 딸 마을들에서 아야[b]와 그 딸 마을들까지였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 나아란은 다른 곳에 나타나는 관련 지명 전승에 따라 일부에서 ‘나아라’로 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 본문은 ‘아야’로 읽지만, 일부 고대 증거와 번역본은 다른 지명인 ‘가사’를 반영합니다.
    reason: textual_variant
  - marker: c
    text: 히브리어의 ‘딸 마을들’은 큰 도시에 속한 작은 부속 마을이나 촌락을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֻזָּתָם
  english_pob_choice: their holdings
  chosen_korean: 소유지
  alternatives_korean:
  - 소유
  - 재산
  - 기업
  lexicon: HALOT
  rationale: 지리 목록의 문맥에서 토지나 영토의 점유지를 가리키므로, 일반적 ‘재산’보다 ‘소유지’가 더 정확합니다.
- source_word: מֹשְׁבוֹתָם
  english_pob_choice: settlements
  chosen_korean: 거주지
  alternatives_korean:
  - 정착지
  - 거처들
  - 주거지
  lexicon: HALOT
  rationale: 영어 POB의 ‘settlements’처럼 사람이 거주하는 장소를 자연스럽게 드러내며, 영토 경계 설명에도 잘 맞습니다.
- source_word: בְנֹתֶיהָ
  english_pob_choice: its daughter towns
  chosen_korean: 그 딸 마을들
  alternatives_korean:
  - 그 속한 마을들
  - 부속 마을들
  - 위성 마을들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘딸 마을들’로 히브리어 관용구를 보존하되, 한국어에서도 의미가 드러나도록 했습니다.
- source_word: עַד
  english_pob_choice: as far as
  chosen_korean: …에 이르기까지
  alternatives_korean:
  - …까지
  - …에까지
  - …에 이르도록
  lexicon: HALOT
  rationale: 경계의 종착점을 나타내는 표현으로, 본문의 영토 범위를 자연스럽게 표시합니다.
theological_decisions:
- issue: 지명 Ayyah의 본문 유지와 각주 처리
  chosen_reading: 본문에는 마소라 본문의 ‘아얏’을 유지하고, 일부 고대 증거가 다른 지명(가사)을 반영한다는 점은 각주로 처리합니다.
  alternative_readings:
  - 본문을 가사로 바꾸는 처리
  - 대체 전승을 본문에 병기하는 처리
  rationale: 히브리어 본문과 POB의 비평 각주를 우선해, 본문은 MT를 따르고 대체 전승은 주석에서만 알리도록 했습니다.
  doctrine_reference: 본문비평 원칙
