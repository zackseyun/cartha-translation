    text: 평행본문인 2사무엘 23:26에는 “팔트 사람”에 해당하는 읽기가 나옵니다. 이 차이는 번역상의 선택이라기보다 목록 평행의 차이입니다.
    reason: cross_reference
  - marker: b
    text: 또는 “팔트 사람”으로, 이 절의 마소라 본문보다 2사무엘 23:26의 평행 읽기를 따른 것입니다.
    reason: alternative_reading
