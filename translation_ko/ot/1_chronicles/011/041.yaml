translation:
  language: ko
  text: 우리야, 곧 사람, 자밧의 아들 아흘라이입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוּרִיָּה
  english_pob_choice: Uriah
  chosen_korean: 우리야
  alternatives_korean:
  - 우리아
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리했고, 한국어 성경에서 널리 통용되는 ‘우리야’를 채택했습니다.
- source_word: הַ/חִתִּי
  english_pob_choice: the Hittite
  chosen_korean: 곧 사람
  alternatives_korean:
  - 헷 사람
  - 히타이트 사람
  lexicon: HALOT
  rationale: 히브리어 본문에는 יליד식 직함이 아니라 הַחִתִּי가 붙어 있어 출신 표지를 보여 주므로, 문맥상 주어를 같은 사람으로 묶는 약한 동격 표시로 처리했습니다. 다만 한국어에서는 ‘헷 사람’이 표준적이므로, 본문 의미를 해치지 않는 범위에서 가장 간결한 동격 표현을 택했습니다.
- source_word: זָבָד בֶּן אַחְלָי
  english_pob_choice: Zabad son of Ahlai
  chosen_korean: 자밧의 아들 아흘라이
  alternatives_korean:
  - 자밧, 아흘라이의 아들
  - 자밧, 아흘라이의 아들
  lexicon: HALOT
  rationale: 계보식 명칭은 관계를 분명히 드러내기 위해 ‘아들’ 구조를 유지했고, 인명은 한국어 음역으로 옮겼습니다.
theological_decisions:
- issue: 인명 목록의 쉼표 처리와 직함의 동격성
  chosen_reading: ‘우리야, 곧 사람’으로 읽어 우리야의 출신 표지를 부가 설명처럼 드러냈습니다.
  alternative_readings:
  - ‘헷 사람 우리야’
  - ‘우리야, 헷 사람’
  rationale: 본문은 전쟁 용사 명단의 간결한 나열이므로, 과도한 해설 없이 출신 표지를 표시하는 것이 적절합니다. 동시에 히브리어 정관사 있는 민족 표지를 무시하지 않도록 했습니다.
  doctrine_reference: 본문의 서술 기능과 인명 식별
- issue: 우리야에 대한 교차본문 연상
  chosen_reading: 이 절 자체에는 교차주석을 넣지 않았습니다.
  alternative_readings:
  - 2사무엘 11장과의 연결을 주석으로 표시
  rationale: 본절은 명단 맥락의 단순 식별 정보이므로, 별도 주석은 오히려 본문의 간결성을 해칠 수 있습니다.
  doctrine_reference: 정경 간 교차참조의 절제
