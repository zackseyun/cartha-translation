base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
  footnotes:
  - marker: a
    text: Or “You shall not come here” / “You will not enter here.” The Hebrew literally says, “You will not come here,” functioning as a refusal of entry.
    reason: lexical_alternative
translation:
  language: ko
  text: 예부스의 주민들이 다윗에게 말했습니다. “당신은 여기로 들어올 수 없습니다.”[a] 그러나 다윗은 시온의 요새를 점령했습니다. 그곳은 다윗 성입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신은 여기로 오지 않을 것이다”입니다. 히브리어 표현은 문맥상 이곳으로 들어오는 것을 거부하는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  english_pob_choice: the inhabitants of Jebus
  chosen_korean: 예부스의 주민들
  alternatives_korean:
  - 예부스에 사는 자들
  - 예부스의 거주자들
  lexicon: HALOT
  rationale: 문자적으로는 ‘예부스에 거주하는 사람들’이지만, 현대 한국어에서는 ‘주민들’이 가장 자연스럽고 집합적 의미를 잘 살립니다.
- source_word: לֹא תָבֹוא הֵנָּה
  english_pob_choice: You will not come in here
  chosen_korean: 네가 여기로 들어오지 못할 것이다
  alternatives_korean:
  - 네가 여기로 오지 못할 것이다
  - 네가 여기로 들어오지 못한다
  lexicon: HALOT
  rationale: 히브리어는 ‘오다’와 ‘여기’의 결합으로 출입 거부를 나타내므로, 한국어에서는 ‘들어오다’가 그 공간적 거부를 가장 분명하게 전달합니다.
- source_word: מְצֻדַת צִיּוֹן
  english_pob_choice: the stronghold of Zion
  chosen_korean: 시온의 요새
  alternatives_korean:
  - 시온의 산성
  - 시온의 성채
  lexicon: HALOT
  rationale: מְצוּדָה는 방어 거점을 가리키므로 ‘요새’가 가장 직접적입니다. ‘산성’은 관용적이지만 본문의 군사적 성격을 덜 직접적으로 드러냅니다.
- source_word: הִיא עִיר דָּוִיד
  english_pob_choice: that is, the City of David
  chosen_korean: 그것이 곧 다윗 성입니다
  alternatives_korean:
  - 즉 다윗 성입니다
  - 바로 다윗 성입니다
  lexicon: HALOT
  rationale: 설명적 동격을 한국어에서 자연스럽게 풀어, 앞의 ‘시온의 요새’와 동일 대상을 밝히는 기능을 살렸습니다.
