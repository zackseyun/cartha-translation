  terminology: ‘스루야의 아들 요압’ 및 ‘무기 드는 자’는 원문의 계보적 식별과 נֹשֵׂא כְלֵי의 관용적 직무를 충실히 반영합니다. 각주는 본문의 번역을 단순 반복하거나 부정확한 ‘무기 보유자’를 제시하지 않고 문자적 대안을 제공하도록 고칩니다.
