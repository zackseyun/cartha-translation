    rationale: 히브리어는 ‘나하래, 브에롯 사람, 스루야의 아들 요압의 무기 드는 자’라는 한 구성입니다. 초안의 구두점과 중복은 이 수식 관계를 문법적으로 성립하지 않게 합니다.
