  source_fidelity: 원문은 두 인물, ‘암몬 사람 셀렉’과 ‘브에롯 사람 나하래’를 열거하며, ‘스루야의 아들 요압의 무기 드는 자’라는 수식은 문법적으로 나하래에게 붙습니다. 초안은 요압을 중복하고 문장 끝에 고립시켜 원문의 수식 관계를 훼손합니다.
