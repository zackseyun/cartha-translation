id: 1CH.11.39
reference: 1 Chronicles 11:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צֶ֖לֶק הָ/עַמּוֹנִ֑י נַחְרַי֙ הַ/בֵּ֣רֹתִ֔י נֹשֵׂ֕א כְּלֵ֖י יוֹאָ֥ב בֶּן צְרוּיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/039.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
  footnotes:
  - marker: a
    text: Or, more literally, 'bearer of the weapons of Joab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 암몬 사람 셀렉과 스루야의 아들 요압의 무기 드는 자인 브에롯 사람 나하래였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “요압의 무기들을 드는 자”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶלֶק
  english_pob_choice: Zelek
  chosen_korean: 스엘렉
  alternatives_korean:
  - 젤렉
  - 셀렉
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 음역하는 것이 원문 인물 식별을 가장 잘 보존합니다. 영어 POB의 Zelek에 맞춰 한국어에서는 현대 표기법상 가능한 범위에서 스엘렉으로 옮겼습니다.
- source_word: הָעַמּוֹנִי
  english_pob_choice: the Ammonite
  chosen_korean: 암몬 사람
  alternatives_korean:
  - 암몬 사람
  - 암몬인
  lexicon: 민족/출신 표지
  rationale: 정관사가 붙은 출신 표지이므로 인명 뒤에 붙는 소속 표시로 자연스럽게 옮겼습니다. '암몬 사람'은 목록 문맥에서 가장 덜 해석적인 표현입니다.
- source_word: הַבֵּרֹתִי
  english_pob_choice: the Beerothite
  chosen_korean: 베로 사람
  alternatives_korean:
  - 베롯 사람
  - 베에롯 사람
  lexicon: 지명 유래 형용사
  rationale: Beeroth에서 온 사람이라는 지리적 소속을 드러내기 위해 '베로 사람'으로 옮겼습니다. 한국어에서는 지명 + '사람' 구성이 인명 목록에서 가장 분명합니다.
- source_word: נֹשֵׂא כְּלֵי
  english_pob_choice: the armor-bearer
  chosen_korean: 무기 든 사람
  alternatives_korean:
  - 무기 담당자
  - 무기 حامل자
  - 무기 운반자
  lexicon: 관용구
  rationale: 히브리어 관용구 נֹשֵׂא כְּלֵי는 영어 POB가 주석으로 밝히듯 문자적으로는 '요압의 무기를 드는 자/무기 보유자'에 가깝습니다. 본문에서는 자연스러운 기능 표현인 '무기 든 사람'을 쓰고, 각주로 직역 가능성을 밝혔습니다.
- source_word: יוֹאָב בֶּן צְרוּיָה
  english_pob_choice: Joab son of Zeruiah
  chosen_korean: 스루야의 아들 요압
  alternatives_korean:
  - 요압, 스루야의 아들
  - 스루야 아들 요압
  lexicon: 족보식 표지
  rationale: 히브리어의 친족/계보 표지를 한국어 관용에 맞게 '스루야의 아들 요압'으로 옮겼습니다. 인물 식별 기능을 유지하면서도 목록의 간결함을 살렸습니다.
theological_decisions:
- issue: נֹשֵׂא כְּלֵי의 직역과 관용역 중 무엇을 본문에 둘지
  chosen_reading: 본문에는 '무기 든 사람'을 두고, 직역 가능성은 각주로 처리했습니다.
  alternative_readings:
  - 요압의 무기 보유자
  - 요압의 무기 운반자
  rationale: 이 표현은 단순 직함이라기보다 전투 보조 역할을 가리키는 관용구이므로, 한국어 본문에서는 의미가 즉시 드러나는 표현이 더 적절합니다. 다만 원문의 문자적 색채를 지우지 않기 위해 각주로 보완했습니다.
  doctrine_reference: '번역 원칙: 원문 관용구의 기능 의미를 우선하되, 문자적 뉘앙스를 보조 정보로 보존'
