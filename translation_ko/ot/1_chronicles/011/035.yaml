  text: אֲחִיאָ֧ם בֶּן שָׂכָ֛ר הַ/הֲרָרִ֖י אֱלִיפַ֥ל בֶּן אֽוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/035.yaml
  text: Ahiam son of Sachar the Hararite[a], Eliphal son of Ur.
  footnotes:
  - marker: a
    text: Or possibly 'descendant of' for each occurrence of 'son of,' though immediate sonship is the most natural sense in this military roster.
    reason: lexical_alternative
translation:
  language: ko
  text: 하랄 사람 사갈의 아들[a] 아히암, 우르의 아들[a] 엘리발입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들’은 ‘후손’으로도 옮길 수 있습니다. 그러나 이 전사 명단에서는 직접적인 부자 관계를 뜻하는 것으로 이해하는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיאָם
  english_pob_choice: Ahiam
  chosen_korean: 아히암
  alternatives_korean:
  - 아히얌
  - 아히암
  lexicon: 고유명사 음역
  rationale: 고유명사는 뜻풀이보다 음역이 적절하므로, 표준적인 한국어 음역으로 옮겼습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: …의 아들
  alternatives_korean:
  - …의 후손
  - …의 자손
  lexicon: HALOT
  rationale: 족보·전사 명단 문맥에서 בֶּן은 가장 자연스럽게 친자 관계를 가리키므로, POB의 ‘son of’를 따라 ‘…의 아들’로 옮겼습니다.
- source_word: הֲרָרִי
  english_pob_choice: the Hararite
  chosen_korean: 하랄 사람
  alternatives_korean:
  - 하라리 사람
  - 산지 사람
  lexicon: HALOT
  rationale: 영어 POB의 지시처럼 지명/출신을 나타내는 형용사로 보고, ‘Hararite’의 형식을 한국어에서 자연스럽게 풀어 ‘하랄 사람’으로 옮겼습니다.
- source_word: אֽוּר
  english_pob_choice: Ur
  chosen_korean: 우르
  alternatives_korean:
  - 우르
  - 우르
  lexicon: 고유명사 음역
  rationale: 문맥상 메소포타미아 도시가 아니라 인명으로 쓰였으므로, 고유명사 음역으로 ‘우르’라 했습니다.
