id: 1CH.11.6
reference: 1 Chronicles 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד כָּל מַכֵּ֤ה יְבוּסִי֙ בָּ/רִ֣אשׁוֹנָ֔ה יִהְיֶ֥ה לְ/רֹ֖אשׁ וּ/לְ/שָׂ֑ר וַ/יַּ֧עַל בָּ/רִאשׁוֹנָ֛ה יוֹאָ֥ב בֶּן צְרוּיָ֖ה וַ/יְהִ֥י לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
  footnotes:
  - marker: a
    text: Or, “shall be head and commander.”
    reason: lexical_alternative
  - marker: b
    text: The verb “went up” may imply ascending in attack against the stronghold, but the Hebrew wording itself is simply “went up.”
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 말했습니다[a]. 「누구든지 먼저 여부스 사람을 쳐 쓰러뜨리는 사람은 우두머리와 사령관이 될 것입니다.」 그래서 스루야의 아들 요압이 먼저 올라갔고[b], 그가 우두머리가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “머리와 사령관이 될 것이다.”
    reason: lexical_alternative
  - marker: b
    text: “올라갔다”는 공격을 위한 상승을 암시할 수 있지만, 히브리어 표현 자체는 단순히 “올라갔다”입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  english_pob_choice: Whoever strikes down a Jebusite
  chosen_korean: 누구든지 먼저 여부스 사람을 쳐 쓰러뜨리는 사람
  alternatives_korean:
  - 누구든지 여부스 사람을 치는 사람
  - 누구든지 여부스 사람을 공격하는 사람
  lexicon: HALOT
  rationale: כָּל + 분사 구문은 조건을 이끄는 불특정 관계절로 보아 “누구든지”가 자연스럽고, מַכֵּה는 전투 문맥에서 단순 “치다”보다 결과를 드러내는 “쳐 쓰러뜨리다”가 더 적절합니다.
- source_word: לְרֹאשׁ וּלְשָׂר
  english_pob_choice: shall become chief and commander
  chosen_korean: 우두머리와 사령관
  alternatives_korean:
  - 머리와 지휘관
  - 우두머리와 지도자
  lexicon: HALOT
  rationale: לְרֹאשׁ의 직책적 의미를 “우두머리”로, שַׂר의 군사·통치적 직함을 “사령관”으로 옮겨 두 표현의 병렬성을 살렸습니다.
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔고
  alternatives_korean:
  - 진군했고
  - 공격했고
  lexicon: HALOT
  rationale: 히브리어는 해석을 덧붙이지 않고 단순히 “올라가다”를 말하므로, 전투적 함의를 살리되 본문 이상으로 구체화하지 않았습니다.
- source_word: וַיְהִי לְרֹאשׁ
  english_pob_choice: and he became chief
  chosen_korean: 그가 우두머리가 되었습니다
  alternatives_korean:
  - 그가 머리가 되었습니다
  - 그가 지도자가 되었습니다
  lexicon: HALOT
  rationale: 앞선 약속의 רֹאשׁ와 연결되는 표현을 한국어에서도 동일한 핵심어로 유지해 약속과 성취의 대응을 드러냈습니다.
theological_decisions:
- issue: 다윗의 발언과 서술의 직함 표현
  chosen_reading: 다윗의 약속은 ‘우두머리와 사령관’으로, 성취는 ‘우두머리’로만 옮겨 본문이 실제로 반복하는 범위를 유지했습니다.
  alternative_readings:
  - 약속과 성취 모두 ‘머리와 사령관’으로 통일하기
  - 성취에서도 ‘우두머리와 사령관’으로 보완하기
  rationale: 본문은 약속에서 두 직함을 제시하지만 성취문은 רֹאשׁ만 반복하므로, 번역도 그 차이를 보존해야 서술의 긴장을 지키게 됩니다.
  doctrine_reference: 본문 충실성 및 문학적 반복 보존
