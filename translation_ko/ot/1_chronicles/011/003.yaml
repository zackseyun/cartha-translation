  source_fidelity: 수정이 필요합니다. 초안의 ‘그러므로’는 단순 서술을 잇는 וַ 접속사를 인과적으로 해석하므로 ‘이에’로 고쳤습니다. 또한 첫 ‘헤브론’은 사무엘 관련 각주가 아니라 왕이 있는 장소를 나타내므로, 각주 표지를 ‘사무엘을 통하여’로 옮겼습니다. 왕으로 기름 붓는 행위는 ‘기름을 부어 … 왕으로 삼았습니다’로 자연스럽게 유지했습니다.
  naturalness: ‘헤브론의 왕에게’는 헤브론의 소유·통치 관계로도 읽힐 수 있어 ‘헤브론에 있는 왕에게’로 명확히 했습니다. ‘사무엘의 손을 통하여’는 한국어에서 부자연스럽고 해당 히브리어 관용구의 매개 의미를 충분히 전달하지 못하므로 ‘사무엘을 통하여’로 옮겼습니다.
