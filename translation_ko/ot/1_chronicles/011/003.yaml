base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of Samuel,'' an idiom meaning ''through Samuel'' or ''by Samuel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘의 모든 장로가 헤브론[a]의 왕에게 나아왔고, 다윗은 헤브론에서 야훼 앞에서 그들과 언약을 맺었습니다. 그들은 야훼의 말씀대로, 사무엘의 손을 통하여 다윗에게 기름을 부어 이스라엘의 왕으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘사무엘의 손을 통하여’라는 관용구로, ‘사무엘을 통하여’ 또는 ‘사무엘로 말미암아’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: all the elders of Israel
  chosen_korean: 이스라엘의 모든 장로
  alternatives_korean:
  - 이스라엘의 모든 지도자
  - 이스라엘의 원로들
  lexicon: HALOT
  rationale: 사회·정치적 대표자를 가리키는 זִקְנֵי는 한국어 성경에서 일반적으로 ‘장로’로 옮기는 것이 가장 직접적이며, ‘지도자’는 범위가 넓어집니다.
- source_word: וַיִּכְרֹת ... בְּרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺었습니다
  alternatives_korean:
  - 언약을 세웠습니다
  - 언약을 체결했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘언약을 맺다’이므로, 현대 한국어에서도 의미를 가장 자연스럽고 직접적으로 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 항목의 원칙에 따라 신성호칭 יְהוָה는 제목 대체인 ‘주’가 아니라 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: וַיִּמְשְׁחוּ
  english_pob_choice: they anointed
  chosen_korean: 기름을 부어
  alternatives_korean:
  - 부어
  - 성별하여
  lexicon: HALOT
  rationale: 왕위 즉위의 표지인 ‘기름을 붓다’라는 구체적 행위를 그대로 살려, 추상화한 ‘세우다’와 분리해 표현했습니다.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  english_pob_choice: king over Israel
  chosen_korean: 이스라엘의 왕으로 세웠습니다
  alternatives_korean:
  - 이스라엘의 왕으로
  - 이스라엘을 다스리는 왕으로
  lexicon: HALOT
  rationale: ‘왕 over Israel’의 지위를 한국어에서 자연스럽게 풀어, 즉위와 통치를 함께 드러내되 과도한 의역은 피했습니다.
- source_word: בְּיַד שְׁמוּאֵל
  english_pob_choice: by Samuel
  chosen_korean: 사무엘의 손을 통하여
  alternatives_korean:
  - 사무엘을 통하여
  - 사무엘로 말미암아
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘사무엘의 손으로’이지만, 관용적 매개 의미를 살리면서도 원문의 이미지를 유지하기 위해 ‘손을 통하여’로 옮겼습니다.
theological_decisions:
- issue: Divine name יְהוָה in a covenant/royal-installation context
  chosen_reading: 본문의 언약과 즉위 장면에서 יְהוָה는 고유명사 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주’로 대체
  - 전통 교회어 ‘여호와’ 사용
  rationale: 본문은 ‘야훼 앞에서’와 ‘야훼의 말씀대로’라는 반복을 통해 하나님의 직접적 증언과 명령을 강조하므로, 제목 대체보다 고유명사 유지가 소스의 힘을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה YHWH'
- issue: Register in quoted narrative prose
  chosen_reading: 서술문은 합쇼체로 유지하고, 왕정 설치의 공식성을 위해 ‘맺었습니다/세웠습니다’ 같은 공적 문체를 사용했습니다.
  alternative_readings:
  - 더 구어적인 서술
  - 전통적 성서체
  rationale: 본문은 역사기록체이므로 현대 표준어의 공식 문체가 가장 적절하며, 고어적 종결을 쓰지 않아도 의례성과 장엄성이 유지됩니다.
  doctrine_reference: Korean target style guidance
