  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
  footnotes:
  - marker: a
    text: Or, more formally, 'three of the thirty chiefs went down upon the rock to David, to the cave of Adullam.' The Hebrew syntax is compressed, and 'at the cave of Adullam' in the main text clarifies David's location.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 서른 명 가운데 세 명의 우두머리가 바위로 내려와 다윗에게, 즉 아둘람 굴에 있는 그에게 갔습니다. 그때 블레셋 사람들의 진영은 르바임 골짜기에 진을 치고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘서른 명 가운데 세 우두머리가 바위 위로 다윗에게, 아둘람 굴로 내려갔다’입니다. 히브리어 구문이 압축되어 있어, 본문에서는 다윗의 위치를 풀어 썼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁלוֹשָׁה מִן הַשְּׁלוֹשִׁים
  english_pob_choice: three of the thirty chiefs
  chosen_korean: 그 서른 명 가운데 세 명의 우두머리
  alternatives_korean:
  - 서른 명 중 세 명의 수령들
  - 서른 명 가운데 세 우두머리
  lexicon: HALOT
  rationale: ‘מן’은 부분을 표시하므로 ‘가운데’로 자연스럽게 옮겼고, רֹאשׁ은 서열상의 선도자 의미를 살려 ‘우두머리’로 번역했습니다.
- source_word: רֹאשׁ
  english_pob_choice: chiefs
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 장관
  - 대장
  lexicon: HALOT
  rationale: 여기서는 공식 직함보다 ‘서른 명’ 내부의 선두 인물이라는 기능이 핵심이므로, 군사적 직함을 과도하게 특정하지 않는 ‘우두머리’가 적절합니다.
- source_word: עַל הַצֻּר
  english_pob_choice: to the rock
  chosen_korean: 바위로
  alternatives_korean:
  - 바위 위로
  - 그 바위로
  - 바위 쪽으로
  lexicon: HALOT
  rationale: 문맥상 이동 방향을 나타내며, 한국어에서는 목적지를 간결하게 드러내는 ‘-로’가 가장 자연스럽습니다.
- source_word: אֶל מְעָרַת עֲדֻלָּם
  english_pob_choice: at the cave of Adullam
  chosen_korean: 아둘람 굴에 있는 그에게
  alternatives_korean:
  - 아둘람 굴로
  - 아둘람 굴에서
  lexicon: HALOT
  rationale: 히브리어 구문이 압축되어 있어, 다윗의 위치를 풀어 주는 POB의 취지를 따라 ‘다윗에게, 즉 아둘람 굴에 있는 그에게’로 옮겼습니다.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  english_pob_choice: while the camp of the Philistines was encamped
  chosen_korean: 그때 블레셋 사람들의 진영은 … 진을 치고 있었습니다
  alternatives_korean:
  - 블레셋 사람들의 진영이 진을 쳤습니다
  - 블레셋 사람들의 진영은 주둔하고 있었습니다
  lexicon: HALOT
  rationale: חֹנָה는 진행 중인 상태를 나타내는 분사이므로, 배경 상황을 드러내는 ‘진을 치고 있었습니다’가 적합합니다.
theological_decisions:
- issue: 압축된 히브리어 구문을 한국어에서 어떻게 해명할지
  chosen_reading: ‘다윗에게, 즉 아둘람 굴에 있는 그에게’로 풀어 다윗의 위치를 명시했습니다.
  alternative_readings:
  - ‘아둘람 굴로’로 단순화
  - ‘다윗에게, 아둘람 굴에서’로 직역
  rationale: 원문은 목적지와 위치가 압축되어 있어, 독자가 사건 배경을 오해하지 않도록 하면서도 원문 정보의 긴장을 유지하는 방식이 필요합니다.
  doctrine_reference: source clarity / discourse fidelity
