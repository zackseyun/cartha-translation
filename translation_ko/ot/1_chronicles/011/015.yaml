- from: 그때 그 서른 명 가운데 세 명의 우두머리가 바위로 내려와 다윗에게, 즉 아둘람 굴에 있는 그에게 갔습니다. 그때 블레셋 사람들의 진영은 르바임 골짜기에 진을 치고 있었습니다.[a]
