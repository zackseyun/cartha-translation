  text: Now David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
  footnotes:
  - marker: a
    text: Or 'fortress' for 'stronghold.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew repeats ''then'' in both clauses for emphasis: ''David was then in the stronghold, and the garrison of the Philistines was then in Bethlehem.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗은 요새에 있었고, 블레셋 사람들의 수비대는 그때 베들레헴에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요새’는 히브리어 מְצוּדָה의 자연스러운 한국어 대응이며, 영어 POB의 ‘stronghold’에 대한 대안으로 ‘fortress’가 제시된 점을 반영한 렉시컬 선택입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 두 절에서 אָז를 반복해 ‘그때 … 그때’의 시간적 병행을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: בַּמְּצוּדָה
  english_pob_choice: stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 요새지
  - 산성
  lexicon: HALOT
  rationale: מְצוּדָה는 방어가 가능한 요새화된 장소를 가리키므로, 한국어에서는 군사적·지형적 뉘앙스를 살리면서도 자연스러운 ‘요새’가 가장 적절합니다.
- source_word: וּנְצִיב
  english_pob_choice: garrison
  chosen_korean: 수비대
  alternatives_korean:
  - 주둔군
  - 주둔지
  - 총독
  lexicon: HALOT
  rationale: 이 문맥에서는 행정관이 아니라 블레셋의 군사 주둔을 뜻하므로, ‘수비대’가 영어 POB의 garrison과 같은 의미를 분명하게 전달합니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
