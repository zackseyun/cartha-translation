lexical_decisions:
- source_word: בַּמְּצוּדָה
  english_pob_choice: stronghold
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 요새지
  - 산성
  lexicon: HALOT
  rationale: מְצוּדָה는 방어가 가능한 요새화된 장소를 가리키므로, 한국어에서는 군사적·지형적 뉘앙스를 살리면서도 자연스러운 ‘요새’가 가장 적절합니다.
- source_word: וּנְצִיב
  english_pob_choice: garrison
  chosen_korean: 수비대
  alternatives_korean:
  - 주둔군
  - 주둔지
  - 총독
  lexicon: HALOT
  rationale: 이 문맥에서는 행정관이 아니라 블레셋의 군사 주둔을 뜻하므로, ‘수비대’가 영어 POB의 garrison과 같은 의미를 분명하게 전달합니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 블레셋인들
  - 필리스티아 사람들
  lexicon: HALOT
  rationale: 한국어 성서 용례에 맞게 민족명은 ‘블레셋 사람들’로 옮겨 독자가 즉시 인물 집단을 알아보게 했습니다.
- source_word: אָז ... אָז
  english_pob_choice: then ... then
  chosen_korean: 그때 ... 그때
  alternatives_korean:
  - 그 무렵 ... 그 무렵
  - 그때 ... 그 시각
  lexicon: HALOT
  rationale: 히브리어의 אָז 반복을 한국어에서도 살려, 다윗과 블레셋 수비대의 상황이 동시에 제시된다는 점을 드러냈습니다.
