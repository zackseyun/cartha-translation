id: 1CH.11.8
reference: 1 Chronicles 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֤בֶן הָ/עִיר֙ מִ/סָּבִ֔יב מִן הַ/מִּלּ֖וֹא וְ/עַד הַ/סָּבִ֑יב וְ/יוֹאָ֕ב יְחַיֶּ֖ה אֶת שְׁאָ֥ר הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
  footnotes:
  - marker: a
    text: Or 'Joab revived/repaired the rest of the city.' The Hebrew verb literally means 'made alive,' here likely used idiomatically for restoring the city.
    reason: lexical_alternative
  - marker: b
    text: '''The Millo'' is a topographical term in Jerusalem; its precise meaning is uncertain. It may refer to a terraced structure or filled-in earthwork.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 밀로에서부터 그 주위까지 성읍을 사방으로 건축하였으며, 요압은 성읍의 남은 부분을 회복시켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밀로’는 예루살렘의 지형·구조물을 가리키는 용어로, 정확한 의미는 확실하지 않습니다. 축대나 메운 토목 구조물일 가능성이 있습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 동사 יְחַיֶּה는 문자적으로는 ‘살리다’이지만, 여기서는 성읍을 복구·정비했다는 관용적 의미로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 건축하였으며
  alternatives_korean:
  - 세웠으며
  - 지었으며
  - 재건하였으며
  lexicon: HALOT
  rationale: 기본 과거 서술로서 בנה의 의미를 살려 ‘건축하다’를 택했습니다. 문맥상 예루살렘 성읍의 확장·정비를 가리키지만, 본문에 없는 ‘재-’ 의미를 본문에 직접 넣지는 않았습니다.
- source_word: מִסָּבִיב / וְעַד הַסָּבִיב
  english_pob_choice: all around / even to the surrounding area
  chosen_korean: 사방으로 / 그 주위까지
  alternatives_korean:
  - 둘레로 / 둘레까지
  - 온통 / 둘레를 따라
  lexicon: HALOT
  rationale: 둘러싸는 범위를 나타내는 표현이므로 한국어에서 자연스러운 ‘사방으로’, ‘그 주위까지’로 옮겨 주변 전체를 포괄하는 의미를 살렸습니다.
- source_word: מִן הַמִּלּוֹא
  english_pob_choice: from the Millo
  chosen_korean: 밀로에서부터
  alternatives_korean:
  - 밀로에서
  - 밀로라는 축대에서
  - 충전 구조물에서
  lexicon: HALOT
  rationale: מִלּוֹא는 지명적·지형적 용어로 정확한 실체가 불확실하므로, 본문에서는 고유 지명처럼 음역을 유지했습니다. 해석적 풀이는 주석으로 남기는 편이 본문 충실성에 맞습니다.
- source_word: וְיוֹאָב יְחַיֶּה
  english_pob_choice: Joab restored
  chosen_korean: 요압은 … 회복시켰습니다
  alternatives_korean:
  - 요압은 … 되살렸습니다
  - 요압은 … 살려냈습니다
  - 요압은 … 복구했습니다
  lexicon: HALOT
  rationale: חיה의 직역인 ‘살리다’ 계열은 도시/성읍의 수리·복원 맥락에서는 과도하게 생물학적입니다. POB의 ‘restored’에 맞추어 ‘회복시키다’로 옮겨, 수리와 재정비의 의미를 함께 담았습니다.
- source_word: אֶת שְׁאָר הָעִיר
  english_pob_choice: the rest of the city
  chosen_korean: 성읍의 남은 부분
  alternatives_korean:
  - 성읍의 나머지
  - 성읍의 남은 곳
  - 성읍의 남은 부분들
  lexicon: HALOT
  rationale: שְׁאָר는 ‘남은 것, 나머지’라는 뜻이므로 ‘성읍의 남은 부분’이 가장 직접적입니다. 문맥상 도시 전체가 아니라 아직 손대지 않은 구역을 가리킵니다.
theological_decisions:
- issue: יְחַיֶּה를 도시 복원 문맥에서 어떻게 이해할지
  chosen_reading: ‘회복시켰습니다’로 번역해 도시의 수리·정비를 뜻하게 했습니다.
  alternative_readings:
  - ‘되살렸습니다’
  - ‘살려냈습니다’
  - ‘재건했습니다’
  rationale: 히브리어 동사는 문자적으로 ‘살리다’이지만, 성읍 대상에서는 관용적으로 복원·정비를 뜻할 수 있습니다. 본문은 생명 부여의 신학적 은유를 과장하기보다 도시 복구의 실제 의미를 전달하는 것이 적절합니다.
  doctrine_reference: 문맥 우선의 의미역; 히브리어 관용구 처리
- issue: 문장 첫 부분의 주어 처리
  chosen_reading: 앞 절의 다윗을 주어로 이어받아 한국어 본문에서는 생략하지 않고 ‘그는’으로 받았습니다.
  alternative_readings:
  - '주어 생략: ‘밀로에서부터… 건축하였으며’'
  - '명시적 주어: ‘다윗은…’'
  rationale: 히브리어 서술 흐름은 앞 문맥의 다윗을 계속 지칭합니다. 한국어에서는 장절 단위의 독립성을 위해 대명사로 연결하면 읽기 흐름이 자연스럽습니다.
  doctrine_reference: 담화 연속성/지시대상 처리
