  text: וְ/אַחֲרָ֛י/ו אֶלְעָזָ֥ר בֶּן דּוֹד֖וֹ הָ/אֲחוֹחִ֑י ה֖וּא בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
  footnotes:
  - marker: a
    text: Or "one of the three mighty men." The Hebrew expression can denote membership in the elite group of three.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뒤에는 엘르아살 곧 도도의 아호아 사람이 있었는데, 그는 세 명의 용사 가운데 한 사람이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘세 명의 용사 가운데 한 사람’이라는 포함 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그의 뒤에는
  alternatives_korean:
  - 그 다음에는
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 목록에서의 순서를 나타내는 표현이므로, 자연스러운 한국어로 ‘그의 뒤에는’이라고 옮겨 다음 인물을 잇는 흐름을 살렸습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 곧
  alternatives_korean:
  - 아들
  - ~의 아들
  lexicon: HALOT
  rationale: 히브리어 계보식 표현을 한국어에서 이름 연결로 자연스럽게 드러내기 위해 ‘엘르아살 곧 도도의’로 처리했습니다.
- source_word: הָאֲחוֹחִי
  english_pob_choice: the Ahohite
  chosen_korean: 아호아 사람
  alternatives_korean:
  - 아호아 사람인
  - 아호아 사람의
  lexicon: HALOT
  rationale: 지명/씨족 형용사를 한국어 성경식으로 풀어 ‘아호아 사람’이라고 옮겨, 단순한 음역보다 소속 표지를 분명히 했습니다.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  english_pob_choice: among the three mighty men
  chosen_korean: 세 명의 용사 가운데 한 사람이었습니다
  alternatives_korean:
  - 세 용사 가운데 있었습니다
  - 세 명의 용사 가운데 하나였습니다
  lexicon: HALOT
  rationale: 영어 POB 주석이 허용하는 ‘one of the three mighty men’의 포함 의미를 살려, ‘한 사람이었습니다’로 소속을 분명하게 드러냈습니다.
theological_decisions:
- issue: הַגִּבֹּרִים의 직함성
  chosen_reading: ‘용사’로 옮겨 다윗의 정예 전사 집단이라는 호칭적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 전사
  - 용맹한 자들
  rationale: 문맥상 단순한 일반 전사보다 특정 집단 명칭의 성격이 강하므로, 한국어에서도 익숙하면서도 직함성을 유지하는 ‘용사’를 선택했습니다.
  doctrine_reference: 서술 문맥/어휘 선택
- issue: הוּא בִּשְׁלוֹשָׁה의 포함 의미
  chosen_reading: ‘세 명의 용사 가운데 한 사람이었습니다’로 번역해, 단순한 순위가 아니라 그 집단에 속함을 드러냈습니다.
  alternative_readings:
  - 세 명 가운데 한 명이었습니다
  - 그는 세 용사 중 하나였습니다
  rationale: 히브리어 전치사 בִּ의 포함 용법과 POB 주석의 대안을 반영하여, 엘르아살이 그 셋에 속한 인물임을 분명히 했습니다.
  doctrine_reference: 본문 문법/의미
