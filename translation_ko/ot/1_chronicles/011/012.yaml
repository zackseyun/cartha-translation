  source_fidelity: 수정이 필요합니다. 초안의 ‘곧 도도의’는 בֶּן־דּוֹדוֹ(‘도도의 아들’)를 누락·왜곡합니다. 또한 הָאֲחוֹחִי는 문법적으로 도도를 수식하는 계보/씨족 표지로 처리하는 것이 가장 자연스럽습니다. בִּשְׁלוֹשָׁה는 ‘세 용사 가운데’로 옮겨 소속 의미를 보존할 수 있습니다.
  naturalness: ‘그의 뒤에는’도 가능하지만 전사 명단의 열거 문맥에서는 ‘그 다음에는’이 더 자연스럽습니다. 수정문은 현대 표준어 합쇼체의 서술 흐름과 인명·계보 표현에 맞습니다.
  terminology: ‘엘르아살’, ‘도도’, ‘아호아 사람’, ‘용사’는 적절합니다. ‘아호아 사람 도도의 아들’로 배열하여 아호아 사람이라는 표지가 도도에게 연결됨을 드러냅니다.
