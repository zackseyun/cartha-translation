base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
  footnotes:
  - marker: a
    text: Or 'the Bethlehemite.' The Hebrew reads literally 'from Bethlehem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 용맹한 전사들은 다음과 같습니다. 요압의 형제 아사헬과 베들레헴 출신 도도의 아들 엘하난입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘베들레헴에서/로부터’입니다. ‘베들레헴 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  english_pob_choice: And the mighty warriors
  chosen_korean: 그리고 용맹한 전사들은
  alternatives_korean:
  - 그리고 용사들은
  - 그리고 ძლ력한 전사들은
  - 그리고 전사들은
  lexicon: HALOT
  rationale: גִּבּוֹרֵי הַחֲיָלִים는 단순한 ‘사람들’이 아니라 전투에 능한 정예 용사들을 가리키므로, 현대 한국어에서는 ‘용맹한 전사들’이 자연스럽고 의미를 잘 보존합니다.
- source_word: אֲחִי יוֹאָב
  english_pob_choice: the brother of Joab
  chosen_korean: 요압의 형제
  alternatives_korean:
  - 요압의 형
  - 요압의 동생
  - 요압의 형제인
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 구조를 한국어로는 ‘요압의 형제’로 옮기면 간결하면서도 관계 표지가 분명해집니다.
- source_word: בֶּן דּוֹדוֹ
  english_pob_choice: son of Dodo
  chosen_korean: 도도의 아들
  alternatives_korean:
  - 도도의 아들인
  - 도도의 아들
  lexicon: HALOT
  rationale: בֶּן은 직계 계보 표지이므로 ‘아들’로 직역하는 것이 가장 자연스럽고, דּוֹדוֹ는 여기서 인명으로 읽어 ‘도도’로 음역합니다.
- source_word: מִבֵּית לָחֶם
  english_pob_choice: from Bethlehem
  chosen_korean: 베들레헴 출신입니다
  alternatives_korean:
  - 베들레헴에서 왔습니다
  - 베들레헴에서 온 사람입니다
  - 베들레헴 사람입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘베들레헴으로부터/에서’이지만, 한국어에서는 인물의 출신을 표시하는 관용적 표현 ‘출신입니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 목록 서술의 호흡과 인명 구분
  chosen_reading: ‘아삽엘—요압의 형제—, 도도의 아들 엘하난’처럼 대시로 삽입구를 처리해 인명 목록의 흐름을 유지했습니다.
  alternative_readings:
  - ‘아삽엘, 요압의 형제, 도도의 아들 엘하난’
  - ‘아삽엘, 곧 요압의 형제와 도도의 아들 엘하난’
  rationale: 본문은 용사 명단의 항목 나열이므로, 인명 정보는 끊지 않되 과도하게 해설적으로 만들지 않는 것이 적절합니다.
  doctrine_reference: 본문 내 서술 구조 보존 원칙
