  text: ו/יתאו דָּוִ֖יד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בּ֥וֹר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “If only someone would give me water to drink from the well of Bethlehem by the gate!”
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered “well” can also mean “cistern” or “pit,” but here it refers to a source of drinking water.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 갈망하며 말했습니다[a][b]. “누가 베들레헴 성문 곁에 있는 우물에서 나에게 물을 마시게 해 주겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 관용적으로는 “누가 베들레헴 성문 곁 우물에서 나에게 물을 마시게 해 주면 좋겠습니다!”라고 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 בּוֹר는 ‘우물’ 외에도 ‘저수조’나 ‘구덩이’를 뜻할 수 있지만, 여기서는 식수원을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר / ויתאו
  english_pob_choice: longed ... and said
  chosen_korean: 갈망하며 말했습니다
  alternatives_korean:
  - 원하며 말했습니다
  - 간절히 바라며 말했습니다
  lexicon: WLC; HALOT
  rationale: ויתאו의 강한 욕구를 ‘갈망하다’로 옮겨 다윗의 내적 열망을 살리고, 이어지는 발화를 자연스럽게 연결했습니다.
- source_word: מִי יַשְׁקֵנִי מַיִם
  english_pob_choice: Who will give me water to drink
  chosen_korean: 누가 ... 나에게 물을 마시게 해 주겠습니까
  alternatives_korean:
  - 누가 ... 나에게 물을 주겠습니까
  - 누가 ... 내가 물을 마시게 해 주겠습니까
  lexicon: WLC; HALOT
  rationale: 히필형 ישקני의 사역 의미를 ‘마시게 해 주다’로 드러내고, מי의 직접 의문문을 살려 요청의 뉘앙스를 유지했습니다.
- source_word: מִבּוֹר
  english_pob_choice: from the well
  chosen_korean: 우물에서
  alternatives_korean:
  - 샘에서
  - 저수조에서
  - 구덩이에서
  lexicon: WLC; HALOT
  rationale: בּוֹר는 문맥상 식수원으로 기능하므로 ‘우물’이 가장 자연스럽고, POB의 주석적 판단도 반영합니다.
- source_word: בֵּית לֶחֶם ... בַּשָּׁעַר
  english_pob_choice: of Bethlehem that is by the gate
  chosen_korean: 베들레헴 성문 곁에 있는
  alternatives_korean:
  - 베들레헴 성문에 있는
  - 성문 곁의 베들레헴에 있는
  lexicon: WLC; HALOT
  rationale: 관계절 אשר בשער를 위치 설명으로 옮겨, 우물이 ‘성문 곁’에 있다는 공간적 관계를 분명히 했습니다.
theological_decisions:
- issue: 다윗의 말이 실제 요구가 아니라 갈망의 표현인지 여부
  chosen_reading: 직접적인 질문 형식으로 옮기되, 서술 동사는 ‘갈망하다’로 선택해 소망 표현의 성격을 드러냈습니다.
  alternative_readings:
  - “누가 ... 주겠습니까?”만으로 평서적으로 옮김
  - “이런 물을 누가 주면 좋겠습니다”처럼 감탄형으로 완화
  rationale: 본문은 질문형을 유지하지만 실질적으로는 간절한 소망을 드러내므로, 두 요소를 함께 보존하는 것이 원문 효과에 가장 가깝습니다.
  doctrine_reference: 내러티브의 화행과 감정 표현
