  naturalness: ‘삼십인보다 더 존귀했으나, 그 셋에는 이르지 못했습니다’는 군사 명단의 서열 대비를 현대 표준 한국어 합쇼체로 자연스럽고 명료하게 드러냅니다. ‘호위대의 책임자로 세웠습니다’는 직역투인 ‘친위대 위에 세웠습니다’보다 자연스럽습니다.
  terminology: ‘삼십인’과 ‘그 셋’은 본문의 집단 명칭과 서열성을 유지합니다. מִשְׁמַעְתּוֹ는 문맥상 다윗의 호위·경호 조직을 가리킬 수 있으나 범위에 여지가 있으므로 ‘호위대’를 쓰고 각주에서 대안을 밝혔습니다.
