id: 1CH.11.25
reference: 1 Chronicles 11:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן הַ/שְּׁלוֹשִׁ֗ים הִנּ֤/וֹ נִכְבָּד֙ ה֔וּא וְ/אֶל הַ/שְּׁלוֹשָׁ֖ה לֹא בָ֑א וַ/יְשִׂימֵ֥/הוּ דָוִ֖יד עַל מִשְׁמַעְתּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
  footnotes:
  - marker: a
    text: Or 'he did not reach the Three.' The Hebrew literally says 'he did not come to the Three,' using 'come' idiomatically for attaining their rank.
    reason: lexical_alternative
  - marker: b
    text: Or 'over his guard' or 'over those under his command.' The Hebrew term may refer more broadly to a guard unit or charge under David's authority.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 열셋 중에서도 명예로운 사람이었으나, 셋에는 이르지 못했습니다. 그리고 다윗은 그를 자기 친위대 위에 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그는 셋에 이르지 못했다’라고도 옮길 수 있습니다. 히브리어는 ‘오다/이르다’를 관용적으로 써서 서열 도달을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 친위대’는 히브리어 מִשְׁמַעְתּוֹ의 가능한 의미들 가운데 문맥상 가장 자연스러운 해석입니다. 더 넓게는 ‘그의 부하들/그의 지휘 아래 있는 자들’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  english_pob_choice: Among the Thirty
  chosen_korean: 열셋 중에서도
  alternatives_korean:
  - 삼십 명 가운데
  - 그 삼십인 가운데
  lexicon: HALOT
  rationale: מִן이 집단 안의 소속·비교를 나타내므로, 한국어에서는 ‘~중에서도’로 자연스럽게 풀어 그가 ‘그 무리 안에 속한 인물’임을 살렸습니다.
- source_word: נִכְבָּד
  english_pob_choice: honored
  chosen_korean: 명예로운
  alternatives_korean:
  - 존귀한
  - 존경받는
  lexicon: HALOT
  rationale: 군사적 서열 문맥에서 נִכְבָּד의 ‘무게감 있는/존중받는’ 뉘앙스를 살려, 칭찬의 의미가 드러나는 ‘명예로운’으로 옮겼습니다.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  english_pob_choice: but he did not attain to the Three
  chosen_korean: 셋에는 이르지 못했습니다
  alternatives_korean:
  - 셋에 도달하지 못했습니다
  - 셋에 미치지 못했습니다
  lexicon: HALOT
  rationale: בוא + אֶל은 단순 이동보다 지위·등급의 도달을 뜻하므로, ‘이르지 못했습니다’로 서열상 도달 실패를 표현했습니다.
- source_word: וַיְשִׂימֵהוּ דָוִיד עַל מִשְׁמַעְתּוֹ
  english_pob_choice: and David appointed him over his bodyguard
  chosen_korean: 다윗은 그를 자기 친위대 위에 세웠습니다
  alternatives_korean:
  - 다윗은 그를 자기 경호대 위에 세웠습니다
  - 다윗은 그를 자기 경비대의 책임자로 세웠습니다
  lexicon: HALOT
  rationale: מִשְׁמַעַת은 ‘감시/지휘 아래 있는 부대’나 ‘경호 담당’으로 넓게 읽히므로, POB의 ‘bodyguard’를 반영하되 한국어에서는 ‘친위대’로 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘The Three’와 ‘Thirty’의 서열 표현
  chosen_reading: ‘열셋’과 ‘셋’의 군사적 서열 대비를 그대로 살렸습니다.
  alternative_readings:
  - ‘삼십 명’과 ‘세 용사’로 풀어쓰기
  - ‘삼십인’과 ‘세 사람’으로 직역
  rationale: 이 구절은 다윗의 용사들 사이의 등급 차이를 말하므로, 본문이 강조하는 ‘소속은 있으나 최고 서열에는 미치지 못함’을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 1 Chronicles 11:25 군사 명단 문맥
