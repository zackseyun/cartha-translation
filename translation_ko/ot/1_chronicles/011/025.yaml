revisions:
- from: 그는 열셋 중에서도 명예로운 사람이었으나, 셋에는 이르지 못했습니다. 그리고 다윗은 그를 자기 친위대 위에 세웠습니다.[a][b]
  to: 그는 삼십인보다 더 존귀했으나[a], 그 셋에는 이르지 못했습니다. 다윗은 그를 자기 호위대의 책임자로 세웠습니다.[b]
