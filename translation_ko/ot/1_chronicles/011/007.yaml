base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
  footnotes:
  - marker: a
    text: Or 'fortress.' The Hebrew מְצָד refers to a fortified stronghold.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 요새에 살았으므로, 사람들이 그곳을 다윗의 성이라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요새’는 히브리어 מְצָד의 기본 의미를 살린 번역입니다. 이 단어는 ‘성채’나 ‘견고한 요새’의 뜻도 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았
  alternatives_korean:
  - 거주했
  - 머물렀
  - 정착했
  lexicon: HALOT
  rationale: 문맥상 מקום과 함께 쓰인 ישב는 단순히 ‘앉다’가 아니라 ‘살다/거주하다’의 관용적 뜻이므로, 현대 한국어로 자연스러운 ‘살다’로 옮겼습니다.
- source_word: בַּמְצָד
  english_pob_choice: in the stronghold
  chosen_korean: 요새에
  alternatives_korean:
  - 성채에
  - 견고한 요새에
  - 산성에
  lexicon: HALOT
  rationale: מְצָד은 방어가 견고한 군사적 거점을 가리키므로, ‘요새’가 의미를 분명하게 전달하면서도 현대 독자가 이해하기 쉽습니다.
- source_word: קָרְאוּ ל֖וֹ
  english_pob_choice: they called it
  chosen_korean: 사람들이 그곳을 …이라고 불렀습니다
  alternatives_korean:
  - 그들이 그곳을 …이라고 이름 붙였습니다
  - 그곳은 …이라고 불렸습니다
  lexicon: HALOT
  rationale: 히브리어는 능동형이므로 ‘불렸다’보다 주체가 드러나는 ‘불렀습니다’가 원문 구조를 더 잘 반영합니다.
- source_word: עִיר דָּוִיד
  english_pob_choice: the City of David
  chosen_korean: 다윗의 성
  alternatives_korean:
  - 다윗 성
  - 다윗의 도시
  lexicon: HALOT
  rationale: 이는 성경에서 굳어진 지명이므로, 한국어에서 널리 통용되는 ‘다윗의 성’으로 옮겼습니다.
