base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
  footnotes:
  - marker: a
    text: Hebrew אֲרִיאֵל מוֹאָב is uncertain. It may mean 'the two sons of Ariel of Moab,' 'the two Ariels of Moab,' or 'the two lion-like heroes of Moab.'
    reason: alternative_reading
translation:
  language: ko
  text: 브나야는 여호야다의 아들, 곧 힘센 사람의 아들이며 많은 일을 한 사람으로서 가드스엘 출신이었습니다. 그는 모압의 두 아리엘을 쳐 죽였습니다. 또 그는 내려가서 눈 내린 날 구덩이 한가운데 있는 사자를 쳐 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲרִיאֵל מוֹאָב은 뜻이 불확실합니다. ‘모압의 두 아리엘’, ‘모압의 두 영웅’, ‘모압의 두 사자 같은 사람’ 등으로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנָיָה בֶן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 브나야는 여호야다의 아들
  alternatives_korean:
  - 브나야는 여호야다의 아들
  lexicon: 표준 음역
  rationale: 인명은 현대 외래어 표기 관행에 따라 음역했고, 히브리어 계보 구조를 자연스럽게 살려 주어 앞에 주어를 배치했습니다.
- source_word: אִישׁ חַיִל רַב פְּעָלִים
  english_pob_choice: a mighty man, a man of many deeds
  chosen_korean: 힘센 사람의 아들이며 많은 일을 한 사람
  alternatives_korean:
  - 용사의 아들이며 많은 업적을 이룬 사람
  - 강한 사람의 아들이며 많은 일을 한 사람
  lexicon: HALOT
  rationale: אִישׁ חַיִל은 단순히 ‘힘센’보다 전투적 역량이 있는 유력한 사람을 가리키므로 ‘힘센 사람’으로 옮겼고, רַב פְּעָלִים은 ‘많은 일을 한 사람’으로 풀어 영문 POB의 ‘man of many deeds’에 대응시켰습니다.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  english_pob_choice: the two sons of Ariel of Moab
  chosen_korean: 모압의 두 아리엘
  alternatives_korean:
  - 모압의 두 아리엘
  - 모압의 두 아리엘의 아들들
  - 모압의 두 사자 같은 용사
  lexicon: HALOT
  rationale: אֲרִיאֵל은 여기서 고유명사인지 묘사어인지 불확실하므로, 영문 POB의 번역 원리를 따르되 한국어에서는 과도한 설명을 줄여 ‘모압의 두 아리엘’로 보존했습니다.
- source_word: בְּתוֹךְ הַבּוֹר
  english_pob_choice: in the midst of a pit
  chosen_korean: 구덩이 한가운데
  alternatives_korean:
  - 구덩이 안
  - 구덩이 한가운데
  lexicon: HALOT
  rationale: ‘בְּתוֹךְ’의 내부성을 살리면서도 한국어로는 자연스러운 위치 표현인 ‘한가운데’를 택했습니다.
- source_word: בְּיוֹם הַשָּׁלֶג
  english_pob_choice: on a snowy day
  chosen_korean: 눈 내린 날
  alternatives_korean:
  - 눈 내린 날
  - 눈이 온 날
  - 눈 오는 날
  lexicon: HALOT
  rationale: 직역보다 상황성을 잘 드러내는 현대 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: 아리엘(אֲרִיאֵל)의 의미가 불확실한 구절 처리
  chosen_reading: 본문에는 ‘모압의 두 아리엘’로 두고, 의미 확정은 하지 않았습니다.
  alternative_readings:
  - ‘모압의 두 영웅’
  - ‘모압의 두 사자 같은 사람’
  - ‘모압의 두 아리엘의 아들들’
  rationale: 히브리어 자체가 모호하므로 본문에서 한 가지 해석을 단정하기보다, 독자가 원문 불확실성을 인지하도록 보존하는 것이 더 충실합니다.
  doctrine_reference: 원문 불확실성 보존 원칙
- issue: נכה의 폭력 동사 강도
  chosen_reading: 두 경우 모두 ‘쳐 죽였습니다’로 옮겼습니다.
  alternative_readings:
  - 쳤습니다
  - 쳐서 쓰러뜨렸습니다
  - 죽였습니다
  rationale: 이 문맥은 영웅 목록으로, 단순한 타격보다 치명적 제압을 가리키는 것으로 읽히므로 한국어에서도 결과를 분명히 드러냈습니다.
  doctrine_reference: 서사 문맥의 어휘 강도
