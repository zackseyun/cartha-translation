  text: Hezro the Carmelite[a], Naarai son of Ezbai[b];
  footnotes:
  - marker: a
    text: Or 'the man from Carmel.' The Hebrew gentilic means a person belonging to Carmel.
    reason: lexical_alternative
  - marker: b
    text: 'In the parallel list at 2 Samuel 23:35, the corresponding names differ: ''Hezrai the Carmelite, Paarai the Arbite.'' Chronicles preserves a distinct form here.'
    reason: cross_reference
translation:
  language: ko
  text: 헤스로, 가르멜 사람[a], 에즈바이의 아들 나아라이[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르멜 출신 사람’. 히브리어의 지명형 형용사는 가르멜에 속한 사람을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 평행본문인 2사무엘 23:35에서는 대응 이름들이 ‘헤즈라이 가르멜 사람, 아르바 사람 파아라이’로 다르게 전해집니다. 역대기는 여기서 별도의 형태를 보존합니다.
    reason: cross_reference
