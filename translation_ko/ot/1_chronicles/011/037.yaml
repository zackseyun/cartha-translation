    issue: 본문의 쉼표 배열이 수식 관계와 명단의 두 항목을 불분명하게 합니다.
    rationale: ‘헤스로, 가르멜 사람, 에즈바이의 아들 나아라이’는 ‘가르멜 사람’이 헤스로를 수식한다는 관계가 한국어에서 매끄럽게 드러나지 않습니다. 히브리어의 병렬 명단 구조를 ‘갈멜 사람 헤스로와 에즈바이의 아들 나아라이’로 명시하는 것이 안전합니다.
  - severity: low
