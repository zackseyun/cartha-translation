  - 헤즈라이
  lexicon: 고유명사 음역
  rationale: 역대기의 히브리어 형태를 따라 고유명사를 음역했습니다. 병행본문의 다른 형태와 구별되지만, 본문의 읽기를 우선해 옮겼습니다.
