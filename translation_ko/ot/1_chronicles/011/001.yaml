  alternative_readings:
  - ‘우리는 왕과 한 피붙이입니다’처럼 의역
  - ‘우리는 왕의 친족입니다’로 완화
  rationale: 본문의 관용구를 완화하면 이스라엘의 통합 주장과 다윗의 정통성 인정이 약해지므로, 가능한 한 원문 이미지를 보존했습니다.
