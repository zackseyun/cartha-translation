  source_fidelity: 히브리어 חֶבְרוֹנָה는 헤브론을 향한 이동을 나타내지만, 문맥상 다윗이 헤브론에 있었고 온 이스라엘이 그에게 모여든 상황입니다. 초안의 ‘다윗에게 헤브론으로’는 두 목적어/방향어가 병렬된 듯하여 한국어 문장 구조상 부자연스럽고 의미 관계가 불명확합니다. ‘왕의 뼈요 왕의 살’은 원문의 직접 호칭을 다소 풀어 쓴 것이나, 다윗에게 바치는 공적 발화의 높임말로 허용 가능한 범위이며 관용구의 이미지를 보존합니다.
