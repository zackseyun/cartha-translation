theological_decisions:
- issue: 공동체의 자기정체성 표현
  chosen_reading: ‘우리는 왕의 뼈요 왕의 살입니다’는 혈연 관계를 넘어 동일한 공동체·동족 의식을 드러내는 직설적 표현으로 유지했습니다.
  alternative_readings:
  - ‘우리는 왕과 한 피붙이입니다’처럼 의역
  - ‘우리는 왕의 친족입니다’로 완화
  rationale: 본문의 관용구를 완화하면 이스라엘의 통합 주장과 다윗의 정통성 인정이 약해지므로, 가능한 한 원문 이미지를 보존했습니다.
  doctrine_reference: 사무엘하 5:1; 창세기 29:14
