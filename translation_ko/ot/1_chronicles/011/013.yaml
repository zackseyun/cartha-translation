    rationale: 각주 b는 ‘블레셋 사람들 앞에서 도망쳤다’라는 표현의 번역 대안을 설명하지만, 본문에서는 ‘보리로 가득했고’에 붙어 있습니다. 도피 표현에 표지를 붙여야 합니다.
