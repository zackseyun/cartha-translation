- from: 그는 다윗과 함께 파스-담밈[a]에 있었는데, 블레셋 사람들이 거기 모여 싸우려 했습니다. 그런데 그 밭의 밭두둑은 보리로 가득했고[b], 백성은 블레셋 사람들 앞에서 도망쳤습니다.
  to: 그는 다윗과 함께 파스담밈[a]에 있었는데, 블레셋 사람들이 싸움을 위해 그곳에 모였습니다. 그 밭의 한 구획은 보리로 가득했고, 백성은 블레셋 사람들을 피해 달아났습니다[b].
  rationale: 전투를 위한 집결이라는 원문의 완료된 상황을 명확히 하고, 밭의 ‘구획’이라는 농경지 의미를 바로잡았습니다. 또한 히브리어 도피 관용구는 자연스러운 본문 번역과 직역 각주를 통해 모두 보존했으며, 각주 표지를 해당 표현으로 옮겼습니다.
