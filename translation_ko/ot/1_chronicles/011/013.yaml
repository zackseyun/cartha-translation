reference: 1 Chronicles 11:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֽוּא הָיָ֨ה עִם דָּוִ֜יד בַּ/פַּ֣ס דַּמִּ֗ים וְ/הַ/פְּלִשְׁתִּים֙ נֶאֱסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַ/תְּהִ֛י חֶלְקַ֥ת הַ/שָּׂדֶ֖ה מְלֵאָ֣ה שְׂעוֹרִ֑ים וְ/הָ/עָ֥ם נָ֖סוּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
  footnotes:
  - marker: a
    text: Pas-dammim is a place name; compare the parallel account in 1 Samuel 17:1, which names the site Ephes-dammim.
    reason: cross_reference
  - marker: b
    text: Or 'fled before the Philistines.' The Hebrew idiom is literally 'fled from before the Philistines.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다윗과 함께 파스담밈[a]에 있었는데, 블레셋 사람들이 싸움을 위해 그곳에 모였습니다. 그 밭의 한 구획은 보리로 가득했고, 백성은 블레셋 사람들을 피해 달아났습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 파스담밈은 지명입니다. 1사무엘 17:1의 평행 본문에서는 이곳을 에베스담밈이라고 부릅니다.
    reason: cross_reference
  - marker: b
    text: 직역하면 ‘블레셋 사람들 앞에서 달아났습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  english_pob_choice: at Pas-dammim
  chosen_korean: 파스-담밈
  alternatives_korean:
  - 에셉스-담밈
  - 피흘림의 경계
  lexicon: HALOT
  rationale: 고유 지명으로 처리한 영어 POB의 판단을 따라 한국어도 음역으로 유지했습니다. 1사무엘 17:1의 평행본문과의 관련성을 주석으로 보완했습니다.
- source_word: נֶאֱסְפוּ
  english_pob_choice: had gathered
  chosen_korean: 모여
  alternatives_korean:
  - 집결하여
  - 함께 모였는데
  lexicon: HALOT
  rationale: אסף의 집합 의미를 살려 자연스럽게 '모여'로 옮겼습니다.
- source_word: חֶלְקַת הַשָּׂדֶה
  english_pob_choice: the plot of the field
  chosen_korean: 그 밭의 밭두둑
  alternatives_korean:
  - 그 밭의 한 구획
  - 그 밭의 한 부분
  lexicon: HALOT
  rationale: חלקה의 '구획/몫' 의미를 살리되, 여기서는 실제 농경지의 한 구역을 가리키므로 한국어로는 밭의 구획을 드러내는 표현을 택했습니다. 다만 현대 독자가 형상화를 이해하도록 최소한의 설명적 조정을 했습니다.
- source_word: מְלֵאָה שְׂעוֹרִים
  english_pob_choice: was full of barley
  chosen_korean: 보리로 가득했고
  alternatives_korean:
  - 보리로 가득 차 있었고
  - 보리로 가득했습니다
  lexicon: HALOT
  rationale: שְׂעוֹרִים을 일반 곡물로 완화하지 않고 '보리'로 직접 옮겼습니다. 전경의 농작물 상태를 유지하기 위해 서술형으로 처리했습니다.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  english_pob_choice: fled from before the Philistines
  chosen_korean: 블레셋 사람들 앞에서 도망쳤습니다
  alternatives_korean:
  - 블레셋 사람들 앞에서 물러났습니다
  - 블레셋 사람들 앞에서 달아났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 뉘앙스(‘앞에서/눈앞에서’)를 유지하되, 한국어에서는 자연스러운 전투 서술인 '도망쳤습니다'로 옮겼습니다.
theological_decisions:
- issue: 전투 서술에서 주어 'people'의 범위
  chosen_reading: '''백성''으로 옮겨 이스라엘 전사들만으로 좁히지 않았습니다.'
  alternative_readings:
  - '''병사들'''
  - '''군사들'''
  rationale: עם은 문맥상 전투 집단을 가리킬 수 있지만, 원문 자체는 더 넓은 집합 명사를 사용하므로 범위를 과도하게 축소하지 않았습니다.
  doctrine_reference: 문맥 충실성과 의미 범위 보존
