id: 1CH.11.23
reference: 1 Chronicles 11:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֽוּא הִכָּה֩ אֶת הָ/אִ֨ישׁ הַ/מִּצְרִ֜י אִ֥ישׁ מִדָּ֣ה חָמֵ֣שׁ בָּ/אַמָּ֗ה וּ/בְ/יַ֨ד הַ/מִּצְרִ֤י חֲנִית֙ כִּ/מְנ֣וֹר אֹרְגִ֔ים וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
  footnotes:
  - marker: a
    text: Or, 'a man of great stature, five cubits tall.' The Hebrew phrase literally reads 'a man of measure.'
    reason: lexical_alternative
  - marker: b
    text: A cubit was an ancient unit of length roughly equivalent to the distance from the elbow to the fingertips.
    reason: cultural_note
  - marker: c
    text: Or, 'with a club' or 'with a rod' for 'with a staff.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 키가 다섯 규빗[b]이나 되는 이집트 사람[a]을 쳐서 쓰러뜨렸습니다. 그 이집트 사람의 손에는 베틀의 들보 같은 창이 있었습니다. 그는 막대기[c]를 들고 그에게 내려가, 그 이집트 사람의 손에서 창을 빼앗아 그 이집트 사람의 창으로 그를 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘측량의 사람’입니다. 문맥상 유난히 큰 체구의 사람을 가리키는 표현으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 규빗은 고대의 길이 단위로, 대략 팔꿈치에서 손끝까지의 길이입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 ‘셰베트’는 문맥에 따라 ‘지팡이’, ‘막대기’, 또는 ‘몽둥이’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא הִכָּה
  english_pob_choice: And he struck down
  chosen_korean: 그가 ... 쳐 죽였습니다
  alternatives_korean:
  - 그가 ... 쳐서 쓰러뜨렸습니다
  - 그가 ... 쳤습니다
  lexicon: HALOT
  rationale: נכה의 ‘치다’ 의미를 살리면서, 전투 문맥에서 이어지는 죽음의 결과를 자연스럽게 드러내기 위해 ‘쳐 죽였습니다’를 택했습니다.
- source_word: אֶת הָאִישׁ הַמִּצְרִי
  english_pob_choice: the Egyptian
  chosen_korean: 이집트 사람
  alternatives_korean:
  - 이집트인
  - 그 이집트 사람
  lexicon: HALOT
  rationale: 영어 POB처럼 불필요한 ‘남자’를 반복하지 않고, 문맥상 특정 대상을 가리키는 ‘이집트 사람’으로 옮겼습니다.
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  english_pob_choice: a man five cubits tall
  chosen_korean: 키가 다섯 규빗이나 되었고
  alternatives_korean:
  - 다섯 규빗 키의 사람이었고
  - 다섯 규빗쯤 되는 큰 체구였고
  lexicon: HALOT
  rationale: ‘אִישׁ מִדָּה’의 특이한 표현은 영어 POB의 해석을 따라 키의 과장된 크기로 풀어 옮기되, 수치 표현은 보존했습니다.
- source_word: כִּמְנוֹר אֹרְגִים
  english_pob_choice: like a weaver’s beam
  chosen_korean: 베틀 채만 한
  alternatives_korean:
  - 직조공의 들보 같은
  - 베틀의 들보 같은
  lexicon: HALOT
  rationale: 직조 도구의 굵기를 한국어에서 자연스럽게 전달하기 위해 ‘베틀 채’로 옮겼고, 비교 의미의 ‘만 한’으로 형상을 살렸습니다.
- source_word: בַּשָּׁבֶט
  english_pob_choice: with a staff
  chosen_korean: 막대기를 들고
  alternatives_korean:
  - 지팡이를 들고
  - 몽둥이를 들고
  lexicon: HALOT
  rationale: שבט의 범위가 넓지만, 여기서는 대조되는 무기와의 대비를 살리기 위해 중립적인 ‘막대기’를 택했습니다.
- source_word: וַיִּגְזֹל אֶת הַחֲנִית מִיַּד הַמִּצְרִי
  english_pob_choice: snatched the spear from the Egyptian’s hand
  chosen_korean: 그 이집트 사람의 손에서 창을 빼앗아
  alternatives_korean:
  - 그 이집트 사람의 손에서 창을 낚아채어
  - 그의 손에서 창을 빼앗아
  lexicon: HALOT
  rationale: וַיִּגְזֹל의 강한 탈취 뉘앙스를 ‘빼앗아’로 살렸고, 전투 장면의 긴박함을 유지했습니다.
- source_word: בַּחֲנִיתוֹ
  english_pob_choice: with his own spear
  chosen_korean: 그의 창으로
  alternatives_korean:
  - 자기 창으로
  - 그 창으로
  lexicon: HALOT
  rationale: 소유격이 가리키는 대상이 바로 방금 빼앗은 창이라는 점을 문맥상 자연스럽게 드러내어, 영어 POB의 설명을 과도하게 부연하지 않았습니다.
