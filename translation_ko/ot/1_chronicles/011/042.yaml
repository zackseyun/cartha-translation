  text: עֲדִינָ֨א בֶן שִׁיזָ֜א הָ/רֽאוּבֵנִ֗י רֹ֛אשׁ לָ/רֽאוּבֵנִ֖י וְ/עָלָ֥י/ו שְׁלוֹשִֽׁים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/042.yaml
  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
  footnotes:
  - marker: a
    text: Or, more literally, 'and over him were thirty.' The Hebrew preposition can be read more literally, but in this military list it likely means thirty men were attached to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤 사람인 시사의 아들 아디나는 르우벤 사람들의 수장이었으며, 그와 함께한 이들은 서른 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 위에 서른 명이 있었다’입니다. 그러나 이 군사 명단의 문맥에서는 보통 그에게 배속된 서른 명을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  english_pob_choice: Adina
  chosen_korean: 아디나
  alternatives_korean:
  - 아디나
  lexicon: 고유명사
  rationale: 고유 인명은 음역으로 처리해 히브리어 이름을 보존했습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 시사의 아들이고
  alternatives_korean:
  - 시사의 아들
  - 시사의 자손
  lexicon: HALOT
  rationale: 족보·전사 목록 문맥에서 בֶן은 직계 관계를 자연스럽게 나타내므로 ‘아들이고’로 옮겼습니다.
- source_word: הָרְאוּבֵנִי / לָרְאוּבֵנִי
  english_pob_choice: the Reubenite / of the Reubenites
  chosen_korean: 르우벤 사람의 우두머리
  alternatives_korean:
  - 르우벤 사람
  - 르우벤 지파의
  lexicon: HALOT
  rationale: 두 표현이 함께 르우벤 지파 소속과 지파 안에서의 수장을 나타내므로, ‘르우벤 사람의 우두머리’로 압축해 관계를 분명히 했습니다.
- source_word: רֹאשׁ
  english_pob_choice: a chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 장
  lexicon: HALOT
  rationale: 전사 명단의 직함으로서 머리보다 비유적 지위가 핵심이므로, 현대 한국어에서 직분감을 살리는 ‘우두머리’를 택했습니다.
- source_word: וְעָלָיו שְׁלוֹשִׁים
  english_pob_choice: and with him were thirty
  chosen_korean: 그와 함께한 사람은 서른 명이었습니다
  alternatives_korean:
  - 그에게는 서른 명이 있었습니다
  - 그 위에는 서른 명이 있었습니다
  lexicon: HALOT
  rationale: 영문 POB가 이 구절을 ‘그와 함께한’ 의미로 읽은 점을 반영해, 문맥상 전투에 배속된 인원이라는 뜻을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: וְעָלָיו의 관계를 문자적으로 ‘그 위에/그에게’로 둘지, 관용적으로 풀지
  chosen_reading: 군사 명단 문맥에 맞게 ‘그와 함께한 사람은’으로 옮겼습니다.
  alternative_readings:
  - 그 위에는 서른 명이 있었습니다
  - 그에게는 서른 명이 있었습니다
  rationale: 히브리어 על의 직역은 가능하지만, 영문 POB의 주석처럼 이 명단에서는 그에게 소속된/배속된 병력을 가리키는 것으로 읽는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥 우선의 의미역 원칙
