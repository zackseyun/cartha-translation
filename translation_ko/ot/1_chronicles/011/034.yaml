  rationale: 히브리어 복수 구성형을 반영해 직역적으로는 ‘아들들’이지만, 이 절의 계보·명단 문맥에서는 소유/속함을 나타내는 관용으로 읽혀 한국어에서는 자연스럽게 이름을 앞세운 호칭 구조로 옮겼습니다.
- source_word: הָשֵׁם
  english_pob_choice: Hashem
  chosen_korean: 하셈
