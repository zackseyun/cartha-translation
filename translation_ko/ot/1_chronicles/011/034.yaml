  text: the sons of Hashem the Gizonite[a], Jonathan son of Shagee the Hararite;
  footnotes:
  - marker: a
    text: The Hebrew text reads 'the sons of Hashem the Gizonite.' The parallel list in 2 Samuel 23:32 has a different name sequence, often reflected in translations or reconstructions.
