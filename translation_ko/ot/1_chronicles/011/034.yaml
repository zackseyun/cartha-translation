  rationale: 고유명사는 음역하는 것이 적절하며, 영어 POB의 Hashem을 한국어 외래어 표기 관행에 맞춰 ‘하셈’으로 옮겼습니다.
- source_word: הַגִּזוֹנִי
  english_pob_choice: the Gizonite
  chosen_korean: 기손 사람
  alternatives_korean:
