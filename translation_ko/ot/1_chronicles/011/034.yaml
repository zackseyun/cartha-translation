  - 기조니 사람
  lexicon: HALOT
  rationale: 지명/출신을 나타내는 형용사적 민족명사는 한국어 성경에서 흔히 ‘~사람’으로 옮겨 출신 표지를 유지했습니다.
- source_word: הַהֲרָרִי
  english_pob_choice: the Hararite
  chosen_korean: 하라리 사람
  alternatives_korean:
  - 하라 사람
  - 하라리
  lexicon: HALOT
  rationale: 이 역시 출신을 나타내는 민족명사이므로 고유명사 음역과 ‘사람’을 결합해 계보 목록의 기능을 살렸습니다.
theological_decisions:
- issue: 2사무엘 23:32의 평행본문과 다른 인명 배열
  chosen_reading: 열왕/용사 명단의 사본 차이를 조화시키지 않고 역대기의 마소라 본문에 따라 하셈과 요나단을 그대로 옮겼습니다.
  alternative_readings:
  - 평행본문을 따라 이름 순서를 재구성하는 읽기
  - 본절을 2사무엘 23:32와 맞춰 수정하는 읽기
  rationale: 영어 POB도 본문의 마소라형을 유지하고 평행본문 차이는 각주로 처리하므로, 본문 번역에서도 본절의 기록 자체를 보존하는 것이 사본 증거를 가장 투명하게 반영합니다.
  doctrine_reference: 본문 비평 및 평행본문 처리 원칙
