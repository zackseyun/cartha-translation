  text: אֱלִיאֵל֙ הַֽ/מַּחֲוִ֔ים וִ/ירִיבַ֥י וְ/יוֹשַׁוְיָ֖ה בְּנֵ֣י אֶלְנָ֑עַם וְ/יִתְמָ֖ה הַ/מּוֹאָבִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
  footnotes:
  - marker: a
    text: Hebrew Mahavite; the exact place-name or clan designation behind this gentilic is uncertain.
    reason: cultural_note
  - marker: b
    text: Or 'Jaribai' for Jeribai, and 'Jithmah' for Ithmah; these are transliteration alternatives for the Hebrew names.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리엘은 마하비 사람이며[a], 여리바이와 요사뱌는 엘나암의 아들들이고[b], 이드마는 모압 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 Mahavite에 해당하는 정확한 지명이나 씨족 명칭은 확실하지 않습니다.
    reason: cultural_note
  - marker: b
    text: 여리바이는 Jaribai, 이드마는 Jithmah로도 옮길 수 있는 음역 변이입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחֲוִים
  english_pob_choice: the Mahavite
  chosen_korean: 마하비 사람
  alternatives_korean:
  - 마하와 사람
  - 마하위 사람
  lexicon: HALOT
  rationale: 정확한 지명 확인이 어려운 친족·출신 표지이므로, 영어 POB의 transliterated gentilic을 따라 한국어도 음역형으로 유지했습니다.
- source_word: וִירִיבַי
  english_pob_choice: Jeribai
  chosen_korean: 여리바이
  alternatives_korean:
  - 자리바이
  lexicon: HALOT
  rationale: 고유명사는 음역하고, 한국어에서 j/ y 계열 발음을 반영해 읽기 쉬운 형태로 옮겼습니다.
- source_word: בְּנֵי אֶלְנָעַם
  english_pob_choice: the sons of Elnaam
  chosen_korean: 엘나암의 아들들
  alternatives_korean:
  - 엘나암의 아들
  lexicon: HALOT
  rationale: 복수형 בְּנֵי를 자연스럽게 반영해 두 사람을 엘나암의 아들들로 표시했습니다.
- source_word: הַמּוֹאָבִי
  english_pob_choice: the Moabite
  chosen_korean: 모압 사람
  alternatives_korean:
  - 모압인
  - 모압 사람
  lexicon: HALOT
  rationale: 지파/출신 표지인 gentilic이므로 한국어에서는 전통적 지명형 표현보다 ‘모압 사람’이 자연스럽고, 기사와의 결합도 유지합니다.
theological_decisions:
- issue: 고유명사와 출신표지의 처리
  chosen_reading: 사람 이름은 음역하고, 민족·출신 표지는 직역해 인물 목록의 사실 정보를 그대로 드러냈습니다.
  alternative_readings:
  - 전체를 더 의역해 인명까지 설명적으로 풀어쓰기
  - 출신 표지를 모두 음역해 형태만 보존하기
  rationale: 이 절은 신학적 해석보다 족보적 식별이 핵심이므로, 원문이 가진 명단의 식별 기능을 훼손하지 않는 방향을 택했습니다.
  doctrine_reference: 본문은 교리 쟁점이 크지 않은 족보/명단 본문입니다.
