  - 하로르 사람
  lexicon: 민족/출신 표지
  rationale: 원문은 איש류 출신 표지에 해당하는 형용사적 지시이므로 ‘사람’으로 옮겨 지명/씨족 소속을 자연스럽게 나타냈습니다. 사무엘 병행구의 다른 형식은 각주로 남깁니다.
