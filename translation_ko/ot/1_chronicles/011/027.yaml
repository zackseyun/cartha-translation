  lexicon: 고유명사 음역
  rationale: 고유명사는 음역을 유지해야 하므로, 영어 POB의 Helez에 맞춰 한국어로 음역했습니다.
- source_word: פְּלוֹנִי
  english_pob_choice: the Pelonite
  chosen_korean: 펠로니 사람
  alternatives_korean:
  - 펠로니족
  - 펠론 사람
  lexicon: 민족/출신 표지
  rationale: 원문의 관사 포함 형용사형을 출신 표지로 살려 ‘사람’으로 옮겼습니다. 병행구의 Paltite는 본문에 섞지 않고 각주로 처리합니다.
