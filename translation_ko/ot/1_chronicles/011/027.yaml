  yaml_path: translation/ot/1_chronicles/011/027.yaml
  text: Shammoth the Harorite[a], Helez the Pelonite[b];
  footnotes:
  - marker: a
    text: In the parallel list at 2 Samuel 23:26, the designation is 'the Harodite.' Chronicles here reads 'the Harorite.'
