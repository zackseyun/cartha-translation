translation:
  language: ko
  text: 하로리 사람[a] 샴못과 펠로니 사람[b] 헬레츠입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 병행구인 사무엘하 23:26에서는 이 칭호가 ‘하롯 사람’으로 나옵니다. 역대기 본문은 ‘하로리 사람’으로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 병행구인 사무엘하 23:26에서는 헬레츠를 ‘팔티 사람’으로 부릅니다. 역대기 본문은 ‘펠로니 사람’으로 읽습니다.
    reason: textual_variant
