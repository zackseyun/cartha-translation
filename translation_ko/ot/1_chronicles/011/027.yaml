  - marker: b
    text: In the parallel list at 2 Samuel 23:26, Helez is called 'the Paltite.' Chronicles here reads 'the Pelonite.'
    reason: textual_variant
translation:
  language: ko
  text: 스마욧은 하로리 사람이며, 헬렛은 펠로니 사람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 병행구 사무엘하 23:26에는 이 칭호가 ‘하로드 사람’으로 나옵니다. 역대기 본문은 ‘하로리 사람’으로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 병행구 사무엘하 23:26에는 헬렛이 ‘팔티 사람’으로 나옵니다. 역대기 본문은 ‘펠로니 사람’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁמּוֹת
  english_pob_choice: Shammoth
  chosen_korean: 스마욧
  alternatives_korean:
  - 샴못
  - 샤못
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 뜻풀이하지 않고 음역하는 것이 원문을 가장 직접적으로 드러냅니다. 영어 POB의 Shammoth에 대응해 한국어로는 표준적인 음역형을 택했습니다.
- source_word: הֲרוֹרִי
  english_pob_choice: the Harorite
  chosen_korean: 하로리 사람
  alternatives_korean:
