  yaml_path: translation/ot/1_chronicles/011/044.yaml
  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
  footnotes:
  - marker: a
    text: Or 'the Ashtarothite.' The gentilic likely refers to a man from Ashtaroth/Ashteroth.
    reason: lexical_alternative
  - marker: b
    text: '''Jeuel'' could also be rendered ''Jeiel,'' reflecting a common variant in English transliteration traditions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야[a]와 아스다롯 사람[b] 시마와 여이엘, 곧 호담의 아들들인 아로엘 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “아스다롯 사람”은 영어 본문의 “Ashterathite”에 해당하는 지명 유래 민족형입니다.
    reason: lexical_alternative
  - marker: b
    text: “아스다롯 사람”은 본문의 민족형 표현으로, 영어 POB의 “the Ashterathite”에 대응합니다.
    reason: source_note
lexical_decisions:
- source_word: עֻזִיָּ֖א
