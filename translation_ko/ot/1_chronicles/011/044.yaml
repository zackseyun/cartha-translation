  text: 아스다롯 사람[a] 웃시야와 아로엘 사람 호담의 아들들인 시마와 여우엘[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아스다랏 사람.” 히브리어 주민명은 아스다롯/아스다랏으로 전사될 수 있는 지명에서 유래합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “여이엘.” 영어 음역 전통에서는 Jeiel로도 표기합니다.
    reason: lexical_alternative
