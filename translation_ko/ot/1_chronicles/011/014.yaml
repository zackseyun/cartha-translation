lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  english_pob_choice: they took their stand
  chosen_korean: 자리를 잡고
  alternatives_korean:
  - 그 자리에 섰고
  - 굳게 버티고
  lexicon: HALOT
  rationale: 전투 맥락에서 의도적으로 위치를 정해 맞서는 동작을 자연스러운 합쇼체로 살렸습니다.
- source_word: בְּתוֹךְ הַחֶלְקָה
