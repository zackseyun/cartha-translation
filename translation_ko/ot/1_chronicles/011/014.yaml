  source_fidelity: 전반적으로 히브리어의 사건 전개와 목적어(땅)를 충실히 옮겼습니다. 다만 נכה는 전투에서 치명적 결과를 포함할 수 있으나 문법적으로 반드시 ‘죽이다’를 뜻하지는 않으므로, 본문에서는 결과를 과도하게 특정하지 않는 표현이 더 안전합니다. יהוה의 절대적 구원 행위와 ‘큰 구원’도 유지되어야 합니다.
