  rationale: חלקה를 농경지의 ‘구획/땅’으로 보고, תוך의 중심 의미를 간결하게 옮겼습니다.
- source_word: וַיַּצִּילוּהָ
  english_pob_choice: delivered it
  chosen_korean: 그것을 구해 냈으며
  alternatives_korean:
  - 그것을 건져 냈으며
  - 그것을 구원했으며
  lexicon: HALOT
  rationale: 목적어가 땅이므로 ‘구해 내다’가 단순한 개인 구출보다 점유 위기에서 건져 내는 뜻을 잘 드러냅니다.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  english_pob_choice: they struck down the Philistines
  chosen_korean: 블레셋 사람들을 쳐 죽였고
  alternatives_korean:
  - 블레셋 사람들을 쳐부수었고
  - 블레셋 사람들을 공격했고
  lexicon: HALOT
  rationale: נכה의 전투적 결과를 약화시키지 않도록, 패배 이상의 치명적 타격을 분명히 했습니다.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  english_pob_choice: Yahweh saved by a great victory
  chosen_korean: 야훼께서 큰 구원을 이루셨습니다
  alternatives_korean:
  - 야훼께서 큰 승리를 주셨습니다
  - 야훼께서 큰 구출을 베푸셨습니다
  lexicon: HALOT
  rationale: ישׁע/תשועה의 어근 연결을 살려 ‘구원’을 택했고, 군사적 문맥은 ‘큰’으로 수식해 보완했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기 이름은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭으로 대체하지 않았습니다.
theological_decisions:
- issue: תְּשׁוּעָה의 의미 범위
  chosen_reading: ‘큰 구원’을 택하되, 전투 맥락에서 구체적으로는 큰 승리의 결과를 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 큰 승리
  - 큰 구출
  rationale: 문맥은 군사적 승리를 말하지만, 히브리어 어근과 서술의 신학적 울림을 유지하려면 ‘구원’이 더 넓고 원문에 가깝습니다.
  doctrine_reference: 'POB terminology: תְּשׁוּעָה / salvation-victory overlap'
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 고유한 신적 이름을 보존하여, 일반 호칭으로 평준화하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
