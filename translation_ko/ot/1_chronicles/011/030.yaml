lexical_decisions:
- source_word: מַהְרַי
  english_pob_choice: Maharai
  chosen_korean: 마하라이
  alternatives_korean:
  - 마라이
  - 마하라이
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 원문 인명 표지를 가장 직접적으로 반영하므로, 영어 POB의 Maharai에 맞춰 마하라이로 옮겼습니다.
- source_word: הַנְּטֹפָתִי / הַנְּטוֹפָתִי
  english_pob_choice: the Netophathite
  chosen_korean: 마하래 사람
  alternatives_korean:
  - 느도바 사람
  - 느도바 출신
  lexicon: HALOT
  rationale: 영어의 -ite를 한국어에서는 지명 유래를 드러내는 ‘~사람’으로 풀어, Netophathite의 민족·출신 표지를 자연스럽게 살렸습니다.
- source_word: חֵלֶד
  english_pob_choice: Heled
  chosen_korean: 헬렛
  alternatives_korean:
  - 헤레드
  - 헬레드
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리하되, 한국어 표기 관습상 자음군을 자연스럽게 반영해 헬렛으로 옮겼습니다.
- source_word: בֶּן בַּעֲנָה
  english_pob_choice: son of Baanah
  chosen_korean: 브에난의 아들
  alternatives_korean:
  - 바아나의 아들
  - 바에나의 아들
  lexicon: HALOT
  rationale: בן은 친족관계를 나타내는 표준적인 ‘~의 아들’로 옮겼고, 본문 인명 Baanah는 음역을 유지했습니다.
