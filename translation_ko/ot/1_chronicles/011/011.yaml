source:
  edition: WLC
  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
  footnotes:
  - marker: a
    text: Or 'he raised/brandished his spear against three hundred slain at one time.' The Hebrew idiom is compact, and English renderings vary in how literally they express the spear action and the single occasion.
    reason: lexical_alternative
translation:
  language: ko
  text: 다음은 다윗에게 속한 용사들의 수효입니다. 학모니의 아들 야소브암은 삼십 명의 우두머리였습니다. 그는 한 번에 창을 휘둘러 삼백 명을 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 번에 삼백 명을 향해 창을 들어 올렸다/휘둘렀다’라고 옮길 수 있습니다. 히브리어는 창의 동작과 그 결과를 압축하여 표현하므로, 창을 ‘들다’, ‘휘두르다’ 또는 ‘사용하다’로 옮기는 차이가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  english_pob_choice: the number of
  chosen_korean: 수효
  alternatives_korean:
  - 숫자
  - 명단
  lexicon: HALOT
  rationale: 문맥상 용사들의 목록을 여는 표현이므로, ‘수효’가 히브리어의 ‘수/계수’ 의미를 자연스럽게 살리면서 한국어로도 매끄럽습니다.
- source_word: הַגִּבֹּרִים
  english_pob_choice: mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 힘센 사람들
  - 용맹한 사람들
  lexicon: HALOT
  rationale: 다윗 휘하의 군사 엘리트를 가리키는 관용적 표현이므로, ‘용사들’이 본문의 역사적·군사적 뉘앙스를 잘 전달합니다.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  english_pob_choice: the chief of the Thirty
  chosen_korean: 삼십 명의 우두머리
  alternatives_korean:
  - 삼십 명의 수장
  - 삼십 명의 대장
  lexicon: HALOT
  rationale: רֹאשׁ의 직위적 의미를 한국어의 ‘우두머리’로 옮겨, ‘Thirty’가 이름 붙은 정예 집단의 서열을 자연스럽게 드러냅니다.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ עַל שְׁלֹשׁ מֵאוֹת חָלָל
  english_pob_choice: wielded his spear against three hundred slain
  chosen_korean: 창을 들어 삼백 명의 죽은 자를 맞섰습니다
  alternatives_korean:
  - 창을 휘둘러 삼백 명의 죽은 자를 치렀습니다
  - 창을 들어 삼백 명의 죽은 자를 향했습니다
  lexicon: HALOT
  rationale: 히브리어의 짧은 군사 관용구를 그대로 살리되, ‘창을 들어’와 ‘맞섰습니다’로 공격적 대치를 표현했습니다. ‘죽은 자’는 חָלָל의 전사자를 비교적 직접적으로 반영합니다.
- source_word: בְּפַעַם אֶחָת
  english_pob_choice: in one encounter
  chosen_korean: 한 번의 전투에서
  alternatives_korean:
  - 한때에
  - 한 번에
  lexicon: HALOT
  rationale: ‘한 번의 전투’가 단발적 교전을 뜻하는 원문의 시간·사건성을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 히브리어 전투 관용구의 직역성 vs. 자연스러운 한국어 무장 묘사
  chosen_reading: ‘창을 들어 … 맞섰습니다’로, 무기 동작의 압축된 표현을 너무 평탄화하지 않으면서도 한국어 문장으로 읽히게 했습니다.
  alternative_readings:
  - ‘창을 휘둘렀습니다’
  - ‘창을 들어 삼백 명을 쳤습니다’
  rationale: 본문은 단순한 승리 서술이 아니라 단일 교전에서의 압도적 전투 행위를 강조하므로, 동작성과 대치성을 함께 보존하는 쪽이 적절합니다.
  doctrine_reference: 역사 서술의 군사적 과장/영웅적 묘사에 대한 본문 이해
