  - 아호히 사람
  lexicon: 지명/족속형 형용사
  rationale: 아호핫 계통을 가리키는 gentilic을 한국어로는 '사람'을 붙여 자연스럽게 표기했습니다.
theological_decisions:
- issue: 병렬 목록에서의 두 인명과 족속 표지의 간결성
  chosen_reading: 본문의 인명 나열을 유지하고, 족속 표지는 한국어에서 최소한의 설명으로만 드러냈습니다.
  alternative_readings:
  - 의미를 풀어 '후샤 출신 스비브개이, 아호핫 출신 일라이'처럼 서술적으로 확장하는 방식
  rationale: 이 절은 족보/명단 문맥이므로 원문의 간결한 목록형 구조를 보존하는 것이 의미 전달에 더 충실합니다.
  doctrine_reference: 본문 구조 보존 원칙
