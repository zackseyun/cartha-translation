translation:
  language: ko
  text: 스비브개이 호숫 사람과 일라이 아호핫 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 번역은 2사무엘 23:26의 평행구에 영향을 받아 여기서 '이라이'로 읽기도 하지만, 열왕기상/역대상 계열의 히브리어 본문은 '일라이'를 지지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: סִבְּכַי
