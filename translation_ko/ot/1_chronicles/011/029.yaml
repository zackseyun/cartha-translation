    text: 일부 번역은 사무엘하 23:26의 평행구에 따라 이 이름을 ‘이라이’로 옮깁니다. 그러나 역대상 11:29의 히브리어 본문은 ‘일래’(עִילַי)입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סִבְּכַי
  english_pob_choice: Sibbecai
