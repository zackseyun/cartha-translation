  rationale: -הַחֻשָׁתִי의 족속·출신 표지를 한국어에서 자연스럽게 풀어 '사람'으로 옮겼고, 영어의 gentilic 의미를 반영했습니다.
- source_word: עִילַי
  english_pob_choice: Ilai
  chosen_korean: 일라이
  alternatives_korean:
  - 이라이
  lexicon: 고유명사 음역
  rationale: 마소라 본문의 형태를 따라 'Ilai'를 음역했습니다. 영어 대조 전통의 'Irai'는 여기서는 채택하지 않았습니다.
- source_word: הָאֲחוֹחִי
  english_pob_choice: the Ahohite
  chosen_korean: 아호핫 사람
  alternatives_korean:
