source:
  edition: WLC
  text: מִן הַ/שְּׁלוֹשָׁ֤ה בַ/שְּׁנַ֨יִם֙ נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלוֹשָׁ֖ה לֹֽא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
  footnotes:
  - marker: a
    text: Or, 'He was honored more than the three by the two.' The Hebrew is compressed and difficult; the sense is that he was highly honored within a ranked group, yet still did not equal 'the three.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 셋 가운데서 둘보다 더 큰 존중을 받았고, 그들의 지휘관이 되었지만, 셋에는 미치지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축적이어서 해석이 어렵습니다. 이 표현은 ‘셋 가운데 둘보다’로 이해할 수도 있고, ‘두 사람에 의해 셋보다 더 존중받았다’로 이해할 수도 있습니다. 문맥상 핵심은 그가 서열 안에서 크게 존중받았지만 ‘셋’과 같은 지위에는 이르지 못했다는 점입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  english_pob_choice: than the two among the three
  chosen_korean: 셋 가운데 둘보다
  alternatives_korean:
  - 셋보다 둘보다
  - 둘 가운데 셋보다
  - 셋 중 두 사람보다
  lexicon: HALOT
  rationale: 히브리어는 압축된 비교 구문이므로, 한국어에서는 관계를 풀어 ‘셋 가운데 둘보다’로 옮겨 비교 대상과 소속 관계를 함께 드러냈습니다.
- source_word: נִכְבָּד
  english_pob_choice: was more honored
  chosen_korean: 더 높이 존중을 받았고
  alternatives_korean:
  - 더 존중을 받았고
  - 더 높이 예우를 받았고
  - 더 영예로웠고
  lexicon: HALOT
  rationale: Niphal כבד의 ‘존귀하게 여김/존중받음’ 뜻을 살려, 단순한 명예보다 사람들에게서 받는 높임을 드러내는 표현을 택했습니다.
- source_word: וַיְהִי לָהֶם לְשָׂר
  english_pob_choice: and he became their commander
  chosen_korean: 그들의 지휘관이 되었지만
  alternatives_korean:
  - 그들의 대장이 되었지만
  - 그들의 지도자가 되었지만
  - 그들의 사령관이 되었지만
  lexicon: HALOT
  rationale: 군사적 맥락에서 שַׂר는 ‘지휘관/대장’이 자연스러우며, 현대 한국어에서는 ‘지휘관’이 기능을 가장 분명하게 전달합니다.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  english_pob_choice: but he did not attain to the three
  chosen_korean: 셋에는 미치지 못했습니다
  alternatives_korean:
  - 셋에 이르지 못했습니다
  - 셋과 동등한 수준에는 이르지 못했습니다
  - 셋에 도달하지 못했습니다
  lexicon: HALOT
  rationale: בוא עם עַד은 단순한 도착이 아니라 기준/지위에 ‘이르다’는 뜻이므로, 서열적 뉘앙스를 살려 ‘미치지 못했습니다’로 옮겼습니다.
