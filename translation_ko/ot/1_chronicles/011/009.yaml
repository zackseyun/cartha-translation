lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  english_pob_choice: became greater and greater
  chosen_korean: 점점 더 위대해졌고
  alternatives_korean:
  - 더 크고 더 크게 되었고
  - 점점 더 커져 갔고
  - 갈수록 위대해졌고
  lexicon: HALOT
  rationale: 히브리어의 진행적 증대 관용구를 한국어의 자연스러운 누적 표현으로 옮겼습니다. '위대해졌고'는 단순한 신체적 커짐이 아니라 지위와 명성의 증대를 포괄합니다.
- source_word: דָּוִיד
  english_pob_choice: David
  chosen_korean: 다윗
  alternatives_korean:
  - 데이비드
  lexicon: 표준 성경 인명 표기
  rationale: 성경에서 이미 확립된 한국어 인명 형태를 따랐습니다.
- source_word: וַיהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: YHWH + צְבָאוֹת
  rationale: יהוה는 프로젝트 기본어에 따라 '야훼'로 옮기고, צְבָאוֹת는 '만군의'로 직역해 군대/천상 군대의 이미지를 보존했습니다.
- source_word: עִמּוֹ
  english_pob_choice: with him
  chosen_korean: 그와 함께 계셨습니다
  alternatives_korean:
  - 그와 함께 있었습니다
  - 그에게 함께하셨습니다
  lexicon: HALOT
  rationale: 하나님의 임재를 자연스럽게 드러내되, 단순한 동반보다 언약적 동행의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 직접 나타난 신명 사상을 보존하기 위해 전통적 대체어보다 음역형 '야훼'를 사용했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 문장 연결의 접속사 처리
  chosen_reading: '... 위대해졌고, 만군의 야훼께서 ...'
  alternative_readings:
  - '... 위대해졌으니, 만군의 야훼께서 ...'
  - '... 위대해졌습니다. 그러므로 만군의 야훼께서 ...'
  rationale: 히브리어의 ו는 여기서 단순 병렬 연결로 읽는 것이 자연스러우므로, 인과를 부여하는 해석은 피했습니다.
  doctrine_reference: 'English audit revision: replaced ''for'' with ''and'' to avoid added causal nuance'
