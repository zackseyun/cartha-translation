  lexicon: YHWH + צְבָאוֹת
  rationale: יהוה는 프로젝트 기본어에 따라 '야훼'로 옮기고, צְבָאוֹת는 '만군의'로 직역해 군대/천상 군대의 이미지를 보존했습니다.
- source_word: עִמּוֹ
  english_pob_choice: with him
  chosen_korean: 그와 함께 계셨습니다
  alternatives_korean:
