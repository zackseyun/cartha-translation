  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
  footnotes:
  - marker: a
    text: Literally, 'both yesterday and the day before yesterday,' a Hebrew idiom meaning 'formerly' or 'in times past.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'you were the one who led out and brought in Israel,' a Hebrew expression for exercising leadership over the people.
    reason: lexical_alternative
  - marker: c
    text: Or 'leader' or 'prince' for 'ruler'; the Hebrew term is not the usual word for 'king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이전에도, 그전에도, 사울이 왕이었을 때에 당신께서는 이스라엘을 이끌어 내고 데려들인 분이셨습니다.[a] 야훼 당신의 하나님께서 당신에게 말씀하셨습니다. “당신은 내 백성 이스라엘을 목양하고, 내 백성 이스라엘의 지도자가 되십시오.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어제도 그제도’입니다. 과거의 때, 곧 이전부터를 뜻하는 히브리어 관용구입니다. ‘이끌어 내고 데려들이다’는 백성을 이끄는 지도자의 역할을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지도자’로 옮긴 히브리어 낱말은 ‘왕’과는 다른 낱말이며, ‘통치자’ 또는 ‘영도자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמֹול גַּם שִׁלְשׁוֹם
  english_pob_choice: Even in times past, even before
  chosen_korean: 옛날에도, 그보다 더 전에도
  alternatives_korean:
  - 어제도, 그저께도
  - 예전에도, 그보다 전에
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간적 의미를 자연스러운 한국어로 옮기되, גַּם의 반복 강조를 살려 ‘…에도, …에도’ 구조를 유지했습니다.
- source_word: הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  english_pob_choice: you were the one who led Israel out and brought them in
  chosen_korean: 이스라엘을 이끌고 나가고 데리고 들어오는 분이셨습니다
  alternatives_korean:
  - 이스라엘을 이끌어 나가고 들여오는 분이셨습니다
  - 이스라엘 앞에 나가고 들어오게 하는 분이셨습니다
  lexicon: HALOT
  rationale: ‘나가고 들어오다’라는 지도자 관용구를 살리면서도, 한국어에서 주어의 역할이 분명하도록 현재형 서술이 아니라 과거 회상형으로 다듬었습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 당신의 하나님 야훼
  alternatives_korean:
  - 야훼 당신의 하나님
  - 당신의 하나님 여호와
  lexicon: HALOT
  rationale: 표준 POB 용례에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 옮기고, אֱלֹהֶיךָ는 소유격으로 자연스럽게 연결했습니다.
- source_word: תִרְעֶה אֶת עַמִּי אֶת יִשְׂרָאֵל
  english_pob_choice: You shall shepherd my people Israel
  chosen_korean: 내 백성 이스라엘을 목양하고
  alternatives_korean:
  - 내 백성 이스라엘을 치고
  - 내 백성 이스라엘을 양 떼처럼 돌보고
  lexicon: HALOT
  rationale: 왕적 목자 이미지를 유지하기 위해 ‘목양하다’를 택해 shepherd의 은유를 직접 보존했습니다.
- source_word: נָגִיד
  english_pob_choice: ruler
  chosen_korean: 지도자가
  alternatives_korean:
  - 통치자가
  - 왕이 아닌 지도자가
  lexicon: HALOT
  rationale: נָגִיד는 통상적 ‘왕’과 구별되는 임명된 지도자/군주적 대표를 가리키므로, 직함의 폭을 넓게 보존하는 ‘지도자’가 적절합니다.
theological_decisions:
- issue: 야훼와 ‘주’ 대체 여부
  chosen_reading: 본문에 나오는 יְהוָה는 ‘야훼’로 직접 음역했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 신명기적 신명 표기를 직접 사용하므로, 서술적 대체어보다 고유명을 드러내는 번역이 원문과 주해 전통에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 목자 은유의 보존
  chosen_reading: ‘목양하다’로 왕권의 목자 이미지를 보존했습니다.
  alternative_readings:
  - 다스리다
  - 치리하다
  rationale: 하나님의 백성을 ‘목양’하도록 부르시는 표현은 단순한 행정 통치보다 돌봄과 인도를 함께 뜻하므로, 은유를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
