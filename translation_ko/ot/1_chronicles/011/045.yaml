    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעֲאֵל
  english_pob_choice: Jediael
  chosen_korean: 여디아엘
  alternatives_korean:
  - 제디아엘
  - 여디아엘
  lexicon: HALOT
  rationale: 고유명사는 음역하며, 영어 POB의 Jediael을 표준 음역으로 옮겼습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 자손
  - ~의 아들
  lexicon: HALOT
  rationale: 족보/명단 맥락에서 בֶּן의 가장 직접적인 뜻은 부자 관계이므로 ‘~의 아들’로 옮겼습니다.
- source_word: אָחִיו
  english_pob_choice: his brother
  chosen_korean: 그 형제
  alternatives_korean:
  - 그의 형제
  - 그의 형
  lexicon: HALOT
  rationale: אָח는 기본적으로 ‘형제’를 뜻하며, 이 문맥에서는 친족 관계를 일반화하기보다 평이하게 ‘그 형제’로 옮기는 것이 자연합니다.
- source_word: הַתִּיצִי
  english_pob_choice: the Tizite
  chosen_korean: 티스 사람
  alternatives_korean:
  - 티지 사람
  - 지스 사람
  lexicon: HALOT
  rationale: 영어 POB가 지명/씨족형 형용사로 처리한 점을 따라, 한국어에서는 출신/소속을 나타내는 ‘~사람’으로 옮겨 해당 집단 소속을 드러냈습니다.
theological_decisions:
- issue: 족보 문장의 관계 표지 처리
  chosen_reading: ‘시므리의 아들’과 ‘그 형제’라는 평이한 친족 관계로 유지했습니다.
  alternative_readings:
  - ‘시므리의 자손’으로 완화
  - ‘친족’으로 일반화
  rationale: 히브리어 본문은 혈연 관계를 간명하게 나열하므로, 의미를 약화시키지 않고 직접적인 친족 표현을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 충실성 / 족보 표현
