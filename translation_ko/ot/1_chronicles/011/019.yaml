language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
  footnotes:
  - marker: a
    text: Or, 'at the risk of their lives.' The Hebrew repeats 'with/by their lives' for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Blood'' is kept literally. David speaks of the water as if it were their blood because they obtained it through mortal danger.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그가 말했습니다. 「내 하나님 앞에서 이것을 결코 하지 못하겠습니다! 내가 이 사람들의 생명과 맞바꿔 얻은 피를 마시겠습니까? 그들이 그것을 자기들의 생명과 맞바꿔 가져왔기 때문입니다.」 그래서 그는 그것을 마시려 하지 않았습니다. 이 일을 세 용사가 해냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘자기들의 생명과 맞바꿔’라는 표현을 반복해 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘피’는 문자적으로 유지했습니다. 다윗은 그 물을 생명을 건 위험의 결과로 보았기 때문입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  english_pob_choice: Far be it from me, by my God
  chosen_korean: 내 하나님 앞에서 이것을 결코 하지 못하겠습니다
  alternatives_korean:
  - 내 하나님이여, 결코 그러지 않겠습니다
  - 내 하나님으로 말미암아 이것을 하지 않겠습니다
  lexicon: HALOT
  rationale: חָלִילָה의 강한 거부를 한국어의 자연스러운 부정 선언으로 옮기되, מֵאֱלֹהַי의 하나님 관련 호소는 ‘내 하나님’으로 살려 맹세적 긴장을 보존했습니다.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה
  english_pob_choice: the blood of these men
  chosen_korean: 이 사람들의 피
  alternatives_korean:
  - 이 사람들의 생명
  - 이 사람들의 피
  lexicon: HALOT
  rationale: 히브리어의 ‘피’를 그대로 유지해, 물을 피처럼 여기는 다윗의 윤리적 판단을 희석하지 않았습니다.
- source_word: בְנַפְשׁוֹתָם
  english_pob_choice: at the cost of their lives
  chosen_korean: 생명과 맞바꿔
  alternatives_korean:
  - 목숨을 걸고
  - 목숨을 내걸고
  lexicon: HALOT
  rationale: נֶפֶשׁ를 이 문맥의 ‘생명/목숨’으로 이해하고, 반복되는 בְנַפְשׁוֹתָם의 대가적 뉘앙스를 한국어의 관용적 표현으로 압축했습니다.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  english_pob_choice: So he was not willing to drink it
  chosen_korean: 그래서 그는 그것을 마시려 하지 않았습니다
  alternatives_korean:
  - 그래서 그는 그것을 마시지 않았습니다
  - 그래서 그는 그것을 마시기를 원하지 않았습니다
  lexicon: HALOT
  rationale: אָבָה의 ‘의지/동의’ 의미를 살려 단순한 행위 부정보다 의사 거부를 분명히 했습니다.
- source_word: שְׁלֹשֶׁת הַגִּבּוֹרִים
  english_pob_choice: the three mighty men
  chosen_korean: 세 용사
  alternatives_korean:
  - 세 용맹한 사람들
  - 세 용사들
  lexicon: HALOT
  rationale: Chronicles의 גִּבּוֹרִים는 다윗의 정예 전사를 가리키므로, 한국어에서도 군사적-영웅적 뉘앙스가 살아 있는 ‘용사’로 옮겼습니다.
theological_decisions:
- issue: ‘피’와 ‘생명’의 관계를 어떻게 드러낼지
  chosen_reading: ‘이 사람들의 피’와 ‘생명과 맞바꿔’라는 병치를 유지해, 다윗이 물을 생명 위험의 결과로서 피에 준하는 것으로 여기는 판단을 드러냈습니다.
  alternative_readings:
  - ‘생명을 건 물’처럼 의미를 풀어 쓰기
  - ‘피’ 없이 위험만 강조하기
  rationale: 본문의 수사와 윤리적 무게는 ‘피’ 이미지에 있으므로, 이를 해설로 대체하지 않고 함께 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
