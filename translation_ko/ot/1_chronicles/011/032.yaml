theological_decisions:
- issue: 지명/출신 표기의 지리적 불확실성
  chosen_reading: ‘아르바 사람’으로 두어 정확한 위치를 단정하지 않았습니다.
  alternative_readings:
  - ‘아라바 사람’
  - ‘아르바트 사람’
  rationale: 어근이 가리키는 지역은 분명하지만 정확한 현대 지명 대응은 불확실하므로, 원문의 출신 표지를 유지하면서 과도한 특정화를 피했습니다.
  doctrine_reference: 본문의 역사·지리 정보는 불확실성이 있을 때 단정하지 않는 번역 원칙
