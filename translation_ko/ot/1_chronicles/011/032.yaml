  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
  footnotes:
  - marker: a
    text: Or 'from the valleys of Gaash' or 'from the brooks of Gaash.' The Hebrew term can refer to a wadi, ravine, torrent-bed, or valley.
    reason: lexical_alternative
  - marker: b
    text: '''Arbathite'' is a gentilic, meaning a man from Arbath (possibly related to the Arabah).'
    reason: cultural_note
translation:
  language: ko
  text: 가아스의 와디들 출신인 후래와 아르바 사람 아비엘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가아스의 골짜기들 출신인’, ‘가아스의 시내들 출신인’. 히브리어 נחל은 와디, 협곡, 물길, 골짜기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아르바 사람’은 아르바 또는 아라바와 관련된 지명에서 온 사람을 가리키는 출신명입니다. 정확한 위치는 분명하지 않습니다.
    reason: cultural_note
