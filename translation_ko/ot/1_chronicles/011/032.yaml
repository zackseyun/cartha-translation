base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/032.yaml
  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
  footnotes:
  - marker: a
    text: Or 'from the valleys of Gaash' or 'from the brooks of Gaash.' The Hebrew term can refer to a wadi, ravine, torrent-bed, or valley.
    reason: lexical_alternative
  - marker: b
    text: '''Arbathite'' is a gentilic, meaning a man from Arbath (possibly related to the Arabah).'
    reason: cultural_note
translation:
  language: ko
  text: 후라이는 가아스의 와디들에서, 아비엘은 아르바 사람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가아스의 골짜기들에서’, ‘가아스의 시내들에서’. 히브리어 נחל은 와디, 협곡, 물길, 골짜기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아르바 사람’은 아르바/아라바와 관련된 지명을 가리키는 출신명입니다. 정확한 위치는 분명하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי֙
  english_pob_choice: Hurai
  chosen_korean: 후라이
  alternatives_korean:
  - 후라이이
  - 후라이
  lexicon: WLC proper name; English POB transliteration
  rationale: 고유명사는 번역하지 않고 음역하되, 영어 POB의 Hurai에 맞춰 한국어 음가를 자연스럽게 옮겼습니다.
- source_word: מִ/נַּחֲלֵי
  english_pob_choice: from the wadis of
  chosen_korean: —에서
