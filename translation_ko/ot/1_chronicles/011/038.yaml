translation:
  language: ko
  text: 요엘은 나단의 형제이며, 미브할은 하그리의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하그릿 사람”으로도 읽을 수 있습니다. 히브리어 הַגְרִי는 고유명사보다 민족명/칭호로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹאֵל
  english_pob_choice: Joel
  chosen_korean: 요엘
  alternatives_korean:
  - 요엘
  lexicon: HALOT
  rationale: 고유명사는 통용되는 음역을 따랐습니다.
- source_word: אֲחִי
  english_pob_choice: the brother of
  chosen_korean: 형제이며
  alternatives_korean:
  - 형제입니다
  - 동생입니다
  - 형제인
  lexicon: HALOT
  rationale: 열거형 계보 문맥에서 관계를 간결하게 살리기 위해 ‘형제이며’로 옮겼습니다.
- source_word: מִבְחָר
  english_pob_choice: Mibhar
  chosen_korean: 미브할
  alternatives_korean:
  - 미바르
  - 미브하르
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역 관행에 맞춰 옮겼습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들입니다
  alternatives_korean:
  - 아들입니다
  - ~의 자손입니다
  lexicon: HALOT
  rationale: 족보표에서는 직계 관계를 드러내는 ‘아들’이 가장 자연스럽고 원문도 충분히 지지합니다.
- source_word: הַגְרִי
  english_pob_choice: Hagri / the Hagrite
  chosen_korean: 하그리
  alternatives_korean:
  - 하그릿 사람
  - 하그리트
  lexicon: HALOT
  rationale: 본문은 영어 POB의 본문 선택을 따라 고유명사형으로 두고, 가능한 민족명 독해는 각주로 보존했습니다.
theological_decisions:
- issue: 하그리(הַגְרִי)의 의미를 고유명사로 둘지 민족명으로 볼지
  chosen_reading: 본문은 ‘하그리’로 두고, 대안 독법은 각주에 명시합니다.
  alternative_readings:
  - ‘하그릿 사람’
  - ‘하그라 사람’
  rationale: 원문 형태가 개인명처럼도, 민족/출신표시처럼도 읽힐 수 있어 본문은 POB의 보수적 선택을 따르고 해석 가능성은 각주로 유지합니다.
  doctrine_reference: 해석상 불확실성이 있는 족보 표기 보존
