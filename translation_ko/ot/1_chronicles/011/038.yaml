  lexicon: HALOT
  rationale: 본문은 영어 POB의 본문 선택을 따라 고유명사형으로 두고, 가능한 민족명 독해는 각주로 보존했습니다.
theological_decisions:
- issue: 하그리(הַגְרִי)의 의미를 고유명사로 둘지 민족명으로 볼지
  chosen_reading: 본문은 ‘하그리’로 두고, 대안 독법은 각주에 명시합니다.
  alternative_readings:
  - ‘하그릿 사람’
  - ‘하그라 사람’
  rationale: 원문 형태가 개인명처럼도, 민족/출신표시처럼도 읽힐 수 있어 본문은 POB의 보수적 선택을 따르고 해석 가능성은 각주로 유지합니다.
  doctrine_reference: 해석상 불확실성이 있는 족보 표기 보존
