translation:
  language: ko
  text: 나단의 형제 요엘과 하그리의 아들 미브할입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하그릿 사람의 아들”로 읽을 수 있습니다. 히브리어 הַגְרִי는 개인명 ‘하그리’가 아니라 출신이나 집단을 나타내는 명칭으로 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹאֵל
  english_pob_choice: Joel
  chosen_korean: 요엘
  alternatives_korean:
