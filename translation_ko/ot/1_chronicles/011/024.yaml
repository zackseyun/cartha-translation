  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
  footnotes:
  - marker: a
    text: Or 'he had renown among the three mighty men.' The Hebrew literally says 'he had a name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이러한 일들을 여호야다의 아들 브나야가 행하였고, 그는 세 용사 가운데서 이름을 얻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그는 이름을 가졌다’입니다. 여기서는 명성이나 평판을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  english_pob_choice: These things ... did
  chosen_korean: 이러한 일들을 ... 행하였고
  alternatives_korean:
  - 이것들을 ... 했고
  - 이러한 일들을 ... 했습니다
  lexicon: HALOT
  rationale: 앞서 열거된 업적을 가리키는 복수 지시어를 자연스럽게 살려 ‘이러한 일들’로 옮기고, 요약적 행위 동사를 ‘행하였고’로 번역해 공식 문체의 서술감을 유지했습니다.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  english_pob_choice: Benaiah son of Jehoiada
  chosen_korean: 여호야다의 아들 브나야
  alternatives_korean:
  - 브나야, 여호야다의 아들
  - 브나야, 여호야다의 아들입니다
  lexicon: HALOT
  rationale: 고유명사는 통용되는 성경식 음역을 따르고, 계보 관계는 한국어에서 가장 자연스러운 소유격 표현으로 풀었습니다.
- source_word: וְלוֹ שֵׁם
  english_pob_choice: and he had a name
  chosen_korean: 그는 ... 이름을 얻었습니다
  alternatives_korean:
  - 그에게는 ... 이름이 있었습니다
  - 그는 ... 명성을 얻었습니다
  lexicon: HALOT
  rationale: 히브리어의 직역적 ‘이름이 있었다’는 관용적으로 명성/평판을 뜻하므로, POB의 문자성을 살리되 한국어에서는 ‘이름을 얻다’로 idiom을 드러냈습니다.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  english_pob_choice: among the three mighty men
  chosen_korean: 세 용사 가운데서
  alternatives_korean:
  - 세 용사 중에서
  - 삼인 용사들 가운데서
  lexicon: HALOT
  rationale: 관계 전치사 בּ는 집단 내 위치를 나타내므로 ‘가운데서’로 옮겼고, הַגִּבֹּרִים는 문맥상 다윗의 정예 전사 집단을 가리켜 ‘용사’로 유지했습니다.
theological_decisions:
- issue: שֵׁם의 의미를 단순한 실명 소지로 볼지, 명예/평판의 관용으로 볼지
  chosen_reading: ‘이름을 얻었습니다’로 번역해 실제 이름 소지보다 명성 획득의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘이름이 있었습니다’
  - ‘명성을 얻었습니다’
  rationale: 문맥상 세 용사 가운데서의 탁월함을 말하므로, 히브리어 ‘name’의 관용적 의미를 한국어에서 너무 평면적인 소유 진술로 축소하지 않도록 했습니다.
  doctrine_reference: 성경 히브리어 관용법의 의미 보존
