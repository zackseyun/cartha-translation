reference: 1 Chronicles 11:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'he poured it out as a drink offering to the LORD.' The Hebrew verb can carry libation/sacrificial force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그 세 사람은 블레셋 사람들의 진영을 뚫고 들어가 베들레헴 성문 곁에 있는 우물에서 물을 길어 왔습니다. 그들은 그것을 다윗에게 가져왔으나, 다윗은 마시려 하지 않고 야훼께 부어 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 분명히 말해 ‘주님께 전제물로 부어 드렸다’는 뜻일 수 있습니다. 히브리어 동사는 전제/제물의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  english_pob_choice: broke through
  chosen_korean: 뚫고 들어가
  alternatives_korean:
  - 돌파하고
  - 강제로 지나가
  lexicon: HALOT
  rationale: 전투 상황에서 적진을 가로질러 진입하는 강한 동작을 살려, 단순한 통과보다 역동적인 ‘뚫고 들어가’를 택했습니다.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  english_pob_choice: from the well of Bethlehem that was by the gate
  chosen_korean: 베들레헴 성문 곁에 있는 우물
  alternatives_korean:
  - 성문에 있는 베들레헴의 우물
  - 성문 옆의 베들레헴 저수통
  lexicon: HALOT
  rationale: בּוֹר는 문맥상 마시는 물을 길어 오는 장소이므로 ‘우물’로 옮겼고, אֲשֶׁר בַּשַּׁעַר의 위치를 자연스럽게 ‘성문 곁에 있는’으로 풀었습니다.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  english_pob_choice: drew water
  chosen_korean: 물을 길어 왔습니다
  alternatives_korean:
  - 물을 퍼 왔습니다
  - 물을 길었습니다
  lexicon: HALOT
  rationale: שאב은 우물에서 물을 퍼 올려 가져오는 행위를 가리키므로, 한국어에서도 자연스럽고 구체적인 ‘물을 길어 왔습니다’가 적합합니다.
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  english_pob_choice: he poured it out to Yahweh
  chosen_korean: 야훼께 부어 드렸습니다
  alternatives_korean:
  - 야훼께 부어 올렸습니다
  - 야훼께 전제물로 드렸습니다
  lexicon: HALOT
  rationale: נסך는 단순한 액체 쏟기가 아니라 제의적 부어 드림을 포함할 수 있어, 본문 흐름을 살리면서도 헌물의 방향을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 예배적 의미를 띠는 물의 처리
  chosen_reading: 본문의 동작은 ‘부어 드렸습니다’로 구체적으로 유지하되, 제의적 함의를 본문 안에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘전제물로 드렸습니다’처럼 직접 제의 용어를 본문에 넣는 방식
  rationale: 히브리어 נסך는 제의적 전제의 뉘앙스를 가지지만, 서술은 실제 행동인 ‘붓다’에 초점이 있으므로 지나치게 해설적으로 만들지 않는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6; יְהוָה의 고유명사 처리
