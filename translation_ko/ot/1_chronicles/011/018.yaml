- from: 그래서 그 세 사람은 블레셋 사람들의 진영을 뚫고 들어가 베들레헴 성문 곁에 있는 우물에서 물을 길어 왔습니다. 그들은 그것을 다윗에게 가져왔으나, 다윗은 마시려 하지 않고 야훼께 부어 드렸습니다.[a]
  to: 그래서 그 세 사람은 블레셋 사람들의 진영을 뚫고 들어가, 베들레헴 성문 곁에 있는 우물에서 물을 길어 그것을 가지고 다윗에게 왔습니다. 그러나 다윗은 그것을 마시려 하지 않고 야훼께 부어 드렸습니다.[a]
  rationale: 본문은 물을 긷고, 그것을 운반하여 다윗에게 가져오는 동작의 순서를 더 분명하게 반영하도록 다듬었습니다. 야훼께 물을 붓는 행위는 본문의 구체성을 보존했고, נסך의 전제적 함의는 해당 동작에 붙인 각주에서 설명했습니다.
