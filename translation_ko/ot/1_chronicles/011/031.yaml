lexical_decisions:
- source_word: אִיתַי
  english_pob_choice: Ittai
  chosen_korean: 이대이
  alternatives_korean:
  - 잇대이
  - 잇타이
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사는 음역하는 것이 원칙이므로, 영어 POB의 Ittai에 대응하는 현대 한국어 음역을 사용했습니다.
- source_word: בֶּן רִיבַי
  english_pob_choice: son of Ribai
  chosen_korean: 리바이의 아들
  alternatives_korean:
  - 리바이의 아들이며
  - 리바이의 자손
  lexicon: HALOT
  rationale: בֶּן은 직접 부자 관계를 나타내므로 ‘~의 아들’로 옮겼습니다.
- source_word: מִגִּבְעַת בְּנֵי בִנְיָמִן
  english_pob_choice: from Gibeah of the sons of Benjamin
  chosen_korean: 베냐민 자손의 기브아 출신
  alternatives_korean:
  - 베냐민 자손의 기브아에서
  - 베냐민 지파의 기브아 출신
  lexicon: HALOT
  rationale: מִן의 출신 표지와 מקום명 기브아를 함께 살려 ‘~출신’으로 옮겼고, בְּנֵי בִנְיָמִן은 부족 소속을 나타내므로 ‘베냐민 자손’으로 보존했습니다.
- source_word: הַפִּרְעָתֹנִי
  english_pob_choice: the Pirathonite
  chosen_korean: 브라돈 사람
  alternatives_korean:
  - 브라돈 출신
  - 브라돈 사람
  lexicon: 고유명사 표기
  rationale: 지명/출신을 나타내는 gentillic이므로, 한국어 성경 관용에 맞춰 ‘~사람’으로 처리했습니다.
theological_decisions:
- issue: בְּנֵי בִנְיָמִן의 집합적 의미
  chosen_reading: ‘베냐민 자손’으로 옮겨 혈통 표현을 유지했습니다.
  alternative_readings:
  - 베냐민 사람들
  - 베냐민 지파
  rationale: 이 표현은 단순한 개인적 자녀가 아니라 지파 소속을 가리키므로, 직역적 형태를 유지하는 편이 원문의 족보적·공동체적 의미를 더 잘 드러냅니다.
  doctrine_reference: 족보/지파 정체성
