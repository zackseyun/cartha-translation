source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the Three.'' In the parallel passage (2 Sam 23:18), some English versions render the group differently because of textual and contextual difficulties involving ''three'' and ''thirty.'''
    reason: textual_variant
  - marker: b
    text: Or 'lifted up his spear' or 'wielded his spear.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew idiom is literally 'had a name,' that is, 'was renowned.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아비새는 요압의 형제로서 그 셋[a]의 우두머리였습니다. 그는 자기 창을 들어 삼백 명을 죽였으며[b], 그 셋 가운데서 이름이 있었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 셋’입니다. 평행 본문인 사무엘하 23:18에서는 ‘셋’과 ‘삼십’의 관계에 본문 및 문맥상의 난점이 있어 번역본들 사이에 차이가 있기도 합니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘자기 창을 일으켰다’에 가깝습니다. 문맥상 전투에서 창을 휘두르거나 들어 올린 행동을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구는 문자적으로 ‘이름이 있었다’이며, 곧 ‘명성이 있었다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  english_pob_choice: chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 수장
  lexicon: HALOT
  rationale: 군사적 문맥에서 רֹאשׁ은 문자적 ‘머리’보다 지위와 책임을 가리키므로, ‘우두머리’로 옮겨 서열과 역할을 자연스럽게 드러냈습니다.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  english_pob_choice: the Three / among the Three
  chosen_korean: 그 셋 / 그 셋 가운데서
  alternatives_korean:
  - 세 사람
  - 셋 가운데
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘셋’을 가리키므로 이를 유지했고, 앞뒤 문맥의 전승 문제는 본문에서 조화시키지 않고 그대로 반영했습니다.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  english_pob_choice: brandished his spear
  chosen_korean: 자기 창을 휘둘렀고
  alternatives_korean:
  - 자기 창을 들어 올렸고
  - 자기 창을 휘둘러
  lexicon: HALOT
  rationale: 직역하면 ‘창을 일으키다/흔들다’에 가깝지만, 전투 행동의 생생함을 살리는 한국어 동사로 ‘휘두르다’를 택했습니다.
- source_word: שֵׁם
  english_pob_choice: had a name
  chosen_korean: 이름이 있었습니다
  alternatives_korean:
  - 명성을 얻었습니다
  - 널리 알려졌습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 형태를 살리되, 한국어에서는 ‘이름이 있다’가 곧 명성과 인정을 뜻하므로 그 뉘앙스를 유지했습니다.
theological_decisions:
- issue: ‘three hundred slain’의 한국어 처리
  chosen_reading: ‘세 명의 죽은 자들 위에’로 옮겨, 결과를 암시하는 히브리어 표현을 본문 안에서 최대한 가깝게 반영했습니다.
  alternative_readings:
  - ‘삼백 명의 죽은 자들에 맞서’
  - ‘삼백 명을 죽여’
  rationale: 히브리어는 חָלָל(죽임을 당한 자)을 사용해 전과를 요약하므로, 해석을 앞세운 완전한 의역보다 원문의 서술 방식을 유지하는 편이 더 정확합니다.
  doctrine_reference: 본문 해석 원칙
