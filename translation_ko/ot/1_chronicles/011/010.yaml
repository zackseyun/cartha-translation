  - severity: medium
    issue: ‘그의 나라에서’
    rationale: בְּמַלְכוּתוֹ는 이 문맥에서 다윗의 영토적 나라라기보다 그의 왕권 또는 통치와 관련됩니다. 왕위 수립의 문맥을 반영하여 ‘그의 왕권을 세우는 일에서’로 옮기는 것이 적절합니다.
