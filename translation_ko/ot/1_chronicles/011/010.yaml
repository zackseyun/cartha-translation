  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: Now these were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
  footnotes:
  - marker: a
    text: Or, 'who strengthened themselves with him' or 'who supported him strongly.' The Hebrew expression can be rendered more literally, but here likely refers to rallying to David in support of his kingship.
    reason: lexical_alternative
  - marker: b
    text: Or, 'according to the word of the LORD over Israel.' The Hebrew more literally reads 'upon Israel,' but in this construction likely means 'concerning Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 다윗에게 속한 용사들의 우두머리들입니다. 그들은 그의 왕권을 세우는 일에서 그와 굳게 힘을 합하고, 온 이스라엘과 함께 그를 왕으로 세웠습니다. 이는 이스라엘에 관한 야훼의 말씀대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그와 굳게 힘을 합하고’는 히브리어의 재귀적 표현을 문맥에 맞게 옮긴 것입니다. 더 문자적으로는 ‘그와 함께 스스로 강해지며’라고 할 수 있으며, ‘그를 강하게 지지하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘에 관한 야훼의 말씀대로’에서 ‘이스라엘에 관한’은 히브리어의 ‘이스라엘 위에/관하여’를 옮긴 것입니다. 문맥상 야훼의 말씀이 이스라엘에 관하여 선포된 것이라는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  english_pob_choice: chiefs of
  chosen_korean: 우두머리들
  alternatives_korean:
  - 지도자들
  - 수장들
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘머리’가 아니라 용사 집단의 선도적 인물을 가리키므로, 위계성을 살리는 한국어로 옮겼습니다.
- source_word: הַגִּבּוֹרִים
  english_pob_choice: the mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 힘센 사람들
  - 강한 전사들
  lexicon: HALOT
  rationale: 역대상에서 다윗의 정예 전사들을 가리키는 관용적 표현이므로, 군사적 함의를 자연스럽게 드러내는 ‘용사들’을 택했습니다.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  english_pob_choice: who gave strong support to him
  chosen_korean: 그와 함께 강하게 협력하며
  alternatives_korean:
  - 그와 함께 스스로 강해지며
  - 그를 강하게 지지하며
  lexicon: HALOT
  rationale: 히트파엘의 재귀적 뉘앙스를 살리되, 왕권 성립 문맥에 맞게 단순한 감정적 지지보다 정치·군사적 협력을 드러내도록 옮겼습니다.
- source_word: לְהַמְלִיכוֹ
  english_pob_choice: to make him king
  chosen_korean: 그를 왕으로 삼기 위하여
  alternatives_korean:
  - 그를 왕으로 세우기 위하여
  - 그를 왕위에 올리기 위하여
  lexicon: HALOT
  rationale: 히필의 ‘왕이 되게 하다’는 뜻을 직역에 가깝게 유지하면서도 현대 한국어로 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대체어 대신 하나님의 고유명사를 음역한 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: כִּדְבַר יְהוָה עַל יִשְׂרָאֵל의 범위
  chosen_reading: 야훼의 말씀에 따라 이루어진 다윗의 즉위가 이스라엘을 향한 말씀과 연결됨
  alternative_readings:
  - 이스라엘 위에 있는 야훼의 말씀
  - 이스라엘에 관한 야훼의 말씀에 따라
  rationale: עַל 이 문맥에서는 ‘위에’보다 ‘관하여/향하여’의 의미가 자연스러우므로, 왕권의 성립이 이스라엘을 향한 신적 말씀과 연관됨을 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: Translation philosophy §1, §5, §6
