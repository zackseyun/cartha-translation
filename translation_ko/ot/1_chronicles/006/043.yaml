  terminology: מִגְרָשֶׁיהָ를 ‘그 목초지들’로 옮긴 것은 레위 성읍에 딸린 목초지라는 의미를 잘 살립니다. ‘드빌’은 표준 한국어 성경 지명 관습에 맞습니다.
