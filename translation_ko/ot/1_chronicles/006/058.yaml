lexical_decisions:
- source_word: רָאמוֹת
  english_pob_choice: Ramoth
  chosen_korean: 라못
  alternatives_korean:
  - 라모트
  lexicon: 고유 지명 음역
  rationale: 히브리어 지명은 원문을 따라 현대 표기법에 맞게 음역했습니다. 영어 POB의 Ramoth에 대응하되, 한국어에서는 모음과 어미를 자연스럽게 옮겼습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 땅들
  - 그 들판들
  - 그 방목지들
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍에 딸린 열린 땅, 특히 방목 가능한 구역을 가리키므로, 문맥상 ‘목초지들’이 가장 분명합니다. 소유격 접미사는 각 성읍에 자연스럽게 연결해 ‘그’로 옮겼습니다.
- source_word: עָנֵם
  english_pob_choice: Anem
  chosen_korean: 아넴
  alternatives_korean:
  - 아네르
  lexicon: 고유 지명 음역
  rationale: 본문의 MT는 עָנֵם을 따르므로 이를 본문 음역으로 유지했습니다. 영어 POB 각주에 따라 여호수아 21:25의 이칭 가능성은 별도로 처리할 수 있습니다.
