  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹם לִבְנִ֥י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
  footnotes:
  - marker: a
    text: Hebrew manuscripts here read Gershom; some English traditions use Gershon in related genealogical contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 게르솜의 아들들의 이름은 다음과 같습니다. 립니와 시므이입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘게르솜’(Gershom)으로 읽습니다. 관련 계보 문맥에서 일부 영어 전통은 ‘게르손’(Gershon)으로 표기합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것은 ...입니다
  alternatives_korean:
  - 그리고 이것들은 ...입니다
  - 이들은 ...입니다
  lexicon: HALOT
  rationale: 계보 목록을 여는 제시문이므로 현대 한국어에서는 주어-서술 구조로 자연스럽게 풀어 옮기되, 목록 도입의 제시 기능을 유지했습니다.
- source_word: שְׁמוֹת בְּנֵי
  english_pob_choice: the names of the sons of
  chosen_korean: 아들들의 이름
  alternatives_korean:
  - 아들들의 이름들
  - 자손들의 이름
  lexicon: HALOT
  rationale: 문맥상 계보 항목의 표제이므로 ‘the names of the sons of’를 직역에 가깝게 반영했습니다. ‘자손’은 범위가 넓어질 수 있어 기본값으로 두지 않았습니다.
- source_word: גֵרְשׁוֹם
  english_pob_choice: Gershom
  chosen_korean: 게르솜
  alternatives_korean:
  - 그솜
  - 게르손
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 표기했습니다. 이 절의 자음 형태는 גֵרְשׁוֹם이므로 ‘게르솜’이 맞습니다.
- source_word: לִבְנִי
  english_pob_choice: Libni
  chosen_korean: 립니
  alternatives_korean:
  - 리브니
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 한국어에서 자음군 반영을 지나치게 늘이지 않는 자연스러운 표기를 택했습니다.
- source_word: וְשִׁמְעִי
  english_pob_choice: and Shimei
  chosen_korean: 시므이
  alternatives_korean:
  - 그리고 시므이
  - 시매
  lexicon: HALOT
  rationale: 연결 접두사 וְ는 한국어 문장에서는 목록의 병렬로 자연스럽게 흡수할 수 있어 별도 ‘그리고’를 생략했습니다. 이름은 통용 음역을 따랐습니다.
theological_decisions:
- issue: 계보 문맥의 목록 제시 방식
  chosen_reading: 서술형으로 자연스럽게 제시하되, 인물명과 계보 관계를 희석하지 않았습니다.
  alternative_readings:
  - 직역형으로 ‘이들은 ...의 이름들입니다’
  - 명사구형으로 ‘...의 이름들’
  rationale: 본문은 단순한 인명 목록이므로 신학적 확장 없이 계보 정보만 전달하는 것이 적절합니다.
  doctrine_reference: 성경 계보의 역사성 및 문맥 충실성
