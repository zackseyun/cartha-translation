translation:
  language: ko
  text: 엘가나의 아들, 에비아삽의 아들, 아시르의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에비아삽’은 히브리어 철자에 더 직접적인 음역입니다. 더 익숙한 전통 표기 ‘아비아삽’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  english_pob_choice: Elkanah
  chosen_korean: 엘가나
  alternatives_korean:
  - 엘가난
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역하되, 한국어 표기에서는 현대 외래어 표기 원칙에 맞춰 자연스럽게 옮겼습니다.
- source_word: בְנוֹ
  english_pob_choice: his son
  chosen_korean: 아들
  alternatives_korean:
  - 그의 아들
  - 아들로
  lexicon: HALOT
  rationale: 계보문에서 소유대명사를 반복하기보다 명사구를 간결하게 살려, 관계를 직접적으로 드러내는 ‘아들’로 옮겼습니다.
- source_word: אֶבְיָסָף
  english_pob_choice: Ebiasaph
  chosen_korean: 에비아삽
  alternatives_korean:
  - 아비아삽
  lexicon: HALOT
  rationale: 히브리어 철자 אֶבְיָסָף를 따라 음역했고, 더 익숙한 전통적 표기 ‘아비아삽’은 대안으로 남겼습니다.
- source_word: אַסִּיר
  english_pob_choice: Assir
  chosen_korean: 아시르
  alternatives_korean:
  - 앗시르
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역했습니다.
theological_decisions:
- issue: 계보문의 반복 구조를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘A의 아들, B의 아들, C의 아들’ 식으로 연속된 계보 연결을 유지했습니다.
  alternative_readings:
  - ‘A의 아들이며 B의 아들이고 C의 아들입니다’처럼 서술형으로 풀어쓰기
  - 각 이름만 나열하고 관계 표시는 생략하기
  rationale: 본문은 단순한 혈통 나열이므로, 의미를 보태지 않고 동일한 족보적 연결을 반복 구조로 보존하는 것이 가장 투명합니다.
  doctrine_reference: 족보 본문 해석 원칙
