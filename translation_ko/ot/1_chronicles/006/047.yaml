id: 1CH.6.47
reference: 1 Chronicles 6:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י גֵרְשׁ֜וֹם לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה יִ֠שָׂשכָר וּ/מִ/מַּטֵּ֨ה אָשֵׁ֜ר וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וּ/מִ/מַּטֵּ֤ה מְנַשֶּׁה֙ בַּ/בָּשָׁ֔ן עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
  footnotes:
  - marker: a
    text: Hebrew spells the clan name here as 'Gershom'; many English versions have 'Gershon.'
    reason: alternative_reading
  - marker: b
    text: Some translations expand 'Manasseh in Bashan' to 'the half-tribe of Manasseh in Bashan' to make the geographical reference explicit; 'half-tribe' is not stated in the Hebrew of this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 게르솜의 자손들에게는, 그들의 씨족에 따라, 이사갈 지파에서, 아셀 지파에서, 납달리 지파에서, 그리고 바산에 있는 므낫세 지파에서 열세 성읍이 주어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표기는 여기서 ‘게르솜’이며, 영어권 성경의 관용형 ‘게르손’과는 다릅니다.
    reason: source_note
  - marker: b
    text: 히브리어 본문에는 ‘므낫세 반 지파’가 명시되어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  english_pob_choice: And to the sons of
  chosen_korean: 그리고 …의 자손들에게는
  alternatives_korean:
  - 그리고 …의 아들들에게는
  - 그리고 …의 후손들에게는
  lexicon: HALOT
  rationale: 족보·지파 분배 문맥에서 ‘sons of’를 한국어로 자연스럽게 받되, 문장 연결을 살리기 위해 ‘그리고’로 시작했습니다.
- source_word: גֵרְשׁוֹם
  english_pob_choice: Gershom
  chosen_korean: 게르솜
  alternatives_korean:
  - 게르손
  lexicon: HALOT
  rationale: 히브리어 자음표기와 영어 POB의 주석을 따라 여기서는 ‘게르솜’을 유지했습니다.
- source_word: לְמִשְׁפְּחוֹתָם
  english_pob_choice: according to their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 그들의 종족별로
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파 분배 문맥에서 단순 가족보다 ‘씨족/족속’에 가깝기 때문에, 행정·족보적 뉘앙스를 살려 ‘씨족’으로 옮겼습니다.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  english_pob_choice: Manasseh in Bashan
  chosen_korean: 바산에 있는 므낫세 지파
  alternatives_korean:
  - 바산의 므낫세
  - 바산에 있는 므낫세
  lexicon: HALOT
  rationale: 히브리어는 ‘므낫세, 바산에’ 정도로 간결하지만, 한국어에서는 소속과 지명을 분명히 하도록 ‘바산에 있는 므낫세 지파’로 자연스럽게 풀었습니다.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  english_pob_choice: thirteen cities
  chosen_korean: 열세 성읍
  alternatives_korean:
  - 13 성읍
  - 열세 도시
  lexicon: HALOT
  rationale: 히브리어의 수량 표현을 따라 성읍 수를 직역했고, 성경적 행정 단위로는 ‘도시’보다 ‘성읍’이 더 정확합니다.
theological_decisions:
- issue: ‘half-tribe’가 본문에 명시되지 않은 점
  chosen_reading: 본문은 단순히 ‘므낫세 지파’라고 옮기고, 절 안에는 ‘반 지파’를 넣지 않았습니다.
  alternative_readings:
  - ‘므낫세 반 지파’
  - ‘바산의 반 지파 므낫세’
  rationale: 영어 POB 주석처럼 이는 배경상 가능하지만 히브리어 본문에 직접 적힌 표현은 아니므로, 본문은 절제해 옮기는 편이 source-direct합니다.
  doctrine_reference: 본문 충실성 원칙
