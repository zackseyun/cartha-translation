revisions:
- from: 그리고 요단 동쪽 여리고 맞은편, 르우벤 지파에게는 광야의 베셀과 그 목초지, 그리고 야하스와 그 목초지가 있었습니다.[a]
  to: 또 여리고 맞은편, 곧 요단 동쪽의 르우벤 지파에서 광야의 베셀과 그 목초지와 야하사와 그 목초지를 받았습니다.[a]
  rationale: ‘르우벤 지파에서’로 출처·할당 관계를 보존하고, 목록 문맥상 생략된 수여 동사 ‘받았습니다’를 보충했습니다. 지리적 동격 관계는 ‘여리고 맞은편, 곧 요단 동쪽’으로 명료하게 했으며, יַהְצָה는 ‘야하사’로 음역했습니다.
  reviewer_model: gpt-5.6-terra
