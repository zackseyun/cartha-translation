id: 1CH.6.63
reference: 1 Chronicles 6:63
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֣ן יְרֵחוֹ֮ לְ/מִזְרַ֣ח הַ/יַּרְדֵּן֒ מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֥צֶר בַּ/מִּדְבָּ֖ר וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
  footnotes:
  - marker: a
    text: Jahzah is also rendered 'Jahaz' in some English translations.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 여리고 맞은편, 곧 요단 동쪽의 르우벤 지파에서 광야의 베셀과 그 목초지와 야하사와 그 목초지를 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 야하사는 영어 번역들에서 ‘Jahaz’로도 음역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ לְמִזְרַח הַיַּרְדֵּן
  english_pob_choice: And beyond the Jordan at Jericho, east of the Jordan
  chosen_korean: 그리고 요단 동쪽 여리고 맞은편
  alternatives_korean:
  - 그리고 요단을 건너 여리고 맞은편
  - 여리고에서 요단 건너편 동쪽
  lexicon: HALOT
  rationale: 지리적 기준점인 여리고와 요단의 동쪽을 자연스러운 한국어 어순으로 묶어, ‘beyond/east of the Jordan’의 방향성과 위치를 함께 살렸습니다.
- source_word: מִמַּטֵּה רְאוּבֵן
  english_pob_choice: from the tribe of Reuben
  chosen_korean: 르우벤 지파에게는
  alternatives_korean:
  - 르우벤 지파로부터
  - 르우벤 지파에서
  lexicon: HALOT
  rationale: 문맥상 할당 목록의 소속을 나타내므로 ‘~에게는’으로 처리해 분배된 지파 구역임을 분명히 했습니다.
- source_word: בֶּצֶר בַּמִּדְבָּר
  english_pob_choice: Bezer in the wilderness
  chosen_korean: 광야의 베셀
  alternatives_korean:
  - 광야에 있는 베셀
  - 베셀 광야
  lexicon: HALOT
  rationale: 지명 ‘베셀’을 음역하고, בַּמִּדְבָּר의 장소 표지를 간결하게 ‘광야의’로 옮겨 위치 관계를 유지했습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: with its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 목초지
  - 그 방목지
  lexicon: HALOT
  rationale: 레위 성읍 목록에서 מִגְרָשׁ는 성읍에 딸린 개방지/목초지를 가리키므로, POB의 ‘pasturelands’를 따라 ‘목초지’로 옮겼습니다.
- source_word: יַהְצָה
  english_pob_choice: Jahzah
  chosen_korean: 야하스
  alternatives_korean:
  - 야하자
  - 자하스
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역하되, 영어 POB의 ‘Jahzah’ 변이형을 반영해 ‘야하스’로 적었습니다.
theological_decisions:
- issue: 이 구절의 반복되는 ‘목초지’와 지파 할당 표현
  chosen_reading: 성읍 이름과 그에 딸린 목초지를 함께 제시하는 행정·지리 목록으로 읽었습니다.
  alternative_readings:
  - 단순한 지명 열거로만 읽는 방식
  - ‘목초지’를 부속 마을 정도로 완화하는 방식
  rationale: 본문은 레위 성읍의 할당 경계를 실제 토지 단위로 서술하므로, 부속 토지의 실재성을 드러내는 번역이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 민수기 35장 및 여호수아 21장의 레위 성읍/목초지 규정
