    text: 야하사는 영어 번역들에서 ‘Jahaz’로도 음역됩니다.
    reason: lexical_alternative
  revision_rationale: ‘르우벤 지파에서’로 출처·할당 관계를 보존하고, 목록 문맥상 생략된 수여 동사 ‘받았습니다’를 보충했습니다. 지리적 동격 관계는 ‘여리고 맞은편, 곧 요단 동쪽’으로 명료하게 했으며, יַהְצָה는 ‘야하사’로 음역했습니다.
