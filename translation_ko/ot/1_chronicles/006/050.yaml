theological_decisions:
- issue: 제비뽑기라는 분배 방식의 표현
  chosen_reading: ‘제비로’라고 직역에 가깝게 유지해, 분배가 인간의 임의가 아니라 제도화된 추첨 방식이었음을 드러냈습니다.
  alternative_readings:
  - ‘분배하여’
  - ‘뽑아 나누어’
  rationale: 본문의 גורל은 단순한 행정 배분이 아니라 제비뽑기라는 절차를 가리키므로, 그 절차성을 지우지 않는 번역을 택했습니다.
  doctrine_reference: 민수기 26:55-56; 잠언 16:33
