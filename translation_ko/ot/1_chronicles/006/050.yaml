- from: 그들은 유다 지파와 시므온 지파와 베냐민 지파에서 제비로 이 성읍들을 나누어 주었습니다. 이 성읍들은 이름대로 불렸습니다.[a]
  to: 그들은 유다 자손의 지파와 시므온 자손의 지파와 베냐민 자손의 지파에서 이 성읍들을 제비로 할당했으며, 이 성읍들을 이름으로 불렀습니다.[a]
  rationale: 명명 절의 능동성 및 ‘이름들로 부르다’라는 명단 도입 공식을 보존하도록 고쳤습니다. 또한 제비에 따른 배정의 행정적 의미를 ‘할당했습니다’로 명확히 했고, 부족 계통 표현에 있는 ‘자손’을 반영했습니다.
