  source_fidelity: 초안은 모ושבֹת을 ‘거주지’로, גְּבוּל을 공간적 영역으로, הַגּוֹרָל을 제비에 따른 배정으로 옮긴 점은 적절합니다. 그러나 ‘그들의 거주지들이며, 그들의 정착지들 안에 있는 그들의 거처입니다’는 모ושבֹת과 טִירוֹת을 부자연스럽게 중복시키고, לְטִירוֹתָם의 ‘~에 따른’ 관계를 ‘~ 안에 있는’으로 바꾸었습니다. 또한 בִּגְבוּלָם은 원문에 맞게 ‘영토 안에’로 분명히 반영하는 편이 낫습니다.
  naturalness: 초안의 첫 문장은 동의어인 ‘거주지’와 ‘거처’를 겹쳐 쓰고 소유 표현을 반복하여 현대 표준 한국어로 매우 어색합니다. 수정문은 원문의 수식 관계를 유지하면서도 합쇼체 문장으로 자연스럽게 다듬었습니다.
  terminology: ‘아론의 자손’, ‘고핫 사람들의 가문’, ‘제비가 그들에게 돌아갔습니다’는 본문의 계보·분배 용어를 자연스럽고 중립적으로 전달합니다. טִירָה의 의미 범위는 ‘정착지’로 옮기되 각주에서 ‘진영’과 ‘마을’의 가능성을 보존합니다.
