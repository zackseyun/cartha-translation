id: 1CH.6.39
reference: 1 Chronicles 6:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ מוֹשְׁבוֹתָ֔/ם לְ/טִירוֹתָ֖/ם בִּ/גְבוּלָ֑/ם לִ/בְנֵ֤י אַהֲרֹן֙ לְ/מִשְׁפַּחַ֣ת הַ/קְּהָתִ֔י כִּ֥י לָ/הֶ֖ם הָיָ֥ה הַ/גּוֹרָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
  footnotes:
  - marker: a
    text: Or 'according to their encampments' or 'in their villages' for 'according to their settlements.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 그들의 거주지들이며, 그들의 정착지들 안에 있는 그들의 거처입니다. 아론의 아들들, 곧 고핫 사람들의 가족에게 속한 것이니, 제비가 그들에게 돌아갔기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  english_pob_choice: their dwelling places
  chosen_korean: 거주지들
  alternatives_korean:
  - 거처들
  - 주거지들
  lexicon: HALOT
  rationale: 주거의 장소를 가리키는 복수 명사로, 문맥상 결과물인 거주 공간을 자연스럽게 살리면서도 원문의 구체성을 유지합니다.
- source_word: לְטִירוֹתָם
  english_pob_choice: according to their settlements
  chosen_korean: 그들의 정착지들 안에 있는
  alternatives_korean:
  - 그들의 진영들에 따른
  - 그들의 마을들 안에 있는
  lexicon: HALOT
  rationale: טִירָה는 정착지, 진영, 성채화된 거주지를 가리킬 수 있으므로, 분배 문맥에서는 특정 형태를 과도하게 단정하지 않는 '정착지들'이 가장 무난합니다.
- source_word: בִּגְבוּלָם
  english_pob_choice: within their territory
  chosen_korean: 그들의 경계 안에 있는
  alternatives_korean:
  - 그들의 영토 안에 있는
  - 그들의 지역 안에 있는
  lexicon: HALOT
  rationale: גְּבוּל은 경계이면서 동시에 경계로 둘러싸인 구역을 뜻하므로, 한국어에서는 공간적 포함을 드러내는 표현으로 옮겼습니다.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  english_pob_choice: for the lot was theirs
  chosen_korean: 제비가 그들에게 돌아갔기 때문입니다
  alternatives_korean:
  - 제비가 그들의 것이었기 때문입니다
  - 그들에게 제비가 있었기 때문입니다
  lexicon: HALOT
  rationale: הַגּוֹרָל은 단순 소유가 아니라 분배 결과를 가리키므로, 한국어에서는 '돌아가다'로 배정의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 레위 계열 제사장 거주지의 분배를 제비뽑기로 표현하는 방식
  chosen_reading: '''제비가 그들에게 돌아갔기 때문입니다''로, 분배의 우연이 아니라 하나님이 정하신 할당이라는 문맥을 유지했습니다.'
  alternative_readings:
  - '''제비가 그들의 것이었기 때문입니다'''
  - '''제비가 그들에게 속했기 때문입니다'''
  rationale: 본문은 결과의 소유보다 분배 행위를 강조하므로, 제비뽑기라는 성경적 배정 방식이 자연스럽게 드러나도록 했습니다.
  doctrine_reference: 민수기 26:55-56; 여호수아 21장
