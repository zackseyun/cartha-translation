  to: 이것들은 그들의 영토 안에 있는 정착지에 따른[a] 그들의 거주지입니다. 이것들은 고핫 사람들의 가문에 속한 아론의 자손을 위한 것이니, 제비가 그들에게 돌아갔습니다.
  rationale: 중복된 거주 관련 표현을 제거하고, ‘정착지에 따른’으로 לְטִירוֹתָם의 관계를 보존했습니다. ‘그들의 영토 안에’로 בִּגְבוּלָם을 명시했으며, 아론의 자손이 고핫 가문에 속한다는 계보 관계와 제비에 따른 배정도 유지했습니다.
