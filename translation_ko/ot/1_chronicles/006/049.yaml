id: 1CH.6.49
reference: 1 Chronicles 6:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנ֥וּ בְנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם אֶת הֶ/עָרִ֖ים וְ/אֶת מִגְרְשֵׁי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/049.yaml
  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their common lands' or 'their surrounding lands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 아들들이 레위인들에게 그 성읍들과 그 목초지를 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 주변 땅들’ 또는 ‘그 공지들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 사람들(=이스라엘인들)
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살려 남성 복수 명사구를 보존했습니다. 문맥상 ‘이스라엘인들’도 가능하지만, 본문 형태를 더 직접적으로 드러내기 위해 ‘아들들’로 옮겼습니다.
- source_word: לַלְוִיִּם
  english_pob_choice: to the Levites
  chosen_korean: 레위인들에게
  alternatives_korean:
  - 레위 사람들에게
  lexicon: HALOT
  rationale: 레위 지파를 가리키는 통상적 표현이므로, 독자가 즉시 식별할 수 있는 ‘레위인들’로 옮겼습니다.
- source_word: הֶעָרִים
  english_pob_choice: the cities
  chosen_korean: 그 성읍들
  alternatives_korean:
  - 그 도시들
  - 그 마을들
  lexicon: HALOT
  rationale: 레위 성읍 분배 문맥에서 עָרִים는 단순한 도시보다 ‘성읍’이 더 정확하고 성경적 용례에도 잘 맞습니다.
- source_word: מִגְרְשֵׁיהֶם
  english_pob_choice: their pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 땅들
  - 그 공지들
  lexicon: HALOT
  rationale: מִגְרָשׁ의 핵심은 성읍에 딸린 열린 땅/주변 토지이므로, 용도까지 드러나는 ‘목초지’가 가장 자연스럽습니다.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל의 성별-직역성 유지
  chosen_reading: ‘이스라엘의 아들들’로 직역해 원문의 남성 복수 표지를 보존했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘인들’
  rationale: 이 절은 단순한 의미 전달보다 분배 행위의 주체를 원문 구조대로 보여 주는 것이 중요하므로, 관용화보다 형태 보존을 우선했습니다.
  doctrine_reference: 원문 충실성 및 성경 번역의 형태-의미 균형
- issue: מִגְרָשׁ의 공간 의미
  chosen_reading: ‘목초지들’로 옮겨 레위 성읍에 딸린 개방 토지의 기능을 드러냈습니다.
  alternative_readings:
  - ‘주변 땅들’
  - ‘공지들’
  rationale: 레위인에게 주어진 부속 토지는 단순한 경계선이 아니라 실제 활용 가능한 토지이므로, 읽는 이가 그 기능을 이해하도록 구체화했습니다.
  doctrine_reference: 구약 토지 분배 본문의 역사적-문맥적 의미
