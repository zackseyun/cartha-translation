  source_fidelity: 히브리어 원문은 ‘이스라엘의 아들들’이 레위인들에게 성읍들과 그 성읍들에 속한 מִגְרָשׁ들(목초지/부속 개방지)을 주었다고 말합니다. 초안은 행위자, 수여 대상, 성읍을 정확히 옮겼습니다. 다만 ‘그 목초지들’은 한국어에서 소유·귀속 관계가 충분히 드러나지 않아, 히브리어 접미사 -יהם이 가리키는 성읍들에 딸린 토지라는 관계를 명시하는 편이 안전합니다.
  naturalness: ‘이스라엘의 아들들’은 직역으로 다소 비관용적이지만, 원문의 표현을 보존하려는 번역 방침 및 대안 각주가 있으므로 유지할 수 있습니다. ‘그 성읍들에 딸린 목초지들’은 귀속 관계를 분명히 하면서도 현대 표준 한국어에서 자연스럽습니다.
