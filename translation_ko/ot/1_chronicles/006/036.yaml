lexical_decisions:
- source_word: בֻּקִּי
  english_pob_choice: Bukki
  chosen_korean: 부끼
  alternatives_korean:
  - 북기
  - 부키
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역하는 것이 원문 계보의 연속성을 가장 잘 살립니다. 영어 POB의 Bukki에 맞춰 한국어 음역은 ‘부끼’로 두었습니다.
- source_word: בְנ/וֹ
  english_pob_choice: his son
  chosen_korean: 의 아들
  alternatives_korean:
  - 그의 아들
  - 아들
  lexicon: HALOT
  rationale: 계보 공식의 소유격 관계를 자연스럽게 드러내되, 한국어에서는 반복되는 ‘그의’보다 ‘의 아들’이 더 간결하고 문맥에 맞습니다.
- source_word: עֻזִּי
  english_pob_choice: Uzzi
  chosen_korean: 웃시
  alternatives_korean:
  - 우찌
  - 우지
  lexicon: HALOT
  rationale: 고유명사 음역으로 처리하되, 표준 한국어 표기에서 가능한 한 원음에 가까운 ‘웃시’를 선택했습니다.
- source_word: זְרַחְיָה
  english_pob_choice: Zerahiah
  chosen_korean: 스라히야
  alternatives_korean:
  - 세라히야
  - 제라히야
  lexicon: HALOT
  rationale: 영어 POB의 Zerahiah에 대응하는 한국어 음역으로, 계보 목록에서 인물 식별성을 유지하는 방향을 택했습니다.
