  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: ko
  text: 이들은 아론의 아들들이었습니다. 엘르아살 그의 아들, 비느하스 그의 아들, 아비수아 그의 아들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these were
  chosen_korean: 이들은 …였습니다
  alternatives_korean:
  - 그리고 이들은 …였습니다
  - 이들은 …입니다
  lexicon: HALOT
  rationale: 족보 서술의 도입부이므로 연결사와 지시어를 자연스럽게 살려 과거 서술형으로 옮겼습니다.
- source_word: בְּנֵי אַהֲרֹן
  english_pob_choice: the sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론의 자손들
  - 아론의 후손들
  lexicon: HALOT
  rationale: 뒤따르는 연속된 부자 관계를 직접 가리키므로 ‘자손들’보다 ‘아들들’이 족보의 형식을 더 정확히 반영합니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아들의 그
  - 그의 자손
  lexicon: HALOT
  rationale: 소유 접미사가 표시하는 직접 계승 관계를 한국어의 자연스러운 친족 표현으로 옮겼습니다.
- source_word: אֲבִישׁוּעַ
  english_pob_choice: Abishua
  chosen_korean: 아비수아
  alternatives_korean:
  - 아비슈아
  lexicon: HALOT
  rationale: 히브리어 고유명사의 음가를 따르되, 한국어 음역은 현대 표기에서 자연스러운 ‘아비수아’를 택했습니다.
theological_decisions:
