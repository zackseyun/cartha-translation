translation:
  language: ko
  text: 또 욕므암[a]과 그 목초지들[b], 그리고 벧호론과 그 목초지들을 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘욕므암’으로 읽힙니다. 병행 지명 전승과 관련하여 일부 번역 전통은 ‘욕느암’으로 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘목초지들’은 성읍에 딸린 열린 땅, 곧 주변의 목초지 또는 공지를 가리킬 수 있습니다.
    reason: lexical_alternative
