  rationale: 레위 성읍 목록의 문맥에서 מִגְרָשׁ은 성읍에 딸린 열린 땅, 곧 목초지로 이해하는 것이 자연스럽습니다. 소유 대명사는 한국어에서 문맥상 반복을 줄여 자연스럽게 처리했습니다.
- source_word: בֵּית חוֹרוֹן
