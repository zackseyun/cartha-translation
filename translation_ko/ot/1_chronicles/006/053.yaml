  lexicon: HALOT
  rationale: 히브리어 자음형에 따른 고유지명 음역을 따랐고, 본문 전통의 형태를 한국어로 옮겼습니다. 병행 전승에서 보이는 다른 형태는 주석으로만 처리하는 편이 적절합니다.
- source_word: מִגְרָשֶׁיהָ
