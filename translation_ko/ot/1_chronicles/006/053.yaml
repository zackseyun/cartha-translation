  text: וְ/אֶֽת יָקְמְעָם֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בֵּ֥ית חוֹר֖וֹן וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/053.yaml
  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Jokmeam''; some English traditions read ''Jokneam'' in relation to parallel place-name traditions.'
    reason: alternative_reading
  - marker: b
    text: Or 'common lands' or 'surrounding pasturelands' for the land attached to each city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야콥므암과 그 목초지들, 그리고 벧호론과 그 목초지들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야콥므암’으로 읽히지만, 일부 전통은 병행 본문과의 연관으로 ‘요크네암’ 형태를 보입니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ‘목초지들’은 성읍에 딸린 열린 땅, 곧 주변의 목초지 또는 공지들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְמְעָם
  english_pob_choice: Jokmeam
  chosen_korean: 야콥므암
  alternatives_korean:
