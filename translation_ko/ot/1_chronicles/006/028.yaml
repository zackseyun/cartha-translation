  - 야하트
  lexicon: 고유명사 음역
  rationale: 히브리어 인명 יַחַת은 한국어 음역으로 ‘야핫’이 가장 무난하며, 영어 POB의 Jahath에 대응하는 표기를 따라가되 한국어 표준 음차에 맞췄습니다.
- source_word: גֵּרְשֹׁם
  english_pob_choice: Gershom
  chosen_korean: 게르솜
