translation:
  language: ko
  text: 야핫의 아들, 게르솜의 아들, 레위의 아들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 족보식으로 더 넓게는 ‘야핫의 후손 … 게르솜의 후손 … 레위의 후손’이라고 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘게르솜’이라고 읽습니다. 다른 족보 본문에서 기대되는 ‘게르손’과는 형태가 다릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - 자손
  lexicon: HALOT
  rationale: 족보 문맥에서 בֶּן은 기본적으로 친자 관계를 가리키는 ‘아들’로 옮기되, 한국어에서는 반복을 자연스럽게 이어 주기 위해 ‘A의 아들’ 구조를 유지했습니다.
- source_word: יַחַת
  english_pob_choice: Jahath
  chosen_korean: 야핫
