  lexicon: 고유명사 음역
  rationale: 원문 자음형은 גֵּרְשֹׁם이므로, 다른 족보의 유사 인명과 섞지 않고 이 절의 형태를 그대로 반영해 ‘게르솜’으로 옮겼습니다.
- source_word: לֵוִי
