  lexicon: 고유명사 음역
  rationale: 히브리어 לֵוִי는 한국어 성경에서 널리 쓰이는 ‘레위’를 사용해 독자의 인지 가능성을 높였습니다.
theological_decisions:
- issue: 족보식 축약 표현의 의미 범위
  chosen_reading: 문법상 직계 표현을 살리되, 족보 문맥에서 요구되는 경우 넓은 계보적 포함 가능성은 본문 밖에서만 열어 둡니다.
  alternative_readings:
  - ‘후손’으로 일반화해 세대 간 생략을 드러내기
  - 직계 아들 관계로만 엄격하게 제한하기
  rationale: 영어 POB도 본문은 ‘son of’를 유지하고, 주석에서만 더 넓은 족보식 용법 가능성을 언급합니다. 따라서 한국어 본문도 의미를 흐리지 않도록 직계형을 유지하는 것이 적절합니다.
  doctrine_reference: 족보 문맥의 문법적-서사적 관습
