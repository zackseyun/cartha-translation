translation:
  language: ko
  text: 아산[a]과 그 목초지, 벧세메스와 그 목초지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 평행 본문과 번역본은 여기서 ‘아인’을 읽지만, 역대기의 마소라 본문은 ‘아산’을 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  english_pob_choice: Ashan
  chosen_korean: 아산
  alternatives_korean:
  - 아인
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 적절하며, 역대기의 마소라 본문이 עָשָׁן을 읽으므로 본문형을 따라 아산으로 옮겼습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 들판
  - 그 공동지
  lexicon: HALOT
  rationale: מִגְרָשׁ는 성읍에 딸린 열린 땅, 곧 방목지/목초지로 쓰이므로 Levitical city 문맥에 맞게 ‘목초지들’로 옮겼습니다.
- source_word: בֵּית שֶׁמֶשׁ
  english_pob_choice: Beth-shemesh
  chosen_korean: 벧세메스
  alternatives_korean:
  - 태양의 집
  - 벧-세메스
  lexicon: HALOT
  rationale: 고유 지명은 번역하지 않고 통용되는 음역 형태로 옮겼습니다. 한국어 성경 관용을 고려해 하이픈 없는 ‘벧세메스’를 택했습니다.
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  - —
  lexicon: Hebrew grammar
  rationale: 히브리어의 반복된 목적격 표지는 한국어에서 생략하고, 목록의 연결은 자연스러운 접속으로 처리했습니다.
