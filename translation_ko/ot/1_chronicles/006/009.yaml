    rationale: 한국어 ‘사울’은 영어식 Saul과 Shaul의 철자 대립을 그대로 재현하지 않습니다. ‘사울’이 히브리어 철자를 더 직접적으로 옮긴 형태라는 설명은 적절하지 않습니다.
  revised_text: 그의 아들은 다핫이고, 그의 아들은 우리엘이고, 그의 아들은 웃시야이고, 그의 아들은 사울입니다.[a]
