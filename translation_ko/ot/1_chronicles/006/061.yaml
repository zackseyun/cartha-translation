base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
  footnotes:
  - marker: a
    text: Or 'common lands' for 'pasturelands'; the Hebrew refers to the open land belonging to each city.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 납달리 지파에서는: 갈릴리의 게데스와 그 목초지들[a], 함몬과 그 목초지들, 기랴다임과 그 목초지들입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목초지들’은 각 도시에 딸린 열린 땅을 가리키며, ‘방목지’ 또는 ‘공동지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  english_pob_choice: And from the tribe of
  chosen_korean: 그리고 납달리 지파에서는
  alternatives_korean:
  - 그리고 납달리의 지파에서
  - 그리고 납달리 가문에서는
  lexicon: HALOT
  rationale: 문맥상 מַטֶּה는 족속이 아니라 지파를 뜻하므로, 자연스러운 한국어로 ‘지파’로 옮겼습니다.
- source_word: קֶדֶשׁ בַּגָּלִיל
  english_pob_choice: Kedesh in Galilee
  chosen_korean: 갈릴리의 게데스
  alternatives_korean:
  - 갈릴리의 케데스
  - 갈릴리의 게데시
  lexicon: HALOT
  rationale: 고유지명 קֶדֶשׁ는 한국어 성서 관용에 맞춰 ‘게데스’로 옮기고, 지역 표지 בַּגָּלִיל은 소속/위치를 나타내는 ‘갈릴리의’로 자연스럽게 풀었습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 땅들
  - 그 공동지들
  lexicon: HALOT
  rationale: מִגְרָשׁ은 도시의 개방지/방목지를 가리키므로, POB의 ‘pasturelands’를 따라 의미를 살린 ‘목초지들’로 옮겼습니다.
- source_word: חַמּוֹן
  english_pob_choice: Hammon
  chosen_korean: 함몬
  alternatives_korean:
  - 하몬
  - 함몽
  lexicon: HALOT
  rationale: 고유지명은 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: קִרְיָתַיִם
  english_pob_choice: Kiriathaim
  chosen_korean: 기랴다임
  alternatives_korean:
  - 키랴타임
  - 기랴타임
  lexicon: HALOT
  rationale: 고유지명은 히브리어 자음 구조를 반영해 ‘기랴다임’으로 음역했습니다.
