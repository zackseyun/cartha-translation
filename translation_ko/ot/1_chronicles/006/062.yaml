base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
  footnotes:
  - marker: a
    text: Hebrew reads 'Rimmono'; the parallel in Joshua 21:35 has 'Dimnah.'
    reason: textual_variant
translation:
  language: ko
  text: 므라리의 남은 자손에게는 스불론 지파에서 림모노와 그 목초지, 다볼과 그 목초지가 주어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘림모노’로 읽지만, 여호수아 21:35의 병행 구절에는 ‘디므나’가 나옵니다.
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי
  english_pob_choice: To the sons of
  chosen_korean: ~의 자손에게는
  alternatives_korean:
  - ~에게
  - ~의 아들들에게
  lexicon: HALOT
  rationale: 분배 목록의 수여 대상을 자연스럽게 드러내기 위해 여격적 의미를 살려 옮겼습니다.
- source_word: הַנּוֹתָרִים
  english_pob_choice: who remained
  chosen_korean: 남은
  alternatives_korean:
  - 남아 있는
  - 남겨진
  lexicon: HALOT
  rationale: 이미 앞선 분배에서 제외되고 남아 있는 집단이라는 뜻을 간결하게 살렸습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 땅들
  - 그 들판들
  lexicon: HALOT
  rationale: 레위 성읍 목록에서 מִגְרָשׁ는 단순한 ‘주변 땅’보다 성읍에 딸린 목초지/초지가 더 구체적이므로 이를 택했습니다.
- source_word: רִמּוֹנוֹ
  english_pob_choice: Rimmono
  chosen_korean: 림모노
  alternatives_korean:
  - 디므나
  lexicon: HALOT
  rationale: 본문의 마소라 본문 표기를 따라 지명으로 음역했으며, 병행 본문과의 차이는 주석으로 처리하는 편이 적절합니다.
- source_word: תָּבוֹר
  english_pob_choice: Tabor
  chosen_korean: 다볼
  alternatives_korean:
  - 타볼
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 쓰이는 지명 표기를 따랐습니다.
theological_decisions:
- issue: 지파 분배 목록의 소유/할당 뉘앙스
  chosen_reading: ‘에게는’으로 옮겨, 성읍과 목초지가 레위 자손에게 배정되는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘에게’
  - ‘위하여’
  rationale: 이 구절은 단순한 위치 설명이 아니라 레위 성읍 분배의 결과를 기록하므로 할당의 의미가 드러나야 합니다.
  doctrine_reference: 민수기 35장; 여호수아 21장
