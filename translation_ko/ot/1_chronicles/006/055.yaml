base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
  footnotes:
  - marker: a
    text: Hebrew Bileam; the parallel in Joshua 21:25 reads Ibleam.
    reason: textual_variant
translation:
  language: ko
  text: 또 므낫세 반지파에서 아넬과 그 목초지, 빌르암과 그 목초지를 남아 있는 고핫 자손의 가문을 위하여 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘빌르암’으로 읽히지만, 여호수아 21:25의 평행 본문은 ‘이블르암’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  english_pob_choice: And from the half-tribe of Manasseh
  chosen_korean: 그리고 므낫세 반지파에서는
  alternatives_korean:
  - 그리고 므낫세의 반쪽 지파에서는
  - 그리고 므낫세 반지파로부터
  lexicon: HALOT
  rationale: מַחֲצִית מַטֵּה는 지파의 절반 분파를 가리키므로 한국어에서는 관용적이고 자연스러운 ‘반지파’로 옮겼습니다.
- source_word: אֶת מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 들판
  - 그 방목지들
  lexicon: HALOT
  rationale: מִגְרָשׁ은 레위 성읍에 딸린 개방지·목초지를 가리키므로, 문맥상 ‘목초지들’이 가장 직접적입니다.
- source_word: בִּלְעָם
  english_pob_choice: Bileam
  chosen_korean: 빌르암
  alternatives_korean:
  - 비레암
  - 이블르암
  lexicon: proper noun
  rationale: 히브리어 자음형을 따라 음역하되, 여호수아 21:25의 이블르암과 대응 가능성은 각주로 따로 남겼습니다.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  english_pob_choice: for the clan of the remaining sons of Kohath
  chosen_korean: 남은 그핫 자손의 종족을 위한
  alternatives_korean:
  - 남아 있는 그핫 자손의 가문을 위한
  - 남은 그핫 자손의 가족들을 위한
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 혈연 집단을 가리키므로 ‘종족’으로 옮기고, הַנּוֹתָרִים는 아직 분배되지 않은 ‘남은’이라는 뜻을 살렸습니다.
theological_decisions:
- issue: 레위 성읍 분배의 종교적·행정적 성격
  chosen_reading: 이 구절은 단순한 지리 목록이 아니라, 야훼께서 정하신 레위 지파의 몫 배정을 기록하는 행정적·언약적 진술로 읽었습니다.
  alternative_readings:
  - 순수한 지명 목록으로만 읽는 것
  - 후대 편집의 단순 반복으로만 읽는 것
  rationale: 본문은 지명 나열처럼 보이지만, 레위인의 거처 배정이라는 제도적 배경이 분명하므로 그 기능을 드러내는 것이 स्रोत의 의미에 더 가깝습니다.
  doctrine_reference: 민수기 35장; 여호수아 21장
