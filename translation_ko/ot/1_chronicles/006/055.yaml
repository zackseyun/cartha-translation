  to: 또 므낫세 반지파에서 아넬과 그 목초지, 빌르암과 그 목초지를 남아 있는 고핫 자손의 가문을 위하여 주었습니다.[a]
  rationale: 원문의 배정 목록이라는 문체를 유지하면서, 한국어 문장 성립을 위해 문맥상 함축된 ‘주었습니다’만 보충했습니다. 원문에 명시되지 않은 ‘몫’은 삭제했고, מִשְׁפָּחָה를 ‘가문’으로, Kohath를 표준 음역 ‘고핫’으로 바로잡았습니다. 평행 본문의 지명 이문은 각주에 보존했습니다.
