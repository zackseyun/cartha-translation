    rationale: Kohath의 표준 한국어 성서식 표기는 ‘고핫’입니다. 고유명사 일관성과 독자 인지성을 위해 이를 따릅니다.
  - severity: low
    issue: ‘종족’의 의미 범위가 부정확하고 어색함
    rationale: מִשְׁפָּחָה는 이스라엘 지파 내부의 친족 집단을 뜻하므로 ‘가문’이 더 자연스럽고 정확합니다.
