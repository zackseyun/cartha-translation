translation:
  language: ko
  text: 그런데 그 성의 들과 그 목초지는 그들이 여분네의 아들 갈렙에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֲצֵרֶיהָ는 이 분깃 문맥에서 '그 마을들' 또는 '그 정착지들'로도 옮길 수 있습니다. 다만 여기서는 도시 주변에 딸린 토지를 가리키는 기능적 의미를 따라 '그 목초지'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
