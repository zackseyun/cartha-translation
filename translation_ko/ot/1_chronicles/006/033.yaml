id: 1CH.6.33
reference: 1 Chronicles 6:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
  footnotes:
  - marker: a
    text: Or "were given"; the Hebrew participle is literally "given," here in the sense of being assigned or appointed to duty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 형제인 레위 사람들은 야훼의 집 장막의 모든 일을 맡도록 지정되었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주어졌다’; 히브리어 분사는 문자적으로는 ‘주어진’이며, 여기서는 직무를 위해 배정되거나 지정된 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제인
  alternatives_korean:
  - 그들의 친족인
  - 그리고 그들의 형제인
  lexicon: HALOT
  rationale: אֲחֵי with 3mp suffix는 혈족뿐 아니라 같은 집단의 구성원을 가리킬 수 있어, 한국어에서는 직역에 가까운 ‘형제’로 두되 문맥을 살려 서술적으로 연결했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들은
  alternatives_korean:
  - 레위인들은
  - 레위 지파 사람들은
  lexicon: HALOT
  rationale: 족속/지파 명칭으로서 한국어 성경에서 널리 통용되는 ‘레위 사람들’이 가장 자연스럽고 분명합니다.
- source_word: נְתוּנִים
  english_pob_choice: were appointed
  chosen_korean: 맡도록 지정되었습니다
  alternatives_korean:
  - 임명되었습니다
  - 배정되었습니다
  - 주어졌습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘주어짐’이지만, 여기서는 성전 봉사를 위한 직무 배정을 뜻하므로 기능을 드러내는 ‘지정되었습니다’로 옮겼습니다.
- source_word: מִשְׁכַּן בֵּית הָאֱלֹהִים
  english_pob_choice: the tabernacle of the house of God
  chosen_korean: 야훼의 집 장막
  alternatives_korean:
  - 하나님의 집 장막
  - 하나님의 집의 성막
  - 성막인 하나님의 집
  lexicon: HALOT
  rationale: מִשְׁכָּן과 בֵּית הָאֱלֹהִים을 분리해 살리되, 한국어에서는 결합 구조를 자연스럽게 풀어 ‘야훼의 집 장막’으로 옮겼습니다. POB의 ‘house of God’는 한국어 독자에게 더 직접적인 소유관계로 읽히도록 했습니다.
theological_decisions:
- issue: מִשְׁכַּן과 בֵּית הָאֱלֹהִים의 이중 표현
  chosen_reading: ‘야훼의 집 장막’으로 두 표현을 함께 살리되, ‘성전’으로 단일화하지 않았습니다.
  alternative_readings:
  - ‘하나님의 집의 장막’
  - ‘성전’
  rationale: 역대기의 문맥에는 성막과 하나님의 집 언어가 함께 남아 있으므로, 둘을 하나로 합치면 원문의 긴장과 층위가 사라집니다.
  doctrine_reference: Translation philosophy §3, §5
