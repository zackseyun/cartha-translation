base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/001.yaml
  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
  footnotes:
  - marker: a
    text: Hebrew genealogical language often uses 'sons' for direct sons or, in some contexts, broader descendants. Here the context indicates Levi's immediate sons.
    reason: cultural_note
  - marker: b
    text: The Hebrew text reads 'Gershom'; some English traditions use the spelling 'Gershon' in related passages.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위의 아들들은 게르솜, 고핫, 그리고 므라리입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보 표현에서는 ‘아들들’이 직접 아들뿐 아니라 넓은 의미의 후손을 가리킬 수도 있지만, 여기서는 레위의 직계 아들들을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 이 구절의 히브리어 본문은 ‘게르솜’이라고 읽습니다. 관련 계보 본문들에서는 ‘게르숀’ 철자가 쓰이기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 자녀들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 아들을 가리키는 것이 자연스러우므로, 관계를 분명히 드러내는 ‘아들들’을 택했습니다.
- source_word: לֵוִי
  english_pob_choice: Levi
  chosen_korean: 레위
  alternatives_korean:
  - 리바이
  lexicon: HALOT
  rationale: 성경에서 널리 굳어진 인명 표기이므로 ‘레위’로 옮겼습니다.
- source_word: גֵּרְשֹׁם
  english_pob_choice: Gershom
  chosen_korean: 게르솜
  alternatives_korean:
  - 게르숀
  lexicon: HALOT
  rationale: 히브리어 자음형에 맞추어 ‘게르솜’으로 옮겼고, 관련 계보 본문에서 보이는 다른 표기는 보조적 변이입니다.
- source_word: קְהָת
  english_pob_choice: Kohath
  chosen_korean: 고핫
  alternatives_korean:
  - 그핫
  lexicon: HALOT
  rationale: 표준 성경 인명 표기인 ‘고핫’을 따랐습니다.
- source_word: מְרָרִי
  english_pob_choice: Merari
  chosen_korean: 므라리
  alternatives_korean:
  - 메라리
  lexicon: HALOT
  rationale: 히브리어 이름 מְרָרִי의 통용되는 음역을 따라 ‘므라리’로 옮겼습니다.
