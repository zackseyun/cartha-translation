source:
  edition: WLC
  text: וְֽ/אַהֲרֹ֨ן וּ/בָנָ֜י/ו מַקְטִירִ֨ים עַל מִזְבַּ֤ח הָֽ/עוֹלָה֙ וְ/עַל מִזְבַּ֣ח הַ/קְּטֹ֔רֶת לְ/כֹ֕ל מְלֶ֖אכֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים וּ/לְ/כַפֵּר֙ עַל יִשְׂרָאֵ֔ל כְּ/כֹל֙ אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד הָ/אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
  footnotes:
  - marker: a
    text: Or 'the holy of holies'; the Hebrew phrase can also denote 'the most holy things' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론과 그의 아들들은 번제단과 향단에서 분향하고, 지성소의 모든 일과 이스라엘을 속죄하기 위해 일했습니다. 이는 하나님의 종 모세가 명령한 모든 것에 따른 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지성소’는 문맥에 따라 ‘지극히 거룩한 것들’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְטִירִים
  english_pob_choice: were offering
  chosen_korean: 분향하고
  alternatives_korean:
  - 제사를 드리고
  - 향을 피우고
  lexicon: HALOT
  rationale: קטר의 핵심은 불에 올려 연기로 올라가게 하는 제의 행위이므로, 이 절의 번제단과 향단을 함께 살려 ‘분향하고’로 옮기면 제의적 행위를 간결하게 드러낼 수 있습니다.
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제물을 드리는 제단
  lexicon: HALOT
  rationale: 히브리어의 정형화된 제의 용어이므로 한국어 성경에서 널리 통용되는 ‘번제단’이 가장 자연스럽고 정확합니다.
- source_word: מִזְבַּח הַקְּטֹרֶת
  english_pob_choice: the altar of incense
  chosen_korean: 향단
  alternatives_korean:
  - 분향단
  - 향을 피우는 제단
  lexicon: HALOT
  rationale: 성소 기구를 가리키는 관용 표현으로 ‘향단’이 간결하면서도 문맥상 명확합니다.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: the Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: HALOT
  rationale: 이 구문은 문맥상 성소의 가장 안쪽 공간을 가리키는 말로 읽히므로, 한국어의 정착된 제의 용어인 ‘지성소’를 채택했습니다.
theological_decisions:
- issue: וּלְכַפֵּר עַל יִשְׂרָאֵל의 의미
  chosen_reading: ‘이스라엘을 속죄하기 위해’로 옮겨 제의적·언약적 기능을 보존했습니다.
  alternative_readings:
  - 이스라엘을 위해 속죄하기
  - 이스라엘의 속죄를 위해
  rationale: כפר는 이 문맥에서 단순한 사과나 배상이 아니라 제사장적 속죄 행위를 가리키므로, 그 제의적 무게를 유지하는 표현이 적절합니다.
  doctrine_reference: 'Translation philosophy: 보장된 제의 용어의 신학적 중립성 유지'
- issue: עֶבֶד הָאֱלֹהִים의 번역
  chosen_reading: ‘하나님의 종’으로 옮겨 모세의 공적 지위를 살렸습니다.
  alternative_readings:
  - 하나님께 속한 종
  - 하나님의 일꾼
  rationale: 이 표현은 모세에 대한 공식 칭호이므로, 전통적이면서도 직역에 가까운 ‘하나님의 종’이 가장 적합합니다.
  doctrine_reference: 인물 칭호의 관용적 성경 표현 유지
