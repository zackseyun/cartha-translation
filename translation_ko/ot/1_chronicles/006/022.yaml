  rationale: 족보 문맥에서 בְּנֵי는 직계 또는 계보상의 아들들을 가리키므로, POB의 'sons of'에 맞춰 가장 직접적인 '아들들'로 옮겼습니다.
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형들
  - 그의 형제들
  lexicon: HALOT
  rationale: 이 반복 구조는 각 이름군에 속한 동류 집단을 표시하므로, 관계를 분명히 드러내는 '그의 형제들'이 가장 자연스럽습니다.
- source_word: שֵׁם־שֵׁם
  english_pob_choice: name-name list implied by genealogy
  chosen_korean: 이러합니다 / …요
  alternatives_korean:
  - 명단은 이렇습니다
  - 이름들은 이렇습니다
  lexicon: project style
  rationale: 히브리어 족보의 열거형 구조를 한국어로 자연스럽게 살리기 위해, 각 항목을 '…요'로 연결하는 목록체를 사용했습니다.
theological_decisions:
- issue: 족보를 단순 열거로 보존할지, 자연스러운 설명형으로 풀지 여부
  chosen_reading: 서술을 최소화하고 이름의 연속과 친족 관계를 그대로 보여 주는 족보 문체를 유지했습니다.
  alternative_readings:
  - 다윗의 후손들은 이러합니다
  - 다윗의 계보는 이렇습니다
  rationale: 원문은 교훈적 설명이 아니라 계보 기록이므로, 의미를 덧붙이지 않고 목록의 형식을 보존하는 것이 본문 의도에 가장 충실합니다.
