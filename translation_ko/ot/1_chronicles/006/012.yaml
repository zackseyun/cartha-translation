  rationale: 족보 문맥의 בֵּן + 3인칭 남성 소유격은 소유를 표시하는 속격 구조로 옮겨, 영어 POB의 반복된 계보 형식을 한국어에서도 간결하게 살렸습니다.
- source_word: יְרֹחָם
