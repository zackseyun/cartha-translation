- source_word: אֶלְקָנָה
  english_pob_choice: Elkanah
  chosen_korean: 엘가나
  alternatives_korean:
  - 엘가난
  - 엘가나
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리했고, 족보 항목의 연속성을 해치지 않도록 동일한 문장 구조를 유지했습니다.
theological_decisions:
- issue: 족보식 반복 구조의 보존
  chosen_reading: 서술 동사 없이 ‘X의 아들, Y의 아들, Z의 아들’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘엘리압의 아들 여호람, 여호람의 아들 엘가나’처럼 재구성함
  - ‘엘리압, 여호람, 엘가나’처럼 단순 나열함
  rationale: 히브리어 원문은 소유 접미사와 반복을 통해 계보의 연쇄를 보여 주므로, 이를 한국어에서도 그대로 드러내는 것이 본문의 의도를 가장 잘 보존합니다.
  doctrine_reference: 족보 본문 해석 원칙
- issue: 인명 음역의 전통형보다 원형 근접형 선택
  chosen_reading: 한국 교회 전통형보다 원문 음가를 더 가깝게 반영한 음역을 사용했습니다.
  alternative_readings:
  - 전통적 한국어 성경 인명 표기 사용
  rationale: 이 단락은 교리적 쟁점이 아니라 본문 추적성의 문제이므로, 원문과의 대조가 쉬운 표기를 택했습니다.
  doctrine_reference: 본문 충실성 원칙
