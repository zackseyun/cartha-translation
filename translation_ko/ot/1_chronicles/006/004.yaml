id: 1CH.6.4
reference: 1 Chronicles 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מֻשִׁ֑י וְ/אֵ֛לֶּה מִשְׁפְּח֥וֹת הַ/לֵּוִ֖י לַ/אֲבוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
  footnotes:
  - marker: a
    text: Or “families” for “clans.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally “according to their fathers”; the sense in this genealogical context is classification by paternal houses or ancestral households.
    reason: cultural_note
translation:
  language: ko
  text: 므라리의 아들들은 마흘리와 무시입니다. 이것들은 그들의 아버지들의 집에 따른 레위인들의 종족들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종족들’은 여기서 מִשְׁפְּחוֹת의 뜻을 살린 것으로, 문맥상 ‘가문들’ 또는 ‘가족들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 아버지들에게/에 따라’에 가깝지만, 족보 문맥에서는 부계 집안에 따른 분류를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 자녀를 가리키는 표준 도입구이므로, 한국어도 간결하게 ‘아들들’로 옮겨 계보 목록의 형식을 살렸습니다.
- source_word: מִשְׁפְּחוֹת
  english_pob_choice: the clans
  chosen_korean: 종족들
  alternatives_korean:
  - 가문들
  - 씨족들
  - 가족들
  lexicon: HALOT
  rationale: 족보·지파 맥락에서 מִשְׁפָּחוֹת는 단순한 핵가족보다 큰 친족 단위를 가리키므로, 교회적 관용어보다 사회구조를 드러내는 ‘종족들’로 처리했습니다.
- source_word: הַ/לֵּוִי
  english_pob_choice: the Levites
  chosen_korean: 레위인들의
  alternatives_korean:
  - 레위 사람들의
  - 레위 지파의
  lexicon: HALOT
  rationale: 문맥상 레위 전체 친족 집단을 가리키므로 복수 집합 의미를 살려 ‘레위인들의’로 옮겼습니다. 이는 영어 POB의 수정(‘Levite’→‘Levites’)과도 맞습니다.
- source_word: לַ/אֲבוֹתֵי/הֶם
  english_pob_choice: according to their fathers’ houses
  chosen_korean: 그들의 아버지들의 집에 따른
  alternatives_korean:
  - 그들의 조상 집안에 따른
  - 그들의 부계 가문에 따른
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 아버지들에게/에 따라’이지만, 족보 분류 기준이 부계 가문임을 드러내기 위해 ‘아버지들의 집’ 구조를 유지했습니다. 한국어에서는 다소 직역적이지만 원문의 제도적 의미를 보존합니다.
theological_decisions:
- issue: 레위인 집단 표지의 범위
  chosen_reading: 개별 ‘레위인’이 아니라 족보 전체의 집합인 ‘레위인들’로 읽었습니다.
  alternative_readings:
  - 레위 사람
  - 레위 지파
  rationale: 히브리어 문맥은 특정 개인이 아니라 족보적 분류를 제시하므로, 집합적 복수 표현이 원문의 범위를 더 정확히 반영합니다.
  doctrine_reference: 족보/언약 공동체의 계보적 표지
