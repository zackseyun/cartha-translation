revisions:
- from: 므라리의 아들들은 마흘리와 무시입니다. 이것들은 그들의 아버지들의 집에 따른 레위인들의 종족들입니다.[a][b]
  to: 므라리의 아들들은 마흘리와 무시입니다. 이들은 그들의 조상 집안에 따른[b] 레위 사람들의 씨족들입니다.[a]
  rationale: 인명과 계보 도입부는 유지했습니다. 다만 מִשְׁפְּחוֹת의 친족 집단 의미를 ‘씨족들’로 정확히 하고, 요약 지시사를 자연스럽게 다듬었으며, 히브리어의 ‘아버지들에 따라’라는 족보 관용구는 한국어에서 명확한 ‘조상 집안에 따른’으로 옮겼습니다. 각 주석 표지는 해당 표현 바로 뒤에 배치했습니다.
