    text: ‘씨족들’은 여기서 מִשְׁפְּחוֹת의 뜻을 살린 것으로, 문맥상 ‘가문들’ 또는 ‘가족 집단들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 아버지들에 따라’라고 말합니다. 족보 문맥에서는 부계 조상 또는 조상 집안에 따른 분류를 뜻합니다.
    reason: cultural_note
  revision_rationale: 인명과 계보 도입부는 유지했습니다. 다만 מִשְׁפְּחוֹת의 친족 집단 의미를 ‘씨족들’로 정확히 하고, 요약 지시사를 자연스럽게 다듬었으며, 히브리어의 ‘아버지들에 따라’라는 족보 관용구는 한국어에서 명확한 ‘조상 집안에 따른’으로 옮겼습니다. 각 주석 표지는 해당 표현 바로 뒤에 배치했습니다.
