base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/005.yaml
  text: 'To Gershom: Libni his son, Jahath his son, Zimmah his son.'
translation:
  language: ko
  text: 게르손의 아들은 리브니였고, 리브니의 아들은 야핫이었으며, 야핫의 아들은 지마였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  english_pob_choice: To Gershom
  chosen_korean: 게르손에게는
  alternatives_korean:
  - 게르손에게
  - 게르손으로
  lexicon: HALOT
  rationale: 족보 항목의 표제 기능을 살리기 위해 방향성 ל를 한국어 조사로 자연스럽게 처리했습니다. 본문은 인물명 게르손을 중심으로 이어지는 계보를 제시하므로 ‘에게는’이 가장 간결합니다.
- source_word: לִבְנִי
  english_pob_choice: Libni
  chosen_korean: 리브니
  alternatives_korean:
  - 립니
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역했습니다. 한국어 성경에서 비교적 통용되는 ‘리브니’를 택했습니다.
- source_word: בְנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아들
  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 소유 접미사를 드러내어 족보의 직계 계승을 분명히 했습니다. 반복되는 구조이므로 매번 직역형으로 유지했습니다.
- source_word: זִמָּה
  english_pob_choice: Zimmah
  chosen_korean: 지마
  alternatives_korean:
  - 짐마
  lexicon: HALOT
  rationale: 여기서는 일반명사가 아니라 인명으로 기능하므로 뜻풀이하지 않고 음역했습니다. 한국어 성경 관행에 따라 ‘지마’를 사용했습니다.
theological_decisions:
- issue: 족보의 압축형 서술 유지
  chosen_reading: ‘게르손에게는 … 그의 아들 …’이라는 짧은 계보 목록 형식을 그대로 살렸습니다.
  alternative_readings:
  - 서술형으로 풀어 쓰기
  - ‘~의 자손’으로 일반화하기
  rationale: 본문은 설명문이 아니라 계보 등록이므로, 인물 간 관계를 최소한의 어휘로 정확히 보존하는 편이 원문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 성경 족보의 역사성 및 문맥 보존 원칙
