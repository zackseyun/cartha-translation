  source_fidelity: 원문은 게르손의 계보를 제시하며, 리브니-야핫-지마로 이어지는 각 세대의 부자 관계를 반복된 ‘그의 아들’로 표시합니다. 초안의 ‘르우벤 사람’은 히브리어 본문과 영어 감사 기록 어디에도 없으므로 삭제해야 합니다. 또한 한국어에서 반복되는 ‘그의’의 선행사가 불분명해질 수 있어 각 관계를 명시하는 것이 안전합니다.
  naturalness: 수정문은 현대 표준 한국어의 자연스러운 족보 서술이며, 문장 종결도 합쇼체입니다.
  terminology: 게르손, 리브니, 야핫, 지마는 통용되는 한국어 성경식 인명 표기와 조화됩니다. ‘아들’은 בְנוֹ의 직계 친자 관계를 정확히 나타냅니다.
