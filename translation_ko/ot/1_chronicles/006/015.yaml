  lexicon: 고유명사 표기
  rationale: 표준적인 한국어 음역 관행을 따라 인명으로 처리했습니다.
theological_decisions:
- issue: 계보식 반복 표현의 처리
  chosen_reading: “의 아들”을 반복하되, 한국어에서는 자연스러운 계보 표현으로 압축해 제시했습니다.
  alternative_readings:
  - “그의 아들”을 매번 반복하는 직역
  - “~의 아들”을 생략한 간명 번역
  rationale: 히브리어 원문은 successive descent를 드러내기 위해 동일한 계보 공식을 반복하지만, 한국어에서는 소유격 구조로 의미를 보존하면서도 과도한 반복을 줄이는 편이 읽기와 문체에 적절합니다.
  doctrine_reference: 족보/계보의 서술 관행
