  lexicon: 문법적 계보 सूत्र
  rationale: 히브리어의 소유 접미사를 한국어 소유격 구조로 옮겨 계보의 연속성을 자연스럽게 드러냈습니다.
- source_word: חַגִּיָּה
  english_pob_choice: Haggiah
  chosen_korean: 학기야
  alternatives_korean:
