  text: 시므아는 그의 아들이며,[a] 학기야는 그의 아들이며, 아사야는 그의 아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 계보 공식을 글자 그대로 반복하여 “그의 아들 … 그의 아들 … 그의 아들”이라고 합니다. 이는 계보에서 이어지는 부자 관계를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: שִׁמְעָא
  english_pob_choice: Shimea
  chosen_korean: 스마야
  alternatives_korean:
  - 시메아
  - 쉬메아
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사는 음역하되, 한국어 외래어 표기 관행에 따라 자음군과 모음값을 반영해 옮겼습니다.
