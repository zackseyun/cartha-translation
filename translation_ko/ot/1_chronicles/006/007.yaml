id: 1CH.6.7
reference: 1 Chronicles 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֖י קְהָ֑ת עַמִּינָדָ֣ב בְּנ֔/וֹ קֹ֥רַח בְּנ֖/וֹ אַסִּ֥יר בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/007.yaml
  text: 'The sons of Kohath: Amminadab his son[a], Korah his son, Assir his son.'
  footnotes:
  - marker: a
    text: Some compare parallel genealogies where the corresponding ancestor is named Izhar rather than Amminadab; the Hebrew text here reads Amminadab.
    reason: textual_variant
translation:
  language: ko
  text: 고핫의 아들들은 이러합니다. 암미나답, 그의 아들 고라, 그의 아들 아시르입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי קְהָת
  english_pob_choice: The sons of Kohath
  chosen_korean: 고핫의 아들들
  alternatives_korean:
  - 고핫의 자손들
  - 고핫의 후손들
  lexicon: HALOT
  rationale: 족보 서두의 관용적 표현을 따라 직역에 가깝게 옮겼습니다. '아들들'은 뒤따르는 반복 구조와도 자연스럽게 맞습니다.
- source_word: עַמִּינָדָב
  english_pob_choice: Amminadab
  chosen_korean: 암미나답
  alternatives_korean:
  - 아민나답
  - 아므미나답
  lexicon: standard transliteration
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: בְּנ֔/וֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그의 자손
  - 그의 후손
  lexicon: HALOT
  rationale: 히브리어의 3인칭 단수 소유 접미사가 붙은 בֵּן을 족보의 직계 계승 표현으로 살려 '그의 아들'로 옮겼습니다.
- source_word: קֹרַח
  english_pob_choice: Korah
  chosen_korean: 고라
  alternatives_korean:
  - 코라
  lexicon: standard biblical form
  rationale: 한국어 성경에서 널리 쓰이는 고유명사 형태를 따랐습니다.
- source_word: אַסִּיר
  english_pob_choice: Assir
  chosen_korean: 아시르
  alternatives_korean:
  - 앗시르
  lexicon: standard transliteration
  rationale: 고유명사는 음역으로 처리했습니다.
theological_decisions:
- issue: 족보의 계승 관계를 '아들'로 유지할지, 넓게 '후손'으로 완화할지
  chosen_reading: '''아들들''과 ''그의 아들''을 유지해 본문의 직계 족보 형식을 드러냈습니다.'
  alternative_readings:
  - 고핫의 후손들
  - 그의 후손
  rationale: 본문은 반복적으로 בְּנוֹ를 사용하여 계보의 연속성을 표시하므로, 이를 완화하면 문면의 구조가 흐려집니다.
  doctrine_reference: 본문의 족보 구조 보존
- issue: 본문의 계보가 다른 병행 전승과 다를 수 있는 점을 본문 안에서 조정할지
  chosen_reading: 주본문에는 마소라 본문의 인명 순서를 그대로 두고, 별도 각주를 두지 않았습니다.
  alternative_readings:
  - 병행 족보와 조화시키는 해석적 수정
  rationale: 영어 POB가 본문은 MT를 따르되 병행 전승 차이는 각주로 처리했으므로, 한국어 본문도 원문 증거를 우선했습니다.
  doctrine_reference: 본문비평 원칙
