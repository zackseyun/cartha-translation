  alternatives_korean:
  - 잇도
  - 이도
  lexicon: HALOT
  rationale: 고유명사는 표준 음역으로 처리했고, 영어 POB의 Iddo를 한국어 음운에 맞게 이두로 옮겼습니다.
- source_word: זֶרַח
  english_pob_choice: Zerah
  chosen_korean: 세라
  alternatives_korean:
  - 제라
  - 제라흐
  lexicon: HALOT
  rationale: 고유명사는 음역을 따르며, 본문의 자음형과 영어 POB의 Zerah를 반영해 세라로 옮겼습니다.
- source_word: יְאָתְרַי
  english_pob_choice: Jeatherai
  chosen_korean: 여아드래
  alternatives_korean:
  - 여드래
  - 예아드래
  - 여아데래
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 영어 POB가 제시한 Jeatherai와 대안 Jetherai의 변이를 고려하여 자음형을 살린 여아드래로 옮겼습니다.
