  rationale: 고유명사는 음역하는 것이 원문 계보의 형식을 가장 잘 보존하므로, 영어 POB의 Joah에 맞춰 한국어로는 요아로 옮겼습니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그 아들
  alternatives_korean:
  - 그의 아들
  - 아들
  lexicon: HALOT
  rationale: 히브리어 계보문의 בן+3인칭 접미사는 연속된 부자 관계를 표시하므로, 현대 한국어에서는 자연스러운 계보체 표현인 ‘그 아들’로 옮겼습니다.
- source_word: עִדּוֹ
