  verdict: revise
  source_fidelity: 히브리어의 접속사, ‘그의 형제’, 아삽의 오른쪽 위치, 그리고 ‘베레갸의 아들, 시므아의 아들’이라는 반복 계보 구조를 전반적으로 잘 반영합니다. 다만 שִׁמְעָא는 자음 ע를 포함한 이름이므로 ‘시마’보다 ‘시므아’가 더 충실한 음역입니다.
