id: 1CH.6.24
reference: 1 Chronicles 6:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָחִ֣י/ו אָסָ֔ף הָ/עֹמֵ֖ד עַל יְמִינ֑/וֹ אָסָ֥ף בֶּן בֶּרֶכְיָ֖הוּ בֶּן שִׁמְעָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
  footnotes:
  - marker: a
    text: Or 'to his right.' The Hebrew expression denotes position at someone's right side.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 형제 아삽은 그의 오른편에 서 있었습니다. 아삽은 베레갸의 아들, 시마의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오른편에’는 단순히 방향을 가리키기보다 사람의 오른쪽 자리, 곧 위치를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  english_pob_choice: And his brother
  chosen_korean: 그리고 그의 형제
  alternatives_korean:
  - 그리고 그의 동족
  - 그리고 그의 친족
  lexicon: HALOT
  rationale: אָח의 기본 의미를 살려 혈연 관계를 직접적으로 나타냈습니다. 이 문맥에서는 넓은 의미의 ‘친족’보다 ‘형제’가 원문 구조를 더 분명히 반영합니다.
- source_word: הָעֹמֵד
  english_pob_choice: stood
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 섰습니다
  - 서 있던
  lexicon: HALOT
  rationale: 분사형의 상태를 한국어에서는 진행·지속 상태를 나타내는 ‘서 있었습니다’로 자연스럽게 옮겼습니다. 단순 과거형보다 위치와 대기 상태를 함께 드러냅니다.
- source_word: עַל יְמִינוֹ
  english_pob_choice: at his right hand
  chosen_korean: 그의 오른편에
  alternatives_korean:
  - 그의 오른손에
  - 그의 오른쪽에
  lexicon: HALOT
  rationale: 이 관용구는 사람의 오른편 위치를 가리키므로, 한국어에서는 자연스러운 공간 표현인 ‘오른편에’로 옮겼습니다. 영어 주석의 뜻도 함께 반영됩니다.
- source_word: בֶּרֶכְיָהוּ
  english_pob_choice: Berechiah
  chosen_korean: 베레갸
  alternatives_korean:
  - 베레기야
  - 베라갸
  lexicon: 고유명사 음역
  rationale: 히브리어 인명은 현대 한국어 음역 관행에 따라 옮겼습니다. 기존 교회식 표기보다 원음에 가까운 형태를 우선했습니다.
- source_word: שִׁמְעָא
  english_pob_choice: Shimea
  chosen_korean: 시마
  alternatives_korean:
  - 시메아
  - 심아
  lexicon: 고유명사 음역
  rationale: 족보형 인명으로서 한국어 음역을 간명하게 처리했습니다. 반복되는 계보 구조를 해치지 않도록 짧고 일관된 표기를 택했습니다.
theological_decisions:
- issue: 족보 문장의 계보 표기 방식
  chosen_reading: ‘아삽은 베레갸의 아들, 시마의 아들입니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘아삽은 베레갸와 시마의 후손입니다’
  - ‘아삽은 베레갸의 손자 시마의 아들입니다’
  rationale: 원문은 בן을 반복하여 계보 연결을 단계적으로 제시합니다. 이를 압축하면 계보의 구조가 약해지므로, 반복을 살려 독자가 원문 계열을 그대로 추적하도록 했습니다.
  doctrine_reference: 족보/계보 문맥의 충실한 재현
- issue: ‘오른편’의 공간적 의미
  chosen_reading: ‘오른편’으로 옮겨 단순 방향이 아니라 자리 배치를 드러냈습니다.
  alternative_readings:
  - ‘오른손에’
  - ‘오른쪽에’
  rationale: 영어 주석이 밝히듯 이 표현은 사람의 오른쪽 자리(위치)를 뜻합니다. 한국어에서도 관용적이면서 본래의 배치 의미를 살리는 표현이 필요합니다.
  doctrine_reference: 문맥적 의미 보존
