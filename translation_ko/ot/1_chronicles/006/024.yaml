  terminology: ‘아삽’, ‘베레갸’, ‘시므아’를 사용합니다. 특히 ‘시므아’는 히브리어 שִׁמְעָא에 더 가까우며 한국어 성서 인명 표기와도 잘 부합합니다. 주석 표지는 해당 표현 바로 뒤에 두는 것이 적절합니다.
  issues:
