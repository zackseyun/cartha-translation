    rationale: 히브리어 마소라 본문을 고유명사로 따를 경우 הַבְּכוֹר는 바쉬니를 수식하는 것으로 옮기는 것이 자연스럽습니다. 현 문구는 ‘첫째’라는 이름 없는 인물, 바쉬니, 아비야를 열거하는 듯한 인상을 줍니다.
