translation:
  language: ko
  text: 그리고 사무엘의 아들들은 첫째, 바쉬니, 그리고 아비야입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 바쉬니. 이 구절은 ‘그리고 둘째’로도 이해할 수 있으며, 1사무엘 8:2는 사무엘의 아들들을 요엘과 아비야로 부릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 사무엘의 아들들은
  alternatives_korean:
  - 사무엘의 아들들은
  - 그리고 사무엘의 아들들은
  lexicon: WLC
  rationale: 족보 문맥에서 단순 소유보다 계보 소개 기능이 핵심이므로 ‘사무엘의 아들들’로 옮기되, 연결사 וּ는 계보의 흐름을 살려 ‘그리고’로 반영했습니다.
- source_word: הַבְּכֹר
  english_pob_choice: the firstborn
  chosen_korean: 첫째
  alternatives_korean:
  - 맏아들
  - 첫째 아들
  lexicon: HALOT
  rationale: 직역형 ‘첫째’가 계보 목록의 서열을 가장 간결하게 드러내며, 뒤의 인명 목록과도 자연스럽게 맞습니다.
- source_word: וַשְׁנִי
  english_pob_choice: Vashni
  chosen_korean: 바쉬니
  alternatives_korean:
  - 그리고 둘째
  - 바시니
  lexicon: WLC
  rationale: 마소라 본문의 음가를 따라 고유명사처럼 음역했으며, 본문 자체의 불안정성은 본문 각주로 처리하는 편이 더 투명합니다.
- source_word: וַאֲבִיָּה
  english_pob_choice: and Abijah
  chosen_korean: 아비야
  alternatives_korean:
  - 그리고 아비야
  - 아비야
  lexicon: HALOT
  rationale: 열거 항목 내부에서는 한국어에서 중복되는 접속사를 생략해도 의미가 보존되므로, 인명만 제시했습니다.
theological_decisions:
- issue: ‘Vashni’의 본문 보존 vs. ‘둘째’ 또는 1사무엘 8:2와의 조화
  chosen_reading: 본문은 마소라 본문의 ‘바쉬니’를 유지했습니다.
  alternative_readings:
  - ‘첫째, 그리고 둘째, 아비야’로 이해하기
  - 1사무엘 8:2의 ‘요엘’을 보완해 조화하기
  rationale: 이 구절의 쟁점은 신학보다 계보/본문비평의 문제이므로, 원문 전승을 우선해 본문은 그대로 두고 의미 가능성은 각주에 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
