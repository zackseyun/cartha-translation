  text: 그리고 남아 있던 고핫의 자손들에게는, 그 반지파 므낫세의 가족들 가운데서, 곧 그 반지파 가운데서, 제비뽑기로 열 성읍이 주어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
