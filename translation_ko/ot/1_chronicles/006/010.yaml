translation:
  language: ko
  text: 그리고 엘가나의 아들은 아마새와 아히못입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 아들
  - 그리고 …의 자손
  lexicon: HALOT
  rationale: 족보 문맥의 연결 ו는 ‘그리고’로 살리고, בְנֵי는 직계 남자 후손을 가리키는 기본값으로 ‘아들들’이 가장 자연스럽습니다.
- source_word: אֶלְקָנָה
  english_pob_choice: Elkanah
  chosen_korean: 엘가나
  alternatives_korean:
  - 엘카나
  - 엘칸나
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경 관행에 따라 음역하되, 이미 널리 쓰이는 성경식 표기 ‘엘가나’를 택했습니다.
- source_word: עֲמָשַׂי
  english_pob_choice: Amasai
  chosen_korean: 아마새
  alternatives_korean:
  - 아마사이
  - 아맛새
  lexicon: HALOT
  rationale: 히브리어 이름을 한국어 음역으로 옮겼으며, 영어 전통 철자 변이(Amasai/Amassai)는 한국어 본문에서는 보통 한 형태로 처리합니다.
- source_word: וַ/אֲחִימוֹת
  english_pob_choice: and Ahimoth
  chosen_korean: 아히못
  alternatives_korean:
  - 아히모스
  - 아히못과
  lexicon: HALOT
  rationale: 접속사 ו는 앞의 계열 목록에서 쉼표와 병렬로 흡수할 수 있어 이름만 음역했습니다.
