  text: וּ/בְנֵי֙ אֶלְקָנָ֔ה עֲמָשַׂ֖י וַ/אֲחִימֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/010.yaml
  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
  footnotes:
  - marker: a
    text: Or, following some English spelling conventions, 'Amassai.'
