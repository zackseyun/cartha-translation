source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֗ן אֶת גֶּ֤בַע וְ/אֶת מִגְרָשֶׁ֨י/הָ֙ וְ/אֶת עָלֶ֣מֶת וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת עֲנָת֖וֹת וְ/אֶת מִגְרָשֶׁ֑י/הָ כָּל עָרֵי/הֶ֛ם שְׁלֹשׁ עֶשְׂרֵ֥ה עִ֖יר בְּ/מִשְׁפְּחוֹתֵי/הֶֽם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
  footnotes:
  - marker: a
    text: Hebrew 'Alemeth'; the parallel list in Joshua 21:18 reads 'Almon.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 베냐민 지파에서 게바와 그 목초지[a], 아레멧과 그 목초지, 아나돗과 그 목초지였습니다. 그들의 모든 성읍은 각 가족에 따라 열세 성읍이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘아레멧’(Alemeth)으로 읽히며, 여호수아 21:18의 평행 목록은 ‘알몬’이라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  english_pob_choice: and from the tribe of Benjamin
  chosen_korean: 그리고 베냐민 지파에서
  alternatives_korean:
  - 그리고 베냐민의 지파에서
  - 그리고 베냐민에게서
  lexicon: HALOT
  rationale: מַטֶּה는 지파 분배 문맥에서 ‘지파’로 옮기는 것이 자연스럽고, 앞절의 목록을 잇는 연결은 ‘그리고’로 살렸습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 목초지
  - 그 공지
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍 둘레의 열린 땅/목초지를 가리키므로, 현대 한국어에서 뜻이 분명한 ‘목초지’를 택했습니다.
- source_word: עָלֶמֶת
  english_pob_choice: Alemeth
  chosen_korean: 아레멧
  alternatives_korean:
  - 알레멧
  - 알몬
  lexicon: HALOT
  rationale: 본문 자체의 형태 עָלֶמֶת를 따라 표기했으며, 여호수아 21:18의 병행형 알몬은 각주로만 암시하는 쪽이 본문 충실성에 맞습니다.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  english_pob_choice: all their cities were thirteen cities
  chosen_korean: 그들의 모든 성읍은 ... 열세 성읍이었습니다
  alternatives_korean:
  - 그들의 모든 성읍은 열세 성읍이었습니다
  - 그들의 모든 성읍이 열세 성읍이었습니다
  lexicon: HALOT
  rationale: 히브리어의 총괄 진술을 자연스러운 한국어로 옮기되, 수량 서술의 결론을 분명하게 살렸습니다.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  english_pob_choice: according to their families
  chosen_korean: 각 가족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 각 가문에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת은 ‘가족/가문’ 모두 가능하지만, 본문 흐름에서 분배 기준을 드러내는 ‘각 가족에 따라’가 가장 무난합니다.
