lexical_decisions:
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 후손
  - ~의 자손
  lexicon: HALOT
  rationale: 족보 문맥에서 בֶּן은 직접적인 부자 관계뿐 아니라 계보상의 연결을 나타낼 수 있지만, 본절은 영어 POB처럼 한국어에서도 가장 투명한 족보 표현인 ‘~의 아들’로 옮기는 것이 원문 구조를 가장 잘 드러냅니다.
- source_word: אַמְצִי
  english_pob_choice: Amzi
  chosen_korean: 아므시
  alternatives_korean:
  - 암지
  - 암시
  lexicon: 표준 음역 관행
  rationale: 고유명사는 번역하지 않고 음역하되, 히브리어 자음과 모음값을 반영해 한국어에서 읽기 쉬운 형태로 옮겼습니다.
- source_word: בָּנִי
  english_pob_choice: Bani
  chosen_korean: 바니
  alternatives_korean:
  - 바니
  lexicon: 표준 음역 관행
  rationale: 고유명사는 기존 성경 한국어 관행에 맞춰 간결하게 음역했습니다.
- source_word: שָׁמֶר
  english_pob_choice: Shemer
  chosen_korean: 세메르
  alternatives_korean:
  - 셰메르
  - 시메르
  lexicon: 표준 음역 관행
  rationale: 히브리어 인명 שָׁמֶר는 영어 POB의 Shemer를 참조하되, 한국어 표기에서는 외래어 표기 관행에 따라 ‘세메르’로 옮겼습니다.
