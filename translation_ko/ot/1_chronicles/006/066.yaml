lexical_decisions:
- source_word: חֶשְׁבּוֹן
  english_pob_choice: Heshbon
  chosen_korean: 헤스본
  alternatives_korean:
  - 헤스본(헤스본)
  - 헤슈본
  lexicon: HALOT
  rationale: 고유 지명은 번역하지 않고 음역하며, 표준적인 한국어 표기는 ‘헤스본’이 가장 자연스럽습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 공용지들
  - 그 주변 목초지들
  - 그 열린 땅들
  lexicon: HALOT
  rationale: 레위 성읍 문맥에서 מִגְרָשׁ는 성읍에 딸린 열린 땅/목초 구역을 가리키므로, 의미를 분명히 드러내는 ‘목초지들’로 옮겼습니다.
- source_word: יַעְזֵיר
  english_pob_choice: Jazer
  chosen_korean: 야셀
  alternatives_korean:
  - 야제르
  - 야자르
  lexicon: HALOT
  rationale: 고유 지명은 음역하며, 통용되는 한국어 형태인 ‘야셀’을 사용했습니다.
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또한
  - 및
  lexicon: HALOT
  rationale: 히브리어의 반복적인 목적격 표지는 한국어에서 드러내지 않고, 목록을 연결하는 ‘그리고’로 자연스럽게 처리했습니다.
