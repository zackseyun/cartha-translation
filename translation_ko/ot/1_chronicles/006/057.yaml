base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
  footnotes:
  - marker: a
    text: Daberath is also spelled Dabareth in some English translations and in the parallel city list (cf. Josh 21:28).
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 잇사갈 지파에서는 게데스와 그 목초지, 다브랏[a]과 그 목초지를 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다브랏은 일부 영어 번역과 평행한 성읍 목록(수 21:28)에서 ‘다베랏’(Dabareth)으로도 표기됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  english_pob_choice: And from the tribe of
  chosen_korean: 그리고 … 지파에서는
  alternatives_korean:
  - 그 지파에서
  - 그리고 … 가문에서
  lexicon: HALOT
  rationale: 문맥상 기업 분배 목록을 이어 가는 표현이므로, 접속과 출처를 살린 ‘그리고 … 지파에서는’으로 자연스럽게 옮겼습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 목초지들
  - 그 들판
  lexicon: HALOT
  rationale: מִגְרָשׁ은 레위 성읍 주변의 개방지/목초지에 해당하므로, 문맥과 의미를 살린 ‘목초지들’이 가장 직접적입니다.
- source_word: קֶדֶשׁ / דָּבְרַת
  english_pob_choice: Kedesh / Daberath
  chosen_korean: 기델스 / 다브라
  alternatives_korean:
  - 게데스 / 다베랏
  - 기데스 / 다베라트
  lexicon: 현대 외래어 표기
  rationale: 고유 지명은 현대 한국어 음역 원칙에 따라 옮겼고, 영어 전통형보다 히브리어 자음 구조를 우선해 표기했습니다.
