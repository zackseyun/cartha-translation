  chosen_korean: 기델스 / 다브라
  alternatives_korean:
  - 게데스 / 다베랏
  - 기데스 / 다베라트
  lexicon: 현대 외래어 표기
  rationale: 고유 지명은 현대 한국어 음역 원칙에 따라 옮겼고, 영어 전통형보다 히브리어 자음 구조를 우선해 표기했습니다.
