    rationale: קֶדֶשׁ는 ‘게데스’로 옮겨야 합니다. ‘기델스’는 원문 지명을 정확히 반영하지 않습니다.
  - severity: high
    issue: 지명 ‘다브라’
    rationale: דָּבְרַת의 종결 ת를 반영하여 ‘다브랏’으로 옮겨야 합니다. ‘다브라’는 원문의 지명 형태를 축약합니다.
