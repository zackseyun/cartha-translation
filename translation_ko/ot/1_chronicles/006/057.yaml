  source_fidelity: 히브리어의 지명은 קֶדֶשׁ(게데스)와 דָּבְרַת(다브랏)입니다. 초안의 ‘기델스’와 ‘다브라’는 원문의 자음·어미 형태를 충실히 반영하지 못합니다. 두 성읍에 각각 ‘그 목초지’를 수반하는 구조는 유지했습니다.
  naturalness: 목록을 잇는 절로서 ‘그리고 잇사갈 지파에서는 …을 주었습니다’가 현대 한국어 합쇼체에서 자연스럽고, 앞 문맥에서 이어지는 동사를 한국어 문장에 명시해도 의미를 추가하지 않습니다. מִגְרָשׁ은 집합적 의미로 ‘목초지’라고 단수로 옮겼습니다.
  terminology: ‘잇사갈’, ‘게데스’, ‘다브랏’은 한국어 성경 지명 표기 관습 및 히브리어 형태에 부합합니다. 다브랏의 이형 표기 주석은 해당 지명 바로 뒤에 연결해야 합니다.
  issues:
