review_pass:
  verdict: revise
  source_fidelity: 원문의 주절은 ‘이들은 다윗이 … 세운 사람들이다’이며, ‘궤의 안식/안치 이후’는 그 시점을 나타냅니다. 초안의 둘째 문장 ‘그들은 … 일입니다’는 문법적으로 성립하지 않고 원문의 뜻도 전달하지 못합니다.
  naturalness: ‘이들은 … 사람들입니다’로 한 문장으로 옮기고, 시간 표현을 해당 절에 직접 연결하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: יהוה는 프로젝트 용례에 따라 ‘야훼’로 유지합니다. הָאָרוֹן은 본문에 명시된 대로 ‘궤’로 옮기며, 문맥상 언약궤를 가리킨다는 점은 불필요하게 본문에 보충하지 않습니다. עַל־יְדֵי שִׁיר의 감독·담당 의미는 ‘노래하는 일을 맡도록’으로 반영합니다.
  issues:
