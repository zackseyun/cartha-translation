    issue: 둘째 문장 ‘그들은 언약궤가 머물게 된 뒤의 일입니다’가 비문이며 원문의 술어 구조를 훼손합니다.
    rationale: 원문은 사람들을 가리키는 지시사와 다윗의 임명 행위를 하나의 문장으로 진술합니다. ‘궤의 안식’은 별도의 ‘일’이 아니라 시간적 표지입니다.
  - severity: medium
    issue: 각주 a가 עַל־יְדֵי שִׁיר을 ‘노래의 봉사/노래하는 일’이라는 문자적 표현으로 설명합니다.
    rationale: 히브리어 표현은 문자적으로 ‘노래의 손/수단에 관하여’에 가까운 관용구이며, 문맥상 노래를 담당하거나 관장함을 뜻합니다. 각주는 문자적 주장보다 관용적 의미를 정확히 밝혀야 합니다.
  - severity: low
    issue: 본문의 ‘언약궤’는 원문의 단순한 ‘궤’보다 구체적입니다.
    rationale: 지시 대상은 분명하지만, 본문에서는 원문의 명시 범위를 보존하여 ‘궤’로 옮기는 편이 더 충실합니다.
  revised_text: 이들은 궤가 머물게 된 뒤[b], 다윗이 야훼의 집에서 노래하는 일을 맡도록[a] 세운 사람들입니다.
