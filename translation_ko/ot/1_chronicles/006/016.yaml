id: 1CH.6.16
reference: 1 Chronicles 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
  footnotes:
  - marker: a
    text: Or 'for the singing' or 'in charge of the singing.' The Hebrew phrase likely denotes responsibility for musical worship in the sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from the resting of the ark.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 다윗이 야훼의 집에서 노래하는 일을 맡겨 세운 사람들입니다[a][b]. 그들은 언약궤가 머물게 된 뒤의 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘노래의 봉사/노래하는 일’이라는 뜻일 수 있어, 음악 예배의 감독 책임을 가리키는 표현으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘언약궤가 머물게 된 뒤’는 문자적으로는 ‘궤의 안식으로부터’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것들은
  alternatives_korean:
  - 이들은
  - 이 사람들은
  lexicon: HALOT
  rationale: 열거를 여는 지시 표현으로, 한국어에서도 간결하게 목록 도입의 힘을 살렸습니다.
- source_word: הֶעֱמִיד
  english_pob_choice: appointed
  chosen_korean: 세운
  alternatives_korean:
  - 임명한
  - 배치한
  - 지정한
  lexicon: HALOT
  rationale: 행정적 지정의 뜻을 살리면서도, 문맥상 레위인 직임에 두는 표현으로 자연스럽게 옮겼습니다.
- source_word: עַל יְדֵי שִׁיר
  english_pob_choice: over the service of song
  chosen_korean: 노래하는 일을 맡겨
  alternatives_korean:
  - 노래하는 일을 관장하도록
  - 찬양하는 일을 맡겨
  - 노래 봉사를 맡겨
  lexicon: HALOT
  rationale: 직역보다 책임과 기능을 함께 드러내는 표현으로, 제의적 음악 봉사의 의미를 반영했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 이 구절은 성전 건축 이전의 언약궤 맥락이므로, ‘성전’보다 히브리어의 ‘집’을 유지하고 신명은 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  english_pob_choice: after the ark came to rest
  chosen_korean: 언약궤가 머물게 된 뒤
  alternatives_korean:
  - 언약궤가 쉬게 된 뒤
  - 언약궤가 안식한 뒤
  - 언약궤가 자리 잡은 뒤
  lexicon: HALOT
  rationale: ‘resting of the ark’의 시간적 출발점을 한국어로 자연스럽게 풀어, 궤의 안착 이후라는 뜻을 전달했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 용례에 따라 본문에서 직접 신명 יהוה를 야훼로 옮겨, 원문의 고유 신명을 드러냈습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
- issue: ‘집’과 ‘성전’의 선택
  chosen_reading: 야훼의 집
  alternative_readings:
  - 야훼의 성전
  - 주님의 집
  rationale: 사무/제의 문맥에서 히브리어 בַּיִת의 직설적 의미를 유지하여, 후대적 ‘성전’ 해석을 과도하게 앞세우지 않았습니다.
  doctrine_reference: Source-first rendering of cultic terminology
