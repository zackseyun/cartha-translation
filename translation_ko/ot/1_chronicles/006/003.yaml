  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 ...의 아들은
  alternatives_korean:
  - 그리고 ...의 자손은
  - '...의 아들은'
  lexicon: WLC
  rationale: 계보 목록의 연결을 살리기 위해 접속사 ו를 ‘그리고’로 옮기고, בְנֵי는 바로 뒤의 네 인물을 가리키는 친자 관계이므로 ‘아들들’로 번역했습니다.
- source_word: קְהָת
  english_pob_choice: Kohath
  chosen_korean: 고핫
  alternatives_korean:
  - 고하스
  - 그핫
  lexicon: HALOT
  rationale: 인명은 한국어에서 통용되는 성경식 음역 ‘고핫’을 따랐습니다.
- source_word: עַמְרָם
  english_pob_choice: Amram
  chosen_korean: 암람
  alternatives_korean:
  - 아므람
  lexicon: HALOT
  rationale: 인명은 널리 알려진 한국어 음역 ‘암람’을 사용했습니다.
- source_word: וְיִצְהָר
  english_pob_choice: Izhar
  chosen_korean: 이스할
  alternatives_korean:
  - 이스하르
  - 잇스할
  lexicon: HALOT
  rationale: 인명은 한국어에서 통용되는 음역을 따랐고, 목록 구조상 단순 병렬로 처리했습니다.
- source_word: וְחֶבְרוֹן
  english_pob_choice: Hebron
  chosen_korean: 헤브론
  alternatives_korean:
  - 헤브론
  lexicon: HALOT
  rationale: 여기서는 지명이 아니라 사람 이름이므로, 표준 성경 인명 표기인 ‘헤브론’을 유지했습니다.
- source_word: וְעֻזִּיאֵל
  english_pob_choice: Uzziel
  chosen_korean: 웃시엘
  alternatives_korean:
  - 우시엘
  - 우찌엘
  lexicon: HALOT
  rationale: 인명은 한국어 표준 음역 ‘웃시엘’을 따랐고, 마지막 항목의 접속은 열거 구조로 자연스럽게 드러냈습니다.
