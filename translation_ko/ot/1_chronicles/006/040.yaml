id: 1CH.6.40
reference: 1 Chronicles 6:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֥וּ לָ/הֶ֛ם אֶת חֶבְר֖וֹן בְּ/אֶ֣רֶץ יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖י/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/040.yaml
  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
  footnotes:
  - marker: a
    text: Or 'its common lands.' The Hebrew term refers to the open land attached to a town, often used for grazing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 유다 땅의 헤브론과 그 둘레의 목초지를 그들에게 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: מִגְרָשׁ은 성읍에 딸린 열린 땅을 가리키며, 문맥에 따라 '공유지' 또는 '목초지'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ / וַיִּתְּנוּ
  english_pob_choice: They gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었고
  - 주었으며
  lexicon: HALOT
  rationale: 서술적 과거의 단순한 진행을 자연스럽게 살리기 위해 합쇼체 과거형으로 옮겼습니다.
- source_word: חֶבְרוֹן
  english_pob_choice: Hebron
  chosen_korean: 헤브론
  alternatives_korean:
  - 헤브론 성
  lexicon: HALOT
  rationale: 지명은 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: בְּאֶרֶץ יְהוּדָה
  english_pob_choice: in the land of Judah
  chosen_korean: 유다 땅의
  alternatives_korean:
  - 유다 지역의
  - 유다의 땅에 있는
  lexicon: HALOT
  rationale: אֶרֶץ의 기본 의미를 살려 '땅'으로 옮기되, 한국어에서는 소유·소속을 나타내는 관형격 구조가 가장 자연스럽습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 목초지
  alternatives_korean:
  - 공유지
  - 주변의 들판
  - 목장지
  lexicon: HALOT
  rationale: 문맥상 성읍에 딸린 열린 땅, 특히 방목에 쓰이는 땅을 가리키므로 기능을 분명히 드러내는 '목초지'로 옮겼습니다.
- source_word: סְבִיבֹתֶיהָ
  english_pob_choice: around it
  chosen_korean: 그 둘레의
  alternatives_korean:
  - 주변의
  - 둘러싼
  lexicon: HALOT
  rationale: מִגְרָשׁ의 범위를 한정하는 표현이므로, 성읍을 둘러싼 주변 영역이라는 뜻을 압축적으로 살렸습니다.
theological_decisions:
- issue: 역사 서술의 분배 표현
  chosen_reading: '''주었습니다''로 옮겨, 레위 성읍 분배가 인간 행위로 서술된다는 점을 그대로 반영했습니다.'
  alternative_readings:
  - '''허락했습니다'''
  - '''주셨습니다'''
  rationale: 본문은 분배 행위를 단순 서술하므로, 신학적 주체를 덧붙이지 않고 본문 표면의 행위를 유지하는 것이 더 정확합니다.
  doctrine_reference: 본문 문맥 존중 / 서술 주체 보존
