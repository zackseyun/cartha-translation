  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
  footnotes:
  - marker: a
    text: Or 'in song' or 'by singing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: lexical_alternative
  - marker: c
    text: Or 'according to their ordinance' or 'according to their custom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 노래로[a] 성막, 곧 회막 앞에서 섬겼습니다. 이는 솔로몬이 예루살렘에 야훼의 집[b]을 지을 때까지였습니다. 그들은 자기들의 규례[c]에 따라 자기들의 직무를 맡아 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노래하며’ 또는 ‘노래로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 집’이라고 되어 있으며, 이는 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기들의 규례에 따라’는 ‘자기들의 관례에 따라’ 또는 ‘자기들의 정한 순서에 따라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  english_pob_choice: ministering
  chosen_korean: 섬겼습니다
  alternatives_korean:
