  - 시중들었습니다
  lexicon: HALOT
  rationale: 성막 예배 맥락에서 단순한 일반 봉사보다 예배적·제의적 섬김을 드러내는 표현이어서 ‘섬기다’를 선택했습니다.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  english_pob_choice: the tabernacle, the tent of meeting
  chosen_korean: 증거의 장막, 곧 회막
  alternatives_korean:
