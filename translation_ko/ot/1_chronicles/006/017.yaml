reference: 1 Chronicles 6:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
  footnotes:
  - marker: a
    text: Or 'in song' or 'by singing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: lexical_alternative
  - marker: c
    text: Or 'according to their ordinance' or 'according to their custom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 노래하며 증거의 장막, 곧 회막 앞에서 섬겼습니다. 그러나 솔로몬이 예루살렘에 야훼의 집을 지을 때까지 그랬으며, 그들은 자기들에게 정해진 규례대로 자기 직무를 맡고 서 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노래하며’ 또는 ‘노래로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘주님의 집’이라고 되어 있으나, 곧 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기들에게 정해진 규례대로’ 또는 ‘자기들의 규례대로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  english_pob_choice: ministering
  chosen_korean: 섬겼습니다
  alternatives_korean:
  - 봉사했습니다
  - 시중들었습니다
  lexicon: HALOT
  rationale: 성막 예배 맥락에서 단순한 일반 봉사보다 예배적·제의적 섬김을 드러내는 표현이어서 ‘섬기다’를 선택했습니다.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  english_pob_choice: the tabernacle, the tent of meeting
  chosen_korean: 증거의 장막, 곧 회막
  alternatives_korean:
  - 장막, 곧 회막
  - 성막, 곧 회막
  lexicon: HALOT
  rationale: 히브리어의 두 명사를 모두 살리되, 한국어에서 익숙한 ‘회막’과 함께 apposition을 ‘곧’으로 연결해 원문의 이중 명칭을 보존했습니다.
- source_word: כְמִשְׁפָּטָם
  english_pob_choice: according to their ordinance
  chosen_korean: 자기들에게 정해진 규례대로
  alternatives_korean:
  - 자기들의 규례대로
  - 자기들의 정한 순서대로
  lexicon: HALOT
  rationale: 문맥상 제의적·행정적 규정의 의미이므로 ‘규례’로 옮기고, 소속과 적용 범위를 분명히 하기 위해 ‘자기들에게 정해진’이라고 풀었습니다.
- source_word: עַל עֲבוֹדָתָם
  english_pob_choice: over their service
  chosen_korean: 자기 직무를 맡고
  alternatives_korean:
  - 자기 섬김 위에
  - 자기 봉사 위에서
  lexicon: HALOT
  rationale: 직역하면 다소 어색하지만, 맡겨진 책임과 배치 상태를 드러내는 문맥이어서 ‘맡고 서 있었습니다’로 기능적 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겨, 본문이 가리키는 언약 하나님의 고유명을 드러냈습니다.
theological_decisions:
- issue: 성막/회막의 병렬 표현과 예배적 섬김의 뉘앙스
  chosen_reading: 원문의 두 성소 명칭을 병렬로 유지하고, 그 앞에서의 섬김을 예배적 직무로 이해해 ‘섬겼습니다’로 번역했습니다.
  alternative_readings:
  - 성막 앞에서 봉사했습니다
  - 장막 앞에서 시중들었습니다
  rationale: 본문은 단순한 장소 정보가 아니라 레위인의 제의적 직무를 말하므로, 예배적 기능을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 1 Chronicles 6:17의 성막 봉사 맥락
- issue: 솔로몬 성전 완공까지의 기간 표시
  chosen_reading: ‘솔로몬이 예루살렘에 야훼의 집을 지을 때까지’로 옮겨, 기존 봉사가 성전 건축으로 종료되는 역사적 경계를 분명히 했습니다.
  alternative_readings:
  - 솔로몬이 주님의 집을 지을 때까지
  - 솔로몬이 성전을 지을 때까지
  rationale: 히브리어의 ‘집’(בֵּית)과 ‘야훼’를 살려, 건물의 일반명사와 고유명을 함께 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: YHWH 표기 원칙
