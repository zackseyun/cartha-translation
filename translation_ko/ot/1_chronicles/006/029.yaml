  rationale: 히브리어 ‘형제들’의 직접적 표현을 유지하되, 족보 맥락의 집단적 관계를 한국어에서도 드러내기 위해 이렇게 옮겼습니다.
- source_word: עַל הַשְּׂמֹאול
