base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
  footnotes:
  - marker: a
    text: Or 'their kinsmen'; the Hebrew 'brothers' can refer more broadly to fellow clan members in genealogical contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므라리의 아들들[a], 곧 그들의 형제들은 왼쪽에 있었습니다. 에단은 기시의 아들이요, 아브디의 아들이요, 말룩의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 친족들’로도 옮길 수 있습니다. 족보 문맥에서 히브리어 ‘형제들’은 더 넓게 같은 씨족 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들
  alternatives_korean:
  - 그리고 …의 후손들
  - 그리고 …의 자손들
  lexicon: HALOT
  rationale: 족보 문맥이므로 기본형인 ‘아들들’을 살리되, 한국어에서는 문장 흐름을 위해 접속사와 함께 자연스럽게 옮겼습니다.
