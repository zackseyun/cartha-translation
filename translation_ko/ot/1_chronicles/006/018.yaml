revisions:
- from: 그리고 이들은, 그들의 아들들과 함께 서 있던 사람들입니다. 곧 그핫의 자손들 가운데서 나온 헤만, 노래하는 사람이며, 요엘의 아들이요 사무엘의 아들입니다.
  to: 그리고 이들은 서 있던 이들과 그들의 아들들입니다. 그핫 자손 가운데서는 노래하는 이 헤만이 있었는데, 헤만은 요엘의 아들이며 요엘은 사무엘의 아들입니다.
  rationale: 단순 접속인 וּבְנֵיהֶם을 ‘그들의 아들들’로 보존하고, עמד의 구체적 표현도 ‘서 있던’으로 유지했습니다. ‘그핫 자손 가운데서는’은 מִבְּנֵי הַקְּהָתִי의 계보·집단 표지를 자연스럽게 전달합니다. 마지막 족보는 한국어 독자가 부자 관계의 연쇄를 정확히 이해하도록 최소한으로 풀어 썼습니다.
