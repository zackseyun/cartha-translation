id: 1CH.6.18
reference: 1 Chronicles 6:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הָ/עֹמְדִ֖ים וּ/בְנֵי/הֶ֑ם מִ/בְּנֵי֙ הַ/קְּהָתִ֔י הֵימָן֙ הַ/מְשׁוֹרֵ֔ר בֶּן יוֹאֵ֖ל בֶּן שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
  footnotes:
  - marker: a
    text: Or 'and their sons'; the Hebrew conjunction can be rendered more literally, but 'with their sons' better reflects the relationship in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the descendants of Kohath' or 'from the Kohathites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이들은 서 있던 이들과 그들의 아들들입니다. 그핫 자손 가운데서는 노래하는 이 헤만이 있었는데, 헤만은 요엘의 아들이며 요엘은 사무엘의 아들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה הָעֹמְדִים
  english_pob_choice: And these are the ones who stood
  chosen_korean: 그리고 이들은, 그들의 아들들과 함께 서 있던 사람들입니다
  alternatives_korean:
  - 그리고 이들은 서 있던 사람들입니다
  - 그리고 이들은, 그들의 아들들과 함께 선 사람들입니다
  lexicon: HALOT
  rationale: 문맥상 명단 도입이므로 ‘그리고 이들은’으로 시작하고, עמד의 기본 이미지를 살려 ‘서 있던 사람들’로 옮겼습니다.
- source_word: וּבְנֵיהֶם
  english_pob_choice: with their sons
  chosen_korean: 그들의 아들들과 함께
  alternatives_korean:
  - 그리고 그들의 아들들
  - 그들의 아들들과
  lexicon: HALOT
  rationale: 영문 POB의 해석을 따라 관계를 자연스럽게 드러내되, 단순 접속보다 ‘함께’가 인물들의 결속을 더 분명히 보여 줍니다.
- source_word: מִבְּנֵי הַקְּהָתִי
  english_pob_choice: from the sons of the Kohathites
  chosen_korean: 그핫의 자손들 가운데서 나온
  alternatives_korean:
  - 그핫 사람들 가운데서 나온
  - 그핫의 후손들 가운데서 나온
  lexicon: HALOT
  rationale: 히브리어의 족속/계보 표지를 한국어 자연성에 맞게 ‘자손들 가운데서 나온’으로 풀어, 출신 집단을 명확히 했습니다.
- source_word: הַמְשׁוֹרֵר
  english_pob_choice: the singer
  chosen_korean: 노래하는 사람이며
  alternatives_korean:
  - 노래하는 이며
  - 가수이며
  - 찬양하는 사람이며
  lexicon: HALOT
  rationale: שׁיר 계열의 직능을 직설적으로 살려 ‘노래하는 사람’으로 옮겼고, 문맥상 호칭적 삽입이므로 연결을 위해 ‘-이며’로 처리했습니다.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  english_pob_choice: son of Joel, son of Samuel
  chosen_korean: 요엘의 아들이요 사무엘의 아들입니다
  alternatives_korean:
  - 요엘의 아들이며 사무엘의 아들입니다
  - 요엘의 아들이요, 사무엘의 아들입니다
  lexicon: HALOT
  rationale: 히브리어 족보 형식을 한국어 계보 표현으로 직접 옮기되, 연쇄 관계를 분명히 하기 위해 두 번째 항목도 동일하게 유지했습니다.
theological_decisions:
- issue: 명단 도입의 관계 표현
  chosen_reading: ‘서 있던 사람들’과 ‘그들의 아들들과 함께’로 인물군의 상태와 결속을 함께 보여 줍니다.
  alternative_readings:
  - ‘섰던 사람들’로 더 직역
  - ‘그들의 아들들’로 단순 연결
  rationale: 이 절은 신학 논쟁이 아니라 조직된 레위 계보/직무 명단이므로, 문법적 관계와 सूची의 구조를 한국어로 분명히 드러내는 쪽을 택했습니다.
  doctrine_reference: 역대기 계보·성전 봉사 명단의 서술 방식
- issue: ‘노래하는 사람’의 직능 표현
  chosen_reading: 직능을 뜻하는 표현으로 옮겨 음악적/예배적 역할을 암시합니다.
  alternative_readings:
  - ‘음악가’
  - ‘찬양대원’
  rationale: 원어는 일반적 ‘노래하는 자’이므로, 특정 교회 제도어보다 원문 직능에 가까운 표현을 유지했습니다.
  doctrine_reference: 레위인 성전 봉사 직분
