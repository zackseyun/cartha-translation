  - ~의 후손
  lexicon: HALOT
  rationale: 족보 문맥에서 בֶּן은 반복적으로 혈통 연결을 표시하므로, 한국어에서는 자연스러운 족보 표현인 "~의 아들"로 옮겨 반복 구조를 유지했습니다.
