source:
  edition: WLC
  text: בֶּן אֶלְקָנָה֙ בֶּן יוֹאֵ֔ל בֶּן עֲזַרְיָ֖ה בֶּן צְפַנְיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/021.yaml
  text: the son of Elkanah[a], the son of Joel, the son of Azariah, the son of Zephaniah.
  footnotes:
  - marker: a
    text: Or possibly 'descendant of' at each occurrence of 'son of,' since Hebrew genealogies can sometimes telescope generations; here, however, the immediate genealogical sequence supports 'son of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 엘가나의 아들, 요엘의 아들, 아사랴의 아들, 스바냐의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보에서는 경우에 따라 ‘아들’이 세대 사이를 압축해 ‘후손’의 뜻으로도 쓰일 수 있습니다. 다만 여기서는 바로 이어지는 계보가 있어 ‘아들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  english_pob_choice: the son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 자손
  - ~의 후손
  lexicon: HALOT
  rationale: 족보 문맥에서 בֶּן은 반복적으로 혈통 연결을 표시하므로, 한국어에서는 자연스러운 족보 표현인 "~의 아들"로 옮겨 반복 구조를 유지했습니다.
- source_word: אֶלְקָנָה
  english_pob_choice: Elkanah
  chosen_korean: 엘가나
  alternatives_korean:
  - 엘칸나
  lexicon: SBL/현대 외래어 표기 관행
  rationale: 고유명사는 음역하되, 한국어 성서 번역에서 널리 통용되는 형태를 우선해 엘가나로 옮겼습니다.
- source_word: יוֹאֵל
  english_pob_choice: Joel
  chosen_korean: 요엘
  alternatives_korean:
  - 요엘
  lexicon: SBL/현대 외래어 표기 관행
  rationale: 영문 POB의 표준형 Joel에 대응하는 한국어 관용 표기 요엘을 사용했습니다.
- source_word: צְפַנְיָה
  english_pob_choice: Zephaniah
  chosen_korean: 스바냐
  alternatives_korean:
  - 스바냐
  - 제바냐
  lexicon: SBL/현대 외래어 표기 관행
  rationale: 히브리어 איש명 צְפַנְיָה는 한국어 성서 전통에서 스바냐로 굳어져 있어, 독자 친숙성과 식별성을 위해 이를 따랐습니다.
theological_decisions:
- issue: 족보문의 반복 구조와 생략 가능성
  chosen_reading: 각 단계의 "~의 아들"을 그대로 반복해, 본문이 제시하는 직접 계보를 명시적으로 드러냈습니다.
  alternative_readings:
  - 엘가나의 후손, 요엘의 후손…
  - ~의 자손으로 일반화
  rationale: 이 절은 신학적 진술보다 계보 정보 전달이 핵심이므로, 본문이 제공하는 가장 직접적인 혈통 연결을 유지하는 것이 적절합니다.
  doctrine_reference: 역대상 6장 족보 문맥
