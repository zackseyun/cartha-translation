translation:
  language: ko
  text: 엘가나의 아들, 요엘의 아들, 아사랴의 아들, 스바냐의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보에서는 경우에 따라 ‘아들’이 세대 사이를 압축해 ‘후손’의 뜻으로도 쓰일 수 있습니다. 다만 여기서는 바로 이어지는 계보가 있어 ‘아들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  english_pob_choice: the son of
  chosen_korean: ~의 아들
  alternatives_korean:
