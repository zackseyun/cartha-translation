base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
  footnotes:
  - marker: a
    text: Mashal is rendered from the Chronicles form here; the parallel list in Joshua 21:30 has Mishal.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 아셀 지파에서는 마살과 그 목초지들[a], 그리고 압돈과 그 목초지들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마살은 여기 역대기 형태를 따른 번역입니다. 평행본문인 여호수아 21:30에는 ‘미살’로 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  english_pob_choice: and from the tribe of
  chosen_korean: 아셀 지파에서는
  alternatives_korean:
  - 아셀 지파로부터
  - 아셀의 지파에서
  lexicon: HALOT
  rationale: 지파 할당 목록의 문맥에서 מַטֶּה는 ‘지파’가 자연스럽고, 서술형 한국어에서는 ‘~에서는’으로 목록 항목을 매끄럽게 연결할 수 있습니다.
- source_word: מָשָׁל
  english_pob_choice: Mashal
  chosen_korean: 마살
  alternatives_korean:
  - 미살
  lexicon: HALOT
  rationale: 열왕기/여호수아 평행본문의 이형을 반영하되, 본문의 역대기 자음형을 따라 ‘마살’로 옮겼습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 목초지들
  - 그 공동지들
  lexicon: HALOT
  rationale: מִגְרָשׁ는 레위성읍 목록에서 성읍에 딸린 열린 목초지/주변 땅을 가리키므로, 현대 한국어로는 ‘목초지들’이 가장 직접적이고 문맥에 맞습니다.
- source_word: עַבְדּוֹן
  english_pob_choice: Abdon
  chosen_korean: 압돈
  alternatives_korean:
  - 아브돈
  lexicon: HALOT
  rationale: 고유 지명은 현대 외래어 표기 관례에 따라 ‘압돈’으로 옮겼습니다.
