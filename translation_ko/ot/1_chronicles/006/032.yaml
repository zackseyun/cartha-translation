  alternative_readings:
  - ‘자손’으로 완화해 세대 간략화를 반영하는 번역
  rationale: 이 절은 신학적 해설보다 족보 정보 전달이 핵심이므로, 원문의 관계망을 약화시키지 않는 직접 번역이 적절합니다.
