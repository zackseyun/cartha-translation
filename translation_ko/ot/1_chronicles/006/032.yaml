  alternatives_korean:
  - 말리
  lexicon: 고유명사 음역
  rationale: 고유명사는 음역하되, 영어 POB의 Mahli에 대응하도록 표준적인 한국어 음역 ‘마할리’를 택했습니다.
- source_word: מוּשִׁי
  english_pob_choice: Mushi
  chosen_korean: 무시
  alternatives_korean:
  - 무쉬
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사를 현대 한국어 표기 관행에 따라 음역했습니다.
- source_word: מְרָרִי
  english_pob_choice: Merari
  chosen_korean: 므라리
  alternatives_korean:
  - 메라리
  lexicon: 고유명사 음역
  rationale: 히브리어 음가를 반영해 ‘므라리’로 옮겼으며, 족보 항목의 연속성을 유지했습니다.
- source_word: לֵוִי
  english_pob_choice: Levi
  chosen_korean: 레위
  alternatives_korean:
  - 리위
  lexicon: 고유명사 음역
  rationale: 성경에서 널리 정착된 인명 표기 ‘레위’를 사용했습니다.
theological_decisions:
- issue: 족보 구문의 반복과 직접성
  chosen_reading: 본문의 연쇄적인 ‘아들’ 표현을 그대로 살려, 계보의 직선적 연결을 분명히 드러냈습니다.
  alternative_readings:
  - ‘자손’으로 완화해 세대 간략화를 반영하는 번역
  rationale: 이 절은 신학적 해설보다 족보 정보 전달이 핵심이므로, 원문의 관계망을 약화시키지 않는 직접 번역이 적절합니다.
  doctrine_reference: 역사 서술/족보 문맥
