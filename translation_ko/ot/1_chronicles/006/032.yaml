  rationale: 족보에서 반복되는 בֶּן은 직접적인 혈통 관계를 나타내는 기본 표현이므로, 이를 약화시키는 ‘후손’보다 직역성이 있는 ‘아들’로 옮겼습니다.
- source_word: מַחְלִי
  english_pob_choice: Mahli
