  - 미가엘
  lexicon: 표준 외래어 표기 관행
  rationale: 고유명사는 현대 한국어 표기 관행을 따르되, 영어 POB의 ‘Michael’에 맞춰 읽기 쉬운 음역인 ‘마이클’을 사용했습니다.
- source_word: בַּעֲשֵׂיָה
  english_pob_choice: Baaseiah
  chosen_korean: 바아세야
  alternatives_korean:
  - 마아세야
  lexicon: 영어 POB 주석 반영
  rationale: 본문의 히브리어 형태를 따라 ‘Baaseiah’에 해당하는 음역을 택했고, 다른 계보 전통의 익숙한 이름인 ‘마아세야’로 바꾸지 않았습니다.
- source_word: מַלְכִּיָּה
  english_pob_choice: Malkijah
  chosen_korean: 말기야
  alternatives_korean:
  - 말기야후
  - 말기야
  lexicon: 표준 외래어 표기 관행
  rationale: 히브리어 이름의 자음과 모음을 최대한 반영하여 ‘말기야’로 옮겼습니다. 영어 POB의 Malkijah와 대응합니다.
