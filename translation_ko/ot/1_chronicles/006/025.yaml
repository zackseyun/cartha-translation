  rationale: 족보 문맥에서 בֶּן은 직계 계승을 가장 직접적으로 나타내므로, 한국어도 반복되는 계보 구조를 살려 ‘아들’로 옮겼습니다.
- source_word: מִיכָאֵל
  english_pob_choice: Michael
  chosen_korean: 마이클
