reference: 1 Chronicles 6:56
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/בְנֵי֮ גֵּרְשׁוֹם֒ מִ/מִּשְׁפַּ֗חַת חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַשְׁתָּר֖וֹת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
  footnotes:
  - marker: a
    text: Or 'common lands' for 'pasturelands'; the Hebrew refers to the open land belonging to a city, often used for grazing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그르손의 자손들[a]에게는, 므낫세 반 지파의 씨족에서, 바산의 골란과 그 목초지, 그리고 아스다롯과 그 목초지가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공동지’. 히브리어는 성읍에 속한 열린 땅을 가리키며, 흔히 방목에 사용되었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  english_pob_choice: To the sons of Gershom
  chosen_korean: 그르손의 자손들
  alternatives_korean:
  - 그르손의 아들들
  - 그르손의 후손들
  lexicon: HALOT
  rationale: 히브리어의 משפחה/계보 문맥에서는 관용적으로 ‘자손들’이 자연스럽고, ל-의 수여/배당 뉘앙스는 뒤 문장 전체의 할당 맥락으로 드러낼 수 있습니다.
- source_word: מִמִּשְׁפַּחַת
  english_pob_choice: from the clan of
  chosen_korean: 씨족에서
  alternatives_korean:
  - 가문에서
  - 족속에서
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 지파 아래의 하위 집단을 가리키므로, 일반적 ‘가족’보다 ‘씨족’이 문맥상 더 정확합니다.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  english_pob_choice: the half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파
  alternatives_korean:
  - 므낫세의 반쪽 지파
  - 므낫세의 반 지파
  lexicon: HALOT
  rationale: 정착지 배분 문맥에서 ‘반 지파’는 고정된 표현에 가깝고, 한국어에서도 가장 간결하고 이해하기 쉽습니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지
  alternatives_korean:
  - 그 주변 땅
  - 그 공동지
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍의 둘레에 딸린 열린 땅으로, POB의 ‘pasturelands’를 따라 ‘목초지’로 옮기면 방목용 공용지를 비교적 직접적으로 드러낼 수 있습니다.
theological_decisions:
- issue: 지파 배당 목록의 성격
  chosen_reading: 이 구절은 제사장적/레위인 도시 배당의 지리 목록으로 보고, 서술을 해석적으로 확장하지 않았습니다.
  alternative_readings:
  - 이스라엘 지파의 역사적 행정 구획 설명으로 넓게 읽기
  - 성전/레위 제도에 대한 신학적 상징을 덧붙여 읽기
  rationale: 원문은 고유명사와 배당 정보의 열거가 핵심이므로, 독자가 원문의 배분 구조를 바로 파악하도록 직역에 가깝게 유지하는 것이 적절합니다.
  doctrine_reference: 민수기 35장, 여호수아 21장과 연결되는 레위 성읍 배정 전승
