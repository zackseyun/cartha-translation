translation:
  language: ko
  text: 에단의 아들이며, 심마의 아들이며, 시므이의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보에서는 세대가 생략될 수 있으므로, 어떤 문맥에서는 ‘아들’이 더 넓게 ‘후손’의 뜻으로 기능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: …의 아들
  alternatives_korean:
  - …의 후손
  - …의 자손
  lexicon: HALOT
  rationale: 족보 문맥의 בֶּן은 표면적으로는 ‘아들’이 가장 자연스럽고, POB의 ‘son of’도 이를 따르므로 한국어도 이를 직역형으로 유지했습니다.
- source_word: אֵיתָן
  english_pob_choice: Ethan
  chosen_korean: 에단
  alternatives_korean:
  - 이단
  - 에탄
  lexicon: standard proper-name transliteration
  rationale: 고유명사는 음역하되 한국어 외래어 표기법에 맞춰 ‘에단’으로 적었습니다.
- source_word: זִמָּה
  english_pob_choice: Zimmah
  chosen_korean: 집마
  alternatives_korean:
  - 짐마
  - 지마
  lexicon: standard proper-name transliteration
  rationale: 본절에서는 어근 의미가 아니라 인명으로 기능하므로, 통용되는 음역형에 따라 ‘집마’로 옮겼습니다.
- source_word: שִׁמְעִי
  english_pob_choice: Shimei
  chosen_korean: 시므이
  alternatives_korean:
  - 시미
  - 시메이
  lexicon: standard proper-name transliteration
  rationale: 성경 인명으로 널리 쓰이는 한국어 음역형 ‘시므이’를 사용해 독자가 식별하기 쉽게 했습니다.
theological_decisions:
- issue: 족보의 생략 가능성
  chosen_reading: 본문의 직접적인 족보 형식은 유지하되, 한국어 본문에는 주석을 두지 않았습니다.
  alternative_readings:
  - ‘아들’을 ‘후손’으로 완화해 세대 생략 가능성을 본문에 반영
  rationale: 원문은 단순한 족보 열거이며, POB도 본문은 ‘son of’를 유지하고 주석에서만 족보의 압축 가능성을 설명합니다. 따라서 한국어도 본문을 보존하고 해석은 주석으로 제한했습니다.
  doctrine_reference: genealogical form and Hebrew telescoping
