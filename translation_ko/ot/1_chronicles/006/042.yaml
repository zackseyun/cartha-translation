  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
  footnotes:
  - marker: a
    text: Or 'common lands' for 'pasturelands'; the Hebrew refers to the open land belonging to a town.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들들에게는 도피성들을 주었는데, 헤브론과 그 목초지들, 그리고 야딧르와 에스드모아와 그 목초지들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목초지’로도 옮길 수 있습니다. 히브리어는 성읍에 딸린 열린 땅을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן
  english_pob_choice: And to the sons of Aaron
  chosen_korean: 아론의 아들들에게는
  alternatives_korean:
  - 아론의 자손들에게는
  - 아론의 아들들에게
  - 아론의 아들들을 위하여
  lexicon: HALOT
  rationale: לְ의 수혜/대상 관계를 자연스럽게 살려 ‘-에게는’으로 옮겼고, 족보·제사장 맥락에서는 ‘아들들’이 원문 대비 가장 직접적입니다.
- source_word: עָרֵי הַמִּקְלָט
  english_pob_choice: the cities of refuge
  chosen_korean: 도피성들
  alternatives_korean:
  - 피난성들
  - 피난처 도시들
  - 도피 도시들
  lexicon: HALOT
  rationale: 성경적 고정 용어를 살리되 현대 한국어에서 통하는 합성어로 압축했습니다. ‘도피성’은 המקלט의 법적 지정 성격을 가장 간결하게 드러냅니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: with its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 목초지들
  - 그 공지들
  - 그 들판들
  lexicon: HALOT
  rationale: מִגְרָשׁ은 성읍에 속한 개활지/방목지를 가리키므로, 문맥상 가장 분명한 ‘목초지들’을 택했습니다. 영어 POB의 ‘pasturelands’와 대응을 유지했습니다.
- source_word: וְאֶת חֶבְרוֹן ... וְאֶת לִבְנָה ... וְאֶת יַתִּר ... וְאֶת אֶשְׁתְּמֹעַ
  english_pob_choice: Hebron, and Libnah ..., and Jattir, and Eshtemoa ...
  chosen_korean: 헤브론과 … 야딧르와 에스드모아
  alternatives_korean:
  - 헤브론과 리브나와 야딧르와 에스드모아
  - 헤브론, 리브나, 야딧르, 에스드모아
  lexicon: HALOT
  rationale: 고유명사는 음역을 따르되, 한국어에서 널리 쓰이는 형태가 없는 경우 현대 외래어 표기식으로 옮겼습니다. 목록 구조는 원문의 병렬을 유지했습니다.
theological_decisions:
- issue: ‘도피성’ 용어의 법적·신학적 무게
  chosen_reading: 전통적 교회어휘를 유지하되, 본문이 말하는 것은 단순한 ‘피난처’가 아니라 율법이 정한 지정 성읍이라는 점을 드러냈습니다.
  alternative_readings:
  - 피난성
  - 피난처 도시
  - 보호성
  rationale: 원문 עָרֵי הַמִּקְלָט는 법적 지정성과 공동체적 보호 기능을 함께 담고 있어, 익숙한 성경 용어를 유지하는 편이 의미를 가장 온전히 전달합니다.
  doctrine_reference: 민수기 35장, 여호수아 20장
