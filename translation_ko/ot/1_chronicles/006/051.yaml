  text: וּ/מִֽ/מִּשְׁפְּח֖וֹת בְּנֵ֣י קְהָ֑ת וַ/יְהִי֙ עָרֵ֣י גְבוּלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
  footnotes:
  - marker: a
    text: Or 'from among the clans of the sons of Kohath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their border cities'; Hebrew גְּבוּל can denote 'border,' 'boundary,' or 'territory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 고핫 자손의 가족들 가운데에서, 그들의 영토의 성들은 에브라임 지파에서 나왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가족들’은 여기서 ‘씨족들’ 또는 ‘가문들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영토’는 히브리어 גְּבוּל이 ‘경계’, ‘경계지’, ‘영역/영토’를 뜻할 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  english_pob_choice: And from the families of
  chosen_korean: 그리고 … 가족들 가운데에서
  alternatives_korean:
  - 그리고 … 가문들 가운데에서
  - 그리고 … 씨족들 가운데에서
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 문맥상 가족 집단/씨족을 가리키므로, 현대 한국어에서는 자연스럽고 넓게 통하는 ‘가족들’로 옮기되, מן의 부분적 의미는 ‘가운데에서’로 살렸습니다.
- source_word: בְּנֵי קְהָת
  english_pob_choice: the sons of Kohath
  chosen_korean: 고핫 자손
  alternatives_korean:
  - 고핫의 아들들
  - 고핫 사람들
  lexicon: HALOT
  rationale: 히브리어 족보 관용구를 따라 ‘자손’으로 옮기면 혈연-지파 표지를 유지하면서도 한국어 성경 문체에 자연스럽습니다.
- source_word: עָרֵי גְבוּלָם
  english_pob_choice: the cities of their territory
  chosen_korean: 그들의 영토의 성들
  alternatives_korean:
  - 그들의 경계 도시들
  - 그들의 경계지의 성들
  - 그들의 지역의 성들
  lexicon: HALOT
  rationale: גְבוּל은 여기서 단순한 ‘경계선’보다 분배받은 지역/영역을 가리키므로, POB의 ‘territory’를 따라 ‘영토’로 옮겨 할당된 토지 범위를 드러냈습니다.
- source_word: מִמַּטֵּה אֶפְרָיִם
  english_pob_choice: from the tribe of Ephraim
  chosen_korean: 에브라임 지파에서
  alternatives_korean:
  - 에브라임 지파로부터
  - 에브라임의 지파에서
  lexicon: HALOT
  rationale: מַטֶּה는 지파 문맥에서 ‘지파’가 표준 의미이므로, 간결하게 ‘에브라임 지파에서’로 옮겼습니다.
