  text: son of Elkanah[a], son of Jeroham, son of Eliel[b], son of Tohah.
  footnotes:
  - marker: a
    text: Hebrew Tohah; some compare the parallel genealogy in 1 Samuel 1:1, which has Nahath in a corresponding position.
    reason: cross_reference
  - marker: b
    text: Or 'Tohu,' reflecting a slightly different English transliteration of the same Hebrew name.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘가나의 아들, 여로함의 아들, 엘리엘의 아들, 도하의 아들입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 이 이름은 사무엘상 1:1의 대응 족보에서 다른 형태와 비교됩니다.
    reason: cross_reference
  - marker: b
    text: 이 이름은 영어 전사에서 ‘Tohah’와 ‘Tohu’처럼 조금 다르게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 후손
  - ~의 자손
  lexicon: HALOT
  rationale: 족보 문맥에서는 בֶּן이 직계 또는 계보상의 ‘아들’을 반복적으로 표시하므로, 간결하고 축자적인 ‘~의 아들’로 옮겼습니다.
- source_word: אֶלְקָנָה
  english_pob_choice: Elkanah
  chosen_korean: 엘가나
  alternatives_korean:
  - 엘카나
  - 엘가나
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 음역으로 처리하되, 한국어 성경에서 널리 쓰이는 ‘엘가나’를 따랐습니다.
- source_word: יְרֹחָם
  english_pob_choice: Jeroham
  chosen_korean: 여로함
  alternatives_korean:
  - 예로함
  - 여호람
  lexicon: 고유명사 음역
  rationale: 히브리어 인명 יְרֹחָם은 통용되는 한국어 음역 ‘여로함’으로 옮겼습니다.
- source_word: תּוֹחַ
  english_pob_choice: Tohah
  chosen_korean: 도하
  alternatives_korean:
  - 토하
  - 도하
  lexicon: 고유명사 음역
  rationale: 본문의 히브리어 형태 תּוֹחַ를 음가에 따라 음역하되, 본문 자체의 자음·모음 형태를 반영해 ‘도하’로 옮겼습니다.
theological_decisions:
