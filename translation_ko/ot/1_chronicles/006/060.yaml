  text: 그리고 후곡과 그 목초지들, 그리고 레홉과 그 목초지들을.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘후곡’이라고 읽습니다. 평행 본문인 여호수아 21:31에는 ‘헬갓’이 나옵니다.
    reason: textual_variant
lexical_decisions:
- source_word: חוּקֹק
  english_pob_choice: Hukok
  chosen_korean: 후곡
  alternatives_korean:
  - 헬갓
  lexicon: HALOT
  rationale: 본문의 지명은 MT의 חוּקֹק에 따라 음역하였고, 여호수아 21:31의 평행 본문에 나타나는 다른 형태는 본문 변이로만 반영하는 것이 적절합니다.
- source_word: מִגְרָשֶׁיהָ
  english_pob_choice: its pasturelands
  chosen_korean: 그 목초지들
  alternatives_korean:
  - 그 주변 땅들
  - 그 공동지
  lexicon: HALOT
  rationale: 레위 성읍 목록에서 מִגְרָשׁ는 성읍에 딸린 개활지·방목지를 가리키므로, 구체적 의미를 살린 ‘목초지들’이 가장 자연스럽습니다.
- source_word: רְחֹב
  english_pob_choice: Rehob
  chosen_korean: 레홉
  alternatives_korean:
  - 르홉
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역 기준에 맞춰 ‘레홉’으로 옮겼습니다.
- source_word: וְאֶת
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 및
  lexicon: source syntax
  rationale: 연속되는 목적격 표지를 한국어 목록 구문에서는 단순한 접속사로 처리하는 것이 가장 자연스럽습니다.
