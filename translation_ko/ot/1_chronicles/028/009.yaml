  rationale: 니팔형 יִמָּצֵא의 수동 표현을 자연스러운 한국어 피동문으로 바로 옮기고, 영어 POB 감사 기록이 보존하려는 반사적/자기-드러냄의 뉘앙스는 대안 각주에 남겼습니다. 두 각주를 각각 해당 절에 배치했습니다. 그 밖의 표현은 원문의 어휘적 범위와 합쇼체의 격식 있는 어조를 유지했습니다.
