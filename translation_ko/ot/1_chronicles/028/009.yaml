review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 명령, 전심의 섬김, 야훼의 마음 감찰, 찾음과 버림의 조건절을 충실히 반영합니다. 그러나 יִמָּצֵא לָךְ는 니팔 수동형이므로 초안의 ‘당신에게서 자신을 발견되게 하실 것입니다’는 한국어 문법상 부자연스럽고 원문의 수동 표현도 명료하게 전달하지 못합니다. ‘당신에게 발견되실 것입니다’로 옮기는 것이 안전합니다.
  naturalness: ‘당신에게서 자신을 발견되게 하실 것입니다’는 ‘발견되다’의 피동과 ‘-게 하다’의 사역을 부자연스럽게 중첩합니다. 또한 각주 표지가 모두 문단 끝에 붙어 있어 해당 대안이 가리키는 절에 즉시 연결되지 않습니다. 나머지 문장은 현대의 격식 있는 성경 한국어로 대체로 자연스럽습니다.
  terminology: ‘야훼’, ‘섬기십시오’, ‘온전한 마음’, ‘기꺼운 영혼’, ‘버리실 것입니다’는 각각 יְהוָה, עבד, לֵב שָׁלֵם, נֶפֶשׁ חֲפֵצָה, זנח의 문맥상 의미와 엄중한 어조를 적절히 보존합니다. ‘모든 생각의 의도’도 יֵצֶר מַחֲשָׁבוֹת의 내적 의향/형성을 무리 없이 전달합니다.
