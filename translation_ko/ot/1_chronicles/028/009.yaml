id: 1CH.28.9
reference: 1 Chronicles 28:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
  footnotes:
  - marker: a
    text: Or 'he will be found by you.' The Hebrew verb is passive/reflexive in form.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will reject you forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신, 솔로몬 내 아들아, 네 아버지의 하나님을 알고 그분을 온전한 마음과 기꺼운 영혼으로 섬기십시오. 이는 야훼께서 모든 마음을 살피시고 모든 생각의 의도를 깨닫기 때문입니다. 만일 그분을 찾으면, 그분은 당신에게서 자신을 발견되게 하실 것입니다. 그러나 만일 그분을 버리면, 그분은 당신을 영원히 버리실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 당신에게서 발견되실 것입니다.’ 히브리어 동사는 형태상 수동/반사적입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분은 당신을 영원히 거절하실 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: דַּע
  english_pob_choice: know
  chosen_korean: 알고
  alternatives_korean:
  - 아십시오
  - 인지하십시오
  - 알아 두십시오
  lexicon: HALOT
  rationale: ידע의 명령형으로서 단순 정보 인지가 아니라 관계적·언약적 앎을 요구하므로, 현대 한국어에서도 자연스러운 ‘알다’를 살려 ‘알고’로 옮겼습니다.
- source_word: וְעָבְדֵהוּ
  english_pob_choice: and serve him
  chosen_korean: 섬기십시오
  alternatives_korean:
  - 봉사하십시오
  - 예배하십시오
  - 섬기고 예배하십시오
  lexicon: HALOT
  rationale: עבד는 하나님을 향한 예배와 순종을 아우르는 섬김이므로, POB의 넓은 의미를 반영해 ‘섬기다’로 두었습니다.
- source_word: בְּלֵב שָׁלֵם וּבְנֶפֶשׁ חֲפֵצָה
  english_pob_choice: with a whole heart and a willing soul
  chosen_korean: 온전한 마음과 기꺼운 영혼으로
  alternatives_korean:
  - 완전한 마음과 자원하는 영혼으로
  - 온전한 마음과 자원하는 마음으로
  - 전심과 기쁜 영혼으로
  lexicon: HALOT
  rationale: לֵב과 נֶפֶשׁ을 각각 ‘마음’과 ‘영혼’으로 살려, 내적 전부와 자원하는 의지를 함께 드러내도록 했습니다. ‘온전한’은 שָׁלֵם의 완전성·통전성을, ‘기꺼운’은 חֲפֵצָה의 자원성을 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 여호와 대신 고유명사 음역인 ‘야훼’를 사용해 신적 이름의 직접성을 유지했습니다.
- source_word: יִמָּצֵא לָךְ
  english_pob_choice: he will let himself be found by you
  chosen_korean: 그분은 당신에게서 자신을 발견되게 하실 것입니다
  alternatives_korean:
  - 그분은 당신에게서 발견되실 것입니다
  - 당신이 그분을 찾게 될 것입니다
  - 그분은 당신에게서 자신을 찾도록 하실 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동·사역적 뉘앙스를 살려, 단순히 ‘찾는다’로 평면화하지 않고 하나님이 자신을 드러내어 발견되게 하신다는 뜻을 반영했습니다.
- source_word: יַזְנִיחֲךָ לָעַד
  english_pob_choice: he will cast you off forever
  chosen_korean: 당신을 영원히 버리실 것입니다
  alternatives_korean:
  - 당신을 영원히 내치실 것입니다
  - 당신을 영원히 거절하실 것입니다
  - 당신을 영원히 내버려 두실 것입니다
  lexicon: HALOT
  rationale: זנח의 강한 ‘버리다/내치다’의 언약적 경고를 살리되, 한국어 문맥에서 자연스럽고 무게감 있게 ‘버리다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름과 호칭
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮기고, ‘하나님’과 구별해 고유명을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  - the LORD
  rationale: 본문은 언약적 충고 안에서 신적 이름을 직접 사용하므로, 제목적 호칭으로 완화하지 않고 고유한 이름을 보존하는 것이 소스-직결 번역에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: ‘발견되다’의 수동·반사적 긴장
  chosen_reading: ‘그분은 당신에게서 자신을 발견되게 하실 것입니다’로 옮겨, 하나님이 스스로를 드러내시는 측면을 유지했습니다.
  alternative_readings:
  - 그분은 당신에게서 발견되실 것입니다
  - 당신이 그분을 찾을 것입니다
  rationale: 히브리어 니팔형이 담는 수동/반사적 뉘앙스를 보존하여, 인간의 탐색만이 아니라 하나님의 자기-현현이 핵심임을 드러냅니다.
  doctrine_reference: Translation philosophy §3
