revisions:
- from: 그리고 당신, 솔로몬 내 아들아, 네 아버지의 하나님을 알고 그분을 온전한 마음과 기꺼운 영혼으로 섬기십시오. 이는 야훼께서 모든 마음을 살피시고 모든 생각의 의도를 깨닫기 때문입니다. 만일 그분을 찾으면, 그분은 당신에게서 자신을 발견되게 하실 것입니다. 그러나 만일 그분을 버리면, 그분은 당신을 영원히 버리실 것입니다.[a][b]
