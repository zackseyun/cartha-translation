source:
  edition: WLC
  text: וְ/אֶת הַ/זָּהָ֥ב מִשְׁקָ֛ל לְ/שֻׁלְחֲנ֥וֹת הַֽ/מַּעֲרֶ֖כֶת לְ/שֻׁלְחַ֣ן וְ/שֻׁלְחָ֑ן וְ/כֶ֖סֶף לְ/שֻׁלְחֲנ֥וֹת הַ/כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/016.yaml
  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
  footnotes:
  - marker: a
    text: Or 'tables for the bread of arrangement,' traditionally 'tables for the showbread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 금의 무게는, 배열의 상을 위한 것인데, 각 상마다, 그리고 은 상들을 위한 은이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진설병의 상’, 전통적으로는 ‘진설병상’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  english_pob_choice: weight
  chosen_korean: 무게
  alternatives_korean:
  - 중량
  - 계량
  lexicon: HALOT
  rationale: 성전 기물에 할당된 귀금속의 정량을 가리키므로, 추상적 가치보다 직접적인 ‘무게’가 원문 의미를 가장 잘 드러냅니다.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  english_pob_choice: tables of the arrangement
  chosen_korean: 배열의 상
  alternatives_korean:
  - 진설의 상
  - 진설병의 상
  - 진설상
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살려 ‘배열’로 옮기되, 전통적 예배 용어를 본문에 미리 주입하지 않도록 했습니다. 의미상으로는 준비된 빵의 진열을 가리킵니다.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  english_pob_choice: for each table and table
  chosen_korean: 각 상마다
  alternatives_korean:
  - 상마다
  - 모든 상마다
  - 한 상 한 상마다
  lexicon: HALOT
  rationale: 히브리어의 반복형은 분배를 하나씩 가리키는 관용적 표현이므로, 한국어에서는 자연스럽게 ‘각 상마다’로 풀어 의미를 보존했습니다.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  english_pob_choice: the silver tables
  chosen_korean: 은 상들
  alternatives_korean:
  - 은으로 된 상들
  - 은제 상들
  - 은 탁자들
  lexicon: HALOT
  rationale: 문맥상 재질을 나타내는 ‘silver tables’를 간결하게 살려 ‘은 상들’로 옮겼습니다.
