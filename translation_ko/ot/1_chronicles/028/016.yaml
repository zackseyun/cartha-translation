  source_fidelity: 히브리어는 금의 ‘무게’를 배열(진설)을 위한 상들에, 상마다 배정하고, 은 상들을 위해서는 은을 배정하는 열거입니다. 초안은 ‘각 상마다’가 금의 무게와 문법적으로 충분히 결속되지 않고, 문장 끝의 ‘은이었습니다’도 앞의 열거와 어색하게 연결됩니다.
  naturalness: ‘배열의 상’은 현대 한국어에서 부자연스럽고 무엇을 배열하는지 불분명합니다. ‘진설을 위한 상들’은 원문의 מַעֲרֶכֶת의 배열·진설 의미를 유지하면서 성전 문맥에서 자연스럽습니다. 금과 은의 배정을 병렬로 명료하게 표현하도록 고쳤습니다.
  terminology: ‘상’은 기물 명칭으로 적절합니다. ‘진설’은 전통적 ‘진설병’을 본문에 단정적으로 도입하지 않으면서도 cultic arrangement의 뜻을 자연스럽게 나타냅니다. 각 상별 분배는 ‘상마다’로 보존했습니다.
