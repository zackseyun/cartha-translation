base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
  footnotes:
  - marker: a
    text: Or 'every volunteer skilled in wisdom.' The Hebrew literally has 'every willing man in wisdom' for every service.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for all your words'; that is, ready to carry out all your directives or matters.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 제사장들과 레위인들의 분반이 하나님의 집에서 하는 모든 봉사를 위해 마련되어 있습니다. 또 모든 일에서 지혜에 능한 모든 자원하는 사람[a]이 모든 종류의 봉사를 위해 당신과 함께할 것입니다. 관리들과 온 백성도 당신의 모든 지시에 전적으로 따를 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜로운 솜씨를 지닌 모든 자원자’. 히브리어는 문자적으로 ‘지혜에 능한 모든 기꺼이 하는 남자’를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘당신의 모든 말에’입니다. 문맥상 당신의 모든 지시나 일에 응한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: WLC
  rationale: 주의를 끄는 담화 표지를 살려, 문맥 전환의 힘을 한국어 명령형으로 자연스럽게 옮겼습니다.
- source_word: מַחְלְקוֹת
  english_pob_choice: divisions
  chosen_korean: 분반
  alternatives_korean:
  - 조직
  - 반열
  - 부서
  lexicon: WLC
  rationale: 제사장과 레위인의 정해진 편성/교대라는 뜻을 살리되, 현대 한국어에서 기능이 드러나도록 했습니다.
- source_word: בַּחָכְמָה
  english_pob_choice: skilled in wisdom
  chosen_korean: 지혜로운 솜씨를 지닌
  alternatives_korean:
  - 지혜와 솜씨를 갖춘
  - 숙련된
  - 지혜로운
  lexicon: WLC
  rationale: חָכְמָה의 단순한 기술성만이 아니라 ‘지혜’와 연결된 실무적 솜씨를 함께 보이기 위해 다소 직역적으로 옮겼습니다.
- source_word: לְכָל דְּבָרֶיךָ
  english_pob_choice: wholly at your command / at your command in all your matters
  chosen_korean: 당신의 모든 말에 온전히 따를 것입니다
  alternatives_korean:
  - 당신의 모든 일에 따를 것입니다
  - 당신의 모든 말과 일에 따를 것입니다
  - 당신의 모든 지시에 따를 것입니다
  lexicon: WLC
  rationale: 직역상 ‘모든 당신의 말/일’이지만, 문맥상 솔로몬의 지시를 수행한다는 의미를 분명히 하되 원문의 ‘말’ 이미지를 완전히 지우지 않도록 했습니다.
theological_decisions:
- issue: נָדִיב의 성중립화 여부
  chosen_reading: 지혜로운 솜씨를 지닌 모든 자
  alternative_readings:
  - 모든 자원자
  - 모든 기꺼이 하는 남자
  rationale: 이 구절의 초점은 자원 의지와 숙련성의 결합이지 성별 자체가 아니므로, 한국어에서는 과도한 남성 표지를 피하고 문맥 기능을 우선했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: בֵּית הָאֱלֹהִים의 처리
  chosen_reading: 하나님의 집
  alternative_readings:
  - 성전
  - 하나님의 성전
  rationale: 원문의 구체적 예배 공간 표현을 유지해, 보다 해석적인 ‘성전’으로 평준화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
