revisions:
- from: 보십시오. 제사장들과 레위인들의 분반은 하나님의 집의 모든 봉사를 위한 것이고, 또한 당신과 함께 모든 일에, 곧 지혜로운 솜씨를 지닌 모든 자가 모든 종류의 봉사에 함께할 것이며, 관리들과 온 백성도 당신의 모든 말에 온전히 따를 것입니다.[a][b]
  to: 보십시오, 제사장들과 레위인들의 분반이 하나님의 집에서 하는 모든 봉사를 위해 마련되어 있습니다. 또 모든 일에서 지혜에 능한 모든 자원하는 사람[a]이 모든 종류의 봉사를 위해 당신과 함께할 것입니다. 관리들과 온 백성도 당신의 모든 지시에 전적으로 따를 것입니다.[b]
  rationale: 자원성을 본문에 복원하고, 숙련된 자원자들이 모든 일에서 솔로몬을 돕는다는 히브리어의 병렬 구조를 자연스러운 한국어로 재구성했습니다. 마지막 절은 문맥적 의미인 지시에 대한 복종을 본문에 반영하되, ‘말’이라는 원문의 표현은 각주로 보존했습니다.
