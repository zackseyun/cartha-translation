    rationale: 원문은 ‘내가 그의 왕국을 영원히 세우겠다’는 주절 뒤에 조건절을 붙입니다. ‘그렇게 할 것입니다’는 원문에 없으며, 무엇을 한다는 것인지 불분명합니다.
  - severity: medium
