revisions:
- from: 그리고 나는 그의 왕국을 영원히 견고하게 세울 것입니다[a]. 그가 오늘날과 같이 내 계명들과 내 법도들을 행하는 데 강건하면 그렇게 할 것입니다[c][b].
  to: 그리고 내가 그의 왕국을 영원히 견고하게 세우겠습니다[a]. 그가 오늘날처럼[c] 내 계명과 내 법도를 행하는 데 굳게 선다면[b] 말입니다.
  rationale: 조건절을 주절에 직접 연결하여 אִם의 조건성을 보존하고, 원문에 없는 대용 표현을 제거했습니다. יֶחֱזַק은 순종을 행하는 데서의 확고함으로 자연스럽게 옮겼습니다. 각주 표지는 해당 어구 바로 뒤에 배치했으며, 각주 b의 부정확한 대안을 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
