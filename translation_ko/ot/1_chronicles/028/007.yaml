    rationale: חזק은 여기서 계명과 법도를 행하는 데 요구되는 굳셈·확고함을 나타냅니다. ‘굳게 선다면’이 문맥상 더 자연스럽고 충실합니다.
  - severity: medium
    issue: 각주 b의 대안 표현 부정확
