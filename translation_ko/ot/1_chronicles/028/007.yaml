id: 1CH.28.7
reference: 1 Chronicles 28:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
  footnotes:
  - marker: a
    text: Or 'confirm' or 'make firm' his kingdom.
    reason: lexical_alternative
  - marker: b
    text: Or 'holds firm' or 'is resolute' to do my commandments and my judgments.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'as at this day,' that is, as he is doing now.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 나는 그의 왕국을 영원히 견고하게 세울 것입니다[a]. 그가 오늘날과 같이 내 계명들과 내 법도들을 행하는 데 강건하면 그렇게 할 것입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘확인하다’ 또는 ‘견고하게 하다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘굳게 지키다’ 또는 ‘결연히 하다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘오늘날과 같이’는 곧 그가 지금 하고 있는 것과 같다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  english_pob_choice: And I will establish
  chosen_korean: 나는 … 견고하게 세울 것입니다
  alternatives_korean:
  - 나는 … 세울 것입니다
  - 나는 … 확립할 것입니다
  - 나는 … 굳게 할 것입니다
  lexicon: HALOT
  rationale: הכין의 사역적 의미를 살려 ‘견고하게 세우다’로 옮기면 왕국을 흔들리지 않게 정착시키는 뉘앙스를 현대 한국어로 자연스럽게 드러낼 수 있습니다.
- source_word: מַלְכוּתוֹ
  english_pob_choice: his kingdom
  chosen_korean: 그의 왕국
  alternatives_korean:
  - 그의 나라
  - 그의 통치
  - 그의 왕권
  lexicon: HALOT
  rationale: 문맥상 다윗 계열의 지속성을 말하므로 ‘왕국’이 왕권보다 넓고, ‘나라’보다 왕조적 의미를 더 분명히 드러냅니다.
- source_word: לַעֲשׂוֹת מִצְוֺתַי וּמִשְׁפָּטַי
  english_pob_choice: to do my commandments and my judgments
  chosen_korean: 내 계명들과 내 법도들을 행하는 데
  alternatives_korean:
  - 내 계명들과 내 판단들을 지키는 데
  - 내 명령들과 내 규례들을 행하는 데
  - 내 계명들과 내 법들을 따르는 데
  lexicon: HALOT
  rationale: עָשָׂה는 문자적으로 ‘하다/행하다’이므로 ‘행하다’를 유지했고, מִצְוֹת와 מִשְׁפָּטִים은 한국어 성경에서 익숙한 ‘계명’, ‘법도’로 각각 대응하되 문맥의 법적·언약적 톤을 보존했습니다.
- source_word: יֶחֱזַק
  english_pob_choice: he is strong
  chosen_korean: 강건하면
  alternatives_korean:
  - 힘이 있으면
  - 굳세면
  - 강하면
  lexicon: HALOT
  rationale: 조건절의 חזק는 단순한 힘이 아니라 순종을 지속하는 견고함을 가리키므로, 한국어에서는 ‘강건하다’로 옮겨 내적·지속적 강함을 압축적으로 살렸습니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as at this day
  chosen_korean: 오늘날과 같이
  alternatives_korean:
  - 오늘 이와 같이
  - 이 날과 같이
  - 오늘과 같이
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 풀어 ‘오늘날과 같이’로 옮겼습니다. 현재의 순종 상태를 가리키는 점을 유지합니다.
theological_decisions:
- issue: 조건문의 신학적 긴장 보존
  chosen_reading: 왕국을 영원히 견고하게 세우는 약속을 분명한 조건절과 함께 유지해, 순종이 요구된다는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - 조건을 완화해 일반적 축복 진술처럼 읽는 번역
  - 다른 다윗 언약 본문과 조화시키며 조건을 약화하는 번역
  rationale: 히브리어 אִם은 명시적 조건을 도입하므로, 본문의 긴장을 평탄화하지 않고 그대로 보존하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
