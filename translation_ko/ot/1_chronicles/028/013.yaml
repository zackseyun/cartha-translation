lexical_decisions:
- source_word: מַחְלְקוֹת
  english_pob_choice: divisions
  chosen_korean: 구역들
  alternatives_korean:
  - 분반들
  - 조직된 분대들
  - 분과들
  lexicon: HALOT
  rationale: 열왕기·역대기 문맥에서 제사장과 레위인의 조직된 배치를 가리키므로, 기능적 구분을 드러내는 ‘구역들’로 옮겼습니다. 영어의 ‘divisions’가 가진 행정적 구획감을 한국어로 자연스럽게 살렸습니다.
- source_word: מְלֶאכֶת עֲבוֹדַת
  english_pob_choice: the work of the service
  chosen_korean: 드리는 모든 일
  alternatives_korean:
  - 섬기는 모든 일
  - 봉사의 모든 일
  - 사역의 모든 일
  lexicon: HALOT
  rationale: 두 명사가 겹쳐 강조하는 표현으로, 성전에서 수행하는 실무 전반을 가리킵니다. ‘드리는’은 제의적 봉사를, ‘일’은 מְלֶאכֶת의 실무성을 함께 드러냅니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  - 주님의 집
  lexicon: HALOT
  rationale: 직역상 ‘집’이 원문을 가장 가깝게 따르며, 프로젝트 기본값에 따라 신명은 ‘야훼’로 렌더링했습니다.
- source_word: כְּלֵי
  english_pob_choice: vessels
  chosen_korean: 집기
  alternatives_korean:
  - 기물
  - 그릇들
  - 도구들
  lexicon: HALOT
  rationale: 성전 예배에 쓰이는 물품 전반을 가리키므로, 단순한 용기보다 넓은 ‘집기’가 영어의 ‘vessels’가 지닌 포괄성을 잘 반영합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 히브리어는 신명기적 전통의 고유명사 יהוה를 직접 사용하므로, 프로젝트 기본 방침에 따라 ‘야훼’로 옮겨 언약 სახელ의 특수성을 보존했습니다.
  doctrine_reference: POB contested terms — יְהוָה / YHWH → 야훼
