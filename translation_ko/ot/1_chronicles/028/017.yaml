  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
  footnotes:
  - marker: a
    text: Hebrew repeats 'for bowl and bowl,' a distributive expression meaning each vessel had its own assigned weight.
    reason: lexical_alternative
  - marker: b
    text: Or 'flagons' for 'pitchers.' The Hebrew term denotes a pouring vessel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 갈고리들과 대야들과 순금으로 된 주전자들이며, 금 대접들은 각 대접마다 무게를 정하고, 은 대접들도 각 대접마다 무게를 정하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘대접마다 대접마다’라고 반복하여, 각 항목에 따로 무게가 배정되었음을 나타냅니다.
    reason: source_note
