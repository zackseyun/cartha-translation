source:
  edition: WLC
  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the plan/model of the chariot'; the Hebrew phrase is difficult, and may refer to the cherubim-throne structure associated with the ark.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'covering' or 'overshadowing'; the image is of the cherubim with wings spread over the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 분향단을 위한 정련한 금을 무게에 따라 정하고, 또 여호와의 언약궤 위에 날개를 펴서 덮는 금 그룹들, 곧 그 병거의 모형을 위한 것도 정하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 병거의 계획’ 또는 ‘그 병거의 모형’으로 옮길 수 있습니다. 히브리어 구문은 어려우며, 언약궤와 관련된 그룹-왕좌 구조를 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘덮는’ 또는 ‘그늘지게 하는’이라는 뜻입니다. 여기서는 그룹들이 날개를 펴서 궤 위를 덮는 모습을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  english_pob_choice: the altar of incense
  chosen_korean: 분향단
  alternatives_korean:
  - 향단
  - 향불 제단
  lexicon: HALOT
  rationale: 성막·성전 문맥의 고정된 기구를 가리키므로, 기능을 드러내는 전통적이면서도 표준적인 한국어 표현인 ‘분향단’을 택했습니다.
- source_word: זָהָב מְזֻקָּק בַּמִּשְׁקָל
  english_pob_choice: refined gold by weight
  chosen_korean: 정련한 금을 무게대로
  alternatives_korean:
  - 순금으로
  - 정금으로 무게대로
  - 정제한 금을 무게로
  lexicon: HALOT
  rationale: מְזֻקָּק은 단순한 ‘순금’보다 제련·정련의 과정을 더 직접적으로 나타내므로 ‘정련한 금’으로 옮기고, בַּמִּשְׁקָל은 분량을 정한 배정을 살려 ‘무게대로’로 옮겼습니다.
- source_word: הַמֶּרְכָּבָה
  english_pob_choice: the chariot
  chosen_korean: 그 병거의 형상
  alternatives_korean:
  - 그 전차의 형상
  - 그 병거-왕좌의 형상
  - 그 병거의 모양
  lexicon: HALOT
  rationale: 문맥상 해석이 어려운 용어이지만, 원문의 기본 뜻을 보존하기 위해 ‘병거’를 유지하고, תַבְנִית를 ‘형상’으로 옮겨 상징적 설계/모형의 뉘앙스를 살렸습니다.
- source_word: לְפֹרְשִׂים וְסֹכְכִים
  english_pob_choice: spreading out their wings and overshadowing
  chosen_korean: 날개를 펴서 … 덮는
  alternatives_korean:
  - 날개를 펼쳐 … 덮는
  - 날개를 펴고 … 가리는
  - 날개를 펴서 … 드리우는
  lexicon: HALOT
  rationale: פֹרְשִׂים는 ‘펴다/펼치다’, סֹכְכִים는 ‘덮다/가리다/드리우다’의 뜻이므로, 그룹의 날개 이미지가 분명한 문맥에서 ‘날개를 펴서 … 덮는’으로 자연스럽고 직역에 가깝게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주
  lexicon: HALOT
  rationale: 이 구절의 본문 문맥과 한국어 성경의 통용도를 고려하여 고유 신명은 ‘여호와’로 옮겼습니다. 원문 표기 자체는 보존하되, 한국어 독자에게 즉시 인지되는 성호를 유지했습니다.
theological_decisions:
