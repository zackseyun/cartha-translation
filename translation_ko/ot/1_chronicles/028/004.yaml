reference: 1 Chronicles 28:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
  footnotes:
  - marker: a
    text: Or 'as prince' for 'as ruler' (Hebrew nagid).
    reason: lexical_alternative
  - marker: b
    text: '''Forever'' reflects the Hebrew term often used for enduring or perpetual duration, here in the context of the Davidic kingship.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 야훼, 이스라엘의 하나님께서 내 아버지의 온 집안에서 나를 택하셔서 이스라엘의 왕이 되게 하셨습니다. 그분은 유다를 지도자로 택하셨고, 유다 집안, 곧 내 아버지의 집안과 내 아버지의 아들들 가운데서는 나를 기뻐하셔서, 온 이스라엘의 왕이 되게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지도자’는 히브리어 nagid(נָגִיד)의 일반적 의미를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 아버지의 아들들’은 단순한 ‘형제들’보다 히브리어의 족보적 표현을 더 직접적으로 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 여호와, 이스라엘의 하나님
  - 주, 이스라엘의 하나님
  lexicon: WLC / POB audit trail
  rationale: אָנָה 텍스트의 고유명 יְהוָה는 POB 기본 원칙에 따라 ‘야훼’로 옮겨 신적 고유명을 보존했습니다.
- source_word: וַיִּבְחַר / בָּחַר
  english_pob_choice: chose
  chosen_korean: 택하셨습니다
  alternatives_korean:
  - 선택하셨습니다
  - 뽑으셨습니다
  lexicon: HALOT
  rationale: בחר의 반복은 단순한 선발이 아니라 하나님의 주권적 선택을 강조하므로, 한국어로는 ‘택하다’가 가장 직접적입니다.
- source_word: לְנָגִיד
  english_pob_choice: as ruler
  chosen_korean: 지도자로
  alternatives_korean:
  - 통치자로
  - 왕자로
  - 지도자 자격으로
  lexicon: HALOT
  rationale: נָגִיד는 왕보다는 낮지만 공식적 리더십을 지닌 지위를 가리키므로, 현대 한국어에서 오해가 적은 ‘지도자’로 옮겼습니다.
- source_word: בִּי רָצָה
  english_pob_choice: he took pleasure in me
  chosen_korean: 나를 기뻐하셔서
  alternatives_korean:
  - 나를 기뻐하셨고
  - 나를 좋게 여기셔서
  - 나를 즐거워하셔서
  lexicon: HALOT
  rationale: רצה는 단순한 선택이 아니라 호의와 기쁨의 뉘앙스를 가지므로, POB의 ‘took pleasure in me’를 자연스럽게 반영해 ‘기뻐하시다’로 옮겼습니다.
theological_decisions:
- issue: לְעוֹלָם의 지속성
  chosen_reading: ‘이스라엘의 왕이 되게 하셨습니다’ 앞뒤 문맥에서 다윗 왕조의 지속성을 암시하는 표현으로 두었습니다.
  alternative_readings:
  - 영원히
  - 영구히
  - 오랫동안
  rationale: 본문은 다윗 개인의 재위 기간보다 왕조적·언약적 지속성을 가리키므로, 과도한 해설 없이 지속성의 긴장을 유지했습니다.
  doctrine_reference: 다윗 언약의 지속성 보존
- issue: 유다의 선택과 다윗의 선택의 단계성
  chosen_reading: ‘유다를 지도자로 택하셨고, 유다 집안, 곧 내 아버지의 집안과 내 아버지의 아들들 가운데서는’으로 단계적 선택을 드러냈습니다.
  alternative_readings:
  - 유다에서 지도자를 택하셨고
  - 유다 집안에서 내 아버지의 집안을 택하셨고
  rationale: 히브리어는 유다 → 유다 집안 → 아버지의 집안 → 아버지의 아들들로 선택 범위를 좁혀 가므로, 그 구조를 한국어에서도 유지했습니다.
  doctrine_reference: 본문의 선택 구조 보존
