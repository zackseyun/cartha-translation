revisions:
- from: 그러나 야훼, 이스라엘의 하나님께서 내 아버지의 온 집안에서 나를 택하셔서 이스라엘의 왕이 되게 하셨습니다. 그분은 유다를 지도자로 택하셨고, 유다 집안, 곧 내 아버지의 집안과 내 아버지의 아들들 가운데서는 나를 기뻐하셔서, 온 이스라엘의 왕이 되게 하셨습니다.[a][b]
  to: 그러나 이스라엘의 하나님 야훼께서는 내 아버지의 온 집안에서 나를 택하셔서 이스라엘을 영원히 다스릴 왕이 되게 하셨습니다. 이는 그분께서 유다를 지도자로[a] 택하셨고, 유다 집안에서는 내 아버지의 집안을 택하셨으며, 내 아버지의 아들들[b] 가운데서는 나를 기뻐하셔서 온 이스라엘의 왕이 되게 하셨기 때문입니다.
  rationale: ‘영원히’를 본문에 복원하여 לְעוֹלָם을 번역했습니다. 또한 원문의 점층적 선택 구조를 한국어에서 자연스럽게 드러내기 위해 문맥상 생략된 ‘택하셨으며’를 보충했습니다. 각주 표지는 해당 표현 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:15:04Z'
