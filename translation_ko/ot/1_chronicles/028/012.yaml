id: 1CH.28.12
reference: 1 Chronicles 28:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
  footnotes:
  - marker: a
    text: Or, 'all that was in his spirit with him,' that is, what was in David's own mind or heart.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그의 곁에 있던 영 안에 있었던 모든 것의 설계도, 곧 야훼의 집의 뜰들을 위한 것과 그 둘레의 모든 방들을 위한 것, 하나님의 집의 곳간들을 위한 것과 거룩한 것들의 곳간들을 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 영 안에 있었던 모든 것’, 곧 다윗 자신의 마음이나 생각에 있던 것을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  english_pob_choice: plan
  chosen_korean: 설계도
  alternatives_korean:
  - 계획
  - 도면
  - 양식
  lexicon: HALOT
  rationale: 성전/건축 문맥에서 단순한 추상적 ‘계획’보다 구체적 구조를 보여 주는 말이어서, 현대 한국어로는 ‘설계도’가 가장 자연스럽고 원문의 도면적 의미를 잘 살립니다.
- source_word: הָיָה בָ/ר֨וּחַ עִמּ֔/וֹ
  english_pob_choice: was in the Spirit with him
  chosen_korean: 그의 곁에 있던 영 안에 있었던
  alternatives_korean:
  - 그의 영 안에 있었던
  - 그와 함께한 성령 안에 있었던
  lexicon: HALOT
  rationale: 원문은 ‘그의 영’과 ‘(신적) 영’의 긴장을 함께 담을 수 있어, 이를 한국어에서 완전히 단정하지 않고 ‘영’으로 옮겨 해석의 여지를 남겼습니다.
- source_word: לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה
  english_pob_choice: for the courts of the house of Yahweh
  chosen_korean: 야훼의 집의 뜰들을 위한 것
  alternatives_korean:
  - 야훼의 집의 마당들을 위한 것
  - 야훼의 성전 뜰들을 위한 것
  lexicon: HALOT
  rationale: חָצֵר는 성전 문맥에서 ‘뜰’이 가장 직접적이며, יְהוָה는 프로젝트 기본 규정에 따라 ‘야훼’로 옮겼습니다.
- source_word: וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב
  english_pob_choice: for all the surrounding chambers
  chosen_korean: 그 둘레의 모든 방들을 위한 것
  alternatives_korean:
  - 둘레의 모든 방들을 위한 것
  - 주위를 둘러싼 모든 방들을 위한 것
  lexicon: HALOT
  rationale: לְּשָׁכוֹת은 성전의 방/곁방들을 가리키므로 문맥상 ‘방들’이 이해하기 쉽고, סָבִיב의 ‘주변/둘레’ 뜻은 ‘그 둘레의’로 살렸습니다.
- source_word: בֵּית הָ/אֱלֹהִ֔ים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집안
  lexicon: HALOT
  rationale: 원문 표현을 그대로 따라 ‘집’으로 유지해 앞의 ‘야훼의 집’과 병행 구조를 보존했습니다.
- source_word: הַ/קֳּדָשִֽׁים
  english_pob_choice: the holy things
  chosen_korean: 거룩한 것들
  alternatives_korean:
  - 거룩한 물건들
  - 성물
  lexicon: HALOT
  rationale: 문맥상 성전 곳간에 보관되는 성물들을 가리키지만, 원문의 넓은 명사성을 살리기 위해 ‘거룩한 것들’로 옮겼습니다.
theological_decisions:
- issue: בָר֨וּחַ עִמּ֔וֹ의 해석 범위
  chosen_reading: 원문 형태를 보존하며 ‘영’으로 번역해, 다윗 자신의 내적 영인지 하나님의 영인지의 긴장을 열어 둡니다.
  alternative_readings:
  - 다윗 자신의 마음/영을 가리킨다
  - 성령에 의해 받은 계시를 가리킨다
  rationale: 같은 절의 다음 문맥이 야훼께서 다윗에게 이해하게 하셨음을 말하지만, 이 구절 자체는 문법적으로 두 가능성을 모두 허용하므로 번역에서 단정적으로 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
