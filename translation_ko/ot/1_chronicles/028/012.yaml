revisions:
- from: 그리고 그의 곁에 있던 영 안에 있었던 모든 것의 설계도, 곧 야훼의 집의 뜰들을 위한 것과 그 둘레의 모든 방들을 위한 것, 하나님의 집의 곳간들을 위한 것과 거룩한 것들의 곳간들을 위한 것이었습니다.[a]
  to: 또한 다윗은 솔로몬에게 그와 함께한 영 안에 있던 모든 것의 설계도, 곧 야훼의 집의 뜰들과 그 주변의 모든 방들, 하나님의 집의 곳간들, 그리고 거룩한 것들을 위한 곳간들의 설계도를 주었습니다.[a]
  rationale: 본문의 주 읽기는 영어 POB 감사 기록처럼 ‘그와 함께한 영’이라는 표현으로 유지하여 신적 영을 가리킬 가능성을 열어 두었습니다. 동시에 히브리어의 해석상 불확실성을 삭제하지 않도록, 다윗 자신의 내적 마음·생각이라는 대안을 각주에 명시했습니다. 앞 절에서 이어지는 수여 구문은 한국어의 완결성과 자연스러움을 위해 ‘다윗은 솔로몬에게 … 주었습니다’로 드러냈으며, 이는 본문 문맥에 이미 명시된 정보를 보충한 것입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:36Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안의 ‘그의 곁에 있던 영 안에 있었던’은 히브리어 בָרוּחַ עִמּוֹ의 관계를 부정확하고 중복되게 옮깁니다. עִמּוֹ는 ‘그와 함께한’으로 연결될 수 있으며, 본문의 신적 영 읽기를 본문에 보존하되 다윗 자신의 마음이라는 대안을 각주로 남기는 것이 안전합니다. 또한 이 절은 앞 절의 ‘주었다’에 이어지는 목적어 목록이므로, 한국어에서는 다윗과 솔로몬 및 서술어를 보충하여 완결된 문장으로 제시할 수 있습니다.
  naturalness: 초안은 ‘모든 것의 설계도, 곧 … 위한 것’의 반복과 ‘그의 곁에 있던 영 안에 있었던’ 때문에 현대 표준 한국어로 매우 부자연스럽습니다. 목록을 ‘…을 위한 설계도’에 직접 연결하고, 문맥상 생략된 주어·수여 대상을 밝혀 합쇼체 문장으로 정리했습니다.
  terminology: תַבְנִית는 건축 문맥상 ‘설계도’가 적절합니다. חֲצֵרוֹת는 ‘뜰들’, לְשָׁכוֹת는 ‘방들’, אֹצְרוֹת는 ‘곳간들’로 유지했습니다. ‘야훼의 집’과 ‘하나님의 집’의 병행도 보존했습니다. הַקֳּדָשִׁים는 특정 교파적 용어인 ‘성물’로 한정하지 않고 ‘거룩한 것들’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘그의 곁에 있던 영 안에 있었던’이라는 표현
    rationale: 원문의 עִמּוֹ(그와 함께)와 בָרוּחַ(영 안에/by the Spirit)를 한국어에서 중복·오역하여 문법적으로도 의미상으로도 불명료합니다.
  - severity: medium
    issue: 수여 동사와 문맥상 주어·수여 대상의 부재
    rationale: 히브리어는 11절의 ‘다윗이 솔로몬에게 주었다’에 종속되지만, 절 단위 한국어 문장에서는 이를 보충하지 않으면 ‘것이었습니다’가 무엇을 서술하는지 불분명합니다.
  - severity: medium
    issue: ‘…을 위한 것’의 연속 반복
    rationale: 목록이 설계도의 대상이라는 관계를 자연스럽게 드러내지 못합니다. ‘…을 위한 설계도’로 한 번에 묶는 편이 정확하고 자연스럽습니다.
