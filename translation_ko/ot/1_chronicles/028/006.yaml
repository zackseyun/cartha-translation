  text: 그가 내게 말씀하셨습니다[a]. 「솔로몬, 네 아들이 내 집과 내 뜰들을 건축할 것이다. 내가 그를 내 아들로 삼으려고 택하였고, 나는 그에게 아버지가 될 것이다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘내가 그를 내 아들로 삼으려고 택하였고, 나는 그에게 아버지가 될 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  english_pob_choice: And he said to me
  chosen_korean: 그가 내게 말씀하셨습니다
  alternatives_korean:
  - 그가 내게 말했습니다
  - 그가 내게 일렀습니다
  lexicon: HALOT
  rationale: 서술 동사 אמר는 문맥상 평이한 과거 진술이지만, 직접 화자 없이 왕에게 전해진 신적 말씀의 성격을 살리기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: שְׁלֹמֹה בִנְךָ
  english_pob_choice: Solomon your son
  chosen_korean: 솔로몬, 네 아들
  alternatives_korean:
  - 솔로몬, 너의 아들
  - 네 아들 솔로몬
  lexicon: HALOT
  rationale: 히브리어의 명사구 결합을 살려 이름과 호칭을 병렬로 두되, 한국어에서는 자연스러운 호명 순서인 ‘솔로몬, 네 아들’로 옮겼습니다.
- source_word: בֵיתִי וַחֲצֵרוֹתָי
  english_pob_choice: my house and my courts
  chosen_korean: 내 집과 내 뜰들
  alternatives_korean:
  - 내 성전과 내 뜰들
  - 내 집과 내 뜰
  lexicon: HALOT
  rationale: בַּיִת을 기본적으로 ‘집’으로 두어 성전의 언약적 표현을 유지하고, חֲצֵרוֹת은 성전 문맥의 ‘뜰들’로 옮겨 복수형을 드러냈습니다.
- source_word: לִי לְבֵן
  english_pob_choice: for myself as a son
  chosen_korean: 내 아들로 삼으려고
  alternatives_korean:
  - 내게 아들이 되도록
  - 내 아들로
  lexicon: HALOT
  rationale: 이중 ל- 구문은 단순 소유보다 관계 설정을 뜻하므로, 한국어에서는 목적과 결과를 함께 드러내는 ‘내 아들로 삼으려고’로 옮겼습니다.
- source_word: וַאֲנִי אֶהְיֶה לּוֹ לְאָב
  english_pob_choice: and I will be to him as a father
  chosen_korean: 나는 그에게 아버지가 될 것이다
  alternatives_korean:
  - 나는 그에게 아버지로 있을 것이다
  - 나는 그에게 아버지처럼 될 것이다
  lexicon: HALOT
  rationale: 히브리어의 יחס/관계 공식은 한국어에서 가장 직접적으로 ‘아버지가 될 것이다’로 대응되며, 단순 은유보다 언약적 친자 관계를 분명히 합니다.
theological_decisions:
- issue: 왕권-언약의 친자 언어
  chosen_reading: 하나님이 솔로몬을 ‘내 아들’로 삼고 자신을 ‘아버지’로 말씀하시는 언약적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 관계적 비유로 완화하여 옮기기
  - ‘내 아들이 되게 하려고’처럼 기능적으로만 번역하기
  rationale: 이 구절은 다윗 왕조에 대한 언약적 입양 언어를 담고 있으므로, 현대 한국어에서도 그 강한 친자 관계를 약화하지 않는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 2사무엘 7장 왕조 언약; 번역 원칙 §§1, 3, 4
