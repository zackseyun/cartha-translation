  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'I have chosen him to be my son, and I will be his father.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말씀하셨습니다. “네 아들 솔로몬이 내 집과 내 뜰들을 건축할 것이다. 내가 그를 내 아들로[a] 택하였고, 나는 그의 아버지가 될 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘내게 아들로’. 또는 더 관용적으로, ‘내가 그를 내 아들이 되게 하려고 택하였고, 나는 그의 아버지가 될 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  english_pob_choice: And he said to me
  chosen_korean: 그가 내게 말씀하셨습니다
  alternatives_korean:
  - 그가 내게 말했습니다
  - 그가 내게 일렀습니다
  lexicon: HALOT
