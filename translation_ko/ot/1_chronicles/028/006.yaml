- source_word: שְׁלֹמֹה בִנְךָ
  english_pob_choice: Solomon your son
  chosen_korean: 솔로몬, 네 아들
  alternatives_korean:
  - 솔로몬, 너의 아들
  - 네 아들 솔로몬
  lexicon: HALOT
  rationale: 히브리어의 명사구 결합을 살려 이름과 호칭을 병렬로 두되, 한국어에서는 자연스러운 호명 순서인 ‘솔로몬, 네 아들’로 옮겼습니다.
- source_word: בֵיתִי וַחֲצֵרוֹתָי
  english_pob_choice: my house and my courts
  chosen_korean: 내 집과 내 뜰들
