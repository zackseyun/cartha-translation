base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
  footnotes:
  - marker: a
    text: Or, 'the LORD gave me many sons.' The Hebrew clause is explanatory and may be rendered with either present-perfect or simple past in English.
    reason: lexical_alternative
  - marker: b
    text: '''The throne of the kingdom of the LORD'' emphasizes that Israel''s monarchy belongs ultimately to the LORD, even though Solomon is the human king.'
    reason: cross_reference
translation:
  language: ko
  text: 또한 내 모든 아들들 가운데서—야훼께서 내게 많은 아들들을 주셨기 때문입니다—그분은 내 아들 솔로몬을 선택하여 이스라엘 위의 야훼의 왕국의 왕좌에 앉게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와께서 내게 많은 아들들을 주셨습니다.’ 히브리어 절은 설명적이어서 영어처럼 현재완료나 단순과거로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘야훼의 왕국의 왕좌’는 이스라엘의 왕정이 궁극적으로 야훼께 속함을 강조합니다. 솔로몬은 인간 왕이지만, 그 왕좌는 야훼의 통치를 표현합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל
  english_pob_choice: And from among all
  chosen_korean: 모든 아들들 가운데서
  alternatives_korean:
