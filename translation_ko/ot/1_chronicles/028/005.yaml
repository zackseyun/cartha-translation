  - 모든 아들들로부터
  lexicon: HALOT
  rationale: 선택 대상을 한 집단 안에서 가려내는 뜻을 살리기 위해 ‘가운데서’를 썼습니다.
- source_word: בָּנַי
  english_pob_choice: my sons
  chosen_korean: 내 모든 아들들
