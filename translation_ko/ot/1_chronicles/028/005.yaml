  lexicon: HALOT
  rationale: בחר의 선발 의미를 ‘선택하다’로 옮겨 왕위 계승의 신중한 선정을 드러냈습니다.
- source_word: לָשֶׁבֶת עַל כִּסֵּא מַלְכוּת יְהוָה
  english_pob_choice: to sit on the throne of the kingdom of Yahweh
  chosen_korean: 야훼의 왕국의 왕좌에 앉게 하셨습니다
