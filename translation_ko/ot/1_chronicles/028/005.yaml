  - 내 아들들
  - 내 자녀들
  lexicon: HALOT
  rationale: 왕위 계승 문맥이므로 성별이 분명한 ‘아들들’을 유지했습니다.
- source_word: נָתַן לִי יְהוָה
  english_pob_choice: Yahweh has given me
  chosen_korean: 야훼께서 내게 많은 아들들을 주셨기 때문입니다
  alternatives_korean:
  - 야훼께서 내게 많은 아들들을 주셨기 때문입니다
  - 야훼께서 내게 많은 아들들을 주셨습니다
  lexicon: HALOT
  rationale: 설명절을 한국어에서 자연스럽게 풀어 ‘기 때문입니다’로 옮기되, 완료·결과의 의미를 살렸습니다.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  english_pob_choice: he chose Solomon my son
  chosen_korean: 내 아들 솔로몬을 선택하여
  alternatives_korean:
  - 내 아들 솔로몬을 택하여
  - 내 아들 솔로몬을 골라
  lexicon: HALOT
  rationale: בחר의 선발 의미를 ‘선택하다’로 옮겨 왕위 계승의 신중한 선정을 드러냈습니다.
- source_word: לָשֶׁבֶת עַל כִּסֵּא מַלְכוּת יְהוָה
  english_pob_choice: to sit on the throne of the kingdom of Yahweh
  chosen_korean: 야훼의 왕국의 왕좌에 앉게 하셨습니다
  alternatives_korean:
  - 야훼의 왕국의 왕좌에 앉게 하셨습니다
  - 야훼의 나라의 왕좌에 앉게 하셨습니다
  lexicon: HALOT
  rationale: 왕위 즉위 맥락의 ‘왕좌’가 자연스럽고, ‘왕국’은 마소라 본문의 מלכות를 직접 반영합니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘 위의
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘을 다스리는
  lexicon: HALOT
  rationale: עַל의 통치 관계를 한국어 ‘위의’로 간결하게 반영했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 프로젝트 기본값에 따라 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유명과 언약적 표지를 직접 보존하기 위해 학술 전사형을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 왕국의 소유 주체
  chosen_reading: ‘야훼의 왕국의 왕좌’로 옮겨 왕권의 궁극적 소유가 야훼께 있음을 드러냈습니다.
  alternative_readings:
  - 이스라엘의 왕좌
  - 왕좌
  rationale: 히브리어의 מלכות יְהוָה가 단순히 인간 왕정이 아니라 야훼의 통치 아래 있음을 강조하므로 그 신학적 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
