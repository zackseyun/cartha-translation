source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
  footnotes:
  - marker: a
    text: Or 'inherit the good land.' The Hebrew verb can carry the sense of inheriting or possessing, depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons'; the term is masculine plural, not the more general 'children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 온 이스라엘, 곧 야훼의 회중이 보는 앞과 우리 하나님께서 들으시는 가운데, 야훼, 여러분의 하나님의 모든 계명을 지키고 힘써 따르십시오. 그리하면 여러분은 그 좋은 땅을 차지하고[a], 여러분 뒤를 이을 아들들에게[b] 그것을 영원히 유업으로 물려줄 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 좋은 땅을 유업으로 받다.’ 히브리어 동사는 문맥에 따라 상속하다 또는 차지하다의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남성 복수형 ‘아들들’을 사용합니다. 더 일반적인 ‘자녀들’이 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  english_pob_choice: in the sight of all Israel
  chosen_korean: 이제 온 이스라엘의 눈앞에서
  alternatives_korean:
  - 온 이스라엘 앞에서
  - 온 이스라엘이 보는 데서
  lexicon: HALOT
  rationale: לְעֵינֵי는 문자적으로 '눈앞에/눈에'이므로 공개적 증언 상황을 살리는 한국어로 옮겼습니다.
- source_word: קְהַל יְהוָה
  english_pob_choice: the assembly of Yahweh
  chosen_korean: 야훼의 회중
  alternatives_korean:
  - 야훼의 모임
  - 야훼의 집회
  lexicon: HALOT
  rationale: קהל은 모인 공동체를 가리키므로, 교회 제도어보다 '회중'이 원문의 집합적 의미를 더 직접적으로 드러냅니다.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  english_pob_choice: in the hearing of our God
  chosen_korean: 우리 하나님의 귀에
  alternatives_korean:
  - 우리 하나님이 들으시는 가운데
  - 우리 하나님의 들으심 속에
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 직접적으로 살려, 하나님 앞의 증언성까지 유지했습니다.
- source_word: שִׁמְרוּ וְדִרְשׁוּ
  english_pob_choice: keep and seek
  chosen_korean: 지키고 찾으십시오
  alternatives_korean:
  - 지키고 구하십시오
  - 지키고 살피십시오
  lexicon: HALOT
  rationale: מצוות에 대한 שׁמר/דרש의 병렬을 한국어 동사 두 개로 간명하게 살렸고, '찾다'는 단순 탐구보다 언약적 추구를 담습니다.
- source_word: תִּירְשׁוּ אֶת הָאָרֶץ הַטּוֹבָה
  english_pob_choice: may possess the good land
  chosen_korean: 그 좋은 땅을 차지하고
  alternatives_korean:
  - 그 좋은 땅을 소유하고
  - 그 좋은 땅을 차지하여
  lexicon: HALOT
  rationale: ירשׁ는 문맥상 상속/점유를 함께 띨 수 있으므로, POB의 'possess'에 맞추어 실제 점유를 드러내는 '차지하다'를 택했습니다.
- source_word: וְהִנְחַלְתֶּם לִבְנֵיכֶם אַחֲרֵיכֶם
  english_pob_choice: and leave it as an inheritance to your sons after you
  chosen_korean: 그 뒤에 오는 여러분의 아들들에게 그것을 영원히 유업으로 남길 수 있습니다
  alternatives_korean:
  - 그 뒤의 여러분의 아들들에게 그것을 유업으로 물려줄 수 있습니다
  - 여러분의 아들들에게 그것을 유산으로 남길 수 있습니다
  lexicon: HALOT
  rationale: הנחיל의 사역적 의미를 '유업으로 남기다/물려주다'로 살렸고, בנים은 성별 표지를 보존해 '아들들'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 신명기를 관습적 대치어가 아니라 고유 이름으로 드러내는 POB 방침을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: קהל의 공동체성
  chosen_reading: 회중
  alternative_readings:
  - 교회
  - 회중 공동체
  rationale: 이 구절의 קהל은 제도적 교회보다 공개적으로 모인 언약 공동체를 가리키므로, 신학적 전제를 덧씌우지 않는 '회중'이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
