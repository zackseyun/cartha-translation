revisions:
- from: 이제 온 이스라엘의 눈앞에서, 곧 야훼의 회중과 우리 하나님의 귀에, 야훼 당신들의 하나님의 모든 계명을 지키고 찾으십시오. 그리하면 여러분이 그 좋은 땅을 차지하고, 그 뒤에 오는 여러분의 아들들에게 그것을 영원히 유업으로 남길 수 있습니다.[a][b]
  to: 이제 온 이스라엘, 곧 야훼의 회중이 보는 앞과 우리 하나님께서 들으시는 가운데, 야훼, 여러분의 하나님의 모든 계명을 지키고 힘써 따르십시오. 그리하면 여러분은 그 좋은 땅을 차지하고[a], 여러분 뒤를 이을 아들들에게[b] 그것을 영원히 유업으로 물려줄 수 있습니다.
  rationale: 공개적 증언의 장면과 하나님이 들으심이라는 의미는 자연스러운 현대 한국어로 유지했습니다. 계명에 대한 דרש는 단순히 ‘찾다’보다 문맥에 맞는 ‘힘써 따르다’로 옮겼습니다. 목적/결과를 나타내는 לְמַעַן 이하의 땅 점유와 후대 상속은 ‘그리하면 … 차지하고 … 물려줄 수 있습니다’로 보존했으며, 두 각주는 각각 해당 어휘에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:15:39Z'
