  - 모았습니다
  lexicon: HALOT
  rationale: 행정적으로 공식적인 집회를 형성하게 한다는 히필 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 공적 상황에 어울리게 옮겼습니다.
- source_word: שָׂרֵי
