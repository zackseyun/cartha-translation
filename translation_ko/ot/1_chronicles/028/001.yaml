  - 지도자들
  lexicon: HALOT
  rationale: שַׂר가 지파·부서·군사 단위에 두루 적용되므로, 특정 직함보다 넓은 상위어인 ‘지도자들’이 가장 무난합니다.
- source_word: הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  english_pob_choice: the divisions that served the king
  chosen_korean: 왕을 섬기는 부서들
  alternatives_korean:
