base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
  footnotes:
  - marker: a
    text: Or 'eunuchs'; the Hebrew term can refer either to literal eunuchs or more generally to royal court officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗은 예루살렘에 이스라엘의 모든 지도자, 곧 지파들의 지도자들, 왕을 섬기는 부서들의 지도자들, 천부장들과 백부장들, 왕과 그의 아들들에게 속한 모든 재산과 가축을 맡은 지도자들, 관리들, 용사들, 그리고 모든 힘센 용사를 불러 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 사르יסים는 문자적으로는 ‘내시들’일 수 있으나, 더 넓게는 왕실 관리들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  english_pob_choice: assembled
  chosen_korean: 불러 모았습니다
  alternatives_korean:
