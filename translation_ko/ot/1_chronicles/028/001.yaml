  lexicon: HALOT
  rationale: מַחְלְקוֹת는 조직된 분과·부서의 뜻이 강하고, מְשָׁרְתִים는 섬기는/시중드는 기능을 나타내므로 행정적 조직성을 드러내는 ‘부서들’이 적절합니다.
- source_word: הַסָּרִיסִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 내시들
  - 궁정 관리들
  - 환관들
  lexicon: HALOT
  rationale: 이 목록은 왕실 행정 인사들의 호명으로 보이므로, 문자적 가능성은 남기되 한국어 본문에서는 기능을 반영한 ‘관리들’로 옮겼습니다.
- source_word: כָל גִּבּוֹר חָיִל
  english_pob_choice: every mighty man of valor
  chosen_korean: 모든 힘센 용사
  alternatives_korean:
  - 모든 용맹한 용사
  - 모든 무력한 자?
  - 모든 용맹한 전사
  lexicon: HALOT
  rationale: גִּבּוֹר חָיִל의 중첩된 강함과 전투적 역량을 한국어 관용구 ‘힘센 용사’로 압축해, 원문의 수사적 강조를 살렸습니다.
theological_decisions:
- issue: יִשְׂרָאֵל의 공적 집회 성격
  chosen_reading: 다윗이 개인적으로 사람들을 모은 것이 아니라, 이스라엘의 대표적 행정·군사 지도층을 공식적으로 소집한 것으로 읽었습니다.
  alternative_readings:
  - 단순한 군중 소집
  - 사적인 회합
  rationale: 열거된 직책들이 지파·부서·천부장·백부장·재산 관리 등으로 매우 체계적이어서, 본문은 성전 준비를 위한 국가적 소집으로 이해하는 것이 자연스럽습니다.
  doctrine_reference: 1 Chronicles 28장의 문맥상 성전 계승 준비와 왕권의 공적 성격
