id: 1CH.28.3
reference: 1 Chronicles 28:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
  footnotes:
  - marker: a
    text: Or 'a man of war.' The Hebrew is literally 'a man of wars.'
    reason: lexical_alternative
  - marker: b
    text: '''A house for my name'' refers to the temple as the place associated with God''s name and presence.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 하나님께서 저에게 말씀하셨습니다[a]. “너는 내 이름을 위한 집[b]을 건축해서는 안 된다. 네가 전쟁의 사람이요 피를 흘렸기 때문이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁의 사람’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘전쟁들의 사람’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 이름을 위한 집’은 하나님의 이름과 임재와 관련된 성전, 곧 예배의 처소를 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  english_pob_choice: But God
  chosen_korean: 그러나 하나님께서
  alternatives_korean:
  - 그리고 하나님께서
  - 이제 하나님께서
  lexicon: HALOT
  rationale: 문맥상 다윗의 소망과 대비되는 금지의 말이므로 접속사 וְ는 단순한 ‘그리고’보다 ‘그러나’가 더 자연스럽고, אֱלֹהִים은 관례대로 ‘하나님’으로 옮겼습니다.
- source_word: לֹא תִבְנֶה
  english_pob_choice: You shall not build
  chosen_korean: 건축해서는 안 된다
  alternatives_korean:
  - 건축하지 말아야 한다
  - 건축할 수 없다
  lexicon: HALOT
  rationale: 직설적 금지이면서도 신적 선언의 무게를 살리기 위해 ‘-해서는 안 된다’를 택했습니다.
- source_word: בַיִת
  english_pob_choice: a house
  chosen_korean: 집
  alternatives_korean:
  - 집 한 채
  - 성전
  lexicon: HALOT
  rationale: 히브리어의 기본어휘를 살려 ‘집’으로 옮기되, 이 문맥이 성전을 가리키는 점은 아래 각주로 설명했습니다. ‘성전’은 해석을 미리 확정합니다.
- source_word: לִשְׁמִי
  english_pob_choice: for my name
  chosen_korean: 내 이름을 위한
  alternatives_korean:
  - 내 이름을 위하여
  - 내 이름에 속한
  lexicon: HALOT
  rationale: ‘이름’이 하나님의 임재와 관련된 성소 표현이라는 점을 유지하기 위해 직역에 가깝게 옮겼습니다.
- source_word: אִישׁ מִלְחָמוֹת
  english_pob_choice: a man of wars
  chosen_korean: 전쟁의 사람
  alternatives_korean:
  - 전쟁의 사람들
  - 전쟁의 사나이
  - 전사의 사람
  lexicon: HALOT
  rationale: 영어 POB가 복수 ‘wars’를 살린 점을 반영해 ‘전쟁의 사람’으로 옮겼고, 전투적 정체성을 압축적으로 드러냈습니다. ‘전사’는 매끄럽지만 원문 투명성이 약합니다.
- source_word: וְדָמִים שָׁפָכְתָּ
  english_pob_choice: and have shed blood
  chosen_korean: 피를 흘렸기 때문이다
  alternatives_korean:
  - 피를 쏟았기 때문이다
  - 피를 흘려왔기 때문이다
  lexicon: HALOT
  rationale: 히브리어 관용구 דמים שפך를 한국어 관용 표현인 ‘피를 흘리다’로 옮겨 의미를 보존했습니다. 복수형 ‘피들’은 한국어에서 부자연스러워 단수로 처리했습니다.
theological_decisions:
- issue: 다윗이 성전을 짓지 못하는 이유의 성격
  chosen_reading: 본문이 제시하는 이유를 그대로 따라, 다윗이 전쟁의 사람이요 피를 흘렸기 때문에 하나님께서 그에게 집을 짓지 말라고 하신 것으로 옮겼습니다.
  alternative_readings:
  - 이 피 흘림을 도덕적 죄로 단정하는 해석
  - 전쟁 자체를 제의적으로 부적합한 것으로 보는 해석
  rationale: 히브리어 본문은 이유를 말하지만 그 이유의 윤리적·제의적 성격을 판정하지는 않으므로, 번역도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 본문의 신학적 긴장 보존
- issue: ‘집’의 의미
  chosen_reading: ‘내 이름을 위한 집’은 예루살렘 성전을 가리키는 표현이지만, 본문에서는 상징적 표현을 살려 ‘집’으로 두고 의미를 각주로 설명했습니다.
  alternative_readings:
  - ‘성전’으로 직접 번역
  - ‘내 이름을 위한 성전’으로 의역
  rationale: 성전이라는 해석을 본문에 미리 넣기보다, 히브리어의 표상을 유지하면서 독자가 문맥상 의미를 이해하도록 하는 편이 원문 충실도에 더 부합합니다.
  doctrine_reference: 성소/임재 표현의 보존
