  source_fidelity: 수정이 필요합니다. 히브리어는 금 기구에 쓸 금과 은 기구에 쓸 은을 각각 무게에 따라 정하는 목록식 표현입니다. 초안의 ‘금은 … 무게대로 하고, 은도 … 하십시오’는 명령문으로 바꾸고, 금·은으로 된 기구라는 재질상의 병행을 충분히 드러내지 못합니다.
