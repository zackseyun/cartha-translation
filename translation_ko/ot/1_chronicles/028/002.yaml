  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
  footnotes:
  - marker: a
    text: Or “my kinsmen”; the Hebrew says “my brothers,” a masculine plural form used in a public address.
    reason: lexical_alternative
  - marker: b
    text: “House of rest” may also be rendered “resting place,” referring to a settled dwelling for the ark.
    reason: lexical_alternative
  - marker: c
    text: That is, the ark is described as the footstool associated with the presence of Israel’s God; compare Psalm 132:7.
    reason: cross_reference
translation:
  language: ko
  text: 그때 다윗 왕이 자기의 발로 일어서서 말했습니다. 「나의 형제들과 내 백성아, 들으십시오. 야훼의 언약궤와 우리 하나님의 발판을 위한 안식의 집을 짓고자 하는 것이 내 마음에 있었습니다. 그래서 나는 그것을 짓도록 준비했습니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수형 ‘내 형제들’이라고 말하며, 공적 연설에서 친족 전체를 대표하는 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안식의 집’은 ‘쉬는 곳’, 곧 언약궤를 위한 정착된 거처라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 언약궤를 하나님의 임재와 관련된 ‘발판’으로 묘사합니다. 시편 132:7과 비교하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם ... עַל רַגְלָיו
  english_pob_choice: rose to his feet
  chosen_korean: 자기의 발로 일어서서
  alternatives_korean:
  - 일어나서
  - 자리를 박차고 일어나서
  lexicon: HALOT
  rationale: קום의 서술적 동작과 ‘발로’라는 관용을 자연스러운 현대 한국어로 살리면서, 과장된 뉘앙스는 피했습니다.
- source_word: שְׁמָעוּנִי אַחַי וְעַמִּי
  english_pob_choice: Hear me, my brothers and my people
  chosen_korean: 나의 형제들과 내 백성아, 들으십시오
  alternatives_korean:
  - 내 형제들아, 내 백성아, 들으십시오
  - 나의 형제자매와 내 백성아, 들으십시오
  lexicon: HALOT
  rationale: אַחַי의 남성 복수 공적 호칭을 그대로 살려 ‘형제들’로 옮기고, 다윗의 공개 연설임을 반영해 정중한 명령형으로 처리했습니다.
- source_word: בֵּית מְנוּחָה
  english_pob_choice: a house of rest
  chosen_korean: 안식의 집
  alternatives_korean:
  - 쉼의 집
  - 휴식의 집
  - 거처의 집
  lexicon: HALOT
  rationale: 문맥상 언약궤를 위한 정착된 거처를 가리키므로, ‘rest’의 예배적·정착적 의미를 간결하게 살린 표현을 택했습니다.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  english_pob_choice: for the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 여호와의 언약궤
  - 야훼의 계약궤
  lexicon: HALOT
  rationale: 이 구는 언약궤를 직접 지시하므로 한국어 관용을 유지하면서도 신명은 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: וְלַהֲדֹם ... אֱלֹהֵינוּ
  english_pob_choice: and for the footstool of our God
  chosen_korean: 우리 하나님의 발판
  alternatives_korean:
  - 우리 하나님의 발받침
  - 우리 하나님의 발등상
  lexicon: HALOT
  rationale: 히브리어의 은유를 과도하게 설명하지 않고 보존하되, 한국어에서 가장 직관적인 신체 은유로 옮겼습니다.
theological_decisions:
- issue: 야훼와 우리 하나님의 병렬 표현 유지
  chosen_reading: ‘야훼의 언약궤’와 ‘우리 하나님의 발판’을 병렬로 유지했습니다.
  alternative_readings:
  - ‘야훼의 언약궤’만 강조하고 뒤의 구를 풀어 설명하기
  - 두 표현을 하나로 합쳐 의역하기
  rationale: 본문은 언약궤를 야훼의 언약궤로 부르면서 동시에 하나님의 임재와 관련된 발판으로 병치합니다. 두 표현의 긴장을 유지하는 것이 본문의 신학적 밀도를 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2; Psalm 132:7 연관 구절
- issue: 다윗의 발화체와 정중한 명령형
  chosen_reading: 공적 연설이므로 청중에게는 ‘들으십시오’의 합쇼체를 썼습니다.
  alternative_readings:
  - 평서형으로 완화하기
  - 친밀한 반말로 옮기기
  rationale: 본문의 왕의 공개 발언이라는 장면성과 한국어 현대 문체를 함께 고려하면, 정중한 명령형이 가장 자연스럽고 원문 기능에 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
