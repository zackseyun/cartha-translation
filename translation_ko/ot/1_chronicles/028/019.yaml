source:
  edition: WLC
  text: הַ/כֹּ֥ל בִּ/כְתָ֛ב מִ/יַּ֥ד יְהוָ֖ה עָלַ֣/י הִשְׂכִּ֑יל כֹּ֖ל מַלְאֲכ֥וֹת הַ/תַּבְנִֽית׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
  footnotes:
  - marker: a
    text: Or, 'The hand of the LORD was upon me, and he made me understand all the works of the pattern.'
    reason: alternative_reading
  - marker: b
    text: '''Pattern'' may also be rendered ''plan'' or ''design.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 손이 내 위에 임하여, 이 모든 것, 곧 이 설계에 따른 모든 일을 글로 내가 깨닫게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘설계’는 ‘모형’ 또는 ‘계획’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 압축된 표현입니다. ‘야훼의 손에서 글로 내게 깨닫게 하셨다’ 또는 ‘야훼의 손이 내 위에 있어 내가 이 모든 것을 글로 깨닫게 되었다’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל
  english_pob_choice: All this
  chosen_korean: 이 모든 것
  alternatives_korean:
  - 모든 것
  - 이 모두
  lexicon: HALOT
  rationale: 문맥상 바로 앞에서 말한 성전 설계 전체를 가리키므로, 지시성을 살린 ‘이 모든 것’이 자연스럽고 원문의 포괄성을 유지합니다.
- source_word: בִּכְתָב
  english_pob_choice: in writing
  chosen_korean: 글로
  alternatives_korean:
  - 기록으로
  - 문서로
  lexicon: HALOT
  rationale: בְּ + כְּתָב은 서면 전달을 가리키므로, 현대 한국어에서 간결하게 ‘글로’라고 옮겨 서면 형식을 드러냈습니다.
- source_word: מִיַּד יְהוָה
  english_pob_choice: from the hand of Yahweh
  chosen_korean: 야훼의 손에서
  alternatives_korean:
  - 야훼에게서
  - 야훼의 손으로부터
  lexicon: HALOT
  rationale: ‘손’의 관용구를 살려 직접적인 신적 기원을 드러냈습니다. 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: הִשְׂכִּיל
  english_pob_choice: he made clear to me
  chosen_korean: 깨닫게 하셨으니
  alternatives_korean:
  - 이해하게 하셨으니
  - 명확히 알려 주셨으니
  - 알게 하셨으니
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리면서, POB가 문맥상 ‘made clear’로 이해한 점을 반영해 결과를 읽기 쉬운 동사구로 옮겼습니다.
- source_word: הַתַּבְנִית
  english_pob_choice: the pattern
  chosen_korean: 모형
  alternatives_korean:
  - 모양
  - 설계
  - 계획
  lexicon: HALOT
  rationale: 성전 맥락에서 תַּבְנִית는 단순한 추상적 ‘계획’보다 눈에 보이는 본보기/도면의 성격을 띠므로, ‘모형’이 가장 원문에 가깝습니다.
theological_decisions:
- issue: מִיַּד יְהוָה עָלַי הִשְׂכִּיל의 문장 관계
  chosen_reading: 야훼의 손이 내 위에 임한 상태에서, 그분이 다윗에게 성전의 모든 모형을 깨닫게 하신 것으로 표현했습니다.
  alternative_readings:
  - 야훼의 손이 내 위에 있으니, 그분이 깨닫게 하셨습니다
  - 야훼의 손으로 내게 임하여 깨닫게 하셨습니다
  rationale: 히브리어는 매우 압축되어 있어 주어와 부속절의 관계를 여러 방식으로 풀 수 있습니다. 본문이 강조하는 신적 계시와 직접적 기원을 함께 드러내되, 한쪽 해석으로 과도하게 평탄화하지 않았습니다.
  doctrine_reference: 'Translation philosophy #3: preserve theological tension rather than resolve it'
