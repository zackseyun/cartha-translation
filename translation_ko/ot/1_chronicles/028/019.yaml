revisions:
- from: 이 모든 것을 야훼의 손에서, 곧 내게 임한 그분의 손으로, 글로 깨닫게 하셨으니, 곧 그 모든 모형의 일입니다.[a][b]
  to: 야훼의 손이 내 위에 임하여, 이 모든 것, 곧 이 설계에 따른 모든 일을 글로 내가 깨닫게 하셨습니다.[a][b]
  rationale: 원문의 어순과 압축성을 가능한 한 보존하면서, ‘글로’가 깨닫게 된 내용의 전달 형식을 나타내고 ‘이 설계에 따른 모든 일’이 깨달음의 목적어임을 한국어 문장 안에서 분명히 했습니다. ‘손이 내 위에 임하여’는 עָלַי의 자연스러운 한국어 대응이지만, 구문의 다른 연결 가능성은 주석으로 남겼습니다.
