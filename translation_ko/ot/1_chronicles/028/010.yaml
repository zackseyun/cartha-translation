id: 1CH.28.10
reference: 1 Chronicles 28:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
  footnotes:
  - marker: a
    text: Or 'Consider now' or 'Take heed now.' The opening imperative calls for attentive reflection, not only physical sight.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a house for the sanctuary'; that is, the temple building as a holy place.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오. 야훼께서 당신에게 성전을 위한 한 집을 짓도록 당신을 택하셨습니다. 강하고, 그 일을 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 명령형 רְאֵה는 단순히 ‘보다’가 아니라 ‘주의를 기울이다/살펴보다’라는 권면을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘한 집을 위한 성소/성전’에 해당하는 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  english_pob_choice: See now
  chosen_korean: 이제 보십시오
  alternatives_korean:
  - 이제 고려하십시오
  - 이제 살펴보십시오
  - 이제 보십시오
  lexicon: HALOT
  rationale: ראה의 명령형은 단순 시각이 아니라 주의를 환기하는 호소이므로, 한국어에서는 공손한 주의 환기 표현인 ‘이제 보십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 POB 기준에 따라 신적 고유명사인 ‘야훼’로 옮겨야 하므로, 관용적 대체어인 ‘주님’ 대신 직접 음역을 사용했습니다.
- source_word: בַּיִת לַמִּקְדָּשׁ
  english_pob_choice: a house for the sanctuary
  chosen_korean: 성전을 위한 한 집
  alternatives_korean:
  - 성소를 위한 집
  - 성전을 위한 집
  - 한 성전
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘집’과 ‘성소’를 함께 쓰므로, 해석어 ‘성전’을 완전히 풀어버리기보다 ‘한 집’과 목적어구를 살려 원문 순서를 최대한 유지했습니다.
- source_word: חֲזַק וַעֲשֵׂה
  english_pob_choice: Be strong, and do it
  chosen_korean: 강하고, 그 일을 하십시오
  alternatives_korean:
  - 강건하십시오, 그리고 행하십시오
  - 힘내십시오, 그리고 하십시오
  - 강하고, 그것을 하십시오
  lexicon: HALOT
  rationale: חזק는 권면적 명령으로 ‘강하고’가 가장 직접적이며, עשה는 문맥상 건축 과업의 수행을 가리키므로 ‘그 일’을 보충해 한국어에서 자연스럽게 했습니다.
theological_decisions:
- issue: 야훼의 선택을 개인적 호의가 아닌 성전 건축 사명 부여로 표현할지 여부
  chosen_reading: ‘야훼께서 당신에게 성전을 위한 한 집을 짓도록 당신을 택하셨습니다’로 옮겨, 선택의 목적이 명시되도록 했습니다.
  alternative_readings:
  - 야훼께서 당신을 택하셨습니다
  - 야훼께서 당신을 선택하셔서 집을 짓게 하셨습니다
  rationale: בחר는 단순 선호가 아니라 특정 사명을 위한 선택을 뜻하므로, 목적절을 분명히 드러내야 본문의 위임적 뉘앙스가 보존됩니다.
  doctrine_reference: 'Translation philosophy: source-directed election-for-task reading'
