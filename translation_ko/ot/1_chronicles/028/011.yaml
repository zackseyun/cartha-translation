base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
  footnotes:
  - marker: a
    text: Or 'the atonement cover' for 'the mercy seat.' The Hebrew כַּפֹּרֶת refers to the cover of the ark in the Most Holy Place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 자기 아들 솔로몬에게 현관의 모형과 그 건물들, 그 창고들, 그 윗방들, 그 안쪽 방들, 그리고 속죄소의 집의 설계를 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄 덮개’. 히브리어 כַּפֹּרֶת는 지성소에 있는 언약궤의 덮개를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  english_pob_choice: plan
  chosen_korean: 설계
  alternatives_korean:
  - 모형
  - 양식
  - 도면
  lexicon: HALOT
  rationale: 건축 맥락에서 תַּבְנִית는 단순한 ‘형태’보다 전달된 구체적 설계안을 가리키므로, 현대 한국어에서는 ‘설계’가 가장 자연스럽고 정확합니다.
- source_word: הָאוּלָם
  english_pob_choice: the portico
  chosen_korean: 현관
  alternatives_korean:
  - 주랑
  - 포르티코
  - 전실
  lexicon: HALOT
  rationale: 성전 건축의 입구 공간을 가리키는 말이지만, 한국어에서는 낯선 음역보다 ‘현관’이 기능을 가장 분명하게 드러냅니다.
- source_word: בָּתָּיו / גַנְזַכָּיו / עֲלִיֹּתָיו / חֲדָרָיו הַפְּנִימִים
  english_pob_choice: its houses, its treasuries, its upper rooms, its inner chambers
  chosen_korean: 그 건물들, 그 창고들, 그 윗방들, 그 안쪽 방들
  alternatives_korean:
  - 그 집들, 그 보물창고들, 그 위층 방들, 그 내실들
  - 그 부속 건물들, 그 보관실들, 그 상층 חדר들, 그 내부 חדר들
  lexicon: HALOT
  rationale: 여러 복수 명사들이 성전 परिसर의 구조 요소들을 나열하므로, 각각의 기능을 살려 ‘건물들/창고들/윗방들/안쪽 방들’로 옮겼습니다.
- source_word: בֵית הַכַּפֹּרֶת
  english_pob_choice: the house of the mercy seat
  chosen_korean: 속죄소의 집
  alternatives_korean:
  - 자비의 자리의 집
  - 속죄소가 있는 집
  - 속죄소 방
  lexicon: HALOT
  rationale: כַּפֹּרֶת는 성막·성전 맥락에서 언약궤 덮개, 곧 속죄소를 가리키므로, 직역에 가까운 ‘속죄소’로 옮겨 원문의 연결을 유지했습니다.
theological_decisions:
- issue: כַּפֹּרֶת의 한국어 표준 용어 선택
  chosen_reading: 속죄소
  alternative_readings:
  - 은혜좌
  - 자비의 보좌
  - 속죄 덮개
  rationale: 이 구절은 성전 구조 설명이므로 전통적 교회어 ‘은혜좌’보다 히브리어 המקרא 용례를 직접 반영하는 ‘속죄소’가 더 투명합니다.
  doctrine_reference: 템플 용어의 स्रोत-직역 원칙
