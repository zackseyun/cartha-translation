  naturalness: “성전 현관과 그 건물들, 창고들, 윗방들, 안쪽 방들, 그리고 속죄소의 방에 관한 설계”라고 하면 하나의 설계가 열거된 모든 건축 요소에 걸친다는 관계가 자연스럽고 분명합니다. 현대 표준어 합쇼체에도 맞습니다.
