base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
  footnotes:
  - marker: a
    text: Or 'He will not let go of you'; the Hebrew verb can carry the sense of not slackening or dropping one's support.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 그의 아들 솔로몬에게 말했습니다. “강하고 담대하십시오. 그리고 그 일을 하십시오. 두려워하지 말고 낙담하지도 마십시오. 야훼 하나님, 나의 하나님이 당신과 함께 계십니다. 그분은 야훼의 집에서 드리는 섬김을 위한 모든 일이 끝날 때까지 당신을 놓지 않으시고[a] 버리지 않으실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놓지 않으시고’로 옮긴 히브리어 동사 רפה는 ‘느슨하게 놓다’ 또는 ‘지탱을 풀다’의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  english_pob_choice: Be strong and courageous
  chosen_korean: 힘을 내고 용감하게 행동하십시오
  alternatives_korean:
  - 강하고 담대하십시오
  - 굳세고 용감하십시오
  lexicon: HALOT
  rationale: 짝을 이룬 명령형으로서 단순한 내적 상태보다 과업 수행을 위한 적극적 태도를 강조하므로, 한국어에서는 자연스러운 합쇼체 명령으로 옮겼습니다.
- source_word: וַעֲשֵׂה
  english_pob_choice: and do it
  chosen_korean: 행동하십시오
  alternatives_korean:
  - 하고 마십시오
  - 그 일을 하십시오
  lexicon: HALOT
  rationale: 문맥상 성전 건축 준비를 실제로 실행하라는 촉구이므로, 목적어를 되풀이하기보다 ‘행동하십시오’로 과업 지향성을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 고유명사로서 언약명 자체를 보존하기 위해 전통적 대체어 대신 ‘야훼’를 사용했습니다.
- source_word: לֹא יַרְפְּךָ וְלֹא יַעַזְבֶךָּ
  english_pob_choice: He will not fail you or forsake you
  chosen_korean: 당신을 붙들어 주시고 당신을 버리지 않으실 것입니다
  alternatives_korean:
  - 당신을 놓지 않으시고 버리지 않으실 것입니다
  - 당신을 저버리지도 떠나지 않으실 것입니다
  lexicon: HALOT
  rationale: רפה는 ‘느슨하게 놓다/지탱을 풀다’의 의미가 있어 단순한 ‘실패하다’보다 지지의 지속을 드러내는 ‘붙들어 주시다’가 더 원문에 가깝습니다. עזב은 언약적 맥락에서 ‘버리다’가 적절합니다.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  english_pob_choice: all the work for the service of the house of Yahweh
  chosen_korean: 야훼의 집을 섬기는 모든 일
  alternatives_korean:
  - 야훼의 집의 봉사에 관한 모든 일
  - 야훼의 집의 모든 섬김의 일
  lexicon: HALOT
  rationale: 중첩된 소유/목적 구조를 한국어에서 자연스럽게 풀어, ‘일’과 ‘섬김’을 함께 살리면서도 과도한 직역을 피했습니다.
theological_decisions:
- issue: 하나님의 언약명 יְהוָה의 처리
  chosen_reading: 본문과 주해 문맥에서 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 하나님의 개인명 자체를 직접 사용하므로, 호칭 대체보다 원문 고유명 보존이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 다윗의 격려 연설에서 명령형 어조의 재현
  chosen_reading: ‘힘을 내고 용감하게 행동하십시오’처럼 공적 권면의 합쇼체 명령으로 옮겼습니다.
  alternative_readings:
  - 강하고 담대하시오
  - 두려워하지 마십시오
  rationale: 솔로몬에게 주는 직접 권면이므로 너무 완곡하게 만들지 않고, 현대 한국어의 격려·권면 문체를 유지했습니다.
  doctrine_reference: Korean style and register guidelines
