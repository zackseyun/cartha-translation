base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
  footnotes:
  - marker: a
    text: Hebrew literally, 'by the weight of lampstand and lampstand' and 'according to the service of lampstand and lampstand,' a distributive expression meaning each lampstand individually.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 금 촛대들과 그 촛대들의 등잔들의 무게, 곧 각 촛대와 그 등잔들의 무게와, 은 촛대들에 대해서는 각 촛대와 그 등잔들의 무게를, 각 촛대의 직무에 따라 정하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘촛대와 촛대의 무게’ 및 ‘촛대와 촛대의 직무에 따라’라고 하여, 각 촛대를 항목별로 따로 배정하는 분배적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרוֹת
  english_pob_choice: lampstands
  chosen_korean: 촛대들
  alternatives_korean:
  - 등잔대들
  - 메노라들
  lexicon: HALOT
  rationale: 성막·성전 기물을 가리키는 מְנוֹרָה를 한국어로는 문맥상 ‘촛대’가 가장 자연스럽고, ‘메노라’는 음역보다 기능이 분명합니다.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  english_pob_choice: their lamps / its lamps
  chosen_korean: 그 촛대들의 등잔들 / 그 등잔들
  alternatives_korean:
  - 등불들
  - 램프들
  lexicon: HALOT
  rationale: נֵר은 개별 등불을 뜻하므로, 촛대와 구별되도록 ‘등잔들’로 옮겼습니다.
- source_word: מִשְׁקָל
  english_pob_choice: weight
  chosen_korean: 무게
  alternatives_korean:
  - 중량
  - 계량
  lexicon: HALOT
  rationale: 성전 기물의 배분을 가리키는 문맥에서 ‘무게’가 가장 직관적이며, 분량을 저울로 재는 뜻을 드러냅니다.
- source_word: כַּעֲבוֹדַת
  english_pob_choice: according to the service of
  chosen_korean: 각 촛대의 직무에 따라
  alternatives_korean:
  - 각 촛대의 용도에 따라
  - 각 촛대의 섬김에 따라
  lexicon: HALOT
  rationale: עֲבוֹדָה는 성소 문맥에서 단순한 ‘사용’보다 직무·봉사를 뜻하므로, 성전 기능을 살려 ‘직무’로 옮겼습니다.
theological_decisions:
- issue: 반복 구조의 분배적 의미
  chosen_reading: ‘촛대와 촛대’의 반복을 ‘각 촛대’로 풀어, 항목별로 따로 정해진 무게라는 뜻을 드러냈습니다.
  alternative_readings:
  - 직역하여 ‘촛대와 촛대’라고 반복
  - ‘하나하나의 촛대’로 의역
  rationale: 히브리어의 분배적 반복을 한국어에서 자연스럽게 전달하면서도, 개별 항목을 각각 계산했다는 의미를 보존합니다.
  doctrine_reference: 본문의 수량·배분 표현에 관한 해석 문제
- issue: 성전 기물의 제의적 어휘
  chosen_reading: ‘직무’라는 표현을 사용해 촛대가 단순 장식품이 아니라 성소에서 기능하는 제의 기물임을 반영했습니다.
  alternative_readings:
  - 용도
  - 업무
  rationale: 문맥은 물품 목록이 아니라 성전 봉사 체계의 배정이므로, 제의적 성격을 드러내는 번역이 적절합니다.
  doctrine_reference: 성전 예배 질서와 관련된 문맥 해석
