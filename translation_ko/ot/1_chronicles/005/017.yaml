  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
  footnotes:
  - marker: a
    text: Or, 'were registered by genealogies' or 'were reckoned by genealogy.' The Hebrew verb refers to being entered in a genealogical record.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 모두는 유다 왕 요담 때와 이스라엘 왕 여로보암 때에 족보에 등록되었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘족보에 따라 등록되었습니다’ 또는 ‘계보로 헤아려졌습니다.’ 히브리어 동사는 족보 기록에 등재되는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻלָּם
  english_pob_choice: All of them
  chosen_korean: 그들 모두는
  alternatives_korean:
  - 모두는
  - 그들 전부는
  lexicon: HALOT
  rationale: 3인칭 복수 접미사가 붙은 총칭을 한국어에서는 주어를 분명히 드러내는 ‘그들 모두는’으로 옮겨, 문장의 대상을 자연스럽고 명시적으로 보이게 했습니다.
- source_word: הִתְיַחְשׂוּ
  english_pob_choice: were enrolled by genealogy
  chosen_korean: 족보로 등록되었습니다
  alternatives_korean:
  - 족보에 등록되었습니다
  - 족보에 따라 계보로 기록되었습니다
  - 계보로 기재되었습니다
  lexicon: HALOT
  rationale: 열왕기·역대기의 계보 행정 맥락을 반영해, 단순한 ‘기록’보다 문서 편입의 뉘앙스를 살린 ‘족보로 등록되었습니다’로 옮겼습니다.
- source_word: בִּימֵי ... וּבִימֵי ...
  english_pob_choice: in the days of ... and in the days of ...
  chosen_korean: '...의 시대에 ...의 시대에'
  alternatives_korean:
  - '... 때에 ... 때에'
  - '... 통치 기간에 ... 통치 기간에'
  lexicon: HALOT
  rationale: 히브리어의 반복되는 시간표현을 한국어에서도 병렬로 유지하되, 왕 통치 문맥에서는 ‘시대에’가 가장 자연스럽고 원문 구조도 잘 드러냅니다.
- source_word: מֶלֶךְ יְהוּדָה / מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: king of Judah / king of Israel
  chosen_korean: 유다 왕 / 이스라엘 왕
  alternatives_korean:
  - 유다의 왕 / 이스라엘의 왕
  - 유다의 임금 / 이스라엘의 임금
  lexicon: HALOT
  rationale: 히브리어의 직설적 직함 구조를 따라, 왕의 소속을 자연스럽게 보여 주는 ‘유다 왕’, ‘이스라엘 왕’으로 옮겼습니다.
