    text: Or 'leader' or 'prince' for 'the ruler.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 유다가 그의 형제들보다 우세하였고, 그에게서 통치자가 나왔으나, 장자권은 요셉에게 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘통치자’는 ‘지도자’ 또는 ‘방백’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 곧
  lexicon: HALOT
  rationale: 앞절과의 설명적 연결을 자연스럽게 살리면서, 원문의 논리적 근거 제시를 한국어로 간결하게 전달합니다.
- source_word: גָּבַר בְּאֶחָיו
  english_pob_choice: prevailed over his brothers
  chosen_korean: 그의 형제들보다 우세하였고
  alternatives_korean:
  - 그의 형제들 위에 있었다
  - 그의 형제들 가운데서 두드러졌고
  lexicon: HALOT
  rationale: גָּבַר의 비교적 우위 의미를 반영해 단순한 강함보다 ‘우세함’을 택했습니다. בְּאֶחָיו는 관계를 유지하면서도 비교 우위를 드러냅니다.
- source_word: וּלְנָגִיד
  english_pob_choice: came the ruler
  chosen_korean: 통치자가 나오게 되었으나
  alternatives_korean:
  - 지도자가 나오게 되었으나
  - 방백이 나오게 되었으나
  lexicon: HALOT
  rationale: נָגִיד의 기능적 의미를 살려 왕조적·통치적 출현을 나타내는 ‘통치자’로 옮겼습니다. 문맥상 단순 직책보다 출신의 의미가 있어 ‘나오게 되었습니다’를 붙였습니다.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  english_pob_choice: though the birthright belonged to Joseph
  chosen_korean: 장자권은 요셉에게 있었습니다
  alternatives_korean:
  - 그러나 장자권은 요셉에게 있었습니다
  - 그런데도 장자권은 요셉에게 있었습니다
  lexicon: HALOT
  rationale: בְּכֹרָה는 문자적 ‘맏아들의 권리’로서 장자권이 적절합니다. לְיוֹסֵף의 소속/귀속을 한국어 소유 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 유다의 통치 우위와 요셉의 장자권의 긴장 유지
  chosen_reading: 유다는 형제들 가운데 통치적 우위를 차지하지만, 장자권은 요셉에게 남아 있습니다.
  alternative_readings:
  - 유다의 우세가 곧 장자권을 뜻한다고 통합해 읽는 해석
  - 요셉의 장자권을 단지 재산상 몫으로 축소하는 해석
  rationale: 히브리어는 유다의 지배/통치 출현과 요셉의 장자권을 병렬로 놓아 서로 다른 지위를 구분합니다. 번역도 이 긴장을 풀지 않고 보존합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
