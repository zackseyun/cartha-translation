- from: 이는 유다가 그의 형제들보다 우세하였고, 그에게서 통치자가 나오게 되었으나, 장자권은 요셉에게 있었습니다.[a]
  to: 이는 유다가 그의 형제들보다 우세하였고, 그에게서 통치자가 나왔으나, 장자권은 요셉에게 있었기 때문입니다.[a]
  rationale: 수정문은 כִּי의 설명적 기능을 ‘이는 … 때문입니다’로 문법적으로 완결해 보존했습니다. 유다의 우세와 그에게서 나온 통치자, 그리고 요셉에게 속한 장자권 사이의 대조도 유지했습니다. ‘그에게서’는 히브리어 단수 대명사의 유다 지시를 그대로 반영하며, 각주는 נָגִיד의 대체 번역을 정확하게 제시합니다.
