base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
  footnotes:
  - marker: a
    text: Or, 'because the battle belonged to God.' The Hebrew phrase emphasizes that the battle's outcome came from God.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람이 죽임을 당해 쓰러졌습니다. 그 전쟁이 하나님에게서 난 것이었기 때문입니다.[a] 그들은 포로 생활 때까지 그들의 자리를 대신하여 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 전쟁이 하나님께 속한 것이었기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲלָלִים רַבִּים
  english_pob_choice: many slain
  chosen_korean: 많은 사람이 죽임을 당하였음
  alternatives_korean:
  - 많은 죽은 자가
  - 많은 전사자가
  lexicon: HALOT
  rationale: חֲלָלִים은 전투에서 쓰러져 죽은 자들을 가리키므로, 단순한 ‘죽은 사람’보다 ‘죽임을 당한 사람들’이 전투적 뉘앙스를 잘 살립니다.
- source_word: נָפָלוּ
  english_pob_choice: fell
  chosen_korean: 죽임을 당하였음
  alternatives_korean:
  - 쓰러졌음
  - 넘어졌음
  lexicon: HALOT
  rationale: נפל은 전쟁 문맥에서 ‘쓰러지다’로 자주 쓰이지만, 앞의 חֲלָלִים가 이미 죽임의 의미를 담고 있어 한국어에서는 중복을 피하면서 결과를 분명히 했습니다.
- source_word: מֵהָאֱלֹהִים
  english_pob_choice: from God
  chosen_korean: 하나님에게서
  alternatives_korean:
  - 하나님으로부터
  - 하나님에게서 난
  lexicon: HALOT
  rationale: מִן의 출처·기원을 살려, 전쟁의 निर्ण정적 원천이 하나님에게 있음을 직접적으로 드러내는 표현을 택했습니다.
- source_word: עַד הַגֹּלָה
  english_pob_choice: until the exile
  chosen_korean: 포로로 잡혀 갈 때까지
  alternatives_korean:
  - 포로기까지
  - 유배 때까지
  lexicon: HALOT
  rationale: גּוֹלָה는 단순 시기표시가 아니라 실제 추방·포로됨을 가리키므로, 역사적 사건감을 살려 풀어 옮겼습니다.
theological_decisions:
- issue: 전쟁의 주권이 누구에게 있는가
  chosen_reading: 전쟁이 하나님에게서 났기 때문
  alternative_readings:
  - 전쟁이 하나님께 속했기 때문
  - 하나님이 전쟁을 주셨기 때문
  rationale: 히브리어는 전쟁의 결과와 기원을 하나님께 돌리므로, 그 주권적 기원을 약화하지 않으면서도 본문의 범위를 넘지 않게 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3
