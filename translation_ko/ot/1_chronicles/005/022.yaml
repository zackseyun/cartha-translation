  source_fidelity: ‘하나님에게서’는 מֵהָאֱלֹהִים의 출처·기원 표현을 적절히 반영하지만, ‘자기 자리에서’는 תַחְתֵּיהֶם(패한 이들의 자리를 대신하여)의 대체·점유 의미를 충분히 드러내지 못합니다. 또한 ‘포로로 잡혀 갈 때까지’는 가능하나, 본문의 역사적 표지인 ‘그 포로 생활/유배’로 옮기는 편이 간결하고 정확합니다.
