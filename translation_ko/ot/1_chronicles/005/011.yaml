source:
  edition: WLC
  text: וּ/בְנֵי גָ֣ד לְ/נֶגְדָּ֗/ם יָֽשְׁב֛וּ בְּ/אֶ֥רֶץ הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
  footnotes:
  - marker: a
    text: Or “next to them” or “facing them”; the Hebrew expression indicates relative position with respect to the group mentioned previously.
    reason: lexical_alternative
  - marker: b
    text: Salecah is also rendered “Salkah” in some translations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 갓의 아들들은 바산 땅에서 그들 맞은편에 살았으며, 살르가까지 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 맞은편에’는 히브리어 표현이 앞선 집단에 대한 상대적 위치를 나타내며, ‘그들 옆에’ 또는 ‘그들을 마주하여’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 지명은 다른 번역본에서 ‘살레가’ 또는 ‘살카’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  english_pob_choice: And the sons of Gad
  chosen_korean: 갓의 아들들
  alternatives_korean:
  - 갓의 자손들
  - 갓 사람들
  lexicon: WLC/HALOT
  rationale: 족장·지파 표지인 בני는 직역형을 살리되, 현대 한국어에서는 자연스럽게 ‘아들들’보다 ‘자손들’도 가능하지만, 본문의 계보·지파 목록 문맥을 보존하려고 ‘갓의 아들들’로 옮겼습니다.
- source_word: לְ/נֶגְדָּ/ם
  english_pob_choice: opposite them
  chosen_korean: 그들 맞은편에
  alternatives_korean:
  - 그들 앞에
  - 그들 옆에
  - 그들을 마주하여
  lexicon: HALOT
  rationale: נגד는 위치상 ‘맞은편/마주한 곳’의 뜻을 가지므로, 영어 POB의 ‘opposite them’과 같은 공간 관계를 한국어로 가장 सीधे하게 드러냈습니다.
- source_word: יָשְׁבוּ
  english_pob_choice: lived
  chosen_korean: 살았으며
  alternatives_korean:
  - 거주했으며
  - 거했으며
  - 정착했으며
  lexicon: HALOT
  rationale: 정주 상태를 나타내는 יָשׁב를 현대 한국어 서술체로 자연스럽게 옮기되, ‘정착했다’처럼 행위성을 과도하게 강조하지 않도록 했습니다.
- source_word: עַד סַלְכָה
  english_pob_choice: as far as Salecah
  chosen_korean: 살르가까지
  alternatives_korean:
  - 살레가까지
  - 살카까지
  lexicon: HALOT
  rationale: 지명 סַלְכָה는 영어 POB의 Salecah를 참고하되, 한국어 음역으로는 ‘살르가’가 가장 무리 없이 읽히도록 조정했습니다. 끝까지의 경계를 나타내는 עַד는 ‘까지’로 옮겼습니다.
theological_decisions:
- issue: 지파 경계의 공간 표현
  chosen_reading: ‘그들 맞은편에’로 번역해, 단순 인접이 아니라 앞서 언급된 집단과의 상대적 위치를 보존했습니다.
  alternative_readings:
  - 그들 옆에
  - 그들을 마주하여
  rationale: 이 구절은 교리적 쟁점보다 지리적 관계를 전달하는 문맥이므로, נגד의 관계성을 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: 본문의 역사·지리 서술
