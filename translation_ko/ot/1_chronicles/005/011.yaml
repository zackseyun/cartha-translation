  source_fidelity: 히브리어의 어순과 핵심 지리 관계는 대체로 반영되어 있습니다. 다만 בני גד는 이 문맥에서 갓 지파의 구성원을 가리키므로 ‘갓의 아들들’보다 ‘갓 자손’이 한국어에서 더 정확하고 자연스럽습니다. 또한 각주 표지는 해당 표현과 지명에 직접 붙이는 편이 명확합니다.
  naturalness: ‘갓의 아들들’은 현대 한국어에서 갓 개인의 직계 아들들처럼 들릴 수 있습니다. ‘갓 자손은 그들 맞은편, 바산 땅에 살았으며 살르가까지 이르렀습니다’는 지파·영토 목록 문맥에 맞고 합쇼체로 자연스럽습니다.
  terminology: ‘갓 자손’, ‘바산’, ‘살르가’를 사용합니다. ‘살르가’는 한국어 성경 지명 표기에서 널리 쓰이는 형태이며, 대안 표기는 각주에서 처리할 수 있습니다. נגד의 정확한 지리적 관계가 불확실하므로 ‘맞은편’과 그 대안들을 각주에 보존합니다.
