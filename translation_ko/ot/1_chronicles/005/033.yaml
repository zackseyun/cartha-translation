  text: מְרָיוֹת֙ הוֹלִ֣יד אֶת אֲמַרְיָ֔ה וַ/אֲמַרְיָ֖ה הוֹלִ֥יד אֶת אֲחִיטֽוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/033.yaml
  text: Meraioth fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: ko
  text: 므라욧이 아마랴를 낳았고, 아마랴가 아히둡을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  english_pob_choice: Meraioth
  chosen_korean: 므라욧
  alternatives_korean:
  - 메라욧
  - 메라이옷
  lexicon: 고유명사
  rationale: 대상은 족보 속 인명이므로 음역으로 옮겼습니다. 표준 음운에 맞춰 '므라욧'으로 적어 영어식 표기 Meraioth에 대응했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생각해 냈습니다
  - 낳았으며
  lexicon: ילד (히필)
  rationale: 족보에서 הוֹלִיד는 직접적인 부계 계승을 나타내므로, 현대 한국어에서 자연스럽고 간결한 '낳았습니다'로 옮겼습니다. '아버지가 되었습니다'는 의미는 되지만 족보 서술의 직진성을 약화시킵니다.
- source_word: אֲמַרְיָה
  english_pob_choice: Amariah
  chosen_korean: 아마랴
  alternatives_korean:
  - 아마리아
  - 아마랴스
  lexicon: 고유명사
  rationale: 고유명사 음역입니다. 한국어 성경에서 널리 쓰이는 형태인 '아마랴'를 따랐습니다.
- source_word: אֲחִיטוּב
  english_pob_choice: Ahitub
  chosen_korean: 아히둡
  alternatives_korean:
  - 아히둡
  - 아히툽
  lexicon: 고유명사
  rationale: 고유명사 음역입니다. 한국어 음운에 맞춰 '아히둡'으로 적었습니다.
theological_decisions:
- issue: 족보 동사의 의미를 어떻게 살릴 것인가
  chosen_reading: '''낳았습니다''로 직계 부계 계승을 분명히 드러냈습니다.'
  alternative_readings:
  - '''아버지가 되었습니다'''
  - '''낳았습니다'' 대신 ''아버지가 되었습니다'''
  rationale: 히필 הוֹלִיד는 족보에서 단순한 친족 관계가 아니라 부계 계승을 표시하는 기능이 있으므로, 현대어이면서도 계보적 의미가 직접 드러나는 표현을 선택했습니다.
  doctrine_reference: 족보 본문 해석 원칙
