lexical_decisions:
- source_word: אֲחִי
  english_pob_choice: Ahi
  chosen_korean: 아히
  alternatives_korean:
  - 아기
  lexicon: 고유명사
  rationale: 고유 이름이므로 음역하며, 영어 POB의 Ahi에 맞춰 한국어 표기도 자연스럽게 옮겼습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - 자녀
  lexicon: HALOT
  rationale: 계보 공식이므로 ‘아들’이 가장 직접적이고 자연스럽습니다. 앞의 ‘Ahi’에 이어 두 번 반복되는 בן 관계를 그대로 살렸습니다.
- source_word: רֹאשׁ
  english_pob_choice: head
  chosen_korean: 우두머리
  alternatives_korean:
  - 머리
  - 지도자
  - 장
  lexicon: HALOT
  rationale: 문맥상 행정·가문적 우두머리라는 뜻이 분명하므로, 직역어 ‘머리’보다 한국어에서 의미가 분명한 ‘우두머리’를 택했습니다.
- source_word: בֵּית אֲבוֹתָם
  english_pob_choice: their fathers’ houses
  chosen_korean: 그들의 조상 가문
  alternatives_korean:
  - 그들의 아버지들의 집
  - 그들의 족장 가문
  - 그들의 가문
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘아버지들의 집’은 씨족·가문 단위를 가리키므로, 독자가 의미를 바로 이해하도록 ‘조상 가문’으로 풀어 옮겼습니다.
