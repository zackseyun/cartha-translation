source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
  footnotes:
  - marker: a
    text: Or, 'the spirit of Pul king of Assyria and the spirit of Tilgath-pilneser king of Assyria,' taking the two names as separate rulers rather than two names for the same king.
    reason: alternative_reading
  - marker: b
    text: '''Tilgath-pilneser'' reflects the Hebrew form here; the more familiar English form is ''Tiglath-pileser.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘의 하나님께서 앗수르 왕 풀의 영을, 곧 앗수르 왕 딜갓 빌네셀의 영을 일으키셨고, 그가 르우벤 사람들과 갓 사람들과 므낫세 반 지파를 포로로 끌고 가서 하할라와 하볼과 하라와 고산 강으로 옮기셨습니다. 그들은 오늘까지 거기에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘풀’과 ‘딜갓 빌네셀’을 각각 따로 적어, 같은 왕의 두 이름일 수도 있고 별개의 왕들일 수도 있게 읽힙니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘고산의 강’ 또는 ‘고산 강’으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  english_pob_choice: stirred up
  chosen_korean: 일으키셨고
  alternatives_korean:
  - 흔드셨고
  - 자극하셨고
  - 불러일으키셨고
  lexicon: HALOT
  rationale: 하나님이 왕의 내적 동기를 움직이시는 행위를 자연스러운 한국어로 옮기되, 부정적 뉘앙스가 강한 표현은 피했습니다.
- source_word: ר֣וּחַ ... ר֨וּחַ
  english_pob_choice: the spirit of ... the spirit of
  chosen_korean: 영을, 곧 ... 영을
  alternatives_korean:
  - 마음을, 곧 ... 마음을
  - 기질을, 곧 ... 기질을
  lexicon: HALOT
  rationale: רוּחַ를 여기서는 내면의 충동이나 방향성으로 볼 수 있으나, 본문의 신학적 결을 살리기 위해 ‘영’을 유지했습니다.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  english_pob_choice: Tilgath-pilneser
  chosen_korean: 딜갓 빌네셀
  alternatives_korean:
  - 틸갓 빌네셀
  - 디글랏 빌레셀
  lexicon: transliteration
  rationale: 히브리어 표기를 반영한 음역을 따르되, 한국어 음운에 맞게 표기했습니다. 본문의 고유명사는 익숙한 교회식 고정형보다 원문 반영성을 우선했습니다.
- source_word: וַיַּגְלֵם
  english_pob_choice: he took ... into exile
  chosen_korean: 포로로 끌고 가서
  alternatives_korean:
  - 포로로 잡아가서
  - 유배시켜
  - 포로로 옮겨
  lexicon: HALOT
  rationale: ‘가게 하다’보다 강한 강제 이주·포로화의 의미를 드러내기 위해 ‘포로로 끌고 가다’를 택했습니다.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  english_pob_choice: to Halah, Habor, Hara, and the river Gozan
  chosen_korean: 하할라와 하볼과 하라와 고산 강
  alternatives_korean:
  - 할라와 하볼과 하라와 고산 강
  - 하할라와 하볼과 하라와 고산강
  lexicon: HALOT
  rationale: 지명은 음역을 유지했고, נְהַר גּוֹזָן은 직역형인 ‘고산 강’으로 옮겨 지리적 성격을 드러냈습니다.
theological_decisions:
- issue: פּוּל과 תִּלְּגַת פִּלְנֶסֶר의 관계
  chosen_reading: ‘풀의 영을, 곧 딜갓 빌네셀의 영을’로 옮겨 두 이름을 병렬로 살리되 동일 인물로 단정하지 않았습니다.
  alternative_readings:
  - 두 왕을 별개 인물로 읽는 번역
  - ‘즉’으로 풀과 딜갓 빌네셀을 동일시하는 번역
  rationale: 히브리어는 ‘영’을 두 번 반복해 여지를 남기므로, 번역도 그 긴장을 보존하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 역사적 식별 가능성은 주석으로 남기고 번역문에서 과도하게 해결하지 않습니다.'
