  - severity: high
    issue: ‘곧’이 풀과 틸갓 필네셀을 동일 인물로 본문에서 확정합니다.
    rationale: 히브리어는 두 이름과 ‘영/마음’을 반복하여 연결하며, 동일시와 별개 통치자라는 독법 사이의 문법적 여지를 보존하는 것이 안전합니다.
  - severity: medium
    issue: ‘하할라’는 חַלַח의 음역으로 부정확합니다.
    rationale: 해당 지명은 ‘할라’가 적절합니다.
  - severity: medium
    issue: ‘딜갓 빌네셀’은 히브리어 표기의 자음을 충분히 반영하지 못합니다.
    rationale: תִּלְּגַת פִּלְנֶסֶר에 따라 ‘틸갓 필네셀’로 표기하고, 익숙한 통용 표기는 주석으로 처리하는 편이 낫습니다.
