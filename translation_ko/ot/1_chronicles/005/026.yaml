  naturalness: ‘영을 일으키셨고’는 현대 한국어에서 다소 부자연스럽고 뜻이 불명료할 수 있어, 문맥상 내적 의지·동기를 가리키는 ‘마음을 움직이셨고’가 자연스럽습니다. 앗수르 왕의 행동에 높임 선어말어미를 쓰는 것은 한국어 높임법상 부적절하므로 일반 서술로 고칩니다.
  terminology: 지명 ‘하할라’는 히브리어 חַלַח(Halah)에 맞지 않으므로 ‘할라’로 고칩니다. תִּלְּגַת פִּלְנֶסֶר의 히브리어 자음을 반영하면 ‘틸갓 필네셀’이 적절하며, 통용형 ‘디글랏 빌레셀’은 주석에서 알릴 수 있습니다. 영어 감사 기록의 b 주석은 고산 강이 아니라 이 왕명 표기에 관한 것이므로 앵커와 내용을 바로잡아야 합니다.
