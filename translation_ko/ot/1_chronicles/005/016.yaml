  text: וַ/יֵּֽשְׁב֛וּ בַּ/גִּלְעָ֥ד בַּ/בָּשָׁ֖ן וּ/בִ/בְנֹתֶ֑י/הָ וּ/בְ/כָֽל מִגְרְשֵׁ֥י שָׁר֖וֹן עַל תּוֹצְאוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
  footnotes:
  - marker: a
    text: Literally, 'its daughters,' a Hebrew idiom for dependent towns or villages.
    reason: lexical_alternative
  - marker: b
    text: Or 'open lands' or 'common lands' of Sharon.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'upon their goings out'; that is, to their outer limits or borders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 길르앗[a]과 바산, 그리고 그 성읍들, 또 사론[b]의 모든 목초지[c]와 그 경계까지 거주했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 딸들’이지만, 종속 성읍이나 부속 마을을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 사론의 ‘목초지’는 문맥에 따라 ‘빈 땅’ 또는 ‘공유지’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들의 나감/나가는 곳들’로, 여기서는 외곽이나 경계를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  english_pob_choice: They lived
  chosen_korean: 거주했습니다
  alternatives_korean:
  - 살았습니다
  - 살았었습니다
  - 정착했습니다
  lexicon: HALOT
  rationale: 지속적인 거주 상태를 자연스럽게 나타내면서도, 문맥이 행정·지리적 진술임을 살려 ‘거주했습니다’로 옮겼습니다.
- source_word: וּבִבְנֹתֶיהָ
  english_pob_choice: and its towns
  chosen_korean: 그 성읍들
  alternatives_korean:
  - 그 딸 성읍들
  - 그 마을들
  - 그 산하 성읍들
  lexicon: HALOT
  rationale: 직역하면 ‘그 딸들’이지만, 히브리어 관용구의 뜻은 종속된 성읍들이므로 현대 한국어에서는 ‘그 성읍들’이 가장 분명합니다.
- source_word: מִגְרְשֵׁי
  english_pob_choice: the pasturelands of
  chosen_korean: 목초지
  alternatives_korean:
  - 들판
  - 빈터
  - 공유지
  lexicon: HALOT
  rationale: 주변의 열린 땅이나 방목지라는 뜻을 살려, 지리적·목축적 뉘앙스를 함께 전달하는 ‘목초지’를 택했습니다.
- source_word: עַל תּוֹצְאוֹתָם
  english_pob_choice: as far as their borders
  chosen_korean: 그 경계까지
  alternatives_korean:
  - 그 외곽까지
  - 그 끝까지
  - 그 나가는 곳까지
  lexicon: HALOT
  rationale: 관용적으로 ‘나가는 곳들’이라는 직역보다, 영문 POB가 잡은 공간적 범위를 한국어로 자연스럽게 드러내는 ‘그 경계까지’가 적절합니다.
theological_decisions:
- issue: 지명 나열의 범위와 소유 표현
  chosen_reading: 길르앗과 바산, 그리고 그 성읍들, 또 사론의 모든 목초지와 그 경계까지
  alternative_readings:
  - 길르앗, 바산과 그 성읍들, 사론의 모든 목초지까지
  - 길르앗과 바산 및 그 촌락들, 사론의 모든 들판까지
  rationale: 본문은 이스라엘 지파의 거주 범위를 지리적으로 열거하는 구절이므로, 소유나 정복의 신학적 함의를 덧붙이지 않고 단순한 거주 범위로 유지했습니다.
  doctrine_reference: 역대기 지리·계보 기록의 문맥 보존
