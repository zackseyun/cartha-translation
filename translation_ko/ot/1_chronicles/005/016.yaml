  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
  footnotes:
  - marker: a
    text: Literally, 'its daughters,' a Hebrew idiom for dependent towns or villages.
    reason: lexical_alternative
  - marker: b
    text: Or 'open lands' or 'common lands' of Sharon.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'upon their goings out'; that is, to their outer limits or borders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 길르앗에, 바산과 그 성읍들[a]에, 또 사론의 모든 목초지[b]에, 그 경계[c]까지 거주했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘바산의 딸들’이며, 종속 성읍이나 부속 마을을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘목초지’는 문맥에 따라 ‘빈 땅’ 또는 ‘공유지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들의 나감들’이며, 여기서는 외곽 또는 경계를 뜻합니다.
    reason: lexical_alternative
