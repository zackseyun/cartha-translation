translation:
  language: ko
  text: 그리고 여호사닥은 야훼께서 느부갓네살을 통하여 유다와 예루살렘을 포로로 끌고 가실 때에 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 형식적으로는 ‘그리고 여호사닥은 야훼께서 느부갓네살을 통하여 유다와 예루살렘을 포로로 옮기실 때에 떠났습니다’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹצָדָק
  english_pob_choice: And Jehozadak
  chosen_korean: 그리고 여호사닥
  alternatives_korean:
  - 그리고 요사닥
  - 또 여호사닥
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוֹצָדָק을 한국어 음역으로 옮기되, 표준적으로 더 널리 통용되는 ‘여호사닥’을 택했습니다. 접속사 וְ는 서술 흐름을 이어 주는 ‘그리고’로 반영했습니다.
- source_word: הָלַךְ
  english_pob_choice: went away
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 갔습니다
  - 떠나갔습니다
  - 나갔습니다
  lexicon: HALOT
  rationale: 단순 이동보다 포로 이동의 맥락에서 원거리를 향한 이탈을 드러내는 동사로 ‘떠났습니다’가 가장 자연스럽고 과장되지 않습니다.
- source_word: בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם
  english_pob_choice: when Yahweh sent Judah and Jerusalem into exile
  chosen_korean: 야훼께서 유다와 예루살렘을 포로로 옮기실 때에
  alternatives_korean:
  - 야훼께서 유다와 예루살렘을 포로로 잡아가실 때에
  - 유다와 예루살렘을 유배하실 때에
  lexicon: HALOT
  rationale: בְּ + 히필 부정사 구문을 시간절로 풀어 한국어 자연성을 살렸고, גלה의 핵심을 ‘포로로 옮기다’로 옮겨 강제 이주와 추방의 의미를 함께 담았습니다.
- source_word: בְּ/יַ֖ד נְבֻכַדְנֶאצַּר
  english_pob_choice: by the hand of Nebuchadnezzar
  chosen_korean: 느부갓네살의 손으로
  alternatives_korean:
  - 느부갓네살을 통해
  - 느부갓네살의 손을 빌려
  lexicon: HALOT
  rationale: 히브리어 관용구 בְּיַד는 매개적 수단과 대리 행위를 나타내므로, 직접적인 힘의 매개를 드러내는 ‘손으로’를 유지했습니다.
theological_decisions:
- issue: 야훼의 주권과 바빌론 왕의 도구적 역할
  chosen_reading: 야훼께서 유다와 예루살렘을 포로로 옮기시는 주체로, 느부갓네살은 그 일을 수행한 인간적 도구로 보이게 했습니다.
  alternative_readings:
  - 느부갓네살이 포로로 잡아간 것이 주된 의미로 보이게 하는 번역
  rationale: 원문은 야훼를 부정사 구문의 주어로 두고, ‘느부갓네살의 손으로’라는 표현으로 2차 원인을 표시합니다. 번역도 이 신학적 긴장을 해치지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
