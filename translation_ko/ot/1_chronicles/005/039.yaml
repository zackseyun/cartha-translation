lexical_decisions:
- source_word: וְ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그런데
  lexicon: HALOT
  rationale: 족보 문맥의 단순한 연결어로, 앞뒤 계보 항목을 자연스럽게 잇는 표준적 대응입니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생각했습니다
  - 낳게 했습니다
  lexicon: HALOT
  rationale: 족보에서 הוֹלִיד는 ‘아버지가 되다/낳다’의 계보적 의미이므로, 현대 한국어에서는 간결한 ‘낳았습니다’가 가장 직접적으로 그 관계를 드러냅니다.
- source_word: שַׁלּוּם
  english_pob_choice: Shallum
  chosen_korean: 셸룸
  alternatives_korean:
  - 샬룸
  - 살룸
  lexicon: HALOT
  rationale: 히브리어 이름을 현대 한국어 외래어 표기 방식에 맞춰 옮겼습니다. 영어 관용형보다 원음에 가까운 ‘셸룸’을 채택했습니다.
- source_word: חִלְקִיָּה
  english_pob_choice: Hilkiah
  chosen_korean: 힐기야
  alternatives_korean:
  - 힐키야
  - 힐기아
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 통용되는 표기이면서 히브리어 이름의 음가를 비교적 잘 보존합니다.
- source_word: עֲזַרְיָה
  english_pob_choice: Azariah
  chosen_korean: 아사랴
  alternatives_korean:
  - 아자리야
  - 아자랴
  lexicon: HALOT
  rationale: 히브리어 이름의 한국어 성경 관용 표기를 따랐습니다. 족보 인명에서는 익숙한 고유명사 형태가 가독성을 높입니다.
