  source_fidelity: 히브리어는 두 차례의 הוֹלִיד를 사용하여 살룸에서 힐기야로, 힐기야에서 아사랴로 이어지는 부계 족보 관계를 간결히 진술합니다. 번역은 이 관계와 접속을 대체로 충실히 옮겼습니다. 다만 שַׁלּוּם의 모음은 첫 음절 /a/이므로 ‘셸룸’은 원문 음가와 맞지 않습니다.
