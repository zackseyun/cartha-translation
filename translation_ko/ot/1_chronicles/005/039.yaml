  terminology: 힐기야와 아사랴는 한국어 성경에서 널리 쓰이는 인명 표기와 부합합니다. שַׁלּוּם은 ‘살룸’으로 바로잡는 것이 히브리어 음가 및 한국어 성경의 관용 표기에 적절합니다.
