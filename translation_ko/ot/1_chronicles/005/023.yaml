source:
  edition: WLC
  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
  footnotes:
  - marker: a
    text: Or 'they increased' or 'they multiplied.' The Hebrew verb emphasizes growth in number.
    reason: lexical_alternative
  - marker: b
    text: Baal-hermon, Senir, and Mount Hermon are place names marking the northern extent of the territory.
    reason: cultural_note
translation:
  language: ko
  text: 므낫세의 반지파의 아들들은 바산에서부터 바알 헤르몬과 스니르와 헤르몬 산에 이르기까지 그 땅에 살았으며, 그들은 매우 많아졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이름과 지명은 본문이 북쪽 경계를 이루는 실제 지리적 표지를 나열하고 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘매우 많아졌습니다’는 히브리어 동사의 수적 증가를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 사람들은
  lexicon: HALOT
  rationale: 족보·지파 문맥에서 בני는 단순한 집단명보다 혈연적 소속을 드러내므로, 직역 감각을 살린 ‘아들들’로 옮겼습니다.
- source_word: חֲצִי שֵׁבֶט
  english_pob_choice: the half-tribe
  chosen_korean: 반지파의
  alternatives_korean:
  - 절반 지파의
  - 반쪽 지파의
  lexicon: HALOT
  rationale: 므낫세의 동편 분지파를 가리키는 관용적 표현이므로, 한국어에서도 익숙한 ‘반지파’로 압축해 자연스럽게 처리했습니다.
- source_word: מִבָּשָׁן עַד
  english_pob_choice: from Bashan as far as
  chosen_korean: 바산에서부터 …에 이르기까지
  alternatives_korean:
  - 바산에서 …까지
  - 바산에서 …에 이르도록
  lexicon: HALOT
  rationale: 경계의 시작과 끝을 나타내는 구조를 살려, 한국어에서 범위를 분명하게 하는 ‘에서부터 …에 이르기까지’로 옮겼습니다.
- source_word: הֵמָּה רָבוּ
  english_pob_choice: they became numerous
  chosen_korean: 그들은 매우 많아졌습니다
  alternatives_korean:
  - 그들은 번성했습니다
  - 그들은 증가했습니다
  lexicon: HALOT
  rationale: רבה의 수적 증가를 간결하고 현대적인 표현으로 살리되, 단순한 ‘살다’와 구별되는 결과 상태를 드러내기 위해 ‘매우 많아졌습니다’로 번역했습니다.
