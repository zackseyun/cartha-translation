- source_word: יַחְדִּיאֵל
  english_pob_choice: Jahdiel
  chosen_korean: 야드디엘
  alternatives_korean:
  - 야흐디엘
  - 야디엘
  lexicon: standard transliteration
  rationale: 히브리어 음절 구조를 최대한 반영해 음역했습니다.
theological_decisions:
- issue: 족보 서술의 반복 구조
  chosen_reading: 마지막의 ‘자기 조상의 집안의 우두머리들’은 앞부분을 다시 한 번 확인하는 반복으로 유지했습니다.
  alternative_readings:
  - 반복을 줄여 한 번만 옮김
  - 뒤의 구를 생략해 간결화함
  rationale: 히브리어는 동일한 지위를 의도적으로 재진술하여 이 인물들이 씨족 내 대표자임을 강조하므로, 반복을 보존하는 편이 본문의 강조를 더 잘 드러냅니다.
  doctrine_reference: 본문의 서사·족보적 강조 보존
- issue: ‘mighty men of valor’의 강도 표현
  chosen_reading: ‘큰 용사들’로 옮겨 군사적·영웅적 강함을 드러냈습니다.
  alternative_readings:
  - ‘용맹한 자들’
  - ‘싸움에 능한 자들’
  rationale: 이 표현은 단순한 품행이 아니라 실제적 힘과 용맹을 가리키므로, 완화되지 않게 강한 어감을 유지했습니다.
  doctrine_reference: 본문의 서술적 강도 보존
