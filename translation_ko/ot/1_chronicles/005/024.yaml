source:
  edition: WLC
  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
  footnotes:
  - marker: a
    text: Or 'the heads of their ancestral houses.' The Hebrew expression refers to clan-based family units under a common forefather.
    reason: cultural_note
  - marker: b
    text: Hebrew 'men of names,' that is, men of renown or distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 자기 조상의 집안의 우두머리들이니, 에벨, 이시, 엘리엘, 아스리엘, 예레미야, 호다위야, 야드디엘이며, 큰 용사들이요 이름난 사람들이요 자기 조상의 집안의 우두머리들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 공통 조상을 중심으로 묶인 씨족 단위를 가리키며, 단순한 현대적 의미의 ‘가족’보다 넓습니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘이름의 사람들’로, 곧 명망이나 구별된 지위를 지닌 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבוֹתָם / רָאשִׁים לְבֵית אֲבוֹתָם
  english_pob_choice: the heads of their fathers’ houses
  chosen_korean: 자기 조상의 집안의 우두머리들
  alternatives_korean:
  - 자기 조상의 집안의 수장들
  - 그들의 조상 집안의 우두머리들
  - 족장들
  lexicon: HALOT
  rationale: 족보 문맥의 고정 표현으로, 단순한 ‘가문’보다 히브리어의 씨족·가계 구조를 드러내기 위해 ‘집안’과 ‘우두머리들’을 살렸습니다.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 큰 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 큰 힘 있는 사람들
  - 용사들
  lexicon: HALOT
  rationale: 관용구의 핵심 의미는 전투적 역량과 담대한 강함이므로, 장황한 설명을 줄이고도 힘의 뉘앙스를 유지하는 ‘큰 용사들’로 옮겼습니다.
- source_word: אַנְשֵׁי שֵׁמוֹת
  english_pob_choice: men of renown
  chosen_korean: 이름난 사람들
  alternatives_korean:
  - 명망 있는 사람들
  - 유명한 사람들
  - 명사들
  lexicon: HALOT
  rationale: 직역하면 ‘이름의 사람들’이지만, 한국어에서는 관용적으로 ‘이름난 사람들’이 가장 자연스럽고, 이름이 알려진 명성을 잘 전달합니다.
- source_word: עֵפֶר
  english_pob_choice: Epher
  chosen_korean: 에벨
  alternatives_korean:
  - 에퍼
  - 헤벨
  lexicon: standard transliteration
  rationale: 본문의 자음열에 따라 한국어 음역을 정했으며, 같은 철자의 통용 영어형이 없어도 본문 형태를 우선했습니다.
- source_word: יִשְׁעִי
  english_pob_choice: Ishi
  chosen_korean: 이시
  alternatives_korean:
  - 이쉬
  - 이스히
  lexicon: standard transliteration
  rationale: 고유명사는 현대 외래어 표기 감각에 맞춰 간결하게 음역했습니다.
- source_word: אֱלִיאֵל
  english_pob_choice: Eliel
  chosen_korean: 엘리엘
  alternatives_korean:
  - 엘이엘
  lexicon: standard transliteration
  rationale: 히브리어 고유명사의 통용 음역을 따랐습니다.
- source_word: עַזְרִיאֵל
  english_pob_choice: Azriel
  chosen_korean: 아스리엘
  alternatives_korean:
  - 아즈리엘
  - 아사리엘
  lexicon: standard transliteration
  rationale: 자음군과 현대 한국어 발음 습관을 함께 고려해 음역했습니다.
- source_word: יִרְמְיָה
  english_pob_choice: Jeremiah
  chosen_korean: 예레미야
  alternatives_korean:
  - 예레미아
  - 예르미야
  lexicon: standard biblical form
  rationale: 성경에서 매우 널리 굳은 형태이므로 통용 표기를 유지했습니다.
- source_word: הוֹדַוְיָה
  english_pob_choice: Hodaviah
  chosen_korean: 호다위야
  alternatives_korean:
