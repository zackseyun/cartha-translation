source:
  edition: WLC
  text: בְּנֵ֥י רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל חֲנ֥וֹךְ וּ/פַלּ֖וּא חֶצְר֥וֹן וְ/כַרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: ko
  text: 이스라엘의 맏아들 르우벤의 아들들은 하녹과 발루와 헤스론과 갈미입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 자녀들
  lexicon: HALOT
  rationale: 족보 목록의 בְּנֵי는 직계 남계 후손을 가리키므로, 영어 POB의 'sons of'에 맞춰 한국어도 '아들들'로 옮기는 것이 가장 직접적입니다.
- source_word: בְּכֹר יִשְׂרָאֵל
  english_pob_choice: the firstborn of Israel
  chosen_korean: 이스라엘의 맏아들
  alternatives_korean:
  - 이스라엘의 첫째 아들
  - 이스라엘의 장자
  lexicon: HALOT
  rationale: בְּכֹר는 혈통적·지위적 '장자'이지만, 족보 문맥에서는 관계를 분명히 드러내는 '맏아들'이 자연스럽고 원문 의미를 잘 보존합니다.
- source_word: חֲנוֹךְ
  english_pob_choice: Hanoch
  chosen_korean: 하녹
  alternatives_korean:
  - 하노크
  lexicon: standard transliteration
  rationale: 인명은 현대 한국어 음역 관례를 따르되, 성경 인명으로 널리 쓰이는 형태보다 원음에 가까운 음역을 사용했습니다.
- source_word: פַלּוּא
  english_pob_choice: Pallu
  chosen_korean: 발루
  alternatives_korean:
  - 팔루
  lexicon: standard transliteration
  rationale: 히브리어 자음군과 모음을 반영해 한국어 음역으로 처리했으며, 영어 POB의 표준형 'Pallu'를 그대로 기계적으로 옮기지 않았습니다.
- source_word: חֶצְרוֹן
  english_pob_choice: Hezron
  chosen_korean: 헤스론
  alternatives_korean:
  - 헤츠론
  lexicon: standard transliteration
  rationale: 성경 인명으로 굳어진 관용형보다 원문 음가를 반영한 음역을 택했습니다.
- source_word: כַרְמִי
  english_pob_choice: Carmi
  chosen_korean: 갈미
  alternatives_korean:
  - 카르미
  lexicon: standard transliteration
  rationale: 한국어 성경에서 널리 알려진 인명형을 우선했으며, 족보 항목의 고유명사로서 의미역보다 음역이 적절합니다.
theological_decisions:
- issue: 족보 서술의 문체와 정보량
  chosen_reading: 원문의 단순한 계보 진술을 유지하여, 서술을 늘리거나 관계를 해석적으로 덧붙이지 않았습니다.
  alternative_readings:
  - '''르우벤의 자손들은…''처럼 더 포괄적으로 풀어 쓰는 방식'
  - 인물들의 지위를 설명하는 주석적 확장
  rationale: 이 절은 역사적 족보 목록이므로, 독자가 원문의 계보 정보를 즉시 파악하도록 간결성과 직접성을 유지하는 것이 적절합니다.
  doctrine_reference: 성경 족보 본문의 문학적 기능 존중
- issue: ‘첫아들/장자’의 뉘앙스
  chosen_reading: ‘이스라엘의 맏아들’로 번역해 출생 순서와 관계를 함께 드러냈습니다.
  alternative_readings:
  - '''장자''만 사용해 지위 중심으로 번역'
  - '''첫째 아들''로 더 구어적으로 번역'
  rationale: 원문의 בְּכֹר는 단순 서열뿐 아니라 가족 관계를 함께 암시하므로, '맏아들'이 한국어에서 가장 균형 잡힌 대응입니다.
  doctrine_reference: 장자권/서열 표현의 문맥적 번역
