lexical_decisions:
- source_word: מִיכָה
  english_pob_choice: Micah
  chosen_korean: 미가
  alternatives_korean:
  - 미카
  lexicon: HALOT
  rationale: 고유명사이므로 음역하는 것이 적절하며, 한국어 성경에서 널리 쓰이는 형태인 ‘미가’를 따랐습니다.
- source_word: בְנ/וֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아들
  - 그 아들
  lexicon: HALOT
  rationale: 족보의 반복 공식에서 소유격이 있는 직접적 부자 관계를 나타내므로 ‘그의 아들’이 가장 자연스럽고 정확합니다.
- source_word: רְאָיָה
  english_pob_choice: Reaiah
  chosen_korean: 르아야
  alternatives_korean:
  - 레아야
  - 라아야
  lexicon: HALOT
  rationale: 고유명사이므로 음역했고, 한국어 음가와 외래어 표기 관행에 맞춰 ‘르아야’로 옮겼습니다.
- source_word: בַּעַל
  english_pob_choice: Baal
  chosen_korean: 바알
  alternatives_korean:
  - 주
  - 주인
  lexicon: HALOT
  rationale: 여기서는 족보 안의 인명이므로 тит을 뜻하는 일반 명사로 풀지 않고 음역해 이름의 형식을 보존했습니다.
theological_decisions:
- issue: בַּעַל을 ‘주’로 옮길지, 인명으로 유지할지
  chosen_reading: 인명 ‘바알’로 유지했습니다.
  alternative_readings:
  - ‘주’ 또는 ‘주인’으로 번역
  rationale: 문맥이 족보이며 다른 고유명사들과 병렬로 제시되므로, 제목이나 신적 칭호로 읽기보다 인명으로 보는 것이 본문의 형식과 의미를 가장 잘 보존합니다.
  doctrine_reference: 문맥이 인명으로 제시할 때는 칭호화하지 않고 이름을 보존한다.
