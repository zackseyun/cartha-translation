  text: Ahimaaz fathered Azariah, and Azariah fathered Johanan.
translation:
  language: ko
  text: 아히마아스가 아사랴를 낳았고, 아사랴가 요하난을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  english_pob_choice: Ahimaaz
  chosen_korean: 아히마아스
  alternatives_korean:
  - 아히마츠
  lexicon: HALOT
  rationale: 고유명사는 음역으로 처리하되, 한국어 성경에서 통용되는 현대적 음역인 ‘아히마아스’를 택했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳아 주었습니다
  - 생각했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 הוֹלִיד는 단순 출산이 아니라 계보상 ‘낳다/낳게 하다’의 의미이므로, 현대 한국어에서 자연스럽고 간결한 ‘낳았습니다’로 옮겼습니다.
- source_word: עֲזַרְיָה
  english_pob_choice: Azariah
  chosen_korean: 아사랴
  alternatives_korean:
  - 아자랴
  lexicon: HALOT
  rationale: 성경 인명으로 널리 알려진 표준 한국어 음역을 따랐습니다.
- source_word: יוֹחָנָן
  english_pob_choice: Johanan
  chosen_korean: 요하난
  alternatives_korean:
  - 여호하난
  - 요하난
  lexicon: HALOT
  rationale: 족보 인명은 전통적 교회식 표기보다 원어 기반 음역을 우선하여, 히브리어 יוֹחָנָן을 반영하는 ‘요하난’으로 옮겼습니다.
theological_decisions:
- issue: 족보 동사의 한국어 표현이 출생 사건으로 오해될 가능성
  chosen_reading: ‘낳았습니다’로 계보 형성 행위를 자연스럽게 표현했습니다.
  alternative_readings:
  - 아버지가 되었습니다
  - 낳게 했습니다
  rationale: 이 구절은 역사 서술 속 족보 연결을 말하므로, 원문의 계보적 기능을 살리면서도 한국어에서 가장 직접적인 표현을 사용했습니다.
  doctrine_reference: 역사-계보 본문
