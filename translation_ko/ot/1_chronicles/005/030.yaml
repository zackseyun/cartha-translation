  lexicon: HALOT
  rationale: 고유명사는 널리 통용되는 성경 인명 표기를 따랐으며, 히브리어 음가를 무리 없이 반영했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생각나게 했습니다
  - 낳아 주었습니다
  lexicon: HALOT
  rationale: 족보 문맥의 הוֹלִיד는 단순한 출생이 아니라 계보상 ‘낳다/낳게 하다’의 관계를 나타내므로, 현대 한국어에서는 자연스러운 ‘낳았습니다’가 적절합니다.
- source_word: פִּינְחָס
