  - 피느하스
  lexicon: HALOT
  rationale: 성경에서 확립된 한국어 표기를 따랐습니다.
- source_word: אֲבִישׁוּעַ
  english_pob_choice: Abishua
  chosen_korean: 아비수아
  alternatives_korean:
  - 아비슈아
  - 아비수아흐
  lexicon: HALOT
  rationale: 고유명사는 국내 성경 관용 표기를 우선하여, 족보의 인명 연속성을 분명하게 했습니다.
theological_decisions:
- issue: 족보 동사의 반복 표현
  chosen_reading: 두 절을 모두 ‘낳았습니다’로 평행 처리해 족보의 계보적 연결을 드러냈습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’로 다르게 옮기는 방식
  - ‘~의 아버지였습니다’로 완화하는 방식
  rationale: 원문은 두 번의 הוֹלִיד를 같은 족보 공식으로 반복하므로, 동일한 한국어 동사를 사용해 계보의 연속성과 형식성을 보존하는 편이 더 충실합니다.
  doctrine_reference: 창세기 족보 및 역대기 계보 전승
