translation:
  language: ko
  text: 요엘의 아들들은 이러합니다. 스마야는 그의 아들이고, 곡은 그의 아들이며, 시므이는 그의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들들’은 경우에 따라 ‘후손들’로도 옮길 수 있으나, 여기서는 이어지는 반복 표현이 직계 계보를 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 계보를 여는 표현이므로, 일반적이고 직접적인 ‘아들들’로 옮겼습니다. 영어 POB도 ‘sons of’를 택해 직계 연결을 우선합니다.
- source_word: יוֹאֵל
  english_pob_choice: Joel
  chosen_korean: 요엘
  alternatives_korean:
  - 여엘
  lexicon: 표준 음역
  rationale: 고유명사는 기존 한국어 성경에서 널리 쓰이는 표준 음역 ‘요엘’을 따랐습니다.
- source_word: בְּנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아들
  - 그 아들
  lexicon: HALOT
  rationale: 반복되는 בְּנוֹ는 각 이름 뒤에 붙는 직접 부자 관계를 표시하므로, 한국어에서도 소유격을 유지해 ‘그의 아들’로 반복했습니다.
- source_word: שְׁמַעְיָה / גּוֹג / שִׁמְעִי
  english_pob_choice: Shemaiah / Gog / Shimei
  chosen_korean: 스마야 / 곡 / 시므이
  alternatives_korean:
  - 스마야 / 고그 / 시메이
  lexicon: 표준 음역
  rationale: 인명은 현대 한국어 표기 관행을 따르되, 기존 교회 전통 음역에만 끌려가지 않고 원음에 가까운 음역을 우선했습니다.
theological_decisions:
- issue: 족보 표현 בְּנֵי의 범위
  chosen_reading: 직계 아들들의 계보로 읽었습니다.
  alternative_readings:
