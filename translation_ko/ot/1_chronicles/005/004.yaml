  rationale: 영어 POB 주석처럼 족보 공식은 넓은 후손을 뜻할 수 있지만, 여기서는 각 항목이 연속적으로 ‘그의 아들’로 이어져 직접 계보를 가리키는 흐름이 강합니다.
  doctrine_reference: 족보 본문 해석 원리
