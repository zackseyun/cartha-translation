lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직계 계보를 여는 표현이므로, 일반적이고 직접적인 ‘아들들’로 옮겼습니다. 영어 POB도 ‘sons of’를 택해 직계 연결을 우선합니다.
