  text: 아사랴가 스라야를 낳았고, 스라야가 여호사닥을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  english_pob_choice: Azariah
  chosen_korean: 아사랴
  alternatives_korean:
  - 아자리야
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사는 음역하되, 한국어 성경에서 널리 쓰이는 표준형인 아사랴를 따랐습니다.
- source_word: הוֹלִ֣יד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 הוֹלִיד는 단순히 ‘아버지가 되다’보다 출생 관계를 직접적으로 드러내는 ‘낳다’가 자연스럽고 간결합니다.
- source_word: שְׂרָיָ֔ה
  english_pob_choice: Seraiah
  chosen_korean: 스라야
  alternatives_korean:
  - 세라야
  - 스라야
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사는 한국어 음역으로 옮기되, 본문 전승에서 흔히 보이는 스라야를 사용했습니다.
- source_word: יְהוֹצָדָֽק
  english_pob_choice: Jehozadak
  chosen_korean: 여호사닥
  alternatives_korean:
  - 여호자닥
  - 예호사닥
  lexicon: 고유명사 표기
  rationale: 이름의 야훼-형태 요소를 반영하면서도 한국어 성경에서 익숙한 여호사닥을 채택했습니다.
theological_decisions:
- issue: 족보 동사의 직설성
  chosen_reading: ‘fathered’의 족보적 기능을 한국어에서 ‘낳았습니다’로 직역에 가깝게 살렸습니다.
  alternative_readings:
  - 아버지가 되었습니다
  - ~의 아버지였습니다
  rationale: 이 구절은 신학적 해석보다 계보 전달이 핵심이므로, 관계를 분명히 하는 직접적 표현을 유지했습니다.
  doctrine_reference: 족보 서술의 역사성/계보 연속성
