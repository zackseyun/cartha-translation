base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of.' In this genealogical context the term denotes direct descendants/children in a male-line listing; here the list under Amram includes Miriam as well as Aaron and Moses.
    reason: lexical_alternative
translation:
  language: ko
  text: 암람의 아들들은 아론, 모세, 미리암이며, 아론의 아들들은 나답과 아비후, 엘르아살과 이다말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 '아들들'은 이 족보 문맥에서 직계 후손을 가리키는 표제 표현입니다. 여기서는 암람의 목록에 미리암도 함께 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 자녀들
  - ~의 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בֵּן의 복수는 직계 남계 후손을 가리키는 표제어이므로, 자연스러운 한국어로는 '~의 아들들'이 가장 직접적입니다.
- source_word: וּמִרְיָם
  english_pob_choice: and Miriam
  chosen_korean: 미리암
  alternatives_korean:
  - 그리고 미리암
  - 미리암과
  lexicon: 고유명사 관례
  rationale: 히브리어 열거 구조에서는 한국어에서 마지막 항목 앞에 '그리고'를 반드시 반복하지 않아도 되므로, 목록을 간결하게 살렸습니다.
- source_word: וּבְנֵי אַהֲרֹן
  english_pob_choice: and the sons of Aaron
  chosen_korean: 아론의 아들들은
  alternatives_korean:
  - 그리고 아론의 아들들은
  - 아론의 아들들
  lexicon: HALOT
  rationale: 두 번째 족보 소절의 시작을 한국어에서도 분명히 드러내기 위해 주제를 다시 제시했습니다.
- source_word: וַאֲבִיהוּא
  english_pob_choice: and Abihu
  chosen_korean: 아비후
  alternatives_korean:
  - 그리고 아비후
  - 아비후와
  lexicon: 고유명사 관례
  rationale: 인명 열거에서는 한국어에서 접속사를 반복하지 않고 나열하는 것이 자연스럽습니다.
theological_decisions:
- issue: 가계표의 '아들들'에 미리암이 포함되는 표현
  chosen_reading: 암람의 자손 목록 안에 미리암을 함께 제시했습니다.
  alternative_readings:
  - 문맥상 어색하므로 미리암을 따로 분리함
  - '''자녀들''로 완화해 성별 표지를 약화시킴'
  rationale: 본문 자체가 암람의 '아들들' 목록에 미리암을 포함시키므로, 성별에 대한 문맥적 긴장을 지우지 않고 그대로 드러내는 쪽이 원문에 충실합니다.
  doctrine_reference: 족보 본문 해석; 본문 주해상의 성별-문맥 긴장 보존
