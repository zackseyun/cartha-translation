  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
  footnotes:
  - marker: a
    text: The Hebrew form of the Assyrian king’s name here is 'Tilgath-pilneser'; many English versions use the more familiar historical form 'Tiglath-pileser.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들 비에라는 앗수르 왕 틸갓 필네셀[a]이 포로로 끌고 갔습니다. 그는 르우벤 사람들의 지도자였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 앗수르 왕의 이름을 ‘틸갓 필네셀’로 표기합니다. 많은 번역에서는 더 널리 알려진 역사적 형태인 ‘디글랏 빌레셀’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  english_pob_choice: Beerah
  chosen_korean: 비에라
  alternatives_korean:
  - 베에라
  - 비어라
  lexicon: 고유명사 음역
  rationale: 족보의 인명은 원문 자음을 따라 음역하는 것이 가장 직접적이며, 한국어 표기는 발음에 가깝게 비에라로 옮겼습니다.
- source_word: בְנוֹ
  english_pob_choice: his son
  chosen_korean: 아들
  alternatives_korean:
  - 그의 아들
  - 아들이
  lexicon: HALOT
  rationale: 문맥상 선행하는 인물을 가리키는 소유격 관계이므로 한국어에서는 자연스럽게 ‘비에라의 아들’로 풀어 표현했습니다.
- source_word: הֶגְלָה
  english_pob_choice: carried away into exile
  chosen_korean: 사로잡혀 포로가 되었습니다
  alternatives_korean:
  - 포로로 끌려갔습니다
  - 유배되었습니다
  lexicon: HALOT
  rationale: 히필형의 ‘가게 하다/내쫓다’는 강제 이주시킨 의미를 지니므로, 단순 이동이 아니라 포로화된 상태를 드러내는 표현을 택했습니다.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  english_pob_choice: Tilgath-pilneser
  chosen_korean: 틸갓 빌네셀
  alternatives_korean:
  - 틸갓 필네셀
  - 디글랏 빌레셀
  lexicon: 고유명사 음역
  rationale: 본문의 히브리어 철자에 직접 대응하는 음역을 따르되, 영어 POB가 지적한 것처럼 익숙한 역사적 표기보다 본문 형태를 우선했습니다.
- source_word: נָשִׂיא
  english_pob_choice: chief
  chosen_korean: 지도자
  alternatives_korean:
  - 족장
  - 우두머리
  - 통치자
  lexicon: HALOT
  rationale: 지파/족보 문맥에서 나שִיא는 왕이 아니라 인정받는 지도자를 뜻하므로, ‘지도자’로 옮겨 군주적 뉘앙스를 피했습니다.
theological_decisions:
- issue: הוּא의 강조와 서술 흐름
  chosen_reading: ‘그는’으로 되살려 앞 절의 인물과 이 절의 설명을 분명히 연결했습니다.
  alternative_readings:
  - 생략
  - ‘바로 그가’
  rationale: 독립 대명사의 강조 기능을 한국어에서도 살리되, 지나친 구어체 강조는 피하고 서술의 연결성을 유지했습니다.
  doctrine_reference: 본문 비평/서술 강조
- issue: לָרְאוּבֵנִי의 소속 관계
  chosen_reading: ‘르우벤 사람들의’로 집단 소속을 나타냈습니다.
  alternative_readings:
  - 르우벤 지파의
  - 르우벤 사람에게 속한
  rationale: לְ는 여기서 대상/관계의 표지로 기능하므로, 족보 문맥에 맞게 공동체적 소속을 분명히 했습니다.
  doctrine_reference: 지파 표지의 문맥적 의미
