  text: 그리고 벨라는 아자스의 아들, 세마의 아들, 요엘의 아들이었습니다. 그는 아로엘에 살았으며, 느보와 바알므온까지 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 יוֹשֵׁב는 ‘살다’보다 직역하면 ‘거주하다/살고 있다’의 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶלַע
  english_pob_choice: and Bela
  chosen_korean: 그리고 벨라는
