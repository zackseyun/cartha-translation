  alternative_readings:
  - 아로엘에만 거주했고, 느보와 바알므온은 그가 통치한 영역을 가리킨다
  - 지명들은 단순한 경유지 목록이다
  rationale: 본문의 עַד는 공간적 종점을 가리키므로, 거주지와 관할/영역의 범위를 함께 암시하는 표현으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 본문 해석상의 지리적·서술적 판단
