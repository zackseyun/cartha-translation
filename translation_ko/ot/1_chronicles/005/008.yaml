translation:
  language: ko
  text: 또 벨라는 아사스의 아들이며, 아사스는 세마의 아들이고, 세마는 요엘의 아들이었습니다. 그는 아로엘에서 느보와 바알므온에 이르기까지 거주했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살고 있었습니다’. 히브리어 분사는 한 지역에 거주하는 상태를 나타냅니다.
    reason: lexical_alternative
