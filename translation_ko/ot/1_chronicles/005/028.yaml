  rationale: 족보 문맥에서 בְנֵי는 ‘아들들’이 가장 직접적이며, 영어 POB의 연결어 ‘And’는 한국어에서는 자연스러운 문장 시작으로 풀었습니다.
- source_word: קְהָת
  english_pob_choice: Kohath
  chosen_korean: 고핫
  alternatives_korean:
  - 코핫
  - 게핫
  lexicon: 표준 한국어 성경 인명 용례
  rationale: 인명은 기존에 널리 쓰이는 성경형 ‘고핫’을 따르는 것이 가장 식별 가능합니다.
- source_word: יִצְהָר
  english_pob_choice: Izhar
  chosen_korean: 이스할
