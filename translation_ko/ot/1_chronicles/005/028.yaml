  lexicon: 표준 한국어 성경 인명 용례
  rationale: 이름 자체는 지명으로도 알려져 있지만, 여기서는 족보 속 인명이므로 문맥에 따라 동일한 음역 ‘헤브론’을 유지했습니다.
- source_word: וְ/עֻזִּיאֵל
  english_pob_choice: and Uzziel
  chosen_korean: 웃시엘
  alternatives_korean:
  - 우지엘
  - 웃지엘
  lexicon: 표준 외래어 표기법
  rationale: 마지막 항목의 접속은 한국어 열거에서 쉼표와 종결로 자연스럽게 처리했고, 인명은 음역형 ‘웃시엘’을 사용했습니다.
