  rationale: 히브리어 인명은 현대 한국어 음역으로 옮기되, 이 절의 다른 족보 항목들과 일관되게 표기했습니다.
- source_word: וְ/חֶבְרוֹן
  english_pob_choice: Hebron
  chosen_korean: 헤브론
  alternatives_korean:
  - 헤브로ן
