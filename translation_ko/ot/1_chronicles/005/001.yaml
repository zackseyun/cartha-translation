  - severity: medium
    issue: ‘이제’와 ‘이렇습니다’가 원문에 없는 연결·완결 표현을 추가합니다.
    rationale: 히브리어는 계보 표제를 제시하고 다음 절로 이어집니다. ‘이렇습니다’는 목록을 이 절에서 완결하는 인상을 주므로 삭제해야 합니다.
  - severity: medium
    issue: 각주 a의 앵커가 내용과 맞지 않습니다.
    rationale: 각주 a는 ‘아버지의 침상’의 복수형 및 관용법을 설명하지만 현재 르우벤의 아들들 뒤에 붙어 있습니다.
