reference: 1 Chronicles 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: Now the sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
  footnotes:
  - marker: a
    text: Or, 'his father’s couch.' The Hebrew is literally plural ('beds/couches'), an idiom for the marriage bed.
    reason: lexical_alternative
  - marker: b
    text: Or, 'but not to be reckoned in the genealogy according to the birthright.' The clause indicates that the birthright passed to Joseph’s sons without making them the genealogically listed firstborn.
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘의 맏아들 르우벤의 아들들은—그는 맏아들이었으나 아버지의 침상[a]을 더럽혔으므로, 그의 장자권이 이스라엘의 아들 요셉의 아들들에게 주어졌습니다. 그러나 그는 장자권에 따라 족보에 등록되지는 않았습니다[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지의 침상들’입니다. 히브리어는 문자적으로 복수형인데, 결혼 침상을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그러나 그는 장자권에 따라 족보에 등록되지는 않았습니다.’ 이 절은 요셉의 아들들이 장자권을 받았지만, 르우벤의 족보상 장자 지위가 그에 따라 등록된 것은 아니라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכוֹר יִשְׂרָאֵל
  english_pob_choice: the firstborn of Israel
  chosen_korean: 이스라엘의 맏아들
  alternatives_korean:
  - 이스라엘의 첫째 아들
  - 이스라엘의 장자
  lexicon: HALOT
  rationale: בְּכוֹר는 단순한 출생 순서만이 아니라 지위가 있는 ‘맏아들/장자’를 뜻하므로, 현대 한국어에서 자연스럽고 의미를 잘 드러내는 ‘맏아들’로 옮겼습니다.
- source_word: יְצוּעֵי אָבִיו
  english_pob_choice: his father’s bed
  chosen_korean: 아버지의 침상
  alternatives_korean:
  - 아버지의 침대
  - 아버지의 잠자리
  lexicon: HALOT
  rationale: 히브리어 복수형은 관용적으로 결혼 침상을 가리키므로, 직역의 생경함을 줄이면서도 성적·가정적 위반의 의미를 살리는 ‘침상’이 적절합니다.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  english_pob_choice: his birthright was given
  chosen_korean: 그의 장자권이 … 주어졌습니다
  alternatives_korean:
  - 그의 맏아들의 권리가 … 주어졌습니다
  - 그의 첫아들 권리가 … 주어졌습니다
  lexicon: HALOT
  rationale: בְּכֹרָה는 출생 서열보다 ‘장자권’의 법적 특권을 가리키므로, 교회적 관용과 원문의 법적 뉘앙스를 함께 살릴 수 있는 표현을 택했습니다.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  english_pob_choice: though not to be enrolled by birthright
  chosen_korean: 그러나 장자권으로 족보에 기록되지는 않았습니다
  alternatives_korean:
  - 그러나 장자권에 따라 족보에 올려지지는 않았습니다
  - 그러나 장자권으로 계보에 편입되지는 않았습니다
  lexicon: HALOT
  rationale: הִתְיַחֵשׂ는 족보적 등록/기록을 뜻하므로, ‘족보에 기록되다’로 옮겨 Joseph의 아들들이 장자권을 받았지만 족보상의 맏아들로 재분류되지는 않았다는 긴장을 보존했습니다.
theological_decisions:
- issue: 르우벤의 장자권 상실과 요셉의 아들들로의 이전
  chosen_reading: 르우벤은 실제 첫째 아들이지만 장자권은 요셉의 아들들에게 넘어갔고, 그럼에도 족보상의 장자 등록까지 바뀐 것은 아니라는 구분을 그대로 살렸습니다.
  alternative_readings:
  - 요셉의 집이 르우벤을 완전히 대체해 장자가 되었다고 정리하는 읽기
  rationale: 본문 마지막 절은 권리의 이전과 족보상의 기록을 구별합니다. 번역에서 이 차이를 평준화하지 않고 유지해야 원문의 의도와 긴장이 보존됩니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
