revisions:
- from: 이제 이스라엘의 맏아들 르우벤의 아들들은 이렇습니다[a]. 그는 맏아들이었으나, 아버지의 침상을 더럽혔으므로 그의 장자권이 이스라엘의 아들 요셉에게 주어졌습니다. 그러나 장자권으로 족보에 기록되지는 않았습니다[b].
  to: 이스라엘의 맏아들 르우벤의 아들들은—그는 맏아들이었으나 아버지의 침상[a]을 더럽혔으므로, 그의 장자권이 이스라엘의 아들 요셉의 아들들에게 주어졌습니다. 그러나 그는 장자권에 따라 족보에 등록되지는 않았습니다[b]—
  rationale: 요셉의 아들들이라는 복수 수혜자를 복원하고, 원문에 없는 ‘이제’와 ‘이렇습니다’를 제거했습니다. 계보 표제가 다음 절로 계속됨을 대시로 보존했습니다. 마지막 절에는 르우벤을 가리키는 ‘그는’을 보충하여 한국어에서 문법적 주체를 분명히 하되, 장자권의 이전과 족보상 등록의 구별이라는 원문의 긴장을 해소하지 않았습니다. 각주 a도 실제로 설명하는 ‘침상’에 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:08:27Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 르우벤의 장자권이 ‘이스라엘의 아들 요셉’ 개인에게 주어진 것으로 옮겨, 히브리어의 ‘요셉의 아들들에게’(לִבְנֵי יוֹסֵף)를 빠뜨렸습니다. 또한 첫머리의 ‘이제’와 ‘이렇습니다’는 본문에 없는 담화 표지와 완결 표현을 더합니다. 마지막 절은 르우벤이 장자권에 따라 족보에 등록되지 않았다는 제한을 유지하도록 주어를 밝혀 옮기는 것이 안전합니다.
  naturalness: ‘이스라엘의 맏아들 르우벤의 아들들은’은 다음 절로 이어지는 계보 표제이므로 ‘이렇습니다’를 보태지 않고 대시로 연결하는 편이 자연스럽고 본문 구조에도 맞습니다. ‘족보에 등록되다’는 현대 한국어에서 계보 용어로 자연스럽습니다.
  terminology: ‘맏아들’과 ‘장자권’은 각각 בְּכוֹר와 בְּכֹרָה의 구별을 잘 살립니다. ‘침상’은 יְצוּעֵי의 결혼 침상 관용 표현에 적절합니다. 각주 a는 침상 표현에 붙여야 하며, 르우벤에 붙어 있던 기존 위치는 각주 내용과 일치하지 않습니다.
  issues:
