source:
  edition: WLC
  text: וְ/יוֹחָנָ֖ן הוֹלִ֣יד אֶת עֲזַרְיָ֑ה ה֚וּא אֲשֶׁ֣ר כִּהֵ֔ן בַּ/בַּ֕יִת אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'in the temple'; Hebrew 'in the house,' a common way of referring to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요하난이 아사랴를 낳았습니다[a]. 그는 솔로몬이 예루살렘에 지은 집에서 제사장으로 섬기던 사람이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전에서’. 히브리어는 ‘집에서’라고 하며, 성전을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָ֖ן
  english_pob_choice: And Johanan
  chosen_korean: 그리고 요하난
  alternatives_korean:
  - 요하난
  lexicon: HALOT
  rationale: 문맥상 족보의 진행을 나타내는 ו를 한국어의 연결어 ‘그리고’로 살렸고, 인명은 현대 음역으로 옮겼습니다.
- source_word: הוֹלִ֣יד אֶת עֲזַרְיָ֑ה
  english_pob_choice: fathered Azariah
  chosen_korean: 아사랴를 낳았습니다
  alternatives_korean:
  - 아사랴의 아버지가 되었습니다
  - 아사랴를 생겼습니다
  lexicon: HALOT
  rationale: 족보 문맥의 히필 ילד는 ‘낳다/낳았습니다’가 가장 자연스럽고, 남성 계보 관계를 분명히 드러냅니다.
- source_word: כִּהֵ֔ן
  english_pob_choice: served as priest
  chosen_korean: 제사장으로 섬기던
  alternatives_korean:
  - 제사장으로 봉사하던
  - 제사장이던
  lexicon: HALOT
  rationale: כהן의 동사적 의미를 살려 단순한 신분 설명보다 ‘제사장 직분을 수행하다’는 뉘앙스를 드러냈습니다.
- source_word: בַּ/בַּ֕יִת ... שְׁלֹמֹ֖ה
  english_pob_choice: in the house that Solomon built
  chosen_korean: 솔로몬이 예루살렘에 지은 집에서
  alternatives_korean:
  - 솔로몬이 지은 성전에서
  - 솔로몬이 예루살렘에 지은 성전에서
  lexicon: HALOT
  rationale: 본문의 직역 표현인 ‘집’(בַּיִת)을 본문에 유지하고, 뒤 절이 그 집이 솔로몬의 건축물임을 해석적으로 밝혀 줍니다.
theological_decisions:
- issue: בַּיִת의 대상이 성전인지 여부
  chosen_reading: 본문에는 ‘집’으로 두고, 독자가 문맥으로 그 대상이 솔로몬의 성전임을 이해하도록 했습니다.
  alternative_readings:
  - 성전
  - 하나님의 성전
  rationale: 히브리어는 관용적으로 성전을 ‘집’이라 부르므로, 해석어를 본문에 선반영하지 않고 원문 표현의 긴장을 보존했습니다.
  doctrine_reference: 성전 용어의 문맥적 관용법
