id: 1CH.5.20
reference: 1 Chronicles 5:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
  footnotes:
  - marker: a
    text: Or 'the Hagarites.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'were given into their hand,' an idiom for being delivered over in defeat.
    reason: lexical_alternative
  - marker: c
    text: Or 'he was entreated by them,' that is, God responded favorably to their prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들에게 맞서 도움을 받았고, 하그리 사람들[a]과 그들과 함께 있던 모든 이가 그들의 손에 넘겨졌습니다[b]. 이는 그들이 전투 중에 하나님께 부르짖었기 때문이며, 하나님께서는 그들의 간구에 응답하셨습니다[c]. 이는 그들이 하나님을 신뢰했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하가리 사람들’로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘그들의 손에 주어졌다’로, 패배하여 그들에게 넘겨졌다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그분은 그들의 간구를 받아 주셨습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  english_pob_choice: They were helped against them
  chosen_korean: 그들은 그들 앞에서 도움을 받았습니다
  alternatives_korean:
  - 그들은 그들에게서 도움을 받았습니다
  - 그들은 그들에 맞서 도움을 받았습니다
  lexicon: HALOT
  rationale: 히필/니팔 계열의 수동적 의미를 살려, 전투 상황에서 외부의 도움을 받은 결과를 한국어로 자연스럽게 옮겼습니다.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  english_pob_choice: were given into their hand
  chosen_korean: 그들의 손에 넘겨졌습니다
  alternatives_korean:
  - 그들의 손에 주어졌습니다
  - 그들의 손에 넘겨졌습니다
  lexicon: HALOT
  rationale: ‘손에’는 승패와 지배를 나타내는 관용구이므로, 직역의 이미지를 살리되 현대 한국어로는 ‘넘겨지다’가 가장 자연스럽습니다.
- source_word: הַהַגְרִיאִים
  english_pob_choice: the Hagrites
  chosen_korean: 하그리 사람들
  alternatives_korean:
  - 하그라 사람들
  - 하가리 사람들
  lexicon: HALOT
  rationale: 집단명은 음역하되, 한국어 본문에서는 인명형보다 민족/집단을 드러내는 ‘사람들’이 문맥에 맞습니다.
- source_word: וְכֹל שֶׁעִמָּהֶם
  english_pob_choice: and all who were with them
  chosen_korean: 그들과 함께 있던 모든 사람
  alternatives_korean:
  - 그들과 함께한 모든 이
  - 그들과 함께 있던 모두
  lexicon: HALOT
  rationale: 동맹군이나 동반 세력을 가리키는 표현이므로, 군사적 문맥을 해치지 않도록 포괄적으로 옮겼습니다.
- source_word: וְנַעְתּוֹר לָהֶם
  english_pob_choice: and he answered them
  chosen_korean: 그분은 그들을 응답하셨습니다
  alternatives_korean:
  - 그분은 그들의 간청에 응답하셨습니다
  - 그분은 그들의 부르짖음에 응답하셨습니다
  lexicon: HALOT
  rationale: נעתר의 핵심은 ‘간구를 받아들여 응답하다’이므로, 단순히 듣는 것이 아니라 응답의 결과를 살렸습니다.
theological_decisions:
- issue: 하나님의 응답과 기도의 인과관계
  chosen_reading: ‘부르짖었습니다’와 ‘응답하셨습니다’를 연결해, 전투 속 기도와 하나님의 호의적 응답 사이의 인과를 분명히 드러냈습니다.
  alternative_readings:
  - ‘간청했습니다’로 완화하기
  - ‘들으셨습니다’로만 옮기기
  rationale: 본문은 단순 청취가 아니라 전투 중의 절박한 호소와 그에 대한 실제적 응답을 말하므로, 응답의 적극성을 유지하는 것이 문맥과 신학에 더 충실합니다.
  doctrine_reference: 1 Chronicles 5:20; Translation philosophy §§3, 6
