base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
  footnotes:
  - marker: a
    text: Or 'played the prostitute after' or 'went whoring after.' The Hebrew uses a sexual metaphor for idolatry and covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'prostituted themselves after'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 그들은 조상들의 하나님께 불충실하게 행하였고, 하나님께서 그들 앞에서 멸하신 그 땅의 민족들의 신들을 따라 음행하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음행하였습니다’는 우상숭배를 가리키는 성적 은유를 살린 번역입니다.
    reason: korean_style_note
  - marker: b
    text: ‘따라’는 히브리어 אַחֲרֵי의 추종/추적 뉘앙스를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  english_pob_choice: acted unfaithfully
  chosen_korean: 신실하지 못했고
  alternatives_korean:
  - 불충실했고
  - 배신했고
  - 언약을 어겼고
  lexicon: HALOT
  rationale: מעל의 핵심은 언약적·종교적 불성실이므로, 단순한 도덕적 '배신'보다 관계적 충실성의 붕괴를 드러내는 표현을 택했습니다.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  english_pob_choice: against the God of their fathers
  chosen_korean: 조상들의 하나님께
  alternatives_korean:
  - 조상들의 하나님을 상대로
  - 조상들의 하나님에 대하여
  lexicon: HALOT
  rationale: ב עם מעל이 가리키는 '대상/상대로'의 뉘앙스를 한국어에서는 자연스럽게 여격형으로 풀어, 관계적 위반을 분명히 했습니다.
- source_word: וַיִּזְנוּ אַחֲרֵי
  english_pob_choice: prostituted themselves after
  chosen_korean: 따라 음행하였습니다
  alternatives_korean:
  - 따라 창녀처럼 행동하였습니다
  - 따라 음행했습니다
  - 뒤따라 음행하였습니다
  lexicon: HALOT
  rationale: זנה의 성적 은유를 유지하되 현대 한국어에서 자연스럽고 과도하게 직설적이지 않은 '음행하다'로 옮기고, אַחֲרֵי의 추종 의미를 '따라'로 반영했습니다.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  english_pob_choice: the gods of the peoples of the land
  chosen_korean: 그 땅의 민족들의 신들
  alternatives_korean:
  - 그 땅의 백성들의 신들
  - 그 땅의 여러 민족의 신들
  lexicon: HALOT
  rationale: עַמֵּי는 '민족들'로 옮기는 것이 문맥상 자연스럽고, 복수형 '신들'을 유지해 우상 숭배의 대상을 분명히 했습니다.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  english_pob_choice: whom God had destroyed before them
  chosen_korean: 하나님께서 그들 앞에서 멸하신 것들입니다
  alternatives_korean:
  - 하나님께서 그들 앞에서 멸하신 자들입니다
  - 하나님께서 그들 앞에서 없애신 것들입니다
  lexicon: HALOT
  rationale: 히필 הִשְׁמִיד의 파괴적 의미를 '멸하다'로 살렸고, מִפְּנֵיהֶם은 관용적으로 '그들 앞에서'로 옮겼습니다. 문맥상 앞의 '민족들/신들'이 중첩되므로 한국어에서는 '것들'로 받았습니다.
theological_decisions:
- issue: זנה의 성적 은유를 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘음행하였습니다’로 옮겨 우상숭배의 언약 배반을 성적 은유로 드러냈습니다.
  alternative_readings:
  - ‘우상숭배하였습니다’처럼 완곡하게 풀기
  - ‘간음하였습니다’처럼 더 강하게 옮기기
  rationale: 본문은 단순한 종교적 오류가 아니라 언약적 불신실성을 성적 은유로 묘사합니다. 이를 약화하면 본문의 신학적 충격이 줄어듭니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: אֱלֹהִים의 단수 의미 반영
  chosen_reading: ‘하나님께서’로 옮겨 동사 단수와 호응하게 했습니다.
  alternative_readings:
  - ‘신들께서’로 옮기기
  rationale: 형태는 복수형일 수 있으나 문맥과 단수 동사가 참조하는 분명한 주어는 이스라엘의 하나님입니다. 한국어도 이를 분명히 해야 합니다.
  doctrine_reference: 문맥-문법 일치 원칙
