id: 1CH.5.7
reference: 1 Chronicles 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶחָי/ו֙ לְ/מִשְׁפְּחֹתָ֔י/ו בְּ/הִתְיַחֵ֖שׂ לְ/תֹלְדוֹתָ֑/ם הָ/רֹ֥אשׁ יְעִיאֵ֖ל וּ/זְכַרְיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
  footnotes:
  - marker: a
    text: Or 'when they were registered in the genealogy according to their generations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 형제들은 그들의 씨족에 따라 그들의 세대별 계보에 등록되었을 때[a], 우두머리는 여이엘과 스가랴였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 세대에 따른 족보에서’.
    reason: בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם은 ‘그들의 세대별 계보에 등록되었을 때’로 이해할 수도 있고, 시간절 없이 ‘그들의 세대에 따른 족보에서’라는 등록·계보의 맥락으로 이해할 수도 있습니다.
lexical_decisions:
- source_word: וְאֶחָיו
  english_pob_choice: And his brothers
  chosen_korean: 그리고 그의 형제들은
  alternatives_korean:
  - 그리고 그의 친족들은
  - 그리고 그의 일족은
  lexicon: HALOT
  rationale: 족보 문맥에서 אָח는 넓은 친족보다 직계/동족 집단을 가리킬 수 있으므로, 가장 직접적인 ‘형제들’을 유지했습니다.
- source_word: לְמִשְׁפְּחֹתָיו
  english_pob_choice: by their clans
  chosen_korean: 그들의 씨족에 따라
  alternatives_korean:
  - 그들의 가족에 따라
  - 그들의 종족에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 족보 목록에서 ‘가족’보다 ‘씨족’이 더 정확하게 집단 단위를 드러냅니다.
- source_word: בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם
  english_pob_choice: in the genealogy of their generations
  chosen_korean: 그들의 نسل대의 족보에 등록될 때
  alternatives_korean:
  - 그들의 세대의 족보 안에서
  - 그들의 نسل대의 계보에 따라
  lexicon: HALOT
  rationale: 히트파엘 יחס는 족보적으로 ‘등록되다/계보에 올리다’의 뜻이므로, 시간적 용법을 살려 ‘등록될 때’로 옮겼습니다. ‘תּוֹלְדוֹת’은 단순한 출생이 아니라 세대별 계보 기록을 뜻합니다.
- source_word: הָרֹאשׁ
  english_pob_choice: the chief was
  chosen_korean: 우두머리는
  alternatives_korean:
  - 수장은
  - 머리는
  lexicon: HALOT
  rationale: רֹאשׁ은 여기서 집단의 선도자, 우두머리를 가리키므로 현대 한국어에서는 ‘우두머리’가 가장 분명합니다.
- source_word: יְעִיאֵל
  english_pob_choice: Jeiel
  chosen_korean: 여이엘
  alternatives_korean:
  - 예이엘
  - 제이엘
  lexicon: Standard transliteration
  rationale: 인명은 표준 음역으로 처리했습니다. 본문 전통형보다 음가를 살린 음역을 택했습니다.
- source_word: וּזְכַרְיָהוּ
  english_pob_choice: and Zechariah
  chosen_korean: 스가랴
  alternatives_korean:
  - 스가랴후
  - 즈카르야
  lexicon: Standard biblical form
  rationale: 성경에서 널리 굳어진 인명 형태를 사용했습니다.
theological_decisions:
- issue: 족보 문체의 시간절 해석
  chosen_reading: ‘그들의 족보에 등록될 때’로 읽어, 단순한 배열이 아니라 공식적 계보 등록 행위를 드러냈습니다.
  alternative_readings:
  - ‘그들의 세대의 족보 안에서’
  - ‘그들의 세대에 따라’
  rationale: 히브리어 히트파엘 יחס의 족보적 용법과 바로 이어지는 תּוֹלְדוֹת를 함께 반영하면, 행위의 성격이 ‘등록/기록’임을 보여 주는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문의 역사·족보적 진술
