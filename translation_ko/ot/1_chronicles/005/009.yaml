source:
  edition: WLC
  text: וְ/לַ/מִּזְרָ֗ח יָשַׁב֙ עַד לְ/ב֣וֹא מִדְבָּ֔רָ/ה לְ/מִן הַ/נָּהָ֖ר פְּרָ֑ת כִּ֧י מִקְנֵי/הֶ֛ם רָב֖וּ בְּ/אֶ֥רֶץ גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
  footnotes:
  - marker: a
    text: Or 'as far as the wilderness from the river Euphrates.' The Hebrew boundary description is compressed and may be understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 동쪽으로, 광야의 입구, 곧 유프라테스 강에서부터 그곳에 이르기까지 자리 잡았습니다[a]. 이는 그들의 가축이 길르앗 땅에서 많아졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '유프라테스 강에서부터 광야까지의 입구에 이르기까지'. 히브리어의 경계 표현은 압축되어 있어 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  english_pob_choice: To the east
  chosen_korean: 동쪽으로
  alternatives_korean:
  - 동쪽에
  - 동쪽을 향해
  lexicon: HALOT
  rationale: 방향 부사는 한국어에서 목적격보다 부사형으로 자연스럽게 처리하는 것이 가장 직접적이며, 본문의 공간 방향을 유지합니다.
- source_word: יָשַׁב
  english_pob_choice: he settled
  chosen_korean: 자리 잡았습니다
  alternatives_korean:
  - 거주했습니다
  - 정착했습니다
  lexicon: HALOT
  rationale: 영역을 차지하며 거주하는 뉘앙스를 살리기 위해 단순한 '살았다'보다 정착의 의미가 드러나는 표현을 택했습니다.
- source_word: עַד לְבוֹא מִדְבָּרָה לְמִן הַנָּהָר פְּרָת
  english_pob_choice: as far as the entrance to the wilderness from the river Euphrates
  chosen_korean: 광야의 입구, 곧 유프라테스 강에서부터 그곳에 이르기까지
  alternatives_korean:
  - 광야로 들어가는 입구, 곧 유프라테스 강에서부터
  - 유프라테스 강 쪽 광야의 입구까지
  lexicon: HALOT
  rationale: 히브리어의 압축된 경계 묘사를 한국어에서는 동격 표지 '곧'으로 풀어 주어, '광야의 입구'와 '유프라테스 강에서부터'가 한 경계 설명임을 드러냈습니다.
- source_word: מִקְנֵיהֶם
  english_pob_choice: their livestock
  chosen_korean: 그들의 가축
  alternatives_korean:
  - 그들의 목축
  - 그들의 가축 떼
  lexicon: HALOT
  rationale: 가축 전반을 가리키는 집합명사로 옮겼고, 소유격을 분명히 해 번역의 이유절과 자연스럽게 연결했습니다.
theological_decisions:
- issue: 지리 경계 표현의 모호성
  chosen_reading: 본문의 경계 설명을 하나의 연속된 구로 유지하되, 한국어에서도 두 지점 사이의 범위를 암시하는 구조로 옮겼습니다.
  alternative_readings:
  - '''광야의 입구에서 유프라테스 강까지'''
  - '''유프라테스 강에서 광야의 입구까지'''
  rationale: 히브리어가 압축된 경계 표현을 사용하므로, 어느 한쪽으로 과도하게 정리하지 않고 의미 범위를 보존하는 것이 본문 충실도에 더 적합합니다.
  doctrine_reference: 본문의 지리 서술에 관한 번역 원칙
- issue: 대명사 'he'의 집단 대표성
  chosen_reading: 단수 '그는'을 유지해 족장/지파 대표를 가리키는 히브리어 서술 방식을 살렸습니다.
  alternative_readings:
  - '''그들은'''
  - '''그 지파는'''
  rationale: 원문은 단수 동사로 집단을 대표하는 인물을 가리키므로, 문맥상 집단 전체를 암시하되 서술 형식을 보존하는 편이 더 가깝습니다.
  doctrine_reference: 서술 주어의 대표성에 관한 본문 문법
