id: 1CH.5.18
reference: 1 Chronicles 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
  footnotes:
  - marker: a
    text: Or 'mighty men' or 'men of valor' for 'valiant men.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'who bent/trod the bow,' a Hebrew idiom for drawing a bow to shoot.
    reason: cultural_note
  - marker: c
    text: Or 'fit for military service' for 'able to go out to war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 르우벤의 아들들과 갓 사람들과 므낫세 반 지파의 사람들은 용사들이었으며, 방패와 칼을 들고 활을 당기며 전쟁에 익숙한 사람들이었는데, 모두 사만사천칠백육십 명으로 전쟁에 나갈 수 있는 사람들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  english_pob_choice: The sons of Reuben
  chosen_korean: 르우벤의 아들들
  alternatives_korean:
  - 르우벤 사람들
  - 르우벤 자손들
  lexicon: HALOT
  rationale: 히브리어의 בְּנֵי를 살려 직역적 친연 관계를 유지하되, 현대 한국어에서는 ‘아들들’보다 ‘자손들’이 더 자연스러울 수 있어도 원문 투명성을 위해 ‘아들들’로 옮겼습니다.
- source_word: וְגָדִי
  english_pob_choice: and the Gadites
  chosen_korean: 갓 사람들
  alternatives_korean:
  - 갓 사람들
  - 갓 지파 사람들
  lexicon: HALOT
  rationale: 지파 구성원을 가리키는 민족명 형식이므로 개인 ‘갓’이 아니라 집단을 드러내는 ‘갓 사람들’로 옮겼습니다.
- source_word: מִן בְּנֵי חַיִל
  english_pob_choice: valiant men
  chosen_korean: 용사들이었으며
  alternatives_korean:
  - 용맹한 사람들이었으며
  - 무용한 사람들이었으며
  - 힘있는 사람들이었습니다
  lexicon: HALOT
  rationale: בְּנֵי חַיִל은 단순한 신체적 강함보다 전투에 적합한 용맹함을 뜻하므로, 전통적 교회어를 피하면서도 의미를 압축하는 ‘용사들’이 적절합니다.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  english_pob_choice: who carried shield and sword
  chosen_korean: 방패와 칼을 들고
  alternatives_korean:
  - 방패와 칼을 메고
  - 방패와 칼을 지니고
  - 방패와 칼을 들며
  lexicon: HALOT
  rationale: ‘들다’가 무기 휴대의 구체적 이미지를 살리며, 히브리어 분사구의 동작성을 한국어 동사구로 자연스럽게 대응시켰습니다.
- source_word: וְדֹרְכֵי קֶשֶׁת
  english_pob_choice: who drew the bow
  chosen_korean: 활을 당기며
  alternatives_korean:
  - 활을 굽히며
  - 활을 당겨 쏘며
  - 궁수들이며
  lexicon: HALOT
  rationale: 히브리어 관용구를 ‘궁수들’로만 바꾸면 동작성이 사라지므로, POB의 주석 취지에 맞게 활을 당기는 행위를 보존했습니다.
- source_word: וּלְמוּדֵי מִלְחָמָה
  english_pob_choice: who were trained for war
  chosen_korean: 전쟁에 익숙한 사람들이었는데
  alternatives_korean:
  - 전쟁에 훈련된 사람들이었는데
  - 전투에 숙련된 사람들이었는데
  - 전쟁을 배운 사람들이었는데
  lexicon: HALOT
  rationale: ‘לְמוּדֵי’의 수동/결과 상태를 현대 한국어의 ‘익숙한’으로 자연스럽게 풀어, 훈련의 결과로 전쟁 수행에 능숙함을 드러냈습니다.
- source_word: יֹצְאֵי צָבָא
  english_pob_choice: able to go out to war
  chosen_korean: 전쟁에 나갈 수 있는 사람들이었습니다
  alternatives_korean:
  - 군대에 나갈 수 있는 사람들이었습니다
  - 전쟁터로 나갈 수 있는 사람들이었습니다
  - 군역에 적합한 사람들이었습니다
  lexicon: HALOT
  rationale: 히브리어 군사 관용구를 직역에 가깝게 유지하면서도, 현대 독자가 이해할 수 있도록 ‘전쟁에 나갈 수 있는’으로 옮겼습니다.
theological_decisions:
- issue: 지파 명칭과 군사적 묘사의 직설성 유지
  chosen_reading: 이스라엘의 특정 지파 연합이 실제 전투 인력을 구성했다는 역사적·서술적 의미를 그대로 드러냈습니다.
  alternative_readings:
  - 지파 연합을 더 완곡하게 풀어 쓰는 방식
  - 군사력을 일반화하여 비유적으로 읽는 방식
  rationale: 본문은 계보적 집단과 병력 수를 기록하는 역사 서술이므로, 의미를 완화하지 않고 구체적 군사 현실을 유지하는 것이 원문 의도에 충실합니다.
  doctrine_reference: 본문의 역사서적 증언성과 문자적 서술 존중
- issue: ‘용사들’의 가치 판단
  chosen_reading: בְּנֵי חַיִל을 단순한 ‘강한 사람들’보다 전투적 능력을 내포한 ‘용사들’로 옮겼습니다.
  alternative_readings:
  - 힘센 사람들
  - 유력한 사람들
  - 무사들
  rationale: 문맥이 방패, 칼, 활, 전쟁 훈련을 연속적으로 열거하므로, 전투적 역량을 드러내는 번역이 가장 정확합니다.
  doctrine_reference: 어휘의 문맥적 결정성
