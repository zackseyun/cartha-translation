  source_fidelity: 히브리어 본문은 ‘그들의 형제들/친족들’을 ‘그들의 조상들의 집(가문)’에 따른 명단으로 제시하고, 일곱 이름을 열거한 뒤 ‘일곱’으로 합산합니다. 초안의 기본 의미와 인원수는 맞지만, זִיעַ는 마소라 본문 음가에 따라 한국어로 ‘시아’로 옮기는 것이 적절합니다.
  naturalness: ‘그들의 아버지들의 집안에 따라’는 히브리어 표현을 지나치게 직역하여 현대 한국어에서 부자연스럽습니다. ‘조상들의 가문에 따라’가 족보상의 부계 가문 단위를 자연스럽고 정확하게 전달합니다.
  terminology: ‘형제들’은 원문의 표현을 보존하며 주석으로 친족적 의미 범위를 밝혀 둘 수 있습니다. 인명은 한국어 성경 음역 관례와 히브리어 본문에 맞추어 ‘요래’, ‘시아’로 바로잡습니다. 에벨(עֵבֶר)은 헤벨(חֶבֶר)과 다른 히브리어 이름이므로 ‘Heber’ 관련 주석은 삭제해야 합니다.
