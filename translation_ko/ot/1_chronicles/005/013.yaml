  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֞ם לְ/בֵ֣ית אֲבוֹתֵי/הֶ֗ם מִֽיכָאֵ֡ל וּ/מְשֻׁלָּ֡ם וְ֠/שֶׁבַע וְ/יוֹרַ֧י וְ/יַעְכָּ֛ן וְ/זִ֥יעַ וָ/עֵ֖בֶר שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
  footnotes:
  - marker: a
    text: Or 'kinsmen'; the Hebrew 'brothers' can denote wider clan-relatives in genealogical contexts.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by/according to their fathers’ houses,' a clan or paternal-household designation.
    reason: cultural_note
  - marker: c
    text: Some render the name 'Ziza' due to textual or transliteration variation.
    reason: alternative_reading
  - marker: d
    text: '''Eber'' may also be rendered ''Heber'' in English tradition.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 형제들은 조상들의 가문에 따라 미가엘, 므술람, 세바, 요래, 야간, 시아, 에벨로 모두 일곱 명이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘형제들’은 족보 문맥에서 더 넓은 친족이나 씨족 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들의 가문’은 부계 씨족 또는 가문 단위를 가리키는 족보상의 공식 표현입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 마소라 본문은 이 이름을 ‘시아’로 지지합니다. 일부 번역 전통에는 ‘지자’라는 형태가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 일가들
  lexicon: HALOT
  rationale: 족보 문맥에서는 직역된 ‘형제들’이 기본형을 살리며, 문맥상 더 넓은 친족 집단을 포함할 수 있습니다.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  english_pob_choice: according to their fathers’ houses
  chosen_korean: 그들의 아버지들의 집안에 따라
  alternatives_korean:
  - 그들의 조상 집안에 따라
  - 그들의 가문별로
  lexicon: HALOT
  rationale: 히브리어 족보 공식 표현을 한국어로 비교적 직접 옮겨, 씨족/가문 단위를 드러냈습니다.
- source_word: וְזִיעַ
  english_pob_choice: Zia
  chosen_korean: 지아
  alternatives_korean:
  - 지자
  - 시아
  lexicon: transliteration
  rationale: 이 이름은 본문 형태에 따라 ‘Zia’에 대응하는 음역으로 옮겼습니다. 영어 전통의 ‘Ziza’와는 별개로, 본문 음가를 따라 표기했습니다.
- source_word: וָעֵבֶר
  english_pob_choice: and Eber
  chosen_korean: 에벨
  alternatives_korean:
  - 헤벨
  lexicon: transliteration
  rationale: 족보 이름은 한국어에서 통용되는 음역을 우선하되, 영어 전통의 변이 가능성은 본문 주석으로 남길 수 있습니다.
theological_decisions:
- issue: 족보 명단의 숫자 요약과 마지막 이름의 관계
  chosen_reading: ‘모두 일곱’은 열거된 인물 수를 요약하는 설명으로 처리했습니다.
  alternative_readings:
  - ‘에벨—일곱’처럼 이름에 직접 연결
  - ‘일곱 명’으로 풀어 설명
  rationale: 히브리어의 שִׁבְעָה는 명단 전체를 묶는 요약 숫자로 읽는 것이 자연스럽습니다.
  doctrine_reference: 문맥상 서술형 족보
- issue: וַאֲחֵיהֶם의 의미 범위
  chosen_reading: 기본적으로 ‘형제들’로 두고, 족보적 문맥에서 친족 확장 가능성을 주석으로 처리했습니다.
  alternative_readings:
  - 친족들
  - 일가
  rationale: 원문 어휘를 유지하면서도 족보 문맥이 허용하는 넓은 의미를 과도하게 평탄화하지 않기 위해서입니다.
  doctrine_reference: 족보/가문 용어
