source:
  edition: WLC
  text: וּ/בִ/ימֵ֣י שָׁא֗וּל עָשׂ֤וּ מִלְחָמָה֙ עִם הַֽ/הַגְרִאִ֔ים וַֽ/יִּפְּל֖וּ בְּ/יָדָ֑/ם וַ/יֵּשְׁבוּ֙ בְּ/אָ֣הֳלֵי/הֶ֔ם עַֽל כָּל פְּנֵ֖י מִזְרָ֥ח לַ/גִּלְעָֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
  footnotes:
  - marker: a
    text: Or “the Hagarites.” The Hebrew ethnonym likely refers to a people associated with Hagar.
    reason: lexical_alternative
  - marker: b
    text: Literally “they fell into their hand,” that is, into their power; the ones who fell are the Hagrites implied from context.
    reason: lexical_alternative
translation:
  language: ko
  text: 사울 시대에 그들은 하그리 사람들[a]과 전쟁을 벌였는데, 그들의 손에[b] 넘어졌습니다. 그리고 그들은 길르앗의 동쪽 전역에 있는 그들의 천막에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하그리’는 하갈과 연관된 민족명으로 보입니다. 영어 POB의 대안표기 ‘Hagarites’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그들의 손에 넘어졌다”입니다. 여기서 ‘그들의 손’은 곧 그들의 권세나 지배를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  english_pob_choice: In the days of Saul
  chosen_korean: 사울 시대에
  alternatives_korean:
  - 사울의 날들에
  - 사울 때에
  lexicon: HALOT
  rationale: 히브리어 관용구는 특정 왕의 통치 시기를 가리키므로, 자연스러운 한국어로는 ‘사울 시대에’가 가장 간결하고 문맥에 맞습니다.
- source_word: עָשׂוּ מִלְחָמָה עִם
  english_pob_choice: made war with
  chosen_korean: 전쟁을 벌였는데
  alternatives_korean:
  - 전쟁을 했는데
  - 전쟁을 일으켰는데
  lexicon: HALOT
  rationale: ‘עשה מלחמה’는 전쟁 수행의 관용표현이므로, 직역의 어색함을 피하면서도 적극적 충돌의 뜻을 살려 ‘전쟁을 벌이다’로 옮겼습니다.
- source_word: הַהַגְרִאִים
  english_pob_choice: the Hagrites
  chosen_korean: 하그리 사람들
  alternatives_korean:
  - 하가르 사람들
  - 하그릿 사람들
  lexicon: HALOT
  rationale: 영문 POB가 가리키는 민족명은 하갈과 관련된 집단을 뜻하므로, 한국어 본문에서는 읽기 자연성을 위해 ‘사람들’을 덧붙였고, 음역은 원형을 비교적 간결하게 반영했습니다.
- source_word: וַיִּפְּלוּ בְּיָדָם
  english_pob_choice: they fell into their hand
  chosen_korean: 그들의 손에 넘어졌습니다
  alternatives_korean:
  - 그들의 손에 떨어졌습니다
  - 그들의 권세 아래 들어갔습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘그들의 권세/지배 아래로 들어가다’의 뜻이므로, 본문 이미지와 결과를 함께 살리는 한국어 관용 표현으로 옮겼습니다.
- source_word: וַיֵּשְׁבוּ בְּאָהֳלֵיהֶם
  english_pob_choice: they lived in their tents
  chosen_korean: 그들의 천막에 살았습니다
  alternatives_korean:
  - 그들의 장막에 거주했습니다
  - 그들의 천막들 안에 살았습니다
  lexicon: HALOT
  rationale: ‘אָהֶל’은 문자적으로 천막/장막을 뜻하므로, 본문 이미지를 보존하는 ‘천막’이 적절합니다. ‘살았습니다’는 현대 한국어에서 자연스러운 거주 표현입니다.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  english_pob_choice: throughout all the region east of Gilead
  chosen_korean: 길르앗의 동쪽 전역
  alternatives_korean:
  - 길르앗 동쪽의 온 지역
  - 길르앗 동편 전체
  lexicon: HALOT
  rationale: 공간을 가리키는 관용구를 한국어로 풀어, ‘동쪽 전역’이라 하여 범위의 넓이를 자연스럽게 전달했습니다.
