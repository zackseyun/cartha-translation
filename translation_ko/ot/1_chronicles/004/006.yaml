  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
  footnotes:
  - marker: a
    text: Temeni may also be understood as a name with adjectival force, such as 'Temenite' or 'southerner,' but in this genealogy it is rendered as a personal name.
    reason: lexical_alternative
  - marker: b
    text: Haahashtari may also be transliterated 'Ahashtari.' The Hebrew form includes the prefixed article, which may have become fixed as part of the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 나아라는 그에게 아후잠과 헤벨과 테므니[a]와 하아하스다리[b]를 낳았습니다. 이들이 나아라의 아들들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘테므니’는 개인 이름으로 옮겼습니다. 그러나 형용사적으로는 ‘테므니 사람’ 또는 ‘남쪽 사람’으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하아하스다리’는 히브리어의 관사가 붙은 형태를 반영한 음역입니다. 이 관사가 이름의 일부로 굳어진 것일 수도 있습니다.
    reason: lexical_alternative
