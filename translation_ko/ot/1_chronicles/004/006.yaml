  text: וַ/תֵּ֨לֶד ל֤/וֹ נַעֲרָה֙ אֶת אֲחֻזָּ֣ם וְ/אֶת חֵ֔פֶר וְ/אֶת תֵּימְנִ֖י וְ/אֶת הָ/אֲחַשְׁתָּרִ֑י אֵ֖לֶּה בְּנֵ֥י נַעֲרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
  footnotes:
  - marker: a
    text: Temeni may also be understood as a name with adjectival force, such as 'Temenite' or 'southerner,' but in this genealogy it is rendered as a personal name.
    reason: lexical_alternative
  - marker: b
    text: Haahashtari may also be transliterated 'Ahashtari.' The Hebrew form includes the prefixed article, which may have become fixed as part of the name.
    reason: lexical_alternative
translation:
  language: ko
  text: 나아라는 아후잠과 헤벨과 테므니와 아하스다리를 낳았습니다[a][b]. 이들이 바로 나아라의 아들들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 테므니는 이 족보에서는 개인 이름으로 옮겼지만, 형용사적으로는 ‘테므니 사람’ 또는 ‘남쪽 사람’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아하스다리’는 히브리어의 관사가 붙은 형태를 반영한 음역입니다. 영어 POB의 ‘Haahashtari’처럼 관사가 이름에 굳어졌을 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 낳아 주었습니다
  lexicon: HALOT
  rationale: 족보 문맥의 ילד는 출생을 알리는 정형 표현이므로, 현대 한국어에서 자연스럽고 간결한 ‘낳았습니다’로 옮겼습니다.
- source_word: לוֹ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를 위해
  - 그와의 사이에
  lexicon: HALOT
  rationale: ל + 3인칭 접미사는 족보에서 아버지 측 귀속을 표시하므로, 과도한 해석 없이 관계를 드러내는 ‘그에게’를 택했습니다.
- source_word: תֵּימְנִי
  english_pob_choice: Temeni
  chosen_korean: 테므니
  alternatives_korean:
  - 테므니 사람
  - 테멘 사람
  lexicon: HALOT
  rationale: 영어 POB처럼 이 형태는 이 계보에서 고유명사로 처리하는 것이 적절하므로 음역했습니다. 필요 이상으로 ‘남쪽 사람’ 같은 형용사적 의미를 덧씌우지 않았습니다.
- source_word: הָאֲחַשְׁתָּרִי
  english_pob_choice: Haahashtari
  chosen_korean: 아하스다리
  alternatives_korean:
  - 하아하스다리
  - 아하스다리
  lexicon: HALOT
  rationale: 히브리어의 관사 הָ를 이름의 일부로 반영할지 여부가 문제지만, 한국어에서는 자연스러운 음역을 위해 이름 형태를 유지하되 관사 자체는 별도로 표시하지 않았습니다.
