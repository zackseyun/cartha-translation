translation:
  language: ko
  text: 이들은 토기장이들이며 넷앗임과 게데라의 주민들이었습니다. 그들은 왕의 일을 위해 왕과 함께 그곳에 살았습니다.<a>[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이들은 토기장이들이며, 심은 곳들과 울타리 또는 둘러싼 곳에 사는 사람들이었습니다.” 히브리어 넷앗임과 게데라는 지명으로도, 보통명사로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצְרִים
  english_pob_choice: the potters
  chosen_korean: 토기장이들
  alternatives_korean:
  - 도공들
  - 그릇 만드는 사람들
  lexicon: HALOT
  rationale: יֹצֵר는 여기서 흙을 빚는 직업인으로 이해하는 것이 가장 자연스러워서, 한국어도 관용적이면서 구체적인 ‘토기장이들’로 옮겼습니다.
- source_word: נְטָעִים
  english_pob_choice: Netaim
  chosen_korean: 넷앗임
  alternatives_korean:
  - 넷아이임
  - 심은 것들
  lexicon: HALOT
  rationale: 문맥상 지명으로 보는 해석을 따라 음역으로 처리했습니다. 일반명사 ‘심은 것들’의 가능성은 각주로 남깁니다.
- source_word: וּגְדֵרָה
  english_pob_choice: and Gederah
  chosen_korean: 게데라
  alternatives_korean:
  - 울타리
  - 담
  lexicon: HALOT
  rationale: 이 절의 목록형 지명 병렬을 따라 지명으로 옮겼습니다. 일반명사 뜻은 대안으로 각주에 반영했습니다.
- source_word: בִּמְלַאכְתּוֹ
  english_pob_choice: for his work
  chosen_korean: 그의 일로
  alternatives_korean:
  - 그의 일에
  - 그의 섬김으로
  - 그의 사역에
  lexicon: HALOT
  rationale: מְלָאכָה는 단순 노동보다 ‘일/업무/업무 수행’의 폭이 있어, 왕에게 속한 업무를 드러내는 ‘그의 일로’가 가장 무난합니다.
theological_decisions:
- issue: עִם הַמֶּלֶךְ의 관계 뉘앙스
  chosen_reading: ‘왕과 함께’로 직역하되, 그 뒤의 ‘그의 일로’로 왕실과의 소속·협력 관계를 드러냈습니다.
  alternative_readings:
  - ‘왕의 시중을 들며’
  - ‘왕을 섬기며’
  rationale: 히브리어 עִם은 기본적으로 ‘함께’이므로 이를 보존하되, 문맥상 단순 동행보다 왕과 연관된 업무 수행을 암시하므로 뒤 구절로 그 의미를 풀어냈습니다.
  doctrine_reference: 본문 의미 보존과 문맥적 함의의 균형
