  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
  footnotes:
  - marker: a
    text: Or possibly, 'These were the potters, and those who lived among plantings and walls/enclosures.' The Hebrew terms Netaim and Gederah may be read either as place names or as common nouns.
