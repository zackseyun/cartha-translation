base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
  footnotes:
  - marker: a
    text: Or “families of the Zorathites.” The Hebrew term can denote extended kinship groups; “clans” is used here for clarity in a tribal genealogy.
    reason: lexical_alternative
translation:
  language: ko
  text: 르아야는 소발의 아들로서 야핫을 낳았고, 야핫은 아후매와 라핫을 낳았습니다. 이들은 소라 사람들의 씨족입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאָיָה
  english_pob_choice: Reaiah
  chosen_korean: 르아야
  alternatives_korean:
  - 레아야
  lexicon: 고유명사
  rationale: 히브리어 고유명사는 음역하되, 한국어 표기는 기존 외래어 관행에 맞춰 적었습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: ~의 아들로서
  alternatives_korean:
  - ~의 아들
  - ~의 아들입니다
  lexicon: HALOT
  rationale: 족보 문맥에서 בן은 직접적 혈연 표지를 나타내므로, 현대 한국어에서는 ‘~의 아들로서’가 가장 자연스럽게 계보 관계를 드러냅니다.
- source_word: הוֹלִיד / הֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 히필형 ילד는 족보에서 ‘낳다/낳게 하다’의 관계를 나타내므로, 한국어에서는 간결하고 표준적인 ‘낳았습니다’로 옮겼습니다.
- source_word: מִשְׁפְּחֹות הַצָּרְעָתִי
  english_pob_choice: clans of the Zorathites
  chosen_korean: 소라 사람들의 씨족
  alternatives_korean:
  - 소라 사람들의 가족들
  - 소라 사람들의 종족
  lexicon: HALOT
  rationale: 영어 POB의 ‘clans’를 따라, 히브리어 미쉬파호트의 확대 친족 집단 의미를 반영해 ‘씨족’으로 옮겼습니다.
