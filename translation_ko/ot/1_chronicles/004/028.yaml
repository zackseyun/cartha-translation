  rationale: 지명은 음역을 유지하되, 한국어 문맥에서는 거주 장소를 동사 '살았습니다'가 이미 드러내므로 전치사성 조사 없이 자연스럽게 처리했습니다.
- source_word: וּמוֹלָדָה
