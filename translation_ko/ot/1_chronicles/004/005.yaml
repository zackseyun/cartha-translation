language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
  footnotes:
  - marker: a
    text: Or 'founder of Tekoa' / 'ancestor of Tekoa'; in genealogies, 'father of' can denote a clan founder or settlement founder, not only an immediate biological father.
    reason: lexical_alternative
translation:
  language: ko
  text: 아슈훌은 데고아의 아버지였는데, 아내가 둘이었으니 헬라와 나아라였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘데고아의 시조’, ‘데고아의 설립자’로도 옮길 수 있습니다. 계보에서는 ‘~의 아버지’가 생물학적 아버지뿐 아니라 씨족이나 정착지의 창시자를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  english_pob_choice: Ashhur
  chosen_korean: 아슈훌
  alternatives_korean:
  - 그리고 아슈훌
  - 이제 아슈훌
  lexicon: HALOT
  rationale: 계보문의 도입부로서 연결어의 힘은 크지 않으므로, 본문 중심 인물인 고유명사만 자연스럽게 옮겼습니다.
- source_word: אֲבִי תְקוֹעַ
  english_pob_choice: the father of Tekoa
  chosen_korean: 데고아의 아버지
  alternatives_korean:
  - 데고아의 조상
  - 데고아의 설립자
  lexicon: HALOT
  rationale: אָב은 계보 문맥에서 문자적 아버지일 수도, 씨족·정착지의 시조일 수도 있어, 직역에 가깝게 ‘아버지’로 두었습니다.
- source_word: שְׁתֵּי נָשִׁים
  english_pob_choice: two wives
  chosen_korean: 아내가 둘이었는데
  alternatives_korean:
  - 두 아내를 두었는데
  - 두 여인이 있었는데
  lexicon: HALOT
  rationale: 문맥상 נָשִׁים는 단순한 ‘여인들’이 아니라 결혼관계의 ‘아내들’이므로, 한국어에서는 소유·존재 구문으로 자연스럽게 표현했습니다.
- source_word: חֶלְאָה וְנַעֲרָה
  english_pob_choice: Helah and Naarah
  chosen_korean: 헬라와 나아라
  alternatives_korean:
  - 헤라와 나아라
  - 헬라와 나이라
  lexicon: HALOT
  rationale: 고유명사는 통용되는 음역을 따르되, 히브리어 자음형을 무리 없이 반영하는 표기를 택했습니다.
theological_decisions:
- issue: 아버지의 의미가 생물학적 아버지인지, 조상/시조인지
  chosen_reading: 본문에는 ‘아버지’로 두되, 계보 문맥의 넓은 의미 가능성은 열어 둡니다.
  alternative_readings:
  - 시조
  - 설립자
  - 조상
  rationale: 히브리어 계보에서는 אָב이 즉각적 부친보다 씨족·도시의 기원을 가리킬 수 있으나, 본문 자체는 그 범위를 단정하지 않으므로 과도한 해석을 피했습니다.
  doctrine_reference: 계보 해석의 문맥 우선 원칙
- issue: 계보문의 서술을 현대 한국어로 얼마나 평이하게 다듬을지
  chosen_reading: ‘아내가 둘이었는데’로 자연스럽게 정리했습니다.
  alternative_readings:
  - 그에게는 아내 둘이 있었습니다
  - 그는 두 아내를 두었습니다
  rationale: 원문 정보는 유지하되, 독자가 즉시 이해할 수 있는 현대 서술로 조정했습니다.
  doctrine_reference: 합쇼체 서술의 가독성 원칙
