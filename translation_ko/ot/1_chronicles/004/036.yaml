source:
  edition: WLC
  text: וְ/אֶלְיוֹעֵינַ֡י וְֽ/יַעֲקֹ֡בָה וִ֠/ישׁוֹחָיָה וַ/עֲשָׂיָ֧ה וַ/עֲדִיאֵ֛ל וִ/ישִׂימִאֵ֖ל וּ/בְנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/036.yaml
  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: ko
  text: 그리고 엘리오에내, 야아코바, 예쇼하야, 아사야, 아디엘, 예시미엘, 브나야입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/וַ/וִ/וּ (반복 접속사)
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고나
  - —
  lexicon: HALOT
  rationale: 족보 목록의 반복 접속사는 단순 나열을 유지하는 기능이므로, 한국어에서도 각 인명을 자연스럽게 잇는 연결어 ‘그리고’로 옮겨 히브리어의 polysyndeton을 과도하게 평준화하지 않았습니다.
- source_word: אֶלְיוֹעֵינַי
  english_pob_choice: Elioenai
  chosen_korean: 엘리오에내
  alternatives_korean:
  - 엘리오나이
  - 엘리오에나이
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역하되, 영어 관행형 Elioenai를 그대로 따르기보다 히브리어 자음열에 더 가깝게 한국어 음절로 옮겼습니다.
- source_word: יַעֲקֹבָה
  english_pob_choice: Jaakobah
  chosen_korean: 야아코바
  alternatives_korean:
  - 야아코바흐
  - 자아코바
  lexicon: HALOT
  rationale: 히브리어 이름의 어근 음가를 보존하면서도 한국어 독자가 읽을 수 있도록 ‘야아코바’로 음역했습니다. 영어의 Jaakobah가 주는 중복 모음을 한국어에서는 자연스러운 장모 처리로 반영했습니다.
- source_word: יְשׁוֹחָיָה
  english_pob_choice: Jeshohaiah
  chosen_korean: 예쇼하야
  alternatives_korean:
  - 예쇼하이야
  - 예쇼하야흐
  lexicon: HALOT
  rationale: 중간의 ḥ(ח) 음을 한국어 ‘하’로 처리해 원어의 거친 자음을 약하게나마 드러내면서, 고유명사 음역의 가독성을 유지했습니다.
- source_word: וּ/בְנָיָה
  english_pob_choice: Benaiah
  chosen_korean: 브나야
  alternatives_korean:
  - 베나야
  - 브나이야
  lexicon: HALOT
  rationale: 이 인명은 전통적 한국 교회 음역 ‘브나야’가 널리 통용되므로 이를 채택했습니다. 영어의 Benaiah에 대응하되, 한국어 성경 독자에게 익숙한 표기를 우선했습니다.
