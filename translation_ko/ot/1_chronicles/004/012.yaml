id: 1CH.4.12
reference: 1 Chronicles 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
  footnotes:
  - marker: a
    text: Or 'the founder of Ir-nahash'; in genealogical contexts, 'father of' can denote an ancestor or founder, not only an immediate biological father.
    reason: lexical_alternative
  - marker: b
    text: Ir-nahash may mean 'city of Nahash,' but here it is likely functioning as a place-name.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스돈은 벧르바와 바세아와, 이르나하스의 아버지 테히나를 낳았습니다. 이들은 레가 사람들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보 문맥에서 ‘아버지’는 직계 부친만이 아니라 조상이나 창시자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이르나하스’는 문자적으로는 ‘나하스의 성읍’처럼 보일 수 있으나, 여기서는 지명처럼 기능하는 고유명사로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 아들을 두었습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 히필 ילד는 단순 출산보다 후손 관계의 성립을 가리키므로, 현대 한국어에서는 ‘낳다’가 가장 자연스럽고 간결하게 그 관계를 살립니다.
- source_word: בֵּית רָפָא
  english_pob_choice: Beth-rapha
  chosen_korean: 벧르바
  alternatives_korean:
  - 벧라파
  - 벧르파
  lexicon: HALOT
  rationale: 고유명사로 보고 음역했으며, 한국어 표기에서는 ‘Beth-’ 계열을 ‘벧’으로 옮기는 관행을 따랐습니다.
- source_word: אֲבִי עִיר נָחָשׁ
  english_pob_choice: the father of Ir-nahash
  chosen_korean: 이르나하스의 아버지
  alternatives_korean:
  - 이르나하스의 창시자
  - 이르나하스의 조상
  lexicon: HALOT
  rationale: 족보에서 ‘아버지’는 직계 부친뿐 아니라 조상·창시자를 뜻할 수 있으므로, 본문이 허용하는 범위 안에서 직역형을 유지했습니다.
- source_word: רֵכָה
  english_pob_choice: Rekah
  chosen_korean: 레가
  alternatives_korean:
  - 레카
  - 레카흐
  lexicon: HALOT
  rationale: 문맥상 집단 또는 지명 고유명사이므로 음역했고, 한국어 표기 관행에 맞게 ‘Rek-’ 계열을 ‘레가’로 옮겼습니다.
theological_decisions:
- issue: 족보식 ‘아버지’ 표현의 의미 범위
  chosen_reading: 직계 혈연만이 아니라 씨족의 시조 또는 정착지의 창시자를 가리킬 수 있는 족보 관용구로 읽었습니다.
  alternative_readings:
  - 직계 부친으로만 읽기
  - ‘창시자’로 풀어 의미를 명시하기
  rationale: 히브리어 족보에서는 אָב/아버지가 확장된 친족·기원 관계를 표시하므로, 본문이 지닌 역사·계보적 유연성을 보존하는 것이 더 정확합니다.
  doctrine_reference: 창세기 4–11장의 족보 및 고대 근동 계보 관용
- issue: 고유명사의 음역 처리
  chosen_reading: 설명적 번역보다 음역을 우선해 인명/지명으로 읽히게 했습니다.
  alternative_readings:
  - 벧르바를 ‘치유의 집’처럼 의미 번역하기
  - 이르나하스를 ‘나하스의 성읍’으로 번역하기
  rationale: 본문은 의미 설명보다 계보 항목 나열이 목적이므로, 독자가 고유명사로 인식하도록 음역을 유지하는 것이 원문 기능에 더 부합합니다.
  doctrine_reference: 역사서의 족보 서술 관행
