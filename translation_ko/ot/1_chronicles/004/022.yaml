base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
  footnotes:
  - marker: a
    text: Or, 'who possessed Moab,' 'who became lords in Moab,' or possibly 'who married into Moab.' The Hebrew expression is terse and uncertain.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew uncertain: possibly a proper name, ''Jashubi-lehem'' (or ''Jashub-lehem''), rather than ''returned to Lehem.'' Some also connect the place with Bethlehem.'
    reason: alternative_reading
  - marker: c
    text: Or, 'and the matters are ancient' / 'and these things are from ancient times.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요김과 코제바 사람들과 요아스와 사랍은 모압에서 권세를 잡고 레헴으로 돌아온 사람들입니다. 이 기록들은 옛날 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָּעֲלוּ는 ‘소유하다’, ‘주재하다’, ‘지배하다’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 고유명사 ‘야슈비-레헴’(또는 ‘야슈브-레헴’)으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘이 일들은 옛날의 것입니다’ / ‘이것들은 고대의 일들입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  english_pob_choice: Jokim
  chosen_korean: 요김
  alternatives_korean:
  - 죠킴
  - 요킴
  lexicon: 고유명사 음역
  rationale: 족보성 고유명사는 뜻풀이보다 음역이 적절하므로, 영어 POB의 Jokim에 대응하는 현대 한국어 음역을 사용했습니다.
- source_word: אַנְשֵׁי כֹזֵבָא
  english_pob_choice: the men of Cozeba
  chosen_korean: 코제바 사람들
  alternatives_korean:
  - 코제바의 남자들
  - 헤스립 사람들
  lexicon: 고유명사 음역
  rationale: אַנְשֵׁי는 직역하면 ‘~의 사람들/남자들’이므로, 자연스러운 한국어로 ‘코제바 사람들’이라 옮겼습니다. 전통 지명인 ‘헤스립’보다 히브리어 형태를 더 직접적으로 반영했습니다.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  english_pob_choice: who ruled in Moab
  chosen_korean: 모압에서 권세를 잡고
  alternatives_korean:
  - 모압을 소유하고
  - 모압의 주인이 되고
  - 모압과 결혼하고
  lexicon: HALOT
  rationale: בעל은 문맥상 ‘소유하다/주재하다/지배하다’ 범위를 가지므로, 간결하면서도 통치·우위의 뉘앙스를 살리는 ‘권세를 잡다’를 선택했습니다.
- source_word: יָשֻׁבִי לָחֶם
  english_pob_choice: returned to Lehem
  chosen_korean: 레헴으로 돌아온
  alternatives_korean:
  - 야슈비-레헴인
  - 베들레헴으로 돌아온
  - 야슈브-레헴인
  lexicon: HALOT
  rationale: 이 구는 난해하여 고유명사인지 서술어구인지가 불확실하므로, 영어 POB의 본문 선택을 따라 ‘돌아온’으로 옮기되 지명은 히브리어 음을 살려 ‘레헴’으로 적었습니다.
- source_word: הַדְּבָרִים עַתִּיקִים
  english_pob_choice: These records are ancient
  chosen_korean: 이 기록들은 옛날 것입니다
  alternatives_korean:
  - 이 일들은 옛날 것입니다
  - 이 말들은 고대의 것입니다
  - 이 일들은 옛것입니다
  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 단순한 ‘말’보다 전승된 자료·기록의 뜻이 자연스러워, 독자가 이해하기 쉬운 ‘기록들’로 옮겼습니다. עַתִּיקִים은 ‘옛날의/고대의’라는 시간적 오래됨을 담습니다.
theological_decisions:
- issue: 난해한 히브리어 구문의 처리
  chosen_reading: 본문은 역사·족보 메모의 성격을 살려, 확정 가능한 의미만 본문에 두고 불확실성은 번역의 자연스러움 안에서 최소화했습니다.
  alternative_readings:
  - 모압을 소유한 사람들
  - 모압의 주인이 된 사람들
  - 모압과 결혼한 사람들
  - 야슈비-레헴이라는 고유명사
  rationale: 히브리어가 매우 간략하고 다의적이므로, 단정적 해석을 피하면서도 한국어 문장이 읽히도록 옮기는 것이 원문의 긴장과 자료적 성격을 가장 잘 보존합니다.
  doctrine_reference: 성경 본문 번역의 불확실성 처리 원칙
