  alternative_readings:
  - 모압을 소유한 사람들
  - 모압의 주인이 된 사람들
  - 모압과 결혼한 사람들
  - 야슈비-레헴이라는 고유명사
  rationale: 히브리어가 매우 간략하고 다의적이므로, 단정적 해석을 피하면서도 한국어 문장이 읽히도록 옮기는 것이 원문의 긴장과 자료적 성격을 가장 잘 보존합니다.
  doctrine_reference: 성경 본문 번역의 불확실성 처리 원칙
