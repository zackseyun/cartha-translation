revisions:
- from: 호디야의 아내, 곧 나함의 누이의 아들들은, 그 게르미 사람 기라와 마아가 사람 에스드모아의 조상이었습니다.[a][b]
  to: 호디야의 아내, 곧 나함의 누이의 아들들은 가르미 사람 그일라와 마아갓 사람 에스드모아의 조상이었습니다.[a][b]
  rationale: 원문의 족보적 모호성과 ‘아들들’ 및 단수 אֲבִי의 압축을 유지하되, 그일라의 명백한 오기를 정정하고 마아갓 계통을 뜻하는 형용사형을 더 정확히 반영했습니다. 각주는 모두 ‘조상’이라는 번역 선택과 복수-단수의 압축 관계를 직접 뒷받침하므로 해당 문장 끝의 앵커를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:51Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 관계 구조(호디야의 아내=나함의 누이, 그 아들들, 그리고 그일라와 에스드모아에 대한 ‘아버지/조상’ 표기)는 대체로 충실히 반영되었습니다. 다만 ‘기라’는 קְעִילָה(Keilah)의 음역으로 보기 어려운 오기이며, 인명·지명 표기를 바로잡아야 합니다. 또한 הַמַּעֲכָתִי는 마아가가 아니라 마아갓에 속한 사람이라는 형용사형이므로 ‘마아갓 사람’이 더 정확합니다.
  naturalness: ‘호디야의 아내, 곧 나함의 누이의 아들들’은 족보식 압축 구문을 자연스럽게 전달합니다. ‘가르미 사람 그일라와 마아갓 사람 에스드모아의 조상이었습니다’도 현대 한국어의 족보 문맥에서 이해 가능합니다.
  terminology: ‘조상’은 אֲבִי의 족보적 확장 의미를 무리 없이 반영하며, 각주가 직계 부친·창시자·씨족 우두머리 등의 가능성을 보완합니다. ‘그일라’, ‘가르미’, ‘에스드모아’, ‘마아갓’으로 음역을 일관되게 정정했습니다.
