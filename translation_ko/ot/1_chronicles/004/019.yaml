  - severity: medium
    issue: ‘마아가 사람’ 표기
    rationale: הַמַּעֲכָתִי는 Maacah라는 인물명 자체가 아니라 마아갓/마아가 계통·출신을 나타내는 형용사형입니다. 한국어 성경 지명·민족명 관례와 구별을 위해 ‘마아갓 사람’으로 옮기는 편이 정확합니다.
