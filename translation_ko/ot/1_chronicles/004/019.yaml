id: 1CH.4.19
reference: 1 Chronicles 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
  footnotes:
  - marker: a
    text: Hebrew 'father of' in genealogies can mean founder, ancestor, or clan-head, not only immediate biological father.
    reason: lexical_alternative
  - marker: b
    text: Because the Hebrew says 'sons' but then uses singular 'father of,' the line is compressed and may summarize a clan relationship rather than a simple father-son sequence.
    reason: cultural_note
translation:
  language: ko
  text: 호디야의 아내, 곧 나함의 누이의 아들들은, 그 게르미 사람 기라와 마아가 사람 에스드모아의 조상이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보에서 ‘아버지’는 때로 직계 부친이 아니라 창시자, 조상, 씨족 우두머리를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아들들’이라 하면서도 단수 ‘조상’을 사용하므로, 이 줄은 단순한 부자 관계보다 씨족 관계를 압축해 말할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 아들들이
  lexicon: HALOT
  rationale: 족보 문맥에서 בנים은 문자적 아들일 수도 있고 후손 전체를 가리킬 수도 있어, 간결한 현대 한국어로는 ‘아들들’이 가장 직접적입니다.
- source_word: אֵשֶׁת הוֹדִיָּה
  english_pob_choice: the wife of Hodiah
  chosen_korean: 호디야의 아내
  alternatives_korean:
  - 호디야의 아내인
  - 호디야의 아내의
  lexicon: HALOT
  rationale: 구문상 ‘호디야의 아내’가 자연스럽고, 계보 정보의 관계를 분명하게 드러냅니다.
- source_word: אֲבִי
  english_pob_choice: were the father of
  chosen_korean: 조상이었습니다
  alternatives_korean:
  - 아버지였습니다
  - 시조였습니다
  - 창시자였습니다
  lexicon: HALOT
  rationale: 족보에서 אבי는 단순 생물학적 아버지보다 씨족·마을의 시조/조상을 뜻할 수 있으므로, 문맥을 반영해 ‘조상’으로 옮겼습니다.
- source_word: הַגַּרְמִי
  english_pob_choice: the Garmite
  chosen_korean: 게르미 사람
  alternatives_korean:
  - 가르미 사람
  - 가르미 족속
  lexicon: HALOT
  rationale: 형용사적 민족/씨족 표지를 한국어의 ‘~사람’으로 옮겨 소속을 살렸습니다.
- source_word: הַמַּעֲכָתִי
  english_pob_choice: the Maacathite
  chosen_korean: 마아가 사람
  alternatives_korean:
  - 마아가 족속
  - 마아가 사람의
  lexicon: HALOT
  rationale: א-형용사형의 집단/출신 표지를 한국어에서는 ‘~사람’이 가장 자연스럽고 간결합니다.
theological_decisions:
- issue: 족보의 압축된 표현 ‘아들들’과 단수 ‘조상’의 결합
  chosen_reading: 이 구문은 단순한 부자 관계보다 씨족이나 정착지의 기원을 압축해 말하는 족보적 표현으로 읽었습니다.
  alternative_readings:
  - 호디야의 아내에게서 난 실제 아들들로 읽기
  - 두 지명 인물의 직접적 아버지로 읽기
  rationale: 히브리어 원문이 복수 주어 뒤에 단수 ‘아버지/조상’을 두어 축약된 족보 관용구를 이루므로, 한국어도 그 축약성을 보존해야 합니다.
  doctrine_reference: 성경 족보의 문학적 관습
