  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Now Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
  footnotes:
  - marker: a
    text: The name Jabez sounds like the Hebrew expression for pain or sorrow in his mother's explanation.
    reason: lexical_alternative
  - marker: b
    text: Or “Because I bore him with sorrow.” The Hebrew עֹצֶב can denote pain, sorrow, or hardship.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 야벳은 그의 형제들보다 더 존귀한 사람이었고, 그의 어머니는 “내가 그를 고통 가운데서 낳았기 때문입니다”라고 하며 그의 이름을 야벳이라 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이름 야벳은 그의 어머니의 설명에 나오는 ‘고통’에 해당하는 히브리어 표현과 소리가 비슷합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내가 그를 슬픔 가운데서 낳았기 때문입니다.” 히브리어 עֹצֶב은 고통, 슬픔, 수고를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי / נִכְבָּד
  english_pob_choice: Now ... was more honored
  chosen_korean: “이제 ...은 ...보다 더 존귀한 사람이었다”
  alternatives_korean:
  - “그리고 ...은 ...보다 더 영예로운 사람이었다”
  - “...은 ...보다 더 존중받는 사람이었다”
  lexicon: HALOT
  rationale: 서술 도입의 진행감은 ‘이제’로, נִכְבָּד의 비교적·사회적 명예 의미는 ‘존귀한’으로 옮겨 원문의 ‘더 ... than’ 관계를 살렸습니다.
- source_word: מֵאֶחָיו
  english_pob_choice: than his brothers
  chosen_korean: “그의 형제들보다”
  alternatives_korean:
  - “그의 형제들보다 더”
  - “그의 친족들보다”
  lexicon: HALOT
  rationale: 히브리어 복수 남성형의 직접 의미를 따라 ‘형제들’로 옮겼고, 족보 문맥에서 더 넓힌 포괄어는 필요하지 않습니다.
- source_word: קָרְאָה שְׁמוֹ
  english_pob_choice: called his name
  chosen_korean: “그의 이름을 ...이라 불렀습니다”
  alternatives_korean:
  - “그를 ...이라 불렀습니다”
  - “그의 이름을 ...이라 지었습니다”
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘이름을 부르다’를 드러내기 위해 직역에 가깝게 유지하되, 한국어 문장으로는 자연스럽게 다듬었습니다.
- source_word: יָלַדְתִּי בְּעֹצֶב
  english_pob_choice: I bore him in pain
  chosen_korean: “내가 그를 고통 가운데서 낳았기 때문입니다”
  alternatives_korean:
  - “내가 그를 아픔 가운데서 낳았기 때문입니다”
  - “내가 그를 슬픔 가운데서 낳았기 때문입니다”
  lexicon: HALOT
  rationale: עֹצֶב의 넓은 의미(고통/슬픔/수고) 중 여기서는 출산 맥락과 이름 풀이의 직접적 연관을 살려 ‘고통’으로 번역했습니다.
theological_decisions:
- issue: 야벳 이름풀이의 감정·신체적 뉘앙스
  chosen_reading: 출산의 신체적 고통을 중심 의미로 두되, 이름과 설명 사이의 말장난은 유지했습니다.
  alternative_readings:
  - ‘슬픔 가운데서’로 옮겨 정서적 뉘앙스를 더 살리는 읽기
  - ‘고통/슬픔’의 이중 가능성을 각주로 병기하는 읽기
  rationale: 히브리어 עֹצֶב은 폭이 있지만, 본문은 이름 야벳과의 음성적 연관을 통해 출산의 고통을 가장 즉각적으로 떠올리게 하므로 그 축을 본문에 반영했습니다.
  doctrine_reference: 본문 해석상의 어휘 선택
