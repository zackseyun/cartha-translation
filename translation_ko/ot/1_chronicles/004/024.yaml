base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
  footnotes:
  - marker: a
    text: Nemuel is called Jemuel in some English traditions and in the parallel genealogy of Genesis 46:10; the Hebrew form here reads Nemuel.
    reason: alternative_reading
  - marker: b
    text: Zerah corresponds to Zohar in the parallel genealogy of Genesis 46:10 and Exodus 6:15.
    reason: textual_variant
  - marker: c
    text: Shaul is the Hebrew form of the name often Anglicized as Saul.
    reason: lexical_alternative
translation:
  language: ko
  text: 시므온의 아들들은 느무엘[a], 야민, 야립, 제라[b], 사울[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘느무엘’은 일부 영어 성경 전통과 창세기 46:10의 평행 족보에서는 ‘제무엘’로도 나타납니다. 그러나 이 절의 히브리어 본문은 ‘느무엘’에 해당하는 형태를 읽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘제라’는 창세기 46:10과 출애굽기 6:15의 평행 족보에 나오는 ‘조하르’에 대응합니다.
    reason: textual_variant
  - marker: c
    text: ‘사울’은 히브리어 이름 שָׁאוּל의 통용 한국어 표기입니다. 이 이름은 영어에서 ‘Shaul’ 또는 ‘Saul’로도 옮깁니다.
    reason: lexical_alternative
