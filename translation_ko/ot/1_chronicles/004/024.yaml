id: 1CH.4.24
reference: 1 Chronicles 4:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֖י שִׁמְע֑וֹן נְמוּאֵ֣ל וְ/יָמִ֔ין יָרִ֖יב זֶ֥רַח שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
  footnotes:
  - marker: a
    text: Nemuel is called Jemuel in some English traditions and in the parallel genealogy of Genesis 46:10; the Hebrew form here reads Nemuel.
    reason: alternative_reading
  - marker: b
    text: Zerah corresponds to Zohar in the parallel genealogy of Genesis 46:10 and Exodus 6:15.
    reason: textual_variant
  - marker: c
    text: Shaul is the Hebrew form of the name often Anglicized as Saul.
    reason: lexical_alternative
translation:
  language: ko
  text: 시므온의 아들들은 네무엘, 야민, 야립, 제라, 사울입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네무엘’은 일부 전승과 창세기 46:10의 평행 족보에서 ‘제무엘’로도 나타납니다.
    reason: alternative_reading
  - marker: b
    text: ‘제라’는 창세기 46:10과 출애굽기 6:15의 평행 족보에서 ‘조하르’에 대응합니다.
    reason: textual_variant
  - marker: c
    text: ‘사울’은 히브리어 이름의 음역형 ‘Shaul’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 뒤에 이어지는 개별 이름들을 직접 소개하는 말이므로, 더 일반적인 ‘자손들’보다 ‘아들들’이 원문 구조를 더 가깝게 드러냅니다.
- source_word: שִׁמְעוֹן
  english_pob_choice: Simeon
  chosen_korean: 시므온
  alternatives_korean:
  - 시몬
  lexicon: HALOT
  rationale: 히브리어 고유명사를 한국어 성경에서 널리 쓰는 표기인 ‘시므온’으로 옮겼습니다.
- source_word: נְמוּאֵל
  english_pob_choice: Nemuel
  chosen_korean: 네무엘
  alternatives_korean:
  - 제무엘
  - 예무엘
  lexicon: HALOT
  rationale: 이 절의 히브리어 형태에 맞추어 음역했고, 다른 전승형은 각주로 처리하지 않아도 되는 범위라 본문에는 반영하지 않았습니다.
- source_word: זֶרַח
  english_pob_choice: Zerah
  chosen_korean: 제라
  alternatives_korean:
  - 세라
  - 조하르
  lexicon: HALOT
  rationale: 본문의 히브리어 형태 זֶרַח을 직접 반영한 음역입니다. 전통적 한국어 표기보다 원문 자형을 드러내는 쪽을 택했습니다.
- source_word: שָׁאוּל
  english_pob_choice: Shaul
  chosen_korean: 사울
  alternatives_korean:
  - 샤울
  lexicon: HALOT
  rationale: 히브리어 이름 שאול은 한국어 성경에서 익숙한 ‘사울’로 옮길 수 있으며, 영어 POB의 Shaul은 음역상의 투명성을 위한 것이므로 한국어에서는 통용 표기를 따랐습니다.
