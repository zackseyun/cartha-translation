  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
  footnotes:
  - marker: a
    text: Or “keep me from evil.” The Hebrew רָעָה can mean moral evil or harmful calamity; here the context favors protection from harm.
    reason: lexical_alternative
  - marker: b
    text: The wording “so that I may not suffer pain” echoes the explanation of Jabez’s name in the previous verse.
    reason: cross_reference
translation:
  language: ko
  text: 야베스는 이스라엘의 하나님께 불러 아뢰며 말했습니다. “주께서 참으로 저를 복 주시고 제 경계를 넓혀 주시며, 주의 손이 저와 함께해 주시고, 저를 환난에서 지켜 주셔서 제가 고통을 겪지 않게 해 주십시오.” 하나님께서는 그가 구한 것을 이루어 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָעָה는 도덕적 악이나 해로운 재난을 뜻할 수 있는데, 여기서는 문맥상 해를 입지 않게 해 달라는 의미가 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주의 손이 저와 함께해 주시고’는 이전 절의 이름 설명과 연결되어 고통을 겪지 않게 해 달라는 요청을 되살립니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא ... לֵאמֹר
  english_pob_choice: called on ... saying
  chosen_korean: 불러 아뢰며 말했습니다
  alternatives_korean:
  - 부르며 말했습니다
  - 간구하며 말했습니다
  - 호소하며 말했습니다
  lexicon: HALOT
  rationale: 기도적 문맥에서 단순한 '부르다'보다 하나님께 청원하는 행위를 드러내는 표현이 적합하여, 합쇼체 본문에서는 '불러 아뢰다'로 옮겼습니다.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘 하나님
  - 이스라엘의 하느님
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 자연스럽게 풀어, 야베스가 특정 민족의 하나님께 기도하고 있음을 분명히 했습니다.
- source_word: גְּבוּלִי
  english_pob_choice: enlarge my territory
  chosen_korean: 제 경계를 넓혀 주시며
  alternatives_korean:
  - 제 땅을 넓혀 주시며
  - 제 영역을 넓혀 주시며
  - 제 영토를 넓혀 주시며
  lexicon: HALOT
  rationale: גְּבוּל은 문맥상 땅의 경계이면서 소유 범위를 뜻하므로, 과도한 현대적 추상화 없이 '경계'를 살리되 자연스러운 한국어로 풀었습니다.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  english_pob_choice: and let your hand be with me
  chosen_korean: 주의 손이 저와 함께해 주시고
  alternatives_korean:
  - 주의 손이 저와 함께하시고
  - 주의 손이 저와 동행해 주시고
  - 주님의 손이 저와 함께해 주시고
  lexicon: HALOT
  rationale: '''손''은 하나님의 능력과 도우심을 가리키는 관용구이므로, 비유를 유지하면서 기도문에 맞게 ''함께해 주시고''로 옮겼습니다.'
- source_word: מֵּרָעָה
  english_pob_choice: keep me from harm
  chosen_korean: 저를 환난에서 지켜 주셔서
  alternatives_korean:
  - 저를 해악에서 지켜 주셔서
  - 저를 악에서 지켜 주셔서
  - 저를 재앙에서 지켜 주셔서
  lexicon: HALOT
  rationale: 본문은 뒤의 '고통을 겪지 않게'와 맞물려 해를 입지 않게 해 달라는 뜻이므로, 도덕적 악보다 피해·재난의 뉘앙스를 살려 '환난'으로 옮겼습니다.
- source_word: לְבִלְתִּי עָצְבִּי
  english_pob_choice: so that I may not suffer pain
  chosen_korean: 제가 고통을 겪지 않게 해 주십시오
  alternatives_korean:
  - 제가 슬퍼하지 않게 해 주십시오
  - 제가 아프지 않게 해 주십시오
  - 제가 근심하지 않게 해 주십시오
  lexicon: HALOT
  rationale: 이 표현은 바로 앞 절의 이름 설명과 연결되는 '고통/아픔'의 반복이므로, 이름의 의미를 살리면서도 한국어로 자연스럽게 '고통을 겪다'로 옮겼습니다.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  english_pob_choice: And God granted what he asked
  chosen_korean: 하나님께서는 그가 구한 것을 이루어 주셨습니다
  alternatives_korean:
  - 하나님께서는 그가 요청한 것을 주셨습니다
  - 하나님께서는 그가 구한 바를 허락하셨습니다
  - 하나님께서는 그가 청한 것을 들어주셨습니다
  lexicon: HALOT
  rationale: וַיָּבֵא는 요청을 '실현되게 하다'는 뜻으로 자연스럽게 이해되므로, 단순히 '주셨다'보다 청원의 성취를 드러내는 '이루어 주셨다'가 적절합니다.
theological_decisions:
- issue: רָעָה의 의미를 도덕적 악으로 볼지, 해악/재난으로 볼지
  chosen_reading: 본문에서는 '환난'으로 옮겨 야베스의 기도가 해를 입지 않게 해 달라는 요청임을 드러냈습니다.
  alternative_readings:
  - 악
  - 해악
  - 재앙
  rationale: 앞뒤 문맥이 '경계 확대'와 '고통을 겪지 않음'에 연결되므로, 도덕적 악을 단정하기보다 보호와 무사함의 의미를 살리는 것이 본문 흐름에 더 맞습니다.
  doctrine_reference: Translation philosophy §§3, 5
- issue: 야베스의 기도를 번영 신학으로 읽을지 여부
  chosen_reading: 토지·보호·고통 없음이라는 본문 차원에서만 번역하고, 현대적 번영 담론은 덧붙이지 않았습니다.
  alternative_readings:
  - 번영 신학적 축복 기원으로 확장하여 해석
  - 영적 영역의 확장으로 추상화
  rationale: 히브리어는 실제 경계와 보호를 말하므로, 본문이 말하는 범위를 넘는 신학적 과잉 해석을 피하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
