source:
  edition: WLC
  text: וְ/אִשְׁתּ֣/וֹ הַ/יְהֻדִיָּ֗ה יָלְדָ֞ה אֶת יֶ֨רֶד אֲבִ֤י גְדוֹר֙ וְ/אֶת חֶ֨בֶר֙ אֲבִ֣י שׂוֹכ֔וֹ וְ/אֶת יְקֽוּתִיאֵ֖ל אֲבִ֣י זָנ֑וֹחַ וְ/אֵ֗לֶּה בְּנֵי֙ בִּתְיָ֣ה בַת פַּרְעֹ֔ה אֲשֶׁ֥ר לָקַ֖ח מָֽרֶד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
  footnotes:
  - marker: a
    text: Or 'the Judean woman' or 'the Jewish woman' for 'the Jewess.'
    reason: lexical_alternative
  - marker: b
    text: '''Father of'' in Chronicles can also mean founder, ancestor, or clan chief associated with a place.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew is difficult: the relation between ''his wife the Jewess'' and ''Bithiah daughter of Pharaoh'' is debated; some understand them as the same woman, others as different wives of Mered.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 아내인 유다 여인이 그돌의 아버지[a] 예렛과 소고의 아버지 헤벨과 사노아의 아버지 여구디엘을 낳았습니다. 이들은 메렛이 아내로 맞이한 바로의 딸 비디아[b]의 아들들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아버지’는 역대기에서 장소나 집단과 관련된 창시자, 선조, 또는 씨족장을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘그의 아내인 유다 여인’과 ‘바로의 딸 비디아’의 관계를 분명히 밝히지 않습니다. 두 여인을 같은 인물로 보는 견해와 메렛의 서로 다른 아내로 보는 견해가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  english_pob_choice: the Jewess
  chosen_korean: 유다 여인
  alternatives_korean:
  - 유대 여인
  - 유다 사람의 여자
  lexicon: HALOT
  rationale: 히브리어 여성형 민족명은 단순한 지리표지보다 민족/출신을 가리키는 경우가 많아, 직역적인 ‘유다 여인’이 원문의 성격을 잘 보존합니다.
- source_word: יָלְדָה
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 아들을 낳았습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 ילד는 간결한 생식 서술로 쓰이므로, 현대 한국어에서는 ‘낳았습니다’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: אֲבִי
  english_pob_choice: the father of
  chosen_korean: 아버지
  alternatives_korean:
  - 창시자
  - 선조
  - 터전의 주인
  lexicon: HALOT
  rationale: 역대기에서는 ‘~의 아버지’가 실제 부친뿐 아니라 창시자/시조/집단 우두머리를 뜻할 수 있어, 본문 표현을 그대로 살리되 각주로 의미 범위를 열어 두었습니다.
- source_word: וְאֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이것은 바로
  alternatives_korean:
  - 그리고 이것들은
  - 이들이
  lexicon: HALOT
  rationale: 요약적 식별 도입어로 기능하므로, 한국어에서는 문맥상 매끄럽게 연결되도록 옮겼습니다.
theological_decisions:
- issue: ‘유다 여인’과 ‘바로의 딸 비디아’의 관계가 모호한 구절 처리
  chosen_reading: 본문 순서를 그대로 유지하고 두 표현을 조화시키지 않았습니다. 비디아를 메렛이 아내로 맞이한 여인으로 제시하되, 앞의 ‘그의 아내인 유다 여인’과 동일 인물인지 다른 아내인지 결론짓지 않았습니다.
  alternative_readings:
  - 유다 여인과 비디아를 같은 인물로 본다
  - 두 여인을 더 분명히 구분하도록 재배열한다
  rationale: 히브리어는 여기서 의도적으로 난점을 남기며, 번역이 이를 해소해 버리면 본문의 긴장을 잃습니다. 따라서 관계를 단정하지 않고 원문의 모호성을 보존합니다.
  doctrine_reference: 본문의 해석적 긴장을 보존하는 원칙
