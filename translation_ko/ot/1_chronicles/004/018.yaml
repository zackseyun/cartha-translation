revisions:
- from: 그의 아내인 유다 여인이 야레드—그돌의 아버지[a]—와 헤벨—소코의 아버지—와 여굿이엘—사노아의 아버지—을 낳았습니다. 이것은 바로 바로의 딸 비디아의 아들들이니[c][b], 메렛이 아내로 맞이한 여인입니다.
  to: 그의 아내인 유다 여인이 그돌의 아버지[a] 예렛과 소고의 아버지 헤벨과 사노아의 아버지 여구디엘을 낳았습니다. 이들은 메렛이 아내로 맞이한 바로의 딸 비디아[b]의 아들들입니다.
  rationale: 복수 지시사와 ‘아들들’의 관계를 바로잡고, ‘바로’의 중복을 제거했습니다. 마지막 관계절을 ‘메렛이 아내로 맞이한’이 비디아를 수식하는 한국어 구조로 옮겼으며, 유다 여인과 비디아의 관계에 관한 원문의 난점은 본문에서 결정하지 않고 각주에 보존했습니다. 불필요하게 중복된 각주 c는 삭제하고, 모든 남은 각주 표지를 본문에 정확히 연결했습니다.
  reviewer_model: gpt-5.6-terra
