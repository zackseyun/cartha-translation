- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל ... בְּרֹאשָׁם
  english_pob_choice: with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head
  chosen_korean: 이시의 아들인 블라댜, 느아랴, 르바야, 웃시엘이 그들의 앞장에 섰습니다
  alternatives_korean:
