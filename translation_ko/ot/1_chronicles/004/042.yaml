  source_fidelity: 히브리어는 시므온 자손 가운데 오백 명이 세일 산으로 갔고, 이시의 아들들인 네 사람이 그들의 선두/우두머리였음을 말합니다. 초안의 기본 해석은 이에 부합하지만, 첫 명사구의 쉼표와 ‘곧’은 수량구의 결속을 다소 불분명하게 만듭니다.
  naturalness: ‘그들 가운데 일부, 곧 시므온 자손 중에서 오백 명이’는 현대 한국어에서 문장 성분의 관계가 매끄럽지 않습니다. ‘그들 가운데 시므온 자손 오백 명이’가 원문의 부분성 및 계보적 한정을 자연스럽게 드러냅니다. ‘그들의 앞장에 섰습니다’도 가능하나, 이 문맥에서는 ‘그들을 이끌었습니다’가 더 자연스럽고 지도 관계를 명확히 합니다.
  terminology: ‘시므온’, ‘세일 산’, ‘이시’, ‘블라댜’, ‘느아랴’, ‘르바야’, ‘웃시엘’은 한국어 성경 전통과 잘 맞습니다. 기존 주석의 ‘그들의 앞장이었습니다’와 ‘이시의 아들들, 곧 그들의 앞장’은 한국어로 부자연스럽고 원문의 관용구를 정확히 설명하지 못합니다.
