  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
  footnotes:
  - marker: a
    text: Or 'and Pelatyah, Neariah, Rephayah, and Uzziel ... were their leaders.' The Hebrew syntax places the names before 'sons of Ishi, at their head,' indicating these men led the group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 일부, 곧 시므온 자손 중에서 오백 명이 세일 산으로 갔는데, 이시의 아들인 블라댜, 느아랴, 르바야, 웃시엘이 그들의 앞장에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들 가운데 일부인 블라댜, 느아랴, 르바야, 웃시엘이 … 그들의 앞장이었습니다.” 히브리어 구문은 이름들을 ‘이시의 아들들, 곧 그들의 앞장’이라는 표현보다 앞에 두어, 이 사람들이 무리를 이끈 것으로 읽히게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם / מִן בְּנֵי שִׁמְעוֹן
  english_pob_choice: And some of them, from the sons of Simeon
  chosen_korean: 그들 가운데 일부, 곧 시므온 자손 중에서
  alternatives_korean:
