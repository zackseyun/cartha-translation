theological_decisions:
- issue: 명단 뒤의 수량과 인물 배열이 지시하는 주어 관계
  chosen_reading: ‘이시의 아들인 블라댜, 느아랴, 르바야, 웃시엘’이 오백 명의 앞장에 선 지도자들로 읽었습니다.
  alternative_readings:
  - 네 사람과 오백 명이 함께 세일 산으로 갔다고 평행적으로 읽는 방식
  - 네 사람이 오백 명에 포함된 종속 명사구로만 읽는 방식
  rationale: 히브리어 배열이 이름들을 먼저 제시한 뒤 '그들의 앞장'을 붙이므로, POB의 오디오트레이스를 따라 지도자 역할을 분명히 드러냈습니다.
  doctrine_reference: 본문의 문법·구문 해석
