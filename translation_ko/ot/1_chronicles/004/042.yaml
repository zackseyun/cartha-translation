  lexicon: WLC; HALOT
  rationale: 부분 집합을 가리키는 표현이므로 '그들 가운데 일부'로 옮겨, 단순한 출처 표시보다 선별된 무리를 드러냈습니다.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
