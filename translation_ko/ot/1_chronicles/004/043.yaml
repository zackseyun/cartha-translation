theological_decisions:
- issue: 전투 결과의 강도 표현
  chosen_reading: ‘쳐서 무찔렀고’로 옮겨 전투 행위와 사실상의 패배를 드러내되, 본문에 없는 상세한 학살 표현은 피했습니다.
  alternative_readings:
  - ‘죽였고’로 더 강하게 옮김
  - ‘패배시켰고’로 완화
  rationale: 히브리어 נכה는 맥락상 치명적 결과를 암시하지만, 본문은 단순 동사 형태이므로 과도한 해석을 피하는 것이 적절합니다.
  doctrine_reference: 본문-충실성 원칙
