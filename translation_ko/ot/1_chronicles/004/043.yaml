  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
  footnotes:
  - marker: a
    text: Or 'the remnant that had escaped of the Amalekites.' The Hebrew expression combines two near-synonymous terms for those left after devastation.
    reason: lexical_alternative
  - marker: b
    text: Or 'they settled there to this day.' The verb can denote dwelling or settling in a place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아말렉 사람들 가운데 살아남아 남은 자들[a]을 쳐서 쓰러뜨리고, 그곳에 오늘날까지 살았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아말렉의 도망쳐 살아남은 자들 가운데 남은 자들’입니다. 히브리어는 황폐 뒤에 남은 이들을 가리키는 두 유사 표현을 함께 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살았습니다’로 옮긴 동사는 ‘거주하다’ 또는 ‘정착하다’라는 뜻으로도 번역할 수 있습니다.
    reason: lexical_alternative
