source:
  edition: WLC
  text: וַ/יֵּלְכוּ֙ לִ/מְב֣וֹא גְדֹ֔ר עַ֖ד לְ/מִזְרַ֣ח הַ/גָּ֑יְא לְ/בַקֵּ֥שׁ מִרְעֶ֖ה לְ/צֹאנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
  footnotes:
  - marker: a
    text: Or 'to the approach of Gedor'; the Hebrew term can denote an entrance, approach, or place of entry.
    reason: lexical_alternative
  - marker: b
    text: Or 'east of the valley' or 'toward the east of the valley'; the Hebrew expression is a compact topographical phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 게돌의 입구[a]에서부터 골짜기 동쪽[b]까지 가서, 자기들의 떼를 위한 풀을 찾았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘게돌의 접근 지점’으로도 옮길 수 있습니다. 히브리어 מָבוֹא는 입구, 접근, 진입 지점을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘골짜기 동쪽에’ 혹은 ‘골짜기의 동쪽을 향해’로 옮길 수 있습니다. 히브리어 표현은 간결한 지형 묘사입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: They went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 이동했습니다
  lexicon: HALOT
  rationale: 서술의 다음 동작을 잇는 wayyiqtol이므로, 자연스러운 서술 흐름을 살려 간결하게 ‘가서’로 옮겼습니다.
- source_word: לִמְבּוֹא גְדֹר
  english_pob_choice: to the entrance of Gedor
  chosen_korean: 게돌의 입구
  alternatives_korean:
  - 게돌의 접근 지점
  - 게돌의 진입로
  lexicon: HALOT
  rationale: מָבוֹא의 핵심은 ‘들어가는 곳/입구’라는 공간적 의미이므로, 장소명과 결합해 ‘게돌의 입구’로 옮기면 원문의 지리적 방향성을 유지할 수 있습니다.
- source_word: לְמִזְרַח הַגָּיְא
  english_pob_choice: the east side of the valley
  chosen_korean: 골짜기 동쪽
  alternatives_korean:
  - 골짜기의 동쪽 면
  - 골짜기 동편
  lexicon: HALOT
  rationale: עַד와 결합한 지형 표현으로서 ‘동쪽’ 방향을 나타내므로, 한국어에서는 간결하고 자연스러운 ‘골짜기 동쪽’이 적절합니다.
- source_word: לְבַקֵּשׁ מִרְעֶה לְצֹאנָם
  english_pob_choice: to seek pasture for their flocks
  chosen_korean: 자기들의 떼를 위한 풀을 찾았습니다
  alternatives_korean:
  - 자기들의 떼를 위해 풀을 찾았습니다
  - 자기들의 가축 떼를 위한 목초지를 찾았습니다
  lexicon: HALOT
  rationale: מִרְעֶה는 가축이 먹는 풀/목초지를 가리키므로 ‘풀’로 직역하되, 목적을 분명히 하기 위해 ‘찾았습니다’와 함께 자연스럽게 표현했습니다.
