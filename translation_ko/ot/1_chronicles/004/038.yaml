  lexicon: HALOT
  rationale: 히브리어 관용구의 계보적·혈통적 의미를 살리면서도 한국어에서 읽히는 표현으로 옮겼습니다.
- source_word: פָּרְצוּ לָרֹב
  english_pob_choice: increased greatly
  chosen_korean: 크게 번성했습니다
  alternatives_korean:
  - 크게 늘어났습니다
  - 많이 불어났습니다
  - 크게 증가했습니다
  lexicon: HALOT
  rationale: פָּרַץ의 ‘터져 나가다/번성하다’라는 확장 이미지를 살리되, 결과를 자연스럽게 전달하기 위해 ‘번성하다’를 택했습니다.
