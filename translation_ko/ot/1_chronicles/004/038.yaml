  rationale: 족보적·씨족적 맥락에서 지위가 높은 사람들을 가리키며, ‘지도자들’이 현대 한국어에서 가장 자연스럽고 과도한 정치적 색채도 덜합니다.
- source_word: בְּמִשְׁפְּחוֹתָם
