base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
  footnotes:
  - marker: a
    text: Or 'These who came, listed by name.' The Hebrew participle literally means 'coming,' but here likely refers to those entered or designated in the genealogical record.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'their fathers’ houses increased to abundance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들[a]은 이름으로 언급된 이들로서, 그들의 종족 가운데 지도자들이었으며, 그들의 조상 가문은 크게 번성했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이름으로 기록된 이들’. 히브리어 분사는 문자적으로는 ‘오는’이지만, 여기서는 족보 기록에 이름이 올라간 사람들을 가리키는 것으로 보입니다.
    reason: alternative_reading
