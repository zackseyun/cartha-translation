  - 에셈에서
  lexicon: HALOT
  rationale: עֶצֶם은 이 구절에서 지명으로 기능하므로 음역을 따랐습니다. 앞뒤 문맥상 반복되는 전치사는 한국어에서 모두 드러내기보다 목록형 표현으로 자연스럽게 처리했습니다.
- source_word: וּ/בְ/תוֹלָד
  english_pob_choice: and in Tolad
  chosen_korean: 돌랏
  alternatives_korean:
