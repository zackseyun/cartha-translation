translation:
  language: ko
  text: 그리고 빌하, 에셈, 돌랏에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ב는 지명 목록에서는 '에/에서'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בִלְהָ֥ה
  english_pob_choice: and in Bilhah
  chosen_korean: 그리고 빌하
  alternatives_korean:
  - 그리고 빌하에
  - 그리고 빌하에서
  lexicon: HALOT
  rationale: 지명 목록이므로 장소 전치사 ב를 한국어에서는 가장 자연스러운 열거 연결로 옮기고, 지명은 음역하여 처리했습니다. 영어 POB의 'in'을 너무 직역한 '안에'보다 한국어 지명 열거에서의 간결한 표현이 더 적절합니다.
- source_word: וּ/בְ/עֶצֶם
  english_pob_choice: and in Ezem
  chosen_korean: 에셈
  alternatives_korean:
  - 그리고 에셈
  - 에셈에
  - 에셈에서
  lexicon: HALOT
  rationale: עֶצֶם은 이 구절에서 지명으로 기능하므로 음역을 따랐습니다. 앞뒤 문맥상 반복되는 전치사는 한국어에서 모두 드러내기보다 목록형 표현으로 자연스럽게 처리했습니다.
- source_word: וּ/בְ/תוֹלָד
  english_pob_choice: and in Tolad
  chosen_korean: 돌랏
  alternatives_korean:
  - 그리고 돌랏
  - 돌랏에
  - 돌랏에서
  lexicon: HALOT
  rationale: תוֹלָד 역시 지명이라 음역으로 옮겼습니다. 한국어 독자가 목록의 연속성을 바로 이해하도록 쉼표로 열거하고, 별도의 동사는 넣지 않았습니다.
theological_decisions:
- issue: 지명 목록에서 히브리어 ב 전치사의 처리
  chosen_reading: 한국어에서는 '그리고 …'의 열거로 옮겨 장소성은 지명 목록 자체가 전달하도록 했습니다.
  alternative_readings:
  - 각 항목을 '…에' 또는 '…에서'로 반복해 옮기는 방식
  - 영어 POB처럼 '안에'를 반영하는 방식
  rationale: 이 구절은 신학적 쟁점보다 지명 나열의 간결성과 지형적 목록성에 초점이 있으므로, 한국어에서 과도한 전치사 반복을 피하는 것이 원문 의도를 더 선명하게 전달합니다.
  doctrine_reference: 본문-문법적 관찰
