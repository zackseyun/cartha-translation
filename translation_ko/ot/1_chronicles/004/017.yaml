  text: וּ/בֶן עֶזְרָ֔ה יֶ֥תֶר וּ/מֶ֖רֶד וְ/עֵ֣פֶר וְ/יָל֑וֹן וַ/תַּ֨הַר֙ אֶת מִרְיָ֣ם וְ/אֶת שַׁמַּ֔י וְ/אֶת יִשְׁבָּ֖ח אֲבִ֥י אֶשְׁתְּמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'And the son of Ezrah.' Because several names follow, the phrase is commonly understood collectively as 'the sons of Ezrah.'
    reason: textual_variant
  - marker: b
    text: The Hebrew says only 'and she conceived'; the woman is not identified in this clause.
    reason: lexical_alternative
  - marker: c
    text: Or 'the founder of Eshtemoa,' if Eshtemoa is understood as a clan or settlement rather than an individual.
    reason: lexical_alternative
translation:
  language: ko
  text: 에스라의 아들들은 예델과 메렛과 에벨과 야론이었으며, 그 여자는 미리암과 삼매와 이스바를 낳았는데, 그가 에스드모아의 아버지였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘에스라의 아들’이지만, 뒤에 여러 이름이 이어지므로 보통은 집합적으로 ‘에스라의 아들들’로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 단지 ‘그 여자가 잉태하였다’고만 말하며, 이 절에서는 그 여자의 이름을 밝히지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘에스드모아의 창시자’로 볼 수 있습니다. 에스드모아를 씨족이나 성읍으로 이해할 때 가능한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 아들이
  - 그리고 아들
  lexicon: HALOT
  rationale: 히브리어 본문은 단수형이지만 뒤에 여러 이름이 이어지므로, 문맥상 족보 표제인 복수로 자연스럽게 옮겼습니다. 다만 본문의 단수 형식은 본문 주석에서 드러나도록 했습니다.
- source_word: וַתַּהַר
  english_pob_choice: and she conceived
  chosen_korean: 그 여자는 …을 낳았는데
  alternatives_korean:
  - 그녀가 잉태하였고
  - 그녀가 임신하였고
  lexicon: HALOT
  rationale: 히브리어 הרה는 ‘잉태하다/임신하다’가 핵심이지만, 바로 뒤에 자녀 이름들이 이어지는 족보 문맥에서는 한국어로 ‘낳았다’가 결과를 더 자연스럽게 전달합니다. 다만 원문의 ‘conceive’ 의미를 지나치게 풀지 않도록 최소한의 서술로 유지했습니다.
- source_word: מִרְיָם
  english_pob_choice: Miriam
  chosen_korean: 미리암
  alternatives_korean:
  - 마리아
  - 미리엄
  lexicon: 고유명사 표기 관행
  rationale: 본문의 고유명사는 현대 외래어 표기 관행과 기존 성경 용례에 따라 미리암으로 옮겼습니다.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  english_pob_choice: the father of Eshtemoa
  chosen_korean: 에스드모아의 아버지
  alternatives_korean:
  - 에스드모아의 창시자
  - 에스드모아의 시조
  lexicon: HALOT
  rationale: אָבִי는 족보 문맥에서 실제 부친일 수도, 씨족이나 성읍의 시조일 수도 있어 본문 표현을 그대로 살렸습니다. 해석적 대안인 ‘창시자/시조’는 본문 주석으로 남기는 편이 더 투명합니다.
theological_decisions:
- issue: 족보의 성별 표지와 서술 주체
  chosen_reading: 본문은 ‘그 여자’로 직접 드러내어, 이름이 생략된 여성의 잉태를 서술하는 형태로 유지했습니다.
  alternative_readings:
  - 암시된 여성의 이름을 보충해 번역
  - 무성(중성적) 표현으로 완화
  rationale: 히브리어는 주체를 명시하지 않으므로, 한국어도 본문에 없는 이름을 보충하지 않고 노출된 형태를 유지하는 것이 더 충실합니다.
  doctrine_reference: 본문 충실성 원칙
- issue: 에스드모아의 ‘아버지’
  chosen_reading: ‘아버지’를 그대로 두어 혈연 의미와 씨족/창시자 의미의 긴장을 보존했습니다.
  alternative_readings:
  - ‘창시자’로 해석해 번역
  - ‘시조’로 풀이
  rationale: 족보 본문에서는 אָב가 문자적 부친이면서도 집단의 기원 인물을 뜻할 수 있어, 해석을 확정하지 않고 열어 두는 번역이 적절합니다.
  doctrine_reference: 어휘의 다의성 보존
