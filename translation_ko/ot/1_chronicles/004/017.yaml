  source_fidelity: 원문의 여성 단수 동사 וַתַּהַר는 ‘낳았다’가 아니라 ‘잉태하였다’이므로, 결과를 뜻하는 ‘낳았는데’로 옮긴 현행 본문은 어휘적 의미를 바꿉니다. 또한 ‘그가’는 바로 앞의 여성 주어와 불일치하며, 이스바가 에스드모아의 아버지라는 수식 관계가 한국어에서 분명히 드러나야 합니다. 고유명사도 히브리어 음가 및 한국어 성경의 통용 표기에 맞추어 예델, 메렛, 에벨, 얄론으로 바로잡는 것이 안전합니다.
