  terminology: ‘아버지’는 אָבִי의 혈연·시조/창시자 가능성을 본문에서 확정하지 않고 보존합니다. 각주에서만 ‘창시자’를 문맥적 대안으로 제시합니다. 단수형 ‘아들’이 복수 목록의 표제로 기능하는 문제와 미확인 여성 주어도 각각 해당 위치에 각주를 답니다.
