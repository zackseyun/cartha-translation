  - 그리고 ~의 아들들은
  lexicon: HALOT
  rationale: 족보 서두의 בְנֵי는 직역해 “아들들”로 옮기는 것이 가장 직접적이며, 첫 항목은 한국어 흐름상 접속사를 생략하고 둘째 항목은 원문의 ו를 살려 “그리고”를 넣었습니다.
- source_word: בֶּן חָנָן
  english_pob_choice: Ben-Hanan
  chosen_korean: 벤하난
  alternatives_korean:
  - 한난의 아들
  - 벤한난
  lexicon: HALOT
  rationale: 족보 목록 안에서 기능하는 이름이므로 친자 관계 문장으로 풀지 않고 음역형 고유명사로 처리했습니다.
- source_word: וְרִנָּה
  english_pob_choice: Rinnah
  chosen_korean: 린나
  alternatives_korean:
  - 리나
  - 린하
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 감각에 따라 일관되게 음역했습니다.
- source_word: וְתוֹלוֹן
  english_pob_choice: Tilon
  chosen_korean: 틸론
  alternatives_korean:
  - 톨론
  - 토론
  lexicon: HALOT
  rationale: 영어 POB의 음역을 따라 고유명사로 처리했고, 한국어 표기에서는 자음군과 모음값을 반영해 틸론으로 옮겼습니다.
- source_word: וּבֶן זוֹחֵת
  english_pob_choice: Ben-Zoheth
  chosen_korean: 벤조핫
  alternatives_korean:
  - 조핫의 아들
  - 벤조헷
  lexicon: HALOT
  rationale: 여기서도 족보 목록의 이름으로 읽는 것이 자연스러우므로 ‘아들’로 풀지 않고 결합형 이름으로 옮겼습니다.
theological_decisions:
- issue: 족보에서의 בֶּן 구조를 이름으로 볼지 친자 관계로 볼지
  chosen_reading: 이 구절의 בֶּן חָנָן과 בֶּן זוֹחֵת은 각각 ‘벤하난’, ‘벤조핫’이라는 고유명사로 처리했습니다.
  alternative_readings:
  - ‘한난의 아들’
  - ‘조핫의 아들’
  rationale: 영어 POB가 주석에서 밝혔듯 족보 문맥에서는 친자 서술보다 이름 자체로 이해하는 편이 문맥과 목록 구조를 더 잘 보존합니다.
  doctrine_reference: 본문-문맥 우선의 족보 해석
