  - 그리고 ~의 아들들은
  lexicon: HALOT
  rationale: 족보 서두의 בְנֵי는 직역해 “아들들”로 옮기는 것이 가장 직접적이며, 첫 항목은 한국어 흐름상 접속사를 생략하고 둘째 항목은 원문의 ו를 살려 “그리고”를 넣었습니다.
