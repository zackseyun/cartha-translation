  chosen_korean: 벤하난
  alternatives_korean:
  - 한난의 아들
  - 벤한난
  lexicon: HALOT
  rationale: 족보 목록 안에서 기능하는 이름이므로 친자 관계 문장으로 풀지 않고 음역형 고유명사로 처리했습니다.
- source_word: וְרִנָּה
