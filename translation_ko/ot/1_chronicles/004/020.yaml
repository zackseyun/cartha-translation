  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
  footnotes:
  - marker: a
    text: Or, 'Ben-Hanan' could be understood as 'the son of Hanan,' though in this genealogical list it is likely a personal name.
    reason: lexical_alternative
  - marker: b
