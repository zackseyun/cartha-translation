  terminology: 고유명사는 원어 음가와 영어 POB의 음역 원칙을 따라 시몬, 암논, 린나, 벤하난, 틸론, 이시, 조헷, 벤조헷으로 통일했습니다. ‘벤하난’과 ‘벤조헷’은 본문에서는 인명으로 유지하되, 가능한 대안 해석은 각 해당 이름에 각주로 제시합니다.
