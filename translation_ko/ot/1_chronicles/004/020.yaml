  source_fidelity: 히브리어 זֹוחֵת(zōḥēṯ)는 영어 POB의 ‘Zoheth’와도 일치하게 ‘조헷’으로 옮기는 것이 적절합니다. 초안의 ‘조핫’은 모음값이 맞지 않습니다. 또한 חָנָן은 ‘하난’으로 음역하는 것이 자연스럽습니다.
