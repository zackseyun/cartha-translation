translation:
  language: ko
  text: 시몬의 아들들은 암논과 린나, 벤하난[a]과 틸론입니다. 그리고 이시의 아들들은 조헷과 벤조헷[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벤하난’은 ‘하난의 아들’로 이해할 수 있습니다. 다만 이 족보 목록에서는 인명일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벤조헷’은 ‘조헷의 아들’로 이해할 수 있습니다. 다만 이 족보 목록에서는 인명일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of / And the sons of
  chosen_korean: ~의 아들들은 / 그리고 ~의 아들들은
  alternatives_korean:
