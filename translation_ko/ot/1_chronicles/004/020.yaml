  lexicon: HALOT
  rationale: 여기서도 족보 목록의 이름으로 읽는 것이 자연스러우므로 ‘아들’로 풀지 않고 결합형 이름으로 옮겼습니다.
theological_decisions:
- issue: 족보에서의 בֶּן 구조를 이름으로 볼지 친자 관계로 볼지
  chosen_reading: 이 구절의 בֶּן חָנָן과 בֶּן זוֹחֵת은 각각 ‘벤하난’, ‘벤조핫’이라는 고유명사로 처리했습니다.
  alternative_readings:
  - ‘한난의 아들’
  - ‘조핫의 아들’
  rationale: 영어 POB가 주석에서 밝혔듯 족보 문맥에서는 친자 서술보다 이름 자체로 이해하는 편이 문맥과 목록 구조를 더 잘 보존합니다.
  doctrine_reference: 본문-문맥 우선의 족보 해석
