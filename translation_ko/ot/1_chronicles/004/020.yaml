  - 린하
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 감각에 따라 일관되게 음역했습니다.
- source_word: וְתוֹלוֹן
  english_pob_choice: Tilon
  chosen_korean: 틸론
  alternatives_korean:
