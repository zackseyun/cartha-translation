  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
  footnotes:
  - marker: a
    text: The name שְׂרָיָה is often rendered 'Seraiah' in English versions; some may prefer the fuller spelling 'Seraiah.'
