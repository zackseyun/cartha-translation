translation:
  language: ko
  text: 그나스의 아들은 옷니엘과 스라야이며, 옷니엘의 아들은 하닷입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 그리고 아들들은
  - 자손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בֵּן의 복수형은 한국어로 가장 자연스럽고 투명하게 ‘아들들’로 옮겼습니다. 첫 문장의 앞접속사는 한국어에서는 별도 ‘그리고’ 없이 매끄럽게 처리했습니다.
- source_word: קְנַז
  english_pob_choice: Kenaz
  chosen_korean: 그니스
  alternatives_korean:
  - 게나스
  - 케나스
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 옮겼습니다. 영어 POB의 Kenaz에 대응하는 히브리어 인명입니다.
- source_word: עָתְנִיאֵל
  english_pob_choice: Othniel
  chosen_korean: 오드니엘
  alternatives_korean:
  - 옷니엘
  - 오드니엘
  lexicon: HALOT
  rationale: 고유명사는 널리 통용되는 성서 인명 음역을 따랐습니다.
- source_word: וּשְׂרָיָה
  english_pob_choice: Seraiah
  chosen_korean: 세라야
  alternatives_korean:
  - 스라야
  - 세라야
  lexicon: HALOT
  rationale: 히브리어 자음형에 대응하는 인명 음역을 사용했습니다. 영어 POB가 지적한 것처럼 더 긴 관용 철자형이 있을 수 있지만, 본문 형태에 더 직접적으로 맞는 음역을 택했습니다.
- source_word: חֲתַת
  english_pob_choice: Hathath
  chosen_korean: 하닷
  alternatives_korean:
  - 하닷
  - 하다스
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 옮겼습니다. 히브리어 인명에 대한 표준적 음가를 반영했습니다.
