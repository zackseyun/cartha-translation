  rationale: 족보 문맥에서 בֵּן의 복수형은 한국어로 가장 자연스럽고 투명하게 ‘아들들’로 옮겼습니다. 첫 문장의 앞접속사는 한국어에서는 별도 ‘그리고’ 없이 매끄럽게 처리했습니다.
