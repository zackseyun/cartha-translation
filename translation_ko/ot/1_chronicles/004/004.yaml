  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
  footnotes:
  - marker: a
    text: Hebrew 'father of' in this genealogical context may also mean 'founder of' or 'ancestor of,' especially in relation to towns or clans.
    reason: lexical_alternative
  - marker: b
    text: '''Penuel'' is spelled ''Peniel'' in some other passages; this reflects a variant form of the same name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 브누엘[a]은 그돌의 아버지이며, 에셀은 후사의 아버지입니다[b]—이들은 에브랏의 첫아들 후르의 아들들인데, 그는 베들레헴의 아버지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보 문맥의 히브리어 ‘~의 아버지’는 경우에 따라 ‘시조’나 ‘창립자’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘브누엘’은 다른 본문들에서는 ‘베니엘’로도 철자되며, 같은 이름의 변형형입니다.
    reason: lexical_alternative
