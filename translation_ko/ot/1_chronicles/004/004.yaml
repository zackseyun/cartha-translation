    issue: 후르를 가리키는 ‘그는’의 선행사가 모호합니다.
    rationale: 원문 끝의 ‘베들레헴의 아버지’는 후르를 수식합니다. 한국어에서는 바로 앞에 ‘아들들’이 있어 대명사 ‘그는’이 후르가 아닌 다른 대상처럼 읽힐 수 있으므로 이름을 반복해야 합니다.
  - severity: medium
    issue: 문장 종결과 접속 구성이 부자연스럽습니다.
    rationale: ‘브누엘은 …이며, 에셀은 …입니다’는 서술 종결이 병렬되지 않으며, ‘아들들인데’는 원문의 등위적 계보 진술에 없는 종속·대조의 뉘앙스를 더합니다.
  - severity: low
    issue: 각주 b의 표지가 에셀 뒤에 놓여 있습니다.
    rationale: 각주 내용은 브누엘/베니엘이라는 이름의 이형을 설명하므로 브누엘 뒤에 붙어야 합니다.
  revised_text: 브누엘[a], 곧 그돌의 아버지와 에셀, 곧 후사의 아버지—이들은 베들레헴의 아버지인 에브라다의 맏아들 후르의 아들들입니다.
  revised_footnotes:
  - marker: a
    text: 족보 문맥의 히브리어 ‘~의 아버지’는 경우에 따라 ‘시조’나 ‘창립자’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
