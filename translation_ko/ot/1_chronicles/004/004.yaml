theological_decisions:
- issue: 족보에서의 אֲבִי(아버지)의 의미
  chosen_reading: ‘아버지’는 단순 생물학적 부친뿐 아니라 족보·지명 문맥에서 조상, 시조, 또는 창립자를 가리킬 수 있는 표현으로 유지했습니다.
  alternative_readings:
  - 시조
  - 창시자
  - 조상
  rationale: 영어 POB 주석이 지적하듯 이 관용구는 읍락이나 씨족과 관련될 때 의미 범위가 넓습니다. 본문에서는 원문 관용을 보존하고, 해석 여지를 없애지 않도록 직역형을 택했습니다.
  doctrine_reference: 족보·지명 표지의 문맥적 다의성
