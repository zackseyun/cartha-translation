base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
  footnotes:
  - marker: a
    text: Hebrew 'father of' in this genealogical context may also mean 'founder of' or 'ancestor of,' especially in relation to towns or clans.
    reason: lexical_alternative
  - marker: b
    text: '''Penuel'' is spelled ''Peniel'' in some other passages; this reflects a variant form of the same name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 브누엘[a]은 그돌의 아버지이며, 에셀은 후사의 아버지입니다[b]—이들은 에브랏의 첫아들 후르의 아들들인데, 그는 베들레헴의 아버지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보 문맥의 히브리어 ‘~의 아버지’는 경우에 따라 ‘시조’나 ‘창립자’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘브누엘’은 다른 본문들에서는 ‘베니엘’로도 철자되며, 같은 이름의 변형형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  english_pob_choice: Penuel
  chosen_korean: 브누엘
  alternatives_korean:
  - 페누엘
  - 피누엘
  lexicon: HALOT
  rationale: 고유명사는 음역으로 옮기되, 자음 형태에 맞춘 본문형을 반영했습니다. 영어 POB의 Penuel에 해당하는 이름을 한국어 음역으로 자연스럽게 옮겼습니다.
- source_word: אֲבִי
  english_pob_choice: the father of
  chosen_korean: 아버지입니다
  alternatives_korean:
  - ~의 아버지
  - ~의 기원입니다
  - ~의 창시자입니다
  lexicon: HALOT
  rationale: 족보 문맥의 관용구를 살려 직역하되, 한국어에서는 소유격 표현보다 서술형이 자연스러워 ‘아버지입니다’로 정리했습니다.
- source_word: בְנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보의 기본 구조를 보존하기 위해 ‘아들들’을 유지했습니다. 보다 넓은 의미의 ‘후손들’도 가능하지만 원문 표지를 살리는 쪽을 택했습니다.
- source_word: בְּכֹר
  english_pob_choice: the firstborn of
  chosen_korean: 첫아들
  alternatives_korean:
  - 장자
  - 맏아들
  lexicon: HALOT
  rationale: ‘첫아들’은 원문의 관계와 위계를 분명히 드러내면서도 현대 한국어에서 자연스럽습니다. ‘장자’는 다소 고전적이며, ‘맏아들’보다 계보적 서술에 덜 간결합니다.
theological_decisions:
- issue: 족보에서의 אֲבִי(아버지)의 의미
  chosen_reading: ‘아버지’는 단순 생물학적 부친뿐 아니라 족보·지명 문맥에서 조상, 시조, 또는 창립자를 가리킬 수 있는 표현으로 유지했습니다.
  alternative_readings:
  - 시조
  - 창시자
  - 조상
  rationale: 영어 POB 주석이 지적하듯 이 관용구는 읍락이나 씨족과 관련될 때 의미 범위가 넓습니다. 본문에서는 원문 관용을 보존하고, 해석 여지를 없애지 않도록 직역형을 택했습니다.
  doctrine_reference: 족보·지명 표지의 문맥적 다의성
