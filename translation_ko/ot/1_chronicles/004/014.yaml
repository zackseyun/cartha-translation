source:
  edition: WLC
  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
  footnotes:
  - marker: a
    text: Ge-harashim likely means 'Valley of Craftsmen.' The Hebrew preserves it as a place-name while the following clause explains the name.
    reason: lexical_alternative
  - marker: b
    text: Or 'the founder of Ge-harashim.' The expression 'father of' can denote a founder or ancestral head in genealogical contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 므오노대가 오브라를 낳았고, 스라야가 게하라심[a]의 아버지인[b] 요압을 낳았습니다. 이는 그들이 장인들이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘게하라심’은 문자적으로 ‘장인들의 골짜기’라는 뜻일 가능성이 크지만, 여기서는 지명으로 남겨 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아버지’는 혈연관계뿐 아니라 어떤 집단이나 지역의 ‘시조’ 또는 ‘창시자’를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  english_pob_choice: Meonothai
  chosen_korean: 므온노대
  alternatives_korean:
  - 메오노타이
  - 므온타이
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 한국어 음운에 맞게 옮겨 이름으로서의 기능을 유지했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았고
  alternatives_korean:
  - 아버지가 되었고
  - 생산했고
  lexicon: HALOT
  rationale: 계보 문맥의 ילד 히필은 친족 관계의 형성/출생을 나타내므로, 현대 한국어에서는 간결한 ‘낳다’가 가장 자연스럽고 원문의 계보적 힘을 살립니다.
- source_word: אֲבִי
  english_pob_choice: the father of
  chosen_korean: 아버지
  alternatives_korean:
  - 창시자
  - 조상
  lexicon: HALOT
  rationale: 문맥상 단순 생물학적 아버지라기보다 ‘기럇하라심과 연결된 계통의 머리’라는 의미를 담을 수 있어, 본문에는 원형을 살리되 한국어 독자에게도 자연스럽게 ‘아버지’로 두었습니다.
- source_word: גֵּיא חֲרָשִׁים
  english_pob_choice: Ge-harashim
  chosen_korean: 기럇하라심
  alternatives_korean:
  - 게하라심
  - 장인들의 골짜기
  lexicon: HALOT
  rationale: 본문은 지명으로 고정된 표현을 유지하면서 뒤의 설명절이 이름의 뜻을 풀어 주므로, 본문에서는 지명성을 살려 음역하고 설명절로 의미를 드러냈습니다.
- source_word: חֲרָשִׁים
  english_pob_choice: craftsmen
  chosen_korean: 장인들이었습니다
  alternatives_korean:
  - 공예가들이었습니다
  - 기술자들이었습니다
  lexicon: HALOT
  rationale: חרשים는 목수·금속공 포함의 넓은 ‘숙련된 일꾼’ 범위를 가질 수 있으므로, 지나치게 좁히지 않는 ‘장인’이 적절합니다.
theological_decisions:
- issue: 지명 설명의 처리
  chosen_reading: 본문의 ‘기럇하라심’을 지명으로 두고, 뒤의 이유절 ‘그들은 장인들이었습니다’로 이름의 뜻을 설명했습니다.
  alternative_readings:
  - ‘장인의 골짜기’처럼 본문에서 번역하기
  - 지명 없이 의미만 풀어쓰기
  rationale: 히브리어는 지명과 설명절을 함께 사용해 말장난/어원 설명을 이루므로, 둘을 모두 보존하는 편이 저자의 의도를 가장 잘 전달합니다.
  doctrine_reference: 본문 주해/어휘 선택
