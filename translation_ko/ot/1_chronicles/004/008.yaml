translation:
  language: ko
  text: 고스는 아눕과 하조베바와 아하르헬의 가족들—곧 하룸의 아들들을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하조베바’는 영어 POB의 ‘Hazzobebah’처럼 정관사 흔적을 반영하지 않은 음역입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘가족들’은 족보 문맥의 משפחות를 옮긴 것으로, 경우에 따라 ‘씨족들’로도 옮길 수 있습니다.
