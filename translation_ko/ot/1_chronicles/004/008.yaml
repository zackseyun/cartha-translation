theological_decisions:
- issue: 족보 항목의 관계를 어떻게 문장으로 드러낼지
  chosen_reading: ‘아하르헬의 가족들—곧 하룸의 아들들’을 한 흐름으로 읽히게 하여, 족보적 귀속 관계를 분명히 했습니다.
  alternative_readings:
  - ‘아하르헬과 하룸의 가족들’처럼 더 직역적인 배열
  - ‘아하르헬, 하룸의 아들들의 가족들’처럼 어색한 직순열
  rationale: 히브리어는 계보 정보를 압축적으로 제시하므로, 한국어에서는 의미 관계를 자연스럽게 풀어 주되 정보는 추가하지 않는 방식이 적절합니다.
