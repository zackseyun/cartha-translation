translation:
  language: ko
  text: 고스는 아눕과 하조베바[a]와 하룸의 아들 아하르헬의 가족들[b]을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하조베바’는 히브리어 표기에 있는 정관사 הַ의 흔적을 반영한 음역입니다. 이를 음역에 반영하지 않으면 ‘조베바’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘가족들’은 족보 문맥의 מִשְׁפְּחוֹת를 옮긴 것으로, ‘씨족들’로도 옮길 수 있습니다.
    reason: lexical_alternative
