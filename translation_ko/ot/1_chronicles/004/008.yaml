theological_decisions:
- issue: 족보 항목의 관계를 어떻게 문장으로 드러낼지
  chosen_reading: ‘아하르헬의 가족들—곧 하룸의 아들들’을 한 흐름으로 읽히게 하여, 족보적 귀속 관계를 분명히 했습니다.
  alternative_readings:
