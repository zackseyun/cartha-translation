  - ‘아하르헬, 하룸의 아들들의 가족들’처럼 어색한 직순열
  rationale: 히브리어는 계보 정보를 압축적으로 제시하므로, 한국어에서는 의미 관계를 자연스럽게 풀어 주되 정보는 추가하지 않는 방식이 적절합니다.
  doctrine_reference: 족보 본문 해석 원칙
