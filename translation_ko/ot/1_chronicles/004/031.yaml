base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
  footnotes:
  - marker: a
    text: Beth-marcaboth may be rendered more literally as “House of Chariots,” but here it is treated as a place name.
    reason: lexical_alternative
  - marker: b
    text: Hazar-susim may be rendered more literally as “Court of Horses” or “Village of Horses,” but here it is treated as a place name.
    reason: lexical_alternative
  - marker: c
    text: Beth-biri may also be spelled “Beth-birei” in English transliteration.
    reason: alternative_reading
  - marker: d
    text: Shaaraim may reflect an etymological sense like “Two Gates,” but here it is treated as a place name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 벧마르카봇[a], 하살수심[b], 벧비리[c], 사아라임[d]에 있었습니다. 이들은 다윗이 다스릴 때까지 그들의 성읍이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벧마르카봇은 문자적으로는 “전차들의 집”으로 옮길 수 있지만, 여기서는 지명으로 처리했습니다.
    reason: lexical_alternative
  - marker: b
    text: 하살수심은 문자적으로는 “말들의 뜰” 또는 “말들의 마을”로 옮길 수 있지만, 여기서는 지명으로 처리했습니다.
    reason: lexical_alternative
  - marker: c
    text: 벧비리는 영어 전사상 Beth-biri로도, Beth-birei로도 적힐 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 사아라임은 어원상 “두 문”이라는 뜻을 떠올리게 하지만, 여기서는 지명으로 처리했습니다.
    reason: lexical_alternative
