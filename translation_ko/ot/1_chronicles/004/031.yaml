theological_decisions:
- issue: 시간 종결절 עַד מְלֹךְ דָּוִיד의 한국어 처리
  chosen_reading: ‘다윗이 다스릴 때까지’로 옮겨, 왕위 즉위의 시점보다 통치가 시작되는 전환점을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 다윗이 통치할 때까지
  - 다윗이 왕이 될 때까지
  - 다윗의 통치까지
  rationale: 히브리어의 시간 경계 표현을 한국어에서 가장 간결하고 과도한 해석 없이 전달하는 방식입니다.
  doctrine_reference: 역사 서술의 시간표현
