base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
  footnotes:
  - marker: a
    text: Or 'their villages.' The Hebrew term can refer to smaller settlements or enclosed habitations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 정착지는 에담, 아인, 림몬, 토켄, 아산이었으니—다섯 도시였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 마을들’. 히브리어 용어는 더 작은 정착지나 울타리로 둘러싸인 거주지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חַצְרֵי/הֶם
  english_pob_choice: their settlements
  chosen_korean: 그들의 정착지
  alternatives_korean:
  - 그들의 마을
  - 그들의 촌락
  - 그들의 울타리 안 거주지
  lexicon: HALOT
  rationale: חָצֵר는 마을, 거주지, 울타리 안의 정착지를 가리킬 수 있으므로, 목록 문맥에서 규모를 과도하게 좁히지 않는 ‘정착지’가 가장 무난합니다.
- source_word: עֵיטָם / עַיִן / רִמּוֹן / תֹכֶן / עָשָׁן
  english_pob_choice: Etam / Ain / Rimmon / Tochen / Ashan
  chosen_korean: 에담 / 아인 / 림몬 / 토켄 / 아산
  alternatives_korean:
  - 에탐 / 아이인 / 림몬 / 토켄 / 아산
  - 에담 / 아인 / 림몬 / 토켄 / 아산
  lexicon: 고유명사 음역
  rationale: 본문의 지명들은 번역이 아니라 음역이 필요하므로, 현대 외래어 표기 원칙에 따라 한국어 독자가 읽기 쉬운 형태로 옮겼습니다.
- source_word: עָרִים חָמֵשׁ
  english_pob_choice: five cities
  chosen_korean: 다섯 도시
  alternatives_korean:
  - 다섯 성읍
  - 다섯 마을
  lexicon: HALOT
  rationale: עִיר는 기본적으로 도시/성읍을 뜻하므로, 영어 POB의 ‘cities’를 따라 요약 진술을 한국어에서도 ‘도시’로 살렸습니다.
theological_decisions:
- issue: 지명 목록의 기능
  chosen_reading: 이 절은 신학적 진술보다 유다 지파 계보/지리 목록의 요약으로 읽어, 설명을 덧붙이지 않고 단순 목록과 총계를 유지했습니다.
  alternative_readings:
  - 상징적 의미를 암시하는 방식
  - 지명을 풀어 설명하는 방식
  rationale: 히브리어 원문은 지명 나열과 숫자 집계만 제공하므로, 본문이 말하지 않는 상징화를 피하는 것이 더 충실합니다.
  doctrine_reference: 성경 해석의 문법적-역사적 읽기 원칙
