    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חַצְרֵי/הֶם
  english_pob_choice: their settlements
  chosen_korean: 그들의 정착지
  alternatives_korean:
  - 그들의 마을
  - 그들의 촌락
  - 그들의 울타리 안 거주지
  lexicon: HALOT
  rationale: חָצֵר는 마을, 거주지, 울타리 안의 정착지를 가리킬 수 있으므로, 목록 문맥에서 규모를 과도하게 좁히지 않는 ‘정착지’가 가장 무난합니다.
