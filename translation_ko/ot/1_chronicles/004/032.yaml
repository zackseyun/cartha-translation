  english_pob_choice: Etam / Ain / Rimmon / Tochen / Ashan
  chosen_korean: 에담 / 아인 / 림몬 / 토켄 / 아산
  alternatives_korean:
  - 에탐 / 아이인 / 림몬 / 토켄 / 아산
  - 에담 / 아인 / 림몬 / 토켄 / 아산
  lexicon: 고유명사 음역
  rationale: 본문의 지명들은 번역이 아니라 음역이 필요하므로, 현대 외래어 표기 원칙에 따라 한국어 독자가 읽기 쉬운 형태로 옮겼습니다.
- source_word: עָרִים חָמֵשׁ
  english_pob_choice: five cities
  chosen_korean: 다섯 도시
  alternatives_korean:
