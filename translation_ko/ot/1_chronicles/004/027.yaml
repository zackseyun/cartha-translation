source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
  footnotes:
  - marker: a
    text: Or, 'did not become as numerous as the sons of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시므이에게는 아들 열여섯 명과 딸 여섯 명이 있었고, 그의 형제들에게는 아들들이 많지 않았으며, 그들의 모든 종족은 유다의 자손만큼 번성하지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “유다의 자손만큼 많아지지 못했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  english_pob_choice: Shimei had
  chosen_korean: 시므이에게는 …이 있었고
  alternatives_korean:
  - 시므이가 …를 두었고
  - 시므이에게는 …가 있었으며
  lexicon: HALOT
  rationale: 족보 문맥의 ל는 소유·존재를 나타내므로, 한국어에서는 ‘시므이에게는’으로 자연스럽게 풀어 존재/소유를 함께 드러냈습니다.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר / וּבָנוֹת שֵׁשׁ
  english_pob_choice: sixteen sons and six daughters
  chosen_korean: 아들 열여섯 명과 딸 여섯 명
  alternatives_korean:
  - 열여섯 아들과 여섯 딸
  - 아들 열여섯과 딸 여섯
  lexicon: HALOT
  rationale: 히브리어의 수사-명사 결합을 한국어 어순에 맞게 재배열하되, 자녀의 성별과 수량을 그대로 보존했습니다.
- source_word: מִשְׁפַּחְתָּם
  english_pob_choice: all their clans
  chosen_korean: 그들의 모든 종족
  alternatives_korean:
  - 그들의 모든 가족
  - 그들의 모든 집안
  lexicon: HALOT
  rationale: 족보 목록에서 מִשְׁפָּחָה는 현대적 ‘가족’보다 혈연 집단인 ‘종족/씨족’에 가깝기 때문에 그 범주를 살렸습니다.
- source_word: לֹא הִרְבּוּ עַד בְּנֵי יְהוּדָה
  english_pob_choice: did not multiply as much as the sons of Judah
  chosen_korean: 유다의 자손만큼 번성하지 못했습니다
  alternatives_korean:
  - 유다의 자손만큼 많아지지 못했습니다
  - 유다의 자손에 이르도록 번성하지 못했습니다
  lexicon: HALOT
  rationale: הִרְבּוּ는 수적 증가를 뜻하므로 ‘번성하다’로 옮겼고, עַד는 비교의 기준을 나타내므로 ‘만큼’으로 자연스럽게 표현했습니다.
