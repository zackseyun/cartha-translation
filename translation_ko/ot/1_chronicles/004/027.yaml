  terminology: 인명 ‘시므이’, 족보 표현 ‘유다의 자손’, 집단 명칭 ‘종족’이 일관되고 적절합니다. ‘번성하다’는 여기서 수적 증가라는 문맥상 의미로 이해될 수 있으며, 각주가 더 직설적인 대안을 제공합니다.
