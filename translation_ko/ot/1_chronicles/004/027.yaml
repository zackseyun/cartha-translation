  source_fidelity: 히브리어 족보식 소유·존재 구문을 ‘시므이에게는 …이 있었고’로 적절히 옮겼습니다. 아들 열여섯 명과 딸 여섯 명의 수량, 형제들에게 아들이 많지 않았다는 진술, 그리고 그들의 종족이 유다 자손의 수에 이르지 못했다는 비교가 모두 보존되었습니다.
