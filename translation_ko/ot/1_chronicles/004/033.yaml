  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
  footnotes:
  - marker: a
    text: Or 'their hamlets' or 'their settlements' for 'their villages.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and they enrolled themselves by genealogy'; the Hebrew expression refers to genealogical registration.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 도시들 주변에 있던 그들의 모든 마을은 바알까지 이르렀습니다. 이것들이 그들의 거주지였고, 그들은 족보에 따라 등록되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַצְרֵיהֶם
  english_pob_choice: their villages
  chosen_korean: 그들의 모든 마을
  alternatives_korean:
  - 그들의 모든 촌락
  - 그들의 모든 정착지
  - 그들의 뜰들
  lexicon: HALOT
  rationale: חָצֵר는 문맥에 따라 뜰, 울타리, 마을을 뜻할 수 있는데, 여기서는 도시들 주변의 거주지를 가리키므로 ‘마을’이 가장 자연스럽고 정확합니다.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  english_pob_choice: that were around these cities
  chosen_korean: 이 도시들 둘레에 있는
  alternatives_korean:
  - 이 도시들 주위에 있는
  - 이 도시들 주변에 있는
  - 이 도시들 곁에 있는
  lexicon: HALOT
  rationale: 관계절은 앞선 마을들의 위치를 설명하므로 ‘둘레에 있는’으로 공간 관계를 분명하게 살렸습니다.
- source_word: עַד בָּעַל
  english_pob_choice: as far as Baal
  chosen_korean: 바알까지 이어졌습니다
  alternatives_korean:
  - 바알까지였습니다
  - 바알에 이르기까지였습니다
  - 바알까지 펼쳐졌습니다
  lexicon: HALOT
  rationale: עַד는 경계나 도달점을 나타내므로, 지리적 범위를 보여 주는 ‘바알까지’로 옮겼습니다. 동사성 표현은 한국어 흐름에 맞게 보완했습니다.
- source_word: מוֹשְׁבֹתָם
  english_pob_choice: their settlements
  chosen_korean: 그들의 거주지
  alternatives_korean:
  - 그들의 정착지
  - 그들의 살 곳
  - 그들의 거처
  lexicon: HALOT
  rationale: מוֹשָׁב은 거주처, 정착지를 뜻하므로 행정·지리 문맥에 맞게 ‘거주지’로 옮겼습니다.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  english_pob_choice: and they had their genealogy recorded
  chosen_korean: 그들의 족보가 기록되었습니다
  alternatives_korean:
  - 그들의 족보 등록이 있었습니다
  - 그들은 족보로 등록되었습니다
  - 그들의 계보가 그들에게 속해 있었습니다
  lexicon: HALOT
  rationale: 히트파엘형 יחס는 족보에 따라 등록되거나 계보가 기록되는 뜻이므로, POB의 audit trail에 맞춰 ‘족보가 기록되었습니다’로 자연스럽게 표현했습니다.
