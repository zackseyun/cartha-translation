- from: 그리고 그들의 모든 마을, 곧 이 도시들 둘레에 있는 마을들이 바알까지 이어졌습니다. 이것이 그들의 거주지였고, 그들의 족보가 기록되었습니다.
  to: 이 도시들 주변에 있던 그들의 모든 마을은 바알까지 이르렀습니다. 이것들이 그들의 거주지였고, 그들은 족보에 따라 등록되었습니다.
