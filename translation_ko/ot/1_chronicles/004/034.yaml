translation:
  language: ko
  text: 그리고 메쇼밥과 야믈렉과 아마시야의 아들 요사입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מְשׁוֹבָ֣ב
  english_pob_choice: Meshobab
  chosen_korean: 메솹밥
  alternatives_korean:
  - 메쇼밥
  - 메쇼바브
  lexicon: 고유명사
  rationale: 고유명사는 번역하지 않고 음역하되, 히브리어 자음과 모음값을 반영해 한국어에서 읽기 자연스러운 형태로 옮겼습니다.
- source_word: וְ/יַמְלֵ֔ךְ
  english_pob_choice: Jamlech
  chosen_korean: 야믈렉
  alternatives_korean:
  - 자믈렉
  - 야말렉
  lexicon: 고유명사
  rationale: 영어 POB의 Jamlech는 yod 기반 이름을 관행적으로 J로 옮긴 형태이므로, 원어 발음을 더 직접 반영하는 야-로 시작하는 음역을 택했습니다.
- source_word: וְ/יוֹשָׁ֖ה
  english_pob_choice: Joshah
  chosen_korean: 요사
  alternatives_korean:
  - 요샤
  - 조사
  lexicon: 고유명사
  rationale: 히브리어 고유명사로서 음역을 유지했습니다. 영어 POB의 Joshah보다 원어 자음을 따라 한국어에서 무리 없는 발음 형태로 옮겼습니다.
- source_word: בֶּן אֲמַצְיָה
  english_pob_choice: son of Amaziah
  chosen_korean: 아마지야의 아들
  alternatives_korean:
  - 아마지야의 자손
  - 아마지야 아들
  lexicon: HALOT
  rationale: בֶּן은 족보에서 통상 ‘~의 아들’이라는 관계 표지이므로 직역했고, אֲמַצְיָה는 통용 음역에 따라 아마지야로 옮겼습니다.
