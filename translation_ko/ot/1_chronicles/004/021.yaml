  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵי֙ שֵׁלָ֣ה בֶן יְהוּדָ֔ה עֵ֚ר אֲבִ֣י לֵכָ֔ה וְ/לַעְדָּ֖ה אֲבִ֣י מָרֵשָׁ֑ה וּ/מִשְׁפְּח֛וֹת בֵּית עֲבֹדַ֥ת הַ/בֻּ֖ץ לְ/בֵ֥ית אַשְׁבֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
  footnotes:
  - marker: a
    text: Or 'the clans of the house of those who worked fine linen, of Beth-ashbea.' The Hebrew phrase is compressed, and 'father of' earlier in the verse may also carry the sense 'founder of' or 'ancestor of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 셀라의 아들들은 이러합니다. 에르는 레가의 아버지이고, 라아다는 마레사의 아버지이며, 아스베아 집의 아마포를 만드는 자들의 종족입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아스베아 집의 아마포를 만드는 자들의 종족'으로도 옮길 수 있습니다. 히브리어 구문이 매우 압축되어 있으며, 앞의 '아버지'는 '창시자'나 '조상'의 뜻을 담을 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  lexicon: HALOT
  rationale: 계보 문맥의 직역성을 살리되, 한국어에서는 문두의 소유·귀속 관계를 자연스럽게 풀어 주어 독자가 족보 항목으로 이해하도록 했습니다.
- source_word: אֲבִי
  english_pob_choice: the father of
  chosen_korean: 아버지
  alternatives_korean:
  - 창시자
  - 조상
  lexicon: HALOT
  rationale: 히브리어의 압축된 친족/창건 표현을 그대로 드러내기 위해 기본형인 '아버지'를 유지했습니다. 전통적 '~의 아버지'는 POB의 투명성을 살립니다.
- source_word: מִשְׁפְּחוֹת
  english_pob_choice: the clans
  chosen_korean: 종족
  alternatives_korean:
  - 씨족
  - 가문
  lexicon: HALOT
  rationale: 이 문맥은 단순한 가족보다 확장된 혈연 집단을 가리키므로 '종족'을 선택해 집합적 성격을 드러냈습니다.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  english_pob_choice: the house of linen workers
  chosen_korean: 아마포를 만드는 자들의 집
  alternatives_korean:
  - 세마포를 다루는 자들의 집
  - 아마포 작업자들의 집
  lexicon: HALOT
  rationale: בֻּץ는 아마포/고운 베를 가리키므로 '아마포'로 옮기고, עֲבֹדַת은 단순 직업이 아니라 그 일을 하는 집단의 특성을 나타내어 '만드는 자들'로 풀었습니다.
- source_word: לְבֵית אַשְׁבֵּעַ
  english_pob_choice: of the house of Ashbea
  chosen_korean: 아스베아 집
  alternatives_korean:
  - 아스베아의 집
  - 아스베아 가문
  lexicon: HALOT
  rationale: POB의 최신 판독을 따라 장소명보다 '집/가문' 표지를 살렸습니다. 전치사 לְ는 소속·연관의 뜻으로 이해해 '집'으로 압축했습니다.
theological_decisions:
- issue: 압축된 족보 표현의 해석
  chosen_reading: '''아버지''와 ''집'' 표현을 문자적으로 살리되, 독자가 창시자·가문 의미를 문맥으로 읽을 수 있게 했습니다.'
  alternative_readings:
  - '''창시자''로 적극 해석'
  - '''가문''으로 완화'
  rationale: 이 구절은 지명과 혈통이 겹치는 축약형이어서, 본문이 허용하는 범위 내에서만 의미를 펼쳐야 합니다. 따라서 본문 표면형을 유지하는 쪽이 가장 투명합니다.
  doctrine_reference: 족보 본문의 역사적·문학적 투명성 유지
- issue: '''בֻץ''의 물질 의미'
  chosen_reading: '''아마포''로 옮겨 직물의 종류를 분명히 했습니다.'
  alternative_readings:
  - '''고운 베'''
  - '''세마포'''
  rationale: 전통적 교회어휘보다 원어의 물질성을 드러내는 표현이 이 목록의 직업/기술 맥락에 더 적합합니다.
  doctrine_reference: 본문 의미의 사소한 문화화 방지
