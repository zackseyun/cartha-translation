source:
  edition: WLC
  text: וּ/כְל֥וּב אֲחִֽי שׁוּחָ֖ה הוֹלִ֣יד אֶת מְחִ֑יר ה֖וּא אֲבִ֥י אֶשְׁתּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/011.yaml
  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
  footnotes:
  - marker: a
    text: Or 'ancestor/founder of Eshton.' In genealogical lists, 'father of' can sometimes denote a clan or settlement founder rather than an immediate biological father.
    reason: lexical_alternative
translation:
  language: ko
  text: 결룹은 수하의 형제로서 메힐을 낳았고, 그는 에스돈의 아버지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보에서는 ‘아버지’가 친아버지뿐 아니라 조상이나 집단의 시조를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְל֥וּב
  english_pob_choice: Chelub
  chosen_korean: 결룹
  alternatives_korean:
  - 켈룹
  lexicon: HALOT
  rationale: 고유명사는 음역하되, 히브리어 자음값에 더 가까운 ‘결룹’을 택해 간결하게 옮겼습니다.
- source_word: אֲחִֽי שׁוּחָ֖ה
  english_pob_choice: the brother of Shuhah
  chosen_korean: 수하의 형제로서
  alternatives_korean:
  - 수하의 형제인
  - 수하의 형제
  lexicon: HALOT
  rationale: אחי는 소유격 구조이므로 ‘수하의 형제’로 옮기되, 족보 문맥의 관계를 분명히 하려고 ‘-로서’를 덧붙였습니다.
- source_word: הוֹלִ֣יד
  english_pob_choice: fathered
  chosen_korean: 낳았고
  alternatives_korean:
  - 아버지가 되었고
  - 낳았습니다
  lexicon: HALOT
  rationale: 족보 서술의 היליד 히필은 출생/후손 발생을 가리키므로, 현대 한국어에서 자연스러운 ‘낳다’를 사용했습니다.
- source_word: אֲבִ֥י
  english_pob_choice: the father of
  chosen_korean: 아버지였습니다
  alternatives_korean:
  - 아버지였습니다
  - ~의 조상이었습니다
  - ~의 창시자였습니다
  lexicon: HALOT
  rationale: 족보에서는 immediate fatherhood와 clan/founder 의미가 모두 가능하지만, 기본적으로는 가장 직접적인 ‘아버지’로 옮겼습니다.
- source_word: אֶשְׁתּֽוֹן
  english_pob_choice: Eshton
  chosen_korean: 에스돈
  alternatives_korean:
  - 에스톤
  - 에슈톤
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 감각에 맞춰 음역했습니다.
theological_decisions:
- issue: 족보 문맥의 '아버지' 의미 범위
  chosen_reading: 본문은 메힐이 에스돈의 직접적 아버지일 수 있으나, 족보상 조상/시조를 뜻할 가능성도 한국어 본문에서는 열어 두었습니다.
  alternative_readings:
  - 직계 부자 관계로만 읽기
  - 에스돈의 시조로 읽기
  rationale: 히브리어 족보에서 ‘아버지’는 혈연적 아버지뿐 아니라 집단의 선조나 창시자를 가리킬 수 있으므로, 주석 없이 단정하지 않았습니다.
  doctrine_reference: 창세기 계보 표현의 일반적 용례
- issue: 독립대명사 הוּא의 처리
  chosen_reading: ‘그는’으로 두어 메힐을 다시 지시하게 했습니다.
  alternative_readings:
  - 생략
  - ‘그’ 대신 관계절로 흡수
  rationale: 독립대명사는 서술의 주어를 환기하므로, 한국어에서도 명시해 족보 문장의 구조를 보존했습니다.
  doctrine_reference: 히브리어 서술문 구조
