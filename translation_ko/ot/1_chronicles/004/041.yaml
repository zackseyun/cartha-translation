  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
  footnotes:
  - marker: a
    text: Hebrew הַמְּעִינִים is difficult. It is traditionally taken as 'the Meunites,' a people-group; some understand it instead as 'the habitations' or 'the dwellings.'
    reason: alternative_reading
translation:
  language: ko
  text: 이들은 이름이 기록된 자들로서 유다 왕 히스기야 시대에 와서, 그들의 장막과 거기서 발견된 메우니 사람들을 쳐서 오늘날까지 그들을 진멸하였습니다. 그리고 그들의 자리에 정착하였습니다. 거기에 그들의 양과 염소 떼를 위한 목초지가 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַמְּעִינִים은 해석이 어렵습니다. 전통적으로는 ‘메우니 사람들’이라는 민족명으로 이해하지만, ‘거처들’ 또는 ‘주거지들’로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  english_pob_choice: who were recorded by name
  chosen_korean: 이름이 기록된 자들
  alternatives_korean:
  - 이름으로 기록된 자들
  - 이름별로 적힌 자들
  lexicon: HALOT
  rationale: 수동 분사와 전치사 בְּשֵׁמוֹת은 명부에 올려진 행정적/계보적 등록을 가리키므로, 자연스러운 현대 한국어로 ‘이름이 기록된’이 그 뜻을 잘 살립니다.
- source_word: וַיַּכּוּ אֶת אָהֳלֵיהֶם
  english_pob_choice: struck down their tents
  chosen_korean: 그들의 장막을 쳐서
  alternatives_korean:
  - 그들의 장막을 공격하여
  - 그들의 장막을 무너뜨려
  lexicon: HALOT
  rationale: נכה는 전투 문맥에서 강한 타격을 뜻하므로, ‘치다’로 살리되 대상이 장막임을 드러내기 위해 자연스럽게 풀었습니다.
- source_word: הַמְּעִינִים
  english_pob_choice: the Meunites
  chosen_korean: 메우니 사람들
  alternatives_korean:
  - 메우니족
  - 메운 사람들
  - 거처들
  lexicon: HALOT
  rationale: POB의 본문처럼 인명/민족명으로 읽는 전통을 따르되, 현대 한국어에서는 음역을 더해 ‘사람들’로 풀어 집단을 분명히 했습니다. 본문이 난해하여 다른 읽기 가능성은 각주로 남겼습니다.
- source_word: וַיַּחֲרִימֻם
  english_pob_choice: devoted them to destruction
  chosen_korean: 그들을 진멸하였으며
  alternatives_korean:
  - 그들을 멸망시켰으며
  - 그들을 바쳐 멸하였으며
  lexicon: HALOT
  rationale: חרם의 तकनी적 의미인 ‘완전한 진멸/바침’을 반영해야 하므로, 교회적 완곡어보다 성서적 용례를 드러내는 ‘진멸하다’를 택했습니다.
- source_word: תַּחְתֵּיהֶם
  english_pob_choice: they settled in their place
  chosen_korean: 그 자리에 대신 거주하였는데
  alternatives_korean:
  - 그들의 자리에서 살았는데
  - 그들 대신 거주하였는데
  lexicon: HALOT
  rationale: תַּחַת/תַּחְתֵּי의 ‘~을 대신하여/그 자리에’라는 대체 의미를 살려, 단순한 공간적 ‘아래’가 아니라 점유의 교체를 드러냈습니다.
- source_word: מִרְעֶה לְצֹאנָם
  english_pob_choice: because there was pasture there for their flocks
  chosen_korean: 거기에는 그들의 가축을 먹일 목초지가 있었기 때문입니다
  alternatives_korean:
  - 거기에는 그들의 양 떼를 위한 풀밭이 있었기 때문입니다
  - 거기에는 그들의 양떼를 먹일 목초지가 있었기 때문입니다
  lexicon: HALOT
  rationale: מִרְעֶה는 목초지/방목지를 뜻하므로 ‘먹일 목초지’로 옮겨 문맥상 생계용 방목지를 분명히 했습니다. צֹאן은 양만이 아니라 염소까지 포함할 수 있어 ‘가축’으로 넓게 잡았습니다.
theological_decisions:
- issue: מְעִינִים의 난해한 읽기
  chosen_reading: 본문에서는 전통적 민족명으로 ‘메우니 사람들’을 따르되, 각주로 ‘거처들/장막들’ 가능성을 남깁니다.
  alternative_readings:
  - ‘거처들’ 또는 ‘장막들’로 이해
  rationale: 문맥상 장막과 나란히 언급되고 ‘거기서 발견된’과 연결되므로 난해한 명사에 대해 단정적으로 해석하지 않고, 전통적 읽기와 대안 읽기를 함께 보존하는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 본문비평/해석학적 신중성
- issue: חֵרֶם의 강한 심판 표현
  chosen_reading: ‘진멸’로 옮겨 חרם의 전적 파괴와 하나님께 바쳐진 심판의 성격을 유지했습니다.
  alternative_readings:
  - ‘완전히 멸망시켰다’
  - ‘바쳐 멸했다’
  rationale: 이 표현은 단순한 군사적 승리를 넘어, 전적으로 제거하는 성별된 심판 행위를 가리키므로 약화된 표현보다 기술적 어휘를 유지하는 편이 본문 의미를 더 잘 드러냅니다.
  doctrine_reference: 거룩한 전쟁/חרם 어휘
