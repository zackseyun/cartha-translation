source:
  edition: WLC
  text: וּ/בְנֵי֙ כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה עִ֥ירוּ אֵלָ֖ה וָ/נָ֑עַם וּ/בְנֵ֥י אֵלָ֖ה וּ/קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
  footnotes:
  - marker: a
    text: Or, more broadly, 'the descendants of Caleb son of Jephunneh.' In genealogies, 'sons' can sometimes function as a wider family term, though here the immediate list favors 'sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 갈렙의 아들들—여분네의 아들 갈렙의 아들들은 이루와 엘라와 나암이요, 엘라의 아들은 그나스입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 넓게는 ‘갈렙과 여분네의 후손들’로도 볼 수 있습니다. 족보에서는 ‘아들들’이 더 넓은 가족 집단을 가리킬 때도 있지만, 여기서는 바로 이어지는 이름 목록이 직접적인 아들들을 더 잘 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בני는 기본적으로 ‘아들들’로 옮기는 것이 가장 직접적이며, 이 절은 바로 이어지는 이름 목록을 제시하므로 ‘아들들’이 원문 구조를 잘 드러냅니다.
- source_word: בֶּן יְפֻנֶּה
  english_pob_choice: son of Jephunneh
  chosen_korean: 여분네의 아들
  alternatives_korean:
  - 여분네의 아들인
  - 여분네의 아들
  lexicon: HALOT
  rationale: 갈렙을 특정하는 족보적 동격이므로 한국어에서도 소유격 구조로 자연스럽게 옮겼습니다.
- source_word: עִירוּ אֵלָה וָנָעַם
  english_pob_choice: Iru, Elah, and Naam
  chosen_korean: 이루와 엘라와 나암
  alternatives_korean:
  - 이루, 엘라, 그리고 나암
  - 이루ㆍ엘라ㆍ나암
  lexicon: 고유명사 표기
  rationale: 세 이름은 모두 고유명사이므로 현대 한국어 음역을 사용했고, וָנָעַם은 본문 형태에 따라 나암으로 옮겼습니다.
- source_word: וּקְנַז
  english_pob_choice: Kenaz
  chosen_korean: 그나스
  alternatives_korean:
  - 게낫
  - 케나스
  lexicon: 고유명사 표기
  rationale: 히브리어 קְנַז의 자음과 한국어 성경에서 널리 쓰이는 표기를 반영해 그나스로 옮겼습니다.
theological_decisions:
- issue: 족보에서 בני의 범위
  chosen_reading: ‘아들들’로 직역하되, 주석 없이 족보의 직접 자녀 목록으로 제시했습니다.
  alternative_readings:
  - ‘후손들’로 넓혀 옮김
  rationale: 영어 POB도 immediate list를 근거로 ‘sons of’를 택하므로, 본문 자체는 직접적인 아들 관계로 유지하는 것이 가장 투명합니다.
  doctrine_reference: 족보 본문 해석 원칙
