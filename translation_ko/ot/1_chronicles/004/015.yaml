translation:
  language: ko
  text: 여분네의 아들 갈렙의 아들들은[a] 이루와 엘라와 나암이며, 엘라의 아들은 그나스입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 넓게 ‘여분네의 아들 갈렙의 후손들’로 볼 수 있습니다. 족보에서 ‘아들들’은 더 넓은 가족 집단을 가리킬 때도 있지만, 여기서는 바로 이어지는 이름 목록이 직접적인 아들들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בני는 기본적으로 ‘아들들’로 옮기는 것이 가장 직접적이며, 이 절은 바로 이어지는 이름 목록을 제시하므로 ‘아들들’이 원문 구조를 잘 드러냅니다.
- source_word: בֶּן יְפֻנֶּה
  english_pob_choice: son of Jephunneh
  chosen_korean: 여분네의 아들
  alternatives_korean:
