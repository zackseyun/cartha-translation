base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
  footnotes:
  - marker: a
    text: Or, 'for Hamites had lived there before.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 기름진 좋은 목초지를 발견했고, 그 땅은 넓고 조용하며 평화로웠습니다. 이는 전에 그곳에 살던 사람들이 함의 자손이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘함의 자손들이 전에 그곳에 살았기 때문이다.’
    reason: alternative_reading
lexical_decisions:
- source_word: מִרְעֶה
  english_pob_choice: pasture
  chosen_korean: 목초지
  alternatives_korean:
  - 풀밭
  - 방목지
  lexicon: HALOT
  rationale: 가축이 먹을 풀을 찾는 문맥이므로 ‘목초지’가 가장 자연스럽고, 장소성도 분명하게 드러냅니다.
- source_word: שָׁמֵן וָטוֹב
  english_pob_choice: rich and good
  chosen_korean: 기름지고 좋은
  alternatives_korean:
  - 비옥하고 좋은
  - 풍성하고 좋은
  lexicon: HALOT
  rationale: שָׁמֵן의 직역적 의미는 ‘기름진’이지만, 땅과 초지의 풍요로움을 가리키므로 ‘기름지고’가 원문의 감각을 더 잘 살립니다.
- source_word: רַחֲבַת יָדַיִם
  english_pob_choice: broad
  chosen_korean: 넓은
  alternatives_korean:
  - 광활한
  - 드넓은
  lexicon: HALOT
  rationale: ‘손들에 넓다’는 관용구로, 땅이 넉넉하고 여유 있음을 뜻하므로 현대 한국어에서는 간결하게 ‘넓은’이 적절합니다.
- source_word: שֹׁקֶטֶת וּשְׁלֵוָה
  english_pob_choice: quiet and peaceful
  chosen_korean: 조용하며, 평화로웠습니다
  alternatives_korean:
  - 고요하며, 평안했습니다
  - 잠잠하며, 안전했습니다
  lexicon: HALOT
  rationale: 두 형용사가 함께 땅의 안정되고 분쟁 없는 상태를 묘사하므로, ‘조용하며, 평화로웠습니다’가 중복을 유지하면서도 자연스럽습니다.
- source_word: לְפָנִים
  english_pob_choice: formerly
  chosen_korean: 옛날부터
  alternatives_korean:
  - 예전에
  - 이전에
  lexicon: HALOT
  rationale: 문맥상 현재보다 앞선 시기를 가리키므로, ‘옛날부터’가 이전 거주의 오래된 연속성을 담아냅니다.
theological_decisions:
- issue: 함의 자손의 선행 거주를 어떻게 한국어로 드러낼지
  chosen_reading: ‘함의 자손 가운데 그곳에 옛날부터 살던 사람들이 있었다’로 옮겨, 후대 독자가 그 땅이 이전에 함 계열의 주민들에게 속했던 맥락을 이해하도록 했습니다.
  alternative_readings:
  - ‘함족이 그곳에 먼저 살고 있었다’
  - ‘함의 후손들이 전에 그곳에 살았다’
  rationale: 히브리어는 선행 거주를 간단히 말하지만, 한국어에서는 ‘함’과 ‘그곳에 옛날부터 살던 사람들’을 함께 밝혀야 원문의 이유절이 분명해집니다.
  doctrine_reference: 창세기 10장의 민족계보 배경과 정복/이주 서술의 역사적 맥락
