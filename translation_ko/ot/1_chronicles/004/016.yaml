  source_fidelity: 계보의 접속과 ‘아들들’이라는 기본 구조는 충실합니다. 그러나 인명 음차가 영어 철자에 지나치게 의존해 있으며, 특히 יְהַלֶּלְאֵל은 표준 한국어 성경 인명 관례상 ‘여할렐렐’로, זִיף·זִיפָה·תִּירְיָא는 각각 ‘십, 십하, 디리아’로 쓰는 것이 원문 음가 및 통용 표기에 더 적절합니다.
  naturalness: 문장은 현대 한국어 합쇼체로 자연스럽습니다. 계보의 나열에서는 각 항목을 ‘과/와’로 연결하면 히브리어의 반복 접속을 무리 없이 반영하면서도 더 매끄럽습니다.
  terminology: ‘아들들’은 בְּנֵי의 계보상 용법에 적절합니다. 인명은 표준 한국어 성경에서 널리 쓰이는 형태로 통일하는 것이 바람직합니다. 아사렐의 영어식 대체 철자 주석은 본문 의미를 바꾸지 않으므로 유지할 수 있습니다.
