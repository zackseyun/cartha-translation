  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֖י יְהַלֶּלְאֵ֑ל זִ֣יף וְ/זִיפָ֔ה תִּירְיָ֖א וַ/אֲשַׂרְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/016.yaml
  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
  footnotes:
  - marker: a
    text: Asarel may also be spelled 'Asareel' in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여할렐엘의 아들들은 지프, 지파, 티리아, 아사렐입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아사렐은 영어 음차 전통에서 ‘Asareel’로도 적힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - 그런데 …의 아들들은
  lexicon: HALOT
  rationale: 계보 문맥에서 בְּנֵי는 직계 아들들/후손들을 소개하는 표지이므로, 영어 POB의 연결감을 살리면서 한국어에서는 자연스러운 계보 표현인 ‘…의 아들들’로 옮겼습니다.
- source_word: יְהַלֶּלְאֵל
  english_pob_choice: Jehallelel
  chosen_korean: 여할렐엘
  alternatives_korean:
  - 예할렐엘
  - 여할렐렐
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사는 음차가 원칙이므로, 영어 POB의 철자를 참고하되 한국어 외래어 표기 관행에 맞춰 음절 단위로 옮겼습니다.
- source_word: זִיף / זִיפָה / תִּירְיָא / וַאֲשַׂרְאֵל
  english_pob_choice: Ziph, Ziphah, Tiria, and Asarel
  chosen_korean: 지프, 지파, 티리아, 아사렐
  alternatives_korean:
  - 집, 집하, 티리아, 아사레엘
  - 지프, 지파, 티리야, 아사렐
  lexicon: 고유명사 표기
  rationale: 본문의 인명들은 의미 번역이 아니라 음차가 필요하므로, 영어 POB의 표기를 참고해 한국어에서 읽기 쉬운 형태로 일관되게 옮겼습니다. Asarel에 대해서는 영어 주석의 ‘Asareel’ 변이까지 반영할 수 있으나, 본문은 마소라 본문에 따른 ‘아사렐’로 유지했습니다.
theological_decisions:
- issue: 계보문 체의 연결사와 목록 형식
  chosen_reading: ‘그리고’로 계보 항목의 연속성을 살리고, 마지막 항목 앞의 결합도 목록 리듬으로 자연스럽게 처리했습니다.
  alternative_readings:
  - 직역적인 ‘또’
  - 생략형 목록
  rationale: 본문은 신학적 논증문이 아니라 족보 항목이므로, 원문의 단순한 열거 구조를 한국어에서 명확하게 드러내는 것이 가장 중요합니다.
  doctrine_reference: 계보 기록의 서술 기능
