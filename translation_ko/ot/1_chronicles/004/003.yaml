review_pass:
  verdict: revise
  source_fidelity: ‘에담의 아버지’는 히브리어 אֲבִי עֵיטָם의 직역적 모호성을 적절히 보존합니다. ‘아들들’은 본절의 족보 문맥과 영어 POB의 보충을 따른 것이므로 유지할 수 있으나, 히브리어에 독립된 ‘아들’ 명사가 명시되어 있지는 않습니다. ‘그들의 누이’는 복수 소유 접미사를 정확히 반영합니다.
  naturalness: 초안의 ‘…아들들이니’와 ‘…였습니다’는 현대 합쇼체의 일관된 종결 방식이 아닙니다. 현재형 족보 제시 문장으로 ‘…아들들입니다’와 ‘…입니다’를 사용하면 자연스럽고 일관됩니다. 각주 표지는 해당 표현 바로 뒤에 두는 것이 명확합니다.
  terminology: 예스르엘은 한국어 성경의 통용 표기인 ‘이스르엘’로 고쳤습니다. 이스마와 이드바스는 유지했습니다. 하셀렐포니는 히브리어 הַצְלֶלְפּוֹנִי의 음가와 초안의 음역 원칙에 부합하므로 유지했습니다. 각주의 ‘기원자/창시자’는 현대 한국어에서 더 자연스러운 ‘조상이나 설립자’로 다듬었습니다.
  issues:
  - severity: medium
    issue: 합쇼체 종결의 불일치
    rationale: ‘아들들이니’는 문어적 연결·서술 종결이고 ‘였습니다’는 과거 합쇼체입니다. 현대 정중문으로 통일할 필요가 있습니다.
  - severity: low
    issue: 예스르엘 표기
    rationale: Jezreel의 표준 한국어 성경 통용 표기는 ‘이스르엘’입니다.
  - severity: low
    issue: 각주 표지 위치 및 어휘
    rationale: 각주는 ‘아버지’의 의미 범위에 관한 것이므로 그 말 뒤에 배치해야 하며, ‘기원자/창시자’보다 ‘조상이나 설립자’가 자연스럽습니다.
  revised_text: 이들은 에담의 아버지[a]의 아들들입니다. 곧 이스르엘과 이스마와 이드바스이며, 그들의 누이의 이름은 하셀렐포니입니다.
