  text: 이들은 에담의 아버지[a]의 아들들입니다. 곧 이스르엘과 이스마와 이드바스이며, 그들의 누이의 이름은 하셀렐포니입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘아버지’는 역대기 족보에서 ‘조상’이나 ‘설립자’처럼 더 넓은 의미로도 쓰일 수 있습니다.
    reason: lexical_alternative
