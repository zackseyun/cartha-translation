  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
  footnotes:
  - marker: a
    text: Or possibly 'founder of Etam' or 'ancestor of Etam'; the Hebrew 'father of' can carry a broader genealogical sense in Chronicles.
    reason: lexical_alternative
  - marker: b
    text: Hazzelelponi is also spelled 'Hazzelelponi' in some English transliterations.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 에담의 아버지의 아들들이니, 예스르엘과 이스마와 이드바스이며, 그들의 누이의 이름은 하셀렐포니였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘아버지’는 역대기 족보에서 ‘조상’이나 ‘기원자/창시자’까지 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
