  source_fidelity: ‘후솟 사람 시브브개’는 히브리어 고유명사 סִבְּכַי הַחֻשָׁתִי의 통상적이고 음운상 더 적절한 한국어 음역인 ‘후사 사람 십브개’로 바로잡을 필요가 있습니다. 또한 מִילִדֵי הָרְפָאִים는 단순히 ‘라파 족속 가운데 하나’라기보다 그 집단에서 난 사람, 곧 ‘라파임의 후손 가운데 하나’를 가리킵니다. 마지막 복수 동사는 원문의 ‘그들은 굴복되었습니다/굴복했습니다’라는 다소 열린 지시를 유지할 수 있습니다.
  naturalness: ‘그 후에’, ‘전쟁이 일어났습니다’, ‘쳐죽였습니다’, ‘굴복했습니다’는 현대 표준어 합쇼체 서사에 자연스럽습니다. 각주 표지는 해당 단어 바로 뒤에 두어 독자가 각주의 적용 대상을 분명히 알 수 있게 했습니다.
