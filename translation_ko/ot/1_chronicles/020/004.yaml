base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
  footnotes:
  - marker: a
    text: Or "Saphai" for the name rendered "Sippai."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "the Rephaim"; traditionally also rendered "the giants."
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일이 있은 뒤에 게셀에서 블레셋 사람들과 전쟁이 일어났습니다. 그때 후솟 사람 시브브개가 라파 족속 가운데 하나인 십배를 쳐죽였고, 그들은 굴복했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘십배’는 본문 자음형에 따른 음역이며, 영어 전승에는 ‘사파이(Saphai)’라는 다른 표기가 전해집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘라파 족속’은 전통적으로도 ‘거인들’로 옮겨지곤 하지만, 여기서는 본문의 족속명으로 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일이 있은 뒤에
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  - 그 일이 있은 뒤에
  lexicon: HALOT
  rationale: 서사 전환을 자연스럽게 살리면서도 시간의 순서를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  english_pob_choice: war arose
  chosen_korean: 전쟁이 일어났습니다
  alternatives_korean:
  - 전쟁이 있었습니다
  - 전쟁이 일어났습니다
  - 전쟁이 벌어졌습니다
  lexicon: HALOT
  rationale: ‘서다’의 직역보다 문맥상 전쟁의 발발을 뜻하는 동적 표현이 더 적절하므로, 현대 한국어에서 자연스러운 ‘일어났습니다’를 택했습니다.
- source_word: סִבְּכַי הַחֻשָׁתִי
  english_pob_choice: Sibbecai the Hushathite
  chosen_korean: 후솟 사람 시브브개
  alternatives_korean:
  - 후솟 사람 시브개
  - 호사 사람 시브브개
  - 후솟 사람 시브개
  lexicon: HALOT
  rationale: 고유명사는 음역하되, הגentilic을 ‘-사람’으로 옮겨 인명과 출신 표지를 함께 보존했습니다.
- source_word: סִפַּי
  english_pob_choice: Sippai
  chosen_korean: 십배
  alternatives_korean:
  - 십파이
  - 시파이
  - 사파이
  lexicon: HALOT
  rationale: 본문 자음형에 맞는 음역을 택했으며, 영어 전승의 다른 표기 가능성은 본문보다 우선하지 않았습니다.
- source_word: מִילִדֵי הָרְפָאִים
  english_pob_choice: one of the descendants of the Rephaim
  chosen_korean: 라파 족속 가운데 하나
  alternatives_korean:
  - 라파의 자손 가운데 하나
  - 라파 족속의 후손 가운데 하나
  - 거인들 가운데 하나
  lexicon: HALOT
  rationale: ‘רְפָאִים’을 해석적으로 ‘거인들’로 풀기보다 음역한 족속명으로 유지해, 본문이 허용하는 족속/계보적 의미를 보존했습니다.
- source_word: וַיִּכָּנֵעוּ
  english_pob_choice: they were subdued
  chosen_korean: 그들은 굴복했습니다
  alternatives_korean:
  - 그들은 제압되었습니다
  - 그들은 정복되었습니다
  - 그들은 굴복당했습니다
  lexicon: HALOT
  rationale: 군사적 결과를 나타내는 피동적 의미를 살리되, 한국어에서 가장 자연스러운 종결 표현으로 옮겼습니다.
theological_decisions:
