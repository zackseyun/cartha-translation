base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
  footnotes:
  - marker: a
    text: Or "Saphai" for the name rendered "Sippai."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "the Rephaim"; traditionally also rendered "the giants."
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 게셀에서 블레셋 사람들과 전쟁이 일어났습니다. 그때 후사 사람 십브개가 라파임의 후손 가운데 하나인 십배[a]를 쳐죽였고, 그들은 굴복했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘십배’는 히브리어 본문의 음역입니다. 다른 전통에서는 ‘사파이(Saphai)’로도 표기합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘라파임’입니다. 이 말은 전통적으로 ‘거인들’로도 번역됩니다.
    reason: lexical_alternative
