  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
  footnotes:
  - marker: a
    text: Or "defied Israel." The Hebrew verb can denote scornful reproach or open defiance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이스라엘을 조롱하자[a], 요나단—다윗의 형인 시마아의 아들—이 그를 쳐 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘에 맞섰다”입니다. 히브리어 동사는 조롱 섞인 모욕이나 공개적 도전을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  english_pob_choice: taunted
  chosen_korean: 조롱하자
  alternatives_korean:
  - 모욕하자
  - 대적하자
  - 비웃자
  lexicon: HALOT
  rationale: חרף는 단순한 말다툼보다 공개적 모욕과 도발의 뉘앙스를 가지므로, 현대 한국어에서 자연스럽고 공격성을 드러내는 ‘조롱하다’로 옮겼습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳐 죽였습니다
  alternatives_korean:
  - 그를 죽였습니다
  - 그를 쳤습니다
  - 그를 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: 문맥상 치명타를 가한 뜻이므로, 결과를 분명히 드러내는 ‘쳐 죽였습니다’가 원문의 행위와 서술 흐름을 가장 직접적으로 반영합니다.
- source_word: אֲחִי דָוִיד
  english_pob_choice: David’s brother
  chosen_korean: 다윗의 형인
  alternatives_korean:
  - 다윗의 형제인
  - 다윗의 동생인
  lexicon: HALOT
  rationale: 히브리어 친족구문을 자연스럽게 풀어 ‘다윗의 형인’으로 옮기되, 요나단과 다윗의 관계를 명시적으로 보존했습니다.
theological_decisions:
- issue: ‘이스라엘을 조롱하다’의 행동 유형
  chosen_reading: 공개적 수치 주기와 적대적 도발을 함께 담은 조롱으로 이해했습니다.
  alternative_readings:
  - 공개적으로 대적하다
  - 이스라엘을 모욕하다
  rationale: 본문의 חרף는 단순 언쟁이 아니라 공동체를 향한 노골적 도전과 수치 주기를 포함할 수 있어, 한국어에서도 그 긴장을 유지해야 합니다.
  doctrine_reference: 서사 본문 해석 원리
