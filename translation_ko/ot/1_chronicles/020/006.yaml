source:
  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מִדָּ֗ה וְ/אֶצְבְּעֹתָ֤י/ו שֵׁשׁ וָ/שֵׁשׁ֙ עֶשְׂרִ֣ים וְ/אַרְבַּ֔ע וְ/גַם ה֖וּא נוֹלַ֥ד לְ/הָ/רָפָֽא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
  footnotes:
  - marker: a
    text: Or 'was descended from the giant' or 'was one of the Rephaim.' The Hebrew reads 'was born to the Rapha.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 다시 가드에서 전쟁이 있었는데, 체구가 매우 큰 사람이 있었습니다. 그의 손과 발에는 손가락과 발가락이 각각 여섯 개씩 있어서, 모두 스물네 개였습니다. 그도 라파에게서 태어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 거인에게서 태어났습니다’ 혹은 ‘르바임에 속한 사람이었습니다’. 히브리어는 ‘라파에게서 태어났다’고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד מִלְחָמָה
  english_pob_choice: war again
  chosen_korean: 다시 전쟁이 있었는데
  alternatives_korean:
  - 또 전쟁이 있었는데
  - 전쟁이 다시 있었는데
  lexicon: HALOT
  rationale: עוֹד은 서술 흐름에서 반복을 나타내므로 ‘다시’가 가장 자연스럽고, מִלְחָמָה는 사건 단위의 ‘전쟁’으로 옮기는 것이 적절합니다.
- source_word: בְּגַת
  english_pob_choice: at Gath
  chosen_korean: 가드에서
  alternatives_korean:
  - 가드에서
  - 가드에
  lexicon: HALOT
  rationale: 장소 표시는 한국어 서술문에서 ‘-에서’가 가장 자연스럽고, 전투의 발생 지점을 분명히 합니다.
- source_word: אִישׁ מִדָּה
  english_pob_choice: a man of great size
  chosen_korean: 키가 큰 사람
  alternatives_korean:
  - 큰 키의 사람
  - 거구의 사람
  - 체구가 큰 사람
  lexicon: HALOT
  rationale: 문맥상 비정상적으로 큰 신체적 크기를 가리키므로, 과도한 의역을 피하면서도 현대 한국어로 자연스럽게 전달되는 표현을 택했습니다.
- source_word: אֶצְבְּעֹתָיו
  english_pob_choice: his fingers and toes
  chosen_korean: 그의 손가락과 발가락
  alternatives_korean:
  - 그의 손발가락
  - 그의 손가락들
  lexicon: HALOT
  rationale: 히브리어는 원뜻상 ‘손가락’이지만 이 고정된 묘사에서는 손과 발의 숫자를 함께 가리키므로, 영어 POB처럼 의미를 풀어 한국어에서도 명시했습니다.
- source_word: שֵׁשׁ וָשֵׁשׁ עֶשְׂרִים וְאַרְבַּע
  english_pob_choice: six each, twenty-four in all
  chosen_korean: 각각 여섯 개씩, 모두 스물네 개
  alternatives_korean:
  - 여섯 개씩, 합해 스물네 개
  - 여섯 개씩, 총 스물네 개
  lexicon: HALOT
  rationale: 분배적 수량과 총합을 한국어로 분명히 드러내기 위해 ‘각각’과 ‘모두’를 사용했습니다.
- source_word: נוֹלַד לְהָרָפָא
  english_pob_choice: was born to the Rapha
  chosen_korean: 라파에게서 태어났습니다
  alternatives_korean:
  - 라파에게서 태어났습니다
  - 라파에게 속한 자로 태어났습니다
  - 라파의 후손으로 태어났습니다
  lexicon: HALOT
  rationale: 본문의 לְ는 계통/출신을 나타낼 수 있어 ‘에게서’로 옮겨, 본문의 모호성을 보존하면서도 한국어로는 자연스럽게 했습니다.
theological_decisions:
- issue: הָרָפָא의 정체와 계통 표현
  chosen_reading: 본문의 모호성을 살려 ‘라파’로 음역하고, 계통 출신을 나타내는 표현으로 처리했습니다.
  alternative_readings:
  - 거인에게서 태어났습니다
  - 르바임 가운데 하나였습니다
  - 라파의 후손이었습니다
  rationale: 이 표현은 인물명인지 종족명인지 확정하기 어려우므로, 주석 없이 본문에서 단정하지 않고 음역과 출신 표현으로 긴장을 보존하는 것이 가장 स्रोत에 충실합니다.
  doctrine_reference: 번역 철학 §3, §5
