revisions:
- from: 그리고 다시 가드에서 전쟁이 있었는데, 키가 큰 사람이 있었고 그의 손가락과 발가락은 각각 여섯 개씩, 모두 스물네 개였습니다. 그도 라파에게서 태어났습니다.[a]
  to: 그리고 다시 가드에서 전쟁이 있었는데, 체구가 매우 큰 사람이 있었습니다. 그의 손과 발에는 손가락과 발가락이 각각 여섯 개씩 있어서, 모두 스물네 개였습니다. 그도 라파에게서 태어났습니다.[a]
  rationale: 수량 묘사가 손과 발 각각에 여섯 개씩이라는 뜻으로 분명히 드러나도록 수정했습니다. 또한 원문의 비범한 체격을 더 충실히 반영하고, 라파의 정체에 관한 해석적 모호성은 본문 음역과 대안 각주로 보존했습니다.
