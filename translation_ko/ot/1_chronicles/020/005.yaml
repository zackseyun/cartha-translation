id: 1CH.20.5
reference: 1 Chronicles 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֞ךְ אֶלְחָנָ֣ן בֶּן יעור אֶת לַחְמִי֙ אֲחִי֙ גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
  footnotes:
  - marker: a
    text: The parallel in 2 Samuel 21:19 has a difficult Hebrew text and is often discussed in relation to this verse; Chronicles explicitly says Elhanan killed Lahmi, the brother of Goliath.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 또 블레셋 사람들과 전쟁이 있었습니다[a]. 엘하난이 야일의 아들인 가드 사람 골리앗의 형제 라흐미를 쳐 죽였습니다. 라흐미의 창 자루는 베틀채와 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사무엘하 21:19의 평행본문은 히브리어 본문이 난해하여 자주 논의됩니다. 역대기는 엘하난이 골리앗의 형제 라흐미를 죽였다고 분명히 말합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  english_pob_choice: And there was war ... again
  chosen_korean: 그리고 또 전쟁이 있었습니다
  alternatives_korean:
  - 그리고 전쟁이 다시 있었습니다
  - 그리고 아직도 전쟁이 있었습니다
  lexicon: HALOT
  rationale: עוֹד는 여기서 반복성을 나타내므로 ‘또/다시’가 자연스럽고, 서술체에 맞게 ‘전쟁이 있었습니다’로 옮겼습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐 죽였는데
  alternatives_korean:
  - 쳐서 쓰러뜨렸는데
  - 죽였는데
  lexicon: HALOT
  rationale: נכה의 기본 이미지를 살리면서 전투 문맥의 치명성을 드러내기 위해 ‘치다’와 결과를 함께 담았습니다.
- source_word: אֶת לַחְמִי אֲחִי גָּלְיָת הַגִּתִּי
  english_pob_choice: Lahmi, the brother of Goliath the Gittite
  chosen_korean: 가드 사람 골리앗의 형제 라흐미
  alternatives_korean:
  - 골리앗의 형제 라흐미
  - 가드 출신 골리앗의 형제 라흐미
  lexicon: HALOT
  rationale: 관계어 ‘형제’를 앞세워 히브리어의 친족구조를 보존했고, הַגִּתִּי는 관용적인 ‘가드 사람’으로 옮겼습니다.
- source_word: וְעֵץ חֲנִיתוֹ כִּמְנוֹר אֹרְגִים
  english_pob_choice: whose spear shaft was like a weaver’s beam
  chosen_korean: 그의 창 자루는 베틀채와 같았습니다
  alternatives_korean:
  - 그의 창대는 베틀채와 같았습니다
  - 그의 창 자루는 직조공의 들보와 같았습니다
  lexicon: HALOT
  rationale: עֵץ חֲנִיתוֹ의 직역적 ‘창의 나무’보다 한국어에서 자연스러운 ‘창 자루’를 택했고, כִּמְנוֹר אֹרְגִים은 전통적으로 이해되는 대형 직조기 부재인 ‘베틀채’로 옮겼습니다.
theological_decisions:
- issue: 사무엘하 21:19의 난해한 평행본문과의 관계
  chosen_reading: 역대기는 엘하난이 골리앗 자신이 아니라 ‘골리앗의 형제 라흐미’를 죽였다는 역대기의 분명한 진술을 그대로 따랐습니다.
  alternative_readings:
  - 사무엘하 본문과 조화시키기 위해 더 넓게 풀어 쓰는 해석
  - 라흐미를 사무엘하의 지명/표현과 연결해 재구성하는 해석
  rationale: 본문 자체의 의미를 우선해야 하므로, 평행본문의 난점은 본문을 흐리지 않는 각주로만 처리하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
