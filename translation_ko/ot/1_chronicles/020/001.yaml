source:
  edition: WLC
  text: וַ/יְהִ֡י לְ/עֵת֩ תְּשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מְּלָכִ֗ים וַ/יִּנְהַ֣ג יוֹאָב֩ אֶת חֵ֨יל הַ/צָּבָ֜א וַ/יַּשְׁחֵ֣ת אֶת אֶ֣רֶץ בְּנֵֽי עַמּ֗וֹן וַ/יָּבֹא֙ וַ/יָּ֣צַר אֶת רַבָּ֔ה וְ/דָוִ֖יד יֹשֵׁ֣ב בִּ/ירֽוּשָׁלִָ֑ם וַ/יַּ֥ךְ יוֹאָ֛ב אֶת רַבָּ֖ה וַ/יֶּֽהֶרְסֶֽ/הָ׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'in the spring, when kings go out to battle.' The Hebrew reads more literally, 'at the turning of the year, at the time when kings go out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 해가 돌아오는 때, 곧 왕들이 나가는 때에 요압이 군대의 병력을 이끌고 나가서 암몬 사람의 땅을 황폐하게 하고, 와서 랍바를 포위했습니다. 그러나 다윗은 예루살렘에 머물러 있었습니다. 요압이 랍바를 쳐서 그것을 무너뜨렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 해가 돌아오는 때’는 히브리어의 문자적 표현을 살린 번역입니다. 관용적으로는 ‘봄철, 왕들이 전쟁하러 나갈 때’로 풀 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  english_pob_choice: the turning of the year
  chosen_korean: 그 해가 돌아오는 때
  alternatives_korean:
  - 해가 바뀌는 때
  - 연말의 때
  - 봄철
  lexicon: HALOT
  rationale: 히브리어의 관용구를 직역에 가깝게 살리되 한국어에서 이해 가능하도록 ‘그 해가 돌아오는 때’로 옮겼습니다. ‘봄철’은 문맥상 추정된 계절을 본문에 앞당겨 넣는 해석이어서 본문에는 두지 않았습니다.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  english_pob_choice: at the time when kings go out
  chosen_korean: 곧 왕들이 나가는 때
  alternatives_korean:
  - 왕들이 전쟁하러 나가는 때
  - 왕들이 출정하는 때
  - 왕들이 나갈 때
  lexicon: HALOT
  rationale: ‘나간다’는 동사의 본래 표현을 유지해 히브리어의 간결한 군사 관용구를 보존했습니다. ‘전쟁하러’는 문맥상 가능하지만 본문에 의미를 덧붙이므로 본문에서는 생략했습니다.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  english_pob_choice: devastated the land of the Ammonites
  chosen_korean: 암몬 사람의 땅을 황폐하게 하고
  alternatives_korean:
  - 암몬 사람들의 땅을 파괴하고
  - 암몬 자손의 땅을 유린하고
  - 암몬 사람의 땅을 멸망시키고
  lexicon: HALOT
  rationale: 전쟁 맥락에서 ‘שׁחת’의 파괴·황폐화 의미를 살려 ‘황폐하게 하다’로 옮겼습니다. ‘암몬 사람’은 한국어 성서 문체에서 자연스럽고, ‘자손’보다 덜 장황합니다.
- source_word: וַיָּצַר
  english_pob_choice: besieged
  chosen_korean: 포위했습니다
  alternatives_korean:
  - 포위하여 진을 쳤습니다
  - 공성했습니다
  - 에워쌌습니다
  lexicon: HALOT
  rationale: 도시를 둘러싸는 군사 행위를 가장 직접적으로 드러내는 현대 한국어로 ‘포위하다’를 선택했습니다. ‘공성하다’는 다소 전문적이고, ‘에워싸다’는 군사적 긴장이 약합니다.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלָם
  english_pob_choice: But David stayed in Jerusalem
  chosen_korean: 그러나 다윗은 예루살렘에 머물러 있었습니다.
  alternatives_korean:
  - 그런데 다윗은 예루살렘에 있었습니다.
  - 다윗은 예루살렘에 앉아 있었습니다.
  - 다윗은 예루살렘에 머물렀습니다.
  lexicon: HALOT
  rationale: 현재분사의 지속적 상태를 한국어의 ‘머물러 있었습니다’로 표현해, 다윗이 전장에 나가지 않고 남아 있었음을 나타냈습니다. 시작의 ‘그러나’는 요압의 출정과 대비되는 흐름을 살립니다.
- source_word: וַיֶּהֶרְסֶהָ
  english_pob_choice: tore it down
  chosen_korean: 그것을 무너뜨렸습니다
  alternatives_korean:
  - 그것을 허물었습니다
  - 그것을 파괴했습니다
  - 그것을 부쉈습니다
  lexicon: HALOT
  rationale: 성읍을 ‘허물다/무너뜨리다’의 뜻을 살려, 앞의 ‘황폐하게 하다’와 구별되도록 ‘무너뜨리다’를 택했습니다. 대상 대명사 ‘그것’을 유지해 라반(?)이 아닌 랍바를 가리키는 흐름을 분명히 했습니다.
theological_decisions:
- issue: ‘왕들이 나가는 때’의 계절 해석을 본문에 넣을지 여부
  chosen_reading: 본문에는 계절어를 덧붙이지 않고, 히브리어 관용구 자체를 보존했습니다.
  alternative_readings:
  - ‘봄철, 왕들이 전쟁하러 나갈 때’
  - ‘새해 무렵, 왕들이 출정할 때’
  rationale: 본문이 말하는 것은 계절명 자체보다 ‘해가 돌아오는 때’라는 관용구와 그에 이어지는 군사 관습입니다. 계절 해석은 주석/각주에 두는 것이 원문 보존에 더 충실합니다.
  doctrine_reference: 원문 관용구 보존과 주석 처리 원칙
- issue: 다윗의 체류와 요압의 원정 대비
  chosen_reading: ‘그러나’로 대비를 드러내되, 다윗의 행동을 과도하게 도덕화하지는 않았습니다.
  alternative_readings:
  - ‘그리고’로 단순 접속
  - 다윗의 태만을 암시하는 표현을 추가
  rationale: 본문은 사실관계를 병렬로 제시하면서도 독자가 대비를 느끼도록 합니다. 한국어에서도 그 긴장을 보존하되, 본문에 해석적 비난을 더하지 않았습니다.
  doctrine_reference: 서술 대비 보존 원칙
