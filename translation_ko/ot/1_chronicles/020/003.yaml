reference: 1 Chronicles 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
  footnotes:
  - marker: a
    text: Or, possibly, 'put them under saws, iron threshing-sledges, and cutting tools'; some take the verse, influenced by 2 Samuel 12:31, to mean that David executed them with such instruments.
    reason: alternative_reading
  - marker: b
    text: The Hebrew terms for the tools are partly uncertain; the phrase rendered 'iron picks, and axes' may refer more generally to iron cutting implements.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 안에 있던 백성을 끌어내어 톱과 철 도구와 도끼로 일하게 했습니다[a]. 이렇게 다윗은 암몬 자손의 모든 성읍에 행했습니다. 그리고 다윗과 모든 백성은 예루살렘으로 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들을 톱, 철제 타작 썰매, 절단 도구 아래에 두었다’로도 옮길 수 있습니다. 일부는 사무엘하 12:31의 영향 아래 이 구절을 그런 도구들로 그들을 처형한 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹצִיא
  english_pob_choice: brought out
  chosen_korean: 끌어내어
  alternatives_korean:
  - 데리고 나와
  - 밖으로 이끌어
  lexicon: HALOT
  rationale: 히필형 יצא의 기본 의미는 밖으로 내어 보내는 것이므로, 문맥의 구체적 동작을 살리면서 자연스러운 한국어로 옮겼습니다.
- source_word: וַיָּשַׂר
  english_pob_choice: put them to work
  chosen_korean: 일하게 했습니다
  alternatives_korean:
  - 노역하게 했습니다
  - 일꾼으로 삼았습니다
  - 톱질하게 했습니다
  lexicon: HALOT
  rationale: 이 동사는 본문과 병행구의 영향으로 해석이 갈리지만, 역대기의 표현은 처형보다 노동 배치로 읽는 번역이 원문에 더 가깝기에 그 의미를 반영했습니다.
- source_word: בַּמְּגֵרָה / וּבַמְּגֵרוֹת
  english_pob_choice: with saws ... and axes
  chosen_korean: 톱과 ... 도끼
  alternatives_korean:
  - 톱들과 ... 절단 도구들
  - 톱과 ... 철 도구와 도끼
  lexicon: HALOT
  rationale: מְגֵרָה는 분명히 ‘톱’이지만, אחרון의 복수형과 뒤의 목록은 도구들의 집합을 가리키므로 한국어에서는 자연스럽게 열거형으로 처리했습니다.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  english_pob_choice: iron tools
  chosen_korean: 철 도구
  alternatives_korean:
  - 철 날붙이
  - 철 연장
  - 철 끼치
  lexicon: HALOT
  rationale: 해당 어형은 정확한 공구 명칭이 불확실하므로, POB의 최신 수정처럼 구체성을 과도하게 좁히지 않는 ‘철 도구’로 옮겼습니다.
theological_decisions:
- issue: 이 구절이 포로 노동을 말하는지, 살해를 말하는지
  chosen_reading: 본문은 다윗이 점령한 사람들을 도구를 사용한 노동에 배치한 것으로 번역했습니다.
  alternative_readings:
  - 사무엘하 12:31의 병행구처럼 그들을 톱과 철제 도구로 처형했다는 읽기
  rationale: 역대기 본문의 어휘만으로는 더 잔혹한 의미를 단정하기 어렵고, 원문 우선 원칙상 사무엘서의 표현을 그대로 끌어오지 않았습니다. 다만 해석 논쟁이 큰 지점이므로 각주로 대안 읽기를 남겼습니다.
  doctrine_reference: 번역 원칙 §§1, 3
