  source_fidelity: 본문의 ‘일하게 했습니다’는 난해한 וַיָּשַׂר를 강제 처형으로 단정하지 않고 노동에 배치했다는 가능한 의미로 옮긴 점에서 적절합니다. 다만 ‘끌어내어’는 הוֹצִיא보다 다소 강한 강제성을 암시할 수 있으므로 ‘데리고 나와’가 더 중립적입니다. 또한 도구 명칭의 불확실성을 알리는 영어 감사 기록의 두 번째 각주가 한국어 초안에서 누락되었습니다.
  naturalness: ‘암몬 자손의 모든 성읍에 행했습니다’는 현대 한국어에서 목적어 및 ‘이와 같이’의 내용이 충분히 드러나지 않아 다소 부자연스럽습니다. ‘암몬 자손의 모든 성읍에도 이와 같이 했습니다’가 자연스럽고 원문의 요약 표현을 잘 살립니다.
  terminology: ‘다윗’, ‘암몬 자손’, ‘예루살렘’은 표준 성서 용례에 맞습니다. ‘철 도구’는 원어의 불확실성을 과도하게 특정하지 않는 안전한 표현입니다. ‘도끼’의 어휘적 불확실성은 각주로 보완해야 합니다.
