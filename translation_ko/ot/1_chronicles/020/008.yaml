reference: 1 Chronicles 20:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
  footnotes:
  - marker: a
    text: Or 'to Rapha'; possibly referring to descendants of the Rephaim, that is, a giant lineage in Gath.
    reason: alternative_reading
translation:
  language: ko
  text: 이들은 가드에서 라파에게서 태어났으며[a], 다윗의 손에, 또 그의 종들의 손에 쓰러졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘라파’는 인물 이름일 수도 있고 집단을 가리키는 명칭일 수도 있습니다. 가드에 있던 르바임, 곧 거인 계열과 관련될 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵל
  english_pob_choice: These
  chosen_korean: 이들은
  alternatives_korean:
  - 이 사람들은
  - 그들은
  lexicon: WLC/HALOT
  rationale: 앞서 언급된 전사들을 가리키는 지시어이므로, 불필요한 ‘사람들’을 덧붙이지 않고 자연스럽게 ‘이들은’으로 옮겼습니다.
- source_word: נוּלְּדוּ
  english_pob_choice: were born
  chosen_korean: 태어났습니다
  alternatives_korean:
  - 태생입니다
  - 출생했습니다
  lexicon: HALOT
  rationale: יָלַד 계열의 수동형은 기본적으로 ‘태어나다’의 뜻을 가지므로, 혈통적 출신을 암시하더라도 가장 직접적인 한국어로 옮겼습니다.
- source_word: לְהָרָפָא
  english_pob_choice: to the Rapha
  chosen_korean: 라파에게서
  alternatives_korean:
  - 라파에게
  - 라파의 후손으로부터
  - 르바임에게서
  lexicon: HALOT
  rationale: 히브리어 전치사 ל의 계보적 방향성을 살리면서도, 한국어에서는 출신·계통을 나타내는 ‘-에게서’가 가장 자연스럽습니다. 본문이 인물명인지 집단명인지 애매하므로 ‘거인’이나 ‘르바임’으로 좁히지 않았습니다.
- source_word: בְּגַת
  english_pob_choice: in Gath
  chosen_korean: 가드
  alternatives_korean:
  - 가드에서
  - 가드 땅에서
  lexicon: HALOT
  rationale: 지명 표기는 통용되는 성경 한국어 음역을 따르되, 앞의 출신 표현과 결합되어 문맥상 ‘가드’만으로도 충분합니다.
- source_word: וַיִּפְּלוּ
  english_pob_choice: and they fell
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 넘어졌습니다
  - 쓰러져 죽었습니다
  - 패배했습니다
  lexicon: HALOT
  rationale: 전투 문맥에서 단순한 ‘fell’은 죽음/패배를 함축하므로, 직역성과 의미 전달을 함께 살릴 수 있는 ‘쓰러졌습니다’를 택했습니다.
- source_word: בְיַד
  english_pob_choice: by the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 손으로
  - 손에 의해
  lexicon: HALOT
  rationale: 히브리어 관용구를 보존하기 위해 ‘손에’를 유지했습니다. 뒤의 두 번 반복되는 구조도 그대로 드러납니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 시종들
  - 그의 부하들
  - 그의 사람들
  lexicon: HALOT
  rationale: עֶבֶד의 기본 의미인 ‘종’을 살렸습니다. 여기서는 다윗 휘하의 전투원까지 포괄할 수 있지만, 본문 자체는 더 넓은 의미를 명시하지 않으므로 ‘종들’이 가장 직접적입니다.
theological_decisions:
- issue: 라파의 정체
  chosen_reading: 가드의 라파를 계보적 인물 또는 집단으로 열어 둔 채 번역했습니다.
  alternative_readings:
  - 가드의 거인
  - 르바임의 후손들
  - 라파라는 개인
  rationale: 히브리어는 단수형과 정관사를 사용하지만, 본문만으로는 정확히 개인명인지 집단명인지 단정하기 어렵습니다. 따라서 POB의 주석 취지를 살려 해석을 닫지 않았습니다.
  doctrine_reference: '번역 원칙 3: 본문이 허용하는 긴장과 모호성을 보존한다.'
