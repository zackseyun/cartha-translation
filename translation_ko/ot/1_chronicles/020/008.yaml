  source_fidelity: 현 초안의 ‘가드의 라파에게서’는 히브리어 בְּגַת(‘가드에서/가드에’)를 라파를 수식하는 소유·속격 관계로 바꾸어 놓습니다. 원문은 ‘가드에서 라파에게서 태어났다’라는 위치와 계보의 두 관계를 구별합니다. 또한 בְּיַד의 반복은 한국어에서도 각각 드러내는 편이 충실합니다.
  naturalness: ‘가드에서 라파에게서 태어났으며’는 계보 문맥에서 다소 낯설 수 있으나, 원문의 ‘태어나다’와 계보적 전치사 관계를 보존하는 자연스러운 현대 한국어입니다. ‘다윗의 손에, 또 그의 종들의 손에’는 반복된 원문 구조를 자연스럽게 전달합니다.
  terminology: ‘라파’는 개인명과 집단 명칭 사이의 원문상 불확실성을 유지합니다. ‘르바임’ 및 ‘거인 계열’은 본문이 아니라 각주에서 가능성으로만 설명하여 과도한 단정을 피합니다. ‘종들’은 עֲבָדָיו의 기본 의미를 보존합니다.
