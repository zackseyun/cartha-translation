reference: 1 Chronicles 20:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֣יד אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וַֽ/יִּמְצָאָ֣/הּ מִשְׁקַ֣ל כִּכַּר זָהָ֗ב וּ/בָ/הּ֙ אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑יד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
  footnotes:
  - marker: a
    text: Or 'the crown of Milcom' (or 'Malcam'), taking מַלְכָּם as the name of the Ammonite god rather than 'their king.'
    reason: alternative_reading
  - marker: b
    text: A talent was a large ancient unit of weight, often estimated at roughly 75 pounds or 34 kilograms, though exact values varied.
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 그들의 왕의 관을 그의 머리에서 가져왔는데, 그것의 무게가 금 한 달란트였고 그 안에는 귀한 돌이 있었습니다. 그것은 다윗의 머리에 놓였습니다. 그리고 그는 그 도시의 전리품을 매우 많이 가져왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '밀곰'이나 '말감'으로 읽을 수 있습니다. 이는 מַלְכָּם을 암몬 족속의 신 이름으로 보는 대안입니다.
    reason: alternative_reading
  - marker: b
    text: 달란트는 고대의 큰 무게 단위로, 대략 34킬로그램 정도로 추정되지만 정확한 값은 시대와 지역에 따라 달랐습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  english_pob_choice: crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 면류관
  lexicon: HALOT
  rationale: 왕의 머리에 쓰는 장식이라는 기본 의미를 가장 직접적으로 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: מַלְכָּם
  english_pob_choice: their king
  chosen_korean: 그들의 왕
  alternatives_korean:
  - 밀곰
  - 말감
  lexicon: HALOT
  rationale: 문맥상 '그의 머리에서'가 왕을 가리키는 가장 자연스러운 읽기이므로 본문은 '그들의 왕'으로 옮기고, 신명칭 해석은 본문 밖에서 처리합니다.
- source_word: מִשְׁקַל כִּכַּר זָהָב
  english_pob_choice: it weighed a talent of gold
  chosen_korean: 금 한 달란트였고
  alternatives_korean:
  - 금 한 달란트의 무게였고
  - 무게가 금 한 달란트였고
  lexicon: HALOT
  rationale: 히브리어의 무게 표현을 한국어에서 자연스럽게 압축해 전달하면서, 고대 단위인 '달란트'를 유지했습니다.
- source_word: אֶבֶן יְקָרָה
  english_pob_choice: a precious stone
  chosen_korean: 귀한 돌
  alternatives_korean:
  - 보석
  - 값진 돌
  lexicon: HALOT
  rationale: 특정 보석명을 밝히지 않은 일반 표현이므로, 과도하게 구체화하지 않고 의미를 그대로 살렸습니다.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  english_pob_choice: it was placed on David’s head
  chosen_korean: 다윗의 머리에 놓였습니다
  alternatives_korean:
  - 다윗의 머리에 있었습니다
  - 다윗이 머리에 썼습니다
  lexicon: HALOT
  rationale: 히브리어는 결과 상태를 말하므로, 한국어에서는 관이 다윗의 머리에 놓인 상태를 자연스럽게 표현했습니다.
- source_word: וּשְׁלַל הָעִיר הוֹצִיא הַרְבֵּה מְאֹד
  english_pob_choice: he carried off very much plunder from the city
  chosen_korean: 그 도시의 전리품을 매우 많이 가져왔습니다
  alternatives_korean:
  - 그 도시의 노획물을 매우 많이 옮겨왔습니다
  - 그 도시의 전리품을 아주 많이 빼앗아 왔습니다
  lexicon: HALOT
  rationale: 전쟁 맥락의 שָׁלָל은 '전리품'이 가장 분명하며, הוֹצִיא는 단순한 '가져오다'보다 약탈의 뉘앙스를 과하지 않게 담는 표현으로 처리했습니다.
theological_decisions:
- issue: מַלְכָּם을 왕으로 볼지, 암몬 족속의 신 이름으로 볼지
  chosen_reading: 본문에서는 '그들의 왕'으로 번역하고, 대안 읽기는 각주로만 남깁니다.
  alternative_readings:
  - 밀곰(Milcom)
  - 말감(Malcam)
  rationale: 형태와 바로 이어지는 소유격 문맥이 왕을 가리키는 읽기에 더 잘 맞지만, 자음상 신명 해석도 가능하므로 본문을 단정적으로 닫지 않고 대안을 보존합니다.
  doctrine_reference: 애매성이 실제로 존재할 때는 본문에서 해소하지 말고, 주석과 각주로 긴장을 유지합니다.
