base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
  footnotes:
  - marker: a
    text: Hebrew Jehoaddah; some English traditions read 'Jehoadah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아하스는 여호아다를 낳았고, 여호아다는 알레멧과 아스마웻과 즈므리를 낳았으며, 즈므리는 모사를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 Jehoaddah이며, 일부 영어 전통은 ‘Jehoadah’로 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생산했습니다
  lexicon: HALOT
  rationale: 계보 문맥에서 ילד 히필은 직접적인 부계 출생을 뜻하므로, 자연스럽고 현대적인 계보 표현인 ‘낳았습니다’를 사용했습니다.
- source_word: יְהוֹעַדָּה
  english_pob_choice: Jehoaddah
  chosen_korean: 여호아다
  alternatives_korean:
  - 여호아닷
  - 여호아다하
  lexicon: 고유명사 음역
  rationale: 고유명사는 번역하지 않고 음역하며, 히브리어 자음과 영어 POB의 Jehoaddah를 반영해 ‘여호아다’로 옮겼습니다.
- source_word: עָלֶמֶת
  english_pob_choice: Alemeth
  chosen_korean: 알레멧
