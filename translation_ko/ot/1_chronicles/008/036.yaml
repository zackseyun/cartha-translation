  - 아레멧
  lexicon: 고유명사 음역
  rationale: 표준적인 성경 고유명사 음역을 따랐습니다.
- source_word: עַזְמָוֶת
  english_pob_choice: Azmaveth
  chosen_korean: 아스마웻
  alternatives_korean:
  - 아즈마벳
  - 아즈마웻
  lexicon: 고유명사 음역
  rationale: 히브리어 자음 구조를 반영해 음역했으며, 한국어에서 끝소리와 자음군을 자연스럽게 처리했습니다.
- source_word: זִמְרִי
  english_pob_choice: Zimri
  chosen_korean: 즈므리
  alternatives_korean:
  - 짐리
  - 지므리
  lexicon: 고유명사 음역
  rationale: 두 번 나오는 동일 인명을 일관되게 음역했습니다.
- source_word: מוֹצָא
  english_pob_choice: Moza
  chosen_korean: 모사
  alternatives_korean:
  - 모자
  - 모짜
  lexicon: 고유명사 음역
  rationale: 해당 고유명사를 한국어 음역으로 옮겼고, 영어 POB의 표기 차이를 고려해 자연스러운 표준 표기를 택했습니다.
theological_decisions:
- issue: 계보의 반복 접속과 동사 선택
  chosen_reading: 히브리어의 병렬적 계보 서술을 살려 ‘낳았고… 낳았으며… 낳았습니다’로 직선적으로 표현했습니다.
  alternative_readings:
  - ‘아들을 두었고’
  - ‘~의 아버지가 되었고’
  rationale: 원문은 단순한 족보 진술이므로, 의미를 덧붙이지 않고 부계 계보의 직접성을 드러내는 표현을 유지했습니다.
  doctrine_reference: 성경 족보의 역사서술 일관성
