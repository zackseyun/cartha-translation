  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 번역하지 않고 음역했습니다. 영어 POB의 Ishmerai를 따라 첫 음절의 이중 자음을 한국어에서 자연스럽게 풀어 적었습니다.
- source_word: יִזְלִיאָה
