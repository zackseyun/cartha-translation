  rationale: 족보 문맥의 בְּנֵי를 한국어에서는 소유 관계와 계보 관계가 드러나도록 ‘~의 아들들’로 옮기고, 영어 POB가 보충한 관계 동사에 해당하는 자연스러운 과거형을 사용했습니다.
