  - marker: b
    text: Some English traditions spell the names 'Jishmerai' and 'Jizliah.'
    reason: alternative_reading
translation:
  language: ko
  text: 이스므라이, 이즐리야[b], 그리고 요밥은 엘파알의 아들들이었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
