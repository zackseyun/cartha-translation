    text: 히브리어 본문은 ‘엘파알의 아들들’이라고 하며 동사를 명시하지 않습니다. 한국어에서는 족보 문맥의 관계를 자연스럽게 나타내기 위해 ‘이었습니다’를 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름들은 일부 영어 성경 전통에서 ‘Jishmerai’와 ‘Jizliah’로도 적습니다.
    reason: alternative_reading
