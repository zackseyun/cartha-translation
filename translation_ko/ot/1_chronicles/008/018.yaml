base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/018.yaml
  text: Ishmerai[a], Izliah[b], and Jobab were the sons of Elpaal.
  footnotes:
  - marker: a
    text: Hebrew simply reads 'sons of Elpaal'; 'were' is supplied for natural English in this genealogical list.
    reason: lexical_alternative
  - marker: b
    text: Some English traditions spell the names 'Jishmerai' and 'Jizliah.'
    reason: alternative_reading
translation:
  language: ko
  text: 이슈메라이[a], 이즐리아[b], 그리고 요밥은 엘파알의 아들들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 단지 ‘엘파알의 아들들’이라고만 적고 있어, 한국어에서는 족보 문맥을 자연스럽게 하기 위해 관계를 풀어 썼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름들은 영어 전통에서 ‘Jishmerai’, ‘Jizliah’로도 적힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁמְרַי
  english_pob_choice: Ishmerai
  chosen_korean: 이슈메라이
  alternatives_korean:
