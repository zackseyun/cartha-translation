translation:
  language: ko
  text: 베냐민은 맏아들 벨라와 둘째 아스벨, 셋째 아하라를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 아하라로 적습니다. 일부 영어 역본은 Ahrah로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וּבִנְיָמִן
  english_pob_choice: Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 벤야민
  - 베냐민(가문 명칭으로서)
  lexicon: 고유명사 표기 관행
  rationale: 족보 문맥의 고유명사로서 한국어 성경에서 널리 쓰이는 표기를 따랐습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 아버지가 되었습니다
  lexicon: HALOT
  rationale: 족보에서의 הילד 히필은 ‘낳다/생기게 하다’의 의미가 자연스러우므로, 현대 한국어에서는 간결한 ‘낳았습니다’가 가장 직접적입니다.
- source_word: בְּכֹרוֹ
  english_pob_choice: his firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장남
  lexicon: HALOT
  rationale: ‘firstborn’의 출생 순서를 살리면서 한국어로도 자연스럽게 들리는 족보 표현을 택했습니다.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  english_pob_choice: the second / the third
  chosen_korean: 둘째 / 셋째
  alternatives_korean:
  - 두 번째 / 세 번째
  - 제2 / 제3
  lexicon: HALOT
  rationale: 정관사가 붙은 서수 표현을 가족 순서 표기로 자연스럽게 옮겼습니다.
- source_word: אַשְׁבֵּל / וְאַחְרַח
  english_pob_choice: Ashbel / Aharah
  chosen_korean: 아스벨 / 아하라
  alternatives_korean:
  - 아쉬벨 / 아하라
  - 아스벨 / 아흐라
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 자음형을 반영한 음역을 사용했고, 본문의 형태를 따라 ‘Aharah’에 해당하는 아하라를 유지했습니다.
theological_decisions:
- issue: 족보 문맥의 동사 시제와 서술 방식
  chosen_reading: 과거 서술로 ‘낳았습니다’라고 옮겨, 계보 기록의 사실 진술성을 살렸습니다.
  alternative_readings:
  - 현재형 ‘낳는다’
  - 문어체 ‘낳았더라’
  rationale: 히브리어 족보의 간결한 진술을 현대 한국어 서술문으로 자연스럽게 재현하는 것이 적절합니다.
  doctrine_reference: 성경 족보의 역사적 서술 방식
