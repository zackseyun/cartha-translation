translation:
  language: ko
  text: 에섹의 형제들의 아들들은 이렇습니다. 울람은 그의 맏아들[a]이고, 여우스는 둘째이며, 엘리벨렛은 셋째입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에섹의 형제들의 아들들은…’입니다. 히브리어는 접속사로 시작하지만, 영어 족보체에서는 이를 자연스럽게 생략하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 그리고 아들들은
  - 그 아들들은
  lexicon: BDB
  rationale: 족보 문맥의 집합 표현을 자연스러운 한국어로 옮기되, 영어 POB처럼 서술의 첫머리에서 관계를 간명하게 제시했습니다.
- source_word: אָחִיו
  english_pob_choice: his brother
  chosen_korean: 그의 형제
  alternatives_korean:
  - 그의 형
  - 그의 동생
  lexicon: HALOT
  rationale: 히브리어 אָח는 기본적으로 ‘형제’이므로, 족보 문맥에서 혈족 의미를 약화하지 않고 그대로 살렸습니다.
- source_word: בְּכֹרוֹ
  english_pob_choice: his firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 아들
  - 장자
  lexicon: HALOT
  rationale: ‘firstborn’의 출생 순서와 친족관계를 함께 드러내는 말로 ‘맏아들’을 택해, 문자적이면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: יְעוּשׁ
  english_pob_choice: Jeush
  chosen_korean: 여우스
  alternatives_korean:
  - 예우스
  - 예우쉬
  lexicon: 고유명사
  rationale: 히브리어 인명은 현대 외래어 표기 원칙에 따라 음역했고, 본문 표기 일관성을 위해 통용형을 따랐습니다.
theological_decisions:
- issue: 족보 문장의 관형 관계를 한국어로 어떻게 드러낼지
  chosen_reading: ‘에섹의 형제들의 아들들’로 직역적 관계를 유지했습니다.
  alternative_readings:
  - ‘에섹의 형제 에섹의 아들들’로 단순화
  - ‘에섹의 친족의 아들들’로 완화
  rationale: 본문은 혈연적 연결을 반복적으로 보여 주는 족보이므로, 관계를 축소하지 않고 그대로 드러내는 것이 본문의 의도를 가장 잘 보존합니다.
  doctrine_reference: 족보 본문 해석 원칙
- issue: ‘firstborn’을 장자/첫째로 옮길지
  chosen_reading: ‘맏아들’로 옮겼습니다.
  alternative_readings:
  - ‘장자’
  - ‘첫째’
  rationale: 장자라는 법적·상속적 뉘앙스보다 여기서는 출생 순서가 핵심이므로, 가족관계와 순서를 함께 담는 ‘맏아들’이 가장 적절합니다.
  doctrine_reference: 본문의 서술 기능 보존
