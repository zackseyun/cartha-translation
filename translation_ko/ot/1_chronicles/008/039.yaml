  terminology: 에섹, 울람, 여우스, 엘리벨렛 및 ‘맏아들’은 적절합니다. ‘형제’는 אָחִיו의 기본 의미를 보존합니다. 각주에서는 영어 족보체가 아니라 한국어 문체를 언급해야 합니다.
