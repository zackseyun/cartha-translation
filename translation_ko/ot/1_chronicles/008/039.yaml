  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
  footnotes:
  - marker: a
    text: Or 'And the sons of Eshek, his brother…' The Hebrew begins with a conjunction, which English genealogy style often leaves implicit.
