  rationale: 본문은 세 명의 남성 이름을 나열하는 족보 공식이므로, 의미를 넓혀 흐리지 않고 원문의 계보적·성별 표지를 보존하는 편이 더 정확합니다.
  doctrine_reference: 족보 본문 해석 원칙
