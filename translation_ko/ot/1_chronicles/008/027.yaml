  text: וְ/יַעֲרֶשְׁיָ֧ה וְ/אֵלִיָּ֛ה וְ/זִכְרִ֖י בְּנֵ֥י יְרֹחָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/027.yaml
  text: Jareshiah[a], Elijah, and Zichri were the sons of Jeroham.
  footnotes:
  - marker: a
    text: Or 'children of' or, in a broader genealogical sense, 'descendants of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야레시야, 엘리야, 그리고 지그리는 여로함의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들들’은 족보 문맥에서 ‘후손들’로도 넓게 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  english_pob_choice: Jareshiah
  chosen_korean: 야레시야
  alternatives_korean:
  - 자레시야
  - 야아레시야
  lexicon: 고유명사
  rationale: 히브리어 고유명사를 음역하되, 영어 POB의 표준형 Jareshiah를 한국어 표기에 맞게 옮겼습니다.
- source_word: אֵלִיָּה
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 엘리하
  - 엘리야후
  lexicon: 고유명사
  rationale: 이 이름은 한국어 성경에서 널리 정착된 엘리야를 따르는 것이 가장 자연스럽고 식별성이 높습니다.
- source_word: זִכְרִי
  english_pob_choice: Zichri
  chosen_korean: 지그리
  alternatives_korean:
  - 시크리
  - 지크리
  lexicon: 고유명사
  rationale: 히브리어 자음과 모음을 따라 음역했으며, 영어 POB의 Zichri에 대응하는 한국어 표기입니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 기본적으로 '아들들'이 가장 직접적이며, 여기서는 남성 이름들 목록이므로 영어 POB의 'sons of'를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 족보 공식 표현의 성별·계보 의미
  chosen_reading: ‘아들들’로 옮겨 직계 남성 계보를 분명히 했습니다.
  alternative_readings:
  - ‘자녀들’
  - ‘후손들’
  rationale: 본문은 세 명의 남성 이름을 나열하는 족보 공식이므로, 의미를 넓혀 흐리지 않고 원문의 계보적·성별 표지를 보존하는 편이 더 정확합니다.
  doctrine_reference: 족보 본문 해석 원칙
