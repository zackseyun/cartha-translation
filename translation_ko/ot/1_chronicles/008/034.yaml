base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
  footnotes:
  - marker: a
    text: The parallel genealogy in 2 Samuel 9:12 names this figure 'Mica,' while 1 Chronicles here has 'Micah.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 여호나단의 아들은 메리브바알이었습니다[a]. 메리브바알은 미가의 아버지가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사무엘하 9:12의 평행 족보에서는 이 인물의 이름이 히브리어로 ‘מִיכָא’로 표기되지만, 여기에서는 ‘מִיכָה’로 표기됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  english_pob_choice: And the son of
  chosen_korean: 그리고 …의 아들은
  alternatives_korean:
  - 또 …의 아들은
  - …의 아들은
  lexicon: HALOT
  rationale: 족보 문맥의 단순한 연결을 살려 ‘그리고’로 이어 주고, בן은 한국어 족보 표현인 ‘아들은’으로 옮겼습니다.
- source_word: יְהוֹנָתָן
  english_pob_choice: Jehonathan
  chosen_korean: 여호나단
  alternatives_korean:
  - 요나단
  - 여호나탄
  lexicon: HALOT
  rationale: 히브리어 표기 יְהוֹנָתָן을 음역하되, 한국어에서 널리 쓰이는 성경 인명 형태인 ‘여호나단’을 택해 מקור 형태를 드러냈습니다.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  english_pob_choice: Merib-baal
  chosen_korean: 메리브바알
  alternatives_korean:
  - 메립바알
  - 메리브-바알
  lexicon: HALOT
  rationale: 두 요소로 적힌 이름을 한 인명으로 보존하기 위해 음역을 붙여 썼고, 바알 요소를 삭제하거나 완화하지 않았습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 아들을 두었습니다
  lexicon: HALOT
  rationale: 족보에서 히필 ילד는 직접 후손 관계를 나타내므로, 현대 한국어에서 자연스럽고 간결한 ‘낳았습니다’로 옮겼습니다.
- source_word: מִיכָה
  english_pob_choice: Micah
  chosen_korean: 미가
  alternatives_korean:
  - 미가야
  - 미카
  lexicon: HALOT
  rationale: 본문의 인명 מִיכָה를 한국어 성경에서 통용되는 ‘미가’로 음역했습니다.
theological_decisions:
- issue: 바알 요소를 포함한 인명 보존
  chosen_reading: 메리브바알로 음역해 ‘바알’ 요소를 유지했습니다.
  alternative_readings:
  - 에둘러 다른 뜻으로 바꾸는 번역
  - 바알 요소를 삭제한 형태
  rationale: 본문의 인명 형태 자체가 자료적 정보이므로, 우상신 이름 요소를 완화하지 않고 그대로 드러내는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 족보 본문에서의 역사적-문헌적 충실성
