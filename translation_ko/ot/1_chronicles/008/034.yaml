  source_fidelity: 본문의 인명 계보와 반복된 메리브바알 표기는 충실히 반영되었습니다. 다만 히브리어 הוֹלִיד는 남성 주어인 메리브바알이 후손을 낳게 했다는 계보 용례이므로, 현대 한국어에서는 ‘낳았습니다’보다 ‘낳았습니다’의 의미를 분명히 하는 ‘아버지가 되었습니다’ 또는 ‘낳았습니다’ 대신 ‘낳았습니다’가 아닌 표현이 더 적절합니다.
