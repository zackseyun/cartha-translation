  chosen_korean: 아히오
  alternatives_korean:
  - 아효
  - 아히요
  lexicon: HALOT
  rationale: אַחְיוֹ는 고유명사이므로 뜻풀이보다 음역이 적절하며, 한국어 표기는 현대 외래어 표기 감각에 맞게 ‘아히오’로 옮겼습니다.
- source_word: וָזָכֶר
  english_pob_choice: and Zecher
  chosen_korean: 제헬
  alternatives_korean:
  - 자헬
  - 제허
  lexicon: HALOT
  rationale: 자음 זָכֶר의 영어 POB ‘Zecher’를 참조하되, 한국어 음역에서는 어말 -er를 그대로 재현하기보다 이름의 표기를 안정적으로 남기는 쪽을 택했습니다.
