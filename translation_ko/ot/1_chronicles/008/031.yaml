  - 아효
  - 아히요
  lexicon: HALOT
  rationale: אַחְיוֹ는 고유명사이므로 뜻풀이보다 음역이 적절하며, 한국어 표기는 현대 외래어 표기 감각에 맞게 ‘아히오’로 옮겼습니다.
- source_word: וָזָכֶר
  english_pob_choice: and Zecher
  chosen_korean: 제헬
  alternatives_korean:
