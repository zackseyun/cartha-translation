source:
  edition: WLC
  text: וְ/אֶת יְע֥וּץ וְ/אֶת שָֽׂכְיָ֖ה וְ/אֶת מִרְמָ֑ה אֵ֥לֶּה בָנָ֖י/ו רָאשֵׁ֥י אָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
  footnotes:
  - marker: a
    text: Or “heads of clans.” The Hebrew literally reads “heads of fathers,” an idiom for leading ancestral households or family groups.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예우스와 사기야와 미르마입니다. 이들은 그의 아들들이며, 조상의 가문들의 우두머리들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가문들의 우두머리들.” 히브리어는 문자적으로 “아버지들의 우두머리들”이라고 되어 있으며, 조상 가문이나 가족 집단의 지도자를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  english_pob_choice: Jeuz
  chosen_korean: 예우스
  alternatives_korean:
  - 제우스
  - 예우즈
  lexicon: 고유명사
  rationale: 고유명사이므로 음역했고, 히브리어 자음과 모음을 무리 없이 옮기는 표준적인 한국어 표기를 택했습니다.
- source_word: שָׂכְיָה
  english_pob_choice: Sachia
  chosen_korean: 사기야
  alternatives_korean:
  - 사키야
  - 삭히야
  lexicon: 고유명사
  rationale: 고유명사 음역으로 처리했으며, 영어 POB의 Sachia에 대응하는 자연스러운 한국어 음가를 반영했습니다.
- source_word: מִרְמָה
  english_pob_choice: Mirmah
  chosen_korean: 미르마
  alternatives_korean:
  - 미라마
  - 속임수
  lexicon: 고유명사
  rationale: 문맥상 일반명사 ‘속임수’가 아니라 인명으로 보이므로 뜻풀이하지 않고 음역했습니다.
- source_word: רָאשֵׁי אָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 조상의 가문들의 우두머리들
  alternatives_korean:
  - 가문들의 우두머리들
  - 족장들
  - 조상 가문의 우두머리들
  lexicon: HALOT
  rationale: ‘아버지들/조상들’의 관용적 표현을 한국어에서 이해 가능하도록 풀되, 계보적 집단을 뜻하는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 계보 문맥에서의 사회적 칭호
  chosen_reading: ‘머리/우두머리’의 직역적 이미지를 유지하되, 한국어에서는 ‘우두머리들’로 풀어 계보 지도층을 나타냈습니다.
  alternative_readings:
  - 족장들
  - 지도자들
  rationale: 히브리어의 비유적 표현을 너무 평탄하게 ‘족장들’로 고정하기보다, 원문의 ‘heads’ 이미지를 드러내는 쪽이 더 직접적입니다.
  doctrine_reference: 문맥상 역사-계보 서술
