  - 속임수
  lexicon: 고유명사
  rationale: 문맥상 일반명사 ‘속임수’가 아니라 인명으로 보이므로 뜻풀이하지 않고 음역했습니다.
- source_word: רָאשֵׁי אָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 조상의 가문들의 우두머리들
