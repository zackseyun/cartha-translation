revisions:
- from: 그리고 예우스와 사기야와 미르마입니다. 이들은 그의 아들들이며, 조상의 가문들의 우두머리들이었습니다.[a]
  to: 여우스와 사갸와 미르마입니다. 이들은 그의 아들이며 조상 가문의 우두머리들입니다.[a]
  rationale: 히브리어 원문을 우선하여 두 인명의 한국어 음역을 ‘여우스’와 ‘사갸’로 바로잡았습니다. רָאשֵׁי אָבוֹת의 계보적 관용 의미는 본문에서 자연스러운 ‘조상 가문의 우두머리들’로 유지하고, 직역과 대안은 각주에 보존했습니다. 본문의 명사절은 현대 한국어 합쇼체에 맞춰 ‘입니다’로 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:08:34Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 계보 목록과 ‘그의 아들들, 조상 가문의 우두머리들’이라는 무동사 서술은 대체로 잘 반영되었습니다. 그러나 인명 음역 ‘예우스’와 ‘사기야’는 각각 יְעוּץ와 שָׂכְיָה의 히브리어 발음 및 한국어 성경의 통용 표기에서 벗어납니다.
  naturalness: ‘조상의 가문들의 우두머리들’은 소유·복수 표현이 겹쳐 다소 부자연스럽습니다. ‘조상 가문의 우두머리들’이 의미를 유지하면서 자연스럽습니다. 무동사 계보 서술에는 현재형 합쇼체 ‘입니다’가 적절합니다.
  terminology: רָאשֵׁי אָבוֹת는 계보 집단의 지도자를 가리키므로 ‘조상 가문의 우두머리들’로 옮기고, 각주에서 히브리어의 직역 표현과 관용적 의미를 밝혔습니다. ‘족장들’은 가능하지만 원문의 ‘머리들’ 이미지를 더 약화하므로 본문에는 채택하지 않았습니다.
  issues:
  - severity: medium
    issue: 인명 ‘예우스’의 음역
    rationale: יְעוּץ는 여우스(Yeush)에 해당합니다. ‘예우스’는 히브리어 모음 배열을 정확히 반영하지 못하며, 그리스 신 이름을 연상시킬 가능성도 있습니다.
  - severity: medium
    issue: 인명 ‘사기야’의 음역
    rationale: שָׂכְיָה는 사갸(Sakya)에 해당합니다. ‘사기야’는 자음 כ의 음가와 히브리어 모음 구조를 부정확하게 반영합니다.
  - severity: low
    issue: ‘조상의 가문들의 우두머리들’의 중첩된 표현
    rationale: אָבוֹת가 계보상 조상 가문/부계 집단을 뜻하는 관용 표현이므로, ‘조상 가문의 우두머리들’이 더 자연스럽고 충분히 충실합니다.
  revised_text: 여우스와 사갸와 미르마입니다. 이들은 그의 아들이며 조상 가문의 우두머리들입니다.[a]
