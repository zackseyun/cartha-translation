  - 가문들의 우두머리들
  - 족장들
  - 조상 가문의 우두머리들
  lexicon: HALOT
  rationale: ‘아버지들/조상들’의 관용적 표현을 한국어에서 이해 가능하도록 풀되, 계보적 집단을 뜻하는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 계보 문맥에서의 사회적 칭호
  chosen_reading: ‘머리/우두머리’의 직역적 이미지를 유지하되, 한국어에서는 ‘우두머리들’로 풀어 계보 지도층을 나타냈습니다.
  alternative_readings:
  - 족장들
  - 지도자들
  rationale: 히브리어의 비유적 표현을 너무 평탄하게 ‘족장들’로 고정하기보다, 원문의 ‘heads’ 이미지를 드러내는 쪽이 더 직접적입니다.
  doctrine_reference: 문맥상 역사-계보 서술
