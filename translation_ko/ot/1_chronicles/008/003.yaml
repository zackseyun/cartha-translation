translation:
  language: ko
  text: 벨라의 아들은 앗달과 게라와 아비훗입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְי֥וּ בָנִ֖ים לְבָלַע
  english_pob_choice: Bela had sons
  chosen_korean: 베라에게는 아들들이 있었습니다
  alternatives_korean:
  - 베라가 아들들을 두었습니다
  - 베라에게 아들들이 있었습니다
  lexicon: WLC; genealogical idiom
  rationale: 히브리어의 ‘있었다/되었다’ 구조는 족보에서 ‘~에게 아들들이 있었다’라는 소유·관계 관용구로 자연스럽게 옮기는 것이 가장 정확합니다.
- source_word: בָנִים
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: WLC
  rationale: 이 족보 문맥에서는 בָנִים이 일반적 ‘자녀’보다 남자 후손인 ‘아들들’을 뜻하는 것이 분명하므로 성별을 유지했습니다.
- source_word: אַדָּר
  english_pob_choice: Addar
  chosen_korean: 아다르
  alternatives_korean:
  - 아달
  - 아데르
  lexicon: Proper name transliteration
  rationale: 고유명사는 현대 한국어 음역으로 옮기되, 영어 POB의 ‘Addar’에 대응하는 히브리어 이름을 ‘아다르’로 적었습니다.
- source_word: וְגֵרָא
  english_pob_choice: Gera
  chosen_korean: 게라
  alternatives_korean:
  - 게라아
  - 게라
  lexicon: Proper name transliteration
  rationale: 히브리어 고유명사 גֵרָא를 한국어 성경 관용에 맞는 음역 ‘게라’로 옮겼습니다.
- source_word: וַאֲבִיהוּד
  english_pob_choice: Abihud
  chosen_korean: 아비훗
  alternatives_korean:
  - 아비훅
  - 아비후드
  lexicon: Proper name transliteration
  rationale: 히브리어 אביהוד의 어미를 한국어 음절 구조에 맞게 ‘-훗’으로 옮겨, 영어 음역 ‘Abihud’의 소리를 최대한 가깝게 반영했습니다.
theological_decisions:
- issue: 족보식 서술의 직역과 자연스러운 한국어 사이의 균형
  chosen_reading: ‘베라에게는 아들들이 있었습니다’로 족보 관용구를 살리면서도 한국어로 자연스럽게 읽히게 했습니다.
  alternative_readings:
  - ‘베라는 아들들이 있었습니다’
  - ‘베라는 아들들을 두었습니다’
  rationale: 본문은 사건 서술이 아니라 족보 항목이므로, 존재 서술을 통해 혈통 관계를 간명하게 제시하는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: 족보 본문 번역 원칙
