  yaml_path: translation/ot/1_chronicles/008/003.yaml
  text: 'Bela had sons: Addar[a], Gera[b], and Abihud.'
  footnotes:
  - marker: a
    text: 'Or, more literally, ''And sons were to Bela: Addar, Gera, and Abihud.'''
