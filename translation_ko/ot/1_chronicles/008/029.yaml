  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기브온의 창시자’, ‘기브온의 우두머리’. 히브리어는 문자적으로 ‘기브온의 아버지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְע֥וֹן
  english_pob_choice: In Gibeon
  chosen_korean: 기브온에
  alternatives_korean:
  - 그리고 기브온에
  - 기브온에서
  lexicon: HALOT
  rationale: 전치사 בְּ는 위치를 나타내며, 한국어에서는 간결한 처소 조사로 옮기는 것이 가장 자연스럽습니다.
- source_word: יָשְׁב֖וּ
  english_pob_choice: lived
  chosen_korean: 살았고
  alternatives_korean:
  - 거주했고
  - 머물렀고
  lexicon: HALOT
  rationale: 문맥이 족보적·지리적 주석이므로 ‘살다’가 현대 한국어에서 가장 자연스럽고, ‘거주하다’보다 덜 관료적입니다.
- source_word: אֲבִ֣י גִבְע֑וֹן
  english_pob_choice: the father of Gibeon
  chosen_korean: 기브온의 아버지
  alternatives_korean:
  - 기브온의 창시자
  - 기브온의 우두머리
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘기브온의 아버지’이므로 본문에서는 그대로 살리고, ‘아버지’가 창건자/수장/조상일 수 있다는 여지는 본문 주석으로 두는 것이 원문 투명성에 맞습니다.
- source_word: מַעֲכָֽה
  english_pob_choice: Maacah
  chosen_korean: 마아가
  alternatives_korean:
  - 마가
  - 마아카
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 통용되는 성서 인명 표기를 따르되, 한국어 음역에서는 ‘마아가’가 가장 안정적입니다.
theological_decisions:
- issue: אֲבִי גִבְעוֹן의 의미 범위
  chosen_reading: 본문에는 ‘기브온의 아버지’로 두고, 그 의미가 창시자·수장·조상일 가능성은 주석으로 열어 둡니다.
  alternative_readings:
  - 기브온의 창시자
  - 기브온의 우두머리
  rationale: 히브리어 관용구의 다의성을 본문에서 단정적으로 좁히지 않고, 독자가 원문이 지닌 역사적·족보적 가능성을 보도록 하는 것이 더 충실합니다.
  doctrine_reference: 역사서의 족보/기원 표지 표현
