  - 헤벨, 미샴, 그리고 샤메드
  lexicon: 고유명사 음역
  rationale: 히브리어 철자에 직접 맞추되, 한국어 외래어 표기 관행에 따라 읽기 쉬운 형태로 음역했습니다.
- source_word: הוּא בָּנָה
  english_pob_choice: he built
  chosen_korean: 그가 … 세웠습니다
  alternatives_korean:
  - 그가 … 지었습니다
  - 그는 … 건축했습니다
  lexicon: HALOT
  rationale: בנה의 기본 뜻인 '짓다/세우다'를 살리되, 도성·지역에 대한 서술에서는 '세우다'가 더 자연스럽고 넓은 의미를 담습니다.
- source_word: אֶת אוֹנוֹ וְאֶת לֹד
  english_pob_choice: Ono and Lod
  chosen_korean: 오노와 로드
  alternatives_korean:
  - 오노와 룻
  - 오노와 로드드
  lexicon: 고유명사 음역
  rationale: 히브리어 지명은 원문에 더 직접적인 형태로 옮겼습니다. 영어 관행형인 Lydda는 채택하지 않았습니다.
- source_word: וּבְנֹתֶיהָ
  english_pob_choice: and its villages
  chosen_korean: 그 마을들을
  alternatives_korean:
  - 그 딸들을
  - 주변 마을들을
  - 부속 마을들을
  lexicon: HALOT
  rationale: 직역하면 '그 딸들'이지만, 이는 도시의 종속 마을을 가리키는 관용구이므로 문맥이 드러나도록 '마을들'로 옮겼습니다.
theological_decisions:
- issue: יֵשׁ/וּ pronoun reference in הוּא
  chosen_reading: '''그가''를 세메드에 가장 자연스럽게 연결되는 지시로 두었습니다.'
  alternative_readings:
  - 엘파알의 가족 전체를 가리키는 느슨한 지시
  - 앞선 아들들 중 다른 인물을 가리키는 해석
  rationale: 영어 POB가 지적하듯 3인칭 단수 대명사는 마지막으로 언급된 세메드를 가장 자연스럽게 가리킵니다. 족보 문맥에서 과도한 해석을 피하고 원문의 애매성을 과장하지 않기 위해 간단히 처리했습니다.
  doctrine_reference: 본문 해석상의 지시 대명사 처리
