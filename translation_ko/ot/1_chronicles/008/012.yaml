source:
  edition: WLC
  text: וּ/בְנֵ֣י אֶלְפַּ֔עַל עֵ֥בֶר וּ/מִשְׁעָ֖ם וָ/שָׁ֑מֶד ה֚וּא בָּנָ֣ה אֶת אוֹנ֔וֹ וְ/אֶת לֹ֖ד וּ/בְנֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
  footnotes:
  - marker: a
    text: Literally, 'and its daughters,' a Hebrew idiom for a town's dependent or surrounding villages.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'he' most naturally refers to Shemed, the last named son; some understand it more loosely in relation to the family line.
    reason: alternative_reading
translation:
  language: ko
  text: 엘파알의 아들들은 에벨, 미솜, 그리고 세메드입니다. 그가 오노와 로드와 그 마을들을 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 '그 마을들/딸들'이지만, 이는 도시의 종속 정착지를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: '''그가''는 가장 자연스럽게 마지막으로 언급된 세메드를 가리키지만, 족보 문맥상 가문 전체를 느슨하게 가리킨다고 볼 수도 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  english_pob_choice: The sons of Elpaal
  chosen_korean: 엘파알의 아들들은
  alternatives_korean:
  - 그리고 엘파알의 아들들은
