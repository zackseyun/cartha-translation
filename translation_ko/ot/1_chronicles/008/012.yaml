base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
  footnotes:
  - marker: a
    text: Literally, 'and its daughters,' a Hebrew idiom for a town's dependent or surrounding villages.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'he' most naturally refers to Shemed, the last named son; some understand it more loosely in relation to the family line.
    reason: alternative_reading
translation:
  language: ko
  text: 엘파알의 아들들은 에벨, 미스암, 그리고 샤메드[b]입니다. 그는 오노와 로드와 그에 딸린 마을들[a]을 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 '그 딸들'입니다. 이는 도시의 종속 정착지나 부속 마을들을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그는’은 가장 자연스럽게 마지막으로 언급된 샤메드를 가리키지만, 족보 문맥에서는 가문 계통과 더 느슨하게 관련된 표현으로 이해하는 견해도 있습니다.
    reason: alternative_reading
