  lexicon: HALOT
  rationale: 족보의 표제 구조를 살려 소유격으로 자연스럽게 옮기되, 한국어에서는 문맥상 주어 표지가 불필요하므로 간결하게 처리했습니다.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  english_pob_choice: Eber, Misham, and Shemed
  chosen_korean: 에벨, 미솜, 그리고 세메드
