  rationale: 고유명사는 음역으로 옮기고, 서술 시작의 ו는 한국어에서는 자연스럽게 생략했습니다.
- source_word: וָשֶׁמַע
  english_pob_choice: and Shema
  chosen_korean: 세마
  alternatives_korean:
