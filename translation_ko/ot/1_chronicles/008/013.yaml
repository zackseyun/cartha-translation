  text: וּ/בְרִעָ֣ה וָ/שֶׁ֔מַע הֵ֚מָּה רָאשֵׁ֣י הָ/אָב֔וֹת לְ/יוֹשְׁבֵ֖י אַיָּל֑וֹן הֵ֥מָּה הִבְרִ֖יחוּ אֶת י֥וֹשְׁבֵי גַֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
  footnotes:
  - marker: a
    text: Or 'put to flight' / 'caused to flee.' The Hebrew verb emphasizes causing the inhabitants of Gath to flee; 'drove out' renders the likely result in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'heads of fathers’ houses,' a clan-based family leadership expression.
    reason: cultural_note
translation:
  language: ko
  text: 브리아와 세마는 아얄론 주민들 가운데 있는 조상의 집들의 우두머리들이었습니다[a]. 그들은 가드 주민들을 몰아낸 사람들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '아버지들의 집들의 우두머리들'이라는 족장/가문 지도자 표현을 씁니다.
    reason: source_note
lexical_decisions:
- source_word: וּבְרִעָה
  english_pob_choice: And Beriah
  chosen_korean: 브리아
  alternatives_korean:
  - 그리고 브리아
  - 베리아
  lexicon: HALOT
  rationale: 고유명사는 음역으로 옮기고, 서술 시작의 ו는 한국어에서는 자연스럽게 생략했습니다.
- source_word: וָשֶׁמַע
  english_pob_choice: and Shema
  chosen_korean: 세마
  alternatives_korean:
  - 그리고 세마
  - 쉬마
  lexicon: HALOT
  rationale: 고유명사 음역을 따르되, 한국어 독자에게 더 안정적인 표기인 세마를 택했습니다.
- source_word: רָאשֵׁי הָאָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 조상의 집들의 우두머리들
  alternatives_korean:
  - 아버지들의 집들의 우두머리들
  - 족장들
  - 가문의 우두머리들
  lexicon: HALOT
  rationale: 히브리어의 족보적 사회 구조를 살리면서도 한국어에서 이해 가능한 표현으로 옮겼습니다. 이 표현은 단순한 '가문'보다 원문의 '아버지들의 집' 구조를 더 가깝게 드러냅니다.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  english_pob_choice: among the inhabitants of Aijalon
  chosen_korean: 아얄론 주민들 가운데
  alternatives_korean:
  - 아얄론 주민들을 위해
  - 아얄론 주민들에게
  - 아얄론의 주민들 중에
  lexicon: HALOT
  rationale: ל의 관계를 소속/범위로 이해해, 그들이 아얄론 주민 집단 안의 족장들이었음을 드러냈습니다.
- source_word: הִבְרִיחוּ
  english_pob_choice: drove out
  chosen_korean: 몰아낸
  alternatives_korean:
  - 쫓아낸
  - 도망가게 한
  - 내쫓은
  lexicon: HALOT
  rationale: 히필형의 '떠나게 만들다, 달아나게 하다'라는 강한 인과를 한국어의 자연스러운 동사로 옮겼습니다.
theological_decisions:
- issue: 족보 문맥에서의 강조 구조
  chosen_reading: 한국어에서는 두 번 반복되는 독립 인칭대명사의 강조를 따로 재현하기보다, 문장 구조와 '우두머리들' 및 '몰아낸 사람들이었습니다'로 강조를 살렸습니다.
  alternative_readings:
  - 그들은 아얄론 주민들 가운데 있는 조상의 집들의 우두머리들이었습니다. 그들은 가드 주민들을 몰아낸 사람들이었습니다.
  - 아얄론 주민들 가운데 있는 조상의 집들의 우두머리들이 바로 브리아와 세마였습니다.
  rationale: 히브리어의 הֵמָּה 반복은 강조이지만, 한국어에서는 과잉 반복보다 자연스러운 종결이 더 정확하게 기능합니다.
  doctrine_reference: 문체/담화 구조
