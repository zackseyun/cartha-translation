  - 예루살렘에 정착했습니다
  lexicon: HALOT
  rationale: 계보적 주해 문맥에서 지속적 거주를 뜻하므로, 현대 한국어에서 가장 자연스러운 ‘살았습니다’를 선택했습니다.
theological_decisions:
- issue: 반복되는 지시대명사 ‘이들은 … 이들은’의 처리
  chosen_reading: 첫 문장과 둘째 문장 모두 ‘이들은’으로 반복해 히브리어의 구조적 강조를 살렸습니다.
  alternative_readings:
  - 첫 문장을 ‘이들은 …’으로 하고 둘째는 대명사를 생략함
  - 둘째 문장을 ‘그들은’으로 바꿈
  rationale: 본문의 반복은 단순 중복이 아니라 계보적 목록의 강조 장치이므로, 한국어에서도 이를 보존하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 본문 이해의 문학적 구조 보존
