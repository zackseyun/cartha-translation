lexical_decisions:
- source_word: וֶ/אֱלִיעֵנַ֥י
  english_pob_choice: and Elienai
  chosen_korean: 그리고 엘리에나이
  alternatives_korean:
  - 그리고 엘리-에나이
  lexicon: HALOT
  rationale: 접속사 ו는 앞 항목을 잇는 ‘그리고’로 옮기고, 고유명사는 번역하지 않고 음역했습니다. 영어 POB의 Elienai에 맞춰 한국어에서도 자연스러운 음역형을 택했습니다.
- source_word: וְ/צִלְּתַ֖י
  english_pob_choice: and Zillethai
  chosen_korean: 그리고 질르다이
  alternatives_korean:
  - 그리고 질레타이
  - 그리고 질르타이
  lexicon: HALOT
  rationale: יִ/צִלְּתַי의 어형을 보존하면서 한국어 음역 규칙에 따라 자음군과 어말 이중 모음을 자연스럽게 옮겼습니다. 영어 POB의 Zillethai를 과도하게 분절하지 않고 읽기 쉬운 형태로 반영했습니다.
- source_word: וֶ/אֱלִיאֵֽל
  english_pob_choice: and Eliel
  chosen_korean: 그리고 엘리엘
  alternatives_korean:
  - 그리고 엘리엘
  lexicon: HALOT
  rationale: 마지막 이름도 같은 방식으로 음역하고, 히브리어의 신명 요소를 한국어로 풀이하지 않고 고유명사로 보존했습니다.
