id: 1CH.8.6
reference: 1 Chronicles 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
  footnotes:
  - marker: a
    text: Hebrew 'heads of fathers’ houses' refers to clan or ancestral-household leaders.
    reason: cultural_note
  - marker: b
    text: Or 'and they carried them away into exile to Manahath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 에훗의 아들들입니다. 이들은 게바의 주민들을 위한 조상 가문의 우두머리들이었으며, 그들을 마나핫으로 사로잡아 옮겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘조상 가문의 우두머리들’은 씨족 또는 조상 가정의 지도자를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그들이 그들을 마나핫으로 사로잡아 옮겼습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אֵחוּד
  english_pob_choice: the sons of Ehud
  chosen_korean: 에훗의 아들들
  alternatives_korean:
  - 에훗의 자손들
  - 에훗의 후손들
  lexicon: HALOT
  rationale: 족보 문맥에서는 직역형인 ‘아들들’이 혈통 표지를 가장 자연스럽고 정확하게 드러냅니다.
- source_word: רָאשֵׁי אָבוֹת
  english_pob_choice: the heads of fathers’ houses
  chosen_korean: 조상 가문의 우두머리들
  alternatives_korean:
  - 부계 가문의 수장들
  - 아버지들의 집안 우두머리들
  - 가문들의 우두머리들
  lexicon: HALOT
  rationale: 히브리어의 기술적 족보 표현을 한국어로 풀되, clan/household 지도자라는 구조를 유지했습니다.
- source_word: לְיֹשְׁבֵי גֶבַע
  english_pob_choice: for the inhabitants of Geba
  chosen_korean: 게바의 주민들을 위한
  alternatives_korean:
  - 게바 주민들을 위한
  - 게바 주민들에 대한
  - 게바 거주자들을 위해
  lexicon: HALOT
  rationale: לְ의 관계 표지를 과도하게 해석하지 않고, 이 우두머리들이 ‘게바의 주민들’과 관련된 존재임을 드러내는 방식으로 옮겼습니다.
- source_word: וַיַּגְלוּם
  english_pob_choice: and they carried them into exile
  chosen_korean: 그들을 사로잡아 옮겼습니다
  alternatives_korean:
  - 그들을 포로로 끌고 갔습니다
  - 그들을 유배로 보냈습니다
  - 그들을 사로잡아 유배시켰습니다
  lexicon: HALOT
  rationale: 히필의 גלה는 강제 이주/유배를 뜻하므로 ‘사로잡아 옮기다’로 옮겨 포로화와 이동 강제를 함께 살렸습니다.
- source_word: אֶל מָנָחַת
  english_pob_choice: to Manahath
  chosen_korean: 마나핫으로
  alternatives_korean:
  - 마나핫으로 향하여
  - 마나핫에
  lexicon: HALOT
  rationale: 방향격을 반영해 목적지 이동을 자연스럽게 표현했습니다.
