theological_decisions:
- issue: 대명사 הוּא의 지시 대상
  chosen_reading: ‘그가’로 두어, 가장 자연스럽게는 게라를 가리키는 것으로 남겨 두었습니다.
  alternative_readings:
  - ‘그가’가 아니라 앞선 인물 전체를 가리킨다고 명시함
  - 문제를 해결하기 위해 본문을 재구성함
  rationale: 히브리어는 단수 대명사를 사용하지만 문맥상 계보가 난해하므로, 해석을 과도하게 정리하지 않고 본문의 애매함을 보존하는 것이 적절합니다.
  doctrine_reference: 본문비평/주해상의 난점 보존
- issue: גלה 히필의 결과 표현
  chosen_reading: ‘포로로 끌려가게 하였습니다’로 번역해, 단순한 ‘추방’보다 사동성과 강제성을 살렸습니다.
  alternative_readings:
  - 추방하였습니다
  - 유배시켰습니다
  rationale: 문맥상 실제로 포로 상태로 옮겨지게 한 행위를 나타내므로, 한국어에서도 강제 이동의 뉘앙스를 분명히 하는 편이 원문에 가깝습니다.
  doctrine_reference: 사동/행위 뉘앙스 보존
