  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
  footnotes:
  - marker: a
    text: 'Hebrew: ''he carried them into exile.'' The subject of ''he'' is syntactically singular, most naturally referring to Gera, though the genealogy in this section is textually and syntactically difficult.'
    reason: alternative_reading
  - marker: b
    text: 'Or ''exiled them'' or ''deported them.'' The Hebrew verb is causative: ''caused them to go into exile.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나아만, 아히야, 그리고 게라—그가 그들을 포로로 끌려가게 하였고 우자와 아히후드를 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 대명사 ‘그가’를 사용합니다. 가장 자연스럽게는 게라를 가리키지만, 이 계보는 문법적으로도 해석상으로도 난해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사는 사동형으로, 문자적으로는 ‘그들을 포로로 가게 하다/가도록 만들다’의 뜻입니다.
    reason: lexical_alternative
