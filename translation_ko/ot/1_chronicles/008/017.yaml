- source_word: וּ/מְשֻׁלָּ֖ם
  english_pob_choice: and Meshullam
  chosen_korean: 메술람
  alternatives_korean:
  - 메슐람
  - 메슐람
  lexicon: HALOT
  rationale: משֻׁלָּם은 인명으로서 음역이 적절하며, 한국어에서는 메술람이 원음에 가깝고 읽기에도 자연스럽습니다.
- source_word: וְ/חִזְקִ֥י
  english_pob_choice: and Hizki
  chosen_korean: 히스기
  alternatives_korean:
  - 히즈기
  - 헤스기
  lexicon: HALOT
  rationale: 영어 POB가 Hezekiah와 구별되는 Hizki를 택한 점을 따라, 히브리어 자음과 모음에 가까운 히스기로 옮겼습니다.
- source_word: וָ/חָבֶר
  english_pob_choice: and Heber
  chosen_korean: 헤벨
  alternatives_korean:
  - 헤버
  - 헤베르
  lexicon: HALOT
  rationale: חָבֶר의 인명 음역으로는 영어 관행의 Heber에 대응하는 한국어 음역 헤벨이 가장 자연스럽습니다.
theological_decisions:
- issue: 족보 목록의 연결어 처리
  chosen_reading: 각 인명 앞의 ו 접속을 살려 ‘그리고’로 단순 병렬을 유지했습니다.
  alternative_readings:
  - 쉼표만으로 나열
  - 마지막 항목만 ‘그리고’ 사용
  rationale: 원문은 이름들을 단순 병렬로 나열하므로, 한국어도 의미를 더하지 않고 연속된 목록으로 전달하는 것이 가장 충실합니다.
