  source_fidelity: 본문은 족보 동사와 거주 진술을 대체로 충실히 옮겼습니다. 다만 히브리어의 공간 관계 표현 נֶגֶד אֲחֵיהֶם(‘그들의 형제들 맞은편’)에 대한 각주가 인명 뒤에 붙어 있어, 각주 앵커가 가리키는 대상이 맞지 않습니다. 또한 성경 인명 표기로는 ‘시므아’가 더 적절합니다.
