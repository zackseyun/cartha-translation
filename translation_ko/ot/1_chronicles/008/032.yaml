id: 1CH.8.32
reference: 1 Chronicles 8:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ה וְ/אַף הֵ֗מָּה נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
  footnotes:
  - marker: a
    text: Or 'near their brothers'; the Hebrew preposition can denote a position in front of, opposite, or in proximity to someone.
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here likely refers to fellow clan members or kinsmen within the Benjaminite genealogy, not necessarily only biological siblings.'
    reason: cultural_note
translation:
  language: ko
  text: 미글롯이 시마아를 낳았습니다[a]. 그들도 예루살렘에서, 자기 형제들과 함께 형제들 맞은편[b]에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제들 가까이에’; 히브리어 전치사는 누군가의 앞, 맞은편, 또는 가까운 위치를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘형제들’은 혈연의 형제들만이 아니라 베냐민 족보 안의 같은 씨족 구성원이나 친족을 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  english_pob_choice: Mikloth
  chosen_korean: 미글롯
  alternatives_korean:
  - 그리고 미글롯
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역으로 옮기되, 앞의 접속사 וּ는 문맥상 자연스러워 별도로 드러내지 않았습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳았고
  lexicon: HALOT
  rationale: 족보 문맥의 출생 표지로서 ‘낳았습니다’가 직역성과 현대성을 함께 살립니다.
- source_word: וְאַף הֵמָּה
  english_pob_choice: They too
  chosen_korean: 그들도
  alternatives_korean:
  - 그들도 또한
  - 또 그들도
  lexicon: HALOT
  rationale: 추가·강조의 뉘앙스를 간결하게 살려 ‘그들도’로 옮겼습니다.
- source_word: נֶגֶד
  english_pob_choice: opposite
  chosen_korean: 맞은편
  alternatives_korean:
  - 앞에
  - 대면하여
  - 가까이에
  lexicon: HALOT
  rationale: 공간적 관계를 구체적으로 드러내는 ‘맞은편’이 이 문맥에서 가장 자연스럽고, POB의 ‘opposite’를 잘 반영합니다.
theological_decisions:
- issue: אֲחֵי/הֶם과 עִם אֲחֵי/הֶם의 반복된 '형제들' 표현
  chosen_reading: 족보 문맥의 동족/씨족 구성원을 가리키는 말이지만, 원문의 표면 형식대로 ‘형제들’로 유지했습니다.
  alternative_readings:
  - 동족
  - 친족
  - 같은 집안 사람들
  rationale: POB의 영어도 직역형 ‘brothers’를 유지하므로, 본문이 가진 족보적·공동체적 결속을 약화시키지 않기 위해 표면어를 보존했습니다.
  doctrine_reference: 족보 본문의 언어 보존 및 공동체/씨족 맥락
