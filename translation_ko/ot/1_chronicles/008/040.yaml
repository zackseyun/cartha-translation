source:
  edition: WLC
  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
  footnotes:
  - marker: a
    text: Literally, 'benders of the bow.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were among the sons of Benjamin,' that is, descendants of the tribe of Benjamin.
    reason: lexical_alternative
  - marker: c
    text: Or 'one hundred and fifty'.
    reason: previous_rendering
translation:
  language: ko
  text: 울람의 아들들은 용맹한 용사들이요, 활을 당기는 자들이었으며, 아들들과 손자들이 많아 모두 합하여 백오십 명이었습니다. 이들은 모두 베냐민의 아들들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘활을 굽히는 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘베냐민의 아들들 가운데서’, 곧 베냐민 지파의 후손들이라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 강한 용사들
  - 무용한 전사들
  lexicon: HALOT
  rationale: 고정된 관용구로서의 무사적·용맹성 강조를 살리되, 한국어에서는 자연스러운 서술명사구인 ‘용맹한 용사들’이 가장 읽기 좋습니다.
- source_word: דֹּרְכֵי קֶשֶׁת
  english_pob_choice: drawers of the bow
  chosen_korean: 활을 당기는 자들
  alternatives_korean:
  - 활쏘는 사람들
  - 활잡이들
  - 궁수들
  lexicon: HALOT
  rationale: 직역적 이미지를 유지해 ‘당기는’ 동작을 살렸습니다. POB의 “drawers of the bow”에 대응하면서도 한국어에서 이해 가능한 표현입니다.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  english_pob_choice: and they had many sons and grandsons
  chosen_korean: 아들들과 손자들이 많아
  alternatives_korean:
  - 아들들과 손자들을 많이 두어
  - 많은 아들들과 손자들이 있어
  - 아들들과 손자들을 번성시켜
  lexicon: HALOT
  rationale: 히필 분사 רבה의 ‘많아짐/증식함’을 계보 문맥에 맞게 한국어의 자연스러운 결과 상태로 옮겼습니다. ‘손자들’은 בְּנֵי בָנִים의 직접 대응입니다.
- source_word: מִבְּנֵי בִנְיָמִן
  english_pob_choice: were from the sons of Benjamin
  chosen_korean: 베냐민의 아들들이었습니다
  alternatives_korean:
  - 베냐민 자손들이었습니다
  - 베냐민 지파 출신이었습니다
  - 베냐민의 후손들이었습니다
  lexicon: HALOT
  rationale: מן + בני의 족속/혈통 소속을 한국어 계보식으로 풀어 ‘~의 아들들’로 옮겼습니다. POB의 계보적 귀속을 그대로 드러냅니다.
theological_decisions:
- issue: 계보문의 수량 표현이 아들들과 손자들의 총합을 가리키는지 여부
  chosen_reading: 백오십 명은 아들들과 손자들의 총합으로 읽었습니다.
  alternative_readings:
  - 백오십 명을 손자들에만 연결하는 읽기
  - 아들들과 손자들을 각각 따로 세는 읽기
  rationale: 히브리어 문맥상 מֵאָה וַחֲמִשִּׁים은 앞의 자손 전체를 요약하는 총수로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 계보/본문 문맥 해석
- issue: 족속 귀속 표현의 처리
  chosen_reading: ‘베냐민의 아들들’로 옮겨 족속 소속을 분명히 했습니다.
  alternative_readings:
  - ‘베냐민 자손들’로 더 일반적으로 번역
  - ‘베냐민 지파 사람들’로 해석
  rationale: 본문은 개인 계보이면서 동시에 지파 귀속을 말하므로, 직역적이면서도 한국어 계보 서술에 익숙한 형태를 택했습니다.
  doctrine_reference: 본문 문맥 해석
