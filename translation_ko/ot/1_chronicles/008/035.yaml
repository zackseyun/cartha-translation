lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - 그런데 …의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥이므로 בְּנֵי를 표준적으로 ‘아들들’로 옮기되, 앞의 ו는 한국어 서술 흐름에 맞게 ‘그리고’로 반영했습니다.
- source_word: מִיכָה
  english_pob_choice: Micah
  chosen_korean: 미가
  alternatives_korean:
  - 미가야
  lexicon: HALOT
  rationale: 인명은 한국어 성경에서 널리 쓰이는 표기 ‘미가’를 따랐습니다.
- source_word: פִּיתוֹן
  english_pob_choice: Pithon
  chosen_korean: 피돈
  alternatives_korean:
  - 피톤
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역했고, 영어 POB의 표기와 한국어 외래어 관행을 함께 고려해 ‘피돈’으로 옮겼습니다.
- source_word: וָ/מֶ֖לֶךְ
  english_pob_choice: Melech
  chosen_korean: 메렉
  alternatives_korean:
  - 멜렉
  - 메레크
  lexicon: HALOT
  rationale: 문맥상 일반명사 ‘왕’이 아니라 족보의 인명이므로 고유명사로 처리하고, 히브리어 자음형에 가까운 음역을 택했습니다.
- source_word: וְ/תַאְרֵ֥עַ
  english_pob_choice: Tarea
  chosen_korean: 다레아
  alternatives_korean:
  - 타레아
  - 다리아
  lexicon: HALOT
  rationale: 영어 POB의 선택과 달리 히브리어 자음 배열이 드러내는 음가를 한국어 음역으로 반영해 ‘다레아’로 옮겼습니다.
- source_word: וְ/אָחָֽז
  english_pob_choice: Ahaz
  chosen_korean: 아하스
  alternatives_korean:
  - 아하즈
  lexicon: HALOT
  rationale: 성경에서 널리 정착한 인명 표기 ‘아하스’를 사용했습니다.
theological_decisions:
- issue: 족보 절의 서술 형식
  chosen_reading: 명단을 한 문장으로 자연스럽게 이어 읽되, 원문의 계열적 나열을 보존했습니다.
  alternative_readings:
  - 각 이름을 줄바꿈 목록으로 배열
  - 더 직역적으로 ‘그리고 …의 아들들’만 반복
  rationale: 이 절은 신학적 해석보다 족보 정보 전달이 중심이므로, 한국어 문장으로 자연스럽게 읽히면서도 나열 구조가 유지되도록 했습니다.
  doctrine_reference: 본문 문맥상 족보 기록의 서술 관례
