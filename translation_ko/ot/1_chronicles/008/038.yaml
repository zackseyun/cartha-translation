  text: 아셀에게는 아들이 여섯 명 있었습니다[a]. 그들의 이름은 이러합니다. 그의 맏아들 아스리감과 이스마엘과 스아랴와 오바댜와 하난입니다. 이들은 모두 아셀의 아들들이었습니다.
