  rationale: בָנִים는 여기서 남자 후손을 가리키므로 ‘아들’이 적절하며, 합쇼체 서술에서는 ‘아들이 여섯’이 간결하고 자연스럽습니다.
- source_word: עַזְרִיקָם בֹּכְרוּ
