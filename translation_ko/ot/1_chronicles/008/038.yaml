  - 아셀에게는 … 있었습니다
  lexicon: HALOT
  rationale: 족보의 소유·존재 공식은 한국어에서 자연스럽게 ‘~에게는 ~이/가 있었습니다’로 옮기는 것이 원문의 관계를 분명히 드러냅니다.
- source_word: שִׁשָּׁה בָנִים
  english_pob_choice: six sons
  chosen_korean: 아들이 여섯
