  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
  footnotes:
  - marker: a
    text: Or, more literally, 'To Azel were six sons.' The Hebrew uses a genealogical possession formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 아셀에게는 아들이 여섯 있었습니다. 그리고 그들의 이름은 이렇습니다. 아즈리감, 그의 맏아들, 이스마엘, 스아랴, 오바댜, 그리고 한난입니다. 이들은 모두 아셀의 아들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְאָצֵל
  english_pob_choice: Azel had
  chosen_korean: 아셀에게는 … 있었습니다
  alternatives_korean:
