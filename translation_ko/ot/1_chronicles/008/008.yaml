language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁחֲרַ֗יִם הוֹלִיד֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב מִן שִׁלְח֖/וֹ אֹתָ֑/ם חוּשִׁ֥ים וְ/אֶֽת בַּעֲרָ֖א נָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
  footnotes:
  - marker: a
    text: Or 'in the field/territory of Moab.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from his sending them away'; the phrase likely means 'after he sent away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 샤하라임은 모압의 들에서 아내들인 후심과 바아라를 내보낸 뒤에 자녀들을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모압의 들’은 문자적으로는 ‘모압의 들/밭’이며, 지리적으로는 ‘모압의 지역/땅’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내보낸 뒤에’는 문자적으로는 ‘그들을 보내는 것으로부터’라는 표현으로, 시간적 의미를 나타낸 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַ֗יִם
  english_pob_choice: And Shaharaim
  chosen_korean: 샤하라임은
  alternatives_korean:
  - 그리고 샤하라임은
  - 이제 샤하라임은
  lexicon: HALOT
  rationale: 계보 서술의 연결을 살리되, 한국어에서는 문장 첫머리의 단순 접속보다 주어 표지가 자연스러워 주어를 바로 제시했습니다.
- source_word: הוֹלִיד֙
  english_pob_choice: fathered children
  chosen_korean: 자녀들을 낳았습니다
  alternatives_korean:
  - 아들을 낳았습니다
  - 낳았습니다
  lexicon: HALOT
  rationale: 계보 맥락에서 ילד 히필은 ‘낳다/아버지가 되다’의 뜻이므로, 뒤에 특정 자녀명이 아직 나오지 않는 점을 반영해 일반적이고 자연스러운 ‘자녀들을 낳았습니다’로 옮겼습니다.
- source_word: בִּ/שְׂדֵ֣ה מוֹאָ֔ב
  english_pob_choice: in the country of Moab
  chosen_korean: 모압의 들에서
  alternatives_korean:
  - 모압의 나라에서
  - 모압의 지역에서
  - 모압의 땅에서
  lexicon: HALOT
  rationale: שָׂדֶה는 문자적으로 ‘들/밭’이지만 지리적 표현에서는 ‘들, 지방, 지역’의 의미를 가질 수 있어, 영어 POB의 ‘country of Moab’ 취지를 살려 ‘모압의 들에서’로 옮겼습니다.
- source_word: מִן שִׁלְח֖/וֹ אֹתָ֑/ם
  english_pob_choice: after he sent away
  chosen_korean: 내보낸 뒤에
  alternatives_korean:
  - 보낸 뒤에
  - 그들을 내보낸 뒤에
  - 보내고 나서
  lexicon: HALOT
  rationale: מִן + ‘보내다’의 부정사구는 시간적 의미로 ‘~한 뒤에’를 나타내므로, 한국어에서는 사건의 선후관계를 자연스럽게 드러내는 ‘내보낸 뒤에’로 번역했습니다.
- source_word: חוּשִׁ֥ים וְ/אֶת בַּעֲרָ֖א נָשָֽׁי/ו
  english_pob_choice: Hushim and Baara, his wives
  chosen_korean: 아내들인 후심과 바아라
  alternatives_korean:
  - 후심과 바아라, 그의 아내들
  - 후심과 바아라, 그의 아내들인
  lexicon: HALOT
  rationale: נָשָׁיו는 단순히 ‘여자들’이 아니라 결혼 관계의 ‘아내들’이므로, 두 이름 뒤에 동격으로 처리해 관계를 분명히 했습니다.
theological_decisions:
- issue: 계보문장의 시간 표현과 서술 어조
  chosen_reading: 사건의 선후를 분명히 하되, 계보체 특유의 간결한 사실 서술을 유지했습니다.
  alternative_readings:
  - 직역에 가깝게 ‘그가 그들을 보내는 것으로부터’
  - 더 해석적으로 ‘그가 그들을 떠나보낸 후에’
  rationale: 본문은 신학적 논증보다 족보 사실을 기록하는 문맥이므로, 의미를 보존하면서도 한국어로는 자연한 시간 표현을 택했습니다.
  doctrine_reference: 성경 서술의 역사-계보적 문맥
- issue: 부부 관계의 명시
  chosen_reading: ‘his wives’를 ‘아내들’로 옮겨 인물 관계를 분명히 했습니다.
  alternative_readings:
  - ‘그의 여자들’
  - 그대로 음역만 덧붙이는 방식
  rationale: 히브리어 נָשִׁים의 문맥상 의미는 혼인 관계의 아내들이므로, 독자가 족보 관계를 오해하지 않도록 명시적으로 옮겼습니다.
  doctrine_reference: 본문 의미의 명료성
