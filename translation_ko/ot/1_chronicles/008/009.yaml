  source_fidelity: 히브리어 וַיּוֹלֶד는 남성 주어가 자녀의 아버지가 되었음을 나타내므로, 현대 한국어에서 출산 행위로 주로 이해되는 ‘낳았습니다’보다 ‘두었습니다’가 더 정확합니다. מִן은 ‘아내 호데스에게서’로 자연스럽게 반영됩니다. 본문은 이들을 명시적으로 ‘아들’이라고 부르지 않으므로 그 정보를 보태지 않았습니다.
  naturalness: ‘그는 아내 호데스에게서 …을 두었습니다’는 족보 문맥에서 자연스럽고 현대 표준어 합쇼체에 맞습니다. 나열에는 쉼표와 마지막 접속사를 사용해 가독성을 높였습니다.
  terminology: חֹדֶשׁ의 음역 ‘홋데스’는 히브리어 음가에 맞지 않으며 ‘호데스’로 고쳐야 합니다. צִבְיָא는 자음군 צב를 반영하여 ‘스비야’로 옮기는 것이 더 적절합니다. 요밥, 메사, 말감은 유지할 수 있습니다.
  issues:
