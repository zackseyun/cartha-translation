translation:
  language: ko
  text: 그는 아내 홋데스에게서 요밥과 시브야와 메사와 말감을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  english_pob_choice: he fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 아버지가 되었습니다
  lexicon: HALOT
  rationale: 족보 문맥의 ילד 히필은 자녀를 ‘낳다/생기게 하다’는 뜻으로 쓰이므로, 현대 한국어에서는 ‘낳았습니다’가 가장 자연스럽고 남성의 부친 행위를 분명히 드러냅니다.
- source_word: מִן
  english_pob_choice: by
  chosen_korean: 에게서
  alternatives_korean:
  - 으로부터
  - ~로 말미암아
  lexicon: HALOT
  rationale: 아내가 출산의 출처로 제시되는 족보식 표현이므로, 관계를 드러내는 ‘에게서’가 영어 POB의 ‘by’에 해당하는 자연스러운 한국어입니다.
- source_word: אִשְׁתּוֹ
  english_pob_choice: his wife
  chosen_korean: 아내
  alternatives_korean:
  - 그의 여자
  - 배우자
  lexicon: HALOT
  rationale: 이 문맥의 אשה는 단순한 ‘여자’가 아니라 배우자를 가리키므로, 표준적이고 직접적인 ‘아내’로 옮겼습니다.
- source_word: יוֹבָב / צִבְיָא / מֵישָׁא / מַלְכָּם
  english_pob_choice: Jobab / Zibia / Mesha / Malcam
  chosen_korean: 요밥 / 시브야 / 메사 / 말감
  alternatives_korean:
  - 조바브 / 지비야 / 메사 / 말캄
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역 원칙에 따라 옮겼으며, 기존 한국어 성경에서 널리 굳어진 형태가 없으므로 표준적인 음가를 우선했습니다.
