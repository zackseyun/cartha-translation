    rationale: 족보의 ילד 히필은 그가 자녀를 낳게 한, 곧 아버지가 되었음을 뜻합니다. 한국어 ‘낳다’는 현대 용법에서 대체로 어머니의 출산 행위를 뜻하므로, 남성 주어에는 ‘두었습니다’가 더 정확하고 자연스럽습니다.
  - severity: medium
    issue: ‘홋데스’ 음역
    rationale: חֹדֶשׁ는 호데스에 해당하며, ‘홋데스’의 ‘ㅅ/ㅌ’ 계열 자음은 원문의 ד에 근거하지 않습니다.
  - severity: low
    issue: ‘시브야’ 음역
    rationale: צִבְיָא의 첫 자음 צ와 뒤따르는 ב의 결합을 반영하는 표기는 ‘스비야’가 더 적절합니다.
  revised_text: 그는 아내 호데스에게서 요밥, 스비야, 메사와 말감을 두었습니다.
