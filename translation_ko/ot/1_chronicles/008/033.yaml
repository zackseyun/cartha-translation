  lexicon: 관용 한국어 성경 인명 표기
  rationale: 사울의 아들 이름은 한국어 성경에서 널리 쓰이는 ‘요나단’이 가장 자연스럽고 식별성이 높습니다.
- source_word: אֶשְׁבָּעַל
  english_pob_choice: Eshbaal
  chosen_korean: 에스바알
  alternatives_korean:
