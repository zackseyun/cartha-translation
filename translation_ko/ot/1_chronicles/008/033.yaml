theological_decisions:
- issue: 사울의 아들 마지막 이름 형태
  chosen_reading: 본문은 ‘에스바알’로 유지하고, 사무엘서의 대응 이름형은 본문 밖에서만 안내합니다.
  alternative_readings:
  - 이쉬보셋으로 본문 통일
  rationale: 이 절은 교리 문제가 아니라 본문 전승과 이름 형태의 문제이므로, 역대기 히브리어 본문을 우선하고 독자 안내는 각주로 처리하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 원문 우선 번역 원칙
