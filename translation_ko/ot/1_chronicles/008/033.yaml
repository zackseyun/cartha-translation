base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
  footnotes:
  - marker: a
    text: Eshbaal is called Ish-bosheth in 2 Samuel.
    reason: alternative_reading
translation:
  language: ko
  text: 네르가 기스를 낳았고, 기스는 사울을 낳았으며, 사울은 요나단과 말기-수아와 아비나답과 에스바알을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에스바알은 사무엘하에서 이쉬보셋으로 불립니다.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 아들을 낳았습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 히필 형태는 직접적인 부계 계승을 나타내므로, 현대 한국어의 자연스러운 족보 표현인 ‘낳았습니다’로 옮겼습니다.
- source_word: יְהוֹנָתָן
  english_pob_choice: Jonathan
  chosen_korean: 요나단
  alternatives_korean:
  - 여호나단
  lexicon: 관용 한국어 성경 인명 표기
  rationale: 사울의 아들 이름은 한국어 성경에서 널리 쓰이는 ‘요나단’이 가장 자연스럽고 식별성이 높습니다.
- source_word: אֶשְׁבָּעַל
  english_pob_choice: Eshbaal
  chosen_korean: 에스바알
  alternatives_korean:
  - 이쉬보셋
  lexicon: HALOT
  rationale: 역대기의 히브리어 본문이 אֶשְׁבָּעַל을 직접 읽으므로, 사무엘서의 다른 이름형으로 본문을 조정하지 않고 소스 형태를 반영했습니다.
theological_decisions:
- issue: 사울의 아들 마지막 이름 형태
  chosen_reading: 본문은 ‘에스바알’로 유지하고, 사무엘서의 대응 이름형은 본문 밖에서만 안내합니다.
  alternative_readings:
  - 이쉬보셋으로 본문 통일
  rationale: 이 절은 교리 문제가 아니라 본문 전승과 이름 형태의 문제이므로, 역대기 히브리어 본문을 우선하고 독자 안내는 각주로 처리하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 원문 우선 번역 원칙
