  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
  footnotes:
  - marker: a
    text: Eshbaal is called Ish-bosheth in 2 Samuel.
    reason: alternative_reading
translation:
  language: ko
  text: 넬은 기스의 아버지였고, 기스는 사울의 아버지였으며, 사울은 요나단, 말기수아, 아비나답, 에스바알[a]의 아버지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에스바알은 사무엘하에서 이쉬보셋으로 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 아들을 낳았습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 히필 형태는 직접적인 부계 계승을 나타내므로, 현대 한국어의 자연스러운 족보 표현인 ‘낳았습니다’로 옮겼습니다.
- source_word: יְהוֹנָתָן
  english_pob_choice: Jonathan
  chosen_korean: 요나단
  alternatives_korean:
