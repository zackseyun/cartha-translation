  yaml_path: translation/ot/1_chronicles/008/030.yaml
  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
  footnotes:
  - marker: a
    text: 'Or, more formally, ''And his firstborn son: Abdon, Zur, Kish, Baal, and Nadab.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 맏아들은 아브돈이었고, 그다음은 수르와 기스와 바알과 나답이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '더 직역하면 “그리고 그의 맏아들: 아브돈, 수르, 기스, 바알, 나답”입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ הַבְּכוֹר
  english_pob_choice: His firstborn son
  chosen_korean: 그의 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 그의 장자
  lexicon: HALOT
  rationale: הַבְּכוֹר는 출생 순서상의 첫째를 뜻하므로, 족보 맥락에서 자연스럽고 직접적인 '맏아들'로 옮겼습니다.
- source_word: עַבְדּוֹן
  english_pob_choice: Abdon
  chosen_korean: 아브돈
  alternatives_korean:
  - 압돈
  lexicon: 고유명사 음역
  rationale: 인명은 음역하는 것이 원칙이므로 표준 외래어 표기법에 따라 '아브돈'으로 옮겼습니다.
- source_word: צוּר
  english_pob_choice: Zur
  chosen_korean: 수르
  alternatives_korean:
  - 주르
  lexicon: 고유명사 음역
  rationale: 족보의 인명은 음역을 유지하되, 한국어 표기 관행에 맞춰 '수르'로 옮겼습니다.
- source_word: קִישׁ
  english_pob_choice: Kish
  chosen_korean: 기스
  alternatives_korean:
  - 키시
  lexicon: 고유명사 음역
  rationale: 히브리어 인명 קִישׁ은 한국어 성경에서 통용되는 음역인 '기스'를 따랐습니다.
- source_word: בַּעַל
  english_pob_choice: Baal
  chosen_korean: 바알
  alternatives_korean:
  - 바알(신)
  lexicon: 고유명사 음역
  rationale: 여기서는 족보의 인명으로 제시되므로, 신칭으로 풀지 않고 고유명사 '바알'로 옮겼습니다.
- source_word: נָדָב
  english_pob_choice: Nadab
  chosen_korean: 나답
  alternatives_korean:
  - 나다브
  lexicon: 고유명사 음역
  rationale: 통용되는 성경 인명 음역을 따라 '나답'으로 옮겼습니다.
theological_decisions:
- issue: 족보의 연결 방식과 반복 접속사 처리
  chosen_reading: 히브리어의 단순 연결을 한국어에서는 열거로 자연스럽게 풀어, 계보 정보가 끊기지 않도록 했습니다.
  alternative_readings:
  - 그리고 그의 첫째 아들은 아브돈이었고…
  - 그의 맏아들은 아브돈이었습니다…
  rationale: 이 절은 서술보다 계보 목록 제시가 핵심이므로, 의미를 바꾸지 않는 범위에서 한국어 가독성을 우선했습니다.
  doctrine_reference: 본문 장르가 족보이므로 교리적 쟁점은 없음
