  lexicon: WLC / HALOT
  rationale: 끝의 ר를 한국어 음역 관습에 맞게 ㄹ로 옮겨 에델로 적었습니다. 영어 주석의 'Ader' 가능성은 자음군 해석의 대안일 뿐이므로 본문에는 가장 자연스러운 음역을 두었습니다.
