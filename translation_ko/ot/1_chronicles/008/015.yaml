lexical_decisions:
- source_word: וּ/זְבַדְיָה
  english_pob_choice: and Zebadiah
  chosen_korean: 스브드야
  alternatives_korean:
  - 즈바댜
  - 세바댜
  lexicon: WLC / HALOT
  rationale: 고유명사는 음역하되, 히브리어 זְ- 자음을 반영해 기존 교회식 관용형보다 원형에 가까운 표기를 택했습니다. 접속사 וּ는 앞 항목과의 연결을 한국어에서도 '그리고'로 살렸습니다.
- source_word: וַ/עֲרָד
  english_pob_choice: Arad
  chosen_korean: 아랏
  alternatives_korean:
  - 아라드
  lexicon: WLC / HALOT
  rationale: 히브리어 철자에 따라 마지막 d를 ㄷ으로 옮겨 아랏으로 음역했습니다. 영어 POB의 표준 음역 'Arad'는 한국어 관용형이 아니라 원형 음역 원칙에 따라 조정했습니다.
- source_word: וָ/עָדֶר
  english_pob_choice: and Eder
  chosen_korean: 에델
  alternatives_korean:
  - 에더
  - 아델
  lexicon: WLC / HALOT
  rationale: 끝의 ר를 한국어 음역 관습에 맞게 ㄹ로 옮겨 에델로 적었습니다. 영어 주석의 'Ader' 가능성은 자음군 해석의 대안일 뿐이므로 본문에는 가장 자연스러운 음역을 두었습니다.
