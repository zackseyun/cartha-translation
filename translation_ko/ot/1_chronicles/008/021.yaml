lexical_decisions:
- source_word: עֲדָיָה
  english_pob_choice: Adaiah
  chosen_korean: 아다야
  alternatives_korean:
  - 아다이야
  - 아대야
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 번역하지 않고 음역해야 하며, 영어 POB의 표준형 Adaiah를 반영해 ‘아다야’로 옮겼습니다.
- source_word: בְרָאיָה
  english_pob_choice: Beraiah
  chosen_korean: 베라야
  alternatives_korean:
  - 베리아
  - 베라이야
  lexicon: 고유명사 음역
  rationale: 내부 알렙이 있는 히브리어 형태를 반영해 영어 POB의 Beraiah에 맞추어 ‘베라야’로 옮겼습니다.
- source_word: שִׁמְרָת
  english_pob_choice: Shimrath
  chosen_korean: 심랏
  alternatives_korean:
  - 심라트
  - 시므랏
  lexicon: 고유명사 음역
  rationale: 어말 tav가 드러나는 이름이므로, 영어 POB의 Shimrath에 맞춰 받침을 살린 ‘심랏’으로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들입니다
  alternatives_korean:
  - 아들들입니다
  - 자손입니다
  lexicon: HALOT
  rationale: 계보 문맥의 בְּנֵי는 친족 관계를 나타내므로, 한국어에서는 앞의 인명들을 시므이의 ‘아들들’로 자연스럽게 연결했습니다.
