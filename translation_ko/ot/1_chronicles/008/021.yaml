translation:
  language: ko
  text: 아다야, 베라야와 심랏—시므이의 아들들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 철자는 Beraiah이며, 일부 영어 전통은 이를 Beriah로 단순화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדָיָה
  english_pob_choice: Adaiah
  chosen_korean: 아다야
  alternatives_korean:
  - 아다이야
  - 아대야
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 번역하지 않고 음역해야 하며, 영어 POB의 표준형 Adaiah를 반영해 ‘아다야’로 옮겼습니다.
- source_word: בְרָאיָה
  english_pob_choice: Beraiah
  chosen_korean: 베라야
  alternatives_korean:
  - 베리아
  - 베라이야
  lexicon: 고유명사 음역
  rationale: 내부 알렙이 있는 히브리어 형태를 반영해 영어 POB의 Beraiah에 맞추어 ‘베라야’로 옮겼습니다.
- source_word: שִׁמְרָת
  english_pob_choice: Shimrath
  chosen_korean: 심랏
  alternatives_korean:
  - 심라트
  - 시므랏
  lexicon: 고유명사 음역
  rationale: 어말 tav가 드러나는 이름이므로, 영어 POB의 Shimrath에 맞춰 받침을 살린 ‘심랏’으로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들입니다
  alternatives_korean:
  - 아들들입니다
  - 자손입니다
  lexicon: HALOT
  rationale: 계보 문맥의 בְּנֵי는 친족 관계를 나타내므로, 한국어에서는 앞의 인명들을 시므이의 ‘아들들’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 계보문의 서술 방식
  chosen_reading: 인명 나열 뒤에 관계절을 붙여, 계보 정보가 간결하게 전달되도록 했습니다.
  alternative_readings:
  - ‘시므이의 아들들인 아다야, 베라야, 심랏입니다’
  - ‘아다야, 베라야, 그리고 심랏은 시므이의 아들들입니다’
  rationale: 본문은 역사적 계보 기록이므로 과도한 해석이나 설명을 덧붙이지 않고, 원문의 목록성과 소속 관계를 그대로 드러내는 쪽이 적절합니다.
  doctrine_reference: 성경의 계보 본문 해석 원칙
