id: 1CH.8.37
reference: 1 Chronicles 8:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א רָפָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
  footnotes:
  - marker: a
    text: Or "Bina." The Hebrew name בִּנְעָא may be represented in English with slightly different transliterations.
    reason: lexical_alternative
  - marker: b
    text: Or "Rapha." The Hebrew name רָפָה is transliterated variously in English versions.
    reason: lexical_alternative
  - marker: c
    text: Or "Elasah." The Hebrew name אֶלְעָשָׂה may be transliterated with a shorter initial vowel sequence in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 모사는 비느아의 아버지였고, 비느아는 라바의 아버지였으며, 라바는 엘르아사의 아버지였고, 엘르아사는 아셀의 아버지였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  english_pob_choice: And Moza
  chosen_korean: 모자는
  alternatives_korean:
  - 그리고 모자는
  - 모자는
  lexicon: HALOT
  rationale: 족보 연결의 ו를 한국어에서는 문두 연결어 없이 자연스럽게 이어 모자로 시작했습니다. 고유명사는 모자(모사/모자 표기 가능성은 있으나)로 음역했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 아비가 되었습니다
  lexicon: HALOT
  rationale: 족보 문맥의 הוֹלִיד는 친자 관계를 표시하는 동사이므로, 현대 한국어에서 가장 직접적인 ‘낳다’로 옮겨 계보적 생성의 힘을 살렸습니다.
- source_word: בִּנְעָא
  english_pob_choice: Binea
  chosen_korean: 비네아
  alternatives_korean:
  - 비나
  - 비네아
  lexicon: HALOT
  rationale: 히브리어 이름의 자음과 모음을 반영해 비네아로 음역했습니다. 영어 주석의 대체 표기 가능성은 있으나 한국어 본문은 하나의 일관된 음역을 택했습니다.
- source_word: רָפָה
  english_pob_choice: Rephah
  chosen_korean: 라파
  alternatives_korean:
  - 레파
  - 라바
  lexicon: HALOT
  rationale: 이 이름은 영어 POB가 Rephah로 처리했으나, 히브리어 רָפָה의 음가를 한국어로 간결하게 옮겨 라파로 음역했습니다.
- source_word: בְנ֛/וֹ ... בְנ֖/וֹ ... בְנֽ/וֹ
  english_pob_choice: his son ... his son ... his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 그의 아들입니다
  - 아들
  lexicon: HALOT
  rationale: 반복되는 소유격 표현을 한국어에서는 서술을 보태어 ‘그의 아들’로 자연스럽게 풀어 족보의 연속성을 유지했습니다.
- source_word: אֶלְעָשָׂה
  english_pob_choice: Eleasah
  chosen_korean: 엘르아사
  alternatives_korean:
  - 엘아사
  - 엘르아사
  lexicon: HALOT
  rationale: 히브리어 이름의 표준적 음가를 반영해 엘르아사로 옮겼습니다. 영어의 Eleasah에 대응하면서도 한국어 독자가 이름을 일관되게 읽을 수 있게 했습니다.
- source_word: אָצֵל
  english_pob_choice: Azel
  chosen_korean: 아셀
  alternatives_korean:
  - 아젤
  - 아셀
  lexicon: HALOT
  rationale: 이름 אָצֵל은 한국어 음역상 아셀로 옮겨 간결하게 표기했습니다.
theological_decisions:
- issue: 족보 문장 구조의 처리
  chosen_reading: 히브리어의 연속된 족보 식 구문을 한국어에서는 ‘낳았습니다 / 그의 아들’의 반복으로 옮겨, 계보의 직선적 흐름을 살렸습니다.
  alternative_readings:
  - 모자가 비네아의 아버지였습니다. 라파는 그의 아들…
  - 모자가 비네아를 낳았고, 라파의 아들은…
  rationale: 이 절은 서사보다 계보 전달이 핵심이므로, 문장 연결을 매끄럽게 하되 관계의 순서를 흐리지 않는 방식이 적절합니다.
  doctrine_reference: 족보 본문 번역 원칙
