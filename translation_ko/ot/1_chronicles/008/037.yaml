- from: 모자는 비네아를 낳았습니다. 라파는 그의 아들, 엘르아사도 그의 아들, 아셀도 그의 아들이었습니다.
  to: 모사는 비느아의 아버지였고, 비느아는 라바의 아버지였으며, 라바는 엘르아사의 아버지였고, 엘르아사는 아셀의 아버지였습니다.
  rationale: 'The revision makes each successive filial relationship explicit, preserving the Hebrew genealogy’s sequence: Moza → Binea → Rephah → Eleasah → Azel. It uses natural modern formal-polite Korean and source-sensitive, established Korean name forms. No lexical-alternative footnotes are necessary in Korean for this short genealogy.'
  reviewer_model: gpt-5.6-terra
