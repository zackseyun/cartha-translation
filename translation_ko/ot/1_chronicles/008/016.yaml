lexical_decisions:
- source_word: וּ/מִיכָאֵל
  english_pob_choice: and Michael
  chosen_korean: 그리고 미가엘
  alternatives_korean:
  - 그리고 마이클
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 성경 관례에 따라 음역하되, 영어식 인명인 ‘Michael’에 대응하는 표기는 ‘미가엘’이 가장 널리 통용됩니다.
- source_word: וְ/יִשְׁפָּה
  english_pob_choice: Ishpah
  chosen_korean: 이스바
  alternatives_korean:
  - 이슈파
  - 이쉬파
  lexicon: HALOT
  rationale: 히브리어 שם의 자음과 모음을 최대한 반영해 한국어 독자에게 읽기 쉬운 음역으로 옮겼습니다.
- source_word: וְ/יוֹחָא
  english_pob_choice: Joha
  chosen_korean: 요하
  alternatives_korean:
  - 조하
  lexicon: HALOT
  rationale: 영어 POB의 ‘Joha’에 해당하는 히브리어 이름을 한국어에서는 원음에 가까운 ‘요하’로 옮기는 편이 음가를 더 잘 드러냅니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 후손들
  lexicon: HALOT
  rationale: 족보 문맥이므로 בְּנֵי는 직역해 ‘아들들’로 두었고, 소유 관계를 자연스럽게 살리기 위해 뒤에 ‘브리아의’를 붙였습니다.
