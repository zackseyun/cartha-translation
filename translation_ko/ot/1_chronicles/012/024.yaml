base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to the mouth of the LORD,'' an idiom meaning ''according to the word'' or ''as the LORD had spoken.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 다음은 전쟁을 위해 무장한 부대의 우두머리들의 수효입니다. 그들은 헤브론에 있는 다윗에게 와서 사울의 왕국을 그에게 넘기려고 하였습니다. 이는 야훼의 말씀대로 된 일이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘야훼의 입을 따라’이며, ‘말씀대로’는 그 관용적 의미를 풀이한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי
  english_pob_choice: the numbers of
  chosen_korean: 우두머리들
  alternatives_korean:
  - 수효
  - 명단
  lexicon: HALOT
  rationale: 문맥상 단순한 숫자보다 집단의 구성원을 가리키는 열거이므로, 한국어에서는 자연스럽게 ‘우두머리들’로 풀어 전투 집단의 대표자라는 점을 살렸습니다.
- source_word: רָאשֵׁי הֶחָלוּץ
  english_pob_choice: the heads of the armed troops
  chosen_korean: 전투를 위해 무장한 부대의 우두머리들
  alternatives_korean:
  - 전투에 나선 무장한 군대의 지휘관들
  - 전투 부대의 지도자들
  lexicon: HALOT
  rationale: ‘heads of the armed troops’의 지휘·대표성을 드러내면서, הֶחָלוּץ의 ‘무장하여 전투에 대비한’ 뉘앙스를 반영했습니다.
- source_word: בָּאוּ עַל דָּוִיד חֶבְרוֹנָה
  english_pob_choice: came to David at Hebron
  chosen_korean: 헤브론의 다윗에게 와서
  alternatives_korean:
  - 헤브론에 있는 다윗에게 와서
  - 헤브론에서 다윗에게로 와서
  lexicon: HALOT
  rationale: 이동의 방향과 도착 지점을 자연스러운 한국어 어순으로 표현했습니다. כאן의 עַל은 적대가 아니라 다윗에게로의 접근이므로 단순한 ‘와서’가 적절합니다.
- source_word: לְ/הָסֵב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו
  english_pob_choice: to turn Saul’s kingdom over to him
  chosen_korean: 사울의 왕국을 그에게 넘기며
  alternatives_korean:
  - 사울의 왕권을 그에게 돌리며
  - 사울의 왕국을 그에게 이전하며
  lexicon: HALOT
  rationale: 히필 לְהָסֵב의 ‘옮기게 하다/돌리다’ 의미를 한국어에서 가장 자연스럽게 ‘넘기다’로 옮겼습니다. ‘왕권’도 가능하지만 서술 맥락에는 ‘왕국’이 더 직관적입니다.
- source_word: כְּ/פִ֥י יְהוָֽה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로
  alternatives_korean:
  - 야훼의 입의 대로
  - 야훼께서 말씀하신 대로
  lexicon: HALOT
  rationale: 직역하면 ‘야훼의 입에 따라’이지만, 관용적으로 ‘말씀대로’가 그 뜻을 투명하게 드러냅니다. 본문이 신적 발화를 가리키므로 POB의 이름형 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: יַהְוֶה를 ‘야훼’로 직역해 신적 이름을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 언약적 고유명으로서 ‘야훼’를 유지하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: כְּפִי의 관용구 처리
  chosen_reading: ‘말씀대로’로 옮겨 ‘입’의 비유를 한국어 관용으로 풀었습니다.
  alternative_readings:
  - ‘입에 따라’
  - ‘말씀에 따라’
  rationale: 히브리어 관용구는 문자적 신체 표현보다 발화·명령의 권위를 드러내는 의미가 핵심이므로, 독자가 즉시 이해할 수 있는 ‘말씀대로’를 택했습니다.
  doctrine_reference: '번역학적 관례: 관용구의 의미 등가 우선'
