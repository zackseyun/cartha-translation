  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
  footnotes:
  - marker: a
    text: Or 'their kinsmen' or 'their relatives.' The Hebrew literally says 'their brothers,' which may refer more broadly to fellow clan or tribal members in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 사흘 동안 다윗과 함께 거기 있으면서 먹고 마셨습니다. 왜냐하면 그들의 형제들이 그들을 위해 준비해 두었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 형제들’이라고 말하지만, 문맥상 같은 씨족이나 지파의 동료를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ / שָׁם
  english_pob_choice: They were there
  chosen_korean: 거기 있으면서
  alternatives_korean:
  - 거기에 있었습니다
  - 거기 머물렀습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 존재/동반의 상태를 나타내므로, 서술을 과도하게 풀지 않고 자연스럽게 ‘거기 있으면서’로 옮겼습니다.
- source_word: יָמִים שְׁלוֹשָׁה
  english_pob_choice: for three days
  chosen_korean: 사흘 동안
  alternatives_korean:
  - 삼 일 동안
  - 세 날 동안
  lexicon: HALOT
  rationale: משך(지속) 표현은 한국어에서 관용적인 ‘사흘 동안’이 가장 자연스럽고 간결합니다.
- source_word: אֹכְלִים וְשׁוֹתִים
  english_pob_choice: eating and drinking
  chosen_korean: 먹고 마셨습니다
  alternatives_korean:
  - 먹으며 마셨습니다
  - 잔치를 벌였습니다
  lexicon: HALOT
  rationale: 원문이 실제 행위를 직접 말하므로, 의미를 요약한 ‘잔치를 벌였습니다’보다 동사 두 개를 그대로 살린 표현을 택했습니다.
- source_word: אֲחֵיהֶם
  english_pob_choice: their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 동족들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족어를 본문에서 그대로 살리되, 문맥상 넓은 혈연·동족적 관계도 가능함은 주석에서 확인할 수 있게 했습니다.
theological_decisions:
- issue: אֲחֵיהֶם의 친족적 범위
  chosen_reading: 본문은 ‘그들의 형제들’로 직역하되, 문맥상 같은 지파/동족을 가리킬 수 있습니다.
  alternative_readings:
  - 그들의 친족들
  - 그들의 동족들
  rationale: 교리 쟁점은 없지만, 원문의 문자적 표현을 유지하면서도 사회적 범위를 넓게 이해할 여지를 남기는 것이 स्रोत 충실성에 더 적합합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
