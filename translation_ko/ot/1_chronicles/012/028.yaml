  source_fidelity: 히브리어는 여호야다를 ‘아론에 관련된/속한 지도자’로 규정하고, 그와 함께한 인원을 삼천칠백 명으로 제시합니다. 현 초안의 기본 뜻과 수량은 맞지만, ‘아론의 지도자’는 아론 개인이 소유하거나 지휘하는 지도자라는 인상을 줄 수 있으며, ‘여호야다와 함께 삼천칠백 명이 있었습니다’는 명단 문맥에서 다소 느슨합니다.
  naturalness: ‘아론계 지도자 여호야다와 그와 함께한 삼천칠백 명이었습니다’는 열거식 문맥을 자연스럽게 유지하면서 여호야다와 동행한 인원을 분명히 합니다. 현대 한국어 합쇼체의 서술 종결에도 맞습니다.
