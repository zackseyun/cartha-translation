lexical_decisions:
- source_word: וִ/יהוֹיָדָ֖ע
  english_pob_choice: and Jehoiada
  chosen_korean: 그리고 여호야다
  alternatives_korean:
  - 여호야다
  lexicon: HALOT
  rationale: 접두사 ו의 연결을 살려 앞의 항목과 이어지는 목록 구조를 표시하고, 고유명사는 현대 한국어 음역으로 옮겼습니다.
- source_word: הַ/נָּגִ֣יד
  english_pob_choice: the leader
  chosen_korean: 지도자
  alternatives_korean:
  - 지도자
  - 인도자
  - 우두머리
  lexicon: HALOT
  rationale: נָגִיד는 단순한 직함보다 대표적 통솔자를 가리키므로, 군주적 뉘앙스를 과도하게 주지 않는 현대어 ‘지도자’가 적절합니다.
- source_word: לְ/אַהֲרֹ֑ן
  english_pob_choice: of Aaron
  chosen_korean: 아론의
  alternatives_korean:
  - 아론을 위한
  - 아론에게 속한
  lexicon: HALOT
  rationale: ל의 관계 표지가 아론과의 소속·연관을 나타내므로, 한국어에서는 소유격형 ‘아론의’로 자연스럽게 옮겼습니다.
- source_word: שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת
  english_pob_choice: three thousand seven hundred
  chosen_korean: 삼천칠백 명
  alternatives_korean:
  - 3,700명
  lexicon: HALOT
  rationale: 정확한 수량을 그대로 반영하되, 본문 흐름에 맞게 읽기 쉬운 한글 수사 표현을 사용했습니다.
theological_decisions:
- issue: 직함 הנָּגִיד의 의미 범위
  chosen_reading: 아론의 계열을 대표하는 지도자라는 의미로 읽었습니다.
  alternative_readings:
  - 아론의 군주
  - 아론의 우두머리
  - 아론을 위한 지도자
  rationale: 문맥이 군왕 칭호가 아니라 제사장 집안의 대표성을 말하므로, 본문 의미를 과장하지 않는 번역이 필요합니다.
  doctrine_reference: 민수기 3장과 역대기 계보/직분 맥락
- issue: 명단형 서술의 접속 방식
  chosen_reading: 접속사 ‘그리고’를 유지해 앞선 항목과 이어지는 열거 구조를 드러냈습니다.
  alternative_readings:
  - 여호야다, 아론의 지도자와 함께…
  - 아론의 지도자 여호야다와 함께…
  rationale: 히브리어의 ו 접속을 반영해 목록의 연속성을 보존하는 것이 본문의 집계 문맥을 가장 잘 살립니다.
  doctrine_reference: 역대기 족속/병력 열거의 서술 관습
