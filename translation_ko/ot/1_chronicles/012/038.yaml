base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
  footnotes:
  - marker: a
    text: Or, 'from across the Jordan.' The Hebrew expression can be rendered from a different geographical viewpoint as 'from the other side of the Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요단강 건너편에서—르우벤 사람들과 갓 사람들과 므낫세 반 지파에서—전쟁에 쓸 온갖 군사 장비를 갖춘 자가 십이만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘건너편’은 화자의 기준에 따라 ‘요단강 저편’ 또는 ‘요단강 건너’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  english_pob_choice: And from beyond the Jordan
  chosen_korean: 요단강 건너편에서
  alternatives_korean:
  - 요단강 저편에서
  - 요단강 건너에서
  - 요단강 너머에서
  lexicon: HALOT
  rationale: מֵעֵבֶר는 강을 기준으로 한 상대적 위치를 나타내므로, 한국어에서는 자연스럽고 지리적 방향성을 유지하는 ‘건너편’이 가장 적절합니다.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  english_pob_choice: from the Reubenites, the Gadites, and the half-tribe of Manasseh
  chosen_korean: 르우벤 사람들과 갓 사람들과 므낫세 반 지파에서
  alternatives_korean:
  - 르우벤 지파와 갓 지파와 므낫세 반 지파에서
  - 르우벤 사람들, 갓 사람들, 그리고 므낫세 반 지파에서
  lexicon: HALOT
  rationale: 지파 집단을 가리키는 집합적 표현이므로 ‘사람들’로 옮기되, ‘반 지파’는 본문의 관용적 표현을 그대로 살렸습니다.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  english_pob_choice: with every kind of military equipment for war
  chosen_korean: 전쟁에 쓸 온갖 군사 장비를 갖춘
  alternatives_korean:
  - 모든 전쟁 무기를 갖춘
  - 전쟁용 군사 장비를 모두 갖춘
  - 전쟁에 필요한 온갖 장비를 갖춘
  lexicon: HALOT
  rationale: כְּלֵי는 단순한 ‘무기’보다 넓은 ‘장비/도구’의 뜻이므로, 전투 준비의 포괄성을 살리는 ‘군사 장비’가 원문 범위에 더 가깝습니다.
- source_word: מֵאָה וְעֶשְׂרִ֖ים אָלֶף
  english_pob_choice: one hundred twenty thousand
  chosen_korean: 십이만 명
  alternatives_korean:
  - 12만 명
  - 십만이천 명
  lexicon: HALOT
  rationale: 히브리어 수량 표현을 한국어에서는 자연스러운 한자어 수사로 압축해 읽기 쉽게 옮겼습니다.
