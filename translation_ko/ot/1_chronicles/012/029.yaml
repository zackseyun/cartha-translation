translation:
  language: ko
  text: 그리고 사독은 젊은이였고 용맹한 용사였습니다. 그의 아버지 집안에는 지휘관이 스물두 명 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק
  english_pob_choice: Zadok
  chosen_korean: 사독
  alternatives_korean:
  - 자독
  lexicon: 고유명사 표기
  rationale: 인명은 음역하며, 한국어 성경에서 널리 통용되는 표기를 따랐습니다.
- source_word: נַעַר
  english_pob_choice: young man
  chosen_korean: 젊은 용사
  alternatives_korean:
  - 젊은이
  - 청년
  - 소년
  lexicon: HALOT
  rationale: 문맥이 군사 명단이므로 단순 연령 표현보다 젊은 남성의 전투적 성격을 드러내는 표현이 더 적합합니다.
- source_word: גִּבּוֹר חָיִל
  english_pob_choice: mighty in valor
  chosen_korean: 용사
  alternatives_korean:
  - 용맹한 용사
  - 힘센 용사
  - 큰 용맹의 사람
  lexicon: HALOT
  rationale: 두 단어가 함께 강함과 전투적 용맹을 나타내므로, 현대 한국어에서 자연스러운 군사적 표현인 ‘용사’로 압축해 옮겼습니다.
- source_word: בֵית אָבִיו
  english_pob_choice: his father’s house
  chosen_korean: 그의 아버지의 집
  alternatives_korean:
  - 그의 조상 집
  - 그의 가문
  - 그의 족속
  lexicon: HALOT
  rationale: 히브리어 관용구의 친족 구조를 살리기 위해 ‘가문’처럼 해석하지 않고 직역에 가깝게 유지했습니다.
- source_word: שָׂרִים
  english_pob_choice: commanders
  chosen_korean: 지휘관
  alternatives_korean:
