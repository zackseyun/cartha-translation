  - 우두머리들
  - 장관들
  lexicon: HALOT
  rationale: 군사 문맥에서 שָׂרִים는 통솔하는 사람들을 가리키므로, 계급적·군사적 기능을 드러내는 ‘지휘관’이 가장 적절합니다.
