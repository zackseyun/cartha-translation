  rationale: 이 동사는 왕권을 부여하거나 확립하는 행위를 가리키므로, 한국어에서도 의식적 장면보다 통치권 부여의 의미가 살아야 합니다.
  doctrine_reference: 사무엘기·역대기 왕권 서술
