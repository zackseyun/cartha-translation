  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
  footnotes:
  - marker: a
    text: Or 'who were named by name,' that is, individually designated or expressly listed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므낫세 반 지파에서, 이름으로 지정된[a] 만 팔천 명이 다윗을 왕으로 세우기 위해 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 ‘이름들로 지정된’이라는 뜻으로, 개인별로 명시되었거나 특별히 지명된 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  english_pob_choice: And from the half-tribe of Manasseh
  chosen_korean: 므낫세 반 지파에서
  alternatives_korean:
