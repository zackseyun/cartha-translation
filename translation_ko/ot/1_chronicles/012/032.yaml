  lexicon: HALOT
  rationale: חֲצִי מַטֵּה는 집합명사 구조로 한국어에서는 자연스럽게 '반 지파'로 옮기는 것이 가장 직접적입니다.
- source_word: נִקְּבוּ בְּשֵׁמוֹת
  english_pob_choice: who were designated by name
  chosen_korean: 이름으로 지정된
  alternatives_korean:
  - 이름으로 불린
  - 이름별로 지명된
  - 이름으로 명시된
  lexicon: HALOT
  rationale: נקב의 수동형은 단순히 '이름이 불렸다'보다, 개별적으로 분명히 지정되었다는 뜻을 담으므로 '이름으로 지정된'이 문맥에 맞습니다.
- source_word: לָבוֹא לְהַמְלִיךְ אֶת דָּוִיד
  english_pob_choice: came to make David king
  chosen_korean: 다윗을 왕으로 세우기 위해 왔습니다
  alternatives_korean:
  - 다윗을 왕으로 삼기 위해 왔습니다
  - 다윗을 왕으로 세우러 왔습니다
  - 다윗을 왕으로 즉위시키기 위해 왔습니다
  lexicon: HALOT
  rationale: המליך는 단순한 즉위 의식보다 '왕으로 세우다/삼다'의 뜻이 핵심이므로, 목적을 드러내는 '왕으로 세우기 위해'가 원문의 동사를 잘 반영합니다.
theological_decisions:
- issue: 다윗 왕정 수립을 뜻하는 הליך의 한국어 표현
  chosen_reading: '''왕으로 세우다''를 택해, 단순한 대관식이 아니라 왕권 부여 행위를 드러냈습니다.'
  alternative_readings:
  - '''즉위시키다'''
  - '''대관하다'''
  - '''왕위에 오르게 하다'''
  rationale: 이 동사는 왕권을 부여하거나 확립하는 행위를 가리키므로, 한국어에서도 의식적 장면보다 통치권 부여의 의미가 살아야 합니다.
  doctrine_reference: 사무엘기·역대기 왕권 서술
