  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
  footnotes:
  - marker: a
    text: Or 'from Saul’s kinsmen' or 'from Saul’s relatives.' The Hebrew 'brothers' can extend beyond literal siblings to members of the same wider family or tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 활을 다루는 사람들이었고, 오른손과 왼손을 모두 써서 돌을 던지고 활로 화살을 쏠 수 있었습니다. 그들은 베냐민 출신인 사울의 형제들[a] 가운데서 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사울의 친족들' 또는 '사울의 혈족들'일 수 있습니다. 히브리어 '형제들'은 문자적인 형제들보다 더 넓게 같은 집안·씨족 또는 지파의 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
