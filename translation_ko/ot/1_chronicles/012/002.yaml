  text: נֹ֣שְׁקֵי קֶ֗שֶׁת מַיְמִינִ֤ים וּ/מַשְׂמִאלִים֙ בָּֽ/אֲבָנִ֔ים וּ/בַ/חִצִּ֖ים בַּ/קָּ֑שֶׁת מֵ/אֲחֵ֥י שָׁא֖וּל מִ/בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
  footnotes:
  - marker: a
    text: Or 'from Saul’s kinsmen' or 'from Saul’s relatives.' The Hebrew 'brothers' can extend beyond literal siblings to members of the same wider family or tribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 활을 다루는 자들로서, 오른손과 왼손을 모두 써서 돌을 던지고 활로 화살을 쏠 수 있었습니다. 그들은 베냐민의 사울의 형제들 가운데서 나온 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사울의 친족들' 또는 '사울의 혈족들'일 수 있습니다. 히브리어 '형제들'은 문자적 형제보다 더 넓은 같은 족속이나 지파 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  english_pob_choice: archers
  chosen_korean: 활을 다루는 자들
  alternatives_korean:
  - 궁수들
  - 활쏘는 사람들
  lexicon: HALOT
  rationale: פתח구문은 단순 신분보다 활을 갖추고 사용하는 사람들을 가리키므로, 한국어에서는 역할을 드러내는 표현으로 옮겼습니다.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  english_pob_choice: able to use both the right hand and the left
  chosen_korean: 오른손과 왼손을 모두 써서
  alternatives_korean:
  - 오른손잡이와 왼손잡이로
  - 오른손과 왼손을 능숙하게 써서
  lexicon: HALOT
  rationale: 손재주나 양손 사용의 기능적 능력을 나타내므로, 자연스러운 한국어로 양손 사용을 분명히 드러냈습니다.
- source_word: בָּאֲבָנִים וּבַחִצִּים בַּקָּשֶׁת
  english_pob_choice: in hurling stones and shooting arrows with the bow
  chosen_korean: 돌을 던지고 활로 화살을 쏠 수 있었습니다
  alternatives_korean:
  - 돌을 던지며 활에서 화살을 쏘고
  - 돌과 화살로 능숙했습니다
  lexicon: HALOT
  rationale: 문맥상 무기 사용 능력을 병렬로 제시하므로, '던지다/쏘다'로 두 동작을 살리고 '활로'를 보충해 원문의 수단을 드러냈습니다.
- source_word: מֵאֲחֵי שָׁאוּל
  english_pob_choice: from Saul’s brothers
  chosen_korean: 사울의 형제들 가운데서 나온
  alternatives_korean:
  - 사울의 친족 가운데서 나온
  - 사울의 형제들로부터
  lexicon: HALOT
  rationale: '''형제들''은 직계 형제보다 넓은 친족·동족 범위를 가질 수 있으나, 원문 표지를 유지하기 위해 본문에는 직역형을 두고 문맥적 여지를 남겼습니다.'
- source_word: מִבִּנְיָמִן
  english_pob_choice: from Benjamin
  chosen_korean: 베냐민
  alternatives_korean:
  - 베냐민 지파
  - 베냐민 사람들
  lexicon: HALOT
  rationale: 지파 출신을 간결하게 밝히는 구문이므로, 한국어에서는 출신지를 직접 제시했습니다.
theological_decisions:
- issue: מֵאֲחֵי שָׁאוּל의 친족 범위
  chosen_reading: 본문은 '사울의 형제들'을 유지하되, 한국어에서는 직계 형제보다 넓은 동족·친족 가능성을 열어 둡니다.
  alternative_readings:
  - '''사울의 친족'''
  - '''사울의 일가'''
  rationale: 영어 POB 각주가 'brothers'의 확장 용법을 명시하므로, 본문은 원어 표지를 보존하고 해석 여지는 주석이 아니라 문맥적으로 남겼습니다.
  doctrine_reference: 족보·지파 표지의 역사적 진술을 보존하는 번역 원칙
- issue: 양손 사용과 전투 능력의 표현
  chosen_reading: 능력을 설명하는 서술로 처리하고, 과장된 무예 찬양으로 확대하지 않습니다.
  alternative_readings:
  - '''양손잡이였다'''
  - '''전투에 매우 능했다'''
  rationale: 원문은 양손을 모두 쓸 수 있는 기능과 무기 사용을 병렬로 말하므로, 필요 이상으로 해석을 확장하지 않고 기술적 서술로 유지했습니다.
  doctrine_reference: 본문 기술의 최소 확대 원칙
