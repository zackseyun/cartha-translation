  text: וּ/מִן בְּנֵ֧י בִנְיָמִ֛ן אֲחֵ֥י שָׁא֖וּל שְׁלֹ֣שֶׁת אֲלָפִ֑ים וְ/עַד הֵ֨נָּה֙ מַרְבִּיתָ֔/ם שֹׁמְרִ֕ים מִשְׁמֶ֖רֶת בֵּ֥ית שָׁאֽוּל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
  footnotes:
  - marker: a
    text: Or 'Saul’s kinsmen' / 'relatives of Saul.' The Hebrew 'brothers' can extend beyond literal siblings to a wider kinship group.
    reason: lexical_alternative
  - marker: b
    text: '''The house of Saul'' may refer to Saul’s household or to the broader interests of Saul’s royal line.'
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민의 아들들 가운데, 곧 사울의 형제들[a]은 삼천 명이었습니다[b]. 그때까지 그들 대부분은 사울의 집을 지키고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사울의 친족들’, ‘사울의 혈족들’로도 옮길 수 있습니다. 히브리어 ‘형제들’은 문자적 형제보다 더 넓은 친족 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사울의 집’은 사울의 가정이나 사울 왕가의 더 넓은 이해관계를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민의 아들들
  alternatives_korean:
