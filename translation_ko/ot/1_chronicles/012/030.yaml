  lexicon: HALOT
  rationale: 족속·계보를 나타내는 히브리어 관용구를 살리기 위해 직역에 가깝게 옮겼습니다.
- source_word: אֲחֵי שָׁאוּל
  english_pob_choice: Saul’s brothers
  chosen_korean: 사울의 형제들
  alternatives_korean:
