  lexicon: HALOT
  rationale: ‘형제들’의 기본 의미를 유지하되, 벤야민 지파 내부의 혈연/동족 관계를 한국어에서도 자연스럽게 드러냈습니다.
- source_word: וְעַד הֵנָּה מַרְבִּיתָם שֹׁמְרִים מִשְׁמֶרֶת
  english_pob_choice: until then most of them had been keeping watch
  chosen_korean: 그때까지 그들 대부분은 ... 지키고 있었습니다
  alternatives_korean:
  - 그때까지 그들 대부분은 ... 경계하고 있었습니다
  - 그때까지 그들 대부분은 ... 수비하고 있었습니다
  lexicon: HALOT
  rationale: משך된 상태를 나타내는 문맥을 살려 ‘-고 있었습니다’로 옮겼고, שׁמר + מִשְׁמֶרֶת의 감시는 ‘지키다’로 자연스럽게 표현했습니다.
- source_word: בֵּית שָׁאוּל
  english_pob_choice: the house of Saul
  chosen_korean: 사울의 집
  alternatives_korean:
  - 사울의 가문
  - 사울의 집안
  - 사울의 왕가
  lexicon: HALOT
  rationale: 히브리어 ‘house’의 폭넓은 뜻을 좁히지 않기 위해 본문에서는 ‘집’을 유지했습니다.
theological_decisions:
- issue: בֵּית שָׁאוּל의 범위
  chosen_reading: 본문은 사울의 개인 가정만이 아니라 그의 집안/왕권의 이해관계까지 포괄할 수 있는 여지를 남겼습니다.
  alternative_readings:
  - 사울의 가문만 가리킨다
  - 사울 왕조 전체를 가리킨다
  rationale: 영어 POB의 주석처럼 히브리어 ‘house’는 문맥상 넓은 범위를 가질 수 있으므로, 한국어 본문도 그 긴장을 유지했습니다.
  doctrine_reference: 본문 주석 차원의 의미 범위 판단
- issue: אֲחֵי שָׁאוּל의 번역 범위
  chosen_reading: ‘형제들’로 직역하되 혈연에만 한정되지 않는 동족적 의미를 열어 두었습니다.
  alternative_readings:
  - 오직 사울의 친형제들
  - 사울의 친족들
  rationale: 히브리어 ‘형제’가 넓은 친족/동족을 가리킬 수 있어, 본문은 직역을 유지하고 독해 안내는 각주로 처리했습니다.
  doctrine_reference: 히브리어 친족 어법
