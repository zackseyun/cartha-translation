translation:
  language: ko
  text: 납달리 사람들 가운데서는 지휘관이 천 명이었고, 그들과 함께 방패와 창을 든 사람이 삼만 칠천 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  english_pob_choice: From Naphtali
  chosen_korean: 납달리 사람들 가운데서는
  alternatives_korean:
