  rationale: 원문에 없는 이동 동사 ‘왔습니다’를 제거하고, 군사 편성의 의미를 ‘전투 대형을 갖춘’으로 보완했습니다. 또한 히브리어의 ‘마음과 마음 없이’라는 관용구는 ‘두 마음 없이’로 간결하게 보존했으며, 난해한 동사는 교리적·인물 보충 없이 ‘지원하다’로 번역하고 대안은 각주로 처리했습니다. 각주 표지도 각각의 해당 표현 바로 뒤로 옮겼습니다.
