  lexicon: WLC
  rationale: עֹרְכֵי는 단순한 ‘준비’보다 전투 태세를 갖춘 상태를 가리키므로, ‘갖추고 싸울 준비가 된’으로 표현해 무장과 태세를 함께 살렸습니다.
- source_word: בְּלֹא לֵב וָלֵב
  english_pob_choice: without a divided heart
  chosen_korean: 분열된 마음 없이
  alternatives_korean:
  - 마음이 둘이 되지 않고
  - 두 마음 없이
