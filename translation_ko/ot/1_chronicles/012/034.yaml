revisions:
- from: 스불론에서 나온 군사 복무에 적합한 사람들, 곧 모든 종류의 전쟁 무기를 갖추고 싸울 준비가 된 사람들 오만 명이었으며, 분열된 마음 없이 돕기 위해 왔습니다.[a][b]
