- source_word: עֹרְכֵי מִלְחָמָה בְּכָל כְּלֵי מִלְחָמָה
  english_pob_choice: prepared for battle with every kind of weapon of war
  chosen_korean: 모든 종류의 전쟁 무기를 갖추고 싸울 준비가 된
  alternatives_korean:
