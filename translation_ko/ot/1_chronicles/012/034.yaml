theological_decisions:
- issue: וְלַעֲדֹר의 의미
  chosen_reading: ‘돕기 위해’로 옮겨, 다윗을 향한 일치된 지원과 협력을 드러냈습니다.
  alternative_readings:
  - ‘합류하기 위해’
  - ‘지지하기 위해’
  - ‘대열을 이루기 위해’
  rationale: 동사가 드물고 문맥상 군사적 연대의 실제 기능이 중요하므로, 지나치게 기술적인 추정을 피하면서도 공동 지원의 뜻을 살렸습니다.
  doctrine_reference: 본문 문맥 주해
- issue: ‘마음과 마음 없음’의 관용성
  chosen_reading: 분열된 충성이나 이중성이 없는 단일한 태도로 이해했습니다.
  alternative_readings:
  - ‘두 마음 없음’
  - ‘속임수 없음’
  rationale: 히브리어 반복 표현의 핵심은 내적 분열의 부재이므로, 도덕적 정서보다 충성의 통일성을 강조하는 번역을 선택했습니다.
  doctrine_reference: 본문 문맥 주해
