id: 1CH.12.34
reference: 1 Chronicles 12:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
  footnotes:
  - marker: a
    text: Literally, 'without heart and heart,' a Hebrew idiom meaning without divided loyalty or double-mindedness.
    reason: lexical_alternative
  - marker: b
    text: Or 'to join the ranks' / 'to support'; the Hebrew verb is uncommon here, and the sense is that they came in unified support for David.
    reason: alternative_reading
translation:
  language: ko
  text: 스불론 지파에서는 군대에 나갈 수 있는 사람으로서, 모든 전쟁 장비를 갖추고 전투 대형을 갖춘 사람이 오만 명이었습니다. 그들은 두 마음 없이[a] 지원할 수 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘마음과 마음 없이’라고 합니다. 이는 충성이 나뉘거나 마음이 둘로 갈리지 않았다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 여기에서 드물게 쓰여 정확한 뉘앙스가 불확실합니다. ‘지원하다’ 외에 ‘합류하다’ 또는 ‘대열을 이루다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
