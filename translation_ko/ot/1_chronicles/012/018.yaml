  source_fidelity: 초안은 대체로 히브리어의 조건문 구조와 다윗의 결백 주장, 그리고 하나님의 판정에 대한 호소를 잘 반영합니다. 그러나 בְּלֹא חָמָס בְּכַפַּי의 양보적 관계를 ‘없으니’라는 인과 관계로 바꾼 점은 수정해야 합니다. 또한 끝의 미완료형들은 이 문맥에서 단순한 미래 진술보다 하나님의 감찰과 판정을 요청하는 호소로 옮기는 편이 적절합니다.
  naturalness: ‘평강 가운데 와서’는 현대 표준어 산문에서는 다소 교회 내부의 관용적 표현으로 들릴 수 있으므로 ‘평화롭게 와서’가 자연스럽습니다. ‘속여 내 원수들에게 넘기다’는 군사·정치 문맥의 배신을 자연스럽게 드러냅니다. 각주 표지는 해당 어구 바로 뒤에 두는 것이 독해에 더 명료합니다.
  terminology: ‘우리 조상들의 하나님’은 אֱלֹהֵי אֲבוֹתֵינוּ를 충실히 반영합니다. חָמָס의 ‘폭력’도 적절합니다. וְיוֹכַח는 ‘판정하시기를 바랍니다’로 옮겨 책망·판단·판결의 의미 범위를 과도하게 좁히지 않으면서 분쟁 해결의 맥락을 살렸습니다.
  issues:
