revisions:
- from: 다윗이 그들 앞에 나가 대답하여 그들에게 말했습니다. “너희가 내게 평강 가운데 와서 나를 도우려는 것이라면, 내 마음은 너희와 한마음이 될 것입니다. 그러나 너희가 나를 속여 내 원수들에게 넘기려는 것이라면, 내 손에 폭력이 없으니 우리 조상들의 하나님께서 보시고 판결하실 것입니다.”[a][b]
  to: 다윗이 그들 앞에 나가 대답하여 그들에게 말했습니다. “너희가 평화롭게 나에게 와서 나를 도우려는 것이라면, 내 마음은 너희와 하나가 될 것입니다. 그러나 너희가 나를 속여 내 원수들에게 넘기려는 것이라면[a], 내 손에 폭력이 없는데도 우리 조상들의 하나님께서 보시고 판정하시기를 바랍니다.[b]”
  rationale: 양보 관계와 기원적 호소의 어조를 원문에 맞게 회복하고, 현대 표준어 합쇼체에서 자연스러운 표현으로 다듬었습니다. ‘원수들에게 넘기다’는 רמה와 뒤따르는 לְצָרַי의 문맥상 배신적 방향을 드러내되, 각주에서 기본 어휘의 대안을 보존했습니다.
