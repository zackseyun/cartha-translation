    rationale: בְּלֹא חָמָס בְּכַפַּי는 ‘내 손에 폭력이 없는데도/없으면서’라는 결백의 양보적 호소입니다. ‘없으니’는 하나님이 판결하시는 근거를 단순 인과로 제시하여 논리 관계를 달리합니다.
  - severity: medium
    issue: ‘보시고 판결하실 것입니다’는 호소의 어조를 미래 단언으로 바꿉니다.
    rationale: יֵרֶא וְיוֹכַח는 문맥상 하나님께 감찰과 판정을 청하는 기원적 호소로 읽는 것이 자연스럽습니다. 한국어에서는 ‘보시고 판정하시기를 바랍니다’가 이 어조를 잘 전달합니다.
  - severity: low
