base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
  footnotes:
  - marker: a
    text: Or 'to deceive me.' The Hebrew verb can denote treacherous deception; 'betray' is chosen here because the context involves being handed over to enemies.
    reason: lexical_alternative
  - marker: b
    text: Or 'see and rebuke' / 'see and decide.' The final verb can carry the sense of reproving, arbitrating, or rendering judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗이 그들 앞에 나가 대답하여 그들에게 말했습니다. “너희가 평화롭게 나에게 와서 나를 도우려는 것이라면, 내 마음은 너희와 하나가 될 것입니다. 그러나 너희가 나를 속여 내 원수들에게 넘기려는 것이라면[a], 내 손에 폭력이 없는데도 우리 조상들의 하나님께서 보시고 판정하시기를 바랍니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רמה는 ‘속이다’ 또는 ‘배반하다’를 뜻할 수 있습니다. 여기서는 적에게 넘기는 배신의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יכח는 ‘책망하다’, ‘판정하다’, ‘판결하다’라는 뜻을 가질 수 있습니다. 여기서는 하나님께서 이 일을 살피시고 판정해 주시기를 바라는 호소입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא דָוִיד לִפְנֵיהֶם
  english_pob_choice: David went out before them
  chosen_korean: 다윗이 그들 앞에 나가
  alternatives_korean:
  - 다윗이 그들 앞에 나와
  - 다윗이 그들을 맞으러 나가
  lexicon: HALOT
  rationale: יצא의 기본 움직임을 ‘나가’로 살리고, לִפְנֵיהֶם은 해석을 덜한 ‘그들 앞에’로 옮겨 공간적 관계를 유지했습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평강 가운데
  alternatives_korean:
  - 평화롭게
  - 평강으로
  lexicon: HALOT
  rationale: ‘평강’은 본문이 묻는 접근의 상태를 자연스럽게 드러내며, 현대 한국어에서도 어색하지 않게 조건절의 분위기를 살립니다.
- source_word: לְרַמּוֹתַנִי
  english_pob_choice: to betray me
  chosen_korean: 나를 속여 … 넘기려는 것
  alternatives_korean:
  - 나를 배반하려는 것
  - 나를 속이려는 것
  lexicon: HALOT
  rationale: 문맥이 단순 기만보다 적에게 인도하는 정치·군사적 배신을 가리키므로, ‘속여 … 넘기다’로 treacherous force를 살렸습니다.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  english_pob_choice: though there is no violence in my hands
  chosen_korean: 내 손에 폭력이 없으니
  alternatives_korean:
  - 내 손에 포악함이 없으니
  - 내 손에 폭력이 없는데도
  lexicon: HALOT
  rationale: חָמָס는 ‘폭력/불의’ 계열이지만 여기서는 결백을 주장하는 직접적 표현이므로 ‘폭력’을 택하고, ‘내 손에’는 행위 책임의 관용구를 보존했습니다.
- source_word: וְיוֹכַח
  english_pob_choice: and judge
  chosen_korean: 판결하실 것입니다
  alternatives_korean:
  - 판단하실 것입니다
  - 심판하실 것입니다
  - 책망하실 것입니다
  lexicon: HALOT
  rationale: יכח의 법정적·중재적 의미를 한국어로 가장 압축적으로 드러내는 말로 ‘판결하다’를 택해, 단순 책망보다 분쟁의 판정이라는 뉘앙스를 보존했습니다.
