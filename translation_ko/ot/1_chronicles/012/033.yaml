reference: 1 Chronicles 12:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י יִשָּׂשכָ֗ר יוֹדְעֵ֤י בִינָה֙ לַֽ/עִתִּ֔ים לָ/דַ֖עַת מַה יַּעֲשֶׂ֣ה יִשְׂרָאֵ֑ל רָאשֵׁי/הֶ֣ם מָאתַ֔יִם וְ/כָל אֲחֵי/הֶ֖ם עַל פִּי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
  footnotes:
  - marker: a
    text: Or 'men of understanding of the times'; the Hebrew emphasizes discernment suited to the historical moment.
    reason: lexical_alternative
  - marker: b
    text: Literally 'all their brothers were according to their mouth,' an idiom meaning they were subject to their direction or command.
    reason: lexical_alternative
translation:
  language: ko
  text: 잇사갈 자손 가운데에는 시대를 분별하여 이스라엘이 무엇을 해야 할지를 아는 사람들이 있었습니다.[a] 그들의 우두머리는 이백 명이었고, 그들의 모든 형제는 그들의 지휘를 따랐습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시대를 이해하는 사람들’. 히브리어는 ‘때들/시대’에 관한 이해와 분별을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 모든 형제는 그들의 입을 따라’입니다. 그들의 말이나 지시에 따랐다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  english_pob_choice: From the sons of Issachar
  chosen_korean: 잇사갈의 아들들 가운데에는
  alternatives_korean:
  - 잇사갈의 아들들로부터
  - 잇사갈의 사람들 가운데에는
  lexicon: HALOT
  rationale: מִן과 בני의 결합은 집단 안에서의 출신/소속을 나타내므로, 한국어에서는 목록형 서술에 자연스러운 ‘~가운데에는’로 풀어 원문의 집단 표지를 살렸습니다.
- source_word: יוֹדְעֵי בִינָה
  english_pob_choice: men who understood
  chosen_korean: 시대를 분별할 줄 아는 사람들
  alternatives_korean:
  - 이해하는 사람들
  - 분별력이 있는 사람들
  - 이해의 사람들
  lexicon: HALOT
  rationale: יוֹדְעֵי בִינָה는 단순 지식보다 상황을 읽는 분별을 가리키므로, ‘분별할 줄 아는’으로 역동적이되 원문의 인지·판단 능력을 보존했습니다.
- source_word: לָעִתִּים
  english_pob_choice: the times
  chosen_korean: 시대
  alternatives_korean:
  - 때들
  - 시기들
  - 때
  lexicon: HALOT
  rationale: עִתִּים은 단순한 시각이 아니라 역사적 국면과 그 요구를 가리키므로, 현대 한국어에서 가장 자연스럽고 폭넓은 ‘시대’로 옮겼습니다.
- source_word: עַל פִּי/הֶם
  english_pob_choice: under their command
  chosen_korean: 그들의 명령을 따랐습니다
  alternatives_korean:
  - 그들의 지휘 아래 있었습니다
  - 그들의 말에 따랐습니다
  - 그들의 지시에 복종했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 입에 따라’라는 관용구이므로, 위계적 통제를 드러내되 한국어에서 과도하게 군사화되지 않도록 ‘명령을 따르다’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘이 무엇을 해야 할지를 아는 지혜의 성격
  chosen_reading: 이 구절은 단순한 예언 능력보다, 구체적 역사 상황에서 공동체가 무엇을 행해야 하는지를 분별하는 실천적 지혜를 강조합니다.
  alternative_readings:
  - 미래를 예견하는 능력
  - 전략적 군사 판단 능력만을 뜻함
  rationale: 히브리어 לָדַעַת + מַה יַּעֲשֶׂה는 당위적·실천적 판단을 가리키며, 본문 문맥상 전투/편제 속에서 공동체적 분별을 강조합니다.
  doctrine_reference: 지혜문학적 분별, 공동체적 판단
