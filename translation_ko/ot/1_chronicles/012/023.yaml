  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
  footnotes:
  - marker: a
    text: Or 'like God's camp' or 'like a divine/heavenly camp.' The Hebrew keeps the expression compact and evocative.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 날마다 그들이 다윗을 도우려고 그에게 왔으며, 마침내 하나님의 진영[a]과 같은 큰 진영이 되었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적인 진영’ 또는 ‘하늘의 진영’. 히브리어 표현은 압축적이며, 그 의미의 여지를 남깁니다.
    reason: lexical_alternative
