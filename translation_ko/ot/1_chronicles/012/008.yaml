  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יוֹעֵאלָ֧ה וּ/זְבַדְיָ֛ה בְּנֵ֥י יְרֹחָ֖ם מִן הַ/גְּדֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/008.yaml
  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
  footnotes:
  - marker: a
    text: Hebrew spelling may also be transliterated 'Joelah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 요엘라와 스바댜는 여로함의 아들들로서 그돌 출신입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  english_pob_choice: and Joelah
  chosen_korean: 그리고 요엘라
  alternatives_korean:
  - 그리고 요엘라
  - 그리고 요엘라(요엘라/요에라의 다른 음역 가능)
  lexicon: HALOT
  rationale: 접속사 וְ는 앞 항목과의 나열을 한국어의 ‘그리고’로 자연스럽게 살렸고, 인명 יוֹעֵאלָה는 번역하지 않고 음역했습니다. 영어 POB의 ‘Joelah’에 맞추되, 히브리어 철자 변이에 따라 한국어 음역도 약간 달라질 수 있습니다.
- source_word: וּ/זְבַדְיָה
  english_pob_choice: and Zebadiah
  chosen_korean: 스바댜
  alternatives_korean:
  - 그리고 스바댜
  - 스바댜
  lexicon: HALOT
  rationale: 두 번째 이름 앞의 접속사는 한국어 문장 흐름상 앞의 ‘그리고’로 통합할 수 있어 이름 자체만 제시했습니다. זְבַדְיָה는 통용 음역을 따랐습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 아들들
  lexicon: HALOT
  rationale: 족보 문맥에서 בְּנֵי는 직역하면 ‘아들들’이지만, 한국어에서는 소유·소속 관계를 풀어 ‘여로함의 아들들’로 자연스럽게 옮겼습니다. POB의 ‘the sons of’와 같은 직접적 친족 의미를 유지합니다.
- source_word: מִן הַ/גְּדֽוֹר
  english_pob_choice: from Gedor
  chosen_korean: 가돌에서 온 사람들
  alternatives_korean:
  - 가돌에서 온 사람들
  - 가돌 출신입니다
  lexicon: HALOT
  rationale: מִן은 출신/기원을 나타내는 전치사로 보아 ‘에서 온’으로 옮겼고, הַגְּדוֹר는 지명 ‘Gedor’의 음역에 해당하므로 한국어 관용 음역 ‘가돌’을 사용했습니다. 문장상 ‘사람들’은 소속을 분명히 하기 위한 보충입니다.
