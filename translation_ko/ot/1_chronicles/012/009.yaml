source:
  edition: WLC
  text: וּ/מִן הַ/גָּדִ֡י נִבְדְּל֣וּ אֶל דָּוִיד֩ לַ/מְצַ֨ד מִדְבָּ֜רָ/ה גִּבֹּרֵ֣י הַ/חַ֗יִל אַנְשֵׁ֤י צָבָא֙ לַ/מִּלְחָמָ֔ה עֹרְכֵ֥י צִנָּ֖ה וָ/רֹ֑מַח וּ/פְנֵ֤י אַרְיֵה֙ פְּנֵי/הֶ֔ם וְ/כִ/צְבָאיִ֥ם עַל הֶ/הָרִ֖ים לְ/מַהֵֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
  footnotes:
  - marker: a
    text: Or 'to the stronghold in the wilderness.' The Hebrew prepositional sequence can be understood as movement toward the stronghold or arrival at it.
    reason: alternative_reading
  - marker: b
    text: Literally, 'arranging shield and spear.' The expression refers to men prepared and skilled for combat.
    reason: lexical_alternative
  - marker: c
    text: Or 'like gazelles on the mountains, quick to move.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갓 지파 사람들 가운데 일부가 광야의 요새에 있는 다윗에게로 따로 나아왔습니다.[a] 그들은 용맹한 전사들이며 전쟁에 나갈 군인들로서, 방패와 창을 갖추었고,[b] 그들의 얼굴은 사자의 얼굴 같았으며, 산 위의 가젤들처럼 민첩했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야의 요새로’. 히브리어 전치사구는 광야의 요새를 도착 지점으로 보거나 그곳에 있는 장소로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘방패와 창을 배열하는 사람들’입니다. 전투를 위해 무장을 갖추고 이를 능숙하게 다루는 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘산 위에서 빠른 가젤들처럼’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  english_pob_choice: Some of the Gadites
  chosen_korean: 길르앗 사람들 가운데 일부
  alternatives_korean:
  - 갓 사람들 가운데 일부
  - 갓 지파 가운데 일부
  lexicon: HALOT
  rationale: מן과 민족/지파 형용사 구조를 반영해 전체 집단 중 일부를 가리키는 뜻으로 옮겼습니다. 한국어에서는 ‘가운데 일부’가 자연스럽고, 본절의 개별 집단 소개를 잘 드러냅니다.
- source_word: נִבְדְּלוּ
  english_pob_choice: separated themselves
  chosen_korean: 따로 떨어져 나왔습니다
  alternatives_korean:
  - 스스로 분리되었습니다
  - 자신들을 구분하였습니다
  lexicon: HALOT
  rationale: 니팔형의 분리/구별 의미를 살리되, 단순 이동이 아니라 다윗에게 합류하려는 분리 행위를 자연스럽게 표현했습니다.
- source_word: גִּבֹּרֵי הַחַיִל
  english_pob_choice: mighty warriors
  chosen_korean: 힘센 전사들
  alternatives_korean:
  - 용맹한 전사들
  - 용사들
  lexicon: HALOT
  rationale: 관용적 군사 표현을 한국어에서 바로 이해되는 말로 옮겼습니다. ‘힘센’은 능력과 전투력의 뉘앙스를 함께 담습니다.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  english_pob_choice: men of the army for battle
  chosen_korean: 전투를 위한 군인들이었고
  alternatives_korean:
  - 전쟁을 위한 병사들이었고
  - 싸움을 위해 훈련된 사람들이었고
  lexicon: HALOT
  rationale: 군사적 정체성을 강조하는 구문이므로 직역보다 한국어에서 자연스러운 서술로 옮겼습니다. 다만 본문이 말하는 전투 지향성은 유지했습니다.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  english_pob_choice: whose faces were like the faces of lions
  chosen_korean: 얼굴은 사자와 같았고
  alternatives_korean:
  - 그들의 얼굴은 사자의 얼굴 같았고
  - 사자 같은 얼굴을 지녔고
  lexicon: HALOT
  rationale: 히브리어의 반복을 완전히 재현하기보다, 비유의 핵심인 사자 같은 위압감과 용맹성을 간명하게 살렸습니다.
- source_word: וְכִצְבָאיִם עַל הֶהָרִים לְמַהֵר
  english_pob_choice: and who were as swift as gazelles on the mountains
  chosen_korean: 산 위에서는 암사슴처럼 빠르게 움직였습니다
  alternatives_korean:
  - 산 위에서 가젤처럼 빨랐습니다
  - 산 위를 사슴처럼 날쌔게 달렸습니다
  lexicon: HALOT
  rationale: צְבָאִים를 한국어에서 익숙한 사슴류 이미지로 옮겨 속도와 민첩성을 전달했습니다. ‘빠르게 움직였습니다’는 לְמַהֵר의 속도감을 자연스럽게 반영합니다.
theological_decisions:
- issue: 다윗에게 ‘따로 떨어져 나옴’의 의미
  chosen_reading: 중립적 서술로 두고, 정치적·신학적 의도는 본문 밖으로 과도하게 확장하지 않았습니다.
  alternative_readings:
  - 충성 맹세로 해석
  - 정식 합류로 해석
  rationale: 히브리어 동사 자체는 분리/구별을 말하며, 본문만으로는 동기의 세부를 단정하기 어렵습니다. 따라서 행동 자체를 정확히 제시하고 해석은 절제했습니다.
  doctrine_reference: 본문 관찰 우선 원칙
