  alternative_readings:
  - ‘전투를 준비한’
  - ‘전투 대형을 갖춘’
  rationale: 원문의 עֹרְכֵי מִלְחָמָה는 전쟁 대비와 대형 편성을 함께 함축하므로, 서술적 표현으로 그 긴장을 살리는 것이 적절합니다.
  doctrine_reference: 본문의 역사서술적 의미 보존
