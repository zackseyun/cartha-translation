  text: 단 지파에서는 전투 대형을 갖춘 사람이 이만 팔천육백 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투를 준비한 사람’ 또는 ‘전투를 위해 진형을 편 사람’으로 옮길 수 있습니다. 히브리어 분사구는 군사적 준비 상태나 전투 진형의 편성을 나타냅니다.
    reason: lexical_alternative
