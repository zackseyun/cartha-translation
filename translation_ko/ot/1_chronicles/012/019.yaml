reference: 1 Chronicles 12:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ר֣וּחַ לָבְשָׁ֗ה אֶת עֲמָשַׂי֮ רֹ֣אשׁ ה/שלושים לְ/ךָ֤ דָוִיד֙ וְ/עִמְּ/ךָ֣ בֶן יִשַׁ֔י שָׁל֨וֹם שָׁל֜וֹם לְ/ךָ֗ וְ/שָׁלוֹם֙ לְ/עֹ֣זְרֶ֔/ךָ כִּ֥י עֲזָרְ/ךָ֖ אֱלֹהֶ֑י/ךָ וַ/יְקַבְּלֵ֣/ם דָּוִ֔יד וַֽ/יִּתְּנֵ֖/ם בְּ/רָאשֵׁ֥י הַ/גְּדֽוּד־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
  footnotes:
  - marker: a
    text: Or 'a spirit clothed Amasai' or 'the spirit came upon Amasai.' The Hebrew literally says 'spirit clothed Amasai.'
    reason: alternative_reading
  - marker: b
    text: Or 'and peace to your helper'; the Hebrew singular may be understood collectively as 'your helpers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for your God has helped you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 성령이 아마새를 두르셨습니다. 그는 이렇게 말했습니다. 「다윗이여, 우리를 받아 주십시오. 이새의 아들이여, 당신과 함께 있겠습니다! 평강, 평강이 당신에게, 그리고 당신을 돕는 이들에게 있기를 빕니다. 이는 당신의 하나님이 당신을 도우시기 때문입니다.」 그때 다윗이 그들을 받아들여 부대의 우두머리들로 세웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘영이 아마새를 옷 입혔다’에 가깝습니다.
    reason: source_note
  - marker: b
    text: ‘당신을 돕는 이들’은 히브리어 단수 표현을 집합적으로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 ‘당신의 하나님이 당신을 도우셨습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  english_pob_choice: the Spirit clothed
  chosen_korean: 성령이 … 두르셨습니다
  alternatives_korean:
  - 영이 … 입히셨습니다
  - 성령이 … 입으셨습니다
  - 영이 … 두르셨습니다
  lexicon: HALOT
  rationale: לָבַשׁ의 기본 이미지는 ‘입다/두르다’이므로, ‘두르셨습니다’로 옷 입히는 은유를 살렸습니다. 문맥상 신적 주체를 가리키는 해석을 반영해 ‘성령’으로 옮겼습니다.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  english_pob_choice: chief of the Thirty
  chosen_korean: 아마새
  alternatives_korean:
  - 삼십인대의 우두머리 아마새
  - 삼십인의 우두머리 아마새
  - 삼십 명의 우두머리 아마새
  lexicon: HALOT
  rationale: 이미 바로 뒤에 아마새의 지위가 설명되므로, 이름과 직함을 자연스럽게 붙여 ‘아마새’를 유지하고 직함은 뒤에서 풀어 주었습니다.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  english_pob_choice: Peace, peace to you
  chosen_korean: 평강, 평강이 당신에게
  alternatives_korean:
  - 평강, 평강이 당신에게 있기를
  - 평강, 평강이 그대에게
  - 평강이 당신에게, 평강이
  lexicon: HALOT
  rationale: 반복을 그대로 살려 강조를 보존했고, 합쇼체 문맥에서 직설형보다 축복형으로 자연스럽게 풀었습니다.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  english_pob_choice: for your God helps you
  chosen_korean: 이는 당신의 하나님이 당신을 도우시기 때문입니다
  alternatives_korean:
  - 이는 당신의 하나님이 당신을 도우셨기 때문입니다
  - 당신의 하나님이 당신을 도우십니다
  lexicon: HALOT
  rationale: 현재형/완료형의 여지를 열어 두기보다, 문맥상 축복의 근거를 분명히 드러내는 종속절로 옮겼습니다. ‘하나님’은 본문 용례에 맞게 유지했습니다.
- source_word: וַיְקַבְּלֵם
  english_pob_choice: received them
  chosen_korean: 받아들여
  alternatives_korean:
  - 맞아들여
  - 영접하여
  - 받아
  lexicon: HALOT
  rationale: קבל은 단순 수락보다 관계적 수용을 포함할 수 있어, 군사 지도자로 맞는 장면에 맞는 ‘받아들여’로 옮겼습니다.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  english_pob_choice: made them chiefs of the troops
  chosen_korean: 부대의 우두머리들로 세웠습니다
  alternatives_korean:
  - 무리의 우두머리들로 세웠습니다
  - 부대의 장들로 세웠습니다
  - 군대의 지휘관들로 세웠습니다
  lexicon: HALOT
  rationale: גְּדוּד은 부대/떼/출정대의 뜻이 있어 군사적 맥락을 살려 ‘부대’로 옮겼고, ‘세웠습니다’는 임명 행위를 자연스럽게 드러냅니다.
theological_decisions:
- issue: רוּחַ를 인격적 신적 영으로 볼지, 비인격적 영/영감으로 볼지
  chosen_reading: 문맥상 성령의 주도적 역사로 읽어 ‘성령’으로 번역하되, 히브리어의 은유적 표현(‘두르다’)은 그대로 살렸습니다.
  alternative_readings:
  - 영이 아마새를 두르셨습니다
  - 어떤 영이 아마새를 두르셨습니다
  - 영감이 아마새에게 임했습니다
  rationale: 역대기 전체의 예언적·카리스마적 장면과, 이 구절 뒤의 담대한 발화가 신적 영의 감동을 강하게 시사합니다. 다만 원문의 표현 강도를 지우지 않기 위해 ‘두르다’의 이미지를 유지했습니다.
  doctrine_reference: 역대기에서의 성령/영의 역사에 대한 본문적 해석
- issue: וְעִמְּךָ / לְעֹזְרֶךָ의 복수 뉘앙스를 한국어에서 어떻게 처리할지
  chosen_reading: ‘당신과 함께 있겠습니다’, ‘당신을 돕는 이들’로 옮겨 단수 호칭 속 공동체적 동행과 복수적 도움을 함께 드러냈습니다.
  alternative_readings:
  - 당신과 함께 있습니다
  - 당신의 도우미에게도 평강이 있기를
  rationale: 히브리어는 단수 어미를 유지하면서도 문맥상 복수적 집단을 품을 수 있으므로, 한국어에서는 자연스러운 문장 속에 그 긴장을 보존했습니다.
  doctrine_reference: 본문의 공동체적 충성 고백과 축복의 범위
