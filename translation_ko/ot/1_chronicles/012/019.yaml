  naturalness: ‘영이 아마새를 감싸자’는 히브리어의 ‘입히다’ 은유를 완전히 직역하지는 않지만 현대 한국어에서 자연스럽고, 각주로 문자적 표현을 보완할 수 있습니다. 발화는 ‘우리는 당신의 사람들입니다’와 ‘우리는 당신과 함께합니다’로 옮기면 충성 선언의 병행과 합쇼체를 모두 살립니다.
  terminology: ‘삼십인’은 특정 군사 집단을 가리키는 관례적 표현으로 유지하고, רוּחַ는 본문에서 ‘영’으로 번역합니다. ‘평강’은 축복·인사 공식인 שָׁלוֹם에 적절하며, ‘부대의 지휘관들’은 군사 맥락의 גְּדוּד와 복수의 רָאשִׁים를 자연스럽게 반영합니다.
