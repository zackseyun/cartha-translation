  to: 영이 아마새, 곧 삼십인의 우두머리를 감싸자[a], 그가 말했습니다. “다윗이여, 우리는 당신의 사람들입니다. 이새의 아들이여, 우리는 당신과 함께합니다! 당신에게 평강, 평강이 있기를 빕니다. 또 당신을 돕는 이들에게도[b] 평강이 있기를 빕니다. 당신의 하나님께서 당신을 도우셨기 때문입니다[c].” 그때 다윗은 그들을 받아들여 부대의 지휘관들로 세웠습니다.
  rationale: 누락된 아마새의 직함을 복원하고, 잘못 요청문으로 바뀐 충성 선언을 원문의 의미에 맞게 고쳤습니다. ‘영’의 지시 대상과 하나님의 도움의 시제는 원문이 허용하는 해석 여지를 각주에서 보존했습니다. 각주 표지는 해당 표현 바로 뒤에 배치했습니다.
