  - severity: medium
    issue: 각주 표지 [a]가 문장 끝에 놓여 대안이 어느 표현에 적용되는지 불명확합니다.
    rationale: 각주는 הַחֲרִיפִי/‘하룹 사람’의 대안만 설명하므로 해당 표현 바로 뒤에 두어야 합니다.
