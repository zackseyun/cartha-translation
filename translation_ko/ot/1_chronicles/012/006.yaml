  yaml_path: translation/ot/1_chronicles/012/006.yaml
  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
  footnotes:
  - marker: a
    text: Or "the Hariphite." The Hebrew gentilicial form may reflect a clan name also represented elsewhere with the form Hariph.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘르아자이, 여리못, 브알야, 세마랴후, 그리고 하룹 사람 스바댜입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하리프 사람’. 히브리어의 gentilicial 형식은 다른 곳에 보이는 하리프라는 씨족명과 연결될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
