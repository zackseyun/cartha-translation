  source_fidelity: 수정이 필요합니다. אֶלְעוּזַי는 대략 엘루자이(Eluzai)로 옮겨야 하는데, 초안의 ‘엘르아자이’에는 원문에 없는 음절이 들어가 있습니다. 또한 וּשְׁמַרְיָהוּ의 첫 음절은 셰와를 가진 שְׁ(šə-)이므로 ‘스마랴후’가 원문 음가와 한국어 성경식 표기에 더 가깝습니다. הַחֲרִיפִי는 스바댜를 수식하는 씨족/소속 명칭이며, 본문의 ‘하룹 사람’ 및 대안 ‘하리프 사람’ 처리는 영어 POB의 불확실성 표기를 보존할 수 있습니다.
  naturalness: 명단을 한 문장으로 제시하고 마지막 항목에만 ‘그리고’를 쓰는 방식은 자연스럽습니다. 다만 주석 표지는 대안이 걸리는 ‘하룹 사람’에 바로 붙여야 하며, 주석에서는 영어 문법 용어 gentilicial을 자연스러운 한국어로 바꾸는 것이 좋습니다.
  terminology: ‘하룹 사람’은 씨족·가문 소속을 나타내는 호칭으로 무난합니다. 주석에서는 ‘히브리어의 씨족 소속을 나타내는 형태’라고 하여 의미를 명료하게 밝혔습니다. 인명은 음역으로 유지했습니다.
