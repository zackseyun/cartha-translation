  english_pob_choice: the Haruphite
  chosen_korean: 하룹 사람
  alternatives_korean:
  - 하룹 사람
  - 하리프 사람
  lexicon: HALOT
  rationale: 지명/씨족명 성격의 gentilicial 형식을 ‘-사람’으로 옮겨 소속을 드러냈고, 영어 주석이 제시한 Hariph/Haruph의 변이 가능성을 한국어 본문에서는 가장 सीधे하게 반영했습니다.
