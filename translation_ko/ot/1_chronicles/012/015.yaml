  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
  footnotes:
  - marker: a
    text: Or, more literally, 'one for a hundred, and the great one for a thousand'—an idiom expressing military prowess or effectiveness.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 갓 자손 가운데서 나온 군대의 우두머리들이었습니다. 그들 가운데 가장 낮은 이 하나는 백 명에 맞설 만했고, 가장 높은 이 하나는 천 명에 맞설 만했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “가장 낮은 이 하나는 백 명에게, 가장 높은 이 하나는 천 명에게”입니다. 히브리어의 압축된 표현으로, 군사적 능력이나 효율을 나타냅니다.
    reason: lexical_alternative
