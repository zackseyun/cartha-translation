id: 1CH.12.4
reference: 1 Chronicles 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִֽשְׁמַֽעְיָ֧ה הַ/גִּבְעוֹנִ֛י גִּבּ֥וֹר בַּ/שְּׁלֹשִׁ֖ים וְ/עַל הַ/שְּׁלֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/004.yaml
  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
  footnotes:
  - marker: a
    text: Or 'of the Thirty'; the Hebrew preposition may denote membership in the elite group called 'the Thirty.'
    reason: lexical_alternative
  - marker: b
    text: '''Over the Thirty'' likely indicates a position of leadership or higher rank in relation to the Thirty.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 기브온 사람 이스마야는 삼십인 가운데 한 용사였고[a], 삼십인 위에 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘삼십인에 속한 용사’; 히브리어 전치사는 이 정예 집단의 구성원을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘삼십인 위에 있었다’는 표현은 그들에 대한 지휘권이나 그보다 높은 지위를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִשְׁמַֽעְיָ֧ה
  english_pob_choice: and Ishmaiah
  chosen_korean: 그리고 … 이스마야는
  alternatives_korean:
  - 이스마야는
  lexicon: HALOT
  rationale: 접속사 וְ를 앞의 인물 목록을 잇는 말로 살려 ‘그리고’로 옮기고, 고유명사는 현대식 음역으로 처리했습니다.
- source_word: הַ/גִּבְעוֹנִ֛י
  english_pob_choice: the Gibeonite
  chosen_korean: 기브온 사람
  alternatives_korean:
  - 기브온 출신의
  - 기브온인
  lexicon: HALOT
  rationale: 지명 기브온에서 나온 사람이라는 민족/출신 표지를 한국어에서 자연스러운 명사구인 ‘기브온 사람’으로 옮겼습니다.
- source_word: גִּבּ֥וֹר
  english_pob_choice: a mighty man
  chosen_korean: 용사
  alternatives_korean:
  - 용맹한 사람
  - 힘센 사람
  - 강한 용사
  lexicon: HALOT
  rationale: 이 문맥의 גִּבּוֹר는 전사적 역량을 가진 인물을 가리키므로, 중복을 피하면서도 위상을 살리는 ‘용사’가 적절합니다.
- source_word: בַּ/שְּׁלֹשִׁ֖ים
  english_pob_choice: among the Thirty
  chosen_korean: 삼십인 가운데의
  alternatives_korean:
  - 삼십인 중의
  - 삼십인 가운데
  - 삼십인에 속한
  lexicon: HALOT
  rationale: 히브리어 전치사 בְּ와 정관사가 붙은 표현은 ‘삼십인’이라는 정예 집단의 구성원임을 나타내므로, 소속감을 드러내는 ‘가운데의’로 옮겼습니다.
- source_word: וְ/עַל הַ/שְּׁלֹשִֽׁים־
  english_pob_choice: and over the Thirty
  chosen_korean: 그리고 삼십인 위에 있었습니다
  alternatives_korean:
  - 그리고 삼십인의 우두머리였습니다
  - 그리고 삼십인을 다스렸습니다
  - 그리고 삼십인 위에 있었습니다
  lexicon: HALOT
  rationale: עַל은 이 문맥에서 지위나 권위를 가리키므로, 짧고 직설적인 ‘위에 있었습니다’로 옮겨 상위 직분을 드러냈습니다.
theological_decisions:
- issue: ‘삼십인’의 번역에서 집단명과 위계 표현을 동시에 살리는 문제
  chosen_reading: ‘삼십인 가운데의 용사’와 ‘삼십인 위에 있었습니다’를 함께 유지했습니다.
  alternative_readings:
  - ‘삼십인 중의 용사’
  - ‘삼십인의 지도자’
  rationale: 본문은 그가 정예 부대의 구성원이면서 동시에 그 위에 선 지위였음을 병치하므로, 둘 중 하나로 평면화하지 않고 함께 살렸습니다.
  doctrine_reference: 본문 주해/서술적 뉘앙스 보존
