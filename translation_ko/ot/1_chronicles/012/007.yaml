  rationale: 이 문맥은 개별 인물들과 함께 그들이 속한 혈연/족속 집단을 제시하므로, 한국어에서도 집단 소속을 직접 드러내는 표현이 가장 충실합니다.
  doctrine_reference: 족보·지파 표지의 역사적 서술
