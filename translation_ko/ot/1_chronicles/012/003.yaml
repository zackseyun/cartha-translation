source:
  edition: WLC
  text: הָ/רֹ֨אשׁ אֲחִיעֶ֜זֶר וְ/יוֹאָ֗שׁ בְּנֵי֙ הַ/שְּׁמָעָ֣ה הַ/גִּבְעָתִ֔י ו/יזואל וָ/פֶ֖לֶט בְּנֵ֣י עַזְמָ֑וֶת וּ/בְרָכָ֕ה וְ/יֵה֖וּא הָ/עֲנְּתֹתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
  footnotes:
  - marker: a
    text: Hebrew ויזואל may also be transliterated 'Iziel.'
    reason: lexical_alternative
  - marker: b
    text: The name 'Beracah' is also often spelled 'Berakah' in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 우두머리는 아히에셀이었고, 그다음은 요아스였으며, 그게아 사람 스마아의 아들들이었습니다. 또 에지엘과 벨렛, 아스마벳의 아들들과 베라가와 이두, 아나돗 사람들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ויזואל은 ‘이지엘’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘베라가’는 영어 음역에서 ‘베라카(Berakah)’로도 자주 적힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  english_pob_choice: The chief was
  chosen_korean: 우두머리는
  alternatives_korean:
  - 수장은
  - 머리는
  - 지도자는
  lexicon: HALOT
  rationale: 이 문맥은 족보식 명단에서 첫째 사람을 가리키므로, 문자적인 ‘머리’보다 서열상의 우두머리를 드러내는 표현이 적절합니다.
- source_word: בְּנֵי הַשְּׁמָעָה הַגִּבְעָתִי
  english_pob_choice: the sons of Shemaah the Gibeathite
  chosen_korean: 그게아 사람 스마아의 아들들
  alternatives_korean:
  - 기브아 사람 스마아의 아들들
  - 스마아의 아들들, 그게아 사람
  lexicon: HALOT
  rationale: בְּנֵי는 족보 관용구로 ‘아들들’로 옮기고, הַגִּבְעָתִי는 출신지를 나타내는 gentillic이므로 ‘그게아 사람’으로 풀어 자연스럽게 했습니다.
- source_word: וִיזוֹאֵל / וָפֶלֶט
  english_pob_choice: Jeziel and Pelet
  chosen_korean: 에지엘과 벨렛
  alternatives_korean:
  - 이지엘과 벨렛
  - 에지엘과 페렛
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역에 맞춰 옮겼고, ויזואל의 자음값을 반영해 ‘에지엘’로 처리했습니다.
- source_word: בְּרָכָה
  english_pob_choice: Beracah
  chosen_korean: 베라가
  alternatives_korean:
  - 베라카
  - 베라카흐
  lexicon: HALOT
  rationale: 고유명사는 한국어 표기 관례에 따라 음역했으며, 영어 POB의 철자 변이 가능성은 한국어 본문보다 각주에 둘 필요가 없어 본문은 한 형태로 통일했습니다.
- source_word: הָעֲנְּתֹתִי
  english_pob_choice: the Anathothite
  chosen_korean: 아나돗 사람들
  alternatives_korean:
  - 아나돗 사람
  - 아나돗 출신들
  lexicon: HALOT
  rationale: gentilic 형용사를 출신지를 나타내는 관용적 한국어 표현으로 옮겼습니다.
