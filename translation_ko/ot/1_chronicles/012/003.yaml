  - severity: medium
    issue: 아나돗 출신자를 복수 ‘사람들’로 번역
    rationale: הָעֲנְּתֹתִי는 브라가와 예후에 병렬로 놓인 단수 gentilic이므로 ‘아나돗 사람’이 적절합니다.
