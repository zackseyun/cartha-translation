  source_fidelity: 수정이 필요합니다. 현 초안은 기브아(הַגִּבְעָתִי)를 ‘그게아’로 잘못 표기했고, 여시엘(ויזואל)을 ‘에지엘’로, 예후(וְיֵהוּא)를 ‘이두’로 옮겨 고유명사 대응이 부정확합니다. 또한 아나돗의 단수 출신자(הָעֲנְּתֹתִי)를 복수 ‘사람들’로 처리한 것은 원문과 맞지 않습니다. 명단의 두 부자(父子) 집단과 뒤의 두 인물을 구분하도록 문장을 재구성했습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 명단의 병렬 구조를 자연스럽게 드러냅니다. ‘그다음은’은 원문의 단순 접속을 과도하게 해석하지 않으면서 명단 흐름을 명료하게 합니다.
  terminology: ‘우두머리’, ‘아들들’, ‘기브아 사람’, ‘아나돗 사람’은 각각 רֹאשׁ, בְּנֵי, 두 gentillic의 의미를 적절히 반영합니다. 한국어 성경 음역 관례에 맞추어 아히에셀, 요아스, 스마아, 여시엘, 벨렛, 아스마웻, 브라가, 예후를 사용했습니다.
