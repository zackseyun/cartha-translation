  naturalness: 초안의 ‘군복무를 하러 나온 자가 전투를 위해 진을 펼 수 있는 사만 명’은 수식 관계가 어색하고, ‘진을 펼 수 있는 사만 명’이 다소 부자연스럽습니다. 수정안은 인원 수를 서술어에 자연스럽게 연결하고 현대 표준어 합쇼체 문장으로 다듬습니다.
