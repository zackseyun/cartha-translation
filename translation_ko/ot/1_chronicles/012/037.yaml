revisions:
- from: 그리고 아셀에서, 군복무를 하러 나온 자가 전투를 위해 진을 펼 수 있는 사만 명이었습니다.
  to: 그리고 아셀에서는 군복무를 위해 나아가 전투를 위해 진을 갖출 수 있는 자가 사만 명이었습니다.
  rationale: 원문의 열거식 군사 인원 보고를 유지하면서, ‘군복무를 위해 나아가’와 ‘전투를 위해 진을 갖출 수 있는’이 함께 ‘자’를 수식하도록 구조를 바로잡았습니다. ‘할 수 있는’은 이 문맥에서 군사 복무와 전투 대형 편성에 적합한 이들을 가리키는 분사구의 자격·준비 의미를 자연스럽게 반영합니다. 별도 각주는 한국어 본문만으로 핵심 의미가 충분히 전달되므로 필요하지 않습니다.
