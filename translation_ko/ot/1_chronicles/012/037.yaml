source:
  edition: WLC
  text: וּ/מֵ/אָשֵׁ֗ר יוֹצְאֵ֥י צָבָ֛א לַ/עֲרֹ֥ךְ מִלְחָמָ֖ה אַרְבָּעִ֥ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/037.yaml
  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
  footnotes:
  - marker: a
    text: Or 'forty thousand able to array themselves for war.' The Hebrew combines 'going out for military service' with a verb meaning 'to arrange/draw up' in battle formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아셀에서, 군복무를 하러 나온 자가 전투를 위해 진을 펼 수 있는 사만 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  english_pob_choice: And from Asher
  chosen_korean: 그리고 아셀에서
  alternatives_korean:
  - 아셀에서
  - 그리고 아셀로부터
  - 그리고 아셀 지파에서
  lexicon: HALOT
  rationale: 전치사 מִן의 출발점 의미를 자연스러운 한국어로 살려 ‘-에서’로 옮겼고, 지파명은 본문이 추가 설명 없이도 이해되므로 간결하게 유지했습니다.
- source_word: יוֹצְאֵי
  english_pob_choice: who went out
  chosen_korean: 나온 자가
  alternatives_korean:
  - 나가던 자가
  - 출정한 자가
  - 나아간 자가
  lexicon: HALOT
  rationale: יצא의 분사적 의미를 살리되 군사 문맥에서 ‘출정한’보다 덜 해석적인 ‘나온 자가’로 옮겨, 뒤의 군사 목적어와 함께 읽히게 했습니다.
- source_word: צָבָא
  english_pob_choice: for military service
  chosen_korean: 군복무를 하러
  alternatives_korean:
  - 군역을 하러
  - 군사 봉사를 하러
  - 전쟁을 위해
  lexicon: HALOT
  rationale: צָבָא는 여기서 ‘군대’ 자체보다 조직된 군사 복무의 성격을 가리키므로, POB의 의미를 따라 기능을 드러내는 ‘군복무를 하러’로 옮겼습니다.
- source_word: לַ/עֲרֹךְ מִלְחָמָה
  english_pob_choice: to array themselves for battle
  chosen_korean: 전투를 위해 진을 펼 수 있는
  alternatives_korean:
  - 전투를 위해 대열을 갖출 수 있는
  - 싸움을 위해 진을 펼 수 있는
  - 전투를 위해 정렬할 수 있는
  lexicon: HALOT
  rationale: ערך + מלחמה는 단순 ‘정리하다’보다 전투 대형을 갖추는 뜻이므로, ‘진을 펼다’로 군사적 배열을 살리되 문장 전체에서 능력/준비의 의미가 드러나도록 표현했습니다.
