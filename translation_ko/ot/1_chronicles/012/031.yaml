  lexicon: HALOT
  rationale: 관용구의 군사적 강함과 용맹을 살리되, 한국어에서 과도하게 중복되는 ‘힘센/용사’ 표현을 줄여 간결하게 옮겼습니다.
- source_word: אַנְשֵׁי שֵׁמוֹת
  english_pob_choice: men of renown
  chosen_korean: 이름난 사람들
  alternatives_korean:
  - 명망 있는 사람들
