  text: וּ/מִן בְּנֵ֣י אֶפְרַ֔יִם עֶשְׂרִ֥ים אֶ֖לֶף וּ/שְׁמוֹנֶ֣ה מֵא֑וֹת גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֥י שֵׁמ֖וֹת לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
  footnotes:
  - marker: a
    text: Or 'distinguished men'; literally 'men of names,' an idiom for notable or well-known men.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에브라임의 아들들 가운데서, 용맹한 장정 이만팔백 명과 이름난 사람들이 있었으며, 그들은 각자의 조상의 집안에 속해 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이름난 사람들’은 직역하면 ‘이름의 사람들’로, 이름이 알려진 사람들 또는 명망 있는 사람들을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And from
  chosen_korean: 그리고 … 가운데서
  alternatives_korean:
  - 그리고 …에서
  - … 가운데서
  lexicon: HALOT
  rationale: 열거를 이어 가는 접속적 전개를 살리면서, 히브리어 전치사 מן의 출처/범주 의미를 한국어에서 자연스럽게 전달합니다.
- source_word: בְּנֵי אֶפְרַיִם
  english_pob_choice: the sons of Ephraim
  chosen_korean: 에브라임의 아들들
  alternatives_korean:
  - 에브라임 사람들
  - 에브라임의 자손들
  lexicon: HALOT
  rationale: 직역적 형식을 유지해 지파 족보적 표현을 살리고, 문맥상 에브라임 지파 구성원들을 가리키는 의미를 반영합니다.
- source_word: גִּבּוֹרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 장정
  alternatives_korean:
  - 용맹한 용사들
  - 힘센 전사들
  - 용맹한 남자들
  lexicon: HALOT
  rationale: 관용구의 군사적 강함과 용맹을 살리되, 한국어에서 과도하게 중복되는 ‘힘센/용사’ 표현을 줄여 간결하게 옮겼습니다.
- source_word: אַנְשֵׁי שֵׁמוֹת
  english_pob_choice: men of renown
  chosen_korean: 이름난 사람들
  alternatives_korean:
  - 명망 있는 사람들
  - 유명한 사람들
  - 이름 있는 사람들
  lexicon: HALOT
  rationale: ‘이름의 사람들’이라는 직역보다 관용적 의미인 ‘널리 알려진/명망 있는 사람들’을 자연스러운 현대 한국어로 풀었습니다.
- source_word: לְבֵית אֲבוֹתָם
  english_pob_choice: according to their fathers’ houses
  chosen_korean: 각자의 조상의 집안에 속해 있었습니다
  alternatives_korean:
  - 각자의 아버지들의 집안에 따라
  - 조상의 집안별로
  - 가문에 따라
  lexicon: HALOT
  rationale: 히브리어의 씨족·가문 분류를 드러내기 위해 ‘조상의 집안’을 유지했고, 한국어 문장에서는 소속을 나타내는 방식으로 풀어 읽기 쉽게 했습니다.
