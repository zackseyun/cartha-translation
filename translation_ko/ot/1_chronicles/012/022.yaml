reference: 1 Chronicles 12:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵ֗מָּה עָזְר֤וּ עִם דָּוִיד֙ עַֽל הַ/גְּד֔וּד כִּֽי גִבּ֥וֹרֵי חַ֖יִל כֻּלָּ֑/ם וַ/יִּהְי֥וּ שָׂרִ֖ים בַּ/צָּבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
  footnotes:
  - marker: a
    text: Or 'against the band' or 'against the troop'; the Hebrew גְּדוּד can refer to a military band or raiding party.
    reason: lexical_alternative
  - marker: b
    text: Or 'mighty warriors'; the Hebrew phrase גִבּוֹרֵי חַיִל is a standard expression for valiant, capable fighting men.
    reason: lexical_alternative
  - marker: c
    text: Or 'captains' or 'chiefs' for 'commanders.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 다윗을 도와 그 약탈대에 맞섰습니다[a]. 모두가 용맹한 전사였고[b], 그들은 군대의 지휘관이 되었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 무리에게 맞서’로도 옮길 수 있습니다. 히브리어 גְּדוּד는 군사 부대나 약탈 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘용맹한 군사들’로도 옮길 수 있습니다. 히브리어 גִבּוֹרֵי חַיִל은 유능하고 용감한 전사들을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘대장들’이나 ‘우두머리들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרוּ עִם דָּוִיד עַל הַגְּדוּד
  english_pob_choice: helped David against the raiding band
  chosen_korean: 다윗을 도와 그 약탈대에 맞섰습니다
  alternatives_korean:
  - 다윗과 함께 그 군대를 도왔습니다
  - 다윗을 도와 그 떼를 공격했습니다
  lexicon: HALOT
  rationale: עזר는 ‘도와주다’가 직접적이고, עַל + גְּדוּד는 적대적 대치를 나타내므로 ‘맞서다’로 풀어 자연스럽게 옮겼습니다. גְּדוּד는 문맥상 ‘약탈대’가 가장 구체적입니다.
- source_word: גִבּוֹרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 전사
  alternatives_korean:
  - 용맹한 용사
  - 강한 전사들
  - 용맹한 군사
  lexicon: HALOT
  rationale: 고정된 군사 표현의 힘은 살리되, 한국어에서 더 자연스럽고 읽기 쉬운 ‘용맹한 전사’로 옮겼습니다. ‘of valor’의 평가적 뉘앙스를 함께 반영합니다.
- source_word: שָׂרִים בַּצָּבָא
  english_pob_choice: commanders in the army
  chosen_korean: 군대의 지휘관
  alternatives_korean:
  - 군대의 지휘자
  - 군대의 장관
  - 군사의 지도자
  lexicon: HALOT
  rationale: שָׂרִים은 이 군사 문맥에서 지휘 책임자를 가리키므로 ‘지휘관’이 가장 분명합니다. בַּצָּבָא의 조직된 군사력을 ‘군대’로 자연스럽게 표현했습니다.
- source_word: וַיִּהְיוּ
  english_pob_choice: they became
  chosen_korean: 그들은 ... 되었습니다
  alternatives_korean:
  - 그들은 ...이었습니다
  - 그들은 ...로 세워졌습니다
  lexicon: HALOT
  rationale: 동사 היה의 서술적 결과 상태를 살려, 단순 현재 상태보다 변화의 흐름을 드러내는 ‘되다’로 옮겼습니다.
theological_decisions:
- issue: 전투 참여와 직분 승격의 서술을 어떻게 옮길지
  chosen_reading: 본문은 다윗을 위한 군사적 협력과 그 결과로서의 지휘 직분 부여를 사실 서술로 제시합니다.
  alternative_readings:
  - 영웅적 찬양으로 과장해 읽기
  - 도덕적 교훈을 앞세워 일반화하기
  rationale: 사울-다윗 시기의 역사 서술 문맥을 유지하여, 평가를 과장하지 않고 서술의 초점을 보존했습니다.
  doctrine_reference: 역사서 본문 해석 원칙
