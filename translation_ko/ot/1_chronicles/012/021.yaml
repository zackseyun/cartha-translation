id: 1CH.12.21
reference: 1 Chronicles 12:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'fell to him,' an idiom meaning they went over to David's side.
    reason: lexical_alternative
  - marker: b
    text: The name Jozabad appears twice in the Hebrew list, indicating two different men with the same name.
    reason: cultural_note
  - marker: c
    text: '''Chiefs of the thousands'' may refer to commanders of military units or leaders of clan divisions within Manasseh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 시글락으로 갈 때에, 므낫세 사람들 가운데서 아드나와 요사밧과 여디아엘과 미가엘과 또 다른 요사밧과 엘리후와 실르대가 그에게로 넘어왔습니다. 그들은 므낫세에 속한 천 단위의 우두머리들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천 단위의 우두머리들’(히브리어 ‘알라핌의 우두머리들’)은 천 명 규모의 군사 단위를 지휘하는 이들을 가리킬 수도 있고, 므낫세의 씨족 단위 지도자들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ אֶל צִיקְלַג
  english_pob_choice: As he went to Ziklag
  chosen_korean: 그가 시글락으로 갈 때에
  alternatives_korean:
  - 그가 시글락으로 갔을 때
  - 그가 시글락으로 가는 중에
  lexicon: HALOT
  rationale: בְּ + לקח/הלך 계열의 시간적 용법을 자연스러운 한국어 종속절로 옮겼으며, אֶל은 목적지 방향을 살려 ‘~으로’로 처리했습니다.
- source_word: נָפְלוּ עָלָיו
  english_pob_choice: defected to him
  chosen_korean: 그에게로 넘어왔습니다
  alternatives_korean:
  - 그에게로 떨어졌습니다
  - 그에게 합류했습니다
  lexicon: HALOT
  rationale: 직역의 ‘떨어지다’는 한국어에서 의미가 불분명하므로, 정치·군사적 충성 이동을 드러내는 ‘넘어오다’로 옮겼습니다.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  english_pob_choice: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai
  chosen_korean: 아드나와 요사밧과 여디야엘과 미가엘과 또 다른 요사밧과 엘리후와 실르대
  alternatives_korean:
  - 아드나, 요사밧, 여디아엘, 미가엘, 요사밧, 엘리후, 실르대
  lexicon: HALOT
  rationale: 고유명사는 표준 외래어 표기를 따르되, 히브리어에 같은 이름이 두 번 나오는 점을 반영해 두 번째 יוֹזָבָד를 ‘또 다른 요사밧’으로 밝혔습니다.
- source_word: רָאשֵׁי הָאֲלָפִים
  english_pob_choice: chiefs of the thousands
  chosen_korean: 천부장들
  alternatives_korean:
  - 천 명의 우두머리들
  - 천부의 지도자들
  lexicon: HALOT
  rationale: אֲלָפִים은 문맥상 군사 단위를 가리킬 수 있어, 한국어에서 그 기능을 가장 자연스럽게 드러내는 ‘천부장들’로 옮겼습니다.
theological_decisions:
- issue: ֑עַדְנַח וְ... וְיוֹזָבָד의 반복 이름 처리
  chosen_reading: 같은 이름의 인물이 두 명이라는 점을 본문 그대로 보존했습니다.
  alternative_readings:
  - 이름을 한 번만 적어 정리하는 방식
  - 둘째 이름을 다른 음역으로 바꾸는 방식
  rationale: 히브리어 본문과 영어 POB 주석이 모두 요사밧의 중복을 지적하므로, 텍스트의 중복성을 지우지 않고 ‘또 다른 요사밧’으로 독자 이해를 돕는 것이 적절합니다.
  doctrine_reference: 본문 비평 및 인명 전승 보존
- issue: רָאשֵׁי הָאֲלָפִים의 제도적 뉘앙스
  chosen_reading: 군사 지휘관 성격을 우선 드러내되, 본문의 넓은 가능성은 유지했습니다.
  alternative_readings:
  - 지파의 족장들
  - 부대 지휘관들
  rationale: 역대기 문맥에서 אֲלָפִים은 군사 단위 또는 씨족 단위를 가리킬 수 있으므로, 단정적 해석보다 군사적 실상을 드러내는 번역이 안전합니다.
  doctrine_reference: 역대기서의 조직 구조 해석
