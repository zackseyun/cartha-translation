base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
  footnotes:
  - marker: a
    text: Or 'all the remnant of Israel.' Here the sense is likely 'all the rest of Israel' in context, not the prophetic-theological 'remnant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들 모두는 전쟁의 사람들이며 전투 대형을 갖춘 이들이었는데, 온전한 마음으로 헤브론에 와서 다윗을 온 이스라엘의 왕으로 세우려고 했습니다. 또 이스라엘의 나머지 모든 사람도 한마음으로 다윗을 왕으로 세우려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 나머지 모든 사람’은 문맥상 ‘이스라엘의 남은 자’라는 기술적 신학 용어보다, 이미 앞에서 언급되지 않은 나머지 백성을 가리키는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  english_pob_choice: men of war
  chosen_korean: 전쟁의 사람들
  alternatives_korean:
  - 전사들
  - 전쟁하는 사람들
  - 전투원들
  lexicon: HALOT
  rationale: 직역적 구조를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다. ‘전사들’은 의미는 분명하지만 원문의 구성어 감각이 약해집니다.
- source_word: עֹדְרֵי מַעֲרָכָה
  english_pob_choice: arrayed for battle
  chosen_korean: 전투 대형을 갖춘
  alternatives_korean:
  - 전투 진형을 갖춘
  - 전열을 갖춘
  - 전투를 위해 정렬된
  lexicon: HALOT
  rationale: 병력의 배치·진형 형성을 나타내는 표현이므로, ‘전투 대형’으로 군사적 형상성을 분명히 했습니다.
- source_word: בְּלֵבָב שָׁלֵם
  english_pob_choice: with a whole heart
  chosen_korean: 온전한 마음으로
  alternatives_korean:
  - 온전한 심령으로
  - 온 마음으로
  - 온전한 뜻으로
  lexicon: HALOT
  rationale: ‘마음’ 이미지와 내적 완전성을 함께 살리되, 한국어에서 더 자연스러운 관용을 선택했습니다. ‘온전한’이 분열되지 않은 충성을 잘 드러냅니다.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  english_pob_choice: all the rest of Israel
  chosen_korean: 이스라엘의 나머지 모든 사람
  alternatives_korean:
  - 이스라엘의 남은 자 모두
  - 이스라엘의 남은 무리 모두
  - 이스라엘의 나머지
  lexicon: HALOT
  rationale: 이 문맥에서는 예언적 ‘남은 자’보다 목록에 포함되지 않은 나머지 백성을 뜻하므로, POB처럼 ‘rest’의 의미를 살렸습니다.
theological_decisions:
- issue: שֵׁרִית를 ‘남은 자/남은 무리’로 번역할지 여부
  chosen_reading: ‘이스라엘의 나머지 모든 사람’으로 옮겨, 기술적 ‘남은 자’ 뉘앙스를 피했습니다.
  alternative_readings:
  - 이스라엘의 남은 자 모두
  - 이스라엘의 남은 무리 모두
  rationale: 이 절은 다윗 즉위를 지지하는 전국적 결집을 요약하는 역사 서술이므로, 예언서에서 중요한 구원사적 용어인 ‘남은 자’의 신학적 무게를 여기로 가져오지 않는 편이 문맥에 충실합니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
