source:
  edition: WLC
  text: בְּנֵ֣י יְהוּדָ֔ה נֹשְׂאֵ֥י צִנָּ֖ה וָ/רֹ֑מַח שֵׁ֧שֶׁת אֲלָפִ֛ים וּ/שְׁמוֹנֶ֥ה מֵא֖וֹת חֲלוּצֵ֥י צָבָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/025.yaml
  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
  footnotes:
  - marker: a
    text: Or 'armed for war.' The Hebrew phrase חֲלוּצֵי צָבָא refers to men equipped or prepared for military combat.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 아들들 가운데 방패와 창을 들고 있는 자는 6,800명이었는데, 모두 전투에 갖추어진 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투를 위해 무장한’. 히브리어 חֲלוּצֵי צָבָא는 군사 전투에 대비해 갖추어진 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  english_pob_choice: From the sons of Judah
  chosen_korean: 유다의 아들들 가운데
  alternatives_korean:
  - 유다의 아들들
  - 유다 사람들 가운데
  lexicon: HALOT
  rationale: 지파 목록의 맥락을 살리면서도 한국어에서 자연스럽게 출처 집단을 나타내기 위해 ‘가운데’를 넣었고, בני יהודה의 직역인 ‘아들들’을 유지해 부족적 소속을 보존했습니다.
- source_word: נֹשְׂאֵי
  english_pob_choice: carrying
  chosen_korean: 방패와 창을 들고 있는
  alternatives_korean:
  - 방패와 창을 메고 있는
  - 방패와 창을 지닌
  lexicon: HALOT
  rationale: 무기를 ‘지는’ 상태보다 실제로 휴대하는 상태가 더 직접적이므로, 군사 장비를 실제로 들고 있는 모습을 한국어로 자연스럽게 옮겼습니다.
- source_word: צִנָּה וָרֹמַח
  english_pob_choice: shield and spear
  chosen_korean: 방패와 창
  alternatives_korean:
  - 큰 방패와 창
  - 방패와 창날
  lexicon: HALOT
  rationale: צִנָּה와 רֹמַח의 기본 군사어휘를 표준적인 ‘방패’와 ‘창’으로 옮겨, 본문의 병장기 목록을 간결하게 드러냈습니다.
- source_word: חֲלוּצֵי צָבָא
  english_pob_choice: equipped for battle
  chosen_korean: 전투에 갖추어진 사람들이었습니다
  alternatives_korean:
  - 전투를 위해 무장한 사람들이었습니다
  - 전쟁에 대비된 사람들이었습니다
  lexicon: HALOT
  rationale: חלוץ의 군사적 뉘앙스를 ‘갖추어진’으로 살려 단순 무장 여부를 넘어 전투 준비 완료 상태를 표현했습니다. EN POB의 ‘equipped for battle’도 이 의미를 반영합니다.
theological_decisions:
- issue: 군사 표현의 직접성
  chosen_reading: 본문의 군사적 묘사를 완화하지 않고 ‘방패와 창’, ‘전투에 갖추어진’으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 보다 완곡한 ‘전쟁을 할 수 있는’
  - 일반화된 ‘무장한’
  rationale: 이 절은 지파 인원의 전투 준비 상태를 열거하는 역사 서술이므로, 원문의 군사적 구체성을 유지하는 것이 독자 이해에 가장 충실합니다.
  doctrine_reference: 역사서 본문의 서술 충실성
