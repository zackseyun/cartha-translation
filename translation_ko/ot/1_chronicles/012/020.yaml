source:
  edition: WLC
  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
  footnotes:
  - marker: a
    text: Or 'fell to David' / 'joined David'; the Hebrew idiom means to go over to someone's side.
    reason: lexical_alternative
  - marker: b
    text: Literally 'with our heads,' an idiom meaning 'at the cost of our lives' or 'to our own ruin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세 사람들 중 일부도 다윗에게 넘어왔습니다[a]. 그는 블레셋 사람들과 함께 사울과 싸우러 올 때였는데, 그들은 그들을 돕지 않았습니다. 블레셋의 군주들이 상의한 뒤 그를 돌려보내며 말했습니다[b]. 「우리 목숨을 담보로 그의 주인 사울에게 넘어갈지 모른다」고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘그에게로 떨어졌다’는 뜻으로, 여기서는 ‘그 편으로 넘어왔다/합류했다’는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우리 머리로(with our heads)’로, ‘우리 목숨을 담보로’라는 관용적 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  english_pob_choice: Some from Manasseh also
  chosen_korean: 므낫세 사람들 중 일부도
  alternatives_korean:
  - 그리고 므낫세에서
  - 므낫세에서도
  lexicon: HALOT
  rationale: מן의 부분적 의미를 살려 ‘중 일부’를 넣어, 뒤따르는 개별 인물 목록과도 자연스럽게 이어지게 했습니다.
- source_word: נָפְלוּ עַל דָּוִיד
  english_pob_choice: defected to David
  chosen_korean: 다윗에게 넘어왔습니다
  alternatives_korean:
  - 다윗 편으로 떨어졌습니다
  - 다윗에게 합류했습니다
  lexicon: HALOT
  rationale: 군사·정치적 관용구로서 ‘편을 바꾸어 넘어오다’의 의미를 살려, 문자적 ‘떨어지다’보다 ‘넘어오다’를 택했습니다.
- source_word: סַרְנֵי פְלִשְׁתִּים
  english_pob_choice: the lords of the Philistines
  chosen_korean: 블레셋의 군주들이
  alternatives_korean:
  - 블레셋의 방백들이
  - 블레셋의 통치자들이
  lexicon: HALOT
  rationale: סַרְנֵי의 직함적 뉘앙스를 살리되, 한국어에서 가장 자연스럽게 권위를 드러내는 ‘군주들’로 옮겼습니다.
- source_word: בְּרָאשֵׁינוּ
  english_pob_choice: at the cost of our heads
  chosen_korean: 우리 목숨을 담보로
  alternatives_korean:
  - 우리 머리로
  - 우리 목숨을 잃는 대가로
  lexicon: HALOT
  rationale: 히브리어의 ‘머리/목숨을 내건 대가’라는 관용구를 한국어 관용으로 풀되, 희생의 위험을 분명히 드러내기 위해 ‘우리 목숨을 담보로’를 사용했습니다.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  english_pob_choice: He may defect to his master Saul
  chosen_korean: 그의 주인 사울에게 넘어갈지 모른다
  alternatives_korean:
  - 그의 주인 사울에게 되돌아갈지 모른다
  - 그의 주인 사울 편으로 다시 갈지 모른다
  lexicon: HALOT
  rationale: נפל 엘의 관용적 의미를 따라 ‘넘어가다’로 옮기고, אֲדֹנָיו를 관계상 ‘주인’으로 번역해 정치적 소속의 긴장을 유지했습니다.
theological_decisions:
- issue: 사울에 대한 דוד의 관계 표지
  chosen_reading: ‘그의 주인 사울’로 옮겨, דוד과 사울의 군주-봉사 관계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘그의 주 사울’
  - ‘그의 임금 사울’
  rationale: 본문의 아도나이ּוּ는 신학적 ‘주’가 아니라 관계·봉사 맥락의 소유격이므로, 한국어에서 오해를 줄이는 ‘주인’이 가장 직접적입니다.
  doctrine_reference: 본문 내 정치적 충성 관계의 기술
