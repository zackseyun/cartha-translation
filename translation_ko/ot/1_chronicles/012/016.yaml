theological_decisions:
- issue: 전투 서술의 과장 여부
  chosen_reading: ‘도망하게 했습니다’로 번역해, 승리를 암시하되 현대 독자가 필요 이상으로 전술적 강도를 과장하지 않도록 했습니다.
  alternative_readings:
  - ‘패주하게 했습니다’
  - ‘무찔렀습니다’
  rationale: 동사 וַיַּבְרִיחוּ의 핵심은 ‘도망치게 하다’는 사역 의미이므로, 결과를 명확히 하되 본문 이상의 승리 표현은 피했습니다.
  doctrine_reference: 본문 문맥의 역사 서술 원칙
- issue: 하나님의 이름/호칭 사용
  chosen_reading: 이 구절에는 יהוה/κύριος가 없으므로, 야훼/주님 표기는 사용하지 않았습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문에 없는 호칭을 보충하지 않고, 본문 어휘만으로 번역했습니다.
  doctrine_reference: 원문 충실성 원칙
