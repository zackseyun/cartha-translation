  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
  footnotes:
  - marker: a
    text: Hebrew literally, 'all the valleys'; the sense is the people in the valleys, since the verb means 'caused to flee' or 'put to flight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 첫째 달에[a] 요단 강을 건넌 사람들입니다. 그때 요단 강물이 모든 둑 위로 넘쳐흐르고 있었는데, 그들은 동쪽과 서쪽의 골짜기에 있던 모든 사람들을 도망치게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘모든 골짜기들’이지만, 문맥상 골짜기에 있던 사람들을 가리킵니다. 동사는 ‘도망하게 하다’ 또는 ‘달아나게 하다’라는 뜻입니다.
    reason: lexical_alternative
