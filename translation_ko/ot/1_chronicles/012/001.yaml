base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: Now these are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
  footnotes:
  - marker: a
    text: Or 'held back' or 'confined' because of Saul son of Kish.
    reason: lexical_alternative
  - marker: b
    text: Or 'among the mighty men'; Hebrew gibbôrîm refers to valiant warriors or heroes.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 다윗이 시글락에 있을 때, 곧 아직도 사울 곧 기스의 아들 때문에 억눌려 있던 때에 그에게로 온 사람들이며, 그들은 용맹한 전사들 가운데 속한 전쟁의 돕는 자들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '대안 번역: ‘사울 곧 기스의 아들 때문에 붙들려 있던’ 또는 ‘제한되던’.'
    reason: lexical_alternative
  - marker: b
    text: '대안 번역: ‘용사들 가운데’. 히브리어 gibbôrîm은 용맹한 전사들 또는 영웅들을 가리킬 수 있습니다.'
    reason: lexical_alternative
