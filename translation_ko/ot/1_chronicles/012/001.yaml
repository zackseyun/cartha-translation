  text: Now these are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
  footnotes:
  - marker: a
    text: Or 'held back' or 'confined' because of Saul son of Kish.
    reason: lexical_alternative
  - marker: b
    text: Or 'among the mighty men'; Hebrew gibbôrîm refers to valiant warriors or heroes.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 다윗이 아직 기스의 아들 사울 때문에 제약을 받고 있던[a] 때에 시글락에서 그에게 온 사람들입니다. 그들은 용사들[b] 가운데 속하여 전쟁을 돕는 이들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '대안 번역: ‘기스의 아들 사울 때문에 붙들려 있던’ 또는 ‘기스의 아들 사울 앞에서 물러나 있던’.'
    reason: lexical_alternative
  - marker: b
    text: '대안 번역: ‘용맹한 전사들 가운데’. 히브리어 gibbôrîm은 용맹한 전사들 또는 영웅들을 가리킬 수 있습니다.'
    reason: lexical_alternative
