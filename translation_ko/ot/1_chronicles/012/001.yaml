theological_decisions:
- issue: 사울의 압박 아래 있던 다윗의 상태를 어떻게 드러낼지
  chosen_reading: 단순히 장소적·정치적 제약이 아니라, 사울의 위협으로 인한 억눌림을 드러내는 표현을 택했습니다.
  alternative_readings:
  - 사울 때문에 제한되던
  - 사울 때문에 붙들려 있던
  rationale: עָצוּר는 문맥상 다윗이 자유롭게 움직이지 못하는 상태를 나타내므로, 독자가 압박의 강도를 이해하도록 ‘억눌려 있던’으로 표현했습니다.
  doctrine_reference: 본문의 역사적 서술과 문맥적 의미 보존
- issue: ‘gibbôrîm’의 군사적 평가를 어떻게 옮길지
  chosen_reading: ‘용맹한 전사들’로 옮겨 단순한 신체적 강함이 아니라 전투적 용맹을 살렸습니다.
  alternative_readings:
  - 힘센 사람들
  - 용사들
  rationale: 문맥이 전쟁 지원자들의 명단이므로, 일반적 ‘강한 사람들’보다 군사적·영웅적 뉘앙스를 살리는 번역이 더 정확합니다.
  doctrine_reference: 본문의 전쟁 맥락 보존
