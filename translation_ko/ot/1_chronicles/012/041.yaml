source:
  edition: WLC
  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
  footnotes:
  - marker: a
    text: Hebrew לֶחֶם is literally 'bread,' but here it introduces a wider list of provisions, so 'food' is used in the main text.
    reason: lexical_alternative
  - marker: b
    text: Or 'even to Issachar, Zebulun, and Naphtali.' The phrase marks the geographic extent of those bringing supplies.
    reason: alternative_reading
  - marker: c
    text: Hebrew צִמּוּקִים may be rendered 'raisins' or 'dried grapes'; 'raisin cakes' reflects the likely prepared-food sense in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 가까이 있던 자들—곧 잇사갈과 스불론과 납달리까지—나귀와 낙타와 노새와 소에 실어 먹을 것, 곧 밀가루와 무화과 과자와 건포도 과자와 포도주와 기름과 소와 양을 풍성하게 가져왔습니다. 이는 이스라엘에 기쁨이 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לֶחֶם은 문자적으로 ‘빵’이지만, 여기서는 뒤따르는 목록 전체를 가리키는 더 넓은 ‘먹을 것’의 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צִמּוּקִים은 ‘건포도’ 또는 ‘말린 포도’로도 옮길 수 있으나, 이 문맥에서는 준비된 식품의 성격을 살린 표현이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם הַקְּרוֹבִים אֲלֵיהֶם
  english_pob_choice: Also those near them
  chosen_korean: 그리고 그들 가까이 있던 자들
  alternatives_korean:
  - 또 그들 곁에 있던 사람들
  - 그들에게 가까운 사람들
  lexicon: HALOT
  rationale: 관계적 근접성을 살리면서, 문맥상 단순한 지리적 이웃보다 폭넓은 지원자 집단이라는 느낌을 유지했습니다.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  english_pob_choice: as far as Issachar and Zebulun and Naphtali
  chosen_korean: 곧 잇사갈과 스불론과 납달리까지
  alternatives_korean:
  - 잇사갈과 스불론과 납달리까지
  - 잇사갈, 스불론, 납달리까지
  lexicon: HALOT
  rationale: עַד의 확장 범위를 ‘까지’로 살렸고, 지명은 한국어 성경에서 익숙한 음역을 따랐습니다.
- source_word: לֶחֶם ... מַאֲכָל קֶמַח דְּבֵלִים וְצִמּוּקִים
  english_pob_choice: food ... provisions of flour, fig cakes, raisin cakes
  chosen_korean: 먹을 것, 곧 밀가루와 무화과 과자와 건포도 과자
  alternatives_korean:
  - 식량, 곧 밀가루와 무화과 과자와 건포도 과자
  - 먹을 것, 곧 밀가루와 무화과떡과 건포도떡
  lexicon: HALOT
  rationale: לֶחֶם을 단순히 ‘빵’으로 제한하지 않고 POB의 해석을 따라 총괄적 ‘먹을 것’으로 옮겼습니다. דְּבֵלִים과 צִמּוּקִים은 운반·저장용 준비식품의 성격을 살려 과자/떡류로 자연스럽게 표현했습니다.
- source_word: וּבַ/בָּקָר ... וּבָקָר וְצֹאן
  english_pob_choice: on donkeys, camels, mules, and cattle ... cattle, and sheep
  chosen_korean: 나귀와 낙타와 노새와 소에 실어 ... 소와 양
  alternatives_korean:
  - 나귀와 낙타와 노새와 소로 ... 소와 양
  - 나귀와 낙타와 노새와 소에 싣고 ... 소와 양
  lexicon: HALOT
  rationale: 운송 수단으로 쓰인 첫 번째 בְּ는 한국어의 ‘~에 실어’로 풀어 주었고, 뒤의 בָּקָר וְצֹאן은 실제로 바친 가축 목록으로 ‘소와 양’으로 구분했습니다.
- source_word: לָרֹב
  english_pob_choice: in abundance
  chosen_korean: 풍성하게
  alternatives_korean:
  - 풍부하게
  - 많이
  lexicon: HALOT
  rationale: 단순 수량보다 넘쳐나는 넉넉함을 드러내는 표현으로, 문맥의 풍요를 살렸습니다.
theological_decisions:
- issue: 결말의 원인절 כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  chosen_reading: ‘이는 이스라엘에 기쁨이 있었기 때문입니다’로 번역해, 풍성한 공급의 배경이 공동체적 기쁨임을 직접 드러냈습니다.
  alternative_readings:
  - ‘이스라엘에 기쁨이 있었으므로’
  - ‘이스라엘에 즐거움이 있었기 때문입니다’
  rationale: קִי절은 단순 배경 설명이 아니라 앞선 헌납의 동기를 제시하므로, 원인 관계를 분명하게 보이도록 옮겼습니다.
  doctrine_reference: 공동체적 기쁨이 자발적 헌신을 낳는다는 성경의 서술 방식(문맥적 신학)
