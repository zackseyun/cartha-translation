revisions:
- from: 그리고 우리가 우리 하나님의 언약궤를 우리에게로 가져오자. 이는 우리가 사울의 날들에 그것을 찾지 않았기 때문입니다.[a]
  to: 또 우리가 우리 하나님의 궤를 다시 우리에게로 가져옵시다. 우리가 사울 시대에는 그것을 찾지 않았기 때문입니다.[a]
  rationale: 합쇼체 청유형으로 문체를 통일하고, 현대 한국어에 자연스러운 시간 표현으로 다듬었습니다. 원문에 명시되지 않은 ‘언약’을 삭제했으며, 궤를 공동체에게 다시 가져오는 방향성을 ‘다시 우리에게로’로 반영했습니다. ‘그것’과 각주를 통해 דרש의 어휘적 및 지시 대상의 해석상 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:28Z'
