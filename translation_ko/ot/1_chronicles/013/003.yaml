  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
  footnotes:
  - marker: a
    text: Or, 'we did not inquire of it/him.' The Hebrew verb can carry the sense of seeking or inquiring, and some translations make the object explicitly God rather than the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리가 우리 하나님의 언약궤를 우리에게로 가져오자. 이는 우리가 사울의 날들에 그것을 찾지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 그것/그에게 묻지 않았다.’ 히브리어 동사는 ‘찾다’와 ‘문의하다’의 뜻을 모두 가질 수 있으며, 일부 번역은 목적어를 하나님으로 명시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסֵבָּה
  english_pob_choice: let us bring ... back
  chosen_korean: 가져오자
  alternatives_korean:
  - 다시 가져오자
  - 돌려오자
  - 둘러오자
  lexicon: HALOT
  rationale: 공동체의 의향을 나타내는 cohortative로서, 언약궤를 공동체에게로 되돌려 오는 움직임을 한국어 자연문맥에 맞게 간결하게 살렸습니다.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  english_pob_choice: the ark of our God
  chosen_korean: 우리 하나님의 언약궤
  alternatives_korean:
  - 우리 하나님의 궤
  - 하나님의 언약궤
  lexicon: HALOT
  rationale: 아론/언약궤의 성소적 대상을 분명히 하기 위해 ‘언약궤’로 옮기되, 소유관계인 ‘우리 하나님의’를 유지했습니다.
- source_word: לֹא דְרַשְׁנֻהוּ
  english_pob_choice: we did not seek it
  chosen_korean: 그것을 찾지 않았기 때문입니다
  alternatives_korean:
  - 그것을 구하지 않았기 때문입니다
  - 그것을 찾지 않았기 때문입니다
  - 그를 찾지 않았기 때문입니다
  lexicon: HALOT
  rationale: 드라쉬(דרש)는 ‘찾다/구하다/문의하다’의 넓은 의미를 가지므로, 본문과 가장 직접 맞는 ‘찾다’를 택하고 대명사는 궤를 가리키는 중성적 ‘그것’으로 보존했습니다.
- source_word: בִּימֵי שָׁאוּל
  english_pob_choice: in the days of Shaul
  chosen_korean: 사울의 날들에
  alternatives_korean:
  - 사울 시대에
  - 사울의 때에
  - 사울의 날에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘날들에’를 살리면서도 한국어에서 자연스러운 표현으로 정리했습니다. 인명은 본문 주석의 표기 관행에 따라 ‘사울’로 옮겼습니다.
theological_decisions:
- issue: ‘seek it’의 지시 대상
  chosen_reading: 주어는 언약궤를 그대로 가리키는 ‘그것’으로 두고, 본문이 요구하는 신학적 함의—언약궤와 관련된 하나님 찾기의 소홀함—은 독자가 문맥에서 읽게 했습니다.
  alternative_readings:
  - 그를 찾지 않았기 때문입니다
  - 그에게 묻지 않았기 때문입니다
  rationale: 히브리어 목적격 접미사는 가장 자연스럽게 ‘언약궤’에 연결되므로, 해석을 본문 밖으로 앞당겨 ‘그’를 넣지 않았습니다. 이렇게 해야 본문이 가진 구체성과 암시적 신학 긴장을 함께 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
