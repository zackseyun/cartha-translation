    issue: ‘언약궤를 만졌기 때문에’가 실제 접촉을 단정합니다.
    rationale: 원문은 שָׁלַח יָדוֹ עַל, 즉 궤를 향하여/궤에 손을 뻗은 행위를 말합니다. 접촉은 문맥에서 추론될 수 있으나 이 절의 표현 자체가 명시하지 않으므로 번역 본문에 추가하지 않는 편이 안전합니다.
  - severity: low
