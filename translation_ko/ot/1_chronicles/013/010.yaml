base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
  footnotes:
  - marker: a
    text: Or, 'because he had reached out his hand to the ark.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 진노가 우사를 향해 타올랐고, 우사가 언약궤를 향해 손을 뻗었기 때문에 야훼께서 그를 치셨습니다. 그래서 우사는 그곳에서 하나님 앞에서 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘우사가 언약궤에 손을 뻗었기 때문에.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  english_pob_choice: Then Yahweh’s anger burned
  chosen_korean: 야훼의 분노가 … 불타올랐고
  alternatives_korean:
  - 야훼께서 노하셨고
  - 야훼의 노여움이 타올랐고
  lexicon: HALOT
  rationale: 히브리어 관용구 חרה אף의 강한 분노 이미지를 살리기 위해 단순한 ‘노하셨고’보다 ‘분노가 불타올랐고’로 옮겼습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: he struck him down
  chosen_korean: 그를 치셨습니다
  alternatives_korean:
  - 그를 쓰러뜨리셨습니다
  - 그를 내려치셨습니다
  lexicon: HALOT
  rationale: 히브리어 נכה의 기본 의미를 살리되, 문맥상 죽음이 뒤따르므로 과도한 해석을 피하면서도 심판의 행위를 자연스럽게 드러냈습니다.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  english_pob_choice: he had put out his hand to the ark
  chosen_korean: 손을 뻗어 언약궤를 만졌기 때문에
  alternatives_korean:
  - 손을 내밀어 언약궤에 손을 대었기 때문에
  - 언약궤를 향해 손을 뻗었기 때문에
  lexicon: HALOT
  rationale: שלח יד על의 물리적 동작과 금지된 접촉의 뉘앙스를 함께 살리기 위해 ‘손을 뻗어 … 만졌다’로 풀었습니다. 한국어 성경 전통의 ‘언약궤’는 כאן의 ארון을 공동체가 즉시 알아들을 수 있는 표현입니다.
- source_word: לִפְנֵי אֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 앞에
  - 하나님의 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 ‘~앞에서’ 의미를 직역적으로 살리면서도 한국어 문장 흐름에 맞게 자연스럽게 정리했습니다.
theological_decisions:
- issue: יַהְוֶה와 אֱלֹהִים을 구분해 옮길지 여부
  chosen_reading: 첫 절은 야훼, 마지막 구는 하나님으로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 야훼로 통일
  - 둘 다 하나님으로 통일
  rationale: 원문은 첫 절에 언약명 יְהוָה를, 끝절에는 אֱלֹהִים을 사용하므로 이를 구분해 번역하여 원문의 표지 차이를 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over smoothing'
