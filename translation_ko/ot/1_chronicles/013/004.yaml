  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ כָֽל הַ/קָּהָ֖ל לַ/עֲשׂ֣וֹת כֵּ֑ן כִּֽי יָשַׁ֥ר הַ/דָּבָ֖ר בְּ/עֵינֵ֥י כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/004.yaml
  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
  footnotes:
  - marker: a
    text: Or 'the whole assembly said that it should be done'; the Hebrew wording expresses the assembly's consent to the proposal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 회중이 그렇게 하기로 말하였습니다[a]. 그 말씀은 모든 백성의 눈에 옳았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 회중이 그렇게 해야 한다고 말하였습니다’; 히브리어 표현은 회중의 제안 수용과 동의를 함께 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: said
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 그렇게 하자고 하였습니다
  - 동의하였습니다
  lexicon: HALOT
  rationale: 히브리어 אמר의 기본 동작을 그대로 살려, 해석을 과도하게 좁히지 않고 회중의 응답을 자연스럽게 표현했습니다.
- source_word: כָל הַקָּהָל
  english_pob_choice: all the assembly
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 모임
  lexicon: HALOT
  rationale: קָהָל의 집합체 의미를 반영하면서도 현대 한국어에서 자연스러운 ‘회중’으로 옮겼고, כָל은 ‘온’으로 압축해 전체성을 살렸습니다.
- source_word: יָשַׁר הַדָּבָר
  english_pob_choice: the matter was right
  chosen_korean: 그 말씀은 옳았기 때문입니다
  alternatives_korean:
  - 그 일이 옳았기 때문입니다
  - 그 제안은 옳았기 때문입니다
  lexicon: HALOT
  rationale: דָּבָר는 여기서 논의된 발언/제안을 가리키므로 ‘말씀’으로 받아도 되지만, 문맥상 ‘그 말씀’은 왕의 제안에 대한 응답을 직접 받는 자연스러운 한국어로 옮겼습니다. ‘옳다’는 יָשַׁר의 평가적 의미를 반영합니다.
- source_word: בְּעֵינֵי כָל הָעָם
  english_pob_choice: in the eyes of all the people
  chosen_korean: 모든 백성의 눈에
  alternatives_korean:
  - 모든 백성에게
  - 모든 사람 보기에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지해 평가의 기준이 ‘백성의 눈’에 있었다는 뉘앙스를 보존했습니다.
theological_decisions:
- issue: כָל הַקָּהָל의 공동체적 주체성
  chosen_reading: ‘온 회중’이 집단적으로 응답한 것으로 옮겼습니다.
  alternative_readings:
  - ‘모든 백성’으로 풀어 보다 일반적으로 옮길 수 있습니다.
  - ‘회중 전체’라고 옮길 수도 있습니다.
  rationale: 본문은 소수 의견이 아니라 공동체 전체의 동의를 강조하므로, 집합적 주체성을 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 공동체 분별과 합의의 본문적 강조
