source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'let us break out; let us send.' The expression likely means to send out broadly or widely.
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here refers to fellow Israelites in a representative sense.'
    reason: lexical_alternative
  - marker: c
    text: Or 'regions of Israel'; Hebrew has the plural 'lands.'
    reason: lexical_alternative
  - marker: d
    text: That is, the open lands or pasturelands belonging to their cities.
    reason: cultural_note
translation:
  language: ko
  text: 다윗이 이스라엘의 모든 회중에게 말했습니다. 「만약 여러분에게 좋고, 또 그것이 우리 하나님 야훼에게서 나온 것이라면, 우리 형제들, 곧 이스라엘의 모든 땅에 남아 있는 이들과 그들의 도시들에 있는 그 제사장들과 레위인들에게도 사람을 보내어, 그들이 우리에게 모이게 합시다」.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리가 넓게 뚫고 나가자/퍼져 나가자; 우리가 보내자’의 뜻입니다. 여기서는 넓게 보내는 행위를 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 여기서 대표성을 지닌 이스라엘 동족을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘의 지역들’. 히브리어는 복수형 ‘땅들’을 사용합니다.
    reason: lexical_alternative
  - marker: d
    text: 곧 그들의 도시들에 딸린 열린 땅이나 목초지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 총회
  - 모임
  - 공동체
  lexicon: HALOT
  rationale: 여기서는 국가적 차원의 모인 집단을 가리키므로, 교회 제도를 연상시키는 ‘교회’보다 중립적인 ‘회중’이 문맥에 맞습니다.
- source_word: אִם עֲלֵיכֶם טוֹב
  english_pob_choice: If it seems good to you
  chosen_korean: 만약 여러분에게 좋고
  alternatives_korean:
  - 여러분 보기에 좋다면
  - 여러분이 좋게 여기면
  lexicon: HALOT
  rationale: 히브리어 관용구의 승인 요청을 자연스러운 현대 한국어로 옮기되, 판단과 동의를 구하는 조건문 구조를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 이름은 ‘야훼’로 옮겨 언약 이름의 고유성을 보존했습니다.
- source_word: נִשְׁלְחָה / וְיִקָּבְצוּ
  english_pob_choice: let us send word ... that they may gather to us
  chosen_korean: 사람을 보내어 ... 모이게 합시다
  alternatives_korean:
  - 전갈을 보내어 ... 모이게 합시다
  - 보내어 ... 모이게 하자
  lexicon: HALOT
  rationale: ‘보내다/모이다’의 행위 관계를 살리면서, 한국어에서 자연스러운 ‘사람을 보내어’로 간접 목적어를 보완했습니다.
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  english_pob_choice: in all the lands of Israel
  chosen_korean: 이스라엘의 모든 땅
  alternatives_korean:
  - 이스라엘의 모든 지역
  - 이스라엘 전역
  lexicon: HALOT
  rationale: 복수형 ‘땅들/영토들’의 폭을 반영하면서도, 한국어에서는 과도한 직역을 피하고 원문의 지리적 범위를 살렸습니다.
theological_decisions:
- issue: 야훼와 공동체의 합의가 함께 제시되는 구조
  chosen_reading: 다윗의 제안은 인간적 동의(‘여러분에게 좋고’)와 신적 승인(‘야훼에게서 나온 것’)을 나란히 놓는 조건문으로 옮겼습니다.
  alternative_readings:
  - ‘좋고’만 앞세워 단순한 예의 표현으로 약화하는 번역
  - 신적 승인 부분을 부차적으로 처리하는 번역
  rationale: 본문은 민의와 하나님의 뜻을 함께 묻는 구조이므로, 두 조건의 병렬성을 유지해야 문맥의 신학적 긴장이 살아납니다.
  doctrine_reference: 역대기서의 공동체 분별과 하나님의 인도
- issue: אַחֵינוּ를 ‘형제들’로 옮김
  chosen_reading: 남성 복수형을 유지해 ‘형제들’로 옮기되, 대표성 있는 이스라엘 동족을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 동족
  - 친족
  - 우리의 형제
  rationale: 문맥상 혈연적 범주를 넘는 대표적 이스라엘 지칭이므로, 관계적 호칭을 살리되 의미를 과도하게 축소하지 않는 번역이 적절합니다.
  doctrine_reference: 대표적 공동체 언어
