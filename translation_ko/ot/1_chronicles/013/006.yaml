id: 1CH.13.6
reference: 1 Chronicles 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the ark of God, the LORD who is enthroned above the cherubim, which is called by the Name.' Compare 2 Samuel 6:2.
    reason: alternative_reading
translation:
  language: ko
  text: 다윗과 온 이스라엘은 유다에 속한 기럇여아림, 곧 바알라로 올라가, 그곳에서 그룹들 위에 좌정하시는 야훼의 이름으로 불리는 하나님의 궤를 가져오기 위해 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 최종절은 압축되어 있어, 직역하면 ‘그 이름이 불리는’입니다. 또는 더 관용적으로는 ‘그룹들 위에 좌정하시는 야훼 하나님의 궤, 곧 그 이름으로 불리는 궤’로 옮길 수 있습니다. 사무엘하 6:2와 비교하십시오.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 갔습니다
  - 올라갔습니다
  lexicon: HALOT
  rationale: 여행·이동 문맥의 עלה를 살려 지리적 상승과 이동을 함께 드러내기 위해 ‘올라가서’를 택했습니다.
- source_word: בַּעֲלָתָה / אֶל קִרְיַת יְעָרִים
  english_pob_choice: Baalah, that is, to Kiriath-jearim
  chosen_korean: 바알라, 곧 유다에 속한 기럇여아림
  alternatives_korean:
  - 바알라, 즉 기럇여아림
  - 바알라, 곧 기럇여아림
  lexicon: HALOT
  rationale: 두 지명이 병렬로 제시된 구조를 한국어의 ‘곧’으로 풀어 apposition을 분명히 했고, 관계절도 자연스럽게 합쳐 옮겼습니다.
- source_word: יְהוָה יוֹשֵׁב הַכְּרוּבִים
  english_pob_choice: Yahweh who is enthroned above the cherubim
  chosen_korean: 그룹들 위에 좌정하시는 야훼
  alternatives_korean:
  - 그룹들 위에 즉위하시는 야훼
  - 그룹들 사이에 좌정하시는 야훼
  lexicon: HALOT
  rationale: 하나님의 왕권적 임재를 드러내는 יוֹשֵׁב를 ‘좌정하시는’으로 옮겼고, 기본 번역 원칙에 따라 신명은 ‘야훼’로 처리했습니다.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  english_pob_choice: whose name is called upon it
  chosen_korean: 그 이름이 그 위에 불리는 것입니다
  alternatives_korean:
  - 그 이름이 거기에서 불리는 것입니다
  - 그 이름이 불려 있는 것입니다
  lexicon: HALOT
  rationale: 히브리어의 수동적·축약된 표현을 지나치게 해석하지 않고, POB의 문맥상 여백을 살린 ‘그 위에 불리는’으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יהוה를 인칭적 고유명으로 보존하기 위해 관례적 대체어를 쓰지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 기럇여아림/바알라의 관계와 궤에 대한 최종절
  chosen_reading: 두 지명의 병렬과 ‘그 이름이 그 위에 불리는 것입니다’의 여백을 유지했습니다.
  alternative_readings:
  - 기럇여아림으로, 곧 유다에 속한 곳으로
  - 그 이름이 불려 있는 곳입니다
  rationale: 본문은 장소 식별과 신성한 이름의 연결을 동시에 제시하므로, 해석을 과도하게 좁히지 않고 병렬 구조와 수동 표현의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
