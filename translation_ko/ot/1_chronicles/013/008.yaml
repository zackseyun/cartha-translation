  source_fidelity: 히브리어의 핵심 요소인 다윗과 온 이스라엘, 하나님 앞에서의 축제적 활동, ‘온 힘을 다해,’ 노래와 각 악기 목록은 대체로 충실히 반영되었습니다. 다만 원문의 ‘노래들’과 악기들을 모두 ‘연주하였습니다’에 직접 연결하면 노래까지 연주한 것처럼 읽힐 수 있습니다.
