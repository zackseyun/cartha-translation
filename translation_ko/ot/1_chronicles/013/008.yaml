base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
  footnotes:
  - marker: a
    text: Or 'were playing/rejoicing before God'; the Hebrew verb can denote festive, joyful activity.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗과 온 이스라엘이 하나님 앞에서 온 힘을 다하여 기뻐하며 노래하고, 수금과 비파와 소고와 제금과 나팔을 연주하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님 앞에서 즐기며’; 히브리어 동사는 축제적이고 기쁜 활동을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  english_pob_choice: were celebrating
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 즐기며
  - 놀며
  - 축제를 벌이며
  lexicon: HALOT
  rationale: 이 분사형은 단순한 ‘놀이’보다 축제적·환희적 활동을 가리킬 수 있으므로, 예배 행렬의 문맥에 맞게 ‘기뻐하며’로 옮겨 자연스러운 공적 축하의 뉘앙스를 살렸습니다.
- source_word: לִפְנֵי הָאֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 앞에
  - 하나님의 임재 앞에서
  lexicon: HALOT
  rationale: ‘before God’의 직역성을 유지하면서도 한국어 예배 문맥에서 가장 자연스러운 ‘하나님 앞에서’를 선택했습니다.
- source_word: בְּכָל עֹז
  english_pob_choice: with all their might
  chosen_korean: 온 힘을 다해
  alternatives_korean:
  - 모든 힘으로
  - 전력을 다해
  - 모든 능력을 다해
  lexicon: HALOT
  rationale: עֹז는 힘·강함을 뜻하므로, 주어가 복수인 점을 살려 한국어 관용에 맞는 ‘온 힘을 다해’로 옮겼습니다.
- source_word: כִנֹּרוֹת / נְבָלִים / תֻפִּים / מְצִלְתַּיִם / חֲצֹצְרוֹת
  english_pob_choice: lyres, harps, tambourines, cymbals, and trumpets
  chosen_korean: 수금과 비파와 소고와 제금과 나팔
  alternatives_korean:
  - 류트와 하프와 탬버린과 심벌즈와 트럼펫
  - 비파와 하프와 손북과 징과 나팔
  lexicon: HALOT
  rationale: 각 악기의 고유 명칭을 가능한 한 구별해 옮기되, 한국어 성경에서 널리 통용되는 표기를 우선하여 ‘수금/비파/소고/제금/나팔’을 사용했습니다.
theological_decisions:
- issue: הָאֱלֹהִים의 처리
  chosen_reading: 하나님
  alternative_readings:
  - 그 하나님
  - 하나님께
  rationale: 이 절의 관용적 용법에서 정관사는 불필요하므로, 예배 행위의 대상이 되는 이스라엘의 하나님을 자연스럽게 ‘하나님’으로 번역했습니다.
  doctrine_reference: 고전적 유일신 신앙에 따른 표준 지칭
