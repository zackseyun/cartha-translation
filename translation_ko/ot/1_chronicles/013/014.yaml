  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
  footnotes:
  - marker: a
    text: Or 'the house of Obed-edom' in both occurrences; Hebrew בֵּית can mean either a physical house or a household.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 궤가 오벳-에돔의 집안과 함께 그의 집에 석 달 동안 머물렀습니다. 그리고 야훼께서 오벳-에돔의 집안과 그에게 속한 모든 것을 복 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집안’은 히브리어 בֵּית가 가리킬 수 있는 가족·가계·가산의 범위를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: remained
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 있었습니다
  - 거하였습니다
  - 머물러 있었습니다
  lexicon: HALOT
  rationale: ישב는 문맥에 따라 ‘머물다/거하다/앉다’의 뜻이 있으므로, 궤가 잠시 계속 있던 상황에는 ‘머물렀습니다’가 가장 자연스럽고 임시성을 잘 드러냅니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 언약궤
  - 하나님의 언약궤
  lexicon: HALOT
  rationale: 본문은 ‘하나님의 궤’라고만 말하므로, 다른 본문에서 흔한 ‘언약궤’를 덧붙이지 않고 원문 표현을 그대로 살렸습니다.
- source_word: בֵּית עֹבֵד אֱדֹם
  english_pob_choice: household of Obed-edom
  chosen_korean: 오벳-에돔의 집안
  alternatives_korean:
  - 오벳-에돔의 집
  - 오벳-에돔의 가족
  lexicon: HALOT
  rationale: בֵּית은 여기서 건물보다 사람과 소유를 포함하는 집안/가문을 가리킬 수 있으므로, ‘집안’으로 옮겨 뒤의 ‘그의 집에’와 구별했습니다.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  english_pob_choice: for three months
  chosen_korean: 석 달 동안
  alternatives_korean:
  - 세 달 동안
  - 세 달
  lexicon: HALOT
  rationale: 기간 표현으로는 한국어에서 ‘석 달 동안’이 자연스럽고, 원문의 지속 기간도 분명하게 전합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기는 학술적 음역 ‘야훼’로 옮겨, 본문의 고유한 언약 이름을 보존했습니다.
- source_word: וְאֶת כָּל אֲשֶׁר לֽוֹ
  english_pob_choice: and all that belonged to him
  chosen_korean: 그에게 속한 모든 것
  alternatives_korean:
  - 그의 모든 소유
  - 그가 가진 모든 것
  lexicon: HALOT
  rationale: 아շר לו는 소유물만이 아니라 그에게 속한 전체 범위를 가리킬 수 있어, ‘그에게 속한 모든 것’이 가장 포괄적입니다.
theological_decisions:
- issue: 여호와 신명 표기와 축복 주체의 일치
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기하고, 그분이 오벳-에돔의 집안에 복을 주시는 주체임을 분명히 했습니다.
  alternative_readings:
  - ‘주님’으로 완화하여 표기
  - ‘여호와’로 교회 전통형 표기
  rationale: 원문은 고유한 신명 사용을 통해 서술의 초점을 드러내므로, 번역에서도 그 구별을 유지하는 것이 본문 의미를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
