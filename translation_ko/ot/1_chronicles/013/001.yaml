lexical_decisions:
- source_word: וַיִּוָּעַץ
  english_pob_choice: consulted
  chosen_korean: 의논했습니다
  alternatives_korean:
  - 상의했습니다
  - 조언을 구했습니다
  - 함께 의논했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 정보 전달이 아니라 상의하고 숙의하는 행위를 나타내므로, 현대 한국어에서 자연스러운 ‘의논했습니다’가 회합·숙의의 의미를 잘 살립니다.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  english_pob_choice: the commanders of the thousands and the hundreds
  chosen_korean: 천부장들과 백부장들
  alternatives_korean:
  - 천 명의 지휘관들과 백 명의 지휘관들
  - 천부들과 백부들
  - 천부장과 백부장
  lexicon: HALOT
  rationale: 군사·행정 단위 표현을 한국어 성경 전통에서 널리 쓰이는 ‘천부장 / 백부장’으로 옮기되, 본문이 복수임을 반영해 복수형으로 처리했습니다.
- source_word: נָגִיד
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 인도자
  - 우두머리
  - 지도자들
  lexicon: HALOT
  rationale: נָגִיד는 통치자보다 넓은 이끎의 의미를 가지므로, 문맥상 과도하게 왕권적이지 않은 ‘지도자’가 적절합니다.
theological_decisions:
- issue: 본절의 정치·군사적 회의 장면을 어떻게 현대 한국어에서 표현할지
  chosen_reading: 권위적 명령조보다 협의의 의미가 드러나도록 ‘의논했습니다’로 옮겼습니다.
  alternative_readings:
  - 명령했습니다
  - 상의했습니다
  rationale: 히브리어 וַיִּוָּעַץ는 왕이 일방적으로 지시하는 장면이 아니라 공동 숙의의 성격을 띠므로, 본문의 절차적 의미를 유지하는 번역이 적절합니다.
  doctrine_reference: 성경 본문의 서술 의도 보존
