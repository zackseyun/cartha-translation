source:
  edition: WLC
  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן כִּידֹ֑ן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶת יָד֗/וֹ לֶ/אֱחֹז֙ אֶת הָ֣/אָר֔וֹן כִּ֥י שָֽׁמְט֖וּ הַ/בָּקָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
  footnotes:
  - marker: a
    text: Or 'the oxen slipped.' The Hebrew verb can denote slipping or letting something drop; here it describes the oxen's destabilizing movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 기돈의 타작마당에 이르렀을 때, 웃사가 궤를 붙잡으려고 손을 내밀었습니다. 소들이 비틀거렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소들이 미끄러졌습니다.’ 이 히브리어 동사는 미끄러지거나 무엇인가를 떨어뜨리는 것을 뜻할 수 있으며, 여기서는 소들의 불안정한 움직임을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  english_pob_choice: the threshing floor of Kidon
  chosen_korean: 기돈의 타작마당
  alternatives_korean:
  - 기돈 타작마당
  - 기돈에 있는 타작마당
  lexicon: HALOT
  rationale: גֹּרֶן은 타작마당이며, כִּידֹן은 지명으로 음역하는 것이 적절합니다. 소유격 구조를 살려 자연스럽게 옮겼습니다.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  english_pob_choice: reached out his hand
  chosen_korean: 손을 내밀어
  alternatives_korean:
  - 손을 뻗어
  - 손을 펴서
  lexicon: HALOT
  rationale: 손을 앞으로 내미는 동작을 자연스러운 현대 한국어로 옮기되, 단순한 의도 표현이 아니라 실제 신체 동작임을 드러내기 위해 선택했습니다.
- source_word: לֶאֱחֹז אֶת הָאָרוֹן
  english_pob_choice: to take hold of the ark
  chosen_korean: 언약궤를 붙잡으려 했습니다
  alternatives_korean:
  - 언약궤를 붙들려고 했습니다
  - 궤를 잡으려 했습니다
  lexicon: HALOT
  rationale: אחז는 ‘붙잡다/붙들다’의 뜻이므로, 경건한 용어를 덧붙이지 않고 대상인 언약궤를 분명히 하면서도 안정시키려는 시도를 드러냈습니다.
- source_word: שָׁמְטוּ
  english_pob_choice: stumbled
  chosen_korean: 비틀거렸기 때문입니다
  alternatives_korean:
  - 미끄러졌기 때문입니다
  - 휘청였기 때문입니다
  lexicon: HALOT
  rationale: 이 동사는 미끄러짐이나 떨어뜨림의 의미를 가질 수 있으나, 이 문맥에서는 소들의 불안정한 움직임을 가리키므로 ‘비틀거리다’가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘언약궤’ 표현의 채택
  chosen_reading: אָרוֹן을 단순히 ‘궤’로 두지 않고 ‘언약궤’로 옮겼습니다.
  alternative_readings:
  - 궤를 붙잡으려 했습니다
  - 하나님의 궤를 붙잡으려 했습니다
  rationale: 본문 히브리어는 단순히 ‘궤’이지만, 한국어 독자가 본문 맥락에서 무엇을 가리키는지 즉시 알 수 있도록 더 넓은 서술 맥락에 근거한 식별 표현을 사용했습니다. 이는 의미를 바꾸지 않고 지시 대상을 명확히 하는 선택입니다.
  doctrine_reference: 성경 본문 내 지시 대상 명확화
