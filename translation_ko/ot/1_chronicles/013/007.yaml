source:
  edition: WLC
  text: וַ/יַּרְכִּ֜יבוּ אֶת אֲר֤וֹן הָ/אֱלֹהִים֙ עַל עֲגָלָ֣ה חֲדָשָׁ֔ה מִ/בֵּ֖ית אֲבִינָדָ֑ב וְ/עֻזָּ֣א וְ/אַחְי֔וֹ נֹהֲגִ֖ים בָּ/עֲגָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
  footnotes:
  - marker: a
    text: Or 'were driving the cart.' The Hebrew participle can denote leading or driving a vehicle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하나님의 궤를 새 수레에 싣고 아비나답의 집에서 가져왔으며, 웃사와 아히오가 그 수레를 몰고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몰고 있었습니다’는 כאן의 נהג를 자연스럽게 옮긴 표현이며, 문맥상 ‘이끌고 있었습니다’ 또는 ‘운전하고 있었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  english_pob_choice: set
  chosen_korean: 싣고
  alternatives_korean:
  - 올려놓고
  - 실어
  - 옮겨
  lexicon: HALOT
  rationale: 여기서는 궤를 수레 위에 실어 이동시키는 동작이므로, 한국어에서는 자연스럽고 구체적인 ‘싣고’가 원문의 행위를 잘 드러냅니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 궤
  - 하나님의 궤짝
  lexicon: HALOT
  rationale: ‘궤’가 이 문맥에서 예배용 성물인 아론(אַרוֹן)을 가리키며, 소유격은 한국어에서 자연스럽게 ‘하나님의’로 옮겼습니다.
- source_word: עֲגָלָה חֲדָשָׁה
  english_pob_choice: a new cart
  chosen_korean: 새 수레
  alternatives_korean:
  - 새로운 수레
  - 새 마차
  lexicon: HALOT
  rationale: עֲגָלָה는 이 맥락에서 운반용 수레를 뜻하므로, 현대 한국어에서는 ‘수레’가 가장 직접적이고 자연스럽습니다.
- source_word: נֹהֲגִים
  english_pob_choice: were guiding
  chosen_korean: 몰고 있었습니다
  alternatives_korean:
  - 이끌고 있었습니다
  - 운전하고 있었습니다
  - 몰았습니다
  lexicon: HALOT
  rationale: ‘נהג’는 탈것이나 가축을 몰다/이끌다의 뜻이 있어, 수레를 실제로 조작해 가는 모습을 살린 ‘몰고 있었습니다’가 가장 무난합니다.
theological_decisions:
- issue: 언약궤를 운반하는 방식의 서술
  chosen_reading: 이 구절은 단순한 이동 묘사이지만, 원문은 궤를 ‘새 수레’에 실어 운반한 사실을 분명히 드러내므로 그 구체성을 유지했습니다.
  alternative_readings:
  - ‘옮겼습니다’처럼 일반화하는 번역
  - ‘실어 나르다’로 완화하는 번역
  rationale: 후속 서술(다음 절의 긴장)과 연결되는 핵심 정보이므로 운반 수단을 흐리지 않는 것이 중요합니다.
  doctrine_reference: 1 Samuel 6–7 병행 본문과 궤 운반 규정의 맥락
- issue: 인명 표기
  chosen_reading: 웃사와 아히오는 현대 한국어 음역을 따랐습니다.
  alternative_readings:
  - 우사와 아히오
  - 웃사와 아히요
  rationale: 고유명사는 기존 한국어 성경에서 널리 쓰이는 관행과 현대 음역의 가독성을 함께 고려했습니다.
  doctrine_reference: 고유명사 표기 관행
