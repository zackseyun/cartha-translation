id: 1CH.13.13
reference: 1 Chronicles 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא הֵסִ֨יר דָּוִ֧יד אֶת הָ/אָר֛וֹן אֵלָ֖י/ו אֶל עִ֣יר דָּוִ֑יד וַ/יַּטֵּ֕/הוּ אֶל בֵּ֥ית עֹבֵֽד אֱדֹ֖ם הַ/גִּתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
  footnotes:
  - marker: a
    text: Or 'did not remove the ark to himself.' The Hebrew verb can mean 'remove' or, in context, 'bring' or 'take.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he diverted it' or 'he brought it aside' to the house of Obed-edom.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 언약궤를 자기에게, 곧 다윗 성으로 옮기지 않았습니다[a]. 오히려[b] 그는 그것을 오벧에돔의 집으로 돌려 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약궤를 자기에게서 옮기지 않았다.’ 히브리어 동사는 문맥에 따라 ‘제거하다’, ‘옮기다’, ‘데려오다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것을 돌려 보냈다’ 혹은 ‘그것을 다른 쪽으로 돌렸다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  english_pob_choice: did not bring
  chosen_korean: 옮기지 않았습니다
  alternatives_korean:
  - 가져오지 않았습니다
  - 옮기지 않았습니다
  - 옮겨 오지 않았습니다
  lexicon: HALOT
  rationale: 이 동사는 문맥상 언약궤를 다윗의 처소로 이동시키지 않았다는 뜻이므로, 단순한 ‘제거하다’보다 이동 의미를 살린 ‘옮기지 않았습니다’가 더 정확합니다.
- source_word: אֵלָיו
  english_pob_choice: to himself
  chosen_korean: 자기에게
  alternatives_korean:
  - 그에게
  - 자기에게
  lexicon: HALOT
  rationale: 다윗이 언약궤를 자기 쪽으로, 곧 자기 소유의 장소로 들이지 않았다는 반사적 의미를 한국어에서도 분명히 하기 위해 ‘자기에게’로 옮겼습니다.
- source_word: וַיַּטֵּהוּ
  english_pob_choice: he turned it aside
  chosen_korean: 그것을 … 돌려 보냈습니다
  alternatives_korean:
  - 그것을 돌려 보냈습니다
  - 그것을 옆으로 돌렸습니다
  - 그것을 다른 곳으로 돌렸습니다
  lexicon: HALOT
  rationale: נָטָה의 핵심은 원래 진행 방향에서 비껴나게 하는 것이므로, 문맥상 자연스럽고 구체적인 한국어인 ‘돌려 보냈습니다’로 옮기되, 언약궤를 다른 목적지로 돌린 의미를 살렸습니다.
- source_word: בֵּית עֹבֵד אֱדֹם
  english_pob_choice: the house of Obed-edom
  chosen_korean: 오벧에돔의 집
  alternatives_korean:
  - 오벧에돔의 집
  - 오벧에돔의 가문
  lexicon: HALOT
  rationale: 이 구절은 언약궤가 머무른 실제 장소를 가리키므로, 계보적 의미의 ‘가문’보다 공간적 의미의 ‘집’이 더 적절합니다.
theological_decisions:
- issue: 언약궤의 이동을 ‘옮기다/돌려 보내다’로 어떻게 표현할지
  chosen_reading: 다윗이 언약궤를 자기 거처로 끝내 들이지 않고 오벧에돔의 집으로 방향을 바꾸어 맡긴 것으로 표현했습니다.
  alternative_readings:
  - ‘제거하지 않았습니다’로 더 직역하기
  - ‘다른 곳으로 돌렸습니다’로 더 일반화하기
  rationale: 히브리어 동사는 단순 제거가 아니라 이동 경로의 변경을 포함하므로, 본문이 전달하는 사건의 흐름을 살리면서도 과도한 해석을 피하는 표현을 택했습니다.
  doctrine_reference: 언약궤와 야훼의 임재에 대한 서술의 정확성
