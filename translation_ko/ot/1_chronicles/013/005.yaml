  - 소집하여
  lexicon: HALOT
  rationale: 히필 קהל은 사람들을 한곳에 모이게 하는 뜻이므로, 현대 한국어에서 자연스러운 ‘모아’로 옮겼습니다.
- source_word: כָּל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 이스라엘 온 백성
