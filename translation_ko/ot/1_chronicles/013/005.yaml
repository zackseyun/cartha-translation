  lexicon: HALOT
  rationale: 집단적·국가적 표현을 살리면서 한국어 성경 문체에 자연스러운 ‘이스라엘 온 백성’으로 옮겼습니다.
- source_word: מִן שִׁיחוֹר מִצְרַיִם / וְעַד לְבוֹא חֲמָת
  english_pob_choice: from the Shihor of Egypt ... to Lebo-hamath
  chosen_korean: 이집트의 시홀에서부터 하맛 어귀까지
  alternatives_korean:
  - 이집트의 시홀에서 하맛 어귀까지
  - 이집트의 시홀에서 하맛의 입구까지
  lexicon: HALOT
  rationale: 지명과 경계 공식을 보존하되, ‘לְבוֹא חֲמָת’의 문자적 의미를 반영해 ‘하맛 어귀’로 옮겼습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님 궤
  lexicon: HALOT
  rationale: 본문의 단순한 명사구를 그대로 살려, 해석을 덧붙인 ‘언약궤’는 피하고 ‘하나님의 궤’로 옮겼습니다.
- source_word: מִקִּרְיַת יְעָרִים
  english_pob_choice: from Kiriath-jearim
  chosen_korean: 기럇여아림에서
  alternatives_korean:
  - 기랏여아림에서
  - 기랏-여아림에서
  lexicon: HALOT
  rationale: 표준 외래어 표기보다 성경 지명으로 널리 쓰이는 음역을 살리되, 히브리어 고유지명성을 유지했습니다.
theological_decisions:
- issue: 이스라엘의 전국적 소집 범위
  chosen_reading: 다윗이 온 나라 규모의 백성을 불러 모은 국가적 행위로 읽었습니다.
  alternative_readings:
  - 대표자만 모은 제한적 집회
