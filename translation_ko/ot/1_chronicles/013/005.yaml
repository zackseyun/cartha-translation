id: 1CH.13.5
reference: 1 Chronicles 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
  footnotes:
  - marker: a
    text: Or, more literally, “as far as the entrance of Hamath.”
    reason: lexical_alternative
  - marker: b
    text: “Shihor of Egypt” is a southern boundary designation; some understand it as “the brook of Egypt.”
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 다윗이 이스라엘 온 백성을 모아, 이집트의 시홀에서부터 하맛 어귀까지 이르게 하여, 하나님의 궤를 기럇여아림에서 가져오려 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하맛 어귀’는 원문의 “Hamath에 들어가는 곳”에 해당하는 경계 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시홀’은 이집트의 남쪽 경계 표지로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְהֵל
  english_pob_choice: assembled
  chosen_korean: 모아
  alternatives_korean:
  - 모집하여
  - 소집하여
  lexicon: HALOT
  rationale: 히필 קהל은 사람들을 한곳에 모이게 하는 뜻이므로, 현대 한국어에서 자연스러운 ‘모아’로 옮겼습니다.
- source_word: כָּל יִשְׂרָאֵל
  english_pob_choice: all Israel
  chosen_korean: 이스라엘 온 백성
  alternatives_korean:
  - 온 이스라엘
  - 이스라엘 전체
  lexicon: HALOT
  rationale: 집단적·국가적 표현을 살리면서 한국어 성경 문체에 자연스러운 ‘이스라엘 온 백성’으로 옮겼습니다.
- source_word: מִן שִׁיחוֹר מִצְרַיִם / וְעַד לְבוֹא חֲמָת
  english_pob_choice: from the Shihor of Egypt ... to Lebo-hamath
  chosen_korean: 이집트의 시홀에서부터 하맛 어귀까지
  alternatives_korean:
  - 이집트의 시홀에서 하맛 어귀까지
  - 이집트의 시홀에서 하맛의 입구까지
  lexicon: HALOT
  rationale: 지명과 경계 공식을 보존하되, ‘לְבוֹא חֲמָת’의 문자적 의미를 반영해 ‘하맛 어귀’로 옮겼습니다.
- source_word: אֲרוֹן הָאֱלֹהִים
  english_pob_choice: the ark of God
  chosen_korean: 하나님의 궤
  alternatives_korean:
  - 하나님의 언약궤
  - 하나님 궤
  lexicon: HALOT
  rationale: 본문의 단순한 명사구를 그대로 살려, 해석을 덧붙인 ‘언약궤’는 피하고 ‘하나님의 궤’로 옮겼습니다.
- source_word: מִקִּרְיַת יְעָרִים
  english_pob_choice: from Kiriath-jearim
  chosen_korean: 기럇여아림에서
  alternatives_korean:
  - 기랏여아림에서
  - 기랏-여아림에서
  lexicon: HALOT
  rationale: 표준 외래어 표기보다 성경 지명으로 널리 쓰이는 음역을 살리되, 히브리어 고유지명성을 유지했습니다.
theological_decisions:
- issue: 이스라엘의 전국적 소집 범위
  chosen_reading: 다윗이 온 나라 규모의 백성을 불러 모은 국가적 행위로 읽었습니다.
  alternative_readings:
  - 대표자만 모은 제한적 집회
  - 단순한 군사 동원
  rationale: 본문의 경계 공식은 언약궤 운반을 위한 전국적 동원과 공적 회중 형성을 시사합니다.
  doctrine_reference: 1 Chronicles 13:5 문맥상 공적 예배/언약 중심성
