  source_fidelity: 원문의 וַיִּירָא는 웃사의 죽음 직후 다윗이 하나님을 실제로 두려워한 반응을 나타내며, ‘두려워했습니다’가 이를 충실히 옮깁니다. הֵיךְ אָבִיא의 미완료형 질문은 단순한 능력뿐 아니라 어떻게 해야 할지의 난처함도 내포하므로, ‘어떻게 ... 가져오겠습니까?’가 이를 열어 둡니다.
  naturalness: 초안의 ‘두려워하며 말하였습니다’도 이해되지만, 두 동작을 동시적으로 연결하여 서술 순서와 말의 도입 기능이 다소 흐려집니다. ‘두려워했습니다. 그리고 말했습니다’는 현대 표준어 합쇼체로 자연스럽고 원문의 서술 전개를 분명히 합니다.
