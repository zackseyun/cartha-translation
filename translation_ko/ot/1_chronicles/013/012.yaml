translation:
  language: ko
  text: 그날 다윗은 하나님을 두려워하며 말하였습니다. 「어떻게 내가 하나님의 궤를 내게로 가져올 수 있겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님을 무서워했”; 히브리어 동사는 문맥에 따라 두려움, 공포, 경외를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  english_pob_choice: feared
  chosen_korean: 두려워하며
  alternatives_korean:
  - 무서워하며
  - 경외하며
  lexicon: WLC; HALOT
  rationale: 문맥상 웃사 사건 직후의 반응이므로 단순한 ‘경외’보다 실제 두려움의 긴장을 살리는 ‘두려워하다’가 원문의 정서를 더 잘 반영합니다.
- source_word: אֶת הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님을
  alternatives_korean:
  - 하나님께
  - 하나님 앞에
  lexicon: WLC; HALOT
  rationale: 직접목적을 나타내는 אֶת을 자연스러운 목적격으로 옮겨 ‘하나님을’로 처리했습니다.
- source_word: הֵיךְ אָבִיא אֵלַי אֵת אֲרוֹן הָאֱלֹהִים
  english_pob_choice: How can I bring the ark of God to me?
  chosen_korean: 어떻게 내가 하나님의 궤를 내게로 가져올 수 있겠습니까?
  alternatives_korean:
  - 내가 어떻게 하나님의 궤를 내게로 옮겨올 수 있겠습니까?
  - 내가 어떻게 하나님의 궤를 나에게 가져올 수 있겠습니까?
  lexicon: WLC; HALOT
  rationale: אָבִיא는 단순한 이동보다 ‘가져오다/옮겨오다’의 방향성을 가지므로, ‘가져올 수 있겠습니까?’로 자연스럽게 옮겼습니다. ‘내게로’는 אֵלַי의 방향성을 살립니다.
theological_decisions:
- issue: 하나님에 대한 반응의 성격
  chosen_reading: ‘두려워하며’로 번역해 실제 공포와 경외의 긴장을 함께 남겼습니다.
  alternative_readings:
  - 경외하며
  - 무서워하며
  rationale: 사건의 배경이 하나님의 심판과 그에 대한 즉각적 반응이므로, 신학적으로 이를 순화해 단순한 예우로 만들지 않도록 했습니다.
  doctrine_reference: 거룩하신 하나님 앞의 두려움과 경외의 긴장 유지
