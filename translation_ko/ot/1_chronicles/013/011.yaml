  - severity: medium
    issue: ‘오늘까지’가 다윗의 명명 행위 자체를 수식하는 듯함
    rationale: 히브리어는 그 지명이 기록 당시까지 유지되었다는 관용적 서술입니다. 한국어에서는 이름의 지속을 별도 절로 드러내는 편이 정확합니다.
  - severity: low
