  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
  footnotes:
  - marker: a
    text: Perez-uzza sounds like 'breach against Uzza' or 'outburst against Uzza,' echoing the Hebrew wordplay in 'the LORD had broken out in a breach against Uzza.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗은 야훼께서 웃사를 향해 터져 나오셨기 때문에 분노했습니다. 그래서 그는 그곳을 “페레츠-웃사”라고 불렀는데, 그 이름이 오늘날까지 이릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “페레츠-웃사”는 ‘웃사를 향한 파열’ 또는 ‘웃사를 향한 돌발적 터짐’ 정도의 뜻입니다. 이는 앞의 ‘야훼께서 웃사를 향해 터져 나오셨다’와 히브리어에서 같은 어근을 사용하는 말놀이입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  english_pob_choice: And David was angry
  chosen_korean: 다윗은 … 분노했습니다
  alternatives_korean:
  - 다윗은 … 화가 났습니다
  - 다윗은 … 노했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 חרה ל는 감정이 크게 타오르는 분노를 뜻하므로, 현대 한국어에서는 자연스럽고 강한 ‘분노했습니다’가 가장 잘 대응합니다.
- source_word: פָּרַץ יְהוָה פֶּרֶץ
  english_pob_choice: the LORD had broken out in a breach
  chosen_korean: 야훼께서 웃사에게서 크게 터져 나오신
  alternatives_korean:
  - 야훼께서 웃사에게서 한 파열을 일으키신
  - 야훼께서 웃사를 향해 터져 나오신
  lexicon: HALOT
  rationale: פרץ와 פֶּרֶץ의 말놀이를 살리기 위해 ‘터져 나오신’으로 동사를 옮기고, 결과를 ‘크게’로 보완해 단순한 ‘쳤다/내리쳤다’보다 원문의 돌발성과 격발성을 보존했습니다.
- source_word: בְּעֻזָּא
  english_pob_choice: against Uzza
  chosen_korean: 웃사에게서
  alternatives_korean:
  - 웃사에게
  - 웃사 위에
  - 웃사를 향해
  lexicon: HALOT
  rationale: 문맥상 웃사가 그 돌발적 심판의 직접 대상이므로, 한국어에서는 관계를 가장 간결하게 드러내는 ‘웃사에게서’로 처리했습니다.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא פֶּרֶץ עֻזָּא
  english_pob_choice: so he called that place Perez-uzza
  chosen_korean: 그곳을 오늘까지 “페레츠-웃사”라고 불렀습니다
  alternatives_korean:
  - 그곳의 이름을 페레츠-웃사라고 불렀습니다
  - 그곳을 페레츠-웃사라 불렀습니다
  lexicon: HALOT
  rationale: 지명은 음역으로 두어 본문의 고유명사 형태를 보존했고, ‘그곳을 …라고 불렀습니다’로 히브리어 명명 공식을 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접적 이름 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 이 본문은 신명기를 직접 호칭하는 고유명사를 사용하므로, 직역 관례보다 이름 자체를 드러내는 ‘야훼’가 소스-직접성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
