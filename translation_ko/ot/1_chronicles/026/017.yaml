  text: לַ/מִּזְרָח֮ הַ/לְוִיִּ֣ם שִׁשָּׁה֒ לַ/צָּפ֤וֹנָ/ה לַ/יּוֹם֙ אַרְבָּעָ֔ה לַ/נֶּ֥גְבָּ/ה לַ/יּ֖וֹם אַרְבָּעָ֑ה וְ/לָ/אֲסֻפִּ֖ים שְׁנַ֥יִם שְׁנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
  footnotes:
  - marker: a
    text: Hebrew Asuppim; the term may refer to a specific place-name or chamber complex rather than storehouses in a general sense.
    reason: alternative_reading
translation:
  language: ko
  text: 동쪽에는 레위 사람 여섯 명이었고, 북쪽에는 하루에 네 명, 남쪽에는 하루에 네 명, 그리고 창고들에는 둘씩이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아수빔’은 특정 장소명이나 방·창고 복합체를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  english_pob_choice: on the east
  chosen_korean: 동쪽에는
  alternatives_korean:
  - 동쪽에
  - 동쪽 편에는
  lexicon: HALOT
  rationale: 방향을 나타내는 위치 표현이므로, 목록형 배치 문맥에 맞게 ‘동쪽에는’으로 옮겨 자연스러운 행정적 진술로 표현했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: Levites
  chosen_korean: 레위 사람
  alternatives_korean:
  - 레위인
  - 레위 사람들
  lexicon: HALOT
  rationale: 이 문맥은 성전 문지기 배치의 인적 구성을 말하므로, 혈통·직무를 함께 드러내는 ‘레위 사람’이 가장 무난합니다.
- source_word: לַיּוֹם
  english_pob_choice: a day
  chosen_korean: 하루에
  alternatives_korean:
  - 날마다
  - 매일
  lexicon: HALOT
  rationale: 분배 인원을 나타내는 수량 표현이므로, ‘하루에’가 영어 POB의 distributive sense를 가장 직접적으로 반영합니다.
- source_word: וְלָאֲסֻפִּים
  english_pob_choice: at the storehouses
  chosen_korean: 창고들에는
  alternatives_korean:
  - 아수빔에는
  - 저장실들에는
  - 곳간들에는
  lexicon: HALOT
  rationale: 문맥상 일반 명사적 의미가 우선이므로 ‘창고들’로 풀어 읽되, 고유 지명 가능성은 본문 각주로 보존합니다.
- source_word: שְׁנַיִם שְׁנָיִם
  english_pob_choice: two by two
  chosen_korean: 둘씩이었습니다
  alternatives_korean:
  - 둘씩
  - 두 명씩
  lexicon: HALOT
  rationale: 반복 수사는 분배 단위를 나타내므로, 현대 한국어에서 자연스럽고 간결한 ‘둘씩’으로 옮겼습니다.
theological_decisions:
- issue: אַסֻפִּים의 의미를 일반 명사로 볼지, 특정 장소명으로 볼지
  chosen_reading: 본문에는 ‘창고들’로 번역하되, 원어는 특정 장소명일 수 있다는 가능성을 각주로 남깁니다.
  alternative_readings:
  - 아수빔
  - 아수빔이라는 장소
  - 저장고들
  rationale: 영어 POB의 주석처럼 용어의 지시 대상이 확정적이지 않으므로, 가독성은 살리되 해석의 여지는 보존하는 쪽이 원문 추적성에 유리합니다.
  doctrine_reference: 본문 비평 및 성전 용어 해석의 불확정성
- issue: 수량·분배 표현의 문체
  chosen_reading: 열거형 행정 문장을 유지해 ‘하루에 네 명’ ‘둘씩’처럼 분배 정보를 그대로 드러냅니다.
  alternative_readings:
  - 매일 네 명
  - 두 명씩
  rationale: 이 절은 서술보다 배치표에 가깝기 때문에, 의미를 매끈하게 합치기보다 원문의 배분 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 서사체/명부체의 형식 보존
