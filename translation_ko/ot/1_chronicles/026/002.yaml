  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''And to Shelemiah, sons,'' a genealogical construction meaning ''And Shelemiah had sons.'''
    reason: cultural_note
  - marker: b
    text: Or 'Yathniel,' reflecting the initial Hebrew consonant more directly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셀레먀에게는 아들이 있었습니다. 첫째는 스가랴였고[a], 둘째는 여디아엘, 셋째는 스바댜, 넷째는 야드니엘이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고 셀레먀에게, 아들들’이라는 족보식 구문입니다. 한국어에서는 이를 ‘셀레먀에게는 아들이 있었습니다’로 풀어 옮겼습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 자음 배열을 더 직접적으로 따르면 ‘야드니엘’로 옮길 수 있습니다.
    reason: lexical_alternative
