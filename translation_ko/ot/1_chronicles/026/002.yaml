  rationale: 족보의 순서 표지이므로 ‘첫째’가 자연스럽고 간결하며, ‘첫째’는 서열과 첫 출생의 의미를 함께 전달합니다.
- source_word: הַשְּׁלִישִׁי / הָרְבִיעִי
  english_pob_choice: the third / the fourth
  chosen_korean: 셋째 / 넷째
  alternatives_korean:
  - 세 번째 / 네 번째
  - 제삼 / 제사
  lexicon: HALOT
  rationale: 족보 목록에서의 순서를 한국어 현대어로 일관되게 나타내기 위해 ‘셋째, 넷째’를 사용했습니다.
- source_word: יְדִיעֲאֵל / זְבַדְיָהוּ / יַתְנִיאֵל
  english_pob_choice: Jediael / Zebadiah / Jathniel
  chosen_korean: 여디아엘 / 스바댜 / 야드니엘
  alternatives_korean:
  - 예디아엘 / 스바디야 / 야드니엘
