source:
  edition: WLC
  text: וְֽ/הַ/לְוִיִּ֑ם אֲחִיָּ֗ה עַל אֽוֹצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹֽצְר֖וֹת הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
  footnotes:
  - marker: a
    text: 'Or ''And the Levites: Ahijah was over ...'' The Hebrew opening is somewhat elliptical and may function as a heading-like transition.'
    reason: alternative_reading
  - marker: b
    text: '''Holy things'' may also be rendered ''dedicated things'' or ''consecrated things,'' referring to items set apart for sacred use.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위인들 가운데서는 아히야가 하나님의 집의 곳간과 거룩한 것들의 곳간을 맡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫머리는 다소 생략적인 전환 구문일 수 있어, ‘그리고/레위인들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘거룩한 것들’은 ‘성물’ 또는 ‘거룩하게 구별된 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  english_pob_choice: And of the Levites
  chosen_korean: 레위인들 가운데서는
  alternatives_korean:
  - 그리고 레위인들은
  - 레위인들에 관해서는
  lexicon: HALOT
  rationale: 히브리어의 접속사+명사구는 단순 나열보다 화제 전환에 가깝기 때문에, 영어 POB의 여지를 살려 레위인들을 화제로 세우는 자연스러운 한국어로 옮겼습니다.
- source_word: עַל
  english_pob_choice: was over
  chosen_korean: 맡았습니다
  alternatives_korean:
  - 위에 있었습니다
  - 감독했습니다
  - 관리했습니다
  lexicon: HALOT
  rationale: 행정적·관리적 책임을 나타내므로, 한국어에서는 직역된 위치 표현보다 ‘맡다’가 책임과 감독을 함께 드러내면서도 문맥에 자연스럽습니다.
- source_word: אֹצְרוֹת / אֹצְרוֹת הַקֳּדָשִׁים
  english_pob_choice: treasuries / the holy things
  chosen_korean: 곳간 / 거룩한 것들의 곳간
  alternatives_korean:
  - 보물창고 / 성물의 창고
  - 창고 / 성물의 곳간
  lexicon: HALOT
  rationale: אֹצְרוֹת은 단순한 창고가 아니라 귀중품과 헌물을 보관하는 기관적 저장소를 가리키므로 ‘곳간’이 간결하면서도 기능을 잘 살립니다. הַקֳּדָשִׁים은 전통적 교회어 ‘성물’도 가능하지만, 원문의 복수 표현을 살려 ‘거룩한 것들’로 옮겼습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집안
  lexicon: HALOT
  rationale: 원문을 직역한 관용 표현을 유지하되, 현대 한국어에서 자연스러운 ‘하나님의 집’으로 옮겨 신전의 뜻을 과도하게 풀이하지 않았습니다.
theological_decisions:
- issue: הַקֳּדָשִׁים의 종교적 뉘앙스
  chosen_reading: ‘거룩한 것들’로 옮겨, 성별된 물건/예물을 가리키는 넓은 의미를 열어 두었습니다.
  alternative_readings:
  - 성물
  - 거룩하게 구별된 것들
  - 봉헌된 것들
  rationale: 본문은 저장 대상의 범주를 제시할 뿐이므로, 특정 제의물로 좁혀 버리기보다 원문의 복수성과 성별된 성격을 함께 보존하는 번역이 적절합니다.
  doctrine_reference: 구약 성전 제도와 성별(holy/separated) 어휘의 의미 보존
- issue: וְהַלְוִיִּם의 화제 전환 여부
  chosen_reading: ‘레위인들 가운데서는’으로 시작해 목록형 문맥 속 직책 분배를 암시했습니다.
  alternative_readings:
  - 레위인들은
  - 그리고 레위인들은
  rationale: 히브리어의 어색하지만 자연스러운 열거 시작을 한국어에서도 풀어 주어, 아히야가 레위인들 범주 안에서 어떤 임무를 맡았는지 드러내려는 의도를 반영했습니다.
  doctrine_reference: 문맥적 화제 전환과 서술 구조 보존
