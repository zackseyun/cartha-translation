  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
  footnotes:
  - marker: a
    text: Or 'descendants of Ladan.' In genealogical contexts, 'sons' can denote a broader line of descent.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'heads of the fathers’ houses,' that is, leaders of ancestral family units or clans.
    reason: cultural_note
translation:
  language: ko
  text: 라단의 아들들[a], 곧 게르손 사람 라단의 자손 가운데 조상 집안의 우두머리는 여히엘리였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 족보 문맥에서 ‘후손들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘조상 집안’은 조상 가문이나 씨족 단위를 가리키는 표현입니다.
    reason: cultural_note
