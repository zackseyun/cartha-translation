  edition: WLC
  text: וְ/אֶחָ֣י/ו בְּנֵי חַ֗יִל אַלְפַּ֛יִם וּ/שְׁבַ֥ע מֵא֖וֹת רָאשֵׁ֣י הָ/אָב֑וֹת וַ/יַּפְקִידֵ֞/ם דָּוִ֣יד הַ/מֶּ֗לֶךְ עַל הָ/ראוּבֵנִ֤י וְ/הַ/גָּדִי֙ וַ/חֲצִי֙ שֵׁ֣בֶט הַֽ/מְנַשִּׁ֔י לְ/כָל דְּבַ֥ר הָ/אֱלֹהִ֖ים וּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
  footnotes:
  - marker: a
    text: Or “for all the business of God and the king’s business.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 형제들[a], 곧 용맹한 이천칠백 명은 가문의 우두머리들이었습니다. 다윗 왕은 그들을 르우벤 사람들과 갓 사람들과 므낫세 반 지파의 책임자로 세우시고, 하나님의 모든 일과 왕의 모든 일을 맡기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 친족들’.
    reason: 히브리어 אֶחָיו는 직역하면 ‘그의 형제들’이지만, 씨족 문맥에서는 더 넓게 친족을 가리킬 수도 있습니다.
lexical_decisions:
- source_word: וְאֶחָיו
  english_pob_choice: And his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  - 그의 혈족들
  lexicon: HALOT
  rationale: 히브리어 אחים의 가장 직접적인 대응을 살리되, 이전 절의 인물과 연결되는 혈연·씨족 관계를 자연스럽게 드러냈습니다.
- source_word: בְּנֵי חַיִל
  english_pob_choice: valiant men
  chosen_korean: 용맹한 사람들
  alternatives_korean:
  - 유능한 사람들
  - 용사들
  lexicon: HALOT
  rationale: 전투적 용맹과 함께 책임을 맡을 만한 강건함을 아우르는 관용 표현으로 옮겼습니다.
- source_word: רָאשֵׁי הָאָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 아버지들의 집안의 우두머리들
  alternatives_korean:
  - 조상 가문의 우두머리들
  - 가문의 우두머리들
  lexicon: HALOT
  rationale: 히브리어의 친족·가문 구조를 보존하기 위해 직역에 가깝게 옮겼고, 단순히 ‘가문’으로 평준화하지 않았습니다.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  english_pob_choice: for every matter of God and of the king
  chosen_korean: 하나님의 모든 일과 왕의 모든 일
  alternatives_korean:
  - 하나님의 모든 사무와 왕의 모든 사무
  - 하나님과 왕의 모든 관련 업무
  lexicon: HALOT
  rationale: דבר를 여기서는 ‘일/사무’의 뜻으로 이해하되, 하나님의 일과 왕의 일을 병렬로 유지하여 행정·공적 책임의 두 영역을 그대로 드러냈습니다.
theological_decisions:
- issue: 하나님의 일과 왕의 일의 병렬성
  chosen_reading: 본문은 하나님의 일과 왕의 일을 구분하여 병렬로 제시하며, 두 책임 영역이 함께 위임되었음을 보여줍니다.
  alternative_readings:
  - 둘을 합쳐 ‘공무’처럼 일반화할 수 있으나, 본문의 구분이 약화됩니다.
  - ‘하나님의 일’만 종교적이고 ‘왕의 일’은 세속적이라는 식의 이분법을 덧붙일 수 있으나, 본문이 말하는 범위를 넘습니다.
  rationale: 히브리어의 대구법을 보존해 성전/종교와 왕권의 책임이 함께 위임된 사실을 분명히 했습니다.
  doctrine_reference: 본문 문맥의 행정적 대구법 보존
- issue: ‘왕 다윗’의 어순
  chosen_reading: ‘왕 다윗’으로 옮겨 다윗의 왕권을 서술어 앞에서 강조했습니다.
  alternative_readings:
  - ‘다윗 왕’으로도 자연스럽지만, 원문의 지위를 더 직접적으로 드러내려면 ‘왕 다윗’이 적절합니다.
  rationale: 히브리어의 직관적 호칭 구조를 살리면서 문어체 한국어에서 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 명칭·호칭의 서술적 강조
