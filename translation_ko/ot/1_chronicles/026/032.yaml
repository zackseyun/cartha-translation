  to: 그의 형제들[a], 곧 용맹한 이천칠백 명은 가문의 우두머리들이었습니다. 다윗 왕은 그들을 르우벤 사람들과 갓 사람들과 므낫세 반 지파의 책임자로 세우시고, 하나님의 모든 일과 왕의 모든 일을 맡기셨습니다.
