  source_fidelity: 히브리어는 하사뱌의 ‘형제들/친족들’을 용맹한 이천칠백 명의 가문 우두머리로 밝히고, 다윗이 그들을 요단 동쪽의 세 지파 집단 위에 임명하여 하나님의 일과 왕의 일을 맡게 했다고 말합니다. 초안의 핵심 의미와 수치는 대체로 정확하나, ‘관하게 했습니다’는 임명·위임의 뜻을 충분히 자연스럽게 전달하지 못합니다.
  naturalness: ‘아버지들의 집안의 우두머리들’은 한국어에서 중복되고 부자연스럽습니다. ‘가문의 우두머리들’로 옮기면 현대 표준어 합쇼체에서 자연스럽고, 문맥상 친족 집단의 대표라는 기능도 유지됩니다. ‘책임자로 세우시고 … 맡기셨습니다’는 위임의 구조를 명료하게 나타냅니다.
  terminology: ‘형제들’은 אֶחָיו의 직접 번역으로 유지하되, 씨족 문맥에서 가능한 넓은 뜻을 각주로 제시합니다. ‘용맹한’, ‘르우벤 사람들’, ‘갓 사람들’, ‘므낫세 반 지파’, ‘하나님의 모든 일과 왕의 모든 일’은 원문의 병렬성과 행정적 의미를 적절히 보존합니다.
