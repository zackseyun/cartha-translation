  lexicon: HALOT
  rationale: הַבְּכוֹר는 단순 서수가 아니라 ‘맏아들/장자’의 신분을 가리키므로, 현대 한국어에서는 족보 문맥에 자연스러운 ‘맏아들’로 옮겼습니다.
- source_word: וְ/שָׂכָ֣ר
  english_pob_choice: and Sakar
  chosen_korean: 사갈
  alternatives_korean:
  - 사카르
  - 이스사갈
  lexicon: HALOT
  rationale: 이 절의 히브리어 자음형은 부족명 ‘이스사갈’이 아니라 인명 ‘사갈’에 해당하므로, 음역도 그 형태를 따랐습니다.
