  text: וּ/לְ/עֹבֵ֥ד אֱדֹ֖ם בָּנִ֑ים שְׁמַֽעְיָ֤ה הַ/בְּכוֹר֙ יְהוֹזָבָ֣ד הַ/שֵּׁנִ֔י יוֹאָ֤ח הַ/שְּׁלִשִׁי֙ וְ/שָׂכָ֣ר הָ/רְבִיעִ֔י וּ/נְתַנְאֵ֖ל הַ/חֲמִישִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'And to Obed-edom, sons'; the English supplies 'had' to express the genealogical formula naturally.
    reason: lexical_alternative
  - marker: b
    text: The name 'Sakar' is distinct from 'Issachar' in the Hebrew form used here.
    reason: lexical_alternative
translation:
  language: ko
  text: 오벧에돔에게는 아들이 있었습니다. 맏아들 스마야, 둘째 여호사밧, 셋째 요아, 넷째 사갈, 다섯째 느다넬입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/עֹבֵ֥ד אֱדֹ֖ם
  english_pob_choice: And Obed-edom
  chosen_korean: 오벧에돔에게는
  alternatives_korean:
  - 오벧에돔에게
  - 또 오벧에돔에게는
  lexicon: HALOT
  rationale: 족보식 도입구의 여격적 표현을 한국어에서는 주어 표지 없이 ‘-에게는’으로 자연스럽게 풀어, 뒤의 자녀 목록을 예고하는 구조를 살렸습니다.
- source_word: בָּנִ֑ים
  english_pob_choice: had sons
  chosen_korean: 아들이 있었습니다
  alternatives_korean:
  - 아들이 있었습니다
  - 아들들이 있었습니다
  - 아들들이 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 생략된 관계를 가진 족보 공식이므로, 한국어에서는 문맥상 필요한 서술어를 보충하되 과도한 해석 없이 ‘있었습니다’로 처리했습니다.
- source_word: שְׁמַֽעְיָ֤ה הַ/בְּכוֹר֙
  english_pob_choice: Shemaiah the firstborn
  chosen_korean: 맏아들 스마야
  alternatives_korean:
  - 첫째 아들 스마야
  - 장자 스마야
  lexicon: HALOT
  rationale: הַבְּכוֹר는 단순 서수가 아니라 ‘맏아들/장자’의 신분을 가리키므로, 현대 한국어에서는 족보 문맥에 자연스러운 ‘맏아들’로 옮겼습니다.
- source_word: וְ/שָׂכָ֣ר
  english_pob_choice: and Sakar
  chosen_korean: 사갈
  alternatives_korean:
  - 사카르
  - 이스사갈
  lexicon: HALOT
  rationale: 이 절의 히브리어 자음형은 부족명 ‘이스사갈’이 아니라 인명 ‘사갈’에 해당하므로, 음역도 그 형태를 따랐습니다.
