base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'And to Obed-edom, sons'; the English supplies 'had' to express the genealogical formula naturally.
    reason: lexical_alternative
  - marker: b
    text: The name 'Sakar' is distinct from 'Issachar' in the Hebrew form used here.
    reason: lexical_alternative
translation:
  language: ko
  text: 오벧에돔에게는 아들들이 있었습니다. 맏아들은 스마야였고, 둘째는 여호사밧, 셋째는 요아, 넷째는 사갈[가], 다섯째는 느다넬이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: ‘사갈’은 여기의 히브리어 인명 형태를 옮긴 것으로, ‘이스사갈’과는 다른 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵ֥ד אֱדֹ֖ם
  english_pob_choice: And Obed-edom
  chosen_korean: 오벧에돔에게는
