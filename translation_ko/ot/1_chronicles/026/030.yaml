  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''beyond the Jordan westward,'' that is, on the western side of the Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헤브론 사람들에게는 하사뱌와 그의 형제들, 곧 1,700명의 유능한 사람들에게 이스라엘의 감독 업무를 맡겼는데, 그들은 요단 서쪽에서 야훼의 모든 일과 왕의 일에 관여하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘요단 강을 건너 서쪽으로’, 곧 요단강 서쪽을 뜻합니다.
    reason: cross_reference
