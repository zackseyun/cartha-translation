translation:
  language: ko
  text: 암람 사람들, 이스할 사람들, 헤브론 사람들, 그리고 웃시엘 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “암람 사람들, 이스할 사람들, 헤브론 사람들, 그리고 웃시엘 사람들에 대해”입니다. 히브리어는 네 개의 씨족 명칭만 ל 전치사와 함께 나열하여 표제처럼 기능합니다.
