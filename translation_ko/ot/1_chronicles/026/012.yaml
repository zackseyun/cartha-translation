revisions:
- from: 이것은 문지기들의 반열입니다. 그 남자들의 우두머리에게는 그들의 형제들의 것에 상응하는 직무가 있어, 야훼의 집에서 섬기게 하였습니다.[a]
  to: 이들은 문지기들의 반열이었습니다. 장정들의 우두머리들도 그 형제들과 마찬가지로 야훼의 집에서 섬기는 근무를 맡았습니다.[a]
