    rationale: 본문에는 누가 그들을 섬기게 했는지를 나타내는 동사가 없습니다. מִשְׁמָרוֹת의 생략된 서술은 ‘근무를 맡았다/근무가 있었다’ 정도로 보충하는 것이 안전합니다.
