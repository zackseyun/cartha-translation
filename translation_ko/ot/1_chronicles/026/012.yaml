    rationale: 히브리어의 압축된 병렬 구조를 그대로 옮겨 한국어 문장이 어색해졌습니다. ‘장정들의 우두머리들’과 ‘그 형제들과 마찬가지로’가 의미 관계를 더 분명히 드러냅니다.
  - severity: medium
    issue: 각주가 본문의 대안적 구조를 충분히 정확하게 반영하지 못합니다.
