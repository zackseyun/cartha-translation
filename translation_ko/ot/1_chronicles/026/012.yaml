  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ֠/אֵלֶּה מַחְלְק֨וֹת הַ/שֹּֽׁעֲרִ֜ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִשְׁמָר֖וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֑ם לְ/שָׁרֵ֖ת בְּ/בֵ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the leading men had watches/duties alongside their brothers.' The Hebrew is compact, and מִשְׁמָרוֹת can also be rendered 'watches' or 'service assignments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 문지기들의 반열입니다. 그 남자들의 우두머리에게는 그들의 형제들의 것에 상응하는 직무가 있어, 야훼의 집에서 섬기게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 우두머리들이 형제들 곁에서 경비/근무를 맡았다'로도 옮길 수 있습니다. 히브리어 מִשְׁמָרוֹת는 '경비', '근무', '봉사 배치'를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵלֶּה / מַחְלְקוֹת
  english_pob_choice: For these divisions
  chosen_korean: 이것은 문지기들의 반열입니다
  alternatives_korean:
  - 이것은 문지기들의 구분입니다
  - 이것은 문지기들의 배치입니다
  lexicon: HALOT
  rationale: מַחְלְקוֹת는 조직된 구분·반열을 뜻하므로, 현대 한국어에서는 '반열'로 간결하게 살리되 문맥상 문지기 집단의 편제를 드러냈습니다.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  english_pob_choice: the chief men
  chosen_korean: 그 남자들의 우두머리
  alternatives_korean:
  - 그 남자들의 지도자
  - 그 장정들의 우두머리
  - 남자들의 우두머리
  lexicon: HALOT
  rationale: רָאשֵׁי는 '우두머리/머리들'의 뜻이고, גְּבָרִים는 이 역사적 문맥에서 남자들을 가리키므로, 성별을 지우지 않으면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: מִשְׁמָרוֹת
  english_pob_choice: had assigned duties
  chosen_korean: 직무가 있어
  alternatives_korean:
  - 맡은 직무가 있어
  - 근무 책임이 있어
  - 맡은 임무가 있어
  lexicon: HALOT
  rationale: מִשְׁמָרוֹת는 감시·근무·봉사의 배치를 뜻할 수 있어, 문맥상 '직무'로 옮기고 서술을 보완해 히브리어의 생략된 동사를 반영했습니다.
- source_word: לְעֻמַּת אֲחֵיהֶם
  english_pob_choice: corresponding to those of their brothers
  chosen_korean: 그들의 형제들의 것에 상응하는
  alternatives_korean:
  - 그들의 형제들과 나란한
  - 그들의 형제들의 것에 맞먹는
  - 그들의 형제들과 같은
  lexicon: HALOT
  rationale: לְעֻמַּת는 '상응하여/대비하여'의 의미이므로, 관계의 대응성을 살려 '상응하는'으로 옮겼습니다.
- source_word: לְשָׁרֵת בְּבֵית יְהוָה
  english_pob_choice: to minister in the house of Yahweh
  chosen_korean: 야훼의 집에서 섬기게 하였습니다
  alternatives_korean:
  - 야훼의 집에서 봉사하게 하였습니다
  - 야훼의 집에서 직무를 수행하게 하였습니다
  - 야훼의 집에서 시중들게 하였습니다
  lexicon: HALOT
  rationale: שׁרת는 성소 맥락에서 단순 봉사보다 '섬김/봉사'의 의미가 강하므로, 한국어 합쇼체 문맥에 맞게 '섬기게 하였습니다'로 풀었습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명표기 יהוה를 프로젝트 기본어휘에 따라 '야훼'로 일관되게 옮겨, 언약명 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 직무 배치의 주체를 드러내는 방식
  chosen_reading: 직무가 있어
  alternative_readings:
  - 직무를 배정하여
  - 직무를 맡아
  - 배당된 직무가 있어
  rationale: 히브리어는 압축적이어서 명시적 배정 동사가 없지만, 한국어에서는 관계를 분명히 하려면 생략된 서술을 보충하는 것이 필요합니다.
  doctrine_reference: 'POB source-to-target fidelity: ellipsis resolution'
