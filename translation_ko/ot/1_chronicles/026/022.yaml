translation:
  language: ko
  text: 여히엘리의 아들들, 곧 세담과 그의 형제 요엘은 야훼의 집의 창고들을 맡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “야훼의 집”입니다. 전통적으로는 “여호와의 집” 또는 “주의 집”으로 옮겨 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: …의 아들들
  alternatives_korean:
  - …의 후손들
  - …의 자손들
  lexicon: HALOT
  rationale: 계보·직무 문맥에서 בְּנֵי의 직접적 대응은 “아들들”이며, 한국어에서도 가장 자연스럽고 원문에 밀착됩니다.
- source_word: יְחִיאֵלִי
  english_pob_choice: Jehieli
  chosen_korean: 여히엘리
  alternatives_korean:
  - 여히엘 사람
  - 여히엘
  lexicon: HALOT
  rationale: 문맥상 인명으로 쓰인 형태이므로 고유명사로 음역했습니다. 영어 POB의 판단을 따라 형용사적 처리보다 이름으로 읽는 것이 더 적절합니다.
- source_word: אָחִיו
  english_pob_choice: his brother
  chosen_korean: 그의 형제
  alternatives_korean:
  - 그의 형
  - 그들의 형제
  lexicon: HALOT
  rationale: 히브리어의 단수 소유형을 반영해 “그의 형제”로 옮겼습니다. 한국어에서는 “형제”가 혈연 관계를 포괄적으로 자연스럽게 드러냅니다.
- source_word: עַל
  english_pob_choice: were over
  chosen_korean: 맡았습니다
  alternatives_korean:
  - 감독했습니다
  - 책임졌습니다
  lexicon: HALOT
  rationale: 행정·관리 책임을 뜻하는 עַל의 기능을 한국어로 간결하게 풀어, 창고 관리의 직무 책임을 드러냈습니다.
- source_word: אֹצְרוֹת
  english_pob_choice: the treasuries
  chosen_korean: 창고들을
  alternatives_korean:
  - 보물 창고들을
  - 금고들을
  lexicon: HALOT
  rationale: 성전 자산의 보관 공간이라는 문맥을 살리기 위해 “창고들”로 옮겼습니다. “재물”보다 관리 공간의 성격이 더 분명합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: בֵּית יְהוָה를 직역해 “집”을 유지했고, 신명은 프로젝트 기본값에 따라 “야훼”로 옮겼습니다. 영어 POB의 각주도 이 표현이 문자의미상 “house of Yahweh”임을 확인합니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 신명은 전통적 대체어보다 원문 대응을 우선하여 “야훼”로 표기했습니다. 이는 계약명 자체를 보존하려는 프로젝트 원칙과 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
