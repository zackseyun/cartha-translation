translation:
  language: ko
  text: 여히엘리의 아들들 곧 제담과 그의 형제 요엘은 야훼의 집의 창고들을 맡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “야훼의 집”입니다. 전통적으로는 “여호와의 집” 또는 “주의 집”으로 옮겨 왔습니다.
    reason: ot_citation
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: …의 아들들
  alternatives_korean:
  - …의 후손들
  - …의 자손들
  lexicon: HALOT
  rationale: 계보·직무 문맥에서 בְּנֵי의 직접적 대응은 “아들들”이며, 한국어에서도 가장 자연스럽고 원문에 밀착됩니다.
- source_word: יְחִיאֵלִי
  english_pob_choice: Jehieli
  chosen_korean: 여히엘리
  alternatives_korean:
