  lexicon: HALOT
  rationale: 방향을 가리키는 말이므로 ‘남쪽’이 가장 간결하고 문맥상 자연스럽습니다.
- source_word: בֵּית הָאֲסֻפִּים
  english_pob_choice: the house of stores
  chosen_korean: 창고의 집
  alternatives_korean:
  - 저장소의 집
  - 저장물의 집
  - 창고집
  lexicon: HALOT
  rationale: 직역 구조를 유지하되 한국어에서 이해되도록 ‘집’과 ‘창고’의 소유·수식 관계를 살렸습니다. הָאֲסֻפִּים은 단순한 건물명이라기보다 보관된 물품/저장 공간을 가리키므로 ‘창고’가 적절합니다.
