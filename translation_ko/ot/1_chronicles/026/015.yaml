  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
  footnotes:
  - marker: a
    text: Or 'the house of the storehouses' / 'the house of collections.' The Hebrew term refers to a storage area or repositories.
    reason: lexical_alternative
translation:
  language: ko
  text: 오벧에돔에게는 남쪽을, 그의 아들들에게는 저장고 건물을 배정했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저장 물품의 집’, ‘수집물의 집’. 히브리어는 저장 공간이나 모아 둔 물품을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  english_pob_choice: To Obed-edom
  chosen_korean: 오벧에돔에게는
  alternatives_korean:
  - 오벧에돔을 위해서는
  - 오벧에돔에게
  lexicon: HALOT
  rationale: 분배·배정 문맥의 לְ를 한국어에서는 여격/배정의 뜻으로 자연스럽게 살려 ‘~에게는’으로 옮겼습니다.
- source_word: נֶגְבָּה
  english_pob_choice: the south
  chosen_korean: 남쪽
  alternatives_korean:
  - 남방
