  yaml_path: translation/ot/1_chronicles/026/009.yaml
  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
  footnotes:
  - marker: a
    text: Literally, 'for Shelemiah,' a Hebrew construction introducing the person being counted.
    reason: lexical_alternative
  - marker: b
    text: Or 'men of valor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셀레먀에게는 아들들과 형제들, 곧 용맹한 사람들이 열여덟 명 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/מְשֶׁלֶמְיָהוּ
  english_pob_choice: And Shelemiah
  chosen_korean: 그리고 셀레먀에게는
  alternatives_korean:
  - 그리고 셀레먀는
  - 그리고 셀레먀에게
  lexicon: WLC; HALOT
  rationale: 히브리어 לְ-구문은 여기서 ‘셀레먀를 기준으로 한 집계’를 여는 표현이므로, 자연스러운 한국어에서는 주제 표지와 함께 ‘에게는’으로 옮겨 장부식 열거의 흐름을 살렸습니다.
- source_word: בָּנִים
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 아들
  - 자녀들
  lexicon: WLC; HALOT
  rationale: 히브리어는 남성 자손을 뜻하므로 성별을 유지해 ‘아들들’로 옮겼습니다.
- source_word: וְ/אַחִים
  english_pob_choice: and brothers
  chosen_korean: 형제들
  alternatives_korean:
  - 그리고 형제들
  - 그리고 친족들
  lexicon: WLC; HALOT
  rationale: 문맥상 셀레먀 집안에 속한 남성 친족을 가리키는 일반적 의미를 반영해 ‘형제들’로 옮겼습니다.
- source_word: בְּנֵי חָיִל
  english_pob_choice: valiant men
  chosen_korean: 용맹한 사람들
  alternatives_korean:
  - 용사들
  - 유능한 사람들
  - 능력 있는 사람들
  lexicon: WLC; HALOT
  rationale: 직역하면 ‘힘/용맹의 아들들’이지만, 한국어에서는 관용적 뜻인 능력 있고 용맹한 남성 집단을 ‘용맹한 사람들’로 비교적 직선적으로 드러내는 편이 원문 의미를 잘 살립니다.
- source_word: שְׁמוֹנָה עָשָׂר
  english_pob_choice: eighteen
  chosen_korean: 열여덟 명
  alternatives_korean:
  - 열여덟
  - 열여덟 사람
  lexicon: WLC; HALOT
  rationale: 히브리어 수사는 앞의 집단명사 전체를 가리키는 열거의 결론이므로, 한국어에서는 인원수 표현으로 ‘열여덟 명’을 사용했습니다.
