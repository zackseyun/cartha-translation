language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁבֻאֵל֙ בֶּן גֵּרְשׁ֣וֹם בֶּן מֹשֶׁ֔ה נָגִ֖יד עַל הָ/אֹצָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
  footnotes:
  - marker: a
    text: Or 'leader,' 'overseer,' or 'prince' for 'chief officer.' The Hebrew term denotes one placed in authority.
    reason: lexical_alternative
  - marker: b
    text: Or 'storehouses' for 'treasuries.' The term can refer either to places where valuables are stored or to the treasures themselves, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셰부엘은 게르솜의 아들이요, 모세의 아들로서 보물 창고들을 맡은 책임자였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  english_pob_choice: And Shebuel
  chosen_korean: 그리고 셰부엘은
  alternatives_korean:
  - 또 셰부엘은
  - 셰부엘은
  lexicon: WLC/고유명사
  rationale: 접속사 וּ는 족보·직무 목록의 이어짐을 살려 ‘그리고’로 옮기고, 인명은 현대 음역으로 처리했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: …의 아들이요, …의 아들로서
  alternatives_korean:
  - …의 아들
  - …의 자손
  lexicon: HALOT
  rationale: 족보적 연결을 자연스럽게 드러내기 위해 ‘아들’ 구조를 유지했고, 두 번째 בֶּן은 반복을 살려 ‘아들로서’로 이어졌습니다.
- source_word: נָגִיד
  english_pob_choice: chief
  chosen_korean: 책임자
  alternatives_korean:
  - 주관자
  - 수장
  - 지도자
  lexicon: HALOT
  rationale: 이 용어는 단순한 일반 지도보다 ‘어떤 일에 공식적으로 맡겨진 관리’의 뜻이 강하므로, 보물 창고들을 맡은 직무 맥락을 살려 ‘책임자’로 옮겼습니다.
- source_word: הָ/אֹצָרוֹת
  english_pob_choice: the treasuries
  chosen_korean: 보물 창고들을
  alternatives_korean:
  - 창고들을
  - 재무 창고들을
  - 보물들
  lexicon: HALOT
  rationale: אֹצָרוֹת는 문맥상 저장 장소와 저장된 보물을 모두 가리킬 수 있으나, 여기서는 성전 관련 관리 직무이므로 저장 공간의 뉘앙스를 살린 ‘보물 창고들’이 가장 자연스럽습니다.
