- from: 그리고 셰부엘은 게르솜의 아들이요, 모세의 아들로서 보물 창고들을 맡은 책임자였습니다.
  to: 그리고 모세의 아들 게르솜의 아들 스브엘은 보물 창고들을 맡은 책임자였습니다.
  rationale: 계보 관계가 오해되지 않도록 히브리어의 연속된 ‘아들’ 수식을 한국어의 자연스러운 전치 수식 구조로 재구성했습니다. 직무와 보물 창고에 관한 의미는 유지했습니다. 한국어 본문에는 별도의 각주 앵커가 없으므로 각주를 새로 두지 않았습니다. 영어 감사 기록의 각주 표지는 해당 설명의 대상과 서로 맞지 않지만, 이는 한국어 본문의 의미나 구조를 바꾸지 않으며 한국어 각주로 이식할 근거도 없습니다.
