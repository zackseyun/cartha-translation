  terminology: 통용 한국어 성경의 인명 표기와 히브리어 음가에 맞추어 ‘셰부엘’을 ‘스브엘’로 바로잡았습니다. ‘보물 창고들’은 אֹצָרוֹת의 저장 장소 의미를 문맥상 자연스럽게 살립니다.
  issues:
