theological_decisions:
- issue: 족보 절의 관계 표현을 얼마나 직접적으로 살릴 것인가
  chosen_reading: 가계 분파를 가리키는 관계를 유지하되, 한국어에서는 ‘에게 속한’으로 자연화했습니다.
  alternative_readings:
  - 엘리에셀의 형제들은
  - 엘리에셀에게서 난 형제들은
  rationale: 본문의 핵심은 개인들의 단순 나열이 아니라 엘리에셀 계열의 분파를 따라 이어지는 족보이므로, 관계 표지를 약화시키지 않으면서도 자연스럽게 읽히는 표현을 택했습니다.
  doctrine_reference: 족보 본문 해석 원칙
