translation:
  language: ko
  text: 그리고 엘리에셀에게 속한 그의 형제들은 레하브야 그의 아들[a], 그리고 이사야 그의 아들, 그리고 요람 그의 아들, 그리고 지그리 그의 아들, 그리고 슬로밋 그의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘엘리에셀의 형제들’입니다. 이 히브리어 구성은 엘리에셀 계열의 분파를 도입하는 표현일 가능성이 큽니다.
    reason: lexical_alternative
