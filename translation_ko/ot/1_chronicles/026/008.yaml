  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
  footnotes:
  - marker: a
    text: Or 'their kinsmen' for 'their brothers,' if the term is taken more broadly for male relatives within the clan.
    reason: lexical_alternative
  - marker: b
    text: '''Able men'' translates a Hebrew expression that can also mean ''men of valor'' or ''valiant men''; here it likely emphasizes capable, strong men fit for temple duty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 모두 오벳-에돔의 아들들에서 나온 자들입니다. 그들과 그들의 아들들과 그들의 형제들은, 일에 능한 자들로서 그 일에 쓸 힘을 지녔으니—오벳-에돔에게 속한 자가 육십이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 문맥상 남성 친족 전체를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘일에 능한 자들’은 ‘용맹한 자들’ 또는 ‘유능한 자들’의 뉘앙스를 가질 수 있으며, 여기서는 직무에 적합한 능력을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  english_pob_choice: from the sons of
  chosen_korean: 아들들에서 나온 자들
  alternatives_korean:
  - 아들들로부터
  - 아들들 중에서
  lexicon: HALOT
  rationale: מִן + בְּנֵי는 단순 소속보다 출처·가계 계열을 나타내므로, 한국어에서는 혈통적 기원을 드러내는 표현으로 옮겼습니다.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  english_pob_choice: they and their sons and their brothers
  chosen_korean: 그들과 그들의 아들들과 그들의 형제들
  alternatives_korean:
  - 그들, 그들의 아들들, 그리고 그들의 친족들
  lexicon: HALOT
  rationale: אחים의 기본값인 ‘형제들’을 유지해 원문이 말하는 남성 친족 범위를 지나치게 넓히지 않았습니다.
- source_word: אִישׁ חַיִל
  english_pob_choice: able men
  chosen_korean: 일에 능한 자들
  alternatives_korean:
  - 유능한 자들
  - 용맹한 자들
  lexicon: HALOT
  rationale: 이 표현은 전투적 ‘용사’보다 직무 수행에 적합한 능력과 힘을 강조하므로, 성전 봉사 맥락에 맞게 ‘일에 능한 자들’로 옮겼습니다.
- source_word: לַעֲבֹדָה
  english_pob_choice: for the service
  chosen_korean: 그 일에
  alternatives_korean:
  - 봉사를 위해
  - 직무를 위해
  lexicon: HALOT
  rationale: 역대기에서의 봉사·직무를 가리키지만, 본절은 이미 앞의 능력 표현과 결합되므로 중복을 줄이되 의미를 보존하는 방향으로 처리했습니다.
- source_word: לְעֹבֵד אֱדֹם
  english_pob_choice: belonging to Obed-edom
  chosen_korean: 오벳-에돔에게 속한 자
  alternatives_korean:
  - 오벳-에돔의 사람
  - 오벳-에돔에게 속한
  lexicon: HALOT
  rationale: 마지막 לְ는 전체 수를 오벳-에돔 가문에 귀속시키는 관계 표지이므로, 총계의 소속을 한국어에서 분명히 했습니다.
theological_decisions:
- issue: 이름 표기와 가문 소속의 전달
  chosen_reading: 오벳-에돔을 고유명사로 유지하고, 마지막 귀속 표현을 통해 가문 단위를 분명히 드러냈습니다.
  alternative_readings:
  - 오벳에돔
  - 오벳-에돔의
  rationale: 본문은 개인 이름이 아니라 특정 가문/집안의 인원 총계를 말하므로, 한국어에서 소속 관계를 명시하는 것이 원문의 행정적·족보적 기능을 가장 잘 전달합니다.
  doctrine_reference: 역대기 족보·성전 직무 문맥
