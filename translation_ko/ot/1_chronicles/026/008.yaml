  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
  footnotes:
  - marker: a
    text: Or 'their kinsmen' for 'their brothers,' if the term is taken more broadly for male relatives within the clan.
    reason: lexical_alternative
  - marker: b
    text: '''Able men'' translates a Hebrew expression that can also mean ''men of valor'' or ''valiant men''; here it likely emphasizes capable, strong men fit for temple duty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 모두 오벧에돔의 자손들, 곧 그들과 그들의 아들들과 그들의 형제들[a]로서, 봉사할 힘을 지닌 유능한 사람들[b]이었습니다. 오벧에돔에게 속한 이들은 모두 예순두 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 문맥에 따라 그 가문 안의 남성 친족들을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유능한 사람들’은 히브리어 표현을 옮긴 것으로, ‘용맹한 사람들’ 또는 ‘능력 있는 사람들’로도 번역할 수 있습니다. 여기서는 봉사 직무에 적합한 역량과 힘을 강조합니다.
    reason: lexical_alternative
