    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  english_pob_choice: From the wars
  chosen_korean: 전쟁들에서
  alternatives_korean:
  - 전투들에서
  - 전쟁으로부터
  lexicon: HALOT
  rationale: מִן은 출처를 나타내므로 ‘~에서’로 옮겼고, מִלְחָמוֹת의 복수성을 살려 ‘전쟁들’로 번역했습니다.
- source_word: וּמִן הַשָּׁלָל
  english_pob_choice: and from the spoil
  chosen_korean: 노략물에서
  alternatives_korean:
  - 전리품에서
