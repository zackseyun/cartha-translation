  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'from the battles and from the plunder they dedicated [them].' The Hebrew leaves the object unstated, and 'spoil' may also be rendered 'plunder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 전쟁들에서와 노략물에서 그들이 야훼의 집을 강하게 하려고 그것들을 바쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투들에서와 노략물에서 그들이 그것들을 바쳤습니다.’ 히브리어는 목적어를 생략하며, שָׁלָל은 ‘노략물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  english_pob_choice: From the wars
  chosen_korean: 전쟁들에서
  alternatives_korean:
  - 전투들에서
  - 전쟁으로부터
  lexicon: HALOT
  rationale: מִן은 출처를 나타내므로 ‘~에서’로 옮겼고, מִלְחָמוֹת의 복수성을 살려 ‘전쟁들’로 번역했습니다.
- source_word: וּמִן הַשָּׁלָל
  english_pob_choice: and from the spoil
  chosen_korean: 노략물에서
  alternatives_korean:
  - 전리품에서
  - 약탈물에서
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁에서 얻은 전리품을 가리키므로, 군사적 맥락을 분명히 하는 ‘노략물’로 옮겼습니다.
- source_word: הִקְדִּישׁוּ
  english_pob_choice: they had dedicated things
  chosen_korean: 그들이 … 바쳤습니다
  alternatives_korean:
  - 그들이 … 봉헌했습니다
  - 그들이 … 성별했습니다
  lexicon: HALOT
  rationale: הקדיש의 핵심은 무언가를 하나님께 구별해 바치는 것이므로 ‘바치다’로 옮겼고, 히브리어에서 생략된 목적어는 문맥상 ‘그것들’로 드러냈습니다.
- source_word: לְחַזֵּק
  english_pob_choice: to strengthen
  chosen_korean: 강하게 하려고
  alternatives_korean:
  - 보강하려고
  - 튼튼하게 하려고
  lexicon: HALOT
  rationale: לְחַזֵּק은 ‘강하게 하다, 견고하게 하다’의 뜻이므로, 성전 유지 문맥을 살려 자연스러운 목적 표현으로 옮겼습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: בַּיִת + 야훼는 성전을 가리키는 관용구이지만, 본문의 직유를 보존하기 위해 ‘야훼의 집’으로 유지했습니다.
theological_decisions:
- issue: 야훼(יְהוָה) 표기
  chosen_reading: 본문의 언약명은 ‘야훼’로 옮깁니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 Tetragrammaton이 직접 나오므로, POB 원칙에 따라 고유한 언약명을 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
