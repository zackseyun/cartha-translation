  lexicon: HALOT
  rationale: שָׁלָל은 전쟁에서 얻은 전리품을 가리키므로, 군사적 맥락을 분명히 하는 ‘노략물’로 옮겼습니다.
- source_word: הִקְדִּישׁוּ
  english_pob_choice: they had dedicated things
  chosen_korean: 그들이 … 바쳤습니다
  alternatives_korean:
  - 그들이 … 봉헌했습니다
  - 그들이 … 성별했습니다
  lexicon: HALOT
  rationale: הקדיש의 핵심은 무언가를 하나님께 구별해 바치는 것이므로 ‘바치다’로 옮겼고, 히브리어에서 생략된 목적어는 문맥상 ‘그것들’로 드러냈습니다.
- source_word: לְחַזֵּק
  english_pob_choice: to strengthen
  chosen_korean: 강하게 하려고
  alternatives_korean:
  - 보강하려고
  - 튼튼하게 하려고
  lexicon: HALOT
  rationale: לְחַזֵּק은 ‘강하게 하다, 견고하게 하다’의 뜻이므로, 성전 유지 문맥을 살려 자연스러운 목적 표현으로 옮겼습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: בַּיִת + 야훼는 성전을 가리키는 관용구이지만, 본문의 직유를 보존하기 위해 ‘야훼의 집’으로 유지했습니다.
theological_decisions:
