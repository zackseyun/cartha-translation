  text: 암미엘은 여섯째이고, 잇사갈은 일곱째이며, 페울레타이는 여덟째였습니다. 이는 하나님께서 그에게 복을 주셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
