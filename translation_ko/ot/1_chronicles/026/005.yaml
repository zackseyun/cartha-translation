theological_decisions:
- issue: ‘그’를 가리키는 대상
  chosen_reading: ‘그’는 앞 문맥의 오벧에돔을 가리킵니다.
  alternative_readings:
  - 가문 전체를 가리키는 일반 지시일 수 있습니다.
  rationale: 바로 앞뒤 문맥이 오벧에돔의 아들들과 후손을 열거하므로, 축복의 대상은 그 가문을 낳은 인물 오벧에돔으로 이해하는 것이 가장 자연스럽습니다.
