    text: 또는 “하나님께서 그에게 복을 주셨기 때문이다”로 옮길 수 있습니다. 히브리어는 이유를 나타내는 접속사와 “복을 주셨다”라는 동사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
