translation:
  language: ko
  text: 아미엘은 여섯째이고, 잇사갈은 일곱째이며, 페울레다이는 여덟째였습니다. 하나님께서 그를 복 주셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 그를 복 주셨기 때문에’로 옮길 수 있습니다. 히브리어 접속사와 동사는 영어의 과거완료보다 더 직접적으로 번역할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּיאֵל
  english_pob_choice: Ammiel
  chosen_korean: 아미엘
  alternatives_korean:
  - 암미엘
  lexicon: 고유명사
  rationale: 히브리어 고유명사는 음역하되, 현대 한국어 표기에서는 원어의 자음·모음 흐름을 반영해 아미엘로 옮겼습니다.
- source_word: הַשִּׁשִּׁי / הַשְּׁבִיעִי / הַשְּׁמִינִי
  english_pob_choice: the sixth / the seventh / the eighth
  chosen_korean: 여섯째 / 일곱째 / 여덟째
  alternatives_korean:
  - 제6 / 제7 / 제8
  lexicon: 서수
  rationale: 가문 내 출생 순서를 나타내는 서수이므로, 문어체에서 자연스러운 ‘-째’ 표현으로 순서를 그대로 살렸습니다.
- source_word: פְּעֻלְּתַי
  english_pob_choice: Peullethai
  chosen_korean: 페울레다이
  alternatives_korean:
  - 페울테이
  - 페울라이
  lexicon: 고유명사
  rationale: 이름의 자음 중복과 모음 흐름을 가능한 한 반영해 음역했으며, 영어 POB의 풀린 음가를 한국어로 자연스럽게 재현했습니다.
- source_word: כִּי
  english_pob_choice: for
  chosen_korean: -기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - for
  lexicon: HALOT
  rationale: 이 접속사는 앞의 목록에 대한 설명 근거를 제시하므로, 한국어에서는 이유절로 풀어 주는 것이 가장 자연스럽습니다.
- source_word: בֵרֲכוֹ
  english_pob_choice: had blessed him
  chosen_korean: 그를 복 주셨습니다
  alternatives_korean:
  - 그를 축복하셨습니다
  - 그를 복 주셨었기 때문입니다
  lexicon: HALOT
  rationale: 동사의 의미를 ‘복 주다’로 직접 옮겨 히브리어의 축복 행위를 드러냈고, 과거완료의 뉘앙스는 한국어에서 과도하게 강조하지 않았습니다.
theological_decisions:
- issue: ‘그’를 가리키는 대상
  chosen_reading: ‘그’는 앞 문맥의 오벧에돔을 가리킵니다.
  alternative_readings:
  - 가문 전체를 가리키는 일반 지시일 수 있습니다.
  rationale: 바로 앞뒤 문맥이 오벧에돔의 아들들과 후손을 열거하므로, 축복의 대상은 그 가문을 낳은 인물 오벧에돔으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥적 지시 해석
