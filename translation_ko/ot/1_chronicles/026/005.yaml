  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
  footnotes:
  - marker: a
    text: Or 'because God blessed him.' The Hebrew conjunction and verb can be rendered more directly without the English past perfect.
