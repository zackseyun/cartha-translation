    rationale: 원문은 그나냐와 그의 아들들을 명시합니다. ‘그 사람’은 지시 대상도 불명확하여 본문의 핵심 정보를 손상합니다.
  - severity: medium
    issue: ‘관리와 재판의 직무’가 원문의 복수 직함을 추상적 업무로 바꿉니다.
    rationale: 전치사 ל은 이들이 관리와 재판관으로 수행한 역할을 나타냅니다. 직함을 유지해야 의미와 병렬성이 보존됩니다.
