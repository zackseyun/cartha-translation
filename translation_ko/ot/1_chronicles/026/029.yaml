language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/יִּצְהָרִ֞י כְּנַנְיָ֣הוּ וּ/בָנָ֗י/ו לַ/מְּלָאכָ֤ה הַ/חִֽיצוֹנָה֙ עַל יִשְׂרָאֵ֔ל לְ/שֹׁטְרִ֖ים וּ/לְ/שֹׁפְטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
  footnotes:
  - marker: a
    text: Or 'outside work'—that is, duties outside the central sanctuary service, likely administrative and judicial responsibilities among Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스할 사람들에게는 그나냐와 그의 아들들이 이스라엘을 맡아 외부 업무[a]를 하며 관리와 재판관으로 섬겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바깥 일’. 성소 중심 봉사 밖의 업무를 가리키며, 이스라엘 가운데의 행정 및 재판 책임을 포함했을 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  english_pob_choice: For the Izharites
  chosen_korean: 이사갈 사람들에게는
  alternatives_korean:
  - 이사갈 자손들에게는
  - 이사갈 사람들에 대하여는
  lexicon: HALOT
  rationale: 씨족 표지를 한국어에서 자연스럽게 풀어, 목록의 범주 도입 기능을 살리면서도 문맥상 귀속 대상을 분명히 했습니다.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  english_pob_choice: the outside work
  chosen_korean: 외부 일
  alternatives_korean:
  - 바깥 일
  - 외적인 일
  lexicon: HALOT
  rationale: 산당/성소 내부 봉사와 대비되는 ‘바깥쪽’ 업무를 간결하게 드러내되, 현대 한국어에서 지나치게 생소한 직역을 피했습니다.
- source_word: לְשֹׁטְרִים וּלְשֹׁפְטִים
  english_pob_choice: as officers and judges
  chosen_korean: 관리와 재판의 직무
  alternatives_korean:
  - 관리들과 재판관들로
  - 관리자와 심판자로
  lexicon: HALOT
  rationale: שֹׁטְרִים과 שֹׁפְטִים는 여기서 직함 목록이라기보다 이스라엘을 다스리는 행정·사법 기능을 가리키므로, 직무 중심으로 옮겼습니다.
theological_decisions:
- issue: ‘outside work’의 범위가 성소 바깥 행정·사법 책임을 뜻하는지
  chosen_reading: 본문의 ‘외부 일’을 성소 내부 봉사와 구별되는 이스라엘 전반의 행정·재판 업무로 이해해 옮겼습니다.
  alternative_readings:
  - 단순히 ‘바깥 일’로만 옮겨 범위를 열어 두는 해석
  - ‘외적인 봉사’처럼 모호하게 처리하는 해석
  rationale: 영어 POB 주석이 중앙 성소 봉사 밖의 임무, 특히 행정·사법 책임을 시사하므로, 본문 의미를 과도하게 축소하지 않도록 직무 내용을 간단히 덧붙였습니다.
  doctrine_reference: 역대상 26:29의 레위인 임무 분배
- issue: 직함을 그대로 음역하지 않고 기능어로 옮길지
  chosen_reading: ‘관리와 재판의 직무’로 기능을 드러내고, 인물에게 부여된 책임으로 이해했습니다.
  alternative_readings:
  - ‘서기관들과 재판관들’처럼 직함을 직역하는 해석
  - ‘관원과 재판관’으로 직함을 살리는 해석
  rationale: 문맥상 명예 호칭보다 실제 수행 업무가 핵심이므로, 독자가 본문의 행정적 의미를 즉시 파악하도록 기능어를 택했습니다.
  doctrine_reference: 레위 지파의 공적 봉사와 공동체 질서
