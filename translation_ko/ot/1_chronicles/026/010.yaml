  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/חֹסָ֥ה מִן בְּנֵי מְרָרִ֖י בָּנִ֑ים שִׁמְרִ֤י הָ/רֹאשׁ֙ כִּ֣י לֹא הָיָ֣ה בְכ֔וֹר וַ/יְשִׂימֵ֥/הוּ אָבִ֖י/הוּ לְ/רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
  footnotes:
  - marker: a
    text: Or "for he was not the firstborn"; the Hebrew conjunction can be read as explanatory as well as concessive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므라리의 자손 중 호사에게는 아들들이 있었습니다. 쉬므리가 우두머리였는데, 그는 맏아들이 아니었습니다. 그의 아버지가 그를 우두머리로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 맏아들이 아니었기 때문입니다”; 히브리어 접속사는 설명적으로도, 양보적으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְחֹסָה
  english_pob_choice: And Hosah
  chosen_korean: 그리고 호사에게는
  alternatives_korean:
  - 그리고 호사는
  - 호사에게
  lexicon: HALOT
  rationale: 문맥상 계보 목록을 이어 주는 접속과 소유/귀속의 ל를 자연스럽게 살려, ‘호사에게는’으로 인물 도입을 처리했습니다.
- source_word: מִן בְּנֵי מְרָרִי
  english_pob_choice: from the sons of Merari
  chosen_korean: 므라리의 자손 중
  alternatives_korean:
  - 므라리의 아들들 가운데
  - 므라리 자손에게서
  lexicon: HALOT
  rationale: 혈연 집단 소속을 나타내는 표현이므로, 계보적 관계를 드러내는 ‘자손 중’으로 옮겼습니다.
- source_word: הָרֹאשׁ
  english_pob_choice: the chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 지도자
  - 머리
  lexicon: HALOT
  rationale: 이 단어는 신체 부위가 아니라 서열·책임의 우두머리라는 뜻이므로, 현대 한국어에서 자연스러운 ‘우두머리’로 옮겼습니다.
- source_word: כִּי לֹא הָיָה בְכוֹר
  english_pob_choice: though he was not the firstborn
  chosen_korean: 그는 맏아들이 아니었습니다
  alternatives_korean:
  - 그는 첫째 아들이 아니었습니다
  - 그가 맏아들이 아니었기 때문입니다
  lexicon: HALOT
  rationale: 여기서는 서열 역전의 대비가 핵심이므로, ‘though’에 해당하는 뉘앙스를 한국어 본문에서는 앞뒤 문장으로 자연스럽게 드러내고, 핵심 정보인 ‘맏아들’만 간결하게 살렸습니다.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  english_pob_choice: his father made him chief
  chosen_korean: 그의 아버지가 그를 우두머리로 세웠습니다
  alternatives_korean:
  - 그의 아버지가 그를 우두머리로 임명했습니다
  - 그의 아버지가 그를 머리로 삼았습니다
  lexicon: HALOT
  rationale: שׂים + ל의 임명/지정 의미를 살려 ‘세웠습니다’로 옮겼고, 앞의 ‘우두머리’와 어휘 연결도 유지했습니다.
theological_decisions:
- issue: ‘firstborn’과 ‘chief’의 대비를 어떻게 드러낼지
  chosen_reading: 맏아들이 아니었지만 아버지의 지정으로 우두머리가 되었다는 대비를 유지했습니다.
  alternative_readings:
  - 맏아들이 아니었기 때문에 아버지가 우두머리로 세웠다
  - 맏아들이 아니었으나 아버지가 그를 우두머리로 세웠다
  rationale: 히브리어 כִּי는 설명적일 수도, 양보적일 수도 있으므로, 본문이 전하는 역설적 서열 전환을 과도하게 해석하지 않으면서 보존했습니다.
  doctrine_reference: 역사-서술 문맥의 서열/임명 표현
