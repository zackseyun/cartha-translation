revisions:
- from: 그리고 셰마야의 아들들에게는 아들들이 태어났는데, 그들은 자기 아버지의 집을 다스리는 자들이었습니다. 그들은 용맹한 용사들이었기 때문입니다.[a][b]
  to: 그의 아들 셰마야에게도 아들들이 태어났습니다. 그 아들들은 자기 아버지의 집안[a]을 다스리는 이들이었으니, 용맹하고 유능한 사람들이었습니다.[b]
  rationale: 셰마야를 앞 절 인물의 단수 ‘아들’로 바로잡아 원문의 족보 관계를 보존했습니다. ‘아버지의 집안’은 בֵית אָב의 가문 단위를 자연스럽게 전달하며, ‘용맹하고 유능한 사람들’은 גִּבּוֹרֵי חַיִל의 폭을 유지합니다. 각주 표지도 해당 어구에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:48Z'
