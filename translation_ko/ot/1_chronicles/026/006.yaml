    rationale: 이 관용구는 군사적 용맹을 포함할 수 있으나 힘과 검증된 능력을 지닌 사람들을 넓게 가리킬 수도 있습니다. 이 목록 문맥에서는 중립적 표현이 더 안전합니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 함께 놓여 있어 각각의 대체 표현이 가리키는 본문 어구가 불분명합니다.
    rationale: ‘아버지의 집안’과 ‘용맹하고 유능한 사람들’ 뒤에 각각 표지를 두어 각주 앵커를 명확히 해야 합니다.
