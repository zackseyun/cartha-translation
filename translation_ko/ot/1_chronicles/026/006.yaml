  verdict: revise
  source_fidelity: 수정이 필요합니다. וְלִשְׁמַעְיָה בְנוֹ는 ‘셰마야의 아들들에게’가 아니라, 앞 절의 인물의 아들인 ‘그의 아들 셰마야에게도’라는 뜻입니다. 또한 לְבֵית אֲבִיהֶם은 혈연·가문 단위의 ‘아버지의 집안’을 가리키며, ‘용맹한 용사들’은 גִּבּוֹרֵי חַיִל의 가능한 군사적 뉘앙스를 지나치게 한정합니다.
  naturalness: ‘그의 아들 셰마야에게도 아들들이 태어났습니다’는 계보 문맥에서 자연스럽고 현대 표준어 합쇼체에 맞습니다. 이어지는 관계절은 ‘그 아들들은 자기 아버지의 집안을 다스리는 이들이었으니’로 명료하게 연결됩니다.
  terminology: 셰마야는 통용 표기를 유지했습니다. בֵית אָב는 ‘아버지의 집안’으로 옮겨 물리적 건물이 아닌 가문 단위임을 드러냈습니다. גִּבּוֹרֵי חַיִל는 문맥상 군인으로 단정하지 않고 ‘용맹하고 유능한 사람들’로 번역하며, 각주에서 표현의 폭을 밝혔습니다.
  issues:
  - severity: high
    issue: ‘그리고 셰마야의 아들들에게’는 בְנוֹ(그의 아들)를 복수 ‘아들들’로 바꾸고, 셰마야가 앞 인물의 아들임을 소실합니다.
    rationale: 히브리어는 ‘그리고 그의 아들 셰마야에게’라는 출생 공식의 도입부입니다. 이 오류는 족보 관계를 바꿉니다.
  - severity: medium
