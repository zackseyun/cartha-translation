source:
  edition: WLC
  text: וְ/לִֽ/שְׁמַֽעְיָ֤ה בְנ/וֹ֙ נוֹלַ֣ד בָּנִ֔ים הַ/מִּמְשָׁלִ֖ים לְ/בֵ֣ית אֲבִי/הֶ֑ם כִּֽי גִבּ֥וֹרֵי חַ֖יִל הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
  footnotes:
  - marker: a
    text: Or 'who were rulers over their ancestral households.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase 'mighty men of valor' can also denote men of proven strength, competence, or standing, not only battlefield warriors.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셰마야의 아들들에게는 아들들이 태어났는데, 그들은 자기 아버지의 집을 다스리는 자들이었습니다. 그들은 용맹한 용사들이었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 조상 가문을 다스리는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘용맹한 용사들’은 전투 용맹만이 아니라 입증된 힘, 능력, 위상도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  english_pob_choice: And to Shemaiah his son
  chosen_korean: 그리고 셰마야의 아들들에게
  alternatives_korean:
  - 그리고 셰마야의 아들에게
  - 그리고 셰마야에게
  lexicon: HALOT
  rationale: 여기서 לְ는 계보 문맥의 도입 표지로 읽히며, בן의 소유격은 한국어 소유 표현으로 자연스럽게 옮겼습니다. 다만 본문 흐름상 ‘아들들에게’가 다음 출생 진술과 더 매끄럽게 연결됩니다.
- source_word: נוֹלַד בָּנִים
  english_pob_choice: sons were born
  chosen_korean: 아들들이 태어났는데
  alternatives_korean:
  - 아들들이 태어났습니다
  - 아들들이 태어났습니다
  lexicon: HALOT
  rationale: 히브리어는 단수 형태의 수동 동사를 쓰지만 의미상 복수 출생 진술입니다. 한국어에서는 ‘태어났는데’로 자연스럽게 살리되, 계보 목록의 연결감을 유지했습니다.
- source_word: הַמִּמְשָׁלִים
  english_pob_choice: who ruled over
  chosen_korean: 그들은 ...을 다스리는 자들이었습니다
  alternatives_korean:
  - 그들이 다스렸습니다
  - 그들은 통치자들이었습니다
  lexicon: HALOT
  rationale: מָשַׁל의 핵심은 단순한 직함보다 실제로 다스리는 행위입니다. 한국어에서는 관형적 표현보다 서술적으로 옮겨 통치의 기능을 분명히 했습니다.
- source_word: לְבֵית אֲבִיהֶם
  english_pob_choice: their fathers’ house
  chosen_korean: 자기 아버지의 집
  alternatives_korean:
  - 그들의 아버지들의 집
  - 그들의 조상 집
  lexicon: HALOT
  rationale: בית אב은 가문/가족 단위를 가리키므로 ‘집’으로 직역하되, 한국어에서는 단수형 ‘아버지의 집’이 구조를 가장 자연스럽게 드러냅니다.
- source_word: גִּבּוֹרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 유능하고 강한 사람들
  lexicon: HALOT
  rationale: 이 관용구는 군사적 용맹뿐 아니라 입증된 능력과 위상을 포함할 수 있으나, 문맥상 ‘용사’가 힘과 담대함을 함께 전달합니다.
theological_decisions:
- issue: 문장 말미의 이유절 כִּי의 기능
  chosen_reading: “그들은 용맹한 용사들이었기 때문입니다”로 원인-결과 관계를 분명히 살렸습니다.
  alternative_readings:
  - “왜냐하면 그들은 용맹한 용사들이었습니다”
  - “이는 그들이 용맹한 용사들이었기 때문입니다”
  rationale: 본문은 그들이 집을 다스린 이유를 제시하므로, 단순 설명보다 인과 관계를 드러내는 번역이 더 정확합니다.
  doctrine_reference: 문맥상 통치 자격을 설명하는 서술문
- issue: 가계 단위인 בֵית אֲבִיהֶם의 번역
  chosen_reading: ‘아버지의 집’을 유지하되 한국어에서는 가문/가족 단위를 뜻하는 표현으로 읽히게 했습니다.
  alternative_readings:
  - ‘그들의 조상의 집’
  - ‘그들의 가문’
  rationale: 문자적으로는 ‘집’이지만, 성경 히브리어에서 이는 혈연 집단을 뜻하므로 지나치게 추상화하지 않고 본문의 사회구조를 살렸습니다.
  doctrine_reference: 이스라엘 족보/가문 구조 이해
