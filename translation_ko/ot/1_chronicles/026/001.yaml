  lexicon: standard transliteration
  rationale: 인명은 현행 음역 관례에 따라 옮겼고, בן 구조는 직접적인 친자 관계를 살려 '아들'로 번역했습니다.
theological_decisions:
- issue: 레위 직무 목록을 표제처럼 제시하는 서술 방식
  chosen_reading: 이 절은 본문 설명문이 아니라 분반 표제를 여는 문장으로 읽어 '문지기들의 분반은 이러합니다'라고 옮겼습니다.
  alternative_readings:
  - '''문지기들의 분반을 위하여''로 직역'
  - '''문지기들의 분반에 관하여''로 완화'
  rationale: 히브리어의 전치사 ל- 반복은 목록 서두의 표제 기능을 강하게 띠므로, 한국어에서도 행정적·목록적 기능이 드러나게 했습니다.
  doctrine_reference: 성전 봉사 조직과 레위 직무에 대한 역사서의 서술 방식
