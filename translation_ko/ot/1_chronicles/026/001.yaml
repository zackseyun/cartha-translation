  lexicon: HALOT
  rationale: 문맥상 명사구가 표제처럼 분반 목록을 여는 역할을 하므로, 한국어에서는 자연스러운 표제문으로 옮겼습니다.
- source_word: לְשֹׁעֲרִ֑ים
