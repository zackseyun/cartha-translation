  lexicon: HALOT
  rationale: שֹׁעֲרִים는 성문을 지키는 사람들을 가리키므로, 현대 한국어에서는 기능을 살린 '문지기들'이 가장 직접적입니다.
- source_word: לַ/קָּרְחִ֕ים
  english_pob_choice: of the Korahites
  chosen_korean: 고라 자손 가운데서는
