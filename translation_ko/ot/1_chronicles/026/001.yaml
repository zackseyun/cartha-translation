  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
  footnotes:
  - marker: a
    text: Or, 'According to the divisions of the gatekeepers.' The opening phrase functions like a section heading introducing the gatekeeper divisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지기들의 분반은 이러합니다. 고라 자손 가운데서는 므셀레먀의 아들 코레와, 아삽의 아들들 가운데서도 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '문지기들의 분반에 따라.' 이 첫 구절은 문지기 분반을 소개하는 표제처럼 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְק֖וֹת
  english_pob_choice: For the divisions
  chosen_korean: 분반은 이러합니다
  alternatives_korean:
