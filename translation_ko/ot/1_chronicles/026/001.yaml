  rationale: 이 항목은 문지기 분반 중 고라 계열을 지목하므로, 혈통/소속을 분명히 하는 '고라 자손 가운데서는'로 처리했습니다.
- source_word: מְשֶׁלֶמְיָ֥הוּ בֶן קֹרֵ֖א
  english_pob_choice: Meshelemiah son of Kore
  chosen_korean: 므셀레먀의 아들 코레
  alternatives_korean:
  - 메셀레미야의 아들 코레
  - 메셀레먀의 아들 고레
  lexicon: standard transliteration
  rationale: 인명은 현행 음역 관례에 따라 옮겼고, בן 구조는 직접적인 친자 관계를 살려 '아들'로 번역했습니다.
theological_decisions:
