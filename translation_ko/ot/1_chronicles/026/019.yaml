translation:
  language: ko
  text: 이것은 고라 자손과 므라리 자손을 위한 문지기들의 분반입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These were
  chosen_korean: 이것은
  alternatives_korean:
  - 이들은
  - 이것들은
  lexicon: HALOT
  rationale: 목록을 요약하는 지시어로 자연스럽게 처리하되, 한국어에서는 서술어 없이 시작하는 문장보다 ‘이것은’이 문장 흐름에 더 적합합니다.
- source_word: מַחְלְקוֹת
  english_pob_choice: divisions
  chosen_korean: 분반
  alternatives_korean:
  - 구분
  - 조직
  - 반
  lexicon: HALOT
  rationale: 성전 봉사와 관련된 조직적 배치를 드러내는 말이므로, 단순한 ‘구분’보다 ‘분반’이 분배된 직무 단위를 더 잘 살립니다.
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 성문 지키는 이들
  - 문을 지키는 자들
  lexicon: HALOT
  rationale: 성전 문을 지키는 사람들을 뜻하므로 ‘문지기들’이 가장 간결하고 의미를 유지합니다.
- source_word: לִבְנֵי ... וְלִבְנֵי
  english_pob_choice: for the sons of ... and for the sons of ...
  chosen_korean: 고라 자손과 므라리 자손을 위한
  alternatives_korean:
  - 고라 자손과 므라리 자손에게 속한
  - 고라 자손과 므라리 자손에 대한
  lexicon: HALOT
  rationale: 히브리어의 לְ는 배정/소속의 뉘앙스를 가지므로 ‘...을 위한’으로 옮겨 분배 대상임을 살렸습니다.
