reference: 1 Chronicles 26:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַֽ/חֶבְרוֹנִי֙ יְרִיָּ֣ה הָ/רֹ֔אשׁ לַֽ/חֶבְרוֹנִ֥י לְ/תֹלְדֹתָ֖י/ו לְ/אָב֑וֹת בִּ/שְׁנַ֨ת הָֽ/אַרְבָּעִ֜ים לְ/מַלְכ֤וּת דָּוִיד֙ נִדְרָ֔שׁוּ וַ/יִּמָּצֵ֥א בָ/הֶ֛ם גִּבּ֥וֹרֵי חַ֖יִל בְּ/יַעְזֵ֥יר גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
  footnotes:
  - marker: a
    text: Or 'As for the Hebronites, Jeriah was the head.'
    reason: lexical_alternative
  - marker: b
    text: '''Fathers’ houses'' is a clan term referring to ancestral household groupings, not merely nuclear families.'
    reason: cultural_note
  - marker: c
    text: Or 'mighty warriors' or 'capable men'; the Hebrew phrase can denote men distinguished by strength, valor, or proven ability.
    reason: lexical_alternative
translation:
  language: ko
  text: 헤브론 사람들에게서는[a] 여리야가 헤브론 사람들의 우두머리였습니다. 그는 조상 집안별로 내려오는 자기 نسل의 계통에 따라 그 우두머리였습니다. 다윗의 통치 제사십 년에 그들이 조사되었고, 그들 가운데서 기백이 있는 용사들이 길르앗의 야셀에서 발견되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤브론 사람들로 말하자면, 여리야가 그 우두머리였다.’
    reason: alternative_reading
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  english_pob_choice: For the Hebronites / of the Hebronites
  chosen_korean: 헤브론 사람들에게서 / 헤브론 사람들의
  alternatives_korean:
  - 헤브론 사람들을 위하여
  - 헤브론 사람들로부터
  lexicon: HALOT
  rationale: 문맥상 레위 계열 집단을 도입하는 표지이므로, 관계를 드러내는 “헤브론 사람들”로 옮기되 첫 절은 담화 표지 느낌을 살려 ‘-에게서는’으로 처리했습니다.
- source_word: הָרֹאשׁ
  english_pob_choice: was the chief
  chosen_korean: 우두머리
  alternatives_korean:
  - 머리
  - 지도자
  - 수장
  lexicon: HALOT
  rationale: 행정·계보 문맥에서 רֹאשׁ는 단순한 신체 ‘머리’가 아니라 집단의 대표/수장을 뜻하므로, 현대 한국어에서 자연스러운 ‘우두머리’로 옮겼습니다.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  english_pob_choice: according to his generations by fathers’ houses
  chosen_korean: 조상 집안별로 내려오는 자기 نسل의 계통에 따라
  alternatives_korean:
  - 그의 세대들에 따라 조상 집안별로
  - 족장 가문들에 따른 계통에 따라
  lexicon: HALOT
  rationale: תֹלְדֹת은 단순한 ‘가문’보다 출생·계보의 흐름을 강조하므로 ‘계통’으로, לְאָבוֹת는 clan 단위의 기술어라 ‘조상 집안별로’로 살렸습니다. English audit의 cultural note에 맞춰 핵가족이 아니라 친족 단위를 나타내도록 했습니다.
- source_word: נִדְרָשׁוּ
  english_pob_choice: they were sought out
  chosen_korean: 조사되었고
  alternatives_korean:
  - 찾아졌고
  - 탐문되었고
  - 조회되었고
  lexicon: HALOT
  rationale: 수동형의 공적 조회/조사를 가리키므로, 행정적 뉘앙스를 살리는 ‘조사되다’가 가장 무난합니다.
- source_word: גִּבּוֹרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 기백이 있는 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 무용의 용사들
  - 큰 용사들
  lexicon: HALOT
  rationale: 이 관용구는 군사적 용맹만이 아니라 탁월한 능력과 기개를 아울러 가리킬 수 있어, 지나치게 전쟁 중심으로 좁히지 않도록 ‘기백이 있는 용사들’로 옮겼습니다.
theological_decisions:
- issue: 다윗 통치 제40년의 연대 표기
  chosen_reading: ‘다윗의 통치 제사십 년’으로 직역해 왕권의 공식 연대 표기를 드러냈습니다.
  alternative_readings:
  - 다윗의 즉위 40년
  - 다윗이 다스린 지 사십 년
  rationale: 본문은 통치 기간을 기록하는 연대문이므로, 의미를 풀어 쓰기보다 문서적 형식을 보존하는 편이 더 충실합니다.
  doctrine_reference: 역대기 계보/행정 기록의 문체 보존
