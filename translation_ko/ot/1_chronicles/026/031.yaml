  source_fidelity: 수정이 필요합니다. 초안에는 히브리어 본문에 없는 아랍 문자 ‘نسل’이 삽입되어 있고, ‘그는 … 그 우두머리였습니다’라는 중복 서술이 원문의 한 문장 구조를 부자연스럽게 확장합니다. לְתֹלְדֹתָיו לְאָבוֹת는 여리야/헤브론 계열의 계보 및 조상 집안(부계 친족 단위)에 따른 구분을 나타내므로 이를 간결하게 유지했습니다. נִדְרָשׁוּ의 수동적 공식 조사 의미와 וַיִּמָּצֵא의 발견 표현도 보존했습니다.
  naturalness: ‘헤브론 사람들에게서는’, ‘자기 … 계통’, ‘기백이 있는 용사들’, ‘통치 제사십 년’은 현대 표준어 합쇼체 성경 문체로 매끄럽지 않거나 의미가 겹칩니다. ‘헤브론 사람들에 관해서는’, ‘그의 계보와 조상 집안에 따라’, ‘용맹한 사람들’, ‘다윗의 통치 사십 년째’로 다듬으면 자연스럽고 격식 있는 표현이 됩니다.
  terminology: ‘헤브론 사람들’은 본문 문맥상 지명 주민 일반이라기보다 레위인 헤브론 계열을 가리키므로 주석으로 보완했습니다. אָבוֹת의 기술적 친족 단위는 ‘조상 집안’으로 옮기고 설명 주석을 달았습니다. גִּבּוֹרֵי חַיִל은 문맥상 군사 직함으로 단정하지 않고 ‘용맹한 사람들’로 번역했습니다.
