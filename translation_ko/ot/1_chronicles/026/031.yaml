revisions:
- from: 헤브론 사람들에게서는[a] 여리야가 헤브론 사람들의 우두머리였습니다. 그는 조상 집안별로 내려오는 자기 نسل의 계통에 따라 그 우두머리였습니다. 다윗의 통치 제사십 년에 그들이 조사되었고, 그들 가운데서 기백이 있는 용사들이 길르앗의 야셀에서 발견되었습니다.
  to: 헤브론 사람들에 관해서는[a] 여리야가 그의 계보와 조상 집안에 따라 헤브론 사람들의 우두머리였습니다.[b] 다윗의 통치 사십 년째에 그들에 대한 조사가 이루어졌고, 길르앗의 야셀에서 그들 가운데 용맹한 사람들이 발견되었습니다.[c]
  rationale: 불필요한 외국어 삽입과 중복 문장을 제거하고, 원문의 계보·부계 친족 단위 한정을 한 문장 안에 보존했습니다. 공식적인 조사와 발견이라는 수동 표현을 유지했으며, 지명·인명은 한국어 성경에서 통용되는 ‘여리야’, ‘길르앗’, ‘야셀’ 표기를 사용했습니다.
  reviewer_model: gpt-5.6-terra
