base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
  footnotes:
  - marker: a
    text: Or 'a wise counselor.' The Hebrew phrase literally describes Zekaryahu as 'a counselor with insight/prudence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 동쪽 제비는 셀레먀후에게 떨어졌습니다. 그다음에 그의 아들 스가랴[a], 곧 통찰력 있는 조언자가 되도록 제비를 뽑았고, 그의 제비는 북쪽으로 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분별 있는 조언자’. 히브리어 구는 직역하면 ‘통찰/분별이 있는 조언자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  english_pob_choice: The lot ... fell
  chosen_korean: 제비는 … 떨어졌습니다
  alternatives_korean:
  - 제비가 … 배정되었습니다
  - 제비가 … 나왔습니다
  lexicon: HALOT
  rationale: נפל + גורל의 관용구를 한국어에서도 ‘떨어지다’로 살려, 제비 뽑기의 구체적 이미지를 유지했습니다.
- source_word: מִזְרָחָה
  english_pob_choice: for the east
  chosen_korean: 동쪽
  alternatives_korean:
  - 동쪽을 위하여
  - 동쪽으로
  lexicon: HALOT
  rationale: 방향 표시는 이 구절에서 배정된 구역을 뜻하므로, 간결한 명사형 ‘동쪽’으로 옮겼습니다.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  english_pob_choice: a counselor with insight
  chosen_korean: 통찰력 있는 조언자
  alternatives_korean:
  - 분별 있는 조언자
  - 지혜로운 조언자
  - 통찰 있는 자문자
  lexicon: HALOT
  rationale: יוֹעֵץ는 ‘조언자’로, בְּשֶׂכֶל은 통찰·분별을 뜻하므로 두 요소를 함께 드러내는 표현을 택했습니다.
- source_word: וַיֵּצֵא גוֹרָלֹו
  english_pob_choice: his lot came out
  chosen_korean: 그의 제비는 북쪽으로 나왔습니다
  alternatives_korean:
  - 그의 제비가 북쪽으로 떨어졌습니다
  - 그의 제비가 북쪽으로 나왔습니다
  lexicon: HALOT
  rationale: יצא + גורל은 결과가 ‘나오다’는 뜻이 자연스러우므로, 앞의 ‘떨어지다’와 구별되게 옮겼습니다.
theological_decisions:
- issue: 신명 감정 및 직설적 표현의 유지 여부
  chosen_reading: 본문의 제비 배정 구조를 그대로 살려, 인간적 분배 행위로 읽히는 서술을 유지했습니다.
  alternative_readings:
  - 하나님의 섭리로 제비가 정해졌다고 해석을 덧붙이는 방식
  - 배정되었다고 완곡하게 정리하는 방식
  rationale: 이 절은 제사장/문지기 직무 배분의 역사 서술이므로, 본문이 말하는 제비 뽑기 절차를 덧붙임 없이 드러내는 것이 적절합니다.
  doctrine_reference: 섭리와 인간 행위의 서술적 긴장
