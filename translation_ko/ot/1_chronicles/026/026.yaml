source:
  edition: WLC
  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
  footnotes:
  - marker: a
    text: Or 'the sacred things' or 'the dedicated gifts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heads of the fathers’ houses,' a clan-based administrative term.
    reason: cultural_note
translation:
  language: ko
  text: 스헬로못과 그의 형제들은 다윗 왕과, 조상의 가문들의 우두머리들과, 천인과 백인의 지휘관들과, 군대의 지휘관들이 구별하여 바친 모든 거룩한 것의 곳간을 맡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘곳간’은 여기서 물품을 보관하는 창고/금고의 뜻입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: שְׁלֹמוֹת
  english_pob_choice: Shelomoth
  chosen_korean: 스헬로못
  alternatives_korean:
  - 셀로못
  - 셸로못
  lexicon: 고유명사 음역
  rationale: 고유명사는 의미번역하지 않고 현대 한국어 음역으로 옮겼습니다. 영어 POB의 Shelomoth를 한국어 표기법에 맞게 처리했습니다.
- source_word: וְאֶחָי/ו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 형제들 및 친족들
  - 그의 형제들
  lexicon: HALOT
  rationale: 히브리어 אָח는 여기서 레위 계열의 남성 친족/동료를 가리키지만, 직접적 의미를 살려 '형제들'로 옮겼습니다.
- source_word: עַל כָּל אֹצְרוֹת
  english_pob_choice: were over all the treasuries
  chosen_korean: 모든 거룩한 것의 곳간을 맡았습니다
  alternatives_korean:
  - 모든 곳간을 관리했습니다
  - 모든 보관소를 맡았습니다
  lexicon: HALOT
  rationale: עַל은 관리·감독의 뜻이므로 '맡다'로 자연스럽게 옮겼고, אֹצָר의 기관적 의미를 살려 '곳간'으로 표현했습니다.
- source_word: הַקֳּדָשִׁים
  english_pob_choice: of the holy things
  chosen_korean: 거룩한 것
  alternatives_korean:
  - 거룩한 물건
  - 성물
  lexicon: HALOT
  rationale: 이 표현은 헌납되어 거룩하게 된 물품들을 가리키므로, 전통적 교회용어인 '성물'보다 원문의 범위를 드러내는 '거룩한 것'을 택했습니다.
- source_word: אֲשֶׁר הִקְדִּישׁ
  english_pob_choice: that ... had dedicated
  chosen_korean: 구별하여 바친
  alternatives_korean:
  - 헌납한
  - 성별하여 바친
  lexicon: HALOT
  rationale: הִקְדִּישׁ는 구별하여 거룩하게 하다/헌납하다의 뜻이므로, 두 의미를 함께 살리는 '구별하여 바치다'를 선택했습니다.
- source_word: רָאשֵׁי הָאָבוֹת
  english_pob_choice: the heads of the fathers’ houses
  chosen_korean: 조상의 가문들의 우두머리들
  alternatives_korean:
  - 족장들
  - 아버지들의 집의 우두머리들
  lexicon: HALOT
  rationale: 히브리어의 친족-행정 용어를 한국어 독자가 이해할 수 있게 하면서도 구조를 유지하기 위해 직역에 가까운 표현을 사용했습니다.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  english_pob_choice: the commanders of thousands and of hundreds
  chosen_korean: 천인과 백인의 지휘관들
  alternatives_korean:
  - 천 명과 백 명의 지휘관들
  - 천부장들과 백부장들
  lexicon: HALOT
  rationale: 히브리어의 조직 단위를 드러내면서도 한국어로 자연스럽게 읽히도록 수사적 단위명으로 옮겼습니다.
- source_word: שָׂרֵי הַצָּבָא
  english_pob_choice: the commanders of the army
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군 지휘관들
  - 군대의 장관들
  lexicon: HALOT
  rationale: צָבָא는 여기서 하늘 군대가 아니라 실제 군사 조직을 가리키므로 '군대'로 옮겼습니다.
theological_decisions:
- issue: 누가 거룩한 것들을 바쳤는가
  chosen_reading: 다윗 왕, 조상의 가문들의 우두머리들, 천인과 백인의 지휘관들, 군대의 지휘관들이 함께 바친 것으로 읽었습니다.
  alternative_readings:
  - 다윗 왕만 바쳤고 뒤의 항목들은 부가 설명일 수 있습니다.
  rationale: 히브리어의 וְ 연결과 영어 POB의 audited reading을 따라, 열거된 집단 전체가 공동 헌납자로 이해되도록 옮겼습니다.
  doctrine_reference: 본문 문맥상의 공동 행위 해석
