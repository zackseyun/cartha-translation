revisions:
- from: 스헬로못과 그의 형제들은 다윗 왕과, 조상의 가문들의 우두머리들과, 천인과 백인의 지휘관들과, 군대의 지휘관들이 구별하여 바친 모든 거룩한 것의 곳간을 맡았습니다.[a]
  to: 셀로못과 그의 형제들은 다윗 왕과 조상 가문의 우두머리들, 천 명 부대와 백 명 부대의 지휘관들, 그리고 군대의 지휘관들이 거룩하게 구별하여 바친 물품들을 보관한 모든 곳간을 맡았습니다.[a]
  rationale: 고유명사를 자연스러운 한국어 음역으로 바로잡고, 군사 단위를 명확히 하였으며, 친족·행정 용어와 헌납 물품의 보관소라는 관계를 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. 열거된 다윗 왕과 모든 집단이 공동으로 물품을 바쳤다는 원문 및 영어 감사 기록의 해석은 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:14:50Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 주어와 행정·군사 직책 열거, 그리고 열거된 모든 집단이 헌납의 주체라는 뜻은 초안에 대체로 반영되었습니다. 그러나 ‘스헬로못’은 한국어 음역으로 부자연스럽고, ‘천인과 백인’은 사람 자체를 가리키는 듯하여 히브리어의 천·백 단위 부대 지휘 체계를 충분히 드러내지 못합니다. 또한 ‘거룩한 것의 곳간’은 한국어 구성으로 다소 어색합니다.
  naturalness: ‘조상의 가문들의 우두머리들’은 중첩된 복수 표현으로 현대 표준어에서 부자연스럽습니다. ‘조상 가문의 우두머리들’로 고치고, 보관 대상과 곳간의 관계를 ‘거룩하게 구별하여 바친 물품들을 보관한 모든 곳간’으로 풀어 쓰면 자연스럽고 원문의 의미도 유지됩니다.
  terminology: שְׁלֹמוֹת은 ‘셀로못’으로 음역하는 것이 자연스럽습니다. רָאשֵׁי הָאָבוֹת는 친족·행정상의 기술 용어이므로 ‘조상 가문의 우두머리들’ 및 주석으로 처리합니다. הַקֳּדָשִׁים은 특정 교단의 ‘성물’이라는 용어를 강제하지 않고 ‘거룩하게 구별하여 바친 물품들’로 번역합니다.
  issues:
  - severity: medium
    issue: 고유명사 ‘스헬로못’의 음역
    rationale: 히브리어 שְׁלֹמוֹת 및 영어 Shelomoth에 비추어 ‘스헬로못’의 어두 ‘스’는 근거가 약하고 한국어에서 부자연스럽습니다. ‘셀로못’이 더 적절합니다.
  - severity: medium
    issue: ‘천인과 백인의 지휘관들’
    rationale: 이는 천 명인 사람과 백 명인 사람의 지휘관이라는 뜻으로도 읽힙니다. 원문의 군사 편제 단위를 드러내도록 ‘천 명 부대와 백 명 부대의 지휘관들’로 옮기는 편이 정확합니다.
  - severity: medium
    issue: ‘조상의 가문들의 우두머리들’의 부자연스러운 중첩
    rationale: אָבוֹת의 친족·행정적 의미는 유지하되 ‘조상 가문의 우두머리들’로 다듬는 것이 자연스럽습니다.
  - severity: low
    issue: ‘거룩한 것의 곳간’의 한국어 구성
    rationale: 원문의 ‘거룩한 것들의 곳간’이라는 관계를 자연스러운 한국어로 나타내기 위해, 헌납된 물품을 보관하는 곳간이라는 뜻을 풀어 쓰는 것이 좋습니다.
  revised_text: 셀로못과 그의 형제들은 다윗 왕과 조상 가문의 우두머리들, 천 명 부대와 백 명 부대의 지휘관들, 그리고 군대의 지휘관들이 거룩하게 구별하여 바친 물품들을 보관한 모든 곳간을 맡았습니다.[a]
