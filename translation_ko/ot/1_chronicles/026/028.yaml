base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
  footnotes:
  - marker: a
    text: Or 'was in the charge of Shelomith and his brothers.'
    reason: lexical_alternative
  - marker: b
    text: '''Seer'' is the Hebrew title רֹאֶה, an older term for a prophetic figure.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 사무엘 선견자와 기스의 아들 사울과 넬의 아들 아브넬과 스루야의 아들 요압이 바친 것과—곧 누구든지 바친 모든 것—은 슬로밋과 그의 형제들의 관리 아래 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬로밋과 그의 형제들의 관할 아래 있었습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘선견자’는 히브리어 직함 רֹאֶה를 옮긴 말로, 더 오래된 예언자 호칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  english_pob_choice: And all
  chosen_korean: 그리고 … 모든 것
  alternatives_korean:
  - 그리고 … 전부
  - 그리고 … 모두
  lexicon: HALOT
  rationale: כֹל의 총괄성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘모든 것’으로 옮겼습니다.
- source_word: הַהִקְדִּישׁ / הַמַּקְדִּישׁ
  english_pob_choice: had dedicated / anyone had dedicated
  chosen_korean: 바친 것 / 바친 모든 것
  alternatives_korean:
  - 헌납한 것
  - 성별한 것
  lexicon: HALOT
  rationale: קדשׁ의 헌납·전용 의미를 문맥상 분명하게 드러내되, 교회적 용어로 굳어지지 않도록 ‘바치다’를 선택했습니다.
- source_word: שְׁמוּאֵל הָרֹאֶה
  english_pob_choice: Samuel the seer
  chosen_korean: 사무엘 선견자
  alternatives_korean:
  - 사무엘 예언자
  - 사무엘 보는 자
  lexicon: HALOT
  rationale: רֹאֶה는 예언자 일반어보다 더 고풍스러운 직함이므로, 그 뉘앙스를 살려 ‘선견자’로 옮겼습니다.
- source_word: עַל יַד
  english_pob_choice: was under the care of
  chosen_korean: 관리 아래 있었습니다
  alternatives_korean:
  - 맡겨져 있었습니다
  - 감독 아래 있었습니다
  - 관할 아래 있었습니다
  lexicon: HALOT
  rationale: 행정적·관리적 관용구로서의 뜻을 반영해, 소유보다 관리 책임을 드러내는 표현을 택했습니다.
