  rationale: 이 절은 성소 봉사의 구역 배정을 말하므로, 제비의 결과라는 문맥을 드러내는 것이 본문의 기능을 가장 잘 전달합니다.
  doctrine_reference: 공동체 질서와 배정(민수기 26장, 역대기 26장 맥락)
