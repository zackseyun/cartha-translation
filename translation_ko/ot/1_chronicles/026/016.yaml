  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
  footnotes:
  - marker: a
    text: Or possibly 'the Gate of Casting Out'; 'Shallecheth' is likely a proper gate name derived from a verb meaning 'to cast out' or 'throw down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 수빔과 호사에게는 서쪽이 제비로 돌아갔는데, 올라가는 큰길에 있는 셀레겟 문과 마주한 곳이었습니다. 보초가 서로 마주 보도록 배치되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘셀레겟’은 고유 지명으로 보이지만, 어원적으로는 ‘내던지다/쫓아내다’와 관련된 뜻에서 나온 이름일 가능성이 있습니다.
    reason: lexical_alternative
