  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
  footnotes:
  - marker: a
    text: Or possibly 'the Gate of Casting Out'; 'Shallecheth' is likely a proper gate name derived from a verb meaning 'to cast out' or 'throw down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 수빔과 호사에게는, 올라가는 큰길에 있는 셀레겟[a] 문과 함께 서쪽이 제비로 돌아갔습니다. 보초는 보초와 마주하도록 배치되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘셀레겟’은 고유한 문 이름으로 보입니다. 이 이름은 어원적으로 ‘내던지다’ 또는 ‘쫓아내다’라는 뜻과 관련되었을 가능성이 있습니다.
    reason: lexical_alternative
