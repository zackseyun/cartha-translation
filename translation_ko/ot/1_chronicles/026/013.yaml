    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ
  english_pob_choice: they cast
  chosen_korean: 제비를 뽑았습니다
  alternatives_korean:
  - 제비를 떨어뜨렸습니다
  - 제비를 던졌습니다
  lexicon: HALOT
  rationale: 히필형과 'גוֹרָל'의 결합은 관용적으로 ‘제비를 뽑다’를 뜻하므로, 한국어에서도 자연스럽고 본문 의미를 직접 드러내는 표현을 선택했습니다.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  english_pob_choice: the small and the great alike
  chosen_korean: 작은 사람과 큰 사람이나 다름없이
  alternatives_korean:
  - 작은 자와 큰 자가 다름없이
  - 작은 사람과 큰 사람 모두
  lexicon: HALOT
  rationale: 지위나 규모의 구별 없이 동등하게 포함된다는 점을 살리기 위해 직역적이면서도 한국어로 자연스러운 대구를 유지했습니다.
- source_word: לְבֵית אֲבוֹתָם
  english_pob_choice: according to their fathers’ houses
  chosen_korean: 그들의 조상 집안에 따라
  alternatives_korean:
  - 그들의 아버지 집안에 따라
  - 그들의 족속에 따라
  lexicon: HALOT
  rationale: 가문/씨족 단위의 분류를 가리키므로, 직역의 어감을 유지하면서도 한국어에서 이해되는 ‘조상 집안’으로 옮겼습니다.
- source_word: לְשַׁעַר וָשָׁעַר
  english_pob_choice: for each gate
  chosen_korean: 각 문을 위해
  alternatives_korean:
  - 문마다
  - 문마다 각각
  lexicon: HALOT
  rationale: 반복된 단수형이 분배적 의미를 내므로, ‘각 문’으로 옮겨 문별 배정을 드러냈습니다.
theological_decisions:
- issue: 분배의 공정성 강조
  chosen_reading: 작은 사람과 큰 사람이나 다름없이 동일하게 제비를 뽑은 것으로 표현했습니다.
  alternative_readings:
  - 그들 모두 제비를 뽑았습니다
  - 신분에 상관없이 제비를 뽑았습니다
  rationale: 본문의 대구는 제비 뽑기의 공평성을 강조하므로, 해석을 과도하게 덧붙이지 않으면서도 그 함의를 한국어에서 분명히 드러냈습니다.
  doctrine_reference: 민수기 26장과 1역대기 24–26장의 제비 뽑기 전통
- issue: 반복 구조의 분배적 의미
  chosen_reading: ‘각 문’을 택해 히브리어의 반복된 단수형이 문마다의 배정을 뜻함을 살렸습니다.
  alternative_readings:
  - 문마다
  - 각각의 문
  rationale: 직역을 넘지 않으면서도 반복이 주는 분배적 강조를 유지하기 위한 선택입니다.
  doctrine_reference: 히브리어 수사법의 분배적 반복
