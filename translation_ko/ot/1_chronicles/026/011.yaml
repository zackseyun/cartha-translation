  text: 힐기야는 둘째요, 드발랴는 셋째요, 스가랴는 넷째입니다. 호사의 아들과 형제[a]는 모두 열세 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족’. ‘형제’에 해당하는 말은 호사의 집안에 속한 남자 친족들을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
