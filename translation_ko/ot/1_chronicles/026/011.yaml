language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חִלְקִיָּ֤הוּ הַ/שֵּׁנִי֙ טְבַלְיָ֣הוּ הַ/שְּׁלִשִׁ֔י זְכַרְיָ֖הוּ הָ/רְבִעִ֑י כָּל בָּנִ֧ים וְ/אַחִ֛ים לְ/חֹסָ֖ה שְׁלֹשָׁ֥ה עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/011.yaml
  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
  footnotes:
  - marker: a
    text: Or possibly 'kinsmen' for 'brothers,' if the term is taken more broadly for male relatives within Hosah's clan.
    reason: lexical_alternative
translation:
  language: ko
  text: 힐기야는 둘째요, 테발야는 셋째요, 스가랴는 넷째입니다. 호사의 모든 아들과 형제는 열세 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 이 단어를 더 넓게 보면 ‘친족’으로 볼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  english_pob_choice: Hilkiah
  chosen_korean: 힐기야
  alternatives_korean:
  - 힐키야
  - 힐기야후
  lexicon: 고유명사
  rationale: 인명은 한국어에서 통용되는 음역을 따르되, 히브리어 어미 -후를 임의로 살리지 않고 자연스러운 표기를 택했습니다.
- source_word: הַשֵּׁנִי / הַשְּׁלִשִׁי / הָרְבִעִי
  english_pob_choice: the second / the third / the fourth
  chosen_korean: 둘째 / 셋째 / 넷째
  alternatives_korean:
  - 두 번째 / 세 번째 / 네 번째
  lexicon: 서수사
  rationale: 족보 목록의 순번 표시는 한국어에서도 간결한 서수 표현으로 옮기는 것이 가장 직접적입니다.
- source_word: טְבַלְיָהוּ
  english_pob_choice: Tebaliah
  chosen_korean: 테발야
  alternatives_korean:
  - 테발리야
  - 테발야후
  lexicon: 고유명사
  rationale: 이름은 영어 POB의 표준 음역을 참고하되, 한국어 외래어 표기 관행에 맞게 옮겼습니다.
- source_word: זְכַרְיָהוּ
  english_pob_choice: Zechariah
  chosen_korean: 스가랴
  alternatives_korean:
  - 스카랴
  - 스가리아
  lexicon: 고유명사
  rationale: 성경에서 널리 굳어진 한국어 인명 형태를 사용했습니다.
- source_word: בָּנִים וְאַחִים
  english_pob_choice: sons and brothers
  chosen_korean: 아들과 형제
  alternatives_korean:
  - 아들들과 형제들
  - 자녀들과 형제들
  - 친족
  lexicon: HALOT
  rationale: 히브리어 본문을 따라 남성형 친족 호칭을 유지했습니다. 영어 POB의 각주처럼 '형제'를 더 넓은 친족으로 이해할 가능성은 있지만, 본문은 그 좁은 표기를 직접적으로 말합니다.
- source_word: שְׁלֹשָׁה עָשָׂר
  english_pob_choice: thirteen
  chosen_korean: 열세 명
  alternatives_korean:
  - 열셋
  lexicon: HALOT
  rationale: 총원을 가리키는 수량이므로 한국어에서는 사람을 세는 표현인 '명'을 덧붙여 자연스럽게 옮겼습니다.
theological_decisions:
- issue: וְאַחִים의 범위
  chosen_reading: 문맥상 기본값은 '형제'로 두되, 친족 전체를 포괄할 가능성은 본문 자체로는 열어 둡니다.
  alternative_readings:
  - 친족
  - 남자 친척
  rationale: 영어 POB 각주가 지적하듯 해당 단어는 혈족 집단 전체를 가리킬 수 있으나, 여기서는 족보/목록 문맥에서 가장 직접적인 의미를 유지하는 것이 우선입니다.
  doctrine_reference: 본문-문맥 우선 원칙
