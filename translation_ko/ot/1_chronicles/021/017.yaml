  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
  footnotes:
  - marker: a
    text: Or 'I said to count the people' / 'I commanded that the people be numbered.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'these sheep,' a metaphor for the people.
    reason: cultural_note
  - marker: c
    text: Or 'let your hand be upon me and upon my father’s house.' 'Hand' is a Hebrew idiom for power or judgment.
    reason: lexical_alternative
  - marker: d
    text: Or 'but not on your people with a plague.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다윗이 하나님께 말했습니다. “백성을 계수하라고 말한 사람이 바로 제가 아니었습니까?[a] 죄를 지은 사람도, 크게 악을 행한 사람도 바로 저입니다. 그러나 이 양들[b]은 무엇을 했습니까? 오 야훼, 나의 하나님, 부디 주의 손[c]이 저와 제 아버지의 집에 임하게 하시되, 주의 백성에게는 전염병[d]이 내리지 않게 하소서.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘백성을 계수하라고 내가 말하지 않았습니까?’라고 합니다.
    reason: source_note
  - marker: b
    text: ‘양들’은 백성을 가리키는 은유입니다.
    reason: cultural_note
  - marker: c
    text: ‘손’은 여기서 심판이나 권능을 뜻하는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘역병’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָוִיד אֶל הָאֱלֹהִים
  english_pob_choice: Then David said to God
  chosen_korean: 그러자 다윗이 하나님께 말했습니다
  alternatives_korean:
  - 그때 다윗이 하나님께 말씀드렸습니다
  - 다윗이 하나님께 말했습니다
  lexicon: HALOT
  rationale: 직접 대화 장면을 자연스러운 현대 한국어 서술로 옮기되, 하나님께 향한 발화임을 분명히 하기 위해 '-께 말했습니다'를 사용했습니다.
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  english_pob_choice: Was it not I who ordered the people to be counted?
  chosen_korean: 백성을 계수하라고 말한 사람이 바로 저가 아니었습니까?
  alternatives_korean:
  - 제가 백성을 계수하라고 지시하지 않았습니까?
  - 제가 백성을 계수하라고 말하지 않았습니까?
  lexicon: HALOT
  rationale: 히브리어의 문자적 구조인 '계수하도록 말했다'를 살리면서, 문맥상 다윗의 주도적 지시를 한국어에서 자연스럽게 드러내기 위해 '계수하라고 말한 사람'으로 옮겼습니다.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי וְהָרֵעַ הֲרֵעוֹתִי
  english_pob_choice: I am the one who has sinned and done great evil
  chosen_korean: 죄를 지은 사람도, 크게 악을 행한 사람도 바로 저입니다
  alternatives_korean:
  - 제가 죄를 지었고 몹시 악하게 행했습니다
  - 죄를 지은 것도, 크게 악을 행한 것도 바로 저입니다
  lexicon: HALOT
  rationale: 강조 구문을 살려 책임의 초점을 분명히 하면서, 반복과 격화를 한국어의 평행 표현으로 옮겼습니다. '크게 악을 행하다'는 אינפינитив absolute의 강도를 반영합니다.
- source_word: הַצֹּאן מֶה עָשׂוּ
  english_pob_choice: these sheep—what have they done?
  chosen_korean: 그러나 이 양들은 무슨 죄가 있습니까?
  alternatives_korean:
  - 그러나 이 양들은 무엇을 했습니까?
  - 그러나 이 양들은 무슨 일을 했습니까?
  lexicon: HALOT
  rationale: '''양''은 백성을 가리키는 은유이므로 그대로 살리되, 질문의 요지를 한국어에서 자연스러운 무죄 호소로 전달했습니다.'
- source_word: יְהוָה אֱלֹהַי
  english_pob_choice: O Yahweh my God
  chosen_korean: 오 야훼 나의 하나님
  alternatives_korean:
  - 오 야훼, 나의 하나님
  - 오 주 나의 하나님
  lexicon: HALOT
  rationale: יהוה는 본문 원형을 따라 '야훼'로 옮기고, 소유격 표현은 직역에 가까운 '나의 하나님'으로 유지했습니다.
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  english_pob_choice: please let your hand be against me and against my father’s house
  chosen_korean: 제발 주의 손이 저와 제 아버지의 집에 임하게 하시되
  alternatives_korean:
  - 제발 주의 손이 저와 제 아버지의 집 위에 있게 하시되
  - 제발 주의 손을 저와 제 아버지의 집에 대하시되
  lexicon: HALOT
  rationale: '''손''은 심판/권능의 관용구이므로 그대로 보존하되, 한국어에서는 ''임하게 하시되''로 압박과 영향의 의미를 자연스럽게 드러냈습니다.'
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  english_pob_choice: but not against your people for a plague
  chosen_korean: 주의 백성에게는 재앙이 내리지 않게 하소서
  alternatives_korean:
  - 주의 백성에게는 역병이 닥치지 않게 하소서
  - 주의 백성에게는 재앙으로 가지 않게 하소서
  lexicon: HALOT
  rationale: מַגֵּפָה는 문맥상 재앙/역병 모두 가능하나, 문장의 호소 목적을 살려 일반화된 '재앙'으로 번역했습니다.
theological_decisions:
- issue: יהוה의 번역과 다윗의 직접 호소문 어조
  chosen_reading: '''야훼''를 유지하고, 다윗의 간청은 ''제발 ... 하소서''로 정중한 기도체를 사용했습니다.'
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 고유한 이름을 직접 사용하므로, 대체 칭호보다 음역을 보존하는 것이 원문 가시성을 높입니다. 또한 왕의 회개 기도라는 문맥에 맞게 한국어 기도체를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
