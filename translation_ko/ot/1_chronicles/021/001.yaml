id: 1CH.21.1
reference: 1 Chronicles 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעֲמֹ֥ד שָׂטָ֖ן עַל יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת֙ אֶת דָּוִ֔יד לִ/מְנ֖וֹת אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
  footnotes:
  - marker: a
    text: Or 'an adversary.' The Hebrew word satan can mean 'adversary' or function as the personal name/title 'Satan.'
    reason: lexical_alternative
  - marker: b
    text: 2 Samuel 24:1 attributes the incitement to the LORD's anger against Israel. Chronicles presents Satan as the immediate agent, preserving a theological tension rather than flattening either account.
    reason: cross_reference
translation:
  language: ko
  text: 그때 사탄이 이스라엘을 거슬러 일어나 다윗을 부추겨 이스라엘을 계수하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대적’. 히브리어 שָׂטָן은 일반적으로 ‘대적’을 뜻할 수도 있고, 인격적 존재의 이름이나 칭호로 쓰일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 사무엘하 24:1은 여호와의 이스라엘을 향한 진노가 다윗을 부추긴 것으로 서술합니다. 역대기는 사탄을 직접 행위자로 제시하여, 두 본문 사이의 신학적 긴장을 그대로 남겨 둡니다.
    reason: cross_reference
lexical_decisions:
- source_word: שָׂטָן
  english_pob_choice: Satan
  chosen_korean: 사탄
  alternatives_korean:
  - 대적
  - 고발자
  lexicon: HALOT
  rationale: 이 문맥에서는 일반 명사적 의미보다 인격적 존재를 가리키는 이름/칭호로 읽는 것이 자연스러워, POB의 'Satan'을 따라 '사탄'으로 옮겼습니다. '대적'은 가능한 어휘 뜻이지만 본문이 지시하는 고유한 존재감을 약화시킵니다.
- source_word: וַיַּעֲמֹד ... עַל
  english_pob_choice: stood up against
  chosen_korean: 거슬러 일어나
  alternatives_korean:
  - 맞서 일어나
  - 대적하여 서다
  lexicon: HALOT
  rationale: 동사 עמד의 ‘서다/자리를 잡다’와 전치사 עַל의 적대적 방향을 함께 살려, 단순히 ‘일어나다’보다 적대적으로 행동을 개시하는 뉘앙스를 담았습니다.
- source_word: וַיָּסֶת
  english_pob_choice: incited
  chosen_korean: 부추겨
  alternatives_korean:
  - 선동하여
  - 충동하여
  - 재촉하여
  lexicon: HALOT
  rationale: 히필 형태의 ‘유도하다, 선동하다, 부추기다’라는 의미를 자연스러운 현대 한국어로 옮겼습니다. ‘부추기다’는 강제보다 유혹적 촉발을 잘 드러냅니다.
- source_word: לִמְנוֹת
  english_pob_choice: to count
  chosen_korean: 계수하게
  alternatives_korean:
  - 세게 하게
  - 인구를 조사하게
  - 헤아리게
  lexicon: HALOT
  rationale: 히브리어의 간단한 ‘세다/계수하다’를 보존해, 해석을 덧붙인 ‘인구 조사’보다 원문에 더 가까운 표현을 택했습니다.
theological_decisions:
- issue: 사탄의 정체와 2사무엘 24:1과의 긴장
  chosen_reading: 본문의 직접 행위자는 사탄으로 두되, 본문이 다른 전승의 설명을 흡수해 단순화하지 않도록 했습니다.
  alternative_readings:
  - 야훼의 분노를 배경 원인으로 읽음
  - 사탄을 일반적인 '대적'으로 완화함
  rationale: 역대기는 사탄을 즉각적 행위자로 제시하여 2사무엘 24:1과의 긴장을 유지합니다. 번역은 그 긴장을 지우지 않고 본문이 말하는 표면적 서술을 그대로 드러내야 합니다.
  doctrine_reference: 원문 우선, 정경적 긴장 보존
