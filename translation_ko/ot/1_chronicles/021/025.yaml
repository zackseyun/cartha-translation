base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
  footnotes:
  - marker: a
    text: The parallel in 2 Samuel 24:24 mentions fifty shekels of silver; Chronicles here reads six hundred shekels of gold, likely reflecting a different scope of purchase or textual tradition.
    reason: cross_reference
translation:
  language: ko
  text: 다윗은 그곳의 값으로 오르난에게 금 육백 세겔을 달아 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 평행본문인 사무엘하 24:24에는 은 오십 세겔이 언급되지만, 역대기는 여기서 금 육백 세겔을 기록합니다. 이는 구입 범위의 차이나 별도의 본문 전승을 반영한 것일 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 지불했습니다
  - 내주었습니다
  lexicon: HALOT
  rationale: 'נתן의 기본 의미인 ‘주다’를 살리되, 매매 맥락이 분명하므로 한국어에서는 자연스럽게 ‘주었습니다’로 옮겼습니다. '
- source_word: לְאָרְנָן
  english_pob_choice: Ornan
  chosen_korean: 오르난에게
  alternatives_korean:
  - 아라우나에게
  lexicon: 고유명사
  rationale: 히브리어 본문에 있는 이름은 오르난이므로, 사무엘서 평행본문의 아라우나로 바꾸지 않고 본문형을 유지했습니다.
- source_word: בַּ/מָּק֑וֹם
  english_pob_choice: for the place
  chosen_korean: 그곳을 위하여
  alternatives_korean:
  - 그 장소를 위하여
  - 그 자리를 위하여
  lexicon: HALOT
  rationale: מָקוֹם은 ‘장소/곳’을 뜻하므로, 구매 대상이 단순한 물건이 아니라 그 장소 자체임을 드러내도록 자연스러운 ‘그곳을 위하여’로 옮겼습니다.
- source_word: שִׁקְלֵ֣י זָהָ֔ב מִשְׁקָ֖ל
  english_pob_choice: six hundred shekels of gold by weight
  chosen_korean: 금 육백 세겔을 무게대로
  alternatives_korean:
  - 무게로 잰 금 육백 세겔을
  - 금 육백 세겔을 중량대로
  lexicon: HALOT
  rationale: ‘세겔’이라는 고대 중량 단위를 유지하고, מִשְׁקָל의 뜻을 살려 ‘무게대로’라고 밝혔습니다.
theological_decisions:
- issue: 역대기와 사무엘하의 매입 금액 차이
  chosen_reading: 역대기의 본문대로 ‘금 육백 세겔’을 그대로 유지했습니다.
  alternative_readings:
  - 사무엘하 24:24의 더 적은 금액과 조화시키는 번역
  rationale: 번역은 역대기 히브리 본문이 실제로 말하는 수치를 대표해야 하므로, 평행본문과의 차이를 본문 안에서 해소하지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
