    text: ‘산당’은 히브리어 바마를 옮긴 말로, 제의가 행해지는 ‘높은 곳’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכַּן
  english_pob_choice: tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 제의적 맥락에서 모세가 만든 성소를 가리키므로, 한국어 성경에서 확립된 ‘성막’이 가장 정확하고 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙대로 신명사 יְהוָה는 경칭 대체어가 아니라 고유명으로 옮겨 ‘야훼’를 사용했습니다.
- source_word: מִזְבַּח הָעוֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제 드리는 제단
  lexicon: HALOT
  rationale: 관용적이면서도 제의적 기능을 분명히 드러내는 한국어 성경 용례를 따라 ‘번제단’으로 압축했습니다.
- source_word: בַּבָּמָה
  english_pob_choice: on the high place
  chosen_korean: 높은 곳
  alternatives_korean:
  - 산당
  - 높은 장소
  lexicon: HALOT
  rationale: 문맥상 지명적·제의적 위치를 나타내는 표현이므로, 본문이 말하는 물리적 위치를 살리되 현대 한국어로는 ‘높은 곳’이 가장 직접적입니다.
theological_decisions:
- issue: 이 문장의 도입부 기능
  chosen_reading: ‘이때’로 옮겨 앞선 서술과 연결되는 배경 설명을 살렸습니다.
  alternative_readings:
  - 그리고
  - 그때
  rationale: 히브리어 וּ는 단순 접속을 넘어 서술 전환과 배경 제시 기능을 함께 하므로, 현대 한국어 서술에 맞는 ‘이때’가 가장 적절합니다.
  doctrine_reference: 서사 연결 표현의 기능 보존
