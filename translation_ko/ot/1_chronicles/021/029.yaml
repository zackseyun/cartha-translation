  text: Now the tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: ko
  text: 그때 모세가 광야에서 만든 야훼의 성막과 번제단은 기브온의 산당에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
