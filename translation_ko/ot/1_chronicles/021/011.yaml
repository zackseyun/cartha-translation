  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
  footnotes:
  - marker: a
    text: Or more literally, “Accept for yourself—”; the sense in context is an instruction to choose among the options stated in the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 갓이 다윗에게 와서 그에게 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘스스로 선택하십시오[a]—’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, “스스로 받아들이십시오—”입니다. 문맥상 이는 다음 절에 제시되는 여러 선택지 가운데 하나를 선택하라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 이르러
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서, 다윗을 향해 이동해 오는 장면의 방향성을 유지했습니다.
- source_word: וַיֹּאמֶר לוֹ
  english_pob_choice: said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 말하였습니다
  - 그에게 이르렀습니다
  lexicon: HALOT
  rationale: אמר의 직접적인 기본 의미를 살려 ‘말했습니다’로 옮겼고, 인칭 대명사 לוֹ는 문맥상 ‘그에게’로 명확히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 대치어가 아니라 고유한 신적 이름으로 보존하는 것이 원문과 POB 감사 기준에 맞으므로 ‘야훼’로 옮겼습니다.
- source_word: קַבֶּל
  english_pob_choice: Choose
  chosen_korean: 선택하여라
  alternatives_korean:
  - 받아라
  - 받으라
  - 선택하라
  lexicon: HALOT
  rationale: 다음 절의 세 가지 선택지를 앞세우는 맥락상 단순한 ‘받아라/받으라’보다 판단을 요구하는 뜻이 살아 있는 ‘선택하여라’가 더 적절합니다. 직역에 가까운 ‘받아라’의 가능성은 영어 감사 주석과 함께 문맥적으로 보존됩니다.
- source_word: לָךְ
  english_pob_choice: for yourself
  chosen_korean: 너 자신을 위해
  alternatives_korean:
  - 너를 위해
  - 스스로
  lexicon: HALOT
  rationale: 명령형과 결합한 목적/이익의 의미를 살려, 다윗 개인의 선택 책임을 드러내는 표현으로 옮겼습니다.
theological_decisions:
