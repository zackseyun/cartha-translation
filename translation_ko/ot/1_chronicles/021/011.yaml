  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
  footnotes:
  - marker: a
    text: Or more literally, “Accept for yourself—”; the sense in context is an instruction to choose among the options stated in the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 갓이 다윗에게 와서 그에게 말했습니다. 「야훼께서 이렇게 말씀하십니다. ‘너 자신을 위해 선택하여라—’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 동사는 다음 절에 제시될 여러 선택지 가운데 하나를 ‘받아들이라/선택하라’는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
