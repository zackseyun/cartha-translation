    rationale: 히브리어 전치사 לְ는 각각 번제와 소제를 위한 용도를 표시합니다. ‘번제에 쓸/소제에 쓸’이 한국어에서 관계를 더 정확히 드러냅니다.
  - severity: low
    issue: הַבָּקָר의 어휘 범위와 히브리어 ‘눈에 좋다’ 관용구의 직역적 뉘앙스가 본문만으로는 보이지 않습니다.
    rationale: 번역문은 자연스럽게 유지하되, 관련 선택지를 각주로 제공하면 원문의 범위와 표현을 투명하게 보존할 수 있습니다.
