  text: וַ/יֹּ֨אמֶר אָרְנָ֤ן אֶל דָּוִיד֙ קַֽח לָ֔/ךְ וְ/יַ֛עַשׂ אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב בְּ/עֵינָ֑י/ו רְאֵה֩ נָתַ֨תִּי הַ/בָּקָ֜ר לָֽ/עֹל֗וֹת וְ/הַ/מּוֹרִגִּ֧ים לָ/עֵצִ֛ים וְ/הַ/חִטִּ֥ים לַ/מִּנְחָ֖ה הַ/כֹּ֥ל נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
  footnotes:
  - marker: a
    text: Or, 'let my lord the king do what seems good to him.' The Hebrew idiom is literally 'what is good in his eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the oxen for burnt offerings.' The Hebrew term can refer broadly to cattle or more specifically to oxen.
    reason: lexical_alternative
  - marker: c
    text: That is, the threshing implements are offered to be used as fuel for the sacrifice.
    reason: cultural_note
  - marker: d
    text: Or 'offering' or 'tribute offering.' In sacrificial contexts, the Hebrew term commonly refers to a grain offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 오르난이 다윗에게 말했습니다. 「받으십시오. 내 주 왕께서는 보시기에 좋은 대로 하십시오. 보십시오, 나는 번제물로 쓸 소를, 나무로 쓸 타작 썰매를, 소제물로 쓸 밀을 드렸습니다. 나는 그것을 모두 드렸습니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לָךְ
  english_pob_choice: Take it for yourself
  chosen_korean: 받으십시오
  alternatives_korean:
  - 가져가십시오
  - 당신을 위해 받으십시오
  lexicon: HALOT
  rationale: 수여·양도 뉘앙스가 이미 뒤의 선물 목록에 분명하므로, 자연스러운 합쇼체 명령형으로 간결하게 옮기되 개인적 수용의 뜻은 문맥으로 살렸습니다.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  english_pob_choice: and let my lord the king do what is good in his eyes
  chosen_korean: 내 주 왕께서는 보시기에 좋은 대로 하십시오
  alternatives_korean:
  - 내 주 왕께서는 그에게 좋게 보이는 대로 하십시오
  - 내 주 왕께서는 옳다고 여기시는 대로 하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘눈에 좋은 것/좋은 대로’를 직접 반영해, 왕의 판단에 맡긴다는 공손한 허락의 뉘앙스를 유지했습니다.
- source_word: הַבָּקָר
  english_pob_choice: the cattle for burnt offerings
  chosen_korean: 번제물로 쓸 소
  alternatives_korean:
  - 번제물로 쓸 가축
  - 번제물로 쓸 소들
  lexicon: HALOT
  rationale: 문맥상 제물로 제공되는 구체적 동물은 소이므로, POB의 공시된 선택보다 더 좁은 한국어 ‘소’로 옮겨 원문 지시성을 분명히 했습니다.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  english_pob_choice: the threshing sledges for wood
  chosen_korean: 나무로 쓸 타작 썰매
  alternatives_korean:
  - 땔나무로 쓸 타작 썰매
  - 연료로 쓸 타작 기구
  lexicon: HALOT
  rationale: 기구 자체가 나무 연료로 전용된다는 점을 살리면서, ‘타작 썰매’로 형태를 구체화하고 ‘나무로 쓸’로 용도를 직역했습니다.
- source_word: הַחִטִּים לַמִּנְחָה
  english_pob_choice: the wheat for the grain offering
  chosen_korean: 소제물로 쓸 밀
  alternatives_korean:
  - 곡식제물로 쓸 밀
  - 곡식 제사로 쓸 밀
  lexicon: HALOT
  rationale: מנחה는 제의 문맥에서 관례적 ‘소제물’이 가장 직접적이어서 이를 택했고, 원재료인 밀을 그대로 유지했습니다.
theological_decisions:
- issue: 제의적 전용의 완결성
  chosen_reading: 오르난은 소·타작 썰매·밀을 각각 번제, 연료, 소제물로 전용해 ‘그것을 모두 드렸습니다’로 총괄합니다.
  alternative_readings:
  - 단순한 물품 기증으로 완화하는 읽기
  - 마지막 절을 재차 강조 없이 축약하는 읽기
  rationale: 원문은 제의적 양도와 전면적 제공을 분명히 하므로, 한국어에서도 일반 기증보다 제사용 전용을 드러내는 표현을 유지했습니다.
  doctrine_reference: 제의 서술의 문자적·서사적 의미 보존
- issue: 공손한 왕실 발화의 존중어
  chosen_reading: 다윗에 대한 오르난의 말투는 왕실 예우를 반영한 합쇼체로 통일했습니다.
  alternative_readings:
  - 친근한 구어체
  - 중세풍 높임말
  rationale: 본문의 courtly address를 현대 표준어의 공손체로 살려, 고어화나 과잉 종교어휘로 의미를 흐리지 않도록 했습니다.
  doctrine_reference: 서사체의 담화 등록 보존
