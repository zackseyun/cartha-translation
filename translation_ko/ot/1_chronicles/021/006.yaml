base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
  footnotes:
  - marker: a
    text: Or 'the king’s word was abhorrent to Joab.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 레위와 베냐민을 그들 가운데에 포함하여 계수하지 않았습니다. 왕의 명령[a]이 요압에게 혐오스러웠기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 말씀이 요압에게 혐오스러웠다’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֵוִי
  english_pob_choice: But Levi
  chosen_korean: 그러나 그는 레위
  alternatives_korean:
  - 그리고 레위
  - 레위는
  lexicon: HALOT
  rationale: 문맥상 앞선 계수 결과와 대비되므로 접속사 וְ를 단순한 ‘그리고’보다 전환을 드러내는 ‘그러나’로 옮기고, 지파명은 표준 음역인 ‘레위’로 옮겼습니다.
- source_word: לֹא פָקַד
  english_pob_choice: did not count
  chosen_korean: 계수하지 않았습니다
  alternatives_korean:
  - 세지 않았습니다
  - 등록하지 않았습니다
  - 소집하지 않았습니다
  lexicon: HALOT
  rationale: 인구 조사 문맥의 פקד는 ‘세다/계수하다’가 가장 직접적이므로 현대 한국어의 공적 문체인 ‘계수하다’를 사용했습니다.
- source_word: בְּ/תוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 사이에
  - 그들 안에
  - 그 가운데
  lexicon: HALOT
  rationale: 레위와 베냐민이 이미 세어진 집단 안에 포함되지 않았다는 뜻을 자연스럽게 드러내는 표현으로 ‘그들 가운데서’를 택했습니다.
- source_word: נִתְעַ֥ב דְּבַר הַ/מֶּ֖לֶךְ אֶת יוֹאָב
  english_pob_choice: because the king’s command was detestable to Joab
  chosen_korean: 왕의 명령이 요압에게는 혐오스러웠기 때문입니다
  alternatives_korean:
  - 왕의 말씀이 요압에게는 가증스러웠기 때문입니다
  - 왕의 명령이 요압에게는 역겨웠기 때문입니다
  lexicon: HALOT
  rationale: דְּבַר הַמֶּלֶךְ는 여기서 단순한 ‘말’보다 왕의 지시·명령을 가리키므로 ‘명령’으로 옮겼고, נִתְעַב의 강한 부정적 평가를 ‘혐오스럽다’로 살렸습니다.
theological_decisions:
- issue: אֶת יוֹאָב의 관계를 어떻게 처리할지
  chosen_reading: ‘요압에게는’으로 옮겨, 왕의 명령이 요압에게 불쾌·혐오의 대상이 되었음을 드러냈습니다.
  alternative_readings:
  - ‘요압의 눈에는’
  - ‘요압에게’
  rationale: 히브리어 אֶת는 감정·평가의 대상 표지를 가질 수 있으므로, 요압이 그 명령을 어떻게 받아들였는지를 드러내는 방향이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 문맥 이해와 주어-대상 관계 보존
