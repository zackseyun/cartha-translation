  source_fidelity: 원문의 접속형 동사 וַיַּעַל은 ‘올라갔습니다’로 적절히 반영되었고, בִּדְבַר는 순응·준거의 뜻으로 ‘말대로’가 자연스럽습니다. 그러나 원문에는 ‘그러므로’에 해당하는 접속사가 없으므로 이를 삭제해야 합니다. 또한 관계절은 갓이 야훼의 이름으로 한 ‘말’을 수식합니다.
