lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 올랐습니다
  lexicon: HALOT
  rationale: עלה의 기본 방향성인 ‘올라가다’를 살리면서, 문맥상 특정 장소로 이동하는 자연스러운 한국어로 옮겼습니다.
- source_word: בִּדְבַר
  english_pob_choice: at the word of
  chosen_korean: 말씀대로
  alternatives_korean:
  - 말에 따라
  - 말씀을 따라
  - 말씀에 따라
  lexicon: HALOT
  rationale: 명령이나 지시에 대한 순응을 드러내는 ב + דָבָר의 용법을 한국어 관용에 맞게 ‘말씀대로’로 옮겼습니다.
- source_word: דִּבֶּר
  english_pob_choice: which he had spoken
  chosen_korean: 말한
  alternatives_korean:
  - 말했습니다
  - 말했던
  lexicon: HALOT
  rationale: 갓의 발화를 수식하는 관계절로 처리해, 앞선 선지자적 발화가 다윗의 순종보다 선행한다는 시제 관계를 자연스럽게 나타냈습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 권위로
  - 주님의 이름으로
  lexicon: HALOT
  rationale: יהוה를 프로젝트 기본값에 따라 야훼로 옮기고, בְּשֵׁם은 단순한 호출이 아니라 권위 아래의 발화를 뜻하므로 ‘이름으로’로 유지했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본절은 하나님의 고유명사를 사용하므로, 전통적 대체어가 아니라 원문이 드러내는 언약 անուն을 보존하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
