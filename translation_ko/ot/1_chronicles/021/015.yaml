  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
  footnotes:
  - marker: a
    text: Or, 'the disaster' for 'the calamity'; Hebrew רָעָה here refers to destructive judgment, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'stay your hand' for 'withdraw your hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 예루살렘을 멸하려고 천사를 보내셨습니다[a]. 그런데 그가 멸하고 있을 때 야훼께서 그것을 보시고 그 재앙[b]에 대해 뜻을 돌이키셨으며, 멸하는 천사에게 말씀하셨습니다. 「그만하라. 이제 네 손을 거두어라.」 야훼의 천사는 오르난, 여부스 사람의 타작마당 곁에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸하려고’는 히브리어 לְהַשְׁחִיתָהּ의 직접적 뜻을 살린 표현입니다.
    reason: source_note
  - marker: b
    text: 여기서 רָעָה는 도덕적 악이 아니라 심판으로 인한 재앙·재난을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신들
  lexicon: HALOT
  rationale: 단수 동사와 문맥상 이스라엘의 하나님을 가리키므로 표준적인 ‘하나님’이 가장 자연스럽습니다.
- source_word: מַלְאָךְ
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 전령
  lexicon: HALOT
  rationale: 심판을 수행하는 초자연적 존재이므로 넓은 ‘사자’보다 ‘천사’가 더 정확합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유한 언약 이름을 드러내기 위해 본문에서는 ‘야훼’를 유지합니다.
- source_word: רַב עַתָּה הֶרֶף יָדֶךָ
  english_pob_choice: Enough; now withdraw your hand.
  chosen_korean: 그만하라. 이제 네 손을 거두어라.
  alternatives_korean:
  - 그만해라. 이제 손을 거두어라.
  - 이제 충분하다. 손을 멈추어라.
  lexicon: HALOT
  rationale: ‘רַב’의 감탄을 간결한 중지 명령 ‘그만하라’로 살리고, 관용구 ‘손을 거두다’로 행위의 중단을 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼의 ‘뜻을 돌이키심’ 표현
  chosen_reading: 그 재앙에 대해 뜻을 돌이키셨으며
  alternative_readings:
  - 그 재앙을 후회하셨으며
  - 그 재앙을 거두셨으며
  rationale: נחם의 언어가 보여 주는 서술상 긴장을 그대로 두면서도, 하나님이 심판을 거두시는 맥락을 한국어로 과도하게 완화하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: מַלְאַךְ יְהוָה의 정체
  chosen_reading: 야훼의 천사
  alternative_readings:
  - 야훼 자신이 천사로 나타나신 것
  - 주님의 천사
  rationale: 본문이 말하는 그대로 옮겨, 이 존재의 정체를 신학적으로 단정하지 않고 서술의 범위 안에 머물게 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Never import doctrinal claims the text does not make'
