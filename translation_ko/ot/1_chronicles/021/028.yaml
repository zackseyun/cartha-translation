base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
  footnotes:
  - marker: a
    text: Or, 'the LORD had responded to him.' The Hebrew verb can denote answering, especially in response to prayer or sacrifice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 다윗은 야훼께서 오르난 사람의 타작마당에서 자기에게 응답하신 것을 보고, 거기서 제사를 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘응답하신’은 여기서 ‘대답하신’보다, 제사나 간구에 대한 하나님의 응답이라는 문맥을 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시간에
  - 그 무렵에
  lexicon: HALOT
  rationale: 서사 전환을 나타내는 표준 시간 표현으로, ‘At that time’의 연결감을 자연스럽게 살렸습니다.
- source_word: עָנָהוּ
  english_pob_choice: had answered him
  chosen_korean: 응답하신
  alternatives_korean:
  - 대답하신
  - 반응하신
  lexicon: HALOT
  rationale: 여기서는 기도나 제사에 대한 하나님의 응답이라는 문맥이므로, 단순한 ‘대답’보다 ‘응답’이 원문의 의미를 더 정확히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신성명은 일반 호칭이 아니라 고유한 언약명으로 제시되므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בְּגֹרֶן אָרְנָן הַיְבוּסִי
  english_pob_choice: at the threshing floor of Ornan the Jebusite
  chosen_korean: 오르난 사람의 타작마당에서
  alternatives_korean:
  - 오르난 여부스 사람의 타작마당에서
  - 오르난 여부스인의 타작마당에서
  lexicon: HALOT
  rationale: ‘בְּגֹרֶן’은 ‘타작마당’으로, ‘הַיְבוּסִי’는 수식 관계를 살려 ‘사람의/여부스 사람의’로 처리할 수 있으나, 본문은 오르난이 여부스 사람임을 나타내므로 인명 뒤에 종족 표지를 붙여 한국어 어순에 맞게 옮겼습니다.
- source_word: וַיִּזְבַּח
  english_pob_choice: he sacrificed
  chosen_korean: 제사를 드렸습니다
  alternatives_korean:
  - 제사하였습니다
  - 희생 제물을 바쳤습니다
  lexicon: HALOT
  rationale: זבח의 제의적 의미를 살려 ‘제사를 드리다’로 옮기되, 현대 한국어에서 자연스럽고 공손한 서술형을 사용했습니다.
theological_decisions:
- issue: 야훼께서 다윗에게 ‘응답하셨다’의 의미
  chosen_reading: 다윗은 야훼께서 제사와 관련된 상황 속에서 자신에게 응답하신 것을 보고 그 자리에서 제사를 드렸습니다.
  alternative_readings:
  - 야훼께서 그에게 대답하셨다
  - 야훼께서 그에게 반응하셨다
  rationale: 히브리어 ענה는 일반적 ‘대답’보다 요청·제사에 대한 신적 응답을 가리킬 수 있어, 문맥상 ‘응답’이 가장 정확합니다.
  doctrine_reference: Narrative theology of divine response to sacrifice/prayer
- issue: 종결어미의 시제와 서술 톤
  chosen_reading: 서사문체는 합쇼체로 유지하되, 직설적 역사 서술의 흐름을 해치지 않는 범위에서 ‘드렸습니다’로 마무리했습니다.
  alternative_readings:
  - 드렸습니다
  - 드렸습니다.
  rationale: 표준 한국어의 현대적 성경 문체를 따르면서도 원문 서사 진행의 단정함을 유지하기 위한 선택입니다.
  doctrine_reference: Korean style guide for publication-readable biblical prose
