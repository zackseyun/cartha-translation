id: 1CH.21.8
reference: 1 Chronicles 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
  footnotes:
  - marker: a
    text: Or 'remove the iniquity of your servant.' The Hebrew word can mean 'iniquity,' 'guilt,' or the liability arising from guilt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 하나님께 말씀드렸습니다. “제가 이 일을 행하여 크게 죄를 지었습니다. 이제 부디 주의 종의 죄책을 거두어 주십시오. 제가 매우 어리석게 행하였습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄책’은 히브리어 עָוֹן이 가질 수 있는 ‘죄악’, ‘죄책’, 또는 죄책에 따른 책임의 뜻을 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말씀드렸습니다
  alternatives_korean:
  - 그리고 ... 말씀드렸습니다
  - 그리하여 ... 말씀드렸습니다
  lexicon: WLC
  rationale: 서사 진행을 자연스럽게 이어 주는 완료-전환 표현으로, 히브리어 연속서술의 흐름을 한국어로 살렸습니다.
- source_word: אֶל הָאֱלֹהִים
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 그 하나님께
  - 하나님에게
  lexicon: WLC
  rationale: 문맥상 이스라엘의 하나님께 드리는 직접 화법이므로 한국어에서는 관사 없는 ‘하나님께’가 가장 자연스럽습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 당신의 종
  lexicon: WLC
  rationale: 하나님께 드리는 겸손한 자기 호칭이므로 ‘종’이 적절하며, 본문이 강조하는 예속 상태가 아니라 예배적 자기 낮춤을 반영합니다.
- source_word: עֲוֹן
  english_pob_choice: the guilt
  chosen_korean: 죄책
  alternatives_korean:
  - 죄악
  - 죄
  - 죄의 책임
  lexicon: WLC
  rationale: 이 단어는 죄 그 자체보다 죄로 인한 부담/책임을 포함할 수 있어, ‘거두어 주십시오’와 잘 맞는 ‘죄책’으로 옮겼습니다.
- source_word: נִסְכַּלְתִּי מְאֹד
  english_pob_choice: I have acted very foolishly
  chosen_korean: 제가 매우 어리석게 행하였습니다
  alternatives_korean:
  - 제가 매우 어리석었습니다
  - 제가 심히 어리석게 행동하였습니다
  lexicon: WLC
  rationale: 동사의 행위성을 살려 ‘행하였습니다’로 옮기고, מְאֹד의 강도를 ‘매우’로 반영했습니다.
theological_decisions:
- issue: עֲוֹן의 한국어 신학적 뉘앙스
  chosen_reading: ‘죄책’으로 번역하여 다윗이 하나님께 거두어 달라고 간구하는 도덕적·언약적 부담을 드러냈습니다.
  alternative_readings:
  - 죄악
  - 죄
  - 불법
  rationale: 이 절은 회개의 간구이므로 단순한 행위명칭보다, 제거되어야 할 부담으로서의 의미를 살리는 것이 본문의 흐름에 더 충실합니다.
  doctrine_reference: 회개와 용서, 죄책의 제거
- issue: 대화체의 공손성
  chosen_reading: 하나님께 드리는 직접 청원은 ‘부디 ... 주십시오’와 존대형으로 처리했습니다.
  alternative_readings:
  - 부디 ... 해 주세요
  - '... 하소서'
  rationale: 현대 표준어 합쇼체를 유지하면서도 하나님께 드리는 간구의 경건성과 직접성을 보존하기 위한 선택입니다.
  doctrine_reference: 예배적 기도체
