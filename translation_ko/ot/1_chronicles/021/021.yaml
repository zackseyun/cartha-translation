base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
  footnotes:
  - marker: a
    text: Or 'prostrated himself before David.' The Hebrew describes a full bow with the face to the ground.
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 오르난에게 이르자, 오르난이 바라보아 다윗을 보았습니다. 그리고 타작마당에서 나와 다윗 앞에 얼굴을 땅에 대고 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗 앞에 엎드려 절했습니다.’ 히브리어는 얼굴을 땅에 대는 완전한 절함을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... עַד
  english_pob_choice: came ... to
  chosen_korean: 이르자
  alternatives_korean:
  - 왔을 때
  - 다가오자
  lexicon: HALOT
  rationale: 이 동사는 다윗이 오르난에게 가까이 이른 장면을 자연스럽게 묶어 주며, ‘to’의 방향성과 서술 흐름을 간결하게 살립니다.
- source_word: וַיַּבֵּט / וַיַּרְא
  english_pob_choice: looked and saw
  chosen_korean: 바라보고 ... 보았습니다
  alternatives_korean:
  - 쳐다보고 ... 보았습니다
  - 보고 ... 발견했습니다
  lexicon: HALOT
  rationale: 히브리어의 두 단계 동작(응시하다/보다)을 한국어에서도 분리해, 단순히 ‘보았다’로 압축하지 않았습니다.
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  english_pob_choice: went out from the threshing floor
  chosen_korean: 타작마당에서 나와
  alternatives_korean:
  - 타작마당에서 나가
  - 타작마당을 떠나
  lexicon: HALOT
  rationale: גורן은 농경 맥락의 ‘타작마당’이 가장 정확하며, מן은 ‘에서’로 자연스럽게 풀어 출발 동작을 살렸습니다.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד אַפַּיִם אָרְצָה
  english_pob_choice: bowed down before David with his face to the ground
  chosen_korean: 다윗에게 얼굴을 땅에 대고 절했습니다
  alternatives_korean:
  - 다윗 앞에 엎드렸습니다
  - 다윗에게 엎드려 절했습니다
  lexicon: HALOT
  rationale: השתחוה와 ‘얼굴을 땅에’의 결합은 완전한 몸짓의 굴복을 나타내므로, ‘절했습니다’만으로 약화하지 않고 ‘얼굴을 땅에 대고’로 구체화했습니다.
theological_decisions:
- issue: אָרְנָן의 행동을 예배로 오해하게 할지 여부
  chosen_reading: 왕 앞에 대한 극진한 경례/굴복으로 읽히게 하되, 예배 용어는 쓰지 않았습니다.
  alternative_readings:
  - 다윗을 예배했습니다
  - 다윗에게 경의를 표했습니다
  rationale: 히브리어 השתחוה는 인간에게도 쓰일 수 있으므로, 문맥상 궁정적 예를 유지하면서도 예배 의미를 부여하지 않는 번역이 가장 정확합니다.
  doctrine_reference: 문맥 우선 원칙; 인간 왕에게 하는 prostration과 하나님께 드리는 예배를 구분합니다.
