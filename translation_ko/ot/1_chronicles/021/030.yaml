language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
  footnotes:
  - marker: a
    text: Or 'before him,' if the pronoun is taken to refer to God rather than to the tabernacle at Gibeon.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 다윗은 여호와의 천사의 칼을 보고 두려워하여, 하나님을 찾으려고 그곳으로 갈 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 대명사는 문맥상 기브온의 성막/예배처를 가리킬 가능성이 크지만, 하나님을 가리킨다고 볼 여지도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא יָכֹל
  english_pob_choice: could not
  chosen_korean: 갈 수 없었습니다
  alternatives_korean:
  - 갈 수 없었습니다
  - 갈 능력이 없었습니다
  - 갈 수 없었습니
  lexicon: HALOT
  rationale: 능력의 부정이지만, 문맥상 이동 불가능을 자연스럽게 나타내는 ‘갈 수 없었습니다’가 가장 간결하고 정확합니다.
- source_word: לָ/לֶכֶת לְ/פָנָי/ו
  english_pob_choice: go before it
  chosen_korean: 그곳으로
  alternatives_korean:
  - 그것 앞에
  - 그 앞에
  - 그곳으로
  lexicon: HALOT
  rationale: 전후 문맥의 장막/예배처를 가리키는 대상을 한국어에서는 ‘그곳으로’로 풀어 주는 것이 가장 자연스럽고, 본문의 이동 방향을 살릴 수 있습니다.
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  english_pob_choice: to seek God
  chosen_korean: 하나님을 찾으려고
  alternatives_korean:
  - 하나님을 찾으려고
  - 하나님께 구하려고
  - 하나님께 물으려고
  lexicon: HALOT
  rationale: דרש의 예배적·탐구적 의미를 단순한 정보 문의로 좁히지 않도록 ‘찾다’를 택했습니다. 문맥상 목적을 나타내기 위해 ‘-려고’를 사용했습니다.
- source_word: נִבְעַת
  english_pob_choice: was terrified
  chosen_korean: 두려워하여
  alternatives_korean:
  - 몹시 두려워하여
  - 공포에 질려
  - 두려워하여
  lexicon: HALOT
  rationale: 히필/니팔 계열의 강한 공포를 나타내지만, 한국어에서는 과장된 표현보다 서술 흐름에 맞는 ‘두려워하여’가 적절합니다.
- source_word: מִ/פְּנֵי חֶרֶב מַלְאַ֥ךְ יְהוָה
  english_pob_choice: by the sword of the angel of Yahweh
  chosen_korean: 여호와의 천사의 칼을
  alternatives_korean:
  - 여호와의 천사의 칼을
  - 야훼의 천사의 칼을
  - 여호와의 천사가 든 칼을
  lexicon: HALOT
  rationale: 원문은 공포의 원인을 ‘여호와의 천사의 칼’로 제시하므로, 한국어도 도구/대상격을 유지해 직접적으로 번역했습니다. POB의 본문 선택을 따라 인물칭은 ‘여호와’로 두었습니다.
theological_decisions:
- issue: 원문 대명사의 지시 대상(‘before it/him’)
  chosen_reading: 한국어 본문에서는 지시 대상을 특정하지 않고 ‘그곳’으로 처리했습니다.
  alternative_readings:
  - 그것 앞에
  - 그분 앞에
  - 성막 앞에
  rationale: 문맥상 기브온의 성막/예배처를 가리킬 가능성이 크지만, 한국어에서는 지시대명사를 유지하면 어색해지므로 장소 지시로 자연스럽게 옮겼습니다. 이는 의미를 좁히지 않으면서도 본문 흐름을 살립니다.
  doctrine_reference: 문맥적 대명사 해석(1 Chr 21:29–30)
