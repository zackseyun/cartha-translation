  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
  footnotes:
  - marker: a
    text: Or 'pestilence.' The Hebrew term denotes a deadly outbreak, often in the context of divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이스라엘에 전염병을 내리셨고, 이스라엘의 칠만 명이 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘역병.’ 히브리어는 대개 하나님의 심판 맥락에서 나타나는 치명적 발병을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문 고유명사 יהוה를 칭호로 바꾸지 않고, POB의 기본 원칙에 따라 음역한 표기를 살렸습니다.
- source_word: דֶּבֶר
  english_pob_choice: a plague
  chosen_korean: 전염병
  alternatives_korean:
  - 재앙
  - 역병
  - 페스트
  lexicon: HALOT
  rationale: 문맥상 야훼의 심판으로 내린 치명적 발병을 가리키므로, 현대 한국어에서 의미가 분명한 ‘전염병’으로 옮겼습니다. ‘역병’은 다소 고어적입니다.
- source_word: וַיִּתֵּן
  english_pob_choice: sent
  chosen_korean: 내리셨고
  alternatives_korean:
  - 보내셨고
  - 주셨고
  - 두셨고
  lexicon: HALOT
  rationale: ‘주다’의 직역보다, 재앙을 사람들 위에 가해지는 것으로 드러내는 한국어 표현 ‘내리다’가 원문의 심판적 뉘앙스를 더 잘 살립니다.
- source_word: וַיִּפֹּל
  english_pob_choice: fell
  chosen_korean: 쓰러졌습니다
  alternatives_korean:
  - 쓰러졌습니다
  - 죽었습니다
  - 엎드러졌습니다
  lexicon: HALOT
  rationale: 히브리어의 죽음 표지를 직역식으로 유지하면서도, 한국어에서 자연스럽고 비극성을 드러내는 ‘쓰러지다’를 택했습니다.
theological_decisions:
- issue: 야훼의 직접적 심판 행위 표현
  chosen_reading: ‘야훼께서 이스라엘에 전염병을 내리셨고’로 직접 서술했습니다.
  alternative_readings:
  - ‘야훼께서 전염병이 이스라엘에 일어나게 하셨고’
  - ‘야훼께서 전염병을 허락하셨고’
  rationale: 히브리어는 완곡하게 ‘허락하다’로 완화하지 않고, 야훼의 직접 행위를 분명히 말합니다. 원문의 긴장을 줄이지 않기 위해 직접 서술을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 신정론적 완화보다 본문의 직접 진술 보존
