base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
  footnotes:
  - marker: a
    text: Or, “for the full amount in silver.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “I will not take what is yours for the LORD and offer up a burnt offering for nothing.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗 왕이 오르난에게 말했습니다. “아니오. 반드시 은으로 온전한 값을[a] 치르고 사겠습니다. 나는 야훼를 위해 네 것을 취하지 않겠고[b], 번제를 값없이 드리지도 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “은 전액을 주고.”
    reason: lexical_alternative
  - marker: b
    text: 직역하면, “나는 야훼를 위해 네 것을 취하지 않겠고, 번제를 값없이 드리지 않겠습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  english_pob_choice: No, for
  chosen_korean: 아니오,
  alternatives_korean:
  - 아니라,
  - 아니오, 왜냐하면
  lexicon: HALOT
  rationale: 강한 거절 뒤에 곧바로 이유를 밝히는 구조이므로, 한국어에서는 짧은 거절 표지와 뒤이은 설명으로 자연스럽게 살렸습니다.
- source_word: קָנֹה אֶקְנֶה בְּכֶסֶף מָלֵא
  english_pob_choice: I will surely buy it for the full price in silver
  chosen_korean: 반드시 은값 전액을 치르고 사겠습니다
  alternatives_korean:
  - 반드시 은으로 가득한 값에 사겠습니다
  - 전액을 은으로 주고 사겠습니다
  lexicon: HALOT
  rationale: 반복 강조를 ‘반드시’로, 값의 충분함을 ‘전액’으로 옮겨 구매의 확정성과 완전한 대가 지불을 드러냈습니다.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ לַיהוָה
  english_pob_choice: I will not take for Yahweh what is yours
  chosen_korean: 야훼께 드릴 것에 네 것을 내가 빼앗지 않겠고
  alternatives_korean:
  - 야훼께 드릴 데 네 것을 내가 취하지 않겠고
  - 야훼께 드릴 것에 속한 네 것을 내가 취하지 않겠고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘받다’보다 남의 것을 예배용으로 취하는 행위를 거절하는 뜻이므로 ‘빼앗다’로 강하게 반영했습니다.
- source_word: וְהַעֲלוֹת עוֹלָה חִנָּם
  english_pob_choice: nor offer up a burnt offering for nothing
  chosen_korean: 번제를 공짜로 드리지도 않겠습니다
  alternatives_korean:
  - 값없이 번제를 드리지도 않겠습니다
  - 거저 번제를 올리지도 않겠습니다
  lexicon: HALOT
  rationale: חִנָּם의 무상성을 현대 한국어의 ‘공짜로’로 옮겨, 다윗이 값없는 예배를 거부하는 뉘앙스를 선명하게 했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 Tetragrammaton을 직접 사용하므로, 프로젝트 기본값에 따라 고유 신명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 제물의 무상성에 대한 다윗의 태도
  chosen_reading: 예배는 대가 없는 헌신이 아니라 정당한 대가와 함께 드려져야 한다는 거절로 표현
  alternative_readings:
  - 단순히 값비싼 제물을 선호하는 표현
  - 재정적 거래에 대한 실무적 언급
  rationale: ‘공짜로’와 ‘전액’의 대비를 살려, 다윗이 하나님께 드리는 것을 사람의 소유를 무상으로 전용해 행하지 않겠다는 경건한 원칙을 드러냈습니다.
  doctrine_reference: 사무엘하 24장/역대상 21장의 제단 매입과 제사 원리
