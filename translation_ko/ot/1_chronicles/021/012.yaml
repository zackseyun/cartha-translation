  lexicon: HALOT
  rationale: 추격 중에 ‘미쳐 잡다/따라잡다’의 뜻을 살려 원수의 칼이 추격 끝에 미치는 이미지를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
