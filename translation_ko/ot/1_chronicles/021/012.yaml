  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문의 대조(당신의 원수의 칼/야훼의 칼)를 분명히 했습니다.
- source_word: דֶבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
