id: 1CH.21.12
reference: 1 Chronicles 21:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
  footnotes:
  - marker: a
    text: Or 'being consumed' or 'perishing before your enemies'; the Hebrew participle can denote being brought to ruin in battle.
    reason: lexical_alternative
  - marker: b
    text: Or 'plague'; the Hebrew word denotes epidemic disease sent as judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 곧장 세 해 동안의 기근이든지[a], 아니면 세 달 동안 당신의 원수들 앞에서 무너져 가며 원수의 칼이 당신을 따라잡는 것이든지, 아니면 세 날 동안 야훼의 칼—곧 그 땅의 전염병이든지, 야훼의 천사가 온 이스라엘의 모든 지역에서 멸망을 일으키는 것이든지[b] 중에서 하나를 택하십시오. 이제 나를 보낸 이에게 제가 어떤 대답을 전해야 할지 생각해 보십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기근으로 소모되는 것’ 혹은 ‘원수들 앞에서 멸망하는 것’; 히브리어 분사형은 전투에서 무너져 가는 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘역병’; 히브리어는 심판으로 보내지는 유행성 질병을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  english_pob_choice: famine
  chosen_korean: 기근
  alternatives_korean:
  - 흉년
  - 굶주림
  lexicon: HALOT
  rationale: 국가적·심판적 식량 부족을 가리키는 표준 의미를 살려 ‘기근’으로 옮겼습니다.
- source_word: נִסְפֶּה מִפְּנֵי צָרֶיךָ
  english_pob_choice: being swept away before your foes
  chosen_korean: 당신의 원수들 앞에서 무너져 가며
  alternatives_korean:
  - 당신의 원수들 앞에서 휩쓸려 가며
  - 원수들 앞에서 멸망하며
  lexicon: HALOT
  rationale: 단순한 죽음보다 전투적 패주와 몰락의 상태를 포괄하는 표현이어서, 진행 중인 붕괴감을 살려 옮겼습니다.
- source_word: לְמַשֶּׂגֶת
  english_pob_choice: overtakes you
  chosen_korean: 따라잡는
  alternatives_korean:
  - 미치는
  - 덮치는
  lexicon: HALOT
  rationale: 추격 중에 ‘미쳐 잡다/따라잡다’의 뜻을 살려 원수의 칼이 추격 끝에 미치는 이미지를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문의 대조(당신의 원수의 칼/야훼의 칼)를 분명히 했습니다.
- source_word: דֶבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 재앙의 질병
  lexicon: HALOT
  rationale: 심판 맥락의 집단적 질병을 가리키므로, 현대 한국어에서 의미가 즉각 분명한 ‘전염병’으로 옮겼습니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 주님의 천사
  lexicon: HALOT
  rationale: 서술적 용법을 따라 직역하되, 전통적 교회어 ‘주님의 천사’보다 원문 대비가 분명한 ‘야훼의 천사’를 유지했습니다.
- source_word: שֹׁלְחִי דָּבָר
  english_pob_choice: what answer I should return
  chosen_korean: 어떤 대답을 전해야 할지
  alternatives_korean:
  - 어떤 말을 돌려보내야 할지
  - 어떤 응답을 해야 할지
  lexicon: HALOT
  rationale: ‘말을 돌려보내다/대답을 돌려주다’라는 히브리 관용을 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: חֶרֶב יְהוָה와 דֶבֶר의 병치
  chosen_reading: ‘야훼의 칼—곧 그 땅의 전염병’으로 apposition을 살려, 칼과 전염병을 분리하지 않고 같은 심판의 두 측면으로 제시했습니다.
  alternative_readings:
  - ‘야훼의 칼, 그 땅의 전염병’
  - ‘야훼의 칼, 곧 전염병이 그 땅에 임하는 것’
  rationale: 개정된 영어 POB의 ‘even’ 취지를 반영해, 전염병이 야훼의 칼에 수반되는 설명적 병치임을 드러냈습니다.
  doctrine_reference: 'POB translation philosophy: preserve source-level apposition and tension'
