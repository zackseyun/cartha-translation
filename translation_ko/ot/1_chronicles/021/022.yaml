base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: ko
  text: 그때 다윗이 오르난에게 말했습니다. “타작마당의 자리를 내게 주십시오. 내가 그 위에 야훼를 위한 제단을 쌓겠습니다. 그것을 내게 온전한 값으로 주십시오. 그리하면 재앙이 백성에게서 멈출 것입니다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 오르난은 역대상 21장의 본문 인물 이름 표기입니다.
    reason: source_note
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  english_pob_choice: the place of the threshing floor
  chosen_korean: 타작마당의 자리
  alternatives_korean:
  - 타작마당의 장소
  - 타작마당 자리
  - 타작마당 터
  lexicon: מָקוֹם / גֹּרֶן
  rationale: POB의 place를 공간적 ‘장소’보다 소유·건축이 가능한 특정 구역을 가리키는 말로 보고, 자연스러운 현대어 ‘자리’로 옮겼습니다.
- source_word: מִזְבֵּחַ לַיהוָה
  english_pob_choice: an altar to the LORD
  chosen_korean: 야훼를 위한 제단
  alternatives_korean:
  - 야훼께 제단
  - 주님을 위한 제단
  - 야훼의 제단
  lexicon: מִזְבֵּחַ / לַיהוָה
  rationale: לַיהוָה는 예배의 대상을 나타내므로, 제단의 소유격보다 목적을 분명히 하는 ‘...를 위한’으로 풀었습니다.
- source_word: בְּכֶסֶף מָלֵא
  english_pob_choice: for the full price
  chosen_korean: 온전한 값으로
  alternatives_korean:
  - 전액으로
  - 제값으로
  - 가득한 값으로
  lexicon: כֶּסֶף / מָלֵא
  rationale: 완전한 대가 지급이라는 뜻을 살리되, 상업적 문맥을 무리 없이 드러내는 표준어로 옮겼습니다.
- source_word: וְתֵעָצַר הַמַּגֵּפָה
  english_pob_choice: so that the plague may be stopped
  chosen_korean: 그리하면 재앙이 … 멈출 것입니다
  alternatives_korean:
  - 그리하면 전염병이 멈출 것입니다
  - 그리하면 역병이 멎을 것입니다
  - 그러면 재앙이 그칠 것입니다
  lexicon: מַגֵּפָה
  rationale: 문맥상 치명적 재앙을 가리키므로, 전염병으로 좁히지 않고 더 넓은 ‘재앙’을 택해 원문의 범위를 보존했습니다.
