base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Now Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
  footnotes:
  - marker: a
    text: Or 'were hiding.' The Hebrew reflexive form more literally suggests 'were hiding themselves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오르난은 밀을 타작하고 있을 때 몸을 돌려 천사를 보았습니다. 그의 네 아들도 그와 함께 몸을 숨기고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 반사형으로, 직역하면 ‘자기들을 숨기고 있었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
