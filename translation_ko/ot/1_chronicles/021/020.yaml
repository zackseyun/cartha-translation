  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Now Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
  footnotes:
  - marker: a
    text: Or 'were hiding.' The Hebrew reflexive form more literally suggests 'were hiding themselves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오르난이 돌아서서 천사를 보았는데, 그의 네 아들도 그와 함께 숨어 있었고, 오르난은 밀을 타작하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨어 있었고’는 히브리어의 반사형 표현이 주는 ‘자기들을 숨기고 있었다’는 뉘앙스를 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
