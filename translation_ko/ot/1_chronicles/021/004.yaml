translation:
  language: ko
  text: 그런데 왕의 말이 요압을 압도했습니다[a]. 그래서 요압은 나가서 온 이스라엘을 두루 다니고[b] 예루살렘에 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕의 명령이 요압을 압도했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온 이스라엘을 여행했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  english_pob_choice: But the king’s word
  chosen_korean: 왕의 말
  alternatives_korean:
  - 왕의 명령
  - 왕의 말씀
  lexicon: HALOT
  rationale: דָּבָר는 기본적으로 ‘말/일’이지만 여기서는 왕이 내린 지시를 가리키므로, 한국어에서는 자연스럽게 ‘왕의 말’로 옮겨 원문의 표현성과 권위를 함께 살렸습니다.
- source_word: חָזַק עַל
  english_pob_choice: prevailed against
  chosen_korean: 압도했습니다
  alternatives_korean:
  - 이겼습니다
  - 요압보다 강했습니다
  - 요압을 제압했습니다
  lexicon: HALOT
  rationale: ‘강하다/우세하다’의 관용적 의미를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘압도하다’를 택해, 왕의 말이 요압의 저항을 누른 힘을 보존했습니다.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  english_pob_choice: went throughout all Israel
  chosen_korean: 온 이스라엘을 두루 다녔고
  alternatives_korean:
  - 온 이스라엘을 여행했고
  - 온 이스라엘을 돌아다녔고
  - 온 이스라엘을 다녔고
  lexicon: HALOT
  rationale: 히트파엘 형태가 단순한 ‘감’이 아니라 이곳저곳을 순회하며 다니는 동작을 나타내므로, ‘두루 다녔다’로 번역해 조사 범위를 살렸습니다.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  english_pob_choice: and he came to Jerusalem
  chosen_korean: 예루살렘에 왔습니다
  alternatives_korean:
  - 예루살렘에 도착했습니다
  - 예루살렘으로 왔습니다
  lexicon: HALOT
  rationale: בּוֹא의 기본 의미인 ‘오다/오게 되다’를 따라, 귀환을 덧붙이지 않고 단순히 ‘왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 요압에 대한 왕의 말의 작용을 어떻게 드러낼지
  chosen_reading: ‘왕의 말이 요압을 압도했습니다’로 번역해, 단순한 정보 전달이 아니라 왕의 명이 실제로 요압의 뜻을 꺾는 서술임을 드러냈습니다.
  alternative_readings:
  - ‘왕의 명령이 요압 위에 서 있었습니다’
  - ‘왕의 말이 요압을 이겼습니다’
  rationale: 본문의 חָזַק עַל은 권위의 우세와 굴복을 나타내므로, 서술의 힘을 약화시키지 않는 방향이 적절합니다.
  doctrine_reference: 본문 해석상 권위와 순종의 긴장
