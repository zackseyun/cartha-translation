  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
  footnotes:
  - marker: a
    text: Or, 'human hands.' The Hebrew reads singular 'the hand of man,' contrasting human power with the hand of the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 다윗이 갓에게 말했습니다. 「제가 매우 곤경에 빠졌습니다. 부디 야훼의 손에 저를 떨어뜨리십시오. 그의 긍휼은 매우 크시기 때문입니다. 그러나 사람의 손에는 저를 떨어뜨리지 마십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형 ‘사람의 손’을 사용하며, 야훼의 손과 대조를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  english_pob_choice: I am in great distress
  chosen_korean: 제가 매우 곤경에 빠졌습니다
  alternatives_korean:
  - 제가 크게 고통스럽습니다
  - 제가 매우 답답한 처지에 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 극심한 압박과 괴로움을 뜻하므로, 현대 한국어에서 자연스러운 ‘곤경에 빠졌습니다’로 긴박함을 살렸습니다.
- source_word: אֶפְּלָה נָּא
  english_pob_choice: Please let me fall
  chosen_korean: 부디 … 저를 떨어뜨리십시오
  alternatives_korean:
  - 제발 … 저를 떨어뜨리게 해주십시오
  - 부디 … 저를 넘어지게 하십시오
  lexicon: HALOT
  rationale: 청원형과 나(נא)의 공손한 간청을 살리기 위해 ‘부디’와 명령형 공손체를 결합했습니다.
- source_word: בְ/יַד יְהוָה
  english_pob_choice: into the hand of Yahweh
  chosen_korean: 야훼의 손에
  alternatives_korean:
  - 야훼의 손 안에
  - 야훼의 권능에
  lexicon: HALOT
  rationale: ‘손’의 이미지가 하나님의 처분과 권능을 드러내므로 은유를 유지했습니다. יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: רַחֲמָי/ו
  english_pob_choice: his mercies are very great
  chosen_korean: 그의 긍휼은 매우 크시기 때문입니다
  alternatives_korean:
  - 그의 자비는 매우 크시기 때문입니다
  - 그의 긍휼이 매우 많으시기 때문입니다
  lexicon: HALOT
  rationale: רַחֲמִים의 복수성은 한국어 단일어 ‘긍휼’이 완전히 드러내지 못하지만, 문맥상 하나님의 자비로운 성품을 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: וּ/בְ/יַד אָדָם
  english_pob_choice: into the hand of man
  chosen_korean: 사람의 손에는
  alternatives_korean:
  - 인간의 손에는
  - 사람들의 손에는
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם과 대조를 유지하기 위해 복수화하지 않고 ‘사람’으로 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 여기서 אָדָם은 야훼와 대비되는 인간 행위자를 가리키므로, 성별 일반화가 과도하지 않으면서도 현대 한국어에서 자연스러운 ‘사람’이 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 신명은 프로젝트 기본값에 따라 ‘야훼’로 유지해, 본문이 의도하는 언약적 이름을 분명히 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: ‘사람의 손’과 ‘야훼의 손’의 대비
  chosen_reading: 단수형 ‘사람’과 ‘손’의 이미지를 함께 보존
  alternative_readings:
  - 사람들
  - 인간의 권력
  rationale: 본문은 인간 집단 일반보다 야훼의 심판과 인간의 심판을 직접 대비하므로, 단수형과 은유를 유지해 긴장을 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; contested terms אָדָם
