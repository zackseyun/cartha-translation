- from: 그때 다윗이 갓에게 말했습니다. 「제가 매우 곤경에 빠졌습니다. 부디 야훼의 손에 저를 떨어뜨리십시오. 그의 긍휼은 매우 크시기 때문입니다. 그러나 사람의 손에는 저를 떨어뜨리지 마십시오.」[a]
  to: 그때 다윗이 갓에게 말했습니다. 「제가 매우 곤경에 빠졌습니다. 부디 제가 야훼의 손에 떨어지게 해 주십시오. 그분의 자비가 매우 크기 때문입니다. 그러나 제가 사람의 손[a]에는 떨어지지 않게 해 주십시오.」
  rationale: 문법적으로 부적절한 높임 표현을 바로잡고, 두 청원을 한국어의 자연스러운 합쇼체 간청문으로 조정했습니다. 야훼의 손과 사람의 손이라는 원문의 은유 및 단수 대조는 유지했습니다.
