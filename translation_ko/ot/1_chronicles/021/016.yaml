  naturalness: 현대 표준 한국어와 합쇼체에 대체로 맞습니다. ‘손에 뽑아 든 칼을 예루살렘 위로 뻗고 있었습니다’로 하면 칼의 상태와 방향이 자연스럽고 명료해집니다.
  terminology: ‘야훼의 천사’, ‘베옷’, ‘장로들’은 적절합니다. ‘땅과 하늘’은 히브리어의 우주적 대조를 자연스러운 한국어로 잘 전달합니다.
