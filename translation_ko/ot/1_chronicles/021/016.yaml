source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
  footnotes:
  - marker: a
    text: Or 'between earth and heaven.' The Hebrew has 'between the earth and the heavens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗이 눈을 들어 보니, 야훼의 천사가 땅과 하늘 사이에 서 있었고, 손에 뽑아 든 칼을 예루살렘 위로 뻗고 있었습니다. 그러자 다윗과 장로들은 베옷을 입은 채 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  english_pob_choice: lifted up his eyes
  chosen_korean: 눈을 들어 보니
  alternatives_korean:
  - 올려다보니
  - 눈을 들었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기면서도, 갑작스러운 목격 장면의 서술감을 살렸습니다.
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 여호와의 천사
  lexicon: HALOT
  rationale: 본문의 신명표기를 그대로 반영해 POB의 야훼를 유지했고, מַלְאַךְ는 문맥상 ‘천사’가 가장 직접적입니다.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  english_pob_choice: between the earth and the heavens
  chosen_korean: 땅과 하늘 사이에
  alternatives_korean:
  - 땅과 하늘들 사이에
  - 땅과 하늘 사이
  lexicon: HALOT
  rationale: 히브리어의 우주적 대조를 살리되, 한국어에서는 복수형 ‘하늘들’보다 자연스러운 ‘하늘’이 더 읽기 쉽습니다.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ נְטוּיָה עַל יְרוּשָׁלִָם
  english_pob_choice: with his sword drawn, in his hand, stretched out over Jerusalem
  chosen_korean: 손에는 칼을 뽑은 채 예루살렘 위로 뻗고 있었습니다
  alternatives_korean:
  - 손에 칼을 빼 든 채 예루살렘 위로 향하고 있었습니다
  - 손에 뽑힌 칼을 쥔 채 예루살렘 위로 뻗어 있었습니다
  lexicon: HALOT
  rationale: ‘뽑은 칼’로 שְׁלוּפָה의 상태를 반영하고, ‘뻗고 있었습니다’로 נְטוּיָה의 위협적 방향성을 유지했습니다.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  english_pob_choice: covered in sackcloth
  chosen_korean: 베옷을 입은 채
  alternatives_korean:
  - 베옷에 덮인 채
  - 베옷으로 뒤덮인 채
  lexicon: HALOT
  rationale: ‘베옷’은 회개·애도의 문화적 함의를 보존하는 전통적이면서도 이해 가능한 표현입니다. ‘입은 채’는 מְכֻסִּים의 상태를 자연스럽게 풀어 줍니다.
- source_word: וַיִּפֹּל ... עַל פְּנֵיהֶם
  english_pob_choice: fell on their faces
  chosen_korean: 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 얼굴을 땅에 대고 쓰러졌습니다
  - 낯을 땅에 대고 엎드렸습니다
  lexicon: HALOT
  rationale: 관용적 ‘엎드리다’를 쓰되, ‘얼굴을 땅에 대고’로 히브리어의 신체 이미지를 분명히 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 규정에 따라 신명표기는 ‘야훼’로 유지해 본문의 고유 신명성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: ‘하늘’의 수형 반영
  chosen_reading: ‘하늘’로 옮기되 복수 의미를 문장 전체의 대조로 살렸습니다.
  alternative_readings:
  - 하늘들
  - 하늘
  rationale: 히브리어 복수형 שָׁמַיִם을 직역한 ‘하늘들’은 한국어에서 어색하므로, 자연성을 택하되 우주적 대비는 유지했습니다.
  doctrine_reference: 히브리어 복수형의 한국어 자연화
