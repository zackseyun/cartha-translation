base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
  footnotes:
  - marker: a
    text: Literally, 'a thousand thousands and a hundred thousand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요압이 백성 인구 조사의 총수를 다윗에게 전했습니다. 온 이스라엘에는 칼을 빼는 사람이 1,100,000명[a]이었고, 유다에는 칼을 빼는 사람이 470,000명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘천천(千千)과 십만’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן יוֹאָב אֶת מִסְפַּר מִפְקַד הָעָם
  english_pob_choice: Joab gave the number of the census of the people
  chosen_korean: 요압이 백성의 조사된 수를 다윗에게 보고했습니다
  alternatives_korean:
  - 요압이 백성의 인구조사 수를 다윗에게 주었습니다
  - 요압이 백성의 모집 수를 다윗에게 주었습니다
  lexicon: HALOT
  rationale: מִסְפַּר מִפְקַד הָעָם은 단순한 '수'보다 '조사/계수된 결과'를 함께 담고 있어, 문맥상 자연스러운 '조사된 수'로 옮겼습니다. '보고했습니다'는 נתן의 결과 전달 기능을 한국어로 자연스럽게 드러냅니다.
- source_word: וַיְהִי כָל יִשְׂרָאֵל ... וִיהוּדָה ...
  english_pob_choice: All Israel was ... and Judah was ...
  chosen_korean: 온 이스라엘은 ...이었고, 유다는 ...이었습니다
  alternatives_korean:
  - 온 이스라엘은 ...였으며, 유다는 ...였습니다
  - 이스라엘 전체는 ...이었고, 유다는 ...이었습니다
  lexicon: HALOT
  rationale: 히브리어 결과 진술 구조를 살려 두 집합의 총계를 병렬로 제시했습니다. '온 이스라엘'은 כל יִשְׂרָאֵל의 집합적 의미를 유지합니다.
- source_word: שֹׁלֵף חֶרֶב
  english_pob_choice: drawing the sword
  chosen_korean: 칼을 빼는 전사
  alternatives_korean:
  - 칼을 빼는 자
  - 칼을 뽑는 사람
  lexicon: HALOT
  rationale: שֹׁלֵף는 문자적으로 '뽑는/빼는' 동작을 가리키며, 군사적 등록 맥락에서는 능동적 전투원을 뜻합니다. '전사'는 의미를 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף / אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  english_pob_choice: 1,100,000 / 470,000
  chosen_korean: 1,100,000명 / 470,000명
  alternatives_korean:
  - 백십만 명 / 사십칠만 명
  - 천천만? /
  lexicon: HALOT
  rationale: 히브리어의 문자적 수를 현대 한국어 독자가 즉시 파악할 수 있도록 아라비아 숫자로 제시했습니다. 인원 단위 '명'을 붙여 군사 인구 조사 맥락을 분명히 했습니다.
