  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
  footnotes:
  - marker: a
    text: Literally, 'a thousand thousands and a hundred thousand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요압이 백성의 조사된 수를 다윗에게 보고했습니다. 온 이스라엘은 칼을 빼는 전사 1,100,000명이었고, 유다는 칼을 빼는 전사 470,000명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘천천(千千)과 십만’을 뜻합니다.
