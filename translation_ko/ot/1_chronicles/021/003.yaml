source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
  footnotes:
  - marker: a
    text: Or, “May the LORD make his people a hundred times more than they are.”
    reason: lexical_alternative
  - marker: b
    text: Or, “Are they not all my lord’s slaves?”
    reason: lexical_alternative
  - marker: c
    text: That is, guilt or liability coming upon Israel because of this action.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 요압이 말했습니다. “야훼께서 그의 백성을 지금보다 백 배나 더 많게 하시기를 바랍니다! 내 주 왕이시여, 그들이 다 내 주의 종들이 아니옵니까? 내 주께서 어찌 이런 일을 구하시나이까? 이것이 어찌 이스라엘의 죄책이 되겠나이까?”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역: “야훼께서 그의 백성을 지금보다 백 배나 더 많게 하실 것입니다.”'
    reason: alternative_reading
  - marker: b
    text: '다른 번역: “그들이 다 내 주의 노예들이 아니옵니까?”'
    reason: lexical_alternative
  - marker: c
    text: 곧 이 행동으로 인해 이스라엘 위에 돌아올 책임이나 유책성을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 히브리어 본문에 있는 고유신명 יְהוָה를 한국어 기본값인 ‘야훼’로 옮겨, 제목이 아니라 고유한 언약명을 드러냈습니다.
- source_word: יוֹסֵף
  english_pob_choice: May ... add
  chosen_korean: '...더 많게 하시기를 바랍니다'
  alternatives_korean:
  - '...더하시기를 바랍니다'
  - '...증가시키시기를 바랍니다'
  lexicon: HALOT
  rationale: 요압의 발화는 명령이 아니라 바람/청원의 뜻을 띤 동사형이므로, 한국어에서는 축복적 소망을 나타내는 ‘…하시기를 바랍니다’로 자연스럽게 살렸습니다.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  english_pob_choice: servants
  chosen_korean: 내 주의 종들이
  alternatives_korean:
  - 내 주의 노예들이
  - 내 주께 속한 종들이
  lexicon: HALOT
  rationale: 여기서는 왕에게 대한 정치적 예속을 말하므로 ‘종들’이 문맥에 맞습니다. POB의 ‘servants’를 따르되, 본문이 강조하는 것은 노예 제도가 아니라 왕권 아래의 신하적 신분입니다.
- source_word: לְאַשְׁמָה
  english_pob_choice: guilt
  chosen_korean: 죄책
  alternatives_korean:
  - 죄
  - 책임
  - 유죄
  lexicon: HALOT
  rationale: 이 단어는 제물이나 단순한 도덕적 흠이 아니라 이스라엘 위에 돌아올 책임/유책성을 뜻하므로, 문맥상 ‘죄책’이 가장 압축적이고 정확합니다.
theological_decisions:
- issue: 왕에 대한 호칭의 존칭 강도
  chosen_reading: ‘내 주 왕이시여’와 같은 예우 표현을 유지하되, 본문 내부의 화법은 현대 합쇼체로 정리했습니다.
  alternative_readings:
  - ‘내 주 왕님’
  - ‘주여 왕님’
  rationale: 히브리어의 אֲדֹנִי הַמֶּלֶךְ는 궁중 예우 표현이므로, 한국어에서도 지나치게 평면화하지 않고 존칭을 살렸습니다. 다만 신적 호칭이 아니므로 ‘주여’ 대신 왕에게 맞는 문체를 택했습니다.
  doctrine_reference: Narrative register and honorific distinction in direct speech
- issue: לְאַשְׁמָה의 결과 의미
  chosen_reading: 이스라엘의 죄책이 되겠나이까
  alternative_readings:
  - 이스라엘에 죄를 가져오겠나이까
  - 이스라엘 위에 죄책이 돌아오겠나이까
  rationale: 본문은 단순한 감정적 죄책감이 아니라 다윗의 행동이 공동체에 초래할 법적·도덕적 책임을 가리킵니다. 그래서 ‘죄책’으로 결과성을 드러냈습니다.
  doctrine_reference: Communal culpability in covenant context
