translation:
  language: ko
  text: 야훼의 천사가 갓에게 말하여 다윗에게 전하라고 했습니다. 곧 다윗이 올라가 야훼를 위해 여부스 사람 오르난의 타작마당에 제단을 쌓으라는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사’는 ‘사자/메신저’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 명령의 내용으로 ‘다윗이 올라가 … 제단을 쌓으라’는 취지를 전합니다.
    reason: source_note
lexical_decisions:
- source_word: וּ/מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 문맥상 하늘 존재를 가리키므로 ‘천사’가 자연스럽고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: אָמַר אֶל גָּד לֵ/אמֹר
  english_pob_choice: said to Gad to tell David
  chosen_korean: 갓에게 말하여 다윗에게 전하라고 했습니다
  alternatives_korean:
  - 갓에게 말하여 다윗에게 말하라고 했습니다
  - 갓에게 일러 다윗에게 전하라고 했습니다
  lexicon: HALOT
  rationale: לֵאמֹר의 전달 기능을 살려 ‘전하라고 했습니다’로 옮기고, אָמַר의 반복된 발화를 자연스럽게 반영했습니다.
- source_word: כִּי יַעֲלֶה דָוִיד לְ/הָקִים מִזְבֵּחַ
  english_pob_choice: that David should go up to set up an altar
  chosen_korean: 다윗이 올라가 … 제단을 쌓으라는 것이었습니다
  alternatives_korean:
  - 다윗이 올라가 … 제단을 세우라는 것이었습니다
  - 다윗이 올라가 … 제단을 설치하라는 것이었습니다
  lexicon: HALOT
  rationale: עלה는 ‘올라가다’를 유지했고, הָקִים은 제단에 대한 관용적 표현을 살리면서도 ‘쌓다’로 옮겨 ‘세우다’보다 물리적 조성감을 살렸습니다.
- source_word: בְּ/גֹרֶן אָרְנָן הַ/יְבֻסִי
  english_pob_choice: on the threshing floor of Ornan the Jebusite
  chosen_korean: 여부스 사람 오르난의 타작마당에
  alternatives_korean:
  - 오르난 여부스 사람의 타작마당에
  - 오르난 그 여부스 사람의 타작마당에
  lexicon: HALOT
  rationale: גֹרֶן은 ‘타작마당’으로 옮겼고, הַיְבֻסִי는 오르난의 정체를 나타내는 별칭으로 ‘여부스 사람’이라 풀어 자연스럽게 배치했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문 전체에서 יְהוָה를 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 사무적·서술적 문맥에서 직접 신명호를 사용하므로, 프로젝트 기준에 따라 고유한 언약명 ‘야훼’를 유지하는 것이 원문의 식별성을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
