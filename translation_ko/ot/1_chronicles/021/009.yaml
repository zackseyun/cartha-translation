  lexicon: HALOT
  rationale: דבר의 서사적 진행을 살리면서, 이어지는 לֵאמֹר 공식을 고려해 한국어에서는 ‘말씀하시며 이르셨습니다’로 직접 발화를 자연스럽게 드러냈습니다.
- source_word: יְהוָה
