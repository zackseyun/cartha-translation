  - 주님
  lexicon: HALOT
  rationale: 본문의 고유 신명 יהוה를 관습적 대체어가 아닌 음역 ‘야훼’로 옮겨, POB의 신명 보존 원칙을 반영했습니다.
- source_word: חֹזֵה
  english_pob_choice: seer
  chosen_korean: 선견자
  alternatives_korean:
  - 선지자
  - 예언자
  lexicon: HALOT
  rationale: חֹזֶה는 일반적인 예언자보다 ‘보는 자’라는 시각적 계시의 뉘앙스가 강하므로, 전통적 교회어보다 더 직접적인 ‘선견자’를 택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: …이르셨습니다
  alternatives_korean:
  - 말하여
  - 라고 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어 서술문에서 직설화를 여는 표지이므로, 한국어에서는 반복을 줄이면서도 담화 개시 기능을 살리도록 처리했습니다.
theological_decisions:
- issue: 신명 יהוה의 번역 유지
  chosen_reading: ‘야훼’로 직역성 있게 보존합니다.
  alternative_readings:
  - ‘주님’으로 번역
  - ‘여호와’로 번역
  rationale: 본문은 단순한 호칭이 아니라 언약적 고유명사를 사용하므로, 대체 титulature보다 이름 자체를 드러내는 번역이 출처 충실성과 신학적 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
