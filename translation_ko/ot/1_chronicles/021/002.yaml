reference: 1 Chronicles 21:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''from Beersheba to Dan'' means from one end of Israel to the other.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 다윗이 요압과 백성의 지휘관들에게 말했습니다. “가서 이스라엘을 브엘세바에서 단까지[a] 세고, 그 결과를 내게 가져오십시오. 그러면 내가 그 수를 알겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘브엘세바에서 단까지’는 이스라엘 전역, 곧 남쪽 끝에서 북쪽 끝까지를 뜻하는 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그런 다음 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속은 서술의 진행을 나타내므로, 한국어에서는 자연스러운 시간 표지인 ‘그때’로 이어지는 발화를 표현했습니다.
- source_word: שָׂרֵי הָעָם
  english_pob_choice: the commanders of the people
  chosen_korean: 백성의 지휘관들
  alternatives_korean:
  - 백성의 지도자들
  - 백성의 관리들
  - 백성의 대장들
  lexicon: HALOT
  rationale: 이 구절은 요압과 함께 언급되어 행정적·군사적 책임자들을 가리키므로, ‘지휘관들’이 문맥을 가장 잘 반영합니다.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  english_pob_choice: from Beersheba to Dan
  chosen_korean: 브엘세바에서부터 단까지
  alternatives_korean:
  - 브엘세바부터 단까지
  - 브엘세바에서 단까지
  lexicon: HALOT
  rationale: 남쪽 끝에서 북쪽 끝까지를 가리키는 관용구를 표준 지명 음역으로 살리되, ‘에서부터 …까지’로 범위의 양끝을 드러냈습니다.
- source_word: וְהָבִיאוּ אֵלַי
  english_pob_choice: and bring it to me
  chosen_korean: 그것을 내게 가져오십시오
  alternatives_korean:
  - 그것을 내게 가져오십시오
  - 내게 보고하십시오
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘내게 가져오라’고 하므로, POB의 지시 대상인 계수 결과를 자연스럽게 받쳐 주는 ‘그것을’로만 보완했습니다.
- source_word: מִסְפָּרָם
  english_pob_choice: their number
  chosen_korean: 그 수
  alternatives_korean:
  - 그들의 수
  - 그 숫자
  lexicon: HALOT
  rationale: 마지막 목적절의 초점은 ‘수’ 자체에 있으므로, 간결한 ‘그 수’로 옮겨 숫자를 확인하려는 뜻을 드러냈습니다.
