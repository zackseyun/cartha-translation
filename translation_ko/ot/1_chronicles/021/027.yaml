  to: 야훼께서 천사에게 말씀하셨고, 천사는 자기 칼을 칼집에 다시 넣었습니다.[a][b]
  rationale: 단순 연속 동사인 ‘말씀하셨고’로 원문의 서술 관계를 보존하고, 두 번째 절의 주어를 ‘천사’로 밝혀 히브리어 문맥상 자연스러운 지시 대상을 한국어에서 명확히 했습니다. 해석적 ‘명령’ 언급은 삭제했으며, 칼과 칼집의 소유 관계는 자연스러운 한국어 표현으로 처리했습니다.
