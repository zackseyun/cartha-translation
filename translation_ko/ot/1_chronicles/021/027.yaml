base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
  footnotes:
  - marker: a
    text: Or 'said to the angel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'put his sword back into its sheath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 천사에게 말씀하시자, 그는 자기 칼을 그 칼집에 다시 넣었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀하시자’는 직역하면 ‘말씀하셨다/말했다’에 해당하며, 문맥상 명령적 반응을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다시 넣었습니다’는 ‘그의 칼을 그 칼집에 넣다’의 자연스러운 한국어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 여기서는 신적 고유명사를 나타내는 יהוה를 한국어 관용 титул인 ‘주님’이 아니라 음역 ‘야훼’로 살려, 본문의 인명적·언약적 뉘앙스를 유지했습니다.
- source_word: לַמַּלְאָךְ
  english_pob_choice: to the angel
  chosen_korean: 천사에게
  alternatives_korean:
  - 사자에게
  - 메신저에게
  lexicon: HALOT
  rationale: 문맥상 칼을 든 하늘 존재를 가리키므로 ‘사자’보다 ‘천사’가 의미를 분명하게 전달합니다.
- source_word: וַיָּשֶׁב
  english_pob_choice: he returned
  chosen_korean: 다시 넣었습니다
  alternatives_korean:
  - 되돌렸습니다
  - 돌려보냈습니다
  - 넣었습니다
  lexicon: HALOT
  rationale: 히필 שוב의 ‘다시 돌려놓다/되돌리다’ 의미를 한국어에서는 칼을 칼집에 ‘다시 넣다’로 가장 자연스럽게 옮겼습니다.
- source_word: נְדָנָהּ
  english_pob_choice: its sheath
  chosen_korean: 그 칼집
  alternatives_korean:
  - 그 껍질
  - 그 칼집 안
  lexicon: HALOT
  rationale: נְדָן은 칼집/칼집집을 뜻하므로, 현대 한국어에서 직관적인 ‘칼집’을 사용했습니다. 소유격은 ‘그’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 주어를 누구로 드러낼 것인가
  chosen_reading: 문장 구조상 야훼께서 말씀하시고, 이어 천사가 그 명령에 응답하여 칼을 칼집에 다시 넣는 것으로 옮겼습니다.
  alternative_readings:
  - 야훼께서 직접 칼을 다시 넣으셨다고 읽는 번역
  - ‘말씀하시자’를 더 약하게 처리하는 번역
  rationale: 히브리어는 ‘야훼께서 천사에게 말씀하시고, 그가…’라는 연속 구조이므로, 실행 주체는 천사로 두되 하나님의 말씀에 따른 반응으로 드러내는 것이 문맥과 가장 잘 맞습니다.
  doctrine_reference: 서술의 주어와 실행 주체를 구분하여 본문이 말하는 행동 관계를 보존합니다.
