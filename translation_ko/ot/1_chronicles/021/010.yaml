- from: 가서 다윗에게 말하십시오. 「야훼께서 이렇게 말씀하십니다. 내가 너 앞에 셋을 놓고 있습니다. 그 가운데 하나를 너를 위해 선택하십시오. 그러면 내가 그것을 너에게 행하겠습니다.」[a]
  to: 가서 다윗에게 말하십시오. “야훼께서 이렇게 말씀하십니다. ‘내가 네 앞에 셋을 놓고 있습니다[a]. 그 가운데 하나를 스스로 택하십시오. 그러면 내가 그것을 네게 행하겠습니다.’”
  rationale: 원문의 명령형과 야훼의 직접 발화를 유지하면서, 한국어에서 부자연스러운 ‘너를 위해’를 ‘스스로’로 고쳤습니다. 또한 대상이 명시되지 않은 ‘셋’을 계속 그대로 두고, 그 불확실성과 נֹטֶה의 직역 가능성은 해당 표현에 연결한 각주로 처리했습니다.
