source:
  edition: WLC
  text: לֵךְ֩ וְ/דִבַּרְתָּ֨ אֶל דָּוִ֜יד לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁל֕וֹשׁ אֲנִ֖י נֹטֶ֣ה עָלֶ֑י/ךָ בְּחַר לְ/ךָ֛ אַחַ֥ת מֵ/הֵ֖נָּה וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
  footnotes:
  - marker: a
    text: Literally, 'Three I am stretching out/setting upon you.' The Hebrew leaves the object unstated; the sense is that the LORD is placing three options before David.
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 다윗에게 말하십시오. “야훼께서 이렇게 말씀하십니다. ‘내가 네 앞에 셋을 놓고 있습니다[a]. 그 가운데 하나를 스스로 택하십시오. 그러면 내가 그것을 네게 행하겠습니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내가 셋을 네 위에/네게 펴고 있다’라고 하며, ‘셋’이 무엇인지는 밝히지 않습니다. 여기서는 다윗 앞에 세 가지를 제시한다는 뜻으로 이해됩니다.
    reason: source_note
lexical_decisions:
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가보십시오
  lexicon: HALOT
  rationale: 히브리어 명령형의 직접성을 살려 간결하게 ‘가서’로 옮겼습니다.
- source_word: וְדִבַּרְתָּ אֶל דָּוִיד
  english_pob_choice: and speak to David
  chosen_korean: 다윗에게 말하십시오
  alternatives_korean:
  - 다윗에게 말하세요
  - 다윗에게 이야기하십시오
  lexicon: HALOT
  rationale: דבר + אֶל의 기본값인 ‘~에게 말하다’를 따랐고, 파견 명령에 맞게 공손한 명령형으로 처리했습니다.
- source_word: שָׁלֹושׁ אֲנִי נֹטֶה עָלֶיךָ
  english_pob_choice: I am setting three things before you
  chosen_korean: 내가 너 앞에 셋을 놓고 있습니다
  alternatives_korean:
  - 내가 너 앞에 세 가지를 두고 있습니다
  - 내가 너에게 셋을 펴고 있습니다
  - 내가 너 앞에 세 가지를 제시하고 있습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략한 채 ‘셋’을 네 앞에 ‘펴다/놓다’는 표현을 쓰므로, 영어 POB의 최소 보충을 따라 ‘셋을 놓고 있습니다’로 옮겨 선택지의 암시를 유지했습니다.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  english_pob_choice: Choose one of them for yourself
  chosen_korean: 그 가운데 하나를 너를 위해 선택하십시오
  alternatives_korean:
  - 그 가운데 하나를 스스로 선택하십시오
  - 그 가운데 하나를 택하십시오
  - 그 가운데 하나를 너 자신을 위해 고르십시오
  lexicon: HALOT
  rationale: בחר의 직접 명령을 ‘선택하다’로 살리고, לְךָ는 단순 재귀보다 수혜적 뉘앙스가 있어 ‘너를 위해’로 반영했습니다.
- source_word: וְאֶעֱשֶׂה לָּךְ
  english_pob_choice: and I will do it to you
  chosen_korean: 그러면 내가 그것을 너에게 행하겠습니다
  alternatives_korean:
  - 그러면 내가 그것을 너에게 하겠습니다
  - 그러면 내가 그것을 너에게 내리겠습니다
  - 그러면 내가 그것을 너에게 행할 것입니다
  lexicon: HALOT
  rationale: עשה + ל의 관계를 지나치게 해석하지 않고, 결과를 감수하는 대상 지시를 살려 ‘너에게 행하겠습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적/예언적 공식 ‘야훼께서 말씀하십니다’를 보존하기 위해, 프로젝트 기본값에 따라 고유명으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: ‘셋’의 구체화 여부
  chosen_reading: 구체 명사 없이 ‘셋’을 유지함
  alternative_readings:
  - 세 가지 형벌
  - 세 가지 징벌
  - 세 가지 선택지
  rationale: 히브리어는 여기서 대상 명사를 드러내지 않으므로, 다음 절의 설명이 나오기 전까지 의미를 과잉 규정하지 않도록 최소한으로 처리했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
