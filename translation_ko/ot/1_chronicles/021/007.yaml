  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
  footnotes:
  - marker: a
    text: Or 'was displeasing in God's eyes.' The Hebrew literally says 'was evil in the eyes of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 일은 하나님의 눈에 악하였으므로, 그분이 이스라엘을 치셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하나님의 눈에 악하였다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  english_pob_choice: was evil
  chosen_korean: 악하였으므로
  alternatives_korean:
  - 불쾌하였으므로
  - 나쁘게 여겨졌으므로
  lexicon: HALOT
  rationale: 히브리어 רעע의 강한 평가를 살려, 단순한 불쾌감보다 도덕적 악함을 드러내는 ‘악하다’를 택했습니다.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  english_pob_choice: in the sight of God
  chosen_korean: 하나님의 눈에
  alternatives_korean:
  - 하나님 보시기에
  - 하나님의 시야에서
  lexicon: HALOT
  rationale: 직역적 관용구 ‘눈에’를 살리되 한국어로 자연스럽게 읽히도록 ‘하나님의 눈에’로 옮겨, 평가의 관점을 유지했습니다.
- source_word: עַל הַדָּבָר הַזֶּה
  english_pob_choice: this matter
  chosen_korean: 이 일
  alternatives_korean:
  - 이 일에
  - 이 사건
  lexicon: HALOT
  rationale: דבר의 넓은 의미를 과도하게 좁히지 않으면서, 바로 앞의 다윗의 행위를 가리키는 말로는 ‘이 일’이 가장 간결하고 자연스럽습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 치셨습니다
  - 쳐서 넘어뜨리셨습니다
  - 치셨다
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/때리다’를 보존하되, 심판 행위로서의 주체성을 분명히 하기 위해 ‘치셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 이스라엘을 치신 주어-대상 관계
  chosen_reading: 본문이 말하는 대로, 하나님은 이 일을 악하게 보시고 그 결과 이스라엘을 치셨습니다.
  alternative_readings:
  - 이스라엘의 타격을 단순한 자연적 결과로 완화하는 읽기
  - ‘악하다’를 단지 주관적 불쾌감으로 낮추는 읽기
  rationale: 히브리어의 강한 평가(‘악하다’)와 직접적인 징계 동사(‘치다’)를 함께 보존하여, 본문이 지닌 심판의 긴장을 약화시키지 않았습니다.
  doctrine_reference: 본문의 평가와 징계를 함께 보존합니다.
