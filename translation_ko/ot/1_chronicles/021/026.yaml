- from: 그곳에서 다윗은 야훼를 위한 제단을 쌓고 번제와 화목제를 바쳤습니다. 그는 야훼께 부르짖었고, 야훼께서는 하늘에서 불로 그에게 응답하셨는데, 번제단 위에 내리셨습니다.[a]
  to: 그곳에서 다윗은 야훼를 위한 제단을 쌓고 번제와 화목제를 바쳤습니다. 그는 야훼께 부르짖었고, 야훼께서는 하늘에서 번제단 위로 불을 내리셔서 그에게 응답하셨습니다.[a]
