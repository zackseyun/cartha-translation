id: 1CH.21.26
reference: 1 Chronicles 21:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' for 'peace offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 다윗은 야훼를 위한 제단을 쌓고 번제와 화목제를 바쳤습니다. 그는 야훼께 부르짖었고, 야훼께서는 하늘에서 불로 그에게 응답하셨는데, 번제단 위에 내리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화목제’는 문자적으로는 ‘평화 제물’에 해당하며, 문맥에 따라 ‘교제 제물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן ... מִזְבֵּחַ
  english_pob_choice: built an altar
  chosen_korean: 제단을 쌓고
  alternatives_korean:
  - 제단을 건축하고
  - 제단을 만들고
  lexicon: HALOT
  rationale: מזבח는 예배·제사 맥락의 ‘제단’이 자연스럽고, וַיִּבֶן은 물리적 조립보다 제의적 설치를 드러내므로 ‘쌓고’가 간결하고 적절합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼께
  - 야훼를 위해
  lexicon: HALOT
  rationale: 여기서는 제단의 귀속 대상을 나타내므로 ‘야훼를 위한’이 제의적 용도를 분명히 하며, 단순 여격보다 목적/헌정의 뉘앙스를 살립니다.
- source_word: וַיַּעַל עֹלוֹת וּשְׁלָמִים
  english_pob_choice: offered up burnt offerings and peace offerings
  chosen_korean: 번제와 화목제를 바쳤습니다
  alternatives_korean:
  - 번제와 평화제물을 바쳤습니다
  - 번제와 교제제물을 바쳤습니다
  lexicon: HALOT
  rationale: עֹלוֹת는 ‘번제’, שְׁלָמִים은 관용적으로 ‘화목제’가 가장 직접적이며, POB의 ‘peace offerings’에 대응하되 한국어 제의 용어를 유지했습니다.
- source_word: וַיִּקְרָא אֶל יְהוָה
  english_pob_choice: He called on Yahweh
  chosen_korean: 그는 야훼께 부르짖었고
  alternatives_korean:
  - 그는 야훼를 불렀고
  - 그는 야훼께 간구했으며
  lexicon: HALOT
  rationale: 기도·호소의 관용구로서 단순 ‘부르다’보다 절박한 청원을 드러내는 ‘부르짖다’가 문맥상 더 강합니다.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ מִן הַשָּׁמַיִם
  english_pob_choice: he answered him with fire from heaven
  chosen_korean: 야훼께서는 하늘에서 불로 그에게 응답하셨는데
  alternatives_korean:
  - 야훼께서는 하늘로부터 불로 그에게 응답하셨는데
  - 야훼께서는 하늘에서 불로 그를 응답하셨는데
  lexicon: HALOT
  rationale: 응답의 주어를 분명히 하여 한국어에서 모호함을 줄였고, בָאֵשׁ는 ‘불로’가 가장 자연스럽습니다.
- source_word: עַל מִזְבַּח הָעֹלָה
  english_pob_choice: on the altar of burnt offering
  chosen_korean: 번제단 위에 내리셨습니다
  alternatives_korean:
  - 번제단에 내리셨습니다
  - 번제의 제단 위에 내리셨습니다
  lexicon: HALOT
  rationale: ‘불이…위에’라는 도착·강림 이미지를 살리기 위해 ‘위에 내리셨습니다’로 옮겼고, הָעֹלָה는 관용적으로 ‘번제단’으로 처리했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 고유 신명성을 보존하기 위해 전통적 대역어보다 음역을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 제사 용어의 현대 한국어화
  chosen_reading: שְׁלָמִים는 교회 전통의 ‘화평제’보다 제의 용어로 널리 확인되는 ‘화목제’를 사용했습니다.
  alternative_readings:
  - 화평제
  - 교제제물
  rationale: 원문 제사 체계의 범주를 유지하면서 한국어 독자가 제의적 성격을 즉시 파악하도록 했습니다.
  doctrine_reference: 'POB translation philosophy: source-transparent, auditably literal where cultic terminology is at stake'
