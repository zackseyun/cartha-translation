reference: 1 Chronicles 2:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
  footnotes:
  - marker: a
    text: Or 'the founder of Tekoa.' In genealogies, 'father of' can denote the founder or leading ancestor of a settlement or clan, not only an immediate biological father.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase 'in Caleb-ephrathah' is difficult. It may refer to a place or clan designation, traditionally rendered 'Caleb-ephrathah' or 'Caleb Ephrathah.'
    reason: alternative_reading
translation:
  language: ko
  text: 헤스론이 갈렙-에브라다에서 죽은 뒤에, 헤스론의 아내 아비야가 그에게 아슈후르를 낳았으니, 그는 드고아의 아버지입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘드고아의 창시자’입니다. 족보에서는 ‘~의 아버지’가 어떤 정착지나 씨족의 창시자 또는 대표 조상을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈렙-에브라다’는 지명인지 씨족명인지 분명하지 않아 전통적으로도 여러 방식으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר מוֹת
  english_pob_choice: After ... died
  chosen_korean: '...이 죽은 뒤에'
  alternatives_korean:
  - '...의 죽음 뒤에'
  - '...이 죽고 나서'
  lexicon: HALOT
  rationale: אַחַר + 명사구를 한국어의 자연스러운 시간 부사절로 옮기되, 사건의 선후 관계를 분명히 유지했습니다.
- source_word: בְּכָלֵב אֶפְרָתָה
  english_pob_choice: in Caleb-ephrathah
  chosen_korean: 갈렙-에브라다에서
  alternatives_korean:
  - 갈렙-에브라다 안에서
  - 갈렙 에브라다에서
  lexicon: HALOT
  rationale: 뱃 전치사의 장소적 용법을 살려 ‘에서’로 옮겼고, 두 요소가 하나의 지명/명칭처럼 결합된 형태를 보여 주기 위해 하이픈을 유지했습니다.
- source_word: וַתֵּלֶד לוֹ
  english_pob_choice: bore to him
  chosen_korean: 그에게 ...를 낳았으니
  alternatives_korean:
  - 그에게 ...를 낳았습니다
  - 그를 위해 ...를 낳았으니
  lexicon: HALOT
  rationale: 히브리어의 여격 관계를 한국어에서도 ‘그에게’로 분명히 드러내면서, 서사체에 맞게 ‘낳았으니’로 처리했습니다.
- source_word: אֲבִי תְקוֹעַ
  english_pob_choice: the father of Tekoa
  chosen_korean: 드고아의 아버지
  alternatives_korean:
  - 드고아의 창시자
  - 드고아의 조상
  lexicon: HALOT
  rationale: 족보 문맥에서 ‘아버지’가 단순한 생물학적 아버지보다 출발점/대표 조상을 뜻할 수 있으므로, 본문은 직역을 유지하고 해석적 대안을 별도로 남겼습니다.
- source_word: אַשְׁחוּר
  english_pob_choice: Ashhur
  chosen_korean: 아슈후르
  alternatives_korean:
  - 아슈르
  - 앗슈후르
  lexicon: transliteration
  rationale: 히브리어 자음과 모음값을 반영한 음역으로, 영어 전통형보다 원문 대응을 우선했습니다.
theological_decisions:
- issue: 족보에서 ‘아버지’의 의미
  chosen_reading: 본문의 ‘아버지’는 직접적 친부일 수도 있고, 마을/씨족의 창시자나 대표 조상을 가리킬 수도 있는 족보적 표현으로 보았습니다.
  alternative_readings:
  - 단순한 생물학적 아버지
  - Tekoa의 건설자/창시자
  rationale: 족보 문맥에서 אָב는 혈연 관계를 넘는 대표 조상을 가리킬 수 있으므로, 본문 번역은 중립적으로 두고 해석 가능성은 각주가 아니라 번역자 노트 성격의 대안으로만 유지했습니다.
  doctrine_reference: 족보 표현의 관용법
