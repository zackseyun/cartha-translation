id: 1CH.2.6
reference: 1 Chronicles 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֣י זֶ֗רַח זִ֠מְרִי וְ/אֵיתָ֧ן וְ/הֵימָ֛ן וְ/כַלְכֹּ֥ל וָ/דָ֖רַע כֻּלָּ֥/ם חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
  footnotes:
  - marker: a
    text: Traditional English versions often read 'Calcol' for כַלְכֹּל.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Dara'; the parallel in 1 Kings 4:31 reads 'Darda.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 세라의 아들들은 지므리, 에단, 헤만, 칼콜, 드라였습니다. 모두 다섯 명입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적 영어 성경들은 보통 이 이름을 ‘Calcol’로 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘드라’이며, 1열왕기 4:31의 평행본문은 ‘드다’입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 세라의 아들들은
  alternatives_korean:
  - 그리고 세라의 자손들은
  - 또 세라의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥의 בְּנֵי는 보통 ‘아들들’로 옮기는 것이 가장 직접적이며, 앞의 ו는 열거 구조를 살려 ‘그리고’로 처리했습니다.
- source_word: כַלְכֹּל
  english_pob_choice: Kalkol
  chosen_korean: 칼콜
  alternatives_korean:
  - 칼골
  - 칼콜(전통적으로는 칼골/갈골로도 옮김)
  lexicon: HALOT
  rationale: 히브리어 자음과 철자에 더 직접적인 음역을 택해 ‘칼콜’로 옮기고, 전통적 영어형과의 차이는 주석에서 처리할 수 있게 했습니다.
- source_word: וָדָרַע
  english_pob_choice: Dara
  chosen_korean: 드라
  alternatives_korean:
  - 다라
  - 드라(1열왕 4:31의 ‘드다’와 관련됨)
  lexicon: HALOT
  rationale: 마소라 본문의 형태를 따라 1열왕기 4:31의 평행본과 조화시키지 않고, 이 절의 히브리어에 맞게 음역했습니다.
- source_word: כֻּלָּם חֲמִשָּׁה
  english_pob_choice: five in all
  chosen_korean: 모두 다섯 명입니다
  alternatives_korean:
  - 전부 다섯 명입니다
  - 합계 다섯 명입니다
  lexicon: HALOT
  rationale: 히브리어의 총계 표현을 한국어 족보 문체에 자연스럽게 살려, 누락 없는 집계를 분명히 했습니다.
theological_decisions:
- issue: 족보 문맥의 명명 방식
  chosen_reading: 이 절은 신학적 해석을 덧붙이지 않고, 단순한 계보 목록으로 평이하게 옮겼습니다.
  alternative_readings:
  - 이름들 사이에 의미를 부여하는 해석적 번역
  - 전통 교회식 인명 표기 고정
  rationale: 본문의 목적이 계보 정보 전달이므로, 의미 확대보다 מקור 텍스트의 열거와 총계를 정확히 반영하는 쪽이 적절합니다.
  doctrine_reference: 성경 본문의 역사-계보적 증언을 있는 그대로 전달하는 원칙
- issue: 드라/드다의 평행본문 관계
  chosen_reading: 1열왕기 4:31의 ‘드다’와 평행이 있지만, 본문은 여기의 마소라 본문 형태 ‘드라’를 유지했습니다.
  alternative_readings:
  - 평행본문을 따라 ‘드다’로 조화
  - 본문 비평적 각주 없이 단일화
  rationale: 주어진 히브리어 본문을 우선시해야 하며, 평행본문 차이는 주석으로 드러내는 것이 가장 투명합니다.
  doctrine_reference: 본문 충실성과 사본 차이의 투명한 제시
