base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
  footnotes:
  - marker: a
    text: The Hebrew syntax is difficult. 'Jerioth' may be understood either as a second woman associated with Caleb or as connected appositionally with Azubah in some interpretations.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: ''her sons.'' Some interpreters understand the genealogy differently, but the Masoretic Text has a feminine singular suffix here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헤스론의 아들 갈렙은 아즈바를 아내로 맞아 자녀를 두었고, 또 여리옷을 통해서도 자녀를 두었습니다. 그리고 그 자녀들은 이러합니다. 예셀, 쇼밥, 아르돈입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 어렵습니다. 여리옷은 갈렙과 연결된 또 다른 여인으로 볼 수도 있고, 일부 해석에서는 아즈바와 동격으로 볼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그녀의 아들들’입니다. 일부 해석은 족보를 다르게 이해하지만, 마소라 본문은 여기서 여성 단수 접미사를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered children by
  chosen_korean: 아내로 맞아 자녀를 두었고, 또 …를 통해서도 자녀를 두었습니다
  alternatives_korean:
  - 낳았습니다
  - 아들을 낳았습니다
  - 자녀를 낳았습니다
  lexicon: HALOT
  rationale: 히필 형태의 ילד는 ‘낳다/아들을 두다’의 뜻이지만, 이어지는 여인 이름들과의 관계를 자연스럽게 드러내기 위해 한국어에서는 출산 행위를 직접 반복하기보다 관계를 풀어 썼습니다.
- source_word: אִשָּׁה
  english_pob_choice: his wife
  chosen_korean: 아내
  alternatives_korean:
  - 여자
  - 부인
  lexicon: HALOT
  rationale: 족보 문맥에서는 אִשָּׁה가 일반적인 ‘여자’보다 ‘아내’로 읽히는 것이 가장 자연스럽고, 한국어에서도 관계를 분명히 하는 표현이 됩니다.
- source_word: יְרִיעוֹת
  english_pob_choice: Jerioth
  chosen_korean: 여리옷
  alternatives_korean:
  - 예리옷
  - 제리옷
  lexicon: transliteration
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역했습니다.
- source_word: וְאֵלֶּה בָנֶיהָ
  english_pob_choice: and these were her sons
  chosen_korean: 그리고 그 자녀들은 이러합니다
  alternatives_korean:
  - 그리고 이들은 그녀의 아들들입니다
  - 그리고 이것들은 그녀의 아들들입니다
  lexicon: HALOT
  rationale: 히브리어의 여성 단수 접미사는 본문상 유지해야 하지만, 한국어에서는 성별을 과도하게 단정하기보다 ‘자녀들’로 옮겨 족보 문맥을 살리면서도 문법적 긴장을 과하게 해소하지 않도록 했습니다.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  english_pob_choice: Jesher, Shobab, and Ardon
  chosen_korean: 예셀, 쇼밥, 아르돈
  alternatives_korean:
  - 예셸, 쇼밥, 아르돈
  lexicon: transliteration
  rationale: 개인명은 음역했고, 표준적으로 읽히는 한국어 음가에 맞춰 옮겼습니다.
theological_decisions:
- issue: 여리옷과 아즈바의 관계가 모호한 족보 구문
  chosen_reading: 본문의 긴장을 풀지 않고, 갈렙이 아즈바와 여리옷을 통해 자녀를 두었다는 식으로 두 여인 모두를 문면대로 살렸습니다.
  alternative_readings:
  - 여리옷을 아즈바와 동격으로 볼 수 있음
  - 여리옷을 별도의 두 번째 여인으로 볼 수 있음
  - 족보 재구성을 통해 소속을 재배열할 수 있음
  rationale: 이 절은 교리 문제가 아니라 문법·구문상의 난점이므로, 마소라 본문의 애매함을 그대로 보존하는 것이 번역 원칙에 더 부합합니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 해석적 긴장을 임의로 제거하지 않음'
