  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: ko
  text: 요나단의 아들들은 펠렛과 자자였습니다. 이들은 여라므엘의 아들들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: ~의 아들들은
  alternatives_korean:
  - 그리고 ~의 아들들은
  - ~의 아들들
  lexicon: WLC/HALOT
  rationale: 족보 문맥에서 בְּנֵי는 자연스럽게 ‘아들들’로 옮기되, 앞의 ו는 한국어에서 문맥 연결로 처리하여 간결하게 표현했습니다.
- source_word: פֶּלֶת
  english_pob_choice: Peleth
  chosen_korean: 펠렛
  alternatives_korean:
  - 페레트
  - 펠레트
  lexicon: WLC/HALOT
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다.
- source_word: וְזָזָא
  english_pob_choice: and Zaza
  chosen_korean: 자자
  alternatives_korean:
  - 그리고 자자
  - 사사
  lexicon: WLC/HALOT
  rationale: 두 번째 이름은 한국어에서 앞의 ‘와’ 없이 나열하는 것이 자연스러워 단순 음역으로 처리했습니다.
- source_word: אֵלֶּה הָיוּ
  english_pob_choice: These were
  chosen_korean: 이들은 …였습니다
  alternatives_korean:
  - 이들이었습니다
  - 이들은 …였습니다
  lexicon: WLC/HALOT
  rationale: 지시대명사와 계사 구조를 한국어 족보 문체에 맞게 ‘이들은 …였습니다’로 옮겨, 앞선 이름들을 가리키는 요약 기능을 살렸습니다.
theological_decisions:
- issue: 족보 문장의 반복적 계보 확인 방식
  chosen_reading: 두 번의 진술을 모두 유지해, 이름 제시와 계보 소속 확인을 분명히 했습니다.
  alternative_readings:
  - 두 번째 문장을 생략해 한 문장으로 압축
  - ‘~의 자손’으로 일반화
  rationale: 본문은 이름 나열과 ‘여라므엘의 아들들’이라는 확인을 함께 제시하므로, 족보적 확정성을 보존하는 것이 적절합니다.
  doctrine_reference: 성경 족보의 역사성/문맥 충실성
- issue: 문체의 합쇼체 적용
  chosen_reading: 서술은 합쇼체로 유지하되, 인명과 족보 항목은 평이한 현대 문체로 처리했습니다.
  alternative_readings:
  - 고어체 족보 문체
  - 보다 구어적인 서술
  rationale: 본문의 간결한 계보 형식을 현대 표준어로 투명하게 재현하기 위한 선택입니다.
  doctrine_reference: 번역 문체 일관성
