  lexicon: WLC/HALOT
  rationale: 족보 문맥에서 בְּנֵי는 자연스럽게 ‘아들들’로 옮기되, 앞의 ו는 한국어에서 문맥 연결로 처리하여 간결하게 표현했습니다.
- source_word: פֶּלֶת
