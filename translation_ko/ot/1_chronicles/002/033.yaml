  - 펠레트
  lexicon: WLC/HALOT
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다.
- source_word: וְזָזָא
  english_pob_choice: and Zaza
  chosen_korean: 자자
  alternatives_korean:
  - 그리고 자자
  - 사사
  lexicon: WLC/HALOT
  rationale: 두 번째 이름은 한국어에서 앞의 ‘와’ 없이 나열하는 것이 자연스러워 단순 음역으로 처리했습니다.
- source_word: אֵלֶּה הָיוּ
  english_pob_choice: These were
  chosen_korean: 이들은 …였습니다
