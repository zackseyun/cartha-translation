  text: וְ/לֹֽא הָיָ֧ה לְ/שֵׁשָׁ֛ן בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וּ/לְ/שֵׁשָׁ֛ן עֶ֥בֶד מִצְרִ֖י וּ/שְׁמ֥/וֹ יַרְחָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian slave whose name was Jarha.
  footnotes:
  - marker: a
    text: Or 'servant.' The Hebrew עֶבֶד can denote a servant or a slave; here 'slave' is chosen to preserve the bonded-status sense of the term.
    reason: lexical_alternative
translation:
  language: ko
  text: 스산은 아들이 없고 딸들만 있었습니다. 그리고 스산에게는 이집트 출신의 노예가 있었는데, 그의 이름은 야르하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종’. 히브리어 עֶבֶד는 종이나 노예를 뜻할 수 있지만, 여기서는 묶인 신분의 의미를 살리기 위해 ‘노예’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  english_pob_choice: Sheshan had
  chosen_korean: 스산은 … 있었습니다
  alternatives_korean:
  - 스산에게는 … 있었습니다
  - 스산에게 속해 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘~에게/~를 위해 있다’는 소유 관계를 한국어에서는 자연스럽게 ‘있었습니다’로 풀어 옮겼습니다.
- source_word: בָּנִים
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 아들들
  lexicon: HALOT
  rationale: 뒤의 ‘딸들’과의 성별 대조를 살리기 위해 포괄적인 ‘자녀들’보다 ‘아들들’이 적합합니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  lexicon: HALOT
  rationale: POB가 본문에서 bonded-status를 드러내기 위해 ‘slave’를 택한 점을 따라, 한국어도 의미를 약화시키지 않는 ‘노예’를 사용했습니다.
- source_word: מִצְרִי
  english_pob_choice: Egyptian
  chosen_korean: 이집트 출신의
  alternatives_korean:
  - 이집트 사람인
  - 애굽의
  lexicon: HALOT
  rationale: 명사의 민족/출신 배경을 현대 한국어에서 자연스럽게 드러내기 위해 ‘이집트 출신의’로 옮겼습니다.
