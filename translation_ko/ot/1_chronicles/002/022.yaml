  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: ko
  text: 스굽은 야이르를 낳았습니다. 그에게는 길르앗 땅에 있는 성읍이 스물셋 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 아버지가 되었습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 히필 ילד는 ‘낳다/생기게 하다’의 계보적 의미를 가지므로, 현대 한국어에서는 자연스럽고 직접적인 ‘낳았습니다’가 적절합니다.
- source_word: יָאִיר
  english_pob_choice: Jair
  chosen_korean: 야이르
  alternatives_korean:
  - 자이르
  - 야일
  lexicon: 표준 음역
  rationale: 고유명사는 현대 음역에 따라 옮기되, 한국어 성경에서 널리 쓰이는 형태보다 원어 음가를 살린 ‘야이르’를 택했습니다.
- source_word: וַיְהִי לוֹ
  english_pob_choice: and he had
  chosen_korean: 그에게는 ... 있었습니다
  alternatives_korean:
  - 그의 소유가 되었습니다
  - 그에게 속한 것이 있었습니다
  lexicon: HALOT
  rationale: ‘있다/가지다’의 소유 관계를 한국어 자연문으로 풀어, 영어 POB의 ‘and he had’와 같은 소유 의미를 분명하게 드러냈습니다.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  english_pob_choice: twenty-three
  chosen_korean: 스물셋
  alternatives_korean:
  - 이십삼
  - 스물세
  lexicon: HALOT
  rationale: 수사 표현은 현대 한국어에서 가장 자연스러운 ‘스물셋’을 사용하되, 뒤의 ‘성읍이’와의 호응을 위해 서술 구조를 매끈하게 했습니다.
- source_word: עָרִים
  english_pob_choice: cities
  chosen_korean: 성읍
  alternatives_korean:
  - 도시
  - 읍
  lexicon: HALOT
  rationale: 지리적·행정적 단위로서 성경 문맥에 맞는 전통적이면서도 중립적인 한국어 ‘성읍’을 택했습니다.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  english_pob_choice: in the land of Gilead
  chosen_korean: 길르앗 땅에 있는
  alternatives_korean:
  - 길르앗에 있는
  - 길르앗 지방에 있는
  lexicon: HALOT
  rationale: ‘땅’(אֶרֶץ)과 지명 결합은 단순한 장소명보다 영토 범위를 가리키므로, ‘길르앗 땅’으로 옮겨 원문의 지리 감각을 보존했습니다.
