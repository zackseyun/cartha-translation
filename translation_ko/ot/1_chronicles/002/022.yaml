  source_fidelity: 히필 הוֹלִיד의 계보적 의미를 ‘낳았습니다’로, וַיְהִי לוֹ의 소유 표현을 ‘그에게는 … 있었습니다’로 충실히 옮겼습니다. 히브리어의 לוֹ가 가리키는 대상에 관한 문맥적 여지는 한국어 대명사 ‘그’에도 그대로 남아 있어 불필요하게 확정하지 않습니다. ‘길르앗 땅’과 성읍의 수량도 원문과 일치합니다.
  naturalness: 합쇼체로 일관되며, 족보·영토 진술이라는 문맥에서 ‘스굽은 야이르를 낳았습니다’와 ‘성읍이 스물셋 있었습니다’는 자연스럽고 이해 가능합니다. ‘성읍’은 다소 성경적인 어휘이나 현대 표준어에서 통용되고 본문의 고대 지리적 단위를 적절히 나타냅니다.
  terminology: 스굽, 야이르, 길르앗은 제시된 음역 원칙 안에서 일관됩니다. ‘성읍’은 עָרִים의 도시·취락 단위를 무리 없이 전달하며, 신학적 용어 또는 교파적 해석이 추가되지 않았습니다.
