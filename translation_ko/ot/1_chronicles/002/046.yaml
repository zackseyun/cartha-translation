translation:
  language: ko
  text: 에바는, 갈렙의 첩으로서, 하란과 모사와 가셋을 낳았습니다. 그리고 하란은 가셋을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하란이 가셋의 아버지가 되었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
  - 후궁
  - 부녀
  lexicon: HALOT
  rationale: 히브리어 פִּילֶגֶשׁ은 정식 아내보다 낮은 지위를 가진 인정된 배우자 관계를 가리키므로, 한국어에서는 문맥상 가장 직접적인 대응어인 ‘첩’이 적절합니다.
- source_word: יָלְדָה / הֹלִיד
  english_pob_choice: bore / fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 아버지가 되었습니다
  - 낳아 주었습니다
  lexicon: HALOT
  rationale: 족보 문맥에서는 여성 주어와 남성 주어 모두 ‘낳다’로 자연스럽게 옮길 수 있어, 반복되는 출생 관계를 간결하게 드러내는 ‘낳았습니다’를 택했습니다.
- source_word: עֵיפָה
  english_pob_choice: Ephah
  chosen_korean: 에바
  alternatives_korean:
  - 에파
  lexicon: 현대 외래어 표기
  rationale: 고유명사는 한국어 음역 관행에 따라 ‘에바’로 옮기되, 성서 인명으로서 자연스럽게 읽히도록 했습니다.
- source_word: מוֹצָא
  english_pob_choice: Moza
  chosen_korean: 모사
  alternatives_korean:
  - 모자
  - 모차
  lexicon: 현대 외래어 표기
  rationale: 원어 자음 배열과 한국어 성서 음역 관행을 고려해 ‘모사’로 옮겼습니다.
- source_word: גָּזֵז
  english_pob_choice: Gazez
  chosen_korean: 가셋
  alternatives_korean:
  - 가제즈
  - 가제스
  lexicon: 현대 외래어 표기
  rationale: 고유명사는 반복되는 두 출현을 동일하게 처리해야 하므로, 한국어 음역으로 ‘가셋’을 일관되게 사용했습니다.
theological_decisions:
- issue: 족보에서 동일 인물(하란)에게 두 번의 생식 동사가 적용되는 구조
  chosen_reading: 첫 절은 에바가 하란·모사·가셋을 낳은 것으로, 뒤의 절은 하란이 다시 가셋을 낳은 것으로 그대로 살려 중복 표기를 보존했습니다.
  alternative_readings:
  - 문장 구조를 정리해 하나의 출생 관계로 통합하는 방식
  - 하란이 가셋의 아버지가 되었다고 풀어 쓰는 방식
  rationale: 원문은 하란과 가셋의 관계를 두 번 진술하여 족보상의 중복/변형 전승 가능성을 드러내므로, 이를 매끄럽게 제거하지 않고 그대로 노출해야 합니다.
  doctrine_reference: 본문 비평 및 족보 전승의 보존 원칙
