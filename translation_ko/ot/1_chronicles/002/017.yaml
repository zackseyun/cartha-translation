  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
  footnotes:
  - marker: a
    text: Some manuscripts and the parallel in 2 Samuel 17:25 read 'Ithra the Israelite' instead of 'Jether the Ishmaelite.' The Masoretic Text here reads 'Jether the Ishmaelite.'
    reason: textual_variant
translation:
  language: ko
  text: 아비가일은 아마사를 낳았고, 아마사의 아버지는 이스마엘 사람 예델이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 평행 본문인 사무엘하 17:25는 ‘이스라엘 사람 이델’로 읽습니다. 여기 마소라 본문은 ‘이스마엘 사람 예델’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַאֲבִיגַ֕יִל יָלְדָ֖ה
  english_pob_choice: Abigail bore
  chosen_korean: 아비가일은 ... 낳았고
  alternatives_korean:
  - 아비가일이 ...를 낳았고
  - 아비가일이 ...를 출산했고
  lexicon: HALOT
  rationale: 여성 주어가 ילד를 취하는 계보 문맥에서는 ‘낳다’가 가장 자연스럽고 간결하며, 영어 POB의 ‘bore’가 담은 출산·계보 표지를 그대로 살립니다.
- source_word: עֲמָשָׂ֑א
  english_pob_choice: Amasa
  chosen_korean: 아마사
  alternatives_korean:
  - 아마사아
  - 아마사
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 인명은 현대 외래어 표기 관행에 따라 음역하고, 한국어 성경에서 널리 통용되는 형태로 옮겼습니다.
- source_word: וַאֲבִ֣י עֲמָשָׂ֔א
  english_pob_choice: and the father of Amasa
  chosen_korean: 아마사의 아버지는
  alternatives_korean:
  - 그리고 아마사의 아버지는
  - 아마사의 아버지는
  lexicon: HALOT
  rationale: 구문상 ‘아마사의 아버지’라는 소유·계보 관계를 한국어에서 가장 자연스럽게 드러내는 방식으로 옮겼습니다.
- source_word: יֶ֖תֶר הַיִּשְׁמְעֵאלִֽי
  english_pob_choice: Jether the Ishmaelite
  chosen_korean: 이스마엘 사람 예델
  alternatives_korean:
  - 이슈마엘 사람 예델
  - 이스마엘 사람 이델
  lexicon: HALOT
  rationale: 지칭어는 문자적으로 ‘이스마엘 사람’이므로 이를 살리고, 이름 יֶתֶר는 예델로 음역했습니다. 정관사가 붙은 민족명은 한국어에서 관사 없이도 식별이 가능하므로 ‘the’는 따로 옮기지 않았습니다.
theological_decisions:
- issue: 계보 진술의 압축성
  chosen_reading: ‘아비가일은 아마사를 낳았고, 아마사의 아버지는 이스마엘 사람 예델이었습니다’로 두 진술을 병렬 유지했습니다.
  alternative_readings:
  - ‘아비가일이 아마사를 낳았고, 아마사의 아버지는 이스마엘 사람 예델이었습니다’
  - ‘아비가일은 아마사를 낳았으며, 아마사의 아버지는 이스마엘 사람 예델이었습니다’
  rationale: 히브리어는 두 번째 절에서 계보 정보를 다시 확인시키는 방식이므로, 한국어도 설명을 덧붙이지 않고 중복 구조를 유지해 문장 표면의 간결함과 계보적 강조를 보존했습니다.
  doctrine_reference: 본문의 계보적 진술 보존 원칙
