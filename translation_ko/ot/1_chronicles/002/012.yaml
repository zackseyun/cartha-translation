lexical_decisions:
- source_word: וּ/בֹעַז
  english_pob_choice: Boaz
  chosen_korean: 보아스
  alternatives_korean:
  - 보아즈
  - 보아즈
  lexicon: 고유명사 관례
  rationale: 히브리어 고유명사는 한국어 성경에서 널리 정착된 형태인 ‘보아스’를 따르는 것이 가장 자연스럽습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 자녀를 두었습니다
  - 낳게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥의 히필 ילד는 ‘사생하다/낳다’의 계열로 이해되며, 한국어에서는 생생하고 간결한 족보 표현인 ‘낳았습니다’가 가장 직접적입니다.
- source_word: עוֹבֵד
  english_pob_choice: Obed
  chosen_korean: 오벳
  alternatives_korean:
  - 오베드
  lexicon: 고유명사 관례
  rationale: 히브리어 고유명사는 한국어 성경의 관례형인 ‘오벳’을 사용했습니다.
- source_word: יִשָׁי
  english_pob_choice: Jesse
  chosen_korean: 이새
  alternatives_korean:
  - 예시
  lexicon: 고유명사 관례
  rationale: 히브리어 이름 יִשָׁי는 한국어 성경에서 통용되는 ‘이새’가 표준적이며 가독성도 높습니다.
theological_decisions:
- issue: 족보 서술의 동사 시제와 문체
  chosen_reading: 과거 서술형으로 옮기되, 족보의 단정적 연결을 살려 ‘낳았습니다’로 반복했습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’처럼 완곡하게 표현
  - ‘낳았고 … 낳았습니다’의 연결을 느슨하게 처리
  rationale: 원문은 인물 간 출생 계보를 간단히 연결하는 족보 문장입니다. 한국어에서도 그 단정성과 리듬을 유지하는 것이 본문 기능에 가장 충실합니다.
  doctrine_reference: 족보 본문 일반
- issue: 인명 표기
  chosen_reading: 전통적으로 정착된 한국어 성경 인명형(보아스, 오벳, 이새)을 유지했습니다.
  alternative_readings:
  - 히브리어 음역형을 일관되게 새로 제시
  rationale: 이 절은 교리적 긴장이 있는 본문이 아니라 족보 기록이므로, 독자 친숙성과 본문 식별성을 위해 정착형 인명을 택했습니다.
  doctrine_reference: 고유명사 번역 관행
