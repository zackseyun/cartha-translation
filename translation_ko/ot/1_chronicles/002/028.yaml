  source_fidelity: 히브리어는 오남의 아들 둘을 제시한 뒤, 접속사 וּ와 함께 샴마이의 아들 둘을 이어 제시합니다. 초안은 두 계보 관계와 인명들을 정확히 반영합니다. 다만 שַׁמַּי에는 מ의 중복(다게쉬)이 있으므로, 음역 원칙을 따른다면 '샴마이'가 '샤마이'보다 원문 형태를 더 충실히 드러냅니다. 두 번째 절에 '였습니다'를 보충한 것은 히브리어의 명사절을 한국어의 완전한 문장으로 자연스럽게 옮긴 것입니다.
  naturalness: 문장은 간결하고 현대 표준 한국어의 합쇼체에 맞습니다. 족보 문맥에서 '아들은 …였습니다'의 반복은 자연스럽고 명료합니다. 히브리어 접속사 וּ를 두 번째 문장에서 별도의 '그리고'로 옮기지 않은 것도 한국어 문체상 무방합니다.
