revisions:
- from: '그리고 갈미의 아들들은 이렇습니다: 아할, 이스라엘을 괴롭게 한 자이며, 거룩하게 바쳐진 것들에 대해 신실하지 않게 행동한 사람입니다.[a][b]'
  to: 갈미의 아들은 아갈입니다[a]. 그는 이스라엘을 괴롭게 한 자이며, 진멸하도록 바쳐진 물건[b]을 두고 신의를 저버린 사람입니다.
  rationale: 원문 철자에 맞추어 인명을 ‘아갈’로 바로잡고, חֵרֶם의 정관사 단수를 ‘물건’으로 보존했습니다. 또한 진멸에 바쳐진 것이라는 핵심 의미를 본문과 각주에서 명료하게 드러냈으며, 각주 표지를 해당 어구 바로 뒤로 옮겼습니다. 영어 POB의 복수형은 채택하지 않았는데, 원문의 단수와 한국어의 자연스러운 지시성을 보존하기 위해서입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:47Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 히브리어 בַּחֵרֶם은 정관사가 붙은 단수이며, 문맥상 여리고에서 진멸에 바쳐진 특정 물건/전리품을 가리킵니다. 영어 감사 이력의 복수형은 원문보다 문맥적 집합 의미를 앞세운 것이지만, 한국어 본문은 원문의 단수를 보존하는 편이 안전합니다. 또한 עָכָר의 음역은 ‘아할’보다 ‘아갈’이 히브리어 자음과 한국어 성서 이름 표기에 더 적절합니다.
  naturalness: 현 문장은 ‘이렇습니다’ 뒤의 명사구와 ‘…사람입니다’가 다소 설명문처럼 길며, 두 각주가 문장 끝에 함께 놓여 각각의 선행어를 즉시 가리키지 못합니다. 두 문장으로 나누고 각주를 해당 낱말 뒤에 배치하면 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: ‘진멸하도록 바쳐진 물건’은 חֵרֶם의 봉헌과 파괴/금지의 의미를 함께 드러내며, ‘거룩하게’라는 원문에 명시되지 않은 수식은 피합니다. מָעַל은 이 문맥에서 단순한 부주의가 아니라 신의의 배반을 뜻하므로 ‘신의를 저버린’으로 옮겼습니다.
  issues:
  - severity: medium
    issue: עָכָר의 음역이 ‘아할’로 되어 있음
    rationale: 히브리어 עָכָר의 마지막 자음 ר는 한국어 음역에서 ‘ㄹ’보다 ‘ㄹ/갈’ 계열로 반영되어야 하며, 한국어 성서 전통의 ‘아갈’도 이를 뒷받침합니다. ‘아할’은 자음 대응이 부정확합니다.
  - severity: medium
    issue: בַּחֵרֶם을 복수 ‘것들’로 번역함
    rationale: 원문은 정관사 단수입니다. 영어 감사 이력에는 복수형이 있으나, 원문 우선 원칙에 따라 한국어 본문은 단수로 유지해야 합니다.
  - severity: low
