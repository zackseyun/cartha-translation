id: 1CH.2.7
reference: 1 Chronicles 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
  footnotes:
  - marker: a
    text: Or, 'Achan.' Chronicles uses the form 'Achar,' likely echoing the Hebrew word for 'troubler.' See Joshua 7.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the devoted thing'; that is, what had been placed under the ban, devoted to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 갈미의 아들은 아갈입니다[a]. 그는 이스라엘을 괴롭게 한 자이며, 진멸하도록 바쳐진 물건[b]을 두고 신의를 저버린 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아간’. 역대기는 ‘아갈’이라는 형태를 쓰는데, 이는 아마도 ‘괴롭게 하는 자’라는 뜻의 히브리어 말과 연결한 표현으로 보입니다. 여호수아 7장을 보십시오.
    reason: alternative_reading
  - marker: b
    text: 히브리어로는 ‘진멸하도록 바쳐진 물건’입니다. 곧 파괴를 위해 하나님께 바쳐져 금지된 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 갈미의 아들들은
  alternatives_korean:
  - 그리고 갈미의 자손들은
  - 갈미의 아들들은
  lexicon: WLC/HALOT
  rationale: 족보 문맥의 בְּנֵי는 한국어에서 보통 ‘아들들’로 옮기는 것이 가장 자연스럽고, 연결어 ‘그리고’로 새 항목의 시작을 드러냈습니다.
- source_word: עָכָר
  english_pob_choice: Achar
  chosen_korean: 아할
  alternatives_korean:
  - 아차르
  - 아간
  lexicon: WLC/HALOT
  rationale: 역대기의 표기 עָכָר를 본문 형태대로 옮겨야 하므로, 여호수아의 익숙한 ‘아간’으로 평준화하지 않고 음역을 유지했습니다.
- source_word: עוֹכֵר יִשְׂרָאֵל
  english_pob_choice: the troubler of Israel
  chosen_korean: 이스라엘을 괴롭게 한 자
  alternatives_korean:
  - 이스라엘의 괴롭히는 자
  - 이스라엘을 어지럽힌 자
  lexicon: HALOT
  rationale: עוֹכֵר의 말장난 효과를 살리기 위해 ‘괴롭게 한 자’로 간결하게 옮겼고, 명사형 수식으로 인명과 병렬되는 호칭성을 유지했습니다.
- source_word: מָעַל
  english_pob_choice: acted unfaithfully
  chosen_korean: 신실하지 않게 행동한
  alternatives_korean:
  - 불신실하게 행한
  - 언약을 어긴
  lexicon: HALOT
  rationale: מָעַל의 핵심은 단순한 실수보다 신실함의 위반이므로, 본문의 도덕·언약적 무게를 살려 ‘신실하지 않게 행동한’으로 옮겼습니다.
- source_word: בַּחֵרֶם
  english_pob_choice: regarding the devoted things
  chosen_korean: 거룩하게 바쳐진 것들에 대해
  alternatives_korean:
  - 바쳐진 것들에 대해
  - 진멸하기로 바쳐진 것들에 대해
  - 바른 것들에 대해
  lexicon: HALOT
  rationale: חֵרֶם은 전적으로 하나님께 속하도록 바쳐진 것, 곧 멸망에 넘겨진 것이라는 긴장이 있어, 본문에서는 그 의미를 드러내는 ‘거룩하게 바쳐진 것들’로 옮겼습니다.
theological_decisions:
- issue: חֵרֶם의 의미를 한국어 본문에서 어떻게 드러낼지
  chosen_reading: 거룩하게 바쳐진 것들
  alternative_readings:
  - 바쳐진 것들
  - 진멸 대상인 것들
  - 저주 아래 놓인 것들
  rationale: 이 용어는 단순한 ‘금지물’보다 성별과 심판의 의미를 함께 지니므로, 본문 가독성을 해치지 않으면서 그 긴장을 보존하는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §3, §5
