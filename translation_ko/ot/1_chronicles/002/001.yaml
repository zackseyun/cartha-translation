  lexicon: HALOT
  rationale: 본문은 인물의 설명보다 고유명사 ‘이스라엘’을 사용하므로, 해석으로 바꾸지 않고 고유명사 그대로 유지합니다.
- source_word: וִיהוּדָה
  english_pob_choice: and Judah
  chosen_korean: 그리고 유다
  alternatives_korean:
  - 유다
