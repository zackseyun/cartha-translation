  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ko
  text: 이들은 이스라엘의 아들들입니다. 르우벤, 시므온, 레위, 유다, 잇사갈, 스불론입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  english_pob_choice: These are
  chosen_korean: 이들은 ...입니다
  alternatives_korean:
  - 이들은 ...입니다
  - 이는 ...입니다
  lexicon: HALOT
  rationale: 계보 표제의 도입구로서 지시 복수는 한국어에서 주어를 앞세운 현재형 진술로 자연스럽게 옮기는 것이 가장 명료합니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 후손들
  lexicon: HALOT
  rationale: 히브리어는 이스라엘의 남성 계보 항목들을 직접 제시하므로, 넓은 의미의 ‘자녀들’이나 후대적 ‘후손들’보다 직역성이 높은 ‘아들들’이 source-direct합니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 본문은 인물의 설명보다 고유명사 ‘이스라엘’을 사용하므로, 해석으로 바꾸지 않고 고유명사 그대로 유지합니다.
- source_word: וִיהוּדָה
  english_pob_choice: and Judah
  chosen_korean: 그리고 유다
  alternatives_korean:
  - 유다
  - 및 유다
  lexicon: HALOT
  rationale: 원문 접속사 וְ를 살려 목록의 마지막 전개를 자연스럽게 연결했습니다.
