  - 단순 지명 나열로 보기
  rationale: 문맥이 살마의 후손 목록이므로, 각 항목은 개인보다 집단·씨족을 가리키는 것으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 역대상 2장 계보 구조
