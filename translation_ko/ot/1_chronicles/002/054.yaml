  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֣י שַׂלְמָ֗א בֵּ֥ית לֶ֨חֶם֙ וּ/נְט֣וֹפָתִ֔י עַטְר֖וֹת בֵּ֣ית יוֹאָ֑ב וַ/חֲצִ֥י הַ/מָּנַחְתִּ֖י הַ/צָּרְעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
  footnotes:
  - marker: a
    text: Or possibly “the Menuhothites” for “the Manahathites.” The Hebrew gentilic is uncertain in its precise place-name association.
    reason: lexical_alternative
  - marker: b
    text: Or “the Zareathites,” that is, people associated with Zorah.
    reason: lexical_alternative
translation:
  language: ko
  text: 살마의 자손은 베들레헴[a], 느도바 사람들, 아트롯-베스-요압, 마나핫 사람들의 절반[b], 소라 사람들입니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘메누홋 사람들’일 수 있습니다. 히브리어 집단명은 어떤 지명과 연결되는지 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소라 사람들’, 곧 소라와 관련된 사람들로 볼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: The sons of
  chosen_korean: 자손은
  alternatives_korean:
  - 아들들은
  - 후손들은
  lexicon: HALOT
  rationale: 계보 목록에서 בְּנֵי는 단순한 직계 아들보다 후손 집단을 가리키는 경우가 많아, 한국어에서는 자연스럽게 ‘자손’으로 옮겨 계보적 의미를 살렸습니다.
- source_word: בֵּית לֶחֶם
  english_pob_choice: Bethlehem
  chosen_korean: 베들레헴
  alternatives_korean:
  - 베들레헴 사람들
  - 베들레헴 족속
  lexicon: HALOT
  rationale: POB가 고유지명을 유지한 점을 따라 음역형으로 두되, 이 문맥에서는 베들레헴과 관련된 집단을 가리키는 것으로 읽힙니다.
- source_word: וּ/נְטוֹפָתִי
  english_pob_choice: the Netophathites
  chosen_korean: 느도바 사람들
  alternatives_korean:
  - 느도바인들
  - 느도바 족속
  lexicon: HALOT
  rationale: 히브리어는 지명 유래의 집단명(gentilic)이므로 ‘사람들’로 풀어 자연스럽게 처리했습니다.
- source_word: הַמָּנַחְתִּי
  english_pob_choice: the Manahathites
  chosen_korean: 마나핫 사람들
  alternatives_korean:
  - 마나핫인들
  - 메누홋 사람들
  lexicon: HALOT
  rationale: 히브리어 형태는 집단명으로 읽는 것이 자연스러워 ‘사람들’로 옮겼고, 전승상 지명 연결의 불확실성은 각주로 남겼습니다.
- source_word: הַצָּרְעִי
  english_pob_choice: the Zorites
  chosen_korean: 소라 사람들
  alternatives_korean:
  - 소라 족속
  - 소라이트들
  lexicon: HALOT
  rationale: 이 형용사는 소라와 관련된 사람들을 뜻하는 집단명으로 이해되어, 한국어에서도 지명 연관이 드러나도록 ‘소라 사람들’로 옮겼습니다.
theological_decisions:
