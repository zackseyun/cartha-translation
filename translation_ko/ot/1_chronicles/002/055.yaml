revisions:
- from: 그리고 서기관들의 가문들은 야베스에 살았으니, 티라스 사람들[a], 시므앗 사람들, 수가 사람들입니다. 이들은 하맛에서 온 켄 사람들로서, 레갑 가문의 조상입니다.
  to: 또 야베스에 살던 서기관들의 가문들은 티라앗 사람들, 시므앗 사람들, 수갓 사람들이었습니다. 이들은 레갑 가문의 조상인 하맛[a]에게서 나온 겐 사람들입니다.
  rationale: 하맛이 레갑 가문의 조상이라는 원문의 동격 관계를 ‘레갑 가문의 조상인 하맛’으로 명확히 했습니다. 족속명은 히브리어 형태를 더 충실히 반영하도록 조정했으며, 각주 앵커를 해당 어구로 옮기고 한국어로 정리했습니다. ‘하맛에게서 나온’은 이동과 기원의 여지를 함께 남겨 둡니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:50Z'
