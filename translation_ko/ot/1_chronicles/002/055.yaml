source:
  edition: WLC
  text: וּ/מִשְׁפְּח֤וֹת סֹפְרִים֙ ישבו יַעְבֵּ֔ץ תִּרְעָתִ֥ים שִׁמְעָתִ֖ים שׂוּכָתִ֑ים הֵ֚מָּה הַ/קִּינִ֣ים הַ/בָּאִ֔ים מֵ/חַמַּ֖ת אֲבִ֥י בֵית רֵכָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
  footnotes:
  - marker: a
    text: Or 'the ancestor/founder of the house of Rechab.' The Hebrew 'father' often denotes a progenitor or founder in genealogical contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 서기관들의 가문들은 야베스에 살았으니, 티라스 사람들[a], 시므앗 사람들, 수가 사람들입니다. 이들은 하맛에서 온 켄 사람들로서, 레갑 가문의 조상입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레갑 가문의 조상/시조’입니다. 히브리어의 ‘아버지’는 족보 문맥에서 종종 progenitor를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  english_pob_choice: and the families of the scribes
  chosen_korean: 서기관들의 가문들
  alternatives_korean:
  - 서기관들의 가족들
  - 서기관들의 집안들
  lexicon: HALOT
  rationale: מִשְׁפְּחוֹת는 단순 가족보다 혈연·집단적 ‘가문/집안’에 가깝고, סֹפְרִים은 표준적으로 ‘서기관들’이 가장 직접적입니다.
- source_word: ישבו יַעְבֵּץ
  english_pob_choice: who lived at Jabez
  chosen_korean: 야베스에 살았으니
  alternatives_korean:
  - 야베스에 거주했으니
  - 야베스에서 살았으니
  lexicon: HALOT
  rationale: 복수 완료형의 거주 의미를 자연스러운 서술로 옮기되, 장소 표지를 분명히 하기 위해 ‘에’ 표현을 사용했습니다.
- source_word: תִּרְעָתִים / שִׁמְעָתִים / שׂוּכָתִים
  english_pob_choice: the Tirathites / the Shimeathites / the Sucathites
  chosen_korean: 티라스 사람들 / 시므앗 사람들 / 수가 사람들
  alternatives_korean:
  - 티라스인들 / 시므앗인들 / 수가인들
  - 티랏 사람들 / 시마앗 사람들 / 수카 사람들
  lexicon: HALOT
  rationale: 세 항목은 족속명·집단명으로 보이므로 한국어에서 자연스러운 민족/씨족 표지인 ‘사람들’을 붙였고, 음가를 과도하게 풀지 않고 음역을 유지했습니다.
- source_word: הַקִּינִים
  english_pob_choice: the Kenites
  chosen_korean: 켄 사람들
  alternatives_korean:
  - 케나 사람들
  - 겐 사람들
  lexicon: HALOT
  rationale: קינים는 통상 켄/겐 계열로 옮길 수 있으나, 본문 맥락상 집단명임을 살리기 위해 ‘사람들’을 붙였습니다.
- source_word: אֲבִי בֵית רֵכָב
  english_pob_choice: the father of the house of Rechab
  chosen_korean: 레갑 가문의 조상
  alternatives_korean:
  - 레갑 가문의 아버지
  - 레갑 집안의 아버지
  lexicon: HALOT
  rationale: אָב는 족보 문맥에서 생물학적 아버지보다 ‘시조/조상’의 뜻이 강하므로, 한국어 관용과 의미를 함께 살려 ‘조상’으로 옮겼습니다.
theological_decisions:
- issue: 족보·씨족 표현의 번역 방식
  chosen_reading: ‘가문’, ‘사람들’, ‘조상’을 사용해 혈연·집단·기원 관계를 드러냈습니다.
  alternative_readings:
  - ‘가족’, ‘민족’, ‘아버지’로 직역
  rationale: 본문은 개인 목록이 아니라 기원과 소속을 밝히는 족보적 진술이므로, 한국어에서 오해를 줄이면서도 원문의 친족 구조를 보존하는 표현이 필요합니다.
  doctrine_reference: 족보 본문의 해석 원리
- issue: ‘하맛에서 온’의 기원 표지
  chosen_reading: 이 구절은 단순 출생지가 아니라 기원/유래를 밝히는 진술로 읽었습니다.
  alternative_readings:
  - 지리적 이동만을 말하는 표현
  - 직계 혈통만을 말하는 표현
  rationale: 히브리어 분사와 전치사 מן의 결합은 출처·기원을 나타낼 수 있으므로, 번역도 이동과 기원 가능성을 함께 열어 두었습니다.
  doctrine_reference: 본문 문맥상 기원 진술
