  rationale: 고유명사는 음역하며, 한국어 성서 인명 표기 관행에 맞게 ‘세산’으로 옮겼습니다.
- source_word: אַחְלָי
  english_pob_choice: Ahlai
  chosen_korean: 아흘라이
  alternatives_korean:
