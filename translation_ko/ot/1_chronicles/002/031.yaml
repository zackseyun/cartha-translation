  - 아빠임
  lexicon: HALOT
  rationale: 고유명사는 음역해야 하므로 한국어 외래어 표기 관행에 따라 이름을 옮겼습니다. 영어형 Appaim의 모음값을 고려하되, 한국어 표기는 읽기 자연성을 위해 ‘앗빔’으로 잡았습니다.
- source_word: יִשְׁעִי
