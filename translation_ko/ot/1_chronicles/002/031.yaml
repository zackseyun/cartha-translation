base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
  footnotes:
  - marker: a
    text: Or 'descendants of' at each occurrence of 'sons of'; the Hebrew בני can denote lineage in genealogies, though 'sons of' is the more direct rendering here.
    reason: lexical_alternative
translation:
  language: ko
  text: 앗빔의 아들들은 이시이며, 이시의 아들들은 세산이며, 세산의 아들들은 아흘라이입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들들’은 족보 문맥에서 ‘후손들’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: and the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 자손들은
  - 후손들은
  lexicon: HALOT
  rationale: 족보 문맥에서 בני는 직계 아들뿐 아니라 계보 구성원을 가리킬 수 있으나, 이 절은 반복되는 계보 형식이므로 가장 직접적인 ‘아들들’이 원문의 구조를 잘 드러냅니다.
- source_word: אַפַּיִם
