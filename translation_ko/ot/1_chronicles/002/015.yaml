lexical_decisions:
- source_word: אֹצֶם
  english_pob_choice: Ozem
  chosen_korean: 오젬
  alternatives_korean:
  - 오셈
  - 오젬
  lexicon: 고유명사 음역
  rationale: 고유명사이므로 한국어 음역으로 옮겼습니다. 영어 POB의 Ozem에 대응해 읽기 쉬운 표준 음역인 오젬을 채택했습니다.
- source_word: הַשִּׁשִּׁי
  english_pob_choice: the sixth
  chosen_korean: 여섯째
  alternatives_korean:
  - 여섯 번째
  - 제6
  lexicon: 서수 표현
  rationale: 가계 목록의 순서를 나타내는 서수이므로 한국어에서는 자연스러운 서수형 ‘여섯째’로 옮겼습니다.
- source_word: דָּוִיד
  english_pob_choice: David
  chosen_korean: 다윗
  alternatives_korean:
  - 다윗
  - 데이비드
  lexicon: 고유명사 표준형
  rationale: 성경 인명으로 널리 정착된 한국어 표기 ‘다윗’을 사용했습니다.
- source_word: הַשְּׁבִעִי
  english_pob_choice: the seventh
  chosen_korean: 일곱째
  alternatives_korean:
  - 일곱 번째
  - 제7
  lexicon: 서수 표현
  rationale: 앞절의 ‘여섯째’와 평행을 이루는 서수형으로, 목록상의 위치를 간결하게 드러내는 ‘일곱째’를 택했습니다.
theological_decisions:
- issue: 족보에서의 서수 표기 방식
  chosen_reading: ‘오젬이 여섯째였고 다윗이 일곱째였습니다’처럼 순서를 분명히 드러내는 표현을 사용했습니다.
  alternative_readings:
  - ‘오젬, 여섯째. 다윗, 일곱째.’
  - ‘오젬은 여섯째였고, 다윗은 일곱째였습니다.’
  rationale: 히브리어 원문의 나열 구조와 POB의 ‘the sixth / the seventh’ 의미를 한국어에서 자연스럽게 재현하기 위해 서술형으로 옮겼습니다.
  doctrine_reference: 족보 본문의 단순 서술
- issue: 명시적 대등 접속의 처리
  chosen_reading: ‘였고’로 두 항목의 병렬을 살렸습니다.
  alternative_readings:
  - 문장 분리
  - 쉼표 나열
  rationale: 원문은 두 인물의 서수적 위치를 병렬적으로 제시하므로, 한국어에서도 동일한 정보 구조가 드러나도록 했습니다.
  doctrine_reference: 문학적/구문적 평행성
