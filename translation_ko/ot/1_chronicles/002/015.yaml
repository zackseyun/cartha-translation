  rationale: 히브리어 원문의 나열 구조와 POB의 ‘the sixth / the seventh’ 의미를 한국어에서 자연스럽게 재현하기 위해 서술형으로 옮겼습니다.
  doctrine_reference: 족보 본문의 단순 서술
- issue: 명시적 대등 접속의 처리
  chosen_reading: ‘였고’로 두 항목의 병렬을 살렸습니다.
  alternative_readings:
