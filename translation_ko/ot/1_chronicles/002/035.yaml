  rationale: 족보 문맥이지만 야르하의 종속 신분이 서사적으로 의미가 있으므로, 전통적으로 더 부드러운 표현보다 원문이 드러내는 관계를 보존했습니다.
  doctrine_reference: 번역 정책상 עבד의 bonded-status를 지우지 않는 원문 충실성 원칙
