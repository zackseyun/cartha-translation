  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his slave as a wife[a], and she bore Attai to him.
  footnotes:
  - marker: a
    text: Or 'his servant.' The Hebrew עֶבֶד can denote either a servant or a slave; 'slave' is used here because Jarha's dependent status within Sheshan's household appears to be socially significant in the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 세산은 자기 딸을 자기 노예 야르하에게 아내로 주었고, 그녀는 그에게 앗대를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֶבֶד은 ‘종’ 또는 ‘노예’를 뜻할 수 있습니다. 야르하가 세산에게 예속된 신분임을 나타내므로, 여기서는 ‘노예’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 시집보냈습니다
  lexicon: HALOT
  rationale: נתן은 기본적으로 ‘주다’라는 뜻이므로, 혼인 문맥이지만 원문 구조를 살려 ‘아내로 주었습니다’로 옮겼습니다.
- source_word: עַבְדּוֹ
