  rationale: עֶבֶד은 ‘종/노예’를 뜻할 수 있는데, 이 문맥에서는 예속된 신분이 분명하므로 의미를 약화시키지 않되 한국어에서는 ‘종’으로 옮겼습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로
  - 아내가 되도록
  lexicon: HALOT
  rationale: 히브리어의 혼인 표현을 자연스러운 현대 한국어로 풀어 ‘아내로’라고 옮기되, 과도한 의역은 피했습니다.
- source_word: וַתֵּלֶד ל֖וֹ
  english_pob_choice: she bore to him
  chosen_korean: 그에게 앗대를 낳았습니다
