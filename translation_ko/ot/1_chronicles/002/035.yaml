  text: וַ/יִּתֵּ֨ן שֵׁשָׁ֧ן אֶת בִּתּ֛/וֹ לְ/יַרְחָ֥ע עַבְדּ֖/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת עַתָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his slave as a wife[a], and she bore Attai to him.
  footnotes:
  - marker: a
    text: Or 'his servant.' The Hebrew עֶבֶד can denote either a servant or a slave; 'slave' is used here because Jarha's dependent status within Sheshan's household appears to be socially significant in the narrative.
    reason: lexical_alternative
translation:
  language: ko
  text: 스산은 자신의 딸을 자신의 종 야르하에게 아내로 주었고, 그녀는 그에게 앗대를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עֶבֶד은 ‘종’ 또는 ‘노예’를 뜻할 수 있습니다. 여기서는 야르하의 예속된 지위가 서사적으로 중요하므로 ‘종’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 시집보냈습니다
  lexicon: HALOT
  rationale: נתן은 기본적으로 ‘주다’라는 뜻이므로, 혼인 문맥이지만 원문 구조를 살려 ‘아내로 주었습니다’로 옮겼습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his slave
  chosen_korean: 자신의 종
  alternatives_korean:
  - 자신의 노예
  - 자신의 하인
  lexicon: HALOT
  rationale: עֶבֶד은 ‘종/노예’를 뜻할 수 있는데, 이 문맥에서는 예속된 신분이 분명하므로 의미를 약화시키지 않되 한국어에서는 ‘종’으로 옮겼습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로
  - 아내가 되도록
  lexicon: HALOT
  rationale: 히브리어의 혼인 표현을 자연스러운 현대 한국어로 풀어 ‘아내로’라고 옮기되, 과도한 의역은 피했습니다.
- source_word: וַתֵּלֶד ל֖וֹ
  english_pob_choice: she bore to him
  chosen_korean: 그에게 앗대를 낳았습니다
  alternatives_korean:
  - 그에게 앗대를 낳았습니다
  - 그에게서 앗대를 낳았습니다
  lexicon: HALOT
  rationale: 출산 공식을 간결하게 살리기 위해 ‘낳았습니다’를 사용했고, לֹו는 부친 관계를 드러내는 ‘그에게’로 옮겼습니다.
theological_decisions:
- issue: 노예성/종속 신분을 어떻게 드러낼지
  chosen_reading: 야르하의 예속된 지위를 완화하지 않고 ‘종’으로 유지했습니다.
  alternative_readings:
  - 하인
  - 시종
  rationale: 족보 문맥이지만 야르하의 종속 신분이 서사적으로 의미가 있으므로, 전통적으로 더 부드러운 표현보다 원문이 드러내는 관계를 보존했습니다.
  doctrine_reference: 번역 정책상 עבד의 bonded-status를 지우지 않는 원문 충실성 원칙
