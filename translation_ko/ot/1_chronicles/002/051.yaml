  text: Salma[a], the father of Bethlehem; Hareph[b], the father of Beth-gader.
  footnotes:
  - marker: a
    text: Or 'founder of' or 'ancestor of' for 'father of'; in genealogical lists this term can denote a clan or town founder, not only an immediate biological father.
    reason: lexical_alternative
  - marker: b
    text: Hareph is alternatively rendered 'Hariph' in some name traditions.
    reason: alternative_reading
translation:
  language: ko
  text: 살마는 베들레헴의 아버지[a]였고, 하렙[b]은 벧가델의 아버지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 족보와 정착지 목록에서 ‘아버지’는 직접적인 생물학적 아버지뿐 아니라 한 집단이나 마을의 시조 또는 창건자를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 하렙은 일부 이름 전승에서는 ‘하리프’로도 옮길 수 있습니다.
    reason: alternative_reading
