theological_decisions:
- issue: 족보 문맥에서 ‘아버지’의 의미
  chosen_reading: 본문의 ‘아버지’는 단순한 생물학적 아버지라기보다 족장·시조/창시자까지 포함할 수 있는 표현으로 두었습니다.
  alternative_readings:
  - ‘창시자’로 풀어 의미를 드러내기
  - ‘조상’으로 완화하기
  rationale: 영어 POB 주석이 genealogical lists에서 이 표현의 확장된 뜻을 명시하므로, 본문은 직역성을 유지하고 해석 여지는 주석적 의미로 남기는 것이 더 소스-충실합니다.
  doctrine_reference: 족보/지명 목록의 אָב 용례
