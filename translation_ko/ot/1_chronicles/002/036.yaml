- source_word: זָבָד
  english_pob_choice: Zabad
  chosen_korean: 사밧
  alternatives_korean:
  - 자밧
  - 사바드
  lexicon: HALOT
  rationale: 고유명사 음역이며, 한국어 성경 전통에서 통용되는 자음군을 반영해 사밧으로 적었습니다.
theological_decisions:
- issue: 족보 공식의 서술 방식
  chosen_reading: ‘낳았습니다’로 반복되는 족보형 서술을 그대로 유지했습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’로 완화하는 번역
  - ‘생산했습니다’처럼 비유적 표현으로 바꾸는 번역
  rationale: 히브리어 ההוליד의 족보적 기능을 가장 직접적으로 드러내기 위해 반복적 계보 서술을 유지했습니다.
  doctrine_reference: 창세기 계보 전승 및 족보 문체
