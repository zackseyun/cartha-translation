base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
  footnotes:
  - marker: a
    text: Hebrew 'All the sons of Judah were five,' summarizing the total after Perez and Zerah are added to Judah's earlier sons.
    reason: cross_reference
  - marker: b
    text: Perez is also spelled 'Peretz' in some transliteration systems.
    reason: lexical_alternative
translation:
  language: ko
  text: 다말[a], 그의 며느리가 그에게 베레스와 세라를 낳았습니다. 유다의 모든 아들은 다섯이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 베레스와 세라를 더한 뒤 유다의 아들 수를 합계로 정리합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/תָמָר֙
  english_pob_choice: Tamar
  chosen_korean: 다말
  alternatives_korean:
  - 다마르
  lexicon: 고유명사
  rationale: 히브리어 고유명사 תָמָר를 한국어 성경에서 널리 쓰이는 형태로 옮겼습니다.
- source_word: כַּלָּת֔/וֹ
  english_pob_choice: his daughter-in-law
  chosen_korean: 그의 며느리
  alternatives_korean:
  - 그의 딸 같은 며느리
  - 그의 신부
  lexicon: HALOT
  rationale: 문맥상 유다의 아들의 아내를 가리키므로 한국어 친족어인 '며느리'가 가장 직접적입니다.
- source_word: יָ֥לְדָה
  english_pob_choice: bore
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 출산했습니다
  - 아들을 낳았습니다
  lexicon: HALOT
  rationale: 출생을 나타내는 완료형 동사로, 계보 문맥에서는 간결한 '낳았습니다'가 자연스럽습니다.
- source_word: פֶּ֣רֶץ
  english_pob_choice: Perez
  chosen_korean: 베레스
  alternatives_korean:
  - 페레츠
  lexicon: 고유명사
  rationale: 한국어 성경의 관용적 표기인 '베레스'를 따르되, 본문의 히브리어 이름을 그대로 음역한 형태와도 대응됩니다.
- source_word: זָ֑רַח
  english_pob_choice: Zerah
  chosen_korean: 세라
  alternatives_korean:
  - 제라
  lexicon: 고유명사
  rationale: 히브리어 בשם זָרַח의 한국어 통용 표기인 '세라'를 사용했습니다.
- source_word: כָּל בְּנֵי יְהוּדָה חֲמִשָּׁה
  english_pob_choice: All the sons of Judah were five
  chosen_korean: 유다의 모든 아들은 다섯이었습니다
  alternatives_korean:
  - 유다의 모든 아들은 다섯 명이었습니다
  - 유다의 아들들은 모두 다섯이었습니다
  lexicon: HALOT
  rationale: 히브리어의 총계 진술을 그대로 살려, 추가 해설 없이 계보의 합계를 직설적으로 전했습니다.
theological_decisions:
- issue: 계보 총계 진술의 처리
  chosen_reading: 마지막 절을 설명적으로 풀지 않고, '유다의 모든 아들은 다섯이었습니다'로 직접 번역했습니다.
  alternative_readings:
  - '''이들은 유다의 모든 아들로서 다섯입니다'''
  - '''유다에게는 아들이 다섯이었습니다'''
  rationale: 본문은 신학적 주장보다 족보적 집계를 말하므로, 원문의 요약 기능을 유지하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
