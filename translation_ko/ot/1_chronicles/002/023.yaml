source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
  footnotes:
  - marker: a
    text: Or 'Havvoth-jair,' a place-name meaning 'tent-villages of Jair.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'its daughters,' referring to dependent settlements around Kenath.
    reason: cultural_note
  - marker: c
    text: '''Sons of Machir'' may mean descendants or clan members, not necessarily immediate sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그술과 아람이 야일의 촌락들[a]과 그낫과 그 딸 마을들[b], 곧 예순 성읍을 그들에게서 차지하였습니다. 이들은 모두 길르앗의 아버지인 마길의 아들들이었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야일의 촌락들’은 히브리어 하봇-야일(Havvoth-jair)의 의미를 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘딸 마을들’은 문자적으로 ‘그 딸들’이며, 그낫에 딸린 종속 정착지를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘마길의 아들들’은 직계 아들뿐 아니라 후손이나 씨족 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
