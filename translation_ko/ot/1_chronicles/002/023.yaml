reference: 1 Chronicles 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
  footnotes:
  - marker: a
    text: Or 'Havvoth-jair,' a place-name meaning 'tent-villages of Jair.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'its daughters,' referring to dependent settlements around Kenath.
    reason: cultural_note
  - marker: c
    text: '''Sons of Machir'' may mean descendants or clan members, not necessarily immediate sons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그술과 아람이 야일의 촌락들을 그들에게서 빼앗고, 그와 함께 케낫과 그 딸 마을들, 곧 예순 성읍을 차지하였습니다. 이 모든 것은 길르앗의 아버지인 마길의 아들들이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야일의 촌락들’은 히브리어 하봇-야일(Havvoth-jair)의 의미 번역입니다.
    reason: source_note
  - marker: b
    text: ‘딸 마을들’은 문자적으로는 ‘그의 딸들’로, 본거지 주변의 종속 정착지를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘마길의 아들들’은 직계 아들뿐 아니라 후손이나 씨족 구성원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 빼앗고
  alternatives_korean:
  - 차지하고
  - 가져갔고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘취하다’보다 영토를 점유하며 빼앗아 간 뉘앙스가 살아 있어, 전후 상황을 가장 자연스럽게 드러내는 ‘빼앗고’로 옮겼습니다.
- source_word: חַוֺּת יָאִיר
  english_pob_choice: the villages of Jair
  chosen_korean: 야일의 촌락들
  alternatives_korean:
  - 야일의 마을들
  - 하봇-야일
  lexicon: HALOT
  rationale: 고유 지명으로 굳어진 표현이지만, 어휘적으로는 ‘촌락들’이 원문의 집합적 지형 의미를 잘 드러냅니다. 영어 POB의 각주에 따라 지명 음역 대신 의미 번역을 택했습니다.
- source_word: בְּנֹתֶי/הָ
  english_pob_choice: its daughter towns
  chosen_korean: 딸 마을들
  alternatives_korean:
  - 부속 마을들
  - 위성 마을들
  lexicon: HALOT
  rationale: 히브리어의 직유적 표현 ‘딸들’을 살리되, 한국어에서 이해 가능하도록 ‘마을들’을 붙였습니다. ‘부속/위성’은 설명적이지만 원문의 비유성을 덜 보존합니다.
- source_word: שִׁשִּׁים עִיר
  english_pob_choice: sixty cities
  chosen_korean: 예순 성읍
  alternatives_korean:
  - 예순 도시
  - 예순 마을
  lexicon: HALOT
  rationale: 원문의 수량 표현과 총괄 단위를 유지하면서, 한국어 성경 문맥에서 비교적 중립적인 ‘성읍’을 사용했습니다.
- source_word: בְּנֵי מָכִיר
  english_pob_choice: the sons of Machir
  chosen_korean: 마길의 아들들
  alternatives_korean:
  - 마길의 자손들
  - 마길의 후손들
  lexicon: HALOT
  rationale: 영어 POB의 각주가 밝히듯 직계 아들만이 아니라 씨족/후손을 가리킬 수 있지만, 히브리어의 직설적 표현을 따라 ‘아들들’을 유지했습니다.
theological_decisions:
- issue: בְּנֵי מָכִיר과 지명 목록의 관계를 어떻게 정리할지
  chosen_reading: 지명들의 점유 상황을 요약한 뒤, 그 소유/귀속을 마길의 씨족 정체성과 연결하는 문장으로 처리했습니다.
  alternative_readings:
  - ‘이 모든 것’이 지명들을 가리키게 하여 단순 역사 진술로 둘 수도 있음
  - ‘마길의 후손들’로 풀어 혈연보다 씨족성을 더 강하게 드러낼 수도 있음
  rationale: 원문은 정복된 지역 목록과 족보적 진술을 한 문장에 연결하므로, 한국어에서도 두 층위를 모두 보존하는 것이 좋습니다.
  doctrine_reference: 본문의 계보-영토 연결은 역사 서술 문제로, 교리적 쟁점은 아닙니다.
