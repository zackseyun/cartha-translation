  naturalness: 초안의 ‘그와 함께’는 선행사가 불분명하고, ‘이 모든 것은 … 아들들이었습니다’는 장소 또는 사물을 사람들과 동일시하는 듯하여 한국어로 부자연스럽습니다. ‘이들은 모두’로 계보 진술을 자연스럽게 연결하되, 원문의 넓은 ‘아들들’ 표현은 보존했습니다.
