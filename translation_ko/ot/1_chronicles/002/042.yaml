language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
  footnotes:
  - marker: a
    text: Hebrew syntax in the final clause is difficult. The Masoretic Text reads literally, 'and the sons of Mareshah, the father of Hebron.' Some understand this to mean 'Mareshah the father of Hebron,' while others retain the wording as translated.
    reason: alternative_reading
  - marker: b
    text: In Chronicles, 'father of' can denote not only a biological father but also an ancestor, clan head, or founder associated with a place.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 여라므엘의 형제 갈렙의 아들들은 이러합니다. 메사는 그의 맏아들[a]이었으며, 그는 십의 조상이었고[b], 마레사의 아들들은 헤브론의 조상입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문맥은 '맏아들'로 읽는 것이 자연스럽지만, 여기서는 족보 형식의 표지를 살려 직역했습니다.
    reason: alternative_reading
  - marker: b
    text: 역대기에서 '조상'은 생물학적 아버지뿐 아니라 씨족의 시조나 어떤 지명과 연결된 기원을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 아들들은
  alternatives_korean:
  - 아들들이
  - 자손들은
  lexicon: HALOT
  rationale: 족보 공식인 בְּנֵי를 기본적으로 '아들들'로 옮기되, 한국어 문장 흐름상 서술형으로 자연스럽게 조정했습니다.
- source_word: בְּכֹרוֹ
  english_pob_choice: his firstborn
  chosen_korean: 그의 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 그의 장자
  lexicon: HALOT
  rationale: firstborn의 혈통적·서열적 의미를 살리면서도 현대 한국어에서 가장 자연스러운 족보 표현으로 옮겼습니다.
- source_word: אֲבִי זִיף
  english_pob_choice: the father of Ziph
  chosen_korean: 십의 조상
  alternatives_korean:
  - 십의 아버지
  - 십의 시조
  lexicon: HALOT
  rationale: 족보 문맥에서 אָב는 단순한 생물학적 아버지보다 집단·지명의 조상/시조를 뜻할 수 있으므로, 한국어에서는 그 기능을 드러내는 '조상'을 택했습니다.
- source_word: אֲבִי חֶבְרוֹן
  english_pob_choice: the father of Hebron
  chosen_korean: 헤브론의 조상
  alternatives_korean:
  - 헤브론의 아버지
  - 헤브론의 시조
  lexicon: HALOT
  rationale: 앞의 구와 같은 용례를 따라, 지명에 연결된 혈통·기원 관계를 살릴 수 있도록 '조상'으로 옮겼습니다.
theological_decisions:
- issue: 족보 구문의 난해한 마지막 절
  chosen_reading: 마레사의 아들들을 '헤브론의 조상'으로 연결해, 본문의 난해함은 유지하되 한국어에서는 가장 직접적인 연결을 살렸습니다.
  alternative_readings:
  - 마레사의 아들들, 곧 헤브론의 조상
  - 마레사는 헤브론의 조상
  rationale: 히브리어 원문은 구문상 애매하지만, 본문을 매끄럽게 재구성하기보다 모호성을 보존하는 것이 원문 충실성에 더 가깝습니다.
  doctrine_reference: 역대기 족보 본문의 문법적 난해성 보존
