theological_decisions:
- issue: 족보 동사의 의미를 한국어로 어떻게 드러낼지
  chosen_reading: ‘낳았습니다’로 간결하게 번역해 남성 계보의 생성 관계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’
  - ‘낳게 하였습니다’
  rationale: 본문은 신학적 진술보다 족보적 계보 연결을 제시하므로, 과도한 설명 없이 원문의 계보 기능을 살리는 표현이 가장 적절합니다.
  doctrine_reference: 족보/계보 서술의 직역성
