  text: וּ/בֶן שַׁמַּ֖י מָע֑וֹן וּ/מָע֖וֹן אֲבִ֥י בֵֽית צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
  footnotes:
  - marker: a
    text: Or "ancestor/founder of Beth-zur." In genealogies, "father of" can also denote the founder or leading ancestor of a clan or settlement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시므의 아들은 마온이며, 마온은 베이트-술의 조상입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “베이트-술의 조상/창시자”입니다. 족보에서는 “~의 아버지”가 씨족이나 정착지의 창시자 또는 대표 선조를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן שַׁמַּ֖י
  english_pob_choice: And the son of Shammai
  chosen_korean: 시므의 아들은
  alternatives_korean:
  - 그리고 시므의 아들은
  - 그리고 샴마이의 아들은
  lexicon: HALOT
  rationale: 족보 문맥의 בֶן을 직역해 직접적인 계보 관계를 분명히 했고, וש의 연결은 한국어에서 자연스럽게 생략해도 흐름이 유지됩니다.
- source_word: מָע֑וֹן
  english_pob_choice: Maon
  chosen_korean: 마온
  alternatives_korean:
  - 마온
  lexicon: HALOT
  rationale: 인명으로 보이는 고유명사이므로 음역했고, 반복되는 두 번째 용례도 같은 표기를 유지했습니다.
- source_word: אֲבִ֥י
  english_pob_choice: was the father of
  chosen_korean: 조상입니다
  alternatives_korean:
  - 아버지입니다
  - 선조입니다
  - 창시자입니다
  lexicon: HALOT
  rationale: 족보 공식이지만 베이트-술이 지명/집단명으로 읽힐 수 있으므로, 한국어 본문에서는 보다 중립적인 ‘조상’으로 옮겨 직계 부자관계보다 기원 관계까지 열어 두었습니다.
- source_word: בֵֽית צֽוּר
  english_pob_choice: Beth-zur
  chosen_korean: 베이트-술
  alternatives_korean:
  - 벳-술
  - 베스-술
  - 베드-술
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역하되, 한국어 표기에서 ‘Beth’의 관용적 음가를 반영해 ‘베이트-술’로 처리했습니다.
theological_decisions:
- issue: אֲבִי의 족보 공식이 지명/집단 기원을 포함할 수 있는지
  chosen_reading: ‘조상입니다’로 옮겨, 마온이 베이트-술의 직접 아버지인지보다 그 기원 인물/선조인지 열어 두었습니다.
  alternative_readings:
  - 직역하여 ‘아버지입니다’라고 할 수 있음
  - ‘창시자입니다’로 좁힐 수 있음
  rationale: 영어 POB의 주석처럼 족보에서 ‘father of’는 단순 생물학적 부자관계뿐 아니라 공동체·거주지의 창시/대표 선조를 뜻할 수 있으므로, 한국어도 그 긴장을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 족보 어법과 고대 근동의 씨족/정착지 기원 표현
- issue: 고유명사 표기에서 베이트-술의 지명성 반영
  chosen_reading: ‘베이트-술’로 음역해 본문에서 지명으로 읽히도록 했습니다.
  alternative_readings:
  - ‘베스-술’
  - ‘벳-술’
  rationale: 원문의 베이트-술은 히브리어 בית־צור의 지명형이므로, 한국어에서도 의미 번역보다 음역을 택하는 것이 족보 문맥과 더 잘 맞습니다.
  doctrine_reference: 고유명사 음역 원칙
