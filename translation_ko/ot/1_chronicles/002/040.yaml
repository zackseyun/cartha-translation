source:
  edition: WLC
  text: וְ/אֶלְעָשָׂה֙ הֹלִ֣יד אֶת סִֽסְמָ֔י וְ/סִסְמַ֖י הֹלִ֥יד אֶת שַׁלּֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/040.yaml
  text: Eleasah fathered Sismai, and Sismai fathered Shallum.
translation:
  language: ko
  text: 엘르아사가 스스마이를 낳고, 스스마이가 살룸을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶלְעָשָׂה
  english_pob_choice: Eleasah
  chosen_korean: 엘르아사
  alternatives_korean:
  - 엘레아사
  - 엘아사
  lexicon: 고유명사 음역
  rationale: 히브리어 인명은 음역으로 처리했습니다. 기존 영어형 Eleasah를 참고하되 한국어 음절 체계에 맞춰 읽기 쉬운 형태로 옮겼습니다.
- source_word: הֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생산했습니다
  - 아버지로 삼았습니다
  lexicon: HALOT
  rationale: 계보 문맥의 히필 ילד는 출생/부자 관계 형성을 가리키므로, 현대 한국어에서는 가장 자연스럽고 직설적인 ‘낳다’가 그 계보 의미를 잘 드러냅니다.
- source_word: סִסְמָי
  english_pob_choice: Sismai
  chosen_korean: 스스마이
  alternatives_korean:
  - 시스마이
  - 시스마이
  lexicon: 고유명사 음역
  rationale: 히브리어 인명을 음역했습니다. 자음 배열을 반영해 ‘스스마이’로 옮겨, 이름의 반복되는 s음이 보이도록 했습니다.
- source_word: שַׁלּוּם
  english_pob_choice: Shallum
  chosen_korean: 살룸
  alternatives_korean:
  - 샬룸
  - 샬룬
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 통용되는 한국어 음역 대신 원형에 가까운 발음을 우선했습니다. 이 경우 셔/샬 계열보다 ‘살룸’이 한국어에서 더 자연스럽고 읽기 쉽습니다.
theological_decisions:
- issue: 계보 동사의 한국어 표현
  chosen_reading: 두 번의 ילד를 모두 ‘낳았습니다’로 일관되게 옮겼습니다.
  alternative_readings:
  - 아버지가 되었습니다
  - 생기게 했습니다
  rationale: 본문은 족보적 출생 관계를 나열하는 간결한 문장으로, ‘낳다’가 혈연 계보를 가장 직접적으로 전달합니다.
  doctrine_reference: 족보 서술의 직설적 전달
- issue: 인명 표기와 의미 보존
  chosen_reading: 인명은 뜻풀이하지 않고 음역만 제시했습니다.
  alternative_readings:
  - 의미를 풀어 번역하기
  - 기존 교회식 표기를 따르기
  rationale: 이 절은 연속되는 족보 항목이므로, 인명의 의미보다 계보 연결 자체가 핵심입니다. 따라서 음역이 원문 정보 구조를 가장 잘 보존합니다.
  doctrine_reference: 고유명사 번역 원칙
