  english_pob_choice: Ethan
  chosen_korean: 에단
  alternatives_korean:
  - 에이단
  - 에탄
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: עֲזַרְיָה
  english_pob_choice: Azariah
  chosen_korean: 아사랴
  alternatives_korean:
  - 아자리야
  - 아사랴
  lexicon: 표준 외래어 표기
  rationale: 히브리어 고유명사를 한국어 성경에서 널리 쓰이는 형태로 옮겼습니다.
theological_decisions:
- issue: ‘아들들’인데 단수 이름 하나만 뒤따르는 계보 형식
  chosen_reading: 문제를 매끈하게 해결하지 않고, ‘에단의 아들들’ 뒤에 단수 이름 ‘아사랴’가 오는 문형을 그대로 유지했습니다.
  alternative_readings:
  - ‘에단의 자손 중 아사랴’로 의미를 풀어 옮김
  - ‘에단의 후손 아사랴’로 재구성
  rationale: 본문은 계보적 공식과 전승된 형태를 보존하며, 영어 POB도 이를 평탄화하지 않았습니다. 따라서 한국어도 원문의 긴장감을 유지하는 편이 소스 충실성에 맞습니다.
  doctrine_reference: 본문 비평/계보 표현의 보존 원칙
