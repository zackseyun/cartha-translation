theological_decisions:
- issue: ‘아들들’인데 단수 이름 하나만 뒤따르는 계보 형식
  chosen_reading: 문제를 매끈하게 해결하지 않고, ‘에단의 아들들’ 뒤에 단수 이름 ‘아사랴’가 오는 문형을 그대로 유지했습니다.
  alternative_readings:
  - ‘에단의 자손 중 아사랴’로 의미를 풀어 옮김
  - ‘에단의 후손 아사랴’로 재구성
  rationale: 본문은 계보적 공식과 전승된 형태를 보존하며, 영어 POB도 이를 평탄화하지 않았습니다. 따라서 한국어도 원문의 긴장감을 유지하는 편이 소스 충실성에 맞습니다.
  doctrine_reference: 본문 비평/계보 표현의 보존 원칙
