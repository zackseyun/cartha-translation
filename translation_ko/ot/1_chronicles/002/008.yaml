lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 아들
  - 그리고 …의 자손들은
  - 또 에단의 아들들은
  lexicon: HALOT
  rationale: 계보 목록의 연결을 살리기 위해 접속사 ו는 ‘그리고’로 옮기고, בְנֵי는 문맥상 표준적인 ‘아들들’로 유지했습니다. 영어 POB처럼 ‘자손들’로 넓히지 않고, 히브리어의 친족 표지를 드러냈습니다.
