source:
  edition: WLC
  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
  footnotes:
  - marker: a
    text: Literally, 'Jether died, not sons,' that is, he died without sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 야다의 아들들, 곧 샤마이의 형제는 예델과 요나단입니다. 예델은 아들 없이 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘예델이, 아들들이 아니라’에 가깝습니다. 여기서는 족보가 의도하는 뜻을 따라 ‘아들 없이’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 그리고 아들들
  - 또 아들들
  lexicon: HALOT
  rationale: 족보 문맥에서 בֵּן의 복수형은 자연스럽게 ‘아들들’로 옮기는 것이 가장 직접적이며, 앞의 ו는 한국어에서 별도 접속사로 드러내지 않아도 됩니다.
- source_word: יָדָע
  english_pob_choice: Jada
  chosen_korean: 야다
  alternatives_korean:
  - 제다
  lexicon: HALOT
  rationale: 히브리어 인명 יָדָע는 현대 한국어 음역으로 ‘야다’가 자연스럽고, 본문 전체의 족보 표기와도 잘 맞습니다.
- source_word: אֲחִי שַׁמַּי
  english_pob_choice: Shammai’s brother
  chosen_korean: 샤마이의 형제
  alternatives_korean:
  - 샤마이의 오빠
  - 샤마이의 남동생
  lexicon: HALOT
  rationale: construct 관계를 한국어 소유격으로 처리해 ‘샤마이의 형제’로 옮기면 원문의 친족 연결을 유지하면서도 족보 문체에 맞습니다.
- source_word: יֶתֶר
  english_pob_choice: Jether
  chosen_korean: 예델
  alternatives_korean:
  - 여델
  - 제델
  lexicon: HALOT
  rationale: 인명 יֶתֶר는 한국어 성서 음역 관행을 고려해 ‘예델’로 옮기는 것이 가장 무난합니다.
- source_word: וְיוֹנָתָן
  english_pob_choice: and Jonathan
  chosen_korean: 요나단
  alternatives_korean:
  - 그리고 요나단
  - 또 요나단
  lexicon: HALOT
  rationale: 한국어에서는 병렬 인명을 나열할 때 첫 항목 이후의 접속사를 생략해도 자연스럽습니다. 요나단은 통용 음역을 따릅니다.
- source_word: לֹא בָנִים
  english_pob_choice: without sons
  chosen_korean: 아들 없이
  alternatives_korean:
  - 아들이 없이
  - 아들을 두지 못하고
  lexicon: HALOT
  rationale: 직역하면 ‘아들들이 없었다’이지만, 족보에서 의도하는 바는 남계가 끊겼다는 뜻이므로 한국어에서는 간결하게 ‘아들 없이’가 적절합니다.
theological_decisions:
- issue: 족보적 ‘아들 없음’의 의미
  chosen_reading: 예델은 아들 없이 죽었다는 표현으로, 단순한 생물학적 사망 사실과 함께 남계 계승이 끊겼다는 족보상의 의미를 드러냅니다.
  alternative_readings:
  - 아들이 없었다
  - 자녀가 없었다
  rationale: 원문 לֹא בָנִים은 문자적으로 ‘아들들이 없다’이므로, 한국어도 족보 맥락을 유지하면서 남계 부재를 분명히 해야 합니다.
  doctrine_reference: 족보/가문 계승 맥락
