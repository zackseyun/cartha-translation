source:
  edition: WLC
  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
  footnotes:
  - marker: a
    text: Hebrew syntax may be read as listing five sons of Jerahmeel, with Ram identified as 'the firstborn.' Some interpreters have proposed taking 'Ahijah' differently in relation to the list, but the straightforward reading treats Ahijah as another personal name in the series.
    reason: alternative_reading
translation:
  language: ko
  text: 헤스론의 맏아들 여라므엘의 아들들은 그의 맏아들 람과 부나와 오렌과 오셈과 아히야[a]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문장 구조는 여라므엘의 아들 다섯 명을 열거하면서 람을 ‘맏아들’로 밝히는 것으로 읽을 수 있습니다. 일부 해석은 ‘아히야’를 이 목록과 다른 방식으로 관련짓지만, 가장 자연스러운 읽기는 이를 목록에 있는 또 하나의 인명으로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  english_pob_choice: were
  chosen_korean: 낳은 아들은
  alternatives_korean:
  - 있었습니다
  - 였습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 ‘were’는 단순 존재보다 후손 열거를 나타내므로, 한국어에서는 관계를 드러내는 ‘낳은 아들’로 옮기는 것이 자연스럽습니다.
- source_word: בְּנֵי
  english_pob_choice: sons of
  chosen_korean: 아들은
  alternatives_korean:
  - 자녀는
  - 후손은
  lexicon: HALOT
  rationale: 남성 계보 항목의 열거이므로 ‘아들’이 원문의 족보적, 성별 표지를 가장 직접적으로 반영합니다.
- source_word: זְרַח
  english_pob_choice: Zerah
  chosen_korean: 여스르엘
  alternatives_korean:
  - 세라
  - 제라
  lexicon: 표준 음역 관행
  rationale: 인명은 본문 전승에 따라 음역하며, 한국어에서는 통용 음역을 사용합니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 기생
  alternatives_korean:
  - 여인
  - 여자
  lexicon: HALOT
  rationale: 문맥상 인물의 신분을 드러내는 표지이므로, 단순한 ‘여인’보다 본문이 전제하는 직업적 호칭을 살려야 합니다.
