    reason: 인명 ‘우리’가 1인칭 복수 대명사로 오독될 가능성을 줄입니다.
  revision_rationale: 직접적 남계 계보라는 본문의 의미를 유지하면서, 남성 주어와 ‘낳다’의 현대적 어색함을 피하기 위해 ‘아버지가 되었습니다’로 옮겼습니다. 두 절의 병렬 관계와 합쇼체 종결도 유지했습니다.
