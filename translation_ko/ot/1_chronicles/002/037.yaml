  text: וְ/זָבָד֙ הוֹלִ֣יד אֶת אֶפְלָ֔ל וְ/אֶפְלָ֖ל הוֹלִ֥יד אֶת עוֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/037.yaml
  text: Zabad fathered Ephlal, and Ephlal fathered Obed.
translation:
  language: ko
  text: 사밧은 에블랄을 낳았고, 에블랄은 오벳을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זָבָד
  english_pob_choice: Zabad
  chosen_korean: 사밧
  alternatives_korean:
  - 자밧
  - 자바드
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사는 음역하되, 한국어 성경에서 통용 가능한 표기 원칙에 따라 자음 구조를 반영해 옮겼습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳게 했습니다
  - 아들을 두었습니다
  lexicon: HALOT
  rationale: 족보 문맥의 히필형 ילד는 ‘낳다/낳게 하다’의 계보적 의미를 가지므로, 현대 한국어에서 자연스럽고 남성 계보 의미를 보존하는 ‘낳았습니다’를 택했습니다.
- source_word: אֶפְלָל
  english_pob_choice: Ephlal
  chosen_korean: 에플랄
  alternatives_korean:
  - 에프랄
  - 에팔랄
  lexicon: 고유명사 표기
  rationale: 고유명사는 번역하지 않고 음역했습니다. 영어 POB의 Ephlal을 기준으로 하되 한국어 표기 규범에 맞게 옮겼습니다.
- source_word: עוֹבֵד
  english_pob_choice: Obed
  chosen_korean: 오벳
  alternatives_korean:
  - 오벳
  - 오브드
  lexicon: 고유명사 표기
  rationale: 이름으로서의 עוֹבֵד는 뜻풀이하지 않고 음역했습니다. 한국어 성경에서 널리 쓰이는 이름 표기 관행을 반영했습니다.
theological_decisions:
- issue: 족보 서술의 반복 동사
  chosen_reading: 모두 같은 계보 동사로 ‘낳았습니다’를 반복해 직계 혈통 연결을 분명히 했습니다.
  alternative_readings:
  - ‘아버지가 되었습니다’로 완곡하게 표현
  - ‘낳게 하였습니다’로 원인형을 강조
  rationale: 히브리어 족보 문맥에서 הוֹלִיד는 계보 형성의 직접적 진술이므로, 문체를 지나치게 완곡하게 만들지 않고 동일한 동사를 반복해 관계를 명확히 드러내는 것이 소스에 충실합니다.
  doctrine_reference: 족보/계보 문맥
- issue: 이름의 의미를 살리지 않음
  chosen_reading: 오벳을 ‘섬기는 자’로 풀이하지 않고 고유명사로만 처리했습니다.
  alternative_readings:
  - 뜻풀이 번역
  - 각주로 어원 설명
  rationale: 족보는 이름의 어원 설명보다 계보 연결이 핵심이므로, 본문에서는 이름을 이름으로 보존하는 것이 원문 의도에 맞습니다.
  doctrine_reference: 고유명사 번역 원칙
