theological_decisions:
- issue: 혼인 관용구를 어떻게 드러낼지
  chosen_reading: ‘아내로 맞았습니다’로 옮겨, 본문의 혼인 관용구를 살리되 독자가 관계를 즉시 이해하도록 했습니다.
  alternative_readings:
  - ‘결혼했습니다’로 평문화
  - ‘아내로 삼았습니다’로 더 문자적으로 표현
  rationale: 히브리어 וַיִּקַּח לוֹ는 단순한 ‘취함’이 아니라 혼인 형식을 가리키므로, 의미를 명료하게 전달하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 혼인 서술의 서사적·관용적 표현
- issue: וַתָּמָת의 직접성 유지
  chosen_reading: ‘죽었습니다’로 번역해 서사적 사실 진술의 직설성을 유지했습니다.
  alternative_readings:
  - ‘세상을 떠났습니다’
  - ‘별세했습니다’
  rationale: 본문은 장례적 완곡어보다 사건의 사실성을 간결하게 전달하므로, 직설적 표현이 원문에 더 충실합니다.
  doctrine_reference: 서사 본문의 직서(直敘) 원칙
