base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
  footnotes:
  - marker: a
    text: Or simply, 'Caleb married Ephrath.' The Hebrew literally says 'Caleb took Ephrath,' an idiom for marriage.
    reason: lexical_alternative
  - marker: b
    text: The name may also be rendered 'Ephrathah' in related forms elsewhere, but the Hebrew here reads the shorter form 'Ephrath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아수바가 죽었습니다. 갈렙이 에브랏[b]을 아내로 맞았고[a], 에브랏이 그에게 훌을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘갈렙이 에브랏을 취했다’입니다. 이는 혼인을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 다른 곳의 관련 형태에서는 ‘에브라다’로도 표기되지만, 이 절의 히브리어는 짧은 형태인 ‘에브랏’을 사용합니다.
    reason: lexical_alternative
