  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֖מָת עֲזוּבָ֑ה וַ/יִּֽקַּֽח ל֤/וֹ כָלֵב֙ אֶת אֶפְרָ֔ת וַ/תֵּ֥לֶד ל֖/וֹ אֶת חֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
  footnotes:
  - marker: a
    text: Or simply, 'Caleb married Ephrath.' The Hebrew literally says 'Caleb took Ephrath,' an idiom for marriage.
    reason: lexical_alternative
  - marker: b
    text: The name may also be rendered 'Ephrathah' in related forms elsewhere, but the Hebrew here reads the shorter form 'Ephrath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아주바가 죽었습니다. 그리고 갈렙이 에브랏을 아내로 맞았는데, 그녀가 그에게 훌을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘갈렙이 에브랏을 취했다’입니다. 이는 혼인을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 다른 관련 형태에서 ‘에브라다/에브랏다’로도 옮길 수 있지만, 이 절의 히브리어는 짧은 형태인 ‘에브랏’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 세상을 떠났습니다
  - 별세했습니다
  lexicon: HALOT
  rationale: מות의 기본 의미를 직접적이고 우회 없이 살려, 영어 POB의 ‘died’처럼 완곡어를 피했습니다.
- source_word: וַיִּקַּח לוֹ
  english_pob_choice: took ... as his wife
  chosen_korean: 아내로 맞았습니다
  alternatives_korean:
  - 아내로 삼았습니다
  - 결혼했습니다
  lexicon: HALOT
  rationale: 여성을 목적어로 두고 ‘취하다’는 히브리어 관용을 한국어에서는 혼인 의미가 드러나도록 옮겼습니다.
- source_word: אֶפְרָת
  english_pob_choice: Ephrath
  chosen_korean: 에브랏
  alternatives_korean:
  - 에브라트
  - 에브랏아
  lexicon: 고유명사 음역
  rationale: 본문의 짧은 형태 אֶפְרָת를 반영해, 관련형의 확장형인 ‘에브라트/에브랏아’보다 더 직접적으로 음역했습니다.
- source_word: וַתֵּלֶד לוֹ
  english_pob_choice: she bore ... to him
  chosen_korean: 그에게 훌을 낳았습니다
  alternatives_korean:
  - 그에게 훌을 낳아 주었습니다
  - 훌을 낳았습니다
  lexicon: HALOT
  rationale: ילד의 출산 의미와 목적격/간접목적어 관계를 자연스러운 한국어로 살리면서도, 생물학적 출산 사실을 분명히 했습니다.
theological_decisions:
- issue: 혼인 관용구를 어떻게 드러낼지
  chosen_reading: ‘아내로 맞았습니다’로 옮겨, 본문의 혼인 관용구를 살리되 독자가 관계를 즉시 이해하도록 했습니다.
  alternative_readings:
  - ‘결혼했습니다’로 평문화
  - ‘아내로 삼았습니다’로 더 문자적으로 표현
  rationale: 히브리어 וַיִּקַּח לוֹ는 단순한 ‘취함’이 아니라 혼인 형식을 가리키므로, 의미를 명료하게 전달하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 혼인 서술의 서사적·관용적 표현
- issue: וַתָּמָת의 직접성 유지
  chosen_reading: ‘죽었습니다’로 번역해 서사적 사실 진술의 직설성을 유지했습니다.
  alternative_readings:
  - ‘세상을 떠났습니다’
  - ‘별세했습니다’
  rationale: 본문은 장례적 완곡어보다 사건의 사실성을 간결하게 전달하므로, 직설적 표현이 원문에 더 충실합니다.
  doctrine_reference: 서사 본문의 직서(直敘) 원칙
