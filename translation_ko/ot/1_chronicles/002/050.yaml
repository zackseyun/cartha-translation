theological_decisions:
- issue: 계보에서 ‘아버지’(אָב)의 의미
  chosen_reading: 본문은 쇼발을 기럇여아림과 연결된 ‘아버지’로 부르지만, 이는 혈통의 아버지일 수도 있고 씨족/정착지의 시조일 수도 있습니다.
  alternative_readings:
  - 기럇여아림의 실제 부친
  - 기럇여아림의 창건자/시조
  rationale: 히브리어 אָב는 계보적·지리적 문맥에서 폭넓게 쓰이므로, 해석을 한쪽으로 고정하지 않고 원문의 유연성을 보존했습니다.
  doctrine_reference: 창세기 계보 용례 및 고대 근동 족장/시조 용법
