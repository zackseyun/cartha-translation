base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
  footnotes:
  - marker: a
    text: Or 'founder of Kiriath-jearim' or 'ancestor of Kiriath-jearim'; the Hebrew 'father of' can denote a clan or settlement founder in genealogical contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 칼렙, 훌의 아들이요 에브랏의 첫째인 자들의 아들이었습니다[a]. 쇼발은 기럇여아림의 아버지였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기럇여아림의 창건자’ 혹은 ‘기럇여아림의 조상’으로도 옮길 수 있습니다. 히브리어 ‘아버지’는 계보 문맥에서 씨족이나 정착지의 시조를 뜻할 수 있습니다.
    reason: lexical_alternative
