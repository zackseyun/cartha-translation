  text: וְ/רָ֖ם הוֹלִ֣יד אֶת עַמִּינָדָ֑ב וְ/עַמִּינָדָב֙ הוֹלִ֣יד אֶת נַחְשׁ֔וֹן נְשִׂ֖יא בְּנֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
  footnotes:
  - marker: a
    text: Or 'prince of the sons of Judah' or 'chief of the sons of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 람은 아미나답을 낳았고, 아미나답은 유다 자손의 지도자인 나손을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 자손의 수령’ 또는 ‘유다 자손의 족장’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רָ֖ם הוֹלִ֣יד
  english_pob_choice: Ram fathered
  chosen_korean: 람은 …를 낳았고
  alternatives_korean:
  - 람은 …의 아버지가 되었고
  - 람은 …를 낳았습니다
  lexicon: WLC + HALOT
  rationale: 족보 문맥의 הוֹלִיד는 남성 계보에서 ‘낳다/낳았습니다’로 옮기는 것이 자연스럽고, POB의 fathered를 한국어에서 가장 직접적으로 반영합니다.
- source_word: עַמִּינָדָב / נַחְשׁוֹן
  english_pob_choice: Amminadab / Nahshon
  chosen_korean: 아미나답 / 나손
  alternatives_korean:
  - 암미나답 / 납손
  - 아미나답 / 나호손
  lexicon: 고유명사 음역
  rationale: 인명은 번역하지 않고 음역해야 하므로 현대 표기 관행에 맞게 옮겼습니다.
- source_word: נְשִׂיא
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 군주
  - 왕자
  - 족장
  lexicon: HALOT
  rationale: נְשִׂיא는 ‘올려 세워진 자’로서 지도자·족장·통치자 범위를 가지는데, 여기서는 유다 지파 안에서의 대표적 지위를 가리키므로 ‘지도자’가 가장 분명합니다.
- source_word: בְּנֵ֥י יְהוּדָֽה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다 자손
  alternatives_korean:
  - 유다의 아들들
  - 유다 사람들
  - 유다의 후손
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘유다의 아들들’이지만, 족보 맥락에서 한국어 성경은 ‘자손’이 혈통적 의미를 자연스럽게 살립니다.
theological_decisions:
- issue: נְשִׂיא의 지위 표현
  chosen_reading: 나손은 유다 지파의 단순한 행정직이 아니라, 그 공동체 안에서 인정된 대표적 지도자라는 의미를 살렸습니다.
  alternative_readings:
  - ‘왕자’처럼 군주적 뉘앙스로 읽는 방식
  - ‘족장’처럼 종족 수장으로 고정하는 방식
  rationale: 문맥은 왕권이 아니라 족보 속 지위 설명이므로, 과도한 정치적 함의를 피하면서도 높임의 의미를 유지해야 합니다.
  doctrine_reference: 성경의 족보는 인물의 언약사적 위치를 드러내는 문학 장르입니다.
