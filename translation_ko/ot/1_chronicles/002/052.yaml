  source_fidelity: '개정문은 히브리어의 족보 문장 구조, 곧 ‘기럇여아림의 아버지인 스볼에게 아들들이 있었다: 하로에와 메누홋의 절반’을 보존합니다. 초안의 ‘그가 …였으며’는 관계절을 부자연스럽게 분리하고, ‘마나핫 사람들’은 본문의 הַמְּנֻחוֹת(메누홋)를 다른 형태로 단정하여 옮긴 것이므로 수정이 필요합니다.'
  naturalness: ‘스볼에게는 아들들이 있었으니’와 ‘…인 스볼’의 구성은 현대 표준 한국어의 족보 서술로 자연스럽고 합쇼체 서술 종결에도 맞습니다. 각 주석 표지는 해당 어구 바로 뒤에 배치했습니다.
  terminology: 고유명사는 스볼, 기럇여아림, 하로에, 메누홋으로 음역했습니다. ‘아버지’는 본문에서 유지하되 족보·정착지 문맥의 넓은 의미는 주석으로 밝혔습니다. ‘메누홋의 절반’은 지명, 집단명, 또는 그 주민/씨족을 가리킬 수 있는 원문의 불확정성을 본문에서 보존합니다.
  issues:
