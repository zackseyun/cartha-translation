    issue: ‘마나핫 사람들’이 본문의 ‘메누홋’과 다르게 단정되어 있음
    rationale: 히브리어 הַמְּנֻחוֹת는 메누홋으로 읽히며, 이를 마나핫 사람들로 확정하면 원문 형태와 지시 대상의 불확정성을 충분히 보존하지 못합니다.
  - severity: medium
