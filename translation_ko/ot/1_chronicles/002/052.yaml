id: 1CH.2.52
reference: 1 Chronicles 2:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
  footnotes:
  - marker: a
    text: Or 'the founder of Kiriath-jearim'; 'father of' in genealogies can denote the ancestor or leading founder associated with a town.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'half of the Menuhoth'; this may mean 'half of Menuhoth' or 'half of the inhabitants/clan of Menuhoth (Manahath).'
    reason: lexical_alternative
  - marker: c
    text: Haroeh may reflect a personal name otherwise rendered 'Reaiah' in some traditions.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 스볼의 자손은 있으니, 그가 기럇여아림의 아버지였으며, 하로에와 반은 마나핫 사람들입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아버지’는 족보에서 도시의 조상 또는 설립자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘메누호스의 절반’이며, 마나핫/메누호스와 연결된 사람들 또는 집단을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 하로에는 일부 전통에서 ‘르아야’로 옮겨지기도 하는 인명입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  english_pob_choice: And Shobal ... had sons
  chosen_korean: 스볼의 자손은 있으니
  alternatives_korean:
  - 스볼에게 아들이 있었습니다
  - 그리고 스볼은 아들들을 두었습니다
  lexicon: HALOT
  rationale: 족보식 히브리어 관용구를 한국어에서 자연스럽게 옮기되, ‘자손’으로 혈통 단위를 유지했습니다.
- source_word: אֲבִי קִרְיַת יְעָרִים
  english_pob_choice: the father of Kiriath-jearim
  chosen_korean: 기럇여아림의 아버지였으며
  alternatives_korean:
  - 기럇여아림의 조상이었으며
  - 기럇여아림의 설립자였으며
  lexicon: HALOT
  rationale: 족보와 지명 맥락에서 ‘아버지’는 조상·설립자·수장까지 포괄할 수 있으므로, 본문은 직역을 살리고 대안 의미는 주석으로 남겼습니다.
- source_word: הָרֹאֶה
  english_pob_choice: Haroeh
  chosen_korean: 하로에
  alternatives_korean:
  - 르아야
  - 보는 자
  lexicon: HALOT
  rationale: 족보 항목에서는 인명으로 기능하므로, 의미 해석보다 음역을 택해 히브리어 형태를 보존했습니다.
- source_word: חֲצִי הַמְּנֻחוֹת
  english_pob_choice: half of the Manahathites
  chosen_korean: 반은 마나핫 사람들입니다
  alternatives_korean:
  - 메누호스의 절반입니다
  - 마나핫/메누호스의 주민 절반입니다
  lexicon: HALOT
  rationale: 문맥상 지명형 표현이 혈연·거주 집단을 가리킬 수 있어, 영어 POB의 지시를 따라 민족·씨족적 뉘앙스를 드러내는 ‘마나핫 사람들’로 옮겼습니다.
theological_decisions:
- issue: 족보 문맥의 ‘아버지’ 의미
  chosen_reading: 본문의 ‘아버지’는 생물학적 부친만이 아니라 지명과 연결된 조상/설립자 의미를 함께 열어 둡니다.
  alternative_readings:
  - 단순한 친자 관계로만 이해
  - 행정적 수장으로만 이해
  rationale: 히브리어 족보에서 ‘아버지’는 씨족의 기원자나 도시 연관 인물을 가리킬 수 있어, 의미를 좁히지 않고 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 성경 족보 해석의 문맥 우선 원칙
- issue: 하로에의 인명성
  chosen_reading: ‘하로에’는 뜻풀이보다 인명으로 읽는 것이 적절합니다.
  alternative_readings:
  - ‘보는 자’라는 보통명사적 해석
  - 르아야와 같은 다른 전승 이름으로 동화
  rationale: 족보 목록에서는 품사적 의미보다 고유명사성이 우선하므로, 본문이 요구하는 최소 해석만 반영했습니다.
  doctrine_reference: 본문 장르와 고유명사 처리 원칙
