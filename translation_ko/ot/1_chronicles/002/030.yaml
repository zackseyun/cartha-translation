lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: The sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - 그리고 ~의 아들들
  - 나답의 자손들
  lexicon: HALOT
  rationale: 족보 문맥의 בְּנֵי는 자연스럽게 ‘아들들’로 옮기는 것이 가장 직접적이며, 시작의 접속사 וְ는 한국어에서 별도 표지 없이 처리할 수 있습니다.
- source_word: נָדָב
  english_pob_choice: Nadab
  chosen_korean: 나답
  alternatives_korean:
  - 나다브
  lexicon: HALOT
  rationale: 인명은 한국어 성경에서 널리 쓰이는 음역을 따르는 것이 자연스럽습니다.
- source_word: סֶלֶד
  english_pob_choice: Seled
  chosen_korean: 세렛
  alternatives_korean:
  - 셀렛
  - 세렏
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역으로 옮기되, 발음에 맞춰 일관되게 표기했습니다.
- source_word: וְאַפָּיִם
  english_pob_choice: and Appaim
  chosen_korean: 아빔
  alternatives_korean:
  - 아파임
  - 앱아이ם
  lexicon: HALOT
  rationale: 족보 속 고유명사로 보고 음역했습니다. 겉모양이 일반명사처럼 보이더라도 문맥상 이름이므로 번역하지 않았습니다.
- source_word: לֹא בָנִים
  english_pob_choice: without sons
  chosen_korean: 아들이 없이
  alternatives_korean:
  - 아들 없이
  - 아들이 없었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘아들들이 아니다’이지만, 앞뒤 문맥상 ‘아들 없이’가 자연스럽고 원문의 의미를 보존합니다.
theological_decisions:
- issue: 족보 서술에서 ‘죽었다’와 ‘아들이 없이’의 결합
  chosen_reading: 사건의 단순한 족보 기록으로 처리하여 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - 세렛이 죽고 나서 아들이 없었다는 인과를 분명히 드러내는 해석
  - ‘아들이 없이 죽었습니다’로 합쳐 읽는 방식
  rationale: 히브리어는 사건을 연속적으로 말하며, 본문이 말하는 범위를 넘어서지 않도록 간결하게 옮기는 것이 적절합니다.
  doctrine_reference: 족보 본문 해석 원칙
