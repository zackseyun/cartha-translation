    rationale: 한국어 성경의 통용 표기와 음역 관례상 ‘셀렛’이 적절합니다. 동일 인명은 두 번 모두 같은 표기로 유지해야 합니다.
  revised_text: 나답의 아들은 셀렛과 압바임입니다[a]. 셀렛은 아들이 없이 죽었습니다.
