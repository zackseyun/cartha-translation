language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֶׁ֣מַע הוֹלִ֔יד אֶת רַ֖חַם אֲבִ֣י יָרְקֳעָ֑ם וְ/רֶ֖קֶם הוֹלִ֥יד אֶת שַׁמָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/044.yaml
  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
  footnotes:
  - marker: a
    text: Or 'Raham, founder/ancestor of Jorkeam.' The Hebrew expression 'father of' can denote a founding or ancestral relationship, especially in genealogies connected with clans or settlements.
    reason: lexical_alternative
translation:
  language: ko
  text: 세마는 라함을 낳았으니, 그는 욕르암의 아버지였습니다. 레겜은 샴마이를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘아버지’는 지명이나 집단명 앞에서 ‘시조’나 ‘창시자’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 Hiphil ילד는 직접적인 출생/계보 형성을 가리키므로, 현대 한국어에서는 간결하고 자연스러운 ‘낳다’가 가장 가깝습니다.
- source_word: אֲבִי
  english_pob_choice: the father of
  chosen_korean: 아버지였습니다
  alternatives_korean:
  - 창시자였습니다
  - 조상이었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘아버지’는 지명과 함께 쓰일 때 창시자나 시조를 뜻할 수 있으나, 본문은 족보의 관용구를 그대로 보여 주므로 형식을 살려 번역했습니다.
- source_word: יָרְקֳעָם
  english_pob_choice: Jorkeam
  chosen_korean: 욕르암
  alternatives_korean:
  - 요르케암
  - 요르감
  lexicon: 표준 외래어 표기법
  rationale: 고유명사는 음역하되, 한국어 음운에 맞게 표기했습니다. 기존 영어 음역 Jorkeam에 해당하는 히브리어 형태를 반영했습니다.
- source_word: שֶׁמַע / רַחַם / רֶקֶם / שַׁמָּי
  english_pob_choice: Shema / Raham / Rekem / Shammai
  chosen_korean: 세마 / 라함 / 레겜 / 샴마이
  alternatives_korean:
  - 쉬마 / 라하므 / 레켐 / 사마이
  lexicon: 표준 외래어 표기법
  rationale: 족보의 인명은 의미 번역보다 음역이 필요하며, 한국어 독자가 추적할 수 있도록 비교적 일관된 음역을 사용했습니다.
theological_decisions:
- issue: אֲבִי의 족보적 의미
  chosen_reading: ‘아버지’로 직역하되, 혈연 아버지와 시조/창시자 가능성을 본문 안에서 완전히 좁히지 않았습니다.
  alternative_readings:
  - ‘창시자’ 또는 ‘시조’로 의역
  rationale: 이 구절의 족보 공식은 개인-가문-지명 사이의 관계를 압축적으로 표현하므로, 한국어에서도 해석을 과도하게 단정하지 않고 원형을 보존하는 편이 더 투명합니다.
  doctrine_reference: 족보 용례와 고대 근동의 혈통/시조 표현 관습
- issue: 족보 서술의 반복 동사
  chosen_reading: 두 절의 동사 모두 ‘낳았습니다’로 통일했습니다.
  alternative_readings:
  - ‘아들을 두었습니다’
  - ‘~의 아버지가 되었습니다’
  rationale: 원문의 반복 구조를 한국어에서도 살려, 족보의 계보적 연결을 간명하게 드러냈습니다.
  doctrine_reference: 족보 문학의 평행성과 계보 연속성
