  rationale: 히브리어 פִּלֶגֶשׁ는 정식 아내보다 낮은 지위를 가진 배우자를 가리키므로, 한국어로는 간결하고 직접적인 ‘첩’이 가장 잘 대응합니다.
- source_word: יָלַד
