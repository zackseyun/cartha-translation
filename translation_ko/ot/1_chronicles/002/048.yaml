  lexicon: HALOT
  rationale: 계보 문맥에서 יָלַד는 ‘낳다/출산하다’의 뜻으로 쓰이며, 여기서는 주어가 여성인 마아가이므로 ‘낳았습니다’가 가장 자연스럽고 성별에도 맞습니다.
- source_word: שֶׁבֶר
  english_pob_choice: Sheber
  chosen_korean: 세벨
  alternatives_korean:
