translation:
  language: ko
  text: 갈렙의 첩인 마아가는 세벨과 디르하나를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 계보에서 יָלַד를 더 일반적인 ‘자녀를 두다’라는 뜻으로 이해할 수도 있습니다. 그러나 여기서는 주어가 여성인 마아가이므로 본문은 ‘낳았습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  english_pob_choice: concubine
  chosen_korean: 첩
  alternatives_korean:
