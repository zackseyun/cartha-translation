  rationale: 고유명사는 한국어 음역 관행에 따라 옮겼으며, 히브리어 자음값을 반영해 ‘세벨’로 표기했습니다.
- source_word: תִּרְחֲנָה
  english_pob_choice: Tirhanah
  chosen_korean: 디르하나
  alternatives_korean:
  - 티르하나
  - 티르하나
  lexicon: SBLGNT/표기 관행
  rationale: 고유명사는 현대 한국어 외래어 표기 방식에 따라 음역했으며, 영어 POB의 Tirhanah에 대응하도록 ‘디르하나’로 옮겼습니다.
theological_decisions:
- issue: 족보 문맥에서 여성 주어의 번역을 어떻게 유지할지
  chosen_reading: 여성 주어를 분명히 드러내어 ‘마아가가 ... 낳았습니다’로 옮겼습니다.
  alternative_readings:
  - ‘마아가가 ...를 아들로 두었습니다’
  - ‘마아가가 ...를 낳은 자였습니다’
  rationale: 본문은 족보 공식이지만 주어가 분명히 여성입니다. 영어 POB도 이를 반영해 ‘bore’를 택했으므로, 한국어도 성별 정보를 흐리지 않고 직접적으로 표현하는 것이 본문 의미에 가장 충실합니다.
  doctrine_reference: 창세기적 계보 표현의 문법적·서술적 정확성
