source:
  edition: WLC
  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: ko
  text: 셰파가 스바를 낳았는데, 그는 마브네아와 기브아의 아버지였습니다. 그리고 갈렙의 딸은 악사였습니다.
  philosophy: formal
lexical_decisions:
- source_word: שַׁעַף / Shepha
  english_pob_choice: Shepha
  chosen_korean: 셰파
  alternatives_korean:
  - 세파
  - 쉐파
  lexicon: 고유명사
  rationale: 영어 POB가 Shepha를 따르므로, 현대 외래어 표기 감각에 맞춰 셰파로 음역했습니다.
- source_word: אֲבִי
  english_pob_choice: father of
  chosen_korean: '...의 아버지'
  alternatives_korean:
  - '...의 조상'
  - '...의 부친'
  lexicon: lexical relation
  rationale: 본문의 반복되는 אֲבִי를 혈연적/계보적 관계를 드러내는 ‘아버지’로 옮겨 계보 문맥을 분명히 했습니다.
- source_word: בַּת כָּלֵב
  english_pob_choice: Caleb’s daughter
  chosen_korean: 갈렙의 딸
  alternatives_korean:
  - 갈렙의 여자 자손
  - 갈렙의 딸아이
  lexicon: 고유명사/친족 표현
  rationale: 직역대로 친족 관계를 보존하되, 한국어 성경체에서 자연스러운 ‘갈렙의 딸’로 처리했습니다.
- source_word: עַכְסָה
  english_pob_choice: Acsah
  chosen_korean: 악사
  alternatives_korean:
  - 앗사
  - 옥사
  lexicon: 고유명사
  rationale: 기존 한국어 성경에서 널리 통용되는 인명 형태를 따라 악사로 음역했습니다.
theological_decisions:
- issue: 계보문에서의 ‘father’ 반복과 인물 관계의 직접성
  chosen_reading: 가계 관계를 완화하지 않고 ‘아버지’로 유지했습니다.
  alternative_readings:
  - 계보상 ‘조상’으로 완화
  - ‘~의 후손’으로 일반화
  rationale: 히브리어 אֲבִי의 반복은 단순한 혈통 연결을 직접적으로 보여 주므로, 계보 정보를 흐리지 않기 위해 직역을 유지했습니다.
  doctrine_reference: 성경 계보의 역사성 및 본문 충실성
