id: 1CH.2.53
reference: 1 Chronicles 2:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִשְׁפְּחוֹת֙ קִרְיַ֣ת יְעָרִ֔ים הַ/יִּתְרִי֙ וְ/הַ/פּוּתִ֔י וְ/הַ/שֻּׁמָתִ֖י וְ/הַ/מִּשְׁרָעִ֑י מֵ/אֵ֗לֶּה יָצְאוּ֙ הַ/צָּ֣רְעָתִ֔י וְ/הָ/אֶשְׁתָּ֖אֻֽלִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
  footnotes:
  - marker: a
    text: Or 'families' instead of 'clans'; the Hebrew term often refers to extended kinship groups within a tribal genealogy.
    reason: lexical_alternative
  - marker: b
    text: 'Literally ''went out''; here the sense is genealogical origin: these groups descended from or emerged from the preceding clans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 기럇여아림의 종족들은 이드리 사람들과 부디 사람들, 수마시 사람들과 미스라 사람들입니다. 이들 가운데서 소라 사람들과 에스다올 사람들[참고]이 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 참고
    text: 히브리어는 문자적으로 ‘나갔다’지만, 여기서는 뒤에 이어지는 집단들의 계보적 기원을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  english_pob_choice: And the clans
  chosen_korean: 종족들
  alternatives_korean:
  - 가문들
  - 씨족들
  - 가족들
  lexicon: HALOT
  rationale: 족보 문맥의 מִשְׁפָּחוֹת는 단순한 가족보다 혈연 기반 집단을 가리키므로, 한국어에서는 ‘종족들’이 그 집단성을 가장 자연스럽게 드러냅니다.
- source_word: קִרְיַת יְעָרִים
  english_pob_choice: Kiriath-jearim
  chosen_korean: 기럇여아림
  alternatives_korean:
  - 기랏여아림
  - 기럇야림
  lexicon: HALOT
  rationale: 지명은 음역으로 두되, 한국어 성경 관용과 현대 표기를 고려해 ‘기럇여아림’으로 옮겼습니다.
- source_word: הַיִּתְרִי / הַפּוּתִי / הַשֻּׁמָתִי / הַמִּשְׁרָעִי
  english_pob_choice: the Ithrites / the Puthites / the Shumathites / the Mishraites
  chosen_korean: 이드리 사람들 / 부디 사람들 / 수마시 사람들 / 미스라 사람들
  alternatives_korean:
  - 잇리 사람들 / 풋 사람들 / 쉬마시 사람들 / 미쉬라 사람들
  lexicon: HALOT
  rationale: 각 항목은 족보적 친족·지파 명칭이므로 ‘사람들’로 풀어 집단성을 살리고, 고유명은 음역해 히브리어 형태를 최대한 반영했습니다.
- source_word: מֵאֵלֶּה יָצְאוּ
  english_pob_choice: From these came
  chosen_korean: 이들 가운데서 …이 나왔습니다
  alternatives_korean:
  - 이들에게서 나왔습니다
  - 이들로부터 나왔습니다
  lexicon: HALOT
  rationale: 히브리어 יָצְאוּ는 직역하면 ‘나갔다’이지만 족보 문맥에서는 기원·파생을 뜻하므로, POB의 주석 취지를 살려 ‘나왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 족보 문장의 의미를 ‘출생/기원’으로 처리할지 ‘물리적 이동’으로 처리할지
  chosen_reading: 이 구절은 역사적 이동이 아니라 계보적 기원을 말하는 것으로 읽었습니다.
  alternative_readings:
  - 물리적으로 ‘나갔다’는 표현으로 볼 수 있음
  rationale: 문맥이 연속된 족보 목록이므로, 한국어 본문에서는 기원 관계를 분명하게 드러내는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: 족보 해석의 문맥 우선 원칙
