  lexicon: HALOT
  rationale: 족보 문맥의 הוֹלִיד는 ‘낳다/낳게 하다’의 계보적 의미를 가지므로, 현대 한국어에서 자연스럽고 남성 계보의 연결을 잘 드러내는 ‘낳았습니다’로 옮겼습니다.
