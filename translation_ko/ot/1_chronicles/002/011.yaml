  text: 나손은 살마를 낳았고, 살마는 보아스를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 본문은 ‘살마’로 되어 있습니다. 일부 번역본은 관련 족보와 조화를 이루기 위해 ‘살몬’으로 옮깁니다(예: 룻기 4:20–21; 마태복음 1:4–5).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  english_pob_choice: Nahshon
  chosen_korean: 나하손
  alternatives_korean:
