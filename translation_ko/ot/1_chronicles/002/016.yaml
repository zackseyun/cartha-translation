  lexicon: HALOT
  rationale: 관계 접속사와 복수형 소유격을 자연스러운 서술로 옮기되, 가족 관계의 복수성을 살리기 위해 ‘자매들’로 렌더링했습니다.
- source_word: צְרוּיָה
