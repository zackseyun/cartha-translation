  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: ko
  text: 그들의 자매들은 스루야와 아비가일이었습니다. 스루야의 아들들은 아비새와 요압과 아사헬, 세 사람이었습니다.
  philosophy: optimal-equivalence
