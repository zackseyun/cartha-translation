  - severity: medium
    issue: 각주의 언어 표기 불일치
    rationale: ‘히브리어는 Shema’라고 한 표현은 히브리어 원문이 아니라 로마자 영어식 음역을 제시하므로 부정확합니다. 각주는 영어 음역의 대안을 설명하도록 고쳐야 합니다.
