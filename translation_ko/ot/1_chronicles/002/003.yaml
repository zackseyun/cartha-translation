base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the daughter of Shua the Canaanite''; some take ''Bath-shua'' as a proper name here.'
    reason: lexical_alternative
  - marker: b
    text: 'Or: ''and the LORD put him to death.'' The Hebrew leaves the subject implicit, but it most naturally refers to the LORD from the previous clause.'
    reason: alternative_reading
translation:
  language: ko
  text: 유다의 아들들은 에르, 오난, 셀라입니다. 이 세 사람은 가나안 여인, 곧 수아의 딸에게서 유다에게 태어났습니다.[a] 유다의 맏아들 에르는 야훼 보시기에 악하였습니다. 그래서 야훼께서 그를 죽이셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 고유명사로 읽어 ‘가나안 여인 밧수아에게서’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  english_pob_choice: The sons of Judah
  chosen_korean: 유다의 아들들
  alternatives_korean:
  - 유다의 자손들
  - 유다의 아들들
  lexicon: HALOT
  rationale: 족보 도입구로서 소유격 구조를 자연스럽게 살리되, 직계 남자 후손을 가리키는 기본 의미를 유지했습니다.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  english_pob_choice: by Bath-shua the Canaanite
  chosen_korean: 가나안 여인인 밧수아에게서
  alternatives_korean:
  - 가나안 여인 밧수아에게서
  - 가나안 사람인 밧수아에게서
  lexicon: HALOT
  rationale: 영문 POB의 본문처럼 고유명사화된 ‘밧수아’를 따르되, 히브리어의 친족·출신 관계를 드러내기 위해 ‘가나안 여인인’과 ‘-에게서’를 함께 살렸습니다.
- source_word: בְּכוֹר יְהוּדָה
  english_pob_choice: Judah’s firstborn
  chosen_korean: 유다의 맏아들
  alternatives_korean:
  - 유다의 첫째 아들
  - 유다의 장자
  lexicon: HALOT
  rationale: 족보 문맥에서 ‘맏아들’이 가장 자연스럽고, ‘장자’의 제도적 뉘앙스보다 출생 순서를 직접적으로 드러냅니다.
- source_word: רַע בְּעֵינֵי יְהוָה
  english_pob_choice: was evil in the sight of Yahweh
  chosen_korean: 야훼 보시기에 악하였고
  alternatives_korean:
  - 야훼 눈에 악하였고
  - 야훼 보시기에 사악하였고
  lexicon: HALOT
  rationale: 평가 공식의 관용구를 한국어로 자연스럽게 옮기되, 단순한 도덕평가가 아니라 하나님의 판단 앞에서의 상태라는 점을 유지했습니다.
- source_word: וַיְמִיתֵהוּ
  english_pob_choice: he put him to death
  chosen_korean: 그분이 그를 죽이셨습니다
  alternatives_korean:
  - 그가 그를 죽이셨습니다
  - 그를 죽게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어는 앞절의 주어를 이어받는 구조이므로, 주어를 분명히 하면서도 ‘죽게 하셨습니다’보다 직접적인 사형/살해의 결과를 분명히 했습니다.
theological_decisions:
- issue: 야훼의 명시적 주어화
  chosen_reading: ‘그분이 그를 죽이셨습니다’로 옮겨, 앞절의 ‘야훼’가 암시된 주어임을 분명히 했습니다.
  alternative_readings:
  - ‘야훼께서 그를 죽이셨습니다’
  - ‘그가 그를 죽이셨습니다’
  rationale: 히브리어는 주어를 반복하지 않지만, 앞선 절의 ‘야훼’가 자연스러운 선행사입니다. 한국어에서는 독자가 주어를 놓치지 않도록 명시하는 편이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
