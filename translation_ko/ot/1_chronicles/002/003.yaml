  source_fidelity: 수정이 필요합니다. 히브리어 מִבַּת־שׁוּעַ는 우선적으로 ‘수아의 딸에게서’라는 친족구문으로 옮기는 것이 안전하며, 이를 ‘밧수아’라는 고유명사로 읽을 가능성은 각주에서 보존할 수 있습니다. 초안에는 ‘밧수아에게서 그에게서’라는 중복도 있습니다. וַיְמִיתֵהוּ의 주어는 앞 절의 야훼로 자연스럽게 이해되므로 한국어 본문에서는 야훼를 명시할 수 있습니다.
  naturalness: ‘유다의 아들들은 …입니다’라는 족보적 도입은 자연스럽습니다. 다만 ‘가나안 여인인 밧수아에게서 그에게서 태어났습니다’는 조사와 출처 표현이 중복되어 비문입니다. ‘가나안 여인, 곧 수아의 딸에게서 유다에게 태어났습니다’로 고치면 원문의 부모 관계와 수동 표현을 비교적 자연스럽게 전달합니다.
  terminology: 에르, 오난, 셀라, 유다, 야훼를 사용했습니다. שֵׁלָה는 한국어 성서 인명 표기에서 통용되는 ‘셀라’가 ‘세라’보다 적절합니다. רַע בְּעֵינֵי יְהוָה는 ‘야훼 보시기에 악하였습니다’로 유지했습니다.
