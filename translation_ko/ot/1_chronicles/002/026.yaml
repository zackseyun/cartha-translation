  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: ko
  text: 여라므엘에게 또 다른 아내가 있었는데, 그녀의 이름은 아다라였습니다. 그녀는 오남의 어머니였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또 다른 아내
    reason: lexical_alternative
  - marker: b
    text: 아다라
    reason: source_note
lexical_decisions:
- source_word: וַתְּהִי אִשָּׁה אַחֶרֶת לִירַחְמְאֵל
  english_pob_choice: Jerahmeel also had another wife
  chosen_korean: “여라므엘에게 또 다른 아내가 있었습니다”
  alternatives_korean:
  - “여라므엘에게 다른 아내가 있었습니다”
  - “여라므엘에게도 아내가 하나 더 있었습니다”
  lexicon: HALOT
  rationale: 계보문맥에서 ל + 인명은 소유관계로 자연스럽게 이해되므로 ‘~에게 … 있었습니다’로 옮겼고, אַחֶרֶת는 단순한 ‘다른’보다 추가성을 드러내는 ‘또 다른’이 자연스럽습니다.
- source_word: וּשְׁמָהּ עֲטָרָה
  english_pob_choice: and her name was Atarah
  chosen_korean: “그녀의 이름은 아다라였습니다”
  alternatives_korean:
  - “그녀의 이름은 아타라였습니다”
  - “이름은 아타라였습니다”
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 감각에 맞추어 음역하되, 한국어에서 통용되는 자음·모음 체계를 고려해 ‘Atarah’를 ‘아다라’로 옮겼습니다.
- source_word: הִיא אֵם אוֹנָם
  english_pob_choice: she was the mother of Onam
  chosen_korean: “그녀는 오남의 어머니였습니다”
  alternatives_korean:
  - “그녀는 오남을 낳은 어머니였습니다”
  - “그녀는 오남의 어머니였습니냐”
  lexicon: HALOT
  rationale: אֵם은 계보적 진술에서 직접적으로 ‘어머니’가 가장 분명하며, 속격 표현 ‘~의 어머니’가 원문의 관계를 그대로 드러냅니다.
- source_word: הִיא
  english_pob_choice: she
  chosen_korean: “그녀는”
  alternatives_korean:
  - “그 자신은”
  - “그 여인은”
  lexicon: HALOT
  rationale: 독립대명사의 약한 강조를 한국어에서는 서술 주어 표지로 처리하되, 과도한 강조는 피했습니다.
