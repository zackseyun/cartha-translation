  text: 단, 요셉과 베냐민, 납달리, 갓과 아셀입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּן
  english_pob_choice: Dan
  chosen_korean: 단
  alternatives_korean:
  - 단 지파
  lexicon: HALOT
  rationale: 고유명사이므로 한국어 음역으로 옮겼습니다. 이 절은 족보 목록이므로 ‘지파’를 덧붙이지 않고 이름만 간단히 제시하는 것이 원문 구조를 가장 잘 반영합니다.
- source_word: יוֹסֵף
  english_pob_choice: Joseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요셉 지파
  lexicon: HALOT
  rationale: 표준적인 성경 인명 음역인 ‘요셉’을 사용했습니다. 문맥상 개인 이름을 족보 목록으로 나열하는 형태이므로 부가 설명은 두지 않았습니다.
- source_word: וּ/בִנְיָמִן
  english_pob_choice: and Benjamin
  chosen_korean: 그리고 베냐민
  alternatives_korean:
  - 베냐민
  lexicon: HALOT
  rationale: 히브리어 접속사 ו를 한국어 목록 연결어 ‘그리고/과’로 살렸고, 고유명사는 ‘베냐민’으로 음역했습니다. 문장 첫 부분의 연속 목록성을 자연스럽게 드러내기 위해 쉼표와 연결어를 조정했습니다.
- source_word: נַפְתָּלִי
  english_pob_choice: Naphtali
  chosen_korean: 납달리
  alternatives_korean:
  - 나프탈리
  lexicon: HALOT
  rationale: 표준적인 성경 음역에 따라 ‘납달리’를 사용했습니다.
- source_word: גָּד
  english_pob_choice: Gad
  chosen_korean: 갓
  alternatives_korean:
  - 가드
  lexicon: HALOT
  rationale: 성경 인명으로 통용되는 한국어 음역 ‘갓’을 사용했습니다.
- source_word: וְ/אָשֵׁר
  english_pob_choice: and Asher
  chosen_korean: 아셀
  alternatives_korean:
  - 그리고 아셀
  lexicon: HALOT
  rationale: 마지막 항목의 접속 의미는 한국어 목록의 종결 리듬 안에 포함시켜 별도 ‘그리고’를 생략할 수 있습니다. 고유명사는 표준 음역 ‘아셀’로 옮겼습니다.
