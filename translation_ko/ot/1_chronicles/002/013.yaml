source:
  edition: WLC
  text: וְ/אִישַׁ֛י הוֹלִ֥יד אֶת בְּכֹר֖/וֹ אֶת אֱלִיאָ֑ב וַ/אֲבִינָדָב֙ הַ/שֵּׁנִ֔י וְ/שִׁמְעָ֖א הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
  footnotes:
  - marker: a
    text: Hebrew 'Shimea'; the parallel list in 1 Samuel 16:9 has 'Shammah.'
    reason: cross_reference
translation:
  language: ko
  text: 그리고 이새가 맏아들 엘리압과 둘째 아비나답과 셋째 시므아[a]를 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘시므아’로 적지만, 평행 본문인 사무엘상 16:9에는 ‘삼마’가 나옵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  english_pob_choice: And Jesse
  chosen_korean: 그리고 이새가
  alternatives_korean:
  - 이새가
  - 또 이새가
  lexicon: HALOT
  rationale: 계보 문맥의 단순 연결어 וְ는 자연스러운 서술 연결인 ‘그리고’로 옮기고, האישׁי는 통용되는 인명 ‘이새’로 음역했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 낳았습니다
  - 아버지가 되었습니다
  lexicon: HALOT
  rationale: 히필 ילד는 계보에서 ‘낳다/낳게 하다’의 친족 생성 의미를 가지므로, 남성 계보의 간결한 서술을 살려 ‘낳았습니다’로 옮겼습니다.
- source_word: בְּכֹרוֹ
  english_pob_choice: his firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 그의 첫째 아들
  - 첫아들
  lexicon: HALOT
  rationale: 소유격이 붙은 ‘첫째’의 계보적 의미를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘맏아들’이며, 문맥상 ‘아들’은 보충했습니다.
- source_word: אֱלִיאָב / אֲבִינָדָב / שִׁמְעָא
  english_pob_choice: Eliab / Abinadab / Shimea
  chosen_korean: 엘리압 / 아비나답 / 시므아
  alternatives_korean:
  - 엘리압 / 아비나답 / 시마아
  - 엘리압 / 아비나답 / 삼마
  lexicon: HALOT
  rationale: 열왕·사무엘의 통용형과 달리 역대기의 히브리어 본문 형태를 따르되, 한국어에서는 현대 음역 관행에 맞춰 인명을 옮겼습니다.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  english_pob_choice: the second / the third
  chosen_korean: 둘째 / 셋째
  alternatives_korean:
  - 두 번째 / 세 번째
  - 두째 / 세째
  lexicon: HALOT
  rationale: 계보의 순서 표시는 한국어에서 일반적인 서수 표현 ‘둘째, 셋째’가 가장 간결하고 자연스럽습니다.
