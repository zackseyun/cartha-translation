  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֤א חֶצְרוֹן֙ אֶל בַּת מָכִיר֙ אֲבִ֣י גִלְעָ֔ד וְ/ה֣וּא לְקָחָ֔/הּ וְ/ה֖וּא בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת שְׂגֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
  footnotes:
  - marker: a
    text: Or 'came to'; the Hebrew idiom 'went in to' can function as a discreet way of referring to marital/sexual union.
    reason: lexical_alternative
  - marker: b
    text: '''He took her'' may also be rendered ''he married her'' or ''he took her as wife.'''
    reason: lexical_alternative
  - marker: c
    text: '''Father of Gilead'' may mean immediate father, ancestor, or founder in genealogical usage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 헤스론은 길르앗의 아버지 마길의 딸에게 들어가 그녀를 데려갔는데, 그가 예순 살이었을 때였으며, 그녀는 그에게 세굽을 낳았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “들어가”이며, 히브리어 관용구로서 혼인 또는 성적 결합을 완곡하게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘데려갔다’는 표현은 ‘그녀를 아내로 맞았다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘길르앗의 아버지’는 직계 아버지, 조상, 또는 족보상의 창시자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 이후에
  lexicon: HALOT
  rationale: 이야기의 시간적 순서를 자연스럽게 표시하면서도 원문의 진행감을 유지합니다.
- source_word: בָּא אֶל
  english_pob_choice: went in to
  chosen_korean: 들어가
  alternatives_korean:
  - 가서
  - 찾아가
  lexicon: HALOT
  rationale: 히브리어 관용구의 우회적 표현을 살리되, 한국어에서는 과도하게 직역하지 않고 혼인/성적 결합의 함의를 드러냅니다.
- source_word: לְקָחָהּ
  english_pob_choice: he took her
  chosen_korean: 그녀를 데려갔는데
  alternatives_korean:
  - 그녀를 취했는데
  - 그녀를 아내로 맞았는데
  lexicon: HALOT
  rationale: 문맥상 결혼 수용을 뜻할 수 있지만, 원문을 지나치게 풀지 않기 위해 직접적인 서술을 유지하되 한국어에서는 관계 성립의 결과를 자연스럽게 드러냈습니다.
- source_word: וַתֵּלֶד לוֹ
  english_pob_choice: she bore ... to him
  chosen_korean: 그에게 세굽을 낳았습니다
  alternatives_korean:
  - 그에게 세굽을 출산했습니다
  - 세굽을 그에게 낳았습니다
  lexicon: HALOT
  rationale: 세굽이 목적어로 바로 오고 לוֹ의 방향성을 살려 '그에게'를 유지했습니다.
theological_decisions:
- issue: מָכִיר 아들의 혈연/지배 관계를 '아버지'로 옮길지 여부
  chosen_reading: '''길르앗의 아버지 마길''로 옮겨, 족보적 문맥에서 가능한 창시자/조상 의미를 열어 둡니다.'
  alternative_readings:
  - '''길르앗의 조상 마길'''
  - '''길르앗의 창시자 마길'''
  rationale: 원문과 기존 영어 주석이 모두 족보 용법의 폭을 인정하므로, 특정한 역사적 관계로 과도하게 좁히지 않고 원문의 호칭을 보존합니다.
  doctrine_reference: 족보/문장 의미 범위 보존
