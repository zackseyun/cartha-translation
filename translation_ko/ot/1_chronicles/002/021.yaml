- source_word: לְקָחָהּ
  english_pob_choice: he took her
  chosen_korean: 그녀를 데려갔는데
  alternatives_korean:
  - 그녀를 취했는데
  - 그녀를 아내로 맞았는데
  lexicon: HALOT
  rationale: 문맥상 결혼 수용을 뜻할 수 있지만, 원문을 지나치게 풀지 않기 위해 직접적인 서술을 유지하되 한국어에서는 관계 성립의 결과를 자연스럽게 드러냈습니다.
- source_word: וַתֵּלֶד לוֹ
  english_pob_choice: she bore ... to him
  chosen_korean: 그에게 세굽을 낳았습니다
  alternatives_korean:
  - 그에게 세굽을 출산했습니다
  - 세굽을 그에게 낳았습니다
  lexicon: HALOT
  rationale: 세굽이 목적어로 바로 오고 לוֹ의 방향성을 살려 '그에게'를 유지했습니다.
theological_decisions:
- issue: מָכִיר 아들의 혈연/지배 관계를 '아버지'로 옮길지 여부
  chosen_reading: '''길르앗의 아버지 마길''로 옮겨, 족보적 문맥에서 가능한 창시자/조상 의미를 열어 둡니다.'
  alternative_readings:
  - '''길르앗의 조상 마길'''
  - '''길르앗의 창시자 마길'''
  rationale: 원문과 기존 영어 주석이 모두 족보 용법의 폭을 인정하므로, 특정한 역사적 관계로 과도하게 좁히지 않고 원문의 호칭을 보존합니다.
  doctrine_reference: 족보/문장 의미 범위 보존
