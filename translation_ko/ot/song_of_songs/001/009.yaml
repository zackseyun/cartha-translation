translation:
  language: ko
  text: 나는 당신을, 내 사랑하는 이여, 바로의 병거들 가운데 있는 내 암말에 비유합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסֻסָתִי
  english_pob_choice: to a mare
  chosen_korean: 암말에 비유합니다
  alternatives_korean:
  - 내 암말에 비유합니다
  - 말에 비유합니다
  lexicon: HALOT
  rationale: 히브리어는 여성형 명사 סוּסָה에 1인칭 단수 접미사가 붙은 형태로, 단순한 '말'보다 성별이 드러나는 '암말'이 더 정확합니다. 한국어에서는 비교 대상 앞에 조사 '에'를 두어 비유 표현을 자연스럽게 살렸습니다.
- source_word: בְּרִכְבֵי פַרְעֹה
  english_pob_choice: among Pharaoh’s chariots
  chosen_korean: 바로의 병거들 가운데
  alternatives_korean:
  - 바로의 병거들 속에
  - 바로의 병거들 사이에
  lexicon: HALOT
  rationale: בְּ와 '병거들'의 결합은 위치와 연관성을 함께 가리킬 수 있으므로, 비교 장면의 생동감을 살리는 '가운데'가 가장 자연스럽습니다. '바로'는 한국어 성경에서 통용되는 파라오 표기보다 원어 음역을 살렸습니다.
- source_word: דִּמִּיתִיךְ
  english_pob_choice: I compare you
  chosen_korean: 나는 당신을 ... 비유합니다
  alternatives_korean:
  - 나는 당신을 ... 비교합니다
  - 나는 당신을 ... 같다고 합니다
  lexicon: HALOT
  rationale: 피엘 완료형 1인칭 단수 + 2인칭 여성 단수 접미사는 '비유하다/비슷하게 여기다'의 뉘앙스를 가지므로, 시적 화자의 행위를 현재형으로 옮긴 '비유합니다'가 가장 자연스럽습니다.
- source_word: רַעְיָתִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이여
  alternatives_korean:
  - 내 연인이여
  - 내 사랑이여
  - 내 벗이여
  lexicon: HALOT
  rationale: 아가서의 애정 어린 호칭을 살리면서도 현대 한국어에서 지나치게 구어적이지 않게 하기 위해 '내 사랑하는 이여'를 택했습니다. '내 사랑이여'는 대상 명사감이 약하고, '연인'은 감정의 색조가 다소 현대적입니다.
