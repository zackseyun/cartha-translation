  text: I compare you[a], my beloved, to my mare among Pharaoh’s chariots.
  footnotes:
  - marker: a
    text: Or 'to my mare among Pharaoh’s chariots.' The Hebrew suffix in 'my mare' may be read more explicitly as possessive, though the comparison itself is the main sense.
