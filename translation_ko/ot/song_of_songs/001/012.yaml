reference: Song of Songs 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד שֶׁ֤/הַ/מֶּ֨לֶךְ֙ בִּ/מְסִבּ֔/וֹ נִרְדִּ֖/י נָתַ֥ן רֵיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/012.yaml
  text: While the king was at his table[b][a], my nard gave its fragrance.
  footnotes:
  - marker: a
    text: Or 'While the king was at his banquet' or 'on his couch.' The Hebrew term can refer more broadly to a banquet setting or reclining company.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'my spikenard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 자기 식탁에 앉아 계실 때에, 내 나드가 향기를 풍겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְסִבָּה는 ‘식탁’, ‘연회’, ‘둘러앉은 자리’까지 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 ‘내 스파이크나드’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד שֶׁהַמֶּלֶךְ
  english_pob_choice: While the king
  chosen_korean: 왕이 … 계실 때에
  alternatives_korean:
  - 왕이 … 있는 동안
  - 왕이 … 머무는 동안
  lexicon: HALOT
  rationale: עַד의 시간적 배경을 한국어에서 자연스럽게 살리기 위해 ‘…할 때에/동안’을 택했고, 문맥상 낮춤 없이 서술형으로 옮겼습니다. 존칭 ‘계실’은 화자가 왕에게 직접 예를 표하는 장면이 아니라도 서정적 높임을 유지하는 데 적절합니다.
- source_word: בִּמְסִבּוֹ
  english_pob_choice: at his table
  chosen_korean: 자기 식탁에 앉아 계실 때에
  alternatives_korean:
  - 자기 연회에
  - 자기 자리에서
  - 자기 침상에
  lexicon: HALOT
  rationale: מְסִבָּה가 식탁, 연회, 둘러앉은 자리까지 아우를 수 있어 ‘식탁’으로 구체화하되, 동사 ‘앉아 계실’로 재구성해 한국어의 자연스러운 회식/연회 장면을 살렸습니다.
- source_word: נִרְדִּי
  english_pob_choice: my nard
  chosen_korean: 내 나드
  alternatives_korean:
  - 내 스파이크나드
  - 내 향유
  lexicon: HALOT
  rationale: 전통적 ‘스파이크나드’보다 원어에 가까운 음역 ‘나드’를 택해 식물/향료 이름을 보존했습니다. ‘내’는 소유 접미사를 직접 반영합니다.
- source_word: נָתַן רֵיחוֹ
  english_pob_choice: gave its fragrance
  chosen_korean: 향기를 풍겼습니다
  alternatives_korean:
  - 향기를 냈습니다
  - 향기를 발했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 관용으로 옮겨 ‘향기를 풍기다’로 표현했습니다. ‘발하다’보다 문학적이면서도 과도하게 형식적이지 않습니다.
theological_decisions:
- issue: ‘왕’의 표기와 해석을 메시아적 칭호로 읽을지 여부
  chosen_reading: 본문의 사랑 노래 이미지에 따라 일반 명사 ‘왕’으로 유지했습니다.
  alternative_readings:
  - ‘왕’을 대문자적/메시아적 칭호로 읽기
  - 상징적 신학 독법을 덧붙이기
  rationale: 히브리어는 여기서 남성 연인을 가리키는 서정적 이미지로 읽히며, 본문 자체가 신학적 칭호를 요구하지 않습니다. 따라서 알레고리나 기독론을 주입하지 않고 원문의 표면 의미를 보존했습니다.
  doctrine_reference: Translation philosophy items 1 and 3
