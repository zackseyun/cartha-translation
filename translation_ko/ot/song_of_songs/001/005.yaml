id: SNG.1.5
reference: Song of Songs 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁחוֹרָ֤ה אֲנִי֙ וְֽ/נָאוָ֔ה בְּנ֖וֹת יְרוּשָׁלִָ֑ם כְּ/אָהֳלֵ֣י קֵדָ֔ר כִּ/ירִיע֖וֹת שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/005.yaml
  text: I am dark[a], yet lovely, daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon.
  footnotes:
  - marker: a
    text: Or 'I am dark and lovely.' The Hebrew conjunction is simply 'and'; 'yet' brings out the likely contrast in context.
    reason: alternative_reading
translation:
  language: ko
  text: 예루살렘의 딸들아, 나는 검지만 사랑스럽습니다. 게달의 천막들 같고 솔로몬의 휘장들 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 검고 사랑스럽습니다.” 히브리어 접속사는 단순히 ‘그리고’이지만, 문맥의 대조를 드러내기 위해 ‘그러나’ 또는 ‘하지만’의 뉘앙스로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁחוֹרָה
  english_pob_choice: dark
  chosen_korean: 검지만
  alternatives_korean:
  - 검습니다
  - 어둡지만
  - 검은
  lexicon: HALOT
  rationale: 색채 형용사를 자연스러운 현대 한국어로 옮기되, 시적 대비를 살리기 위해 연결형으로 처리했습니다. '검지만'은 뒤의 호감 표현과 함께 원문의 대비감을 드러냅니다.
- source_word: וְנָאוָה
  english_pob_choice: yet lovely
  chosen_korean: 사랑스럽습니다
  alternatives_korean:
  - 그리고 사랑스럽습니다
  - 아름답습니다
  - 그러나 사랑스럽습니다
  lexicon: HALOT
  rationale: 히브리어 ו는 기본적으로 '그리고'이지만, 영어 POB의 결합된 대조 효과를 따라 한국어에서는 자연스러운 역접감을 살렸습니다. '사랑스럽습니다'는 아가서의 서정적 분위기에 맞는 표현입니다.
- source_word: בְּנוֹת יְרוּשָׁלִָ֑ם
  english_pob_choice: daughters of Jerusalem
  chosen_korean: 예루살렘의 딸들아
  alternatives_korean:
  - 예루살렘의 젊은 여자들아
  - 예루살렘의 딸들이여
  lexicon: HALOT
  rationale: 직역에 가까운 호칭을 유지해 시적 호소를 보존했습니다. '젊은 여자들'은 해석적이므로 본문에는 두지 않았습니다.
- source_word: כְּ/אָהֳלֵ֣י קֵדָ֔ר
  english_pob_choice: like the tents of Kedar
  chosen_korean: 게달의 천막들 같고
  alternatives_korean:
  - 게달의 장막들 같고
  - 게달의 텐트들 같고
  lexicon: HALOT
  rationale: 비교구문을 그대로 옮기되, '천막'을 써서 유목 텐트의 이미지와 어두운 색감을 유지했습니다. 고유명사는 통용 표기 '게달'을 따랐습니다.
- source_word: כִּ/ירִיעוֹת שְׁלֹמֹֽה
  english_pob_choice: like the curtains of Solomon
  chosen_korean: 솔로몬의 휘장들 같습니다
  alternatives_korean:
  - 솔로몬의 휘장들 같고
  - 솔로몬의 커튼들 같습니다
  - 솔로몬의 천막 휘장들 같습니다
  lexicon: HALOT
  rationale: יְרִיעוֹת는 장막의 천이나 휘장을 가리킬 수 있어, 한국어에서는 고풍스럽지만 이해 가능한 '휘장'을 선택했습니다. '솔로몬'은 고유명사 관용 표기를 따랐습니다.
theological_decisions:
- issue: ו before נָאוָה의 결합 방식
  chosen_reading: 한국어 본문에서는 '검지만'으로 역접을 살려 영어 POB의 'yet lovely' 효과를 반영했습니다.
  alternative_readings:
  - '''검고 사랑스럽습니다''처럼 단순 접속'
  - '''검지만 사랑스럽습니다''의 더 직설적 표현'
  rationale: 히브리어 표면형은 단순 접속이지만 문맥상 화자의 외형을 둘러싼 잠재적 평가에 대한 반향이 있어, 원문이 허용하는 대비를 한국어 관용에 맞게 드러냈습니다. 단, 본문 자체는 대비를 명시하는 접속사로 과장하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological/interpretive tension rather than resolve it; optimal equivalence'
