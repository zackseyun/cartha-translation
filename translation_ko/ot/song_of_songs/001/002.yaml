  footnotes:
  - marker: a
    text: 히브리어 דֹּדֶיךָ는 문자적으로는 복수형이며, 여기서는 더 구체적으로는 사랑의 표현이나 애무를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁקֵנִי
  english_pob_choice: Let him kiss me
  chosen_korean: 나를 입맞추게 하십시오
  alternatives_korean:
  - 그가 나에게 입맞추기를 바랍니다
  - 그가 나를 입맞추게 하옵소서
  lexicon: HALOT
  rationale: 히브리어 미완료형이 여기서는 바람/청원의 뉘앙스를 띠므로, 현대 한국어에서는 직접 명령형보다 청원형으로 옮겨 자연스럽고 시적 긴장을 살렸습니다.
- source_word: מִנְּשִׁיקוֹת פִּיהוּ
  english_pob_choice: with the kisses of his mouth
  chosen_korean: 그의 입맞춤으로
  alternatives_korean:
  - 그의 입의 입맞춤으로
  - 그의 입의 입맞춤들로
  lexicon: HALOT
  rationale: 히브리어의 직역형을 유지할 수 있지만, 한국어에서는 '입의 입맞춤'이 어색하므로 '그의 입맞춤으로'로 옮겨 입의 구체성과 감각성을 자연스럽게 보존했습니다.
- source_word: דֹּדֶיךָ
  english_pob_choice: your love
  chosen_korean: 당신의 사랑
  alternatives_korean:
  - 당신의 애정
  - 당신의 애무
  lexicon: HALOT
  rationale: 복수형 דֹּדֶיךָ는 사랑의 표현이나 애무를 가리킬 수 있으나, 영어 POB가 최종적으로 'your love'를 채택한 점을 반영하여 한국어도 '사랑'으로 옮기되, 너무 추상적이지 않도록 문맥 전체의 관능성을 살렸습니다.
- source_word: מִיָּיִן
  english_pob_choice: than wine
  chosen_korean: 포도주보다 더 좋습니다
  alternatives_korean:
  - 포도주보다 낫습니다
  - 술보다 더 좋습니다
  lexicon: HALOT
  rationale: 비교 구문은 한국어에서 'A보다 더 좋습니다'가 가장 자연스럽고, '포도주'는 성서적 이미지와 원문의 구체성을 유지합니다.
theological_decisions:
- issue: 아가서의 직접적 애정 표현의 수위
  chosen_reading: 원문의 육체적·감각적 이미지를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 비유적으로 완화해 '사랑'만 강조하기
  - 교회적·영적 알레고리로 전환하기
  rationale: 본문은 연인의 직접적 욕망과 친밀감을 시적으로 표현하므로, 본문이 의도한 감각적 긴장을 보존하는 것이 원문 충실도에 합당합니다.
  doctrine_reference: 성경 본문의 문학 장르와 표면 의미 존중
- issue: 청원형 어조
  chosen_reading: 한국어에서는 존대 청원형 '...하게 하십시오'를 사용했습니다.
  alternative_readings:
  - 직역형 '그가 나를 입맞추게 하소서'
  - 반말형 '그가 나를 입맞추게 해 주세요'
  rationale: 합쇼체 서술 규범에 맞추면서도, 화자의 소망을 드러내는 원문의 바람/청원 뉘앙스를 유지하기 위해 선택했습니다.
  doctrine_reference: 표준어 합쇼체 및 시적 화법
