source:
  edition: WLC
  text: אַל תִּרְא֨וּ/נִי֙ שֶׁ/אֲנִ֣י שְׁחַרְחֹ֔רֶת שֶׁ/שֱּׁזָפַ֖תְ/נִי הַ/שָּׁ֑מֶשׁ בְּנֵ֧י אִמִּ֣/י נִֽחֲרוּ בִ֗/י שָׂמֻ֨/נִי֙ נֹטֵרָ֣ה אֶת הַ/כְּרָמִ֔ים כַּרְמִ֥/י שֶׁ/לִּ֖/י לֹ֥א נָטָֽרְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/006.yaml
  text: Do not stare at me because I am dark[a], because the sun has scorched me. My mother’s sons were angry with me; they made me keeper of the vineyards[d][c][b], but my own vineyard I have not kept.
  footnotes:
  - marker: a
    text: Or 'Do not look at me because I am black,' with 'black' reflecting a more literal rendering of the Hebrew adjective.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'because the sun has scorched/burned me'; traditional renderings sometimes say 'the sun has looked upon me.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'My mother’s sons.'
    reason: lexical_alternative
  - marker: d
    text: '''My own vineyard'' is likely metaphorical, but the exact referent is left unstated in the Hebrew.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 검다고 해서 나를 빤히 보지 마십시오[a]. 햇볕이 나를 그을렸기[b] 때문입니다. 내 어머니의 아들들이 내게 화를 내어 나를 포도원들을 지키게 했습니다. 그러나 내 자신의 포도원은 지키지 못했습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 검다고 해서 나를 보지 마십시오’. 히브리어 형용사는 더 문자적으로는 ‘검다’에 가깝고, 문맥상 햇볕에 검게 그을린 모습을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘햇볕이 나를 그을렸거나 태웠기’입니다. 전통 번역에는 ‘태양이 나를 바라보았기’처럼 옮긴 경우도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘내 자신의 포도원’은 원문의 ‘내 포도원’에 소유 강조가 겹친 표현입니다. 비유일 가능성이 있으나, 정확한 비유 대상은 히브리어에서 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְאוּנִי
  english_pob_choice: Do not stare at me
  chosen_korean: 보지 마십시오
  alternatives_korean:
  - 쳐다보지 마십시오
  - 응시하지 마십시오
  lexicon: HALOT
  rationale: 부정 명령과 2인칭 복수+1인칭 단수 목적어의 기본 뜻을 살리되, 한국어에서는 과도한 해석 없이 자연스러운 금지 표현으로 옮겼습니다.
- source_word: שְׁחַרְחֹרֶת
  english_pob_choice: dark
  chosen_korean: 검은
  alternatives_korean:
  - 어두운
  - 검게 그을린
  - 까무잡잡한
  lexicon: HALOT
  rationale: 화자의 피부가 태양에 의해 짙어졌다는 뜻을 간결하게 드러내기 위해 ‘검은’을 택했습니다. 다만 현대 한국어의 인종적 오해를 줄이기 위해 과도한 일반화는 피했습니다.
- source_word: שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  english_pob_choice: because the sun has scorched me
  chosen_korean: 태양이 나를 그을렸기
  alternatives_korean:
  - 태양이 나를 태웠기
  - 태양이 나를 쬐었기
  - 태양이 나를 덥혔기
  lexicon: HALOT
  rationale: શזף의 핵심은 강한 햇볕에 의한 그을림이므로 ‘그을리다’가 가장 가깝습니다. ‘쬐었다’는 관용적으로 완곡하고, ‘태웠다’는 너무 강하게 들릴 수 있습니다.
- source_word: בְּנֵי אִמִּי
  english_pob_choice: My mother’s sons
  chosen_korean: 내 어머니의 아들들이
  alternatives_korean:
  - 내 형제들이
  - 내 어머니의 자식들이
  lexicon: HALOT
  rationale: 원문을 직역해 ‘형제들’로 평준화하지 않고, 가족 내부의 거리감과 뉘앙스를 보존했습니다.
- source_word: שָׂמֻנִי נֹטֵרָה אֶת הַכְּרָמִים
  english_pob_choice: they made me keeper of the vineyards
  chosen_korean: 나를 포도원들의 지키는 자로 삼았습니다
  alternatives_korean:
  - 나를 포도원들을 지키는 자로 세웠습니다
  - 나를 포도원들의 감시자로 삼았습니다
  lexicon: HALOT
  rationale: נֹטֵרָה의 지키는/보호하는 뜻을 살려 ‘지키는 자’로 옮겼습니다. 복수 ‘포도원들’도 그대로 유지해 노동 현장의 다수성을 드러냈습니다.
- source_word: כַּרְמִי שֶׁלִּי לֹא נָטָרְתִּי
  english_pob_choice: but my own vineyard I have not kept
  chosen_korean: 그러나 내 own 포도원은 지키지 못했습니다[d]
  alternatives_korean:
  - 그러나 내 자신의 포도원은 지키지 못했습니다
  - 그러나 내 포도원은 돌보지 못했습니다
  lexicon: HALOT
  rationale: ‘my own vineyard’의 메타포를 해설하지 않고 그대로 남기되, 번역문에서 소유 강조를 보존했습니다. ‘keep’와 앞의 ‘keeper’ 간 어휘 연계도 유지했습니다.
theological_decisions:
- issue: ‘my own vineyard’의 비유적 의미
  chosen_reading: 주석 없이 본문에서는 포도원 이미지를 그대로 유지합니다.
  alternative_readings:
  - 몸/외모에 대한 비유로 풀이
  - 순결이나 개인적 삶에 대한 비유로 풀이
  rationale: 원문은 비유 가능성을 열어 두지만 구체적 지시대상은 밝히지 않습니다. 한국어 본문에서 해석을 앞서가면 시적 모호성이 사라지므로, 독자가 문맥에서 판단하도록 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
