  alternative_readings:
  - ‘당신에게 …을 만들어 주겠습니다’
  - ‘우리가 …을 만들 것입니다’
  rationale: 이 절은 시적 대화 속 약속 진술이므로, 공동 주체성과 상대방 지향성을 함께 살리는 표현이 본문 의미를 가장 자연스럽게 전달합니다.
  doctrine_reference: 문학적-시적 본문 번역 원칙
