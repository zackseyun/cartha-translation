  lexicon: HALOT
  rationale: 문맥상 금으로 만든 장신구를 가리키지만 정확한 형태는 불확실하므로, 특정 물건으로 단정하기보다 포괄적인 ‘장식품’이 원문의 불확실성을 잘 반영합니다.
