translation:
  language: ko
  text: 우리는 당신을 위해 금 장식품[a], 은 장식 못[b]을 만들겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 금으로 된 어떤 장신구를 가리키며, 정확한 형식은 확실하지 않습니다. ‘사슬’ 또는 ‘줄’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 은으로 된 작은 장식 요소를 가리키며, ‘구슬’ 또는 ‘반짝이 장식’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרֵי
  english_pob_choice: ornaments
  chosen_korean: 장식품
  alternatives_korean:
