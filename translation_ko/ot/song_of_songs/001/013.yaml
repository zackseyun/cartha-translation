base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/013.yaml
  text: My beloved is to me a sachet of myrrh[c][b][a]; he lies between my breasts.
  footnotes:
  - marker: a
    text: Or 'a bundle of myrrh.' The Hebrew צְרוֹר denotes a small wrapped packet or bundle; 'sachet' is chosen to convey the perfumed, wearable sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'he lodges' or 'he spends the night between my breasts.' The verb can carry an overnight nuance, which intensifies the intimate imagery.
    reason: lexical_alternative
  - marker: c
    text: Traditional English versions often read 'my bosom,' but the Hebrew explicitly says 'my breasts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 사랑하는 이는 내게 몰약 향주머니[a] 같으며, 내 두 젖가슴[c] 사이에 머무릅니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몰약 한 묶음’. 히브리어 צְרוֹר는 작은 묶음이나 싸 놓은 꾸러미를 뜻합니다. 여기서는 몰약의 향기와 몸에 지니는 이미지를 고려하여 ‘향주머니’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘묵습니다’ 또는 ‘밤을 지냅니다’. 히브리어 יָלִין은 묵거나 밤을 지내는 것을 뜻할 수 있어, 친밀한 이미지에 밤을 지새우는 뉘앙스를 더합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 שָׁדַי는 문자적으로 ‘나의 두 젖가슴’을 뜻합니다. 전통 번역의 ‘품’ 같은 완곡한 표현 대신 원문의 구체적인 신체 이미지를 따랐습니다.
    reason: lexical_alternative
