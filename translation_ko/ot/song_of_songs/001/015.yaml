source:
  edition: WLC
  text: הִנָּ֤/ךְ יָפָה֙ רַעְיָתִ֔/י הִנָּ֥/ךְ יָפָ֖ה עֵינַ֥יִ/ךְ יוֹנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/015.yaml
  text: Look[a], you are beautiful, my beloved; look, you are beautiful—your eyes are doves.
  footnotes:
  - marker: a
    text: 'Or ''your eyes are like doves.'' The Hebrew expresses the image tersely: ''your eyes are doves.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 당신은 아름답습니다, 나의 사랑하는 이여. 보십시오, 당신은 아름답습니다—당신의 눈은 비둘기들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 눈은 비둘기들입니다’입니다. 히브리어는 비교어를 생략한 압축된 은유를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  english_pob_choice: Look, you are
  chosen_korean: 보십시오, 당신은
  alternatives_korean:
  - 보라, 당신은
  - 보십시오, 그대는
  lexicon: HALOT
  rationale: הִנֵּה의 2인칭 여성형은 주의를 환기하는 감탄/지시 표현이므로, 현대 한국어에서는 ‘보십시오’가 ‘look’의 직접성과 호소력을 가장 자연스럽게 살립니다.
- source_word: יָפָה
  english_pob_choice: beautiful
  chosen_korean: 아름답습니다
  alternatives_korean:
  - 아릅답습니다
  - 아리답습니다
  - 아름답네요
  lexicon: HALOT
  rationale: 형용사 יָפָה는 외모의 아름다움을 가리키므로, 현대 표준어의 가장 직접적인 대응인 ‘아름답습니다’를 택했습니다.
- source_word: רַעְיָתִי
  english_pob_choice: my beloved
  chosen_korean: 나의 사랑하는 이여
  alternatives_korean:
  - 나의 사랑이여
  - 내 사랑이여
  - 나의 연인이여
  lexicon: HALOT
  rationale: 아가에서 이 호칭은 친밀한 연인에 대한 부름이므로, ‘beloved’의 관계성과 호격성을 살리되 한국어에서 덜 어색한 ‘사랑하는 이’로 옮겼습니다.
- source_word: יוֹנִים
  english_pob_choice: doves
  chosen_korean: 비둘기들
  alternatives_korean:
  - 비둘기처럼
  - 비둘기입니다
  lexicon: HALOT
  rationale: 히브리어는 비유를 풀어 ‘~처럼’이라고 하지 않고 명사구로 압축해 말하므로, 이미지의 응축을 살려 ‘비둘기들’로 직역했습니다.
theological_decisions:
- issue: 호격의 정서적 직접성
  chosen_reading: 문장 전체를 연인의 감탄과 직접 호소로 유지해, 시적 친밀감을 약화시키지 않았습니다.
  alternative_readings:
  - 보다 중립적인 서술문조로 완화
  - ‘그대’로 거리감을 더함
  rationale: 아가의 화자는 사랑의 친밀한 호칭을 반복하므로, 합쇼체 안에서도 호격과 감탄의 밀도를 보존하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 문학적 본문 해석 원칙
- issue: ‘your eyes are doves’의 압축된 은유
  chosen_reading: ‘당신의 눈은 비둘기들입니다’로 은유를 직접 유지했습니다.
  alternative_readings:
  - ‘당신의 눈은 비둘기처럼 보입니다’
  - ‘당신의 눈은 비둘기와 같습니다’
  rationale: 히브리어는 비교어 없이 명사적 은유를 사용하므로, 한국어도 비교를 보태기보다 원문의 응축된 표현을 보존했습니다.
  doctrine_reference: 시적 은유 보존 원칙
