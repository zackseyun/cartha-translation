base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/010.yaml
  text: Your cheeks are lovely with ornaments[b][a], your neck with strings of jewels.
  footnotes:
  - marker: a
    text: Or 'with rows'; the Hebrew term likely refers to rows or arrangements of ornaments. Some take it more literally as a specific kind of adornment.
    reason: lexical_alternative
  - marker: b
    text: Or 'with beads' or 'with necklaces'; the Hebrew refers to strung ornaments.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 뺨은 장식으로 아름답고[a], 당신의 목은 구슬 끈으로 아름답습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘줄’이나 ‘배열’을 뜻할 수 있으며, 장식이 줄지어 놓인 모양 또는 특정한 장식 형태를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 꿰어 만든 장식물을 가리킬 수 있으며, ‘구슬’, ‘목걸이’, 또는 ‘보석 줄’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוּ
  english_pob_choice: are lovely
  chosen_korean: 아름답습니다
  alternatives_korean:
  - 아름답습니다만
  - 보기 좋습니다
  - 곱습니다
  lexicon: HALOT
  rationale: נאה의 기본 뜻은 아름다움과 어울림을 아우르므로, 현대 한국어에서는 자연스럽고 품위 있는 ‘아름답습니다’가 시의 찬미어로 적절합니다.
- source_word: לְחָיַיִךְ
  english_pob_choice: your cheeks
  chosen_korean: 당신의 뺨은
  alternatives_korean:
  - 당신의 볼은
  - 당신의 얼굴은
  - 당신의 턱은
  lexicon: HALOT
  rationale: לְחָי는 얼굴 부위 중 뺨/볼을 가리키므로, 시적 맥락에서 가장 직접적인 ‘뺨’으로 옮겼습니다.
- source_word: בַּתֹּרִים
  english_pob_choice: with ornaments
  chosen_korean: 장식으로
  alternatives_korean:
  - 줄로
  - 줄무늬로
  - 열로
  lexicon: HALOT
  rationale: 본문의 히브리어는 ‘줄지어 놓인 장식’ 또는 유사한 배열을 가리킬 수 있어, 한국어에서는 대상이 생략되지 않도록 포괄적으로 ‘장식으로’ 옮겼습니다.
- source_word: בַּחֲרוּזִים
  english_pob_choice: with strings of jewels
  chosen_korean: 구슬 끈으로
  alternatives_korean:
  - 보석 줄로
  - 목걸이로
  - 구슬 목걸이로
  lexicon: HALOT
  rationale: חרוזים는 꿰어 만든 구슬이나 장식물의 뜻을 지니므로, 줄지어 꿴 장식의 이미지를 살리는 ‘구슬 끈으로’가 적절합니다.
theological_decisions:
- issue: 시적 찬미의 직역성과 한국어 자연스러움의 균형
  chosen_reading: 문장 구조는 평서형으로 유지하되, 감탄형 과장은 덧붙이지 않았습니다.
  alternative_readings:
  - 당신의 뺨은 아름답고 장식적입니다.
  - 당신의 뺨은 정말 아름답습니다.
  rationale: 본문은 연인의 외양을 찬미하는 시구이므로, 원문의 비유적 구조를 유지하면서도 현대 한국어에서 자연스럽게 읽히는 평서 찬미문으로 옮겼습니다.
  doctrine_reference: 아가서의 प्रेम/찬미 시학
- issue: בַּתֹּרִים의 애매성 처리
  chosen_reading: 구체적 장신구 이름을 단정하지 않고, 장식 일반으로 번역했습니다.
  alternative_readings:
  - 열로
  - 줄로
  - 비둘기들로
  rationale: 히브리어 어근과 문맥상 배열된 장식의 뜻이 유력하므로, 특정 장신구를 단정하기보다 문맥이 지지하는 넓은 의미를 채택했습니다.
  doctrine_reference: 본문 비평과 어휘 의미 범위
