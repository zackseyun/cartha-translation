id: SNG.1.7
reference: Song of Songs 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַגִּ֣ידָ/ה לִּ֗/י שֶׁ֤/אָהֲבָה֙ נַפְשִׁ֔/י אֵיכָ֣ה תִרְעֶ֔ה אֵיכָ֖ה תַּרְבִּ֣יץ בַּֽ/צָּהֳרָ֑יִם שַׁ/לָּ/מָ֤ה אֶֽהְיֶה֙ כְּ/עֹ֣טְיָ֔ה עַ֖ל עֶדְרֵ֥י חֲבֵרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
  footnotes:
  - marker: a
    text: Or 'like one who wanders' beside the flocks of your companions. The Hebrew expression can be understood either as a woman veiling herself or, by contextual interpretation, as one roaming about in search of the beloved.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 양 떼를 어디에서 먹이시며, 정오에는 어디에서 쉬게 하십니까? 어찌하여 내가 당신의 동료들의 양 떼 곁에서 얼굴을 가린 여인처럼 되어야 합니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 동료들의 양 떼 곁에서 헤매는 사람처럼’으로도 옮길 수 있습니다. 히브리어 표현은 문맥에 따라 얼굴을 가린 여인으로도, 혹은 사랑하는 이를 찾아 이리저리 다니는 사람으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  english_pob_choice: Tell me
  chosen_korean: 당신에게 알려 주십시오
  alternatives_korean:
  - 말해 주십시오
  - 말씀해 주십시오
  lexicon: HALOT
  rationale: 히브리어 명령형의 직접적 요청을 살리면서도, 시적 호소문맥에 맞게 자연스러운 존댓말로 옮겼습니다.
- source_word: שֶׁאָהֲבָה נַפְשִׁי
  english_pob_choice: you whom my soul loves
  chosen_korean: 당신
  alternatives_korean:
  - 내 영혼이 사랑하는 분
  - 내가 사랑하는 당신
  lexicon: HALOT
  rationale: ‘내 영혼이 사랑하는’이라는 관용구의 정서를 유지하되, 한국어 시어로는 호칭 앞에 길게 풀기보다 문맥 속에서 압축해 자연스럽게 처리했습니다.
- source_word: תִרְעֶה
  english_pob_choice: you pasture your flock
  chosen_korean: 당신의 양 떼를 먹이시며
  alternatives_korean:
  - 당신의 양 떼를 치시며
  - 당신의 양 떼를 목양하시며
  lexicon: HALOT
  rationale: 목자 행위를 가리키는 רעה를 ‘먹이다’로 옮겨 실제 목초지 이미지가 살아나게 했고, 목적어는 영어 POB처럼 문맥상 보충했습니다.
- source_word: תַּרְבִּיץ
  english_pob_choice: you make it lie down
  chosen_korean: 쉬게 하십니까
  alternatives_korean:
  - 눕게 하십니까
  - 쉬게 만드십니까
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 동사로 ‘쉬게 하다’를 택했습니다.
- source_word: כְּעֹטְיָה
  english_pob_choice: like one who veils herself
  chosen_korean: 얼굴을 가린 여인처럼
  alternatives_korean:
  - 베일을 쓴 여인처럼
  - 얼굴을 가리고 다니는 사람처럼
  lexicon: HALOT
  rationale: 기본 의미인 ‘덮다/가리다’를 따라 사회적 수치를 암시하는 표현으로 옮겼고, 대안적 이해인 ‘헤매는 자’는 각주로 처리했습니다.
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  english_pob_choice: beside the flocks of your companions
  chosen_korean: 당신의 동료들의 양 떼 곁에서
  alternatives_korean:
  - 당신의 친구들의 양 떼 옆에서
  - 동료 목자들의 떼 곁에서
  lexicon: HALOT
  rationale: חֲבֵרִים를 ‘동료들’로 옮겨 관계의 근접성을 살리고, עַל의 위치 의미를 ‘곁에서’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 시적 수사에서의 직접 호칭과 존댓말의 결합
  chosen_reading: 화자가 연인에게 직접 묻는 형식이므로, 전체는 합쇼체로 유지하되 2인칭 직접 호칭과 동사 존대를 함께 살렸습니다.
  alternative_readings:
  - 평서체로 낮춘 번역
  - 보다 서정적인 반말체
  rationale: 아가의 사랑시 문맥은 친밀하지만, 한국어 성경 문체로는 청중에게 읽히는 공적 본문이므로 현대 공식체를 유지하는 편이 소통성과 품격을 함께 지킵니다.
  doctrine_reference: 문체/장르 번역 원칙
- issue: 히브리어 표현 כְּעֹטְיָה의 해석
  chosen_reading: 본문 본역은 ‘얼굴을 가린 여인처럼’으로 두고, ‘헤매는 자’ 가능성은 각주로 남겼습니다.
  alternative_readings:
  - ‘길 잃은 여인처럼’
  - ‘헤매는 사람처럼’
  rationale: 문맥상 수치와 은폐의 이미지가 우선이지만, 어휘상 다른 해석 가능성을 지워 버리지 않기 위해 POB의 대안 독법을 각주로 보존했습니다.
  doctrine_reference: 본문 해석의 다의성 보존
