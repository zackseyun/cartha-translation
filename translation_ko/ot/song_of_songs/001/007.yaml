  text: הַגִּ֣ידָ/ה לִּ֗/י שֶׁ֤/אָהֲבָה֙ נַפְשִׁ֔/י אֵיכָ֣ה תִרְעֶ֔ה אֵיכָ֖ה תַּרְבִּ֣יץ בַּֽ/צָּהֳרָ֑יִם שַׁ/לָּ/מָ֤ה אֶֽהְיֶה֙ כְּ/עֹ֣טְיָ֔ה עַ֖ל עֶדְרֵ֥י חֲבֵרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
  footnotes:
  - marker: a
    text: Or 'like one who wanders' beside the flocks of your companions. The Hebrew expression can be understood either as a woman veiling herself or, by contextual interpretation, as one roaming about in search of the beloved.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼이 사랑하는 이여, 내게 말씀해 주십시오. 당신은 어디에서 양 떼를 먹이시며, 정오에는 어디에서 그것들을 쉬게 하십니까? 어찌하여 내가 당신의 동료들의 양 떼 곁에서 얼굴을 가린 여인[a]처럼 되어야 합니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 동료들의 양 떼 곁에서 헤매는 사람처럼’으로도 옮길 수 있습니다. 히브리어 표현은 얼굴을 가린 여인으로 이해될 수도 있고, 문맥에 따라 사랑하는 이를 찾아 이리저리 다니는 사람으로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
