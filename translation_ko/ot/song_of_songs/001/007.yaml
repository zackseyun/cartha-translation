  rationale: 목자 행위를 가리키는 רעה를 ‘먹이다’로 옮겨 실제 목초지 이미지가 살아나게 했고, 목적어는 영어 POB처럼 문맥상 보충했습니다.
- source_word: תַּרְבִּיץ
  english_pob_choice: you make it lie down
  chosen_korean: 쉬게 하십니까
  alternatives_korean:
