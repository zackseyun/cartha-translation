  lexicon: HALOT
  rationale: 기본 의미인 ‘덮다/가리다’를 따라 사회적 수치를 암시하는 표현으로 옮겼고, 대안적 이해인 ‘헤매는 자’는 각주로 처리했습니다.
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  english_pob_choice: beside the flocks of your companions
  chosen_korean: 당신의 동료들의 양 떼 곁에서
  alternatives_korean:
  - 당신의 친구들의 양 떼 옆에서
  - 동료 목자들의 떼 곁에서
  lexicon: HALOT
  rationale: חֲבֵרִים를 ‘동료들’로 옮겨 관계의 근접성을 살리고, עַל의 위치 의미를 ‘곁에서’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 시적 수사에서의 직접 호칭과 존댓말의 결합
  chosen_reading: 화자가 연인에게 직접 묻는 형식이므로, 전체는 합쇼체로 유지하되 2인칭 직접 호칭과 동사 존대를 함께 살렸습니다.
  alternative_readings:
  - 평서체로 낮춘 번역
  - 보다 서정적인 반말체
  rationale: 아가의 사랑시 문맥은 친밀하지만, 한국어 성경 문체로는 청중에게 읽히는 공적 본문이므로 현대 공식체를 유지하는 편이 소통성과 품격을 함께 지킵니다.
  doctrine_reference: 문체/장르 번역 원칙
- issue: 히브리어 표현 כְּעֹטְיָה의 해석
  chosen_reading: 본문 본역은 ‘얼굴을 가린 여인처럼’으로 두고, ‘헤매는 자’ 가능성은 각주로 남겼습니다.
  alternative_readings:
  - ‘길 잃은 여인처럼’
  - ‘헤매는 사람처럼’
  rationale: 문맥상 수치와 은폐의 이미지가 우선이지만, 어휘상 다른 해석 가능성을 지워 버리지 않기 위해 POB의 대안 독법을 각주로 보존했습니다.
  doctrine_reference: 본문 해석의 다의성 보존
