id: SNG.1.3
reference: Song of Songs 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/רֵ֨יחַ֙ שְׁמָנֶ֣י/ךָ טוֹבִ֔ים שֶׁ֖מֶן תּוּרַ֣ק שְׁמֶ֑/ךָ עַל כֵּ֖ן עֲלָמ֥וֹת אֲהֵבֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/003.yaml
  text: The fragrance of your oils is pleasing[a]; your name is oil poured out[b]; therefore young women love you.
  footnotes:
  - marker: a
    text: Or 'For the fragrance of your oils is good'; the Hebrew syntax is compressed and highly poetic.
    reason: alternative_reading
  - marker: b
    text: '''Young women'' translates Hebrew עֲלָמוֹת, which can also be rendered ''maidens''; some translations render it ''virgins,'' but that is more specific than the term itself requires here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그대의 향유는 향기가 좋습니다[a]; 그대의 이름은 쏟아 부은 기름입니다. 그러므로 젊은 여인들이 그대를 사랑합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그대의 향유의 향기는 좋습니다.’ 히브리어 문장은 매우 압축된 시어입니다.
    reason: alternative_reading
  - marker: b
    text: ‘젊은 여인들’은 히브리어 알라모트(עֲלָמוֹת)를 옮긴 것입니다. ‘처녀들’ 또는 ‘소녀들’로도 옮길 수 있으나, 이 말 자체가 여기서 반드시 처녀임을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרֵיחַ / רֵיחַ
  english_pob_choice: The fragrance of
  chosen_korean: 향유의 향기
  alternatives_korean:
  - 향내
  - 냄새
  lexicon: HALOT
  rationale: רֵיחַ는 여기서 긍정적 후각 이미지를 가리키므로 ‘향기’가 자연스럽고, לְ는 한국어에서 소유·관계 표현으로 풀어 주어 ‘향유의 향기’로 옮겼습니다.
- source_word: שְׁמָנֶיךָ
  english_pob_choice: your oils
  chosen_korean: 그대의 향유
  alternatives_korean:
  - 그대의 기름들
  - 그대의 향유들
  lexicon: HALOT
  rationale: שֶׁמֶן의 기본 의미는 ‘기름’이지만, 문맥상 향기로운 기름/향유를 가리키므로 직역적이되 자연스러운 ‘향유’로 옮겼습니다.
- source_word: שֶׁמֶן תּוּרַק
  english_pob_choice: oil poured out
  chosen_korean: 부어 놓은 기름
  alternatives_korean:
  - 쏟아 부은 기름
  - 부어진 기름
  lexicon: HALOT
  rationale: תּוּרַק은 ‘붓다/쏟다’의 수동형이므로 ‘부어 놓은’이 동작성과 결과 상태를 함께 살리며, 원문의 기름-향 이미지도 보존합니다.
- source_word: עֲלָמוֹת
  english_pob_choice: young women
  chosen_korean: 젊은 여자들
  alternatives_korean:
  - 처녀들
  - 소녀들
  - 시집갈 나이의 여자들
  lexicon: HALOT
  rationale: עֲלָמוֹת는 반드시 ‘처녀’까지 특정하지는 않으므로, POB의 ‘young women’을 따라 과도한 성적·사회적 지정 없이 ‘젊은 여자들’로 옮겼습니다.
theological_decisions:
- issue: 지혜/사랑 노래의 비유적 언어를 직설화하지 않기
  chosen_reading: ‘그대의 이름은 부어 놓은 기름 같습니다’라는 비유를 그대로 유지했습니다.
  alternative_readings:
  - ‘그대의 명성은 퍼지는 향기 같습니다’
  - ‘그대의 이름은 향기로운 기름과 같습니다’
  rationale: 이 구절은 인물의 이름/명성을 향유에 비유하는 압축된 시적 표현이므로, 의미를 풀어 쓰기보다 원문의 은유 구조를 보존하는 편이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 문학적 비유 보존 원칙
- issue: עֲלָמוֹת의 번역 범위
  chosen_reading: ‘젊은 여자들’로 번역했습니다.
  alternative_readings:
  - ‘처녀들’
  - ‘여인들’
  rationale: 히브리어 어휘 자체가 ‘처녀’로 제한되지 않으므로, 한국어에서도 과도한 신학적/도덕적 함의를 덧씌우지 않는 번역이 적절합니다.
  doctrine_reference: 어휘 의미 범위 보존
