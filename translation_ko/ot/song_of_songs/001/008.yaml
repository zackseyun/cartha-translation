base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/008.yaml
  text: If you do not know[a], most beautiful among women, go out for yourself in the tracks of the flock[b], and pasture your young goats beside the shepherds’ tents.
  footnotes:
  - marker: a
    text: Or 'behind the flock'; the Hebrew literally says 'in the tracks/footsteps of the flock.'
    reason: lexical_alternative
  - marker: b
    text: Or 'graze your kids'; 'young goats' renders the Hebrew term more explicitly for modern readers.
    reason: lexical_alternative
translation:
  language: ko
  text: 여인들 가운데서 가장 아름다운 이여, 네가 모르겠다면, 양 떼의 발자취를 따라 나가서 네 어린 염소들을 목자들의 천막 곁에서 먹이십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘양 떼의 발꿈치/발자취 안에서’라는 뜻입니다.
    reason: source_note
  - marker: b
    text: ‘어린 염소들’은 더 직역적인 ‘염소 새끼들’보다 현대 독자에게 더 분명한 표현입니다.
    reason: lexical_alternative
