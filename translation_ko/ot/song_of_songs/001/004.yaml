- from: 당신이여, 나를 당신 뒤로 이끄십시오. 우리가 달려가겠습니다. 왕이 나를 자기 방들로 데려오셨습니다. 우리는 당신 안에서 기뻐하며 즐거워하고, 포도주보다 당신의 사랑을 높이 기리겠습니다[a]. 정당하게도 그들이 당신을 사랑합니다[b].
  to: 나를 이끄십시오. 우리가 당신을 따라 달려가겠습니다. 왕께서 나를 그의 내실들로 데려오셨습니다. 우리는 당신으로 인해 기뻐하고 즐거워하며, 포도주보다 당신의 사랑을 더 높이 기리겠습니다[a]. 그들이 당신을 사랑하는 것은 마땅합니다[b].
