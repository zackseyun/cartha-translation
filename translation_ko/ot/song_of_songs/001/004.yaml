reference: Song of Songs 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָשְׁכֵ֖/נִי אַחֲרֶ֣י/ךָ נָּר֑וּצָה הֱבִיאַ֨/נִי הַ/מֶּ֜לֶךְ חֲדָרָ֗י/ו נָגִ֤ילָה וְ/נִשְׂמְחָה֙ בָּ֔/ךְ נַזְכִּ֤ירָה דֹדֶ֨י/ךָ֙ מִ/יַּ֔יִן מֵישָׁרִ֖ים אֲהֵבֽוּ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/004.yaml
  text: Draw me after you[a]; let us run. The king has brought me into his chambers. We will rejoice and be glad in you; we will extol your love more than wine[b]. Rightly do they love you.
  footnotes:
  - marker: a
    text: Or 'we will remember,' 'we will recount,' or 'we will celebrate' your love more than wine.
    reason: lexical_alternative
  - marker: b
    text: Or 'The upright love you.' The Hebrew מֵישָׁרִים may be understood adverbially ('rightly') or as a substantive ('upright ones').
    reason: alternative_reading
translation:
  language: ko
  text: 당신이여, 나를 당신 뒤로 이끄십시오. 우리가 달려가겠습니다. 왕이 나를 자기 방들로 데려오셨습니다. 우리는 당신 안에서 기뻐하며 즐거워하고, 포도주보다 당신의 사랑을 높이 기리겠습니다[a]. 정당하게도 그들이 당신을 사랑합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 사랑을 더듬어 기억하겠습니다', '당신의 사랑을 이야기하겠습니다', '당신의 사랑을 기념하겠습니다'.
    reason: lexical_alternative
  - marker: b
    text: 또는 '의인들이 당신을 사랑합니다.' 히브리어 מֵישָׁרִים은 부사적으로 '정당하게'로도, 명사적으로 '의로운 이들'로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מָשְׁכֵנִי
  english_pob_choice: Draw me
  chosen_korean: 나를 이끄십시오
  alternatives_korean:
  - 나를 끌어당기십시오
  - 나를 당기십시오
  lexicon: HALOT
  rationale: 히브리어 משׁך의 기본 의미는 '끌다/당기다'이지만, 한국어에서는 사랑의 초대를 담은 간청으로 자연스럽게 '이끄십시오'가 가장 매끄럽습니다.
- source_word: אַחֲרֶיךָ נָּרוּצָה
  english_pob_choice: after you; let us run
  chosen_korean: 당신 뒤로… 우리가 달려가겠습니다
  alternatives_korean:
  - 당신을 따라 우리가 달려가겠습니다
  - 당신 뒤를 따라 달려가겠습니다
  lexicon: HALOT
  rationale: 전치사 אַחֲרֶיךָ의 방향성과 1인칭 복수 cohortative를 살려, '우리'를 유지한 채 함께 달려감을 드러냈습니다.
- source_word: נַזְכִּירָה דֹדֶיךָ
  english_pob_choice: we will extol your love
  chosen_korean: 당신의 사랑을 높이 기리겠습니다
  alternatives_korean:
  - 당신의 사랑을 기억하겠습니다
  - 당신의 사랑을 언급하겠습니다
  - 당신의 사랑을 찬양하겠습니다
  lexicon: HALOT
  rationale: זכר는 문자적으로 '기억하다/언급하다'이지만, 문맥상 사랑을 공개적으로 기념하고 찬양하는 뜻이므로 '높이 기리다'로 옮겼습니다.
- source_word: מֵישָׁרִים
  english_pob_choice: Rightly
  chosen_korean: 정당하게도
  alternatives_korean:
  - 바르게도
  - 의로운 이들이
  lexicon: HALOT
  rationale: 부사적 용법을 따라 'upright ones'가 아니라 'rightly'의 의미를 살렸고, '정당하게도'로 문맥의 자연스러운 강조를 구현했습니다.
- source_word: אֲהֵבוּךָ
  english_pob_choice: do they love you
  chosen_korean: 그들이 당신을 사랑합니다
  alternatives_korean:
  - 그들이 당신을 사랑하십니다
  - 그들이 당신을 사랑하였나이다
  lexicon: HALOT
  rationale: 히브리어 완료형은 시적 문맥에서 현재적 진술로도 쓰일 수 있으므로, 한국어에서는 일반 현재형으로 옮겨 자연스러움을 확보했습니다.
theological_decisions:
- issue: 아가 1:4의 '왕'의 정체
  chosen_reading: 본문의 시적 인물로서 '왕'을 그대로 두고, 본문 자체가 요구하지 않는 알레고리나 메시아적 식별은 본문에 넣지 않았습니다.
  alternative_readings:
  - 하나님에 대한 알레고리
  - 메시아/그리스도에 대한 알레고리
  rationale: 이 절은 문맥상 사랑시의 이미지로 읽히며, 원문은 왕의 정체를 명시하지 않습니다. 번역은 본문이 말하는 범위 안에 머물러야 합니다.
  doctrine_reference: Translation philosophy §1 and §3
- issue: 화자 1인칭 복수의 효과
  chosen_reading: '''우리가 달려가겠습니다'', ''우리는…기뻐하며 즐거워하고''처럼 복수를 유지했습니다.'
  alternative_readings:
  - 나가 달려가겠습니다
  - 내가 기뻐하며 즐거워하겠습니다
  rationale: 히브리어의 복수형은 화자 공동체의 합류와 정서를 드러내므로, 이를 단수로 평준화하면 원문의 시적 긴장이 약해집니다.
  doctrine_reference: Source-meaning fidelity
