reference: Song of Songs 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶשְׁכֹּ֨ל הַ/כֹּ֤פֶר דּוֹדִ/י֙ לִ֔/י בְּ/כַרְמֵ֖י עֵ֥ין גֶּֽדִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/014.yaml
  text: My beloved is to me a cluster of henna blossoms in the vineyards of En-gedi[a].
  footnotes:
  - marker: a
    text: Or 'camphire'; the Hebrew term כֹּפֶר is traditionally rendered this way in older English versions, but it most likely refers to the henna plant, prized for its fragrant blossoms.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 사랑하는 이는 내게 엔게디의 포도원들에 있는 헤나 꽃송이 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘캄피르’. 히브리어 כֹּפֶר은 옛 영어 번역에서 전통적으로 이렇게 옮겨졌지만, 문맥상 향기로운 꽃이 피는 헤나 식물을 가리키는 것으로 보는 것이 더 타당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁכֹּל
  english_pob_choice: a cluster
  chosen_korean: 꽃송이
  alternatives_korean:
  - 송이
  - 한 송이
  - 무리
  lexicon: HALOT
  rationale: 명사 אֶשְׁכֹּל은 기본적으로 ‘송이/다발’을 뜻하며, 여기서는 포도송이의 관용적 이미지를 넘어서 향기로운 식물의 묶음 이미지를 형성하므로 ‘꽃송이’가 시적 뉘앙스를 자연스럽게 살립니다.
- source_word: הַכֹּפֶר
  english_pob_choice: henna blossoms
  chosen_korean: 헤나
  alternatives_korean:
  - 헤나 꽃
  - 헤나꽃송이
  - 고전역의 캄피르
  lexicon: HALOT
  rationale: POB의 판단처럼 כֹּפֶר는 이 문맥에서 고대 영어식 ‘camphire’보다 헤나 식물로 이해하는 것이 더 타당하므로, 한국어에서도 식물명 ‘헤나’를 직역 중심으로 살렸습니다.
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 나의 사랑하는 사람은
  alternatives_korean:
  - 내 사랑은
  - 내 연인은
  - 내 사랑하는 이는
  lexicon: HALOT
  rationale: 시편적·지혜문학적 연애시의 높은 문체를 유지하면서도, ‘연인’보다 더 공손하고 문학적인 ‘사랑하는 사람’으로 옮겼습니다.
- source_word: בְּכַרְמֵי עֵין גֶּדִי
  english_pob_choice: in the vineyards of En-gedi
  chosen_korean: 엔게디의 포도원들 가운데
  alternatives_korean:
  - 엔게디의 포도원들 안에
  - 엔게디 포도원들 속에
  - 엔게디의 포도원에서
  lexicon: HALOT
  rationale: בְּ는 단순한 장소 부사격이므로 ‘가운데’로 옮겨, 포도원들 속에 놓인 생생한 공간 이미지를 살렸습니다. 고유명사는 통용 표기인 ‘엔게디’를 사용했습니다.
theological_decisions:
- issue: 노래의 은유적 연애 언어를 직설적 교리어로 바꾸지 않는 문제
  chosen_reading: 이 구절은 화자의 애정 고백을 시적 은유로 그대로 유지했습니다.
  alternative_readings:
  - 상징적·영적 사랑으로 재해석
  - 교회적·그리스도론적 의미를 본문에 직접 반영
  rationale: 본문 자체는 연애시의 비유를 말하며, 원문이 허용하는 범위를 넘어 교리적 상징을 덧씌우면 저자가 청중이 이해하도록 의도한 시적 긴장이 약해집니다.
  doctrine_reference: 성경 해석의 문맥 우선 원칙
- issue: כֹּפֶר의 식물명 확정
  chosen_reading: 전통적 ‘캄피르’보다 헤나로 이해했습니다.
  alternative_readings:
  - 캄피르
  - 사이프러스/측백류
  rationale: 영어 POB의 주석처럼 이 단어는 문맥상 향기로운 헤나 식물로 보는 것이 가장 가능성이 높아, 독자가 시적 이미지를 바로 읽도록 했습니다.
  doctrine_reference: 사전적·문맥적 의미 우선
