  text: 우리 집의 들보는 백향목이요, 우리 서까래는 잣나무입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태는 복수이지만, 뜻은 공동의 거처를 가리키는 단수적 집합 개념일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 단어의 정확한 뜻은 불확실하며, 판벽이나 갤러리를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 나무의 정확한 종류는 확실하지 않으며, 노간주나무나 전나무로도 옮길 수 있습니다.
