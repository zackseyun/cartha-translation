  text: מִ֣י זֹ֗את עֹלָה֙ מִן הַ/מִּדְבָּ֔ר מִתְרַפֶּ֖קֶת עַל דּוֹדָ֑/הּ תַּ֤חַת הַ/תַּפּ֨וּחַ֙ עֽוֹרַרְתִּ֔י/ךָ שָׁ֚מָּ/ה חִבְּלַ֣תְ/ךָ אִמֶּ֔/ךָ שָׁ֖מָּ/ה חִבְּלָ֥ה יְלָדַֽתְ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/005.yaml
  text: Who is this coming up from the wilderness[a], leaning on her beloved? Under the apple tree I awakened you; there your mother was in labor with you[c][b]; there she who bore you was in labor.
  footnotes:
  - marker: a
    text: Or possibly, 'Under the apricot tree'; the exact species denoted by the Hebrew word is uncertain, though 'apple tree' is the traditional rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'I aroused you'; the Hebrew may carry a nuance beyond simple waking in this love-poetry context.
    reason: alternative_reading
  - marker: c
    text: The speaker likely shifts in the middle of the verse from an observing voice to direct address, and the exact speaker is not explicit in Hebrew.
    reason: alternative_reading
translation:
  language: ko
  text: 광야에서 올라오며 자기 사랑하는 이에게 기대어 있는 이 여인은 누구입니까? 사과나무[a] 아래에서 내가 당신을 깨웠습니다[b]. 그곳에서 당신의 어머니가 당신을 낳느라 진통을 겪었고[c], 그곳에서 당신을 낳은 이가 진통을 겪었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살구나무’일 수 있습니다. 히브리어가 가리키는 정확한 수종은 확실하지 않지만, 전통적으로는 ‘사과나무’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 당신을 일깨웠습니다’로 옮길 수 있습니다. 사랑시 문맥에서는 단순히 잠에서 깨운다는 뜻보다 더 넓은 뉘앙스를 가질 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 이 절 후반은 관찰의 말에서 2인칭 직접 호칭으로 전환되는 것으로 보입니다. 히브리어만으로는 정확한 발화 주체가 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה מִן הַמִּדְבָּר
  english_pob_choice: coming up from the wilderness
  chosen_korean: 광야에서 올라오며
  alternatives_korean:
  - 광야에서 올라오고
  - 광야에서 나아오며
  lexicon: HALOT
  rationale: עלה의 이동 이미지를 살리되, 시적 문맥에 자연스러운 ‘올라오다’를 택해 English POB의 ‘coming up’과 대응시켰습니다.
- source_word: מִתְרַפֶּקֶת עַל דּוֹדָהּ
  english_pob_choice: leaning on her beloved
  chosen_korean: 그의 사랑하는 이를 의지하고 있습니까
  alternatives_korean:
  - 그의 사랑하는 이에게 기대고 있습니까
  - 그의 사랑하는 이를 붙들고 있습니까
  lexicon: HALOT
  rationale: 희귀한 재귀형이 나타내는 밀착된 신체적 지지를 ‘의지하다’로 옮겨, 연인의 관계성과 장면의 부드러운 접촉을 함께 살렸습니다.
- source_word: תַּפּוּחַ
  english_pob_choice: apple tree
  chosen_korean: 사과나무
  alternatives_korean:
  - 살구나무
  lexicon: HALOT
  rationale: 정확한 식별은 불확실하지만, 전통적 번역인 ‘사과나무’를 본문에 유지해 시적 관용과 수용사적 일관성을 지켰습니다.
- source_word: עוֹרַרְתִּיךָ
  english_pob_choice: I awakened you
  chosen_korean: 내가 당신을 깨웠습니다
  alternatives_korean:
  - 내가 당신을 일깨웠습니다
  - 내가 당신을 불러 깨웠습니다
  lexicon: HALOT
  rationale: 직역적 핵심은 ‘깨우다’이므로 이를 채택하되, 사랑시 문맥에서 가능한 이중적 뉘앙스를 과도하게 확정하지 않았습니다.
- source_word: חִבְּלַתְךָ / חִבְּלָה
  english_pob_choice: was in labor with you / was in labor
  chosen_korean: 당신과 함께 진통하였고 / 당신을 낳은 이가 진통하였습니다
  alternatives_korean:
  - 당신을 해산하였고 / 당신을 낳은 이가 해산하였습니다
  - 당신과 함께 해산의 고통을 겪었고 / 당신을 낳은 이가 해산의 고통을 겪었습니다
  lexicon: HALOT
  rationale: חבל의 산욕적 의미를 본문에 드러내기 위해 ‘진통하다’를 택해, 단순한 출산 서술보다 고통과 긴장을 살렸습니다.
theological_decisions:
- issue: 중간의 화자 전환과 2인칭 직접호칭
  chosen_reading: 첫 절반은 관찰자의 수사적 질문으로, 뒤는 ‘내가 당신을…’이라는 직접호칭으로 유지했습니다.
  alternative_readings:
  - 전체를 한 화자가 일관되게 말하는 것으로 평탄화함
  - 2인칭을 3인칭으로 바꾸어 화자 전환을 없앰
  rationale: 히브리어의 3인칭 묘사에서 2인칭 직접호칭으로의 전환을 평준화하지 않고 드러내어, 시의 긴장과 발화를 보존했습니다.
  doctrine_reference: Translation philosophy §3, preserve tension rather than resolve it.
