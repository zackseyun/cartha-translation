  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂימֵ֨/נִי כַֽ/חוֹתָ֜ם עַל לִבֶּ֗/ךָ כַּֽ/חוֹתָם֙ עַל זְרוֹעֶ֔/ךָ כִּֽי עַזָּ֤ה כַ/מָּ֨וֶת֙ אַהֲבָ֔ה קָשָׁ֥ה כִ/שְׁא֖וֹל קִנְאָ֑ה רְשָׁפֶ֕י/הָ רִשְׁפֵּ֕י אֵ֖שׁ שַׁלְהֶ֥בֶתְ יָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/006.yaml
  text: Set me as a seal upon your heart[a], as a seal upon your arm; for love is as strong as death, jealousy as relentless as Sheol. Its flashes are flashes of fire[c][b], a flame of Yah.
  footnotes:
  - marker: a
    text: Or 'jealousy as cruel as the grave'; Hebrew 'Sheol' may also be understood more generally as the realm of the dead.
    reason: alternative_reading
  - marker: b
    text: Or 'its sparks are sparks of fire.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'a flame of Yah'; possibly an intensive expression, 'a mighty flame' or 'a blazing flame.'
    reason: alternative_reading
translation:
  language: ko
  text: 나를 당신의 마음 위에 도장처럼, 당신의 팔 위에 도장처럼 두십시오. 사랑은 죽음처럼 강하고, 질투는 스올처럼 끈질깁니다. 그 불꽃은 불의 불꽃이며, 야의 불꽃입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘질투는 무덤처럼 잔혹하다’; 히브리어 ‘스올’은 더 일반적으로 죽은 자의 영역으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 불씨들은 불의 불씨들이다’.
    reason: lexical_alternative
  - marker: c
    text: '히브리어는 ‘야의 불꽃’이며, 강한 강조 표현으로도 이해될 수 있습니다: ‘강한 불꽃’ 또는 ‘타오르는 불꽃’.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂימֵנִי
  english_pob_choice: Set me
  chosen_korean: 나를 … 두십시오
  alternatives_korean:
  - 나를 놓으십시오
  - 나를 두어 주십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형에 1인칭 목적격이 붙은 직접 요청이므로, 한국어에서는 간결한 청유적 명령으로 옮겨 친밀한 호소를 살렸습니다.
- source_word: כַחוֹתָם / עַל לִבֶּךָ / עַל זְרוֹעֶךָ
  english_pob_choice: as a seal upon your heart / upon your arm
  chosen_korean: 당신의 마음 위에 도장처럼, 당신의 팔 위에 도장처럼
  alternatives_korean:
  - 당신의 심장에 봉인처럼, 당신의 팔에 인장처럼
  - 당신의 가슴에 도장처럼, 당신의 팔에 도장처럼
  lexicon: HALOT
  rationale: חוֹתָם은 소유·인증·표지를 뜻하는 ‘seal/signet’ 계열이어서, 문맥이 잘 드러나는 ‘도장’으로 옮기되 반복 구조를 보존했습니다. ‘마음/팔’의 병렬도 그대로 유지했습니다.
- source_word: קִנְאָה / קָשָׁה כִשְׁאוֹל
  english_pob_choice: jealousy as relentless as Sheol
  chosen_korean: 질투는 스올처럼 끈질깁니다
  alternatives_korean:
  - 질투는 스올처럼 잔혹합니다
  - 열정은 스올처럼 끈질깁니다
  - 시기는 스올처럼 끈질깁니다
  lexicon: HALOT
  rationale: קִנְאָה의 기본 어휘값을 ‘질투’로 유지해 사랑의 배타성과 긴장을 드러냈고, קָשָׁה는 ‘잔혹’보다 스올의 피할 수 없는 성격을 살리는 ‘끈질김’으로 처리했습니다.
- source_word: שַׁלְהֶבֶתְ יָה
  english_pob_choice: a flame of Yah
  chosen_korean: 야의 불꽃
  alternatives_korean:
  - 야훼의 불꽃
  - 야의 한 불꽃
  - 야훼의 불길
  lexicon: HALOT
  rationale: 히브리어에 드러난 신명 요소 יָה를 지우지 않기 위해 ‘야’를 유지했습니다. 후속 구절의 강렬한 시어를 살리면서도, 본문의 신학적·시적 특이성을 보존합니다.
theological_decisions:
- issue: שַׁלְהֶבֶתְ יָה의 신명 요소를 한국어 본문에 어떻게 보존할지
  chosen_reading: ‘야의 불꽃’으로 직접 반영합니다.
  alternative_readings:
  - ‘야훼의 불꽃’
  - ‘강한 불꽃’
  - ‘타오르는 불꽃’
  rationale: 본문 자체가 יָה를 포함하므로, 이를 일반적 과장어로 흡수하지 않고 그대로 드러내는 편이 원문 우선성과 투명성에 부합합니다. 동시에 한국어 시어로도 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: קִנְאָה를 사랑의 맥락에서 ‘열정/애정’으로 완화할지
  chosen_reading: ‘질투’로 유지합니다.
  alternative_readings:
  - 열정
  - 애정
  - 시기
  rationale: 문맥이 긍정적 사랑시라 해도 히브리어의 핵심 어휘는 배타적 관계를 전제하는 질투/열심의 긴장을 품습니다. 이를 순화하면 본문의 강도를 약화시킬 수 있습니다.
  doctrine_reference: Translation philosophy §3, §5
