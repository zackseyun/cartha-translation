  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָח֥וֹת לָ֨/נוּ֙ קְטַנָּ֔ה וְ/שָׁדַ֖יִם אֵ֣ין לָ֑/הּ מַֽה נַּעֲשֶׂה֙ לַ/אֲחֹתֵ֔/נוּ בַּ/יּ֖וֹם שֶׁ/יְּדֻבַּר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/008.yaml
  text: We have a little sister[a], and she has no breasts. What shall we do for our sister on the day when she is spoken for?
  footnotes:
  - marker: a
    text: Or, 'on the day when she is spoken about.' The Hebrew may refer generally to discussion concerning her, though in context it likely points to marriage negotiations.
    reason: alternative_reading
translation:
  language: ko
  text: 우리에게는 어린 누이가 있는데, 그에게는 젖가슴이 없습니다. 누이가 말해질 그날에 우리가 우리 누이를 위해 무엇을 하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누이에 대해 말해질 때’. 히브리어는 일반적인 언급을 가리킬 수 있지만, 문맥상 혼인 교섭을 가리킬 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָח֥וֹת לָ֨נוּ֙
  english_pob_choice: We have a little sister
  chosen_korean: 우리에게는 어린 누이가 있는데
  alternatives_korean:
  - 우리에게는 작은 누이가 있는데
  - 우리 누이가 있는데
  lexicon: HALOT
  rationale: לָנוּ의 소속 관계를 한국어 자연문맥에 맞게 ‘우리에게는’으로 살리고, קְטַנָּה는 연령·지위의 작음을 함께 담는 ‘어린’으로 옮겼습니다.
- source_word: וְשָׁדַ֖יִם אֵ֣ין לָ֑הּ
  english_pob_choice: and she has no breasts
  chosen_korean: 그에게는 젖가슴이 없습니다
  alternatives_korean:
  - 그에게는 가슴이 없습니다
  - 그에게는 유방이 없습니다
  lexicon: HALOT
  rationale: 히브리어의 직접적이고 구체적인 표현을 따라 완곡하게 풀지 않고, 신체적 미성숙을 드러내는 본뜻을 보존했습니다. 한국어에서는 ‘젖가슴’이 본문이 말하는 육체적 상태를 비교적 직접적으로 드러냅니다.
- source_word: שֶׁיְּדֻבַּר בָּהּ
  english_pob_choice: when she is spoken for
  chosen_korean: 누이가 말해질
  alternatives_korean:
  - 누이에 대해 말해질
  - 누이가 구혼의 대상으로 거론될
  lexicon: HALOT
  rationale: פּועַל 수동형 ‘말해지다/언급되다’의 기본 뜻을 살리되, 결혼 교섭까지 포함할 수 있는 문맥을 열어 두었습니다. 영어 POB의 ‘spoken for’에 대응하는 관용적 해석을 한국어로 과도하게 특정하지 않았습니다.
- source_word: מַה נַּעֲשֶׂה לַאֲחֹתֵנוּ
  english_pob_choice: What shall we do for our sister
  chosen_korean: 우리가 우리 누이를 위해 무엇을 하겠습니까?
  alternatives_korean:
  - 우리가 우리 누이를 위해 무엇을 해야 합니까?
  - 우리가 우리 누이를 위해 무엇을 할 수 있겠습니까?
  lexicon: HALOT
  rationale: 첫째 인칭 복수의 숙고 질문을 자연스러운 합쇼체 의문문으로 옮겼고, לַאֲחֹתֵנוּ의 ‘위하여/위해’ 의미를 살렸습니다.
theological_decisions:
- issue: 'שֶׁיְּדֻבַּר בָּהּ의 범위: 단순한 화제 거론인지, 혼인 교섭인지'
  chosen_reading: 본문에는 ‘말해질’로 두어 일반적 언급의 가능성을 열어 두되, 문맥상 혼인 교섭까지 포함될 수 있는 여지를 유지했습니다.
  alternative_readings:
  - ‘구혼될’로 더 좁게 해석
  - ‘그에 대해 말해질 때’로 일반적 언급만 반영
  rationale: 히브리어 동사는 넓게는 ‘말해지다/언급되다’를 뜻하지만, 이 장면의 맥락은 결혼 관련 논의로도 읽힙니다. 원문의 긴장을 지우지 않기 위해 단정적으로 좁히지 않았습니다.
  doctrine_reference: 해석학적 보류
