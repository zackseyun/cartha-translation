    rationale: 의미상 가능하지만, 농업 문맥의 נֹטְרִים에는 지킴과 돌봄/관리의 의미가 함께 있을 수 있습니다. ‘포도원지기들’은 이를 자연스럽게 포괄합니다.
  revised_text: 솔로몬에게는 바알-하몬에 포도원이 있었습니다. 그는 그 포도원을 포도원지기들에게 맡겼습니다. 각 사람은 그 열매에 대한 대가로 은 천 조각[a]을 가져와야 했습니다.
