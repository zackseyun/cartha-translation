  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֶּ֣רֶם הָיָ֤ה לִ/שְׁלֹמֹה֙ בְּ/בַ֣עַל הָמ֔וֹן נָתַ֥ן אֶת הַ/כֶּ֖רֶם לַ/נֹּטְרִ֑ים אִ֛ישׁ יָבִ֥א בְּ/פִרְי֖/וֹ אֶ֥לֶף כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/011.yaml
  text: Solomon had a vineyard at Baal-hamon[a]; he gave the vineyard to keepers[c][b]. Each man was to bring a thousand pieces of silver for its fruit.
  footnotes:
  - marker: a
    text: Or 'he gave the vineyard to the keepers'; the Hebrew verb is broadly 'gave,' but here likely implies entrusting or assigning it for management.
    reason: lexical_alternative
  - marker: b
    text: Or 'from its fruit' or 'with his fruit.' The Hebrew suffix in 'its/his fruit' may be understood with reference to the vineyard or distributively to each keeper's produce.
    reason: lexical_alternative
  - marker: c
    text: Literally 'a thousand silver'; the specific unit of silver is not stated in the Hebrew.
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬에게는 바알-하몬에 포도원이 있었습니다. 그는 그 포도원을 지키는 사람들에게 맡겼습니다. 각 사람은 그 열매에 대한 대가로 은 천 개를 가져와야 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּרֶם
  english_pob_choice: vineyard
  chosen_korean: 포도원
  alternatives_korean:
  - 포도밭
  - 포도나무
  lexicon: HALOT
  rationale: 재배된 포도밭이라는 뜻이 분명하므로 ‘포도원’이 가장 자연스럽고, 첫 번째와 두 번째 출현을 일관되게 살립니다.
- source_word: הָיָה לִשְׁלֹמֹה
  english_pob_choice: Solomon had
  chosen_korean: 솔로몬에게는 … 있었습니다
  alternatives_korean:
  - 솔로몬의 것이었습니다
  - 솔로몬에게 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 소유 관용구를 한국어의 자연스러운 소유·존재 표현으로 옮겨, 단순한 직역보다 의미를 분명히 했습니다.
- source_word: נָתַן אֶת הַכֶּרֶם לַנֹּטְרִים
  english_pob_choice: he entrusted the vineyard to keepers
  chosen_korean: 그 포도원을 지키는 사람들에게 맡겼습니다
  alternatives_korean:
  - 그 포도원을 지키는 사람들에게 주었습니다
  - 그 포도원을 관리인들에게 맡겼습니다
  lexicon: HALOT
  rationale: נתן의 넓은 뜻을 이 문맥의 관리·위탁 관계로 반영하여, 단순한 ‘주다’보다 ‘맡기다’가 소스 의미를 더 잘 드러냅니다.
- source_word: אֶלֶף כָּסֶף
  english_pob_choice: a thousand pieces of silver
  chosen_korean: 은 천 개
  alternatives_korean:
  - 은 천 세겔
  - 은 천 조각
  lexicon: HALOT
  rationale: 히브리어에는 구체 단위가 없으므로, POB의 주석 취지를 따라 ‘pieces of silver’에 해당하는 비단위적 표현으로 옮겼습니다.
