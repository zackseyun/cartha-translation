    text: Or, more formally, 'cause me to hear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 동산들에 거주하는 이여, 동무들이 당신의 목소리를 귀 기울여 듣고 있습니다. 당신의 목소리를 들려주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀 기울여 듣고 있습니다’는 히브리어의 능동적 경청을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֶׁבֶת
  english_pob_choice: You who dwell
  chosen_korean: 거주하는 이여
  alternatives_korean:
  - 앉아 있는 이여
  - 사는 이여
  lexicon: HALOT
  rationale: 여성 단수 분사에 호격적 기능이 있으므로 ‘이여’로 부르며, 시적 맥락에 맞게 ‘거주하는’으로 옮겨 지속적인 머묾의 의미를 살렸습니다.
- source_word: בַּגַּנִּים
  english_pob_choice: in the gardens
  chosen_korean: 동산들에
  alternatives_korean:
  - 동산들 가운데
  - 동산에
  lexicon: HALOT
  rationale: 복수형을 살려 단수 ‘동산’으로 평평하게 만들지 않고, 장소성을 자연스럽게 드러내는 ‘동산들에’를 택했습니다.
- source_word: חֲבֵרִים
  english_pob_choice: companions
  chosen_korean: 동무들이
  alternatives_korean:
  - 친구들이
  - 동료들이
  lexicon: HALOT
  rationale: 관계의 친밀함과 시적 어감을 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘동무들’로 옮겼습니다.
- source_word: מַקְשִׁיבִים לְקוֹלֵךְ
  english_pob_choice: are listening for your voice
  chosen_korean: 당신의 목소리를 귀 기울여 듣고 있습니다
  alternatives_korean:
  - 당신의 목소리에 귀를 기울이고 있습니다
  - 당신의 목소리를 듣고 있습니다
  lexicon: HALOT
  rationale: קשׁב의 적극적·기대적 경청을 살려 단순한 청취보다 ‘귀 기울여 듣고 있습니다’로 옮겼습니다.
- source_word: הַשְׁמִיעִינִי
  english_pob_choice: let me hear it
  chosen_korean: 당신의 목소리를 들려주십시오
  alternatives_korean:
  - 저에게 들리게 해주십시오
  - 저로 하여금 듣게 해주십시오
  lexicon: HALOT
  rationale: 직역하면 ‘듣게 하십시오’이지만 한국어에서는 청유/요청으로 자연스럽게 드러내는 ‘들려주십시오’가 원문의 요구를 가장 잘 전달합니다.
theological_decisions:
- issue: 호격과 화자의 요청 어조
  chosen_reading: 연인의 부름과 간청이므로 직접 호칭과 공손한 요청문으로 처리했습니다.
  alternative_readings:
  - 보다 중립적인 서술형
  - 더 직역적인 명령형
  rationale: 아가서의 시적·대화체 성격을 유지하면서도 현대 한국어 합쇼체에 맞게 요청의 정서를 보존하기 위한 선택입니다.
  doctrine_reference: 문학적 정경 해석 / 화용론
