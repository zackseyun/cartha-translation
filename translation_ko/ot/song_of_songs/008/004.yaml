  rationale: 히필형의 강한 서약/엄숙한 요청을 살리되, 한국어 합쇼체에서 자연스럽고 격식 있는 표현으로 옮겼습니다.
- source_word: בְּנוֹת יְרוּשָׁלִָ֑ם
  english_pob_choice: daughters of Jerusalem
  chosen_korean: 예루살렘의 딸들아
