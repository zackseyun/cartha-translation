- source_word: מַה תָּעִ֧ירוּ וּֽ/מַה תְּעֹֽרְר֛וּ
  english_pob_choice: why should you awaken or stir up
  chosen_korean: 왜 사랑을 깨우거나 흔들어 일으키겠습니까
