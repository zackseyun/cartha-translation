  rationale: 히브리어의 מַה 질문형을 금지명령으로 평탄화하지 않고, 수사적 질문의 힘을 살렸습니다.
- source_word: עַ֥ד שֶׁ/תֶּחְפָּֽץ
  english_pob_choice: until it desires
