  verdict: revise
  source_fidelity: 히브리어의 1인칭 단수 히필(‘내가 너희에게 맹세시키다/엄히 서약시키다’), 예루살렘의 딸들이라는 호격, מַה가 이끄는 수사적 질문, 그리고 여성 단수 동사로 의인화된 ‘사랑’을 전반적으로 잘 보존했습니다. 다만 ‘내가 너희에게 맹세하게 합니다’는 한국어에서 다소 부자연스럽고, 원문의 엄숙한 서약 부과의 힘이 흐려질 수 있습니다. 또한 ‘흔들어 일으키다’는 원문의 반복적 ‘깨우다/일깨우다’보다 물리적으로 흔드는 뜻을 덧붙입니다.
  naturalness: ‘내가 너희에게 엄숙히 맹세시킵니다’는 합쇼체의 격식과 시적 엄숙함을 유지하면서 더 자연스럽고 명료합니다. ‘깨우거나 일깨우겠습니까’는 두 히브리어 동사의 병렬과 중첩을 한국어에서 자연스럽게 드러냅니다.
  terminology: ‘예루살렘의 딸들’, ‘사랑’, ‘원할 때까지’는 적절합니다. ‘원하다’는 חפץ의 능동적·의인화된 뉘앙스를 보존하므로 유지할 수 있습니다.
