  - 사랑이 기뻐할 때까지는
  - 사랑이 바라할 때까지는
  lexicon: HALOT
  rationale: 3인칭 여성 단수 동사와 사랑(אַהֲבָה)의 여성형 일치를 반영해, 사랑을 의인화한 표현을 유지했습니다.
theological_decisions:
- issue: 수사적 질문을 금지명령으로 바꾸지 않음
  chosen_reading: '''왜 … 하겠습니까''로 옮겨, 본문의 질문형 호소를 유지했습니다.'
  alternative_readings:
  - '''…하지 마십시오'''
  - '''…하지 않기를'''
  rationale: 영어 POB의 최종 수정은 있었지만, 히브리어 원문은 직접적인 금지형보다 질문형 표현에 더 가깝기 때문에 그 긴장을 그대로 반영했습니다.
  doctrine_reference: 본문의 문법과 수사법 보존
