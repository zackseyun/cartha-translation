source:
  edition: WLC
  text: מִ֤י יִתֶּנְ/ךָ֙ כְּ/אָ֣ח לִ֔/י יוֹנֵ֖ק שְׁדֵ֣י אִמִּ֑/י אֶֽמְצָאֲ/ךָ֤ בַ/חוּץ֙ אֶשָׁ֣קְ/ךָ֔ גַּ֖ם לֹא יָב֥וּזוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/001.yaml
  text: Oh[a], that you were like a brother to me, who nursed at my mother’s breasts! If I found you outside, I would kiss you[c][b], and no one would despise me.
  footnotes:
  - marker: a
    text: Or, 'If only you were like a brother to me.' The opening Hebrew idiom expresses a wish.
    reason: lexical_alternative
  - marker: b
    text: That is, a brother who had shared the same mother’s nursing, making public affection socially acceptable.
    reason: cultural_note
  - marker: c
    text: Hebrew literally, 'they would not despise me,' using an indefinite plural for general public disapproval.
    reason: lexical_alternative
translation:
  language: ko
  text: 아[a], 네가 내 어머니의 젖을 먹은 내 형제와 같았으면 좋겠습니다[b]! 내가 밖에서 너를 만나면, 너에게 입맞추어도 아무도 나를 업신여기지 않을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘누가 너를 주겠느냐’이지만, 실제로는 바람을 나타내는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 내 어머니의 젖을 먹은 형제라면 공개적인 애정 표현이 사회적으로 허용될 수 있다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 ‘그들이 나를 업신여기지 않을 것이다’라는 무정칭 복수 표현을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֶּנְךָ
  english_pob_choice: Oh, that you were
  chosen_korean: 아, 네가 … 같았으면 좋겠습니다
  alternatives_korean:
  - 네가 …이기를 바랍니다
  - 만약 네가 …라면 좋겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 실제로 ‘누가 주겠느냐’라는 질문이 아니라 바람을 나타내므로, 한국어에서도 소망을 드러내는 표현으로 옮겼습니다.
- source_word: כְּאָח לִי
  english_pob_choice: like a brother to me
  chosen_korean: 내 형제 같았으면
  alternatives_korean:
  - 내 형제처럼
  - 나의 형제와 같았으면
  lexicon: HALOT
  rationale: 비교 표지 כְּ의 뉘앙스를 살려, 단순한 동일시가 아니라 ‘~처럼’의 비교를 유지했습니다.
- source_word: יוֹנֵק שְׁדֵי אִמִּי
  english_pob_choice: who nursed at my mother’s breasts
  chosen_korean: 내 어머니의 젖을 먹은 형제처럼
  alternatives_korean:
  - 내 어머니의 젖을 먹던 형제처럼
  - 내 어머니의 젖가슴을 빨던 형제처럼
  lexicon: HALOT
  rationale: ‘젖을 먹다’는 한국어에서 자연스럽고 직접적인 수유 이미지를 전달하며, 사회적으로 공인된 친형제 관계의 근거가 되는 모성적 수유 이미지를 보존합니다.
- source_word: גַּם לֹא יָבֻזוּ לִי
  english_pob_choice: and no one would despise me
  chosen_korean: 아무도 나를 업신여기지 않을 것입니다
  alternatives_korean:
  - 아무도 나를 멸시하지 않을 것입니다
  - 사람들이 나를 업신여기지 않을 것입니다
  lexicon: HALOT
  rationale: 무정칭 복수의 일반적 대중 비난을 한국어의 ‘아무도’로 자연스럽게 풀어, 공개적 애정이 사회적으로 용인된다는 뜻을 드러냈습니다.
theological_decisions:
- issue: 형제 비교의 사회적·수사적 기능
  chosen_reading: 형제 이미지를 실제 혈연 주장으로 바꾸지 않고, 공개적 애정이 수치가 되지 않는 사회적 동일시로 유지했습니다.
  alternative_readings:
  - 형제 이미지를 완화하여 단순한 친밀감으로 번역
  - 실제 친족 관계로 오해될 수 있게 번역
  rationale: 본문은 연인 사이의 공적 애정이 금기시되지 않는 조건을 상상하는 시구이므로, 수사적 비교를 그대로 보존하는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; do not paraphrase beyond what the source text warrants.'
