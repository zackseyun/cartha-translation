    text: Hebrew literally, 'his left ... and his right'; 'hand' is supplied in English from the sense of the paired expressions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 왼손은 내 머리 아래에 있고, 그의 오른손은 나를 안고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 왼쪽 … 그리고 그의 오른쪽’이며, 영어 POB처럼 ‘손’을 의미상 보충한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  english_pob_choice: his left hand
  chosen_korean: 그의 왼손
  alternatives_korean:
  - 그의 왼쪽
  - 그의 왼팔
  lexicon: HALOT
  rationale: 히브리어는 ‘왼쪽/왼손’을 뜻하지만, 포옹 장면에서는 한국어에서도 손을 드러내는 편이 자연스럽고 영어 POB의 보충을 잘 반영합니다.
- source_word: תַּחַת
  english_pob_choice: under
  chosen_korean: 아래에
  alternatives_korean:
  - 밑에
  - 아래로
  lexicon: HALOT
  rationale: ‘아래에’는 전치사의 기본 의미를 가장 자연스럽게 살리면서 한국어 구문도 무리 없이 만듭니다.
- source_word: רֹאשִׁי
  english_pob_choice: my head
  chosen_korean: 내 머리
  alternatives_korean:
  - 내 머리 위
  - 내 머리밑
  lexicon: HALOT
  rationale: 직역에 충실하게 ‘내 머리’로 옮기되, 앞의 ‘아래에’와 결합해 위치 관계를 분명히 했습니다.
- source_word: תְּחַבְּקֵנִי
  english_pob_choice: embraces me
  chosen_korean: 나를 안고 있습니다
  alternatives_korean:
  - 나를 껴안고 있습니다
  - 나를 감싸 안고 있습니다
  lexicon: HALOT
  rationale: חבק의 핵심 의미인 ‘안다/포옹하다’를 살리면서, 히브리어 미완료의 현재적 장면감을 한국어 현재 진행으로 옮겼습니다.
theological_decisions:
- issue: 시적 현재와 관계의 친밀함
  chosen_reading: 현재형 서술로 장면을 눈앞에 그리게 했습니다.
  alternative_readings:
  - 단순 과거형으로 옮기기
  - 완료형으로 옮기기
  rationale: 이 구절은 사랑의 장면을 묘사하는 시적 문맥이므로, 한국어에서도 현재 진행형이 가장 자연스럽고 원문의 생동감을 잘 전달합니다.
  doctrine_reference: 문학적-시적 문맥의 시제 처리
