  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
  footnotes:
  - marker: a
    text: Or 'A thousand pieces of silver are for you, Solomon.' The previous verse mentions 'a thousand pieces of silver,' but this verse itself says only 'the thousand.'
    reason: lexical_alternative
  - marker: b
    text: '''Is before me'' may also imply ''is in my keeping'' or ''under my control.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 포도원, 곧 내 것은 내 앞에 있습니다.[a] 솔로몬이여, 그 천은[b] 당신에게 돌아가고, 그 열매를 지키는 이들에게는 이백이 돌아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 앞에 있습니다’는 ‘내가 맡아 가지고 있습니다’ 또는 ‘내 통제 아래 있습니다’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 앞절에는 ‘천 은전’이 언급되지만, 이 절의 히브리어 본문은 단지 ‘그 천’이라고만 말하며 화폐 단위를 명시하지 않습니다.
    reason: lexical_alternative
