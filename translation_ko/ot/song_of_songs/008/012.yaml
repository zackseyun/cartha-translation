base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/012.yaml
  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
  footnotes:
  - marker: a
    text: Or 'A thousand pieces of silver are for you, Solomon.' The previous verse mentions 'a thousand pieces of silver,' but this verse itself says only 'the thousand.'
    reason: lexical_alternative
  - marker: b
    text: '''Is before me'' may also imply ''is in my keeping'' or ''under my control.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내 포도원은 내 것입니다. 솔로몬이여, 그 천은 당신의 몫이고, 그 과일을 지키는 이들에게는 이백입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬이여, 한 천은 당신의 몫이다’로도 옮길 수 있습니다. 히브리어에는 이 절 자체에 화폐 단위가 없고, 앞절의 ‘천 은전’이 배경이 됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 앞에 있습니다’는 ‘내가 그것을 맡아 가지고 있습니다’ 또는 ‘내 통제 아래 있습니다’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְמִי שֶׁלִּי
  english_pob_choice: My vineyard, my very own
  chosen_korean: 내 포도원은 내 것입니다
  alternatives_korean:
  - 내 포도원은 내 소유입니다
  - 내 포도원은 나의 것입니다
  lexicon: HALOT
  rationale: 포도원 이미지와 반복된 소유 강조를 살리되, 한국어에서는 「내 것입니다」가 「my very own」의 강한 소유를 가장 자연스럽게 드러냅니다.
- source_word: לְפָנַי
  english_pob_choice: is before me
  chosen_korean: 내 앞에 있습니다
  alternatives_korean:
  - 내 곁에 있습니다
  - 내 손에 있습니다
  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어에서 문맥상 가능한 소유·통제의 뉘앙스를 너무 단정하지 않도록 했습니다.
- source_word: הָאֶלֶף
  english_pob_choice: The thousand
  chosen_korean: 그 천
  alternatives_korean:
  - 천 개
  - 천 명분
  lexicon: HALOT
  rationale: 본문에는 화폐 단위가 없으므로 영어 POB처럼 숫자만 살려 「그 천」으로 옮겨, 앞절의 은전 언급을 본문에 덧붙이지 않았습니다.
- source_word: לְנֹטְרִים אֶת פִּרְיוֹ
  english_pob_choice: for those who keep its fruit
  chosen_korean: 그 과일을 지키는 이들에게는
  alternatives_korean:
  - 열매를 지키는 이들에게는
  - 그 수확을 지키는 이들에게는
  lexicon: HALOT
  rationale: נטר의 ‘지키다/돌보다’와 פְּרִי의 ‘열매’ 의미를 살리되, 한국어에서는 반복되는 소유 대상을 분명히 하기 위해 「그 과일」로 옮겼습니다.
theological_decisions:
- issue: 솔로몬에게 주는 배분과 화자-대상 관계
  chosen_reading: 직접 호칭 「솔로몬이여」를 유지하고, 몫의 분배를 평서형으로 전달했습니다.
  alternative_readings:
  - 솔로몬님
  - 솔로몬아
  rationale: 이 구절은 사랑 노래의 대화체이므로 직접 호칭을 살리되, 현대 합쇼체 흐름을 깨지 않는 범위에서 가장 덜 해석적인 형태를 택했습니다.
  doctrine_reference: 송가 문맥의 화자 화용론
