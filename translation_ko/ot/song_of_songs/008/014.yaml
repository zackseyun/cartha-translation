base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/014.yaml
  text: Flee[a], my beloved[c][b], and be like a gazelle or a young stag on the mountains of spices.
  footnotes:
  - marker: a
    text: Or, 'Flee, my beloved.' The Hebrew verb can be rendered more literally as 'flee' or 'run away,' but here likely conveys swift movement in romantic imagery rather than fearful escape.
    reason: lexical_alternative
  - marker: b
    text: Or, 'a young deer.' The Hebrew expression literally refers to a young one of the stags/deer.
    reason: lexical_alternative
  - marker: c
    text: Compare Song 2:17, which uses similar imagery of the beloved as a gazelle or young stag on rugged heights.
    reason: cross_reference
translation:
  language: ko
  text: 내 사랑하는 이여, 달아나십시오. 향료의 산들 위를 달리는 가젤이나 어린 수사슴처럼 되십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달아나십시오’는 히브리어 בְּרַח의 기본 의미를 따른 것입니다. 여기서는 두려워 도피한다기보다, 연애시의 이미지 안에서 재빠르게 움직인다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어린 수사슴’은 문자적으로 ‘수사슴들의 어린 것’에 가깝고, ‘어린 사슴’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 비슷한 이미지는 아가 2:17에도 나타납니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרַח
  english_pob_choice: Flee
  chosen_korean: 달아나십시오
  alternatives_korean:
