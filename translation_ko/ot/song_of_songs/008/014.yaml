source:
  edition: WLC
  text: בְּרַ֣ח דּוֹדִ֗/י וּֽ/דְמֵה לְ/ךָ֤ לִ/צְבִי֙ א֚וֹ לְ/עֹ֣פֶר הָֽ/אַיָּלִ֔ים עַ֖ל הָרֵ֥י בְשָׂמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/014.yaml
  text: Flee[a], my beloved[c][b], and be like a gazelle or a young stag on the mountains of spices.
  footnotes:
  - marker: a
    text: Or, 'Flee, my beloved.' The Hebrew verb can be rendered more literally as 'flee' or 'run away,' but here likely conveys swift movement in romantic imagery rather than fearful escape.
    reason: lexical_alternative
  - marker: b
    text: Or, 'a young deer.' The Hebrew expression literally refers to a young one of the stags/deer.
    reason: lexical_alternative
  - marker: c
    text: Compare Song 2:17, which uses similar imagery of the beloved as a gazelle or young stag on rugged heights.
    reason: cross_reference
translation:
  language: ko
  text: 내 사랑아, 달아나십시오. 너는 가젤이나 젊은 수사슴처럼 향료의 산들 위에 있으십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달아나십시오’는 히브리어 בְּרַח의 기본 의미를 따른 것으로, 여기서는 두려운 도피라기보다 민첩한 움직임을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젊은 수사슴’은 문자적으로는 ‘수사슴의 새끼/어린 개체’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 비슷한 이미지는 아가 2:17에도 나타납니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרַח
  english_pob_choice: Flee
  chosen_korean: 달아나십시오
  alternatives_korean:
  - 도망치십시오
  - 빨리 가십시오
  lexicon: HALOT
  rationale: 직역상 ‘flee’이지만, 아가서의 연애시에서는 공포의 도피보다 민첩한 움직임을 가리키므로 한국어에서는 다소 문학적이면서도 자연스러운 ‘달아나십시오’로 옮겼습니다.
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑아
  alternatives_korean:
  - 내 사랑하는 이여
  - 내 연인이여
  lexicon: HALOT
  rationale: דּוֹדִי는 남성 연인을 가리키는 애정 호칭이므로, 한국어에서는 친밀한 직접호칭인 ‘내 사랑아’가 가장 자연스럽고 서정적입니다.
- source_word: לִצְבִי / לְעֹפֶר הָאַיָּלִים
  english_pob_choice: a gazelle or a young stag
  chosen_korean: 가젤이나 젊은 수사슴
  alternatives_korean:
  - 영양이나 어린 수사슴
  - 사슴이나 어린 수사슴
  lexicon: HALOT
  rationale: צְבִי는 가젤로, עֹפֶר הָאַיָּלִים은 ‘수사슴의 새끼/젊은 개체’라는 점을 살려 한국어에서 남성적 대구를 보존하는 ‘젊은 수사슴’으로 옮겼습니다.
- source_word: הָרֵי בְשָׂמִים
  english_pob_choice: the mountains of spices
  chosen_korean: 향료의 산들
  alternatives_korean:
  - 향긋한 산들
  - 향신료의 산들
  - 향기의 산들
  lexicon: HALOT
  rationale: בְשָׂמִים은 향료·향기로운 재료들을 가리키므로, 시적 이미지와 원어의 물질적 뉘앙스를 함께 살리는 ‘향료의 산들’이 적절합니다.
theological_decisions:
- issue: 명령형의 화자-청자 관계와 종결 어미
  chosen_reading: 본문의 사랑 노래로서 남성 연인에게 직접 말하는 호소이므로, 청자에게는 공손한 명령형 ‘-십시오’를 유지했습니다.
  alternative_readings:
