  - 평안을 얻은 이와 같았습니다
  lexicon: HALOT
  rationale: 히브리어 동사 מָצָא의 ‘찾다/얻다’ 범위를 살리면서, שָׁלוֹם의 넓은 의미를 한국어에서 가장 간결하게 담을 수 있는 ‘평강’을 택했습니다.
theological_decisions:
- issue: שָׁלוֹם의 의미 범위
  chosen_reading: ‘평강’으로 옮기되, 단순한 감정적 평온보다 관계적 안녕과 충만함의 뉘앙스를 열어 둡니다.
  alternative_readings:
  - 평안
  - 화평
  - 온전함
  rationale: 문맥은 사랑 노래의 결론부로서 상호 인정과 만족의 상태를 가리키므로, ‘평강’이 전통적이면서도 의미 범위를 과도하게 좁히지 않습니다.
  doctrine_reference: 성서 히브리어의 shalom 어휘장
