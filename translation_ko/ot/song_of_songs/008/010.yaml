base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/010.yaml
  text: I am a wall[a], and my breasts are like towers; then I was in his eyes like one who finds peace.
  footnotes:
  - marker: a
    text: Or 'like one who obtains peace'; the Hebrew expression may also carry the broader sense of finding well-being, wholeness, or favor.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 성벽입니다. 내 젖가슴은 망대들과 같습니다. 그러자 나는 그의 눈에 평강을 얻은 이와 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평강을 얻은 이’; 히브리어 표현은 더 넓게는 복됨, 온전함, 호의를 얻음의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  english_pob_choice: wall
  chosen_korean: 성벽
  alternatives_korean:
  - 벽
  - 담
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘벽’보다 방어적·비유적 이미지가 살아 있는 ‘성벽’이 원문의 은유를 자연스럽게 살립니다.
- source_word: שָׁדַי
  english_pob_choice: my breasts
  chosen_korean: 내 젖가슴
  alternatives_korean:
  - 내 가슴
  - 내 젖가슴들
  lexicon: HALOT
  rationale: 원문은 여성의 신체를 직접 가리키므로, 완곡화보다 직접성을 살린 ‘젖가슴’이 소스의 의미를 더 정확히 반영합니다.
- source_word: כַּמִּגְדָּלוֹת
  english_pob_choice: like towers
  chosen_korean: 망대들과 같습니다
  alternatives_korean:
  - 탑들과 같습니다
  - 성탑들과 같습니다
  lexicon: HALOT
  rationale: 성벽과 짝을 이루는 건축적 비교를 살리기 위해 ‘망대’로 옮겼고, 복수형도 한국어에서 자연스럽게 드러내었습니다.
- source_word: כְּמוֹצְאֵת שָׁלוֹם
  english_pob_choice: like one who finds peace
  chosen_korean: 평강을 얻은 이와 같았습니다
  alternatives_korean:
  - 평강을 찾은 이와 같았습니다
  - 평안을 얻은 이와 같았습니다
  lexicon: HALOT
  rationale: 히브리어 동사 מָצָא의 ‘찾다/얻다’ 범위를 살리면서, שָׁלוֹם의 넓은 의미를 한국어에서 가장 간결하게 담을 수 있는 ‘평강’을 택했습니다.
theological_decisions:
- issue: שָׁלוֹם의 의미 범위
  chosen_reading: ‘평강’으로 옮기되, 단순한 감정적 평온보다 관계적 안녕과 충만함의 뉘앙스를 열어 둡니다.
  alternative_readings:
  - 평안
  - 화평
  - 온전함
  rationale: 문맥은 사랑 노래의 결론부로서 상호 인정과 만족의 상태를 가리키므로, ‘평강’이 전통적이면서도 의미 범위를 과도하게 좁히지 않습니다.
  doctrine_reference: 성서 히브리어의 shalom 어휘장
