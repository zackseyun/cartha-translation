source:
  edition: WLC
  text: אִם חוֹמָ֣ה הִ֔יא נִבְנֶ֥ה עָלֶ֖י/הָ טִ֣ירַת כָּ֑סֶף וְ/אִם דֶּ֣לֶת הִ֔יא נָצ֥וּר עָלֶ֖י/הָ ל֥וּחַ אָֽרֶז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/009.yaml
  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
  footnotes:
  - marker: a
    text: Or 'a turret of silver.' The Hebrew phrase may refer to a tower-like or fortified architectural feature.
    reason: lexical_alternative
  - marker: b
    text: Or 'we will guard/barricade her with a cedar plank.' The Hebrew verb can carry the sense of enclosing, besieging, or guarding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 성벽이면, 우리는 그 위에 은으로 된 성채를 세울 것이요; 그녀가 문이면, 우리는 백향목 널로 그녀를 두르겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은으로 된 성채’는 본문의 טִירַת כָּסֶף를 건축적 요새 이미지로 옮긴 것입니다. ‘은으로 된 망대’ 또는 ‘은으로 된 성루’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두르겠습니다’는 히브리어 נָצוּר의 ‘에워싸다/둘러막다’ 뉘앙스를 살린 번역입니다. 문맥에 따라 ‘가두겠습니다’나 ‘지키겠습니다’로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  english_pob_choice: wall
  chosen_korean: 성벽
  alternatives_korean:
  - 담
  - 벽
  lexicon: HALOT
  rationale: 이 비유는 단순한 실내 벽보다 방어용 구조물을 가리키므로, ‘성벽’이 이미지와 기능을 가장 잘 살립니다.
- source_word: טִירַת כָּסֶף
  english_pob_choice: a battlement of silver
  chosen_korean: 은으로 된 성채
  alternatives_korean:
  - 은 성루
  - 은으로 된 망대
  lexicon: HALOT
  rationale: טִירָה는 성곽 안팎의 요새적 구조를 가리킬 수 있어, 한국어에서는 건축적·방어적 감각을 함께 담는 ‘성채’가 자연스럽습니다.
- source_word: דֶּלֶת
  english_pob_choice: door
  chosen_korean: 문
  alternatives_korean:
  - 대문
  - 문짝
  lexicon: HALOT
  rationale: 기본 뜻을 그대로 살려 ‘문’으로 옮기면, 앞절의 ‘성벽’과 대조되는 열린/닫힌 이미지가 분명해집니다.
- source_word: נָצוּר עָלֶיהָ לוּחַ אָרֶז
  english_pob_choice: we will enclose her with a board of cedar
  chosen_korean: 백향목 널로 그녀를 두르겠습니다
  alternatives_korean:
  - 백향목 판자로 그녀를 에워싸겠습니다
  - 백향목 널판으로 그녀를 둘러막겠습니다
  lexicon: HALOT
  rationale: נָצוּר는 단순히 ‘지키다’보다 ‘둘러싸다/에워싸다’의 뜻이 살아 있어, 건축적 비유를 유지하는 ‘두르다’가 적절합니다. לוּחַ אָרֶז는 재료와 물성을 살려 ‘백향목 널’로 옮겼습니다.
theological_decisions:
- issue: 조건절의 화자 태도와 비유적 압박의 정도
  chosen_reading: 두 조건 모두를 비유적 평가로 옮기되, 둘째 절의 ‘두르겠습니다’로 보호이자 제약의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - ‘가두겠습니다’처럼 강한 감금 의미로 옮김
  - ‘지키겠습니다’처럼 완전히 보호 의미로 옮김
  rationale: 히브리어 נָצוּר는 문맥상 보호와 봉쇄 사이의 긴장을 갖고 있으므로, 어느 한쪽으로 과도하게 좁히지 않는 번역이 필요합니다.
  doctrine_reference: 문맥상 비유적·수사적 긴장 보존
