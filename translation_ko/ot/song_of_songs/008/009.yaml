  lexicon: HALOT
  rationale: נָצוּר는 단순히 ‘지키다’보다 ‘둘러싸다/에워싸다’의 뜻이 살아 있어, 건축적 비유를 유지하는 ‘두르다’가 적절합니다. לוּחַ אָרֶז는 재료와 물성을 살려 ‘백향목 널’로 옮겼습니다.
