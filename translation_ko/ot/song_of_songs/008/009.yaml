  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
  footnotes:
  - marker: a
    text: Or 'a turret of silver.' The Hebrew phrase may refer to a tower-like or fortified architectural feature.
    reason: lexical_alternative
  - marker: b
    text: Or 'we will guard/barricade her with a cedar plank.' The Hebrew verb can carry the sense of enclosing, besieging, or guarding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 성벽이면, 우리는 그 위에 은 성루를 세울 것입니다.[a] 그러나 그녀가 문이면, 우리는 백향목 널판으로 그녀를 둘러막을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은 성루’는 히브리어 טִירַת כָּסֶף를 옮긴 것입니다. ‘은으로 된 망대’ 또는 ‘은으로 된 방어 시설’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘둘러막을 것입니다’는 히브리어 נָצוּר의 에워싸거나 차단하는 뜻을 살린 번역입니다. 문맥에 따라 ‘에워쌀 것입니다’, ‘지킬 것입니다’ 또는 ‘백향목 널판으로 막을 것입니다’로도 이해할 수 있습니다.
    reason: lexical_alternative
