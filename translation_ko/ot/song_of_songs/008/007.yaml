  text: מַ֣יִם רַבִּ֗ים לֹ֤א יֽוּכְלוּ֙ לְ/כַבּ֣וֹת אֶת הָֽ/אַהֲבָ֔ה וּ/נְהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/הָ אִם יִתֵּ֨ן אִ֜ישׁ אֶת כָּל ה֤וֹן בֵּית/וֹ֙ בָּ/אַהֲבָ֔ה בּ֖וֹז יָב֥וּזוּ לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/007.yaml
  text: Many waters cannot quench love[a], nor can rivers sweep it away. If a man were to give all the wealth of his house for love, he would be utterly despised.
  footnotes:
  - marker: a
    text: Or 'they would surely despise him.' The Hebrew expresses strong contempt with an infinitive absolute plus finite verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 물도 사랑을 끌 수 없고, 강물도 그것을 휩쓸어 갈 수 없습니다. 어떤 사람이 사랑의 대가로 자기 집의 모든 재산을 준다 해도, 사람들은 그를 몹시 멸시할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַיִם רַבִּים
  english_pob_choice: Many waters
  chosen_korean: 큰 물
  alternatives_korean:
  - 많은 물
  - 많은 물줄기
  - 큰 물들
  lexicon: HALOT
  rationale: 시적 이미지의 압박감을 살리되 한국어에서 자연스러운 표현으로 옮겼습니다. ‘많은 물’보다 ‘큰 물’이 홍수 같은 위압감을 더 직접적으로 드러냅니다.
- source_word: לֹא יוּכְלוּ לְכַבּוֹת
  english_pob_choice: cannot quench
  chosen_korean: 끌 수 없고
  alternatives_korean:
  - 꺼뜨릴 수 없고
  - 진압할 수 없고
  - 꺼 버릴 수 없고
  lexicon: HALOT
  rationale: כבה는 ‘끄다/꺼지다’의 뜻이지만, 한국어에서는 물이 사랑을 ‘끌 수 없다’고 하는 표현이 시적 대비를 가장 자연스럽게 살립니다.
- source_word: וּנְהָרוֹת
  english_pob_choice: nor can rivers
  chosen_korean: 강물도
  alternatives_korean:
  - 강들도
  - 강들도 역시
  - 그리고 강물은
  lexicon: HALOT
  rationale: 병행절의 점증을 살리기 위해 ‘강물도’로 옮겼습니다. 앞의 ‘큰 물’과 짝을 이루어 더 강한 흐름을 나타냅니다.
- source_word: בּוֹז יָבֻזוּ לוֹ
  english_pob_choice: he would be utterly despised
  chosen_korean: 완전히 멸시를 받을 것입니다
  alternatives_korean:
  - 몹시 멸시를 받을 것입니다
  - 지독히 업신여김을 받을 것입니다
  - 철저히 멸시를 받을 것입니다
  lexicon: HALOT
  rationale: 원문의 강조형(부정사 절대형 + 동사)을 한국어의 ‘완전히’로 반영했습니다. ‘멸시를 받을 것입니다’는 수동적 결과를 자연스럽게 전달합니다.
theological_decisions:
- issue: 사랑의 비가시적·불가항력적 성격
  chosen_reading: 사랑은 어떤 외적 세력도 끌 수 없고 휩쓸어 갈 수 없는 것으로 제시합니다.
  alternative_readings:
  - 사랑은 단순한 감정이 아니라 언약적 충성입니다.
  - 사랑은 죽음에 버금가는 불멸성을 가집니다.
  rationale: 직전 문맥(8:6)의 사랑의 불꽃 이미지를 이어, 이 절은 사랑의 강인함을 시적으로 확언합니다. 문맥이 요구하는 범위를 넘지 않도록 해석을 절제했습니다.
  doctrine_reference: 아가서 8:6-7의 문맥적 통일성
