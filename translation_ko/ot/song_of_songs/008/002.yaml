source:
  edition: WLC
  text: אֶנְהָֽגֲ/ךָ֗ אֲבִֽיאֲ/ךָ֛ אֶל בֵּ֥ית אִמִּ֖/י תְּלַמְּדֵ֑/נִי אַשְׁקְ/ךָ֙ מִ/יַּ֣יִן הָ/רֶ֔קַח מֵ/עֲסִ֖יס רִמֹּנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/002.yaml
  text: I would lead you and bring you into my mother’s house[a], where she taught me; I would give you spiced wine to drink[b], from the juice of my pomegranate.
  footnotes:
  - marker: a
    text: Or, 'you would teach me.' The Hebrew verb 'teach me' is third feminine singular, which most naturally refers to 'my mother,' but the terse poetic syntax has led some to connect it differently.
    reason: alternative_reading
  - marker: b
    text: Or, 'from the sweet wine of my pomegranate.' The Hebrew term can refer to fresh juice or sweet wine/must.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 당신을 이끌어 나를 가르치신 내 어머니의 집으로 데려가겠습니다.[a] 내가 당신에게 내 석류즙으로 만든 향료 섞은 포도주를 마시게 하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 어머니의 집으로 데려가겠습니다. 당신이 나를 가르치실 것입니다’라고 할 수 있습니다. 히브리어 ‘나를 가르치다’는 여성 단수형이어서 가장 자연스럽게는 ‘내 어머니’를 가리킵니다. 그러나 간결한 시어의 구조 때문에 이를 달리 연결하는 해석도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 석류의 달콤한 포도주로’라고 할 수 있습니다. 히브리어 말은 신선한 즙, 단 포도주, 또는 머스트를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶנְהָֽגֲךָ
  english_pob_choice: I would lead you
  chosen_korean: 나는 당신을 이끌고
  alternatives_korean:
  - 나는 당신을 인도하고
  - 나는 당신을 이끌어
  lexicon: HALOT
  rationale: 1인칭 단수 미완료형의 화용상 의도/희망을 살려 ‘-리니’로 옮기되, 구체적 동작인 ‘이끌다’를 유지했습니다.
- source_word: אֲבִיאֲךָ אֶל בֵּית אִמִּי
  english_pob_choice: and bring you into my mother’s house
  chosen_korean: 내 어머니의 집으로 데려가리니
  alternatives_korean:
  - 내 어머니의 집으로 이끌어 가리니
  - 내 어머니의 집으로 데리고 가리니
  lexicon: HALOT
  rationale: אֶל + ‘집’의 방향성을 자연스럽게 반영했고, 앞 동사와 병행되는 이동 동작을 한국어에서 ‘데려가다’로 압축했습니다.
- source_word: תְּלַמְּדֵנִי
  english_pob_choice: where she taught me
  chosen_korean: 거기서 그녀가 나를 가르쳤습니다
  alternatives_korean:
  - 그녀가 나를 가르치던 곳에서
  - 나를 가르쳤던 그녀가 있는 곳에서
  lexicon: HALOT
  rationale: 3fs 형태가 ‘내 어머니’를 가리키는 문법적 가능성을 반영해, 장소부사 ‘거기서’로 문맥을 풀어 썼습니다. 동사의 과거성도 유지했습니다.
- source_word: מִיַּיִן הָרֶקַח
  english_pob_choice: spiced wine
  chosen_korean: 향료를 넣은 포도주
  alternatives_korean:
  - 향신료를 넣은 포도주
  - 향기로운 포도주
  lexicon: HALOT
  rationale: הרקח는 향료/향신료로 배합된 술의 이미지를 가지므로, 한국어에서 가장 직접적인 ‘향료를 넣은 포도주’로 옮겼습니다.
- source_word: מֵעֲסִיס רִמֹּנִי
  english_pob_choice: from the juice of my pomegranate
  chosen_korean: 내 석류의 즙으로 된 것입니다
  alternatives_korean:
  - 내 석류의 과즙으로 된 것입니다
  - 내 석류에서 난 즙으로 된 것입니다
  lexicon: HALOT
  rationale: עֲסִיס의 기본 의미를 ‘즙’으로 보존했고, 소유격을 직역해 석류의 풍성한 이미지와 원문의 간결함을 유지했습니다.
theological_decisions:
- issue: 화자의 의지 표현과 시적 미래성
  chosen_reading: 직설적 미래보다 ‘-리니’로 옮겨, 화자가 사랑하는 이를 맞이하려는 의도와 소망을 드러냈습니다.
  alternative_readings:
  - 나는 당신을 이끌 것입니다
  - 나는 당신을 이끌고 데려갈 것입니다
  rationale: 히브리어 미완료형은 문맥상 서원·의향의 뉘앙스를 띠므로, 단순 예언적 미래로 고정하지 않는 편이 본문 효과를 더 잘 살립니다.
  doctrine_reference: 시가서의 화자 의도와 서정적 미래성
