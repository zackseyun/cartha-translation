  rationale: 직역적 표지를 우선하여 ‘딸들’로 옮겼고, 시적 관용으로서의 일반적 여성 집단이라는 뉘앙스는 주해 없이 본문에서 과도하게 풀지 않았습니다.
theological_decisions:
