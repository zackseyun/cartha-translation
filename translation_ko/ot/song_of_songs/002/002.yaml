  lexicon: HALOT
  rationale: 연애적이고 친밀한 시어를 살리되 한국어에서 덜 어색한 표현인 ‘내 사랑하는 이’를 택해, 여성형 대상에 대한 화자의 애정을 자연스럽게 전달했습니다.
