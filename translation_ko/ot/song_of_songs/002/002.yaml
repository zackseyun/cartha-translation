  rationale: בֵּין은 집합 안의 위치를 나타내므로 ‘사이’가 자연스럽고, חוֹחִים는 단순한 가시가 아니라 가시가 있는 식물을 가리켜 ‘가시나무들’로 구체화했습니다.
