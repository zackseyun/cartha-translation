base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/002.yaml
  text: Like a lily among thorns[b][a], so is my beloved among the daughters.
  footnotes:
  - marker: a
    text: Or 'young women' for 'the daughters'; the Hebrew idiom can refer to women of the group more generally, not only literal daughters.
    reason: lexical_alternative
  - marker: b
    text: Or 'my love' or 'my darling' for 'my beloved.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가시나무들 사이의 백합꽃처럼, 내 사랑하는 이는 딸들 사이에서 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘딸들’은 이 본문에서 문자적 딸들보다 같은 집단의 젊은 여자들을 가리키는 관용으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 사랑하는 이’는 원문의 רַעְיָתִי를 옮긴 것으로, ‘내 사랑’ 또는 ‘내 연인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
