  text: שְׂמֹאל/וֹ֙ תַּ֣חַת לְ/רֹאשִׁ֔/י וִ/ימִינ֖/וֹ תְּחַבְּקֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/006.yaml
  text: His left hand is under my head[a], and his right hand embraces me.
  footnotes:
  - marker: a
    text: Or 'his left arm ... his right arm,' since the Hebrew terms for 'left' and 'right' can denote the corresponding side or hand/arm in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 왼손은 내 머리 아래에 있고, 그의 오른손은 나를 안고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘왼쪽’과 ‘오른쪽’은 문맥에 따라 그에 대응하는 손이나 팔을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  english_pob_choice: his left hand
  chosen_korean: 그의 왼손
  alternatives_korean:
  - 그의 왼팔
  - 그의 왼쪽
  lexicon: HALOT
  rationale: 히브리어는 왼쪽/왼손의 신체적 위치를 가리키며, 한국어에서는 문맥상 ‘왼손’이 가장 자연스럽고 구체적입니다.
- source_word: תַּחַת לְרֹאשִׁי
  english_pob_choice: under my head
  chosen_korean: 내 머리 아래에
  alternatives_korean:
  - 내 머리 밑에
  - 내 머리 아래
  lexicon: HALOT
  rationale: תחת + רֹאשׁ은 문자적으로 ‘머리 아래’이므로, 한국어에서도 과도한 의역 없이 위치 관계를 드러냈습니다.
- source_word: וִימִינוֹ
  english_pob_choice: and his right hand
  chosen_korean: 그의 오른손
  alternatives_korean:
  - 그의 오른팔
  - 그의 오른쪽
  lexicon: HALOT
  rationale: 평행 구조를 살려 왼손과 대응되는 표현으로 ‘오른손’을 택했습니다.
- source_word: תְּחַבְּקֵנִי
  english_pob_choice: embraces me
  chosen_korean: 나를 안고 있습니다
  alternatives_korean:
  - 나를 껴안고 있습니다
  - 나를 붙들고 있습니다
  lexicon: HALOT
  rationale: חבק는 ‘안다/껴안다’의 뜻이므로, 현재 진행적 장면을 살려 ‘안고 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 현재의 처리
  chosen_reading: 장면을 눈앞에 그리는 시적 현재로 번역해 현재형 ‘-고 있습니다’를 사용했습니다.
  alternative_readings:
  - 과거형으로 옮김
  - 단순 현재형 ‘안습니다’
  rationale: 원문 미완료형은 이 시적 맥락에서 생생한 현재의 장면 묘사를 이끄므로, 한국어도 이를 반영했습니다.
  doctrine_reference: 시가서의 문체와 서술 시제
- issue: 신체 부위의 구체성
  chosen_reading: 원문의 좌우 대칭을 살려 손을 명시했습니다.
  alternative_readings:
  - 왼쪽/오른쪽으로만 처리
  rationale: 히브리어의 좌우 표현은 문맥상 손/팔을 포함할 수 있지만, 본문과 영어 POB의 감사 기록을 따라 신체 접촉의 이미지를 분명하게 했습니다.
  doctrine_reference: 본문의 시적 이미지 보존
