source:
  edition: WLC
  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/007.yaml
  text: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
  footnotes:
  - marker: a
    text: Or, more literally, 'I put you under oath.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by the gazelles or by the does of the field,' a poetic oath formula; some see a wordplay echoing divine titles, but the animal imagery is the plain sense here.
    reason: cultural_note
  - marker: c
    text: Or 'that you not arouse or awaken love until she/it pleases.'
    reason: alternative_reading
translation:
  language: ko
  text: 예루살렘의 딸들아, 가젤들이나 들의 암사슴들을 두고 너희에게 맹세시킵니다. 사랑이 원할 때까지 사랑을 일으키거나 깨우지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용법으로는 ‘너희를 맹세하게 하다’ 또는 ‘너희를 맹세 아래 두다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘가젤들이나 들의 암사슴들을 두고’는 동물 이미지를 사용하는 시적 맹세 공식입니다. 일부는 신적 칭호를 떠올리게 하는 말놀이를 보지만, 여기의 기본 뜻은 동물들입니다.
    reason: cultural_note
  - marker: c
    text: 마지막 동사는 히브리어에서 여성 단수형입니다. 앞의 여성명사 ‘사랑’을 가리켜 ‘사랑이 원할 때까지’로 이해할 수 있으며, ‘그것이 원할 때까지’라고도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּ֨עְתִּי
  english_pob_choice: I adjure you
  chosen_korean: 나는 너희를 …로 맹세하게 합니다
  alternatives_korean:
  - 나는 너희에게 엄숙히 명합니다
  - 나는 너희에게 맹세를 시킵니다
  lexicon: HALOT
  rationale: 히필형 שׁבע의 관용적 뜻은 상대를 맹세 아래 두거나 엄숙히 서약하게 하는 것이므로, 합쇼체에서 ‘맹세하게 합니다’로 옮겨 oath의 강한 구속력을 살렸습니다.
- source_word: בְּצְבָא֔וֹת / בְּאַיְל֣וֹת הַשָּׂדֶ֑ה
  english_pob_choice: by the gazelles or by the does of the field
  chosen_korean: 사슴들과 들의 암사슴들로
  alternatives_korean:
  - 가젤들과 들의 암사슴들로
  - 들사슴들과 들의 암사슴들로
  lexicon: HALOT
  rationale: 문맥상 군대 의미가 아니라 짝을 이룬 동물 맹세식 표현이므로 동물 이미지로 유지했습니다. ‘사슴/암사슴’은 현대 한국어에서 자연스럽고 성별 대비도 보존합니다.
- source_word: אִם תָּעִ֧ירוּ וְאִם תְּעֽוֹרְר֛וּ
  english_pob_choice: do not stir up or awaken
  chosen_korean: 사랑을 깨우거나 자극하지 말고
  alternatives_korean:
  - 사랑을 일으키거나 깨우지 말고
  - 사랑을 흔들어 깨우지 말고
  lexicon: HALOT
  rationale: 두 동사는 가까운 의미를 반복하며 강도를 더하므로, 둘 다 살리되 한국어에서는 ‘깨우다 / 자극하다’로 구분해 중첩된 금지를 유지했습니다.
- source_word: עַ֥ד שֶׁ/תֶּחְפָּֽץ
  english_pob_choice: until it pleases
  chosen_korean: 그것이 원할 때까지
  alternatives_korean:
  - 그것이 기뻐할 때까지
  - 그것이 원하기까지
  lexicon: HALOT
  rationale: 히브리어 여성형 동사는 앞의 ‘사랑’을 받으므로, 한국어에서는 추상명사에 자연스러운 ‘그것’으로 옮겨 인격화의 과잉을 피하면서도 원문의 문법 관계를 보존했습니다.
theological_decisions:
- issue: ‘사랑’의 의인화 정도
  chosen_reading: 사랑을 여성 인칭 대명사처럼 번역하지 않고, 추상명사에 맞는 중성적 표현으로 유지했습니다.
  alternative_readings:
  - ‘그녀가 원할 때까지’로 의인화하기
  - ‘사랑이 준비될 때까지’로 의미를 풀어쓰기
  rationale: 이 절은 교리적 논쟁문이 아니라 시적 경계문이므로, 히브리어 문법이 가리키는 연결은 유지하되 한국어에서는 과도한 의인화를 피하는 편이 더 자연스럽고 본문 의도에 충실합니다.
  doctrine_reference: Translation philosophy §3, §6
