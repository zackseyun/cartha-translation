- from: 날이 숨을 쉬고 그림자들이 달아날 때까지—내 사랑이여, 돌아오십시오. 들사슴이나 어린 수사슴처럼 베델의 산들 위에 계십시오.[a][b]
  to: 날이 숨을 쉬고 그림자들이 달아날 때까지[a], 내 사랑이여, 돌아서십시오. 들사슴이나 어린 수사슴처럼 베테르의 산들 위에 계십시오[b].
  rationale: 원문의 시적 이미지인 ‘날이 숨 쉬다’와 그림자들이 ‘달아나다’를 유지했습니다. סֹב는 귀환을 명시하는 ‘돌아오다’ 대신 기본 의미를 보존한 ‘돌아서십시오’로 수정했습니다. 불확실한 בָתֶר는 Bethel과 혼동될 수 있는 ‘베델’ 대신 ‘베테르’로 음역하고, 의미 번역 가능성은 각주에 남겼습니다. 각주 표지도 관련 어구 바로 뒤로 옮겼습니다.
