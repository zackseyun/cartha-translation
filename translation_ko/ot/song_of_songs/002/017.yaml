  source_fidelity: ‘돌아오십시오’는 히브리어 סֹב(‘돌아서다/돌다’)를 ‘되돌아오다’로 구체화하여 원문보다 해석적입니다. 또한 בָתֶר는 ‘베델’(Bethel)이 아니라 별개의 형태이므로 음역을 바로잡아야 합니다.
  naturalness: 합쇼체와 시적 어조는 대체로 적절합니다. 다만 ‘내 사랑이여, 돌아오십시오’는 원문의 단순한 방향 전환 명령보다 좁은 뜻이며, 주석의 ‘직설적으로 말하는’은 한국어 표현으로 다소 어색합니다.
  terminology: דוֹדִי는 ‘내 사랑이여’, צְבִי/עֹפֶר הָאַיָּלִים은 ‘들사슴/어린 수사슴’으로 적절합니다. 불확실한 בָתֶר는 본문에서 ‘베테르’로 음역하고 대안은 주석에 보존하는 것이 안전합니다.
