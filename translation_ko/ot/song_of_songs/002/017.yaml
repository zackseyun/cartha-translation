source:
  edition: WLC
  text: עַ֤ד שֶׁ/יָּפ֨וּחַ֙ הַ/יּ֔וֹם וְ/נָ֖סוּ הַ/צְּלָלִ֑ים סֹב֩ דְּמֵה לְ/ךָ֨ דוֹדִ֜/י לִ/צְבִ֗י א֛וֹ לְ/עֹ֥פֶר הָ/אַיָּלִ֖ים עַל הָ֥רֵי בָֽתֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/017.yaml
  text: Until the day breathes and the shadows flee[a], turn[b], my beloved—be like a gazelle or a young stag on the mountains of Bether.
  footnotes:
  - marker: a
    text: Or 'Until the day cools and the shadows flee.' The Hebrew literally speaks of the day 'breathing' or 'blowing,' a poetic expression often understood as the coming of the evening breeze or the freshening of dawn.
    reason: lexical_alternative
  - marker: b
    text: '''Bether'' may be a place name. Alternatively, the phrase may mean ''mountains of separation'' or, less likely, ''rugged/jagged mountains.'''
    reason: alternative_reading
translation:
  language: ko
  text: 날이 숨을 쉬고 그림자들이 달아날 때까지[a], 내 사랑이여, 돌아서십시오. 들사슴이나 어린 수사슴처럼 베테르의 산들 위에 계십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날이 식고 그림자들이 달아날 때까지’로 옮길 수 있습니다. 히브리어는 날이 ‘숨 쉬다’ 또는 ‘불다’라고 말하는 시적 표현입니다. 이는 저녁바람이 불거나 새벽 공기가 상쾌해지는 때를 가리키는 것으로 이해되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘베테르’는 지명일 수 있습니다. 또는 ‘분리의 산들’, 덜 가능하게는 ‘험준한/갈라진 산들’을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  english_pob_choice: Until the day breathes
  chosen_korean: 날이 숨을 쉬고
  alternatives_korean:
  - 날이 식고
  - 날이 불고
  lexicon: HALOT
  rationale: פּוּחַ의 기본 이미지를 살려 직역에 가깝게 옮기되, 한국어에서는 ‘숨을 쉬다’가 시적 표현을 유지하면서도 자연스럽습니다.
- source_word: וְנָסוּ הַצְּלָלִים
  english_pob_choice: and the shadows flee
  chosen_korean: 그림자들이 달아날 때까지
  alternatives_korean:
  - 그림자들이 사라질 때까지
  - 그림자들이 물러날 때까지
  lexicon: HALOT
  rationale: נוּס의 ‘도망하다/달아나다’ 뉘앙스를 보존해 그림자에 생동감을 주며, 단순한 소멸보다 원문의 동작성을 드러냅니다.
- source_word: סֹב ... דוֹדִי
  english_pob_choice: turn ... my beloved
  chosen_korean: 내 사랑이여, 돌아오십시오
  alternatives_korean:
  - 내 사랑이여, 돌이키십시오
  - 내 사랑이여, 돌아서십시오
  lexicon: HALOT
  rationale: סבב의 명령형을 한국어에서 가장 자연스럽게 풀면 ‘돌아오십시오’이지만, 원문의 ‘turn’이 요구하는 방향 전환의 긴박함을 유지합니다.
- source_word: עַל הָרֵי בָתֶר
  english_pob_choice: on the mountains of Bether
  chosen_korean: 베델의 산들 위에
  alternatives_korean:
  - 베테르의 산들 위에
  - 분리의 산들 위에
  lexicon: HALOT
  rationale: 본문의 지명/의미 불확실성은 영어 POB의 주석을 따르며, 한국어 본문에는 음역 형태를 두어 원문의 모호성을 유지합니다.
theological_decisions:
- issue: 연인의 요청이 ‘돌아오라’는 명령인지 ‘자리를 바꾸라’는 움직임인지
  chosen_reading: 연인의 시적 요청으로서, 명령형의 긴박함을 살리되 강압적 의미는 피했습니다.
  alternative_readings:
  - ‘되돌아오십시오’로 더 명시적으로 돌이킴을 표현
  - ‘오십시오’로 완화해 초청처럼 표현
  rationale: 아가서의 대화체는 사랑의 서두름과 갈망을 드러내므로, 원문의 동작 명령을 보존하면서도 한국어에서 과도한 명령조로 굳어지지 않게 했습니다.
  doctrine_reference: 아가서의 시적-지혜문학적 화법
- issue: ‘베델의 산들’의 지명성 유지 여부
  chosen_reading: 주석 없이 본문에서는 지명 가능성을 열어 둔 음역을 유지했습니다.
  alternative_readings:
  - ‘분리의 산들’로 의미 번역
  - ‘험준한 산들’로 지형 묘사
  rationale: 원문 자체가 지명인지 의미형인지 불확실하므로, 단정 번역보다 모호성을 보존하는 편이 원문의 증거에 충실합니다.
  doctrine_reference: 본문 비평 및 어휘 모호성 보존
