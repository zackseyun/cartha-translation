  text: Catch the foxes for us[a], the little foxes that ruin the vineyards[c][b], for our vineyards are in blossom.
  footnotes:
  - marker: a
    text: Hebrew שׁוּעָלִים can also be understood as 'jackals' in some contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'that spoil vineyards.'
    reason: lexical_alternative
  - marker: c
    text: Or 'our vineyards are in bloom' or, less likely, 'have tender grapes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리를 위하여 여우들을 붙잡으십시오. 포도원을 망치는 작은 여우들을—우리 포도원들이 꽃이 피었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁוּעָלִים는 문맥에 따라 ‘자칼들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포도원을 망치는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리 포도원들이 꽃이 피었습니다’가 아니라 ‘우리 포도원들이 피어 있습니다’ 또는 덜 가능하게는 ‘연한 포도가 맺혔습니다’로 이해할 수도 있습니다.
    reason: lexical_alternative
