source:
  edition: WLC
  text: סַמְּכ֨וּ/נִי֙ בָּֽ/אֲשִׁישׁ֔וֹת רַפְּד֖וּ/נִי בַּ/תַּפּוּחִ֑ים כִּי חוֹלַ֥ת אַהֲבָ֖ה אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/005.yaml
  text: Sustain me with raisin cakes[a]; refresh me with apples[c][b], for I am sick with love.
  footnotes:
  - marker: a
    text: Or 'with cakes of raisins' or 'with pressed grape cakes.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term traditionally rendered 'apples' may refer more broadly to a fragrant fruit; the exact botanical identification is uncertain.
    reason: cultural_note
  - marker: c
    text: Or 'love-sick.'
    reason: lexical_alternative
translation:
  language: ko
  text: 떡을 베풀어 나를 떠받쳐 주십시오[b]; 사과로[c] 나를 시원하게 해 주십시오[a]. 사랑 때문에 내가 아픕니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사과’는 전통적 번역이지만, 히브리어 תַּפּוּחַ의 정확한 식물학적 식별은 확정되지 않습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘건포도 떡’ 또는 ‘포도 압착떡’처럼 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘새롭게 해 주십시오’, ‘회복시켜 주십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכ֨וּ/נִי֙
  english_pob_choice: Sustain me
  chosen_korean: 나를 떠받쳐 주십시오
  alternatives_korean:
  - 나를 붙들어 주십시오
  - 나를 지탱해 주십시오
  - 나를 받쳐 주십시오
  lexicon: HALOT
  rationale: סמך의 핵심은 ‘받쳐 지탱하다’이므로, 시적 맥락에서 육체적·정서적 약함을 직접 드러내는 ‘떠받쳐 주십시오’로 옮겼습니다.
- source_word: בָּֽ/אֲשִׁישׁ֔וֹת
  english_pob_choice: with raisin cakes
  chosen_korean: 떡
  alternatives_korean:
  - 건포도떡
  - 건포도 과자
  - 포도 압착떡
  lexicon: HALOT
  rationale: אֲשִׁישׁוֹת는 건포도나 포도 압착으로 만든 떡류를 가리킬 수 있어, 본문이 확정하지 않는 범위에서는 가장 포괄적인 ‘떡’으로 두고 의미 가능성은 주석으로 남기는 것이 안전합니다.
- source_word: רַפְּד֖וּ/נִי בַּ/תַּפּוּחִ֑ים
  english_pob_choice: refresh me with apples
  chosen_korean: 사과로 나를 시원하게 해 주십시오
  alternatives_korean:
  - 사과로 나를 새롭게 해 주십시오
  - 사과로 나를 위로해 주십시오
  - 사과로 나를 회복시켜 주십시오
  lexicon: HALOT
  rationale: רפד는 지지·회복의 이미지를 담을 수 있어 음식 이미지와 함께 ‘시원하게 해 주십시오’로 옮겨 회복적 뉘앙스를 살렸습니다.
- source_word: בַּ/תַּפּוּחִ֑ים
  english_pob_choice: apples
  chosen_korean: 사과
  alternatives_korean:
  - 살구
  - 향기로운 열매
  - 사과열매
  lexicon: HALOT
  rationale: תפּוּחַ은 전통적으로 ‘사과’로 옮기되 정확한 식별은 불확실하므로, 본문에는 익숙한 번역을 유지하고 변동 가능성은 각주로 처리했습니다.
- source_word: חוֹלַ֥ת אַהֲבָ֖ה
  english_pob_choice: sick with love
  chosen_korean: 사랑 때문에 내가 아픕니다
  alternatives_korean:
  - 사랑에 병들었습니다
  - 사랑에 아픕니다
  - 사랑병이 났습니다
  lexicon: HALOT
  rationale: 직역하면 ‘사랑으로 아픈’이라는 뜻이므로, 비유를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 원인 표지 ‘때문에’를 사용했습니다.
theological_decisions:
- issue: 연인의 간청과 육체적/정서적 쇠약의 표현
  chosen_reading: 문장을 그대로 연애시의 강한 갈망과 쇠약으로 읽었습니다.
  alternative_readings:
  - 영적 은유로 완화해 읽기
  - 단순한 배고픔이나 피로로 축소하기
  rationale: 아가의 문맥은 노골적인 사랑의 언어를 유지하며, 본절의 ‘사랑 때문에 내가 아픕니다’는 감정적·신체적 약화를 함께 드러내므로 그 긴장을 보존했습니다.
  doctrine_reference: 아가서의 시적·문학적 장르 이해
