    reason: lexical_alternative
translation:
  language: ko
  text: 건포도 떡으로 나를 붙들어 주십시오[a]. 사과로 나를 회복시켜 주십시오[b]. 나는 사랑에 병들었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도 압착떡으로’.
    reason: lexical_alternative
  - marker: b
    text: ‘사과’는 전통적 번역이지만, 히브리어 תַּפּוּחַ이 가리키는 정확한 식물은 확정되지 않습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘사랑으로 아픕니다’, ‘사랑에 병들어 있습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכ֨וּ/נִי֙
  english_pob_choice: Sustain me
  chosen_korean: 나를 떠받쳐 주십시오
  alternatives_korean:
  - 나를 붙들어 주십시오
  - 나를 지탱해 주십시오
  - 나를 받쳐 주십시오
  lexicon: HALOT
  rationale: סמך의 핵심은 ‘받쳐 지탱하다’이므로, 시적 맥락에서 육체적·정서적 약함을 직접 드러내는 ‘떠받쳐 주십시오’로 옮겼습니다.
- source_word: בָּֽ/אֲשִׁישׁ֔וֹת
  english_pob_choice: with raisin cakes
  chosen_korean: 떡
  alternatives_korean:
  - 건포도떡
  - 건포도 과자
  - 포도 압착떡
  lexicon: HALOT
  rationale: אֲשִׁישׁוֹת는 건포도나 포도 압착으로 만든 떡류를 가리킬 수 있어, 본문이 확정하지 않는 범위에서는 가장 포괄적인 ‘떡’으로 두고 의미 가능성은 주석으로 남기는 것이 안전합니다.
- source_word: רַפְּד֖וּ/נִי בַּ/תַּפּוּחִ֑ים
  english_pob_choice: refresh me with apples
  chosen_korean: 사과로 나를 시원하게 해 주십시오
  alternatives_korean:
  - 사과로 나를 새롭게 해 주십시오
  - 사과로 나를 위로해 주십시오
  - 사과로 나를 회복시켜 주십시오
  lexicon: HALOT
  rationale: רפד는 지지·회복의 이미지를 담을 수 있어 음식 이미지와 함께 ‘시원하게 해 주십시오’로 옮겨 회복적 뉘앙스를 살렸습니다.
- source_word: בַּ/תַּפּוּחִ֑ים
  english_pob_choice: apples
  chosen_korean: 사과
  alternatives_korean:
  - 살구
  - 향기로운 열매
  - 사과열매
  lexicon: HALOT
  rationale: תפּוּחַ은 전통적으로 ‘사과’로 옮기되 정확한 식별은 불확실하므로, 본문에는 익숙한 번역을 유지하고 변동 가능성은 각주로 처리했습니다.
- source_word: חוֹלַ֥ת אַהֲבָ֖ה
  english_pob_choice: sick with love
  chosen_korean: 사랑 때문에 내가 아픕니다
  alternatives_korean:
  - 사랑에 병들었습니다
  - 사랑에 아픕니다
  - 사랑병이 났습니다
  lexicon: HALOT
  rationale: 직역하면 ‘사랑으로 아픈’이라는 뜻이므로, 비유를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 원인 표지 ‘때문에’를 사용했습니다.
