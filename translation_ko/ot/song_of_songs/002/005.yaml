  source_fidelity: 첫 명령의 אֲשִׁישׁוֹת는 단순한 ‘떡’보다 포도·건포도로 만든 떡이라는 뜻을 본문에서 드러내는 편이 원문과 영어 감사 기록에 더 충실합니다. רַפְּדוּנִי는 음식으로 기운을 되찾게 하는 문맥에서 ‘회복시켜 주십시오’로 자연스럽게 옮길 수 있습니다. חוֹלַת אַהֲבָה는 ‘사랑에 병들었습니다’가 사랑으로 인한 병듦의 시적 비유를 보존합니다.
  naturalness: 기존의 ‘떡을 베풀어’는 히브리어의 도구·수단 표현과 맞지 않고 한국어에서도 부자연스럽습니다. ‘건포도 떡으로 나를 붙들어 주십시오’와 ‘사과로 나를 회복시켜 주십시오’는 현대 표준어 합쇼체로 자연스럽고 시적 문맥에도 적합합니다.
  terminology: ‘건포도 떡’은 אֲשִׁישׁוֹת의 통상적 이해를 반영하되 각주에서 포도 압착떡이라는 대안을 제시합니다. תַּפּוּחַ은 전통에 따라 ‘사과’로 유지하고, 식물학적 불확실성은 각주로 처리합니다. ‘사랑에 병들었습니다’는 과도하게 구어적인 ‘사랑병’보다 원문의 비유적 병듦을 잘 보존합니다.
