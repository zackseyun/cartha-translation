base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/013.yaml
  text: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
  footnotes:
  - marker: a
    text: Or 'the fig tree has formed its green figs.' The Hebrew verb and noun can emphasize the fruit's early developmental stage rather than full ripeness.
    reason: lexical_alternative
  - marker: b
    text: Or 'the vines in blossom are fragrant' or 'the vines with tender grapes give fragrance.'
    reason: lexical_alternative
  - marker: c
    text: 'Literally, ''and go for yourself''; here the sense is an invitation to depart with the speaker: ''come away.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 무화과나무는 이른 열매를 맺고, 포도나무는 꽃을 피워 향기를 내뿜습니다. 일어나십시오, 내 사랑, 내 아름다운 이여[b][c], 그리고 함께 가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘포도나무는 꽃이 피어 향기를 냅니다’ 혹은 ‘포도나무는 연한 포도를 두고 향기를 냅니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘스스로를 위하여 가라’에 가깝지만, 여기서는 화자와 함께 떠나라는 초청의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְטָה פַגֶּיהָ
  english_pob_choice: has ripened its early figs
  chosen_korean: 이른 열매를 맺고
  alternatives_korean:
  - 초록 무화과를 맺고
  - 아직 덜 익은 무화과를 맺고
  - 무화과가 익어 가고
  lexicon: HALOT
  rationale: 이 표현은 무화과의 초기 결실 상태를 가리키므로, 한국어에서는 직역보다 계절적·상황적 의미가 드러나는 ‘이른 열매를 맺고’가 자연스럽습니다.
- source_word: סְמָדַר נָתְנוּ רֵיחַ
  english_pob_choice: the vines in blossom give off fragrance
  chosen_korean: 포도나무는 꽃을 피워 향기를 내뿜습니다
  alternatives_korean:
  - 포도나무는 꽃이 피어 향기를 냅니다
  - 포도나무의 꽃이 향기를 냅니다
  - 포도나무는 연한 포도를 두고 향기를 냅니다
  lexicon: HALOT
  rationale: סְמָדַר는 포도나무의 꽃 또는 매우 초기 성장 단계이므로, 문맥상 향기와 연결되는 꽃 단계로 풀어 ‘꽃을 피워 향기를 내뿜습니다’라고 옮겼습니다.
- source_word: קוּמִי וּלְכִי לָךְ
  english_pob_choice: Arise ... and come away
  chosen_korean: 일어나십시오 ... 그리고 함께 가십시오
  alternatives_korean:
  - 일어나십시오 ... 그리고 떠나십시오
  - 일어나십시오 ... 그리고 오십시오
  - 일어나십시오 ... 그리고 가십시오
  lexicon: HALOT
  rationale: 직역상의 ‘가라’보다, 화자의 초청 뉘앙스를 살려 한국어에서 자연스러운 동반 요청인 ‘함께 가십시오’로 옮겼습니다.
- source_word: רַעְיָתִי יָפָתִי
  english_pob_choice: my love, my beautiful one
  chosen_korean: 내 사랑, 내 아름다운 이여
  alternatives_korean:
  - 내 사랑, 내 아름다운 사람
  - 내 사랑, 내 예쁜 이여
  - 내 사랑, 내 고운 이여
  lexicon: HALOT
  rationale: 애정 호칭의 친밀함과 시적 품격을 함께 살리기 위해 ‘내 사랑’과 ‘내 아름다운 이여’를 사용했습니다.
theological_decisions:
- issue: 화자의 초청 명령문의 정서와 공손한 한국어 종결
  chosen_reading: 명령형이지만 직설적 압박보다 초청의 정서가 강하므로, 합쇼체로 정중하게 옮겼습니다.
  alternative_readings:
  - 일어나라, 내 사랑…
  - 일어나십시오, 내 사랑… 그리고 오십시오
  rationale: 아가의 연인 간 초청을 한국어에서 과도하게 명령조로 만들지 않으면서도, 원문의 권유·초청 기능을 유지하기 위해 공손한 요청형을 택했습니다.
  doctrine_reference: 문체·담화 기능 보존
