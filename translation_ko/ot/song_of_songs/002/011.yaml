translation:
  language: ko
  text: 보십시오[a], 겨울이 지나갔고, 비는 그치고 사라졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우기가 지나갔습니다.’ 히브리어 낱말은 더 구체적으로 비가 내리는 계절을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי + הִנֵּה
  english_pob_choice: For look
  chosen_korean: 그러므로 보십시오
  alternatives_korean:
  - 보십시오
  - 자, 보십시오
  - 그러므로, 보십시오
  lexicon: HALOT
  rationale: כִּי는 앞선 권유를 이어 설명하는 연결로 보았고, הִנֵּה의 주의를 끄는 기능은 합쇼체 명령형 ‘보십시오’로 자연스럽게 살렸습니다.
- source_word: הַסְּתָו
  english_pob_choice: the winter
  chosen_korean: 겨울
  alternatives_korean:
  - 장마철
  - 우기
  - 비철
  lexicon: HALOT
  rationale: 이 단어는 겨울/비철을 가리킬 수 있으나, POB의 영어처럼 시적이고 직관적인 표준어 ‘겨울’로 옮기되, 비의 계절 의미는 각주로 보완했습니다.
- source_word: הַגֶּשֶׁם
  english_pob_choice: the rain
  chosen_korean: 비
  alternatives_korean:
  - 큰비
  - 장맛비
  lexicon: HALOT
  rationale: 정관사 있는 일반 명사이므로 간단히 ‘비’로 옮겨, 앞 절의 계절 이미지와 자연스럽게 대응되게 했습니다.
- source_word: חָלַף הָלַךְ לוֹ
  english_pob_choice: is over and gone
  chosen_korean: 그치고 사라졌습니다
  alternatives_korean:
  - 지나가 버렸습니다
  - 끝나고 없어졌습니다
  - 그쳐서 지나갔습니다
  lexicon: HALOT
  rationale: 두 동사의 점층적 의미를 살려 ‘그치고 사라졌습니다’로 옮겼습니다. ‘그치다’는 rain의 중단을, ‘사라지다’는 그 상태의 완전한 소멸을 담습니다.
theological_decisions:
- issue: 시적 병행에서 ‘겨울’과 ‘비’의 관계
  chosen_reading: ‘겨울’은 문자적 계절명으로 두되, 본문 각주에서 비철/우기의 뉘앙스를 밝혔습니다.
  alternative_readings:
  - ‘장마철’로 본문화
  - ‘우기’로 일반화
  rationale: 히브리어는 비의 계절을 가리킬 수 있으나, POB의 본문은 시적 직관을 살리는 방향을 유지하는 것이 더 적절하므로 본문에는 ‘겨울’을 두고 의미 범위를 주석으로 개방합니다.
  doctrine_reference: 시가서의 자연 이미지와 은유적 표현 원리
- issue: 발화의 공손성
  chosen_reading: 직접 화법이 아닌 서술형이므로 합쇼체로 일관했습니다.
  alternative_readings:
  - ‘보아라’ 식의 구어체
  - 경어가 약한 평서형
  rationale: 본문의 권고적 도입을 현대 표준어 합쇼체로 살리되, 원문의 주의 환기 효과는 유지했습니다.
  doctrine_reference: 현대 한국어 성경 문체 원칙
