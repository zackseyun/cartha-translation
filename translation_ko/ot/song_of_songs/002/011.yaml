  yaml_path: translation/ot/song_of_songs/002/011.yaml
  text: For look[a], the winter has passed; the rain is over and gone.
  footnotes:
  - marker: a
    text: Or 'the rainy season has passed.' The Hebrew term for 'winter' can refer more specifically to the season of rains.
