  - 애정
  lexicon: HALOT
  rationale: 문장 끝의 명사적 술어를 그대로 살려, 해석어를 덧붙이지 않고 기본 대응어 ‘사랑’을 유지했습니다.
theological_decisions:
- issue: ‘his banner over me was love’의 비유적 진술을 어떻게 보존할 것인가
  chosen_reading: 상징을 풀어 설명하지 않고, ‘그의 기는 내 위에 사랑이었습니다’로 이미지 자체를 유지했습니다.
  alternative_readings:
  - 그의 깃발은 나를 향한 사랑이었습니다
  - 사랑이 그의 깃발처럼 내 위에 있었습니다
  rationale: 본문은 연인의 보호·소유·표시를 암시하는 시적 비유이므로, 의미를 설명적으로 바꾸기보다 원문 이미지를 그대로 전달하는 편이 더 충실합니다.
  doctrine_reference: 성서 시가의 은유 보존
