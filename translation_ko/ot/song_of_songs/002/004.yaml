lexical_decisions:
- source_word: הֱבִיאַנִי
  english_pob_choice: He brought me
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 가져왔습니다
  - 인도하셨습니다
  lexicon: HALOT
  rationale: 히필 완료형의 사역적 이동을 살려, 시적 문맥에서 자연스러운 과거 서술인 ‘데려왔습니다’로 옮겼습니다.
- source_word: בֵּית הַיָּיִן
