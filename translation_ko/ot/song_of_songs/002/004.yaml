  english_pob_choice: banner
  chosen_korean: 기
  alternatives_korean:
  - 깃발
  - 군기
  - 표지
  lexicon: HALOT
  rationale: 문학적·상징적 이미지로서 ‘banner’에 대응하는 한국어로 ‘기’가 가장 간결하고 자연스럽습니다.
- source_word: אַהֲבָה
  english_pob_choice: love
  chosen_korean: 사랑
  alternatives_korean:
