base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/014.yaml
  text: My dove[a], in the clefts of the rock, in the hiding place of the cliff, let me see your appearance; let me hear your voice, for your voice is sweet[b], and your appearance is lovely.
  footnotes:
  - marker: a
    text: Or 'in the secret place of the steep path' / 'in the shelter of the precipice'; the Hebrew word translated 'cliff' is rare and may refer to a steep rocky ascent or ledge.
    reason: lexical_alternative
  - marker: b
    text: Or 'show me your face'; the Hebrew can refer more specifically to visible appearance or countenance.
    reason: lexical_alternative
translation:
  language: ko
  text: 바위 틈새와 절벽의 은밀한 곳에 있는 내 비둘기여[a], 내게 네 모습을 보여 주십시오[b]. 내게 네 목소리를 들려 주십시오. 네 목소리는 달콤하고 네 모습은 아름답습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가파른 오르막의 은밀한 곳’ 또는 ‘절벽의 피난처’. 여기의 히브리어 낱말은 드물며, 가파른 바위 오름길이나 바위턱을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 얼굴을 보여 주십시오’. 히브리어는 더 구체적으로 보이는 모습이나 얼굴을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנָתִי
  english_pob_choice: My dove
  chosen_korean: 나의 비둘기야
  alternatives_korean:
  - 나의 비둘기
  - 내 비둘기야
  lexicon: HALOT
  rationale: 애정 어린 호칭으로서 원문의 은유를 살리기 위해 '비둘기'를 직역하고, 한국어 시적 호명에 맞게 '-야'를 붙였습니다.
- source_word: בְּחַגְוֵי הַסֶּלַע
  english_pob_choice: in the clefts of the rock
  chosen_korean: 바위 틈새
  alternatives_korean:
  - 바위의 갈라진 틈
  - 바위의 틈
  lexicon: HALOT
  rationale: חגוי는 바위의 갈라진 틈, 움푹한 틈을 가리키므로 간결한 '바위 틈새'로 옮겨 지형 이미지를 보존했습니다.
- source_word: בְּסֵתֶר הַמַּדְרֵגָה
  english_pob_choice: in the hiding place of the cliff
  chosen_korean: 절벽의 은밀한 곳
  alternatives_korean:
  - 급한 비탈의 숨은 곳
  - 절벽의 숨은 곳
  - 가파른 길의 은밀한 곳
  lexicon: HALOT
  rationale: סתר의 '숨은 곳'과 מדרגה의 난해한 지형 뉘앙스를 함께 살리되, 과도한 해석을 피하면서 자연스러운 한국어로 '절벽의 은밀한 곳'을 택했습니다.
- source_word: מַרְאַיִךְ
  english_pob_choice: your appearance
  chosen_korean: 너의 모습
  alternatives_korean:
  - 너의 얼굴
  - 너의 외모
  - 너의 형상
  lexicon: HALOT
  rationale: 여기서는 얼굴보다 넓은 시각적 인상을 가리키므로, 병행구인 '목소리'와 대응되도록 '모습'으로 번역했습니다.
- source_word: עָרֵב
  english_pob_choice: sweet
  chosen_korean: 달콤하고
  alternatives_korean:
  - 즐겁고
  - 향기롭고
  - 기분 좋고
  lexicon: HALOT
  rationale: 시적·연애적 문맥에서 עָרֵב의 감각적 쾌감을 한국어로 자연스럽게 드러내기 위해 '달콤하다'를 택했습니다.
