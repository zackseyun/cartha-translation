id: SNG.2.3
reference: Song of Songs 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/תַפּ֨וּחַ֙ בַּ/עֲצֵ֣י הַ/יַּ֔עַר כֵּ֥ן דּוֹדִ֖/י בֵּ֣ין הַ/בָּנִ֑ים בְּ/צִלּ/וֹ֙ חִמַּ֣דְתִּי וְ/יָשַׁ֔בְתִּי וּ/פִרְי֖/וֹ מָת֥וֹק לְ/חִכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/003.yaml
  text: Like an apple tree among the trees of the forest[a], so is my beloved among the sons. In his shade I delighted to sit[b], and his fruit was sweet to my taste.
  footnotes:
  - marker: a
    text: 'Or ''among the young men.'' Hebrew: ''among the sons.'''
    reason: lexical_alternative
  - marker: b
    text: The precise species denoted by Hebrew תַּפּוּחַ is uncertain; traditionally 'apple tree.'
    reason: cultural_note
translation:
  language: ko
  text: 숲의 나무들 가운데 있는 사과나무[a]와 같이, 나의 사랑하는 이도 아들들 가운데 그렇습니다. 그늘 아래에서 내가 앉기를 바라며 기뻐하였고[b], 그의 열매는 내 입맛에 달았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젊은 남자들 가운데.’ 히브리어는 문자적으로 ‘아들들 가운데’입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 תַּפּוּחַ가 가리키는 정확한 식물은 확실하지 않지만, 전통적으로는 ‘사과나무’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּ/תַפּוּחַ
  english_pob_choice: apple tree
  chosen_korean: 사과나무
  alternatives_korean:
  - 살구나무
  - 감귤나무
  - 열매나무
  lexicon: HALOT
  rationale: 히브리어 תַּפּוּחַ의 정확한 식물은 논쟁적이지만, 시의 대비 효과를 살리는 가장 익숙한 대응은 사과나무입니다. 독자가 즉시 상상할 수 있는 이미지도 유지됩니다.
- source_word: בַּ/עֲצֵי הַ/יַּעַר
  english_pob_choice: among the trees of the forest
  chosen_korean: 숲의 나무들 가운데
  alternatives_korean:
  - 숲의 나무들 사이에
  - 숲나무들 가운데
  lexicon: HALOT
  rationale: 전체 숲 속의 여럿 가운데 하나가 두드러진다는 비교 구조를 살리기 위해 ‘~가운데’로 옮겼습니다.
- source_word: דּוֹדִ/י
  english_pob_choice: my beloved
  chosen_korean: 나의 사랑하는 이
  alternatives_korean:
  - 나의 연인
  - 내 사랑
  - 나의 사랑
  lexicon: HALOT
  rationale: 아가서의 친밀하고 사랑스러운 남성을 가리키는 표현을 한국어에서 너무 평면적이지 않으면서도 직설적으로 살리기 위해 ‘나의 사랑하는 이’로 옮겼습니다.
- source_word: בֵּין הַ/בָּנִ֑ים
  english_pob_choice: among the sons
  chosen_korean: 아들들 가운데
  alternatives_korean:
  - 젊은이들 가운데
  - 남자들 가운데
  - 아들들 사이에
  lexicon: HALOT
  rationale: 직역하면 ‘아들들’이지만, 시적 문맥에서는 다른 남성들 사이에서 두드러진 존재라는 뜻이므로 기본 형식을 보존한 채 한국어 어순에 맞춰 ‘아들들 가운데’로 옮겼습니다.
- source_word: בְּ/צִלּ/וֹ
  english_pob_choice: in his shade
  chosen_korean: 그늘 아래에서
  alternatives_korean:
  - 그의 그늘 아래에서
  - 그늘 아래
  lexicon: HALOT
  rationale: ‘그의’는 앞선 비유에서 이미 인칭화된 나무-사랑하는 이의 연결을 유지할 수 있지만, 한국어에서는 자연스러운 시적 표현을 위해 ‘그늘 아래에서’로 옮겼습니다.
- source_word: חִמַּדְתִּי
  english_pob_choice: I delighted to sit
  chosen_korean: 내가 앉기를 바라며 기뻐하였고
  alternatives_korean:
  - 앉는 것을 기뻐하였고
  - 앉기를 몹시 좋아하였고
  - 앉기를 간절히 바랐고
  lexicon: HALOT
  rationale: 동사는 단순한 ‘원하다’보다 애정 어린 기쁨과 바람을 함께 담습니다. 이어지는 ‘앉다’와 결합된 히브리어 구문을 반영해 ‘앉기를 바라며 기뻐하였고’로 옮겼습니다.
- source_word: וְ/יָשַׁ֔בְתִּי
  english_pob_choice: sat down
  chosen_korean: 앉기
  alternatives_korean:
  - 앉아
  - 앉았고
  - 머물렀고
  lexicon: HALOT
  rationale: 히브리어는 앞 동사와 연결된 결과 동작으로 ‘앉다’가 핵심입니다. 한국어에서는 앞절과 자연스럽게 이어지도록 명사형 ‘앉기’를 사용했습니다.
- source_word: וּ/פִרְי֖/וֹ
  english_pob_choice: his fruit
  chosen_korean: 그의 열매
  alternatives_korean:
  - 그 열매
  - 그 나무의 열매
  lexicon: HALOT
  rationale: 비유가 계속 이어지므로 소유 대명사를 살려 나무-사랑하는 이의 은유를 유지했습니다.
- source_word: לְ/חִכִּֽ/י
  english_pob_choice: to my taste
  chosen_korean: 내 입맛에
  alternatives_korean:
  - 내 입천장에
  - 내 입에
  - 내 입맛 속에
  lexicon: HALOT
  rationale: 히브리어 חֵךְ는 문자적으로 입천장/구개를 가리키지만, 한국어에서는 감각적 관용에 맞는 ‘입맛’이 가장 자연스럽고 시적입니다.
theological_decisions:
- issue: 아가서의 사랑 언어를 성적 완곡어로 약화하지 않고 그대로 살릴지 여부
  chosen_reading: 시적 사랑의 친밀함을 살리되, 과도한 노골화 없이 원문이 허용하는 범위 안에서 직설적으로 옮겼습니다.
  alternative_readings:
  - 보다 완곡한 번역
  - 관계적 은유로만 약화한 번역
  rationale: 이 절은 사랑하는 이를 향한 애정과 안식을 노래하는 시적 문맥입니다. 원문의 은유와 정서를 보존하는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: 아가서의 정경적 시적-지혜 문학 성격
- issue: ‘기뻐하였고’와 ‘앉기’의 결합 방식
  chosen_reading: ‘내가 앉기를 바라며 기뻐하였고’로 이어, 원문의 동사 연쇄를 한국어에서 자연스러운 한 문장으로 처리했습니다.
  alternative_readings:
  - ‘거기 앉는 것을 기뻐하였고’
  - ‘앉아 있는 것을 좋아하였고’
  rationale: 히브리어는 감정과 행위가 붙는 구조이므로, 한국어에서도 단순한 서술보다 동사의 결합을 통해 정서를 드러냈습니다.
  doctrine_reference: 문법-의미 대응의 직역 원칙
