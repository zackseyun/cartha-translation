  source_fidelity: 히브리어의 חִמַּדְתִּי וְיָשַׁבְתִּי는 ‘몹시 원하였다/기뻐하였다’와 ‘앉았다’라는 두 동작을 나란히 진술합니다. 현 번역의 ‘앉기를 바라며 기뻐하였고’는 실제로 앉았다는 두 번째 동작을 충분히 옮기지 못합니다. 또한 주석 표지가 해당 주석 내용과 서로 바뀌어 있습니다.
  naturalness: ‘숲의 나무들 가운데 있는 사과나무와 같이’는 자연스럽지만, 비교의 대응을 더 명료하게 하여 ‘숲의 나무들 가운데 있는 사과나무처럼’으로 다듬었습니다. ‘내 입맛에 달았습니다’도 자연스럽고 원문의 구개/맛의 감각을 잘 전달합니다.
  terminology: ‘내 사랑하는 이’는 דּוֹדִי의 시적·연인 관계의 의미를 적절히 보존합니다. ‘아들들’은 히브리어의 문자적 표현을 유지하되, ‘젊은 남자들’이라는 문맥상 대안을 주석으로 제시합니다. תַּפּוּחַ는 전통적 번역인 ‘사과나무’를 유지하고 식물 종의 불확실성을 주석으로 밝힙니다.
