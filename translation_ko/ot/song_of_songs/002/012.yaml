base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/012.yaml
  text: The blossoms appear in the land; the time of singing has come[a], and the voice of the turtledove is heard in our land.
  footnotes:
  - marker: a
    text: Or, 'the time of pruning has come.' The Hebrew זָמִיר can denote either 'singing/song' or 'pruning'; 'singing' is preferred here because it fits the parallel mention of the turtledove's voice.
    reason: lexical_alternative
translation:
  language: ko
  text: 꽃들이 땅에 나타나고, 노래할 때가 왔으며, 산비둘기의 소리가 우리 땅에서 들립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가지치기할 때가 왔습니다.’ 히브리어 זָמִיר는 ‘노래’ 또는 ‘가지치기’를 뜻할 수 있습니다. 여기서는 뒤에 나오는 산비둘기의 소리와 이루는 평행을 고려하여 ‘노래할 때’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּנִים
  english_pob_choice: the blossoms
  chosen_korean: 꽃들
  alternatives_korean:
  - 꽃봉오리들
  - 꽃들이 피어남
  lexicon: HALOT
  rationale: נִצָּנִים은 봄철에 드러나는 꽃망울/꽃을 가리키므로, 자연스러운 현대 한국어로는 ‘꽃들’이 가장 무난하며 계절 이미지를 잘 살립니다.
- source_word: נִרְאוּ
  english_pob_choice: appear
  chosen_korean: 피어 보이고
  alternatives_korean:
  - 나타나고
  - 보이고
  lexicon: HALOT
  rationale: 니팔형의 ‘드러나다/보이다’라는 뜻을 한국어 시적 표현으로 옮겨, 꽃이 실제로 눈에 들어오는 장면을 살렸습니다.
- source_word: הַזָּמִיר
  english_pob_choice: singing
  chosen_korean: 노래할 때
  alternatives_korean:
  - 노래의 때
  - 가지치기의 때
  lexicon: HALOT
  rationale: זָמִיר는 ‘노래’와 ‘가지치기’로 갈릴 수 있으나, 바로 뒤의 새소리와 평행을 이루는 점을 따라 ‘노래할 때’로 옮겼습니다.
- source_word: וְקוֹל הַתּוֹר
  english_pob_choice: and the voice of the turtledove
  chosen_korean: 산비둘기의 소리
  alternatives_korean:
  - 산비둘기의 음성
  - 도래새의 소리
  lexicon: HALOT
  rationale: תּוֹר는 일반 ‘비둘기’보다 구체적인 산비둘기를 가리키므로, 봄철 자연 묘사에 맞는 표준적 표현으로 옮겼습니다.
theological_decisions:
- issue: 시구의 평행 구조와 양가적 어휘 처리
  chosen_reading: ‘노래할 때’로 본문을 본문 그대로 옮기되, 뒤의 새소리와 연결되는 봄의 정경을 살렸습니다.
  alternative_readings:
  - ‘가지치기할 때’로 옮기는 해석
  - 각주에서 양가성을 직접 드러내는 번역
  rationale: 본문은 봄의 도래를 알리는 시적 병행법으로 읽히며, 문맥상 청각 이미지가 이어지므로 ‘노래’가 가장 자연스럽습니다. 다만 히브리어 어휘의 이중 가능성은 살리지 않으면 안 되므로 각주로 보존합니다.
  doctrine_reference: 시가서의 비유적·시적 언어 해석 원칙
