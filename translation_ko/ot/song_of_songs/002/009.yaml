source:
  edition: WLC
  text: דּוֹמֶ֤ה דוֹדִ/י֙ לִ/צְבִ֔י א֖וֹ לְ/עֹ֣פֶר הָֽ/אַיָּלִ֑ים הִנֵּה זֶ֤ה עוֹמֵד֙ אַחַ֣ר כָּתְלֵ֔/נוּ מַשְׁגִּ֨יחַ֙ מִן הַֽ/חֲלֹּנ֔וֹת מֵצִ֖יץ מִן הַֽ/חֲרַכִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/009.yaml
  text: My beloved is like a gazelle or a young stag[a]. Look—there he stands behind our wall, gazing through the windows[b], peering through the lattice.
  footnotes:
  - marker: a
    text: Or 'a fawn of the deer' for 'a young stag.' The Hebrew phrase refers to a young member of the deer family; the translation chooses the masculine-specific image to match the Hebrew wording and the beloved's portrayal.
    reason: lexical_alternative
  - marker: b
    text: '''Lattice'' refers to a screened or slatted opening in the wall or window area, not necessarily a separate modern window fixture.'
    reason: cultural_note
translation:
  language: ko
  text: 내 사랑하는 이가 가젤이나 어린 수사슴 같구나[a]. 보십시오, 그가 우리 담 뒤에 서서 창문으로 살피고[b], 격자 사이로 엿보고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가젤’은 צְבִי의 현대적 대응어이고, ‘어린 수사슴’은 히브리어의 두 번째 비교 이미지(עֹפֶר הָאַיָּלִים)를 남성적으로 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘격자’는 창문과 벽의 한 부분에 있는 틀 또는 살창을 가리키며, 반드시 현대식 독립 창호를 뜻하지는 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹמֶה
  english_pob_choice: is like
  chosen_korean: 같구나
  alternatives_korean:
  - 비슷합니다
  - ~와 같습니다
  lexicon: HALOT
  rationale: 비교를 나타내는 서술형 표현으로, 시적 문맥에서 자연스럽고 원문의 유사성 표현을 살립니다.
- source_word: דוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이
  alternatives_korean:
  - 내 연인
  - 내 사랑
  lexicon: HALOT
  rationale: 아가서의 애정 어린 호칭을 살리면서도 현대 한국어에서 지나치게 직설적인 성적 뉘앙스를 피합니다.
- source_word: לִצְבִי / לְעֹפֶר הָאַיָּלִים
  english_pob_choice: a gazelle or a young stag
  chosen_korean: 가젤이나 어린 수사슴
  alternatives_korean:
  - 영양이나 어린 사슴
  - 가젤이나 새끼 사슴
  lexicon: HALOT
  rationale: צְבִי와 עֹפֶר הָאַיָּלִים의 두 동물 이미지를 구분해 살리되, 영어 POB의 수사슴 이미지에 맞춰 수컷성을 드러냈습니다.
- source_word: מַשְׁגִּיחַ מִן הַחֲלּוֹנוֹת / מֵצִיץ מִן הַחֲרַכִּים
  english_pob_choice: gazing through the windows, peering through the lattice
  chosen_korean: 창문으로 살피고, 격자 사이로 엿보고
  alternatives_korean:
  - 창문 너머로 바라보고, 격자 사이로 들여다보고
  - 창문으로 응시하고, 격자 사이로 엿보고
  lexicon: HALOT
  rationale: 중첩된 동작을 두 동사로 나누어 시적 병행을 보존했고, מַשְׁגִּיחַ는 단순히 '보다'보다 주의 깊게 살피는 뜻을 반영했습니다.
theological_decisions:
- issue: 연인의 호칭과 시적 이미지의 직역 정도
  chosen_reading: 본문의 에로틱한 시적 이미지를 완화하지 않고 그대로 살리되, 한국어에서 수용 가능한 문학적 표현으로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 표현으로 바꾸기
  - 전통적 교회 어휘로 순화하기
  rationale: 아가서는 원문의 비유와 관찰 장면 자체가 의미를 형성하므로, 이미지의 강도를 약화하지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 문학적 정직성 및 본문-의미 보존 원칙
