- from: 내 사랑하는 이가 가젤이나 어린 수사슴 같구나[a]. 보십시오, 그가 우리 담 뒤에 서서 창문으로 살피고[b], 격자 사이로 엿보고 있습니다.
  to: 내 사랑하는 이는 가젤이나 어린 수사슴과 같습니다[a]. 보십시오, 그가 우리 담장 뒤에 서서 창문으로 바라보고, 격자 사이로 엿봅니다[b].
