id: SNG.2.16
reference: Song of Songs 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דּוֹדִ֥/י לִ/י֙ וַ/אֲנִ֣י ל֔/וֹ הָ/רֹעֶ֖ה בַּ/שּׁוֹשַׁנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/016.yaml
  text: My beloved is mine[c][b][a], and I am his—he who grazes among the lilies.
  footnotes:
  - marker: a
    text: Or 'my lover' for 'my beloved.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew participle can also be rendered 'the one who shepherds' or simply 'feeding among the lilies.'
    reason: lexical_alternative
  - marker: c
    text: The exact flower meant by 'lilies' is uncertain; it may refer more broadly to a showy blossom.
    reason: cultural_note
translation:
  language: ko
  text: 내 사랑하는 이가 내게 속하고, 나는 그에게 속합니다. 그는 백합들 사이에서 먹이를 뜯는 이입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דּוֹד는 여기서 ‘연인’보다 더 넓게 사랑하는 상대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 분사 הָרֹעֶה는 ‘먹이다’, ‘풀을 뜯다’, ‘목양하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: שׁוֹשַׁנִּים은 보통 ‘백합들’로 옮기지만, 정확한 꽃의 종류는 확실하지 않을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이
  alternatives_korean:
  - 내 연인
  - 내 사랑하는 사람
  lexicon: HALOT
  rationale: 아가서의 דּוֹד는 단순한 성적 뉘앙스보다 친밀한 사랑의 상대를 가리키므로, 직역적이면서도 자연스러운 ‘내 사랑하는 이’로 옮겨 애정과 관계성을 살렸습니다.
- source_word: לִי / וַאֲנִי לוֹ
  english_pob_choice: is mine / and I am his
  chosen_korean: 내게 속하고 / 나는 그에게 속합니다
  alternatives_korean:
  - 내 것입니다 / 그는 내 것입니다
  - 나는 그의 것입니다
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 표현을 한국어의 ‘속하다’로 살려 상호적인 소속 관계를 분명하게 드러냈습니다.
- source_word: הָרֹעֶה
  english_pob_choice: he who grazes
  chosen_korean: 먹이를 뜯는 이
  alternatives_korean:
  - 목양하는 이
  - 풀을 뜯는 이
  - 목자
  lexicon: HALOT
  rationale: 이 분사형은 ‘먹이다/풀 뜯다/목양하다’의 뜻을 가지지만, 여기서는 꽃들 사이를 거니는 이미지에 더 가까워서 ‘먹이를 뜯는 이’로 옮겨 분사적·시적 느낌을 유지했습니다.
- source_word: בַּשּׁוֹשַׁנִּים
  english_pob_choice: among the lilies
  chosen_korean: 백합들 사이에서
  alternatives_korean:
  - 백합들 가운데
  - 꽃들 사이에서
  lexicon: HALOT
  rationale: שׁוֹשַׁנִּים은 일반적으로 ‘백합’으로 옮기되, 위치 관계는 한국어에서 더 자연스러운 ‘사이에서’로 풀어 시적 장면을 살렸습니다.
theological_decisions:
- issue: 사랑의 소유 표현을 지나치게 물질적 소유로 완화할지 여부
  chosen_reading: ‘내게 속하고 / 그에게 속합니다’로 상호 소속을 강조했습니다.
  alternative_readings:
  - ‘내 것입니다 / 그는 내 것입니다’
  - ‘나의 소유입니다’
  rationale: 아가서의 표현은 소유라기보다 사랑 안의 상호 귀속을 말하므로, 원문의 긴장과 친밀성을 보존하는 쪽을 택했습니다.
  doctrine_reference: 아가서의 언약적·연합적 사랑 표현
- issue: הָרֹעֶה를 ‘목자’로 해석할지 ‘풀을 뜯는 이’로 볼지
  chosen_reading: 문맥상 목회적 직분보다 목가적 이미지가 우선하므로 ‘먹이를 뜯는 이’로 옮겼습니다.
  alternative_readings:
  - ‘목자’
  - ‘목양하는 이’
  - ‘풀을 뜯는 이’
  rationale: 히브리어 분사 자체는 여러 뜻을 가질 수 있으나, 여기서는 꽃들 사이의 시적 배경이 분명하므로 과도한 신학적 직분 해석을 피했습니다.
  doctrine_reference: 시적 문맥 우선 원칙
