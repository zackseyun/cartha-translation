- source_word: בַּשּׁוֹשַׁנִּים
  english_pob_choice: among the lilies
  chosen_korean: 백합들 사이에서
  alternatives_korean:
  - 백합들 가운데
  - 꽃들 사이에서
  lexicon: HALOT
  rationale: שׁוֹשַׁנִּים은 일반적으로 ‘백합’으로 옮기되, 위치 관계는 한국어에서 더 자연스러운 ‘사이에서’로 풀어 시적 장면을 살렸습니다.
theological_decisions:
- issue: 사랑의 소유 표현을 지나치게 물질적 소유로 완화할지 여부
  chosen_reading: ‘내게 속하고 / 그에게 속합니다’로 상호 소속을 강조했습니다.
  alternative_readings:
  - ‘내 것입니다 / 그는 내 것입니다’
  - ‘나의 소유입니다’
  rationale: 아가서의 표현은 소유라기보다 사랑 안의 상호 귀속을 말하므로, 원문의 긴장과 친밀성을 보존하는 쪽을 택했습니다.
  doctrine_reference: 아가서의 언약적·연합적 사랑 표현
- issue: הָרֹעֶה를 ‘목자’로 해석할지 ‘풀을 뜯는 이’로 볼지
  chosen_reading: 문맥상 목회적 직분보다 목가적 이미지가 우선하므로 ‘먹이를 뜯는 이’로 옮겼습니다.
  alternative_readings:
  - ‘목자’
  - ‘목양하는 이’
  - ‘풀을 뜯는 이’
  rationale: 히브리어 분사 자체는 여러 뜻을 가질 수 있으나, 여기서는 꽃들 사이의 시적 배경이 분명하므로 과도한 신학적 직분 해석을 피했습니다.
  doctrine_reference: 시적 문맥 우선 원칙
