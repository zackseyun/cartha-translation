  source_fidelity: 첫 두 절은 히브리어의 상호 소유·귀속 표현을 충실히 옮겼습니다. 그러나 הָרֹעֶה를 사람인 사랑하는 이가 직접 ‘먹이를 뜯는’ 것으로 옮긴 것은 한국어에서 그가 동물처럼 먹이를 먹는다는 뜻으로 들립니다. 이 동사는 여기서 목자가 양 떼를 먹이거나 풀을 뜯기게 하는 목가적 행위를 가리키는 것으로 옮기는 편이 안전합니다.
  naturalness: ‘내 사랑하는 이는 내게 속하고, 나는 그에게 속합니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘먹이를 뜯는 이’는 사람 주어와 결합할 때 부자연스럽고 의미가 어긋나므로 ‘양 떼를 먹이는 이’로 고쳤습니다.
  terminology: ‘내 사랑하는 이’, ‘속하다’, ‘백합들’은 시적 문맥과 한국어 성경 문체에 무리 없이 맞습니다. ‘양 떼’는 히브리어에 명시된 목적어는 아니지만 רעה의 목양 용법을 한국어에서 자연스럽게 구현하는 최소한의 보충입니다. 꽃의 정확한 식물학적 동정이 불확실하다는 주석도 유지합니다.
