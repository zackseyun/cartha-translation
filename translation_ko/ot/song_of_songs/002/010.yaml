base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/010.yaml
  text: My beloved answered and said to me, “Rise up, my love, my beautiful one, and come away.”
translation:
  language: ko
  text: 내 사랑, 내 아름다운 이여, 일어나서 함께 가십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사들은 이어지는 명령의 뉘앙스를 지니므로, 한국어는 ‘일어나서… 가십시오’로 자연스럽게 풀었습니다.
    reason: source_note
lexical_decisions:
- source_word: דוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑
  alternatives_korean:
  - 내 사랑하는 이
  - 내 연인
  - 내 사랑하는 사람
  lexicon: HWH/Hebrew דוד
  rationale: 화자의 친밀한 애정 표현으로서 ‘사랑’이 가장 자연스럽고, 성경적 서정성을 해치지 않으면서도 과도하게 연애소설화하지 않습니다.
- source_word: רַעְיָתִי
  english_pob_choice: my love
  chosen_korean: 내 사랑
  alternatives_korean:
  - 내 연인
  - 내 짝
  - 내 친구
  lexicon: HWH/Hebrew רֵעָה/רַעְיָה
  rationale: 같은 구절 안에서 반복되는 호칭이므로 한국어도 동일하게 ‘내 사랑’으로 처리해 반복적 애정 호소를 보존했습니다.
- source_word: יָפָתִי
  english_pob_choice: my beautiful one
  chosen_korean: 내 아름다운 이여
  alternatives_korean:
  - 내 아름다운 사람
  - 내 예쁜 이여
  - 내 아름다운 사랑
  lexicon: HWH/Hebrew יפה
  rationale: ‘아름다운’의 형용사 성격을 살리되, 직접 부름을 드러내는 ‘이여’를 붙여 시적 호칭의 어조를 유지했습니다.
- source_word: קוּמִי ... וּלְכִי
  english_pob_choice: Rise up ... and come away
  chosen_korean: 일어나서 함께 가십시오
  alternatives_korean:
  - 일어나십시오, 함께 가십시오
  - 일어나서 나와 함께 가십시오
  - 일어나서 오십시오
  lexicon: HWH/Hebrew קום / הלך
  rationale: 동작의 연속성을 살려 ‘일어나서’와 ‘함께 가십시오’로 옮겼고, ‘come away’의 이탈·동행 뉘앙스를 한국어로 과장 없이 전달했습니다.
theological_decisions:
- issue: 연서체 직접화법의 존칭 수준
  chosen_reading: 말하는 대상은 사랑하는 이이므로 존칭형 명령으로 옮기되, 시적 친밀감이 살아 있도록 과도하게 격식화하지 않았습니다.
  alternative_readings:
  - 반말형 초대(‘일어나라, 내 사랑…’)
  - 더 완곡한 초대(‘일어나 함께 갑시다’)
  rationale: 아가의 연서체는 친밀한 직접화법이 핵심이므로, 한국어에서는 예의체를 유지하되 관계의 친밀함을 훼손하지 않는 균형이 필요합니다.
  doctrine_reference: 아가서의 시적 화자-연인 대화 구조
