  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֣וֹל דּוֹדִ֔/י הִנֵּה זֶ֖ה בָּ֑א מְדַלֵּג֙ עַל הֶ֣/הָרִ֔ים מְקַפֵּ֖ץ עַל הַ/גְּבָעֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/008.yaml
  text: The sound of my beloved! Look[a], here he comes, leaping over the mountains, bounding over the hills.
  footnotes:
  - marker: a
    text: Or 'The voice of my beloved!'; Hebrew qol can mean either 'sound' or 'voice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 사랑하는 이의 소리입니다! 보십시오, 그가 산들을 뛰어넘어 오고, 언덕들을 건너뛰고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 사랑하는 이의 음성입니다!’; 히브리어 qol은 ‘소리’와 ‘음성/목소리’ 둘 다 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  english_pob_choice: The sound of
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: HALOT
  rationale: קוֹל은 이곳에서 ‘소리’와 ‘목소리/음성’ 둘 다 가능하지만, 뒤이어지는 장면이 말이 아니라 도착의 움직임을 그리므로 청각적 인상을 살린 ‘소리’가 더 자연스럽습니다.
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이
  alternatives_korean:
  - 내 사랑하는 사람
  - 내 연인
  lexicon: HALOT
  rationale: 아가서의 דּוֹדִי는 남자 연인을 가리키는 애정 표현이므로, 직설적인 ‘연인’보다 문학적이고 관계적 뉘앙스를 유지하는 ‘내 사랑하는 이’로 옮겼습니다.
- source_word: הִנֵּה זֶה בָּא
  english_pob_choice: Look, here he comes
  chosen_korean: 보십시오, 그가…오고 있습니다
  alternatives_korean:
  - 보라, 그가 온다
  - 여기 그가 옵니다
  lexicon: HALOT
  rationale: הִנֵּה זֶה בָּא의 지시성과 생생함을 살리기 위해 현대 한국어에서 자연스러운 주의 환기 표현인 ‘보십시오’와 진행형 ‘오고 있습니다’를 사용했습니다.
- source_word: מְדַלֵּג / מְקַפֵּץ
  english_pob_choice: leaping ... bounding
  chosen_korean: 뛰어넘어 오고 / 건너뛰고 있습니다
  alternatives_korean:
  - 도약하며 오고 / 뛰며 오고 있습니다
  - 뛰어오고 / 뛰어오르고 있습니다
  lexicon: HALOT
  rationale: 두 분사는 유사하지만 시적 평행을 이루므로 각각 다른 동작어를 살려 반복감을 유지했습니다. ‘뛰어넘다’는 산을 넘는 동작을, ‘건너뛰다’는 언덕들을 가로지르는 경쾌한 움직임을 나타냅니다.
theological_decisions:
- issue: 아가서의 연애시적 직접성
  chosen_reading: ‘내 사랑하는 이’와 생생한 동작 묘사를 그대로 살려, 우회적으로 영적 비유로만 축소하지 않았습니다.
  alternative_readings:
  - 영적으로 완화한 번역
  - 전통적 교회어휘로 일반화한 번역
  rationale: 원문은 감각적·시적 사랑 노래로서의 직접성을 갖고 있으므로, 본문의 문학 장르를 보존하는 것이 해석상 더 충실합니다.
  doctrine_reference: 성경 해석의 장르 보존 원칙
