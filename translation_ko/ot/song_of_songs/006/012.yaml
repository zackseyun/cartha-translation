  rationale: 히브리어 구문이 매우 난해하여 POB가 주석으로 대안 독법을 제시하므로, 본문에는 가장 자연스러운 의미를 두고 해석 가능성은 주석으로 남기는 것이 적절합니다.
  doctrine_reference: 본문비평/주해적 불확실성
