source:
  edition: WLC
  text: לֹ֣א יָדַ֔עְתִּי נַפְשִׁ֣/י שָׂמַ֔תְ/נִי מַרְכְּב֖וֹת עַמִּ/י נָדִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/012.yaml
  text: Before I knew it[b][a], my soul set me among the chariots of my noble people.
  footnotes:
  - marker: a
    text: Or 'my soul set me among the chariots of my princely people'; Hebrew is difficult, and 'myself' or 'my heart' are also possible for 'my desire.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood as 'the chariots of Ammi-nadib,' taking the words as a proper name rather than 'my noble people.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 깨닫기도 전에, 내 영혼이 나를 내 고귀한 백성의 병거들 가운데에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 영혼이 내 왕자다운 백성의 병거들 가운데에 두었습니다'로도 볼 수 있습니다. 히브리어 본문은 어렵고, '내 자신'이나 '내 마음'이 '내 영혼' 대신 가능하다는 해석도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 '암미나답의 병거들'이라는 고유명사로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדַעְתִּי
  english_pob_choice: Before I knew it
  chosen_korean: 내가 깨닫기도 전에
  alternatives_korean:
  - 내가 알기도 전에
  - 내가 모르고 있는 사이에
  lexicon: HALOT
  rationale: 직역하면 '내가 알지 못했다'이지만, 문맥상 갑작스러운 전개를 나타내는 관용을 살려 현대 한국어에서 자연스러운 '깨닫기도 전에'로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 나 자신
  - 내 마음
  - 내 욕망
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 신체적 '영혼'보다는 내적 자아를 가리키는 시적 용법으로 읽히므로, POB의 문맥적 선택을 따라 '내 영혼'으로 옮겼습니다.
- source_word: מַרְכְּבֹת
  english_pob_choice: the chariots
  chosen_korean: 병거들
  alternatives_korean:
  - 전차들
  - 수레들
  lexicon: HALOT
  rationale: 히브리어 מַרְכָּבָה의 기본 뜻을 반영해 '병거들'로 옮기되, 시적 복수성을 살렸습니다.
- source_word: נָדִיב
  english_pob_choice: my noble people
  chosen_korean: 고귀한 백성
  alternatives_korean:
  - 고결한 백성
  - 왕족 같은 백성
  - 귀족 같은 백성
  lexicon: HALOT
  rationale: נָדִיב은 '고귀한/귀족의/왕자다운' 뜻을 가질 수 있어, 문맥상 집단의 품격을 드러내는 '고귀한 백성'으로 간결하게 처리했습니다.
theological_decisions:
- issue: 문장 끝의 נָדִיב־을 고유명사로 볼 가능성
  chosen_reading: 본문은 기본적으로 '내 고귀한 백성'으로 읽되, 고유명사 '암미나답의 병거들'이라는 대안도 열어 둡니다.
  alternative_readings:
  - '''암미나답의 병거들''로 보는 고유명사 해석'
  rationale: 히브리어 구문이 매우 난해하여 POB가 주석으로 대안 독법을 제시하므로, 본문에는 가장 자연스러운 의미를 두고 해석 가능성은 주석으로 남기는 것이 적절합니다.
  doctrine_reference: 본문비평/주해적 불확실성
