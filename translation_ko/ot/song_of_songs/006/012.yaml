- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 나 자신
  - 내 마음
  - 내 욕망
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 신체적 '영혼'보다는 내적 자아를 가리키는 시적 용법으로 읽히므로, POB의 문맥적 선택을 따라 '내 영혼'으로 옮겼습니다.
- source_word: מַרְכְּבֹת
  english_pob_choice: the chariots
  chosen_korean: 병거들
  alternatives_korean:
  - 전차들
  - 수레들
  lexicon: HALOT
  rationale: 히브리어 מַרְכָּבָה의 기본 뜻을 반영해 '병거들'로 옮기되, 시적 복수성을 살렸습니다.
- source_word: נָדִיב
  english_pob_choice: my noble people
  chosen_korean: 고귀한 백성
  alternatives_korean:
  - 고결한 백성
  - 왕족 같은 백성
  - 귀족 같은 백성
  lexicon: HALOT
  rationale: נָדִיב은 '고귀한/귀족의/왕자다운' 뜻을 가질 수 있어, 문맥상 집단의 품격을 드러내는 '고귀한 백성'으로 간결하게 처리했습니다.
theological_decisions:
