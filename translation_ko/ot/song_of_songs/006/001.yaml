  text: Where has your beloved gone[a], most beautiful among women? Where has your beloved turned, that we may seek him with you?
  footnotes:
  - marker: a
    text: Or 'Where has your beloved turned aside?' The verb can suggest changing direction or turning away, not merely physical movement.
