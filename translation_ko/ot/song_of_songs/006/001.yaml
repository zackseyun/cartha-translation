translation:
  language: ko
  text: 당신의 사랑하는 이는 어디로 갔습니까, 여인들 가운데서 가장 아름다운 이여? 당신의 사랑하는 이는 어느 쪽으로 돌아섰습니까[a]? 우리가 당신과 함께 그를 찾겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘돌아서다’ 또는 ‘방향을 바꾸다’라는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
