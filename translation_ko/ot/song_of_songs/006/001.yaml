  terminology: דּוֹדֵךְ의 ‘당신의 사랑하는 이’는 성별을 불필요하게 덧붙이지 않고 시적 애정 표현을 유지합니다. פָּנָה에 대한 주석은 ‘가다’와의 단순 대립보다 ‘돌아서다/방향을 바꾸다’라는 방향 전환의 가능성을 밝혀야 합니다.
