  text: אָ֚נָה הָלַ֣ךְ דּוֹדֵ֔/ךְ הַ/יָּפָ֖ה בַּ/נָּשִׁ֑ים אָ֚נָה פָּנָ֣ה דוֹדֵ֔/ךְ וּ/נְבַקְשֶׁ֖/נּוּ עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/001.yaml
  text: Where has your beloved gone[a], most beautiful among women? Where has your beloved turned, that we may seek him with you?
  footnotes:
  - marker: a
    text: Or 'Where has your beloved turned aside?' The verb can suggest changing direction or turning away, not merely physical movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 사랑하는 이가 어디로 갔습니까, 여자들 가운데서 가장 아름다운 분이여? 당신의 사랑하는 이가 어디로 돌아섰습니까? 우리가 당신과 함께 그를 찾으려 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 פָּנָה는 단순히 ‘가다’뿐 아니라 ‘돌아서다, 방향을 바꾸다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֚נָה
  english_pob_choice: Where
  chosen_korean: 어디로
  alternatives_korean:
  - 어디에
  - 어느 곳으로
  lexicon: HALOT
  rationale: 목적지나 향한 방향을 묻는 간단한 의문사로 처리해, 시적이면서도 현대 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: דּוֹדֵ֔ךְ
  english_pob_choice: your beloved
  chosen_korean: 당신의 사랑하는 이
  alternatives_korean:
  - 당신의 사랑하는 사람
  - 당신의 연인
  lexicon: HALOT
  rationale: פֹּ에틱한 애정 표현을 살리면서도 한국어에서 성중립적으로 읽힐 수 있는 표현을 택해, 본문의 정서적 친밀감을 유지했습니다.
- source_word: הַ/יָּפָ֖ה בַּ/נָּשִׁ֑ים
  english_pob_choice: most beautiful among women
  chosen_korean: 여자들 가운데서 가장 아름다운 분이여
  alternatives_korean:
  - 여인들 가운데서 가장 아름다운 분이여
  - 여자들 중 가장 아름다운 분이여
  lexicon: HALOT
  rationale: 히브리어의 비교적 최상급 관용구를 그대로 살려 ‘가장 아름다운’으로 옮기고, 직접 호칭 느낌을 살리기 위해 종결을 호격형으로 처리했습니다.
- source_word: פָּנָ֣ה
  english_pob_choice: has turned
  chosen_korean: 돌아섰습니까
  alternatives_korean:
  - 돌아갔습니까
  - 향하였습니까
  lexicon: HALOT
  rationale: 단순 이동보다 방향 전환의 뉘앙스를 살려 ‘돌아서다’로 옮겨, 영어 주석이 지적한 방향 전환 가능성을 반영했습니다.
- source_word: וּ/נְבַקְשֶׁ֖/נּוּ
  english_pob_choice: that we may seek him
  chosen_korean: 우리가 … 그를 찾으려 합니다
  alternatives_korean:
  - 우리가 그를 찾을 수 있도록
  - 우리가 그를 찾겠습니다
  lexicon: HALOT
  rationale: 목적/의도 관계를 한국어의 계획 표현으로 자연스럽게 풀어, 질문 뒤에 이어지는 공동 탐색의 뜻을 드러냈습니다.
theological_decisions:
- issue: 애정 표현의 음역 수준
  chosen_reading: 본문의 דּוֹדֵךְ를 전통적 교회어 ‘사랑하는 이’보다 조금 더 구어적인 ‘사랑하는 이’로 옮겨, 시적 친밀감과 직접성을 유지했습니다.
  alternative_readings:
  - 사랑하는 사람
  - 연인
  rationale: 아가의 화자 간 친밀한 대화를 현대 한국어로도 과도하게 완곡하지 않게 전달하기 위한 선택입니다.
  doctrine_reference: 아가서의 시적·문학적 장르 인식
