    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפֶלַח
  english_pob_choice: like a slice
  chosen_korean: ~한 조각 같습니다
  alternatives_korean:
  - ~처럼 잘라낸 조각 같습니다
  - ~의 한 조각 같습니다
  lexicon: HALOT
  rationale: כְּ의 비교와 פֶלַח의 ‘나뉜 조각’ 이미지를 살려, 현대 한국어에서 자연스러운 ‘한 조각’으로 옮겼습니다.
- source_word: רַקָּתֵךְ
  english_pob_choice: your cheeks
  chosen_korean: 두 뺨
  alternatives_korean:
  - 뺨
  - 관자놀이
  lexicon: HALOT
  rationale: 이 시적 문맥에서는 얼굴의 아름다움을 드러내는 부위로서 한국어 독자가 즉시 떠올릴 수 있는 ‘두 뺨’이 가장 자연스럽습니다.
- source_word: מִבַּעַד לְצַמָּתֵךְ
  english_pob_choice: behind your veil
  chosen_korean: 베일 뒤
  alternatives_korean:
  - 머리칼 사이로
  - 당신의 머리칼 뒤
  lexicon: HALOT
  rationale: מִבַּעַד은 ‘~뒤에/사이로’의 가림을 나타내므로, 영어 POB의 기본 독해를 따라 ‘베일 뒤’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: לְצַמָּתֵךְ의 의미가 ‘베일’인지 ‘머리칼/곱슬머리’인지 모호함
  chosen_reading: 본문은 기본적으로 ‘베일’로 번역하되, 대안 독해 가능성을 주석으로 남깁니다.
  alternative_readings:
  - 머리칼 뒤
  - 곱슬머리 사이로
  rationale: 영어 POB가 본문에서는 veil을 채택하고 각주로 hair 해석을 보존하므로, 한국어도 본문 의미를 분명히 하면서 대안 해석을 삭제하지 않도록 했습니다.
  doctrine_reference: 본문 비평/어휘 해석
