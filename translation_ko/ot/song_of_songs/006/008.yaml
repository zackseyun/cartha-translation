translation:
  language: ko
  text: 왕비가 예순이고 후궁이 여든이며, 젊은 여인들은 셀 수 없이 많습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젊은 여인들’은 히브리어 עֲלָמוֹת의 넓은 뜻을 반영한 것입니다. 이 말은 ‘처녀들’ 또는 ‘아가씨들’로도 옮길 수 있으나, 그 자체로 반드시 처녀를 뜻하지는 않습니다.
    reason: lexical_alternative
