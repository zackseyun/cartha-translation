  yaml_path: translation/ot/song_of_songs/006/008.yaml
  text: There are sixty queens and eighty concubines[a], and young women without number.
  footnotes:
  - marker: a
    text: Or 'maidens'; possibly 'virgins.' The Hebrew עֲלָמוֹת refers broadly to young women and does not by itself require the more specific sense 'virgins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕비가 예순 명이고 후궁이 여든 명이며, 젊은 여자는 셀 수 없이 많습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젊은 여자’는 히브리어 עֲלָמוֹת의 넓은 뜻을 반영한 것으로, 여기서 반드시 ‘처녀’를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשִּׁים הֵמָּה
  english_pob_choice: There are sixty
  chosen_korean: 예순 명이
  alternatives_korean:
  - 예순이
  - 예순 명 있습니다
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서는 존재 표현으로 자연스럽게 살리되, 사람을 세는 문맥이므로 ‘명’을 보탰습니다.
- source_word: מְּלָכ֔וֹת
  english_pob_choice: queens
  chosen_korean: 왕비
  alternatives_korean:
  - 여왕
  - 왕후
  lexicon: HALOT
  rationale: 궁정적·후궁적 문맥에서 ‘여왕’보다 왕의 배우자/궁중 여인을 뜻하는 ‘왕비’가 더 정확하고 한국어 독자에게도 자연스럽습니다.
- source_word: פִּֽילַגְשִׁ֑ים
  english_pob_choice: concubines
  chosen_korean: 후궁
  alternatives_korean:
  - 첩
  - 소실
  lexicon: HALOT
  rationale: 지위가 낮은 정식 배우자를 가리키는 성경적 용례에서 ‘후궁’이 가장 표준적이고 문맥에도 맞습니다.
- source_word: עֲלָמ֖וֹת
  english_pob_choice: young women
  chosen_korean: 젊은 여자
  alternatives_korean:
  - 처녀
  - 아가씨
  - 젊은 여인
  lexicon: HALOT
  rationale: 단어 자체는 젊은 미혼 여성을 넓게 가리키므로, 원문의 범위를 넘는 ‘처녀’는 피하고 ‘젊은 여자’로 옮겼습니다.
- source_word: אֵין מִסְפָּר
  english_pob_choice: without number
  chosen_korean: 셀 수 없이 많습니다
  alternatives_korean:
