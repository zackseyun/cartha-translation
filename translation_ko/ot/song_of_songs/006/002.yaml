source:
  edition: WLC
  text: דּוֹדִ/י֙ יָרַ֣ד לְ/גַנּ֔/וֹ לַ/עֲרוּג֖וֹת הַ/בֹּ֑שֶׂם לִ/רְעוֹת֙ בַּ/גַּנִּ֔ים וְ/לִ/לְקֹ֖ט שֽׁוֹשַׁנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/002.yaml
  text: My beloved has gone down to his garden[a], to the beds of spices[b], to graze in the gardens and to gather lilies.
  footnotes:
  - marker: a
    text: Or 'to feed' or 'to pasture.' The Hebrew verb can denote grazing or feeding and may intentionally preserve pastoral ambiguity.
    reason: lexical_alternative
  - marker: b
    text: The exact flower denoted by the Hebrew may be uncertain; traditionally, 'lilies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 사랑하는 이가 자기 정원[a] 곧 향료의 밭[b]으로 내려갔습니다. 그는 정원들에서 풀을 뜯고 백합꽃을 모으러 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹이다’, ‘목초를 먹이다’. 히브리어 동사는 풀을 뜯다 또는 먹이다를 뜻할 수 있으며, 목가적 모호성을 의도적으로 남길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어가 가리키는 정확한 꽃의 종류는 확실하지 않지만, 전통적으로 ‘백합’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  english_pob_choice: My beloved
  chosen_korean: 내 사랑하는 이
  alternatives_korean:
  - 내 사랑하는 사람
  - 내 연인
  lexicon: HALOT
  rationale: דּוֹדִי는 아가서에서 화자의 사랑하는 대상을 가리키므로, 현대 한국어에서 관계의 애정과 서정성을 살리는 ‘내 사랑하는 이’로 옮겼습니다.
- source_word: לְגַנּוֹ
  english_pob_choice: to his garden
  chosen_korean: 자기 정원
  alternatives_korean:
  - 그의 정원으로
  - 그 정원
  lexicon: HALOT
  rationale: 방향을 나타내는 לְ를 자연스럽게 살리면서 소유 관계를 유지하려고 ‘자기 정원’으로 옮겼습니다.
- source_word: לַעֲרוּגוֹת הַבֹּשֶׂם
  english_pob_choice: to the beds of spices
  chosen_korean: 향료의 밭
  alternatives_korean:
  - 향료 밭
  - 향료의 이랑들
  lexicon: HALOT
  rationale: עֲרוּגוֹת는 재배된 구획을 가리키므로 ‘밭’으로 넓게 옮기되, בֹּשֶׂם의 향기로운 식물성 이미지를 살려 ‘향료의 밭’으로 표현했습니다.
- source_word: לִרְעוֹת
  english_pob_choice: to graze
  chosen_korean: 풀을 뜯고
  alternatives_korean:
  - 풀을 뜯으며
  - 목초를 먹으며
  lexicon: HALOT
  rationale: רעה의 기본적인 ‘먹이다/풀을 뜯다’ 의미를 살려, 시적 장면에서 실제 동작이 드러나도록 ‘풀을 뜯고’로 옮겼습니다.
- source_word: שׁוֹשַׁנִּים
  english_pob_choice: lilies
  chosen_korean: 백합꽃
  alternatives_korean:
  - 백합
  - 백합들
  lexicon: HALOT
  rationale: 정확한 식물 종은 불확실하지만 전통적으로 ‘lilies’로 옮겨 온 점을 따라, 한국어 성경에서 익숙한 ‘백합꽃’으로 번역했습니다.
theological_decisions:
- issue: 시적 동사 רעה(‘to graze’)의 의미 범위
  chosen_reading: 사랑하는 이가 정원들 사이에서 ‘풀을 뜯는’ 목가적 이미지를 유지했습니다.
  alternative_readings:
  - ‘먹이다’
  - ‘목초를 먹이다’
  - ‘돌보다’
  rationale: 본문은 목가적 은유를 의도적으로 열어 두므로, 특정한 신학적 해석으로 좁히지 않고 시적 이미지 자체를 보존했습니다.
  doctrine_reference: 아가서의 사랑 시학과 은유 보존
- issue: שׁוֹשַׁנִּים의 식물 명칭
  chosen_reading: ‘백합꽃’으로 옮기되, 종의 정확성은 단정하지 않았습니다.
  alternative_readings:
  - ‘백합’
  - ‘꽃들’
  - ‘수련’
  rationale: 히브리어의 정확한 식물 종은 불확실하므로, 전통적 이미지를 유지하면서도 과도한 식물학적 확정을 피했습니다.
  doctrine_reference: 시적 상징과 어휘 불확실성 존중
