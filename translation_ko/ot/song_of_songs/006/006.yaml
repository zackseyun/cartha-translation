  yaml_path: translation/ot/song_of_songs/006/006.yaml
  text: Your teeth are like a flock of ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
  footnotes:
  - marker: a
    text: Or 'all of them are paired'; the line likely implies that every tooth has its matching counterpart.
    reason: lexical_alternative
  - marker: b
    text: 'Literally ''bereaved.'' The metaphor suggests completeness: none is lacking its pair.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 이는 씻는 곳에서 올라온 암양 떼와 같으며, 그 암양들은 모두 쌍둥이를 낳았고[a] 그 가운데 새끼를 잃은 암양은 하나도 없습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모두 짝을 이루었다’로 옮길 수 있습니다. 이 비유는 모든 치아가 맞짝을 이루어 하나도 빠짐이 없음을 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘사별한/새끼를 잃은’입니다. 비유상으로는 어느 것도 결핍되지 않았음을 나타냅니다.
    reason: lexical_alternative
