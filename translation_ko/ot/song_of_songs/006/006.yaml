  naturalness: 현행 문장은 이해 가능하지만, ‘암양의 떼 같아서’와 뒤의 ‘그들 가운데’는 다소 직역투입니다. ‘암양 떼와 같으며, 그 암양들은…’으로 연결하면 현대 표준어의 시적 문체와 합쇼체에 더 자연스럽습니다.
