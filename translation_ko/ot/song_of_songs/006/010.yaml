  source_fidelity: 개정이 필요합니다. 초안의 ‘누가 이처럼’은 מִי זֹאת(‘이는 누구입니까?/이 여인은 누구입니까?’)에서 지시어를 비교 부사 ‘이처럼’으로 바꾸어 의미와 문장 구조를 달리합니다. 또한 הַנִּשְׁקָפָה는 ‘떠오르다’보다 ‘모습을 드러내다/나타나다’ 또는 문맥에 따라 ‘내다보다’에 가깝습니다. אֲיֻמָּה의 경외와 두려움을 불러일으키는 어조도 ‘위엄이 있습니다’만으로는 다소 약화됩니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 한 문장짜리 감탄·수사의문 구조와 시적 병렬을 유지합니다.
  terminology: ‘달’, ‘해’, ‘깃발을 든 군대’는 원문의 천체·군사 비유를 충실히 반영합니다. אֲיֻמָּה는 교리적 의미를 덧붙이지 않고 ‘위엄 있고 두려운’으로 옮겨 경외를 불러일으키는 뉘앙스를 살렸습니다.
