  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֤י לְ/דוֹדִ/י֙ וְ/דוֹדִ֣/י לִ֔/י הָ/רֹעֶ֖ה בַּ/שׁוֹשַׁנִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/003.yaml
  text: I am my beloved's[a], and my beloved is mine, who grazes among the lilies.
  footnotes:
  - marker: a
    text: Or 'he who shepherds among the lilies.' The Hebrew participle can denote grazing, pasturing, or shepherding.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 사랑하는 이의 것이고, 내 사랑하는 이는 나의 것입니다. 그는 백합들 사이에서 풀을 뜯습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백합들 사이에서 목자처럼 돌보는 이’로도 옮길 수 있습니다. 히브리어 분사형은 풀을 뜯다, 돌보다, 목양하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדוֹדִי / דוֹדִי
  english_pob_choice: my beloved's / my beloved
  chosen_korean: 내 사랑하는 이의 / 내 사랑하는 이
  alternatives_korean:
  - 내 연인의
  - 사랑하는 내 사람의
  lexicon: HALOT
  rationale: דוֹד는 애정 관계를 가리키는 말로, 한국어에서는 ‘사랑하는 이’가 문맥의 친밀함과 시의적 균형을 가장 잘 살립니다. ‘연인’은 현대적 뉘앙스가 강하고, 기존 교회어 ‘사랑하는 자’는 다소 부자연스럽습니다.
- source_word: וְדוֹדִי לִי
  english_pob_choice: and my beloved is mine
  chosen_korean: 그리고 내 사랑하는 이는 나의 것입니다
  alternatives_korean:
  - 그리고 내 사랑하는 이는 내 것입니다
  - 그리고 내 사랑하는 이는 저의 것입니다
  lexicon: HALOT
  rationale: 소유를 나타내는 대구 구조를 한국어에서는 ‘~의 것입니다’로 자연스럽게 살렸습니다. ‘나의 것입니다’는 시적 평행을 유지하면서도 번역투를 줄입니다.
- source_word: הָרֹעֶה
  english_pob_choice: he who grazes
  chosen_korean: 풀을 뜯습니다
  alternatives_korean:
  - 목자처럼 돌보십니다
  - 목양하십니다
  - 양 떼를 치십니다
  lexicon: HALOT
  rationale: רעה의 분사형은 ‘풀을 뜯다/먹이다/치다’까지 가능하지만, 영어 POB가 문맥상 ‘grazes’를 택한 만큼 여기서는 직접적인 목자 이미지를 덧붙이지 않고 동작 자체를 간결하게 옮겼습니다. 주어를 생략한 한국어 문장으로 시적 흐름을 유지했습니다.
- source_word: בַּשׁוֹשַׁנִּים
  english_pob_choice: among the lilies
  chosen_korean: 백합들 사이에서
  alternatives_korean:
  - 백합들 가운데
  - 백합 사이에서
  - 백합꽃들 가운데
  lexicon: HALOT
  rationale: שׁוֹשַׁנִּים는 전통적으로 ‘백합’으로 옮기는 것이 가장 안정적이며, ב를 한국어에서는 위치 관계를 드러내는 ‘사이에서’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 시 전체의 관계 언어를 어떻게 처리할지
  chosen_reading: 이 구절은 연인 사이의 상호 소유와 친밀함을 그대로 살리고, 알레고리적 확장은 본문에 넣지 않았습니다.
  alternative_readings:
  - 하나님과 이스라엘의 관계로 해석해 번역하기
  - 메시아적 의미를 본문에 직접 반영하기
  rationale: 히브리어 본문은 두 화자 사이의 대칭적 사랑 고백을 제시하므로, 번역은 그 시적 의미를 보존해야 합니다. 신학적 적용은 주석의 몫으로 남기는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 원문 우선 원칙; 해석적 알레고리의 본문 주입 금지
