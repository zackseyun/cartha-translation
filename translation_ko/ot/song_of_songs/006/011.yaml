  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호두 동산’은 히브리어를 따른 번역입니다. ‘견과 동산’ 또는 ‘견과 과수원’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘골짜기’는 히브리어에서 와디 또는 물길 바닥을 가리킬 수도 있는 말입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘포도나무가 꽃피었는지’. 히브리어 동사는 싹틈이나 꽃피움을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
