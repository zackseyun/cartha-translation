  text: 당신의 눈을 내게서 돌리십시오. 그것들이 나를 압도합니다[a]. 당신의 머리털은 길르앗에서 내려오는 염소 떼와 같습니다[b].
  philosophy: optimal-equivalence
  footnotes:
