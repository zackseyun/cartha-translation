  yaml_path: translation/ot/song_of_songs/006/005.yaml
  text: Turn your eyes away from me[a], for they overwhelm me[b]. Your hair is like a flock of goats streaming down from Gilead.
  footnotes:
  - marker: a
    text: Or 'for they disconcert me' / 'for they overpower me.' The Hebrew verb here is rare and its nuance is debated; the main text renders the likely sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'descending from Gilead' or 'on the slopes of Gilead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 눈을 내게서 돌리십시오[a]. 그것들이 나를 압도합니다[b]. 당신의 머리털은 길르앗에서 내려오는 염소 떼와 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게서 그 눈길을 거두십시오’, ‘내 앞에서 눈을 떼십시오’. 히브리어 동사의 뜻은 드물고 논의가 갈리지만, 본문은 문맥상 가능한 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘길르앗에서 내려오는’ 또는 ‘길르앗의 비탈에서’. 히브리어는 단순히 ‘길르앗에서’라고 말합니다.
    reason: lexical_alternative
