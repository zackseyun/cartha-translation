    text: 또는 ‘그것들이 나를 당혹하게 합니다’, ‘그것들이 나를 제압합니다’. 이 히브리어 동사는 드물게 쓰여 그 뉘앙스에 논의가 있지만, 본문은 문맥상 가능한 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘길르앗에서 내려오는’ 또는 ‘길르앗의 비탈을 내려오는’. 히브리어는 단순히 ‘길르앗에서’라고 말합니다.
    reason: lexical_alternative
