  text: 내 사랑이여, 당신은 디르사처럼 아름답고 예루살렘처럼 사랑스러우며, 깃발을 든 군대처럼 경외감을 불러일으키십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깃발을 든 군대처럼 두려움을 자아내십니다.’ 원문의 표현은 깃발 아래 질서 있게 편성된 군대의 위압적이고 장엄한 모습을 가리킵니다.
    reason: lexical_alternative
