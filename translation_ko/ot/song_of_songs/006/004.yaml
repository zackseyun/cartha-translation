translation:
  language: ko
  text: 당신은 내 사랑이시여, 디르사처럼 아름답고, 예루살렘처럼 사랑스럽고, 깃발 든 군대처럼 위압적이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘깃발 든 군대’의 질서정연하고 위압적인 군사 이미지를 가리키며, 단순한 ‘두려움’보다 장엄한 위세를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפָה
  english_pob_choice: beautiful
  chosen_korean: 아름답고
  alternatives_korean:
  - 아리따운
  - 아름다운
  lexicon: HALOT
  rationale: 평서적 칭찬을 자연스러운 현대 한국어로 옮기되, 시적 문맥을 살려 ‘아름답고’로 렌더링했습니다.
- source_word: רַעְיָתִי
  english_pob_choice: my love
  chosen_korean: 내 사랑이시여
  alternatives_korean:
  - 내 사랑
  - 내 사랑하는 이여
  - 내 연인이여
  lexicon: HALOT
  rationale: 애정 어린 직접 호칭을 한국어로 자연스럽게 옮기기 위해 ‘내 사랑이시여’를 택했고, 화자의 직접 호소를 살리기 위해 호격을 반영했습니다.
- source_word: כְּתִרְצָה
  english_pob_choice: like Tirzah
  chosen_korean: 디르사처럼
  alternatives_korean:
  - 디르사와 같이
  - 디르사처럼 아름다운
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고, כ의 비교 의미를 ‘처럼’으로 분명하게 살렸습니다.
- source_word: נָאוָה
  english_pob_choice: lovely
  chosen_korean: 사랑스럽고
  alternatives_korean:
  - 아름답고
  - 우아하고
  lexicon: HALOT
  rationale: 앞의 יָפָה와 동일어 반복을 피하면서도, 시적 평행 구조 안에서 긍정적 미감을 유지하는 한국어로 ‘사랑스럽고’를 선택했습니다.
- source_word: כִּירוּשָׁלִָם
  english_pob_choice: like Jerusalem
  chosen_korean: 예루살렘처럼
  alternatives_korean:
  - 예루살렘과 같이
  - 예루살렘같이
  lexicon: HALOT
  rationale: 예루살렘은 통용 표기를 따르고, 비교 접속은 문맥상 가장 자연스러운 ‘처럼’으로 옮겼습니다.
- source_word: אֲיֻמָּה כַּנִּדְגָּלוֹת
  english_pob_choice: awe-inspiring as bannered armies
  chosen_korean: 깃발 든 군대처럼 위압적이십니다
  alternatives_korean:
  - 군기 든 군대처럼 두렵습니다
  - 표장 든 군대처럼 위엄이 있으십니다
  lexicon: HALOT
  rationale: אֲיֻמָּה의 강한 인상·경외의 뉘앙스를 ‘위압적’으로, כַּנִּדְגָּלוֹת의 군사적·질서정연한 이미지를 ‘깃발 든 군대’로 옮겨 원문의 힘을 유지했습니다.
theological_decisions:
- issue: 시적 직접 호칭의 존댓말 처리
  chosen_reading: 직접 호칭은 ‘내 사랑이시여’와 종결어미 ‘-십니다’를 사용해 합쇼체를 유지했습니다.
  alternative_readings:
  - 직접 호칭을 평서체로 낮추는 방식
  - 전 구절을 비격식 시어로 옮기는 방식
  rationale: 아가의 애정시라는 문학 장르를 훼손하지 않으면서도, 한국어 독서 관습에 맞는 공손한 서술 톤을 유지하기 위한 선택입니다.
  doctrine_reference: 문체·화자 등록 일관성
