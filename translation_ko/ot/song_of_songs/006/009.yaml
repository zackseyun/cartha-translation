source:
  edition: WLC
  text: אַחַ֥ת הִיא֙ יוֹנָתִ֣/י תַמָּתִ֔/י אַחַ֥ת הִיא֙ לְ/אִמָּ֔/הּ בָּרָ֥ה הִ֖יא לְ/יֽוֹלַדְתָּ֑/הּ רָא֤וּ/הָ בָנוֹת֙ וַֽ/יְאַשְּׁר֔וּ/הָ מְלָכ֥וֹת וּ/פִֽילַגְשִׁ֖ים וַֽ/יְהַלְלֽוּ/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/009.yaml
  text: My dove[a], my flawless one, is the only one; she is the only one of her mother, pure to the one who bore her. Daughters saw her and called her blessed[c][b]; queens and concubines also praised her.
  footnotes:
  - marker: a
    text: Or 'my perfect one' for 'my flawless one.' The Hebrew term can convey completeness or blamelessness.
    reason: lexical_alternative
  - marker: b
    text: Or 'choice' / 'radiant' for 'pure.' The Hebrew adjective may emphasize purity or exceptional quality.
    reason: lexical_alternative
  - marker: c
    text: '''Daughters'' may refer more broadly to young women or maidens in the poem''s idiom.'
    reason: cultural_note
translation:
  language: ko
  text: 내 사랑하는 자는 유일합니다. 내 어미의 외딸이며, 그를 낳은 이에게는 순결합니다. 딸들이 그를 보고 그를 복되다 하고, 왕비들과 후궁들도 그를 칭찬하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 사랑하는 자’는 직역된 ‘내 비둘기’의 시적 이미지를 한국어에서 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘순결합니다’는 ‘흠 없고 온전함’까지 아우를 수 있는 시적 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘딸들’은 본문에서 젊은 여성들/처녀들을 가리키는 시적 용례일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹנָתִי
  english_pob_choice: my dove
  chosen_korean: 내 사랑하는 자
  alternatives_korean:
  - 내 비둘기
  - 내 사랑
  lexicon: HALOT
  rationale: 직역하면 ‘비둘기’이지만, 이 구절의 애정 어린 시적 호칭은 한국어에서 자연스럽게 ‘내 사랑하는 자’로 옮기는 편이 의미와 유려함을 함께 살립니다.
- source_word: תַמָּתִי
  english_pob_choice: my flawless one
  chosen_korean: 순결합니다
  alternatives_korean:
  - 흠 없는 이입니다
  - 완전한 이입니다
  - 온전한 이입니다
  lexicon: HALOT
  rationale: 히브리어는 완전함/흠없음/순전함의 뉘앙스를 담을 수 있어, 본문 병행구와 함께 인물의 탁월한 품격을 나타내는 ‘순결합니다’로 옮겼습니다.
- source_word: אַחַת הִיא
  english_pob_choice: is the only one
  chosen_korean: 유일합니다
  alternatives_korean:
  - 하나뿐입니다
  - 오직 한 사람입니다
  - 외따로입니다
  lexicon: HALOT
  rationale: 반복되는 표현의 핵심은 단순 수량이 아니라 독특성과 유일성입니다. 현대 한국어에서는 ‘유일합니다’가 가장 간결하고 정확합니다.
- source_word: לְאִמָּהּ / לְיוֹלַדְתָּהּ
  english_pob_choice: of her mother / to the one who bore her
  chosen_korean: 내 어미의 외딸이며, 그를 낳은 이에게는
  alternatives_korean:
  - 어머니의 외동딸이며, 낳은 이에게는
  - 어미에게는 단 하나이며, 낳은 자에게는
  lexicon: HALOT
  rationale: 두 관계절의 의미를 살리되 한국어 어법에 맞게 ‘외딸’로 압축했습니다. ‘그를 낳은 이’는 출산 주체를 직접 드러내는 원문의 관계를 보존합니다.
- source_word: בָּרָה
  english_pob_choice: pure
  chosen_korean: 순결합니다
  alternatives_korean:
  - 깨끗합니다
  - 맑습니다
  - 선택된 듯합니다
  lexicon: HALOT
  rationale: 문맥상 도덕적 판단보다 시적 탁월성과 순전함을 함께 드러내는 표현이 필요해 ‘순결합니다’를 택했습니다.
- source_word: וַיְאַשְּׁרוּהָ
  english_pob_choice: called her blessed
  chosen_korean: 복되다 하고
  alternatives_korean:
  - 복되다 일컬었고
  - 행복하다 하였고
  - 복이 있다 하였고
  lexicon: HALOT
  rationale: 히브리어 פי엘의 평가·선포 의미를 살려 ‘복되다 하고’로 옮겨, 단순 감상이 아니라 공적 인정의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 시적 애정 호칭을 한국어에서 어떻게 유지할지
  chosen_reading: 직설적 연애시의 메타포를 완화하지 않고, ‘내 사랑하는 자’로 인물 호칭의 친밀감과 존중을 함께 표현했습니다.
  alternative_readings:
  - ‘내 비둘기’로 더 직접적으로 보존
  - ‘내 사랑’으로 추상화
  rationale: 아가의 은유를 한국어로 그대로 옮기면 다소 낯설거나 오해를 부를 수 있으므로, 본문의 시적 기능을 해치지 않는 범위에서 의미를 드러내는 쪽을 택했습니다.
  doctrine_reference: 아가서의 혼인/사랑 시학
