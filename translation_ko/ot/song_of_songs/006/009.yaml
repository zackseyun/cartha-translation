  chosen_korean: 순결합니다
  alternatives_korean:
  - 깨끗합니다
  - 맑습니다
  - 선택된 듯합니다
  lexicon: HALOT
  rationale: 문맥상 도덕적 판단보다 시적 탁월성과 순전함을 함께 드러내는 표현이 필요해 ‘순결합니다’를 택했습니다.
