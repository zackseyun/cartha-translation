  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נַשְׁכִּ֨ימָה֙ לַ/כְּרָמִ֔ים נִרְאֶ֞ה אִם פָּֽרְחָ֤ה הַ/גֶּ֨פֶן֙ פִּתַּ֣ח הַ/סְּמָדַ֔ר הֵנֵ֖צוּ הָ/רִמּוֹנִ֑ים שָׁ֛ם אֶתֵּ֥ן אֶת דֹּדַ֖/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/013.yaml
  text: Let us rise early for the vineyards[a]; let us see whether the vine has budded, whether the blossom has opened, whether the pomegranates are in bloom[c][b]. There I will give you my love.
  footnotes:
  - marker: a
    text: Or 'to the vineyards.' The Hebrew preposition can be rendered either way in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'the vine has blossomed.' The Hebrew may refer broadly to flowering, though the translation 'has budded' preserves the apparent progression into the next clause about the blossom opening.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'my loves,' likely an intensive or collective expression meaning 'my love' or 'my caresses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 포도원으로 일찍 나가서, 포도나무에 싹이 텄는지, 꽃이 피었는지, 석류나무에 꽃이 피었는지 살펴봅시다[c][b]. 거기서 나는 당신에게 내 사랑을 드리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘포도나무가 꽃을 피웠는지’로도 옮길 수 있습니다. 히브리어는 넓게는 ‘꽃이 피다’의 의미를 담을 수 있지만, 앞뒤의 생장 단계가 이어지는 점을 살리기 위해 ‘싹이 텄다’ 뒤에 ‘꽃이 피었다’를 두었습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘내 사랑들’이라는 복수형이지만, 여기서는 강한 집합적·강조적 표현으로 ‘내 사랑’ 또는 ‘내 애정’의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְׁכִּימָה
  english_pob_choice: Let us rise early
  chosen_korean: 우리가 포도원으로 일찍 나가서
  alternatives_korean:
  - 우리가 일찍 일어나서
  - 우리가 일찍 가서
  lexicon: HALOT
  rationale: 히필 청유형의 초점은 ‘일찍’과 공동 제안에 있으며, 한국어에서는 자연스럽게 ‘일찍 나가서’로 옮기면 출발의 뉘앙스와 함께 흐름이 살아납니다.
- source_word: פָּרְחָה הַגֶּפֶן / פִּתַּח הַסְּמָדַר
  english_pob_choice: the vine has budded / the blossom has opened
  chosen_korean: 포도나무에 싹이 텄는지, 꽃이 피었는지
  alternatives_korean:
  - 포도나무가 싹이 텄는지, 꽃이 피었는지
  - 포도나무가 꽃을 피웠는지, 꽃망울이 열렸는지
  lexicon: HALOT
  rationale: 이 둘은 성장 단계의 연속을 이루므로, 첫 절은 ‘싹이 텄다’로, 다음 절은 ‘꽃이 피었다’로 옮겨 진행성을 살렸습니다.
- source_word: הֵנֵצוּ הָרִמּוֹנִים
  english_pob_choice: the pomegranates are in bloom
  chosen_korean: 석류나무에 꽃이 피었는지
  alternatives_korean:
  - 석류가 피었는지
  - 석류나무가 꽃을 피웠는지
  lexicon: HALOT
  rationale: 히브리어는 ‘석류나무들/석류들’의 꽃피움을 말하므로, 한국어에서는 관용적이면서도 원문 대상이 살아 있는 ‘석류나무에 꽃이 피었는지’가 적절합니다.
- source_word: דֹּדַי
  english_pob_choice: my love
  chosen_korean: 내 사랑
  alternatives_korean:
  - 나의 사랑
  - 내 사랑스러움
  - 내 애정
  lexicon: HALOT
  rationale: 복수형이지만 아가에서는 집합적·강조적 표현으로 쓰일 수 있으므로, POB의 ‘my love’에 맞춰 과도한 해석 없이 친밀한 단수형 ‘내 사랑’으로 옮겼습니다.
theological_decisions:
- issue: 연인 화자의 직접적 약속과 친밀한 어조
  chosen_reading: ‘거기서 나는 당신에게 내 사랑을 드리겠습니다’로, 장소적 지시어 ‘거기서’와 직접적 약속을 살렸습니다.
  alternative_readings:
  - ‘그곳에서 나는 당신에게 사랑을 주겠습니다’
  - ‘거기서 내 애정을 드리겠습니다’
  rationale: 아가는 시적 연인 대화이며, 원문의 직설적 관계성과 약속성을 약화하지 않기 위해 완곡화를 줄였습니다.
  doctrine_reference: 아가서의 문학적-시적 본문 이해; 과도한 우화화 회피
- issue: 원문의 장소성(שָׁם) 유지
  chosen_reading: ‘거기서’로 번역해, 행위가 일어날 특정 장소를 분명히 했습니다.
  alternative_readings:
  - ‘그때’
  - ‘그러면’
  rationale: שָׁם은 시간적 접속사보다 장소 부사를 뜻하므로, 시적 흐름 속에서도 공간적 의미를 보존해야 합니다.
  doctrine_reference: 문법-의미 보존 원칙
