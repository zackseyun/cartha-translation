  source_fidelity: 전반적으로 히브리어의 청유형, 포도원이라는 목적지, 관찰의 연속, 장소 부사 ‘거기서’, 그리고 ‘내 사랑’의 약속을 잘 반영합니다. 다만 סְמָדַר는 포도나무의 꽃/포도꽃을 가리키므로 둘째 관찰절의 주어를 명시하는 편이 원문에 더 충실합니다. 또한 דֹּדַי의 각주는 해당 표현이 번역된 ‘내 사랑’에 붙어야 합니다.
  naturalness: ‘우리가 … 살펴봅시다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘포도나무의 꽃이 피었는지’라고 하면 앞 절과의 병렬 및 대상이 분명해집니다. ‘드리겠습니다’는 상대를 높이는 겸양의 뉘앙스를 더할 수 있으므로, 원문의 중립적 ‘give’에는 ‘주겠습니다’가 더 적절합니다.
  terminology: ‘포도원’, ‘포도나무’, ‘석류나무’, ‘내 사랑’은 적절합니다. דֹּדַי의 복수형이 지닌 집합적/강조적 가능성은 각주로 보존합니다.
