  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חִכֵּ֕/ךְ כְּ/יֵ֥ין הַ/טּ֛וֹב הוֹלֵ֥ךְ לְ/דוֹדִ֖/י לְ/מֵישָׁרִ֑ים דּוֹבֵ֖ב שִׂפְתֵ֥י יְשֵׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/010.yaml
  text: And your mouth is like the best wine[a], going down smoothly for my beloved[b], gliding over the lips of sleepers.
  footnotes:
  - marker: a
    text: Or 'your palate'; the Hebrew term refers more specifically to the roof of the mouth or taste.
    reason: lexical_alternative
  - marker: b
    text: Or 'causing the lips of sleepers to speak.' The Hebrew verb is rare and may describe either gentle movement over the lips or the awakening/speaking effect of the wine.
    reason: alternative_reading
translation:
  language: ko
  text: 그대의 입은 가장 좋은 포도주 같아서, 내 사랑하는 이에게 부드럽게 흘러가며 잠든 이들의 입술 위를 스쳐 지나갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חִכֵּךְ는 문자적으로는 ‘입천장/구개’를 가리키므로, ‘입’보다 더 구체적으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 דּוֹבֵב은 ‘잠든 이들의 입술을 말하게 함’으로도 이해될 수 있습니다. 따라서 이 구는 포도주가 입술 위를 부드럽게 지나가는 장면이거나, 그 움직임이 잠든 이들의 말을 불러내는 장면일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חִכֵּךְ
  english_pob_choice: your mouth
  chosen_korean: 그대의 입
  alternatives_korean:
  - 그대의 입천장
  - 그대의 입맛
  - 그대의 구개
  lexicon: HALOT
  rationale: 히크케크는 문자적으로 입천장/구개를 가리키지만, 이 시구에서는 키스와 말의 이미지 안에서 한국어로는 ‘입’이 가장 자연스럽고 시적으로 기능합니다.
- source_word: כְּיֵין הַטּוֹב
  english_pob_choice: like the best wine
  chosen_korean: 가장 좋은 포도주 같아
  alternatives_korean:
  - 좋은 포도주 같아
  - 최고의 포도주 같아
  lexicon: HALOT
  rationale: הַטּוֹב의 최상급적 힘을 살리되, 한국어 시적 표현으로는 ‘가장 좋은 포도주’가 과도하게 직역되지 않으면서도 강도를 유지합니다.
- source_word: לְמֵישָׁרִים
  english_pob_choice: smoothly
  chosen_korean: 부드럽게
  alternatives_korean:
  - 곧게
  - 바르게
  - 매끄럽게
  lexicon: HALOT
  rationale: 직역하면 ‘곧음/바름’이지만, 포도주가 목을 타고 내려가는 감각과 이어지는 문맥상 한국어에서는 ‘부드럽게’가 그 흐름을 더 잘 전달합니다.
- source_word: דּוֹבֵב שִׂפְתֵי יְשֵׁנִים
  english_pob_choice: gliding over the lips of sleepers
  chosen_korean: 잠든 이들의 입술 위를 스쳐 지나갑니다
  alternatives_korean:
  - 잠든 이들의 입술을 움직이게 합니다
  - 잠든 이들의 입술 위를 미끄러집니다
  lexicon: HALOT
  rationale: 희귀한 דּוֹבֵב은 ‘입술 위를 부드럽게 지나감’과 ‘입술을 말하게 함’의 여지를 모두 지니므로, 한국어 본문은 물리적 이미지를 살려 번역하고 각주에서 대안 독법을 밝혔습니다.
theological_decisions:
- issue: 희귀 동사 דּוֹבֵב의 의미 범위
  chosen_reading: 본문에는 포도주가 잠든 이들의 입술 위를 부드럽게 스쳐 지나가는 이미지로 두고, ‘말하게 함’ 가능성은 각주로 보존합니다.
  alternative_readings:
  - 잠든 이들의 입술을 말하게 함
  - 잠든 이들의 입술을 움직이게 함
  rationale: 영어 POB의 주석처럼 히브리어는 물리적 이동과 발화 유발의 양쪽 가능성을 열어 두므로, 본문에서 한쪽으로 단정하지 않고 문맥상 가장 자연스러운 이미지를 유지합니다.
  doctrine_reference: 시적 본문 해석의 다의성 보존
- issue: 시적 호칭의 인칭 처리
  chosen_reading: ‘내 사랑하는 이’는 원문 לְדוֹדִי의 관계적 뉘앙스를 살려 로맨틱한 소속감을 드러냅니다.
  alternative_readings:
  - 내 사랑하는 사람에게
  - 내 사랑하는 이를 향하여
  rationale: לְ는 방향뿐 아니라 관계/수혜의 뉘앙스를 가질 수 있어, 한국어에서는 사랑의 대상에게 향하는 친밀함을 자연스럽게 드러내는 쪽을 택했습니다.
  doctrine_reference: 시가서의 연애시적 화자와 대상 관계
