base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/012.yaml
  text: Come[a], my beloved, let us go out to the countryside[b]; let us spend the night among the villages.
  footnotes:
  - marker: a
    text: Or 'in the villages.'
    reason: lexical_alternative
  - marker: b
    text: Some interpret 'among the henna blossoms,' linking the Hebrew term with the plant mentioned in Song 1:14; the immediate context here more likely refers to villages in the countryside.
    reason: alternative_reading
translation:
  language: ko
  text: 내 사랑아, 오십시오. 들로 나갑시다. 마을들에서[a] 밤을 지냅시다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּפָרִים를 아가 1:14의 식물과 연결하여 ‘헤나 꽃들’로 이해하는 해석도 있습니다. 그러나 여기서는 들로 나가 밤을 지내자는 문맥상 ‘마을들’이 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכָה
  english_pob_choice: Come
  chosen_korean: 오라
  alternatives_korean:
  - 가자
  - 와
  lexicon: HALOT
  rationale: 남성 단수 명령형이지만, 여기서는 사랑하는 이를 부르는 초청 표현이므로 자연스러운 부름말인 ‘오라’가 원문의 친밀한 호소를 잘 살립니다.
- source_word: דוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑아
  alternatives_korean:
  - 내 연인아
  - 내 사랑하는 이여
  lexicon: HALOT
  rationale: 아가의 애정 호칭을 한국어의 자연스러운 연서체로 옮기되, 관계의 친밀함과 시적 어감을 살리기 위해 ‘내 사랑아’를 택했습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: to the countryside
  chosen_korean: 들로
  alternatives_korean:
  - 들판으로
  - 시골로
  lexicon: HALOT
  rationale: 직역의 ‘밭’보다 여기서는 교외의 열린 시골 공간을 가리키는 집합적 의미가 강하므로, POB의 해석을 따라 ‘들로’로 옮겼습니다.
- source_word: בַּכְּפָרִים
  english_pob_choice: among the villages
  chosen_korean: 마을들 가운데서
  alternatives_korean:
  - 마을들 안에서
  - 시골 마을들 사이에서
  lexicon: HALOT
  rationale: כפרים를 ‘henna blossoms’로 보는 해석 가능성도 있으나, 문맥상 이동과 숙박의 장면이므로 ‘마을들’이 더 직접적입니다. 전치사 בְּ의 분포·장소 의미는 ‘가운데서’로 반영했습니다.
theological_decisions:
- issue: 시적 초청의 어조
  chosen_reading: 화자는 연인에게 함께 떠나자고 부드럽게 권하는 시적 초청으로 읽어, 명령의 강함보다 친밀한 동참의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 단순 명령처럼 더 강하게 옮김
  - 더 완곡한 권유로 약화함
  rationale: 원문의 2인칭 남성 단수 명령과 복수 청유가 사랑 노래의 대화 장면 안에서 친밀한 초청으로 기능하므로, 한국어에서도 그 정서를 유지하는 것이 적절합니다.
  doctrine_reference: 아가서의 시적 장르와 화자-청자 관계
