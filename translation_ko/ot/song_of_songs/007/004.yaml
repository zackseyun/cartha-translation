source:
  edition: WLC
  text: שְׁנֵ֥י שָׁדַ֛יִ/ךְ כִּ/שְׁנֵ֥י עֳפָרִ֖ים תָּאֳמֵ֥י צְבִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/004.yaml
  text: Your two breasts are like two fawns[b][a], twins of a gazelle.
  footnotes:
  - marker: a
    text: Or 'young deer'; the Hebrew animal term can be rendered more generally, though 'gazelle' imagery is common in Song of Songs.
    reason: lexical_alternative
  - marker: b
    text: Or 'a doe.' The Hebrew word is feminine singular.
    reason: lexical_alternative
translation:
  language: ko
  text: 그대의 두 젖가슴은 한 암가젤의 쌍둥이 새끼 두 마리와 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁדַיִךְ
  english_pob_choice: your breasts
  chosen_korean: 당신의 두 젖
  alternatives_korean:
  - 당신의 가슴
  - 당신의 유방
  lexicon: HALOT
  rationale: שַׁד의 기본 의미인 신체 부위를 직접 드러내면서도, 현대 한국어에서 시적이고 비교적 자연스러운 표현인 ‘젖’을 택했습니다. 성적 맥락을 흐리지 않으면서도 과도한 의학적 느낌은 피합니다.
- source_word: עֳפָרִים
  english_pob_choice: fawns
  chosen_korean: 두 새끼 사슴
  alternatives_korean:
  - 두 어린 사슴
  - 새끼 사슴들
  lexicon: HALOT
  rationale: 비유 대상은 어린 사슴류의 민첩하고 부드러운 이미지를 가리키므로, ‘새끼 사슴’이 가장 직접적입니다. 앞의 ‘두’와 함께 원문의 이중성을 분명히 합니다.
- source_word: תָּאֳמֵי
  english_pob_choice: twins of
  chosen_korean: 쌍둥이
  alternatives_korean:
  - 한 쌍의
  - 쌍둥이인
  lexicon: HALOT
  rationale: 두 새끼 사슴이 서로 짝을 이루는 관계를 나타내므로 ‘쌍둥이’로 옮겼습니다. 한국어에서 자연스럽고, 원문의 상응성과 대칭성을 살립니다.
- source_word: צְבִיָּה
  english_pob_choice: a gazelle
  chosen_korean: 한 암사슴
  alternatives_korean:
  - 한 암컷 가젤
  - 한 암사냥개
  lexicon: HALOT
  rationale: 직역하면 ‘암 가젤’이지만, 한국어에서는 ‘암사슴’이 시적 이미지로 더 자연스럽고 본문의 유려함을 살립니다. 다만 원문 동물군의 정확성을 위해 ‘사슴’으로 좁혀 번역했습니다.
theological_decisions:
- issue: 에로틱한 신체 비유의 직접성
  chosen_reading: 완곡화하지 않고 신체 명칭과 동물 비유를 그대로 살렸습니다.
  alternative_readings:
  - 가슴
  - 유방
  - 가슴 언저리
  rationale: 아가의 시적·에로틱한 비유를 흐리지 않기 위해 원문이 허용하는 직접성을 유지했습니다. 이는 단순한 외설화가 아니라 대칭적 아름다움을 강조하는 시적 장치입니다.
  doctrine_reference: 아가서의 문학 장르와 비유 표현 이해
