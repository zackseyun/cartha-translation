- from: 당신의 두 젖은 두 새끼 사슴 곧 한 암사슴의 쌍둥이 같습니다.[a][b]
  to: 그대의 두 젖가슴은 한 암가젤의 쌍둥이 새끼 두 마리와 같습니다.
  rationale: 가젤의 동물 이미지를 보존하고, 히브리어의 ‘쌍둥이인 새끼들—한 암가젤의’라는 수식 관계를 자연스러운 한국어로 재구성했습니다. ‘그대’와 ‘젖가슴’을 사용하여 아가의 시적·에로틱한 직접성을 유지하면서 현대 문어의 격식을 갖추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T16:45:26Z'
review_pass:
  verdict: revise
  source_fidelity: 원문은 여인의 ‘두 유방’을 ‘한 암가젤의 쌍둥이 새끼 두 마리’에 비유합니다. 초안의 핵심 뜻은 대체로 맞지만, צְבִיָּה를 ‘암사슴’으로 옮긴 것은 가젤이라는 동물 지시를 바꾸며, ‘곧’은 원문의 소유·속격 관계를 충분히 드러내지 못합니다.
  naturalness: ‘당신의’보다 아가의 연인 호칭에는 ‘그대의’가 더 자연스럽고 문학적입니다. ‘젖가슴’은 현대 표준어에서 신체 부위를 직접적이되 지나치게 의학적으로 들리지 않게 나타냅니다. ‘쌍둥이 새끼 두 마리’는 한국어 어순상 자연스럽게 짝과 수를 표현합니다.
  terminology: שַׁד는 ‘젖가슴’으로, עֳפָרִים은 ‘새끼’로, צְבִיָּה는 ‘암가젤’로 옮겨 원문의 구체적 동물 이미지를 유지했습니다. 신체 비유를 완곡화하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘암사슴’이 צְבִיָּה의 가젤 지시를 사슴으로 바꿉니다.
    rationale: 원문 및 영어 감사 기록은 여성형 가젤을 가리킵니다. 한국어에서 다소 낯설 수 있어도 ‘암가젤’이 더 충실합니다.
  - severity: low
    issue: ‘곧 한 암사슴의 쌍둥이’는 원문의 ‘한 암가젤의 쌍둥이 [새끼]’라는 관계를 다소 어색하게 처리합니다.
    rationale: ‘한 암가젤의 쌍둥이 새끼 두 마리’로 옮기면 수식 관계와 시적 비유가 명료해집니다.
  - severity: low
    issue: 각주 a에 한국어 문장 안에 ‘כאן’이 삽입되어 있고, 두 각주는 번역문에 필요한 실질적 대안을 제공하지 않습니다.
    rationale: 구조적 오류는 아니지만, 현 번역의 정확성을 위해 별도 각주가 필요하지 않으며 삭제하는 편이 낫습니다.
  revised_text: 그대의 두 젖가슴은 한 암가젤의 쌍둥이 새끼 두 마리와 같습니다.
  revised_footnotes: []
