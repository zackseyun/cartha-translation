translation:
  language: ko
  text: 당신의 두 젖은 두 새끼 사슴 곧 한 암사슴의 쌍둥이 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젖’은 כאן שַׁד의 보다 직접적인 한국어 대응이며, ‘가슴/유방’보다 시적 맥락의 육체성을 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘암사슴’은 원문의 ‘암 가젤’에 대응하기 위한 한국어 시적 조정입니다. 한국어에서 가젤 이미지는 다소 생경할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁדַיִךְ
  english_pob_choice: your breasts
  chosen_korean: 당신의 두 젖
  alternatives_korean:
  - 당신의 가슴
  - 당신의 유방
  lexicon: HALOT
  rationale: שַׁד의 기본 의미인 신체 부위를 직접 드러내면서도, 현대 한국어에서 시적이고 비교적 자연스러운 표현인 ‘젖’을 택했습니다. 성적 맥락을 흐리지 않으면서도 과도한 의학적 느낌은 피합니다.
- source_word: עֳפָרִים
  english_pob_choice: fawns
  chosen_korean: 두 새끼 사슴
  alternatives_korean:
  - 두 어린 사슴
  - 새끼 사슴들
