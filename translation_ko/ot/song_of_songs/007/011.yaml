  alternative_readings:
  - 나는 내 사랑하는 이를 위합니다
  - 나는 내 사랑하는 이에게 속합니다
  rationale: 히브리어는 결합형 관용구와 전치사 עַל의 방향성을 지닌 시적 진술이므로, 의미를 평탄화하기보다 관계적 소속과 향함을 함께 드러냈습니다.
  doctrine_reference: 원문 우선 원칙; 시적 본문의 의미 보존
