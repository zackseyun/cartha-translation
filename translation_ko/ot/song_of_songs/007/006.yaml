  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹאשֵׁ֤/ךְ עָלַ֨יִ/ךְ֙ כַּ/כַּרְמֶ֔ל וְ/דַלַּ֥ת רֹאשֵׁ֖/ךְ כָּ/אַרְגָּמָ֑ן מֶ֖לֶךְ אָס֥וּר בָּ/רְהָטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/006.yaml
  text: Your head upon you is like Carmel[a], and the flowing hair of your head like purple[c][b]; a king is held captive in the tresses.
  footnotes:
  - marker: a
    text: Carmel likely refers to Mount Carmel, evoking stately height and beauty.
    reason: cultural_note
  - marker: b
    text: Or 'the locks of your head.' The Hebrew term is rare and may refer to hanging or flowing hair.
    reason: lexical_alternative
  - marker: c
    text: Or 'a king is bound in the galleries.' The final Hebrew term is difficult and has been understood in more than one way; the main text follows the hair imagery of the surrounding lines.
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 머리는 당신 위에 갈멜과 같고, 당신 머리의 늘어진 머리칼은 자주빛과 같으며, 한 왕이 그 머리칼에 사로잡혀 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 갈멜은 아마도 갈멜산을 가리키며, 위엄 있는 높이와 아름다움을 떠올리게 합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘당신 머리의 머리칼’입니다. 히브리어는 희귀어로, 늘어지거나 흩날리는 머리칼을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘한 왕이 회랑들에 묶여 있습니다’입니다. 마지막 히브리어는 난해하여 여러 방식으로 이해되어 왔으며, 본문은 앞선 머리 이미지의 흐름을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ / עָלַיִךְ
  english_pob_choice: Your head upon you
  chosen_korean: 당신의 머리는 당신 위에
  alternatives_korean:
  - 당신의 머리가 당신 위에
  - 당신의 머리는 당신 위로
  lexicon: HALOT
  rationale: 머리와 몸의 위아래 관계를 살리되, 시적 비교문으로 자연스럽게 읽히는 표준어로 옮겼습니다.
- source_word: כַּכַּרְמֶל
  english_pob_choice: like Carmel
  chosen_korean: 갈멜과 같고
  alternatives_korean:
  - 갈멜처럼
  - 갈멜산과 같고
  lexicon: HALOT
  rationale: 고유명사 자체를 살려 압축된 시적 이미지를 유지했으며, 갈멜이 산지/산의 이미지를 불러오는 점은 본문 그대로 두었습니다.
- source_word: דַּלַּת רֹאשֵׁךְ
  english_pob_choice: the flowing hair of your head
  chosen_korean: 당신 머리의 늘어진 머리칼
  alternatives_korean:
  - 당신 머리의 흐르는 머리카락
  - 당신 머리의 내려뜨린 머리칼
  lexicon: HALOT
  rationale: 희귀어 דַּלָּה의 ‘늘어진/흐르는’ 머리카락 이미지를 살리되, 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: כָּאַרְגָּמָן
  english_pob_choice: like purple
  chosen_korean: 자주빛과 같으며
  alternatives_korean:
  - 보랏빛과 같으며
  - 자주색과 같으며
  lexicon: HALOT
  rationale: אַרְגָּמָן의 값비싼 자주빛 계열을 반영하면서, 색채와 품격을 함께 전달하는 표준어 표현을 선택했습니다.
- source_word: אָסוּר בָּרְהָטִים
  english_pob_choice: a king is held captive in the tresses
  chosen_korean: 한 왕이 그 머리칼에 사로잡혀 있습니다
  alternatives_korean:
  - 한 왕이 그 머리칼에 묶여 있습니다
  - 한 왕이 그 머리칼 속에 갇혀 있습니다
  lexicon: HALOT
  rationale: אַסר의 수동적·비유적 힘을 ‘사로잡혀 있다’로 옮겨, 사랑의 시에서 왕이 머리칼의 매력에 붙들린 이미지를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 마지막 행의 난해한 רְהָטִים을 어떻게 처리할지
  chosen_reading: 본문 흐름에 따라 머리칼 이미지 안에서 이해하여 ‘그 머리칼에’로 옮겼습니다.
  alternative_readings:
  - ‘회랑들/갤러리들 안에’
  - ‘수로들 안에’
  rationale: 직전 행이 머리칼을 말하고 있으므로, 난해한 종결어를 외부 건축 이미지로 돌리기보다 인접 문맥의 비유를 우선했습니다. 이는 영어 POB의 본문 선택과 일치합니다.
  doctrine_reference: 해석의 우선순위에 관한 본문비평/문맥 우선 원칙
