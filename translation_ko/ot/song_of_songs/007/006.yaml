  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 각주 대상이 불명확합니다.
    rationale: a는 ‘갈멜’, b는 머리칼 표현, c는 마지막 난해어에 각각 붙여야 합니다.
  - severity: medium
