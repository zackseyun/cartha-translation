  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁרְרֵ/ךְ֙ אַגַּ֣ן הַ/סַּ֔הַר אַל יֶחְסַ֖ר הַ/מָּ֑זֶג בִּטְנֵ/ךְ֙ עֲרֵמַ֣ת חִטִּ֔ים סוּגָ֖ה בַּ/שּׁוֹשַׁנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/003.yaml
  text: Your navel is a rounded bowl[a]; may it never lack mixed wine. Your belly is a heap of wheat[c][b], encircled with lilies.
  footnotes:
  - marker: a
    text: Or possibly, 'Your vulva is a rounded bowl.' The Hebrew term traditionally rendered 'navel' is debated in this erotic poetic context.
    reason: lexical_alternative
  - marker: b
    text: Or 'spiced wine.' The Hebrew refers to wine that is mixed, likely with water or spices.
    reason: lexical_alternative
  - marker: c
    text: Or 'Your womb is a heap of wheat' if the term is taken in an internal rather than external bodily sense, though 'belly' is more likely in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 배꼽은 둥근 대야 같습니다[a]. 그 안에 섞은 포도주가 부족함이 없기를 바랍니다[b]. 당신의 배는 밀 더미 같고[c], 백합꽃들 가운데 둘러싸여 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 음부는 둥근 대야 같습니다.’ 이 히브리어는 이 시적 문맥에서 ‘배꼽’보다 더 성적 의미일 가능성도 있어 논의됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘향료를 탄 포도주’. 히브리어는 섞인 포도주를 가리키며, 물이나 향료가 더해진 술일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 자궁은 밀 더미 같습니다.’ 이 표현은 내부 장기를 뜻하는 것으로 읽을 수도 있으나, 문맥상 ‘배’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְרֵךְ
  english_pob_choice: your navel
  chosen_korean: 당신의 배꼽
  alternatives_korean:
  - 당신의 음부
  - 당신의 womb(자궁)
  lexicon: HALOT, BDB
  rationale: 기본 의미를 살려 현대 한국어에서 가장 자연스러운 해부학적 대응인 ‘배꼽’을 택했습니다. 다만 이 시적 문맥에는 다른 성적·내장적 해석 가능성도 있어 각주로 보존했습니다.
- source_word: אַגַּן הַסַּהַר
  english_pob_choice: a rounded bowl
  chosen_korean: 둥근 대야
  alternatives_korean:
  - 둥근 그릇
  - 달 모양의 대야
  lexicon: HALOT, BDB
  rationale: ‘대야/그릇’은 용기 이미지를 살리고, ‘둥근’은 원형성을 자연스럽게 전달합니다. ‘달 모양’은 가능하지만 해석을 과도하게 좁힐 수 있어 본문에는 넣지 않았습니다.
- source_word: הַמָּזֶג
  english_pob_choice: mixed wine
  chosen_korean: 섞은 포도주
  alternatives_korean:
  - 혼합 포도주
  - 향료를 섞은 포도주
  lexicon: HALOT, BDB
  rationale: 히브리어의 ‘섞인’ 의미를 직접 드러내어 ‘섞은 포도주’로 옮겼습니다. 영어 주석의 ‘spiced wine’ 뉘앙스는 가능하지만 본문은 더 직접적인 표현을 택했습니다.
- source_word: בִּטְנֵךְ
  english_pob_choice: your belly
  chosen_korean: 당신의 배
  alternatives_korean:
  - 당신의 복부
  - 당신의 자궁
  lexicon: HALOT, BDB
  rationale: 외형을 그리는 블라존 문맥에서 외부 신체부위인 ‘배’가 가장 자연스럽습니다. ‘자궁’ 해석은 각주로 남기고 본문은 덜 단정적인 표현을 유지했습니다.
- source_word: סוּגָה בַּשּׁוֹשַׁנִּים
  english_pob_choice: encircled with lilies
  chosen_korean: 백합꽃들 가운데 둘러싸여
  alternatives_korean:
  - 백합으로 둘러싸여
  - 백합꽃 사이에 둘러싸여
  lexicon: HALOT, BDB
  rationale: 수동적 ‘둘러싸여’의 의미를 살리되, 전치사 בַּ의 포함/둘레 감각을 반영해 ‘가운데’로 자연스럽게 풀었습니다. ‘백합꽃들’은 복수적 시적 이미지를 드러냅니다.
theological_decisions:
- issue: 노골적 신체 은유의 번역 강도
  chosen_reading: 히브리어의 시적 에로티시즘을 약화하지 않고, 본문이 허용하는 범위 안에서 신체적 이미지를 직접적으로 유지했습니다.
  alternative_readings:
  - 더 완곡하게 바꾸어 성적 긴장을 낮춘 번역
  - 전통적 경건어로 순화한 번역
  rationale: 아가서의 문맥은 애정과 육체적 아름다움을 의도적으로 노래하므로, 과도한 완곡화는 본문의 효과를 훼손할 수 있습니다.
  doctrine_reference: 성경 본문의 장르 존중 및 아가서의 시적-에로틱 문맥
