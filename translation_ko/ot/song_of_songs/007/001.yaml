id: SNG.7.1
reference: Song of Songs 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁ֤וּבִי שׁ֨וּבִי֙ הַ/שּׁ֣וּלַמִּ֔ית שׁ֥וּבִי שׁ֖וּבִי וְ/נֶחֱזֶה בָּ֑/ךְ מַֽה תֶּחֱזוּ֙ בַּ/שּׁ֣וּלַמִּ֔ית כִּ/מְחֹלַ֖ת הַֽ/מַּחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/001.yaml
  text: Return[a], return, O Shulammite; return, return, that we may look at you[b]. Why do you look at the Shulammite as at the dance of Mahanaim?
  footnotes:
  - marker: a
    text: Or, 'What do you see in the Shulammite?—like the dance of Mahanaim.' The Hebrew of this clause is difficult, and some translations construe the question with 'what' rather than 'why.'
    reason: alternative_reading
  - marker: b
    text: Mahanaim is likely the place name Mahanaim; the name itself may mean 'two camps.'
    reason: cultural_note
translation:
  language: ko
  text: 돌아오십시오[a], 돌아오십시오, 술람미 여인아. 돌아오십시오, 돌아오십시오. 우리가 당신을 보게 하십시오[b]. 술람미 여인을 왜 바라보십니까? 마하나임의 춤과 같이 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘술람미 여인에게서 무엇을 보십니까?—마하나임의 춤과 같이.’로 옮길 수도 있습니다. 이 절의 히브리어는 어렵기 때문에, 일부 번역은 ‘왜’보다 ‘무엇’으로 질문을 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 마하나임은 지명인 ‘마하나임’을 가리키는 것으로 보이며, 이름 자체는 ‘두 진영’이라는 뜻일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבִי
  english_pob_choice: Return
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 돌아오라
  - 다시 오십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형 שוב의 반복적 호출을 한국어 공손 명령으로 옮겨, 시적 압박감과 직접성을 살렸습니다.
- source_word: הַשּׁוּלַמִּית
  english_pob_choice: Shulammite
  chosen_korean: 술람미 여인
  alternatives_korean:
  - 술람미
  - 술람미 사람
  lexicon: HALOT
  rationale: 고유 명칭을 음역하되, 한국어에서 호칭되는 대상이 분명하도록 ‘여인’을 덧붙였습니다. 이는 지칭의 성격을 해치지 않으면서도 문맥상 자연스럽습니다.
- source_word: וְנֶחֱזֶה בָּךְ
  english_pob_choice: that we may look at you
  chosen_korean: 우리가 당신을 보게 하십시오
  alternatives_korean:
  - 우리가 당신을 바라보게 하십시오
  - 우리가 당신을 보도록 하십시오
  lexicon: HALOT
  rationale: 히브리어의 목적/결과 뉘앙스를 한국어 사역형으로 옮겨, 반복되는 초청의 의도를 분명히 했습니다.
- source_word: תֶּחֱזוּ
  english_pob_choice: do you look
  chosen_korean: 바라보십니까
  alternatives_korean:
  - 보십니까
  - 응시하십니까
  lexicon: HALOT
  rationale: חזה의 관조적 의미를 살리되 현대 한국어에서 과도하게 문어적인 ‘응시하다’를 피하고, 질문의 시선을 자연스럽게 표현했습니다.
- source_word: כִּמְחֹלַת
  english_pob_choice: as at the dance of
  chosen_korean: 춤과 같이
  alternatives_korean:
  - 춤처럼
  - 무도회처럼
  lexicon: HALOT
  rationale: 비교 표지 כ를 살려, 뒤의 지명과 결합된 관용적 비교를 한국어의 ‘~와 같이’로 옮겼습니다.
- source_word: הַמַּחֲנָיִם
  english_pob_choice: Mahanaim
  chosen_korean: 마하나임
  alternatives_korean:
  - 두 진영
  - 마하나임 성읍
  lexicon: HALOT
  rationale: 지명으로 보는 POB의 판단을 따르고 음역을 유지했습니다. 본문의 핵심은 장소 명칭 자체이지 어원 해석이 아니므로, 본문 안에서는 번역하지 않았습니다.
theological_decisions:
- issue: 화자 수사와 시점의 직접성
  chosen_reading: 후반부를 현재형 질문으로 유지해, 장면 안의 청중이 술람미 여인을 바라보는 시선을 그대로 드러냈습니다.
  alternative_readings:
  - ‘왜 술람미 여인을 보려 하십니까’처럼 의도 설명을 덧붙이는 읽기
  - ‘무엇을 보십니까’로 מה를 옮기는 읽기
  rationale: 히브리어 질문은 단순 정보 요청보다 수사적 대조를 형성하므로, 현대 한국어에서도 장면의 직접성을 보존하는 것이 더 적절합니다.
  doctrine_reference: 시가서의 시적·수사적 문맥 보존
