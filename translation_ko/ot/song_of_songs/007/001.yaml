  - 술람미 사람
  lexicon: HALOT
  rationale: 고유 명칭을 음역하되, 한국어에서 호칭되는 대상이 분명하도록 ‘여인’을 덧붙였습니다. 이는 지칭의 성격을 해치지 않으면서도 문맥상 자연스럽습니다.
- source_word: וְנֶחֱזֶה בָּךְ
  english_pob_choice: that we may look at you
  chosen_korean: 우리가 당신을 보게 하십시오
  alternatives_korean:
  - 우리가 당신을 바라보게 하십시오
  - 우리가 당신을 보도록 하십시오
  lexicon: HALOT
  rationale: 히브리어의 목적/결과 뉘앙스를 한국어 사역형으로 옮겨, 반복되는 초청의 의도를 분명히 했습니다.
- source_word: תֶּחֱזוּ
  english_pob_choice: do you look
  chosen_korean: 바라보십니까
  alternatives_korean:
  - 보십니까
  - 응시하십니까
  lexicon: HALOT
  rationale: חזה의 관조적 의미를 살리되 현대 한국어에서 과도하게 문어적인 ‘응시하다’를 피하고, 질문의 시선을 자연스럽게 표현했습니다.
- source_word: כִּמְחֹלַת
  english_pob_choice: as at the dance of
  chosen_korean: 춤과 같이
  alternatives_korean:
  - 춤처럼
  - 무도회처럼
  lexicon: HALOT
  rationale: 비교 표지 כ를 살려, 뒤의 지명과 결합된 관용적 비교를 한국어의 ‘~와 같이’로 옮겼습니다.
- source_word: הַמַּחֲנָיִם
  english_pob_choice: Mahanaim
  chosen_korean: 마하나임
  alternatives_korean:
  - 두 진영
  - 마하나임 성읍
  lexicon: HALOT
  rationale: 지명으로 보는 POB의 판단을 따르고 음역을 유지했습니다. 본문의 핵심은 장소 명칭 자체이지 어원 해석이 아니므로, 본문 안에서는 번역하지 않았습니다.
theological_decisions:
- issue: 화자 수사와 시점의 직접성
  chosen_reading: 후반부를 현재형 질문으로 유지해, 장면 안의 청중이 술람미 여인을 바라보는 시선을 그대로 드러냈습니다.
  alternative_readings:
  - ‘왜 술람미 여인을 보려 하십니까’처럼 의도 설명을 덧붙이는 읽기
  - ‘무엇을 보십니까’로 מה를 옮기는 읽기
  rationale: 히브리어 질문은 단순 정보 요청보다 수사적 대조를 형성하므로, 현대 한국어에서도 장면의 직접성을 보존하는 것이 더 적절합니다.
  doctrine_reference: 시가서의 시적·수사적 문맥 보존
