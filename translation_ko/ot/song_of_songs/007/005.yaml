id: SNG.7.5
reference: Song of Songs 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַוָּארֵ֖/ךְ כְּ/מִגְדַּ֣ל הַ/שֵּׁ֑ן עֵינַ֜יִ/ךְ בְּרֵכ֣וֹת בְּ/חֶשְׁבּ֗וֹן עַל שַׁ֨עַר֙ בַּת רַבִּ֔ים אַפֵּ/ךְ֙ כְּ/מִגְדַּ֣ל הַ/לְּבָנ֔וֹן צוֹפֶ֖ה פְּנֵ֥י דַמָּֽשֶׂק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/005.yaml
  text: Your neck is like a tower of ivory[a]; your eyes are pools in Heshbon, by the gate of Bath-rabbim. Your nose is like the tower of Lebanon[c][b], looking toward Damascus.
  footnotes:
  - marker: a
    text: Or 'by the gate of the populous city' or 'by the gate of many.' The Hebrew phrase 'Bath-rabbim' may be a place name or may carry a descriptive sense.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'nose.' The image likely praises the beloved's noble profile rather than isolating a feature in a modern awkward sense.
    reason: cultural_note
  - marker: c
    text: Or 'overlooking Damascus' or 'facing Damascus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 목은 상아 망대 같고, 당신의 눈은 헤스본의 못들, 바드랍빔의 성문 곁에 있으며, 당신의 코는 레바논의 망대 같아 다마스쿠스를 바라봅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사람이 많은 도시의 성문 곁에' 또는 '많은 자의 성문 곁에'. 히브리어 '바드랍빔'은 지명일 수도 있고, 서술적 의미를 지닐 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 '코'입니다. 이 이미지는 현대 독자에게 어색할 수 있으나, 아리따운 옆모습과 기품을 칭찬하는 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 '다마스쿠스를 내려다보며' 또는 '다마스쿠스를 마주하며'.
    reason: alternative_reading
lexical_decisions:
- source_word: צַוָּארֵךְ
  english_pob_choice: your neck
  chosen_korean: 당신의 목
  alternatives_korean:
  - 당신의 목덜미
  lexicon: HALOT
  rationale: 히브리어 צוּאָר은 목/목덜미를 가리키며, 시적 칭송 문맥에서는 자연스럽고 표준적인 '목'이 가장 매끄럽습니다.
- source_word: כְּמִגְדַּל הַשֵּׁן
  english_pob_choice: like a tower of ivory
  chosen_korean: 상아 망대 같고
  alternatives_korean:
  - 상아의 망대 같고
  - 상아로 된 망대 같고
  lexicon: HALOT
  rationale: 문맥상 문자 그대로 '이빨의 탑'이 아니라 상아를 가리키는 관용적 표현이므로, POB의 의미를 따라 '상아 망대'로 옮겼습니다.
- source_word: בְּרֵכוֹת בְּחֶשְׁבּוֹן
  english_pob_choice: pools in Heshbon
  chosen_korean: 헤스본의 못들
  alternatives_korean:
  - 헤스본의 연못들
  - 헤스본의 못
  lexicon: HALOT
  rationale: בְּרֵכוֹת는 물웅덩이/연못/못을 뜻하며, 복수형을 살려 '못들'로 옮겨 눈의 반짝임과 고요한 수면의 이미지를 보존했습니다.
- source_word: עַל שַׁעַר בַּת רַבִּים
  english_pob_choice: by the gate of Bath-rabbim
  chosen_korean: 바드랍빔의 성문 곁에
  alternatives_korean:
  - 바드랍빔의 성문에
  - 바드랍빔의 성문 앞에
  - 사람이 많은 도시의 성문 곁에
  lexicon: HALOT
  rationale: 바드랍빔을 고유지명으로 두는 POB의 처리에 따라 음역을 유지했고, עַל은 위치 관계가 자연스러운 '곁에'로 옮겼습니다.
- source_word: אַפֵּךְ
  english_pob_choice: your nose
  chosen_korean: 당신의 코
  alternatives_korean:
  - 당신의 얼굴
  lexicon: HALOT
  rationale: 히브리어 אַף는 여기서 '코'를 뜻하며, POB가 지적하듯 현대 독자에게 어색하더라도 구체적 신체 이미지 자체를 보존하는 것이 원문의 의도에 가깝습니다.
- source_word: כְּמִגְדַּל הַלְּבָנוֹן
  english_pob_choice: like the tower of Lebanon
  chosen_korean: 레바논의 망대 같아
  alternatives_korean:
  - 레바논의 탑 같아
  - 레바논 망대 같아
  lexicon: HALOT
  rationale: 정관사의 있는 구성은 특정한 랜드마크 또는 이상화된 표지를 가리킬 수 있으므로, 원형을 살려 '레바논의 망대'로 옮겼습니다.
- source_word: צוֹפֶה פְּנֵי דַמָּשֶׂק
  english_pob_choice: looking toward Damascus
  chosen_korean: 다마스쿠스를 바라봅니다
  alternatives_korean:
  - 다마스쿠스를 향해 바라봅니다
  - 다마스쿠스를 마주 보고 있습니다
  lexicon: HALOT
  rationale: צוֹפֶה와 פְּנֵי는 '향하여/마주하여'의 방향성을 나타내므로, 시적이면서도 자연스러운 '바라봅니다'로 옮겼습니다.
theological_decisions:
- issue: 시적 열거와 인체 이미지의 직설성
  chosen_reading: 목, 눈, 코를 구체적으로 드러내는 직설적 이미지를 유지했습니다.
  alternative_readings:
  - '''코''를 ''얼굴''로 완화하는 읽기'
  - 신체 이미지를 더 우회적으로 처리하는 읽기
  rationale: 본문은 신부의 아름다움을 실제 신체 부위의 비유로 찬미하는 blazon 형식이므로, 현대 독자에게 어색해도 원문의 강한 시각적 효과를 보존하는 것이 적절합니다.
  doctrine_reference: 시가의 문학 장르와 직설적 은유 보존
- issue: 바드랍빔의 의미 불확실성
  chosen_reading: 고유지명 처리로 본문에 두고, 의미 확정은 하지 않았습니다.
  alternative_readings:
  - '''사람이 많은 도시의 성문''이라는 묘사적 번역'
  - '''많은 자의 성문''이라는 직역'
  rationale: POB가 주석에서 밝히듯 이 표현은 지명일 수도, 서술적 표현일 수도 있으므로 본문에서는 확정하지 않고 음역을 유지하는 편이 원문과 주석의 긴장을 더 잘 보존합니다.
  doctrine_reference: 불확실한 고유명사 처리 원칙
