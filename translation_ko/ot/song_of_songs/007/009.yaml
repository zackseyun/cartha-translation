source:
  edition: WLC
  text: אָמַ֨רְתִּי֙ אֶעֱלֶ֣ה בְ/תָמָ֔ר אֹֽחֲזָ֖ה בְּ/סַנְסִנָּ֑י/ו וְ/יִֽהְיוּ נָ֤א שָׁדַ֨יִ/ךְ֙ כְּ/אֶשְׁכְּל֣וֹת הַ/גֶּ֔פֶן וְ/רֵ֥יחַ אַפֵּ֖/ךְ כַּ/תַּפּוּחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/009.yaml
  text: I said[a], “I will climb the palm tree; I will take hold of its branches. May your breasts be like clusters of the vine[b], and the fragrance of your breath like apples.”
  footnotes:
  - marker: a
    text: Or 'its boughs' or 'its fruit stalks'; the Hebrew term refers to the palm's branches or fruit-bearing shoots.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your nose.' The image likely refers to the fragrance associated with her breath or the area of her face, not merely shape.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 말했습니다[a], “나는 종려나무로 올라가 그 가지들을 붙들겠습니다. 당신의 젖가슴은 포도덩굴의 송이들 같고[b], 당신의 콧망울의 향기는 사과들 같기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 가지들’ 혹은 ‘그 열매자루들’. 히브리어 표현은 종려나무의 가지나 열매 맺는 새순을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘당신의 코’입니다. 이 이미지는 단순한 모양보다, 그녀의 호흡이나 얼굴 부위와 연결된 향기로운 인상을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱלֶה בְ/תָמָר
  english_pob_choice: I will climb the palm tree
  chosen_korean: 나는 종려나무로 올라가
  alternatives_korean:
  - 나는 종려나무를 타고 올라가
  - 나는 야자나무로 올라가
  lexicon: HALOT
  rationale: עלה는 문자적으로 ‘올라가다’이지만, 종려나무와 함께 쓰일 때 한국어에서는 ‘올라가다’가 자연스럽고, ‘종려나무’는 시적·식물학적 이미지를 함께 살립니다.
- source_word: סַנְסִנָּיו
  english_pob_choice: its branches
  chosen_korean: 그 가지들을 붙들겠습니다
  alternatives_korean:
  - 그 가지들을 잡겠습니다
  - 그 열매자루들을 붙들겠습니다
  lexicon: HALOT
  rationale: 이 단어는 종려나무의 가지 또는 열매 맺는 새순을 가리킬 수 있어, 본문 의미를 과도하게 좁히지 않는 ‘가지들’이 적절합니다.
- source_word: שָׁדַיִךְ
  english_pob_choice: your breasts
  chosen_korean: 당신의 젖가슴은
  alternatives_korean:
  - 당신의 가슴은
  - 당신의 유방은
  lexicon: HALOT
  rationale: 히브리어가 직접적으로 몸의 이 부분을 가리키므로, 완곡화하지 않고 한국어에서 가장 직접적인 표현을 택했습니다.
- source_word: אַפֵּךְ
  english_pob_choice: your breath
  chosen_korean: 당신의 콧망울의 향기는
  alternatives_korean:
  - 당신의 숨결의 향기는
  - 당신의 코의 향기는
  lexicon: HALOT
  rationale: POB의 주석처럼 히브리어 אַף는 단순한 ‘코’보다 얼굴/호흡과 관련된 후각적 이미지를 띨 수 있으므로, ‘콧망울의 향기’로 감각적 연결을 살렸습니다.
- source_word: כַּ/תַּפּוּחִים
  english_pob_choice: like apples
  chosen_korean: 사과들 같기를 바랍니다
  alternatives_korean:
  - 사과 같기를 바랍니다
  - 향기로운 사과들 같기를 바랍니다
  lexicon: HALOT
  rationale: תפוחים의 표준 대응은 ‘사과’이며, 복수형 이미지를 살리기 위해 ‘사과들’을 사용했습니다.
theological_decisions:
- issue: 노골적인 신체적·감각적 시어의 보존
  chosen_reading: 에로틱한 비유를 완곡하게 희석하지 않고 ‘젖가슴’, ‘향기’ 같은 직설적 이미지를 유지했습니다.
  alternative_readings:
  - 가슴
  - 숨결
  rationale: 아가의 시는 본문이 의도한 감각적, 신체적 비유를 유지하는 것이 중요하므로, 전통적 경건 표현으로 완화하지 않았습니다.
  doctrine_reference: 성경 본문의 장르와 표층 의미 보존 원칙
- issue: 콧망울/숨결의 해석적 여지
  chosen_reading: ‘콧망울의 향기’로 옮겨, 코 자체가 아니라 향기와 관련된 신체 부위를 암시하는 시적 표현을 드러냈습니다.
  alternative_readings:
  - 당신의 코의 향기는
  - 당신의 숨결의 향기는
  rationale: POB의 주석은 אַף가 단순한 해부학 용어를 넘어 향기와 연결된 이미지일 수 있음을 지적하므로, 한 가지로 단정하기보다 시어의 중첩을 살렸습니다.
  doctrine_reference: 본문 의미의 복합성 보존 원칙
