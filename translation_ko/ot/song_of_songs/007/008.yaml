id: SNG.7.8
reference: Song of Songs 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֹ֤את קֽוֹמָתֵ/ךְ֙ דָּֽמְתָ֣ה לְ/תָמָ֔ר וְ/שָׁדַ֖יִ/ךְ לְ/אַשְׁכֹּלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/008.yaml
  text: This stature of yours is like a palm tree[a], and your breasts are like clusters of fruit.
  footnotes:
  - marker: a
    text: Or 'like grape clusters.' The Hebrew 'clusters' often refers to clusters of grapes, though the noun itself is not explicitly qualified here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 당신의 키가 종려나무 같고, 당신의 가슴은 포도송이 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도송이들처럼’으로 옮길 수 있습니다. 히브리어 ‘송이’는 흔히 포도송이를 가리키지만, 이 명사 자체에 포도가 명시되어 있지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת קוֹמָתֵךְ
  english_pob_choice: This stature of yours
  chosen_korean: 이것은 당신의 키가
  alternatives_korean:
  - 당신의 몸매는
  - 당신의 자태는
  - 당신의 키는
  lexicon: HALOT
  rationale: זֹאת의 지시성을 살리되 한국어에서는 자연스럽게 문두의 「이것은」으로 옮기고, קוֹמָה는 외형적 ‘자태’보다 키/몸의 높이를 가리키므로 「키」로 렌더링했습니다.
- source_word: דָּמְתָה לְתָמָר
  english_pob_choice: is like a palm tree
  chosen_korean: 종려나무 같고
  alternatives_korean:
  - 야자나무 같고
  - 대추야자나무 같고
  - 종려 같고
  lexicon: HALOT
  rationale: תָמָר는 시어에서 종려나무를 가리키는 것이 자연스러워, 비교 관계를 분명히 하는 「같고」로 연결했습니다.
- source_word: וְשָׁדַיִךְ
  english_pob_choice: and your breasts
  chosen_korean: 당신의 가슴은
  alternatives_korean:
  - 당신의 유방은
  - 당신의 젖가슴은
  - 당신의 젖은
  lexicon: HALOT
  rationale: שָׁדַיִם의 직접적 의미는 ‘가슴/유방’이지만, 한국어 출판 문맥에서 지나치게 노골적이거나 어색한 표현을 피하면서도 본문의 신체적·성적 이미지를 유지하는 「가슴」을 택했습니다.
- source_word: לְאַשְׁכֹּלוֹת
  english_pob_choice: like clusters of fruit
  chosen_korean: 포도송이 같습니다
  alternatives_korean:
  - 송이 같습니다
  - 과일 송이 같습니다
  - 포도송이와 같습니다
  lexicon: HALOT
  rationale: אַשְׁכֹּלוֹת는 일반적으로 포도송이를 가리키는 경우가 많아, 한국어 관용적 비유로는 「포도송이」가 가장 자연스럽습니다. 본문 자체는 일반 ‘clusters’이므로 보다 구체적인 해석임을 본문에 남기되, 대안은 주석으로 보존합니다.
theological_decisions:
- issue: 에로틱한 신체 묘사의 직역 정도
  chosen_reading: 신체 명칭을 완화하지 않고 시적 비유로 그대로 살렸습니다.
  alternative_readings:
  - 아름다움으로 완곡하게 처리하기
  - 몸의 곡선으로 순화하기
  rationale: 아가서는 본문의 사랑 노래와 육체적 이미지를 의도적으로 드러내므로, 의미를 약화시키는 완곡어보다 소스가 전달하는 직접성을 유지하는 것이 타당합니다.
  doctrine_reference: 아가서의 문자적·시적 읽기
- issue: ‘clusters’의 구체성
  chosen_reading: 본문은 ‘송이’로 두되, 관례상 포도송이로 이해되는 여지를 주석으로 남깁니다.
  alternative_readings:
  - 그냥 ‘송이’로 유지하기
  - 명시적으로 ‘포도송이’로 본문에 확정하기
  rationale: 히브리어 אַשְׁכֹּלוֹת 자체는 구체적으로 포도를 명시하지 않으므로, 본문은 이미지의 일반성을 유지하고, 독자 이해를 돕는 구체화는 주석에서 처리하는 편이 균형적입니다.
  doctrine_reference: 시어의 비유적 언어 보존
