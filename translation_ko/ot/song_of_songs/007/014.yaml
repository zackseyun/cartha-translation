  - 향내를 풍기고
  lexicon: HALOT
  rationale: 동사와 명사의 감각적 결합을 살려, 단순한 ‘향기가 있다’보다 퍼져 나오는 냄새의 이미지를 드러내는 표현으로 옮겼습니다.
- source_word: וְעַל פְּתָחֵינוּ
  english_pob_choice: at our doorways
  chosen_korean: 우리의 문간에는
  alternatives_korean:
  - 우리의 문 앞에는
  - 우리의 출입구에는
  lexicon: HALOT
  rationale: פֶּתַח의 ‘열린 입구/문간’ 의미를 반영하여, 시적 공간감이 살아나는 ‘문간’으로 옮겼습니다.
- source_word: כָּל מְגָדִים חֲדָשִׁים גַּם יְשָׁנִים
  english_pob_choice: all choice fruits, new as well as old
  chosen_korean: 새것과 묵은 것을 아우르는 온갖 좋은 열매
  alternatives_korean:
  - 새것과 묵은 모든 진귀한 것들
  - 새것도 묵은 것도 다 된 온갖 진상품
  lexicon: HALOT
  rationale: מְגָדִים을 문맥상 농산물/진귀한 산물의 총칭으로 보되, 영어 주석의 ‘all choice fruits’와 ‘all delicacies / precious things’의 긴장을 살려 ‘좋은 열매’로 넓게 옮겼습니다. ‘새것과 묵은 것’은 원문의 대조를 보존합니다.
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑아
  alternatives_korean:
  - 내 사랑하는 이여
  - 나의 사랑
  lexicon: HALOT
  rationale: 아가서의 친밀한 호칭을 자연스러운 한국어 애정 호칭으로 옮기되, 지나치게 경건화하지 않고 시적 친밀감을 유지했습니다.
- source_word: צָפַנְתִּי לָךְ
  english_pob_choice: I have stored up for you
  chosen_korean: 내가 그것들을 당신을 위해 간직해 두었습니다
  alternatives_korean:
  - 당신을 위해 쌓아 두었습니다
  - 당신을 위해 저장해 두었습니다
  lexicon: HALOT
  rationale: צפן의 ‘간직하다/저장하다/쌓아 두다’ 가운데, 관계적 뉘앙스가 살아나는 ‘간직해 두었습니다’로 옮겼습니다. 여성 화자가 남성 수신자에게 말하는 맥락을 고려해 ‘당신’을 사용했습니다.
theological_decisions:
- issue: 아가서의 사랑 호칭을 지나치게 성문화하지 않을지
  chosen_reading: ‘내 사랑아’로 직접적이고 친밀한 연애시적 호칭을 유지했습니다.
  alternative_readings:
  - ‘내 사랑하는 이여’로 더 중립화하기
  - ‘내 연인아’로 현대화하기
  rationale: 본문은 결혼/사랑의 시적 대화를 말하며, 원문의 דּוֹדִי가 지닌 친밀성을 살리는 것이 의미 보존에 유리합니다.
  doctrine_reference: 아가서 7:14 문맥
