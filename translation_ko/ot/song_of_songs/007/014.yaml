  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ/דּוּדָאִ֣ים נָֽתְנוּ רֵ֗יחַ וְ/עַל פְּתָחֵ֨י/נוּ֙ כָּל מְגָדִ֔ים חֲדָשִׁ֖ים גַּם יְשָׁנִ֑ים דּוֹדִ֖/י צָפַ֥נְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
  footnotes:
  - marker: a
    text: Or 'love-apples' for 'mandrakes,' reflecting the plant's traditional association with love and fertility.
    reason: lexical_alternative
  - marker: b
    text: Or 'all delicacies' or 'all precious things' for 'all choice fruits.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 두다임이 향기를 내뿜고, 우리의 문간에는 새것과 묵은 것을 아우르는 온갖 좋은 열매가 있으며, 내 사랑아, 내가 그것들을 당신을 위해 간직해 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두다임’은 전통적으로 ‘만드레이크’로도 옮길 수 있는 식물 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘좋은 열매’는 여기서 ‘온갖 진귀한 것들’ 또는 ‘온갖 진미’까지 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  english_pob_choice: the mandrakes
  chosen_korean: 그 두다임
  alternatives_korean:
  - 그 만드레이크
  - 그 사랑사과
  lexicon: HALOT
  rationale: 두다임은 히브리어 음차를 살리되, 주석에서 식물 명칭과 사랑·다산 연상을 확인할 수 있도록 했습니다. 한국어에서 ‘만드레이크’보다 원형에 가까운 ‘두다임’이 본문-대응성이 높습니다.
- source_word: נָתְנוּ רֵיחַ
  english_pob_choice: give off fragrance
  chosen_korean: 향기를 내뿜고
  alternatives_korean:
  - 향기를 내고
  - 향내를 풍기고
  lexicon: HALOT
  rationale: 동사와 명사의 감각적 결합을 살려, 단순한 ‘향기가 있다’보다 퍼져 나오는 냄새의 이미지를 드러내는 표현으로 옮겼습니다.
- source_word: וְעַל פְּתָחֵינוּ
  english_pob_choice: at our doorways
  chosen_korean: 우리의 문간에는
  alternatives_korean:
  - 우리의 문 앞에는
  - 우리의 출입구에는
  lexicon: HALOT
  rationale: פֶּתַח의 ‘열린 입구/문간’ 의미를 반영하여, 시적 공간감이 살아나는 ‘문간’으로 옮겼습니다.
- source_word: כָּל מְגָדִים חֲדָשִׁים גַּם יְשָׁנִים
  english_pob_choice: all choice fruits, new as well as old
  chosen_korean: 새것과 묵은 것을 아우르는 온갖 좋은 열매
  alternatives_korean:
  - 새것과 묵은 모든 진귀한 것들
  - 새것도 묵은 것도 다 된 온갖 진상품
  lexicon: HALOT
  rationale: מְגָדִים을 문맥상 농산물/진귀한 산물의 총칭으로 보되, 영어 주석의 ‘all choice fruits’와 ‘all delicacies / precious things’의 긴장을 살려 ‘좋은 열매’로 넓게 옮겼습니다. ‘새것과 묵은 것’은 원문의 대조를 보존합니다.
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑아
  alternatives_korean:
  - 내 사랑하는 이여
  - 나의 사랑
  lexicon: HALOT
  rationale: 아가서의 친밀한 호칭을 자연스러운 한국어 애정 호칭으로 옮기되, 지나치게 경건화하지 않고 시적 친밀감을 유지했습니다.
- source_word: צָפַנְתִּי לָךְ
  english_pob_choice: I have stored up for you
  chosen_korean: 내가 그것들을 당신을 위해 간직해 두었습니다
  alternatives_korean:
  - 당신을 위해 쌓아 두었습니다
  - 당신을 위해 저장해 두었습니다
  lexicon: HALOT
  rationale: צפן의 ‘간직하다/저장하다/쌓아 두다’ 가운데, 관계적 뉘앙스가 살아나는 ‘간직해 두었습니다’로 옮겼습니다. 여성 화자가 남성 수신자에게 말하는 맥락을 고려해 ‘당신’을 사용했습니다.
theological_decisions:
- issue: 아가서의 사랑 호칭을 지나치게 성문화하지 않을지
  chosen_reading: ‘내 사랑아’로 직접적이고 친밀한 연애시적 호칭을 유지했습니다.
  alternative_readings:
  - ‘내 사랑하는 이여’로 더 중립화하기
  - ‘내 연인아’로 현대화하기
  rationale: 본문은 결혼/사랑의 시적 대화를 말하며, 원문의 דּוֹדִי가 지닌 친밀성을 살리는 것이 의미 보존에 유리합니다.
  doctrine_reference: 아가서 7:14 문맥
