  text: הַֽ/דּוּדָאִ֣ים נָֽתְנוּ רֵ֗יחַ וְ/עַל פְּתָחֵ֨י/נוּ֙ כָּל מְגָדִ֔ים חֲדָשִׁ֖ים גַּם יְשָׁנִ֑ים דּוֹדִ֖/י צָפַ֥נְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
  footnotes:
  - marker: a
    text: Or 'love-apples' for 'mandrakes,' reflecting the plant's traditional association with love and fertility.
    reason: lexical_alternative
  - marker: b
    text: Or 'all delicacies' or 'all precious things' for 'all choice fruits.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만드레이크가[a] 향기를 풍기고, 우리 문간에는 새것과 묵은 것, 온갖 귀한 열매가[b] 있습니다. 내 사랑아, 내가 당신을 위해 그것들을 간직해 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만드레이크’는 히브리어 ‘두다임’(דּוּדָאִים)을 옮긴 식물 이름입니다. ‘사랑사과’로도 옮길 수 있는데, 이는 이 식물이 전통적으로 사랑과 다산과 관련된 것으로 여겨졌기 때문입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘귀한 열매’는 ‘온갖 진귀한 것들’ 또는 ‘온갖 진미’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  english_pob_choice: the mandrakes
  chosen_korean: 그 두다임
  alternatives_korean:
  - 그 만드레이크
  - 그 사랑사과
  lexicon: HALOT
  rationale: 두다임은 히브리어 음차를 살리되, 주석에서 식물 명칭과 사랑·다산 연상을 확인할 수 있도록 했습니다. 한국어에서 ‘만드레이크’보다 원형에 가까운 ‘두다임’이 본문-대응성이 높습니다.
