id: SNG.7.7
reference: Song of Songs 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה יָּפִית֙ וּ/מַה נָּעַ֔מְתְּ אַהֲבָ֖ה בַּ/תַּֽעֲנוּגִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/007.yaml
  text: How beautiful and how delightful you are[a], O love[b], with your pleasures!
  footnotes:
  - marker: a
    text: Or 'among delights' or 'in delights.' The Hebrew phrase בַּתַּעֲנוּגִים is compact and may describe either the sphere of delight or the beloved as characterized by delights.
    reason: lexical_alternative
  - marker: b
    text: Or 'my love' or 'beloved.' The Hebrew אַהֲבָה is literally 'love' and functions here as a term of address.
    reason: lexical_alternative
translation:
  language: ko
  text: 얼마나 아름답고 얼마나 즐거우신지요, 사랑이여, 즐거움들 가운데서![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘즐거움들 가운데서’, ‘즐거움들 속에서’입니다. 히브리어 בַּתַּעֲנוּגִים은 간결한 표현으로, 즐거움의 영역을 가리키거나, 즐거움으로 특징지어진 대상을 묘사할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 사랑’, ‘사랑하는 이’입니다. 히브리어 אַהֲבָה는 문자적으로는 ‘사랑’이며, 여기서는 호칭으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפִית
  english_pob_choice: How beautiful you are
  chosen_korean: 얼마나 아름답고
  alternatives_korean:
  - 얼마나 아름다우신지
  - 어찌 그리 아름다운지
  lexicon: HALOT
  rationale: 감탄사 מַה와 형용사 יפה의 감탄문을 한국어 자연스러운 감탄형으로 옮기되, 시적 평행을 살려 ‘얼마나 아름답고’로 시작했습니다.
- source_word: וּמַה נָּעַמְתְּ
  english_pob_choice: and how delightful you are
  chosen_korean: 얼마나 즐거우신지요
  alternatives_korean:
  - 얼마나 사랑스러우신지요
  - 얼마나 기쁘신지요
  lexicon: HALOT
  rationale: נעם의 ‘pleasant/delightful’ 의미를 현대 한국어의 시적 어감인 ‘즐겁다’ 계열로 옮겨, 앞 구절과 나란히 감탄을 형성하도록 했습니다.
- source_word: אַהֲבָה
  english_pob_choice: O love
  chosen_korean: 사랑이여
  alternatives_korean:
  - 오 사랑이여
  - 사랑님이여
  - 사랑이여, 그대여
  lexicon: HALOT
  rationale: 직접 호격으로 쓰인 אַהֲבָה를 ‘사랑이여’로 옮겨, POB의 ‘O love’가 가진 호칭적 기능을 살렸습니다.
- source_word: בַּתַּעֲנוּגִים
  english_pob_choice: with your pleasures
  chosen_korean: 즐거움들 가운데서
  alternatives_korean:
  - 즐거움들 속에서
  - 기쁨들 가운데서
  - 쾌락들 가운데서
  lexicon: HALOT
  rationale: ב + 복수형 תַּעֲנוּגִים는 ‘즐거움/기쁨의 영역’ 또는 ‘즐거움 가운데’의 뜻을 띨 수 있으므로, 소스에 충실하게 ‘즐거움들 가운데서’로 옮겼습니다.
theological_decisions:
- issue: אַהֲבָה의 호격 처리
  chosen_reading: 사랑이여로 옮겨, 연애적 시어이면서도 직접 호칭이라는 문법적 기능을 유지했습니다.
  alternative_readings:
  - 내 사랑이여
  - 사랑아
  rationale: 본문에는 소유격 ‘my’가 없으므로, 한국어에서 자연스럽더라도 ‘내 사랑’은 덧붙이지 않았습니다. 호격의 직접성을 우선했습니다.
  doctrine_reference: 본문 의미 보존 및 문법 기능 우선 원칙
- issue: בַּתַּעֲנוּגִים의 범위
  chosen_reading: ‘즐거움들 가운데서’로 처리해, 즐거움의 영역/동반이라는 중의적 가능성을 남겼습니다.
  alternative_readings:
  - 즐거움들 속에서
  - 기쁨 가운데
  rationale: 영문 POB가 제시한 ‘among delights / in delights’의 해석 여지를 한국어에서도 유지하는 것이 소스의 긴장을 보존하는 데 유리합니다.
  doctrine_reference: 시어의 의미 범위 보존
