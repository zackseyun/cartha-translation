  text: מַה יָּפ֧וּ פְעָמַ֛יִ/ךְ בַּ/נְּעָלִ֖ים בַּת נָדִ֑יב חַמּוּקֵ֣י יְרֵכַ֔יִ/ךְ כְּמ֣וֹ חֲלָאִ֔ים מַעֲשֵׂ֖ה יְדֵ֥י אָמָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/002.yaml
  text: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
  footnotes:
  - marker: a
    text: Or 'your hips' for 'your thighs.' The Hebrew term can refer more broadly to the hip/thigh region.
    reason: lexical_alternative
  - marker: b
    text: Or 'ornaments' or 'necklaces' for 'jewels.' The Hebrew likely refers to precious crafted adornments.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 두 발은 샌들 안에서 참으로 아름답습니다[a], 고귀한 딸이여! 당신의 넓적다리의 곡선은 보석[b] 같고, 그것은 숙련된 장인의 손이 만든 작품입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘발’뿐 아니라 더 넓게 ‘발걸음’ 또는 ‘다리’의 움직임을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘보석’ 외에 ‘장식품’이나 ‘목걸이’를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפוּ
  english_pob_choice: How beautiful
  chosen_korean: 참으로 아름답습니다
  alternatives_korean:
  - 얼마나 아름답습니까
  - 참 아름답습니다
  lexicon: HALOT
  rationale: 감탄을 나타내는 מַה를 한국어의 자연스러운 감탄 표현으로 옮기되, 단순 질문처럼 들리지 않도록 했습니다.
- source_word: פְעָמַיִךְ / בַּנְּעָלִים
  english_pob_choice: your feet in sandals
  chosen_korean: 당신의 두 발은 샌들 안에서
  alternatives_korean:
  - 당신의 발은 샌들을 신은 채
  - 당신의 발은 샌들을 신고
  lexicon: HALOT
  rationale: 발의 아름다움을 직접 말하는 시적 이미지를 살리면서, בַּנְּעָלִים의 위치감을 ‘샌들 안에서’로 비교적 직역했습니다.
- source_word: חַמּוּקֵי יְרֵכַיִךְ
  english_pob_choice: the curves of your thighs
  chosen_korean: 당신의 넓적다리의 곡선
  alternatives_korean:
  - 당신의 허벅지의 곡선
  - 당신의 엉덩이의 곡선
  lexicon: HALOT
  rationale: יְרֵךְ의 기본값인 넓적다리/허벅지 의미를 따라가되, 주석으로 더 넓은 해부학적 범위 가능성을 열어 두었습니다.
- source_word: חֲלָאִים
  english_pob_choice: jewels
  chosen_korean: 보석
  alternatives_korean:
  - 장신구
  - 목걸이
  lexicon: HALOT
  rationale: 정교하게 만든 귀중한 장식물을 가리키므로, 시적 비교를 살리기 위해 ‘보석’으로 옮겼습니다.
- source_word: מַעֲשֵׂה יְדֵי אָמָּן
  english_pob_choice: the work of the hands of a master craftsman
  chosen_korean: 숙련된 장인의 손이 만든 작품
  alternatives_korean:
  - 장인의 손으로 만든 작품
  - 능숙한 공예가의 손끝에서 나온 작품
  lexicon: HALOT
  rationale: ‘손’과 ‘만든’의 이미지를 유지하면서, אָמָּן의 숙련된 제작 능력을 현대 한국어로 자연스럽게 드러냈습니다.
