language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דּוֹדִ֗/י שָׁלַ֤ח יָד/וֹ֙ מִן הַ/חֹ֔ר וּ/מֵעַ֖/י הָמ֥וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/004.yaml
  text: My beloved put his hand through the opening[b][a], and my inward parts trembled for him.
  footnotes:
  - marker: a
    text: Or 'through the hole.' The Hebrew is literally 'from the hole,' likely referring to an opening in the door.
    reason: lexical_alternative
  - marker: b
    text: Or 'my insides were stirred for him' or 'my heart was moved for him.' The Hebrew speaks of deep inward emotion in bodily terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 사랑하는 이가 문 구멍으로 그의 손을 내밀었고, 내 속이 그를 위하여 떨었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구멍으로’. 히브리어는 문자적으로 ‘구멍에서’이며, 아마도 문의 열림을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 속이 그를 보고 들끓었습니다’ 또는 ‘내 마음이 그를 위해 움직였습니다’. 히브리어는 몸의 언어로 깊은 내적 감정을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이
  alternatives_korean:
  - 내 연인
  - 내 사랑하는 사람
  lexicon: HALOT
  rationale: 여성 화자의 애정 어린 호칭을 살리면서도, 한국어에서 비교적 자연스럽고 본문의 시적 톤을 유지합니다.
- source_word: מִן הַחֹר
  english_pob_choice: through the opening
  chosen_korean: 문 구멍으로
  alternatives_korean:
  - 구멍으로
  - 문의 구멍으로
  - 문을 통해
  lexicon: HALOT
  rationale: 본문의 구체적 이미지는 ‘문’과 연결된 구멍/열림을 가리키므로, 단순한 추상적 ‘열림’보다 ‘문 구멍으로’가 장면을 더 직접적으로 드러냅니다.
- source_word: וּמֵעַי
  english_pob_choice: my inward parts
  chosen_korean: 내 속
  alternatives_korean:
  - 내 심정
  - 내 내장
  - 내 마음
  lexicon: HALOT
  rationale: 히브리어의 신체적 내면 이미지를 살리되, ‘내장’의 거칠음을 피하고 현대 한국어에서 정서와 신체성을 함께 담는 표현으로 옮겼습니다.
- source_word: הָמוּ
  english_pob_choice: trembled
  chosen_korean: 떨었습니다
  alternatives_korean:
  - 요동쳤습니다
  - 움직였습니다
  - 동요했습니다
  lexicon: HALOT
  rationale: 내적 격동과 떨림의 비유를 간결하게 전달하며, ‘stirred’보다 이 문맥의 강한 정서적 흔들림을 더 자연스럽게 나타냅니다.
theological_decisions:
- issue: 히브리어 신체어 이미지의 보존
  chosen_reading: ‘내 속이 그를 위하여 떨었습니다’로, 감정을 ‘마음’으로 평준화하지 않고 몸-정서의 결합을 유지했습니다.
  alternative_readings:
  - ‘내 마음이 그를 위해 움직였습니다’
  - ‘내 심정이 그를 향해 동요했습니다’
  rationale: 본문은 사랑의 감정을 신체적 내면으로 표현하므로, 이를 심리적 표현으로만 바꾸면 시적 강도가 약해집니다.
  doctrine_reference: 시적-문학적 본문 해석 원리
