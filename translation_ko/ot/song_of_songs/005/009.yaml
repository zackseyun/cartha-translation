  source_fidelity: 히브리어의 반복된 비교 의문(מַה ... מִדּוֹד), 여성 مخاط자에 대한 호칭, 그리고 הִשְׁבַּעְתָּנוּ의 사역적 의미는 대체로 충실히 반영되었습니다. 다만 초안의 ‘사랑하는 이가 ... 나으십니까’는 사랑하는 이를 높이는 주체 높임으로, 원문에 없는 존대 관계를 부가합니다. 이를 일반적인 합쇼체 의문문으로 바로잡는 것이 적절합니다.
  naturalness: ‘당신의 사랑하는 이가 다른 사랑하는 이보다 무엇이 더 나으십니까?’는 주어와 높임 선어말의 결합이 문맥상 부자연스럽습니다. ‘사랑하는 이는 ... 무엇이 더 낫습니까?’가 현대 표준 한국어에서 자연스럽고, 비교 의문의 뜻도 분명합니다. 각주 표지도 해당 어휘와 동사에 각각 붙여 지시 대상을 명료하게 했습니다.
