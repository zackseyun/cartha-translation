id: SNG.5.9
reference: Song of Songs 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה דּוֹדֵ֣/ךְ מִ/דּ֔וֹד הַ/יָּפָ֖ה בַּ/נָּשִׁ֑ים מַה דּוֹדֵ֣/ךְ מִ/דּ֔וֹד שֶׁ/כָּ֖כָה הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/009.yaml
  text: What is your beloved more than another beloved[a], most beautiful among women? What is your beloved more than another beloved[b], that you have made us swear thus?
  footnotes:
  - marker: a
    text: Or 'your lover' throughout the verse; Hebrew דּוֹד can denote a beloved in a romantic sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'you adjured us' or 'you put us under oath'; the Hebrew verb means to cause someone to swear.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 사랑하는 이가 다른 사랑하는 이보다 무엇이 더 나으십니까? 여자들 가운데 가장 아름다운 분이시여, 당신의 사랑하는 이가 다른 사랑하는 이보다 무엇이 더 나으시기에, 당신이 우리에게 이처럼 맹세하게 하셨습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사랑하는 이’가 아니라 ‘연인’으로도 옮길 수 있습니다. 히브리어 דּוֹד는 이 절에서 낭만적 사랑의 대상자를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신이 우리에게 맹세하도록 하셨다’ 또는 ‘당신이 우리에게 서약하게 하셨다’로도 옮길 수 있습니다. 히브리어 동사는 어떤 사람에게 맹세하게 만드는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדֵךְ / דּוֹד
  english_pob_choice: your beloved / beloved
  chosen_korean: 사랑하는 이
  alternatives_korean:
  - 사랑하는 분
  - 연인
  - 사랑꾼
  lexicon: HALOT
  rationale: 아가서의 דּוֹד는 관계적·시적 맥락에서 ‘사랑하는 이’로 옮기면 애정의 의미를 살리면서도 현대 한국어에서 과도하게 구어적이거나 성적 뉘앙스로 흐르는 것을 피할 수 있습니다.
- source_word: מִדּוֹד
  english_pob_choice: more than another beloved
  chosen_korean: 다른 사랑하는 이보다 무엇이 더 나으십니까
  alternatives_korean:
  - 다른 사랑하는 이보다 무엇이 더 뛰어나십니까
  - 다른 연인보다 무엇이 더 낫습니까
  lexicon: HALOT
  rationale: 비교 표지 מִן의 의미를 한국어 비교구문으로 자연스럽게 풀어, ‘more than’의 대비를 분명히 드러냈습니다.
- source_word: הַיָּפָה בַּנָּשִׁים
  english_pob_choice: most beautiful among women
  chosen_korean: 여자들 가운데 가장 아름다운 분이시여
  alternatives_korean:
  - 여인들 가운데 가장 아름다운 분이시여
  - 여자들 중 가장 아름다운 분이시여
  lexicon: HALOT
  rationale: 집단 속 최고도의 표현은 ‘가장 아름다운’으로 옮기되, 히브리어 여성 호칭을 반영해 ‘여자들 가운데’로 표현했습니다.
- source_word: הִשְׁבַּעְתָּנוּ
  english_pob_choice: you have made us swear
  chosen_korean: 우리에게 이처럼 맹세하게 하셨습니까
  alternatives_korean:
  - 우리에게 맹세하도록 하셨습니까
  - 우리에게 서약하게 하셨습니까
  lexicon: HALOT
  rationale: Hiphil의 사역적 의미를 따라 ‘맹세하게 하다’로 옮겼고, 의문문의 종결은 한국어의 자연스러운 높임말로 처리했습니다.
theological_decisions:
- issue: 아가서의 직접 화자 호칭과 대화체 높임말
  chosen_reading: 여성들이 묻는 장면에서 상대를 높여 부르는 한국어 문장으로 처리하되, 원문의 시적 질문 구조를 유지했습니다.
  alternative_readings:
  - 평서형으로 완화하는 방식
  - 전부 낮춤말로 옮기는 방식
  rationale: 이 절은 공동체적 질문이면서도 사랑하는 이를 높여 말하는 시적 대화이므로, 합쇼체를 사용해 문학적 격조와 발화 상황을 함께 살렸습니다.
  doctrine_reference: 문학적 화법과 담화 상황에 따른 존대 재현
- issue: ‘맹세하게 하다’의 사역성
  chosen_reading: 원문의 사역적 뉘앙스를 보존해 ‘우리에게 이처럼 맹세하게 하셨습니까’로 옮겼습니다.
  alternative_readings:
  - ‘우리에게 맹세하셨습니까’
  - ‘우리에게 서약을 시키셨습니까’
  rationale: 히브리어는 단순히 ‘맹세하다’가 아니라 남에게 맹세하도록 만들었다는 뜻이므로, 사역성을 지우지 않는 번역이 필요합니다.
  doctrine_reference: 사역동사 의미 보존
