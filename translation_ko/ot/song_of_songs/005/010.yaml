base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/010.yaml
  text: My beloved is radiant and ruddy[a], distinguished among ten thousand.
  footnotes:
  - marker: a
    text: Or 'conspicuous among ten thousand,' or more literally, 'bannered among ten thousand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 사랑하는 이분은 빛나고 붉으시며, 만 명 가운데서도 뛰어나십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만 명 가운데서도 눈에 띄는’, 더 문자적으로는 ‘만 명 가운데서도 기(旗)처럼 드높은’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이
  alternatives_korean:
  - 내 연인
  - 내 사랑하는 사람
  lexicon: HALOT
  rationale: 아가에서 דּוֹדִי는 화자의 애정 어린 상대를 가리키므로, 현대 합쇼체에서 자연스럽고 품위를 해치지 않는 ‘내 사랑하는 이’로 옮겼습니다.
- source_word: צַח
  english_pob_choice: radiant
  chosen_korean: 빛나고
  alternatives_korean:
  - 밝고
  - 환하고
  - 광채 나는
  lexicon: HALOT
  rationale: 빛의 선명함과 눈에 띄는 아름다움을 살리기 위해 ‘빛나다’ 계열로 옮겼습니다. ‘밝다’보다 시적이고, 외모의 광휘를 잘 드러냅니다.
- source_word: וְאָדוֹם
  english_pob_choice: and ruddy
  chosen_korean: 붉으시며
  alternatives_korean:
  - 붉고
  - 붉으며
  - 장밋빛이시며
  lexicon: HALOT
  rationale: אָדוֹם의 기본 의미인 붉음을 유지하되, 인물 묘사에서 자연스러운 ‘붉으시며’로 표현했습니다. 전통적 ‘혈색이 좋으신’은 원문의 붉음 이미지를 약화시킬 수 있습니다.
- source_word: דָּגוּל
  english_pob_choice: distinguished
  chosen_korean: 뛰어나십니다
  alternatives_korean:
  - 두드러지십니다
  - 탁월하십니다
  - 구별되십니다
  lexicon: HALOT
  rationale: 문맥상 ‘표지로 세워진 듯 두드러진’ 의미를 담아, 한국어에서는 인물의 탁월성과 우월성을 드러내는 ‘뛰어나십니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 비유적 연인 찬가의 존칭 처리
  chosen_reading: 화자의 애정 고백을 합쇼체로 유지하면서도, 대상 인물을 높이는 존칭을 사용했습니다.
  alternative_readings:
  - 평서형으로 낮춘 표현
  - 더 직설적인 연애적 어휘
  rationale: 본문은 사랑 노래의 시적 진술이므로, 현대 한국어에서도 품위 있는 합쇼체가 적절합니다. 동시에 원문의 친밀감이 지나치게 평면화되지 않도록 인물 호칭과 서술 동사를 높였습니다.
  doctrine_reference: 아가서의 시적·비유적 문맥과 번역 문체 원칙
