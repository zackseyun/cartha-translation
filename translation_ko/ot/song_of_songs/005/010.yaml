  lexicon: HALOT
  rationale: 아가에서 דּוֹדִי는 화자의 애정 어린 상대를 가리키므로, 현대 합쇼체에서 자연스럽고 품위를 해치지 않는 ‘내 사랑하는 이’로 옮겼습니다.
- source_word: צַח
  english_pob_choice: radiant
  chosen_korean: 빛나고
  alternatives_korean:
  - 밝고
  - 환하고
  - 광채 나는
  lexicon: HALOT
  rationale: 빛의 선명함과 눈에 띄는 아름다움을 살리기 위해 ‘빛나다’ 계열로 옮겼습니다. ‘밝다’보다 시적이고, 외모의 광휘를 잘 드러냅니다.
- source_word: וְאָדוֹם
  english_pob_choice: and ruddy
  chosen_korean: 붉으시며
  alternatives_korean:
  - 붉고
  - 붉으며
  - 장밋빛이시며
  lexicon: HALOT
  rationale: אָדוֹם의 기본 의미인 붉음을 유지하되, 인물 묘사에서 자연스러운 ‘붉으시며’로 표현했습니다. 전통적 ‘혈색이 좋으신’은 원문의 붉음 이미지를 약화시킬 수 있습니다.
- source_word: דָּגוּל
  english_pob_choice: distinguished
  chosen_korean: 뛰어나십니다
  alternatives_korean:
  - 두드러지십니다
  - 탁월하십니다
  - 구별되십니다
  lexicon: HALOT
  rationale: 문맥상 ‘표지로 세워진 듯 두드러진’ 의미를 담아, 한국어에서는 인물의 탁월성과 우월성을 드러내는 ‘뛰어나십니다’가 가장 자연스럽습니다.
