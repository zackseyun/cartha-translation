  rationale: 본문은 사랑 노래의 시적 진술이므로, 현대 한국어에서도 품위 있는 합쇼체가 적절합니다. 동시에 원문의 친밀감이 지나치게 평면화되지 않도록 인물 호칭과 서술 동사를 높였습니다.
  doctrine_reference: 아가서의 시적·비유적 문맥과 번역 문체 원칙
