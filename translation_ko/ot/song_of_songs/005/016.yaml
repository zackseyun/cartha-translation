source:
  edition: WLC
  text: חִכּ/וֹ֙ מַֽמְתַקִּ֔ים וְ/כֻלּ֖/וֹ מַחֲּמַדִּ֑ים זֶ֤ה דוֹדִ/י֙ וְ/זֶ֣ה רֵעִ֔/י בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/016.yaml
  text: His mouth is sweetness itself[a], and all of him is desirable. This is my beloved, and this is my friend[b], O daughters of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'his palate is sweet' or 'his taste is sweetness,' reflecting the more literal sense of the Hebrew word.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of him is delights' / 'altogether lovely.' The Hebrew uses an intensive plural expressing desirability or loveliness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 입은 더없이 달콤합니다[a]. 그의 모든 것이 사랑스럽습니다[b]. 이 사람이 내 사랑하는 이이며, 이 사람이 내 친구입니다, 예루살렘의 딸들아.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 입’은 문자적으로는 ‘그의 입천장’입니다. 이 시적 문맥에서는 입, 맛, 또는 입에서 느껴지는 달콤함을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사랑스럽습니다’는 히브리어의 강조적 복수형이 나타내는 ‘바람직함’, ‘사랑스러움’, 또는 ‘아름다움’을 문맥에 맞게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִכּוֹ
  english_pob_choice: his mouth
  chosen_korean: 그의 입은
  alternatives_korean:
  - 그의 입천장은
  - 그의 입은 달콤합니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘입천장’이지만, 시적 문맥에서는 키스와 말의 달콤함을 가리키는 몸의 부분으로 기능하므로, 자연스럽고 이미지도 살리는 ‘입’으로 옮겼습니다.
- source_word: מַמְתַקִּים
  english_pob_choice: sweetness itself
  chosen_korean: 참으로 달고
  alternatives_korean:
  - 달콤함 그 자체
  - 아주 달콤하고
  - 단맛 그 자체
  lexicon: HALOT
  rationale: 복수형의 강조·집합적 의미를 한국어에서 가장 자연스럽게 살리기 위해 형용사적 표현으로 처리했습니다. ‘그 자체’는 의미를 살리지만 한국어 시구로는 다소 무겁습니다.
- source_word: וְכֻלּוֹ
  english_pob_choice: all of him
  chosen_korean: 그 전체는
  alternatives_korean:
  - 그의 전부는
  - 그의 모든 것은
  - 그 전체가
  lexicon: HALOT
  rationale: 히브리어의 구체적인 ‘그의 모두’를 유지하되, 한국어 시적 문맥에서 유려하게 읽히도록 ‘그 전체는’으로 옮겼습니다.
- source_word: מַחֲמַדִּים
  english_pob_choice: desirable
  chosen_korean: 사랑스럽습니다
  alternatives_korean:
  - 매력적입니다
  - 바람직합니다
  - 사모할 만합니다
  lexicon: HALOT
  rationale: 문맥상 연인에 대한 찬사이므로, ‘desirable’의 뜻을 담으면서도 한국어에서 인격적·서정적 뉘앙스를 살리는 ‘사랑스럽습니다’를 택했습니다. 전통적 종교어휘인 ‘아름답도다’는 여기서는 원문의 직접성을 덜 드러냅니다.
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이요
  alternatives_korean:
  - 내 사랑하는 님이요
  - 내 연인이요
  - 내 사랑이요
  lexicon: HALOT
  rationale: ‘도디’는 아가에서 관계적 애정을 나타내는 대표 표현이므로, ‘내 사랑하는 이’가 가장 직접적이며 한국어 합쇼체 문맥에서도 과도하게 관능적이지 않습니다.
- source_word: רֵעִי
  english_pob_choice: my friend
  chosen_korean: 내 친구입니다
  alternatives_korean:
  - 내 벗입니다
  - 내 동무입니다
  - 내 동반자입니다
  lexicon: HALOT
  rationale: ‘벗’보다 현대적이고, 사랑의 친밀함과 관계의 폭을 함께 담는 가장 직접적인 대응으로 ‘친구’를 선택했습니다.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  english_pob_choice: O daughters of Jerusalem
  chosen_korean: 예루살렘의 딸들아
  alternatives_korean:
  - 예루살렘의 딸들이여
  - 예루살렘의 젊은 여자들아
  lexicon: HALOT
  rationale: 아가의 관용적 호격을 보존하기 위해 직역형을 유지했습니다. ‘딸들아’는 시적 호소를 살리고, ‘젊은 여자들’은 해석이 섞여 원문의 반복어감을 약화시킵니다.
theological_decisions:
- issue: מַחֲמַדִּים를 종교적·메시아적 호칭으로 읽을 가능성
  chosen_reading: 본문의 사랑 노래라는 즉각적 문맥 안에서 ‘사랑스럽습니다’로 번역했습니다.
  alternative_readings:
  - 전통적 종교적 울림을 고려해 ‘아주 사랑스럽습니다/아름답습니다’로 완화
  - ‘메시아적’ 함의를 암시하는 방식으로 처리
  rationale: 히브리어는 여기서 연인을 찬양하는 시어로 쓰이며, 본문 자체가 요구하지 않는 신학적 확장을 피하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 말하지 않는 신학을 번역으로 주입하지 않음
