  text: הִשְׁבַּ֥עְתִּי אֶתְ/כֶ֖ם בְּנ֣וֹת יְרוּשָׁלִָ֑ם אִֽם תִּמְצְאוּ֙ אֶת דּוֹדִ֔/י מַה תַּגִּ֣ידוּ ל֔/וֹ שֶׁ/חוֹלַ֥ת אַהֲבָ֖ה אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/008.yaml
  text: 'I adjure you[a], daughters of Jerusalem: if you find my beloved, what will you tell him? That I am sick with love.'
  footnotes:
  - marker: a
    text: Or, 'that I am lovesick.' The Hebrew literally says 'sick with love.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘의 딸들아, 내가 너희에게 맹세하게 합니다. 너희가 내 사랑하는 이를 찾거든, 그에게 무엇이라고 말하시겠습니까? ‘내가 사랑으로 병들었다’고.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 사랑병에 걸렸다”고 할 수 있습니다. 히브리어는 문자적으로 “내가 사랑으로 병들었다”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  english_pob_choice: I adjure you
  chosen_korean: 내가 너희에게 맹세합니다
  alternatives_korean:
  - 내가 너희를 엄숙히 명합니다
  - 내가 너희에게 엄숙히 맹세하게 합니다
  lexicon: HALOT
  rationale: 히필형 שׁבע의 관용구는 상대를 맹세 아래 두거나 엄숙히 요청하는 뜻이므로, 합쇼체에서 무게감 있는 ‘맹세합니다’로 옮겼습니다.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  english_pob_choice: daughters of Jerusalem
  chosen_korean: 예루살렘의 딸들아
  alternatives_korean:
  - 예루살렘의 여자들아
  - 예루살렘의 젊은 여자들아
  lexicon: HALOT
  rationale: 아가의 전형적 호격을 직역에 가깝게 살려, 문학적 호칭인 ‘예루살렘의 딸들아’를 유지했습니다.
- source_word: דּוֹדִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 이
  alternatives_korean:
  - 나의 연인
  - 내 사랑
  lexicon: HALOT
  rationale: 히브리어 דּוֹדִי는 단순한 애칭보다 ‘사랑하는 대상’을 가리키므로, 품위 있는 표현인 ‘내 사랑하는 이’로 옮겼습니다.
- source_word: שֶׁחוֹלַת אַהֲבָה אָנִי
  english_pob_choice: that I am sick with love
  chosen_korean: 내가 사랑으로 병들었다고
  alternatives_korean:
  - 내가 사랑병에 걸렸다고
  - 내가 사랑에 병들었다고
  lexicon: HALOT
  rationale: 직역적 은유를 유지하되 한국어에서 자연스럽게 읽히도록 ‘사랑으로 병들었다’로 옮겨, POB가 보존한 문면의 긴장을 살렸습니다.
theological_decisions:
- issue: 마지막 직접화법의 높임법
  chosen_reading: “그에게 무엇이라고 말하겠습니까? … 병들었다고 하십시오.”처럼 청자에게는 합쇼체를 유지하되, 인용문 안에서도 요청형 높임말을 사용했습니다.
  alternative_readings:
  - “… 병들었다고 말해 주십시오.”
  - “… 병들었다고 전해 주십시오.”
  rationale: 원문은 화자가 예루살렘 딸들에게 공손하고도 간절하게 부탁하는 장면이므로, 한국어에서도 청자 존대를 유지하는 것이 장면의 정서와 화행을 더 잘 드러냅니다.
  doctrine_reference: 문체·화행에 관한 번역 원칙
- issue: ‘사랑으로 병들었다’의 은유 보존
  chosen_reading: 사랑을 단순 감정 과장으로 약화하지 않고, 원문이 가진 신체적·정서적 병듦의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 사랑병에 걸렸다
  - 사랑에 상했다
  rationale: 아가의 시적 긴장은 사랑을 실제 ‘병듦’의 언어로 표현하는 데 있으므로, 이를 평이하게 풀어버리기보다 은유를 유지하는 편이 원문의 힘을 보존합니다.
  doctrine_reference: 아가서의 시적 은유와 문면 충실성
