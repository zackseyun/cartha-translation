  rationale: גְּלִילִים은 둥글거나 원통형의 물체를 가리키므로, 현대 한국어에서는 ‘막대기’가 길고 둥근 형상을 가장 무리 없이 살립니다.
- source_word: מְמֻלָּאִים בַּתַּרְשִׁישׁ
  english_pob_choice: set with beryl
  chosen_korean: 보석으로 채워져 있으며
  alternatives_korean:
  - 베릴이 박혀 있으며
  - 터시스 돌로 채워져 있으며
  lexicon: HALOT
  rationale: תַּרְשִׁישׁ의 정확한 광물 식별이 불확실하므로, 본문 의미를 살리면서도 과도한 특정화를 피하는 방향으로 옮겼습니다.
- source_word: מֵעָיו
  english_pob_choice: his body
  chosen_korean: 그의 배
  alternatives_korean:
  - 그의 몸
  - 그의 내장
  - 그의 허리
  lexicon: HALOT
  rationale: 문자적으로는 ‘내장/배’ 계열의 말이지만, 이 시에서는 육체적 아름다움을 묘사하는 맥락이므로 현대 한국어에서는 ‘배’가 가장 직접적입니다.
- source_word: עֶשֶׁת שֵׁן
  english_pob_choice: polished ivory
  chosen_korean: 연마한 상아
  alternatives_korean:
  - 윤이 난 상아
  - 다듬어진 상아
  lexicon: HALOT
  rationale: 가공·연마된 상아의 질감을 살리기 위해 ‘연마한 상아’로 옮겼습니다.
- source_word: מְעֻלֶּפֶת סַפִּירִים
  english_pob_choice: covered with sapphires
  chosen_korean: 사파이어로 덮여 있습니다
  alternatives_korean:
  - 사파이어로 둘러싸여 있습니다
