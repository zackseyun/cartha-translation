  lexicon: HALOT
  rationale: 가공·연마된 상아의 질감을 살리기 위해 ‘연마한 상아’로 옮겼습니다.
- source_word: מְעֻלֶּפֶת סַפִּירִים
  english_pob_choice: covered with sapphires
  chosen_korean: 사파이어로 덮여 있습니다
