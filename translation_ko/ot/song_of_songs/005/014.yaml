  lexicon: HALOT
  rationale: 문자적으로는 ‘내장/배’ 계열의 말이지만, 이 시에서는 육체적 아름다움을 묘사하는 맥락이므로 현대 한국어에서는 ‘배’가 가장 직접적입니다.
- source_word: עֶשֶׁת שֵׁן
  english_pob_choice: polished ivory
  chosen_korean: 연마한 상아
  alternatives_korean:
