  - 그의 손들
  lexicon: HALOT
  rationale: יָד는 기본적으로 ‘손’이며, 이 시의 신체 묘사에서는 가장 직접적이고 자연스러운 대응입니다.
- source_word: גְּלִילֵי זָהָב
  english_pob_choice: rods of gold
  chosen_korean: 금으로 된 막대기
