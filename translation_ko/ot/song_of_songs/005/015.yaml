  text: שׁוֹקָי/ו֙ עַמּ֣וּדֵי שֵׁ֔שׁ מְיֻסָּדִ֖ים עַל אַדְנֵי פָ֑ז מַרְאֵ֨/הוּ֙ כַּ/לְּבָנ֔וֹן בָּח֖וּר כָּ/אֲרָזִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/015.yaml
  text: His legs are pillars of marble[a], set on bases of fine gold. His appearance is like Lebanon[b], choice as the cedars.
  footnotes:
  - marker: a
    text: Or 'pillars of alabaster' for 'pillars of marble'; the Hebrew שֵׁשׁ may denote a fine white stone rather than marble specifically.
    reason: lexical_alternative
  - marker: b
    text: Or 'His appearance is like Lebanon, distinguished as the cedars.' The Hebrew בָּחוּר here likely conveys select excellence rather than 'young man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 다리는 대리석[a] 기둥들이며, 정금의 받침 위에 세워져 있습니다. 그의 모습은 레바논[b] 같고, 백향목들처럼 빼어납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘설화석고 기둥들’로도 옮길 수 있습니다. 히브리어 שֵׁשׁ은 대리석보다 더 넓게 고운 흰 석재를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 모습은 레바논처럼, 백향목들처럼 탁월합니다’로도 옮길 수 있습니다. 히브리어 בָּחוּר는 여기서 ‘젊은 사람’보다 ‘선별된 우수함’의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹקָיו
  english_pob_choice: his legs
  chosen_korean: 그의 다리
  alternatives_korean:
  - 그의 허벅지
  - 그의 하반신
  lexicon: HALOT
  rationale: שׁוֹק는 다리/허벅지 범위를 가리킬 수 있으나, 이 시적 신체 묘사에서는 기둥 이미지와 자연스럽게 맞는 표준어 ‘다리’가 가장 읽기 쉽고 과도한 해부학적 세분화를 피합니다.
- source_word: עַמּוּדֵי
  english_pob_choice: pillars of
  chosen_korean: 기둥들이며
  alternatives_korean:
  - 기둥들처럼
  - 기둥과 같으며
  lexicon: HALOT
  rationale: 복수 구성형의 ‘기둥’ 의미를 직접 살리되, 한국어에서는 서술격 연결로 마무리해 시적 병행을 자연스럽게 전달합니다.
- source_word: שֵׁשׁ
  english_pob_choice: marble
  chosen_korean: 대리석
  alternatives_korean:
  - 설화석고
  - 흰 돌
  lexicon: HALOT
  rationale: 본문의 שֵׁשׁ은 고운 흰 석재를 가리킬 수 있으나, POB가 채택한 ‘marble’의 일반적 이해를 한국어에 자연스럽게 옮기기 위해 ‘대리석’을 사용했습니다.
- source_word: פָז
  english_pob_choice: fine gold
  chosen_korean: 정금
  alternatives_korean:
  - 순금
  - 세련된 금
  lexicon: HALOT
  rationale: פָז는 고급으로 정련된 금을 뜻하므로, 성경 한국어에서 널리 통용되면서도 값비싼 금속의 질감을 살리는 ‘정금’이 적절합니다.
- source_word: בָּחוּר
  english_pob_choice: choice
  chosen_korean: 빼어납니다
  alternatives_korean:
  - 선택된
  - 탁월합니다
  - 정선된
  lexicon: HALOT
  rationale: 여기서 בָּחוּר는 ‘젊은 사람’보다 ‘선별된 우수함’의 의미가 강하므로, 형용사적 비교를 한국어로 자연스럽게 풀어 ‘빼어납니다’로 옮겼습니다.
theological_decisions:
- issue: 레바논과 백향목의 병렬 이미지
  chosen_reading: ‘레바논 같고, 백향목들처럼 빼어납니다’로 두 비유를 유지해 장엄함과 탁월함을 함께 드러냈습니다.
  alternative_readings:
  - ‘레바논처럼, 백향목처럼’
  - ‘레바논의 백향목들처럼’
  rationale: 원문은 레바논과 백향목을 별개의 이미지로 병치합니다. 이를 합치거나 약화하지 않고, 시적 긴장과 중복 강조를 보존하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 시편적·지혜문학적 비유는 신학 교리보다 이미지의 보존이 우선입니다.
