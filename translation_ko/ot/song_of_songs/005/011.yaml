  text: רֹאשׁ֖/וֹ כֶּ֣תֶם פָּ֑ז קְוּצּוֹתָי/ו֙ תַּלְתַּלִּ֔ים שְׁחֹר֖וֹת כָּ/עוֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/011.yaml
  text: His head is finest gold[a]; his locks are wavy[b], black as a raven.
  footnotes:
  - marker: a
    text: Or 'fine gold' for 'purest gold'; the Hebrew uses two gold terms together for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'his curls are in waves' or 'his tresses are curly'; the Hebrew term is rare and poetic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 머리는 순금이요[a], 그의 머리칼은 물결치듯 웨이브가졌으며[b], 까마귀처럼 검습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘פָּז’와 함께 두 금 어휘가 겹쳐 쓰여 금의 탁월한 품질을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 시어로, ‘곱슬하다’ 또는 ‘물결지다’의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁוֹ
  english_pob_choice: His head
  chosen_korean: 그의 머리
  alternatives_korean:
  - 그의 머리통
  - 그의 두상
  lexicon: HALOT
  rationale: רֹאשׁ은 여기서 신체 부위인 ‘머리’의 구체적 의미가 자연스럽고, 연인의 신체를 묘사하는 시적 문맥에 맞습니다.
- source_word: כֶּתֶם פָּז
  english_pob_choice: finest gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 가장 순수한 금
  lexicon: HALOT
  rationale: 두 금속어를 겹쳐 금의 귀하고 순수한 성질을 강조하므로, 한국어에서는 간결하게 ‘순금’으로 옮겨 시적 강조를 살렸습니다.
- source_word: קְוּצּוֹתָיו
  english_pob_choice: his locks
  chosen_korean: 그의 머리칼
  alternatives_korean:
  - 그의 곱슬머리
  - 그의 머리채
  lexicon: HALOT
  rationale: 이 드문 시어는 머리카락의 덩어리나 늘어진 곱슬을 가리키므로, 자연스러운 현대 한국어인 ‘머리칼’로 기본 의미를 살렸습니다.
- source_word: תַּלְתַּלִּים
  english_pob_choice: wavy
  chosen_korean: 물결치듯 웨이브가졌으며
  alternatives_korean:
  - 곱슬곱슬하며
  - 웨이브진
  lexicon: HALOT
  rationale: 어근의 정확한 결은 다소 희소하지만, 물결치듯 굽이진 머리 모양을 전달해야 하므로 ‘물결치듯 웨이브가졌으며’로 시적 이미지를 보존했습니다.
- source_word: שְׁחֹרוֹת כָּעוֹרֵב
  english_pob_choice: black as a raven
  chosen_korean: 까마귀처럼 검습니다
  alternatives_korean:
  - 까마귀같이 검습니다
  - 까마귀처럼 새까맣습니다
  lexicon: HALOT
  rationale: 직유는 까마귀의 검은 색감을 통해 머리칼의 색을 강조하므로, 한국어에서도 직설적인 비교를 유지했습니다.
theological_decisions:
- issue: 아가서의 신체 묘사 시어를 현대 한국어로 얼마나 직역할지
  chosen_reading: 은유를 완화하지 않고 연인의 외모를 칭송하는 시적 문장을 그대로 드러냈습니다.
  alternative_readings:
  - 좀 더 완곡하게 풀어 쓰기
  - 전통 교회어휘로 정서화하기
  rationale: 원문의 blazon 형식은 구체적 신체 이미지의 연속이 핵심이므로, 의미를 약화시키지 않는 범위에서 직유와 형용사를 보존하는 것이 적절합니다.
  doctrine_reference: 시가의 문학적 장르 인식
