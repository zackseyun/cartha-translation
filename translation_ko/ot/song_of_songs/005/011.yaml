  rationale: 이 드문 시어는 머리카락의 덩어리나 늘어진 곱슬을 가리키므로, 자연스러운 현대 한국어인 ‘머리칼’로 기본 의미를 살렸습니다.
- source_word: תַּלְתַּלִּים
  english_pob_choice: wavy
  chosen_korean: 물결치듯 웨이브가졌으며
  alternatives_korean:
