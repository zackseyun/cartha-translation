translation:
  language: ko
  text: 그의 머리는 순금[a]이고, 그의 머리칼은 물결치듯 굽이쳐[b] 까마귀처럼 검습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 금을 가리키는 두 어휘가 함께 쓰여, 매우 귀하고 정련된 금이라는 뜻을 강조합니다. ‘정금’ 또는 ‘가장 순수한 금’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀한 시어입니다. ‘곱슬곱슬한’ 또는 ‘물결 모양의’ 머리칼로도 옮길 수 있습니다.
    reason: lexical_alternative
