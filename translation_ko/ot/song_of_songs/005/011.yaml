  lexicon: HALOT
  rationale: 어근의 정확한 결은 다소 희소하지만, 물결치듯 굽이진 머리 모양을 전달해야 하므로 ‘물결치듯 웨이브가졌으며’로 시적 이미지를 보존했습니다.
- source_word: שְׁחֹרוֹת כָּעוֹרֵב
  english_pob_choice: black as a raven
  chosen_korean: 까마귀처럼 검습니다
  alternatives_korean:
