source:
  edition: WLC
  text: עֵינָ֕י/ו כְּ/יוֹנִ֖ים עַל אֲפִ֣יקֵי מָ֑יִם רֹֽחֲצוֹת֙ בֶּֽ/חָלָ֔ב יֹשְׁב֖וֹת עַל מִלֵּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/012.yaml
  text: His eyes are like doves beside streams of water[a], bathed in milk, sitting by fullness.
  footnotes:
  - marker: a
    text: Or 'set in their setting'; the final phrase is difficult Hebrew and may refer to the eyes being well set, or to doves by a full pool.
    reason: alternative_reading
translation:
  language: ko
  text: 그의 눈은 물 시냇가의 비둘기 같으며, 우유에 씻기고, 가득 찬 자리에[a] 앉아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제자리에 잘 놓인’. 마지막 히브리어 표현은 매우 어렵습니다. 눈이 잘 자리 잡았다는 뜻일 수도 있고, 물이 가득한 연못 곁의 비둘기들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינָיו
  english_pob_choice: His eyes
  chosen_korean: 그의 눈
  alternatives_korean:
  - 그의 눈동자
  - 그의 시선
  lexicon: HALOT
  rationale: עַיִן의 기본 의미는 ‘눈’이며, 여기서는 비둘기 이미지와 함께 신체적 눈을 가리키는 것으로 보는 것이 가장 자연스럽습니다.
- source_word: כְּיוֹנִים
  english_pob_choice: like doves
  chosen_korean: 비둘기 같고
  alternatives_korean:
  - 비둘기처럼
  - 비둘기와 같고
  lexicon: HALOT
  rationale: 비교 표지 כְּ의 시적 비유를 살려, 한국어에서도 직접적인 유사 비교로 옮겼습니다.
- source_word: רֹחֲצוֹת בֶּחָלָב
  english_pob_choice: bathed in milk
  chosen_korean: 우유에 씻긴 채
  alternatives_korean:
  - 우유에 목욕한
  - 우유에 잠긴
  lexicon: HALOT
  rationale: רחץ의 분사로 된 상태 묘사를 살리면서, 한국어에서는 ‘씻긴 채’가 시적이면서도 과도한 설명을 덜어 줍니다.
- source_word: עַל מִלֵּאת
  english_pob_choice: sitting by fullness
  chosen_korean: 풍성함 곁에 앉아 있습니다
  alternatives_korean:
  - 가득함 곁에 앉아 있습니다
  - 충만함 속에 앉아 있습니다
  lexicon: HALOT
  rationale: 마지막 구절은 히브리어 자체가 난해하므로, POB의 어려운 의미를 유지하면서 ‘곁에’로 전치사의 방향성을 살리고 ‘풍성함’으로 모호성을 비교적 덜 해치게 옮겼습니다.
theological_decisions:
- issue: 마지막 난구의 모호성 보존
  chosen_reading: ‘풍성함 곁에’로 옮겨, 본문이 암시하는 눈의 ‘잘 자리 잡음’인지 ‘가득한 물가’인지 단정하지 않았습니다.
  alternative_readings:
  - ‘잘 자리 잡은’
  - ‘가득한 연못 곁에’
  rationale: 히브리어 מִלֵּאת는 해석이 어려우므로, 의미를 단정하지 않고 시적 모호성을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 원문 난해구 처리 원칙
