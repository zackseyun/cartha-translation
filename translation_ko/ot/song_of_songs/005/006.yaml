reference: Song of Songs 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּתַ֤חְתִּֽי אֲנִי֙ לְ/דוֹדִ֔/י וְ/דוֹדִ֖/י חָמַ֣ק עָבָ֑ר נַפְשִׁ/י֙ יָֽצְאָ֣ה בְ/דַבְּר֔/וֹ בִּקַּשְׁתִּ֨י/הוּ֙ וְ/לֹ֣א מְצָאתִ֔י/הוּ קְרָאתִ֖י/ו וְ/לֹ֥א עָנָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/006.yaml
  text: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
  footnotes:
  - marker: a
    text: Or, 'had slipped away and passed on.' The Hebrew uses two verbs to emphasize his departure.
    reason: lexical_alternative
  - marker: b
    text: Or, 'My soul failed at his speaking' / 'I was beside myself when he spoke.' The Hebrew idiom is vivid and difficult to reproduce fully in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 사랑하는 이에게 문을 열었습니다. 그러나 내 사랑하는 이는 슬며시 떠나가 버렸습니다.[a] 그가 말할 때 나는 넋을 잃었습니다.[b] 나는 그를 찾았으나 찾지 못했습니다. 그를 불렀으나 그는 내게 대답하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬며시 빠져나가 지나가 버렸습니다.’ 히브리어는 떠남을 강조하기 위해 두 동사를 나란히 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그가 말할 때 내 영혼이 떠났습니다.’ 히브리어의 생생하고 해석하기 어려운 관용구로, ‘나는 넋을 잃었습니다’ 또는 ‘그의 말에 나는 혼이 나갔습니다’라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי / לְדוֹדִי
  english_pob_choice: I opened to my beloved
  chosen_korean: 나는 내 사랑하는 이에게 문을 열었습니다
  alternatives_korean:
  - 나는 내 사랑하는 이에게 열었습니다
  - 나는 내 사랑하는 이를 맞으려고 문을 열었습니다
  lexicon: HALOT
  rationale: פתח와 ל의 결합은 ‘~에게 열다’의 관계를 가리키며, דוֹד는 아가서에서 ‘사랑하는 이’로 옮기는 것이 가장 안정적입니다.
- source_word: וְדוֹדִי חָמַק עָבָר
  english_pob_choice: but my beloved had turned away and gone
  chosen_korean: 그러나 내 사랑하는 이는 몸을 돌려 가 버렸습니다
  alternatives_korean:
  - 그러나 내 사랑하는 이는 슬그머니 지나가 버렸습니다
  - 그러나 내 사랑하는 이는 물러나 지나가 버렸습니다
  lexicon: HALOT
  rationale: חמק와 עבר의 이중 동사는 떠남을 강조하므로, ‘몸을 돌려 가 버렸습니다’로 움직임과 부재를 함께 살렸습니다.
- source_word: נַפְשִׁי יָצְאָה בְדַבְּרוֹ
  english_pob_choice: My soul went out when he spoke
  chosen_korean: 그의 말에 내 영혼이 사라졌습니다
  alternatives_korean:
  - 그가 말할 때 내 영혼이 빠져나갔습니다
  - 그의 말에 내 생명이 떠났습니다
  lexicon: HALOT
  rationale: נפשׁ는 시어로 ‘영혼/생명/자기 자신’을 포괄하지만, 여기서는 강한 내적 충격을 드러내므로 ‘영혼이 사라졌습니다’로 옮겼습니다.
- source_word: בִּקַּשְׁתִּיהוּ / לֹא מְצָאתִיהוּ / קְרָאתִיו / לֹא עָנָנִי
  english_pob_choice: I sought him, but I did not find him. I called him, but he did not answer me.
  chosen_korean: 내가 그를 찾았지만 찾지 못했고, 그를 불렀지만 그는 내게 대답하지 않았습니다
  alternatives_korean:
  - 내가 그를 찾아도 찾지 못했고, 그를 불렀지만 그는 대답하지 않았습니다
  - 내가 그를 구했지만 찾지 못했고, 그를 불렀지만 그는 응답하지 않았습니다
  lexicon: HALOT
  rationale: בקשׁ은 ‘찾다/구하다’ 중 여기서는 반복적 추적의 뜻이 분명해 ‘찾다’가 자연스럽고, ענה는 관계적 침묵을 드러내는 ‘대답하다’가 적절합니다.
theological_decisions:
- issue: 아가서 5:6의 화자 감정과 시적 강도 표현
  chosen_reading: ‘그의 말에 내 영혼이 사라졌습니다’로 직역에 가까운 충격을 유지했습니다.
  alternative_readings:
  - ‘나는 넋을 잃었습니다’
  - ‘나는 정신이 혼미해졌습니다’
  rationale: 히브리어 관용구의 강한 정서적 붕괴를 평탄화하지 않고, 독자가 사랑의 상실감을 직접 느끼도록 했습니다.
  doctrine_reference: 시적 본문 번역 원칙
- issue: ‘사랑하는 이’의 호칭 유지
  chosen_reading: דוֹד를 ‘내 사랑하는 이’로 일관되게 옮겼습니다.
  alternative_readings:
  - ‘연인’
  - ‘임자’
  rationale: 아가서의 애정 관계를 드러내면서도 성별·관계 뉘앙스를 과도하게 특정하지 않기 위해 가장 중립적이고 본문 밀착적인 표현을 선택했습니다.
  doctrine_reference: 아가서 어휘 일관성
