base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/007.yaml
  text: The watchmen who go about the city found me[a]; they struck me, they wounded me[b]; the keepers of the walls took my cloak from me.
  footnotes:
  - marker: a
    text: Or 'who patrol the city.' The Hebrew participle means 'going around' or 'circling,' and in context likely refers to making rounds as city watchmen.
    reason: lexical_alternative
  - marker: b
    text: Or 'took away my veil' or 'lifted my shawl off me.' The Hebrew רְדִיד refers to an outer wrap or covering garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 성 안을 돌아다니는 파수꾼들이 나를 발견했습니다. 그들은 나를 때리고 상처를 입혔습니다. 성벽을 지키는 이들이 내 겉옷을 내 몸에서 벗겨 갔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 “내 숄” 또는 “내 베일”. 히브리어 רְדִיד은 겉에 걸치는 덮개 옷을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  english_pob_choice: the watchmen
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 경비들
  - 경비원들
  lexicon: HALOT
  rationale: 도시 안에서 지키고 순찰하는 사람들을 가리키는 말로, 한국어에서는 “파수꾼들”이 기능과 분위기를 가장 자연스럽게 살립니다.
- source_word: הַסֹּבְבִים בָּעִיר
  english_pob_choice: who go about the city
  chosen_korean: 성 안을 돌며 다니는
  alternatives_korean:
  - 성 안을 순찰하는
  - 성 안을 돌아다니는
  lexicon: HALOT
  rationale: סבב의 핵심인 ‘돌다, 둘러가다’를 살리되, 기술적인 ‘순찰’보다 덜 단정적으로 옮겨 문맥의 개방성을 남겼습니다.
- source_word: פְצָעוּנִי
  english_pob_choice: they wounded me
  chosen_korean: 나를 상하게 했습니다
  alternatives_korean:
  - 나를 다치게 했습니다
  - 나를 상처 입혔습니다
  lexicon: HALOT
  rationale: פצע는 단순 타격보다 더 강한 상처를 뜻하므로, 앞의 “때리고”와 구별되면서도 한국어에서 자연스러운 “상하게 하다”로 옮겼습니다.
- source_word: רְדִידִי
  english_pob_choice: my cloak
  chosen_korean: 내 겉옷
  alternatives_korean:
  - 내 두루마기
  - 내 숄
  lexicon: HALOT
  rationale: רְדִיד은 바깥에 걸치는 덮개류의 옷이므로, 전통적 종교어인 “베일”보다 의미 범위가 넓은 “겉옷”이 본문의 외투성/덮개성을 안정적으로 전달합니다.
