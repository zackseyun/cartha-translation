  - 내 포도주를 내 우유와 함께 마셨습니다
  lexicon: WLC/HALOT
  rationale: חָלָב은 기본적으로 ‘젖/우유’지만, 현대 한국어에서는 ‘우유’가 자연스럽고 문맥의 풍성한 잔치 이미지를 잘 전달합니다.
