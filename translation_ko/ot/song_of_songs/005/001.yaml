base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/001.yaml
  text: I have come into my garden[a], my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, friends; drink, and be drunk, beloved ones.
  footnotes:
  - marker: a
    text: Or, 'Drink, and become drunk, beloved ones' / 'O lovers,' taking דּוֹדִים as a vocative rather than 'love.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 내 정원에 들어왔습니다, 내 누이여, 내 신부여. 나는 내 몰약을 내 향료와 함께 거두었고, 내 벌집꿀을 내 꿀과 함께 먹었으며, 내 포도주를 내 우유와 함께 마셨습니다. 친구들이여, 먹으십시오. 사랑하는 이들이여, 마시고 취하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 마지막 말 דּוֹדִים를 추상명사로 이해하여 ‘마시고 사랑에 취하십시오’로 옮길 수 있습니다.
    reason: alternative_reading
