theological_decisions:
- issue: דּוֹדִים의 종결절 의미
  chosen_reading: 명령의 대상은 ‘사랑’으로 이해하고, דּוֹדִים는 그에 대응하는 감각적·관계적 상태를 나타내는 표현으로 처리했습니다.
  alternative_readings:
  - ‘사랑하는 이들아/연인들아’로 직접 호격 처리
  - ‘취하되, 사랑하는 이들아’로 번역
  rationale: 히브리어 시문맥에서 דּוֹדִים는 사랑/사랑의 행위와 연관된 의미로 자주 쓰이며, 여기서는 초청의 절정이므로 ‘사랑에 취하다’가 가장 자연스럽습니다. 다만 호격 가능성도 충분하므로 본문 의미를 과도하게 단정하지 않도록 유념했습니다.
  doctrine_reference: Song of Songs 5:1 poetic register; translation philosophy §1, §3
