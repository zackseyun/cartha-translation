  - 내 벌집꿀을 내 꿀과 함께 먹고
  lexicon: WLC/HALOT
  rationale: יַעַר은 여기서 ‘벌집/꿀벌집’의 이미지로 이해되므로, ‘꿀벌집’이 반복되는 꿀의 풍요를 분명하게 드러냅니다.
- source_word: שָׁתִיתִי יֵינִי עִם חֲלָבִי
  english_pob_choice: I have drunk my wine with my milk
  chosen_korean: 내 포도주를 내 우유와 함께 마셨습니다
  alternatives_korean:
  - 내 포도주를 내 젖과 함께 마셨습니다
  - 내 포도주를 내 우유와 함께 마셨습니다
  lexicon: WLC/HALOT
  rationale: חָלָב은 기본적으로 ‘젖/우유’지만, 현대 한국어에서는 ‘우유’가 자연스럽고 문맥의 풍성한 잔치 이미지를 잘 전달합니다.
- source_word: אִכְלוּ רֵעִים שְׁתוּ וְשִׁכְרוּ דּוֹדִים
  english_pob_choice: Eat, friends; drink, and be drunk, beloved ones.
  chosen_korean: 친구들아, 먹으십시오. 마시십시오. 그리고 사랑에 취하십시오.
  alternatives_korean:
  - 친구들아, 먹으십시오. 마시십시오. 그리고 취하십시오, 사랑하는 이들아.
  - 친구들아, 먹으십시오. 마시십시오. 그리고 사랑에 취하십시오.
  lexicon: WLC/HALOT
  rationale: 레 5:1의 마지막 명령은 원문이 다의적이므로, 문맥상 가장 넓게 수용되는 ‘사랑에 취하십시오’로 옮겨 시적 강도를 보존했습니다.
theological_decisions:
- issue: דּוֹדִים의 종결절 의미
  chosen_reading: 명령의 대상은 ‘사랑’으로 이해하고, דּוֹדִים는 그에 대응하는 감각적·관계적 상태를 나타내는 표현으로 처리했습니다.
  alternative_readings:
  - ‘사랑하는 이들아/연인들아’로 직접 호격 처리
  - ‘취하되, 사랑하는 이들아’로 번역
  rationale: 히브리어 시문맥에서 דּוֹדִים는 사랑/사랑의 행위와 연관된 의미로 자주 쓰이며, 여기서는 초청의 절정이므로 ‘사랑에 취하다’가 가장 자연스럽습니다. 다만 호격 가능성도 충분하므로 본문 의미를 과도하게 단정하지 않도록 유념했습니다.
  doctrine_reference: Song of Songs 5:1 poetic register; translation philosophy §1, §3
