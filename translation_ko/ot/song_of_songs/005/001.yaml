- source_word: אָרִיתִי מוֹרִי עִם בְּשָׂמִי
  english_pob_choice: I have gathered my myrrh with my spice
  chosen_korean: 나는 내 몰약을 내 향료와 함께 거두고
  alternatives_korean:
  - 나는 내 몰약을 내 향과 함께 모으고
  - 나는 내 몰약을 내 향료와 함께 모았고
  lexicon: WLC/HALOT
  rationale: אָרה는 여기서 향기로운 것을 ‘거두다/모으다’의 뜻이므로, 감각 이미지를 살리면서도 한국어로는 ‘거두다’가 시적입니다. בְּשָׂמִי는 구체적 향료/향미의 의미를 반영해 ‘향료’로 옮겼습니다.
- source_word: אָכַלְתִּי יַעְרִי עִם דִּבְשִׁי
  english_pob_choice: I have eaten my honeycomb with my honey
  chosen_korean: 내 꿀벌집을 내 꿀과 함께 먹고
  alternatives_korean:
