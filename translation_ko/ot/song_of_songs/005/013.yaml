  text: לְחָיָ/ו֙ כַּ/עֲרוּגַ֣ת הַ/בֹּ֔שֶׂם מִגְדְּל֖וֹת מֶרְקָחִ֑ים שִׂפְתוֹתָי/ו֙ שֽׁוֹשַׁנִּ֔ים נֹטְפ֖וֹת מ֥וֹר עֹבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/013.yaml
  text: His cheeks are like beds of spice[a], mounds of perfumes; his lips are lilies, dripping flowing myrrh.
  footnotes:
  - marker: a
    text: Or 'mounds/raised beds of mixed spices' for 'towers of perfume'; the Hebrew image in this phrase is difficult and may refer to elevated beds or heaps of aromatic plants rather than literal towers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뺨은 향료의 정원밭, 향품의 언덕들 같고, 그의 입술은 백합화들이며, 흐르는 몰약을 똑똑 떨어뜨립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향품의 둔덕들/높인 밭들’로도 옮길 수 있습니다. 히브리어 이미지가 난해하여, 실제 탑이라기보다 향기로운 식물을 높게 쌓아 올린 둔덕이나 언덕을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְחָיָו
  english_pob_choice: his cheeks
  chosen_korean: 그의 뺨
  alternatives_korean:
  - 그의 볼
  - 그의 턱
  lexicon: HALOT
  rationale: 복수형 인칭접미사가 붙은 얼굴의 양쪽 부분을 가리키므로, 시적 문맥에서는 ‘뺨’이 가장 자연스럽고 ‘턱’은 해부학적으로 너무 좁으며 ‘볼’은 다소 구어적입니다.
- source_word: כַּעֲרוּגַת הַבֹּשֶׂם
  english_pob_choice: beds of spice
  chosen_korean: 향료의 정원밭
  alternatives_korean:
  - 향료의 침상
  - 향료의 밭
  lexicon: HALOT
  rationale: עֲרוּגָה는 정원에 조성한 밭이나 구획을 뜻하므로, ‘정원밭’이 재배된 향초의 이미지를 살리면서도 자연스럽게 읽힙니다.
- source_word: מִגְדְּלוֹת מֶרְקָחִים
  english_pob_choice: mounds of perfumes
  chosen_korean: 향품의 언덕들
  alternatives_korean:
  - 향품의 둔덕들
  - 향품의 탑들
  lexicon: HALOT
  rationale: מִגְדְּלוֹת은 문자적으로 높이 솟은 구조를 가리키지만, 이 표현은 시적으로도 난해하므로 POB가 보존한 ‘mounds of perfumes’의 이미지를 따라 ‘언덕들’로 옮겨 과도한 구체화를 피했습니다.
- source_word: שִׂפְתוֹתָיו
  english_pob_choice: his lips
  chosen_korean: 그의 입술
  alternatives_korean:
  - 그의 입술들
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 통상 단수 집합명사인 ‘입술’이 가장 자연스럽습니다.
- source_word: שׁוֹשַׁנִּים
  english_pob_choice: lilies
  chosen_korean: 백합화들
  alternatives_korean:
  - 백합들
  - 나리꽃들
  lexicon: HALOT
  rationale: 전통적 대응은 ‘백합’이지만, 시구의 복수성을 드러내기 위해 ‘백합화들’로 옮겼습니다.
- source_word: נֹטְפוֹת
  english_pob_choice: dripping
  chosen_korean: 똑똑 떨어뜨립니다
  alternatives_korean:
  - 흘러내립니다
  - 방울방울 떨어뜨립니다
  lexicon: HALOT
  rationale: 지속적으로 맺혀 떨어지는 감각을 살리되, 현대 한국어 시적 문장으로 자연스럽게 들리도록 표현했습니다.
- source_word: מוֹר עֹבֵר
  english_pob_choice: flowing myrrh
  chosen_korean: 흐르는 몰약
  alternatives_korean:
  - 액체 몰약
  - 흘러가는 몰약
  lexicon: HALOT
  rationale: עֹבֵר는 여기서 ‘지나가는’보다 ‘흐르는/유동하는’ 성격을 나타내므로, 관능적 이미지가 살아나는 ‘흐르는 몰약’으로 옮겼습니다.
theological_decisions:
- issue: 화려한 연인의 비유를 과도하게 상징화하지 않음
  chosen_reading: 이 절은 신랑의 외모를 향기와 꽃, 몰약의 이미지로 묘사하는 시적 블라존으로 읽고, 문자적·비유적 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 메시아적 상징으로 강하게 읽기
  - 도덕적·교훈적 알레고리로 환원하기
  rationale: 아가의 문맥상 우선 기능은 사랑의 시어를 통해 매혹과 찬미를 전달하는 데 있으며, 본문이 제공하지 않는 추가 상징을 덧씌우지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 아가서의 장르와 문맥
