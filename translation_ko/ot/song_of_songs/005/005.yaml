base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/005.yaml
  text: I arose to open to my beloved[a], and my hands dripped with myrrh, my fingers with flowing myrrh[b], on the handles of the bolt.
  footnotes:
  - marker: a
    text: Or 'liquid myrrh' or 'running myrrh' for 'flowing myrrh.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the handles of the lock' or 'the latch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 일어나 내 사랑에게 문을 열려고 하였는데, 내 손에서는 몰약이, 내 손가락에서는 흐르는 몰약이 문빗장 손잡이 위로 흘러내렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흐르는 몰약’은 ‘액체 몰약’ 또는 ‘스며 흐르는 몰약’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘문빗장 손잡이’는 ‘빗장의 손잡이’ 또는 ‘잠금장치의 손잡이’로도 옮길 수 있습니다.
    reason: lexical_alternative
