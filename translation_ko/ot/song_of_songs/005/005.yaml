    text: ‘흐르는 몰약’은 ‘액체 몰약’ 또는 ‘스며 흐르는 몰약’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘문빗장의 손잡이’는 ‘빗장의 손잡이’ 또는 ‘잠금장치의 손잡이’로도 옮길 수 있습니다.
    reason: lexical_alternative
