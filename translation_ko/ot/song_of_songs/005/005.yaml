translation:
  language: ko
  text: 내 사랑에게 문을 열려고 내가 일어났습니다. 내 손에서는 몰약이, 내 손가락에서는 흐르는 몰약이 문빗장의 손잡이 위에 떨어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
