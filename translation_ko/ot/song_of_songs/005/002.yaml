source:
  edition: WLC
  text: אֲנִ֥י יְשֵׁנָ֖ה וְ/לִבִּ֣/י עֵ֑ר ק֣וֹל דּוֹדִ֣/י דוֹפֵ֗ק פִּתְחִי לִ֞/י אֲחֹתִ֤/י רַעְיָתִ/י֙ יוֹנָתִ֣/י תַמָּתִ֔/י שֶׁ/רֹּאשִׁ/י֙ נִמְלָא טָ֔ל קְוֻּצּוֹתַ֖/י רְסִ֥יסֵי לָֽיְלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/002.yaml
  text: 'I was asleep[a], but my heart was awake. The sound of my beloved knocking: “Open to me, my sister, my darling, my dove, my blameless one, for my head is drenched with dew[b], my locks with the drops of the night.”'
  footnotes:
  - marker: a
    text: Or 'The voice of my beloved' for 'The sound of my beloved.' Hebrew qol can mean either 'sound' or 'voice' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'my perfect one' or 'my undefiled one' for 'my blameless one.' The Hebrew term conveys completeness, innocence, or purity.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 잠들어 있었지만, 내 마음은 깨어 있었습니다. 내 사랑하는 이가 두드리는 소리[a]입니다. 「나에게 문을 열어 주십시오, 내 누이여, 내 사랑, 내 비둘기, 내 흠 없는 이여[b]. 내 머리는 이슬로 흠뻑 젖었고, 내 머리칼은 밤의 물방울로 젖었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 사랑하는 이가 두드리는 소리’는 ‘내 사랑하는 이의 목소리’로도 옮길 수 있습니다. 히브리어 qol은 문맥에 따라 ‘소리’ 또는 ‘목소리’를 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: ‘내 흠 없는 이’는 ‘내 온전한 이’ 또는 ‘내 순전한 이’로도 옮길 수 있습니다. 히브리어는 온전함, 순수함, 무흠함의 뜻을 함께 담습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְשֵׁנָה
  english_pob_choice: was asleep
  chosen_korean: 잠들어 있었지만
  alternatives_korean:
  - 잠자고 있었지만
  - 자고 있었지만
  lexicon: HALOT
  rationale: 상태를 자연스럽게 살리기 위해 진행형보다 과거 지속 상태를 나타내는 표현을 택했습니다.
- source_word: לִבִּי עֵר
  english_pob_choice: my heart was awake
  chosen_korean: 내 마음은 깨어 있었습니다
  alternatives_korean:
  - 내 심장은 깨어 있었습니다
  - 내 마음은 깨어 있었습니다
  lexicon: HALOT
  rationale: לֵב의 내면적 의미를 살려 ‘마음’으로 옮기고, 시적 대비를 위해 ‘깨어 있었습니다’를 사용했습니다.
- source_word: קוֹל דּוֹדִי דוֹפֵק
  english_pob_choice: The sound of my beloved knocking
  chosen_korean: 내 사랑하는 이의 소리—그가 두드리고 있었습니다
  alternatives_korean:
  - 내 사랑하는 이의 목소리—그가 두드리고 있었습니다
  - 내 사랑하는 이의 소리, 두드리는 소리
  lexicon: HALOT
  rationale: קוֹל은 ‘소리/목소리’가 모두 가능하지만, 이어지는 דוֹפֵק과 결합해 청각적 현장을 살리는 ‘소리’를 기본으로 두었습니다. ‘두드리고 있었습니다’로 행동을 분명히 했습니다.
- source_word: תַמָּתִי
  english_pob_choice: my blameless one
  chosen_korean: 내 흠 없는 이
  alternatives_korean:
  - 내 완전한 이
  - 내 순전한 이
  - 내 흠 없는 이
  lexicon: HALOT
  rationale: 도덕적·관계적 온전함을 담되, 현대어에서 오해를 줄이기 위해 ‘흠 없는’으로 옮겼습니다.
- source_word: רְסִיסֵי לָיְלָה
  english_pob_choice: the drops of the night
  chosen_korean: 밤의 이슬 방울
  alternatives_korean:
  - 밤의 방울들
  - 밤 이슬의 방울
  lexicon: HALOT
  rationale: 직역만으로는 한국어 이미지가 다소 어색하므로, 앞의 ‘이슬’과 평행을 이루도록 ‘밤의 이슬 방울’로 옮겨 시적 대응을 살렸습니다.
theological_decisions:
- issue: 연인 호칭들의 직역 유지
  chosen_reading: ‘내 누이, 내 사랑하는 이, 내 비둘기, 내 흠 없는 이’처럼 호칭을 그대로 살렸습니다.
  alternative_readings:
  - 호칭들을 하나의 완곡한 표현으로 통합
  - ‘비둘기’를 상징적 의미로만 풀어쓰기
  rationale: 아가의 반복적 애칭은 의미를 누적시키는 장치이므로, 관계의 긴장과 정서를 유지하기 위해 직역을 우선했습니다.
  doctrine_reference: 문학적 본문 해석 원칙
- issue: 화자의 대사 시작과 끝의 구분
  chosen_reading: 화자는 서술과 인용을 분리해, 뒤의 요청문을 직접화법으로 처리했습니다.
  alternative_readings:
  - 전체를 간접화법으로 통일
  rationale: 원문의 급작스러운 전환과 호소를 드러내기 위해 직접인용을 유지하는 것이 서사적 효과에 더 충실합니다.
