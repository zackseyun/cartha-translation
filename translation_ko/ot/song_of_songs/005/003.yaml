translation:
  language: ko
  text: 나는 이미 속옷을 벗었습니다. 어찌 다시 그것을 입겠습니까? 나는 이미 발을 씻었습니다. 어찌 그것을 더럽히겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּשַׁטְתִּי אֶת כֻּתָּנְתִּי
  english_pob_choice: I have taken off my tunic
  chosen_korean: 나는 이미 속옷을 벗었습니다
  alternatives_korean:
  - 나는 이미 겉옷을 벗었습니다
  - 나는 이미 튜닉을 벗었습니다
  lexicon: כֻּתֹּנֶת / כֻּתָּנֶת
  rationale: 본문의 가정 내 이미지가 핵심이므로, 한국어에서 가장 자연스럽게 몸에 입는 기본 의복을 가리키는 ‘속옷’으로 옮겨 집안의 사적인 맥락을 살렸습니다. ‘튜닉’은 직역이지만 현대 한국어 독자에게 즉시 감각이 오지 않아 본문의 생활상을 약화시킵니다.
- source_word: אֵיכָכָה אֶלְבָּשֶׁנָּה
  english_pob_choice: How can I put it on again?
  chosen_korean: 어찌 다시 그것을 입겠습니까?
  alternatives_korean:
  - 어찌 그것을 다시 입겠습니까?
  - 어찌 그것을 입을 수 있겠습니까?
  lexicon: אֵיכָכָה + לבש
  rationale: 수사적 질문의 긴박함을 살리기 위해 ‘어찌’와 ‘-겠습니까?’를 사용해 자연스러운 합쇼체 질문으로 옮겼습니다. ‘다시’는 원문 동사의 반복 복귀 의미를 드러냅니다.
- source_word: רָחַצְתִּי אֶת רַגְלַי
  english_pob_choice: I have washed my feet
  chosen_korean: 나는 이미 발을 씻었습니다
  alternatives_korean:
  - 나는 이미 제 발을 씻었습니다
  - 나는 발을 씻었습니다
  lexicon: רָחַץ + רַגְלַי
  rationale: 발을 씻은 뒤 집안에서 다시 더럽히지 않으려는 구체적 장면을 위해 직설적으로 옮겼습니다. ‘이미’를 보태 시제상 완료된 상태를 분명히 했습니다.
- source_word: אֵיכָכָה אֲטַנְּפֵם
  english_pob_choice: How can I soil them?
  chosen_korean: 어찌 그것을 더럽히겠습니까?
  alternatives_korean:
  - 어찌 그것들을 더럽히겠습니까?
  - 어찌 다시 더럽히겠습니까?
  lexicon: טנף
  rationale: 발을 씻은 뒤 다시 흙이나 먼지로 더럽히는 행위를 자연스럽게 표현하기 위해 ‘더럽히다’로 옮겼습니다. 한국어에서는 목적어를 ‘그것’을 반복해도 본문의 대구 구조가 유지됩니다.
theological_decisions:
- issue: 아가 5:3의 비유적 해석을 본문에 주입할지 여부
  chosen_reading: 주어진 문맥대로 집안의 매우 구체적인 일상 장면을 전면에 두고, 상징적 해석은 본문 밖의 읽기로 남겼습니다.
  alternative_readings:
  - 신부와 신랑의 관계를 상징하는 영적 해석을 본문에 반영
  - 교회 전통적 알레고리를 암시적으로 삽입
  rationale: 히브리어 문장은 의복을 벗고 발을 씻은 뒤 다시 그것을 입거나 더럽히기 어려워하는 일상적 논리를 직접 말하므로, 본문 자체가 허용하는 범위를 넘는 상징화를 피하는 것이 source-grounded 번역 원칙에 부합합니다.
  doctrine_reference: 성경 해석의 문맥 우선 원리
