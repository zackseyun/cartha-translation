  source_fidelity: 개정이 필요합니다. כֻּתֹּנֶת는 몸에 입는 기본 의복(튜닉/옷)을 가리키며, 현대 한국어의 ‘속옷’은 대체로 현대식 내의를 뜻하므로 지나치게 구체적이고 원문의 의복상을 왜곡할 수 있습니다. 또한 마지막 남성 복수 접미사는 씻은 ‘발들’을 받으므로 ‘그것을’이 아니라 ‘그것들을’ 또는 ‘발을’로 받아야 합니다.
  naturalness: 합쇼체의 수사 의문문은 자연스럽습니다. 다만 ‘나는 이미’의 ‘이미’는 원문의 완료형이 별도로 명시하는 시간 부사가 아니므로 빼는 편이 더 절제되고 자연스럽습니다. ‘내 옷/내 발’은 화자의 소유를 명료하게 하면서 문맥상 자연스럽습니다.
  terminology: ‘옷’은 כֻּתֹּנֶת의 기본 의복이라는 뜻을 무리 없이 전달하며, ‘더럽히다’는 טנף의 물리적 의미를 적절히 보존합니다. 본문에 성적·알레고리적 의미를 덧붙이지 않습니다.
