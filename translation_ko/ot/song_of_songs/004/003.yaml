  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
  footnotes:
  - marker: a
    text: Or 'your speech is lovely'; the Hebrew term can refer to speaking or speech, though here it likely points to the mouth in the poem's sequence of physical features.
    reason: lexical_alternative
  - marker: b
    text: Or 'through your veil'; the Hebrew expression suggests something seen through or from behind a covering.
    reason: lexical_alternative
  - marker: c
    text: Or 'your locks' or 'your hair' for 'your veil'; the Hebrew term is debated in this context.
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 입술은 진홍빛 실 같고, 당신의 입[a]은 아름답습니다. 당신의 관자놀이는 당신의 너울[c] 너머로[b] 보이는 석류 한 조각 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 말은 아름답습니다’로 옮길 수 있습니다. 히브리어는 말하기나 말을 가리킬 수도 있으나, 여기서는 신체를 묘사하는 시의 흐름상 ‘입’을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 너울을 통하여’로 옮길 수 있습니다. 히브리어 표현은 가리는 것을 사이에 두고 보이거나 그 너머에서 보이는 뉘앙스를 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 머리칼’ 또는 ‘당신의 머리카락 가닥’으로 옮길 수 있습니다. 이 히브리어 어휘의 의미는 이 문맥에서 논쟁적입니다.
    reason: alternative_reading
