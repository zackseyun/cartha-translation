base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/003.yaml
  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
  footnotes:
  - marker: a
    text: Or 'your speech is lovely'; the Hebrew term can refer to speaking or speech, though here it likely points to the mouth in the poem's sequence of physical features.
    reason: lexical_alternative
  - marker: b
    text: Or 'through your veil'; the Hebrew expression suggests something seen through or from behind a covering.
    reason: lexical_alternative
  - marker: c
    text: Or 'your locks' or 'your hair' for 'your veil'; the Hebrew term is debated in this context.
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 입술은 붉은 실 같고, 당신의 입은 아름답습니다. 당신의 관자놀이는 당신의 너울 뒤의 석류 조각 같습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 말은 아름답습니다’입니다. 히브리어는 ‘말하기/말’도 가리킬 수 있으나, 여기서는 시의 신체 묘사 흐름상 ‘입’을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 너울을 통해서’입니다. 히브리어 표현은 가리는 천을 사이에 두고 보이거나 그 너머에서 보이는 뉘앙스를 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘당신의 머리칼’ 혹은 ‘당신의 머리’입니다. 이 히브리어 어휘는 이 문맥에서 해석이 논쟁적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/ח֤וּט הַ/שָּׁנִי
  english_pob_choice: are like a scarlet thread
  chosen_korean: 붉은 실 같고
  alternatives_korean:
  - 홍색 실 같고
  - 주홍 실 같고
  - 붉은 끈 같고
  lexicon: HALOT
  rationale: חוּט는 가늘고 섬세한 ‘실/끈’의 이미지가 자연스럽고, שָׁנִי의 색감은 ‘붉은’으로 충분히 옮기되 시적 간결성을 살렸습니다.
- source_word: וּ/מִדְבָּרֵי/ךְ נָאוֶה
  english_pob_choice: your mouth is lovely
  chosen_korean: 당신의 입은 아름답습니다
  alternatives_korean:
  - 당신의 말은 아름답습니다
  - 당신의 입술은 아름답습니다
  - 당신의 발화는 아름답습니다
  lexicon: HALOT
  rationale: 문맥상 신체의 아름다움을 나열하는 비유이므로 ‘말’보다 ‘입’이 더 직접적이며, נָאוֶה는 ‘아름답습니다’가 가장 자연스럽습니다.
- source_word: כְּ/פֶלַח הָ/רִמּוֹן
  english_pob_choice: like a slice of pomegranate
  chosen_korean: 석류 조각 같습니다
  alternatives_korean:
  - 석류 한 쪽 같습니다
  - 석류 한 조각 같습니다
  - 석류 단면 같습니다
  lexicon: HALOT
  rationale: פֶלַח는 잘라낸 조각·단면을 가리키므로 ‘조각’이 핵심 이미지를 살리고, ‘석류’는 표준적인 식물명으로 옮겼습니다.
- source_word: מִ/בַּעַד לְ/צַמָּתֵךְ
  english_pob_choice: behind your veil
  chosen_korean: 당신의 너울 뒤의
  alternatives_korean:
  - 당신의 베일 뒤의
  - 당신의 장막 뒤의
  - 너울을 통해 보이는
  lexicon: HALOT
  rationale: צַמָּה는 이 문맥에서 전통적으로 ‘너울/베일’로 이해되며, מִבַּעַד은 ‘뒤의’로 간결하게 살리되 ‘through’ 가능성은 본문 각주로 보완했습니다.
theological_decisions:
- issue: פְּנִים-신체 묘사의 직설성 유지
  chosen_reading: ‘입’과 ‘관자놀이’를 직접적으로 옮겨, 시의 신체적 아름다움과 감각적 긴장을 약화하지 않았습니다.
  alternative_readings:
  - ‘말’로 완화하여 옮김
  - ‘뺨’으로 넓게 해석함
  rationale: 히브리어의 시적 병렬은 구체적 신체 부위를 통해 아름다움을 형상화하므로, 의미를 추상화하기보다 원문의 감각성을 보존하는 편이 타당합니다.
  doctrine_reference: 성서 시가의 직유와 육체 이미지 보존
- issue: צַמָּה의 의미 불확실성 처리
  chosen_reading: 본문에는 ‘너울’로 두고, 대안적 이해는 각주로 남겨 독자가 원문의 해석 여지를 볼 수 있게 했습니다.
  alternative_readings:
  - ‘머리칼’
  - ‘곱슬머리/가닥’
  rationale: 영어 POB의 주석처럼 이 어휘는 문맥상 논쟁적이므로, 하나로 단정하기보다 본문은 가장 방어 가능한 해석을 택하고 변이를 기록했습니다.
  doctrine_reference: 본문-주석 분리 원칙
