source:
  edition: WLC
  text: שִׁנַּ֨יִ/ךְ֙ כְּ/עֵ֣דֶר הַ/קְּצוּב֔וֹת שֶׁ/עָל֖וּ מִן הָ/רַחְצָ֑ה שֶׁ/כֻּלָּ/ם֙ מַתְאִימ֔וֹת וְ/שַׁכֻּלָ֖ה אֵ֥ין בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/002.yaml
  text: Your teeth are like a flock of shorn ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
  footnotes:
  - marker: a
    text: Or 'and none of them is bereaved.' The Hebrew keeps the sheep image rather than stating directly that no tooth is missing.
    reason: lexical_alternative
  - marker: b
    text: The paired-sheep imagery implies a full, evenly matched set of teeth.
    reason: cultural_note
translation:
  language: ko
  text: 당신의 이는 털 깎은 암양 떼 같아서 목욕한 데서 올라와 모두 쌍을 이루고, 그들 가운데 새끼를 잃은 것이 하나도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 치아가 아니라 양 떼의 정결하고 온전한 모습을 직접 말하므로, 비유를 유지한 번역입니다.
    reason: source_note
  - marker: b
    text: ‘쌍을 이룬다’는 표현은 치아가 빠짐없이 고르고 완전하다는 이미지를 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁנַּיִךְ
  english_pob_choice: your teeth
  chosen_korean: 당신의 이는
  alternatives_korean:
  - 당신의 치아는
  - 당신의 이빨은
  lexicon: WLC/HALOT
  rationale: 히브리어는 여인의 이를 가리키며, 현대 한국어에서는 시적이면서도 자연스러운 '이'를 쓰는 것이 원문 이미지에 가장 가깝습니다.
- source_word: כְּעֵדֶר הַקְּצוּבוֹת
  english_pob_choice: like a flock of shorn ewes
  chosen_korean: 털 깎은 암양 떼 같아서
  alternatives_korean:
  - 깎인 털의 양 떼 같아서
  - 전단한 암양 떼 같아서
  lexicon: WLC/HALOT
  rationale: עֵדֶר는 '떼'가 자연스럽고, קְצוּבוֹת는 깎인 양을 뜻하므로 '털 깎은 암양 떼'로 풀어 원문의 목축 비유를 그대로 살렸습니다.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  english_pob_choice: that have come up from the washing
  chosen_korean: 목욕한 데서 올라와
  alternatives_korean:
  - 씻은 데서 올라와
  - 씻김터에서 올라와
  lexicon: WLC/HALOT
  rationale: הָרַחְצָה는 구체적인 '씻음/목욕'을 가리키므로, 목축 장면을 유지하면서 한국어로는 '목욕한 데'가 가장 자연스럽습니다.
- source_word: מַתְאִימוֹת
  english_pob_choice: bearing twins
  chosen_korean: 모두 쌍을 이루고
  alternatives_korean:
  - 모두 쌍둥이를 낳고
  - 모두 짝을 이루고
  lexicon: WLC/HALOT
  rationale: 이 형용사는 '짝지음/쌍이 맞음'의 의미를 담으므로, 치아의 고른 배열을 드러내는 '쌍을 이루고'로 옮겼습니다.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  english_pob_choice: and none among them has lost her young
  chosen_korean: 그들 가운데 새끼를 잃은 것이 하나도 없습니다.
  alternatives_korean:
  - 그들 가운데 불임인 것이 하나도 없습니다.
  - 그들 가운데 잃은 새끼가 하나도 없습니다.
  lexicon: WLC/HALOT
  rationale: שַׁכֻּלָה는 '자식을 잃은/상실한' 뜻이므로, 양의 비유를 유지하면서도 한국어에서 자연스러운 '새끼를 잃은 것이 하나도 없습니다'로 옮겼습니다.
theological_decisions:
- issue: 시적 비유를 한국어로 얼마나 직접 유지할지
  chosen_reading: 치아를 실제 양 떼의 모습에 겹쳐 놓는 원문의 비유를 그대로 살려, 과도한 해설 없이 시적으로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 치아는 모두 가지런하고 하나도 빠지지 않았습니다.
  - 당신의 이는 양 떼처럼 고르고 온전합니다.
  rationale: 이 구절은 애정시의 비유이므로, 해석을 앞세워 평이하게 풀기보다 원문의 이미지와 긴장을 보존하는 편이 의미 전달에 더 충실합니다.
  doctrine_reference: 성경시가 사용하는 상징적·은유적 언어의 보존 원칙
