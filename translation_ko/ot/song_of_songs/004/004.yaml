  text: כְּ/מִגְדַּ֤ל דָּוִיד֙ צַוָּארֵ֔/ךְ בָּנ֖וּי לְ/תַלְפִּיּ֑וֹת אֶ֤לֶף הַ/מָּגֵן֙ תָּל֣וּי עָלָ֔י/ו כֹּ֖ל שִׁלְטֵ֥י הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/004.yaml
  text: Your neck is like the tower of David[a], built in rows of stone; a thousand shields hang on it[b], all the small shields of the warriors.
  footnotes:
  - marker: a
    text: Or 'built for armories,' 'built with battlements,' or 'built in courses.' The Hebrew term translated 'in rows of stone' (תלפיות) is rare and its precise sense is uncertain.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew uses two different words for defensive gear: מָגֵן (''shield'') and שֶׁלֶט, here rendered ''small shield'' to preserve the distinction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 목은 다윗의 망대 같고, 돌 층으로 지어졌으며, 그 위에 천 개의 방패가 매달려 있고, 모두 용사들의 작은 방패입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무기고를 위해 지어졌으나’, ‘성벽 돌층으로 지어졌으나’, ‘층층으로 지어졌으나’로도 옮길 수 있습니다. 히브리어 לְתַלְפִּיּוֹת는 드물며 정확한 뜻이 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 방어구를 가리키는 서로 다른 두 단어를 사용합니다. מָגֵן은 ‘방패’, שֶׁלֶט은 여기서 ‘작은 방패’로 옮겨 구별을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִגְדַּל דָּוִיד
  english_pob_choice: like the tower of David
  chosen_korean: 다윗의 망대 같고
  alternatives_korean:
  - 다윗의 탑 같고
  - 다윗의 성루 같고
  lexicon: HALOT
  rationale: 비교 표지 כְּ를 살려 직유로 옮기고, מִגְדָּל은 현대 한국어에서 시적·건축적 이미지가 살아 있는 '망대'로 옮겼습니다.
- source_word: צַוָּארֵךְ
  english_pob_choice: your neck
  chosen_korean: 당신의 목
  alternatives_korean:
  - 당신의 목덜미
  - 당신의 목줄기
  lexicon: HALOT
  rationale: 직접적인 신체 은유를 유지하기 위해 가장 자연스러운 표준어 표현을 택했습니다.
- source_word: לְתַלְפִּיּוֹת
  english_pob_choice: in rows of stone
  chosen_korean: 돌 층으로 지어졌으며
  alternatives_korean:
  - 무기고를 위해 지어졌으며
  - 성벽 돌층으로 지어졌으며
  - 층층의 돌로 지어졌으며
  lexicon: HALOT
  rationale: 희귀어라 단정적 군사 해석을 피하면서, 건축적·시적 이미지에 맞게 ‘돌 층’이라는 뜻을 드러냈습니다.
- source_word: אֶלֶף הַמָּגֵן / שִׁלְטֵי
  english_pob_choice: a thousand shields ... all the small shields
  chosen_korean: 천 개의 방패 ... 모두 용사들의 작은 방패
  alternatives_korean:
  - 천 개의 방패 ... 모두 용사들의 방패
  - 천 개의 큰 방패 ... 모두 용사들의 작은 방패
  lexicon: HALOT
  rationale: מָגֵן과 שֶׁלֶט/שִׁלְטֵי의 어휘 차이를 살리기 위해 ‘방패’와 ‘작은 방패’를 구분해 옮겼습니다.
theological_decisions:
- issue: 의역 여부와 희귀어 처리
  chosen_reading: 희귀어 לְתַלְפִּיּוֹת는 확정되지 않은 의미를 과도하게 해석하지 않고, 건축적 이미지가 드러나는 방향으로 옮겼습니다.
  alternative_readings:
  - 무기고를 위해 지어졌다는 해석
  - 성루/성벽의 군사 시설로 보는 해석
  rationale: 본문의 시적 은유를 보존하면서도, 증거가 약한 군사적 세부를 본문 자체보다 앞세우지 않기 위해서입니다.
  doctrine_reference: 시적 본문 해석의 절제 원칙
