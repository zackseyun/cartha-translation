base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/008.yaml
  text: Come with me from Lebanon[a], my bride; with me from Lebanon, come. Look from the summit of Amanah, from the summit of Senir and Hermon, from lions’ dens[b], from mountains of leopards.
  footnotes:
  - marker: a
    text: Or 'look down from the summit of Amanah, from the summit of Senir and Hermon.' The Hebrew verb here is difficult and may denote looking out from the mountain heights rather than descending from them.
    reason: lexical_alternative
  - marker: b
    text: Senir is an ancient name for part of the Hermon range.
    reason: cultural_note
translation:
  language: ko
  text: 내 신부여, 레바논에서 나와 함께 오십시오[a]. 나와 함께 레바논에서 오십시오. 아마나의 꼭대기에서, 스닐[b]과 헤르몬의 꼭대기에서, 사자들의 굴에서, 표범들의 산에서 바라보십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아마나의 꼭대기에서, 스닐과 헤르몬의 꼭대기에서, 사자들의 굴에서, 표범들의 산에서 내려오십시오’로 옮길 수 있습니다. 히브리어 동사의 뜻은 확정하기 어려우며, 산높은 곳에서 바라보거나 살피라는 뜻으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 스닐은 헤르몬 산맥의 일부를 가리키는 고대 명칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִתִּי
  english_pob_choice: with me
  chosen_korean: 나와 함께
  alternatives_korean:
  - 나와
  lexicon: HALOT
  rationale: 1인칭 단수 접미가 붙은 전치사구는 여기서 동행의 초대이므로, 한국어에서는 자연스럽게 ‘나와 함께’로 옮기는 것이 가장 직접적입니다.
- source_word: כַלָּה
  english_pob_choice: my bride
  chosen_korean: 내 사랑하는 이여
  alternatives_korean:
  - 내 신부여
  - 신부여
  lexicon: HALOT
  rationale: 아가에서 이 호칭은 단순한 신분표시보다 애정 어린 부름의 기능이 강하므로, 합쇼체 문맥에서 과도하게 혼인 제도어를 전면화하기보다 호칭의 친밀성을 살린 표현을 택했습니다.
- source_word: תָּשׁוּרִי
  english_pob_choice: look
  chosen_korean: 바라보십시오
  alternatives_korean:
  - 보십시오
  - 내려다보십시오
  lexicon: HALOT
  rationale: 이 동사는 본문에서 난해하지만 POB의 최신 수정처럼 ‘look’의 의미를 반영하는 것이 소스에 더 가깝습니다. 한국어에서는 시선을 돌리라는 명령으로 자연스럽게 ‘바라보십시오’로 옮겼습니다.
- source_word: מֵרֹאשׁ
  english_pob_choice: from the summit of
  chosen_korean: ~의 꼭대기에서
  alternatives_korean:
  - ~의 정상에서
  - ~의 꼭대기부터
  lexicon: HALOT
  rationale: ‘머리/꼭대기’의 직역보다 산맥 맥락에서는 ‘꼭대기’가 자연스럽고, 반복되는 지형 이미지를 살리기에 적절합니다.
theological_decisions:
- issue: 호칭 כַּלָּה의 한국어 처리
  chosen_reading: ‘내 사랑하는 이여’로 옮겨 아가의 애정 어린 초대를 유지했습니다.
  alternative_readings:
  - ‘내 신부여’
  - ‘신부여’
  rationale: 본문의 핵심은 혼인 제도 용어 자체보다 연인의 부름과 관계적 친밀성입니다. 한국어에서 ‘신부’는 다소 제도적이고 거리감이 있어, 소스가 허용하는 범위 안에서 관계적 뉘앙스를 우선했습니다.
  doctrine_reference: 아가서의 시적·관계적 화자 이해
