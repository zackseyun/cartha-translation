source:
  edition: WLC
  text: ע֤וּרִי צָפוֹן֙ וּ/ב֣וֹאִי תֵימָ֔ן הָפִ֥יחִי גַנִּ֖/י יִזְּל֣וּ בְשָׂמָ֑י/ו יָבֹ֤א דוֹדִ/י֙ לְ/גַנּ֔/וֹ וְ/יֹאכַ֖ל פְּרִ֥י מְגָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/016.yaml
  text: Awake[a], north wind, and come, south wind! Blow on my garden, so that its spices may flow[c][b]. Let my beloved come into his garden and eat its choice fruits.
  footnotes:
  - marker: a
    text: Hebrew 'north' and 'south'; 'wind' is supplied in English because the directions are addressed as agents who blow on the garden.
    reason: lexical_alternative
  - marker: b
    text: Or 'its perfume/fragrance may flow.' The Hebrew term can refer to aromatic spices or the scent they produce.
    reason: lexical_alternative
  - marker: c
    text: The shift from 'my garden' to 'his garden' is present in the Hebrew text and likely expresses mutual belonging within the lovers' imagery.
    reason: cross_reference
translation:
  language: ko
  text: 북풍아, 깨어나거라. 남풍아, 와라! 내 정원에 불어서 그 향기가 흘러나오게 하라. 내 사랑하는 이가 자기 정원에 들어와 그 고운 열매를 먹게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘북’과 ‘남’은 히브리어의 방향어를 살린 것이며, 문맥상 바람을 가리키므로 한국어에서는 ‘북풍’, ‘남풍’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 향료 자체나 그 향내를 가리킬 수 있어, ‘향기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 정원’에서 ‘자기 정원’으로 바뀌는 소유격 이동은 히브리어 본문에 있으며, 사랑시의 상호 소유 이미지를 드러냅니다.
    reason: cross_reference
lexical_decisions:
- source_word: ע֤וּרִי
  english_pob_choice: Awake
  chosen_korean: 깨어나거라
  alternatives_korean:
  - 일어나라
  - 깨어나라
  lexicon: HALOT
  rationale: 풍에 대한 의인적 부름을 살리기 위해 직설적 명령형으로 옮기되, 현대 한국어에서 자연스러운 호소로 처리했습니다.
- source_word: צָפוֹן / תֵימָן
  english_pob_choice: north wind / south wind
  chosen_korean: 북풍 / 남풍
  alternatives_korean:
  - 북쪽 / 남쪽
  lexicon: HALOT
  rationale: 영문 POB가 방향어를 바람으로 이해하듯, 문맥상 의인화된 바람이므로 한국어도 ‘북풍, 남풍’으로 구체화했습니다.
- source_word: הָפִ֥יחִי
  english_pob_choice: Blow on
  chosen_korean: 불어서
  alternatives_korean:
  - 불어
  - 입김을 불어
  lexicon: HALOT
  rationale: 정원 위로 바람이 작용하는 동작을 한국어 자연어로 옮기면서도, ‘향기가 흘러나오게’와 연결되는 조어적 이미지를 유지했습니다.
- source_word: בְשָׂמָ֑י/ו
  english_pob_choice: its spices
  chosen_korean: 그 향기
  alternatives_korean:
  - 그 향료들
  - 그 향긋한 내음
  lexicon: HALOT
  rationale: 히브리어는 향료/향내를 모두 가리킬 수 있으므로, 정원에서 퍼져 나오는 냄새의 결과를 드러내는 ‘향기’로 옮겼습니다.
- source_word: מְגָדָֽי/ו
  english_pob_choice: choice fruits
  chosen_korean: 고운 열매
  alternatives_korean:
  - 선택한 열매
  - 귀한 열매
  lexicon: HALOT
  rationale: ‘귀한/좋은 것들’의 뜻을 살리되, 사랑시의 감각적 이미지에 맞게 과도한 설명 없이 ‘고운 열매’로 정리했습니다.
theological_decisions:
- issue: 정원 이미지의 관능성과 소유격 이동
  chosen_reading: 알레고리로 풀지 않고, ‘내 정원’에서 ‘자기 정원’으로의 소유격 이동을 그대로 유지했습니다.
  alternative_readings:
  - 교회론적·영적 알레고리로 해석
  - 소유격을 하나로 평탄화
  rationale: 본문은 사랑시의 친밀한 비유를 직접 제시하므로, 원문이 주는 긴장과 상호 소유의 뉘앙스를 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
