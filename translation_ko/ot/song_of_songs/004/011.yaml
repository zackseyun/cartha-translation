base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/011.yaml
  text: Your lips drip honeycomb[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
  footnotes:
  - marker: a
    text: Or 'comb honey'; the Hebrew נֹפֶת is more specific than the later word for 'honey.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'honey and milk,' not the more familiar phrase 'milk and honey.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 입술은 신부여, 꿀송이처럼 떨어지고, 네 혀 아래에는 꿀과 젖이 있으며, 네 옷의 향기는 레바논의 향기와 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꿀송이’는 כאן의 נֹפֶת이 가리키는 더 구체적인 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 익숙한 관용구 ‘젖과 꿀’이 아니라 ‘꿀과 젖’의 순서입니다.
    reason: lexical_alternative
