  text: מַעְיַ֣ן גַּנִּ֔ים בְּאֵ֖ר מַ֣יִם חַיִּ֑ים וְ/נֹזְלִ֖ים מִן לְבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/015.yaml
  text: A spring of gardens[a], a well of living water[c][b], and streams flowing from Lebanon.
  footnotes:
  - marker: a
    text: Or 'a fountain of gardens'; the Hebrew מַעְיָן can denote a spring or fountainhead.
    reason: lexical_alternative
  - marker: b
    text: '''Living water'' is a Hebrew expression for fresh, flowing water, not stagnant water.'
    reason: cultural_note
  - marker: c
    text: Or 'and streams flowing from Lebanon' or 'and flowing waters from Lebanon.' The Hebrew participle emphasizes water in motion.
    reason: lexical_alternative
translation:
  language: ko
  text: 정원들의 샘, 생수의 우물, 레바논에서 흘러내리는 물줄기입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정원들의 샘터’입니다. 히브리어 מַעְיַן은 샘이나 샘의 근원을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생수’는 고여 있지 않은, 신선하고 흐르는 물을 가리키는 히브리어 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘레바논에서 흘러오는 물줄기’입니다. 히브리어 분사는 물이 계속 움직이며 흐르는 모습을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְיַן
  english_pob_choice: spring
  chosen_korean: 샘
  alternatives_korean:
  - 샘물
  - 분천
  - 원천
  lexicon: HALOT
  rationale: 자연적으로 솟는 물의 근원을 가리키므로 한국어에서는 가장 직관적인 ‘샘’이 적절합니다. 영어 POB의 ‘spring’과도 대응합니다.
- source_word: גַּנִּים
  english_pob_choice: gardens
  chosen_korean: 정원들
  alternatives_korean:
  - 정원
  - 동산들
  lexicon: HALOT
  rationale: 복수형이 분명하므로 복수를 살려 ‘정원들’로 옮겼습니다. 단수로 완화하면 히브리어의 복수 감각이 사라집니다.
- source_word: מַיִם חַיִּים
  english_pob_choice: living water
  chosen_korean: 살아 있는 물
  alternatives_korean:
  - 생수
  - 흐르는 물
  lexicon: HALOT
  rationale: 관용적으로는 ‘생수’도 가능하지만, 본문 이미지의 생동감과 ‘living water’의 직역성을 함께 살리기 위해 ‘살아 있는 물’을 택했습니다.
- source_word: וְנֹזְלִים
  english_pob_choice: streams flowing
  chosen_korean: 흘러내리는 시내
  alternatives_korean:
  - 흐르는 시내
  - 흘러가는 물줄기
  lexicon: HALOT
  rationale: 분사형은 정지된 상태가 아니라 계속 아래로 흐르는 움직임을 강조하므로 ‘흘러내리는’으로 옮겼습니다. ‘시내’는 물줄기의 구체성을 더해 줍니다.
theological_decisions:
- issue: 이미지의 시적 병렬을 한국어에서 얼마나 직역적으로 유지할지
  chosen_reading: 세 개의 물 이미지—샘, 우물, 시내—를 병렬로 유지하고, 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - 의미를 풀어 ‘풍성한 생명의 근원’처럼 의역하기
  - ‘레바논에서 오는 물’로 단순화하기
  rationale: 본문은 상징적 이미지의 중첩으로 아름다움을 형성하므로, 해석을 과도하게 풀기보다 이미지 자체를 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 시가서의 비유적·시적 문맥
