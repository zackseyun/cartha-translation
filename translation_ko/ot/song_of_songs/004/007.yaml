  lexicon: HALOT
  rationale: 지혜/사랑시의 애정 어린 호칭으로서 인격적 친밀함을 살리되, '연인'보다 문어적으로 무난한 '사랑하는 이'를 사용했습니다.
- source_word: וּמוּם
  english_pob_choice: blemish
