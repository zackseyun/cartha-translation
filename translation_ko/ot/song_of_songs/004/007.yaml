  - 다
  lexicon: HALOT
  rationale: 여성 2인칭 단수 접미사가 붙은 הכל/כולל 강조를 한국어에서는 '완전히'로 옮겨 전체적·총체적 아름다움을 자연스럽게 살렸습니다.
- source_word: יָפָה
