  - 결점
  - 티
  lexicon: HALOT
  rationale: מוּם의 물리적·비유적 결함 의미를 한국어의 표준적 표현 '흠'으로 옮겨, '결점'보다 시적이고 '티'보다 덜 구어적으로 처리했습니다.
- source_word: אֵין בָּךְ
  english_pob_choice: there is no ... in you
  chosen_korean: 당신에게는 … 하나도 없습니다
  alternatives_korean:
  - 당신 안에는 …이 없습니다
  - 당신에게는 …이 없습니다
  - 당신 안에 …이 하나도 없습니다
  lexicon: HALOT
  rationale: 존재 부정과 전치사의 결합을 한국어에서는 '당신에게는'으로 자연스럽게 풀어, 부정의 전면성을 '하나도'로 보강했습니다.
theological_decisions:
- issue: 호칭 רַעְיָתִי의 정서적 강도
  chosen_reading: 가까운 애정 호칭으로서 '나의 사랑하는 이여'를 유지했습니다.
  alternative_readings:
  - 나의 사랑이여
  - 나의 연인이여
  - 나의 벗이여
  rationale: 본문은 단순 정보가 아니라 친밀한 사랑의 직접 호칭이므로, 관계적 온기를 약화시키지 않으면서도 지나치게 현대적·비문학적인 어휘는 피했습니다.
  doctrine_reference: Song of Songs의 사랑시적 문맥과 문학적 장르
