  text: Your two breasts are like two fawns[a], twins of a gazelle, grazing among the lilies.
  footnotes:
  - marker: a
    text: Or 'twins of a doe.' The Hebrew צְבִיָּה can refer more generally to a female deer-like animal; 'gazelle' is retained here to match the Song's recurring imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 두 젖가슴은 두 새끼 사슴 — 곧 암사슴의 쌍둥이들 — 같으며, 백합들 가운데에서 풀을 뜯고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘암사슴의 쌍둥이’는 히브리어 צְבִיָּה를 여성형 사슴류로 이해한 번역입니다. POB는 송가의 반복 이미지를 살리기 위해 ‘gazelle’ 계열 해석을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  english_pob_choice: your two breasts
  chosen_korean: 당신의 두 젖가슴
  alternatives_korean:
  - 당신의 가슴
  - 당신의 두 가슴
  lexicon: HALOT
  rationale: 히브리어는 ‘두 개’와 ‘당신의 젖가슴’을 명시하므로, 한국어도 수량을 살려 시적 대구를 유지했습니다. ‘젖가슴’은 본문 이미지에 직접 대응하지만 지나치게 완곡하지 않게 합니다.
- source_word: עֳפָרִים
  english_pob_choice: fawns
  chosen_korean: 두 새끼 사슴
  alternatives_korean:
  - 어린 사슴
  - 새끼 사슴
  - 어린 영양
  lexicon: HALOT
  rationale: 작고 어린 짐승의 이미지를 살리기 위해 ‘새끼 사슴’을 택했고, ‘두’를 반복해 원문의 수사적 병치를 반영했습니다.
- source_word: תְּאוֹמֵי צְבִיָּה
  english_pob_choice: twins of a gazelle
  chosen_korean: 암사슴의 쌍둥이들
  alternatives_korean:
  - 암사슴의 쌍둥이
  - 가젤의 쌍둥이
  - 암영양의 쌍둥이
  lexicon: HALOT
  rationale: צְבִיָּה는 암사슴/암가젤을 가리킬 수 있으므로, 한국어에서는 널리 이해되는 ‘암사슴’으로 옮겨 반복적 자연 이미지를 유지했습니다. ‘쌍둥이들’은 히브리어의 복수 뉘앙스를 드러냅니다.
- source_word: הָרֹעִים בַּשּׁוֹשַׁנִּים
  english_pob_choice: grazing among the lilies
  chosen_korean: 백합들 가운데에서 풀을 뜯고 있습니다
  alternatives_korean:
  - 백합들 사이에서 풀을 뜯고 있습니다
  - 백합들 가운데서 먹고 있습니다
  lexicon: HALOT
  rationale: רעה의 기본 의미를 ‘풀을 뜯다’로 살려 목가적 이미지를 유지했고, בַּשּׁוֹשַׁנִּים은 관용적으로 ‘백합들 가운데’로 옮겼습니다. 진행형 표현은 시적 현재를 한국어로 자연스럽게 드러냅니다.
