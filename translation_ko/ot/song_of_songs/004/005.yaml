  rationale: 아가서는 배우자 사랑의 시적 은유를 의도적으로 사용하므로, 원문의 감각적 힘을 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: Song of Songs의 문학적 장르와 정경적 시적 해석
