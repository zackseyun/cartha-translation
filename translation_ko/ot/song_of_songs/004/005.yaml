  rationale: צְבִיָּה는 암사슴/암가젤을 가리킬 수 있으므로, 한국어에서는 널리 이해되는 ‘암사슴’으로 옮겨 반복적 자연 이미지를 유지했습니다. ‘쌍둥이들’은 히브리어의 복수 뉘앙스를 드러냅니다.
- source_word: הָרֹעִים בַּשּׁוֹשַׁנִּים
