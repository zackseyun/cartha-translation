  text: עַ֤ד שֶׁ/יָּפ֨וּחַ֙ הַ/יּ֔וֹם וְ/נָ֖סוּ הַ/צְּלָלִ֑ים אֵ֤לֶךְ לִ/י֙ אֶל הַ֣ר הַ/מּ֔וֹר וְ/אֶל גִּבְעַ֖ת הַ/לְּבוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/006.yaml
  text: Until the day breathes and the shadows flee[b][a], I will go to the mountain of myrrh and to the hill of frankincense.
  footnotes:
  - marker: a
    text: Or 'Until the day blows/grows cool and the shadows flee.' The Hebrew verb is literally 'breathes' and may evoke the evening breeze or the breaking of dawn.
    reason: lexical_alternative
  - marker: b
    text: Or simply 'I will go to myself' / 'I will go.' The Hebrew includes an ethical dative ('for myself'), which may add emphasis rather than a separate idea.
    reason: lexical_alternative
translation:
  language: ko
  text: 날이 숨을 내쉬고 그림자들이 달아날 때까지, 나는 몰약의 산과 유향의 언덕으로 가겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '날이 숨을 내쉬거나 서늘해지고, 그림자들이 달아날 때까지'로도 옮길 수 있습니다. 히브리어 동사는 문자적으로는 '숨 쉬다/불다'이며, 저녁 바람이나 새벽의 기운을 떠올리게 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 단순히 '나는 갈 것입니다'로 옮길 수 있습니다. 히브리어는 윤리적 여격('자기 자신에게/자기 위해')을 포함하며, 별도의 뜻이라기보다 강조를 더할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד שֶׁיָּפ֨וּחַ הַיּוֹם
  english_pob_choice: Until the day breathes
  chosen_korean: 날이 숨을 내쉬고 ... 할 때까지
  alternatives_korean:
  - 날이 숨 쉬고 ... 할 때까지
  - 날이 서늘해지고 ... 할 때까지
  - 날이 밝아오고 ... 할 때까지
  lexicon: HALOT
  rationale: פּוּחַ의 기본 뜻인 '숨 쉬다/불다'를 살려, 시적 의인화와 여운을 유지하는 방향으로 옮겼습니다.
- source_word: וְנָסוּ הַצְּלָלִים
  english_pob_choice: and the shadows flee
  chosen_korean: 그림자들이 달아날
  alternatives_korean:
  - 그림자들이 사라질
  - 그림자들이 도망칠
  lexicon: HALOT
  rationale: נוס의 역동성을 살리되 한국어 시어로는 '달아나다'가 가장 자연스럽고 이미지가 분명합니다.
- source_word: אֵלֶךְ לִי
  english_pob_choice: I will go away
  chosen_korean: 나는 ... 가겠습니다
  alternatives_korean:
  - 나는 ... 가게 되겠습니다
  - 나는 ... 가겠습니다(저를 위해)
  - 나는 ... 가리이다
  lexicon: HALOT
  rationale: לִי의 윤리적 여격은 문맥상 별도의 목적어가 아니라 강조로 보이므로 본문에는 과잉 설명하지 않고, 단순한 1인칭 의지문으로 처리했습니다.
- source_word: הַר הַמּוֹר / גִּבְעַת הַלְּבוֹנָה
  english_pob_choice: the mountain of myrrh / the hill of frankincense
  chosen_korean: 몰약의 산 / 유향의 언덕
  alternatives_korean:
  - 몰약의 산 / 유향의 작은 언덕
  - 몰약 산 / 유향 언덕
  lexicon: HALOT
  rationale: מֹר는 '몰약', לְבוֹנָה는 일반적 '향'이 아니라 '유향/프랑킨센스'이므로 구체적 향료 명칭을 보존했습니다.
theological_decisions:
