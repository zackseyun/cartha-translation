  rationale: 히브리어 본문은 지시 대상을 명시하지 않으므로, 본문이 말하는 이미지 이상의 해석을 본문 안에 삽입하지 않는 것이 가장 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 만큼만 말하기'
