  lexicon: HALOT
  rationale: לִי의 윤리적 여격은 문맥상 별도의 목적어가 아니라 강조로 보이므로 본문에는 과잉 설명하지 않고, 단순한 1인칭 의지문으로 처리했습니다.
- source_word: הַר הַמּוֹר / גִּבְעַת הַלְּבוֹנָה
  english_pob_choice: the mountain of myrrh / the hill of frankincense
  chosen_korean: 몰약의 산 / 유향의 언덕
  alternatives_korean:
  - 몰약의 산 / 유향의 작은 언덕
  - 몰약 산 / 유향 언덕
  lexicon: HALOT
  rationale: מֹר는 '몰약', לְבוֹנָה는 일반적 '향'이 아니라 '유향/프랑킨센스'이므로 구체적 향료 명칭을 보존했습니다.
