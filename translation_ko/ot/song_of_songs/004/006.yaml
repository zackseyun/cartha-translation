  - 날이 밝아오고 ... 할 때까지
  lexicon: HALOT
  rationale: פּוּחַ의 기본 뜻인 '숨 쉬다/불다'를 살려, 시적 의인화와 여운을 유지하는 방향으로 옮겼습니다.
- source_word: וְנָסוּ הַצְּלָלִים
  english_pob_choice: and the shadows flee
  chosen_korean: 그림자들이 달아날
  alternatives_korean:
