translation:
  language: ko
  text: 당신의 사랑이 얼마나 아름다운지요, 내 누이, 내 신부여![a] 당신의 사랑이 포도주보다 얼마나 더 좋은지요! 당신의 향유의 향기가 모든 향품보다 얼마나 더 좋은지요![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 애무’로 옮길 수 있습니다. 히브리어 דֹדַיִךְ는 이 절에서 두 번 나오며, 육체적 애정 표현을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 향유’는 아마도 향기로운 기름이나 향유를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַה יָּפוּ
  english_pob_choice: How beautiful
  chosen_korean: 어찌 그리 아름다운지요
  alternatives_korean:
  - 얼마나 아름다운지요
  - 참 아름답습니다
  lexicon: WLC + HALOT
  rationale: 감탄문 마ה의 놀라움과 찬사를 한국어 자연어로 살리기 위해 '어찌 그리'를 택했고, יָּפוּ는 단순한 '좋다'보다 미적 아름다움을 드러내는 '아름답다'로 옮겼습니다.
- source_word: דֹדַיִךְ
  english_pob_choice: your love
  chosen_korean: 당신의 사랑
  alternatives_korean:
  - 당신의 애무
  - 당신의 애정
  lexicon: HALOT
  rationale: 영문 POB의 본문 선택을 따라 기본 의미를 '사랑'으로 유지해 관계적 찬미를 보존했고, 지나치게 육체적으로 좁히는 해석은 본문 주석으로만 열어 두었습니다.
- source_word: אֲחֹתִי כַלָּה
  english_pob_choice: my sister, my bride
  chosen_korean: 내 누이, 내 신부
  alternatives_korean:
  - 내 누이신부
  - 내 자매, 내 신부
  lexicon: HALOT
  rationale: 두 호칭을 분리해 병렬로 옮겨 히브리어의 중첩된 친밀감을 드러냈습니다. 한국어 교회 전통의 '자매'보다 직역적인 '누이'가 본문의 정서와 평행성을 더 잘 보존합니다.
- source_word: וְרֵיחַ שְׁמָנַיִךְ מִכָּל בְּשָׂמִים
  english_pob_choice: the fragrance of your oils than all spices
  chosen_korean: 당신의 기름의 향기는 모든 향품보다 더하군요
  alternatives_korean:
  - 당신의 향유의 향기는 모든 향품보다 더하군요
  - 당신의 기름 향기는 모든 향료보다 더하군요
  lexicon: HALOT
  rationale: שְׁמָנַיִךְ는 문자적으로 '당신의 기름들'이므로 기본 이미지를 살리되, 문맥상 향기로운 기름이라는 점을 한국어에서 자연스럽게 드러내기 위해 '기름의 향기'로 옮겼습니다. בְּשָׂמִים은 아로마 계열의 총칭이므로 '향품'으로 넓게 처리했습니다.
theological_decisions:
- issue: 사랑/애무의 이중 가능성
  chosen_reading: 본문은 관계적 찬미를 주로 드러내는 '사랑'을 본문 텍스트에 두고, 육체적 애무의 가능성은 주석적 대안으로만 남겼습니다.
  alternative_readings:
  - '''애무''로 좁혀 번역'
  - '''사랑의 교감''으로 완화'
  rationale: 히브리어 דֹדַיִךְ는 문맥상 사랑, 애정 표현, 애무까지 포괄할 수 있지만, 시어의 모호성과 양가성을 유지하는 것이 본문이 지닌 힘을 더 정확히 전달합니다.
  doctrine_reference: 시가서의 사랑 언어 해석
