  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנָּ֨/ךְ יָפָ֤ה רַעְיָתִ/י֙ הִנָּ֣/ךְ יָפָ֔ה עֵינַ֣יִ/ךְ יוֹנִ֔ים מִ/בַּ֖עַד לְ/צַמָּתֵ֑/ךְ שַׂעְרֵ/ךְ֙ כְּ/עֵ֣דֶר הָֽ/עִזִּ֔ים שֶׁ/גָּלְשׁ֖וּ מֵ/הַ֥ר גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/001.yaml
  text: Look[a], you are beautiful, my darling; look, you are beautiful. Your eyes are doves behind your veil[b]. Your hair is like a flock of goats streaming down from Mount Gilead.
  footnotes:
  - marker: a
    text: Or 'through your veil.' The Hebrew expression suggests partial concealment behind a covering.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term translated 'veil' may also be understood as 'locks' or 'braid,' though 'veil' best fits the immediate context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그대는 아름답습니다, 나의 사랑이여. 보십시오, 그대는 아름답습니다. 그대의 눈은 그대의 너울 뒤의 비둘기 같고, 그대의 머리카락은 길르앗 산에서 내려오는 염소 떼 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그대의 너울을 통해'로도 옮길 수 있습니다. 히브리어 표현은 가림막 너머로 부분적으로 보이는 느낌을 시사합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 용어는 '너울' 외에 '머리칼'이나 '땋은 머리'로도 이해될 수 있으나, 바로 뒤의 문맥에는 '머리카락'이 따로 나오므로 여기서는 '너울'을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  english_pob_choice: Look, you are
  chosen_korean: 보십시오, 그대는
  alternatives_korean:
  - 보라, 그대는
  - 보십시오, 당신은
  - 이 보십시오, 그대는
  lexicon: HALOT
  rationale: 감탄적·지시적 표현을 현대 한국어에서 자연스럽게 살리기 위해 '보십시오'를 택했고, 연인 사이의 시적 호칭으로는 '그대'가 가장 잘 맞습니다.
- source_word: רַעְיָתִי
  english_pob_choice: my darling
  chosen_korean: 나의 사랑이여
  alternatives_korean:
  - 나의 사랑
  - 나의 연인
  - 내 사랑이여
  lexicon: HALOT
  rationale: 이 표현은 아가서에서 애정 어린 여성 호칭이므로, 지나치게 일상적인 'darling'보다 시적이고 정중한 '나의 사랑이여'가 문맥에 맞습니다.
- source_word: מִבַּעַד לְצַמָּתֵךְ
  english_pob_choice: behind your veil
  chosen_korean: 그대의 너울 뒤의
  alternatives_korean:
  - 그대의 베일 뒤의
  - 그대의 머리쓰개 뒤의
  - 그대의 너울을 통해 보이는
  lexicon: HALOT
  rationale: POB의 각주처럼 이 표현은 'veil'뿐 아니라 부분적 가림을 시사하므로, 본문은 자연스럽게 '너울 뒤의'로 옮기고 해석의 폭을 과도하게 좁히지 않았습니다.
- source_word: שַׂעְרֵךְ
  english_pob_choice: Your hair
  chosen_korean: 그대의 머리카락은
  alternatives_korean:
  - 그대의 머리는
  - 그대의 머리털은
  lexicon: HALOT
  rationale: 시적 비교의 대상이 되는 신체 부위로서 한국어에서는 '머리카락'이 가장 직관적이고 이미지도 잘 전달합니다.
- source_word: שֶׁגָּלְשׁוּ מֵהַר גִּלְעָד
  english_pob_choice: streaming down from Mount Gilead
  chosen_korean: 길르앗 산에서 내려오는
  alternatives_korean:
  - 길르앗 산에서 흘러내리는
  - 길르앗 산을 타고 내려오는
  - 길르앗 산에서 쏟아져 내려오는
  lexicon: HALOT
  rationale: 염소 떼의 움직임을 시각적으로 그리는 동사이므로, '내려오는'을 기본으로 하여 자연스럽고 강한 하강 이미지를 살렸습니다.
theological_decisions:
- issue: 아가서의 연인 호칭을 어떻게 한국어로 재현할지
  chosen_reading: '''나의 사랑이여''로 번역해 친밀함과 시적 품위를 함께 살렸습니다.'
  alternative_readings:
  - 나의 사랑
  - 나의 연인
  - 내 사랑이여
  rationale: 본문은 신학적 용어가 아니라 사랑 노래의 직접 화법이므로, 한국어 독자가 과도한 평어감이나 교회적 상투어 없이 원문의 애정 표현을 느끼도록 했습니다.
  doctrine_reference: Song of Songs의 문학적/시적 장르 이해
