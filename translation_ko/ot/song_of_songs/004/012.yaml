  text: A locked garden is my sister[a], my bride; a locked spring[b], a sealed fountain.
  footnotes:
  - marker: a
    text: Or 'shut' for both occurrences of 'locked.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'spring' can elsewhere mean 'heap,' but here the parallel with 'fountain' supports the water-source sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 누이, 내 신부는 잠긴 동산이며, 잠긴 샘이고 봉해진 샘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠긴’은 여기서 두 번 반복된 히브리어 נָעוּל을 옮긴 것입니다. ‘닫힌’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גַּל은 다른 문맥에서는 ‘더미’를 뜻할 수도 있지만, 여기서는 뒤의 ‘샘’과 이루는 평행 때문에 물 근원을 가리키는 말로 이해했습니다.
    reason: lexical_alternative
