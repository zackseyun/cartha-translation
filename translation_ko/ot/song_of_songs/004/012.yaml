source:
  edition: WLC
  text: גַּ֥ן נָע֖וּל אֲחֹתִ֣/י כַלָּ֑ה גַּ֥ל נָע֖וּל מַעְיָ֥ן חָתֽוּם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/012.yaml
  text: A locked garden is my sister[a], my bride; a locked spring[b], a sealed fountain.
  footnotes:
  - marker: a
    text: Or 'shut' for both occurrences of 'locked.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'spring' can elsewhere mean 'heap,' but here the parallel with 'fountain' supports the water-source sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 잠근 동산은 내 누이, 내 신부요; 잠근 샘이요, 봉한 샘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠근’은 여기서 두 번 반복된 히브리어 נָעוּל을 옮긴 것입니다. ‘닫힌’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 גַּל은 다른 문맥에서는 ‘더미’ 뜻도 가능하지만, 여기서는 뒤의 ‘샘’과의 평행 때문에 물 근원인 ‘샘’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּן
  english_pob_choice: garden
  chosen_korean: 동산
  alternatives_korean:
  - 정원
  - 원
  lexicon: HALOT
  rationale: 히브리어의 기본 뜻은 ‘garden’이므로 한국어에서도 자연스럽고 시적인 ‘동산’을 택했습니다. 앞의 ‘잠근’이 이미 폐쇄성을 드러내므로, 명사에 ‘울타리 있는’ 같은 설명을 덧붙이지 않았습니다.
- source_word: נָעוּל
  english_pob_choice: locked
  chosen_korean: 잠근
  alternatives_korean:
  - 닫힌
  - 봉한
  - 막은
  lexicon: HALOT
  rationale: 수동분사로서 ‘잠겨 있는/잠근’의 뜻을 가지며, 반복된 잠금 이미지를 살리기 위해 두 번 모두 같은 표현으로 옮겼습니다.
- source_word: אֲחֹתִי כַלָּה
  english_pob_choice: my sister, my bride
  chosen_korean: 내 누이, 내 신부
  alternatives_korean:
  - 내 자매, 내 신부
  - 내 누이이자 내 신부
  lexicon: HALOT
  rationale: 노래의 친밀한 호칭이지만, 본문이 실제 친족칭을 사용하므로 이를 보존했습니다. כַלָּה는 ‘신부’가 직접적인 뜻이어서 전통적 교회어보다 직역에 가깝게 유지했습니다.
- source_word: גַּל
  english_pob_choice: spring
  chosen_korean: 샘
  alternatives_korean:
  - 샘물
  - 근원
  - 더미
  lexicon: HALOT
  rationale: 문맥상 다음의 מַעְיָן과 평행을 이루는 물 근원 이미지가 가장 강하므로 ‘샘’으로 옮겼습니다. 다른 곳에서 가능한 ‘더미’ 뜻은 여기서는 평행법 때문에 배제했습니다.
- source_word: חָתוּם
  english_pob_choice: sealed
  chosen_korean: 봉한
  alternatives_korean:
  - 봉인한
  - 닫은
  - 인봉한
  lexicon: HALOT
  rationale: ‘sealed’의 직접 대응으로 한국어의 ‘봉한’을 선택해, 잠금과는 다른 추가적 차단·보호의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 애정적 호칭의 직역 여부
  chosen_reading: ‘내 누이, 내 신부’라는 이중 호칭을 그대로 살려, 시적 친밀성과 소속감을 함께 드러냈습니다.
  alternative_readings:
  - ‘사랑하는 나의 신부’처럼 의역
  - 호칭을 하나로 합쳐 ‘내 신부’만 번역
  rationale: 본문은 친족칭과 혼인 호칭을 병렬로 배치해 정서적 긴장을 만듭니다. 이를 완화하지 않고 유지하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 시적 문맥에서의 은유와 병렬법
