  text: שְׁלָחַ֨יִ/ךְ֙ פַּרְדֵּ֣ס רִמּוֹנִ֔ים עִ֖ם פְּרִ֣י מְגָדִ֑ים כְּפָרִ֖ים עִם נְרָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/013.yaml
  text: Your shoots are an orchard of pomegranates with choice fruits, henna with nards.
translation:
  language: ko
  text: 당신의 움은 석류 동산이니, 값진 열매들과 함께하고, 헤나와 나르드와 함께합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פַּרְדֵּס는 일반적인 ‘과수원/동산’보다 더 울창하고 귀한 나무들이 있는 정원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: מְגָדִים는 ‘값진, 귀한’의 뜻을 담아 선택된 열매들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: נְרָדִים은 향기로운 식물을 가리키며, 전통 번역들은 ‘nard’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָחַיִ/ךְ
  english_pob_choice: Your shoots
  chosen_korean: 당신의 움
  alternatives_korean:
  - 당신의 가지
  - 당신의 순
  lexicon: 움
  rationale: 문맥상 포도나무의 새순·가지 이미지를 가리키므로, 한국어에서 식물의 새움과 생장 이미지를 살리는 ‘움’으로 옮겼습니다.
- source_word: פַּרְדֵּס
  english_pob_choice: an orchard
  chosen_korean: 석류 동산
  alternatives_korean:
  - 과수원
  - 정원
  lexicon: 동산
  rationale: 원문과 POB의 ‘orchard of pomegranates’를 따라 석류가 중심이 되는 과수의 울창함을 ‘동산’으로 자연스럽게 표현했습니다.
- source_word: פְּרִי מְגָדִים
  english_pob_choice: choice fruits
  chosen_korean: 값진 열매들
  alternatives_korean:
  - 고운 열매들
  - 좋은 열매들
  lexicon: 열매
  rationale: ‘choice’의 선별된 귀함을 ‘값진’으로 살리고, 복수형을 반영해 ‘열매들’로 옮겼습니다.
- source_word: כְּפָרִים עִם נְרָדִים
  english_pob_choice: henna with nards
  chosen_korean: 헤나와 나르드와
  alternatives_korean:
  - 헤나와 나르드
  - 고수풀과 나르드
  lexicon: 외래어 표기
  rationale: POB의 식물명 선택을 유지하되, 원문 병렬 구조를 드러내기 위해 함께함을 나타내는 연결어를 넣었습니다.
theological_decisions:
- issue: 시적 은유를 직역할지 자연화할지
  chosen_reading: 원문의 감각적 식물 은유를 보존해 연인의 몸을 찬미하는 시적 이미지를 그대로 드러냈습니다.
  alternative_readings:
  - 비유를 완화해 의미만 풀어쓰기
  - 보다 관습적인 ‘동산’ 중심 표현으로 평이화
  rationale: 아가서는 은유 자체가 의미 전달의 핵심이므로, 과도한 해석적 풀이보다 원문의 이미지 밀도를 살리는 편이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 성서 시가의 직유·은유 보존
