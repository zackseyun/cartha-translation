id: SNG.4.14
reference: Song of Songs 4:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֵ֣רְדְּ וְ/כַרְכֹּ֗ם קָנֶה֙ וְ/קִנָּמ֔וֹן עִ֖ם כָּל עֲצֵ֣י לְבוֹנָ֑ה מֹ֚ר וַ/אֲהָל֔וֹת עִ֖ם כָּל רָאשֵׁ֥י בְשָׂמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/014.yaml
  text: nard and saffron[a], calamus and cinnamon, with all the trees of frankincense, myrrh and aloes[e][d][c][b], with all the finest spices.
  footnotes:
  - marker: a
    text: Or 'spikenard.'
    reason: lexical_alternative
  - marker: b
    text: Or 'sweet cane' for 'calamus.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew literally, 'with all trees of frankincense.'
    reason: lexical_alternative
  - marker: d
    text: '''Aloes'' here likely refers to fragrant agarwood, not aloe vera.'
    reason: cultural_note
  - marker: e
    text: Hebrew literally, 'with all the chief spices.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나드와 사프란, 갈대와 계피, 모든 유향나무와 함께하는 몰약과 알로에, 모든 가장 좋은 향료입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵרְדְּ
  english_pob_choice: nard
  chosen_korean: 나드
  alternatives_korean:
  - 스파이크나드
  lexicon: HALOT
  rationale: 향료 목록의 첫 항목으로, 전통적 식별인 nard를 한국어 음역으로 간결하게 옮겼습니다.
- source_word: כַרְכֹּם
  english_pob_choice: saffron
  chosen_korean: 사프란
  alternatives_korean:
  - 샤프란
  - 사프런
  lexicon: HALOT
  rationale: 값비싼 향신료를 가리키는 표준 명칭을 따라 현대 한국어의 통용형으로 옮겼습니다.
- source_word: קָנֶה
  english_pob_choice: calamus
  chosen_korean: 갈대
  alternatives_korean:
  - 향갈대
  - 창포
  lexicon: HALOT
  rationale: POB의 calamus는 향료 목록에서 향기로운 갈대/줄기 식물을 가리키므로, 일반적인 식물명인 갈대로 직역하되 향료 문맥을 살렸습니다.
- source_word: עִם כָּל עֲצֵי לְבוֹנָה
  english_pob_choice: with all the trees of frankincense
  chosen_korean: 모든 유향나무와 함께하는
  alternatives_korean:
  - 모든 유향나무와 함께
  - 모든 유향의 나무와 함께하는
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지인 '유향나무들'을 보존하면서, 시적 병렬이 자연스럽게 들리도록 연결했습니다.
- source_word: רָאשֵׁי בְשָׂמִים
  english_pob_choice: the finest spices
  chosen_korean: 모든 가장 좋은 향료
  alternatives_korean:
  - 가장 좋은 모든 향료
  - 최상급 향료
  lexicon: HALOT
  rationale: 직역의 '머리들/으뜸들'보다는 한국어에서 자연스러운 최상급 표현으로 옮기되, '모든'의 포괄성과 '좋은'의 평가를 유지했습니다.
theological_decisions:
- issue: 아가서 4:14의 열거시적 향료 목록을 어떻게 처리할지
  chosen_reading: 향료와 나무의 이미지를 최대한 보존하는 시적 목록으로 옮겼습니다.
  alternative_readings:
  - 향신료 목록으로 더 일반화하기
  - 향유 재료로 의역하기
  rationale: 본문은 신학적 선언보다 애가/연가의 감각적 묘사에 속하므로, 이미지의 구체성을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 문학 장르 보존 원칙
- issue: עֲצֵי לְבוֹנָה의 문자적 '유향나무들' 표현
  chosen_reading: 유향나무
  alternative_readings:
  - 유향의 나무
  - 유향수
  rationale: 히브리어의 낯선 비유를 평이한 '유향'으로만 풀지 않고, 원문이 지닌 물질적·시적 긴장을 유지했습니다.
  doctrine_reference: 원문 이미지 보존 원칙
