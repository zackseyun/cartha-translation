  text: לִבַּבְתִּ֖/נִי אֲחֹתִ֣/י כַלָּ֑ה לִבַּבְתִּ֨י/נִי֙ ב/אחד מֵ/עֵינַ֔יִ/ךְ בְּ/אַחַ֥ד עֲנָ֖ק מִ/צַּוְּרֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/009.yaml
  text: You have captured my heart[a], my sister, my bride; you have captured my heart with one glance of your eyes[c][b], with one jewel of your necklace.
  footnotes:
  - marker: a
    text: Or 'You have ravished my heart' (traditional); the Hebrew verb is rare and conveys that the beloved has powerfully moved or overwhelmed the speaker's heart.
    reason: lexical_alternative
  - marker: b
    text: Literally 'with one from your eyes.' The sense is likely 'with a single glance.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew may also be understood as 'with one chain/ornament from your neck' or 'with one of the ornaments on your neck.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 누이, 내 신부여, 당신은 내 마음을 사로잡았습니다[a]. 당신의 눈 한 번의 눈길[b]과 당신 목의 한 장식[c]으로도 내 마음을 사로잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음을 사로잡았습니다’보다 전통적으로 ‘내 마음을 빼앗았습니다’로 옮길 수 있습니다. 히브리어 동사는 희귀하며, 사랑하는 이가 화자의 마음을 강하게 움직이거나 압도한다는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신 눈들 가운데 하나로’입니다. 문맥상 뜻은 ‘한 번의 눈길로’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘당신 목의 장식 하나’ 또는 ‘당신 목에 있는 장식물 하나’로도 이해될 수 있습니다.
    reason: lexical_alternative
