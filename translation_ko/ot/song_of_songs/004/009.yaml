theological_decisions:
- issue: 상호 호칭의 직역과 애정 표현
  chosen_reading: ‘내 누이, 내 신부여’라는 직역을 유지해 서정적 친밀성과 혼인적 관계를 함께 드러냈습니다.
  alternative_readings:
  - ‘내 사랑, 내 신부여’
  - ‘내 자매여, 내 신부여’
  rationale: 본문의 호칭은 단순한 애칭보다 관계의 중첩을 드러내므로, 익숙한 순화어보다 원문 이미지가 보이도록 했습니다.
  doctrine_reference: Song of Songs의 문학적·비유적 사랑 표현
