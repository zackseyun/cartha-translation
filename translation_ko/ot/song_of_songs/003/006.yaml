  source_fidelity: 히브리어의 여성 단수 지시어 זֹאת, 상승을 나타내는 분사 עֹלָה, 연기 기둥의 비유, 그리고 몰약·유향·상인의 향료 가루라는 향기 이미지를 모두 보존해야 합니다. 현 초안은 ‘누가 저 여자가’가 비문이며, 마지막의 ‘풍겨 나오는가?’는 원문의 수동적 ‘향기롭게 된/향을 입은’ 묘사를 별도의 동작으로 바꿉니다.
