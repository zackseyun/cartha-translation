  text: מִ֣י זֹ֗את עֹלָה֙ מִן הַ/מִּדְבָּ֔ר כְּ/תִֽימֲר֖וֹת עָשָׁ֑ן מְקֻטֶּ֤רֶת מוֹר֙ וּ/לְבוֹנָ֔ה מִ/כֹּ֖ל אַבְקַ֥ת רוֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/006.yaml
  text: Who is this coming up from the wilderness like columns of smoke[a], perfumed with myrrh and frankincense[c][b], from every fragrant powder of the merchant?
  footnotes:
  - marker: a
    text: Or 'like pillars of smoke.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Who is she, coming up from the wilderness...?' The Hebrew uses a feminine demonstrative ('this [woman]').
    reason: lexical_alternative
  - marker: c
    text: '''Wilderness'' may also be rendered ''desert.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 누가 저 여자가 광야에서 연기 기둥들처럼[a] 올라오는가? 몰약과 유향으로 향기롭게 되고, 상인의 온갖 향료 가루에서[b] 풍겨 나오는가?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기둥들’은 연기의 수직적 상승 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘상인/행상인’의 ‘온갖 향료 가루’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: מִי זֹאת
  english_pob_choice: Who is this
  chosen_korean: 누가 저 여자가
  alternatives_korean:
  - 이 여자는 누구인가
  - 누가 이 여자인가
  lexicon: HALOT
  rationale: 히브리어의 의문사와 여성 지시어는 여성 인물을 가리키지만, 한국어 시적 문맥에서는 ‘누가’로 질문을 앞세우고 ‘저 여자’로 여성 지시를 분명히 하는 편이 자연스럽습니다.
- source_word: עֹלָה
  english_pob_choice: coming up
  chosen_korean: 올라오는가
  alternatives_korean:
  - 올라오는
  - 솟아오르는가
  lexicon: HALOT
  rationale: עלה의 기본 움직임을 살리되, 한국어에서 시각적으로 자연스러운 현재 진행형으로 옮겼습니다.
- source_word: כְּתִימֲרֹת עָשָׁן
  english_pob_choice: like columns of smoke
  chosen_korean: 연기 기둥들처럼
  alternatives_korean:
  - 연기 기둥처럼
  - 연기 기둥들같이
  - 연기 기둥 같은
  lexicon: HALOT
  rationale: תִימֲרוֹת의 수직적 상승 이미지를 살려 ‘기둥들’로 옮겼고, 비교 접미 ‘-처럼’으로 원문의 비유를 분명히 했습니다.
- source_word: מְקֻטֶּרֶת מוֹר וּלְבוֹנָה
  english_pob_choice: perfumed with myrrh and frankincense
  chosen_korean: 몰약과 유향으로 향기롭게 되고
  alternatives_korean:
  - 몰약과 유향으로 향을 입고
  - 몰약과 유향으로 향내가 나고
  lexicon: HALOT
  rationale: 수동 분사 מְקֻטֶּרֶת의 ‘향을 입은/향기롭게 된’ 상태를 살리면서, 현대 한국어에서 과도하게 낯설지 않게 표현했습니다.
- source_word: מִכֹּל אַבְקַת רוֹכֵל
  english_pob_choice: from every fragrant powder of the merchant
  chosen_korean: 상인의 온갖 향료 가루에서
  alternatives_korean:
  - 상인의 온갖 향신 가루에서
  - 상인의 모든 향가루에서
  - 장사의 향료 가루마다에서
  lexicon: HALOT
  rationale: אַבְקַת의 ‘가루’와 רֹכֵל의 ‘상인/행상인’ 의미를 살리고, 문맥상 향료를 가리키므로 ‘향료 가루’로 구체화했습니다.
theological_decisions:
- issue: 시적 수사에서 여성 지시의 유지
  chosen_reading: 히브리어 여성 지시어를 반영해 ‘저 여자’로 분명히 했습니다.
  alternative_readings:
  - ‘누구인가’로 성별을 드러내지 않음
  - ‘그녀’ 사용
  rationale: 원문의 여성형 표지가 대화 상대의 성별을 암시하므로, 이를 한국어에서도 흐리지 않는 것이 본문 관찰에 충실합니다.
  doctrine_reference: 문법적 성별 관찰에 따른 본문 충실성
- issue: 향료 이미지의 구체화
  chosen_reading: ‘향료 가루’로 옮겨 상인의 향수/향신료 무역을 암시하는 이미지를 살렸습니다.
  alternative_readings:
  - ‘가루’만 사용
  - ‘향기로운 분말’
  rationale: 문맥은 단순한 먼지가 아니라 향료 맥락을 가리키므로, 독자가 시적 이미지를 바로 이해하도록 최소한의 구체화를 택했습니다.
  doctrine_reference: 시적 비유의 의미 보존
