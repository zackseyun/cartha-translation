translation:
  language: ko
  text: 광야에서 연기 기둥처럼[a] 올라오며, 몰약과 유향과 상인의 온갖 향료 가루의 향기가 밴 이 여인은 누구입니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘연기 기둥들처럼’. 히브리어는 솟아오르는 연기의 기둥 또는 기둥 같은 줄기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘이 여인’은 여성형 지시어입니다. ‘상인의 온갖 향료 가루’는 문자적으로 ‘상인/행상인의 모든 가루’이며, 문맥상 향기 나는 가루를 뜻합니다.
    reason: source_note
