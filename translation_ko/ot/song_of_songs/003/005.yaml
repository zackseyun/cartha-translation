  verdict: revise
  source_fidelity: 수정이 필요합니다. הִשְׁבַּעְתִּי는 화자가 스스로 맹세한다는 뜻이 아니라 청자에게 엄숙한 맹세/서약을 요구하거나 엄숙히 명하는 표현입니다. 또한 צְבָאוֹת는 여기서 첫째 동물항인 ‘가젤들’이며, 초안처럼 두 항 모두 ‘암사슴들’로 옮길 수 없습니다. 두 개의 병렬 동사도 한 번의 금지로 모두 반영해야 합니다.
  naturalness: ‘들의 암사슴들과 들의 암사슴들로 말미암아’는 동물의 중복과 ‘말미암아’의 인과적 어감 때문에 부자연스럽습니다. 맹세 공식은 ‘…을 두고’가 자연스럽습니다. ‘사랑을 흔들어 깨우지 말고, 사랑이 원할 때까지 깨우지 마십시오’는 금지의 반복 구조가 원문과 맞지 않으므로 한 문장으로 정리했습니다.
  terminology: ‘예루살렘의 딸들’은 시적 호칭을 보존합니다. צְבָאוֹת/אַיְלוֹת는 각각 ‘가젤들/들의 암사슴들’로 구별했습니다. הָאַהֲבָה는 특정 인물로 정하지 않고 ‘사랑’으로 유지했으며, 여성 단수 동사의 문법적 호응은 각주에서 설명했습니다.
