id: SNG.3.5
reference: Song of Songs 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/005.yaml
  text: I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b], that you not stir up or awaken love until it desires.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'until it pleases.' The Hebrew literally has a feminine singular verb, agreeing with 'love'; some take the line more personally as 'until she pleases' or 'until he pleases.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew likely refers literally to gazelles and does of the field; the wording may also echo 'hosts,' creating a poetic wordplay in the oath formula.
    reason: cultural_note
translation:
  language: ko
  text: 예루살렘의 딸들아, 가젤들과 들의 암사슴들을 두고 내가 너희에게 엄숙히 명합니다. 사랑이 원할 때까지 사랑을 깨우거나 일으키지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 동사는 여성 단수형으로, 문법상 앞의 ‘사랑’에 호응합니다. 전통적으로는 ‘사랑이 기뻐할 때까지’로 옮기기도 하며, 이를 의인화된 인물로 이해하는 견해도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘가젤들’과 ‘들의 암사슴들’을 가리킵니다. ‘가젤들’에 해당하는 말은 ‘만군’이라는 말과 소리가 같아, 맹세 공식에서 시적인 말놀이를 이룰 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  english_pob_choice: I adjure you
  chosen_korean: 내가 너희에게 맹세합니다
  alternatives_korean:
  - 내가 너희에게 맹세하게 합니다
  - 내가 너희에게 엄숙히 명합니다
  lexicon: HALOT
  rationale: 히필형 שׁבע의 맹세·엄숙한 경고의 힘을 살리되, 한국어에서는 합쇼체의 자연스러운 서술로 옮겼습니다.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  english_pob_choice: daughters of Jerusalem
  chosen_korean: 예루살렘 딸들
  alternatives_korean:
  - 예루살렘의 젊은 여자들
  - 예루살렘의 여자들
  lexicon: HALOT
  rationale: 시적 호칭과 공동체적 뉘앙스를 보존하기 위해 직역에 가깝게 유지했습니다.
- source_word: בִּצְבָאוֹת אֹו בְּאַיְלוֹת הַשָּׂדֶה
  english_pob_choice: by the gazelles or by the does of the field
  chosen_korean: 들의 암사슴들과 들의 암사슴들로 말미암아
  alternatives_korean:
  - 가젤들과 들사슴들로 말미암아
  - 들의 가젤들과 들의 암사슴들로 말미암아
  lexicon: HALOT
  rationale: 문맥상 맹세 공식에 쓰인 동물 표지를 살렸고, 현대 한국어에서 자연스러운 '암사슴들'을 택했습니다. 반복된 동물 병렬은 히브리어의 시적 긴장을 반영합니다.
- source_word: תָּעִירוּ וְתְּעוֹרְרוּ
  english_pob_choice: do not stir up or awaken
  chosen_korean: 사랑을 흔들어 깨우지 말고
  alternatives_korean:
  - 사랑을 자극하지 말고 일깨우지 말고
  - 사랑을 일으키지 말고 깨우지 말고
  lexicon: HALOT
  rationale: 두 동사의 중첩된 동작을 한국어의 동사 연쇄로 살려, 과도한 해설 없이 금지의 힘을 전달했습니다.
- source_word: עַד שֶׁתֶּחְפָּץ
  english_pob_choice: until it desires
  chosen_korean: 사랑이 원할 때까지
  alternatives_korean:
  - 사랑이 기뻐할 때까지
  - 사랑이 원할 때까지 그러하십시오
  lexicon: HALOT
  rationale: 여성형 동사가 앞의 '사랑'에 호응하는 점을 유지하면서도, 한국어에서는 비인칭적으로 '원하다'로 옮겨 시적 모호성을 보존했습니다.
theological_decisions:
- issue: ‘사랑’의 의인화와 성별 지시
  chosen_reading: 마지막 절에서 사랑을 주어로 유지하되, 그 의지를 남성·여성 인물로 특정하지 않았습니다.
  alternative_readings:
  - 그가 원할 때까지
  - 그녀가 원할 때까지
  rationale: 히브리어의 여성형 동사와 사랑이라는 명사를 그대로 살리면, 본문은 특정 인물 식별보다 사랑의 시적 자율성을 남깁니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
