  text: כִּ/מְעַט֙ שֶׁ/עָבַ֣רְתִּי מֵ/הֶ֔ם עַ֣ד שֶֽׁ/מָּצָ֔אתִי אֵ֥ת שֶׁ/אָהֲבָ֖ה נַפְשִׁ֑/י אֲחַזְתִּי/ו֙ וְ/לֹ֣א אַרְפֶּ֔/נּוּ עַד שֶׁ֤/הֲבֵיאתִי/ו֙ אֶל בֵּ֣ית אִמִּ֔/י וְ/אֶל חֶ֖דֶר הוֹרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/004.yaml
  text: I had scarcely passed by them when I found the one my soul loves[a]. I held on to him and would not let him go until I had brought him into my mother's house[b], into the chamber of the one who conceived me.
  footnotes:
  - marker: a
    text: Or, more formally, 'him whom my soul loves.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the chamber of the one who conceived me,' a poetic parallel to 'my mother's house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 거의 그들 곁을 지나쳤을 때, 내 영이 사랑하는 그를 발견하였습니다[a]. 나는 그를 붙잡고 놓아주지 않았습니다. 내가 그를 내 어머니의 집[b], 곧 나를 잉태한 이의 침실로 데려갈 때까지는 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘내 영이 사랑하는 그를’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘나를 잉태한 이의 침실’이라고 하며, 앞의 ‘내 어머니의 집’과 시적으로 평행을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  english_pob_choice: I had scarcely
  chosen_korean: 거의
  alternatives_korean:
  - 간신히
  - 하마터면
  lexicon: HALOT
  rationale: ‘כִּמְעַט’의 ‘거의/막’이라는 근접·간발의 차를 한국어에서 가장 자연스럽게 드러내는 말로 ‘거의’를 택했습니다.
- source_word: שֶׁעָבַרְתִּי מֵהֶם
  english_pob_choice: passed by them
  chosen_korean: 그들 곁을 지나쳤을 때
  alternatives_korean:
  - 그들로부터 지나갔을 때
  - 그들을 지나서 갔을 때
  lexicon: HALOT
  rationale: 문맥상 파수꾼들 곁을 지나 이동하는 장면이므로, ‘곁을 지나쳤을 때’가 영어 POB의 이동감과 히브리어 מן의 방향성을 자연스럽게 반영합니다.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  english_pob_choice: the one my soul loves
  chosen_korean: 내 영이 사랑하는 그
  alternatives_korean:
  - 내 영혼이 사랑하는 그
  - 내 혼이 사랑하는 그
  lexicon: HALOT
  rationale: ‘נֶפֶשׁ’의 내적 자아를 살리되, 한국어에서는 고전적 ‘영혼’보다 본문의 정서적 친밀감을 유지하는 ‘영’이 더 직접적이어서 선택했습니다.
- source_word: אֲחַזְתִּיו וְלֹא אַרְפֶּנּוּ
  english_pob_choice: I held on to him and would not let him go
  chosen_korean: 나는 그를 붙잡고 놓아주지 않았습니다
  alternatives_korean:
  - 나는 그를 붙들고 놓지 않았습니다
  - 나는 그를 잡고 놓아주지 않았습니다
  lexicon: HALOT
  rationale: אחז와 רפה의 대조를 살리면서도, 연인의 긴박한 애착을 폭력적으로 오해하지 않도록 ‘붙잡고/놓아주지 않았습니다’로 옮겼습니다.
- source_word: בֵּית אִמִּי ... חֶדֶר הוֹרָתִי
  english_pob_choice: my mother's house ... the chamber of the one who conceived me
  chosen_korean: 내 어머니의 집[b], 곧 나를 잉태한 이의 침실
  alternatives_korean:
  - 내 어머니의 집[b], 곧 나를 낳은 이의 방
  - 내 어머니의 집[b], 곧 나를 잉태한 이의 방
  lexicon: HALOT
  rationale: 두 표현은 병렬적 시적 반복이므로, POB의 해설처럼 후자를 앞절의 동의적 평행으로 풀어 ‘침실’까지 포함해 공간적 이미지를 살렸습니다.
theological_decisions:
- issue: ‘נַפְשִׁי’의 인칭적 중심을 한국어로 어떻게 드러낼지
  chosen_reading: ‘내 영이 사랑하는’으로 옮겨, 사랑의 대상에 대한 전인적 내적 열망을 표현했습니다.
  alternative_readings:
  - 내 영혼이 사랑하는
  - 내 존재가 사랑하는
  rationale: 이 구절은 신학적 용어 논쟁보다 시적 자아의 깊이를 드러내는 것이 중요하므로, 한국어에서 가장 자연스럽게 내적 갈망을 전달하는 표현을 택했습니다.
  doctrine_reference: 시가서의 인간 사랑 언어와 נפש의 시적 용례
- issue: 시적 친밀감과 문맥상 동사 강도
  chosen_reading: ‘붙잡고 놓아주지 않았습니다’로 다소 강한 지속성을 유지했습니다.
  alternative_readings:
  - 붙들고 놓지 않았습니다
  - 잡고 놓지 않았습니다
  rationale: 연인의 추격과 발견 직후의 절박한 정서를 약화시키지 않기 위해, 원문의 강한 지속 동작을 유지했습니다.
  doctrine_reference: 시가서의 결혼/사랑 시학
