  source_fidelity: 원문의 시간적 표현 כִּמְעַט은 ‘거의’보다 ‘막/채’와 결합할 때, 파수꾼들을 지나자마자 찾았다는 근접성을 한국어에서 더 정확하고 자연스럽게 전달합니다. נַפְשִׁי는 여기서 신학적 의미의 ‘영’보다 시적·인격적 내면을 가리키므로 ‘내 마음’이 적절합니다. חֶדֶר는 ‘침실’로 한정되지 않는 ‘방/방실’입니다.
  naturalness: 초안의 ‘나는 거의 그들 곁을 지나쳤을 때’는 현대 한국어에서 어색하며, 마지막의 ‘그러했습니다’는 앞선 부정의 지속 범위를 우회적으로 처리합니다. 시간절을 ‘놓아주지 않았습니다’에 직접 연결하면 자연스럽고 원문의 구문도 더 잘 보존됩니다.
  terminology: ‘내 마음이 사랑하는 이’는 아가의 반복되는 시적 표현으로 자연스럽고, 원문의 נֶפֶשׁ를 ‘영’으로 신학화하지 않습니다. ‘나를 잉태한 이의 방’은 어머니의 집과 이루는 시적 병행을 보존하면서 חדר의 의미를 과도하게 구체화하지 않습니다.
