  text: 그들 모두는 칼을 쥐고 전투에 훈련된 사람들입니다. 각 사람은 밤에 닥치는 공포 때문에 자기 칼을 넓적다리에 차고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
