  text: 그들 모두가 칼을 잡고 있으며, 전투에 익숙한 자들입니다. 각 사람은 밤의 공포 때문에 자기 허리에 칼을 차고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘밤들 안에서’라는 복수 표현을 사용하며, 밤의 위험이 반복적으로 닥치는 느낌을 강조할 수 있습니다.
    reason: source_note
