  source_fidelity: 원문의 ‘허벅지 위에/곁에’(עַל־יְרֵכוֹ)를 초안의 ‘허리’로 옮긴 것은 신체 부위와 무기 착용 위치를 넓게 바꾸므로 바로잡는 것이 안전합니다. 또한 מְלֻמְּדֵי מִלְחָמָה는 단순히 ‘전투에 익숙한’ 사람이라기보다 ‘전쟁/전투에 훈련된’ 사람을 뜻합니다. 밤의 복수형과 그에 따른 위험의 뉘앙스는 본문과 각주로 보존할 수 있습니다.
  naturalness: ‘그들 모두는’, ‘칼을 쥐고’, ‘전투에 훈련된 사람들입니다’는 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. ‘칼을 넓적다리에 차고 있다’는 다소 낯선 이미지이나 원문의 구체적 무장 묘사를 보존하는 데 적절합니다.
  terminology: חֶרֶב는 ‘칼’, מִלְחָמָה는 ‘전투’, פַּחַד는 ‘공포’로 일관되게 옮겼습니다. אִישׁ의 분배적 용법은 ‘각 사람’으로 보존했으며, חַרְבּוֹ의 소유 표현도 ‘자기 칼’로 명시했습니다.
