language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָק֨וּמָה נָּ֜א וַ/אֲסוֹבְבָ֣ה בָ/עִ֗יר בַּ/שְּׁוָקִים֙ וּ/בָ֣/רְחֹב֔וֹת אֲבַקְשָׁ֕ה אֵ֥ת שֶׁ/אָהֲבָ֖ה נַפְשִׁ֑/י בִּקַּשְׁתִּ֖י/ו וְ/לֹ֥א מְצָאתִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/002.yaml
  text: I will rise now and go about the city[a], in the marketplaces and in the streets; I will seek the one my soul loves. I sought him, but I did not find him.
  footnotes:
  - marker: a
    text: Or, more formally, 'him whom my soul loves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 일어나 도시를 두루 돌아다니고, 시장들과 거리들에서 내 영혼이 사랑하는 이를 찾겠습니다. 내가 그를 찾았으나 찾지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָק֨וּמָה נָּ֜א
  english_pob_choice: I will rise now
  chosen_korean: 이제 일어나
  alternatives_korean:
  - 지금 일어나겠습니다
  - 이제 일어나겠습니다
  lexicon: HALOT
  rationale: 1인칭 의지·결심을 나타내는 cohortative를 한국어의 자연스러운 결의 표현으로 옮기되, 문맥상 즉각성을 드러내는 ‘이제’를 살렸습니다.
- source_word: וַאֲסוֹבְבָה בָעִיר
  english_pob_choice: and go about the city
  chosen_korean: 성읍을 두루 돌아다니며
  alternatives_korean:
  - 도시를 돌아다니며
  - 성읍을 돌아다니며
  lexicon: HALOT
  rationale: סבב의 ‘둘러 돌다/두루 다니다’는 움직임을 살려, 단순한 이동보다 탐색적 순회를 드러내는 표현으로 옮겼습니다.
- source_word: בַּשְּׁוָקִים וּבָרְחֹבוֹת
  english_pob_choice: in the marketplaces and in the streets
  chosen_korean: 시장들과 거리들에서
  alternatives_korean:
  - 장터들과 거리들에서
  - 시장과 거리에서
  lexicon: HALOT
  rationale: שׁוּק과 רְחוֹב의 공적 공간 이미지를 유지하되, 복수형을 반영해 장소의 넓고 분산된 탐색 분위기를 살렸습니다.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  english_pob_choice: the one my soul loves
  chosen_korean: 내가 사랑하는 이를
  alternatives_korean:
  - 내 영혼이 사랑하는 이를
  - 내가 혼으로 사랑하는 이를
  lexicon: HALOT
  rationale: 히브리어의 ‘영혼(soul)’ 관용구를 직역하면 한국어에서 다소 부자연스러워질 수 있어, 시적 의미를 살리면서도 본문이 말하는 사랑의 대상을 분명히 하는 표현을 택했습니다.
- source_word: וְלֹא מְצָאתִיו
  english_pob_choice: but I did not find him
  chosen_korean: 그를 만나지 못했습니다
  alternatives_korean:
  - 그를 찾지 못했습니다
  - 그를 발견하지 못했습니다
  lexicon: HALOT
  rationale: מָצָא의 ‘찾다/만나다’ 범위를 고려해, 앞의 탐색 맥락을 자연스럽게 마무리하는 ‘만나지 못했습니다’를 사용했습니다.
theological_decisions:
- issue: ‘soul’(נֶפֶשׁ) 관용구를 한국어에서 어떻게 보존할지
  chosen_reading: 문자적으로는 ‘내가 사랑하는 이를’로 옮기고, 사랑의 대상에 대한 시적 긴장을 유지했습니다.
  alternative_readings:
  - ‘내 영혼이 사랑하는 이’
  - ‘내 혼이 사랑하는 이’
  rationale: 한국어에서 ‘영혼’ 직역은 의미는 보존하지만 어색할 수 있어, 시적 핵심인 연모의 대상성을 우선 살리되 과도한 해석은 피했습니다.
  doctrine_reference: 시적/문학적 관용구 처리
- issue: 마지막 절의 ‘찾다/만나다’ 뉘앙스
  chosen_reading: 앞에서 ‘찾다’를 사용하고, 결말은 ‘만나지 못했습니다’로 자연스럽게 마무리했습니다.
  alternative_readings:
  - ‘찾지 못했습니다’
  - ‘발견하지 못했습니다’
  rationale: 히브리어 מָצָא의 기본 뜻은 ‘찾다/발견하다’이지만, 한국어 시적 흐름에서는 실제로 ‘그를 만나지 못했다’는 체험적 의미가 더 잘 전달됩니다.
  doctrine_reference: 문학적 서술의 등가성
