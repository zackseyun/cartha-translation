  terminology: ‘내 영혼이 사랑하는 이’를 사용하여 히브리어의 시적 관용구를 보존합니다. 교리적 의미를 부가하지 않습니다. 기존 각주 표지는 ‘도시’ 뒤에 있으나 내용은 사랑하는 이에 관한 것이어서 앵커가 일치하지 않습니다.
