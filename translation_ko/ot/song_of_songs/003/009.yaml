    reason: lexical_alternative
lexical_decisions:
- source_word: אַפִּרְיוֹן
  english_pob_choice: palanquin
  chosen_korean: 가마
  alternatives_korean:
  - 팔랑킨
  - 들것
  - 의자 가마
  lexicon: HALOT
  rationale: 희귀한 왕실 이동 수단을 가리키는 점을 살리면서도, 현대 한국어에서 가장 자연스럽게 이해되는 전통적 휴대용 탈것 표현으로 옮겼습니다.
- source_word: עָשָׂה
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  - 지어 마련했습니다
  lexicon: HALOT
  rationale: 일반적인 ‘만들다’의 의미를 그대로 살리면서, 문맥상 사치스러운 탈것을 ‘제작하다’보다 덜 기술적으로, 더 자연스럽게 표현했습니다.
- source_word: לּוֹ
  english_pob_choice: for himself
  chosen_korean: 자신을 위해
  alternatives_korean:
  - 그를 위해
  - 자기 자신을 위해
  lexicon: HALOT
  rationale: 솔로몬의 개인적 사용과 소유를 분명히 드러내는 반사적 의미를 한국어 관용에 맞게 반영했습니다.
- source_word: מֵעֲצֵי הַּלְּבָנוֹן
  english_pob_choice: from the trees of Lebanon
  chosen_korean: 레바논의 나무들로
  alternatives_korean:
  - 레바논의 목재로
  - 레바논의 삼림으로부터
  lexicon: HALOT
  rationale: ‘from the trees of’의 직역성을 유지하되, 재료 출처를 자연스럽게 나타내기 위해 조사 ‘-로’로 처리했습니다.
theological_decisions:
- issue: אַפִּרְיוֹן의 정확한 물건명
  chosen_reading: ‘가마’로 옮기되, 특정 형태를 과도하게 단정하지 않았습니다.
  alternative_readings:
  - 팔랑킨
  - 의자 가마
  - 수레
  rationale: 히브리어가 드문 차용어라 정확한 형상을 단정할 수 없으므로, 원문이 보증하는 ‘호화로운 왕실 운반구’라는 핵심 의미만 보존했습니다.
  doctrine_reference: lexical_humility
