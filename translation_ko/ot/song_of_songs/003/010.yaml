  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'its base/support of gold'; the Hebrew term rendered 'backrest' is rare and uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'its carriage of purple'; the Hebrew term may refer more broadly to the riding place or carriage structure.
    reason: lexical_alternative
  - marker: c
    text: Or 'its interior was paved with love.' The Hebrew expression is unusual; the text likely portrays lavish adornment in poetic language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 기둥들을 은으로, 그 등받이를 금으로[a], 그 자리를 자주색 천으로[b] 만들었습니다. 그 안쪽은 예루살렘의 딸들이 사랑으로 꾸며 놓았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 바닥/받침을 금으로’; ‘등받이’로 옮긴 히브리어는 드물고 뜻이 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 가마를 자주색 천으로’; 이 히브리어는 더 넓게는 타는 자리나 가마의 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 안쪽은 사랑으로 포석되어 있었습니다.’ 이 표현은 매우 이례적이며, 시적으로 호화로운 장식을 묘사하는 것으로 보입니다.
    reason: lexical_alternative
