source:
  edition: WLC
  text: עַמּוּדָי/ו֙ עָ֣שָׂה כֶ֔סֶף רְפִידָת֣/וֹ זָהָ֔ב מֶרְכָּב֖/וֹ אַרְגָּמָ֑ן תּוֹכ/וֹ֙ רָצ֣וּף אַהֲבָ֔ה מִ/בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'its base/support of gold'; the Hebrew term rendered 'backrest' is rare and uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'its carriage of purple'; the Hebrew term may refer more broadly to the riding place or carriage structure.
    reason: lexical_alternative
  - marker: c
    text: Or 'its interior was paved with love.' The Hebrew expression is unusual; the text likely portrays lavish adornment in poetic language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 기둥들을 은으로, 그 등받이를 금으로, 그 자리를 자주색으로 만들었습니다[a][b][c]. 그 안쪽은 예루살렘의 딸들이 사랑으로 입혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 바닥/받침을 금으로’; ‘등받이’로 옮긴 히브리어는 드물고 뜻이 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 가마를 자주색으로’; 이 히브리어는 더 넓게는 타는 자리나 가마의 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 안쪽은 사랑으로 포석되어 있었습니다.’ 이 표현은 매우 이례적이며, 시적으로 호화로운 장식을 묘사하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  english_pob_choice: its pillars
  chosen_korean: 그 기둥들을
  alternatives_korean:
  - 그 둥근기둥들을
  - 그 주기둥들을
  - 그 받침기둥들을
  lexicon: HALOT
  rationale: 왕실 가마의 구조를 가리키는 말로서 ‘기둥들’이 가장 सीधे하고 자연스러우며, 영어 POB의 ‘pillars’와도 대응됩니다.
- source_word: רְפִידָתוֹ
  english_pob_choice: its back
  chosen_korean: 그 등받이를
  alternatives_korean:
  - 그 받침을
  - 그 지지대를
  - 그 등을
  lexicon: HALOT
  rationale: 희귀어로 뜻이 확정적이지 않으므로, POB가 보존한 구조적 의미를 따라 가마/의자형 가구의 일부인 ‘등받이’로 옮겨 추정성과 구체성을 함께 살렸습니다.
- source_word: מֶרְכָּבוֹ
  english_pob_choice: its seat
  chosen_korean: 그 자리
  alternatives_korean:
  - 그 좌석
  - 그 가마
  - 그 타는 곳
  lexicon: HALOT
  rationale: 이 문맥에서는 전차 일반보다 ‘앉거나 타는 자리’가 자연스러워, 현대 한국어에서 이해하기 쉬운 ‘자리’를 택했습니다.
- source_word: רָצוּף אַהֲבָה
  english_pob_choice: was inlaid with love
  chosen_korean: 사랑으로 입혔습니다
  alternatives_korean:
  - 사랑으로 깔았습니다
  - 사랑으로 포장했습니다
  - 사랑으로 포석했습니다
  lexicon: HALOT
  rationale: 원어의 특이한 표현을 매끈하게 풀기보다, 장식·덧댐의 이미지를 살릴 수 있는 ‘입히다’를 사용해 영어 POB의 ‘inlaid’와 비슷한 효과를 냈습니다.
- source_word: מִבְּנוֹת יְרוּשָׁלִָם
  english_pob_choice: by the daughters of Jerusalem
  chosen_korean: 예루살렘의 딸들이
  alternatives_korean:
  - 예루살렘의 딸들에 의해
  - 예루살렘의 딸들로
  - 예루살렘의 딸들로부터
  lexicon: HALOT
  rationale: 전치사의 용법상 행위 주체로 읽는 것이 가장 자연스러워, 시의 반복 화자 집단을 드러내는 ‘예루살렘의 딸들’로 옮겼습니다.
