  - 내 침대에서
  lexicon: HALOT
  rationale: מִשְׁכָּב은 눕는 자리/침상을 가리키므로, 공간 관계를 자연스럽게 살린 「내 침상에서」로 옮겼습니다.
- source_word: בַּלֵּילוֹת
