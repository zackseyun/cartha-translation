translation:
  language: ko
  text: 내 침상에서, 밤들에 나는 내 마음이 사랑하는 이를 찾았습니다. 나는 그를 찾았으나, 그를 발견하지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 「밤」이 아니라 복수형 「밤들」입니다. 이는 반복된 밤의 탐색을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁכָּבִי
  english_pob_choice: On my bed
  chosen_korean: 내 침상에서
  alternatives_korean:
