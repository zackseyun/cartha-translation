  lexicon: HALOT
  rationale: נֶפֶשׁ의 정서적·인격적 의미를 한국어에서 가장 자연스럽게 드러내기 위해, 직역적이면서도 문학적인 「내 마음이 사랑하는 이」를 택했습니다.
- source_word: בִּקַּשְׁתִּיו ... וְלֹא מְצָאתִיו
  english_pob_choice: I sought him ... but I did not find him
  chosen_korean: 나는 그를 찾았으나, 그를 발견하지 못했습니다
  alternatives_korean:
  - 나는 그를 찾았지만, 그를 찾지 못했습니다
  - 나는 그를 구했으나, 그를 발견하지 못했습니다
  lexicon: HALOT
  rationale: בקשׁ과 מצא의 대조를 살리되 한국어에서 중복을 줄여, 첫 절은 「찾았습니다」, 결과는 「발견하지 못했습니다」로 대응시켰습니다.
theological_decisions:
- issue: 화자의 사랑 표현과 「영혼/마음」 번역
  chosen_reading: נֶפֶשׁ을 여기서는 인격의 중심과 정서를 드러내는 「마음」으로 번역했습니다.
  alternative_readings:
  - 직역하여 「영혼」으로 옮김
  - 「생명」으로 옮김
  rationale: 아가의 사랑시적 문맥에서는 נֶפֶשׁ이 교리적 용어보다 내적 자아를 가리키므로, 현대 독자가 즉시 이해할 수 있는 「마음」이 본문 의미를 더 잘 전달합니다.
  doctrine_reference: 시가서의 시적 인체-영혼 표현
