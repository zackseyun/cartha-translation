  text: Look[a], it is Solomon’s couch; sixty mighty men are around it, from the mighty men of Israel.
  footnotes:
  - marker: a
    text: Or 'bed'; the Hebrew term can denote a bed or couch, and some understand it here as a portable royal litter or palanquin in light of the surrounding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그것은 솔로몬의 침상입니다. 용사 육십 명이 그것 주위에 둘러서 있는데, 이들은 이스라엘의 용사들 가운데서 나온 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침상’은 이 단어의 가능한 뜻 가운데 하나이며, 문맥상 왕의 이동용 가마나 들것 같은 의미로 이해하는 해석도 있습니다.
    reason: lexical_alternative
