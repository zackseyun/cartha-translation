    text: ‘침상’에 해당하는 히브리어는 침대나 기대어 쉬는 자리를 뜻할 수 있으며, 주변 문맥에 비추어 왕의 이동용 가마를 가리킨다고 이해하는 이들도 있습니다.
    reason: lexical_alternative
