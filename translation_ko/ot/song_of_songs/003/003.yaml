    reason: lexical_alternative
translation:
  language: ko
  text: 성문을 돌아다니는 파수꾼들이 나를 만나고 말했습니다. “내 마음이 사랑하는 이를 보셨습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성읍을 순찰하는 파수꾼들이 나를 만나고 말했습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “내 마음이 사랑하는 이”라는 시적 관용구를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  english_pob_choice: the watchmen
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 경비병들
  - 감시자들
  lexicon: HALOT
  rationale: שמר의 수동적 직역보다, 밤에 성읍을 지키는 사람을 가리키는 문맥에 맞게 ‘파수꾼들’이 자연스럽고 시적입니다.
- source_word: הַסֹּבְבִים בָּעִיר
  english_pob_choice: who go about the city
  chosen_korean: 성문을 돌아다니는
  alternatives_korean:
  - 성읍을 순찰하는
  - 도시를 돌아다니는
  lexicon: HALOT
  rationale: סבב의 지속적 동작을 한국어로 살리되, 현대 한국어에서 ‘순찰하다’보다 덜 현대적 제도감을 주는 ‘돌아다니는’으로 옮겼습니다.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  english_pob_choice: the one whom my soul loves
  chosen_korean: 내 마음이 사랑하는 이를
  alternatives_korean:
  - 내 영혼이 사랑하는 이를
  - 내가 사랑하는 이를
  lexicon: HALOT
  rationale: 히브리어의 시적 관용구를 그대로 ‘영혼’으로 굳히기보다, 한국어에서 자연스럽고 정서적 뉘앙스를 살리는 ‘내 마음’으로 옮겼습니다. 다만 원문의 사랑의 대상이 특정 인물임을 보이기 위해 ‘이를’을 유지했습니다.
- source_word: רְאִיתֶם
  english_pob_choice: Have you seen
  chosen_korean: 보셨습니까
  alternatives_korean:
  - 보았습니까
  - 보셨나요
  lexicon: HALOT
  rationale: 복수 남성에게 던지는 직접 질문을 격식 있는 합쇼체 의문문으로 옮겨, 장면의 긴박감과 대화체를 유지했습니다.
