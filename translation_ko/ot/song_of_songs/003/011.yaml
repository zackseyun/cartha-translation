id: SNG.3.11
reference: Song of Songs 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צְאֶ֧ינָה וּֽ/רְאֶ֛ינָה בְּנ֥וֹת צִיּ֖וֹן בַּ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה בָּ/עֲטָרָ֗ה שֶׁ/עִטְּרָה לּ֤/וֹ אִמּ/וֹ֙ בְּ/י֣וֹם חֲתֻנָּת֔/וֹ וּ/בְ/י֖וֹם שִׂמְחַ֥ת לִבּֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/011.yaml
  text: Go out and look[a], O daughters of Zion, at King Solomon, with the crown with which his mother crowned him on the day of his wedding, on the day of the joy of his heart.
  footnotes:
  - marker: a
    text: Or 'with the wreath/garland'; the Hebrew עֲטָרָה can denote a festive crown or wreath, fitting a wedding setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 시온의 딸들아, 나가서 보십시오. 솔로몬 왕을 — 그의 어머니가 그에게 씌운 관을 쓰고, 그의 결혼하던 날, 그의 마음이 기뻐하던 날의 그 관을.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘화관/관’일 수 있습니다. 히브리어 עֲטָרָה는 예식용 관이나 화관을 가리킬 수 있으며, 결혼식 문맥에 잘 어울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאֶינָה
  english_pob_choice: Go out
  chosen_korean: 나가서 보십시오
  alternatives_korean:
  - 나가 보십시오
  - 나가십시오
  lexicon: HALOT
  rationale: 여성 복수 명령의 직접 부름을 살리면서, 시적 권유로서의 자연스러운 현대 한국어 표현을 택했습니다.
- source_word: וּרְאֶינָה
  english_pob_choice: and look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보아라
  - 살펴보십시오
  lexicon: HALOT
  rationale: 뒤따르는 명령을 단순히 ‘보다’로 옮겨, 시온의 딸들에게 솔로몬을 직접 바라보라고 촉구하는 뉘앙스를 유지했습니다.
- source_word: בְּנוֹת צִיּוֹן
  english_pob_choice: O daughters of Zion
  chosen_korean: 시온의 딸들아
  alternatives_korean:
  - 오 시온의 딸들아
  - 시온의 딸들이여
  lexicon: HALOT
  rationale: 호격을 한국어 시적 호칭으로 자연스럽게 드러내되, 지나치게 고어적인 표현은 피했습니다.
- source_word: עֲטָרָה
  english_pob_choice: crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 화관
  - 월계관
  lexicon: HALOT
  rationale: 문맥상 예식용 장식물을 포괄하는 말이지만, 본문의 왕권적·예식적 이미지를 함께 살릴 수 있는 중립적 표준어로 ‘관’을 택했습니다.
- source_word: שֶׁעִטְּרָה לּוֹ אִמּוֹ
  english_pob_choice: with which his mother crowned him
  chosen_korean: 그의 어머니가 그에게 씌운
  alternatives_korean:
  - 그의 어머니가 그를 관 씌운
  - 그의 어머니가 그에게 씌워 준
  lexicon: HALOT
  rationale: עטר 동사의 ‘씌우다/관 씌우다’ 의미를 살려, 왕에게 관을 얹는 동작을 한국어로 자연스럽게 표현했습니다.
- source_word: בְּיוֹם חֲתֻנָּתוֹ
  english_pob_choice: on the day of his wedding
  chosen_korean: 그의 결혼하던 날
  alternatives_korean:
  - 그의 혼인하던 날
  - 그의 결혼식 날
  lexicon: HALOT
  rationale: חֲתֻנָּה를 예식 사건으로 읽되, ‘결혼하던 날’로 옮겨 서정성과 시간 표현을 유지했습니다.
- source_word: וּבְיוֹם שִׂמְחַת לִבּוֹ
  english_pob_choice: on the day of the joy of his heart
  chosen_korean: 그의 마음이 기뻐하던 날
  alternatives_korean:
  - 그의 마음의 기쁨의 날
  - 그의 마음이 즐거워하던 날
  lexicon: HALOT
  rationale: 히브리어의 직역형 구조를 그대로 밀어붙이기보다, ‘마음의 기쁨’이라는 의미를 자연스러운 한국어로 풀어 시적 평행을 살렸습니다.
theological_decisions:
- issue: 예식적 장식물인 עֲטָרָה를 어떻게 표기할지
  chosen_reading: 본문에는 ‘관’으로 두고, 예식적·왕적 이미지를 함께 읽을 수 있게 했습니다.
  alternative_readings:
  - 화관
  - 왕관
  rationale: 문맥이 결혼식 장면이지만 솔로몬의 왕적 정체성도 분명하므로, 특정한 장식 형태로 과도하게 좁히지 않는 표현이 가장 안전합니다.
  doctrine_reference: 성경 시가의 상징 언어를 문맥 안에서 보존하는 원칙
