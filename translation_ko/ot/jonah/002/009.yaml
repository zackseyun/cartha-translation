  text: מְשַׁמְּרִ֖ים הַבְלֵי שָׁ֑וְא חַסְדָּ֖/ם יַעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/009.yaml
  text: Those who cling to worthless idols forsake their own mercy[a].
  footnotes:
  - marker: a
    text: Or 'Those who keep vain idols forsake their own steadfast love,' possibly meaning that they forfeit the mercy available to them from God.
    reason: alternative_reading
translation:
  language: ko
  text: 헛된 우상에 매달리는 자들은 자기들의 신실한 사랑을 버립니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헛된 우상을 지키는 자들은 자기들의 인애를 버립니다.’ 여기서 히브리어 ‘헤세드’는 ‘인애’, ‘신실한 사랑’, 또는 하나님에게서 받을 수 있는 ‘자비’를 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁמְּרִים
  english_pob_choice: cling to
  chosen_korean: 매달리는
  alternatives_korean:
  - 붙드는
  - 지키는
  - 유지하는
  - 따르는
  lexicon: HALOT
  rationale: מְשַׁמְּרִים는 문자 그대로 ‘지키는/보호하는’ 뜻이 있지만, הַבְלֵי שָׁוְא와 함께 쓰일 때는 우상에 대한 지속적 집착을 가리키므로 ‘매달리는’이 행위의 성격을 가장 자연스럽게 드러냅니다.
- source_word: הַבְלֵי שָׁוְא
  english_pob_choice: worthless idols
  chosen_korean: 헛된 우상
  alternatives_korean:
  - 헛된 것들
  - 헛됨의 우상
  - 가치 없는 우상들
  - 허무한 우상들
  lexicon: HALOT
  rationale: הבל과 שוא의 결합은 공허함과 헛됨, 속됨을 함께 나타내며 문맥상 우상을 가리키므로, 한국어에서는 의미를 바로 드러내는 ‘헛된 우상’이 적절합니다.
- source_word: חַסְדָּם
  english_pob_choice: their own covenant loyalty
  chosen_korean: 자기들의 covenant loyalty
  alternatives_korean:
  - 자기들의 인애
  - 자기들의 자비
  - 자기들의 신실한 사랑
  - 자기들의 언약적 충성
  lexicon: HALOT
  rationale: חסד는 인애, 자비, 언약적 사랑 등 폭이 넓어 단일어로 쉽게 고정하기 어렵습니다. 본문은 그 다의성을 보존해야 하므로, 영어 POB의 해석을 따라 ‘covenant loyalty’를 그대로 유지하되, 한국어 독자가 곧바로 의미를 추적할 수 있도록 주석으로 대안을 제시합니다.
- source_word: יַעֲזֹבוּ
  english_pob_choice: forsake
  chosen_korean: 버립니다
  alternatives_korean:
  - 떠납니다
  - 저버립니다
  - 포기합니다
  lexicon: HALOT
  rationale: עזב는 ‘버리다/떠나다/저버리다’의 의미를 가지며, 예언서의 엄중한 경고 어조에는 ‘버립니다’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: חַסְדָּם의 의미를 한국어 본문에서 어떻게 보존할 것인가
  chosen_reading: 본문은 ‘자기들의 covenant loyalty’를 유지해, 우상에 매달리는 자들이 마땅히 지녀야 할 언약적 충실함을 버린다는 뜻을 드러냅니다.
  alternative_readings:
  - ‘자기들의 인애’를 버린다
  - ‘하나님께서 주시는 자비’를 잃는다
  - ‘그들의 신실한 사랑’을 버린다
  rationale: 히브리어 חסד은 관계적·언약적 의미와 자비의 의미를 함께 가질 수 있으므로, 한쪽으로 단정하지 않고 긴장을 보존하는 것이 본문의 해석 범위를 가장 잘 살립니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
