  source_fidelity: 원문의 순서와 핵심 어휘는 대체로 충실합니다. יְהוָה는 ‘야훼’로, דג는 ‘그 물고기’로, קיא는 의미를 약화하지 않는 ‘토해 내다’로 적절히 옮겼습니다. אֶל הַיַּבָּשָׁה의 이동·도달 의미는 ‘마른 땅에’로 자연스럽게 표현할 수 있습니다.
  naturalness: ‘그것은’은 앞의 동물인 물고기를 받는 표현으로 문법상 가능하지만, 이 짧은 서사에서는 ‘그 물고기는’이라고 반복하는 편이 더 자연스럽고 명료합니다. 또한 각주 표지는 대안이 적용되는 ‘말씀하셨고’에 붙여야 그 범위가 분명합니다.
