lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨고
  alternatives_korean:
  - 말하셨고
  - 이르셨고
  - 명령하셨고
  lexicon: HALOT
  rationale: אמר의 기본 의미는 ‘말하다’이지만, 하나님이 물고기에게 직접 발화하시는 장면이므로 ‘말씀하셨고’가 자연스럽고 위엄을 유지합니다. ‘명령하셨고’는 원문보다 강도를 덧씌울 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명 YHWH는 ‘야훼’로 옮겨 하나님의 고유 이름을 보존합니다. ‘주’는 호칭으로 환원될 수 있어 여기서는 쓰지 않았습니다.
- source_word: לַדָּג
  english_pob_choice: to the fish
  chosen_korean: 그 물고기에게
  alternatives_korean:
  - 물고기에게
  - 그 큰 물고기에게
  lexicon: HALOT
  rationale: 이 절에는 단순히 דג ‘물고기’만 있으며 ‘큰’은 본문에 없습니다. 앞 문맥을 되풀이하지 않고도 지시를 살릴 수 있어 ‘그 물고기에게’로 옮겼습니다.
- source_word: וַיָּקֵא
  english_pob_choice: vomited
  chosen_korean: 토해냈습니다
  alternatives_korean:
  - 토했습니다
  - 뱉어냈습니다
  - 게워냈습니다
  lexicon: HALOT
  rationale: קיא는 ‘토하다’의 강한 동사를 가리키므로 의미를 약화시키지 않는 ‘토해냈습니다’를 택했습니다. ‘뱉어냈습니다’는 구어적이고, ‘토했습니다’는 다소 완화됩니다.
theological_decisions:
- issue: 하나님의 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 번역은 본문이 직접 사용한 יְהוָה를 고유명으로 드러내는 프로젝트 원칙을 따릅니다. 문맥상 익숙한 대체어보다 이름 자체를 보존하는 편이 원문 감각에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
