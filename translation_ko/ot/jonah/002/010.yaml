id: JON.2.10
reference: Jonah 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/ק֤וֹל תּוֹדָה֙ אֶזְבְּחָה לָּ֔/ךְ אֲשֶׁ֥ר נָדַ֖רְתִּי אֲשַׁלֵּ֑מָה יְשׁוּעָ֖תָ/ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/010.yaml
  text: But as for me[a], with the voice of thanksgiving I will sacrifice to you; what I have vowed I will pay. Salvation belongs to Yahweh.
  footnotes:
  - marker: a
    text: Or 'Deliverance belongs to the LORD' or 'Salvation is from the LORD.' The Hebrew יְשׁוּעָה can denote rescue/deliverance in context, while also carrying the broader sense of salvation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 감사의 소리로 주께 제물을 드리겠습니다. 제가 서원한 것은 갚겠습니다. 구원은 야훼께 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְשׁוּעָה는 문맥상 ‘구원’뿐 아니라 ‘구출/도움’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 그러나 저는
  alternatives_korean:
  - 하지만 저는
  - 그러나 나로 말하면
  lexicon: HALOT
  rationale: 앞선 상황과의 대조를 살리되, 한국어에서는 '그러나 저는'이 가장 자연스럽고 문맥의 대비를 분명히 드러냅니다.
- source_word: בְּקוֹל תּוֹדָה
  english_pob_choice: with the voice of thanksgiving
  chosen_korean: 감사의 소리로
  alternatives_korean:
  - 감사의 목소리로
  - 감사하는 소리로
  - 감사로
  lexicon: HALOT
  rationale: ‘소리/목소리’의 이미지와 ‘감사’의 의미를 함께 살렸습니다. 영어 POB의 ‘voice’에 해당하는 청각적 표지를 유지하되, 한국어에서는 더 자연스럽게 압축했습니다.
- source_word: אֶזְבְּחָה
  english_pob_choice: I will sacrifice
  chosen_korean: 제물을 드리겠습니다
  alternatives_korean:
  - 희생 제사를 드리겠습니다
  - 제사하겠습니다
  lexicon: HALOT
  rationale: 히브리어 זבח는 제의적 희생 제사를 뜻하므로, 현대 한국어에서 의미가 분명한 ‘제물을 드리겠습니다’로 옮겼습니다. '드리다'는 하나님께 드리는 제사의 방향을 분명히 합니다.
- source_word: אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה
  english_pob_choice: what I have vowed I will pay
  chosen_korean: 제가 서원한 것은 갚겠습니다
  alternatives_korean:
  - 제가 서원한 것은 이행하겠습니다
  - 서원한 것을 갚겠습니다
  - 서원한 것을 다하겠습니다
  lexicon: HALOT
  rationale: 서원 문맥에서 שלם은 단순히 ‘지불하다’보다 ‘서원을 갚다/이행하다’의 관용이 강합니다. 한국어에서는 ‘갚겠습니다’가 서원의 이행과 의무의 충족을 가장 직접적으로 드러냅니다.
- source_word: יְשׁוּעָתָה לַיהוָה
  english_pob_choice: Salvation belongs to Yahweh
  chosen_korean: 구원은 야훼께 있습니다
  alternatives_korean:
  - 구원은 야훼의 것입니다
  - 구원은 야훼에게서 옵니다
  - 야훼께 구원이 있습니다
  lexicon: HALOT
  rationale: ל + יהוה는 소유/귀속 또는 근원의 관계를 나타낼 수 있으나, 이 결구에서는 선언문처럼 '야훼께 있습니다'가 가장 자연스럽습니다. יְשׁוּעָה는 문맥상 ‘구원’으로 넓게 유지했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 언약 이름을 직접 사용하므로, 프로젝트 기본 원칙에 따라 전통적 대체어 대신 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
