base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/004.yaml
  text: You cast me into the deep[a], into the heart of the seas, and the current surrounded me; all your breakers and your waves passed over me.
  footnotes:
  - marker: a
    text: Or 'and the river surrounded me,' with נָהָר taken in its more usual sense 'river'; here it likely refers to the sea's current or flood in the poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 저를 깊은 곳, 바다 한가운데로 던지셨습니다. 물살이[a] 저를 에워쌌고, 주의 모든 부서지는 파도와 물결이 제 위로 지나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강’. 히브리어 나하르(נָהָר)는 보통 ‘강’을 뜻하지만, 이 해상 문맥에서는 바다의 물살이나 흐름을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  english_pob_choice: You cast me
  chosen_korean: 저를 던지셨습니다
  alternatives_korean:
  - 저를 내던지셨습니다
  - 저를 던져 넣으셨습니다
  lexicon: HALOT
  rationale: שלך의 ‘던지다/내던지다’ 의미를 살리되, 시적 문맥에 맞게 자연스러운 합쇼체로 옮겼습니다.
- source_word: מְצוּלָה
  english_pob_choice: into the deep
  chosen_korean: 깊은 곳으로
  alternatives_korean:
  - 심연으로
  - 깊은 물속으로
  lexicon: HALOT
  rationale: 바다의 심연을 가리키는 뜻을 간결하게 살리면서도 현대 한국어에서 과도하게 설명적이지 않게 옮겼습니다.
- source_word: נָהָר
  english_pob_choice: and the current
  chosen_korean: 물줄기
  alternatives_korean:
  - 강
  - 흐름
  - 급류
  lexicon: HALOT
  rationale: 이 해상 문맥에서는 일반적인 ‘강’보다 바다의 흐름이나 물살을 가리키는 뜻이므로, 영어 POB의 해석을 반영해 ‘물줄기’로 옮겼습니다.
- source_word: מִשְׁבָּרֶיךָ וְגַלֶּיךָ
  english_pob_choice: your breakers and your waves
  chosen_korean: 주의 모든 큰 물결과 파도
  alternatives_korean:
  - 주의 모든 물보라와 파도
  - 주의 파도와 물결
  lexicon: HALOT
  rationale: ‘주의’라는 소유격을 유지해 물이 하나님의 통제 아래 있음을 드러냈고, מִשְׁבָּר/גַלִּים의 반복적 물결 이미지는 한국어에서 의미가 분명한 ‘큰 물결과 파도’로 풀었습니다.
theological_decisions:
- issue: 하나님께 직접 말하는 2인칭과 바다의 소유격을 유지할지 여부
  chosen_reading: 주께서 저를 던지셨고, 물결과 파도가 ‘주의’ 것이라는 직접 호칭을 유지했습니다.
  alternative_readings:
  - 수동적으로 ‘저는 깊은 곳에 던져졌습니다’로 옮김
  - 소유격을 빼고 ‘큰 물결과 파도’로만 옮김
  rationale: 히브리어는 2인칭 단수와 2인칭 소유격을 분명히 사용하므로, 요나의 고난이 궁극적으로 하나님의 주권 아래 있음을 흐리지 않도록 직접 호칭을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
