  - 흐름
  - 급류
  lexicon: HALOT
  rationale: 이 해상 문맥에서는 일반적인 ‘강’보다 바다의 흐름이나 물살을 가리키는 뜻이므로, 영어 POB의 해석을 반영해 ‘물줄기’로 옮겼습니다.
- source_word: מִשְׁבָּרֶיךָ וְגַלֶּיךָ
  english_pob_choice: your breakers and your waves
  chosen_korean: 주의 모든 큰 물결과 파도
