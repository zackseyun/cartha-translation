translation:
  language: ko
  text: 주께서 저를 깊은 곳으로, 바다들의 중심으로 던지셨습니다. 물줄기가 저를 에워쌌고, 주의 모든 큰 물결과 파도가 저 위를 지나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물줄기’로도 옮길 수 있으며, נָהָר를 더 보통의 뜻인 ‘강’으로 볼 여지도 있습니다. 그러나 이 해상적 문맥에서는 바다의 흐름이나 물살을 가리키는 것으로 이해하는 편이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  english_pob_choice: You cast me
  chosen_korean: 저를 던지셨습니다
  alternatives_korean:
