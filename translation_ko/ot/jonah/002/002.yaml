translation:
  language: ko
  text: 그러자 요나는 자기 하나님 야훼께 물고기의 뱃속에서 기도했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘물고기의 내장 부분에서’입니다. ‘뱃속’은 문맥에 맞는 자연스러운 번역입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: Then ... prayed
  chosen_korean: 그러자 ... 기도했습니다
  alternatives_korean:
  - 그리고 ... 기도했습니다
  - 그때 ... 기도했습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행과 פלל의 ‘기도하다’ 의미를 자연스러운 합쇼체 과거로 옮겼습니다. ‘그러자’는 사건의 연속성을 살리면서 현대 한국어 문맥에 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 POB 기준에 따라 고유명사 ‘야훼’로 옮겨, ‘주’라는 호칭으로 대체하지 않았습니다.
- source_word: אֱלֹהָיו
  english_pob_choice: his God
  chosen_korean: 자기 하나님
  alternatives_korean:
  - 그의 하나님
  - 하나님
  lexicon: HALOT
  rationale: 3인칭 남성 접미사의 소속 관계를 한국어에서 자연스럽게 드러내기 위해 ‘자기 하나님’으로 옮겼습니다.
- source_word: מִמְּעֵי הַדָּגָה
  english_pob_choice: from the belly of the fish
  chosen_korean: 물고기의 뱃속에서
  alternatives_korean:
  - 물고기의 내장 속에서
  - 물고기의 속에서
  lexicon: HALOT
  rationale: מֵעֶה의 본뜻인 ‘내장/속부분’이지만, 물고기에 삼켜진 장면에서는 ‘뱃속’이 가장 자연스럽고 구체적인 한국어입니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 하나님의 언약 անուն을 직접 사용하므로, 호칭으로 완화하지 않고 고유명사 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
