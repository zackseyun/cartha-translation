  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי מַ֨יִם֙ עַד נֶ֔פֶשׁ תְּה֖וֹם יְסֹבְבֵ֑/נִי ס֖וּף חָב֥וּשׁ לְ/רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/006.yaml
  text: Waters closed in around me to my very life[a]; the deep surrounded me[b]; seaweed was wrapped around my head.
  footnotes:
  - marker: a
    text: Or 'to the soul,' that is, 'to my life' or 'to my very self.'
    reason: lexical_alternative
  - marker: b
    text: '''Seaweed'' may also be rendered ''reeds'' or ''rushes''; the context of Jonah submerged in the sea favors ''seaweed.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 물들이 나를 내 생명까지 둘러쌌습니다[a]. 깊음이 나를 에워쌌고[b], 해초가 내 머리를 감쌌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼까지’, 곧 ‘내 생명까지’ 또는 ‘내 자신까지’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해초’는 문맥상 바닷속의 풀을 뜻하는 것으로 보이며, 다른 문맥에서는 ‘갈대’나 ‘부들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  english_pob_choice: closed in around me
  chosen_korean: 나를 둘러쌌습니다
  alternatives_korean:
  - 나를 에워쌌습니다
  - 나를 포위했습니다
  lexicon: HALOT
  rationale: 물의 위협적 포위감을 자연스러운 한국어로 살리면서, 뒤의 ‘깊음’과 병렬을 이루도록 했습니다.
- source_word: עַד נֶפֶשׁ
  english_pob_choice: to my very life
  chosen_korean: 내 생명까지
  alternatives_korean:
  - 내 목숨까지
  - 내 영혼까지
  - 내 삶까지
  lexicon: HALOT
  rationale: נֶפֶשׁ을 영혼으로 추상화하지 않고, 물이 생명 자체를 위협한다는 뜻을 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: תְּהוֹם
  english_pob_choice: the deep
  chosen_korean: 깊음
  alternatives_korean:
  - 깊은 곳
  - 심연
  - 깊은 물
  lexicon: HALOT
  rationale: 원문의 시적 병행을 살리면서도, 한국어에서 자연스럽게 ‘the deep’의 대상을 가리키는 표현으로 선택했습니다.
- source_word: סוּף
  english_pob_choice: seaweed
  chosen_korean: 해초
  alternatives_korean:
  - 바닷풀
  - 갈대
  - 부들
  lexicon: HALOT
  rationale: 문맥상 바다 속에 있는 요나의 이미지에 맞추어, 갈대나 부들보다 해초가 가장 직접적입니다.
theological_decisions:
- issue: נֶפֶשׁ의 의미
  chosen_reading: ‘영혼’이 아니라 생명/자기 자신을 가리키는 말로 이해해 ‘내 생명까지’로 번역했습니다.
  alternative_readings:
  - 내 영혼까지
  - 내 목숨까지
  rationale: 문맥은 물이 요나의 실존적 위기를 가져오는 장면이므로, 히브리어 נֶפֶשׁ의 생명적 의미를 보존하는 것이 적절합니다.
  doctrine_reference: 인간 이해와 히브리어 נפש의 용례
