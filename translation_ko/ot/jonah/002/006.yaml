  text: 물이 내 생명을 위협할 만큼 나를 에워쌌습니다[a]. 깊은 물이 나를 둘러쌌고, 해초가 내 머리를 휘감았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영혼까지’, 곧 ‘내 생명까지’ 또는 ‘내 자신까지’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해초’는 다른 문맥에서는 ‘갈대’나 ‘부들’로도 옮길 수 있습니다. 그러나 바다에 잠긴 요나의 상황에서는 ‘해초’가 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
