  naturalness: 초안은 인용문 안에서 ‘제가’와 ‘나는’가 섞여 합쇼체 일관성이 약합니다. 또한 ‘성전을 향해 바라보다’가 방향격을 자연스럽고 명시적으로 전달합니다.
  terminology: ‘주님’, ‘거룩한 성전’은 현대 표준어 성서 문맥에서 적절합니다. ‘임재’는 본문의 구체적 ‘눈/시야’ 이미지를 해석적으로 확장하므로 각주 대안으로만 유지하는 것이 타당합니다.
