base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/005.yaml
  text: And I said[a], ‘I have been driven out from before your eyes; yet I will again look toward your holy temple.’
  footnotes:
  - marker: a
    text: Or, “from your sight” or “out of your presence.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 말했습니다. ‘저는 주님의 눈앞에서[a] 쫓겨났습니다. 그러나 저는 다시 주님의 거룩한 성전을 향해 바라보겠습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님의 시야에서” 또는 “주님의 임재에서”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And I
  chosen_korean: 그리고 제가
  alternatives_korean:
  - 그런데 저는
  - 그리고 나는
  lexicon: HALOT
  rationale: 연결 접속사와 화자의 강조를 살리면서도 한국어 합쇼체에 맞게 자연스럽게 이어 주었습니다.
- source_word: נִגְרַשְׁתִּי מִנֶּגֶד עֵינֶיךָ
  english_pob_choice: I have been driven out from before your eyes
  chosen_korean: 주님의 눈앞에서 쫓겨났습니다
  alternatives_korean:
  - 주님의 시선에서 쫓겨났습니다
  - 주님의 앞에서 내쫓겼습니다
  - 주님의 임재에서 쫓겨났습니다
  lexicon: HALOT
  rationale: ‘눈앞에서’는 히브리어의 구체적 이미지를 살리며, ‘쫓겨났습니다’는 수동적 추방의 의미를 자연스럽게 전달합니다.
- source_word: אַךְ אוֹסִיף
  english_pob_choice: yet I will again
  chosen_korean: 그러나 나는 다시
  alternatives_korean:
  - 그렇지만 나는 다시
  - 오히려 나는 다시
  - 그러나 나는 또
  lexicon: HALOT
  rationale: אַךְ의 강한 전환을 ‘그러나’로, אוֹסִיף의 재개 의미를 ‘다시’로 옮겨 절망에서 희망으로의 반전을 분명히 했습니다.
- source_word: אֶל הֵיכַל קָדְשֶׁךָ
  english_pob_choice: toward your holy temple
  chosen_korean: 주님의 거룩한 성전을 바라보겠습니다
  alternatives_korean:
  - 주님의 거룩한 성전을 향해 보겠습니다
  - 주님의 거룩한 성전을 우러러보겠습니다
  - 주님의 거룩한 성전을 다시 보겠습니다
  lexicon: HALOT
  rationale: אֶל의 방향성을 ‘~을 향해/바라보다’로 살렸고, הֵיכָל은 문맥상 ‘성전’이 자연스럽습니다.
theological_decisions:
- issue: ‘눈앞에서’의 공간적 이미지와 ‘임재/관계적 단절’의 해석 가능성
  chosen_reading: 본문에는 ‘주님의 눈앞에서’로 두고, 해석을 본문 밖에서 열어 둡니다.
  alternative_readings:
  - 주님의 시선에서
  - 주님의 임재에서
  - 주님의 앞에서
  rationale: 히브리어 표현의 구체성을 보존해야 하므로, 신학적 의미를 본문에서 과도하게 풀어 쓰지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
