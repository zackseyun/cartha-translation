  to: 제가 말했습니다. ‘저는 주님의 눈앞에서[a] 쫓겨났습니다. 그러나 저는 다시 주님의 거룩한 성전을 향해 바라보겠습니다.’
  rationale: 합쇼체에 맞추어 인칭 대명사를 ‘저는’으로 통일했습니다. 원문의 ‘눈앞’ 이미지는 본문에 보존하고, ‘시야’ 및 해석적인 ‘임재’는 각주로 처리했습니다. 또한 각주 표지를 해당 어구에 붙이고, ‘향해’를 보충하여 성전을 향한 시선이라는 방향성을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:42:50Z'
