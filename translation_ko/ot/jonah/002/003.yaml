id: JON.2.3
reference: Jonah 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר קָ֠רָאתִי מִ/צָּ֥רָה לִ֛/י אֶל יְהוָ֖ה וַֽ/יַּעֲנֵ֑/נִי מִ/בֶּ֧טֶן שְׁא֛וֹל שִׁוַּ֖עְתִּי שָׁמַ֥עְתָּ קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/003.yaml
  text: And he said[a], “I called to Yahweh out of my distress, and he answered me. From the belly of Sheol I cried out[b]; you heard my voice.”
  footnotes:
  - marker: a
    text: Or 'From the womb of Sheol'; the Hebrew word can mean 'belly' or 'womb.'
    reason: lexical_alternative
  - marker: b
    text: Sheol is the Hebrew term for the realm of the dead; alternatively, 'the grave' in a more interpretive rendering.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그가 말했습니다. “제가 제 환난 가운데서 야훼께 부르짖었더니, 그분이 제게 응답하셨습니다. 스올의 배 속에서 제가 외쳤더니[a], 당신께서 제 목소리를 들으셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스올의 태에서’. 히브리어 단어는 ‘배’ 또는 ‘태’로도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 그가 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서사 연결어 wayyiqtol의 흐름을 살리면서, 현대 한국어 서술에서는 자연스러운 접속사 ‘그리고’를 사용했습니다.
- source_word: קָרָאתִי מִצָּרָה לִי
  english_pob_choice: I called to Yahweh out of my distress
  chosen_korean: 제가 제 환난 가운데서 야훼께 부르짖었더니
  alternatives_korean:
  - 제가 제 환난 가운데서 야훼께 불렀더니
  - 제가 제 고통 가운데서 야훼께 외쳤더니
  lexicon: HALOT
  rationale: קרא는 단순한 ‘부르다’보다 절박한 기도 상황에서 ‘부르짖다’가 더 정확하며, צָרָה는 ‘환난’이 본문의 위기성과 시적 어조를 잘 살립니다.
- source_word: שְׁאוֹל
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  - 음부
  lexicon: HALOT
  rationale: שְׁאוֹל은 후기 신학적 범주로 평탄화하지 않고 고유한 히브리 개념을 보존하기 위해 음역했습니다.
- source_word: שִׁוַּעְתִּי
  english_pob_choice: I cried out / I cried for help
  chosen_korean: 제가 외쳤더니
  alternatives_korean:
  - 제가 부르짖었더니
  - 제가 도움을 청했더니
  lexicon: HALOT
  rationale: 해당 동사는 도움을 구하는 절박한 외침을 가리키므로, 앞의 ‘부르짖다’와 중복을 피하면서도 강도를 유지하는 ‘외치다’를 택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 여호와 이름을 한국어 표준어의 학술 음역인 ‘야훼’로 옮겨, 본문의 고유한 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: שְׁאוֹל의 보존
  chosen_reading: 스올
  alternative_readings:
  - 무덤
  - 음부
  - 죽은 자들의 세계
  rationale: 스올을 개념적으로 해석해 버리지 않고 음역으로 남겨, 히브리 본문의 신학적 긴장을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
