id: JON.2.7
reference: Jonah 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/קִצְבֵ֤י הָרִים֙ יָרַ֔דְתִּי הָ/אָ֛רֶץ בְּרִחֶ֥י/הָ בַעֲדִ֖/י לְ/עוֹלָ֑ם וַ/תַּ֧עַל מִ/שַּׁ֛חַת חַיַּ֖/י יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/007.yaml
  text: I went down to the roots of the mountains[a]; the earth with its bars was around me forever, but you brought up my life from the pit[c][b], O Yahweh my God.
  footnotes:
  - marker: a
    text: Or 'to the extremities/bases of the mountains.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the earth—its bars closed in behind me forever.' The Hebrew imagery is of imprisonment by the earth's bars or bolts.
    reason: lexical_alternative
  - marker: c
    text: Or 'from the grave' or 'from destruction' for 'from the pit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 산들의 뿌리까지 내려갔습니다[a]. 땅은 그 빗장으로 나를 영원히 둘러싸고 있었습니다[b]. 그러나 야훼 나의 하나님이[b][c] 제 생명을 구덩이에서 끌어올리셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산들의 끝/기슭까지’라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘땅—그 빗장이 나를 뒤에 두고 영원히 닫혀 있었습니다.’라는 뜻일 수 있습니다. 히브리어 이미지는 땅의 빗장이나 빗장이 감금하는 모습입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘무덤에서’ 혹은 ‘멸망에서’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְקִצְבֵי הָרִים
  english_pob_choice: to the roots of the mountains
  chosen_korean: 산들의 뿌리까지
  alternatives_korean:
  - 산들의 끝자락까지
  - 산들의 기슭까지
  - 산들의 바닥까지
  lexicon: HALOT
  rationale: 산들에 대한 ‘끝/경계’의 이미지를 한국어에서 가장 자연스럽게 살릴 수 있는 표현으로 ‘뿌리’를 택해, 아래로 가라앉는 시적 대비를 보존했습니다.
- source_word: בְּרִחֶיהָ
  english_pob_choice: with its bars
  chosen_korean: 그 빗장으로
  alternatives_korean:
  - 그 빗장들과 함께
  - 그 빗장으로
  - 그 문빗장으로
  lexicon: HALOT
  rationale: בְּרִיחַ는 막대기/빗장에 해당하므로, 감금의 이미지를 분명히 드러내는 ‘빗장’이 적합합니다.
- source_word: בַעֲדִי
  english_pob_choice: was around me
  chosen_korean: 나를 영원히 둘러싸고 있었습니다
  alternatives_korean:
  - 나를 둘러싸고 있었습니다
  - 나를 에워싸고 있었습니다
  - 나를 가로막고 있었습니다
  lexicon: HALOT
  rationale: 문맥상 ‘뒤에 있었다’보다 포위·봉쇄의 뜻이 더 강하므로, 지면 전체가 에워싼다는 느낌을 살렸습니다.
- source_word: מִשַּׁחַת
  english_pob_choice: from the pit
  chosen_korean: 구덩이에서
  alternatives_korean:
  - 무덤에서
  - 멸망에서
  - 스올에서
  lexicon: HALOT
  rationale: 직역적이면서도 시적 하강 이미지가 살아 있는 ‘구덩이’를 택했습니다. 한국어 독자에게는 죽음의 함의가 자연스럽게 전달됩니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 고유한 언약명은 제목어 ‘주님’으로 대체하지 않고, 본 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하강-구원 이미지와 죽음의 경계
  chosen_reading: ‘산들의 뿌리’, ‘빗장’, ‘구덩이’를 그대로 살려, 요나가 실제 죽음의 경계에 다다른 것처럼 묘사된 긴장을 유지했습니다.
  alternative_readings:
  - 지하세계로 곧장 해석하는 번역
  - 비유를 약화시켜 일반적 곤경으로 완화하는 번역
  rationale: 본문은 단순한 곤란이 아니라 생명의 소멸과 구원의 반전을 시적으로 말하므로, 이미지를 완화하지 않는 것이 원문의 신학적 힘을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: preserve theological tension rather than resolve it'
