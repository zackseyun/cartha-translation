  to: 나는 산들의 뿌리까지 내려갔습니다[a]. 땅과 그 빗장이 나를 영원히 에워싸고 있었습니다[b]. 그러나 야훼, 나의 하나님, 주께서 제 생명을 구덩이에서[c] 끌어올리셨습니다.
