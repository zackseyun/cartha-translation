  lexicon: HALOT
  rationale: 이 동사는 단순 제공보다 주권적 마련의 뜻이 강하므로, 현대 한국어에서 자연스럽고 목적성을 드러내는 마련하셨습니다로 옮겼습니다.
- source_word: דָּג גָּדוֹל
