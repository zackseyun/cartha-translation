  text: וַ/יְמַ֤ן יְהוָה֙ דָּ֣ג גָּד֔וֹל לִ/בְלֹ֖עַ אֶת יוֹנָ֑ה וַ/יְהִ֤י יוֹנָה֙ בִּ/מְעֵ֣י הַ/דָּ֔ג שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/001.yaml
  text: And Yahweh appointed a great fish to swallow Jonah[d][c][b][a], and Jonah was in the belly of the fish three days and three nights.
  footnotes:
  - marker: a
    text: Or 'prepared' or 'provided' a great fish.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the inward parts of the fish'; rendered idiomatically as 'in the belly of the fish.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'great fish,' not specifically 'whale.'
    reason: alternative_reading
  - marker: d
    text: The expression 'three days and three nights' is translated as written, without resolving questions about inclusive reckoning.
    reason: cross_reference
translation:
  language: ko
  text: 야훼께서 큰 물고기를 마련하셔서 요나를 삼키게 하셨습니다. 요나는 그 물고기의 배 속에서 삼 일 밤낮을 지냈습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘준비하셨습니다’, ‘제공하셨습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘물고기의 내부’에 해당하며, 이를 한국어 관용으로 ‘배 속’이라 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘물고기’라고 말하며, 구체적으로 ‘고래’라고 하지는 않습니다.
    reason: alternative_reading
  - marker: d
    text: ‘삼 일 밤낮’은 포함 계산 여부를 본문에서 풀지 않고 그대로 옮겼습니다.
    reason: cross_reference
