id: JON.2.8
reference: Jonah 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/הִתְעַטֵּ֤ף עָלַ/י֙ נַפְשִׁ֔/י אֶת יְהוָ֖ה זָכָ֑רְתִּי וַ/תָּב֤וֹא אֵלֶ֨י/ךָ֙ תְּפִלָּתִ֔/י אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/008.yaml
  text: When my life was fainting away within me[a], I remembered Yahweh, and my prayer came to you[b], into your holy temple.
  footnotes:
  - marker: a
    text: Or 'When my soul grew faint within me.' Hebrew nephesh can mean 'life,' 'soul,' or 'self' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'to your holy palace/sanctuary.' The Hebrew term can denote a royal palace or temple; here 'temple' fits the prayer context.
    reason: lexical_alternative
translation:
  language: ko
  text: 제 삶이 제 안에서 쇠해 갈 때, 저는 야훼를 기억했습니다. 그리고 제 기도는 당신께, 당신의 거룩한 성전으로 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삶’은 여기서 נפש의 문맥적 의미를 따른 번역입니다. ‘영혼’ 또는 ‘자기 자신’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성전’은 הֵיכָל의 가능한 뜻인 ‘궁전’/‘성소’ 가운데, 기도 문맥에 가장 적합한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִתְעַטֵּף עָלַי נַפְשִׁי
  english_pob_choice: When my life was fainting away within me
  chosen_korean: 제 삶이 제 안에서 쇠해 갈 때
  alternatives_korean:
  - 제 생명이 제 안에서 기운이 다해 갈 때
  - 제 영혼이 제 안에서 희미해질 때
  lexicon: WLC/HALOT
  rationale: נֶפֶשׁ는 여기서 생명의 소멸 위기에 있는 상태를 가리키므로 ‘삶’으로 옮겨, 내면적이면서도 실제적인 쇠약을 자연스럽게 드러냈습니다.
- source_word: אֶת יְהוָה
  english_pob_choice: I remembered Yahweh
  chosen_korean: 저는 야훼를 기억했습니다
  alternatives_korean:
  - 저는 여호와를 기억했습니다
  - 저는 주님을 기억했습니다
  lexicon: WLC/HALOT
  rationale: 원문이 여호와 이름을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
- source_word: וַ/תָּבֹא אֵלֶי/ךָ תְּפִלָּתִי
  english_pob_choice: and my prayer came to you
  chosen_korean: 제 기도는 당신께 ... 들어갔습니다
  alternatives_korean:
  - 제 기도는 당신께 갔습니다
  - 제 기도는 당신께 이르렀습니다
  lexicon: WLC/HALOT
  rationale: 히브리어 전치사와 POB의 ‘into your holy temple’ 수정안을 반영해, 기도가 단순히 ‘도착’한 것이 아니라 하나님께로 ‘들어가는’ 이미지를 살렸습니다.
- source_word: אֶל הֵיכַל קָדְשֶׁךָ
  english_pob_choice: into your holy temple
  chosen_korean: 당신의 거룩한 성전으로
  alternatives_korean:
  - 당신의 거룩한 궁전으로
  - 당신의 거룩한 성소로
  lexicon: WLC/HALOT
  rationale: הֵיכָל은 궁전/성전을 가리킬 수 있으나, 기도 문맥에서는 ‘성전’이 가장 분명하며, ‘으로’로 바꿔 ‘into’의 진입 이미지를 반영했습니다.
theological_decisions:
- issue: 여호와 신명의 처리
  chosen_reading: 본문에는 ‘야훼’를 유지했습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - ‘여호와’로 전통화
  rationale: 원문이 יְהוָה를 직접 사용하므로, 신명 자체를 드러내는 번역을 택해 언약 이름의 무게를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘제 삶’과 נפש의 해석
  chosen_reading: 생명-상실의 구체적 의미를 살리되, 영혼으로 고정하지 않았습니다.
  alternative_readings:
  - ‘제 영혼’
  - ‘제 자아’
  rationale: 문맥은 요나의 생명이 꺼져 가는 위기이므로, 한국어에서도 신학적 추상보다 생명의 소멸을 먼저 드러내는 것이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
