review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. בְּהִתְעַטֵּף עָלַי נַפְשִׁי는 생명이 꺼져 가는 절박한 상황으로, ‘제 생명이 제 안에서 꺼져 갈 때’는 그 문맥을 자연스럽게 반영합니다. יְהוָה는 프로젝트 방침 및 원문에 따라 ‘야훼’로 유지했습니다. 후반절의 두 목적지 표현(‘당신께’와 ‘당신의 거룩한 성전으로’)도 보존했습니다.
  naturalness: 초안의 ‘제 삶이 제 안에서 쇠해 갈 때’는 의미는 가능하지만 현대 한국어에서 다소 부자연스럽고, ‘당신께, 당신의 거룩한 성전으로 들어갔습니다’는 병렬 보어의 연결이 매끄럽지 않습니다. ‘생명이 … 꺼져 갈 때’와 ‘주님께, 주님의 거룩한 성전 안으로’가 합쇼체 성경 문체에서 더 자연스럽습니다.
  terminology: ‘야훼’는 신명을 직접 드러내며, נֶפֶשׁ는 본문 문맥상 ‘생명’으로 옮기는 것이 적절합니다. הֵיכָל은 ‘거룩한 성전’으로 번역하고, 각주에서 ‘궁전’과 ‘성소’의 가능성을 보존합니다. 하나님을 향한 2인칭은 현대 한국어의 ‘당신’보다 존칭 호칭인 ‘주님’이 자연스럽습니다.
  issues:
