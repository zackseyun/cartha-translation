  yaml_path: translation/ot/jonah/004/003.yaml
  text: And now[a], Yahweh, please take my life from me, for my dying is better than my living.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'for it is better for me to die than to live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 야훼여, 제 목숨을 제게서 거두어 주십시오. 제 죽음이 제 삶보다 낫습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 ‘내가 죽는 것이 사는 것보다 낫습니다’라고 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 시간 전환을 자연스럽게 살리되, 원문의 급박한 호소를 한국어답게 압축해 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 언약명 יְהוָה를 일반 호칭이 아니라 고유명으로 보존합니다.
- source_word: קַח נָא אֶת נַפְשִׁי מִמֶּנִּי
  english_pob_choice: please take my life from me
  chosen_korean: 제 목숨을 제게서 거두어 주십시오
  alternatives_korean:
  - 제 생명을 제게서 가져가 주십시오
  - 제 목숨을 저에게서 빼앗아 주십시오
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 생명/목숨의 뜻이므로, 간청의 뉘앙스와 함께 한국어에서 자연스러운 ‘거두다’를 사용했습니다.
- source_word: מוֹתִי / מֵחַיָּי
  english_pob_choice: my dying ... my living
  chosen_korean: 제 죽음 ... 제 삶
  alternatives_korean:
  - 제가 죽는 것 ... 제가 사는 것
  - 제 죽어 감 ... 제 살아 감
  lexicon: HALOT
  rationale: 영어 POB의 ‘my dying / my living’보다 한국어에서는 의미가 분명한 명사형이 더 자연스러워, 비교 구조를 유지하면서도 읽기 쉽게 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 호칭 처리
  chosen_reading: 본절의 יְהוָה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 공용 번역 관습보다 원문 고유명을 우선하여, 하나님의 언약적 이름을 가리키는 점을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
