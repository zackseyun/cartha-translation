  text: וַ/יִּתְפַּלֵּ֨ל אֶל יְהוָ֜ה וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ הֲ/לוֹא זֶ֣ה דְבָרִ֗/י עַד הֱיוֹתִ/י֙ עַל אַדְמָתִ֔/י עַל כֵּ֥ן קִדַּ֖מְתִּי לִ/בְרֹ֣חַ תַּרְשִׁ֑ישָׁ/ה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל חַנּ֣וּן וְ/רַח֔וּם אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/002.yaml
  text: And he prayed to Yahweh and said[a], “Please, Yahweh, was this not what I said while I was still in my own land? That is why I acted first to flee to Tarshish, because I knew that you are a gracious and compassionate God, slow to anger and abundant in steadfast love[c][b], and relenting concerning the disaster.”
  footnotes:
  - marker: a
    text: Or 'I hastened to flee to Tarshish' or 'I anticipated this by fleeing to Tarshish.' The Hebrew verb conveys acting in advance or going before.
    reason: lexical_alternative
  - marker: b
    text: Or 'merciful' for 'compassionate.' The phrase echoes Exodus 34:6.
    reason: cross_reference
  - marker: c
    text: Or 'relenting from the calamity.' The Hebrew says 'the evil/disaster,' using 'evil' in the sense of threatened judgment, not moral evil in God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 야훼께 기도하며 말했습니다[a]. 「아, 야훼여, 제가 아직 제 땅에 있을 때에 한 말이 바로 이것이 아니었습니까? 그래서 제가 미리 다시스로 도망쳤습니다. 야훼께서 은혜로우시고 자비로우시며, 노하기를 더디하시고, 한결같은 사랑이 풍성하시며, 재앙을 거두시는 하나님이심을 제가 알았기 때문입니다[c][b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시스로 도망치려고 미리 행동했습니다’ 또는 ‘다시스로 도망함으로써 이를 미리 예상했습니다.’ 히브리어 동사는 앞서 행동하거나 미리 행동한다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘긍휼이 많으신’으로 옮길 수 있습니다. 이 표현은 출애굽기 34:6을 반영합니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘재앙에서 뜻을 돌이키시는’입니다. 히브리어의 ‘재앙’은 여기서 도덕적 악이 아니라 경고된 심판을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: he prayed
  chosen_korean: 기도하고
  alternatives_korean:
  - 간구하고
  - 중보하고
  lexicon: HALOT
  rationale: 히트파엘형 פלל은 여기서 하나님께 드리는 ‘기도하다’의 뜻이 가장 자연스럽고 정확합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신명 사중문자 יְהוָה는 관용적 대치어가 아니라 고유한 신적 이름이므로, 본 프로젝트 기본값대로 야훼로 옮겼습니다.
- source_word: קִדַּמְתִּי לִבְרֹחַ
  english_pob_choice: I acted first to flee / I fled ahead
  chosen_korean: 서둘러 다시스로 도망쳤습니다
  alternatives_korean:
  - 먼저 도망쳤습니다
  - 미리 도망쳤습니다
  lexicon: HALOT
  rationale: קדם의 선행·선제적 뉘앙스를 살리면서, 한국어로는 ‘서둘러’와 ‘도망쳤습니다’의 결합이 자연스럽고 문맥상 예언 사명을 피하려는 선행 행동을 드러냅니다.
- source_word: חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב חֶסֶד
  english_pob_choice: gracious and compassionate, slow to anger and abundant in steadfast love
  chosen_korean: 은혜롭고 자비로우시며, 노하기를 더디하시고, 인애가 풍부하시며
  alternatives_korean:
  - 은혜롭고 긍휼이 많으시며
  - 은혜롭고 불쌍히 여기시며
  lexicon: HALOT
  rationale: 출 34:6을 반영하는 관용구를 따라 חנון/רחום/אֶרֶךְ אַפַּיִם/רַב חֶסֶד의 대응을 살렸고, חסד는 교회적 상투어를 피하면서도 언약적 무게를 담는 ‘인애’로 옮겼습니다.
- source_word: וְנִחָם עַל הָרָעָה
  english_pob_choice: relenting concerning the disaster
  chosen_korean: 재앙에 대하여 뜻을 돌이키시는
  alternatives_korean:
  - 재난을 거두시는
  - 재앙을 멈추시는
  lexicon: HALOT
  rationale: נחם은 כאן에서 도덕적 ‘회개’가 아니라 선포된 심판을 거두거나 유예하는 ‘뜻을 돌이키다’의 의미이며, הָרָעָה는 악행이 아니라 심판 맥락의 재앙으로 이해하는 것이 맞습니다.
theological_decisions:
- issue: 하나님에 대한 인간적 표현이 담긴 וְנִחָם עַל הָרָעָה의 처리
  chosen_reading: ‘재앙에 대하여 뜻을 돌이키시는’으로 옮겨, 하나님의 성품을 부정하지 않으면서도 본문이 가진 인간적 표현의 긴장을 유지했습니다.
  alternative_readings:
  - 재앙을 후회하시는
  - 재앙에 대해 마음을 바꾸시는
  rationale: 본문은 하나님이 잘못을 회개한다는 뜻이 아니라, 선포된 심판을 거두시는 모습을 인간 언어로 묘사합니다. 이를 너무 매끈하게 정리하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
