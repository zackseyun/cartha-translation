  to: 그가 야훼께 기도하며 말했습니다[a]. 「아, 야훼여, 제가 아직 제 땅에 있을 때에 한 말이 바로 이것이 아니었습니까? 그래서 제가 미리 다시스로 도망쳤습니다. 야훼께서 은혜로우시고 자비로우시며, 노하기를 더디하시고, 한결같은 사랑이 풍성하시며, 재앙을 거두시는 하나님이심을 제가 알았기 때문입니다[c][b].」
  rationale: 선제적으로 도망했다는 קִדַּמְתִּי의 의미를 ‘미리’로 회복하고, 재앙을 철회하시는 뜻을 한국어에서 명확히 했습니다. 또한 하나님의 이름을 반복하여 직접 호칭과 2인칭 서술의 자연스러운 한국어 존대를 유지했습니다. 각주 표지는 본문 표기 순서 [a]와 [c][b]에 맞추어 유지했습니다.
