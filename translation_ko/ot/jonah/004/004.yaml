  to: 야훼께서 말씀하셨습니다. “당신이 분노하는 것이 옳습니까?”[a]
  rationale: 원문의 לָךְ가 가리키는 수신자를 ‘당신이’로 명시하여 요나를 향한 직접적인 질문을 보존했습니다. 나머지 표현은 원문의 수사적·평가적 질문과 현대 표준어 합쇼체에 잘 맞으므로 유지했습니다. 각주는 본문과 구별되는 보다 직역적인 어휘 대안을 자연스럽게 다듬었습니다.
