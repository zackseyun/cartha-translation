lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC; POB default divine-name rendering
  rationale: יהוה의 인칭 이름을 유지하기 위해 관용적 칭호가 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 완료적 연결을 자연스러운 한국어 서술로 옮기되, 하나님의 발화를 격식 있게 표현했습니다.
- source_word: הֲהֵיטֵב חָרָה לָךְ
  english_pob_choice: Is it right for you to be angry?
  chosen_korean: 분노하는 것이 옳습니까?
  alternatives_korean:
  - 화를 내는 것이 옳습니까?
  - 성내는 것이 옳습니까?
  lexicon: HALOT
  rationale: 직역보다 평가적·수사적 질문의 힘을 살리기 위해 ‘옳습니까?’로 옮겼고, חרה의 관용적 의미는 ‘분노하다’로 반영했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할지
  chosen_reading: 본문에는 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 개인 이름을 직접 제시하므로, 호칭 대체보다 고유명칭 보존이 본문의 식별성을 더 잘 드러냅니다.
  doctrine_reference: POB divine-name rendering policy
- issue: 질문의 뉘앙스
  chosen_reading: ‘분노하는 것이 옳습니까?’로 번역해 도덕적 타당성을 묻는 수사문으로 살렸습니다.
  alternative_readings:
  - ‘화를 내는 것이 옳습니까?’
  - ‘성내는 것이 옳습니까?’
  rationale: 히브리어는 단순 감정 확인이 아니라 요나의 분노가 정당한지 묻는 표현이므로, 평가적 의미를 분명히 해야 합니다.
  doctrine_reference: English POB audit trail on הֲהֵיטֵב חָרָה לָךְ
