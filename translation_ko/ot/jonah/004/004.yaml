    issue: 수신자 표지 לָךְ가 본문에서 생략됨
    rationale: 원문은 요나가 분노하는 것이 옳은지를 직접 묻습니다. ‘당신이’를 보충하면 원문의 인칭 표지와 직접적인 책망의 초점이 보존됩니다.
  - severity: low
    issue: 각주의 직역 대안이 다소 비자연적임
    rationale: ‘분노하는 것이 잘하는 일입니까?’보다 ‘분노하는 것이 좋은 일입니까?’가 הֵיטֵב의 보다 직역적인 의미를 자연스러운 한국어로 제시합니다.
  revised_text: 야훼께서 말씀하셨습니다. “당신이 분노하는 것이 옳습니까?”[a]
