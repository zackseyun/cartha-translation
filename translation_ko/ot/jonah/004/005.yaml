id: JON.4.5
reference: Jonah 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א יוֹנָה֙ מִן הָ/עִ֔יר וַ/יֵּ֖שֶׁב מִ/קֶּ֣דֶם לָ/עִ֑יר וַ/יַּעַשׂ֩ ל֨/וֹ שָׁ֜ם סֻכָּ֗ה וַ/יֵּ֤שֶׁב תַּחְתֶּ֨י/הָ֙ בַּ/צֵּ֔ל עַ֚ד אֲשֶׁ֣ר יִרְאֶ֔ה מַה יִּהְיֶ֖ה בָּ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/005.yaml
  text: Then Jonah went out from the city and sat east of the city[b][a]. There he made himself a shelter and sat under it in the shade until he would see what would happen in the city.
  footnotes:
  - marker: a
    text: Or 'a booth' or 'a hut.' The Hebrew refers to a temporary shelter, often made of branches.
    reason: lexical_alternative
  - marker: b
    text: Or 'what would become of the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요나는 그 성읍에서 나가 성읍 동쪽에 앉았습니다. 거기서 그는 자신을 위해 초막[a]을 만들고, 성읍에 무슨 일이 일어날지[b] 볼 때까지 그 그늘 아래에 앉아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘임시 거처’ 또는 ‘오두막’. 히브리어는 흔히 가지 등으로 만든 임시 쉼터를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 성읍이 어떻게 될지’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא / מִן הָעִיר
  english_pob_choice: went out from the city
  chosen_korean: 그 성읍에서 나가
  alternatives_korean:
  - 그 성읍을 떠나
  - 그 성읍에서 나와
  lexicon: WLC; HALOT
  rationale: יצא와 מן의 결합은 단순한 이동이 아니라 도시 밖으로의 분리를 나타내므로, 자연스러운 합쇼체로 ‘나가’라고 옮겼습니다.
- source_word: מִקֶּדֶם לָעִיר
  english_pob_choice: east of the city
  chosen_korean: 성읍의 동쪽에
  alternatives_korean:
  - 성읍 동쪽에
  - 성읍의 동편에
  lexicon: HALOT
  rationale: מקדם은 여기서 지리적 방향을 가리키므로, ‘동쪽에’가 가장 분명하고 현대적인 표현입니다.
- source_word: סֻכָּה
  english_pob_choice: a shelter
  chosen_korean: 초막
  alternatives_korean:
  - 임시 천막
  - 작은 오두막
  - 쉼막
  lexicon: HALOT
  rationale: 히브리어 סֻכָּה는 가지 등으로 만든 임시 거처를 뜻하므로, 기능을 살리면서도 본문의 상징성을 남기는 ‘초막’을 채택했습니다.
- source_word: מַה יִּהְיֶה בָּעִיר
  english_pob_choice: what would happen in the city
  chosen_korean: 성읍에서 어떤 일이 일어나는지
  alternatives_korean:
  - 성읍이 어떻게 될지
  - 성읍에 무슨 일이 생길지
  lexicon: HALOT
  rationale: 문맥상 요나가 성읍의 최종 결과를 지켜보는 뜻이므로, 결과를 묻는 표현으로 옮겼습니다.
theological_decisions:
- issue: 요나의 관찰 태도와 ‘기다림’의 뉘앙스
  chosen_reading: ‘보려고 기다렸습니다’로 옮겨, 단순 관찰이 아니라 사건의 결말을 끝까지 지켜보려는 태도를 드러냈습니다.
  alternative_readings:
  - ‘보려고 앉아 있었습니다’
  - ‘무슨 일이 일어나는지 보았습니다’
  rationale: 히브리어 עד אשר יראה는 목적을 가진 기다림을 나타내므로, 서술의 진행성과 긴장감을 살리는 번역이 필요합니다.
  doctrine_reference: 본문 주해/서사 뉘앙스
- issue: ‘초막’의 선택
  chosen_reading: ‘초막’은 임시 거처라는 기능뿐 아니라 이후 초막절 연상을 떠올리게 하는 본문 내 상징을 보존합니다.
  alternative_readings:
  - ‘쉼터’
  - ‘보호막’
  rationale: 단순한 기능어보다 원문의 문화적·문학적 층위를 보존하는 것이 이 절에 더 적합합니다.
  doctrine_reference: 본문 상징/구약 용례
