revisions:
- from: 그러자 요나는 그 성읍에서 나가 성읍의 동쪽에 앉았습니다. 거기서 그는 자신을 위해 초막을 짓고 그 아래, 그늘에서 앉아 성읍에서 어떤 일이 일어나는지 보려고 기다렸습니다.[a][b]
  to: 그러자 요나는 그 성읍에서 나가 성읍 동쪽에 앉았습니다. 거기서 그는 자신을 위해 초막[a]을 만들고, 성읍에 무슨 일이 일어날지[b] 볼 때까지 그 그늘 아래에 앉아 있었습니다.
  rationale: 수정문은 וַיֵּשֶׁב의 반복을 ‘앉았습니다/앉아 있었습니다’로 보존하고, עַד אֲשֶׁר יִרְאֶה를 ‘볼 때까지’로 옮겨 목적과 시간적 한계를 함께 나타냅니다. ‘성읍 동쪽’은 מִקֶּדֶם לָעִיר의 동쪽이라는 공간 의미를 자연스럽게 유지합니다. 각주는 해당 단어와 구절에 직접 연결하고, ‘보호막’이라는 부정확한 대안을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:09Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 서술은 대체로 충실하지만, ‘보려고 기다렸습니다’는 히브리어의 ‘앉아 있다가/앉아 있으면서 볼 때까지’라는 구조를 한 단계 해석하여 ‘기다리다’를 명시합니다. 또한 결과를 보는 목적과 시간적 한계를 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. 다만 ‘그 아래, 그늘에서 앉아’의 쉼표와 겹친 처소 표현은 다소 부자연스럽습니다. ‘그늘 아래에 앉아 있었습니다’가 더 매끄럽습니다.
  terminology: ‘초막’은 סֻכָּה의 적절한 번역입니다. 다만 각주 대안인 ‘보호막’은 한국어에서 물리적 차단막을 뜻하기 쉬워 임시 거처라는 뜻에 맞지 않습니다. ‘임시 거처’ 또는 ‘오두막’이 적절합니다.
  issues:
  - severity: medium
    issue: ‘보려고 기다렸습니다’가 원문의 동사 ‘앉다’와 עַד אֲשֶׁר의 시간적 한계를 해석적으로 바꿉니다.
    rationale: 요나는 초막 아래에 앉아, 성읍에 무슨 일이 일어날지를 볼 때까지 그곳에 있었습니다. ‘기다리다’는 문맥상 가능한 함의이지만 본문이 명시한 신체 동작을 대체하지 않는 편이 최적등가 번역에 더 맞습니다.
  - severity: low
    issue: 각주 a의 ‘보호막’은 סֻכָּה의 일반적 의미를 정확히 전달하지 못합니다.
    rationale: סֻכָּה는 보통 가지 등으로 만든 임시 쉼터·초막·오두막을 가리키며, ‘보호막’은 차폐물로 이해될 가능성이 큽니다.
  - severity: low
    issue: 각주 표지가 해당 어휘에 직접 붙어 있지 않습니다.
    rationale: a는 ‘초막’에, b는 성읍의 장래를 묻는 구절에 붙여 각주의 적용 범위를 분명히 하는 것이 좋습니다.
