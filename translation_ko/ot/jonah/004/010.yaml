  to: 그때 야훼께서 말씀하셨습니다. “당신은 그 식물[a]을 불쌍히 여기셨습니다. 그것을 위해 수고하지도 않으셨고 자라게 하지도 않으셨습니다. 그 식물은 하룻밤 사이에 생겨나 하룻밤 사이에 사라졌습니다.”
