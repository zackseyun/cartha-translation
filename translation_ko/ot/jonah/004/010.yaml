  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אַתָּ֥ה חַ֨סְתָּ֙ עַל הַ/קִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא עָמַ֥לְתָּ בּ֖/וֹ וְ/לֹ֣א גִדַּלְתּ֑/וֹ שֶׁ/בִּן לַ֥יְלָה הָיָ֖ה וּ/בִן לַ֥יְלָה אָבָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/010.yaml
  text: Then Yahweh said[a], "You had compassion on the plant, for which you did not labor and which you did not make grow, which came up in a night and perished in a night."
  footnotes:
  - marker: a
    text: 'Hebrew: ''the qiqayon''; the exact plant species is uncertain. Traditional English versions often render it ''vine.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 말씀하셨습니다. “당신은 그 식물[a]을 불쌍히 여기셨습니다. 그것을 위해 수고하지도 않으셨고 자라게 하지도 않으셨습니다. 그 식물은 하룻밤 사이에 생겨나 하룻밤 사이에 사라졌습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '그 기키욘(qiqayon)'입니다. 정확한 식물 종은 확실하지 않으며, 전통 역본은 흔히 '덩굴'로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 원문 고유명사를 살려 하나님의 이름을 그대로 옮기며, POB의 יְהוָה → Yahweh 정책에 맞춰 '야훼'를 사용했습니다.
- source_word: חַסְתָּ
  english_pob_choice: had compassion
  chosen_korean: 애정을 가졌는데
  alternatives_korean:
  - 불쌍히 여겼는데
  - 동정했는데
  - 안타깝게 여겼는데
  lexicon: HALOT
  rationale: 이 문맥은 요나의 태도를 책망하는 말투이므로, 단순한 감정보다 대상에 대한 마음의 붙듦을 드러내는 표현으로 처리했습니다.
- source_word: הַקִּיקָיוֹן
  english_pob_choice: the plant
  chosen_korean: 그 식물
  alternatives_korean:
  - 그 덩굴
  - 그 박넝쿨
  - 그 기키욘
  lexicon: HALOT
  rationale: 정확한 식물 종이 불확실하므로, 종을 특정하지 않는 '식물'이 원문의 범위를 가장 안전하게 보존합니다.
- source_word: שֶׁבִּן לַיְלָה הָיָה / וּבִן לַיְלָה אָבָד
  english_pob_choice: which came up in a night and perished in a night
  chosen_korean: 하룻밤 사이에 생겼다가 하룻밤 사이에 사라진
  alternatives_korean:
  - 하룻밤 만에 올라왔다가 하룻밤 만에 없어질
  - 밤 사이에 생겼다가 밤 사이에 망한
  lexicon: HALOT
  rationale: '''בן לילה''의 관용적 짧은 지속을 한국어의 ''하룻밤 사이에''로 살렸고, ''אָבַד''는 문맥상 단순 소멸을 뜻하므로 ''사라진''으로 자연스럽게 옮겼습니다.'
theological_decisions:
- issue: 하나님의 이름 표기
  chosen_reading: 본문에서는 '야훼'를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 표준 원칙에 따라 텍스트의 인격적 이름을 유지해, 본문의 언약적 호칭을 약화시키지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
