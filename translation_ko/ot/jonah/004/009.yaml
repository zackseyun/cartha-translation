- from: 그러자 하나님께서 요나에게 말씀하셨습니다. 「그 박넝쿨 때문에 네가 그렇게 화내는 것이 옳습니까?」 그가 대답했습니다. 「내가 죽을 지경이 되기까지 화내는 것이 옳습니다.」[a]
  to: 그러자 하나님께서 요나에게 말씀하셨습니다. 「그 식물[a] 때문에 네가 화내는 것이 옳습니까?」 요나가 말했습니다. 「내가 죽기까지 화내는 것이 옳습니다.」
  rationale: 식물 종에 관한 불확실성을 본문에서 보존하기 위해 ‘박넝쿨’을 ‘식물’로 고쳤고, 관련 각주 표지를 해당 단어에 붙였습니다. 원문에 없는 ‘그렇게’를 제거했습니다. 요나의 응답은 하나님의 질문을 대칭적으로 되받는 원문의 구문과 עַד מָוֶת의 강한 표현을 살려 ‘죽기까지’로 옮겼습니다.
