source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל יוֹנָ֔ה הַ/הֵיטֵ֥ב חָרָֽה לְ/ךָ֖ עַל הַ/קִּֽיקָי֑וֹן וַ/יֹּ֕אמֶר הֵיטֵ֥ב חָֽרָה לִ֖/י עַד מָֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/009.yaml
  text: Then God said to Jonah[a], “Is it right for you to be angry about the plant?” And he said, “It is right for me to be angry, even to death.”
  footnotes:
  - marker: a
    text: Hebrew קִיקָיוֹן (qiqayon), a plant of uncertain species; traditional translations include 'gourd' or 'vine,' and some identify it as a castor-oil plant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 하나님께서 요나에게 말씀하셨습니다. 「그 박넝쿨 때문에 네가 그렇게 화내는 것이 옳습니까?」 그가 대답했습니다. 「내가 죽을 지경이 되기까지 화내는 것이 옳습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קִיקָיוֹן(qiqayon)은 정확한 식물이 불확실하며, 전통 번역에는 ‘박’, ‘박넝쿨’, ‘덩굴’, ‘피마자’ 등이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: 일반 성경 용례
  rationale: 본문의 주어는 이스라엘의 하나님이므로 표준 개신교 용례에 따라 ‘하나님’으로 옮겼습니다.
- source_word: הַ/הֵיטֵב חָרָה לְ/ךָ
  english_pob_choice: Is it right for you to be angry
  chosen_korean: 네가 그렇게 화내는 것이 옳습니까
  alternatives_korean:
  - 네가 화내는 것이 옳습니까
  - 화내는 것이 네게 좋습니까
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 감정의 존재가 아니라 분노의 정당성/적절성을 묻기 때문에, 한국어에서는 ‘옳습니까’로 그 평가적 의미를 살렸습니다.
- source_word: הַ/קִּֽיקָיֹון
  english_pob_choice: the plant
  chosen_korean: 박넝쿨
  alternatives_korean:
  - 식물
  - 박
  - 기카욘
  lexicon: HALOT
  rationale: 식물의 정확한 종은 불확실하지만, 한국어 성경에서 널리 알려진 전통적 대응을 사용해 본문 의미를 자연스럽게 전달했습니다. 본문상의 불확실성은 각주로 보완했습니다.
- source_word: עַד מָוֶת
  english_pob_choice: even to death
  chosen_korean: 죽을 지경이 되기까지
  alternatives_korean:
  - 죽음에 이르기까지
  - 죽기까지
  - 죽음에 이를 정도로
  lexicon: HALOT
  rationale: 히브리어의 극단적 강조를 살리면서도, 한국어로는 ‘even to death’의 강도를 자연스럽게 나타내는 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 질문의 윤리적 의미
  chosen_reading: 질문을 ‘분노가 옳은가’라는 정당성의 문제로 번역했습니다.
  alternative_readings:
  - 단순히 ‘화내는 것이 좋습니까’로 번역하기
  - 직역형 ‘화내는 것이 잘합니까’로 번역하기
  rationale: 본문의 초점은 요나의 감정 자체가 아니라 그 분노의 정당성에 있으므로, 윤리적 대조가 분명히 드러나도록 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
