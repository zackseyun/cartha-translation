base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/011.yaml
  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
  footnotes:
  - marker: a
    text: Or, 'should I not spare Nineveh.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'do not know their right hand from their left' may refer specifically to young children or more generally to people lacking discernment.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 내가 그 큰 성 니느웨[a]를 아끼지 않겠느냐? 그 성에는 오른손과 왼손을 분간하지 못하는 사람이 십이만 명이 넘고[b], 가축도 많지 않으냐?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘니느웨를 불쌍히 여기지 않겠느냐.’
    reason: lexical_alternative
  - marker: b
    text: ‘오른손과 왼손을 분간하지 못하는’은 특히 어린아이를 가리키거나, 더 넓게는 분별력이 부족한 사람들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוּס
  english_pob_choice: have compassion
  chosen_korean: 아끼지 않겠느냐
  alternatives_korean:
  - 불쌍히 여기지 않겠느냐
  - 긍휼히 여기지 않겠느냐
  - 그냥 두지 않겠느냐
  lexicon: HALOT
  rationale: חוס는 ‘아끼다/불쌍히 여기다/남겨 두다’의 뜻을 가질 수 있습니다. 여기서는 파괴를 멈추는 차가운 ‘보호’보다, 하나님이 니느웨를 향해 품으시는 연민과 애정을 함께 드러내는 ‘아끼다’가 POB의 ‘have compassion’에 가장 가깝습니다.
- source_word: הָעִיר הַגְּדוֹלָה
  english_pob_choice: the great city
  chosen_korean: 저 큰 성
  alternatives_korean:
  - 그 큰 성
  - 큰 성
  - 저 위대한 성
  lexicon: HALOT
  rationale: גָּדוֹל은 단순한 크기만이 아니라 요나서에서 반복되는 ‘큰 성’의 문학적 강조를 담습니다. 한국어에서는 자연스러운 표지어 ‘저’와 함께 ‘큰 성’으로 옮겨, 거리감과 서술적 강조를 살렸습니다.
- source_word: אֲשֶׁר לֹא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ
  english_pob_choice: who do not know their right hand from their left
  chosen_korean: 오른손과 왼손을 분간하지 못하는 사람도
  alternatives_korean:
  - 오른손과 왼손을 구별하지 못하는 사람도
  - 오른쪽과 왼쪽을 분간하지 못하는 사람도
  - 분별하지 못하는 사람도
  lexicon: HALOT
  rationale: 원문의 관용구를 직역하기보다 한국어에서 자연스럽게 읽히는 표현으로 옮기되, ‘분간하지 못하는’으로 비유적·함축적 의미를 유지했습니다. POB가 보존한 해석상의 여지를 따라, 이 표현을 어린아이로 단정하지 않았습니다.
- source_word: וּבְהֵמָה רַבָּה
  english_pob_choice: and many animals
  chosen_korean: 가축도 많지 않으냐
  alternatives_korean:
  - 많은 동물도 있지 않으냐
  - 많은 짐승도 있지 않으냐
  - 가축도 많지 않느냐
  lexicon: HALOT
  rationale: בְּהֵמָה는 보통 가축/짐승을 가리키며, 여기서는 인간을 넘어선 피조물까지 포함하는 하나님의 관심을 강조합니다. 한국어에서는 ‘가축’이 문맥상 가장 자연스럽고, 놀라운 범위를 흐리지 않습니다.
theological_decisions:
- issue: ‘아끼다’와 ‘불쌍히 여기다’ 사이의 신학적 뉘앙스
  chosen_reading: 하나님의 감정적 연민과 파괴를 유보하는 뜻을 함께 담는 ‘아끼다’를 본문에 두고, 보다 직접적인 자비의 뉘앙스는 주석적 여지로 남깁니다.
  alternative_readings:
  - 불쌍히 여기지 않겠느냐
  - 긍휼히 여기지 않겠느냐
  - 구하지 않겠느냐
  rationale: 문맥상 하나님은 단지 법적 처분을 미루는 것이 아니라 니느웨를 향해 깊은 관심을 보이십니다. ‘아끼다’는 그 애정과 절제된 보존의 의미를 함께 전달하면서도, 원문의 긴장을 약화시키지 않습니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘오른손과 왼손을 분간하지 못하는 사람’의 지시 대상
  chosen_reading: 대상을 어린아이로 단정하지 않고 원문의 모호성을 유지합니다.
  alternative_readings:
  - 어린아이들
  - 도덕적·영적 분별이 없는 주민들
  rationale: 히브리어 관용구는 연령적 무지와 분별력 결핍 모두를 열어 둡니다. 번역이 그 해석적 여지를 닫아 버리기보다, 본문이 가진 애매함을 그대로 남기는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3
