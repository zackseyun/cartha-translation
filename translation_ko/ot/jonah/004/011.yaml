  - severity: low
    issue: ‘저 큰 성’의 ‘저’는 원문에 없는 거리 지시를 더합니다.
    rationale: 히브리어의 정관사는 특정성을 나타내며, 한국어에서는 ‘그 큰 성’이 이를 자연스럽게 나타내고 요나서의 반복 표현도 보존합니다.
  - severity: low
