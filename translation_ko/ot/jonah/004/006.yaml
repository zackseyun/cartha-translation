id: JON.4.6
reference: Jonah 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמַ֣ן יְהוָֽה אֱ֠לֹהִים קִיקָי֞וֹן וַ/יַּ֣עַל מֵ/עַ֣ל לְ/יוֹנָ֗ה לִֽ/הְי֥וֹת צֵל֙ עַל רֹאשׁ֔/וֹ לְ/הַצִּ֥יל ל֖/וֹ מֵ/רָֽעָת֑/וֹ וַ/יִּשְׂמַ֥ח יוֹנָ֛ה עַל הַ/קִּֽיקָי֖וֹן שִׂמְחָ֥ה גְדוֹלָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/006.yaml
  text: And Yahweh God appointed a qiqayon plant[a], and it grew up over Jonah to be a shade over his head, to deliver him from his discomfort. And Jonah rejoiced over the qiqayon plant with great joy.
  footnotes:
  - marker: a
    text: Hebrew qiqayon, a plant of uncertain identification; traditionally 'vine,' sometimes identified as a castor-oil plant.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 하나님께서 한 박넝쿨을 마련하셔서, 그것이 요나 위로 자라 올라와 그의 머리 위에 그늘이 되게 하시고 그를 그의 불편함에서 건져 주셨습니다. 요나는 그 박넝쿨 때문에 크게 기뻐했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 qiqayon은 정확한 식별이 확실하지 않은 식물 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  english_pob_choice: appointed
  chosen_korean: 마련하셔서
  alternatives_korean:
  - 정하셔서
  - 예비하셔서
  - 마련해 주셔서
  lexicon: HALOT
  rationale: 문맥상 야훼께서 주권적으로 식물을 ‘지정/배정’하시는 뜻을 살리되, 한국어에서는 사건의 흐름에 자연스러운 ‘마련하셔서’가 가장 가깝습니다.
- source_word: קִיקָיוֹן
  english_pob_choice: qiqayon plant
  chosen_korean: 박넝쿨
  alternatives_korean:
  - 기카욘 식물
  - 박식물
  - 캐스터오일 식물
  lexicon: HALOT
  rationale: 히브리어 식물명의 정확한 식별이 불확실하므로, 전통적이면서도 한국어 독자에게 읽히는 ‘박넝쿨’을 채택하되, 본문에서는 원어 특수성을 과도하게 확정하지 않았습니다.
- source_word: לְהַצִּיל לוֹ מֵרָעָתוֹ
  english_pob_choice: to deliver him from his discomfort
  chosen_korean: 그를 그의 불편함에서 건져 주셨습니다
  alternatives_korean:
  - 그를 그의 괴로움에서 구해 주셨습니다
  - 그를 그의 고통에서 건져 주셨습니다
  - 그를 그의 재난에서 구해 주셨습니다
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 ‘악’보다 요나가 겪는 현장적 불편/고통을 가리키므로, 그 긴장을 유지하면서도 자연스러운 ‘불편함’을 선택했습니다.
- source_word: וַיִּשְׂמַח ... שִׂמְחָה גְדוֹלָה
  english_pob_choice: rejoiced ... with great joy
  chosen_korean: 크게 기뻐했습니다
  alternatives_korean:
  - 매우 기뻐했습니다
  - 기뻐하며 크게 기뻐했습니다
  - 큰 기쁨으로 기뻐했습니다
  lexicon: HALOT
  rationale: 히브리어의 강조적 반복을 한국어에서는 중복이 과도해지지 않도록 간결하게 살리면서, ‘크게’로 강도를 반영했습니다.
theological_decisions:
- issue: יהוה אֱלֹהִים의 표기
  chosen_reading: 야훼 하나님
  alternative_readings:
  - 야훼 하나님께서
  - 주 하나님
  rationale: 본문이 여호와/주를 가리키는 것이 아니라 고유한 신명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 뒤의 אֱלֹהִים은 ‘하나님’으로 자연스럽게 결합했습니다.
  doctrine_reference: POB default on יְהוָה / YHWH → 야훼
