base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/001.yaml
  text: But it was greatly displeasing to Jonah[a], and he became angry.
  footnotes:
  - marker: a
    text: Literally, 'it was evil to Jonah, a great evil.' The Hebrew uses wordplay with 'evil/bad' to describe Jonah's reaction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그것은 요나에게 몹시 못마땅하였습니다.[a] 그래서 그는 화가 났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그것은 요나에게 큰 악이었다’입니다. 히브리어는 ‘악/나쁨’ 계열의 말을 반복하여 요나의 반응을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע / רָעָה
  english_pob_choice: was greatly displeasing
  chosen_korean: 크게 못마땅하였고
  alternatives_korean:
  - 크게 불쾌하였고
  - 크게 악하게 여겨졌고
  - 크게 싫어하였고
  lexicon: HALOT
  rationale: רעע/רָעָה의 ‘나쁘다/악하다’라는 직역보다, כאן에서 요나의 반응을 가리키는 관용적 의미를 살려 ‘못마땅하다’로 옮겼습니다.
- source_word: אֶל יוֹנָה
  english_pob_choice: to Jonah
  chosen_korean: 요나에게
  alternatives_korean:
  - 요나에게는
  - 요나 앞에
  - 요나의 눈에
  lexicon: HALOT
  rationale: אֶל은 여기서 대상 지시를 이루므로 한국어에서는 조사 ‘에게’로 자연스럽게 풀어 주었습니다.
- source_word: גְדוֹלָה
  english_pob_choice: greatly
  chosen_korean: 크게
  alternatives_korean:
  - 몹시
  - 대단히
  - 큰
  lexicon: HALOT
  rationale: ‘큰 악/큰 나쁨’이라는 히브리어의 중첩 효과를 한국어에서는 부사어 ‘크게’로 간결하게 반영했습니다.
- source_word: וַיִּחַר לוֹ
  english_pob_choice: he became angry
  chosen_korean: 그는 화가 났습니다
  alternatives_korean:
  - 그는 분노하였습니다
  - 그의 분노가 타올랐습니다
  - 그는 노했습니다
  lexicon: HALOT
  rationale: ‘그를 향해 타오르다’라는 관용을 현대 한국어의 직접적 표현인 ‘화가 났습니다’로 옮겼습니다.
theological_decisions:
- issue: 히브리어의 ‘악/나쁨’ 표현을 객관적 윤리판단으로 볼지, 요나의 주관적 반응으로 볼지
  chosen_reading: 요나의 주관적 불만과 분노를 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘요나에게 큰 악이었다’
  - ‘요나에게 큰 잘못으로 보였다’
  rationale: 본문은 하나님의 행동을 악이라고 판정하기보다, 요나가 그것을 어떻게 받아들였는지를 묘사합니다. 따라서 오독을 피하면서도 히브리어 말장난의 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 원문의 긴장을 해소하지 않고 보존하는 번역 원칙
- issue: 문장 첫머리의 וַ를 한국어로 어떻게 처리할지
  chosen_reading: 대조를 드러내는 ‘그러나’로 옮겼습니다.
  alternative_readings:
  - 그리고
  - 그런데
  rationale: 직전 문맥의 니느웨에 대한 하나님의 긍휼과 대비가 강하므로, 단순한 순차 접속사보다 ‘그러나’가 서사적 대비를 더 잘 드러냅니다.
  doctrine_reference: 문맥상 대조 접속사의 기능 보존
