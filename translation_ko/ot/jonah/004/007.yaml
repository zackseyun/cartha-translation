id: JON.4.7
reference: Jonah 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמַ֤ן הָֽ/אֱלֹהִים֙ תּוֹלַ֔עַת בַּ/עֲל֥וֹת הַ/שַּׁ֖חַר לַֽ/מָּחֳרָ֑ת וַ/תַּ֥ךְ אֶת הַ/קִּֽיקָי֖וֹן וַ/יִּיבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/007.yaml
  text: But God appointed a worm at the rising of dawn the next day[a], and it struck the plant so that it withered.
  footnotes:
  - marker: a
    text: Or 'the castor-oil plant'; the Hebrew term qiqayon refers to a specific plant, but its exact identification is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서는 다음 날 동틀 무렵 벌레 한 마리를 정하셨습니다. 그 벌레가 그 식물[a]을 상하게 하여, 그 식물이 시들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피마자나무’; 히브리어 ‘키카욘’은 특정 식물을 가리키지만, 정확히 어떤 식물인지는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן / appointed
  english_pob_choice: appointed
  chosen_korean: 지정하셨습니다
  alternatives_korean:
  - 임명하셨습니다
  - 예정하셨습니다
  - 보내셨습니다
  lexicon: HALOT
  rationale: מנה는 여기서 하나님이 벌레를 주권적으로 정하여 보내시는 뜻이므로, 단순한 허용보다 능동적 섭리를 살리는 ‘지정하셨습니다’가 가장 자연스럽습니다.
- source_word: תּוֹלַעַת / a worm
  english_pob_choice: a worm
  chosen_korean: 벌레 하나
  alternatives_korean:
  - 한 마리 벌레
  - 구더기 하나
  - 벌레
  lexicon: HALOT
  rationale: 히브리어는 특정 종을 밝히지 않으므로, 과도한 구체화를 피하면서도 문맥상 단수성을 드러내는 표현으로 옮겼습니다.
- source_word: בַּעֲלוֹת הַשַּׁחַר לַמָּחֳרָת / at the rising of dawn the next day
  english_pob_choice: at the rising of dawn the next day
  chosen_korean: 다음 날 새벽이 밝아올 때
  alternatives_korean:
  - 다음 날 새벽에
  - 새벽이 밝아오는 다음 날
  - 이튿날 동틀 무렵
  lexicon: HALOT
  rationale: 두 시간 표현을 한국어의 자연스러운 시간 흐름으로 합쳐, 새벽의 도래와 그 다음 날임을 함께 드러냈습니다.
- source_word: הַקִּיקָיוֹן / the plant
  english_pob_choice: the plant
  chosen_korean: 그 박넝쿨
  alternatives_korean:
  - 그 식물
  - 그 식물체
  - 그 식물인 기카욘
  lexicon: HALOT
  rationale: qiqayon의 정확한 식물명은 불확실하지만, 요나서 문맥에서 이미 자란 넝쿨성 식물을 가리키므로 한국어 독자에게 가장 자연스러운 ‘박넝쿨’을 택했습니다.
theological_decisions:
- issue: 하나님의 주권적 섭리
  chosen_reading: 하나님께서 벌레까지도 목적 있게 지정하셔서 요나의 상황을 주권적으로 전개하십니다.
  alternative_readings:
  - 하나님이 벌레가 나타나도록 허용하셨다
  - 단순한 자연 현상이 일어났다
  rationale: וַיְמַן은 요나서에서 반복되는 ‘하나님의 지정/배정’ 패턴의 일부이므로, 단순 허용으로 약화하지 않고 적극적 섭리를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
