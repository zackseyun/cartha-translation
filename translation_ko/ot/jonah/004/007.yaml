revisions:
- from: 그러나 하나님께서는 다음 날 새벽이 밝아올 때 벌레 하나를 지정하셨습니다. 그 벌레가 그 박넝쿨을 쳐서 시들게 했습니다.[a]
  to: 그러나 하나님께서는 다음 날 동틀 무렵 벌레 한 마리를 정하셨습니다. 그 벌레가 그 식물[a]을 상하게 하여, 그 식물이 시들었습니다.
  rationale: קִיקָיוֹן을 ‘박넝쿨’로 특정하지 않고 본문에서는 ‘그 식물’로 옮겨 어휘상의 불확실성을 보존했습니다. 하나님이 벌레를 적극적으로 마련하신다는 의미는 ‘정하셨습니다’로 유지했습니다. 벌레의 행위와 식물의 시듦을 한국어답게 연결하되, 원문의 타격/손상 및 결과 관계를 보존했습니다. 각주 표지는 불확실성이 있는 ‘식물’에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:55Z'
