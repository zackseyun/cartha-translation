source:
  edition: WLC
  text: וַ/יַּזְעֵ֗ק וַ/יֹּ֨אמֶר֙ בְּ/נִֽינְוֵ֔ה מִ/טַּ֧עַם הַ/מֶּ֛לֶךְ וּ/גְדֹלָ֖י/ו לֵ/אמֹ֑ר הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה הַ/בָּקָ֣ר וְ/הַ/צֹּ֗אן אַֽל יִטְעֲמוּ֙ מְא֔וּמָה אַ֨ל יִרְע֔וּ וּ/מַ֖יִם אַל יִשְׁתּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/007.yaml
  text: 'And he proclaimed and said in Nineveh[a], by decree of the king and his nobles: “Let neither man nor beast, herd nor flock, taste anything. Let them not graze[b], and let them not drink water.”'
  footnotes:
  - marker: a
    text: Or 'the king and his nobles' or 'the king and his officials.' The Hebrew literally says 'the king and his great ones.'
    reason: lexical_alternative
  - marker: b
    text: '''Man'' renders Hebrew adam here as a collective term for human beings, in contrast with animals; alternatively, ''humankind.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 니느웨에 선포하게 하고 이렇게 말했습니다. “왕과 그의 고관들의[a] 명령에 따라, 사람이나 짐승이나 소 떼나 양 떼나 아무것도 맛보지 못하게 하십시오. 풀을 뜯지 못하게 하고, 물도 마시지 못하게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘왕과 그의 큰 자들’이라고 합니다. 이는 왕 주변의 유력자나 고위자들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק וַיֹּאמֶר
  english_pob_choice: he proclaimed and said
  chosen_korean: 선포하고 말했습니다
  alternatives_korean:
  - 외치고 말했습니다
  - 공포하고 말했습니다
  lexicon: HALOT
  rationale: 공적 금식 칙령의 집행을 나타내므로, 단순한 '외치다'보다 공개적 발표를 드러내는 '선포하다'가 문맥에 더 정확합니다. '말했습니다'는 이어지는 직접 인용을 자연스럽게 받습니다.
- source_word: מִטַּעַם הַמֶּלֶךְ וּגְדֹלָיו
  english_pob_choice: by decree of the king and his great ones
  chosen_korean: 왕과 그의 귀인들의 칙령에 따라
  alternatives_korean:
  - 왕과 그의 큰 자들의 칙령에 따라
  - 왕과 그의 지도자들의 명령에 따라
  - 왕과 그의 대신들의 칙령에 따라
  lexicon: HALOT
  rationale: טַעַם은 행정·법정 맥락에서 공식 결정/칙령의 뜻이므로 '칙령'이 적절합니다. גְדֹלִים은 문자적으로 '큰 자들'이지만, 공적 문맥에서는 왕을 보좌하는 고위 인물들이므로 '귀인들'이 의미를 살립니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 이곳의 אָדָם은 짐승과 대조되는 집합적 의미이므로, 한국어에서는 성별을 드러내지 않는 '사람'이 본문 기능을 가장 자연스럽게 전달합니다. '인간'도 가능하지만 칙령 문체에서는 '사람'이 더 직접적입니다.
- source_word: הַבְּהֵמָה הַבָּקָר וְהַצֹּאן
  english_pob_choice: beast, herd nor flock
  chosen_korean: 짐승이나, 소 떼나 양 떼나
  alternatives_korean:
  - 가축이나, 소 떼나 양 떼나
  - 짐승이나, 가축이나 소 떼나 양 떼나
  lexicon: HALOT
  rationale: בהמה의 넓은 범위를 '짐승'으로 두고, 뒤따르는 구체 항목을 '소 떼'와 '양 떼'로 옮겨 히브리어의 점층적 열거를 살렸습니다. '떼'는 집합적 표현을 자연스럽게 전달합니다.
- source_word: אַ֨ל יִרְע֔וּ
  english_pob_choice: Let them not graze
  chosen_korean: 풀을 뜯지 못하게 하고
  alternatives_korean:
  - 먹이를 먹지 못하게 하고
  - 목초를 뜯지 못하게 하고
  lexicon: HALOT
  rationale: רעה의 가축 관련 의미는 '풀을 뜯다/먹이다'이지만, 한국어 칙령 문맥에서는 능동·금지형을 자연스럽게 살린 '풀을 뜯지 못하게 하다'가 가장 명료합니다.
theological_decisions:
- issue: אָדָם의 번역에서 성별 일반어와 집합적 의미의 균형
  chosen_reading: 사람
  alternative_readings:
