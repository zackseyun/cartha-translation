  terminology: ‘사람’, ‘짐승’, ‘소 떼’, ‘양 떼’, ‘맛보다’, ‘풀을 뜯다’는 적절합니다. גְדֹלִים에 대해서는 특정 신분제 용어로 확정하지 않고 ‘고관들’로 옮기며, 문자적 표현은 각주에서 보존합니다.
