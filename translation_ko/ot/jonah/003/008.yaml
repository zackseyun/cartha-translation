  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. ‘굵은 베옷을 입고’, ‘힘껏 부르짖게 하십시오’, ‘각 사람이 … 돌이키게 하십시오’는 각각 שַׂקִּים, בְּחָזְקָה, אִישׁ 및 שׁוּב의 의미와 명령적 선언의 성격을 잘 전달합니다. 다만 원문의 병렬된 청원/명령을 한국어에서 더 분명히 드러내려면 첫 절도 ‘입게 하고’로 처리하는 편이 안전합니다. ‘손에 있는 폭력’은 히브리어 관용상을 보존하는 적절한 번역입니다.
  naturalness: 현대 표준 한국어 합쇼체로 전반적으로 자연스럽지만, ‘입고, 하나님께 … 부르짖게 하십시오’는 첫 동작이 뒤 명령의 부수 상황처럼 읽힐 수 있습니다. ‘입게 하고, … 부르짖게 하십시오’가 선언문의 병렬 명령을 더 명확하고 자연스럽게 전달합니다. 또한 두 출처 구를 쉼표로 분리하기보다 ‘악한 길과 자기 손에 있는 폭력에서’로 묶는 것이 매끄럽습니다.
  terminology: ‘사람과 짐승’, ‘굵은 베옷’, ‘하나님’, ‘악한 길’, ‘폭력’, ‘돌이키다’는 모두 적절합니다. ‘돌이키다’는 שׁוּב의 구체적 은유를 보존하며 ‘회개하다’라는 해석적 신학 용어를 불필요하게 앞세우지 않습니다. 각주 표지는 현재 본문 끝에 한꺼번에 놓여 있어 각주 내용의 해당 어구를 식별할 수 없으므로, 각각 ‘힘껏 부르짖게’, ‘각 사람’, ‘악한 길’ 뒤에 배치해야 합니다.
