  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽ/אָדָם֙ וְ/הַ/בְּהֵמָ֔ה וְ/יִקְרְא֥וּ אֶל אֱלֹהִ֖ים בְּ/חָזְקָ֑ה וְ/יָשֻׁ֗בוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וּ/מִן הֶ/חָמָ֖ס אֲשֶׁ֥ר בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/008.yaml
  text: Let both man and beast be covered with sackcloth[a], and let them call out mightily to God[c][b], and let each man turn from his evil way and from the violence that is in their hands.
  footnotes:
  - marker: a
    text: Or 'cry out earnestly to God.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man'; the expression is distributive and refers to every person among the people.
    reason: lexical_alternative
  - marker: c
    text: Or 'from his wicked way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람과 짐승 모두 굵은 베옷을 입게 하고, 하나님께 힘껏 부르짖게 하십시오.[a] 또 각 사람이[b] 자기의 악한 길[c]과 자기 손에 있는 폭력에서 돌이키게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께 간절히 부르짖게 하십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘각 사람’입니다. 이 표현은 분배적이며 백성 가운데 모든 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기의 사악한 길’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְכַּסּוּ שַׂקִּים
  english_pob_choice: Let ... be covered with sackcloth
  chosen_korean: 굵은 베옷을 입고
  alternatives_korean:
  - 굵은 베옷으로 덮이고
  - 삼베옷을 입고
  lexicon: HALOT
  rationale: 히트파엘의 자기-덮음/입음 의미를 한국어에서는 자연스럽게 ‘입고’로 풀어, 회개의 상징 행위를 현대 문장으로 살렸습니다.
- source_word: הָאָדָם וְהַבְּהֵמָה
  english_pob_choice: man and beast
  chosen_korean: 사람과 짐승
  alternatives_korean:
  - 사람과 가축
  - 인간과 짐승
  lexicon: HALOT
  rationale: 사람/짐승의 대조를 그대로 살리되, 현대 한국어에서 덜 딱딱한 ‘사람’을 써서 집단적 선언의 성격을 유지했습니다.
- source_word: בְּחָזְקָה
  english_pob_choice: mightily
  chosen_korean: 힘껏
  alternatives_korean:
  - 간절히
  - 강하게
  lexicon: HALOT
  rationale: 부사적 강도를 나타내는 표현으로 ‘힘껏’이 가장 간결하게 원문의 강한 호소를 전달합니다.
- source_word: אִישׁ מִדַּרְכּוֹ
  english_pob_choice: each man turn
  chosen_korean: 각 사람이 … 돌이키게 하십시오
  alternatives_korean:
  - 각 남자가 … 돌이키게 하십시오
  - 모든 사람이 … 돌이키게 하십시오
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 한국어에서는 ‘각 사람’으로 옮겨 성별을 평준화하지 않으면서도 현대 독자가 이해하기 쉽게 했습니다.
- source_word: מִדַּרְכּוֹ הָרָעָה וּמִן הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם
  english_pob_choice: from his evil way and from the violence that is in their hands
  chosen_korean: 자기 악한 길에서, 자기 손에 있는 폭력에서
  alternatives_korean:
  - 그의 악한 길에서, 그들의 손에 있는 폭력에서
  - 자기 악한 행실과 손에 있는 폭력에서
  lexicon: HALOT
  rationale: ‘길’은 जीवन/행동 양식을 가리키는 히브리어 은유를 보존하고, ‘손에 있는’은 בכפיהם의 관용적 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 돌이키다의 번역
  chosen_reading: ‘repent/return’ 대신 ‘돌이키다’로 옮겼습니다.
  alternative_readings:
  - 회개하다
  - 돌아오다
  rationale: שׁוּב의 기본적 의미인 ‘돌아서다/되돌아가다’를 유지해, 회개를 뜻하되 그보다 좁은 신학 용어로 미리 규정하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 아담/이쉬의 대표적 복수성
  chosen_reading: ‘사람’, ‘각 사람’으로 옮겨 남성형의 대표성을 유지했습니다.
  alternative_readings:
  - 인류
  - 각자
  - 모든 사람
  rationale: 본문은 짐승과의 대조 속에서 인간 전체를 대표하는 남성형을 사용하므로, 성중립적 평준화보다 원문 구조를 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §4; Contested terms table for אָדָם
