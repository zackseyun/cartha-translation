id: JON.3.6
reference: Jonah 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגַּ֤ע הַ/דָּבָר֙ אֶל מֶ֣לֶך נִֽינְוֵ֔ה וַ/יָּ֨קָם֙ מִ/כִּסְא֔/וֹ וַ/יַּעֲבֵ֥ר אַדַּרְתּ֖/וֹ מֵֽ/עָלָ֑י/ו וַ/יְכַ֣ס שַׂ֔ק וַ/יֵּ֖שֶׁב עַל הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/006.yaml
  text: When the message reached the king of Nineveh[a], he rose from his throne, removed his robe, covered himself with sackcloth[c][b], and sat in the ashes.
  footnotes:
  - marker: a
    text: Or 'the matter' or 'the report' reached the king of Nineveh.
    reason: lexical_alternative
  - marker: b
    text: Or 'removed his mantle.' The Hebrew term can refer to a distinguished outer garment.
    reason: lexical_alternative
  - marker: c
    text: Literally 'sat on the ash/ashes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 니느웨 왕에게 그 소식이 닿자, 그는 왕좌에서 일어나 겉옷을 벗고 자루옷을 입은 뒤 재 위에 앉았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소식’으로 옮겼지만, 히브리어는 ‘그 일’ 또는 ‘그 보고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘겉옷’은 더 지위가 있는 바깥옷, 곧 ‘망토’나 ‘외투’를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘재 위에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע הַדָּבָר
  english_pob_choice: When the message reached
  chosen_korean: 그 소식이 닿자
  alternatives_korean:
  - 그 일이 왕에게 이르자
  - 그 메시지가 왕에게 도착하자
  - 그 말이 왕에게 전해지자
  lexicon: HALOT
  rationale: דָּבָר는 여기서 ‘일/말’보다 왕에게 전달된 소식의 성격이 분명하므로 ‘소식’이 자연스럽고, נגע의 접촉·도달 뉘앙스를 살려 ‘닿다’로 옮겼습니다.
- source_word: מֶלֶךְ נִינְוֵה
  english_pob_choice: the king of Nineveh
  chosen_korean: 니느웨 왕
  alternatives_korean:
  - 니느웨의 왕
  - 니느웨의 왕이
  lexicon: HALOT
  rationale: 히브리어의 소유격 관계를 한국어 왕호 구문으로 자연스럽게 압축해 ‘니느웨 왕’으로 옮겼습니다.
- source_word: מִכִּסְאוֹ
  english_pob_choice: from his throne
  chosen_korean: 왕좌에서
  alternatives_korean:
  - 보좌에서
  - 자리에서
  lexicon: HALOT
  rationale: כסא는 왕의 자리이므로 단순 ‘자리’보다 위엄과 자기 낮춤이 드러나는 ‘왕좌’가 적절합니다.
- source_word: אַדַּרְתּוֹ
  english_pob_choice: his robe
  chosen_korean: 겉옷
  alternatives_korean:
  - 망토
  - 외투
  - 예복
  lexicon: HALOT
  rationale: אַדֶּרֶת는 두드러진 바깥옷을 가리킬 수 있으므로, 예복처럼 지나치게 의례화하지 않으면서 ‘겉옷’이 가장 무난하고 본문의 낮춤 동작도 잘 드러냅니다.
- source_word: שַׂק
  english_pob_choice: sackcloth
  chosen_korean: 자루옷
  alternatives_korean:
  - 굵은 베옷
  - 애통의 옷
  - 거친 베
  lexicon: HALOT
  rationale: שַׂק은 애통과 회개의 거친 옷이므로 전통적 의미를 유지하면서도 본문 이미지를 살리는 ‘자루옷’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 겸비 행위의 표현 수위
  chosen_reading: 본문의 동작들을 그대로 서술하고, 회개를 해설적으로 덧붙이지 않았습니다.
  alternative_readings:
  - 그가 회개했다고 명시하기
  - 겸비와 금식을 해설적으로 강조하기
  rationale: 이 절은 왕의 상징적 행동을 보여 주지만, 번역은 본문이 직접 말하는 행동 자체를 유지하는 것이 소스에 더 충실합니다.
  doctrine_reference: '번역 원칙: 본문이 명시하지 않은 신학적 해석을 본문에 주입하지 않는다.'
