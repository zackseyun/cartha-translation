  rationale: 본문이 신적 고유명 יְהוָה를 직접 사용하므로, POB 기준에 따라 호칭 대체보다 음역인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
