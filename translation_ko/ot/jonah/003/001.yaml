  yaml_path: translation/ot/jonah/003/001.yaml
  text: Then the word of Yahweh came to Jonah a second time[a], saying,
  footnotes:
  - marker: a
    text: Or 'again' for 'a second time.' The Hebrew explicitly marks repetition after Jonah's earlier commission.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 말씀이 요나에게 두 번째로 임하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시’. 히브리어는 요나에게 이전에 주어진 소명이 반복됨을 분명히 표시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 있었습니다
  - 그리하여 ... 이르렀습니다
  - 그때 ... 오셨습니다
  lexicon: HALOT
  rationale: 서사 진행을 여는 관용구로, 한국어에서는 단순한 사건 연결보다 ‘그때’와 ‘임하여’가 예언자적 공식의 흐름을 자연스럽게 살립니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언서의 표준 공식인 ‘말씀’을 살리되, 본문이 지닌 하나님의 개인적 이름을 따라 ‘야훼’로 옮겼습니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 거듭
  - 둘째 번으로
  lexicon: HALOT
  rationale: 히브리어가 앞선 소명을 전제한 반복을 분명히 표시하므로, 단순 ‘다시’보다 ‘두 번째로’가 반복의 수치를 더 직접적으로 드러냅니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  - 말씀하여
  lexicon: HALOT
  rationale: 다음 절의 직접 화법을 여는 도입이므로, 한국어에서는 독립된 서술동사로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신적 고유명 יְהוָה를 직접 사용하므로, POB 기준에 따라 호칭 대체보다 음역인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
