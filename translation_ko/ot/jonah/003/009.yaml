id: JON.3.9
reference: Jonah 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יוֹדֵ֣עַ יָשׁ֔וּב וְ/נִחַ֖ם הָ/אֱלֹהִ֑ים וְ/שָׁ֛ב מֵ/חֲר֥וֹן אַפּ֖/וֹ וְ/לֹ֥א נֹאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/009.yaml
  text: Who knows? God may turn and relent[a], and turn from the burning of his anger[b], so that we do not perish.
  footnotes:
  - marker: a
    text: Or 'turn back from his fierce anger.' The Hebrew literally speaks of 'the burning of his anger.'
    reason: lexical_alternative
  - marker: b
    text: '''Relent'' could also be rendered ''change his mind'' or ''be sorry,'' but here it refers to God withholding threatened judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 「누가 알겠습니까? 하나님께서 돌이키시고 뜻을 돌이키실지, 그리고 자기의 타오르는 진노에서 돌이키셔서 우리가 멸망하지 않을지 누가 알겠습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진노’는 히브리어 ‘얼굴/코’와 연결된 관용구를 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘뜻을 돌이키시다’는 여기서 하나님이 선포하신 심판을 거두시는 뜻의 변화를 가리킬 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  english_pob_choice: Who knows?
  chosen_korean: 누가 알겠습니까?
  alternatives_korean:
  - 혹시
  - 누가 알겠습니까
  lexicon: HALOT
  rationale: 히브리어 수사 의문문이 불확실하지만 희망을 품은 호소를 나타내므로, 자연스러운 현대 한국어의 수사 질문으로 살렸습니다.
- source_word: יָשׁוּב וְנִחַם
  english_pob_choice: may turn and relent
  chosen_korean: 돌이키시고 뜻을 돌이키실지
  alternatives_korean:
  - 돌이키시고 완화하실지
  - 돌이키시고 마음을 돌이키실지
  - 돌이키시고 뜻을 바꾸실지
  lexicon: HALOT
  rationale: שוב과 נחם의 연속을 각각 살리되, נחם을 하나님의 선포된 심판을 거두시는 뜻의 변화로 이해하여 ‘뜻을 돌이키시다’로 옮겼습니다.
- source_word: מֵחֲרוֹן אַפּוֹ
  english_pob_choice: from the burning of his anger
  chosen_korean: 자기의 타오르는 진노에서
  alternatives_korean:
  - 자기의 불타는 진노에서
  - 자기의 맹렬한 진노에서
  - 자기의 뜨거운 진노에서
  lexicon: HALOT
  rationale: 직역상 ‘진노의 타오름/불탐’이라는 이미지를 보존하기 위해 ‘타오르는 진노’로 옮겼습니다. POB의 ‘burning’ 이미지를 한국어로 드러냅니다.
- source_word: וְלֹא נֹאבֵד
  english_pob_choice: so that we do not perish
  chosen_korean: 우리가 멸망하지 않을지
  alternatives_korean:
  - 우리가 죽지 않을지
  - 우리가 망하지 않을지
  - 그래서 우리가 멸망하지 않게 하실지
  lexicon: HALOT
  rationale: 결과절의 희망을 한국어 자연문으로 표현하면서도, נבד의 강한 종말적 결과를 ‘멸망하다’로 보존했습니다.
theological_decisions:
- issue: 하나님의 נחם(‘relent’)을 어떻게 드러낼지
  chosen_reading: ‘뜻을 돌이키시다’로 번역해 하나님이 경고된 심판을 거두실 가능성을 말하게 했습니다.
  alternative_readings:
  - ‘마음을 바꾸시다’
  - ‘후회하시다’
  - ‘유감으로 여기시다’
  rationale: 이 본문은 니느웨 사람들의 희망 섞인 발언으로서 하나님의 응답 가능성을 말합니다. ‘뜻을 돌이키시다’는 하나님이 실수했다는 뜻으로 오해되지 않으면서도, 본문이 보존하는 신적 응답성과 긴장을 유지합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
