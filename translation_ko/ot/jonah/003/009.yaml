id: JON.3.9
reference: Jonah 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יוֹדֵ֣עַ יָשׁ֔וּב וְ/נִחַ֖ם הָ/אֱלֹהִ֑ים וְ/שָׁ֛ב מֵ/חֲר֥וֹן אַפּ֖/וֹ וְ/לֹ֥א נֹאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/009.yaml
  text: Who knows? God may turn and relent[a], and turn from the burning of his anger[b], so that we do not perish.
  footnotes:
  - marker: a
    text: Or 'turn back from his fierce anger.' The Hebrew literally speaks of 'the burning of his anger.'
    reason: lexical_alternative
  - marker: b
    text: '''Relent'' could also be rendered ''change his mind'' or ''be sorry,'' but here it refers to God withholding threatened judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 「누가 알겠습니까? 하나님께서 돌이키시고 뜻을 거두시며[b], 자신의 타오르는 진노에서 돌이키셔서[a] 우리가 멸망하지 않게 하실지도 모릅니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘타오르는 진노’는 문자적으로 ‘그의 코의 타오름’이라는 히브리어 관용구를 반영하며, 맹렬한 진노를 뜻합니다.
    reason: source_note
  - marker: b
    text: ‘뜻을 거두시다’는 히브리어 동사로, 여기서는 하나님께서 선포하신 심판을 거두실 수 있음을 뜻합니다. ‘마음을 바꾸시다’ 또는 ‘누그러지시다’로도 옮길 수 있습니다.
    reason: theological_note
lexical_decisions:
