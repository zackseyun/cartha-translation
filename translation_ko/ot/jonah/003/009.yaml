  - 자기의 뜨거운 진노에서
  lexicon: HALOT
  rationale: 직역상 ‘진노의 타오름/불탐’이라는 이미지를 보존하기 위해 ‘타오르는 진노’로 옮겼습니다. POB의 ‘burning’ 이미지를 한국어로 드러냅니다.
- source_word: וְלֹא נֹאבֵד
  english_pob_choice: so that we do not perish
  chosen_korean: 우리가 멸망하지 않을지
  alternatives_korean:
  - 우리가 죽지 않을지
  - 우리가 망하지 않을지
  - 그래서 우리가 멸망하지 않게 하실지
  lexicon: HALOT
  rationale: 결과절의 희망을 한국어 자연문으로 표현하면서도, נבד의 강한 종말적 결과를 ‘멸망하다’로 보존했습니다.
theological_decisions:
- issue: 하나님의 נחם(‘relent’)을 어떻게 드러낼지
  chosen_reading: ‘뜻을 돌이키시다’로 번역해 하나님이 경고된 심판을 거두실 가능성을 말하게 했습니다.
  alternative_readings:
  - ‘마음을 바꾸시다’
  - ‘후회하시다’
  - ‘유감으로 여기시다’
  rationale: 이 본문은 니느웨 사람들의 희망 섞인 발언으로서 하나님의 응답 가능성을 말합니다. ‘뜻을 돌이키시다’는 하나님이 실수했다는 뜻으로 오해되지 않으면서도, 본문이 보존하는 신적 응답성과 긴장을 유지합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
