  lexicon: HALOT
  rationale: שוב과 נחם의 연속을 각각 살리되, נחם을 하나님의 선포된 심판을 거두시는 뜻의 변화로 이해하여 ‘뜻을 돌이키시다’로 옮겼습니다.
- source_word: מֵחֲרוֹן אַפּוֹ
  english_pob_choice: from the burning of his anger
  chosen_korean: 자기의 타오르는 진노에서
  alternatives_korean:
  - 자기의 불타는 진노에서
