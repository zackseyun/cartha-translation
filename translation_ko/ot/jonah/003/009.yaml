  lexicon: HALOT
  rationale: 히브리어 수사 의문문이 불확실하지만 희망을 품은 호소를 나타내므로, 자연스러운 현대 한국어의 수사 질문으로 살렸습니다.
- source_word: יָשׁוּב וְנִחַם
  english_pob_choice: may turn and relent
  chosen_korean: 돌이키시고 뜻을 돌이키실지
