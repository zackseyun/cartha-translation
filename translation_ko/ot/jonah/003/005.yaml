source:
  edition: WLC
  text: וַֽ/יַּאֲמִ֛ינוּ אַנְשֵׁ֥י נִֽינְוֵ֖ה בֵּֽ/אלֹהִ֑ים וַ/יִּקְרְאוּ צוֹם֙ וַ/יִּלְבְּשׁ֣וּ שַׂקִּ֔ים מִ/גְּדוֹלָ֖/ם וְ/עַד קְטַנָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/005.yaml
  text: And the people of Nineveh believed God[a], and they proclaimed a fast and put on sackcloth, from their greatest to their least.
  footnotes:
  - marker: a
    text: Or 'believed in God.' The Hebrew construction can express trusting in God as well as believing God.
    reason: lexical_alternative
translation:
  language: ko
  text: 니느웨 사람들은 하나님을 믿었습니다[a]. 그들은 금식을 선포하고, 높은 사람부터 낮은 사람까지 굵은 베옷을 입었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 신뢰했습니다.’ 히브리어 표현은 하나님을 믿는다는 뜻과 하나님을 신뢰한다는 뜻을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ ... בֵּאלֹהִים
  english_pob_choice: believed God
  chosen_korean: 하나님을 믿었습니다
  alternatives_korean:
  - 하나님을 믿었습니다
  - 하나님을 신뢰했습니다
  lexicon: HALOT
  rationale: אמן + ב는 여기서 ‘믿다/신뢰하다’의 뜻을 가지므로, 한국어에서는 가장 자연스럽고 직접적인 ‘하나님을 믿었습니다’로 옮겨 원문의 단정성을 유지했습니다.
- source_word: אַנְשֵׁי נִינְוֵה
  english_pob_choice: the people of Nineveh
  chosen_korean: 니느웨 사람들
  alternatives_korean:
  - 니느웨의 사람들
  - 니느웨 시민들
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘~의 사람들’이지만, 문맥상 도시 전체의 집단을 가리키므로 한국어에서는 자연스럽게 ‘니느웨 사람들’로 처리했습니다.
- source_word: וַיִּקְרְאוּ צוֹם
  english_pob_choice: they proclaimed a fast
  chosen_korean: 금식을 선포하고
  alternatives_korean:
  - 금식을 공포하고
  - 금식을 선언하고
  lexicon: HALOT
  rationale: קרא + צום은 공동체적 금식을 공식적으로 알리는 행위이므로, 현대 한국어에서 공적인 선언성을 살리는 ‘금식을 선포하다’가 적절합니다.
- source_word: וַיִּלְבְּשׁוּ שַׂקִּים
  english_pob_choice: put on sackcloth
  chosen_korean: 굵은베를 입었습니다
  alternatives_korean:
  - 베옷을 입었습니다
  - 삼베옷을 입었습니다
  lexicon: HALOT
  rationale: שַׂקִּים은 회개의 상징인 거친 옷을 가리키므로, 한국어 성경에서 통용되면서도 직역성이 있는 ‘굵은베’로 옮겼습니다.
- source_word: מִגְּדוֹלָם וְעַד קְטַנָּם
  english_pob_choice: from their greatest to their least
  chosen_korean: 가장 큰 사람부터 가장 작은 사람까지
  alternatives_korean:
  - 큰 사람부터 작은 사람까지
  - 높은 사람부터 낮은 사람까지
  lexicon: HALOT
  rationale: 이 표현은 사회적·연령적 전체 범위를 나타내는 머리카락법이므로, 위계의 폭을 살리면서도 현대 한국어에서 분명한 ‘가장 큰 사람부터 가장 작은 사람까지’로 옮겼습니다.
theological_decisions:
- issue: 니느웨의 반응을 믿음으로만 제시할지, 회개를 확장해 넣을지
  chosen_reading: 본문이 직접 말하는 ‘믿음’과 금식, 굵은베 착용만을 제시하고 회개나 구원론적 확장을 덧붙이지 않았습니다.
  alternative_readings:
  - 회개했습니다
  - 하나님께로 돌이켰습니다
  - 구원하는 믿음을 보였습니다
  rationale: 이 절은 반응의 형태를 나열할 뿐이므로, 본문이 말하지 않는 신학적 결론을 번역문에 미리 주입하지 않는 것이 source-grounded 원칙에 맞습니다.
  doctrine_reference: Translation philosophy items 1 and 3
