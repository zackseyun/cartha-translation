id: JON.3.3
reference: Jonah 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣קָם יוֹנָ֗ה וַ/יֵּ֛לֶךְ אֶל נִֽינְוֶ֖ה כִּ/דְבַ֣ר יְהוָ֑ה וְ/נִֽינְוֵ֗ה הָיְתָ֤ה עִיר גְּדוֹלָה֙ לֵֽ/אלֹהִ֔ים מַהֲלַ֖ךְ שְׁלֹ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/003.yaml
  text: So Jonah arose and went to Nineveh[a], according to the word of Yahweh. Now Nineveh was an exceedingly great city before God[b], a journey of three days.
  footnotes:
  - marker: a
    text: Or 'an exceedingly great city'; the Hebrew literally says 'a great city to/before God,' an idiom that may express superlative greatness.
    reason: alternative_reading
  - marker: b
    text: Or 'three days' journey.' The phrase may describe the time needed to traverse the city or to complete a visit through it.
    reason: lexical_alternative
translation:
  language: ko
  text: 요나는 일어나 야훼의 말씀대로 니느웨로 갔습니다. 니느웨는 하나님 앞에서 매우 큰 성읍이었고,[a] 사흘 길이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께 큰 성읍”이라고 옮길 수 있습니다. 히브리어는 문자적으로 “하나님께 큰 성읍”이라고 하며, 이 표현은 “매우 큰 성읍”이라는 최상급의 뜻을 나타내는 관용구일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “삼 일 길”입니다. 이 표현은 성읍을 가로지르는 데 걸리는 시간이나 성읍을 두루 방문하는 데 필요한 시간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 몸을 일으켜
  lexicon: HALOT
  rationale: 서사적 연속성을 살리면서 גם 행위의 즉각성을 간결하게 드러내는 표준어 표현입니다.
- source_word: וַיֵּלֶךְ אֶל נִינְוֶה
  english_pob_choice: went to Nineveh
  chosen_korean: 니느웨로 갔습니다
  alternatives_korean:
  - 니느웨로 떠났습니다
  - 니느웨에 갔습니다
  lexicon: HALOT
  rationale: הלך의 기본 의미를 가장 직접적으로 옮기되, 목적지를 나타내는 조사로 자연스러운 현대 한국어를 만들었습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로였습니다
  alternatives_korean:
  - 야훼의 말씀에 따라였습니다
  - 야훼께서 말씀하신 대로였습니다
  lexicon: HALOT
  rationale: כִּדְבַר의 순응·일치 의미를 '…대로'로 간결하게 살리고, יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: עִיר גְּדוֹלָה לֵאלֹהִים
  english_pob_choice: an exceedingly great city before God
  chosen_korean: 하나님 앞에서 매우 큰 성읍이었으며
  alternatives_korean:
  - 하나님께 매우 큰 성읍이었으며
  - 하나님 앞에 매우 큰 성읍이었으며
  lexicon: HALOT
  rationale: לֵאלֹהִים의 직역 가능성인 '하나님께/앞에'를 살리면서, 본문이 담은 '하나님 앞에서'의 평가·기준 뉘앙스를 유지했습니다.
- source_word: מַהֲלַךְ שְׁלֹשֶׁת יָמִים
  english_pob_choice: a journey of three days
  chosen_korean: 삼 일 길이었습니다
  alternatives_korean:
  - 삼 일 걸리는 길이었습니다
  - 사흘 길이었습니다
  lexicon: HALOT
  rationale: מַהֲלַךְ은 '길이/여정'의 범위를 나타내므로, 시간이나 둘레를 특정하지 않고 한국어 관용으로 간명하게 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 고유명사로서 '야훼'를 본문에 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 여호와/야훼의 신명 자체가 직접 나타나므로, 칭호로 바꾸지 않고 음역을 유지해 본문의 인격적·계약적 호칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: לֵאלֹהִים의 슈퍼라티브와 하나님 언어 동시 보존
  chosen_reading: '''하나님 앞에서 매우 큰 성읍''으로 옮겨, 하나님 언어를 지우지 않으면서 과장의 뉘앙스를 살렸습니다.'
  alternative_readings:
  - '''매우 큰 성읍''만 제시'
  - '''하나님께 큰 성읍'''
  rationale: 히브리어는 단순한 형용사보다 하나님을 직접 포함한 평가 구조를 가지므로, 이를 본문에 유지해 독자가 신학적 긴장을 볼 수 있게 했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
