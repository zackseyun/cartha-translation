source:
  edition: WLC
  text: וַ/יָּ֤חֶל יוֹנָה֙ לָ/ב֣וֹא בָ/עִ֔יר מַהֲלַ֖ךְ י֣וֹם אֶחָ֑ד וַ/יִּקְרָא֙ וַ/יֹּאמַ֔ר ע֚וֹד אַרְבָּעִ֣ים י֔וֹם וְ/נִֽינְוֵ֖ה נֶהְפָּֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/004.yaml
  text: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
  footnotes:
  - marker: a
    text: Or 'Forty more days' or 'In forty days.' The Hebrew expression marks the remaining time before the announced event.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be overthrown.' The Hebrew verb can mean 'be overturned/overthrown,' allowing both the sense of judgment and the broader idea of reversal.
    reason: alternative_reading
translation:
  language: ko
  text: 요나는 성읍 안으로 들어가기 시작하여 하루 길을 간 뒤, 외쳐 말했습니다. “사십 일이 더 지나면[a], 니느웨가 뒤집힐 것입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사십 일이 더 남았다’, ‘사십 일 안에’. 히브리어 표현은 선포된 사건이 일어나기까지 남은 시간을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전복될 것입니다’. 히브리어 동사는 심판으로 말미암은 전복을 뜻할 수 있으며, 더 넓게는 뒤바뀜의 의미도 허용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל לָבוֹא
  english_pob_choice: began to go into
  chosen_korean: 들어가기 시작하여
  alternatives_korean:
  - 들어가기를 시작하여
  - 성읍 안으로 들어가기 시작하여
  lexicon: HALOT
  rationale: 히필 동사와 부정사 결합이 행동의 개시를 나타내므로, 한국어도 ‘-기 시작하여’로 자연스럽게 살렸습니다.
- source_word: בָעִיר מַהֲלַךְ יוֹם אֶחָד
  english_pob_choice: a day's journey
  chosen_korean: 한나절 길
  alternatives_korean:
  - 하루 길
  - 하루 여정
  lexicon: HALOT
  rationale: 문맥상 성읍 안에서의 이동 거리 표현이므로, ‘한나절 길’은 관용성을 살리면서도 원문의 거리 감각을 간결하게 전달합니다.
- source_word: וַיִּקְרָא וַיֹּאמַר
  english_pob_choice: he cried out and said
  chosen_korean: 외쳐 말했습니다
  alternatives_korean:
  - 크게 외치며 말했습니다
  - 외쳐서 말했습니다
  lexicon: HALOT
  rationale: 두 동사의 연속을 한국어에서 과도하게 중복하지 않으면서, 공적 선포의 긴박함과 음성성을 보존했습니다.
- source_word: עוֹד אַרְבָּעִים יוֹם
  english_pob_choice: Yet forty days
  chosen_korean: 아직 사십 일이 지나면
  alternatives_korean:
  - 사십 일이 더 지나면
  - 아직 사십 일이 남으면
  lexicon: HALOT
  rationale: עוֹד의 ‘남아 있는 시간’ 감각을 살리기 위해 ‘아직 … 지나면’으로 옮겨, 단순한 기한 통보보다 카운트다운의 뉘앙스를 유지했습니다.
- source_word: נֶהְפָּכֶת
  english_pob_choice: will be overturned
  chosen_korean: 뒤집힐 것입니다
  alternatives_korean:
  - 뒤엎어질 것입니다
  - 전복될 것입니다
  - 무너질 것입니다
  lexicon: HALOT
  rationale: נָהַפְךְ의 기본 의미인 ‘뒤집히다/뒤바뀌다’를 살려, 심판의 파괴성과 반전 가능성을 함께 남겼습니다. ‘전복되다’는 정치적 뉘앙스가 강하고, ‘무너지다’는 의미를 좁힐 수 있습니다.
theological_decisions:
- issue: 나인베의 미래를 나타내는 נֶהְפָּכֶת의 의미 범위
  chosen_reading: ‘뒤집힐 것입니다’로 번역해 심판과 반전의 가능성을 함께 남깁니다.
  alternative_readings:
  - ‘전복될 것입니다’
  - ‘무너질 것입니다’
  rationale: 요나서의 문학적 문맥에서 이 동사는 단순 파괴뿐 아니라 뒤집힘/전환의 여지를 포함하므로, 한국어도 그 긴장을 해소하지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3 (source-preserved ambiguity)
