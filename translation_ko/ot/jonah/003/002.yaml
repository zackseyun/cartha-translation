id: JON.3.2
reference: Jonah 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֛וּם לֵ֥ךְ אֶל נִֽינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה וִּ/קְרָ֤א אֵלֶ֨י/הָ֙ אֶת הַ/קְּרִיאָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/002.yaml
  text: Arise[a], go to Nineveh, the great city, and proclaim to it the proclamation that I speak to you.
  footnotes:
  - marker: a
    text: Or 'cry out against it.' Jonah 1:2 uses 'against,' but here the Hebrew says 'to it,' so the main text preserves the wording of this verse.
    reason: alternative_reading
translation:
  language: ko
  text: 일어나서 큰 성 니느웨로 가서, 내가 네게 말하는 그 선포를 그 성에 선포하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 성을 향하여 외치십시오.’ 1장 2절에서는 히브리어 전치사 עַל이 ‘…을 거슬러’라는 뜻으로 쓰였지만, 여기서는 אֶל이 ‘…에/…을 향하여’라는 뜻으로 쓰였습니다. 그러므로 본문은 이 절의 표현을 따릅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֛וּם
  english_pob_choice: Arise
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나
  - 깨어나서
  lexicon: HALOT
  rationale: קוּם의 명령형은 단순한 기상보다 긴박한 행동 개시를 뜻하므로, 합쇼체 문맥에서 ‘일어나서’가 ‘Arise’의 격식과 촉구를 가장 잘 살립니다.
- source_word: נִֽינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה
  english_pob_choice: Nineveh, the great city
  chosen_korean: 큰 성 니느웨
  alternatives_korean:
  - 위대한 성 니느웨
  - 큰 도시 니느웨
  lexicon: HALOT
  rationale: גָּדוֹל은 규모와 위대함을 모두 담을 수 있어, 요나서의 반복 표현을 살리면서도 자연스러운 현대 한국어로 ‘큰 성’이라 옮겼습니다.
- source_word: וִּ/קְרָ֤א אֵלֶ֨י/הָ֙
  english_pob_choice: proclaim to it
  chosen_korean: 그 성에 선포하십시오
  alternatives_korean:
  - 그 성에게 외치십시오
  - 그 성에 외쳐 알리십시오
  lexicon: HALOT
  rationale: 이 절은 1:2의 ‘against’가 아니라 ‘to it’이므로, 적대적 뉘앙스를 덧씌우지 않고 공적 전달을 드러내는 ‘선포하다’로 옮겼습니다.
- source_word: אֶת הַ/קְּרִיאָ֔ה
  english_pob_choice: the proclamation
  chosen_korean: 그 선포
  alternatives_korean:
  - 그 말씀
  - 그 외침
  - 그 선포의 말씀
  lexicon: HALOT
  rationale: קְרִיאָה는 קרא와 연결된 ‘선포/외침’의 명사이므로, 동사와 어근 상응을 살려 ‘선포’로 번역했습니다.
- source_word: אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ
  english_pob_choice: that I speak to you
  chosen_korean: 내가 네게 말하는
  alternatives_korean:
  - 내가 네게 말할
  - 내가 너에게 말씀하는
  lexicon: HALOT
  rationale: דבר עם/אל은 ‘말하다’의 지속적·진행적 의미가 있어, 문맥상 지시 내용이 아직 전달 중임을 드러내는 ‘내가 네게 말하는’이 가장 가깝습니다.
theological_decisions:
- issue: אלֶיהָ의 방향성
  chosen_reading: 선포 대상을 ‘그 성’으로 유지하고 ‘대하여/against’를 넣지 않았습니다.
  alternative_readings:
  - 그 성을 향하여 선포하십시오
  - 그 성에 대하여 선포하십시오
  rationale: 히브리어 전치사 אֶל은 여기서 ‘to’이므로, 1:2의 대립적 표현을 본문에 되돌려 넣지 않고 요나서가 의도한 미묘한 차이를 보존했습니다.
  doctrine_reference: 본문의 어조와 방향성을 과잉 해석하지 않고 source-directed tension을 유지합니다.
