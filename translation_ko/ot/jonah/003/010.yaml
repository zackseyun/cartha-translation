revisions:
- from: 하나님께서 그들의 행위를 보시고, 그들이 자기들의 악한 길에서 돌아선 것을 보시자, 하나님께서는 그들에게 내리기로 말씀하신 재앙을 거두시고, 그 일을 행하지 않으셨습니다.[a][b]
  to: 하나님께서는 그들의 행위, 곧 그들이 자기들의 악한 길에서 돌아선 것을 보시고, 그들에게 내리겠다고 말씀하신 재앙에 대하여 뜻을 돌이키시고, 그것을 행하지 않으셨습니다.[a][b]
