id: JON.3.10
reference: Jonah 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤רְא הָֽ/אֱלֹהִים֙ אֶֽת מַ֣עֲשֵׂי/הֶ֔ם כִּי שָׁ֖בוּ מִ/דַּרְכָּ֣/ם הָ/רָעָ֑ה וַ/יִּנָּ֣חֶם הָ/אֱלֹהִ֗ים עַל הָ/רָעָ֛ה אֲשֶׁר דִּבֶּ֥ר לַ/עֲשׂוֹת לָ/הֶ֖ם וְ/לֹ֥א עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/010.yaml
  text: When God saw their deeds[a], that they had turned from their evil way, God relented concerning the disaster that he had spoken to bring on them[b], and he did not do it.
  footnotes:
  - marker: a
    text: Or 'changed his mind'; Hebrew 'relented.' The wording describes God's response to Nineveh's repentance without implying moral fault in God.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses the same word for 'evil' in 'their evil way' and for the threatened 'disaster.' In context the first is moral evil; the second is calamity or judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그들의 행위를 보시고, 그들이 자기들의 악한 길에서 돌아선 것을 보시자, 하나님께서는 그들에게 내리기로 말씀하신 재앙을 거두시고, 그 일을 행하지 않으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거두시고’는 여기서 하나님께서 선언하신 심판을 실행하지 않으신다는 뜻을 살린 번역입니다. 문자적으로는 ‘뜻을 돌이키다/유감스러워하다’에 해당할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 ‘재앙’은 앞의 ‘악한 길’과 같은 말이지만, 여기서는 도덕적 악이 아니라 심판으로서의 재앙을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא / אֶת מַעֲשֵׂיהֶם
  english_pob_choice: saw their deeds
  chosen_korean: 그들의 행위를 보시고
  alternatives_korean:
  - 그들의 일을 보시고
  - 그들이 한 것을 보시고
  lexicon: HALOT
  rationale: מַעֲשִׂים은 단순한 행동이 아니라 드러난 행위들을 가리키므로, ‘행위’가 본문의 도덕적 무게를 살리면서도 자연스럽습니다.
- source_word: שָׁבוּ מִדַּרְכָּם הָרָעָה
  english_pob_choice: that they had turned from their evil way
  chosen_korean: 그들이 자기들의 악한 길에서 돌아선 것을
  alternatives_korean:
  - 그들이 자기들의 악한 길에서 돌아간 것을
  - 그들이 자기들의 악한 행로를 버린 것을
  lexicon: HALOT
  rationale: שׁוּב는 ‘돌아서다/돌아오다’의 의미를 살려야 하므로, 회개의 전환을 드러내는 ‘돌아선’이 적절합니다.
- source_word: וַיִּנָּחֶם
  english_pob_choice: relented
  chosen_korean: 재앙을 거두시고
  alternatives_korean:
  - 뜻을 바꾸시고
  - 마음을 돌리시고
  - 재앙을 완화하시고
  lexicon: HALOT
  rationale: נחם는 여기서 하나님께서 선언하신 심판을 실행하지 않으시는 방향으로 응답하신 것을 뜻하므로, ‘거두시고’가 결과를 분명히 드러내면서도 하나님께 도덕적 잘못을 암시하지 않습니다.
- source_word: עַל הָרָעָה אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  english_pob_choice: concerning the disaster that he had spoken to bring on them
  chosen_korean: 그들에게 내리기로 말씀하신 재앙을
  alternatives_korean:
  - 그들에게 행하시겠다고 말씀하신 재앙을
  - 그들에게 가져오려 하신 재앙을
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 심판의 재앙이므로 ‘재앙’으로 구분해야 하며, לַעֲשׂוֹת לָהֶם은 한국어에서 ‘내리다’가 자연스럽고 본문의 위협적 뉘앙스를 잘 전달합니다.
theological_decisions:
- issue: 하나님의 נחם를 한국어로 어떻게 표현할지
  chosen_reading: ‘재앙을 거두시고’로 옮겨, 하나님께서 선언하신 심판을 철회하신 응답을 드러냈습니다.
  alternative_readings:
  - 뜻을 바꾸시고
  - 마음을 돌리시고
  - 유감스러워하시고
  rationale: 본문은 하나님이 ভুল을 인정하셨다는 뜻이 아니라, 회개에 대한 실제적 응답으로 예고된 심판을 실행하지 않으신다는 긴장을 담고 있습니다. ‘거두시고’는 이 긴장을 유지합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 같은 רָעָה의 이중 의미
  chosen_reading: 첫 번째는 ‘악한 길’, 두 번째는 ‘재앙’으로 구분했습니다.
  alternative_readings:
  - 악 ... 악
  - 악한 길 ... 악
  rationale: 문맥상 첫 번째는 인간의 도덕적 악이고, 두 번째는 하나님이 내리실 심판의 재앙입니다. 같은 단어를 한국어에서 동일하게 옮기면 본문이 하나님께 도덕적 악을 돌리는 것처럼 들릴 수 있어, 문맥적 구분을 유지했습니다.
  doctrine_reference: 'Translation philosophy §5: Consistency of key terms, or documented exception.'
