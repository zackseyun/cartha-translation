id: JON.1.2
reference: Jonah 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֠וּם לֵ֧ךְ אֶל נִֽינְוֵ֛ה הָ/עִ֥יר הַ/גְּדוֹלָ֖ה וּ/קְרָ֣א עָלֶ֑י/הָ כִּֽי עָלְתָ֥ה רָעָתָ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/002.yaml
  text: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
  footnotes:
  - marker: a
    text: Or 'proclaim concerning it.' The Hebrew phrase can be rendered more generally, but in this context it likely carries the sense of announcing judgment against Nineveh.
    reason: lexical_alternative
  - marker: b
    text: Or 'their wickedness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나 큰 성읍 니느웨로 가서 그 성읍을 거슬러 외치십시오[a]. 그들의 악이 내 앞에 올라왔기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 성읍에 대하여 선포하십시오.’ 히브리어 표현은 더 일반적으로도 옮길 수 있지만, 이 문맥에서는 니느웨를 향한 심판 선포의 뜻이 더 강합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 악행.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֠וּם
  english_pob_choice: Arise
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나
  - 깨어나
  lexicon: HALOT
  rationale: 예언적 급촉 명령의 즉각성과 긴박함을 살리면서도, 현대 한국어에서 자연스러운 명령 연결형으로 옮겼습니다.
- source_word: וּ/קְרָא עָלֶ֑י/הָ
  english_pob_choice: cry out against it
  chosen_korean: 그를 향해 외치십시오
  alternatives_korean:
  - 그것을 향해 외치십시오
  - 그것을 향하여 선포하십시오
  - 그에 대하여 외치십시오
  lexicon: HALOT
  rationale: עַל + קרא의 문맥상 대적/책망의 힘을 반영하되, 'against'를 직역한 투박함보다 현대 한국어에서 자연스러운 방향 표현으로 긴장을 유지했습니다.
- source_word: הָ/עִ֥יר הַ/גְּדוֹלָ֖ה
  english_pob_choice: the great city
  chosen_korean: 그 큰 성읍
  alternatives_korean:
  - 그 위대한 성읍
  - 그 큰 도시
  - 그 큰 성
  lexicon: HALOT
  rationale: '''great''의 크기와 중요성 둘 다를 포함하는 표현으로 ''성읍''을 택해, 고대 도시의 위상과 성서적 어감을 함께 보존했습니다.'
- source_word: רָעָתָ֖/ם
  english_pob_choice: their evil
  chosen_korean: 그들의 악
  alternatives_korean:
  - 그들의 악행
  - 그들의 악함
  - 그들의 죄악
  lexicon: HALOT
  rationale: 여기서는 재난보다 도덕적 악을 가리키므로, 영어 본문의 'evil'에 맞춰 간결하게 '악'으로 옮겼습니다.
- source_word: לְ/פָנָֽ/י
  english_pob_choice: before me
  chosen_korean: 내 앞에
  alternatives_korean:
  - 내 앞에서
  - 내 앞에까지
  - 내 면전에
  lexicon: HALOT
  rationale: 하나님 앞에 이르러 조사와 판결의 대상이 되었다는 관계적·법정적 뉘앙스를 한국어의 자연스러운 표현으로 살렸습니다.
theological_decisions:
- issue: וּקְרָא עָלֶיהָ의 의미 범위
  chosen_reading: 니느웨를 향한 책망과 심판 선포의 성격을 드러내는 명령으로 읽었습니다.
  alternative_readings:
  - 중립적인 '니느웨에 대하여 선포하라'
  - 단순한 공개 발표 명령
  rationale: קרא + על은 이 문맥에서 단순 통보보다 대적적 선언의 힘을 가지며, 뒤의 '그들의 악이 내 앞에 올라왔다'는 이유절이 그 방향을 뒷받침합니다.
  doctrine_reference: 예언적 소명은 중립적 정보 전달이 아니라 하나님의 판단을 대언하는 행위라는 점을 반영했습니다.
