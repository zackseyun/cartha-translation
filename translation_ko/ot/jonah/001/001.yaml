translation:
  language: ko
  text: '야훼의 말씀이 아밋대의 아들 요나에게 임하여 이렇게 말씀하셨습니다[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그리고 일이 일어났다. 야훼의 말씀이 …에게 임하여 말하였다’라는 표준적인 서사 도입구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now ... came
  chosen_korean: 이제 ... 임하여
  alternatives_korean:
  - 그리고 ... 있었고
  - 그때 ... 임하였습니다
  lexicon: WLC narrative idiom / HALOT
  rationale: 히브리어 서두 관용구로서 단순한 시간 표지와 이야기 전개를 함께 여는 기능을 살리기 위해 ‘이제’로 시작하고, 임재·도래의 뉘앙스를 가진 ‘임하여’로 이어지는 동작을 자연스럽게 옮겼습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 여호와의 말씀
  lexicon: HALOT
  rationale: 예언서의 정형구인 ‘YHWH의 말씀’을 그대로 반영하되, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다. ‘말씀’은 דָּבָר의 구체적·예언적 성격을 유지합니다.
- source_word: אֶל יוֹנָה בֶן אֲמִתַּי
  english_pob_choice: to Jonah son of Amittai
  chosen_korean: 아밋대의 아들 요나에게
  alternatives_korean:
  - 요나, 아밋대의 아들에게
  - 아밋대의 아들인 요나에게
  lexicon: HALOT
  rationale: 수신 대상을 나타내는 전치사 אֶל을 한국어 조사 ‘-에게’로 옮기고, 족보식 식별 표현은 자연스러운 소유격 구조로 처리했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시며
  - 말하여
  lexicon: HALOT
  rationale: 이 절의 לֵאמֹר은 뒤따를 직접화법을 여는 기능을 하므로, 한국어에서는 중복 표현을 피하기 위해 바로 다음 절의 발화로 매끄럽게 연결되도록 처리했습니다.
theological_decisions:
- issue: יהוה를 한국어로 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 예언 공식의 주어로 YHWH를 직접 사용하므로, 전통적 대체어인 ‘주’보다 고유명사 ‘야훼’를 사용해 원문이 지닌 언약적·개인적 호칭을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
