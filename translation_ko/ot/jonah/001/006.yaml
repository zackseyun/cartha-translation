source:
  edition: WLC
  text: וַ/יִּקְרַ֤ב אֵלָי/ו֙ רַ֣ב הַ/חֹבֵ֔ל וַ/יֹּ֥אמֶר ל֖/וֹ מַה לְּ/ךָ֣ נִרְדָּ֑ם ק֚וּם קְרָ֣א אֶל אֱלֹהֶ֔י/ךָ אוּלַ֞י יִתְעַשֵּׁ֧ת הָ/אֱלֹהִ֛ים לָ֖/נוּ וְ/לֹ֥א נֹאבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/006.yaml
  text: So the captain came near to him and said to him[a], “What do you mean, sleeper? Get up, call on your god. Perhaps the god will give thought to us[c][b], so that we may not perish.”
  footnotes:
  - marker: a
    text: Or, 'the chief sailor' or 'the shipmaster.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew rebuke is literally terse: ''What to you, asleep?'' meaning something like ''How can you be sleeping?'''
    reason: lexical_alternative
  - marker: c
    text: The verb may also mean 'take notice of us' or 'be concerned about us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 선장[a]이 그에게 다가가 말했습니다. 「어찌하여 자고 있습니까?[b] 일어나 당신의 신께 부르짖으십시오. 어쩌면 그 신이 우리를 돌보아 주셔서[c] 우리가 멸망하지 않을지도 모릅니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뱃사람 우두머리’, ‘배의 지휘관’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 압축되어 직역하면 ‘잠든 이여, 네게 무슨 일이냐?’ 정도이다. ‘왜 자고 있습니까?’라는 책망의 뜻이다.
    reason: lexical_alternative
  - marker: c
    text: ‘우리를 돌보아 주셔서’는 ‘우리를 생각해 주셔서’, ‘우리에게 주의를 기울이셔서’로도 옮길 수 있다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב הַחֹבֵל
  english_pob_choice: the captain
  chosen_korean: 선장
  alternatives_korean:
  - 선원장
  - 배의 지휘관
  - 뱃사람 우두머리
  lexicon: HALOT
  rationale: 배의 선원들을 이끄는 사람을 가리키므로, 현대 한국어에서 가장 자연스럽고 기능적으로 대응하는 표현은 ‘선장’입니다.
- source_word: מַה לְּךָ נִרְדָּם
  english_pob_choice: What do you mean, sleeper?
  chosen_korean: 잠자는 자여, 무슨 뜻입니까?
  alternatives_korean:
  - 왜 자고 있습니까?
  - 어찌 잠들어 있습니까?
  - 잠자는 사람아, 무슨 일입니까?
  lexicon: HALOT
  rationale: 히브리어는 직역하면 매우 압축된 꾸짖음이므로, ‘잠자는 자여’로 호격성과 책망을 살리고 ‘무슨 뜻입니까?’로 당혹과 질책의 뉘앙스를 옮겼습니다.
- source_word: קְרָא אֶל אֱלֹהֶיךָ
  english_pob_choice: call on your god
  chosen_korean: 당신의 하나님께 부르짖으십시오
  alternatives_korean:
  - 당신의 신께 부르짖으십시오
  - 당신의 신을 부르십시오
  - 당신의 하나님께 부르십시오
  lexicon: HALOT
  rationale: 크게 부르며 간청하는 동사적 강도를 살리기 위해 ‘부르짖으십시오’를 택했습니다. 다만 이방 선원의 발화 속이므로 ‘당신의 하나님’은 주인공 요나의 신을 가리키는 2인칭 소유 표현으로 유지했습니다.
- source_word: יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ
  english_pob_choice: the god will give thought to us
  chosen_korean: 하나님이 우리를 돌아보셔서
  alternatives_korean:
  - 하나님이 우리에게 주의를 기울이셔서
  - 하나님이 우리를 생각해 주셔서
  - 하나님이 우리를 마음에 두셔서
  lexicon: HALOT
  rationale: 이 동사는 ‘주의를 기울이다/돌아보다/생각하다’의 뜻 범위를 가지므로, 문맥상 절박한 바람을 자연스럽게 드러내는 ‘돌아보셔서’를 택했습니다. 한국어 관습상 이방인의 말에서도 일반 명사 ‘하나님’으로 옮기되, 문맥이 요나의 하나님을 지칭하는지 여부는 과도하게 결정하지 않았습니다.
- source_word: וְלֹא נֹאבֵד
  english_pob_choice: so that we may not perish
  chosen_korean: 우리도 멸망하지 않을지도 모릅니다
  alternatives_korean:
  - 그래서 우리가 멸망하지 않을 것입니다
  - 그래서 우리가 죽지 않을 수 있습니다
  - 우리의 멸망을 막을 수 있습니다
  lexicon: HALOT
  rationale: 절망적 희망을 담은 결과절이므로, 단정적 미래보다 가능성·희망을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 이방 선원의 발화에서 אֱלֹהֶיךָ / הָאֱלֹהִים를 어떻게 옮길지
  chosen_reading: 요나의 대상은 ‘당신의 하나님’, 기대되는 응답자는 일반 명사 ‘하나님’으로 유지했습니다.
  alternative_readings:
  - 당신의 신 ... 신
  - 당신의 하나님 ... 하나님
  - 당신의 신 ... 하나님
  rationale: 본문은 선장이 요나에게 자기 신을 부르라고 요구하는 장면이며, 발화 자체가 야훼를 이름으로 고백하는 것은 아닙니다. 다만 내러티브의 아이러니를 보존하기 위해 소유격과 일반 명사 구분은 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
