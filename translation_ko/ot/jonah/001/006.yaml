  source_fidelity: 현 번역은 רַב הַחֹבֵל을 ‘선장’으로, קוּם 및 기도의 촉구를 적절히 옮겼습니다. 그러나 מַה־לְךָ נִרְדָּם은 ‘잠자는 자여, 무슨 뜻입니까?’라는 말이 아니라 잠들어 있는 행위를 꾸짖는 관용적 물음입니다. 또한 이방인 선장의 발화에서 אֱלֹהֶיךָ 및 הָאֱלֹהִים를 모두 ‘하나님’으로 옮기면, 원문과 영어 감사 기록이 보존하는 일반적·비고백적 표현을 지나치게 특정할 수 있습니다. ‘당신의 신’과 ‘그 신’으로 구분하는 것이 안전합니다.
  naturalness: ‘잠자는 자여, 무슨 뜻입니까?’는 현대 한국어에서 잠을 자는 상대에게 하는 질책으로 자연스럽지 않고 의미도 불분명합니다. ‘어찌하여 자고 있습니까?’는 원문의 압축된 책망을 자연스러운 합쇼체로 전달합니다. ‘다가가’와 ‘어쩌면’도 긴박한 서술에 자연스럽습니다.
