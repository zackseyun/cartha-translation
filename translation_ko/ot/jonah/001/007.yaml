  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ לְכוּ֙ וְ/נַפִּ֣ילָה גֽוֹרָל֔וֹת וְ/נֵ֣דְעָ֔ה בְּ/שֶׁ/לְּ/מִ֛י הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ וַ/יַּפִּ֨לוּ֙ גּֽוֹרָל֔וֹת וַ/יִּפֹּ֥ל הַ/גּוֹרָ֖ל עַל יוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/007.yaml
  text: And they said[a], each man to his companion, “Come, let us cast lots, so that we may know on whose account this evil has come upon us.” So they cast lots, and the lot fell on Jonah.
  footnotes:
  - marker: a
    text: Or “this calamity” or “this disaster.” The Hebrew word can mean evil, harm, or disaster depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 각자 서로에게 말했습니다. "오라, 우리가 제비를 뽑아 누구 때문에 이 재앙이 우리에게 닥쳤는지 알아봅시다." 그래서 그들이 제비를 뽑았고, 제비는 요나에게 떨어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָעָה는 문맥에 따라 ‘악’, ‘해악’, ‘재앙’으로 넓게 쓰입니다. 이 절에서는 해상 재난을 가리키므로 ‘재앙’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  english_pob_choice: each man to his companion
  chosen_korean: 각자 서로에게
  alternatives_korean:
  - 한 사람씩 서로에게
  - 각 사람이 자기 동료에게
  lexicon: HALOT
  rationale: 히브리어의 분배적 단수 표현을 한국어로 자연스럽게 옮기되, 상호 발화의 뜻을 분명히 하기 위해 ‘각자 서로에게’로 번역했습니다.
- source_word: וְנַפִּילָה גוֹרָלוֹת
  english_pob_choice: let us cast lots
  chosen_korean: 우리가 제비를 뽑아
  alternatives_korean:
  - 우리가 제비를 던져
  - 우리끼리 제비를 뽑아
  lexicon: HALOT
  rationale: ‘제비를 뽑다’는 한국어 관용 표현이 본문의 행위를 가장 직접적으로 드러내며, 공동 제안의 뉘앙스도 무리 없이 살립니다.
- source_word: הָרָעָה הַזֹּאת
  english_pob_choice: this evil
  chosen_korean: 이 재앙
  alternatives_korean:
  - 이 악
  - 이 화
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 ‘악’보다 폭풍으로 닥친 해악과 재난을 가리키므로, 문맥에 맞게 ‘재앙’으로 옮겼습니다.
- source_word: וַיִּפֹּל הַגּוֹרָל עַל יוֹנָה
  english_pob_choice: the lot fell on Jonah
  chosen_korean: 제비는 요나에게 떨어졌습니다
  alternatives_korean:
  - 제비는 요나에게 돌아갔습니다
  - 제비가 요나에게 떨어졌습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려, 결과가 요나에게 귀착되었음을 간명하게 표현했습니다.
theological_decisions:
- issue: רָעָה의 의미를 도덕적 악으로 오해하지 않게 하는 번역
  chosen_reading: ‘이 재앙’으로 번역해, 닥친 해악/재난의 의미를 드러냈습니다.
  alternative_readings:
  - 이 악
  - 이 화
  rationale: 본문은 선원들이 자신들에게 닥친 불행의 원인을 찾는 장면이므로, 하나님에 대한 도덕적 악행이 아니라 상황적 재난이라는 점이 한국어에서도 분명해야 합니다.
  doctrine_reference: Translation philosophy §1, §5
