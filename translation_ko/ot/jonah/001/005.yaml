id: JON.1.5
reference: Jonah 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ הַ/מַּלָּחִ֗ים וַֽ/יִּזְעֲקוּ֮ אִ֣ישׁ אֶל אֱלֹהָי/ו֒ וַ/יָּטִ֨לוּ אֶת הַ/כֵּלִ֜ים אֲשֶׁ֤ר בָּֽ/אֳנִיָּה֙ אֶל הַ/יָּ֔ם לְ/הָקֵ֖ל מֵֽ/עֲלֵי/הֶ֑ם וְ/יוֹנָ֗ה יָרַד֙ אֶל יַרְכְּתֵ֣י הַ/סְּפִינָ֔ה וַ/יִּשְׁכַּ֖ב וַ/יֵּרָדַֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/005.yaml
  text: Then the sailors were afraid[a], and each cried out to his god. They threw the cargo that was in the ship into the sea to lighten it for themselves. But Yonah had gone down into the innermost parts of the vessel[b], and he lay down and fell fast asleep.
  footnotes:
  - marker: a
    text: Or 'the ship's equipment' or 'the articles.' The Hebrew term is broad, but in context likely refers to cargo or gear thrown overboard to lighten the ship.
    reason: lexical_alternative
  - marker: b
    text: Or 'the recesses of the ship' or 'the hold of the ship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 선원들은 두려워하여, 각자 자기 신에게 부르짖었습니다. 그들은 배에 실려 있던 짐을 바다에 던져 배를 가볍게 하려 했습니다. 그러나 요나는 배의 가장 안쪽으로 내려가 누워 깊이 잠들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלָּחִים
  english_pob_choice: the sailors
  chosen_korean: 그 선원들
  alternatives_korean:
  - 그 뱃사람들
  - 그 해원들
  lexicon: HALOT
  rationale: מַלָּחִים은 항해하는 선원들을 가리키므로 현대 한국어의 가장 자연스러운 대응인 ‘선원들’을 택했습니다.
- source_word: אִישׁ אֶל אֱלֹהָיו
  english_pob_choice: each cried out to his god
  chosen_korean: 각자 자기 신에게 부르짖었습니다
  alternatives_korean:
  - 각 사람마다 자기의 신에게 외쳤습니다
  - 각자 자기의 신을 불렀습니다
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각자’로 살리고, זעק의 절박한 외침을 ‘부르짖었습니다’로 옮겼습니다. אֱלֹהָיו는 이방 신들을 가리키므로 ‘신’으로 번역했습니다.
- source_word: הַכֵּלִים אֲשֶׁר בָּאֳנִיָּה
  english_pob_choice: the cargo that was in the ship
  chosen_korean: 배에 실려 있던 짐
  alternatives_korean:
  - 배 안에 있던 짐
  - 배 안의 화물
  lexicon: HALOT
  rationale: כֵּלִים은 문맥상 배에 실린 물건이나 화물을 넓게 가리키므로, 승선 화물을 자연스럽게 드러내는 ‘짐’을 택했습니다.
- source_word: יָרַד אֶל יַרְכְּתֵי הַסְּפִינָה
  english_pob_choice: had gone down into the innermost parts of the vessel
  chosen_korean: 배의 가장 안쪽으로 내려가
  alternatives_korean:
  - 배의 깊은 곳으로 내려가
  - 선박의 가장 안쪽으로 내려가
  lexicon: HALOT
  rationale: יַרְכְּתֵי와 הַסְּפִינָה는 기술적 용어보다 공간적 묘사가 중심이므로, ‘가장 안쪽’으로 옮겨 내부 깊이를 살렸습니다.
- source_word: וַיֵּרָדַם
  english_pob_choice: fell fast asleep
  chosen_korean: 깊이 잠들었습니다
  alternatives_korean:
  - 곧바로 깊이 잠들었습니다
  - 푹 잠들었습니다
  lexicon: HALOT
  rationale: רדם은 단순한 수면이 아니라 깊은 잠을 뜻하므로, 동작의 결과를 간결하게 드러내는 ‘깊이 잠들었습니다’를 택했습니다.
theological_decisions:
- issue: 이방 신들을 가리키는 אֱלֹהָיו의 처리
  chosen_reading: 각자 자기 신에게
  alternative_readings:
  - 각자 자기들의 신에게
  - 각자 자기의 하나님에게
  rationale: 본문은 각 선원이 자기의 신을 부르는 장면이므로 단수 소유를 살리되, 이스라엘의 하나님과 구별되도록 ‘신’으로 번역했습니다.
  doctrine_reference: 본문의 우상숭배/이방 종교 대조
