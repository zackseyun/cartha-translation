  terminology: ‘선원들’, ‘신’, ‘짐’, ‘배의 가장 안쪽’ 및 ‘요나’는 적절합니다. 특히 אֱלֹהָיו를 ‘자기 신’으로 처리하여 각 선원의 개별적 이방 신 숭배라는 분배적 단수 의미를 보존했고, ‘하나님’으로 오해될 여지를 피했습니다. כֵּלִים의 넓은 뜻은 문맥상 ‘짐’으로 무리 없이 옮겼습니다.
