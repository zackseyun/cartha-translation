id: JON.1.16
reference: Jonah 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽירְא֧וּ הָ/אֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת יְהוָ֑ה וַ/יִּֽזְבְּחוּ זֶ֨בַח֙ לַֽ/יהוָ֔ה וַֽ/יִּדְּר֖וּ נְדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/016.yaml
  text: Then the men feared Yahweh with great fear[a], and they offered a sacrifice to Yahweh and made vows.
  footnotes:
  - marker: a
    text: Or, 'were greatly afraid of the LORD,' or 'revered the LORD greatly.' The Hebrew literally says, 'the men feared a great fear of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 사람들은 야훼를 크게 두려워하며[a] 야훼께 제물을 드리고 서원하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 야훼를 크게 두려워하였다’, 혹은 ‘그들은 야훼를 크게 경외하였다’. 히브리어는 문자적으로 ‘그 사람들은 야훼의 큰 두려움을 두려워하였다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ / יִרְאָה גְדוֹלָה
  english_pob_choice: feared ... with great fear
  chosen_korean: 크게 두려워하며
  alternatives_korean:
  - 야훼를 크게 경외하며
  - 야훼를 크게 두려워하였습니다
  lexicon: HALOT
  rationale: 히브리어의 동족 목적격 구조가 ‘큰 두려움’을 강하게 강조하므로, 단순한 ‘경외하다’보다 ‘두려워하다’ 계열을 유지해 공포와 경외가 함께 있는 긴장을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
  rationale: 본문의 여호와 이름을 신학적 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 고유한 신명성을 보존했습니다.
- source_word: וַיִּזְבְּחוּ זֶבַח
  english_pob_choice: offered a sacrifice
  chosen_korean: 제물을 드리고
  alternatives_korean:
  - 희생제를 바치고
  - 제사를 드리고
  lexicon: HALOT
  rationale: 제의적 동사-명사 결합을 한국어에서 자연스럽게 풀어, ‘제물을 드리다’로 희생 제의 행위를 전달했습니다.
- source_word: וַיִּדְּרוּ נְדָרִים
  english_pob_choice: made vows
  chosen_korean: 서원하였습니다
  alternatives_korean:
  - 맹세하였습니다
  - 서약하였습니다
  lexicon: HALOT
  rationale: נדרים는 단순한 약속보다 종교적 서원에 가깝기 때문에, 교회적 전통어를 무비판적으로 따르지 않되 의미를 가장 분명하게 드러내는 ‘서원’으로 옮겼습니다.
theological_decisions:
- issue: 야훼에 대한 두려움의 성격
  chosen_reading: ‘크게 두려워하며’로 옮겨, 공포와 경외가 함께 있는 반응을 남겼습니다.
  alternative_readings:
  - ‘크게 경외하며’
  - ‘야훼를 크게 두려워하였습니다’
  rationale: 히브리어는 단순한 감정 과장이 아니라, 구원과 심판을 본 이들의 복합적 응답을 표현합니다. 이를 한쪽으로 평탄화하지 않고 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: 서원의 종교적 무게
  chosen_reading: ‘서원하였습니다’로 번역해 단순한 약속이 아니라 하나님 앞에서의 의무적 서원을 드러냈습니다.
  alternative_readings:
  - ‘맹세하였습니다’
  - ‘약속하였습니다’
  rationale: 본문의 נדרים는 예배적·헌신적 성격을 띠는 서원으로 이해하는 것이 자연스럽고, 문맥상 감사의 응답을 더 분명히 보여 줍니다.
  doctrine_reference: HALOT nדר / biblical vow usage
