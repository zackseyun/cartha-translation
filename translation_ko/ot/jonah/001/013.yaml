  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּחְתְּר֣וּ הָ/אֲנָשִׁ֗ים לְ/הָשִׁ֛יב אֶל הַ/יַּבָּשָׁ֖ה וְ/לֹ֣א יָכֹ֑לוּ כִּ֣י הַ/יָּ֔ם הוֹלֵ֥ךְ וְ/סֹעֵ֖ר עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/013.yaml
  text: But the men rowed hard to return to the dry land[a], but they could not[c][b], because the sea kept growing more and more stormy against them.
  footnotes:
  - marker: a
    text: Or 'the men strained at the oars to get back to shore.' The Hebrew verb literally means 'dug,' but in this nautical context it refers to rowing with great effort.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the dry land.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression means the sea was becoming increasingly stormy or raging more and more.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 사람들은 육지로 돌아가려고 힘껏 노를 저었으나, 할 수 없었습니다. 바다가 그들에 맞서 점점 더 거세졌기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחְתְּרוּ
  english_pob_choice: rowed hard
  chosen_korean: 힘껏 노를 저었으나
  alternatives_korean:
  - 필사적으로 노를 저었으나
  - 노를 저어보았으나
  - 노를 젓느라 애썼으나
  lexicon: HALOT
  rationale: חתר는 문자적으로는 ‘파다’이지만, 이 해상 문맥에서는 힘써 노를 젓는 동작을 가리키므로, 동작과 강도를 함께 드러내는 표현을 택했습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들
  alternatives_korean:
  - 그 남자들
  - 선원들
  - 그들
  lexicon: HALOT
  rationale: 히브리어는 특수한 직업 명칭이 아니라 단순히 ‘사람들/남자들’을 말하므로, 문맥상 자연스럽되 원문 범위를 넘지 않는 표현을 선택했습니다.
- source_word: הַיַּבָּשָׁה
  english_pob_choice: the dry land
  chosen_korean: 육지
  alternatives_korean:
  - 마른 땅
  - 마른 육지
  - 해안
  lexicon: HALOT
  rationale: 직역하면 ‘마른 땅’이지만, 한국어에서는 항해 맥락에서 목적지를 가리킬 때 ‘육지’가 자연스럽고, 원문의 바다-마른 땅 대비도 무리 없이 전달합니다.
- source_word: הוֹלֵךְ וְסֹעֵר
  english_pob_choice: kept growing more and more stormy
  chosen_korean: 점점 더 거세졌기 때문입니다
  alternatives_korean:
  - 점점 더 폭풍처럼 거세졌기 때문입니다
  - 계속 더 심하게 요동쳤기 때문입니다
  - 갈수록 더 사나워졌기 때문입니다
  lexicon: HALOT
  rationale: 이 연결구는 진행적 증가를 나타내므로, 단순한 ‘거세졌다’보다 ‘점점 더’로 증분을 살리고, סער의 ‘요동치다/사납다’ 의미를 ‘거세지다’로 간결하게 옮겼습니다.
