source:
  edition: WLC
  text: וַ/יִּקְרְא֨וּ אֶל יְהוָ֜ה וַ/יֹּאמְר֗וּ אָנָּ֤ה יְהוָה֙ אַל נָ֣א נֹאבְדָ֗ה בְּ/נֶ֨פֶשׁ֙ הָ/אִ֣ישׁ הַ/זֶּ֔ה וְ/אַל תִּתֵּ֥ן עָלֵ֖י/נוּ דָּ֣ם נָקִ֑יא כִּֽי אַתָּ֣ה יְהוָ֔ה כַּ/אֲשֶׁ֥ר חָפַ֖צְתָּ עָשִֽׂיתָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/014.yaml
  text: Then they cried out to Yahweh and said[a], “Please, Yahweh, do not let us perish on account of this man's life, and do not put innocent blood on us, for you, Yahweh[b], have done as you pleased.”
  footnotes:
  - marker: a
    text: Or, 'do not charge us with innocent blood' or 'do not make us guilty of innocent blood.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'because of this man's life'; the phrase may also be understood as 'for taking this man's life' or 'on account of this man.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 야훼께 부르짖으며 말했습니다. "부디, 야훼여, 이 사람의 생명 때문에 우리가 죽게 하지 마시고, 무죄한 피를 우리에게 돌리지 마십시오. 야훼여, 당신은 뜻하신 대로 행하셨기 때문입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이 사람의 생명 때문에’는 ‘이 사람을 죽인 탓에’ 또는 ‘이 사람 때문에’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל יְהוָה
  english_pob_choice: Then they cried out to Yahweh
  chosen_korean: 그러자 그들이 야훼께 부르짖으며
  alternatives_korean:
  - 그러자 그들이 야훼께 외치며
  - 그러자 그들이 야훼께 부르며
  lexicon: HALOT
  rationale: קרא אל은 단순 호출보다 긴급한 호소를 나타내므로, 위기 속 간청의 뉘앙스를 살린 ‘부르짖다’가 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 원문 관례
  rationale: 본 프로젝트 기본값에 따라 신명기적 고유명사는 ‘야훼’로 옮겨, 제목어 ‘주’로 대체하지 않고 원문 고유성을 보존했습니다.
- source_word: בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  english_pob_choice: because of this man's life
  chosen_korean: 이 사람의 생명 때문에
  alternatives_korean:
  - 이 사람 때문에
  - 이 사람의 목숨 때문에
  - 이 사람의 생명으로 인해
  lexicon: HALOT
  rationale: נפש는 여기서 인격적 ‘영혼’보다 ‘생명’의 뜻이 분명하므로, 문맥에 맞게 ‘생명’으로 옮기되 인과를 드러내는 구조를 유지했습니다.
- source_word: וְאַל תִּתֵּן עָלֵינוּ דָּם נָקִיא
  english_pob_choice: and do not put innocent blood on us
  chosen_korean: 무죄한 피를 우리에게 돌리지 마십시오
  alternatives_korean:
  - 무죄한 피를 우리에게 얹지 마십시오
  - 무죄한 피의 책임을 우리에게 지우지 마십시오
  - 무죄한 피를 우리 위에 두지 마십시오
  lexicon: HALOT
  rationale: ‘피를 얹다/두다’의 히브리 관용은 혈죄를 뜻하므로, 현대 한국어에서 이해되도록 하면서도 법정·도덕적 책임의 감각을 드러내는 ‘돌리다’를 선택했습니다.
- source_word: כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ
  english_pob_choice: have done as you pleased
  chosen_korean: 뜻하신 대로 행하셨기 때문입니다
  alternatives_korean:
  - 원하신 대로 하셨기 때문입니다
  - 기뻐하신 대로 행하셨기 때문입니다
  - 원하시는 바를 행하셨기 때문입니다
  lexicon: HALOT
  rationale: חפץ는 ‘기뻐하다/원하다/뜻하다’의 범위를 가지며, 여기서는 하나님의 자유로운 행위를 설명하는 문맥이므로 ‘뜻하신 대로’가 가장 균형 잡힌 표현입니다.
theological_decisions:
- issue: 하나님의 이름을 어떻게 옮길 것인가
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 신명기적 고유명사인 YHWH를 직접 사용하므로, 본문이 드러내는 언약적 이름을 보존하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘무죄한 피’의 관용을 본문에 얼마나 드러낼 것인가
  chosen_reading: 히브리어 관용을 유지하되 한국어에서 ‘돌리지 마십시오’로 책임 귀속을 분명히 했습니다.
  alternative_readings:
  - 무죄한 피의 책임을 우리에게 지우지 마십시오
  - 우리를 무죄한 피에 대해 유죄로 만들지 마십시오
  rationale: 본문의 법적·도덕적 긴장을 약화시키지 않으면서도 현대 독자가 이해할 수 있게 하는 쪽이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
