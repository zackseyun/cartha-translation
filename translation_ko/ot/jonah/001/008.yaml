id: JON.1.8
reference: Jonah 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הַגִּידָ/ה נָּ֣א לָ֔/נוּ בַּ/אֲשֶׁ֛ר לְ/מִי הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ מַה מְּלַאכְתְּ/ךָ֙ וּ/מֵ/אַ֣יִן תָּב֔וֹא מָ֣ה אַרְצֶ֔/ךָ וְ/אֵֽי מִ/זֶּ֥ה עַ֖ם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/008.yaml
  text: Then they said to him[a], “Please tell us on whose account this trouble has come upon us. What is your occupation, and where do you come from? What is your land[b], and from what people are you?”
  footnotes:
  - marker: a
    text: Or 'because of whom this calamity has come upon us.' The Hebrew רָעָה here refers to the threatening disaster facing the sailors, not necessarily moral evil.
    reason: lexical_alternative
  - marker: b
    text: '''What is your land'' may also be rendered ''What is your country?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 그에게 말했습니다. 「부디 우리에게 이 재앙이 누구 때문에 우리에게 닥쳤는지 알려 주십시오. 당신의 일은 무엇이며, 어디에서 오십니까? 당신의 땅은 어디이며, 당신은 어느 백성입니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 재앙이 누구 때문에 우리에게 닥쳤는지’는 히브리어 רָעָה의 문맥적 의미를 살린 번역입니다. 여기서는 도덕적 ‘악’보다 선원들에게 닥친 위협적 재난을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅’은 히브리어 אֶרֶץ의 기본 대응입니다. 문맥상 ‘나라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה נָּא
  english_pob_choice: Please tell us
  chosen_korean: 부디 우리에게 알려 주십시오
  alternatives_korean:
  - 우리에게 말해 주십시오
  - 부디 우리에게 말씀해 주십시오
  lexicon: HALOT
  rationale: הגיד는 ‘알리다/말하다’의 뜻이고, נָא는 간청의 뉘앙스를 더하므로, 현대 합쇼체에서 자연스러운 공손 요청인 ‘부디 … 주십시오’로 옮겼습니다.
- source_word: לְמִי הָרָעָה הַזֹּאת לָנוּ
  english_pob_choice: on whose account this trouble has come upon us
  chosen_korean: 이 재앙이 누구 때문에 우리에게 닥쳤는지
  alternatives_korean:
  - 이 재앙이 누구의 탓으로 우리에게 왔는지
  - 이 재앙이 누구로 말미암아 우리에게 온 것인지
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 ‘악’보다 항해자들을 덮친 ‘재앙/재난’의 의미가 강하므로, 원문의 위협적 사건성을 살려 ‘재앙’으로 옮겼습니다. לְמִי는 원인·책임 대상을 묻기 때문에 ‘누구 때문에’가 자연스럽습니다.
- source_word: מַה מְּלַאכְתְּךָ
  english_pob_choice: What is your occupation
  chosen_korean: 당신의 일은 무엇이며
  alternatives_korean:
  - 당신의 직업은 무엇이며
  - 당신은 무슨 일을 하며
  lexicon: HALOT
  rationale: מְלָאכָה는 ‘일, 직업, 업무’를 아우르므로, 질문 연쇄 속에서 가장 넓고 과도한 현대적 전문화가 없는 ‘일’로 처리했습니다.
- source_word: מָה אַרְצֶךָ
  english_pob_choice: What is your land
  chosen_korean: 당신의 땅은 어디이며
  alternatives_korean:
  - 당신의 나라는 어디이며
  - 당신의 나라[땅]는 어디이며
  lexicon: HALOT
  rationale: אֶרֶץ는 ‘땅/나라/국토’가 가능하지만, 영어 POB의 ‘land’와 히브리어의 기본 감각을 따라 ‘땅’으로 두었습니다.
- source_word: וְאֵי מִזֶּה עַם אָתָּה
  english_pob_choice: and from what people are you
  chosen_korean: 당신은 어느 백성입니까
  alternatives_korean:
  - 당신은 어느 민족입니까
  - 당신은 어떤 백성에 속하십니까
  lexicon: HALOT
  rationale: עַם은 ‘백성/민족/사람들’의 뜻이 있어, 정체성 질문의 관용적 한국어로 ‘어느 백성입니까’가 가장 자연스럽고 원문의 집단 정체성 질문을 잘 드러냅니다.
- source_word: וַיֹּאמְרוּ אֵלָיו
  english_pob_choice: Then they said to him
  chosen_korean: 그러자 그들이 그에게 말했습니다
  alternatives_korean:
  - 그리고 그들이 그에게 말했습니다
  - 그때 그들이 그에게 말했습니다
  lexicon: HALOT
  rationale: 와우 연속은 서사 진행을 표시하므로, 매끄러운 현대 서사 연결어인 ‘그러자’를 사용했습니다.
theological_decisions:
- issue: רָעָה의 의미 범위
  chosen_reading: 여기서는 도덕적 악이 아니라 폭풍으로 인해 닥친 재앙/재난으로 이해했습니다.
  alternative_readings:
  - 악
  - 불행
  - 해악
  rationale: 문맥상 선원들은 요나의 도덕성보다 자신들에게 닥친 위기 원인을 묻고 있으므로, 사건의 위협성을 드러내는 ‘재앙’이 가장 적절합니다.
  doctrine_reference: 문맥 우선의 의미 결정; 욘 1장의 항해 위기 서사
- issue: לְמִי의 책임 추궁 뉘앙스
  chosen_reading: ‘누구 때문에’로 옮겨 원인과 책임 대상을 함께 드러냈습니다.
  alternative_readings:
  - 누구로 인해
  - 누구의 탓으로
  rationale: 질문은 단순 정보 요청이 아니라 재앙의 원인·책임 소재를 묻는 것이므로, 한국어에서도 그 추궁 성격이 살아야 합니다.
  doctrine_reference: 서사적 책임 추궁 표현
