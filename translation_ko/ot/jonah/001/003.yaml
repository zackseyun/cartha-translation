  source_fidelity: 핵심 동작과 반복되는 ‘내려가다’, 지명, 운임, 신명은 대체로 충실합니다. 다만 ‘임재를 피하여 … 도망치려고’는 원문의 ‘야훼 앞을 떠나 달아나다’라는 관계를 한국어에서 다소 중복되게 만들며, 마지막 ‘한 것입니다’는 본문의 직접적인 목적 표현보다 설명조입니다. ‘그 배에 내려갔습니다’도 가능하지만 בָּהּ의 내부 방향을 ‘배 안으로’로 나타내는 편이 더 가깝습니다.
  naturalness: ‘야훼 앞을 떠나’는 현대 표준어에서 자연스럽고, לִפְנֵי의 ‘앞/면전’이라는 공간적 표현과 하나님의 현존으로부터 벗어나려는 역설을 함께 보존합니다. 각주 표지는 해당 표현·반복 동사·배의 행선지에 각각 바로 붙이는 편이 독자에게 명확합니다.
