source:
  edition: WLC
  text: וַ/יָּ֤קָם יוֹנָה֙ לִ/בְרֹ֣חַ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָ֑ה וַ/יֵּ֨רֶד יָפ֜וֹ וַ/יִּמְצָ֥א אָנִיָּ֣ה בָּאָ֣ה תַרְשִׁ֗ישׁ וַ/יִּתֵּ֨ן שְׂכָרָ֜/הּ וַ/יֵּ֤רֶד בָּ/הּ֙ לָ/ב֤וֹא עִמָּ/הֶם֙ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/003.yaml
  text: But Jonah rose to flee to Tarshish from the presence of Yahweh[a]. He went down to Joppa and found a ship going to Tarshish. He paid its fare and went down into it to go with them to Tarshish[c][b], away from the presence of Yahweh.
  footnotes:
  - marker: a
    text: Or 'away from the LORD'; literally 'from the presence of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats 'went down' here; the repetition contributes to the narrative movement downward in this chapter.
    reason: cross_reference
  - marker: c
    text: Or 'bound for Tarshish.' The Hebrew expression is literally 'a ship coming/going to Tarshish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요나는 야훼의 임재를 피하여 다시스로 도망치려고 일어났습니다. 그는 욥바로 내려가 다시스로 가는 배를 찾아 그 배의 뱃삯을 치르고, 그들과 함께 다시스로 가려고 그 배에 내려갔습니다. 야훼의 임재를 피하려고 한 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 임재를 피하여’는 히브리어 직역에 가깝습니다. 전통적 표현으로는 ‘여호와의 얼굴을 피하여’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 ‘내려가다’를 반복합니다. 이 반복은 1장 전체의 하강 이미지를 강화합니다.
    reason: cross_reference
  - marker: c
    text: ‘다시스로 가는 배’는 문자적으로는 ‘다시스로 오는/향하는 배’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: rose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어섰습니다
  - 일어나
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도 히브리어의 ‘일어나다/자리에서 일서다’ 동작을 보존합니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: from the presence of Yahweh / the LORD
  chosen_korean: 야훼의 임재를 피하여
  alternatives_korean:
  - 야훼 앞에서부터
  - 야훼의 얼굴에서
  lexicon: HALOT
  rationale: לִפְנֵי의 문자적 ‘얼굴/임재’ 의미를 살려, 단순히 ‘도망하여’보다 ‘임재를 피하여’가 원문의 신학적 아이러니를 더 분명히 드러냅니다.
- source_word: אָנִיָּה
  english_pob_choice: ship
  chosen_korean: 배
  alternatives_korean:
  - 선박
  - 배 한 척
  lexicon: HALOT
  rationale: 이 문맥에서는 해상 운송수단을 자연스럽게 가리키므로 현대 한국어의 일반어 ‘배’가 가장 직접적입니다.
- source_word: שְׂכָרָהּ
  english_pob_choice: its fare
  chosen_korean: 뱃삯
  alternatives_korean:
  - 운임
  - 배삯
  lexicon: HALOT
  rationale: 배의 탑승료라는 의미를 한국어 관용에 맞게 압축해, 원문의 ‘대가를 치름’이라는 행동을 분명히 합니다.
- source_word: וַיֵּרֶד בָּהּ
  english_pob_choice: went down into it
  chosen_korean: 그 배에 내려갔습니다
  alternatives_korean:
  - 그 배에 올랐습니다
  - 그 안으로 내려갔습니다
  lexicon: HALOT
  rationale: 요나서의 반복되는 ‘내려가다’ 모티프를 살리기 위해 ‘올랐다’로 평준화하지 않고 그대로 유지했습니다.
theological_decisions:
- issue: 야훼(יְהוָה)의 번역
  chosen_reading: 본문에는 ‘야훼’를 사용하고, 반복되는 구문은 같은 표기로 유지합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문의 고유한 언약명을 직접 드러내는 편이 본문 의미와 POB의 स्रोत-직역 원칙에 더 부합합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
