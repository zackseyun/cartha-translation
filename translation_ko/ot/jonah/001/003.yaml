revisions:
- from: 그러나 요나는 야훼의 임재를 피하여 다시스로 도망치려고 일어났습니다. 그는 욥바로 내려가 다시스로 가는 배를 찾아 그 배의 뱃삯을 치르고, 그들과 함께 다시스로 가려고 그 배에 내려갔습니다. 야훼의 임재를 피하려고 한 것입니다.[a][b][c]
  to: 그러나 요나는 야훼 앞을 떠나[a] 다시스로 달아나려고 일어났습니다. 그는 욥바로 내려가 다시스로 가는 배[c]를 찾아, 그 뱃삯을 치르고 그들과 함께 다시스로 가려고 그 배 안으로 내려갔습니다[b]. 야훼 앞을 떠나려는 것이었습니다.
  rationale: 원문의 מִלִּפְנֵי יְהוָה를 두 번 모두 ‘야훼 앞을 떠나’로 옮겨 반복과 공간적 비유를 보존했습니다. ‘달아나다’는 לִבְרֹחַ의 도피 의미를 자연스럽게 반영하며, ‘배 안으로 내려갔습니다’는 반복되는 ירד와 בָּהּ의 내부 방향을 함께 드러냅니다. 각주는 원문의 관련 어구 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:13Z'
