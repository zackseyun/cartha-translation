revisions:
- from: 그러나 야훼께서 큰 바람을 바다 위로 던지셨고, 바다에는 큰 폭풍이 일어났습니다. 그래서 배는 부서지기 직전이었습니다.
  to: 그러나 야훼께서 바다를 향해 큰 바람을 내던지셨고, 바다에 큰 폭풍이 일어났습니다. 그래서 배는 부서질 듯했습니다.
  rationale: 원문의 신명, ‘큰’의 반복, 바람을 강하게 던지는 비유, 그리고 배를 의인화하여 파손의 위태로움을 묘사하는 표현을 보존하도록 최소한으로 다듬었습니다. ‘그래서’는 문맥상 폭풍과 배의 위태로움 사이의 결과 관계를 자연스럽게 드러냅니다.
