id: JON.1.4
reference: Jonah 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה הֵטִ֤יל רֽוּחַ גְּדוֹלָה֙ אֶל הַ/יָּ֔ם וַ/יְהִ֥י סַֽעַר גָּד֖וֹל בַּ/יָּ֑ם וְ/הָ֣/אֳנִיָּ֔ה חִשְּׁבָ֖ה לְ/הִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
  footnotes:
  - marker: a
    text: Or 'And the LORD hurled a great wind onto the sea.' The Hebrew waw can be rendered simply as 'and'; 'but' was chosen to reflect the narrative contrast after Jonah's flight.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the ship thought to be broken.' This is a Hebrew personification meaning the ship seemed likely to break apart.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서 바다를 향해 큰 바람을 내던지셨고, 바다에 큰 폭풍이 일어났습니다. 그래서 배는 부서질 듯했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: But Yahweh
  chosen_korean: 그러나 야훼께서
  alternatives_korean:
  - 그리고 야훼께서
  - 야훼께서
  lexicon: WLC / POB doctrine default
  rationale: 여기서는 하나님의 이름을 학술적 음역인 ‘야훼’로 옮겨 본문을 직접 반영했고, 서사 전환의 대조를 살려 ‘그러나’를 선택했습니다.
- source_word: הֵטִיל
  english_pob_choice: hurled
  chosen_korean: 던지셨고
  alternatives_korean:
  - 내던지셨고
  - 투척하셨고
  - 보내셨고
  lexicon: HALOT
  rationale: 동사는 바람을 강하게 ‘던지다/내던지다’는 의미를 담고 있어, ‘보내다’보다 강한 작용을 드러내는 ‘던지셨고’를 택했습니다.
- source_word: רוּחַ גְּדוֹלָה
  english_pob_choice: a great wind
  chosen_korean: 큰 바람
  alternatives_korean:
  - 거센 바람
  - 강한 바람
  - 큰 רוח
  lexicon: HALOT
  rationale: 해양 문맥에서 רוּחַ는 ‘영’이 아니라 ‘바람’이며, גְּדוֹלָה의 반복을 살리기 위해 ‘큰’을 유지했습니다.
- source_word: וַ/יְהִ֥י סַֽעַר גָּד֖וֹל בַּ/יָּ֑ם
  english_pob_choice: and there was a great storm on the sea
  chosen_korean: 바다에는 큰 폭풍이 일어났습니다
  alternatives_korean:
  - 바다에 큰 폭풍이 있었습니다
  - 바다 위에 큰 폭풍이 일어났습니다
  - 바다에는 큰 폭풍이 있었습니다
  lexicon: HALOT
  rationale: וַיְהִי는 여기서 사건의 발생을 알리므로 ‘일어났습니다’가 자연스럽고, סַעַר는 단순한 비바람보다 강한 ‘폭풍’으로 옮겼습니다.
- source_word: וְ/הָ֣/אֳנִיָּ֔ה חִשְּׁבָ֖ה לְ/הִשָּׁבֵֽר
  english_pob_choice: so that the ship seemed about to be broken up
  chosen_korean: 그래서 배는 부서지기 직전이었습니다
  alternatives_korean:
  - 그래서 배는 부서질 것처럼 보였습니다
  - 그래서 배는 부서질 듯했습니다
  - 그래서 배는 깨질 듯했습니다
  lexicon: HALOT
  rationale: 배를 의인화한 표현으로, חִשְּׁבָה를 ‘~처럼 보였다’보다 결과적 임박성을 드러내는 ‘직전이었다’로 풀어 본문 의미를 자연스럽게 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 여호와 대용어가 아니라 직접적인 신명(神名) יְהוָה를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 가시성을 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
