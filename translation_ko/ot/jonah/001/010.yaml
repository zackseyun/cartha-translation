revisions:
- from: 그러자 그 사람들은 몹시 두려워하며 그에게 말했습니다. 「당신이 무슨 짓을 한 것입니까?」 그 사람들은 그가 야훼의 얼굴 앞에서 도망치고 있다는 것을 알고 있었기 때문입니다. 그가 자기들에게 말했기 때문입니다.[a]
  to: 그러자 그 사람들은 몹시 두려워하여 그에게 말했습니다. “당신이 이런 일을 하다니, 어찌 된 일입니까?” 그들은 그가 야훼 앞을 떠나 도망하고 있다는 것을 알고 있었기 때문입니다. 이는 그가 그들에게 말해 주었기 때문입니다.[a]
  rationale: 히브리어의 강조적 동족목적어는 ‘몹시 두려워하여’로 자연스럽게 옮기고, מִלִּפְנֵי יְהוָה는 ‘야훼 앞을 떠나’로 번역하여 출발점과 임재의 역설을 보존했습니다. בֹרֵחַ의 진행적 상태는 ‘도망하고 있다’로 유지했습니다. 질문은 זֹאת의 지시성을 ‘이런 일’로 반영하면서도 원문보다 과도한 비난을 피했습니다. 각 כִּי의 설명 관계도 한국어에서 명료하게 살렸습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:11Z'
