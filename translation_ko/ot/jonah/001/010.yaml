  source_fidelity: 원문의 인과 구조와 분사적 지속성은 대체로 반영되었으나, ‘야훼의 얼굴 앞에서’는 מִלִּפְנֵי יְהוָה를 한국어에서 부자연스럽고 지나치게 신체적으로 구체화합니다. 또한 ‘무슨 짓’은 원문의 책망조보다 더 비난적인 함의를 낼 수 있습니다.
