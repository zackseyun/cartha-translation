id: JON.1.10
reference: Jonah 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽירְא֤וּ הָֽ/אֲנָשִׁים֙ יִרְאָ֣ה גְדוֹלָ֔ה וַ/יֹּאמְר֥וּ אֵלָ֖י/ו מַה זֹּ֣את עָשִׂ֑יתָ כִּֽי יָדְע֣וּ הָ/אֲנָשִׁ֗ים כִּֽי מִ/לִּ/פְנֵ֤י יְהוָה֙ ה֣וּא בֹרֵ֔חַ כִּ֥י הִגִּ֖יד לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/010.yaml
  text: Then the men were greatly afraid[a], and they said to him, “What is this that you have done?” For the men knew that he was fleeing from the presence of Yahweh, because he had told them.
  footnotes:
  - marker: a
    text: Or, more literally, 'the men feared a great fear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 사람들은 몹시 두려워하여 그에게 말했습니다. “당신이 이런 일을 하다니, 어찌 된 일입니까?” 그들은 그가 야훼 앞을 떠나 도망하고 있다는 것을 알고 있었기 때문입니다. 이는 그가 그들에게 말해 주었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘그 사람들은 큰 두려움을 두려워했다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  english_pob_choice: were greatly afraid
  chosen_korean: 몹시 두려워하며
  alternatives_korean:
  - 크게 두려워하며
  - 지극히 두려워하며
  - 두려움에 크게 사로잡혀
  lexicon: HALOT
  rationale: 히브리어의 목적어적 반복(‘크게 두려운 두려움’)은 한국어에서 직역 반복보다 강도를 살린 부사구로 옮기는 편이 자연스럽습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들
  alternatives_korean:
  - 그 남자들
  - 그 선원들
  - 그 사람들
  lexicon: HALOT
  rationale: 문맥상 선원들이지만, 본문은 일반 명사 ‘사람들/남자들’을 사용하므로 의미를 과도하게 특정하지 않고 옮겼습니다.
- source_word: מַה זֹּאת עָשִׂיתָ
  english_pob_choice: What is this that you have done?
  chosen_korean: 당신이 무슨 짓을 한 것입니까?
  alternatives_korean:
  - 당신이 무슨 일을 한 것입니까?
  - 도대체 무슨 일을 하신 겁니까?
  - 당신이 무슨 짓을 하신 것입니까?
  lexicon: HALOT
  rationale: 질책의 뉘앙스를 담는 ‘무슨 짓’을 택하되, 원문의 놀람과 책망을 살리기 위해 직설적 질문 형태를 유지했습니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: from the presence of Yahweh
  chosen_korean: 야훼의 얼굴 앞에서 도망치고 있다는
  alternatives_korean:
  - 야훼의 앞에서 도망치고 있다는
  - 야훼의 임재에서 도망치고 있다는
  - 야훼 앞에서 도망치고 있다는
  lexicon: HALOT
  rationale: לִפְנֵי는 단순한 위치보다 ‘얼굴 앞/앞에’라는 직접성을 띠므로, 하나님의 임재를 피하려는 역설을 더 선명하게 드러내는 ‘얼굴 앞에서’를 사용했습니다.
- source_word: בֹרֵחַ
  english_pob_choice: was fleeing
  chosen_korean: 도망치고 있다는
  alternatives_korean:
  - 도망하고 있다는
  - 도피하고 있다는
  - 도망치고 있었다는
  lexicon: HALOT
  rationale: 분사형의 진행성은 현재적 서술 속의 지속 상태로 나타나므로, 자연스러운 한국어 진행 표현으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: יהוה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 고유명사 יְהוָה를 직접 사용하므로, 칭호가 아니라 신적 이름을 드러내는 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
