base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/009.yaml
  text: He said to them[a], “I am a Hebrew, and I fear Yahweh, the God of heaven[b], who made the sea and the dry land.”
  footnotes:
  - marker: a
    text: Or “I revere the LORD” or “I worship the LORD.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “YHWH”; rendered “the LORD” following the translation’s standard practice for the divine name.'
