translation:
  language: ko
  text: 그가 그들에게 말했습니다. “나는 히브리 사람이며, 바다와 마른 땅을 만드신 하늘의 하나님 야훼를 두려워합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워합니다’는 כאן의 יָרֵא를 직접 반영한 것이며, 문맥에 따라 ‘경외합니다’ 또는 ‘예배합니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 신명기 יְהוָה를 사용합니다. 이 번역은 프로젝트 기본 표기인 ‘야훼’를 따릅니다.
    reason: ot_citation
lexical_decisions:
- source_word: עִבְרִי
  english_pob_choice: Hebrew
  chosen_korean: 히브리 사람
  alternatives_korean:
  - 히브리인
  - 이스라엘 사람
  lexicon: HALOT
  rationale: 자기 정체성 표지로 쓰인 민족명은 한국어에서 자연스러운 ‘히브리 사람’으로 옮겨, 영어 POB의 중립적 민족명 의미를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 고유명사 ‘야훼’로 옮겨, 호칭화된 ‘주님’으로 바꾸지 않았습니다.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘의 신
  - 하늘의 하나님께서
  lexicon: HALOT
  rationale: 히브리어 소유구문을 한국어의 자연스러운 관형 구조로 반영하되, ‘하늘의 하나님’이라는 관용적 의미를 살렸습니다.
- source_word: יָרֵא
  english_pob_choice: fear
  chosen_korean: 두려워합니다
  alternatives_korean:
  - 경외합니다
  - 공경합니다
  - 예배합니다
  lexicon: HALOT
  rationale: POB가 지적한 신학적 긴장을 보존하기 위해, ‘경외하다/예배하다’로 완화하지 않고 직접 대응하는 ‘두려워합니다’를 택했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼를 사용합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기 고유명사를 직접 사용하므로, 표제를 대체하는 번역보다 고유성을 드러내는 표기가 원문 의미를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: יָרֵא의 의미와 요나의 자기진술 긴장
  chosen_reading: ‘두려워합니다’로 직역성을 유지합니다.
  alternative_readings:
  - 경외합니다
  - 예배합니다
  rationale: 요나의 말은 실제 삶과의 긴장을 담고 있으므로, 더 부드러운 종교어로 바꾸면 원문이 가진 아이러니가 약화됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
