  text: וַ/יֹּאמְר֤וּ אֵלָי/ו֙ מַה נַּ֣עֲשֶׂה לָּ֔/ךְ וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עָלֵ֑י/נוּ כִּ֥י הַ/יָּ֖ם הוֹלֵ֥ךְ וְ/סֹעֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/011.yaml
  text: Then they said to him[b][a], “What should we do to you so that the sea may quiet down for us?” For the sea was growing more and more stormy.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from upon us,'' a vivid expression portraying the sea''s pressure or threat against them.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'for the sea was going and storming'—that is, it was becoming increasingly stormy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 물었습니다. “우리가 당신에게 무엇을 해야 바다가 우리를 덮치는 것을 그치고 잠잠해지겠습니까?” 바다가 점점 더 거세게 요동치고 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָּךְ
  english_pob_choice: What should we do to you
  chosen_korean: 우리가 당신에게 무엇을 해야
  alternatives_korean:
  - 우리가 당신에게 무엇을 하여야
  - 우리가 당신에게 무엇을 해야 합니까
  lexicon: HALOT
  rationale: 질문형의 의도와 행동 대상(요나)을 자연스럽게 드러내면서도, 히브리어의 직접적 요청을 보존했습니다.
- source_word: וְיִשְׁתֹּק
  english_pob_choice: so that the sea may quiet down
  chosen_korean: 이 바다가 잠잠해지겠습니까
  alternatives_korean:
  - 이 바다가 조용해지겠습니까
  - 이 바다가 शांत해지겠습니까
  lexicon: HALOT
  rationale: שׁתק의 기본 의미인 ‘조용해지다/잠잠해지다’를 살려, 폭풍 해상 맥락에 맞는 한국어로 옮겼습니다.
- source_word: מֵעָלֵינוּ
  english_pob_choice: from upon us
  chosen_korean: 우리에게서
  alternatives_korean:
  - 우리 위에서부터
  - 우리에게서 떠나
  lexicon: HALOT
  rationale: 직역하면 ‘우리 위에서’의 압박감이 있으나, 한국어에서는 문맥상 원인 제거의 의미를 자연스럽게 살리는 ‘우리에게서’가 가장 읽기 좋습니다.
- source_word: הוֹלֵךְ וְסֹעֵר
  english_pob_choice: was growing more and more stormy
  chosen_korean: 점점 더 거세지고 있었기 때문입니다
  alternatives_korean:
  - 점점 더 폭풍이 심해지고 있었기 때문입니다
  - 계속 더 사나워지고 있었기 때문입니다
  lexicon: HALOT
  rationale: הלך + 분사의 진행적 증가는 ‘점점 더’로, סער는 바다/폭풍의 격화를 나타내므로 ‘거세지다’로 옮겨 누적적 강도를 전달했습니다.
theological_decisions:
- issue: 바다의 의인화/압박 표현
  chosen_reading: ‘이 바다가 우리에게서 잠잠해지겠습니까?’로 바다의 위협적 능동성을 살렸습니다.
  alternative_readings:
  - ‘바다가 우리에게서 조용해지겠습니까?’
  - ‘바다가 우리를 떠나 잠잠해지겠습니까?’
  rationale: 히브리어의 ‘우리 위에/우리에게’ 뉘앙스는 자연스러운 한국어로 완전 직역하기 어렵지만, 본문의 긴박한 위협감을 약화시키지 않도록 유지했습니다.
  doctrine_reference: 본문 서사와 어휘의 수사적 효과 보존
