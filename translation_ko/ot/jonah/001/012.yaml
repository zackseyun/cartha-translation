id: JON.1.12
reference: Jonah 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם שָׂא֨וּ/נִי֙ וַ/הֲטִילֻ֣/נִי אֶל הַ/יָּ֔ם וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עֲלֵי/כֶ֑ם כִּ֚י יוֹדֵ֣עַ אָ֔נִי כִּ֣י בְ/שֶׁ/לִּ֔/י הַ/סַּ֧עַר הַ/גָּד֛וֹל הַ/זֶּ֖ה עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/012.yaml
  text: And he said to them[a], “Pick me up and throw me into the sea, and the sea will become calm for you[c][b], for I know that this great storm is upon you because of me.”
  footnotes:
  - marker: a
    text: Or, 'hurl me into the sea.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the sea will be quiet from upon you.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'this great storm is upon you on my account.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「저를 들어서 바다에 던지십시오. 그러면 바다가 여러분에게서 잠잠해질 것입니다. 내가 알기에 이 큰 폭풍이 여러분에게 닥친 것은 바로 나 때문입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 바다에 내던지십시오.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바다가 여러분 위에서 잠잠해질 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이 큰 폭풍이 여러분에게 내린 것은 바로 내 탓입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא֨וּ/נִי
  english_pob_choice: Pick me up
  chosen_korean: 저를 들어서
  alternatives_korean:
  - 저를 들어 올려
  - 저를 들어서 옮겨
  lexicon: HALOT
  rationale: נשא는 여기서 요나를 물리적으로 들어 올려 바다에 던지게 하는 뜻이므로, 자연스러운 현대 한국어로 동작을 살린 ‘들어서’로 옮겼습니다.
- source_word: וַ/הֲטִילֻ֣/נִי
  english_pob_choice: throw me
  chosen_korean: 바다에 던지십시오
  alternatives_korean:
  - 바다에 내던지십시오
  - 바다에 집어 던지십시오
  lexicon: HALOT
  rationale: טול의 사역형은 분명히 ‘던지다/내던지다’의 의미이므로, 명령형으로 직접성과 긴박함을 살렸습니다.
- source_word: וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עֲלֵי/כֶ֑ם
  english_pob_choice: the sea will become calm for you
  chosen_korean: 바다가 여러분에게서 잠잠해질 것입니다
  alternatives_korean:
  - 바다가 여러분 위에서 잠잠해질 것입니다
  - 바다가 여러분에게서 고요해질 것입니다
  lexicon: HALOT
  rationale: שתק은 문자적으로 ‘조용하다’이지만 폭풍의 문맥에서는 파도가 가라앉는 뜻이므로, ‘잠잠해지다’로 옮겨 의미와 한국어 관용을 함께 살렸습니다. ‘여러분에게서’는 히브리어의 ‘from upon you’ 이미지를 보존합니다.
- source_word: כִּ֣י יוֹדֵ֣עַ אָ֔נִי כִּ֣י בְ/שֶׁ/לִּ֔/י
  english_pob_choice: for I know ... because of me
  chosen_korean: 내가 알기에 ... 바로 나 때문입니다
  alternatives_korean:
  - 내가 알기에 ... 내 책임입니다
  - 내가 분명히 알기에 ... 내 탓입니다
  lexicon: HALOT
  rationale: יוֹדֵעַ אָנִי의 강조를 ‘내가 알기에’로 충분히 살렸고, בשלִי는 원인·책임을 나타내므로 ‘바로 나 때문입니다’로 분명하게 번역했습니다.
- source_word: הַ/סַּ֧עַר הַ/גָּד֛וֹל הַ/זֶּ֖ה
  english_pob_choice: this great storm
  chosen_korean: 이 큰 폭풍
  alternatives_korean:
  - 이 큰 폭풍우
  - 이 큰 광풍
  lexicon: HALOT
  rationale: סער는 폭풍/광풍을 가리키지만, 현대 한국어에서 자연스럽고 직접적인 ‘폭풍’이 가장 적절하여 선택했습니다.
theological_decisions:
- issue: 요나의 책임 고백을 얼마나 직접적으로 드러낼지
  chosen_reading: 요나는 폭풍이 자신 때문에 왔다고 직접 고백합니다.
  alternative_readings:
  - 단순한 연관만 말하는 것으로 완화할 수 있습니다.
  - 사건의 원인을 흐리게 표현할 수 있습니다.
  rationale: 히브리어 בשלִי는 원인과 책임을 분명히 가리키므로, 본문이 가진 고백의 강도를 약화하지 않도록 직접적으로 번역했습니다.
  doctrine_reference: 본문 주해의 책임 고백 유지
