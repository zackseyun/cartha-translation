  source_fidelity: 히브리어의 두 명령(‘나를 들어 올려라/던져라’), 바다가 잠잠해질 결과, 그리고 폭풍의 원인이 자신에게 있다는 요나의 인식과 고백은 모두 유지되었습니다. 다만 ‘내가 알기에’는 한국어에서 ‘내가 아는 범위에서는’이라는 유보적 뉘앙스를 낼 수 있으므로, 단정적인 יוֹדֵעַ אָנִי를 더 직접적으로 옮기는 편이 좋습니다.
  naturalness: ‘바다가 여러분에게서 잠잠해질 것입니다’는 히브리어 전치사구를 지나치게 직역하여 현대 한국어로는 어색합니다. ‘여러분을 더 이상 덮치지 않고’라고 하여 폭풍우 치는 바다가 그들에게 가하던 위협이 그친다는 원문의 이미지를 자연스럽게 드러낼 수 있습니다. ‘저를 들어서’도 ‘저를 들어’가 더 매끄럽습니다.
  terminology: ‘폭풍’, ‘잠잠해지다’, ‘나 때문’은 문맥과 현대 합쇼체에 적절합니다. 원문의 인과 관계를 보존하기 위해 ‘바로’는 필수적이지 않으므로 제거했습니다. 기존 각주 a와 c는 실제 대안 번역을 제공하지만, b는 개정 본문의 자연스러운 번역 방식을 설명하는 직역 각주로 유지했습니다.
