id: JER.21.14
reference: Jeremiah 21:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פָקַדְתִּ֧י עֲלֵי/כֶ֛ם כִּ/פְרִ֥י מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָ֑ה וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/יַעְרָ֔/הּ וְ/אָכְלָ֖ה כָּל סְבִיבֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/014.yaml
  text: And I will punish you according to the fruit of your deeds[a], declares Yahweh, and I will kindle a fire in her forest[b], and it will consume all that is around her.
  footnotes:
  - marker: a
    text: Or 'I will attend to you' or 'I will visit upon you'; the Hebrew verb can have a broader sense than punitive action, though here it clearly occurs in a judgment context.
    reason: lexical_alternative
  - marker: b
    text: '''Her forest'' likely refers poetically to Jerusalem or her royal/palace complex; some understand ''forest'' metaphorically as a thicket of buildings or defenses.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 내가 너희에게 너희 행위의 열매대로 벌할 것이며[a], —야훼의 말씀이니라— 그녀의 숲에 불을 지르리니[b], 그것이 그 둘레의 모든 것을 삼킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌할 것이며’는 פקד의 심판적 의미를 따른 번역입니다. 문자적으로는 ‘찾아가다/돌보다’까지 가능하지만, 여기서는 문맥상 보응과 심판이 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀의 숲’은 예루살렘 또는 그 왕궁·성채 복합체를 시적으로 가리키는 표현으로 이해할 수 있습니다. 원문은 해석을 열어 둔 채 ‘숲’ 이미지를 유지합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיכֶם
  english_pob_choice: I will punish you
  chosen_korean: 내가 너희에게 벌할 것이며
  alternatives_korean:
  - 내가 너희를 찾아갈 것이며
  - 내가 너희에게 찾아가 벌할 것이며
  - 내가 너희를 심문할 것이며
  lexicon: HALOT
  rationale: פקד는 ‘돌보다/찾아보다/점검하다/벌하다’까지 넓지만, ‘너희 행위의 열매대로’와 함께 쓰여 심판 맥락의 보응 의미가 분명하므로 ‘벌하다’로 옮기는 것이 가장 직접적입니다.
- source_word: כִּפְרִי מַעַלְלֵיכֶם
  english_pob_choice: according to the fruit of your deeds
  chosen_korean: 너희 행위의 열매대로
  alternatives_korean:
  - 너희 행위의 열매에 따라
  - 너희 행실의 열매대로
  - 너희 행위의 소출대로
  lexicon: HALOT
  rationale: כִּ는 대응·비례를 나타내므로 ‘-대로’가 자연스럽고, 프리(열매) 이미지를 살리면서 보응의 비례성을 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: —야훼의 말씀이니라—
  alternatives_korean:
  - —야훼께서 말씀하십니다—
  - —야훼의 선언입니다—
  - —야훼의 말이니라—
  lexicon: HALOT
  rationale: 예언문 공식은 현대 한국어에서 ‘말씀이니라’가 다소 전통적이지만, 화자 권위를 간결하게 표시하면서도 원문의 선포 공식을 잘 보존합니다.
- source_word: בְּיַעְרָהּ
  english_pob_choice: in her forest
  chosen_korean: 그녀의 숲에
  alternatives_korean:
  - 그녀의 산림에
  - 그녀의 수풀에
  - 그녀의 숲속에
  lexicon: HALOT
  rationale: יַעַר는 기본적으로 ‘숲/수림’이므로 가장 مستقیم한 대응은 ‘숲’입니다. 여성 3인칭 접미사는 원문의 인칭을 살려 ‘그녀의’로 유지했습니다.
- source_word: וְאָכְלָה כָּל סְבִיבֶיהָ
  english_pob_choice: and it will consume all that is around her
  chosen_korean: 그것이 그 둘레의 모든 것을 삼킬 것입니다
  alternatives_korean:
  - 그것이 그녀 주위의 모든 것을 삼킬 것입니다
  - 그것이 둘레의 모든 것을 삼킬 것입니다
  - 그것이 주변의 모든 것을 삼킬 것입니다
  lexicon: HALOT
  rationale: 불이 주어이므로 ‘삼키다’는 ‘consume’의 화상적 의미를 자연스럽게 살립니다. ‘그 둘레의 모든 것’은 סְבִיבֶיהָ의 포괄성을 비교적 충실하게 옮깁니다.
theological_decisions:
- issue: 야훼의 발화와 예언 공식을 한국어로 어떻게 살릴지
  chosen_reading: ‘—야훼의 말씀이니라—’로 예언적 선포를 분명히 표시했습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 선언입니다’
  rationale: 원문 נְאֻם יְהוָה는 단순한 인용부호가 아니라 예언권위 공식을 형성하므로, 본문 안에서 구분된 선포문으로 처리해 화자의 권위를 보존했습니다.
  doctrine_reference: 'POB translation philosophy: preserve prophetic authority and source-level discourse markers'
- issue: ‘그녀의 숲’의 여성형 지시를 해소할지 여부
  chosen_reading: 주본문에서는 ‘그녀의’와 ‘숲’을 유지해 여성형 지시와 비유를 그대로 남겼습니다.
  alternative_readings:
  - ‘그의 숲’으로 중화
  - ‘예루살렘의 숲’으로 명시
  rationale: 히브리어의 여성 접미사는 의인화된 도성을 가리키는 문학적 장치이므로, 본문에서 이를 과잉 해석해 특정 대상을 명시하기보다 긴장을 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: 'POB translation philosophy: preserve tension rather than resolve it'
