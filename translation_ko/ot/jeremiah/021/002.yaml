  naturalness: ‘야훼께 문의하십시오’는 현대 행정·상업 문의의 어감이 있어 신탁을 청하는 장면에는 ‘야훼께 여쭈어 보십시오’가 더 자연스럽습니다. 결과 관계는 ‘…행하시면, 그가 … 물러갈 것입니다’로 표현하면 현대 합쇼체에서 명료하면서도 문맥의 기대를 잘 전달합니다.
