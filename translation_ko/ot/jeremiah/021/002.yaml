id: JER.21.2
reference: Jeremiah 21:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דְּרָשׁ נָ֤א בַעֲדֵ֨/נוּ֙ אֶת יְהוָ֔ה כִּ֛י נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל נִלְחָ֣ם עָלֵ֑י/נוּ אוּלַי֩ יַעֲשֶׂ֨ה יְהוָ֤ה אוֹתָ֨/נוּ֙ כְּ/כָל נִפְלְאֹתָ֔י/ו וְ/יַעֲלֶ֖ה מֵ/עָלֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/002.yaml
  text: Please inquire of Yahweh on our behalf[a], because Nebuchadnezzar king of Babylon is fighting against us. Perhaps Yahweh will act for us according to all his wondrous acts[c][b], so that he will withdraw from us.
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to all his wondrous acts''; that is, according to the pattern of the LORD''s extraordinary saving deeds in the past.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Nebuchadrezzar,' reflecting the Hebrew spelling more closely.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'and he will go up from upon us,' an idiom here meaning that the attacking king would withdraw from against us.
    reason: lexical_alternative
translation:
  language: ko
  text: 부디 우리를 위하여 야훼께 문의하십시오[a]. 바벨론 왕 느부갓레살이 우리와 싸우고 있기 때문입니다. 아마도 야훼께서 자기의 모든 놀라운 행위에 따라 우리를 위하여 일하시고[b], 그가 우리에게서 물러가게 하실 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야훼께 구하십시오’에 가깝습니다. 여기서는 예언적 응답을 청하는 청유로 풀었습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘그의 모든 놀라운 일들에 따라’입니다. 곧 과거에 보이신 야훼의 경이로운 구원 행동의 패턴을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘우리 위에서 올라가게 하실 것입니다’입니다. 군사적 관용구로서 ‘물러가게 하실 것입니다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָשׁ נָא
  english_pob_choice: Please inquire
  chosen_korean: 부디 … 문의하십시오
  alternatives_korean:
  - 부디 … 구하십시오
  - 부디 … 여쭈어보십시오
  lexicon: HALOT
  rationale: דרש + נא는 단순한 ‘찾다’보다 예언적 답변을 구하는 요청이므로, 현대 한국어에서는 ‘문의하십시오’가 가장 자연스럽게 그 공손한 청유와 신탁 요청의 뉘앙스를 살립니다.
- source_word: בַעֲדֵנוּ
  english_pob_choice: on our behalf
  chosen_korean: 우리를 위하여
  alternatives_korean:
  - 우리를 대신하여
  - 우리 편에서
  lexicon: HALOT
  rationale: בעד는 중보·대리의 뜻을 가지므로 ‘우리를 위하여’가 간결하면서도 중재 요청의 의미를 살립니다.
- source_word: נִלְחָם עָלֵינוּ
  english_pob_choice: is fighting against us
  chosen_korean: 우리와 싸우고 있기 때문입니다
  alternatives_korean:
  - 우리를 상대로 싸우고 있기 때문입니다
  - 우리에게 전쟁을 벌이고 있기 때문입니다
  lexicon: HALOT
  rationale: 현재 진행 중인 적대 행위를 드러내기 위해 ‘싸우고 있습니다’ 계열로 옮기되, 문장 흐름상 이유절로 자연스럽게 정리했습니다.
- source_word: נִפְלְאֹתָיו
  english_pob_choice: his wondrous acts
  chosen_korean: 자기의 모든 놀라운 행위
  alternatives_korean:
  - 그의 모든 놀라운 일
  - 그의 모든 기이한 행위
  lexicon: HALOT
  rationale: נפלאות는 단순한 ‘좋은 일’이 아니라 경이로운 구원 행위를 가리키므로, ‘놀라운 행위’로 옮겨 하나님의 역사라는 점을 유지했습니다.
- source_word: וְיַעֲלֶה מֵעָלֵינוּ
  english_pob_choice: so that he will withdraw from us
  chosen_korean: 그가 우리에게서 물러가게 하실 것입니다
  alternatives_korean:
  - 그가 우리에게서 떠나게 하실 것입니다
  - 그가 우리 위에서 올라가게 하실 것입니다
  lexicon: HALOT
  rationale: עלה מן/מעל의 군사적 관용구를 한국어로는 ‘물러가다’로 풀어야 의미가 분명해지므로, 침공군의 철수를 드러내는 방향을 택했습니다.
- source_word: נְבוּכַדְרֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓레살
  alternatives_korean:
  - 느부갓네살
  lexicon: HALOT
  rationale: 히브리어 철자에 더 가까운 음역을 반영해 ‘느부갓레살’을 채택했습니다. 영어 관용형과는 다르지만, 본문 표기와의 대응성을 높입니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명기 이름을 사용하므로, 관례적 치환어보다 고유명을 유지하는 ‘야훼’가 소스에 더 충실합니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH → 야훼'
- issue: 야훼의 ‘행위’ 표현
  chosen_reading: 자기의 모든 놀라운 행위에 따라 우리를 위하여 일하시고
  alternative_readings:
  - 우리에게 은혜를 베푸시고
  - 우리 편에서 행동하시고
  rationale: 본문은 과거의 구원 행위를 현재 요청의 근거로 삼고 있으므로, 단순한 호의보다 ‘놀라운 행위’의 패턴을 다시 기대하는 구조를 살렸습니다.
  doctrine_reference: 문맥상 언약적 구원 행동에 대한 호소
