  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֣י מֵסֵב֮ אֶת כְּלֵ֣י הַ/מִּלְחָמָה֮ אֲשֶׁ֣ר בְּ/יֶדְ/כֶם֒ אֲשֶׁ֨ר אַתֶּ֜ם נִלְחָמִ֣ים בָּ֗/ם אֶת מֶ֤לֶךְ בָּבֶל֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים הַ/צָּרִ֣ים עֲלֵי/כֶ֔ם מִ/ח֖וּץ לַֽ/חוֹמָ֑ה וְ/אָסַפְתִּ֣י אוֹתָ֔/ם אֶל תּ֖וֹךְ הָ/עִ֥יר הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/004.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Behold, I am turning back the weapons of war that are in your hands, with which you are fighting against the king of Babylon and against the Chaldeans who are besieging you outside the wall, and I will gather them into the midst of this city.'
  footnotes:
  - marker: a
    text: Or, 'and I will gather them' may refer to the king of Babylon and the Chaldeans, meaning that God will bring the enemy forces into the city.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “보십시오, 내가 여러분의 손에 있는 전쟁 무기들을 되돌리고 있습니다. 그 무기들로 여러분이 바벨론 왕과 성벽 밖에서 여러분을 포위하고 있는 갈대아인들을 상대로 싸우고 있습니다. 내가 그것들을 이 도시 한가운데로 모으겠습니다.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 해석으로는 ‘내가 그것들을 모으겠다’의 ‘그것들’이 바벨론 왕과 갈대아인들을 가리켜, 하나님께서 적군을 이 도시 안으로 끌어들이신다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 여호와, 이스라엘의 하나님
  - 주, 이스라엘의 하나님
  lexicon: HALOT
  rationale: יהוה는 POB의 원칙에 따라 고유명사로 옮기고, אֱלֹהֵי יִשְׂרָאֵל은 관계를 분명히 드러내는 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 있습니다
  lexicon: HALOT
  rationale: 예언적 선언의 긴박함을 살리면서도 현대 한국어 합쇼체에 맞는 호소형으로 옮겼습니다.
- source_word: מֵסֵב אֶת כְּלֵי הַמִּלְחָמָה
  english_pob_choice: I am turning back the weapons of war
  chosen_korean: 전쟁 무기를 되돌려 놓으려고 합니다
  alternatives_korean:
  - 전쟁 무기를 되돌리고 있습니다
  - 전쟁 무기를 돌이키겠습니다
  lexicon: HALOT
  rationale: מֵסֵב의 ‘되돌리다/돌리다’ 이미지를 살리되, 문맥상 임박한 신적 행위를 자연스러운 한국어로 표현했습니다.
- source_word: אֶל תּוֹךְ הָעִיר
  english_pob_choice: into the midst of this city
  chosen_korean: 이 도시 한가운데로
  alternatives_korean:
  - 이 도시 안으로
  - 이 도시의 한복판으로
  lexicon: HALOT
  rationale: תּוֹךְ의 내부성·중심성을 살려 단순한 ‘안으로’보다 ‘한가운데로’가 더 정확하다고 보았습니다.
theological_decisions:
- issue: וְאָסַפְתִּי אוֹתָם의 대명사 ‘그것들’의 지시 대상
  chosen_reading: POB의 본문처럼 ‘전쟁 무기’를 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 바벨론 왕과 갈대아인들을 가리킨다는 해석
  rationale: 가장 가까운 선행어는 כְּלֵי הַמִּלְחָמָה이며, ‘무기를 되돌려 놓고 그것들을 모으다’라는 흐름이 심판 선언으로 자연스럽게 이어집니다. 다만 대안 독법도 가능하므로 본문 의미를 해치지 않는 범위에서 반영했습니다.
  doctrine_reference: 예언문맥의 지시대상 해석
