    rationale: 히브리어의 중심 술어는 ‘내가 … 싸우겠다’입니다. 도구·상태를 나타내는 여러 전치사구 뒤에 ‘하겠습니다’만 두면 무엇을 하겠다는 것인지 불명확해집니다.
