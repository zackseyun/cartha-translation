source:
  edition: WLC
  text: וְ/נִלְחַמְתִּ֤י אֲנִי֙ אִתְּ/כֶ֔ם בְּ/יָ֥ד נְטוּיָ֖ה וּ/בִ/זְר֣וֹעַ חֲזָקָ֑ה וּ/בְ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֥צֶף גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/005.yaml
  text: And I myself will fight against you with an outstretched hand and a strong arm[b][a], and with anger and wrath and great fury.
  footnotes:
  - marker: a
    text: Hebrew 'with an outstretched hand and a strong arm,' a stock expression for decisive divine power, often used in exodus contexts but here turned toward judgment.
    reason: cross_reference
  - marker: b
    text: Or 'and great wrath' for 'and great fury.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 친히 너희를 대적하여 뻗은 손과 강한 팔로, 또 분노와 진노와 큰 격분으로 싸우겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘뻗은 손과 강한 팔’은 하나님의 결정적인 권능을 가리키는 관용적 표현으로, 출애굽 문맥에서 흔히 쓰이지만 여기서는 심판을 향해 사용됩니다.
    reason: cross_reference
  - marker: b
    text: ‘큰 격분’은 ‘큰 진노’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחַמְתִּי
  english_pob_choice: will fight
  chosen_korean: 싸우겠으며
  alternatives_korean:
  - 전쟁을 벌이겠으며
  - 대적하겠으며
  lexicon: HALOT
  rationale: נלחם의 1인칭 미래형을 자연스러운 현대 한국어로 옮기되, 단순한 감정적 대립이 아니라 실제 적대 행위를 드러내는 ‘싸우다’를 택했습니다.
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가 친히
  alternatives_korean:
  - 나
  - 내가 바로
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어의 ‘친히’로 살려, 여호와께서 직접 행동하신다는 점을 분명히 했습니다.
- source_word: בְּיָד נְטוּיָה וּבִזְרֹעַ חֲזָקָה
  english_pob_choice: with an outstretched hand and a strong arm
  chosen_korean: 뻗은 손과 강한 팔로
  alternatives_korean:
  - 펴신 손과 강한 팔로
  - 뻗으신 손과 강한 팔로
  - 뻗은 손과 힘센 팔로
  lexicon: HALOT
  rationale: 출애굽-심판 문맥에서 반복되는 관용적 신체 이미지이므로 직역적 이미지를 유지하되, 한국어에서는 도구격을 자연스럽게 살렸습니다.
- source_word: וּבְאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  english_pob_choice: with anger and wrath and great fury
  chosen_korean: 분노와 진노와 큰 격분으로
  alternatives_korean:
  - 노와 진노와 큰 격노로
  - 분노와 분노와 큰 진노로
  lexicon: HALOT
  rationale: 연속되는 심판 감정어를 각각 구분해 중첩된 강도를 살렸습니다. ‘קֶצֶף גָּדוֹל’은 최종 고조를 드러내는 ‘큰 격분’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 신체 이미지 보존
  chosen_reading: ‘뻗은 손과 강한 팔’의 형상을 그대로 유지했습니다.
  alternative_readings:
  - ‘큰 능력으로’로 풀어쓰기
  rationale: 본문의 관용적·상호본문적 이미지는 출애굽과 심판을 함께 떠올리게 하므로, 의미를 평탄화하지 않고 그대로 살리는 편이 소스에 충실합니다.
  doctrine_reference: 원문 우선 원칙; 심판과 구원의 동일한 능력어를 보존
