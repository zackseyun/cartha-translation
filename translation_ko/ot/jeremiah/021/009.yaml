id: JER.21.9
reference: Jeremiah 21:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב וּ/בָ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יּוֹצֵא֩ וְ/נָפַ֨ל עַל הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עֲלֵי/כֶם֙ יחיה וְ/הָֽיְתָה לּ֥/וֹ נַפְשׁ֖/וֹ לְ/שָׁלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/009.yaml
  text: The one who stays in this city will die by the sword[a], by famine, and by pestilence; but the one who goes out and defects to the Chaldeans who are besieging you will live[b], and his life will be to him as plunder.
  footnotes:
  - marker: a
    text: Or 'defects to the Chaldeans.' The Hebrew idiom 'falls over to' can denote going over to the enemy.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his life will be to him for plunder,' an idiom meaning he will escape with only his life.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 성 안에 머무는 사람은 칼과 기근과 전염병으로 죽을 것입니다. 그러나 나가서 여러분을 포위하는 갈대아 사람들에게 항복하는 사람은 살 것이며, 그의 생명은 자기에게 노획물이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘갈대아 사람들에게로 떨어지는/넘어가는’이라는 관용구입니다. 군사·정치 문맥에서는 적에게 항복하거나 투항하는 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 생명이 그에게 노획물이 될 것이다’입니다. 곧 재난 속에서도 목숨만 건져 빠져나온다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב ... בָּעִיר הַזֹּאת
  english_pob_choice: the one who stays in this city
  chosen_korean: 이 성 안에 머무는 사람
  alternatives_korean:
  - 이 성에 사는 사람
  - 이 성에 남는 사람
  - 이 성 안에 있는 사람
  lexicon: HALOT
  rationale: 포위 상황에서의 יושב는 단순한 ‘앉다’가 아니라 ‘머무르다/남다’의 뜻이므로, 현대 한국어에서 자연스러운 ‘머무는 사람’으로 옮겼습니다.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  english_pob_choice: by the sword, by famine, and by pestilence
  chosen_korean: 칼과 기근과 전염병으로
  alternatives_korean:
  - 칼과 기근과 역병으로
  - 전쟁과 기근과 전염병으로
  lexicon: HALOT
  rationale: 예레미야의 정형적 심판 삼중구를 그대로 살리되, חרב은 ‘칼’로 구체성을 유지하고 דבר는 심판 문맥의 관용적 의미를 반영해 ‘전염병’으로 옮겼습니다.
- source_word: וְנָפַל עַל הַכַּשְׂדִּים
  english_pob_choice: defects to the Chaldeans
  chosen_korean: 갈대아 사람들에게 항복하는
  alternatives_korean:
  - 갈대아 사람들에게 넘어가는
  - 갈대아 사람들에게 투항하는
  - 갈대아 사람들에게 귀순하는
  lexicon: HALOT
  rationale: נפל על은 군사·정치적 문맥에서 적진으로 ‘넘어가다/항복하다’는 뜻이므로, 한국어에서는 의미가 분명한 ‘항복하는’으로 풀어 썼습니다.
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  english_pob_choice: his life will be to him as plunder
  chosen_korean: 그의 생명은 자기에게 노획물이 될 것입니다
  alternatives_korean:
  - 그의 생명은 자기에게 전리품이 될 것입니다
  - 그는 목숨만 건질 것입니다
  - 그의 목숨이 그의 전리품이 될 것입니다
  lexicon: HALOT
  rationale: נפש는 여기서 ‘영혼’이 아니라 생존한 ‘생명/목숨’을 가리키며, לְשָׁלָל의 비유를 살려 ‘노획물’로 옮겨 원문 이미지를 유지했습니다.
theological_decisions:
- issue: נפש의 번역이 인간 실체론을 암시할 가능성
  chosen_reading: ‘생명’으로 번역해 물리적 생존의 의미를 드러냈습니다.
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 이 절은 포위와 생존의 맥락이므로, ‘영혼’은 본문에 없는 신학적 함의를 덧씌울 수 있습니다. ‘생명’은 히브리어 관용구를 더 정확히 반영합니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 의미를 보존하고, 본문이 말하지 않는 교리를 덧붙이지 않습니다.'
