id: JER.21.10
reference: Jeremiah 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י שַׂ֣מְתִּי פָ֠נַ/י בָּ/עִ֨יר הַ/זֹּ֧את לְ/רָעָ֛ה וְ/לֹ֥א לְ/טוֹבָ֖ה נְאֻם יְהוָ֑ה בְּ/יַד מֶ֤לֶךְ בָּבֶל֙ תִּנָּתֵ֔ן וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/010.yaml
  text: For I have set my face against this city for harm and not for good[a], declares Yahweh. It will be given into the hand of the king of Babylon[b], and he will burn it with fire.
  footnotes:
  - marker: a
    text: Or 'for disaster' or, more literally, 'for evil.' The Hebrew רָעָה here refers to calamity or harmful judgment, not moral evil by God.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of the king of Babylon,' an idiom meaning into his power.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 성읍을 해치고 좋게 하지 않으려고 이 성읍을 대적하여 내 얼굴을 정하였기 때문입니다[a]. 야훼의 말씀입니다. 이 성읍은 바벨론 왕의 손에 넘겨질 것이며[b], 그가 불로 그것을 태울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재앙을 내리려고’. 더 문자적으로는 ‘해악을 위해’. 여기서 히브리어 רָעָה는 야훼께서 도덕적 악을 행하신다는 뜻이 아니라 재난 또는 해로운 심판을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바벨론 왕의 손에’입니다. 이는 그의 권세 아래로 넘겨진다는 뜻의 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתִּי פָנַי
  english_pob_choice: I have set my face against
  chosen_korean: 내 얼굴을 향하고 있기 때문입니다
  alternatives_korean:
  - 내 얼굴을 돌리고 있기 때문입니다
  - 내 얼굴을 그 성읍을 향해 두었기 때문입니다
  lexicon: HALOT
  rationale: ‘얼굴을 두다/향하다’의 히브리어 관용을 살리되, 한국어에서는 ‘~을 향하고 있다’로 적대적 결심을 자연스럽게 드러냈습니다.
- source_word: לְרָעָה
  english_pob_choice: for harm
  chosen_korean: 해롭게
  alternatives_korean:
  - 재앙으로
  - 악으로
  lexicon: HALOT
  rationale: 이 어형은 도덕적 악이 아니라 심판의 재난·해악을 뜻하므로, 하나님께 도덕적 악을 돌리지 않으면서도 문맥의 파괴적 의미를 살렸습니다.
- source_word: וְלֹא לְטוֹבָה
  english_pob_choice: and not for good
  chosen_korean: 복되게 하지 않으려고
  alternatives_korean:
  - 좋게 하지 않으려고
  - 평안하게 하지 않으려고
  lexicon: HALOT
  rationale: ‘좋음’의 대조를 유지하면서도 한국어에서 예언적 문맥에 자연스럽고, 앞의 ‘해롭게’와 짝을 이루도록 정리했습니다.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  english_pob_choice: into the hand of the king of Babylon
  chosen_korean: 바벨론 왕의 손에 넘겨질 것이며
  alternatives_korean:
  - 바벨론 왕의 손으로 넘겨질 것이며
  - 바벨론 왕의 권세 아래 들어갈 것이며
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용을 유지하되, 한국어에서는 ‘넘겨지다’로 그의 권세 아래 들어감을 분명히 했습니다.
- source_word: וּשְׂרָפָהּ
  english_pob_choice: and he will burn it
  chosen_korean: 그는 그것을 불로 불사를 것입니다
  alternatives_korean:
  - 그는 그것을 불사를 것입니다
  - 그는 그것을 불로 태울 것입니다
  lexicon: HALOT
  rationale: 주어가 바벨론 왕 쪽으로 이어지는 능동형을 살렸고, ‘불로’는 뒤의 כלי/수단 표현을 드러내기 위해 유지했습니다.
theological_decisions:
- issue: יְהוָה의 번역과 예언적 공식을 한국어로 어떻게 보일지
  chosen_reading: 야훼의 말씀이십니다
  alternative_readings:
  - 여호와의 말씀입니다
  - 주님의 말씀입니다
  rationale: 문서의 기본 원칙에 따라 신적 고유명은 ‘야훼’로 옮기고, נְאֻם יְהוָה의 예언적 선언 공식을 공손한 종결로 살렸습니다.
  doctrine_reference: Tetragrammaton rendering policy; prophetic speech formula register
- issue: 신적 심판 진술이 도덕적 악을 뜻하는지의 문제
  chosen_reading: 해롭게 하고 복되게 하지 않으려고
  alternative_readings:
  - 악하게 하고 선하게 하지 않으려고
  - 재앙을 주고 복을 주지 않으려고
  rationale: 본문의 רָעָה는 하나님이 도덕적 악을 행한다는 뜻이 아니라 성읍에 대한 심판·재난을 가리키므로, 의미를 보존하면서 오해를 피하는 번역을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve lexical/theological tension without importing an unnecessary doctrinal confusion'
