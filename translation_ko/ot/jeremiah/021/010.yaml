  verdict: revise
  source_fidelity: ‘내 얼굴을 향하고’는 שַׂמְתִּי פָנַי의 적대적 관용 의미(‘얼굴을 ... 맞서/대적하여 정하다’)를 드러내지 못하며, 한국어 문장 안에서 목적어도 불분명합니다. 또한 ‘복되게’는 טוֹבָה의 넓은 ‘좋음/유익’보다 다소 좁고 신학적으로 색채가 강합니다. 수정문은 원문의 확정된 적대, 재앙적 목적, 수동적 인도, 바벨론 왕을 가리키는 능동적 소각을 보존합니다.
  naturalness: 수정문은 현대 표준어 합쇼체에서 자연스럽고, 예언 선언의 엄숙한 문체를 유지합니다. ‘이 성읍을 대적하여 내 얼굴을 정하였다’는 히브리어 관용을 직역투로 흐리지 않으면서도 그 결연한 적대 의미를 명확히 합니다.
  terminology: ‘야훼’는 제공된 명칭 정책과 일치합니다. רָעָה는 문맥상 도덕적 악이 아니라 해악·재앙적 심판이므로 ‘해치고’로 옮겼습니다. טוֹבָה는 ‘좋게 하지’로 넓게 유지했습니다. ‘바벨론 왕의 손에’ 및 각주에서 권세의 관용 의미를 보존했습니다.
