reference: Jeremiah 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֤ם הַ/זֶּה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֤י נֹתֵן֙ לִ/פְנֵי/כֶ֔ם אֶת דֶּ֥רֶךְ הַ/חַיִּ֖ים וְ/אֶת דֶּ֥רֶךְ הַ/מָּֽוֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/008.yaml
  text: 'And to this people you shall say[a], ‘Thus says Yahweh: Behold, I am setting before you the way of life and the way of death.’'
  footnotes:
  - marker: a
    text: Or “I am giving before you”; Hebrew literally uses “giving,” but the idiom means “setting before” or “placing before” as an offered alternative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 백성에게 너는 이렇게 말해야 합니다. “야훼께서 이렇게 말씀하십니다. 보라, 내가 너희 앞에 생명의 길과 죽음의 길을 두고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נֹתֵן은 문자적으로는 “주다”이지만, כאן은 “앞에 두다/제시하다”의 관용적 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל הָ/עָם הַ/זֶּה
  english_pob_choice: And to this people
  chosen_korean: 그리고 이 백성에게
  alternatives_korean:
  - 이 백성에게
  - 그리고 이 ხალხ에게
  lexicon: HALOT
  rationale: 연결 접속사와 전치사는 앞 문맥과의 연속성을 살려 ‘그리고’로, הָעָם הַזֶּה는 집합적 단수 뉘앙스를 보존하는 ‘이 백성’으로 옮겼습니다.
- source_word: תֹּאמַר
  english_pob_choice: you shall say
  chosen_korean: 너는 이렇게 말해야 합니다
  alternatives_korean:
  - 너는 말할 것입니다
  - 너는 말하십시오
  lexicon: HALOT
  rationale: 예언자에게 주어진 지시를 현대 한국어의 자연스러운 명령·지시형으로 전달하되, 본문의 전달문 기능을 살리기 위해 ‘이렇게’와 함께 풀어 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명 יְהוָה는 전통적 대체 칭호가 아니라 고유명 표기 ‘야훼’로 옮겼습니다.
- source_word: הִנְנִי נֹתֵן לִפְנֵיכֶם
  english_pob_choice: Behold, I am setting before you
  chosen_korean: 보라, 내가 너희 앞에 … 두고 있습니다
  alternatives_korean:
  - 보라, 내가 너희 앞에 … 놓고 있습니다
  - 보라, 내가 너희 앞에 … 주고 있습니다
  lexicon: HALOT
  rationale: הִנְנִי의 장중한 즉시성을 ‘보라’로, נֹתֵן לִפְנֵיכֶם의 관용적 의미를 ‘너희 앞에 두다’로 살려, 영어 POB의 ‘setting before’와 같은 의미 효과를 한국어로 자연스럽게 재현했습니다.
- source_word: דֶּרֶךְ הַחַיִּים וְאֶת דֶּרֶךְ הַמָּוֶת
  english_pob_choice: the way of life and the way of death
  chosen_korean: 생명의 길과 죽음의 길
  alternatives_korean:
  - 삶의 길과 죽음의 길
  - 살아 있는 길과 죽음의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ을 ‘길’로, חַיִּים/מָוֶת의 대조를 한국어에서 가장 분명하게 드러내는 ‘생명/죽음’으로 옮겨 예언적 선택의 대비를 보존했습니다.
theological_decisions:
- issue: 여호와 대체 표기 대신 신적 고유명 사용
  chosen_reading: ‘야훼께서 이렇게 말씀하십니다’
  alternative_readings:
  - ‘주님께서 이렇게 말씀하십니다’
  - ‘여호와께서 이렇게 말씀하십니다’
  rationale: 본문의 ענין은 예언 공식 안에 직접 나타나는 YHWH의 고유한 발화이므로, 원문이 드러내는 언약 이름을 표준 대체칭호로 평준화하지 않고 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언자 전달문과 직접 발화의 문체
  chosen_reading: 서술부는 합쇼체로 유지하고, উদ্ধון 부호 안의 신적 발화도 합쇼체로 유지했습니다.
  alternative_readings:
  - 직접 발화 내부를 더 구어적으로 낮추는 방식
  - 모든 부분을 동일한 평서체로 평준화하는 방식
  rationale: 이 절은 예언자에게 전달된 신탁을 인용하는 구조이므로, 한국어에서도 독자에게 공적 선언의 위압감이 전달되도록 공손한 합쇼체를 일관되게 사용했습니다.
  doctrine_reference: 표준 한국어 문체 원칙
