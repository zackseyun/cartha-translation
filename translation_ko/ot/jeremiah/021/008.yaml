  rationale: 합쇼체 문체를 일관되게 적용하고, 지시 대상에 대한 친칭-존대 혼용을 해소했습니다. 또한 נֹתֵן לִפְנֵיכֶם의 문맥적 의미를 ‘제시하고 있습니다’로 명료하게 옮기고, 각주의 불필요한 히브리어 혼입을 수정했습니다. 야훼, 생명의 길, 죽음의 길 및 현재적 제시의 의미는 유지했습니다.
