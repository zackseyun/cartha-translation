translation:
  language: ko
  text: 야훼로부터 예레미야에게 임한 말씀은 이러합니다. 시드기야 왕이 말기야의 아들 바스훌과 마아세야의 아들 제바냐 제사장을 그에게 보내어 이르기를,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 '야훼로부터'입니다.
