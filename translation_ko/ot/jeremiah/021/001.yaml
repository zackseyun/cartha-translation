lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  english_pob_choice: The word that came to Jeremiah
  chosen_korean: 예레미야에게 임한 말씀
  alternatives_korean:
  - 예레미야에게 온 말씀
  - 예레미야에게 이른 말씀
  lexicon: HALOT
  rationale: 예언서 서문 공식에서 דָּבָר는 단순한 '말'보다 계시된 '말씀'이 자연스럽고, '임한'은 מקור/도달의 뉘앙스를 살리면서 한국어에서도 예언 공식의 격식을 유지합니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼로부터
  alternatives_korean:
  - 여호와로부터
  - 주님으로부터
  lexicon: HALOT
  rationale: 본문의 신명은 원문대로 야훼로 옮겨 프로젝트 기본어를 따랐습니다. 전치사 מֵאֵת의 출처 의미는 '로부터'가 가장 सीधे합니다.
- source_word: בִּשְׁלֹחַ אֵלָיו הַמֶּלֶךְ צִדְקִיָּהוּ
  english_pob_choice: when King Zedekiah sent to him
  chosen_korean: 시드기야 왕이 ... 그에게 보내어
  alternatives_korean:
  - 시드기야 왕이 ... 그에게 보냈을 때
  - 시드기야 왕이 ... 그를 보냈을 때
  lexicon: HALOT
  rationale: בְּ + 부정사구의 시간적 용법을 한국어의 연결형 '보내어'로 처리해, 사건 배경을 간결하게 이어 주면서 원문의 종속 관계를 보존했습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장을
  alternatives_korean:
  - 그 제사장을
  - 제사장
  lexicon: HALOT
  rationale: 문맥상 '제바냐'를 수식하는 동격적 직함이므로 한국어에서는 인명 뒤에 직함을 붙여 '제바냐 제사장'으로 자연스럽게 살렸습니다.
theological_decisions:
