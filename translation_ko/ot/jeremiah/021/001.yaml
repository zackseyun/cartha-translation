base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/001.yaml
  text: The word that came to Jeremiah from Yahweh when King Zedekiah sent to him Pashhur son of Malchiah and Zephaniah son of Maaseiah the priest[a], saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''from Yahweh.'' The main text follows the project’s standard rendering of the divine name as ''the LORD.'''
