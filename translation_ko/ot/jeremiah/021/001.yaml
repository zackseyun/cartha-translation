  rationale: 본 절은 신명기적 계시 주체를 직접 가리키므로, 프로젝트 기본 원칙에 따라 전통 교회어보다 원문에 가까운 '야훼'를 본문에 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
