  text: וְ/אַחֲרֵי כֵ֣ן נְאֻם יְהוָ֡ה אֶתֵּ֣ן אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֣ה וְ/אֶת עֲבָדָ֣י/ו וְ/אֶת הָ/עָ֡ם וְ/אֶת הַ/נִּשְׁאָרִים֩ בָּ/עִ֨יר הַ/זֹּ֜את מִן הַ/דֶּ֣בֶר מִן הַ/חֶ֣רֶב וּ/מִן הָ/רָעָ֗ב בְּ/יַד֙ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וּ/בְ/יַד֙ אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הִכָּ֣/ם לְ/פִי חֶ֔רֶב לֹֽא יָח֣וּס עֲלֵי/הֶ֔ם וְ/לֹ֥א יַחְמֹ֖ל וְ/לֹ֥א יְרַחֵֽם־־־־־׀־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/007.yaml
  text: And after that[a], declares Yahweh, I will give Zedekiah king of Judah, his servants, the people, and those left in this city from the plague, from the sword, and from the famine into the hand of Nebuchadnezzar king of Babylon, into the hand of their enemies, and into the hand of those seeking their life; and he will strike them down with the edge of the sword. He will not spare them or have pity or compassion.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; traditionally rendered ''Nebuchadnezzar'' in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 뒤에 야훼의 말씀입니다. 내가 유다 왕 시드기야와 그의 신하들과 백성과, 전염병과 칼과 기근에서 이 성읍에 남아 있는 자들을 바빌론 왕 느부갓네살[a]의 손에, 그들의 원수들의 손에, 또 그들의 목숨을 노리는 자들의 손에 넘겨주겠습니다. 그가 그들을 칼날로 죽일 것이며, 그들을 아끼지도 불쌍히 여기지도 긍휼히 여기지도 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘네부카드레살’에 더 가까운 철자를 지니지만, 한국어 본문에서는 통용되는 ‘느부갓네살’을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: And after that
  chosen_korean: 그리고 그 뒤에
  alternatives_korean:
  - 그리고 그 후에
  - 그 뒤에
  lexicon: HALOT
  rationale: 앞선 심판 행위 뒤에 이어지는 시간적 전환을 자연스럽게 살리면서, 히브리어의 순서를 보존했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식의 엄숙함을 살리되 한국어에서는 현대 합쇼체로 처리했고, 신명의 직접 표기를 유지했습니다.
- source_word: הַנִּשְׁאָרִים
  english_pob_choice: those left
  chosen_korean: 남아 있는 자들
  alternatives_korean:
  - 남은 자들
  - 생존자들
  lexicon: HALOT
  rationale: 문맥상 전멸 뒤에 남은 사람들을 가리키므로, 신학적으로 고정된 ‘남은 자’보다 중립적인 현재분사를 택했습니다.
- source_word: מִן הַדֶּבֶר מִן הַחֶרֶב וּמִן הָרָעָב
  english_pob_choice: from the plague, from the sword, and from the famine
  chosen_korean: 전염병과 칼과 기근에서
  alternatives_korean:
  - 전염병과 칼과 기근으로부터
  - 역병과 칼과 기근에서
  lexicon: HALOT
  rationale: 세 가지 재앙의 반복 구조를 한국어에서는 간결하게 묶되, 원문의 심판 목록은 유지했습니다.
- source_word: נְבוּכַדְרֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓네살르
  - 느부카드네살
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 정착된 인명형을 따랐습니다. 본문의 히브리어 철자 차이는 주석 처리 없이 번역문 내부에서는 반영하지 않았습니다.
- source_word: לְפִי חֶרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 검날로
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기면서도, 단순히 ‘칼로’로 완화하지 않고 치명적 폭력을 드러냈습니다.
- source_word: לֹא יָחוּס ... וְלֹא יַחְמֹל וְלֹא יְרַחֵם
  english_pob_choice: He will not spare them or have pity or compassion
  chosen_korean: 아끼지도, 불쌍히 여기지도, 긍휼히 여기지도 않을 것입니다
  alternatives_korean:
  - 불쌍히 여기지 않고 긍휼도 베풀지 않을 것입니다
  - 용서하지도, 불쌍히 여기지도, 긍휼히 여기지도 않을 것입니다
  lexicon: HALOT
  rationale: 세 동의어를 구분해 누적되는 무자비함을 보존하되, 한국어에서는 의미상 이어지는 부정 어구로 자연스럽게 배열했습니다.
theological_decisions:
- issue: 예언자적 전달 공식을 한국어에서 어떻게 들리게 할 것인가
  chosen_reading: ‘야훼의 말씀이십니다’로 옮겨 예언의 권위와 직접성을 드러냈습니다.
  alternative_readings:
  - ‘주님의 말씀이십니다’
  - ‘야훼께서 말씀하십니다’
  rationale: 원문은 נְאֻם יְהוָה의 공식적 선포이며, 본문 화자의 발화가 아니라 야훼의 직접 말씀임을 명확히 해야 합니다. 한국어 합쇼체를 쓰되, 신명은 그대로 유지했습니다.
  doctrine_reference: 예언자적 발화 공식 / YHWH의 직접 발화
