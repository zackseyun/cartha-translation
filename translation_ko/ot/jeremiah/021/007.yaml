revisions:
- from: 그리고 그 뒤에 — 야훼의 말씀이십니다 — 내가 유다 왕 시드기야와 그의 신하들, 백성, 그리고 이 성읍에 남아 있는 자들, 곧 전염병과 칼과 기근에서 살아남은 자들을 바빌론 왕 느부갓네살의 손과 그들의 원수들의 손과 그들의 생명을 찾는 자들의 손에 넘겨주겠습니다. 그는 그들을 칼날로 치고, 그들을 아끼지도, 불쌍히 여기지도, 긍휼히 여기지도 않을 것입니다.[a]
  to: 그리고 그 뒤에 야훼의 말씀입니다. 내가 유다 왕 시드기야와 그의 신하들과 백성과, 전염병과 칼과 기근에서 이 성읍에 남아 있는 자들을 바빌론 왕 느부갓네살[a]의 손에, 그들의 원수들의 손에, 또 그들의 목숨을 노리는 자들의 손에 넘겨주겠습니다. 그가 그들을 칼날로 죽일 것이며, 그들을 아끼지도 불쌍히 여기지도 긍휼히 여기지도 않을 것입니다.
  rationale: 원문의 예언 공식과 ‘손에 넘겨주다’의 반복을 보존하면서 한국어 문장을 다듬었습니다. ‘목숨을 노리는 자들’로 히브리어 관용 표현을 자연스럽게 옮겼고, 폭력적 심판의 의미를 추가하거나 완화하지 않고 ‘칼날로 죽일 것’으로 명료하게 표현했습니다. 각주 표지는 설명 대상인 인명에 붙였습니다.
