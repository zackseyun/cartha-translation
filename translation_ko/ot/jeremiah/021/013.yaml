source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלַ֜יִ/ךְ יֹשֶׁ֧בֶת הָ/עֵ֛מֶק צ֥וּר הַ/מִּישֹׁ֖ר נְאֻם יְהוָ֑ה הָ/אֹֽמְרִים֙ מִֽי יֵחַ֣ת עָלֵ֔י/נוּ וּ/מִ֥י יָב֖וֹא בִּ/מְעוֹנוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
  footnotes:
  - marker: a
    text: Or, 'Who will descend against us?' The Hebrew verb in this clause is difficult; the sense is that the city considers itself secure from attack.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'dwellings'; possibly with the nuance of secure habitations or strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 너를 대적합니다. 골짜기에 사는 자여, 평지의 바위여, — 여호와의 말씀이니라 — 너희는 “누가 우리를 치러 내려오겠느냐? 누가 우리의 거처들에 들어오겠느냐?”라고 말합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 난해하며, 문맥상 이 도성이 공격을 받지 않을 만큼 안전하다고 여기는 뉘앙스를 담고 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘거처들’은 히브리어 ‘거주지들’로, 안전한 주거지나 요새의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 여기 내가
  lexicon: HALOT
  rationale: 예언적 선포의 엄숙함을 살리면서도 현대 한국어에서 자연스러운 권고형 주의를 사용했습니다.
- source_word: אֵלַיִךְ
  english_pob_choice: against you
  chosen_korean: 너를 대적합니다
  alternatives_korean:
  - 너에게
  - 너를 향해
  lexicon: HALOT
  rationale: 심판 맥락에서의 적대적 방향성을 분명히 드러내기 위해 ‘대적하다’를 택했습니다.
- source_word: יֹשֶׁבֶת הָעֵמֶק צוּר הַמִּישֹׁר
  english_pob_choice: O inhabitant of the valley, O rock of the plain
  chosen_korean: 골짜기에 사는 자여, 평지의 바위여
  alternatives_korean:
  - 골짜기의 거주자여, 평지의 바위여
  - 골짜기에 거하는 자여, 평원의 바위여
  lexicon: HALOT
  rationale: 여성 단수형의 의인화된 도성을 직접 호칭으로 살리되, ‘바위’는 문자적 이미지를 유지해 방어적 뉘앙스를 과도하게 해석하지 않았습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀이니라
  alternatives_korean:
  - 야훼의 말씀이니라
  - 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 기존 한국어 성경 관용을 따르되, 본 프로젝트의 야훼 기본값과는 다른 전통형 표현을 사용한 점은 기록상 주의가 필요합니다.
- source_word: מִי יֵחַת עָלֵינוּ
  english_pob_choice: Who will come down against us
  chosen_korean: 누가 우리를 치러 내려오겠느냐
  alternatives_korean:
  - 누가 우리에게 내려오겠느냐
  - 누가 우리를 향해 내려오겠느냐
  lexicon: HALOT
  rationale: 난해한 동사의 의미를 문맥상 군사적 위협으로 풀어, ‘내려오다’와 ‘치러’의 결합으로 요새적 자만을 자연스럽게 전달했습니다.
- source_word: בִּמְעוֹנוֹתֵינוּ
  english_pob_choice: into our dwellings
  chosen_korean: 우리의 거처들
  alternatives_korean:
  - 우리의 주거지들
  - 우리의 거처
  lexicon: HALOT
  rationale: ‘거처들’은 복수형을 살리면서도, 단순 주거 공간 이상의 안전한 거주지라는 함의를 지나치게 확정하지 않도록 했습니다.
theological_decisions:
- issue: 여호와 신명호의 한국어 표기
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문 사역에서는 한국어 교회 독자에게 즉각 이해되는 관용형을 택했으나, 이는 프로젝트 기본값과 다른 전통형이므로 일관성 검토가 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה/YHWH'
- issue: 도성 의인화와 주민들의 발화의 이중 구조
  chosen_reading: 도성을 단수 호칭으로 부르면서, 뒤의 말은 주민들의 복수 발화로 유지했습니다.
  alternative_readings:
  - 전부 복수로 평탄화
  - 전부 단수 의인화로만 처리
  rationale: 히브리어가 유지하는 수의 긴장을 한국어에서도 보존하여, 도시 자체와 그 안의 주민들의 말을 함께 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3, preserve tension rather than resolve it'
