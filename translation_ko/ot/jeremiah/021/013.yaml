base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
  footnotes:
  - marker: a
    text: Or, 'Who will descend against us?' The Hebrew verb in this clause is difficult; the sense is that the city considers itself secure from attack.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'dwellings'; possibly with the nuance of secure habitations or strongholds.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 너를 대적합니다. 골짜기에 사는 자여, 평지의 바위여, 야훼의 말씀입니다. 너희는 “누가 우리를 향해 내려오겠느냐?[a] 누가 우리의 거처들[b]에 들어오겠느냐?”라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 뜻이 분명하지 않습니다. 문맥상 이 도성이 공격을 받지 않을 만큼 안전하다고 여기는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘거처들’입니다. 안전한 주거지 또는 요새라는 뉘앙스를 지닐 수도 있습니다.
    reason: lexical_alternative
