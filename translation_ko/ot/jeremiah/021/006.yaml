  yaml_path: translation/ot/jeremiah/021/006.yaml
  text: And I will strike the inhabitants of this city, both man and beast; they will die by a great pestilence.
translation:
  language: ko
  text: 내가 이 성읍의 주민들과 사람과 짐승을 모두 큰 전염병으로 치리니 그들이 죽을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  english_pob_choice: And I will strike
  chosen_korean: 내가 … 치리니
  alternatives_korean:
  - 내가 … 치리니라
  - 내가 … 칠 것입니다
  - 내가 … 내려치리니
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/치리다’를 살리되, 한국어에서는 ‘치다’가 가장 직접적이고 자연스럽습니다. 예언적 심판 선언의 강한 주어-행위를 유지하면서도 과도하게 구어적이지 않게 했습니다.
- source_word: יֹשְׁבֵי הָעִיר הַזֹּאת
  english_pob_choice: the inhabitants of this city
  chosen_korean: 이 성읍의 주민들
  alternatives_korean:
  - 이 성읍에 사는 사람들
  - 이 도시의 거주자들
  lexicon: HALOT
  rationale: ‘주민들’은 ‘거주하는 자들’의 뜻을 현대 한국어로 자연스럽게 옮기면서도 예언 문맥의 공식성을 유지합니다. ‘이 성읍’은 מקור의 지시어 הַזֹּאת를 분명히 드러냅니다.
- source_word: הָאָדָם וְאֶת הַבְּהֵמָה
  english_pob_choice: both man and beast
  chosen_korean: 사람과 짐승
  alternatives_korean:
  - 인간과 짐승
  - 사람과 동물
  lexicon: HALOT
  rationale: אָדָם은 여기서 ‘짐승’과 대조되는 인간 범주로 쓰이므로 ‘사람’이 가장 직관적입니다. בְּהֵמָה는 단순 ‘동물’보다 ‘짐승’이 인간/짐승의 대구를 더 선명하게 보존합니다.
- source_word: בְּדֶבֶר גָּדוֹל
  english_pob_choice: by a great pestilence
  chosen_korean: 큰 전염병으로
  alternatives_korean:
  - 큰 역병으로
  - 큰 염병으로
  lexicon: HALOT
  rationale: דֶבֶר은 예레미야에서 심판성 전염병/역병을 가리키므로, 현대 독자가 이해할 수 있는 ‘전염병’으로 옮기되 ‘큰’으로 강도를 살렸습니다. ‘역병’도 가능하지만 현행 문어에서는 ‘전염병’이 더 직접적입니다.
- source_word: יָמֻתוּ
  english_pob_choice: they will die
  chosen_korean: 그들이 죽을 것입니다
  alternatives_korean:
  - 그들이 죽게 될 것입니다
  - 그들이 죽으리라
  lexicon: HALOT
  rationale: 예언의 결과를 현대 한국어의 미래 표현으로 옮겼습니다. 앞선 심판 행위와 자연스럽게 연결되도록 단순하고 분명하게 처리했습니다.
theological_decisions:
- issue: אָדָם의 범주를 성별 중립어로 완화할지 여부
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 이 구절은 ‘짐승’과의 대구 속에서 인간 범주를 일반적으로 가리키므로, 성별을 드러내지 않으면서도 원문의 대조를 보존하는 ‘사람’이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: contested terms, אָדָם in distributive/contrastive contexts; preserve source contrast over flattening'
- issue: דֶבֶר의 재난 성격을 약화할지 여부
  chosen_reading: 전염병
  alternative_readings:
  - 역병
  - 질병
  rationale: 예레미야의 심판 오라클에서 דֶבֶר은 단순 질병이 아니라 공동체를 치는 재앙적 전염병/역병의 뉘앙스를 가지므로, 그 긴박성과 파괴성을 살리는 번역이 필요합니다.
  doctrine_reference: Jeremiah covenant-judgment plague formula; preserve severity and textual register
