id: JER.21.12
reference: Jeremiah 21:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֵּ֣ית דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה דִּ֤ינוּ לַ/בֹּ֨קֶר֙ מִשְׁפָּ֔ט וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עוֹשֵׁ֑ק פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מעללי/הם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/012.yaml
  text: 'House of David[a], thus says Yahweh: Administer justice in the morning, and deliver the one who has been robbed from the hand of the oppressor, lest my wrath go out like fire and burn with no one to quench it[c][b], because of the evil of their deeds.'
  footnotes:
  - marker: a
    text: Or 'Render judgment in the morning' or 'Judge every morning with justice.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the hand of the oppressor,' an idiom for deliverance from someone's power or control.
    reason: cultural_note
  - marker: c
    text: Or 'my fury go forth like fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다윗의 집아, 야훼께서 이렇게 말씀하십니다. 아침에 정의를 집행하고[a], 빼앗긴 사람을 압제자의 손에서[b] 구해 내십시오. 그렇지 않으면 나의 분노가 불처럼 터져 나와[c] 타오를 것이며, 그 불을 끄는 이가 없을 것입니다. 이는 그들의 행위가 악하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침에 판결하십시오’ 또는 ‘아침마다 정의롭게 재판하십시오’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘압제자의 손에서’는 어떤 이의 권세나 지배에서 건져 내라는 관용 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나의 격노가 불처럼 터져 나올 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית דָּוִד
  english_pob_choice: House of David
  chosen_korean: 다윗의 집
  alternatives_korean:
  - 다윗의 가문
  - 다윗의 왕가
  lexicon: HALOT
  rationale: 지시 대상이 다윗 왕조 전체를 부르는 호칭이므로, 직역에 가깝고 한국어 성경에서 이해하기 쉬운 ‘다윗의 집’을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: דִּינוּ לַבֹּקֶר מִשְׁפָּט
  english_pob_choice: Administer justice in the morning
  chosen_korean: 아침에 정의를 집행하고
  alternatives_korean:
  - 아침마다 판단하십시오
  - 아침에 판결하십시오
  - 아침마다 공의를 행하십시오
  lexicon: HALOT
  rationale: דין의 통치·재판적 의무를 살려 ‘정의를 집행하다’로 옮기고, מִשְׁפָּט은 여기서 단순 판결보다 윤리적·사법적 정의에 가깝기 때문에 ‘정의’를 택했습니다.
- source_word: וְהַצִּילוּ גָזוּל מִיַּד עוֹשֵׁק
  english_pob_choice: deliver the one who has been robbed from the hand of the oppressor
  chosen_korean: 약탈당한 자를 압제자의 손에서 구해 내십시오
  alternatives_korean:
  - 도둑맞은 자를 압제자의 손에서 건져 내십시오
  - 빼앗긴 자를 압제자의 손에서 구원하십시오
  lexicon: HALOT
  rationale: גָזוּל은 피해 상태를 가리키므로 ‘약탈당한 자’로 살렸고, מִיַּד는 ‘~의 손에서’라는 권력·지배의 관용 표현을 반영했습니다.
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי וּבָעֲרָה וְאֵין מְכַבֶּה
  english_pob_choice: my wrath go out like fire and burn with no one to quench it
  chosen_korean: 나의 분노가 불처럼 나와 타오를 것이며, 그 불을 끄는 이가 없을 것입니다
  alternatives_korean:
  - 나의 진노가 불같이 터져 나와 사라지지 않을 것입니다
  - 나의 분노가 불처럼 나가 타며 꺼 줄 자가 없을 것입니다
  lexicon: HALOT
  rationale: 화염 비유를 그대로 유지하면서, תֵּצֵא/בָעֲרָה/מְכַבֶּה의 연쇄를 ‘나와 타오르다 / 끄다’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 왕가에 대한 직접 경고의 어조
  chosen_reading: 명령형으로 그대로 살려, 다윗의 집을 향한 예언적 책망과 책임 촉구를 분명히 했습니다.
  alternative_readings:
  - 완곡한 권고로 낮추기
  - 서술형으로 바꾸기
  rationale: 본문은 왕조를 향한 직접적 윤리 요구이므로, 경고의 긴장과 공적 책임을 약화시키지 않도록 명령형을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source force and prophetic register'
- issue: ‘공의/정의’의 선택
  chosen_reading: 여기서는 משפט의 사법·윤리적 의미를 반영해 ‘정의’로 옮겼습니다.
  alternative_readings:
  - 공의
  - 판결
  - 재판
  rationale: 문맥상 판결 행위 자체보다 공정한 통치와 사회적 न्याय의 실천이 핵심이므로, 한국어 독자에게 가장 분명한 ‘정의’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md lexical policy: preserve source sense over conventional ecclesial phrasing'
