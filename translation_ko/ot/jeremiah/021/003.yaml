id: JER.21.3
reference: Jeremiah 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ אֲלֵי/הֶ֑ם כֹּ֥ה תֹאמְרֻ֖/ן אֶל צִדְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/003.yaml
  text: Jeremiah said to them, “Thus you shall say to Zedekiah:”
translation:
  language: ko
  text: '예레미야가 그들에게 말했습니다. "너희는 시드기야에게 이렇게 말해야 합니다: "'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서술적 הבא르-연결형의 다음 사건 진술을 한국어 현대 문체로 자연스럽게 옮기되, 예언자 발화 도입의 직접성을 살려 ‘말했습니다’로 렌더링했습니다.
- source_word: אֲלֵיהֶם
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들에게
  - 그 사람들에게
  lexicon: HALOT
  rationale: 전치사 אֶל + 3인칭 복수 접미사의 방향성을 표준적인 ‘그들에게’로 옮겼습니다.
- source_word: כֹּה
  english_pob_choice: Thus
  chosen_korean: 이렇게
  alternatives_korean:
  - 이같이
  - 이와 같이
  lexicon: HALOT
  rationale: 공식적인 예언자 메시지 도입어로서 ‘이렇게’가 현대 한국어에서 가장 자연스럽고도 문맥상 간결합니다.
- source_word: תֹאמְרֻן
  english_pob_choice: you shall say
  chosen_korean: 말해야 합니다
  alternatives_korean:
  - 말할 것입니다
  - 말하십시오
  lexicon: HALOT
  rationale: 복수 2인칭의 명령/지시적 미래를 한국어 합쇼체의 당위 표현으로 옮겨, 전달받은 사자들의 의무를 분명히 했습니다.
- source_word: צִדְקִיָּהוּ
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 세드기야
  - 치드기야
  lexicon: standard proper-name convention
  rationale: 기존 한국어 성경에서 널리 쓰이는 왕명 표기를 따랐습니다.
theological_decisions:
- issue: 직접 인용부의 끝 처리
  chosen_reading: 본문은 인용의 도입까지만 제시되므로, 한국어에서도 말줄임이 아닌 콜론으로 미완결 메시지 도입을 드러냈습니다.
  alternative_readings:
  - 인용부호 없이 서술로만 처리
  - 마침표로 끊어 완결문처럼 처리
  rationale: 히브리어 원문과 영어 POB 모두 말할 내용을 예고하는 전이 구문에 머무르므로, 미완결성을 보존하는 것이 본문 구조를 가장 충실히 드러냅니다.
  doctrine_reference: 본문 구조 보존 원칙
- issue: 대상자 호칭의 복수성
  chosen_reading: ‘너희는’으로 사자들 집단에게 직접 지시를 살렸습니다.
  alternative_readings:
  - ‘너는’으로 단수화
  - 명령 주체를 생략
  rationale: תֹאמְרֻן의 복수형을 반영해 예언 전달 책임이 공동체적 사자단에 있음을 보존했습니다.
  doctrine_reference: 문법-의미 대응 원칙
