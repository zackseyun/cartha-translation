source:
  edition: WLC
  text: וְ/אַתָּ֛ה תְּבַקֶּשׁ לְ/ךָ֥ גְדֹל֖וֹת אַל תְּבַקֵּ֑שׁ כִּ֡י הִנְ/נִי֩ מֵבִ֨יא רָעָ֤ה עַל כָּל בָּשָׂר֙ נְאֻם יְהוָ֔ה וְ/נָתַתִּ֨י לְ/ךָ֤ אֶֽת נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל עַ֥ל כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁ֥ר תֵּֽלֶךְ שָֽׁם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/005.yaml
  text: And you—are you seeking great things for yourself? Do not seek them, for behold, I am bringing disaster on all flesh, declares the LORD. But I will give you your life as plunder in every place where you go.
translation:
  language: ko
  text: “당신은 스스로를 위해 큰일을 구하고 있습니까?[a] 그것을 구하지 마십시오. 보십시오, 내가 모든 육체에게 재앙을 내리겠습니다.[b] 야훼의 말씀입니다. 그러나 당신이 가는 모든 곳에서 당신의 목숨을 노획물로 주겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰일’을 ‘큰 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “모든 육체”로, 사람 전체를 가리키는 직설적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: תְּבַקֶּשׁ לְךָ גְדֹלוֹת / אַל תְּבַקֵּשׁ
  english_pob_choice: are you seeking great things for yourself? Do not seek them
  chosen_korean: “당신은 스스로를 위해 큰일을 구하고 있습니까? 그것을 구하지 마십시오.”
  alternatives_korean:
  - “당신을 위해 큰일을 찾고 있습니까? 그것을 찾지 마십시오.”
  - “당신은 스스로 큰 것을 추구하고 있습니까? 추구하지 마십시오.”
  lexicon: בקש = 구하다/찾다; גדולות = 큰일들/큰 것들
  rationale: ‘큰일’을 써서 의미를 자연스럽게 살리되, ‘스스로를 위해’로 목적어적 뉘앙스를 드러내어 본문의 자기이익 추구를 반영했습니다.
- source_word: כִּי הִנְנִי מֵבִיא רָעָה
  english_pob_choice: for behold, I am bringing disaster
  chosen_korean: “보십시오, 내가 … 재앙을 가져오고 있습니다.”
  alternatives_korean:
  - “보라, 내가 … 재앙을 가져오고 있습니다.”
  - “보십시오, 내가 … 해를 가져오고 있습니다.”
  lexicon: הִנְנִי = 보십시오/보라; רָעָה = 재앙, 해, 불행
  rationale: 문맥상 단순한 ‘나쁜 일’보다 심판적 재앙이 분명하므로 ‘재앙’으로 옮겼고, 예언적 주의 환기 표현은 ‘보십시오’로 처리했습니다.
- source_word: עַל כָּל בָּשָׂר
  english_pob_choice: on all flesh
  chosen_korean: “모든 육체 위에”
  alternatives_korean:
  - “모든 사람에게”
  - “모든 생명 위에”
  lexicon: בָּשָׂר = 육체/사람
  rationale: 히브리어 직설성을 살려 ‘모든 육체’를 유지했습니다. 이는 단순히 사람 일반을 뜻하지만, 본문이 의도하는 보편적 심판 범위를 더 강하게 드러냅니다.
- source_word: לְשָׁלָל
  english_pob_choice: as plunder
  chosen_korean: “노획물로”
  alternatives_korean:
  - “전리품으로”
  - “약탈물로”
  lexicon: שָׁלָל = 노획물, 전리품, 전리품
  rationale: ‘노획물’은 목숨이 전쟁에서 살아남은 자의 전리품처럼 주어진다는 비유를 비교적 직설적으로 보존합니다.
- source_word: נַפְשְׁךָ
  english_pob_choice: your life
  chosen_korean: “당신의 생명”
  alternatives_korean:
  - “당신의 목숨”
  - “당신의 혼”
  lexicon: נֶפֶשׁ = 생명, 목숨, 혼
  rationale: 문맥상 ‘목숨/생명’이 적절하며, 현대 한국어에서 ‘생명’이 가장 중립적이고 예언적 구원의 의미를 잘 전달합니다.
theological_decisions:
- issue: יהוה의 처리
  chosen_reading: 본문의 יהוה는 ‘야훼’로 옮기되, 예언자 발화 표지는 ‘야훼의 말씀’으로 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 프로젝트 기본 용례에 따라 신명은 학술적 음역인 ‘야훼’를 사용해야 하며, 예언 공식은 원문의 선언성을 살립니다.
  doctrine_reference: POB glossary / divine name policy
