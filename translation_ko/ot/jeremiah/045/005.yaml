  source_fidelity: 히브리어의 질문과 금지, 보편적 재앙 선언, 그리고 ‘목숨을 노획물로’ 주겠다는 비유를 대체로 충실히 반영합니다. 다만 עַל כָּל־בָּשָׂר의 ‘위에’는 한국어에서 부자연스럽고, נְאֻם יְהוָה를 ‘야훼의 말씀이십니다’라고 한 것은 화자 표지에 불필요한 높임을 넣습니다.
