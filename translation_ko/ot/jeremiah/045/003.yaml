  lexicon: HALOT
  rationale: 오이의 애가적 감탄과 נָא의 긴박감을 함께 살리기 위해 ‘아, 이제는’으로 시작하고, ‘화가 있나이다’로 절박한 탄식을 옮겼습니다.
- source_word: יָגוֹן
  english_pob_choice: sorrow
  chosen_korean: 슬픔
