  lexicon: HALOT
  rationale: וּ/מַכְאֹב과 병렬되는 내적 고통의 어감을 살리면서, 한국어에서 너무 추상적이지 않은 ‘슬픔’을 택했습니다.
- source_word: מַכְאֹב
  english_pob_choice: pain
  chosen_korean: 고통
  alternatives_korean:
  - 아픔
  - 괴로움
  lexicon: HALOT
  rationale: מית/כאב 계열의 실제적 고통을 뜻하므로, 정서적 ‘슬픔’과 구별되는 물리·정서 복합의 고통을 드러내기 위해 ‘고통’으로 옮겼습니다.
- source_word: בְּאַנְחָתִי
  english_pob_choice: with my groaning
  chosen_korean: 제가 탄식하느라
  alternatives_korean:
  - 제 탄식으로
  - 제 신음과 함께
  lexicon: HALOT
  rationale: ב를 수단/동반의 뉘앙스로 받아, 현재의 지속적 상태를 드러내는 ‘-하느라’로 옮겼습니다. ‘탄식’은 אַנְחָה의 호소적·비탄적 울림을 가장 잘 반영합니다.
- source_word: וּמְנוּחָה לֹא מָצָאתִי
  english_pob_choice: and I have found no rest
  chosen_korean: 쉼을 얻지 못했습니다
  alternatives_korean:
  - 안식을 찾지 못했습니다
  - 쉬지 못했습니다
  lexicon: HALOT
  rationale: מְנוּחָה를 단순한 휴식보다 고통에서 벗어난 ‘쉼/안식’으로 이해해, 자연스럽고 간결한 ‘쉼을 얻지 못했습니다’로 옮겼습니다.
- source_word: יְהוָה
