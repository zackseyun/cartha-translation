  yaml_path: translation/ot/jeremiah/045/003.yaml
  text: You said[a], ‘Woe is me now, for Yahweh has added sorrow to my pain. I am weary with my groaning, and I have found no rest.’
  footnotes:
  - marker: a
    text: Or 'Alas for me now'; the Hebrew cry expresses lament and distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 이렇게 말했습니다. “아, 이제 나는 비참합니다[a]. 야훼께서 내 고통에 슬픔을 더하셨습니다. 나는 탄식하며 지쳤고, 쉼을 찾지 못했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아, 이제 내게 화가 닥쳤습니다’; 히브리어 감탄사는 애가와 고통의 절규를 나타냅니다.
    reason: lexical_alternative
