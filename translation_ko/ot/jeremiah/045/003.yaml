  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 용례 지침에 따라 신명기적 고유명사를 ‘야훼’로 표기하여, 일반 호칭과 구별되는 언약 이름을 보존했습니다.
theological_decisions:
- issue: 애가적 절규의 강도 보존
  chosen_reading: ‘아, 이제는 저에게 화가 있나이다’처럼 직접적인 탄식 표현을 유지했습니다.
  alternative_readings:
  - ‘슬프도다, 이제 저는 괴롭습니다’처럼 완화된 표현
  - ‘아, 저는 불쌍합니다’처럼 정서 중심 표현
  rationale: 히브리어 אוי는 단순한 슬픔보다 고통과 비명을 동반한 애가이므로, 한국어에서도 강한 탄식의 음성을 약화하지 않았습니다.
  doctrine_reference: 시편·예레미야의 탄식 어법
