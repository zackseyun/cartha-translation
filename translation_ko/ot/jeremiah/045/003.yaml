- from: 당신은 말하기를 “아, 이제는 저에게 화가 있나이다. 야훼께서 제 고통에 슬픔을 더하셨습니다. 제가 탄식하느라 지쳤고, 쉼을 얻지 못했습니다.”[a]
  to: 당신은 이렇게 말했습니다. “아, 이제 나는 비참합니다[a]. 야훼께서 내 고통에 슬픔을 더하셨습니다. 나는 탄식하며 지쳤고, 쉼을 찾지 못했습니다.”
  rationale: The revision uses consistently modern formal-polite Korean, removes the unintended modern sense of anger and the archaic ‘-나이다’ ending, and more closely reflects the Hebrew's lament and its circumstantial reference to groaning. The footnote preserves the possible calamity-oriented nuance of the lament without imposing it on the main rendering.
