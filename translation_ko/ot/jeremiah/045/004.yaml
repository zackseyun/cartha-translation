  text: 'This is what you shall say to him: ‘This is what Yahweh says: Behold[a], what I have built I am tearing down, and what I have planted I am uprooting, that is, the whole land.’'
  footnotes:
  - marker: a
    text: Or 'the whole earth.' Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'land' is preferred because of Jeremiah's immediate context of judgment on Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 이렇게 말하십시오. 「야훼께서 이렇게 말씀하십니다. 보라, 내가 지은 것을 내가 허물고, 내가 심은 것을 내가 뽑아 내며, 온 땅[a]도 그러합니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 세상’. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있으나, 여기서는 예레미야의 직접적인 문맥상 ‘땅’이 더 적절합니다.
    reason: lexical_alternative
