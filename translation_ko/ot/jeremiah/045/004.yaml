  source_fidelity: 앞부분의 전언 공식과 건축·식재의 비유는 대체로 충실합니다. 다만 마지막의 וְאֶת־כָּל־הָאָרֶץ הִיא는 앞선 심판 행위가 ‘온 땅’에도 적용됨을 나타내는 타원적 표현으로 보는 것이 자연스럽습니다. 초안의 ‘곧 온 땅입니다’는 동격 설명처럼 처리하여 히브리어의 범위 확장과 타원성을 충분히 드러내지 못합니다.
  naturalness: ‘내가 지은 것을 내가 헐어 버리고’는 이해 가능하지만, ‘허물고’ 및 ‘뽑아 내며’가 현대의 격식 있는 성경 문체에서 더 자연스럽고 비유의 대응도 선명합니다. 마지막은 ‘온 땅도 그러합니다’로 옮기면 한국어 문장이 완결되면서도 원문의 생략을 과도하게 해설하지 않습니다.
