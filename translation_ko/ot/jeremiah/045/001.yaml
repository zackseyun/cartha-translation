    text: 직역하면 ‘예레미야의 입에서’입니다. 예레미야가 말한 것을 바룩이 받아 기록했음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 서문의 דָּבָר는 단순한 '말'보다 선포된 계시의 성격을 띠므로, 한국어에서는 문맥상 가장 자연스럽고도 격식을 유지하는 '말씀'으로 옮겼습니다.
- source_word: הַנָּבִיא
