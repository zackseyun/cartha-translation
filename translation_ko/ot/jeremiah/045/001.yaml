base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/001.yaml
  text: 'The word that Jeremiah the prophet spoke to Baruch son of Neriah when he wrote these words in a scroll at the mouth of Jeremiah[a], in the fourth year of Jehoiakim son of Josiah, king of Judah, saying:'
  footnotes:
  - marker: a
    text: Or, 'at Jeremiah’s dictation'; literally, 'from the mouth of Jeremiah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 유다 왕 요시야의 아들 여호야김의 넷째 해에, 바룩 — 네리야의 아들 — 에게 예레미야 예언자가 말한 말씀은 이러합니다. 바룩이 예레미야의 입에서 이 말들을 두루마리에 쓸 때였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '예레미야의 입에서'로, 받아쓴 상황을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 서문의 דָּבָר는 단순한 '말'보다 선포된 계시의 성격을 띠므로, 한국어에서는 문맥상 가장 자연스럽고도 격식을 유지하는 '말씀'으로 옮겼습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자가
  alternatives_korean:
  - 선지자가
  - 예언자
  lexicon: HALOT
  rationale: 직함을 한국어로 풀어 쓰되, 현대 표준어와 본문의 선포적 성격을 살려 '예언자'를 사용했습니다.
- source_word: מִפִּי יִרְמְיָהוּ
  english_pob_choice: from the mouth of Jeremiah
  chosen_korean: 예레미야의 입에서
  alternatives_korean:
  - 예레미야의 지시에 따라
  - 예레미야에게서
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문 질감대로 살리기 위해 직역에 가깝게 유지했고, '쓸 때'와 결합해 구두 받아쓰기 상황을 드러냈습니다.
- source_word: עַל סֵפֶר
  english_pob_choice: in a scroll
  chosen_korean: 두루마리에
  alternatives_korean:
  - 책에
  - 두루마리 위에
  lexicon: HALOT
  rationale: סֵפֶר는 여기서 책보다 고대 문서인 두루마리를 가리키므로, 시대착오를 피하면서도 한국어 독자에게 분명한 '두루마리'를 택했습니다.
theological_decisions:
- issue: 관영적 서두와 화자의 이동
  chosen_reading: 본문 시작의 말씀은 하나님 직접 화용문이 아니라 기록 서술이므로, 한국어 서술은 합쇼체로 유지하고 인용부만 따로 구분했습니다.
  alternative_readings:
  - 예언적 서문을 더 성경적 어투로 고정하는 방식
  - 직접 인용처럼 평서 종결을 약화시키는 방식
  rationale: 본절은 역사 서술적 머리말로서 문체를 과도하게 종교어휘화하기보다, 원문의 서술 기능을 분명히 전달하는 것이 적절합니다.
  doctrine_reference: 성경 서술의 장르 구분
- issue: 예레미야의 입에서
  chosen_reading: 직접적인 받아쓰기 관계를 암시하는 관용구를 유지했습니다.
  alternative_readings:
  - 의역하여 '예레미야의 지시로'
  - 주해 없이 단순히 '예레미야에게서'
  rationale: 본문의 핵심은 바룩이 예레미야의 말을 기록했다는 점이므로, 원문의 표현 긴장을 지우지 않고 그대로 드러내는 편이 문맥상 더 충실합니다.
  doctrine_reference: 계시 전달과 기록의 매개성
