id: JER.28.9
reference: Jeremiah 28:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נָּבִ֕יא אֲשֶׁ֥ר יִנָּבֵ֖א לְ/שָׁל֑וֹם בְּ/בֹא֙ דְּבַ֣ר הַ/נָּבִ֗יא יִוָּדַע֙ הַ/נָּבִ֔יא אֲשֶׁר שְׁלָח֥/וֹ יְהוָ֖ה בֶּ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/009.yaml
  text: As for the prophet who prophesies peace[a], when the word of that prophet comes to pass[c][b], then that prophet will be known as one whom Yahweh has truly sent.
  footnotes:
  - marker: a
    text: Or 'well-being' or 'prosperity' for 'peace' (שָׁלוֹם).
    reason: lexical_alternative
  - marker: b
    text: Literally, 'when the word of the prophet comes.' The sense is the fulfillment of the prophetic message.
    reason: lexical_alternative
  - marker: c
    text: Or 'whom the LORD sent in truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예언자가 평강[a]을 예언한 경우에, 그 예언자의 말이 이루어질 때[b], 그 예언자는 야훼께서 참으로 보내신 사람으로 알려질 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평강’은 שָׁלוֹם의 기본역이며, 문맥상 ‘평안’, ‘형통’, ‘복된 상태’를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 예언자의 말이 올 때’입니다. 여기서는 예언의 성취를 분명히 하기 위해 ‘이루어질 때’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘야훼께서 참으로 보내신’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  english_pob_choice: the prophet / that prophet
  chosen_korean: 그 예언자
  alternatives_korean:
  - 예언자
  lexicon: HALOT
  rationale: 히브리어의 정관사는 문맥상 특정 예언자를 가리키므로, 한국어에서는 ‘그 예언자’로 지시성을 살렸습니다.
- source_word: יִנָּבֵא לְשָׁלוֹם
  english_pob_choice: prophesies peace
  chosen_korean: 평강을 예언한
  alternatives_korean:
  - 평화를 예언한
  - 잘됨을 예언한
  lexicon: HALOT
  rationale: שָׁלוֹם은 단순한 분쟁 부재보다 더 넓은 ‘평강/온전한 형통’의 뜻이 있으므로, 기본어는 ‘평강’으로 두고 예언 행위를 자연스럽게 표현했습니다.
- source_word: בְּבֹא דְּבַר הַנָּבִיא
  english_pob_choice: when the word of that prophet comes to pass
  chosen_korean: 그 예언자의 말이 이루어질 때
  alternatives_korean:
  - 그 예언자의 말이 올 때
  - 그 예언자의 말이 성취될 때
  lexicon: HALOT
  rationale: בְּבֹא는 예언의 내용이 실제로 성취되는 시점을 가리키므로, ‘이루어질 때’로 옮겨 증험의 의미를 분명히 했습니다.
- source_word: יִוָּדַע
  english_pob_choice: will be known
  chosen_korean: 알려질 것입니다
  alternatives_korean:
  - 알려질 것입니다
  - 드러날 것입니다
  - 인정될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 결과 상태를 한국어 수동 표현으로 살려, 그 예언자의 참됨이 결과적으로 드러난다는 뜻을 보존했습니다.
- source_word: שְׁלָחוֹ יְהוָה בֶּאֱמֶת
  english_pob_choice: whom Yahweh has truly sent
  chosen_korean: 야훼께서 참으로 보내신 사람으로
  alternatives_korean:
  - 야훼께서 참으로 보내신 예언자로
  - 야훼께서 진실로 보내신 자로
  lexicon: HALOT
  rationale: יְהוָה는 본 번역 원칙에 따라 ‘야훼’로 옮겼고, ‘참으로’는 בֶּאֱמֶת의 진정성·실재성을 자연스럽게 반영합니다.
theological_decisions:
- issue: 예언의 성취가 참된 파송의 표지라는 구조
  chosen_reading: 예언의 말이 이루어질 때 그 예언자는 야훼께서 참으로 보내신 사람으로 알려진다고 옮겼습니다.
  alternative_readings:
  - 단순히 '야훼께서 참으로 보내신 예언자'라고만 옮길 수도 있습니다.
  - 성취와 파송의 관계를 덜 분명하게 처리할 수도 있습니다.
  rationale: 히브리어는 예언의 성취를 통해 그 예언자의 진정성이 드러난다는 논리를 형성하므로, 그 증거 관계를 한국어에서도 분명히 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
