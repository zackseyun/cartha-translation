review_pass:
  verdict: revise
  source_fidelity: 히브리어는 평화/평안을 예언하는 특정 예언자와 그의 말의 성취를, 그가 야훼에게 참되게 파송되었음이 알려지는 계기로 연결합니다. 초안은 이 기본 구조를 대체로 충실히 반영하지만, ‘예언한 경우에’의 과거·조건 표현은 미완료형 관계절의 일반적/미래지향적 표현을 다소 제한합니다.
  naturalness: ‘예언자가 … 예언한 경우에’는 반복과 조건 표현 때문에 현대 한국어 문장으로 다소 부자연스럽습니다. ‘평화를 예언하는 예언자는’이 더 자연스럽고 원문의 주제화된 관계절에도 가깝습니다.
  terminology: שָׁלוֹם은 이 문맥에서 ‘평화’가 현대 표준어의 자연스러운 기본 번역이며, 각주로 ‘평안’, ‘안녕’, ‘번영’의 넓은 의미를 보완할 수 있습니다. ‘야훼’, ‘예언자’, ‘참으로 보내신’은 적절합니다.
  issues:
  - severity: medium
    issue: ‘예언한 경우에’가 원문의 관계절을 과거의 조건문처럼 처리합니다.
    rationale: יִנָּבֵא는 여기서 ‘평화를 예언하는 예언자’라는 식의 관계절로 자연스럽게 옮길 수 있습니다. 과거 시제와 ‘경우’는 원문에 없는 시간적·조건적 제한을 더합니다.
  - severity: low
    issue: ‘평강’ 및 해당 각주의 설명이 현대 표준어와 어휘 설명 면에서 덜 적절합니다.
    rationale: ‘평강’은 종교적 문체에서는 통용되지만 현대 일반 표준어 본문에는 ‘평화’가 더 자연스럽습니다. שָׁלוֹם의 의미 범위는 ‘평안/안녕/번영’ 등으로 간결하게 제시하는 편이 정확합니다.
  - severity: low
    issue: 각주 c의 ‘직역하면’ 설명이 히브리어 구문의 대안을 충분히 나타내지 못합니다.
    rationale: בֶּאֱמֶת은 ‘참으로’로 자연스럽게 옮길 수 있으나, 문자적으로는 ‘진실로/진리 안에서’의 뉘앙스를 지니며 파송 행위를 수식하는 표현으로도 제시할 수 있습니다.
  revised_text: 평화를 예언하는 예언자는 그의 말이 이루어질 때, 야훼께서 참으로 보내신 예언자로 알려질 것입니다[c].
  revised_footnotes:
  - marker: a
    text: 또는 ‘평안’, ‘안녕’, ‘번영’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 예언자의 말이 올 때’입니다. 이는 예언한 말의 성취를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼께서 진실로 보내신 예언자’.
    reason: lexical_alternative
  revision_rationale: '본문의 ‘평화를 예언하는 예언자’는 히브리어의 관계절을 자연스러운 현대 한국어로 보존하며, 그의 말이 이루어짐과 참된 파송의 인정 사이의 관계도 유지합니다. 각주 a와 b의 원래 위치를 반영하려면 본문에서 각각 ‘평화[a]’와 ‘이루어질 때[b]’로 표기해야 합니다. 따라서 완전한 조판 본문은 다음과 같습니다: ‘평화[a]를 예언하는 예언자는 그의 말이 이루어질 때[b], 야훼께서 참으로 보내신 예언자로 알려질 것입니다[c].’'
