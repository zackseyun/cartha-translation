source:
  edition: WLC
  text: וַ/יִּקַּ֞ח חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֕ל צַוַּ֖אר יִרְמְיָ֣ה הַ/נָּבִ֑יא וַֽ/יִּשְׁבְּרֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/010.yaml
  text: Then Hananiah the prophet took the yoke from the neck of Jeremiah the prophet and broke it[a].
  footnotes:
  - marker: a
    text: Or 'the bar' or 'the yoke-bar.' The Hebrew term can refer to the wooden bar of a yoke; 'yoke' is used here because the surrounding sign-act centers on a yoke placed on Jeremiah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나냐 선지자가 예레미야 선지자의 목에서 멍에를 벗겨 내고 그것을 부러뜨렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מוֹטָה는 ‘멍에’의 나무 막대나 ‘멍에 막대’를 가리킬 수 있습니다. 여기서는 문맥상 예레미야가 메고 있던 상징적 멍에가 중심이므로 ‘멍에’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 벗겨 내고
  alternatives_korean:
  - 들고
  - 가져가고
  - 빼앗아 가고
  lexicon: HALOT
  rationale: לקח의 기본 의미는 ‘가지다/취하다’이지만, 여기서는 목에 걸린 상징적 멍에를 물리적으로 떼어 내는 장면이므로 한국어로는 ‘벗겨 내고’가 동작의 감각을 가장 분명하게 드러냅니다.
- source_word: הַמּוֹטָה
  english_pob_choice: the yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 나무 막대
  - 멍에 막대
  - 요크
  lexicon: HALOT
  rationale: 문맥상 예레미야가 실제로 메고 있던 상징물은 ‘멍에’이므로, POB의 영어 선택처럼 독자가 장면을 바로 이해하도록 ‘멍에’로 옮겼습니다.
- source_word: מֵעַל צַוַּאר
  english_pob_choice: from the neck / from off the neck
  chosen_korean: 목에서
  alternatives_korean:
  - 목 위에서
  - 목에서부터
  - 목으로부터
  lexicon: HALOT
  rationale: מֵעַל은 문자적으로 ‘~위에서/~로부터’이지만, 한국어에서는 ‘목에서’가 자연스럽고도 원문의 물리적 제거 감각을 충분히 보존합니다.
- source_word: וַיִּשְׁבְּרֵהוּ
  english_pob_choice: and broke it
  chosen_korean: 그것을 부러뜨렸습니다
  alternatives_korean:
  - 그것을 깨뜨렸습니다
  - 그것을 산산이 부쉈습니다
  lexicon: HALOT
  rationale: שׁבר의 기본 의미는 ‘부수다/부러뜨리다’이며, 여기서는 멍에의 물질적 파괴를 직접적으로 표현하는 ‘부러뜨렸습니다’가 가장 적절합니다.
theological_decisions:
- issue: ‘선지자’ 칭호의 반복과 서술 효과
  chosen_reading: ‘하나냐 선지자’와 ‘예레미야 선지자’를 모두 유지했습니다.
  alternative_readings:
  - 하나냐
  - 예레미야
  - 하나냐 예언자
  rationale: 본문은 두 인물을 모두 선지자로 명시해 대조와 아이러니를 강화하므로, 이를 유지해 서술의 무게를 살렸습니다.
  doctrine_reference: 본문-내 서사 및 예언자 정체성 강조
