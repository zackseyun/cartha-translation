revisions:
- from: 그해에, 유다 왕 시드기야의 통치가 시작될 때, 곧 넷째 해 다섯째 달에, 기브온 출신의 예언자 하나냐, 곧 스미엘의 아들인 그가 여호와의 집에서 제사장들과 온 백성이 보는 앞에서 내게 말했습니다.[a][b]
  to: '그해에 이런 일이 있었습니다. 유다 왕 시드기야의 통치 초기에, 그 넷째 해[b] 다섯째 달에, 기브온 출신 예언자인 앗술의 아들 하나냐가 야훼의 집에서 제사장들과 온 백성이 보는 앞에서[a] 내게 말했습니다:'
  rationale: 인명 오류를 원문의 עַזּוּר에 맞는 ‘앗술’로 바로잡고, 프로젝트의 신명 표기 원칙에 따라 ‘야훼’를 사용했습니다. 서사 도입을 보완하되 한국어 문장을 과도하게 직역하지 않았습니다. ‘곧’을 제거하여 연대 표지 사이의 본문상 긴장을 보존했으며, 각주 표지를 실제로 설명하는 어구에 배치했습니다.
