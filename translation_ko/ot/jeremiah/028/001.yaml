    rationale: 공개적 목격을 설명하는 각주 a는 ‘보는 앞에서’에, 연대 병존을 설명하는 각주 b는 ‘넷째 해’에 붙여 독자가 지시 대상을 즉시 알 수 있게 해야 합니다.
