base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/001.yaml
  text: And it happened in that year[a], at the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah son of Azzur, the prophet from Gibeon, spoke to me in the house of Yahweh, in the sight of the priests and all the people, saying[b],
  footnotes:
  - marker: a
    text: 'Hebrew: ''before the eyes of,'' an idiom meaning publicly or in the presence of.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew text says both 'at the beginning of the reign of Zedekiah' and 'in the fourth year.' The translation preserves this wording rather than harmonizing it.
    reason: textual_variant
translation:
  language: ko
  text: '그해에 이런 일이 있었습니다. 유다 왕 시드기야의 통치 초기에, 그 넷째 해[b] 다섯째 달에, 기브온 출신 예언자인 앗술의 아들 하나냐가 야훼의 집에서 제사장들과 온 백성이 보는 앞에서[a] 내게 말했습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘눈앞에서’이지만 여기서는 공개적으로, 사람들 앞에서라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘유다 왕 시드기야의 통치 초기에’와 ‘넷째 해’를 함께 말합니다. 번역은 이 두 표현을 조화시키지 않고 그대로 유지합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그해에
  alternatives_korean:
  - 그 일이 일어났습니다
  - 그렇게 되었습니다
  lexicon: HALOT
  rationale: 서사 도입 공식의 기능을 살리되 한국어에서는 자연스럽고 간결한 시간 전환으로 처리했습니다.
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  english_pob_choice: at the beginning of the reign of
  chosen_korean: 통치가 시작될 때
  alternatives_korean:
  - 나라가 시작될 때
  - 왕권이 시작될 때
  lexicon: HALOT
  rationale: מַמְלֶכֶת은 여기서 ‘왕국’보다 왕의 치리/통치의 시작을 가리키므로, 왕정 시기 표현으로 옮겼습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자
  lexicon: HALOT
  rationale: 현대 표준어와 합쇼체 문맥에 맞춰 ‘예언자’를 선택하되, 호칭의 기능을 유지했습니다.
- source_word: לְעֵינֵי
  english_pob_choice: in the sight of
  chosen_korean: …보는 앞에서
  alternatives_korean:
  - …보는 눈앞에서
  - …의 앞에서
  lexicon: HALOT
  rationale: 공적·가시적 상황을 드러내는 관용구이므로, 단순히 ‘앞에서’보다 관찰 가능성을 드러내는 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 구절은 구약 본문이므로 한국어 교회 전통에서 가장 널리 알려진 인명형을 따랐습니다.
theological_decisions:
- issue: 히브리어 본문이 ‘왕위 통치의 시작’과 ‘넷째 해’를 함께 제시하는 긴장
  chosen_reading: 두 시간 표지를 모두 그대로 유지해 조화시키지 않았습니다.
  alternative_readings:
  - 둘 중 하나를 풀어 쓰거나 약화해 긴장을 해소함
  - ‘시작될 때’를 대략적 의미로 완화함
  rationale: 본문의 역사적 표지를 손대지 않고 보존하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: 공적 증언 장면의 재현 방식
  chosen_reading: ‘제사장들과 온 백성이 보는 앞에서’로 공적 노출을 분명히 했습니다.
  alternative_readings:
  - ‘제사장들과 온 백성 앞에서’
  - ‘사람들 보는 데서’
  rationale: לְעֵינֵי의 시각적 공공성을 살리면서도 한국어로는 자연스러운 공적 증언 장면이 되도록 했습니다.
  doctrine_reference: 'POB style: preserve discourse force and public setting'
