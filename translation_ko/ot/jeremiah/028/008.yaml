id: JER.28.8
reference: Jeremiah 28:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נְּבִיאִ֗ים אֲשֶׁ֨ר הָי֧וּ לְ/פָנַ֛/י וּ/לְ/פָנֶ֖י/ךָ מִן הָֽ/עוֹלָ֑ם וַ/יִּנָּ֨בְא֜וּ אֶל אֲרָצ֤וֹת רַבּוֹת֙ וְ/עַל מַמְלָכ֣וֹת גְּדֹל֔וֹת לְ/מִלְחָמָ֖ה וּ/לְ/רָעָ֥ה וּ/לְ/דָֽבֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/008.yaml
  text: The prophets who were before me and before you from ancient times prophesied against many lands and against great kingdoms[b][a], of war and disaster and plague.
  footnotes:
  - marker: a
    text: Or 'from of old.' The Hebrew expression refers here to long-past time, not necessarily eternity.
    reason: lexical_alternative
  - marker: b
    text: Or 'pestilence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 옛적부터 나와 당신보다 먼저 있었던 예언자들은 많은 땅과 큰 왕국들을 향하여 전쟁과 재앙과 전염병을 예언했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘옛적부터’는 영원을 뜻하지 않고, 오래전 과거를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘역병’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאִים
  english_pob_choice: The prophets
  chosen_korean: 예언자들은
  alternatives_korean:
  - 선지자들은
  - 예언자들이
  lexicon: HALOT
  rationale: 히브리어 נביא의 기본 의미를 살려 '예언자'로 옮겼습니다. 본문은 특정 직분명보다 하나의 집단을 지칭하므로 복수 주격으로 처리했습니다.
- source_word: אֲשֶׁר הָיוּ לְפָנַי וּלְפָנֶיךָ
  english_pob_choice: who were before me and before you
  chosen_korean: 나보다 먼저 있었고 또 당신보다 먼저 있었던
  alternatives_korean:
  - 내 앞에 있었고 당신 앞에 있었던
  - 나보다 앞선, 그리고 당신보다 앞선
  lexicon: HALOT
  rationale: לְפָנַי/לְפָנֶיךָ의 시간적 의미를 살려 '보다 먼저 있었던'으로 옮겼습니다. 한국어에서도 자연스럽게 이전 세대를 가리키는 표현입니다.
- source_word: מִן הָעוֹלָם
  english_pob_choice: from ancient times
  chosen_korean: 옛날부터
  alternatives_korean:
  - 옛적부터
  - 오래전부터
  - 영원부터
  lexicon: HALOT
  rationale: 문맥상 ‘영원’이 아니라 먼 과거를 뜻하므로, 시간적 오래됨을 분명히 하는 '옛날부터'를 택했습니다.
- source_word: וַיִּנָּבְאוּ אֶל אֲרָצוֹת רַבּוֹת וְעַל מַמְלָכ֣וֹת גְּדֹל֔וֹת
  english_pob_choice: prophesied against many lands and against great kingdoms
  chosen_korean: 많은 땅과 큰 나라들에 대하여 … 예언했습니다
  alternatives_korean:
  - 많은 땅과 큰 나라들을 향하여 … 예언했습니다
  - 많은 땅과 큰 나라들에 맞서 … 예언했습니다
  lexicon: HALOT
  rationale: אֶל/עַל은 여기서 심판 예언의 방향을 드러내므로 단순한 ‘~에’보다 ‘~에 대하여’가 문맥을 더 잘 반영합니다. 한국어로는 'against'의 적대감을 과도하게 직역하지 않으면서도 판단적 성격을 보존합니다.
- source_word: לְמִלְחָמָה וּלְרָעָה וּלְדָבֶר
  english_pob_choice: of war and disaster and plague
  chosen_korean: 전쟁과 재앙과 전염병
  alternatives_korean:
  - 전쟁과 재난과 재앙과 전염병
  - 전쟁과 화와 전염병
  lexicon: HALOT
  rationale: מִלְחָמָה는 '전쟁', רָעָה는 심판 맥락에서 도덕적 악보다 '재앙/재난'이 적절하며, דָבֶר는 '전염병'이 가장 직접적으로 뜻을 드러냅니다.
theological_decisions:
- issue: 예언의 대상에 대한 전치사 처리
  chosen_reading: 예언자들은 '많은 땅과 큰 나라들에 대하여' 예언했습니다.
  alternative_readings:
  - 많은 땅과 큰 나라들에게 예언했습니다
  - 많은 땅과 큰 나라들에 관해 예언했습니다
  rationale: 이 절은 한냐야의 낙관적 예언과 대비되는 심판 선언입니다. לכן/문맥상 전치사는 단순한 수신자 표지가 아니라 경고·심판의 방향을 나타내므로 ‘대하여’로 살렸습니다.
  doctrine_reference: 예언자적 심판 선포의 문맥 이해
