  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
  footnotes:
  - marker: a
    text: Or 'before the priests and before all the people.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: cultural_note
translation:
  language: ko
  text: 그때 예레미야 예언자가 제사장들이 보는 앞에서, 또 야훼의 집에 서 있는 온 백성이 보는 앞에서 하나냐 예언자에게 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제사장들과 온 백성 앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 집’, 곧 성전입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 … 말했습니다
  alternatives_korean:
  - 그리고 … 말했습니다
  - 그때 … 이르렀습니다
  lexicon: WLC/HALOT
  rationale: 와우-연속의 서술 진행을 한국어에서 자연스럽게 풀어, 시간적 전개를 살리면서도 문어체의 흐름을 유지했습니다.
- source_word: לְעֵינֵי
  english_pob_choice: in the sight of
  chosen_korean: 보는 앞에서
  alternatives_korean:
  - 목전에서
  - 보는 가운데
  - 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘눈앞에/보는 앞에’라는 공개 증언의 뉘앙스가 있어, 단순한 장소적 ‘앞에서’보다 목격 가능성과 공개성을 드러냈습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
