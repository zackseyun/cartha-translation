  - 주님의 집
  lexicon: WLC/POB glossary
  rationale: בַּיִת의 기본 이미지를 살려 ‘집’으로 옮기되, 본문이 가리키는 성전 문맥은 주석 없이도 자연스럽게 이해되므로 본문에서는 직역을 유지했습니다.
