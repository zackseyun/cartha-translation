  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אֶל חֲנַנְיָ֖ה הַ/נָּבִ֑יא לְ/עֵינֵ֤י הַ/כֹּֽהֲנִים֙ וּ/לְ/עֵינֵ֣י כָל הָ/עָ֔ם הָ/עֹמְדִ֖ים בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/005.yaml
  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
  footnotes:
  - marker: a
    text: Or 'before the priests and before all the people.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: cultural_note
translation:
  language: ko
  text: 그때 예레미야 예언자가 제사장들과 온 백성이 보는 앞에서 하나냐 예언자에게 말했습니다. 그들은 야훼의 집에 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘제사장들과 온 백성 앞에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 집’, 곧 성전입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 … 말했습니다
  alternatives_korean:
  - 그리고 … 말했습니다
  - 그때 … 이르렀습니다
  lexicon: WLC/HALOT
  rationale: 와우-연속의 서술 진행을 한국어에서 자연스럽게 풀어, 시간적 전개를 살리면서도 문어체의 흐름을 유지했습니다.
- source_word: לְעֵינֵי
  english_pob_choice: in the sight of
  chosen_korean: 보는 앞에서
  alternatives_korean:
  - 목전에서
  - 보는 가운데
  - 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘눈앞에/보는 앞에’라는 공개 증언의 뉘앙스가 있어, 단순한 장소적 ‘앞에서’보다 목격 가능성과 공개성을 드러냈습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: WLC/POB glossary
  rationale: בַּיִת의 기본 이미지를 살려 ‘집’으로 옮기되, 본문이 가리키는 성전 문맥은 주석 없이도 자연스럽게 이해되므로 본문에서는 직역을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: יַהְוֶה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 히브리어 본문에 직접 야훼의 이름이 나오므로, 프로젝트 기본어휘에 따라 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
