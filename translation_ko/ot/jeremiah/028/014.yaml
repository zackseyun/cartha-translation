source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי עַל צַוַּ֣אר כָּל הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה לַ/עֲבֹ֛ד אֶת נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וַ/עֲבָדֻ֑/הוּ וְ/גַ֛ם אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה נָתַ֥תִּי לֽ/וֹ־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/014.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: I have put an iron yoke on the necks of all these nations, to serve Nebuchadnezzar king of Babylon, and they shall serve him[b]. I have also given him the beasts of the field.'
  footnotes:
  - marker: a
    text: Hebrew 'Nebuchadnezzar'; Jeremiah elsewhere often has a spelling reflected in English as 'Nebuchadrezzar.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a yoke of iron.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「만군의 여호와, 이스라엘의 하나님께서 이렇게 말씀하십니다. 내가 이 모든 나라의 목에 쇠멍에를 두어 바빌론 왕 느부갓네살을 섬기게 하였고, 그가 그들을 섬기게 할 것입니다. 내가 그에게 들짐승들도 주었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘바빌론’ 왕의 이름을 느부갓네살로 적었지만, 예레미야서 다른 곳에는 느부갓레살에 가까운 철자가 나타납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 여호와
  alternatives_korean:
  - 여호와 만군의 주
  - 만군의 야훼
  lexicon: HALOT
  rationale: יהוה의 고유명은 한국어 교회 관용을 따라 ‘여호와’로 옮기되, צְבָאוֹת는 ‘만군의’로 붙여 군대/천상의 무리를 아우르는 칭호를 살렸습니다.
- source_word: עֹל בַּרְזֶל
  english_pob_choice: an iron yoke
  chosen_korean: 쇠멍에
  alternatives_korean:
  - 철멍에
  - 쇠로 된 멍에
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리면서도, 단순한 재질 묘사보다 압제와 예속의 이미지를 강하게 드러내는 한국어 표현으로 옮겼습니다.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  english_pob_choice: all these nations
  chosen_korean: 이 모든 나라
  alternatives_korean:
  - 이 모든 민족
  - 이 모든 족속
  lexicon: HALOT
  rationale: 문맥상 정치적 주권 아래 놓인 집단을 가리키므로 ‘나라’가 가장 직접적입니다. ‘민족’보다 통치·복속의 뉘앙스가 잘 드러납니다.
- source_word: לַעֲבֹד ... וַעֲבָדֻהוּ
  english_pob_choice: to serve ... and they will serve him
  chosen_korean: 섬기게 하였고, 그가 그들을 섬기게 할 것입니다
  alternatives_korean:
  - 복종하게 하였고, 그가 그들에게 복종을 강요할 것입니다
  - 종속되게 하였고, 그가 그들을 종속시킬 것입니다
  lexicon: HALOT
  rationale: עבד의 기본값은 ‘섬기다’이지만, 여기서는 왕에게 예속되는 정치적 종속을 뜻하므로 ‘섬기다’의 일반적 의미를 유지하면서 복속의 강도를 보존했습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the beasts of the field
  chosen_korean: 들짐승들
  alternatives_korean:
  - 들의 짐승들
  - 들판의 짐승들
  lexicon: HALOT
  rationale: 관용적 표현을 현대 한국어로 자연스럽게 옮겼습니다. 본문의 포괄적 의미는 유지하되 독자가 즉시 이해할 수 있게 했습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어 전통 표기로 유지할지 여부
  chosen_reading: 여호와를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 본 절의 영어 POB는 'Yahweh'를 사용하지만, 한국어 문장 전체의 가독성과 기존 교회 언어를 고려하면 ‘여호와’가 가장 안정적인 대응입니다. 다만 이는 본 프로젝트의 영어 표기 원칙과는 차이가 있다는 점을 인지합니다.
  doctrine_reference: Project glossary / divine name policy
- issue: ‘섬기다’의 정치적·신학적 무게
  chosen_reading: 바빌론에 대한 열방의 예속을 ‘섬기게 하다’로 직설적으로 유지했습니다.
  alternative_readings:
  - 복종하게 하다
  - 예속시키다
  rationale: 히브리어 עבד는 단순한 봉사보다 통치 아래 복속되는 의미를 가질 수 있으므로, 본문이 말하는 하나님의 주권적 심판을 희석하지 않도록 직설적 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
