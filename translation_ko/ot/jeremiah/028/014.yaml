  terminology: ‘만군의 여호와’, ‘이스라엘의 하나님’, ‘쇠멍에’, ‘느부갓네살’, ‘들짐승’은 안정적이고 적절합니다. 이름 철자 관련 각주는 해당 이름 바로 뒤에 붙여야 합니다.
