  source_fidelity: 히브리어의 심판 선언, 땅에서의 제거와 그해의 죽음, 그리고 야훼를 거슬러 말한 반역이라는 인과관계는 대체로 잘 반영되었습니다. 다만 ‘야훼께 반역을 말했다’는 조사가 원문의 적대적 방향(אֶל)을 충분히 드러내지 못하고 한국어로도 다소 부자연스럽습니다.
  naturalness: ‘땅의 얼굴에서’는 히브리어의 표면을 그대로 옮긴 표현이라 현대 표준 한국어 본문에서는 어색합니다. ‘땅 위에서’로 자연스럽게 옮기고 각주에서 직역과 관용적 의미를 밝혀 주는 편이 적절합니다. 각주 표지도 해당 어구와 단어 바로 뒤에 배치하는 것이 자연스럽습니다.
  terminology: ‘야훼’는 제시된 번역 방침과 일치합니다. סָרָה는 ‘반역’으로 옮길 수 있으나, 한국어에서는 ‘야훼를 거슬러 반역의 말을 했다’로 표현하여 원문의 ‘말하다’와 대적의 방향을 함께 살리는 것이 좋습니다.
