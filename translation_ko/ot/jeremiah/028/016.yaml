id: JER.28.16
reference: Jeremiah 28:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מְשַֽׁלֵּֽחֲ/ךָ֔ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה הַ/שָּׁנָה֙ אַתָּ֣ה מֵ֔ת כִּֽי סָרָ֥ה דִבַּ֖רְתָּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/016.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am sending you away from the face of the earth. This year you will die[b], because you have spoken rebellion against Yahweh.'
  footnotes:
  - marker: a
    text: Or, more formally, 'from off the face of the earth.' The Hebrew expression is an idiom for being removed from among the living.
    reason: lexical_alternative
  - marker: b
    text: Or 'you have spoken apostasy/defiance against the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 너를 땅의 얼굴에서 내보냅니다. 올해 너는 죽을 것입니다. 이는 네가 야훼께 반역을 말했기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅의 얼굴에서’입니다. 히브리어 관용구로서, 살아 있는 자들 가운데서 제거됨을 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘네가 야훼께 배교/반역을 말했기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: 히브리어 고유명 יְהוָה를 본문에서 지시하는 하나님의 이름으로 직접 옮기기 위해 야훼를 사용했습니다.
- source_word: הִנְנִי מְשַׁלֵּחֲךָ
  english_pob_choice: Look, I am sending you away
  chosen_korean: 보십시오, 내가 너를 내보냅니다
  alternatives_korean:
  - 보십시오, 내가 너를 보내겠습니다
  - 보십시오, 내가 너를 쫓아냅니다
  - 보십시오, 내가 너를 떠나게 합니다
  lexicon: HALOT
  rationale: 히브리어의 주의를 끄는 הִנְנִי와 משפט적 제거의 뉘앙스를 살리면서도, 죽음이라는 다음 절과 함께 자연스럽게 읽히도록 ‘내보냅니다’로 옮겼습니다.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: away from the face of the earth
  chosen_korean: 땅의 얼굴에서
  alternatives_korean:
  - 땅 위에서
  - 땅에서
  - 세상에서
  lexicon: HALOT
  rationale: ‘얼굴에서’라는 히브리어 관용구를 보존해, 단순한 장소 이동이 아니라 살아 있는 자리에서 제거됨을 드러냈습니다.
- source_word: סָרָה דִבַּרְתָּ אֶל יְהוָה
  english_pob_choice: you have spoken rebellion against Yahweh
  chosen_korean: 네가 야훼께 반역을 말했기 때문입니다
  alternatives_korean:
  - 네가 야훼께 배반을 말했기 때문입니다
  - 네가 야훼께 거역을 말했기 때문입니다
  - 네가 야훼를 향해 반역을 말했기 때문입니다
  lexicon: HALOT
  rationale: סָרָה를 단순한 ‘불순종’보다 강한 ‘반역’으로 옮겨 예언자에게 선포된 범죄의 무게를 살렸습니다.
theological_decisions:
- issue: ‘땅의 얼굴에서’라는 제거 표현의 의미
  chosen_reading: 본문의 제거 이미지를 유지하되, 바로 뒤의 ‘올해 너는 죽을 것입니다’가 그 의미를 죽음으로 해석해 줍니다.
  alternative_readings:
  - 단순한 추방/유배로 읽는 해석
  - 직역을 줄여 ‘세상에서 없애 버리다’로 완화하는 해석
  rationale: 히브리어 관용구를 살리면서도 문맥이 명시하는 사형 선고의 의미를 흐리지 않기 위해, 이미지와 해석을 함께 보존했습니다.
  doctrine_reference: 문맥 우선의 예언 심판 진술
- issue: ‘야훼께 반역’의 예언자 비난 성격
  chosen_reading: 예언적 발화가 단순한 의견 차이가 아니라 하나님의 권위에 대한 반역으로 규정된다는 점을 유지했습니다.
  alternative_readings:
  - ‘불순종’을 약하게 택하는 읽기
  - ‘배교’로 기술적 교리어를 택하는 읽기
  rationale: 히브리어 סָרָה의 강한 법정/언약적 뉘앙스를 살리되, 한국어 독자가 즉시 이해할 수 있는 강한 어휘를 선택했습니다.
  doctrine_reference: 언약적 반역과 예언 심판
