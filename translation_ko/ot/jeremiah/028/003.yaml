  source_fidelity: 초안의 ‘이레 이 년’은 히브리어 시간 관용구(‘두 해 안에’)를 잘못 옮겼습니다. 또한 관계절을 ‘이는 … 위함이라’라는 목적·이유 구조로 바꾸고 ‘가져오다’를 중복하여 원문의 단순한 수식 관계와 동작 순서를 흐립니다. 수정문은 느부갓네살이 성전 기물을 이곳에서 바빌론으로 옮긴 사실과 야훼께서 그것들을 이곳으로 되돌리겠다는 선언을 보존합니다.
  naturalness: ‘두 해 안에’, ‘이곳’, ‘되돌려 놓겠습니다’는 현대 표준어 합쇼체에 자연스럽습니다. ‘야훼의 집의 모든 그릇’은 히브리어의 ‘야훼의 집’을 보존하면서도 문맥상 성전 기물을 가리킴이 분명합니다.
  terminology: יְהוָה는 제공된 POB 방침과 영어 감사 기록에 따라 ‘야훼’로 옮겼습니다. כְּלֵי는 구체적인 성전 기물을 뜻하므로 ‘그릇’으로 유지했으며, 느부갓네살과 바빌론의 통용 표기를 사용했습니다.
