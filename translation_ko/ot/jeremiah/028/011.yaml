  text: וַ/יֹּ֣אמֶר חֲנַנְיָה֩ לְ/עֵינֵ֨י כָל הָ/עָ֜ם לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ כָּ֣כָה אֶשְׁבֹּ֞ר אֶת עֹ֣ל נְבֻֽכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֗ל בְּ/עוֹד֙ שְׁנָתַ֣יִם יָמִ֔ים מֵ/עַ֕ל צַוַּ֖אר כָּל הַ/גּוֹיִ֑ם וַ/יֵּ֛לֶךְ יִרְמְיָ֥ה הַ/נָּבִ֖יא לְ/דַרְכּֽ/וֹ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/011.yaml
  text: 'And Hananiah said in the sight of all the people[a], saying[b], “Thus says Yahweh: In this way I will break the yoke of Nebuchadnezzar king of Babylon from upon the neck of all the nations within two years.” Then Jeremiah the prophet went on his way.'
  footnotes:
  - marker: a
    text: Or “before all the people.”
    reason: lexical_alternative
  - marker: b
    text: The phrase “In this way” likely echoes Hananiah’s symbolic action of breaking the yoke.
    reason: cultural_note
translation:
  language: ko
  text: 하나냐가 모든 백성 앞에서 말하며 이렇게 말했습니다. “야훼께서 이렇게 말씀하십니다. 내가 바빌론 왕 느부갓네살의 멍에를 두 해 안에 모든 나라의 목에서 이와 같이 꺾어 버리겠습니다.” 그러자 예언자 예레미야는 자기 길로 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 백성 앞에서.”
    reason: lexical_alternative
  - marker: b
    text: ‘이와 같이’는 행위로 꺾은 멍에의 상징적 제스처를 가리키는 말일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְעֵינֵי כָל הָעָם
  english_pob_choice: in the sight of all the people
  chosen_korean: 모든 백성 앞에서
  alternatives_korean:
  - 모든 백성의 눈앞에서
  - 모든 백성의 보이는 데서
  lexicon: HALOT
  rationale: לְעֵינֵי는 문자적으로 ‘눈들 앞에’이지만, 공개적 발언의 장면을 뜻하므로 한국어에서는 자연스럽게 ‘앞에서’로 옮기되 공적 노출을 유지했습니다.
- source_word: כָּכָה
  english_pob_choice: In this way
  chosen_korean: 이와 같이
  alternatives_korean:
  - 이렇게
  - 그와 같이
  lexicon: HALOT
  rationale: 예언 선포의 כֹּה와 대비되는 כָּכָה의 지시성을 살려, 행위-말씀의 연결을 드러내는 ‘이와 같이’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 옮겼습니다.
- source_word: עֹל ... בְּעוֹד שְׁנָתַיִם יָמִים ... מֵעַל צַוַּאר
  english_pob_choice: the yoke ... within two years ... from upon the neck of
  chosen_korean: 멍에를 두 해 안에 ... 목에서
  alternatives_korean:
  - 멍에를 두 해가 되기 전에 ... 목에서
  - 멍에를 이 년 안에 ... 목에서
  lexicon: HALOT
  rationale: 멍에는 정치적 예속의 표준 은유이므로 그대로 살렸고, בְּעוֹד שְׁנָתַיִם יָמִים은 ‘두 해 안에’로 자연스럽게 옮겨 시간 한계를 전달했습니다.
- source_word: וַיֵּלֶךְ יִרְמְיָה הַנָּבִיא לְדַרְכּוֹ
  english_pob_choice: Then Jeremiah the prophet went on his way
  chosen_korean: 예언자 예레미야는 자기 길로 갔습니다
  alternatives_korean:
  - 예언자 예레미야는 길을 갔습니다
  - 예언자 예레미야는 떠났습니다
  lexicon: HALOT
  rationale: לְדַרְכּוֹ는 단순한 이동보다 ‘자기 길’로 돌아감/떠남의 관용을 담으므로, 서술의 흐름을 살려 ‘자기 길로 갔습니다’로 옮겼습니다.
theological_decisions:
- issue: 직접 인용 속 예언 공식의 존칭 처리
  chosen_reading: ‘야훼께서 이렇게 말씀하십니다’로 예언자 발화 안에서도 현대 공손체를 유지했습니다.
  alternative_readings:
  - ‘야훼께서 말씀하신다’
  - ‘야훼가 이렇게 말한다’
  rationale: 본문은 예언자의 공개 선포이므로 한국어 본문 전체의 문체 일관성을 위해 합쇼체를 유지하되, 직접 인용의 절대적 권위는 해치지 않도록 했습니다.
  doctrine_reference: 번역 문체와 직접 화법의 공적 선포성
