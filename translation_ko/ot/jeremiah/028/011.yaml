  to: 하나냐가 모든 백성이 보는 앞에서[a] 말했습니다. “야훼께서 이렇게 말씀하십니다. 내가 바빌론 왕 느부갓네살의 멍에를 두 해 안에 모든 나라의 목에서 이와 같이[b] 꺾겠습니다.” 그러자 예언자 예레미야는 제 갈 길을 갔습니다.
