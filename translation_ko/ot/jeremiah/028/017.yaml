lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 죽고 말았습니다
  - 사망했습니다
  lexicon: HALOT
  rationale: 히브리어 완료 서술형을 자연스러운 서사체로 옮기되, 과도하게 해설적이지 않게 기본 동사 ‘죽다’를 사용했습니다.
- source_word: חֲנַנְיָה
  english_pob_choice: Hananiah
  chosen_korean: 하나냐
  alternatives_korean:
  - 하난야
  - 하나니아
  lexicon: 고유명사 음역
  rationale: 인명은 현대 한국어 음역 관례에 따라 옮겼습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 거짓 예언자
  lexicon: HALOT
  rationale: 히브리어 נָבִיא는 기본적으로 ‘예언자/선지자’이지만, 본 절 자체는 부정적 수식어를 붙이지 않으므로 원문의 명칭을 그대로 유지했습니다.
- source_word: בַּשָּׁנָה הַהִיא
  english_pob_choice: in that year
  chosen_korean: 그해에
  alternatives_korean:
  - 그 해에
  - 그 해
  lexicon: HALOT
  rationale: 지시적 표현을 한국어 서사에서 자연스럽게 살리기 위해 ‘그해에’로 옮겼습니다. 영어 POB의 ‘in that year’보다 더 강한 ‘같은’의 의미는 넣지 않았습니다.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: in the seventh month
  chosen_korean: 일곱째 달에
  alternatives_korean:
  - 7월에
  - 일곱 번째 달에
  lexicon: HALOT
  rationale: 고대 히브리력의 달 표현이므로 현대 양력 월로 바꾸지 않고, 직접적으로 ‘일곱째 달’로 옮겼습니다.
theological_decisions:
- issue: 하나냐의 직함을 ‘거짓 예언자’로 강화할지 여부
  chosen_reading: 본문의 직함을 따라 ‘예언자’로 유지했습니다.
  alternative_readings:
  - 거짓 예언자
  rationale: 문맥상 하나냐의 발언은 거짓으로 판명되지만, 본 절의 히브리어는 단순히 ‘예언자’라고만 부릅니다. 평가를 본문 밖에서 덧붙이지 않았습니다.
  doctrine_reference: '원문 우선 원칙: 본문이 명시하지 않은 판단어를 번역에 추가하지 않습니다.'
