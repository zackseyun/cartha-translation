source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑ה אַ֠חֲרֵי שְׁב֞וֹר חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֗ל צַוַּ֛אר יִרְמְיָ֥ה הַ/נָּבִ֖יא לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/012.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after Hananiah the prophet had broken the yoke from off the neck of Jeremiah the prophet, saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''the yoke''; the noun can refer more specifically to the yoke-bar or wooden crosspiece.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한나냐 예언자가 예레미야 예언자의 목에서 멍에[a]를 부러뜨린 뒤에 야훼의 말씀이 예레미야에게 임했습니다. 말씀하시기를,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘멍에’는 더 구체적으로 멍에막대기나 목에 메는 나무 가로대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  english_pob_choice: Then the word of Yahweh came
  chosen_korean: 그때 야훼의 말씀이 임했습니다
  alternatives_korean:
  - 그때 야훼의 말씀이 예레미야에게 이르렀습니다
  - 그때 야훼의 말씀이 예레미야에게 왔습니다
  lexicon: HALOT
  rationale: 예언서의 표준 도입 공식을 살리되, 현대 한국어에서 자연스러운 ‘임하다’로 말씀의 도래와 신적 주도권을 함께 드러냈습니다.
- source_word: שְׁבֹר חֲנַנְיָה הַנָּבִיא אֶת הַמּוֹטָה
  english_pob_choice: after Hananiah the prophet had broken the yoke
  chosen_korean: 한나냐 예언자가 ... 멍에를 부러뜨린 뒤였습니다
  alternatives_korean:
  - 한나냐 예언자가 ... 멍에를 깨뜨린 뒤였습니다
  - 한나냐 예언자가 ... 멍에 막대를 부러뜨린 뒤였습니다
  lexicon: HALOT
  rationale: 문맥상 표적 행위의 대상은 멍에이며, 영어 POB의 주석이 ‘yoke-bar’ 가능성을 밝히지만 본문에서는 가장 분명한 ‘멍에’를 유지하고 동사 ‘부러뜨리다’로 행위의 물리성을 살렸습니다.
- source_word: מֵעַל צַוַּאר
  english_pob_choice: from off the neck of
  chosen_korean: 목에서
  alternatives_korean:
  - 목 위에서
  - 목으로부터
  lexicon: HALOT
  rationale: 히브리어의 ‘위에서 떼어내다’는 힘을 한국어에서는 간결하게 ‘목에서’로 옮기되, 앞선 ‘부러뜨리다’와 함께 제거 동작이 분명히 드러나도록 했습니다.
- source_word: יִרְמְיָה הַנָּבִיא
  english_pob_choice: Jeremiah the prophet
  chosen_korean: 예레미야 예언자
  alternatives_korean:
  - 예레미야 선지자
  - 예레미야, 예언자
  lexicon: HALOT
  rationale: 프로젝트 기본어인 ‘예언자’를 유지해 본문의 직함 반복을 살렸고, 군더더기 쉼표 없이 현대 문장 흐름에 맞췄습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본 프로젝트 기본 규범에 따라 텍스트의 고유 신명인 יהוה를 ‘야훼’로 옮겨, 호칭이 아닌 고유 이름이라는 점을 보존했습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
- issue: 예언 도입문의 종결 처리
  chosen_reading: 말씀하시기를,
  alternative_readings:
  - 말씀하여 이르시기를,
  - 말하셨습니다
  rationale: 다음 절의 직접 인용이 이어지는 구조를 보존하기 위해 ‘말씀하시기를’로 끝내어 서술과 인용의 경계를 유지했습니다.
  doctrine_reference: Narrative quotation linkage in prophetic speech
