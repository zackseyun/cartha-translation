  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אָמֵ֕ן כֵּ֖ן יַעֲשֶׂ֣ה יְהוָ֑ה יָקֵ֤ם יְהוָה֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֣ר נִבֵּ֗אתָ לְ/הָשִׁ֞יב כְּלֵ֤י בֵית יְהוָה֙ וְ/כָל הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל אֶל הַ/מָּק֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/006.yaml
  text: Then Jeremiah the prophet said[a], “Amen! May Yahweh do so; may Yahweh fulfill your words that you have prophesied, to bring back the vessels of the house of Yahweh and all the exiles from Babylon to this place.”
  footnotes:
  - marker: a
    text: Or, 'confirm' or 'establish your words.' The Hebrew verb can mean to make words stand, that is, to bring them to pass.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예레미야 선지자가 말했습니다. “아멘. 야훼께서 그렇게 하시기를 바랍니다. 야훼께서 당신이 예언한 말씀을 이루시어[a] 야훼의 집에 속한 기물들과 바빌론에서 온 모든 포로를 이곳으로 돌아오게 하시기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이루시어’는 히브리어 동사 קום의 힢힐형이 지닌 관용적 의미를 반영합니다. 직역하면 ‘말씀이 서게 하다’ 또는 ‘확립하다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֵן
  english_pob_choice: Amen
  chosen_korean: 아멘
  alternatives_korean:
  - 그렇게 되기를
  - 진실로
  lexicon: HALOT
  rationale: 히브리어 감탄사/동의 표현을 교회적·전례적 용례가 있는 ‘아멘’으로 보존해, 예레미야의 동의와 소망을 함께 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 ‘야훼’를 사용해 하나님의 고유 이름을 직접 드러냈습니다.
- source_word: יָקֵם
  english_pob_choice: fulfill
  chosen_korean: 이루셔서
  alternatives_korean:
  - 확증하셔서
  - 세우셔서
  - 성취하셔서
  lexicon: HALOT
  rationale: ‘말씀이 서게 하다’는 히브리어의 관용적 힘을 한국어에서 자연스럽게 전달하는 동사로, 예언의 성취를 분명히 표현했습니다.
- source_word: כְּלֵי בֵית יְהוָה
  english_pob_choice: the vessels of the house of Yahweh
  chosen_korean: 야훼의 집의 그릇들
  alternatives_korean:
  - 야훼의 집의 기물들
  - 성전 그릇들
  lexicon: HALOT
  rationale: temple articles를 가리키는 כְּלִים을 ‘그릇들’로 옮겨 구체적 사물을 살렸고, ‘야훼의 집’도 직역해 성전 지칭을 유지했습니다.
- source_word: הַגּוֹלָה
  english_pob_choice: all the exiles
  chosen_korean: 모든 포로들
  alternatives_korean:
  - 모든 유배자들
  - 모든 귀환자들
  lexicon: HALOT
  rationale: 여기서 הגולה는 강제 이주된 포로 공동체를 가리키므로, 단순한 ‘유배자’보다 구속된 상태를 드러내는 ‘포로들’이 문맥에 더 직접적입니다.
theological_decisions:
- issue: 예레미야의 발화가 예언의 확정인지 소망인지
  chosen_reading: ‘아멘. 야훼께서 그렇게 하시기를 바랍니다…’라는 소망/기도의 형식으로 옮겼습니다.
  alternative_readings:
  - ‘야훼께서 그렇게 하실 것입니다…’라는 단순 미래 진술
  - 예레미야가 상대의 예언을 그대로 승인하는 표현
  rationale: ‘아멘’ 뒤의 미완료형들은 문맥상 서술적 예언보다 소망·기원의 뉘앙스가 강하므로, 원문의 긴장—예레미야가 좋은 예언의 성취를 바라지만 곧바로 사실 확정으로 말하지는 않는 긴장—을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
