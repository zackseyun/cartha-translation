id: JER.28.2
reference: Jeremiah 28:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר שָׁבַ֞רְתִּי אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
  footnotes:
  - marker: a
    text: Or 'the LORD of armies.' The Hebrew title 'LORD of hosts' refers to the forces under God's command.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼 만군의 하나님, 이스라엘의 하나님께서 이렇게 말씀하십니다. “내가 바빌론 왕의 멍에를 꺾었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의 하나님’은 히브리어 צְבָאוֹת의 관용적 번역으로, 하나님께 속한 모든 군세와 권세를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 군대들의 하나님
  - 야훼의 군대의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת은 전쟁의 군대뿐 아니라 하늘의 군세까지 포함하는 호칭이므로, 한국어에서는 관용적이면서도 범위를 넓게 담는 ‘만군의 하나님’으로 옮겼습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님이신
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 결합을 자연스럽게 살려, 언약적 정체성을 드러내는 ‘이스라엘의 하나님’으로 직역했습니다.
- source_word: שָׁבַרְתִּי
  english_pob_choice: I have broken
  chosen_korean: 내가 … 꺾었습니다
  alternatives_korean:
  - 내가 … 부러뜨렸습니다
  - 내가 … 깨뜨렸습니다
  lexicon: HALOT
  rationale: מלך의 ‘멍에’를 다루는 비유에서는 물리적 ‘부러뜨리다’보다 구속과 압제를 끊는 의미가 드러나는 ‘꺾다’가 더 직접적입니다.
- source_word: עֹל
  english_pob_choice: yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 목줄
  - 굴레
  lexicon: HALOT
  rationale: 예레미야서에서 정치적 예속을 가리키는 핵심 은유이므로, 전통적이면서도 의미가 분명한 ‘멍에’를 유지했습니다.
theological_decisions:
- issue: 예언 선포 공식의 시제와 화자 표현
  chosen_reading: ‘이렇게 말씀하십니다’로 현재형 선포를 살렸고, 하나님의 직접 화법은 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘말씀하셨습니다’
  - ‘말합니다’
  rationale: כֹּה אָמַר는 단순 과거 보고가 아니라 권위 있는 예언 선포 공식이므로, 영어 POB의 ‘Thus says’에 맞춰 현재적 선언으로 번역했습니다.
  doctrine_reference: 예언 선포의 현재성 및 하나님의 직접 발화 표지
