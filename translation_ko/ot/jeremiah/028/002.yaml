  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
  footnotes:
  - marker: a
    text: Or 'the LORD of armies.' The Hebrew title 'LORD of hosts' refers to the forces under God's command.
