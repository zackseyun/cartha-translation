  source_fidelity: 개정이 필요합니다. 히브리어는 ‘여호야김의 아들, 유다 왕 여고냐’를 동격으로 수식하는데, 초안의 ‘유다 왕 여고냐와 여호야김의 아들’은 두 인물을 병렬로 읽히게 하여 관계를 잘못 전달합니다. 또한 גָּלוּת와 뒤따르는 분사를 사람들의 집단으로 옮긴 ‘유다의 모든 포로’ 및 ‘바벨론에 온’은 가능한 번역입니다.
  naturalness: 초안의 문장 연결은 ‘…데려오겠다고 야훼께서 말씀하십니다’ 뒤에 다시 야훼의 직접 발화가 이어져 한국어로 다소 어색합니다. 예언자적 선언을 ‘야훼의 말씀입니다’로 독립시키고, 발화를 합쇼체 직접화법으로 일관되게 제시하는 편이 자연스럽습니다.
  terminology: ‘여고냐’, ‘야훼’, ‘멍에’는 적절합니다. ‘유다 왕’은 자연스러운 수식 관계를 위해 ‘유다 왕인’으로 바로잡아야 합니다. 각주 표기 ‘[ [a] ]’는 구조적으로 잘못되었고, 현 각주 내용은 인명 뒤가 아니라 ‘바벨론에 온’에 연결되어야 합니다.
