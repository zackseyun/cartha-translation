id: JER.28.4
reference: Jeremiah 28:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת יְכָנְיָ֣ה בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְ֠הוּדָה וְ/אֶת כָּל גָּל֨וּת יְהוּדָ֜ה הַ/בָּאִ֣ים בָּבֶ֗לָ/ה אֲנִ֥י מֵשִׁ֛יב אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה נְאֻם יְהוָ֑ה כִּ֣י אֶשְׁבֹּ֔ר אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/004.yaml
  text: And I will bring back to this place Jeconiah son of Jehoiakim[a], king of Judah, and all the exiles of Judah who came to Babylon, declares Yahweh, for I will break the yoke of the king of Babylon.
  footnotes:
  - marker: a
    text: Or 'who came to Babylon.' The Hebrew participle is literally 'the ones coming to Babylon,' but English idiom from Judah's perspective often uses 'went.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 유다 왕 여고냐와 여호야김의 아들[ [a] ]과 바벨론으로 온 유다의 모든 포로를 이곳으로 다시 데려오겠다고 야훼께서 말씀하십니다. 내가 바벨론 왕의 멍에를 꺾을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바벨론으로 온”. 히브리어 분사는 문자적으로는 “바벨론으로 오는 자들”이지만, 한국어에서는 문맥상 유다에서 바라본 방향을 자연스럽게 ‘온’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכָנְיָה
  english_pob_choice: Jeconiah
  chosen_korean: 여고냐
  alternatives_korean:
  - 여호야긴
  - 여고니야
  lexicon: 이름 표기
  rationale: 이 본문 인물은 여호야김의 아들로 알려진 유다 왕 여고냐이므로, 한국어 성경에서 널리 쓰이는 형태를 따라 옮겼습니다.
- source_word: גָּל֨וּת יְהוּדָ֜ה
  english_pob_choice: the exiles of Judah
  chosen_korean: 유다의 모든 포로
  alternatives_korean:
  - 유다의 포로들
  - 유다의 유배자들
  lexicon: HALOT
  rationale: 명사 גָּלוּת는 단순한 상태보다 추방된 사람들을 가리킬 수 있어, 문맥상 집단을 분명히 드러내는 ‘포로’로 옮겼습니다.
- source_word: הַבָּאִים בָּבֶלָה
  english_pob_choice: who came to Babylon
  chosen_korean: 바벨론으로 온
  alternatives_korean:
  - 바벨론으로 간
  - 바벨론에 이른
  lexicon: HALOT
  rationale: 히브리어 분사 ‘오는/오고 있는 자들’을 살려 ‘온’으로 옮기되, 유다인의 시점에서 방향을 자연스럽게 드러냈습니다.
- source_word: מֵשִׁיב אֶל הַמָּקוֹם הַזֶּה
  english_pob_choice: I will bring back to this place
  chosen_korean: 이곳으로 다시 데려오겠다고
  alternatives_korean:
  - 이곳으로 다시 돌아오게 하겠다고
  - 이곳으로 회복시키겠다고
  lexicon: HALOT
  rationale: הֵשִׁיב는 ‘돌아오게 하다/데려오다’의 동사로, 사람과 장소 목적어가 함께 있어 귀환의 움직임을 분명히 하는 표현을 택했습니다.
- source_word: עֹל
  english_pob_choice: the yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 목줄
  - 억압
  lexicon: HALOT
  rationale: 정치적 예속의 상징을 보존하기 위해 비유를 풀지 않고 ‘멍에’로 직역성 있게 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명 표기 יְהוָה를 존칭 대체어로 바꾸지 않고, 공용 번역 원칙에 따라 고유명 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
