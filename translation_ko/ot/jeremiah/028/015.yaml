base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
  footnotes:
  - marker: a
    text: Or “the LORD did not send you.”
    reason: lexical_alternative
  - marker: b
    text: Or “you caused this people to trust on falsehood.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예언자 예레미야가 예언자 하나냐에게 말했습니다. 「부디[a] 들으십시오, 하나냐. 야훼께서 당신을 보내지 않으셨습니다. 그런데 당신은 이 백성이 거짓을 믿게 했습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부디’는 히브리어 נא의 간청·권유의 뉘앙스를 반영합니다.
    reason: korean_style_note
  - marker: b
    text: ‘믿게 했습니다’는 히브리어 히필형 הִבְטַחְתָּ의 사역적 의미를 옮긴 것입니다.
    reason: lexical_alternative
