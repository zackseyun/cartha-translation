  text: וַ/יֹּ֨אמֶר יִרְמְיָ֧ה הַ/נָּבִ֛יא אֶל חֲנַנְיָ֥ה הַ/נָּבִ֖יא שְׁמַֽע נָ֣א חֲנַנְיָ֑ה לֹֽא שְׁלָחֲ/ךָ֣ יְהוָ֔ה וְ/אַתָּ֗ה הִבְטַ֛חְתָּ אֶת הָ/עָ֥ם הַ/זֶּ֖ה עַל שָֽׁקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
  footnotes:
  - marker: a
    text: Or “the LORD did not send you.”
    reason: lexical_alternative
  - marker: b
    text: Or “you caused this people to trust on falsehood.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예언자 예레미야가 예언자 하나냐에게 말했습니다. 「들으십시오, 하나냐. 야훼께서 당신을 보내지 않으셨습니다. 그런데 당신은 이 백성이 거짓을 믿게 했습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들으십시오’는 נא의 간청을 반영한 정중한 명령형입니다.
    reason: korean_style_note
  - marker: b
    text: ‘믿게 했습니다’는 히필형 הִבְטַחְתָּ의 사역적 의미를 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 자연스러운 순서 표지로 살려, 사건이 이어짐을 분명히 했습니다.
- source_word: שְׁמַע נָא
  english_pob_choice: Listen, please
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으소서
  - 듣기를 바랍니다
  lexicon: HALOT
  rationale: נא의 간청 뉘앙스는 살리되, 현대 한국어 합쇼체에서 가장 자연스러운 정중한 명령형으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 학술 음역인 야훼를 사용해 원문 고유명을 드러냈습니다.
- source_word: לֹא שְׁלָחֲךָ יְהוָה
  english_pob_choice: Yahweh has not sent you
  chosen_korean: 야훼께서 당신을 보내지 않으셨습니다
  alternatives_korean:
  - 야훼께서 당신을 보내지 않았습니다
  - 주님께서 당신을 보내지 않으셨습니다
  lexicon: HALOT
  rationale: שלח의 파송/권위 부여 의미를 ‘보내다’로 직접 살리고, 완료형의 현재적 효력을 한국어 과거부정으로 자연스럽게 반영했습니다.
- source_word: הִבְטַחְתָּ
  english_pob_choice: you have made ... trust
  chosen_korean: 믿게 했습니다
  alternatives_korean:
  - 신뢰하게 했습니다
  - 믿도록 했습니다
  lexicon: HALOT
  rationale: 히필의 사역성을 한국어 사동으로 옮기되, 대상이 되는 백성의 반응을 가장 간결하게 드러내는 표현을 택했습니다.
- source_word: עַל שָׁקֶר
  english_pob_choice: in a lie
  chosen_korean: 거짓을
  alternatives_korean:
  - 거짓 위에
  - 거짓말 속에
  - 거짓에
  lexicon: HALOT
  rationale: שׁקר의 명사성을 유지하면서도 한국어에서는 ‘거짓을 믿다’가 오도된 신뢰를 가장 자연스럽게 표현합니다.
theological_decisions:
- issue: 예언자의 진정성 여부를 드러내는 책망의 직설성
  chosen_reading: 하나냐가 야훼의 파송 없이 말했음을 예레미야가 단정적으로 선포하는 직설체를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘하나냐는 보냄을 받지 않았습니다’로 흐릴 수 있음
  - ‘거짓말했다’로 도덕적 비난을 앞세울 수 있음
  rationale: 본문은 예언자 직임의 정당성 자체를 다투는 장면이므로, 완곡화하지 않고 파송 부재와 백성의 잘못된 신뢰를 분명히 드러내야 합니다.
  doctrine_reference: Jeremiah 28의 예언자 판별 표지
- issue: 하나님 이름의 번역
  chosen_reading: יהוה를 야훼로 옮기고, ‘주님’으로 대체하지 않았습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 편집 방침상 원문의 언약적 고유명사를 보존하는 것이 문맥의 긴장과 논쟁성을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
