  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָלוֹךְ֩ וְ/אָמַרְתָּ֨ אֶל חֲנַנְיָ֜ה לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מוֹטֹ֥ת עֵ֖ץ שָׁבָ֑רְתָּ וְ/עָשִׂ֥יתָ תַחְתֵּי/הֶ֖ן מֹט֥וֹת בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/013.yaml
  text: 'Go and say to Hananiah, saying, ‘Thus says the LORD: You have broken wooden yoke-bars, but you have made iron yoke-bars in their place.’'
translation:
  language: ko
  text: “가서 한냐에게 말하시오. ‘야훼께서 이렇게 말씀하십니다. 너는 나무 멍에를 부러뜨렸으나, 그 자리에는 쇠 멍에를 만들어 놓았소.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ אֶל חֲנַנְיָה לֵאמֹר
  english_pob_choice: Go and say to Hananiah, saying
  chosen_korean: “가서 한냐에게 말하시오.”
  alternatives_korean:
  - “가서 한냐에게 말하십시오.”
  - “한냐에게 가서 말하시오.”
  lexicon: 가다 / 말하다
  rationale: 명령형 연속을 자연스러운 한국어로 옮기되, POB의 'saying'을 별도 직역하기보다 인용 도입 구조 안에 흡수해 구어적 반복을 줄였습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says the LORD
  chosen_korean: ‘야훼께서 이렇게 말씀하십니다.
  alternatives_korean:
  - ‘여호와께서 이렇게 말씀하십니다.
  - ‘주님께서 이렇게 말씀하십니다.
  lexicon: 야훼
  rationale: 사전 기본값에 따라 YHWH를 ‘야훼’로 옮겨 원문 고유명을 드러냈고, 예언 인용의 공적 선언체를 위해 공손한 현재형 ‘말씀하십니다’를 사용했습니다.
- source_word: מוֹטֹת עֵץ שָׁבָרְתָּ ... מֹטוֹת בַּרְזֶל
  english_pob_choice: wooden yoke-bars ... iron yoke-bars
  chosen_korean: 나무 멍에 ... 쇠 멍에
  alternatives_korean:
  - 나무 요목 ... 쇠 요목
  - 나무 멍에 막대 ... 쇠 멍에 막대
  lexicon: מֹטָה / 멍에
  rationale: 문맥상 짐승의 목에 얹는 ‘멍에’가 한국어 성서독자에게 의미가 가장 분명하며, 나무/쇠의 대조도 자연스럽게 보존됩니다.
theological_decisions:
- issue: 예언 인용 내부의 공손체
  chosen_reading: 직접 화법 안에서도 야훼의 선포는 ‘말씀하십니다’로 유지했습니다.
  alternative_readings:
  - ‘말씀하시오’
  - ‘말씀하십니다’ 없이 평서형으로 처리
  rationale: 예언 공식 ‘야훼께서 이렇게 말씀하십니다’는 본문의 권위 선언을 드러내므로, 현대 공용역체에 맞는 공손체를 유지했습니다.
  doctrine_reference: 예언자적 수사와 신적 발화의 직접성
- issue: ‘그 자리에는’의 보충
  chosen_reading: ‘그 자리에는’은 원문의 ‘대신/그 아래’(תַחְתֵּיהֶן)를 자연스럽게 풀어준 표현입니다.
  alternative_readings:
  - ‘그 대신’
  - ‘그것들 아래에’
  rationale: 히브리어의 교체·대체 의미를 한국어에서 분명히 하되, 원문의 상징적 대비를 흐리지 않도록 간결하게 처리했습니다.
  doctrine_reference: 문맥적 충실 번역
