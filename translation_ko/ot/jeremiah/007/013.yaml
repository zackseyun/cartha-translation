id: JER.7.13
reference: Jeremiah 7:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יַ֧עַן עֲשׂוֹתְ/כֶ֛ם אֶת כָּל הַ/מַּֽעֲשִׂ֥ים הָ/אֵ֖לֶּה נְאֻם יְהוָ֑ה וָ/אֲדַבֵּ֨ר אֲלֵי/כֶ֜ם הַשְׁכֵּ֤ם וְ/דַבֵּר֙ וְ/לֹ֣א שְׁמַעְתֶּ֔ם וָ/אֶקְרָ֥א אֶתְ/כֶ֖ם וְ/לֹ֥א עֲנִיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/013.yaml
  text: And now[a], because you have done all these deeds, declares Yahweh, and I spoke to you, rising early and speaking, but you did not listen, and I called to you, but you did not answer[b],
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''rising early and speaking,'' expressing persistent or eager repeated address.'
    reason: cultural_note
  - marker: b
    text: Or 'speaking persistently.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 너희가 이 모든 일을 행하였으므로—야훼의 말씀입니다—내가 너희에게 일찍 일어나 말씀하였으나[a] 너희가 듣지 않았고, 내가 너희를 불렀으나 너희가 대답하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘일찍 일어나 말씀하다’는 반복적이고 간절한 말씀하심을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환을 자연스럽게 살리면서도, 예언적 책망의 흐름을 이어 주는 간결한 한국어로 옮겼습니다.
- source_word: יַעַן עֲשׂוֹתְכֶם אֶת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  english_pob_choice: because you have done all these deeds
  chosen_korean: 너희가 이 모든 일을 행하였으므로
  alternatives_korean:
  - 너희가 이 모든 행위를 하였기 때문에
  - 너희가 이 모든 일을 했으므로
  lexicon: HALOT
  rationale: 원문의 인과 관계를 분명히 하되, 예언 문맥의 도덕적 책망을 살려 '행하다'를 선택했습니다.
- source_word: הַשְׁכֵּם וְדַבֵּר
  english_pob_choice: rising early and speaking
  chosen_korean: 일찍이 일어나 말하였으나
  alternatives_korean:
  - 일찍 일어나 말하며
  - 부지런히 일어나 말씀하였으나
  lexicon: HALOT
  rationale: 히브리 관용구의 반복적·간절한 뉘앙스를 살리면서, 한국어에서는 문장 흐름상 '일찍이 일어나'로 풀어 자연스럽게 표현했습니다.
- source_word: וְלֹא שְׁמַעְתֶּם / וְלֹא עֲנִיתֶם
  english_pob_choice: you did not listen / you did not answer
  chosen_korean: 너희가 듣지 않았고 ... 너희가 대답하지 않았습니다
  alternatives_korean:
  - 너희가 듣지 않았고 ... 응답하지 않았습니다
  - 너희가 순종하지 않았고 ... 대답하지 않았습니다
  lexicon: HALOT
  rationale: '''듣다''와 ''대답하다''의 대화적 대응을 유지해, 하나님의 반복적 부르심에 대한 거부를 직접적으로 드러냈습니다.'
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문 고유명을 직접 반영해, 전통적 대체어 대신 하나님의 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언적 책망의 수사 구조
  chosen_reading: 반복된 말씀-부르심-무응답 구조를 직역에 가깝게 유지
  alternative_readings:
  - 의미를 풀어 '거듭 말씀하셨으나'로 정리
  - 더 압축해 한 번의 책망으로 정리
  rationale: 하나님이 먼저 말씀하시고 부르시는데도 백성이 듣지 않는 긴장을 그대로 보여 주어야 하므로, 수사적 반복을 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
