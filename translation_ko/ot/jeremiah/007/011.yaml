  - 이 집
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘이 집’이지만, 문맥상 성전을 가리키므로 한국어에서도 직역을 유지하되 의미는 문맥으로 드러내는 것이 가장 투명합니다.
- source_word: מְעָרַת פָּרִצִים
