  - 폭력배들의 은신처
  lexicon: HALOT
  rationale: POB의 ‘den of robbers’를 따라, ‘소굴’로 은신처 이미지를 살리고 ‘강도들’로 약탈성과 폭력성을 함께 담았습니다.
- source_word: בְּעֵינֵיכֶם
  english_pob_choice: in your eyes
  chosen_korean: 너희 눈에는
  alternatives_korean:
