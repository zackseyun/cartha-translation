  rationale: 예언자적 경고의 권위를 드러내기 위해, 문어체 종결 공식으로 옮겼습니다. 원문의 נְאֻם יְהוָה를 단순한 설명이 아니라 신적 선포로 보존합니다.
  doctrine_reference: 'POB doctrine: render יְהוָה as Yahweh; preserve prophetic formulae without domesticating them.'
