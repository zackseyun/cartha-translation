base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/011.yaml
  text: Has this house[a], which is called by my name, become a den of robbers in your eyes? Even I myself, look, I have seen it, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'a cave of violent men' or 'a den of bandits.' The Hebrew phrase can emphasize violent, lawless people as well as robbers specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 집이 너희 눈에는 강도들의 소굴이 되었느냐? 나, 바로 나도 보았다. 야훼의 말씀이니라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강도들’은 여기서 단순한 절도범만이 아니라 폭력적이고 무법한 사람들까지 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
