  - 자기들의 조언들 가운데
  lexicon: HALOT
  rationale: מוֹעֵצוֹת는 단순한 ‘조언’보다 판단하여 세운 계획·책략의 뉘앙스가 있어, 예레미야의 문맥에 맞는 ‘계책’으로 옮겼습니다.
- source_word: בִּשְׁרִר֖וּת לִבָּם הָרָע
  english_pob_choice: in the stubbornness of their evil heart
  chosen_korean: 자기들의 악한 마음의 완고함 속에서
  alternatives_korean:
  - 자기들의 악한 마음의 고집 속에서
  - 자기들의 악한 마음의 완악함 속에서
  lexicon: HALOT
  rationale: שְׁרִרוּת은 완고한 자기 고집을 뜻하므로 ‘완고함’으로 살렸고, לֵב은 감정보다 의지와 생각을 포함하는 내면 전체이므로 ‘마음’으로 번역했습니다.
- source_word: וַיִּהְי֥וּ לְאָחוֹר וְלֹא לְפָנִים
  english_pob_choice: they went backward and not forward
  chosen_korean: 뒤로 물러갔지 앞으로 나아가지 않았습니다
  alternatives_korean:
  - 뒤로 갔지 앞으로 가지 않았습니다
  - 뒤로 향했지 앞으로 향하지 않았습니다
  lexicon: HALOT
  rationale: 방향 대비를 한국어에서 가장 자연스럽게 전달하되, 예레미야의 도덕적·역사적 퇴보 이미지를 유지하도록 ‘뒤로/앞으로’의 대조를 살렸습니다.
theological_decisions:
- issue: ‘악한 마음’과 인간 내면의 상태
  chosen_reading: 이 구절의 내면 묘사를 그대로 유지하고, 이를 후대 교리 용어로 확장하지 않았습니다.
  alternative_readings:
  - ‘죄된 본성’으로 의역하기
  - ‘전적으로 악한 마음’으로 강화하기
  rationale: 본문은 그들의 내면이 악하고 완고하다고 진술할 뿐이므로, 번역은 그 도덕적 평가를 보존하되 본문이 말하지 않는 신학적 체계를 덧붙이지 않아야 합니다.
  doctrine_reference: 본문이 말하는 바를 보존하고, 본문이 말하지 않는 교리적 확대는 피한다.
