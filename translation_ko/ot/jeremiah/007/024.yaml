  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 ‘주의 깊게 듣고 따르는 것’까지 넓게 가리킬 수 있어, 여기서는 문맥에 맞게 ‘듣지 않다’로 옮기되 ‘순종’으로까지 좁히지는 않았습니다.
- source_word: הִטּוּ אֶת אָזְנָם
  english_pob_choice: did not incline their ear
  chosen_korean: 귀를 기울이지도 않았습니다
  alternatives_korean:
  - 귀를 돌리지도 않았습니다
  - 귀를 기울이지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 표현으로 옮기면서도, ‘기울이다’의 비유를 살려 주의 깊게 받아들이지 않았다는 뜻을 보존했습니다.
- source_word: בְּמֹעֵצוֹת
  english_pob_choice: in their own counsels
  chosen_korean: 자기들의 계책대로
  alternatives_korean:
