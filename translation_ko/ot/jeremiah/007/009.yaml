  text: הֲ/גָנֹ֤ב רָצֹ֨חַ֙ וְֽ/נָאֹ֔ף וְ/הִשָּׁבֵ֥עַ לַ/שֶּׁ֖קֶר וְ/קַטֵּ֣ר לַ/בָּ֑עַל וְ/הָלֹ֗ךְ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/009.yaml
  text: Will you steal[a], murder, commit adultery, swear falsely, burn incense to Baal[b], and go after other gods that you have not known—
  footnotes:
  - marker: a
    text: Or 'follow other gods.'
    reason: lexical_alternative
  - marker: b
    text: The clause 'that you have not known' may also be rendered 'whom you have not known' or, interpretively, 'whom you have not acknowledged.'
