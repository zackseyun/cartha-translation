translation:
  language: ko
  text: 도둑질하고, 살인하고, 간음하고, 거짓으로 맹세하고, 바알에게 분향하고, 또 너희가 알지 못한 다른 신들을 따라가겠느냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 신들을 따르겠느냐’.
    reason: lexical_alternative
  - marker: b
    text: ‘너희가 알지 못한’은 문맥상 ‘너희가 인정하지 않은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/גָנֹב
  english_pob_choice: Will you steal
  chosen_korean: 도둑질하고
  alternatives_korean:
  - 도둑질하겠느냐
  - 훔치겠느냐
  lexicon: HALOT
  rationale: 히브리어의 수사 의문형을 한국어에서는 예언적 책망의 연속성을 살려 동사열로 옮기되, 합쇼체 문맥에 맞게 자연스럽게 구성했습니다.
- source_word: רָצֹחַ
  english_pob_choice: murder
  chosen_korean: 살인하고
  alternatives_korean:
  - 죽이고
  - 살해하고
  lexicon: HALOT
  rationale: רצח은 일반적 살해가 아니라 불법적 살인을 가리키므로, 윤리적·법적 강도를 살린 ‘살인하다’ 계열을 택했습니다.
- source_word: וְהִשָּׁבֵעַ לַשֶּׁקֶר
  english_pob_choice: swear falsely
  chosen_korean: 거짓으로 맹세하고
  alternatives_korean:
  - 거짓 맹세하고
  - 거짓되이 맹세하고
  lexicon: HALOT
  rationale: 관용구의 의미를 직역에 가깝게 보존하면서도 현대 한국어에서 자연스럽고 법정적 뉘앙스가 살아 있는 표현으로 옮겼습니다.
- source_word: וְקַטֵּר לַבָּעַל
  english_pob_choice: burn incense to Baal
  chosen_korean: 바알에게 분향하고
  alternatives_korean:
  - 바알에게 향을 피우고
  - 바알에게 향을 사르고
  lexicon: HALOT
  rationale: קטר의 제의적 행위를 한국어 교회 전통에서 널리 통용되는 ‘분향하다’로 옮기되, 본문의 우상숭배 맥락을 분명히 했습니다.
- source_word: וְהָלֹךְ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  english_pob_choice: go after other gods
  chosen_korean: 또 너희가 알지 못한 다른 신들을 따라가겠느냐
  alternatives_korean:
  - 또 다른 신들을 따르겠느냐
  - 또 너희가 알지 못한 다른 신들을 뒤따르겠느냐
  lexicon: HALOT
  rationale: אַחֲרֵי는 단순 이동보다 추종·충성을 뜻하는 관용법이므로 ‘따라가다’로 옮겨 우상에 대한 결속의 의미를 살렸습니다.
theological_decisions:
- issue: ‘알지 못한’의 관계절 처리
  chosen_reading: 너희가 알지 못한 다른 신들
  alternative_readings:
  - 너희가 알지 못하는 다른 신들
  - 너희가 인정하지 않은 다른 신들
  rationale: ידע는 단순 인지보다 관계적 인식을 포함할 수 있지만, 본문은 그 긴장을 풀지 않고 ‘알지 못한’으로 유지해 우상들과의 비언약성을 드러내도록 했습니다.
  doctrine_reference: 본문의 언약적 ‘앎’ 개념을 과도하게 해석하지 않고 보존합니다.
