    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 만일 너희 길과 행위를 참으로 바로잡고[a], 한 사람과 그의 이웃 사이에서 참으로 공의를 행한다면[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 길과 행위를 철저히 고치고’로 옮길 수 있습니다. 히브리어는 두 절 모두에서 부정사 절대형을 유한동사와 함께 써서 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘한 사람과 다른 사람 사이에서 참으로 공의를 집행한다면’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 만일
  alternatives_korean:
  - 그러므로 만일
  - 오직 만일
  - 하지만 만일
  lexicon: HALOT
  rationale: 문맥상 앞선 거짓 안심에 대한 실제 조건을 여는 표현이므로, 한국어에서는 조건 표지 ‘만일’로 간결하게 살렸습니다.
- source_word: הֵיטֵיב תֵּיטִיבוּ
  english_pob_choice: you truly make ... good
  chosen_korean: 참으로 선하게 하고
  alternatives_korean:
  - 철저히 고치고
  - 정말로 좋게 하고
  - 진정으로 선하게 하고
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형 반복이 주는 강조를 ‘참으로’로 옮겨, 단순한 개선보다 강한 확증의 뉘앙스를 보존했습니다.
- source_word: דַּרְכֵיכֶם / מַעַלְלֵיכֶם
  english_pob_choice: your ways and your deeds
  chosen_korean: 너희 길과 너희 행위
  alternatives_korean:
  - 너희 행실과 너희 행동
  - 너희 삶의 길과 너희 소행
  lexicon: HALOT
  rationale: ‘길’은 삶의 방식이라는 히브리어 은유를 유지하고, ‘행위’는 מַעַלְלִים의 도덕적 행적을 자연스럽게 담아 대구를 살렸습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: justice
  chosen_korean: 정의를 행한다
  alternatives_korean:
  - 공의를 행한다
  - 재판을 공정하게 한다
  - 정당하게 판결한다
  lexicon: HALOT
  rationale: 여기서는 판결 행위 자체보다 공동체 안에서의 공정한 의로움이 핵심이므로, 현대 한국어에서 가장 직접적인 ‘정의’를 택했습니다.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  english_pob_choice: between a man and his neighbor
  chosen_korean: 한 사람과 그의 이웃 사이에서
  alternatives_korean:
  - 한 남자와 그의 이웃 사이에서
  - 사람과 사람 사이에서
  - 한 남자와 다른 사람 사이에서
  lexicon: HALOT
  rationale: 히브리어의 대표적 법적·사회적 공식 표현을 한국어로 자연스럽게 옮기되, generic force를 살려 ‘한 사람’으로 넓게 표현했습니다.
theological_decisions:
- issue: 아직 완료되지 않은 조건절의 종결 방식
  chosen_reading: 조건절만 제시하고, 다음 절로 이어질 형태를 유지했습니다.
  alternative_readings:
