id: JER.7.20
reference: Jeremiah 7:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנֵּ֨ה אַפִּ֤/י וַֽ/חֲמָתִ/י֙ נִתֶּ֨כֶת֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַל עֵ֥ץ הַ/שָּׂדֶ֖ה וְ/עַל פְּרִ֣י הָֽ/אֲדָמָ֑ה וּ/בָעֲרָ֖ה וְ/לֹ֥א תִכְבֶּֽה־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], my anger and my wrath are being poured out on this place, on man and on beast, on the trees of the field and on the fruit of the ground; it will burn and will not be quenched.'
  footnotes:
  - marker: a
    text: Or 'humankind' for 'man'; the Hebrew אָדָם is singular with generic force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 주 하나님께서 이렇게 말씀하십니다. 보십시오, 내 분노와 진노가 이곳 위에, 사람[a]과 짐승 위에, 밭의 나무들과 땅의 열매 위에 쏟아질 것이며, 그것이 불타고 꺼지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 단수형이지만 여기서는 일반적·집합적인 의미로 쓰였습니다. ‘사람’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: HALOT
  rationale: 앞선 고발과 심판 선언의 논리적 귀결을 나타내는 연결어로, 예언문맥에서 자연스럽고 격식을 갖춘 ‘그러므로’가 가장 적절합니다.
- source_word: כֹּה אָמַר
  english_pob_choice: thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이와 같이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 공식의 선언성을 살리되, 현대 한국어에서 읽기 자연스럽게 옮겼습니다.
- source_word: אֲדֹנָי יְהֹוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 야훼
  - 주 하나님께서
  lexicon: HALOT
  rationale: 합쇼체 본문에서 직설적 호칭을 자연스럽게 살리기 위해 ‘주 하나님’으로 옮겼습니다. 본문 의미는 보존하되, 본절의 한국어 문맥에서는 중복을 피한 호칭이 가장 읽기 좋습니다.
- source_word: אַפִּי וַחֲמָתִי
  english_pob_choice: my anger and my wrath
  chosen_korean: 내 분노와 내 진노
  alternatives_korean:
  - 내 노여움과 내 진노
  - 내 분노와 내 격분
  lexicon: HALOT
  rationale: אַף/חֵמָה의 짝을 한국어에서 강도 차이가 드러나도록 ‘분노’와 ‘진노’로 구분했습니다. 둘 다 심판적 감정을 가리키지만, 같은 어근을 반복하지 않아 병렬감이 살아납니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 사람들
  - 인간
  lexicon: HALOT
  rationale: 히브리어가 단수이면서도 보편적 대상을 가리키므로, 한국어에서는 성별을 드러내는 ‘사람’이 문맥상 가장 자연스럽고 대표적입니다.
- source_word: וּבָעֲרָה וְלֹא תִכְבֶּה
  english_pob_choice: it will burn and will not be quenched
  chosen_korean: 그것은 타올라도 꺼지지 않을 것입니다
  alternatives_korean:
  - 그것은 타오르며 꺼지지 않을 것입니다
  - 불붙어도 꺼지지 않을 것입니다
  lexicon: HALOT
  rationale: 불 심판의 계속성과 불가진압성을 살리기 위해 ‘타오르다/꺼지다’의 기본 이미지를 유지했습니다. ‘타올라도’는 원문의 진행·결과 뉘앙스를 자연스럽게 전달합니다.
theological_decisions:
- issue: 심판의 대상 범위가 사람과 피조 세계 전체에 미치는 표현
  chosen_reading: 이곳, 사람, 짐승, 들의 나무, 땅의 열매로 이어지는 포괄적 심판 선언을 그대로 유지했습니다.
  alternative_readings:
  - 사람과 짐승만을 중심으로 축약
  - 땅 전체를 포괄하는 의역
  rationale: 본문은 মানব/짐승/나무/열매를 병렬로 열거해 심판의 전면성을 강조합니다. 이를 축약하면 예언적 긴장이 약화되므로, 열거 구조를 그대로 보존했습니다.
  doctrine_reference: 예언문학의 수사와 창조세계 심판의 전면성
- issue: 예언적 선언문의 등록
  chosen_reading: 직설적 경고를 유지하되, 현대 한국어 합쇼체로 옮겨 예언자의 선포성과 공적 문체를 살렸습니다.
  alternative_readings:
  - 더 구어적인 경고체
  - 전통적 교회문체의 고어적 표현
  rationale: 본문은 사적 권고가 아니라 공적 심판 선포이므로, 합쇼체를 사용해 엄중함과 공적 발화를 유지했습니다.
  doctrine_reference: POB Korean style guideline
