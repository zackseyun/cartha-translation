  to: 그러므로 주 하나님께서 이렇게 말씀하십니다. 보십시오, 내 분노와 진노가 이곳 위에, 사람[a]과 짐승 위에, 밭의 나무들과 땅의 열매 위에 쏟아질 것이며, 그것이 불타고 꺼지지 않을 것입니다.
  rationale: The revision removes the unsupported concessive nuance in the final clause, improves the Korean rendering of the repeated prepositions and agricultural phrase, and moves the lexical footnote marker to ‘사람.’ The wording retains the formal-polite prophetic register and the source’s scope of judgment.
