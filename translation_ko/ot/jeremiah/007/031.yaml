theological_decisions:
- issue: 하나님의 부정과 인간의 희생제사
  chosen_reading: 이 행위는 하나님이 명령하지 않으셨고, 하나님의 뜻과는 전적으로 어긋난 것으로 표현했습니다.
  alternative_readings:
  - '''생각해 본 적도 없다''처럼 심리적 무지로 오해될 수 있는 완전 의역'
  rationale: 히브리어 관용구의 강한 부정을 살리되, 하나님의 전지성에 대한 별도 교리를 덧씌우지 않도록 했습니다.
  doctrine_reference: 본문이 드러내는 수사적 거절을 보존하고, 신학적 긴장을 해소하지 않습니다.
