base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/031.yaml
  text: They have built the high places of Topheth[a], which is in the Valley of Ben-hinnom, to burn their sons and their daughters in the fire—something I did not command, nor did it come up in my heart.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'nor did it enter my mind.' The Hebrew literally says, 'nor did it come up upon my heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 도벳의 산당을 지었는데, 그것은 힌놈의 골짜기에 있으며, 자기들의 아들들과 딸들을 불에 태우기 위한 것이었습니다—내가 명령하지도 않았고, 내 마음에 떠오르지도 않은 일입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 동적으로, '내 생각에 들어오지도 않았다.' 히브리어는 문자적으로 '내 마음 위로 올라오지도 않았다'는 뜻입니다.
    reason: lexical_alternative
