  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַֽעַלְלֵי/כֶ֑ם וַ/אֲשַׁכְּנָ֣ה אֶתְ/כֶ֔ם בַּ/מָּק֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/003.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Make your ways and your deeds good[b], and I will let you dwell in this place.'
  footnotes:
  - marker: a
    text: Or 'Amend your ways and your deeds.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and I will cause you to dwell in this place,' or 'and I will let you remain in this place.'
    reason: alternative_reading
translation:
  language: ko
  text: 「만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 너희의 길과 너희의 행위를 고치라[a]. 그러면 내가 이곳에 너희를 머물게 하겠습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 길과 너희의 행위를 고치라’의 뉘앙스로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 이곳에 너희를 살게 하겠습니다’, ‘내가 이곳에 너희가 머물도록 하겠습니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַ֞ר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이와 같이 말씀하십니다
  - 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 엄숙함을 살리되, 현대 한국어 합쇼체로 자연스럽게 들리도록 했습니다.
- source_word: יְהוָ֤ה צְבָאוֹת֙
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 만군의 주 야훼
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 Tetragrammaton은 야훼로 옮기고, צְבָאוֹת은 한국어 관용 표현인 만군의로 처리했습니다.
- source_word: הֵיטִ֥יבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  english_pob_choice: Make your ways and your deeds good
  chosen_korean: 너희의 길과 너희의 행위를 고치라
  alternatives_korean:
  - 너희의 길과 너희의 행위를 좋게 하라
  - 너희의 길과 너희의 행실을 바르게 하라
  lexicon: HALOT
  rationale: 히필 명령형의 개혁 촉구를 살리면서, '고치다'로 도덕적 수정을 자연스럽게 표현했습니다. '길'은 חיים의 방식, '행위'는 구체적 행실을 각각 반영합니다.
- source_word: וַאֲשַׁכְּנָה אֶתְכֶם
  english_pob_choice: and I will let you dwell
  chosen_korean: 그러면 내가 이곳에 너희를 머물게 하겠습니다
  alternatives_korean:
  - 그러면 내가 이곳에 너희를 살게 하겠습니다
  - 그러면 내가 이곳에 너희가 머물도록 하겠습니다
  lexicon: HALOT
  rationale: ‘머물게 하다’는 거주를 허락/지속시키는 뉘앙스를 살리면서, 하나님의 주권적 허용과 조건부 약속 사이의 긴장을 보존합니다.
theological_decisions:
- issue: 만군의 야훼와 이스라엘의 하나님이라는 호칭 결합
  chosen_reading: 두 호칭을 병기해 예언 선포의 권위와 언약적 관계를 함께 드러냈습니다.
  alternative_readings:
  - 만군의 주
  - 이스라엘의 하나님 야훼
  rationale: 원문의 병렬적 칭호를 그대로 반영하여, 군사적 주권과 언약적 친밀성을 둘 다 지우지 않게 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: וַאֲשַׁכְּנָה אֶתְכֶם의 조건부 거주 약속
  chosen_reading: ‘머물게 하겠습니다’로 옮겨, 회개 조건에 따른 지속적 거주의 허용을 나타냈습니다.
  alternative_readings:
  - 살게 하겠습니다
  - 거하게 하겠습니다
  rationale: 이 구절은 단순한 이주가 아니라 심판과 회복 사이의 조건부 동거 약속이므로, 허용의 의미가 드러나는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
