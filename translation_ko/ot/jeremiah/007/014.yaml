id: JER.7.14
reference: Jeremiah 7:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתִי לַ/בַּ֣יִת אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלָ֗י/ו אֲשֶׁ֤ר אַתֶּם֙ בֹּטְחִ֣ים בּ֔/וֹ וְ/לַ֨/מָּק֔וֹם אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/שִׁלֽוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/014.yaml
  text: So I will do to the house that is called by my name[a], in which you trust, and to the place that I gave to you and to your fathers[b], just as I did to Shiloh.
  footnotes:
  - marker: a
    text: Or, more literally, 'over which my name is called.' This Hebrew idiom means that the house belongs to or is identified with the LORD.
    reason: lexical_alternative
  - marker: b
    text: Shiloh was the earlier sanctuary site whose destruction served as a warning example; see 1 Samuel 4 and Jeremiah 7:12.
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 내가 내 이름으로 불리는 그 집에, 곧 너희가 그 안에서 의지하는 그 곳에, 또 내가 너희와 너희 조상들에게 준 그 곳에, 실로에 행한 것과 같이 행하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 관용구로, ‘내 이름이 그 위에 불린다’는 뜻이며 그 집이 야훼께 속하거나 그분과 동일시됨을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 실로는 이전 성소 자리로, 그 파괴는 경고의 선례가 되었습니다(사무엘상 4장, 예레미야 7:12 참조).
    reason: cross_reference
lexical_decisions:
- source_word: וְעָשִׂיתִי
  english_pob_choice: So I will do
  chosen_korean: 그러므로 내가 … 행하겠습니다
  alternatives_korean:
  - 내가 … 하겠습니다
  - 그래서 내가 … 행하겠습니다
  lexicon: HALOT
  rationale: 접속사 וְ의 연결·결과 의미를 살려 ‘그러므로’로 옮기고, 예언적 선언의 미래형을 현대 합쇼체로 자연스럽게 표현했습니다.
- source_word: לַבַּיִת / וְלַמָּקוֹם
  english_pob_choice: to the house / and to the place
  chosen_korean: 그 집 … 그 곳 … 그 곳
  alternatives_korean:
  - 그 성전 … 그 장소 … 그 땅
  - 그 집 … 그 장소 … 그 곳
  lexicon: HALOT
  rationale: 히브리어의 ‘집’과 ‘곳’을 구분해 살리되, 문맥상 성전과 성전 부지를 가리키는 표현을 한국어로도 구분하여 옮겼습니다.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  english_pob_choice: that is called by my name
  chosen_korean: 내 이름으로 불리는
  alternatives_korean:
  - 내 이름이 불리는
  - 내 이름이 그 위에 불리는
  lexicon: HALOT
  rationale: 관용구의 핵심인 ‘소속/식별’을 살리면서도 한국어에서 가장 자연스러운 ‘내 이름으로 불리는’으로 옮겼습니다.
- source_word: אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  english_pob_choice: in which you trust
  chosen_korean: 너희가 그 안에서 의지하는
  alternatives_korean:
  - 너희가 신뢰하는
  - 너희가 그 안에 भरो하는
  lexicon: HALOT
  rationale: בּטח의 지속적 의탁을 ‘의지하다’로 옮겨, 단순 인지가 아니라 실제 의존을 드러냈습니다.
- source_word: כַּאֲשֶׁר עָשִׂיתִי לְשִׁלֹה
  english_pob_choice: just as I did to Shiloh
  chosen_korean: 실로에 행한 것과 같이
  alternatives_korean:
  - 실로에 했던 것처럼
  - 실로에게 한 것과 같이
  lexicon: HALOT
  rationale: 비교구문을 직역에 가깝게 유지해 심판의 선례를 분명히 드러냈습니다. 고유명사 ‘실로’는 한국어 음역 관례를 따랐습니다.
theological_decisions:
- issue: ‘집’과 ‘곳’의 구분을 유지할지 여부
  chosen_reading: ‘그 집’과 ‘그 곳’을 구분해 유지했습니다.
  alternative_readings:
  - 두 표현을 모두 ‘성전’으로 통일
  - ‘집’을 ‘성전’으로 풀어 설명
  rationale: 히브리어가 הבית와 המקום을 의도적으로 구분하므로, 예언적 경고의 범위를 넓히는 원문 효과를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
