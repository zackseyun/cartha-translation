revisions:
- from: 그러므로 내가 내 이름으로 불리는 그 집에, 곧 너희가 그 안에서 의지하는 그 곳에, 또 내가 너희와 너희 조상들에게 준 그 곳에, 실로에 행한 것과 같이 행하겠습니다.[a][b]
  to: 그러므로 나는 내 이름으로 불리고 너희가 의지하는 그 집에[a], 또 내가 너희와 너희 조상들에게 준 그곳에, 내가 실로에 행한 것과 같이 행하겠습니다.[b]
  rationale: 원문의 통사 구조에 따라 ‘내 이름으로 불리는’과 ‘너희가 의지하는’을 모두 ‘그 집’에 연결하고, 별개의 ‘그곳’은 ‘내가 너희와 너희 조상들에게 준’의 대상으로만 두었습니다. 각주 표지도 해당 표현과 지명에 각각 배치했습니다.
