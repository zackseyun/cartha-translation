    reason: source_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 보십시오,
  lexicon: HALOT
  rationale: 주의를 강하게 환기하는 지시어로, 현대 한국어 합쇼체에서 자연스럽고 직접적인 호응인 「보십시오」로 옮겼습니다.
- source_word: בֹּטְחִים לָכֶם
  english_pob_choice: you are trusting
  chosen_korean: 여러분은 … 의지하고 있으면서
  alternatives_korean:
  - 여러분은 … 신뢰하고 있습니다
  - 여러분은 … 믿고 있습니다
  - 여러분은 … 의지합니다
  lexicon: HALOT
  rationale: 분사형의 지속적·상태적 뉘앙스를 살리기 위해 진행성을 띤 표현을 택했고, לָכֶם의 자기-지향적 뉘앙스는 문맥상 자연스러운 담화로 풀어냈습니다.
- source_word: דִּבְרֵי הַשָּׁקֶר
  english_pob_choice: deceptive words
  chosen_korean: 속이는 말들
  alternatives_korean:
  - 거짓된 말들
  - 거짓말들
  - 기만하는 말들
  lexicon: HALOT
  rationale: ‘거짓의 말’이라는 의미를 현대 한국어에서 자연스럽고 직접적으로 드러내면서, 단순한 정보 오류보다 사람을 오도하는 힘을 강조했습니다.
- source_word: לְבִלְתִּי הוֹעִיל
  english_pob_choice: to no benefit
  chosen_korean: 아무 유익도 얻지 못합니다
  alternatives_korean:
  - 전혀 이익이 없습니다
  - 아무 소용도 없습니다
  - 유익하지 않습니다
  lexicon: HALOT
  rationale: 부정 목적/결과 구문을 한국어에서는 결과적 무익함으로 옮기는 것이 가장 자연스러워, ‘유익’의 부재를 분명히 했습니다.
theological_decisions:
- issue: 예언자적 경고문의 직설성
  chosen_reading: 명령형 감탄사 「보십시오」와 직접 비난형 문장을 유지해, 본문의 책망 어조를 약화하지 않았습니다.
  alternative_readings:
  - 완화된 경구형 표현
  - 간접화된 서술형 표현
  rationale: 본문은 단순 정보 전달이 아니라 언약 백성의 자기기만을 폭로하는 예언자적 경고이므로, 직설성을 보존하는 것이 의미상 중요합니다.
  doctrine_reference: 예언자적 책망의 수사 유지
- issue: ‘유익’의 신학적·윤리적 무효성
  chosen_reading: ‘아무 유익도 얻지 못합니다’로 옮겨, 거짓 의탁이 결국 공동체에 실제 선을 가져오지 못한다는 평가를 드러냈습니다.
  alternative_readings:
  - ‘전혀 도움이 되지 않습니다’
  - ‘헛됩니다’
  rationale: 히브리어의 부정적 유익성 표현은 단순 무용을 넘어 결과적 손해를 포함하므로, 한국어에서도 무익함을 명시했습니다.
  doctrine_reference: 언약 불순종의 헛됨
