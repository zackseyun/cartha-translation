id: JER.7.26
reference: Jeremiah 7:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ל֤וֹא שָׁמְעוּ֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם הֵרֵ֖עוּ מֵ/אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/026.yaml
  text: Yet they did not listen to me[a], and they did not incline their ear, but they stiffened their neck[b]; they acted more wickedly than their fathers.
  footnotes:
  - marker: a
    text: Or 'their ancestors.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'incline their ear,' an idiom for paying careful attention.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그들은 내 말을 듣지 않았고, 자기 귀를 기울이지도 않았으며, 목을 곧게 하였고, 자기 조상들보다 더 악하게 행하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘주의 깊게 듣다’는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: ‘조상들’로 옮긴 히브리어는 문자적으로는 ‘아버지들’이지만, 문맥상 선대의 نسل/세대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמְעוּ אֵלַי
  english_pob_choice: did not listen to me
  chosen_korean: 내 말을 듣지 않았고
  alternatives_korean:
  - 나를 듣지 않았고
  - 내게 순종하지 않았고
  lexicon: HALOT
  rationale: שׁמע + אל은 단순 청각이 아니라 화자의 말을 ‘듣고 받아들이는 것’을 뜻하므로, ‘내 말을 듣다’로 옮겨 거절의 관계적·의지적 성격을 살렸습니다.
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  english_pob_choice: did not incline their ear
  chosen_korean: 자기 귀를 기울이지도 않았으며
  alternatives_korean:
  - 귀를 기울이지도 않았으며
  - 귀를 돌리지도 않았으며
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 히브리어 관용구의 이미지를 자연스럽게 살리면서도, 단순히 ‘주의를 기울이다’로 평이화하지 않아 병행구의 표현을 보존합니다.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  english_pob_choice: they stiffened their neck
  chosen_korean: 목을 곧게 하였고
  alternatives_korean:
  - 목을 굳게 하였고
  - 목을 뻣뻣하게 하였고
  lexicon: HALOT
  rationale: 직역형인 ‘목을 뻣뻣하게 하다’도 가능하지만, 한국어에서 더 자연스럽고 고집의 이미지를 유지하는 표현으로 ‘목을 곧게 하다’를 택했습니다.
- source_word: מֵאֲבוֹתָם
  english_pob_choice: than their fathers
  chosen_korean: 자기 조상들보다
  alternatives_korean:
  - 그들의 아버지들보다
  - 그들의 조상들보다
  lexicon: HALOT
  rationale: אָבוֹת는 문맥상 ‘조상들’의 넓은 뜻이 가능하므로, 현대 한국어에서는 오해를 줄이는 ‘조상들’이 더 자연스럽습니다. ‘자기’는 비교 대상을 분명히 합니다.
theological_decisions:
- issue: 불순종의 강도를 본문에서 어떻게 드러낼지
  chosen_reading: ‘듣지 않다’와 ‘귀를 기울이지 않다’로 병렬하여, 말씀 거부와 주의 결핍을 함께 드러냈습니다.
  alternative_readings:
  - ‘순종하지 않았다’로 직접 옮길 수 있습니다.
  - ‘주의를 기울이지 않았다’로 평이하게 바꿀 수 있습니다.
  rationale: 히브리어 본문은 청종 거부를 두 번 병치해 강조하므로, 본문이 말하는 불순종의 관계적 차원을 유지하는 것이 중요합니다. ‘순종’으로만 좁히면 청종의 이미지가 약해집니다.
  doctrine_reference: Jeremiah 7:24–26 문맥의 언약 불순종
- issue: ‘목을 곧게 하다’의 관용구 처리
  chosen_reading: 고집스러운 완강함을 뜻하는 관용구로 이해하되, 한국어에서는 직역보다 의미가 살아 있는 표현을 택했습니다.
  alternative_readings:
  - ‘목을 굳게 하다’
  - ‘목을 뻣뻣하게 하다’
  rationale: 히브리어 관용구의 공격적·완강한 뉘앙스를 남기면서도, 한국어 문장으로는 과도하게 어색하지 않게 해야 합니다. 따라서 의미를 보존하는 범위에서 표현을 다듬었습니다.
  doctrine_reference: 언약 백성의 완고함에 대한 예언서 표현
