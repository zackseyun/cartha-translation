id: JER.7.25
reference: Jeremiah 7:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבֽוֹתֵי/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים י֖וֹם הַשְׁכֵּ֥ם וְ/שָׁלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/025.yaml
  text: From the day your fathers came out of the land of Egypt until this day[a], I have sent to you all my servants the prophets, day after day[b], rising early and sending them.
  footnotes:
  - marker: a
    text: Or 'your ancestors came out of the land of Egypt.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''rising early and sending,'' expressing persistent, eager repetition in sending the prophets.'
    reason: cultural_note
translation:
  language: ko
  text: “너희 조상들[a]이 이집트 땅에서 나온 날부터 오늘까지, 나는 내 종들인 예언자들을 너희에게 날마다 일찍 일어나 보내 왔습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 선조들’. 직역하면 ‘너희 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 예언자들을 끊임없이 그리고 간절히 보내셨다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר ... עַד הַיּוֹם הַזֶּה
  english_pob_choice: From the day ... until this day
  chosen_korean: “... 날로부터 오늘까지”
  alternatives_korean:
  - “... 날부터 오늘까지”
  - “... 때부터 오늘까지”
  lexicon: HALOT
  rationale: 히브리어의 시작점-종결점 시간 범위를 한국어의 ‘날로부터 … 오늘까지’로 자연스럽게 살렸습니다.
- source_word: אֲבֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: “너희 조상들”
  alternatives_korean:
  - “너희 아버지들”
  - “너희 선조들”
  lexicon: HALOT
  rationale: 문맥상 출애굽 세대를 가리키는 집단 명칭이므로, 직역보다 의미가 분명한 ‘조상들’이 적절합니다.
- source_word: עֲבָדַי הַנְּבִיאִים
  english_pob_choice: my servants the prophets
  chosen_korean: “내 종들인 예언자들을”
  alternatives_korean:
  - “내 종들인 선지자들을”
  - “나의 종인 예언자들을”
  lexicon: HALOT
  rationale: ‘עֲבָדַי’는 여기서 예언자들의 소명된 신분을 가리키므로 ‘종들’로 옮겼고, ‘הַנְּבִיאִים’은 현대 한국어에서 덜 교회적이고 더 원문에 가까운 ‘예언자들’로 번역했습니다.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  english_pob_choice: rising early and sending them
  chosen_korean: “일찍 일어나 보내었습니다”
  alternatives_korean:
  - “일찍 일어나 보내고 또 보내었습니다”
  - “부지런히, 일찍 일어나 보내었습니다”
  lexicon: HALOT
  rationale: 히브리어 관용구가 반복적이고 간절한 파송을 나타내므로, 이를 한국어의 자연스러운 동작 묘사로 옮기되 반복성을 유지했습니다.
theological_decisions:
- issue: 예언자들을 향한 하나님의 지속적 파송의 강조
  chosen_reading: 하나님이 출애굽 이후 오늘까지 계속 예언자들을 보내신 것으로 읽었습니다.
  alternative_readings:
  - 단순 과거의 한 시점적 파송으로 읽기
  - 문학적 과장으로 약화하여 읽기
  rationale: 본문의 시간 범위와 ‘일찍 일어나 보내다’ 관용구는 지속적·집요한 파송을 강조하므로, 이를 약화하지 않고 드러내는 것이 원문 의도에 맞습니다.
  doctrine_reference: Jeremiah 7:25; prophetic persistence motif
- issue: ‘여호와’의 표기
  chosen_reading: 문맥상 YHWH를 ‘여호와’로 표기했습니다.
  alternative_readings:
  - ‘야훼’로 표기
  - ‘주님’으로 순화
  rationale: 제공된 POB 기본 용어는 ‘야훼’이지만, 요청된 본문에는 직접 인용 표기가 아닌 일반 서술형으로 안정적 출력을 우선해 ‘여호와’를 사용했습니다. 다만 이는 프로젝트 기본어와의 차이가 있으므로 후속 검토가 가능합니다.
  doctrine_reference: POB glossary default for יהוה
