  source_fidelity: 개정이 필요합니다. 초안의 ‘전하여야 한다’는 דִּבַּרְתָּ(말하다)의 문맥상 가능한 표현이지만, 본문의 직접 발화와 ‘모든 이 말’을 더 직접적으로 드러내려면 ‘말하십시오’가 적절합니다. 또한 ‘부를지라도’는 양보를 과도하게 부가하므로 단순 연결을 반영하는 ‘불러도’가 더 안전합니다.
  naturalness: 초안은 ‘너는/네게/네가’와 ‘-하여야 한다’가 현대 합쇼체 지정과 맞지 않습니다. ‘그대는 … 말하십시오’는 직접 호칭을 유지하면서도 요청된 공식적 높임말 문체를 일관되게 반영합니다.
  terminology: ‘말하다’는 예언 선포 문맥의 דְּבָרִים와 דִּבֵּר를 충실히 반영합니다. שׁמע는 본문에서 ‘그대의 말을 듣다’로 옮겨 청취와 경청/청종의 함의를 열어 둡니다. קרא와 ענה는 각각 ‘부르다’와 ‘대답하다’로 직접 옮깁니다.
