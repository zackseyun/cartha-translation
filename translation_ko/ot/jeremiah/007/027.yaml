translation:
  language: ko
  text: 그대는 그들에게 이 모든 말을 말하십시오. 그러나 그들은 그대의 말을 듣지 않을 것이며, 그대가 그들을 불러도 그들은 그대에게 대답하지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣지 않다’로 옮긴 히브리어 שׁמע는 문맥에 따라 단순히 듣다, 귀를 기울이다, 또는 듣고 따르다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ ... אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: You shall speak all these words
  chosen_korean: “이 모든 말을 전하여야 한다”
  alternatives_korean:
  - “이 모든 말을 말하여야 한다”
  - “이 모든 말을 전하여야 합니다”
  lexicon: HALOT
  rationale: 예언적 지시문으로서의 명령/장래 뉘앙스를 살려 ‘전하여야 한다’로 옮기고, דְּבָרִים는 예언 선포의 내용이므로 ‘말’로 자연스럽게 반영했습니다.
- source_word: יִשְׁמְעוּ אֵלֶיךָ
  english_pob_choice: they will not listen to you
  chosen_korean: “그들은 네게 귀를 기울이지 않을 것이며”
  alternatives_korean:
  - “그들은 네 말을 듣지 않을 것이며”
  - “그들은 네게 듣지 않을 것이며”
  lexicon: HALOT
  rationale: שׁמע의 ‘듣다/귀 기울이다/순종하다’의 폭을 고려해, 단순 청각보다 응답적 청취를 드러내는 ‘귀를 기울이다’를 선택했습니다.
- source_word: וְקָרָאתָ ... וְלֹא יַעֲנוּכָה
  english_pob_choice: you shall call to them, but they will not answer you
  chosen_korean: “네가 그들에게 부를지라도 그들은 네게 대답하지 않을 것이다”
  alternatives_korean:
  - “네가 그들을 향해 부를지라도 그들은 대답하지 않을 것이다”
  - “네가 그들을 불러도 그들은 네게 응답하지 않을 것이다”
  lexicon: HALOT
  rationale: קרא는 여기서 대상에게 ‘부르다/호소하다’의 의미가 적절하고, ענה는 문맥상 ‘대답하다’가 가장 직접적이어서 자연스러운 대구를 살렸습니다.
theological_decisions:
- issue: 예언자적 경고의 반복 구조
  chosen_reading: ‘전하여야 한다 / 귀를 기울이지 않을 것이다 / 부를지라도 / 대답하지 않을 것이다’로 반복을 살려, 거부의 확정성을 드러냈습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘말해도 듣지 않을 것이다’로 옮기는 방식
  - 문장을 하나로 압축해 반복을 약화시키는 방식
  rationale: 히브리어는 명령과 거절을 병렬로 반복하며 선지자 사역의 저항을 강조하므로, 한국어에서도 같은 긴장을 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 예언자적 소명과 완고한 거절의 주제(예레미야서 전체 문맥)
