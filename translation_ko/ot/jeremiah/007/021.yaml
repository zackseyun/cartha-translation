source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹלוֹתֵי/כֶ֛ם סְפ֥וּ עַל זִבְחֵי/כֶ֖ם וְ/אִכְל֥וּ בָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Add your burnt offerings to your sacrifices, and eat the flesh.'
  footnotes:
  - marker: a
    text: Or 'your peace offerings'; the Hebrew term can refer more specifically to sacrifices from which the worshiper ate.
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “너희의 번제물을 너희의 제물[a]에 더하고, 그 고기를 먹으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 화목제물’. 히브리어는 예배자가 그 제물의 고기를 먹는 제사를 더 구체적으로 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 말씀하십니다
  - 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 선언 공식을 현대 합쇼체로 옮기되, 선언문의 격식을 살리면서도 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 만군의 주 야훼
  lexicon: HALOT
  rationale: 신명기적 고유명 יְהוָה는 기본 원칙에 따라 야훼로 옮기고, צְבָאוֹת은 관용적으로 만군의로 처리했습니다.
- source_word: עֹלוֹתֵיכֶם
  english_pob_choice: your burnt offerings
  chosen_korean: 너희의 번제물
  alternatives_korean:
  - 너희의 번제
  - 너희의 완전 번제물
  lexicon: HALOT
  rationale: עֹלָה의 제의적 의미를 표준적인 번제물로 옮겨, 제단에서 전부 불사르는 제물이라는 뜻을 유지했습니다.
- source_word: זִבְחֵיכֶם
  english_pob_choice: your sacrifices
  chosen_korean: 너희의 희생제물
  alternatives_korean:
  - 너희의 제물
  - 너희의 제사
  lexicon: HALOT
  rationale: 번제물과 대비되는 제의적 զոհి/희생을 드러내기 위해 희생제물로 옮겼습니다. 본문이 일반 제물인지, 식용이 가능한 제물인지의 긴장은 주석으로 보존했습니다.
- source_word: בָשָׂר
  english_pob_choice: the flesh
  chosen_korean: 그 고기
  alternatives_korean:
  - 그 살
  - 그 육
  lexicon: HALOT
  rationale: 제의 맥락에서 בָשָׂר는 한국어 현대 독자에게는 고기가 가장 자연스럽고, POB의 더 직접적인 어감도 충분히 전달합니다.
theological_decisions:
- issue: זִבְחֵיכֶם의 범위 보존
  chosen_reading: 희생제물로 옮기되, 본문은 번제물과 대비되는 다른 제물을 가리키는 폭넓은 표현으로 유지했습니다.
  alternative_readings:
  - 평화제물
  - 희생제물 일반
  rationale: 히브리어 זֶבַח은 이 문맥에서 더 구체적으로 식용 가능한 제물을 떠올리게 할 수 있지만, 본문 자체가 그 의미를 단정하지 않으므로 과도하게 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
