revisions:
- from: 「내가 그들을 노하게 하느냐?」야훼의 말씀이십니다. 「그들이 스스로, 자기 얼굴의 수치를 위하여 그렇게 하는 것이 아니냐?」[a]
  to: 「그들이 나를 노하게 하는 것이냐?」 야훼의 말씀입니다. 「그들이 자기 얼굴에 수치를 당하게 하려고 자기 자신을 노하게 하는 것이 아니냐?」[a]
  rationale: 첫 질문을 원문의 어순과 문법에 맞추어 ‘그들이 나를’로 바로잡았습니다. 둘째 질문에서는 히브리어에서 생략된 ‘노하게 하다’를 보충하고 אֹתָם의 반사적 대조를 ‘자기 자신을’으로 드러냈습니다. ‘얼굴의 수치’라는 표현은 한국어 관용에 맞게 ‘얼굴에 수치를 당하다’로 옮기되, 수치가 그들 자신에게 돌아온다는 원문의 인과 관계를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:27Z'
