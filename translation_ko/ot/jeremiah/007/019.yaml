id: JER.7.19
reference: Jeremiah 7:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/אֹתִ֛/י הֵ֥ם מַכְעִסִ֖ים נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֹתָ֔/ם לְמַ֖עַן בֹּ֥שֶׁת פְּנֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/019.yaml
  text: Is it I whom they are provoking? declares Yahweh. Is it not themselves[a], to the shame of their own faces?
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'Are they not provoking themselves to their own shame?'
    reason: lexical_alternative
translation:
  language: ko
  text: 「내가 그들을 노하게 하느냐?」야훼의 말씀이십니다. 「그들이 스스로, 자기 얼굴의 수치를 위하여 그렇게 하는 것이 아니냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘그들이 스스로 자기 수치를 향해 분노를 일으키는 것이 아니냐?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֹתִי
  english_pob_choice: Is it I whom
  chosen_korean: 내가 그들을 노하게 하느냐?
  alternatives_korean:
  - 내가 그들이 노하도록 하느냐?
  - 내가 그들을 자극하느냐?
  lexicon: HALOT
  rationale: 히브리어의 앞세운 목적어 강조와 수사적 질문은 한국어에서 자연스러운 반문으로 옮기되, ‘노하게 하다’로 מַכְעִיסִים의 의미를 함께 살렸습니다.
- source_word: מַכְעִסִים
  english_pob_choice: are provoking
  chosen_korean: 노하게 하느냐
  alternatives_korean:
  - 화를 돋우느냐
  - 격분하게 하느냐
  lexicon: HALOT
  rationale: 동사의 핵심은 단순 자극이 아니라 분노를 일으키는 것이므로, 예언문맥에 맞게 ‘노하게 하다’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언이십니다
  lexicon: HALOT
  rationale: 예언자적 공식은 한국어에서 ‘말씀’으로 자연스럽게 드러내되, 신명기적 화자 표지를 유지하기 위해 ‘야훼’와 존칭 종결을 함께 사용했습니다.
- source_word: הֲלוֹא אֹתָם
  english_pob_choice: Is it not themselves
  chosen_korean: 그들이 스스로
  alternatives_korean:
  - 그들 자신을
  - 그들에게
  lexicon: HALOT
  rationale: 히브리어는 표면상 대명사 ‘그들을’이지만, 영어 POB가 지적하듯 반어적으로 ‘자기들에게 돌아가는’ 의미이므로 한국어에서는 ‘스스로’로 반영했습니다.
- source_word: בֹּשֶׁת פְּנֵיהֶם
  english_pob_choice: the shame of their own faces
  chosen_korean: 자기 얼굴의 수치를 위하여
  alternatives_korean:
  - 그 얼굴의 수치를 위해
  - 자기들의 얼굴에 대한 수치를 위해
  lexicon: HALOT
  rationale: ‘얼굴’ 이미지를 보존하면서도 한국어에서 어색하지 않도록 ‘자기 얼굴의 수치’로 옮겼습니다. ‘위하여’는 לְמַעַן의 결과/목적 뉘앙스를 함께 살립니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יהוה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 제공된 원문·POB 기준에 따라 고유한 언약 이름을 제목화된 대체어로 바꾸지 않고 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 수사적 반문과 책임 전가의 의미
  chosen_reading: 하나님이 아니라 그들의 행위가 자기들에게 수치로 돌아간다는 반어를 살렸습니다.
  alternative_readings:
  - 그들이 하나님을 노하게 한다는 직설
  - 단순히 그들이 수치를 당한다는 진술
  rationale: 본문은 하나님을 향한 분노 유발을 묻는 형식이지만, 결론은 그들이 스스로 수치를 자초한다는 데 있으므로 두 층위를 모두 보존했습니다.
  doctrine_reference: 본문 수사와 문맥적 인과 관계
