base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/002.yaml
  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
  footnotes:
  - marker: a
    text: Or 'to bow down to the LORD.' The Hebrew verb can denote the physical act of bowing down, especially in worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 집 문에 서서, 거기에서 이 말씀을 선포하고, 「야훼의 말씀을 들으십시오. 모든 유다여, 이 문들을 통해 들어와 야훼께 경배하는 너희는 들으십시오」라고 말하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 몸을 굽히는 실제 동작을 가리킬 수 있으며, 특히 예배의 맥락에서 그렇게 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד / בְּשַׁעַר
  english_pob_choice: Stand in the gate
  chosen_korean: 문에 서서
  alternatives_korean:
  - 문 앞에 서서
  - 문에서 서서
  lexicon: HALOT
  rationale: 명령형 עמד과 מקום 표현을 자연스러운 한국어로 옮기되, 성전 प्रवेश 지점을 가리키는 의미를 유지했습니다.
- source_word: בֵּית יְהוָה / יְהוָה
  english_pob_choice: house of Yahweh / Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 신명기적 고유명사 יְהוָה는 프로젝트 기본값에 따라 야훼로 옮기고, בֵּית יְהוָה는 직역성을 살려 ‘집’으로 유지했습니다.
- source_word: וְקָרָאתָ ... אֶת הַדָּבָר הַזֶּה
  english_pob_choice: proclaim there this word
  chosen_korean: 거기에서 이 말씀을 선포하고
  alternatives_korean:
  - 거기에서 이 말을 외치고
  - 거기에서 이 말씀을 공포하고
  lexicon: HALOT
  rationale: קרא는 예언적 공적 선포의 뉘앙스를 가지므로 ‘선포하다’로 옮겼고, דָּבָר는 예언 공식에서 ‘말씀’이 가장 적절합니다.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  english_pob_choice: Hear the word of Yahweh
  chosen_korean: 야훼의 말씀을 들으십시오
  alternatives_korean:
  - 야훼의 말씀을 들으시오
  - 야훼의 말씀에 귀를 기울이십시오
  lexicon: HALOT
  rationale: שמע의 공적 선포 공식은 한국어 성경에서도 ‘들으십시오’가 가장 직접적이며, 명령의 긴박함을 살렸습니다.
- source_word: לְהִשְׁתַּחֲוֺת
  english_pob_choice: to worship Yahweh
  chosen_korean: 야훼께 경배하는
  alternatives_korean:
  - 야훼께 예배하는
  - 야훼께 절하는
  lexicon: HALOT
  rationale: 히브리어는 몸을 굽히는 동작을 포함하지만 문맥상 예배 행위를 가리키므로 ‘경배하다’로 옮겨 물리적 동작과 예배의 의미를 함께 보존했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 고유명사 יְהוָה를 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 고유명사성을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
