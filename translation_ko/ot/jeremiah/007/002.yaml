  lexicon: HALOT
  rationale: שמע의 공적 선포 공식은 한국어 성경에서도 ‘들으십시오’가 가장 직접적이며, 명령의 긴박함을 살렸습니다.
- source_word: לְהִשְׁתַּחֲוֺת
  english_pob_choice: to worship Yahweh
  chosen_korean: 야훼께 경배하는
  alternatives_korean:
