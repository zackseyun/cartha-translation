  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
  footnotes:
  - marker: a
    text: Or 'to bow down to the LORD.' The Hebrew verb can denote the physical act of bowing down, especially in worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 집 문에 서서, 거기에서 이 말씀을 선포하고 이렇게 말하십시오. 「모든 유다, 곧 이 문들로 들어와 야훼께 경배하러 오는 이들이여, 야훼의 말씀을 들으십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 절하러’. 히브리어 동사는 몸을 굽히는 실제 동작을 가리킬 수 있으며, 특히 예배의 맥락에서 그렇게 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד / בְּשַׁעַר
