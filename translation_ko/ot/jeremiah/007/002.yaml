  source_fidelity: 핵심 의미는 대체로 충실합니다. אולם 히브리어의 명령은 인용문 안에서 한 번만 있으며, ‘모든 유다’와 ‘이 문들로 들어와 야훼께 경배하러 오는’ 이들이 그 명령의 수신자입니다. 초안은 인용문의 끝에 ‘들으십시오’를 추가하여 명령을 불필요하게 반복합니다. 또한 לְהִשְׁתַּחֲוֺת의 목적 용법은 ‘경배하는’보다 ‘경배하러 오는’이 더 직접적으로 드러냅니다.
  naturalness: 합쇼체는 일관되나, ‘모든 유다여, … 너희는 들으십시오’는 호격과 주제 표지가 겹치고 명령을 반복하여 다소 부자연스럽습니다. ‘모든 유다, 곧 이 문들로 들어와 야훼께 경배하러 오는 이들이여’가 자연스럽고 문장 구조도 분명합니다.
  terminology: ‘야훼’, ‘야훼의 집’, ‘말씀’, ‘선포하다’, ‘경배하다’는 원문 및 프로젝트의 용어 방침에 맞습니다. 각주 자체는 동사의 신체적 절하기 의미를 적절히 설명하지만, 영어 감사 기록의 대안 의미를 반영하여 ‘절하다’라는 어휘를 명시하는 편이 더 명료합니다.
