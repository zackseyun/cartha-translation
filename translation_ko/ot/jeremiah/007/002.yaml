  lexicon: HALOT
  rationale: 히브리어는 몸을 굽히는 동작을 포함하지만 문맥상 예배 행위를 가리키므로 ‘경배하다’로 옮겨 물리적 동작과 예배의 의미를 함께 보존했습니다.
