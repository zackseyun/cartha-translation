id: JER.7.17
reference: Jeremiah 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ/אֵינְ/ךָ֣ רֹאֶ֔ה מָ֛ה הֵ֥מָּה עֹשִׂ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/017.yaml
  text: Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?[a]
  footnotes:
  - marker: a
    text: Or 'squares' or 'open places' of Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 성읍들과 예루살렘의 거리에서 그들이 무엇을 하고 있는지 보지 못하십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '광장들'이나 '열린 곳들'로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵינְךָ רֹאֶה
  english_pob_choice: Do you not see
  chosen_korean: 보지 못하십니까
  alternatives_korean:
  - 보지 않으십니까
  - 보이지 않습니까
  lexicon: HALOT
  rationale: 부정 의문형의 수사적 질문을 한국어의 자연스러운 합쇼체로 옮겼습니다. '보지 못하십니까'가 직접 대면의 호소와 인지적 인식 둘 다를 가장 자연스럽게 담습니다.
- source_word: מָה הֵמָּה עֹשִׂים
  english_pob_choice: what they are doing
  chosen_korean: 그들이 무엇을 하고 있는지
  alternatives_korean:
  - 그들이 무엇을 하는지
  - 그들이 무엇을 행하는지
  lexicon: HALOT
  rationale: 진행 중인 행위를 나타내는 현재 분사를 한국어의 '하고 있는지'로 자연스럽게 반영했습니다. '행하다'보다 문맥상 덜 경직된 '하다'가 적절합니다.
- source_word: בְּעָרֵי יְהוּדָה
  english_pob_choice: in the cities of Judah
  chosen_korean: 유다의 성읍들에서
  alternatives_korean:
  - 유다의 도시들에서
  - 유다 성읍들에서
  lexicon: HALOT
  rationale: 히브리어의 소유/관계 구조를 살려 '유다의 성읍들'로 옮겼고, 위치 전치사는 한국어에서 자연스럽게 '-에서'로 처리했습니다.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  english_pob_choice: and in the streets of Jerusalem
  chosen_korean: 예루살렘의 거리에서
  alternatives_korean:
  - 예루살렘의 광장들에서
  - 예루살렘의 열린 곳들에서
  lexicon: HALOT
  rationale: חֻצוֹת는 거리, 광장, 열린 장소를 아우를 수 있으나, 현대 한국어에서 가장 자연스럽고 도시 맥락에 맞는 기본값은 '거리'입니다. 대안 의미는 각주로 남겼습니다.
theological_decisions:
- issue: 수사적 질문의 강도
  chosen_reading: 하나님께서 예레미야에게 직접적인 책망과 인식 촉구를 하시는 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순 정보 질문으로 읽기
  - 예레미야의 실제 미인지로 읽기
  rationale: 문맥상 계시적 경고의 도입부이므로, 단순 사실 확인보다 '보지 못하십니까'가 담는 책망적 뉘앙스를 살리는 것이 적절합니다.
  doctrine_reference: 예언자적 수사와 계시 언어의 문맥적 기능
- issue: חֻצוֹת의 번역 폭
  chosen_reading: 본문에는 '거리'를 두고, 각주에서 '광장들' 또는 '열린 곳들'의 가능성을 제시합니다.
  alternative_readings:
  - 거리
  - 광장
  - 열린 장소
  rationale: 히브리어 어휘의 의미 폭을 지우지 않으면서도, 본문은 가장 자연스러운 현대어를 택하고 의미상의 대안을 각주로 보존했습니다.
  doctrine_reference: 어휘 중의성 보존 원칙
