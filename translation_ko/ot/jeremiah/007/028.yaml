source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם זֶ֤ה הַ/גּוֹי֙ אֲשֶׁ֣ר לֽוֹא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔י/ו וְ/לֹ֥א לָקְח֖וּ מוּסָ֑ר אָֽבְדָה֙ הָֽ/אֱמוּנָ֔ה וְ/נִכְרְתָ֖ה מִ/פִּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/028.yaml
  text: Then you shall say to them[a], ‘This is the nation that did not listen to the voice of Yahweh its God and did not accept correction. Faithfulness has perished; it has been cut off from their mouth.’
  footnotes:
  - marker: a
    text: Or 'Truth has perished.' The Hebrew אֱמוּנָה can mean 'faithfulness,' 'reliability,' or 'truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들에게 이렇게 말하십시오. ‘이 민족은 자기 하나님이신 야훼의 음성을 듣지 않고 훈계를 받아들이지 않은 민족입니다. 신실함은 사라졌고, 그들의 입에서 끊어졌습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱמוּנָה는 ‘신실함’, ‘신뢰성’, 또는 ‘진리’를 뜻할 수 있습니다. 또는 ‘진리가 사라졌습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: Then you shall say
  chosen_korean: 그때 … 말하십시오
  alternatives_korean:
  - 그리고 … 말하십시오
  - 그러면 … 말하십시오
  lexicon: WLC
  rationale: 예언적 지시문의 순차성을 살리되, 한국어에서는 자연스러운 명령형 전환으로 풀었습니다. ‘그때’가 영어 POB의 ‘Then’과 히브리어 waw-연결의 흐름을 가장 무리 없이 드러냅니다.
- source_word: הַגּוֹי
  english_pob_choice: the nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 백성
  lexicon: HALOT
  rationale: הַגּוֹי는 집단 전체를 가리키는 단수 집합명사로서 ‘민족’이 예언자적 비난의 뉘앙스를 잘 살립니다. ‘백성’도 가능하지만 여기서는 공동체의 정체성 붕괴를 더 강하게 드러내는 ‘민족’이 적합합니다.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  english_pob_choice: did not listen to the voice
  chosen_korean: 음성에 듣지 않고
  alternatives_korean:
  - 음성을 듣지 않고
  - 음성에 귀를 기울이지 않고
  lexicon: HALOT
  rationale: שׁמע + בְּקוֹל의 관용구를 ‘음성에 듣다’로 직역해, 단순 청취가 아니라 순종을 내포하는 표현을 유지했습니다. ‘귀를 기울이다’는 자연스럽지만 관용구의 직접성을 약화시킵니다.
- source_word: לֹא לָקְחוּ מוּסָר
  english_pob_choice: did not accept correction
  chosen_korean: 교정도 받아들이지 않은
  alternatives_korean:
  - 훈계도 받지 않은
  - 징계도 받아들이지 않은
  lexicon: HALOT
  rationale: מוּסָר의 범위(교정, 징계, 훈계) 가운데 문맥상 가장 직접적인 의미를 살려 ‘교정’으로 옮겼습니다. ‘받아들이지 않은’은 히브리어의 ‘취하지 않다/받다’ 관용을 한국어로 자연스럽게 전달합니다.
- source_word: אָבְדָה הָאֱמוּנָה
  english_pob_choice: Faithfulness has perished
  chosen_korean: 신실함이 사라졌고
  alternatives_korean:
  - 신실함이 멸망했고
  - 진실함이 사라졌고
  lexicon: HALOT
  rationale: אֱמוּנָה는 ‘신실함/신뢰성/진리’의 범위를 가지지만, 언약적 불순종을 꾸짖는 문맥에서는 ‘신실함’이 가장 적절합니다. ‘사라졌다’는 POB의 ‘has perished’를 한국어로 자연스럽게 옮기면서도 소멸의 강도를 유지합니다.
- source_word: וְנִכְרְתָה מִפִּיהֶם
  english_pob_choice: it has been cut off from their mouth
  chosen_korean: 그들의 입에서 끊어졌습니다
  alternatives_korean:
  - 그들의 입에서 잘려 나갔습니다
  - 그들의 입에서 사라졌습니다
  lexicon: HALOT
  rationale: כרת의 ‘끊다/잘라내다’ 이미지를 유지하되, 한국어에서는 수동적 결과를 자연스럽게 드러내는 ‘끊어졌습니다’로 옮겼습니다. ‘입’은 히브리어 המקור의 직접 대응을 보존합니다.
theological_decisions:
- issue: אֱמוּנָה의 번역 선택
  chosen_reading: 신실함
  alternative_readings:
  - 진리
  - 신뢰성
  rationale: 이 구절은 공동체의 언약적 불순종을 고발하므로, 추상적 진리보다 관계적·윤리적 뉘앙스가 강한 ‘신실함’이 본문 의도를 더 잘 드러냅니다. 다만 어휘 범위를 좁혀 버리지 않도록 대안 의미는 번역 주석으로 열어 두어야 합니다.
  doctrine_reference: Translation philosophy §3, §5
