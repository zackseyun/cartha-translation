id: JER.7.7
reference: Jeremiah 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁכַּנְתִּ֤י אֶתְ/כֶם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה בָּ/אָ֕רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/007.yaml
  text: then I will let you dwell in this place[b][a], in the land that I gave to your fathers from of old and forever.
  footnotes:
  - marker: a
    text: Or “to your ancestors.” The Hebrew reads “to your fathers.”
    reason: lexical_alternative
  - marker: b
    text: Or 'from of old and forever'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 내가 너희를 이곳에, 곧 내가 너희 조상들에게 주었던 땅에, 옛적부터 영원까지 살게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 조상들에게.” 히브리어는 “너희 아버지들에게”라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “옛적부터 영원까지.”
    reason: previous_rendering
lexical_decisions:
- source_word: וְשִׁכַּנְתִּי
  english_pob_choice: then I will let you dwell
  chosen_korean: 내가 너희를 … 살게 하겠습니다
  alternatives_korean:
  - 내가 너희를 … 거하게 하겠습니다
  - 내가 너희로 하여금 … 살게 하겠습니다
  - 내가 너희와 함께 거하겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리되, 현대 한국어에서 자연스럽게 읽히는 ‘살게 하겠습니다’로 옮겨 거주를 허락하고 정착시키는 뜻을 드러냈습니다.
- source_word: בַּמָּקוֹם הַזֶּה
  english_pob_choice: in this place
  chosen_korean: 이곳에
  alternatives_korean:
  - 이곳에서
  - 이 장소에
  - 이곳
  lexicon: HALOT
  rationale: מָקוֹם의 일반적 의미를 ‘이곳’으로 간명하게 살려, 문맥상 지나친 특정화 없이 현장성을 유지했습니다.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  english_pob_choice: from of old and forever
  chosen_korean: 옛적부터 영원까지
  alternatives_korean:
  - 옛날부터 영원까지
  - 태곳적부터 영원까지
  - 영원부터 영원까지
  lexicon: HALOT
  rationale: עוֹלָם의 과거-미래를 아우르는 시간 범위를 한국어의 자연스러운 대응어로 살려, ‘영원히’보다 시작점과 끝의 대비를 보존했습니다.
- source_word: לַאֲבוֹתֵיכֶם
  english_pob_choice: to your fathers
  chosen_korean: 너희 조상들에게
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘아버지들’은 보존하되, 한국어에서는 혈통적·언약적 선조를 뜻하는 ‘조상들’이 오해가 적어 의미를 전달하는 데 적합합니다.
theological_decisions:
- issue: 땅 약속의 절대성 vs 조건성
  chosen_reading: 문맥상 조건부 권면 뒤에 오는 약속으로 읽되, 본절의 문장 자체는 조상들에게 주신 땅의 지속성을 말하는 표현으로 유지했습니다.
  alternative_readings:
  - 무조건적 영구 소유 선언으로 단정하는 번역
  - 땅의 언약적 의미를 약화시키는 일반적 거주 약속으로만 번역
  rationale: 본문은 앞절의 조건적 호소와 이어지므로, 번역에서 그 긴장을 풀어버리지 않고 그대로 두는 것이 source-grounded합니다.
  doctrine_reference: 본문의 긴장 보존
