  source_fidelity: 수정이 필요합니다. 히브리어의 시간 표현 לְמִן עוֹלָם וְעַד עוֹלָם은 ‘살게 하겠습니다’에 붙으면 과거의 ‘옛적부터’가 현재 청자들의 거주 기간을 수식하는 부자연스럽고 부정확한 뜻이 됩니다. 이는 조상들에게 주신 땅/그 수여의 지속 범위와 관련된 표현으로 보존해야 합니다. ‘살게 하겠습니다’는 וְשִׁכַּנְתִּי의 사역적 의미를 자연스럽게 잘 반영합니다.
  naturalness: ‘이곳에, 곧 … 땅에’는 이곳과 땅의 관계를 자연스럽게 드러냅니다. 다만 ‘옛적부터 영원까지 살게 하겠습니다’는 한국어에서도 청자들이 과거부터 살아 왔다는 뜻처럼 들려 문맥에 맞지 않습니다. 시간 표현을 ‘땅’에 연결하면 문장이 자연스러워집니다.
  terminology: ‘조상들’은 אָבוֹתֵיכֶם의 문맥상 자연스러운 번역이며, ‘아버지들’이라는 문자적 표현은 각주로 제시할 수 있습니다. ‘영원까지’는 본문의 미래 지향적 지속성을 유지합니다. 기존 b 각주는 본문 표현과 완전히 같아 유의미한 대안을 제공하지 못하므로, 시간 표현의 수식 범위를 설명하는 각주로 교체하는 것이 적절합니다.
