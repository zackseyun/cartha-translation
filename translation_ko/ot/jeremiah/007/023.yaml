source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת הַ/דָּבָ֣ר הַ֠/זֶּה צִוִּ֨יתִי אוֹתָ֤/ם לֵ/אמֹר֙ שִׁמְע֣וּ בְ/קוֹלִ֔/י וְ/הָיִ֤יתִי לָ/כֶם֙ לֵֽ/אלֹהִ֔ים וְ/אַתֶּ֖ם תִּֽהְיוּ לִ֣/י לְ/עָ֑ם וַ/הֲלַכְתֶּ֗ם בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אֲצַוֶּ֣ה אֶתְ/כֶ֔ם לְמַ֖עַן יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/023.yaml
  text: 'But this command I gave them: ‘Listen to my voice[a], and I will be your God, and you shall be my people; and walk in all the way that I command you, so that it may go well with you.’'
  footnotes:
  - marker: a
    text: Or 'Obey my voice.' The Hebrew idiom 'listen to my voice' often includes the sense of obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 내가 그들에게 명령한 것은 이것입니다. 곧 ‘내 목소리를 들으십시오[a]. 그러면 나는 너희의 하나님이 되고, 너희는 내 백성이 될 것이며, 내가 너희에게 명령하는 모든 길로 걸으십시오. 그러면 너희에게 잘될 것입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 목소리에 순종하십시오.’ 히브리어 관용구 ‘내 목소리를 들으십시오’는 흔히 순종의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 오직
  alternatives_korean:
  - 그러나
  - 다만
  - 오직 그것은
  lexicon: HALOT
  rationale: 앞선 부정을 바로잡아 대조하는 역접을 한국어로 압축해 옮기되, 문장 첫머리에서 강조되는 제한 의미를 살려 ‘오직’으로 처리했습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this command
  chosen_korean: 이것은
  alternatives_korean:
  - 이 명령
  - 이 말씀
  - 이 일
  lexicon: HALOT
  rationale: 문맥상 צִוִּיתִי(명령했다)와 결합되어 ‘이 명령’의 뜻이 분명하므로, 앞절과의 호응을 살리기 위해 전체를 ‘오직 내가 그들에게 명령한 것은 이것입니다’로 자연스럽게 옮겼습니다.
- source_word: שִׁמְעוּ בְקוֹלִי
  english_pob_choice: Listen to my voice
  chosen_korean: 내 목소리를 들으십시오
  alternatives_korean:
  - 내 음성에 귀 기울이십시오
  - 내 말을 들으십시오
  - 내 목소리에 순종하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 기본 이미지는 ‘듣다/귀 기울이다’이므로, 본문은 직역에 가까운 표현을 유지하되 한국어에서는 자연스러운 공손 명령형으로 옮겼습니다. 순종의 함의는 주석 없이도 언약 맥락에서 드러납니다.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים / וְאַתֶּם תִּהְיוּ לִי לְעָם
  english_pob_choice: I will be your God ... you shall be my people
  chosen_korean: 나는 너희의 하나님이 되고, 너희는 내 백성이 될 것이며
  alternatives_korean:
  - 나는 너희에게 하나님이 되고, 너희는 내게 백성이 될 것이며
  - 나는 너희에게 하나님이 되겠고, 너희는 내 백성이 되겠으며
  lexicon: HALOT
  rationale: 히브리어의 언약 공식은 관계적 진술이므로 한국어에서도 표준적인 상호 언약 문구를 유지했습니다. ‘~의 하나님’과 ‘내 백성’의 병행을 살려 문장 리듬도 보존했습니다.
- source_word: וַהֲלַכְתֶּם בְּכָל הַדֶּרֶךְ
  english_pob_choice: and walk in all the way
  chosen_korean: 내가 너희에게 명령하는 모든 길로 걸으십시오
  alternatives_korean:
  - 내가 너희에게 명령하는 길을 따라 걸으십시오
  - 내가 너희에게 명령하는 모든 길 안에서 걸으십시오
  - 내가 너희에게 명령하는 모든 길을 걸으십시오
  lexicon: HALOT
  rationale: 여기서 הלך는 윤리적 삶의 행위를 뜻하므로 ‘걸으십시오’로 보존했습니다. 영어 POB의 최신 판정처럼 전체 경로성을 살리기 위해 ‘모든 길’로 옮겼고, 명령문의 직접성을 유지했습니다.
- source_word: לְמַעַן יִיטַב לָכֶם
  english_pob_choice: so that it may go well with you
  chosen_korean: 그러면 너희에게 잘될 것입니다
  alternatives_korean:
  - 그래서 너희에게 복이 있을 것입니다
  - 그리하면 너희가 복을 받을 것입니다
  - 그리하여 너희에게 좋을 것입니다
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 관용구로서, 현대 한국어에서 가장 자연스럽고 분명한 결과 표현을 선택했습니다. 문자적 어색함보다 의미를 선명하게 전달하는 쪽이 본문의 의도를 더 잘 드러냅니다.
theological_decisions:
- issue: שִׁמְעוּ בְקוֹלִי의 순종 함의
  chosen_reading: 주본문은 ‘내 목소리를 들으십시오’로 두고, 순종의 의미는 본문 밖으로 주석화하지 않았습니다.
  alternative_readings:
  - 내 목소리에 순종하십시오
  - 내 말을 들으십시오
  rationale: 히브리어 표현은 문자적으로는 청취를 뜻하지만 언약 문맥에서 순종을 포함할 수 있습니다. 본문은 그 긴장을 지우지 않고, 직접적 의미를 우선해 두는 편이 원문에 더 가깝습니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
- issue: 언약 공식의 관계성
  chosen_reading: ‘나는 너희의 하나님이 되고, 너희는 내 백성이 될 것이며’로 관계적 언약 공식을 유지했습니다.
  alternative_readings:
  - 나는 너희에게 하나님이 되고, 너희는 내게 백성이 될 것이며
  - 나는 너희의 하나님이 되며, 너희는 내 백성이 되리라
  rationale: 본문은 존재론적 정의가 아니라 언약 관계를 선언합니다. 따라서 한국어에서도 익숙한 성경적 언약 공식을 유지하여 관계성과 대칭성을 분명히 했습니다.
  doctrine_reference: 번역 원칙 §1, §3, §6
