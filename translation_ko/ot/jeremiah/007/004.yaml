id: JER.7.4
reference: Jeremiah 7:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ לָ/כֶ֔ם אֶל דִּבְרֵ֥י הַ/שֶּׁ֖קֶר לֵ/אמֹ֑ר הֵיכַ֤ל יְהוָה֙ הֵיכַ֣ל יְהוָ֔ה הֵיכַ֥ל יְהוָ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/004.yaml
  text: Do not trust in deceptive words[a], saying, “The temple of Yahweh, the temple of Yahweh[b], the temple of Yahweh are these.”
  footnotes:
  - marker: a
    text: Or 'in lying words.' The Hebrew can emphasize either the falsity of the words or their deceptive effect.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''The temple of the LORD, the temple of the LORD, the temple of the LORD are these.'' The threefold repetition is rhetorical, expressing misplaced confidence in the temple itself.'
    reason: cultural_note
translation:
  language: ko
  text: 거짓된 말들을 믿지 마십시오. “야훼의 성전이다, 야훼의 성전이다, 야훼의 성전이다. 이곳이 바로 그것이다”라고 말하면서 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓말하는 말들’로도 옮길 수 있습니다. 히브리어는 말의 내용이 거짓이라는 뜻과 사람을 속이는 효과를 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “야훼의 성전”을 세 번 반복하여, 성전 자체가 보호를 보장한다는 잘못된 자신감을 수사적으로 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  english_pob_choice: Do not trust
  chosen_korean: 믿지 마십시오
  alternatives_korean:
  - 신뢰하지 마십시오
  - 의지하지 마십시오
  lexicon: HALOT
  rationale: אַל + 미완료형은 금지 명령이며, בטח는 ‘믿다/의지하다’의 뜻입니다. 한국어에서는 경고의 직설성을 살려 ‘믿지 마십시오’가 가장 자연스럽습니다.
- source_word: אֶל דִּבְרֵי הַשֶּׁקֶר
  english_pob_choice: in deceptive words
  chosen_korean: 거짓된 말들
  alternatives_korean:
  - 거짓말들
  - 속이는 말들
  - 헛된 말들
  lexicon: HALOT
  rationale: שׁקר는 단순한 허위뿐 아니라 사람을 속이는 성격도 띱니다. ‘거짓된 말들’은 그 두 층위를 함께 살리면서도 본문이 경고하는 대상을 한국어로 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유 이름의 성격을 보존했습니다.
- source_word: הֵיכַל
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 전
  - 궁전
  lexicon: HALOT
  rationale: הֵיכַל은 이 문맥에서 예루살렘의 성전을 가리키므로 ‘성전’이 가장 정확합니다.
theological_decisions:
- issue: 세 번 반복되는 성전 구호의 처리
  chosen_reading: “야훼의 성전이다”를 세 번 그대로 반복해, 그 자체가 안전을 보장한다는 왜곡된 확신을 드러내도록 했습니다.
  alternative_readings:
  - “야훼의 성전, 야훼의 성전, 야훼의 성전”
  - “주님의 성전이다”로 압축
  rationale: 예언자적 비판의 핵심은 반복되는 구호의 수사적 강도에 있습니다. 반복을 줄이거나 요약하면 문맥이 지적하는 미신적 신뢰의 어조가 약해집니다.
  doctrine_reference: 예레미야 7장의 성전 신뢰 비판
