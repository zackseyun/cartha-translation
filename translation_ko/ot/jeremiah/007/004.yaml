  to: ‘야훼의 성전, 야훼의 성전, 야훼의 성전—바로 이것들이다’라고 하는 거짓된 말을 믿지 마십시오.[a][b]
  rationale: 수정안은 금지 명령과 인용의 관계를 한국어로 자연스럽게 정리하고, ‘야훼의 성전’의 삼중 반복 및 마지막 복수 지시대명사를 보존합니다. 원문의 압축적 구문을 설명적으로 ‘이곳’이나 단수 ‘그것’으로 풀어쓰지 않아 의미상의 여지를 유지했습니다.
