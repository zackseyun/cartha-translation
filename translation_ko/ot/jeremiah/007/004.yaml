  source_fidelity: 수정이 필요합니다. 초안은 금지 명령, 거짓/속이는 말, 야훼의 이름, 성전 구호의 삼중 반복을 대체로 보존합니다. 그러나 הֵמָּה(‘이것들/그것들’)를 ‘이곳이 바로 그것이다’로 옮긴 것은 단수 ‘이곳’을 보태고 복수 지시대명사를 바꾸며, 원문의 다소 압축적이고 강조적인 구문을 불필요하게 재해석합니다. 또한 각 반복구에 ‘이다’를 넣으면 히브리어의 명사구 반복과 마지막 대명사의 연결이 흐려집니다.
  naturalness: ‘…라고 말하면서 말입니다’는 현대 표준 한국어 문장으로 군더더기 있고 구어적인 보충처럼 들립니다. 인용 내용을 ‘…라고 하는 거짓된 말을 믿지 마십시오’로 처리하면 לֵאמֹר의 내용 관계와 금지의 대상을 자연스럽고 직접적으로 드러냅니다. ‘바로 이것들이다’는 원문의 복수 지시와 강조를 보존하면서도 한국어 문맥에서 이해 가능합니다.
  terminology: ‘야훼’, ‘성전’은 프로젝트의 신명 방침 및 문맥에 적절합니다. שֶׁקֶר는 ‘거짓된 말’로 가능하나, 각주 대안인 ‘거짓말하는 말들’은 한국어에서 부자연스럽고 ‘말들이 거짓말한다’는 어색한 의미를 낳습니다. ‘거짓의 말’ 또는 ‘속이는 말’이 더 적절합니다.
