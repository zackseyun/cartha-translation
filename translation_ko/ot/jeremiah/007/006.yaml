revisions:
- from: 외국인[a]과 고아[b]와 과부를 억압하지 말며, 이곳에서 무죄한 피를 흘리지 말고[c], 다른 신들을 따라가지 말라. 그것은 너희에게 해가 됩니다.
  to: 외국인[a]과 아버지 없는 사람[b]과 과부를 억압하지 마십시오. 이곳에서 무고한 피를 흘리지 말며, 다른 신들을 따라가지 마십시오[c]. 그것은 너희에게 해가 되기 때문입니다.
  rationale: 명령형을 현대 합쇼체로 통일했습니다. יָתוֹם의 아버지 상실이라는 원문의 범주를 본문에서 보존하고, 더 널리 쓰이는 ‘고아’는 각주 대안으로 옮겼습니다. 또한 다른 신들을 따르는 행위가 청자 자신에게 해가 된다는 לְרַע לָכֶם의 관계를 ‘그것은 … 때문입니다’로 명확히 했고, 각주 c를 설명 대상인 표현 뒤로 옮겼습니다.
