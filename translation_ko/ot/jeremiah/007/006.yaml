  timestamp: '2026-07-13T17:15:05Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 세 취약 계층, 무고한 피를 흘리는 행위의 금지, 다른 신들을 ‘따라가는’ 행위의 금지, 그리고 그 행위가 청자 자신에게 해가 된다는 결말을 대체로 반영합니다. 다만 יָתוֹם은 우선적으로 ‘아버지 없는 자’를 가리키므로, ‘고아’만을 본문으로 택하면 범위가 넓어질 수 있습니다.
  naturalness: 초안은 ‘말며/말고/말라’의 평서체 명령과 ‘됩니다’의 합쇼체가 섞여 있어 목표 등록에 맞지 않습니다. 전 구절을 현대 한국어 합쇼체로 통일하는 것이 필요합니다.
  terminology: גֵּר의 ‘외국인’은 현대적으로 이해되지만 거주하는 비토착민이라는 사회적 범주를 각주로 보완할 수 있습니다. יָתוֹם은 본문에서 ‘아버지 없는 사람’으로 옮기고 ‘고아’를 대안으로 제시하는 편이 원문에 더 충실합니다. ‘무고한 피’, ‘다른 신들’, ‘따라가다’는 적절합니다.
  issues:
