id: JER.7.6
reference: Jeremiah 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֵּ֣ר יָת֤וֹם וְ/אַלְמָנָה֙ לֹ֣א תַֽעֲשֹׁ֔קוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים לֹ֥א תֵלְכ֖וּ לְ/רַ֥ע לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/006.yaml
  text: Do not oppress the foreigner[a], the fatherless, and the widow; do not shed innocent blood in this place[c][b]; and do not go after other gods to your own harm.
  footnotes:
  - marker: a
    text: Or 'the sojourner' or 'the resident alien' for 'the foreigner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the orphan' for 'the fatherless.'
    reason: lexical_alternative
  - marker: c
    text: Or 'do not follow other gods.' The Hebrew literally says 'do not go after other gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 외국인[a]과 아버지 없는 사람[b]과 과부를 억압하지 마십시오. 이곳에서 무고한 피를 흘리지 말며, 다른 신들을 따라가지 마십시오[c]. 그것은 너희에게 해가 되기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류민’, ‘나그네’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고아’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘다른 신들 뒤로 가다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  english_pob_choice: the foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 나그네
  - 거류민
  - 이방인
  lexicon: HALOT
  rationale: POB가 가리키는 사회적 약자 범주를 현대 한국어에서 가장 바로 이해되는 말로 옮겼습니다. '나그네'는 의미가 좁아지고, '거류민'은 지나치게 기술적입니다.
- source_word: יָתוֹם
  english_pob_choice: the fatherless
  chosen_korean: 고아
  alternatives_korean:
  - 아버지 없는 자
  - 부친 없는 자
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '아버지가 없는 자'이지만, 한국어에서는 보호 상실의 취지를 가장 자연스럽게 드러내는 '고아'가 적절합니다.
- source_word: דָם נָקִי
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 죄 없는 피
  - 무고한 피
  lexicon: HALOT
  rationale: '''무죄한 피''는 사법적·도덕적 무죄의 뉘앙스를 살리면서도, 예언서의 관용구인 ''피를 흘리다''와 잘 결합합니다.'
- source_word: אַחֲרֵי ... לֹא תֵלְכ֖וּ
  english_pob_choice: do not go after
  chosen_korean: 따라가지 말라
  alternatives_korean:
  - 뒤따르지 말라
  - 쫓아가지 말라
  lexicon: HALOT
  rationale: 히브리어의 '가다/뒤따르다' 관용은 우상에 대한 충성 추종을 뜻하므로, 현대 한국어에서는 자연스럽고 명령성도 분명한 '따라가지 말라'가 적합합니다.
theological_decisions:
- issue: 다른 신들을 향한 행위 표현
  chosen_reading: 다른 신들을 따라가지 말라
  alternative_readings:
  - 다른 신들을 섬기지 말라
  - 다른 신들을 좇지 말라
  rationale: 원문은 단순한 예배 행위보다 '뒤따름'의 언약적 충성을 금지합니다. 이를 살리기 위해 POB의 직역성을 유지하되 한국어에서는 '따라가다'로 자연화했습니다.
  doctrine_reference: 언약적 신실함과 우상숭배 금지의 원문 관용구 보존
