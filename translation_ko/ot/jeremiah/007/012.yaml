  source_fidelity: 원문의 인과적 כִּי, 복수 명령 ‘가라/보라’, 실로의 ‘내 곳’, 하나님의 이름을 그곳에 머물게 하신 표현, 그리고 이스라엘의 도덕적 악 때문에 그곳에 내린 처분을 대체로 반영합니다. 다만 초안은 ‘처음에 … 한 것과 … 행한 일을 보십시오’라고 병렬하여, ‘처음에’가 이름을 머물게 한 행위에만 걸리고 ‘내 곳’이 그 수식을 받는 원문 구조가 흐려집니다. ‘그곳에 행한 일’도 원문의 ‘그것에 내가 행한 것’을 다소 약화합니다.
  naturalness: ‘내 곳, 곧 실로에 있던 곳’은 ‘곳’의 중복으로 부자연스럽고, ‘내 이름을 머물게 한 것’은 장소를 가리켜야 할 관계절이 명사화되어 문장 연결이 어색합니다. ‘실로에 있던 내 곳’ 및 ‘그곳을 어떻게 하였는지’가 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘내 이름을 거기에 머물게 하였다’는 שִׁכַּנְתִּי שְׁמִי שָׁם의 사역적 ‘거주’ 이미지를 보존합니다. ‘악’은 רָעַת의 도덕적 의미에 적절합니다. 각주 대안의 ‘내 이름이 거하게 한 곳’은 문법상 이름이 행위 주체가 되는 뜻이므로 ‘내 이름을 거하게 한 곳’으로 바로잡아야 합니다.
