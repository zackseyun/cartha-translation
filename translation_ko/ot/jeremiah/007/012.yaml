  to: 그러니 이제 실로에 있던 내 곳, 곧 내가 처음에 내 이름을 거기에 머물게 하였던 곳으로 가서, 내가 내 백성 이스라엘의 악 때문에 그곳을 어떻게 하였는지 보십시오.[a]
  rationale: 인과 접속사와 긴급한 명령의 흐름을 ‘그러니 이제’로 자연스럽게 옮기고, ‘실로에 있던 내 곳’이 ‘처음에 내 이름을 거기에 머물게 하였던’이라는 관계절의 수식을 받도록 문장을 재구성했습니다. 또한 ‘그곳을 어떻게 하였는지’로 원문의 처분 대상이 실로의 장소/성소임을 보존했으며, 각주의 사역 표현을 문법적으로 바로잡았습니다.
