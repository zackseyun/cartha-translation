  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לְכוּ נָ֗א אֶל מְקוֹמִ/י֙ אֲשֶׁ֣ר בְּ/שִׁיל֔וֹ אֲשֶׁ֨ר שִׁכַּ֧נְתִּֽי שְׁמִ֛/י שָׁ֖ם בָּ/רִֽאשׁוֹנָ֑ה וּ/רְאוּ֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתִי ל֔/וֹ מִ/פְּנֵ֕י רָעַ֖ת עַמִּ֥/י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/012.yaml
  text: For go now to my place that was in Shiloh[a], where I made my name dwell at first, and see what I did to it because of the evil of my people Israel.
  footnotes:
  - marker: a
    text: Or 'where I caused my name to dwell' or more traditionally 'where I set my name.' The Hebrew preserves the imagery of God's name dwelling there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 내 곳, 곧 실로에 있던 곳으로 가서 내가 거기에서 처음에 내 이름을 머물게 한 것과 내가 내 백성 이스라엘의 악 때문에 거기에 행한 일을 보십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 이름이 거하게 한 곳’ 또는 더 전통적으로는 ‘내 이름을 두었던 곳’으로 옮길 수도 있습니다. 히브리어는 거기에서 하나님의 이름이 머무는 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  english_pob_choice: go now
  chosen_korean: 가십시오
  alternatives_korean:
  - 가 보십시오
  - 이제 가십시오
  lexicon: HALOT
  rationale: 복수 명령의 आग्रह을 한국어 합쇼체로 자연스럽게 살리되, נָא의 긴급성을 문장 흐름으로 반영했습니다.
- source_word: מְקוֹמִי
  english_pob_choice: my place
  chosen_korean: 내 곳
  alternatives_korean:
  - 내 자리
  - 내 장소
  lexicon: HALOT
  rationale: 하나님께 속한 성소적 ‘place’를 한국어에서 가장 직접적으로 옮기기 위해 ‘내 곳’으로 두었습니다.
- source_word: שִׁכַּנְתִּי שְׁמִי שָׁם
  english_pob_choice: where I made my name dwell
  chosen_korean: 내 이름을 머물게 한 것
  alternatives_korean:
  - 내 이름을 거하게 한 것
  - 내 이름을 두었던 곳
  lexicon: HALOT
  rationale: ‘이름’의 성소적 임재 표지를 살리면서, “set my name”보다 히브리어의 동사적 이미지를 더 직접적으로 반영했습니다.
- source_word: רָעַת עַמִּי יִשְׂרָאֵל
  english_pob_choice: the evil of my people Israel
  chosen_korean: 내 백성 이스라엘의 악
  alternatives_korean:
  - 내 백성 이스라엘의 악행
  - 내 백성 이스라엘의 죄악
  lexicon: HALOT
  rationale: 문맥상 심판의 원인이 되는 도덕적 악을 가리키므로, 완곡한 ‘죄악’보다 직접적인 ‘악’을 택했습니다.
theological_decisions:
- issue: 야훼의 ‘이름’이 머문다는 표현의 처리
  chosen_reading: 내 이름을 머물게 한 것
  alternative_readings:
  - 내 이름을 두었던 것
  - 내 이름이 거하게 한 것
  rationale: 하나님의 본질을 장소에 가두지 않으면서도, 언약적 현존의 표지로서 ‘이름’이 머문다는 히브리어 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
