  to: 아이들은 나무를 줍고, 아버지들은 불을 피우며, 여자들은 하늘의 여왕[a]을 위한 과자를 만들려고 반죽을 주무릅니다. 또 다른 신들에게 전제를 붓고, 나를 분노하게 하려는 것입니다.
