id: JER.7.18
reference: Jeremiah 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/בָּנִ֞ים מְלַקְּטִ֣ים עֵצִ֗ים וְ/הָֽ/אָבוֹת֙ מְבַעֲרִ֣ים אֶת הָ/אֵ֔שׁ וְ/הַ/נָּשִׁ֖ים לָשׁ֣וֹת בָּצֵ֑ק לַ/עֲשׂ֨וֹת כַּוָּנִ֜ים לִ/מְלֶ֣כֶת הַ/שָּׁמַ֗יִם וְ/הַסֵּ֤ךְ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/018.yaml
  text: The children gather wood[a], the fathers kindle the fire, and the women knead dough to make cakes for the Queen of Heaven and to pour out drink offerings to other gods, so as to provoke me to anger.
  footnotes:
  - marker: a
    text: Hebrew מְלֶכֶת הַשָּׁמַיִם is traditionally understood as 'the Queen of Heaven,' likely a title for a goddess worshiped by Judah. Some have proposed 'the work of heaven,' but the context here favors a personal deity receiving offerings.
    reason: alternative_reading
translation:
  language: ko
  text: 아이들은 나무를 줍고, 아버지들은 불을 피우며, 여자들은 하늘의 여왕[a]을 위한 과자를 만들려고 반죽을 주무릅니다. 또 다른 신들에게 전제를 붓고, 나를 분노하게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְלֶכֶת הַשָּׁמַיִם는 전통적으로 ‘하늘의 여왕’으로 이해되며, 유다에서 숭배된 여신의 칭호로 보입니다. 일부는 이를 ‘하늘의 일’로 이해하기도 하지만, 이 문맥은 제물을 받는 인격적 신격을 가리키는 해석을 더 잘 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּנִים / מְלַקְּטִים
  english_pob_choice: The children gather wood
  chosen_korean: 아이들은 나무를 줍고
  alternatives_korean:
  - 아이들은 나무를 모으고
  - 자녀들은 나무를 모으고
  lexicon: HALOT
  rationale: מְלַקְּטִים는 ‘줍다/모으다’의 뉘앙스를 가지므로, 일상적이면서도 동작을 선명하게 드러내는 ‘줍고’로 옮겼습니다.
- source_word: עֵצִים
  english_pob_choice: wood
  chosen_korean: 나무
  alternatives_korean:
  - 장작
  - 나무 토막
  lexicon: HALOT
  rationale: 제의적 준비 장면에서 실제 불쏘시개가 될 목재를 가리키므로, 한국어로는 간결한 ‘나무’가 가장 자연스럽습니다.
- source_word: לָשׁוֹת בָּצֵק
  english_pob_choice: knead dough
  chosen_korean: 반죽을 주무릅니다
  alternatives_korean:
  - 반죽을 치댑니다
  - 반죽을 이룹니다
  lexicon: HALOT
  rationale: לָשׁוֹת는 단순 혼합이 아니라 손으로 치대는 동작이므로, 구체성을 살리는 ‘주무르다’를 선택했습니다.
- source_word: מְלֶכֶת הַשָּׁמַיִם
  english_pob_choice: the Queen of Heaven
  chosen_korean: 하늘의 여왕
  alternatives_korean:
  - 하늘 여왕
  - 하늘의 여왕신
  lexicon: HALOT
  rationale: 문맥상 예배와 전제를 받는 개인적 대상이므로, POB의 ‘Queen of Heaven’을 그대로 반영해 ‘하늘의 여왕’으로 옮겼습니다.
- source_word: נְסָכִים
  english_pob_choice: drink offerings
  chosen_korean: 전제물
  alternatives_korean:
  - 붓는 제물
  - 술제물
  lexicon: HALOT
  rationale: נְסָכִים는 제의적으로 붓는 술 제물을 가리키므로, 보다 직접적인 전통 용어인 ‘전제물’을 사용했습니다.
theological_decisions:
- issue: ‘하늘의 여왕’의 정체
  chosen_reading: 본문의 우상 숭배 맥락을 따라 개인적 신격인 ‘하늘의 여왕’으로 번역했습니다.
  alternative_readings:
  - ‘하늘의 일’ 또는 ‘하늘의 일/작업’로 이해하는 견해
  rationale: 예레미야의 문맥은 가정 제의와 제물 봉헌을 말하므로, 우상적 여신을 가리키는 읽기를 본문에 보존하는 것이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
