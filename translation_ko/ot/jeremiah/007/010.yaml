  verdict: revise
  source_fidelity: 히브리어의 예언적 현재 연쇄(‘와서… 서고… 말하다’)와 ‘이 집’, ‘내 이름으로 불리는’, נִצַּלְנוּ의 구출/구제 주장, 그리고 목적을 나타내는 לְמַעַן עֲשׂוֹת를 유지해야 합니다. 현 초안의 ‘그래서 … 행하려는 것입니다’는 목적 관계를 설명적 결론처럼 바꾸고, 원문의 직접적 비꼼을 다소 약화합니다.
