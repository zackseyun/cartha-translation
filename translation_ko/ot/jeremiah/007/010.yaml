  terminology: ‘이 집’, ‘내 이름으로 불리는’, ‘구출되었습니다’, ‘가증한 일들’은 모두 적절합니다. 다만 ‘구출되었습니다’의 대안 각주는 말하다 동사가 아니라 해당 인용문에 붙어야 합니다.
