id: JER.7.10
reference: Jeremiah 7:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָאתֶ֞ם וַ/עֲמַדְתֶּ֣ם לְ/פָנַ֗/י בַּ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר נִקְרָא שְׁמִ֣/י עָלָ֔י/ו וַ/אֲמַרְתֶּ֖ם נִצַּ֑לְנוּ לְמַ֣עַן עֲשׂ֔וֹת אֵ֥ת כָּל הַ/תּוֹעֵב֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/010.yaml
  text: Then you come and stand before me in this house[a], which is called by my name, and say[b], ‘We are delivered!’—so that you may do all these abominations.
  footnotes:
  - marker: a
    text: 'Or, ''this temple.'' Hebrew: ''this house.'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'We are saved!' or 'We are safe!'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희가 내 이름으로 불리는 이 집[a]에 와서 내 앞에 서고, ‘우리는 구출되었습니다![b]’ 하고 말합니다. 그 모든 가증한 일들을 행하려고 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 성전’. 히브리어는 ‘이 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리는 구원받았습니다!’ 혹은 ‘우리는 안전합니다!’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתֶם
  english_pob_choice: Then you come
  chosen_korean: 그러면 너희가 와서
  alternatives_korean:
  - 그리고 너희가 와서
  - 그때 너희가 와서
  lexicon: HALOT
  rationale: 예언적 책망의 연쇄를 살리기 위해 단순 과거보다 현재형의 생동감 있는 진술로 옮겼습니다.
- source_word: בַּבַּיִת הַזֶּה
  english_pob_choice: in this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이곳 집
  lexicon: HALOT
  rationale: 히브리어의 ‘집’을 그대로 살리되, 문맥상 성전임은 독자가 알 수 있게 했습니다.
- source_word: נִצַּלְנוּ
  english_pob_choice: We are delivered!
  chosen_korean: 우리는 구출되었습니다!
  alternatives_korean:
  - 우리는 구원받았습니다!
  - 우리는 안전합니다!
  lexicon: HALOT
  rationale: 문맥상 성전 출입이 주는 ‘구출/구제’에 대한 자의적 확신을 드러내면서, ‘구원’보다 좁은 의미를 보존했습니다.
- source_word: כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  english_pob_choice: all these abominations
  chosen_korean: 이 모든 가증한 일들
  alternatives_korean:
  - 이 모든 혐오스러운 일들
  - 이 모든 역겨운 행위들
  lexicon: HALOT
  rationale: 언약적·종교적 혐오를 나타내는 강한 표현이므로, 성경적 용례가 있는 ‘가증한 일들’을 유지했습니다.
theological_decisions:
- issue: 성전 호칭의 보존
  chosen_reading: ‘집’으로 유지하되 문맥에서 성전으로 이해되도록 함
  alternative_readings:
  - ‘성전’으로 명시
  rationale: 본문은 בַּיִת(집)을 사용하므로, 신학적 함의를 지키기 위해 일반어를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: נִצַּלְנוּ의 구제/구원 뉘앙스
  chosen_reading: ‘우리는 구출되었습니다!’
  alternative_readings:
  - ‘우리는 구원받았습니다!’
  - ‘우리는 안전합니다!’
  rationale: 화자들의 자만 섞인 안전 보장을 드러내면서, 후대 구원론 용어를 과도하게 입히지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
