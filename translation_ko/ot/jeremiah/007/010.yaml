revisions:
- from: 그러면 너희가 이 집[a]—내 이름으로 불리는 집—에 와서 내 앞에 서며 말합니다[b]. ‘우리는 구출되었습니다!’ 그래서 너희가 이 모든 가증한 일들을 행하려는 것입니다.
  to: 그러면 너희가 내 이름으로 불리는 이 집[a]에 와서 내 앞에 서고, ‘우리는 구출되었습니다![b]’ 하고 말합니다. 그 모든 가증한 일들을 행하려고 말입니다.
  rationale: 문장 연결을 자연스럽게 다듬고, 목적을 나타내는 히브리어 לְמַעַן עֲשׂוֹת를 ‘… 행하려고 말입니다’로 옮겨 예언자의 비꼬는 목적 표현을 보존했습니다. ‘이 집’과 ‘내 이름으로 불리는’의 원문 어순 및 의미를 유지했으며, 구출 표현의 대안 각주를 해당 인용문으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:53Z'
