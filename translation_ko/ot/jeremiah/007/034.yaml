id: JER.7.34
reference: Jeremiah 7:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֣י מֵ/עָרֵ֣י יְהוּדָ֗ה וּ/מֵֽ/חֻצוֹת֙ יְר֣וּשָׁלִַ֔ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה כִּ֥י לְ/חָרְבָּ֖ה תִּהְיֶ֥ה הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/034.yaml
  text: And I will put an end[a], from the cities of Judah and from the streets of Jerusalem, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride[c][b], for the land will become a ruin.
  footnotes:
  - marker: a
    text: Or 'the squares of Jerusalem'; the Hebrew term can refer to streets or public places.
    reason: lexical_alternative
  - marker: b
    text: Or 'the sound of rejoicing and the sound of gladness.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for the land will be desolate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 유다의 성읍들과 예루살렘의 거리들에서 기쁨의 소리와 즐거움의 소리, 신랑의 소리와 신부의 소리를 그치게 하겠습니다. 이는 그 땅이 폐허가 될 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  english_pob_choice: And I will put an end
  chosen_korean: 그치게 하겠습니다
  alternatives_korean:
  - 끝내겠습니다
  - 멈추게 하겠습니다
  - 없애겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려, 소리가 스스로 사라지는 것이 아니라 하나님이 그것을 멈추게 하신다는 점을 분명히 했습니다.
- source_word: מֵעָרֵי יְהוּדָה וּמֵחֻצוֹת יְרוּשָׁלִַם
  english_pob_choice: from the cities of Judah and from the streets of Jerusalem
  chosen_korean: 유다의 성읍들과 예루살렘의 거리들에서
  alternatives_korean:
  - 유다의 도시들과 예루살렘의 광장들에서
  - 유다의 성읍들과 예루살렘의 공공장소들에서
  lexicon: HALOT
  rationale: מִן의 출처/제거 의미를 살려 ‘-에서’로 옮겼고, חֻצוֹת는 문맥상 거리로 옮기되 공공 공간의 뉘앙스를 완전히 지우지 않도록 했습니다.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  english_pob_choice: the sound of joy and the sound of gladness
  chosen_korean: 기쁨의 소리와 즐거움의 소리
  alternatives_korean:
  - 환호의 소리와 즐거움의 소리
  - 기쁨의 소리와 환희의 소리
  lexicon: HALOT
  rationale: קוֹל은 실제 음향을 가리키므로 ‘소리’로 두었고, שָׂשׂוֹן/שִׂמְחָה의 병렬을 자연스럽게 살리기 위해 의미를 분화해 번역했습니다.
- source_word: ק֥וֹל חָתָ֖ן וְק֣וֹל כַּלָּ֑ה
  english_pob_choice: the voice of the bridegroom and the voice of the bride
  chosen_korean: 신랑의 소리와 신부의 소리
  alternatives_korean:
  - 신랑의 목소리와 신부의 목소리
  - 신랑의 음성과 신부의 음성
  lexicon: HALOT
  rationale: 결혼 축제의 정형구를 살리면서도 현대 한국어에서 더 자연스러운 표현인 ‘소리’를 택해, 실제 사람의 목소리와 축제의 현장감을 함께 보존했습니다.
- source_word: לְחָרְבָּה תִּהְיֶה הָאָרֶץ
  english_pob_choice: for the land will become a ruin
  chosen_korean: 그 땅이 폐허가 될 것이기 때문입니다
  alternatives_korean:
  - 그 땅이 황폐해질 것이기 때문입니다
  - 그 땅이 황무지가 될 것이기 때문입니다
  lexicon: HALOT
  rationale: חָרְבָּה의 파괴·폐허 의미를 살리되, ‘폐허’가 결과 상태를 선명하게 드러내어 현대 독자에게도 직접적으로 전달되도록 했습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위
  chosen_reading: ‘내가 … 그치게 하겠습니다’로 번역하여, 기쁨의 소리들을 멈추게 하시는 주체가 하나님 자신이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘기쁨의 소리가 그치게 될 것입니다’와 같은 비인칭적 표현
  rationale: 히필 1인칭 형태가 하나님의 능동적 개입을 강조하므로, 이를 약화시키지 않고 직접 행위로 옮겼습니다.
  doctrine_reference: 예레미야서의 언약 심판과 하나님의 주권적 심판 주체성
