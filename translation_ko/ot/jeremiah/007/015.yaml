id: JER.7.15
reference: Jeremiah 7:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁלַכְתִּ֥י אֶתְ/כֶ֖ם מֵ/עַ֣ל פָּנָ֑/י כַּ/אֲשֶׁ֤ר הִשְׁלַ֨כְתִּי֙ אֶת כָּל אֲחֵי/כֶ֔ם אֵ֖ת כָּל זֶ֥רַע אֶפְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/015.yaml
  text: And I will cast you out from before me[a], just as I cast out all your brothers[c][b], all the offspring of Ephraim.
  footnotes:
  - marker: a
    text: Or 'from before me' or 'away from my presence.' Literally, 'from upon my face.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here refers to Judah''s fellow Israelites, especially those of the northern kingdom.'
    reason: cultural_note
  - marker: c
    text: Ephraim here stands for the northern kingdom of Israel.
    reason: cross_reference
translation:
  language: ko
  text: 내가 너희를 내 앞에서 쫓아내 버리겠다[a]. 내가 너희 모든 형제들[c][b], 곧 에브라임의 모든 자손을 쫓아낸 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 앞에서부터’ 혹은 ‘내 임재에서’. 직역하면 ‘내 얼굴 위에서’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘형제들’은 여기서 유다의 동족 이스라엘 사람들, 특히 북왕국 사람들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 여기서 에브라임은 북왕국 이스라엘을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי / הִשְׁלַכְתִּי
  english_pob_choice: cast out / cast out
  chosen_korean: 쫓아내 버리겠다 / 쫓아낸 것처럼
  alternatives_korean:
  - 내던지겠다
  - 던져 버리겠다
  - 몰아내겠다
  lexicon: HALOT
  rationale: שׁלך의 강한 배척·축출 의미를 살리기 위해 단순한 ‘던지다’보다 관계적·법정적 거절을 드러내는 ‘쫓아내다’를 택했습니다. 반복 동사는 앞뒤 절에서 같은 심판 행위를 연결합니다.
- source_word: מֵעַל פָּנַי
  english_pob_choice: from before me / out from before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내 앞에서부터
  - 내 얼굴 위에서
  - 내 임재에서
  lexicon: HALOT
  rationale: 직역하면 ‘내 얼굴 위에서’이지만, 심판 맥락에서 의미하는 바는 하나님 앞에서의 추방이므로 현대 한국어에서 자연스럽고도 관계적 거절을 드러내는 ‘내 앞에서’로 옮겼습니다.
- source_word: אֲחֵיכֶם
  english_pob_choice: your brothers
  chosen_korean: 너희 모든 형제들
  alternatives_korean:
  - 너희 모든 친족들
  - 너희 모든 동족들
  - 너희 모든 형제자매들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 형제호칭을 그대로 살려, 북이스라엘 동족을 가리키는 혈연·언약적 표현을 보존했습니다.
- source_word: אֵת כָּל זֶרַע אֶפְרָיִם
  english_pob_choice: all the offspring of Ephraim
  chosen_korean: 에브라임의 모든 자손
  alternatives_korean:
  - 에브라임의 모든 씨
  - 에브라임의 모든 후손
  - 에브라임의 모든 자녀
  lexicon: HALOT
  rationale: זֶרַע는 집합적 후손을 뜻하므로, 현대 한국어에서 자연스럽고 집합성을 유지하는 ‘자손’을 선택했습니다. 고유명사 에브라임은 본문에서 유지했습니다.
theological_decisions:
- issue: ‘내 앞에서’라는 추방 표현의 신학적 뉘앙스
  chosen_reading: 언약적 심판과 배척을 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 공간 이동으로 읽기
  - 하나님의 편재를 직접 설명하는 표현으로 읽기
  rationale: 이 구절은 하나님의 임재 논의를 전개하려는 것이 아니라, 언약 파기와 심판으로서의 축출을 선포합니다. 따라서 본문 수준의 강도를 유지하면서도 과도한 신학적 확장을 피했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 에브라임의 지시 대상
  chosen_reading: 본문은 고유명사 에브라임을 유지하고, 북왕국 전체를 가리키는 메톤미로 이해합니다.
  alternative_readings:
  - 북이스라엘
  - 이스라엘
  rationale: 원문 고유명사를 본문에서 보존하는 것이 1차적이며, 그 역사적 지시 대상을 번역문 안에서 해석적으로 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §1, §2, §5
