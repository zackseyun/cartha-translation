review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 병렬·동격 구조는 대체로 충실합니다. 다만 원문의 비교절은 앞 절의 심판 선언을 수식하므로, 한국어에서는 비교절을 앞에 두어 연결하는 편이 의미 관계를 더 정확하고 분명하게 드러냅니다.
  naturalness: 현 번역의 문장 끝 ‘말입니다’는 예전의 설명·강조 어조로 들리며, 예언적 심판 선언인 본문의 현대 합쇼체 문체에 자연스럽지 않습니다. 비교절을 앞세운 한 문장으로 고치면 자연스럽고 격식 있는 문장이 됩니다.
  terminology: ‘에브라임’, ‘자손’, ‘형제들’은 원문의 명칭과 친족 비유를 적절히 보존합니다. ‘내 앞에서 내쫓겠다’는 מֵעַל פָּנַי의 관계적·사법적 추방 의미를 무리 없이 전달합니다.
  issues:
  - severity: medium
    issue: 문장 종결의 ‘말입니다’
    rationale: 원문에는 설명적 종결이나 담화 표지가 없고, ‘말입니다’는 현대 성경 번역의 엄정한 예언 선언 문체에 어울리지 않습니다.
  - severity: low
    issue: 각주 a의 대안 표기
    rationale: 본문이 이미 ‘내 앞에서’인데 각주에서 ‘내 앞에서부터’를 대안으로 제시하는 것은 부자연스럽고 실질적 대안이 아닙니다. 히브리어의 직역과 가능한 의미를 간결하게 밝혀야 합니다.
  revised_text: 내가 너희의 모든 형제들, 곧 에브라임의 모든 자손을 내쫓은 것처럼, 너희를 내 앞에서 내쫓겠다[a].
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘내 얼굴 위로부터’입니다. ‘내 앞에서’ 또는 ‘내 임재에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 여기서 유다의 동족 이스라엘 사람들, 특히 북왕국 사람들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 여기서 에브라임은 북왕국 이스라엘을 가리킵니다.
    reason: cross_reference
  revision_rationale: 원문의 ‘내가 에브라임의 모든 자손 곧 너희 모든 형제들을 내쫓은 것처럼’이라는 비교를 한국어의 자연스러운 선행 비교절로 옮기고, 불필요한 설명적 종결을 제거했습니다. 에브라임과 형제들의 동격 관계, 그리고 하나님의 앞에서 내쫓는 심판 이미지는 유지했습니다.
