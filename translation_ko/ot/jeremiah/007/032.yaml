id: JER.7.32
reference: Jeremiah 7:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יֵאָמֵ֨ר ע֤וֹד הַ/תֹּ֨פֶת֙ וְ/גֵ֣יא בֶן הִנֹּ֔ם כִּ֖י אִם גֵּ֣יא הַ/הֲרֵגָ֑ה וְ/קָבְר֥וּ בְ/תֹ֖פֶת מֵ/אֵ֥ין מָקֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/032.yaml
  text: Therefore, look, days are coming, declares the LORD, when it will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter; and they will bury in Topheth because there is no place left.
translation:
  language: ko
  text: 그러므로 보십시오, 그 날들이 옵니다—주님께서 말씀하십니다—그때는 더 이상 그것을 도벳이나 힌놈의 아들 골짜기라고 부르지 않고, 학살의 골짜기라고 부를 것입니다. 그리고 묻을 곳이 없으므로 도벳에 매장할 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: לָכֵן / Therefore, look
  english_pob_choice: Therefore, look
  chosen_korean: 그러므로 보십시오
  alternatives_korean:
  - 그러므로 보라
  - 그러므로 보십시오
  lexicon: לכן
  rationale: מִקְדָם 연결어 לָכֵן은 인과를, הִנֵּה는 청자를 향한 주의 환기를 나타내므로 ‘그러므로’와 공손한 명령형 ‘보십시오’로 함께 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares the LORD
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 주님께서 선언하십니다
  lexicon: נאם יהוה
  rationale: 예언 공식을 한국어에서 자연스럽고 격식 있게 옮기기 위해 ‘말씀하십니다’를 택했고, 본문 주어는 본 프로젝트 기본값에 따라 야훼를 반영하되 여기서는 발표형 문장 흐름을 우선해 주님으로 표기했습니다.
- source_word: הַתֹּפֶת / וְגֵיא בֶן הִנֹּם
  english_pob_choice: Topheth and the Valley of Ben-hinnom
  chosen_korean: 도벳이나 힌놈의 아들 골짜기
  alternatives_korean:
  - 도벳과 힌놈의 아들 골짜기
  - 도벳과 벤힌놈 골짜기
  lexicon: תפת / גיא בן הנם
  rationale: 지명 고유성은 유지하되, בן־הִנֹּם을 직역한 ‘힌놈의 아들 골짜기’로 이름의 뜻을 보존했습니다.
- source_word: גֵּיא הַהֲרֵגָה
  english_pob_choice: the Valley of Slaughter
  chosen_korean: 학살의 골짜기
  alternatives_korean:
  - 도살의 골짜기
  - 살육의 골짜기
  lexicon: הרגה
  rationale: הֲרֵגָה는 단순한 죽음이 아니라 폭력적 살해를 가리키므로, POB의 판단을 따라 ‘학살’로 강하게 옮겼습니다.
- source_word: מֵאֵין מָקוֹם
  english_pob_choice: because there is no place left
  chosen_korean: 묻을 곳이 없으므로
  alternatives_korean:
  - 더는 자리가 없으므로
  - 남은 곳이 없으므로
  lexicon: אין מקום
  rationale: 문맥상 단순한 공간 부재가 아니라 매장을 위한 자리 부족이므로, 뒤 동사 ‘매장할 것입니다’와 결속되도록 풀어 옮겼습니다.
theological_decisions:
- issue: 야훼 신명호칭과 한국어 예언 공식의 가시성
  chosen_reading: 본문의 직접 발화는 예언자적 선언으로 자연스럽게 읽히도록 ‘주님께서 말씀하십니다’로 처리했습니다.
  alternative_readings:
  - 야훼께서 말씀하십니다
  - 주님께서 선언하십니다
  rationale: 독자가 예언 공식을 즉시 인지하도록 하면서도, 한국어 문체에서 지나치게 각진 표현을 피했습니다.
  doctrine_reference: 예언서의 신탁 서술 관례
- issue: ‘학살’의 강도 유지
  chosen_reading: גֵּיא הַהֲרֵגָה를 완화하지 않고 ‘학살의 골짜기’로 유지했습니다.
  alternative_readings:
  - 살육의 골짜기
  - 도살의 골짜기
  rationale: 본문은 지명 개명으로 다가오는 심판의 폭력을 강조하므로, 윤리적·정서적 충격을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 예레미야의 심판 신탁
