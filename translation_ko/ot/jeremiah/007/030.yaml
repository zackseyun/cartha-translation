  source_fidelity: 마지막 부정사 לְטַמְּאוֹ는 ‘더럽히기 위하여/더럽히려고’라는 목적을 나타내는데, 초안의 ‘더럽혔습니다’는 이를 별도의 완료된 결과 진술로 바꾸었습니다. 이를 목적 표현으로 바로잡아야 합니다. נְאֻם יְהוָה도 야훼의 직접 선언임을 자연스러운 현대 합쇼체로 표시하는 편이 적절합니다.
  naturalness: ‘야훼의 말씀이니라’는 현대 표준어 합쇼체보다 문어적·고어적이며, 앞 문장과 분리되어 읽힙니다. ‘야훼께서 말씀하십니다’가 현대적이고 예언자적 선언 공식에 자연스럽습니다. ‘내가 보기에 악을 행하였습니다’는 히브리어 관용구를 한국어에서 더 자연스럽게 재현합니다.
  terminology: ‘유다의 아들들’은 지나치게 직역투이므로 친족 집단을 뜻하는 히브리어 표현에 맞게 ‘유다 자손’으로 다듬었습니다. שִׁקּוּצֵיהֶם는 우상으로 한정하지 않은 ‘가증한 것들’을 유지하고, יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다.
