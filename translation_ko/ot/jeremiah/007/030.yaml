revisions:
- from: 유다의 아들들이 내 눈앞에서 악한 일을 저질렀습니다. 야훼의 말씀이니라. 그들은 내 이름으로 불리는 집에 자기들의 가증한 것들을 두어 그것을 더럽혔습니다.[a][b][c]
  to: 유다 자손이 내가 보기에 악을 행하였습니다. 야훼께서 말씀하십니다. 그들은 내 이름으로 불리는 집[b][c]에 자기들의 가증한 것들[a]을 두어 그것을 더럽히려고 하였습니다.
  rationale: 히브리어 원문을 우선하여 לְטַמְּאוֹ의 목적 관계를 ‘더럽히려고 하였습니다’로 회복했습니다. נְאֻם יְהוָה는 현대 합쇼체에 맞게 ‘야훼께서 말씀하십니다’로 옮겼습니다. ‘유다 자손’, ‘내가 보기에 악을 행하였습니다’, ‘가증한 것들’은 원문의 집단 표현, 평가 관용구, 넓은 제의적 혐오 대상의 의미를 유지합니다. 각주 표지도 해당 표현에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:56Z'
