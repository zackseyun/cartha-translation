id: JER.7.30
reference: Jeremiah 7:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עָשׂ֨וּ בְנֵי יְהוּדָ֥ה הָ/רַ֛ע בְּ/עֵינַ֖/י נְאֻום יְהוָ֑ה שָׂ֣מוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/030.yaml
  text: For the sons of Judah have done what is evil in my sight[a], declares Yahweh. They have put their abominations in the house that is called by my name[c][b], to defile it.
  footnotes:
  - marker: a
    text: Or “their abominations”; the Hebrew term often refers to abhorrent cult objects, likely including idols here.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple in Jerusalem.
    reason: cultural_note
  - marker: c
    text: Literally, “the house over which my name is called.”
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 아들들이 내 눈앞에서 악한 일을 저질렀습니다. 야훼의 말씀이니라. 그들은 내 이름으로 불리는 집에 자기들의 가증한 것들을 두어 그것을 더럽혔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들의 가증한 것들’을 뜻할 수 있으며, 문맥상 우상적 제의 물건들을 포함할 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 예루살렘 성전입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 “내 이름이 그 위에 불리는 집”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יְהוּדָה
  english_pob_choice: the sons of Judah
  chosen_korean: 유다의 아들들
  alternatives_korean:
  - 유다 백성
  - 유다 사람들
  lexicon: HALOT
  rationale: 히브리어 친족 표현을 살리되 한국어에서 자연스럽게 읽히는 소유격 형태로 옮겼습니다.
- source_word: הָרַע בְּעֵינַי
  english_pob_choice: what is evil in my sight
  chosen_korean: 내 눈앞에서 악한 일
  alternatives_korean:
  - 내 보기에 악한 것
  - 내 앞에서 악한 것
  lexicon: HALOT
  rationale: ‘눈앞에서’는 하나님의 평가를 나타내는 관용구를 비교적 직접적으로 살리며, ‘악한 일’은 문맥상 행위의 성격을 분명히 합니다.
- source_word: שִׁקּוּצֵיהֶם
  english_pob_choice: their abominations
  chosen_korean: 자기들의 가증한 것들
  alternatives_korean:
  - 그들의 가증물
  - 그들의 우상들
  lexicon: HALOT
  rationale: 이 단어는 우상적 물건을 포함할 수 있지만 더 넓게 혐오스러운 종교적 대상들을 가리킬 수 있어, 좁혀서 ‘우상들’로 번역하지 않고 ‘가증한 것들’로 유지했습니다.
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  english_pob_choice: the house that is called by my name
  chosen_korean: 내 이름으로 불리는 집
  alternatives_korean:
  - 내 이름이 불리는 집
  - 내 이름이 그 위에 불린 집
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 한국어에서 자연스럽게 풀어, 성전임을 본문 내부에서 이해할 수 있게 했습니다.
- source_word: לְטַמְּאֹו
  english_pob_choice: to defile it
  chosen_korean: 그것을 더럽혔습니다
  alternatives_korean:
  - 그것을 부정하게 했습니다
  - 그것을 더럽히기 위해
  lexicon: HALOT
  rationale: 완료형의 서술을 살려 결과를 말하는 동사로 옮겼으며, 의례적·도덕적 오염을 함께 담는 ‘더럽혔습니다’를 선택했습니다.
theological_decisions:
