id: JER.7.33
reference: Jeremiah 7:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה נִבְלַ֨ת הָ/עָ֤ם הַ/זֶּה֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/033.yaml
  text: The corpses of this people will become food for the birds of the heavens and for the beasts of the earth[a], with no one to frighten them away.
  footnotes:
  - marker: a
    text: Or 'the carcass of this people ... and none will frighten them.' The Hebrew singular 'corpse/carcass' can function collectively, and the final clause leaves the object implied.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 백성의 시체는 하늘의 새와 땅의 짐승의 먹이가 될 것이며, 그것들을 쫓아낼 자가 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단수형 ‘시체/사체’는 집합적으로 쓰일 수 있으며, 마지막 구절은 그 대상을 직접 밝히지 않고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלַת
  english_pob_choice: the corpses
  chosen_korean: 시체는
  alternatives_korean:
  - 시체들이
  - 송장들은
  - 사체는
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 집합적으로 쓰일 수 있어 한국어에서도 단수형 명사로 집합적 의미를 살렸습니다. '시체'가 '송장'보다 현대 합쇼체 문맥에 자연스럽고, 심판의 참혹함도 잘 드러냅니다.
- source_word: לְעֹוף הַשָּׁמַיִם / וּלְבֶהֱמַת הָאָרֶץ
  english_pob_choice: the birds of the heavens / the beasts of the earth
  chosen_korean: 하늘의 새들과 땅의 짐승들의
  alternatives_korean:
  - 하늘의 새들과 땅의 들짐승들의
  - 하늘의 새들과 땅의 동물들의
  lexicon: HALOT
  rationale: '''새''와 ''짐승''의 평행을 살리면서 ''하늘''과 ''땅''의 대조를 유지했습니다. ''하늘의 새''는 문학적이면서도 이해 가능하고, ''짐승''은 예언서 특유의 엄중한 어조를 보존합니다.'
- source_word: לְמַאֲכָל
  english_pob_choice: food
  chosen_korean: 먹이가
  alternatives_korean:
  - 음식이
  - 먹을 것이
  - 양식이
  lexicon: HALOT
  rationale: 사람의 음식이 아니라 날짐승과 짐승이 먹는 대상이라는 점을 드러내기 위해 '먹이'를 택했습니다. 이는 심판 이미지의 노골성을 살리고, 영어 POB의 'food'보다 한국어에서는 더 자연스럽게 들립니다.
- source_word: וְאֵין מַחֲרִיד
  english_pob_choice: with no one to frighten them away
  chosen_korean: 그것들을 쫓아낼 자가 없을 것입니다
  alternatives_korean:
  - 그들을 놀라게 할 자가 없을 것입니다
  - 그것들을 몰아낼 자가 없을 것입니다
  lexicon: HALOT
  rationale: חרד의 사역적 의미를 한국어로 직접 살려, 새와 짐승을 '쫓아내는' 뜻으로 옮겼습니다. 문맥상 쫓아낼 대상은 앞선 새와 짐승이므로 대명사 '그것들을'을 보충해 의미를 분명히 했습니다.
theological_decisions:
- issue: 예언적 미래 표현의 처리
  chosen_reading: 현재형 서술이 아니라 장차 일어날 심판의 결과를 나타내는 미래로 옮겼습니다.
  alternative_readings:
  - 시체가 되어 먹이가 됩니다
  - 시체가 되어 먹이로 됩니다
  rationale: וְהָיְתָה는 예언 문맥에서 결과적 미래를 나타내므로, 한국어에서도 종결미래를 사용해 하나님의 심판 선언의 선포성을 살렸습니다.
  doctrine_reference: 예언적 심판 선언의 완료성/확실성
- issue: 집합적 단수의 한국어 반영
  chosen_reading: 히브리어 단수형을 한국어에서 집합적으로 이해되도록 처리했습니다.
  alternative_readings:
  - 시체가
  - 시체들이
  rationale: 원문은 '백성의 시체'를 단수형으로 말하지만 집합적 의미가 강하므로, 한국어에서는 자연스러운 단수 집합명사 '시체'로 옮겨 원문의 범위를 유지했습니다.
  doctrine_reference: 히브리어 집합적 단수
