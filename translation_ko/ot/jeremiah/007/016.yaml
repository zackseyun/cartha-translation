revisions:
- from: 하지만 당신은 이 백성을 위하여 기도하지 말고, 그들을 위하여 부르짖음이나 기도를 올려도 되지 않으며, 나에게 간구하지도 마십시오. 나는 당신의 말을 듣지 않겠습니다.[a][b]
  to: 그러나 당신은 이 백성을 위하여 기도하지 말고, 그들을 위하여 부르짖음과 기도를 올리지 말며, 나에게 간청하지도 마십시오.[a] 내가 당신의 말을 듣고 있지 않기 때문입니다.[b]
  rationale: 본문의 세 금지 명령을 직접적이고 병렬적인 합쇼체로 정비했습니다. 마지막 현재분사형은 본문에서 ‘듣고 있지 않다’로 반영하고 미래적 번역은 각주에 보존했습니다. 간청/중보 관련 어휘 대안 및 분사 관련 각주를 해당 본문 어구에 정확히 연결했습니다.
