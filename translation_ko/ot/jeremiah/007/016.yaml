id: JER.7.16
reference: Jeremiah 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אַל תִּתְפַּלֵּ֣ל בְּעַד הָ/עָ֣ם הַ/זֶּ֗ה וְ/אַל תִּשָּׂ֧א בַעֲדָ֛/ם רִנָּ֥ה וּ/תְפִלָּ֖ה וְ/אַל תִּפְגַּע בִּ֑/י כִּי אֵינֶ֥/נִּי שֹׁמֵ֖עַ אֹתָֽ/ךְ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/016.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, and do not intercede with me[b], for I am not listening to you.
  footnotes:
  - marker: a
    text: Or 'do not entreat me' / 'do not press me'; the Hebrew verb can carry the sense of urgent pleading or intercession.
    reason: lexical_alternative
  - marker: b
    text: Or 'for I will not hear you.' The Hebrew may be rendered with a future sense, though the participial form also supports 'I am not listening to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신은 이 백성을 위하여 기도하지 말고, 그들을 위하여 부르짖음과 기도를 올리지 말며, 나에게 간청하지도 마십시오.[a] 내가 당신의 말을 듣고 있지 않기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나에게 중보하지도 마십시오’, ‘나에게 간구하지도 마십시오’. 히브리어 동사는 절박하게 간청하거나 중보한다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 당신의 말을 듣지 않겠습니다’. 히브리어의 현재분사형은 ‘듣고 있지 않다’처럼 지속적인 의미로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But as for you
  chosen_korean: 하지만 당신은
  alternatives_korean:
  - 그리고 당신은
  - 그런데 당신은
  lexicon: HALOT
  rationale: 대조적 전환을 드러내기 위해 역접 ‘하지만’을 사용했고, 예언자에게 직접 초점을 두는 독립 대명사는 ‘당신은’으로 옮겼습니다.
- source_word: תִּתְפַּלֵּל
  english_pob_choice: do not pray
  chosen_korean: 기도하지 말고
  alternatives_korean:
  - 기도해서는 안 되고
  - 기도드리지 말고
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지문을 자연스러운 한국어 명령형 금지로 옮겼습니다.
- source_word: רִנָּה וּתְפִלָּה
  english_pob_choice: a cry or prayer
  chosen_korean: 부르짖음이나 기도
  alternatives_korean:
  - 외침이나 기도
  - 간구나 기도
  lexicon: HALOT
  rationale: רִנָּה의 소리 높여 부르짖는 뜻을 살리되, 예배적 용어로 좁아지지 않도록 ‘부르짖음’을 택했습니다. וּתְפִלָּה는 상투적인 ‘기도’로 옮겼습니다.
- source_word: תִּפְגַּע בִּי
  english_pob_choice: do not intercede with me
  chosen_korean: 나에게 간구하지도 마십시오
  alternatives_korean:
  - 나에게 중보하지도 마십시오
  - 나에게 간청하지도 마십시오
  lexicon: HALOT
  rationale: פגע의 문맥상 의미를 직접적인 중보 행위로 이해했지만, 한국어에서는 ‘간구하다’가 하나님께 드리는 탄원과 중재 요청을 함께 담아 가장 자연스럽습니다.
theological_decisions:
- issue: 하나님이 예레미야의 중보를 금지하시는 어조
  chosen_reading: 현재 심판 국면에서 유다를 위한 중보가 실제로 금지된 것으로 번역했습니다.
  alternative_readings:
  - 과장된 경고로만 읽는 해석
  - 조건적 제한으로 완화하는 해석
  rationale: 반복되는 금지문과 ‘나는 당신의 말을 듣지 않겠습니다’가 이 장면의 단호함을 보여 주므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
