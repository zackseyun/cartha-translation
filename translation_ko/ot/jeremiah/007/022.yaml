source:
  edition: WLC
  text: כִּ֠י לֹֽא דִבַּ֤רְתִּי אֶת אֲבֽוֹתֵי/כֶם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם בְּ/י֛וֹם הוציא אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם עַל דִּבְרֵ֥י עוֹלָ֖ה וָ/זָֽבַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/022.yaml
  text: For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice[a][b][c].
  footnotes:
  - marker: a
    text: Or, 'about burnt offerings and sacrifice.' The verse likely uses prophetic rhetoric to stress that obedience, not ritual sacrifice, was God's central covenant demand; compare the next verse.
    reason: lexical_alternative
  - marker: b
    text: This is not necessarily a denial that sacrificial laws were ever given, but a forceful contrast in emphasis within the prophetic context.
    reason: cross_reference
  - marker: c
    text: Or 'For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 너희 조상들에게, 너희를 이집트 땅에서 인도하여 내던 날에, 번제와 희생제물에 관하여 말하지도 않았고 명령하지도 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘번제와 희생제물에 관하여’로 옮겼습니다. 히브리어 עַל דִּבְרֵי는 ‘~에 대하여/~관하여’의 주제 표지를 나타냅니다.
    reason: source_note
  - marker: b
    text: 이 표현은 제사 자체의 완전한 부정이라기보다, 언약의 중심 요구가 제의보다 순종에 있었음을 강조하는 예언자적 수사로 이해할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 내가
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 문맥상 앞선 책망을 받쳐 주는 근거를 제시하는 말이지만, 한국어에서는 문장 시작을 매끄럽게 하면서도 진술의 직접성을 살리기 위해 주어를 앞세운 평서문으로 옮겼습니다.
- source_word: לֹא דִבַּרְתִּי
  english_pob_choice: I did not speak
  chosen_korean: 말하지도 않았고
  alternatives_korean:
  - 말하지 않았고
  - 이야기하지도 않았고
  lexicon: HALOT
  rationale: דבר의 기본 의미를 직접 살리되, 뒤의 ‘명령하지도 않았고’와 평행을 이루도록 부정 반복 구조로 옮겼습니다.
- source_word: אֶת אֲבוֹתֵיכֶם
  english_pob_choice: to your fathers
  chosen_korean: 너희 조상들에게
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 자연스럽고 오해가 적게 전달하기 위해 ‘조상들’로 옮겼습니다. 문자적 ‘아버지들’은 한국어에서 부자 관계로 오독될 수 있습니다.
- source_word: וְלֹא צִוִּיתִים
  english_pob_choice: or command them
  chosen_korean: 명령하지도 않았고
  alternatives_korean:
  - 지시하지도 않았고
  - 명하지도 않았고
  lexicon: HALOT
  rationale: צוה는 규범적·권위적 명령을 뜻하므로 ‘명령하다’가 가장 직접적입니다. 앞절과 나란히 두어 수사적 부정을 유지했습니다.
- source_word: עַל דִּבְרֵי
  english_pob_choice: concerning
  chosen_korean: 관하여
  alternatives_korean:
  - 대하여
  - 에 대해
  lexicon: HALOT
  rationale: 전치사 עַל이 제시하는 주제 범위를 한국어에서 간결하게 표시하는 표준적인 대응으로 옮겼습니다.
- source_word: עוֹלָה וָזָבַח
  english_pob_choice: burnt offering and sacrifice
  chosen_korean: 번제와 희생제물
  alternatives_korean:
  - 번제와 제사
  - 번제와 제물
  lexicon: HALOT
  rationale: עוֹלָה는 정해진 제의 용어인 ‘번제’로, זבח는 단순한 ‘희생’보다 제의적 희생물의 성격을 드러내는 ‘희생제물’로 옮겨 대조를 분명히 했습니다.
theological_decisions:
- issue: 이 구절이 제사 규정을 전면 부정하는 듯한 긴장을 어떻게 보존할지
  chosen_reading: 본문의 부정 진술을 완화하지 않고 그대로 옮겨, 하나님이 출애굽 직후 번제와 희생제물에 관하여 말하거나 명령하지 않으셨다고 표현했습니다.
  alternative_readings:
  - ‘주로’나 ‘무엇보다’ 같은 해석어를 넣어 우선순위의 뜻으로 풀기
  - 본문에서 제의 자체를 암시적으로 제한하는 조정
  rationale: 예언자적 수사의 날카로움을 번역 본문에서 유지해야 하므로, 문맥적 조화는 주해에서 다루고 본문은 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
