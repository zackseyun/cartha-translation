  source_fidelity: 핵심 의미는 대체로 충실합니다. נִזְרֵךְ을 ‘머리카락’으로 옮긴 것은 ‘자르다’와 ‘내버리다’라는 명령의 문맥에 잘 맞으며, 각주로 ‘관’의 가능성을 보존한 점도 적절합니다. 다만 עַל שְׁפָיִם은 복수형이므로 ‘민둥한 언덕들에서’가 더 충실합니다.
