id: JER.7.29
reference: Jeremiah 7:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּזִּ֤י נִזְרֵ/ךְ֙ וְֽ/הַשְׁלִ֔יכִי וּ/שְׂאִ֥י עַל שְׁפָיִ֖ם קִינָ֑ה כִּ֚י מָאַ֣ס יְהוָ֔ה וַ/יִּטֹּ֖שׁ אֶת דּ֥וֹר עֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/029.yaml
  text: Cut off your hair and throw it away[a], and raise a lament on the bare heights[b], for Yahweh has rejected and abandoned the generation of his wrath.
  footnotes:
  - marker: a
    text: Or 'your crown.' The Hebrew noun can refer to consecration, a crown/diadem, or hair associated with consecration; here the commands 'cut off' and 'throw it away' favor the sense of consecrated hair.
    reason: lexical_alternative
  - marker: b
    text: Or 'the generation under his wrath.' The Hebrew is literally 'the generation of his wrath.'
    reason: alternative_reading
translation:
  language: ko
  text: 네 머리카락을 잘라 내버리고[a], 민둥한 언덕들에서 애가를 부르십시오[b]. 야훼께서 그의 진노의 세대를 거절하시고 버리셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 왕관’ 또는 ‘네 면류관’. 히브리어 명사는 구별된 헌신, 왕관/면류관, 또는 헌신과 관련된 머리카락을 가리킬 수 있습니다. 여기서는 ‘자르다’와 ‘내버리다’라는 동사가 함께 나오므로 헌신의 표지인 머리카락이라는 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 진노 아래 있는 세대’. 히브리어는 문자적으로 ‘그의 진노의 세대’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּזִּי נִזְרֵךְ וְהַשְׁלִיכִי
  english_pob_choice: Cut off your hair and throw it away
  chosen_korean: 네 머리카락을 잘라 버리고 버리며
  alternatives_korean:
  - 네 머리를 깎아 버리고 버리며
  - 네 머리카락을 잘라서 내던지고
  lexicon: HALOT
  rationale: 명령형 여성 단수의 연속 동작을 한국어에서도 자연스럽게 살리기 위해 ‘잘라 버리고’와 ‘버리며’로 옮겼습니다. 다만 נזר의 의미상 ‘머리카락’으로 옮겨 문맥의 상징성을 드러냈습니다.
- source_word: עַל שְׁפָיִם
  english_pob_choice: on the bare heights
  chosen_korean: 민둥한 언덕에서
  alternatives_korean:
  - 벌거벗은 높은 곳에서
  - 황량한 산당에서
  - 민둥한 곳에서
  lexicon: HALOT
  rationale: שְׁפָיִם의 ‘드러난/민둥한 높이들’이라는 뜻을 따라, 자연스럽고 현대적인 한국어로 ‘민둥한 언덕’이라 옮겼습니다. ‘산당’은 예배 장소로 좁혀질 수 있어 피했습니다.
- source_word: קִינָה
  english_pob_choice: a lament
  chosen_korean: 애곡을 외치십시오
  alternatives_korean:
  - 애가를 부르십시오
  - 한탄을 외치십시오
  - 조가를 부르십시오
  lexicon: HALOT
  rationale: קִינָה는 단순한 슬픔이 아니라 공개적인 애가/곡조를 가리키므로, 동사와 결합해 ‘애곡을 외치십시오’로 옮겨 장송적·예언적 울부짖음을 살렸습니다.
- source_word: דּוֹר עֶבְרָתֽוֹ
  english_pob_choice: the generation of his wrath
  chosen_korean: 그의 진노의 세대
  alternatives_korean:
  - 그의 분노의 세대
  - 그 진노 아래 있는 세대
  - 그의 격분의 세대
  lexicon: HALOT
  rationale: 히브리어의 간명하고 강한 소유격 구조를 유지하기 위해 ‘그의 진노의 세대’로 직역에 가깝게 옮겼습니다. ‘세대 아래 있는’처럼 완화하면 예언의 날카로움이 약해집니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 그대로의 신명 표기를 살려, 공용 경칭이 아닌 고유명사 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: נִזְרֵךְ의 의미 범주
  chosen_reading: ‘머리카락’으로 옮기되, 예배적 구별을 상실한 표지라는 함의를 유지했습니다.
  alternative_readings:
  - ‘왕관’
  - ‘나실인 머리카락’
  - ‘성별된 머리카락’
  rationale: 이 절은 ‘자르다’와 ‘버리다’가 결합되어 있어 실제로 잘려 내지는 대상이 머리카락임이 가장 분명합니다. 동시에 נזר의 어휘적 배경이 내포하는 구별/헌신의 상실은 번역 전체의 맥락에서 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
- issue: 예언적 명령문의 문체
  chosen_reading: 직접 명령을 현대 한국어 존댓말로 옮기되, 대상이 예루살렘인 점을 반영해 ‘하십시오’ 체를 사용했습니다.
  alternative_readings:
  - 반말형 명령
  - 더 경건한 고전어체
  rationale: 히브리어의 여성 단수 명령형은 도시/딸 시온에게 직접 말하는 수사이므로, 현대 한국어에서도 직접성과 긴박감을 살리는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
