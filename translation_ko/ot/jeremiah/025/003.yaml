  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 고유명사 ‘야훼’로 옮겨, 언약명의 직접성을 보존했습니다.
- source_word: אַשְׁכֵּים וְדַבֵּר
  english_pob_choice: rising early and speaking
  chosen_korean: 계속 이른 아침부터 말했지만
