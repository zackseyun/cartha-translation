  - 부지런히 말했지만
  lexicon: HALOT
  rationale: 직역 이미지가 아니라 반복적·집요한 선포의 관용구를 한국어에서 드러내기 위해 ‘계속 이른 아침부터’로 옮겼고, 본문의 행위 동사 ‘말하다’는 유지했습니다.
- source_word: וְלֹא שְׁמַעְתֶּם
  english_pob_choice: but you have not listened
  chosen_korean: 여러분은 듣지 않았습니다
  alternatives_korean:
  - 여러분은 귀를 기울이지 않았습니다
  - 여러분은 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע의 기본 청취 의미를 살리면서도, 문맥상 불순종이 함축되는 긴장을 과도하게 해석하지 않도록 ‘듣지 않았습니다’로 번역했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
