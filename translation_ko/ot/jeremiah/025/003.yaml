  lexicon: HALOT
  rationale: 유다 왕의 재위 연차를 가리키는 표현이므로 ‘십삼년’으로 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
