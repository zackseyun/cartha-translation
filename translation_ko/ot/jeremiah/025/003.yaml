  text: מִן שְׁלֹ֣שׁ עֶשְׂרֵ֣ה שָׁנָ֡ה לְ/יֹאשִׁיָּ֣הוּ בֶן אָמוֹן֩ מֶ֨לֶךְ יְהוּדָ֜ה וְ/עַ֣ד הַ/יּ֣וֹם הַ/זֶּ֗ה זֶ֚ה שָׁלֹ֤שׁ וְ/עֶשְׂרִים֙ שָׁנָ֔ה הָיָ֥ה דְבַר יְהוָ֖ה אֵלָ֑/י וָ/אֲדַבֵּ֧ר אֲלֵי/כֶ֛ם אַשְׁכֵּ֥ים וְ/דַבֵּ֖ר וְ/לֹ֥א שְׁמַעְתֶּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/003.yaml
  text: From the thirteenth year of Josiah son of Amon[a], king of Judah, even to this day, these twenty-three years, the word of Yahweh has come to me, and I have spoken to you, rising early and speaking, but you have not listened.
  footnotes:
  - marker: a
    text: Literally, 'rising early and speaking,' a Hebrew idiom for persistent, repeated action.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 요시야의 아들 아몬의 십삼년부터 오늘에 이르기까지, 곧 이십삼 년 동안 야훼의 말씀이 내게 임하였고, 나는 여러분에게 계속 이른 아침부터 말했지만 여러분은 듣지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘이른 아침에 일어나 말하다’이지만 반복적이고 끈질긴 행위를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן ... וְעַד הַיּוֹם הַזֶּה
  english_pob_choice: From ... even to this day
  chosen_korean: '...부터 오늘에 이르기까지'
  alternatives_korean:
  - '...부터 이 날까지'
  - '...부터 지금까지'
  lexicon: HALOT
  rationale: 시작점에서 현재 기준점까지의 시간 범위를 자연스럽게 살리되, הַיּוֹם הַזֶּה의 지시성을 유지했습니다.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: the thirteenth year
  chosen_korean: 십삼년
  alternatives_korean:
  - 13년째 되는 해
  - 열세 번째 해
  lexicon: HALOT
  rationale: 유다 왕의 재위 연차를 가리키는 표현이므로 ‘십삼년’으로 간결하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 고유명사 ‘야훼’로 옮겨, 언약명의 직접성을 보존했습니다.
- source_word: אַשְׁכֵּים וְדַבֵּר
  english_pob_choice: rising early and speaking
  chosen_korean: 계속 이른 아침부터 말했지만
  alternatives_korean:
  - 이른 아침에 일어나 말했지만
  - 부지런히 말했지만
  lexicon: HALOT
  rationale: 직역 이미지가 아니라 반복적·집요한 선포의 관용구를 한국어에서 드러내기 위해 ‘계속 이른 아침부터’로 옮겼고, 본문의 행위 동사 ‘말하다’는 유지했습니다.
- source_word: וְלֹא שְׁמַעְתֶּם
  english_pob_choice: but you have not listened
  chosen_korean: 여러분은 듣지 않았습니다
  alternatives_korean:
  - 여러분은 귀를 기울이지 않았습니다
  - 여러분은 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע의 기본 청취 의미를 살리면서도, 문맥상 불순종이 함축되는 긴장을 과도하게 해석하지 않도록 ‘듣지 않았습니다’로 번역했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 하나님의 고유명을 사용하므로, 전통적 대체표현보다 이름 자체를 드러내는 번역이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אַשְׁכֵּים וְדַבֵּר의 관용구 처리
  chosen_reading: ‘계속 이른 아침부터 말했습니다’로 반복성과 긴박성을 드러냈습니다.
  alternative_readings:
  - ‘이른 아침에 일어나 말했습니다’
  - ‘거듭 말했습니다’
  rationale: 히브리어 관용구의 핵심은 시간대 자체보다 끈질긴 반복 선포이므로, 한국어 본문에서는 그 의미를 자연스럽게 드러내면서 원문의 긴장도는 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve significant lexical decisions'
