lexical_decisions:
- source_word: פַּרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 바로
  alternatives_korean:
  - 파라오
  lexicon: HALOT
  rationale: 고유한 왕호로서 한국어 성경에서 널리 쓰이는 음역형 '바로'를 사용해 인물의 호칭성을 살렸습니다.
- source_word: מֶלֶךְ מִצְרַיִם
  english_pob_choice: king of Egypt
  chosen_korean: 애굽 왕
  alternatives_korean:
  - 이집트 왕
  - 애굽의 왕
  lexicon: HALOT
  rationale: 히브리어의 관형 관계를 자연스러운 한국어 명사구로 옮겨 바로의 지위를 분명히 했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 하인들
  lexicon: HALOT
  rationale: 궁정 명단 문맥에서 עבד의 광의적 의미를 살려, 단순한 사역자보다 왕실에 속한 신하들로 이해되도록 했습니다.
- source_word: שָׂרָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 대신들
  - 그의 방백들
  - 그의 지도자들
  lexicon: HALOT
  rationale: שַׂר의 통치·행정적 의미를 현대 한국어에서 가장 분명하게 전달하는 표현을 택했습니다.
- source_word: כָּל עַמּוֹ
  english_pob_choice: all his people
  chosen_korean: 그의 모든 백성
  alternatives_korean:
  - 그의 온 백성
  - 그의 모든 ժողովուրդ
  lexicon: HALOT
  rationale: כָּל의 포괄성을 살리면서 עַם의 집합적 의미를 현대적으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예언 심판 목록의 문장 종결 방식
  chosen_reading: 한국어에서는 열거형 예언 목록이므로 종결어미를 붙이지 않고 말줄임표로 이어지는 구조를 유지했습니다.
  alternative_readings:
  - 종결형 문장으로 마무리하기
  - 완전한 마침표로 끝내기
  rationale: 원문이 다음 절로 이어지는 심판 대상 열거의 일부이므로, 문장 종결을 약화하지 않으면서 목록의 개방성을 보존했습니다.
  doctrine_reference: 문맥 보존과 예언 문체 재현
- issue: 바로 왕호의 음역
  chosen_reading: '''바로''를 사용해 고유 왕호로 처리했습니다.'
  alternative_readings:
  - '''파라오''로 음역하기'
  - '''애굽 왕''만 남기기'
  rationale: 히브리어 פַּרְעֹה는 인물명이라기보다 이집트 왕호이므로, 한국어 성경 전통과 가독성을 모두 고려한 음역을 택했습니다.
  doctrine_reference: 역사 서술의 고유명사 처리
