  - 유다의 여러 성읍들
  lexicon: HALOT
  rationale: 히브리어 소유 관계를 자연스러운 현대 한국어로 옮기되, 도시보다 성읍이 예언서의 도시 집합을 더 잘 반영합니다.
- source_word: מְלָכֶיהָ / שָׂרֶיהָ
  english_pob_choice: her kings, and her officials
  chosen_korean: 그 왕들, 그리고 그 관리들
  alternatives_korean:
  - 그 왕들, 그리고 그 지도자들
  - 그 왕들, 그리고 그 방백들
  lexicon: HALOT
  rationale: 의미상 연속된 정치 엘리트 목록이므로, '관리들'이 현대 독자에게 가장 분명하며 왕과 병렬을 이룹니다. 여성 인칭 소유는 한국어에서 문맥상 '그'로 처리했습니다.
- source_word: לְחָרְבָּה לְשַׁמָּה לִשְׁרֵקָה וְלִקְלָלָה
  english_pob_choice: to make them a ruin, a horror, a hissing, and a curse
  chosen_korean: 황폐함과 공포와 쉿소리와 저주가 되게 하려는 것입니다
  alternatives_korean:
  - 폐허와 공포와 조롱과 저주가 되게 하려는 것입니다
  - 황폐와 놀람과 휘파람과 저주가 되게 하려는 것입니다
  lexicon: HALOT
  rationale: 명사 연쇄의 병렬을 살리면서 각 항목의 감각적·예언적 힘을 유지했습니다. '쉿소리'는 derisive hissing/whistling의 소리를 직접적으로 드러냅니다.
- source_word: כַּיּוֹם הַזֶּה
  english_pob_choice: as it is this day
  chosen_korean: 오늘 이 날과 같이
  alternatives_korean:
  - 이 날과 같이
  - 오늘날과 같이
  lexicon: HALOT
  rationale: 현재의 실제 상태를 가리키는 관용구로서, '오늘 이 날'이 증거적·지시적 뉘앙스를 보존합니다.
theological_decisions:
- issue: 도시와 주민을 가리키는 여성형 대명사 처리
  chosen_reading: 한국어에서는 예루살렘/유다를 여성 인칭으로 반복하기보다 문맥상 '그'로 통일해 읽기 부담을 줄였습니다.
  alternative_readings:
  - 그녀의 왕들, 그녀의 관리들
  - 그것의 왕들, 그것의 관리들
  rationale: 히브리어의 의인화를 과도하게 옮기면 한국어가 부자연스러워질 수 있으므로, 예언 시문의 병렬성과 의미를 우선했습니다.
  doctrine_reference: 문체·담화 처리 원칙
