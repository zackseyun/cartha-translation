  yaml_path: translation/ot/jeremiah/025/018.yaml
  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'an astonishment' for 'a horror.' The Hebrew term can emphasize the appalled reaction provoked by devastation.
    reason: lexical_alternative
  - marker: b
    text: Or 'a whistling.' The Hebrew refers to the derisive sound made by onlookers at a ruined place.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘과 유다의 성읍들과 그 왕들과 그 관리들을 폐허와 경악거리[a]와 조롱거리[b]와 저주의 대상이 되게 하였습니다. 오늘날과 같이 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경악’입니다. 히브리어는 황폐를 보고 사람들이 느끼는 경악을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘휘파람 소리’입니다. 히브리어는 황폐한 곳을 본 사람들이 조롱으로 내는 소리를 가리킵니다.
    reason: lexical_alternative
