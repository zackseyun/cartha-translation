source:
  edition: WLC
  text: אֶת יְרוּשָׁלִַ֨ם֙ וְ/אֶת עָרֵ֣י יְהוּדָ֔ה וְ/אֶת מְלָכֶ֖י/הָ אֶת שָׂרֶ֑י/הָ לָ/תֵ֨ת אֹתָ֜/ם לְ/חָרְבָּ֧ה לְ/שַׁמָּ֛ה לִ/שְׁרֵקָ֥ה וְ/לִ/קְלָלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/018.yaml
  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'an astonishment' for 'a horror.' The Hebrew term can emphasize the appalled reaction provoked by devastation.
    reason: lexical_alternative
  - marker: b
    text: Or 'a whistling.' The Hebrew refers to the derisive sound made by onlookers at a ruined place.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘[a], 유다의 성읍들, 그 왕들, 그리고 그 관리들을—그것들을 황폐함과 공포와 쉿소리와 저주[b]가 되게 하려는 것입니다. 오늘 이 날과 같이 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '놀라움'으로도 옮길 수 있습니다. 히브리어는 폐허를 본 사람들이 느끼는 경악을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '휘파람 소리'입니다. 히브리어는 황폐한 곳을 본 사람들이 조롱으로 내는 소리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 성
  lexicon: HALOT
  rationale: 지명은 음역을 따르며, 문맥상 별도의 설명어 없이도 충분히 식별됩니다.
- source_word: עָרֵי יְהוּדָה
  english_pob_choice: the cities of Judah
  chosen_korean: 유다의 성읍들
  alternatives_korean:
