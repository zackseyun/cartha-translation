  source_fidelity: 수정이 필요합니다. 히브리어의 לָתֵת אֹתָם은 앞 절에서 이어지는 행위의 결과로서 ‘그들을 … 되게 하였다’를 뜻합니다. 초안의 ‘… 되게 하려는 것입니다’는 본문의 완료된 서술 및 앞 절과의 연결을 목적·의도 진술로 바꿉니다. 또한 אֹתָם은 열거된 예루살렘, 성읍들, 왕들, 관리들을 가리키므로 ‘그것들’보다 ‘그들을’이 적절합니다.
  naturalness: ‘쉿소리’는 한국어에서 주의를 주거나 조용히 하라는 소리로 주로 이해되어, 폐허를 보고 내는 조롱의 소리라는 לִשְׁרֵקָה의 뜻을 자연스럽게 전달하지 못합니다. ‘조롱거리’로 옮기고 각주에서 휘파람/쉿 소리의 구체적 이미지를 밝혀 주는 것이 현대 표준어에 적합합니다. ‘오늘 이 날’도 부자연스러우므로 관용적으로 ‘오늘날과 같이’로 다듬습니다.
  terminology: ‘성읍들’, ‘왕들’, ‘관리들’은 적절합니다. לְחָרְבָּה는 ‘폐허’, לְשַׁמָּה는 황폐가 불러일으키는 경악의 대상이라는 의미로 ‘경악거리’, לִשְׁרֵקָה는 ‘조롱거리’, וְלִקְלָלָה는 ‘저주의 대상’으로 옮겨 병렬되는 결과를 보존했습니다. 영어 감사 기록의 각주는 각각 לְשַׁמָּה와 לִשְׁרֵקָה에 관한 것이므로, 초안처럼 ‘예루살렘’과 ‘저주’에 붙이지 않고 해당 표현에 붙여야 합니다.
