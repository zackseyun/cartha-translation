source:
  edition: WLC
  text: לֵ/אמֹ֗ר שֽׁוּבוּ נָ֞א אִ֣ישׁ מִ/דַּרְכּ֤/וֹ הָֽ/רָעָה֙ וּ/מֵ/רֹ֣עַ מַעַלְלֵי/כֶ֔ם וּ/שְׁבוּ֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/005.yaml
  text: saying[a], ‘Please turn back, each man from his evil way and from the evil of your deeds[b], and dwell in the land that Yahweh gave to you and to your fathers from of old and forever.’
  footnotes:
  - marker: a
    text: Or 'Return, please, each one from his evil way and from your evil deeds.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from of old and forever,' an idiom expressing the LORD's gift of the land across past and future time.
    reason: cultural_note
translation:
  language: ko
  text: 「말씀하시기를」, ‘부디 돌아오십시오. 각 사람은 자기 악한 길에서, 그리고 여러분의 악한 행실에서 돌이켜, 야훼께서 여러분과 여러분의 조상들에게 예로부터 영원까지 주신 땅에 거주하십시오.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아오십시오, 부디, 각 사람은 자기 악한 길에서, 그리고 여러분의 악한 행실에서.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, ‘예로부터 영원까지’는 여호와께서 그 땅을 주신 지속성을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 「말씀하시기를」
  alternatives_korean:
  - 말하기를
  - 이르시기를
  lexicon: HALOT
  rationale: 예언 전달의 도입구로서 화자 전환을 자연스럽게 표시하되, 내용 인용의 시작이라는 기능을 살리기 위해 ‘말씀하시기를’로 옮겼습니다.
- source_word: שׁוּבוּ נָא
  english_pob_choice: Please turn back
  chosen_korean: 부디 돌아오십시오
  alternatives_korean:
  - 돌아오십시오, 부디
  - 돌아오세요
  lexicon: HALOT
  rationale: שׁוּב는 회개적 ‘돌아오다/돌이키다’의 의미이므로, 간청을 나타내는 נָא를 ‘부디’로 반영했습니다.
- source_word: וּשְׁבוּ עַל הָאֲדָמָה
  english_pob_choice: and dwell in the land
  chosen_korean: 땅에 거주하십시오
  alternatives_korean:
  - 땅에 살십시오
  - 땅에 머무르십시오
  lexicon: HALOT
  rationale: יָשַׁב의 정착·거주의 뜻을 살려 ‘거주하다’로 옮겼고, אֲדָמָה를 실제 약속의 땅으로 이해해 ‘땅’으로 간결하게 표현했습니다.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  english_pob_choice: from of old and forever
  chosen_korean: 예로부터 영원까지
  alternatives_korean:
  - 옛적부터 영원까지
  - 영원부터 영원까지
  lexicon: HALOT
  rationale: 이 관용구는 과거와 미래를 가로지르는 지속성을 나타내므로, ‘예로부터 영원까지’로 시간적 양끝을 모두 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신적 고유명사는 직역적 관용어인 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: 민수적/대표적 호칭인 אִישׁ의 처리
  chosen_reading: ‘각 사람’으로 옮겨 남성 대표형을 유지했습니다.
  alternative_readings:
  - 각자
  - 각 사람마다
  - 모든 사람
  rationale: 히브리어 단수 분배형은 공동체 전체를 각 개인 단위로 부르는 표현이므로, 성별을 지우는 일반화보다 원문 구조를 살린 ‘각 사람’이 더 적절합니다.
  doctrine_reference: 원문 구조 보존 원칙
