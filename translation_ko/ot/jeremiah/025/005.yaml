- from: 「말씀하시기를」, ‘부디 돌아오십시오. 각 사람은 자기 악한 길에서, 그리고 여러분의 악한 행실에서 돌이켜, 야훼께서 여러분과 여러분의 조상들에게 예로부터 영원까지 주신 땅에 거주하십시오.’[a][b]
  to: 이렇게 말씀하셨습니다. ‘너희는 각자 자기의 악한 길과 너희 행실의 악에서 부디 돌이키십시오.[a] 그리고 야훼께서 너희와 너희 조상들에게 예로부터 영원까지[b] 주신 땅에 거주하십시오.’
  rationale: 원문의 권면적 어조(נָא), 분배적 호소(אִישׁ), 개인 단수와 집단 복수의 전환(‘자기의’/‘너희’)을 ‘너희는 각자 자기의 … 너희 …’로 재현했습니다. יָשַׁב의 정착 거주 의미는 ‘땅에 거주하십시오’로 유지했으며, 시간 관용구와 관련 각주의 위치 및 신명 표기를 정정했습니다.
