id: JER.25.6
reference: Jeremiah 25:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַל תֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וְ/לֹֽא תַכְעִ֤יסוּ אוֹתִ/י֙ בְּ/מַעֲשֵׂ֣ה יְדֵי/כֶ֔ם וְ/לֹ֥א אָרַ֖ע לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/006.yaml
  text: And do not go after other gods to serve them and to bow down to them[a], and do not provoke me to anger by the work of your hands[b], and I will do you no harm.
  footnotes:
  - marker: a
    text: Or, 'follow other gods.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and I will not bring disaster on you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다른 신들을 따라가서 그들을 섬기고 그들에게 엎드려 절하지 마십시오[a]. 또 여러분 손의 행위로 나를 격노하게 하지 마십시오. 그리고 내가 여러분에게 해를 끼치지 않겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다른 신들을 따르지 마십시오.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “내가 여러분에게 재앙을 내리지 않겠습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּלְכוּ אַחֲרֵי
  english_pob_choice: go after
  chosen_korean: 따라가
  alternatives_korean:
  - 뒤를 따라가
  - 따르다
  lexicon: HALOT
  rationale: 히브리어 관용구의 추적 이미지를 살리면서도 한국어에서 자연스럽게 순종·충성을 나타내도록 했습니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 외국 신들
  - 남의 신들
  lexicon: HALOT
  rationale: 문맥상 여호와가 아닌 신들을 직접 가리키므로 가장 직역적인 표현을 택했습니다.
- source_word: לְעָבְדָם וּלְהִשְׁתַּחֲוֹת לָהֶם
  english_pob_choice: to serve them and to bow down to them
  chosen_korean: 그들을 섬기고 그들에게 엎드려 절하지
  alternatives_korean:
  - 그들을 섬기고 그들에게 경배하지
  - 그들을 섬기고 그들 앞에 엎드리지
  lexicon: HALOT
  rationale: עבד와 השתחוה를 한국어에서 서로 구별되게 살려, ‘섬기다’와 ‘엎드려 절하다’로 분리했습니다.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  english_pob_choice: by the work of your hands
  chosen_korean: 여러분의 손으로 만든 것으로
  alternatives_korean:
  - 여러분 손의 일로
  - 여러분 손이 만든 것으로
  lexicon: HALOT
  rationale: 히브리어 관용구가 우상 제작을 가리키는 문맥을 반영해, 물건 자체를 드러내는 한국어로 풀었습니다.
- source_word: וְלֹא אָרַע לָכֶם
  english_pob_choice: and I will do you no harm
  chosen_korean: 내가 여러분에게 해를 끼치지 않을 것입니다
  alternatives_korean:
  - 내가 여러분에게 재앙을 내리지 않을 것입니다
  - 내가 여러분을 해치지 않을 것입니다
  lexicon: HALOT
  rationale: רעע의 의미를 ‘악을 행하다’로 오해하지 않도록, 이 문맥의 경고/보장 의미를 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: 마지막 절의 약속/경고 기능
  chosen_reading: 순종할 경우 여호와께서 해를 끼치지 않으신다는 보장으로 읽히도록 했습니다.
  alternative_readings:
  - 목적절처럼 ‘내가 여러분에게 해를 끼치지 않게 하려고’로 처리할 수 있음
  - ‘재앙을 내리지 않을 것입니다’로 더 명시적으로 옮길 수 있음
  rationale: 히브리어는 단순한 부정 진술이지만 문맥상 언약적 권면에 붙은 결과 진술로 기능합니다. 과도한 목적화는 피하면서도 독자가 뜻을 놓치지 않게 했습니다.
  doctrine_reference: 언약적 순종과 결과의 진술
