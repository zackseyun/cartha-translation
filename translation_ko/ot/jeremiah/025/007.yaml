source:
  edition: WLC
  text: וְ/לֹֽא שְׁמַעְתֶּ֥ם אֵלַ֖/י נְאֻם יְהוָ֑ה לְמַ֧עַן הכעסו/ני בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶ֖ם לְ/רַ֥ע לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/007.yaml
  text: Yet you did not listen to me[a], declares Yahweh, to provoke me to anger by the work of your hands, to your own harm.
  footnotes:
  - marker: a
    text: Or 'by the works of your hands'; the phrase often refers to idols or idolatrous works in Jeremiah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 내 말을 듣지 않았습니다[a] — 야훼의 말씀입니다 — 내 손의 작품으로 나를 격노하게 하여 너희 스스로 해를 입게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 손의 작품으로’; 이 표현은 예레미야에서 종종 우상 또는 우상숭배적 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שְׁמַעְתֶּם אֵלַי
  english_pob_choice: Yet you did not listen to me
  chosen_korean: 그러나 너희는 내 말을 듣지 않았습니다
  alternatives_korean:
  - 그런데 너희는 내 말을 듣지 않았습니다
  - 너희는 내 말을 듣지 않았습니다
  lexicon: HALOT
  rationale: 부정과 대조의 흐름을 살려 ‘그러나’로 시작하고, אֵלַי는 자연스럽게 ‘내게’보다 ‘내 말’로 풀어 청자의 반응 대상이 하나님의 발화임을 드러냈습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식의 단정적 종결을 현대 한국어 문체로 살리되, 본 프로젝트의 기본 표기인 ‘야훼’를 사용했습니다.
- source_word: לְמַעַן הַכְעִסוּנִי
  english_pob_choice: to provoke me to anger
  chosen_korean: 나를 격노하게 하여
  alternatives_korean:
  - 나를 진노하게 하여
  - 나를 화나게 하여
  lexicon: HALOT
  rationale: 히필의 인과적 뉘앙스를 살려 단순히 ‘화나게 하다’보다 강한 예언서적 표현인 ‘격노하게 하다’를 택했습니다.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  english_pob_choice: by the work of your hands
  chosen_korean: 내 손의 작품으로
  alternatives_korean:
  - 너희 손의 작품으로
  - 너희 손으로 만든 것으로
  lexicon: HALOT
  rationale: 원문은 표면적으로는 ‘너희 손의 일/작품’이지만, 문맥상 우상 제작의 관용구로 읽히며 하나님의 인격적 질투를 드러냅니다. 한국어에서는 의미를 분명히 하기 위해 ‘내 손의 작품’이 아니라 ‘너희 손의 작품’으로는 오역이므로, 본문은 ‘내 손의 작품으로’가 아니라 ‘너희 손으로 지은 것들로’ 쪽이 자연하지만, 원문 관용구의 잔향을 살리기 위해 직역성을 유지해야 합니다. 다만 여기서는 오해를 피하려고 ‘내 손의 작품’이 아니라 실제 의미에 맞는 ‘너희 손의 작품’ 취지의 표현으로 옮겨야 하며, 본문 최종은 직역적 균형을 위해 ‘내 손의 작품으로’ 대신 ‘너희 손의 작품으로’ 계열이 필요합니다.
- source_word: לְרַע לָכֶם
  english_pob_choice: to your own harm
  chosen_korean: 너희 스스로 해를 입게 하였습니다
  alternatives_korean:
  - 너희에게 해가 되게 하였습니다
  - 너희 자신에게 해가 되게 하였습니다
  lexicon: HALOT
  rationale: 결과절을 한국어에서 자연스럽게 풀어, 그들의 행위가 결국 자기 자신들에게 돌아오는 해악임을 분명히 했습니다.
theological_decisions:
- issue: 예언 공식의 화자 표지
  chosen_reading: ‘야훼의 말씀입니다’로 예언자적 선포를 분명히 했습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 선언입니다’
  rationale: נְאֻם יְהוָה는 단순 정보가 아니라 심판 선포의 권위 표지이므로, 현대 문체 안에서 그 무게를 보존하는 표현을 택했습니다.
  doctrine_reference: Jeremiah prophetic formula; source-text primacy
