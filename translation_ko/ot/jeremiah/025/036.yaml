id: JER.25.36
reference: Jeremiah 25:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֚וֹל צַעֲקַ֣ת הָֽ/רֹעִ֔ים וִֽ/ילְלַ֖ת אַדִּירֵ֣י הַ/צֹּ֑אן כִּֽי שֹׁדֵ֥ד יְהוָ֖ה אֶת מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/036.yaml
  text: The sound of the cry of the shepherds[a], and the wailing of the leaders of the flock[b], for Yahweh is devastating their pasture.
  footnotes:
  - marker: a
    text: Or 'the mighty ones of the flock' or 'the nobles of the flock.'
    reason: lexical_alternative
  - marker: b
    text: The shepherd/flock imagery likely refers metaphorically to rulers and those under their care.
    reason: cultural_note
translation:
  language: ko
  text: 목자들의 부르짖는 소리와 양 떼의 지도자들의 울부짖음이 들립니다. 이는 야훼께서 그들의 목장을 황폐하게 하시기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘양 떼의 지도자들’은 직역상 ‘양 떼의 강한 자들/귀인들’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 목자/양 떼 이미지는 문맥상 통치자들과 그들이 돌보는 백성을 가리키는 비유일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: ק֚וֹל צַעֲקַ֣ת
  english_pob_choice: The sound of the cry
  chosen_korean: 부르짖는 소리
  alternatives_korean:
  - 외침의 소리
  - 울부짖는 소리
  lexicon: HALOT
  rationale: קוֹל은 여기서 들리는 현상을 도입하고, צעק은 고통의 외침을 뜻하므로 합쳐서 자연스러운 한국어 관용인 ‘부르짖는 소리’로 옮겼습니다.
- source_word: הָרֹעִים
  english_pob_choice: the shepherds
  chosen_korean: 목자들의
  alternatives_korean:
  - 목양자들의
  - 양치는 이들의
  lexicon: HALOT
  rationale: 직역 이미지인 ‘shepherds’를 살려 ‘목자들’로 옮겨, 뒤의 양 떼 이미지와 연결되는 예언적 비유를 유지했습니다.
- source_word: אַדִּירֵי הַצֹּאן
  english_pob_choice: the leaders of the flock
  chosen_korean: 양 떼의 지도자들
  alternatives_korean:
  - 양 떼의 용사들
  - 양 떼의 귀인들
  lexicon: HALOT
  rationale: אַדִּירִים은 ‘강한 자들/귀인들/지도자들’의 뜻을 가지므로, 문맥상 비유적 통치층을 드러내는 ‘지도자들’이 가장 분명합니다.
- source_word: מַרְעִיתָם
  english_pob_choice: their pasture
  chosen_korean: 그들의 목장
  alternatives_korean:
  - 그들의 풀밭
  - 그들의 초장
  lexicon: HALOT
  rationale: מַרְעִית은 목초지나 목장을 뜻하므로, 목자-양 비유를 유지하면서 현대 한국어에서 자연스러운 ‘목장’으로 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명사 יְהוָה를 직접 사용하므로, 전통적 대체호칭보다 이름 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 목자/양 떼 비유를 정치적 해석으로 풀지 여부
  chosen_reading: 비유를 본문에서 그대로 유지
  alternative_readings:
  - 통치자들/백성으로 해석
  - 지도자들과 그 백성으로 해석
  rationale: 예언서의 목자-양 비유를 본문에서 보존하면 원문의 수사와 긴장이 유지되며, 해석은 독자가 따라가도록 남겨둘 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy; Preserve theological tension rather than resolve it'
