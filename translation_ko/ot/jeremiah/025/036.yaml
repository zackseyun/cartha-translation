revisions:
- from: 목자들의 부르짖는 소리와 양 떼의 지도자들의 울부짖음이 들립니다. 이는 야훼께서 그들의 목장을 황폐하게 하시기 때문입니다.[a][b]
  to: 목자들[b]이 부르짖는 소리와 양 떼의 유력한 자들[a]이 울부짖는 소리가 들립니다. 야훼께서 그들의 목초지를 황폐하게 하시기 때문입니다.
  rationale: 원문의 목자·양 떼 이미지를 유지하되, אַדִּירִים의 의미를 ‘지도자들’로 확정하지 않고 더 포괄적인 ‘유력한 자들’로 조정했습니다. 또한 ‘목초지’로 מַרְעִיתָם의 기본 의미를 더 정확히 반영하고, 두 각주를 각각의 관련 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:00Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어는 목자들의 부르짖음과 ‘양 떼의 אַדִּירִים’의 울부짖음을 병렬로 제시합니다. 초안의 ‘지도자들’은 אַדִּירִים의 권세·귀족성이라는 어휘 범위를 다소 해석적으로 좁힙니다. 또한 מַרְעִיתָם은 ‘목장’보다 ‘목초지/풀밭’이 더 직접적입니다.
  naturalness: ‘…소리가 들립니다’와 ‘…때문입니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 애가적 병렬을 잘 전달합니다. ‘목자들이 부르짖는 소리’처럼 구성하면 한국어 문장도 매끄럽습니다.
  terminology: יְהוָה는 ‘야훼’로 유지했습니다. 목자·양 떼·목초지의 비유 이미지를 본문에서 보존했습니다. אַדִּירֵי הַצֹּאן은 ‘양 떼의 유력한 자들’로 옮겨 ‘지도자들’보다 원문의 의미 범위를 덜 제한했습니다.
  issues:
  - severity: medium
    issue: אַדִּירֵי הַצֹּאן을 ‘양 떼의 지도자들’로 한정함
    rationale: אַדִּירִים은 ‘유력한 자들, 강한 자들, 귀인들’ 등의 폭을 지니며, 본문상 ‘지도자들’로 확정하는 것은 해석을 앞세웁니다. ‘유력한 자들’이 어휘적 모호성을 더 잘 보존합니다.
  - severity: low
    issue: מַרְעִיתָם을 ‘목장’으로 번역함
    rationale: ‘목장’은 가축 사육 시설 또는 사업체를 연상할 수 있습니다. 여기서는 양 떼의 먹이 터전인 ‘목초지’가 מַרְעִית의 의미와 비유 이미지를 더 정확히 살립니다.
  - severity: low
    issue: 각주 표지가 해당 표현에 직접 붙어 있지 않음
    rationale: 어휘 대안 각주는 ‘유력한 자들’에, 비유 설명 각주는 목자/양 떼 이미지가 시작되는 ‘목자들’에 붙여 독자가 각주의 적용 범위를 분명히 알 수 있게 해야 합니다.
  revised_text: 목자들[b]이 부르짖는 소리와 양 떼의 유력한 자들[a]이 울부짖는 소리가 들립니다. 야훼께서 그들의 목초지를 황폐하게 하시기 때문입니다.
