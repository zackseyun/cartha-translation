  text: וְ/אֵ֖ת כָּל מַלְכֵ֣י עֲרָ֑ב וְ/אֵת֙ כָּל מַלְכֵ֣י הָ/עֶ֔רֶב הַ/שֹּׁכְנִ֖ים בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/024.yaml
  text: and all the kings of Arabia[a], and all the kings of the mixed peoples who dwell in the wilderness[b];
  footnotes:
  - marker: a
    text: Or 'all the kings of the mixed company' or 'mixed multitude.' The Hebrew distinguishes this group from 'Arabia' in the previous phrase.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the desert.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아라비아의 모든 왕들과, 광야에 사는 혼합 민족의 모든 왕들과입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼합 무리의 모든 왕들’, 혹은 ‘혼합된 무리의 모든 왕들’로 옮길 수 있습니다. 히브리어는 앞의 ‘아라비아’와 이 집단을 구별합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광야에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  english_pob_choice: kings of
  chosen_korean: ~의 모든 왕들
  alternatives_korean:
  - ~의 왕들
  - 모든 왕들
  lexicon: HALOT
  rationale: 히브리어 구성형 복수는 앞뒤 명사의 관계를 살려 ‘~의 왕들’로 옮기는 것이 자연스럽습니다.
- source_word: עֲרָב
  english_pob_choice: Arabia
  chosen_korean: 아라비아
  alternatives_korean:
  - 아랍인들의 땅
  - 아랍
  lexicon: HALOT
  rationale: 문맥상 민족명보다 지역명 ‘아라비아’가 열거 목록의 병렬성을 더 분명하게 드러냅니다.
- source_word: הָעֶרֶב
  english_pob_choice: the mixed peoples
  chosen_korean: 혼합 민족
  alternatives_korean:
  - 혼합 무리
  - 섞인 무리
  - 혼합된 백성
  lexicon: HALOT
  rationale: עֶרֶב은 앞의 עֲרָב과 구별되는 어휘로, ‘혼합 민족’이라고 해야 그 대조와 집단성을 함께 살릴 수 있습니다.
- source_word: הַשֹּׁכְנִים בַּמִּדְבָּר
  english_pob_choice: who dwell in the wilderness
  chosen_korean: 광야에 사는
  alternatives_korean:
  - 광야에 거하는
  - 사막에 사는
  - 광야에 거주하는
  lexicon: HALOT
  rationale: 분사구는 수식절로 풀어 ‘광야에 사는’이라고 옮기면 목록의 흐름을 해치지 않으면서 의미를 분명히 전달합니다.
