  source_fidelity: 히브리어의 두 병렬 목적어(‘아라비아의 모든 왕들’과 ‘광야에 거주하는 혼합 집단의 모든 왕들’)는 대체로 반영되었습니다. 그러나 본문은 앞 절에서 이어지는 열거의 목적어 구절인데, ‘왕들과입니다’는 문법적으로 성립하지 않으며 원문의 미완결 열거 형식을 훼손합니다.
