id: JER.25.31
reference: Jeremiah 25:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֤א שָׁאוֹן֙ עַד קְצֵ֣ה הָ/אָ֔רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ בַּ/גּוֹיִ֔ם נִשְׁפָּ֥ט ה֖וּא לְ/כָל בָּשָׂ֑ר הָ/רְשָׁעִ֛ים נְתָנָ֥/ם לַ/חֶ֖רֶב נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/031.yaml
  text: An uproar has come to the end of the earth[a], for Yahweh has a case against the nations; he is entering into judgment with all flesh. He has given the wicked to the sword[d][c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'tumult' or 'roar' for 'uproar.'
    reason: lexical_alternative
  - marker: b
    text: '''Has a case against'' renders a Hebrew legal term that can also be translated ''has a controversy with'' or ''has a lawsuit against.'''
    reason: lexical_alternative
  - marker: c
    text: '''All flesh'' is a Hebrew idiom meaning all humanity.'
    reason: lexical_alternative
  - marker: d
    text: Or 'has handed them over to the sword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 소란이 땅의 끝까지 이르렀습니다[a]. 이는 야훼께서 나라들에 대하여 소송을 제기하셨고[b], 온 육체와 더불어 심판에 들어가시기 때문입니다. 그는 악한 자들을 칼에 넘기셨습니다[d], 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소요’ 또는 ‘울림’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘소송을 제기하다’는 히브리어 법률 용어를 옮긴 것으로, ‘논쟁하다’ 또는 ‘법정 소송을 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들을 칼에 넘겨주셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוֹן
  english_pob_choice: uproar
  chosen_korean: 소란
  alternatives_korean:
  - 요란
  - 혼란
  - 울부짖는 소리
  lexicon: HALOT
  rationale: judgment 문맥에서 큰 소란과 동요를 뜻하므로, 현대 한국어에서 자연스러우면서도 긴박함을 살리는 ‘소란’으로 옮겼습니다.
- source_word: עַד קְצֵה הָאָרֶץ
  english_pob_choice: to the end of the earth
  chosen_korean: 땅의 끝까지
  alternatives_korean:
  - 땅 끝까지
  - 세상 끝까지
  - 땅의 끝에까지
  lexicon: HALOT
  rationale: 히브리어의 공간적 극단을 직역에 가깝게 유지하되, 한국어에서는 ‘땅의 끝까지’가 가장 간결하고 자연스럽습니다.
- source_word: רִיב לַיהוָה בַגּוֹיִם
  english_pob_choice: has a case against the nations
  chosen_korean: 나라들에 대하여 소송을 제기하셨고
  alternatives_korean:
  - 나라들을 상대로 소송이 있으시고
  - 나라들과 다투고 계시고
  - 나라들에 대해 논쟁하시고
  lexicon: HALOT
  rationale: רִיב의 법정/언약 소송 뉘앙스를 살리기 위해 단순한 ‘다툼’보다 법적 성격이 드러나는 ‘소송을 제기하셨다’를 택했습니다.
- source_word: נִשְׁפָּט הוּא
  english_pob_choice: he is entering into judgment
  chosen_korean: 심판에 들어가시기 때문입니다
  alternatives_korean:
  - 판결하시는 중이기 때문입니다
  - 심판하시기 때문입니다
  - 재판에 임하시기 때문입니다
  lexicon: HALOT
  rationale: נשפט의 재판적 성격을 유지하면서도 한국어 문장 흐름을 위해 ‘심판에 들어가시다’로 옮겼습니다.
- source_word: לְכָל בָּשָׂר
  english_pob_choice: with all flesh
  chosen_korean: 온 육체와
  alternatives_korean:
  - 온 인류와
  - 모든 사람과
  - 모든 육체와
  lexicon: HALOT
  rationale: 성경적 관용구인 ‘all flesh’를 그대로 살려 보편적 인간 전체를 가리키는 힘을 보존했습니다.
- source_word: נְתָנָם לַחֶרֶב
  english_pob_choice: has given the wicked to the sword
  chosen_korean: 악한 자들을 칼에 넘기셨습니다
  alternatives_korean:
  - 악인들을 칼에 주셨습니다
  - 악한 자들을 칼로 넘겨주셨습니다
  - 악인들을 칼에 맡기셨습니다
  lexicon: HALOT
  rationale: ‘칼에 넘기다’는 죽음에 내어주다라는 관용적 의미를 한국어로 자연스럽게 전달하면서, 전쟁 심판의 이미지도 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 음역이 아닌 대체 호칭이 아닌, 문서의 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언자적 법정 언어 보존
  chosen_reading: ‘소송을 제기하셨고 … 심판에 들어가시기 때문입니다’로 법정적 긴장을 드러냈습니다.
  alternative_readings:
  - ‘나라들과 다투십니다’
  - ‘나라들을 심판하십니다’
  rationale: 본문은 ריב과 נשפט가 함께 나타나 하나님을 소송의 당사자이자 심판자로 제시하므로, 그 긴장을 약화하지 않도록 법정 언어를 유지했습니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
- issue: ‘온 육체’의 보편성
  chosen_reading: ‘온 육체’로 직역해 인간 전체를 포괄하는 성서적 관용구를 살렸습니다.
  alternative_readings:
  - ‘온 인류’
  - ‘모든 사람’
  rationale: 의미상은 모든 인류이지만, 본문의 성경적 표현을 보존하는 것이 원문의 범위를 가장 잘 드러냅니다.
  doctrine_reference: 번역 철학 §§3, 6
