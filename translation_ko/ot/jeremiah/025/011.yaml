translation:
  language: ko
  text: 이 땅 전체는 폐허가 되고 경악거리가 될 것이며, 이 민족들은 칠십 년 동안 바빌론 왕을 섬길 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경악거리’는 황폐된 땅을 보고 사람들이 경악하게 되는 대상이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה / כָּל הָאָרֶץ הַזֹּאת
  english_pob_choice: And all this land will become
  chosen_korean: 이 온 땅은 … 될 것이며
  alternatives_korean:
  - 이 땅 전체는 … 될 것이며
  - 이 모든 땅은 … 될 것이며
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 심판을 받는 지역적 ‘땅’이며, כָּל과 הַזֹּאת를 살려 ‘이 온 땅’으로 옮겼습니다.
- source_word: לְחָרְבָּה
  english_pob_choice: a ruin
  chosen_korean: 폐허
  alternatives_korean:
  - 황폐
  - 황무지
  - 무너진 곳
  lexicon: HALOT
  rationale: 명사형의 파괴 상태를 간결하고 구체적으로 살리기 위해 ‘폐허’를 선택했습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: a horror
  chosen_korean: 황폐함
  alternatives_korean:
  - 소름끼치는 광경
  - 공포
  - 놀라움
  lexicon: HALOT
  rationale: שַׁמָּה의 ‘경악을 불러일으키는 황폐 상태’를 한국어로 자연스럽게 담기 위해 ‘황폐함’으로 옮겼습니다. 영어 주석이 제시한 ‘공포의 대상’ 뉘앙스는 본문보다 덜 직설적인 한국어로 보존했습니다.
- source_word: וְעָבְדוּ
  english_pob_choice: will serve
  chosen_korean: 섬길 것입니다
  alternatives_korean:
  - 복종할 것입니다
  - 노역할 것입니다
  - 예속될 것입니다
  lexicon: HALOT
  rationale: 지배자에게 대한 정치적 종속을 뜻하므로 ‘섬기다’를 사용해 직접적인 복속 의미를 유지했습니다.
- source_word: שִׁבְעִים שָׁנָה
  english_pob_choice: for seventy years
  chosen_korean: 칠십 년 동안
  alternatives_korean:
  - 칠십 년
  - 칠십 해 동안
  lexicon: HALOT
  rationale: 기간 표현으로서 한국어 문맥에 맞게 ‘동안’을 보충해 지속 시간을 분명히 했습니다.
theological_decisions:
- issue: ‘땅’과 ‘민족들’의 심판 범위
  chosen_reading: 본문은 예언적 심판으로서 유다와 주변 민족이 바빌론 지배 아래 놓이는 역사적 범위를 가리킨다고 읽었습니다.
  alternative_readings:
  - 전 세계적·보편적 파괴로 확대하는 읽기
  rationale: 문맥상 특정 지역과 열방에 대한 역사적 심판 예언이므로, ‘이 온 땅’과 ‘이 민족들’을 그대로 살려 범위를 과장하지 않았습니다.
  doctrine_reference: 예언서 문맥 해석
