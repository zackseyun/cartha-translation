id: JER.25.38
reference: Jeremiah 25:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָזַ֥ב כַּ/כְּפִ֖יר סֻכּ֑/וֹ כִּֽי הָיְתָ֤ה אַרְצָ/ם֙ לְ/שַׁמָּ֔ה מִ/פְּנֵי֙ חֲר֣וֹן הַ/יּוֹנָ֔ה וּ/מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/038.yaml
  text: Like a young lion[a], he has left his den, for their land has become a desolation because of the burning anger of the oppressor[b], and because of his burning anger.
  footnotes:
  - marker: a
    text: Or 'because of the burning anger of the dove.' The Hebrew written form can be read that way, but the context strongly favors a sense like 'the oppressor.'
    reason: alternative_reading
  - marker: b
    text: The final 'his' likely refers to the LORD in the surrounding context, though some understand it to refer to the oppressor mentioned in the previous phrase.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 젊은 사자처럼 자기 굴을 떠났습니다. 그들의 땅이 압제자의[a] 타오르는 분노와 그의[b] 타오르는 분노 때문에 황무지가 되었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비둘기의 타오르는 분노 때문에’. 히브리어 표기는 그렇게 읽을 수도 있지만, 문맥상 ‘압제자’와 같은 뜻이 더 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 ‘그의’는 주변 문맥의 여호와를 가리킬 가능성이 크지만, 앞의 압제자를 가리킨다고 이해하는 이들도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַב כַּכְּפִיר סֻכּוֹ
  english_pob_choice: Like a young lion, he has left his den
  chosen_korean: 사자 새끼처럼 자기 굴을 떠났습니다
  alternatives_korean:
  - 어린 사자처럼 자기 굴을 떠났습니다
  - 사자 새끼처럼 자기 은신처를 떠났습니다
  lexicon: HALOT
  rationale: כְּפִיר은 단순한 '사자'보다 어린 사자를 가리키므로 '사자 새끼'가 자연스럽고, סֻכּוֹ는 짐승의 거처를 뜻하는 비유로 '굴'이 가장 매끄럽습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: has become a desolation
  chosen_korean: 황무지가 되었기 때문입니다
  alternatives_korean:
  - 황폐해졌기 때문입니다
  - 폐허가 되었기 때문입니다
  lexicon: HALOT
  rationale: שַׁמָּה의 명사적 의미를 살려 '황무지'로 옮기면 결과 상태가 분명해지고, 본문의 판단적 어조도 유지됩니다.
- source_word: הַיּוֹנָה
  english_pob_choice: the oppressor
  chosen_korean: 약탈자
  alternatives_korean:
  - 압제자
  - 노략질하는 자
  lexicon: HALOT
  rationale: 문맥상 파괴를 일으키는 가해자를 가리키므로, POB의 'oppressor'를 한국어로는 ‘약탈자’로 옮겨 파괴적 폭력을 드러냈습니다.
- source_word: חֲרוֹן
  english_pob_choice: burning anger
  chosen_korean: burning anger
  alternatives_korean:
  - 불타는 분노
  - 맹렬한 분노
  lexicon: HALOT
  rationale: 히브리어의 불타는 분노 이미지를 살리기 위해 본문에서는 직역적 표지를 유지하고, 주석에서 번역상 대안 가능성을 제시합니다.
theological_decisions:
- issue: 마지막 대명사 ‘his’의 지시 대상
  chosen_reading: 본문은 마지막 '그의'가 주변 문맥의 여호와를 가리키는 해석 가능성을 열어 둔 채, 문장 구조를 그대로 유지합니다.
  alternative_readings:
  - 앞의 '약탈자'를 가리킨다고 볼 수 있습니다
  rationale: 히브리어는 지시 대상이 다소 모호하므로, 본문에서 해소하지 않고 원문의 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 원문이 남긴 모호성 보존
- issue: ‘사자 새끼’ 이미지의 주체
  chosen_reading: 사자 같은 이미지는 심판 행위의 강렬함을 드러내는 표현으로, 본문은 주체를 과도하게 특정하지 않습니다.
  alternative_readings:
  - 주체를 느부갓네살로 한정하는 읽기
  rationale: 예레미야 25장 문맥상 심판과 파괴의 행위가 중심이므로, 한국어 본문도 이미지의 힘을 살리면서 신학적 결론은 주석에 남겨 둡니다.
  doctrine_reference: 문맥의 신학적 긴장 유지
