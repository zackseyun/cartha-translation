  text: וְ/אֵת֙ כָּל מַלְכֵי צֹ֔ר וְ/אֵ֖ת כָּל מַלְכֵ֣י צִיד֑וֹן וְ/אֵת֙ מַלְכֵ֣י הָ/אִ֔י אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/022.yaml
  text: and all the kings of Tyre[a], and all the kings of Sidon, and the kings of the coastland that is across the sea;
  footnotes:
  - marker: a
    text: Or 'the island across the sea.' The Hebrew אִי can mean 'island,' but in prophetic usage it often refers more broadly to a coastland or maritime region.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로의 모든 왕들과 시돈의 모든 왕들과 바다 건너편에 있는 해안 지방의 왕들에게.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다 건너편의 섬’. 히브리어 אִי는 ‘섬’을 뜻할 수 있지만, 예언 문맥에서는 더 넓게 해안 지방이나 해상 지역을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  english_pob_choice: kings of
  chosen_korean: 왕들
  alternatives_korean:
  - 통치자들
  - 임금들
  lexicon: HALOT
  rationale: 히브리어 מֶלֶךְ의 복수 구성형을 가장 직접적으로 옮겨, 대상이 여러 지역의 왕들임을 분명히 드러냈습니다.
- source_word: צֹר
  english_pob_choice: Tyre
  chosen_korean: 두로
  alternatives_korean:
  - 티레
  lexicon: HALOT
  rationale: 성경에서 널리 굳어진 한국어 지명형인 두로를 사용했습니다.
- source_word: צִידוֹן
  english_pob_choice: Sidon
  chosen_korean: 시돈
  alternatives_korean:
  - 사이돈
  lexicon: HALOT
  rationale: 성경 지명으로 통용되는 시돈을 채택했습니다.
- source_word: הָאִי אֲשֶׁר בְּעֵבֶר הַיָּם
  english_pob_choice: the coastland that is across the sea
  chosen_korean: 바다 건너편에 있는 해안 지방
  alternatives_korean:
  - 바다 건너편 섬
  - 바다 너머의 해안 지역
  lexicon: HALOT
  rationale: אִי를 단순히 ‘섬’으로 좁히지 않고, 예언서 문맥에서 가능한 해안 지역/연안 지방의 뜻을 살려 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 예언적 지리 표현에서 אִי의 범위
  chosen_reading: ‘해안 지방’으로 넓게 옮겨, 바다 건너편의 해상·연안 지역 전체를 가리키는 예언적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘섬’으로 제한하는 번역
  - ‘해변 지역’으로 더 완화하는 번역
  rationale: 영문 POB도 ‘coastland’에 우선권을 두고 각주로 ‘island’ 가능성을 열어 두었으므로, 본문에서는 더 넓은 지리 범주를 유지하는 것이 원문과 주해에 가장 충실합니다.
  doctrine_reference: 예언 문맥의 지리적 범위와 심판 대상 확대
