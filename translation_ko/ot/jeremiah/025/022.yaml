  text: וְ/אֵת֙ כָּל מַלְכֵי צֹ֔ר וְ/אֵ֖ת כָּל מַלְכֵ֣י צִיד֑וֹן וְ/אֵת֙ מַלְכֵ֣י הָ/אִ֔י אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/022.yaml
  text: and all the kings of Tyre[a], and all the kings of Sidon, and the kings of the coastland that is across the sea;
  footnotes:
  - marker: a
    text: Or 'the island across the sea.' The Hebrew אִי can mean 'island,' but in prophetic usage it often refers more broadly to a coastland or maritime region.
    reason: lexical_alternative
translation:
  language: ko
  text: 두로의 모든 왕들과 시돈의 모든 왕들과 바다 건너편에 있는 해안 지방의 왕들을 향하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다 건너편의 섬’. 히브리어 אִי는 ‘섬’을 뜻할 수 있지만, 예언 문맥에서는 더 넓게 해안 지방이나 해상 지역을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  english_pob_choice: kings of
  chosen_korean: 왕들
  alternatives_korean:
  - 통치자들
  - 임금들
  lexicon: HALOT
  rationale: 히브리어 מֶלֶךְ의 복수 구성형을 가장 직접적으로 옮겨, 대상이 여러 지역의 왕들임을 분명히 드러냈습니다.
- source_word: צֹר
