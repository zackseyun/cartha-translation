- source_word: צִידוֹן
  english_pob_choice: Sidon
  chosen_korean: 시돈
  alternatives_korean:
  - 사이돈
  lexicon: HALOT
  rationale: 성경 지명으로 통용되는 시돈을 채택했습니다.
- source_word: הָאִי אֲשֶׁר בְּעֵבֶר הַיָּם
  english_pob_choice: the coastland that is across the sea
  chosen_korean: 바다 건너편에 있는 해안 지방
  alternatives_korean:
