  - 바다 너머의 해안 지역
  lexicon: HALOT
  rationale: אִי를 단순히 ‘섬’으로 좁히지 않고, 예언서 문맥에서 가능한 해안 지역/연안 지방의 뜻을 살려 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 예언적 지리 표현에서 אִי의 범위
  chosen_reading: ‘해안 지방’으로 넓게 옮겨, 바다 건너편의 해상·연안 지역 전체를 가리키는 예언적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘섬’으로 제한하는 번역
  - ‘해변 지역’으로 더 완화하는 번역
  rationale: 영문 POB도 ‘coastland’에 우선권을 두고 각주로 ‘island’ 가능성을 열어 두었으므로, 본문에서는 더 넓은 지리 범주를 유지하는 것이 원문과 주해에 가장 충실합니다.
  doctrine_reference: 예언 문맥의 지리적 범위와 심판 대상 확대
