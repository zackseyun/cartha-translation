translation:
  language: ko
  text: 그들은 마시고 비틀거리며 미친 듯이 행동할 것입니다. 이는 내가 그들 가운데로 보내는 칼 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미친 듯이 행동할 것입니다’는 히브리어 동사의 행동적 뉘앙스를 살린 번역이며, ‘미칠 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתוּ
  english_pob_choice: They will drink
  chosen_korean: 마시고
  alternatives_korean:
  - 마실 것입니다
  - 술을 마시고
  lexicon: HALOT
  rationale: 예언적 연쇄에서 미래적 결과를 나타내므로, 자연스러운 한국어 미래 문맥 속에 동사형을 두었습니다. 직역적 ‘마실 것입니다’보다 간결한 ‘마시고’가 뒤의 연속 동작과도 잘 맞습니다.
- source_word: וְהִתְגֹּעֲשׁוּ
  english_pob_choice: stagger
  chosen_korean: 비틀거리며
  alternatives_korean:
  - 휘청이며
  - 흔들리며
  - 경련을 일으키며
  lexicon: HALOT
  rationale: 음주 뒤의 불안정한 움직임을 가리키므로, ‘비틀거리다’가 이미지와 관용을 함께 살립니다.
- source_word: וְהִתְהֹלָלוּ
  english_pob_choice: act like madmen
  chosen_korean: 미쳐 날뛸 것입니다
  alternatives_korean:
  - 미친 듯이 행동할 것입니다
  - 미쳐 갈 것입니다
  - 광란할 것입니다
  lexicon: HALOT
  rationale: 히트폴렐 계열의 ‘광기 어린 행동’은 단순한 상태 변화보다 드러나는 행위를 강조하므로, 행동성과 격렬함을 함께 보이는 표현을 택했습니다.
- source_word: מִפְּנֵי הַחֶרֶב
  english_pob_choice: because of the sword
  chosen_korean: 이는 … 칼 때문입니다
  alternatives_korean:
  - 칼 때문에
  - 칼 앞에서
  - 칼의 존재로 인해
  lexicon: HALOT
  rationale: מִפְּנֵי는 여기서 원인 관계를 나타내므로 ‘때문에’로 옮겼습니다. 예언서의 심판 상징인 ‘칼’은 문자적 전쟁 도구로서 유지했습니다.
theological_decisions:
- issue: 심판의 이미지 보존
  chosen_reading: 마심-비틀거림-광기라는 구체적 연쇄를 그대로 살려, 야훼의 보내심으로 인한 전쟁 심판의 충격을 드러냈습니다.
  alternative_readings:
  - ‘두려움에 사로잡힐 것입니다’처럼 추상화하기
  rationale: 본문은 추상적 공포가 아니라 술잔과 칼의 예언적 이미지로 심판을 묘사하므로, 그 생생한 감각을 약화시키지 않는 쪽이 원문 의미에 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve the source text’s plain sense; do not paraphrase beyond what the source warrants.'
