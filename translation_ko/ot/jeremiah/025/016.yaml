  source_fidelity: ‘미쳐 날뛸 것입니다’는 히브리어 הִתְהֹלָלוּ의 ‘미친 듯이 행동하다/광기를 보이다’보다 격렬한 신체적 난동을 다소 구체적으로 보탭니다. ‘미친 듯이 행동할 것입니다’가 행동적 뉘앙스를 유지하면서도 원문의 범위를 더 정확히 보존합니다. 나머지 연쇄(마심, 비틀거림)와 칼이 원인이라는 표현은 원문에 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘이는 … 때문입니다’는 앞선 결과와 뒤의 원인을 분명히 연결하며, ‘그들 가운데로 보내는’은 בֵּינֹתָם의 방향성과 위치를 무리 없이 드러냅니다.
