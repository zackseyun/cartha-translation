id: JER.25.10
reference: Jeremiah 25:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַאֲבַדְתִּ֣י מֵ/הֶ֗ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה ק֥וֹל רֵחַ֖יִם וְ/א֥וֹר נֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/010.yaml
  text: And I will destroy from among them the sound of joy and the sound of gladness[a], the voice of the bridegroom and the voice of the bride[b], the sound of the millstones and the light of the lamp.
  footnotes:
  - marker: a
    text: 'Or ''I will put an end to from among them.'' The Hebrew verb is causative: ''cause to perish/disappear.'''
    reason: lexical_alternative
  - marker: b
    text: '''The voice of the bridegroom and the voice of the bride'' refers to wedding celebration, a stock image of normal communal life.'
    reason: cultural_note
translation:
  language: ko
  text: 나는 그들 가운데서 기쁨의 소리와 즐거움의 소리, 신랑의 목소리와 신부의 목소리, 맷돌의 소리와 등불의 빛을 사라지게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 가운데서 사라지게 하겠습니다.’ 히브리어 동사는 사역형으로, ‘멸망시키다/사라지게 하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신랑의 목소리와 신부의 목소리’는 결혼 축제라는, 정상적인 공동체 삶을 나타내는 상투적 이미지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  english_pob_choice: I will destroy / make disappear
  chosen_korean: 사라지게 하겠습니다
  alternatives_korean:
  - 멸망시키겠습니다
  - 없애겠습니다
  - 끊어지게 하겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미인 ‘사라지게 하다/없애다’를 살리되, 소리와 빛 같은 대상에 더 자연스럽게 맞는 한국어로 옮겼습니다.
- source_word: קוֹל
  english_pob_choice: sound / voice
  chosen_korean: 소리 / 목소리
  alternatives_korean:
  - 음성
  - 소리
  lexicon: HALOT
  rationale: 무생물과 관련된 항목에는 ‘소리’를, 사람의 존재를 가리키는 결혼 장면에는 ‘목소리’를 써서 원문의 반복 구조와 의미 차이를 함께 살렸습니다.
- source_word: רֵחַיִם
  english_pob_choice: the sound of the millstones
  chosen_korean: 맷돌의 소리
  alternatives_korean:
  - 분쇄기의 소리
  - 손맷돌의 소리
  lexicon: HALOT
  rationale: רֵחַיִם은 두 개의 돌맷돌을 가리키므로, 일상적 घरेल내 이미지를 살리는 ‘맷돌’이 가장 직접적입니다.
- source_word: אוֹר נֵר
  english_pob_choice: the light of the lamp
  chosen_korean: 등불의 빛
  alternatives_korean:
  - 등잔불
  - 램프의 빛
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 자연스러운 한국어로 풀어, 거주와 생활의 흔적을 보여 주는 ‘등불의 빛’으로 옮겼습니다.
theological_decisions:
- issue: 일상적 공동체 생활의 제거라는 심판 이미지
  chosen_reading: 이 구절은 기쁨과 혼인, 노동과 조명의 소리와 빛이 사라지는 것으로 심판을 묘사합니다.
  alternative_readings:
  - ‘모든 즐거운 소리를 잠잠하게 하겠다’처럼 추상화하는 번역
  rationale: 원문은 구체적 표지들을 열거하므로, 그 이미지를 요약하기보다 열거 자체를 유지하는 것이 문맥의 강도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
