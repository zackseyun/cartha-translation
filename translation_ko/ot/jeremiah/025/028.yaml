id: JER.25.28
reference: Jeremiah 25:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֧י יְמָאֲנ֛וּ לָ/קַֽחַת הַ/כּ֥וֹס מִ/יָּדְ/ךָ֖ לִ/שְׁתּ֑וֹת וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת שָׁת֥וֹ תִשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/028.yaml
  text: 'And if they refuse to take the cup from your hand to drink[a], then you shall say to them, ‘Thus says Yahweh of hosts: You shall surely drink.’'
  footnotes:
  - marker: a
    text: Or, 'You shall certainly drink.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 네 손에서 그 잔을 받아 마시기를 거부하면, 그들에게 이렇게 말해야 합니다. 「만군의 야훼께서 이렇게 말씀하십니다. 너희는 반드시 마실 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And if
  chosen_korean: 그들이 … 거부하면
  alternatives_korean:
  - 그리고 … 하면
  - 만일 … 한다면
  lexicon: HALOT
  rationale: 조건적 미래 상황을 자연스러운 한국어 조건절로 옮겼습니다. “거부하면”은 뒤의 거절 동작을 직접 드러내면서도 문맥의 예언적 조건을 살립니다.
- source_word: הַכּוֹס
  english_pob_choice: the cup
  chosen_korean: 그 잔
  alternatives_korean:
  - 그 컵
  - 그 술잔
  lexicon: HALOT
  rationale: 히브리어의 은유를 해석적으로 풀지 않고 기본 명사 “잔”을 유지했습니다. 문맥상의 심판의 잔이라는 의미는 본문 밖에서 추론되더라도 본문에는 남겨 두는 것이 적절합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יְהוָה는 “야훼”로 옮기고, צְבָאוֹת는 “만군의”로 옮겨 군대/천상 군세의 호칭을 드러냈습니다.
- source_word: שָׁתוֹ תִשְׁתּוּ
  english_pob_choice: You shall surely drink
  chosen_korean: 너희는 반드시 마실 것입니다
  alternatives_korean:
  - 너희는 틀림없이 마실 것입니다
  - 너희는 반드시 마셔야 합니다
  lexicon: HALOT
  rationale: 부정사 절대형과 완료/미완료 결합의 강한 강조를 한국어 부사 “반드시”로 살렸습니다. 여기서는 단순 가능성이 아니라 확정된 선포이므로 명령조보다 예언적 확정 진술이 더 적합합니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 이름을 가리고 일반 호칭으로 완화하지 않기 위해, 프로젝트 기준에 따라 고유 신명은 “야훼”로 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 강조형 שָׁתוֹ תִשְׁתּוּ의 어조
  chosen_reading: 예언적 확정 선포로 처리
  alternative_readings:
  - 강한 명령형으로 처리
  - ‘반드시 마실 것이다’로 단순 미래화
  rationale: 히브리어의 강조는 경고의 강도를 높이지만, 문맥상 하나님 말씀의 확정성을 선포하는 형식이므로 한국어에서도 단순한 명령보다 예언적 확정 진술로 번역했습니다.
  doctrine_reference: Translation philosophy §1, §3
