  source_fidelity: 히브리어의 조건절, 단수인 ‘네 손에서’, 잔의 은유, 예언자에게 주어진 발화 지시, ‘만군의 야훼’, 그리고 שָׁתוֹ תִשְׁתּוּ의 강조된 확정적 선언을 대체로 충실히 반영했습니다. 다만 ‘당신’은 한국어에서 이 문맥의 단수 수신자를 자연스럽게 나타내지 못하며, 친밀/대립적 뉘앙스를 낼 수 있습니다.
  naturalness: ‘당신의 손’과 ‘당신은 … 말해야 합니다’는 성경의 신적 명령 장면에서 현대 표준어로 부자연스럽습니다. 수신 대명사를 생략하고 지시를 표현하면 합쇼체를 유지하면서도 더 자연스럽습니다. 인용문 안의 ‘말씀하십니다’는 야훼의 발화에 맞는 정중한 서술입니다.
  terminology: ‘잔’, ‘만군의 야훼’는 원문의 은유와 신명을 적절히 보존합니다. ‘반드시 마실 것입니다’는 부정사 절대형과 동사의 강조를 무리 없이 옮깁니다.
