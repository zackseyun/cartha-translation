  to: 그들이 네 손에서 그 잔을 받아 마시기를 거부하면, 그들에게 이렇게 말해야 합니다. 「만군의 야훼께서 이렇게 말씀하십니다. 너희는 반드시 마실 것입니다.」
  rationale: 원문의 의미와 강조를 유지하면서, 부자연스러운 ‘당신’ 호칭을 제거했습니다. ‘네 손에서’는 히브리어의 단수 소유 접미사를 보존하고, 주절에서는 수신 대명사를 생략하여 현대 한국어 합쇼체의 자연스러움을 확보했습니다.
