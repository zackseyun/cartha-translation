  naturalness: ‘제사년’은 현대 한국어에서 모호하고 자연스럽지 않으므로 ‘넷째 해’가 더 분명합니다. 계보·왕호·연대는 ‘유다 왕 요시야의 아들 여호야김의 넷째 해’로 배열하면 자연스럽고 원문의 관계도 정확히 드러납니다. 각주 표지는 실제로 대안이 걸리는 ‘관하여’ 뒤에 두는 것이 적절합니다.
  terminology: ‘말씀’과 ‘예레미야에게 임하였던’은 예언서 표제의 한국어 표현으로 적절합니다. ‘바빌론 왕 느부갓네살’도 통용되는 현대 한국어 성경식 왕호입니다. 원문에 없는 신명은 제거해야 합니다.
