  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה עַֽל יִרְמְיָ֨הוּ֙ עַל כָּל עַ֣ם יְהוּדָ֔ה בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֗יא הַ/שָּׁנָה֙ הָ/רִ֣אשֹׁנִ֔ית לִ/נְבֽוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/001.yaml
  text: The word that came to Yirmeyahu concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah[a], king of Judah—it was the first year of Nebuchadnezzar king of Babylon—
  footnotes:
  - marker: a
    text: Or 'against all the people of Judah.' The Hebrew preposition can carry either sense in prophetic contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 유다 왕 요시야의 아들 여호야김의 넷째 해에, 유다의 모든 백성에 관하여[a] 예레미야에게 임하였던 말씀입니다. 그 해는 바빌론 왕 느부갓네살의 첫째 해였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유다의 모든 백성을 대적하여.” 히브리어 전치사 עַל은 예언 문맥에서 ‘관하여’ 또는 ‘대적하여’의 뜻을 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 일
  lexicon: HALOT
  rationale: 예언 서문에서 דָּבָר는 하나님의 계시를 가리키는 관용구이므로, 한국어에서는 단순한 '말'보다 예언적 용법을 살린 '말씀'이 가장 자연스럽습니다.
- source_word: אֲשֶׁר הָיָה עַל
  english_pob_choice: that came to
  chosen_korean: 임하였는데
  alternatives_korean:
  - 내렸는데
  - 찾아왔는데
  - 와 있었는데
  lexicon: HALOT
  rationale: 예언자에게 '말씀이 임하다'는 한국어 성경의 익숙한 표현이면서도, מקור의 동사를 과도하게 풀이하지 않고 사건성을 살립니다.
- source_word: עַל כָּל עַם יְהוּדָה
  english_pob_choice: concerning all the people of Judah
  chosen_korean: 유다의 모든 백성에 관하여
  alternatives_korean:
  - 유다의 모든 백성에게 대하여
  - 유다의 모든 백성에게
  - 유다의 모든 백성에 대해
  lexicon: HALOT
  rationale: עַל의 범위를 '관하여'로 살려, 본문이 아직 경고의 방향을 확정하기보다 예언의 주제를 제시한다는 점을 유지했습니다.
- source_word: בַּשָּׁנָה הָרְבִעִית ... הַשָּׁנָה הָרִאשֹׁנִית
  english_pob_choice: in the fourth year ... it was the first year
  chosen_korean: 제사년에 ... 제1년이었습니다
  alternatives_korean:
  - 네 번째 해에 ... 첫해였습니다
  - 4년에 ... 첫 해였습니다
  lexicon: HALOT
  rationale: 왕 연대기 표현을 한국어 합쇼체의 자연스러운 관용으로 옮기되, 두 연대 모두 동일한 형식으로 맞춰 문장의 대비를 분명히 했습니다.
- source_word: יְהוֹיָקִים ... בֶּן יֹאשִׁיָּהוּ ... מֶלֶךְ יְהוּדָה
  english_pob_choice: Jehoiakim son of Josiah, king of Judah
  chosen_korean: 유다의 왕 여호야김의 아들 요시야
  alternatives_korean:
  - 유다 왕 여호야김의 아들 요시야
  - 유다의 왕 여호야김, 요시야의 아들
  lexicon: HALOT
  rationale: 히브리어의 계보와 왕호를 한국어 어순에 맞게 묶어, '유다의 왕'이 요시야가 아니라 여호야김을 수식한다는 점이 분명히 드러나도록 했습니다.
- source_word: נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  english_pob_choice: Nebuchadnezzar king of Babylon
  chosen_korean: 바빌론의 왕 느부갓네살
  alternatives_korean:
  - 바빌론 왕 느부갓네살
  - 바빌론의 왕 네부카드네자르
  lexicon: HALOT
  rationale: 왕호는 한국어의 표준적인 소유·지배 구조인 '바빌론의 왕'으로 옮기고, 인명은 익숙한 성경 표기를 유지했습니다.
