  - 유다의 모든 백성에게
  - 유다의 모든 백성에 대해
  lexicon: HALOT
  rationale: עַל의 범위를 '관하여'로 살려, 본문이 아직 경고의 방향을 확정하기보다 예언의 주제를 제시한다는 점을 유지했습니다.
- source_word: בַּשָּׁנָה הָרְבִעִית ... הַשָּׁנָה הָרִאשֹׁנִית
  english_pob_choice: in the fourth year ... it was the first year
  chosen_korean: 제사년에 ... 제1년이었습니다
  alternatives_korean:
