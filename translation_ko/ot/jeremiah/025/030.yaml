source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּנָּבֵ֣א אֲלֵי/הֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם יְהוָ֞ה מִ/מָּר֤וֹם יִשְׁאָג֙ וּ/מִ/מְּע֤וֹן קָדְשׁ/וֹ֙ יִתֵּ֣ן קוֹל֔/וֹ שָׁאֹ֤ג יִשְׁאַג֙ עַל נָוֵ֔/הוּ הֵידָד֙ כְּ/דֹרְכִ֣ים יַֽעֲנֶ֔ה אֶ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/030.yaml
  text: 'And you, you shall prophesy all these words against them, and you shall say to them: The LORD will roar from on high, and from his holy dwelling he will give his voice; he will surely roar against his pasture. He will answer with a shout like those who tread grapes, against all the inhabitants of the earth.'
translation:
  language: ko
  text: 그런데 당신은 그들에게 이 모든 말을 예언하여 그들에게 말해야 합니다. 「야훼께서 높은 곳에서 포효하시고, 그의 거룩한 처소에서 자기의 음성을 내실 것이며, 반드시 자기 목장을 향해 포효하실 것입니다. 그는 포도 짜는 자들처럼 외치는 소리로 응답하실 것이니, 그것은 땅의 모든 주민을 향한 것입니다.」[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 대하여’라는 심판 대상 지정이 드러납니다.
    reason: lexical_alternative
  - marker: b
    text: 원문 הֵידָד는 포도 짜는 자들의 함성이나 외침을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: תִּנָּבֵ֣א ... אֲלֵי/הֶ֔ם
  english_pob_choice: you shall prophesy ... against them
  chosen_korean: 그들에게 이 모든 말을 예언하여
  alternatives_korean:
  - 그들에게 이 모든 말을 말하여
  - 그들에 대하여 이 모든 말을 예언하여
  lexicon: נבא
  rationale: 동사는 단순 발화가 아니라 ‘예언하다’가 원문의 예언 행위를 가장 직접적으로 드러내므로 이를 살렸고, 문맥상 대상자에게 향한 심판 선포이므로 ‘그들에게’로 유지했습니다.
- source_word: יְהוָ֞ה
  english_pob_choice: The LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: יהוה
  rationale: 히브리어 고유명사 יהוה는 프로젝트 기본값에 따라 학술적 음역인 ‘야훼’로 옮겼습니다.
- source_word: יִשְׁאָג / שָׁאֹ֤ג יִשְׁאַג
  english_pob_choice: will roar / he will surely roar
  chosen_korean: 포효하시고 / 반드시 ... 포효하실 것입니다
  alternatives_korean:
  - 으르렁거리시고 / 반드시 ... 으르렁거리실 것입니다
  - 울부짖으시고 / ... 포효하실 것입니다
  lexicon: שאג
  rationale: 동물의 포효를 가리키는 강한 음성 이미지를 살리기 위해 ‘포효하다’를 택했고, 반복 구조는 ‘반드시’로 강조를 반영했습니다.
- source_word: נָוֵ֔/הוּ
  english_pob_choice: his pasture
  chosen_korean: 자기의 목장
  alternatives_korean:
  - 그의 목초지
  - 그의 풀밭
  lexicon: נוה
  rationale: 목양적 이미지를 한국어에서 자연스럽고 구체적으로 전달하는 표현으로 ‘목장’을 택했으며, 소유 대명사는 문맥상 ‘자기의’로 풀었습니다.
- source_word: הֵידָד
  english_pob_choice: with a shout
  chosen_korean: 외치는 소리로
  alternatives_korean:
  - 함성으로
  - 외침으로
  lexicon: הֵידָד
  rationale: 포도 짜는 자들의 함성/외침을 가리키는 말이므로, POB의 ‘a shout’를 반영하되 한국어에서는 의미를 명시한 ‘외치는 소리로’가 가장 직접적입니다.
theological_decisions:
- issue: YHWH 호칭 번역
  chosen_reading: 본문의 יהוה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 하나님의 고유명사를 숨기지 않고 드러내는 번역을 채택했습니다.
  doctrine_reference: 명칭 투명성 / source-direct rendering
