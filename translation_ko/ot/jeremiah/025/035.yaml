  naturalness: ‘목자들에게서 피할 길이 사라지고’는 자연스럽지만, 두 절을 ‘~에게는 ... 없어집니다’로 병렬하면 현대 표준어 합쇼체에서 더 매끄럽고 원문의 소유·박탈 관계도 분명해집니다.
