id: JER.25.35
reference: Jeremiah 25:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָבַ֥ד מָנ֖וֹס מִן הָֽ/רֹעִ֑ים וּ/פְלֵיטָ֖ה מֵ/אַדִּירֵ֥י הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/035.yaml
  text: Escape has perished from the shepherds[b][a], and deliverance from the lords of the flock.
  footnotes:
  - marker: a
    text: Or 'and escape from the mighty ones of the flock.'
    reason: lexical_alternative
  - marker: b
    text: '''Shepherds'' and ''flock'' are prophetic metaphors for the people''s leaders and the people under them.'
    reason: cultural_note
translation:
  language: ko
  text: 목자들에게서 피할 길이 사라지고, 양의 지도자들에게서 구출도 사라집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목자들’과 ‘양’은 예언서에서 각각 백성의 지도자들과 그 아래 있는 백성을 가리키는 비유입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘피할 길’과 ‘구출’의 이중 표현으로, 탈출 가능성이 전면적으로 사라졌다는 뜻을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וְאָבַד / מָנוֹס
  english_pob_choice: has perished / escape
  chosen_korean: 피할 길이 사라지고
  alternatives_korean:
  - 도피가 사라지고
  - 피난처가 사라지고
  lexicon: HALOT
  rationale: מָנוֹס는 ‘도망/피할 길’의 뜻이므로, 문맥상 단순한 ‘도피’보다 출구가 끊긴 상황을 드러내는 ‘피할 길’이 자연스럽습니다. וְאָבַד의 완료형은 예언적 선언의 단정성을 살려 ‘사라지고’로 옮겼습니다.
- source_word: מִן הָרֹעִים
  english_pob_choice: from the shepherds
  chosen_korean: 목자들에서
  alternatives_korean:
  - 목자들에게서
  - 목자들로부터
  lexicon: HALOT
  rationale: מן은 분리/기원을 나타내므로 ‘~에게서’가 가장 직접적입니다. 다만 한국어 문장 흐름상 ‘목자들에게서’가 더 자연스러워 본문에서는 이를 택했습니다.
- source_word: וּפְלֵיטָה
  english_pob_choice: deliverance
  chosen_korean: 구출도
  alternatives_korean:
  - 도피도
  - 구원도
  lexicon: HALOT
  rationale: 평행 구조상 앞의 ‘피할 길’과 약간 다르게 옮겨, 사람을 건져 내는 의미를 드러내는 ‘구출’로 처리했습니다. ‘구원’은 신학적으로 더 넓게 읽힐 수 있어 여기서는 구체적 탈출 불가능성을 살렸습니다.
- source_word: מֵאַדִּירֵי הַצֹּאן
  english_pob_choice: from the lords of the flock
  chosen_korean: 양의 지도자들에게서
  alternatives_korean:
  - 양의 주인들에게서
  - 양의 귀인들에게서
  - 양의 강자들에게서
  lexicon: HALOT
  rationale: אַדִּירֵי는 본래 ‘위대한/강한/존귀한’ 자들이지만, 목양 은유 안에서 실제로는 사람들의 지도층을 가리키므로 ‘지도자들’로 풀어 의미를 분명히 했습니다. 다만 ‘목자들’과 중복되지 않도록 후반 절은 역할을 해설적으로 옮겼습니다.
theological_decisions:
- issue: 목자/양 은유의 처리
  chosen_reading: 은유를 완전히 풀지 않고, 한국어에서는 ‘목자들’과 ‘양의 지도자들’로 유지하되 후반은 해설적으로 옮겼습니다.
  alternative_readings:
  - 본문 전체를 ‘지도자들’과 ‘백성의 지도층’으로 명시적으로 풀어쓰기
  - 은유를 그대로 두되 ‘귀인들’로 직역
  rationale: 예레미야의 문맥은 지도자들을 목자와 양으로 비유하는 예언적 풍자이므로, 이미지를 보존하면서도 독자가 의미를 놓치지 않도록 최소한의 해설만 더했습니다.
  doctrine_reference: Translation philosophy §1, §6
