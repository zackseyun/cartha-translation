  to: 북쪽의 모든 왕들, 곧 가까운 이들과 먼 이들이 서로 뒤이어 마시고, 땅 위에 있는 세상의 모든 나라들도 마실 것입니다. 그들 뒤에는 셰샤크 왕이 마실 것입니다.[a]
