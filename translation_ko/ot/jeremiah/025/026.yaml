  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י הַ/צָּפ֗וֹן הַ/קְּרֹבִ֤ים וְ/הָֽ/רְחֹקִים֙ אִ֣ישׁ אֶל אָחִ֔י/ו וְ/אֵת֙ כָּל הַ/מַּמְלְכ֣וֹת הָ/אָ֔רֶץ אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וּ/מֶ֥לֶךְ שֵׁשַׁ֖ךְ יִשְׁתֶּ֥ה אַחֲרֵי/הֶֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/026.yaml
  text: and all the kings of the north[a], both near and far, each one with his brother, and all the kingdoms of the earth that are on the face of the ground. And the king of Sheshach will drink after them.
  footnotes:
  - marker: a
    text: Sheshach is widely understood as a cryptic name for Babylon, likely using an atbash-style cipher.
    reason: alternative_reading
translation:
  language: ko
  text: 북쪽의 모든 왕들, 곧 가까운 이들과 먼 이들이 서로 뒤이어 마시고, 땅 위에 있는 세상의 모든 나라들도 마실 것입니다. 그들 뒤에는 셰샤크 왕이 마실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 셰샤크는 대개 바빌론을 가리키는 암호명으로 이해됩니다. 아트바시(Atbash)식 글자 치환 암호를 사용한 명칭으로 보는 견해가 널리 받아들여집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְכֵי הַצָּפוֹן
  english_pob_choice: the kings of the north
  chosen_korean: 북쪽의 모든 왕들
  alternatives_korean:
  - 북방의 왕들
  - 북쪽 왕들
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 살리면서도 한국어에서는 자연스럽게 ‘북쪽의 왕들’로 옮겼습니다. ‘모든’을 앞에 두어 전체성을 분명히 했습니다.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  english_pob_choice: near and far
  chosen_korean: 가까운 자와 먼 자
  alternatives_korean:
  - 가까운 이들과 먼 이들
  - 가까이 있는 자와 멀리 있는 자
  lexicon: HALOT
  rationale: 짝을 이루는 관용적 표현이므로, 거리의 양극을 단순하고 대칭적으로 살렸습니다.
- source_word: אִישׁ אֶל אָחִיו
  english_pob_choice: each one with his brother
  chosen_korean: 각기 그의 형제와 함께
  alternatives_korean:
  - 서로
  - 하나씩 서로
  lexicon: HALOT
  rationale: 문맥상 혈연을 말하기보다 개별적 대응과 병렬을 나타내는 표현이어서, POB의 문맥판단을 반영하되 한국어에서는 ‘각기’와 ‘함께’로 순서를 살렸습니다.
- source_word: שֵׁשַׁךְ
  english_pob_choice: Sheshach
  chosen_korean: 셰샤크
  alternatives_korean:
  - 세샤크
  - 바빌론
  lexicon: HALOT
  rationale: 본문의 암호화된 고유명사를 그대로 음역했습니다. ‘바빌론’으로 풀어쓰면 본문이 가진 암시성을 지워버리므로 주석으로만 처리하는 것이 적절합니다.
theological_decisions:
- issue: 셰샤크의 정체를 본문에서 해석할 것인가, 유지할 것인가
  chosen_reading: 본문에는 ‘셰샤크’를 그대로 두고, 독자가 해독적 배경을 추적할 수 있도록 암시성 자체를 보존했습니다.
  alternative_readings:
  - 본문에 ‘바빌론’으로 직접 번역
  - 각주 없이 음역만 유지
  rationale: 히브리어는 שֵׁשַׁךְ를 사용하므로, 번역문이 이를 곧바로 바빌론으로 치환하면 원문이 선택한 우회적 표현을 제거하게 됩니다. 다만 의미 이해를 위해 주석은 필요합니다.
  doctrine_reference: 원문 형식 보존과 암시적 표현의 신학적·수사학적 긴장 유지
