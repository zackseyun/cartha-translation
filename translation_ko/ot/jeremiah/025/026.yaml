    issue: 주절 동사와 ‘셰샤크 왕’의 관계가 불명확합니다.
    rationale: 초안에서는 ‘모든 나라들이 마실 것입니다’로 문장이 끝난 뒤 ‘그 뒤에 셰샤크 왕이 마실 것입니다’가 독립 문장처럼 놓여, 히브리어의 ‘그들 뒤에’가 가리키는 앞선 열거 전체와의 순서 관계가 약화됩니다.
  - severity: medium
    issue: ‘각기 그의 형제와 함께’가 אִישׁ אֶל־אָחִיו를 혈연 관계로 오해하게 합니다.
    rationale: 이 문맥의 표현은 열거된 대상들의 연속 또는 상호 관계를 나타내는 관용적 용법으로 이해하는 것이 자연스럽습니다. ‘서로 뒤이어’는 문맥상의 순서를 분명히 하면서 불필요한 혈연 의미를 피합니다.
