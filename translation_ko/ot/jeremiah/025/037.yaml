source:
  edition: WLC
  text: וְ/נָדַ֖מּוּ נְא֣וֹת הַ/שָּׁל֑וֹם מִ/פְּנֵ֖י חֲר֥וֹן אַף יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/037.yaml
  text: And the peaceful pastures are laid waste because of the burning anger of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'the pastures of peace'; the Hebrew phrase is more literally 'pastures of peace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 평화로운 목초지들이 야훼의 타오르는 진노 때문에 황폐해집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화의 목초지들’입니다. 히브리어 표현은 더 문자적으로는 ‘평화의 목초지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָדַמּוּ
  english_pob_choice: are laid waste
  chosen_korean: 황폐해집니다
  alternatives_korean:
  - 파괴됩니다
  - 폐허가 됩니다
  - 적막해집니다
  lexicon: HALOT
  rationale: Niphal형은 단순한 ‘잠잠해짐’보다 심판으로 인한 황폐를 가리키므로, 결과 상태를 자연스럽게 드러내는 ‘황폐해집니다’가 가장 적절합니다.
- source_word: נְאוֹת
  english_pob_choice: pastures
  chosen_korean: 목초지들
  alternatives_korean:
  - 초장들
  - 풀밭들
  - 초지들
  lexicon: HALOT
  rationale: 이 단어는 예레미야의 목가적 문맥에서 방목지·목초지를 뜻하므로, 현대 한국어에서 의미가 분명한 ‘목초지들’로 옮겼습니다.
- source_word: הַשָּׁלוֹם
  english_pob_choice: peaceful
  chosen_korean: 평화로운
  alternatives_korean:
  - 평강의
  - 평화의
  - 안전한
  lexicon: HALOT
  rationale: 직역인 ‘평화의 목초지들’도 가능하지만, 문맥상 ‘평화롭게 유지되던’ 상태를 나타내므로 형용사형 ‘평화로운’이 원문의 의미를 더 자연스럽게 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 사각형 문자 יהוה는 호칭이 아니라 고유한 하나님의 이름이므로, 본 역본의 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 음역하여 하나님의 언약적 고유명을 드러냅니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’ 사용
  rationale: 본문은 제목이 아니라 신명기적·예언자적 심판의 주체로서 하나님의 고유 이름을 사용하므로, 대체 호칭보다 직접 표기가 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
