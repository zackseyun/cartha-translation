  to: 그날 야훼에게 죽임을 당한 자들은[a] 땅의 한 끝에서 다른 끝까지[b] 있을 것입니다. 그들은 애도되지도, 수습되지도, 매장되지도 않을 것이며, 땅 위에서[c] 거름이 될 것입니다.
  rationale: 원문의 의미와 심판 선언의 엄숙한 어조를 유지하면서, 어색한 직역투를 현대 표준 한국어 합쇼체로 바로잡았습니다. 또한 각주를 실제로 해당하는 본문 어구에 연결하고, 불필요하거나 부정확한 ‘애곡’ 각주를 원문의 지면 표현 각주로 대체했습니다.
