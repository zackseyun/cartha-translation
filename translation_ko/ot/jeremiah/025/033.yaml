id: JER.25.33
reference: Jeremiah 25:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֞וּ חַֽלְלֵ֤י יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ לֹ֣א יִסָּפְד֗וּ וְ/לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/033.yaml
  text: And the slain of Yahweh on that day will be from one end of the earth even to the other end of the earth[a]. They will not be mourned, or gathered, or buried[c][b]; they will become dung on the surface of the ground.
  footnotes:
  - marker: a
    text: Or 'those slain by the LORD.' The Hebrew phrase can make the LORD’s agency in the slaughter more explicit.
    reason: alternative_reading
  - marker: b
    text: Or 'from one end of the land to the other end of the land.' Hebrew אֶרֶץ can mean 'land' or 'earth'; here 'earth' is preferred because of the oracle’s broad scope.
    reason: lexical_alternative
  - marker: c
    text: Literally 'on the face of the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 야훼의 살해된 자들은 땅 끝에서 땅 끝까지 있게 될 것입니다. 그들은 애곡되지도, 모이지도, 매장되지도 않을 것이며, 땅의 표면에서 거름이 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘땅/나라’로도 읽을 수 있으나, 여기서는 심판의 범위가 넓게 제시되므로 ‘땅’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅의 표면 위에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘애곡되다’입니다. 한국어에서는 문맥상 ‘애도되다’보다 ‘애곡되다’가 장면의 비애를 더 가깝게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַֽלְלֵי יְהוָה
  english_pob_choice: the slain of Yahweh
  chosen_korean: 야훼의 살해된 자들
  alternatives_korean:
  - 야훼의 죽임을 당한 자들
  - 야훼께 살해된 자들
  lexicon: HALOT
  rationale: construct phrase의 압축성과 심판의 수동적 결과를 살리기 위해 ‘살해된 자들’을 택했고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: מִ/קְצֵה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ
  english_pob_choice: from one end of the earth even to the other end of the earth
  chosen_korean: 땅 끝에서 땅 끝까지
  alternatives_korean:
  - 땅의 한 끝에서 다른 끝까지
  - 땅에서 땅까지
  lexicon: HALOT
  rationale: אֶרֶץ의 범위를 문맥상 전 지구적 심판으로 읽어 ‘땅’으로 옮기되, 반복 구조는 한국어 관용에 맞게 ‘땅 끝에서 땅 끝까지’로 응축했습니다.
- source_word: לֹ֣א יִסָּפְד֗וּ וְ/לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ
  english_pob_choice: They will not be mourned, or gathered, or buried
  chosen_korean: 그들은 애곡되지도, 모이지도, 매장되지도 않을 것이며
  alternatives_korean:
  - 그들은 슬퍼하여 울지도, 거두어지지도, 묻히지도 않을 것이며
  - 그들은 애도되지도, 수습되지도, 장사되지도 않을 것이며
  lexicon: HALOT
  rationale: 세 동사의 연쇄를 한국어에서 자연스러운 병렬로 살리면서, 수동적 처리 부재가 드러나도록 ‘애곡되다 / 모이다 / 매장되다’를 선택했습니다.
- source_word: לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ
  english_pob_choice: they will become dung on the surface of the ground
  chosen_korean: 땅의 표면에서 거름이 될 것입니다
  alternatives_korean:
  - 땅 위에서 똥이 될 것입니다
  - 땅 표면에서 분뇨가 될 것입니다
  lexicon: HALOT
  rationale: דֹמֶן은 문자적으로는 거름/분뇨를 뜻하지만, 한국어 성경체에서는 자극성을 지나치게 높이지 않으면서도 수치의 이미지를 보존하는 ‘거름’이 적절합니다.
theological_decisions:
- issue: 이사야적/예언문맥의 심판 범위와 אֶרֶץ의 번역
  chosen_reading: ‘땅’으로 번역해 광범위한 심판을 드러냅니다.
  alternative_readings:
  - ‘땅’ 대신 ‘나라’
  - ‘땅’ 대신 ‘세상’
  rationale: 문맥은 특정 지역보다 야훼의 심판이 전면적임을 강조하므로, ‘땅 끝에서 땅 끝까지’가 원문의 보편성을 가장 잘 전달합니다.
  doctrine_reference: 예언서 심판의 보편성
- issue: 문장 말미의 결과 표현 יִהְיוּ
  chosen_reading: ‘거름이 될 것입니다’
  alternative_readings:
  - ‘거름처럼 될 것입니다’
  - ‘거름으로 변할 것입니다’
  rationale: 히브리어는 비유 표지어 없이 결과 상태를 진술하므로, ‘처럼’을 넣지 않고 결과를 직접 서술하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 원문 결과 서술 보존
