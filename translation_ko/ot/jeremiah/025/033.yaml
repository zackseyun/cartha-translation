review_pass:
  verdict: revise
  source_fidelity: 원문의 חַלְלֵי יְהוָה는 야훼의 심판으로 죽임을 당한 이들을 가리키며, ‘야훼의 살해된 자들’보다 ‘야훼에게 죽임을 당한 자들’이 한국어에서 그 관계를 정확하고 자연스럽게 드러냅니다. מִקְצֵה...וְעַד קְצֵה...는 ‘땅의 한 끝에서 다른 끝까지’로 반복과 범위를 보존했습니다. 시신 처리의 세 수동태는 ‘애도되다, 수습되다, 매장되다’로 옮겼으며, לְדֹמֶן...יִהְיוּ의 결과 표현은 비유 표지를 보태지 않고 ‘거름이 될 것입니다’로 유지했습니다.
  naturalness: 초안의 ‘있게 될 것입니다’, ‘애곡되지도’, ‘모이지도’는 현대 한국어 합쇼체에서 각각 부자연스럽거나 시신 수습 문맥을 충분히 전달하지 못합니다. 이를 ‘있을 것입니다’, ‘애도되지도’, ‘수습되지도’로 고쳤습니다. ‘땅 위에서’는 ‘땅의 표면에서’보다 자연스럽지만 원문의 지면 위라는 구체성은 유지합니다.
  terminology: ‘야훼’는 프로젝트의 신명 표기를 따랐습니다. ‘거름’은 דֹמֶן의 수치스럽고 비참한 이미지를 한국어 성경 문체 안에서 유지하는 관습적 표현입니다. ‘애도’, ‘수습’, ‘매장’은 격식 있는 현대 표준어이며 본문의 장례 부재의 연쇄를 명확히 합니다.
  issues:
  - severity: medium
    issue: ‘야훼의 살해된 자들’의 소유격 표현
    rationale: 한국어의 ‘야훼의’는 소유 또는 야훼 자신이 살해되었다는 관계로 잠시 오해될 여지가 있고, ‘살해된 자들’도 다소 번역투입니다. 수동적 심판 관계를 명료하게 하는 표현이 필요합니다.
  - severity: medium
    issue: 시신 처리 동사의 자연성
    rationale: ‘애곡되다’와 특히 ‘모이다’는 이 문맥에서 자연스럽지 않습니다. 원문의 ‘애도받지 않음, 시신이 거두어지지 않음, 매장되지 않음’을 ‘애도되지도, 수습되지도, 매장되지도’로 표현하는 것이 적절합니다.
  - severity: low
    issue: 각주의 위치 및 내용 불일치
    rationale: 초안의 각주 c는 본문에 이미 번역된 ‘애곡’을 다시 직역으로 설명하고, 지면 관련 각주는 본문 말미에 한꺼번에 붙어 있어 해당 어구와의 연결이 불명확합니다. 각주를 해당 어구에 직접 연결하고 원문의 실제 번역 대안을 설명해야 합니다.
