reference: Jeremiah 25:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁלַח֩ יְהוָ֨ה אֲלֵי/כֶ֜ם אֶֽת כָּל עֲבָדָ֧י/ו הַ/נְּבִאִ֛ים הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/לֹֽא הִטִּיתֶ֥ם אֶֽת אָזְנְ/כֶ֖ם לִ/שְׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/004.yaml
  text: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
  footnotes:
  - marker: a
    text: 'Hebrew: ''rising early and sending'' — an idiom expressing repeated, earnest sending of the prophets.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 여러분에게 자신의 모든 종들인 예언자들을 보내셨고, 일찍 일어나 그들을 거듭 보내셨지만[a], 여러분은 듣지 않았으며 귀를 기울여 듣지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘일찍 일어나 보내다’는 예언자들을 거듭하여 간절히 보내셨다는 뜻을 나타내는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 언약적 고유명은 한국어 표준 학술 표기인 ‘야훼’로 옮겨, 일반적인 대체호칭인 ‘주님’과 구별했습니다.
- source_word: עֲבָדָי/ו
  english_pob_choice: all his servants
  chosen_korean: 자신의 종들
  alternatives_korean:
  - 자신의 노예들
  - 자신의 종들인
  lexicon: HALOT
  rationale: 예언자들을 지칭하는 관용구에서 עבדים은 예속 상태보다 하나님의 위임받은 종이라는 기능이 핵심이므로, ‘종들’로 옮겼습니다.
- source_word: הַנְּבִאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들
  alternatives_korean:
  - 선지자들
  - 예언자들
  lexicon: HALOT
  rationale: 히브리어 נביאים의 직역에 가까우면서도 현대 한국어에서 이해 가능한 ‘예언자들’을 택했습니다.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  english_pob_choice: rising early and sending them
  chosen_korean: 이른 아침부터 보내셨습니다
  alternatives_korean:
  - 부지런히 보내셨습니다
  - 계속해서 보내셨습니다
  - 이른 아침에 일어나 보내셨습니다
  lexicon: HALOT
  rationale: 반복적이고 간절한 파견을 나타내는 관용구를 한국어에서 자연스럽게 드러내기 위해 시간표현을 살리되, 반복성은 동사 형태로 완화해 표현했습니다.
- source_word: וְלֹא שְׁמַעְתֶּם / וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם לִשְׁמֹעַ
  english_pob_choice: but you did not listen, nor did you incline your ear to hear
  chosen_korean: 듣지 않았고, 귀를 기울여 듣지도 않았습니다
  alternatives_korean:
  - 듣지 않았고, 귀를 기울이지도 않았습니다
  - 말씀을 듣지 않았고, 귀를 기울여 들으려 하지도 않았습니다
  lexicon: HALOT
  rationale: שׁמע와 귀를 ‘기울이다’는 히브리어 청종 관용구를 현대 한국어의 자연스러운 중첩 표현으로 살려, 단순 청각이 아니라 응답적 청종의 거절을 드러냈습니다.
theological_decisions:
- issue: 예언자들의 반복 파견을 나타내는 관용구의 처리
  chosen_reading: ‘이른 아침부터 보내셨습니다’로 옮겨 하나님의 성실하고 끈질긴 경고를 드러냈습니다.
  alternative_readings:
  - ‘계속해서 보내셨습니다’
  - ‘일찍 일어나 보내셨습니다’
  rationale: 원문은 단순한 시간 정보가 아니라 반복적·열심 있는 파견을 강조하므로, 한국어에서도 그 긴박성과 지속성을 보존하는 번역이 필요합니다.
  doctrine_reference: 예언자적 경고의 반복성과 하나님의 인내에 대한 본문 신학
