  text: וְ/הָיָ֣ה כִ/מְלֹ֣אות שִׁבְעִ֣ים שָׁנָ֡ה אֶפְקֹ֣ד עַל מֶֽלֶךְ בָּבֶל֩ וְ/עַל הַ/גּ֨וֹי הַ/ה֧וּא נְאֻם יְהוָ֛ה אֶת עֲוֺנָ֖/ם וְ/עַל אֶ֣רֶץ כַּשְׂדִּ֑ים וְ/שַׂמְתִּ֥י אֹת֖/וֹ לְ/שִֽׁמְמ֥וֹת עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/012.yaml
  text: And when seventy years are completed[a], I will punish the king of Babylon and that nation—oracle of Yahweh—for their iniquity, and the land of the Chaldeans[b], and I will make it an everlasting desolation.
  footnotes:
  - marker: a
    text: Or 'declares the LORD' for 'oracle of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'desolations forever'; the English singular 'desolation' renders the Hebrew plural idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 칠십 년이 다 차면[a], 내가 바빌론 왕과 그 민족과 갈대아 땅을—야훼의 말씀입니다—그들의 죄악 때문에 벌하고, 그 땅을 영원히 황폐하게 만들겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘칠십 년이 다 차면’이라는 시간 완료 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 직역하면 ‘영원한 황폐들’입니다. 복수형은 지속적이고 철저한 황폐를 나타내는 관용적 표현으로, 한국어에서는 단수 상태 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִמְלֹאות
  english_pob_choice: And when ... are completed
  chosen_korean: 그리고 ...이 차면
  alternatives_korean:
  - 그리고 ...이 완료되면
  - 그리고 ...이 다 차면
  lexicon: HALOT
  rationale: ‘만기/충만’의 시점을 나타내는 표현으로, 70년이 ‘다 차는’ 때를 자연스럽게 살리면서 원문의 시간 조건을 보존합니다.
- source_word: אֶפְקֹד עַל
  english_pob_choice: I will punish
  chosen_korean: 나는 ...를 벌하고
  alternatives_korean:
  - 나는 ...를 심판하고
  - 나는 ...에 대하여 벌을 내리고
  lexicon: HALOT
  rationale: 판결적 방문의 의미를 한국어에서 가장 직설적으로 드러내는 말은 ‘벌하다’이며, 여기서는 심판적 뉘앙스를 유지하는 것이 적절합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: oracle of Yahweh
  chosen_korean: —야훼의 말씀입니다—
  alternatives_korean:
  - —야훼의 선언입니다—
  - —야훼께서 말씀하십니다—
  lexicon: HALOT
  rationale: 예언 공식을 한국어에서 문장 안 삽입구로 처리해 원문의 화자 표지를 드러냈습니다. ‘말씀입니다’는 공식성을 유지하면서도 현대 한국어로 자연스럽습니다.
- source_word: לְשִׁמְמֹות עוֹלָם
  english_pob_choice: an everlasting desolation
  chosen_korean: 영원한 황폐
  alternatives_korean:
  - 영원한 황무지
  - 영구한 황폐
  lexicon: HALOT
  rationale: 히브리어의 복수형 관용을 영어처럼 단수 명사로 옮긴 POB의 판단을 따르되, 한국어에서는 ‘황폐’가 상태를 가장 간결하게 전달합니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 언약명 יְהוָה를 음역해 본문에서 직접 드러내며, 예언 공식의 신적 발화성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: נְאֻם יְהוָה의 기능
  chosen_reading: 예언자적 선언 표지로서 문장 내 삽입구로 처리
  alternative_readings:
  - 직역하지 않고 단순 종결어미로 흡수
  - ‘야훼께서 말씀하십니다’로 의역
  rationale: 원문은 단순한 화자 표지가 아니라 예언적 선언 공식을 사용하므로, 한국어에서도 괄호적/대시 삽입으로 구분해 발화 층위를 살리는 것이 더 충실합니다.
  doctrine_reference: 예언서의 공식문구 보존 원칙
