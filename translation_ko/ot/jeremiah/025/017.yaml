base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/017.yaml
  text: So I took the cup from the hand of Yahweh and made all the nations to whom Yahweh had sent me drink[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the hand of the LORD,'' an idiom expressing direct receipt from him.'
    reason: cultural_note
  - marker: b
    text: 'Or ''and gave all the nations to drink''; the Hebrew verb is causative: ''made/caused to drink.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 여호와의 손에서 그 잔을 받아 모든 민족, 곧 여호와께서 나를 그들에게 보내신 자들에게 마시게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '여호와의 손에서'로, 직접 받은 것을 뜻하는 관용 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 '모든 민족에게 마시게 하였다'; 히브리어 동사는 사역형으로 '마시게 하다'의 뜻을 가집니다.
    reason: lexical_alternative
