  source_fidelity: 개정이 필요합니다. 초안의 ‘이는 … 말씀하신 것입니다’는 히브리어 예언 서문의 완료 동사 אָמַר와 지시 부사 כֹה를 설명식 현재 표현으로 바꾸어, 직접 발화 서문의 성격을 다소 약화합니다. 또한 ‘분노의 포도주 잔’은 원문의 ‘잔’과 ‘포도주’를 보존하지만, 현 각주는 본문에 없는 번역 해설일 뿐 영어 POB의 חֵמָה 어휘 대안도 반영하지 못합니다.
  naturalness: ‘야훼, 이스라엘의 하나님께서’는 호격처럼 분리하는 쉼표보다 ‘야훼 이스라엘의 하나님께서’가 자연스럽습니다. ‘내게 이렇게 말씀하셨습니다’와 ‘…에게 그것을 마시게 하라’는 현대 한국어의 공식적 합쇼체에서 자연스럽고 명령의 사역 의미를 분명히 합니다.
  terminology: 야훼, 이스라엘의 하나님, 나라들, 진노는 적절합니다. חֵמָה는 심판 문맥에서 ‘진노’로 옮길 수 있으며, ‘격노’는 유효한 어휘 대안으로 각주에 제시할 수 있습니다. כּוֹס와 הַיַּיִן의 이미지는 본문 ‘포도주 잔’ 자체가 충분히 보존합니다.
