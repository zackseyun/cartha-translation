revisions:
- from: 이는 야훼, 이스라엘의 하나님께서 제게 말씀하신 것입니다. “내 손에서 이 분노의 포도주 잔을 받아, 내가 너를 보내는 모든 나라에게 그것을 마시게 하라.”[a]
  to: 야훼 이스라엘의 하나님께서 내게 이렇게 말씀하셨습니다. “내 손에서 이 진노의 포도주 잔[a]을 받아, 내가 너를 보내는 모든 나라에게 그것을 마시게 하라.”
  rationale: כֹה אָמַר를 ‘이렇게 말씀하셨습니다’로 옮겨 예언적 발화 서문의 직접성과 완료성을 보존했습니다. ‘진노의 포도주 잔’은 כּוֹס와 הַיַּיִן הַחֵמָה의 결합된 심판 은유를 유지하며, 각주는 חֵמָה의 유효한 대안인 ‘격노’를 제시합니다. וְהִשְׁקִיתָה의 히필 사역은 ‘마시게 하라’로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:54Z'
