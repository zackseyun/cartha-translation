  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵלַ֔/י קַ֠ח אֶת כּ֨וֹס הַ/יַּ֧יִן הַ/חֵמָ֛ה הַ/זֹּ֖את מִ/יָּדִ֑/י וְ/הִשְׁקִיתָ֤ה אֹת/וֹ֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר אָנֹכִ֛י שֹׁלֵ֥חַ אוֹתְ/ךָ֖ אֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/015.yaml
  text: 'For thus said Yahweh[a], the God of Israel, to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I am sending you drink it.”'
  footnotes:
  - marker: a
    text: Or “the wine of fury.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼, 이스라엘의 하나님께서 제게 말씀하신 것입니다. “내 손에서 이 분노의 포도주 잔을 받아, 내가 너를 보내는 모든 나라에게 그것을 마시게 하라.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포도주 잔’은 히브리어의 ‘잔’(כּוֹס)과 ‘포도주’(הַיַּיִן) 이미지를 함께 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 하나님의 이름은 학술적 음역인 야훼로 옮겨, 언약적 고유성을 유지했습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: For thus said
  chosen_korean: 이는 … 말씀하신 것입니다
  alternatives_korean:
  - 이는 … 이르셨습니다
  - 이처럼 … 말씀하셨습니다
  lexicon: HALOT
  rationale: 예언 서문의 공식성을 살리면서도 현대 한국어 합쇼체에서 자연스럽게 들리도록 옮겼습니다.
- source_word: הַיַּיִן הַחֵמָה
  english_pob_choice: the wine of wrath
  chosen_korean: 이 분노의 포도주 잔
  alternatives_korean:
  - 이 진노의 포도주 잔
  - 분노의 포도주
  lexicon: HALOT
  rationale: ‘잔’은 앞의 כּוֹס를 받아 살리고, חֵמָה는 판단 맥락상 ‘분노’로 직역해 심판의 비유를 보존했습니다.
- source_word: וְהִשְׁקִיתָה
  english_pob_choice: make ... drink
  chosen_korean: 마시게 하라
  alternatives_korean:
  - 마시도록 하라
  - 마시게 하십시오
  lexicon: HALOT
  rationale: 히필 사역 의미를 한국어의 ‘-게 하다’로 자연스럽게 드러냈습니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 나라
  alternatives_korean:
  - 모든 민족
  - 모든 이방 나라
  lexicon: HALOT
  rationale: 예레미야의 열방 심판 문맥에서 גּוֹיִם은 ‘나라들’이 가장 직접적이므로 그렇게 옮겼습니다.
theological_decisions:
- issue: 하나님의 심판을 나타내는 ‘분노/진노’의 선택
  chosen_reading: ‘분노’로 옮겨 하나님의 심판적 감정을 드러내되, 지나치게 감정적·충동적으로 보이지 않게 했습니다.
  alternative_readings:
  - 진노
  - 노여움
  rationale: 히브리어 חֵמָה는 심판의 맥락에서 강한 격분을 나타내므로, 한국어에서도 그 무게를 유지해야 합니다. ‘진노’도 가능하지만, 이 절에서는 ‘포도주 잔’의 은유와 결합할 때 ‘분노’가 보다 직설적이고 즉각적인 이미지를 줍니다.
  doctrine_reference: 예언서의 심판 언어는 완화하지 않고, 수사적 긴장을 보존합니다.
