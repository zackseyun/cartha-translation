revisions:
- from: 그리고 모든 섞인 무리[a]와 우스 땅의 모든 왕과 블레셋 사람들의 땅의 모든 왕, 곧 아스글론과 가사와 에그론과 아스돗의 남은 자[c][b]에게도 이르러라.
  to: 또 모든 섞인 무리[a]와 우스 땅의 모든 왕과 블레셋 사람들의 땅의 모든 왕과 아스글론과 가사와 에그론과 아스돗의 남은 것[c][b]에게도 그 잔을 마시게 하였습니다.
  rationale: 상위 문맥(25:17)의 지배 동사인 ‘그 잔을 마시게 하였습니다’를 보충하여, 이 절이 심판의 잔을 마시게 한 대상들의 연속 목록이라는 점을 회복했습니다. 히브리어 접속 구조에 맞게 각 항목을 병렬로 연결했고, 아스돗의 ‘남은 것’은 지시 대상이 불확정인 원문의 폭을 유지했습니다. 영어 POB의 각주 순서(c 뒤 b)와 동일하게 본문 앵커도 유지했습니다.
  reviewer_model: gpt-5.6-terra
