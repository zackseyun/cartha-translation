source:
  edition: WLC
  text: וְ/אֵת֙ כָּל הָ/עֶ֔רֶב וְ/אֵ֕ת כָּל מַלְכֵ֖י אֶ֣רֶץ הָ/ע֑וּץ וְ/אֵ֗ת כָּל מַלְכֵי֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/אֶת אַשְׁקְל֤וֹן וְ/אֶת עַזָּה֙ וְ/אֶת עֶקְר֔וֹן וְ/אֵ֖ת שְׁאֵרִ֥ית אַשְׁדּֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/020.yaml
  text: and all the mixed people[a], and all the kings of the land of Uz, and all the kings of the land of the Philistines—Ashkelon, Gaza, Ekron, and the remnant of Ashdod[c][b];
  footnotes:
  - marker: a
    text: Or 'the mixed multitude'; possibly a mixed foreign population rather than a specific ethnic group.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the land of the Philistines'; traditionally 'Philistia.'
    reason: lexical_alternative
  - marker: c
    text: Or 'what remains of Ashdod' or 'the survivors of Ashdod.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 섞인 무리[a]와 우스 땅의 모든 왕과 블레셋 사람들의 땅의 모든 왕, 곧 아스글론과 가사와 에그론과 아스돗의 남은 자[c][b]에게도 이르러라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섞인 무리’; 특정 민족집단이 아니라 혼혈·이주민이 섞인 인구층을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘블레셋 사람들의 땅’입니다. 전통적으로는 ‘블레셋’으로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아스돗에 남은 것’, ‘아스돗의 생존자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶרֶב
  english_pob_choice: the mixed people
  chosen_korean: 섞인 무리
  alternatives_korean:
  - 혼합된 백성
  - 섞인 백성
  - 혼합 무리
  lexicon: HALOT
  rationale: 문맥상 특정 민족명보다 여러 출신이 섞인 집단을 가리키므로, POB의 의미를 살려 ‘섞인 무리’로 옮겼습니다.
- source_word: אֶרֶץ הָעוּץ
  english_pob_choice: the land of Uz
  chosen_korean: 우스 땅
  alternatives_korean:
  - 우스의 땅
  - 우스 지역
  lexicon: HALOT
  rationale: אֶרֶץ의 지리·정치적 뉘앙스를 살리되, 고유지명은 음역하여 ‘우스 땅’으로 옮겼습니다.
- source_word: שְׁאֵרִית אַשְׁדּוֹד
  english_pob_choice: the remnant of Ashdod
  chosen_korean: 아스돗의 남은 자
  alternatives_korean:
  - 아스돗의 남은 것
  - 아스돗의 남은 무리
  - 아스돗의 남은 자들
  lexicon: HALOT
  rationale: שְׁאֵרִית는 단순한 잔여물보다 예언서에서 ‘남은 자/잔존자’의 어감을 갖기 때문에, POB의 ‘remnant’에 맞춰 ‘남은 자’로 번역했습니다.
theological_decisions:
- issue: 지명 목록의 병렬성과 ‘아스돗의 남은 자’의 종말론적 울림
  chosen_reading: 이 절은 심판 대상의 목록을 병렬로 나열하며, 마지막 항목에서 ‘남은 자’ 표현을 통해 재앙 후 잔존 상태를 드러냅니다.
  alternative_readings:
  - 단순히 도시 이름들의 나열로만 읽는 해석
  - ‘남은 자’를 중립적 잔여 의미로 약화시키는 해석
  rationale: 예언서 특유의 심판 목록 안에서 שְׁאֵרִית는 의미가 약한 잔여보다 ‘남아 있는 자’라는 잔존의 뉘앙스를 유지하는 것이 본문 효과를 더 잘 보존합니다.
  doctrine_reference: 예언서의 심판과 잔존(남은 자) 모티프
