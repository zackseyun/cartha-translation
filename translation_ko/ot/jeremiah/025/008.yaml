source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת יַ֕עַן אֲשֶׁ֥ר לֹֽא שְׁמַעְתֶּ֖ם אֶת דְּבָרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/008.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Because you have not listened to my words[b],'
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH of hosts.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'have not obeyed my words.' The Hebrew verb can carry the sense of hearing with obedient response.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 야훼께서 이처럼 말씀하십니다. "너희가 내 말을 듣지 않았기 때문입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ''만군의 야훼.'''
    reason: source_note
  - marker: b
    text: 또는 '내 말에 순종하지 않았기 때문입니다.' 히브리어 동사에는 듣고 응답하는 순종의 뜻이 함께 담길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그래서
  lexicon: HALOT
  rationale: 앞선 책망에 대한 귀결을 나타내는 접속부사로, 합쇼체 문맥에서 가장 자연스럽고 격식 있는 대응입니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의
  - 만군의 주
  lexicon: HALOT
  rationale: 신명기적 호칭인 'hosts'는 '만군'으로 옮기고, 여호와 대체어 대신 신명 표기 원칙에 따라 '야훼'를 유지했습니다.
- source_word: שְׁמַעְתֶּם
  english_pob_choice: have not listened
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 귀를 기울이지 않았습니다
  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 שׁמע는 '듣다/청종하다'의 중의성을 가지지만, כאן은 '내 말'을 직접 목적어로 취하므로 먼저 '듣다'를 살리고, 불순종의 함의는 문맥이 드러내도록 두었습니다.
- source_word: אֶת דְּבָרַי
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 말을
  lexicon: HALOT
  rationale: דְּבָרַי는 단순한 발화 내용으로서 '말'이 자연스럽고, 한국어에서 하나님의 발화를 과도하게 교회화한 '말씀'보다 원문 밀착도가 높습니다.
theological_decisions:
- issue: 동사 '듣다'에 포함된 순종의 함의
  chosen_reading: 표면 번역은 '듣지 않았습니다'로 두고, 불순종의 의미를 주석 없이 본문 맥락에 맡깁니다.
  alternative_readings:
  - 순종하지 않았습니다
  - 청종하지 않았습니다
  rationale: 히브리어 שׁמע는 청각적 수용과 순종을 함께 가질 수 있으나, 원문은 '내 말'과 결합한 직접 진술이므로 한국어 본문에서는 의미를 과도하게 특정하지 않는 편이 더 원문 충실적입니다.
  doctrine_reference: Lexical semantics of שׁמע in prophetic indictment
- issue: 야훼 호칭의 표기
  chosen_reading: '''야훼''를 사용합니다.'
  alternative_readings:
  - 여호와
  - 주
  rationale: POB의 원칙에 따라 신명기 표기인 יְהוָה를 제목성 대체어로 숨기지 않고 음역해, 본문이 지닌 언약적 인격성을 드러냅니다.
  doctrine_reference: POB contested terms — יְהוָה → Yahweh
