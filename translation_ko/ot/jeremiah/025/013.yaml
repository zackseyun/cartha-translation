  to: 내가 그 땅을 거슬러 말한 나의 모든 말씀, 곧 예레미야가 모든 나라를 거슬러 예언한 이 책에 기록된 모든 것을 그 땅에 이루겠습니다.[a][b]
  rationale: 관계절의 목적 대상(‘그 땅을 거슬러’)을 복원하고, 심판 선언을 실제로 시행한다는 동사를 ‘그 땅에 이루겠습니다’로 자연화했습니다. 또한 ‘모든 나라를 거슬러’를 본문에 두되, עַל의 더 넓은 의미 가능성은 각주에서 보존했습니다. 각주 표지는 본문에서 [a][b] 순서로 정확히 유지했습니다.
