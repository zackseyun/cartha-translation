  text: ו/הבאיתי עַל הָ/אָ֣רֶץ הַ/הִ֔יא אֶת כָּל דְּבָרַ֖/י אֲשֶׁר דִּבַּ֣רְתִּי עָלֶ֑י/הָ אֵ֤ת כָּל הַ/כָּתוּב֙ בַּ/סֵּ֣פֶר הַ/זֶּ֔ה אֲשֶׁר נִבָּ֥א יִרְמְיָ֖הוּ עַל כָּל הַ/גּוֹיִֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/013.yaml
  text: And I will bring upon that land all my words that I have spoken against it—all that is written in this book[b][a], which Jeremiah prophesied against all the nations.
  footnotes:
  - marker: a
    text: Or 'concerning all the nations.' The Hebrew preposition can be rendered more broadly, though here the context favors 'against.'
    reason: alternative_reading
  - marker: b
    text: Or 'in this scroll.' The Hebrew word can refer to a written scroll or book.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그 땅을 거슬러 말한 나의 모든 말씀, 곧 예레미야가 모든 나라를 거슬러 예언한 이 책에 기록된 모든 것을 그 땅에 이루겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 나라에 관하여’. 히브리어 전치사는 더 넓은 뜻으로도 옮길 수 있으나, 여기서는 심판의 문맥상 ‘거슬러’가 적절합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘이 두루마리에’. 히브리어 단어는 책이나 두루마리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי / And I will bring
  english_pob_choice: And I will bring
  chosen_korean: 가져오겠습니다
  alternatives_korean:
  - 내리겠습니다
  - 가져다 두겠습니다
  lexicon: HALOT
  rationale: 히필 העתיד의 심판 집행적 뉘앙스를 한국어에서 자연스럽게 살리면서, 뒤의 목적어와 함께 ‘말씀을 현실로 가져옴’의 힘을 드러내기 위해 ‘가져오겠습니다’를 택했습니다.
- source_word: עַל הָאָרֶץ הַהִיא / upon that land
  english_pob_choice: upon that land
  chosen_korean: 그 땅 위에
  alternatives_korean:
  - 그 땅에
  - 그 땅에 대하여
  lexicon: HALOT
  rationale: עַל의 심판 문맥상 ‘위에/위로’가 가장 직접적으로 압박과 임박한 심판을 드러내므로, ‘그 땅 위에’로 옮겼습니다.
- source_word: אֶת כָּל דְּבָרַי ... אֵת כָּל הַכָּתוּב בַּסֵּפֶר הַזֶּה
  english_pob_choice: all my words ... all that is written in this book
  chosen_korean: 내가 말한 모든 내 말을—이 책에 기록된 모든 것을—
  alternatives_korean:
  - 내 모든 말씀을—이 책에 기록된 모든 것을—
  - 내가 선포한 모든 말을—이 책에 적힌 모든 것을—
  lexicon: HALOT
  rationale: ‘דְּבָרַי’의 반복성과 ‘הַכָּתוּב’의 완결성을 함께 살리기 위해 ‘말씀’보다 더 직접적인 ‘말’을 유지했고, ‘기록된’으로 문서성을 드러냈습니다.
- source_word: עַל כָּל הַגּוֹיִם / against all the nations
  english_pob_choice: against all the nations
  chosen_korean: 모든 나라에 대하여
  alternatives_korean:
  - 모든 민족을 향하여
  - 모든 나라를 향해
  lexicon: HALOT
  rationale: 히브리어 עַל과 נבא의 결합은 문맥상 ‘대하여/향하여’도 가능하므로, POB의 ‘against’가 갖는 긴장과 과도한 적대 어조 사이를 조정해 ‘대하여’로 옮겼습니다.
theological_decisions:
- issue: ‘against all the nations’의 대립적 뉘앙스
  chosen_reading: ‘모든 나라에 대하여’로 옮겨 심판의 문맥은 유지하되, 한국어에서 지나치게 선동적으로 들릴 수 있는 ‘대항하여’는 피했습니다.
  alternative_readings:
  - 모든 나라를 향하여
  - 모든 나라를 대하여
  rationale: 예레미야 46–51장의 신탁은 심판 선언이지만 עַל 자체가 언제나 완전한 적대만 뜻하는 것은 아니므로, 본문이 가진 범위를 좁히지 않으면서도 문맥적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it
