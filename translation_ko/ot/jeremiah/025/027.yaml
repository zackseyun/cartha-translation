  yaml_path: translation/ot/jeremiah/025/027.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Drink and become drunk, and vomit, and fall, and do not rise, because of the sword that I am sending among you.’'
  footnotes:
  - marker: a
    text: Or 'and spew' for 'and vomit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. 「만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 마시고 취하며, 토하고 넘어지되, 다시 일어나지 못하게 하십시오. 이는 내가 당신들 가운데로 보내는 칼 때문입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘토하고’에 해당하는 드문 동사는 ‘게우다/토하다’의 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  english_pob_choice: You shall say to them
  chosen_korean: 그들에게 이렇게 말하십시오
  alternatives_korean:
  - 그들에게 말해야 합니다
  - 그들에게 이렇게 말할 것입니다
  lexicon: HALOT
  rationale: 예언자에게 주어진 전달 명령을 한국어의 직접적 명령형으로 살렸고, 문맥상 ‘이렇게’는 뒤따르는 신탁 공식을 자연스럽게 받습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: 공식 명칭을 그대로 반영해 ‘만군의 야훼’로 옮겼고, 프로젝트 기본값인 야훼를 유지했습니다.
- source_word: שְׁתוּ וְשִׁכְרוּ וּקְיוּ וְנִפְלוּ וְלֹא תָקוּמוּ
  english_pob_choice: Drink and become drunk, and vomit, and fall, and do not rise
  chosen_korean: 마시고 취하며, 토하고 넘어지되, 다시 일어나지 못하게 하십시오
  alternatives_korean:
  - 마시고 취하고, 토하고, 넘어지고, 일어나지 마십시오
  - 마시며 취하고 토하며 넘어지되 일어나지 마십시오
  lexicon: HALOT
  rationale: 연속된 명령형의 파괴적 진행을 살리되, 한국어에서는 자연스러운 병렬과 종결을 위해 ‘-되’ 구조를 사용했습니다. ‘토하고’는 POB의 ‘vomit’에 직접 대응합니다.
- source_word: מִפְּנֵי הַחֶרֶב
  english_pob_choice: because of the sword
  chosen_korean: 칼 때문입니다
  alternatives_korean:
  - 칼 때문에입니다
  - 칼 앞에서입니다
  lexicon: HALOT
  rationale: ‘פְּנֵי’의 관용적 인과 의미를 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: בֵּינֵיכֶם
  english_pob_choice: among you
  chosen_korean: 당신들 가운데로
  alternatives_korean:
  - 당신들 가운데
  - 너희 가운데로
  lexicon: HALOT
  rationale: ‘가운데’의 공간적 이미지를 보존하면서, 현대 표준어의 예언 신탁체에 맞게 ‘당신들’을 사용했습니다.
theological_decisions:
- issue: 신탁 공식과 인용부의 높임말 처리
  chosen_reading: 예언자에게는 공손한 명령형 ‘말하십시오’를 쓰고, उद्ध시된 하나님의 직접 발화는 표준적인 선언체로 유지했습니다.
  alternative_readings:
  - 예언자에게도 평서형으로 옮김
  - 인용문 전체를 더 구어적으로 조정함
  rationale: 본문은 전달 명령과 신적 발화를 구분하므로, 한국어에서도 화자층을 구분해 원문의 권위를 보존하는 것이 적절합니다.
  doctrine_reference: 예언서 화행 구조 보존 원칙
- issue: ‘토하고’의 노골성 유지
  chosen_reading: 완곡화하지 않고 ‘토하고’로 직역했습니다.
  alternative_readings:
  - ‘게우고’
  - ‘속을 비우고’
  rationale: 심판의 모욕적·강렬한 이미지를 약화시키지 않기 위해 원문의 육체적 표현을 그대로 살렸습니다.
  doctrine_reference: 원문 강도 보존 원칙
