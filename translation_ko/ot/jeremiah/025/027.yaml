    issue: ‘다시 일어나지 못하게 하십시오’가 וְלֹא תָקוּמוּ의 의미를 사역 명령으로 변경합니다.
    rationale: 원문은 ‘그리고 너희는 일어나지 않을 것이다/일어나지 마라’라는 비사역적 표현이며, ‘못하게 하다’는 원문에 없는 행위자와 사역 의미를 추가합니다. ‘다시’도 원문에 없습니다.
  - severity: low
    issue: 각주 표지가 절 끝에 놓여 있어 ‘토하고’라는 대상 어휘와 직접 연결되지 않습니다.
    rationale: 각주는 희귀 동사 וּקְיוּ의 어휘 선택을 설명하므로 해당 번역어 바로 뒤에 배치해야 합니다.
