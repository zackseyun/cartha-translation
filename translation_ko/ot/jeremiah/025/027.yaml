  verdict: revise
  source_fidelity: 마지막 절의 וְלֹא תָקוּמוּ는 수신자들이 ‘일어나지’ 않는다는 뜻입니다. 초안의 ‘다시 일어나지 못하게 하십시오’는 ‘못하게 하다’라는 사역 구문이 되어, 말하는 이가 그들을 일어나지 못하게 하라는 명령으로 의미를 바꿉니다. 또한 원문에는 ‘다시’가 없습니다. 나머지 명령들의 연쇄, ‘만군의 야훼’, 칼을 ‘가운데로’ 보내신다는 공간적 표현은 대체로 충실합니다.
  naturalness: 합쇼체의 전달 명령과 신탁 인용을 유지하되, 직접 인용 안의 병렬 명령은 ‘마시고 취하고 토하고 넘어지고, 일어나지 마십시오’로 단순하게 연결하는 편이 자연스럽고 원문의 연쇄를 잘 드러냅니다. 각주 표지는 해당 어휘인 ‘토하고’ 바로 뒤에 두는 것이 독자의 이해와 각주 앵커 원칙에 맞습니다.
  terminology: יַהְוֶה는 프로젝트 방침에 따라 ‘야훼’로 유지하고, צְבָאוֹת는 관용적인 ‘만군’으로 옮깁니다. ‘이스라엘의 하나님’과 심판 이미지의 ‘칼’도 적절합니다. בֵּינֵיכֶם는 ‘너희 가운데로’로 옮겨 ‘among/in your midst’의 공간적 뉘앙스를 보존했습니다.
  issues:
