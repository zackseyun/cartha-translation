  source_fidelity: 히브리어의 명령형 연쇄, 목자/양 떼 비유, 심판의 도살과 넘어짐의 이미지는 대체로 충실합니다. 다만 ‘여러분의 도살의 날들’은 한국어에서 수신자들이 도살을 행하는 날로도 읽힐 수 있으므로 문맥상 피동 의미를 밝혀야 합니다. 난해한 וּתְפוֹצוֹתֵיכֶם은 명사적 모호성을 유지하되, 주석에서 불확실성을 설명하는 것이 적절합니다.
  naturalness: 합쇼체는 일관되지만 ‘양 떼의 귀인들이여’와 ‘도살의 날들’은 현대 표준어에서 다소 부자연스럽거나 의미가 불명확합니다. ‘양 떼의 유력자들이여’ 및 ‘여러분이 도살당할 날들이’가 더 자연스럽습니다. 각주 표지는 해당 어구 뒤에 두어야 하며, 모든 표지를 문장 끝에 몰아놓으면 각주의 지시 대상이 불명확합니다.
  terminology: ‘울부짖으십시오’, ‘부르짖으십시오’, ‘티끌 속에서 뒹구십시오’, ‘값진 그릇’은 원문의 강도와 비유를 잘 보존합니다. אַדִּירֵי הַצֹּאן은 목자 은유를 해설적으로 ‘통치자’로 바꾸지 않고 ‘양 떼의 유력자들’로 옮기는 것이 권위의 뜻과 현대적 자연스러움을 함께 살립니다. 각주는 한국어 번역문에 맞게 한국어로 제공해야 합니다.
