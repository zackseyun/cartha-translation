id: JER.25.34
reference: Jeremiah 25:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵילִ֨ילוּ הָ/רֹעִ֜ים וְ/זַעֲק֗וּ וְ/הִֽתְפַּלְּשׁוּ֙ אַדִּירֵ֣י הַ/צֹּ֔אן כִּֽי מָלְא֥וּ יְמֵי/כֶ֖ם לִ/טְב֑וֹחַ וּ/תְפוֹצ֣וֹתִי/כֶ֔ם וּ/נְפַלְתֶּ֖ם כִּ/כְלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/034.yaml
  text: Wail[a], you shepherds, and cry out; roll in the dust, you lords of the flock, for the days of your slaughter are fulfilled[b], and your dispersions have come[e][d][c], and you will fall like a precious vessel.
  footnotes:
  - marker: a
    text: Or 'Howl, shepherds.' The Hebrew verb denotes loud lamentation.
    reason: lexical_alternative
  - marker: b
    text: Or 'wallow yourselves'; the Hebrew likely refers to a mourning gesture of rolling in dust or ashes.
    reason: cultural_note
  - marker: c
    text: Or 'leaders/nobles of the flock' for 'lords of the flock.'
    reason: lexical_alternative
  - marker: d
    text: The Hebrew of 'your dispersions have come' is difficult; it may refer to your being scattered.
    reason: alternative_reading
  - marker: e
    text: Or 'like a desirable/choice vessel.' The image is of something valued yet liable to be shattered.
    reason: lexical_alternative
translation:
  language: ko
  text: “울부짖으십시오, 목자들이여! 부르짖으십시오! 티끌 속에 몸을 굴리십시오, 양 떼의 귀인들이여. 여러분의 도살의 날들이 다 찼고, 여러분의 흩어짐이 이르렀으며, 여러분은 값진 그릇처럼 쓰러질 것입니다.”[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or ‘Howl, shepherds.’ The Hebrew verb denotes loud lamentation.
    reason: lexical_alternative
  - marker: b
    text: Or ‘wallow yourselves’; the Hebrew likely refers to a mourning gesture of rolling in dust or ashes.
    reason: cultural_note
  - marker: c
    text: Or ‘leaders/nobles of the flock’ for ‘lords of the flock.’
    reason: lexical_alternative
  - marker: d
    text: The Hebrew of ‘your dispersions have come’ is difficult; it may refer to your being scattered.
    reason: alternative_reading
  - marker: e
    text: Or ‘like a desirable/choice vessel.’ The image is of something valued yet liable to be shattered.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 울부짖으십시오
  alternatives_korean:
  - 우십시오
  - 탄식하십시오
  lexicon: HALOT
  rationale: ילל의 강한 애곡·통곡의 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 명령형 호소가 되는 표현을 택했습니다.
- source_word: וְזַעֲקוּ
  english_pob_choice: and cry out
  chosen_korean: 부르짖으십시오
  alternatives_korean:
  - 소리치십시오
  - 외치십시오
  lexicon: HALOT
  rationale: 대비되는 두 번째 절규 동사로서 distress의 큰 외침을 보존하기 위해 ‘부르짖다’를 사용했습니다.
- source_word: וְהִתְפַּלְּשׁוּ
  english_pob_choice: roll in the dust
  chosen_korean: 티끌 속에 몸을 굴리십시오
  alternatives_korean:
  - 먼지 속에 몸을 굴리십시오
  - 재 속에 몸을 굴리십시오
  lexicon: HALOT
  rationale: 애곡과 굴욕의 몸짓이라는 관용구를 직역에 가깝게 풀어, ‘티끌 속에’로 장소감을 살렸습니다.
- source_word: אַדִּירֵי הַצֹּאן
  english_pob_choice: you lords of the flock
  chosen_korean: 양 떼의 귀인들이여
  alternatives_korean:
  - 양 떼의 주인들이여
  - 양 떼의 지도자들이여
  lexicon: HALOT
  rationale: אַדִּירֵי의 높고 권위 있는 어감을 ‘귀인’으로 살리면서, 목자/양 떼 비유를 본문에서 유지했습니다.
- source_word: כִּי מָלְאוּ יְמֵיכֶם לִטְבוֹחַ
  english_pob_choice: for the days of your slaughter are fulfilled
  chosen_korean: 여러분의 도살의 날들이 다 찼고
  alternatives_korean:
  - 여러분의 도살 날이 끝났고
  - 여러분의 살육의 날이 찼고
  lexicon: HALOT
  rationale: לטבוח의 폭력성을 약화하지 않으면서도 한국어 문맥에서 자연스럽게 ‘도살’로 옮겼고, 완료 표현은 ‘다 찼고’로 처리했습니다.
- source_word: וּתְפוֹצוֹתִיכֶם
  english_pob_choice: and your dispersions have come
  chosen_korean: 여러분의 흩어짐이 이르렀으며
  alternatives_korean:
  - 여러분의 분산이 이르렀으며
  - 여러분이 흩어질 때가 이르렀으며
  lexicon: HALOT
  rationale: 난해한 명사형을 ‘흩어짐’으로 옮겨 산문적으로 풀되, POB의 어려운 독법을 그대로 드러냈습니다.
- source_word: כִּכְלִי חֶמְדָּה
  english_pob_choice: like a precious vessel
  chosen_korean: 값진 그릇처럼
  alternatives_korean:
  - 귀한 그릇처럼
  - 소중한 그릇처럼
  - 아름다운 그릇처럼
  lexicon: HALOT
  rationale: חֶמְדָּה의 ‘귀중함/바람직함’을 한국어의 물질적 가치감이 살아 있는 ‘값진’으로 옮겼습니다.
theological_decisions:
- issue: 목자와 양 떼의 귀인들의 비유 유지
  chosen_reading: 본문의 목자/양 떼 이미지를 그대로 살려, 지도자에 대한 해석을 본문 안에 직접 주입하지 않았습니다.
  alternative_readings:
  - 목자들을 ‘지도자들’로 번역
  - 양 떼의 귀인들을 ‘통치자들’로 번역
  rationale: 예레미야의 목자 비유는 통치 엘리트를 가리키지만, 원문이 제시하는 이미지를 보존하는 편이 원문 주도 번역 원칙에 더 잘 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 도살 언어의 강도 유지
  chosen_reading: לטבוח를 완곡하게 돌리지 않고 ‘도살’로 유지했습니다.
  alternative_readings:
  - 죽음
  - 파멸
  - 학살
  rationale: 심판의 폭력성과 긴박성을 약화시키지 않기 위해 원문의 생생한 살육 이미지를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §6
