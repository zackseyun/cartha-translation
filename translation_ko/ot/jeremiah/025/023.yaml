- source_word: קְצוּצֵי פֵאָה
  english_pob_choice: all who clip the corners of their hair
  chosen_korean: 머리카락의 귀퉁이를 깎는 모든 자들
  alternatives_korean:
  - 머리 가장자리를 깎는 모든 자들
  - 귀밑머리를 깎는 모든 자들
  - 모서리를 깎는 모든 자들
  lexicon: HALOT
  rationale: 직역하면 '귀퉁이/모서리'이지만, 한국어에서는 '머리카락의 귀퉁이'가 해당 관용구의 신체 부위를 가장 덜 해치고 드러냅니다. POB의 설명적 처리처럼 의미를 풀되, 특정 수염/옆머리로 단정하지는 않았습니다.
