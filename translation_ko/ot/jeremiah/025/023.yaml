translation:
  language: ko
  text: 그리고 드단과 데마와 부스와, 관자놀이의 털을 깎는 모든 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘관자놀이의 털을 깎은 모든 자들’입니다. 이 표현은 머리 옆부분이나 수염의 가장자리를 밀거나 깎는 풍습을 가리킬 수 있습니다.
    reason: lexical_alternative
