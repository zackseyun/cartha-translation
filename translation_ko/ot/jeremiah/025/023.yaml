  text: and Dedan[a], and Tema, and Buz, and all who clip the corners of their hair,
  footnotes:
  - marker: a
    text: Hebrew literally, 'all the cutters of the corner.' The phrase likely refers to those who shave or clip the hair at the sides; some understand it specifically of the beard.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 드단과 테마와 부스와 머리카락의 귀퉁이를 깎는 모든 자들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘귀퉁이를 깎는 모든 자들’입니다. 이 표현은 머리나 수염의 가장자리를 밀거나 깎는 풍습을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּדָן
  english_pob_choice: Dedan
  chosen_korean: 드단
  alternatives_korean:
  - 데단
  - 다단
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 원문 지시 대상을 가장 직접적으로 보존하므로, 표준 외래어 표기에 맞춰 드단으로 옮겼습니다.
- source_word: תֵּימָא
  english_pob_choice: Tema
  chosen_korean: 테마
  alternatives_korean:
  - 테이마
  - 티마
  lexicon: HALOT
  rationale: 아라비아 지역의 고유명사이므로 음역을 유지했고, 한국어 독자가 읽기 쉬운 표기를 택했습니다.
- source_word: בּוּז
  english_pob_choice: Buz
  chosen_korean: 부스
  alternatives_korean:
  - 부즈
  - 부즈족
  lexicon: HALOT
  rationale: 고유명사이므로 음역했습니다. 한국어 종결음에서 유성 마찰음을 피하고자 부스로 옮겼습니다.
- source_word: קְצוּצֵי פֵאָה
  english_pob_choice: all who clip the corners of their hair
  chosen_korean: 머리카락의 귀퉁이를 깎는 모든 자들
  alternatives_korean:
  - 머리 가장자리를 깎는 모든 자들
  - 귀밑머리를 깎는 모든 자들
  - 모서리를 깎는 모든 자들
  lexicon: HALOT
  rationale: 직역하면 '귀퉁이/모서리'이지만, 한국어에서는 '머리카락의 귀퉁이'가 해당 관용구의 신체 부위를 가장 덜 해치고 드러냅니다. POB의 설명적 처리처럼 의미를 풀되, 특정 수염/옆머리로 단정하지는 않았습니다.
