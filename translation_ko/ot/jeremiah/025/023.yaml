  rationale: 본문은 서술이 아니라 열거이므로, 과도한 해설이나 감정 표현 없이 목록의 리듬을 보존하는 것이 원문의 기능을 잘 드러냅니다.
  doctrine_reference: 예언 본문의 명시적 열거 방식 보존
