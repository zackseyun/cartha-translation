  source_fidelity: 고유명사 열거와 '모든'의 포괄성은 대체로 보존했습니다. 그러나 פֵאָה는 이 관용적 표현에서 단순한 '귀퉁이'라기보다 머리의 측면/관자놀이 부위를 가리키므로, '머리카락의 귀퉁이'는 원문의 신체적 의미를 부정확하고 어색하게 만듭니다. 또한 테마의 한국어 성경 음역으로는 '데마'가 더 확립되어 있습니다.
  naturalness: '''머리카락의 귀퉁이''는 현대 한국어에서 자연스러운 결합이 아닙니다. ''관자놀이의 털을 깎는''은 해당 머리 손질 관습을 자연스럽고 구체적으로 전달하면서도 수염으로 한정하지 않습니다. 이 절은 앞 문맥에 이어지는 열거이므로 종결형은 문맥상 가능하나, 제공된 절 단위 형식을 유지했습니다.'
  terminology: 드단, 데마, 부스로 고유명사를 음역했습니다. '관자놀이의 털'은 פֵאָה의 문맥상 의미를 반영하며, 각주에서 머리 옆부분 또는 수염 가장자리라는 해석상 범위를 밝혀 모호성을 보존합니다.
