  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה בָ/עִ֜יר אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלֶ֗י/הָ אָֽנֹכִי֙ מֵחֵ֣ל לְ/הָרַ֔ע וְ/אַתֶּ֖ם הִנָּקֵ֣ה תִנָּק֑וּ לֹ֣א תִנָּק֔וּ כִּ֣י חֶ֗רֶב אֲנִ֤י קֹרֵא֙ עַל כָּל יֹשְׁבֵ֣י הָ/אָ֔רֶץ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/029.yaml
  text: For behold[a], in the city over which my name is called, I am beginning to bring harm, and shall you indeed go unpunished? You shall not go unpunished, for I am calling for a sword against all the inhabitants of the earth[b], declares Yahweh of hosts.
  footnotes:
  - marker: a
    text: Or 'in the city that is called by my name.' The Hebrew idiom is literally 'the city over which my name is called.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the inhabitants of the land.' Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'earth' is taken as the broader sense in context.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 내 이름이 불리는 그 성읍에서 내가 벌써부터 재앙을 내리기 시작하였는데, 너희가 정말로 벌을 면하겠느냐? 너희는 반드시 벌을 면하지 못할 것이다. 이는 내가 땅의 모든 주민에게 칼을 부르고 있기 때문이다. 만군의 야훼의 말씀이니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘내 이름이 그 위에 불린 성읍’입니다.
    reason: source_note
  - marker: b
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘지방’이 될 수 있으나, 여기서는 문맥상 더 넓은 범위의 ‘땅’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָעִיר אֲשֶׁר נִקְרָא שְׁמִי עָלֶיהָ
  english_pob_choice: in the city over which my name is called
  chosen_korean: 내 이름이 불리는 그 성읍에서
  alternatives_korean:
  - 내 이름이 그 위에 불린 성읍에서
  - 내 이름으로 불리는 그 성읍에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 소속·표지 의미를 살리되, 한국어에서는 자연스럽게 ‘내 이름이 불리는’으로 옮겨 원문의 관계를 유지했습니다.
- source_word: מֵחֵל לְהָרַע
  english_pob_choice: am beginning to bring harm
  chosen_korean: 벌써부터 재앙을 내리기 시작하였는데
  alternatives_korean:
  - 해를 내리기 시작하였는데
  - 재난을 내리기 시작하였는데
  lexicon: HALOT
  rationale: 시작의 뉘앙스를 살리기 위해 ‘…기 시작하였는데’를 사용했고, רעה는 여기서 도덕적 ‘악’이 아니라 심판의 재앙·해악이므로 ‘재앙을 내리다’로 옮겼습니다.
- source_word: הִנָּקֵה תִנָּקוּ / לֹא תִנָּקוּ
  english_pob_choice: shall you indeed go unpunished? / You shall not go unpunished
  chosen_korean: 정말로 벌을 면하겠느냐? / 반드시 벌을 면하지 못할 것이다
  alternatives_korean:
  - 정말로 무죄로 풀려나겠느냐? / 무죄로 풀려나지 못할 것이다
  - 정말로 형벌을 피하겠느냐? / 형벌을 피하지 못할 것이다
  lexicon: HALOT
  rationale: נקה의 법정적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘벌을 면하다’를 택해, 수사 의문과 단정 부정을 같은 표현으로 대응시켰습니다.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all the inhabitants of the earth
  chosen_korean: 땅의 모든 주민
  alternatives_korean:
  - 온 땅의 모든 주민
  - 그 땅의 모든 주민
  lexicon: HALOT
  rationale: 이 문맥의 심판 범위가 보편적으로 확장되므로 ‘earth’를 반영해 ‘땅’으로 옮겼고, ‘주민’은 יֹשְׁבֵי의 거주자 뜻을 살렸습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주 야훼
  lexicon: HALOT
  rationale: 공인 표기 원칙에 따라 신명은 ‘야훼’로 옮기고, צְבָאוֹת은 군대의 개념을 흐리지 않도록 전통적 의미인 ‘만군’으로 처리했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 언약명은 예배적 대체어보다 원음 반영이 더 직접적이므로, 청중이 본문의 신적 발화를 분명히 인식하도록 ‘야훼’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 하나님이 ‘재앙/해’를 내리신다는 표현의 의미
  chosen_reading: 재앙을 내리다
  alternative_readings:
  - 악을 행하다
  - 해를 내리다
  rationale: 히브리어 רעה는 심판 문맥에서 도덕적 악행이 아니라 재난·해악을 가리킬 수 있으므로, 하나님을 도덕적으로 악하게 만드는 오해를 피하면서도 심판의 강도를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
