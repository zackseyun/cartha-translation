  text: For many nations and great kings will make even them serve[a], and I will repay them according to their work and according to the work of their hands.
  footnotes:
  - marker: a
    text: Or, more literally, 'for many nations and great kings have served/served themselves with them.' The Hebrew wording is compressed; in context it most likely means that Babylon will itself be made to serve many nations and great kings.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 나라들과 큰 왕들이 그들마저도 섬기게 될 것이며, 나는 그들의 행실에 따라, 곧 그들의 손이 한 일에 따라 그들에게 갚아 주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 압축적이어서 문자적으로는 ‘많은 나라들과 큰 왕들이 그들과 함께/그들에 대해 섬겼다’에 가깝습니다. 문맥상 바벨론이 오히려 여러 나라와 큰 왕들에게 섬김을 받게 된다는 뜻으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְדוּ בָם
