  - 나는 ... 그들에게 보응하겠습니다
  lexicon: HALOT
  rationale: שׁלם의 보응·갚음의 의미를 살려, 심판 맥락에 맞는 ‘갚아 주다’로 옮겼습니다.
- source_word: כְּפָעֳלָם וּכְמַעֲשֵׂה יְדֵיהֶם
  english_pob_choice: according to their work and according to the work of their hands
  chosen_korean: 그들의 행실에 따라, 곧 그들의 손이 한 일에 따라
  alternatives_korean:
  - 그들의 일에 따라, 곧 그들의 손의 일에 따라
  - 그들의 행위에 따라, 곧 그들의 손으로 한 일에 따라
  lexicon: HALOT
  rationale: פעל과 מעשה ידים의 병렬을 한국어에서도 두 겹으로 살리되, 의미상 중복을 피하면서 행위와 구체적 실행을 함께 드러냈습니다.
theological_decisions:
- issue: ‘그들’의 지시 대상과 심판 역전 구조
  chosen_reading: ‘그들’은 문맥상 바벨론/갈대아를 가리키며, 이전에 남을 지배하던 자들이 이제 여러 나라와 왕들에게 종속되는 역전의 심판을 받습니다.
  alternative_readings:
  - 과거에 그들이 여러 나라와 왕들을 섬겼다는 단순 서술
  - 중립적으로 ‘많은 나라와 큰 왕들이 그들을 섬겼다’는 과거 진술
  rationale: 앞선 25:12-14의 바벨론 심판 선언과 맞물려, 이 절은 지배의 반전이라는 예언적 뜻을 전달합니다.
  doctrine_reference: Jer 25:12-14 문맥
