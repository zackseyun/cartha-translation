theological_decisions:
- issue: ‘그들’의 지시 대상과 심판 역전 구조
  chosen_reading: ‘그들’은 문맥상 바벨론/갈대아를 가리키며, 이전에 남을 지배하던 자들이 이제 여러 나라와 왕들에게 종속되는 역전의 심판을 받습니다.
  alternative_readings:
  - 과거에 그들이 여러 나라와 왕들을 섬겼다는 단순 서술
  - 중립적으로 ‘많은 나라와 큰 왕들이 그들을 섬겼다’는 과거 진술
  rationale: 앞선 25:12-14의 바벨론 심판 선언과 맞물려, 이 절은 지배의 반전이라는 예언적 뜻을 전달합니다.
  doctrine_reference: Jer 25:12-14 문맥
