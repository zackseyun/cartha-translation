  rationale: גדולים의 기본값인 ‘큰/큰 자들’의 의미를 살리면서, 권세 있는 통치자들을 가리키는 자연스러운 한국어로 옮겼습니다.
- source_word: וְשִׁלַּמְתִּי לָהֶם
