translation:
  language: ko
  text: 많은 나라들과 강대한 왕들이 그들마저도 섬기게 할 것이며[a], 나는 그들의 행위에 따라, 또 그들의 손으로 한 일에 따라 그들에게 갚겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축적이어서 직역하면 ‘많은 나라들과 강대한 왕들이 그들을 섬겼다/그들을 부려 일했다’ 정도가 될 수 있습니다. 그러나 문맥상 이는 바벨론이 오히려 많은 나라들과 강대한 왕들을 섬기게 될 것이라는 뜻으로 이해하는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
