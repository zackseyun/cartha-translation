id: JER.25.9
reference: Jeremiah 25:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֣י שֹׁלֵ֡חַ וְ/לָקַחְתִּי֩ אֶת כָּל מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם יְהוָ֗ה וְ/אֶל נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶל֮ עַבְדִּ/י֒ וַ/הֲבִ֨אֹתִ֜י/ם עַל הָ/אָ֤רֶץ הַ/זֹּאת֙ וְ/עַל יֹ֣שְׁבֶ֔י/הָ וְ/עַ֛ל כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה סָבִ֑יב וְ/הַ֣חֲרַמְתִּ֔י/ם וְ/שַׂמְתִּי/ם֙ לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה וּ/לְ/חָרְב֖וֹת עוֹלָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/009.yaml
  text: Look[a], I am sending for and taking all the clans of the north, declares Yahweh, and Nebuchadnezzar king of Babylon, my servant, and I will bring them against this land and against its inhabitants and against all these surrounding nations[b]. I will devote them to destruction and make them a horror, a hissing[c], and everlasting ruins.
  footnotes:
  - marker: a
    text: Or 'I will utterly destroy them'; the Hebrew verb can denote putting people or things under the ban, that is, devoting them to destruction.
    reason: lexical_alternative
  - marker: b
    text: '''My servant'' here identifies Nebuchadnezzar as an instrument of the LORD''s purpose, not necessarily as a faithful worshiper.'
    reason: cultural_note
  - marker: c
    text: Or 'a desolation' for 'a horror.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 북쪽의 모든 종족을 불러 모으고 데려올 것이니—야훼의 선언입니다—바빌론 왕 나부쿠드레짜르, 곧 나의 종을 불러 모아 이 땅과 그 주민들, 그리고 이 둘레의 모든 민족들 위에 데려오겠습니다. 내가 그들을 진멸하여 공포가 되게 하고, 조롱거리가 되게 하며, 영원한 황폐가 되게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진멸하다’는 히브리어 חרם의 전용된 멸절 의미를 압축해 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조롱거리’는 ‘hissing’의 반응적·수치적 뉘앙스를 한국어로 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기를 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄사로 읽고, 현대 한국어에서 격식 있고 자연스러운 명령형 ‘보십시오’로 옮겼습니다.
- source_word: מִשְׁפְּחוֹת צָפוֹן
  english_pob_choice: the clans of the north
  chosen_korean: 북쪽의 모든 종족
  alternatives_korean:
  - 북쪽의 모든 씨족
  - 북쪽의 모든 가문
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 단순한 가족보다 더 큰 친족·집단 단위를 가리키므로, 군사적·민족적 뉘앙스를 살리는 ‘종족’을 택했습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 나의 종
  alternatives_korean:
  - 나의 종자
  - 나를 섬기는 자
  lexicon: HALOT
  rationale: נא/עבד의 직접적 의미를 살려 ‘종’으로 옮기되, 여기서는 신실함을 평가하는 표현이 아니라 야훼의 도구라는 표시임을 유지했습니다.
- source_word: וְהַחֲרַמְתִּים
  english_pob_choice: I will devote them to destruction
  chosen_korean: 진멸하여
  alternatives_korean:
  - 완전히 멸하여
  - 저주 아래 두어
  lexicon: HALOT
  rationale: חרם의 전용된 멸절 개념을 살리되, 본문 흐름에서 동사구를 간결하게 처리하기 위해 ‘진멸하다’로 옮겼습니다.
- source_word: לְשַׁמָּה וְלִשְׁרֵקָה
  english_pob_choice: a horror, a hissing
  chosen_korean: 공포가 되게 하고, 조롱거리가 되게 하며
  alternatives_korean:
  - 황폐함이 되게 하고, 히스침이 되게 하며
  - 두려움거리와 휘파람거리가 되게 하며
  lexicon: HALOT
  rationale: 병렬어구의 효과를 한국어로 자연스럽게 풀어, ‘horror’는 사람들의 두려움을 드러내는 ‘공포’, ‘hissing’은 멸망을 비웃는 반응을 살리는 ‘조롱거리’로 옮겼습니다.
- source_word: לְחָרְבוֹת עוֹלָם
  english_pob_choice: everlasting ruins
  chosen_korean: 영원한 황폐
  alternatives_korean:
  - 영원한 폐허
  - 영구한 황폐
  lexicon: HALOT
  rationale: 끝없는 파괴 상태를 나타내는 표현으로서 ‘폐허’보다 상태 중심의 ‘황폐’가 앞선 명사들과 더 잘 맞아떨어집니다.
theological_decisions:
- issue: ‘YHWH’의 한국어 표기
  chosen_reading: 고유명사로서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문 יְהוָה의 인칭적 이름을 보존하여, 단순한 칭호인 ‘주’로 대체하지 않고 본문의 직접성을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 바빌론 왕에게 붙은 ‘나의 종’의 의미
  chosen_reading: 바빌론 왕 나부쿠드레짜르는 야훼의 심판 도구로 불린 것입니다.
  alternative_readings:
  - 그가 신실한 신앙인이라는 평가
  - 언약적 충성의 칭찬
  rationale: 문맥상 이는 신앙적 승인보다 주권적 사용을 뜻하므로, 번역에서도 평가를 덧씌우지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
