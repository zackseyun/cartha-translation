id: JER.25.32
reference: Jeremiah 25:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנֵּ֥ה רָעָ֛ה יֹצֵ֖את מִ/גּ֣וֹי אֶל גּ֑וֹי וְ/סַ֣עַר גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/032.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], disaster is going out from nation to nation[c][b], and a great storm is being stirred up from the farthest parts of the earth.'
  footnotes:
  - marker: a
    text: Or 'calamity.' The Hebrew term can mean 'evil' or 'disaster'; here it refers to destructive judgment, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'from one nation to another.'
    reason: alternative_reading
  - marker: c
    text: Or 'from the remotest parts of the earth' or 'from the ends of the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. 보십시오, 재앙이 나라에서 나라로 나아가고 있고, 땅의 가장 먼 곳에서 큰 폭풍이 일어나고 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’은 히브리어 רָעָה의 문맥상 의미를 따른 번역입니다. 여기서는 도덕적 악이 아니라 심판적 재난을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나라에서 나라로’는 ‘한 나라에서 다른 나라로’라는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘땅의 가장 먼 곳’은 ‘땅의 가장 끝’ 또는 ‘땅의 가장 먼 끝’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이와 같이 말씀하십니다
  - 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식의 격식을 살리되, 현대 한국어 합쇼체에 자연스럽게 맞췄습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: HALOT
  rationale: יהוה는 기본 원칙대로 야훼로, צְבָאוֹת는 ‘of hosts’의 관용적 대응인 ‘만군의’로 옮겨 신적 칭호의 밀도를 유지했습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 화
  lexicon: HALOT
  rationale: 여기서는 도덕적 ‘악’이 아니라 심판으로 닥치는 파국을 가리키므로, 한국어로는 ‘재앙’이 가장 직접적입니다.
- source_word: מִגּוֹי אֶל גּוֹי
  english_pob_choice: from nation to nation
  chosen_korean: 나라에서 나라로
  alternatives_korean:
  - 민족에서 민족으로
  - 한 나라에서 다른 나라로
  lexicon: HALOT
  rationale: 전파·이동의 연속성을 살리기 위해 직역에 가까운 ‘나라에서 나라로’를 택했습니다.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  english_pob_choice: from the farthest parts of the earth
  chosen_korean: 땅의 가장 먼 곳
  alternatives_korean:
  - 땅의 끝에서
  - 땅의 가장 먼 끝에서
  lexicon: HALOT
  rationale: אָמֶץ? 아니라, 관용적으로 ‘땅의 가장 먼 곳’이 원문의 극원적 거리감을 자연스럽게 전달합니다.
theological_decisions:
- issue: רָעָה의 의미를 도덕적 악으로 오해하지 않도록 하는 번역
  chosen_reading: ‘재앙’으로 번역해 심판의 파괴성을 드러냈습니다.
  alternative_readings:
  - 악
  - 재난
  - 화
  rationale: 문맥상 야훼의 심판이 열방 사이로 퍼져 가는 장면이므로, 한국어 ‘악’은 신학적으로 오해를 낳을 수 있습니다. ‘재앙’은 본문의 경고성과 파괴성을 보존합니다.
  doctrine_reference: 원문 우선 원칙; 예언 심판 본문의 의미 보존
