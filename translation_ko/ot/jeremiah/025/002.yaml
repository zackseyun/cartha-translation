  - 선포한
  lexicon: HALOT
  rationale: 예언자적 발화를 나타내면서도, 뒤의 לֵאמֹר를 고려해 ‘말씀한’으로 옮겨 중복을 줄였습니다.
- source_word: עַל כָּל עַם יְהוּדָה
  english_pob_choice: to all the people of Judah
  chosen_korean: 유다의 모든 백성에게
  alternatives_korean:
