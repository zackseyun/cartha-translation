  lexicon: HALOT
  rationale: 앞절의 ‘말씀’에 연결되는 관계절로 처리해 자연스러운 한국어 문장을 만들되, 원문의 연결 구조는 유지했습니다.
- source_word: דִּבֶּר
  english_pob_choice: spoke
  chosen_korean: 말씀한
  alternatives_korean:
