  lexicon: HALOT
  rationale: עַל은 여기서 예언의 대상/청자를 가리키므로 ‘~에게’로 옮겨, POB의 영어 선택인 ‘to’를 반영했습니다.
- source_word: וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: and to all the inhabitants of Jerusalem
  chosen_korean: 예루살렘의 모든 주민들에게
  alternatives_korean:
  - 예루살렘의 모든 거주자들에게
  - 예루살렘에 사는 모든 사람들에게
  lexicon: HALOT
  rationale: יֹשְׁבֵי의 문자적 뜻을 살리면서도 현대 한국어에서 자연스러운 ‘주민’으로 정리했습니다.
theological_decisions:
- issue: 예언 발화의 수신자 표기
  chosen_reading: ‘유다의 모든 백성’과 ‘예루살렘의 모든 주민들’로, 예레미야의 말이 특정 집단을 향한 직접 خطاب임을 분명히 했습니다.
  alternative_readings:
  - ‘유다의 온 백성’
  - ‘유다 백성에게’
  rationale: 본문의 עַל과 וְאֶל의 병렬은 단순한 주제 언급보다 실제 청중 지정을 더 강하게 드러내므로, 이를 한국어에서도 유지했습니다.
  doctrine_reference: 예언서의 언약 백성에 대한 직접적 책망/권면의 문맥
