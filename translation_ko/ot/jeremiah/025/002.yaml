base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/002.yaml
  text: 'which Jeremiah the prophet spoke to all the people of Judah and to all the inhabitants of Jerusalem[b][a], saying:'
  footnotes:
  - marker: a
    text: Or 'that Jeremiah the prophet spoke ...'
    reason: lexical_alternative
  - marker: b
    text: The preposition on 'all the people of Judah' can also be understood as 'concerning' or, in some contexts, 'against'; here it is rendered 'to' because the clause presents Jeremiah's address to Judah and Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 모든 백성과 예루살렘의 모든 주민들에게 말씀한 예언자 예레미야의 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자 예레미야가 … 말한’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 עַל은 여기서 ‘~에 대해’나 ‘~을 향해’로도 이해될 수 있으나, 문맥상 말의 수신자를 가리키므로 ‘~에게’로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: which
  chosen_korean: -의 … 말입니다
  alternatives_korean:
  - 예레미야가 … 말한
