translation:
  language: ko
  text: 「이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. ‘당신 자신을 위하여 두루마리에[a] 내가 당신에게 말한 모든 말을 기록하십시오.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘책에’. 히브리어 סֵפֶר은 기록된 문서를 가리키며, 이 시대적 문맥에서는 흔히 두루마리를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 「야훼, 이스라엘의 하나님께서 이처럼 말씀하십니다」
  alternatives_korean:
  - 「야훼께서 이처럼 말씀하십니다」
  - 「이스라엘의 하나님 야훼께서 이처럼 말씀하십니다」
  lexicon: WLC; POB audit trail
  rationale: 예언자적 전언 공식을 자연스러운 현재형 공문체로 옮기되, POB의 야훼를 유지하고 ‘이스라엘의 하나님’이라는 규정적 호칭을 분명히 살렸습니다.
- source_word: כְּתָב לְךָ
  english_pob_choice: Write for yourself
  chosen_korean: ‘너를 위하여 ... 기록하여라’
  alternatives_korean:
  - ‘자신을 위하여 ... 기록하여라’
  - ‘네가 보관하도록 ... 적어 두어라’
  lexicon: HALOT
  rationale: לְךָ의 자기 관련/수혜적 뉘앙스를 ‘너를 위하여’로 살려, 단순한 대상 표기가 아니라 예레미야 자신의 소명 문서로 쓰라는 뜻을 드러냈습니다.
- source_word: אֶל סֵפֶר
  english_pob_choice: in a scroll
  chosen_korean: 두루마리에
  alternatives_korean:
  - 책에
  - 두루마리 안에
  lexicon: HALOT
  rationale: סֵפֶר을 이 역사적 문맥에서 현대적 ‘책’보다 ‘두루마리’로 옮겨, 기록 매체의 원형을 반영했습니다.
- source_word: כָּל הַדְּבָרִים
  english_pob_choice: all the words
  chosen_korean: 내가 너에게 말한 모든 말
  alternatives_korean:
  - 내가 너에게 한 모든 말
  - 내가 너에게 말한 모든 말씀
  lexicon: HALOT
  rationale: דְּבָרִים를 ‘말’로 옮겨 신적 발화의 구체성을 유지했고, 전통적 교회어인 ‘말씀’보다 원문이 가진 복수형의 직접성을 보존했습니다.
theological_decisions:
- issue: 예언적 인용문의 문체와 직접 명령
  chosen_reading: 직접 인용부 안에서는 2인칭 명령형 ‘기록하여라’를 사용하고, 서두는 존칭 서술형으로 처리했습니다.
  alternative_readings:
  - 전부 서술형으로 평준화
  - 더 격식 있는 ‘기록하십시오’
  rationale: 히브리어 명령문을 화자-청자 관계가 살아 있는 직접 발화로 보존하는 것이 본문의 권위와 긴급성을 더 잘 드러냅니다. 하나님의 직접 화법이므로 본문 바깥 서술과 구분했습니다.
  doctrine_reference: Source-directed prophetic speech representation
