  text: וְ/אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל יִשְׂרָאֵ֖ל וְ/אֶל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/004.yaml
  text: And these are the words that Yahweh spoke concerning Israel and Judah:[a]
  footnotes:
  - marker: a
    text: Or "to Israel and Judah." The Hebrew preposition can be rendered more literally this way, but here it likely introduces words concerning both peoples.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이것들은 야훼께서 이스라엘과 유다에 대하여 말씀하신 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘과 유다에게.” 히브리어 전치사는 더 문자적으로 이렇게 옮길 수 있으나, 여기서는 두 민족에 관한 말씀을 이끄는 용법일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  english_pob_choice: And these
  chosen_korean: 그리고 이것들은
  alternatives_korean:
  - 이것들은
  - 그리고 이 말씀들은
  lexicon: HALOT
  rationale: 접속사 וְ의 연결성을 살려 ‘그리고’로 시작하고, 지시사 אֵלֶּה는 ‘이것들’로 옮겨 히브리어의 도입부 형식을 보존했습니다.
- source_word: הַ/דְּבָרִים
  english_pob_choice: the words
  chosen_korean: 말씀
  alternatives_korean:
  - 말들
  - 사실들
  - 말씀들
  lexicon: HALOT
  rationale: 예언 서문의 공식 표현으로서 דְּבָרִים는 단순한 ‘말들’보다 하나님의 선포를 가리키는 ‘말씀’이 더 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 전통적 대체어가 아니라 고유명사로 처리하여 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: אֶל יִשְׂרָאֵל וְ/אֶל יְהוּדָה
  english_pob_choice: concerning Israel and Judah
  chosen_korean: 이스라엘과 유다에 대하여
  alternatives_korean:
  - 이스라엘과 유다에게
  - 이스라엘과 유다에 관하여
  lexicon: HALOT
  rationale: 예언 머리말의 אֶל은 여기서 직접 대면보다는 두 나라를 대상으로 한 말씀의 주제를 나타내므로, 한국어로는 ‘-에 대하여’가 자연스럽고 원문의 기능을 잘 드러냅니다.
theological_decisions:
- issue: 신명사 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 본문의 고유한 언약명을 보존하기 위해 ‘야훼’를 사용했습니다. 이는 제목이나 호칭으로 완화하지 않고 원문의 신학적 무게를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אֶל과 예언적 머리말의 의미
  chosen_reading: 이스라엘과 유다에 대하여
  alternative_readings:
  - 이스라엘과 유다에게
  - 이스라엘과 유다에
  rationale: 이 절은 직접 명령이나 대화의 도입이 아니라 뒤따르는 예언의 대상/주제를 알리는 표제로 이해하는 것이 문맥상 더 정확합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy over translation tradition'
