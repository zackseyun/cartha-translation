- from: 그리고 이것들은 야훼께서 이스라엘과 유다에 대하여 말씀하신 말씀입니다.[a]
  to: 그리고 이것은 야훼께서 이스라엘과 유다에 대하여 하신 말씀입니다.[a]
  rationale: 원문의 의미와 선택된 해석(이스라엘과 유다에 관한 예언적 표제)을 유지하면서, 중복된 ‘말씀하신 말씀’을 ‘하신 말씀’으로 다듬었습니다. 히브리어 복수 지시사는 한국어에서 자연스러운 집합적 단수 ‘이것은’으로 옮겼습니다. 각주는 אֶל의 문자적 대안을 보존하되 ‘두 민족’이라는 해석적 표현을 원문의 고유명사로 바꾸어 더 직접적으로 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:01Z'
