  source_fidelity: 히브리어의 접속사, 지시 표현, 야훼의 발화, 그리고 이스라엘과 유다를 향한/그들에 관한 대상 표지는 대체로 충실히 반영되었습니다. 다만 אֵלֶּה הַדְּבָרִים를 ‘이것들은 … 말씀하신 말씀입니다’로 옮기면 한국어에서 지시 대상과 서술어가 부자연스럽게 중복됩니다. 집합적 지시 표현인 ‘이것은’은 원문의 복수 ‘이 말씀들’을 자연스러운 한국어로 충실히 나타낼 수 있습니다.
  naturalness: ‘그리고 이것들은 야훼께서 … 말씀하신 말씀입니다’는 ‘말씀’의 중복과 ‘이것들은’의 어색한 호응 때문에 현대 표준 한국어로 매끄럽지 않습니다. ‘그리고 이것은 야훼께서 … 하신 말씀입니다’가 합쇼체의 격식과 예언서 표제의 문체에 자연스럽습니다.
  terminology: ‘야훼’, ‘이스라엘’, ‘유다’, ‘말씀’은 일관되고 적절합니다. אֶל의 문맥상 기능을 ‘~에 대하여’로 처리한 것은 가능한 해석이며, 각주가 문자적 대안인 ‘~에게’를 적절히 보존합니다.
