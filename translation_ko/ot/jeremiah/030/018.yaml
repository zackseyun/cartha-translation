id: JER.30.18
reference: Jeremiah 30:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי שָׁב֙ שְׁבוּת֙ אָהֳלֵ֣י יַֽעֲק֔וֹב וּ/מִשְׁכְּנֹתָ֖י/ו אֲרַחֵ֑ם וְ/נִבְנְתָ֥ה עִיר֙ עַל תִּלָּ֔/הּ וְ/אַרְמ֖וֹן עַל מִשְׁפָּט֥/וֹ יֵשֵֽׁב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/018.yaml
  text: 'Thus says Yahweh: Behold[a], I am restoring the fortunes of the tents of Jacob, and I will have compassion on his dwellings. The city will be rebuilt on its mound, and the palace will stand in its proper place.'
  footnotes:
  - marker: a
    text: Or, 'I am bringing back the captives of the tents of Jacob,' or 'I am restoring Jacob from captivity.' The Hebrew idiom can refer specifically to return from captivity or more broadly to restored fortunes.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「보라, 나는 야곱의 장막들의 형편을 회복하고 그의 거처들을 불쌍히 여기겠습니다. 그 성읍은 그 언덕 위에 다시 세워지고, 그 궁전은 제자리에 서게 될 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 야곱의 장막들의 포로를 되돌리고 있다’ 또는 ‘나는 야곱을 포로에서 회복하고 있다’. 이 히브리어 관용구는 포로 귀환을 가리킬 수도 있고, 더 넓게는 회복된 형편을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC / project default
  rationale: 프로젝트 기본값에 따라 신성호칭을 학술적 음역인 ‘야훼’로 옮겨, 언약적 이름의 식별성을 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보라, 나는
  alternatives_korean:
  - 보십시오, 나는
  - 보라, 내가
  lexicon: HALOT
  rationale: 예언적 선언의 긴박성과 지시성을 살리기 위해 ‘보라’를 사용했고, 뒤의 인칭대명사와 함께 강조를 유지했습니다.
- source_word: שָׁב שְׁבוּת
  english_pob_choice: am restoring the fortunes
  chosen_korean: 형편을 회복하고
  alternatives_korean:
  - 포로들을 되돌리고
  - 포로 상태에서 회복하고
  - 번영을 회복하고
  lexicon: HALOT
  rationale: 이 관용구는 포로 귀환만이 아니라 전반적 회복을 가리킬 수 있으므로, 본문의 회복 의미를 살리되 한국어로 자연스럽게 ‘형편을 회복하다’로 옮겼습니다.
- source_word: מִשְׁכְּנֹתָיו
  english_pob_choice: his dwellings
  chosen_korean: 그의 거처들
  alternatives_korean:
  - 그의 집들
  - 그의 장막들
  - 그의 거류지들
  lexicon: HALOT
  rationale: 장막과 병렬되는 거주 공간이라는 점을 살리면서도 현대 한국어에서 과도하게 특정화되지 않도록 ‘거처들’을 택했습니다.
- source_word: עַל תִּלָּהּ
  english_pob_choice: on its mound
  chosen_korean: 그 언덕 위에
  alternatives_korean:
  - 그 언덕에
  - 그 무너진 더미 위에
  - 그 언덕받이 위에
  lexicon: HALOT
  rationale: תֵּל의 ‘mound’ 의미를 반영하되, 한국어에서 자연스럽고 간결하게 읽히도록 ‘언덕 위’로 처리했습니다.
- source_word: עַל מִשְׁפָּטוֹ יֵשֵׁב
  english_pob_choice: will stand in its proper place
  chosen_korean: 제자리에 서게 될 것입니다
  alternatives_korean:
  - 마땅한 자리에 있게 될 것입니다
  - 정해진 질서대로 놓이게 될 것입니다
  - 제 위치에 자리 잡게 될 것입니다
  lexicon: HALOT
  rationale: מִשְׁפָּט의 ‘정당한 자리/질서’ 의미를 한국어 관용구로 풀어, 궁전의 복원과 질서 회복을 함께 드러냈습니다.
theological_decisions:
- issue: שָׁב שְׁבוּת의 의미 범위
  chosen_reading: 포로 귀환에만 한정하지 않고, 야곱 집안의 전반적 회복을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 포로들의 귀환
  - 포로 상태에서의 회복
  rationale: 문맥이 장막, 거처, 성읍, 궁전의 재건을 함께 말하므로, 단순한 인적 귀환보다 공동체 전체의 회복이라는 넓은 의미를 보존하는 것이 더 적절합니다.
  doctrine_reference: Translation philosophy §3 (의도된 긴장 보존)
