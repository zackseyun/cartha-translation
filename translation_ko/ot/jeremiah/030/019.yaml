- from: 그들 가운데서 감사와 즐거워하는 이들의 소리가 나오며[a], 나는 그들을 번성하게 하겠고 그들은 적지 않을 것이며, 나는 그들을 존귀하게 하겠고 그들은 천하게 되지 않을 것입니다[b].
  to: 그들에게서 감사와 즐거워하는 이들의 소리가 나올 것입니다[a]. 나는 그들을 번성하게 하겠고, 그들은 적지 않을 것입니다. 나는 그들을 존귀하게 하겠고, 그들은 미미해지지 않을 것입니다[b].
  rationale: ‘천하게 되지 않다’를 ‘미미해지지 않다’로 바꾸어 צער의 의미 범위와 כבד와의 대조를 충실히 보존했습니다. 또한 문장 전체를 예언적 미래 합쇼체로 통일하고, 감사와 기쁨의 소리가 ‘그들에게서’ 나온다는 원문의 출처 관계를 명료하게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:23Z'
