  naturalness: 초안은 대체로 자연스럽지만, 절 전반의 예언적 미래 표현과 마지막 ‘않을 것입니다’의 종결을 통일하면 현대 표준 한국어 합쇼체로 더 매끄럽습니다. ‘감사와 즐거워하는 이들의 소리’는 원문의 두 항목을 자연스럽게 유지합니다.
