id: JER.30.19
reference: Jeremiah 30:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָצָ֥א מֵ/הֶ֛ם תּוֹדָ֖ה וְ/ק֣וֹל מְשַׂחֲקִ֑ים וְ/הִרְבִּתִי/ם֙ וְ/לֹ֣א יִמְעָ֔טוּ וְ/הִכְבַּדְתִּ֖י/ם וְ/לֹ֥א יִצְעָֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/019.yaml
  text: From them will come thanksgiving and the sound of those who rejoice[a]; I will multiply them, and they will not be few; I will honor them[b], and they will not be insignificant.
  footnotes:
  - marker: a
    text: Or 'the sound of those who celebrate/play,' since the Hebrew participle can denote festive laughter, play, or merrymaking.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will make them honored, and they will not be small.' The Hebrew uses terms that can refer both to social honor and to smallness/insignificance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데서 감사와 즐거워하는 이들의 소리가 나오며[a], 나는 그들을 번성하게 하겠고 그들은 적지 않을 것이며, 나는 그들을 존귀하게 하겠고 그들은 천하게 되지 않을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘축제하며 노는 이들의 소리’, 히브리어 분사가 축제적 웃음, 놀이, 흥겨운 잔치를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나는 그들을 존귀하게 만들며, 그들은 작지 않을 것입니다.’ 히브리어는 사회적 존귀와 작음/미미함을 모두 가리킬 수 있는 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵהֶם
  english_pob_choice: From them will come
  chosen_korean: 그들 가운데서 … 소리가 나오며
  alternatives_korean:
  - 그들로부터 나올 것이며
  - 그들 가운데서 생겨나며
  lexicon: WLC / HALOT
  rationale: 출처와 기원을 분명히 하면서도 한국어에서 자연스러운 관용으로 ‘그들 가운데서 … 나오다’로 옮겼습니다.
- source_word: תּוֹדָה וְקוֹל מְשַׂחֲקִים
  english_pob_choice: thanksgiving and the sound of those who rejoice
  chosen_korean: 감사와 즐거워하는 이들의 소리
  alternatives_korean:
  - 감사와 즐기는 이들의 소리
  - 감사와 환희의 소리
  lexicon: WLC / HALOT
  rationale: תּוֹדָה는 제의적 ‘감사제’보다 여기서는 감사의 찬양이므로 ‘감사’로, מְשַׂחֲקִים은 축제적 기쁨의 뉘앙스를 살려 ‘즐거워하는 이들’로 옮겼습니다.
- source_word: וְהִרְבִּתִים וְלֹא יִמְעָטוּ
  english_pob_choice: I will multiply them, and they will not be few
  chosen_korean: 나는 그들을 번성하게 하겠고 그들은 적지 않을 것이며
  alternatives_korean:
  - 나는 그들을 많게 하겠고 그들은 적지 않을 것이며
  - 나는 그들을 증가시키겠고 그들은 줄지 않을 것이며
  lexicon: WLC / HALOT
  rationale: ‘multiply’의 결과를 수적으로 분명히 드러내는 동시에, 한국어에서는 ‘번성하다’가 공동체의 증대를 자연스럽게 전달합니다.
- source_word: וְהִכְבַּדְתִּים וְלֹא יִצְעָרוּ
  english_pob_choice: I will honor them, and they will not be insignificant
  chosen_korean: 나는 그들을 존귀하게 하겠고 그들은 천하게 되지 않을 것입니다
  alternatives_korean:
  - 나는 그들을 존귀하게 만들겠고 그들은 작지 않을 것입니다
  - 나는 그들을 높이겠고 그들은 미미하지 않을 것입니다
  lexicon: WLC / HALOT
  rationale: כבד의 ‘무겁게 하다/존귀하게 하다’와 צער의 ‘작다, 하찮다’ 대조를 살려, ‘존귀하게’와 ‘천하게 되지 않다’로 위상 상승의 대비를 유지했습니다.
theological_decisions:
- issue: 번성·존귀의 약속을 어떻게 범주화할 것인가
  chosen_reading: 공동체의 실제적 회복과 공적 존귀를 말하는 예언으로 읽고, 이를 영적 비유나 후대 제도적 의미로 제한하지 않았습니다.
  alternative_readings:
  - 영적 축복으로만 읽기
  - 민족적·정치적 승귀로만 읽기
  rationale: 히브리어 본문은 감사, 기쁨, 번성, 존귀의 병렬로 회복을 묘사하므로, 본문의 범위를 넘지 않으면서도 구체성을 유지하는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
