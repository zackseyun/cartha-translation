id: JER.30.20
reference: Jeremiah 30:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֤וּ בָנָי/ו֙ כְּ/קֶ֔דֶם וַ/עֲדָת֖/וֹ לְ/פָנַ֣/י תִּכּ֑וֹן וּ/פָ֣קַדְתִּ֔י עַ֖ל כָּל לֹחֲצָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/020.yaml
  text: His children will be as in former times[a], and his congregation will be established before me[d][c][b]; and I will punish all his oppressors.
  footnotes:
  - marker: a
    text: Hebrew 'his sons'; here rendered 'his children' in a collective sense for descendants.
    reason: lexical_alternative
  - marker: b
    text: Or 'as of old' / 'as before.'
    reason: lexical_alternative
  - marker: c
    text: Or 'assembly' or 'community.'
    reason: lexical_alternative
  - marker: d
    text: The singular 'his' likely personifies Jacob/Israel as a corporate whole.
    reason: cultural_note
translation:
  language: ko
  text: 그의 자녀들은 예전과 같을 것이며[a][b], 그의 회중은 내 앞에 굳게 세워질 것이며[d][c], 내가 그의 모든 억압자들을 벌하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 아들들’입니다. 여기서는 후손 전체를 가리키는 집합적 의미로 ‘자녀들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘옛적처럼’, ‘옛날과 같이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘공동체’, ‘집회’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 여기의 ‘그의’는 문맥상 야곱/이스라엘을 가리키는 집합적 단수일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָנָיו
  english_pob_choice: his children
  chosen_korean: 그의 자녀들
  alternatives_korean:
  - 그의 아들들
  - 그의 아들 자녀들
  lexicon: HALOT
  rationale: 히브리어 בנים은 문자적으로는 ‘아들들’이지만, 여기서는 회복될 후손 전체를 가리키므로 한국어도 성별을 좁히지 않는 ‘자녀들’이 자연스럽고 원문의 집합적 의미를 살립니다.
- source_word: כְּקֶדֶם
  english_pob_choice: as in former times
  chosen_korean: 예전과 같을 것이며
  alternatives_korean:
  - 옛적처럼
  - 옛날과 같이
  lexicon: HALOT
  rationale: 비교어구의 의미를 살리면서 현대 한국어에서 자연스럽게 들리도록 ‘예전과 같을 것’으로 옮겼습니다.
- source_word: וַעֲדָתוֹ
  english_pob_choice: his congregation
  chosen_korean: 그의 회중
  alternatives_korean:
  - 그의 집회
  - 그의 공동체
  lexicon: HALOT
  rationale: עֵדָה는 단순한 ‘모임’보다 언약적·공적 공동체의 뉘앙스가 있어, POB의 ‘congregation’을 따라 ‘회중’으로 옮겼습니다.
- source_word: תִּכּוֹן
  english_pob_choice: will be established
  chosen_korean: 굳게 세워질 것입니다
  alternatives_korean:
  - 세워질 것입니다
  - 확립될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 ‘세워져 견고해지다’라는 뜻을 살려 단순한 설립보다 안정성과 확정성을 드러내는 표현을 택했습니다.
- source_word: וּפָקַדְתִּי
  english_pob_choice: I will punish
  chosen_korean: 벌할 것입니다
  alternatives_korean:
  - 심판하겠습니다
  - 찾아벌할 것입니다
  lexicon: HALOT
  rationale: פקד는 폭넓지만 여기서는 دشمن에 대한 징벌 문맥이므로, 현대 한국어에서 분명한 ‘벌하다’로 옮겨 심판적 의미를 드러냈습니다.
theological_decisions:
- issue: שלשה 겹 표현에서 단수 소유격('his')의 처리
  chosen_reading: 히브리어의 단수 소유격을 그대로 살려 ‘그의’로 유지하고, 이를 회복된 이스라엘/야곱을 가리키는 집합적 단수로 이해합니다.
  alternative_readings:
  - ‘그들의 자녀들/회중’처럼 복수로 풀어 쓰기
  - 주어를 명시해 ‘야곱의 자녀들’로 확장하기
  rationale: 원문은 단수 소유격을 사용하므로, 해석을 과도하게 풀지 않고 문법적 긴장을 유지하는 편이 본문에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
