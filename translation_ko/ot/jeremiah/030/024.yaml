revisions:
- from: 야훼의 타오르는 분노는 그가 그것을 행하시고, 그의 마음의 목적들을 세우실 때까지 돌이키지 않을 것입니다. 마지막 날들에 너희는 그것을 이해하게 될 것입니다.[a]
  to: 야훼의 타오르는 진노는 그분께서 행하시고 그분 마음에 품으신 계획들을 이루실 때까지 돌이키지 않을 것입니다. 후일에 너희는 이를 깨닫게 될 것입니다.[a]
  rationale: 수정문은 야훼의 진노가 그분의 행동과 마음의 계획들의 성취까지 돌이키지 않는다는 히브리어의 병렬 구문을 유지합니다. ‘후일에’는 예언적 시간 표현의 개방성을 보존하며, ‘마음에 품으신 계획들’과 ‘이를 깨닫게 될 것입니다’는 원문의 의미를 추가하지 않고 현대 한국어 합쇼체로 자연스럽게 다듬습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:16Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 핵심 구조와 의미는 대체로 충실합니다. 그러나 עַד עֲשׂוֹתוֹ 및 וְעַד הֲקִימוֹ는 야훼께서 행동하시고 마음의 계획들을 확립·성취하실 때까지 진노가 돌이키지 않는다는 병렬 구조이므로, 이를 더 분명하고 자연스럽게 드러내는 편이 좋습니다. בְּאַחֲרִית הַיָּמִים은 특정한 종말론적 시점을 단정하지 않는 ‘후일에’로 옮기는 것이 적절합니다.
  naturalness: ‘그의 마음의 목적들’은 한국어에서 다소 직역투이며, ‘마지막 날들에’도 현대 한국어 성경 문맥에서는 어색하고 불필요하게 협소하게 들릴 수 있습니다. ‘그분 마음에 품으신 계획들’, ‘후일에’, ‘이를 깨닫게 될 것입니다’가 현대 표준어 합쇼체에 더 자연스럽습니다.
  terminology: YHWH를 ‘야훼’로 옮긴 것은 일관되고 적절합니다. חֲרוֹן אַף의 생생한 이미지는 ‘타오르는 진노’로 보존할 수 있습니다. מְזִמּוֹת는 이 문맥에서 ‘계획들’이 자연스럽고, 하나님의 뜻을 과도하게 교리적으로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그의 마음의 목적들’이 직역투이며 높임의 일관성이 약합니다.
    rationale: ‘그가 … 행하시고’와 ‘그의’가 한 문장 안에 섞여 있습니다. 또한 한국어에서는 ‘마음의 목적들’보다 ‘마음에 품으신 계획들’이 מְזִמּוֹת לִבּוֹ의 의도적 결심을 자연스럽게 전달합니다.
  - severity: low
    issue: ‘마지막 날들에’는 한국어에서 다소 부자연스럽고 시간 범위를 좁게 들리게 할 수 있습니다.
    rationale: בְּאַחֲרִית הַיָּמִים은 예언적 미래를 가리키지만 정확한 시점을 확정하지 않습니다. ‘후일에’는 이 폭을 유지하면서 자연스럽습니다.
  - severity: low
    issue: ‘그것을 이해하게 될 것입니다’의 지시 대상이 한국어에서 다소 불분명하고 직역적입니다.
    rationale: 히브리어 여성 단수 접미사는 앞서 말한 사태를 가리키는 것으로 볼 수 있습니다. ‘이를 깨닫게 될 것입니다’는 그 포괄적 지시를 자연스럽게 보존합니다.
  revised_text: 야훼의 타오르는 진노는 그분께서 행하시고 그분 마음에 품으신 계획들을 이루실 때까지 돌이키지 않을 것입니다. 후일에 너희는 이를 깨닫게 될 것입니다.[a]
  revised_footnotes:
