id: JER.30.24
reference: Jeremiah 30:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א יָשׁ֗וּב חֲרוֹן֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים תִּתְבּ֥וֹנְנוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/024.yaml
  text: The burning anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart. In the latter days you will understand it.
  footnotes:
  - marker: a
    text: Or 'In the last days' or 'In days to come.' The Hebrew expression can denote the future culmination of God's purposes without specifying the exact timing.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 타오르는 진노는 그분께서 행하시고 그분 마음에 품으신 계획들을 이루실 때까지 돌이키지 않을 것입니다. 후일에 너희는 이를 깨닫게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지막 날들에’ 혹은 ‘다가올 날들에’. 이 히브리어 표현은 야훼의 목적이 완결될 미래를 가리킬 수 있으나, 정확한 시점을 특정하지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרוֹן אַף
  english_pob_choice: burning anger
  chosen_korean: 타오르는 분노
  alternatives_korean:
  - 불타는 분노
  - 격렬한 분노
  - 진노
  lexicon: HALOT
  rationale: ‘분노’에 ‘타오르는’을 붙여 히브리어의 불붙은 분노 이미지를 살리되, 현대 한국어로 자연스럽게 읽히도록 했습니다.
- source_word: יָשׁוּב
  english_pob_choice: will not turn back
  chosen_korean: 돌이키지 않을 것입니다
  alternatives_korean:
  - 되돌아가지 않을 것입니다
  - 그치지 않을 것입니다
  - 멈추지 않을 것입니다
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌아가다/되돌리다’를 살려, 야훼의 분노가 그 목적이 이루어질 때까지 중단되거나 방향을 바꾸지 않는다는 뜻을 보존했습니다.
- source_word: מְזִמּוֹת לִבּוֹ
  english_pob_choice: the purposes of his heart
  chosen_korean: 그의 마음의 목적들
  alternatives_korean:
  - 그의 마음의 계획들
  - 그의 마음의 뜻
  - 그의 마음의 의도들
  lexicon: HALOT
  rationale: מְזִמּוֹת는 계획만이 아니라 목적·의도까지 포함할 수 있어, ‘목적들’로 옮겨 하나님의 내적 결심과 추진 의지를 함께 드러냈습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: In the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 후일에
  - 말세에
  - 훗날에
  lexicon: HALOT
  rationale: 관용적 예언 표현의 폭을 유지하면서도, 한국어에서 너무 교리화된 ‘말세’보다 원문의 시간표현을 비교적 중립적으로 살렸습니다.
- source_word: תִּתְבּוֹנְנוּ בָהּ
  english_pob_choice: you will understand it
  chosen_korean: 너희는 그것을 이해하게 될 것입니다
  alternatives_korean:
  - 너희는 그것을 깨닫게 될 것입니다
  - 너희는 그것을 알게 될 것입니다
  - 너희는 그것을 분별하게 될 것입니다
  lexicon: HALOT
  rationale: 반성적 숙고를 거쳐 도달하는 인식을 나타내므로, ‘이해하다’가 직역적이면서도 문맥상 자연스럽습니다.
theological_decisions:
- issue: 여호와/야훼의 음역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 고유명사이므로, POB 기준에 따라 호칭 ‘주’로 바꾸지 않고 신명기 이름을 직접 옮겼습니다.
  doctrine_reference: 'POB glossary: YHWH → 야훼'
- issue: 예언적 시간표현 בְּאַחֲרִית הַיָּמִים
  chosen_reading: 마지막 날들에
  alternative_readings:
  - 후일에
  - 말세에
  - 이후에
  rationale: 정확한 종말 시점을 단정하지 않고, 하나님의 목적이 완결된 미래라는 예언적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
