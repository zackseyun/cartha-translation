base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/009.yaml
  text: They will serve Yahweh their God and David their king[a], whom I will raise up for them.
  footnotes:
  - marker: a
    text: Or 'a future Davidic king'; many interpreters understand 'David' here as a prophetic reference to the Messiah rather than to David personally.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그들의 하나님 야훼와 내가 그들을 위해 일으킬 그들의 왕 다윗을 섬길 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미래의 다윗 계열 왕’. 많은 해석자는 여기의 ‘다윗’을 다윗 개인이 아니라 메시아를 가리키는 예언적 표현으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ
  english_pob_choice: They will serve
  chosen_korean: 섬길 것입니다
  alternatives_korean:
  - 섬깁니다
  - 예배할 것입니다
  lexicon: HALOT
  rationale: עבד는 기본적으로 ‘섬기다’이며, 언약적 문맥에서는 예배적 섬김까지 포함할 수 있습니다. ‘섬기다’가 그 폭을 가장 잘 보존하고, 단순한 예배로 좁히지 않습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문헌적·원문대조적 기준에 따라 여호와 대신 하나님의 고유명 야훼를 옮겼습니다. 이는 원문이 주는 인칭성과 언약적 정체성을 보존합니다.
- source_word: דָּוִד מַלְכָּם
  english_pob_choice: David their king
  chosen_korean: 그들의 왕 다윗
  alternatives_korean:
  - 다윗 그들의 왕
  - 그들의 다윗 왕
  lexicon: HALOT
  rationale: 히브리어의 명사구를 자연스럽게 살리되, ‘다윗’이라는 이름 자체와 ‘그들의 왕’이라는 왕권 표현을 함께 보존했습니다.
- source_word: אָקִים
  english_pob_choice: I will raise up
  chosen_korean: 일으킬 것입니다
  alternatives_korean:
  - 세울 것입니다
  - 일으켜 세울 것입니다
  lexicon: HALOT
  rationale: קום의 히필은 ‘일으키다/세우다/세워 주다’의 뜻이 가능하며, 여기서는 하나님이 통치자를 일으켜 세우신다는 뜻을 드러내는 ‘일으키다’가 가장 직접적입니다.
theological_decisions:
- issue: ‘다윗’의 의미
  chosen_reading: 본문에는 해석을 덧붙이지 않고 ‘다윗’을 그대로 두었습니다.
  alternative_readings:
  - 미래의 다윗 계열 왕
  - 메시아
  rationale: 히브리어는 문자 그대로 ‘다윗 그들의 왕’이라고 말하므로, 본문 본체에서는 이름을 유지하고 해석 가능성은 각주로 보존하는 것이 원문에 가장 충실합니다.
  doctrine_reference: 예언적 표상을 본문에서 곧바로 해석으로 고정하지 않고, 원문과 신학적 해석의 긴장을 함께 보존합니다.
