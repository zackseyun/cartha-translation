  rationale: 동사 하나가 두 목적어를 함께 받도록 재구성하고, ‘내가 그들을 위해 일으킬’ 관계절을 ‘그들의 왕 다윗’에 직접 연결했습니다. 이로써 히브리어의 문장 구조와 미래 약속의 의미를 보존하면서 자연스러운 현대 한국어 합쇼체로 다듬었습니다. 각주는 본문의 ‘다윗’을 해석으로 대체하지 않은 채 주요 해석 가능성을 보존합니다.
