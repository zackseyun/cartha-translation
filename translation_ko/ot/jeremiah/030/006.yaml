  edition: WLC
  text: שַׁאֲלוּ נָ֣א וּ/רְא֔וּ אִם יֹלֵ֖ד זָכָ֑ר מַדּוּעַ֩ רָאִ֨יתִי כָל גֶּ֜בֶר יָדָ֤י/ו עַל חֲלָצָי/ו֙ כַּ/יּ֣וֹלֵדָ֔ה וְ/נֶהֶפְכ֥וּ כָל פָּנִ֖ים לְ/יֵרָקֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/006.yaml
  text: 'Ask now[a], and see: does a male give birth? Why then do I see every man with his hands on his loins like a woman in labor, and every face turned pale?'
  footnotes:
  - marker: a
    text: Or “turned to a greenish pallor.” The Hebrew term suggests a sickly pale color.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 물어보고 보십시오. 남자가 해산하겠습니까? 그런데도 왜 내가 모든 남자가 자기 손을 허리에 대고 해산하는 여자처럼 있는 것을 보며, 또 모든 얼굴이 창백하게 변하는 것을 보겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “푸르스름한 창백함으로 돌아간.” 히브리어 표현은 병색이 도는 창백한 얼굴빛을 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ נָא
  english_pob_choice: Ask now
  chosen_korean: 이제 물어보고 보십시오
  alternatives_korean:
  - 이제 질문해 보십시오
  - 부디 물어보십시오
  lexicon: HALOT
  rationale: 복수 명령형과 권고의 나아를 살려, 청자에게 직접 확인해 보라는 도전적 초청으로 옮겼습니다.
- source_word: אִם יֹלֵד זָכָר
  english_pob_choice: does a male give birth?
  chosen_korean: 남자가 해산하겠습니까?
  alternatives_korean:
  - 남자가 아이를 낳겠습니까?
  - 남자가 출산하겠습니까?
  lexicon: HALOT
  rationale: זָכָר의 성별 대비와 יֹלֵד의 불가능한 역설을 살리기 위해, 관용적으로 이해되는 출산 의미를 사용하되 역설성이 드러나게 했습니다.
- source_word: יָדָיו עַל חֲלָצָיו
  english_pob_choice: with his hands on his loins
  chosen_korean: 자기 손을 허리에 대고
  alternatives_korean:
  - 자기 손을 허벅지 위에 얹고
  - 자기 손을 허리께에 얹고
  lexicon: HALOT
  rationale: חֲלָצַיִם의 신체 부위를 한국어에서 자연스럽게 드러내기 위해 ‘허리’를 택했습니다. ‘허리’가 고통과 긴장 상태를 가장 무난하게 전달합니다.
- source_word: לְיֵרָקוֹן
  english_pob_choice: pale / greenish pallor
  chosen_korean: 창백하게
  alternatives_korean:
  - 핏기 없이
  - 황백색으로
  lexicon: HALOT
  rationale: 기본 의미는 얼굴빛의 창백함이므로 본문에는 자연스러운 표준어로 처리하고, 색조의 더 세부적인 뉘앙스는 주석으로 처리하는 것이 적절합니다.
theological_decisions:
- issue: 수사적 질문의 강도와 역설 유지
  chosen_reading: 하나님의 말씀은 남성의 출산이라는 불가능한 이미지를 통해 심판의 공포를 극적으로 드러내는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 비유적 놀람 표현으로 완화해서 읽는 것
  - 고통의 묘사보다 민족적 위기감만 강조하는 것
  rationale: 본문의 핵심은 불가능한 전도(남자가 해산함)를 통해 공포와 무력감을 폭발적으로 표현하는 데 있으므로, 한국어도 그 역설을 약화하지 않도록 했습니다.
  doctrine_reference: 예레미야서의 심판 수사
