  source_fidelity: 핵심 의미와 야곱/이스라엘의 병행, 신명 ‘야훼’는 잘 보존했습니다. 그러나 מוֹשִׁיעֲךָ의 분사적 확실성은 ‘구원하고’만으로 충분히 드러나지 않고, שִׁבְיָם은 ‘그들의 포로의 땅’보다 ‘그들이 포로로 잡혀 있는 땅’이 더 정확하고 자연스럽습니다. 또한 וְשָׁקַט וְשַׁאֲנַן은 단순히 ‘조용하고 평안하며’보다 평온과 안전/염려 없음의 병렬을 드러내는 편이 좋습니다.
  naturalness: 초안의 ‘마라’는 요청된 현대 합쇼체와 맞지 않습니다. ‘두려워하지 마십시오/낙담하지 마십시오’로 고쳐야 합니다. 인용문 안의 발화와 예언적 서술도 현대 한국어 문장으로 매끄럽게 다듬었습니다.
  terminology: ‘야훼’, ‘내 종’, ‘야곱’, ‘이스라엘’, ‘자손’, ‘포로’는 적절합니다. ‘낙담하지 마십시오’는 חתת의 위축·낙담의 뜻을 앞선 ‘두려워하지 마십시오’와 구별하여 유지합니다.
