  - severity: medium
    issue: 포로 상태를 가리키는 히브리어 표현의 부정확성과 어색함
    rationale: מֵאֶרֶץ שִׁבְיָם은 ‘그들의 포로의 땅’이라기보다 그들이 포로로 잡혀 있는 땅, 곧 포로 상태의 땅을 뜻합니다.
