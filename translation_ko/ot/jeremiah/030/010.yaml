revisions:
- from: “그러나 너는 두려워하지 마라, 내 종 야곱아.” 야훼의 말씀이니라. “이스라엘아, 낙담하지 마라. 보라, 내가 너를 먼 곳에서 구원하고, 네 자손을 그들의 포로의 땅에서 구원하겠다. 야곱은 돌아와 조용하고 평안하며, 그를 두렵게 하는 자가 없을 것이다.”[a][b][c]
  to: “그러나 너는 두려워하지 마십시오, 내 종 야곱아. 야훼의 말씀입니다. 이스라엘아, 낙담하지 마십시오. 보십시오, 내가 너를 먼 곳에서 구원하고[a], 네 자손을 그들이 포로로 잡혀 있는 땅에서 구원하겠습니다[b]. 야곱은 돌아와 평온하고 안전하게 지낼 것이며, 그를 두렵게 할 자가 없을 것입니다[c].”
  rationale: 지정된 합쇼체를 일관되게 적용하고, 포로 상태를 나타내는 히브리어 구성과 평온·안전의 병렬을 더 직접적으로 반영했습니다. 영어 감사본의 각주 대안은 유지하되, 한국어 본문에서 실제로 가리키는 위치에 각주 표지를 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:06Z'
review_pass:
