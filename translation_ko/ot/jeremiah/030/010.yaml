  lexicon: HALOT
  rationale: 야곱/이스라엘에 대한 언약적 호칭이므로 본문 의미를 살리면서도 통상적 예언체에 맞게 ‘종’으로 옮겼습니다.
- source_word: תֵּחַת
  english_pob_choice: do not be dismayed
  chosen_korean: 낙담하지 마라
  alternatives_korean:
  - 두려워하지 마라
  - 떨지 마라
  lexicon: HALOT
  rationale: 앞의 ‘두려워하지 마라’와 구별되는 내적 꺾임·주저함을 한국어에서 잘 드러내는 표현으로 옮겼습니다.
- source_word: מַחֲרִיד
  english_pob_choice: with no one to make him afraid
  chosen_korean: 그를 두렵게 하는 자가 없을 것이다
  alternatives_korean:
  - 그를 무서워하게 할 자가 없을 것이다
  - 그를 겁주어 떨게 하는 자가 없을 것이다
  lexicon: HALOT
  rationale: 동사의 사역적 뉘앙스를 살려 ‘두렵게 하는 자’로 옮겼고, 최종 절은 자연스러운 한국어 미래 서술로 정리했습니다.
