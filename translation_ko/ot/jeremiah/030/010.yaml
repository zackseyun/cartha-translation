id: JER.30.10
reference: Jeremiah 30:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֡ה אַל תִּירָא֩ עַבְדִּ֨/י יַעֲקֹ֤ב נְאֻם יְהֹוָה֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁיעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲקֹ֛ב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/010.yaml
  text: But as for you[a], do not fear, my servant Jacob, declares Yahweh, and do not be dismayed, Israel; for behold, I am saving you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
  footnotes:
  - marker: a
    text: Or 'I will save you.' The Hebrew participial form with 'behold, I' can express imminent or certain future action.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the land where they are captives'; more broadly, 'from the land of exile.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and none shall make him afraid.'
    reason: lexical_alternative
translation:
  language: ko
  text: “그러나 너는 두려워하지 마라, 내 종 야곱아.” 야훼의 말씀이니라. “이스라엘아, 낙담하지 마라. 보라, 내가 너를 먼 곳에서 구원하고, 네 자손을 그들의 포로의 땅에서 구원하겠다. 야곱은 돌아와 조용하고 평안하며, 그를 두렵게 하는 자가 없을 것이다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너를 구원하겠다’. ‘보라, 내가’라는 히브리어 분사형은 임박한 또는 확실한 미래 행동을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포로들의 땅에서’; 더 넓게는 ‘포로 생활의 땅에서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그를 두렵게 하는 자가 없을 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But as for you
  chosen_korean: 그러나 너는
  alternatives_korean:
  - 그리고 너는
  - 하지만 너는
  lexicon: HALOT
  rationale: 대조적 전환을 살리되 한국어에서는 ‘그러나 너는’이 가장 자연스럽고 직접적입니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 노예
  - 내 일꾼
  lexicon: HALOT
  rationale: 야곱/이스라엘에 대한 언약적 호칭이므로 본문 의미를 살리면서도 통상적 예언체에 맞게 ‘종’으로 옮겼습니다.
- source_word: תֵּחַת
  english_pob_choice: do not be dismayed
  chosen_korean: 낙담하지 마라
  alternatives_korean:
  - 두려워하지 마라
  - 떨지 마라
  lexicon: HALOT
  rationale: 앞의 ‘두려워하지 마라’와 구별되는 내적 꺾임·주저함을 한국어에서 잘 드러내는 표현으로 옮겼습니다.
- source_word: מַחֲרִיד
  english_pob_choice: with no one to make him afraid
  chosen_korean: 그를 두렵게 하는 자가 없을 것이다
  alternatives_korean:
  - 그를 무서워하게 할 자가 없을 것이다
  - 그를 겁주어 떨게 하는 자가 없을 것이다
  lexicon: HALOT
  rationale: 동사의 사역적 뉘앙스를 살려 ‘두렵게 하는 자’로 옮겼고, 최종 절은 자연스러운 한국어 미래 서술로 정리했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 신명은 POB의 원칙대로 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
- issue: ‘야곱’과 ‘이스라엘’의 병행 유지
  chosen_reading: 두 이름을 모두 살려 병행 구조를 유지함
  alternative_readings:
  - 이스라엘로 통일
  - 야곱으로 통일
  rationale: 히브리어의 평행법과 정체성의 층위를 보존하기 위해 두 호칭을 모두 본문에 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
