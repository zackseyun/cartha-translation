base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/016.yaml
  text: Therefore all who devour you will be devoured[a], and all your adversaries, every one of them, will go into captivity; those who plunder you will become plunder, and all who prey on you I will give up to prey.
  footnotes:
  - marker: a
    text: Or 'all who plunder you I will give for plunder.' The Hebrew uses closely related terms for looting/spoil in the final clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너를 삼키는 모든 자들은 삼켜질 것이며, 너의 대적들은 그들 모두가 포로로 끌려갈 것입니다. 너를 약탈하는 자들은 약탈을 당할 것이며, 너를 약탈하는 모든 자들을 나는 약탈되게 내버려둘 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절의 히브리어는 약탈과 노략에 서로 밀접한 관련이 있는 어휘를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞뒤 심판 맥락의 귀결을 나타내는 연결어로, 합쇼체 본문에서 자연스럽고 격식 있는 ‘그러므로’가 원문의 추론적 힘을 잘 살립니다.
- source_word: אֹכְלַיִךְ / יֵאָכֵלוּ
  english_pob_choice: all who devour you will be devoured
  chosen_korean: 너를 삼키는 모든 자들은 삼켜질 것이며
  alternatives_korean:
  - 너를 먹는 모든 자들은 먹힐 것이며
  - 너를 소비하는 모든 자들은 소비될 것이며
  lexicon: HALOT
  rationale: 직역의 ‘먹다’보다 적대적 파괴를 뜻하는 비유적 용법이어서, ‘삼키다/삼켜지다’가 한국어에서도 폭력적 역전의 이미지를 자연스럽게 드러냅니다.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  english_pob_choice: will go into captivity
  chosen_korean: 포로로 끌려갈 것입니다
  alternatives_korean:
  - 포로 상태로 가게 될 것입니다
  - 사로잡혀 갈 것입니다
  lexicon: HALOT
  rationale: שׁבי의 포로 됨을 한국어에서 가장 분명하게 드러내는 표현으로, 이동의 결과가 포로 신세가 되는 점을 살렸습니다.
- source_word: לָבַז
  english_pob_choice: I will give up to prey
  chosen_korean: 약탈되게 내버려둘 것입니다
  alternatives_korean:
  - 약탈의 먹이가 되게 할 것입니다
  - 노략거리로 넘겨주겠습니다
  lexicon: HALOT
  rationale: 마지막 נתן + ל + בז의 관용적 의미를 살리되, 앞 절의 ‘약탈’과 중복을 피하면서도 ‘내버려두다/넘겨주다’의 심판적 방임을 표현했습니다.
theological_decisions:
- issue: 보복적 역전 이미지의 유지
  chosen_reading: 먹는 자가 삼켜지고, 약탈하는 자가 약탈당하는 역전 구조를 그대로 살렸습니다.
  alternative_readings:
  - 일반적인 처벌 언어로 완화하여 번역
  rationale: 이 절의 신학적 메시지는 적대자들에게 되돌아가는 상응 보복의 이미지에 있으므로, 비유를 평탄화하지 않고 유지하는 것이 원문 의미에 더 가깝습니다.
  doctrine_reference: '번역 원칙: 원문의 평문 의미와 수사적 힘을 보존한다.'
