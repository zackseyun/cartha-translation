id: JER.30.8
reference: Jeremiah 30:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אֶשְׁבֹּ֤ר עֻלּ/וֹ֙ מֵ/עַ֣ל צַוָּארֶ֔/ךָ וּ/מוֹסְרוֹתֶ֖י/ךָ אֲנַתֵּ֑ק וְ/לֹא יַעַבְדוּ ב֥/וֹ ע֖וֹד זָרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/008.yaml
  text: And it shall happen in that day[a], declares Yahweh of Armies, that I will break his yoke from off your neck, and I will tear off your bonds[b], and foreigners shall no longer make him their slave.
  footnotes:
  - marker: a
    text: Or, 'foreigners shall no longer enslave him.' The Hebrew final clause is syntactically compressed; the sense is that Israel/Jacob will no longer be subjected to foreign bondage.
    reason: alternative_reading
  - marker: b
    text: Traditionally 'the LORD of Hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 만군의 야훼께서[b] 선언하십니다. “내가 네 목에서 그의 멍에를 꺾고 네 결박을 끊겠다. 이방인들이 더 이상 그를 종으로 부리지 못하게 하겠다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 구문이 압축되어 있습니다. 문맥상 야곱/이스라엘이 더 이상 이방인들에게 예속되지 않으리라는 뜻입니다. 또는 “이방인들이 더 이상 그를 노예로 삼지 못하게 하겠다.”
    reason: alternative_reading
  - marker: b
    text: 전통적으로 “만군의 여호와”로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님께서 선언하십니다
  alternatives_korean:
  - 야훼 군대들의 하나님께서 선언하십니다
  - 야훼 만군의 주님께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 선언 공식을 살려 ‘선언하십니다’로 옮기고, יְהוָה는 본문 원어를 따라 ‘야훼’로, צְבָאוֹת은 ‘만군의’로 처리해 전통어와 원어의 긴장을 함께 드러냈습니다.
- source_word: אֶשְׁבֹּר / עֻלּוֹ
  english_pob_choice: I will break his yoke
  chosen_korean: 내가 그의 목에서 멍에를 꺾고
  alternatives_korean:
  - 내가 그의 멍에를 부수고
  - 내가 그의 목의 멍에를 끊고
  lexicon: HALOT
  rationale: ‘멍에’는 지배와 속박의 이미지를 직접 살리고, ‘꺾다’는 부수다보다 목과 멍에의 결합을 더 자연스럽게 풀어 주는 동사이므로 원문의 해방 이미지를 유지합니다.
- source_word: וּמוֹסְרוֹתֶיךָ אֲנַתֵּק
  english_pob_choice: I will tear off your bonds
  chosen_korean: 네 결박을 끊어 버리며
  alternatives_korean:
  - 네 포승을 끊어 버리며
  - 네 속박을 찢어 버리며
  lexicon: HALOT
  rationale: מוֹסְרוֹת는 속박용 끈·결박의 의미가 있어, 포괄적인 ‘결박’으로 옮기되 동작은 ‘끊어 버리며’로 강하게 처리해 해방의 단호함을 살렸습니다.
- source_word: וְלֹא יַעַבְדוּ ב֖וֹ עוֹד זָרִים
  english_pob_choice: foreigners shall no longer make him their slave
  chosen_korean: 더는 이방인들이 그를 자기들의 종으로 삼지 못하게 하겠습니다
  alternatives_korean:
  - 더는 이방인들이 그를 노예로 삼지 못하게 하겠습니다
  - 더는 이방인들이 그를 섬기게 하지 않겠습니다
  lexicon: HALOT
  rationale: עבד의 핵심은 여기서 단순 봉사가 아니라 강제적 예속이므로 ‘종으로 삼다’로 옮겨 bondage 의미를 살렸고, अंतिम 절의 주체-대상을 분명히 하기 위해 수동적 자유 상태보다 ‘삼지 못하게’로 정리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 표준에 따라 יְהוָה는 전통 교회어인 ‘여호와’나 대체표현 ‘주님’이 아니라, 원어를 직접 반영하는 ‘야훼’로 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: צְבָאוֹת의 처리
  chosen_reading: 만군의 하나님
  alternative_readings:
  - 만군의 주님
  - 군대들의 하나님
  rationale: ‘만군의’는 צְבָאוֹת의 전통적 힘과 위엄을 유지하면서도 현대 한국어 독자에게 자연스럽고, ‘하나님’과 결합해 호칭 구조를 분명히 합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6
