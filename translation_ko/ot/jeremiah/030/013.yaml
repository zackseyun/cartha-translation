  text: אֵֽין דָּ֥ן דִּינֵ֖/ךְ לְ/מָז֑וֹר רְפֻא֥וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/013.yaml
  text: There is no one to plead your case for your wound[a]; there is no healing for you[b], no remedy.
  footnotes:
  - marker: a
    text: Or 'There is no one to judge your case concerning your wound.' The Hebrew legal imagery can be rendered either as advocacy ('plead your case') or adjudication ('judge your case').
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood more concretely as 'no bandage for you' or 'no new flesh for you,' reflecting the rare Hebrew term translated 'remedy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 상처를 위해 변호해 줄 사람이 없습니다. 네게는 치유도, 치료도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 상처를 판결할 사람이 없습니다.’ 히브리어 법정 이미지는 ‘변호하다’와 ‘판결하다’로 모두 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네게는 붕대도 없습니다’ 혹은 ‘네게는 새 살도 없습니다.’ 희귀한 히브리어는 보다 구체적인 치유 수단을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין דָּן דִּינֵךְ
  english_pob_choice: There is no one to plead your case
  chosen_korean: 네 상처를 위해 변호해 줄 사람이 없습니다
  alternatives_korean:
  - 네 사건을 판결할 사람이 없습니다
  - 네 경우를 심리할 사람이 없습니다
  - 네 사정을 변론할 사람이 없습니다
  lexicon: HALOT
  rationale: דָּן דִּינֵךְ의 법정 이미지를 한국어에서는 ‘변호해 줄 사람’으로 옮겨, 단순한 판결보다 대항 변론이 없는 절망적 상황을 살렸습니다.
- source_word: לְמָזוֹר
  english_pob_choice: for your wound
  chosen_korean: 상처를 위해
  alternatives_korean:
  - 네 상처에 대해
  - 네 상처를 위하여
  - 네 병을 위해
  lexicon: HALOT
  rationale: לְמָזוֹר는 ‘상처/부상’에 대한 전치사적 연결로 이해되어, 자연스러운 현대 한국어로 ‘상처를 위해’라고 옮겼습니다.
- source_word: רְפֻאוֹת
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 회복
  - 치료
  - 낫게 됨
  lexicon: HALOT
  rationale: 복수형이지만 집합적으로 쓰이는 표현이므로, 무난한 명사 ‘치유’로 번역해 치유 가능성 자체의 부재를 드러냈습니다.
- source_word: תְּעָלָה
  english_pob_choice: remedy
  chosen_korean: 치료
  alternatives_korean:
  - 치유책
  - 약
  - 붕대
  lexicon: HALOT
  rationale: 희귀어 תְּעָלָה는 ‘붕대/새 살/치료책’ 등으로도 이해될 수 있어, 영어 POB의 ‘remedy’에 맞춰 읽기 쉬운 ‘치료’를 택했습니다.
theological_decisions:
- issue: 법정 이미지와 의료 이미지의 병치
  chosen_reading: ‘변호해 줄 사람’과 ‘상처’/‘치유’의 병치를 유지해, 재난이 단순한 아픔이 아니라 누구도 항변하거나 수습하지 못하는 상태임을 드러냈습니다.
  alternative_readings:
  - 법정 이미지를 약화시켜 단순한 위로의 부재로 읽는 방식
  - 의료 이미지만 강조해 법적 의미를 희석하는 방식
  rationale: 히브리어는 דין/מזור와 רפאות/תעלה를 함께 써 법정과 치유의 이중 이미지를 만듭니다. 이를 둘 다 보존하는 것이 본문의 긴장을 가장 잘 전달합니다.
  doctrine_reference: 예레미야 30장의 회복 선언과 대조되는 심판-무치유의 현실
- issue: 두 번째 절의 희귀어 해석
  chosen_reading: ‘치료’로 번역하되, 보다 구체적인 물질적 의미 가능성을 주석으로 열어 두었습니다.
  alternative_readings:
  - ‘붕대’
  - ‘새 살’
  - ‘치유책’
  rationale: 본문의 희귀어는 단일한 한국어 대응어로 확정하기 어려우므로, 본문에는 보편적 의미를 두고 대안 의미는 주석으로 제시하는 것이 적절합니다.
  doctrine_reference: 본문의 어휘 불확실성에 대한 번역상의 겸손
