  - 이른
  - 다가온
  - 왔던
  lexicon: HALOT
  rationale: 직역상 ‘~에게 있었다’이지만, 예언 수납 공식을 한국어로는 ‘임하다’가 원문의 도착/도달과 계시성을 함께 살립니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서
  alternatives_korean:
