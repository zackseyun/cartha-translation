  lexicon: HALOT
  rationale: 예언 서두의 정형 표현으로서 단순한 정보보다 하나님께서 주시는 계시의 발화를 드러내는 ‘말씀’이 자연스럽고, POB의 ‘The word’와도 대응됩니다.
- source_word: הָיָה אֶל
