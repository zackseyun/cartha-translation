translation:
  language: ko
  text: 야훼[a]에게서 예레미야에게 임한 말씀은 이렇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 본문: ‘YHWH’. 한국어 전통 번역에서는 흔히 ‘주’로 옮깁니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 서두의 정형 표현으로서 단순한 정보보다 하나님께서 주시는 계시의 발화를 드러내는 ‘말씀’이 자연스럽고, POB의 ‘The word’와도 대응됩니다.
- source_word: הָיָה אֶל
  english_pob_choice: came to
  chosen_korean: 임한
  alternatives_korean:
  - 이른
  - 다가온
  - 왔던
  lexicon: HALOT
  rationale: 직역상 ‘~에게 있었다’이지만, 예언 수납 공식을 한국어로는 ‘임하다’가 원문의 도착/도달과 계시성을 함께 살립니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 야훼로부터
  - 야훼로 말미암아
  lexicon: HALOT
  rationale: מֵאֵת의 출처 표지를 한국어 조사 ‘-에게서’로 옮겨, 말씀의 기원이 야훼께 있음을 분명히 했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 이렇습니다
  alternatives_korean:
  - 말하여 이르시되
  - 말씀하시기를
  lexicon: HALOT
  rationale: 다음 절의 직접화법을 예고하는 연결어로서, 현대 한국어에서는 후속 인용을 자연스럽게 여는 ‘이렇습니다’가 문맥상 매끄럽습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 사역호칭이 아니라 고유명 יְהוָה를 직접 사용하므로, POB 기준에 따라 한국어 본문에서도 ‘야훼’로 유지해 언약 이름의 식별성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
