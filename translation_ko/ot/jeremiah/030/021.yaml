id: JER.30.21
reference: Jeremiah 30:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה אַדִּיר֜/וֹ מִמֶּ֗/נּוּ וּ/מֹֽשְׁל/וֹ֙ מִ/קִּרְבּ֣/וֹ יֵצֵ֔א וְ/הִקְרַבְתִּ֖י/ו וְ/נִגַּ֣שׁ אֵלָ֑/י כִּי֩ מִ֨י הוּא זֶ֜ה עָרַ֧ב אֶת לִבּ֛/וֹ לָ/גֶ֥שֶׁת אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/021.yaml
  text: His ruler will be one of them[a], and his governor will come out from his midst. I will bring him near, and he will approach me[c][b], for who is this who has pledged his heart to approach me? declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'his noble one'; the Hebrew term can denote a prominent, mighty, or noble leader.
    reason: lexical_alternative
  - marker: b
    text: Or 'from among them' for 'one of them'; the Hebrew expression indicates that the leader arises from the people themselves.
    reason: lexical_alternative
  - marker: c
    text: Or 'who has dared in his heart to approach me?' The Hebrew idiom literally speaks of pledging or staking one's heart.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 지도자는 그들 가운데서 나올 것이며[a][b], 그들의 통치자는 그들 가운데서 나올 것입니다. 내가 그를 가까이 오게 할 것이며, 그가 내게 나아올 것입니다. 자기 마음을 내걸고[c] 내게 나아올 자가 도대체 누구이겠습니까? 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지도자’는 ‘고귀한 자’, ‘권세 있는 자’로도 옮길 수 있습니다. 히브리어는 유력하고 뛰어난 지도자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그에게서/그의 가운데서’입니다. 문맥상 이 표현들은 백성 공동체 내부에서 지도자가 나온다는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘자기 마음을 보증으로 세우고’에 가깝습니다. ‘감히 마음에 품고’ 또는 ‘자신을 걸고’로도 이해될 수 있는, 강한 자기 헌신과 위험 감수의 관용 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדִּירוֹ
  english_pob_choice: his ruler
  chosen_korean: 그의 지도자
  alternatives_korean:
  - 그의 고귀한 자
  - 그의 권세 있는 자
  - 그의 통치자
  lexicon: HALOT
  rationale: אַדִּיר는 ‘고귀한/권세 있는/유력한’ 사람을 가리킬 수 있어, 여기서는 뒤의 ‘통치자’와 평행을 이루는 নেতৃত্ব 표현인 ‘지도자’가 가장 자연스럽고 과도한 왕권 이미지를 덜어 줍니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: one of them
  chosen_korean: 그들 가운데 한 사람
  alternatives_korean:
  - 그에게서
  - 그들 중 하나
  - 그들 가운데서
  lexicon: HALOT
  rationale: 직역의 ‘그에게서’보다 문맥상 집단 내부에서 나온다는 뜻을 분명히 하는 ‘그들 가운데 한 사람’이 한국어에서 더 정확하고 읽기 쉽습니다.
- source_word: מֹשְׁלוֹ
  english_pob_choice: his governor
  chosen_korean: 그의 통치자
  alternatives_korean:
  - 그의 다스리는 자
  - 그의 총독
  - 그의 지배자
  lexicon: HALOT
  rationale: משל의 기본 의미는 ‘다스리다’이므로, 공적 통치 역할을 살려 ‘통치자’로 옮겼습니다. ‘총독’은 역사적 색채가 강해 여기서는 피했습니다.
- source_word: מִקִּרְבּוֹ
  english_pob_choice: from his midst
  chosen_korean: 그의 한가운데에서
  alternatives_korean:
  - 그들 가운데서
  - 그의 가운데에서
  - 그의 내부에서
  lexicon: HALOT
  rationale: קֶרֶב의 ‘한가운데/중심’ 이미지를 살리기 위해 ‘한가운데에서’를 택해, 공동체 내부에서 나온다는 뜻과 공간적 이미지 둘 다 보존했습니다.
- source_word: עָרַב אֶת לִבּוֹ
  english_pob_choice: has pledged his heart
  chosen_korean: 자기 마음을 담보로 삼아
  alternatives_korean:
  - 자기 마음을 내걸어
  - 자기 마음으로 감히
  - 자기 마음을 보증으로 삼아
  lexicon: HALOT
  rationale: ערב은 ‘담보/보증을 서다’의 의미가 있어, 마음을 걸고 나아가는 담대함을 드러내는 한국어 관용으로 ‘담보로 삼아’를 선택했습니다. 이것이 단순한 ‘감히’보다 히브리어의 비유를 더 잘 반영합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼의 말씀이니라
  - 주님의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식은 현대 한국어에서 ‘말씀입니다’가 가장 자연스럽고 엄숙합니다. 프로젝트 기본값에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 마음의 ‘담보’라는 표현의 강도 보존
  chosen_reading: 지도자가 하나님께 가까이 나아오는 것은 단순한 호기심이나 허가가 아니라, 자기 마음을 담보로 내거는 듯한 강한 자기 헌신으로 제시됩니다.
  alternative_readings:
  - 단순히 ‘감히 나아오다’로 완화할 수 있음
  - ‘마음을 바치다’로 정서화할 수 있음
  rationale: 본문의 ערב idiom은 위험을 감수하는 보증 행위의 뉘앙스를 가지므로, 이를 약화시키지 않고 ‘담보’로 살려 긴장과 경외를 유지했습니다.
  doctrine_reference: 본문의 수사적 강도를 보존
- issue: 여호와 인용의 한국어 표기
  chosen_reading: נְאֻם יְהוָה를 본문에서 ‘야훼의 말씀입니다’로 처리했습니다.
  alternative_readings:
  - ‘주님의 말씀입니다’
  - ‘야훼의 선언입니다’
  rationale: 프로젝트 기본 원칙에 따라 구약의 יְהוָה는 ‘야훼’로 표기해야 하며, 예언자적 공식은 한국어 문체상 ‘말씀입니다’가 가장 안정적입니다.
  doctrine_reference: YHWH 표기 원칙
