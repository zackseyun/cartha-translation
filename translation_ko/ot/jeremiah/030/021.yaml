revisions:
- from: 그의 지도자는 그들 가운데 한 사람이며, 그의 통치자는 그의 한가운데에서 나올 것입니다. 내가 그를 내게 가까이 오게 하겠고, 그가 내게 나아올 것입니다. 누가 자기 마음을 담보로 삼아 내게 나아오겠습니까? 야훼의 말씀입니다.[a][b][c]
  to: 그들의 지도자는 그들 가운데서 나올 것이며[a][b], 그들의 통치자는 그들 가운데서 나올 것입니다. 내가 그를 가까이 오게 할 것이며, 그가 내게 나아올 것입니다. 자기 마음을 내걸고[c] 내게 나아올 자가 도대체 누구이겠습니까? 야훼의 말씀입니다.
  rationale: 두 지도자 호칭의 병행과 공동체 내부에서의 출현을 분명히 하되, 인물의 정체는 해석적으로 한정하지 않았습니다. ‘마음을 내걸고’는 히브리어의 보증 은유를 자연스러운 현대 한국어로 보존하며, 수사 의문문의 긴장도 유지합니다. 각주 표지는 해당 표현에 직접 연결했습니다.
