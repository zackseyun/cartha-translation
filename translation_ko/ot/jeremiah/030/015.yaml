id: JER.30.15
reference: Jeremiah 30:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה תִּזְעַק֙ עַל שִׁבְרֵ֔/ךְ אָנ֖וּשׁ מַכְאֹבֵ֑/ךְ עַ֣ל רֹ֣ב עֲוֺנֵ֗/ךְ עָֽצְמוּ֙ חַטֹּאתַ֔יִ/ךְ עָשִׂ֥יתִי אֵ֖לֶּה לָֽ/ךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/015.yaml
  text: Why do you cry out over your injury? Your pain is incurable[a]. Because your iniquity is great, because your sins are many[b], I have done these things to you.
  footnotes:
  - marker: a
    text: Or 'your wound' for 'your injury.' The Hebrew term can denote a breaking, fracture, or wound.
    reason: lexical_alternative
  - marker: b
    text: Or 'your pain is desperate/grievous.' The Hebrew adjective can mean severely sick or beyond healing; 'incurable' brings out the likely sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 네 상처[a] 때문에 부르짖습니까? 네 고통은 고칠 수 없습니다[b]. 네 죄악이 크고 네 죄가 많기 때문에, 내가 네게 이런 일들을 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 부서짐’, ‘네 부상’으로 옮길 수 있습니다. 히브리어는 부서짐, 골절, 상처를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 고통은 절망적입니다’ 또는 ‘네 고통은 심각합니다’로 옮길 수 있습니다. 히브리어 형용사는 매우 병들었거나 고칠 수 없는 상태를 뜻할 수 있으며, 여기서는 ‘고칠 수 없습니다’가 문맥상 그 뜻을 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תִּזְעַק
  english_pob_choice: Why do you cry out
  chosen_korean: 왜 … 부르짖습니까?
  alternatives_korean:
  - 왜 … 외칩니까?
  - 왜 … 울부짖습니까?
  lexicon: HALOT
  rationale: מַה가 수사적 질문으로 쓰인 맥락을 살려 ‘왜’로 옮기고, זעק의 강한 통곡/부르짖음을 ‘부르짖다’로 표현했습니다.
- source_word: שִׁבְרֵךְ
  english_pob_choice: your injury
  chosen_korean: 상처
  alternatives_korean:
  - 부서짐
  - 상처/부상
  - 파괴된 상태
  lexicon: HALOT
  rationale: שבר는 부서짐, 골절, 상처를 아울러 가리킬 수 있으므로, 문맥상 자연스럽고 과도하게 좁히지 않는 ‘상처’를 선택했습니다.
- source_word: אָנ֖וּשׁ מַכְאֹבֵךְ
  english_pob_choice: Your pain is incurable
  chosen_korean: 네 고통은 고칠 수 없습니다
  alternatives_korean:
  - 네 고통은 불치입니다
  - 네 고통은 절망적입니다
  - 네 고통은 심각합니다
  lexicon: HALOT
  rationale: אָנושׁ는 병약함이나 치유 불가능함을 나타내므로, 현대 한국어에서 의미를 분명히 드러내는 ‘고칠 수 없습니다’로 옮겼습니다.
- source_word: עַל רֹב עֲוֺנֵךְ עָצְמוּ חַטֹּאתַיִךְ
  english_pob_choice: Because your iniquity is great, because your sins are many
  chosen_korean: 네 악이 많고 네 죄가 많기 때문입니다
  alternatives_korean:
  - 네 죄악이 커서 네 죄가 많기 때문입니다
  - 네 죄악이 크고 네 죄가 많기 때문입니다
  - 네 불의가 많고 네 죄가 많기 때문입니다
  lexicon: HALOT
  rationale: עָוֹן과 חטאת은 각각 죄악/불의와 죄를 가리킬 수 있으나, 병행 구조를 살려 둘 다 ‘죄’ 계열로 번역하되 앞항의 רֹב는 ‘많다’로 풀어 원인의 중첩을 드러냈습니다.
- source_word: עָשִׂיתִי אֵלֶּה לָךְ
  english_pob_choice: I have done these things to you
  chosen_korean: 내가 너에게 이런 일들을 행했습니다
  alternatives_korean:
  - 내가 너에게 이 일들을 했습니다
  - 내가 너에게 이것들을 행했습니다
  - 내가 너에게 이런 일들을 했습니다
  lexicon: HALOT
  rationale: 1인칭 완료형의 하나님의 직접적 행위를 보존하면서, 복수 지시사 אֵלֶּה를 ‘이런 일들’로 반영했습니다.
theological_decisions:
- issue: 심판의 주체를 약화하지 않는 번역
  chosen_reading: 하나님이 직접 ‘내가 너에게 이런 일들을 행했습니다’라고 말씀하시는 것으로 유지했습니다.
  alternative_readings:
  - ‘이런 일들이 너에게 일어났습니다’처럼 비인칭적으로 완화
  - ‘이런 일들을 내가 허락했습니다’처럼 간접화
  rationale: 히브리어는 1인칭 단수 완료형 עָשִׂיתִי를 사용하므로, 심판의 주체를 흐리지 않고 직접적 행위로 번역하는 것이 본문에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
