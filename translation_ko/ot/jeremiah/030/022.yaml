    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  english_pob_choice: you will be
  chosen_korean: 너희가 … 되겠습니다
  alternatives_korean:
  - 너희는 … 될 것입니다
  - 너희가 … 됩니다
  lexicon: HALOT
  rationale: 히브리어 היה의 미래적 언약 진술을 한국어에서 자연스러운 미래형으로 옮기되, 직설적 예언의 약속성을 살리기 위해 ‘되겠습니다’를 택했습니다.
- source_word: לִי לְעָם
  english_pob_choice: my people
  chosen_korean: 내 백성이
  alternatives_korean:
  - 나를 위한 백성이
  - 내가 가진 백성이
  lexicon: HALOT
  rationale: 직역하면 ‘나에게 백성으로’이지만, 언약 공식에서는 소속과 관계를 드러내는 ‘내 백성’이 가장 자연스럽고 원문의 상호 소유 관계를 잘 반영합니다.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם
  english_pob_choice: and I will be your
  chosen_korean: 나는 너희의
  alternatives_korean:
  - 내가 너희에게
  - 나는 너희를 위해
  lexicon: HALOT
  rationale: אָנֹכִי와 אֶהְיֶה의 대칭 구조를 한국어에서 ‘나는 너희의 …’로 압축해, 앞절과 대응하는 관계 진술을 유지했습니다.
- source_word: לֵאלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하나님이
  lexicon: HALOT
  rationale: 언약 대상이 이스라엘의 하나님이므로 POB 기본어인 ‘하나님’을 사용했습니다. 한국어 관용상 ‘너희의 하나님’이 ‘너희에게 하나님’보다 자연스럽습니다.
theological_decisions:
- issue: 언약 공식의 상호 소속성
  chosen_reading: ‘내 백성’과 ‘너희의 하나님’의 대칭을 유지했습니다.
  alternative_readings:
  - ‘나에게 백성’과 ‘하나님이 되겠습니다’로 더 직역할 수 있습니다.
  - ‘내 사람들’로 완화할 수 있습니다.
  rationale: 본문은 단순한 소유가 아니라 언약적 소속과 관계를 말하므로, 한국어에서도 그 상호 귀속성을 분명히 드러내는 쪽이 원문 의미를 더 잘 보존합니다.
  doctrine_reference: 언약 공식의 표준적 성경 신학 표현
- issue: 독자에게 자연스러운 현대어와 원문 대칭성의 균형
  chosen_reading: 앞부분의 ‘그러면’으로 결론적·약속적 흐름을 살렸습니다.
  alternative_readings:
  - 단순히 ‘너희는 내 백성이 되고…’로 시작할 수 있습니다.
  rationale: 히브리어 연속절의 약속 맥락을 한국어에서 매끄럽게 연결하면서도, 결과·회복 문맥을 드러내는 수준에서만 보완했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve theological tension rather than resolve it'
