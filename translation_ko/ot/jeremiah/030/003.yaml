  text: For look, days are coming, declares the LORD, when I will restore the fortunes of my people Israel and Judah, says the LORD, and I will bring them back to the land that I gave to their fathers, and they will possess it.
translation:
  language: ko
  text: “보십시오, 날들이 오고 있습니다”라고 야훼께서 선언하십니다. “내가 내 백성 이스라엘과 유다의 형편을 회복시키고, 내가 그들을 내가 그들의 조상들에게 준 땅으로 돌아오게 하겠으며, 그들은 그것을 차지할 것입니다”라고 야훼께서 말씀하십니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 הִנֵּה는 주의를 환기하는 감탄사로, 여기서는 ‘보십시오’가 가장 직접적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙
  english_pob_choice: For look, days are coming
  chosen_korean: “보십시오, 날들이 오고 있습니다”
  alternatives_korean:
  - “보라, 날들이 오고 있습니다”
  - “보십시오. 날들이 오고 있습니다”
  lexicon: 보십시오
  rationale: 히브리어 הִנֵּה와 POB의 ‘look’를 모두 살려 독자에게 주의를 환기하는 현재진행적 예고로 옮겼습니다.
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  english_pob_choice: I will restore the fortunes of
  chosen_korean: 내가 …의 형편을 회복시키고
  alternatives_korean:
  - …의 포로 상태를 돌이키고
  - …의 운명을 회복시키고
  lexicon: 형편을 회복시키다
  rationale: שׁוּב אֶת־שְׁבוּת는 관용적으로 ‘번영/형편/처지의 회복’을 뜻하므로, 단순 귀환보다 더 넓은 회복의 의미를 드러내는 표현을 택했습니다.
- source_word: וַהֲשִׁבֹתִים אֶל הָאָרֶץ
  english_pob_choice: and I will bring them back to the land
  chosen_korean: 내가 그들을 … 땅으로 돌아오게 하겠으며
  alternatives_korean:
  - 내가 그들을 … 땅으로 데려오겠으며
  - 내가 그들을 … 땅에 다시 데려가겠으며
  lexicon: 돌아오게 하다
  rationale: הֵשִׁיב + אֶל의 방향성을 살려, 단순 이동이 아니라 약속의 땅으로의 회귀를 분명히 했습니다.
- source_word: וִירֵשׁוּהָ
  english_pob_choice: and they will possess it
  chosen_korean: 그들은 그것을 차지할 것입니다
  alternatives_korean:
  - 그들은 그것을 소유할 것입니다
  - 그들은 그것을 차지하게 될 것입니다
  lexicon: 차지하다
  rationale: יָרַשׁ의 언약적 상속·점유 의미를 살리기 위해, 법적·상속적 뉘앙스가 있는 ‘차지하다’를 선택했습니다.
theological_decisions:
- issue: 야훼 호칭의 처리
  chosen_reading: 본문의 יְהוָה를 한국어 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - ‘여호와’로 관용 표기
  rationale: POB의 본문 호칭 원칙과 원문 대응성을 우선해, 표제적 신명호를 직접 드러냈습니다.
  doctrine_reference: 출 3:15; 시 83:18
- issue: ‘돌아오게 하다/차지하다’의 회복-정착 구조
  chosen_reading: 회복된 백성이 단지 귀환하는 데서 그치지 않고 약속의 땅을 상속·점유하는 완결을 보이도록 번역했습니다.
  alternative_readings:
  - 단순 귀환 중심으로 축소
  - ‘상속하다’로만 추상화
  rationale: 문맥상 포로 귀환과 언약적 소유가 함께 제시되므로, 회복과 소유의 두 단계를 모두 드러내는 것이 더 정확합니다.
  doctrine_reference: 창 15:18; 렘 29:14
- issue: 인용문의 한국어 문장부호와 선언 구조
  chosen_reading: 직접발화 안에서 첫 절과 뒤 절을 따옴표로 묶어 예언적 선언의 반복을 살렸습니다.
  alternative_readings:
  - 모든 절을 한 문장으로 평서화
  - 따옴표 없이 서술문으로 통합
  rationale: 히브리어의 ‘declares/says Yahweh’ 반복을 살려 예언적 권위와 리듬을 유지했습니다.
  doctrine_reference: 렘 30:3
