source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה ק֥וֹל חֲרָדָ֖ה שָׁמָ֑עְנוּ פַּ֖חַד וְ/אֵ֥ין שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/005.yaml
  text: 'For thus says Yahweh: “We have heard a sound of trembling[a], of fear[b], and there is no peace.”'
  footnotes:
  - marker: a
    text: Or 'a voice of trembling'; Hebrew qol can mean 'sound,' 'noise,' or 'voice' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'terror' for 'trembling' and 'dread' for 'fear'; the Hebrew pairs closely related terms to intensify the sense of distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. "우리는 떨림의 소리[a], 두려움[b]을 들었으니, 평강이 없습니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떨림의 음성’으로 옮길 수 있습니다. 히브리어 qol은 문맥에 따라 ‘소리’, ‘음성’, ‘울림’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘공포’로 옮길 수 있습니다. 히브리어는 ‘떨림’과 ‘두려움’의 유사한 말을 나란히 두어 불안의 강도를 더합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר יְהוָה
  english_pob_choice: For thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 이는 야훼께서 이렇게 말씀하십니다
  - 야훼께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식으로서 כֹה אָמַר을 한국어에서 자연스럽고 격식 있게 옮겼으며, יְהוָה는 프로젝트 기본값에 따라 야훼로 렌더링했습니다.
- source_word: קוֹל חֲרָדָה
  english_pob_choice: a sound of trembling
  chosen_korean: 떨림의 소리
  alternatives_korean:
  - 떨림의 음성
  - 떨림의 울림
  - 전율의 소리
  lexicon: HALOT
  rationale: קוֹל은 여기서 발화된 ‘음성’보다 들리는 ‘소리’가 적절하고, חֲרָדָה는 추상적 ‘공포’보다 몸의 떨림을 드러내는 ‘떨림’이 원문 감각을 더 잘 살립니다.
- source_word: פַּחַד
  english_pob_choice: fear
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 경외
  - 떨림
  lexicon: HALOT
  rationale: 앞의 ‘떨림’과 병렬되는 두 번째 감정어로, 한국어에서는 ‘두려움’이 과도하게 강하지 않으면서도 긴장과 공포의 정서를 유지합니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 평안
  lexicon: HALOT
  rationale: 문맥상 단순한 내면적 평안보다 안전과 질서를 포함하는 שָׁלוֹם의 의미를 살려, POB 기본어인 ‘평강’을 채택했습니다.
theological_decisions:
- issue: 야훼의 직접 화행을 한국어 예언문으로 어떻게 전달할지
  chosen_reading: 직접 인용부 안에서 현대 합쇼체를 유지하고, 하나님의 발화는 ‘말씀하십니다’로 처리했습니다.
  alternative_readings:
  - ‘말씀하신다’
  - ‘말씀하십니다’ 대신 단순 서술형으로 처리
  rationale: 본문은 선지자적 신탁의 도입문이므로, 한국어 독자는 현재적 선언으로 받아들이도록 합쇼체 직접화를 유지하는 편이 원문의 공적 선포성을 잘 드러냅니다.
  doctrine_reference: 예언자적 신탁 표현과 하나님의 직접 발화 방식
