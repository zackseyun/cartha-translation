  text: Look[a], Yahweh’s storm of wrath has gone out, a sweeping tempest[b]; it will whirl down on the head of the wicked.
  footnotes:
  - marker: a
    text: Or 'a storm of the LORD, wrath has gone forth; a churning tempest.' The Hebrew piles up storm terms for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'it will fall on the head of the wicked.' The final verb is difficult; the translation 'will whirl down' keeps the storm imagery prominent.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오[a], 야훼의 폭풍, 곧 진노가 나아갔습니다. 휩쓸고 가는 폭풍이 악인들의 머리 위에 몰아칠 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 폭풍, 진노가 나아갔다. 휩쓸고 가는 폭풍이다’로도 옮길 수 있습니다. 히브리어는 폭풍 관련 표현을 겹쳐 써서 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것이 악인들의 머리 위에 떨어질 것입니다’로도 옮길 수 있습니다. 끝동사는 해석이 어려우므로, 여기서는 폭풍의 움직임을 살린 표현을 택했습니다.
    reason: alternative_reading
