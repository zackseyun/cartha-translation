id: JER.30.11
reference: Jeremiah 30:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הֽוֹשִׁיעֶ֑/ךָ כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הֲפִצוֹתִ֣י/ךָ שָּׁ֗ם אַ֤ךְ אֹֽתְ/ךָ֙ לֹֽא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/011.yaml
  text: For I am with you—oracle of Yahweh—to save you[a]. For I will make a full end of all the nations where I have scattered you, but of you I will not make a full end. I will discipline you with justice[b], and I will by no means leave you unpunished.
  footnotes:
  - marker: a
    text: Or, 'declares the LORD.' The Hebrew prophetic formula נְאֻם יְהוָה is traditionally rendered this way.
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will certainly not acquit you.' The Hebrew literally intensifies the verb 'clear/acquit' with a negation.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너와 함께 있으니—야훼의 신탁이다—너를 구원하려고 한다. 내가 너를 흩어 버린 그 모든 나라들에는 완전한 끝을 내겠지만, 너에게는 완전한 끝을 내지 않을 것이다. 내가 너를 정의롭게 징계할 것이며, 결코 너를 무죄로 돌려세우지 않을 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''신탁''은 נְאֻם의 예언적 공식성을 살린 번역입니다. 더 매끈한 표현으로는 ''말씀이다'' 또는 ''선포하신다''가 가능합니다.'
    reason: lexical_alternative
  - marker: b
    text: '''무죄로 돌려세우지 않다''는 כאן의 강한 부정을 살린 해석적 번역입니다. 더 직역하면 ''결코 너를 무죄로 하지 않겠다''에 가깝습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִתְּ/ךָ ... לְהוֹשִׁיעֶ/ךָ
  english_pob_choice: For I am with you… to save you
  chosen_korean: 내가 너와 함께 있으니… 너를 구원하려고 한다
  alternatives_korean:
  - 내가 너와 함께 있으며… 너를 구하려고 한다
  - 내가 너와 함께 있으니… 너를 살리려고 한다
  lexicon: HALOT
  rationale: אִתְּךָ의 동반 선언과 לְהוֹשִׁיעֶךָ의 구원 목적을 자연스러운 현대 한국어로 연결했습니다. '구원하다'는 단순한 구조가 아니라 해방과 구출을 함께 담습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: oracle of Yahweh
  chosen_korean: 야훼의 신탁이다
  alternatives_korean:
  - 야훼의 말씀이다
  - 야훼께서 선포하신다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 공식이므로 서술형보다 '신탁'이 더 직접적으로 대응합니다. 한국어 관용어 '주님의 말씀'으로 완화하지 않고 공식의 격식을 살렸습니다.
- source_word: כָלָה
  english_pob_choice: a full end
  chosen_korean: 완전한 끝
  alternatives_korean:
  - 완전한 멸망
  - 끝장
  lexicon: HALOT
  rationale: 반복되는 כָלָה의 강도를 살리기 위해 '완전한 끝'을 택했습니다. '멸망'보다 원문의 종결·소진 이미지를 더 중립적으로 보존합니다.
- source_word: וְיִסַּרְתִּיךָ לַמִּשְׁפָּט
  english_pob_choice: I will discipline you with justice
  chosen_korean: 내가 너를 정의롭게 징계할 것이며
  alternatives_korean:
  - 내가 너를 공의로 징계할 것이며
  - 내가 너를 심판에 따라 징계할 것이며
  lexicon: HALOT
  rationale: יסר의 교정적 징계와 מִשְׁפָּט의 공정한 기준을 함께 살렸습니다. '정의롭게'는 징계의 자의성을 배제하면서도 관계 회복을 향한 corrective sense를 유지합니다.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  english_pob_choice: I will by no means leave you unpunished
  chosen_korean: 결코 너를 무죄로 돌려세우지 않을 것이다
  alternatives_korean:
  - 결코 너를 놓아주지 않을 것이다
  - 결코 너를 벌하지 않고 넘기지 않을 것이다
  lexicon: HALOT
  rationale: 문자적으로는 '정결하게 하다/무죄로 하다' 계열이지만, 여기서는 법정적 면책보다 징계 맥락이 우선입니다. 따라서 '무죄로 돌려세우다'를 써서 강한 부정과 책임 추궁을 드러냈습니다.
theological_decisions:
- issue: 예언 공식 נְאֻם יְהוָה를 한국어에서 어떻게 드러낼지
  chosen_reading: '''야훼의 신탁이다''로 옮겨 예언자적 공식성과 발화 주체를 분명히 했습니다.'
  alternative_readings:
  - '''야훼께서 말씀하신다'''
  - '''야훼의 말씀이다'''
  rationale: 본문은 단순한 전달이 아니라 예언적 선언입니다. '신탁'은 현대 한국어에서도 문체를 과도하게 고풍스럽게 하지 않으면서 공식적 무게를 유지합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: 마지막 절의 부정이 단순 면책 거부인지, 징계적 경고인지
  chosen_reading: 징계적 경고를 살려 '결코 너를 무죄로 돌려세우지 않을 것이다'로 옮겼습니다.
  alternative_readings:
  - 결코 너를 벌하지 않고 넘기지 않을 것이다
  - 결코 너를 면죄하지 않을 것이다
  rationale: 문맥은 구원과 보존을 말하면서도 동시에 공의로운 징계를 분명히 합니다. 그래서 완전한 면죄가 아니라 책임 있는 징계를 남기는 표현을 택해, 본문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
