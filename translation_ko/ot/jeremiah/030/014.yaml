id: JER.30.14
reference: Jeremiah 30:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל מְאַהֲבַ֣יִ/ךְ שְׁכֵח֔וּ/ךְ אוֹתָ֖/ךְ לֹ֣א יִדְרֹ֑שׁוּ כִּי֩ מַכַּ֨ת אוֹיֵ֤ב הִכִּיתִי/ךְ֙ מוּסַ֣ר אַכְזָרִ֔י עַ֚ל רֹ֣ב עֲוֺנֵ֔/ךְ עָצְמ֖וּ חַטֹּאתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/014.yaml
  text: All your lovers have forgotten you[a]; they do not seek you. For I have struck you with the wound of an enemy, with cruel discipline, because of the greatness of your iniquity[b]; your sins are numerous.
  footnotes:
  - marker: a
    text: Or 'your allies.' The Hebrew literally says 'your lovers,' preserving Jeremiah's recurring metaphor of illicit political and spiritual attachments.
    reason: lexical_alternative
  - marker: b
    text: Or 'with harsh correction' or 'with cruel chastisement.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 모든 사랑하는 자가 너를 잊어버렸고[a], 너를 찾지 않습니다. 내가 원수의 상처로 너를 치고, 잔혹한 징계로 너를 쳤으니, 이는 네 불법의 크기 때문입니다[b]. 네 죄악이 많습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 동맹들’. 히브리어는 문자적으로 ‘네 사랑하는 자들/연인들’이라고 하며, 예레미야의 반복되는 정치·영적 은유를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가혹한 징계’ 또는 ‘잔혹한 징벌’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבַיִךְ
  english_pob_choice: your lovers
  chosen_korean: 네 모든 사랑하는 자
  alternatives_korean:
  - 네 연인들
  - 네 동맹들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘사랑하는 이들/연인들’을 뜻하며, 예레미야의 반복적 은유를 살리기 위해 직역에 가까운 표현을 택했습니다. ‘동맹들’은 가능한 정치적 의미이지만 은유를 평평하게 만들 수 있습니다.
- source_word: מַכַּת אוֹיֵב
  english_pob_choice: the wound of an enemy
  chosen_korean: 원수의 상처
  alternatives_korean:
  - 원수의 타격
  - 원수의 매질
  lexicon: HALOT
  rationale: מַכָּה는 ‘타격/상처/재앙’의 폭이 있으나, 뒤의 ‘내가 너를 쳤다’와 함께 읽을 때 ‘상처’가 결과로서의 피해를 자연스럽게 드러냅니다. 속격 구조도 한국어에서 소유격으로 간결하게 옮겼습니다.
- source_word: מוּסַר אַכְזָרִי
  english_pob_choice: with cruel discipline
  chosen_korean: 잔혹한 징계
  alternatives_korean:
  - 가혹한 훈계
  - 잔인한 징벌
  lexicon: HALOT
  rationale: מוּסָר은 징계/교정/훈련의 의미를 가지므로 교회적 관용구에 갇히지 않게 ‘징계’를 택했습니다. אַכְזָרִי의 강한 잔혹성을 ‘잔혹한’으로 살렸습니다.
- source_word: עַל רֹב עֲוֺנֵךְ
  english_pob_choice: because of the greatness of your iniquity
  chosen_korean: 네 불법의 크기 때문입니다
  alternatives_korean:
  - 네 죄악의 많음 때문입니다
  - 네 죄의 크기 때문입니다
  lexicon: HALOT
  rationale: עָוֹן은 문맥상 단순한 실수가 아니라 하나님 앞의 불법/죄책을 가리키므로 ‘불법’이 더 직접적입니다. רֹב는 양적 ‘많음’보다 질적·정량적 ‘크기’로도 옮길 수 있어, 여기서는 심판의 근거를 분명히 하는 방향을 택했습니다.
- source_word: עָצְמוּ חַטֹּאתָיִךְ
  english_pob_choice: your sins are numerous
  chosen_korean: 네 죄악이 많습니다
  alternatives_korean:
  - 네 죄가 많아졌습니다
  - 네 죄가 매우 많습니다
  lexicon: HALOT
  rationale: עצם은 ‘많아지다/세지다’의 뉘앙스를 가지며, 반복 병행 속에서 최종 진술은 상태를 간결하게 요약합니다. ‘죄악이 많습니다’가 현대 한국어에서 가장 자연스럽고 병행 구조도 살립니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위와 원인 진술
  chosen_reading: 하나님이 직접 ‘너를 치셨다’고 말하면서도, 그 근거를 ‘네 불법의 크기’와 ‘네 죄악이 많음’에 둡니다.
  alternative_readings:
  - 원수의 공격만 강조하는 읽기
  - 단순한 결과론으로 완화하는 읽기
  rationale: 히브리어는 인간 원수의 상처 언어를 쓰면서도 주어를 하나님으로 명시하므로, 심판의 직접성과 도구적 비유를 함께 보존해야 합니다. 인과절도 그대로 유지해 죄와 심판의 긴장을 흐리지 않았습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
