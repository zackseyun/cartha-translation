source:
  edition: WLC
  text: כִּי֩ אַעֲלֶ֨ה אֲרֻכָ֥ה לָ֛/ךְ וּ/מִ/מַּכּוֹתַ֥יִ/ךְ אֶרְפָּאֵ֖/ךְ נְאֻם יְהוָ֑ה כִּ֤י נִדָּחָה֙ קָ֣רְאוּ לָ֔/ךְ צִיּ֣וֹן הִ֔יא דֹּרֵ֖שׁ אֵ֥ין לָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
  footnotes:
  - marker: a
    text: Or 'I will restore health to you.' The Hebrew idiom is literally 'I will cause healing to come up for you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because they called you “Outcast.”' The Hebrew participle can mean 'driven away' or 'cast off.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'Zion—there is no one seeking her,' that is, no one cares for or comes to her aid.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게 회복을 가져오고, 네 상처에서 너를 고치겠습니다 — 야훼의 말씀입니다. 그들이 너를 ‘버림받은 자’라고 불렀기 때문입니다. 「시온입니다. 그녀를 찾는 이가 없습니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너를 위해 치유가 올라오게 하겠다’라는 관용구입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘버림받은 자’로도 옮길 수 있습니다. 히브리어 분사에는 ‘쫓겨난’, ‘내쫓긴’의 뜻도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘그녀를 찾는 이가 없다’, 곧 돌보거나 구해 줄 사람이 없다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַעֲלֶה אֲרֻכָה
  english_pob_choice: I will bring healing
  chosen_korean: 회복을 가져오고
  alternatives_korean:
  - 치유를 가져오고
  - 건강을 회복시키고
  - 회복을 일으키고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도, 병든 상태의 단순한 ‘치유’보다 문맥상 공동체적·신체적 회복을 포함하는 표현으로 옮겼습니다.
- source_word: וּמִמַּכּוֹתַיִךְ אֶרְפָּאֵךְ
  english_pob_choice: and I will heal you from your wounds
  chosen_korean: 네 상처에서 너를 고치겠습니다
  alternatives_korean:
  - 네 상처를 고치겠습니다
  - 네 상처들을 치료하겠습니다
  - 네 상처로부터 너를 회복시키겠습니다
  lexicon: HALOT
  rationale: מַכּוֹת(상처/타격)의 결과를 자연스럽게 드러내되, מן 구문의 출발점을 ‘...에서’로 살려 원문의 방향성을 보존했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  - 야훼의 말씀이니라
  lexicon: HALOT
  rationale: 이 사역본의 기준에 따라 신명기적 고유명사 יְהוָה를 ‘야훼’로 옮기고, 예언문 공식은 한국어에서 가장 자연스러운 종결로 처리했습니다.
- source_word: נִדָּחָה
  english_pob_choice: an outcast
  chosen_korean: 버림받은 자
  alternatives_korean:
  - 쫓겨난 자
  - 내쫓긴 자
  - 버려진 자
  lexicon: HALOT
  rationale: ‘outcast’의 사회적 배제와 언약적 수치가 함께 드러나도록, 단순한 공간 이동보다 관계적 단절을 강조하는 표현을 택했습니다.
- source_word: הִיא דֹּרֵשׁ אֵין לָהּ
  english_pob_choice: no one cares for her
  chosen_korean: 그녀를 찾는 이가 없습니다
  alternatives_korean:
  - 그녀를 돌보는 이가 없습니다
  - 그녀를 찾는 사람이 없습니다
  - 그녀에게 관심을 두는 이가 없습니다
  lexicon: HALOT
  rationale: דֹּרֵשׁ의 기본 의미인 ‘찾다/구하다’를 살리면서, 문맥상 ‘관심을 두다’의 함의를 과하게 풀이하지 않고 간결하게 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 처리
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 용례를 따르며, 원문의 언약명 사용을 한국어 본문에서 가시화하기 위함입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 인용부의 시온 발화
  chosen_reading: ‘시온입니다. 그녀를 찾는 이가 없습니다’로 따옴표 안에 보존했습니다.
  alternative_readings:
  - 시온이라는 말입니다. 그녀를 찾는 이가 없습니다
  - 시온입니다—그녀를 찾는 이가 없습니다
  rationale: 히브리어의 직접 인용 구조를 유지해 수치의 낙인과 그 반전을 강조했습니다.
  doctrine_reference: Jeremiah 30:17 rhetorical structure
