base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
  footnotes:
  - marker: a
    text: Or 'I will restore health to you.' The Hebrew idiom is literally 'I will cause healing to come up for you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because they called you “Outcast.”' The Hebrew participle can mean 'driven away' or 'cast off.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'Zion—there is no one seeking her,' that is, no one cares for or comes to her aid.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네게 치유를 가져다주고, 네 상처에서 너를 낫게 하겠다. 야훼의 말씀입니다. 그들이 너를 ‘버림받은 자’라고 부르고, ‘시온은 아무도 찾지 않는다’라고 말하였기 때문이다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너를 위해 치유가 올라오게 하겠다’라는 관용구입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘쫓겨난 자’, ‘내쫓긴 자’로 옮길 수 있습니다. 히브리어 분사는 ‘내몰린’, ‘버려진’이라는 뜻을 지닙니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘시온—그를 찾는 이가 없다’입니다. 곧 그를 돌보거나 찾아와 도울 사람이 없다는 뜻입니다.
    reason: alternative_reading
