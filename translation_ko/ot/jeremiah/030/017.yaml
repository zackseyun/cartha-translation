    issue: 마지막 인용부의 한국어 직접 인용이 부자연스럽고 지시 관계가 불명확함
    rationale: ‘시온입니다. 그녀를 찾는 이가 없습니다’는 원문의 ‘Zion—no one seeks her’라는 조롱의 발화를 한국어에서 자연스럽게 재현하지 못합니다. ‘시온은 아무도 찾지 않는다’라고 옮기면 시온을 향한 멸시의 발화가 명료해집니다.
