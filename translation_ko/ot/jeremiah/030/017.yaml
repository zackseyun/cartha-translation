  rationale: ‘outcast’의 사회적 배제와 언약적 수치가 함께 드러나도록, 단순한 공간 이동보다 관계적 단절을 강조하는 표현을 택했습니다.
- source_word: הִיא דֹּרֵשׁ אֵין לָהּ
