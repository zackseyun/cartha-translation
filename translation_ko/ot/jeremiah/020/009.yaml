id: JER.20.9
reference: Jeremiah 20:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתִּ֣י לֹֽא אֶזְכְּרֶ֗/נּוּ וְ/לֹֽא אֲדַבֵּ֥ר עוֹד֙ בִּ/שְׁמ֔/וֹ וְ/הָיָ֤ה בְ/לִבִּ/י֙ כְּ/אֵ֣שׁ בֹּעֶ֔רֶת עָצֻ֖ר בְּ/עַצְמֹתָ֑/י וְ/נִלְאֵ֥יתִי כַּֽלְכֵ֖ל וְ/לֹ֥א אוּכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/009.yaml
  text: If I say[a], “I will not mention him, or speak any longer in his name,” then in my heart it is like a burning fire, shut up in my bones; I grow weary of holding it in[c][b], and I cannot.
  footnotes:
  - marker: a
    text: Or 'I will not remember him.' The Hebrew verb can mean either 'remember' or 'mention'; here 'mention' fits the parallel with speaking.
    reason: lexical_alternative
  - marker: b
    text: That is, speak as his representative or under his authority.
    reason: cultural_note
  - marker: c
    text: The Hebrew leaves the subject implicit; the sense is likely the LORD's message or the compulsion to speak it.
    reason: alternative_reading
translation:
  language: ko
  text: 제가 말하기를 “나는 그를 기억하지 않겠고, 다시는 그의 이름으로 말하지 않겠다” 하면, 내 마음에는 타오르는 불처럼, 내 뼈속에 가두어진 불이 있습니다. 나는 그것을 억누르느라 지치지만, 견딜 수 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘기억하다’와 ‘언급하다’ 둘 다 될 수 있습니다. 여기서는 뒤의 ‘그의 이름으로 말하다’와 평행을 이루므로 ‘언급하다’의 뜻이 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 예언자로서 그분의 권위 아래, 또는 그분을 대표하여 말한다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 이 불의 정확한 주어를 분명히 밝히지 않습니다. 문맥상 야훼의 말씀 또는 그것을 말해야 하는 강박을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתִּי
  english_pob_choice: If I say
  chosen_korean: 제가 말하기를
  alternatives_korean:
  - 만일 제가 말한다면
  - 내가 말하기를
  lexicon: HALOT
  rationale: 가정적 내면 독백의 흐름을 살리면서도 현대 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: אֶזְכְּרֶנּוּ
  english_pob_choice: I will not mention him
  chosen_korean: 나는 그를 기억하지 않겠고
  alternatives_korean:
  - 나는 그를 언급하지 않겠고
  - 나는 그를 생각하지 않겠고
  lexicon: HALOT
  rationale: זכר의 ‘기억하다/언급하다’ 중 여기서는 말하기와 병행되므로 ‘언급하다’가 잘 맞지만, 한국어에서는 ‘기억하다’가 더 직접적으로 결심의 억제를 드러내어 본문 의미를 살렸습니다.
- source_word: אֲדַבֵּר עוֹד בִּשְׁמוֹ
  english_pob_choice: or speak any longer in his name
  chosen_korean: 다시는 그의 이름으로 말하지 않겠다
  alternatives_korean:
  - 더는 그의 이름으로 말하지 않겠다
  - 그의 이름으로 다시 말하지 않겠다
  lexicon: HALOT
  rationale: ‘그의 이름으로’는 대표적/권위 아래서 말한다는 관용구를 보존했고, ‘다시는’으로 더 이상 말하지 않겠다는 결의를 자연스럽게 표현했습니다.
- source_word: כְּאֵשׁ בֹּעֶרֶת
  english_pob_choice: like a burning fire
  chosen_korean: 타오르는 불처럼
  alternatives_korean:
  - 불타는 불처럼
  - 활활 타는 불처럼
  lexicon: HALOT
  rationale: 겹말이 어색하지 않도록 한국어에서는 ‘타오르는 불’로 이미지의 강도를 유지했습니다.
- source_word: עָצֻר בְּעַצְמֹתַי
  english_pob_choice: shut up in my bones
  chosen_korean: 내 뼈속에 가두어진
  alternatives_korean:
  - 내 뼈속에 갇힌
  - 내 뼈에 억눌린
  lexicon: HALOT
  rationale: עצור의 ‘가두다/막다’ 뉘앙스를 살리면서, 신체 내부에 갇힌 강한 압박감을 드러내는 표현을 택했습니다.
- source_word: וְנִלְאֵיתִי כַּלְכֵּל
  english_pob_choice: I grow weary of holding it in
  chosen_korean: 나는 그것을 억누르느라 지치지만
  alternatives_korean:
  - 나는 그것을 견디느라 지치지만
  - 나는 그것을 간직하느라 지치지만
  lexicon: HALOT
  rationale: כַּלְכֵּל의 ‘붙들어 두다/억제하다’ 의미를 한국어의 ‘억누르다’로 옮겨, 예언적 충동을 억압하려는 고통을 분명히 했습니다.
- source_word: וְלֹא אוּכָל
  english_pob_choice: and I cannot
  chosen_korean: 견딜 수 없습니다
  alternatives_korean:
  - 할 수 없습니다
  - 막을 수 없습니다
  lexicon: HALOT
  rationale: 생략된 목적어를 한국어에서 자연스럽게 보충하되, 단순 능력 부족이 아니라 억눌러 두지 못하는 내적 불가능성을 드러냈습니다.
theological_decisions:
- issue: ‘그의 이름으로’의 지시 대상과 대명사 유지
  chosen_reading: 본문의 대명사와 관용구를 유지해, 예레미야의 직접적인 내적 독백과 예언자적 소명을 드러냈습니다.
  alternative_readings:
  - ‘주님의 이름으로’로 명시하기
  - ‘그를’ 대신 ‘야훼를’로 풀어쓰기
  rationale: 히브리어는 대명사를 사용하며, 문맥상 지시 대상은 분명하지만 본문 자체의 긴장감을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘내 마음에는 … 불이 있습니다’의 주어 처리
  chosen_reading: 불을 본문에 명시적으로 두되, 억압된 메시지의 내적 압박감을 드러내는 방식으로 번역했습니다.
  alternative_readings:
  - ‘내 마음은 불같습니다’로 단순화하기
  - ‘그의 말이 내 마음에 불같다’로 풀어쓰기
  rationale: 히브리어는 명시적 명사가 불분명한 상태를 남기므로, 그 모호성을 완전히 해소하지 않고 감각적 이미지로 전달했습니다.
  doctrine_reference: Translation philosophy §3
