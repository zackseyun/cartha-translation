  rationale: 본문의 우선 어휘 의미에 따라 ‘기억하지 않겠다’를 ‘언급하지 않겠다’로 고쳤습니다. 한국어 문체를 현대 합쇼체로 통일하고, 원문의 암시적 주어를 ‘불과 같은 것’으로만 표현하여 그 정체를 특정하지 않았습니다. 마지막의 불가능은 억누르거나 붙들어 두는 일을 감당하지 못한다는 문맥적 의미를 보존했습니다.
