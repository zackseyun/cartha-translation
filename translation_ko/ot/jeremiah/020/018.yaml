translation:
  language: ko
  text: 어찌하여 내가 태에서 나와 trouble과 sorrow를 보게 되었고, 나의 날들이 수치 속에서 끝나게 되었습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수고와 슬픔’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘나의 날들이 수치 속에서 소모되게 되었습니까?’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  english_pob_choice: Why did I
  chosen_korean: 어찌하여 내가
  alternatives_korean:
  - 왜 내가
  - 왜 하필 내가
  lexicon: HALOT
  rationale: 직접적인 질문의 힘과 זֶּה의 강조를 살리되, 한국어에서는 자연스러운 수사 의문형인 ‘어찌하여’가 가장 적절합니다.
- source_word: מֵרֶחֶם
  english_pob_choice: from the womb
  chosen_korean: 태에서
  alternatives_korean:
  - 배에서
  - 어머니의 태에서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘태/자궁에서’라는 이미지를 쓰므로, ‘태에서’가 본문 이미지를 가장 가깝게 보존합니다.
- source_word: עָמָל וְיָגוֹן
  english_pob_choice: trouble and sorrow
  chosen_korean: 고통과 슬픔
  alternatives_korean:
  - 수고와 근심
  - 괴로움과 슬픔
  lexicon: HALOT
  rationale: 이 결합은 단순 노동보다 삶의 고통과 내적 비탄을 가리키므로, 한국어에서는 시편적·예언자적 탄식에 맞는 ‘고통과 슬픔’이 자연스럽습니다.
- source_word: בְּבֹשֶׁת
  english_pob_choice: in shame
  chosen_korean: 수치 속에서
  alternatives_korean:
  - 부끄러움 속에서
  - 수치 가운데
  lexicon: HALOT
  rationale: בֹּשֶׁת는 단순한 감정적 부끄러움보다 공개적 수치와 치욕을 포함하므로, ‘수치 속에서’가 의미 범위를 잘 드러냅니다.
theological_decisions:
- issue: 예레미야의 탄식어조를 한국어에서 어떻게 살릴 것인가
  chosen_reading: 반말이 아닌 공손한 탄식형 의문문으로 옮기되, 내용은 예언자의 절규로 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하는 번역
  - 더 장중한 고어체 의문문
  rationale: 본문은 하나님 앞에서의 강한 탄식이므로, 현대 한국어 합쇼체로도 절규의 긴장을 보존하는 것이 좋습니다.
  doctrine_reference: 예언서의 탄식문학과 기도 언어
