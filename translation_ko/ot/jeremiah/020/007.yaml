id: JER.20.7
reference: Jeremiah 20:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פִּתִּיתַ֤/נִי יְהוָה֙ וָֽ/אֶפָּ֔ת חֲזַקְתַּ֖/נִי וַ/תּוּכָ֑ל הָיִ֤יתִי לִ/שְׂחוֹק֙ כָּל הַ/יּ֔וֹם כֻּלֹּ֖/ה לֹעֵ֥ג לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/007.yaml
  text: You persuaded me[a], Yahweh, and I was persuaded; you overpowered me and prevailed. I have become a laughingstock all day long; everyone mocks me.
  footnotes:
  - marker: a
    text: Or, 'You deceived me, LORD, and I was deceived.' The Hebrew verb can carry the sense of entice, persuade, or deceive; Jeremiah's lament is intentionally forceful.
    reason: alternative_reading
translation:
  language: ko
  text: 주님, 주님께서 저를 설득하셨고 저는 설득되었습니다. 주님께서 저를 압도하셨고, 마침내 이기셨습니다. 저는 온종일 조롱거리가 되었고, 모두가 저를 비웃습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님, 주님께서 저를 속이셨고 저는 속았습니다.’ 히브리어 동사는 유혹하다, 설득하다, 속이다의 뜻을 모두 가질 수 있으며, 예레미야의 탄식은 의도적으로 강한 항의를 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתִּיתַנִי / וָאֶפָּת
  english_pob_choice: You persuaded me / and I was persuaded
  chosen_korean: 저를 설득하셨고 저는 설득되었습니다
  alternatives_korean:
  - 저를 속이셨고 저는 속았습니다
  - 저를 유혹하셨고 저는 유혹되었습니다
  lexicon: HALOT
  rationale: פתה는 문맥에 따라 ‘설득하다/유혹하다/속이다’의 폭이 있으므로, मुख्य text에서는 하나님의 직접적 기만을 단정하지 않으면서도 예레미야의 강한 항의를 살리는 ‘설득하다’ 계열을 택했습니다.
- source_word: חֲזַקְתַּנִי
  english_pob_choice: you overpowered me
  chosen_korean: 저를 압도하셨고
  alternatives_korean:
  - 저보다 강하셨고
  - 저를 붙들어 제압하셨고
  lexicon: HALOT
  rationale: חזק의 힘으로 누르는 뉘앙스를 살려, 단순 비교보다 관계적·체험적 강압을 드러내는 ‘압도하다’로 옮겼습니다.
- source_word: וַתּוּכָל
  english_pob_choice: and prevailed
  chosen_korean: 마침내 이기셨습니다
  alternatives_korean:
  - 그리고 이기셨습니다
  - 그리고 우세하셨습니다
  lexicon: HALOT
  rationale: יכל은 ‘이기다/이겨내다/우세하다’의 뜻이므로, 앞 절의 압도와 연결되는 결과를 자연스러운 한국어로 드러내기 위해 ‘마침내 이기셨습니다’로 옮겼습니다.
- source_word: הָיִיתִי לִשְׂחוֹק ... לֹעֵג לִי
  english_pob_choice: I have become a laughingstock ... everyone mocks me
  chosen_korean: 온종일 조롱거리가 되었고, 모두가 저를 비웃습니다
  alternatives_korean:
  - 온종일 웃음거리가 되었고, 모두가 저를 조롱합니다
  - 온종일 비웃음거리가 되었고, 모두가 저를 비웃습니다
  lexicon: HALOT
  rationale: לִשְׂחוֹק은 ‘웃음거리/조롱거리’의 대상이 되는 상태를, לֹעֵג는 지속적 조롱 행위를 가리키므로 각각 상태와 행위를 구분해 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: פִּתִּיתַנִי의 강한 뉘앙스를 मुख्य text에서 어떻게 유지할지
  chosen_reading: 주요 본문에는 ‘설득하셨다’를 두되, 하나님의 기만을 단정하는 표현은 피했습니다.
  alternative_readings:
  - 저를 속이셨습니다
  - 저를 유혹하셨습니다
  rationale: 예레미야의 탄식은 하나님의 부르심이 가져온 고통을 매우 날카롭게 토로하지만, 히브리어 동사의 의미 범위가 넓으므로 본문은 과도한 신학적 결론을 피하면서도 긴장을 유지하는 방향이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
