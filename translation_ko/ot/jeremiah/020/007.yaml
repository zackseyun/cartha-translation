    rationale: 원문은 יהוה이며, 제공된 English POB 및 프로젝트 방침은 이를 ‘Yahweh’로 음역합니다. 일반 호칭 ‘주님’은 고유 이름을 대체합니다.
  - severity: low
    issue: ‘마침내’가 וַתּוּכָל에 첨가되었습니다.
    rationale: 동사는 ‘이기다/우세하다’라는 결과를 뜻하지만 시간적 종결이나 지연을 명시하지 않습니다.
