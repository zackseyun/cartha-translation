  - severity: low
    issue: 각주 c가 본문의 표현을 그대로 반복함
    rationale: ‘또는 영원히 임신한 상태’는 본문과 동일하여 대안 번역 각주로 기능하지 않습니다. 어순과 표현이 실제로 다른 ‘임신한 채 영원히’를 제시하는 것이 적절합니다.
