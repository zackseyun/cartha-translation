id: JER.20.17
reference: Jeremiah 20:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֥ר לֹא מוֹתְתַ֖/נִי מֵ/רָ֑חֶם וַ/תְּהִי לִ֤/י אִמִּ/י֙ קִבְרִ֔/י וְ/רַחְמָ֖/הֿ הֲרַ֥ת עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/017.yaml
  text: because he did not kill me from the womb[a], so that my mother would have been my grave[c][b], and her womb forever pregnant.
  footnotes:
  - marker: a
    text: Or, more literally, 'who did not kill me from the womb.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''my mother my grave,'' a compressed metaphor meaning that had he died in the womb, his mother would have served as his grave.'
    reason: cultural_note
  - marker: c
    text: Or 'pregnant forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 태에서 죽이지 않으셔서, 어머니가 내 무덤이 되었을 것이며, 그분의 태가 영원히 임신한 상태였을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘태에서 나를 죽이지 않은’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘어머니, 내 무덤’이라는 압축된 은유를 사용합니다. 즉, 태에서 죽었더라면 어머니가 곧 무덤의 역할을 했을 것이라는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영원히 임신한 상태’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: because
  chosen_korean: -아서 / -어서의 원인절
  alternatives_korean:
  - -인 자
  - -것
  lexicon: HALOT
  rationale: 문맥상 14–18절의 저주의 이유를 잇는 원인 관계이므로, 단순 관계절보다 원인절로 풀어 주는 것이 자연스럽습니다.
- source_word: מוֹתְתַנִי מֵרָחֶם
  english_pob_choice: did not kill me from the womb
  chosen_korean: 나를 태에서 죽이지 않으셔서
  alternatives_korean:
  - 나를 태에서 죽이지 않으셔서
  - 나를 태 안에서 죽게 하지 않으셔서
  lexicon: HALOT
  rationale: ‘죽이다’의 직접적 타동성을 살리되, מִן의 기원을 ‘태에서’로 옮겨 원문 이미지를 보존했습니다.
- source_word: וַתְּהִי לִי אִמִּי קִבְרִי
  english_pob_choice: so that my mother would have been my grave
  chosen_korean: 어머니가 내 무덤이 되었을 것이며
  alternatives_korean:
  - 어머니가 내 무덤이 되었을 것이며
  - 어머니가 나의 무덤이 되었을 텐데
  lexicon: HALOT
  rationale: 히브리어의 압축된 은유—‘어머니’와 ‘무덤’의 충돌—를 그대로 살리기 위해 직역에 가깝게 옮겼습니다.
- source_word: וְרַחְמָהּ הֲרַת עוֹלָם
  english_pob_choice: and her womb forever pregnant
  chosen_korean: 그분의 태가 영원히 임신한 상태였을 것입니다
  alternatives_korean:
  - 그분의 태가 영원히 임신한 상태였을 것입니다
  - 그분의 태는 영원한 임신이 되었을 것입니다
  lexicon: HALOT
  rationale: רֶחֶם을 해부학적 의미의 ‘태’로 옮기고, הֲרַת עוֹלָם을 자연스러운 현대어로 풀어 ‘영원히 임신한 상태’로 재현했습니다.
theological_decisions:
- issue: 비현실적 가정/회한의 문장 구조
  chosen_reading: ‘되었을 것이며’로 반사실적 후회를 드러내어, 태 안에서 죽었더라면 어머니가 무덤이 되었을 것이라는 탄식을 살렸습니다.
  alternative_readings:
  - 단순 과거형으로 ‘어머니가 내 무덤이 되었습니다’라고 옮김
  rationale: 문맥은 실제 진술이 아니라 출생을 저주하는 탄식이므로, 반사실적 뉘앙스를 한국어에서도 분명히 해야 합니다.
  doctrine_reference: 'Translation philosophy §3: 문맥이 허용하는 탄식의 긴장을 해소하지 않고 보존'
