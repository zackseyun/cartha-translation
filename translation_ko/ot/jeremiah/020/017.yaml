  source_fidelity: 원문의 인과적 관계절, ‘태에서’라는 표현, 어머니=무덤의 압축 은유, 그리고 영구적인 임신 상태의 이미지는 대체로 충실히 반영되었습니다. 다만 원문에는 존대의 근거가 없으므로 ‘죽이지 않으셔서’와 ‘그분의’는 제거하는 것이 적절합니다.
  naturalness: ‘그분의 태’는 어머니를 가리키는 데 다소 부자연스럽고 존대도 불필요합니다. ‘어머니의 태’로 명시하면 선행사가 분명하고 현대 한국어로도 자연스럽습니다. 각주 표지는 해당 표현 바로 뒤에 두는 편이 독해에 좋습니다.
  terminology: ‘태’, ‘무덤’, ‘임신한 상태’는 이 문맥에서 적절합니다. ‘어머니’에 대한 불필요한 존대 표현은 원문의 인물 지시와 한국어 문체 모두에 맞지 않습니다.
