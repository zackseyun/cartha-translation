  to: 그러나 야훼께서는 나와 함께 계시며, 강하고 위압적인 용사 같으십니다.[a] 그러므로 나를 박해하는 자들[b]은 비틀거릴 것이며 이기지 못할 것입니다. 그들은 크게 수치를 당할 것이니, 그들이 지혜롭게 행하지 않았기 때문입니다.[c] 그들의 영원한 치욕은 잊히지 않을 것입니다.
