id: JER.20.11
reference: Jeremiah 20:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אוֹתִ/י֙ כְּ/גִבּ֣וֹר עָרִ֔יץ עַל כֵּ֛ן רֹדְפַ֥/י יִכָּשְׁל֖וּ וְ/לֹ֣א יֻכָ֑לוּ בֹּ֤שׁוּ מְאֹד֙ כִּֽי לֹ֣א הִשְׂכִּ֔ילוּ כְּלִמַּ֥ת עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/011.yaml
  text: But Yahweh is with me like a mighty warrior[a]; therefore my persecutors will stumble and will not prevail. They will be utterly ashamed, because they have not acted wisely[c][b]; their everlasting disgrace will not be forgotten.
  footnotes:
  - marker: a
    text: 'Hebrew: ''like a mighty, formidable warrior.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'my pursuers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'because they have not understood' / 'because they have not acted with insight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 나와 함께 계시며, 강한 용사 같으십니다. 그러므로 나를 박해하는 자들은 비틀거리며 이기지 못할 것입니다. 그들은 크게 수치를 당할 것이니, 자기들이 지혜롭게 행하지 못했기 때문입니다. 그들의 영원한 치욕은 잊히지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘강하고 위압적인 용사 같은’의 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 뒤쫓는 자들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들이 깨닫지 못했기 때문입니다’ / ‘분별이 없었기 때문입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: But Yahweh
  chosen_korean: 그러나 야훼께서는
  alternatives_korean:
  - 그리고 야훼께서는
  - 야훼께서는
  lexicon: WLC / project default for יהוה
  rationale: 문맥상 예레미야의 탄식에서 반전되는 접속이므로 ‘그러나’가 자연스럽고, 고유 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אוֹתִי
  english_pob_choice: with me
  chosen_korean: 나와 함께 계시며
  alternatives_korean:
  - 나와
  - 나를
  lexicon: WLC / HALOT
  rationale: 히브리어는 직역하면 ‘나를’이지만, 여기서는 하나님의 임재와 보호를 나타내는 관용적 뜻이므로 한국어로는 ‘나와 함께 계시며’가 더 정확합니다.
- source_word: כְגִבּוֹר עָרִיץ
  english_pob_choice: like a mighty warrior
  chosen_korean: 강한 용사 같으십니다
  alternatives_korean:
  - 힘센 전사 같으십니다
  - 무서운 용사 같으십니다
  lexicon: HALOT
  rationale: גִּבּוֹר의 전투적 힘과 עָרִיץ의 위압성을 살리되, 한국어로는 지나치게 어색한 직역보다 ‘강한 용사’가 의미를 잘 전달합니다.
- source_word: רֹדְפַי
  english_pob_choice: my persecutors
  chosen_korean: 나를 박해하는 자들은
  alternatives_korean:
  - 나를 추격하는 자들은
  - 나를 뒤쫓는 자들은
  lexicon: HALOT
  rationale: רדף는 ‘뒤쫓다/박해하다’ 둘 다 가능하지만, 예레미야의 적대적 상황에서는 단순 추적보다 ‘박해’가 더 분명합니다.
- source_word: יֻכָלוּ
  english_pob_choice: will not prevail
  chosen_korean: 이기지 못할 것입니다
  alternatives_korean:
  - 능히 못할 것입니다
  - 성공하지 못할 것입니다
  lexicon: HALOT
  rationale: 기본 의미는 ‘능하다’이지만, 여기서는 대적 관계에서 결과적으로 우세하지 못함을 뜻하므로 ‘이기지 못하다’가 자연스럽습니다.
- source_word: כִּי לֹא הִשְׂכִּילוּ
  english_pob_choice: because they have not acted wisely
  chosen_korean: 자기들이 지혜롭게 행하지 못했기 때문입니다
  alternatives_korean:
  - 그들이 깨닫지 못했기 때문입니다
  - 그들이 분별 있게 행하지 못했기 때문입니다
  lexicon: HALOT
  rationale: הִשְׂכִּיל은 단순 지적 이해보다 ‘지혜롭게 행동하다/분별 있게 행하다’의 뜻이 강해, 수치의 이유를 행위의 어리석음으로 살렸습니다.
- source_word: כְּלִמַּת עוֹלָם לֹא תִשָּׁכֵחַ
  english_pob_choice: their everlasting disgrace will not be forgotten
  chosen_korean: 그들의 영원한 치욕은 잊히지 않을 것입니다
  alternatives_korean:
  - 그들의 영원한 수치는 잊히지 않을 것입니다
  - 그들의 끝없는 치욕은 잊히지 않을 것입니다
  lexicon: HALOT
  rationale: כְּלִמָּה는 ‘수치/치욕/굴욕’의 뜻이므로 한국어에서는 문맥상 강한 ‘치욕’이 적절하며, עוֹלָם은 지속성을 나타내어 ‘영원한’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
