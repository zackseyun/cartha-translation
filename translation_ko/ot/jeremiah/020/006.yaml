  rationale: ‘거짓으로 예언하다’는 한국어 관용을 살려, 예언 행위 자체의 허위를 분명히 했습니다.
theological_decisions:
- issue: 예언의 허위성 표현
  chosen_reading: ‘거짓으로 예언한’으로 번역해, 발화 내용의 허위와 거짓 예언의 책망을 함께 드러냈습니다.
  alternative_readings:
  - ‘거짓말을 예언한’
  - ‘거짓을 말한’
  rationale: 본문은 파스훌의 예언이 야훼의 참된 말씀에 어긋났음을 고발하므로, 단순한 ‘거짓말’보다 ‘예언’의 직무 실패를 드러내는 표현이 적절합니다.
  doctrine_reference: 거짓 예언에 대한 성경의 윤리적·예언자적 책망을 보존합니다.
