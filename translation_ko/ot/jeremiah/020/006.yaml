  edition: WLC
  text: וְ/אַתָּ֣ה פַשְׁח֗וּר וְ/כֹל֙ יֹשְׁבֵ֣י בֵיתֶ֔/ךָ תֵּלְכ֖וּ בַּ/שֶּׁ֑בִי וּ/בָבֶ֣ל תָּב֗וֹא וְ/שָׁ֤ם תָּמוּת֙ וְ/שָׁ֣ם תִּקָּבֵ֔ר אַתָּה֙ וְ/כָל אֹ֣הֲבֶ֔י/ךָ אֲשֶׁר נִבֵּ֥אתָ לָ/הֶ֖ם בַּ/שָּֽׁקֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
  footnotes:
  - marker: a
    text: Or, 'to whom you prophesied lies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신, 파스훌, 그리고 당신 집에 사는 모든 사람은 포로로 끌려갈 것입니다. 당신은 바빌론으로 가게 될 것이며, 거기에서 죽고 거기에서 묻힐 것입니다. 당신과 당신이 거짓으로 예언한 모든 사랑하는 이들이 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘당신이 그들에게 거짓말을 예언한 이들.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה פַשְׁחוּר
  english_pob_choice: And you, Pashhur
  chosen_korean: 그리고 당신, 파스훌
  alternatives_korean:
  - 그리고 파스훌 당신
  - 파스훌, 당신도
  lexicon: WLC / 현대 외래어 표기 관례
  rationale: 직접 호명 구조를 살리되, 현대 한국어에서 자연스러운 문두 배열로 옮겼습니다.
- source_word: יֹשְׁבֵי בֵיתֶךָ
  english_pob_choice: all who live in your house
  chosen_korean: 당신 집에 사는 모든 사람
  alternatives_korean:
  - 당신 집에 거주하는 모든 사람
  - 당신 집의 모든 거주자
  lexicon: HALOT
  rationale: ‘거주자’보다 자연스럽고, 집안 식구 전체가 아니라 ‘집에 사는 사람들’이라는 거주 범위를 유지합니다.
- source_word: תֵּלְכוּ בַּשֶּׁבִי
  english_pob_choice: will go into captivity
  chosen_korean: 포로로 끌려갈 것입니다
  alternatives_korean:
  - 포로가 되어 갈 것입니다
  - 포로 생활로 들어갈 것입니다
  lexicon: HALOT
  rationale: שבי의 강제적 포획 뉘앙스를 살려 ‘포로로 끌려가다’로 옮겼습니다.
- source_word: אֹהֲבֶיךָ
  english_pob_choice: your loved ones
  chosen_korean: 당신이 사랑하는 이들
  alternatives_korean:
  - 당신의 친구들
  - 당신의 사랑하는 사람들
  lexicon: HALOT
  rationale: 어근 אהב의 기본 의미를 드러내면서도, 관계를 지나치게 좁히는 ‘친구들’은 피했습니다.
- source_word: נִבֵּאתָ לָהֶם בַּשָּׁקֶר
  english_pob_choice: to whom you prophesied falsely
  chosen_korean: 거짓으로 예언한
  alternatives_korean:
  - 거짓말을 예언한
  - 그들에게 거짓으로 예언한
  lexicon: HALOT
  rationale: ‘거짓으로 예언하다’는 한국어 관용을 살려, 예언 행위 자체의 허위를 분명히 했습니다.
theological_decisions:
- issue: 예언의 허위성 표현
  chosen_reading: ‘거짓으로 예언한’으로 번역해, 발화 내용의 허위와 거짓 예언의 책망을 함께 드러냈습니다.
  alternative_readings:
  - ‘거짓말을 예언한’
  - ‘거짓을 말한’
  rationale: 본문은 파스훌의 예언이 야훼의 참된 말씀에 어긋났음을 고발하므로, 단순한 ‘거짓말’보다 ‘예언’의 직무 실패를 드러내는 표현이 적절합니다.
  doctrine_reference: 거짓 예언에 대한 성경의 윤리적·예언자적 책망을 보존합니다.
