  to: 그리고 당신, 바스훌, 그리고 당신 집에 사는 모든 사람은 포로로 끌려갈 것입니다. 당신은 바빌론에 이르게 될 것이며, 거기에서 죽고 거기에서 묻힐 것입니다. 당신과, 당신이 그들에게 거짓으로 예언한 당신의 모든 사랑하는 이들이 거기에서 묻힐 것입니다.[a]
  rationale: 바스훌의 이름을 표준 통용 표기로 수정하고, 원문의 반복된 ‘거기에서’와 마지막의 재진술된 주어를 한국어 문장 안에서 분명히 드러냈습니다. ‘그들에게’와 ‘당신의’를 보충하여 원문의 לָהֶם 및 2인칭 소유 관계를 보존했습니다. 각주는 ‘거짓으로’와 ‘거짓을’의 어휘적 표현 차이만 제시합니다.
