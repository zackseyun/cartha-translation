base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
  footnotes:
  - marker: a
    text: Or, 'to whom you prophesied lies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신, 바스훌, 그리고 당신 집에 사는 모든 사람은 포로로 끌려갈 것입니다. 당신은 바빌론에 이르게 될 것이며, 거기에서 죽고 거기에서 묻힐 것입니다. 당신과, 당신이 그들에게 거짓으로 예언한 당신의 모든 사랑하는 이들이 거기에서 묻힐 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘당신이 그들에게 거짓을 예언한 당신의 모든 사랑하는 이들.’
    reason: lexical_alternative
