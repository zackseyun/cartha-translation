source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַ֣ר יְהוָ֡ה הִנְ/נִי֩ נֹתֶנְ/ךָ֨ לְ/מָג֜וֹר לְ/ךָ֣ וּ/לְ/כָל אֹהֲבֶ֗י/ךָ וְ/נָֽפְל֛וּ בְּ/חֶ֥רֶב אֹיְבֵי/הֶ֖ם וְ/עֵינֶ֣י/ךָ רֹא֑וֹת וְ/אֶת כָּל יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/הִגְלָ֥/ם בָּבֶ֖לָ/ה וְ/הִכָּ֥/ם בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/004.yaml
  text: 'For thus says Yahweh: Behold[a], I am making you a terror to yourself and to all your loved ones, and they will fall by the sword of their enemies while your eyes look on. And I will give all Judah into the hand of the king of Babylon[c][b], and he will carry them away to Babylon and strike them with the sword.'
  footnotes:
  - marker: a
    text: Hebrew magor, 'terror' or 'dread'; this echoes the name given to Pashhur in the surrounding context, often rendered 'Terror on Every Side.'
    reason: cross_reference
  - marker: b
    text: Or 'your friends' for 'your loved ones.' The Hebrew refers to those who love you and may include close companions or allies.
    reason: lexical_alternative
  - marker: c
    text: Or 'he will exile them to Babylon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “보십시오[a], 내가 너를 너 자신과 너를 사랑하는 모든 이들에게 두려움이 되게 하겠다[b]. 그들은 자기 원수들의 칼에 쓰러질 것이며, 네 눈이 그것을 볼 것이다. 내가 온 유다를 바빌론 왕의 손에 넘기겠다. 그가 그들을 바빌론으로 끌고 가서[c] 칼로 칠 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마고르(māgôr)는 ‘두려움’ 또는 ‘공포’를 뜻합니다. 이는 앞 문맥에서 바스훌에게 붙여진 이름, 흔히 ‘사방의 두려움’으로 옮기는 표현과 연결됩니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘너의 친구들’. 히브리어는 너를 사랑하는 사람들을 가리키며, 가까운 동료나 동맹을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들을 바빌론으로 유배시킬 것이다’. 히브리어는 강제로 포로를 이주시켜 유배 보내는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 자리에 해당하는 고유 신명은 POB 원칙에 따라 ‘야훼’로 옮겨, 단순 호칭이 아니라 언약적 신명을 드러냅니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라, 내가
  lexicon: HALOT
  rationale: 예언적 선언의 도입부로서 주의를 끄는 지시어의 힘을 살리되, 현대 한국어 합쇼체에 맞게 자연스럽게 ‘보십시오’로 옮겼습니다.
- source_word: לְמָגוֹר
  english_pob_choice: a terror
  chosen_korean: 두려움이 되게 하겠습니다
  alternatives_korean:
  - 공포가 되게 하겠습니다
  - 전율이 되게 하겠습니다
  - 두려움거리로 삼겠습니다
  lexicon: HALOT
  rationale: 명사 마고르의 의미를 직접 드러내되, 한국어에서 자연스러운 서술로 풀어 ‘두려움이 되게 하겠습니다’라고 옮겼습니다.
- source_word: אֹהֲבֶיךָ
  english_pob_choice: your loved ones
  chosen_korean: 너의 모든 사랑하는 이들
  alternatives_korean:
  - 너의 친구들
  - 너를 사랑하는 이들
  - 너의 가까운 동료들
  lexicon: HALOT
  rationale: 히브리어 분사는 관계적·개인적 애정을 가리킬 수 있으므로, 연애적 뉘앙스를 피하면서도 넓게 포괄하는 ‘사랑하는 이들’을 택했습니다.
- source_word: וְהִגְלָם
  english_pob_choice: he will carry them away to Babylon
  chosen_korean: 그가 그들을 바빌론으로 끌고 가서
  alternatives_korean:
  - 그가 그들을 바빌론으로 유배시킬 것이며
  - 그가 그들을 바빌론으로 끌어갈 것이며
  lexicon: HALOT
  rationale: 가לה의 히필은 포로로 옮겨 가는 뜻이므로, ‘유배시키다’도 가능하지만 본문의 강제 이동 이미지를 살려 ‘끌고 가서’로 처리했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본절은 יְהוָה를 직접 사용하므로, 하나님의 고유한 언약 이름을 제목형 대치어가 아니라 음역으로 보존하는 것이 원문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언적 선언에서의 어조
  chosen_reading: 합쇼체의 선언문체로 유지
  alternative_readings:
  - 평서형으로 완화
  - 문어체 위주의 직역
  rationale: ‘야훼께서 이렇게 말씀하십니다’와 ‘보십시오’는 예언 선포의 엄중함을 살리면서도 현대 한국어 독자가 읽기 쉬운 공식적 어조를 유지합니다.
  doctrine_reference: POB Korean style guidance
