  to: 야훼께서 이렇게 말씀하십니다. “보십시오[a], 내가 너를 너 자신과 너를 사랑하는 모든 이들에게 두려움이 되게 하겠다[b]. 그들은 자기 원수들의 칼에 쓰러질 것이며, 네 눈이 그것을 볼 것이다. 내가 온 유다를 바빌론 왕의 손에 넘기겠다. 그가 그들을 바빌론으로 끌고 가서[c] 칼로 칠 것이다.”
  rationale: 첫 접속사를 한국어에서 생략하여 원문의 설명적 선언을 무리 없이 반영했고, אֹהֲבֶיךָ의 관계를 명료하게 했습니다. 각주 내용과 표지를 해당 본문 위치에 맞추어 재배치했으며, 유배 관련 대안은 וְהִגְלָם에 직접 연결했습니다. 그 밖의 문장 구조와 ‘칼로 칠 것이다’는 원문의 반복된 전쟁 폭력 표현을 그대로 보존합니다.
