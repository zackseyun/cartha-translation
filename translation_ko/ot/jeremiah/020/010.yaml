id: JER.20.10
reference: Jeremiah 20:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֜עְתִּי דִּבַּ֣ת רַבִּים֮ מָג֣וֹר מִ/סָּבִיב֒ הַגִּ֨ידוּ֙ וְ/נַגִּידֶ֔/נּוּ כֹּ֚ל אֱנ֣וֹשׁ שְׁלוֹמִ֔/י שֹׁמְרֵ֖י צַלְעִ֑/י אוּלַ֤י יְפֻתֶּה֙ וְ/נ֣וּכְלָה ל֔/וֹ וְ/נִקְחָ֥ה נִקְמָתֵ֖/נוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/010.yaml
  text: 'For I have heard the whispering of many: “Terror on every side!” “Report[a], and let us report it!” All the men at peace with me are watching for my stumbling: “Perhaps he will be deceived, and we will prevail against him[b], and we will take our vengeance on him.”'
  footnotes:
  - marker: a
    text: Or “Denounce him, and we will denounce him.” The Hebrew verb means “tell, report, declare,” but in this hostile context it can carry the sense of denunciation.
    reason: lexical_alternative
  - marker: b
    text: Literally “watching my limp” or “watching my side.” The expression likely means watching for a weakness, misstep, or downfall.
    reason: lexical_alternative
translation:
  language: ko
  text: 저는 많은 이들의 수군거림을 들었습니다. “사방에 공포가 있다!” “보고하라[a]! 우리가 그것을 보고하겠다!” 저와 평화롭게 지내던 모든 사람이 제가 비틀거릴 틈[b]을 엿보며 말합니다. “어쩌면 그가 속을지 모른다. 그러면 우리가 그를 이기고 그에게 복수하자.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 기본적으로 ‘말하다, 보고하다, 알리다’를 뜻하지만, 이 적대적인 문맥에서는 ‘고발하다’ 또는 ‘밀고하다’라는 뉘앙스를 띨 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나의 절뚝거림’ 또는 ‘나의 옆’을 살핀다는 뜻입니다. 여기서는 약점, 실수, 또는 넘어질 틈을 노린다는 표현으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת רַבִּים
  english_pob_choice: the whispering of many
  chosen_korean: 많은 사람의 수군거림
  alternatives_korean:
  - 많은 사람의 험담
  - 많은 사람의 중상
  - 많은 사람의 소문
  lexicon: HALOT
  rationale: דִּבָּה는 단순한 ‘보고’보다 은밀하고 해로운 말의 뉘앙스를 가지므로, 공개적 고발보다 ‘수군거림’이 문맥의 음습한 분위기를 잘 살립니다.
- source_word: מָגוֹר מִסָּבִיב
  english_pob_choice: Terror on every side
  chosen_korean: 사방에서 공포다
  alternatives_korean:
  - 사방에 공포가 있다
  - 둘레마다 공포다
  - 온 사방에 공포다
  lexicon: HALOT
  rationale: 예레미야서의 반복적 표어를 살리기 위해 짧고 절박한 외침 형태로 옮겼습니다.
- source_word: הַגִּידוּ וְנַגִּידֶנּוּ
  english_pob_choice: Report, and let us report it
  chosen_korean: 보고하라, 그러면 우리가 그것을 보고하겠다
  alternatives_korean:
  - 신고하라, 그러면 우리가 신고하겠다
  - 알리라, 그러면 우리가 알리겠다
  - 고발하라, 그러면 우리가 고발하겠다
  lexicon: HALOT
  rationale: נגד는 기본적으로 ‘말하다/알리다/보고하다’이므로, 첫 동사에 목적어를 덧붙이지 않고 두 번째 절의 대명사적 목적어를 ‘그것’으로 받게 하여 히브리어의 구조를 반영했습니다.
- source_word: כֹּל אֱנוֹשׁ שְׁלוֹמִי
  english_pob_choice: All the men at peace with me
  chosen_korean: 저와 평화로운 관계에 있던 모든 사람
  alternatives_korean:
  - 제 친구들
  - 저와 화목하던 모든 사람
  - 저와 친하던 모든 남자
  lexicon: HALOT
  rationale: 직역의 ‘저의 평화의 사람’은 한국어에서 부자연스러우므로, 적대감 이전의 우호적 관계를 드러내는 관용적 표현으로 옮겼습니다.
- source_word: שֹׁמְרֵי צַלְעִי
  english_pob_choice: watching for my stumbling
  chosen_korean: 제 걸음걸이를 지켜보며
  alternatives_korean:
  - 제 절뚝거림을 살피며
  - 제 옆구리를 노리며
  - 넘어질 틈을 엿보며
  lexicon: HALOT
  rationale: צַלְעִי는 문자적으로 ‘옆/절뚝거림’의 이미지를 띠므로, 약점을 노리는 감시라는 뜻을 자연스럽게 살리되 본문 주석에서 더 직역적인 가능성을 열어 두었습니다.
- source_word: יְפֻתֶּה
  english_pob_choice: he will be deceived
  chosen_korean: 그가 속을지 모른다
  alternatives_korean:
  - 그가 유혹될지 모른다
  - 그가 미혹될지 모른다
  - 그가 설득될지 모른다
  lexicon: HALOT
  rationale: 문맥상 협잡으로 함정에 빠뜨리려는 의도이므로 ‘속다’가 가장 자연스럽고 직접적입니다.
- source_word: וְנּוּכְלָה לוֹ
  english_pob_choice: and we will prevail against him
  chosen_korean: 우리가 그를 이길 수 있고
  alternatives_korean:
  - 우리가 그를 제압할 수 있고
  - 우리가 그를 이길 것이고
  - 우리가 그를 당해낼 수 있고
  lexicon: HALOT
  rationale: יכל은 ‘능하다/이기다/우세하다’의 뜻을 가지며, 한국어에서는 결과 가능성을 드러내는 ‘이길 수 있고’가 문맥상 가장 자연스럽습니다.
- source_word: וְנִקְחָה נִקְמָתֵנוּ מִמֶּנּוּ
  english_pob_choice: and we will take our vengeance on him
  chosen_korean: 그에게서 우리의 복수를 할 수 있다
  alternatives_korean:
  - 그에게서 우리의 원수를 갚겠다
  - 그에게 복수를 하겠다
  - 그에게서 우리의 보복을 취하겠다
  lexicon: HALOT
  rationale: 히브리어의 ‘~에게서 복수를 취하다’라는 관용을 살리되, 한국어에서는 ‘~에게서’와 ‘복수’를 함께 써서 출처-대상 구조를 드러냈습니다.
theological_decisions:
- issue: 예레미야의 인용문 안에서 적대자들의 직접 발화와 분위기 유지
  chosen_reading: 적대자들의 세 구절짜리 발화를 따옴표로 구분해 긴박한 집단 음모의 분위기를 살렸습니다.
  alternative_readings:
  - 서술문으로 풀어 쓰기
  - 한 문장으로 합쳐 번역하기
  rationale: 본문은 여러 사람의 속삭임과 반복 구호, 그리고 음모적 독백이 연쇄되므로 발화 구분을 유지해야 독자의 이해가 보존됩니다.
  doctrine_reference: 본문 의미 보존과 담화 구조 반영
- issue: ‘복수’와 ‘원수 갚기’의 강한 보복 의미
  chosen_reading: ‘복수’를 완화하지 않고 유지했습니다.
  alternative_readings:
  - 보복
  - 원한을 갚음
  - 되갚음
  rationale: 예레미야를 겨냥한 적대의 강도를 약화시키지 않기 위해, 문맥이 허용하는 강한 보복어를 선택했습니다.
  doctrine_reference: 문맥적 어휘의 강도 보존
