source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֗ישׁ אֲשֶׁ֨ר בִּשַּׂ֤ר אֶת אָבִ/י֙ לֵ/אמֹ֔ר יֻֽלַּד לְ/ךָ֖ בֵּ֣ן זָכָ֑ר שַׂמֵּ֖חַ שִׂמֳּחָֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/015.yaml
  text: Cursed be the man who brought my father the news[a], saying[b], “A son has been born to you,” making him very glad.
  footnotes:
  - marker: a
    text: Literally, “a son, a male.”
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew expression “making him glad with gladness” uses an infinitive absolute with a cognate verb to intensify the sense: “making him very glad” or “gladdening him greatly.”'
    reason: lexical_alternative
translation:
  language: ko
  text: “내 아버지에게 ‘아들, 남자아이가 태어났습니다’라고 소식을 전해 그를 크게 기쁘게 만든 그 사람은 저주를 받습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “아들, 남자아이”입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 같은 어근을 겹쳐 써서 “그를 매우/크게 기쁘게 하다”는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed be
  chosen_korean: 저주를 받습니다
  alternatives_korean:
  - 저주를 받으십시오
  - 저주받습니다
  lexicon: WLC/HALOT
  rationale: 예레미야의 저주 선언을 현대 한국어로 직접 살리되, 합쇼체 문맥에 맞게 선언형으로 옮겼습니다.
- source_word: בִּשַּׂר
  english_pob_choice: brought ... the news
  chosen_korean: 소식을 전해
  alternatives_korean:
  - 소식을 알리고
  - 기쁜 소식을 전해
  lexicon: WLC/HALOT
  rationale: 이 동사는 단순히 '알리다'보다 '소식을 전하다'가 자연스럽고, 여기서는 탄생 소식을 가리키므로 일반적 의미를 유지했습니다.
- source_word: בֵּן זָכָר
  english_pob_choice: a son
  chosen_korean: 아들, 남자아이가
  alternatives_korean:
  - 아들
  - 남자아이
  lexicon: WLC/HALOT
  rationale: 히브리어의 직역상 '아들, 남자아이'라는 이중 표현이므로 둘 다 살렸습니다. 본문에는 '아들'을, 각주는 '남자아이'의 문자적 뉘앙스를 보완합니다.
- source_word: שַׂמֵּחַ שִׂמֳּחָהוּ
  english_pob_choice: making him very glad
  chosen_korean: 그를 크게 기쁘게 만든
  alternatives_korean:
  - 그를 매우 기쁘게 한
  - 그에게 큰 기쁨을 준
  lexicon: WLC/HALOT
  rationale: 동일 어근의 강조 표현을 한국어의 '크게 기쁘게'로 옮겨 강도를 보존했습니다.
theological_decisions:
- issue: 저주 선언의 문체
  chosen_reading: 직설적인 저주 선언으로 옮기고, 완곡하게 누그러뜨리지 않았습니다.
  alternative_readings:
  - 그 사람은 저주받을 것입니다
  - 그 사람은 저주를 받을 만합니다
  rationale: 본문은 예레미야의 강한 저주를 전달하므로, 의미 강도를 약화시키지 않는 선언형을 택했습니다.
  doctrine_reference: 예레미야 20:15의 예언자적 탄식과 저주 어조
