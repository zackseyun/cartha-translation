  text: וַ/יַּכֶּ֣ה פַשְׁח֔וּר אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יִּתֵּ֨ן אֹת֜/וֹ עַל הַ/מַּהְפֶּ֗כֶת אֲשֶׁ֨ר בְּ/שַׁ֤עַר בִּנְיָמִן֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/002.yaml
  text: Then Pashhur struck Jeremiah the prophet and put him in the stocks that were at the upper Benjamin Gate[a], which was in the house of Yahweh.
  footnotes:
  - marker: a
    text: Or possibly 'the rack' or another device of painful restraint; the exact form of the מַהְפֶּכֶת is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 파스훌이 예언자 예레미야를 때리고, 그를 베냐민 상문에 있는 차꼬에 가두었는데, 그곳은 야훼의 집 안에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘차꼬’는 본문의 מַהְפֶּכֶת을 대표하는 전통적 대응이지만, 정확한 기구 형태는 확정되지 않습니다. ‘형틀’이나 ‘구속 장치’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  english_pob_choice: struck
  chosen_korean: 때리고
  alternatives_korean:
  - 쳤고
  - 내리쳤고
  - 때렸고
  lexicon: HALOT
  rationale: נכה는 ‘치다/때리다’의 기본 의미를 가지므로, 한 번의 타격인지 구타인지 열어 두는 POB의 ‘struck’를 따라 자연스럽게 옮겼습니다.
- source_word: הַמַּהְפֶּכֶת
  english_pob_choice: the stocks
  chosen_korean: 차꼬
  alternatives_korean:
  - 족쇄
  - 형틀
  - 철제 구속틀
  lexicon: HALOT
  rationale: מַהְפֶּכֶת은 고통스러운 신체 구속 장치로, 한국어 성경에서 널리 이해되는 ‘차꼬’가 가장 간결하면서도 구속의 뉘앙스를 살립니다. 다만 정확한 기구는 불확실합니다.
- source_word: שַׁעַר בִּנְיָמִן הָעֶלְיוֹן
  english_pob_choice: the upper Benjamin Gate
  chosen_korean: 베냐민 상문
  alternatives_korean:
  - 베냐민 상문문
  - 상부 베냐민 문
  - 베냐민 윗문
  lexicon: HALOT
  rationale: 지명은 한국어 성경 문체에 맞춰 ‘문’으로 옮기되, ‘상문’으로 ‘upper’를 간결하게 반영했습니다. 고유 지명의 관용을 해치지 않으면서 위치 정보를 보존합니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집 안에
  alternatives_korean:
  - 야훼의 집에
  - 야훼 성전 안에
  lexicon: HALOT
  rationale: בַּיִת + יְהוָה는 직역상 ‘야훼의 집’이며, POB의 야훼 표기를 따라 하나님의 이름을 제목어로 보존했습니다. ‘성전’은 해석을 더하므로 기본 표현을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, POB 원칙에 따라 하나님의 고유명사인 ‘야훼’를 유지했습니다. 이는 호칭으로 바꾸어 이름성을 흐리는 것을 피합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → Yahweh'
- issue: 예언자 직함의 보존
  chosen_reading: 예언자 예레미야
  alternative_readings:
  - 선지자 예레미야
  - 예레미야
  rationale: הַנָּבִיא는 단순한 수식이 아니라 예레미야의 공적 정체성을 드러내므로, 직함을 분명히 살렸습니다. 한국어 교회어 ‘선지자’보다 본문 중립성을 살리는 ‘예언자’를 택했습니다.
  doctrine_reference: Source-text transparency and role designation
