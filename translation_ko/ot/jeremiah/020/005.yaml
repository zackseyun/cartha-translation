id: JER.20.5
reference: Jeremiah 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת כָּל חֹ֨סֶן֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת כָּל יְגִיעָ֖/הּ וְ/אֶת כָּל יְקָרָ֑/הּ וְ/אֵ֨ת כָּל אוֹצְר֜וֹת מַלְכֵ֣י יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְזָזוּ/ם֙ וּ/לְקָח֔וּ/ם וֶ/הֱבִיא֖וּ/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/005.yaml
  text: And I will give all the wealth of this city[a], all its gains, all its precious things, and all the treasures of the kings of Judah into the hand of their enemies. They will plunder them, take them[c][b], and bring them to Babylon.
  footnotes:
  - marker: a
    text: Or 'all its labor' or 'all its produce' for 'all its gains.' The Hebrew term can refer either to labor itself or to what that labor yields.
    reason: lexical_alternative
  - marker: b
    text: Or 'all its valuables' for 'all its precious things.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'into the hand of,' an idiom meaning into the control or power of.
    reason: cultural_note
translation:
  language: ko
  text: 내가 이 성의 모든 재물과 모든 소득과 모든 귀중품과 유다 왕들의 모든 보물을 그들의 원수들의 손에[a] 넘겨주겠습니다. 그들은 그것들을 약탈하고 빼앗아 바빌론으로 가져갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘손에’는 여기서 ‘지배 아래’ 또는 ‘처분에 맡겨’라는 뜻의 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֹסֶן
  english_pob_choice: wealth
  chosen_korean: 재산
  alternatives_korean:
  - 부
  - 부유함
  - 재물
  lexicon: HALOT
  rationale: 이 문맥은 빼앗기고 약탈되는 물품 목록이므로 추상적 '힘'보다 물질적 소유를 가리키는 '재산'이 자연스럽습니다.
- source_word: יְגִיעָהּ
  english_pob_choice: its gains
  chosen_korean: 생산물
  alternatives_korean:
  - 노동
  - 수확물
  - 산출물
  lexicon: HALOT
  rationale: 이 단어는 노동 자체보다 그 결과물을 가리킬 수 있으므로, 성의 축적된 산출을 드러내는 '생산물'로 옮겼습니다.
- source_word: יְקָרָהּ
  english_pob_choice: its precious things
  chosen_korean: 귀한 것들
  alternatives_korean:
  - 귀중품
  - 보물
  - 소중한 것들
  lexicon: HALOT
  rationale: 목록상 약탈 가능한 가치 있는 물품을 가리키므로, 가치의 뉘앙스를 살리면서도 과도하게 특정하지 않는 표현을 택했습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에 넘겨주겠습니다
  alternatives_korean:
  - 권세 아래 넘겨주겠습니다
  - 통제 아래 두겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 가장 자연스럽게 드러내면서도, 단순한 신체 부위가 아니라 지배와 소유의 이동을 보이게 했습니다.
theological_decisions:
- issue: 내화된 예언적 1인칭 발화의 시제와 어조
  chosen_reading: 야훼의 선언을 미래형 공손체로 옮겨, 예언적 확실성과 직접성을 함께 드러냈습니다.
  alternative_readings:
  - 직설형 현재로 옮김
  - 더 서술적인 미래 완료형으로 옮김
  rationale: 본문은 야훼의 직접 발화로서 확정된 심판 선언이므로, 한국어에서는 공적 선언의 힘을 유지하는 미래형이 적절합니다.
  doctrine_reference: 예언적 확실성
