  source_fidelity: 대체로 원문의 물질적 재산 목록과 적들에게 넘겨져 약탈되고 바빌론으로 옮겨지는 순서를 충실히 반영합니다. 그러나 יְגִיעָהּ의 의미는 단순한 제조·농업 ‘생산물’보다 노동의 소득·결실을 포괄하므로 ‘소득’이 더 적절합니다. 또한 בְּיַד은 ‘그들의 원수들의 손에’라는 복수 소유 표현에 연결되어야 합니다.
  naturalness: 합쇼체 선언문은 자연스럽습니다. 다만 ‘모든 재산과, 모든 생산물과’의 쉼표는 불필요하며, ‘귀한 것들’보다 이 문맥에서는 ‘귀중품’이 더 간결하고 자연스럽습니다. ‘바빌론으로 가져갈 것입니다’는 물품을 옮기는 문맥에 자연스럽습니다.
  terminology: ‘재물’, ‘소득’, ‘귀중품’, ‘보물’은 서로 구별되는 원문의 열거를 한국어에서 자연스럽게 보존합니다. ‘원수들의 손에 넘겨주다’는 히브리어 관용구의 지배·처분권 의미를 적절히 전달합니다.
  issues:
  - severity: medium
    issue: 각주 표지가 문장 끝에 놓여 있고 각주 인용문이 ‘그 손에’라고 단수로 되어 있습니다.
    rationale: 각주는 첫 문장의 בְּיַד אֹיְבֵיהֶם(‘그들의 원수들의 손에’)에 붙어야 합니다. 현재 위치는 바빌론으로 끌고 가는 행위에 관용구가 걸리는 것처럼 보이며, ‘그 손에’는 원문의 복수 표현도 정확히 반영하지 못합니다.
  - severity: low
    issue: ‘생산물’은 יְגִיעָהּ의 뜻을 다소 좁힙니다.
    rationale: 이 명사는 노동 자체 또는 노동으로 얻은 것/소득을 뜻할 수 있습니다. 약탈되는 자산 문맥에서는 ‘소득’이 축적된 노동의 결실을 포괄하면서 특정 생산 유형으로 한정하지 않습니다.
