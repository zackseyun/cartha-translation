id: JER.20.12
reference: Jeremiah 20:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ בֹּחֵ֣ן צַדִּ֔יק רֹאֶ֥ה כְלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/012.yaml
  text: But you[a], O Yahweh of Armies, who test the righteous, who see the kidneys and the heart, let me see your vengeance on them[b], for to you I have revealed my case.
  footnotes:
  - marker: a
    text: Hebrew 'the kidneys and the heart,' a figure for the deepest thoughts, motives, and affections.
    reason: cultural_note
  - marker: b
    text: Or 'my cause' or 'my dispute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주여, 만군의 하나님, 의인을 시험하시고 콩팥과 마음을 살피시는 분이시여, 제가 그들에게서 주의 복수를 보게 하십시오. 이는 제가 제 사정을 주께 아뢰었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘콩팥과 마음’은 가장 깊은 생각과 동기, 애정을 가리키는 비유입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘제 소송’ 혹은 ‘제 분쟁’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  english_pob_choice: O Yahweh of Armies
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 만군의 야훼
  - 만군의 주님
  - 군대들의 하나님
  lexicon: HALOT
  rationale: מן군의 의미를 살리되 한국어 기도문으로 자연스럽고 존칭에 맞게 ‘하나님’을 붙여 vocative를 표현했습니다.
- source_word: בֹּחֵן צַדִּיק
  english_pob_choice: who test the righteous
  chosen_korean: 의인을 시험하시고
  alternatives_korean:
  - 의인을 살피시고
  - 의인을 검증하시고
  - 의인을 살펴보시고
  lexicon: HALOT
  rationale: בֹּחֵן의 지속적 심사/시험 의미를 ‘시험하시고’로 옮겨 하나님이 의인을 판별하시는 분이라는 힘을 유지했습니다.
- source_word: כְלָיוֹת וָלֵב
  english_pob_choice: the kidneys and the heart
  chosen_korean: 콩팥과 마음
  alternatives_korean:
  - 내장과 마음
  - 속과 마음
  - 콩팥과 심장
  lexicon: HALOT
  rationale: 히브리어의 신체 은유를 너무 추상화하지 않기 위해 ‘콩팥’을 유지하되, 현대 한국어 독자가 이해할 수 있도록 ‘마음’과 짝지었습니다.
- source_word: רִיבִי
  english_pob_choice: my case
  chosen_korean: 제 사정
  alternatives_korean:
  - 제 소송
  - 제 분쟁
  - 제 호소
  lexicon: HALOT
  rationale: רִיב의 법정적·탄원적 뉘앙스를 살리면서도 시편적/예레미야적 기도 문맥에 어울리는 ‘사정’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה의 호칭을 한국어로 어떻게 보일지
  chosen_reading: ‘주여, 만군의 하나님’으로 옮기고 본문에는 ‘야훼’ 대신 기도 호칭을 사용했습니다.
  alternative_readings:
  - 만군의 야훼
  - 만군의 주님
  - 여호와
  rationale: 본 절은 직접 호소하는 기도문이므로, 한국어 공용 번역 관습과 문맥의 호칭성을 함께 살려 ‘주여’와 ‘만군의 하나님’을 조합했습니다. 다만 본 프로젝트 기본 용례인 야훼를 본문에 직접 쓰지 않는 선택은 호칭의 유창성을 위한 것입니다.
  doctrine_reference: 'DOCTRINE.md translation practice: vocative prayer register and established Korean divine address'
