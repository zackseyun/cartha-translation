review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. יְהוָה는 제공된 POB 방침과 영어 감사 기록에 따라 ‘야훼’로 옮겨야 하며, רִיבִי의 법정적·논쟁적 의미는 ‘사정’보다 ‘송사’가 더 충실합니다. נִקְמָתְךָ מֵהֶם은 하나님께서 그들에게 행하시는 보복을 보기를 청하는 말로 자연스럽게 명시할 수 있습니다.
  naturalness: 현대 표준 한국어 합쇼체 기도 문체로 ‘만군의 야훼시여’와 ‘보게 해 주십시오’를 사용하면 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 배치해야 독자가 가리키는 대상을 분명히 알 수 있습니다.
  terminology: ‘만군의 야훼’는 צְבָאוֹת와 יהוה를 각각 보존합니다. ‘의인’, ‘콩팥과 마음’, ‘송사’는 원문의 핵심 어휘와 법정적·신체적 은유를 적절히 유지합니다.
  issues:
  - severity: medium
    issue: 하나님의 이름을 ‘주여, 만군의 하나님’으로 바꾸었습니다.
    rationale: 원문은 יהוה צבאות이며, 제공된 영어 POB 신학 결정은 יהוה를 ‘Yahweh’로 표기하도록 명시합니다. ‘하나님’은 원문에 없는 일반 명칭을 추가하고 고유 이름을 대체합니다.
  - severity: medium
    issue: רִיבִי를 ‘제 사정’으로 옮겼습니다.
    rationale: רִיב은 사정 일반보다 송사·소송·분쟁의 법정적 또는 논쟁적 의미가 강합니다. ‘제 송사’가 문맥과 원어 의미를 더 잘 보존합니다.
  - severity: low
    issue: 각주 표지 [a]와 [b]가 문장 끝에 함께 놓여 있습니다.
    rationale: '[a]는 ‘콩팥과 마음’을, [b]는 ‘송사’를 설명하므로 각각 해당 표현 바로 뒤에 놓아야 앵커가 명확합니다.'
  revised_text: 그러나 만군의 야훼시여, 의인을 시험하시고 콩팥과 마음을 살피시는 분이시여, 제가 그들에게 내리시는 주의 보복을 보게 해 주십시오. 제가 주께 제 송사[b]를 아뢰었기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 히브리어 ‘콩팥과 마음’[a]은 가장 깊은 생각과 동기와 감정을 가리키는 비유입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘제 사정’ 또는 ‘제 분쟁’입니다.
    reason: lexical_alternative
  revision_rationale: '본문의 ‘콩팥과 마음’ 뒤에 [a]를 직접 배치한 완전한 본문은 다음과 같습니다: “그러나 만군의 야훼시여, 의인을 시험하시고 콩팥과 마음[a]을 살피시는 분이시여, 제가 그들에게 내리시는 주의 보복을 보게 해 주십시오. 제가 주께 제 송사[b]를 아뢰었기 때문입니다.” 이 개정은 יהוה를 ‘야훼’로 보존하고, צבאות의 ‘만군’, ריב의 법정적 의미, 그리고 원문의 청원 어조를 유지합니다.'
