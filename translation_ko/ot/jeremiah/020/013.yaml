id: JER.20.13
reference: Jeremiah 20:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁ֚ירוּ לַֽ/יהוָ֔ה הַֽלְל֖וּ אֶת יְהוָ֑ה כִּ֥י הִצִּ֛יל אֶת נֶ֥פֶשׁ אֶבְי֖וֹן מִ/יַּ֥ד מְרֵעִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/013.yaml
  text: Sing to Yahweh[a]; praise Yahweh[c][b], for he has delivered the life of the poor from the hand of evildoers.
  footnotes:
  - marker: a
    text: Hebrew 'the soul of the poor'; here 'life' conveys the sense of the person's life or self in danger.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the power of evildoers' for the idiom 'from the hand of evildoers.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께 노래하십시오[a]; 야훼를 찬양하십시오[b][c], 이는 그분이 가난한 사람의 생명을 악인들의 손에서 건져내셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼께’; 원문은 여호와의 이름을 직접 사용합니다.
    reason: ot_citation
  - marker: b
    text: 히브리어는 ‘찬양하십시오’에 해당하는 예배적 명령을 사용합니다.
    reason: source_note
  - marker: c
    text: 이 구절의 두 번째 반복도 히브리어 יְהוָה입니다.
    reason: ot_citation
lexical_decisions:
- source_word: שִׁירוּ
  english_pob_choice: Sing
  chosen_korean: 노래하십시오
  alternatives_korean:
  - 노래하라
  - 찬양하십시오
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘노래하다’를 살려 첫 명령을 자연스러운 합쇼체로 옮겼습니다. 뒤의 ‘찬양하십시오’와 의미가 겹치지 않도록 분리했습니다.
- source_word: לַיהוָה / אֶת יְהוָה
  english_pob_choice: Yahweh / the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문에 יְהוָה가 직접 나오므로 프로젝트 기본값에 따라 고유명사로 ‘야훼’를 사용했습니다. 두 번 반복되는 이름도 같은 방식으로 일관되게 옮겼습니다.
- source_word: הַלְלוּ
  english_pob_choice: praise
  chosen_korean: 찬양하십시오
  alternatives_korean:
  - 찬송하십시오
  - 높이십시오
  lexicon: HALOT
  rationale: 예배적 맥락의 Piel 명령형으로, 한국어에서는 ‘찬양하다’가 가장 직접적이고 자연스럽습니다. 첫 명령 ‘노래하십시오’와 함께 반복되는 예배 촉구를 살렸습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: the life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 혼
  lexicon: HALOT
  rationale: 구출의 문맥에서 נֶפֶשׁ은 추상적 ‘혼’보다 위협받는 사람의 삶/생명으로 읽는 것이 자연스럽습니다. 따라서 ‘생명’으로 옮겨 의미를 분명히 했습니다.
- source_word: מִיַּד מְרֵעִים
  english_pob_choice: from the hand of evildoers
  chosen_korean: 악인들의 손에서
  alternatives_korean:
  - 악인들의 권세에서
  - 악을 행하는 자들의 손에서
  lexicon: HALOT
  rationale: ‘손’은 권세/통제의 관용 표현이지만, 원문 이미지를 보존하기 위해 기본적으로 ‘손에서’를 유지했습니다. 필요 시 의미를 풀 수 있으나, 본문에는 비유를 그대로 남겼습니다.
theological_decisions:
- issue: יהוה의 번역 방식
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 절은 하나님의 언약 이름을 두 번 반복하므로, 일반 호칭보다 고유명사성이 드러나는 번역이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הִצִּיל의 완료 시제 뉘앙스
  chosen_reading: ‘건져내셨기 때문입니다’로 완료된 구원을 나타냈습니다.
  alternative_readings:
  - ‘구해 주셨기 때문입니다’
  - ‘구원하셨기 때문입니다’
  rationale: 시편적 선포 형식의 완결된 구원 행위를 현재와 연결된 과거완료 감각으로 살렸습니다. 동시에 예언적 찬양의 이유 절이라는 기능도 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
