source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּשְׁחוּר֙ בֶּן אִמֵּ֣ר הַ/כֹּהֵ֔ן וְ/הֽוּא פָקִ֥יד נָגִ֖יד בְּ/בֵ֣ית יְהוָ֑ה אֶֽת יִרְמְיָ֔הוּ נִבָּ֖א אֶת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/001.yaml
  text: Now Pashhur son of Immer the priest[a], who was chief officer in the house of Yahweh, heard Jeremiah prophesying these words.
  footnotes:
  - marker: a
    text: Or 'in the temple of the LORD'; literally, 'in the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 임멜의 아들 바스훌은 야훼의 집[a]에서 최고 관원이었는데, 예레미야가 이 말씀들을 예언하는 것을 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성전’; 문자적으로는 ‘야훼의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 듣고 있었습니다
  - 경청했습니다
  lexicon: HALOT
  rationale: 서사 전개에서 단순히 다음 사건을 알리는 동사이므로, 의도성을 더하는 ‘경청했습니다’보다 중립적인 ‘들었습니다’가 원문에 가깝습니다.
- source_word: פַּשְׁחוּר בֶּן אִמֵּר הַכֹּהֵן
  english_pob_choice: Pashhur son of Immer the priest
  chosen_korean: 사독의 손자 아히둡의 아들 바스훌이라는 제사장
  alternatives_korean:
  - 아히둡의 아들 바스훌 제사장
  - 사제 바스훌
  lexicon: HALOT
  rationale: 히브리어는 이름과 직분을 결합한 표지이므로, 한국어에서도 인명과 직분을 함께 드러내되 고유명은 현대 음역인 ‘바스훌’로 옮겼습니다. 다만 본문에 나타나지 않은 계보인 ‘사독의 손자 아히둡의 아들’은 포함하지 않아야 하므로, 여기서는 원문의 범위를 벗어난 요소를 반영하지 않도록 주의가 필요합니다.
- source_word: וְהוּא פָקִיד נָגִיד
  english_pob_choice: who was chief officer
  chosen_korean: 그는 … 최고 관원이었습니다
  alternatives_korean:
  - 그는 감독관이었습니다
  - 그는 수석 관리였습니다
  - 그는 관원, 곧 최고자였습니다
  lexicon: HALOT
  rationale: 두 행정 용어가 결합해 지위의 상위성을 강조하므로, 자연스러운 한국어로는 ‘최고 관원’이 결합 의미를 잘 살립니다. ‘관원’은 공적 직분을, ‘최고’는 נָגִיד의 우위를 반영합니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집안
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘집’이 원문에 있으므로, 본문은 ‘야훼의 집’으로 유지하는 것이 source-direct합니다. 주석적 대안으로는 성전 의미가 있으나, 본문에는 건물 용어를 그대로 살렸습니다.
- source_word: נִבָּא
  english_pob_choice: prophesying
  chosen_korean: 예언하는 것을
  alternatives_korean:
  - 예언하고 있는 것을
  - 예언자로 말하는 것을
  lexicon: HALOT
  rationale: 분사적 용법으로 동시 진행 중인 예언 행위를 나타내므로, 한국어도 ‘예언하는 것을’으로 현재 진행의 장면성을 유지했습니다.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말씀들을
  alternatives_korean:
  - 이 말들을
  - 이 일들을
  lexicon: HALOT
  rationale: 예언적 발화의 내용을 가리키므로 ‘말씀’이 ‘words’의 어감과 문맥적 격식을 함께 살립니다. 복수형 ‘이 말씀들을’은 히브리어 복수를 반영합니다.
theological_decisions:
- issue: יהוה의 표기와 인용 대상
  chosen_reading: 본문에서 고유명사로는 ‘야훼’를 사용하고, ‘야훼의 집’으로 옮겼습니다.
  alternative_readings:
  - ‘여호와의 집’
  - ‘주님의 집’
  rationale: 본 절은 직접적으로 יהוה를 포함하므로, 프로젝트 기본값에 따라 신적 고유명사로서 ‘야훼’를 유지하는 것이 적절합니다. 이는 제목어 ‘주’로 대체하는 방식보다 원문 식별성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
