source:
  edition: WLC
  text: וְ/הָיָה֙ הָ/אִ֣ישׁ הַ/ה֔וּא כֶּֽ/עָרִ֛ים אֲשֶׁר הָפַ֥ךְ יְהוָ֖ה וְ/לֹ֣א נִחָ֑ם וְ/שָׁמַ֤ע זְעָקָה֙ בַּ/בֹּ֔קֶר וּ/תְרוּעָ֖ה בְּ/עֵ֥ת צָהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/016.yaml
  text: Let that man be like the cities that Yahweh overthrew without relenting[b][a], and let him hear a cry in the morning and a battle shout at the time of noon.
  footnotes:
  - marker: a
    text: Or 'an alarm' or 'a trumpet blast' for 'battle shout' (Hebrew teru'ah).
    reason: lexical_alternative
  - marker: b
    text: The wording likely echoes the cities the LORD overthrew in judgment, such as Sodom and Gomorrah.
    reason: cross_reference
translation:
  language: ko
  text: 그 사람이 야훼께서 뒤엎으시고 그 심판을 돌이키지 않으신 그 도시들처럼 되며, 아침에는 부르짖는 소리를, 정오 때에는 전쟁 함성을 듣게 되기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전쟁 함성’으로 옮긴 말은 경보나 나팔 신호를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 심판으로 뒤엎어진 도시들, 곧 소돔과 고모라를 암시하는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה / הָאִישׁ הַהוּא
  english_pob_choice: Let that man be
  chosen_korean: 그 사람은 … 되기를 바랍니다
  alternatives_korean:
  - 그 사람은 …일 것입니다
  - 그 사람은 …이 되게 하십시오
  lexicon: HALOT
  rationale: 저주/기원 문맥의 바람을 한국어에서는 ‘되기를 바랍니다’로 자연스럽게 옮겨, 단순 미래 서술보다 소망·저주의 뉘앙스를 살렸습니다.
- source_word: כֶּעָרִים אֲשֶׁר הָפַךְ יְהוָה
  english_pob_choice: like the cities that Yahweh overthrew
  chosen_korean: 야훼께서 뒤엎으신 그 도시들 같
  alternatives_korean:
  - 여호와께서 멸하신 그 도시들 같
  - 야훼께서 무너뜨리신 그 도시들 같
  lexicon: HALOT
  rationale: הפך는 심판 문맥에서 ‘뒤엎다/전복하다’의 강한 파괴성을 가지므로, 일반적인 ‘멸하다’보다 직접적인 ‘뒤엎으시다’를 택했습니다. YHWH는 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: וְלֹא נִחָם
  english_pob_choice: without relenting
  chosen_korean: 돌이키지 않으신
  alternatives_korean:
  - 뜻을 거두지 않으신
  - 후회하지 않으신
  lexicon: HALOT
  rationale: נחם은 여기서 하나님이 심판을 철회하지 않으셨다는 뜻이므로, 신학적으로 오해될 수 있는 ‘후회하다’보다 ‘돌이키다/철회하다’로 옮겼습니다.
- source_word: וְשָׁמַע זְעָקָה בַּבֹּקֶר
  english_pob_choice: and let him hear a cry in the morning
  chosen_korean: 아침에는 부르짖는 소리를
  alternatives_korean:
  - 아침에 외침을
  - 아침에는 울부짖는 소리를
  lexicon: HALOT
  rationale: זעקה는 고통의 외침이므로, 현대 한국어에서 자연스럽고 감정 강도가 살아 있는 ‘부르짖는 소리’로 옮겼습니다.
- source_word: וּתְרוּעָה בְּעֵת צָהֳרָיִם
  english_pob_choice: and a battle shout at the time of noon
  chosen_korean: 정오 무렵에는 전쟁 함성을
  alternatives_korean:
  - 정오에는 경보를
  - 한낮에는 나팔 소리를
  lexicon: HALOT
  rationale: תרועה는 경보/나팔/전쟁 함성의 범위를 가지지만, 이 문맥에서는 폭력적 소란의 이미지를 살려 ‘전쟁 함성’으로 번역했습니다. בְּעֵת צָהֳרָיִם은 ‘정오 무렵’으로 풀어 한국어의 자연스러움을 확보했습니다.
theological_decisions:
- issue: 하나님의 이름과 심판의 불가역성 표현
  chosen_reading: 야훼 … 돌이키지 않으신
  alternative_readings:
  - 주께서 … 후회하지 않으신
  - 여호와께서 … 뜻을 거두지 않으신
  rationale: 본문은 소돔 같은 심판의 도시들을 가리키며 하나님의 판결이 철회되지 않았음을 강조합니다. ‘돌이키지 않으신’은 도덕적 후회가 아니라 심판의 철회 없음이라는 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: source-first rendering; preserve theological tension rather than flatten it'
