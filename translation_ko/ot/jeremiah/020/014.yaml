source:
  edition: WLC
  text: אָר֣וּר הַ/יּ֔וֹם אֲשֶׁ֥ר יֻלַּ֖דְתִּי בּ֑/וֹ י֛וֹם אֲשֶׁר יְלָדַ֥תְ/נִי אִמִּ֖/י אַל יְהִ֥י בָרֽוּךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/014.yaml
  text: Cursed be the day on which I was born[a]; the day my mother bore me[b], let it not be blessed.
  footnotes:
  - marker: a
    text: Or, 'Accursed be the day on which I was born.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'the day my mother gave birth to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 태어난 날은 저주받을지어다[a]. 내 어머니가 나를 낳은 날은 복을 받지 말지어다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 태어난 날이 저주받을지어다.’
    reason: 어순에 따른 표현상의 대안
  - marker: b
    text: 또는 ‘내 어머니가 나를 출산한 날.’
    reason: ‘낳다’에 대한 어휘상의 대안
lexical_decisions:
- source_word: אָרוּר / הַיּוֹם
  english_pob_choice: Cursed be the day
  chosen_korean: 저주받을지어다, 내가 태어난 날이여
  alternatives_korean:
  - 그 날은 저주받을지어다
  - 저주받은 날이여
  lexicon: HALOT
  rationale: אָרוּר의 임precatory 힘을 살리기 위해 명령형이 아니라 선포형 저주 표현으로 옮기고, הַיּוֹם은 특정한 출생일을 가리키므로 ‘그 날’보다 감탄적 호격을 살린 ‘날이여’를 택했습니다.
- source_word: אֲשֶׁר יֻלַּדְתִּי בּוֹ
  english_pob_choice: on which I was born
  chosen_korean: 내가 태어난
  alternatives_korean:
  - 내가 난
  - 내가 태어난 그
  lexicon: HALOT
  rationale: 수동형 ילד의 자연스러운 현대 한국어 대응은 ‘태어나다’이므로, 영어의 ‘was born’과 동일한 사건성을 유지하면서 문장을 덜 경직되게 했습니다.
- source_word: יְלָדַתְנִי אִמִּי
  english_pob_choice: my mother bore me
  chosen_korean: 내 어머니가 나를 낳은
  alternatives_korean:
  - 내 어머니가 나를 출산한
  - 내 어머니가 나를 낳으신
  lexicon: HALOT
  rationale: ילד의 두 번째 용례는 출산 행위를 직접 가리키므로 ‘낳다’가 가장 직설적입니다. ‘출산하다’는 현대적이지만 문맥의 비탄과 저주의 밀도를 다소 약화시킬 수 있습니다.
- source_word: אַל יְהִי בָרוּךְ
  english_pob_choice: let it not be blessed
  chosen_korean: 복을 받지 못할지어다
  alternatives_korean:
  - 복되게 되지 말지어다
  - 복을 받지 말지어다
  lexicon: HALOT
  rationale: ‘not be blessed’의 결과 상태를 한국어에서 자연스럽게 드러내기 위해 단순 부정보다 상태 부정인 ‘복을 받지 못하다’를 사용했습니다. 직역의 어색함보다 원문의 저주 대조를 선명하게 살렸습니다.
theological_decisions:
- issue: 예레미야의 저주적 탄식의 어조
  chosen_reading: 예언자의 격렬한 탄식을 그대로 살려, 완화된 기도문체로 바꾸지 않았습니다.
  alternative_readings:
  - 부드러운 탄식형으로 완화
  - 해설적 표현으로 중화
  rationale: 본문은 회개적 기도라기보다 출생일을 향한 임precatory lament이므로, 정서적 강도와 시적 병렬을 유지하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: Jeremiah 20:14-18 문맥의 탄식 시편적/예언자적 저주 발화
