  lexicon: HALOT
  rationale: 두 명사는 예언자적 고발의 관용적 쌍으로, ‘폭력’과 ‘파괴’가 가장 सीधे적이며 서로의 대구를 잘 살립니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
