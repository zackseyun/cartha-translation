  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 חָמָס וָשֹׁד는 히브리어에서 명사형 외침의 내용이므로, “폭력과 파괴다!”의 서술격 조사 ‘다’는 원문에 없는 단정을 약간 더합니다. ‘폭력과 파괴!’로 옮기면 원문의 압축된 외침을 더 충실히 보존합니다. 두 번째 כִּי의 인과도 ‘~때문입니다’로 명시하는 것이 좋습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘부르짖고 … 선포합니다’는 두 동사의 강도와 공적 선포의 성격을 구별하면서도 자연스럽습니다. ‘온종일 내게 수치와 조롱거리가 되었습니다’는 지속적 상태를 무리 없이 나타냅니다.
  terminology: ‘야훼’, ‘말씀’, ‘폭력’, ‘파괴’는 프로젝트의 용어 선택 및 원문의 예언자적 어법과 잘 맞습니다. ‘수치와 조롱거리’는 חרפה와 קלס의 병렬을 자연스럽게 반영합니다.
