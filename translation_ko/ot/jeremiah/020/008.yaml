  text: 내가 말할 때마다 나는 부르짖습니다. “폭력과 파괴다!”라고 선포합니다. 야훼의 말씀이 나에게는 온종일 수치와 조롱거리가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 말할 때마다 나는 부르짖습니다. “폭력과 파괴!”라고 선포합니다.”
