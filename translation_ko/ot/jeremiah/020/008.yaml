lexical_decisions:
- source_word: מִדֵּי אֲדַבֵּר
  english_pob_choice: whenever I speak
  chosen_korean: 내가 말할 때마다
  alternatives_korean:
  - 내가 말할 때마다
  - 말할 때마다
  lexicon: HALOT
  rationale: 반복적·습관적 용법을 한국어의 자연스러운 반복 표현으로 옮겨, “whenever”의 순환적 뉘앙스를 살렸습니다.
- source_word: אֶזְעָק
