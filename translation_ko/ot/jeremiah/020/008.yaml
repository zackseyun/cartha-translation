  - 나는 소리칩니다
  lexicon: HALOT
  rationale: זעק은 강한 외침을 뜻하므로, 단순한 ‘외치다’보다 강도가 살아 있는 ‘부르짖다’를 택했습니다.
- source_word: חָמָס וָשֹׁד
  english_pob_choice: violence and destruction
  chosen_korean: “폭력과 파괴다!”
