  - 주님의 말씀
  lexicon: HALOT
  rationale: 본문의 신명은 יְהוָה이므로 프로젝트 기본값에 따라 ‘야훼’를 사용했고, 예언서의 정형 표현 ‘말씀’은 유지했습니다.
- source_word: לְחֶרְפָּה וּלְקֶלֶס
  english_pob_choice: a reproach and a derision
  chosen_korean: 수치와 조롱거리가
  alternatives_korean:
  - 수치와 비웃음거리가
  - 모욕과 조롱거리가
  lexicon: HALOT
  rationale: חרפה와 קלס의 병렬을 한국어에서 자연스럽게 풀어, 공개적 수치와 조롱의 성격이 드러나도록 했습니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일
  alternatives_korean:
