  text: 이튿날, 파스훌이 예레미야를 착고에서 풀어 주자 예레미야가 그에게 말했습니다. “야훼께서 당신의 이름을 파스훌이라 부르신 것이 아니라, ‘사방의 공포’[a]라 부르셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
