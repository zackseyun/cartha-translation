source:
  edition: WLC
  text: לָ֤/מָּה תָמ֨וּתוּ֙ אַתָּ֣ה וְ/עַמֶּ֔/ךָ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר֙ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה אֶל הַ/גּ֕וֹי אֲשֶׁ֥ר לֹֽא יַעֲבֹ֖ד אֶת מֶ֥לֶךְ בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/013.yaml
  text: Why will you and your people die by the sword, by famine, and by pestilence, just as the LORD has spoken concerning the nation that will not serve the king of Babylon?
translation:
  language: ko
  text: 왜 당신과 당신의 백성이 칼과 기근과 전염병으로 죽으려 하십니까? 야훼께서 바빌론 왕을 섬기지 않을 그 민족에 대하여 말씀하신 것과 같이 말입니다.
  philosophy: formal
lexical_decisions:
- source_word: תָמוּתוּ אַתָּה וְעַמֶּךָ
  english_pob_choice: you and your people die
  chosen_korean: 당신과 당신의 백성이 죽으려 하십니까
  alternatives_korean:
  - 당신과 당신의 백성이 죽습니까
  - 당신과 백성이 죽으려 하십니까
  lexicon: מות
  rationale: 히브리어 미완료형을 수사적 질문으로 살려, 단순 미래보다 ‘죽음으로 치닫는’ 압박감을 드러냈습니다. 예언자적 경고의 어조를 위해 합쇼체 질문형을 사용했습니다.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  english_pob_choice: by the sword, by famine, and by pestilence
  chosen_korean: 칼과 기근과 전염병으로
  alternatives_korean:
  - 칼과 기근과 역병으로
  - 칼과 기근과 질병으로
  lexicon: חרב / רעב / דבר
  rationale: 세 개의 재앙 수단을 자연스러운 한국어 명사구로 압축하되, 히브리어의 병렬과 강도를 유지했습니다. ‘전염병’은 דבר의 전통적 재앙 의미를 비교적 직접적으로 드러냅니다.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  english_pob_choice: just as the LORD has spoken
  chosen_korean: 야훼께서 말씀하신 것과 같이
  alternatives_korean:
  - 주님께서 말씀하신 대로
  - 야훼께서 말씀하신 대로
  lexicon: דבר / יהוה
  rationale: 예언 성취의 비교 표지 כַּאֲשֶׁר를 ‘것과 같이’로 살려 ‘그대로 이루어짐’의 뉘앙스를 유지했습니다. 본문상의 YHWH는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַגּוֹי אֲשֶׁר לֹא יַעֲבֹד אֶת מֶלֶךְ בָּבֶל
  english_pob_choice: the nation that will not serve the king of Babylon
  chosen_korean: 바빌론 왕을 섬기지 않을 그 민족
  alternatives_korean:
  - 바빌론 왕을 섬기지 않는 그 민족
  - 바빌론 왕을 섬기려 하지 않는 그 민족
  lexicon: גוי / עבד
  rationale: ‘섬기다’는 왕에 대한 봉신적 복종을 가장 무리 없이 드러내며, ‘그 민족’으로 특정된 대상성을 살렸습니다. ‘바빌론’은 현대 표기 관행에 맞춰 옮겼습니다.
theological_decisions:
- issue: 예언적 수사문의 문체
  chosen_reading: ‘왜 … 죽으려 하십니까?’로 옮겨, 단순 정보 전달이 아니라 경고와 호소의 긴박함을 드러냈습니다.
  alternative_readings:
  - ‘왜 … 죽습니까?’
  - ‘왜 … 죽어야 합니까?’
  rationale: 본문은 결과를 예고하는 질문형 경고이므로, 한국어에서도 도발적 호소의 힘을 보존하는 것이 중요합니다.
  doctrine_reference: 예언서의 수사적 질문과 심판 경고의 문체
