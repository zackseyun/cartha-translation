  rationale: 문맥상 바벨론이 역전되어 다른 나라들의 지배 아래 놓인다는 뜻이므로, ‘그를 섬기게 하다’로 종속의 반전을 살렸습니다.
theological_decisions:
- issue: 바벨론의 장래와 심판의 역전
  chosen_reading: 마지막 절은 바벨론이 한동안 여러 나라를 거느리지만, 정해진 때가 오면 오히려 많은 나라와 큰 왕들에게 복속된다는 예언으로 읽습니다.
  alternative_readings:
  - 문자적으로는 ‘그를 사용하여 섬기게 할 것이다’처럼 더 딱딱하게 옮길 수 있습니다.
  rationale: 예레미야서의 더 넓은 문맥이 바벨론의 일시적 우위와 이후의 심판을 말하므로, 한국어에서도 권력의 역전이 분명히 드러나야 합니다.
  doctrine_reference: Jeremiah's judgment oracle against Babylon
