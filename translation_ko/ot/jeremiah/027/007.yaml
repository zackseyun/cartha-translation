source:
  edition: WLC
  text: וְ/עָבְד֤וּ אֹת/וֹ֙ כָּל הַ/גּוֹיִ֔ם וְ/אֶת בְּנ֖/וֹ וְ/אֶֽת בֶּן בְּנ֑/וֹ עַ֣ד בֹּא עֵ֤ת אַרְצ/וֹ֙ גַּם ה֔וּא וְ/עָ֤בְדוּ ב/וֹ֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדֹלִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
  footnotes:
  - marker: a
    text: Literally, 'and his son and his son's son.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'until the time of his land comes'—that is, the appointed time concerning Babylon's own land.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew likely means that many nations and great kings will subject Babylon to service; a more wooden rendering would be, 'will work him/use him for service.'
    reason: alternative_reading
translation:
  language: ko
  text: 모든 나라가 그와 그의 아들과 그의 손자까지 섬길 것이며, 그의 땅의 때가 올 때까지 그러할 것입니다. 그때에는 많은 나라와 큰 왕들이 그를 섬기게 할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 아들과 그의 손자의 아들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 땅의 때가 올 때까지’이지만, 여기서는 바벨론 땅에 대한 정해진 때를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘그를 섬기게 할 것입니다’는 바벨론이 다른 나라들의 지배 아래 놓인다는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ אֹתוֹ
  english_pob_choice: will serve him
  chosen_korean: 섬길 것이며
  alternatives_korean:
  - 그를 위해 일할 것입니다
  - 그에게 봉사할 것입니다
  lexicon: HALOT
  rationale: 정치적·제국적 종속 관계를 가리키므로, 단순 노동보다 지배자에게 복속하는 의미를 살린 ‘섬기다’가 가장 자연스럽습니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 나라
  alternatives_korean:
  - 모든 민족
  - 모든 이방 민족
  lexicon: HALOT
  rationale: 문맥이 바벨론에 대한 국제적 복속을 말하므로, 정치 단위로서의 ‘나라’가 적절합니다.
- source_word: וְאֶת בְּנוֹ וְאֶת בֶּן בְּנוֹ
  english_pob_choice: and his son, and his grandson
  chosen_korean: 그의 아들과 그의 손자까지
  alternatives_korean:
  - 그의 아들과 그의 아들의 아들까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역 가능성을 보존하면서도 현대 한국어에서 더 분명한 혈통·왕조의 연속을 드러냅니다.
- source_word: וְעָבְדוּ בוֹ
  english_pob_choice: will make him serve them
  chosen_korean: 그를 섬기게 할 것입니다
  alternatives_korean:
  - 그를 종으로 삼을 것입니다
  - 그에게 봉사하게 할 것입니다
  lexicon: HALOT
  rationale: 문맥상 바벨론이 역전되어 다른 나라들의 지배 아래 놓인다는 뜻이므로, ‘그를 섬기게 하다’로 종속의 반전을 살렸습니다.
theological_decisions:
- issue: 바벨론의 장래와 심판의 역전
  chosen_reading: 마지막 절은 바벨론이 한동안 여러 나라를 거느리지만, 정해진 때가 오면 오히려 많은 나라와 큰 왕들에게 복속된다는 예언으로 읽습니다.
  alternative_readings:
  - 문자적으로는 ‘그를 사용하여 섬기게 할 것이다’처럼 더 딱딱하게 옮길 수 있습니다.
  rationale: 예레미야서의 더 넓은 문맥이 바벨론의 일시적 우위와 이후의 심판을 말하므로, 한국어에서도 권력의 역전이 분명히 드러나야 합니다.
  doctrine_reference: Jeremiah's judgment oracle against Babylon
