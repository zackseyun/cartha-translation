  text: וְ/עָבְד֤וּ אֹת/וֹ֙ כָּל הַ/גּוֹיִ֔ם וְ/אֶת בְּנ֖/וֹ וְ/אֶֽת בֶּן בְּנ֑/וֹ עַ֣ד בֹּא עֵ֤ת אַרְצ/וֹ֙ גַּם ה֔וּא וְ/עָ֤בְדוּ ב/וֹ֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדֹלִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
  footnotes:
  - marker: a
    text: Literally, 'and his son and his son's son.'
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'until the time of his land comes'—that is, the appointed time concerning Babylon's own land.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew likely means that many nations and great kings will subject Babylon to service; a more wooden rendering would be, 'will work him/use him for service.'
    reason: alternative_reading
translation:
  language: ko
  text: 모든 나라가 그와 그의 아들과 그의 손자를[a] 섬길 것입니다. 그의 땅에 정해진 때가 올 때까지 그렇게 할 것입니다.[b] 그때에는 많은 나라와 큰 왕들이 그에게 자신들을 섬기게 할 것입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 아들과 그의 아들의 아들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 땅의 때가 올 때까지’입니다. 여기서는 바벨론 땅에 대한 정해진 때를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문맥상 많은 나라와 큰 왕들이 바벨론을 복속시켜 자신들을 섬기게 한다는 뜻입니다. 더 직역적으로는 ‘그를/그를 통하여 섬기게 할 것이다’라고 옮길 수 있습니다.
    reason: alternative_reading
