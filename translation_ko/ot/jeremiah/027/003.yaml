  source_fidelity: 히브리어의 명령적 용법, 다섯 통치자 목록, ‘암몬 자손’이라는 직역적 민족 명칭, 그리고 사신들을 통한 전달 수단을 충실히 반영합니다. הַבָּאִים יְרוּשָׁלִַם אֶל צִדְקִיָּהוּ는 예루살렘에 있는 시드기야에게 오는 사신들을 가리키므로, 기존의 ‘예루살렘에 와서 … 오는’은 이동 관계를 부자연스럽게 중복시킵니다.
  naturalness: 기존 문장은 ‘예루살렘에 와서 유다의 왕 시드기야에게 오는’이 중복되고, ‘사신들의 손을 통해’도 현대 한국어에서 다소 직역투입니다. 또한 지시문 종결은 목표 register인 현대 합쇼체에 맞춰 ‘보내십시오’로 고쳐야 합니다.
  terminology: 에돔, 모압, 암몬, 두로, 시돈, 시드기야는 통용 표기를 유지합니다. מַלְאָכִים은 이 외교 문맥에서 ‘사신들’이 적절하며, בְּנֵי עַמּוֹן은 본문에서 ‘암몬 자손’으로 보존하고 더 관용적인 민족 명칭을 각주에 제시합니다.
