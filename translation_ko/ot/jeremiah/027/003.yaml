base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/003.yaml
  text: And send them to the king of Edom[a], the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon, by the hand of the messengers who are coming to Jerusalem to Zedekiah king of Judah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Ammon''; that is, the Ammonites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 에돔 왕과 모압 왕과 암몬 자손의 왕과 두로 왕과 시돈 왕에게, 예루살렘에 와서 유다의 왕 시드기야에게 오는 사신들의 손을 통해 이들을 보내라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘암몬 자손’(sons of Ammon)이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתָּם
  english_pob_choice: And send them
  chosen_korean: 이들을 보내라
  alternatives_korean:
  - 그리고 이들을 보내라
  - 너는 이들을 보내야 한다
  lexicon: HALOT
  rationale: 문맥상 왕에게 주어지는 지시이므로 명령문으로 옮기되, 현대 한국어에서 자연스러운 직설형 명령을 택했습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬인들
  - 암몬의 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구조를 살려 직역적 표현을 유지했으며, POB의 문구 선택과도 맞춥니다.
- source_word: בְּיַד מַלְאָכִים
  english_pob_choice: by the hand of the messengers
  chosen_korean: 사신들의 손을 통해
  alternatives_korean:
  - 사신들을 통해
  - 사신들의 손으로
  lexicon: HALOT
  rationale: בְּיַד의 관용적 수단 표현을 살리면서도 한국어에서는 어색하지 않게 ‘손을 통해’로 옮겼습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 메신저들
  - 전령들
  lexicon: HALOT
  rationale: 이 문맥은 외교적 파견을 가리키므로 단순 전령보다 ‘사신들’이 가장 자연스럽고 정확합니다.
theological_decisions:
- issue: 유다 왕 시드기야에게 오는 사신들의 수신 방향을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘예루살렘에 와서 유다의 왕 시드기야에게 오는 사신들’로 처리하여, 사신들이 예루살렘에 도착해 시드기야를 향해 오는 상황을 유지했습니다.
  alternative_readings:
  - ‘예루살렘으로 오는 사신들’
  - ‘예루살렘에 있는 시드기야에게 오는 사신들’
  rationale: 원문은 예루살렘과 시드기야를 순차적으로 제시하여 도착지와 대상 모두를 보여 줍니다. 두 방향 정보를 모두 보존해야 외교 사절의 이동 상황이 흐려지지 않습니다.
  doctrine_reference: 번역 원칙 §1 (원문 상황 관계 보존)
