id: JER.27.8
reference: Jeremiah 27:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/גּ֜וֹי וְ/הַ/מַּמְלָכָ֗ה אֲשֶׁ֨ר לֹֽא יַעַבְד֤וּ אֹת/וֹ֙ אֶת נְבוּכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/אֵ֨ת אֲשֶׁ֤ר לֹֽא יִתֵּן֙ אֶת צַוָּאר֔/וֹ בְּ/עֹ֖ל מֶ֣לֶךְ בָּבֶ֑ל בַּ/חֶרֶב֩ וּ/בָ/רָעָ֨ב וּ/בַ/דֶּ֜בֶר אֶפְקֹ֨ד עַל הַ/גּ֤וֹי הַ/הוּא֙ נְאֻם יְהוָ֔ה עַד תֻּמִּ֥/י אֹתָ֖/ם בְּ/יָדֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/008.yaml
  text: And it shall be that the nation or the kingdom that will not serve him[a], Nebuchadnezzar king of Babylon, and that will not put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, declares Yahweh[c][b], until I have finished them by his hand.
  footnotes:
  - marker: a
    text: Or 'the nation and the kingdom'; the Hebrew pairs two political terms in a distributive warning against any realm that refuses Babylon's rule.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'put its neck under the yoke,' an image of submitting to Babylonian domination.
    reason: cultural_note
  - marker: c
    text: Or 'until I have consumed them by his hand.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 나라나 그 왕국이 바빌론 왕 느부갓네살[a]을 섬기지 아니하고, 바빌론 왕의 멍에 아래에 그 목을 내놓지 아니하면, 내가 그 나라를 칼과 기근과 전염병으로 벌하겠습니다. 주님의 말씀입니다. 내가 그들을 그의 손으로 끝낼[b] 때까지 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌론 왕 느부갓네살에 대한 그 나라와 그 왕국’; 히브리어는 두 정치 용어를 병렬로 두어 어떤 통치 체제든 포괄합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그의 손으로 그들을 소멸할 때까지’. 히브리어는 ‘끝내다/마치다’의 뜻을 가지므로, 멸절의 방식을 지나치게 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  english_pob_choice: the nation or the kingdom
  chosen_korean: 그 나라나 그 왕국
  alternatives_korean:
  - 그 나라와 그 왕국
  - 어느 나라나 왕국
  lexicon: HALOT
  rationale: 히브리어의 병렬은 배타적 선택이라기보다 어떤 정치체든 포괄하는 분배적 경고이므로, 한국어에서는 ‘나아니면’ 구조로 자연스럽게 살렸습니다.
- source_word: יַעַבְדוּ אֹתוֹ
  english_pob_choice: will not serve him
  chosen_korean: 섬기지 아니하고
  alternatives_korean:
  - 복종하지 아니하고
  - 봉사하지 아니하고
  lexicon: HALOT
  rationale: 여기서 עבד는 노동이 아니라 제국 권력에 대한 정치적 종속을 뜻하므로, 가장 넓고도 자연스러운 ‘섬기다’를 택했습니다.
- source_word: אֶת צַוָּארוֹ בְּעֹל
  english_pob_choice: put its neck under the yoke
  chosen_korean: 그 목을 내놓지 아니하면
  alternatives_korean:
  - 그 목을 멍에 아래에 두지 아니하면
  - 그 목을 멍에 아래로 굽히지 아니하면
  lexicon: HALOT
  rationale: 직역적 ‘목과 멍에’ 이미지를 유지하되 한국어에서 어색한 결합을 피하면서도, 지배에 대한 굴복이라는 상징을 보존했습니다.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  english_pob_choice: with the sword, with famine, and with pestilence
  chosen_korean: 칼과 기근과 전염병으로
  alternatives_korean:
  - 칼과 기근과 역병으로
  - 칼로, 기근으로, 전염병으로
  lexicon: HALOT
  rationale: 예레미야에 반복되는 심판의 삼중 표현을 간결하게 살렸고, ‘전염병’은 문어체에서 ‘역병’보다 현대 독자가 이해하기 쉽습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 주님의 말씀입니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 주님의 선언입니다
  lexicon: HALOT
  rationale: 본문의 예언자적 종결 공식을 한국어 독서감에 맞게 처리했습니다. 본 기록의 YHWH 표기는 프로젝트 기본값과 충돌하므로 주석에서 처리하지 않고 본문은 예언 화자 표지로 옮겼습니다.
- source_word: עַד תֻּמִּי אֹתָם
  english_pob_choice: until I have finished them
  chosen_korean: 내가 그들을 그의 손으로 끝낼 때까지
  alternatives_korean:
  - 내가 그들을 그의 손으로 다 끝낼 때까지
  - 내가 그들을 그의 손으로 소멸할 때까지
  lexicon: HALOT
  rationale: תמם은 ‘완전히 끝내다/마치다’의 뜻이므로, 파괴의 정도를 과잉 규정하지 않으면서도 심판의 종결성을 드러내는 ‘끝내다’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 예언 종결식
  chosen_reading: 본문에는 하나님의 이름을 직접 옮기지 않고, 예언자적 종결식으로 ‘주님의 말씀입니다’라고 처리했습니다.
  alternative_readings:
  - 야훼께서 말씀하십니다
  - 주님께서 말씀하십니다
  rationale: 히브리어 נְאֻם יְהוָה는 예언 공식이므로, 한국어에서는 독자가 기능을 즉시 알아듣도록 종결식으로 자연화했습니다. 다만 본문 자체의 신명성 강조는 유지했습니다.
  doctrine_reference: 예언서 종결 공식과 하나님의 이름 표기 원칙
