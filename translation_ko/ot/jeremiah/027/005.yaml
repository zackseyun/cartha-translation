  source_fidelity: 초안은 אָנֹכִי의 강조, 창조의 세 대상, 큰 능력과 뻗은 팔의 수단을 대체로 충실히 반영합니다. 그러나 וּנְתַתִּיהָ를 ‘…준다고 말합니다’로 옮기면 원문에 없는 발화 보고(‘말합니다’)가 추가되고, 하나님의 직접 선언이 간접 인용으로 바뀝니다. 히브리어 완료형에 맞추어 직접적으로 ‘주었습니다’로 고쳤습니다.
  naturalness: ‘나 자신이’와 ‘내 펴신 팔’은 다소 부자연스럽거나 어색합니다. 현대 표준어 합쇼체에서는 강조를 ‘바로 내가’로, 관용적 신체 은유를 ‘편 팔’로 옮기는 것이 자연스럽습니다. 또한 어휘 각주는 해당 어휘인 ‘사람’에 붙여야 합니다.
  terminology: אָדָם은 이 창조 문맥에서 인류를 대표하는 단수이므로 ‘사람’은 가능한 번역입니다. הַבְּהֵמָה는 집단적 명사이므로 한국어 성경 문체에 맞게 ‘짐승’으로 유지했습니다. לַאֲשֶׁר יָשַׁר בְּעֵינַי는 ‘내가 보기에 옳은 자’로 옮겨 ‘내 눈에/보기에’라는 관용과 하나님의 판단이라는 의미를 보존했습니다.
