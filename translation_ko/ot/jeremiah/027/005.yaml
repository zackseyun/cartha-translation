source:
  edition: WLC
  text: אָנֹכִ֞י עָשִׂ֣יתִי אֶת הָ/אָ֗רֶץ אֶת הָ/אָדָ֤ם וְ/אֶת הַ/בְּהֵמָה֙ אֲשֶׁר֙ עַל פְּנֵ֣י הָ/אָ֔רֶץ בְּ/כֹחִ/י֙ הַ/גָּד֔וֹל וּ/בִ/זְרוֹעִ֖/י הַ/נְּטוּיָ֑ה וּ/נְתַתִּ֕י/הָ לַ/אֲשֶׁ֖ר יָשַׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/005.yaml
  text: I myself made the earth[a], mankind, and the animals that are on the face of the earth, by my great power and by my outstretched arm, and I give it to whomever is right in my eyes.
  footnotes:
  - marker: a
    text: Or 'humankind' or 'humanity' for 'the man'; the Hebrew singular אָדָם can function representatively for the human race.
    reason: lexical_alternative
translation:
  language: ko
  text: 바로 내가 땅과 사람[a]과 땅 위에 있는 짐승을 나의 큰 능력과 편 팔로 만들었으며, 그것을 내가 보기에 옳은 자에게 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 문맥에 따라 ‘사람’, ‘인간’, ‘인류’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  english_pob_choice: I myself
  chosen_korean: 나 자신이
  alternatives_korean:
  - 내가
  - 바로 내가
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 살려, 단순한 주어 표지보다 강한 ‘나 자신이’로 옮겼습니다.
- source_word: הָאָדָם
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  - 남자
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 대표성을 띤 일반 지칭이므로, 문맥상 한국어에서는 성별을 좁히지 않는 ‘사람’이 가장 자연스럽고 원문 의도를 유지합니다.
- source_word: בְּכֹחִי הַגָּדוֹל וּבִזְרוֹעִי הַנְּטוּיָה
  english_pob_choice: by my great power and by my outstretched arm
  chosen_korean: 내 큰 능력과 내 펴신 팔로
  alternatives_korean:
  - 내 큰 능력과 내 뻗은 팔로
  - 내 큰 능력과 내 펴진 팔로
  lexicon: HALOT
  rationale: ‘outstretched arm’은 하나님의 권능을 나타내는 관용구이므로, 직역보다 성경적 관용을 살린 ‘내 펴신 팔’로 옮겼습니다.
- source_word: וּנְתַתִּיהָ
  english_pob_choice: and I give it
  chosen_korean: 내가 그것을 … 준다고
  alternatives_korean:
  - 내가 그것을 … 줍니다
  - 내가 그것을 … 주겠다고
  lexicon: HALOT
  rationale: 히브리어 완료형이 여기서는 주권적 선언의 현재적 효력을 띠므로, 서술문의 직접 인용 안에서 ‘준다고’로 처리해 선언성을 살렸습니다.
- source_word: לַאֲשֶׁר יָשַׁר בְּעֵינַי
  english_pob_choice: to whomever is right in my eyes
  chosen_korean: 내 눈에 옳은 사람에게
  alternatives_korean:
  - 내 눈에 옳다고 여겨지는 사람에게
  - 내 보기에 옳은 사람에게
  lexicon: HALOT
  rationale: ‘in my eyes’의 관용을 유지하면서도 한국어로 자연스럽게 ‘내 눈에 옳은 사람에게’로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 대표적 단수와 일반적 의미
  chosen_reading: ‘사람’으로 옮겨 단수형을 유지하되 대표성을 살렸습니다.
  alternative_readings:
  - 인간
  - 인류
  rationale: 원문은 단수형이지만 창조 진술의 삼중 병렬 속에서 인류 전체를 대표하는 표현이므로, 한국어에서도 문법적 단수와 일반적 의미를 함께 전달하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 아담/אָדָם의 대표성 및 성별-정확성 지침'
