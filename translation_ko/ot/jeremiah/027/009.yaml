id: JER.27.9
reference: Jeremiah 27:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אַתֶּם אַל תִּשְׁמְע֨וּ אֶל נְבִיאֵי/כֶ֜ם וְ/אֶל קֹֽסְמֵי/כֶ֗ם וְ/אֶל֙ חֲלֹמֹ֣תֵי/כֶ֔ם וְ/אֶל עֹֽנְנֵי/כֶ֖ם וְ/אֶל כַּשָּׁפֵי/כֶ֑ם אֲשֶׁר הֵ֞ם אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֥לֶךְ בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/009.yaml
  text: But you[a], do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who are saying to you, ‘You will not serve the king of Babylon.’
  footnotes:
  - marker: a
    text: Or more literally, 'your dreams'; the Hebrew term is formally 'dreams,' but in this list it likely stands for those who claim revelatory dreams.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 너희 예언자들과 너희 점술가들과 너희 꿈꾸는 자들과 너희 예언자들과 너희 마술사들의 말을 듣지 마십시오. 그들은 너희에게 ‘너희는 바빌론 왕을 섬기지 않을 것이다’라고 말하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 형태는 문자적으로는 ‘꿈들’이지만, 여기서는 꿈을 빌미로 계시를 주장하는 사람들을 가리키는 말로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  english_pob_choice: But you
  chosen_korean: 그러나 너희는
  alternatives_korean:
  - 그리고 너희는
  - 너희는
  lexicon: WLC
  rationale: 문맥상 앞선 경고와 대비되는 전환이므로 ‘그러나’로 역접을 살리고, 직접 호칭은 ‘너희는’으로 자연스럽게 처리했습니다.
- source_word: אַל תִּשְׁמְעוּ אֶל
  english_pob_choice: do not listen to
  chosen_korean: 말을 듣지 마십시오
  alternatives_korean:
  - 듣지 마십시오
  - 귀 기울이지 마십시오
  lexicon: WLC
  rationale: אֶל 뒤의 שׁמע는 단순 청취가 아니라 ‘귀 기울여 따르다’의 뉘앙스가 있어, 한국어에서는 직설적이고 자연한 금지형으로 옮겼습니다.
- source_word: קֹסְמֵיכֶם / עֹנְנֵיכֶם / כַּשָּׁפֵיכֶם
  english_pob_choice: your diviners / your soothsayers / your sorcerers
  chosen_korean: 너희 점술가들 / 너희 예언자들 / 너희 마술사들
  alternatives_korean:
  - 너희 점쟁이들 / 너희 점치는 자들 / 너희 주술사들
  - 너희 복술가들 / 너희 주술사들 / 너희 마법사들
  lexicon: HALOT
  rationale: קסם·עונן·כשף의 점복/주술 범주를 현대 한국어로 이해 가능하게 옮기되, 본문의 열거가 가진 강한 비판성을 살리기 위해 직역보다 기능 대응어를 택했습니다. 다만 חֲלֹמֹתֵיכֶם은 주체가 아니라 ‘꿈’을 말하는 형식이어서, 항목의 대칭을 위해 POB와 달리 ‘꿈꾸는 자들’로 자연화했습니다.
theological_decisions:
- issue: חֲלֹמֹתֵיכֶם의 의미를 ‘꿈’ 자체로 볼지, 꿈을 매개로 예언을 주장하는 자들로 볼지
  chosen_reading: ‘너희 꿈꾸는 자들’로 옮겨, 꿈을 근거로 말하는 자들을 가리키는 메톤িম이를 반영했습니다.
  alternative_readings:
  - ‘너희 꿈들’
  - ‘너희 꿈 해석자들’
  rationale: 열거된 나머지 항목들이 모두 사람/직분을 가리키므로, 여기서도 단순 사물명사보다 행위 주체로 이해하는 편이 병렬 구조와 문맥에 더 잘 맞습니다.
  doctrine_reference: '번역 원칙: 문법형태를 기계적으로 따르기보다 문맥상 기능을 반영하되, 본문이 지지하지 않는 해석어는 덧붙이지 않습니다.'
