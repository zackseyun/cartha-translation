translation:
  language: ko
  text: 그들에게, 그들의 주인들에게 이렇게 말하라고 명령하십시오[a]. “만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. ‘너희는 너희 주인들에게 이렇게 말하십시오.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들의 주인들/너희 주인들’로 되어 있으며, 여기서는 인간 통치자를 가리키므로 신적 호칭과의 혼동을 피하기 위해 ‘주인들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתָ אֹתָם
  english_pob_choice: And command them
  chosen_korean: 그들에게 … 명령하십시오
  alternatives_korean:
  - 그들에게 명령하십시오
  - 그들에게 지시하십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 완료형의 지시적 용법을 한국어 명령형으로 옮기되, 이어지는 인용문의 도입이 자연스럽도록 간결하게 처리했습니다.
- source_word: אֶל אֲדֹנֵיהֶם / אֶל אֲדֹנֵיכֶם
  english_pob_choice: to their masters / to your masters
  chosen_korean: 그들의 주인들에게 / 너희 주인들에게
  alternatives_korean:
  - 그들의 주들에게 / 너희 주들에게
  - 그들의 군주들에게 / 너희 군주들에게
  lexicon: HALOT
  rationale: אדון은 여기서 인간 통치자를 가리키므로 신적 호칭과 구별되도록 ‘주인’으로 옮겼습니다. 한국어에서 ‘군주’도 가능하지만 본문은 사신들이 섬기는 정치적 상관을 가리키는 말이라 ‘주인들’이 더 직접적입니다.
- source_word: יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh of hosts, the God of Israel
  chosen_korean: 만군의 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 만군의 야훼, 이스라엘의 하느님
  - 만군의 주, 이스라엘의 하나님
  lexicon: HALOT
  rationale: YHWH는 프로젝트 기본값에 따라 ‘야훼’로, צְבָאוֹת는 고정 칭호인 ‘만군의’로, אֱלֹהֵי יִשְׂרָאֵל은 언약적 호칭으로 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: כֹּה תֹאמְרוּ
  english_pob_choice: Thus you shall say
  chosen_korean: 너희는 … 이렇게 말하십시오
  alternatives_korean:
  - 너희는 … 말해야 합니다
  - 이처럼 말하십시오
  lexicon: HALOT
  rationale: 복수형 지시를 한국어 공손 명령으로 옮겨 예레미야가 사신들에게 전할 전달 문구의 반복적 명령성을 살렸습니다.
theological_decisions:
- issue: 예언 공식을 한국어에서 어떤 높임으로 표현할지
  chosen_reading: 예레미야에게 주어진 전달 명령은 ‘명령하십시오’로, 인용문 안의 하나님의 직접 발화는 ‘말씀하십니다’로 높임을 유지했습니다.
  alternative_readings:
  - 전체를 평서형으로 통일
  - 인용문 안에서도 모두 명령형으로 처리
  rationale: 한국어 합쇼체에서는 서술자-피전달자-하나님 발화의 화자 층위를 구분하는 것이 자연스럽고, 원문의 명령-인용 구조도 더 분명해집니다.
  doctrine_reference: Korean discourse/register conventions; source speech layering
