id: JER.27.17
reference: Jeremiah 27:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּשְׁמְע֣וּ אֲלֵי/הֶ֔ם עִבְד֥וּ אֶת מֶֽלֶךְ בָּבֶ֖ל וִֽ/חְי֑וּ לָ֧/מָּה תִֽהְיֶ֛ה הָ/עִ֥יר הַ/זֹּ֖את חָרְבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/017.yaml
  text: Do not listen to them[a]. Serve the king of Babylon and live[b]. Why should this city become a ruin?
  footnotes:
  - marker: a
    text: Or 'Do not obey them.' The Hebrew verb can carry the sense of heeding as well as listening.
    reason: lexical_alternative
  - marker: b
    text: Or 'Why should this city be desolate?' The Hebrew noun refers to devastation or ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 귀를 기울이지 마십시오.[a] 바빌론 왕을 섬기고 사십시오. 어찌하여 이 성읍이 폐허가 되겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 순종하지 마십시오’. 히브리어 동사는 듣다와 귀를 기울여 따르다의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어찌하여 이 성읍이 황폐하게 되겠습니까?’. 히브리어 명사는 황폐와 파괴의 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֲלֵיהֶם
  english_pob_choice: Do not listen to them
  chosen_korean: 그들에게 귀를 기울이지 마십시오
  alternatives_korean:
  - 그들의 말을 듣지 마십시오
  - 그들을 따르지 마십시오
  lexicon: HALOT
  rationale: שׁמע + אֶל은 단순 청취보다 ‘귀를 기울여 듣다/받아들이다’의 뜻이 자연스럽고, 예언적 문맥에서 그들의 메시지에 주의를 기울이지 말라는 뉘앙스를 살리기에 적절합니다.
- source_word: עִבְדוּ אֶת מֶלֶךְ בָּבֶל
  english_pob_choice: Serve the king of Babylon
  chosen_korean: 바빌론 왕을 섬기고
  alternatives_korean:
  - 바빌론 왕을 섬기십시오
  - 바빌론 왕에게 복종하고
  lexicon: HALOT
  rationale: עבד는 여기서 정치적 예속과 봉사를 함께 포함하는 명령이므로, 한국어 ‘섬기다’가 가장 간결하게 그 관계를 드러냅니다.
- source_word: וִחְיוּ
  english_pob_choice: and live
  chosen_korean: 살아야 합니다
  alternatives_korean:
  - 그리고 사십시오
  - 그러면 살게 될 것입니다
  lexicon: HALOT
  rationale: 연결된 명령형의 결과적 뉘앙스를 살리기 위해 ‘살아야 합니다’로 옮겨, 순종의 결과가 생명임을 자연스럽게 표현했습니다.
- source_word: חָרְבָּה
  english_pob_choice: a ruin
  chosen_korean: 폐허
  alternatives_korean:
  - 황폐
  - 무너진 곳
  - 황폐한 곳
  lexicon: HALOT
  rationale: חָרְבָּה는 ‘황폐/파괴된 상태’를 가리키므로, 명사적이고 구체적인 한국어 ‘폐허’가 문장 구조와 잘 맞습니다.
theological_decisions:
- issue: 예언자의 경고에 대한 반응을 ‘듣다’보다 더 적극적으로 표현할지
  chosen_reading: ‘그들에게 귀를 기울이지 마십시오’로 옮겨 단순 청각이 아니라 메시지 수용의 거부를 드러냈습니다.
  alternative_readings:
  - 그들의 말을 듣지 마십시오
  - 그들에게 순종하지 마십시오
  rationale: 본문의 שׁמע는 맥락상 단순 청취가 아니라 ‘heed’의 의미를 포함하므로, 해석을 과도하게 좁히지 않으면서도 의도된 불순종/거부를 전달해야 합니다.
  doctrine_reference: 예언 경고 수용과 불순종의 윤리
