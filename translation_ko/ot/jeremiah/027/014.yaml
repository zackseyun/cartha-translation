  to: 그리고 여러분에게 「여러분은 바빌론 왕을 섬기지 않을 것입니다」[a]라고 말하는 그 예언자들의 말을 듣지 마십시오. 그들은 여러분에게 거짓을 예언하고 있기 때문입니다.
  rationale: 원문의 관계절(‘여러분에게 말하는 예언자들’)을 한국어 수식절로 회복하고, 원문에 없는 역접 ‘하지만’을 제거했습니다. 또한 문법적 대안에 관한 각주를 해당 인용문 뒤에 배치했습니다. 예측적 읽기와 핵심 용어는 유지했습니다.
