id: JER.27.14
reference: Jeremiah 27:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י הַ/נְּבִאִ֗ים הָ/אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֣לֶךְ בָּבֶ֑ל כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֥ים לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/014.yaml
  text: And do not listen to the words of the prophets who are saying to you[a], ‘You will not serve the king of Babylon,’ for they are prophesying a lie to you.
  footnotes:
  - marker: a
    text: Or, 'Do not serve the king of Babylon.' The Hebrew form can be read as a prohibition, but in context it is best taken as the prophets' false prediction that Judah will not have to serve Babylon.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그 예언자들의 말을 듣지 마십시오. 그들은 여러분에게 「여러분은 바빌론 왕을 섬기지 않을 것입니다」라고 말하지만, 그들은 여러분에게 거짓을 예언하고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「바빌론 왕을 섬기지 말라」. 히브리어 형태는 금지 명령으로도 읽을 수 있지만, 문맥상 여기서는 유다가 바빌론을 섬기지 않게 될 것이라는 예언자들의 거짓 예측으로 보는 것이 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַל תִּשְׁמְעוּ
  english_pob_choice: And do not listen
  chosen_korean: 그리고 그 예언자들의 말을 듣지 마십시오
  alternatives_korean:
  - 그 예언자들의 말을 듣지 마십시오
  - 그리고 그 예언자들의 말을 들으시면 안 됩니다
  lexicon: HALOT
  rationale: וְ는 앞 문맥과의 연결을 살리고, אַל+미완료형은 금지 명령이므로 합쇼체 금지 표현으로 옮겼습니다. תִּשְׁמְעוּ는 כאן ‘듣다/귀 기울이다’의 뜻으로, 자연스러운 한국어에 맞게 ‘말을 듣다’로 렌더링했습니다.
- source_word: אֶל דִּבְרֵי הַנְּבִאִים
  english_pob_choice: the words of the prophets
  chosen_korean: 그 예언자들의 말
  alternatives_korean:
  - 예언자들의 말
  - 예언자들의 말씀
  lexicon: HALOT
  rationale: 직역하면 ‘예언자들의 말들’이지만, 한국어에서는 자연스럽게 집합적 의미로 ‘말’이 더 적절합니다. ‘말씀’은 존중 뉘앙스가 강해 여기서는 거짓 예언의 맥락을 약화시킬 수 있습니다.
- source_word: לֹא תַעַבְדוּ אֶת מֶלֶךְ בָּבֶל
  english_pob_choice: You will not serve the king of Babylon
  chosen_korean: 「여러분은 바빌론 왕을 섬기지 않을 것입니다」
  alternatives_korean:
  - 「바빌론 왕을 섬기지 말라」
  - 「여러분은 바빌론 왕에게 복종하지 않을 것입니다」
  lexicon: HALOT
  rationale: 영어 POB의 판단을 따라 이것을 금지 명령이 아니라 거짓 예언의 예측 진술로 옮겼습니다. עבד는 왕에 대한 봉사/예속을 뜻하므로 ‘섬기다’가 가장 직접적이며, ‘복종하다’는 의미는 가능하지만 한국어에서 다소 행정적입니다.
- source_word: כִּי שֶׁקֶר
  english_pob_choice: for they are prophesying a lie
  chosen_korean: 그들은 여러분에게 거짓을 예언하고 있기 때문입니다
  alternatives_korean:
  - 그들은 여러분에게 거짓말을 예언하고 있기 때문입니다
  - 그들은 여러분에게 거짓 예언을 하고 있기 때문입니다
  lexicon: HALOT
  rationale: שֶׁקֶר은 단순한 ‘거짓말’보다 예언 내용 전체의 허위를 가리키므로, ‘거짓을 예언하다’로 옮겨 स्रोत의 짧은 직설성을 유지했습니다. ‘거짓 예언을 하다’도 가능하지만, 히브리어의 명사적 표현이 더 선명하게 드러나는 쪽을 택했습니다.
theological_decisions:
- issue: 예언 내용의 성격
  chosen_reading: 이 문장은 ‘바빌론 왕을 섬기지 않을 것이다’라는 거짓된 예측으로 읽었습니다.
  alternative_readings:
  - ‘바빌론 왕을 섬기지 말라’는 금지 명령으로 읽을 수 있습니다.
  rationale: 문맥상 예레미야는 바빌론 지배를 부정하는 예언자들을 경고하고 있으며, 뒤이은 이유절이 그것을 거짓 예언으로 규정합니다. 따라서 명령문처럼 완화하지 않고, 허위 예측이라는 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
