  source_fidelity: 히브리어의 금지 명령, 예언자들의 반복적 발화, 바빌론 왕을 섬기지 않게 될 것이라는 예측적 읽기, 그리고 그들이 거짓을 예언한다는 이유절이 모두 보존되어 있습니다. 다만 초안의 ‘말하지만’은 원문에 없는 대조를 만들고, 앞의 ‘듣지 마십시오’와의 논리 관계도 다소 흐립니다.
  naturalness: ‘그리고 그 예언자들의 말을 듣지 마십시오. 그들은 … 말하지만’은 관계절 내용을 독립문으로 나눈 뒤 역접으로 이어 자연스럽지 않습니다. 인용 내용을 ‘말하는 그 예언자들’이라는 수식절로 묶으면 현대 한국어 문장 흐름과 원문의 구조가 더 잘 살아납니다.
