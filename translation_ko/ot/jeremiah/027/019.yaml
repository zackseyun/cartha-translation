source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֶל הָֽ/עַמֻּדִ֔ים וְ/עַל הַ/יָּ֖ם וְ/עַל הַ/מְּכֹנ֑וֹת וְ/עַל֙ יֶ֣תֶר הַ/כֵּלִ֔ים הַ/נּוֹתָרִ֖ים בָּ/עִ֥יר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/019.yaml
  text: 'For thus says Yahweh of Armies concerning the pillars[a], the Sea, the stands[b], and the rest of the vessels that remain in this city:'
  footnotes:
  - marker: a
    text: Or 'the bronze Sea,' the large basin in the temple furnishings.
    reason: cultural_note
  - marker: b
    text: Or 'bases' for 'stands.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이는 만군의 야훼께서 기둥들과 바다[a]와 받침대들과 이 성읍에 남아 있는 나머지 기물들에 대하여 이렇게 말씀하십니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다’는 성전의 큰 놋대야(놋바다)를 가리키는 고유한 명칭일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 야훼 만군
  lexicon: HALOT
  rationale: צְבָאוֹת는 ‘군대/군세’의 복수 개념을 살려 한국어 성경의 자연스러운 대응인 ‘만군의’로 옮기고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: הָעַמֻּדִים
  english_pob_choice: the pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 주들
  - 기둥
  lexicon: HALOT
  rationale: 성전 기물 문맥에서 עַמּוּדִים은 구조물의 ‘기둥’이 자연스러우며, 복수형을 분명히 하기 위해 ‘기둥들’로 옮겼습니다.
- source_word: הַיָּם
  english_pob_choice: the Sea
  chosen_korean: 바다
  alternatives_korean:
  - 놋바다
  - 큰 물두멍
  lexicon: HALOT
  rationale: 본문은 성전 기물의 고유명칭인 ‘the Sea’를 가리키므로 직역형 ‘바다’를 유지했습니다. 필요하면 주석으로 성전의 놋바다를 밝혀도 됩니다.
- source_word: הַמְּכֹנֹת
  english_pob_choice: the stands
  chosen_korean: 받침대들
  alternatives_korean:
  - 거치대들
  - 기초들
  - 대좌들
  lexicon: HALOT
  rationale: 이 항목은 물두멍을 받치는 장치를 가리키므로 기능을 드러내는 ‘받침대들’이 가장 무난합니다.
- source_word: יֶתֶר הַכֵּלִים הַנּוֹתָרִים
  english_pob_choice: the rest of the vessels that remain
  chosen_korean: 그 밖의 기물들에 대하여
  alternatives_korean:
  - 남아 있는 그 밖의 그릇들에 대하여
  - 나머지 기물들에 대하여
  lexicon: HALOT
  rationale: יֶתֶר은 ‘나머지/그 밖의’, כֵּלִים은 성전 맥락에서 ‘기물/그릇’이 가능하나, 여기서는 포괄적인 성전 비품을 가리키므로 ‘기물들’이 더 정확합니다.
theological_decisions:
- issue: 열거 구조와 문장 흐름
  chosen_reading: 직접 인용문 뒤에 ‘곧’으로 이어지는 설명 구조를 취해, 야훼의 발화와 대상 열거를 구분했습니다.
  alternative_readings:
  - 한 문장으로 완전히 합쳐 번역
  - ‘~에 관하여 말씀하십니다’만으로 처리
  rationale: 원문은 예언 공식 뒤에 대상 목록이 이어지는 구조이므로, 한국어에서도 말문과 대상 지시를 분명히 나누는 편이 의미가 선명합니다.
  doctrine_reference: 'POB translation philosophy: transparent source structure'
