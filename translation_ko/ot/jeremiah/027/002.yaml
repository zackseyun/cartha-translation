lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus said Yahweh
  chosen_korean: 「야훼께서 내게 이렇게 말씀하셨습니다」
  alternatives_korean:
  - 야훼께서 말씀하셨습니다
  - 야훼께서 내게 이같이 말씀하셨습니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어로 자연스럽게 옮기되, POB의 야훼를 유지하고 ‘이렇게’로 כֹּה의 지시적 뉘앙스를 살렸습니다.
- source_word: עֲשֵׂה לְךָ
  english_pob_choice: Make for yourself
  chosen_korean: 너는 너를 위하여 ... 만들어
  alternatives_korean:
  - 너를 위하여 ... 만들라
  - 네 자신을 위해 ... 만들어
  lexicon: HALOT
  rationale: לְךָ의 재귀/수혜 뉘앙스를 반영해 ‘너를 위하여’로 옮겼고, 합쇼체 명령문으로 자연스럽게 처리했습니다.
- source_word: מוֹסֵרוֹת וּמֹטוֹת
  english_pob_choice: bonds and yoke-bars
  chosen_korean: 줄과 멍에채
  alternatives_korean:
  - 속박줄과 멍에
  - 끈과 멍에막대
  lexicon: HALOT
  rationale: 모세롯은 단순 ‘끈’보다 구속용 ‘줄’이 문맥에 맞고, 모톳은 전체 ‘멍에’보다 막대/채에 해당하므로 ‘멍에채’로 구체화했습니다.
- source_word: וּנְתַתָּם עַל צַוָּארֶךָ
  english_pob_choice: and put them on your neck
  chosen_korean: 그것들을 네 목에 두어라
  alternatives_korean:
  - 그것들을 네 목에 놓아라
  - 그것들을 네 목 위에 두어라
  lexicon: HALOT
  rationale: 연속 명령의 힘을 살려 ‘두어라’로 옮겼고, עַל צַוָּארֶךָ는 한국어에서 자연스러운 ‘네 목에’로 처리했습니다.
