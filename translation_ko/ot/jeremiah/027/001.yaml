translation:
  language: ko
  text: 유다 왕 요시야의 아들 여호야김이 통치하기 시작할 때에, 이 말씀이 야훼로부터 예레미야에게 임하여 말씀하셨습니다[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘유다 왕 요시야의 아들 여호야김’은 예레미야 27장 3, 12절의 문맥과 긴장 관계를 이루는 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 ‘야훼로부터’입니다. 본 프로젝트는 하나님의 이름 יְהוָה를 ‘야훼’로 옮깁니다.
    reason: ot_citation
