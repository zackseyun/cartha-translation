translation:
  language: ko
  text: '유다 왕 요시야의 아들 여호야김[a]의 통치 초기에, 야훼께서 예레미야에게 다음과 같이 말씀하셨습니다[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘유다 왕 요시야의 아들 여호야김’이라는 언급은 예레미야 27장 3절과 12절의 문맥이 시드기야를 가리키는 것처럼 보이므로, 문맥상 어려움이 있다고 여겨집니다.
    reason: textual_variant
  - marker: b
    text: 히브리어는 직역하면 ‘야훼에게서 예레미야에게 이 말씀이 있었습니다, 말씀하시기를’입니다. 본 프로젝트는 하나님의 이름 יְהוָה를 ‘야훼’로 옮깁니다.
    reason: lexical_alternative
