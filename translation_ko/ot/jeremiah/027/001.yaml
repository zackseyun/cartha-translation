  doctrine_reference: 예언적 계시의 주권성과 말씀 도래 공식
- issue: 직접 인용 표지 לֵאמֹר의 처리
  chosen_reading: 본문을 한 문장으로 매끄럽게 하되, 다음 절의 인용이 이어짐을 암시하도록 마무리했습니다.
  alternative_readings:
