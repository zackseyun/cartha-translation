  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying[b],
  footnotes:
  - marker: a
    text: 'Hebrew: ''from Yahweh.'' The divine name יְהוָה is rendered ''the LORD'' in keeping with the project''s stated policy.'
