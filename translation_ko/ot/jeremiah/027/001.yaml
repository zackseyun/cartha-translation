theological_decisions:
- issue: 예언서 도입 공식의 주어와 서술 방식
  chosen_reading: ‘이 말씀이 … 임하여’로 번역해 말씀의 주체가 야훼에게 있음을 분명히 했습니다.
  alternative_readings:
  - ‘이 말이 … 왔습니다’
  - ‘계시가 … 있었습니다’
  rationale: 히브리어 예언 공식은 단순 정보 전달이 아니라 야훼의 말씀 도래를 나타내므로, 표준적 예언서 어법을 유지했습니다.
  doctrine_reference: 예언적 계시의 주권성과 말씀 도래 공식
- issue: 직접 인용 표지 לֵאמֹר의 처리
  chosen_reading: 본문을 한 문장으로 매끄럽게 하되, 다음 절의 인용이 이어짐을 암시하도록 마무리했습니다.
  alternative_readings:
  - ‘말씀하여 이르시기를’
  - 콤마로 열어 두기
  rationale: 한국어 문장성 유지와 본문의 예언 도입 기능을 함께 살리기 위한 절충입니다.
  doctrine_reference: 문맥상 이어지는 직접 화법 표지
