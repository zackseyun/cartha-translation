  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֣ר לֹֽא לְקָחָ֗/ם נְבֽוּכַדְנֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל בַּ֠/גְלוֹת/וֹ אֶת יְכָונְיָ֨ה בֶן יְהוֹיָקִ֧ים מֶֽלֶךְ יְהוּדָ֛ה מִ/ירֽוּשָׁלִַ֖ם בָּבֶ֑לָ/ה וְ/אֵ֛ת כָּל חֹרֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/020.yaml
  text: which Nebuchadnezzar king of Babylon did not take when he exiled Jeconiah son of Jehoiakim[a], king of Judah, from Jerusalem to Babylon[c][b], along with all the nobles of Judah and Jerusalem.
  footnotes:
  - marker: a
    text: Or 'Jechoniah'; Hebrew 'Jeconiah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when he carried into exile.'
    reason: lexical_alternative
  - marker: c
    text: '''Nobles'' may also be rendered ''officials'' or ''leading men.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 바빌론 왕 느부갓네살이 예루살렘에서 바빌론으로 유다 왕 여호야김의 아들 여고냐를 사로잡아 갈 때에 데려가지 않은 것들입니다. 또한 유다와 예루살렘의 모든 귀족들도 그러했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여고냐’는 히브리어 인명 יְכָונְיָה의 통용 음역입니다. 영어 POB의 Jeconiah에 해당합니다.
    reason: source_note
  - marker: b
    text: 히브리어의 ‘포로로 잡아가다/유배시키다’에 해당하는 시간절 표현입니다.
    reason: source_note
  - marker: c
    text: ‘귀족들’은 ‘관리들’, ‘지도자들’, ‘유력자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לְקָחָם
  english_pob_choice: did not take
  chosen_korean: 사로잡아 가지 않았습니다
  alternatives_korean:
  - 데려가지 않았습니다
  - 끌고 가지 않았습니다
  lexicon: HALOT
  rationale: 포로로 끌려가는 문맥이므로 단순한 ‘가다’보다 강한 ‘사로잡아 가다’가 מקור의 강도를 더 잘 드러냅니다.
- source_word: בַּגְלוֹתוֹ
  english_pob_choice: when he exiled
  chosen_korean: 사로잡아 갈 때에
  alternatives_korean:
  - 포로로 잡아갈 때에
  - 유배시킬 때에
  lexicon: HALOT
  rationale: 히브리어 부정사구의 시간적 용법을 살려 사건 배경을 나타내되, גלה의 추방/포로화 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: יְכָונְיָה
  english_pob_choice: Jeconiah
  chosen_korean: 여고냐
  alternatives_korean:
  - 여고니야
  - 여고냐야
  lexicon: 전통적 성서 인명 관용
  rationale: 이 왕명은 한국어 성서에서 통용되는 음역을 따랐고, 같은 인물을 가리키는 여고냐/여고니야 변이 가능성은 주석으로 남기지 않아도 본문 이해에 무리가 없습니다.
- source_word: חֹרֵי
  english_pob_choice: nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 관리들
  - 지도자들
  - 유력자들
  lexicon: HALOT
  rationale: 왕실·정치 문맥에서의 신분층을 가장 직접적으로 드러내는 말이 ‘귀족들’이므로 이를 택했습니다.
theological_decisions:
- issue: 포로 이동의 서술을 ‘데려가지 않은 것들’로 둘지, ‘사로잡아 가지 않은 것들’로 둘지
  chosen_reading: 예루살렘에서 바빌론으로 끌려가는 포로 사건이라는 점을 분명히 하기 위해 ‘사로잡아 가지 않은 것들’이라고 옮겼습니다.
  alternative_readings:
  - 데려가지 않은 것들
  - 끌고 가지 않은 것들
  rationale: 문맥상 단순 이동이 아니라 심판으로서의 강제 이주를 말하므로, 포로화의 성격을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 예레미야 27장의 역사적 심판/포로 신학
