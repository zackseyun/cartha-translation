  to: 이는 바빌론 왕 느부갓네살이 유다 왕 여호야김의 아들 여고냐[a]와 유다와 예루살렘의 모든 귀족[c]을 예루살렘에서 바빌론으로 포로로 끌고 갈 때[b] 가져가지 않은 것들입니다.
