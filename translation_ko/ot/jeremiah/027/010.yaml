  rationale: 목적절을 거짓 예언 행위에 직접 연결하여 לְמַעַן의 목적 관계를 분명히 했고, 원문에 없는 역접 ‘그러나’를 제거했습니다. ‘멀어지게 하다’는 הַרְחִיק의 사역적 공간 분리를 유지하며, ‘내가’ 이하에서는 원문의 명시적 신적 행위와 그 결과를 그대로 보존했습니다. 각주 a도 본문 표현과 일치하도록 바로잡았습니다.
