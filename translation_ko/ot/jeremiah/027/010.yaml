id: JER.27.10
reference: Jeremiah 27:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֣ים לָ/כֶ֑ם לְמַ֨עַן הַרְחִ֤יק אֶתְ/כֶם֙ מֵ/עַ֣ל אַדְמַתְ/כֶ֔ם וְ/הִדַּחְתִּ֥י אֶתְ/כֶ֖ם וַ/אֲבַדְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/010.yaml
  text: For they are prophesying lies to you[a], in order to remove you from your land; and I will drive you out[c][b], and you will perish.
  footnotes:
  - marker: a
    text: Or 'falsehood' instead of 'a lie.'
    reason: lexical_alternative
  - marker: b
    text: Or 'send you far away from your land.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew shifts to explicit divine agency: ''and I will drive you out, and you will perish.'''
    reason: cross_reference
translation:
  language: ko
  text: 그들은 너희를 너희 땅에서 멀어지게 하려고 너희에게 거짓 예언을[a] 하고 있기 때문입니다[b]. 내가 너희를 쫓아낼 것이며[c], 너희는 멸망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓을 예언하고’라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희를 너희 땅에서 멀리 떠나게 하려고’라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 여기서 명시적인 1인칭 신적 행위로 전환합니다. 곧 ‘내가 너희를 쫓아낼 것이며, 너희는 멸망할 것입니다’라고 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי שֶׁקֶר
  english_pob_choice: they are prophesying lies
  chosen_korean: 거짓을 예언하고
  alternatives_korean:
  - 거짓말을 예언하고
  - 거짓된 말을 예언하고
  lexicon: HALOT
  rationale: שׁקר는 '거짓/속임'의 의미를 가지며, 예언 동작과 결합할 때 한국어에서는 '거짓을 예언하다'가 직접적이고 자연스럽습니다.
- source_word: נִבְּאִים לָכֶם
  english_pob_choice: are prophesying to you
  chosen_korean: 너희에게 ... 예언하고 있기 때문입니다
  alternatives_korean:
  - 너희에게 예언하고 있습니다
  - 너희를 향해 예언하고 있습니다
  lexicon: HALOT
  rationale: 니팔 분사형의 진행성을 살려 현재 진행적 표현으로 옮겼고, 대상 표지를 '너희에게'로 간결하게 유지했습니다.
- source_word: הַרְחִיק אֶתְכֶם מֵעַל אַדְמַתְכֶם
  english_pob_choice: remove you from your land
  chosen_korean: 너희를 너희 땅에서 멀리하게 하려는 것입니다
  alternatives_korean:
  - 너희를 너희 땅에서 떼어 놓으려는 것입니다
  - 너희를 너희 땅에서 떠나게 하려는 것입니다
  lexicon: HALOT
  rationale: הרחיק은 '멀리하게 하다/멀어지게 하다'의 사역형이므로, '멀리하게 하다'로 원문의 목적성을 살렸습니다. אַדמה는 이 맥락에서 '땅'이 가장 자연스럽습니다.
- source_word: וְהִדַּחְתִּי אֶתְכֶם
  english_pob_choice: and I will drive you out
  chosen_korean: 내가 너희를 쫓아낼 것이며
  alternatives_korean:
  - 내가 너희를 몰아낼 것이며
  - 내가 너희를 내쫓을 것이며
  lexicon: HALOT
  rationale: נדח의 사역형은 '몰아내다/쫓아내다'가 적절하며, 유배 맥락의 강한 추방 의미를 드러냅니다.
- source_word: וַאֲבַדְתֶּם
  english_pob_choice: and you will perish
  chosen_korean: 너희는 멸망할 것입니다
  alternatives_korean:
  - 너희는 망할 것입니다
  - 너희는 사라질 것입니다
  lexicon: HALOT
  rationale: אבד는 이 문맥에서 단순한 죽음보다 공동체적 파멸/멸망을 뜻하므로 '멸망하다'가 더 정확합니다.
theological_decisions:
- issue: 예언자들의 거짓과 하나님의 심판 행위의 구분
  chosen_reading: 거짓 예언은 예언자들의 행위로 제시되지만, 실제 추방과 멸망은 여호와의 직접적 심판 행위로 선포됩니다.
  alternative_readings:
  - 모든 문장을 하나의 동일한 행위 주체로 완화하는 읽기
  rationale: 히브리어는 לְמַעַן 뒤의 목적 표현과 וְהִדַּחְתִּי의 1인칭 신적 발화를 구분하므로, 번역도 이 긴장을 유지해야 합니다.
  doctrine_reference: 신적 주권과 인간 책임의 긴장 유지
