id: JER.27.15
reference: Jeremiah 27:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לֹ֤א שְׁלַחְתִּי/ם֙ נְאֻם יְהוָ֔ה וְ/הֵ֛ם נִבְּאִ֥ים בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר לְמַ֨עַן הַדִּיחִ֤/י אֶתְ/כֶם֙ וַ/אֲבַדְתֶּ֔ם אַתֶּ֕ם וְ/הַ/נְּבִאִ֖ים הַֽ/נִּבְּאִ֥ים לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/015.yaml
  text: For I did not send them[a], declares Yahweh, and they are prophesying falsely in my name, so that I may drive you out[b], and you will perish—you and the prophets who are prophesying to you.
  footnotes:
  - marker: a
    text: Or 'they are prophesying a lie in my name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that I may banish you'; the Hebrew verb can carry the sense of driving away or causing to be cast out.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 보내지 않았습니다. 야훼의 선언입니다. 그들은 내 이름으로 거짓을 예언하고 있습니다[a]. 이는 내가 너희를 쫓아내려는 것이며[b], 너희와 너희에게 예언하고 있는 예언자들은 망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 내 이름으로 거짓말을 하고 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 너희를 추방하려는 것’; 히브리어 동사는 쫓아내다, 몰아내다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 내가 그들을 보내지 않았습니다
  alternatives_korean:
  - 이는 내가 그들을 보내지 않았기 때문입니다
  - 내가 그들을 보내지 않았습니다
  lexicon: HALOT
  rationale: 원문은 앞 절의 경고를 설명하는 이유절로 시작하지만, 한국어에서는 바로 핵심 진술을 내세우고 뒤에 이유를 이어 주는 방식이 자연스럽습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식의 격식을 살리면서, 프로젝트 기본값에 따라 신적 이름 יְהוָה를 ‘야훼’로 옮겼습니다.
- source_word: נִבְּאִים ... לַשָּׁקֶר
  english_pob_choice: are prophesying falsely
  chosen_korean: 거짓을 예언하고 있습니다
  alternatives_korean:
  - 거짓되게 예언하고 있습니다
  - 거짓말을 예언하고 있습니다
  lexicon: HALOT
  rationale: ‘예언하다’에 목적어 없이 부사적으로만 처리하면 한국어가 어색하므로, מקור의 ‘לַשָּׁקֶר’를 ‘거짓을’로 풀어 의미를 직접 드러냈습니다.
- source_word: הַדִּיחִי
  english_pob_choice: drive you out
  chosen_korean: 쫓아내려는 것
  alternatives_korean:
  - 내쫓으려는 것
  - 추방하려는 것
  lexicon: HALOT
  rationale: 문맥이 포로기/추방 심판이므로 단순한 ‘유혹’이 아니라 ‘내쫓다, 쫓아내다’의 의미를 반영했습니다.
- source_word: וַאֲבַדְתֶּם
  english_pob_choice: you will perish
  chosen_korean: 망할 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 죽을 것입니다
  lexicon: HALOT
  rationale: 원문의 רחב한 파멸 의미를 살려 ‘망하다’를 택해, 단순 사망보다 더 넓은 심판의 결과를 표현했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타나는 신적 이름을 번역 관례가 아니라 음역으로 드러내어, 예언자 발화의 권위를 그대로 보이게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘내 이름으로’와 거짓 예언의 관계
  chosen_reading: 내 이름으로 거짓을 예언하고 있습니다
  alternative_readings:
  - 내 이름으로 거짓말하고 있습니다
  - 내 이름을 빙자하여 예언하고 있습니다
  rationale: 원문은 하나님의 이름을 도구화한 거짓 예언을 고발하므로, 단순한 일반 거짓말보다 예언 행위 자체의 왜곡을 드러냈습니다.
  doctrine_reference: 예언의 진위와 하나님의 이름을 망령되이 사용하는 문제
