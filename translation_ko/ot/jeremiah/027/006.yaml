id: JER.27.6
reference: Jeremiah 27:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת כָּל הָ/אֲרָצ֣וֹת הָ/אֵ֔לֶּה בְּ/יַ֛ד נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַבְדִּ֑/י וְ/גַם֙ אֶת חַיַּ֣ת הַ/שָּׂדֶ֔ה נָתַ֥תִּי ל֖/וֹ לְ/עָבְדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/006.yaml
  text: And now I have given all these lands into the hand of Nebuchadnezzar king of Babylon[a], my servant[b]; and I have also given him the beasts of the field to serve him.
  footnotes:
  - marker: a
    text: Or 'Nebuchadrezzar,' reflecting another common transliteration of the king's name.
    reason: lexical_alternative
  - marker: b
    text: '''My servant'' means that Nebuchadnezzar is being used as God''s instrument, not that he is morally approved.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 내가 이 모든 땅을 바빌론의 왕 느부갓네살, 곧 내 종의 손에 넘겨주었습니다. 그리고 들짐승들도 그에게 주어 그를 섬기게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 종’은 느부갓네살이 하나님께 도구로 쓰인다는 뜻이지, 그가 도덕적으로 승인되었다는 뜻은 아닙니다.
    reason: theological_note
  - marker: b
    text: ‘손에 넘겨주었습니다’는 히브리어 관용구로서 통치권과 지배권의 이양을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 새로운 신탁 선언을 여는 시간·담화 표지로서 한국어에서는 간결한 「이제」가 가장 자연스럽고, 이어지는 하나님의 선언성을 살립니다.
- source_word: נָתַתִּי אֶת כָּל הָאֲרָצוֹת הָאֵלֶּה בְּיַד
  english_pob_choice: have given all these lands into the hand of
  chosen_korean: 이 모든 땅을 ... 손에 넘겨주었습니다
  alternatives_korean:
  - 이 모든 땅을 ... 손에 주었습니다
  - 이 모든 땅을 ... 권세 아래 두었습니다
  lexicon: HALOT
  rationale: בְּיַד의 관용적 의미를 살리되, 한국어에서는 소유·지배권의 이양을 드러내는 「손에 넘겨주었습니다」가 가장 자연스럽습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 나의 종
  - 내 노예
  lexicon: HALOT
  rationale: 여기서는 하나님이 느부갓네살을 자신의 도구로 사용하신다는 뜻이 중심이므로, 사회적 신분보다 소명·도구성을 드러내는 「내 종」을 택했습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the beasts of the field
  chosen_korean: 들짐승들
  alternatives_korean:
  - 들의 짐승들
  - 들짐승과 들의 동물들
  lexicon: HALOT
  rationale: 히브리어의 포괄적 표현을 한국어에서 자연스럽게 옮기면서도 야생 동물을 가리키는 이미지가 유지되도록 「들짐승들」로 번역했습니다.
theological_decisions:
- issue: 느부갓네살을 '내 종'으로 부르는 표현
  chosen_reading: 하나님이 이방 왕을 자신의 주권 아래 있는 도구로 사용하신다는 선언으로 이해하고 그대로 옮겼습니다.
  alternative_readings:
  - 도덕적으로 승인된 종으로 오해할 수 있어 완화하는 해석
  - 단순히 '신하'로 약화하는 해석
  rationale: 본문은 바빌론 왕의 도덕적 평가가 아니라 하나님의 주권적 위임을 말하므로, 그 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 하나님의 주권, 예언적 심판 도구로서의 이방 통치자
