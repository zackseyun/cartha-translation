  source_fidelity: ‘그리고 이제’는 וְעַתָּה의 접속·시간 표지를 보존합니다. ‘내 종’과 들짐승이 그를 섬기도록 주어졌다는 내용도 히브리어의 의미를 충실히 반영합니다. 다만 기존 각주들은 영어 POB 감사 기록의 표지·내용과 일치하지 않고, 본문 끝에 함께 붙어 있어 해당 어구와의 연결이 불명확합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘손에 넘겨주었습니다’는 직역적 이미지를 유지하면서도 한국어에서 지배권의 이양을 명료하게 전달합니다.
  terminology: ‘바빌론’, ‘느부갓네살’, ‘내 종’, ‘들짐승’은 한국어 성서 문맥에서 통용되는 자연스러운 용어입니다. 이름의 다른 음역은 각주로 제시하여 본문 표기를 안정적으로 유지합니다.
