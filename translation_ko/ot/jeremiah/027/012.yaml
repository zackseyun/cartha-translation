base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
  footnotes:
  - marker: a
    text: Or, more literally, “Bring your necks into the yoke of the king of Babylon.”
    reason: lexical_alternative
  - marker: b
    text: '“And live” may also be understood consequentially: “and you will live” or “so that you may live.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 시드기야에게도 이 모든 말대로 말했습니다. “너희 목을 바벨론 왕의 멍에 아래에 두십시오.[a] 그와 그의 백성을 섬기고 사십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 목을 … 멍에 아래에 두십시오’는 더 문자적으로는 “너희 목을 바벨론 왕의 멍에 안으로 들이십시오”라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘섬기고 사십시오’의 마지막 표현은 결과적으로 “그러면 살게 될 것입니다” 또는 목적을 나타내어 “살기 위해”로도 이해될 수 있습니다.
    reason: lexical_alternative
