  - 그래야 삽니다
  lexicon: HALOT
  rationale: 영어 POB가 지적한 결과적 뉘앙스를 한국어에서 자연스럽게 드러내기 위해, 단순 명령형보다 결과를 내포한 미래 표현을 택했습니다.
