  english_pob_choice: I spoke all these words
  chosen_korean: 이 모든 말을 전하여 말했습니다
  alternatives_korean:
  - 이 모든 말을 말했습니다
  - 이 모든 말씀을 전했습니다
  lexicon: HALOT
  rationale: דבר의 ‘말하다’ 의미를 살리되, 뒤의 לֵאמֹר와 중복되지 않도록 ‘전하여 말했습니다’로 처리해 원문의 발화 행위를 분명히 했습니다.
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם בְּעֹל
  english_pob_choice: Bring your necks under the yoke
  chosen_korean: 너희 목을 … 멍에 아래에 두고
  alternatives_korean:
  - 너희 목을 멍에 안으로 들이고
  - 너희 목을 멍에에 들이고
  lexicon: HALOT
  rationale: 직역적 ‘bring’의 이미지를 한국어에서 자연스럽게 살리기 위해 ‘멍에 아래에 두다’로 옮겨, 굴복/복종의 비유를 유지했습니다.
- source_word: וְעִבְדוּ אֹתוֹ וְעַמּוֹ
  english_pob_choice: and serve him and his people
  chosen_korean: 그와 그의 백성을 섬기십시오
  alternatives_korean:
  - 그를 섬기고 그의 백성을 섬기십시오
  - 그와 그의 백종을 섬기십시오
  lexicon: HALOT
  rationale: עבד를 정치적 종속의 맥락에서 ‘섬기다’로 옮겨 직접성을 유지했고, עַם은 여기서 국가적 집단을 가리키므로 ‘백성’이 가장 무난합니다.
- source_word: וִחְיוּ
  english_pob_choice: and live
  chosen_korean: 그러면 살게 될 것입니다
  alternatives_korean:
