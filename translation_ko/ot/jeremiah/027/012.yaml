  text: וְ/אֶל צִדְקִיָּ֤ה מֶֽלֶךְ יְהוּדָה֙ דִּבַּ֔רְתִּי כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה לֵ/אמֹ֑ר הָבִ֨יאוּ אֶת צַוְּארֵי/כֶ֜ם בְּ/עֹ֣ל מֶֽלֶךְ בָּבֶ֗ל וְ/עִבְד֥וּ אֹת֛/וֹ וְ/עַמּ֖/וֹ וִֽ/חְיֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
  footnotes:
  - marker: a
    text: Or, more literally, “Bring your necks into the yoke of the king of Babylon.”
    reason: lexical_alternative
  - marker: b
    text: '“And live” may also be understood consequentially: “and you will live” or “so that you may live.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 시드기야에게 나는 이 모든 말을 전하여 말했습니다. “너희 목을 바벨론 왕의 멍에 아래에 두고, 그와 그의 백성을 섬기십시오. 그러면 살게 될 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 목을 … 멍에 아래에 두고’는 더 문자적으로는 “너희 목을 바벨론 왕의 멍에 안으로 들이고”라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그러면 살게 될 것입니다’는 “살아라”의 결과적 의미를 살린 번역으로, “살게 되십시오” 또는 “그래야 삽니다”로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  english_pob_choice: Zedekiah king of Judah
  chosen_korean: 유다 왕 시드기야
  alternatives_korean:
  - 유다의 왕 시드기야
  - 시드기야 유다 왕
  lexicon: standard transliteration
  rationale: 고유명사와 왕호를 현대 표기로 옮기되, 히브리어의 어순을 과도하게 고착하지 않고 자연스러운 한국어 어순으로 정리했습니다.
- source_word: דִּבַּרְתִּי כְּכָל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: I spoke all these words
  chosen_korean: 이 모든 말을 전하여 말했습니다
  alternatives_korean:
  - 이 모든 말을 말했습니다
  - 이 모든 말씀을 전했습니다
  lexicon: HALOT
  rationale: דבר의 ‘말하다’ 의미를 살리되, 뒤의 לֵאמֹר와 중복되지 않도록 ‘전하여 말했습니다’로 처리해 원문의 발화 행위를 분명히 했습니다.
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם בְּעֹל
  english_pob_choice: Bring your necks under the yoke
  chosen_korean: 너희 목을 … 멍에 아래에 두고
  alternatives_korean:
  - 너희 목을 멍에 안으로 들이고
  - 너희 목을 멍에에 들이고
  lexicon: HALOT
  rationale: 직역적 ‘bring’의 이미지를 한국어에서 자연스럽게 살리기 위해 ‘멍에 아래에 두다’로 옮겨, 굴복/복종의 비유를 유지했습니다.
- source_word: וְעִבְדוּ אֹתוֹ וְעַמּוֹ
  english_pob_choice: and serve him and his people
  chosen_korean: 그와 그의 백성을 섬기십시오
  alternatives_korean:
  - 그를 섬기고 그의 백성을 섬기십시오
  - 그와 그의 백종을 섬기십시오
  lexicon: HALOT
  rationale: עבד를 정치적 종속의 맥락에서 ‘섬기다’로 옮겨 직접성을 유지했고, עַם은 여기서 국가적 집단을 가리키므로 ‘백성’이 가장 무난합니다.
- source_word: וִחְיוּ
  english_pob_choice: and live
  chosen_korean: 그러면 살게 될 것입니다
  alternatives_korean:
  - 그리고 사십시오
  - 그래야 삽니다
  lexicon: HALOT
  rationale: 영어 POB가 지적한 결과적 뉘앙스를 한국어에서 자연스럽게 드러내기 위해, 단순 명령형보다 결과를 내포한 미래 표현을 택했습니다.
