  text: וְ/הַ/גּ֗וֹי אֲשֶׁ֨ר יָבִ֧יא אֶת צַוָּאר֛/וֹ בְּ/עֹ֥ל מֶֽלֶךְ בָּבֶ֖ל וַֽ/עֲבָד֑/וֹ וְ/הִנַּחְתִּ֤י/ו עַל אַדְמָת/וֹ֙ נְאֻם יְהוָ֔ה וַֽ/עֲבָדָ֖/הּ וְ/יָ֥שַׁב בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/011.yaml
  text: But the nation that brings its neck under the yoke of the king of Babylon and serves him[a], I will let remain on its own land, declares Yahweh[b], and it will till it and dwell in it.
  footnotes:
  - marker: a
    text: Or 'I will leave it on its land' or 'I will let it rest on its land.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'and it will work it,' that is, the land; alternatively, 'cultivate it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바빌론 왕의 멍에에 목을 내어 그를 섬기는 나라는, 내가 그 나라를 그 땅에 그대로 남겨 두겠다[a]. 야훼의 말씀입니다. 그 나라는 그 땅을 경작하고[b] 그곳에 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에서 쉬게 하겠다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 땅을 일할 것이다’이며, 곧 그 땅을 경작한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹי
  english_pob_choice: the nation
  chosen_korean: 그 나라
  alternatives_korean:
  - 그 민족
  - 그 나라 백성
  lexicon: HALOT
  rationale: 문맥이 바빌론에 대한 정치적 복종을 말하므로, 집단보다 정치적 실체를 드러내는 ‘나라’가 자연스럽습니다.
- source_word: יָבִיא אֶת צַוָּארוֹ בְּעֹל
  english_pob_choice: brings its neck under the yoke
  chosen_korean: 멍에 아래로 목을 들여
  alternatives_korean:
  - 목을 멍에 아래로 넣어
  - 멍에에 목을 내어
  lexicon: HALOT
  rationale: 히브리어의 신체적 비유를 살리면서 한국어로도 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: וַעֲבָדוֹ
  english_pob_choice: and serves him
  chosen_korean: 그를 섬기는
  alternatives_korean:
  - 그의 종이 되는
  - 그에게 복종하는
  lexicon: HALOT
  rationale: עבד의 정치적·봉신적 복종 의미를 고려해, 지나치게 종교적이거나 단순한 복종보다 ‘섬기다’가 더 넓고 자연스럽습니다.
- source_word: וְהִנַּחְתִּיו עַל אַדְמָתוֹ
  english_pob_choice: I will let remain on its own land
  chosen_korean: 내가 그 나라를 자기 땅에 그대로 두어 머물게 하겠다고
  alternatives_korean:
  - 그 땅에 두어 두겠다
  - 자기 땅에 남게 하겠다
  lexicon: HALOT
  rationale: ‘남기다/두다’의 의미를 살리면서, 약속의 결과가 지속적 거주임을 드러내도록 ‘머물게 하다’로 풀었습니다.
- source_word: וַעֲבָדָהּ
  english_pob_choice: and it will work it
  chosen_korean: 그 땅을 갈고
  alternatives_korean:
  - 그 땅을 일구고
  - 그 땅을 경작하고
  lexicon: HALOT
  rationale: 땅을 대상으로 한 עבד는 경작·농사짓기의 뜻이므로, 본문의 농경 이미지를 살리는 ‘갈다’가 적절합니다.
- source_word: וְיָשַׁב בָּהּ
  english_pob_choice: and dwell in it
  chosen_korean: 거기에서 살게 될 것입니다
  alternatives_korean:
  - 거기에서 거주하게 될 것입니다
  - 거기에서 머물게 될 것입니다
  lexicon: HALOT
  rationale: 예언 문맥에서 ‘거주하다’의 의미를 현대 한국어로 자연스럽게 옮겼습니다.
