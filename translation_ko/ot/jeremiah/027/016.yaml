  source_fidelity: 수정이 필요합니다. מוּשָׁבִים은 홉알 수동 분사이므로 초안의 ‘돌아옵니다’는 기물들이 스스로 돌아오는 것처럼 들려 수동·사역적 회복의 뜻을 충분히 살리지 못합니다. 또한 עַתָּה מְהֵרָה의 임박성은 ‘이제 곧’으로 자연스럽게 반영할 수 있습니다.
  naturalness: ‘야훼의 집 그릇들’은 현대 한국어에서 다소 어색하고 일상용 그릇으로 오해될 수 있습니다. ‘야훼의 집의 기물들’이 성전 물품이라는 문맥을 더 자연스럽고 정확하게 전달합니다. ‘그들은 너희에게 거짓을 예언하고 있습니다’도 가능하나 ‘거짓 예언을 하고 있습니다’가 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘제사장들’, ‘백성’, ‘예언자들’, ‘야훼’는 적절합니다. כְלֵי בֵית יְהוָה는 ‘야훼의 집의 기물들’로 옮겨 ‘집’의 표현을 보존하면서도 성전 기물을 가리키는 의미를 분명히 했습니다.
