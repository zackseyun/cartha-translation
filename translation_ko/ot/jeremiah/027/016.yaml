source:
  edition: WLC
  text: וְ/אֶל הַ/כֹּהֲנִים֩ וְ/אֶל כָּל הָ/עָ֨ם הַ/זֶּ֜ה דִּבַּ֣רְתִּי לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י נְבִֽיאֵי/כֶ֗ם הַֽ/נִּבְּאִ֤ים לָ/כֶם֙ לֵ/אמֹ֔ר הִנֵּ֨ה כְלֵ֧י בֵית יְהוָ֛ה מוּשָׁבִ֥ים מִ/בָּבֶ֖לָ/ה עַתָּ֣ה מְהֵרָ֑ה כִּ֣י שֶׁ֔קֶר הֵ֖מָּה נִבְּאִ֥ים לָ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/016.yaml
  text: 'And to the priests and to all this people I spoke[a], saying, “Thus says Yahweh: Do not listen to the words of your prophets who are prophesying to you, saying, ‘Behold, the vessels of the house of Yahweh are being brought back from Babylon now, quickly,’ for they are prophesying falsely to you.”'
  footnotes:
  - marker: a
    text: Or “are being returned from Babylon very soon.” The Hebrew says literally, “now, quickly,” emphasizing the immediacy claimed by the false prophets.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 제사장들과 이 모든 백성에게 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘너희에게 예언하며 “보십시오, 야훼의 집의 기물들이 이제 곧 바벨론에서 되돌려질 것입니다”[a]라고 말하는 너희 예언자들의 말을 듣지 마십시오. 그들은 너희에게 거짓 예언을 하고 있습니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘지금, 빨리’(עַתָּה מְהֵרָה)라고 하여, 거짓 예언자들이 주장한 임박성을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제관들
  lexicon: HALOT
  rationale: 성전 문맥의 구체적 복수 명사로서 ‘제사장들’이 가장 자연스럽고, 제도명보다 인물을 직접 가리키는 점을 살립니다.
- source_word: כָּל הָעָם הַזֶּה
  english_pob_choice: all this people
  chosen_korean: 이 모든 백성
  alternatives_korean:
  - 이 백성 모두
  - 이 모든 사람들
  lexicon: HALOT
  rationale: 히브리어의 집합적 ‘백성’과 지시어 ‘이’를 살리되, 한국어에서 자연스럽게 읽히도록 배열했습니다.
- source_word: דִּבַּרְתִּי לֵאמֹר
  english_pob_choice: I spoke, saying
  chosen_korean: 말하여 이르기를
  alternatives_korean:
  - 말하면서
  - 말하였습니다
  lexicon: HALOT
  rationale: 예언 서술의 형식적 연결을 유지하면서도 현대 한국어에서 과도하게 번역투가 되지 않도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학문적 전사인 ‘야훼’로 옮겼습니다.
- source_word: כְּלֵי בֵית יְהוָה
  english_pob_choice: the vessels of the house of Yahweh
  chosen_korean: 야훼의 집 그릇들
  alternatives_korean:
  - 야훼의 집의 기물들
  - 성전 그릇들
  lexicon: HALOT
  rationale: ‘그릇들’은 성전 예배 기구를 가리키는 직역에 가까우며, ‘집’을 따로 두어 원문의 결합을 유지했습니다.
- source_word: מוּשָׁבִים
  english_pob_choice: are being brought back
  chosen_korean: 돌아옵니다
  alternatives_korean:
  - 되돌려집니다
  - 다시 가져와집니다
  lexicon: HALOT
  rationale: 거짓 예언의 즉시성을 드러내는 현재형 진술로 자연스럽게 풀되, 수동적 복귀의 의미를 보존했습니다.
- source_word: עַתָּה מְהֵרָה
  english_pob_choice: now, quickly
  chosen_korean: 지금 곧
  alternatives_korean:
  - 지금 매우 빨리
  - 바로 지금
  lexicon: HALOT
  rationale: 두 부사를 한국어의 관용적 결합으로 옮겨, 임박성과 속도를 함께 드러냈습니다.
- source_word: שֶׁקֶר
  english_pob_choice: falsely / a lie
  chosen_korean: 거짓을
  alternatives_korean:
  - 거짓말을
  - 허위로
  lexicon: HALOT
  rationale: 예언 내용 자체가 거짓임을 드러내는 명사형으로 옮겨, 단순 부사보다 더 강하게 원문의 판단을 전달했습니다.
theological_decisions:
- issue: 지시된 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명 יְהוָה를 사용하므로, 프로젝트 기준에 따라 언약적 고유명을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 예언자의 거짓 예언에 대한 판단 표현
  chosen_reading: 그들은 너희에게 거짓을 예언하고 있습니다
  alternative_readings:
  - 그들은 너희에게 거짓으로 예언하고 있습니다
  - 그들은 너희에게 거짓말을 하고 있습니다
  rationale: שֶׁקֶר을 단순한 어조 부사로 약화시키지 않고, 예언 내용의 진위를 직접 부정하는 표현으로 보존했습니다.
  doctrine_reference: Jeremiah 27:16 source sense of שֶׁקֶר
