  to: 그분은 자신의 능력으로 땅을 만드셨고, 자신의 지혜로 세상을 세우셨으며, 자신의 이해로 하늘을 펼치셨습니다.
  rationale: 원문의 분사와 완료형들이 이루는 창조 진술의 병렬을 한국어 과거 서술로 유지했습니다. 한국어 관용에 맞추어 ‘하늘들’을 ‘하늘’로 고치고, 소유 재귀 표현을 ‘자신의’로 다듬었습니다. 원문과 영어 감사 기록에 제시된 분사의 현재적 가능성은 허용되는 번역 대안이지만, 이 본문의 과거형 선택을 변경할 필요는 없습니다.
