id: JER.10.12
reference: Jeremiah 10:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/012.yaml
  text: He made the earth by his power[a]; he established the world by his wisdom[b], and by his understanding he stretched out the heavens.
  footnotes:
  - marker: a
    text: Or 'He makes the earth by his power'; the Hebrew opens with a participle ('making/maker of'), which can be rendered with a present-like force, but here it is expressed as a past finite verb for natural English parallelism.
    reason: lexical_alternative
  - marker: b
    text: '''World'' translates Hebrew tevel, often referring to the inhabited or ordered world.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 자신의 능력으로 땅을 만드셨고, 자신의 지혜로 세상을 세우셨으며, 자신의 이해로 하늘을 펼치셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹשֵׂה אֶרֶץ
  english_pob_choice: He made the earth
  chosen_korean: 그분은 … 땅을 만드셨고
  alternatives_korean:
  - 그분은 … 땅을 만드시고
  - 그분은 … 땅의 만드시는 이시고
  lexicon: HALOT
  rationale: עֹשֵׂה는 분사형이지만, 시적 병렬 구조에서는 한국어에서 자연스러운 완료 서술로 옮기는 편이 본문의 진술성을 더 잘 살립니다. אֶרֶץ는 우주적 창조 문맥에서 ‘땅’보다 ‘earth’에 더 가까운 범주를 반영할 수 있지만, 한국어에서는 ‘땅’이 가장 자연스럽고 문맥상 세계 전체를 가리키는 표현으로 읽을 수 있습니다.
- source_word: בְּכֹחוֹ
  english_pob_choice: by his power
  chosen_korean: 자기의 능력으로
  alternatives_korean:
  - 자기의 힘으로
  - 자기의 권능으로
  lexicon: HALOT
  rationale: ב의 도구적 의미를 한국어 조사 ‘-으로’로 살렸고, כֹּחַ는 이 창조 문맥에서 ‘능력’이 가장 안정적인 대응어입니다. ‘권능’도 가능하지만 더 교회적·설교적 뉘앙스가 강해 문체를 과도하게 높일 수 있습니다.
- source_word: מֵכִין תֵּבֵל
  english_pob_choice: he established the world
  chosen_korean: 세상을 세우셨으며
  alternatives_korean:
  - 세계를 견고히 하셨으며
  - 거주하는 세상을 확립하셨으며
  lexicon: HALOT
  rationale: כון의 히필은 ‘세우다/확립하다’의 뜻이므로 ‘세우셨습니다’가 간결하면서도 원문의 창조·질서 부여 의미를 잘 드러냅니다. תֵּבֵל은 단순한 지구보다 질서 잡힌 세계를 가리키지만, 한국어에서는 ‘세상’이 가장 자연스럽고 과도한 설명을 피합니다.
- source_word: בְּחָכְמָתוֹ וּבִתְבוּנָתוֹ
  english_pob_choice: by his wisdom … and by his understanding
  chosen_korean: 자기의 지혜로 … 자기의 이해로
  alternatives_korean:
  - 자기의 지혜로 … 자기의 분별로
  - 자기의 지혜로 … 자기의 통찰로
  lexicon: HALOT
  rationale: חָכְמָה는 ‘지혜’가 직접적이며, תְּבוּנָה는 ‘이해’가 지혜와 구별되는 인지·분별의 뉘앙스를 비교적 잘 보존합니다. ‘통찰’이나 ‘분별’도 가능하지만, 본문의 대칭 구조에서는 ‘지혜/이해’가 가장 평행적입니다.
- source_word: נָטָה שָׁמַיִם
  english_pob_choice: he stretched out the heavens
  chosen_korean: 하늘들을 펼치셨습니다
  alternatives_korean:
  - 하늘을 펼치셨습니다
  - 하늘들을 넓히셨습니다
  lexicon: HALOT
  rationale: נטה는 창조 문맥에서 ‘펴다/늘이다’의 생생한 이미지가 중요하므로 ‘펼치셨습니다’로 옮겼습니다. שָׁמַיִם의 복수형을 반영해 ‘하늘들’로 두었고, 이는 히브리어 형태를 더 직접적으로 보여 줍니다.
theological_decisions:
- issue: 주어의 명시 여부
  chosen_reading: 원문에 없는 신명칭을 보태지 않고, 문맥상 지시되는 주체를 ‘그분’으로 받았습니다.
  alternative_readings:
  - 하나님은 …
  - 주님은 …
  rationale: 히브리어는 이 절에서 주어를 직접 반복하지 않고 술어로 이어 가므로, 한국어에서도 문맥상의 지시를 유지하는 것이 가장 가깝습니다. ‘하나님/주님’을 넣으면 본절 자체에 없는 호칭이 추가되어 문장 흐름이 바뀝니다.
  doctrine_reference: Translation philosophy §1, §5
