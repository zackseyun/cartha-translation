  - marker: a
    text: Or 'Gather up your goods from the land, O inhabitant of the siege.' The Hebrew allows renderings such as 'goods,' 'wares,' or 'bundle' for כִּנְעָתֵךְ, and the addressee may be expressed more literally as 'inhabitant' or 'one dwelling.'
