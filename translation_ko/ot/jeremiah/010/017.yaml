    text: 또는 ‘당신의 물건을 땅에서 거두어 챙기십시오, 포위된 곳에 사는 이여.’ 히브리어 כִּנְעָתֵךְ는 ‘물건’, ‘짐’, ‘꾸러미’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
