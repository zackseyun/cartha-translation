review_pass:
  verdict: revise
  source_fidelity: 전반적으로 우상의 무능을 말함, 운반됨, 걷지 못함, 해와 선을 행하지 못함으로 옮긴 것은 히브리어 본문에 충실합니다. 다만 נָשׂוֹא יִנָּשׂוּא의 강조된 수동 표현은 ‘반드시 들려서 옮겨져야 합니다’보다 ‘반드시 들어 옮겨야 합니다’가 현대 한국어에서 더 자연스럽고 분명합니다.
  naturalness: 초안은 이해 가능하나 ‘들려서 옮겨져야 합니다’는 수동 표현이 겹쳐 다소 부자연스럽습니다. 문장을 나누고 ‘걸을 수 없으므로 반드시 들어 옮겨야 합니다’로 하면 합쇼체의 현대적 문체와 논리 관계가 더 명료해집니다.
  terminology: ‘오이밭의 허수아비’, ‘해를 끼치다’, ‘선을 행하다’는 문맥과 격식에 적절합니다. 다만 b 각주는 본문에 이미 ‘선을 행하지도 못합니다’라고 직접 번역된 내용을 단순 반복할 뿐 유의미한 이문이나 대안을 제공하지 않으므로 제거하는 것이 좋습니다. a 각주는 어려운 히브리어 전체 표현을 설명하도록 다듬었습니다.
  issues:
  - severity: medium
    issue: ‘반드시 들려서 옮겨져야 합니다’의 표현
    rationale: 히브리어는 ‘반드시/틀림없이 운반된다’는 강조된 수동 의미이나, 한국어의 ‘들려서 옮겨지다’는 동작이 중복되어 어색합니다. ‘반드시 들어 옮겨야 합니다’가 같은 의미를 자연스럽게 전달합니다.
