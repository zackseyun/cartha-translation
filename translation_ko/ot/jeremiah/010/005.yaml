  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/תֹ֨מֶר מִקְשָׁ֥ה הֵ֨מָּה֙ וְ/לֹ֣א יְדַבֵּ֔רוּ נָשׂ֥וֹא יִנָּשׂ֖וּא כִּ֣י לֹ֣א יִצְעָ֑דוּ אַל תִּֽירְא֤וּ מֵ/הֶם֙ כִּי לֹ֣א יָרֵ֔עוּ וְ/גַם הֵיטֵ֖יב אֵ֥ין אוֹתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/005.yaml
  text: They are like a scarecrow in a cucumber field[a], and they cannot speak; they must be carried, because they cannot walk. Do not fear them, for they cannot do harm[b], nor can they do good.
  footnotes:
  - marker: a
    text: Or, 'like a post in a melon field.' The Hebrew image is difficult; many understand it as a field-scarecrow or upright post set in a vegetable garden.
    reason: lexical_alternative
  - marker: b
    text: Or simply, 'nor can they do good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 오이밭의 허수아비 같아서 말도 하지 못하며, 반드시 들려서 옮겨져야 합니다. 그들은 걸어 다닐 수도 없으니, 그들을 두려워하지 마십시오. 그들은 해를 끼치지도 못하고, 선을 행하지도 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오이밭’은 히브리어 מִקְשָׁה의 어려운 이미지를 자연스럽게 풀어 옮긴 것입니다. 문자적으로는 멜론/오이밭 또는 그 안의 기둥·허수아비를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘좋음을 행하다’라는 뜻이어서, ‘선을 행하다’ 또는 ‘좋은 일을 하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹמֶר מִקְשָׁה
  english_pob_choice: like a scarecrow in a cucumber field
  chosen_korean: 오이밭의 허수아비
  alternatives_korean:
  - 오이밭의 막대기
  - 참외밭의 기둥
  - 멜론밭의 기둥
  lexicon: HALOT
  rationale: תֹמֶר과 מִקְשָׁה는 문맥상 살아 있는 나무가 아니라 밭에 세운 직립물/허수아비 같은 이미지를 가리키므로, 한국어로는 자연스럽고 조롱의 뉘앙스를 살리는 ‘오이밭의 허수아비’가 가장 적절합니다.
- source_word: וְלֹא יְדַבֵּרוּ
  english_pob_choice: and they cannot speak
  chosen_korean: 말도 하지 못하며
  alternatives_korean:
  - 말하지도 않으며
  - 말할 수 없으며
  lexicon: HALOT
  rationale: 동작의 단순 부정이 아니라 능력 부재를 나타내므로 ‘하지 못하다’로 옮겨 무생물 우상에 대한 무능을 분명히 했습니다.
- source_word: נָשׂוֹא יִנָּשׂוּא
  english_pob_choice: they must be carried
  chosen_korean: 반드시 들려서 옮겨져야 합니다
  alternatives_korean:
  - 반드시 메어져야 합니다
  - 꼭 들고 가야 합니다
  lexicon: HALOT
  rationale: 부정사 절대형+미완료형의 강조를 한국어 의무 표현으로 살렸고, 우상이 스스로 움직이지 못해 남이 들어 옮겨야 한다는 뜻을 분명히 했습니다.
- source_word: כִּי לֹא יִצְעָדוּ
  english_pob_choice: because they cannot walk
  chosen_korean: 걸어 다닐 수도 없으니
  alternatives_korean:
  - 걸을 수 없으니
  - 걷지도 못하니
  lexicon: HALOT
  rationale: צעד의 보행 의미를 자연스러운 한국어로 풀어, 운반되어야 하는 무능의 이유를 바로 드러냈습니다.
- source_word: כִּי לֹא יָרֵעוּ
  english_pob_choice: for they cannot do harm
  chosen_korean: 해를 끼치지도 못하고
  alternatives_korean:
  - 악을 행하지도 못하고
  - 해하지도 못하고
  lexicon: HALOT
  rationale: רעע는 여기서 실제로 해를 입히는 능력의 부재를 가리키므로, ‘해를 끼치다’가 문맥상 가장 직접적입니다.
- source_word: וְגַם הֵיטֵיב אֵין אוֹתָם
  english_pob_choice: nor can they do good
  chosen_korean: 선을 행하지도 못합니다
  alternatives_korean:
  - 좋은 일도 하지 못합니다
  - 선도 행할 수 없습니다
  lexicon: HALOT
  rationale: ‘good’은 단순 호감이 아니라 선행/유익의 범주이므로 ‘선을 행하다’로 옮겨, 우상이 해와 선 모두에 대해 무능하다는 대칭을 유지했습니다.
theological_decisions:
- issue: 우상의 총체적 무능을 어떻게 드러낼지
  chosen_reading: 말하지도, 걷지도, 해를 끼치지도, 선을 행하지도 못하는 존재로 직설적으로 드러냈습니다.
  alternative_readings:
  - 단순한 현재 부정형으로 옮겨 ‘말하지 않는다’처럼 표현할 수 있음
  rationale: 예언자의 조롱은 우상이 살아 있는 신이 아니라 아무 능력도 없는 물체임을 강조하므로, 한국어에서도 ‘~하지 못하다’가 신학적 포인트를 가장 분명히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
