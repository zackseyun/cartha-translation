source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֶל דֶּ֤רֶךְ הַ/גּוֹיִם֙ אַל תִּלְמָ֔דוּ וּ/מֵ/אֹת֥וֹת הַ/שָּׁמַ֖יִם אַל תֵּחָ֑תּוּ כִּֽי יֵחַ֥תּוּ הַ/גּוֹיִ֖ם מֵ/הֵֽמָּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/002.yaml
  text: 'Thus says Yahweh: Do not learn the way of the nations[a], and do not be dismayed at the signs of the heavens, because the nations are dismayed at them.'
  footnotes:
  - marker: a
    text: Or 'Do not be dismayed by the signs of the heavens ... for the nations are dismayed by them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “이방 나라들의 방식을 배우지 말고, 하늘의 징조들을[a] 두려워하지 마십시오. 이방 나라들은 그것들을 두려워합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 징조들 때문에 두려워하지 마십시오. 이방 나라들은 그것들 때문에 두려워합니다.’
    reason: מִן can be understood as expressing the cause of the fear; the main text leaves this relation unmarked in idiomatic Korean.
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC + 프로젝트 기본 용례
  rationale: 원문이 언약명 יְהוָה를 직접 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮겨 신적 고유명을 드러냈습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언서의 정형 공식이므로 선언적·공적 어조를 살리되, 한국어 합쇼체로 자연스럽게 표현했습니다.
- source_word: דֶּרֶךְ הַגּוֹיִם
  english_pob_choice: the way of the nations
  chosen_korean: 이방 나라들의 길
  alternatives_korean:
  - 열방의 길
  - 민족들의 길
  lexicon: HALOT
  rationale: דֶּרֶךְ는 단순한 ‘길’보다 삶의 방식·관행을 가리키므로 이를 살렸고, גּוֹיִם은 후대적 뉘앙스의 ‘이방인’보다 예언문맥에 맞는 ‘이방 나라들’이 더 직접적입니다.
- source_word: מֵאֹתוֹת הַשָּׁמַיִם
  english_pob_choice: by the signs of the heavens
  chosen_korean: 하늘의 징조들로 인해
  alternatives_korean:
  - 하늘의 징조들 때문에
  - 하늘의 표징들로 인해
  lexicon: HALOT
  rationale: אֹתוֹת는 여기서 ‘표적’보다 점술적 ‘징조’에 가깝고, הַשָּׁמַיִם은 ‘하늘’이 가장 간결하고 자연스러워 ‘하늘의 징조들’로 옮겼습니다.
- source_word: תֵּחָתּוּ / יֵחַתּוּ
  english_pob_choice: be dismayed / are dismayed
  chosen_korean: 두려워하지 마십시오 / 두려워합니다
  alternatives_korean:
  - 겁내지 마십시오 / 겁냅니다
  - 당황하지 마십시오 / 당황합니다
  lexicon: HALOT
  rationale: חתת는 단순한 감정적 당혹보다 무너질 만큼의 भय·공포를 포함하므로, 본문 맥락에서 ‘두려워하다’가 가장 직접적으로 힘을 전달합니다.
theological_decisions:
- issue: ‘하늘의 징조들’에 대한 반응 금지의 번역 톤
  chosen_reading: 명령형을 직설적으로 유지해 점술적 천문 징조를 두려워하는 이방 관행을 금하는 예언적 경고로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘신경 쓰지 마십시오’로 약화
  - ‘놀라지 마십시오’로 완화
  rationale: 원문은 단순한 심리 상태가 아니라 우상적·점술적 징조 해석에 대한 금지이므로, 경고의 강도를 보존해야 합니다.
  doctrine_reference: 예언서의 우상숭배/점술 금지 맥락 (신 18장, 렘 10장 문맥)
