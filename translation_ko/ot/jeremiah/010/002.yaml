    text: 또는 ‘하늘의 징조들 때문에 두려워하지 마십시오. 이방 나라들은 그것들 때문에 두려워합니다.’
    reason: מִן can be understood as expressing the cause of the fear; the main text leaves this relation unmarked in idiomatic Korean.
