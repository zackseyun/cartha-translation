base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''And the LORD''; the conjunction may also be read simply as connective, but here it likely carries a contrast with the idols described in the surrounding context.'
    reason: alternative_reading
  - marker: b
    text: Or 'God of truth.' The phrase likely means 'the true God' in contrast to false gods.
    reason: lexical_alternative
  - marker: c
    text: Or 'the eternal King.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼는 참 하나님이십니다[a]. 그분은 살아 계신 하나님이시며 영원한 왕이십니다[b]. 그분의 진노로 땅이 떨며[c], 민족들은 그분의 격노를 견디지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고/그러나 야훼’입니다. 이 접속사는 단순한 연결로도 읽을 수 있으나, 문맥상 앞부분의 우상들과 대비되어 ‘그러나’로 옮길 수 있습니다. ‘참 하나님’은 ‘진리의 하나님’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘영원히 다스리시는 왕’입니다. 히브리어 עוֹלָם은 지속성과 영구성을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘땅이 흔들립니다.’ 히브리어 רעשׁ는 흔들리거나 떠는 동작을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
