base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''And the LORD''; the conjunction may also be read simply as connective, but here it likely carries a contrast with the idols described in the surrounding context.'
    reason: alternative_reading
  - marker: b
    text: Or 'God of truth.' The phrase likely means 'the true God' in contrast to false gods.
    reason: lexical_alternative
  - marker: c
    text: Or 'the eternal King.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼는 참 하나님이십니다[a]. 그는 살아 계신 하나님이시며 영원한 왕이십니다[b]. 그의 진노 앞에서 땅이 떨고[c], 민족들은 그의 격분을 견디지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고/그러나 야훼’입니다. 문맥상 앞부분의 우상들에 대한 대비가 강해 ‘그러나’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘영원한 왕’입니다. עוֹלָם은 지속성과 영구성을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘땅이 떱니다.’ רעשׁ는 흔들리거나 떨리는 동작을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: But Yahweh
  chosen_korean: 그러나 야훼는
  alternatives_korean:
  - 그리고 야훼는
  - 그런데 야훼는
  lexicon: WLC + POB audit trail
  rationale: 문맥상 우상들과의 대조가 강하므로, 접속의 단순 연결보다 역접을 살린 ‘그러나’가 소스의 수사적 대비를 잘 반영합니다.
- source_word: אֱלֹהִים אֱמֶת
  english_pob_choice: the true God
  chosen_korean: 참 하나님
  alternatives_korean:
  - 진리의 하나님
  - 진실한 하나님
  lexicon: HALOT
  rationale: ב적절히 속성적·서술적으로 이해하여 ‘참 하나님’으로 옮기면, 거짓 신들과의 대조가 한국어에서도 자연스럽고 분명하게 드러납니다.
- source_word: אֱלֹהִים חַיִּים
  english_pob_choice: the living God
  chosen_korean: 살아 계신 하나님
  alternatives_korean:
  - 생생한 하나님
  - 살아 있는 하나님
  lexicon: HALOT
  rationale: 하나님의 생명성과 우상들의 무생성을 대비하는 관용적 표현이므로, 한국어 성경에서 자연스러운 ‘살아 계신 하나님’을 선택했습니다.
- source_word: וּמֶלֶךְ עוֹלָם
  english_pob_choice: the everlasting King
  chosen_korean: 영원한 왕
  alternatives_korean:
  - 영속하시는 왕
  - 항상 계신 왕
  lexicon: HALOT
  rationale: עוֹלָם의 지속·영구성을 한국어에서 가장 직접적으로 전달하는 표현은 ‘영원한’이며, 왕권의 지속성을 함께 살립니다.
- source_word: מִקִּצְפּוֹ
  english_pob_choice: At his wrath
  chosen_korean: 그의 진노 앞에서
  alternatives_korean:
  - 그의 진노로
  - 그의 분노 때문에
  lexicon: HALOT
  rationale: מִן의 원인/발출 뉘앙스를 한국어에서 단순 원인보다 더 장중하게 드러내기 위해 ‘앞에서’를 택해, 하나님의 진노 앞에 피조세계가 반응하는 그림을 살렸습니다.
- source_word: זַעְמוֹ
  english_pob_choice: his indignation
  chosen_korean: 그의 격분
  alternatives_korean:
  - 그의 진노
  - 그의 분노
  - 그의 격노
  lexicon: HALOT
  rationale: זַעַם의 강한 심판적 분노를 ‘격분’으로 옮기면, 단순 감정어보다 더 강하고 공적이며 위협적인 뉘앙스가 살아납니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 언약 이름을 보존하기 위해 학술적 음역인 ‘야훼’를 사용했습니다. 이 절은 우상들과의 대조 속에서 고유한 하나님의 이름을 드러내므로, 일반 호칭으로 완화하지 않았습니다.
  doctrine_reference: POB contested terms — יהוה/YHWH → 야훼
- issue: 절 머리의 וַ- 접속사
  chosen_reading: 그러나
  alternative_readings:
  - 그리고
  - 또
  rationale: 문맥상 앞선 우상 비판과의 강한 대비를 전달하는 것이 핵심이므로, 단순 연결보다 역접을 택했습니다. 이는 원문에 없는 내용을 더하는 것이 아니라 담화 흐름을 한국어로 재현하는 선택입니다.
  doctrine_reference: 'POB translation philosophy: optimal-equivalence'
