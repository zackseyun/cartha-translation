  rationale: ב적절히 속성적·서술적으로 이해하여 ‘참 하나님’으로 옮기면, 거짓 신들과의 대조가 한국어에서도 자연스럽고 분명하게 드러납니다.
- source_word: אֱלֹהִים חַיִּים
  english_pob_choice: the living God
  chosen_korean: 살아 계신 하나님
  alternatives_korean:
  - 생생한 하나님
