  terminology: ‘우상’은 הֲבָלִים의 예언서적 용법을 문맥상 적절하게 풀어 낸 것이며, ‘교훈’은 מוּסַר에 적합합니다. ‘나무입니다’는 עֵץ הוּא의 짧고 조롱적인 단정을 과장 없이 재현합니다.
