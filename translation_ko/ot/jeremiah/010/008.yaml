id: JER.10.8
reference: Jeremiah 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/אַחַ֖ת יִבְעֲר֣וּ וְ/יִכְסָ֑לוּ מוּסַ֥ר הֲבָלִ֖ים עֵ֥ץ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/008.yaml
  text: But together they are stupid and foolish[b][a]; the instruction of idols is wood.
  footnotes:
  - marker: a
    text: Or 'And as one they are brutish and foolish'; the opening phrase is idiomatic and may mean 'together,' 'all alike,' or 'in one thing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'vanities'; in this context, a common prophetic term for idols or worthless things.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 함께[a] 어리석고 우매합니다. 우상[b]의 교훈은 나무입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 표현은 관용적이어서 ‘함께’, ‘한결같이’, 또는 ‘한 가지 점에서’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 הבלים은 문자적으로는 ‘헛것들’ 또는 ‘허무한 것들’이지만, 이 문맥에서는 우상을 가리키는 흔한 예언자적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחַ֖ת
  english_pob_choice: But together
  chosen_korean: 그들은 함께
  alternatives_korean:
  - 그리고 한마음으로
  - 하지만 한결같이
  - 하지만 함께
  lexicon: HALOT
  rationale: 관용적 표현으로서 ‘한꺼번에/함께’의 집단적 동일성을 살리되, 앞절과의 대비를 고려해 문맥상 ‘그들은 함께’로 자연스럽게 옮겼습니다.
- source_word: יִבְעֲר֣וּ
  english_pob_choice: they are stupid
  chosen_korean: 어리석고
  alternatives_korean:
  - 우둔하고
  - 짐승같고
  - 무지하고
  lexicon: HALOT
  rationale: בער의 ‘우둔하다, 어리석다’는 뜻을 반영했습니다. 한국어에서는 앞의 ‘함께’ 뒤에 형용사형으로 두어 병렬성을 유지했습니다.
- source_word: וְ/יִכְסָל֑וּ
  english_pob_choice: and foolish
  chosen_korean: 우매합니다
  alternatives_korean:
  - 어리석습니다
  - 둔합니다
  - 미련합니다
  lexicon: HALOT
  rationale: כסל의 ‘어리석다’는 의미를 살리되, 현대 한국어에서 ‘우매하다’가 문맥상 더 강한 조롱과 병행성을 드러냅니다.
- source_word: מוּסַ֥ר הֲבָלִ֖ים
  english_pob_choice: the instruction of idols
  chosen_korean: 우상의 교훈
  alternatives_korean:
  - 헛것의 교훈
  - 우상들의 훈계
  - 헛된 것들의 가르침
  lexicon: HALOT
  rationale: הבלים는 예언서에서 우상을 가리키는 관용적 표현이므로, 독자가 대상이 무엇인지 바로 알 수 있도록 ‘우상’으로 풀었습니다. מוסר은 여기서 ‘가르침/교훈’의 뜻이 자연스럽습니다.
- source_word: עֵ֥ץ הֽוּא
  english_pob_choice: is wood
  chosen_korean: 나무입니다
  alternatives_korean:
  - 목재입니다
  - 나무 조각입니다
  - 그저 나무입니다
  lexicon: HALOT
  rationale: 히브리어의 짧고 단정한 결말을 살려 ‘나무입니다’로 직설적으로 옮겼습니다. ‘그저’ 같은 강조어는 본문 이상의 해설이 될 수 있어 뺐습니다.
theological_decisions:
- issue: 우상 비판의 마지막 절이 무엇을 가리키는가
  chosen_reading: ‘우상의 교훈’은 실제로 아무 생명도 없는 목재에 불과하다는 조롱으로 읽었습니다.
  alternative_readings:
  - 우상 자체가 가르치는 존재라는 뜻
  - ‘교훈’이 ‘헛됨’이라는 형용사적 표현이라는 뜻
  rationale: 문맥(예레미야 10:1–9)의 우상 풍자를 따라, 히브리어의 압축된 표현을 과도하게 확장하지 않고 본문이 의도한 조롱의 힘을 보존했습니다.
  doctrine_reference: 우상 비판 / 예레미야의 반우상 신학
