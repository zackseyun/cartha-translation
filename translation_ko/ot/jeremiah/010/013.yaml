id: JER.10.13
reference: Jeremiah 10:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּעֲלֶ֥ה נְשִׂאִ֖ים מִ/קְצֵ֣ה ארץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יּ֥וֹצֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/013.yaml
  text: At the sound of his voice[a], there is a roar of waters in the heavens, and he makes clouds rise from the ends of the earth; he makes lightning for the rain[b], and brings out the wind from his storehouses.
  footnotes:
  - marker: a
    text: Or 'clouds' could be rendered 'vapors' or 'mists.'
    reason: lexical_alternative
  - marker: b
    text: Or 'At the voice of his giving, a multitude of waters is in the heavens'; the Hebrew idiom is compressed and is commonly rendered more idiomatically in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 음성이 들릴 때 하늘의 물들이 굉음을 내고, 그는 땅 끝에서 구름을 올라오게 하시며, 비를 위하여 번개를 만드시고, 그의 여러 저장고에서 바람을 내보내십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  english_pob_choice: At the sound of his voice
  chosen_korean: 그의 음성에 따라
  alternatives_korean:
  - 그의 목소리의 소리에
  - 그의 음성의 울림에 따라
  - 그의 말씀하심에 따라
  lexicon: HALOT
  rationale: 히브리어의 압축된 관용구를 한국어에서 자연스럽게 풀어, 인격적 발화가 자연 현상을 일으킨다는 점을 살리면서도 문장을 과도하게 문자화하지 않았습니다.
- source_word: הֲמוֹן מַיִם בַּשָּׁמַיִם
  english_pob_choice: a roar of waters in the heavens
  chosen_korean: 하늘에 있는 물들의 소리
  alternatives_korean:
  - 하늘의 물들의 요란한 소리
  - 하늘에 있는 물들의 굉음
  - 하늘에 있는 물들의 소란
  lexicon: HALOT
  rationale: הֲמוֹן은 ‘무리’만이 아니라 ‘요란한 소리, 소동’의 뜻을 가지므로, 물의 양보다 소리의 울림을 드러내는 쪽으로 옮겼습니다.
- source_word: נְשִׂאִים
  english_pob_choice: clouds
  chosen_korean: 구름
  alternatives_korean:
  - 구름 떼
  - 안개
  - 수증기
  lexicon: HALOT
  rationale: 기상 문맥에서 נְשִׂאִים은 구름이나 수증기 덩어리를 가리킬 수 있지만, 현대 한국어에서는 ‘구름’이 가장 자연스럽고 본문의 폭풍 연쇄와도 잘 맞습니다.
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  english_pob_choice: he makes lightning for the rain
  chosen_korean: 비를 위한 번개를 만드시고
  alternatives_korean:
  - 비를 위해 번개를 만드시고
  - 비를 위한 번갯불을 만드시고
  - 비와 함께 번개를 만드시고
  lexicon: HALOT
  rationale: לַמָּטָר의 목적/관계 표지를 살려 ‘비를 위한’으로 옮겼고, בְּרָקִים은 복수형이지만 한국어에서는 자연스럽게 단수 일반명사로 처리했습니다.
- source_word: מֵאֹצְרֹתָיו
  english_pob_choice: from his storehouses
  chosen_korean: 자기 저장고에서
  alternatives_korean:
  - 자기 곳간에서
  - 자기 창고에서
  - 자기 보화고에서
  lexicon: HALOT
  rationale: אֹצָר는 단순한 보관소라기보다 저장된 것을 꺼내는 장소를 뜻하므로, 자연현상을 간직한 곳이라는 이미지를 살려 ‘저장고’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접적 자연 통치와 인격적 행위 표현
  chosen_reading: 비와 바람과 번개를 하나님이 직접 다루시는 인격적 주권을 유지했습니다.
  alternative_readings:
  - 비인격적 기상 현상 묘사로 약화하기
  - 자연법칙의 작동으로 일반화하기
  rationale: 본문은 날씨를 단순한 자연 현상이 아니라 하나님의 음성과 행위에 직접 연결하므로, 동사의 주어와 행위를 분명히 드러내는 번역이 원문의 신학을 보존합니다.
  doctrine_reference: 섭리론; 창조주 하나님의 통치
- issue: רוּחַ의 의미
  chosen_reading: 문맥상 ‘바람’으로 번역했습니다.
  alternative_readings:
  - 영으로 번역하기
  - 숨결로 번역하기
  rationale: 같은 어휘라도 이 절은 기상 묘사 속에 있으므로, ‘영’으로 일반화하지 않고 문맥이 요구하는 자연 현상으로 옮기는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 문맥 우선 원칙
