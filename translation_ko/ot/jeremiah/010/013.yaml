  to: 그의 음성이 들릴 때 하늘의 물들이 굉음을 내고, 그는 땅 끝에서 구름을 올라오게 하시며, 비를 위하여 번개를 만드시고, 그의 여러 저장고에서 바람을 내보내십니다.
  rationale: 원문의 압축된 첫 구절은 영어 POB의 선택을 따라 하나님의 음성과 물의 굉음을 연결하되, 한국어에서는 시간적 연결을 명확히 했습니다. ‘굉음’으로 הֲמוֹן의 청각적 의미를 살리고, 하나님의 직접적 행위와 기상 현상의 병렬을 유지했습니다. 본문만으로 충분히 전달되므로 논쟁적 대안에 관한 각주는 추가하지 않았습니다.
