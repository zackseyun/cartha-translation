  naturalness: 수정문은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘기업’은 성경 문맥에서 ‘유산/소유’의 뜻으로 쓰이는 전통적 용례이므로 유지하되, 각주에서 그 귀속 의미를 밝혔습니다.
