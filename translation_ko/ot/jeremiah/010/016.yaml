id: JER.10.16
reference: Jeremiah 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲקֹ֗ב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/יִ֨שְׂרָאֵ֔ל שֵׁ֖בֶט נַֽחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/016.yaml
  text: Not like these is the Portion of Jacob[a], for he is the Former of all things, and Israel is the tribe of his inheritance[b]; Yahweh of hosts is his name.
  footnotes:
  - marker: a
    text: Or 'Jacob’s portion.' The Hebrew phrase can be rendered either way; the sense is that the God of Israel is not like the idols just described.
    reason: lexical_alternative
  - marker: b
    text: Or 'Israel is the scepter/rod of his inheritance.' The Hebrew word can mean 'tribe,' 'rod,' or 'scepter'; 'tribe' best fits the reference to Israel as the people belonging to the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 야곱의 몫[a]은 그것들과 같지 않습니다. 그분은 만물을 빚으신 분이시며, 이스라엘은 그의 기업의 지파[b]입니다. 그의 이름은 만군의 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 몫이신 분’. 히브리어 표현은 ‘야곱의 몫’ 또는 ‘야곱의 몫이신 분’으로 옮길 수 있습니다. 여기서는 앞서 언급된 우상들과 대조되어, 하나님이 야곱에게 주어진 몫이심을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지파’는 ‘막대기’ 또는 ‘홀’로도 번역될 수 있습니다. 그러나 여기서는 이스라엘이 그분의 유산, 곧 그분께 속한 백성이라는 문맥에 ‘지파’가 가장 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  english_pob_choice: Not like these
  chosen_korean: 그것들과 같은 것은
  alternatives_korean:
  - 이것들과 같은 것은
  - 그것들과 같지 않습니다
  lexicon: HALOT
  rationale: 바로 앞 문맥의 우상들을 가리키는 대상을 한국어로 자연스럽게 되받으면서, 비교 부정을 분명히 드러냈습니다.
- source_word: חֵלֶק יַעֲקֹב
  english_pob_choice: the Portion of Jacob
  chosen_korean: 야곱의 몫
  alternatives_korean:
  - 야곱의 분깃
  - 야곱의 몫이신 분
  lexicon: HALOT
  rationale: חֵלֶק의 기본 의미를 살려 ‘몫’으로 옮기되, POB의 문맥상 하나님을 야곱에게 주어진 몫이라는 뜻을 유지했습니다.
- source_word: יוֹצֵר הַכֹּל
  english_pob_choice: the Former of all things
  chosen_korean: 만물을 지으신 분이시며
  alternatives_korean:
  - 만물을 빚으신 분이시며
  - 만물의 조성자이시며
  lexicon: HALOT
  rationale: יוֹצֵר의 형성·빚음 이미지를 살리되, 한국어에서는 ‘지으신 분’이 가장 자연스럽고 창조 주체의 뜻을 충분히 전달합니다.
- source_word: שֵׁבֶט נַחֲלָתוֹ
  english_pob_choice: the tribe of his inheritance
  chosen_korean: 그의 기업의 지파입니다
  alternatives_korean:
  - 그의 기업의 막대기입니다
  - 그의 기업의 홀입니다
  lexicon: HALOT
  rationale: 문맥에서 이스라엘이 주어이므로 שֵׁבֶט을 ‘지파’로 옮겨 언약 백성의 의미를 살렸습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 야훼 만군
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 야훼
  lexicon: HALOT
  rationale: 여호와 대체어를 쓰지 않고 신명기적 고유명 ‘야훼’를 보존했으며, צְבָאוֹת은 관용적으로 ‘만군’으로 옮겼습니다.
theological_decisions:
- issue: ‘야곱의 몫’의 신학적 함의
  chosen_reading: 하나님이 야곱/이스라엘에게 속한 분이자 그들의 몫이라는 언약적 대비를 드러냅니다.
  alternative_readings:
  - ‘야곱이 얻는 몫’처럼 단순 소유 개념으로만 읽을 수 있습니다.
  rationale: 바로 뒤의 우상들과의 대비 속에서, 이 표현은 추상적 소유가 아니라 언약적 귀속과 선택의 진술로 읽는 것이 문맥에 더 맞습니다.
  doctrine_reference: 언약 백성과 야훼의 상호 귀속
