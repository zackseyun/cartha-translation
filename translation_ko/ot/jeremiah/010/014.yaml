id: JER.10.14
reference: Jeremiah 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צוֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/014.yaml
  text: Every man is stupid[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is a lie[c][b], and there is no breath in them.
  footnotes:
  - marker: a
    text: Or 'Every person is brutish for lack of knowledge.' The Hebrew can be rendered more formally with 'brutish' and the preposition may be taken causally ('for lack of knowledge').
    reason: lexical_alternative
  - marker: b
    text: Or 'his molten image is falsehood.'
    reason: lexical_alternative
  - marker: c
    text: '''Breath'' may also be rendered ''spirit''; the point is that the idols have no life in them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 사람이 지각이 없고 지식이 없습니다. 모든 금속 세공인은 자기 우상 때문에 수치를 당합니다. 그의 부어 만든 형상은 거짓이며, 그들 안에는 숨결이 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지각이 없다’는 ‘brutish’의 현대적 대응으로, 단순한 무지가 아니라 분별력 상실을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부어 만든 형상’은 문자적으로는 ‘그의 주조한/부어 만든 우상’에 해당합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘숨결’은 ‘영’으로도 옮길 수 있으나, 여기서는 우상의 무생명성을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  english_pob_choice: is stupid
  chosen_korean: 지각이 없고
  alternatives_korean:
  - 우둔하고
  - 어리석고
  - 짐승 같습니다
  lexicon: HALOT
  rationale: בער의 니팔은 단순한 정보 부족이 아니라 분별력 없는 우둔함을 뜻하므로, 현대 한국어에서는 ‘지각이 없다’가 그 의미를 과도하게 거칠지 않게 살립니다.
- source_word: כָּל אָדָם
  english_pob_choice: Every man
  chosen_korean: 모든 사람이
  alternatives_korean:
  - 모든 인류가
  - 모두가
  - 모든 남자가
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 대표 표현을 한국어에서 자연스럽게 살리되, 성별을 불필요하게 좁히지 않기 위해 ‘모든 사람이’로 옮겼습니다.
- source_word: צוֹרֵף
  english_pob_choice: metalworker
  chosen_korean: 금속 세공인
  alternatives_korean:
  - 쇠붙이 장인
  - 대장장이
  - 연금하는 사람
  lexicon: HALOT
  rationale: 문맥상 우상 제작에 관여하는 장인을 가리키므로, ‘금속 세공인’이 기능과 범위를 가장 무난하게 드러냅니다.
- source_word: נִסְכּוֹ
  english_pob_choice: his cast image
  chosen_korean: 그의 부어 만든 형상
  alternatives_korean:
  - 그의 주조한 형상
  - 그의 부어 만든 우상
  - 그의 주조상
  lexicon: HALOT
  rationale: ‘부어 만든’은 주조·주입의 이미지를 살리면서 한국어 성경문체에 자연스럽고, ‘형상’은 פֶּסֶל과 נִסְכּוֹ의 우상적 대상성을 함께 담습니다.
- source_word: וְלֹא רוּחַ בָּם
  english_pob_choice: and there is no breath in them
  chosen_korean: 그들 안에는 숨결이 없습니다
  alternatives_korean:
  - 그들 안에는 영이 없습니다
  - 그들 안에는 생기가 없습니다
  - 그들 속에는 숨이 없습니다
  lexicon: HALOT
  rationale: 루아흐는 여기서 우상의 무생명성을 강조하므로 ‘숨결’이 생명 부재를 가장 직접적으로 드러내며, ‘그들’은 앞의 형상들을 복수로 받습니다.
theological_decisions:
- issue: 우상 비판의 범위
  chosen_reading: 이 절은 우상이 생명이 없는 인간의 산물임을 고발하며, ‘모든 사람’과 ‘모든 금속 세공인’은 그 우상 숭배 맥락 안에서 읽어야 합니다.
  alternative_readings:
  - 모든 인류에 대한 일반적 형이상학적 진술로 읽을 수 있음
  rationale: 문맥은 지혜 결핍의 보편성보다 우상 제작과 그 수치에 초점을 두고 있으므로, 본문의 예언적 풍자를 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 허용하는 범위를 넘어 일반 교리를 확대하지 않음.
