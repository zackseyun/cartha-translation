  terminology: ‘민족들의 왕이시여’와 ‘두려워하지 않겠습니까?’는 적절합니다. ירא의 강한 의미를 보존하면서 수사 의문문의 당위도 전달합니다. ‘모든 왕국’은 מַלְכוּתָם에 더 가깝습니다.
