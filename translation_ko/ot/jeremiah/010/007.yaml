id: JER.10.7
reference: Jeremiah 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֣י לֹ֤א יִֽרָאֲ/ךָ֙ מֶ֣לֶךְ הַ/גּוֹיִ֔ם כִּ֥י לְ/ךָ֖ יָאָ֑תָה כִּ֣י בְ/כָל חַכְמֵ֧י הַ/גּוֹיִ֛ם וּ/בְ/כָל מַלְכוּתָ֖/ם מֵ/אֵ֥ין כָּמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/007.yaml
  text: Who would not fear you[a], O King of the nations? For this is your due; for among all the wise men of the nations and in all their kingdoms[b], there is none like you.
  footnotes:
  - marker: a
    text: Or 'Who should not fear you ... ?' The Hebrew rhetorical question can express either what would happen or what is proper.
    reason: lexical_alternative
  - marker: b
    text: Or 'it is due to you' / 'it befits you.' The sense is that such fear rightly belongs to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 민족들의 왕이시여, 누가 주님을 두려워하지 않겠습니까? 이는 주님께 마땅한 일입니다. 이는 모든 민족의 모든 지혜로운 사람들과 그들의 모든 나라 가운데 주님과 같은 이가 없기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 주님을 두려워해야 하겠습니까?’ 히브리어 수사 의문문은 실제 상태나 마땅한 태도 둘 다를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것은 주님께 마땅합니다’ / ‘주님께 합당합니다.’ 뜻은 이런 두려움이 마땅히 그분께 속한다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי לֹא יִרָאֲךָ
  english_pob_choice: Who would not fear you
  chosen_korean: 누가 주님을 두려워하지 않겠습니까?
  alternatives_korean:
  - 누가 주님을 경외하지 않겠습니까?
  - 누가 주님을 두려워하지 않을 수 있겠습니까?
  lexicon: HALOT
  rationale: 수사 의문문을 한국어에서도 그대로 살려, 행위의 당연성과 반문을 함께 드러냈습니다. ירא의 기본값인 ‘두려워하다’를 유지하되, 문맥상 하나님께 대한 경외를 포함할 수 있습니다.
- source_word: מֶלֶךְ הַגּוֹיִם
  english_pob_choice: King of the nations
  chosen_korean: 민족들의 왕이시여
  alternatives_korean:
  - 나라들의 왕이시여
  - 민족들의 왕
  lexicon: HALOT
  rationale: ‘왕 of the nations’이라는 칭호를 직역에 가깝게 살리되, 호칭형으로 자연스럽게 옮겼습니다. 여기서 גוים는 ‘민족들’이 한국어에서 더 원문 구조를 잘 드러냅니다.
- source_word: יָאָתָה
  english_pob_choice: this is your due
  chosen_korean: 이는 주님께 마땅한 일입니다
  alternatives_korean:
  - 이는 주님께 합당한 일입니다
  - 이는 주님께 속한 몫입니다
  lexicon: HALOT
  rationale: 이 동사는 ‘마땅하다/합당하다’의 의미를 가지므로, 영어 POB의 ‘this is your due’를 한국어의 자연스러운 관용으로 옮겼습니다. 단순히 ‘당연합니다’로 하면 경외의 논지가 약해집니다.
- source_word: כִּי ... כִּי
  english_pob_choice: For ... for ...
  chosen_korean: 이는 ... 때문입니다
  alternatives_korean:
  - 왜냐하면 ...
  - 이는 ... 이므로
  lexicon: HALOT
  rationale: 두 개의 כִּי 절을 한국어에서 인과 관계로 분명히 보여 주되, 문장의 논증 흐름이 끊기지 않도록 연결했습니다.
- source_word: מֵאֵין כָּמוֹךָ
  english_pob_choice: there is none like you
  chosen_korean: 주님과 같은 이가 없기 때문입니다
  alternatives_korean:
  - 주님과 같은 이는 아무도 없기 때문입니다
  - 주님과 견줄 이가 없기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 절대적 비견 불가능성을 그대로 살려, ‘같은 이가 없다’는 표현으로 옮겼습니다. ‘견줄 이가 없다’보다 직접적인 부정 비교가 더 분명합니다.
theological_decisions:
- issue: 하나님에 대한 두려움과 경외의 긴장
  chosen_reading: 두려워하지 않겠습니까?
  alternative_readings:
  - 경외하지 않겠습니까?
  - 두려워하지 않을 수 있겠습니까?
  rationale: 본문은 하나님 앞에서의 적절한 반응을 단순한 존중이 아니라 두려움/경외의 범주로 말하므로, 약화된 표현보다 강한 성경적 범주를 유지했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 보편적 왕권의 호칭
  chosen_reading: 민족들의 왕이시여
  alternative_readings:
  - 나라들의 왕이시여
  - 민족들의 왕
  rationale: 이 구절은 야훼의 보편적 통치를 직접 호칭합니다. 호칭형으로 처리해 예언적 찬양의 어조를 보존했습니다.
  doctrine_reference: Translation philosophy §3
