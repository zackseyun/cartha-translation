review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the Hebrew lament and preserves the paired imagery of breaking, wound, and sickness. However, ‘내가 화로다’ is not natural modern Korean and can suggest divine wrath or calamity rather than the speaker’s cry of distress. The footnote markers are also all placed at the end rather than attached to their respective terms.
  naturalness: ‘아, 나의 부서짐 때문에 내가 화로다’ is stilted and archaic, contrary to the requested modern formal-polite register. ‘아, 내 부서짐 때문에 나는 괴롭습니다’ gives the lament force in current standard Korean. ‘내 상처는 심합니다’ is clear and idiomatic.
  terminology: ‘부서짐’ appropriately retains the breadth of שבר, while ‘상처,’ ‘병,’ and ‘짊어지다’ preserve the medical and burden imagery. ‘참으로’ suitably renders the asseverative אַךְ without adding interpretive force.
  issues:
  - severity: medium
    issue: ‘내가 화로다’ is archaic and semantically misleading in Korean.
    rationale: The Hebrew אוי לי is a cry of personal lament (‘Woe is me/Alas for me’), not an assertion that the speaker is ‘wrath’ or necessarily under ‘woe’ as a noun. A modern expression of distress is needed.
  - severity: medium
    issue: Footnote anchors [a], [b], and [c] are grouped after the final sentence.
    rationale: 'Each marker must immediately follow the Korean word or clause to which its note pertains: שבר, the severity of the wound, and the final imperfect clause respectively.'
