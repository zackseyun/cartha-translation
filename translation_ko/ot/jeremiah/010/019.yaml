id: JER.10.19
reference: Jeremiah 10:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: א֥וֹי לִ/י֙ עַל שִׁבְרִ֔/י נַחְלָ֖ה מַכָּתִ֑/י וַ/אֲנִ֣י אָמַ֔רְתִּי אַ֛ךְ זֶ֥ה חֳלִ֖י וְ/אֶשָּׂאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/019.yaml
  text: Woe is me because of my brokenness[a]; my wound is grievous. But I said, “Surely this is my sickness[c][b], and I must bear it.”
  footnotes:
  - marker: a
    text: Or 'for my hurt' / 'because of my injury.' The Hebrew שבר can refer to a fracture, breaking, or ruin.
    reason: lexical_alternative
  - marker: b
    text: Or 'my wound is severe' or 'my wound is sick.' The Hebrew verb נַחְלָה conveys being weak, sick, or grievous.
    reason: lexical_alternative
  - marker: c
    text: Or 'this is my illness, and I will bear it.' The final clause can be heard either as resignation ('I must bear it') or simple future ('I will bear it').
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 내 부서짐[a] 때문에 나는 괴롭습니다. 내 상처는 심합니다[b]. 그러나 나는 말했습니다. “참으로 이것은 내 병이니, 나는 이것을 짊어져야 합니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 상처 때문에’ 또는 ‘내 부상 때문에’. 히브리어 שבר은 골절, 부러짐, 붕괴, 파멸을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 상처는 심각합니다’ 또는 ‘내 상처는 병들었습니다’. 히브리어 נַחְלָה는 약해지다, 병들다, 심각해지다의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이것은 내 병이니, 나는 이것을 짊어지겠습니다.’ 마지막 절은 체념 섞인 ‘짊어져야 합니다’로도, 단순 미래인 ‘짊어지겠습니다’로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֥וֹי
  english_pob_choice: Woe is me
  chosen_korean: 아, 나의 부서짐 때문에 내가 화로다
  alternatives_korean:
  - 아, 나에게 화가 있다
  - 슬프다, 나여
  lexicon: HALOT
  rationale: 감탄사 אוי의 탄식과 자기 대상화를 살리되, 현대 한국어에서 자연스러운 비통함의 외침으로 옮겼습니다. ‘화로다’는 직역적이면서도 탄식의 강도를 유지합니다.
- source_word: שִׁבְרִי
  english_pob_choice: because of my brokenness
  chosen_korean: 부서짐
  alternatives_korean:
  - 상처
  - 파괴
  - 부상
  lexicon: HALOT
  rationale: שבר은 부러짐, 깨짐, 붕괴, 파멸까지 아우르므로, 단순한 신체 상처보다 더 넓은 파열의 이미지를 살리는 ‘부서짐’을 택했습니다.
- source_word: נַחְלָה מַכָּתִי
  english_pob_choice: my wound is grievous
  chosen_korean: 내 상처는 극히 중합니다
  alternatives_korean:
  - 내 상처는 심각합니다
  - 내 상처는 낫기 어렵습니다
  - 내 상처는 병들었습니다
  lexicon: HALOT
  rationale: נחלה는 병들다/약해지다/중하다의 뜻이 있어 상처의 상태를 ‘극히 중합니다’로 옮겨, 중증성과 ‘병든 듯한’ 상태를 함께 반영했습니다.
- source_word: חֳלִי
  english_pob_choice: my sickness
  chosen_korean: 나의 병
  alternatives_korean:
  - 나의 질병
  - 나의 앓음
  - 나의 질환
  lexicon: HALOT
  rationale: חלי는 실제 병을 뜻할 수 있으므로, 뒤의 ‘짊어져야 합니다’와 함께 병의 은유를 유지하는 ‘병’이 가장 자연스럽습니다.
- source_word: וְאֶשָּׂאֶנּוּ
  english_pob_choice: and I must bear it
  chosen_korean: 내가 그것을 짊어져야 합니다
  alternatives_korean:
  - 내가 그것을 견뎌야 합니다
  - 내가 그것을 지고 가겠습니다
  - 내가 그것을 감당하겠습니다
  lexicon: HALOT
  rationale: נשא의 기본 의미인 ‘지다/짊어지다’를 살리면서, 문맥의 체념 섞인 결심을 ‘-아/어야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 탄식의 수사와 자기 고백의 긴장
  chosen_reading: 이 구절은 단순한 불평이 아니라, 파괴와 질병의 이미지를 겹쳐 놓은 예레미야의 탄식으로 읽었습니다.
  alternative_readings:
  - 개인적 신체 질환에 대한 진술
  - 국가적 재난에 대한 은유적 탄식
  rationale: 히브리어 어휘가 신체 상처와 붕괴를 동시에 가리키므로, 둘 중 하나로 축소하지 않고 둘의 긴장을 유지했습니다.
  doctrine_reference: 예레미야 10:19의 문학적-신학적 탄식
