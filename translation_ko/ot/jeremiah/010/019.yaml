- from: 아, 나의 부서짐 때문에 내가 화로다. 내 상처는 극히 중합니다. 그러나 나는 말했습니다. “분명히 이것은 나의 병이니, 내가 그것을 짊어져야 합니다.”[a][b][c]
  to: 아, 내 부서짐[a] 때문에 나는 괴롭습니다. 내 상처는 심합니다[b]. 그러나 나는 말했습니다. “참으로 이것은 내 병이니, 나는 이것을 짊어져야 합니다[c].”
  rationale: The revision replaces an archaic and potentially misleading rendering of the opening lament with natural modern formal Korean, while retaining the source’s first-person distress and the ambiguity of ‘brokenness.’ It also simplifies the wound description without overstating incurability and relocates all footnote anchors to their proper textual referents.
