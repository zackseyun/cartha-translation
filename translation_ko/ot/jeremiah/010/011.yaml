    rationale: לָא עֲבַדוּ는 ‘만들지 않았다’라는 부정 진술이며, 그들이 만들 능력이 없었다는 양태를 문법적으로 명시하지 않습니다. ‘만들지 않은’이 더 직접적입니다.
