source:
  edition: WLC
  text: כִּ/דְנָה֙ תֵּאמְר֣וּן לְ/ה֔וֹם אֱלָ֣הַיָּ֔/א דִּֽי שְׁמַיָּ֥/א וְ/אַרְקָ֖/א לָ֣א עֲבַ֑דוּ יֵאבַ֧דוּ מֵֽ/אַרְעָ֛/א וּ/מִן תְּח֥וֹת שְׁמַיָּ֖/א אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/011.yaml
  text: 'Thus you shall say to them: “The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.”[a][b]'
  footnotes:
  - marker: a
    text: Or “will be destroyed” or “will vanish.” The Aramaic verb can denote perishing or being wiped out.
    reason: lexical_alternative
  - marker: b
    text: “The gods” may refer to idols, supposed deities, or both; the text leaves the polemical reference broad.
    reason: alternative_reading
translation:
  language: ko
  text: “그들에게 이렇게 말하시오. ‘하늘과 땅을 만들지 못한 신들은 땅에서, 그리고 이 하늘 아래에서 사라질 것입니다.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사라질 것입니다’는 아람어 동사의 ‘멸망하다’와 ‘사라지다’ 가능성을 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신들’은 우상, 존재한다고 상정된 신적 존재, 혹은 그 둘 모두를 가리킬 수 있으며, 본문은 그 범위를 좁히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּדְנָה
  english_pob_choice: Thus
  chosen_korean: 이렇게
  alternatives_korean:
  - 그렇게
  - 이와 같이
  lexicon: HALOT
  rationale: 아람어 지시 부사로서 뒤따르는 진술 공식을 도입하므로, 예언적 말하기에 자연스러운 ‘이렇게’로 옮겼습니다.
- source_word: תֵּאמְרוּן לְהוֹם
  english_pob_choice: you shall say to them
  chosen_korean: 그들에게 … 말하시오
  alternatives_korean:
  - 그들에게 … 말할 것입니다
  - 그들에게 … 말하십시오
  lexicon: HALOT
  rationale: 직접 명령형의 전달을 살리되 현대 한국어 예언체에 맞게 ‘말하시오’로 처리했습니다.
- source_word: אֱלָהַיָּא
  english_pob_choice: the gods
  chosen_korean: 신들
  alternatives_korean:
  - 그 신들
  - 제신들
  - 우상들
  lexicon: HALOT
  rationale: 본문이 ‘창조하지 못한 대상들’을 가리키는 복수 명사이므로, 신격 여부를 미리 좁히지 않고 ‘신들’로 두어 폴레미컬한 폭을 유지했습니다.
- source_word: לָא עֲבַדוּ
  english_pob_choice: did not make
  chosen_korean: 만들지 못한
  alternatives_korean:
  - 만들지 않은
  - 창조하지 않은
  - 지은 적이 없는
  lexicon: HALOT
  rationale: 창조-대조 구도를 살리기 위해 ‘만들다’를 기본으로 하면서, 능력/자격의 결핍을 드러내는 한국어로 ‘못한’을 택했습니다.
- source_word: יֵאבַדוּ
  english_pob_choice: will perish
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 망할 것입니다
  - 없어질 것입니다
  lexicon: HALOT
  rationale: 아람어 어근 אבד의 ‘멸하다/사라지다’ 범위를 반영하되, 영어 주석이 열어 둔 ‘vanish’ 가능성도 함께 담을 수 있는 동사로 옮겼습니다.
- source_word: מֵאַרְעָא וּמִן תְּחוֹת שְׁמַיָּא אֵלֶּה
  english_pob_choice: from the earth and from under these heavens
  chosen_korean: 땅에서, 그리고 이 하늘 아래에서
  alternatives_korean:
  - 땅에서, 그리고 하늘 아래에서
  - 땅에서, 그리고 이 하늘 밑에서
  lexicon: HALOT
  rationale: 두 개의 전치사구를 그대로 살려 심판의 범위를 보존했고, 아람어의 지시사 אֵלֶּה는 ‘이 하늘’로 반영했습니다.
theological_decisions:
- issue: ‘the gods’의 지시 범위
  chosen_reading: ‘신들’로 두어, 우상인지 실재 신격 주장인지 본문이 의도적으로 열어 둔 폴레미컬한 긴장을 유지했습니다.
  alternative_readings:
  - 우상들
  - 거짓 신들
  - 제신들
  rationale: 본문은 창조주 되심의 기준으로 대조할 뿐, 대상의 정체를 단정적으로 한정하지 않습니다. 따라서 번역도 전통적 해석으로 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it.'
