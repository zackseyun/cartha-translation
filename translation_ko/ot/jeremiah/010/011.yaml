- from: “그들에게 이렇게 말하시오. ‘하늘과 땅을 만들지 못한 신들은 땅에서, 그리고 이 하늘 아래에서 사라질 것입니다.’”[a][b]
  to: “그들에게 이렇게 말하시오. ‘하늘과 땅을 만들지 않은 신들은 땅에서, 그리고 이 하늘 아래에서 사라질 것입니다.’”[a][b]
  rationale: 원문에 없는 능력 부재의 뉘앙스를 제거하기 위해 ‘만들지 못한’을 ‘만들지 않은’으로 수정했습니다. 또한 a 주석은 본문 번역이 여러 의미를 ‘함께 반영한다’고 단정하기보다, 해당 동사의 가능한 어휘 범위를 정확히 설명하도록 다듬었습니다. 그 밖의 표현과 각주 표지는 유지했습니다.
