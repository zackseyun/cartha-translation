  source_fidelity: 히브리어의 천막·밧줄·휘장 비유와 ‘아들들’의 떠남 및 부재, 그리고 다시 천막을 칠 사람이 없다는 탄식을 대체로 충실히 옮겼습니다. 다만 ‘무너졌고’는 שֻׁדָּד의 폭력적인 파괴·황폐의 의미를 다소 약화할 수 있어 ‘파괴되었고’가 더 안전합니다. 또한 עוֹד는 ‘다시’ 또는 ‘더 이상’으로 옮길 수 있으며, 본문에서는 ‘다시’로 자연스럽게 반영했습니다.
