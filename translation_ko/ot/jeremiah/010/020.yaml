id: JER.10.20
reference: Jeremiah 10:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָהֳלִ֣/י שֻׁדָּ֔ד וְ/כָל מֵיתָרַ֖/י נִתָּ֑קוּ בָּנַ֤/י יְצָאֻ֨/נִי֙ וְ/אֵינָ֔/ם אֵין נֹטֶ֥ה עוֹד֙ אָהֳלִ֔/י וּ/מֵקִ֖ים יְרִיעוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/020.yaml
  text: My tent is destroyed[a], and all my ropes are torn away. My sons have gone from me, and they are no more[d][c][b]. There is no one left to stretch out my tent again and set up my curtains.
  footnotes:
  - marker: a
    text: Or 'plundered' or 'devastated' for 'destroyed.' The Hebrew verb can emphasize violent desolation as well as ruin.
    reason: lexical_alternative
  - marker: b
    text: Or 'cords' for 'ropes.'
    reason: lexical_alternative
  - marker: c
    text: '''My sons'' may refer literally to children or figuratively to the people/inhabitants who have departed.'
    reason: cultural_note
  - marker: d
    text: Or 'There is no one anymore to pitch my tent and raise my tent curtains.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 천막은 파괴되었고[a], 내 밧줄은 모두 끊어졌습니다[b]. 내 아들들은[c] 내게서 떠나갔고, 그들은 더 이상 없습니다. 내 천막을 다시 치고 내 휘장을 세울 사람은 아무도 없습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약탈당했다’, ‘황폐해졌다’로 옮길 수 있습니다. 히브리어 동사는 폭력적인 파괴뿐 아니라 약탈과 황폐의 뉘앙스도 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘줄들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 아들들’은 문자 그대로 자녀를 가리킬 수도 있고, 떠나간 백성이나 거주민을 비유적으로 가리킬 수도 있습니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘내 천막을 더 이상 치고 내 천막 휘장을 세울 사람은 아무도 없습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלִי
  english_pob_choice: my tent
  chosen_korean: 내 천막
  alternatives_korean:
  - 내 장막
  - 내 거처
  lexicon: HALOT
  rationale: 문맥이 밧줄과 휘장을 함께 말하는 천막 이미지이므로, 현대 한국어에서도 즉시 이해되는 ‘천막’을 택해 원문의 비유를 살렸습니다.
- source_word: שֻׁדָּד
  english_pob_choice: is destroyed
  chosen_korean: 무너졌고
  alternatives_korean:
  - 파괴되었고
  - 약탈되었고
  - 황폐해졌고
  lexicon: HALOT
  rationale: 이 동사는 폭력적 파괴와 황폐를 함께 담을 수 있으므로, 뒤의 밧줄이 끊어지는 이미지와 어울리는 상태 묘사로 ‘무너졌고’를 썼습니다.
- source_word: מֵיתָרַי
  english_pob_choice: my ropes
  chosen_korean: 내 밧줄들
  alternatives_korean:
  - 내 줄들
  - 내 끈들
  lexicon: HALOT
  rationale: 천막의 고정용 줄을 가리키므로 ‘밧줄들’이 가장 자연스럽고, 현대 독자에게도 기능이 분명합니다.
- source_word: יְצָאֻנִי / וְאֵינָם
  english_pob_choice: have gone from me / and they are no more
  chosen_korean: 내게서 떠나갔고, 이제 그들이 없으니
  alternatives_korean:
  - 내게서 나갔고, 이제 그들이 없으니
  - 내 곁을 떠났고, 이제 그들이 없으니
  lexicon: HALOT
  rationale: ‘떠나가다’는 단순 이동이 아니라 상실감을 드러내는 표현이라 시적 탄식에 맞고, ‘없으니’로 존속 부재를 옮겼습니다.
- source_word: אֵין נֹטֶה עוֹד ... וּמֵקִים
  english_pob_choice: There is no one left to stretch out ... and set up
  chosen_korean: 다시 펴고 ... 세울 사람은 아무도 없습니다
  alternatives_korean:
  - 다시 치고 ... 세울 사람이 없습니다
  - 다시 펼치고 ... 세울 사람이 없습니다
  lexicon: HALOT
  rationale: ‘천막을 펴다/세우다’는 한국어 천막 문맥에서 자연스러운 대응이며, ‘아무도 없습니다’로 히브리어의 부정 존재 구문을 분명히 했습니다.
theological_decisions:
- issue: ‘내 아들들’의 지시 대상
  chosen_reading: 문자적 자녀를 넘어, 공동체/거주민의 상실을 포함하는 애가적 표현으로 유지했습니다.
  alternative_readings:
  - 바빌론 포로로 떠난 실제 자녀들
  - 예루살렘/유다의 주민들
  rationale: 히브리어는 남성 복수 ‘아들들’이지만 문맥상 집단을 의인화한 탄식일 수 있어, 의미를 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 예레미야의 시적·예언적 애가와 집단 인격화
