id: JER.10.21
reference: Jeremiah 10:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י נִבְעֲרוּ֙ הָֽ/רֹעִ֔ים וְ/אֶת יְהוָ֖ה לֹ֣א דָרָ֑שׁוּ עַל כֵּן֙ לֹ֣א הִשְׂכִּ֔ילוּ וְ/כָל מַרְעִיתָ֖/ם נָפֽוֹצָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
  footnotes:
  - marker: a
    text: Or 'have become brutish' or 'have become senseless.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew 'shepherds' likely refers metaphorically to the people's leaders.
    reason: cultural_note
  - marker: c
    text: Or 'have not acted wisely' or 'have not prospered.' The Hebrew verb can carry both the sense of wisdom and resulting success.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 목자들은[a] 어리석어졌고, 야훼를 찾지 않았습니다. 그러므로 그들은 지혜롭게 행하지 않았고[b], 그들의 모든 양 떼가 흩어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목자들’은 여기서 백성의 지도자들을 가리키는 비유적 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘지혜롭게 행하다’와 ‘성공하다’의 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  english_pob_choice: the shepherds
  chosen_korean: 그 목자들은
  alternatives_korean:
  - 그 목자들
  - 그 지도자들은
  lexicon: HALOT
  rationale: 직역하면 ‘목자들’이지만, 예레미야에서 이 은유는 백성의 지도자들을 가리키는 경우가 많아 본문 은유는 살리되 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: נִבְעֲרוּ
  english_pob_choice: have become stupid
  chosen_korean: 어리석어졌고
  alternatives_korean:
  - 우둔해졌고
  - 짐승처럼 되었고
  - 무감각해졌고
  lexicon: HALOT
  rationale: נבער는 단순한 지식 부족보다 완고하고 분별 잃은 상태를 가리키므로, 현대 한국어에서 예언적 질책의 강도를 살릴 수 있는 ‘어리석어졌’으로 옮겼습니다.
- source_word: דָרָשׁוּ
  english_pob_choice: have not sought
  chosen_korean: 찾지 않았습니다
  alternatives_korean:
  - 구하지 않았습니다
  - 문의하지 않았습니다
  - 찾아 구하지 않았습니다
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 דרש는 단순 탐색보다 관계적 추구와 의뢰를 함께 담으므로, 문맥에 맞게 ‘찾지 않았습니다’로 자연스럽게 표현했습니다.
- source_word: הִשְׂכִּילוּ
  english_pob_choice: have not acted wisely
  chosen_korean: 지혜롭게 행하지 못했고
  alternatives_korean:
  - 지혜롭게 행하지 않았고
  - 성공하지 못했고
  - 분별 있게 행하지 못했고
  lexicon: HALOT
  rationale: 히필 שכל은 지혜롭게 처신함과 그 결과의 성취를 함께 내포할 수 있으나, 여기서는 지도자들의 실패를 먼저 드러내는 ‘지혜롭게 행하지 못했고’가 본문 흐름을 잘 살립니다.
- source_word: מַרְעִיתָם נָפוֹצָה
  english_pob_choice: their flock is scattered
  chosen_korean: 그들의 모든 양 떼가 흩어졌습니다
  alternatives_korean:
  - 그들의 양 떼가 흩어졌습니다
  - 그들의 목양 대상이 흩어졌습니다
  lexicon: HALOT
  rationale: מַרְעִיתָם는 문자상 ‘먹이/목초지’도 가능하지만, 목자 이미지와 함께 쓰여 그들이 돌보는 무리가 흩어진 뜻이 분명하므로 ‘양 떼’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 소스 본문이 יְהוָה를 직접 사용하므로, 본 프로젝트의 기준에 따라 고유명으로서 ‘야훼’를 유지해 언약명의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
