  source_fidelity: 원문의 יְחַזְּקוּם은 복수 목적어 접미사를 지니므로, 초안의 두 번째 ‘그것을’은 이 복수를 평준화합니다. 그 선행사가 우상 자체의 복수인지, 혹은 고정되는 부분들을 가리키는지는 문맥상 분명하지 않으므로 한국어에서도 복수를 보존하되 해석을 과도하게 특정하지 않는 편이 안전합니다. 또한 원문의 וְלֹא는 문맥상 목적을 나타내며 ‘흔들리지 않게’는 적절합니다.
  naturalness: ‘그것들을 단단히 고정하여 그것이 흔들리지 않게’는 한국어에서 다소 긴장되지만, 원문의 수적 전환과 선행사 불명확성을 보존합니다. 문장 전체는 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘은과 금으로 장식하고’, ‘못과 망치로’, ‘단단히 고정하여’, ‘흔들리지 않게 합니다’는 각각 원문의 재료/수단, 제작 도구, 고정, 불안정하지 않음의 의미를 적절히 전달합니다. ‘단단히’는 본문 의미를 안전하게 강화하는 자연스러운 표현입니다.
