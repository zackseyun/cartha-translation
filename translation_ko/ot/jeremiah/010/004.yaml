  yaml_path: translation/ot/jeremiah/010/004.yaml
  text: They decorate it with silver and with gold[b][a]; they fasten it with nails and with hammers so that it will not totter.
  footnotes:
  - marker: a
    text: Or 'they adorn it with silver and gold.'
    reason: lexical_alternative
  - marker: b
    text: Or 'so that it will not move' or 'so that it will not be shaken.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그것을 은과 금으로 장식하고, 못과 망치로 그것을 단단히 고정하여 흔들리지 않게 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은과 금으로 그것을 장식한다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘흔들리지 않게 하려고’ 또는 ‘움직이지 않게 하려고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֶסֶף
  english_pob_choice: with silver
  chosen_korean: 은으로
  alternatives_korean:
  - 은을 가지고
  - 은으로써
  lexicon: HALOT
  rationale: ב의 재료·수단적 용법을 따라, 우상에 은을 입히는 의미를 자연스러운 현대 한국어로 살렸습니다.
- source_word: וּבְזָהָב
  english_pob_choice: and with gold
  chosen_korean: 금으로
  alternatives_korean:
  - 금을 가지고
  - 금으로써
  lexicon: HALOT
  rationale: 앞의 ‘은으로’와 평행을 이루는 재료 표현으로 처리해, 금속 장식의 병렬을 유지했습니다.
- source_word: יְיַפֵּהוּ
  english_pob_choice: they decorate it
  chosen_korean: 장식하고
  alternatives_korean:
  - 아름답게 하고
  - 꾸미고
  - 치장하고
  lexicon: HALOT
  rationale: יפה의 피엘형은 ‘아름답게 하다/장식하다’의 뜻이므로, 현대 한국어에서 가장 직관적인 ‘장식하다’를 택했습니다.
- source_word: בְּמַסְמְרוֹת וּבְמַקָּבוֹת
  english_pob_choice: with nails and with hammers
  chosen_korean: 못과 망치로
  alternatives_korean:
  - 못과 해머로
  - 못과 망치들을 가지고
  lexicon: HALOT
  rationale: 고정 도구를 평이하게 옮겨 우상 제작의 물리적 행위를 분명히 했습니다.
- source_word: יְחַזְּקוּם
  english_pob_choice: they fasten it
  chosen_korean: 단단히 고정하여
  alternatives_korean:
  - 굳게 하여
  - 강하게 하여
  - 붙들어
  lexicon: HALOT
  rationale: חזק의 사역적 의미를 살려 ‘고정하다’로 옮겼고, 결과를 강조하는 부사 ‘단단히’로 문맥의 조롱적 뉘앙스를 살렸습니다.
- source_word: וְלֹא יָפִיק
  english_pob_choice: so that it will not totter
  chosen_korean: 흔들리지 않게 합니다
  alternatives_korean:
  - 움직이지 않게 합니다
  - 떨리지 않게 합니다
  - 비틀거리지 않게 합니다
  lexicon: HALOT
  rationale: 문맥상 우상이 스스로 설 수 없고 넘어질 수 있음을 드러내는 표현이므로, ‘totter’의 의미를 ‘흔들리다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 우상 제조 묘사의 풍자성
  chosen_reading: 문장을 중립적인 공예 설명이 아니라, 사람이 만든 우상을 물리적으로 붙들어야 하는 무력한 대상으로 보이게 옮겼습니다.
  alternative_readings:
  - 더 중립적인 ‘장식하고 고정합니다’
  - 풍자를 약화한 직역
  rationale: 문맥(렘 10:3-5) 전체가 우상의 무생명성과 의존성을 조롱하므로, 그 효과가 한국어에서도 살아나도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥적 수사 보존
