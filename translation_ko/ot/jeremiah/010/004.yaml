source:
  edition: WLC
  text: בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב יְיַפֵּ֑/הוּ בְּ/מַסְמְר֧וֹת וּ/בְ/מַקָּב֛וֹת יְחַזְּק֖וּ/ם וְ/ל֥וֹא יָפִֽיק׃
base_translation:
