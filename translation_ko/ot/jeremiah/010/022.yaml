id: JER.10.22
reference: Jeremiah 10:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֤וֹל שְׁמוּעָה֙ הִנֵּ֣ה בָאָ֔ה וְ/רַ֥עַשׁ גָּד֖וֹל מֵ/אֶ֣רֶץ צָפ֑וֹן לָ/שׂ֞וּם אֶת עָרֵ֧י יְהוּדָ֛ה שְׁמָמָ֖ה מְע֥וֹן תַּנִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/022.yaml
  text: The sound of a report—look, it is coming!—a great commotion from the land of the north, to make the cities of Judah a desolation, a haunt of jackals.
translation:
  language: ko
  text: 소식이 들려옵니다—보십시오, 그것이 옵니다! 북쪽 땅에서 큰 소동이 일어나 유다의 성읍들을 황폐하게 하고 승냥이의 거처가 되게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל שְׁמוּעָה֙
  english_pob_choice: The sound of a report
  chosen_korean: 소식의 소리가 들립니다
  alternatives_korean:
  - 보고의 소리가 들립니다
  - 소문의 소리가 들립니다
  lexicon: קול + שמועה
  rationale: 직역하면 ‘소식/보고의 소리’인데, 한국어에서 자연스럽고 경고성도 살리기 위해 ‘소식의 소리’로 옮겼습니다.
- source_word: הִנֵּ֣ה
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: הנה
  rationale: 본문의 주의를 환기하는 감탄사로서, 합쇼체 서술에 맞게 ‘보십시오’로 처리했습니다.
- source_word: רַ֥עַשׁ גָּד֖וֹל
  english_pob_choice: a great commotion
  chosen_korean: 큰 소동
  alternatives_korean:
  - 큰 요란
  - 큰 진동
  lexicon: רעש גדול
  rationale: 단순한 소리보다 ‘소동/요란’이 문맥상 전쟁적 소란을 더 잘 드러내므로 ‘큰 소동’을 택했습니다.
- source_word: מְע֥וֹן תַּנִּֽים
  english_pob_choice: a haunt of jackals
  chosen_korean: 승냥이의 거처
  alternatives_korean:
  - 자칼들의 거처
  - 승냥이 서식지
  lexicon: מעון + תנים
  rationale: תנים은 한국어 성경 전통에서 일관되게 ‘승냥이’로 옮겨 온 관례를 따르되, 본문의 황폐한 거처라는 뉘앙스를 살려 ‘거처’로 표현했습니다.
theological_decisions:
- issue: 유다 성읍들의 완전한 황폐화 표현
  chosen_reading: ‘유다의 성읍들을 황폐하게 하고’로, 심판의 결과를 직접적이고 강하게 드러냈습니다.
  alternative_readings:
  - ‘유다의 성읍들을 폐허로 만들고’
  - ‘유다의 성읍들을 황무지로 삼고’
  rationale: 히브리어 שְׁמָמָה는 단순한 손상보다 완전한 폐허 상태를 가리키므로, 약화시키지 않고 ‘황폐하게 하다’로 옮겼습니다.
  doctrine_reference: 예언 심판 본문의 문자적 경고를 보존하는 번역 원칙
