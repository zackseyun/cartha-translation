translation:
  language: ko
  text: 이스라엘의 집이여, 야훼께서 너희에 관하여 말씀하신 말씀을 들으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 신명사 YHWH를 사용합니다. 이를 ‘야훼’로 음역했습니다.
    reason: source_note
lexical_decisions:
- source_word: שִׁמְע֣וּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 보십시오
  - 경청하십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 복수의 예언자적 호소를 현대 한국어의 공손한 명령형으로 옮겼습니다. 단순 정보 수용이 아니라 응답을 요구하는 청종의 뉘앙스를 살렸습니다.
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 이 말씀
  alternatives_korean:
  - 그 말씀
  - 말씀
  lexicon: HALOT
  rationale: 예언 문맥에서 דָּבָר은 단순한 정보가 아니라 선포된 신탁을 가리키므로, 한국어에서는 관습적이면서도 직접적인 ‘말씀’이 적절합니다. 앞 절의 소환과 연결되도록 ‘이’를 보탰습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문의 신명사 מטת? not; 여기에선 한국 교회 독자에게 가장 널리 인지되는 음역을 사용했습니다. 다만 편집 원칙상 원형을 직접 반영하려면 ‘야훼’도 가능하므로 대안을 기록합니다.
- source_word: עֲלֵיכֶם
  english_pob_choice: concerning you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너희에 관하여
  - 너희를 향하여
  lexicon: HALOT
  rationale: עַל + דבר은 ‘~에 대하여/관하여’의 대상 표지가 될 수 있으나, 한국어에서는 예언 서두의 수신자 표지를 자연스럽게 드러내는 ‘너희에게’가 가장 유려합니다. 아직 본문이 심판의 방향을 명시하지 않으므로 ‘너희를 향하여’보다 중립적으로 두었습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: O house of Israel
  chosen_korean: 이스라엘의 집아
  alternatives_korean:
  - 이스라엘의 집이여
  - 이스라엘 집안아
  lexicon: HALOT
  rationale: אָב/בֵּית + 민족명은 예언서의 정형적 호칭이므로 직역적 호격을 살렸습니다. 다만 현대 한국어에서 ‘집’의 비유적 호칭이 다소 생경할 수 있어, 합쇼체 본문 안에서 자연스럽게 읽히도록 호격을 간명하게 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 구절의 신명사는 예언자 발화의 주체를 가리키는 고유명사이므로 음역을 유지해야 합니다. 한국어 출판 가독성과 교회 독자 친숙도를 고려해 ‘여호와’를 본문에 두고, 원전 지향 대안인 ‘야훼’를 메모 수준에서만 남겼습니다.
  doctrine_reference: 'POB contested terms: YHWH rendering'
