  rationale: 원문에 있는 고유한 언약명을 드러내려는 POB 원칙을 따랐으며, 본절은 직접 호칭이므로 존칭을 덧붙인 합쇼체가 적절합니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
