  - 주님과 같은 분은 없습니다
  lexicon: HALOT
  rationale: 존재 부정과 비교 표현을 한국어로 자연스럽게 옮기되, 단순한 유사성보다 ‘같은 분’이라는 인격적 비교를 살렸습니다.
- source_word: יְהוָה
