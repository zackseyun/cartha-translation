  lexicon: HALOT
  rationale: בְּ + גְבוּרָה는 여기서 ‘힘/권능’의 영역 또는 표지를 나타내므로, ‘능력으로’가 본문의 압축성과 의미를 함께 살립니다.
theological_decisions:
