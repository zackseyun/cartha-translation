  - 당신은 위대하십니다
  lexicon: HALOT
  rationale: 형용사 술어를 한국어의 자연스러운 서술형으로 옮겨 하나님의 위대하심을 직접 진술했습니다.
- source_word: בִּגְבוּרָה
  english_pob_choice: in might
  chosen_korean: 능력으로
  alternatives_korean:
