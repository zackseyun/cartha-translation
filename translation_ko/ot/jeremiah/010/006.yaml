  - 여호와님
  lexicon: HALOT
  rationale: 원문의 신성명 יְהוָה를 본문에서 ‘야훼’로 옮기고, 문장 흐름상 존칭 어미를 더해 합쇼체로 맞췄습니다.
- source_word: גָּדוֹל אַתָּה
  english_pob_choice: you are great
  chosen_korean: 야훼님은 위대하십니다
  alternatives_korean:
