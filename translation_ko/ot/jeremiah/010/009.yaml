  text: כֶּ֣סֶף מְרֻקָּ֞ע מִ/תַּרְשִׁ֣ישׁ יוּבָ֗א וְ/זָהָב֙ מֵֽ/אוּפָ֔ז מַעֲשֵׂ֥ה חָרָ֖שׁ וִ/ידֵ֣י צוֹרֵ֑ף תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ לְבוּשָׁ֔/ם מַעֲשֵׂ֥ה חֲכָמִ֖ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/009.yaml
  text: Beaten silver is brought from Tarshish[a], and gold from Uphaz, the work of a craftsman and of the hands of a goldsmith. Blue and purple are their clothing; all of them are the work of skilled men.
  footnotes:
  - marker: a
    text: Hebrew 'Uphaz'; some understand this as a variant of 'Ophir.'
    reason: alternative_reading
translation:
  language: ko
  text: 은으로 두드려 만든 물건은 다르시스에서 가져오고, 금은 우바스에서 가져옵니다. 그것들은 장인의 작품이며 금세공인의 손으로 만든 것입니다. 청색과 자색은 그것들의 옷이며, 그것들은 모두 숙련된 사람들의 작품입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우바스’는 히브리어 본문형을 따른 음역이며, 일부는 ‘오피르’의 이형으로 이해합니다.
    reason: source_note
lexical_decisions:
- source_word: כֶּסֶף מְרֻקָּע
  english_pob_choice: beaten silver
  chosen_korean: 은으로 두드려 만든 물건
  alternatives_korean:
  - 두드려 편 은
  - 망치질한 은
  lexicon: HALOT
  rationale: מְרֻקָּע는 금속을 두드려 얇게 편 상태를 가리키므로, 단순히 ‘은’이 아니라 가공된 물건임을 드러내는 표현으로 옮겼습니다.
- source_word: מִתַּרְשִׁישׁ
  english_pob_choice: from Tarshish
  chosen_korean: 다르시스에서
  alternatives_korean:
  - 다르쉬시에서
  - 다시스에서
  lexicon: 고유명사 표기
  rationale: 지명은 음역을 유지해야 하므로 현대 외래어 표기 관행에 따라 ‘다르시스’로 옮겼습니다.
- source_word: מֵאוּפָז
  english_pob_choice: from Uphaz
  chosen_korean: 우바스에서
  alternatives_korean:
  - 우파즈에서
  - 오프스에서
  lexicon: 고유명사 표기
  rationale: 마소라 본문은 אוּפָז를 읽으므로 본문형을 따라 ‘우바스’로 옮기고, 오피르 변이 가능성은 본문 밖에서 다룰 수 있게 남겼습니다.
- source_word: מַעֲשֵׂה חָרָשׁ וִידֵי צוֹרֵף
  english_pob_choice: the work of a craftsman and of the hands of a goldsmith
  chosen_korean: 장인의 작품이며 금세공인의 손으로 만든 것입니다
  alternatives_korean:
  - 기술자의 작품이며 금세공인의 손으로 만든 것입니다
  - 장인의 솜씨이며 금속세공인의 손으로 만든 것입니다
  lexicon: HALOT
  rationale: חָרָשׁ는 일반적 숙련공보다 ‘장인’이 자연스럽고, צוֹרֵף는 이 문맥에서 귀금속을 다루는 금세공인으로 구체화하는 것이 적절합니다.
- source_word: מַעֲשֵׂה חֲכָמִים כֻּלָּם
  english_pob_choice: all of them are the work of skilled men
  chosen_korean: 그것들은 모두 숙련된 사람들의 작품입니다
  alternatives_korean:
  - 그것들은 모두 지혜로운 사람들의 작품입니다
  - 그것들은 모두 숙련공들의 작품입니다
  lexicon: HALOT
  rationale: חֲכָמִים는 여기서 ‘지혜로운 자들’이 아니라 제작 기술을 지닌 사람들을 가리키므로, 의미를 분명히 하면서도 성별을 과도하게 중화하지 않는 ‘숙련된 사람들’로 옮겼습니다.
theological_decisions:
- issue: 우상 제작의 기교를 강조하는 종결부의 뉘앙스
  chosen_reading: 귀금속과 직물, 그리고 숙련된 기술이 총동원된 인간 제작물임을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘아름답게 꾸민 우상들’로 완화할 수 있음
  - ‘지혜로운 사람들의 작품’으로 보다 직역할 수 있음
  rationale: 본문은 우상의 값비싼 재료와 인간의 기술을 나열하여 우상의 인공성을 드러내므로, 이를 약화하지 않고 그대로 보이게 하는 것이 문맥상 중요합니다.
  doctrine_reference: 예레미야 10장의 우상 비판 문맥
