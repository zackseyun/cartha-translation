base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/023.yaml
  text: I know[a], O Yahweh, that a man's way is not his own[b]; it is not for a man who walks to direct his steps.
  footnotes:
  - marker: a
    text: Or more formally, 'the way of man is not in himself.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to establish his steps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 압니다, 야훼여. 사람의 길은 그 자신에게 달려 있지 않으며[a], 걸어가는 사람이 자기 발걸음을 정하는 것도 그에게 달려 있지 않습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘사람의 길은 그 자신 안에 있지 않습니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 발걸음을 굳게 세우는 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 제가 알기로는
  alternatives_korean:
  - 저는 압니다
  - 제가 압니다
  lexicon: HALOT
  rationale: 완결된 인식의 고백을 한국어에서 자연스럽게 드러내면서도, 문맥상 단순 정보 전달이 아니라 숙고된 인정의 어조를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유한 신명(神名)을 제목이 아닌 고유명으로 보존하기 위해 야훼를 사용했습니다.
- source_word: לָאָדָם דַּרְכּוֹ
  english_pob_choice: a man's way is not his own
  chosen_korean: 사람의 길은 자기에게 있지 않습니다
  alternatives_korean:
  - 사람의 길은 자기 것이 아닙니다
  - 사람의 길은 자기 안에 있지 않습니다
  lexicon: HALOT
  rationale: 직역적 구조를 한국어로 자연화하면서도, 인간이 자기 삶의 길을 자율적으로 소유·결정하지 못한다는 부정의 핵심을 유지했습니다.
- source_word: וְהָכִין אֶת צַעֲדֹו
  english_pob_choice: to direct his steps
  chosen_korean: 자기의 걸음을 인도하는 것
  alternatives_korean:
  - 자기의 걸음을 정하는 것
  - 자기의 발걸음을 바로 세우는 것
  lexicon: HALOT
  rationale: הכין의 문맥상 의미를 '인도하다'로 옮겨, 걸음/발걸음의 방향을 정하거나 바로잡는 뜻을 살렸습니다.
theological_decisions:
- issue: 인간의 자기결정권에 대한 진술 강도
  chosen_reading: 이 구절은 인간이 자기 삶의 길과 걸음을 궁극적으로 스스로 정하지 못한다는 의존의 진술을 담습니다.
  alternative_readings:
  - 인간의 한계를 말할 뿐, 결정론을 가르치는 것은 아닙니다.
  - 문맥상 기도적 의존의 표현이므로 형이상학적 체계로 확장하지 않습니다.
  rationale: 히브리어는 길이 사람에게 속하지 않으며 걷는 사람이 자기 걸음을 준비/인도하지 못한다고 말하므로, 그 긴장을 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: 신학적 긴장을 보존하고 본문이 말하는 범위 이상으로 체계를 확정하지 않음
