id: JER.10.24
reference: Jeremiah 10:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַסְּרֵ֥/נִי יְהוָ֖ה אַךְ בְּ/מִשְׁפָּ֑ט אַל בְּ/אַפְּ/ךָ֖ פֶּן תַּמְעִטֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/024.yaml
  text: Discipline me[a], Yahweh, but with justice, not in your anger[c][b], lest you diminish me.
  footnotes:
  - marker: a
    text: Or 'Correct me, LORD,' or 'Chasten me, LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with judgment' or 'according to justice.' The Hebrew term can denote judgment, justice, or proper measure.
    reason: lexical_alternative
  - marker: c
    text: Or 'lest you diminish me' or 'lest you make me small.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼님, 저를 징계해 주십시오[a]. 다만 정의에 따라 해 주시고[b], 주님의 분노로는 하지 말아 주십시오. 그렇지 않으면 저를 미미하게 하실까 두렵습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 바로잡아 주십시오’, ‘저를 훈계해 주십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘심판에 따라’, ‘공의로’로 옮길 수 있습니다. 히브리어는 심판, 정의, 또는 바른 분량을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘저를 작게 하실까’, ‘저를 줄이실까’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְּרֵנִי
  english_pob_choice: Discipline me
  chosen_korean: 저를 징계하소서
  alternatives_korean:
  - 저를 바로잡으소서
  - 저를 징벌하소서
  - 저를 훈계하소서
  lexicon: HALOT
  rationale: יסר의 교정·훈육적 의미를 살려, 단순 처벌보다 하나님께 드리는 간구에 맞는 ‘징계하소서’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה는 본문에 나온 고유한 신적 이름이므로, POB 기본 원칙에 따라 제목어가 아닌 음역형 ‘야훼’를 사용했습니다.
- source_word: בְּמִשְׁפָּט
  english_pob_choice: with justice
  chosen_korean: 정의로
  alternatives_korean:
  - 심판으로
  - 판단에 따라
  - 공의로
  lexicon: HALOT
  rationale: 여기서는 무자비한 심판보다 절제되고 올바른 방식의 징계를 요청하므로, ‘정의로’가 문맥의 긴장과 의미를 가장 자연스럽게 드러냅니다.
- source_word: תַּמְעִיטֵנִי
  english_pob_choice: you diminish me
  chosen_korean: 저를 줄어들게 하실까
  alternatives_korean:
  - 저를 작게 하실까
  - 저를 줄이실까
  - 저를 미미하게 하실까
  lexicon: HALOT
  rationale: מעט의 Hiphil은 ‘작게 하다/감소시키다’의 뜻이므로, 과도한 해석을 피하면서도 위협적 결과를 살리는 ‘줄어들게 하실까’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 고유명사 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 언약적 신명(神名)을 이름 자체로 드러내기 위해, 관용적 대치어보다 음역형을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מִשְׁפָּט의 신학적 긴장
  chosen_reading: ‘정의로’로 옮겨, 징계는 원하지만 파괴적 분노는 원치 않는 긴장을 보존합니다.
  alternative_readings:
  - 심판으로
  - 판단에 따라
  - 공의로
  rationale: 화자의 간구는 하나님의 올바른 처분을 구하면서도 분노의 폭주를 피하게 해 달라는 데 있으므로, 의미를 완화하지 않고 균형 있게 드러내야 합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
