  source_fidelity: 히브리어의 간구 구조(‘저를 징계해 주십시오—다만 משפט에 따라—분노로는 하지 말아 주십시오—פן의 두려운 결과’)는 대체로 반영되어 있습니다. 다만 현 번역의 ‘그러나 정의로 하시고’는 무엇을 정의로 하라는지 한국어에서 다소 불분명하고, ‘저를 줄어들게 하실까’는 사람을 목적어로 쓸 때 자연스럽지 않습니다. 또한 각주 표지가 해당 어휘가 아닌 곳에 배치되어 있습니다.
  naturalness: 현대 표준어 합쇼체 기도문으로는 ‘…하소서’보다 ‘…해 주십시오/말아 주십시오’가 요청된 문체에 더 맞습니다. ‘정의에 따라’는 בְּמִשְׁפָּט의 방식·기준의 의미를 자연스럽게 드러내며, ‘미미하게 하실까’는 תַּמְעִיטֵנִי의 ‘작게/적게 만들다, 감소시키다’를 과도하게 ‘완전히 없애다’로 확장하지 않고 표현합니다.
  terminology: יַסְּרֵנִי는 교정적 징계이므로 ‘징계해 주십시오’가 적절하며, 징벌을 주요 대안으로 제시하는 것은 피하는 편이 좋습니다. יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지하되, 한국어 존대 호격에서는 ‘야훼님’이 자연스럽습니다. מִשְׁפָּט은 여기서 ‘정의에 따라’로 옮겨 משפט의 공정하고 절제된 처분이라는 폭을 보존합니다.
