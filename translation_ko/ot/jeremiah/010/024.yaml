  - severity: medium
    issue: ‘저를 줄어들게 하실까’는 자연스럽지 않은 한국어입니다.
    rationale: תַּמְעִיטֵנִי는 ‘나를 작게/적게 만들다, 감소시키다’이지만, 사람을 ‘줄어들게 하다’라고 하면 비문에 가깝습니다. ‘저를 미미하게 하실까’는 이 축소의 의미를 보존하면서 자연스럽습니다.
