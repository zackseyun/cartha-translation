  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי חֻקּ֥וֹת הָֽ/עַמִּ֖ים הֶ֣בֶל ה֑וּא כִּֽי עֵץ֙ מִ/יַּ֣עַר כְּרָת֔/וֹ מַעֲשֵׂ֥ה יְדֵ֥י חָרָ֖שׁ בַּֽ/מַּעֲצָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/003.yaml
  text: For the customs of the peoples are vanity[a], for a tree is cut from the forest, the work of the hands of a craftsman with an axe.
  footnotes:
  - marker: a
    text: Or 'with an adze'; the Hebrew term refers to a wood-cutting/shaping tool, and the exact implement is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 백성들의 관습이 헛됨이니, 곧 나무를 숲에서 베어 내고, 장인의 손으로 도끼로 만든 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끌로’; 여기서 히브리어는 나무를 자르거나 다듬는 도구를 가리키며, 정확한 공구는 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקּוֹת
  english_pob_choice: customs
  chosen_korean: 관습
  alternatives_korean:
  - 규례
  - 의식
  - 풍습
  lexicon: HALOT
  rationale: 여기서는 율법적 규정보다는 이방 민족의 종교적 관행과 사용을 가리키므로, 문맥에 맞게 ‘관습’으로 옮겼습니다.
- source_word: הָעַמִּים
  english_pob_choice: the peoples
  chosen_korean: 백성들
  alternatives_korean:
  - 민족들
  - 나라들
  lexicon: HALOT
  rationale: 히브리어 복수형은 이방 집단들을 가리키며, ‘백성들’은 그 집합적 의미를 자연스럽게 살리면서도 현대 한국어에서 무리 없이 읽힙니다.
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛됨
  alternatives_korean:
  - 허무
  - 공허함
  - 바람
  lexicon: HALOT
  rationale: ‘허무’보다 직접적인 판정어인 ‘헛됨’이 우상 제작과 예배의 무가치함을 더 분명하게 드러냅니다.
- source_word: בַּמַּעֲצָד
  english_pob_choice: with an axe
  chosen_korean: 도끼로
  alternatives_korean:
  - 끌로
  - 도끼나 끌 같은 공구로
  lexicon: HALOT
  rationale: 정확한 공구는 다소 불확실하지만, 목재를 자르는 장면에서는 현대 독자에게 ‘도끼로’가 가장 분명한 기본 번역입니다.
theological_decisions:
- issue: 이방 종교와 우상 제작의 허무를 한국어에서 어떻게 직접적으로 드러낼지
  chosen_reading: ‘관습이 헛됨’과 ‘장인의 손으로 도끼로 만든 것’으로 함께 번역해, 예배 행위의 공허함과 인간 제작물이라는 대조를 살렸습니다.
  alternative_readings:
  - ‘규례가 헛되다’
  - ‘제도가 헛되다’
  - ‘장인의 손이 만든 허무한 것’
  rationale: 본문의 논지는 이방 관습의 무가치함과 우상의 인공성을 병렬로 고발하는 데 있으므로, 추상화하거나 완화하지 않고 원문의 대조를 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
