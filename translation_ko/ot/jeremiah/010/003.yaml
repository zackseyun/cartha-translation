  to: 이는 민족들의 관습이 헛됨이니, 숲에서 나무를 베어 내어 장인이 도끼로 손수 만든 것이기 때문입니다.[a]
  rationale: 원문의 반복된 כִּי에 상응하는 ‘~이기 때문입니다’를 유지하고, 나무를 숲에서 베어 내는 과정과 장인의 제작 행위를 자연스럽게 연결했습니다. ‘손수’는 ‘장인의 손들의 작품’이라는 표현의 인간 제작 강조를 살리며, ‘도끼로’는 도구를 명확히 표시합니다. 도구의 정확한 종류에 관한 불확실성은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:27Z'
