  to: 주님의 분노를 주님을 알지 못하는 나라들 위에, 주님의 이름을 부르지 않는 족속들 위에 쏟아부으십시오. 그들이 야곱을 삼켰고, 그를 삼켜 완전히 없애 버렸으며, 그의 거처를 황폐하게 하였기 때문입니다.[a]
