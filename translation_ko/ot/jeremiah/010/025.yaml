id: JER.10.25
reference: Jeremiah 10:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁפֹ֣ךְ חֲמָתְ/ךָ֗ עַל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ךָ וְ/עַל֙ מִשְׁפָּח֔וֹת אֲשֶׁ֥ר בְּ/שִׁמְ/ךָ֖ לֹ֣א קָרָ֑אוּ כִּֽי אָכְל֣וּ אֶֽת יַעֲקֹ֗ב וַ/אֲכָלֻ֨/הוּ֙ וַ/יְכַלֻּ֔/הוּ וְ/אֶת נָוֵ֖/הוּ הֵשַֽׁמּוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/025.yaml
  text: Pour out your wrath on the nations that do not know you[a], and on the clans that do not call on your name; for they have devoured Jacob, they have devoured him and consumed him, and they have laid waste his habitation.
  footnotes:
  - marker: a
    text: Or 'his habitation' or 'his dwelling place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 분노를 주님을 알지 못하는 나라들 위에, 주님의 이름을 부르지 않는 족속들 위에 쏟아 부으십시오. 그들이 야곱을 집어삼키고 그를 삼키며 완전히 멸망시켰고, 그의 거처를 황폐하게 만들었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거처’는 נָוֶה의 가능한 의미 가운데 하나입니다. 문맥상 ‘터전/거주지’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ / חֲמָתְךָ
  english_pob_choice: Pour out your wrath
  chosen_korean: 분노를 쏟아 부으십시오
  alternatives_korean:
  - 진노를 쏟아 부으십시오
  - 격노를 쏟으십시오
  lexicon: HALOT
  rationale: פּך־와 חֵמָה의 결합은 강한 심판 요청이므로, 완곡한 표현보다 ‘쏟아 부으십시오’로 폭발적 이미지를 살렸습니다.
- source_word: הַגּוֹיִם / מִשְׁפָּחוֹת
  english_pob_choice: the nations / the clans
  chosen_korean: 나라들 / 족속들
  alternatives_korean:
  - 민족들 / 가문들
  - 나라들 / 가족들
  lexicon: HALOT
  rationale: גּוֹיִם과 מִשְׁפָּחוֹת의 병렬은 단순한 가족보다 더 넓은 사회 단위를 가리키므로, 현대 한국어에서 위계를 살릴 수 있는 ‘나라들 / 족속들’로 옮겼습니다.
- source_word: לֹא יְדָעוּךָ / בְּשִׁמְךָ לֹא קָרָאוּ
  english_pob_choice: that do not know you / that do not call on your name
  chosen_korean: 주님을 알지 못하는 / 주님의 이름을 부르지 않는
  alternatives_korean:
  - 주님을 알지 못한 / 주님의 이름을 부르지 않은
  - 주님을 인식하지 않는 / 주님의 이름을 부르지 않는
  lexicon: HALOT
  rationale: 하나님을 ‘알다’는 단순 지식이 아니라 언약적 관계와 인정의 뜻을 담으므로, ‘주님을 알지 못하는’으로 직접성을 유지했습니다.
- source_word: אָכְלוּ ... וַאֲכָלֻהוּ ... וַיְכַלֻּהוּ
  english_pob_choice: they have devoured Jacob, they have devoured him and consumed him
  chosen_korean: 야곱을 집어삼키고 그를 삼키며 완전히 멸망시켰고
  alternatives_korean:
  - 야곱을 삼켰고 그를 삼키며 끝장냈고
  - 야곱을 먹어 치우고 그를 먹어 치우며 소진시켰고
  lexicon: HALOT
  rationale: אָכַל과 כלה의 반복은 파괴의 누적을 강조하므로, 같은 동사 반복을 과도하게 매끈하게 만들지 않으면서도 한국어에서 자연스러운 강한 동사열로 대응했습니다.
- source_word: נָוֵהוּ
  english_pob_choice: his habitation
  chosen_korean: 그의 거처
  alternatives_korean:
  - 그의 집
  - 그의 거주지
  - 그의 목초지
  lexicon: HALOT
  rationale: נָוֶה는 거주처를 뜻할 수 있으므로, ‘거처’로 옮겨 주거·터전의 의미를 살리되 특정한 목초 이미지로 좁히지 않았습니다.
theological_decisions:
- issue: 직접적 저주/심판 청원 보존
  chosen_reading: 본문의 심판 청원을 완곡하게 바꾸지 않고, 하나님께 열방을 향한 진노의 집행을 구하는 기도문으로 유지했습니다.
  alternative_readings:
  - 단순한 역사적 진술로 풀어 쓰기
  - ‘분노’ 대신 약한 ‘화’로 완화하기
  rationale: 예레미야 10:25는 폭력에 대한 신학적 응답으로서의 탄원입니다. 본문의 긴장과 강도를 보존하는 것이 source-direct 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
