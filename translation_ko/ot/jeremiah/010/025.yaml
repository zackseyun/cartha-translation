  source_fidelity: 전반적으로 히브리어의 직접적인 심판 청원과 파괴의 이미지를 충실히 옮겼습니다. 다만 אָכְלוּ–וַאֲכָלֻהוּ–וַיְכַלֻּהוּ의 반복·누적은 현 번역의 ‘집어삼키고 그를 삼키며 완전히 멸망시켰고’에서 분사적 연결로 다소 흐려집니다. 반복되는 완료 행위와 마지막 동사의 종결적 강도를 더 분명히 드러내는 편이 좋습니다. נָוֵהוּ는 ‘거처’가 가능한 번역이며, 목초지/터전의 대안 가능성은 각주로 보존하는 것이 적절합니다.
  naturalness: 합쇼체 기도문의 문체는 자연스럽습니다. 그러나 ‘그를 삼키며 완전히 멸망시켰고’는 한국어에서 동작이 동시적으로 이어지는 듯하고, 목적어 ‘그’가 야곱을 다시 가리키는 반복도 충분히 살아나지 않습니다. ‘그를 삼켜 완전히 없애 버렸으며’로 정리하면 자연스러우면서도 파괴의 완결성을 보존합니다.
  terminology: ‘주님의 분노’, ‘나라들’, ‘주님의 이름을 부르지 않는’, ‘야곱’, ‘거처’, ‘황폐하게 하다’는 적절합니다. מִשְׁפָּחוֹת의 ‘족속들’도 문맥상 허용됩니다. 각주는 נָוֶה의 실질적 대안인 ‘목초지’를 명시하는 편이 더 유익합니다.
