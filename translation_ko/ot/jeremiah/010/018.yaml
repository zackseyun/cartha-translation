id: JER.10.18
reference: Jeremiah 10:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י קוֹלֵ֛עַ אֶת יוֹשְׁבֵ֥י הָ/אָ֖רֶץ בַּ/פַּ֣עַם הַ/זֹּ֑את וַ/הֲצֵר֥וֹתִי לָ/הֶ֖ם לְמַ֥עַן יִמְצָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/018.yaml
  text: 'For thus says Yahweh: Behold[a], I am slinging out the inhabitants of the land at this time[c][b], and I will press them hard so that they may be found.'
  footnotes:
  - marker: a
    text: Or 'casting out' or 'hurling out'; the Hebrew verb evokes the action of a sling.
    reason: lexical_alternative
  - marker: b
    text: Or 'the inhabitants of the earth,' if the phrase is taken more broadly.
    reason: alternative_reading
  - marker: c
    text: The final clause is difficult. Or 'so that they may feel it' or 'so that they may find themselves caught.'
    reason: alternative_reading
translation:
  language: ko
  text: “야훼께서 이렇게 말씀하십니다. 보라[a], 내가 이번에는 이 땅의 주민들을 새총으로 내던지듯이 던져 버리고[b], 그들을 심하게 괴롭혀서 그들이 드러나게 하겠습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’의 감탄적 강조를 살린 표현입니다.
    reason: korean_style_note
  - marker: b
    text: 직역하면 ‘새총으로 던져 내보내는’ 이미지입니다.
    reason: source_note
  - marker: c
    text: 히브리어 마지막 절은 난해하여, ‘그들이 발견되게 하겠다’ 또는 ‘그들이 붙잡히게 하겠다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 신명은 학술적 음역인 ‘야훼’로 옮겨, 언약적 호칭을 유지하면서도 전통 교회 용어를 피했습니다.
- source_word: קוֹלֵעַ
  english_pob_choice: slinging out
  chosen_korean: 새총으로 내던지듯이 던져 버리고
  alternatives_korean:
  - 새총으로 쏘아 내고
  - 내던지고
  - 내쫓고
  lexicon: HALOT
  rationale: 동사는 단순 추방보다 새총을 던지는 듯한 폭력적 이미지를 담으므로, 그 비유를 한국어로 분명히 드러냈습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the inhabitants of the land
  chosen_korean: 이 땅
  alternatives_korean:
  - 땅
  - 세상
  - 온 땅
  lexicon: HALOT
  rationale: 예레미야의 문맥상 보편적 ‘세상’보다 심판 대상인 유다 땅을 가리키는 ‘이 땅’이 더 정확합니다.
- source_word: וַהֲצֵרוֹתִי
  english_pob_choice: I will press them hard
  chosen_korean: 그들을 심하게 괴롭혀서
  alternatives_korean:
  - 그들을 압박하여
  - 그들을 고통스럽게 하여
  - 그들을 괴롭게 하여
  lexicon: HALOT
  rationale: Hiphil צור의 압박·곤경의 뜻을 살리되, 군사적 세부를 과도하게 특정하지 않도록 ‘심하게 괴롭히다’로 옮겼습니다.
- source_word: לְמַעַן יִמְצָאוּ
  english_pob_choice: so that they may be found
  chosen_korean: 그들이 드러나게 하겠습니다
  alternatives_korean:
  - 그들이 발견되게 하겠습니다
  - 그들이 잡히게 하겠습니다
  - 그들이 찾게 하겠습니다
  lexicon: HALOT
  rationale: 동사의 의미를 ‘발견되다/드러나다’ 쪽으로 살려, 본문의 난해함을 보존하면서도 한국어에서 자연스러운 결과 표현으로 정리했습니다.
theological_decisions:
- issue: יַעֲנַן 결핍? [Not applicable] Ambiguity of לְמַעַן יִמְצָאוּ
  chosen_reading: ‘드러나게 하겠습니다’로 번역해, 심판이 그들을 숨길 수 없게 만든다는 함의를 보존했습니다.
  alternative_readings:
  - 그들이 발견되게 하겠습니다
  - 그들이 잡히게 하겠습니다
  - 그들이 느끼게 하겠습니다
  rationale: 히브리어는 목적절의 동사를 간결하고 모호하게 사용하므로, 해석을 과도하게 확정하지 않고 노출·포착의 뉘앙스를 남겼습니다.
  doctrine_reference: Translation philosophy §3
