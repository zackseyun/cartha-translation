  verdict: revise
  source_fidelity: 수정이 필요합니다. קוֹלֵעַ는 물매를 사용하는 동작을 비유적으로 나타내므로, 초안의 ‘새총으로 내던지듯이 던져 버리고’는 같은 뜻을 중복하여 다소 어색하게 만들며 현대의 기구인 ‘새총’으로 역사적 이미지를 좁힙니다. 또한 יִמְצָאוּ는 형태상 능동 ‘그들이 찾다’이며, 난해하다고 해서 본문에서 수동적 ‘드러나다’로 확정하는 것은 안전하지 않습니다. 목적어를 보충하지 않은 ‘그들이 찾게’와 각주로 난해성을 보존하는 편이 원문에 더 가깝습니다.
  naturalness: ‘물매로 내던지듯이 내던져 버리고’와 같은 중복을 피하고, ‘물매질하듯 내던지고’로 간결하게 다듬었습니다. ‘그들이 찾게 하겠습니다’는 목적어가 생략되어 다소 긴장을 남기지만, 이것은 원문의 목적어 없는 난해한 표현을 의도적으로 보존한 것입니다.
  terminology: ‘야훼’, ‘이 땅 주민들’, ‘압박하다’는 각각 신명, הָאָרֶץ의 문맥상 범위, Hiphil צור의 압박·곤경 의미를 무리 없이 반영합니다. 불필요한 ‘보라’ 스타일 각주는 삭제하고, 물매 비유와 마지막 절의 난해성에만 각주를 둡니다.
