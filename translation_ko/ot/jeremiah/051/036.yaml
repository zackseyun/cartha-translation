source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי רָב֙ אֶת רִיבֵ֔/ךְ וְ/נִקַּמְתִּ֖י אֶת נִקְמָתֵ֑/ךְ וְ/הַחֲרַבְתִּי֙ אֶת יַמָּ֔/הּ וְ/הֹבַשְׁתִּ֖י אֶת מְקוֹרָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
  footnotes:
  - marker: a
    text: 'Or ''contend for your cause.'' The Hebrew uses a legal-dispute idiom: ''I am pleading your case.'''
    reason: lexical_alternative
  - marker: b
    text: 'Or ''I will dry up its sea.'' The Hebrew personifies Babylon as feminine: ''her sea.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'her fountain' or 'her source.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. “보라[a], 내가 네 송사를 변호하고[b] 네 원한을 갚아 주겠다. 내가 그녀의 바다를 말리고[d] 그녀의 샘을 마르게 하겠다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 “보라, 내가”는 야훼께서 직접 행동하실 것을 엄숙하게 선언하는 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 법적 분쟁 관용구를 사용합니다. 직역하면 “네 송사를 변호한다”는 뜻입니다.
    reason: source_note
  - marker: c
    text: 또는 “그녀의 샘물” 또는 “그녀의 근원”으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 바빌론을 여성형으로 의인화하여 “그녀의 바다”라고 말합니다.
    reason: lexical_alternative
