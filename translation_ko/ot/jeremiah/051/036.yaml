  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי רָב֙ אֶת רִיבֵ֔/ךְ וְ/נִקַּמְתִּ֖י אֶת נִקְמָתֵ֑/ךְ וְ/הַחֲרַבְתִּי֙ אֶת יַמָּ֔/הּ וְ/הֹבַשְׁתִּ֖י אֶת מְקוֹרָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
  footnotes:
  - marker: a
    text: 'Or ''contend for your cause.'' The Hebrew uses a legal-dispute idiom: ''I am pleading your case.'''
    reason: lexical_alternative
  - marker: b
    text: 'Or ''I will dry up its sea.'' The Hebrew personifies Babylon as feminine: ''her sea.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'her fountain' or 'her source.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. 「보라, 내가 네 송사를 변호하고 너를 위해 보복하겠다. 내가 그 바다를 말리고 그 샘을 마르게 하겠다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 법적 분쟁 관용구를 사용합니다. 직역하면 “네 송사를 변호한다”는 뜻입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 바빌론을 여성형으로 의인화합니다. 여기서는 “그 바다”로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그 샘”, “그 근원”으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그런즉
  lexicon: HALOT
  rationale: 앞선 문맥에 대한 결론을 잇는 접속사로, 예언 문맥에서 자연스럽고 격식 있는 표지입니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하시기를 이와 같으니
  - 주님께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 수식어 공식의 직접 대응으로, POB의 יְהוָה 원칙에 따라 야훼를 사용했습니다.
- source_word: רָב אֶת רִיבֵךְ
  english_pob_choice: plead your case
  chosen_korean: 네 송사를 변호하고
  alternatives_korean:
  - 네 사건을 변론하고
  - 네 다툼을 변호하고
  lexicon: HALOT
  rationale: 법정적 분쟁 관용구를 살려, 단순히 '대변하다'보다 송사·변호의 사법적 뉘앙스를 드러냈습니다.
- source_word: וְנִקַּמְתִּי אֶת נִקְמָתֵךְ
  english_pob_choice: take vengeance for you
  chosen_korean: 너를 위해 보복하겠다
  alternatives_korean:
  - 너의 원수를 갚겠다
  - 너를 대신해 원수를 갚겠다
  lexicon: HALOT
  rationale: נָקַם 계열의 보복/응징 의미를 직접 살리되, 한국어에서는 '보복하다'가 가장 간결하게 대응합니다.
- source_word: וְהַחֲרַבְתִּי אֶת יַמָּהּ
  english_pob_choice: I will dry up her sea
  chosen_korean: 내가 그 바다를 말리고
  alternatives_korean:
  - 내가 그 바다를 마르게 하고
  - 내가 그 바다를 소멸시키고
  lexicon: HALOT
  rationale: מחרב은 여기서 물을 말라가게 하는 이미지이므로, 일반적인 '황폐하게 하다'보다 '말리다'가 문맥에 더 맞습니다.
- source_word: וְהֹבַשְׁתִּי אֶת מְקוֹרָהּ
  english_pob_choice: make her spring dry
  chosen_korean: 그 샘을 마르게 하겠다
  alternatives_korean:
  - 그 샘을 말리겠다
  - 그 샘의 근원을 마르게 하겠다
  lexicon: HALOT
  rationale: מְקוֹרָהּ는 물의 근원인 샘/용천을 뜻하므로, 한국어로는 '샘'이 가장 자연스럽고 '마르게 하겠다'가 반복된 수계 이미지를 살립니다.
