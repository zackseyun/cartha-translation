source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּ֥עַל נְשִׂאִ֖ים מִ/קְצֵה אָ֑רֶץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יֹּ֥צֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/016.yaml
  text: At the sound of his voice, a multitude of waters is in the heavens; he makes clouds rise from the ends of the earth; he makes lightning for the rain, and brings out the wind from his storehouses.
  footnotes:
  - marker: a
    text: Or 'vapors' for 'clouds.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from his treasuries.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 음성을 내시면, 하늘에 많은 물이 소란을 일으키며[a], 그는 땅 끝에서 구름을 피어오르게 하시고, 비를 위하여 번개를 만드시며, 그의 창고들에서 바람을 꺼내십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘에 많은 물이 소란을 일으키며’는 ‘하늘에 많은 물이 있으며’ 또는 ‘하늘에 물이 크게 소리 내며’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘창고들’은 ‘곳간들’ 또는 ‘보물창고들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  english_pob_choice: At the sound of his voice
  chosen_korean: 그의 음성의 소리에
  alternatives_korean:
  - 그의 목소리의 소리에
  - 그의 음성이 들릴 때
  lexicon: HALOT
  rationale: לְקוֹל은 ‘~의 소리에/소리로 인해’라는 상황 표시로 읽었고, תִּתּוֹ는 관용적으로 ‘그의 음성’으로 옮겨 원문이 말하는 신적 발화의 울림을 살렸습니다.
- source_word: הֲמוֹן מַיִם
  english_pob_choice: a multitude of waters
  chosen_korean: 물들의 무리가
  alternatives_korean:
  - 물의 큰 소용돌이가
  - 물의 떼가
  lexicon: HALOT
  rationale: הֲמוֹן은 단순한 ‘많음’보다 무더기/혼잡/소란의 뉘앙스를 가지므로, ‘무리’로 옮겨 양과 소리를 함께 남겼습니다.
- source_word: נְשִׂאִים
  english_pob_choice: clouds
  chosen_korean: 구름들을
  alternatives_korean:
  - 안개들을
  - 수증기들을
  lexicon: HALOT
  rationale: 문맥이 폭풍-현현 이미지이므로 ‘구름들’이 가장 자연스럽고, POB 각주가 제시한 ‘vapors’ 가능성은 보류했습니다.
- source_word: מֵאֹצְרֹתָיו
  english_pob_choice: from his storehouses
  chosen_korean: 그의 곳간들에서
  alternatives_korean:
  - 그의 창고들에서
  - 그의 보물창고들에서
  lexicon: HALOT
  rationale: אֹצָרוֹת은 단순 창고보다 ‘저장된 것을 꺼내는 저장소’ 이미지가 강해, 한국어에서도 구체적인 저장 공간인 ‘곳간들’로 옮겨 비유성을 살렸습니다.
theological_decisions:
- issue: 여호와-신현의 시적 자연 묘사 보존
  chosen_reading: 비, 번개, 바람, 구름을 하나님의 주권 아래 있는 창조 질서의 표현으로 유지하고, 시적 이미지를 평이한 설명문으로 평탄화하지 않았습니다.
  alternative_readings:
  - 기상 현상에 대한 단순 서술로 축소하기
  - 은유를 지나치게 풀어 설명하기
  rationale: 히브리어는 우주적 자연 현상을 통해 하나님의 능력을 드러내는 시적 문맥이므로, 한국어도 이미지를 유지하는 것이 원문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 시적 신현 묘사, 창조 섭리
