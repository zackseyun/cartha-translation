  to: 그가 음성을 내시면, 하늘에 많은 물이 소란을 일으키며[a], 그는 땅 끝에서 구름을 피어오르게 하시고, 비를 위하여 번개를 만드시며, 그의 창고들에서 바람을 꺼내십니다.[b]
