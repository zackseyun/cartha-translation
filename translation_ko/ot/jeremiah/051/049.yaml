id: JER.51.49
reference: Jeremiah 51:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם בָּבֶ֕ל לִ/נְפֹּ֖ל חַֽלְלֵ֣י יִשְׂרָאֵ֑ל גַּם לְ/בָבֶ֥ל נָפְל֖וּ חַֽלְלֵ֥י כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/049.yaml
  text: Babylon also must fall for the slain of Israel[a], just as the slain of all the earth have fallen for Babylon.
  footnotes:
  - marker: a
    text: Or, 'Babylon also has fallen, you slain of Israel'; the Hebrew syntax of the first clause is compressed and has been understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 바빌론도 이스라엘 백성 가운데 죽임당한 이들 때문에 무너져야 합니다. 바빌론 때문에 온 땅의 죽임당한 이들이 쓰러진 것처럼 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 절의 히브리어 구문은 매우 압축되어 있습니다. 따라서 “바빌론도 이스라엘 백성 가운데 죽임당한 이들 때문에 무너져야 합니다” 외에, “바빌론도 쓰러졌습니다, 이스라엘의 죽임당한 이들이여”처럼 이해할 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּבֶל
  english_pob_choice: Babylon
  chosen_korean: 바빌론
  alternatives_korean:
  - 바벨
  lexicon: HALOT
  rationale: 지명 בָּבֶל의 표준 음역을 따랐습니다. 한국어 성경에서 익숙한 전통형 '바벨'도 가능하지만, 이 역본은 원어 음가를 더 직접 반영하는 '바빌론'을 택했습니다.
- source_word: לִ/נְפֹּל
  english_pob_choice: must fall
  chosen_korean: 무너져야 합니다
  alternatives_korean:
  - 떨어져야 합니다
  - 반드시 망해야 합니다
  lexicon: HALOT
  rationale: 문맥상 예언적 필연과 심판의 결과를 나타내므로, 단순한 '떨어지다'보다 한국어에서 더 자연스럽게 판단과 붕괴를 드러내는 '무너지다'를 사용했습니다.
- source_word: חַלְלֵי יִשְׂרָאֵל
  english_pob_choice: the slain of Israel
  chosen_korean: 이스라엘의 죽임당한 자들
  alternatives_korean:
  - 이스라엘의 죽은 자들
  - 이스라엘의 살해된 자들
  lexicon: HALOT
  rationale: חַלְלֵי는 전쟁·심판 맥락의 '죽임당한 자들'로 옮기는 것이 원어의 수동성과 폭력성을 가장 잘 보존합니다. '죽은 자들'은 이 뉘앙스를 약화합니다.
- source_word: חַלְלֵי כָל הָאָרֶץ
  english_pob_choice: the slain of all the earth
  chosen_korean: 온 땅의 죽임당한 자들
  alternatives_korean:
  - 온 세상의 죽임당한 자들
  - 온 땅에서 죽임당한 자들
  lexicon: HALOT
  rationale: אָֽרֶץ는 여기서 문맥상 지리적 '땅'을 넘어 범위를 확장하는 표현으로 읽히며, '온 땅'은 POB의 'all the earth'를 직역하면서도 한국어로 자연스럽습니다.
theological_decisions:
- issue: 첫 절의 압축된 히브리어 구문과 관계절 처리
  chosen_reading: 첫 절을 원인/책임 관계로 풀어 '바빌론도 이스라엘의 죽임당한 자들 때문에 무너져야 합니다'로 옮겼습니다.
  alternative_readings:
  - '''바빌론도 이스라엘의 죽임당한 자들에 의해 무너져야 합니다'''
  - '''바빌론도 이스라엘의 죽임당한 자들을 위해 무너져야 합니다'''
  rationale: 히브리어는 매우 압축되어 있어 'for the slain of Israel'의 관계를 단정적으로 한 방식으로만 고정하기 어렵습니다. POB의 주해처럼 대안 읽기가 가능하므로, 심판의 책임/보복 관계를 드러내는 번역을 본문에 두되 과도한 해석은 피했습니다.
  doctrine_reference: 예언 문맥의 심판과 보응
- issue: אָרֶץ의 범위
  chosen_reading: '''온 땅''으로 옮겨, 바빌론의 폭력이 이스라엘을 넘어 더 넓은 범위의 피흘림과 연결됨을 살렸습니다.'
  alternative_readings:
  - '''온 나라'''
  - '''온 땅/땅 전체'''
  rationale: 이 본문은 바빌론의 제국적 폭력을 대조적으로 확장해 말하므로, '땅'의 지역적 의미보다 보편적 범위를 드러내는 번역이 더 적절합니다.
  doctrine_reference: 예언 시의 과장법과 보편 심판
- issue: '''fall''의 한국어 표지'
  chosen_reading: '''무너져야 합니다''를 사용해 심판받는 도시의 붕괴를 표현했습니다.'
  alternative_readings:
  - '''떨어져야 합니다'''
  - '''망해야 합니다'''
  rationale: 도시·제국의 멸망을 말할 때 '무너지다'는 물리적 붕괴와 정치적 몰락을 함께 담아 원문의 예언적 힘을 가장 잘 전달합니다.
  doctrine_reference: 바벨론 심판 예언
