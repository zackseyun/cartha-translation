revisions:
- from: 바빌론도 이스라엘의 죽임당한 자들 때문에 무너져야 합니다. 마치 바빌론 때문에 온 땅의 죽임당한 자들이 무너진 것과 같습니다.[a]
  to: 바빌론도 이스라엘 백성 가운데 죽임당한 이들 때문에 무너져야 합니다. 바빌론 때문에 온 땅의 죽임당한 이들이 쓰러진 것처럼 말입니다.[a]
  rationale: 바빌론의 심판을 나타내는 첫 절의 ‘무너져야 합니다’는 유지했습니다. 둘째 절에서는 ‘쓰러지다’를 사용하여, 바빌론 때문에 각지에서 사람들이 전쟁과 폭력으로 죽게 된다는 원문의 병행을 자연스럽고 정확하게 살렸습니다. 첫 절의 압축된 히브리어 구문은 본문에서 과도하게 해석하지 않고, 대안적 이해는 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
