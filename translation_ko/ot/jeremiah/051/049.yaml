  source_fidelity: 첫 절의 לְנְפֹל은 바빌론의 몰락을 가리키므로 ‘무너져야 합니다’는 적절합니다. 그러나 둘째 절의 נָפְלוּ는 ‘죽임당한 자들’에 대해 쓰여 전쟁에서 쓰러져 죽는다는 뜻인데, 초안의 ‘죽임당한 자들이 무너진’은 도시·제국의 붕괴를 뜻하는 표현처럼 들려 원문의 의미와 평행을 훼손합니다. ‘쓰러졌다’로 구별해야 합니다.
  naturalness: ‘이스라엘의 죽임당한 자들’은 이해할 수 있으나 현대 한국어에서는 ‘이스라엘 백성 가운데 죽임당한 이들’이 더 자연스럽습니다. 비교 연결도 ‘마치 … 것과 같습니다’보다 ‘… 것처럼’으로 한 문장 안에 처리하는 편이 간결하고 자연스럽습니다.
  terminology: ‘바빌론’, ‘이스라엘’, ‘온 땅’은 일관되고 적절합니다. חֲלָלִים은 전쟁·폭력으로 죽은 이들을 뜻하므로 ‘죽임당한 이들’로 유지합니다. 다만 둘째 절의 동사는 도시의 ‘무너지다’가 아니라 사람들의 ‘쓰러지다’로 옮깁니다.
