  - 너를 불탄 산으로 만들겠습니다
  lexicon: HALOT
  rationale: שְׂרֵפָה의 결과 상태를 살려 '불탄 산'으로 옮기되, חסר사적/축약적 표현의 압축성을 유지했습니다.
