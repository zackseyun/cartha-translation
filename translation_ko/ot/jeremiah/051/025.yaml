    rationale: סְלָעִים은 바위, 바위 절벽, 험한 바위 지대를 뜻하며 ‘틈’이라는 의미는 본문에 없습니다. ‘바위들에서’로 옮겨 원문의 지형 이미지를 보존하는 것이 안전합니다.
  - severity: low
    issue: 각주 a의 대안 표현 중복
