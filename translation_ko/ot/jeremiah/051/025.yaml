source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלֶ֜י/ךָ הַ֤ר הַ/מַּשְׁחִית֙ נְאֻם יְהוָ֔ה הַ/מַּשְׁחִ֖ית אֶת כָּל הָ/אָ֑רֶץ וְ/נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וְ/גִלְגַּלְתִּ֨י/ךָ֙ מִן הַ/סְּלָעִ֔ים וּ/נְתַתִּ֖י/ךָ לְ/הַ֥ר שְׂרֵפָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/025.yaml
  text: Behold, I am against you, O destroying mountain, declares Yahweh, which destroys the whole earth. I will stretch out my hand against you, and roll you down from the crags, and make you a burned mountain.
  footnotes:
  - marker: a
    text: Or 'the whole land.' Hebrew אֶרֶץ can mean either 'land' or 'earth,' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'make you a mountain of burning' or 'a burnt mountain.' The Hebrew phrase is compact and may emphasize either the process of burning or the resulting burned state.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 나는 너를 대적합니다, 파괴하는 산아—온 땅을 파괴하는 자라고 여호와께서 선언하십니다. 내가 내 손을 네 위로 뻗고, 너를 바위틈에서 굴려 내리며, 너를 불탄 산이 되게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅’입니다. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘땅/세상’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불타는 산’ 또는 ‘불탄 산’입니다. 히브리어 표현이 매우 압축적이어서, 불타는 과정인지 불탄 결과인지 둘 다 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  english_pob_choice: Behold, I am against you
  chosen_korean: 보십시오, 나는 너를 대적합니다
  alternatives_korean:
  - 보라, 나는 너를 대적합니다
  - 보십시오, 내가 너를 거슬러 있습니다
  lexicon: HALOT
  rationale: 예언적 경고의 직접성과 엄숙함을 살리기 위해 감탄사적 호소를 넣었고, אֵלֶיךָ의 대립 관계는 '대적합니다'로 자연스럽게 옮겼습니다.
- source_word: הַמַּשְׁחִית
  english_pob_choice: destroying
  chosen_korean: 파괴하는
  alternatives_korean:
  - 멸망시키는
  - 훼멸하는
  lexicon: HALOT
  rationale: 산을 수식하는 פעול/분사적 용법을 살려 능동적 진행성을 유지했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the whole earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 온 땅과 세상
  lexicon: HALOT
  rationale: 문맥상 바벨론의 파괴가 미치는 범위를 넓게 보되, '땅/earth'의 뜻을 유지하기 위해 '온 땅'으로 옮겼습니다.
- source_word: וְגִלְגַּלְתִּיךָ מִן הַסְּלָעִים
  english_pob_choice: roll you down from the crags
  chosen_korean: 너를 바위틈에서 굴려 내리며
  alternatives_korean:
  - 너를 바위에서 굴려 내리며
  - 너를 절벽에서 굴려 내리며
  lexicon: HALOT
  rationale: גָּלַל의 굴림 이미지를 보존하되, סְלָעִים을 한국어에서 가장 자연스럽게 그려 주는 '바위틈'을 택했습니다.
- source_word: וּנְתַתִּיךָ לְהַר שְׂרֵפָה
  english_pob_choice: make you a burned mountain
  chosen_korean: 너를 불탄 산이 되게 하겠습니다
  alternatives_korean:
  - 너를 불타는 산이 되게 하겠습니다
  - 너를 불탄 산으로 만들겠습니다
  lexicon: HALOT
  rationale: שְׂרֵפָה의 결과 상태를 살려 '불탄 산'으로 옮기되, חסר사적/축약적 표현의 압축성을 유지했습니다.
