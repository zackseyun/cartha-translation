id: JER.51.39
reference: Jeremiah 51:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/חֻמָּ֞/ם אָשִׁ֣ית אֶת מִשְׁתֵּי/הֶ֗ם וְ/הִשְׁכַּרְתִּי/ם֙ לְמַ֣עַן יַעֲלֹ֔זוּ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/039.yaml
  text: When they are heated, I will set out their drink and make them drunk, so that they may exult, then sleep an everlasting sleep and not wake up, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'their feast' or 'their banquet' for 'their drink' (מִשְׁתֵּיהֶם); the Hebrew term can denote a drinking feast.
    reason: lexical_alternative
  - marker: b
    text: '''Everlasting sleep'' is a Hebrew metaphor for irreversible death under judgment; literally, ''sleep of perpetuity.'''
    reason: cultural_note
translation:
  language: ko
  text: 그들이 달아오를 때에, 내가 그들의 마실 것[a]을 마련하고 그들을 취하게 하겠습니다. 그리하여 그들이 환호하고 영원한 잠[b]을 자며 깨어나지 않게 하겠습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: מִשְׁתֵּיהֶם은 ‘그들의 술자리’ 또는 ‘그들의 연회’로도 옮길 수 있습니다. 이 말은 마시는 것과 술 마시는 잔치를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원한 잠’은 문자적으로 ‘영속의 잠’입니다. 이 심판 문맥에서는 되돌릴 수 없는 죽음을 비유적으로 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחֻמָּם
  english_pob_choice: When they are heated
  chosen_korean: 그들이 열기로 달아오르면
  alternatives_korean:
  - 그들이 뜨거워지면
  - 그들이 흥분하면
  lexicon: WLC + HALOT
  rationale: 문맥상 단순한 온도보다 격정적 흥분과 취기가 함께 겹친 상태를 가리키므로, ‘열기로 달아오르다’로 옮겨 원문의 상태와 비유적 뉘앙스를 함께 살렸습니다.
- source_word: מִשְׁתֵּיהֶם
  english_pob_choice: their drink
  chosen_korean: 그들의 잔을
  alternatives_korean:
  - 그들의 마실 것을
  - 그들의 잔치 음식을
  lexicon: WLC + HALOT
  rationale: מִשְׁתֶּה는 잔치/마시는 자리 모두 가능하지만, 이어지는 ‘취하게 하다’와의 직접성을 살리기 위해 ‘잔’으로 옮겼습니다.
- source_word: וְהִשְׁכַּרְתִּים
  english_pob_choice: and make them drunk
  chosen_korean: 그들을 취하게 하여
  alternatives_korean:
  - 그들을 술에 취하게 하여
  - 그들을 만취하게 하여
  lexicon: WLC + HALOT
  rationale: 히필형의 사역 의미를 반영해 ‘취하게 하다’로 번역했고, 과도한 구어체를 피하면서도 원문의 직접적인 심판 행위를 드러냈습니다.
- source_word: שְׁנַת עוֹלָם
  english_pob_choice: an everlasting sleep
  chosen_korean: 영원한 잠
  alternatives_korean:
  - 영원한 수면
  - 영속하는 잠
  lexicon: WLC + HALOT
  rationale: 이 표현은 회복 불가능한 죽음의 비유이므로, 비유를 지우지 않으면서도 한국어에서 자연스러운 ‘영원한 잠’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름과 예언 공식
  chosen_reading: ‘야훼의 말씀입니다’로 마무리했습니다.
  alternative_readings:
  - ‘주님의 말씀입니다’
  - ‘야훼께서 말씀하십니다’
  rationale: 원문이 직설적으로 יהוה를 사용하므로, 공적 예언 공식에서도 고유 이름을 보존했습니다. 다만 한국어 종결은 예언 선언의 격식을 살려 자연스럽게 정리했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה/YHWH → Yahweh'
