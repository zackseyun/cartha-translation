  - 박살내고
  - 조각내고
  lexicon: HALOT
  rationale: 분쇄·파괴의 강도를 살리기 위해 ‘산산조각 내다’를 택했습니다. 예언적 선언의 힘을 유지하면서도 현대 한국어로 자연스럽습니다.
- source_word: הִשְׁחַתִּי
  english_pob_choice: I destroy
  chosen_korean: 멸망시킵니다
  alternatives_korean:
  - 파괴합니다
  - 황폐하게 합니다
  - 무너뜨립니다
  lexicon: HALOT
  rationale: 히필형의 ‘파멸시키다’는 단순한 손상보다 강한 파괴를 뜻하므로 ‘멸망시킵니다’로 옮겼습니다. 앞의 ‘산산조각 내다’와 평행을 이룹니다.
