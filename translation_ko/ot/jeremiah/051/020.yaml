  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַפֵּץ אַתָּ֣ה לִ֔/י כְּלֵ֖י מִלְחָמָ֑ה וְ/נִפַּצְתִּ֤י בְ/ךָ֙ גּוֹיִ֔ם וְ/הִשְׁחַתִּ֥י בְ/ךָ֖ מַמְלָכֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/020.yaml
  text: You are my war club[a], my weapon of battle; with you I shatter nations[b], and with you I destroy kingdoms.
  footnotes:
  - marker: a
    text: Or 'battle-axe' or 'hammer' for 'war club'; the Hebrew denotes a smashing weapon.
    reason: lexical_alternative
  - marker: b
    text: The 'you' is singular. The referent is not named in this verse; interpreters variously identify it as Babylon, Cyrus/Medo-Persia, or Israel/Jacob from the surrounding context.
    reason: alternative_reading
translation:
  language: ko
  text: 당신은 나의 전쟁 몽둥이요, 나의 전투용 기구입니다. 당신을 통해 내가 민족들을 산산조각 내고, 당신을 통해 내가 왕국들을 멸망시킵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘전쟁 몽둥이’이며, 히브리어는 ‘부수는 무기’라는 넓은 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘당신’은 단수입니다. 이 대상은 본문에서 이름이 주어지지 않으며, 해석자들은 바빌론, 고레스/메대-페르시아, 또는 주변 문맥의 이스라엘/야곱으로 다양하게 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַפֵּץ
  english_pob_choice: war club
  chosen_korean: 전쟁 몽둥이
  alternatives_korean:
  - 전투 도끼
  - 망치
  - 몽둥이
  lexicon: HALOT
  rationale: 문맥상 ‘부수는 도구’라는 점을 살리면서도, 군사적 용도를 드러내기 위해 ‘전쟁 몽둥이’로 옮겼습니다. ‘도끼’나 ‘망치’는 너무 구체적이어서 원문의 넓은 의미를 좁힐 수 있습니다.
- source_word: כְּלֵי מִלְחָמָה
  english_pob_choice: weapon of battle
  chosen_korean: 전투용 기구
  alternatives_korean:
  - 전쟁의 무기
  - 전투 무기
  - 전쟁 도구
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁의 기구들’에 가깝지만, 히브리어의 집합적·도구적 뉘앙스를 자연스럽게 살리기 위해 단수형으로 ‘전투용 기구’라고 했습니다.
- source_word: נִפַּצְתִּי
  english_pob_choice: I shatter
  chosen_korean: 산산조각 내고
  alternatives_korean:
  - 산산이 부수고
  - 박살내고
  - 조각내고
  lexicon: HALOT
  rationale: 분쇄·파괴의 강도를 살리기 위해 ‘산산조각 내다’를 택했습니다. 예언적 선언의 힘을 유지하면서도 현대 한국어로 자연스럽습니다.
- source_word: הִשְׁחַתִּי
  english_pob_choice: I destroy
  chosen_korean: 멸망시킵니다
  alternatives_korean:
  - 파괴합니다
  - 황폐하게 합니다
  - 무너뜨립니다
  lexicon: HALOT
  rationale: 히필형의 ‘파멸시키다’는 단순한 손상보다 강한 파괴를 뜻하므로 ‘멸망시킵니다’로 옮겼습니다. 앞의 ‘산산조각 내다’와 평행을 이룹니다.
theological_decisions:
- issue: 두 번째 인칭 단수 대상의 정체를 특정하지 않음
  chosen_reading: 번역문은 2인칭 단수를 그대로 유지하되, 대상의 정체를 명시하지 않았습니다.
  alternative_readings:
  - 바빌론
  - 고레스/메대-페르시아
  - 이스라엘/야곱
  rationale: 히브리어 본문이 대상의 이름을 밝히지 않으며, 문맥상 해석이 갈리므로 번역문에 특정 해석을 주입하지 않았습니다. 이는 원문의 긴장과 애매성을 보존합니다.
  doctrine_reference: 해석 논쟁은 본문 밖 주석으로 남기고, 본문은 애매성을 유지합니다.
