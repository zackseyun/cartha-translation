id: JER.51.27
reference: Jeremiah 51:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂאוּ נֵ֣ס בָּ/אָ֗רֶץ תִּקְע֨וּ שׁוֹפָ֤ר בַּ/גּוֹיִם֙ קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ גּוֹיִ֔ם הַשְׁמִ֧יעוּ עָלֶ֛י/הָ מַמְלְכ֥וֹת אֲרָרַ֖ט מִנִּ֣י וְ/אַשְׁכְּנָ֑ז פִּקְד֤וּ עָלֶ֨י/הָ֙ טִפְסָ֔ר הַֽעֲלוּ ס֖וּס כְּ/יֶ֥לֶק סָמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/027.yaml
  text: Raise a banner in the land[a]; blow a trumpet among the nations. Consecrate nations against her; summon against her the kingdoms of Ararat, Minni, and Ashkenaz. Appoint a marshal against her[d][c][b]; bring up horses like bristling locusts.
  footnotes:
  - marker: a
    text: Or 'Raise a standard' for 'Raise a banner.'
    reason: lexical_alternative
  - marker: b
    text: '''Consecrate nations against her'' uses warfare language of setting forces apart for battle; it may imply preparation for a holy war.'
    reason: cultural_note
  - marker: c
    text: '''Marshal'' translates a rare term (tiphsar) for an official or military officer; alternatives include ''commander'' or ''recruiting officer.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'like hairy locusts' or 'like rough locusts'; the Hebrew expression is rare and vivid.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅에서 깃발을 세우고[a] 열방 가운데서 나팔을 불어라. 그녀를 대적할 열방을 거룩히 구별하고, 그녀를 대적할 아라랏과 민니와 아스그나스의 왕국들을 불러라. 그녀를 대적할 기병대장을 세우고[c][b] 털이 곤두선 메뚜기처럼 말들을 끌어올려라[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깃발을 세우다’는 ‘Raise a banner’의 자연스러운 한국어 표현입니다. ‘표준을 세우다’도 가능한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 동사는 전쟁을 위한 소집과 준비를 가리키므로, 단순한 종교적 ‘성별’보다 군사적 구별의 뜻이 강합니다.
    reason: theological_note
  - marker: c
    text: ‘기병대장’은 희귀어 טִפְסָר를 풀어 옮긴 표현으로, ‘지휘관’ 또는 ‘장교’도 가능합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 표현은 희귀하며, ‘거친 메뚜기처럼’ 또는 ‘털이 많은 메뚜기처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  english_pob_choice: Raise a banner
  chosen_korean: 깃발을 세우다
  alternatives_korean:
  - 기치를 들어 올리다
  - 표를 세우다
  - 표준을 세우다
  lexicon: HALOT
  rationale: נֵס는 공개적으로 세우는 신호 기둥/깃발을 가리키므로, 군사적 소집의 뜻을 살리면서도 현대 한국어에서 자연스러운 ‘깃발을 세우다’로 옮겼습니다.
- source_word: תִּקְעוּ שׁוֹפָר
  english_pob_choice: blow a trumpet
  chosen_korean: 나팔을 불다
  alternatives_korean:
  - 뿔나팔을 불다
  - 호각을 불다
  lexicon: HALOT
  rationale: שׁוֹפָר는 소집과 경보에 쓰는 뿔나팔이지만, 한국어에서는 군사적 경고의 기능을 살리는 ‘나팔을 불다’가 가장 자연스럽습니다.
- source_word: קַדְּשׁוּ עָלֶיהָ גּוֹיִם
  english_pob_choice: Consecrate nations against her
  chosen_korean: 그녀를 대적할 열방을 거룩히 구별하다
  alternatives_korean:
  - 그녀를 대적할 열국을 성별하다
  - 그녀를 대적할 민족들을 성별하다
  - 그녀를 대적할 열방을 성별하다
  lexicon: HALOT
  rationale: קדשׁ는 전쟁 문맥에서 ‘거룩히 구별하여 전투에 바치다’는 뉘앙스를 가지므로, 일반적인 종교어조로 약화시키지 않으면서도 그 함의를 드러내는 표현을 택했습니다.
- source_word: פִּקְדוּ עָלֶיהָ טִפְסָר
  english_pob_choice: Appoint a marshal against her
  chosen_korean: 그녀를 대적할 기병대장을 세우다
  alternatives_korean:
  - 그녀를 대적할 지휘관을 세우다
  - 그녀를 대적할 장교를 임명하다
  - 그녀를 대적할 마샬을 세우다
  lexicon: HALOT
  rationale: טִפְסָר는 희귀한 외래어 계열의 군사 관료/지휘관을 가리키므로, 의미를 풀어 주되 위계와 군사성을 유지하는 ‘기병대장’을 선택했습니다.
- source_word: כְּיֶלֶק סָמָר
  english_pob_choice: like bristling locusts
  chosen_korean: 털이 곤두선 메뚜기처럼
  alternatives_korean:
  - 거친 메뚜기처럼
  - 털북숭이 메뚜기처럼
  - 솟구친 메뚜기처럼
  lexicon: HALOT
  rationale: 희귀하고 생생한 비유를 살리기 위해, 메뚜기의 거칠고 곤두선 모습을 직접 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 전쟁 소집 문구의 sacral-war 뉘앙스
  chosen_reading: ‘거룩히 구별하다’로 옮기되, 이를 단순한 종교적 축복이 아니라 전투를 위한 구별이라는 뜻으로 읽습니다.
  alternative_readings:
  - ‘성별하다’로 번역하여 더 교회적 어감을 주는 읽기
  - ‘준비하다’로 완화하여 일반 동원으로 읽는 방식
  rationale: 히브리어 קדשׁ는 여기서 전쟁 수행을 위한 구별을 가리키므로, 군사적 심판 선언이라는 문맥을 흐리지 않도록 했습니다.
  doctrine_reference: 예레미야 51장의 바벨론 심판 예언과 전쟁 소집의 예언적 언어
- issue: 아스그나스 등 고유명사의 음역
  chosen_reading: 아라랏, 민니, 아스그나스로 음역해 역사적·지리적 이질감을 보존합니다.
  alternative_readings:
  - 국명 의미를 풀어 설명하는 번역
  - 더 익숙한 성서식 표기와 맞바꾸는 방식
  rationale: 본문은 특정 연합 세력을 지명으로 열거하므로, 독자가 낯섦을 느끼더라도 그 역사적 현실성을 보존하는 것이 적절합니다.
  doctrine_reference: 예언 본문의 역사적 구체성 보존
