  source_fidelity: ‘기병대장’은 희귀어 טִפְסָר의 뜻을 지나치게 좁혀, 본문에 없는 기병 지휘관이라는 정보를 더합니다. 또한 הַעֲלוּ סוּס는 단순히 ‘끌어올리다’보다 군사적으로 말을 진군시키거나 출동시키라는 명령에 가깝습니다. בָּאָרֶץ는 ‘땅에서’보다 ‘땅에’가 자연스럽고 원문에 더 가깝습니다.
  naturalness: 명령문의 합쇼체와 병렬을 유지하면서 ‘말들을 진군시켜라’로 군사적 문맥을 자연스럽게 드러냈습니다. ‘그녀’는 원문의 여성 단수 대상을 보존하되, 한국어의 반복을 줄이기 위해 필요한 범위에서만 사용했습니다.
