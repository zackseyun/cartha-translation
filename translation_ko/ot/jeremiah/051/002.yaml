id: JER.51.2
reference: Jeremiah 51:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּ֨י לְ/בָבֶ֤ל זָרִים֙ וְ/זֵר֔וּ/הָ וִ/יבֹקְק֖וּ אֶת אַרְצָ֑/הּ כִּֽי הָי֥וּ עָלֶ֛י/הָ מִ/סָּבִ֖יב בְּ/י֥וֹם רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/002.yaml
  text: And I will send strangers against Babylon, and they will winnow her and empty her land, for they will be against her from every side in the day of disaster.
  footnotes:
  - marker: a
    text: Or “foreigners” for “strangers.” The Hebrew refers to outsiders sent against Babylon.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered “winnow” can also be understood more generally as “scatter,” but the agricultural image is likely intentional.
    reason: lexical_alternative
  - marker: c
    text: “In the day of disaster” means the time when calamity falls on Babylon, not a day characterized by moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바벨에 낯선 이들을 보내리니, 그들이 바벨을 키질하고 그 땅을 비워 버릴 것입니다. 그들이 사방에서 그를 대적하는 것은 재앙의 날이기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘낯선 이들’은 영어 POB의 “strangers”에 해당하며, 히브리어는 바벨 밖의 외부 세력을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘키질하다’는 ‘흩다/흩어버리다’보다 원문의 농업적 비유를 더 직접적으로 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘재앙의 날’은 ‘악의 날’이 아니라 바벨에 닥칠 재난의 때를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי לְבָבֶל
  english_pob_choice: And I will send strangers against Babylon
  chosen_korean: 바벨에 낯선 이들을 보내리니
  alternatives_korean:
  - 바벨에 외국인들을 보내리니
  - 바벨을 향해 낯선 이들을 보내리니
  lexicon: HALOT
  rationale: שׁלח의 파송 의미를 살리되, ל־바벨을 단순한 목적지보다 심판의 대상에 대한 파견으로 이해하여 자연스럽게 옮겼습니다.
- source_word: זָרִים
  english_pob_choice: strangers
  chosen_korean: 낯선 이들
  alternatives_korean:
  - 외국인들
  - 이방인들
  lexicon: HALOT
  rationale: זָרִים의 핵심은 ‘외부자/낯선 사람들’이므로, 교회적 전통어보다 원어의 거리감을 살린 표현을 택했습니다.
- source_word: וְזֵרוּהָ
  english_pob_choice: they will winnow her
  chosen_korean: 그들이 바벨을 키질하고
  alternatives_korean:
  - 그들이 바벨을 흩고
  - 그들이 바벨을 까부르고
  lexicon: HALOT
  rationale: זרה의 농업적 이미지를 유지하여 ‘키질하다’로 옮겼고, 대상이 도시 자체이므로 목적어를 명시했습니다.
- source_word: וִיבֹקְקוּ אֶת אַרְצָהּ
  english_pob_choice: and empty her land
  chosen_korean: 그 땅을 비워 버릴 것입니다
  alternatives_korean:
  - 그 땅을 공허하게 만들 것입니다
  - 그 땅을 황폐하게 할 것입니다
  lexicon: HALOT
  rationale: בקק의 ‘비우다/텅 비게 하다’는 구체적 이미지를 살리면서, 문맥상 파괴의 결과를 한국어로 자연스럽게 표현했습니다.
- source_word: בְּיוֹם רָעָה
  english_pob_choice: in the day of disaster
  chosen_korean: 재앙의 날
  alternatives_korean:
  - 재난의 날
  - 화가 닥치는 날
  lexicon: HALOT
  rationale: רָעָה를 도덕적 ‘악’이 아니라 닥쳐오는 재앙으로 이해하여, 오해를 줄이는 표현을 선택했습니다.
theological_decisions:
- issue: 원문 재앙 경고문의 시간·상황 표지
  chosen_reading: ‘재앙의 날’은 바벨에 재난이 닥치는 때를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - ‘악한 날’처럼 도덕적 악의 날로 읽는 해석
  rationale: 문맥이 심판 선포이므로 רָעָה는 윤리적 악보다 사건적 재앙을 뜻하는 것으로 이해하는 것이 원문과 더 잘 맞습니다.
  doctrine_reference: 예레미야 51장의 바벨 심판 신탁
- issue: 사방에서 대적함의 주체 지시
  chosen_reading: ‘그들’은 앞의 낯선 이들을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 문법적으로 단수 도시 바벨에 맞추어 ‘그를’로 읽는 방식
  rationale: 히브리어 복수 주어가 앞절의 파송된 자들과 연결되므로, 한국어에서는 주어 일치를 유지했습니다.
  doctrine_reference: 히브리어 담화 연결
