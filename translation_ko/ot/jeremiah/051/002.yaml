    rationale: 초안은 ‘그들이 … 대적하는 것은 재앙의 날이기 때문’이라고 하여 재앙의 날을 대적 행위의 원인으로 만듭니다. 원문은 ‘재앙의 날에 그들이 사방에서 그녀를 대적할 것이기 때문에’라는 심판 선언의 근거/상황 설명입니다.
