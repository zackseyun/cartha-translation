base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/042.yaml
  text: The sea has come up against Babylon[b][a]; she is covered with the multitude of its waves.
  footnotes:
  - marker: a
    text: The image of 'the sea' is metaphorical for the overwhelming force coming against Babylon; the translation preserves the metaphor rather than replacing it with an interpretation.
    reason: cultural_note
  - marker: b
    text: Or 'with the tumult of its waves.' The Hebrew noun can denote both noise/tumult and a great multitude.
    reason: lexical_alternative
translation:
  language: ko
  text: 바다가 바빌론을 향해 밀려왔습니다[a]. 바빌론은 그 수많은 물결에 덮였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘바다’는 바빌론을 압도해 오는 세력을 가리키는 비유적 표현입니다. 본문은 이 이미지를 해석으로 바꾸지 않고 유지합니다.
    reason: cultural_note
  - marker: b
    text: ‘수많은’으로 옮긴 히브리어는 ‘소리’ 또는 ‘소란’도 뜻할 수 있습니다. 따라서 ‘그 물결의 요란함(또는 울림)에 덮였습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עַל
  english_pob_choice: has come up against
  chosen_korean: 향해 올라왔습니다
  alternatives_korean:
  - 바빌론을 치러 올라왔습니다
  - 바빌론 위로 올라왔습니다
  - 바빌론에 대항하여 올라왔습니다
  lexicon: HALOT
  rationale: עלה와 על의 결합은 단순한 이동이 아니라 적대적 접근을 나타내므로, ‘향해 올라왔습니다’로 공격적 움직임을 살리되 한국어 어순은 자연스럽게 했습니다.
- source_word: הַיָּם
  english_pob_choice: The sea
  chosen_korean: 바다
  alternatives_korean:
  - 바다의 물결
  - 큰 바다
  lexicon: HALOT
  rationale: 본문의 바다는 바빌론을 압도하는 세력의 비유이므로, 주석적 해석으로 바꾸지 않고 상징 이미지를 그대로 살려 ‘바다’로 옮겼습니다.
- source_word: בַּהֲמוֹן גַּלָּיו
  english_pob_choice: with the multitude of its waves
  chosen_korean: 그 물결의 엄청난 양
  alternatives_korean:
  - 그 물결의 떼로
  - 그 물결의 소란으로
  - 그 물결의 물결치는 많음으로
  lexicon: HALOT
  rationale: הֲמוֹן은 ‘무리, 엄청난 양, 소란’의 폭을 가지므로, 여기서는 파도 이미지와 맞는 ‘엄청난 양’으로 번역해 수적 압도감을 드러냈습니다.
- source_word: נִכְסָתָה
  english_pob_choice: she is covered
  chosen_korean: 덮였습니다
  alternatives_korean:
  - 가려졌습니다
  - 뒤덮였습니다
  lexicon: HALOT
  rationale: 니팔 완료형의 수동 의미를 살려, 바빌론이 바다의 파도에 의해 완전히 가려지는 모습을 ‘덮였습니다’로 간결하게 표현했습니다.
theological_decisions:
- issue: 바다의 비유를 본문에서 유지할지 해석으로 바꿀지
  chosen_reading: ‘바다’ 이미지를 그대로 유지해 바빌론을 압도하는 심판 세력의 비유를 본문 차원에서 보이게 했습니다.
  alternative_readings:
  - ‘큰 군대가’로 풀이
  - ‘홍수’로 의역
  rationale: 영어 POB가 비유를 본문에서 보존하듯, 원문도 해석을 앞세우지 않고 독자가 이미지 자체를 읽도록 두는 것이 더 충실합니다.
  doctrine_reference: 예언서의 상징적 심판 이미지 해석 원칙
