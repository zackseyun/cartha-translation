language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בַּת בָּבֶ֕ל כְּ/גֹ֖רֶן עֵ֣ת הִדְרִיכָ֑/הּ ע֣וֹד מְעַ֔ט וּ/בָ֥אָה עֵֽת הַ/קָּצִ֖יר לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/033.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: The daughter of Babylon is like a threshing floor at the time it is trodden; yet a little while, and the time of harvest will come for her.'
  footnotes:
  - marker: a
    text: Or 'when one treads her'; the Hebrew verb can be rendered more literally with an unspecified subject.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 「바벨론의 딸은 밟을 때가 된 타작마당과 같습니다. 조금만 더 지나면 그녀에게 추수의 때가 닥칠 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 누가 바벨론을 밟는지 명시하지 않습니다. 따라서 ‘밟을 때가 된’은 더 문자적으로 ‘그녀를 밟을 때’ 또는 ‘그녀가 밟히는 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 고유한 언약 이름은 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת는 천상·지상의 군대를 포괄하는 관용적 칭호로서 ‘만군의’가 가장 투명합니다.
- source_word: בַּת בָּבֶל
  english_pob_choice: The daughter of Babylon
  chosen_korean: 바벨론의 딸
  alternatives_korean:
  - 바벨론 딸
  - 바벨론
  lexicon: HALOT
  rationale: 도시/제국을 여성화한 예언적 의인화를 유지해야 하므로 단순히 ‘바벨론’으로 평면화하지 않고 소유격 구조로 살렸습니다.
- source_word: כְּגֹרֶן
  english_pob_choice: is like a threshing floor
  chosen_korean: 타작마당 같아서
  alternatives_korean:
  - 타작마당과 같아서
  - 타작마당처럼
  lexicon: HALOT
  rationale: 비교 표지 כ를 한국어 자연문으로 살리면서, 농경적 심상을 그대로 보존하는 ‘타작마당’이 가장 적합합니다.
- source_word: עֵת הִדְרִיכָהּ
  english_pob_choice: at the time it is trodden
  chosen_korean: 그것이 밟히는 때가 있습니다
  alternatives_korean:
  - 그것이 짓밟히는 때가 있습니다
  - 밟는 때가 있습니다
  lexicon: HALOT
  rationale: 히필 דרך는 타작마당을 ‘밟다/밟아 짓이기다’의 의미를 가지므로, 주어를 드러내지 않는 수동형으로 옮겨 영어 POB의 여지를 보존했습니다.
- source_word: וּבָאָה עֵת הַקָּצִיר לָהּ
  english_pob_choice: and the time of harvest will come for her
  chosen_korean: 그에게 추수 때가 이릅니다
  alternatives_korean:
  - 그에게 수확 때가 이릅니다
  - 그를 위한 추수 때가 이릅니다
  lexicon: HALOT
  rationale: ‘추수 때’는 보복적 심판 맥락의 농업 은유를 유지하면서도 한국어에서 자연스럽고, לָהּ의 방향성은 ‘그에게’로 옮겨 도래하는 지정 시점을 드러냈습니다.
theological_decisions:
- issue: 타작/추수 이미지의 의미 범위
  chosen_reading: 이 본문은 바벨론에 대한 임박한 심판을 농경 은유로 예고합니다.
  alternative_readings:
  - 중립적인 계절적 추수 진술
  - 번영의 추수 이미지
  rationale: 예레미야 51장의 바벨론 멸망 선고 문맥상, 타작과 추수는 축복이 아니라 심판의 도래를 가리키므로 그 긴장을 본문에 남겼습니다.
  doctrine_reference: 예레미야 51장 문맥
