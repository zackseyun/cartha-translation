source:
  edition: WLC
  text: בֹּ֚שְׁנוּ כִּֽי שָׁמַ֣עְנוּ חֶרְפָּ֔ה כִּסְּתָ֥ה כְלִמָּ֖ה פָּנֵ֑י/נוּ כִּ֚י בָּ֣אוּ זָרִ֔ים עַֽל מִקְדְּשֵׁ֖י בֵּ֥ית יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/051.yaml
  text: We are ashamed, for we have heard reproach; disgrace has covered our faces, for foreigners have come against the holy places of the house of the LORD.
translation:
  language: ko
  text: 우리는 수치를 당합니다. 이는 우리가 수치를 들었기 때문입니다. 치욕이 우리의 얼굴을 덮었습니다. 이는 이방인들이 야훼의 집의 거룩한 곳들을 대적하여 왔기 때문입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 일부 전통 번역은 ‘수치를 당합니다’ 대신 ‘우리가 부끄러워하나이다’로 옮깁니다.
    reason: previous_rendering
lexical_decisions:
- source_word: בֹּשְׁנוּ / We are ashamed
  english_pob_choice: We are ashamed
  chosen_korean: 우리는 수치를 당합니다
  alternatives_korean:
  - 우리는 부끄럽습니다
  - 우리는 수치를 겪습니다
  lexicon: בושׁ
  rationale: 히브리어의 수치/부끄러움의 상태를 자연스러운 합쇼체로 옮기되, 단순 감정 표현보다 공개적 수치의 뉘앙스를 살리기 위해 ‘수치를 당합니다’를 택했습니다.
- source_word: חֶרְפָּה / reproach
  english_pob_choice: reproach
  chosen_korean: 수치를 들었기 때문입니다
  alternatives_korean:
  - 모욕을 들었기 때문입니다
  - 치욕을 들었기 때문입니다
  lexicon: חרפה
  rationale: 직역성만 보이면 ‘모욕’도 가능하지만, 문맥상 앞의 ‘수치’와 병렬되는 공개적 수치의 반복을 살리기 위해 ‘수치를 들었습니다’로 처리했습니다.
- source_word: כִּסְּתָה ... פָּנֵינוּ / has covered our faces
  english_pob_choice: has covered our faces
  chosen_korean: 치욕이 우리의 얼굴을 덮었습니다
  alternatives_korean:
  - 수치가 우리의 얼굴을 덮었습니다
  - 모욕이 우리의 얼굴을 덮었습니다
  lexicon: כסה + פנים
  rationale: ‘얼굴을 덮다’라는 히브리어 관용구를 그대로 살려, 수치가 외적으로 드러난 상태를 표현했습니다.
- source_word: זָרִים / foreigners
  english_pob_choice: foreigners
  chosen_korean: 이방인들이
  alternatives_korean:
  - 외국인들이
  - 낯선 자들이
  lexicon: זר
  rationale: 성소 침범의 문맥에서는 단순 국적보다 언약 밖의 타자를 가리키는 성서적 용례가 강하므로 ‘이방인들’이 더 정확합니다.
- source_word: מִקְדְּשֵׁי בֵית יְהוָה / the holy places of the house of the LORD
  english_pob_choice: the holy places of the house of the LORD
  chosen_korean: 야훼의 집의 거룩한 곳들
  alternatives_korean:
  - 야훼의 집의 성소들
  - 야훼의 집의 거룩한 처소들
  lexicon: מקדש + בית יהוה
  rationale: 복수형 ‘거룩한 곳들’을 유지하고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 성소 침범의 방향성
  chosen_reading: ‘이방인들이 야훼의 집의 거룩한 곳들을 대적하여 왔기 때문입니다’로 옮겨, 단순한 출입이 아니라 적대적 침범이라는 점을 드러냈습니다.
  alternative_readings:
  - 성소 안으로 들어왔기 때문입니다
  - 야훼의 집을 더럽혔기 때문입니다
  rationale: 히브리어 עַל은 여기서 성소를 향한/대적하는 공격성을 띠며, English POB도 ‘came against’로 조정되어 있어 그 대립성을 보존했습니다.
  doctrine_reference: 문맥적/사실적 의미 보존
- issue: 야훼 표기
  chosen_reading: יהוה는 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값과 원문 일치성을 따르며, 성전/언약 맥락에서 신명적 이름을 가리는 관습적 대체어보다 직접 표기를 유지했습니다.
  doctrine_reference: YHWH 표기 정책
