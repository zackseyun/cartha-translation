  source_fidelity: 히브리어의 심판 선언, 벨이 삼킨 것을 그의 입에서 꺼내는 비유, 민족들이 그에게로 흐르는 이미지, 그리고 마지막 완료형의 예언적 확정성을 대체로 충실히 반영합니다. 다만 ‘그의 입에서 삼킨 것’은 한국어에서 ‘입이 삼킨 것’처럼 수식 관계가 잠시 불분명할 수 있으므로, ‘그가 삼킨 것을 그의 입에서’로 분명히 해야 합니다.
  naturalness: ‘흘러들다’는 נהר의 흐름 비유를 자연스럽게 살립니다. ‘그가 삼킨 것을 그의 입에서 꺼내겠습니다’가 원문의 이미지를 유지하면서도 더 명료하고 자연스럽습니다. 각주 표지는 해당 절 바로 뒤에 붙이는 편이 독자의 이해에 적절합니다.
