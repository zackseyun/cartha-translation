source:
  edition: WLC
  text: וּ/פָקַדְתִּ֨י עַל בֵּ֜ל בְּ/בָבֶ֗ל וְ/הֹצֵאתִ֤י אֶת בִּלְע/וֹ֙ מִ/פִּ֔י/ו וְ/לֹֽא יִנְהֲר֥וּ אֵלָ֛י/ו ע֖וֹד גּוֹיִ֑ם גַּם חוֹמַ֥ת בָּבֶ֖ל נָפָֽלָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/044.yaml
  text: And I will punish Bel in Babylon[a], and I will bring out of his mouth what he has swallowed; nations will no longer stream to him[b]. Even the wall of Babylon has fallen.
  footnotes:
  - marker: a
    text: Or 'nations will no longer flow to him.' The Hebrew verb pictures peoples moving like a stream.
    reason: lexical_alternative
  - marker: b
    text: Or 'the wall of Babylon will fall.' Hebrew may use the perfect here prophetically, describing a future event as certain.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 바벨론의 벨을 벌하고, 그의 입에서 삼킨 것을 끌어내겠습니다. 열국은 더 이상 그에게로 흘러들지 않을 것입니다. 바벨론의 성벽도 무너졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘열국은 더 이상 그에게로 흘러들지 않을 것입니다’는 히브리어 동사의 흐름 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무너졌습니다’는 미래 사건을 확정된 일처럼 말하는 예언적 완료를 반영한 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עַל
  english_pob_choice: I will punish
  chosen_korean: 내가 … 벌하고
  alternatives_korean:
  - 내가 … 찾아가겠습니다
  - 내가 … 심판하겠습니다
  lexicon: HALOT
  rationale: פָקַד + עַל의 징벌적 용법을 현대 한국어에서 가장 분명하게 드러내기 위해 ‘벌하다’를 택했습니다.
- source_word: בֵּל
  english_pob_choice: Bel
  chosen_korean: 벨
  alternatives_korean:
  - 베일
  lexicon: HALOT
  rationale: 바벨론 신 이름은 음역해야 하므로 한국어 표기법에 따라 ‘벨’로 옮겼습니다.
- source_word: וְהוֹצֵאתִי אֶת בִּלְע/וֹ מִפִּיו
  english_pob_choice: I will bring out of his mouth what he has swallowed
  chosen_korean: 그의 입에서 삼킨 것을 끌어내겠습니다
  alternatives_korean:
  - 그의 입에서 삼킨 것을 꺼내겠습니다
  - 그가 삼킨 것을 그의 입에서 꺼내겠습니다
  lexicon: HALOT
  rationale: ‘삼킨 것’이라는 이미지를 살리면서 한국어에서 자연스럽고 직접적인 동작 표현인 ‘끌어내다’를 사용했습니다.
- source_word: וְלֹא יִנְהֲרוּ אֵלָיו עוֹד גּוֹיִם
  english_pob_choice: nations will no longer stream to him
  chosen_korean: 열국은 더 이상 그에게로 흘러들지 않을 것입니다
  alternatives_korean:
  - 열국은 더 이상 그에게로 몰려오지 않을 것입니다
  - 열국은 더 이상 그에게로 흐르지 않을 것입니다
  lexicon: HALOT
  rationale: נהר의 유동적 비유를 살려 ‘흘러들다’로 옮기면, 우상에게 향하던 민족들의 집결이 끊기는 이미지를 보존할 수 있습니다.
- source_word: חוֹמַת בָּבֶל
  english_pob_choice: the wall of Babylon
  chosen_korean: 바벨론의 성벽
  alternatives_korean:
  - 바벨론의 벽
  - 바벨론 성벽
  lexicon: HALOT
  rationale: 단수 ‘성벽’을 유지하되 한국어에서는 소유구조를 자연스럽게 ‘바벨론의 성벽’으로 옮겼습니다.
theological_decisions:
- issue: 주어 대명사 ‘그’의 지시 대상
  chosen_reading: 그는 벨, 곧 바벨론의 우상/신을 가리킵니다.
  alternative_readings:
  - 바벨론 자체를 인격화한 표현으로 볼 수 있습니다.
  rationale: 가장 가까운 선행사는 ‘벨’이며, ‘그의 입’과 ‘그에게로 흘러들다’라는 표현이 우상 심판의 맥락에 가장 잘 맞습니다.
  doctrine_reference: 우상 심판과 바벨론 종교 체계의 몰락
- issue: נָפָלָה의 시제
  chosen_reading: ‘무너졌습니다’로 옮겨 예언적 완료를 살렸습니다.
  alternative_readings:
  - ‘무너질 것입니다’로 옮길 수 있습니다.
  rationale: 히브리어 예언 문맥의 완료형을 한국어 현재완료적 진술로 유지하면 선언의 확정성이 더 잘 드러납니다.
  doctrine_reference: 예언적 완료(Prophetic perfect)
