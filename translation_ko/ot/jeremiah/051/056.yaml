id: JER.51.56
reference: Jeremiah 51:56
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ בָ֨א עָלֶ֤י/הָ עַל בָּבֶל֙ שׁוֹדֵ֔ד וְ/נִלְכְּדוּ֙ גִּבּוֹרֶ֔י/הָ חִתְּתָ֖ה קַשְּׁתוֹתָ֑/ם כִּ֣י אֵ֧ל גְּמֻל֛וֹת יְהוָ֖ה שַׁלֵּ֥ם יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/056.yaml
  text: For a destroyer has come against her[a], against Babylon, and her warriors have been captured; their bows are shattered. For Yahweh is a God of recompense[c][b]; he will surely repay.
  footnotes:
  - marker: a
    text: Or 'a plunderer' or 'the devastator.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'mighty men'; here in context, Babylon's fighting men.
    reason: lexical_alternative
  - marker: c
    text: Or 'a God of vengeance.' The Hebrew emphasizes just repayment or requital.
    reason: alternative_reading
translation:
  language: ko
  text: 파괴자가 그 도시를, 곧 바벨론을 치러 왔고[a], 그 용사들은 사로잡혔으며[b], 그들의 활은 부러졌습니다. 야훼는 보응의 하나님이시므로[c], 반드시 갚으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘파괴자’는 ‘약탈자’ 또는 ‘황폐하게 하는 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용사들’은 문자적으로 ‘힘센 자들’입니다. 여기서는 바벨론의 전투병을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘보응의 하나님’은 ‘복수의 하나님’으로도 옮길 수 있습니다. 히브리어는 감정적 보복보다는 마땅한 갚음 또는 응보를 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוֹדֵד
  english_pob_choice: a destroyer
  chosen_korean: 파괴자
  alternatives_korean:
  - 약탈자
  - 황폐하게 하는 자
  lexicon: HALOT
  rationale: 문맥상 전쟁 심판을 실행하는 자를 가리키므로, 영어 POB의 'destroyer'에 맞춰 간결하게 '파괴자'로 옮겼습니다.
- source_word: בָא עָלֶיהָ עַל בָּבֶל
  english_pob_choice: has come against her, against Babylon
  chosen_korean: 바벨론을 향하여, 곧 그 위에 왔고
  alternatives_korean:
  - 그녀에게로, 곧 바벨론에게로 왔고
  - 그 위에, 바벨론 위에 왔고
  lexicon: HALOT
  rationale: עַל의 중첩된 방향성을 살리면서, '그 위에'로 압박과 공격의 뉘앙스를 유지하고 '바벨론'으로 대상이 분명해지게 했습니다.
- source_word: וְנִלְכְּדוּ גִּבּוֹרֶיהָ
  english_pob_choice: and her warriors have been captured
  chosen_korean: 그 용사들이 사로잡혔으며
  alternatives_korean:
  - 그들의 용사들이 붙잡혔으며
  - 그들의 용병들이 사로잡혔으며
  lexicon: HALOT
  rationale: גִּבּוֹרִים의 문자적 의미는 '힘센 자들'이지만, 전투 맥락에서는 바벨론의 전사들을 뜻하므로 '용사들'이 자연스럽습니다.
- source_word: חִתְּתָה קַשְּׁתוֹתָם
  english_pob_choice: their bows are shattered
  chosen_korean: 그들의 활이 꺾였습니다
  alternatives_korean:
  - 그들의 활이 산산이 부서졌습니다
  - 그들의 활이 부러졌습니다
  lexicon: HALOT
  rationale: 동사 חִתֵּת의 깨뜨림/부러뜨림 의미를 살리되, 무기 무력화의 이미지를 한국어에서 간명하게 전달하는 '꺾였습니다'를 택했습니다.
- source_word: אֵל גְּמֻלוֹת
  english_pob_choice: a God of recompense
  chosen_korean: 보응의 하나님
  alternatives_korean:
  - 갚으시는 하나님
  - 보상하시는 하나님
  - 보복의 하나님
  lexicon: HALOT
  rationale: '''recompense''의 핵심은 응보적 보상/되갚음이므로, 전통적이지만 과도하게 감정화되지 않는 ''보응의 하나님''으로 옮겼습니다.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 신명기적 고유명사로서 '야훼'를 사용했습니다.
- source_word: שַׁלֵּם יְשַׁלֵּם
  english_pob_choice: he will surely repay
  chosen_korean: 반드시 갚으실 것입니다
  alternatives_korean:
  - 확실히 갚으실 것입니다
  - 갚고 또 갚으실 것입니다
  lexicon: HALOT
  rationale: 강조형(부정사 절대형+동사형)의 반복을 한국어에서 자연스럽게 압축해 '반드시'로 강조를 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 신명기적 고유명사가 직접 나오므로, 본문에서는 호칭 대체어보다 이름 자체를 살리는 것이 소스-직결 번역 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אֵל גְּמֻלוֹת의 신학적 뉘앙스
  chosen_reading: 보응의 하나님
  alternative_readings:
  - 복수의 하나님
  - 보상하시는 하나님
  rationale: 본문은 단순한 감정적 복수보다 공정한 되갚음과 심판을 말하므로, '보응'이 문맥의 정의성과 상응성을 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
