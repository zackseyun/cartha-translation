id: JER.51.5
reference: Jeremiah 51:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י לֹֽא אַלְמָ֨ן יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ מֵֽ/אֱלֹהָ֔י/ו מֵֽ/יְהוָ֖ה צְבָא֑וֹת כִּ֤י אַרְצָ/ם֙ מָלְאָ֣ה אָשָׁ֔ם מִ/קְּד֖וֹשׁ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/005.yaml
  text: For Israel and Judah are not widowed from their God[a], from Yahweh of Armies[b], though their land is full of guilt against the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'against the Holy One of Israel.' The Hebrew preposition can be understood in more than one way here.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘과 유다는 그들의 하나님, 곧 만군의 야훼[b]에게서 과부가 된 것이 아닙니다. 그들의 땅은 이스라엘의 거룩하신 이 앞에서[a] 죄로 가득하지만 그렇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 거룩하신 이를 거슬러.’ 히브리어 전치사 מִן은 여기서 여러 방식으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '전통적 번역: ‘만군의 주’ 또는 ‘만군의 여호와.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָן
  english_pob_choice: widowed
  chosen_korean: 과부가 된
  alternatives_korean:
  - 버림받은
  - 홀로 남은
  lexicon: HALOT
  rationale: 히브리어 אַלְמָן은 문자적으로 ‘과부가 되다/상실하다’는 뜻이므로, 공동체에 적용된 은유를 살려 ‘과부가 된’으로 옮겼습니다. ‘버림받은’은 관계 단절의 뉘앙스는 있으나 혼인 은유를 약화시킵니다.
- source_word: מֵאֱלֹהָיו
  english_pob_choice: from their God
  chosen_korean: 그들의 하나님에게서
  alternatives_korean:
  - 그들의 하나님으로부터
  - 그들의 하나님에게
  lexicon: HALOT
  rationale: מִן은 여기서 분리/단절의 뜻을 나타내므로 ‘-에게서’가 가장 자연스럽습니다. 영어 POB의 ‘from their God’와 같은 관계 단절 이미지를 한국어로 보존했습니다.
- source_word: מֵיְהוָה צְבָאוֹת
  english_pob_choice: from Yahweh of Armies
  chosen_korean: 곧 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: HALOT
  rationale: YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, צְבָאוֹת는 ‘만군’으로 번역해 ‘야훼’의 군사적/우주적 통치를 드러냈습니다. ‘여호와’는 전통적이지만 본문 직역성과 프로젝트 기준상 채택하지 않았습니다.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  english_pob_choice: the Holy One of Israel
  chosen_korean: 이스라엘의 거룩하신 이
  alternatives_korean:
  - 이스라엘의 거룩하신 분
  - 이스라엘의 성자
  lexicon: HALOT
  rationale: 예언서의 고정 호칭이므로 관용적으로 ‘이스라엘의 거룩하신 이’로 옮겼습니다. ‘거룩하신 분’도 가능하지만 호칭의 압축성과 전통적 인지성을 함께 살리기 위해 ‘이’를 택했습니다.
- source_word: מִקְּדוֹשׁ
  english_pob_choice: before the Holy One of Israel / against the Holy One of Israel
  chosen_korean: 앞에서
  alternatives_korean:
  - 대하여
  - 거슬러
  lexicon: HALOT
  rationale: מִן은 כאן에서 관계/대상을 나타낼 수 있어, 죄가 그분 ‘앞에서’ 드러나는 책임의 맥락을 살렸습니다. 영어 POB의 주석처럼 ‘against’도 가능하지만, 본문은 그 긴장을 단정적으로 해소하지 않으므로 ‘앞에서’로 본문에 두고 주석으로 남기는 편이 적절합니다.
theological_decisions:
- issue: 본문의 מִן을 한국어에서 어떻게 처리할지
  chosen_reading: ‘이스라엘의 거룩하신 이 앞에서 죄로 가득하기는 합니다’로 번역해 책임/대면의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘이스라엘의 거룩하신 이를 거슬러 죄로 가득하기는 합니다’
  - ‘이스라엘의 거룩하신 이에게 대하여 죄로 가득합니다’
  rationale: 본문은 하나님의 언약적 버리지 않으심과 백성의 실제 죄책을 함께 말합니다. ‘앞에서’는 죄의 실재와 하나님의 임재 앞 책임을 드러내면서도, 관계를 단선적으로 ‘대적’으로 고정하지 않아 본문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
