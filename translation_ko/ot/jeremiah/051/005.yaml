  to: 이스라엘과 유다는 그들의 하나님, 곧 만군의 야훼[b]에게서 과부가 된 것이 아닙니다. 그들의 땅은 이스라엘의 거룩하신 이 앞에서[a] 죄로 가득하지만 그렇습니다.
