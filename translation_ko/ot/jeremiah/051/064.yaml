  source_fidelity: 수정이 필요합니다. 초안은 וְאָמַרְתָּ(‘그리고/그때 당신은 말하십시오’)라는 지시를 번역문에서 누락했고, תִּשְׁקַע의 ‘가라앉다’ 이미지를 ‘무너져 내리다’로 바꾸어 앞 절의 두루마리를 강에 가라앉히는 표징 및 ‘다시 일어나지 못하다’의 대조를 약화합니다. 또한 עָלֶיהָ는 여성 단수인 바벨론을 가리키므로 ‘그에게’가 아니라 ‘바벨론에/그 도성에’로 처리해야 합니다.
  naturalness: ‘그리고 이렇게 말하십시오:’와 ‘여기까지가 예레미야의 말씀입니다’는 현대 표준어 합쇼체에서 자연스럽고, 인용된 선언과 편집적 종결 표지를 분명히 구별합니다.
  terminology: ‘바벨론’, ‘재앙’, ‘예레미야’는 적절합니다. ‘가라앉고’는 שקע의 핵심 비유를 보존하며, ‘지칠 것입니다’는 יעף의 의미와 복수형을 무리 없이 반영합니다.
  issues:
