revisions:
- from: “이와 같이 바벨론은 무너져 내리고 다시 일어나지 못할 것입니다. 이는 내가 그에게 가져오는 재앙 때문입니다. 그들은 지칠 것입니다.” 여기에 예레미야의 말씀이 끝납니다.[a]
  to: 그리고 이렇게 말하십시오. “이와 같이 바벨론은 가라앉고, 내가 바벨론에 내리는 재앙 때문에 다시 일어나지 못할 것입니다. 그들은 지칠 것입니다.” 여기까지가 예레미야의 말씀입니다.[a]
  rationale: 명령형 지시를 복원하고, 바벨론의 파멸을 물속으로 ‘가라앉는’ 표징으로 나타내는 히브리어의 비유를 보존했습니다. 재앙의 대상은 바벨론이라고 명시하여 여성 단수 대명사의 지시를 자연스러운 한국어로 처리했으며, 마지막 문장은 본문의 종결 표지로 직역에 가깝게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:36:50Z'
