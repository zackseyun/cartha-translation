reference: Jeremiah 51:64
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כָּ֠כָה תִּשְׁקַ֨ע בָּבֶ֤ל וְ/לֹֽא תָקוּם֙ מִ/פְּנֵ֣י הָ/רָעָ֗ה אֲשֶׁ֧ר אָנֹכִ֛י מֵבִ֥יא עָלֶ֖י/הָ וְ/יָעֵ֑פוּ עַד הֵ֖נָּה דִּבְרֵ֥י יִרְמְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/064.yaml
  text: And you shall say[a], ‘Thus Babylon will sink and will not rise because of the disaster that I am bringing upon her, and they will grow weary.’ Up to this point are the words of Jeremiah.
  footnotes:
  - marker: a
    text: Or 'and they will be exhausted' / 'and they will faint.' The Hebrew verb can denote weariness or exhaustion; the plural likely refers to Babylon's people rather than the city itself.
    reason: lexical_alternative
translation:
  language: ko
  text: “이와 같이 바벨론은 무너져 내리고 다시 일어나지 못할 것입니다. 이는 내가 그에게 가져오는 재앙 때문입니다. 그들은 지칠 것입니다.” 여기에 예레미야의 말씀이 끝납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지칠 것입니다’는 ‘기진할 것입니다’ 또는 ‘기운이 빠질 것입니다’로도 옮길 수 있습니다. 히브리어 동사는 피곤함/소진을 뜻하며, 복수형은 도시 자체보다 바벨론의 사람들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: And you shall say
  chosen_korean: “...이라고 말하십시오” / 인용문 도입으로 처리
  alternatives_korean:
  - “...이라고 말하십시다”
  - “...이라고 말씀하십시오”
  lexicon: HALOT
  rationale: 예언적 지시문맥의 2인칭 남성 단수 명령/미래형을 한국어에서는 직접 화법 도입으로 자연스럽게 옮겨, 본문의 선포 기능을 살렸습니다.
- source_word: תִּשְׁקַע
  english_pob_choice: will sink
  chosen_korean: 무너져 내리고
  alternatives_korean:
  - 가라앉고
  - 잠겨 내리고
  lexicon: HALOT
  rationale: שקע의 핵심 이미지는 아래로 가라앉는 것이지만, 여기서는 바벨론의 몰락을 가리키므로 한국어에서는 심판의 붕괴 이미지를 분명히 하는 ‘무너져 내리다’를 택했습니다.
- source_word: מִפְּנֵי הָרָעָה
  english_pob_choice: because of the disaster
  chosen_korean: 재앙 때문에
  alternatives_korean:
  - 재난 때문에
  - 악 때문에
  lexicon: HALOT
  rationale: 문맥상 הָרָעָה는 도덕적 ‘악’이 아니라 심판으로 닥치는 재앙을 뜻하므로, 신학적 오해를 피하면서도 강도를 유지하는 ‘재앙’을 선택했습니다.
- source_word: וְיָעֵפוּ
  english_pob_choice: and they will grow weary
  chosen_korean: 그들은 지칠 것입니다
  alternatives_korean:
  - 그들은 피곤해질 것입니다
  - 그들은 기진할 것입니다
  lexicon: HALOT
  rationale: 3인칭 복수의 주어가 도시 자체가 아니라 바벨론의 사람들을 가리킬 가능성을 살리기 위해, 한국어도 복수 주어를 분명히 하면서 ‘지치다’로 번역했습니다.
theological_decisions:
- issue: הָרָעָה의 의미 범주
  chosen_reading: ‘재앙’으로 옮겨, 하나님이 도덕적 악을 가져오신다는 오해를 피했습니다.
  alternative_readings:
  - 악
  - 재난
  rationale: 심판 맥락에서 הָרָעָה는 죄악이 아니라 임박한 파멸/재난을 뜻하므로, 본문의 경고성과 하나님의 공의로운 심판을 함께 드러내는 번역이 적절합니다.
  doctrine_reference: 심판 언어의 정확한 전달; 본문 의미 보존 우선 원칙
- issue: 문장 종결부 ‘דִּבְרֵי יִרְמְיָהוּ’
  chosen_reading: ‘여기에 예레미야의 말씀이 끝납니다’로 처리해, 본문 말미의 편집 표지를 드러냈습니다.
  alternative_readings:
  - ‘이것이 예레미야의 말씀이니라’
  - ‘예레미야의 말들입니다’
  rationale: 이 표현은 예언 인용의 결론 표지이므로, 내용 진술이 아니라 단락 종결 신호로 기능하는 점을 한국어에서도 명시하는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문 편집 표지의 기능 보존
