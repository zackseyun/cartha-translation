  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ אֶל שְׂרָיָ֑ה כְּ/בֹאֲ/ךָ֣ בָבֶ֔ל וְֽ/רָאִ֔יתָ וְֽ/קָרָ֔אתָ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/061.yaml
  text: And Jeremiah said to Seraiah[a], “When you come to Babylon, see that you read all these words.”
  footnotes:
  - marker: a
    text: Or, more formally, 'and you shall see, and you shall read all these words.' The Hebrew 'and you will see' likely carries the sense 'see to it' or 'take care' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야가 세라야에게 말했습니다. "네가 바빌론에 도착하면, 이 모든 말을 읽어야 합니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 '보고'는 여기서 단순한 시각 행위보다 '주의해서 처리하다/확실히 하다'의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And Jeremiah said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이어서 말했습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol 서술형 진행을 자연스러운 한국어 서술로 옮기되, 문맥상 불필요한 접속을 줄여 간결하게 표현했습니다.
- source_word: כְּבֹאֲךָ
  english_pob_choice: When you come
  chosen_korean: 네가 ... 도착하면
  alternatives_korean:
  - 네가 ... 올 때
  - 네가 ... 도달하면
  lexicon: HALOT
  rationale: 시간 부사절의 조건/시점 의미를 살려 '도착하면'으로 옮겼고, 단순한 '오다'보다 목적지 도달의 뉘앙스를 조금 더 분명히 했습니다.
- source_word: וְרָאִיתָ
  english_pob_choice: see that
  chosen_korean: —
  alternatives_korean:
  - 보고
  - 주의하여
  lexicon: HALOT
  rationale: 여기서는 독립된 명령 '보다'라기보다 뒤의 명령을 이끄는 관용적 권고로 기능하므로, 한국어에서는 별도 동사로 두지 않고 앞뒤 문맥에 흡수했습니다.
- source_word: וְקָרָאתָ
  english_pob_choice: you read
  chosen_korean: 읽어야 합니다
  alternatives_korean:
  - 읽으십시오
  - 읽게 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 두 번째 동사는 공적 낭독/낭송의 지시로 이해되며, 한국어에서는 직접 명령보다 지시적·권고적 문체가 더 자연스러워 '읽어야 합니다'로 옮겼습니다.
theological_decisions:
- issue: 히브리어 두 동사 וְרָאִיתָ + וְקָרָאתָ의 관계
  chosen_reading: '''보다''를 별도 행위로 강조하지 않고, 읽기 지시를 돕는 관용적 도입으로 처리했습니다.'
  alternative_readings:
  - '''그때 너는 보고 이 모든 말을 읽을 것이다'''
  - '''보도록 하고 이 모든 말을 읽으라'''
  rationale: 영어 POB 주석처럼 여기의 'see'는 단순 시각 행위가 아니라 '주의하다/확실히 하다'의 뉘앙스를 가질 수 있으므로, 한국어에서는 의미를 과장하지 않으면서도 지시의 힘을 보존했습니다.
  doctrine_reference: 본문 해석상의 관용구 처리
