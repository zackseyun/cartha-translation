  naturalness: ‘네가 바빌론에 도착하면’은 자연스럽지만, 예레미야의 직접 지시에는 ‘…읽으십시오’가 현대 한국어 합쇼체에서 더 직접적이고 자연스럽습니다. ‘이 모든 말’보다 문서에 기록된 예언적 내용을 가리키는 문맥에서는 ‘이 모든 말씀’이 더 자연스럽습니다.
