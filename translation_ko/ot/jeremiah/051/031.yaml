source:
  edition: WLC
  text: רָ֤ץ לִ/קְרַאת רָץ֙ יָר֔וּץ וּ/מַגִּ֖יד לִ/קְרַ֣את מַגִּ֑יד לְ/הַגִּיד֙ לְ/מֶ֣לֶךְ בָּבֶ֔ל כִּֽי נִלְכְּדָ֥ה עִיר֖/וֹ מִ/קָּצֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/031.yaml
  text: Runner runs to meet runner[a], and messenger to meet messenger[b], to tell the king of Babylon that his city has been captured from end to end.
  footnotes:
  - marker: a
    text: Or, more formally, 'One runner runs to meet another runner, and one messenger to meet another messenger.' The Hebrew uses repeated participles for urgency and rapid succession.
    reason: lexical_alternative
  - marker: b
    text: Or 'his city has been taken from one end.' The Hebrew expression may denote capture beginning at an extremity, though in context it likely implies the city's fall throughout.
    reason: lexical_alternative
translation:
  language: ko
  text: 주자가 주자를 만나려고 달리고[a], 전령이 전령을 만나러 가서 바빌론 왕에게 그의 성읍이 한쪽 끝에서 함락되었다고 알립니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 주자가 다른 주자를 만나려고 달린다’입니다. 히브리어는 ‘달리는 사람/주자’라는 말의 반복과 동사를 통해 긴급하고 연속적인 움직임을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘한 끝에서’ 또는 ‘끝으로부터’입니다. 문맥상 성읍 전체가 함락되었음을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָץ לִקְרַאת רָץ יָרוּץ
  english_pob_choice: Runner runs to meet runner
  chosen_korean: 사자가 사자를 향해 달리고
  alternatives_korean:
  - 한 사자가 다른 사자를 향해 달리고
  - 사자가 사자를 만나러 달리고
  lexicon: HALOT
  rationale: 히브리어의 반복 구조가 긴박한 연쇄 동작을 나타내므로, 한국어에서도 단순한 ‘만나다’보다 ‘향해 달리다’로 동작성과 속도를 살렸습니다.
- source_word: וּמַגִּיד לִקְרַאת מַגִּיד
  english_pob_choice: and messenger to meet messenger
  chosen_korean: 전령이 전령을 향해 달려가서
  alternatives_korean:
  - 알리는 사람이 알리는 사람을 향해
  - 전령이 전령을 만나러
  lexicon: HALOT
  rationale: מַגִּיד는 소식을 전하는 자이므로 ‘전령’이 자연스럽고, 앞 절과 같은 구조를 유지해 급박한 소식 전달의 연속성을 드러냈습니다.
- source_word: לְהַגִּיד לְמֶלֶךְ בָּבֶל
  english_pob_choice: to tell the king of Babylon
  chosen_korean: 바빌론 왕에게 ... 알립니다
  alternatives_korean:
  - 바빌론 왕에게 ... 전합니다
  - 바빌론 왕에게 ... 보고합니다
  lexicon: HALOT
  rationale: שִׁלּוּחַ된 소식을 왕에게 전달하는 뜻이므로 ‘알리다’가 가장 직접적이며, ‘보고하다’보다 덜 관료적이고 문맥에 맞습니다.
- source_word: נִלְכְּדָה עִירוֹ מִקָּצֶה
  english_pob_choice: that his city has been captured from end to end
  chosen_korean: 그의 성읍이 끝에서 끝까지 함락되었다고
  alternatives_korean:
  - 그의 성읍이 한쪽 끝에서 함락되었다고
  - 그의 성읍이 완전히 점령되었다고
  lexicon: HALOT
  rationale: 미완료가 아닌 완료 수동으로 사건의 성취를 나타내므로 ‘함락되었다’로 옮기고, מִקָּצֶה는 문맥상 전면적 붕괴를 뜻하므로 ‘끝에서 끝까지’로 살렸습니다.
theological_decisions:
- issue: 지명 표기와 왕호의 직역성
  chosen_reading: ‘바빌론 왕’과 ‘성읍’을 그대로 유지해 예언적 심판 선언의 대상과 범위를 분명히 했습니다.
  alternative_readings:
  - ‘바벨론 왕’
  - ‘도성’
  rationale: 이 구절은 특정 왕과 그의 도시의 함락 소식을 전하는 예언 문맥이므로, 과도한 현대화보다 원문의 직접성을 우선했습니다.
  doctrine_reference: 예언서의 역사적-심판적 문맥
- issue: 문장 동사의 시제와 완료성
  chosen_reading: ‘함락되었다’로 완료된 사건을 분명히 했습니다.
  alternative_readings:
  - ‘함락된다’
  - ‘함락당했다’
  rationale: 히브리어 니팔 נִלְכְּדָה는 이미 이루어진 포획을 가리키므로, 현재진행이나 단순 서술보다 완료된 수동을 택하는 것이 문맥에 충실합니다.
  doctrine_reference: 히브리어 완료/수동 상의 번역 원칙
