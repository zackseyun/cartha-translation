review_pass:
  verdict: revise
  source_fidelity: ‘우리를 변호하셨습니다’는 צִדְקֹתֵינוּ(‘우리의 의/정당함들’)를 사람을 직접 목적어로 하는 동사로 바꾸어, 원문의 명사적 표현과 ‘드러내다/가져 나오다’의 심상을 약화합니다. ‘우리의 정당함을 드러내셨습니다’는 문맥상 공적 입증의 의미를 살리면서도 원문의 어휘적 폭을 더 잘 보존합니다.
  naturalness: 초청의 복수 명령은 현대 합쇼체로 ‘오십시오’가 자연스럽습니다. ‘여호와 우리 하나님의 하신 일’을 쓰면 소유·구문 관계가 분명하고, 예배적·선포적 문맥에서 자연스럽습니다.
  terminology: 한국어 성경 전통의 신명 ‘여호와’는 유지할 수 있습니다. צִדְקֹתֵינוּ는 ‘변호’보다 ‘정당함’이 더 정확하며, 각주에서 ‘의들/의로운 행위들/정의’ 및 공적 입증이라는 가능성을 밝혀 중의성을 보존해야 합니다.
  issues:
  - severity: medium
    issue: ‘우리를 변호하셨습니다’가 원문의 ‘우리의 צִדְקֹת(정당함/의)’를 직접 목적어 ‘우리’와 동사 ‘변호하다’로 재구성합니다.
    rationale: 이는 여호와께서 ‘우리의 정당함’을 밖으로 드러내셨다는 히브리어 표현을 다소 해석적으로 좁히며, ‘변호’가 지닌 대리 법정행위의 뉘앙스를 추가합니다.
  - severity: medium
    issue: 각주의 ‘한 편의 공적 변호’는 자연스럽지 않고 원문의 공적 입증/정당화 의미를 정확히 표현하지 못합니다.
    rationale: צְדָקוֹת의 복수는 의로운 행위들 또는 한 집단의 정당함·권리가 공적으로 입증됨을 가리킬 수 있습니다. ‘공적으로 입증된 우리의 정당함’이 더 적절합니다.
  - severity: low
    issue: ‘오라’는 현대 표준어 합쇼체와 일치하지 않습니다.
    rationale: 복수 청자에게 하는 히브리어 명령 בֹּאוּ는 ‘오십시오’로 옮기는 것이 요청된 현대 격식체에 맞습니다.
  revised_text: 여호와께서 우리의 정당함을 드러내셨습니다. 오십시오. 우리가 시온에서 여호와 우리 하나님의 하신 일을 전합시다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리의 의들’, ‘우리의 의로운 행위들’, 혹은 ‘우리의 정의’. 히브리어 복수형은 의로운 행위들을 가리킬 수도 있고, 우리의 정당함이나 권리가 공적으로 입증된 일을 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 본문은 הוֹצִיא의 ‘드러내다/밖으로 가져오다’와 צִדְקֹתֵינוּ의 명사적·복수적 표현을 가능한 한 보존하여 ‘우리의 정당함을 드러내셨습니다’로 고쳤습니다. 이는 문맥의 ‘vindication’을 전달하되 법정 대리행위로 한정하지 않습니다. 명령과 권유는 현대 합쇼체로 조정했으며, 각주는 주요 어휘 가능성과 문맥적 공적 입증의 의미를 자연스러운 한국어로 명시했습니다.
