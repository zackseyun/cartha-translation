id: JER.51.10
reference: Jeremiah 51:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹצִ֥יא יְהוָ֖ה אֶת צִדְקֹתֵ֑י/נוּ בֹּ֚אוּ וּ/נְסַפְּרָ֣ה בְ/צִיּ֔וֹן אֶֽת מַעֲשֵׂ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/010.yaml
  text: Yahweh has brought forth our vindication. Come[a], and let us recount in Zion the work of Yahweh our God.
  footnotes:
  - marker: a
    text: Or 'our righteousnesses,' 'our righteous acts,' or 'our justice.' The Hebrew plural can denote acts of righteousness or the public vindication of a cause.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 우리를 변호하셨습니다. 오라[a], 우리가 시온에서 여호와 우리 하나님의 일을 말합시다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 의들’, ‘우리의 의로운 행위들’, 혹은 ‘우리의 정의’. 히브리어 복수형은 의로운 행위들이나 한 편의 공적 변호를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא / יְהוָה
  english_pob_choice: has brought forth / Yahweh
  chosen_korean: 여호와께서 우리를 변호하셨습니다
  alternatives_korean:
  - 여호와께서 우리를 드러내셨습니다
  - 여호와께서 우리를 밝혀내셨습니다
  - 여호와께서 우리를 끌어내셨습니다
  lexicon: HALOT
  rationale: הוֹצִיא는 ‘밖으로 이끌어 내다, 드러내다’의 뜻이지만, 문맥상 바벨론 심판과 하나님의 백성에 대한 공개적 인정이므로 ‘변호하다’가 영어의 vindication을 한국어로 가장 자연스럽게 전달합니다.
- source_word: צִדְקֹתֵינוּ
  english_pob_choice: our vindication
  chosen_korean: 우리의 변호
  alternatives_korean:
  - 우리의 의
  - 우리의 의로운 행위
  - 우리의 정의
  lexicon: HALOT
  rationale: 복수형 צדקות는 단순한 도덕적 ‘의’라기보다 공동체의 옳음이 공적으로 입증되는 뜻을 가질 수 있으므로, POB의 ‘vindication’을 따라 ‘변호’로 옮겨 공판적·관계적 뉘앙스를 살렸습니다.
- source_word: בֹּאוּ / וּנְסַפְּרָה
  english_pob_choice: Come, and let us recount
  chosen_korean: 오라, 우리가 … 말합시다
  alternatives_korean:
  - 오십시오, 우리가 … 전합시다
  - 오라, 우리가 … 이야기합시다
  - 오세요, 우리가 … 말해 봅시다
  lexicon: HALOT
  rationale: פְּראָס와 같은 단순 초청 뒤에 오는 cohortative는 공동체적 결의의 초대이므로, 현대 합쇼체에서 자연스러운 ‘말합시다’로 옮겼습니다.
- source_word: מַעֲשֵׂה יְהוָה אֱלֹהֵינוּ
  english_pob_choice: the work of Yahweh our God
  chosen_korean: 여호와 우리 하나님의 일
  alternatives_korean:
  - 여호와 우리 하나님의 행하신 일
  - 여호와 우리 하나님의 행적
  - 여호와 우리 하나님의 역사
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 ‘일, 행위, 행하심’의 넓은 의미를 가지므로, 시온에서 선포할 하나님의 구원·심판의 행위를 포괄하는 ‘일’이 가장 간결하고 소스에 가깝습니다.
theological_decisions:
- issue: צִדְקֹתֵינוּ의 신학적 중의성
  chosen_reading: 공적으로 입증된 우리의 옳음/변호로 이해하되, 도덕적 자랑으로 읽지 않습니다
  alternative_readings:
  - 우리의 의로운 행위
  - 우리의 의
  - 우리의 정의
  rationale: 이 구절은 바벨론의 심판과 시온의 회복 속에서 하나님이 자기 백성의 편을 드셨다는 선언이므로, 인간의 공로보다 언약적 옳음의 입증을 강조하는 방향이 문맥에 가장 부합합니다.
  doctrine_reference: Translation philosophy §3, §5; righteousness/justice tension retained by analogy.
