id: JER.51.23
reference: Jeremiah 51:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִפַּצְתִּ֤י בְ/ךָ֙ רֹעֶ֣ה וְ/עֶדְר֔/וֹ וְ/נִפַּצְתִּ֥י בְ/ךָ֖ אִכָּ֣ר וְ/צִמְדּ֑/וֹ וְ/נִפַּצְתִּ֣י בְ/ךָ֔ פַּח֖וֹת וּ/סְגָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/023.yaml
  text: And with you I shattered the shepherd and his flock[a]; and with you I shattered the farmer and his team[c][b]; and with you I shattered governors and deputies.
  footnotes:
  - marker: a
    text: Or 'I broke in pieces' for the repeated verb 'I shattered.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his yoke' or 'his pair' for 'his team,' referring to a yoked pair used in farming.
    reason: lexical_alternative
  - marker: c
    text: Or 'officials' for 'deputies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너와 함께 목자와 그의 양 떼를 무너뜨리고, 농부와 그의 겨리[a][b]를 무너뜨리며, 총독들과 지방관들을 무너뜨리겠다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “산산이 부수다”처럼 옮길 수 있습니다. 반복 동사의 강한 파괴감을 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “멍에”, “한 쌍”으로도 옮길 수 있습니다. 여기서는 농경에서 짝지어진 한 팀을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “관리들”로 옮길 수 있습니다. ստոր급 행정 관직을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִפַּצְתִּי
  english_pob_choice: I shattered
  chosen_korean: 무너뜨리겠습니다
  alternatives_korean:
  - 산산이 부수겠습니다
  - 깨뜨리겠습니다
  lexicon: HALOT
  rationale: 반복되는 심판 동사로서 강한 파괴를 드러내야 하므로, 현대 한국어에서 자연스럽고 힘이 있는 '무너뜨리다'를 택했습니다.
- source_word: רֹעֶה וְעֶדְרוֹ
  english_pob_choice: the shepherd and his flock
  chosen_korean: 목자와 그의 양 떼
  alternatives_korean:
  - 양치기와 그의 떼
  - 목자와 그의 떼
  lexicon: HALOT
  rationale: 목양 관계를 분명히 살리기 위해 '목자'와 '양 떼'로 옮겼습니다. 'pastor' 같은 교회적 의미는 원문에 없습니다.
- source_word: אִכָּר וְצִמְדּוֹ
  english_pob_choice: the farmer and his team
  chosen_korean: 농부와 그의 겨리
  alternatives_korean:
  - 농부와 그의 한 쌍
  - 농부와 그의 소 한 쌍
  - 농부와 그의 멍에
  lexicon: HALOT
  rationale: צֶמֶד는 농경에서 짝지어진 소나 한 쌍을 가리킬 수 있으므로, 전통적이면서도 원문의 짝 개념을 살리는 '겨리'를 선택했습니다.
- source_word: פַּחוֹת וּסְגָנִים
  english_pob_choice: governors and deputies
  chosen_korean: 총독들과 지방관들
  alternatives_korean:
  - 총독들과 부관들
  - 총독들과 관리들
  lexicon: HALOT
  rationale: פַּחוֹת와 סְגָנִים은 각각 상급 통치자와 그 아래의 부속 관리들을 가리키므로, 위계가 드러나도록 '총독들'과 '지방관들'로 옮겼습니다.
theological_decisions:
- issue: 반복되는 “with you”의 기능
  chosen_reading: “너와 함께”를 심판의 도구성으로 이해하여 한국어에서는 “너와 함께” 대신 “내가 너와 함께”의 형식으로 자연스럽게 살렸습니다.
  alternative_readings:
  - “너로 말미암아”
  - “너를 통해”
  rationale: בְךָ는 바벨론이 심판의 매개가 됨을 드러내는 표현이므로, 문맥의 폭력성과 도구성을 보존하면서도 한국어 문장 흐름을 해치지 않도록 처리했습니다.
  doctrine_reference: 예레미야 51장의 바벨론 심판 선언 문맥
- issue: 목자와 농부의 직분 목록
  chosen_reading: 원문이 포괄하는 사회적 역할 목록을 그대로 유지하여, 종교적/우화적 의미를 덧붙이지 않았습니다.
  alternative_readings:
  - 목회자적 상징으로 해석
  - 이스라엘 전체에 대한 은유로 확장
  rationale: 이 절은 서로 다른 직업과 통치 계층이 함께 붕괴되는 총체적 심판을 말하므로, 원문의 사회사적 범위를 넘기지 않는 것이 가장 충실합니다.
  doctrine_reference: 예레미야 51:23의 열거적 심판 선포
