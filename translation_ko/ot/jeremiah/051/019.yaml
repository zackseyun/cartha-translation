  source_fidelity: 개정이 필요합니다. 초안은 마소라 본문에 없는 ‘이스라엘’을 본문에 보충하여 원문 우선 원칙에 어긋납니다. 또한 본문에만 있는 불완전한 병렬구 ‘그의 기업의 지파’를 한국어에서 비교절의 생략으로 최소한 보충해야 합니다.
  naturalness: ‘이와 같지 아니한 것이 … 이시니’ 및 ‘그 기업을 잇는 지파’는 현대 표준어 합쇼체로 부자연스럽고, 하나님을 가리키는 서술과 이스라엘을 가리키는 서술의 높임도 혼재되어 있습니다. 문장을 ‘야곱의 몫은 …’으로 정리하고 종결을 합쇼체로 통일하는 것이 자연스럽습니다.
  terminology: חֵלֶק은 여기서 ‘야곱의 몫’으로 옮기고 각주에서 ‘야곱의 분깃이신 분’이라는 가능한 이해를 밝혔습니다. יְהוָה는 영문 POB의 결정에 맞추어 ‘야훼’로, צְבָאוֹת는 ‘만군’으로 옮겼습니다. 이에 따라 ‘여호와’는 전통적 번역이라는 각주에만 남깁니다.
