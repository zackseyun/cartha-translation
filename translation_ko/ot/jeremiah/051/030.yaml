    rationale: מִשְׁכְּנֹתֶיהָ는 ‘그녀의/그 도시의 거처들’, 곧 바빌론의 거처들을 뜻합니다. 바로 앞의 용사들과 혼동되지 않게 ‘바빌론의 거처들’로 밝혀야 합니다.
