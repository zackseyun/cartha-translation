  source_fidelity: 전반적으로 히브리어의 전투 중지, 요새에 머묾, 힘의 소진, 고대의 성별화된 전쟁 조롱, 거처의 화재와 빗장의 파괴를 잘 반영합니다. 그러나 여성 비유를 설명하는 각주가 ‘요새들’에 잘못 연결되어 있고, מִשְׁכְּנֹתֶיהָ와 בְרִיחֶיהָ의 여성 단수 소유 접미사(바빌론을 가리킴)를 ‘그들의’로 옮긴 것은 지시 대상이 부정확합니다. 또한 ‘성문’은 원문에 명시되지 않았으므로 본문에서는 ‘빗장’으로 두는 편이 안전합니다.
  naturalness: ‘싸우기를 그쳤습니다’, ‘요새들 안에 앉아 있습니다’, ‘힘은 다했고’는 현대 표준어 합쇼체에서 자연스럽고 문맥에 맞습니다. ‘바빌론의 거처들에는 불이 붙었고’는 행위 주체를 임의로 보충하지 않으면서 원문의 재난 묘사를 자연스럽게 전달합니다.
  terminology: ‘바빌론’, ‘용사들’, ‘요새들’, ‘빗장들’은 적절합니다. הָיוּ לְנָשִׁים은 본문의 고대 전쟁 수사를 보존하여 ‘여자들처럼 되었습니다’로 유지하고, 그 표현의 역사적·수사적 성격은 해당 구절에 연결된 각주에서 설명하는 것이 적절합니다.
