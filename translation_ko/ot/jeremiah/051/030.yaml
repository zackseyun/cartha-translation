source:
  edition: WLC
  text: חָדְלוּ֩ גִבּוֹרֵ֨י בָבֶ֜ל לְ/הִלָּחֵ֗ם יָֽשְׁבוּ֙ בַּ/מְּצָד֔וֹת נָשְׁתָ֥ה גְבוּרָתָ֖/ם הָי֣וּ לְ/נָשִׁ֑ים הִצִּ֥יתוּ מִשְׁכְּנֹתֶ֖י/הָ נִשְׁבְּר֥וּ בְרִיחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/030.yaml
  text: The warriors of Babylon have stopped fighting; they sit in the strongholds[a]. Their strength has failed; they have become like women. Her dwellings are set on fire; her bars are broken.
  footnotes:
  - marker: a
    text: Or, more literally, 'they have become women'—a Hebrew taunt for loss of courage in battle.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론의 용사들은 싸우기를 그쳤습니다. 그들은 요새들에 앉아 있습니다[a]. 그들의 용기는 사라졌고, 그들은 여자들처럼 되었습니다. 그들의 거처는 불타고, 그 성문 빗장은 부서졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들이 여자들이 되었다’입니다. 이는 전쟁에서 용기를 잃은 상태를 가리키는 히브리어 조롱 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ גִבּוֹרֵי בָבֶל לְהִלָּחֵם
  english_pob_choice: The warriors of Babylon have stopped fighting
  chosen_korean: 바빌론의 용사들은 싸우기를 그쳤습니다
  alternatives_korean:
  - 바빌론의 용사들은 싸움을 멈췄습니다
  - 바빌론의 강한 용사들은 싸우지 않게 되었습니다
  lexicon: HALOT
  rationale: חָדְלוּ는 ‘그치다/멈추다’의 완료를 나타내며, גִבּוֹרֵי는 군사적 문맥에서 ‘용사들’이 자연스럽습니다. לְהִלָּחֵם은 전투 행위를 가리키므로 ‘싸우기를 그쳤습니다’가 원문의 동작 중지를 잘 드러냅니다.
- source_word: בַּמְּצָדֹות
  english_pob_choice: in the strongholds
  chosen_korean: 요새들에 앉아 있습니다
  alternatives_korean:
  - 성채들 안에 앉아 있습니다
  - 요새들에 머물고 있습니다
  lexicon: HALOT
  rationale: מְצָדֹות는 방어용 요새/산성들을 가리킵니다. 여기서는 수동적 후퇴를 강조하므로 ‘앉아 있습니다’가 영어 POB의 긴장감을 살리면서도 현대 한국어에 자연스럽습니다.
- source_word: נָשְׁתָה גְבוּרָתָם הָיוּ לְנָשִׁים
  english_pob_choice: Their strength has failed; they have become like women
  chosen_korean: 그들의 용기는 사라졌고, 그들은 여자들처럼 되었습니다
  alternatives_korean:
  - 그들의 힘이 쇠하였고, 그들은 여자들처럼 되었습니다
  - 그들의 용맹이 말라버렸고, 그들은 여자들이 되었습니다
  lexicon: HALOT
  rationale: גְבוּרָה는 여기서 전투적 용기/힘을 뜻하므로 ‘용기’가 문맥에 적합합니다. הָיוּ לְנָשִׁים은 문자적으로 성별 변화가 아니라 겁먹고 무너진 상태를 조롱하는 표현이므로 ‘여자들처럼’으로 비교를 유지했습니다.
- source_word: הִצִּיתוּ מִשְׁכְּנֹתֶיהָ נִשְׁבְּרוּ בְרִיחֶיהָ
  english_pob_choice: Her dwellings are set on fire; her bars are broken
  chosen_korean: 그들의 거처는 불타고, 그 성문 빗장은 부서졌습니다
  alternatives_korean:
  - 그 거처들은 불타고, 그 빗장들은 부서졌습니다
  - 그들의 주거는 불타고, 그들의 빗장은 부서졌습니다
  lexicon: HALOT
  rationale: מִשְׁכְּנֹתֶיהָ는 도시의 거처/주거지를 넓게 가리키며, בְרִיחִים는 성문을 잠그는 빗장입니다. 문맥상 바빌론 도시의 함락을 드러내기 위해 ‘성문 빗장’으로 구체화했습니다.
theological_decisions:
- issue: הָיוּ לְנָשִׁים의 성별 비유를 한국어로 어떻게 보존할지
  chosen_reading: ‘여자들처럼 되었습니다’로 옮겨, 문자적 성변환이 아니라 전쟁 의욕과 용기의 붕괴를 조롱하는 고대 수사임을 유지했습니다.
  alternative_readings:
  - ‘여자들이 되었습니다’
  - ‘여자처럼 겁쟁이가 되었습니다’
  rationale: 본문은 남성-여성 대비를 통해 군사적 수치와 무력화를 표현합니다. 한국어에서 완곡하게 바꾸면 원문의 날 선 조롱이 약해지므로, 비교어 ‘처럼’을 살려 소스의 수사적 강도를 보존했습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral); preserve source intent without flattening rhetoric.
