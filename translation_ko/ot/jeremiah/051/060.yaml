  source_fidelity: ‘바빌론에 닥칠 모든 재앙’과 ‘한 두루마리’는 히브리어의 심판 맥락과 고대 문서 형태를 잘 반영합니다. 그러나 הַכְּתֻבִים אֶל־בָּבֶל은 이 문맥에서 바빌론을 대상으로 한 심판 선언의 방향을 나타내므로, ‘바빌론을 향하여 기록된’보다 ‘바빌론을 거슬러 기록된’이 더 분명합니다. 전치사의 넓은 ‘~에 대하여’ 의미는 각주로 보존합니다.
  naturalness: 현 초안의 ‘곧 바빌론을 향하여 기록된 이 모든 말들입니다’는 앞 문장을 설명하는 독립 문장으로 다소 부자연스럽고, ‘향하여 기록된’도 현대 한국어에서 매끄럽지 않습니다. 동격 내용을 한 문장 안에 넣어 자연스럽게 다듬었습니다.
  terminology: ‘예레미야’, ‘바빌론’, ‘재앙’, ‘두루마리’는 적절합니다. 예언적 발화인 דְּבָרִים는 존중 높임의 의미를 부과하지 않는 범위에서 성경 문체상 자연스러운 ‘말씀’으로 유지했습니다.
