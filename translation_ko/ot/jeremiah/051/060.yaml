id: JER.51.60
reference: Jeremiah 51:60
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב יִרְמְיָ֗הוּ אֵ֧ת כָּל הָ/רָעָ֛ה אֲשֶׁר תָּב֥וֹא אֶל בָּבֶ֖ל אֶל סֵ֣פֶר אֶחָ֑ד אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה הַ/כְּתֻבִ֖ים אֶל בָּבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/060.yaml
  text: And Jeremiah wrote in a single scroll all the disaster that would come upon Babylon—all these words written against Babylon[a].
  footnotes:
  - marker: a
    text: Or 'written against Babylon.' The Hebrew preposition can be rendered more literally, but here it introduces the content/direction of the prophetic words about Babylon's judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 예레미야는 바빌론에 닥칠 모든 재앙, 곧 바빌론을 거슬러 기록된 이 모든 말씀을 한 두루마리에 기록했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바빌론에 대하여 기록된.” 히브리어 전치사는 더 넓게는 바빌론에 관한 말씀이라는 뜻으로도 옮길 수 있습니다. 그러나 여기서는 바빌론을 향한 심판 예언의 방향을 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  english_pob_choice: wrote
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 썼습니다
  - 적었습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol כתב는 단순한 ‘쓰기’보다 문서화의 뉘앙스가 있어, 예언 내용을 두루마리에 옮겨 적는 행위를 자연스럽게 드러내는 ‘기록했습니다’를 택했습니다.
- source_word: אֵת כָּל הָרָעָה אֲשֶׁר תָּבוֹא אֶל בָּבֶל
  english_pob_choice: all the disaster that would come upon Babylon
  chosen_korean: 바빌론에 닥칠 모든 재앙
  alternatives_korean:
  - 바빌론에 올 모든 재앙
  - 바빌론을 향해 올 모든 재앙
  lexicon: HALOT
  rationale: רָעָה는 심판 맥락에서 도덕적 ‘악’보다 ‘재앙/환난’의 뜻이 분명하므로 ‘재앙’으로 옮겼고, תבוא + אֶל בָּבֶל의 결과적 의미를 ‘닥칠’로 자연스럽게 살렸습니다.
- source_word: אֶל סֵפֶר אֶחָד
  english_pob_choice: in a single scroll
  chosen_korean: 한 두루마리에
  alternatives_korean:
  - 한 책에
  - 한 권의 두루마리에
  lexicon: HALOT
  rationale: סֵפֶר는 이 역사적 문맥에서 현대적 ‘책’보다 문서/두루마리가 더 적절하므로 ‘두루마리’로 옮겼고, אֶחָד은 ‘한’으로 간결하게 처리했습니다.
- source_word: אֶל בָּבֶל / הַכְּתֻבִים אֶל בָּבֶל
  english_pob_choice: written against Babylon
  chosen_korean: 바빌론을 향하여 기록된
  alternatives_korean:
  - 바빌론에 대하여 기록된
  - 바빌론을 향해 기록된
  lexicon: HALOT
  rationale: 반복되는 אֶל은 직역하면 어색하지만, 예언의 방향·대상을 표시하는 용법으로 보아 ‘향하여’로 처리하면 원문의 지시성을 살리면서 한국어도 자연스럽습니다.
theological_decisions:
- issue: 예언 문서의 방향성(against / concerning Babylon)
  chosen_reading: 본문은 바빌론에 대한 심판 예언을 담은 기록으로, ‘향하여 기록된’이라는 표현으로 문서의 대상성과 대항성을 함께 드러냈습니다.
  alternative_readings:
  - 바빌론에 대하여 기록된
  - 바빌론을 향해 기록된
  rationale: English POB 주석처럼 히브리어 전치사 אֶל은 단순한 ‘to’보다 내용/방향을 표시하는 기능이 있어, 심판 선언의 적대적 성격을 약화하지 않으면서도 문장 흐름을 유지해야 합니다.
  doctrine_reference: 예언의 심판 선언과 문서화된 계시의 정확성
