  lexicon: HALOT
  rationale: 예언적 도입부의 긴박감과 주의를 환기하는 기능을 살리면서도 합쇼체 문체에 맞게 자연스럽게 표현했습니다.
- source_word: פְּסִילֶיהָ
  english_pob_choice: her carved images
  chosen_korean: 그 조각한 우상들
  alternatives_korean:
  - 그 새긴 우상들
  - 그 조각 형상들
  - 그 우상들
  lexicon: HALOT
  rationale: פָּסִילִים은 단순한 '우상'보다 조각된 숭배 형상을 가리키므로, POB의 구체성을 유지하되 한국어에서 의미가 통하게 했습니다.
- source_word: חָלָל
  english_pob_choice: the wounded / the slain
  chosen_korean: 죽임을 당한 자들
  alternatives_korean:
