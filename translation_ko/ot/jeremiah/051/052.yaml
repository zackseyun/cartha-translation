translation:
  language: ko
  text: 그러므로 보십시오, 날들이 오고 있습니다 — 야훼의 말씀이니, 내가 그 조각한 우상들을 벌하고, 그 온 땅 곳곳에서 죽임을 당한 자들이 신음할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 우상들'로 옮길 수 있습니다. 히브리어는 특히 조각된 숭배 형상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 그런즉
  lexicon: HALOT
  rationale: 앞말의 심판 문맥을 잇는 귀결 표지이므로, 현대 한국어에서 가장 자연스러운 인과 접속사로 옮겼습니다.
- source_word: הִנֵּה יָמִים בָּאִים
