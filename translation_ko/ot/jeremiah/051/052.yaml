  lexicon: HALOT
  rationale: 본 어휘는 전쟁 맥락에서 죽임을 당한 이들을 가리키는 폭이 있어, '신음할'과의 결합을 고려해 가장 직접적인 수동 표현으로 옮겼습니다.
