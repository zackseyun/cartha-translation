  text: 그러므로 보십시오, 날들이 오고 있습니다. 야훼의 말씀입니다. 내가 바빌론의 조각 형상들[a]을 벌하고, 그 온 땅에서 죽임당한 자들이 신음할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
