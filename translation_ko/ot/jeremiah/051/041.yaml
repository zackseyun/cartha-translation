id: JER.51.41
reference: Jeremiah 51:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֚יךְ נִלְכְּדָ֣ה שֵׁשַׁ֔ךְ וַ/תִּתָּפֵ֖שׂ תְּהִלַּ֣ת כָּל הָ/אָ֑רֶץ אֵ֣יךְ הָיְתָ֧ה לְ/שַׁמָּ֛ה בָּבֶ֖ל בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/041.yaml
  text: How Sheshak has been captured[c][b][a], and the praise of the whole earth seized! How Babylon has become a desolation among the nations!
  footnotes:
  - marker: a
    text: Sheshak is widely understood as a cipher-name for Babylon.
    reason: alternative_reading
  - marker: b
    text: Or 'the glory of the whole earth' / 'the boast of the whole earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'has become a desolation'; the Hebrew term can include both ruin and the horror it causes.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 셰샥[a]이 함락되고, 온 땅의 찬양[b]이 사로잡혔습니까! 어찌하여 바벨론이 나라들 가운데 폐허[c]가 되었습니까!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 셰샥은 일반적으로 바벨론을 가리키는 암호명으로 이해됩니다.
    reason: source_note
  - marker: b
    text: 또는 ‘온 땅의 영광’ 또는 ‘온 땅의 자랑’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘공포의 대상’으로 옮길 수 있습니다. 히브리어 표현은 황폐한 상태와 그 폐허가 불러일으키는 경악을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어떻게
  - 어찌
  lexicon: HALOT
  rationale: 탄식과 놀라움을 드러내는 감탄으로 쓰였으므로, 단순한 방법 질문인 ‘어떻게’보다 ‘어찌하여’가 수사적 힘을 더 잘 살립니다.
- source_word: נִלְכְּדָה
  english_pob_choice: has been captured
  chosen_korean: 함락되었으며
  alternatives_korean:
  - 사로잡혔으며
  - 점령되었으며
  lexicon: HALOT
  rationale: 성읍/제국의 몰락을 보여 주는 전쟁 문맥이므로, ‘사로잡히다’보다 도시가 무너져 들어간 이미지를 가진 ‘함락되다’가 더 자연스럽습니다.
- source_word: תְּהִלַּת כָּל הָאָרֶץ
  english_pob_choice: the praise of the whole earth
  chosen_korean: 온 땅의 찬양
  alternatives_korean:
  - 온 땅의 영광
  - 온 땅의 자랑
  lexicon: HALOT
  rationale: תְּהִלָּה의 기본값인 ‘찬양’을 살려 직역성을 유지했습니다. 다만 관용적으로는 ‘영광’도 가능하지만, 본문은 칭송되던 대상이 무너지는 역전을 강조합니다.
- source_word: לְשַׁמָּה
  english_pob_choice: has become a desolation
  chosen_korean: 황폐함이 되었는가
  alternatives_korean:
  - 황폐가 되었는가
  - 황무지가 되었는가
  - 놀라운 폐허가 되었는가
  lexicon: HALOT
  rationale: שַׁמָּה의 핵심인 ‘황폐/폐허 상태’를 직접 옮기되, 문장 전체의 감탄형 구조에 맞춰 명사형으로 처리했습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 나라들 가운데
  alternatives_korean:
  - 민족들 가운데
  - 열방 가운데
  lexicon: HALOT
  rationale: 여기서는 후대의 신학적 ‘이방인’보다 국제적 정치 맥락의 ‘나라들’을 드러내는 것이 더 정확합니다.
- source_word: שֵׁשַׁךְ
  english_pob_choice: Sheshak
  chosen_korean: 셰샥
  alternatives_korean:
  - 세삭
  - 쉬샥
  lexicon: HALOT
  rationale: 히브리어 고유형을 음역하되 한국어 음절 구조에 맞춰 표기했습니다. 본문 자체의 수수께끼 이름을 유지하는 것이 중요합니다.
theological_decisions:
- issue: שֵׁשַׁךְ를 본문에서 바벨론으로 바꿀지 여부
  chosen_reading: 본문에는 음역형 ‘셰샥’을 유지하고, 내재된 암호명이라는 점을 본문 밖 주석으로만 처리합니다.
  alternative_readings:
  - 바벨론으로 풀어 번역
  - 셰샥(바벨론)으로 병기
  rationale: 히브리어 본문이 실제로는 암호명 셰샥을 사용하므로, 번역문에서 곧바로 풀어 쓰면 본문의 수사와 독자의 해독 경험이 사라집니다.
  doctrine_reference: 성경 본문 표면형 보존 원칙
- issue: לְשַׁמָּה의 정서적 뉘앙스
  chosen_reading: ‘황폐함’으로 옮겨 물리적 폐허 상태를 중심에 두었습니다.
  alternative_readings:
  - ‘공포’가 된
  - ‘끔찍한 폐허’가 된
  rationale: 어근은 파멸의 상태를 가리키며, 영어 POB의 수정 이력도 ‘desolation’을 최종 취지로 둡니다. 정서적 충격은 문맥 전체에서 충분히 전달됩니다.
  doctrine_reference: 예언서의 심판 선언 어휘 보존
