id: JER.51.12
reference: Jeremiah 51:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶל חוֹמֹ֨ת בָּבֶ֜ל שְׂאוּ נֵ֗ס הַחֲזִ֨יקוּ֙ הַ/מִּשְׁמָ֔ר הָקִ֨ימוּ֙ שֹֽׁמְרִ֔ים הָכִ֖ינוּ הָ/אֹֽרְבִ֑ים כִּ֚י גַּם זָמַ֣ם יְהוָ֔ה גַּם עָשָׂ֕ה אֵ֥ת אֲשֶׁר דִּבֶּ֖ר אֶל יֹשְׁבֵ֥י בָבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/012.yaml
  text: Against the walls of Babylon[a], lift up a signal; strengthen the watch; station watchmen; prepare the ambushes[c][b]. For Yahweh has both planned and done what he spoke against the inhabitants of Babylon.
  footnotes:
  - marker: a
    text: Or 'raise a banner' or 'lift up a standard.' The Hebrew נֵס denotes a raised military signal.
    reason: lexical_alternative
  - marker: b
    text: Or 'prepare the ambushers.' The Hebrew may refer either to the men lying in wait or to the ambush positions.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'what he spoke to the inhabitants of Babylon'; in context this means a word of judgment spoken against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론의 성벽을 향하여 신호를 들어 올리십시오. 경계를 굳게 하고, 파수꾼들을 세우고, 매복을 준비하십시오. 왜냐하면 야훼께서 계획하신 것을 이미 행하셨고, 바빌론의 주민들을 향하여 말씀하신 것을 이루셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신호를 들어 올리십시오’는 히브리어 נֵס의 넓은 의미를 따른 것으로, ‘깃발을 세우다/표준을 높이다’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘매복을 준비하십시오’는 ‘매복하는 사람들’을 준비한다는 뜻일 수도 있고, 매복 지점을 마련한다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘주민들을 향하여 말씀하신 것’은 문맥상 그들에 대한 심판 선포를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חוֹמֹת בָּבֶל
  english_pob_choice: Against the walls of Babylon
  chosen_korean: 바빌론의 성벽을 향하여
  alternatives_korean:
  - 바빌론의 성벽에
  - 바빌론의 성벽을 향하여 대하여
  lexicon: HALOT
  rationale: אֶל은 기본적으로 ‘~을 향하여’이지만, 포위전 문맥에서는 적대적 방향성을 띠므로 한국어에서는 자연스럽게 목표 방향을 드러내는 표현이 적합합니다.
- source_word: שְׂאוּ נֵס
  english_pob_choice: lift up a signal
  chosen_korean: 신호를 들어 올리십시오
  alternatives_korean:
  - 깃발을 들어 올리십시오
  - 깃대를 세우십시오
  lexicon: HALOT
  rationale: נֵס은 군사적 표지/깃발/신호를 가리킬 수 있으므로, 현대 한국어에서 군사적 의미를 지나치게 제한하지 않는 ‘신호’를 택했습니다.
- source_word: הַחֲזִיקוּ הַמִּשְׁמָר
  english_pob_choice: strengthen the watch
  chosen_korean: 경계를 굳게 하고
  alternatives_korean:
  - 보초를 강화하고
  - 경비를 굳게 하고
  lexicon: HALOT
  rationale: חזק의 사역형은 ‘강화하다’의 뜻이므로, 군사 지시 연쇄에서 자연스러운 한국어인 ‘경계를 굳게 하다’로 옮겼습니다.
- source_word: הָכִינוּ הָאֹרְבִים
  english_pob_choice: prepare the ambushes
  chosen_korean: 매복을 준비하십시오
  alternatives_korean:
  - 매복자들을 준비하십시오
  - 잠복 진지를 마련하십시오
  lexicon: HALOT
  rationale: אָרַב 계열은 ‘매복하는 사람들’ 또는 ‘매복 자리’ 모두를 가리킬 수 있지만, 명령문에서는 한국어가 ‘매복을 준비하다’로 가장 자연스럽고 원문 긴장도도 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기준에 따라 신명기적 이름 יְהוָה는 호칭이 아니라 고유한 이름으로 ‘야훼’로 옮겼습니다.
- source_word: אֵת אֲשֶׁר דִּבֶּר אֶל יֹשְׁבֵי בָבֶל
  english_pob_choice: what he spoke against the inhabitants of Babylon
  chosen_korean: 바빌론의 주민들을 향하여 말씀하신 것을
  alternatives_korean:
  - 바빌론의 주민들에게 말씀하신 것을
  - 바빌론의 주민들에 관하여 말씀하신 것을
  lexicon: HALOT
  rationale: 딥베르 + 엘의 결합은 여기서 심판 선포의 방향성을 띠므로, 단순한 ‘~에게’보다 ‘~을 향하여 말씀하신’이 문맥상 더 정확합니다.
theological_decisions:
- issue: The divine name יְהוָה in a judgment oracle
  chosen_reading: 야훼
  alternative_readings:
