  - 여호와
  rationale: 예레미야의 심판 선포 본문에서 신명기적 이름을 고유명으로 드러내는 것이 문맥의 직접성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
