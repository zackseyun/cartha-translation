  rationale: 본문이 יְהוָה를 직접 사용하므로, 대체 칭호 대신 고유명 음역을 유지해 언약적 신명 표지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
