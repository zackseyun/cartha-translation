  lexicon: HALOT
  rationale: 사건이 공개적으로 목격되었음을 드러내는 관용구를 한국어에서도 직관적인 ‘너희 눈앞에’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
