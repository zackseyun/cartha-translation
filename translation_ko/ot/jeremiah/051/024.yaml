  lexicon: HALOT
  rationale: רָעָה의 도덕적 악과 가해 행위의 피해성을 함께 살리기 위해, 결과를 되갚는 표현인 ‘~에 따라’와 ‘행한 그 모든 악’을 결합했습니다.
- source_word: לְעֵינֵיכֶם
