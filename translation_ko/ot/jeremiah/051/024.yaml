  text: וְ/שִׁלַּמְתִּ֨י לְ/בָבֶ֜ל וּ/לְ/כֹ֣ל יוֹשְׁבֵ֣י כַשְׂדִּ֗ים אֵ֧ת כָּל רָעָתָ֛/ם אֲשֶׁר עָשׂ֥וּ בְ/צִיּ֖וֹן לְ/עֵֽינֵי/כֶ֑ם נְאֻ֖ם יְהוָֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/024.yaml
  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will pay back Babylon and all the inhabitants of Chaldea for all the harm they have done.' The Hebrew term can emphasize either moral evil or the harmful wrongdoing itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바벨과 갈대아의 모든 주민에게, 그들이 시온에서 너희 눈앞에 행한 그 모든 악에 따라 갚겠습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악’은 도덕적 사악함과 실제로 끼친 해악을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  english_pob_choice: I will repay
  chosen_korean: 갚겠습니다
  alternatives_korean:
  - 보복하겠습니다
  - 되갚겠습니다
  lexicon: HALOT
  rationale: 피엘 שׁלם의 보응·상환 의미를 살려, 문어체에서 자연스럽고 판결적 뉘앙스를 지닌 ‘갚다’를 선택했습니다.
- source_word: לְבָבֶל
  english_pob_choice: Babylon
  chosen_korean: 바벨
  alternatives_korean:
  - 바빌론
  lexicon: HALOT
  rationale: 히브리어 지명 발음을 직접 반영해 ‘바벨’로 옮겼습니다.
- source_word: וּלְכֹל יוֹשְׁבֵי כַשְׂדִּים
  english_pob_choice: and all the inhabitants of Chaldea
  chosen_korean: 갈대아의 모든 주민
  alternatives_korean:
  - 갈대아에 사는 모든 사람
  - 갈대아의 모든 거주자
  lexicon: HALOT
  rationale: יוֹשְׁבֵי의 ‘거주하는 자들’ 의미를 ‘주민’으로 자연스럽게 옮기고, כַשְׂדִּים의 지리·민족적 범위를 ‘갈대아’로 유지했습니다.
- source_word: אֵת כָּל רָעָתָם
  english_pob_choice: for all their evil
  chosen_korean: 그들이 행한 그 모든 악에 따라
  alternatives_korean:
  - 그들의 모든 악 때문에
  - 그들이 저지른 모든 악에 대하여
  lexicon: HALOT
  rationale: רָעָה의 도덕적 악과 가해 행위의 피해성을 함께 살리기 위해, 결과를 되갚는 표현인 ‘~에 따라’와 ‘행한 그 모든 악’을 결합했습니다.
- source_word: לְעֵינֵיכֶם
  english_pob_choice: before your eyes
  chosen_korean: 너희 눈앞에
  alternatives_korean:
  - 너희 보는 앞에서
  - 너희 눈에
  lexicon: HALOT
  rationale: 사건이 공개적으로 목격되었음을 드러내는 관용구를 한국어에서도 직관적인 ‘너희 눈앞에’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선포입니다
  lexicon: HALOT
  rationale: 예언 공식의 단정성을 살리되 현대 한국어에서 자연스러운 종결로 처리했고, 신성호칭은 본 프로젝트 기본값인 ‘야훼’로 유지했습니다.
theological_decisions:
