  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will pay back Babylon and all the inhabitants of Chaldea for all the harm they have done.' The Hebrew term can emphasize either moral evil or the harmful wrongdoing itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바벨과 갈대아의 모든 주민에게, 그들이 시온에서 너희 눈앞에서 저지른 그 모든 악행을 되갚겠습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악행’은 도덕적 사악함과 실제로 끼친 해악을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
