  text: אֽוֹרִידֵ֖/ם כְּ/כָרִ֣ים לִ/טְב֑וֹחַ כְּ/אֵילִ֖ים עִם עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/040.yaml
  text: I will bring them down like lambs to the slaughter[a], like rams with male goats.
  footnotes:
  - marker: a
    text: Or 'like young rams' for כָּרִים.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 도살당할 어린 양들처럼, 숫양들과 숫염소들처럼 끌어내리겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어린 숫양들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹרִידֵם
  english_pob_choice: I will bring them down
  chosen_korean: 끌어내리겠습니다
  alternatives_korean:
  - 내리겠습니다
  - 데리고 내려가겠습니다
  lexicon: HALOT
  rationale: 히필형 ירד의 사역적 의미를 살리면서, 심판의 맥락에서 사람들을 아래로 끌어내리는 이미지가 분명하게 드러나도록 했습니다.
- source_word: כְּכָרִים
  english_pob_choice: like lambs
  chosen_korean: 도살당할 어린 양들처럼
  alternatives_korean:
  - 어린 숫양들처럼
  - 양들처럼
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 כָּרִים는 ‘어린 숫양들’의 뉘앙스를 가질 수 있지만, כאן에서는 ‘도살’과 결합한 취약성의 이미지를 살리기 위해 ‘어린 양들’로 옮겼습니다.
- source_word: כְּאֵילִים
  english_pob_choice: like rams
  chosen_korean: 숫양들과
  alternatives_korean:
  - 숫양들처럼
  - 힘센 숫양들과
  lexicon: HALOT
  rationale: אֵילִים의 기본 동물명은 ‘숫양’이므로, 앞 구절과 병렬을 이루도록 동일한 동물 이미지를 유지했습니다.
- source_word: עִם עַתּוּדִים
  english_pob_choice: with male goats
  chosen_korean: 숫염소들처럼
  alternatives_korean:
  - 수염소들과
  - 염소 수컷들과
  lexicon: HALOT
  rationale: עַתּוּדִים의 성별 구분을 분명히 드러내기 위해 ‘숫염소’로 옮겼고, 앞의 ‘숫양들’과 대응되도록 병렬 구조를 살렸습니다.
theological_decisions:
- issue: 폭력적 심판 이미지의 직설성 유지
  chosen_reading: 도살과 짐승의 끌려 내려감이라는 직설적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 완화하여 ‘멸망시키겠습니다’처럼 추상화하는 읽기
  rationale: 본문은 포로/심판을 동물의 도살 이미지로 강하게 그리므로, 그 긴장과 충격을 약화하지 않는 것이 소스 충실도에 더 적합합니다.
  doctrine_reference: 예레미야 51장 심판 신탁의 문맥
