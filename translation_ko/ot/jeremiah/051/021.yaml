  rationale: 히브리어의 첫인칭 동사와 2인칭 전치사구의 결합을 그대로 반영하여, 심판의 주권은 하나님께 있고 상대는 수단이라는 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 하나님의 주권적 심판과 도구적 매개성을 함께 유지
