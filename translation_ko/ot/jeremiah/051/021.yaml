  text: וְ/נִפַּצְתִּ֣י בְ/ךָ֔ ס֖וּס וְ/רֹֽכְב֑/וֹ וְ/נִפַּצְתִּ֣י בְ/ךָ֔ רֶ֖כֶב וְ/רֹכְבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/021.yaml
  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
  footnotes:
  - marker: a
    text: Or 'I smashed' / 'I broke in pieces'; the Hebrew verb conveys violent breaking.
    reason: lexical_alternative
  - marker: b
    text: Or 'by you' or 'through you'; the Hebrew preposition indicates instrumentality.
    reason: lexical_alternative
  - marker: c
    text: '''Chariot'' may also be understood more collectively as ''chariotry'' in some contexts, but the singular pairing here favors ''chariot.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신으로 말미암아 나는 말과 그 탄 자를 부수고, 또 당신으로 말미암아 나는 전차와 그 탄 자를 부수었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נִפַּצְתִּי는 단순히 ‘부수다’보다 더 강한 ‘산산이 부수다/깨뜨리다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 전치사 בְּךָ는 여기서 ‘당신으로 말미암아/당신을 통해’라는 도구적 의미를 가집니다.
    reason: lexical_alternative
  - marker: c
    text: רֶכֶב은 문맥에 따라 ‘전차’뿐 아니라 ‘전차대/전차부대’처럼 집합적으로도 이해될 수 있으나, 여기서는 단수 병행이므로 ‘전차’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  english_pob_choice: I shattered
  chosen_korean: 나는 … 부수고 / 부수었습니다
  alternatives_korean:
  - 나는 … 산산이 부수고
  - 나는 … 깨뜨리고
  - 나는 … 산산조각 내고
  lexicon: HALOT
  rationale: פּצץ의 강한 파괴 의미를 살리면서 한국어에서는 전투 맥락에 자연스러운 ‘부수다’가 가장 직접적입니다. 반복되는 동사를 두 번 모두 일관되게 옮겼습니다.
- source_word: בְּךָ
  english_pob_choice: with you
  chosen_korean: 당신으로 말미암아
  alternatives_korean:
  - 당신을 통해
  - 당신으로
  - 당신과 함께
  lexicon: HALOT
  rationale: 전치사는 도구적·매개적 의미를 가지므로, 야훼께서 직접 행위 주체이시되 상대를 수단으로 삼으신다는 점을 드러내기 위해 ‘당신으로 말미암아’를 택했습니다.
- source_word: סוּס / רֶכֶב
  english_pob_choice: horse / chariot
  chosen_korean: 말 / 전차
  alternatives_korean:
  - 군마 / 병거
  - 말 / 병거
  - 전마 / 전차
  lexicon: HALOT
  rationale: סוּס는 단순히 ‘말’이며, רֶכֶב은 문맥상 전쟁 수단인 ‘전차’가 가장 자연스럽습니다. 한국어 성서 표현의 가독성을 고려하되, 본문이 요구하는 군사적 이미지는 유지했습니다.
- source_word: רֹכְבוֹ
  english_pob_choice: its rider / rider
  chosen_korean: 그 탄 자
  alternatives_korean:
  - 그 승마자
  - 기수
  - 탄 사람
  lexicon: HALOT
  rationale: רֹכֵב의 기본 뜻은 ‘타는 자’이므로, ‘그 탄 자’가 직역성과 자연스러움의 균형을 가장 잘 맞춥니다. 첫 번째와 두 번째 병행구 모두 같은 방식으로 처리해 히브리어의 평행을 살렸습니다.
theological_decisions:
- issue: 행위 주체와 수단의 긴장 유지
  chosen_reading: 본문은 하나님이 직접 ‘내가 부수었다’고 말씀하시면서도, 상대는 그분의 도구로서 ‘당신으로 말미암아’ 제시합니다.
  alternative_readings:
  - 당신을 통해 내가 부수었습니다
  - 당신에 의해 내가 부수었습니다
  rationale: 히브리어의 첫인칭 동사와 2인칭 전치사구의 결합을 그대로 반영하여, 심판의 주권은 하나님께 있고 상대는 수단이라는 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 하나님의 주권적 심판과 도구적 매개성을 함께 유지
