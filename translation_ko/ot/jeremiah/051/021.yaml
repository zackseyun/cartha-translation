source:
  edition: WLC
  text: וְ/נִפַּצְתִּ֣י בְ/ךָ֔ ס֖וּס וְ/רֹֽכְב֑/וֹ וְ/נִפַּצְתִּ֣י בְ/ךָ֔ רֶ֖כֶב וְ/רֹכְבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/021.yaml
  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
  footnotes:
  - marker: a
    text: Or 'I smashed' / 'I broke in pieces'; the Hebrew verb conveys violent breaking.
    reason: lexical_alternative
  - marker: b
    text: Or 'by you' or 'through you'; the Hebrew preposition indicates instrumentality.
    reason: lexical_alternative
  - marker: c
    text: '''Chariot'' may also be understood more collectively as ''chariotry'' in some contexts, but the singular pairing here favors ''chariot.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신으로 말미암아 내가 말과 그 위에 탄 자를 산산이 부수었고,[a][b] 또 당신으로 말미암아 내가 전차[c]와 그 위에 탄 자를 산산이 부수었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 נִפַּצְתִּי는 단순히 ‘부수다’보다 더 강한 ‘산산이 부수다’ 또는 ‘깨뜨리다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 전치사 בְּךָ는 여기서 ‘당신으로 말미암아’ 또는 ‘당신을 통해’라는 도구적 의미를 가집니다.
    reason: lexical_alternative
  - marker: c
    text: רֶכֶב은 문맥에 따라 ‘전차’뿐 아니라 ‘전차대’ 또는 ‘전차부대’처럼 집합적으로도 이해될 수 있습니다. 그러나 여기서는 단수 명사와 ‘그 위에 탄 자’의 짝이므로 ‘전차’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפַּצְתִּי
  english_pob_choice: I shattered
  chosen_korean: 나는 … 부수고 / 부수었습니다
  alternatives_korean:
