base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
  footnotes:
  - marker: a
    text: Or 'Do not perish in her guilt' or 'Do not be destroyed because of her iniquity.' The Hebrew can express either being caught up in Babylon's sin or in the judgment that comes because of it.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론 한가운데에서 도망하십시오. 각자 자기 생명을 구하십시오. 바벨론의 죄악 가운데서 끊어지지 마십시오.[a] 이는 야훼의 보복의 때이기 때문입니다. 그가 바벨론에게 마땅한 보응을 갚고 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바벨론의 죄책 가운데서 멸망하지 마십시오” 또는 “바벨론의 죄악 때문에 파멸당하지 마십시오.” 히브리어는 바벨론의 죄에 함께 휩쓸리는 것과 그 죄로 인해 오는 심판을 받는 것을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ מִתּוֹךְ בָּבֶל
  english_pob_choice: Flee from the midst of Babylon
