  naturalness: 초안은 명령형 ‘도망하라/구하라/말라’와 종결형 ‘때문입니다/계십니다’를 혼용하여 지정된 현대 합쇼체와 일관되지 않습니다. 또한 ‘그가 그에게 합당한 것을 그에게’는 지시 대상이 불명확하고 비자연스럽습니다.
  terminology: ‘야훼’는 제공된 방침과 일치합니다. נְקָמָה는 하나님의 공적 심판 문맥에서 ‘보복’으로, גְּמוּל은 ‘마땅한 보응’으로 옮겨 보응의 의미를 유지했습니다.
