source:
  edition: WLC
  text: נֻ֣סוּ מִ/תּ֣וֹךְ בָּבֶ֗ל וּ/מַלְּטוּ֙ אִ֣ישׁ נַפְשׁ֔/וֹ אַל תִּדַּ֖מּוּ בַּ/עֲוֺנָ֑/הּ כִּי֩ עֵ֨ת נְקָמָ֥ה הִיא֙ לַֽ/יהוָ֔ה גְּמ֕וּל ה֥וּא מְשַׁלֵּ֖ם לָֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
  footnotes:
  - marker: a
    text: Or 'Do not perish in her guilt' or 'Do not be destroyed because of her iniquity.' The Hebrew can express either being caught up in Babylon's sin or in the judgment that comes because of it.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론 한가운데에서 도망하라. 각자 자기 생명을 구하라. 그들의 죄악 때문에 끊어지지 말라. 이는 야훼의 복수의 때이기 때문입니다. 그가 그에게 합당한 것을 그에게 갚고 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀의 죄책 속에서 멸망하지 말라” 혹은 “그녀의 죄악 때문에 파멸당하지 말라”. 히브리어는 바벨론의 죄에 함께 휩쓸리는 것과 그 죄로 인해 오는 심판 둘 다를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ מִתּוֹךְ בָּבֶל
  english_pob_choice: Flee from the midst of Babylon
  chosen_korean: 바벨론 한가운데에서 도망하라
  alternatives_korean:
  - 바벨론 가운데에서 도망하라
  - 바벨론 속에서 달아나라
  lexicon: HALOT
  rationale: מִתּוֹךְ의 ‘가운데/한가운데’ 이미지를 살리면서, 현대 한국어에서 자연스러운 긴박한 명령형으로 옮겼습니다.
- source_word: וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  english_pob_choice: and let each man save his life
  chosen_korean: 각자 자기 생명을 구하라
  alternatives_korean:
  - 각 사람은 자기 목숨을 구하라
  - 모든 사람이 자기 생명을 건져라
  lexicon: HALOT
  rationale: נֶפֶשׁ를 여기서는 ‘생명/목숨’으로 풀어 현실적 위험을 분명히 했고, אִישׁ의 대표적 남성 단수는 ‘각자’로 자연스럽게 반영했습니다.
- source_word: אַל תִּדַּמּוּ בַּעֲוֺנָהּ
  english_pob_choice: Do not be cut off in her iniquity
  chosen_korean: 그들의 죄악 때문에 끊어지지 말라
  alternatives_korean:
  - 그들의 죄악 가운데서 끊어지지 말라
  - 그들의 죄악에 함께 멸망하지 말라
  lexicon: HALOT
  rationale: דמה의 심판 문맥을 살려 ‘끊어지다’로 옮겼고, עָוֹן은 죄책과 그로 인한 멸망을 함께 가리킬 수 있어 ‘죄악 때문에’로 인과를 분명히 했습니다.
- source_word: עֵת נְקָמָה הִיא לַיהוָה
  english_pob_choice: for this is the time of Yahweh's vengeance
  chosen_korean: 이는 야훼의 복수의 때이기 때문입니다
  alternatives_korean:
  - 이는 야훼께서 복수하실 때이기 때문입니다
  - 이는 야훼의 보복의 때이기 때문입니다
  lexicon: HALOT
  rationale: עֵת נְקָמָה의 고정된 심판 표현을 ‘복수의 때’로 직역에 가깝게 살리되, 한국어 어순에 맞게 이유절로 처리했습니다.
- source_word: גְּמוּל הוּא מְשַׁלֵּם לָהּ
  english_pob_choice: he is repaying her what she deserves
  chosen_korean: 그가 그에게 합당한 것을 그에게 갚고 계십니다
  alternatives_korean:
  - 그가 그에게 마땅한 보응을 갚고 계십니다
  - 그가 그에게 응당한 보답을 하고 계십니다
  lexicon: HALOT
  rationale: גְּמוּל의 ‘갚음/보응’ 의미를 살리면서 반복을 피하기 위해 ‘합당한 것’과 ‘갚다’를 조합했습니다. 대명사 성별은 한국어에서 대상 표지를 중립화했습니다.
