revisions:
- from: 바빌론은 야훼의 손에 든 금잔이어서 온 땅을 취하게 합니다. 민족들은 그녀의 포도주를 마셨으므로 — 그러므로 민족들은 미쳐 버렸습니다.[a][b]
  to: 바빌론은 야훼의 손에 있는 금잔으로서 온 땅을 취하게 하였습니다. 민족들이 그 포도주를 마셨으므로, 민족들은 미쳐 날뜁니다.[a]
  rationale: 인과 접속의 중복을 제거하고, 원문의 술 취함 비유 및 그 결과로서의 광란을 자연스러운 현대 한국어 합쇼체로 유지했습니다. ‘야훼의 손에 있는’은 바빌론이 야훼의 수중에 있는 도구라는 원문의 비유를 보존합니다.
