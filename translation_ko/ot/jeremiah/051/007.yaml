  source_fidelity: 핵심 비유와 인과관계는 대체로 충실합니다. 다만 원문의 마지막 미완료형은 술 취함의 결과로 나타나는 광란의 행동을 나타내므로, 단순히 완료된 상태를 뜻하는 ‘미쳐 버렸습니다’보다 ‘미쳐 날뜁니다’가 더 직접적입니다.
