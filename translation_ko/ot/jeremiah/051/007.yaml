  text: כּוֹס זָהָ֤ב בָּבֶל֙ בְּ/יַד יְהוָ֔ה מְשַׁכֶּ֖רֶת כָּל הָ/אָ֑רֶץ מִ/יֵּינָ/הּ֙ שָׁת֣וּ גוֹיִ֔ם עַל כֵּ֖ן יִתְהֹלְל֥וּ גוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/007.yaml
  text: Babylon was a golden cup in the hand of Yahweh[a], making all the earth drunk. Nations drank from her wine[b]; therefore the nations have gone mad.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the LORD''; the divine name is YHWH.'
    reason: alternative_reading
  - marker: b
    text: Or 'the nations act like madmen' or 'the nations are driven mad.' The Hebrew verb here likely carries the sense of frenzy or madness in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론은 야훼의 손에 있는 금잔으로서 온 땅을 취하게 하였습니다. 민족들이 그 포도주를 마셨으므로, 민족들은 미쳐 날뜁니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미쳐 날뜁니다’는 문맥상 ‘광란에 빠지다’, ‘정신없이 날뛰다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס זָהָב
  english_pob_choice: a golden cup
  chosen_korean: 금잔
  alternatives_korean:
  - 황금 잔
  - 금으로 된 잔
  lexicon: HALOT
  rationale: 히브리어의 명사구는 바빌론을 비유적으로 가리키는 표현이므로, 한국어도 자연스럽게 압축해 ‘금잔’으로 옮겨 이미지와 비유성을 살렸습니다.
- source_word: בְּיַד יְהוָה
  english_pob_choice: in the hand of Yahweh
  chosen_korean: 야훼의 손에 든
  alternatives_korean:
  - 야훼의 손안에 있는
  - 야훼의 손에 있는
  lexicon: HALOT
  rationale: ‘손에’는 소유와 도구성을 함께 드러내며, ‘든’은 바빌론이 야훼의 수중에 있는 도구라는 뉘앙스를 살립니다.
- source_word: מְשַׁכֶּרֶת כָּל הָאָרֶץ
  english_pob_choice: making all the earth drunk
  chosen_korean: 온 땅을 취하게 합니다
  alternatives_korean:
  - 온 땅을 술 취하게 합니다
  - 온 땅을 취하게 만드는
  - 온 땅을 취하게 하고
  lexicon: HALOT
  rationale: 분사형의 지속적·작용적 의미를 살리면서, 현대 한국어에서 과도하게 직역된 느낌을 피하려고 ‘취하게 합니다’로 옮겼습니다.
- source_word: גוֹיִם / יִתְהֹלְל֥וּ גוֹיִם
  english_pob_choice: Nations ... the nations have gone mad
  chosen_korean: 민족들은 ... 민족들은 미쳐 버렸습니다
  alternatives_korean:
  - 열방은 ... 열방은 미쳐 버렸습니다
  - 나라들은 ... 나라들은 미쳐 버렸습니다
  - 민족들은 ... 민족들은 광란에 빠졌습니다
  lexicon: HALOT
  rationale: ‘גוֹיִם’은 문맥상 여러 민족/나라들을 가리키므로 ‘민족들’로 옮겼고, ‘יִתְהֹלְלּוּ’는 이 문맥의 술 취함에서 비롯된 광란/정신이상 의미를 따라 ‘미쳐 버렸습니다’로 번역했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와 대체표현이 아닌 신명기적 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 바빌론의 도구성과 야훼의 주권
  chosen_reading: 바빌론은 야훼의 손에 든 금잔으로서 열방을 취하게 하는 존재
  alternative_readings:
  - 바빌론이 단지 정치적 혼란의 상징
  - 야훼와 무관하게 열방을 취하게 하는 바빌론
  rationale: 본문이 ‘야훼의 손’ 아래에 바빌론을 두므로, 바빌론의 작용과 동시에 야훼의 주권을 함께 드러내는 번역을 유지했습니다.
  doctrine_reference: Jeremiah 51:7 source context
