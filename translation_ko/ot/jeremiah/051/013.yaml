  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שכנתי עַל מַ֣יִם רַבִּ֔ים רַבַּ֖ת אֽוֹצָרֹ֑ת בָּ֥א קִצֵּ֖/ךְ אַמַּ֥ת בִּצְעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/013.yaml
  text: You who dwell by many waters[a], rich in treasures, your end has come[b], the measure of your greed.
  footnotes:
  - marker: a
    text: Or 'upon many waters.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the cubit of your unjust gain,' likely meaning 'the measure/limit of your unjust gain.'
    reason: lexical_alternative
translation:
  language: ko
  text: “너는 많은 물 위에 거하며, 보물들이 많은 자야. 너의 끝이 이르렀고, 너의 탐욕의 한계가 왔습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 물 위에’.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘너의 부정한 이익의 규빗’이며, 여기서는 ‘너의 부정한 이익의 한계/척도’라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שכנתי עַל מַיִם רַבִּים
  english_pob_choice: You who dwell by many waters
  chosen_korean: “너는 많은 물 위에 거하며”
  alternatives_korean:
  - “너는 많은 물가에 거하며”
  - “많은 물 위에 거하는 자여”
  lexicon: HALOT
  rationale: עַל은 문맥상 ‘위에/가에/by’의 넓은 의미를 가질 수 있으나, 도시를 향한 직접 호칭을 살리면서 원문 이미지도 보이도록 ‘많은 물 위에’로 옮겼습니다.
- source_word: רַבַּת אֹצָרוֹת
  english_pob_choice: rich in treasures
  chosen_korean: 보물들이 많은
  alternatives_korean:
  - 보화가 풍부한
  - 보물에 부요한
  lexicon: HALOT
  rationale: רַבַּת은 ‘많은/풍부한’의 의미이므로, 현대 한국어에서는 ‘보물들이 많은’이 자연스럽고 수량적 풍성함을 잘 드러냅니다.
- source_word: בָּא קִצֵּךְ
  english_pob_choice: your end has come
  chosen_korean: 너의 끝이 이르렀고
  alternatives_korean:
  - 너의 끝이 왔습니다
  - 너의 종말이 다가왔습니다
  lexicon: HALOT
  rationale: 완료형의 선언적 어조를 살려 ‘이르렀고’로 옮겼습니다. 예언적 심판 선고의 확정성을 유지합니다.
- source_word: אַמַּת בִּצְעֵךְ
  english_pob_choice: the measure of your greed
  chosen_korean: 너의 탐욕의 한계가 왔습니다
  alternatives_korean:
  - 너의 부정한 이익의 척도가 왔습니다
  - 너의 탐욕의 척도가 왔습니다
  lexicon: HALOT
  rationale: אַמַּת은 문자적으로 ‘규빗/척도’지만 여기서는 ‘한계/측정된 분량’의 뜻이 문맥상 적절합니다. בִּצְעֵךְ는 단순한 이익보다 탐욕적이고 부정한 축재의 뉘앙스를 지니므로 ‘탐욕’으로 보존했습니다.
theological_decisions:
- issue: 바벨론을 향한 여성 단수 직접 호칭
  chosen_reading: 이 절은 바벨론을 여성 단수 도시 인격으로 직접 부르며 심판을 선포합니다.
  alternative_readings:
  - 여성 개인 거주자에게 대한 호칭
  - 도시의 주민 전체를 가리키는 집합적 표현
  rationale: 히브리어 여성 단수 형태와 예언서의 도시 의인화 관습을 따라 직접 대면하는 어조를 유지했습니다. 이는 문법과 수사에 근거한 선택이며 신학적 내용을 추가하지 않습니다.
  doctrine_reference: 예언서의 도시 의인화
