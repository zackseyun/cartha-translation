review_pass:
  verdict: revise
  source_fidelity: 히브리어는 여성 단수로 의인화된 바벨론을 직접 부르며, ‘많은 물’과 풍부한 보물, 도래한 끝, 그리고 부정한 이익의 ‘척도/한계’를 병치합니다. 초안의 ‘탐욕’은 בֶּצַע의 부정한 이익·탐욕의 뉘앙스를 반영할 수 있으나, 뒤의 ‘한계’와 결합할 때 ‘부정한 이익’이 원문의 대상어를 더 직접적으로 보존합니다. 또한 원문의 두 종결 선언을 한국어에서도 각각 분명히 드러냈습니다.
  naturalness: 초안은 ‘자야’라는 해체/반말형과 ‘왔습니다’라는 합쇼체가 섞여 있어 요구된 현대 표준 합쇼체에 맞지 않습니다. ‘많은 물 위에’는 직역으로는 가능하지만 도시의 입지를 가리키는 문맥에서는 ‘많은 물 곁에 사는’이 자연스럽습니다.
  terminology: ‘보물이 풍부한’은 רַבַּת אֹצָרוֹת의 풍요를 자연스럽게 옮깁니다. ‘부정한 이익’은 בֶּצַע가 지닌 탐욕적·불의한 이득의 의미를 보존하며, ‘한계’는 אַמָּה의 문자적 ‘규빗/척도’가 이 문맥에서 가리키는 제한된 분량이라는 의미를 전달합니다. 각주에서 문자적 표현을 유지합니다.
