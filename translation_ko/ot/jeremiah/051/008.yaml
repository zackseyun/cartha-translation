  text: פִּתְאֹ֛ם נָפְלָ֥ה בָבֶ֖ל וַ/תִּשָּׁבֵ֑ר הֵילִ֣ילוּ עָלֶ֗י/הָ קְח֤וּ צֳרִי֙ לְ/מַכְאוֹבָ֔/הּ אוּלַ֖י תֵּרָפֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/008.yaml
  text: Suddenly Babylon has fallen and been shattered[a]. Wail over her! Take balm for her pain; perhaps she may be healed.
  footnotes:
  - marker: a
    text: Or 'balsam' or 'healing balm.' The Hebrew refers to a medicinal resin used for treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론이 갑자기 무너지고 산산이 부서졌습니다[a]. 그녀를 두고 통곡하십시오! 그녀의 고통에 바를 연고를 가져오십시오. 어쩌면 그녀가 나을지도 모릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발삼’ 또는 ‘치유용 수지’. 히브리어는 치료에 쓰이던 약용 수지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְאֹם
  english_pob_choice: Suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 순식간에
  - 홀연히
  lexicon: HALOT
  rationale: 갑작스러움과 충격을 가장 자연스럽게 살리는 현대 한국어 대응입니다.
- source_word: נָפְלָה / וַתִּשָּׁבֵר
  english_pob_choice: has fallen and been shattered
  chosen_korean: 무너지고 산산이 부서졌습니다
  alternatives_korean:
  - 쓰러지고 깨졌습니다
  - 함락되고 부서졌습니다
  lexicon: HALOT
  rationale: 두 동사의 병렬이 강조하는 급격한 파괴를 한국어의 두 겹 표현으로 살렸습니다. '산산이'는 파괴의 강도를 보존합니다.
- source_word: הֵילִילוּ עָלֶיהָ
  english_pob_choice: Wail over her
  chosen_korean: 그녀를 두고 통곡하십시오
  alternatives_korean:
  - 그녀를 위해 애곡하십시오
  - 그녀를 두고 슬퍼하십시오
  lexicon: HALOT
  rationale: 애가적 명령형의 강도를 유지하면서도 현대 문체에서 자연스럽고 직접적인 '통곡하다'를 택했습니다. עַל의 애도 관용법은 '두고'로 옮겼습니다.
- source_word: צֳרִי
  english_pob_choice: balm
  chosen_korean: 연고
  alternatives_korean:
  - 향유
  - 치유용 수지
  lexicon: HALOT
  rationale: 본문의 רפוא적 이미지와 'pain'에 바르는 처치를 살리되, 주석 없이도 이해되는 현대어로 옮겼습니다. 다만 본래는 약재성 수지라는 점을 주석으로 보완할 수 있습니다.
theological_decisions:
- issue: 바빌론의 여성형 인칭 유지
  chosen_reading: 바빌론을 '그녀'로 유지했습니다.
  alternative_readings:
  - 그것
  - 바빌론
  rationale: 히브리어가 바빌론을 여성 단수로 일관되게 의인화하므로, 그 수사적·시적 효과를 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §5
