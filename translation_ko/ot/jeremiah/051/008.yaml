- from: 바빌론이 갑자기 무너지고 산산이 부서졌습니다[a]. 그녀를 두고 통곡하십시오! 그녀의 고통에 바를 연고를 가져오십시오. 어쩌면 그녀가 나을지도 모릅니다.
  to: 바빌론이 갑자기 무너져 산산이 부서졌습니다[a]. 그녀를 두고 통곡하십시오! 그녀의 고통을 위해 약용 향유를 가져오십시오. 어쩌면 그녀가 나을지도 모릅니다.
  rationale: 원문의 치료 비유와 צֳרִי의 약용 성격은 유지하되, 원문에 없는 ‘바르다’의 구체적 행위를 제거했습니다. 바빌론의 여성 의인화, 애도의 강한 명령, 그리고 ‘어쩌면’이 나타내는 불확실성은 그대로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:36:50Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 급작스러운 멸망, 바빌론의 여성 의인화, 애도의 명령과 불확실한 회복 가능성을 충실히 반영합니다. 다만 לְמַכְאוֹבָהּ는 ‘그녀의 고통을 위해’라는 목적·용도 표현이며, ‘고통에 바를’은 원문에 없는 국소 도포의 뜻을 덧붙입니다.
  naturalness: ‘그녀의 고통에 바를 연고’는 한국어에서 다소 어색할 뿐 아니라 ‘고통’과 결합할 때 의미가 부정확합니다. ‘그녀의 고통을 위해 약용 향유를 가져오십시오’가 현대 합쇼체로 자연스럽습니다. 첫 문장도 ‘무너져’로 연결하면 파괴의 연속성이 매끄럽습니다.
  terminology: צֳרִי는 약용 수지성 향유/발삼을 가리킵니다. 본문에서는 이해하기 쉬운 ‘약용 향유’를 사용하고, 각주에서 ‘발삼’ 및 약용 수지라는 어휘적 배경을 보완하는 것이 적절합니다. 여성 대명사 ‘그녀’는 원문의 의인화를 보존합니다.
  issues:
