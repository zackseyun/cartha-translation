id: JER.51.53
reference: Jeremiah 51:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'plunderers.' The Hebrew term can denote those who devastate by plundering as well as destroying.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the height of her strength.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론이 하늘까지 올라가고, 자기의 높은 요새를 굳게 하더라도, 파괴자들이 내게서 그에게로 올 것입니다—야훼의 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘파괴자들’로 옮겼지만, 히브리어는 ‘약탈자들’처럼 파괴와 약탈을 함께 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 힘의 높이’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָבֶל
  english_pob_choice: Babylon
  chosen_korean: 바빌론
  alternatives_korean:
  - 바벨
  lexicon: 고유명사 표기
  rationale: 현대 한국어 외래어 표기법을 따라 지명은 바빌론으로 옮기되, 히브리어 음가를 무리 없이 반영했습니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘까지
  alternatives_korean:
  - 하늘들까지
  - 하늘에까지
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 자연스럽게 ‘하늘’로 옮기면서, 과장된 상승 이미지는 ‘까지’로 살렸습니다.
- source_word: מְרוֹם עֻזָּהּ
  english_pob_choice: her lofty stronghold
  chosen_korean: 자기의 높은 요새
  alternatives_korean:
  - 그녀의 높은 보루
  - 그녀의 높디높은 성채
  lexicon: HALOT
  rationale: 문맥상 방어 시설을 가리키므로 ‘요새’가 가장 분명하며, ‘מרום’의 높음을 ‘높은’으로 직역해 결합 의미를 드러냈습니다.
- source_word: שֹׁדְדִים
  english_pob_choice: destroyers
  chosen_korean: 파괴자들
  alternatives_korean:
  - 약탈자들
  - 훼손자들
  - 파괴하는 자들
  lexicon: HALOT
  rationale: 영문 POB가 주석으로 약탈 의미도 인정하지만, 이 절의 심판 문맥에서는 파괴 행위를 전면에 드러내는 ‘파괴자들’이 더 적절합니다.
- source_word: מֵאִתִּי
  english_pob_choice: from me
  chosen_korean: 내게서
  alternatives_korean:
  - 나에게서
  - 나로부터
  - 내 손에서
  lexicon: HALOT
  rationale: 심판의 출처가 야훼 자신에게 있음을 직접적으로 나타내기 위해 ‘내게서’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: 예언문 종결 공식
  rationale: 히브리어 예언 공식의 엄숙함을 살리면서도 현대 한국어 문장으로 자연스럽게 마무리하기 위해 ‘말씀입니다’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 자료의 원문과 POB 원칙에 따라 여호와 전승형이 아니라 신명기적 고유명사인 야훼를 그대로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
