source:
  edition: WLC
  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'plunderers.' The Hebrew term can denote those who devastate by plundering as well as destroying.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the height of her strength.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론이 하늘까지 올라가고, 또 그 힘의 높은 곳을[b] 견고히 한다 해도, 파괴자들이[a] 나에게서 바빌론에게로 올 것입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘파괴자들’로 옮겼지만, 히브리어는 ‘약탈자들’처럼 파괴와 약탈을 함께 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그녀의 힘의 높이’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָבֶל
  english_pob_choice: Babylon
  chosen_korean: 바빌론
  alternatives_korean:
