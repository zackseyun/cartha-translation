  text: וְ/הָיָה֙ כְּ/כַלֹּ֣תְ/ךָ֔ לִ/קְרֹ֖א אֶת הַ/סֵּ֣פֶר הַ/זֶּ֑ה תִּקְשֹׁ֤ר עָלָי/ו֙ אֶ֔בֶן וְ/הִשְׁלַכְתּ֖/וֹ אֶל תּ֥וֹךְ פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/063.yaml
  text: And when you finish reading this scroll[a], tie a stone to it and throw it into the midst of the Euphrates[b],
  footnotes:
  - marker: a
    text: Or 'this book.' The Hebrew סֵפֶר can denote a written document generally, but here likely refers to a scroll.
    reason: lexical_alternative
  - marker: b
    text: Or 'into the midst of the Euphrates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네가 이 두루마리를 다 읽고 나면, 그것에 돌을 매어 유프라테스 한가운데로 던지십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 책’. 히브리어 סֵפֶר는 일반적인 문서도 가리킬 수 있지만, 여기서는 두루마리를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘유프라테스 가운데로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתְךָ לִקְרֹא
  english_pob_choice: you finish reading
  chosen_korean: 다 읽고 나면
  alternatives_korean:
  - 읽기를 마치면
  - 다 읽은 뒤에
  lexicon: HALOT
  rationale: ‘~를 다 읽고 나면’은 완료 시점을 자연스럽게 드러내면서도 히브리어의 ‘읽기를 마친 때’라는 조건적 시간 구조를 잘 살립니다.
- source_word: אֶת הַסֵּפֶר הַזֶּה
  english_pob_choice: this scroll
  chosen_korean: 이 두루마리
  alternatives_korean:
  - 이 책
  - 이 문서
  lexicon: HALOT
  rationale: סֵפֶר는 여기서 현대적 ‘책’보다 필사 문서인 두루마리를 가리키는 것이 더 정확하므로, POB의 ‘scroll’을 따라 ‘두루마리’로 옮겼습니다.
- source_word: תִּקְשֹׁר עָלָיו אֶבֶן
  english_pob_choice: tie a stone to it
  chosen_korean: 그것에 돌을 매어
  alternatives_korean:
  - 돌을 그것에 묶어
  - 돌을 매달아
  lexicon: HALOT
  rationale: קשר는 ‘매다/묶다’의 뜻이어서 ‘돌을 매어’가 가장 간결하고 원문 동작을 잘 전달합니다.
- source_word: פְּרָת
  english_pob_choice: the Euphrates
  chosen_korean: 유프라테스 한가운데
  alternatives_korean:
  - 유프라테스 가운데
  - 유프라테스의 한가운데
  lexicon: HALOT
  rationale: פְּרָת는 유프라테스 강의 고유명사이므로 표준 음역 ‘유프라테스’를 사용했고, תּוֹךְ의 공간성을 살려 ‘한가운데’로 옮겼습니다.
theological_decisions:
- issue: 명령형의 공손한 처리
  chosen_reading: “던지십시오”로 옮겨 화자-독자 간의 직접 명령을 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - 던지세요
  - 던져라
  rationale: 이 구절은 예레미야에게 주는 직접 지시이므로 명령성을 약화하지 않으면서도 현대 한국어 문체에 맞는 공손한 명령형이 적절합니다.
  doctrine_reference: 문체/화법 일관성
