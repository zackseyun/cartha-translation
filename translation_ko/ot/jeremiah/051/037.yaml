base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/037.yaml
  text: And Babylon will become heaps[a], a haunt of jackals, a horror and a hissing[c][b], with no inhabitant.
  footnotes:
  - marker: a
    text: Or 'heaps' or 'ruin-heaps'; the Hebrew is plural.
    reason: lexical_alternative
  - marker: b
    text: Or 'dragons' in older English versions; the Hebrew term here is more likely 'jackals' in a desolation setting.
    reason: lexical_alternative
  - marker: c
    text: Or 'a whistling,' that is, an object of derision.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론은 무더기[a]가 되고, 승냥이의 굴이 되며, 사람들의 비웃음거리와 휘파람거리가 될 것입니다[c][b]. 그곳에는 거주하는 이가 아무도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무더기들’, ‘폐허 무더기들’로 옮길 수 있습니다. 히브리어는 복수형입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자칼들’입니다. 이 황폐한 문맥에서는 야생 개과 동물을 가리키는 말로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘휘파람’, 곧 멸망한 곳을 향한 조롱의 신호입니다.
    reason: lexical_alternative
