theological_decisions:
- issue: 심판 예언의 조롱 어휘를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘휘파람거리’와 ‘비웃음거리’를 함께 써서, 폐허가 된 바빌론을 향한 공개적 조롱의 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘경악거리’로 완화
  - ‘놀람거리’로 중화
  - ‘비웃음과 휘파람’처럼 직역
  rationale: 히브리어 어휘는 단순한 황폐함이 아니라 타인의 조롱 대상이 된 상태를 함께 말하므로, 이를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 예언서의 심판 선언과 수치/조롱 모티프
