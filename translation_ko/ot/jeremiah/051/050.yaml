  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּלֵטִ֣ים מֵ/חֶ֔רֶב הִלְכ֖וּ אַֽל תַּעֲמֹ֑דוּ זִכְר֤וּ מֵֽ/רָחוֹק֙ אֶת יְהוָ֔ה וִ/ירֽוּשָׁלִַ֖ם תַּעֲלֶ֥ה עַל לְבַבְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/050.yaml
  text: You who have escaped the sword[a], go; do not stand still. Remember Yahweh from far away, and let Jerusalem come upon your heart.
  footnotes:
  - marker: a
    text: Or 'from afar remember the LORD, and let Jerusalem come to mind.' The Hebrew literally says 'let Jerusalem go up upon your heart,' an idiom for inward remembrance or concern.
    reason: lexical_alternative
translation:
  language: ko
  text: 칼에 피한 자들아, 가라. 멈추어 서 있지 마라. 먼 곳에서 야훼를 기억하며, 예루살렘이 너희 마음에 올라오게 하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 ‘예루살렘이 너희 마음 위로 올라오게 하라’입니다. 이는 예루살렘을 마음에 새기거나 염려하라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלֵטִים מֵ/חֶרֶב
  english_pob_choice: You who have escaped the sword
  chosen_korean: 칼에 피한 자들아
  alternatives_korean:
  - 칼에서 벗어난 자들아
  - 칼을 피하여 살아남은 자들아
  - 칼에서 도망한 자들아
  lexicon: HALOT
  rationale: פְּלֵטִים은 집단을 향한 직접 호칭이므로 ‘자들아’로 부르고, מֵחֶרֶב은 자연스러운 한국어 관용에 맞게 ‘칼에 피한’으로 옮겨 전쟁과 죽음의 위협에서의 탈출을 드러냈습니다.
- source_word: הִלְכוּ אַל תַּעֲמֹדוּ
  english_pob_choice: go; do not stand still
  chosen_korean: 가라. 멈추어 서 있지 마라.
  alternatives_korean:
  - 가십시오. 서 있지 마십시오.
  - 가라. 서 있지 마라.
  - 가라. 머물러 서 있지 마라.
  lexicon: HALOT
  rationale: 연속된 명령형의 긴박함을 살리기 위해 짧은 두 절로 끊었고, אַל תַּעֲמֹדוּ는 단순한 ‘서다’보다 ‘멈추어 서 있다’가 지체하지 말라는 뜻을 더 분명히 전합니다.
- source_word: זִכְרוּ מֵ/רָחוֹק אֶת יְהוָה
  english_pob_choice: remember Yahweh from far away
  chosen_korean: 먼 곳에서 야훼를 기억하며
  alternatives_korean:
  - 먼 곳에서 야훼를 기억하고
  - 멀리서 야훼를 기억하며
  - 먼 데서 야훼를 생각하며
  lexicon: HALOT
  rationale: מֵרָחוֹק은 ‘멀리서’라는 처소를 나타내므로 앞에 두어 원문 어순의 힘을 살렸고, זִכְרוּ는 언약적 뉘앙스를 지닌 ‘기억하다’로 유지했습니다.
- source_word: וִ/ירוּשָׁלִַם תַּעֲלֶה עַל לְבַבְכֶם
  english_pob_choice: let Jerusalem come upon your heart
  chosen_korean: 예루살렘이 너희 마음에 올라오게 하라
  alternatives_korean:
  - 예루살렘을 마음에 떠올리게 하라
  - 예루살렘이 너희 마음에 스치게 하라
  - 예루살렘을 마음에 두게 하라
  lexicon: HALOT
  rationale: 직역하면 ‘마음 위로 올라가다’라는 관용구이므로, 의미를 풀되 이미지의 방향성을 보존하는 ‘올라오게 하라’를 택했습니다.
theological_decisions:
