  source_fidelity: 첫째 동사 נִתְפָּשׂוּ는 수동으로, 마지막 동사 נִבְהָלוּ는 상태/수동으로 잘 반영되었습니다. 다만 שָׂרְפוּ는 문자적으로 ‘그들이 불태웠다’인 능동 복수(행위자는 특정되지 않음)인데, 초안의 ‘불에 타 버렸으며’는 자동적으로 타 버린 듯한 표현이고 완료·소멸의 뉘앙스까지 더합니다. 한국어의 비인칭적 수동 표현으로 재구성하여 불태움의 사건성을 드러내는 편이 안전합니다.
  naturalness: ‘나루들’은 배 자체를 가리킬 수도 있어 전략적 통과 지점이라는 뜻이 다소 불분명합니다. ‘나루터들’은 자연스럽고 지형·군사 문맥에도 맞습니다. ‘늪지들’과 ‘불태워졌으며’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: הַמַּעְבָּרוֹת에는 ‘나루터들’을 사용하고, הָאֲגַמִּים에는 습지성 물웅덩이/늪지라는 범위를 보존하는 ‘늪지들’을 사용했습니다. אַנְשֵׁי הַמִּלְחָמָה의 ‘전사들’은 자연스럽고 군사 집단을 적절히 나타냅니다. 각주 c는 본문 표현과 중복되는 ‘전사들’을 대안으로 제시하지 않고 더 명료한 대안을 제시하도록 조정했습니다.
