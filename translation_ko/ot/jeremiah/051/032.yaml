id: JER.51.32
reference: Jeremiah 51:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מַּעְבָּר֣וֹת נִתְפָּ֔שׂוּ וְ/אֶת הָ/אֲגַמִּ֖ים שָׂרְפ֣וּ בָ/אֵ֑שׁ וְ/אַנְשֵׁ֥י הַ/מִּלְחָמָ֖ה נִבְהָֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/032.yaml
  text: The crossings have been seized[a], the marshes have been burned with fire[c][b], and the men of war are terrified.
  footnotes:
  - marker: a
    text: Or 'the fords have been seized.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the pools'; the Hebrew term can refer to marshy pools or swampy areas.
    reason: lexical_alternative
  - marker: c
    text: Or 'the warriors' or 'the fighting men.' Literally, 'the men of war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나루들은 점령되었고[a], 늪들은 불에 타 버렸으며[b], 전사들은 겁에 질렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나루터들은 점령되었다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘연못들’ 혹은 ‘물웅덩이들’이라는 뜻입니다. 히브리어는 습지성 물웅덩이나 늪지대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘전사들’이나 ‘싸우는 사람들’입니다. 문자적으로는 ‘전쟁의 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבָּרוֹת
  english_pob_choice: the crossings
  chosen_korean: 나루들
  alternatives_korean:
  - 건너는 곳들
  - 도강 지점들
  - 나루터들
  lexicon: HALOT
  rationale: מַעְבָּר의 핵심은 ‘건너는 지점’이므로, 한국어에서는 자연스럽고 지형·군사적 맥락을 살릴 수 있는 ‘나루들’로 옮겼습니다. '나루터들'보다 더 간결하고, '건너는 곳들'보다 더 관용적입니다.
- source_word: נִתְפָּשׂוּ
  english_pob_choice: have been seized
  chosen_korean: 점령되었고
  alternatives_korean:
  - 붙잡혔고
  - 빼앗겼고
  - 사로잡혔고
  lexicon: HALOT
  rationale: 이 동사는 단순한 물리적 ‘붙잡힘’보다 전략적 장소가 ‘장악됨’이라는 의미를 살릴 수 있어, 군사 문맥에서 ‘점령되었고’가 가장 적절합니다.
- source_word: הָאֲגַמִּים
  english_pob_choice: the marshes
  chosen_korean: 늪들
  alternatives_korean:
  - 습지들
  - 늪지대들
  - 물웅덩이들
  lexicon: HALOT
  rationale: אֲגַמִּים는 물이 고인 습한 지역을 가리키므로, 불에 탈 수 있는 지형이라는 점까지 고려해 ‘늪들’로 번역했습니다. ‘물웅덩이들’은 너무 약하고, ‘습지들’은 다소 설명적입니다.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the men of war
  chosen_korean: 전사들
  alternatives_korean:
  - 전쟁의 사람들
  - 전투병들
  - 용사들
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁의 사람들’이지만 한국어에서는 부자연스럽기 때문에, 남성형 군사 표현을 유지하면서도 의미를 잘 드러내는 ‘전사들’을 선택했습니다. '용사들'은 영웅적 뉘앙스가 강해 덜 중립적입니다.
theological_decisions:
- issue: 히브리어 군사 보고문의 연속된 수동·결과 상태 표현을 한국어에서 어떻게 살릴지
  chosen_reading: ‘점령되었고… 불에 타 버렸으며… 겁에 질렸습니다’처럼 완료된 재앙의 결과를 드러내는 서술로 옮겼습니다.
  alternative_readings:
  - ‘점령당했습니다… 불탔습니다… 두려워합니다’
  - ‘점령되었고… 불에 타고… 놀랐습니다’
  rationale: 이 절은 전투 상황의 파국을 보고하는 짧은 열거이므로, 한국어에서도 사건의 완료성과 충격을 유지하는 것이 중요합니다. '겁에 질렸습니다'는 נִבְהָלוּ의 강한 동요·공포를 잘 반영합니다.
  doctrine_reference: 번역학적 판단; 본문 신학 교리 쟁점 없음
