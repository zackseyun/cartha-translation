  rationale: אִישׁ의 분배적 의미를 ‘각자’로 살리되, נֶפֶשׁ를 여기서는 ‘생명/목숨’의 뜻으로 이해하여 ‘생명’을 택했습니다. ‘구해 내라’는 위험에서 벗어나게 하는 구출 뉘앙스를 반영합니다.
- source_word: מֵחֲרוֹן אַף יְהוָה
  english_pob_choice: from the burning anger of Yahweh
  chosen_korean: 야훼의 타오르는 분노에서
  alternatives_korean:
  - 야훼의 맹렬한 분노에서
  - 야훼의 불타는 진노에서
  - 야훼의 분노에서
  lexicon: HALOT
  rationale: ‘חרון אף’의 열기/타는 이미지를 ‘타오르는 분노’로 옮겨 ‘분노’ 일반으로 약화시키지 않았습니다. יהוה는 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
