    reason: ‘자기 생명’에 해당하는 히브리어 נַפְשׁוֹ는 이 문맥에서 ‘자신’으로도 옮길 수 있으며, חֲרוֹן אַף는 ‘맹렬한 분노’로도 번역할 수 있습니다.
lexical_decisions:
- source_word: צְאוּ
  english_pob_choice: Come out
  chosen_korean: 나와라
  alternatives_korean:
