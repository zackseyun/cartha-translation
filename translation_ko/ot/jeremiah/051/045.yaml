  lexicon: HALOT
  rationale: 바벨론을 여성 인칭으로 의인화한 이미지를 살리기 위해 ‘그녀’를 유지했고, ‘한가운데’로 내부에서의 이탈을 분명히 했습니다.
- source_word: אִישׁ אֶת נַפְשׁוֹ
  english_pob_choice: let each man save his life
  chosen_korean: 각자 자기 생명을 구해 내라
  alternatives_korean:
  - 각 사람은 자기 목숨을 구하라
