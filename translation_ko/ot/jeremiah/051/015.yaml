    text: ‘세상’은 여기서 ‘거주하는 세계’라는 뜻도 담을 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the draft’s sound past-tense rendering and theological-neutral wording, while improving modern Korean idiom and placing the lexical note directly after ‘세상.’
