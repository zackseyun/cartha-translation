lexical_decisions:
- source_word: עֹשֵׂה אֶרֶץ
  english_pob_choice: He made the earth
  chosen_korean: 땅을 만드셨고
  alternatives_korean:
  - 세상을 만드셨고
  - 땅을 지으셨고
  lexicon: HALOT
  rationale: עֹשֵׂה는 창조를 가리키는 현재분사이지만, 본문은 이어지는 동사들과 함께 하나님의 창조 행위를 선언하는 시적 진술이므로 한국어에서는 자연스럽게 과거 완료형으로 옮겼습니다. אֶרֶץ는 우주적 대조(하늘들과 대비)에서 ‘땅’이 무난합니다.
- source_word: בְּכֹחוֹ
  english_pob_choice: by his power
  chosen_korean: 자기의 능력으로
  alternatives_korean:
  - 자기의 힘으로
  - 자기의 권능으로
  lexicon: HALOT
  rationale: ב의 도구적 용법을 한국어 ‘-으로’로 살렸고, כֹּחַ는 여기서 창조 능력을 나타내므로 ‘능력’이 가장 자연스럽습니다.
- source_word: תֵּבֵל
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 거주하는 세계
  lexicon: HALOT
  rationale: תֵּבֵל은 질서 있게 거주하는 세계를 가리키지만, 시어에서는 한국어 ‘세상’이 간결하면서도 그 넓은 의미를 잘 담습니다.
- source_word: תְּבוּנָה
  english_pob_choice: understanding
  chosen_korean: 명철
  alternatives_korean:
  - 이해
  - 분별
  lexicon: HALOT
  rationale: חָכְמָה와 구별되는 תְּבוּנָה의 분별·통찰 뉘앙스를 한국어 성서어법에서 널리 통용되는 ‘명철’로 옮겼습니다.
- source_word: נָטָה שָׁמַיִם
  english_pob_choice: he stretched out the heavens
  chosen_korean: 하늘들을 펼치셨습니다
  alternatives_korean:
  - 하늘을 펼치셨습니다
  - 하늘들을 펴셨습니다
  lexicon: HALOT
  rationale: נָטָה는 천막을 펼치듯 ‘펴다/펼치다’의 이미지가 강하므로 이를 살렸고, 히브리어 복수형 שָׁמַיִם은 ‘하늘들’로 보존했습니다.
theological_decisions:
- issue: 히브리어 시적 분사와 완료형을 한국어에서 어떤 시제로 옮길지
  chosen_reading: 하나님의 창조 행위를 현재적 진술이 아니라 완결된 창조 선언으로 읽어 과거 완료형으로 통일했습니다.
  alternative_readings:
  - 땅을 만듭니다 / 세우십니다 / 펼치십니다
  - 만드시는 분이며 ...
  rationale: 이 구절은 예레미야의 창조 찬양 문맥에서 하나님의 창조 주권을 선언하므로, 한국어 독자는 완결된 행위로 읽는 것이 가장 분명합니다. 다만 시적 병렬성과 원문의 분사성을 해치지 않도록 문장 호흡은 유지했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; poetic declaration of God''s creative act'
