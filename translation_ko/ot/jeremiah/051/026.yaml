- from: 그들은 당신에게서 모퉁이를 위한 돌이나 기초를 위한 돌을 가져가지 않을 것입니다. 그 이유는 당신이 영원한 황폐가 되기 때문입니다. 야훼의 말씀이니라.[a][b]
  to: 그들은 네게서 모퉁이에 쓸 돌[a]이나 기초 공사에 쓸 돌을 가져가지 않을 것입니다. 이는 네가 영원히 황폐한 곳이 될 것이기 때문입니다[b]. 야훼께서 말씀하십니다.
  rationale: The revision replaces an unnatural second-person pronoun, improves the causal and desolation clauses for modern formal-polite Korean, represents the foundations image with natural construction language, and moves both note markers to their proper lexical anchors. It preserves the source’s direct address, future negation, building imagery, plural/intensive desolation sense, and the name Yahweh.
