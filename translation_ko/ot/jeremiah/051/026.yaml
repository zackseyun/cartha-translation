id: JER.51.26
reference: Jeremiah 51:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יִקְח֤וּ מִמְּ/ךָ֙ אֶ֣בֶן לְ/פִנָּ֔ה וְ/אֶ֖בֶן לְ/מֽוֹסָד֑וֹת כִּֽי שִׁמְמ֥וֹת עוֹלָ֛ם תִּֽהְיֶ֖ה נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/026.yaml
  text: And they will not take from you a stone for a corner or a stone for foundations[a], for you will be everlasting desolations[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'a cornerstone'; Hebrew literally 'a stone for a corner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'perpetual desolations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 당신에게서 모퉁이를 위한 돌이나 기초를 위한 돌을 가져가지 않을 것입니다. 그 이유는 당신이 영원한 황폐가 되기 때문입니다. 야훼의 말씀이니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모퉁잇돌”. 히브리어는 문자적으로 “모퉁이를 위한 돌”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “영속하는 황폐”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּךָ / מִמְּךָ
  english_pob_choice: from you
  chosen_korean: 당신에게서
  alternatives_korean:
  - 네게서
  - 너에게서
  lexicon: HALOT
  rationale: 바빌론을 2인칭 단수로 직접 호칭하는 문맥을 살리되, 예언 선포체에 맞게 표준적인 문어체로 옮겼습니다.
- source_word: אֶבֶן לְפִנָּה
  english_pob_choice: a stone for a corner
  chosen_korean: 모퉁이를 위한 돌
  alternatives_korean:
  - 모퉁이돌
  - 모퉁이용 돌
  lexicon: HALOT
  rationale: 히브리어의 직역적 구조를 유지해 ‘cornerstone’보다 덜 고정된 표현을 반영했습니다.
- source_word: וְאֶבֶן לְמוֹסָד וֹת
  english_pob_choice: a stone for foundations
  chosen_korean: 기초를 위한 돌
  alternatives_korean:
  - 기초돌
  - 토대를 위한 돌
  lexicon: HALOT
  rationale: 복수형 ‘기초들/기반들’의 이미지를 담되 한국어에서는 자연스러운 건축 표현으로 정리했습니다.
- source_word: שִׁמְמֹת עוֹלָם
  english_pob_choice: everlasting desolations
  chosen_korean: 영원한 황폐
  alternatives_korean:
  - 영원한 황무지
  - 영속하는 황폐
  lexicon: HALOT
  rationale: 분사적 상태가 아니라 지속되는 파괴 상태를 가리키므로 ‘황폐’로 옮기되, ‘עוֹלָם’의 영속성을 ‘영원한’으로 반영했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 결구를 한국어 성경체로 자연스럽게 마무리하되, 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 직접성
  chosen_reading: 수동적 완곡어법을 피하고, 바빌론이 더 이상 건축 재료를 얻지 못한다는 심판의 확정성을 직접적으로 드러냈습니다.
  alternative_readings:
  - 그들은 당신에게서 돌을 가져오지 않을 것입니다
  - 당신은 영원한 폐허가 될 것입니다
  rationale: 본문은 단순한 미래 예고가 아니라 회복 불가능한 파괴를 선언하므로, 건축석의 상실과 영구적 황폐를 함께 살리는 것이 문맥상 적절합니다.
  doctrine_reference: 예언서 심판 선언의 문맥적 직역 원칙
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 야훼의 이름이 직접 나오므로, 본문에서 그 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
