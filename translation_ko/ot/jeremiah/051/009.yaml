  source_fidelity: 개정이 필요합니다. עִזְבוּהָ는 복수 명령이고 וְנֵלֵךְ는 1인칭 복수 청유형이므로, 초안의 ‘각자 … 가십시오’는 청유의 화자를 명령 대상으로 바꾸어 놓습니다. 또한 וְנִשָּׂא의 수동 표현은 ‘높여졌다’로 보존하는 편이 적절합니다.
  naturalness: ‘그녀’를 연속하여 쓰는 것은 한국어에서 도시 의인화로 다소 부자연스럽습니다. ‘바벨론’을 반복하고 ‘버려 두고, 우리는 … 갑시다’로 옮기면 현대 한국어 합쇼체에서 자연스러우면서 원문의 명령과 청유의 흐름을 살립니다.
  terminology: ‘심판’은 מִשְׁפָּט의 법정적 판단 및 그에 수반되는 정죄/형벌의 문맥을 과도하게 한쪽으로 제한하지 않아 유지할 수 있습니다. שְׁחָקִים은 단순히 ‘구름 위’라기보다 높은 하늘 또는 구름 낀 창공을 가리키므로 ‘구름에까지’와 주석으로 처리합니다.
