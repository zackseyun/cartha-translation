  rationale: 청유형 ‘우리는 … 갑시다’를 복원하여 원문의 문법과 화자 포함의 권고를 보존했습니다. 바벨론의 문법적 여성 지시는 한국어에서 자연스럽게 도시명을 반복하여 처리했습니다. 또한 심판이 ‘높이 들렸다’는 수동 이미지를 유지하고, 각 주석 표지를 해당 표현에 직접 배치했습니다.
