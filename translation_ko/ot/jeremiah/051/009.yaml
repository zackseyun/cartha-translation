id: JER.51.9
reference: Jeremiah 51:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רפאנו אֶת בָּבֶל֙ וְ/לֹ֣א נִרְפָּ֔תָה עִזְב֕וּ/הָ וְ/נֵלֵ֖ךְ אִ֣ישׁ לְ/אַרְצ֑/וֹ כִּֽי נָגַ֤ע אֶל הַ/שָּׁמַ֨יִם֙ מִשְׁפָּטָ֔/הּ וְ/נִשָּׂ֖א עַד שְׁחָקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/009.yaml
  text: We tried to heal Babylon[a], but she was not healed. Leave her, and let each one go to his own land[c][b], for her judgment has reached to heaven and has been lifted up to the skies.
  footnotes:
  - marker: a
    text: 'Or ''each man to his own land.'' The Hebrew is literally singular and masculine: ''a man to his land.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'her sentence' or 'her punishment'; the Hebrew word can carry judicial and punitive overtones.
    reason: lexical_alternative
  - marker: c
    text: '''Skies'' translates a Hebrew term for the high clouds or upper heavens.'
    reason: cultural_note
translation:
  language: ko
  text: 우리는 바벨론을 고쳐 보려 했으나 바벨론은 낫지 않았습니다. 바벨론을 버려 두고, 우리는 각자 자기 땅으로 갑시다[a]. 바벨론의 심판이 하늘에까지 이르렀고 구름에까지 높이 들렸기 때문입니다[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 사람이 자기 땅으로’라는 단수 남성형입니다. 여기서는 각 사람이 자기 땅으로 돌아가는 분배적 의미를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘심판’은 문맥상 판결, 정죄, 또는 형벌을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘구름’은 히브리어의 시적 표현으로, 높은 하늘 또는 구름 낀 창공을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: רפאנו / נִרְפָּתָה
  english_pob_choice: We tried to heal / was not healed
  chosen_korean: 고치려 했지만 / 낫지 않았습니다
  alternatives_korean:
  - 치료하려 했지만 / 치료되지 않았습니다
  - 고쳤지만 / 고쳐지지 않았습니다
  lexicon: HALOT
  rationale: 첫 절은 시도와 실패의 대조를 살려 ‘고치려 했지만’으로, 둘째 절은 수동 상태를 자연스럽게 드러내는 ‘낫지 않았습니다’로 옮겼습니다.
- source_word: עִזְבוּהָ
  english_pob_choice: Leave her
  chosen_korean: 그녀를 버리십시오
  alternatives_korean:
  - 그녀를 떠나십시오
  - 그녀를 버려 두십시오
  lexicon: HALOT
  rationale: 바벨과의 분리를 촉구하는 강한 명령을 살리기 위해 단순한 이동보다 결별의 뉘앙스가 있는 ‘버리십시오’를 택했습니다.
- source_word: אִישׁ לְאַרְצוֹ
  english_pob_choice: each one go to his own land
  chosen_korean: 각자 자기 땅으로
  alternatives_korean:
  - 각 사람이 자기 땅으로
  - 한 사람은 자기 땅으로
  lexicon: HALOT
  rationale: 히브리어의 단수 남성 대표표현을 한국어에서는 분배적 의미의 ‘각자’로 자연스럽게 풀어, 성별이 강조되지 않도록 하면서도 원문의 분배성을 보존했습니다.
- source_word: מִשְׁפָּטָהּ
  english_pob_choice: her judgment
  chosen_korean: 그녀의 심판
  alternatives_korean:
  - 그녀의 판결
  - 그녀의 형벌
  - 그녀의 재판
  lexicon: HALOT
  rationale: 문맥상 바벨의 죄책과 그에 대한 하나님의 공적 판정을 가리키므로, 법적·심판적 의미를 살린 ‘심판’이 가장 적절합니다.
- source_word: שְׁחָקִים
  english_pob_choice: the skies
  chosen_korean: 구름 위
  alternatives_korean:
  - 하늘들
  - 하늘 높이
  - 구름층
  lexicon: HALOT
  rationale: ‘구름/상공’에 해당하는 시적 표현을 한국어 관용에 맞게 ‘구름 위’로 옮겨, ‘하늘에까지’와의 평행을 유지했습니다.
theological_decisions:
- issue: 바벨의 '심판'이 하늘에 미쳤다는 표현의 신학적 의미
  chosen_reading: 바벨의 죄와 이에 대한 하나님의 법정적 판정이 하늘에 호소될 만큼 극대화되었다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그녀의 죄가 하늘에 미쳤다
  - 그녀의 형벌이 하늘에 미쳤다
  rationale: מִשְׁפָּט는 단순한 도덕평가보다 법정적 판정을 포괄하므로, 본문이 바벨의 최종적 정죄를 선언하는 흐름을 살려 ‘심판’으로 번역했습니다.
  doctrine_reference: Translation philosophy §3, §5
