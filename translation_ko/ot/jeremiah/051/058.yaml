  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת חֹ֠מוֹת בָּבֶ֤ל הָֽ/רְחָבָה֙ עַרְעֵ֣ר תִּתְעַרְעָ֔ר וּ/שְׁעָרֶ֥י/הָ הַ/גְּבֹהִ֖ים בָּ/אֵ֣שׁ יִצַּ֑תּוּ וְ/יִֽגְע֨וּ עַמִּ֧ים בְּ/דֵי רִ֛יק וּ/לְאֻמִּ֥ים בְּ/דֵי אֵ֖שׁ וְ/יָעֵֽפוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/058.yaml
  text: 'Thus says Yahweh of hosts: Babylon’s broad wall shall be utterly razed[a], and her high gates shall be burned with fire. Peoples labor for emptiness, and nations for the fire[b], and they grow weary.'
  footnotes:
  - marker: a
    text: Or “Babylon’s broad walls”; the Hebrew uses a plural form, likely as a collective for the city’s fortifications.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “shall be laid utterly bare”; the translation “shall be utterly razed” brings out the sense in the context of city walls.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. 바벨론의 넓은 성벽은 완전히 허물어지고, 그 높은 성문은 불에 타 버릴 것입니다. 민족들은 헛됨을 위하여 수고하고, 나라들은 불을 위하여 수고하며, 지쳐 버릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 복수형은 바벨론의 성벽 전체를 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘헛됨/공허함’을 뜻합니다. 문맥상 POB는 수고의 허무함을 드러내기 위해 이렇게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאֹות
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 하나님
  lexicon: HALOT
  rationale: 여호와 대신 프로젝트 기본값인 야훼를 따르고, צְבָאֹות은 ‘hosts’의 표준 대응인 ‘만군’으로 옮겨 호칭의 장엄함을 살렸습니다.
- source_word: חֹמוֹת בָּבֶל הָרְחָבָה
  english_pob_choice: Babylon’s broad wall
  chosen_korean: 바벨론의 넓은 성벽
  alternatives_korean:
  - 바벨론의 넓은 벽
  - 바벨론의 넓은 성벽들
  lexicon: HALOT
  rationale: 히브리어 복수형이 도시의 방어시설 전체를 가리키는 집합적 용법이므로, 한국어에서는 자연스러운 단수 집합명사 ‘성벽’으로 옮겼습니다.
- source_word: עַרְעֵר תִּתְעַרְעָר
  english_pob_choice: shall be utterly razed
  chosen_korean: 완전히 허물어지고
  alternatives_korean:
  - 완전히 무너지고
  - 철저히 파괴되고
  - 완전히 헐려
  lexicon: HALOT
  rationale: 강조를 나타내는 어근 반복의 힘을 살리면서, 성벽 문맥에서 가장 직접적인 파괴 이미지를 주는 ‘허물어지다’를 선택했습니다.
- source_word: בָּאֵשׁ יִצַּתּוּ
  english_pob_choice: shall be burned with fire
  chosen_korean: 불에 타 버릴 것입니다
  alternatives_korean:
  - 불로 타 버릴 것입니다
  - 불에 타게 될 것입니다
  - 불살라질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 결합을 현대 한국어로 자연스럽게 풀어, 단순한 점화가 아니라 실제 소각·파괴를 분명히 드러냈습니다.
- source_word: בְּדֵי רִיק
  english_pob_choice: for emptiness
  chosen_korean: 헛됨을 위하여
  alternatives_korean:
  - 공허함을 위하여
  - 허무를 위하여
  - 헛것을 위하여
  lexicon: HALOT
  rationale: POB의 ‘emptiness’는 단순 빈공간보다 헛된 노고의 결과를 가리키므로, 한국어 관용에 맞는 ‘헛됨’으로 옮겼습니다.
- source_word: בְּדֵי אֵשׁ
  english_pob_choice: for the fire
  chosen_korean: 불을 위하여
  alternatives_korean:
  - 불에 의하여
  - 불을 위해
  - 불만을 위하여
  lexicon: HALOT
  rationale: 평행구조를 살려 앞 구와 대응되게 유지했고, 그들의 수고가 결국 불로 돌아간다는 허무를 간결하게 드러냈습니다.
theological_decisions:
- issue: 다누어지는 도시 심판의 최종성
  chosen_reading: 성벽과 성문에 대한 예언은 단순한 손상 예고가 아니라 도시 방어 체계의 전면 붕괴를 뜻하는 최종적 심판으로 읽었습니다.
  alternative_readings:
  - 부분적 훼손 경고
  - 상징적 과장
  rationale: 어근의 강조와 불에 의한 파괴, 그리고 이어지는 ‘민족들은 … 수고하며 지쳐 버릴 것이다’라는 결구가 총체적 실패와 심판을 가리키기 때문입니다.
  doctrine_reference: 예언 문맥의 심판 신학
