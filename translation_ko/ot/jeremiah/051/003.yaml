  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶֽל יִדְרֹ֤ךְ ידרך הַ/דֹּרֵךְ֙ קַשְׁתּ֔/וֹ וְ/אֶל יִתְעַ֖ל בְּ/סִרְיֹנ֑/וֹ וְ/אַֽל תַּחְמְלוּ֙ אֶל בַּ֣חֻרֶ֔י/הָ הַחֲרִ֖ימוּ כָּל צְבָאָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/003.yaml
  text: Let not the archer bend his bow[a], and let him not rise up in his armor. Do not spare her young men[c][b]; devote all her army to destruction.
  footnotes:
  - marker: a
    text: Or 'let the bowman string his bow'; the Hebrew of the opening clause is difficult and repetitive, but the sense is a prohibition directed at the archer.
    reason: alternative_reading
  - marker: b
    text: Or 'in his coat of mail' or 'in his breastplate.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'devote to destruction,' a term used for placing persons or things under the ban in divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 활 쏘는 자가 자기 활을 당기지 못하게 하며, 자기 갑옷을 입고 일어서지 못하게 하십시오. 그들의 젊은이들을 아끼지 마십시오. 그들의 모든 군대를 진멸하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘활잡이가 자기 활을 메우게 하라’로도 옮길 수 있습니다. 히브리어 첫 구절은 반복적이고 난해하지만, 뜻은 활쏘는 자에게 주어진 금지 명령입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘갑옷’보다 더 구체적으로 ‘흉갑’이나 ‘갑주’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘진멸하다’는 뜻의 חרם을 사용하며, 이는 심판 아래 바쳐 멸망시키는 개념입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל / וְאֶל / וְאַל
  english_pob_choice: Let not / and let him not / Do not
  chosen_korean: …하지 못하게 하십시오 / …마십시오
  alternatives_korean:
  - …하지 말게 하십시오
  - …하지 않게 하십시오
  lexicon: HALOT
  rationale: 히브리어의 부정 표지는 전쟁 금지 명령으로 기능하므로, 한국어에서는 직접적인 금지형으로 옮기는 것이 문맥과 통사에 가장 잘 맞습니다.
- source_word: יִדְרֹךְ ... הַדֹּרֵךְ קַשְׁתּוֹ
  english_pob_choice: the archer bend his bow
  chosen_korean: 활 쏘는 자가 자기 활을 당기지 못하게 하십시오
  alternatives_korean:
  - 활 쏘는 자가 자기 활을 메우지 못하게 하십시오
  - 활을 당기는 자가 자기 활을 당기지 못하게 하십시오
  lexicon: HALOT
  rationale: דרך + קשת는 활을 ‘당기다/메우다’는 관용으로 이해되므로, 반복되고 다소 난해한 히브리어의 뜻을 살려 자연스러운 전투 문맥으로 옮겼습니다.
- source_word: בְּסִרְיֹנוֹ
  english_pob_choice: in his armor
  chosen_korean: 자기 갑옷을 입고
  alternatives_korean:
  - 자기 흉갑을 입고
  - 자기 갑주를 입고
  lexicon: HALOT
  rationale: סִרְיוֹן은 몸을 보호하는 갑옷을 가리키므로, 현대 한국어에서 가장 분명한 ‘갑옷’으로 옮기되 동작상 ‘입고’로 풀어 자연스럽게 표현했습니다.
- source_word: הַחֲרִימוּ
  english_pob_choice: devote all her army to destruction
  chosen_korean: 진멸하십시오
  alternatives_korean:
  - 전멸시키십시오
  - 멸하도록 바치십시오
  - 저주 아래 두십시오
  lexicon: HALOT
  rationale: חרם의 언약적·심판적 무게를 살리기 위해 단순한 ‘파괴’보다 전통적으로 쓰이는 ‘진멸’로 옮겼습니다.
theological_decisions:
- issue: חרם(herem) 심판 언어의 번역 강도
  chosen_reading: ‘진멸하십시오’로 번역해 하나님의 심판 아래 전쟁 대상이 완전히 제거된다는 강도를 드러냈습니다.
  alternative_readings:
  - ‘완전히 멸하십시오’
  - ‘저주 아래 두십시오’
  rationale: 본문은 전쟁 오라클에서 חרם을 사용하므로, 도덕적 완곡어법으로 약화시키지 않으면서도 한국어 성경 독자가 이해할 수 있는 강한 표현이 필요합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
