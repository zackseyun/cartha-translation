  source_fidelity: 히브리어의 여성 단수 접미사 לָהּ는 바빌론을 가리키므로, 초안의 남성형 ‘그에게로’는 수정되어야 합니다. 또한 הַשֹּׁדְדִים는 약탈의 뜻도 지니지만, 이 문맥에서는 바빌론을 황폐하게 할 자들이라는 넓은 의미의 ‘파괴자들’이 더 충실합니다. ‘쳐들어올’은 적대적 접근이라는 문맥적 함의를 자연스럽게 드러내며, 각주에서 문자적 표현을 보존합니다.
  naturalness: ‘바빌론을 두고 기뻐 외칠 것입니다’와 ‘북쪽에서 파괴자들이 바빌론으로 쳐들어올 것이기 때문입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘야훼의 선언입니다’도 예언서의 엄숙한 종결 공식으로 무난합니다.
  terminology: 신명 יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. ‘파괴자들’은 שֹׁדְדִים의 황폐화·파괴 의미를 포괄하며, 특정 해석을 덧붙이지 않습니다.
