id: JER.51.48
reference: Jeremiah 51:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רִנְּנ֤וּ עַל בָּבֶל֙ שָׁמַ֣יִם וָ/אָ֔רֶץ וְ/כֹ֖ל אֲשֶׁ֣ר בָּ/הֶ֑ם כִּ֧י מִ/צָּפ֛וֹן יָבוֹא לָ֥/הּ הַ/שּׁוֹדְדִ֖ים נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/048.yaml
  text: Then heaven and earth[a], and all that is in them, will shout for joy over Babylon, for from the north destroyers will come against her[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'will sing for joy over Babylon.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''will come to her''; in context, the sense is hostile: ''will come against her'' or ''will come upon her.'''
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 하늘과 땅과 그 안에 있는 모든 것이 바빌론을 두고 기뻐 외칠 것입니다[a]. 북쪽에서 파괴자들이 바빌론으로 쳐들어올 것이기 때문입니다[b]. 야훼의 선언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌론을 두고 노래하며 기뻐할 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그녀에게로 올 것이다’입니다. 문맥에서는 침략자들의 적대적 접근을 가리키므로 ‘바빌론으로 쳐들어올’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִנְּנוּ
  english_pob_choice: will shout for joy
  chosen_korean: 기뻐 외칠 것입니다
  alternatives_korean:
  - 노래하며 기뻐할 것입니다
  - 기뻐 소리칠 것입니다
  lexicon: HALOT
  rationale: רנן은 기쁨의 소리 내어 외침을 뜻하므로, 단순한 ‘기뻐하다’보다 소리의 요소를 살린 ‘기뻐 외치다’가 원문의 생동감을 잘 살립니다.
- source_word: שָׁמַיִם וָאָרֶץ וְכֹל אֲשֶׁר בָּהֶם
  english_pob_choice: heaven and earth, and all that is in them
  chosen_korean: 하늘과 땅, 그리고 그 안에 있는 모든 것
  alternatives_korean:
  - 하늘과 땅, 그리고 그 안에 있는 모든 존재
  - 하늘과 땅, 그리고 그 가운데 있는 모든 것
  lexicon: HALOT
  rationale: 이 표현은 창조 세계 전체를 가리키는 관용적 대구이므로, ‘그 안에 있는 모든 것’으로 자연스럽게 옮기되 의미 범위를 유지했습니다.
- source_word: מִצָּפוֹן
  english_pob_choice: from the north
  chosen_korean: 북쪽에서
  alternatives_korean:
  - 북에서
  - 북편에서
  lexicon: HALOT
  rationale: 방향을 나타내는 기본 표현이므로 표준적이고 간결한 ‘북쪽에서’를 선택했습니다.
- source_word: הַשּׁוֹדְדִים
  english_pob_choice: the destroyers
  chosen_korean: 약탈자들
  alternatives_korean:
  - 파괴자들
  - 노략자들
  - 멸망시키는 자들
  lexicon: HALOT
  rationale: שׁדד는 ‘약탈하다/짓밟아 황폐하게 하다’의 뜻을 가지므로, 전투적 침입과 약탈의 뉘앙스를 함께 살리는 ‘약탈자들’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project_default
  rationale: 프로젝트 기본 규정에 따라 신명은 음역형 ‘야훼’로 옮겨, 본문의 언약적 고유명을 드러냈습니다.
theological_decisions:
- issue: 하늘과 땅의 의인화된 반응
  chosen_reading: 창조 세계 전체가 바빌론의 심판을 기뻐하며 외치는 장면으로 옮겼습니다.
  alternative_readings:
  - 하늘과 땅이 단지 비유적으로 언급된 것으로 약화하는 번역
  - ‘재난’을 기뻐하는 표현을 완화한 번역
  rationale: 본문의 수사적 과장은 심판의 보편성을 강조하므로, 의인화와 우주적 반응을 그대로 살리는 것이 문맥에 충실합니다.
  doctrine_reference: 시적·예언적 의인화의 직역 원칙
- issue: 예언 종결 공식 נְאֻם יְהוָה
  chosen_reading: ‘야훼의 선언입니다’로 옮겨 예언적 권위를 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 말씀이니라’
  rationale: נְאֻם은 공식적인 신탁 종결어이므로, 단순한 서술보다 선언적 문구가 본문의 예언체를 더 잘 보존합니다.
  doctrine_reference: 예언서 문체 보존 원칙
