id: JER.51.1
reference: Jeremiah 51:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מֵעִ֣יר עַל בָּבֶ֔ל וְ/אֶל יֹשְׁבֵ֖י לֵ֣ב קָמָ֑י ר֖וּחַ מַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/001.yaml
  text: 'Thus says Yahweh: Behold[a], I am stirring up against Babylon, and against the inhabitants of Leb-kamai[b], a destroying wind.'
  footnotes:
  - marker: a
    text: Leb-kamai is likely a coded name (an atbash cipher) for Chaldea/Babylon; alternatively, the phrase could be understood more literally as 'the heart of my adversaries.'
    reason: alternative_reading
  - marker: b
    text: Or 'a destroying spirit'; the Hebrew word can mean 'wind,' 'spirit,' or 'breath.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「보라[a], 내가 바빌론과 레브-카마이 주민들[b]에게 파괴하는 바람을 일으키고 있습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘레브-카마이’는 칼데아/바빌론을 가리키는 암호명(아트바쉬)으로 이해될 수 있으며, 더 문자적으로는 ‘내 대적들의 마음’으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘파괴하는 영’; 히브리어 단어는 ‘바람’, ‘영’, ‘숨결’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 원문의 언약적 신명성을 살리기 위해 프로젝트 기본값인 야훼를 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 보십시오, 내가
  lexicon: HALOT
  rationale: 예언 선포의 주의를 환기하는 감탄적 표현으로서 한국어에서는 앞의 ‘보라’로 압축해도 원문의 긴박감이 유지됩니다.
- source_word: לֵב קָמָי
  english_pob_choice: Leb-kamai
  chosen_korean: 레브-카마이
  alternatives_korean:
  - 내 대적들의 마음
  - 칼데아
  lexicon: HALOT
  rationale: 본문이 암호화된 지명처럼 기능하므로 음역을 본문에 보존하고, 해석적 대안은 각주로 남겼습니다.
- source_word: רוּחַ מַשְׁחִית
  english_pob_choice: a destroying wind
  chosen_korean: 파괴하는 바람
  alternatives_korean:
  - 파괴하는 영
  - 파괴하는 숨결
  lexicon: HALOT
  rationale: 심판 문맥에서 רוּחַ는 우선 ‘바람’이 가장 자연스럽고, ‘파괴하는’이 그 목적적 성격을 드러냅니다.
theological_decisions:
- issue: רוּחַ의 번역에서 ‘영’ 가능성을 본문에 어떻게 다룰 것인가
  chosen_reading: 본문에는 ‘바람’을 두되, 의미 범위의 가능성은 각주로 보존합니다.
  alternative_readings:
  - 영
  - 숨결
  rationale: 이 절은 바빌론에 대한 심판의 도구를 묘사하므로 물리적 이미지가 우선이지만, 히브리어 어휘의 다의성은 제거하지 않기 위해 각주를 달았습니다.
  doctrine_reference: 문맥 우선 번역과 어휘적 긴장 보존
