id: JER.51.28
reference: Jeremiah 51:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַדְּשׁ֨וּ עָלֶ֤י/הָ גוֹיִם֙ אֶת מַלְכֵ֣י מָדַ֔י אֶת פַּחוֹתֶ֖י/הָ וְ/אֶת כָּל סְגָנֶ֑י/הָ וְ/אֵ֖ת כָּל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/028.yaml
  text: Consecrate the nations against her—the kings of Media[a], her governors and all her prefects[c][b], and every land of his dominion.
  footnotes:
  - marker: a
    text: Or 'the kings of the Medes.'
    reason: lexical_alternative
  - marker: b
    text: '''Consecrate'' here carries the sense of setting apart for battle or mustering for holy war.'
    reason: cultural_note
  - marker: c
    text: Hebrew shifts from 'her governors ... her prefects' to 'his dominion'; the final pronoun may refer to the ruler of Media as representative head, though some translations smooth the shift.
    reason: alternative_reading
translation:
  language: ko
  text: 너희는 그 나라들을—메대의 왕들과 그 지방관들과 그 모든 총독들과 그의 통치가 미치는 모든 땅을—대적하여 성별하라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메대의 왕들’은 히브리어의 복수 표현을 반영한 것입니다. 전통적으로는 ‘메대 사람들의 왕들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성별하라’는 여기서 예배적 성별이라기보다 전투를 위해 따로 세우는 뜻을 가집니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 앞부분의 여성형 소유격과 달리 마지막에 남성 단수 소유격을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: קַדְּשׁוּ
  english_pob_choice: Consecrate
  chosen_korean: 성별하라
  alternatives_korean:
  - 구별하라
  - 성별하여라
  - 거룩하게 하라
  lexicon: HALOT
  rationale: 전쟁 소집의 성격을 살리면서도 קדש의 ‘구별하여 따로 세움’이라는 의미를 한국어로 가장 직접적으로 옮길 수 있습니다.
- source_word: עָלֶיהָ
  english_pob_choice: against her
  chosen_korean: 대적하여
  alternatives_korean:
  - 그녀를 향하여
  - 그에 대하여
  lexicon: HALOT
  rationale: 문맥상 바벨론을 치기 위한 적대적 방향을 나타내므로, 단순한 위치 표현보다 ‘대적하여’가 더 자연스럽고 분명합니다.
- source_word: פַּחוֹתֶיהָ / סְגָנֶיהָ
  english_pob_choice: her governors / her prefects
  chosen_korean: 그 지방관들과 그 모든 총독들
  alternatives_korean:
  - 그 관원들과 그 보좌관들
  - 그 총독들과 그 모든 부관들
  lexicon: HALOT
  rationale: 두 행정 직함의 차이를 살리되, 한국어에서 시대착오가 덜한 용어로 옮겼습니다. 영어 POB가 유지한 여성형 소유격도 ‘그’로 받되, 히브리어의 지시 대상은 메대 관련 문맥에 따라 유지됩니다.
- source_word: מֶמְשַׁלְתּוֹ
  english_pob_choice: his dominion
  chosen_korean: 그의 통치가 미치는 모든 땅
  alternatives_korean:
  - 그의 나라 전체
  - 그의 지배의 모든 땅
  lexicon: HALOT
  rationale: 마지막 남성 단수 소유격을 그대로 반영하면서, ‘dominion’을 ‘통치가 미치는 땅’으로 풀어 지배 범위를 살렸습니다.
theological_decisions:
- issue: 히브리어의 성별 소유격 전환
  chosen_reading: 앞부분의 소유격은 메대를 가리키는 문맥으로 자연스럽게 처리하되, 마지막 ‘his dominion’은 별도로 살려 ‘그의 통치가 미치는 모든 땅’으로 옮겼습니다.
  alternative_readings:
  - 전체를 하나의 소유 대상로 평탄화하여 모두 ‘그의’로 통일하기
  - 마지막 소유격을 중성적 표현으로 완화하기
  rationale: 원문은 여성형 소유격과 남성형 단수 소유격을 나란히 사용해 문법적 긴장을 드러냅니다. 번역에서도 그 차이를 지우지 않고, 문맥상 지시 대상을 추적할 수 있게 두었습니다.
  doctrine_reference: Translation philosophy §3, §5
