revisions:
- from: 이것은 예레미야 예언자가 스랴야 곧 느리야의 아들, 마하시야의 아들에게 명령한 말씀입니다. 그가 유다 왕 시드기야와 함께 바벨론으로 갈 때, 곧 그의 통치 제4년에 한 일입니다. 스랴야는 숙소 담당 관리였습니다.[a]
  to: 이것은 예언자 예레미야가 느리야의 아들, 마아세야의 아들 스라야에게 명령한 말씀입니다. 스라야가 유다 왕 시드기야와 함께 바벨론으로 갈 때, 곧 시드기야가 통치한 지 제4년에 있었던 일입니다. 스라야는 숙소를 맡은 관리였습니다.[a]
  rationale: 스라야를 이동의 주체로 명시하고, 제4년이 시드기야의 통치 연수임을 분명히 했습니다. 또한 원문에 없는 ‘한 일’을 제거하고, 불확실한 관직명은 본문에서 과도하게 특정하지 않으면서 각주에 가능한 의미 범위를 제시했습니다.
