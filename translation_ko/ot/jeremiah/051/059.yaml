    issue: ‘그가’의 선행사가 모호함
    rationale: בְּלֶכְתּוֹ는 문맥상 스라야가 시드기야와 함께 바벨론으로 간 것을 가리키지만, 초안에서는 예레미야로도 읽힐 수 있습니다.
  - severity: high
    issue: ‘그의 통치 제4년에 한 일입니다’가 원문을 벗어나고 부자연스러움
    rationale: 원문은 단순히 시드기야의 통치 제4년이라는 연대를 제시합니다. ‘한 일’은 첨가이며, ‘그의’가 시드기야를 명확히 지시하지 않습니다.
  - severity: low
    issue: 인명 표기의 일관성과 통용성
    rationale: ‘스라야/마아세야’는 표준 한국어 성경 전통에서 더 널리 쓰이는 표기입니다.
