  text: הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יִרְמְיָ֣הוּ הַ/נָּבִ֗יא אֶת שְׂרָיָ֣ה בֶן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ בְּ/לֶכְתּ֞/וֹ אֶת צִדְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בָּבֶ֔ל בִּ/שְׁנַ֥ת הָ/רְבִעִ֖ית לְ/מָלְכ֑/וֹ וּ/שְׂרָיָ֖ה שַׂ֥ר מְנוּחָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/059.yaml
  text: This is the word that Jeremiah the prophet commanded Seraiah son of Neriah[a], son of Mahseiah, when he went with Zedekiah king of Judah to Babylon, in the fourth year of his reign. Now Seraiah was the quartermaster.
  footnotes:
  - marker: a
    text: Or 'Seraiah was the chamberlain.' The Hebrew title שַׂר מְנוּחָה is rare and may refer to an official responsible for lodging, resting places, or travel arrangements.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 예언자 예레미야가 느리야의 아들, 마아세야의 아들 스라야에게 명령한 말씀입니다. 스라야가 유다 왕 시드기야와 함께 바벨론으로 갈 때, 곧 시드기야가 통치한 지 제4년에 있었던 일입니다. 스라야는 숙소를 맡은 관리였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관직명 שַׂר מְנוּחָה는 드문 표현입니다. ‘휴식’ 또는 ‘머무름’과 관련된 관리라는 뜻으로, 숙소·숙영지 또는 여행 준비를 맡은 관리였을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: This is the word
  chosen_korean: 이것은 … 말씀입니다
  alternatives_korean:
  - 이것은 … 말입니다
  - 이것은 … 메시지입니다
  lexicon: HALOT
  rationale: דָּבָר는 ‘말씀/말/일/사건’까지 아우르지만, 예언 공식에서는 ‘말씀’이 문맥상 가장 자연스럽고 원문과의 연결도 분명합니다.
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령한
  alternatives_korean:
  - 지시한
  - 지휘한
  lexicon: HALOT
  rationale: צוה의 강한 지시·위임 뉘앙스를 살리기 위해 ‘명령한’을 택했습니다.
- source_word: שַׂר מְנוּחָה
  english_pob_choice: quartermaster
  chosen_korean: 숙소 담당 관리
  alternatives_korean:
  - 청사 담당 관리
  - 숙영 담당 관리
  - 챔벌린
  lexicon: HALOT
  rationale: 직역하면 ‘휴식/머묾’과 관련된 관직명이라 숙소·숙영 준비를 맡는 관리로 풀어야 하며, 한국어에서는 기능을 드러내는 설명적 번역이 가장 투명합니다.
theological_decisions:
- issue: 예언 공식의 문체 유지
  chosen_reading: ‘이것은 … 말씀입니다’로 시작해 예언 전달 서문을 형식적으로 보존했습니다.
  alternative_readings:
  - ‘여호와의 말씀이었습니다’로 관용화
  - ‘이것은 … 메시지입니다’로 완화
  rationale: 본문은 예레미야가 받은 특정한 지시를 기록하는 서문이므로, 서술적이면서도 공식적인 예언 문체를 유지하는 것이 원문 기능에 가장 부합합니다.
  doctrine_reference: 예언서 서문과 계시 전달 형식
