id: JER.51.62
reference: Jeremiah 51:62
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ לְ/הַכְרִית֔/וֹ לְ/בִלְתִּ֤י הֱיֽוֹת בּ/וֹ֙ יוֹשֵׁ֔ב לְ/מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה כִּֽי שִׁמְמ֥וֹת עוֹלָ֖ם תִּֽהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/062.yaml
  text: and say[a], ‘O Yahweh, you yourself have spoken concerning this place, to cut it off so that no inhabitant will be in it, from man to beast[c][b]; for it will become everlasting desolations.’
  footnotes:
  - marker: a
    text: Or 'to destroy it.' The Hebrew verb literally means 'to cut off' and in this context refers to decisive destruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from man to beast,' a formula meaning total depopulation of both humans and animals.
    reason: cultural_note
  - marker: c
    text: Or 'perpetual desolations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 말씀하십시오. 「야훼여, 주께서 친히 이 곳을 끊어 버리셔서, 사람에게서 짐승에 이르기까지 거기에 거주하는 자가 없게 하시고, 그것이 영원한 황폐가 되리라고 말씀하셨습니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사에는 문자적으로 ‘끊다/잘라 내다’의 뜻이 있으며, 이 문맥에서는 निर्ण적 파괴를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사람에게서 짐승에 이르기까지’는 인간과 동물 모두가 사라지는 총체적 무인화/무축화의 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영원한 황폐들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: and say
  chosen_korean: 그리고 이렇게 말씀하십시오
  alternatives_korean:
  - 그리고 말하십시오
  - 그리하여 말씀하십시오
  lexicon: HALOT
  rationale: 직접 인용을 여는 명령형 이어짐을 자연스럽게 살리면서, 선지자에게 요구되는 공손한 문체를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명(神名) YHWH를 관례적 대체어인 ‘주’가 아니라 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: לְהַכְרִיתוֹ
  english_pob_choice: to cut it off
  chosen_korean: 끊어 버리셔서
  alternatives_korean:
  - 끊으셔서
  - 멸하시기 위해
  - 없애 버리셔서
  lexicon: HALOT
  rationale: 히필 כרת의 ‘끊다/잘라 내다’ 이미지를 살리되, 문맥상 심판적 파괴를 드러내기 위해 결과를 담은 표현으로 옮겼습니다.
- source_word: לְמֵאָדָם וְעַד בְּהֵמָה
  english_pob_choice: from man to beast
  chosen_korean: 사람에게서 짐승에 이르기까지
  alternatives_korean:
  - 사람에서 짐승까지
  - 인간에게서 가축에 이르기까지
  lexicon: HALOT
  rationale: 완전한 무인화/무축화의 관용적 범위를 한국어로 자연스럽게 드러내기 위해 범위 표지를 살렸습니다.
- source_word: שִׁמְמוֹת עוֹלָם
  english_pob_choice: everlasting desolations
  chosen_korean: 영원한 황폐
  alternatives_korean:
  - 영원한 황무지
  - 영구한 황폐
  lexicon: HALOT
  rationale: 복수형 명사와 지속성을 함께 반영하면서, 한국어에서 가장 직접적이고 무게감 있는 심판어휘로 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 YHWH의 표기
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 표기
  rationale: 본문이 신명기식 호칭이 아니라 YHWH 자체를 사용하므로, POB 원칙에 따라 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘사람에게서 짐승에 이르기까지’의 관용구
  chosen_reading: 완전한 비움과 파괴를 뜻하는 총체적 심판으로 읽습니다.
  alternative_readings:
  - 단순한 인구 감소
  - 도시 기능 상실
  rationale: 히브리어의 ‘from man to beast’는 인간과 동물 모두가 사라지는 총체적 폐허를 가리키는 상투구로 이해하는 것이 문맥에 가장 부합합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
