base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/054.yaml
  text: The sound of a cry comes from Babylon[a], and great destruction from the land of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'The sound of an outcry from Babylon, and great ruin from the land of the Chaldeans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론에서 외침의 소리가 나고, 갈대아인의 땅에서 큰 파멸이 옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외침의 소리’는 ‘부르짖는 소리’ 또는 ‘외침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל זְעָקָ֖ה
  english_pob_choice: The sound of a cry
  chosen_korean: 외침의 소리
  alternatives_korean:
  - 부르짖는 소리
  - 외침 소리
  - 울부짖는 소리
  lexicon: HALOT
  rationale: קוֹל은 여기서 ‘목소리’보다 들려오는 음향을 가리키고, זְעָקָה는 위기 속의 외침이므로 두 단어를 합쳐 자연스러운 ‘외침의 소리’로 옮겼습니다.
- source_word: מִ/בָּבֶ֑ל
  english_pob_choice: comes from Babylon
  chosen_korean: 바빌론에서
  alternatives_korean:
  - 바벨론에서
  - 바빌론으로부터
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살려 ‘~에서’로 옮겼고, 지명은 현대 표기인 ‘바빌론’을 사용했습니다.
- source_word: וְ/שֶׁ֥בֶר גָּד֖וֹל
  english_pob_choice: and great destruction
  chosen_korean: 큰 파멸
  alternatives_korean:
  - 큰 파괴
  - 큰 멸망
  - 엄청난 붕괴
  lexicon: HALOT
  rationale: שֶׁבֶר는 단순한 ‘깨짐’보다 예언문맥의 재앙적 붕괴를 가리키므로, ‘great destruction’의 의미를 살려 ‘큰 파멸’로 옮겼습니다.
- source_word: מֵ/אֶ֥רֶץ כַּשְׂדִּֽים
  english_pob_choice: from the land of the Chaldeans
  chosen_korean: 갈대아인의 땅에서
  alternatives_korean:
  - 갈대아 땅에서
  - 갈대아 사람들의 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ כַּשְׂדִּים은 민족-지리 표현이므로 ‘갈대아인의 땅’으로 직역하여 원문의 민족적 지시를 유지했습니다.
theological_decisions:
- issue: 예언적 평행구문의 압축 표현
  chosen_reading: 두 절구를 각각 ‘외침의 소리’와 ‘큰 파멸’로 병렬해, 심판의 청각적 이미지와 재앙의 규모를 모두 드러냈습니다.
  alternative_readings:
  - ‘부르짖는 소리’와 ‘큰 파괴’로 더 설명적으로 풀기
  - ‘외침’과 ‘파멸’로 더 짧게 압축하기
  rationale: 히브리어는 명사구 병렬로 강한 예언적 효과를 내므로, 한국어도 동사 과잉을 피하면서 병렬 구조를 유지하는 것이 좋습니다.
  doctrine_reference: 예언서의 시적 평행법
