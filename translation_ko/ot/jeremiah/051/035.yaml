reference: Jeremiah 51:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲמָסִ֤/י וּ/שְׁאֵרִ/י֙ עַל בָּבֶ֔ל תֹּאמַ֖ר יֹשֶׁ֣בֶת צִיּ֑וֹן וְ/דָמִ/י֙ אֶל יֹשְׁבֵ֣י כַשְׂדִּ֔ים תֹּאמַ֖ר יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/035.yaml
  text: “My violence and my flesh be upon Babylon,” says the inhabitant of Zion[b][a]. “And my blood be upon the inhabitants of Chaldea,” says Jerusalem.
  footnotes:
  - marker: a
    text: Or “and my body.” The Hebrew term is traditionally understood here as referring to bodily flesh, though some have proposed other derivations.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “to the inhabitants of Chaldea”; the English renders the implied imprecatory sense in parallel with “be upon Babylon.”
    reason: lexical_alternative
translation:
  language: ko
  text: “내 폭력과 내 육신이 바벨론 위에 있기를 바랍니다.” 시온의 주민이 말합니다. “그리고 내 피가 갈대아의 주민들 위에 있기를 바랍니다.” 예루살렘이 말합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 살/내 몸’이 될 수 있으나, 문맥상 육신에 가해진 폭력의 병행으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아의 주민들’은 히브리어의 ‘갈대아 사람들/거주자들’에 해당하며, 여기서는 대상 지역을 가리키는 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי
  english_pob_choice: the violence done to me
  chosen_korean: 내 폭력
  alternatives_korean:
  - 내가 당한 폭력
  - 내게 가해진 폭력
  - 내 부당함
  lexicon: HALOT
  rationale: 1인칭 소유격이 붙은 חָמָס는 여기서 ‘내가 겪은 폭력/학대’의 의미로 읽는 것이 자연스럽지만, 한국어에서는 ‘내 폭력’이 원문의 짧은 병행 구조를 가장 직접적으로 살립니다.
- source_word: וּשְׁאֵרִי
  english_pob_choice: and my flesh
  chosen_korean: 내 육신
  alternatives_korean:
  - 내 살
  - 내 몸
  lexicon: HALOT
  rationale: 문맥상 ‘피’와 병행되어 몸의 상처와 살육을 가리키므로, 문자성은 다소 줄어도 표준 한국어에서 자연스러운 ‘육신’으로 옮겼습니다.
- source_word: עַל בָּבֶל
  english_pob_choice: be upon Babylon
  chosen_korean: 바벨론 위에 있기를 바랍니다
  alternatives_korean:
  - 바벨론에 임하기를 바랍니다
  - 바벨론 위에 있게 하소서
  - 바벨론에게 돌아가기를 바랍니다
  lexicon: HALOT
  rationale: עַל의 보복·임재적 뉘앙스를 살려 ‘위에’로 유지했고, 시적 저주/청원의 뉘앙스는 한국어에서 자연스러운 ‘있기를 바랍니다’로 처리했습니다.
- source_word: יֹשֶׁבֶת צִיּוֹן
  english_pob_choice: the inhabitant of Zion
  chosen_korean: 시온의 주민
  alternatives_korean:
  - 시온의 거주자
  - 시온에 사는 이
  - 시온의 딸
  lexicon: HALOT
  rationale: 여성 단수 분사로서 시온을 의인화한 표현이므로, ‘주민’이 과도한 신학적 해석 없이 가장 직접적으로 대응합니다.
- source_word: אֶל יֹשְׁבֵי כַשְׂדִּים
  english_pob_choice: be upon the inhabitants of Chaldea
  chosen_korean: 갈대아의 주민들 위에 있기를 바랍니다
  alternatives_korean:
  - 갈대아 사람들 위에 있기를 바랍니다
  - 갈대아 주민들에게 임하기를 바랍니다
  lexicon: HALOT
  rationale: 전치사 אֶל은 여기서 대상화된 향방을 나타내며, 앞절과 같은 보복 병행을 위해 ‘위에 있기를 바랍니다’를 반복했습니다.
theological_decisions:
- issue: 예언적 저주/호소의 시제와 정서
  chosen_reading: 직설적 청원이 아닌 ‘있기를 바랍니다’로 옮겨, 시온과 예루살렘의 보복 호소라는 예언적 정서를 유지했습니다.
  alternative_readings:
  - ‘임하라’ 식의 명령형
  - ‘~할 것이다’ 식의 미래형
  rationale: 히브리어의 병행적 저주문을 한국어 합쇼체로 재현하면서도, 문맥의 감정적 강도를 약화시키지 않기 위한 선택입니다.
  doctrine_reference: 예언서의 시적 저주/탄원 문맥
