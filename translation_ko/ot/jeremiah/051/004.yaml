id: JER.51.4
reference: Jeremiah 51:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָפְל֥וּ חֲלָלִ֖ים בְּ/אֶ֣רֶץ כַּשְׂדִּ֑ים וּ/מְדֻקָּרִ֖ים בְּ/חוּצוֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/004.yaml
  text: And the slain will fall in the land of the Chaldeans[b][a], and the pierced in her streets.
  footnotes:
  - marker: a
    text: Or “in Chaldea” or “in the land of the Babylonians.” The Hebrew reads “the land of the Chaldeans.”
    reason: lexical_alternative
  - marker: b
    text: Or “in her squares” or “in her open places.”
    reason: lexical_alternative
translation:
  language: ko
  text: 갈대아인의 땅에서는 죽임을 당한 자들이 쓰러질 것이며, 그녀의 거리들에서는 찔린 자들이 쓰러질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아인의 땅’은 ‘갈대아’ 또는 ‘바빌로니아인의 땅’으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘갈대아인들의 땅’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀의 거리들’은 ‘그녀의 광장들’ 또는 ‘그녀의 열린 곳들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפְלוּ
  english_pob_choice: And ... will fall
  chosen_korean: 넘어지고
  alternatives_korean:
  - 쓰러지고
  - 떨어지고
  lexicon: HALOT
  rationale: 예언적 문맥에서 결과를 앞당겨 말하는 미래 의미를 살리되, 한국어에서는 단순 미래표지보다 서술형 연결이 자연스러워 ‘넘어지고’로 옮겼습니다.
- source_word: חֲלָלִים
  english_pob_choice: the slain
  chosen_korean: 죽임당한 자들
  alternatives_korean:
  - 살해된 자들
  - 죽은 자들
  lexicon: HALOT
  rationale: 전투·폭력으로 생명을 잃은 사람들을 가리키므로, 단순한 ‘죽은 자들’보다 피살의 의미가 드러나는 표현을 택했습니다.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  english_pob_choice: in the land of the Chaldeans
  chosen_korean: 칼대아인의 땅
  alternatives_korean:
  - 갈대아인의 땅
  - 칼대아 땅
  - 바빌로니아인의 땅
  lexicon: HALOT
  rationale: 히브리어의 민족명 כַּשְׂדִּים을 그대로 살려 ‘칼대아인’으로 옮기고, ‘땅’ 구조도 원문에 맞춰 유지했습니다.
- source_word: בְּחוּצוֹתֶיהָ
  english_pob_choice: in her streets
  chosen_korean: 그녀의 거리
  alternatives_korean:
  - 그녀의 광장
  - 그녀의 넓은 곳
  lexicon: HALOT
  rationale: חוּצוֹת는 거리뿐 아니라 공공장소를 가리킬 수 있으나, 문맥상 가장 자연스러운 현대 한국어로 ‘거리’를 택했습니다.
theological_decisions:
- issue: 도시/땅의 의인화가 이어지는 표현
  chosen_reading: ‘그녀의 거리’로 번역해 원문의 여성형 지시를 그대로 반영했습니다.
  alternative_readings:
  - ‘그곳의 거리’
  - ‘그 도시의 거리’
  rationale: 원문은 땅/도시를 여성형으로 인격화하므로, 이를 평평하게 만들지 않고 대명사 ‘그녀’를 유지하는 편이 स्रोत의 시적·예언적 효과를 더 잘 드러냅니다.
  doctrine_reference: 예언서의 수사와 의인화 유지
- issue: ‘찔린 자들’의 폭력성 보존
  chosen_reading: ‘찔린 자들’로 두어 무기 손상 이미지를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘상한 자들’
  - ‘다친 자들’
  rationale: דקר는 단순 부상보다 ‘찌르다/꿰뚫다’의 강한 폭력성을 갖기 때문에, 완화된 표현보다 직접적인 번역이 원문의 심각성을 보존합니다.
  doctrine_reference: 원문의 수사적 강도 보존
