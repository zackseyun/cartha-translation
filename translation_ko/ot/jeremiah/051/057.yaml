  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or 'satraps' for 'governors' (פַּחוֹתֶיהָ), though the Hebrew more generally denotes administrative governors.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''the LORD of hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 바빌론의 고관들과 지혜자들과 총독들[a]과 대리 관리들과 용사들을 취하게 하겠습니다. 그러면 그들은 영원한 잠을 자고 다시는 깨어나지 못할 것입니다. 그 이름이 만군의 야훼이신 왕의 말씀입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사트라프들’. 히브리어 פַּחוֹתֶיהָ는 더 일반적으로 행정 관할을 맡은 총독들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '전통적 영어 번역: ‘the LORD of hosts.’'
    reason: previous_rendering
