  rationale: 문맥상 바벨론의 통치 엘리트를 가리키므로, 단순한 일반 관리보다 관직감을 살리는 ‘고관들’이 적합합니다.
- source_word: פַּחוֹתֶיהָ
  english_pob_choice: her governors
  chosen_korean: 그의 총독들
  alternatives_korean:
