  rationale: 예언 공식의 단정적 발화 기능을 살려 ‘선포하십니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה / YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명은 대체어가 아닌 고유명으로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 죽음-잠의 은유 보존
  chosen_reading: ‘영원한 잠’과 ‘다시는 깨어나지 않을 것입니다’를 함께 유지
  alternative_readings:
  - 그들은 영원히 죽을 것입니다
  - 그들은 다시는 일어나지 않을 것입니다
  rationale: 본문의 심판 이미지는 ‘잠’ 은유로 표현되므로, 이를 풀어 쓰지 않고 긴장감을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
