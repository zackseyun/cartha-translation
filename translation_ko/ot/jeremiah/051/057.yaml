base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/057.yaml
  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or 'satraps' for 'governors' (פַּחוֹתֶיהָ), though the Hebrew more generally denotes administrative governors.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''the LORD of hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그의 고관들—그의 지혜자들, 그의 총독들, 그의 대리들, 그리고 그의 용사들—을 취하게 하며, 그들은 영원한 잠을 자고 다시는 깨어나지 않을 것입니다. 왕이 선포하십니다. 그의 이름은 야훼 만군입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פַּחוֹתֶיהָ는 좁은 의미의 제후보다 행정 관할자를 더 일반적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적 영어 성경은 여기서 ‘the LORD of hosts’로 옮깁니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וְהִשְׁכַּרְתִּי
