  lexicon: HALOT
  rationale: 상위 관직을 보좌하는 하위 직책의 뉘앙스를 살려 ‘대리들’로 번역했습니다.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  english_pob_choice: and they will sleep an everlasting sleep
  chosen_korean: 그들은 영원한 잠을 자고
  alternatives_korean:
