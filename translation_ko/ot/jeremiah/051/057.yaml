revisions:
- from: 내가 그의 고관들—그의 지혜자들, 그의 총독들, 그의 대리들, 그리고 그의 용사들—을 취하게 하며, 그들은 영원한 잠을 자고 다시는 깨어나지 않을 것입니다. 왕이 선포하십니다. 그의 이름은 야훼 만군입니다.[a][b]
  to: 내가 바빌론의 고관들과 지혜자들과 총독들[a]과 대리 관리들과 용사들을 취하게 하겠습니다. 그러면 그들은 영원한 잠을 자고 다시는 깨어나지 못할 것입니다. 그 이름이 만군의 야훼이신 왕의 말씀입니다.[b]
  rationale: 바빌론을 가리키는 여성 소유대명사를 명시적으로 옮기고, 미래 사역형과 죽음의 ‘영원한 잠’ 은유를 보존했습니다. 결구의 왕 칭호와 ‘만군의 야훼’라는 이름 공식을 자연스러운 한국어로 재구성했으며, 각주 표지를 해당 어휘와 결구에 각각 배치했습니다.
