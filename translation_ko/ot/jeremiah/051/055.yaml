  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת בָּבֶ֔ל וְ/אִבַּ֥ד מִמֶּ֖/נָּה ק֣וֹל גָּד֑וֹל וְ/הָמ֤וּ גַלֵּי/הֶם֙ כְּ/מַ֣יִם רַבִּ֔ים נִתַּ֥ן שְׁא֖וֹן קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/055.yaml
  text: For Yahweh is devastating Babylon and destroying from her the great sound[a]. Their waves roar like many waters[b]; the noise of their voice is given.
  footnotes:
  - marker: a
    text: Or 'their waves surge like mighty waters'; the Hebrew imagery may describe the tumult of Babylon's attackers as sea-like waves.
    reason: lexical_alternative
  - marker: b
    text: Or 'the roar of their voice is raised.' The Hebrew literally says 'the noise of their voice is given,' an idiom for a loud sound being produced.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 바벨론을 황폐하게 하시고 그곳에서 큰 소리[a]를 없애시기 때문입니다. 그들의 파도[b]는 많은 물처럼 울부짖고, 그들의 목소리에서 나는 소란이 울려 퍼집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 소리’는 도시의 소란, 함성, 울림을 포괄하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 파도’는 바벨론의 공격자들이나 그와 관련된 소란을 물결처럼 묘사한 비유일 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
