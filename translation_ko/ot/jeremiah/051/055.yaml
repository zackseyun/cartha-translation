  - 주님
  lexicon: WLC
  rationale: 고유신명사 יהוה는 전통적 대체어가 아니라 음역인 ‘야훼’로 옮겨 원문 고유명과 POB의 신명 처리 원칙을 보존합니다.
- source_word: שֹׁדֵד
  english_pob_choice: is devastating
  chosen_korean: 황폐하게 하시며
  alternatives_korean:
  - 멸망시키시며
  - 파괴하시며
  - 약탈하고 계시며
  lexicon: HALOT
  rationale: 심판 맥락에서 진행 중인 파괴를 드러내되, 성읍을 무너뜨리는 결과까지 포함하는 ‘황폐하게 하시며’가 가장 자연스럽습니다.
- source_word: קוֹל גָּדוֹל
  english_pob_choice: the great sound
  chosen_korean: 큰 소리
  alternatives_korean:
  - 큰 소음
  - 큰 음성
  - 거대한 소리
  lexicon: HALOT
  rationale: 여기서 קוֹל은 발화보다 도시의 소란과 울림을 가리키므로, ‘큰 소리’가 의미를 과도하게 특정하지 않으면서도 원문 이미지를 살립니다.
- source_word: גַלֵּיהֶם / כְּמַיִם רַבִּים
  english_pob_choice: their waves roar like many waters
  chosen_korean: 그들의 파도는 많은 물처럼 요동하고
  alternatives_korean:
  - 그들의 물결은 많은 물처럼 울부짖고
  - 그들의 파도는 많은 물처럼 밀려오고
  lexicon: HALOT
  rationale: 파도-물의 비유를 한국어로 자연스럽게 재현하되, ‘요동하다’로 큰 물의 격렬한 움직임과 소란스러움을 함께 드러냅니다.
- source_word: שְׁאוֹן קוֹלָם־־
  english_pob_choice: the noise of their voice is given
  chosen_korean: 그들의 목소리의 소란이 들려옵니다
  alternatives_korean:
  - 그들의 목소리의 소리가 나옵니다
  - 그들의 목소리의 소란이 주어집니다
  lexicon: HALOT
  rationale: 히브리어의 수동적 관용구를 한국어의 자연스러운 수용형으로 풀어, ‘들려옵니다’가 원문의 ‘소란’과 음향 효과를 잘 전달합니다.
theological_decisions:
- issue: 야훼의 심판을 나타내는 현재적 진술의 시제/상
  chosen_reading: ‘야훼께서 … 황폐하게 하시며’로 현재 진행적 심판 장면을 살렸습니다.
  alternative_readings:
  - ‘야훼께서 … 황폐하게 하십니다’
  - ‘야훼께서 … 황폐하게 하실 것입니다’
  rationale: 히브리어 분사와 완료형의 병렬이 심판의 현장성을 강조하므로, 한국어도 완료로 고정하기보다 진행성을 드러내는 표현을 택했습니다.
  doctrine_reference: 히브리 시가/예언서의 시상-상태 표현 원칙
