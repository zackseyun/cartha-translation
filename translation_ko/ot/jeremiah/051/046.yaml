source:
  edition: WLC
  text: וּ/פֶן יֵרַ֤ךְ לְבַבְ/כֶם֙ וְ/תִֽירְא֔וּ בַּ/שְּׁמוּעָ֖ה הַ/נִּשְׁמַ֣עַת בָּ/אָ֑רֶץ וּ/בָ֧א בַ/שָּׁנָ֣ה הַ/שְּׁמוּעָ֗ה וְ/אַחֲרָ֤י/ו בַּ/שָּׁנָה֙ הַ/שְּׁמוּעָ֔ה וְ/חָמָ֣ס בָּ/אָ֔רֶץ וּ/מֹשֵׁ֖ל עַל מֹשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/046.yaml
  text: And do not let your heart grow faint[a], and do not fear the report heard in the land; a report will come in one year, and after it in the next year another report, and violence in the land[c][b], ruler against ruler.
  footnotes:
  - marker: a
    text: Or 'rumor' or 'news' for 'report' (שְׁמוּעָה). The Hebrew term can denote any circulated tidings, whether confirmed or not.
    reason: lexical_alternative
  - marker: b
    text: Literally 'lest your heart become soft.' The expression means to lose courage or grow fainthearted.
    reason: lexical_alternative
  - marker: c
    text: Or 'ruler over ruler.' The phrase may describe either conflict between rulers or rapid political turnover.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 여러분의 마음이 약해지게 하지 말며, 그 땅에서 들려오는 소문 때문에 두려워하지 마십시오. 한 해에는 소문이 오고, 그 뒤의 다음 해에도 또 다른 소문이 올 것이며, 그 땅에는 폭력이, 통치자 위에 통치자가 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소문’은 여기서 사실 여부를 단정하기보다 널리 퍼진 소식·풍문까지 포함하는 넓은 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분의 마음이 부드러워지지 않게’라는 뜻으로, 용기를 잃는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절의 마지막 표현은 ‘통치자 대 통치자’ 또는 정치적 교체·대립을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפֶן יֵרַךְ לְבַבְכֶם
  english_pob_choice: do not let your heart grow faint
  chosen_korean: 여러분의 마음이 약해지게 하지 말며
  alternatives_korean:
  - 여러분의 마음이 약해지지 않게 하며
  - 여러분의 마음이 겁먹지 않게 하며
  lexicon: HALOT
  rationale: לֵב/לֵבָב은 여기서 감정과 용기의 중심을 가리키므로 ‘마음’으로 두고, ‘약해지다’로 심약해짐을 살렸습니다.
- source_word: וְתִירְאוּ
  english_pob_choice: and do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 겁내지 마십시오
  lexicon: HALOT
  rationale: 직전 경고문맥과 연결되는 금지 표현이므로 정중한 금지형으로 자연스럽게 옮겼습니다.
- source_word: בַּשְּׁמוּעָה הַנִּשְׁמַעַת בָּאָרֶץ
  english_pob_choice: the report heard in the land
  chosen_korean: 그 땅에서 들려오는 소문
  alternatives_korean:
  - 그 땅에서 들려오는 보고
  - 그 땅에서 들려오는 소식
  lexicon: HALOT
  rationale: שְׁמוּעָה는 ‘소문/소식/보고’ 범위를 가지며, 여기서는 불안한 유포성의 뉘앙스가 있어 ‘소문’이 가장 직접적입니다.
- source_word: וּמֹשֵׁל עַל מֹשֵׁל
  english_pob_choice: ruler against ruler
  chosen_korean: 통치자 위에 통치자가 있을 것입니다
  alternatives_korean:
  - 통치자 대 통치자가 있을 것입니다
  - 통치자가 다른 통치자를 다스릴 것입니다
  lexicon: HALOT
  rationale: עַל은 단순히 ‘against’보다 ‘위에/위로’의 기본 뜻도 있으므로, POB의 대안 취지를 살려 정치적 교체와 중첩을 모두 열어 두는 표현으로 옮겼습니다.
theological_decisions:
- issue: 예언적 경고문의 명령형 톤
  chosen_reading: ‘두려워하지 마십시오’로 공동체에 직접 경고하는 톤을 유지했습니다.
  alternative_readings:
  - ‘두려워하지 말라’의 성경투 명령형
  - ‘두려워 말라’의 축약형
  rationale: 본문은 재난 소문 앞에서 공동체의 공포를 제지하는 직접 화법이므로, 현대 한국어에서도 단정한 금지문으로 재현하는 것이 적절합니다.
  doctrine_reference: 예레미야의 심판-위로 예언 문맥
