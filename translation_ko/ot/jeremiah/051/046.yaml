    issue: ‘그러므로’가 원문에 없는 인과관계를 추가합니다.
    rationale: וּפֶן은 경고·방지의 접속 표현이며, 앞 절의 근거를 표시하는 ‘그러므로’가 아닙니다.
  - severity: medium
    issue: ‘소문 때문에 두려워하지 마십시오’는 전치사 בְּ의 대상 용법을 원인으로 좁힙니다.
    rationale: 본문은 ‘그 땅에서 들리는 소식’을 두려워하지 말라는 뜻입니다. ‘때문에’는 소식이 공포의 원인이라는 관계를 불필요하게 강화합니다.
  - severity: high
    issue: ‘그 땅에는 폭력이, 통치자 위에 통치자가 있을 것입니다’는 문장 구조가 불완전합니다.
    rationale: ‘폭력이’ 뒤에 대응 서술어가 없어서 한국어 문장으로 성립하지 않습니다.
