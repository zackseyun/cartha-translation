- from: 그러므로 여러분의 마음이 약해지게 하지 말며, 그 땅에서 들려오는 소문 때문에 두려워하지 마십시오. 한 해에는 소문이 오고, 그 뒤의 다음 해에도 또 다른 소문이 올 것이며, 그 땅에는 폭력이, 통치자 위에 통치자가 있을 것입니다.[a][b][c]
