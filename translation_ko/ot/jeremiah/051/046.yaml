  verdict: revise
  source_fidelity: 개역 초안의 ‘그러므로’는 히브리어 접속사 וּפֶן(‘…하지 않도록/…하지 말라’)에 근거가 없으므로 삭제해야 합니다. 또한 בַּשְּׁמוּעָה는 ‘소문 때문에’가 아니라 ‘그 땅에서 들리는 소식/보고를’ 두려워하지 말라는 뜻입니다. 마지막 עַל은 ‘대적하여’로 단정하기보다 ‘위에’라는 표현으로 남겨, 통치자들 사이의 대립·교체라는 가능한 해석을 각주에서 보존하는 것이 안전합니다.
  naturalness: 합쇼체 문장으로 자연스럽게 다듬고, 원문의 병렬 구조를 유지했습니다. 기존의 ‘그 땅에는 폭력이, 통치자 위에 통치자가 있을 것입니다’는 조사가 생략되어 문법적으로 미완성이므로 완전한 서술로 고쳤습니다.
  terminology: שְׁמוּעָה는 사실 여부가 확정되지 않은 풍문까지 포함할 수 있으나, 본문에서는 ‘소식’이 ‘보고/소문’보다 중립적이고 자연스럽습니다. לֵבָב이 용기를 뜻하는 관용적 용례는 ‘마음이 약해지다’와 각주로 반영했습니다.
  issues:
