base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/043.yaml
  text: Her cities have become a desolation[a], a dry land and a desert, a land where no one lives[c][b], and through which no son of man passes.
  footnotes:
  - marker: a
    text: Or 'its cities'; the Hebrew uses a feminine singular suffix, reflecting Babylon personified as a woman.
    reason: lexical_alternative
  - marker: b
    text: Or 'a parched land and a steppe.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'no man' and 'no son of man'; these are generic expressions for human inhabitants and travelers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍들은[a] 황폐한 곳이 되었고, 메마른 땅과 사막이 되었으며[b], 아무도 살지 않고 사람의 아들도 그곳을 지나가지 않는 땅이 되었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 성읍들’. 히브리어의 여성 단수 소유 접미사는 바빌론을 여성으로 의인화합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘메마른 땅과 스텝 지대’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘사람’과 ‘사람의 아들’을 사용하며, 둘 다 일반적인 인간 거주자와 통행자를 가리키는 표현입니다.
    reason: lexical_alternative
