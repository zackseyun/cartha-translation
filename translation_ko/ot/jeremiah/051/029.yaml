language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּרְעַ֥שׁ הָ/אָ֖רֶץ וַ/תָּחֹ֑ל כִּ֣י קָ֤מָה עַל בָּבֶל֙ מַחְשְׁב֣וֹת יְהוָ֔ה לָ/שׂ֞וּם אֶת אֶ֧רֶץ בָּבֶ֛ל לְ/שַׁמָּ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/029.yaml
  text: And the earth quakes and writhes, for the plans of Yahweh have arisen against Babylon, to make the land of Babylon a desolation, without inhabitant.
translation:
  language: ko
  text: 땅이 진동하며 몸부림칩니다. 야훼의 계획들이 바벨론을 대적하여 일어나, 바벨론 땅을 거주하는 사람이 없는 황무지로 만들려 하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ הָאָרֶץ
  english_pob_choice: And the earth quakes
  chosen_korean: 땅이 흔들리고
  alternatives_korean:
  - 땅이 진동하고
  - 땅이 떨리고
  lexicon: HALOT
  rationale: רעשׁ의 강한 흔들림을 살리되, 한국어에서는 자연스러운 병렬 동사로 시작하여 재난적 반응을 드러냈습니다.
- source_word: וַתָּחֹל
  english_pob_choice: and writhes
  chosen_korean: 몸부림칩니다
  alternatives_korean:
  - 해산의 고통을 겪습니다
  - 떨립니다
  - 비틀거립니다
  lexicon: HALOT
  rationale: חול이 지닌 몸부림치듯 뒤틀리는 이미지를 살리기 위해, 단순한 '떨다'보다 육체적·격정적인 표현을 택했습니다.
- source_word: מַחְשְׁבוֹת יְהוָה
  english_pob_choice: the plans of Yahweh
  chosen_korean: 야훼의 계획이
  alternatives_korean:
  - 야훼의 뜻이
  - 야훼의 생각이
  - 야훼의 계획들이
  lexicon: HALOT
  rationale: מַחְשְׁבוֹת는 단순한 '생각'보다 의도된 결심을 가리키므로 '계획'이 더 직접적입니다. יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: לְשׂוּם אֶת אֶרֶץ בָּבֶל לְשַׁמָּה
  english_pob_choice: to make the land of Babylon a desolation
  chosen_korean: 바벨론의 땅을 황무지로
  alternatives_korean:
  - 바벨론의 땅을 폐허로
  - 바벨론의 땅을 황량한 곳으로
  - 바벨론의 땅을 황폐함으로
  lexicon: HALOT
  rationale: שַׁמָּה의 예언적 심판 어휘를 한국어 성경에서 통용되는 '황무지'로 옮겨, 단순한 파괴가 아니라 거주 불가능한 폐허 상태를 드러냈습니다.
- source_word: מֵאֵין יוֹשֵׁב
  english_pob_choice: without inhabitant
  chosen_korean: 주민이 없는 곳으로
  alternatives_korean:
  - 거주하는 사람이 없게
  - 거주자가 없게
  - 사는 사람이 없게
  lexicon: HALOT
  rationale: יוֹשֵׁב는 '거주하는 사람'을 뜻하므로, 문맥상 지역 전체의 무인화를 보여 주는 '주민이 없는 곳'이 자연스럽습니다.
theological_decisions:
- issue: 지진적 우주 반응의 수사
  chosen_reading: ‘땅이 흔들리고 몸부림칩니다’로, 예언적 심판 앞에서 피조 세계가 격렬히 반응한다는 이미지를 직설적으로 유지했습니다.
  alternative_readings:
  - ‘땅이 진동합니다’처럼 더 중립적으로 옮길 수 있습니다.
  - ‘세상이 떨고 있습니다’처럼 완화할 수 있습니다.
  rationale: 원문의 시적 과장과 심판 신탁의 긴박함을 약화하지 않기 위해, 강한 동작어를 유지했습니다.
  doctrine_reference: 예언서의 심판 이미지와 창조세계의 반응을 직역에 가깝게 보존하는 번역 원칙
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신명기를 고유명사로 보존하여, 본문이 가리키는 개인적 하나님의 이름을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
