  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָבֵ֣רוּ הַ/חִצִּים֮ מִלְא֣וּ הַ/שְּׁלָטִים֒ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ מַלְכֵ֣י מָדַ֔י כִּֽי עַל בָּבֶ֥ל מְזִמָּת֖/וֹ לְ/הַשְׁחִיתָ֑/הּ כִּֽי נִקְמַ֤ת יְהוָה֙ הִ֔יא נִקְמַ֖ת הֵיכָלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/011.yaml
  text: Sharpen the arrows[a]; fill the shields. Yahweh has stirred up the spirit of the kings of Media, because his plan is against Babylon, to destroy her; for it is the vengeance of Yahweh[b], vengeance for his temple.
  footnotes:
  - marker: a
    text: Or 'fill the shields.' The Hebrew term can denote shields, but 'quivers' fits the immediate context of arrows more naturally.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'her,' referring to Babylon as a personified city.
    reason: lexical_alternative
translation:
  language: ko
  text: 화살을 날카롭게 하십시오[a]; 방패를 채우십시오. 야훼께서 바벨론을 멸하려는 자신의 계획 때문에 메대의 왕들의 영을 일으키셨으니, 이는 야훼의 보복이기 때문입니다[b]—그의 성전의 보복입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방패를 채우십시오.’ 히브리어 단어는 ‘방패들’을 뜻할 수 있지만, 바로 앞의 ‘화살’과 함께 보면 ‘화살통(화살집)’을 가리킨다고 보는 해석도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의’로 되어 있으나, 문맥상 바벨론을 의인화한 도시로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבֵרוּ הַחִצִּים
  english_pob_choice: Sharpen the arrows
  chosen_korean: 화살을 날카롭게 하십시오
  alternatives_korean:
  - 화살을 갈아 세우십시오
  - 화살을 준비하십시오
  lexicon: HALOT
  rationale: 전쟁 맥락의 명령형으로서 활·화살을 출전용으로 다듬는 뜻을 한국어에서 가장 자연스럽게 살렸습니다.
- source_word: הַשְּׁלָטִים
  english_pob_choice: the shields
  chosen_korean: 방패를
  alternatives_korean:
  - 화살통을
  - 화살집을
  lexicon: HALOT
  rationale: 본문 전후문맥은 화살 준비와 함께 전투 장비를 갖추는 명령이지만, 공인된 어휘 선택의 흔들림을 드러내기 위해 POB의 기존 판단을 따라 ‘방패’를 유지했습니다.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ
  english_pob_choice: Yahweh has stirred up the spirit
  chosen_korean: 야훼께서 … 영을 일으키셨으니
  alternatives_korean:
  - 야훼께서 … 마음을 불러일으키셨으니
  - 야훼께서 … 의지를 자극하셨으니
  lexicon: HALOT
  rationale: רוּחַ를 단순한 ‘마음’보다 더 넓은 내적 동력으로 보아 ‘영’으로 살리고, הֵעִיר의 원인적 의미를 ‘일으키셨다’로 옮겼습니다.
- source_word: נִקְמַת יְהוָה
  english_pob_choice: the vengeance of Yahweh
  chosen_korean: 야훼의 보복
  alternatives_korean:
  - 야훼의 원수 갚으심
  - 야훼의 응징
  lexicon: HALOT
  rationale: נָקָם 계열을 단순한 감정이 아니라 공적 심판 행위로 이해하여, 현대 한국어에서 의미를 분명히 하는 ‘보복’을 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 직접 מקור어 표기를 드러내는 POB 원칙에 따라 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 바벨론을 향한 인칭화와 여성 대명사
  chosen_reading: 바벨론을 멸하려는 자신의 계획
  alternative_readings:
  - 그의 계획
  - 그 계획은 바벨론을 멸하려는 것이니
  rationale: 히브리어의 여성 대명사(그녀)를 한국어에서는 바벨론의 도시 의인화로만 주석화하지 않고 본문 의미를 매끄럽게 전달했습니다.
  doctrine_reference: POB style guide on personified cities
