id: JER.51.14
reference: Jeremiah 51:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת בְּ/נַפְשׁ֑/וֹ כִּ֣י אִם מִלֵּאתִ֤י/ךְ אָדָם֙ כַּ/יֶּ֔לֶק וְ/עָנ֥וּ עָלַ֖יִ/ךְ הֵידָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/014.yaml
  text: 'Yahweh of hosts has sworn by himself: Surely I will fill you with men[a], like locusts[c][b], and they will raise over you a shout.'
  footnotes:
  - marker: a
    text: Or 'by his life.' The Hebrew literally says 'by his nephesh,' an oath formula meaning he swears by his own self.
    reason: lexical_alternative
  - marker: b
    text: Or 'like young locusts' or 'like the locust swarm.'
    reason: lexical_alternative
  - marker: c
    text: The shout is likely a battle cry or victory shout raised against Babylon.
    reason: cultural_note
translation:
  language: ko
  text: 만군의 야훼께서 자신의 존재를 두고 맹세하셨습니다. 반드시 내가 너를 메뚜기처럼 사람들로 가득 채우겠고, 그들이 너를 향해 함성을 질러 올 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신의 존재를 두고’는 히브리어 ‘자기 네페쉬로’라는 맹세 공식의 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘메뚜기처럼’은 ‘젊은 메뚜기’ 또는 ‘메뚜기 떼처럼’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘함성’은 전투 함성 또는 승리의 외침일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의
  - 만군의 주님
  lexicon: HALOT
  rationale: יהוה צבאות는 관례적 칭호이므로 ‘만군의 야훼’로 옮겨 신적 이름과 군대적/우주적 위엄을 함께 보존했습니다.
- source_word: בְּנַפְשׁוֹ
  english_pob_choice: by himself
  chosen_korean: 자신의 존재를 두고
  alternatives_korean:
  - 자신을 두고
  - 자기 생명을 두고
  lexicon: HALOT
  rationale: נפש는 맹세 공식에서 ‘자기 자신/생명’의 뜻으로 쓰이므로, 직역보다 한국어 맹세 표현으로 자연스럽게 풀어 의미를 드러냈습니다.
- source_word: מִלֵּאתִיךְ אָדָם
  english_pob_choice: I will fill you with men
  chosen_korean: 내가 너를 … 사람들로 가득 채우겠고
  alternatives_korean:
  - 내가 너를 사람들로 채우겠고
  - 내가 너를 사람으로 가득 채우겠고
  lexicon: HALOT
  rationale: 여성 단수 직접대상은 바벨론/도시를 가리키므로 ‘너를 … 사람들로 가득 채우다’로 자연스럽게 옮기되, 집합적 인간 병력을 뜻하는 점을 유지했습니다.
- source_word: כַּיֶּלֶק
  english_pob_choice: like locusts
  chosen_korean: 메뚜기처럼
  alternatives_korean:
  - 젊은 메뚜기처럼
  - 메뚜기 떼처럼
  lexicon: HALOT
  rationale: 군사적 비유의 핵심은 급속한 군집 이미지이므로 ‘메뚜기처럼’으로 간결하게 살렸습니다.
- source_word: וְעָנוּ עָלַיִךְ הֵידָד
  english_pob_choice: and they will raise over you a shout
  chosen_korean: 그들이 너를 향해 함성을 질러 올 것입니다
  alternatives_korean:
  - 그들이 너를 향해 전투 함성을 올릴 것입니다
  - 그들이 너 위에 함성을 외칠 것입니다
  lexicon: HALOT
  rationale: ענה + הֵידָד는 단순한 ‘대답’이 아니라 외침을 들고 일으키는 표현이므로, 전투적·승리적 뉘앙스를 살리면서도 ‘함성’으로 넓게 번역했습니다.
theological_decisions:
- issue: יהוה의 자기 맹세와 ‘בְּנַפְשׁוֹ’ 처리
  chosen_reading: ‘자신의 존재를 두고 맹세하셨습니다’로 번역해 하나님의 자기증언을 분명히 했습니다.
  alternative_readings:
  - ‘자기 생명을 두고’
  - ‘자신을 두고’
  rationale: 인간적 관용구를 그대로 이식하면 오해가 생길 수 있으므로, 본문이 전달하는 것은 하나님이 다른 권위에 의존하지 않고 자신을 증인으로 세우시는 맹세라는 점입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine oath formula'
