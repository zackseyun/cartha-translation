id: JER.51.17
reference: Jeremiah 51:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/017.yaml
  text: Every man is made brutish[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is falsehood, and there is no breath in them.
  footnotes:
  - marker: a
    text: Or, 'there is no spirit in them.' Hebrew רוּחַ can mean 'breath,' 'wind,' or 'spirit'; here 'breath' is preferred because the point is that idols are lifeless.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 사람이 지식이 없어 우둔해집니다. 모든 금속 세공인은 자기 우상 때문에 수치를 당합니다. 그가 주조한 형상은 거짓이며, 그것들 안에는 숨결이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영’. 히브리어 רוּחַ는 ‘숨결’, ‘바람’, 또는 ‘영’을 뜻할 수 있습니다. 여기서는 우상들이 생명이 없음을 강조하기 위해 ‘숨결’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  english_pob_choice: is made brutish
  chosen_korean: 지각을 잃고
  alternatives_korean:
  - 우매해집니다
  - 우둔해집니다
  - 짐승처럼 됩니다
  lexicon: HALOT
  rationale: 니팔형이 지닌 ‘무뎌지다/우둔해지다’의 의미를 한국어로 자연스럽게 살려, 도덕적·예언적 비난의 뉘앙스를 유지했습니다.
- source_word: כָּל אָדָם
  english_pob_choice: Every man
  chosen_korean: 모든 사람이
  alternatives_korean:
  - 모든 인류가
  - 모두가
  lexicon: HALOT
  rationale: 히브리어의 분배적 단수 표현을 살리되, 표준어 합쇼체에서 성중립적이면서도 자연스러운 문장으로 옮겼습니다.
- source_word: צֹרֵף
  english_pob_choice: metalworker
  chosen_korean: 금속공예가
  alternatives_korean:
  - 금세공인
  - 대장장이
  - 연단하는 사람
  lexicon: HALOT
  rationale: 우상 제작의 문맥에서 금만이 아니라 금속 전반을 다루는 사람을 가리킬 수 있으므로, 범위를 좁히지 않는 ‘금속공예가’를 택했습니다.
- source_word: מִפָּסֶל
  english_pob_choice: by his idol
  chosen_korean: 자기 우상 때문에
  alternatives_korean:
  - 자기 우상으로 인해
  - 그의 새긴 우상 때문에
  lexicon: HALOT
  rationale: 미ן의 원인·관계적 용법을 한국어 자연문으로 풀어, 바로 뒤의 ‘부어 만든 형상’과 구별되도록 했습니다.
- source_word: נִסְכּוֹ
  english_pob_choice: his cast image
  chosen_korean: 부어 만든 형상
  alternatives_korean:
  - 주조한 형상
  - 금속으로 부은 형상
  - 녹여 만든 우상
  lexicon: HALOT
  rationale: ‘붓다/부어 만들다’의 제작 방식을 드러내어 פֶּסֶל(우상)과 구별되는 구체적 제작물을 분명하게 했습니다.
- source_word: וְלֹא רוּחַ בָּם
  english_pob_choice: there is no breath in them
  chosen_korean: 그들 안에는 숨결이 없습니다
  alternatives_korean:
  - 그들 안에는 영이 없습니다
  - 그들 안에는 생기가 없습니다
  lexicon: HALOT
  rationale: 우상들의 무생명성을 강조하는 문맥에 맞춰 רוּחַ를 ‘숨결’로 옮겨, 생명이 없다는 점을 선명하게 했습니다.
theological_decisions:
- issue: אָדָם의 포괄적 의미와 성중립화 여부
  chosen_reading: 모든 사람이
  alternative_readings:
  - 모든 인류가
  - 모두가
  rationale: 히브리어의 남성 단수 일반표현을 지우지 않으면서도, 한국어에서는 과도하게 남성적으로 들리지 않도록 균형 있게 옮겼습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4; Contested terms table for אָדָם
- issue: רוּחַ의 의미를 생명성 중심으로 볼지 영적 실체로 볼지
  chosen_reading: 숨결
  alternative_readings:
  - 영
  - 영이
  rationale: 본문의 논지는 우상이 살아 있지 않다는 데 있으므로, ‘숨결’이 무생명성과 부재를 가장 직접적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
