  - severity: low
    issue: ‘그들’의 지시 대상이 모호함
    rationale: בָּם의 복수 지시 대상은 우상/형상들이므로, 사람으로도 해석될 수 있는 ‘그들’보다 ‘그것들’을 쓰면 문맥상 지시가 분명해집니다.
  - severity: low
    issue: 각주가 ‘영’ 대안을 명시적으로 제시하지 않음
    rationale: רוּחַ의 의미 범위를 설명하지만, 번역 대안으로서 ‘영’을 ‘또는’ 형식으로 명시하면 영어 감사 기록의 어휘 대안 보존에 더 충실합니다.
