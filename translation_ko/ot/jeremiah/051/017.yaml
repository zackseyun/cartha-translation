  to: 모든 사람이 지식이 없어 우둔해집니다. 모든 금속 세공인은 자기 우상 때문에 수치를 당합니다. 그가 주조한 형상은 거짓이며, 그것들 안에는 숨결이 없습니다.[a]
  rationale: 수정문은 נִבְעַר מִדַּעַת의 ‘지식의 결여와 우둔함’의 관계를 더 밀접하게 반영하고, צורף와 נִסְכּוֹ를 각각 ‘금속 세공인’과 ‘주조한 형상’으로 자연스럽고 구별되게 옮겼습니다. 또한 마지막 복수 대명사의 우상 지시를 명확히 하고, רוּחַ의 대안 의미를 각주에 보존했습니다.
