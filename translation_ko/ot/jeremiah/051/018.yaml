  rationale: אבד의 결과를 한국어로 자연스럽게 나타내되, 단순 소멸보다 심판 아래의 파멸을 더 잘 드러내는 ‘멸망하다’를 택했습니다.
theological_decisions:
- issue: 우상 풍자의 핵심 뉘앙스
  chosen_reading: 이 절은 우상들이 실체 없는 헛것이며 사람을 미혹하는 산물이고, 심판의 때에 실제로 멸망한다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘미혹’보다 ‘조롱거리’에 가까운 풍자로 볼 수도 있습니다.
  - ‘벌받는 때’는 보다 전통적으로 ‘방문의 때’로 옮길 수도 있습니다.
  rationale: 예레미야 51장 전체의 우상 비판 흐름과 맞추어, 공허함과 기만성, 그리고 심판의 파멸이라는 세 요소를 모두 보존하는 쪽이 본문의 힘을 가장 잘 전달합니다.
  doctrine_reference: 예레미야 10:15; 51:17-19
