  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/018.yaml
  text: They are vanity[a], a work of delusion[b]; at the time of their punishment they will perish.
  footnotes:
  - marker: a
    text: Or 'a work of mockery,' 'a deceptive work,' or 'a work of errors.'
    reason: lexical_alternative
  - marker: b
    text: Or 'at the time of their visitation.' Here 'visitation' refers to the time when judgment comes upon them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 헛것이며, 미혹의 작품입니다. 그들의 벌받는 때에 그들은 멸망할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조롱거리’, ‘기만의 작품’, ‘오류의 작품’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 방문의 때’로 옮길 수 있습니다. 여기서 ‘방문’은 심판이 임하는 때를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  english_pob_choice: vanity
  chosen_korean: 헛것
  alternatives_korean:
  - 허무
  - 공허
  - 헛됨
  lexicon: HALOT
  rationale: 우상 풍자 문맥에서 הֶבֶל의 공허함과 무가치를 자연스럽게 드러내면서도, 단순히 감정적 ‘허무’보다 대상의 실체 없음에 더 가깝게 옮겼습니다.
- source_word: תַּעְתֻּעִים
  english_pob_choice: delusion
  chosen_korean: 미혹
  alternatives_korean:
  - 기만
  - 착각
  - 속임수
  lexicon: HALOT
  rationale: 이 명사는 사람을 잘못 이끄는 속임과 भ्रम을 함께 담으므로, 우상 비판의 효과를 살리는 한국어 ‘미혹’이 가장 응축된 대응입니다.
- source_word: פְּקֻדָּתָם
  english_pob_choice: their punishment
  chosen_korean: 그들의 벌받는 때
  alternatives_korean:
  - 그들의 방문의 때
  - 그들의 징벌
  - 그들의 심판
  lexicon: HALOT
  rationale: 문맥상 פְּקֻדָּה는 ‘방문’보다 심판의 징벌적 도래를 가리키므로, 영문 POB의 해석을 따라 ‘벌받는 때’로 풀어 원뜻을 분명히 했습니다.
- source_word: יֹאבֵדוּ
  english_pob_choice: they will perish
  chosen_korean: 그들은 멸망할 것입니다
  alternatives_korean:
  - 그들은 망할 것입니다
  - 그들은 사라질 것입니다
  lexicon: HALOT
  rationale: אבד의 결과를 한국어로 자연스럽게 나타내되, 단순 소멸보다 심판 아래의 파멸을 더 잘 드러내는 ‘멸망하다’를 택했습니다.
theological_decisions:
- issue: 우상 풍자의 핵심 뉘앙스
  chosen_reading: 이 절은 우상들이 실체 없는 헛것이며 사람을 미혹하는 산물이고, 심판의 때에 실제로 멸망한다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘미혹’보다 ‘조롱거리’에 가까운 풍자로 볼 수도 있습니다.
  - ‘벌받는 때’는 보다 전통적으로 ‘방문의 때’로 옮길 수도 있습니다.
  rationale: 예레미야 51장 전체의 우상 비판 흐름과 맞추어, 공허함과 기만성, 그리고 심판의 파멸이라는 세 요소를 모두 보존하는 쪽이 본문의 힘을 가장 잘 전달합니다.
  doctrine_reference: 예레미야 10:15; 51:17-19
