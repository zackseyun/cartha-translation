id: JER.51.34
reference: Jeremiah 51:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אכל/נו הממ/נו נְבוּכַדְרֶאצַּר֮ מֶ֣לֶךְ בָּבֶל֒ הציג/נו כְּלִ֣י רִ֔יק בלע/נו כַּ/תַּנִּ֔ין מִלָּ֥א כְרֵשׂ֖/וֹ מֵֽ/עֲדָנָ֑/י הדיח/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/034.yaml
  text: Nebuchadnezzar king of Babylon has devoured me[a]; he has crushed me. He has set me down like an empty vessel; he has swallowed me like a sea monster; he has filled his belly with my delicacies[c][b]; he has cast me out.
  footnotes:
  - marker: a
    text: Or 'like a dragon.' The Hebrew tannin can refer to a great serpent, dragon-like creature, or sea monster; here the swallowing imagery favors 'sea monster.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with my choice things' or 'with my delights.'
    reason: lexical_alternative
  - marker: c
    text: 'The speaker is personified Zion/Jerusalem; although some Hebrew forms may suggest a plural object in the poetic line, the sense in context is commonly rendered as a singular personification: ''me.'''
    reason: cultural_note
translation:
  language: ko
  text: 바벨론 왕 느부갓네살이 나를 삼켰습니다[a]. 그는 나를 짓밟았습니다. 그는 나를 빈 그릇처럼 놓아두었습니다. 그는 나를 바다 괴물처럼 삼켰습니다. 그는 나의 진미로 자기 배를 채웠습니다[c][b]. 그는 나를 내던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용처럼’. 히브리어 tannin은 큰 뱀, 용 같은 피조물, 또는 바다 괴물을 가리킬 수 있으며, 여기서는 ‘삼켰다’는 이미지 때문에 ‘바다 괴물’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나의 좋은 것들로’ 또는 ‘나의 기쁨들로’.
    reason: lexical_alternative
  - marker: c
    text: 말하는 이는 의인화된 시온/예루살렘입니다. 히브리어 형태가 시적으로 복수 목적어를 시사하는 듯해도, 문맥상 일반적으로는 ‘나’라는 단수 의인화로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: אכלנו / בלענו
  english_pob_choice: has devoured me / has swallowed me
  chosen_korean: 나를 삼켰습니다
  alternatives_korean:
  - 나를 먹었습니다
  - 나를 삼켜 버렸습니다
  - 나를 잡아먹었습니다
  lexicon: HALOT
  rationale: ‘먹다’보다 ‘삼키다’가 폭력적 착취와 완전한 잠식을 더 직접적으로 살리며, 반복된 섭취 이미지도 자연스럽게 연결합니다.
- source_word: הממנו
  english_pob_choice: has crushed me
  chosen_korean: 나를 짓밟았습니다
  alternatives_korean:
  - 나를 부수었습니다
  - 나를 혼란에 빠뜨렸습니다
  - 나를 산산이 부쉈습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 혼란보다 파괴적 압박이 앞서므로, 시적 병행을 살리는 ‘짓밟다’가 가장 압축적입니다.
- source_word: הציגנו כְּלִי ריק
  english_pob_choice: has set me down like an empty vessel
  chosen_korean: 그는 나를 빈 그릇처럼 놓아두었습니다
  alternatives_korean:
  - 그는 나를 빈 그릇으로 만들었습니다
  - 그는 나를 빈 용기처럼 두었습니다
  lexicon: HALOT
  rationale: 히필의 구체적 ‘놓다/두다’ 이미지를 살리면서, ‘빈 그릇’으로 폐기된 상태를 한국어로 자연스럽게 전달합니다.
- source_word: כתנין
  english_pob_choice: like a sea monster
  chosen_korean: 바다 괴물처럼
  alternatives_korean:
  - 용처럼
  - 큰 뱀처럼
  - 해룡처럼
  lexicon: HALOT
  rationale: תנין은 ‘용’보다 더 넓은 괴물/대형 파충류 이미지이므로, 현대 독자가 과도한 판타지 이미지를 떠올리지 않도록 ‘바다 괴물’을 택했습니다.
- source_word: מלא כרשו מעדני
  english_pob_choice: he has filled his belly with my delicacies
  chosen_korean: 그는 나의 진미로 자기 배를 채웠습니다
  alternatives_korean:
  - 그는 나의 좋은 것들로 배를 채웠습니다
  - 그는 나의 별미로 배를 가득 채웠습니다
  - 그는 나의 기쁨으로 배를 채웠습니다
  lexicon: HALOT
  rationale: מַעֲדַנִּים은 ‘진미/별미/호사품’의 뜻이므로, 약탈당한 귀한 것들을 드러내는 ‘진미’가 가장 응축적입니다.
- source_word: הדיחנו
  english_pob_choice: he has cast me out
  chosen_korean: 그는 나를 내던졌습니다
  alternatives_korean:
  - 그는 나를 쫓아냈습니다
  - 그는 나를 밀쳐냈습니다
  - 그는 나를 몰아냈습니다
  lexicon: HALOT
  rationale: 여기서는 먹어 삼킨 뒤 토해내듯 버리는 종결 동작이 강하므로, ‘내던지다’가 폭력성과 폐기를 함께 살립니다.
theological_decisions:
- issue: 화자로서의 시온/예루살렘 인칭
  chosen_reading: 본문의 1인칭을 개인이 아니라 의인화된 시온/예루살렘의 말로 유지했습니다.
  alternative_readings:
  - ‘우리를’로 집단화하는 읽기
  - 중립적으로 ‘나’를 개인 화자로 약화하는 읽기
  rationale: 히브리어 시적 화법의 의인화를 보존해야 본문의 탄식과 고발의 정서가 훼손되지 않습니다.
  doctrine_reference: 시온-예루살렘 의인화에 대한 예언서 시적 관습
- issue: ‘내던졌습니다’의 의미 범위
  chosen_reading: 최종 동작을 단순 이동이 아니라 수치스러운 배출/폐기로 읽어 ‘내던졌습니다’로 옮겼습니다.
  alternative_readings:
  - ‘내보냈습니다’
  - ‘버렸습니다’
  - ‘쫓아냈습니다’
  rationale: 포식-배출의 연속 이미지가 핵심이므로, 완곡한 표현보다 폭력적 폐기감을 살리는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥적-시적 의미 보존 원칙
