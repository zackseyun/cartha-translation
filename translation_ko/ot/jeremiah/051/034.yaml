  rationale: 포식-배출의 연속 이미지가 핵심이므로, 완곡한 표현보다 폭력적 폐기감을 살리는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥적-시적 의미 보존 원칙
