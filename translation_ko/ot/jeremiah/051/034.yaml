- issue: ‘내던졌습니다’의 의미 범위
  chosen_reading: 최종 동작을 단순 이동이 아니라 수치스러운 배출/폐기로 읽어 ‘내던졌습니다’로 옮겼습니다.
  alternative_readings:
  - ‘내보냈습니다’
