  source_fidelity: 첫 동사 אכל과 뒤의 בלע는 서로 다른 섭취 동사이므로 둘 다 ‘삼켰습니다’로 옮기면 반복과 어휘적 구별이 사라집니다. המם는 여기서 파괴를 뜻하므로 ‘짓부수었습니다’가 ‘짓밟았습니다’보다 직접적입니다. 마지막 הדיח는 문맥상 몰아내거나 내쫓는 행위를 나타내므로 ‘내쫓았습니다’가 ‘내던졌습니다’보다 근거 있는 표현입니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. 다만 각주 a는 ‘바다 괴물’의 어휘 대안인데 첫 번째 ‘삼켰습니다’에 붙어 있어 해당 어구 뒤로 옮겨야 합니다. ‘나의 기쁨들’은 한국어에서 다소 부자연스러워 ‘나의 즐거운 것들’로 다듬었습니다.
  terminology: 느부갓네살, 바벨론, 시온/예루살렘, 바다 괴물, 진미는 현대 표준 한국어의 문체와 본문의 시적 비유에 적합합니다. ‘잡아먹었습니다/삼켰습니다’를 구별하여 원문의 동사 선택을 보존했습니다.
