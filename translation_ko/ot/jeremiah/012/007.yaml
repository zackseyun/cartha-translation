id: JER.12.7
reference: Jeremiah 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָזַ֨בְתִּי֙ אֶת בֵּיתִ֔/י נָטַ֖שְׁתִּי אֶת נַחֲלָתִ֑/י נָתַ֛תִּי אֶת יְדִד֥וּת נַפְשִׁ֖/י בְּ/כַ֥ף אֹיְבֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/007.yaml
  text: I have forsaken my house[a]; I have abandoned my inheritance[c][b]; I have given the beloved of my soul into the hand of her enemies.
  footnotes:
  - marker: a
    text: Or 'my soul’s beloved,' 'the one my soul loves,' or 'my dearly loved one.' The Hebrew expression is an intimate phrase of affection.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the palm/hand of her enemies,' an idiom meaning into their power or control.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew uses a feminine suffix, 'her enemies.' The referent may be understood as the inheritance, Judah/Jerusalem personified, or the beloved one; the text does not specify more precisely.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 내 집을 버렸고[a], 내 유산을 내던졌으며[b], 내 영혼이 사랑하는 이를 그 여자의 원수들의 손에 넘겼습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼의 사랑하는 이’, ‘내 영혼이 사랑하는 사람’, ‘내가 매우 사랑하는 이’로도 옮길 수 있습니다. 히브리어 표현은 친밀한 애정의 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 손바닥/손 안에’라는 관용구로, 그들의 지배나 통제 아래에 두었다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 여성형 어미를 사용합니다. 그 지시 대상은 유산, 의인화된 유다/예루살렘, 또는 사랑하는 이를 가리킬 수 있으며, 본문은 더 구체적으로 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַבְתִּי
  english_pob_choice: I have forsaken
  chosen_korean: 내가 내 집을 버렸고
  alternatives_korean:
  - 내가 내 집을 떠났고
  - 내가 내 집을 forsaken
  lexicon: HALOT
  rationale: 완료형 동작으로서의 단호한 결별을 살리되, 한국어에서는 ‘버리다’가 ‘forsake’의 관계적·정서적 단절을 가장 자연스럽게 드러냅니다.
- source_word: בֵּיתִי
  english_pob_choice: my house
  chosen_korean: 내 집
  alternatives_korean:
  - 내 집안
  - 내 가문
  - 내 성전
  lexicon: HALOT
  rationale: 히브리어 בַּיִת의 기본 의미를 따라 ‘집’으로 두어, 본문이 더 특정하지 않는 가정적·언약적 울림을 열어 둡니다.
- source_word: נַחֲלָתִי
  english_pob_choice: my inheritance
  chosen_korean: 내 유산
  alternatives_korean:
  - 내 상속분
  - 내 기업
  - 내 소유
  lexicon: HALOT
  rationale: נַחֲלָה의 상속·분깃 의미를 살리면서 한국어에서 언약적 소유를 비교적 자연스럽게 전달하는 말로 ‘유산’을 택했습니다.
- source_word: יְדִדוּת נַפְשִׁי
  english_pob_choice: the beloved of my soul
  chosen_korean: 내 영혼이 사랑하는 이
  alternatives_korean:
  - 내 영혼의 사랑하는 이
  - 내 영혼의 사랑받는 이
  - 내 마음이 사랑하는 이
  lexicon: HALOT
  rationale: 직역투를 유지하되 한국어 어순에 맞춰, 친밀하고 애정 어린 히브리어 관용구의 강도를 과도하게 완화하지 않도록 했습니다.
- source_word: בְּכַף
  english_pob_choice: into the hand of
  chosen_korean: 그 여자의 원수들의 손에
  alternatives_korean:
  - 그 여자의 원수들의 손바닥에
  - 그 여자의 원수들의 권세 아래
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구의 통제·지배 의미를 가장 널리 전달하며, 한국어에서도 자연스럽게 ‘권력 아래’의 뉘앙스를 담습니다.
theological_decisions:
- issue: 여성형 소유격의 지시 대상
  chosen_reading: ‘그 여자의 원수들’로 옮겨, 여성형 지시가 가리킬 수 있는 유산/예루살렘/사랑하는 이의 여지를 그대로 남겼습니다.
  alternative_readings:
  - 그것의 원수들
  - 유다의 원수들
  - 예루살렘의 원수들
  rationale: 히브리어는 여성형 문법만 제공하고 구체적 선행사를 확정하지 않으므로, 본문이 지닌 시적·신학적 모호성을 해소하지 않고 보존합니다.
  doctrine_reference: 본문의 수사적 모호성 보존
- issue: ‘버렸고 / 내던졌으며’의 병렬성
  chosen_reading: 두 동사를 모두 구분해, 첫째는 관계적 단절, 둘째는 강한 폐기를 드러내도록 했습니다.
  alternative_readings:
  - 둘 다 ‘버렸습니다’로 통일
  - 둘 다 ‘내버렸습니다’로 통일
  rationale: עָזַב과 נָטַשׁ는 의미 영역이 겹치지만 동일하지 않으므로, 병행 구조의 반복 속에서도 미세한 차이를 한국어로 살려 두었습니다.
  doctrine_reference: 히브리 시어의 평행법 보존
