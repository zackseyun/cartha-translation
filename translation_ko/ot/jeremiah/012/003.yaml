id: JER.12.3
reference: Jeremiah 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָה֙ יְדַעְתָּ֔/נִי תִּרְאֵ֕/נִי וּ/בָחַנְתָּ֥ לִבִּ֖/י אִתָּ֑/ךְ הַתִּקֵ/ם֙ כְּ/צֹ֣אן לְ/טִבְחָ֔ה וְ/הַקְדִּשֵׁ֖/ם לְ/י֥וֹם הֲרֵגָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/003.yaml
  text: But you[a], O Yahweh, know me; you see me, and you test my heart toward you. Pull them out like sheep for slaughter[c][b], and set them apart for the day of killing.
  footnotes:
  - marker: a
    text: Or 'my heart is with you.' The Hebrew phrase is compact and may express Jeremiah's inward orientation or loyalty in relation to the LORD.
    reason: alternative_reading
  - marker: b
    text: Or 'consecrate them'—literally 'set them apart,' here for judgment rather than blessing.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the day of slaughter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼님, 주님께서는 저를 아시고 저를 보시며, 제 마음이 주님을 향하고 있음을 시험하십니다.[a] 도살할 양 떼처럼 그들을 끌어내시고,[c] 죽임의 날을 위하여 그들을 구별해 두십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 마음이 주님과 함께합니다.’ 히브리어 구문은 압축적이어서, 예레미야의 내면이 야훼님께 향해 있거나 그분께 충성함을 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들을 성별하십시오.’ 문자적으로는 ‘그들을 구별해 두십시오’이며, 여기서는 복이 아니라 심판을 위한 구별입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘도살의 날을 위하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: WLC/전통 한국어 관용
  rationale: 이 절의 직접 호칭에서는 한국어 합쇼체의 자연스러움을 우선해 ‘주님’으로 옮겼습니다. 다만 영어 POB의 ‘Yahweh’는 신명기적 고유명 보존을 위한 선택이므로, 한국어 본문에서는 예배문체의 자연스러움을 유지하면서도 동일한 지시 대상을 살렸습니다.
- source_word: יְדַעְתָּנִי / תִּרְאֵנִי / וּבָחַנְתָּ לִבִּי
  english_pob_choice: know me / you see me / you test my heart
  chosen_korean: 저를 아시고, 저를 보시며, 제 마음을 시험하십니다
  alternatives_korean:
  - 저를 알며, 저를 바라보시며, 제 심장을 검증하십니다
  - 저를 아시고, 저를 살피시며, 제 마음을 살피십니다
  lexicon: HALOT
  rationale: 동사 삼중구조를 살려 ‘아시고, 보시며, 시험하십니다’로 대응했습니다. ‘시험하다’는 בחן의 내적 검증·연단 의미를 가장 직접적으로 살리며, ‘마음’은 לֵב의 관용적 내면 중심을 반영합니다.
- source_word: אִתָּךְ
  english_pob_choice: toward you
  chosen_korean: 주님과 함께함
  alternatives_korean:
  - 주님께 대하여
  - 주님을 향하여
  - 주님과 함께
  lexicon: HALOT
  rationale: 이 구절의 난해한 전치사구는 단순한 ‘with you’보다 관계적 방향성을 드러내는 표현이 필요합니다. POB의 해석 방향을 따라, 예레미야의 마음이 주님 편에 있음을 자연스러운 한국어로 옮겼습니다.
- source_word: הַתִּקֵם
  english_pob_choice: Pull them out
  chosen_korean: 그들을 끌어내시고
  alternatives_korean:
  - 그들을 빼내시고
  - 그들을 끄집어내시고
  - 그들을 끌어내어
  lexicon: HALOT
  rationale: 히필형 נתק의 핵심 동작을 살려 ‘끌어내다’로 옮겼습니다. 영어 POB가 채택한 직접적·가시적인 동작감을 유지하면서도 한국어 문맥에서 과도하게 구어적이지 않게 했습니다.
- source_word: כְּצֹאן לְטִבְחָה
  english_pob_choice: like sheep for slaughter
  chosen_korean: 도살당할 양처럼
  alternatives_korean:
  - 도살을 위한 양처럼
  - 도살장으로 끌려갈 양처럼
  - 죽임당할 양처럼
  lexicon: HALOT
  rationale: 비유의 강도를 보존하기 위해 ‘도살당할 양’으로 옮겼습니다. ‘양’은 한국어 성서 문맥에서 집단적 희생 이미지와 잘 맞고, ‘도살당할’은 לִטְבֹּחַ의 살해·도살 감각을 직접 드러냅니다.
- source_word: וְהַקְדִּשֵׁם
  english_pob_choice: set them apart
  chosen_korean: 그들을 구별해 두십시오
  alternatives_korean:
  - 그들을 거룩하게 하십시오
  - 그들을 성별해 두십시오
  - 그들을 구별하십시오
  lexicon: HALOT
  rationale: קדש의 기본 의미를 살리되, 여기서는 심판을 위한 분리이므로 긍정적 ‘거룩하게 하다’보다 ‘구별해 두다’가 문맥에 더 정확합니다. 영어 POB의 주석적 긴장을 한국어에서도 유지했습니다.
- source_word: לְיוֹם הֲרֵגָה
  english_pob_choice: for the day of killing
  chosen_korean: 죽임의 날
  alternatives_korean:
  - 도살의 날
  - 살육의 날
  - 죽음의 날
  lexicon: HALOT
  rationale: הֲרֵגָה의 직설성을 살려 ‘죽임’으로 옮겼습니다. ‘죽임의 날’은 심판의 날이라는 시간적 초점을 유지하면서도 본문의 폭력성을 완화하지 않습니다.
theological_decisions:
- issue: 예레미야의 심판 탄원에서 폭력적 이미지를 어떻게 처리할 것인가
  chosen_reading: ‘도살당할 양’, ‘죽임의 날’ 같은 이미지를 약화하지 않고 그대로 살려, 하나님의 न्याय적 심판에 대한 탄원을 직접적으로 드러냈습니다.
  alternative_readings:
  - 심판을 위해 준비해 두다로 완화하기
  - 상징적 노출로만 읽기
  rationale: 히브리어 본문은 실제 도살·살해 이미지를 사용하므로, 이를 완화하면 시인의 간구 강도가 약해집니다. 본문이 지닌 긴장과 비애를 그대로 전달하는 것이 번역 원칙에 부합합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
- issue: אִתָּךְ의 관계적 방향성
  chosen_reading: 예레미야의 내면이 ‘주님과 함께함’으로 주님 편에 있음을 드러내되, 단순한 공간적 ‘함께’로 오해되지 않게 했습니다.
  alternative_readings:
  - ‘주님께 대하여’로 직역하기
  - ‘주님을 향하여’로 방향성만 살리기
  rationale: 이 구는 문법적으로 난해하므로, POB의 해석을 따라 내면의 충성/지향을 드러내는 방향으로 옮기는 것이 가장 균형적입니다.
  doctrine_reference: 번역 원칙 §§1, 6
