revisions:
- from: 그러나 주님, 주님께서는 저를 아시고, 저를 보시며, 제 마음이 주님과 함께함을 시험하십니다. 그들을 도살당할 양처럼 끌어내시고, 죽임의 날을 위하여 그들을 구별해 두십시오.[a][b][c]
  to: 그러나 야훼님, 주님께서는 저를 아시고 저를 보시며, 제 마음이 주님을 향하고 있음을 시험하십니다.[a] 도살할 양 떼처럼 그들을 끌어내시고,[c] 죽임의 날을 위하여 그들을 구별해 두십시오.[b]
  rationale: 신명 יהוה를 ‘야훼님’으로 보존하여 POB 용어 선택을 반영했습니다. אִתָּךְ의 논쟁적인 관계 의미는 본문에서 ‘주님을 향하고 있음을’으로 자연스럽게 드러내고, ‘함께’라는 가능한 독법은 각주에 남겼습니다. 또한 각주를 해당 어구 바로 뒤에 배치했으며, 도살 비유의 집합적 이미지를 ‘양 떼’로 표현했습니다.
