  source_fidelity: 히브리어 첫 동사는 3인칭 남성 단수이므로 본문에서 ‘그가’로 옮기는 것이 원문 형태에 가장 충실합니다. 문맥상 파괴자들을 가리키는 복수 이해는 가능하나 각주로 보존하는 편이 안전합니다. אָבְלָה עָלַי는 ‘내 앞에서/내게’라는 해석 범위가 있으므로, 영어 POB의 선택을 따라 ‘내 앞에서’로 유지할 수 있습니다.
  naturalness: 초안의 ‘그것은 내 앞에서 애도하며, 황폐합니다’는 병렬 방식이 한국어로 다소 부자연스럽고, 무생물인 땅이 ‘애도하다’의 대상처럼 들릴 수 있습니다. ‘황폐한 채 슬퍼합니다’가 원문의 의인화와 상태를 자연스럽게 전달합니다.
  terminology: ‘황무지’와 ‘온 땅’은 적절합니다. שָׂם עַל־לֵב의 관용 표현은 현대 표준어 ‘마음에 두다’로 자연스럽게 옮길 수 있습니다. ‘이를’로 받아 앞의 황폐와 그 현실 전체를 가리키게 했습니다.
