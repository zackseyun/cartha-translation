id: JER.12.11
reference: Jeremiah 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂמָ/הּ֙ לִ/שְׁמָמָ֔ה אָבְלָ֥ה עָלַ֖/י שְׁמֵמָ֑ה נָשַׁ֨מָּה֙ כָּל הָ/אָ֔רֶץ כִּ֛י אֵ֥ין אִ֖ישׁ שָׂ֥ם עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/011.yaml
  text: They have made it a desolation[a]; it mourns before me, desolate. The whole land is laid waste[c][b], because no one takes it to heart.
  footnotes:
  - marker: a
    text: Or 'He has made it a desolation,' preserving the Hebrew singular verb; the English plural 'They have made it' reflects the likely contextual subject from the preceding lines.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'no man sets it upon the heart,' an idiom meaning 'no one takes it seriously' or 'no one takes it to heart.'
    reason: lexical_alternative
  - marker: c
    text: '''Land'' could also be rendered ''earth,'' but here likely refers specifically to the devastated land of Judah.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가[a] 그것을 황무지로 만들었습니다. 그것은 내 앞에서 황폐한 채 슬퍼합니다. 온 땅[b]이 황폐해졌습니다. 아무도 이를 마음에 두지 않기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 3인칭 남성 단수입니다. 그러나 앞 절들의 문맥에 비추어, 파괴자들을 가리키는 복수 ‘그들이’로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘땅’은 ‘땅/지구’를 뜻할 수 있으나, 여기서는 문맥상 황폐해진 유다의 땅을 가리키는 것으로 보입니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘마음 위에 두다’입니다. 이는 어떤 일을 진지하게 여기거나 마음에 두는 것을 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמָהּ לִשְׁמָמָה
  english_pob_choice: They have made it a desolation
  chosen_korean: 그들이 그것을 황무지로 만들었습니다
  alternatives_korean:
  - 그가 그것을 황무지로 만들었습니다
  - 그것을 황폐하게 만들었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘두다/만들다’ 계열 동사를 써서 상태 변화를 나타내므로, 결과 상태를 드러내는 ‘황무지로 만들었습니다’가 자연스럽고 원문 의미를 유지합니다.
- source_word: אָבְלָה ... שְׁמֵמָה
  english_pob_choice: it mourns ... desolate
  chosen_korean: 그것은 내 앞에서 애도하며, 황폐합니다
  alternatives_korean:
  - 그것은 내 앞에서 슬퍼하며, 황폐합니다
  - 그것은 내 앞에서 통곡하며, 황폐합니다
  lexicon: HALOT
  rationale: אָבַל의 기본 의미는 ‘애도하다/슬퍼하다’이므로 ‘애도하며’로 옮겼고, 이어지는 שְׁמֵמָה는 상태를 덧붙이는 술어형이어서 ‘황폐합니다’로 살렸습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: The whole land
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 나라
  - 온 국토
  lexicon: HALOT
  rationale: אֶרֶץ는 문맥상 유다의 ‘땅/국토’를 가리키므로 ‘온 땅’이 가장 직역에 가깝고, 너무 행정적이거나 현대적인 한정어를 피합니다.
- source_word: כִּי אֵין אִישׁ שָׂם עַל לֵב
  english_pob_choice: because no one takes it to heart
  chosen_korean: 아무도 그것을 마음에 두지 않기 때문입니다
  alternatives_korean:
  - 아무도 그것을 마음에 새기지 않기 때문입니다
  - 아무도 그것을 진지하게 여기지 않기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 שָׂם עַל לֵב은 ‘마음에 두다/유의하다’의 뜻이므로, POB의 의미를 따라 ‘마음에 두지 않다’로 옮기는 것이 가장 직접적입니다.
theological_decisions:
- issue: עָלַי의 방향성
  chosen_reading: 내 앞에서
  alternative_readings:
  - 내게
  - 내 위에
  rationale: ‘애도하다’와 함께 쓰일 때 עַל은 단순한 물리적 ‘위에’보다 화자 앞/면전의 상황을 나타낼 수 있어, 하나님의 시야 앞에서 벌어지는 황폐를 드러내는 ‘내 앞에서’가 문맥에 맞습니다.
  doctrine_reference: Translation philosophy §1
