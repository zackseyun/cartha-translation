id: JER.12.10
reference: Jeremiah 12:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רֹעִ֤ים רַבִּים֙ שִֽׁחֲת֣וּ כַרְמִ֔/י בֹּסְס֖וּ אֶת חֶלְקָתִ֑/י נָֽתְנ֛וּ אֶת חֶלְקַ֥ת חֶמְדָּתִ֖/י לְ/מִדְבַּ֥ר שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/010.yaml
  text: Many shepherds have ruined my vineyard[a]; they have trampled my portion[b]; they have made my pleasant portion a desolate wilderness.
  footnotes:
  - marker: a
    text: Or 'Many rulers' or 'Many leaders'; Hebrew 'shepherds,' a common prophetic metaphor for those who govern or oversee.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have turned my delightful portion into a desolate wilderness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 목자들이 내 포도원을 망쳤습니다[a]; 그들이 내 몫을 짓밟았습니다[b]; 그들이 내 사랑스러운 몫을 황폐한 광야로 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 통치자들’ 또는 ‘많은 지도자들’. 히브리어 ‘목자들’은 통치하거나 돌보는 이들을 가리키는 흔한 예언적 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 내 사랑스러운 몫을 황폐한 광야로 바꾸었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעִים רַבִּים
  english_pob_choice: Many shepherds
  chosen_korean: 많은 목자들
  alternatives_korean:
  - 많은 목자
  - 많은 통치자들
  - 많은 지도자들
  lexicon: HALOT
  rationale: 히브리어 רֹעִים는 문자적으로 ‘목자들’이므로, 본문이 유지하는 비유를 한국어에서도 그대로 살렸습니다. ‘많은’은 רַבִּים를 직접 반영합니다.
- source_word: שִׁחֲתוּ
  english_pob_choice: have ruined
  chosen_korean: 망쳤습니다
  alternatives_korean:
  - 파괴했습니다
  - 부패시켰습니다
  lexicon: HALOT
  rationale: שׁחת는 망치다, 훼손하다, 파괴하다의 뜻을 가지며, 포도원 이미지와 잘 맞는 현대 한국어로 ‘망쳤습니다’를 선택했습니다.
- source_word: בֹּסְסוּ אֶת חֶלְקָתִי
  english_pob_choice: they have trampled my portion
  chosen_korean: 그들이 내 몫을 짓밟았습니다
  alternatives_korean:
  - 그들이 내 분깃을 짓밟았습니다
  - 그들이 내 땅을 밟아 짓눌렀습니다
  lexicon: HALOT
  rationale: בֹּסְסוּ는 밟아 짓밟는 동작을 가리키므로 ‘짓밟았습니다’가 가장 직접적입니다. חֶלְקָה는 ‘몫/분깃/소유 몫’의 넓은 의미를 가질 수 있어, 시적·신학적 여지를 살려 ‘몫’으로 옮겼습니다.
- source_word: חֶלְקַת חֶמְדָּתִי
  english_pob_choice: my pleasant portion
  chosen_korean: 내 사랑스러운 몫
  alternatives_korean:
  - 내 소중한 몫
  - 내 즐거운 몫
  - 내 사랑하는 몫
  lexicon: HALOT
  rationale: חֶמְדָּה는 ‘바람직함, 기쁨, 사랑스러움, 소중함’을 뜻하므로, 문맥의 정서적 가치를 살려 ‘사랑스러운’으로 옮겼습니다. 이 표현은 단순한 지리 정보보다 소유자에게 귀한 몫이라는 뉘앙스를 드러냅니다.
- source_word: לְמִדְבַּר שְׁמָמָה
  english_pob_choice: a desolate wilderness
  chosen_korean: 황폐한 광야
  alternatives_korean:
  - 황무한 광야
  - 황폐한 황무지
  - 폐허의 광야
  lexicon: HALOT
  rationale: מִדְבָּר는 ‘광야’, שְׁמָמָה는 ‘황폐, 적막한 폐허’를 뜻하므로, 결과 상태를 간결하게 드러내는 ‘황폐한 광야’가 적절합니다.
theological_decisions:
- issue: ‘목자들’ 비유를 본문에서 해석어로 풀지 않을지 여부
  chosen_reading: ‘목자들’을 그대로 유지해, 통치자/지도자에 대한 비유적 표현을 독자가 본문 안에서 읽도록 했습니다.
  alternative_readings:
  - 통치자들
  - 지도자들
  - 목회자들
  rationale: 히브리어 본문은 비유를 직접 사용하므로, 이를 곧바로 해석어로 바꾸면 원문의 수사적 긴장과 예언적 상징성이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: ‘내 몫/내 사랑스러운 몫’의 땅-소유 이미지를 설명어로 환원할지 여부
  chosen_reading: 포도원·몫·사랑스러운 몫의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 내 땅
  - 내 기업
  - 내 유업
  rationale: 이 절은 토지와 소유의 이미지가 겹겹이 쌓인 구조이므로, 한 가지 설명으로 평면화하지 않고 원문의 정서와 신학적 중첩을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
