id: JER.12.2
reference: Jeremiah 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְטַעְתָּ/ם֙ גַּם שֹׁרָ֔שׁוּ יֵלְכ֖וּ גַּם עָ֣שׂוּ פֶ֑רִי קָר֤וֹב אַתָּה֙ בְּ/פִי/הֶ֔ם וְ/רָח֖וֹק מִ/כִּלְיוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/002.yaml
  text: You planted them; they have even taken root. They grow; they even produce fruit. You are near in their mouth[a], but far from their innermost being.
  footnotes:
  - marker: a
    text: Hebrew literally, 'far from their kidneys,' a Hebrew expression for the inner self or hidden motives.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 그들을 심으셨으니, 그들은 뿌리까지 내렸습니다. 그들은 자라서 열매까지 맺습니다. 주님께서는 그들의 입에는 가까우시나, 그들의 가장 깊은 속에서는 멀리 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그들의 콩팥에서 멀리 계십니다’입니다. 히브리어에서 ‘콩팥’은 숨은 생각과 내면을 가리키는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: נְטַעְתָּם
  english_pob_choice: You planted them
  chosen_korean: 주님께서 그들을 심으셨으니
  alternatives_korean:
  - 주님께서 그들을 심으셨습니다
  - 주님이 그들을 심으셨으니
  lexicon: HALOT
  rationale: 2인칭 남성 단수의 직접 مخاطدة를 한국어에서 주님께 대한 직접 진술로 살리고, 시적 문맥에 맞게 원인·선행을 나타내는 -셨으니를 사용했습니다.
- source_word: שֹׁרָשׁוּ
  english_pob_choice: have even taken root
  chosen_korean: 그들은 뿌리를 내렸습니다
  alternatives_korean:
  - 그들은 뿌리내렸습니다
  - 그들은 이미 뿌리를 내렸습니다
  lexicon: HALOT
  rationale: שורש의 뿌리 이미지를 자연스러운 현대 한국어로 옮겼고, 가속의 뉘앙스는 앞뒤 문맥과 ‘그들은’의 서술 진행으로 충분히 드러납니다.
- source_word: יֵלְכּוּ
  english_pob_choice: They go on
  chosen_korean: 그들은 자라서
  alternatives_korean:
  - 그들은 계속 나아가
  - 그들은 번성하여
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘걷다’보다 뿌리 내린 뒤의 성장·진전 이미지를 살리는 것이 적절하여, 한국어에서는 다음 절과 연결해 ‘자라서’로 옮겼습니다.
- source_word: עָשׂוּ פֶרִי
  english_pob_choice: they even produce fruit
  chosen_korean: 열매까지 맺습니다
  alternatives_korean:
  - 열매를 맺습니다
  - 심지어 열매를 맺습니다
  lexicon: HALOT
  rationale: עשה פרי의 관용적 의미를 자연스럽게 풀었고, גַּם의 강조는 ‘까지’로 반영하여 ‘심지어’보다 문체를 덜 거칠게 유지했습니다.
- source_word: כִּלְיוֹתֵיהֶם
  english_pob_choice: their innermost being
  chosen_korean: 그들의 가장 깊은 속
  alternatives_korean:
  - 그들의 속마음
  - 그들의 심장
  - 그들의 신장
  lexicon: HALOT
  rationale: 히브리어의 ‘콩팥/신장’ 비유가 내면과 숨은 동기를 가리키므로, 해부학적 직역을 피하고 현대 한국어에서 가장 유사한 내면 표현으로 옮겼습니다.
theological_decisions:
- issue: 입술의 고백과 내면의 불일치
  chosen_reading: ‘입에는 가까우시나, 그들의 가장 깊은 속은 멀리 계십니다’로 외적 말과 내적 실재의 대조를 유지했습니다.
  alternative_readings:
  - 그들의 입술에는 가까우나
  - 겉으로는 가까우나
  rationale: 본문은 하나님 앞에서의 언어적 고백과 실제 내면의 거리감을 대비합니다. 이를 부드럽게 완화하기보다, 직접적인 대조를 살리는 것이 경고의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 주님께 대한 직접 호칭의 문체
  chosen_reading: 서술은 합쇼체로 유지하되, 하나님을 향한 직접 서술은 ‘주님께서…’ 형태로 정리했습니다.
  alternative_readings:
  - 여호와께서…
  - 야훼께서…
  rationale: 시편적 탄원·예언적 항의의 장르에서 독자 친화적이면서도 원문의 직접 호칭을 보존하는 방식이 필요합니다. 본문에는 야훼 직서가 아니라 2인칭 대화가 있으므로 ‘주님’으로 자연화했습니다.
  doctrine_reference: POB Korean style guide; divine address consistency
