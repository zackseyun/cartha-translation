revisions:
- from: 그것들이 정말로 내 백성의 길을 배워 내 이름으로 맹세하며, “야훼께서 살아 계십니다”라고 하게 되면 — 곧 그것들이 내 백성에게 바알로 맹세하도록 가르친 것과 같이 — 그것들은 내 백성 한가운데서 세워질 것입니다.[a][b][c]
