id: JER.12.16
reference: Jeremiah 12:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לָמֹ֣ד יִלְמְדוּ֩ אֶת דַּֽרְכֵ֨י עַמִּ֜/י לְ/הִשָּׁבֵ֤עַ בִּ/שְׁמִ/י֙ חַי יְהוָ֔ה כַּ/אֲשֶׁ֤ר לִמְּדוּ֙ אֶת עַמִּ֔/י לְ/הִשָּׁבֵ֖עַ בַּ/בָּ֑עַל וְ/נִבְנ֖וּ בְּ/ת֥וֹךְ עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/016.yaml
  text: And it will happen that if they indeed learn the ways of my people[a], to swear by my name, ‘As Yahweh lives,’ just as they taught my people to swear by Baal[c][b], then they will be built up in the midst of my people.
  footnotes:
  - marker: a
    text: Or, 'surely learn' or 'fully learn'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew oath formula: ''As the LORD lives.'' Also rendered, ''The LORD lives.'''
    reason: lexical_alternative
  - marker: c
    text: Or, 'they will be established among my people.' The Hebrew literally says 'they will be built up in the midst of my people.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것들이 정말로 내 백성의 길을 배워 내 이름으로 맹세하며, “야훼께서 살아 계십니다”라고 하게 되면 — 곧 그것들이 내 백성에게 바알로 맹세하도록 가르친 것과 같이 — 그것들은 내 백성 한가운데서 세워질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정말로 배운다면’, ‘충분히 배운다면’. 히브리어는 부정사 절대형과 동사를 함께 써서 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 맹세 공식입니다. 직역하면 ‘야훼께서 살아 계십니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 백성 가운데서 세워질 것입니다’. 히브리어는 문자적으로 ‘내 백성의 한가운데서 세워질 것입니다’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמֹד יִלְמְדוּ
  english_pob_choice: indeed learn
  chosen_korean: 정말로 배워
  alternatives_korean:
  - 참으로 배워
  - 확실히 배워
  - 열심히 배워
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+동사로 이루어진 강조를 한국어에서는 부자연스럽지 않게 ‘정말로’로 살려, 단순 조건보다 강한 학습의 강조를 드러냈습니다.
- source_word: דַּרְכֵי עַמִּי
  english_pob_choice: the ways of my people
  chosen_korean: 내 백성의 길
  alternatives_korean:
  - 내 백성의 행실
  - 내 백성의 관습
  lexicon: HALOT
  rationale: דֶּרֶךְ의 복수형이 지닌 생활 방식·신앙 행위의 뉘앙스를 ‘길’로 유지해, 단순 습관보다 공동체의 전반적 행로를 드러냈습니다.
- source_word: לְהִשָּׁבֵעַ בִּשְׁמִי / חַי יְהוָה
  english_pob_choice: to swear by my name, ‘As Yahweh lives,’
  chosen_korean: 내 이름으로 맹세하며, “야훼께서 살아 계십니다”
  alternatives_korean:
  - 내 이름으로 맹세하며, “야훼는 살아 계십니다”
  - 내 이름으로 맹세하며, “야훼의 삶을 두고”
  lexicon: HALOT
  rationale: ‘name’와 히브리어 맹세 공식인 ‘여호와께서 살아 계십니다’에 해당하는 표현을 직역에 가깝게 옮기되, 한국어 성경 문체에 맞게 자연스럽게 다듬었습니다.
- source_word: וְנִבְנוּ בְּתוֹךְ עַמִּי
  english_pob_choice: then they will be built up in the midst of my people
  chosen_korean: 그것들은 내 백성 한가운데서 세워질 것입니다
  alternatives_korean:
  - 그것들은 내 백성 가운데서 세워질 것입니다
  - 그것들은 내 백성 가운데서 세워질 것입니다
  lexicon: HALOT
  rationale: ‘built up’의 건축 은유를 유지하면서, POB의 해석처럼 공동체 안에서의 정착·편입 가능성을 열어 두기 위해 ‘세워질 것입니다’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 이름의 표기
  chosen_reading: 히브리어 고유명 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 번역은 프로젝트 기본 방침에 따라 언약적 신명 자체를 보존하기 위해 ‘야훼’를 사용합니다. 본문에는 ‘여호와께서 살아 계십니다’라는 맹세 공식이 아니라 신명 직역을 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘세워질 것입니다’의 의미 범위
  chosen_reading: 공동체 안에서의 세움/편입을 열어 두는 읽기
  alternative_readings:
  - 민족적 재건
  - 단순한 번성
  rationale: 문맥상 이방 민족의 변화와 공동체 편입의 가능성을 말하지만, 본문은 그 방식이나 범위를 구체화하지 않습니다. 따라서 ‘세워질 것입니다’로 은유를 살려 신학적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
