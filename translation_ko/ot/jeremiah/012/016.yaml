  rationale: 사람을 가리키는 대명사를 ‘그들’로 바로잡고, ‘길들’로 원문의 복수형을 반영했습니다. 또한 ‘야훼께서 살아 계십니다’라는 맹세 공식이 ‘내 이름으로 맹세하는’ 행위의 내용임을 자연스럽게 연결했습니다. 마지막 절의 수동 건축 은유는 ‘세워질 것입니다’로 유지하여 공동체 안에서의 확립·편입이라는 의미 가능성을 특정 교리로 좁히지 않았습니다. 각주 c의 중복도 실질적인 의미 대안으로 수정했습니다.
  reviewer_model: gpt-5.6-terra
