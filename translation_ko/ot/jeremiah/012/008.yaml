id: JER.12.8
reference: Jeremiah 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָיְתָה לִּ֥/י נַחֲלָתִ֖/י כְּ/אַרְיֵ֣ה בַ/יָּ֑עַר נָתְנָ֥ה עָלַ֛/י בְּ/קוֹלָ֖/הּ עַל כֵּ֥ן שְׂנֵאתִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/008.yaml
  text: My inheritance has become to me like a lion in the forest[a]; she has lifted up her voice against me[c][b]; therefore I hate her.
  footnotes:
  - marker: a
    text: Or 'she has roared against me.' The Hebrew literally says 'she has given her voice against me,' an idiom for hostile outcry; the lion imagery makes 'roared' a plausible contextual alternative.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'she/her,' referring to 'my inheritance,' a grammatically feminine noun and here personified.
    reason: cultural_note
  - marker: c
    text: Or 'I have hated her.' The Hebrew verb form can be rendered as a past or present perfective in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 기업은 숲의 사자처럼 되었습니다[a]. 그것이 나에게 대고 자기 소리를 높였으므로[b] 나는 그것을 미워했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 거슬러 으르렁거리는 사자처럼’이라는 뜻으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘자기 소리를 나에게 대었다’라고 말하며, 적대적 외침을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그녀/그것’으로 되어 있으며, 이는 ‘나의 기업’이라는 여성형 명사를 가리키는 인칭입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나는 그녀를 미워했습니다.’ 히브리어 동사는 문맥상 과거적 완료로도, 현재적 결과로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתִי
  english_pob_choice: My inheritance
  chosen_korean: 나의 기업
  alternatives_korean:
  - 나의 상속
  - 나의 유산
  - 나의 소유
  lexicon: HALOT
  rationale: נַחֲלָה는 언약적 몫과 소유를 함께 가리킬 수 있어, 한국어에서는 문맥상 ‘기업’이 가장 자연스럽고 성경적입니다. ‘상속’은 현대어 느낌이 강하고, ‘소유’는 관계적·언약적 뉘앙스가 약합니다.
- source_word: כְּאַרְיֵה בַיָּעַר
  english_pob_choice: like a lion in the forest
  chosen_korean: 숲의 사자처럼
  alternatives_korean:
  - 숲속의 사자처럼
  - 숲의 사자 같아
  - 숲속 사자처럼
  lexicon: HALOT
  rationale: אַרְיֵה는 표준적으로 ‘사자’이며, כְּ는 직접적인 비유를 나타냅니다. בַּיָּעַר는 ‘숲/숲속’을 뜻하므로 이를 간결하게 살려 비유 이미지를 유지했습니다.
- source_word: נָתְנָה עָלַי בְּקוֹלָהּ
  english_pob_choice: she has raised her voice against me
  chosen_korean: 그것이 나에게 대고 자기 소리를 높였으므로
  alternatives_korean:
  - 그것이 나를 향해 자기 목소리를 높였으므로
  - 그것이 나를 거슬러 소리를 높였으므로
  - 그것이 나에게 맞서 소리쳤으므로
  lexicon: HALOT
  rationale: 직역하면 ‘자기 목소리를 나에게 대고 내놓다/주다’이지만, 관용적으로 적대적 외침을 뜻합니다. ‘자기 소리를 높이다’는 원문 이미지를 유지하면서도 한국어에서 자연스럽습니다.
- source_word: שְׂנֵאתִיהָ
  english_pob_choice: I hate her
  chosen_korean: 나는 그것을 미워했습니다
  alternatives_korean:
  - 나는 그녀를 미워했습니다
  - 나는 그것을 싫어했습니다
  - 나는 그것을 미워합니다
  lexicon: HALOT
  rationale: 동사의 강한 감정을 약화하지 않고 직접 옮겼습니다. 히브리어의 여성 대명사는 ‘기업’의 문법적 여성성에 따른 것이므로, 한국어에서는 인격화된 ‘그것’으로 처리해 과도한 성별 인격화를 피했습니다.
theological_decisions:
- issue: 원문의 충격적인 감정 표현 שְׂנֵאתִיהָ를 어떻게 옮길지
  chosen_reading: ‘미워했습니다’로 직접 옮겨, 심판의 엄중함과 언약적 긴장을 약화하지 않았습니다.
  alternative_readings:
  - 싫어했습니다
  - 버렸습니다
  - 거절했습니다
  rationale: 본문은 하나님이 자기 기업을 향해 하시는 강한 심판적 진술이므로, 완화된 표현보다 원문의 거친 정조를 유지하는 편이 소스 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
