id: JER.12.15
reference: Jeremiah 12:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה אַֽחֲרֵי֙ נָתְשִׁ֣/י אוֹתָ֔/ם אָשׁ֖וּב וְ/רִֽחַמְתִּ֑י/ם וַ/הֲשִׁבֹתִ֛י/ם אִ֥ישׁ לְ/נַחֲלָת֖/וֹ וְ/אִ֥ישׁ לְ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/015.yaml
  text: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
  footnotes:
  - marker: a
    text: Or 'plucked them up.' The Hebrew verb carries the image of pulling up by the roots, a common Jeremiah judgment metaphor.
    reason: lexical_alternative
  - marker: b
    text: Or 'show mercy to them.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'each man ... and each man'; the singular masculine form is distributive, referring to each individual among the restored peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 뽑아낸 뒤에[a], 내가 다시 돌아와 그들을 불쌍히 여기고[b], 각 사람을 자기 기업으로, 각 사람을 자기 땅으로 다시 돌아오게 하겠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뽑아버린 뒤에’. 히브리어 동사는 뿌리째 뽑아내는 이미지를 담고 있어, 예레미야에서 흔한 심판 비유를 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 자비를 베풀고’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘각 사람 … 각 사람’은 남성 단수의 분배 용법으로, 회복될 사람들 각각을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְשִׁי
  english_pob_choice: I have uprooted
  chosen_korean: 내가 그들을 뽑아낸 뒤에
  alternatives_korean:
  - 내가 그들을 뿌리째 뽑아낸 뒤에
  - 내가 그들을 제거한 뒤에
  lexicon: HALOT
  rationale: 예레미야에서 נתש는 심판의 관용구로서 ‘뽑아내다/뿌리째 뽑다’의 이미지를 가지므로, 한국어에서도 그 농경적·폭력적 이미지를 살린 ‘뽑아내다’를 택했습니다.
- source_word: וְרִחַמְתִּים
  english_pob_choice: and have compassion on them
  chosen_korean: 그들에게 긍휼을 베풀고
  alternatives_korean:
  - 그들에게 자비를 베풀고
  - 그들을 불쌍히 여기고
  lexicon: HALOT
  rationale: רחם은 단순한 감정이 아니라 회복을 향한 연민을 가리키므로, 교회적 관용어인 ‘긍휼을 베풀다’로 옮기되 본문의 정서도 살렸습니다.
- source_word: וַהֲשִׁבֹתִים
  english_pob_choice: and I will bring them back
  chosen_korean: 각 사람을 자기 기업으로, 각 사람을 자기 땅으로 다시 돌아오게 하겠습니다
  alternatives_korean:
  - 그들을 다시 데려오겠습니다
  - 그들을 회복시키겠습니다
  lexicon: HALOT
  rationale: הִשׁיב는 단순한 ‘회복’보다 ‘돌아오게 하다’라는 이동의 이미지를 지니므로, 본문이 말하는 땅으로의 귀환을 분명하게 드러냈습니다.
- source_word: אִישׁ ... אִישׁ
  english_pob_choice: each man ... each man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각자
  - 각 남자
  lexicon: HALOT
  rationale: 히브리어는 남성 단수 분배용법이지만, 한국어에서는 성별을 전면화하기보다 분배 의미를 자연스럽게 전달하는 ‘각 사람’을 택했습니다.
theological_decisions:
- issue: 심판 이후의 회복이 지리적 귀환을 포함하는가
  chosen_reading: 이 절은 뽑아내는 심판 뒤에 하나님이 다시 긍휼을 베푸시고, 각 사람을 자기 기업과 자기 땅으로 돌려보내시는 구체적 회복을 말합니다.
  alternative_readings:
  - 영적 회복만을 가리킨다고 보는 읽기
  - 상징적으로만 이해하는 읽기
  rationale: ‘기업’과 ‘땅’이 함께 나오므로, 본문이 말하는 회복을 추상화하지 않고 실제적·지리적 귀환의 뜻을 살리는 것이 원문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 본문의 평이한 의미를 보존하며, 지리적·언약적 언어를 영적 은유로 축소하지 않습니다.'
