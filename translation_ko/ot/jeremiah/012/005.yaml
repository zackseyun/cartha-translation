  - severity: high
    issue: 마지막 수사 질문의 서술어가 불완전함
    rationale: ‘요단의 수풀 속에서 하겠느냐’는 ‘무엇을/어떻게 하겠느냐’의 핵심 동작이 누락되어 한국어 문장으로 부자연스럽고 תַּעֲשֶׂה를 충분히 반영하지 못합니다.
