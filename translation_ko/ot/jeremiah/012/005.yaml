id: JER.12.5
reference: Jeremiah 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אֶת רַגְלִ֥ים רַ֨צְתָּה֙ וַ/יַּלְא֔וּ/ךָ וְ/אֵ֥יךְ תְּתַֽחֲרֶ֖ה אֶת הַ/סּוּסִ֑ים וּ/בְ/אֶ֤רֶץ שָׁלוֹם֙ אַתָּ֣ה בוֹטֵ֔חַ וְ/אֵ֥יךְ תַּעֲשֶׂ֖ה בִּ/גְא֥וֹן הַ/יַּרְדֵּֽן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/005.yaml
  text: If you have run with footmen and they have worn you out[a], then how will you compete with horses? And if in a land of peace you feel secure, then what will you do in the thicket of the Jordan?
  footnotes:
  - marker: a
    text: Or 'the pride of the Jordan' or 'the swelling of the Jordan.' The Hebrew expression גְּאוֹן הַיַּרְדֵּן is debated; it may refer to the dense growth along the Jordan or, more literally, to its 'pride/majesty.'
    reason: alternative_reading
translation:
  language: ko
  text: 만일 네가 보병과 달리다가 지쳤다면, 어떻게 말들과 겨루겠느냐? 또 평화의 땅에서 네가 안전하다고 느낀다면, 어떻게 요단의 수풀 속에서 하겠느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현 ‘요단의 גְּאוֹן(geʾôn)’은 ‘자랑/위엄’, ‘범람’, 또는 요단 강가의 우거진 지대를 가리킬 수 있어 해석이 논쟁적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רַגְלִים / footmen
  english_pob_choice: footmen
  chosen_korean: 보병
  alternatives_korean:
  - 도보 병사
  - 걸어가는 자들
  lexicon: HALOT
  rationale: 비교 구도에서 말과 대조되는 ‘발로 달리는 전투 집단’의 성격을 한국어에서 가장 자연스럽게 살리려면 ‘보병’이 적절합니다.
- source_word: וַיַּלְאוּךָ / have worn you out
  english_pob_choice: have worn you out
  chosen_korean: 지쳤다면
  alternatives_korean:
  - 지치게 했다면
  - 기진하게 했다면
  lexicon: HALOT
  rationale: לאה의 핵심은 피로하게 하거나 기운이 빠지게 하는 뜻이므로, 문맥의 수사적 압박을 살리면서도 현대 한국어에서 자연스러운 ‘지치다’로 옮겼습니다.
- source_word: בּוֹטֵחַ / are secure
  english_pob_choice: feel secure
  chosen_korean: 안전하다고 느낀다면
  alternatives_korean:
  - 안전하다면
  - 의지한다면
  lexicon: HALOT
  rationale: 여기서는 하나님께 대한 신앙 고백보다 평온한 환경에서의 안도감을 가리키므로, ‘안전하다’의 상태감과 ‘느낀다’의 주관적 안정을 함께 드러냈습니다.
- source_word: גְּאוֹן הַיַּרְדֵּן / the thicket of the Jordan
  english_pob_choice: the thicket of the Jordan
  chosen_korean: 요단의 수풀 속
  alternatives_korean:
  - 요단의 자랑
  - 요단의 범람지
  lexicon: HALOT
  rationale: 히브리어 표현은 의미가 논쟁적이지만, 문맥상 위험한 요단 강가의 우거진 지대를 가리키는 것으로 읽히므로, 그 장소성을 살린 ‘수풀 속’을 택했습니다.
theological_decisions:
- issue: בּוֹטֵחַ의 의미가 신학적 ‘신뢰’인지, 상황적 ‘안전함’인지
  chosen_reading: 상황적 안전감으로 읽고 ‘안전하다고 느낀다면’으로 번역했습니다.
  alternative_readings:
  - 네가 신뢰한다면
  - 네가 안전하다면
  rationale: 이 문장은 하나님을 향한 신앙 진술이 아니라 더 어려운 상황을 대비시키는 수사적 질문이므로, 신학적 의미를 과도하게 부여하지 않았습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
- issue: גְּאוֹן הַיַּרְדֵּן의 해석
  chosen_reading: 위험한 요단 강변의 수풀 지대로 이해했습니다.
  alternative_readings:
  - 요단의 자랑
  - 요단의 범람지
  rationale: 히브리어의 중의성을 단정하기보다 문맥이 요구하는 위협의 이미지를 한국어로 전달하고, 다른 가능한 이해는 별도 주석으로 남기는 것이 투명합니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
