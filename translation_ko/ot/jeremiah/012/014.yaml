review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 의미는 대체로 잘 반영합니다. 다만 הִנְנִי + 분사의 임박성을 나타내는 첫 번째 נתש 표현은 유지하되, 두 번째 동사의 미래형과 한국어 문체를 일관되게 정리할 필요가 있습니다. 또한 נתש에 관한 각주 b가 현재 ‘땅’에 붙어 있어 해당 동사에 옮겨야 합니다.
  naturalness: ‘유산으로 준 기업’은 같은 의미권이 겹쳐 다소 부자연스럽고, 인용문 안의 ‘보아라’와 ‘뽑아내겠습니다’는 지정된 현대 합쇼체와 문체가 일관되지 않습니다. ‘보십시오’, ‘물려준 기업’, ‘뽑아내려고 합니다/뽑아내겠습니다’로 다듬으면 현대 표준어의 격식 있는 문장이 됩니다.
  terminology: יהוה는 초안의 ‘여호와’를 유지할 수 있습니다. נחלה는 성경적 핵심 용어인 ‘기업’으로, הִנְחַלְתִּי는 ‘물려준’으로 옮겨 어근의 관련성과 사역 의미를 자연스럽게 살렸습니다. נגע는 문맥상 침해의 뜻을 과도하게 확정하지 않고 ‘건드리는’으로 유지했습니다.
  issues:
  - severity: medium
    issue: 각주 b의 앵커가 ‘그들의 땅’에 붙어 있습니다.
    rationale: 각주 설명은 מֵעַל אַדְמָתָם(그들의 땅)가 아니라 נתש(뽑아내다/뿌리째 뽑다)의 어휘적 대안과 예레미야서의 반복 이미지를 다룹니다.
  - severity: medium
    issue: 인용문 안의 종결 표현이 현대 합쇼체와 일관되지 않습니다.
    rationale: ‘보아라’는 해라체이고 ‘뽑아내려 한다’는 평서체인 반면, 뒤 절은 합쇼체입니다. 지정된 번역 문체에 맞추어 통일하는 것이 필요합니다.
  - severity: low
    issue: ‘유산으로 준 기업’은 의미가 중복됩니다.
    rationale: ‘기업’ 자체가 상속받은 소유/몫의 뜻을 지니므로, 히필 동사의 뜻은 ‘물려준’으로 표현하는 편이 자연스럽고 정확합니다.
  revised_text: 여호와께서 이렇게 말씀하십니다. “나의 사악한 이웃들, 곧 내가 내 백성 이스라엘에게 물려준 기업을 건드리는 모든 이들에 대하여 이같이 말합니다. 보십시오, 내가 그들을 그들의 땅에서 뽑아내려고 합니다[b]. 그리고 유다의 집도 그들 가운데서 뽑아내겠습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘기업에 간섭하는’—히브리어는 문자적으로 ‘기업을 만지는’이라고 되어 있으며, 문맥상 적대적 침해가 함축됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 뽑아내겠다.’ 히브리어 동사는 예레미야서에서 심판의 비유로 반복되는 ‘뿌리째 뽑다’의 이미지입니다.
    reason: lexical_alternative
  revision_rationale: 문체를 현대 합쇼체로 통일하고, 중복된 ‘유산으로 준 기업’을 ‘물려준 기업’으로 고쳤습니다. 첫 번째 뽑아냄에는 הִנְנִי + 분사의 임박성을 반영해 ‘뽑아내려고 합니다’를 사용했고, 두 번째 뽑아냄은 원문의 미래형에 따라 ‘뽑아내겠습니다’로 유지했습니다. 또한 b 각주를 해당 동사에 연결했습니다. 원안의 a 각주는 본문에 표지 a가 실제로 붙지 않아, 각주 세트와 본문의 앵커를 일치시키기 위해 본문에서 제거했습니다.
