id: JER.12.14
reference: Jeremiah 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עַל כָּל שְׁכֵנַ/י֙ הָֽ/רָעִ֔ים הַ/נֹּֽגְעִים֙ בַּֽ/נַּחֲלָ֔ה אֲשֶׁר הִנְחַ֥לְתִּי אֶת עַמִּ֖/י אֶת יִשְׂרָאֵ֑ל הִנְ/נִ֤י נֹֽתְשָׁ/ם֙ מֵ/עַ֣ל אַדְמָתָ֔/ם וְ/אֶת בֵּ֥ית יְהוּדָ֖ה אֶתּ֥וֹשׁ מִ/תּוֹכָֽ/ם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/014.yaml
  text: 'Thus says Yahweh concerning all my wicked neighbors who touch the inheritance that I caused my people Israel to inherit: behold[a], I am about to uproot them from upon their land[b], and I will uproot the house of Judah from among them.'
  footnotes:
  - marker: a
    text: Or 'who encroach on the inheritance'—the Hebrew literally says 'who touch the inheritance,' with hostile interference implied by context.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will pluck them up.' The Hebrew verb is a recurring Jeremiah image for uprooting in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 이렇게 말씀하십니다. “나의 사악한 이웃들, 곧 내가 내 백성 이스라엘에게 유산으로 준 기업을 건드리는 모든 자들에 대하여, 보아라[a], 내가 그들을 그들의 땅 위에서 뽑아내려 한다[b]. 그리고 내가 유다의 집도 그들 가운데서 뽑아내겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기업에 간섭하는’—히브리어는 문자적으로 ‘기업을 만지는’이라고 되어 있으며, 문맥상 적대적 침해가 함축됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 뽑아내겠다.’ 히브리어 동사는 예레미야서에서 심판의 비유로 반복되는 ‘뿌리째 뽑다’의 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 여호와께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이렇게 말씀하십니다
  - 여호와께서 말씀하시기를
  lexicon: WLC / prophetic messenger formula
  rationale: 예언자적 전령 공식으로서 한국어에서는 자연스러운 선언형을 쓰되, 원문의 권위 있는 도입 구조를 유지했습니다.
- source_word: שְׁכֵנַי הָרָעִים
  english_pob_choice: my wicked neighbors
  chosen_korean: 나의 사악한 이웃들
  alternatives_korean:
  - 나의 악한 이웃들
  - 나의 불량한 이웃들
  lexicon: HALOT
  rationale: שׁכן의 ‘이웃들’과 רָעִים의 도덕적/적대적 뉘앙스를 함께 살려 ‘사악한’으로 옮겼습니다.
- source_word: הַנֹּגְעִים בַּנַּחֲלָה
  english_pob_choice: who touch the inheritance
  chosen_korean: 기업을 건드리는
  alternatives_korean:
  - 기업에 손대는
  - 기업을 침범하는
  lexicon: HALOT
  rationale: נגע의 문자적 ‘touch’를 살리면서, 문맥상 침해·간섭의 의미가 드러나도록 ‘건드리다’로 옮겼습니다.
- source_word: אֲשֶׁר הִנְחַלְתִּי אֶת עַמִּי אֶת יִשְׂרָאֵל
  english_pob_choice: that I caused my people Israel to inherit
  chosen_korean: 내 백성 이스라엘에게 유산으로 준
  alternatives_korean:
  - 내 백성 이스라엘에게 기업으로 준
  - 내 백성 이스라엘에게 상속시킨
  lexicon: HALOT
  rationale: נחל의 사역형을 한국어 ‘유산으로 주다’로 풀어, ‘기업/유산’의 연결을 자연스럽게 유지했습니다.
- source_word: נֹתְשָׁם / אֶתּוֹשׁ
  english_pob_choice: I am about to uproot them / I will uproot
  chosen_korean: 뽑아내려 한다 / 뽑아내겠습니다
  alternatives_korean:
  - 뿌리째 뽑으려 합니다
  - 뽑아버리겠습니다
  lexicon: HALOT
  rationale: 예레미야에 반복되는 נתש의 심판 이미지를 ‘뽑아내다’로 옮겨 식물적 폭력성과 제거의 뉘앙스를 유지했습니다.
