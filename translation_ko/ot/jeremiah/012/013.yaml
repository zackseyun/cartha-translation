    reason: alternative_reading
  revision_rationale: 수정문은 히브리어의 농경 비유와 인칭 전환을 유지하면서, 마지막 절의 두 מִן 구문의 관계를 자연스러운 한국어로 드러냅니다. 명령형은 요청된 합쇼체에 맞추어 ‘부끄러워하십시오’로 옮겼고, 주석은 וּבֹשׁוּ의 예고적 독법을 제시하되 야훼의 진노라는 원문 요소를 빠뜨리지 않도록 보완했습니다.
