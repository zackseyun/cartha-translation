revisions:
- from: '그들은 밀을 뿌렸으나 가시를 거두었습니다. 그들은 기진맥진했으나 아무 유익도 얻지 못했습니다. 너희는 너희의 소출 때문에, 야훼의 타오르는 진노 때문에 부끄러워하라.\n주석 [a]: 또는, 「너희는 너희의 추수 때문에 부끄러워할 것이다」로도 옮길 수 있습니다. 이 경우 וּבֹשׁוּ를 명령이 아니라 예고적 미래로 봅니다.'
  to: 그들은 밀을 뿌렸으나 가시를 거두었습니다. 그들은 지쳤으나 아무 유익도 얻지 못했습니다. 너희는 너희의 소출을 부끄러워하십시오. 이는 야훼의 타오르는 진노 때문입니다.[a]
  rationale: 수정문은 히브리어의 농경 비유와 인칭 전환을 유지하면서, 마지막 절의 두 מִן 구문의 관계를 자연스러운 한국어로 드러냅니다. 명령형은 요청된 합쇼체에 맞추어 ‘부끄러워하십시오’로 옮겼고, 주석은 וּבֹשׁוּ의 예고적 독법을 제시하되 야훼의 진노라는 원문 요소를 빠뜨리지 않도록 보완했습니다.
