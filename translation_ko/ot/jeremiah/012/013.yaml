review_pass:
  verdict: revise
  source_fidelity: The agricultural contrast and the shift from third-person description to a second-person plural imperative are retained. However, the final clause should more clearly distinguish shame regarding the people's produce from the causal force of Yahweh's burning anger. The alternate-reading footnote must also retain the full causal phrase found in the verse.
  naturalness: ‘기진맥진했으나’ is somewhat colloquial and overly vivid for this prophetic register. ‘지쳤으나’ is natural, restrained modern Korean. The repeated ‘때문에’ in the final sentence is awkward; recasting it as an object of shame followed by the reason is clearer. ‘부끄러워하십시오’ consistently uses the requested modern formal-polite 합쇼체.
  terminology: ‘밀,’ ‘가시,’ ‘소출,’ ‘진노,’ and ‘야훼’ are appropriate. ‘야훼의 타오르는 진노’ adequately represents חֲרוֹן אַף יְהוָה without weakening its burning imagery.
  issues:
  - severity: medium
    issue: 'The final sentence uses two consecutive causal phrases: ‘너희의 소출 때문에, 야훼의 타오르는 진노 때문에.’'
    rationale: This is awkward Korean and blurs the distinct syntactic roles of מִתְּבוּאֹתֵיכֶם and מֵחֲרוֹן אַף יְהוָה. The people are to be ashamed regarding/of their produce, because of Yahweh’s burning anger.
  - severity: medium
    issue: The alternate-reading footnote omits ‘야훼의 타오르는 진노 때문에.’
    rationale: The footnote presents an alternative construal of וּבֹשׁוּ, not an abbreviated alternative clause. It should preserve the remainder of the source clause.
  - severity: low
    issue: ‘기진맥진했으나’ is stylistically colloquial and stronger than necessary.
    rationale: A restrained expression such as ‘지쳤으나’ better suits formal prophetic prose while conveying the contextual sense of נֶחְלוּ.
  revised_text: 그들은 밀을 뿌렸으나 가시를 거두었습니다. 그들은 지쳤으나 아무 유익도 얻지 못했습니다. 너희는 너희의 소출을 부끄러워하십시오. 이는 야훼의 타오르는 진노 때문입니다.[a]
