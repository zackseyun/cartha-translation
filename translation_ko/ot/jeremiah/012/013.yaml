source:
  edition: WLC
  text: זָרְע֤וּ חִטִּים֙ וְ/קֹצִ֣ים קָצָ֔רוּ נֶחְל֖וּ לֹ֣א יוֹעִ֑לוּ וּ/בֹ֨שׁוּ֙ מִ/תְּבוּאֹ֣תֵי/כֶ֔ם מֵ/חֲר֖וֹן אַף יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/013.yaml
  text: They have sown wheat[a], but they have reaped thorns; they have exhausted themselves, but they profit nothing. Be ashamed of your produce because of the burning anger of Yahweh.
  footnotes:
  - marker: a
    text: Or, 'and you will be ashamed of your harvests,' if וּבֹשׁוּ is taken as predictive rather than imperative.
    reason: alternative_reading
translation:
  language: ko
  text: '그들은 밀을 뿌렸으나 가시를 거두었습니다. 그들은 기진맥진했으나 아무 유익도 얻지 못했습니다. 너희는 너희의 소출 때문에, 야훼의 타오르는 진노 때문에 부끄러워하라.\n주석 [a]: 또는, 「너희는 너희의 추수 때문에 부끄러워할 것이다」로도 옮길 수 있습니다. 이 경우 וּבֹשׁוּ를 명령이 아니라 예고적 미래로 봅니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「너희는 너희의 추수 때문에 부끄러워할 것이다」로도 옮길 수 있습니다. 이 경우 וּבֹשׁוּ를 명령이 아니라 예고적 미래로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: זָרְעוּ חִטִּים
  english_pob_choice: they have sown wheat
  chosen_korean: 그들은 밀을 뿌렸으나
  alternatives_korean:
  - 그들은 곡식을 뿌렸으나
  lexicon: HALOT
  rationale: זרע는 ‘뿌리다/파종하다’이고, חִטִּים은 구체적으로 ‘밀’이므로, 일반화하지 않고 농경 대조를 살렸습니다.
- source_word: וְקֹצִים קָצָרוּ
  english_pob_choice: but they have reaped thorns
  chosen_korean: 가시를 거두었습니다
  alternatives_korean:
  - 가시덤불을 거두었습니다
  - 엉겅퀴를 거두었습니다
  lexicon: HALOT
  rationale: קֹצִים는 ‘가시들’로, 앞의 ‘밀’과 대비되는 무익한 수확을 드러내기 위해 자연스러운 한국어 동사 ‘거두다’를 사용했습니다.
- source_word: נֶחְלוּ לֹא יוֹעִלוּ
  english_pob_choice: they have exhausted themselves, but they profit nothing
  chosen_korean: 그들은 기진맥진했으나 아무 유익도 얻지 못했습니다
  alternatives_korean:
  - 그들은 지쳐버렸으나 아무 소용이 없었습니다
  - 그들은 쇠약해졌으나 아무 유익도 없었습니다
  lexicon: HALOT
  rationale: נחל의 니팔은 여기서 ‘지치다/쇠약해지다’의 의미가 문맥상 적절하며, יוֹעִלּוּ는 ‘유익하다/도움이 되다’의 뜻이므로 결과의 무익함을 분명히 했습니다.
- source_word: תְּבוּאֹתֵיכֶם
  english_pob_choice: your produce
  chosen_korean: 너희의 소출
  alternatives_korean:
  - 너희의 추수
  - 너희의 수확물
  lexicon: HALOT
  rationale: תְּבוּאָה는 ‘산출물/소출/수확’의 폭이 있어, 시적 문맥에서 간결하고 포괄적인 ‘소출’이 적절합니다.
- source_word: חֲרוֹן אַף יְהוָה
  english_pob_choice: the burning anger of Yahweh
  chosen_korean: 야훼의 타오르는 진노
  alternatives_korean:
  - 야훼의 불타는 분노
  - 야훼의 격렬한 진노
  lexicon: HALOT
  rationale: חֲרוֹן אַף는 문자적으로 ‘코/분노의 불붙음’에 가까워, 단순한 ‘진노’보다 불타는 이미지를 살리는 표현을 택했습니다. יְהוָה는 고유명사로 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와 대체 번역 문제
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 음역합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 단락은 신명기적 예언 문맥에서 하나님의 고유명을 직접 사용하므로, 전통적 대체어보다 본문이 드러내는 언약적 이름을 보존하는 편이 더 source-direct합니다.
  doctrine_reference: 'POB translation standard: YHWH → 야훼'
- issue: וּבֹשׁוּ의 문법적 독법
  chosen_reading: ‘너희는 … 부끄러워하라’라는 직접 명령으로 읽었습니다.
  alternative_readings:
  - ‘너희는 … 부끄러워할 것이다’라는 예고적 미래
  - ‘그들은 … 부끄러워했다’라는 서술
  rationale: 문맥의 2인칭 소유격 ‘너희의’와 대응하며, 예언적 책망의 급격한 직접 호소를 살려 줍니다. 다만 형태론적 모호성은 주석으로 남겼습니다.
  doctrine_reference: Prophetic discourse; grammatical ambiguity
