id: JER.12.9
reference: Jeremiah 12:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/עַ֨יִט צָב֤וּעַ נַחֲלָתִ/י֙ לִ֔/י הַ/עַ֖יִט סָבִ֣יב עָלֶ֑י/הָ לְכ֗וּ אִסְפ֛וּ כָּל חַיַּ֥ת הַ/שָּׂדֶ֖ה הֵתָ֥יוּ לְ/אָכְלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/009.yaml
  text: Is my inheritance to me a speckled bird of prey? Are the birds of prey against her all around? Go[a], gather all the beasts of the field[b]; bring them to devour.
  footnotes:
  - marker: a
    text: Or 'hyena.' Some interpreters take the repeated Hebrew word עַיִט here in connection with a predator such as a hyena, yielding a sense like 'Is my inheritance to me like a speckled hyena?' The main text follows the more common sense 'bird of prey.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'Is my inheritance to me a speckled bird of prey? the bird of prey around her.' The singular 'bird of prey' may function collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 기업이 내게 얼룩진 맹금새입니까? 사방에 맹금새가 그를 치고 있습니까? 가서 들짐승들을 모두 모으고, 먹어치우게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하이에나’. 일부 해석자는 여기의 עַיִט을 포식 조류가 아니라 하이에나 같은 포식자로 이해하여, ‘내 기업이 내게 얼룩진 하이에나입니까?’와 비슷한 뜻으로 봅니다. 본문은 더 일반적인 ‘맹금새’ 뜻을 따릅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 기업이 내게 얼룩진 맹금새입니까? 맹금새가 그녀 주위에(against/around her) 있습니까?’에 가깝습니다. 단수형 ‘맹금새’는 집합적으로 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַיִט
  english_pob_choice: bird of prey
  chosen_korean: 맹금새
  alternatives_korean:
  - 독수리
  - 새매
  - 사냥새
  lexicon: HALOT
  rationale: עַיִט의 기본적 포식 조류 이미지를 살리기 위해 포괄적이고 현대적인 ‘맹금새’를 택했습니다. 특정 종으로 좁히지 않아 원문의 비유성을 보존합니다.
- source_word: צָבוּעַ
  english_pob_choice: speckled
  chosen_korean: 얼룩진
  alternatives_korean:
  - 점박이의
  - 얼룩무늬의
  - 얼룩덜룩한
  lexicon: HALOT
  rationale: 색채·무늬가 섞인 상태를 가리키므로, ‘얼룩진’이 가장 자연스럽게 그 이질적인 표지를 드러냅니다.
- source_word: נַחֲלָתִי
  english_pob_choice: my inheritance
  chosen_korean: 내 기업
  alternatives_korean:
  - 내 상속분
  - 내 유업
  - 내 소유
  lexicon: HALOT
  rationale: נַחֲלָה는 언약적 소유 개념을 포함하므로, 한국어 성경에서 익숙하면서도 단순 소유보다 더 강한 ‘기업’이 적절합니다. 다만 문맥의 대상은 해석을 열어 두어 구체화하지 않았습니다.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  english_pob_choice: all the beasts of the field
  chosen_korean: 들짐승들을 모두
  alternatives_korean:
  - 들판의 모든 짐승들을
  - 모든 들짐승을
  - 들의 짐승들을 모두
  lexicon: HALOT
  rationale: 관용적 표현을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘들짐승들’을 사용했습니다. 원문의 집합적 소집 명령도 유지됩니다.
- source_word: הֵתָיוּ לְאָכְלָה
  english_pob_choice: bring them to devour
  chosen_korean: 먹어치우게 하십시오
  alternatives_korean:
  - 잡아먹게 하십시오
  - 삼키게 하십시오
  - 먹도록 데려오십시오
  lexicon: HALOT
  rationale: 단순한 ‘먹다’보다 포식의 폭력성과 종결성을 드러내기 위해 결과 목적을 나타내는 ‘먹어치우게 하십시오’를 택했습니다.
theological_decisions:
- issue: ‘내 기업’의 지시 대상
  chosen_reading: 번역문에서는 지시 대상을 ‘내 기업’으로 유지하고, 유다·예루살렘·땅·백성 가운데 하나로 좁히지 않았습니다.
  alternative_readings:
  - 유다
  - 예루살렘
  - 그 땅
  - 언약 백성
  rationale: 히브리어 자체가 즉시 문맥에서 지시 대상을 명시하지 않으므로, 해석을 본문 밖에서 앞서 결정하지 않고 열린 상태를 보존했습니다.
  doctrine_reference: 본문의 해석적 긴장 보존
