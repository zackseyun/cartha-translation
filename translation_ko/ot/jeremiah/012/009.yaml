theological_decisions:
- issue: ‘내 기업’의 지시 대상
  chosen_reading: 번역문에서는 지시 대상을 ‘내 기업’으로 유지하고, 유다·예루살렘·땅·백성 가운데 하나로 좁히지 않았습니다.
  alternative_readings:
  - 유다
  - 예루살렘
  - 그 땅
  - 언약 백성
  rationale: 히브리어 자체가 즉시 문맥에서 지시 대상을 명시하지 않으므로, 해석을 본문 밖에서 앞서 결정하지 않고 열린 상태를 보존했습니다.
  doctrine_reference: 본문의 해석적 긴장 보존
