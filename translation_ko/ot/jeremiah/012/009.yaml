- from: 내 기업이 내게 얼룩진 맹금새입니까? 사방에 맹금새가 그를 치고 있습니까? 가서 들짐승들을 모두 모으고, 먹어치우게 하십시오.[a][b]
  to: 내 기업이 내게 얼룩진 맹금[a]입니까? 사방에서 맹금들이 그것을 에워싸고 있습니까?[b] 가서 들의 모든 짐승을 모아, 그것을 먹게 하십시오.
  rationale: 원문의 비유적 동물상을 유지하면서, 두 번째 절에 없는 ‘치다’를 제거하고 포위·대적의 의미를 ‘에워싸다’로 옮겼습니다. ‘그녀’라는 히브리어 여성 대명사는 한국어에서 성별을 부과하지 않는 ‘그것’으로 받아 ‘내 기업’의 지시 대상에 관한 원문의 열림을 보존했습니다. 용어와 각주 표지도 현대 표준어 및 각주 범위에 맞게 정리했습니다.
  reviewer_model: gpt-5.6-terra
