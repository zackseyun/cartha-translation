source:
  edition: WLC
  text: עַֽל כָּל שְׁפָיִ֣ם בַּ/מִּדְבָּ֗ר בָּ֚אוּ שֹֽׁדְדִ֔ים כִּ֣י חֶ֤רֶב לַֽ/יהוָה֙ אֹֽכְלָ֔ה מִ/קְצֵה אֶ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ אֵ֥ין שָׁל֖וֹם לְ/כָל בָּשָֽׂר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/012.yaml
  text: Upon all the bare heights in the wilderness destroyers have come[a], for the sword of Yahweh is devouring from one end of the land to the other end of the land[c][b]; there is no peace for any flesh.
  footnotes:
  - marker: a
    text: Or 'bare hills' or 'treeless heights.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from one end of the earth to the other end of the earth.' Hebrew אֶרֶץ can mean 'land' or 'earth.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'for any flesh,' an idiom for all living people or creatures.
    reason: lexical_alternative
translation:
  language: ko
  text: 광야의 모든 민둥한 산등성이에 약탈자들이 들이닥쳤습니다[a]. 야훼의 칼이 땅 끝에서 땅 끝까지 삼키고 있기 때문입니다[b]. 어느 누구에게도 평화가 없습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민둥한 산등성이’는 ‘민둥한 언덕’ 또는 ‘나무가 없는 높은 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֶרֶץ는 문맥상 ‘땅’으로 옮겼습니다. ‘세상’ 또는 ‘온 땅’으로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘모든 육체에게’입니다. 히브리어 관용구로, 모든 사람 또는 모든 살아 있는 존재를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָיִם
  english_pob_choice: bare heights
  chosen_korean: 민둥한 산등성이
  alternatives_korean:
  - 민둥한 언덕
  - 나무 없는 높은 곳
  - 헐벗은 산봉우리
  lexicon: HALOT
  rationale: 노출된 높다란 지형이라는 이미지를 살리되, 단순한 지리 묘사가 아니라 시적 풍경으로 읽히도록 한국어로 자연스럽게 옮겼습니다.
- source_word: שֹׁדְדִים
  english_pob_choice: destroyers
  chosen_korean: 파괴자들
  alternatives_korean:
  - 약탈자들
  - 훼손자들
  - 멸망시키는 자들
  lexicon: HALOT
  rationale: 문맥상 단순 약탈보다 파괴와 황폐화를 함께 가리키므로, 군사적 파괴의 뉘앙스를 담는 표현을 선택했습니다.
- source_word: חֶרֶב לַיהוָה
  english_pob_choice: the sword of Yahweh
  chosen_korean: 야훼의 칼
  alternatives_korean:
  - 야훼의 검
  - 야훼께 속한 칼
  - 주님의 칼
  lexicon: HALOT
  rationale: 신적 심판의 도구라는 소유·기원의 관계를 직접 살리기 위해 ‘야훼의 칼’로 옮겼습니다.
- source_word: מִקְצֵה אֶרֶץ וְעַד קְצֵה הָאָרֶץ
  english_pob_choice: from one end of the land to the other end of the land
  chosen_korean: 이 땅 끝에서 저 땅 끝까지
  alternatives_korean:
  - 땅 끝에서 땅 끝까지
  - 이 땅의 끝에서 저 땅의 끝까지
  - 온 땅 끝에서 또 다른 끝까지
  lexicon: HALOT
  rationale: ‘땅/land’의 지역적 범위를 유지하면서 히브리어의 반복 구조를 한국어에서도 되살렸습니다.
- source_word: בָּשָׂר
  english_pob_choice: any flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 모든 생명체
  - 아무 육체도
  lexicon: HALOT
  rationale: 히브리어 관용구를 완화하지 않고 보존하되, 한국어 독자가 이해할 수 있도록 넓은 인간성/생명 전체의 뜻을 살렸습니다.
theological_decisions:
- issue: יהוה(여호와/주님) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 신명기적 예언 문맥에서 하나님의 언약 이름을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: אֶרֶץ의 범위
  chosen_reading: 이 땅
  alternative_readings:
  - 온 땅
  - 세상
  rationale: 예레미야 12장의 심판 문맥에서는 보편적 우주보다 유다의 황폐한 영토를 가리키는 것이 더 적합하므로, 지역적 범위를 유지했습니다.
  doctrine_reference: translation philosophy § original-language primacy
