revisions:
- from: 광야의 모든 민둥한 산등성이 위로 파괴자들이 왔습니다. 야훼의 칼이 이 땅 끝에서 저 땅 끝까지 삼키고 있으니[a][b], 모든 육체에게는 평강이 없습니다[c].
  to: 광야의 모든 민둥한 산등성이에 약탈자들이 들이닥쳤습니다[a]. 야훼의 칼이 땅 끝에서 땅 끝까지 삼키고 있기 때문입니다[b]. 어느 누구에게도 평화가 없습니다[c].
  rationale: 수정은 원문의 의미를 바꾸지 않고, 침략자라는 שֹׁדְדִים의 어휘적 뉘앙스, אֶרֶץ 반복의 표현, בָּשָׂר의 관용적 범위를 더 정확히 반영했습니다. 문장 연결의 כִּי는 ‘~하기 때문입니다’로 명시하여 한국어 합쇼체 문장으로 자연스럽게 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:28Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 공간 표현(‘광야의 모든 벌거벗은 높은 곳’)과 야훼의 칼이 땅의 한 끝에서 다른 끝까지 삼키는 심판 이미지는 대체로 충실합니다. 다만 שֹׁדְדִים는 단순한 일반적 ‘파괴자’보다 침략하여 약탈하고 황폐하게 하는 자들을 가리키므로 ‘약탈자들’이 더 직접적입니다. 또한 ‘이 땅 끝에서 저 땅 끝까지’는 원문에 없는 지시성을 더하므로 반복을 유지한 ‘땅 끝에서 땅 끝까지’가 안전합니다.
  naturalness: ‘광야의 모든 민둥한 산등성이 위로 … 왔습니다’보다 장소를 나타내는 ‘…에 … 들이닥쳤습니다’가 현대 한국어에서 자연스럽고 침입·침탈의 문맥을 잘 드러냅니다. ‘모든 육체에게는 평강’은 직역투이므로, 원문의 관용구를 본문에서는 자연스럽게 ‘어느 누구에게도 평화’로 옮기고 각주에서 직역과 포괄 범위를 밝혔습니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. חֶרֶב는 문맥상 ‘칼’로, שָׁלוֹם은 전쟁 심판 문맥에 맞게 ‘평화’로 옮겼습니다. אֶרֶץ는 문맥상 ‘땅’을 유지하되, ‘세상/온 땅’ 가능성은 각주로 보존했습니다.
  issues:
  - severity: medium
    issue: שֹׁדְדִים를 ‘파괴자들’로 번역함
    rationale: ‘파괴자’도 가능한 범주이나, 이 분사는 침략·약탈·황폐화의 행위자를 뜻합니다. ‘약탈자들’이 어휘의 중심 의미와 예언서의 전쟁 문맥을 더 잘 반영합니다.
  - severity: low
    issue: ‘이 땅 끝에서 저 땅 끝까지’가 원문에 없는 지시성을 도입함
    rationale: 원문은 אֶרֶץ/הָאָרֶץ를 반복하여 ‘땅의 한 끝에서 그 끝까지’를 강조합니다. 한국어에서는 ‘땅 끝에서 땅 끝까지’가 불필요한 지시어 없이 이 반복과 범위를 보존합니다.
  - severity: medium
    issue: 각주 c가 בָּשָׂר의 범위를 ‘모든 사람’으로만 한정함
    rationale: ‘모든 육체’는 모든 사람을 주로 가리킬 수 있으나, 문맥과 관용상 모든 살아 있는 존재까지 포괄할 여지도 있습니다. 각주는 이 범위를 한정하지 않아야 합니다.
