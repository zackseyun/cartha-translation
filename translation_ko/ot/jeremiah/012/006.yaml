  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 קָרְאוּ אַחֲרֶיךָ מָלֵא는 ‘뒤로’보다 ‘뒤에서/뒤따라’가 자연스럽고, 공개적 적대나 추격은 가능한 함의일 뿐 본문에 단정적으로 넣지 않는 편이 좋습니다.
  naturalness: 초안의 마지막 문장 ‘그들이 당신에게 좋은 말을 할지라도.’는 종결되지 않은 종속절이므로 반드시 주절에 연결해야 합니다. ‘아버지의 집안’과 ‘당신 뒤에서’는 현대 표준 한국어에서 더 자연스럽습니다.
  terminology: ‘형제들’, ‘아버지의 집안’, ‘배신했습니다’, ‘믿지 마십시오’는 적절합니다. 원문의 남성 복수 표지를 설명하는 주석은 가능하나, 해당 표지가 있는 ‘형제들’에 붙여야 합니다.
  issues:
  - severity: medium
    issue: 마지막 문장이 미완성 종속절입니다.
    rationale: ‘-ㄹ지라도’는 뒤따르는 주절을 요구합니다. 금지 명령문과 결합하여 ‘좋은 말을 하더라도 그들을 믿지 마십시오’로 해야 합니다.
  - severity: medium
    issue: 각주 표지가 설명 대상과 일치하지 않습니다.
    rationale: a는 ‘큰 소리로 외쳤습니다’의 대안적 이해를 설명하지만 ‘배신했습니다’에 붙어 있고, b는 ‘형제들’의 문법적 성을 설명하지만 ‘믿지 마십시오’에 붙어 있습니다.
  - severity: low
    issue: ‘당신 뒤로’는 해당 히브리어 전치사구의 한국어 표현으로 다소 부자연스럽습니다.
    rationale: ‘당신 뒤에서’는 위치를, ‘당신을 뒤따라’는 추격의 뉘앙스를 더 강하게 냅니다. 본문의 모호성을 보존하려면 ‘당신 뒤에서’가 안전합니다.
  revised_text: 당신의 형제들과 아버지의 집안도, 그들 역시 당신을 배신했습니다. 그들마저 당신 뒤에서 큰 소리로 외쳤습니다[a]. 그들이 당신에게 좋은 말을 하더라도 그들을 믿지 마십시오.
  revised_footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘당신 뒤에서/뒤따라 온 목소리로 외쳤다’는 뜻으로도 이해될 수 있습니다. 이는 공개적인 비난이나 추격을 암시할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘형제들’은 문법적으로 남성 복수형입니다. 문맥상 예레미야의 가까운 남성 친족을 가리키며, ‘아버지의 집안’은 더 넓은 가문을 가리킵니다.
    reason: cultural_note
  revision_rationale: 미완성 종속절을 금지 명령문에 연결하고, 원문의 강조를 ‘그들 역시/그들마저’로 유지했습니다. 또한 각주를 실제 설명 대상인 ‘외쳤습니다’와 ‘형제들’에 각각 연결하도록 표지를 재배치했습니다. ‘뒤에서’는 원문의 방향·위치 표현을 보존하면서 추격이라는 해석을 본문에 과도하게 확정하지 않습니다.
