id: JER.12.6
reference: Jeremiah 12:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֧י גַם אַחֶ֣י/ךָ וּ/בֵית אָבִ֗י/ךָ גַּם הֵ֨מָּה֙ בָּ֣גְדוּ בָ֔/ךְ גַּם הֵ֛מָּה קָרְא֥וּ אַחֲרֶ֖י/ךָ מָלֵ֑א אַל תַּאֲמֵ֣ן בָּ֔/ם כִּֽי יְדַבְּר֥וּ אֵלֶ֖י/ךָ טוֹבֽוֹת־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/006.yaml
  text: For even your brothers and your father’s house—even they have dealt treacherously with you[a]; even they have called out loudly after you. Do not trust them[b], though they speak good things to you.
  footnotes:
  - marker: a
    text: Or 'have called after you at full voice,' possibly implying a hostile public outcry or pursuit.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your brothers' is grammatically masculine; in context it refers to Jeremiah’s close male kin, alongside 'your father’s house' for the wider household.
    reason: cultural_note
translation:
  language: ko
  text: 당신의 형제들과 당신의 아버지 집도—그들조차도 당신에게 배신했습니다[a]. 그들조차도 당신 뒤로 큰 소리로 외쳤습니다. 그들을 믿지 마십시오[b]. 그들이 당신에게 좋은 말을 할지라도.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신 뒤로 큰 소리로 외쳤습니다’는 ‘당신 뒤에서 온전히/크게 외쳤다’는 뜻도 될 수 있으며, 공개적 비난이나 추격을 암시할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘형제들’은 문법적으로 남성형이며, 문맥상 예레미야의 가까운 남성 친족을 가리키고, ‘아버지 집’은 더 넓은 가문을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֶיךָ
  english_pob_choice: your brothers
  chosen_korean: 당신의 형제들
  alternatives_korean:
  - 당신의 친족들
  - 당신의 형제자매들
  lexicon: HALOT
  rationale: 히브리어 אָח의 남성 복수형을 반영해 직역에 가까운 ‘형제들’을 유지했습니다. 원문의 성별 표지를 지우지 않으면서도 한국어에서 자연스럽습니다.
- source_word: וּבֵית אָבִיךָ
  english_pob_choice: and your father’s house
  chosen_korean: 당신의 아버지 집
  alternatives_korean:
  - 당신의 가족
  - 당신의 부계 가문
  lexicon: HALOT
  rationale: 가족보다 히브리어 관용구의 사회적·가문적 힘을 살리기 위해 ‘아버지 집’을 보존했습니다.
- source_word: בָּגְדוּ בָךְ
  english_pob_choice: have dealt treacherously with you
  chosen_korean: 배신했습니다
  alternatives_korean:
  - 간악하게 행했습니다
  - 불충했습니다
  lexicon: HALOT
  rationale: בגד의 핵심 의미인 배신·불충을 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다. 예언서 문맥의 도덕적 무게도 유지됩니다.
- source_word: קָרְאוּ אַחֲרֶיךָ מָלֵא
  english_pob_choice: have called out loudly after you
  chosen_korean: 당신 뒤로 큰 소리로 외쳤습니다
  alternatives_korean:
  - 당신 뒤에서 온전히 외쳤습니다
  - 당신을 뒤따라 큰 소리로 불렀습니다
  lexicon: HALOT
  rationale: אַחֲרֵי와 מָלֵא의 결합은 단순한 부름보다 뒤를 따라가는 공개적·공격적 외침을 시사합니다. ‘당신 뒤로 큰 소리로 외쳤습니다’가 그 긴장을 가장 잘 보존합니다.
- source_word: אַל תַּאֲמֵן בָּם
  english_pob_choice: Do not trust them
  chosen_korean: 그들을 믿지 마십시오
  alternatives_korean:
  - 그들을 신뢰하지 마십시오
  - 그들을 의지하지 마십시오
  lexicon: HALOT
  rationale: האמין의 히필은 ‘믿다/신뢰하다’의 뜻이므로, 경고의 직접성을 살려 한국어에서도 가장 표준적인 ‘믿지 마십시오’를 사용했습니다.
theological_decisions:
- issue: 주어의 배신과 경고의 수사적 강도
  chosen_reading: 원문은 가족 내부의 배신과 공개적 뒤따름/외침을 겹쳐, 예레미야에 대한 사회적 고립을 강조합니다.
  alternative_readings:
  - 단순히 ‘돌아서서 불렀다’로 완화하는 읽기
  - 가족 갈등의 심리적 상처만 강조하는 읽기
  rationale: 히브리어 동사 בגד와 קרא + אַחֲרֵי + מָלֵא의 결합은 관계 파탄과 공적 압박을 동시에 드러내므로, 이를 약화하지 않고 유지했습니다.
  doctrine_reference: 예언자적 소명과 공동체적 배척에 대한 본문 문맥
- issue: 문장 종결의 양식
  chosen_reading: 직설적 금지 ‘그들을 믿지 마십시오’로 마무리해 예언자적 경고의 힘을 보존했습니다.
  alternative_readings:
  - 부드러운 권면형 표현
  - 완곡한 추측형 표현
  rationale: אַל תַּאֲמֵן은 명령형 금지로 이해하는 것이 자연스러우며, 한국어에서도 합쇼체 명령으로 옮기는 편이 본문의 경고성을 잘 전달합니다.
  doctrine_reference: 본문의 예언자적 권면/경고 형식
