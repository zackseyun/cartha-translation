id: JER.12.17
reference: Jeremiah 12:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/017.yaml
  text: But if they do not listen[a], then I will uproot that nation, uprooting and destroying it, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'But if they do not obey.' The Hebrew verb can mean both 'listen' and 'obey' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 듣지 않으면, 내가 그 민족을 반드시 뿌리째 뽑아 멸하겠습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 순종하지 않으면’. 히브리어 동사 שׁמע는 문맥에 따라 ‘듣다’와 ‘순종하다’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  english_pob_choice: But if
  chosen_korean: 그들이 듣지 않으면
  alternatives_korean:
  - 그러나 만일
  - 만일
  lexicon: HALOT
  rationale: 앞 절과 이어지는 조건적 대비를 한국어에서는 자연스럽게 조건절로 풀어, 불필요한 접속어를 줄이면서도 대비 관계를 유지했습니다.
- source_word: לֹא יִשְׁמָעוּ
  english_pob_choice: they do not listen
  chosen_korean: 듣지 않으면
  alternatives_korean:
  - 순종하지 않으면
  - 들어주지 않으면
  lexicon: HALOT
  rationale: שׁמע의 기본 뜻인 ‘듣다’를 살리되, 문맥상 포함되는 ‘순종’의 뉘앙스가 자연스럽게 따라오도록 했습니다.
- source_word: וְנָתַשְׁתִּי
  english_pob_choice: I will uproot
  chosen_korean: 뽑아버리고
  alternatives_korean:
  - 뿌리째 뽑고
  - 뽑아내고
  lexicon: HALOT
  rationale: 예레미야서의 심판 표지 동사인 נתשׁ의 강한 농경적 이미지를 살려, 단순한 ‘없애다’보다 ‘뽑아버리다’로 옮겼습니다.
- source_word: נָתוֹשׁ וְאַבֵּד
  english_pob_choice: uprooting and destroying it
  chosen_korean: 뽑아버리고 멸하겠습니다
  alternatives_korean:
  - 철저히 뽑아버리고 없애겠습니다
  - 뽑아버리고 멸망시키겠습니다
  lexicon: HALOT
  rationale: 히브리어의 동사 반복과 강조를 한국어에서는 중복 어간으로 직역하기보다, 두 번째 동사 אבד의 파괴적 결과를 ‘멸하다’로 간결하게 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה는 한국어 예언문에서 자연스러운 종결 공식인 ‘…의 말씀입니다’로 옮기되, 신명은 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: 신적 선언문의 종결 방식
  chosen_reading: ‘야훼의 말씀입니다’로 마무리하여 예언적 권위를 유지했습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 선언입니다’
  rationale: נְאֻם יְהוָה는 단순 정보 전달이 아니라 선포 형식이므로, 한국어에서도 예언적 공적 선언의 어조를 분명히 드러냈습니다.
  doctrine_reference: 예언문 공식 נְאֻם יְהוָה
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명사 표기는 프로젝트 기본 원칙에 따라 대체 칭호가 아닌 고유명 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
