- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시 편집 기준상 고유명은 야훼가 기본이지만, 이 구절의 한국어 본문은 직접 호칭의 자연스러움을 위해 ‘주님’으로 옮겼습니다. 다만 본문 내 음성은 여전히 YHWH에게 직접 말하는 것으로 유지했습니다.
- source_word: מִשְׁפָּטִים
  english_pob_choice: matters of justice
  chosen_korean: 의의 문제들
  alternatives_korean:
  - 판결들
  - 재판 문제들
  - 공의의 일들
  lexicon: HALOT
  rationale: 복수형 מִשְׁפָּטִים은 단순한 개별 판결보다 ‘의/재판에 관한 사안들’을 가리키므로, 법정적 뉘앙스와 윤리적 문제를 함께 살려 옮겼습니다.
- source_word: בֹּגְדֵי בָגֶד
  english_pob_choice: who deal treacherously
  chosen_korean: 배신자들
  alternatives_korean:
  - 간사한 자들
  - 극도로 배신하는 자들
  - 패역한 자들
  lexicon: HALOT
  rationale: 중첩 표현이 treachery의 강도를 높이지만, 한국어에서는 과도한 직역보다 의미 중심으로 ‘배신자들’이 응축된 배신의 성격을 잘 드러냅니다.
theological_decisions:
- issue: 예레미야의 항변 어조(כִּי אָרִיב אֵלֶיךָ)
  chosen_reading: ‘제가 당신께 소송을 제기할 때에도’로 법정적 항변을 살리되, 존칭 호칭을 유지해 경외를 보존했습니다.
  alternative_readings:
  - ‘제가 당신과 다툴 때에도’
  - ‘제가 당신께 변론할 때에도’
  rationale: 본문은 하나님의 의를 인정하면서도 정의의 문제를 제기하는 긴장을 담고 있으므로, 대립적 감정보다 법정적 호소를 중심으로 번역해야 합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
