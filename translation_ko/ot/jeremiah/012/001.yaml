source:
  edition: WLC
  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
  footnotes:
  - marker: a
    text: Or, 'though I contend with you'; the Hebrew verb can carry the sense of contending or pleading a legal case.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'judgments' or 'justice'; the plural likely refers to matters or cases concerning justice.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'all the treacherous of treachery,' an intensified expression for those who act very treacherously.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 제가 주님께 소송을 제기할 때에도[a] 주님은 의로우십니다. 그러나 저는 주님께 공의에 관한 문제들을 말씀드리고자 합니다[b]. 어찌하여 악한 자들의 길은 형통합니까? 어찌하여 배신을 일삼는 자들은 모두 편안히 지냅니까[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 주님과 다툴 때에도’로 옮길 수 있습니다. 히브리어 동사는 다투다, 변론하다, 또는 법적 소송을 제기하다는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘판결들’ 또는 ‘정의’를 뜻합니다. 복수형은 정의나 재판에 관한 사안들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘배신의 배신자들’에 가까운 강조 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
