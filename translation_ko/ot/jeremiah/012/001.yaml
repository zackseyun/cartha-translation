id: JER.12.1
reference: Jeremiah 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
  footnotes:
  - marker: a
    text: Or, 'though I contend with you'; the Hebrew verb can carry the sense of contending or pleading a legal case.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'judgments' or 'justice'; the plural likely refers to matters or cases concerning justice.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'all the treacherous of treachery,' an intensified expression for those who act very treacherously.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 당신은 의로우십니다[a]. 제가 당신께 소송을 제기할 때에도[b], 제가 당신과 의의 문제들에 관해 말하고자 합니다. 악한 자들의 길이 왜 형통합니까? 왜 배신자들[c]은 모두 편안합니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 당신과 소송을 벌일 때에도’로도 옮길 수 있습니다. 히브리어 동사는 다투다/변론하다/법적 소송을 제기하다의 뜻을 함께 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 복수형은 ‘판결들’보다 ‘의와 재판에 관한 사안들’의 뜻에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘배신의 배신자들’에 가까운 강조 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로우십니다
  alternatives_korean:
  - 의롭습니다
  - 의로우신 분이십니다
  lexicon: HALOT
  rationale: 하나님의 언약적·도덕적 올바름을 드러내기 위해 ‘의롭다’보다 서술형으로 자연스러운 ‘의로우십니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시 편집 기준상 고유명은 야훼가 기본이지만, 이 구절의 한국어 본문은 직접 호칭의 자연스러움을 위해 ‘주님’으로 옮겼습니다. 다만 본문 내 음성은 여전히 YHWH에게 직접 말하는 것으로 유지했습니다.
- source_word: מִשְׁפָּטִים
  english_pob_choice: matters of justice
  chosen_korean: 의의 문제들
  alternatives_korean:
  - 판결들
  - 재판 문제들
  - 공의의 일들
  lexicon: HALOT
  rationale: 복수형 מִשְׁפָּטִים은 단순한 개별 판결보다 ‘의/재판에 관한 사안들’을 가리키므로, 법정적 뉘앙스와 윤리적 문제를 함께 살려 옮겼습니다.
- source_word: בֹּגְדֵי בָגֶד
  english_pob_choice: who deal treacherously
  chosen_korean: 배신자들
  alternatives_korean:
  - 간사한 자들
  - 극도로 배신하는 자들
  - 패역한 자들
  lexicon: HALOT
  rationale: 중첩 표현이 treachery의 강도를 높이지만, 한국어에서는 과도한 직역보다 의미 중심으로 ‘배신자들’이 응축된 배신의 성격을 잘 드러냅니다.
theological_decisions:
- issue: 예레미야의 항변 어조(כִּי אָרִיב אֵלֶיךָ)
  chosen_reading: ‘제가 당신께 소송을 제기할 때에도’로 법정적 항변을 살리되, 존칭 호칭을 유지해 경외를 보존했습니다.
  alternative_readings:
  - ‘제가 당신과 다툴 때에도’
  - ‘제가 당신께 변론할 때에도’
  rationale: 본문은 하나님의 의를 인정하면서도 정의의 문제를 제기하는 긴장을 담고 있으므로, 대립적 감정보다 법정적 호소를 중심으로 번역해야 합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
