id: JER.6.3
reference: Jeremiah 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵלֶ֛י/הָ יָבֹ֥אוּ רֹעִ֖ים וְ/עֶדְרֵי/הֶ֑ם תָּקְע֨וּ עָלֶ֤י/הָ אֹהָלִים֙ סָבִ֔יב רָע֖וּ אִ֥ישׁ אֶת יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/003.yaml
  text: To her shepherds will come with their flocks[a]; they will pitch tents against her all around; each will pasture his own place.
  footnotes:
  - marker: a
    text: Hebrew literally, 'each will pasture his hand.' The expression is idiomatic, likely meaning each one will pasture or consume the area allotted to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 목자들이 자기 양 떼와 함께 그에게 옵니다[a]. 그들은 그 주위에 천막을 칩니다. 각각 자기 몫을 방목합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘각각 자기 손을 방목한다’에 가깝습니다. 문맥상 각자가 자기에게 할당된 몫이나 영역을 침식한다는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶי־הָ / יָבֹאוּ
  english_pob_choice: To her ... will come
  chosen_korean: 그에게 옵니다
  alternatives_korean:
  - 그에게로 옵니다
  - 그에게 다가옵니다
  lexicon: HALOT
  rationale: 방향성을 나타내는 אֶל의 기본 의미를 살리되, 한국어에서는 ‘그에게 옵니다’가 가장 자연스럽고 간결합니다.
- source_word: רֹעִים
  english_pob_choice: shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 양치기들
  - 목동들
  lexicon: HALOT
  rationale: 양 떼를 이끄는 이미지가 핵심이므로 ‘목자들’이 가장 직접적입니다. 동시에 비유적 통치자 이미지를 과도하게 풀어쓰지 않습니다.
- source_word: וְעֶדְרֵיהֶם
  english_pob_choice: with their flocks
  chosen_korean: 자기 양 떼와 함께
  alternatives_korean:
  - 그들의 양 떼와 함께
  - 양 떼를 거느리고
  lexicon: HALOT
  rationale: עם+명사의 수반 의미를 자연스럽게 살리면서, 목자 비유를 유지하기 위해 ‘양 떼’를 사용했습니다.
- source_word: אֹהָלִים סָבִיב
  english_pob_choice: tents ... all around
  chosen_korean: 주위에 천막을 칩니다
  alternatives_korean:
  - 사방에 천막을 칩니다
  - 둘러 천막을 칩니다
  lexicon: HALOT
  rationale: 포위·진영 형상을 한국어로 분명히 드러내기 위해 ‘주위에 천막을 칩니다’로 옮겼습니다. ‘천막’은 군사적 진영의 현실감을 유지합니다.
- source_word: אִישׁ אֶת יָדֹו
  english_pob_choice: each will pasture his own portion
  chosen_korean: 각각 자기 몫을 방목합니다
  alternatives_korean:
  - 각각 자기 손을 방목합니다
  - 각각 자기 영역을 먹입니다
  lexicon: HALOT
  rationale: 직역하면 난해한 관용구이므로, English POB의 문맥 해석에 따라 ‘각각 자기 몫’을 택해 분배된 영역을 뜻하게 했습니다. ‘방목합니다’는 רעה의 목축 이미지를 보존합니다.
theological_decisions:
- issue: 침략자들을 목자-양떼 이미지로 묘사하는 비유 유지
  chosen_reading: 실제 목자가 아니라 침략 세력의 비유로 읽히는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 군대가 옵니다
  - 통치자들이 옵니다
  rationale: 본문은 목자/양 떼/천막/방목의 연쇄로 침략과 점령을 그리므로, 비유를 해체하지 않고 유지하는 것이 원문의 힘을 살립니다.
  doctrine_reference: 예레미야 6장 문맥상의 예언적 심판 비유
- issue: אֶת יָדוֹ의 관용구 처리
  chosen_reading: ‘자기 몫을 방목합니다’로 옮겨, 각자가 점유한 영역을 먹어 치우는 뜻을 드러냈습니다.
  alternative_readings:
  - 자기 손을 방목합니다
  - 자기 장소를 방목합니다
  rationale: 히브리어 관용구를 문자적으로 옮기면 의미가 드러나지 않으므로, POB의 문맥 판단을 따라 분배된 몫/구역의 의미를 한국어로 풀었습니다.
  doctrine_reference: 원문 관용구의 의미 보존 원칙
