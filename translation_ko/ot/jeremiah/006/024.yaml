id: JER.6.24
reference: Jeremiah 6:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמַ֥עְנוּ אֶת שָׁמְע֖/וֹ רָפ֣וּ יָדֵ֑י/נוּ צָרָה֙ הֶחֱזִיקַ֔תְ/נוּ חִ֖יל כַּ/יּוֹלֵדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/024.yaml
  text: We have heard the report of it[a]; our hands hang limp. Distress has seized us[c][b], pain like a woman giving birth.
  footnotes:
  - marker: a
    text: Or 'the report about him' / 'his report'; the Hebrew can denote either the report concerning the enemy or, less likely in context, his own report.
    reason: lexical_alternative
  - marker: b
    text: Literally 'our hands have gone slack,' an idiom for losing strength or courage.
    reason: lexical_alternative
  - marker: c
    text: Or 'pain like a woman in labor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 소식을 들었습니다[a]; 우리 손은 맥이 풀렸습니다[b]. 고통이 우리를 사로잡았으니[c], 해산하는 여인 같은 고통입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에 관한 소식’/‘그의 소식’으로도 옮길 수 있습니다. 히브리어는 적대자에 대한 소식일 수도, 문맥상 덜 가능하지만 그의 소식일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘우리 손이 풀렸다’로, 힘이나 용기를 잃은 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘해산하는 여인 같은 진통입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמַעְנוּ אֶת שָׁמְעוֹ
  english_pob_choice: We have heard the report of it
  chosen_korean: 그 소식을 들었습니다
  alternatives_korean:
  - 그의 소식을 들었습니다
  - 그에 관한 소식을 들었습니다
  lexicon: HALOT
  rationale: שֵׁמַע는 ‘소식/보고/전언’의 뜻이 가능하며, 여기서는 문맥상 다가오는 위협에 관한 소식이므로 자연스러운 현대 한국어로 ‘그 소식’이 적절합니다.
- source_word: רָפוּ יָדֵינוּ
  english_pob_choice: our hands hang limp
  chosen_korean: 우리 손은 맥이 풀렸습니다
  alternatives_korean:
  - 우리 손은 축 늘어졌습니다
  - 우리 손은 무기력해졌습니다
  lexicon: HALOT
  rationale: ‘손이 풀리다/축 늘어지다’는 힘과 용기가 꺾인 관용을 잘 살리며, 원문의 신체적 이미지도 유지합니다.
- source_word: צָרָה הֶחֱזִיקַתְנוּ
  english_pob_choice: Distress has seized us
  chosen_korean: 고통이 우리를 사로잡았습니다
  alternatives_korean:
  - 고난이 우리를 붙들었습니다
  - 환난이 우리를 덮쳤습니다
  lexicon: HALOT
  rationale: חזק의 사역형은 ‘붙잡다, 사로잡다’의 힘을 가지므로, 주어가 된 고통이 사람들을 붙드는 이미지를 살려 ‘사로잡다’로 옮겼습니다.
- source_word: חִיל כַּיּוֹלֵדָה
  english_pob_choice: pain like a woman giving birth
  chosen_korean: 해산하는 여인 같은 고통입니다
  alternatives_korean:
  - 진통을 겪는 여인 같은 고통입니다
  - 아이를 낳는 여인 같은 고통입니다
  lexicon: HALOT
  rationale: חִיל은 산통/몸부림을 포함할 수 있고, 직후의 비교구는 출산의 고통을 가리키므로 ‘해산하는 여인’이 이미지를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 비유의 강도 유지
  chosen_reading: ‘손은 맥이 풀렸습니다’와 ‘고통이 우리를 사로잡았습니다’로 관용과 몸의 이미지를 함께 살렸습니다.
  alternative_readings:
  - 단순히 ‘우리는 두려웠습니다’로 평탄화함
  - ‘힘이 없어졌습니다’로만 의역함
  rationale: 예레미야의 경고에 대한 공동체의 즉각적 무력감을 원문처럼 드러내기 위해, 심리적 설명으로만 바꾸지 않고 신체적 표현을 유지했습니다.
  doctrine_reference: 예언적 심판 응답의 묘사
