base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/027.yaml
  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
  footnotes:
  - marker: a
    text: Or 'an assayer among my people, a fortress'; the Hebrew is compact and somewhat difficult. 'Assayer' brings out the metal-testing imagery that fits the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: '''Their way'' can also mean ''their conduct'' or ''their manner of life.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 내 백성 가운데 검증하는 자와 요새로 세웠습니다[a]. 그리하여 너는 그들의 길을 알며 시험할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘내 백성 가운데 검증하는 자, 요새’입니다. ‘검증하는 자’는 특히 금속을 감별하는 사람을 가리킬 수 있으며, ‘요새’와의 병렬은 간결하고 다소 난해합니다.
    reason: source_note
  - marker: b
    text: ‘그들의 길’은 ‘그들의 행실’ 또는 ‘그들의 삶의 방식’으로도 옮길 수 있습니다.
    reason: lexical_alternative
