id: JER.6.27
reference: Jeremiah 6:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּח֛וֹן נְתַתִּ֥י/ךָ בְ/עַמִּ֖/י מִבְצָ֑ר וְ/תֵדַ֕ע וּ/בָחַנְתָּ֖ אֶת דַּרְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/027.yaml
  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
  footnotes:
  - marker: a
    text: Or 'an assayer among my people, a fortress'; the Hebrew is compact and somewhat difficult. 'Assayer' brings out the metal-testing imagery that fits the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: '''Their way'' can also mean ''their conduct'' or ''their manner of life.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너를 내 백성[a] 가운데 있는 시험하는 자, 견고한 요새로 삼았으니, 네가 그들의 길을 알고 시험하게 하려는 것이다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 백성 가운데’입니다. ‘among my people’에 맞춰 관계적 위치를 살렸습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘그들의 길’이라고 되어 있으며, 이는 ‘그들의 행실’ 또는 ‘그들의 삶의 방식’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחוֹן
  english_pob_choice: a tester
  chosen_korean: 시험하는 자
  alternatives_korean:
  - 검사자
  - 금속을 시험하는 자
  - 시금하는 자
  lexicon: HALOT
  rationale: בחן에서 온 명사로, 사람과 행위를 검증·가려내는 역할을 나타내므로 ‘시험하는 자’가 현대 한국어에서 가장 자연스럽고 원문의 평가 이미지를 살립니다.
- source_word: נְתַתִּיךָ
  english_pob_choice: I have made you
  chosen_korean: 내가 너를 … 삼았으니
  alternatives_korean:
  - 내가 너를 … 두었으니
  - 내가 너를 … 세웠으니
  lexicon: HALOT
  rationale: ‘주다/두다’의 배정 의미를 한국어에서 역할 부여로 자연스럽게 옮기기 위해 ‘삼다’ 구문을 사용했습니다.
- source_word: מִבְצָר
  english_pob_choice: a fortress
  chosen_korean: 견고한 요새
  alternatives_korean:
  - 요새
  - 견고한 성채
  - 성벽
  lexicon: HALOT
  rationale: 명사 מִבְצָר의 구체적 방어 이미지를 살리되, 한국어에서는 ‘견고한’이 문맥상 Jeremiah의 판별 역할과 결합될 때 더 분명하게 읽힙니다.
- source_word: דַּרְכָּם
  english_pob_choice: their way
  chosen_korean: 그들의 길
  alternatives_korean:
  - 그들의 행실
  - 그들의 삶의 방식
  - 그들의 행위
  lexicon: HALOT
  rationale: דרך의 비유적 ‘길’ 이미지를 보존하여, 단순한 도덕 요약보다 원문의 넓은 의미 범위를 유지했습니다.
theological_decisions:
- issue: בְעַמִּי의 관계 표현
  chosen_reading: ‘내 백성 가운데 있는’으로 옮겨 예레미야가 백성 내부에 있으면서도 분별의 역할을 맡는다는 긴장을 드러냈습니다.
  alternative_readings:
  - ‘내 백성 안에서’
  - ‘내 백성 중에’
  rationale: 전치사 ב의 공간·관계적 의미를 반영해, 예언자가 백성 바깥의 심판자가 아니라 그들 가운데 세워진 존재임을 보여 줍니다.
  doctrine_reference: 예언자 소명과 언약 백성 내부의 책무
- issue: וְתֵדַע וּבָחַנְתָּ의 연속
  chosen_reading: ‘네가 그들의 길을 알고 시험하게 하려는 것이다’로 목적을 분명히 했습니다.
  alternative_readings:
  - ‘네가 그들의 길을 알게 되고 시험하게 하려는 것이다’
  - ‘그리하여 네가 그들의 길을 알게 되고 시험할 것이다’
  rationale: 문맥상 단순한 시간적 연속보다 사명을 위한 목적이 더 분명하므로, 예레미야의 판별 사역을 드러내는 목적형을 택했습니다.
  doctrine_reference: 예언의 분별 기능
