- issue: בְעַמִּי의 관계 표현
  chosen_reading: ‘내 백성 가운데 있는’으로 옮겨 예레미야가 백성 내부에 있으면서도 분별의 역할을 맡는다는 긴장을 드러냈습니다.
  alternative_readings:
