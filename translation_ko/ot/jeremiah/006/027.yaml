  doctrine_reference: 예언자 소명과 언약 백성 내부의 책무
- issue: וְתֵדַע וּבָחַנְתָּ의 연속
  chosen_reading: ‘네가 그들의 길을 알고 시험하게 하려는 것이다’로 목적을 분명히 했습니다.
  alternative_readings:
  - ‘네가 그들의 길을 알게 되고 시험하게 하려는 것이다’
  - ‘그리하여 네가 그들의 길을 알게 되고 시험할 것이다’
  rationale: 문맥상 단순한 시간적 연속보다 사명을 위한 목적이 더 분명하므로, 예레미야의 판별 사역을 드러내는 목적형을 택했습니다.
  doctrine_reference: 예언의 분별 기능
