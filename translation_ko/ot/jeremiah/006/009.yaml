  - 완전히 거둘 것입니다
  lexicon: HALOT
  rationale: 반복형의 강세를 살리되 한국어에서 자연스러운 수확 동사로 옮겨, 심판의 강한 반복성을 유지했습니다.
- source_word: כַ/גֶּ֖פֶן
  english_pob_choice: as a vine
  chosen_korean: 포도나무처럼
  alternatives_korean:
