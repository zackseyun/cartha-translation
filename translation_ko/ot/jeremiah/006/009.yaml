  yaml_path: translation/ot/jeremiah/006/009.yaml
  text: 'Thus says Yahweh of hosts: They will thoroughly glean the remnant of Israel as a vine[a]; pass your hand over the branches again like a grape-gatherer.'
  footnotes:
  - marker: a
    text: Or possibly “over the tendrils”; the Hebrew term is rare and its precise referent is debated. Some have also understood it as “baskets.”
    reason: lexical_alternative
translation:
  language: ko
  text: “만군의 야훼께서 이렇게 말씀하십니다. 이스라엘의 남은 자를 포도나무처럼 철저히 따낼 것입니다. 포도 수확꾼처럼 손을 다시 가지[a] 위로 뻗으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “덩굴 위로”; 이 히브리어 낱말은 드물어 정확한 지시 대상이 논쟁되며, “바구니들”로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה צְבָא֔וֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
