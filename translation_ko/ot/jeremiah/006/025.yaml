id: JER.6.25
reference: Jeremiah 6:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תצאי הַ/שָּׂדֶ֔ה וּ/בַ/דֶּ֖רֶךְ אַל תלכי כִּ֚י חֶ֣רֶב לְ/אֹיֵ֔ב מָג֖וֹר מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/025.yaml
  text: Do not go out into the field[a], and do not walk on the road[b], for the sword of the enemy and terror are on every side.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sword of the enemy; terror on every side.'' The main text renders the possession idiomatically as ''the enemy has a sword.'''
    reason: lexical_alternative
  - marker: b
    text: The warning is addressed with feminine singular verbs, likely personifying Jerusalem/daughter Zion.
    reason: cultural_note
translation:
  language: ko
  text: 밭으로 나가지 마십시오. 길로도 걷지 마십시오. 이는 원수의 칼과 사방의 공포가 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל
  english_pob_choice: Do not
  chosen_korean: 나가지 마십시오 / 걷지 마십시오
  alternatives_korean:
  - 나가지 마라
  - 나가면 안 됩니다
  lexicon: HALOT
  rationale: 금지의 부정사 אַל은 한국어 합쇼체 금지 명령으로 자연스럽게 옮겼습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: the field
  chosen_korean: 밭
  alternatives_korean:
  - 들
  - 들판
  - 광야
  lexicon: HALOT
  rationale: 문맥상 야외·전원 지역을 가리키므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘밭’을 택했습니다.
- source_word: תלכי
  english_pob_choice: walk
  chosen_korean: 걷지 마십시오
  alternatives_korean:
  - 가지 마십시오
  - 다니지 마십시오
  lexicon: HALOT
  rationale: הלך의 기본 동작인 ‘걷다’를 살려 앞의 ‘나가다’와 동사를 구분했습니다.
- source_word: לְאֹיֵב
  english_pob_choice: the enemy has / of the enemy
  chosen_korean: 원수의
  alternatives_korean:
  - 적의
  - 원수가 가진
  - 원수의 칼
  lexicon: HALOT
  rationale: 히브리어의 לְ는 여기서 소유·귀속 관계를 나타내므로, 한국어 속격으로 옮겨 ‘원수의 칼’로 표현했습니다.
- source_word: מָגוֹר מִסָּבִיב
  english_pob_choice: terror is on every side
  chosen_korean: 사방의 공포
  alternatives_korean:
  - 사방의 두려움
  - 사면의 공포
  - 사방에 공포가
  lexicon: HALOT
  rationale: 예레미야의 반복 표현인 מָגוֹר מִסָּבִיב의 압박감을 살리되, 한국어에서 응축된 명사구로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예언적 경고의 직접성
  chosen_reading: 명령형 금지와 이유절을 그대로 살려, 단순한 안내가 아니라 임박한 재난 경고로 읽히게 했습니다.
  alternative_readings:
  - 완곡한 권고로 약화시키는 읽기
  - 일반적인 안전 수칙처럼 중화하는 읽기
  rationale: 본문은 예언적 심판 맥락의 강한 금지를 담고 있으므로, 경고의 긴박성을 유지해야 합니다.
  doctrine_reference: 예레미야서의 심판 예언 맥락
