revisions:
- from: 밭으로 나가지 마십시오. 길로도 걷지 마십시오. 이는 원수의 칼과 사방의 공포가 있기 때문입니다.
  to: 들판으로 나가지 마시고, 길로 나서지도 마십시오. 원수의 칼이 있고 사방에서 공포가 닥치기 때문입니다.[a]
  rationale: ‘들판’은 שָׂדֶה의 밭·들판·탁 트인 곳이라는 범위를 자연스럽게 담습니다. ‘길로 나서지도 마십시오’는 דרך와 הלך가 이루는 이동 금지를 자연스러운 한국어로 옮깁니다. 마지막 절은 ‘원수의 칼’이라는 위협과 사방으로부터 닥치는 ‘공포’를 각각 보존하여, 히브리어의 간결한 경고를 과도하게 해석하지 않고 재현합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:49Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘길로도 걷지 마십시오’는 히브리어의 길 위를 이동하지 말라는 경고를 한국어로 다소 부자연스럽게 좁힙니다. 또한 מִסָּבִיב는 ‘사방의’보다 ‘사방에서/사방으로부터’가 더 직접적입니다.
  naturalness: ‘들판으로 나가지 마시고, 길로 나서지도 마십시오’가 현대 표준어 합쇼체에서 더 자연스럽고, 두 금지 명령의 병렬도 잘 드러냅니다.
  terminology: ‘원수의 칼’은 חֶרֶב לְאֹיֵב의 소유·귀속 관계를 무리 없이 반영합니다. מָגוֹר는 ‘공포’로 유지할 수 있으며, ‘사방에서’와 결합해 포위된 위협의 뉘앙스를 보존합니다.
  issues:
  - severity: medium
    issue: ‘길로도 걷지 마십시오’의 어색한 결합
    rationale: דרך와 הלך는 여기서 보행 자체보다 길을 따라 나가거나 이동하는 일을 금합니다. ‘길로 걷다’는 현대 한국어에서 부자연스럽고 의미가 불필요하게 좁아집니다.
  - severity: low
    issue: ‘사방의 공포’가 מִסָּבִיב의 방향성을 약화함
    rationale: מִן이 결합된 מִסָּבִיב는 사방으로부터 닥치는 위협을 나타냅니다. ‘사방에서 공포가 닥치다’가 이를 더 명확히 전달합니다.
  - severity: low
    issue: 여성 단수 مخاطبة의 정보가 본문에서 드러나지 않음
