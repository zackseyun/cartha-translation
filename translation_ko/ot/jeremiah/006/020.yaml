  lexicon: HALOT
  rationale: לְבוֹנָה는 일반적인 향이 아니라 특정한 수지 향료인 유향을 가리키므로 더 정확한 한국어 용어를 택했습니다.
- source_word: קָנֶה הַטּוֹב
  english_pob_choice: sweet cane
  chosen_korean: 향기로운 갈대
  alternatives_korean:
