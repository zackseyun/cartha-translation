  source_fidelity: 히브리어의 수사 의문문은 값비싼 수입 제의품이 하나님께 무슨 유익이 있는지를 묻습니다. 초안의 '왜 이것이 내게 있습니까?'는 לָמָּה זֶּה לִי의 한국어 표현으로 부자연스럽고, '있습니까'가 원문의 '무슨 소용인가'라는 관용적 수사 기능을 충분히 전달하지 못합니다. 스바의 유향, 먼 땅의 향기로운 갈대, 번제와 일반 제물의 구별은 유지되어야 합니다.
  naturalness: '''스바에서 오는 유향과 먼 땅에서 오는 향기로운 갈대가 내게 무슨 소용이 있습니까?''는 현대 표준 한국어의 자연스러운 합쇼체이며, 원문의 병렬 구조와 수사적 힘을 보존합니다. ''제물''은 זֶבַח의 넓은 뜻에 자연스럽고, ''희생제물''보다 번제와의 대조에도 간결합니다.'
  terminology: '''유향''은 לְבוֹנָה의 정확한 명칭입니다. ''향기로운 갈대''는 קָנֶה הַטּוֹב가 가리키는 귀한 방향성 갈대를 무리 없이 나타냅니다. עֹלָה는 ''번제''로, זֶבַח은 ''제물''로 구별했습니다. לֹא לְרָצוֹן은 ''받아들여지지 않으며'', לֹא עָרְבוּ לִי는 ''나를 기쁘게 하지 않습니다''로 각각 옮겼습니다.'
