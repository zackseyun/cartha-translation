  - 향긋한 갈대
  - 아로마 향 갈대
  lexicon: HALOT
  rationale: 직역적 '좋은 갈대'보다 문맥상 향료성 식물을 가리키는 점을 살려, 의미를 드러내는 '향기로운 갈대'로 옮겼습니다.
- source_word: לֹא לְרָצוֹן / לֹא עָרְבוּ לִי
