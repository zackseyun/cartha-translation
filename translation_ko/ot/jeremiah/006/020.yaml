base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/020.yaml
  text: 'Why is this to me: frankincense comes from Sheba[a], and sweet cane from a distant land? Your burnt offerings are not acceptable[b], and your sacrifices do not please me.'
  footnotes:
  - marker: a
    text: 'Or, ''What use is this to me: frankincense from Sheba, and sweet cane from a distant land?'''
    reason: lexical_alternative
  - marker: b
    text: '''Sweet cane'' may also be rendered ''aromatic cane'' or ''sweet calamus.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 이것이 내게 있습니까? 스바에서 유향이 오고, 먼 땅에서 향기로운 갈대가 옵니다. 너희의 번제는 받아들여지지 않고, 너희의 희생제물은 나를 기쁘게 하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “이것이 내게 무슨 소용이 있습니까: 스바의 유향과 먼 땅의 향기로운 갈대?”'
    reason: lexical_alternative
  - marker: b
    text: '''향기로운 갈대''는 ''달콤한 갈대'' 또는 ''향긋한 칼라무스''로도 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה לִי
  english_pob_choice: Why is this to me
  chosen_korean: 왜 이것이 내게 있습니까?
  alternatives_korean:
  - 이것이 내게 무슨 소용이 있습니까?
  - 왜 이것이 내게 있습니까
