  lexicon: HALOT
  rationale: 제사 용어의 거부와 기쁨의 부재를 각각 살리되, '받아들여지지 않다'와 '기쁘게 하지 않다'로 하나님 앞에서의 수용성 판단을 분명히 했습니다.
theological_decisions:
- issue: 예배 행위에 대한 하나님의 수용 거부 표현
  chosen_reading: 비싼 수입품과 제사 자체가 아니라, 하나님께 받아들여지지 않는 예배라는 점을 직접 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 단순히 물품 목록만 나열하는 더 건조한 번역
  - '''기쁘게 하지 않는다''를 완화해 ''마음에 들지 않는다''로 옮기는 방식'
  rationale: 본문은 외형적·값비싼 제의 행위가 하나님께 유익하거나 հաճ을 주지 못함을 수사적으로 선언하므로, 그 거부의 강도를 약화하지 않았습니다.
  doctrine_reference: Jer 6:20의 제의 비판 맥락
