id: JER.6.29
reference: Jeremiah 6:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָחַ֣ר מַפֻּ֔חַ מ/אשת/ם עֹפָ֑רֶת לַ/שָּׁוְא֙ צָרַ֣ף צָר֔וֹף וְ/רָעִ֖ים לֹ֥א נִתָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/029.yaml
  text: The bellows blow fiercely[a]; the lead is consumed by the fire. In vain the refiner keeps refining[b], but the wicked are not separated out.
  footnotes:
  - marker: a
    text: Or 'The bellows are scorched/burned up; from their fire the lead is consumed.' The Hebrew of this clause is difficult, and translations differ on how the fire and lead are related.
    reason: textual_variant
  - marker: b
    text: Or 'the evil ones are not removed' or, in a more metallurgical sense, 'the impurities are not drawn off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 풀무가 세차게 불고[a], 납이 불에 녹아 없어집니다. 제련하는 사람이 아무리 제련해도[b], 악한 자들은 분리되지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 절의 첫머리가 어렵습니다. ‘풀무가 세차게 불다’ 외에 ‘풀무가 타 버리다/그슬리다’로도 옮길 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘악한 자들이 제거되지 않는다’ 혹은 제련의 말투로 ‘불순물이 떠내려가지 않는다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחַר / מַפֻּחַ
  english_pob_choice: The bellows blow fiercely
  chosen_korean: 풀무가 세차게 불고
  alternatives_korean:
  - 풀무가 거세게 불고
  - 풀무가 헐떡이며 불고
  lexicon: HALOT
  rationale: 벨로스가 강하게 작동하는 제련 장면을 한국어의 자연스러운 동사구로 살리되, מקור의 거친 힘을 유지했습니다.
- source_word: עֹפָרֶת
  english_pob_choice: the lead
  chosen_korean: 납이
  alternatives_korean:
  - 그 납이
  - 납이 불에
  lexicon: HALOT
  rationale: 문맥상 제련 과정에서의 납을 가리키므로 ‘납’으로 옮기고, 한국어 문맥에서는 조사만 붙여 간결하게 처리했습니다.
- source_word: לַשָּׁוְא / צָרַף צָרוֹף
  english_pob_choice: In vain the refiner keeps refining
  chosen_korean: 제련하는 사람이 아무리 제련해도
  alternatives_korean:
  - 아무 소용 없이 제련해도
  - 제련하는 자가 헛되이 거듭 제련해도
  lexicon: HALOT
  rationale: 반복 어근의 강조를 ‘아무리 … 해도’로 옮겨, 제련의 반복성과 헛됨을 함께 드러냈습니다.
- source_word: וְרָעִים
  english_pob_choice: the wicked
  chosen_korean: 악한 자들은
  alternatives_korean:
  - 악인들은
  - 악한 이들은
  lexicon: HALOT
  rationale: 제련 비유가 단순한 불순물보다 도덕적 주체를 지칭하므로, ‘악한 자들’로 옮겨 예언적 책망을 살렸습니다.
theological_decisions:
- issue: 제련 비유의 의미 범위
  chosen_reading: 물질적 제련 장면을 유지하되, 최종 진술은 유다의 악한 자들이 정화 과정에서도 제거되지 않는다는 뜻으로 읽었습니다.
  alternative_readings:
  - 순수하게 제련 기술의 실패를 말하는 읽기
  - ‘불순물’만 남는다는 비도덕적 읽기
  rationale: 예레미야의 문맥상 이 이미지는 백성의 도덕적 완고함을 드러내는 표상입니다. לכן ‘악한 자들’로 옮기되, 제련 장면 자체도 보존했습니다.
  doctrine_reference: 예레미야 6장의 심판과 연단 이미지
