base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/030.yaml
  text: They call them rejected silver[a], because Yahweh has rejected them.
  footnotes:
  - marker: a
    text: Or 'refuse silver' or 'despised silver.' The Hebrew phrase uses a refining metaphor for metal judged worthless after testing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 ‘버림받은 은’이라고 부릅니다[a]. 이는 야훼께서 그들을 버리셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거절된 은’, ‘멸시받은 은’. 히브리어는 정련 후 쓸모없다고 판정된 금속의 비유를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף נִמְאָס
  english_pob_choice: rejected silver
  chosen_korean: 버림받은 은
  alternatives_korean:
  - 거절된 은
  - 버려진 은
  - 쓸모없게 된 은
  lexicon: HALOT
  rationale: 은의 정련 비유를 살리되, 현대 한국어에서 자연스럽고 판정적 의미를 드러내는 표현으로 옮겼습니다.
- source_word: קָרְאוּ לָהֶם
  english_pob_choice: they call them
  chosen_korean: 그들을 부릅니다
  alternatives_korean:
  - 사람들은 그들을 부릅니다
  - 그들은 불립니다
  - 그들을 사람들이 부릅니다
  lexicon: HALOT
  rationale: 히브리어의 주어 불특정 표현을 한국어의 일반적 서술로 살려, 누가 부르는지보다 그렇게 불리는 사실을 전달했습니다.
- source_word: מָאַס
  english_pob_choice: has rejected
  chosen_korean: 버리셨기
  alternatives_korean:
  - 거절하셨기
  - 멸시하셨기
  - 외면하셨기
  lexicon: HALOT
  rationale: 앞의 ‘버림받은’과 같은 어근 계열의 거절 의미를 유지하여, 본절의 의도된 반복과 심판적 뉘앙스를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본 규정에 따라 신명은 ‘야훼’로 옮겨, 본문의 언약적 고유성을 보존했습니다.
theological_decisions:
- issue: 반복되는 ‘버리다/버림받다’ 표현의 보존
  chosen_reading: ‘버림받은 은’과 ‘버리셨기 때문입니다’로 같은 의미권을 반복해 본문의 판결적 언어를 유지했습니다.
  alternative_readings:
  - ‘거절된 은’과 ‘거절하셨기 때문입니다’
  - ‘쓸모없게 된 은’과 ‘야훼께서 그들을 멸시하셨기 때문입니다’
  rationale: 히브리어는 נמאס/מאס의 어근 반복으로 이유와 결과를 연결합니다. 한국어에서도 동일한 반복을 유지해야 예언적 수사와 판단의 강도가 살아납니다.
  doctrine_reference: Jer 6:30의 심판 선언과 어근 반복
