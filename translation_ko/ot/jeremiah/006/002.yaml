  text: הַ/נָּוָה֙ וְ/הַ/מְּעֻנָּגָ֔ה דָּמִ֖יתִי בַּת צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/002.yaml
  text: I have likened daughter Zion to a lovely and delicate woman[a].
  footnotes:
  - marker: a
    text: Or possibly, 'I will destroy daughter Zion, the lovely and delicate one.' The Hebrew verb is difficult here, and some take it in a destructive sense rather than 'I have likened.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 시온의 딸을 아름답고 섬세한 여인에 비유하였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 시온의 딸, 곧 아름답고 섬세한 이를 멸하리라’일 수도 있습니다. 여기의 히브리어 동사는 해석하기 어렵습니다. 어떤 이들은 이 동사를 ‘비유하다’가 아니라 파괴의 의미로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּוָה
  english_pob_choice: lovely
  chosen_korean: 사랑스럽고
  alternatives_korean:
  - 아름답고
  - 곱고
  - 보기 좋은
  lexicon: HALOT
  rationale: 나וה의 미적·호감적 뉘앙스를 살리기 위해 ‘사랑스럽고’로 옮겼습니다. 단순 외모 묘사보다 시적 호감의 결을 유지합니다.
- source_word: וְהַמְּעֻנָּגָה
  english_pob_choice: delicate
  chosen_korean: 우아한
  alternatives_korean:
  - 연약한
  - 섬세한
  - 호사스러운
  lexicon: HALOT
  rationale: ענג의 부드러움·정교함을 한국어 시어로 자연스럽게 살리기 위해 ‘우아한’을 택했습니다. ‘연약한’은 약함을, ‘호사스러운’은 사치의 함의를 과도하게 줄 수 있습니다.
- source_word: דָּמִיתִי
  english_pob_choice: I have likened
  chosen_korean: 비유하였습니다
  alternatives_korean:
  - 비슷하다고 하였습니다
  - 파멸시켰습니다
  - 닮았습니다
  lexicon: HALOT
  rationale: 동사의 기본적인 비교/유사 의미를 살려 서술적 비교로 옮겼습니다. 파괴적 독해는 가능한 대안이지만, 여기서는 형용사들과의 결합이 비교 이미지를 더 강하게 지지합니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 시온의 딸
  alternatives_korean:
  - 딸 시온
  - 시온 딸
  - 시온의 딸
  - 시온의 딸로
  lexicon: HALOT
  rationale: 예언서의 관용적 인격화 표현을 한국어의 자연스러운 소유격 구조로 옮겼습니다. ‘시온의 딸’이 가장 직역에 가깝고 시적 힘도 유지합니다.
theological_decisions:
- issue: דָּמִיתִי의 해석적 긴장
  chosen_reading: 본문은 시온의 딸을 사랑스럽고 우아한 여인으로 비교하는 이미지로 읽었습니다.
  alternative_readings:
  - ‘시온의 딸, 사랑스럽고 우아한 이를 내가 멸하리라’ 같은 파괴적 독해
  rationale: 히브리어가 난해하다는 점은 유지하되, 형태와 인접한 형용사들이 비교 이미지에 더 자연스럽게 결합하므로 본문 표층의 시적 의미를 우선했습니다. 다만 대안 해석의 가능성은 각주로 남겨 긴장을 지웠습니다.
  doctrine_reference: 원문 우선과 해석적 긴장 보존
- issue: 묵시적 여성상 보충
  chosen_reading: 암시된 여성형 대상을 한국어에서 ‘여자’로 보충했습니다.
  alternative_readings:
  - ‘여인’
  - ‘여성’
  - 보충하지 않음
  rationale: 히브리어는 여성 단수 형용사들로 대상을 암시하므로 한국어에서는 자연스러운 명사 보충이 필요합니다. ‘여자’가 과도한 문학화 없이 가장 중립적입니다.
  doctrine_reference: 문법적 암시를 자연스럽게 보완하는 번역 관행
