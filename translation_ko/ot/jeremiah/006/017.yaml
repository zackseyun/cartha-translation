id: JER.6.17
reference: Jeremiah 6:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ צֹפִ֔ים הַקְשִׁ֖יבוּ לְ/ק֣וֹל שׁוֹפָ֑ר וַ/יֹּאמְר֖וּ לֹ֥א נַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/017.yaml
  text: 'I set watchmen over you: ‘Listen to the sound of the trumpet!’ But they said[b][a], ‘We will not listen.’'
  footnotes:
  - marker: a
    text: Or 'I appointed watchmen over you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew shofar, a horn used as an alarm signal; traditionally 'trumpet.'
    reason: cultural_note
translation:
  language: ko
  text: “내가 너희 위에 파수꾼들을 세웠으니, 나팔 소리를 들으십시오!” 그러나 그들은 말하였습니다. “우리는 듣지 않겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세웠으니’는 ‘임명하였으니’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 shofar는 경고 신호에 쓰이는 뿔피리로, 전통적으로 ‘나팔’로 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם
  english_pob_choice: I set over you
  chosen_korean: “내가 너희 위에 … 세웠으니”
  alternatives_korean:
  - “내가 너희 위에 … 임명하였으니”
  - “내가 너희 위에 … 세워 두었으니”
  lexicon: HALOT
  rationale: קום의 히필은 ‘세우다/임명하다’의 뜻을 가지며, 여기서는 파수꾼을 백성 위에 배치하는 장면이므로 ‘세우다’가 가장 직접적이고 자연스럽습니다.
- source_word: צֹפִים
  english_pob_choice: watchmen
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 망보는 자들
  - 감시자들
  lexicon: HALOT
  rationale: צפה 계열은 지켜보고 경고하는 자를 가리키므로, 예언 문맥에서 표준적이고 기능을 드러내는 ‘파수꾼들’이 적절합니다.
- source_word: שׁוֹפָר
  english_pob_choice: trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 숫양 뿔
  - 경고 나팔
  lexicon: HALOT
  rationale: שׁוֹפָר는 경고 신호에 쓰이는 뿔피리이므로, 한국어 성경 문맥에서 널리 통용되면서도 기능을 전달하는 ‘나팔’이 적절합니다.
- source_word: לֹא נַקְשִׁיב
  english_pob_choice: We will not listen
  chosen_korean: 우리는 듣지 않겠습니다
  alternatives_korean:
  - 우리는 귀 기울이지 않겠습니다
  - 우리는 들으려 하지 않겠습니다
  lexicon: HALOT
  rationale: קשב의 부정형은 명령에 대한 거부를 나타내므로, ‘듣지 않겠습니다’가 짧고 단호한 거절을 잘 살립니다.
theological_decisions:
- issue: 파수꾼의 정체를 어떻게 드러낼 것인가
  chosen_reading: ‘파수꾼들’로 두어, 구체적 신분을 예언자나 지도자로 좁히지 않고 경고하는 역할 자체를 보존했습니다.
  alternative_readings:
  - ‘예언자들’
  - ‘경계병들’
  - ‘지도자들’
  rationale: 히브리어는 경고 기능의 비유를 유지하며 정확한 동일시를 요구하지 않으므로, 번역도 그 긴장을 그대로 두는 편이 본문에 충실합니다.
  doctrine_reference: 본문의 은유와 해석 여지를 보존해야 합니다.
