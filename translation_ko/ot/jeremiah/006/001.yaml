    rationale: וְשֶׁבֶר גָּדוֹל은 앞의 임박한 재앙과 병렬을 이루는 파멸의 도래를 가리킵니다. 단순 존재 표현은 임박성과 병렬 관계를 약화하고 한국어로도 어색합니다.
