id: JER.6.1
reference: Jeremiah 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָעִ֣זוּ בְּנֵ֣י בִניָמִ֗ן מִ/קֶּ֨רֶב֙ יְר֣וּשָׁלִַ֔ם וּ/בִ/תְק֨וֹעַ֙ תִּקְע֣וּ שׁוֹפָ֔ר וְ/עַל בֵּ֥ית הַכֶּ֖רֶם שְׂא֣וּ מַשְׂאֵ֑ת כִּ֥י רָעָ֛ה נִשְׁקְפָ֥ה מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/001.yaml
  text: Take cover[a], sons of Benjamin, from the midst of Jerusalem! Blow the trumpet in Tekoa, and raise a signal over Beth-haccherem, for disaster is looking down from the north[d][c][b], and great destruction.
  footnotes:
  - marker: a
    text: Or 'Flee for safety' or 'Gather yourselves to flee.' The Hebrew imperative is difficult and may carry the sense of urgently seeking safety.
    reason: lexical_alternative
  - marker: b
    text: Beth-haccherem is a place name, likely a high point used for warning signals between Jerusalem and Tekoa.
    reason: cultural_note
  - marker: c
    text: Or 'raise a beacon' or 'lift up a signal fire.'
    reason: lexical_alternative
  - marker: d
    text: The Hebrew literally says 'disaster has looked down from the north,' personifying the coming calamity.
    reason: lexical_alternative
translation:
  language: ko
  text: 베냐민 자손들아, 예루살렘 한가운데에서 피하십시오! 도가에서 나팔을 불고, 벧학게렘 위에 신호를 올리십시오. 재앙이 북쪽에서 내려다보고 있고, 큰 파멸이 있기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 명령형은 난해하며, ‘안전하게 피하다/급히 피난하다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 벧학게렘은 지명으로, 예루살렘과 도가 사이의 경고 신호에 쓰였을 가능성이 있는 높은 지점으로 보입니다.
    reason: cultural_note
  - marker: c
    text: ‘신호를 올리다’는 원문의 ‘들어 올린 표식/신호’라는 뜻을 넓게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 문자적으로 ‘재앙이 북쪽에서 내려다보고 있다’라고 하여, 다가오는 재앙을 의인화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִזוּ
  english_pob_choice: Take cover
  chosen_korean: 피하십시오
  alternatives_korean:
  - 도망하십시오
  - 안전하게 피하십시오
  - 몸을 피하십시오
  lexicon: HALOT
  rationale: 히필 명령형의 급박한 경고를 현대 한국어의 군사·재난 맥락에 맞게 옮기기 위해, 단순한 ‘도망’보다 안전한 곳으로 재빨리 이동하라는 뜻이 드러나는 ‘피하십시오’를 택했습니다.
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: sons of Benjamin
  chosen_korean: 베냐민 자손들아
  alternatives_korean:
  - 베냐민 사람들아
  - 베냐민인들아
  lexicon: HALOT
  rationale: 히브리어의 친족적 호칭을 살리면서도 공동체 전체를 가리키는 표현이므로, 남성 복수 호칭을 그대로 반영한 ‘베냐민 자손들아’로 옮겼습니다.
- source_word: מִקֶּרֶב יְרוּשָׁלִַם
  english_pob_choice: from the midst of Jerusalem
  chosen_korean: 예루살렘 한가운데에서
  alternatives_korean:
  - 예루살렘 가운데에서
  - 예루살렘 안에서
  lexicon: HALOT
  rationale: קֶרֶב의 ‘내부/한가운데’ 이미지를 살려, 도시 내부에서 빠져나오라는 긴박감을 드러내는 표현으로 옮겼습니다.
- source_word: תִּקְעוּ שׁוֹפָר
  english_pob_choice: Blow the trumpet
  chosen_korean: 나팔을 불고
  alternatives_korean:
  - 뿔나팔을 불고
  - 쇼파르를 불고
  lexicon: HALOT
  rationale: שׁוֹפָר는 정확히는 뿔나팔이지만, 한국어에서 경보 신호로 자연스럽고 이해하기 쉬운 ‘나팔’이 가장 적절해 보였습니다.
- source_word: שְׂאוּ מַשְׂאֵת
  english_pob_choice: raise a signal
  chosen_korean: 신호를 올리십시오
  alternatives_korean:
  - 횃불 신호를 올리십시오
  - 표지를 세우십시오
  - 봉화를 올리십시오
  lexicon: HALOT
  rationale: 문맥상 경고용 신호를 높이 들어 올리는 뜻이므로, 구체적 매체를 단정하지 않고 넓게 포괄하는 ‘신호를 올리다’로 옮겼습니다.
- source_word: נִשְׁקְפָה
  english_pob_choice: is looking down
  chosen_korean: 내려다보고 있고
  alternatives_korean:
  - 보이고 있고
  - 드리워지고 있고
  - 서성이고 있고
  lexicon: HALOT
  rationale: 니팔형의 ‘위에서 아래로 바라보다’는 시각적 이미지를 살려, 북쪽에서 닥쳐오는 재앙을 인격화한 표현으로 유지했습니다.
theological_decisions:
- issue: 재앙/파멸의 예언적 어휘
  chosen_reading: 재앙 ... 큰 파멸
  alternative_readings:
  - 악 ... 큰 파괴
  - 재난 ... 큰 무너짐
  rationale: 여기서 רָעָה와 שֶׁבֶר גָּדוֹל은 도덕적 ‘악’보다 다가오는 언약 심판의 재난을 가리키므로, 예언적 의미를 분명히 하는 ‘재앙’과 ‘큰 파멸’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
- issue: 명령문의 등록
  chosen_reading: 공동체에 대한 긴급 경고로서 직설적 명령형을 사용함
  alternative_readings:
  - 완곡한 권고형
  - 설명형 서술문
  rationale: 원문은 급박한 경보와 피난 지시를 전달하므로, 한국어에서도 명령형을 유지해 본문의 긴장과 긴급성을 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
