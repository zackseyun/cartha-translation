id: JER.6.15
reference: Jeremiah 6:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֹבִ֕ישׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵב֗וֹשׁוּ גַּם הַכְלִים֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֧וּ בַ/נֹּפְלִ֛ים בְּ/עֵת פְּקַדְתִּ֥י/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/015.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time I punish them, they will stumble, says Yahweh.
  footnotes:
  - marker: a
    text: Or 'at the time I visit them.' The Hebrew verb can mean 'visit' or 'attend to,' but here it carries the sense of punitive visitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가증한 일을 저질렀는데도 부끄러워했습니까? 아니요, 그들은 조금도 부끄러워하지 않았습니다. 얼굴이 붉어지는 법도 몰랐습니다. 그러므로 그들은 넘어지는 자들 가운데서 넘어질 것입니다. 내가 그들을 벌할 때 그들은 쓰러질 것입니다. 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벌할 때’는 פּקד의 문맥상 징벌적 의미를 드러낸 번역입니다. 문자적으로는 ‘찾아갈 때’ 또는 ‘방문할 때’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  english_pob_choice: Were they ashamed
  chosen_korean: 부끄러워했습니까?
  alternatives_korean:
  - 수치를 당했습니까?
  - 부끄러움을 느꼈습니까?
  lexicon: HALOT
  rationale: 수사적 질문 구조를 살리면서, 예언적 문맥에서의 shame/ashame 의미를 자연스러운 한국어로 옮기기 위해 ‘부끄러워하다’를 택했습니다.
- source_word: תוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 가증한 일
  alternatives_korean:
  - 가증한 것
  - 혐오스러운 일
  lexicon: HALOT
  rationale: 예언서에서의 강한 언약-윤리적 용어를 유지하되, 한국어에서는 ‘가증한 일’이 지나치게 교회적 완곡어가 아니면서도 의미 강도를 잘 보존합니다.
- source_word: הַכְלִים
  english_pob_choice: to blush
  chosen_korean: 얼굴이 붉어지는 법도
  alternatives_korean:
  - 수치심을 느끼는 법도
  - 창피해하는 법도
  lexicon: HALOT
  rationale: ‘붉어지다’는 shame의 가시적 반응을 살리는 관용 표현이며, 뒤의 ‘알지 못했다’와 결합된 무감각을 한국어로 자연스럽게 전달합니다.
- source_word: יִפְּלוּ בַנֹּפְלִים
  english_pob_choice: they will fall among the fallen
  chosen_korean: 넘어지는 자들 가운데서 넘어질 것입니다
  alternatives_korean:
  - 쓰러진 자들 가운데서 쓰러질 것입니다
  - 넘어질 자들 가운데서 넘어질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 반복과 운율을 살리면서도, ‘among the fallen’의 집단적 몰락 이미지를 한국어로 재현하기 위해 ‘가운데서’와 반복 동사를 유지했습니다.
- source_word: בְּעֵת פְּקַדְתִּים
  english_pob_choice: at the time I punish them
  chosen_korean: 내가 그들을 벌할 때
  alternatives_korean:
  - 내가 그들을 찾아갈 때
  - 내가 그들에게 임할 때
  lexicon: HALOT
  rationale: פּקד의 문맥상 징벌적 방문이라는 뜻을 드러내기 위해 ‘벌하다’를 사용했습니다. 이는 단순한 ‘방문’보다 심판 맥락을 더 분명히 합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: Project default / DOCTRINE.md
  rationale: 프로젝트 기본값에 따라 신명기적 고유명을 ‘야훼’로 옮겨, 호칭어 ‘주’와 구별했습니다.
theological_decisions:
- issue: 수사적 질문 뒤의 반어적 강조
  chosen_reading: ‘부끄러워했습니까? 아니요, … 조금도 …’로 반문과 즉각적 부정을 함께 살렸습니다.
  alternative_readings:
  - 직설로 ‘그들은 부끄러워하지 않았습니다’라고만 옮김
  - 더 완곡하게 ‘수치를 모르고 있었습니다’라고 옮김
  rationale: 본문은 단순 진술이 아니라 예언자의 비난을 담은 반어적 수사입니다. 질문-부정 구조를 유지해야 청중이 느끼는 책망의 강도가 보존됩니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; rhetorical force preservation'
- issue: פּקד의 재난 문맥 의미
  chosen_reading: ‘벌할 때’로 옮겼습니다.
  alternative_readings:
  - ‘찾아갈 때’
  - ‘돌볼 때’
  rationale: 히브리어 פּקד는 기본적으로 ‘방문하다/돌보다’의 폭이 있지만, 여기서는 즉각 앞뒤 문맥이 심판과 몰락이므로 징벌적 방문을 드러내는 번역이 더 충실합니다.
  doctrine_reference: English POB audit trail; judgment-context semantic decision
