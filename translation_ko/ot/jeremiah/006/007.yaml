source:
  edition: WLC
  text: כְּ/הָקִ֥יר בור מֵימֶ֔י/הָ כֵּ֖ן הֵקֵ֣רָה רָעָתָ֑/הּ חָמָ֣ס וָ֠/שֹׁד יִשָּׁ֨מַע בָּ֧/הּ עַל פָּנַ֛/י תָּמִ֖יד חֳלִ֥י וּ/מַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/007.yaml
  text: As a well keeps its waters fresh[a], so she keeps her evil fresh. Violence and destruction are heard in her[c][b]; before me continually are sickness and wounds.
  footnotes:
  - marker: a
    text: Or 'As a cistern keeps its water cool, so she keeps her wickedness cool/fresh.' The Hebrew verb is difficult, and some understand the image as a well or cistern continually producing or preserving water.
    reason: lexical_alternative
  - marker: b
    text: Or 'violence and devastation' or 'violence and plunder.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'before my face continually, sickness and wound'; the wording may be literal or metaphorical for the city's condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 「우물이 그 물을 늘 새롭게 하듯이, 그녀는 자신의 악을 늘 새롭게 합니다.[a] 폭력과 파괴가 그녀 가운데서 들리며,[b] 내 앞에는 끊임없이 질병과 상처가 있습니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우물이 그 물을 차갑게 하듯이, 그녀는 자신의 악을 차갑게 합니다.’ 히브리어 동사는 의미가 어렵습니다. 어떤 이들은 우물이나 저수조가 물을 계속 내거나 보존하는 이미지로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘폭력과 황폐’, 혹은 ‘폭력과 약탈’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘내 얼굴 앞에 계속하여, 질병과 상처’입니다. 이 표현은 문자적으로도, 또는 도시의 상태를 가리키는 비유적으로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָקִיר / הֵקֵרָה
  english_pob_choice: keeps ... fresh
  chosen_korean: 시원하게 유지하듯이 / 시원하게 유지합니다
  alternatives_korean:
  - 차갑게 합니다
  - 식게 합니다
  - 흐르게 합니다
  lexicon: HALOT
  rationale: 동사의 의미가 어렵고 우물 이미지와 결합되어 ‘물의 상태를 유지하다’는 뉘앙스가 핵심이므로, 직역성보다 비유의 지속성을 살려 ‘시원하게 유지하다’로 옮겼습니다.
- source_word: בּוֹר / מֵימֶיהָ
  english_pob_choice: well / its waters
  chosen_korean: 우물 / 그 물
  alternatives_korean:
  - 저수조 / 그 물들
  - 웅덩이 / 그 물
  lexicon: HALOT
  rationale: 이 구절은 물을 계속 지니거나 내는 그릇의 이미지를 보여 주므로, 한국어로는 자연스러운 비유인 ‘우물’을 택했고, 복수형 물은 한국어에서 어색하지 않게 ‘그 물’로 처리했습니다.
- source_word: רָעָתָהּ
  english_pob_choice: her evil
  chosen_korean: 자기 악
  alternatives_korean:
  - 그녀의 악
  - 그녀의 악행
  - 그녀의 죄악
  lexicon: HALOT
  rationale: 도시를 여성으로 의인화한 점을 유지하면서도, 문맥상 도덕적 악과 폭력성을 함께 포괄하도록 ‘자기 악’으로 옮겼습니다.
- source_word: חָמָס וָשֹׁד
  english_pob_choice: violence and destruction
  chosen_korean: 폭력과 파괴
  alternatives_korean:
  - 폭력과 황폐
  - 폭력과 약탈
  - 학대와 파멸
  lexicon: HALOT
  rationale: חָמָס와 שֹׁד는 사회적 폭력과 그 결과로서의 파괴를 가리키므로, 한국어에서는 병렬감이 분명한 ‘폭력과 파괴’가 가장 직접적입니다.
- source_word: עַל פָּנַי תָּמִיד
  english_pob_choice: before me continually
  chosen_korean: 내 앞에는 끊임없이
  alternatives_korean:
  - 내 얼굴 앞에 항상
  - 내 앞에 계속
  lexicon: HALOT
  rationale: ‘내 얼굴 앞에’의 직설적 표현보다, 하나님의 관점이 분명히 드러나는 한국어 관용인 ‘내 앞에’가 자연스럽고, תָּמִיד의 지속성을 ‘끊임없이’로 살렸습니다.
theological_decisions:
- issue: 예루살렘의 여성 의인화 유지
  chosen_reading: ‘그녀’, ‘자기’, ‘내 앞에는’으로 도시를 여성 인칭으로 유지했습니다.
  alternative_readings:
  - 도시를 중성화하여 ‘그것’으로 번역
  - 의인화를 약화시켜 비개인적 표현으로 번역
  rationale: 히브리어의 여성 어미와 예언서의 수사학을 보존해야 하므로, 도시를 여성으로 부르는 표현을 유지해 독자의 청각적·신학적 긴장을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: חֳלִי וּמַכָּה의 구체성 유지
  chosen_reading: ‘질병과 상처’로 구체적 신체 이미지를 유지했습니다.
  alternative_readings:
  - ‘고통과 상처’로 추상화
  - ‘질환과 타격’으로 더 직역
  rationale: 이 표현은 도시의 상태를 신체적 상처로 그리는 예언적 비유이므로, 의미를 평탄화하지 않고 구체성을 남겨 두는 것이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §3
