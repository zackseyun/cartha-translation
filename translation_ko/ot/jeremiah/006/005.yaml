id: JER.6.5
reference: Jeremiah 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֚וּמוּ וְ/נַעֲלֶ֣ה בַ/לָּ֔יְלָה וְ/נַשְׁחִ֖יתָה אַרְמְנוֹתֶֽי/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/005.yaml
  text: Rise up[a], and let us go up by night, and let us destroy her palaces.
  footnotes:
  - marker: a
    text: Or 'her citadels' or 'her fortresses.' The Hebrew term can denote prominent fortified structures as well as palatial buildings.
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나십시오. 밤에 올라가서 그 성채들을 파괴합시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성채들’은 히브리어 אַרְמוֹן이 가리킬 수 있는 왕궁/요새화 건축물의 범위를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמוּ
  english_pob_choice: Rise up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나라
  - 일어서십시오
  lexicon: HALOT
  rationale: 복수 명령형의 긴박한 군사적 호출을 살리면서, 합쇼체로 현대 한국어 문체에 맞게 옮겼습니다.
- source_word: וְ/נַעֲלֶ֣ה
  english_pob_choice: and let us go up
  chosen_korean: 올라가서
  alternatives_korean:
  - 그리고 올라갑시다
  - 그리고 올라가자
  lexicon: HALOT
  rationale: עלה의 공동 권유를 자연스러운 합쇼체로 표현하되, 히브리어의 전투적 관용구를 과도하게 해석하지 않기 위해 기본 의미인 ‘올라가다’를 유지했습니다.
- source_word: אַרְמְנוֹתֶֽי/הָ
  english_pob_choice: her palaces
  chosen_korean: 그 성채들
  alternatives_korean:
  - 그 궁전들
  - 그 요새들
  lexicon: HALOT
  rationale: 히브리어 אַרְמוֹן은 왕궁뿐 아니라 눈에 띄는 요새화된 건축물도 가리킬 수 있으므로, 영어 POB의 주석을 따라 도시 방어 시설의 뉘앙스를 드러내는 ‘성채들’을 택했습니다.
theological_decisions:
- issue: 도시를 여성으로 의인화한 3인칭 여성 단수 소유격의 처리
  chosen_reading: ‘그 성채들’로 옮겨, 대상 도시의 여성 의인화는 한국어에서 과도하게 드러내지 않았습니다.
  alternative_readings:
  - ‘그녀의 성채들’
  - ‘그 도시의 성채들’
  rationale: 히브리어의 3fs 접미사는 의인화된 도시를 가리키지만, 한국어에서는 직역이 어색해질 수 있어 소유 관계는 유지하되 인칭 표지는 중화했습니다.
  doctrine_reference: 문학적 의인화의 번역 관행
- issue: ‘destroy’의 파괴 명령 강도
  chosen_reading: ‘파괴합시다’로 옮겨, 의도적이고 공격적인 파괴 행위를 분명히 했습니다.
  alternative_readings:
  - ‘무너뜨립시다’
  - ‘황폐하게 합시다’
  rationale: שׁחת의 의도적 파괴 의미를 약화시키지 않기 위해, 본문이 가진 군사적 긴박성을 보존했습니다.
  doctrine_reference: 예언 심판 본문의 문자적-수사적 강도
