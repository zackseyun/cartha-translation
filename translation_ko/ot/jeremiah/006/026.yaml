  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּת עַמִּ֤/י חִגְרִי שָׂק֙ וְ/הִתְפַּלְּשִׁ֣י בָ/אֵ֔פֶר אֵ֤בֶל יָחִיד֙ עֲשִׂ֣י לָ֔/ךְ מִסְפַּ֖ד תַּמְרוּרִ֑ים כִּ֣י פִתְאֹ֔ם יָבֹ֥א הַ/שֹּׁדֵ֖ד עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/026.yaml
  text: Daughter of my people[a], put on sackcloth and roll in ashes; make mourning as for an only son, a most bitter lamentation[c][b], for suddenly the destroyer will come upon us.
  footnotes:
  - marker: a
    text: Or 'and wallow in ashes' or 'cover yourself with ashes.' The Hebrew verb depicts a physical act of mourning in ashes.
    reason: lexical_alternative
  - marker: b
    text: Literally 'mourning of an only one'; idiomatically, mourning as for an only son.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew reads 'upon us,' preserving the prophet's identification with the people; some translations smooth this to 'upon you.'
    reason: alternative_reading
translation:
  language: ko
  text: “내 백성의 딸아, 굵은 베를 두르고 재 속에 뒹구십시오. 외아들을 잃은 듯이 애통하며, 가장 쓰라린 애곡을 하십시오. 이는 파괴자가 갑자기 우리 위로 올 것이기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재 속에 뒹구십시오’는 히브리어 동사의 물리적 애도 행위를 살린 번역이며, ‘재를 뒤집어쓰십시오’처럼 완화할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유일한 자의 애도’를 뜻하며, 관용적으로는 외아들을 잃은 듯한 애통을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘우리 위로’라고 되어 있어, 예언자가 백성과 자신을 함께 포함합니다. 일부 번역은 이를 ‘너희 위로’로 매끈하게 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּת עַמִּי
  english_pob_choice: Daughter of my people
  chosen_korean: 내 백성의 딸
  alternatives_korean:
  - 내 백성아
  - 내 백성의 딸이여
  lexicon: HALOT
  rationale: 히브리어의 호격적 친유 표현과 여성화된 의인화를 살리되, 한국어에서는 ‘딸’이 그대로 유지되면 가장 원문에 가깝습니다.
- source_word: חִגְרִי שָׂק
  english_pob_choice: put on sackcloth
  chosen_korean: 굵은 베를 두르십시오
  alternatives_korean:
  - 베옷을 입으십시오
  - 굵은 베옷을 두르십시오
  lexicon: HALOT
  rationale: ‘허리에 두르다/매다’의 동작을 한국어 관용으로 자연스럽게 옮기되, 애도 의복인 sackcloth의 감각을 보존했습니다.
- source_word: וְהִתְפַּלְּשִׁי בָאֵפֶר
  english_pob_choice: roll in ashes
  chosen_korean: 재 속에 뒹구십시오
  alternatives_korean:
  - 재 속에 구르십시오
  - 재를 뒤집어쓰십시오
  lexicon: HALOT
  rationale: 반복적·격렬한 애도 동작을 드러내는 어감을 살리기 위해 ‘뒹구다’를 택했고, 단순히 덮어쓰는 이미지로 약화시키지 않았습니다.
- source_word: אֵבֶל יָחִיד
  english_pob_choice: mourning as for an only son
  chosen_korean: 외아들을 잃은 듯이 애통하며
  alternatives_korean:
  - 독자를 잃은 듯이 애통하며
  - 외아들의 죽음을 애도하듯
  lexicon: HALOT
  rationale: ‘only one’의 관용적 비통함을 한국어에서는 가장 강한 상실 이미지인 ‘외아들’로 옮겨, 애도의 강도를 유지했습니다.
- source_word: מִסְפַּד תַּמְרוּרִים
  english_pob_choice: a most bitter lamentation
  chosen_korean: 가장 쓰라린 애곡
  alternatives_korean:
  - 몹시 쓰라린 애곡
  - 쓰라림의 애곡
  lexicon: HALOT
  rationale: מִסְפַּד의 장송적 ‘애곡’을 살리고, תַּמְרוּרִים의 강한 쓰라림을 ‘가장 쓰라린’으로 반영했습니다.
- source_word: הַשֹּׁדֵד
  english_pob_choice: the destroyer
  chosen_korean: 파괴자
  alternatives_korean:
  - 멸망시키는 자
  - 약탈자
  lexicon: HALOT
  rationale: 문맥상 단순 약탈보다 심판적 파괴의 폭이 크므로, ‘파괴자’가 가장 포괄적으로 맞습니다.
theological_decisions:
- issue: 열방의 재난 앞에서 예언자가 공동체에 자신을 포함시키는 1인칭 복수
  chosen_reading: ‘우리 위로 올 것이기 때문입니다’로 유지했습니다.
  alternative_readings:
  - ‘너희 위로 올 것이기 때문입니다’로 평탄화할 수 있습니다.
  rationale: 히브리어의 עָלֵינוּ는 예언자가 백성과 함께 재앙을 받는다는 연대감을 드러내므로, 이를 보존하는 것이 수사와 신학 모두에 중요합니다.
  doctrine_reference: 예언자적 연대와 공동체적 심판 이해
