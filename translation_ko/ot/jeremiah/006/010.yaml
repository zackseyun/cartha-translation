id: JER.6.10
reference: Jeremiah 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל מִ֨י אֲדַבְּרָ֤ה וְ/אָעִ֨ידָה֙ וְ/יִשְׁמָ֔עוּ הִנֵּה֙ עֲרֵלָ֣ה אָזְנָ֔/ם וְ/לֹ֥א יוּכְל֖וּ לְ/הַקְשִׁ֑יב הִנֵּ֣ה דְבַר יְהוָ֗ה הָיָ֥ה לָ/הֶ֛ם לְ/חֶרְפָּ֖ה לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/010.yaml
  text: To whom shall I speak and give warning[a], that they may hear? Look, their ear is uncircumcised, and they are not able to listen. Look, the word of Yahweh has become a reproach to them[b]; they take no delight in it.
  footnotes:
  - marker: a
    text: Hebrew 'their ear is uncircumcised,' a metaphor for being spiritually unresponsive or unwilling to heed.
    reason: cultural_note
  - marker: b
    text: Or 'and testify' / 'and bear witness' for 'give warning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 누구에게 말하며 경고하여 그들이 들을 수 있겠습니까? 보십시오, 그들의 귀는 할례받지 않았고 듣는 데에 귀를 기울일 수 없습니다. 보십시오, 야훼의 말씀이 그들에게는 수치가 되었고 그들은 그것을 기뻐하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 귀는 할례받지 않았다’는 영적으로 무감각하고 언약적으로 응답하지 않는 상태를 가리키는 비유입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘경고하여’가 아니라 ‘증언하여’ / ‘증거하여’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִי אֲדַבְּרָה
  english_pob_choice: To whom shall I speak
  chosen_korean: 내가 누구에게 말하며
  alternatives_korean:
  - 내가 누구에게 말해야 합니까
  - 내가 누구와 말하겠습니까
  lexicon: HALOT
  rationale: 수사적 질문의 deliberative force를 살리되, 한국어에서는 자연스러운 의문형으로 옮겼습니다.
- source_word: וְאָעִידָה
  english_pob_choice: and give warning
  chosen_korean: 경고하여
  alternatives_korean:
  - 증언하여
  - 증거하여
  lexicon: HALOT
  rationale: 예언자적 문맥에서 단순한 ‘증언’보다 실제적 경고의 의미가 강하므로, 그 기능을 드러내는 표현을 택했습니다.
- source_word: עֲרֵלָה אָזְנָם
  english_pob_choice: their ear is uncircumcised
  chosen_korean: 그들의 귀는 할례받지 않았고
  alternatives_korean:
  - 그들의 귀는 할례받지 않았습니다
  - 그들의 귀는 닫혀 있고
  lexicon: HALOT
  rationale: 언약적·신체적 이미지를 보존해 영적 무감각이라는 함의를 평면화하지 않도록 했습니다.
- source_word: לְהַקְשִׁיב
  english_pob_choice: to listen
  chosen_korean: 듣는 데에 귀를 기울일 수 없습니다
  alternatives_korean:
  - 들을 수 없습니다
  - 주의를 기울일 수 없습니다
  lexicon: HALOT
  rationale: 반복된 ‘듣다’와의 평행을 살리면서, 히브리어의 ‘주의를 기울이다’는 동작성을 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: POB의 확정 용례를 따라 신명은 ‘야훼’로 옮겨, 원문 고유명을 보존했습니다.
theological_decisions:
- issue: ‘uncircumcised ear’ 이미지 유지
  chosen_reading: 직역에 가까운 ‘그들의 귀는 할례받지 않았고’로 유지했습니다.
  alternative_readings:
  - 그들은 영적으로 귀먹었고
  - 그들은 완고하여 듣지 못합니다
  rationale: 언약적 몸 이미지를 유지해야 예언의 책망이 지닌 신학적 날카로움이 살아납니다. 설명은 각주로 보완할 수 있지만 본문은 원문의 비유를 보존하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 6
