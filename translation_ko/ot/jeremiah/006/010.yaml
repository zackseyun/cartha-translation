revisions:
- from: 내가 누구에게 말하며 경고하여 그들이 들을 수 있겠습니까? 보십시오, 그들의 귀는 할례받지 않았고 듣는 데에 귀를 기울일 수 없습니다. 보십시오, 야훼의 말씀이 그들에게는 수치가 되었고 그들은 그것을 기뻐하지 않습니다.[a][b]
  to: 내가 누구에게 말하고 경고하여[b] 그들이 듣게 하겠습니까? 보십시오, 그들의 귀는 할례받지 않아[a] 귀를 기울일 수 없습니다. 보십시오, 야훼의 말씀이 그들에게 치욕거리가 되었으며, 그들은 그것을 기뻐하지 않습니다.
  rationale: 목적을 나타내는 수사적 질문을 한국어에서 자연스럽게 복원하고, ‘귀를 기울이다’의 중복을 제거했습니다. 또한 חֶרְפָּה의 멸시/치욕 의미를 ‘치욕거리’로 반영했으며, 두 각주를 실제로 설명하는 어구에 각각 배치했습니다.
