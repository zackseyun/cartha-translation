id: JER.6.19
reference: Jeremiah 6:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְעִ֣י הָ/אָ֔רֶץ הִנֵּ֨ה אָנֹכִ֜י מֵבִ֥יא רָעָ֛ה אֶל הָ/עָ֥ם הַ/זֶּ֖ה פְּרִ֣י מַחְשְׁבוֹתָ֑/ם כִּ֤י עַל דְּבָרַ/י֙ לֹ֣א הִקְשִׁ֔יבוּ וְ/תוֹרָתִ֖/י וַ/יִּמְאֲסוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/019.yaml
  text: 'Hear[a], O earth: behold, I am bringing disaster on this people, the fruit of their thoughts, because they have not listened to my words[b], and they have rejected my law.'
  footnotes:
  - marker: a
    text: Or 'the fruit of their schemes' or 'the outcome of their plans.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my instruction.' Hebrew torah can mean 'law' or 'instruction'; here 'law' was chosen to preserve the covenantal force of the charge.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅이여, 들으십시오. 보십시오, 내가 이 백성에게 재앙, 곧 그들의 생각의 열매[a]를 가져오고 있습니다. 그들이 내 말에 귀를 기울이지 않고 내 율법[b]을 버렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘생각의 열매’는 ‘그들의 계획의 결과’ 또는 ‘그들의 궁리의 산물’로도 옮길 수 있습니다. 여기서는 원문의 은유를 넓게 살리기 위해 ‘생각의 열매’를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 ‘교훈’ 또는 ‘가르침’으로도 옮길 수 있습니다. 여기서는 언약적·판결적 무게를 보존하기 위해 ‘율법’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי הָאָרֶץ
  english_pob_choice: Hear, O earth
  chosen_korean: 땅이여, 들으십시오
  alternatives_korean:
  - 들으십시오, 땅이여
  - 땅아, 들어라
  lexicon: WLC; HALOT
  rationale: ‘땅’은 הארץ의 직접적 대상이면서 증언자 역할을 하는 인격화된 호칭으로 이해되므로, 예언적 소환의 힘을 살려 호격과 명령형으로 옮겼습니다.
- source_word: מֵבִיא רָעָה
  english_pob_choice: I am bringing disaster
  chosen_korean: 재앙을 가져오고 있으니
  alternatives_korean:
  - 재난을 가져오고 있으니
  - 악을 가져오고 있으니
  lexicon: WLC; HALOT
  rationale: רָעָה는 여기서 도덕적 ‘악’이 아니라 심판으로서의 해를 뜻하므로, 현대 한국어에서 판결적·예언적 뉘앙스를 담는 ‘재앙’이 가장 적절합니다.
- source_word: פְּרִי מַחְשְׁבוֹתָם
  english_pob_choice: the fruit of their thoughts
  chosen_korean: 그들의 생각의 열매
  alternatives_korean:
  - 그들의 계획의 열매
  - 그들의 궁리의 결과
  lexicon: WLC; HALOT
  rationale: ‘생각’은 תַּחְשָׁבוֹת의 범위를 넓게 살리면서도, 문맥의 부정적 함의를 과도하게 좁히는 ‘계획’보다 원문 은유를 더 직접적으로 보존합니다.
- source_word: עַל דְּבָרַי לֹא הִקְשִׁיבוּ
  english_pob_choice: they have not listened to my words
  chosen_korean: 내 말에 귀를 기울이지 않았고
  alternatives_korean:
  - 내 말을 듣지 않았고
  - 내 말에 주의를 기울이지 않았고
  lexicon: WLC; HALOT
  rationale: הקשיב는 단순 청취보다 ‘주의 깊게 듣다’의 뉘앙스가 있어, ‘귀를 기울이지 않았다’로 옮겨 불순종의 전단계인 무시를 드러냈습니다.
- source_word: וְתוֹרָתִי
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 교훈
  - 내 가르침
  lexicon: WLC; HALOT
  rationale: תּוֹרָה를 예언적 언약 문맥에서 ‘율법’으로 옮겨, 야훼의 구속력 있는 언약 표준이라는 무게를 보존했습니다.
theological_decisions:
- issue: פְּרִי מַחְשְׁבוֹתָם의 심판-인과 구조
  chosen_reading: 재앙이 그들의 생각의 열매로 주어진다는 인과적 진술로 유지했습니다.
  alternative_readings:
  - 그들의 계획이 낳은 결과로 풀어 설명함
  - 재앙이 그들의 행위에 대한 보응임을 명시함
  rationale: 본문은 재앙의 성격을 인간 내면의 산물과 연결해 말하므로, 이를 도덕적 해설로 바꾸지 않고 은유 자체를 유지하는 것이 원문 충실성에 더 가깝습니다.
  doctrine_reference: 예언서의 보응/심판 표현을 은유를 해치지 않는 범위에서 보존하는 번역 원칙
- issue: תּוֹרָה의 번역
  chosen_reading: ‘율법’으로 번역해 언약적 권위를 드러냈습니다.
  alternative_readings:
  - ‘교훈’ 또는 ‘가르침’으로 완화함
  rationale: 이 구절은 단순 정보 전달이 아니라 야훼의 명령과 언약 표준을 거절한 죄를 고발하므로, ‘율법’이 판결적 무게를 더 정확히 반영합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
