  - severity: low
    issue: ‘이곳은’은 원문의 ‘그/이 도시는’보다 도시 명사를 덜 분명하게 나타냅니다.
    rationale: הִיא הָעִיר의 강조된 도시 지시를 한국어에서도 ‘이 도시는’으로 보존하는 편이 더 충실합니다.
