id: JER.6.6
reference: Jeremiah 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּרְת֣וּ עֵצָ֔ה וְ/שִׁפְכ֥וּ עַל יְרוּשָׁלִַ֖ם סֹלְלָ֑ה הִ֚יא הָ/עִ֣יר הָפְקַ֔ד כֻּלָּ֖/הּ עֹ֥שֶׁק בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/006.yaml
  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
  footnotes:
  - marker: a
    text: Or “cast up a siege mound/embankment against Jerusalem.” The Hebrew literally says “pour out a siege ramp,” an idiom for building siege works.
    reason: lexical_alternative
  - marker: b
    text: Or “This is the city to be visited,” with “visited” meaning called to account in judgment.
    reason: alternative_reading
translation:
  language: ko
  text: “만군의 야훼께서 이렇게 말씀하십니다. 나무들을 베어 내고, 예루살렘을 향해 공성토를 쌓아 올리십시오. 이곳은 벌을 받아야 할 도시입니다[b]; 그 안에는 오직 억압만 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “공성토를 붓다”라고 되어 있으며, 공성 공사를 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “벌을 받아야 할” 대신 “방문받아야 할”로도 옮길 수 있으나, 여기서는 심판의 뜻을 분명히 했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의
  - 야훼께서 만군의 하나님이십니다
  lexicon: HALOT
  rationale: 하나님의 고유명사 יְהוָה는 프로젝트 기본값인 ‘야훼’로, צְבָאוֹת는 군사적·천상적 포괄성을 살려 ‘만군’으로 옮겼습니다.
- source_word: כִּרְתוּ עֵצָה
  english_pob_choice: Cut down trees
  chosen_korean: 나무들을 베어 내고
  alternatives_korean:
  - 나무를 잘라 내고
  - 목재를 베어 내고
  lexicon: HALOT
  rationale: 공성전 문맥에서 עֵצָה는 집합적으로 ‘나무들’로 이해하는 것이 자연스럽고, 명령형의 군사적 긴박함을 살려 ‘베어 내고’로 옮겼습니다.
- source_word: וְשִׁפְכוּ ... סֹלְלָה
  english_pob_choice: heap up a siege ramp
  chosen_korean: 공성토를 쌓아 올리십시오
  alternatives_korean:
  - 포위 둔덕을 쌓으십시오
  - 공성 둔덕을 쌓아 올리십시오
  - 공성 축대를 쌓으십시오
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘붓다’는 공성 장비를 흙으로 쌓는 관용적 표현이므로, 현대 한국어에서 기능을 드러내는 ‘공성토를 쌓아 올리다’로 옮겼습니다.
- source_word: הָפְקַד
  english_pob_choice: must be punished
  chosen_korean: 벌을 받아야 할
  alternatives_korean:
  - 처벌받도록 되어 있는
  - 징계를 받아야 할
  - 돌봄을 받아야 할
  lexicon: HALOT
  rationale: פקד는 여기서 중립적 ‘방문’이 아니라 심판적 처벌을 뜻하므로, POB의 판정에 맞춰 judicial force를 드러내는 ‘벌을 받아야 할’로 옮겼습니다.
- source_word: כֻּלָּהּ עֹשֶׁק בְּקִרְבָּהּ
  english_pob_choice: there is nothing but oppression within her
  chosen_korean: 그 안에는 오직 억압만 있습니다
  alternatives_korean:
  - 그 안은 온통 억압뿐입니다
  - 그 한가운데는 오직 착취만 있습니다
  - 그 안에는 온통 압제뿐입니다
  lexicon: HALOT
  rationale: כֻּלָּהּ의 총체성을 살리면서, עיר를 여성형으로 의인화한 ‘그 안’으로 자연스럽게 옮기고 עֹשֶׁק은 문맥상 ‘억압’으로 번역했습니다.
theological_decisions:
- issue: הָפְקַד의 심판적 의미
  chosen_reading: ‘벌을 받아야 할’로 옮겨, 예루살렘이 단순히 점검받는 것이 아니라 하나님의 사법적 심판 아래 있음을 드러냈습니다.
  alternative_readings:
  - ‘방문받아야 할’
  - ‘조사받아야 할’
  - ‘책임을 추궁받아야 할’
  rationale: 예언자적 포위 맥락에서는 פקד가 중립적 방문이 아니라 유죄 판결과 처벌을 포함한 심판을 가리키므로, 한국어도 그 강도를 분명히 해야 합니다.
  doctrine_reference: prophetic judgment / divine visitation
- issue: 명령형의 군사적 비유
  chosen_reading: ‘나무들을 베어 내고, 예루살렘을 향해 공성토를 쌓아 올리십시오’로, 원문이 요구하는 포위 공사 지시의 긴박한 어조를 유지했습니다.
  alternative_readings:
  - ‘나무를 베고 성토를 쌓으십시오’
  - ‘나무를 베어 포위를 준비하십시오’
  rationale: 이 절은 실제 전투 준비를 지시하는 비유이므로, 완곡하게 일반화하기보다 공성전 이미지를 직접 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: prophetic imagery
