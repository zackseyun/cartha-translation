revisions:
- from: “만군의 야훼께서 이렇게 말씀하십니다. 나무들을 베어 내고, 예루살렘을 향해 공성토를 쌓아 올리십시오. 이곳은 벌을 받아야 할 도시입니다[b]; 그 안에는 오직 억압만 있습니다.”[a]
  to: “만군의 야훼께서 이렇게 말씀하십니다. ‘나무들을 베어 내고, 예루살렘을 향해 공성토를 쌓아 올리십시오.[a] 이 도시는 벌을 받아야 할 도시입니다.[b] 그 안은 온통 억압뿐입니다.’”
  rationale: 각주 표지를 해당 본문 어구에 바로 연결하도록 바로잡았습니다. 또한 도시를 명시하고, 도시 내부가 전적으로 억압으로 가득하다는 히브리어의 강조를 자연스러운 한국어로 보존했습니다. 심판적 ‘방문’이라는 대안은 한국어 관용에 맞게 설명하되, 본문의 ‘벌을 받아야 할’ 번역은 유지했습니다.
  reviewer_model: gpt-5.6-terra
