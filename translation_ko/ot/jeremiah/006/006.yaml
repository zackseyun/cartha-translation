  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 הִיא הָעִיר는 ‘이곳’보다 ‘이 도시는’으로 옮겨 עיר(도시)를 분명히 하는 편이 낫고, כֻּלָּהּ עֹשֶׁק의 총체성은 ‘온통 …뿐입니다’로 더 직접적으로 드러낼 수 있습니다.
  naturalness: 현대 합쇼체의 명령과 서술은 자연스럽습니다. ‘공성토’는 전문적이지만 공성전 문맥에서 이해 가능한 정확한 용어입니다. 각주 표지는 해당 어구 바로 뒤에 배치되어야 합니다.
  terminology: ‘만군의 야훼’, ‘공성토’, ‘억압’은 적절합니다. הָפְקַד의 심판적 의미를 ‘벌을 받아야 할’로 밝힌 선택도 문맥에 맞습니다. 대안 각주의 ‘방문받아야 할’은 한국어로 부자연스러우므로 ‘심판을 위해 찾아오심을 받을’로 설명하는 것이 좋습니다.
