id: JER.6.22
reference: Jeremiah 6:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֛ה עַ֥ם בָּ֖א מֵ/אֶ֣רֶץ צָפ֑וֹן וְ/ג֣וֹי גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/022.yaml
  text: 'Thus says Yahweh: Behold[a], a people is coming from the land of the north, and a great nation is stirred up from the farthest parts of the earth.'
  footnotes:
  - marker: a
    text: Or 'from the ends of the earth' or 'from the remote parts of the land.' The Hebrew expression refers to the extremities or far reaches.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「보라[a], 북쪽 땅에서 한 백성이 오고 있고, 땅의 가장 먼 곳에서 큰 나라가 일어나고 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보십시오” 또는 “여기 보십시오”. 히브리어 표현은 주의를 환기하며, 예언의 긴박함을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기는 POB의 원칙에 따라 고유명사로 살려 ‘야훼’로 옮겼습니다. 이는 단순한 호칭 ‘주님’으로 대체하지 않고, 언약의 신적 이름을 드러냅니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 주의를 환기하는 감탄사이므로, 격식을 유지하면서도 한국어에서 자연스러운 ‘보라’로 옮겼습니다.
- source_word: עַם
  english_pob_choice: a people
  chosen_korean: 한 백성
  alternatives_korean:
  - 한 민족
  - 한 나라
  lexicon: HALOT
  rationale: 첫 평행항은 정치적 국가보다 집단성을 드러내는 말이 적절하므로 ‘백성’으로 옮겨 ‘nation’과 구별되는 뉘앙스를 살렸습니다.
- source_word: יֵעוֹר
  english_pob_choice: is stirred up
  chosen_korean: 일으켜지고 있습니다
  alternatives_korean:
  - 자극되고 있습니다
  - 분발하고 있습니다
  - 일어나고 있습니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 동원·소집 뉘앙스를 살리되, 한국어에서 군사적 준비 상태를 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  english_pob_choice: from the farthest parts of the earth
  chosen_korean: 땅의 가장 먼 곳에서
  alternatives_korean:
  - 땅 끝에서
  - 세상의 끝에서
  - 땅의 먼 끝에서
  lexicon: HALOT
  rationale: ‘extremities/farthest parts’라는 관용적 표현을 과장 없이 전달하기 위해 ‘땅의 가장 먼 곳에서’로 옮겼습니다. POB의 선택처럼 거리감과 범위를 함께 보존합니다.
theological_decisions:
- issue: 예언 공식을 한국어로 어떻게 유지할 것인가
  chosen_reading: “야훼께서 이렇게 말씀하십니다”로 번역해, 예언 선포문의 형식을 살리면서 현대 한국어 합쇼체를 유지했습니다.
  alternative_readings:
  - “야훼가 이같이 말씀하십니다”
  - “야훼께서 이같이 말씀하십니다”
  rationale: 히브리어의 공식적 예언 서두 כֹּה אָמַר יְהוָה를 자연스럽고 격식 있게 재현해야 하므로, 선언문의 힘을 약화시키지 않는 현재형 선포문으로 처리했습니다.
  doctrine_reference: 예언 선포문 번역 원칙; YHWH 고유명 표기
