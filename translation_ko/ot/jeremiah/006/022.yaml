  rationale: 각주를 원어 הִנֵּה에 해당하는 ‘보라’에 직접 연결했습니다. 또한 יֵעוֹר를 ‘일어나고 있습니다’로 고쳐 현대 한국어의 자연스러움을 확보하면서, 침공을 위해 일어나는 큰 나라라는 문맥과 원문의 수동·재귀적 여지를 유지했습니다. 기존 각주는 실제로 מִיַּרְכְּתֵי אָרֶץ에 관한 영어 POB 각주였으나, 표지가 영어 본문에서는 ‘Behold’ 뒤에 잘못 놓여 있습니다. 원문 충실성을 위해 한국어 각주는 표지가 놓인 ‘보라’에 맞추어 조정했습니다.
