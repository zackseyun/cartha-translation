id: JER.6.28
reference: Jeremiah 6:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֻּלָּ/ם֙ סָרֵ֣י סֽוֹרְרִ֔ים הֹלְכֵ֥י רָכִ֖יל נְחֹ֣שֶׁת וּ/בַרְזֶ֑ל כֻּלָּ֥/ם מַשְׁחִיתִ֖ים הֵֽמָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/028.yaml
  text: All of them are the most stubborn rebels[a], going about as slanderers; they are bronze and iron[d][c][b]; all of them are corrupters.
  footnotes:
  - marker: a
    text: Or 'chief rebels'; the Hebrew expression is intensive and may be rendered more literally as 'rebels of rebels.'
    reason: lexical_alternative
  - marker: b
    text: Or 'going about with gossip' or 'as talebearers.'
    reason: lexical_alternative
  - marker: c
    text: '''Bronze and iron'' is likely figurative, portraying them as hard, unrefined, or base in character.'
    reason: cultural_note
  - marker: d
    text: Or 'destroyers.' The Hebrew can denote those who ruin or corrupt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 모두는 가장 완고한 반역자들입니다[a]. 돌아다니며 중상하는 자들입니다[b]. 그들은 청동과 철과 같습니다[c]. 그들 모두는 부패시키는 자들입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 강조적이며, 직역하면 ‘반역자들의 반역자들’처럼 들릴 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘중상하는 자들’은 ‘험담하는 자들’이나 ‘이간질하는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘청동과 철’은 문자적 재료명일 가능성도 있지만, 문맥상 단단하고 거칠며 값싼 성품을 비유하는 표현으로 보는 것이 자연스럽습니다.
    reason: cultural_note
  - marker: d
    text: 히브리어는 ‘파괴하는 자들’ 또는 ‘망가뜨리는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  english_pob_choice: All of them
  chosen_korean: 그들 모두는
  alternatives_korean:
  - 그들 전부는
  - 모든 이들은
  lexicon: HALOT
  rationale: 문두 강조를 자연스러운 한국어 전체 표지인 ‘그들 모두는’으로 살렸습니다.
- source_word: סָרֵי סוֹרְרִים
  english_pob_choice: the most stubborn rebels
  chosen_korean: 가장 완고한 반역자들
  alternatives_korean:
  - 반역자 중의 반역자들
  - 우두머리 반역자들
  - 지극히 패역한 자들
  lexicon: HALOT
  rationale: 히브리어의 중첩된 강조를 ‘가장 완고한’으로 옮겨, 단순한 ‘반역자들’보다 더 강한 반역성을 드러냈습니다.
- source_word: הֹלְכֵי רָכִיל
  english_pob_choice: going about as slanderers
  chosen_korean: 돌아다니며 중상하는 자들입니다
  alternatives_korean:
  - 돌아다니며 험담하는 자들입니다
  - 다니며 이간질하는 자들입니다
  - 다니며 참소하는 자들입니다
  lexicon: HALOT
  rationale: 습관적 행동을 나타내는 분사를 ‘돌아다니며’로, רָכִיל의 해로운 말하기를 ‘중상’으로 옮겼습니다.
- source_word: נְחֹשֶׁת וּבַרְזֶל
  english_pob_choice: bronze and iron
  chosen_korean: 청동과 철과 같습니다
  alternatives_korean:
  - 동과 철과 같습니다
  - 구리와 철과 같습니다
  - 청동과 쇠와 같습니다
  lexicon: HALOT
  rationale: 물질명은 관용적으로 통용되는 ‘청동과 철’을 택해, 강하고 거친 성격을 비유하는 이미지를 살렸습니다.
- source_word: מַשְׁחִיתִים
  english_pob_choice: corrupters
  chosen_korean: 부패시키는 자들입니다
  alternatives_korean:
  - 파괴하는 자들입니다
  - 망가뜨리는 자들입니다
  - 타락시키는 자들입니다
  lexicon: HALOT
  rationale: ‘destroyers’보다 넓은 파괴·부패의 뜻을 살려, 도덕적 훼손의 뉘앙스가 드러나는 표현을 택했습니다.
