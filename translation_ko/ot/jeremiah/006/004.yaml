  text: קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ מִלְחָמָ֔ה ק֖וּמוּ וְ/נַעֲלֶ֣ה בַֽ/צָּהֳרָ֑יִם א֥וֹי לָ֨/נוּ֙ כִּי פָנָ֣ה הַ/יּ֔וֹם כִּ֥י יִנָּט֖וּ צִלְלֵי עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/004.yaml
  text: Consecrate war against her; rise up[a], and let us go up at noon. Woe to us, for the day is turning away, for the shadows of evening are stretching out.
  footnotes:
  - marker: a
    text: Or 'Prepare for war against her.' The Hebrew literally uses consecration language for battle.
    reason: lexical_alternative
translation:
  language: ko
  text: “그녀를 향하여 전쟁을 거룩하게 하십시오. 일어나십시오. 그리고 우리가 정오에 올라가겠습니다. 아, 우리에게 화가 있습니다. 낮이 저물어 가고, 저녁의 그림자들이 길어지고 있기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 향하여 전쟁을 준비하십시오.’ 히브리어는 전쟁을 말할 때 거룩하게 하는 언어를 문자적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְּשׁוּ ... מִלְחָמָה
  english_pob_choice: Consecrate war
  chosen_korean: 전쟁을 거룩하게 하십시오
  alternatives_korean:
  - 전쟁을 준비하십시오
  - 전쟁을 성별하십시오
  lexicon: HALOT
  rationale: קדשׁ의 성전적/전쟁적 용법을 살리되, 한국어에서는 ‘거룩하게 하다’가 sacralized warfare의 긴장을 가장 직접적으로 드러냅니다.
- source_word: עָלֶיהָ
  english_pob_choice: against her
  chosen_korean: 그녀를 향하여
  alternatives_korean:
  - 그녀에게
  - 그녀에 대하여
  lexicon: HALOT
  rationale: 문맥상 예루살렘을 가리키는 여성 단수에 대해 적대 방향을 나타내므로, 직역적이면서도 자연한 ‘향하여’를 택했습니다.
- source_word: פָנָה הַיּוֹם
  english_pob_choice: the day is turning away
  chosen_korean: 낮이 저물어 가고
  alternatives_korean:
  - 낮이 돌아서고
  - 낮이 기울어 가고
  lexicon: HALOT
  rationale: ‘turn away’의 문자적 이미지를 한국어에서 자연스럽게 풀면 해가 지는 방향으로 ‘저물어 가다’가 가장 잘 대응합니다.
- source_word: יִנָּטוּ צִלְלֵי עָרֶב
  english_pob_choice: the shadows of evening are stretching out
  chosen_korean: 저녁의 그림자들이 길어지고 있기 때문입니다
  alternatives_korean:
  - 저녁의 그림자들이 뻗어 가고 있기 때문입니다
  - 저녁 그림자들이 늘어나고 있기 때문입니다
  lexicon: HALOT
  rationale: נטה의 ‘길어지다/뻗다’ 이미지를 살리면서, 한국어 관용으로는 ‘그림자들이 길어지다’가 가장 정확하고 읽기 쉽습니다.
theological_decisions:
- issue: 전쟁을 ‘거룩하게 하다’는 표현의 신학적 뉘앙스
  chosen_reading: ‘전쟁을 거룩하게 하십시오’로 옮겨, 침략자들의 전쟁 준비가 성전적 언어로 말해지는 긴장을 보존했습니다.
  alternative_readings:
  - 전쟁을 준비하십시오
  - 전쟁을 성별하십시오
  rationale: 본문은 전쟁 자체를 정당화하기보다, 아이러니하게도 전쟁을 거룩한 절차처럼 선포하는 적대자들의 말을 기록합니다. ‘거룩하게 하다’가 그 불편한 성전적 수사를 가장 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
