id: JER.6.16
reference: Jeremiah 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה עִמְדוּ֩ עַל דְּרָכִ֨ים וּ/רְא֜וּ וְ/שַׁאֲל֣וּ לִ/נְתִב֣וֹת עוֹלָ֗ם אֵי זֶ֨ה דֶ֤רֶךְ הַ/טּוֹב֙ וּ/לְכוּ בָ֔/הּ וּ/מִצְא֥וּ מַרְגּ֖וֹעַ לְ/נַפְשְׁ/כֶ֑ם וַ/יֹּאמְר֖וּ לֹ֥א נֵלֵֽךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/016.yaml
  text: 'Thus says Yahweh: “Stand by the roads and look[a], and ask for the ancient paths, where the good way is; then walk in it, and find rest for your souls. But they said[b], ‘We will not walk in it.’”'
  footnotes:
  - marker: a
    text: Or 'the paths of old' or 'the everlasting paths.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for your souls'; נֶפֶשׁ can also mean 'selves' or 'lives' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「길가에 서서 살펴보고, 옛길들[a], 곧 좋은 길이 어디에 있는지 물어보십시오. 그 길로 걸어가고, 여러분의 영혼에[b] 안식을 얻으십시오. 그러나 그들은 ‘우리는 그 길로 걷지 않겠습니다’라고 말했습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옛길들’은 ‘오래된 길들’, ‘옛적부터 있던 길들’, 또는 ‘영원한 길들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 네페시(נֶפֶשׁ)는 문맥에 따라 ‘영혼’, ‘자신’, 또는 ‘생명’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 고유명사 여호와 대체어가 아니라 언어학적으로 복원된 신적 이름을 살려, POB 영어의 Yahweh에 맞추어 야훼로 옮겼습니다.
- source_word: עִמְדוּ עַל דְּרָכִים וּרְאוּ
  english_pob_choice: Stand by the roads and look
  chosen_korean: 길가에 서서 살펴보고
  alternatives_korean:
  - 길들 위에 서서 보고
  - 길목에 서서 보십시오
  lexicon: WLC/HALOT
  rationale: ‘서다’와 ‘보다/살펴보다’의 연속 명령을 한국어에서 자연스럽게 살리되, 도로의 분기점에서 방향을 분별하라는 이미지를 과도하게 해석하지 않도록 ‘길가에’로 옮겼습니다.
- source_word: לִנְתִבוֹת עוֹלָם
  english_pob_choice: the ancient paths
  chosen_korean: 옛길들
  alternatives_korean:
  - 오래된 길들
  - 영원한 길들
  lexicon: WLC/HALOT
  rationale: עוֹלָם은 여기서 형이상학적 ‘영원’보다 오래된 전통성을 가리키므로, POB의 ‘ancient paths’를 따라 간결하게 옛길들로 옮겼습니다.
- source_word: מַרְגּוֹעַ לְנַפְשְׁכֶם
  english_pob_choice: rest for your souls
  chosen_korean: 여러분의 영혼이 쉴 곳
  alternatives_korean:
  - 여러분의 혼이 쉴 곳
  - 여러분 자신이 쉴 곳
  lexicon: WLC/HALOT
  rationale: נֶפֶשׁ를 문맥상 내면의 생명/자아를 가리키는 말로 보되, 한국어 성경에서 익숙한 ‘영혼’을 사용해 ‘rest for your souls’의 울림을 살렸습니다.
- source_word: לֹא נֵלֵךְ
  english_pob_choice: We will not walk in it
  chosen_korean: 우리는 그 길로 걷지 않겠습니다
  alternatives_korean:
  - 우리는 걷지 않겠습니다
  - 우리는 그 길로 가지 않겠습니다
  lexicon: WLC/HALOT
  rationale: 히브리어의 ‘걷다’는 삶의 행위를 뜻하므로 단순한 이동이 아니라 길 위의 삶을 거부하는 뜻이 드러나도록 ‘그 길로 걷다’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 언약 이름을 직접 제시하므로, 직함인 ‘주’로 치환하지 않고 고유명사를 보존했습니다. 이는 POB의 신학적·문헌학적 원칙과도 일치합니다.
  doctrine_reference: Tetragrammaton rendering policy
- issue: ‘rest for your souls’의 인류학적 뉘앙스
  chosen_reading: 여러분의 영혼이 쉴 곳
  alternative_readings:
  - 여러분 자신이 쉴 곳
  - 여러분의 생명이 쉴 곳
  rationale: נֶפֶשׁ는 단일한 교리 용어를 강요하기보다 사람의 내면적 삶 전체를 가리킬 수 있으므로, 본문이 약속하는 깊은 안식을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §6
