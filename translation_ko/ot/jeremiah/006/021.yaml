base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
  footnotes:
  - marker: a
    text: Or 'I am placing obstacles in the way of this people.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fathers and sons together; neighbor and his friend.' The verse emphasizes that judgment will overtake all levels of society and family life.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 이 백성 앞에 걸림돌들을 놓겠다.[a] 아버지들과 아들들이 함께 그것들에 걸려 넘어질 것이며, 이웃과 그의 친구는 망할 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 백성의 길에 장애물들을 놓겠다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “아버지들과 아들들이 함께; 이웃과 그의 친구”라고 합니다. 심판이 가족 관계와 이웃 관계에까지 미침을 나타냅니다.
    reason: cultural_note
