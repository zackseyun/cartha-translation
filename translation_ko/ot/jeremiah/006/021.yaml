base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
  footnotes:
  - marker: a
    text: Or 'I am placing obstacles in the way of this people.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fathers and sons together; neighbor and his friend.' The verse emphasizes that judgment will overtake all levels of society and family life.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. 보십시오, 나는 이 백성 앞에 걸림돌들을 두고 있습니다. 그러면 그들이 그것들에 걸려 넘어질 것입니다 — 아버지들과 아들들이 함께, 이웃과 그의 친구가 망할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 백성의 길에 장애물을 두고 있습니다.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “아버지들과 아들들이 함께; 이웃과 그의 친구”라고 하여, 심판이 가족과 사회 모든 층위에 미친다는 뜻을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언에 이어지는 결과를 자연스럽게 잇는 인과 접속사로 가장 직접적입니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 긴박한 어조를 살리면서, 본문의 신명사 יְהוָה를 프로젝트 기본어인 야훼로 옮겼습니다.
- source_word: מִכְשֹׁלִים
  english_pob_choice: stumbling blocks
  chosen_korean: 걸림돌들
  alternatives_korean:
  - 함정들
  - 장애물들
  lexicon: HALOT
  rationale: 물리적 장애가 사람을 넘어지게 하는 비유를 한국어 관용으로 자연스럽게 옮기되, 심판의 도구라는 구체성을 유지했습니다.
- source_word: וְכָשְׁלוּ בָם
  english_pob_choice: and they will stumble over them
  chosen_korean: 그들이 그것들에 걸려 넘어질 것입니다
  alternatives_korean:
  - 그들이 그것들 때문에 넘어질 것입니다
  - 그것들에 걸려 실족할 것입니다
  lexicon: HALOT
  rationale: כשל의 반복된 어감을 살리기 위해 ‘걸려 넘어지다’를 택했고, 대상 대명사 ‘그것들’로 앞선 복수형 걸림돌과 연결했습니다.
- source_word: אָבוֹת וּבָנִים יַחְדָּו
  english_pob_choice: fathers and sons together
  chosen_korean: 아버지들과 아들들이 함께
  alternatives_korean:
  - 아비들과 아들들이 함께
  - 부모와 자녀가 함께
  lexicon: HALOT
  rationale: 히브리어의 남성형 가족 쌍을 그대로 살려, 심판이 세대 전체에 미친다는 점을 약화하지 않도록 했습니다.
- source_word: שָׁכֵן וְרֵעוֹ
  english_pob_choice: neighbor and his friend
  chosen_korean: 이웃과 그의 친구
  alternatives_korean:
  - 이웃과 친구
  - 이웃과 동료
  lexicon: HALOT
  rationale: 두 사회적 관계어의 병렬을 유지하면서, 소유격 ‘그의’로 원문의 문법적 균형을 반영했습니다.
