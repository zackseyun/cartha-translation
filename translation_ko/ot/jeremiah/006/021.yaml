revisions:
- from: 그러므로 야훼께서 이렇게 말씀하십니다. 보십시오, 나는 이 백성 앞에 걸림돌들을 두고 있습니다. 그러면 그들이 그것들에 걸려 넘어질 것입니다 — 아버지들과 아들들이 함께, 이웃과 그의 친구가 망할 것입니다.[a][b]
  to: 그러므로 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 이 백성 앞에 걸림돌들을 놓겠다.[a] 아버지들과 아들들이 함께 그것들에 걸려 넘어질 것이며, 이웃과 그의 친구는 망할 것입니다.[b]”
  rationale: The revision removes the added conditional force, explicitly joins fathers and sons to stumbling, and joins neighbor and friend to perishing. It retains the prophetic register, the Hebrew wordplay of obstacle and stumbling, and the project’s rendering of the divine name. Footnote anchors are placed after the relevant translated material.
