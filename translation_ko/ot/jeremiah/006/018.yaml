  - 그들 가운데 있는 바
  lexicon: HALOT
  rationale: 히브리어의 간결한 구문을 과도하게 풀지 않고, 장소적·관계적 범위를 모두 담을 수 있는 ‘그들 가운데 있는 것’으로 옮겼습니다.
theological_decisions:
- issue: עֵדָה의 호칭 방식
  chosen_reading: ‘회중이여’로 별도의 직접 호칭을 유지했습니다.
  alternative_readings:
  - ‘민족들’에 대한 동격으로 묶어 ‘민족들의 회중’처럼 읽기
  - 본문을 재구성해 다른 대상에게 돌리기
  rationale: 마소라 본문의 여성 단수 명령형과 단수 집합명사를 살려, 난해함을 지우지 않고 예언적 수사로 유지하는 편이 원문 충실도가 높습니다.
  doctrine_reference: 본문비평/원문 의미 보존
- issue: ‘them’의 범위
  chosen_reading: ‘그들 가운데 있는 것’은 그들의 상태나 내부에 있는 현실을 열어 둔 표현으로 두었습니다.
  alternative_readings:
  - ‘그들 안에 있는 것’으로 더 내부적 의미를 고정
  - 구체적 죄악이나 재난으로 특정
  rationale: 히브리어가 매우 압축적이어서 대상의 범위를 단정하기보다, 문맥이 허용하는 심판의 실체를 열어 두는 번역이 적절합니다.
  doctrine_reference: 예언서 문맥
