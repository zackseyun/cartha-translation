id: JER.6.18
reference: Jeremiah 6:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֖ן שִׁמְע֣וּ הַ/גּוֹיִ֑ם וּ/דְעִ֥י עֵדָ֖ה אֶת אֲשֶׁר בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/018.yaml
  text: Therefore hear[a], O nations, and know, O congregation[b], what is among them.
  footnotes:
  - marker: a
    text: Or 'assembly' or 'community' for 'congregation.' The Hebrew עֵדָה is a collective term and its precise referent here is debated.
    reason: lexical_alternative
  - marker: b
    text: Or 'what is in them.' The Hebrew expression is concise and may refer to what is found within them or among them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희 민족들아, 들으십시오. 회중이여, 그들 가운데 있는 것을 아십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 여기서 ‘집회’ 또는 ‘공동체’로도 옮길 수 있습니다. 히브리어 עֵדָה는 집합명사이며, 이 문맥의 정확한 지시 대상은 논의됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들 안에 있는 것’으로도 옮길 수 있습니다. 히브리어 표현은 매우 간결하여 그들 가운데서 발견되는 것인지, 그들 안에 있는 것인지 모두 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언에 대한 결과를 나타내는 담화 표지로, 한국어에서는 ‘그러므로’가 가장 자연스럽고 격식 있는 대응입니다.
- source_word: שִׁמְעוּ
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  - 들으세요
  lexicon: HALOT
  rationale: 예언적 호소의 복수 명령을 현대 표준어 합쇼체로 옮기되, 단순 청각이 아니라 주의 깊은 수용까지 포함할 수 있게 했습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: nations
  chosen_korean: 너희 민족들
  alternatives_korean:
  - 열국
  - 나라들
  - 이방 나라들
  lexicon: HALOT
  rationale: ‘nations’를 직역하되, 한국어에서 예언서의 공적 호소로 자연스러운 ‘민족들’을 택했습니다. ‘이방’은 이 문맥에 없는 대조를 덧붙일 수 있습니다.
- source_word: עֵדָה
  english_pob_choice: congregation
  chosen_korean: 회중
  alternatives_korean:
  - 공동체
  - 회집
  - 모임
  lexicon: HALOT
  rationale: עֵדָה의 집합적 의미를 살리면서도, 여기서는 특정 종교 제도보다 공개적 소집체에 가까워 ‘회중’이 가장 무난합니다.
- source_word: אֶת אֲשֶׁר בָּם
  english_pob_choice: what is among them
  chosen_korean: 그들 가운데 있는 것
  alternatives_korean:
  - 그들 안에 있는 것
  - 그들 가운데 있는 바
  lexicon: HALOT
  rationale: 히브리어의 간결한 구문을 과도하게 풀지 않고, 장소적·관계적 범위를 모두 담을 수 있는 ‘그들 가운데 있는 것’으로 옮겼습니다.
theological_decisions:
- issue: עֵדָה의 호칭 방식
  chosen_reading: ‘회중이여’로 별도의 직접 호칭을 유지했습니다.
  alternative_readings:
  - ‘민족들’에 대한 동격으로 묶어 ‘민족들의 회중’처럼 읽기
  - 본문을 재구성해 다른 대상에게 돌리기
  rationale: 마소라 본문의 여성 단수 명령형과 단수 집합명사를 살려, 난해함을 지우지 않고 예언적 수사로 유지하는 편이 원문 충실도가 높습니다.
  doctrine_reference: 본문비평/원문 의미 보존
- issue: ‘them’의 범위
  chosen_reading: ‘그들 가운데 있는 것’은 그들의 상태나 내부에 있는 현실을 열어 둔 표현으로 두었습니다.
  alternative_readings:
  - ‘그들 안에 있는 것’으로 더 내부적 의미를 고정
  - 구체적 죄악이나 재난으로 특정
  rationale: 히브리어가 매우 압축적이어서 대상의 범위를 단정하기보다, 문맥이 허용하는 심판의 실체를 열어 두는 번역이 적절합니다.
  doctrine_reference: 예언서 문맥
