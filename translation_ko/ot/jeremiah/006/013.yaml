id: JER.6.13
reference: Jeremiah 6:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י מִ/קְּטַנָּ/ם֙ וְ/עַד גְּדוֹלָ֔/ם כֻּלּ֖/וֹ בּוֹצֵ֣עַ בָּ֑צַע וּ/מִ/נָּבִיא֙ וְ/עַד כֹּהֵ֔ן כֻּלּ֖/וֹ עֹ֥שֶׂה שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/013.yaml
  text: For from their least to their greatest[a], every one of them is greedy for unjust gain; and from prophet to priest[c][b], every one of them practices falsehood.
  footnotes:
  - marker: a
    text: Or 'from the least of them to the greatest of them.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'is greedy for gain'; the expression likely implies dishonest or unjust profit.
    reason: lexical_alternative
  - marker: c
    text: Or 'deals falsely' or 'works deceit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들 가운데 가장 작은 자부터 가장 큰 자까지 모두가 부정한 이익을 탐내며, 예언자부터 제사장까지 모두가 거짓을 행하기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 가운데 가장 작은 자부터 가장 큰 자까지’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘이익을 탐하다’입니다. 문맥상 부정하거나 부당한 이익의 뉘앙스가 포함됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘거짓되이 행하다’, ‘속임을 일삼다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְּטַנָּם וְעַד גְּדוֹלָם
  english_pob_choice: from their least to their greatest
  chosen_korean: 그들 가운데 가장 작은 자부터 가장 큰 자까지
  alternatives_korean:
  - 그들 중 작은 자부터 큰 자까지
  - 가장 작은 자에서 가장 큰 자에 이르기까지
  lexicon: HALOT
  rationale: 사회적 범위를 포괄하는 대구법이므로, 한국어에서도 위계 전체를 아우르는 표현으로 옮겼습니다.
- source_word: בּוֹצֵעַ בָּצַע
  english_pob_choice: is greedy for unjust gain
  chosen_korean: 부정한 이익을 탐내며
  alternatives_korean:
  - 부당한 이익을 탐내며
  - 이익을 탐하며
  - 탐욕스럽게 이익을 구하며
  lexicon: HALOT
  rationale: 단순한 '이익'보다, 문맥이 요구하는 도덕적 비난을 살려 부정성을 드러냈습니다.
- source_word: כֻּלּוֹ
  english_pob_choice: every one of them
  chosen_korean: 모두가
  alternatives_korean:
  - 각각이
  - 한 사람도 빠짐없이
  lexicon: HALOT
  rationale: 집합적이면서도 분배적인 뜻을 자연스럽게 살리는 표현으로 처리했습니다.
- source_word: עֹשֶׂה שָּׁקֶר
  english_pob_choice: practices falsehood
  chosen_korean: 거짓을 행하기
  alternatives_korean:
  - 거짓을 일삼기
  - 속임수를 행하기
  - 거짓되이 행하기
  lexicon: HALOT
  rationale: 한 번의 거짓말이 아니라 지속적인 왜곡과 속임의 행위를 가리키므로, 동작성을 살렸습니다.
theological_decisions:
- issue: 예언자와 제사장에 대한 고발의 범위
  chosen_reading: 예언자부터 제사장까지라는 대구를 그대로 살려, 종교 지도층 전체의 타락이라는 선지자적 고발을 드러냈습니다.
  alternative_readings:
  - 예언자와 제사장만을 지칭하는 제한적 비난
  - 종교적 직분을 완화하여 일반적 지도자로 번역
  rationale: 본문은 특정 개인이 아니라 대표 직분 전체의 부패를 고발하므로, 범위를 축소하지 않았습니다.
  doctrine_reference: 예언자적 심판 선언과 공동체 지도층 책임
