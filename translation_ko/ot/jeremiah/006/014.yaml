id: JER.6.14
reference: Jeremiah 6:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְרַפְּא֞וּ אֶת שֶׁ֤בֶר עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/014.yaml
  text: They have healed the wound of my people lightly[a], saying, ‘Peace, peace,’ when there is no peace.
  footnotes:
  - marker: a
    text: Or 'They have healed the brokenness of my people superficially.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 백성의 상처를 가볍게 고치며 “평안하다, 평안하다”라고 말하지만, 평안은 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성의 부서짐을 피상적으로 고쳤다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפְּאוּ
  english_pob_choice: have treated
  chosen_korean: 고치며
  alternatives_korean:
  - 치유하며
  - 낫게 하며
  - 대충 치료하며
  lexicon: HALOT
  rationale: רפא는 기본적으로 ‘고치다/치료하다’이므로, 예언적 비난의 맥락에서 실제로 낫게 한 것이 아니라 상처를 다루는 행위를 드러내는 ‘고치며’를 택했습니다.
- source_word: שֶׁבֶר
  english_pob_choice: wound
  chosen_korean: 상처
  alternatives_korean:
  - 부서짐
  - 깨어짐
  - 파열
  lexicon: HALOT
  rationale: שׁבר은 파열·부서짐·상함을 가리킬 수 있지만, 치료 비유와 자연스럽게 맞고 한국어에서 감정적·사회적 상처까지 아우를 수 있는 ‘상처’가 적절합니다.
- source_word: עַל נְקַלָּה
  english_pob_choice: lightly
  chosen_korean: 가볍게
  alternatives_korean:
  - 피상적으로
  - 사소하게
  - 대수롭지 않게
  lexicon: HALOT
  rationale: 이 표현은 중대한 문제를 경시했다는 뜻이므로, 도덕적 비난을 살리는 직역성 있는 ‘가볍게’가 가장 자연스럽습니다.
- source_word: שָׁלוֹם שָׁלוֹם
  english_pob_choice: Peace, peace
  chosen_korean: “평안하다, 평안하다”
  alternatives_korean:
  - “평안, 평안”
  - “무사하다, 무사하다”
  - “평화롭다, 평화롭다”
  lexicon: HALOT
  rationale: 반복을 그대로 살려 거짓 안심의 강조를 드러냈고, שָׁלוֹם의 넓은 의미를 고려해 교회적 관용어보다 중립적인 ‘평안하다’를 택했습니다.
- source_word: וְאֵין שָׁלוֹם
  english_pob_choice: when there is no peace
  chosen_korean: 평안은 없습니다
  alternatives_korean:
  - 평안이 없는데
  - 평안이 없으나
  - 그러나 평안은 없습니다
  lexicon: HALOT
  rationale: 뒤엎는 현실을 간명하게 드러내기 위해 종결형으로 옮겼으며, 앞의 거짓 선언과 대비가 분명해지도록 했습니다.
theological_decisions:
- issue: 예언적 비난의 아이러니 보존
  chosen_reading: ‘고치며’와 ‘평안하다’의 반복을 살려, 실제 회복 없이 안일한 낙관을 선포하는 지도자들의 죄를 드러내도록 했습니다.
  alternative_readings:
  - ‘치유하다’로 옮기면 실제 회복의 뉘앙스가 강해질 수 있습니다.
  - ‘무사하다’로 바꾸면 샬롬의 폭넓은 의미가 좁아질 수 있습니다.
  rationale: 이 절은 단순한 의학적 진술이 아니라 허위 위로에 대한 예언적 고발이므로, 아이러니와 도덕적 책망이 약해지지 않도록 했습니다.
  doctrine_reference: 예언서 해석 원칙; 번역 신학 §§1, 3, 6
