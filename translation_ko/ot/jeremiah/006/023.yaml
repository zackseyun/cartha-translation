reference: Jeremiah 6:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֶ֣שֶׁת וְ/כִיד֞וֹן יַחֲזִ֗יקוּ אַכְזָרִ֥י הוּא֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/023.yaml
  text: They seize bow and javelin; they are cruel and show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Zion.
  footnotes:
  - marker: a
    text: Or 'arrayed like one man for battle.' The singular כְאִישׁ can be understood either as a warrior-like comparison ('like a man') or as emphasizing unified formation ('like one man').
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 활과 투창을 듭니다. 그들은 잔혹하며 자비를 보이지 않습니다. 그들의 소리는 바다처럼 포효합니다. 그들은 말을 타고, 전쟁을 위해 한 사람처럼 전열을 갖추어, 시온의 딸아, 너를 대적합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁을 위해 전사처럼 전열을 갖추어’로 옮길 수 있습니다. 히브리어 כְאִישׁ은 전사에 빗댄 표현으로, 또는 하나처럼 정렬된 대형을 강조하는 표현으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת וְכִידוֹן יַחֲזִיקוּ
  english_pob_choice: They seize bow and javelin
  chosen_korean: 활과 창을 쥡니다
  alternatives_korean:
  - 활과 투창을 잡습니다
  - 활과 창을 붙잡습니다
  lexicon: HALOT
  rationale: קשת와 כידון은 전투 무기 두 가지를 병렬로 제시하므로, 한국어에서도 간결하게 두 무기를 병렬로 살렸습니다. יַחֲזִיקוּ는 무기를 ‘쥐다/잡다’의 실제적 행동으로 옮기는 것이 자연스럽습니다.
- source_word: אַכְזָרִי הוּא וְלֹא יְרַחֵמוּ
  english_pob_choice: they are cruel and show no mercy
  chosen_korean: 그들은 잔혹하며 자비를 보이지 않습니다
  alternatives_korean:
  - 그들은 잔인하며 불쌍히 여기지 않습니다
  - 그들은 잔혹하며 긍휼을 베풀지 않습니다
  lexicon: HALOT
  rationale: אַכְזָרִי와 רחם의 대조를 살리되, 전쟁 신탁에 어울리는 직설적 표현으로 ‘잔혹하다 / 자비를 보이지 않다’를 택했습니다.
- source_word: קוֹלָם כַּיָּם יֶהֱמֶה
  english_pob_choice: Their sound roars like the sea
  chosen_korean: 그들의 소리는 바다처럼 요란합니다
  alternatives_korean:
  - 그들의 소리는 바다처럼 우렁찹니다
  - 그들의 소리는 바다처럼 울부짖습니다
  lexicon: HALOT
  rationale: קוֹל은 ‘소리’가 가장 중립적이며, יֶהֱמֶה는 단순한 음량보다 떠들썩하고 뒤흔드는 울림을 가리켜 ‘요란하다’로 옮겼습니다.
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  english_pob_choice: and they ride on horses
  chosen_korean: 그들은 말을 타고
  alternatives_korean:
  - 그들은 말 위에 올라
  - 그들은 말에 올라타
  lexicon: HALOT
  rationale: 말을 타는 군사적 이미지가 자연스럽게 드러나도록 평이하게 옮겼습니다.
- source_word: עָרוּךְ כְּאִישׁ לַמִּלְחָמָה
  english_pob_choice: arrayed like a man for battle / like one man for battle
  chosen_korean: 전쟁을 위하여 한 사람처럼 진을 갖추고
  alternatives_korean:
  - 전쟁을 위하여 한 사람같이 정렬하고
  - 전쟁을 위하여 용사처럼 갖추고
  lexicon: HALOT
  rationale: עָרוּךְ는 전투 대열이 ‘정돈된/배열된’ 상태를 뜻하므로 ‘진을 갖추다’로 살렸고, כְאִישׁ의 단수성은 POB 각주를 따라 ‘한 사람처럼’으로 남겼습니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 시온의 딸이여
  alternatives_korean:
  - 시온의 딸
  - 오 시온의 딸이여
  lexicon: HALOT
  rationale: 시온을 여성으로 의인화한 호격 표현을 유지하기 위해 ‘시온의 딸이여’로 옮겼습니다.
theological_decisions:
- issue: כְאִישׁ의 단수 비유를 어떻게 처리할지
  chosen_reading: 전쟁 대형을 이루어 ‘한 사람처럼’ 움직이는 이미지와, 전사의 단일한 태세를 함께 살렸습니다.
  alternative_readings:
  - ‘용사처럼’으로 일반화하기
  - ‘한 사람처럼’만 남기고 대형 이미지를 약화하기
  rationale: 본문은 단수 האיש을 유지한 채 집단적 침공을 묘사하므로, 한국어에서도 단수 이미지를 보존해야 관찰 가능한 긴장이 사라지지 않습니다.
  doctrine_reference: 번역 원칙 §4(원문 긴장 보존) 및 §6(주요 어휘 일관성)
