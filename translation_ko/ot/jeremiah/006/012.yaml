review_pass:
  verdict: revise
  source_fidelity: 원문의 재산·가정 상실 선언과 심판의 근거는 대체로 반영되었습니다. 그러나 יְהוָה는 고유한 신명인데 초안의 ‘주님’은 이를 일반 칭호로 바꾸어 원문 표기를 충분히 보존하지 못합니다. 또한 ‘내 손을 펼치다’보다 נטה의 심판 관용어에는 ‘손을 뻗다’가 자연스럽고, ‘대적하여’의 방향도 드러내는 편이 좋습니다.
  naturalness: 초안의 ‘그들의 집은 다른 사람들에게, 밭과 아내들과 함께’는 쉼표 때문에 수식 관계가 다소 부자연스럽습니다. 병렬 항목을 함께 주어로 처리하면 현대 표준 한국어로 더 명료합니다. ‘야훼의 말씀입니다’는 예언서의 נְאֻם יְהוָה 공식을 자연스러운 합쇼체로 옮깁니다.
  terminology: יְהוָה는 ‘야훼’로 옮겨 원문의 고유명을 보존합니다. נָשִׁים의 문맥상 의미는 ‘아내들’로 유지하되 ‘여자들’이라는 어휘적 가능성을 주석으로 남깁니다. הָאָרֶץ의 문맥상 의미는 ‘그 땅’으로 하되, ‘세상’이라는 대안을 정확히 제시합니다.
  issues:
  - severity: high
    issue: 신명 יְהוָה를 ‘주님’으로 일반화함
