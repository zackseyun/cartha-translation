  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָסַ֤בּוּ בָֽתֵּי/הֶם֙ לַ/אֲחֵרִ֔ים שָׂד֥וֹת וְ/נָשִׁ֖ים יַחְדָּ֑ו כִּֽי אַטֶּ֧ה אֶת יָדִ֛/י עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/012.yaml
  text: Their houses will be turned over to others[a], together with their fields and wives; for I will stretch out my hand against the inhabitants of the land[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'women' instead of 'wives.' The Hebrew נָשִׁים can mean either, but in this context of household and property loss, 'wives' is likely.
    reason: lexical_alternative
  - marker: b
    text: Or 'the inhabitants of the earth.' Hebrew הָאָרֶץ can mean 'the land' or 'the earth'; here the local sense is likely in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 집은 다른 사람들에게, 밭과 아내들과 함께 넘어갈 것입니다[a]. 이는 내가 그 땅의 주민들[b]에게 내 손을 펼칠 것이기 때문입니다. 주님께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여자들’. 히브리어 נָשִׁים은 둘 다 뜻할 수 있으나, 집과 재산의 상실을 말하는 이 문맥에서는 ‘아내들’이 더 그럴듯합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 땅의 사람들’. 히브리어 הָאָרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있으나, 여기서는 지역적 의미가 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָסַבּוּ
  english_pob_choice: will be turned over
  chosen_korean: 넘어갈 것입니다
  alternatives_korean:
  - 넘겨질 것입니다
  - 옮겨질 것입니다
  lexicon: HALOT
  rationale: 재산이 남에게 넘어가는 상실의 결과를 자연스러운 현대 한국어로 드러내면서, 수동적·결과적 의미를 보존했습니다.
- source_word: בָתֵּיהֶם
  english_pob_choice: their houses
  chosen_korean: 그들의 집은
  alternatives_korean:
  - 그들의 집들은
  - 그들의 가옥은
  lexicon: HALOT
  rationale: 집단적 재산 상실의 맥락에서 단수형보다 소유물로서의 '집'이 자연스럽고, '가옥'보다 문맥상 덜 딱딱합니다.
- source_word: וְנָשִׁים
  english_pob_choice: wives
  chosen_korean: 아내들과
  alternatives_korean:
  - 여자들과
  - 여인들과
  lexicon: HALOT
  rationale: 이 절은 집·밭과 함께 빼앗기는 가족/가정의 상실을 말하므로, 문맥상 '아내들'이 가장 구체적입니다.
- source_word: יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: the inhabitants of the land
  chosen_korean: 그 땅의 주민들
  alternatives_korean:
  - 그 땅에 사는 사람들
  - 그 땅의 거주자들
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 '거주하는 자들'이고, הָאָרֶץ는 여기서 보편적 '땅/세상'보다 심판의 대상인 지역적 '땅'이 더 적절하므로 '주민들'로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 주님께서 선언하십니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어로 자연스럽게 살리되, 본문 표기상 주어를 명시하지 않는 종교적 문체를 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 문단은 POB의 영어 본문이 본문 안에서는 직접 이름을 쓰되, 한국어 공인 번역문은 예언자적 종결 공식을 자연스럽게 처리하는 쪽이 읽기 흐름에 유리합니다. 다만 원어상 고유명은 주석/전승층에서 추적 가능해야 합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: הָאָרֶץ의 범위
  chosen_reading: 그 땅
  alternative_readings:
  - 땅
  - 세상
  rationale: 예레미야 6장 문맥은 유다와 그 거민에 대한 가까운 심판이므로, 보편적 '세상'보다 지역적 '그 땅'이 원문 의도에 더 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
