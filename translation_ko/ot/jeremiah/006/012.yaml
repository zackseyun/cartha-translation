revisions:
- from: 그들의 집은 다른 사람들에게, 밭과 아내들과 함께 넘어갈 것입니다[a]. 이는 내가 그 땅의 주민들[b]에게 내 손을 펼칠 것이기 때문입니다. 주님께서 말씀하십니다.
  to: 그들의 집과 밭과 아내들[a]은 함께 다른 이들에게 넘어갈 것입니다. 이는 내가 그 땅의 주민들[b]을 향해 내 손을 뻗을 것이기 때문입니다. 야훼의 말씀입니다.
