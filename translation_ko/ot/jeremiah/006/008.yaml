id: JER.6.8
reference: Jeremiah 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִוָּסְרִי֙ יְר֣וּשָׁלִַ֔ם פֶּן תֵּקַ֥ע נַפְשִׁ֖/י מִמֵּ֑/ךְ פֶּן אֲשִׂימֵ֣/ךְ שְׁמָמָ֔ה אֶ֖רֶץ ל֥וֹא נוֹשָֽׁבָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/008.yaml
  text: Be warned[a], O Jerusalem, lest my soul turn away from you, lest I make you a desolation[b], a land not inhabited.
  footnotes:
  - marker: a
    text: Or 'Be instructed' or 'Accept correction.' The Hebrew verb can denote receiving discipline or correction, not merely being informed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'lest my soul be torn away from you' or 'be alienated from you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘아, 징계를 받아라[a]. 그렇지 않으면 내 영혼이 너에게서 돌아서고[b], 내가 너를 황폐함, 곧 사람이 거주하지 않는 땅으로 만들 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교훈을 받아라’, ‘교정받아라’로 옮길 수 있습니다. 히브리어 동사는 단순한 통보가 아니라 훈육과 교정을 받는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 영혼이 너에게서 찢겨 나가다’ 또는 ‘너에게서 소원해지다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוָּסְרִי
  english_pob_choice: Be warned
  chosen_korean: 징계를 받아라
  alternatives_korean:
  - 경고를 받아라
  - 교훈을 받아라
  - 교정받아라
  lexicon: HALOT
  rationale: 니팔 명령형으로서 단순한 정보 전달이 아니라 교정과 훈육을 받으라는 경고의 뜻이므로, ‘징계를 받아라’가 가장 직접적으로 원문의 권면·책망의 힘을 살립니다.
- source_word: פֶּן
  english_pob_choice: lest
  chosen_korean: 그렇지 않으면
  alternatives_korean:
  - 그리하여
  - 혹시
  - 아니면
  lexicon: HALOT
  rationale: 여기서 פֶּן은 뒤따르는 심판을 막기 위한 부정적 경고를 이끄므로, 한국어에서는 현대적이면서도 경고문의 긴박함을 살리는 ‘그렇지 않으면’이 적절합니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼
  alternatives_korean:
  - 나 자신
  - 내 생명
  - 내 존재
  lexicon: HALOT
  rationale: 히브리어 נֶפֶשׁ는 여기서 하나님의 내적 자아를 가리키는 인격적·감정적 표현이므로, 원문의 이미지와 긴장을 보존하는 ‘내 영혼’으로 옮겼습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐함
  alternatives_korean:
  - 황무지
  - 폐허
  - 황량함
  lexicon: HALOT
  rationale: 명사구 구조를 유지하면서 심판의 상태를 압축적으로 드러내는 표현으로 ‘황폐함’을 택했습니다. 뒤의 ‘사람이 거주하지 않는 땅’이 그 의미를 구체화합니다.
theological_decisions:
- issue: 하나님의 נפש를 그대로 드러내는 표현
  chosen_reading: 내 영혼이 너에게서 돌아서고
  alternative_readings:
  - 내가 너에게서 돌아서고
  - 내 존재가 너에게서 떠나고
  rationale: 원문은 신인동형적 표현인 ‘내 영혼’을 실제로 사용하므로, 이를 평탄화하지 않고 유지하여 하나님과 예루살렘 사이의 언약적 단절 경고를 선명하게 드러냈습니다.
  doctrine_reference: 번역 철학 §3 — 신학적 긴장을 해소하지 말고 보존한다.
