id: JER.19.9
reference: Jeremiah 19:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַֽאֲכַלְתִּ֞י/ם אֶת בְּשַׂ֣ר בְּנֵי/הֶ֗ם וְ/אֵת֙ בְּשַׂ֣ר בְּנֹתֵי/הֶ֔ם וְ/אִ֥ישׁ בְּשַׂר רֵעֵ֖/הוּ יֹאכֵ֑לוּ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֧יקוּ לָ/הֶ֛ם אֹיְבֵי/הֶ֖ם וּ/מְבַקְשֵׁ֥י נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/009.yaml
  text: And I will make them eat the flesh of their sons and the flesh of their daughters[b][a], and each will eat the flesh of his neighbor in the siege and in the distress with which their enemies and those who seek their life will afflict them.
  footnotes:
  - marker: a
    text: Or 'and those who seek their lives'; the Hebrew idiom means those seeking to kill them.
    reason: lexical_alternative
  - marker: b
    text: Or 'during the siege and in the anguish' for 'in the siege and in the distress.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 그들의 아들들의 살과 그들의 딸들의 살을 먹게 하며, 각 사람은 포위와 고통 가운데서 자기 이웃의 살을 먹을 것입니다. 이는 그들의 원수들과 그들의 생명을 찾는 자들이 그들을 괴롭히게 될 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 생명을 찾는 자들’로도 옮길 수 있으며, 히브리어 관용구는 그들을 죽이려는 자들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포위와 고통 중에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲכַלְתִּים
  english_pob_choice: And I will make them eat
  chosen_korean: 내가 ... 먹게 하며
  alternatives_korean:
  - 내가 ... 먹도록 하며
  - 내가 ... 먹이겠다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 단순한 ‘먹이다’보다 ‘먹게 하다’로 옮겨, 야훼의 직접적인 심판 행위를 약화하지 않았습니다.
- source_word: בְּשַׂר
  english_pob_choice: flesh
  chosen_korean: 살
  alternatives_korean:
  - 고기
  - 몸
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지와 끔찍한 심판의 강도를 보존하기 위해 ‘살’이 가장 적절합니다.
- source_word: וְאִישׁ
  english_pob_choice: and each man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각 남자
  - 각자
  lexicon: HALOT
  rationale: 분배적 의미는 살리되 한국어에서는 ‘각 사람’이 가장 자연스럽고 성별에 과도하게 좁혀지지 않습니다.
- source_word: רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 그의 이웃
  - 자기의 동무
  lexicon: HALOT
  rationale: 동일 공동체 안의 타인을 가리키는 표현으로 ‘이웃’이 가장 자연스럽고, 소유 대명사는 한국어에서 ‘자기’로 풀어 주었습니다.
- source_word: בְּמָצוֹר וּבְמָצֹוק
  english_pob_choice: in the siege and in the distress
  chosen_korean: 포위와 고통 가운데서
  alternatives_korean:
  - 포위와 환난 가운데서
  - 공성전과 곤경 속에서
  lexicon: HALOT
  rationale: 두 명사를 한국어로 병렬 유지하기보다 하나의 상황 묶음으로 자연스럽게 풀어, 전쟁 포위 상황의 압박과 고통을 함께 드러냈습니다.
- source_word: וּמְבַקְשֵׁי נַפְשָׁם
  english_pob_choice: and those who seek their life
  chosen_korean: 그들의 생명을 찾는 자들
  alternatives_korean:
  - 그들을 죽이려는 자들
  - 그들의 목숨을 찾는 자들
  lexicon: HALOT
  rationale: נפשׁ의 관용구를 그대로 살려 ‘생명’으로 옮겼고, 죽이려는 의도를 암시하지만 직역을 유지했습니다.
theological_decisions:
- issue: 야훼의 적극적 심판 행위
  chosen_reading: ‘먹게 하며’로 번역하여, 본문의 사역형이 나타내는 직접적 심판 주체성을 유지했습니다.
  alternative_readings:
  - ‘먹도록 허용하며’
  - ‘먹게 두며’
  rationale: 본문은 단순 허용이 아니라 심판을 실행하시는 하나님을 전제하므로, 그 강도를 약화하지 않았습니다.
  doctrine_reference: 예언서의 심판 신학
