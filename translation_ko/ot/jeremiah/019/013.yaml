reference: Jeremiah 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָי֞וּ בָּתֵּ֣י יְרוּשָׁלִַ֗ם וּ/בָתֵּי֙ מַלְכֵ֣י יְהוּדָ֔ה כִּ/מְק֥וֹם הַ/תֹּ֖פֶת הַ/טְּמֵאִ֑ים לְ/כֹ֣ל הַ/בָּתִּ֗ים אֲשֶׁ֨ר קִטְּר֜וּ עַל גַּגֹּֽתֵי/הֶם֙ לְ/כֹל֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/הַסֵּ֥ךְ נְסָכִ֖ים לֵ/אלֹהִ֥ים אֲחֵרִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/013.yaml
  text: The houses of Jerusalem and the houses of the kings of Judah will become like the unclean place of Topheth—all the houses on whose rooftops they burned incense to all the host of heaven and poured out drink offerings to other gods[a][b].
  footnotes:
  - marker: a
    text: Or 'defiled place of Topheth.'
    reason: lexical_alternative
  - marker: b
    text: '''Host of heaven'' refers to the heavenly bodies worshiped in astral idolatry.'
    reason: cultural_note
translation:
  language: ko
  text: 예루살렘의 집들과 유다 왕들의 집들은 도벳의 곳처럼 부정하게 될 것입니다. 이는 그 모든 집의 지붕 위에서 하늘의 모든 천체에게 향을 피우고 다른 신들에게 전제를 부었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부정하게’는 의식적·도덕적 오염을 가리킵니다.
    reason: lexical_note
  - marker: b
    text: ‘하늘의 모든 천체’는 별과 천체를 신격화하여 숭배한 대상을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּתֵּי יְרוּשָׁלִַם
  english_pob_choice: the houses of Jerusalem
  chosen_korean: 예루살렘의 집들
  alternatives_korean:
  - 예루살렘의 가옥들
  - 예루살렘의 집들
  lexicon: HALOT
  rationale: 히브리어의 일반 명사 בָּתִּים을 살려 ‘집들’로 옮기고, 속격 관계는 자연스러운 관형 표현으로 처리했습니다.
- source_word: וּבָתֵּי מַלְכֵי יְהוּדָה
  english_pob_choice: and the houses of the kings of Judah
  chosen_korean: 유다 왕들의 집들
  alternatives_korean:
  - 유다 왕들의 궁전들
  - 유다 왕들의 집들
  lexicon: HALOT
  rationale: 영어 POB처럼 ‘houses’를 그대로 유지해 왕궁으로 과도하게 특정하지 않고, 문맥상 왕실 거처를 포괄하는 표현으로 남겼습니다.
- source_word: כִּמְקוֹם הַתֹּפֶת הַטְּמֵאִים
  english_pob_choice: like the unclean place of Topheth
  chosen_korean: 더럽혀진 도벳의 장소처럼
  alternatives_korean:
  - 부정한 도벳의 장소처럼
  - 더럽혀진 도벳처럼
  lexicon: HALOT
  rationale: English POB의 ‘unclean’은 제의적/도덕적 오염을 함께 띠므로, 한국어에서는 ‘더럽혀진’으로 옮겨 정결 범주를 자연스럽게 드러냈습니다. ‘장소’를 살려 Topheth를 단순 지명 이상으로 표지했습니다.
- source_word: צְבָא הַשָּׁמַיִם
  english_pob_choice: the host of heaven
  chosen_korean: 하늘의 군상
  alternatives_korean:
  - 하늘의 군대
  - 하늘의 군상들
  lexicon: HALOT
  rationale: ‘host of heaven’의 천체 숭배적 함의를 살리면서도 현대 한국어에서 지나치게 군사적으로 들리지 않도록 ‘군상’을 선택했습니다.
- source_word: נְסָכִים
  english_pob_choice: drink offerings
  chosen_korean: 전제물
  alternatives_korean:
  - 붓는 제물
  - 전제 제물
  lexicon: HALOT
  rationale: 제의 용어로서의 표준 대응을 택해 ‘poured out drink offerings’의 숭배 행위를 분명하게 드러냈습니다.
theological_decisions:
- issue: Topheth의 성격을 어떻게 드러낼지
  chosen_reading: ‘더럽혀진 도벳의 장소’로 옮겨, 우상 숭배로 인한 부정과 심판의 자리라는 점을 유지했습니다.
  alternative_readings:
  - ‘부정한 도벳’
  - ‘도벳처럼 더러운 곳’
  rationale: 본문은 예루살렘의 집들이 제의적 오염과 심판의 표지인 Topheth과 같아질 것임을 말하므로, 단순한 물리적 더러움보다 정결/부정의 범주를 살리는 표현이 적절합니다.
  doctrine_reference: 정결/부정 개념과 우상 숭배에 대한 심판
- issue: ‘하늘의 군상’의 번역 톤
  chosen_reading: 천체 숭배 대상임을 드러내기 위해 ‘하늘의 군상’으로 번역했습니다.
  alternative_readings:
  - ‘하늘의 군대’
  - ‘하늘의 천사들’
  rationale: 문맥은 천상 존재 일반보다 별과 천체를 숭배하는 관행을 가리키므로, 한국어에서도 그 문화적 함의를 과장하지 않으면서 살리는 표현이 필요합니다.
  doctrine_reference: 우상 숭배에 대한 예언자적 비판
