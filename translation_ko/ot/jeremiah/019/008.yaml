review_pass:
  verdict: revise
  source_fidelity: 초안은 심판받은 성읍을 향한 경악과 조롱의 반응 및 ‘모든 상처/타격 때문에’라는 인과를 대체로 반영합니다. 그러나 ‘어이없어하며’는 יִשֹּׁם의 경악·충격의 뜻을 충분히 담지 못하고 구어적입니다. 또한 לְשַׁמָּה의 폐허·참상 및 공포를 자아내는 상태를 더 분명히 드러내는 것이 좋습니다.
  naturalness: ‘어이없어하며’는 현대 표준어이지만 이 예언적 심판 문맥에서는 가볍고 구어적입니다. ‘경악하고’가 합쇼체 문체와 문맥에 자연스럽습니다. ‘휘파람과 조롱의 대상’은 히브리어의 소리 이미지를 보존하면서도 한국어에서 뜻이 분명합니다.
  terminology: ‘성읍’, ‘황폐/폐허’, ‘재앙’, ‘휘파람’은 문맥에 적절합니다. מַכּוֹתֶיהָ는 단순 신체 상처보다 성읍에 가해진 타격과 재앙을 가리키므로 본문에서는 ‘재앙’으로 옮기고, 대안 각주에서 ‘상처/타격’을 제시합니다.
  issues:
  - severity: medium
    issue: ‘어이없어하며’의 의미 및 문체
    rationale: יִשֹּׁם은 폐허와 재앙을 보고 ‘경악하다, 크게 놀라다’라는 뜻입니다. ‘어이없다’는 납득하기 어렵거나 황당하다는 현대 구어적 뉘앙스가 강하여 원문의 충격과 참상을 약화합니다.
  - severity: low
    issue: 첫째 결과 명사의 의미를 더 분명히 할 필요
    rationale: שַׁמָּה는 황폐한 상태와 그것이 불러일으키는 경악을 함께 나타냅니다. ‘폐허와 휘파람과 조롱의 대상’은 상태와 반응을 모두 자연스럽게 드러냅니다.
  - severity: low
    issue: 각주 b의 위치
    rationale: ‘놀라며 휘파람을 불 것입니다’라는 대안은 본문의 후반 동사구에 연결하는 편이 독자에게 더 명확합니다.
  revised_text: 내가 이 성읍을 폐허와 휘파람과 조롱의 대상이 되게 하겠습니다[a]. 그곳을 지나가는 사람마다 그 모든 재앙 때문에 경악하고 휘파람을 불 것입니다[b].
  revised_footnotes:
  - marker: a
    text: 또는 ‘황폐와 휘파람의 대상’입니다. 히브리어 명사들은 성읍의 무너진 상태와 그것이 불러오는 경멸을 함께 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘놀라며 휘파람을 불 것입니다.’ 히브리어는 심판받은 폐허를 보고 경악하며 조롱하는 예언적 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘재앙’은 직역하면 ‘상처들’ 또는 ‘타격들’입니다.
    reason: lexical_alternative
  revision_rationale: יִשֹּׁם을 ‘경악하고’로 바로 옮겨 원문의 반응과 격식을 살렸습니다. שַׁמָּה는 ‘폐허’로, לִשְׁרֵקָה는 실제 소리 이미지와 조롱의 기능을 함께 나타내도록 ‘휘파람과 조롱의 대상’으로 옮겼습니다. מַכּוֹתֶיהָ는 문맥상 성읍에 닥친 심판의 타격을 뜻하므로 본문에서는 자연스러운 ‘재앙’을 사용하고 직역 가능성은 각주로 보완했습니다.
