id: JER.19.8
reference: Jeremiah 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתִּי֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את לְ/שַׁמָּ֖ה וְ/לִ/שְׁרֵקָ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכֹּתֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/008.yaml
  text: And I will make this city a horror and an object of hissing[b][a]; everyone who passes by it will be appalled and will hiss because of all its wounds.
  footnotes:
  - marker: a
    text: Or 'a desolation and a hissing.' The Hebrew nouns emphasize both the city's ruined state and the scorn it provokes.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be astonished and whistle/hiss.' The Hebrew uses conventional prophetic imagery for shocked derision at divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 성읍을 황폐와 조롱의 대상이 되게 하겠습니다[a][b]. 지나가는 사람마다 그 성읍 때문에 어이없어하며, 그 모든 상처 때문에 휘파람을 불 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황폐와 휘파람(조롱)의 대상’입니다. 히브리어 명사들은 성읍의 무너진 상태와 그것이 불러오는 경멸을 함께 강조합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘놀라며 휘파람을 불 것입니다.’ 히브리어는 하나님의 심판 앞에서 놀라서 조롱하는 예언적 관용구를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 … 되게 하겠습니다
  alternatives_korean:
  - 내가 … 만들겠습니다
  - 내가 …로 삼겠습니다
  lexicon: HALOT
  rationale: שׂים의 결과적 용법을 살려 단순히 ‘놓다’가 아니라 성읍의 상태를 바꾸는 행위로 옮겼습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: a horror
  chosen_korean: 황폐
  alternatives_korean:
  - 공포
  - 황폐한 곳
  lexicon: HALOT
  rationale: 이 명사는 단순한 폐허 상태와 그로 인한 충격을 함께 담으므로, ‘황폐’로 옮겨 파괴된 상태를 앞에 두었습니다.
- source_word: וְלִשְׁרֵקָה
  english_pob_choice: an object of hissing
  chosen_korean: 조롱의 대상
  alternatives_korean:
  - 휘파람의 대상
  - 쉿소리의 대상
  lexicon: HALOT
  rationale: שרק의 의례적 예언 이미지가 단순한 소음보다 멸시와 조롱의 반응을 가리키므로, 한국어에서는 의미를 드러내는 ‘조롱의 대상’으로 풀었습니다.
- source_word: עַל כָּל מַכֹּתֶיהָ
  english_pob_choice: because of all its wounds
  chosen_korean: 그 모든 상처 때문에
  alternatives_korean:
  - 그 모든 타격 때문에
  - 그 모든 재앙 때문에
  lexicon: HALOT
  rationale: מַכָּה는 여기서 성읍이 입은 타격/상처를 가리키므로, 신체적 이미지가 살아 있는 ‘상처’가 문맥에 가장 자연스럽습니다.
theological_decisions:
- issue: 예언적 심판 이미지인 ‘휘파람/휘파람을 불다’의 처리
  chosen_reading: ‘휘파람을 불 것입니다’로 직역하여, 놀라움과 조롱이 함께 섞인 예언적 반응을 살렸습니다.
  alternative_readings:
  - ‘조롱할 것입니다’
  - ‘휘파람과 비웃음을 보낼 것입니다’
  rationale: 본문의 שָׁרַק는 단순한 놀람보다 심판받은 폐허를 향한 관습적 조롱을 나타내므로, 그 소리 이미지를 보존하는 편이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 예레미야의 심판 예언과 열방의 반응 이미지
