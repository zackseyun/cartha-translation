  to: 그때 예레미야는 야훼께서 그를 예언하도록 보내신 도벳[a]에서 와서, 야훼의 집 뜰에 서서 모든 백성에게 말했습니다.
  rationale: 신명을 ‘야훼’로 바로잡아 원문과 영어 POB의 명시적 번역 결정을 따랐습니다. 관계절을 자연스러운 한국어로 다듬되, 야훼가 예레미야를 도벳으로 보내어 예언하게 하셨다는 원문의 관계를 유지했습니다. 장소 관련 각주 표지는 ‘도벳’에 붙였고, 각주 문구는 의미를 좁히지 않도록 수정했습니다.
