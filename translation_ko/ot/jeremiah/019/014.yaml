  text: Then Jeremiah came from Topheth[a], where Yahweh had sent him to prophesy, and he stood in the court of the house of Yahweh and said to all the people,
  footnotes:
  - marker: a
    text: Topheth was the site associated with Jeremiah's earlier prophetic sign and oracle in this chapter.
    reason: cross_reference
translation:
  language: ko
  text: 그때 예레미야가 여호와께서 그를 그곳에서 예언하게 하려고 보내신 도벳에서 나와, 여호와의 집 뜰에 서서 모든 백성에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 도벳은 이 장에서 예레미야가 이미 이전에 선포한 예언적 표징과 경고의 장소입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא ... מֵהַתֹּפֶת
  english_pob_choice: came from Topheth
  chosen_korean: 도벳에서 나와
  alternatives_korean:
  - 도벳에서 왔습니다
  - 도벳으로부터 나왔습니다
  lexicon: HALOT
  rationale: 히브리어 보어나 영어 POB의 ‘came from’에 맞춰 ‘나와’로 옮기면, 예레미야가 도벳을 떠나 예루살렘 쪽으로 돌아오는 흐름이 자연스럽게 드러납니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주
  lexicon: HALOT
  rationale: 이 본문의 기존 영어 POB는 고유명사적 음역 ‘Yahweh’를 쓰지만, 한국어 교회 독자와의 가독성을 고려해 본문은 ‘여호와’로 표기했습니다.
- source_word: לְהִנָּבֵא
  english_pob_choice: to prophesy
  chosen_korean: 예언하게 하려고
  alternatives_korean:
  - 예언하려고
  - 예언하도록
  lexicon: HALOT
  rationale: 목적을 나타내는 לְ-부정사구를 한국어의 목적 표현 ‘-게 하려고’로 풀어, 보냄의 의도를 분명히 했습니다.
- source_word: בַּחֲצַר בֵּית יְהוָה
  english_pob_choice: in the court of the house of Yahweh
  chosen_korean: 여호와의 집 뜰에
  alternatives_korean:
  - 여호와의 집 뜨락에
  - 여호와의 집 안뜰에
  lexicon: HALOT
  rationale: חצר는 성전 부속 공간의 ‘뜰’로 옮기는 것이 가장 간결하고 자연스럽습니다. ‘집’은 히브리어의 ‘house’ 구조를 살립니다.
theological_decisions:
- issue: 여호와의 이름 표기와 독자 친숙성
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 원천 언어의 고유명칭을 드러내는 ‘야훼’가 원칙적이지만, 한국어 성경 독자에게는 본문 가독성과 누적된 성경적 수용을 고려한 ‘여호와’가 더 직접적으로 읽힙니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
