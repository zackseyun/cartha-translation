id: JER.19.15
reference: Jeremiah 19:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מבי אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל כָּל עָרֶ֔י/הָ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלֶ֑י/הָ כִּ֤י הִקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֖י שְׁמ֥וֹעַ אֶת דְּבָרָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/015.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Behold, I am bringing on this city and on all its towns all the disaster that I have spoken against it[c][b], because they have stiffened their neck so as not to hear my words.'
  footnotes:
  - marker: a
    text: Or 'all its cities.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the calamity'; Hebrew רָעָה here refers to disaster brought in judgment, not moral evil.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'they have stiffened their neck,' an idiom for stubborn refusal.
    reason: cultural_note
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 이 성과 그 모든 성읍에, 내가 그것에 대해 말한 모든 재앙을 가져오겠습니다. 그들이 내 말을 듣지 않으려고 자기 목을 굳게 했기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모든 성읍들’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 רָעָה는 여기서 도덕적 악이 아니라 심판으로 내리는 재앙을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘자기 목을 굳게 하였음’이라는 관용구로, 완고한 거부를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의
  - 만군의 여호와
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת은 하나님의 위엄과 군대적 뉘앙스를 살려 관용적인 ‘만군의’로 처리했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘 하나님
  - 이스라엘의 하느님
  lexicon: HALOT
  rationale: 언약적 소속 관계를 드러내는 소유격 구조를 자연스럽게 살리면서, POB의 ‘the God of Israel’에 대응해 표준적인 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 자, 내가
  lexicon: HALOT
  rationale: 예언 선포의 엄숙한 즉시성을 살리되 현대 한국어에서 지나치게 고어적으로 들리지 않도록 ‘보십시오, 내가’로 처리했습니다.
- source_word: כָּל הָרָעָה
  english_pob_choice: all the disaster
  chosen_korean: 모든 재앙
  alternatives_korean:
  - 모든 악
  - 모든 재난
  lexicon: HALOT
  rationale: 심판 문맥의 רָעָה는 도덕적 ‘악’보다 닥쳐오는 심판의 ‘재앙’이 더 정확하므로, POB의 판단을 한국어로 반영했습니다.
- source_word: הִקְשׁוּ אֶת עָרְפָּם
  english_pob_choice: they have stiffened their neck
  chosen_korean: 자기 목을 굳게 했기 때문입니다
  alternatives_korean:
  - 목을 뻣뻣하게 했기 때문입니다
  - 목을 굳혀 버렸기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 비유를 유지하면서도 자연스러운 한국어가 되도록 ‘굳게 하다’로 옮겼고, 목적절의 의미를 반영해 원인절로 처리했습니다.
- source_word: לְבִלְתִּי שְׁמֹעַ אֶת דְּבָרַי
  english_pob_choice: so as not to hear my words
  chosen_korean: 내 말을 듣지 않으려고
  alternatives_korean:
  - 내 말을 듣지 않도록
  - 내 말씀을 들으려 하지 않으려고
  lexicon: HALOT
  rationale: ‘hear’는 여기서 단순 청각이 아니라 순종적 청취의 거부를 포함하므로, POB처럼 ‘듣지 않으려고’로 옮겨 거부의 의도를 드러냈습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 이 구절의 יְהוָה는 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 신적 고유명사 YHWH를 직접 사용하므로, 한국 교회 전통의 칭호 대체보다 이름 자체를 드러내는 번역이 원문 충실성과 POB의 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 성읍/도시의 범위
  chosen_reading: ‘이 성과 그 모든 성읍’으로 옮겨, 중심 성읍과 종속 지역을 함께 포함하도록 했습니다.
  alternative_readings:
  - 이 성과 그 모든 도시
  - 이 성과 그 모든 마을
  rationale: POB의 ‘all its towns’는 예루살렘 주변의 하위 정주지를 가리키는 뉘앙스를 살린 것으로 보이며, 한국어에서는 ‘성읍’이 이에 가장 근접합니다.
  doctrine_reference: POB lexical decision on כָּל עָרֶיהָ
- issue: ‘hear’의 신학적 뉘앙스
  chosen_reading: ‘듣다’로 유지해, 말씀에 대한 순종 거부를 암시했습니다.
  alternative_readings:
  - 순종하다
  - 들으려 하지 않다
  rationale: 예언자적 문맥에서 ‘듣다’는 단순 청취가 아니라 하나님의 말씀에 대한 반응을 뜻하므로, 의미를 확장해 ‘순종하다’로 바꾸기보다 원문 어휘를 유지하는 편이 더 투명합니다.
  doctrine_reference: Hebrew idiom and prophetic response pattern
