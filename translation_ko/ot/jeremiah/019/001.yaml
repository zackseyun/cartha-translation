  lexicon: HALOT
  rationale: 예언자적 선언 공식을 한국어에서 자연스럽지만 격식을 유지하는 표현으로 옮겼습니다. 현재형 말씀하십니다는 말씀의 즉시성을 살리고, יְהוָה는 프로젝트 기본값대로 야훼로 옮겼습니다.
