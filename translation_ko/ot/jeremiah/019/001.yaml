base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/001.yaml
  text: 'Thus says Yahweh: Go and buy a potter’s earthenware flask[a], and take some of the elders of the people and some of the elders of the priests[b],'
  footnotes:
  - marker: a
    text: Or 'a potter’s clay jar' or 'a potter’s bottle.' The Hebrew בַקְבֻּק refers to a shaped vessel, likely narrow-necked.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the elders of the people and from the elders of the priests,' indicating that Jeremiah is to take representatives from among both groups.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이와 같이 말씀하십니다. "가서 토기장이의 질그릇 물병[a]을 사고, 백성의 장로들과 제사장들의 장로들[b] 가운데서 몇 사람을 데려가십시오."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בַקְבֻּק은 목이 좁은 용기를 가리키며, POB의 ‘flask’처럼 형태를 드러내는 번역도 가능하지만 ‘물병’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘백성의 장로들과 제사장들의 장로들로부터’입니다. 두 집단에서 대표를 데려오라는 부분적 의미를 한국어에서 풀어 옮겼습니다.
    reason: lexical_alternative
