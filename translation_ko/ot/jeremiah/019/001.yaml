- source_word: וּמִזִּקְנֵי הָעָם וּמִזִּקְנֵי הַכֹּהֲנִים
  english_pob_choice: and take some of the elders of the people and some of the elders of the priests
  chosen_korean: 백성의 장로들과 제사장들의 장로들 가운데서 몇 사람을 데려가십시오
  alternatives_korean:
