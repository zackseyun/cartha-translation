  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָבֻ֗/נִי וַֽ/יְנַכְּר֞וּ אֶת הַ/מָּק֤וֹם הַ/זֶּה֙ וַ/יְקַטְּרוּ ב/וֹ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁ֧ר לֹֽא יְדָע֛וּ/ם הֵ֥מָּה וַ/אֲבֽוֹתֵי/הֶ֖ם וּ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מָֽלְא֛וּ אֶת הַ/מָּק֥וֹם הַ/זֶּ֖ה דַּ֥ם נְקִיִּֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/004.yaml
  text: Because they have forsaken me and made this place unrecognizable[a], and have burned incense in it to other gods whom neither they nor their fathers nor the kings of Judah had known, and they have filled this place with the blood of innocents[b],
  footnotes:
  - marker: a
    text: Or 'defiled this place' or 'treated this place as foreign.' The Hebrew verb carries the sense of making something foreign or estranged.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the blood of innocents'; many English versions render this idiomatically as 'innocent blood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 나를 버리고 이 곳을 낯설게 만들었으며, 그 안에서 그들 자신도 그들의 조상들도 유다의 왕들도 알지 못하던 다른 신들에게 향을 피웠고, 이 곳에 무죄한 자들의 피를 채웠기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 곳을 더럽혔다’, 혹은 ‘이 곳을 이방의 것으로 만들었다’. 히브리어 동사는 무언가를 외국적인 것, 낯선 것으로 만드는 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘무죄한 자들의 피’입니다. 많은 번역본은 이를 관용적으로 ‘무죄한 피’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  english_pob_choice: Because
  chosen_korean: …때문입니다
  alternatives_korean:
  - …이므로
  - …때문에
  lexicon: HALOT
  rationale: 원인의 접속을 자연스러운 현대 한국어로 옮기되, 예언자적 고발문의 논리 전개를 유지합니다.
- source_word: וַיְנַכְּרוּ אֶת הַמָּקוֹם הַזֶּה
  english_pob_choice: made this place unrecognizable
  chosen_korean: 이 곳을 낯설게 만들었으며
  alternatives_korean:
  - 이 곳을 외국처럼 만들었으며
  - 이 곳을 더럽혔으며
  - 이 곳을 이방의 것으로 만들었으며
  lexicon: HALOT
  rationale: נכר의 핵심인 ‘낯설게/이방화하다’의 이미지를 살리면서, 한국어로는 ‘낯설게 만들다’가 가장 직접적이고 자연스럽습니다.
- source_word: וַיְקַטְּרוּ ב/וֹ
  english_pob_choice: have burned incense in it
  chosen_korean: 그 안에서 … 향을 피웠고
  alternatives_korean:
  - 그 안에서 … 향을 사르고
  - 그 안에서 … 분향했고
  lexicon: HALOT
  rationale: קטר의 제의적 행위를 ‘향을 피우다’로 옮겨 우상숭배 의식을 분명히 드러내되, 한국어 성경체의 과도한 교회적 상투어는 피했습니다.
- source_word: דַּם נְקִיִּם
  english_pob_choice: the blood of innocents
  chosen_korean: 무죄한 자들의 피
  alternatives_korean:
  - 무죄한 피
  - 무고한 자들의 피
  - 결백한 자들의 피
  lexicon: HALOT
  rationale: 히브리어의 복수 명사형을 살려 사람들을 가리키는 표현을 유지하고, POB의 문맥상 도덕적 무죄성도 분명히 합니다.
theological_decisions:
- issue: ‘this place’에 대한 נכר의 의미를 어떻게 살릴지
  chosen_reading: ‘이 곳을 낯설게 만들었다’로 유지했습니다.
  alternative_readings:
  - ‘이 곳을 더럽혔다’
  - ‘이 곳을 이방의 것으로 만들었다’
  rationale: 본문의 핵심은 단순 오염보다, 원래의 거룩한 용도에서 벗어나 ‘낯선 것’이 되게 한 데 있습니다. 그래서 예배적·관계적 배반의 뉘앙스를 보존했습니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
