reference: Jeremiah 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת כָּ֣כָה אֶשְׁבֹּ֞ר אֶת הָ/עָ֤ם הַ/זֶּה֙ וְ/אֶת הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֤ר יִשְׁבֹּר֙ אֶת כְּלִ֣י הַ/יּוֹצֵ֔ר אֲשֶׁ֛ר לֹֽא יוּכַ֥ל לְ/הֵרָפֵ֖ה ע֑וֹד וּ/בְ/תֹ֣פֶת יִקְבְּר֔וּ מֵ/אֵ֥ין מָק֖וֹם לִ/קְבּֽוֹר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/011.yaml
  text: 'And you shall say to them[a], ‘Thus says Yahweh of hosts: In this way I will break this people and this city, as one breaks a potter’s vessel, which cannot be repaired again[b]; and in Topheth they will bury because there is no place else to bury.’'
  footnotes:
  - marker: a
    text: Or, “as one breaks a potter’s jar.” The Hebrew says “potter’s vessel,” a broader term than “jar.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “that cannot be healed again”; here the sense is that the broken pottery cannot be repaired.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. 「만군의 야훼께서 이렇게 말씀하십니다. 이처럼 나는 이 백성과 이 성을 깨뜨릴 것이니, 마치 토기장이의 그릇을 깨뜨려 다시는 고칠 수 없게 하는 것과 같습니다. 또 그들은 매장할 곳이 없으므로 도벳에서 장사할 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּלִי는 '항아리'보다 넓은 '그릇/용기'를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 לֹא יוּכַל לְהֵרָפֵה עוֹד는 문자적으로는 '다시는 치유될 수 없는'이지만, 여기서는 깨진 토기가 다시 수리되지 못한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주님
  lexicon: HALOT
  rationale: YHWH는 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת은 한국어 성경에서 안정된 관용인 만군으로 처리해 신적 칭호의 장중함을 살렸습니다.
- source_word: כָּכָה
  english_pob_choice: In this way
  chosen_korean: 이처럼
  alternatives_korean:
  - 이와 같이
  - 그렇게
  lexicon: HALOT
  rationale: 앞의 כֹּה('이렇게/이같이')와 구별되는 지시 부사로서, 시행된 표징과 결말을 가리키는 '이처럼'이 가장 자연스럽고 구별도 분명합니다.
- source_word: כְּלִי הַיּוֹצֵר
  english_pob_choice: a potter’s vessel
  chosen_korean: 토기장이의 그릇
  alternatives_korean:
  - 토기장이의 용기
  - 토기장이의 항아리
  lexicon: HALOT
  rationale: כְּלִי는 넓은 의미의 '그릇/기구'이므로 지나치게 좁은 '항아리'보다 포괄적인 '그릇'이 원문의 범위를 더 잘 보존합니다.
- source_word: לֹא יוּכַל לְהֵרָפֵה עוֹד
  english_pob_choice: which cannot be repaired again
  chosen_korean: 다시는 고칠 수 없게
  alternatives_korean:
  - 다시는 회복될 수 없게
  - 다시는 치유될 수 없게
  lexicon: HALOT
  rationale: 동사는 문자적으로는 '치유되다'지만 깨진 토기의 맥락에서는 '고치다'가 직접적입니다. '다시는'은 עוֹד의 반복 불가를 반영합니다.
- source_word: וּבְתֹפֶת
  english_pob_choice: and in Topheth
  chosen_korean: 도벳에서
  alternatives_korean:
  - 도벳에
  - 도벳 안에서
  lexicon: HALOT
  rationale: 도벳은 고유 지명으로 음역하고, 매장 행위의 장소를 자연스럽게 나타내기 위해 '에서'를 선택했습니다.
theological_decisions:
- issue: 예언 인용문의 직접성
  chosen_reading: 하나님이 1인칭으로 선언하시는 심판 문장을 한국어에서도 직설적으로 유지했습니다.
  alternative_readings:
  - 완곡하게 '무너뜨릴 것입니다'로 약화
  - 서술적으로 돌려 말하기
  rationale: 본문은 상징행동의 해석을 통해 야훼의 파괴적 심판을 직접 선포하므로, 의미를 완화하지 않고 1인칭 직설을 보존하는 것이 원문 의도에 충실합니다.
  doctrine_reference: Jeremiah 19:11 contextual judgment oracle
- issue: 마지막 절의 수동/능동 뉘앙스
  chosen_reading: '''그들은 ... 장사할 것입니다''로 능동형을 살렸습니다.'
  alternative_readings:
  - '''장사될 것입니다''로 수동화'
  rationale: 히브리어 יִקְבְּרוּ는 3인칭 복수 능동형이며, 본문은 무덤 공간 부족 때문에 사람들이 실제로 매장 행위를 하는 상황을 말합니다.
  doctrine_reference: WLC verb morphology
