- from: 이처럼 나는 이 장소와 그 주민들에게 행할 것이며, 이 도시를 도벳처럼 만들겠다고 야훼의 말씀이십니다.[a]
  to: 야훼의 말씀입니다. 내가 이곳과 그 주민들에게 이렇게 하여, 이 도시를 도벳처럼 만들겠습니다.[a]
  rationale: 'The revision corrects the Korean rendering of the prophetic formula, improves modern formal-polite fluency, and retains the Hebrew''s sequence: Yahweh''s declaration, action toward the place and its inhabitants, and the result that the city becomes like Topheth. The footnote is clarified while retaining its limited cultural and contextual function.'
