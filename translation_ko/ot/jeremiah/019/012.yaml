id: JER.19.12
reference: Jeremiah 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּֽן אֶעֱשֶׂ֞ה לַ/מָּק֥וֹם הַ/זֶּ֛ה נְאֻם יְהוָ֖ה וּ/לְ/יֽוֹשְׁבָ֑י/ו וְ/לָ/תֵ֛ת אֶת הָ/עִ֥יר הַ/זֹּ֖את כְּ/תֹֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/012.yaml
  text: So I will do to this place[a], declares Yahweh, and to its inhabitants, making this city like Topheth.
  footnotes:
  - marker: a
    text: Topheth was the site in the Valley of Ben Hinnom associated with child sacrifice and later defilement and judgment; the comparison signals that Jerusalem will become a place of horror and uncleanness.
    reason: cultural_note
translation:
  language: ko
  text: 이처럼 나는 이 장소와 그 주민들에게 행할 것이며, 이 도시를 도벳처럼 만들겠다고 야훼의 말씀이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 도벳은 힌놈의 골짜기에 있던 장소로, 아동 제사와 이후의 부정 및 심판과 연관되었습니다. 이 비교는 예루살렘이 공포와 부정의 장소가 될 것을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן אֶעֱשֶׂה
  english_pob_choice: So I will do
  chosen_korean: 이처럼 나는 … 행할 것이며
  alternatives_korean:
  - 그래서 나는 … 하겠습니다
  - 이와 같이 나는 … 하겠습니다
  lexicon: HALOT
  rationale: כֵּן의 이어짐과 עשה의 넓은 의미를 함께 살리되, 한국어에서는 앞선 표징 행위에 대한 대응을 자연스럽게 드러내는 ‘이처럼’과 ‘행할’로 옮겼습니다.
- source_word: לַמָּקוֹם הַזֶּה
  english_pob_choice: to this place
  chosen_korean: 이 장소
  alternatives_korean:
  - 이곳
  - 이 땅
  lexicon: HALOT
  rationale: פְּחִתֵי 문맥에서 대상화된 장소를 직접 가리키므로, ‘이 장소’로 비교적 직역해 심판의 대상으로서의 지정성을 유지했습니다.
- source_word: וּלְיֹשְׁבָיו
  english_pob_choice: and to its inhabitants
  chosen_korean: 그 주민들에게
  alternatives_korean:
  - 그곳에 사는 사람들에게
  - 그 거주자들에게
  lexicon: HALOT
  rationale: יֹשְׁבִים의 의미를 ‘주민들’로 풀어 한국어에서 자연스럽게 하면서, המקום의 소유격을 ‘그’로 반영했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식의 권위를 살리면서, 합쇼체 종결로 현대 한국어 예언문체를 유지했습니다. 본문이 직접 인용이 아니라 서술 종결이므로 ‘말씀이십니다’를 사용했습니다.
- source_word: כְּתֹפֶת
  english_pob_choice: like Topheth
  chosen_korean: 도벳처럼
  alternatives_korean:
  - 도벳 같이
  - 도벳과 같이
  lexicon: HALOT
  rationale: 비교 표지 כ를 한국어 ‘-처럼’으로 옮겨, 도벳이 지닌 오염과 심판의 장소라는 비교 효과를 유지했습니다.
theological_decisions:
- issue: יהוה의 표기와 예언적 선언 형식
  chosen_reading: ‘야훼’로 옮기고, 선언 공식은 ‘말씀이십니다’로 처리했습니다.
  alternative_readings:
  - ‘여호와’로 표기
  - ‘주께서 말씀하십니다’로 완화
  rationale: 프로젝트 기본값에 따라 신명기적 언약명 יהוה를 ‘야훼’로 유지하여 원문 고유명을 보존하고, נְאֻם의 예언 공식은 한국어에서 권위 있는 서술형으로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
