id: JER.19.7
reference: Jeremiah 19:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ֠/בַקֹּתִי אֶת עֲצַ֨ת יְהוּדָ֤ה וִ/ירוּשָׁלִַ֨ם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הִפַּלְתִּ֤י/ם בַּ/חֶ֨רֶב֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/נָתַתִּ֤י אֶת נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
  footnotes:
  - marker: a
    text: Or 'the counsel of Judah and Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'those who seek their life,' that is, those who seek to kill them.
    reason: lexical_alternative
  - marker: c
    text: Or 'the birds of the sky.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이곳에서 내가 유다와 예루살렘의 계획을 좌절시키고, 그들을 그들의 원수들 앞에서 칼에 쓰러지게 하며, 그들의 생명을 찾는 자들의 손에 넘기고, 그들의 시체를 하늘의 새들과 땅의 짐승들의 먹이로 주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 생명을 찾는 자들’은 곧 그들을 죽이려는 자들을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 새들’은 문자적으로는 ‘하늘의 새들/새들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַקֹּתִי
  english_pob_choice: I will frustrate
  chosen_korean: 좌절시키고
  alternatives_korean:
  - 헛되게 하고
  - 무효로 만들고
  - 꺾어 버리고
  lexicon: HALOT
  rationale: בקק의 사역적 의미를 살려, 계획을 무력화한다는 뜻을 자연스럽게 전달했습니다.
- source_word: עֲצַת
  english_pob_choice: the plan
  chosen_korean: 계획
  alternatives_korean:
  - 의논
  - 모의
  - 상담
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘조언’보다 유다와 예루살렘이 세운 의도와 방침을 가리키므로 ‘계획’이 가장 분명합니다.
- source_word: וּבְיַד מְבַקְשֵׁי נַפְשָׁם
  english_pob_choice: and by the hand of those who seek their life
  chosen_korean: 그들의 생명을 찾는 자들의 손에
  alternatives_korean:
  - 그들의 목숨을 노리는 자들의 손에
  - 그들을 죽이려는 자들의 손에
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘생명을 찾다’를 유지해, 단순한 살해 의도를 넘어 생명 자체를 겨냥한 추적이라는 뉘앙스를 보존했습니다.
- source_word: נִבְלָתָם
  english_pob_choice: their corpses
  chosen_korean: 그들의 시체
  alternatives_korean:
  - 그들의 사체
  - 그들의 송장
  lexicon: HALOT
  rationale: 인간의 죽은 몸을 가리키는 נבלה를 한국어의 중립적이고 문어적인 ‘시체’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위의 유지
  chosen_reading: ‘내가 … 좌절시키고 … 쓰러지게 하며 … 넘기고 … 주겠습니다’처럼 1인칭 직접 행위를 그대로 유지했습니다.
  alternative_readings:
  - ‘허락하여 쓰러지게 하겠습니다’처럼 간접화하는 번역
  - 주체성을 약화시키는 완곡한 번역
  rationale: 히브리어 동사열이 하나님의 직접적 심판 행위를 분명히 말하므로, 주권적 심판의 강도를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
