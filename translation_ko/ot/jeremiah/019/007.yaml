    rationale: 히브리어는 ‘그들을 쓰러지게 하겠다’에 이어 ‘칼로… 원수들 앞에서, 그리고 그들의 목숨을 찾는 자들의 손으로’를 병렬합니다. 한국어에서는 ‘목숨을 노리는 자들의 손에 넘기다’가 결과적으로 유사하나, 별도의 ‘넘기다’ 행위를 도입합니다. ‘…의 손으로 그들을 쓰러지게 하다’로 수단 관계를 보존할 수 있습니다.
