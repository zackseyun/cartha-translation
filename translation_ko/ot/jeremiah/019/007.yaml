  source_fidelity: 원문의 첫인칭 신적 심판 선언과 핵심 동작들은 대체로 보존되었습니다. 그러나 וּבְיַד מְבַקְשֵׁי נַפְשָׁם는 앞선 ‘쓰러지게 하다’와 연결되는 행위 주체/수단인데, 초안은 이를 독립된 ‘넘기다’ 동작으로 처리하여 구조를 다소 바꾸었습니다. 또한 ‘생명을 찾는 자들’은 한국어 관용으로 부자연스럽습니다.
  naturalness: ‘그들의 생명을 찾는 자들’은 현대 표준 한국어에서 살해 의도를 뜻하는 표현으로 자연스럽지 않습니다. ‘그들의 목숨을 노리는 자들’이 원문의 관용적 의미를 자연스럽게 전달합니다. ‘하늘의 새들’과 ‘땅의 짐승들’은 본문에서 자연스럽습니다.
  terminology: ‘유다’, ‘예루살렘’, ‘계획’, ‘원수들’, ‘칼’, ‘시체’는 적절합니다. ‘하늘의 새들’에 관한 현행 각주는 본문과 동일한 말을 반복하고 ‘문자적으로는’ 뒤의 ‘하늘의 새들/새들’도 의미 있는 대안을 제시하지 못하므로 삭제하는 것이 타당합니다.
