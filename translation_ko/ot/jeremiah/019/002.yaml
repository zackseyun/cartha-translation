  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
  footnotes:
  - marker: a
    text: Or 'the Gate of Potsherds'; the Hebrew gate name is somewhat uncertain, and some retain it more formally as 'the Harsith Gate.'
    reason: alternative_reading
translation:
  language: ko
  text: 너는 나가서 질그릇 조각 문[a] 어귀에 있는 힌놈의 골짜기로 가십시오. 그곳에서 내가 네게 말할 말들을 선포하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘토기 조각 문’. 히브리어 문 이름은 다소 불확실하며, 일부는 이를 더 형식적으로 ‘하르시트 문’으로 남깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָאתָ
  english_pob_choice: and go out
  chosen_korean: 너는 나가서
  alternatives_korean:
