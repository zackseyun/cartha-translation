source:
  edition: WLC
  text: וְ/יָצָ֨אתָ֙ אֶל גֵּ֣יא בֶן הִנֹּ֔ם אֲשֶׁ֕ר פֶּ֖תַח שַׁ֣עַר ה/חרסות וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דְּבָרִ֖ים אֲשֶׁר אֲדַבֵּ֥ר אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/002.yaml
  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
  footnotes:
  - marker: a
    text: Or 'the Gate of Potsherds'; the Hebrew gate name is somewhat uncertain, and some retain it more formally as 'the Harsith Gate.'
    reason: alternative_reading
translation:
  language: ko
  text: 너는 나가서 힌놈의 골짜기, 곧 도공문 입구에 가서, 내가 네게 말하는 그 말을 거기서 선포하라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도공문’; 히브리어 문 이름은 다소 불확실하며, 일부는 더 형식적으로 ‘하르시트 문’으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָאתָ
  english_pob_choice: and go out
  chosen_korean: 너는 나가서
  alternatives_korean:
  - 그리고 나가라
  - 나가십시오
  - 나가서
  lexicon: HALOT
  rationale: 명령형의 힘을 살리면서도 예언적 지시문에 자연스러운 현대 한국어로 옮겼습니다.
- source_word: גֵּיא בֶן הִנֹּם
  english_pob_choice: the Valley of Ben Hinnom
  chosen_korean: 힌놈의 골짜기
  alternatives_korean:
  - 벤 힌놈의 골짜기
  - 히놈의 골짜기
  - 게헨나
  lexicon: HALOT
  rationale: 지명 요소를 보존하되, 한국어에서 자연스럽고 음역 일관성이 있는 형태로 옮겼습니다. 후대의 종말론적 용례인 ‘게헨나’는 이 구절의 지리적 지시를 흐릴 수 있어 피했습니다.
- source_word: שַׁעַר הַחַרְסוּת
  english_pob_choice: the Potsherd Gate
  chosen_korean: 도공문
  alternatives_korean:
  - 토기문
  - 깨어진 그릇문
  - 도기문
  lexicon: HALOT
  rationale: 문 이름의 핵심 의미를 간결하게 살리되, 본문 주석에서 설명이 필요한 불확실한 지명이라는 점을 반영했습니다. ‘도공문’은 POB의 ‘Potsherd Gate’에 대응하는 직역적 지명 처리입니다.
- source_word: וְקָרָאתָ
  english_pob_choice: and proclaim
  chosen_korean: 선포하라
  alternatives_korean:
  - 외쳐라
  - 공포하라
  - 선언하라
  lexicon: HALOT
  rationale: 예언적 공적 선언의 성격을 살려 ‘선포하다’를 택했습니다. 단순히 말하는 것보다 ציבור적 proclamation의 힘을 더 잘 드러냅니다.
theological_decisions:
- issue: 하나님의 직접 발화의 명령형 처리
  chosen_reading: 하나님이 예레미야에게 주시는 지시를 한국어 명령형으로 직접 옮겼습니다.
  alternative_readings:
  - …가십시오
  - …나갈 것입니다
  rationale: 원문은 예언자에게 주어지는 수행 명령이므로, 청자에게 전달되는 명령성을 유지하는 것이 본문의 기능에 가장 충실합니다.
  doctrine_reference: 예언자 소명과 하나님의 직접 명령(예언서 문맥 일반)
