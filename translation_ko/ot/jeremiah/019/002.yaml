- source_word: גֵּיא בֶן הִנֹּם
  english_pob_choice: the Valley of Ben Hinnom
  chosen_korean: 힌놈의 골짜기
  alternatives_korean:
  - 벤 힌놈의 골짜기
  - 히놈의 골짜기
  - 게헨나
  lexicon: HALOT
  rationale: 지명 요소를 보존하되, 한국어에서 자연스럽고 음역 일관성이 있는 형태로 옮겼습니다. 후대의 종말론적 용례인 ‘게헨나’는 이 구절의 지리적 지시를 흐릴 수 있어 피했습니다.
- source_word: שַׁעַר הַחַרְסוּת
  english_pob_choice: the Potsherd Gate
  chosen_korean: 도공문
  alternatives_korean:
