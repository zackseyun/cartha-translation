lexical_decisions:
- source_word: וְשָׁבַרְתָּ
  english_pob_choice: Then you shall break
  chosen_korean: 그리고 … 깨뜨리십시오
  alternatives_korean:
  - 그런 다음 … 깨십시오
  - 그리고 … 부수십시오
  lexicon: HALOT
  rationale: 예언적 지시문에서 순차적 명령으로 기능하는 동사를 한국어에서는 공손한 명령형으로 살렸습니다. '깨뜨리다'는 물건을 의도적으로 산산이 깨는 행위를 자연스럽게 드러냅니다.
- source_word: הַבַּקְבֻּק
  english_pob_choice: the flask
  chosen_korean: 그 항아리
  alternatives_korean:
  - 그 플라스크
  - 그 병
  lexicon: HALOT
  rationale: 한국어에서 'flask'의 표준 성서 문맥 대응어로는 '항아리'가 가장 자연스럽고, 상징적 행동의 도구로서 크기와 질감을 무리 없이 전달합니다.
- source_word: לְעֵינֵי
  english_pob_choice: before the eyes of
  chosen_korean: 앞에서
  alternatives_korean:
  - 눈앞에서
  - 보는 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 '공개적 목격' 의미를 한국어의 간결한 장소·상황 표현으로 옮겼습니다. 너무 직역하면 어색해질 수 있어 '앞에서'로 처리했습니다.
- source_word: הַהֹלְכִים אֹתָךְ
  english_pob_choice: who are going with you
  chosen_korean: 너와 함께 가는 그 사람들
  alternatives_korean:
  - 너와 함께 가는 사람들
  - 동행하는 사람들
  lexicon: HALOT
  rationale: 현재 분사구의 지속적 동행 의미를 살려 '함께 가는'으로 옮겼고, הָאֲנָשִׁים의 남성형을 반영해 '그 사람들'로 구체화했습니다.
theological_decisions:
- issue: 예언적 명령문의 한국어 화법
  chosen_reading: 직설적 예언 지시를 합쇼체 명령형('깨뜨리십시오')으로 옮겨, 하나님 말씀의 권위는 유지하되 한국어 독자에게는 자연스러운 공적 문체로 표현했습니다.
  alternative_readings:
  - 직설형('깨뜨리게 될 것입니다')
  - 평서형 미래('깨뜨리게 될 것입니다')
  rationale: 히브리어 완료형+와우 접속은 예언적 지시로 기능하므로 단순 미래예측보다 수행적 명령으로 읽는 것이 본문 기능에 더 가깝습니다.
  doctrine_reference: 예언적 명령문과 서술적 미래의 구분
