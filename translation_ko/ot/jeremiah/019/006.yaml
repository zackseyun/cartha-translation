  text: Therefore, look, days are coming, declares the LORD, when this place will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter.
translation:
  language: ko
  text: 그러므로 보십시오, 날들이 옵니다—야훼의 말씀이니—이 곳을 더 이상 도벳과 힌놈의 아들이 있는 골짜기라 부르지 않고, 살육의 골짜기라 부를 것입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘보십시오’는 הִנֵּה의 감탄적 주의 환기 표현을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘힌놈의 아들이 있는 골짜기’는 ‘Ben-hinnom’을 직역해 지명의 구성 요소를 드러낸 것입니다.
    reason: lexical_alternative
