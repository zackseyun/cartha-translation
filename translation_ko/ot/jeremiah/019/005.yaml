revisions:
- from: 그들은 바알의 산당을 세워 자기 아들들을 바알에게 번제물로 삼아 불에 태웠습니다. 그런 일은 내가 명령한 적도, 말한 적도 없으며, 내 마음에 떠오른 적도 없습니다.[a]
  to: 그들은 그들의 아들들을 불에 태워 바알에게 번제물로 바치려고 바알의 산당들을 세웠습니다. 그런 일은 내가 명령한 적도, 말한 적도 없으며, 내 마음에 떠오른 적도 없습니다.[a]
  rationale: 산당을 세운 행위와 아들들을 태워 바알에게 번제물로 바치는 행위 사이의 목적 관계를 ‘…바치려고 … 세웠습니다’로 명시했습니다. ‘마음’ 표현은 유지하고, 그 히브리어 관용구를 설명하는 각주 표지를 해당 표현 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:33Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 ‘바알’, ‘산당’, ‘아들들’, ‘불’, ‘번제물’, 그리고 하나님의 ‘마음’ 표현은 대체로 충실합니다. 그러나 לִשְׂרֹף(‘태우려고/태우기 위하여’)가 나타내는 산당 건립의 목적 관계를 현행문의 단순 과거 서술(‘세워 … 태웠습니다’)보다 더 명확히 드러내는 편이 좋습니다.
  naturalness: ‘자기 아들들’은 문법상 가능하나 이 문맥에서는 ‘그들의 아들들’이 더 자연스럽고 지시 대상이 분명합니다. 또한 각주 표지는 각주가 설명하는 ‘내 마음에 떠오른’ 표현 바로 뒤에 두는 것이 적절합니다.
  terminology: ‘산당’, ‘바알’, ‘번제물’은 표준 한국어 성서 번역에서 자연스럽고 원문의 제의적 의미를 보존합니다. ‘내 마음에 떠오른’은 직역은 아니지만 ‘마음’이라는 인격적·비유적 표현을 유지하는 안전한 관용적 번역입니다.
  issues:
  - severity: medium
    issue: 목적 부정사의 관계가 약화되어 있습니다.
    rationale: 히브리어 לִשְׂרֹף는 ‘바알의 산당들을 세운’ 목적을 나타냅니다. ‘세워 … 태웠습니다’도 문맥상 이해되지만, 두 완료 동작의 병렬 서술로 읽힐 수 있으므로 ‘태워 … 바치려고 세웠습니다’로 목적 관계를 표시하는 것이 원문에 더 가깝습니다.
  - severity: low
    issue: 각주 표지의 위치가 설명 대상과 떨어져 있습니다.
    rationale: 각주는 ‘내 마음에 떠오른’이 히브리어 관용구를 옮긴 표현임을 설명하므로, 해당 구절 직후에 표지를 두어야 합니다.
  revised_text: 그들은 그들의 아들들을 불에 태워 바알에게 번제물로 바치려고 바알의 산당들을 세웠습니다. 그런 일은 내가 명령한 적도, 말한 적도 없으며, 내 마음에 떠오른 적도 없습니다.[a]
