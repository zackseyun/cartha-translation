id: JER.19.5
reference: Jeremiah 19:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנ֞וּ אֶת בָּמ֣וֹת הַ/בַּ֗עַל לִ/שְׂרֹ֧ף אֶת בְּנֵי/הֶ֛ם בָּ/אֵ֖שׁ עֹל֣וֹת לַ/בָּ֑עַל אֲשֶׁ֤ר לֹֽא צִוִּ֨יתִי֙ וְ/לֹ֣א דִבַּ֔רְתִּי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/005.yaml
  text: They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal—something I did not command or speak[a], nor did it arise in my heart.
  footnotes:
  - marker: a
    text: Or, 'nor did it enter my mind.' The Hebrew literally says, 'nor did it come up upon my heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 바알의 산당을 세워 자기 아들들을 바알에게 번제물로 삼아 불에 태웠습니다. 그런 일은 내가 명령한 적도, 말한 적도 없으며, 내 마음에 떠오른 적도 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 마음 위로 올라오지 않았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  english_pob_choice: They have built
  chosen_korean: 세워
  alternatives_korean:
  - 지어
  - 만들어
  lexicon: HALOT
  rationale: 예언적 고발의 완료적 뉘앙스를 살리되, 한국어에서는 산당을 ‘세우다’가 자연스럽고 제의적 구조물을 짓는 뜻을 잘 드러냅니다.
- source_word: בָּמוֹת
  english_pob_choice: high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 제의적 산당
  lexicon: HALOT
  rationale: 우상숭배 맥락의 בָּמוֹת은 한국어 성서어에서 통상 ‘산당’이므로, 제의적 장소라는 전문적 의미를 유지했습니다.
- source_word: בְּנֵיהֶם
  english_pob_choice: their sons
  chosen_korean: 자기 아들들
  alternatives_korean:
  - 그들의 아들들
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘아들들’이라고 말하므로, 일반화된 ‘자녀들’로 완화하지 않고 성별이 있는 표현을 유지했습니다.
- source_word: עֹלוֹת
  english_pob_choice: as burnt offerings
  chosen_korean: 번제물로
  alternatives_korean:
  - 번제로
  - 불살라 드리는 제물로
  lexicon: HALOT
  rationale: עֹלוֹת은 제의적 전문용어인 ‘번제’를 가리키며, 한국어에서는 ‘번제물로’가 제물의 기능을 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 하나님의 거부를 나타내는 이중 부정과 ‘마음’ 표현
  chosen_reading: 그런 일은 내가 명령한 적도, 말한 적도 없으며, 내 마음에 떠오른 적도 없습니다.
  alternative_readings:
  - 그런 일은 내가 명령한 적도, 말한 적도 없으며, 내 마음에 올라온 적도 없습니다.
  - 그런 일은 내가 명령한 적도, 말한 적도 없으며, 내 생각에 든 적도 없습니다.
  rationale: 히브리어의 ‘내 마음에 올라오다’라는 관용구를 ‘내 마음에 떠오르다’로 옮겨, 하나님의 내적 거부와 비인가성을 ‘생각’으로 축소하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
