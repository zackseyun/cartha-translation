  text: “나는 나 자신을 위하여 넓은 집과 널찍한 위층 방들을 짓겠다. 그 집에 창문들을 내고, 백향목으로 판을 대며, 붉은색[a]으로 칠하겠다”라고 말하는 자입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붉은색’은 값비싼 붉은 안료, 곧 주홍색 안료나 진사(辰砂) 계열의 안료를 가리킬 수 있습니다.
    reason: lexical_alternative
