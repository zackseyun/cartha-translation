  yaml_path: translation/ot/jeremiah/022/014.yaml
  text: who says[a], ‘I will build myself a spacious house with roomy upper chambers,’ and cuts out windows for it, paneling it with cedar and painting it red.
  footnotes:
  - marker: a
    text: Or “painting it with vermilion” (possibly cinnabar), referring to a costly red pigment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말하기를 「나는 나를 위해 넓은 집과 넉넉한 위층 방들을 짓고, 자기를 위하여 창문들을 내고, 백향목으로 판을 대고 붉은색으로 칠하겠다」입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붉은색’은 여기서 값비싼 붉은 안료를 가리키는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  english_pob_choice: who says
  chosen_korean: 그가 말하기를
  alternatives_korean:
  - 말하는 자가
  - 말하는 이가
  lexicon: HALOT
  rationale: 아티클이 붙은 분사구를 서술적으로 풀되, 문맥의 계속되는 화자 묘사를 자연스러운 한국어로 옮겼습니다.
- source_word: אֶבְנֶה לִּי
  english_pob_choice: I will build myself
  chosen_korean: 나는 나를 위해 짓고
  alternatives_korean:
  - 나는 나 자신을 위해 짓고
  - 나는 나를 위하여 짓겠다
  lexicon: HALOT
  rationale: לִּי의 자기이익 뉘앙스를 ‘나를 위해’로 살려, 자기중심적 의도를 드러냈습니다.
- source_word: בֵּית מִדּוֹת וַעֲלִיּוֹת מְרֻוָּחִים
  english_pob_choice: a spacious house with roomy upper chambers
  chosen_korean: 넓은 집과 넉넉한 위층 방들
  alternatives_korean:
  - 넓은 집과 널찍한 위층 방들
  - 큰 집과 넓은 위층 방들
  lexicon: HALOT
  rationale: 규모와 호화로움을 전달하는 표현으로, 고어적 ‘치수의 집’보다 현대 한국어의 자연스러운 공간감 표현을 택했습니다.
- source_word: וְקָרַע לֽוֹ חַלּוֹנָי
  english_pob_choice: and cuts out windows for it
  chosen_korean: 자기를 위하여 창문들을 내고
  alternatives_korean:
  - 그 집에 창문들을 내고
  - 창문들을 뚫고
  lexicon: HALOT
  rationale: קָרַע의 ‘찢어 내다/내다’는 물리적 동작을 한국어 ‘창문을 내다’로 자연스럽게 옮기되, 대상의 자기지향성을 유지했습니다.
- source_word: וְסָפ֣וּן בָּ/אָ֔רֶז
  english_pob_choice: paneling it with cedar
  chosen_korean: 백향목으로 판을 대고
  alternatives_korean:
  - 백향목으로 마감하고
  - 백향목으로 입히고
  lexicon: HALOT
  rationale: סָפוּן의 건축적 의미를 ‘판을 대다’로 옮겨, 단순 장식이 아니라 내부를 목재로 마감하는 이미지를 살렸습니다.
- source_word: וּמָשׁוֹחַ בַּשָּׁשַׁר
  english_pob_choice: painting it red
  chosen_korean: 붉은색으로 칠하겠다
  alternatives_korean:
  - 주홍색으로 칠하겠다
  - 연지색으로 칠하겠다
  lexicon: HALOT
  rationale: שָׁשַׁר을 특정 고대 안료명보다 색상 의미로 옮겨, 본문의 화려한 외관을 분명하게 전달했습니다.
