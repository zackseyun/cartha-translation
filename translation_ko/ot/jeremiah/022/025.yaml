source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ךָ בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשֶׁ֔/ךָ וּ/בְ/יַ֛ד אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶ֑ם וּ/בְ/יַ֛ד נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַ֥ד הַ/כַּשְׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/025.yaml
  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'Nebuchadrezzar,' reflecting the Hebrew form of the name more closely.
    reason: lexical_alternative
  - marker: b
    text: '''The Chaldeans'' may also be rendered ''the Babylonians'' in context, since the term can refer to Babylonian forces more broadly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 네 생명을 찾는 자들의 손과, 네가 두려워하는 자들의 손과, 바빌론 왕 느부갓네살의 손과, 갈대아인의 손에 넘겨주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사구는 사람을 권력 아래로 넘기는 관용 표현입니다.
    reason: source_note
  - marker: b
    text: ‘갈대아인’은 문맥상 바빌로니아 군대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  english_pob_choice: And I will give you
  chosen_korean: 내가 너를 …에 넘겨주겠습니다
  alternatives_korean:
  - 내가 너를 …에 주겠습니다
  - 내가 너를 …에 넘기겠습니다
  lexicon: HALOT
  rationale: 히브리어 נתן이 사람을 권력 아래로 넘기는 관용구이므로, 한국어에서는 ‘넘겨주다’가 문맥의 강제성과 처지를 가장 자연스럽게 드러냅니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: …의 손에
  alternatives_korean:
  - …의 권세 아래
  - …의 힘에
  lexicon: HALOT
  rationale: 반복되는 ‘손’ 이미지를 살려 원문의 압박감과 수동성을 유지했습니다.
- source_word: מְבַקְשֵׁי נַפְשֶׁךָ
  english_pob_choice: those who seek your life
  chosen_korean: 네 생명을 찾는 자들
  alternatives_korean:
  - 네 목숨을 찾는 자들
  - 너를 죽이려는 자들
  lexicon: HALOT
  rationale: נפש는 여기서 ‘영혼’이 아니라 생명/목숨을 뜻하므로, 직설적이면서도 자연스러운 ‘생명’으로 옮겼습니다.
- source_word: נְבוּכַדְרֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓드네살
  - 느부갓레살
  lexicon: HALOT
  rationale: 한국어 성서에서 널리 통용되는 고유명사 형태를 따랐습니다. 영어 주석이 지적하듯 히브리어 철자와 더 가까운 표기와의 차이는 있으나, 본문 가독성을 위해 표준형을 유지했습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아인
  alternatives_korean:
  - 갈대아 사람들
  - 바빌로니아인
  lexicon: HALOT
  rationale: 원문 용어를 직접 반영해 ‘갈대아인’으로 옮겼습니다. 영어 주석처럼 문맥상 바빌로니아 세력을 가리킬 수 있으나, 본문에서는 어휘를 보존했습니다.
theological_decisions:
- issue: 위협의 누적과 심판의 확실성
  chosen_reading: ‘…의 손에’라는 반복을 그대로 살려, 하나님의 넘겨주심이 여러 적대 세력의 연속적 위협으로 강화되도록 했습니다.
  alternative_readings:
  - 의역적으로 한 번만 묶어 표현하기
  - ‘권세 아래’로 추상화하기
  rationale: 이 절의 수사적 힘은 반복에 있으므로, 한국어에서도 동일한 압박감을 유지하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 예레미야의 심판 선포와 하나님의 주권적 넘겨주심
