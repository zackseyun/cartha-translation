  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'Nebuchadrezzar,' reflecting the Hebrew form of the name more closely.
    reason: lexical_alternative
  - marker: b
    text: '''The Chaldeans'' may also be rendered ''the Babylonians'' in context, since the term can refer to Babylonian forces more broadly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 네 목숨을 노리는 자들의 손에, 네가 두려워하는 자들의 손에, 바빌론 왕 느부갓네살[a]의 손에, 갈대아 사람들[b]의 손에 넘겨주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 통상적 표기인 ‘느부갓네살’과 약간 다른 형태로 이 이름을 표기합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아 사람들’은 이 문맥에서 바빌로니아 군대를 가리킬 수도 있습니다.
    reason: lexical_alternative
