  source_fidelity: 'The draft conveys the principal indictment accurately: unjust construction is paired with uncompensated labor. However, the plural "upper rooms" should be retained, and the Hebrew negated prepositional phrases are more faithfully represented as "without righteousness/justice" than by the somewhat awkward instrumental forms "불의로/불공정으로."'
