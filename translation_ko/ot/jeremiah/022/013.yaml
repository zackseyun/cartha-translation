  terminology: Use "의" for צֶדֶק and "정의" for מִשְׁפָּט to preserve the related but nonidentical ethical vocabulary. "윗방들" is an understandable rendering of עֲלִיּוֹתָיו, and "품삯" accurately expresses פֹעֲלוֹ in this context.
  issues:
