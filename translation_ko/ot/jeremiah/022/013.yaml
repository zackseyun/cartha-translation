source:
  edition: WLC
  text: ה֣וֹי בֹּנֶ֤ה בֵית/וֹ֙ בְּֽ/לֹא צֶ֔דֶק וַ/עֲלִיּוֹתָ֖י/ו בְּ/לֹ֣א מִשְׁפָּ֑ט בְּ/רֵעֵ֨/הוּ֙ יַעֲבֹ֣ד חִנָּ֔ם וּ/פֹעֲל֖/וֹ לֹ֥א יִתֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/013.yaml
  text: Woe to him who builds his house without righteousness[a], and his upper rooms without justice[c][b], who makes his neighbor work for nothing and does not give him his wages.
  footnotes:
  - marker: a
    text: Or 'without justice' for 'without righteousness'; the Hebrew pair צֶדֶק and מִשְׁפָּט are closely related and can overlap in meaning.
    reason: lexical_alternative
  - marker: b
    text: '''Upper rooms'' may also be rendered ''upper chambers'' or ''upper stories,'' referring to the upper part of a substantial house.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'his work'; in context this means the laborer's due pay or wages.
    reason: lexical_alternative
translation:
  language: ko
  text: “자기 집을 의 없이 짓고[a], 자기 윗방들을 정의 없이 세우며[b], 자기 이웃을 아무 대가 없이 일하게 하고 그에게 품삯을 주지 않는 자에게 화가 있습니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정의 없이.” 히브리어 ‘체데크’(צֶדֶק)와 뒤의 ‘미쉬파트’(מִשְׁפָּט)는 밀접하게 관련되어 있으며 의미가 겹칠 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “윗방들”은 “위층 방들,” “상층실들” 또는 “위층 부분들”로도 옮길 수 있으며, 큰 집의 상부 공간을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “그의 일”입니다. 여기서는 일꾼에게 마땅히 주어야 할 품삯을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: “화 있을진저”
  alternatives_korean:
  - “슬프도다”
  - “아”
  lexicon: HALOT
  rationale: 예언자적 책망과 심판 선언을 드러내는 감탄사로서, 현대 한국어에서는 “화 있을진저”가 경고와 저주의 힘을 가장 분명히 전달합니다.
- source_word: בְּלֹא צֶדֶק
  english_pob_choice: without righteousness
  chosen_korean: “불의로”
  alternatives_korean:
  - “의 없이”
  - “정의 없이”
  lexicon: HALOT
  rationale: צֶדֶק은 여기서 건축 행위의 도덕적 부정을 가리키므로, 한국어에서는 명사구보다 부사적 표현 “불의로”가 자연스럽고 문맥의 비윤리성을 직접 드러냅니다.
- source_word: וַעֲלִיּוֹתָיו
  english_pob_choice: and his upper rooms
  chosen_korean: “자기 윗방”
  alternatives_korean:
  - “자기 위층 방”
  - “자기 상층실”
  lexicon: HALOT
  rationale: 상층 구조를 뜻하는 건축 용어이므로, 현대 독자가 이해하기 쉬운 “윗방”을 택하되 큰 집의 상부 공간이라는 이미지를 유지했습니다.
- source_word: בְּלֹא מִשְׁפָּט
  english_pob_choice: without justice
  chosen_korean: “불공정으로”
  alternatives_korean:
  - “정의 없이”
  - “재판 없이”
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 사회적·법적 공정성을 뜻하므로, 건축과 착취의 대비를 살리는 한국어로 “불공정으로”를 선택했습니다.
- source_word: חִנָּם
  english_pob_choice: for nothing
  chosen_korean: “공짜로”
  alternatives_korean:
  - “헛되이”
  - “대가 없이”
  lexicon: HALOT
  rationale: 보수를 주지 않는 착취를 일상적 한국어로 즉시 드러내는 표현으로 “공짜로”가 가장 직접적입니다.
- source_word: וּפֹעֲלוֹ
  english_pob_choice: his wages
  chosen_korean: “그의 품삯”
  alternatives_korean:
  - “그의 삯”
  - “그의 보수”
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘일’이 아니라 노동에 대한 당연한 지급액을 뜻하므로, 고전적이면서도 이해 가능한 “품삯”이 적절합니다.
theological_decisions:
- issue: 예언적 질책의 감탄사와 문장 종결 형식
  chosen_reading: “화 있을진저”로 시작해 직접적 심판 경고의 어조를 유지했습니다.
  alternative_readings:
  - “아, 그에게 화가 있을 것입니다”
  - “슬프도다”
  rationale: 히브리어 הוֹי는 단순한 탄식보다 심판 선고의 기능이 강하므로, 한국어에서도 경고의 무게가 살아나는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (prophetic force and register preservation)
