id: JER.22.5
reference: Jeremiah 22:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמְע֔וּ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה בִּ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּי לְ/חָרְבָּ֥ה יִֽהְיֶ֖ה הַ/בַּ֥יִת הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/005.yaml
  text: But if you do not listen to these words[a], I swear by myself, declares Yahweh, that this house will become a ruin.
  footnotes:
  - marker: a
    text: Or 'this palace'; in context 'this house' likely refers to the royal house/palace of the king of Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 여러분이 이 말씀들을 듣지 않으면, 내가 나 자신을 두고 맹세하니—야훼의 말씀입니다—이 집은 폐허가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘이 집’은 문맥상 유다 왕의 왕실/궁전을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞선 경고와 대비되는 조건문이므로 ‘그러나’로 역접을 살리고, 문어체 조건 연결은 ‘만일’이 자연스럽습니다.
- source_word: תִשְׁמְעוּ אֶת הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: you do not listen to these words
  chosen_korean: 이 말씀들을 듣지 않으면
  alternatives_korean:
  - 이 말들을 듣지 않으면
  - 이 말씀에 귀를 기울이지 않으면
  lexicon: HALOT
  rationale: שׁמע는 여기서 예언자적 경고에 대한 청취/수용을 뜻하므로, 과도한 해석인 ‘순종하다’보다 ‘듣다’가 원문에 가깝습니다.
- source_word: בִּי נִשְׁבַּעְתִּי
  english_pob_choice: I swear by myself
  chosen_korean: 내가 나 자신을 두고 맹세하니
  alternatives_korean:
  - 내가 나로 맹세하니
  - 내가 나 자신으로 맹세하니
  lexicon: HALOT
  rationale: בִּי는 서약 공식에서 ‘by myself’의 관용구이므로, 자기 자신을 증인으로 삼는 맹세의 강도를 드러내는 표현으로 옮겼습니다.
- source_word: לְחָרְבָּה יִהְיֶה הַבַּיִת הַזֶּה
  english_pob_choice: this house will become a ruin
  chosen_korean: 이 집은 폐허가 될 것입니다
  alternatives_korean:
  - 이 집은 황폐하게 될 것입니다
  - 이 집은 무너진 폐허가 될 것입니다
  lexicon: HALOT
  rationale: לְחָרְבָּה는 단순한 ‘집’의 훼손보다 황폐·폐허 상태를 가리키므로, 한국어에서는 결과 상태를 분명히 하는 ‘폐허가 되다’가 적절합니다. ‘집’은 원문을 따라 유지했습니다.
theological_decisions:
- issue: נְאֻם יְהוָה의 예언자적 공식과 여호와 명칭 처리
  chosen_reading: ‘야훼의 말씀입니다’
  alternative_readings:
  - ‘주님의 말씀입니다’
  - ‘야훼께서 말씀하십니다’
  rationale: 예언자적 결말 공식을 현대 한국어로 자연스럽게 살리면서, 본 프로젝트의 기본 원칙에 따라 신명은 야훼로 옮겼습니다.
  doctrine_reference: 명칭 보존과 예언자적 발화 공식
- issue: ‘이 집’의 지시 대상
  chosen_reading: ‘이 집’을 직역으로 유지
  alternative_readings:
  - ‘이 궁전’
  - ‘이 왕궁’
  rationale: 문맥상 유다 왕의 왕실/궁전을 가리킬 가능성이 있으나, 히브리어는 בַּיִת(집)을 사용하므로 본문 용어를 유지하고 해석은 본문 밖에서 다루는 것이 더 투명합니다.
  doctrine_reference: 문맥 주석과 어휘 보존
