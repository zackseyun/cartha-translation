  rationale: דְּבַר는 예언문맥의 관용구로 ‘말씀’이 가장 자연스럽고 무게감이 있습니다. יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 삼중 호격 ‘땅, 땅, 땅’의 의미
