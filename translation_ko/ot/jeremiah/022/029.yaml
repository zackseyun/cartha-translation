  lexicon: HALOT
  rationale: 여기서는 삼중 호격의 부름이므로, 특정 지역이든 청중 역할을 하는 대지든 모두 포괄할 수 있는 ‘땅’이 가장 직접적입니다. 영어 POB의 ‘Land’ 선택을 살려 ‘땅’으로 옮겼습니다.
