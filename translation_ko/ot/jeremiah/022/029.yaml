  alternatives_korean:
  - 들으시오
  - 들어라
  - 들으세요
  lexicon: HALOT
  rationale: 여성 단수 명령형이지만 한국어에서는 대상 성별을 드러내기 어렵고, 예언적 호소의 공적·엄중한 톤을 살리기 위해 정중 명령형 ‘들으십시오’를 택했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
