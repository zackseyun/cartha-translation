  alternative_readings:
  - ‘이 땅이여, 이 땅이여, 이 땅이여’로 풀어 쓰기
  - ‘세상아, 세상아, 세상아’로 보편화하기
  rationale: 본문은 שִׁמְעִי의 명령 앞에 삼중 반복으로 청자를 강하게 소환합니다. 특정 지시어를 덧붙여 의미를 좁히기보다, 반복 자체의 수사적 충격을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 예언 수사와 직설적 호소의 보존
