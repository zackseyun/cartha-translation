id: JER.22.15
reference: Jeremiah 22:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/תִֽמְלֹ֔ךְ כִּ֥י אַתָּ֖ה מְתַחֲרֶ֣ה בָ/אָ֑רֶז אָבִ֜י/ךָ הֲ/ל֧וֹא אָכַ֣ל וְ/שָׁתָ֗ה וְ/עָשָׂ֤ה מִשְׁפָּט֙ וּ/צְדָקָ֔ה אָ֖ז ט֥וֹב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/015.yaml
  text: Do you reign because you compete in cedar? Did not your father eat and drink and do justice and righteousness? Then it was well with him[a][b].
  footnotes:
  - marker: a
    text: Or 'vie for cedar' or 'are eager about cedar.' The Hebrew expression is rare and likely refers to royal rivalry expressed through cedar-paneled building.
    reason: lexical_alternative
  - marker: b
    text: '''Justice and righteousness'' may also be rendered ''justice and what is right.'''
    reason: alternative_reading
translation:
  language: ko
  text: 네가 다스리느냐? 너는 백향목과 겨루고 있기 때문이다. 네 아버지가 먹고 마시며 정의와 의를 행하지 않았느냐? 그러므로 그에게는 잘되었느니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겨루다’는 희귀한 히브리어 표현이 담는 왕실 경쟁의 뉘앙스를 살린 번역입니다. 직역하면 ‘백향목에 대해/백향목으로 인해 겨루다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정의와 의’는 전통적 ‘공의’로 뭉개지지 않도록 두 히브리어 명사를 구별해 옮긴 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתִמְלֹךְ
  english_pob_choice: Do you reign
  chosen_korean: 네가 다스리느냐?
  alternatives_korean:
  - 네가 왕이 되느냐?
  - 네가 통치하느냐?
  lexicon: HALOT
  rationale: 수사적 질문으로서 왕권의 정당성 자체를 따지는 문맥이므로, 현대 한국어에서는 ‘다스리다’가 가장 자연스럽고 간결하게 반문 효과를 살립니다.
- source_word: מְתַחֲרֶה בָאָרֶז
  english_pob_choice: compete in cedar
  chosen_korean: 백향목과 겨루고 있기 때문이다
  alternatives_korean:
  - 백향목을 두고 다투고 있기 때문이다
  - 백향목에 열을 올리고 있기 때문이다
  lexicon: HALOT
  rationale: 희귀한 경쟁/경쟁심의 표현을 살려 ‘겨루다’로 옮겼고, בָאָרֶז의 직역성을 유지하면서도 왕궁의 백향목 장식과 연관된 야심을 드러내도록 했습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 정의와 공의
  - 공의와 의
  lexicon: HALOT
  rationale: POB가 유지한 긴장감을 한국어에서도 보존하기 위해 מִשְׁפָּט은 ‘정의’, צְדָקָה는 ‘의’로 구분했습니다. 둘을 모두 ‘공의’로 평준화하면 स्रोत의 대조가 약해집니다.
- source_word: אָז טוֹב לוֹ
  english_pob_choice: Then it was well with him
  chosen_korean: 그러므로 그에게는 잘되었느니라
  alternatives_korean:
  - 그때 그에게 잘되었습니다
  - 그러자 그가 형통하였습니다
  lexicon: HALOT
  rationale: אָז의 결과적 의미를 살려 ‘그러므로’로 연결했고, 평가적 결론을 담는 관용 표현으로 ‘잘되었느니라’를 사용해 히브리어의 ফল과 평가를 함께 전달했습니다.
theological_decisions:
- issue: 왕권 비판의 수사적 초점
  chosen_reading: 이 구절은 단순히 통치 행위를 묻는 것이 아니라, 백향목으로 상징되는 사치와 경쟁심이 왕권의 근거가 될 수 있는지 비판합니다.
  alternative_readings:
  - 그냥 왕이 될 수 있는지 묻는 중립적 질문
  - 건축 재료에 대한 단순 언급
  rationale: 문맥상 예레미야의 책망은 건축적 호화로움과 정의 실천을 대비시키는 데 있으므로, 번역도 그 비판적 초점을 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md: prophetic rebuke and covenantal ethics; preserve tension between royal display and justice.'
