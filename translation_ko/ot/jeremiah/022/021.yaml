id: JER.22.21
reference: Jeremiah 22:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבַּ֤רְתִּי אֵלַ֨יִ/ךְ֙ בְּ/שַׁלְוֺתַ֔יִ/ךְ אָמַ֖רְתְּ לֹ֣א אֶשְׁמָ֑ע זֶ֤ה דַרְכֵּ/ךְ֙ מִ/נְּעוּרַ֔יִ/ךְ כִּ֥י לֹֽא שָׁמַ֖עַתְּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/021.yaml
  text: I spoke to you in your prosperity[a], but you said, ‘I will not listen.’ This has been your way from your youth[b], for you have not listened to my voice.
  footnotes:
  - marker: a
    text: Or 'in your ease' or 'in your security.' The Hebrew term can denote quiet ease, security, or prosperity.
    reason: lexical_alternative
  - marker: b
    text: '''Listen'' may also be rendered ''obey'' here and later in the verse; the Hebrew verb often carries both senses in covenant contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게 평안할 때에 말했으나 너는 말하기를 ‘나는 듣지 않겠습니다’라고 했습니다. 이것은 네가 어려서부터 걸어온 길이며, 네가 내 목소리를 듣지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평안할 때에’는 히브리어가 가리킬 수 있는 ‘안온함, 안전, 번영’의 범위를 포괄하는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘듣다’는 이 문맥에서 ‘순종하다’의 뜻도 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלְוֺתַיִךְ
  english_pob_choice: in your prosperity
  chosen_korean: 평안할 때에
  alternatives_korean:
  - 번영할 때에
  - 안일할 때에
  - 평화로운 때에
  lexicon: HALOT
  rationale: שַׁלְוָה는 ‘평안, 안전, 번영, 안온함’의 범위를 가지므로, 문맥상 왕국의 안정과 자기확신을 함께 드러내는 ‘평안할 때에’가 자연스럽고 원문 범위를 과도하게 좁히지 않습니다.
- source_word: לֹא אֶשְׁמָע / לֹא שָׁמַעַתְּ
  english_pob_choice: I will not listen / you have not listened
  chosen_korean: 듣지 않겠습니다 / 듣지 않았습니다
  alternatives_korean:
  - 순종하지 않겠습니다 / 순종하지 않았습니다
  - 말을 듣지 않겠습니다 / 말을 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 이 문맥에서 ‘듣다’와 ‘순종하다’를 함께 담으므로, 반복되는 ‘듣다’를 살리면서도 불순종의 의미가 드러나도록 번역했습니다.
- source_word: בְּקוֹלִי
  english_pob_choice: to my voice
  chosen_korean: 내 목소리를
  alternatives_korean:
  - 내 음성을
  - 내 말을
  lexicon: HALOT
  rationale: ‘בקול’의 표준적 관용을 한국어에서 그대로 옮기기보다, 하나님의 직접적 말씀을 가리키는 표현으로서 ‘내 목소리’를 유지해 원문의 이미지를 살렸습니다.
- source_word: דַּרְכֵּךְ
  english_pob_choice: your way
  chosen_korean: 걸어온 길
  alternatives_korean:
  - 네 길
  - 네 행실
  lexicon: HALOT
  rationale: ‘길/행실’ 가운데, 뒤의 ‘from your youth’와 결합된 지속적 패턴을 한국어에서 가장 자연스럽게 드러내기 위해 ‘걸어온 길’로 풀었습니다.
theological_decisions:
- issue: 여성 단수 2인칭의 인격화된 대상 유지
  chosen_reading: 주어와 목적어를 모두 ‘너/네’로 두어, 예루살렘/유다를 직접 호명하는 여성 단수 형식을 한국어에서 과도하게 특정하지 않았습니다.
  alternative_readings:
  - 예루살렘아/유다야로 명시
  - ‘그대’로 완곡하게 처리
  rationale: 히브리어의 여성 단수 어미가 인격화된 공동체를 가리키는 점을 살리면서도, 본문 자체에 없는 해석적 명시를 피하는 편이 원문 충실도에 더 적합합니다.
  doctrine_reference: 본문의 수사적 인격화를 보존하고 해석을 절제합니다.
