reference: Jeremiah 22:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כִּתְב֞וּ אֶת הָ/אִ֤ישׁ הַ/זֶּה֙ עֲרִירִ֔י גֶּ֖בֶר לֹא יִצְלַ֣ח בְּ/יָמָ֑י/ו כִּי֩ לֹ֨א יִצְלַ֜ח מִ/זַּרְע֗/וֹ אִ֚ישׁ יֹשֵׁב֙ עַל כִּסֵּ֣א דָוִ֔ד וּ/מֹשֵׁ֥ל ע֖וֹד בִּ/יהוּדָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/030.yaml
  text: 'Thus says Yahweh: Write this man down as childless[a], a man who will not prosper in his days; for none of his offspring will prosper[b] to sit on the throne of David and rule again in Judah.'
  footnotes:
  - marker: a
    text: 'Or ''record this man as without an heir.'' The Hebrew says ''childless,'' but the following clause shows the focus is dynastic succession: none of his offspring will succeed on David''s throne.'
    reason: lexical_alternative
  - marker: b
    text: That is, no descendant of Jeconiah would successfully reign as Davidic king in Judah.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “이 사람을 자식이 없는 자[a]로 기록하라. 그는 자기 시대에 번성하지 못할 사람이다. 그의 자손 중에서는 다윗의 왕좌에 앉아 다시 유다를 다스릴 사람이 번성하지 못할 것이다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 사람을 후계자 없는 자로 기록하라.’ 히브리어는 ‘자식이 없는 자’라고 말하지만, 뒤 절은 초점이 왕조 계승에 있음을 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 여고냐의 어떤 후손도 유다의 다윗 계열 왕으로 성공적으로 통치하지 못한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 프로젝트 기본값을 따라 신적 이름을 음역하며, 예언자 발화의 직접성을 유지합니다.
- source_word: כִּתְבוּ אֶת
  english_pob_choice: Write this man down
  chosen_korean: 이 사람을 …로 기록하라
  alternatives_korean:
  - 이 사람을 …로 적으라
  - 이 사람을 …로 써 두라
  lexicon: WLC
  rationale: 공적 등록의 명령을 살리되, 한국어에서는 ‘기록하라’가 행정적·공식적 뉘앙스를 가장 자연스럽게 담습니다.
- source_word: עֲרִירִי
  english_pob_choice: childless
  chosen_korean: 자식이 없는 자
  alternatives_korean:
  - 자식이 없는 사람
  - 후계자가 없는 자
  lexicon: WLC
  rationale: 직역적 ‘자식이 없는’의 의미를 유지하면서도, 뒤의 왕위 계승 문맥을 고려해 동적 해설을 과도하게 넣지 않았습니다.
- source_word: אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד וּמֹשֵׁל עוֹד בִּיהוּדָה
  english_pob_choice: to sit on the throne of David and rule again in Judah
  chosen_korean: 다윗의 왕좌에 앉아 다시 유다를 다스릴 사람
  alternatives_korean:
  - 다윗의 왕좌에 앉아 유다를 다시 다스릴 사람
  - 다윗의 왕좌에 앉아 유다를 계속 다스릴 사람
  lexicon: WLC
  rationale: 히브리어의 ‘앉다/다스리다’ 구조를 한국어에서도 유지하여 왕권과 통치의 이미지를 보존했습니다.
theological_decisions:
- issue: עֲרִירִי의 의미—생물학적 무자녀 여부가 아니라 왕조 계승의 단절을 뜻하는지
  chosen_reading: 본문에는 ‘자식이 없는 자’로 두고, 뒤의 절이 다윗 왕위 계승의 실패를 풀어 설명하도록 했습니다.
  alternative_readings:
  - ‘후계자가 없는 자’로 의역
  - ‘왕위를 이을 자가 없는 자’로 해설적 번역
  rationale: 히브리어 표현은 강한 선언이지만, 바로 다음 절이 그의 자손이 왕좌에 앉지 못한다고 설명하므로 번역은 어휘의 힘을 살리고 해석은 문맥에 맡기는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘다시 유다를 다스릴’의 종결성
  chosen_reading: 후손 중 누구도 다윗 왕권을 이어 유다를 다시 다스리지 못한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘유다에서 더 이상 다스리지 못한다’로 단순화
  - ‘유다에서 계속 다스리지 못한다’로 완화
  rationale: עוֹד는 단순한 ‘계속’보다 왕조의 재개 불가를 가리키는 방향으로 읽히며, 본절은 여고냐 왕조의 성공적 지속을 부정합니다.
  doctrine_reference: Translation philosophy §§1, 3
