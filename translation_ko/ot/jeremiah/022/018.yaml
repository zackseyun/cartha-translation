  lexicon: HALOT
  rationale: 앞뒤 예언 문맥의 결론 표지를 한국어로 자연스럽게 옮기되, 원문의 추론 관계를 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
