  revised_text: 그러므로 야훼께서 유다 왕이며 요시야의 아들인 여호야김에 대하여 이렇게 말씀하십니다. “사람들이 그를 두고 ‘아, 내 형제여!’라고도, ‘아, 자매여!’라고도 애곡하지[a] 않을 것이며, 그를 두고 ‘아, 주군이여!’라고도[c], ‘아, 그의 위엄이여!’라고도[d] 애곡하지 않을 것입니다.”
