  naturalness: ‘유다 왕 요시야의 아들 여호야김’은 수식 관계가 잠시 모호할 수 있으므로 ‘유다 왕이며 요시야의 아들인 여호야김’으로 풀어 쓰는 편이 명료합니다. ‘아, 그의 위엄이여!’는 원문의 호격적 애도 표현을 보존하면서 한국어 문장으로도 가능합니다.
  terminology: 야훼, 여호야김, 유다 왕은 일관되고 적절합니다. אָדוֹן은 이 문맥에서 ‘주군’으로 옮겨 인간 왕에 대한 호칭을 살리되 야훼의 칭호와 혼동되지 않게 했습니다. הֹדֹה는 ‘그의 위엄’으로 유지할 수 있습니다.
