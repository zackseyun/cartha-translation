  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 이 프로젝트의 기본 용례에 따라 신명은 야훼로 옮겨, 원문 고유명을 보존했습니다.
- source_word: לֹא יִסְפְּדוּ ל֔וֹ
  english_pob_choice: They will not lament for him
  chosen_korean: 그를 두고 … 조상하지 않을 것입니다
  alternatives_korean:
  - 그를 두고 애곡하지 않을 것입니다
  - 그를 위하여 애도하지 않을 것입니다
  lexicon: HALOT
  rationale: ספד는 일반적인 슬픔보다 공식적인 장례 조상/애도 행위를 가리키므로, ‘조상하다’가 문맥의 장례적 뉘앙스를 가장 잘 살립니다.
- source_word: הוֹי
  english_pob_choice: Alas
  chosen_korean: 아
  alternatives_korean:
  - 슬프다
  - 아아
  lexicon: HALOT
  rationale: 장례식의 통곡 어감을 살리기 위해 감탄사 ‘아’를 반복해 두었습니다.
- source_word: אָדוֹן
  english_pob_choice: lord / master
  chosen_korean: 주인님
  alternatives_korean:
  - 주님
  - 주인
  lexicon: HALOT
  rationale: אָדוֹן은 여기서 지배자·상관에 대한 호칭이므로, 야훼의 칭호인 ‘주님’과 구별되도록 ‘주인님’으로 옮겼습니다.
- source_word: הֹדֹה
  english_pob_choice: his majesty / his splendor
  chosen_korean: 그의 위엄
  alternatives_korean:
  - 그의 영광
  - 그의 존엄
  lexicon: HALOT
  rationale: הוד는 왕의 위엄·장엄·광휘를 뜻하므로, 장례 통곡의 관용구로서 ‘그의 위엄’이 가장 직접적입니다.
theological_decisions:
- issue: 예언자 선포 공식과 대화체 전환
  chosen_reading: 본문 서술은 예언 선포 공식으로 유지하고, 직접 인용부 안에서는 장례 통곡의 감탄형을 그대로 살렸습니다.
  alternative_readings:
  - 직설문으로 풀어 쓰기
  - 통곡 표현을 완화하기
  rationale: 원문의 선포 형식과 애도 구호의 강도를 약화하지 않기 위해, 인용부를 따옴표로 분리해 그대로 보존했습니다.
  doctrine_reference: 예언서 문체 보존 원칙
- issue: ‘주인님’과 ‘그의 위엄’의 병렬
  chosen_reading: אָדוֹן과 הוד의 두 겹 통곡을 각각 살려, 인간 왕의 지위와 왕권의 장엄함이 함께 상실되었음을 드러냈습니다.
  alternative_readings:
  - 둘 다 단순히 ‘슬프다’로 평준화하기
  - 둘을 하나의 일반적 애도 표현으로 합치기
  rationale: 원문은 사회적 호칭과 왕권적 위엄을 각각 호명하므로, 그 긴장을 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 원문 의미 보존 원칙
