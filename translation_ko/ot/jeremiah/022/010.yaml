id: JER.22.10
reference: Jeremiah 22:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּבְכּ֣וּ לְ/מֵ֔ת וְ/אַל תָּנֻ֖דוּ ל֑/וֹ בְּכ֤וּ בָכוֹ֙ לַֽ/הֹלֵ֔ךְ כִּ֣י לֹ֤א יָשׁוּב֙ ע֔וֹד וְ/רָאָ֖ה אֶת אֶ֥רֶץ מוֹלַדְתּֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/010.yaml
  text: Do not weep for the dead[a], and do not mourn for him. Weep bitterly for the one going away[b], for he will never return or see the land of his birth.
  footnotes:
  - marker: a
    text: Or 'weep, weep'—the Hebrew uses an imperative with an infinitive absolute for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''The one going away'' refers contextually to the ruler being taken away into exile.'
    reason: cultural_note
translation:
  language: ko
  text: 죽은 사람[a]을 두고는 울지 말며, 그를 두고는 애곡하지도 마십시오. 떠나가는[b] 사람을 두고는 몹시 울십시오. 그는 다시는 돌아오지 않을 것이며, 자신이 태어난 땅도 보지 않을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죽은 자’이지만, 한국어에서는 ‘죽은 사람’을 쓰는 편이 더 자연스럽습니다.
    reason: korean_style_note
  - marker: b
    text: 본문 맥락상 유배로 끌려가는 통치자를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּבְכּוּ
  english_pob_choice: weep
  chosen_korean: 울지 말며
  alternatives_korean:
  - 우십시오
  - 곡하지 말며
  lexicon: HALOT
  rationale: בכה의 기본 뜻인 ‘울다’를 직접 살리되, 명령문 전체의 금지형에 맞게 자연스러운 합쇼체로 옮겼습니다.
- source_word: לְמֵת
  english_pob_choice: for the dead
  chosen_korean: 죽은 사람을
  alternatives_korean:
  - 죽은 이를
  - 죽은 자를
  - 죽은 사람에게
  lexicon: HALOT
  rationale: 히브리어의 간결한 표현을 한국어에서 가장 자연스럽게 풀어, 단순한 ‘dead’보다 구체적인 대상을 드러냈습니다.
- source_word: בְּכוּ בָכוֹ
  english_pob_choice: weep bitterly
  chosen_korean: 몹시 울십시오
  alternatives_korean:
  - 통곡하십시오
  - 울고 또 우십시오
  - 슬피 우십시오
  lexicon: HALOT
  rationale: 부정사 절대형을 통한 강조를 한국어에서 과장되지 않게 강한 정도 부사로 살렸습니다. ‘몹시’가 반복을 과도하게 늘리지 않으면서도 강조를 전달합니다.
- source_word: לַהֹלֵךְ
  english_pob_choice: for the one going away
  chosen_korean: 떠나가는 사람을
  alternatives_korean:
  - 가는 사람을
  - 떠나게 되는 이를
  - 유배로 끌려가는 이를
  lexicon: HALOT
  rationale: 문자적으로는 ‘가는 자’이지만, 본문 맥락을 반영하되 주석적 해석을 본문에 과하게 들이지 않도록 ‘떠나가는 사람’을 택했습니다.
- source_word: לֹא יָשׁוּב עוֹד
  english_pob_choice: he will never return
  chosen_korean: 다시 돌아오지 못하고
  alternatives_korean:
  - 다시는 돌아오지 못하고
  - 돌아오지 못할 것이며
  - 결코 돌아오지 못하고
  lexicon: HALOT
  rationale: עוֹד의 지속·재발 불가를 한국어에서 ‘다시’로 자연스럽게 표현했습니다. ‘못하고’는 다음 절과 이어지는 병렬 구조도 살립니다.
- source_word: וְרָאָה אֶת אֶרֶץ מוֹלַדְתּוֹ
  english_pob_choice: or see the land of his birth
  chosen_korean: 자기 출생의 땅도 보지 못할 것이기 때문입니다
  alternatives_korean:
  - 자기 출생의 땅도 보지 못할 것이기 때문입니다
  - 태어난 땅도 보지 못할 것이기 때문입니다
  - 자기가 난 땅도 보지 못할 것이기 때문입니다
  lexicon: HALOT
  rationale: ‘land of his birth’를 직역에 가깝게 옮겨 출생지/고향 뉘앙스를 유지했습니다. ‘도’는 앞의 부정과 이어져 ‘또한 보지 못함’을 자연스럽게 반영합니다.
theological_decisions:
- issue: '''the one going away''의 지시 대상'
  chosen_reading: 본문은 특정 인물의 이탈을 직접 겨냥하지만, 한국어 본문에서는 해석어를 과도하게 덧붙이지 않고 ‘떠나가는 사람’으로 유지했습니다.
  alternative_readings:
  - 유배로 끌려가는 사람
  - 왕이 끌려가는 사람
  rationale: 영어 POB 주석은 맥락상 통치자가 추방되는 상황을 밝히지만, 본문 자체는 그 해석을 강제하지 않으므로 본문에는 최소한의 해석만 반영했습니다.
  doctrine_reference: 본문-주석 구분 원칙
