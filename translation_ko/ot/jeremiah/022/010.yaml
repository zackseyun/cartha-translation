revisions:
- from: 죽은 사람[a]을 두고는 울지 말며, 그를 두고는 애곡하지도 마십시오. 떠나가는[b] 사람을 두고는 몹시 울십시오. 그는 다시 돌아오지 못하고, 자기 출생의 땅도 보지 못할 것이기 때문입니다.
  to: 죽은 사람[a]을 두고는 울지 말며, 그를 두고는 애곡하지도 마십시오. 떠나가는[b] 사람을 두고는 몹시 울십시오. 그는 다시는 돌아오지 않을 것이며, 자신이 태어난 땅도 보지 않을 것이기 때문입니다.
  rationale: ‘돌아오지 못하고’를 원문의 단순 미래 부정에 맞게 ‘다시는 돌아오지 않을 것이며’로 고쳤습니다. 이어지는 ‘보다’도 같은 부정의 범위 안에 있음을 자연스럽게 드러내기 위해 ‘보지 않을 것’으로 옮겼고, ‘출생의 땅’을 더 자연스러운 ‘자신이 태어난 땅’으로 다듬었습니다. 나머지 본문 및 주석은 원문의 의미와 문맥상 절제를 잘 보존하므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:40Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 대조(죽은 이보다 떠나는 이를 위해 울라), 강조된 명령(בָּכוֹ), 그리고 귀환과 고향 재방문의 부정을 충실히 반영합니다. 다만 ‘다시 돌아오지 못하고’의 ‘못하다’는 원문 לֹא יָשׁוּב(‘돌아오지 않을 것이다’)에 없는 능력·가능성의 결여를 암시할 수 있습니다. 단순 미래 부정으로 옮기는 것이 더 정확합니다.
  naturalness: 합쇼체 문장과 어휘는 대체로 자연스럽습니다. ‘자기 출생의 땅’은 이해 가능하나 ‘자신이 태어난 땅’이 현대 표준 한국어에서 더 자연스럽고, ‘다시는 … 않을 것이며’는 원문의 영구적 비귀환을 분명하게 나타냅니다.
  terminology: ‘애곡하다’, ‘떠나가는 사람’, ‘유배’ 관련 주석은 격식과 문맥에 적절합니다. 본문에서 ‘유배’를 직접 보충하지 않고 주석으로 처리한 것은 해석의 절제를 잘 지킵니다.
  issues:
  - severity: medium
    issue: ‘다시 돌아오지 못하고’가 원문에 없는 불능의 뉘앙스를 더할 수 있습니다.
    rationale: 히브리어 לֹא יָשׁוּב עוֹד는 그가 더 이상 돌아오지 않을 것이라는 미래 부정입니다. ‘못하다’는 능력이나 허락의 부재로도 읽힐 수 있으므로, ‘다시는 돌아오지 않을 것이며’가 더 직접적입니다.
  - severity: low
    issue: ‘자기 출생의 땅’은 다소 문어적이고 어색하게 들릴 수 있습니다.
    rationale: אֶרֶץ מוֹלַדְתּוֹ는 그가 태어난 땅, 곧 고향 땅을 뜻합니다. ‘자신이 태어난 땅’은 동일한 구체적 지리적 의미를 보존하면서 더 자연스럽습니다.
