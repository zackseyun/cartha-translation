  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 예언적 수용을 요구하는 명령으로, ‘말씀’을 유지해 דָּבָר의 계시적 무게를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 야훼로 옮겨 언약 სახელ을 직접 드러냈습니다.
- source_word: מֶלֶךְ יְהוּדָה ... הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  english_pob_choice: O king of Judah, who sits on the throne of David
  chosen_korean: 유다 왕, 곧 다윗의 왕좌에 앉아 있는 당신
  alternatives_korean:
  - 유다 왕, 다윗의 왕좌에 앉아 있는 당신
  - 유다의 왕으로서 다윗의 왕좌에 앉아 있는 당신
  lexicon: HALOT
  rationale: 호격을 자연스럽게 풀어 ‘곧’으로 동격을 보강했고, כִּסֵּא דָוִד를 ‘다윗의 왕좌’로 직역해 왕조적 의미를 유지했습니다.
- source_word: וַעֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 신하들
  - 당신의 관리들
  lexicon: HALOT
  rationale: 공적 맥락에서도 עֲבָדִים의 기본 의미는 ‘종’이므로, 관료로 좁히지 않고 더 넓은 종속 관계를 살렸습니다.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  english_pob_choice: who enter through these gates
  chosen_korean: 이 문들을 통해 들어오는 이들
  alternatives_korean:
  - 이 문으로 들어오는 이들
  - 이 성문들을 통해 들어오는 이들
  lexicon: HALOT
  rationale: בַּשְּׁעָרִים는 출입구를 가리키는 복수 표현이므로, 한국어에서는 자연스럽게 ‘이 문들’로 옮겨 이동 방향을 살렸습니다.
