translation:
  language: ko
  text: 그리고 말하십시오. 「유다의 왕이시며 다윗의 왕좌에 앉아 계신 당신과 당신의 종들과 이 문들로 들어오는 당신의 백성은 야훼의 말씀을 들으십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 종들’은 왕의 관리들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: and say
  chosen_korean: 그리고 말하십시오
  alternatives_korean:
