translation:
  language: ko
  text: 그리고 말하십시오. 「야훼의 말씀을 들으십시오. 유다 왕, 곧 다윗의 왕좌에 앉아 있는 당신과 당신의 종들과 당신의 백성, 이 문들을 통해 들어오는 이들아.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 종들’은 왕의 관리들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: and say
  chosen_korean: 그리고 말하십시오
  alternatives_korean:
  - 그리하여 말하십시오
  - 또 말하십시오
  lexicon: HALOT
  rationale: 앞 문맥의 명령을 이어 주는 접속적 용법을 살리면서, 예언적 지시문답체에 맞게 공손한 명령형으로 옮겼습니다.
- source_word: שְׁמַע דְּבַר יְהוָה
  english_pob_choice: Hear the word of Yahweh
  chosen_korean: 야훼의 말씀을 들으십시오
  alternatives_korean:
  - 야훼의 말을 들으십시오
  - 야훼의 말씀에 귀를 기울이십시오
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 예언적 수용을 요구하는 명령으로, ‘말씀’을 유지해 דָּבָר의 계시적 무게를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와가 아니라 야훼로 옮겨 언약 სახელ을 직접 드러냈습니다.
- source_word: מֶלֶךְ יְהוּדָה ... הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  english_pob_choice: O king of Judah, who sits on the throne of David
  chosen_korean: 유다 왕, 곧 다윗의 왕좌에 앉아 있는 당신
  alternatives_korean:
  - 유다 왕, 다윗의 왕좌에 앉아 있는 당신
  - 유다의 왕으로서 다윗의 왕좌에 앉아 있는 당신
  lexicon: HALOT
  rationale: 호격을 자연스럽게 풀어 ‘곧’으로 동격을 보강했고, כִּסֵּא דָוִד를 ‘다윗의 왕좌’로 직역해 왕조적 의미를 유지했습니다.
- source_word: וַעֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 신하들
  - 당신의 관리들
  lexicon: HALOT
  rationale: 공적 맥락에서도 עֲבָדִים의 기본 의미는 ‘종’이므로, 관료로 좁히지 않고 더 넓은 종속 관계를 살렸습니다.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  english_pob_choice: who enter through these gates
  chosen_korean: 이 문들을 통해 들어오는 이들
  alternatives_korean:
  - 이 문으로 들어오는 이들
  - 이 성문들을 통해 들어오는 이들
  lexicon: HALOT
  rationale: בַּשְּׁעָרִים는 출입구를 가리키는 복수 표현이므로, 한국어에서는 자연스럽게 ‘이 문들’로 옮겨 이동 방향을 살렸습니다.
theological_decisions:
- issue: 여호와 신명(יהוה)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 예언자적 선포에서 언약의 고유명을 직접 사용하므로, 일반적 호칭인 ‘주님’보다 고유명 ‘야훼’를 유지하는 것이 원문 효과에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
