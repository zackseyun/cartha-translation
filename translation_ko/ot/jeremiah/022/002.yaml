  - 또 말하십시오
  lexicon: HALOT
  rationale: 앞 문맥의 명령을 이어 주는 접속적 용법을 살리면서, 예언적 지시문답체에 맞게 공손한 명령형으로 옮겼습니다.
- source_word: שְׁמַע דְּבַר יְהוָה
