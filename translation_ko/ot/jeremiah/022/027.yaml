  source_fidelity: 히브리어의 대조적 도입, 귀환을 향한 강한 열망의 관용구, 그리고 귀환의 단순 미래 부정을 대체로 잘 반영합니다. 그러나 לֹא יָשׁוּבוּ는 ‘돌아갈 수 없다’라는 능력·불가능의 진술보다 ‘돌아가지 않을 것이다’라는 미래의 부정 예고이므로 ‘못할 것입니다’는 의미를 좁힙니다.
