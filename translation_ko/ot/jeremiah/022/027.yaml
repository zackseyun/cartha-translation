source:
  edition: WLC
  text: וְ/עַל הָ/אָ֗רֶץ אֲשֶׁר הֵ֛ם מְנַשְּׂאִ֥ים אֶת נַפְשָׁ֖/ם לָ/שׁ֣וּב שָׁ֑ם שָׁ֖מָּ/ה לֹ֥א יָשֽׁוּבוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/027.yaml
  text: But to the land to which they lift up their soul to return[a], there they will not return.
  footnotes:
  - marker: a
    text: Literally, 'the land to which they lift up their soul to return there.' The Hebrew idiom 'lift up the soul' expresses strong desire or longing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 돌아가기를 간절히 바라는 그 땅으로는 돌아가지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들이 그곳으로 돌아가려고 자기 영혼을 들어 올리는 땅’입니다. ‘영혼을 들어 올리다’는 강한 소망이나 갈망을 나타내는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל / הָאָרֶץ
  english_pob_choice: But to the land
  chosen_korean: 그러나 ... 땅으로는
  alternatives_korean:
  - 그리고 그 땅에 대하여
  - 그러나 그 땅에
  lexicon: HALOT
  rationale: 앞절과의 대조를 살리기 위해 역접을 앞세웠고, 장소 목적격은 한국어에서 자연스러운 '-으로는'으로 처리했습니다.
- source_word: מְנַשְּׂאִים אֶת־נַפְשָׁם
  english_pob_choice: lift up their soul
  chosen_korean: 간절히 바라는
  alternatives_korean:
  - 그들의 영혼을 들어 올리는
  - 그들의 혼을 치켜드는
  - 갈망하는
  lexicon: HALOT
  rationale: 히브리어 관용구 '영혼을 들어 올리다'는 강한 소망을 뜻하므로, 현대 한국어에서는 의미를 드러내는 '간절히 바라다'로 옮기는 것이 가장 자연스럽습니다.
- source_word: לָשׁוּב ... שָׁמָּה / לֹא יָשׁוּבוּ
  english_pob_choice: to return ... they will not return
  chosen_korean: 돌아가기를 ... 돌아가지 못할 것입니다
  alternatives_korean:
  - 되돌아가기를 ... 되돌아가지 않을 것입니다
  - 돌아오기를 ... 돌아오지 못할 것입니다
  lexicon: HALOT
  rationale: שׁוּב의 반복을 살려 '돌아가다'를 유지했고, अंतिम 절의 부정은 단순 미래보다 불가능을 드러내는 문맥상 뉘앙스를 반영해 '못할 것입니다'로 다듬었습니다.
theological_decisions:
- issue: 히브리어 관용구의 직역 여부
  chosen_reading: 직역보다 관용적 의미를 드러내는 번역을 채택했습니다.
  alternative_readings:
  - 그들의 영혼을 들어 올려 돌아가기를
  - 그들이 자기 영혼을 들어 올리는 그 땅
  rationale: 이 구절의 핵심은 몸짓이 아니라 강한 귀향 열망이므로, 관용구를 그대로 옮기면 한국어 독자가 의미를 놓칠 수 있습니다.
  doctrine_reference: '번역 원칙: 의미 우선의 관용구 처리'
