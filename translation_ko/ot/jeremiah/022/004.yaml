source:
  edition: WLC
  text: כִּ֤י אִם עָשׂוֹ֙ תַּֽעֲשׂ֔וּ אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הַ/בַּ֣יִת הַ/זֶּ֡ה מְלָכִים֩ יֹשְׁבִ֨ים לְ/דָוִ֜ד עַל כִּסְא֗/וֹ רֹֽכְבִים֙ בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֔ים ה֥וּא ו/עבד/ו וְ/עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
  footnotes:
  - marker: a
    text: Or 'this matter' or 'this word.' The Hebrew דָּבָר can refer to a word, matter, or thing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'he, his servants, and his people,' with singular pronouns used distributively after 'kings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 너희가 정말로 이 일을 한다면, 다윗의 왕좌에 앉은 왕들이 이 집의 문들을 통해 들어와, 병거와 말에 타고 올 것입니다—그와 그의 신하들과 그의 백성입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 말’ 또는 ‘이 문제’로도 옮길 수 있습니다. 히브리어 דָּבָר는 말, 일, 문제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그와 그의 신하들과 그의 백성’인데, 앞의 ‘왕들’에 이어지는 분배적 단수 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 만일
  alternatives_korean:
  - 참으로 만일
  - 오직 만일
  lexicon: HALOT
  rationale: 조건의 강조를 살리면서 한국어에서 자연스러운 서두로 옮겼습니다.
- source_word: עָשׂוֹ תַּעֲשׂוּ
  english_pob_choice: you truly do
  chosen_korean: 정말로 이 일을 한다면
  alternatives_korean:
  - 참으로 이 일을 한다면
  - 반드시 이 일을 한다면
  lexicon: HALOT
  rationale: 동사 강조를 한국어의 부사구로 옮겨, 단순 조건이 아니라 강한 수행을 나타내게 했습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이 말
  - 이 일거리
  lexicon: HALOT
  rationale: 여기서는 명령된 행동 전체를 가리키므로, ‘말’보다 ‘일’이 문맥에 더 잘 맞습니다.
- source_word: הוּא וַעֲבָדָיו וְעַמּוֹ
  english_pob_choice: he, his servants, and his people
  chosen_korean: 그와 그의 신하들과 그의 백성
  alternatives_korean:
  - 그와 그의 종들과 그의 백성
  - 그와 그의 관리들과 그의 백성
  lexicon: HALOT
  rationale: 원문의 단수 대명사와 소유격을 그대로 살리되, 왕에게 붙는 수행자들은 문맥상 ‘신하들’이 자연스럽습니다.
theological_decisions:
- issue: 다윗 왕좌의 후계 왕들에 대한 표현
  chosen_reading: 다윗의 왕좌에 앉은 왕들로 옮겨, 다윗 왕조의 지속을 역사적·왕조적 의미로 드러냈습니다.
  alternative_readings:
  - 다윗의 왕좌에 앉는 다윗의 자손들
  - 다윗 왕조의 왕들
  rationale: 본문 자체는 조건부 약속으로서 왕조의 지속을 말하며, 여기서 곧바로 메시아적 해석을 본문 번역에 주입하지 않도록 했습니다.
  doctrine_reference: 번역은 본문이 직접 말하는 역사적-언약적 의미를 우선하고, 신학적 확대 해석은 주석 영역에 남깁니다.
