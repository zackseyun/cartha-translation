base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
  footnotes:
  - marker: a
    text: Or 'this matter' or 'this word.' The Hebrew דָּבָר can refer to a word, matter, or thing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'he, his servants, and his people,' with singular pronouns used distributively after 'kings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 너희가 참으로 이 일[a]을 행한다면, 다윗의 왕좌에 앉은 왕들이 병거와 말을 타고 이 집의 문들로 들어올 것이기 때문입니다. 곧 그[b]와 그의 신하들과 그의 백성입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 말’ 또는 ‘이 문제’로도 옮길 수 있습니다. 히브리어 דָּבָר는 말, 일, 문제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그와 그의 신하들과 그의 백성’인데, 앞의 ‘왕들’에 이어지는 분배적 단수 표현입니다.
    reason: lexical_alternative
