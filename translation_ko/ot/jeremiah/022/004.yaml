- from: 만일 너희가 정말로 이 일을 한다면, 다윗의 왕좌에 앉은 왕들이 이 집의 문들을 통해 들어와, 병거와 말에 타고 올 것입니다—그와 그의 신하들과 그의 백성입니다.[a][b]
  to: 이는 너희가 참으로 이 일[a]을 행한다면, 다윗의 왕좌에 앉은 왕들이 병거와 말을 타고 이 집의 문들로 들어올 것이기 때문입니다. 곧 그[b]와 그의 신하들과 그의 백성입니다.
  rationale: 원문의 조건절과 결과절의 관계를 유지하면서, 한국어에서 중복되던 이동 표현을 제거했습니다. ‘이는’은 כִּי אִם의 앞 문맥 연결을 반영하고, ‘병거와 말을 타고 이 집의 문들로 들어올 것입니다’는 רֹכְבִים בָּרֶכֶב וּבַסּוּסִים와 וּבָאוּ בְשַׁעֲרֵי의 관계를 자연스럽게 재현합니다. 복수 ‘왕들’ 뒤의 단수 ‘그’는 원문과 영어 POB의 분배적 단수 처리를 보존하고, 각주로 이를 명시했습니다.
