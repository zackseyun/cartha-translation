id: JER.22.7
reference: Jeremiah 22:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֥י עָלֶ֛י/ךָ מַשְׁחִתִ֖ים אִ֣ישׁ וְ/כֵלָ֑י/ו וְ/כָֽרְתוּ֙ מִבְחַ֣ר אֲרָזֶ֔י/ךָ וְ/הִפִּ֖ילוּ עַל הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/007.yaml
  text: And I will set apart destroyers against you[a], each with his weapons[c][b]; they will cut down the choicest of your cedars and cast them into the fire.
  footnotes:
  - marker: a
    text: Or 'I will consecrate destroyers against you.' The Hebrew uses the verb often translated 'consecrate' or 'make holy,' here in the sense of setting agents apart for judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'each man with his tools/implements.' The Hebrew word can refer broadly to articles or equipment; in this context it likely means weapons or instruments of destruction.
    reason: lexical_alternative
  - marker: c
    text: Literally 'on the fire.' English 'into the fire' expresses the intended sense more naturally.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 대적할 파괴자들을 구별하여 세우겠습니다. 그들은 저마다 자기 무기를 갖추고 네 가장 좋은 백향목들을 베어 불 속에 던질 것입니다[c][a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너를 대적할 파괴자들을 거룩하게 하겠다.’ 히브리어 동사는 보통 ‘거룩하게 하다’ 또는 ‘성별하다’로 번역되지만, 여기서는 심판을 위해 지정하거나 구별한다는 뜻으로 쓰였습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘저마다 자기 도구/기구를 갖추고.’ 이 단어는 넓게 도구나 기구를 가리킬 수 있으나, 이 문맥에서는 파괴를 위한 무기나 수단을 뜻하는 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘불 위에’입니다. 한국어에서는 ‘불 속에 던질 것이다’가 의도된 결과를 더 자연스럽게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  english_pob_choice: I will set apart
  chosen_korean: 구별하여 세울 것이니
  alternatives_korean:
  - 거룩하게 하겠노라
  - 임명하겠노라
  - 지정하겠노라
  lexicon: HALOT
  rationale: קדשׁ의 성별/구별 이미지를 살리면서도, 심판 문맥에서 대상이 도덕적으로 거룩하다는 뜻으로 오해되지 않게 했습니다.
- source_word: מַשְׁחִתִים
  english_pob_choice: destroyers
  chosen_korean: 멸망시키는 자들
  alternatives_korean:
  - 파괴자들
  - 파멸시키는 자들
  lexicon: HALOT
  rationale: פע동사 파생 명사로서 심판을 수행하는 행위자를 자연스럽게 드러내기 위해 ‘멸망시키는 자들’로 옮겼습니다.
- source_word: אִישׁ וְכֵלָיו
  english_pob_choice: each with his weapons
  chosen_korean: 각 사람은 자기 무기
  alternatives_korean:
  - 각 사람은 자기 도구
  - 한 사람씩 자기 기구
  lexicon: HALOT
  rationale: איש의 분배적 용법을 ‘각 사람은’으로 살렸고, כלי는 이 문맥에서 파괴의 수단을 가리키므로 ‘무기’로 옮겼습니다.
- source_word: וְהִפִּילוּ עַל הָאֵשׁ
  english_pob_choice: and cast them into the fire
  chosen_korean: 불에 던질 것이다
  alternatives_korean:
  - 불 위에 던질 것이다
  - 불에 던져 넣을 것이다
  lexicon: HALOT
  rationale: 직역의 ‘불 위에’보다 결과를 분명히 드러내는 ‘불에 던질 것이다’가 한국어에서 자연스럽고, POB의 형식성도 유지합니다.
theological_decisions:
- issue: קדשׁ 동사의 심판 문맥에서의 신학적 긴장
  chosen_reading: ‘구별하여 세우다’로 옮겨, 야훼께서 심판 도구를 성별하시는 표현을 살렸습니다.
  alternative_readings:
  - 거룩하게 하다
  - 임명하다
  rationale: 히브리어는 거룩하게 하는 언어를 사용하지만 실제 의미는 심판을 위한 지정입니다. 이 긴장을 지우지 않기 위해 종교적 경건어와 행정어의 중간 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, §5
