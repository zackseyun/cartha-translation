source:
  edition: WLC
  text: כִּ֣י אֵ֤ין עֵינֶ֨י/ךָ֙ וְ/לִבְּ/ךָ֔ כִּ֖י אִם עַל בִּצְעֶ֑/ךָ וְ/עַ֤ל דַּֽם הַ/נָּקִי֙ לִ/שְׁפּ֔וֹךְ וְ/עַל הָ/עֹ֥שֶׁק וְ/עַל הַ/מְּרוּצָ֖ה לַ/עֲשֽׂוֹת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/017.yaml
  text: But your eyes and your heart are set on nothing except your dishonest gain[a], on shedding innocent blood, and on practicing oppression and extortion.
  footnotes:
  - marker: a
    text: Or 'and on doing oppression and violence.' The Hebrew term rendered 'extortion' is rare and may more broadly denote violent or ruthless wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 당신의 눈과 당신의 마음은 정직하지 못한 이익[a], 무죄한 피를 흘리는 일, 그리고 억압과 강탈을 행하는 일에만 쏠려 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘억압과 폭력을 행하는 일’로도 옮길 수 있습니다. 여기서 ‘강탈’로 옮긴 희귀어는 더 넓게는 폭력적이거나 잔혹한 불의를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... כִּי אִם
  english_pob_choice: are set on nothing except
  chosen_korean: 은/는 …에만 쏠려 있습니다
  alternatives_korean:
  - 은/는 …밖에 없습니다
  - 은/는 …에만 있습니다
  lexicon: HALOT
  rationale: 부정 뒤의 כִּי אִם은 배타적 집중을 나타내므로, 한국어에서는 ‘…에만 쏠려 있다’로 옮겨 눈과 마음의 전적인 지향을 자연스럽게 살렸습니다.
- source_word: בִּצְעֶךָ
  english_pob_choice: your dishonest gain
  chosen_korean: 정직하지 못한 이익
  alternatives_korean:
  - 부정한 이익
  - 탐욕스러운 이익
  - 부당한 이익
  lexicon: HALOT
  rationale: בצע는 단순한 이익이 아니라 부정한 방식으로 얻는 이익을 뜻하므로, ‘정직하지 못한 이익’으로 옮겨 윤리적 왜곡을 드러냈습니다.
- source_word: הָעֹשֶׁק
  english_pob_choice: oppression
  chosen_korean: 억압
  alternatives_korean:
  - 압제
  - 착취
  - 억울하게 함
  lexicon: HALOT
  rationale: 예언서 문맥에서 사회적 불의와 착취를 포괄하는 말이므로, 한국어에서도 넓게 읽히는 ‘억압’을 택했습니다.
- source_word: הַמְּרוּצָה
  english_pob_choice: extortion
  chosen_korean: 강탈
  alternatives_korean:
  - 폭력
  - 잔혹함
  - 착취
  lexicon: HALOT
  rationale: 희귀어라서 해석 범위가 넓지만, 문맥상 폭력적이고 강압적인 불의에 가깝기 때문에 ‘강탈’로 옮겨 문장 내의 죄목 목록을 유지했습니다.
theological_decisions:
- issue: ‘눈과 마음’의 배타적 지향을 어떻게 드러낼지
  chosen_reading: 행동보다 먼저 욕망과 의도 전체가 불의에 사로잡힌 상태로 번역했습니다.
  alternative_readings:
  - 단순히 ‘관심이 있다’로 완화하는 번역
  - 행동 목록만 제시하는 번역
  rationale: 히브리어는 외적 행위뿐 아니라 내면의 의향까지 포함하므로, ‘쏠려 있습니다’로 번역해 도덕적·내적 전면성을 살렸습니다.
  doctrine_reference: 예레미야서의 예언적 책망은 행위 이전의 마음의 왜곡도 심판 대상으로 본다는 성경적 인간 이해와 부합합니다.
