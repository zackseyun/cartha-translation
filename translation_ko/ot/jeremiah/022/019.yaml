  yaml_path: translation/ot/jeremiah/022/019.yaml
  text: He will be buried with the burial of a donkey—dragged off and thrown out beyond the gates of Jerusalem[a][b].
  footnotes:
  - marker: a
    text: Or, 'He will be buried with a donkey's burial' or 'with a burial like that of a donkey.'
    reason: lexical_alternative
  - marker: b
    text: The imagery conveys a disgraceful disposal of the body outside the city rather than an honorable burial.
    reason: cultural_note
translation:
  language: ko
  text: 그는 나귀의 매장처럼 묻힐 것입니다—끌려가서 예루살렘 성문 밖으로 내던져질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나귀의 매장으로’ 또는 ‘나귀와 같은 매장으로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 시신이 성 밖으로 버려지는 수치스러운 처리를 묘사하며, 명예로운 매장을 가리키지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: קְבוּרַת חֲמוֹר
  english_pob_choice: the burial of a donkey
  chosen_korean: 나귀의 매장
  alternatives_korean:
  - 당나귀의 매장
  - 나귀처럼 묻힘
  - 나귀와 같은 장례
  lexicon: HALOT
  rationale: 히브리어는 ‘~의 매장’이라는 소유격 구조로 수치스러운 비교를 만듭니다. 한국어에서는 이를 가장 자연스럽게 살려 ‘나귀의 매장’으로 옮겼습니다.
- source_word: יִקָּבֵר
  english_pob_choice: he will be buried
  chosen_korean: 묻힐 것입니다
  alternatives_korean:
  - 장사될 것입니다
  - 매장될 것입니다
  lexicon: HALOT
  rationale: 니팔 수동의 미래형으로, 죽은 자가 ‘묻히다’라는 기본 의미를 자연스럽게 반영했습니다.
- source_word: סָחוֹב וְהַשְׁלֵךְ
  english_pob_choice: dragged off and thrown
  chosen_korean: 끌려가서 … 내던져질 것입니다
  alternatives_korean:
  - 끌려가서 … 던져질 것입니다
  - 끌려가 … 내던져질 것입니다
  - 질질 끌려가서 … 버려질 것입니다
  lexicon: HALOT
  rationale: 연속 동작과 모욕적 처리의 감각을 살리기 위해 ‘끌려가서’와 ‘내던져질 것입니다’를 택했습니다. ‘내던지다’는 단순한 throw보다 폐기·모욕의 뉘앙스를 더 잘 드러냅니다.
- source_word: לְשַׁעֲרֵי יְרוּשָׁלִָם
  english_pob_choice: the gates of Jerusalem
  chosen_korean: 예루살렘 성문들 밖으로
  alternatives_korean:
  - 예루살렘 성문 밖으로
  - 예루살렘 성문들 너머로
  - 예루살렘 문들 밖으로
  lexicon: HALOT
  rationale: 복수형 ‘성문들’을 살리되, 한국어에서는 위치 부사를 붙여 ‘밖으로’로 처리해 성 밖 폐기라는 공간감을 분명히 했습니다.
theological_decisions:
- issue: 장례 이미지의 의미
  chosen_reading: 명예로운 장례가 아니라, 도시 밖에 버려지는 수치스러운 폐기라는 뜻으로 읽었습니다.
  alternative_readings:
  - 단지 매장 방식만 말하는 중립적 진술
  - 장례 예법 위반 여부를 강조하지 않는 읽기
  rationale: ‘나귀의 매장’과 ‘끌려가서 내던져질 것’의 연쇄는 정상적 장례가 아니라 모욕적 처리를 강하게 시사합니다. 이는 교리 쟁점이 아니라 문맥상의 함의입니다.
  doctrine_reference: '번역 원칙: 본문의 평이한 의미와 수치를 보존하고, 완곡하게 약화시키지 않음.'
