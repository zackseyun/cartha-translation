id: JER.22.11
reference: Jeremiah 22:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה אֶל שַׁלֻּ֨ם בֶּן יֹאשִׁיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה הַ/מֹּלֵךְ֙ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו אֲשֶׁ֥ר יָצָ֖א מִן הַ/מָּק֣וֹם הַ/זֶּ֑ה לֹֽא יָשׁ֥וּב שָׁ֖ם עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/011.yaml
  text: 'For thus says Yahweh concerning Shallum son of Josiah[a], king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall never return there again.'
  footnotes:
  - marker: a
    text: Or 'to Shallum'; the Hebrew preposition can be read more literally as direct address, but here it likely introduces the subject of the oracle.
    reason: lexical_alternative
translation:
  language: ko
  text: “이는 야훼께서 유다의 왕 살룸[a], 곧 요시야의 아들이며 그의 아버지 요시야를 이어 왕이 된 이, 이곳에서 나간 이에 관하여 이렇게 말씀하십니다. ‘그는 다시는 그곳으로 돌아오지 않을 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살룸에게’로 읽을 수도 있습니다. 히브리어 전치사 אֶל은 문자적으로 직접 상대를 나타낼 수 있으나, 여기서는 예언의 대상을 도입하는 표현으로 보는 것이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For thus says
  chosen_korean: “... 이렇게 말씀하셨습니다.”
  alternatives_korean:
  - “... 이렇게 말씀하십니다.”
  - “... 말씀하시기를”
  lexicon: HALOT
  rationale: 예언 선포 공식의 기능을 살려 ‘이렇게 말씀하셨습니다’로 자연스럽게 옮기되, 문맥상 원인·설명의 כִּי는 앞절과의 연결로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 tetragrammaton을 POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶל שַׁלֻּם
  english_pob_choice: concerning Shallum
  chosen_korean: 살룸[a]에 관하여
  alternatives_korean:
  - 살룸에게
  - 살룸을 두고
  lexicon: HALOT
  rationale: 예언의 주제를 나타내는 אֶל은 직접 호칭보다 ‘~에 관하여’가 한국어에서 더 정확하고 자연스럽습니다.
- source_word: הַמֹּלֵךְ תַּחַת
  english_pob_choice: who reigned in place of
  chosen_korean: 요시야의 뒤를 이어 왕이 되었고
  alternatives_korean:
  - 요시야를 대신하여 다스렸고
  - 요시야 대신 통치하였고
  lexicon: HALOT
  rationale: תַּחַת의 대체·승계 의미를 살리되, 한국어에서 왕위 계승을 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: אֲשֶׁר יָצָא מִן הַמָּקוֹם הַזֶּה
  english_pob_choice: who went out from this place
  chosen_korean: 이곳에서 나갔으나
  alternatives_korean:
  - 이곳을 떠났으나
  - 이곳에서 떠나갔으나
  lexicon: HALOT
  rationale: יָצָא의 기본 의미를 유지하면서, 뒤의 ‘다시는 돌아오지 못할 것입니다’와 연결되도록 문맥상 대조를 분명히 했습니다.
- source_word: לֹא יָשׁוּב שָׁם עוֹד
  english_pob_choice: He shall never return there again
  chosen_korean: 다시는 거기로 돌아오지 못할 것입니다
  alternatives_korean:
  - 거기로 다시는 돌아오지 않을 것입니다
  - 거기로는 더 이상 돌아오지 않을 것입니다
  lexicon: HALOT
  rationale: עוֹד와 부정이 결합한 영구적 비귀환을 한국어의 ‘다시는 … 못할 것입니다’로 강하게 살렸습니다.
theological_decisions:
- issue: 직접 인용문 안의 어조와 예언 선언의 문체
  chosen_reading: 서술 본문은 합쇼체로 유지하고, 직접 인용은 선포형으로 처리했습니다.
  alternative_readings:
  - 직접 인용까지 모두 평서형으로 평준화
  - ‘말씀합니다’로 현재형 선포를 전면화
  rationale: 히브리어 예언 공식의 권위를 보존하면서도 한국어 독자에게 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 'POB translation policy: source-direct, publication-readable formal Korean'
