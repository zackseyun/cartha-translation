revisions:
- from: “야훼께서 유다 왕 요시야의 아들 살룸[a]에 관하여 이렇게 말씀하셨습니다. 그는 요시야의 뒤를 이어 왕이 되었고, 이곳에서 나갔으나, 다시는 거기로 돌아오지 못할 것입니다.”
  to: “이는 야훼께서 유다의 왕 살룸[a], 곧 요시야의 아들이며 그의 아버지 요시야를 이어 왕이 된 이, 이곳에서 나간 이에 관하여 이렇게 말씀하십니다. ‘그는 다시는 그곳으로 돌아오지 않을 것입니다.’”
  rationale: 원문의 설명 접속사, 살룸을 수식하는 관계절들, 그리고 영구적 비귀환의 예언 선언을 보존했습니다. 원문에 없는 역접과 능력의 뉘앙스는 제거했으며, 왕이라는 칭호의 수식 대상을 명확히 했습니다.
