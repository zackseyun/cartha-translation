base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/028.yaml
  text: Is this man Coniah a despised[a], broken vessel[b], or a vessel in which there is no delight? Why have he and his offspring been hurled out and cast into a land that they did not know?
  footnotes:
  - marker: a
    text: Or 'a despised, shattered idol/image.' The Hebrew עֶצֶב can denote a fashioned object, including an idol or image; the main text renders it as 'pot' because the parallel with 'vessel' favors pottery imagery here.
    reason: lexical_alternative
  - marker: b
    text: Coniah is the shortened Hebrew form of the king also known as Jeconiah (cf. Jer 24:1; 27:20).
    reason: cross_reference
translation:
  language: ko
  text: 이 사람이 멸시[a]를 받아 깨진 그릇[b]이냐, 아니면 기뻐할 것이 없는 그릇이냐? 그와 그의 자손이 알지 못하는 땅에 던져져 내버려진 이유가 무엇인가?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '멸시받은 우상'. 히브리어 עֶצֶ브는 만들어진 물건을 가리키며 우상이나 형상을 의미할 수 있으나, 본문은 '그릇'이라는 평행 구조에 따라 '그릇'으로 번역하였다.
    reason: alternative_reading
  - marker: b
    text: 고냐는 예언서에서 요야킨 (예레미야 24:1; 27:20) 으로도 알려진 왕의 히브리어 약어이다.
    reason: alternative_reading
