id: JER.22.24
reference: Jeremiah 22:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַי אָנִי֮ נְאֻם יְהוָה֒ כִּ֣י אִם יִהְיֶ֞ה כָּנְיָ֤הוּ בֶן יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה חוֹתָ֖ם עַל יַ֣ד יְמִינִ֑/י כִּ֥י מִ/שָּׁ֖ם אֶתְּקֶֽ/נְךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/024.yaml
  text: As I live[a], declares Yahweh, even if Coniah son of Jehoiakim, king of Judah, were a signet ring on my right hand[b], even from there I would tear you off.
  footnotes:
  - marker: a
    text: Hebrew Coniah; elsewhere the king is also called Jeconiah.
    reason: alternative_reading
  - marker: b
    text: Or 'seal' or 'signet.' The image is of a royal seal worn on the hand as a symbol of authority and preciousness.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 살아 있노라”야훼의 선언입니다. “유다 왕 여호야김의 아들 고니야가 내 오른손의 인장 반지라 할지라도, 거기에서라도 내가 너를 떼어 내리라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כָּנְיָהוּ(코니야/고니야)는 다른 곳에서 더 긴 이름형으로도 나타납니다.
    reason: alternative_reading
  - marker: b
    text: ‘인장 반지’는 ‘도장’ 또는 ‘인장’의 뜻을 함께 담으며, 왕권과 권위를 상징하는 표지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  english_pob_choice: As I live
  chosen_korean: “내가 살아 있노라”
  alternatives_korean:
  - “내 생명으로 맹세하노라”
  - “내가 살아 있습니다”
  lexicon: HALOT
  rationale: 히브리어의 생명 서약 공식은 직역보다 선서의 힘을 살리는 한국어 표현이 자연스럽습니다. 화자(야훼)의 엄숙한 자기 맹세를 보존하기 위해 간결한 선언형으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언자적 선언 공식은 ‘선언입니다’가 공적·엄숙한 어조를 잘 살립니다. 여호와가 아니라 야훼를 사용해 본문상의 신명 표기를 그대로 반영했습니다.
- source_word: חוֹתָם
  english_pob_choice: signet ring
  chosen_korean: 인장 반지
  alternatives_korean:
  - 도장
  - 인장
  - 왕의 도장 반지
  lexicon: HALOT
  rationale: חוֹתָם은 단순한 ‘도장’보다 권위의 표지로서 손에 끼는 인장을 가리키므로, 물건과 상징성을 함께 드러내는 ‘인장 반지’로 옮겼습니다.
- source_word: כָּנְיָהוּ
  english_pob_choice: Coniah
  chosen_korean: 고니야
  alternatives_korean:
  - 고니아
  - 여고냐
  lexicon: HALOT
  rationale: 이 절의 축약형 이름을 본문에 있는 그대로 반영했습니다. 익숙한 ‘여고냐’로 평준화하지 않고, 예언적 조롱의 뉘앙스를 유지했습니다.
- source_word: אֶתְּקֶנְךָּ
  english_pob_choice: I would tear you off
  chosen_korean: 내가 너를 떼어 내리라
  alternatives_korean:
  - 내가 너를 뜯어 내리라
  - 내가 너를 찢어 떼어 내리라
  lexicon: HALOT
  rationale: 동사의 폭력성과 제거 이미지를 살리되, 한국어에서 가장 자연스럽고 읽기 쉬운 표현으로 옮겼습니다. ‘떼어 내다’는 위치에서 강제로 분리하는 심판의 뜻을 충분히 전달합니다.
theological_decisions:
- issue: 신명(יהוה) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 하나님의 언약 이름을 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 보존했습니다. 일반 호칭인 ‘주님’으로 완화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 직접화법의 엄숙한 어조
  chosen_reading: “내가 살아 있노라”
  alternative_readings:
  - “내가 살아 있습니다”
  - “내 생명으로 맹세하노라”
  rationale: 야훼의 자기 맹세는 단순 설명보다 직접 인용이 신학적 무게를 더 잘 드러냅니다. 한국어 합쇼체 문맥 안에서 고어체 맹세형을 제한적으로 사용했습니다.
  doctrine_reference: 'Translation philosophy §1: preserve oath force and prophetic speech act'
