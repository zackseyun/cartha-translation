base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/026.yaml
  text: And I will hurl you and your mother who gave birth to you into another land[a], where you were not born, and there you will die.
  footnotes:
  - marker: a
    text: Hebrew shifts from singular ('you') to plural verbs ('you were born,' 'you will die'), addressing the king together with his mother.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너와 너를 낳은 네 어머니를 너희가[a] 태어나지 않은 다른 땅으로 내던질 것입니다. 너희는 거기에서 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 처음에 단수 ‘너’를 사용하다가 뒤에서 복수 동사로 바뀌며, 왕과 그의 어머니를 함께 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  english_pob_choice: I will hurl
  chosen_korean: 던지리니
  alternatives_korean:
  - 내던지리니
  - 내치리니
  - 투척하리니
  lexicon: HALOT
  rationale: 하필형의 강한 강제성과 심판적 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 폭력성을 분명히 드러내는 동사로 옮겼습니다.
- source_word: אֹתְךָ וְאֶת אִמְּךָ
  english_pob_choice: you and your mother
  chosen_korean: 너와 네 어머니를
  alternatives_korean:
  - 너와 네 어머니를 함께
  - 너와 어머니를
  lexicon: HALOT
  rationale: 히브리어의 병렬 목적어를 직접 살려 왕과 그의 어머니가 함께 심판 대상임을 분명히 했습니다.
- source_word: עַל הָאָרֶץ אַחֶרֶת
  english_pob_choice: into another land
  chosen_korean: 다른 땅으로
  alternatives_korean:
  - 다른 나라로
  - 다른 땅 안으로
  lexicon: HALOT
  rationale: ‘땅’은 히브리어의 지리·언약적 배경을 보존하며, 추방의 이동 방향은 조사 ‘-으로’로 자연스럽게 나타냈습니다.
- source_word: אֲשֶׁר לֹא יֻלַּדְתֶּם שָׁם
  english_pob_choice: where you were not born
  chosen_korean: 너희가 태어나지 않은
  alternatives_korean:
  - 너희가 그곳에서 태어나지 않은
  - 너희가 거기서 태어나지 않은
  lexicon: HALOT
  rationale: 영어 POB의 주석대로 여기서는 복수 동사가 왕과 어머니를 함께 가리키므로, 한국어도 ‘너희’로 집합적 대상을 드러냈습니다.
- source_word: וְשָׁם תָּמֽוּתוּ
  english_pob_choice: and there you will die
  chosen_korean: 거기에서 너희는 죽을 것입니다
  alternatives_korean:
  - 거기에서 너희는 죽으리라
  - 그곳에서 너희는 죽을 것입니다
  lexicon: HALOT
  rationale: 미래 확정의 예언문을 합쇼체로 옮기되, 복수 종결을 유지해 주어지는 심판의 대상이 둘임을 드러냈습니다.
theological_decisions:
- issue: 복수 동사의 대상
  chosen_reading: 한국어 본문에서 ‘너희’로 옮겨 왕과 그의 어머니가 함께 예언적 심판 아래 있음을 드러냈습니다.
  alternative_readings:
  - 계속 ‘너’로 일관하는 번역
  - ‘너희’와 각주로만 설명하는 번역
  rationale: 히브리어가 후반부에서 단수에서 복수로 전환하는 문법적 긴장을 본문에서 가시화하는 편이 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: 문법·담화 관찰에 따른 번역 সিদ্ধান্ত
