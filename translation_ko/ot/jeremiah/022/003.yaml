id: JER.22.3
reference: Jeremiah 22:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲשׂ֤וּ מִשְׁפָּט֙ וּ/צְדָקָ֔ה וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עָשׁ֑וֹק וְ/גֵר֩ יָת֨וֹם וְ/אַלְמָנָ֤ה אַל תֹּנוּ֙ אַל תַּחְמֹ֔סוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֥וֹם הַ/זֶּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
  footnotes:
  - marker: a
    text: Or 'Do what is just and right.' The Hebrew uses two terms, 'justice' and 'righteousness,' which together express faithful public and moral conduct.
    reason: lexical_alternative
  - marker: b
    text: '''Resident foreigner'' translates a term for a non-native living among Israel, often socially vulnerable; traditionally ''sojourner.'''
    reason: cultural_note
  - marker: c
    text: Or 'Do not wrong or do violence to' the resident foreigner, the fatherless, and the widow.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “정의와 의를 행하고[a], 강탈당한 사람을 억압하는 자의 손에서 건져 내십시오. 거류하는 이방인과 고아와 과부를 억압하지 말며, 그들에게 폭력을 행사하지 말고[b][c], 이곳에서 무죄한 피를 흘리지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정의와 바른 일을 행하고.” 히브리어는 ‘정의’와 ‘의’ 두 용어를 함께 써서, 공적이고 도덕적인 올바름을 아울러 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “거류하는 이방인과 고아와 과부를 억압하거나 학대하지 말고.”
    reason: alternative_reading
  - marker: c
    text: 여기서 ‘폭력을 행사하다’는 ‘억압하다’와 구분되는 두 번째 금지로, 히브리어의 병렬을 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: WLC; POB audit trail
  rationale: 예언자적 전령 공식은 한국어에서 자연스럽게 풀어 쓰되, 신명은 POB 기준을 따라 야훼로 옮겼습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 공의와 의
  - 정의와 공의
  lexicon: HALOT
  rationale: 두 개의 병렬 윤리 용어를 분리해 살리되, צְדָקָה는 문맥상 도덕적/공적 바름을 가리키므로 ‘의’로 옮겼습니다.
- source_word: גֵר
  english_pob_choice: resident foreigner
  chosen_korean: 거류하는 이방인
  alternatives_korean:
  - 거주 외국인
  - 나그네
  lexicon: HALOT
  rationale: 상주하면서도 취약한 사회적 지위를 가진 타문화 거주자를 뜻하므로, 의미를 드러내는 설명적 표현을 택했습니다.
- source_word: אַל תֹּנוּ אַל תַּחְמֹסוּ
  english_pob_choice: Do not oppress ... and do not do violence to
  chosen_korean: 억압하지 말며 ... 폭력을 행사하지 말고
  alternatives_korean:
  - 학대하지 말며 ... 해치지 말고
  - 착취하지 말며 ... 폭행하지 말고
  lexicon: HALOT
  rationale: 두 금지를 서로 구분해, 첫 번째는 지속적 억압, 두 번째는 폭력적 가해라는 차이를 한국어에서 유지했습니다.
- source_word: דָם נָקִי
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 의인의 피
  - 죄 없는 피
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해, 부당한 살해 금지라는 예언서의 강한 법정·윤리적 어감을 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 언약명 יהוה를 직접 사용하므로, POB 기준에 따라 신명 자체를 드러내는 야훼를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘거류하는 이방인’의 사회신학적 함의
  chosen_reading: 취약한 타자 보호를 명시하는 번역
  alternative_readings:
  - 단순히 외국인 금지로 읽히는 번역
  - 전통적 ‘나그네’
  rationale: 본문은 단순한 국적 문제가 아니라 공동체 내 취약자 보호를 요구하므로, 현대 독자가 사회적 함의를 놓치지 않도록 풀어 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5'
