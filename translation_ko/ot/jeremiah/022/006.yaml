id: JER.22.6
reference: Jeremiah 22:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל בֵּית֙ מֶ֣לֶךְ יְהוּדָ֔ה גִּלְעָ֥ד אַתָּ֛ה לִ֖/י רֹ֣אשׁ הַ/לְּבָנ֑וֹן אִם לֹ֤א אֲשִֽׁיתְ/ךָ֙ מִדְבָּ֔ר עָרִ֖ים לֹ֥א נושבה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/006.yaml
  text: 'For thus says Yahweh concerning the house of the king of Judah: You are Gilead to me[a], the summit of Lebanon; surely I will make you a wilderness[c][b], cities not inhabited.'
  footnotes:
  - marker: a
    text: Or 'the head/top of Lebanon.' The Hebrew says 'head of Lebanon,' an idiom for its height or prominence.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'surely I will make you' renders an emphatic Hebrew oath-like expression (literally, 'if not I make you').
    reason: lexical_alternative
  - marker: c
    text: 'Or ''uninhabited cities.'' The Hebrew may describe the result of judgment: cities left without inhabitants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 유다 왕의 집에 대하여 이같이 말씀하십니다. “너는 내게 길르앗이요 레바논의 봉우리[a]이다. 정녕[b] 내가 너를 광야로, 사람이 살지 않는 성읍들[c]로 만들겠다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레바논의 머리/꼭대기’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘레바논의 머리’라고 하며, 높이와 두드러짐을 나타내는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 문자적으로는 ‘내가 너를 만들지 않으면’이지만, 맹세적 강조로서 ‘정녕 내가 너를 만들겠다’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘거주민이 없는 성읍들’로 옮길 수 있습니다. 히브리어는 심판의 결과로 성읍들이 거주민 없이 남게 된 상태를 묘사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 신명은 학문적 음역인 야훼로 옮겨, 본문의 언약적 신명성을 유지했습니다.
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  english_pob_choice: the house of the king of Judah
  chosen_korean: 유다 왕의 집
  alternatives_korean:
  - 유다 왕의 궁
  - 유다의 왕실
  lexicon: HALOT
  rationale: 직역상 '집'이지만, 본문이 왕정 체제를 가리키는 넓은 범위를 유지하므로 '집'을 살렸습니다.
- source_word: רֹאשׁ הַלְּבָנוֹן
  english_pob_choice: the summit of Lebanon
  chosen_korean: 레바논의 꼭대기
  alternatives_korean:
  - 레바논의 머리
  - 레바논의 정상
  lexicon: HALOT
  rationale: רֹאשׁ의 문자적 '머리'를 한국어 관용어로 풀어, 지리적 높이와 두드러짐의 비유를 자연스럽게 전달했습니다.
- source_word: אִם לֹא
  english_pob_choice: surely
  chosen_korean: 진실로
  alternatives_korean:
  - 정녕
  - 반드시
  - 만일 그렇지 않으면
  lexicon: HALOT
  rationale: 조건절이 아니라 맹세적 강조로 쓰인 표현이므로, 확실한 선언을 드러내는 '진실로'를 택했습니다.
- source_word: עָרִים לֹא נושבה
  english_pob_choice: cities not inhabited
  chosen_korean: 사람이 살지 않는 성읍들
  alternatives_korean:
  - 거주민이 없는 성읍들
  - 사람이 살지 않는 도시들
  lexicon: HALOT
  rationale: 결과 상태를 드러내는 표현으로 읽어, 멸망 뒤의 폐허 상태가 분명하게 보이도록 옮겼습니다.
theological_decisions:
- issue: 찬양적 비유와 심판 선언의 긴장 유지
  chosen_reading: 본문은 유다 왕실을 길르앗과 레바논의 정상처럼 귀하고 높은 것으로 묘사한 뒤, 곧바로 황폐화 심판을 선언합니다.
  alternative_readings:
  - 지명들을 단순한 궁전 재료나 지리 정보로 좁혀 이해하는 읽기
  rationale: 히브리어의 비유적 찬사와 단호한 심판이 함께 서 있으므로, 그 긴장을 해소하지 않고 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
