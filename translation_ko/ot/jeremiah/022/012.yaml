id: JER.22.12
reference: Jeremiah 22:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֗י בִּ/מְק֛וֹם אֲשֶׁר הִגְל֥וּ אֹת֖/וֹ שָׁ֣ם יָמ֑וּת וְ/אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לֹֽא יִרְאֶ֥ה עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/012.yaml
  text: For in the place where they have exiled him[a], there he will die, and he will never see this land again.
  footnotes:
  - marker: a
    text: Or, 'they have carried him away' / 'they have led him into exile.' The Hebrew verb specifically denotes causing someone to go into exile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그를 유배시킨 곳에서 그는 거기서 죽을 것이며, 이 땅을 다시는 보지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 끌어다가 유배시켰다’ / ‘그를 유배로 이끌었다’. 히브리어 동사는 사람을 유배 상태로 만들게 함을 구체적으로 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: '-'
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞절의 이유를 밝히는 설명적 접속사이므로 한국어에서는 자연스럽게 종속절로 풀어 옮겼습니다.
- source_word: בִּמְקוֹם אֲשֶׁר
  english_pob_choice: in the place where
  chosen_korean: 유배시킨 곳에서
  alternatives_korean:
  - 그들이 그를 유배한 곳에서
  - 그가 끌려간 곳에서
  lexicon: HALOT
  rationale: 장소성과 관계절을 한국어 한 덩어리로 자연스럽게 살리되, 뒤의 '거기서'와 함께 반복된 장소 강조를 보존했습니다.
- source_word: הִגְלוּ אֹתוֹ
  english_pob_choice: they have exiled him
  chosen_korean: 그를 유배시킨
  alternatives_korean:
  - 그를 끌고 간
  - 그를 포로로 잡아간
  lexicon: HALOT
  rationale: הִגְלוּ는 단순 이동이 아니라 강제적 추방/유배를 뜻하므로 '유배시킨'이 원문의 정치적·강제적 뉘앙스를 가장 잘 드러냅니다.
- source_word: לֹא יִרְאֶה עוֹד
  english_pob_choice: he will never see ... again
  chosen_korean: 다시는 보지 못할 것입니다
  alternatives_korean:
  - 더는 보지 못할 것입니다
  - 다시 보지 않을 것입니다
  lexicon: HALOT
  rationale: עוֹד의 지속적 부정을 한국어의 '다시는'으로 옮겨 최종성과 단절감을 분명히 했습니다.
theological_decisions:
- issue: ‘이 땅’의 범위
  chosen_reading: 예언 맥락상 유다 땅/예루살렘의 고향 땅을 가리키는 정치적·역사적 표현으로 옮겼습니다.
  alternative_readings:
  - 그 땅
  - 조국
  rationale: אָרֶץ는 여기서 추상적 '땅'이 아니라 왕이 다시는 돌아오지 못할 실향의 땅을 가리키므로, 한국어도 그 상실감을 보존해야 합니다.
  doctrine_reference: 예언서의 심판과 추방 모티프
