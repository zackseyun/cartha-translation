id: JER.22.22
reference: Jeremiah 22:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל רֹעַ֨יִ/ךְ֙ תִּרְעֶה ר֔וּחַ וּֽ/מְאַהֲבַ֖יִ/ךְ בַּ/שְּׁבִ֣י יֵלֵ֑כוּ כִּ֣י אָ֤ז תֵּבֹ֨שִׁי֙ וְ/נִכְלַ֔מְתְּ מִ/כֹּ֖ל רָעָתֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/022.yaml
  text: All your shepherds the wind will shepherd[a], and your lovers will go into captivity[b]; then you will surely be ashamed and humiliated because of all your evil.
  footnotes:
  - marker: a
    text: Or 'All your leaders the wind will scatter.' The Hebrew uses the same shepherding root for 'your shepherds' and 'the wind will shepherd [them],' creating an ironic wordplay.
    reason: lexical_alternative
  - marker: b
    text: '''Your lovers'' is a prophetic metaphor for Judah''s illicit political allies and attachments.'
    reason: cultural_note
translation:
  language: ko
  text: 네 모든 목자들은 바람이 그들을 몰아가고, 네 연인들은 포로로 끌려갈 것입니다. 그러면 네가 네 모든 악 때문에 반드시 수치를 당하고 부끄러워할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목자들’은 예언서에서 종종 지도자들을 가리키는 은유입니다. 여기서는 같은 어근의 반복이 만드는 역설을 살리기 위해 직역 이미지를 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘연인들’은 문자적 연애 대상이라기보다 유다의 부정한 정치적 의존과 결속을 가리키는 예언적 은유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעַיִךְ
  english_pob_choice: your shepherds
  chosen_korean: 네 모든 목자들
  alternatives_korean:
  - 네 통치자들
  - 네 지도자들
  - 너를 돌보는 이들
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 살리기 위해 기본은 ‘목자들’로 두되, 문맥상 정치적 지도자를 가리키는 예언적 은유를 유지했습니다. ‘모든’은 כָּל의 포괄성을 반영합니다.
- source_word: תִּרְעֶה רוּחַ
  english_pob_choice: the wind will shepherd
  chosen_korean: 바람이 그들을 몰아가고
  alternatives_korean:
  - 바람이 그들을 목양하고
  - 바람이 그들을 치고 가고
  - 바람이 그들을 흩어버리고
  lexicon: HALOT
  rationale: 동일 어근의 말놀이를 한국어에서 자연스럽게 재현하기 어려워, ‘목자들’의 역설적 의미를 해치지 않으면서 결과를 드러내는 ‘몰아가고’로 옮겼습니다. ‘흩어버리고’는 뜻은 분명하지만 원문의 어휘 반복을 더 강하게 평준화합니다.
- source_word: מְאַהֲבַיִךְ
  english_pob_choice: your lovers
  chosen_korean: 네 연인들
  alternatives_korean:
  - 네 동맹자들
  - 네 사랑하는 자들
  - 네 애인들
  lexicon: HALOT
  rationale: 예언서에서의 성적/정치적 은유를 살리기 위해 직설적인 ‘연인들’을 택했습니다. ‘동맹자들’은 해석을 앞세워 은유의 날카로움을 약화시킵니다.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  english_pob_choice: will go into captivity
  chosen_korean: 포로로 끌려갈 것입니다
  alternatives_korean:
  - 포로가 되어 갈 것입니다
  - 포로 생활로 들어갈 것입니다
  - 포로로 가게 될 것입니다
  lexicon: HALOT
  rationale: שׁבי의 핵심은 포로 됨이며, 한국어에서는 ‘포로로 끌려가다’가 자연스럽고 수동적 강제성을 분명히 드러냅니다.
- source_word: תֵּבֹשִׁי וְנִכְלַמְתְּ
  english_pob_choice: you will surely be ashamed and humiliated
  chosen_korean: 반드시 수치를 당하고 부끄러워할 것입니다
  alternatives_korean:
  - 반드시 부끄러워하고 수치를 당할 것입니다
  - 반드시 수치를 당하며 굴욕을 겪을 것입니다
  - 반드시 창피를 당하고 수치를 느낄 것입니다
  lexicon: HALOT
  rationale: 두 동사는 의미가 겹치지만 각각의 뉘앙스를 살리기 위해 ‘수치를 당하고’와 ‘부끄러워할 것입니다’로 나눴습니다. ‘반드시’는 אָז 뒤의 확정적 심판 어조를 반영합니다.
- source_word: מִכֹּל רָעָתֵךְ
  english_pob_choice: because of all your evil
  chosen_korean: 네 모든 악 때문에
  alternatives_korean:
  - 네 모든 악행 때문에
  - 네 모든 악함 때문에
  - 네 모든 악 때문에
  lexicon: HALOT
  rationale: רָעָה의 넓은 의미를 유지하기 위해 ‘악’으로 옮겼고, 인과 관계는 ‘때문에’로 분명히 했습니다. ‘악행’은 행위로 좁혀져 원문의 폭을 줄입니다.
theological_decisions:
- issue: 예언적 은유인 ‘목자들’과 ‘연인들’의 보존
  chosen_reading: 설명어로 풀지 않고 본문에서 ‘목자들’과 ‘연인들’을 그대로 유지했습니다.
  alternative_readings:
  - 네 지도자들
  - 네 동맹자들
  rationale: 이 본문은 유다의 정치 지도자와 부정한 의존을 은유적으로 고발합니다. 이미지를 보존해야 심판 선언의 수사적 힘과 도덕적 비난이 함께 살아납니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
