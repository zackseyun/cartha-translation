source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה רֵ֖ד בֵּֽית מֶ֣לֶךְ יְהוּדָ֑ה וְ/דִבַּרְתָּ֣ שָׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/001.yaml
  text: 'Thus says Yahweh: Go down to the house of the king of Judah[c][b][a], and speak there this word:'
  footnotes:
  - marker: a
    text: Or 'This is what the LORD says.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the king of Judah'; this likely refers to the royal palace.
    reason: cultural_note
  - marker: c
    text: Or 'this message.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 유다 왕의 집으로 내려가 그곳에서 이 말을 전하십시오:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 이렇게 말씀하십니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유다 왕의 집’이라고 되어 있으며, 여기서는 왕궁을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘이 말’을 ‘이 메시지’로 볼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 이것이 야훼께서 말씀하시는 바입니다
  lexicon: HALOT
  rationale: 예언자적 전달 공식은 현재형 선언으로 살리되, ‘이렇게’로 כֹּה의 공식성을 유지하고 하나님의 이름은 본문 원형을 따라 야훼로 옮겼습니다.
- source_word: רֵד
  english_pob_choice: Go down
  chosen_korean: 내려가
  alternatives_korean:
  - 가십시오
  - 내려오십시오
  lexicon: HALOT
  rationale: ירד의 방향성을 직접 살려 ‘내려가’로 옮겼습니다. 예언자 발화의 명령형을 유지하면서도 현대 한국어로 자연스럽습니다.
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  english_pob_choice: to the house of the king of Judah
  chosen_korean: 유다 왕의 집으로
  alternatives_korean:
  - 유다 왕의 궁으로
  - 유다 왕궁으로
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 기본으로 유지해 본문 접촉면을 살렸습니다. 본문 주해상 궁궐을 가리킬 가능성은 있으나, 본문 자체의 표현을 우선했습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this word
  chosen_korean: 이 말을
  alternatives_korean:
  - 이 말씀을
  - 이 메시지를
  lexicon: HALOT
  rationale: דָּבָר는 여기서 뒤이어 선포될 특정한 예언 내용을 가리키므로, 한국어에서는 문어체의 ‘말’이 가장 직접적입니다. ‘메시지’는 의미는 통하지만 해석적입니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה를 야훼로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 여호와 이름 자체가 직접 나오는 예언 공식이므로, 프로젝트 기본값에 따라 신명기를 가리는 대체 번역보다 고유한 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
