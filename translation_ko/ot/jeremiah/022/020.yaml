  verdict: revise
  source_fidelity: 지명들의 병렬과 반복 명령, 그리고 מְאַהֲבָיִךְ의 은유는 대체로 잘 보존되었습니다. 그러나 ‘사랑하는 이들’은 한국어에서 ‘당신이 사랑하는 사람들’이라는 뜻으로 읽히기 쉬워, ‘당신의 연인들/lover들’이라는 원문의 소유 관계와 예언적 은유를 바꿉니다.
  naturalness: ‘왜냐하면 … 때문입니다’는 인과 표지가 중복되어 자연스럽지 않습니다. ‘이는 … 때문입니다’가 현대 표준어 합쇼체에서 자연스럽고 원문의 כִּי가 이끄는 이유절을 충실히 드러냅니다.
  terminology: מְאַהֲבָיִךְ는 본문에서 ‘연인들’로 옮기고 정치적 동맹이라는 문맥적 지시는 주석으로 보완하는 것이 적절합니다. 아바림은 레바논·바산과 병렬된 지명으로 유지할 수 있습니다.
  issues:
