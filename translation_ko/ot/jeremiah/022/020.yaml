id: JER.22.20
reference: Jeremiah 22:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲלִ֤י הַ/לְּבָנוֹן֙ וּֽ/צְעָ֔קִי וּ/בַ/בָּשָׁ֖ן תְּנִ֣י קוֹלֵ֑/ךְ וְ/צַֽעֲקִי֙ מֵֽ/עֲבָרִ֔ים כִּ֥י נִשְׁבְּר֖וּ כָּל מְאַהֲבָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/020.yaml
  text: Go up to Lebanon and cry out[a]; raise your voice in Bashan; cry out from Abarim[b], for all your lovers are shattered.
  footnotes:
  - marker: a
    text: Or 'from the crossings' or 'from the regions beyond'; the Hebrew may be understood more literally, but here it likely refers to Abarim as a place name alongside Lebanon and Bashan.
    reason: lexical_alternative
  - marker: b
    text: '''Your lovers'' is a prophetic metaphor for Judah''s foreign allies or political partners.'
    reason: cultural_note
translation:
  language: ko
  text: 레바논으로 올라가 외치십시오. 바산에서 목소리를 높이십시오. 아바림에서 외치십시오. 왜냐하면 당신의 모든 사랑하는 이들이 부서졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘건너편 지역에서’, ‘지역 너머에서’로도 이해할 수 있습니다. 히브리어는 더 문자적으로는 ‘건너는 곳들/지역들’을 뜻할 수 있지만, 여기서는 레바논과 바산과 나란히 놓인 지명 ‘아바림’을 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: ‘당신의 사랑하는 이들’은 예언적 비유로, 문맥상 유다의 외국 동맹이나 정치적 파트너를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  english_pob_choice: Go up
  chosen_korean: 올라가
  alternatives_korean:
  - 오르십시오
  - 올라가십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형의 상승·이동 명령을 자연스러운 현대 한국어로 살리되, 시적 호소의 강도를 유지했습니다.
- source_word: וּצְעָקִי / וְצַעֲקִי
  english_pob_choice: cry out
  chosen_korean: 외치십시오
  alternatives_korean:
  - 소리치십시오
  - 부르짖으십시오
  lexicon: HALOT
  rationale: 반복되는 צעק의 긴급한 외침을 현대적이면서도 격한 표현인 ‘외치다’로 옮겼습니다.
- source_word: תְּנִי קוֹלֵךְ
  english_pob_choice: raise your voice
  chosen_korean: 목소리를 높이십시오
  alternatives_korean:
  - 목소리를 내십시오
  - 소리를 높이십시오
  lexicon: HALOT
  rationale: 직역적인 ‘당신의 목소리를 주다’보다 한국어 관용에 맞는 ‘목소리를 높이다’가 원문의 수사적 병행을 잘 드러냅니다.
- source_word: מֵעֲבָרִים
  english_pob_choice: from Abarim
  chosen_korean: 아바림에서
  alternatives_korean:
  - 건너편 지역에서
  - 건넘의 지역에서
  lexicon: HALOT
  rationale: 본문의 지리적 삼중대조(레바논, 바산, 아바림)를 살려 고유 지명으로 유지했습니다. 공통명사적 가능성은 본문 주석으로 처리하는 편이 더 적절합니다.
- source_word: מְאַהֲבָיִךְ
  english_pob_choice: your lovers
  chosen_korean: 당신의 모든 사랑하는 이들
  alternatives_korean:
  - 당신의 연인들
  - 당신의 동맹들
  lexicon: HALOT
  rationale: 예언서의 은유를 그대로 살리면서도 한국어에서 과도하게 성적·관계적 뉘앙스로 치우치지 않도록 ‘사랑하는 이들’로 옮겼습니다. 문맥상 정치적 동맹을 가리키는 점은 주석으로 보완합니다.
- source_word: נִשְׁבְּרוּ
  english_pob_choice: are broken
  chosen_korean: 부서졌기 때문입니다
  alternatives_korean:
  - 산산이 부서졌기 때문입니다
  - 깨졌기 때문입니다
  lexicon: HALOT
  rationale: 완료형의 결과 상태를 살리면서, 영어 POB의 ‘are broken’에 대응하는 자연스러운 한국어 현재 결과 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘your lovers’의 은유 보존
  chosen_reading: 본문에는 은유적 표현을 그대로 두고, 그 의미 범위를 ‘사랑하는 이들’로 유지했습니다.
  alternative_readings:
  - ‘동맹들’로 해석 번역
  - ‘연인들’로 직역
  rationale: 예언자적 언어의 수사적 충격을 약화하지 않기 위해 은유를 보존했습니다. 동시에 한국어에서 지나치게 노골적인 성적 뉘앙스를 피하려고 약간 완화된 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy #3 and #5'
