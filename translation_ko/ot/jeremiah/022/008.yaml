  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
  footnotes:
  - marker: a
    text: 'Hebrew: ''each man to his neighbor,'' a distributive idiom meaning individuals speaking to one another.'
    reason: lexical_alternative
  - marker: b
    text: Or 'pass by this city' / 'pass past this city.' The Hebrew preposition can suggest movement past the city rather than through it.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 나라들이 이 성[a] 곁을 지나가며, 각 사람이 자기 이웃[b]에게 이렇게 말할 것입니다. “어찌하여 야훼께서 이 큰 성에 이렇게 하셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘지나가다’는 이 성을 통과한다기보다 그 곁을 지나거나 지나쳐 가는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘각 사람이 자기 이웃에게’는 사람들이 서로 말하는 모습을 나타내는 분배적 관용 표현입니다.
    reason: lexical_alternative
