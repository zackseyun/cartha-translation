source:
  edition: WLC
  text: וְ/עָֽבְרוּ֙ גּוֹיִ֣ם רַבִּ֔ים עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אָֽמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/עִ֥יר הַ/גְּדוֹלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
  footnotes:
  - marker: a
    text: 'Hebrew: ''each man to his neighbor,'' a distributive idiom meaning individuals speaking to one another.'
    reason: lexical_alternative
  - marker: b
    text: Or 'pass by this city' / 'pass past this city.' The Hebrew preposition can suggest movement past the city rather than through it.
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 나라들이 이 도시[a]를 지나가며, 각자가 자기 이웃[b]에게 말할 것입니다. “어찌하여 야훼께서 이 큰 도시에 이같이 행하셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이 도시를 지나가며’라는 움직임을 나타내며, ‘통과하다’보다 ‘지나가다/지나치다’가 문맥에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘각 사람 to 그의 이웃’은 서로 말을 주고받는 분배적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ
  english_pob_choice: will pass by
  chosen_korean: 지나가며
  alternatives_korean:
  - 지나가고
  - 지나쳐 가며
  - 통과하며
  lexicon: HALOT
  rationale: עָבַר의 문맥상 ‘이 도시’를 스쳐 지나가는 움직임을 한국어 자연문으로 살렸습니다.
- source_word: גּוֹיִם רַבִּים
  english_pob_choice: many nations
  chosen_korean: 많은 나라들이
  alternatives_korean:
  - 많은 민족들이
  - 많은 이방 나라들이
  lexicon: HALOT
  rationale: 예레미야의 국제적 심판 문맥에서 גּוֹיִם은 정치-집단 단위인 ‘나라들’이 가장 직접적입니다.
- source_word: אִישׁ אֶל רֵעֵהוּ
  english_pob_choice: each man will say to his neighbor
  chosen_korean: 각자가 자기 이웃에게
  alternatives_korean:
  - 각 사람이 서로에게
  - 사람들이 서로에게
  lexicon: HALOT
  rationale: 히브리어의 분배적 관용구를 살리되, 한국어에서는 ‘각자가 … 이웃에게’로 자연스럽게 풀었습니다.
- source_word: עַל מֶה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무엇 때문에
  lexicon: HALOT
  rationale: 원인 질문의 ուժ와 예언적 책망의 어조를 고려해 ‘어찌하여’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 언약명 יְהוָה를 ‘야훼’로 음역해 본문에서 보존했습니다.
theological_decisions:
- issue: אִַישׁ אֶל רֵעֵהוּ의 분배적 남성형 표현 처리
  chosen_reading: ‘각자가 자기 이웃에게’로 옮겨, 분배적 의미를 살리되 불필요한 성중립 재구성은 피했습니다.
  alternative_readings:
  - 사람들이 서로에게
  - 한 사람씩 서로에게
  rationale: 히브리어의 남성 단수 표현이 일반적 분배 용법이므로, 본문의 형식을 지우지 않는 방향이 더 소스-충실합니다.
  doctrine_reference: Translation philosophy §4
