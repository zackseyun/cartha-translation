id: JER.22.16
reference: Jeremiah 22:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דָּ֛ן דִּין עָנִ֥י וְ/אֶבְי֖וֹן אָ֣ז ט֑וֹב הֲ/לוֹא הִ֛יא הַ/דַּ֥עַת אֹתִ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/016.yaml
  text: He defended the cause of the poor and needy[a]; then it was well[b]. Is not that what it means to know me? declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'He judged the case of the poor and needy'; the Hebrew idiom is forensic, referring to upholding their legal cause.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Is not that the knowledge of me?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 가난한 사람과 궁핍한 사람의 소송을 변호했습니다[a]. 그러면 잘되었습니다[b]. 그것이 나를 아는 것이라고 하지 않습니까? 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 사람과 궁핍한 사람의 사건을 판결했습니다’; 히브리어 관용구는 법정적으로 그들의 정당한 소송을 지지하는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나를 아는 지식이 아니겠습니까?’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן דִּין
  english_pob_choice: defended the cause of
  chosen_korean: 소송을 변호했습니다
  alternatives_korean:
  - 사건을 심판했습니다
  - 권리를 옹호했습니다
  - 사정을 판결했습니다
  lexicon: HALOT
  rationale: 히브리어의 דין/דן 결합은 단순히 판단하다보다 법정적·대변적 의미가 강하므로, 가난한 자의 편에서 그들의 법적 권리를 변호하는 뉘앙스를 살렸습니다.
- source_word: עָנִי וְאֶבְיוֹן
  english_pob_choice: the poor and needy
  chosen_korean: 가난한 사람과 궁핍한 사람
  alternatives_korean:
  - 가난한 자와 궁핍한 자
  - 빈곤한 사람과 궁핍한 사람
  - 가난한 이들과 가난한 이들
  lexicon: HALOT
  rationale: 두 표현을 각각 살려 사회적 취약성을 중첩적으로 드러내되, 현대 한국어에서 자연스럽고 구별되는 표현으로 옮겼습니다.
- source_word: הֲלוֹא הִיא הַדַּעַת אֹתִי
  english_pob_choice: Is not that what it means to know me?
  chosen_korean: 그것이 나를 아는 것이라고 하지 않습니까?
  alternatives_korean:
  - 그것이 나를 아는 것 아닙니까?
  - 그것이 곧 나를 아는 일 아닙니까?
  - 그것이 나를 아는 지식 아닙니까?
  lexicon: HALOT
  rationale: 히브리어의 추상명사 구조를 한국어에서 자연스러운 설명형으로 옮기되, 단순한 지적 인식이 아니라 관계적·언약적 앎이라는 점을 흐리지 않도록 했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼의 말씀이라고 하십니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: 예언자적 종결 공식을 한국어 합쇼체로 자연스럽게 처리했고, 본 프로젝트 기본값에 따라 신명은 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 지식의 의미
  chosen_reading: 하나님을 아는 것은 가난한 사람의 법적·사회적 권리를 실제로 변호하는 삶으로 드러납니다.
  alternative_readings:
  - 단지 하나님에 대한 정보나 관념을 뜻함
  - 사회 정의만으로 하나님을 아는 것을 전부 환원함
  rationale: 본문은 ‘아는 것’을 추상 지식이 아니라 정의의 실천으로 구체화하지만, 그 실천이 곧 앎의 전부라고 과도하게 축소하지는 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
