id: JER.22.23
reference: Jeremiah 22:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ישבתי בַּ/לְּבָנ֔וֹן מקננתי בָּֽ/אֲרָזִ֑ים מַה נֵּחַנְתְּ֙ בְּ/בֹא לָ֣/ךְ חֲבָלִ֔ים חִ֖יל כַּ/יֹּלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/023.yaml
  text: You who dwell in Lebanon[a], who nest in the cedars, how you will groan when pangs come upon you[b], pain like that of a woman giving birth.
  footnotes:
  - marker: a
    text: Or, 'how you will be pitied when pangs come upon you.' The Hebrew verb rendered 'you will groan' is difficult, and some take it in the sense of receiving pity rather than uttering groans.
    reason: lexical_alternative
  - marker: b
    text: Lebanon and the cedars likely evoke the royal palace built with cedar from Lebanon, portraying Judah's rulers as dwelling in lofty security.
    reason: cultural_note
translation:
  language: ko
  text: 당신은 레바논에 거주하며 백향목 사이에 둥지를 틀었으니, 산고가 당신에게 닥칠 때 얼마나 신음하겠습니까. 마치 해산하는 여인과 같은 고통입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신음하겠습니까’는 난해한 히브리어 동사를 고통의 발성으로 읽은 번역입니다. 다른 해석으로는 ‘동정을 받겠습니까’가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 레바논과 백향목은 아마도 레바논 백향목으로 지은 왕궁을 가리켜, 유다의 통치자들이 높은 안전 속에 거주하는 모습을 떠올리게 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ישבתי
  english_pob_choice: you who dwell
  chosen_korean: 거주하며
  alternatives_korean:
  - 살며
  - 머물며
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘앉다’가 아니라 거주를 뜻하므로, 대상화된 2인칭 현재 분사 느낌을 살려 ‘거주하며’로 옮겼습니다.
- source_word: בַּלְּבָנוֹן / בָּאֲרָזִים
  english_pob_choice: in Lebanon / in the cedars
  chosen_korean: 레바논에 … 백향목 사이에
  alternatives_korean:
  - 레바논에서 … 백향목 속에
  - 레바논의 … 백향목 가운데에
  lexicon: HALOT
  rationale: 레바논과 백향목 이미지를 직역하되, 한국어에서는 자연스럽게 ‘백향목 사이에’로 처리해 고급스럽고 높이 솟은 거처의 이미지를 보존했습니다.
- source_word: נֵּחַנְתְּ
  english_pob_choice: you will groan
  chosen_korean: 얼마나 신음하겠습니까
  alternatives_korean:
  - 얼마나 탄식하겠습니까
  - 얼마나 괴로워하겠습니까
  lexicon: HALOT
  rationale: 어려운 동사이지만, 뒤의 산고 비유와 맞물려 고통의 발성을 드러내는 ‘신음하다’가 본문 흐름을 가장 잘 살립니다.
- source_word: חֲבָלִים / חִיל
  english_pob_choice: pangs / pain
  chosen_korean: 산고 … 고통
  alternatives_korean:
  - 진통 … 아픔
  - 해산의 고통 … 고통
  lexicon: HALOT
  rationale: 두 명사가 병치되어 있어 하나는 ‘산고’, 다른 하나는 보다 일반적인 ‘고통’으로 구분해 반복을 피하면서도 의미를 유지했습니다.
- source_word: כַּיֹּלֵדָה
  english_pob_choice: like that of a woman giving birth
  chosen_korean: 마치 해산하는 여인과 같은
  alternatives_korean:
  - 아이를 낳는 여인과 같은
  - 출산하는 여인과 같은
  lexicon: HALOT
  rationale: 비유의 핵심은 출산 직전·직중의 고통이므로, 성경적이면서도 현대 한국어에서 분명한 ‘해산하는 여인’으로 옮겼습니다.
theological_decisions:
- issue: 유다/예루살렘에 대한 의인화된 2인칭 호칭
  chosen_reading: ‘당신은 … 거주하며 …’로 직접 호소하는 문장으로 처리했습니다.
  alternative_readings:
  - ‘너는 …’로 더 직설적으로 번역
  - 대상을 ‘유다야’처럼 명시
  rationale: 히브리어의 여성 단수 어미와 문맥상 예루살렘/유다를 향한 직접 경고를 유지하기 위해, 대상의 인격화된 호명을 살린 2인칭 직접 خطاب을 사용했습니다.
  doctrine_reference: 예언서의 수사적 의인화와 예언적 책망 구조
- issue: בַּלְּבָנוֹן/אַרָזִים의 상징성
  chosen_reading: 본문에는 상징을 과잉 해설하지 않고, 본문 이미지인 레바논과 백향목을 그대로 살렸습니다.
  alternative_readings:
  - 궁전/왕궁을 명시
  - 권력과 안전의 상징으로 주해성 번역
  rationale: 영어 POB 주석이 암시하듯 상징 가능성은 있으나, 본문 자체는 이미지로 말하므로 주해를 본문에 흡수하지 않고 독자가 읽도록 남겨 두는 것이 더 충실합니다.
  doctrine_reference: 본문 우선 원칙과 상징 해석의 절제
