id: JER.34.18
reference: Jeremiah 34:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת הָ/אֲנָשִׁ֗ים הָ/עֹֽבְרִים֙ אֶת בְּרִתִ֔/י אֲשֶׁ֤ר לֹֽא הֵקִ֨ימוּ֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרְת֖וּ לְ/פָנָ֑/י הָ/עֵ֨גֶל֙ אֲשֶׁ֣ר כָּרְת֣וּ לִ/שְׁנַ֔יִם וַ/יַּעַבְר֖וּ בֵּ֥ין בְּתָרָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/018.yaml
  text: And I will hand over the men who transgressed my covenant[a], who did not uphold the words of the covenant that they made before me[c][b], the calf that they cut in two and passed between its pieces.
  footnotes:
  - marker: a
    text: Or 'who violated my covenant.' The Hebrew verb literally means 'passed over/transgressed,' and it intentionally echoes the later phrase 'passed between its pieces.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the words of the covenant'; that is, the covenant's stipulations or terms.
    reason: lexical_alternative
  - marker: c
    text: The ritual of cutting an animal and passing between its pieces was a covenant-making act that invoked judgment on the one who broke the covenant; compare Genesis 15:9–17.
    reason: cultural_note
translation:
  language: ko
  text: 나는 내 언약을 어긴 사람들, 곧 내 앞에서 맺은 언약의 말씀을 지키지 않고 그 송아지를 둘로 쪼개어 그 조각들 사이를 지나간 그 사람들을 넘겨주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘송아지’를 앞세워 언약식 때 쪼갠 제물을 말하며, 19절과 함께 읽을 때 언약을 어긴 자들이 그 의례적 저주의 대상임을 드러냅니다.
    reason: source_note
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will hand over
  chosen_korean: 넘겨주겠습니다
  alternatives_korean:
  - 주겠습니다
  - 내주겠습니다
  - 건네주겠습니다
  lexicon: HALOT
  rationale: 심판 문맥에서 נתן은 단순한 ‘주다’보다 ‘넘겨주다/내주다’의 관용적 뜻이 분명하므로, 판단을 통해 상대의 처분 아래 두는 의미를 살렸습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 그 사람들
  lexicon: HALOT
  rationale: 원문은 특정 남성들을 가리키지만 한국어에서는 심판 대상 집단을 자연스럽게 드러내기 위해 ‘사람들’로 옮기되, 뒤에서 ‘그 사람들’로 동일 대상을 다시 지시해 문맥을 유지했습니다.
- source_word: הָעֹבְרִים אֶת בְּרִתִּי
  english_pob_choice: who transgressed my covenant
  chosen_korean: 내 언약을 어긴
  alternatives_korean:
  - 내 언약을 범한
  - 내 언약을 위반한
  - 내 언약을 지나간
  lexicon: HALOT
  rationale: בְּרִיתִי와 함께 쓰인 עבר는 문자적 이동이 아니라 언약 위반의 관용 표현이므로, 법적·윤리적 뉘앙스를 살려 ‘어긴’으로 번역했습니다.
- source_word: הֵקִימוּ אֶת דִּבְרֵי הַבְּרִית
  english_pob_choice: did not uphold the words of the covenant
  chosen_korean: 언약의 말씀을 지키지 않고
  alternatives_korean:
  - 언약의 말씀을 확립하지 않고
  - 언약의 조항들을 지키지 않고
  - 언약의 말씀을 준수하지 않고
  lexicon: HALOT
  rationale: הקים אֶת־דברי는 언약 조항을 ‘세우다/확립하다’는 뜻이지만 한국어에서는 그 기능을 가장 자연스럽게 드러내는 ‘지키다’가 적절합니다. ‘말씀’은 원문의 ‘words’를 보존합니다.
- source_word: כָּרְתוּ לְפָנַי
  english_pob_choice: that they made before me
  chosen_korean: 내 앞에서 맺은
  alternatives_korean:
  - 내 앞에서 만든
  - 내 앞에서 세운
  - 내 앞에서 자른
  lexicon: HALOT
  rationale: כרת ברית의 관용구를 한국어 성경 문체에서 자연스러운 ‘맺다’로 옮기되, ‘내 앞에서’로 언약의 엄숙한 증언자 되심을 살렸습니다.
- source_word: הָעֵגֶל ... כָּרְתוּ לִשְׁנַיִם וַיַּעַבְרוּ בֵּין בְּתָרָיו
  english_pob_choice: the calf that they cut in two and passed between its pieces
  chosen_korean: 그 송아지를 둘로 쪼개어 그 조각들 사이를 지나간
  alternatives_korean:
  - 그 송아지를 둘로 나누어 그 조각들 사이를 지나간
  - 그 송아지를 두 조각으로 잘라 그 사이를 지난
  - 그 송아지를 둘로 쪼개어 그 부분들 사이를 지난
  lexicon: HALOT
  rationale: 의례적 동작을 구체적으로 보존하기 위해 ‘송아지’, ‘둘로 쪼개어’, ‘조각들 사이를 지나간’을 사용했습니다. ‘쪼개다’는 제의적 절단의 거칠고 선명한 이미지를 잘 전달합니다.
theological_decisions:
- issue: 최종 절의 문법적 압축과 언약 저주 의도
  chosen_reading: 마지막 절구를 설명적으로 풀지 않고, 언약을 어긴 자들과 쪼개진 송아지의 의례를 병치하는 방식으로 유지했습니다.
  alternative_readings:
  - 그 사람들을 그 송아지처럼 넘겨주겠습니다
  - 그 사람들을 조각난 송아지와 같은 운명에 넘겨주겠습니다
  rationale: 히브리어는 매우 압축되어 있어 후속 맥락의 심판 함의를 암시하지만, 이 절 자체에 ‘~처럼’이나 명시적 판결문을 덧붙이면 원문보다 더 말해 버립니다. 병치는 의례적 저주를 충분히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §6
