base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Go and speak to Zedekiah king of Judah, and say to him, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will burn it with fire.’'
  footnotes:
  - marker: a
    text: Or, “into the power of the king of Babylon.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. “유다 왕 시드기야에게 가서 그에게 이렇게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 보십시오, 내가 이 성을 바빌론 왕의 손에[a] 넘겨주겠습니다. 그가 그 성을 불로 태울 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바빌론 왕의 권세에.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 표준 음역(프로젝트 기본)
  rationale: 사역 대상을 식별하는 고유한 언약 이름이므로 제목인 ‘주’로 바꾸지 않고, 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: הָלֹךְ וְאָמַרְתָּ
  english_pob_choice: Go and speak
  chosen_korean: 가서 말하십시오
  alternatives_korean:
  - 가서 말씀하십시오
  - 가서 전하십시오
  lexicon: HALOT
  rationale: 명령의 연속을 한국어 자연스러운 직설 명령으로 살리되, 예언자 파견의 지시라는 힘을 유지했습니다.
- source_word: הִנְנִי נֹתֵן
  english_pob_choice: Behold, I am giving
  chosen_korean: 보십시오, 내가 ... 넘기며
  alternatives_korean:
  - 보십시오, 내가 ... 주며
  - 보십시오, 내가 ... 내어주며
  lexicon: HALOT
  rationale: הִנְנִי의 엄숙한 즉시성을 ‘보십시오’로, נֹתֵן의 진행·확정성을 ‘넘기며’로 살렸습니다.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  english_pob_choice: into the hand of the king of Babylon
  chosen_korean: 바빌론 왕의 손에
  alternatives_korean:
  - 바빌론 왕의 권세에
  - 바빌론 왕의 지배 아래
  lexicon: HALOT
  rationale: 손이라는 히브리어 관용구를 그대로 유지해 ‘넘기다’와 함께 포로적 지배 이전을 드러냈습니다.
theological_decisions:
- issue: 야훼의 이름과 예언 구문의 존중 형식
  chosen_reading: 직접 화법 밖에서는 ‘야훼, 이스라엘의 하나님’으로, 명령문에서는 ‘말하십시오’를 써서 예언 전달의 위임 구조를 보존했습니다.
  alternative_readings:
  - ‘여호와’로 음역을 바꾸는 방식
  - ‘말하라’로 낮춘 반말형 명령
  rationale: 본문은 예언자에게 주어진 공식 전언이므로, 하나님의 고유 이름과 위임 어조를 함께 유지하는 것이 원문 의미를 가장 잘 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
