source:
  edition: WLC
  text: לָ/כֵן֮ כֹּה אָמַ֣ר יְהוָה֒ אַתֶּם֙ לֹֽא שְׁמַעְתֶּ֣ם אֵלַ֔/י לִ/קְרֹ֣א דְר֔וֹר אִ֥ישׁ לְ/אָחִ֖י/ו וְ/אִ֣ישׁ לְ/רֵעֵ֑/הוּ הִנְ/נִ֣י קֹרֵא֩ לָ/כֶ֨ם דְּר֜וֹר נְאֻם יְהוָ֗ה אֶל הַ/חֶ֨רֶב֙ אֶל הַ/דֶּ֣בֶר וְ/אֶל הָ/רָעָ֔ב וְ/נָתַתִּ֤י אֶתְ/כֶם֙ ל/זועה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/017.yaml
  text: 'Therefore thus says Yahweh: You have not listened to me[a], to proclaim liberty, each man to his brother and each man to his neighbor. Behold, I am proclaiming liberty for you, declares Yahweh—to the sword, to the pestilence[c][b], and to the famine—and I will make you a horror to all the kingdoms of the earth.'
  footnotes:
  - marker: a
    text: Or 'release' or 'freedom' for דְּרוֹר in both occurrences; the same Hebrew term is repeated for rhetorical irony.
    reason: lexical_alternative
  - marker: b
    text: That is, the LORD 'releases' them over to the sword, pestilence, and famine in judgment.
    reason: cultural_note
  - marker: c
    text: Or 'an object of horror' or 'a terror.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. “너희는 내 말을 듣지 않았고, 각 사람이 자기 형제에게, 또 각 사람이 자기 이웃에게 자유[a]를 선포하지 않았다. 보라, 내가 너희에게 자유를 선포한다. 야훼의 말씀이다. 곧 칼과 전염병[b]과 기근에 너희를 넘겨주겠다. 또 내가 너희를 땅의 모든 왕국에 공포의 대상[c]으로 삼겠다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דְּרוֹר는 이 절에 두 번 나오며, 문맥상 노예의 해방 또는 해방 선언을 가리키는 법적 용어입니다. ‘해방’ 또는 ‘석방’으로도 옮길 수 있습니다. 같은 낱말의 반복은 반어를 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: ‘전염병’은 히브리어 דֶּבֶר의 대응어입니다. 여기서 야훼께서 ‘자유를 선포한다’는 말씀은 그들을 칼과 전염병과 기근의 심판에 넘기신다는 반어적 선언입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 לְזַוֲעָה는 ‘공포’, ‘전율의 대상’, 또는 ‘공포의 대상’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 고유한 신명은 POB의 원칙에 따라 번역어가 아니라 음역으로 살려, 하나님의 개인명을 보존했습니다.
- source_word: שְׁמַעְתֶּם אֵלַי
  english_pob_choice: have not listened to me
  chosen_korean: 내 말을 듣지 않고
  alternatives_korean:
  - 나에게 순종하지 않고
  - 내 말을 듣지 않았고
  lexicon: HALOT
  rationale: שׁמע + אֶל의 청취/유의 관용구를 따라 ‘듣다’를 유지했고, 문맥상 불순종은 자연스럽게 드러나게 했습니다.
- source_word: לִקְרֹא דְרוֹר / דְרוֹר
  english_pob_choice: to proclaim liberty / liberty
  chosen_korean: 자유를 선포하다 / 자유
  alternatives_korean:
  - 해방을 선포하다 / 해방
  - 석방을 선포하다 / 석방
  lexicon: HALOT
  rationale: 법적·선포적 뉘앙스를 살리면서 한국어에서 가장 자연스러운 대응으로 ‘자유’를 택했고, 같은 단어의 반복을 유지해 반어를 보존했습니다.
- source_word: לְזַוֲעָה
  english_pob_choice: a horror
  chosen_korean: 공포의 대상
  alternatives_korean:
  - 공포
  - 전율의 대상
  - 두려움거리
  lexicon: HALOT
  rationale: 사람들에게 공포를 불러일으키는 존재라는 뜻을 자연스럽게 드러내기 위해, 영어 POB의 ‘object of horror’ 가능성을 반영해 ‘공포의 대상’으로 옮겼습니다.
theological_decisions:
- issue: 반어적 ‘자유’의 반복
  chosen_reading: 두 번의 דְרוֹר를 모두 ‘자유’로 유지했습니다.
  alternative_readings:
  - 둘째를 ‘재앙에 넘김’으로 바꾸어 의미를 풀어 쓰는 방법
  rationale: 백성이 형제에게 자유를 선포하지 않았기 때문에, 야훼께서 그들에게 ‘자유’를 선포하신다는 역설을 같은 낱말 반복으로 드러내는 것이 본문의 신학적·수사적 힘을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §5
