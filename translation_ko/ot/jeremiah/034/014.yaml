id: JER.34.14
reference: Jeremiah 34:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֡ים תְּֽשַׁלְּח֡וּ אִישׁ֩ אֶת אָחִ֨י/ו הָ/עִבְרִ֜י אֲשֶֽׁר יִמָּכֵ֣ר לְ/ךָ֗ וַ/עֲבָֽדְ/ךָ֙ שֵׁ֣שׁ שָׁנִ֔ים וְ/שִׁלַּחְתּ֥/וֹ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ וְ/לֹֽא שָׁמְע֤וּ אֲבֽוֹתֵי/כֶם֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/014.yaml
  text: At the end of seven years[a], each of you shall send away his Hebrew brother who has been sold to you and has served you six years; you shall send him away free from you[c][b]. But your fathers did not listen to me or incline their ear.
  footnotes:
  - marker: a
    text: Or "After seven years." The Hebrew expression can be understood as marking the completion of a seven-year period.
    reason: lexical_alternative
  - marker: b
    text: Or "his fellow Hebrew" or "his Hebrew kinsman."
    reason: lexical_alternative
  - marker: c
    text: Or "who sells himself to you"; the Hebrew form may be understood in a passive or reflexive sense in this legal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱 해가 끝나면[a], 너희는 각각 자기 히브리인 형제, 곧 너에게 팔려 와서 여섯 해 동안 너를 섬긴 사람을 놓아주어야 합니다. 너희는 그를 너에게서 자유롭게[b] 놓아주어야 합니다[c]. 그런데 너희 조상들은 내 말을 듣지 않았고, 귀를 기울이지도 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱 해가 지난 뒤에’. 히브리어 표현은 일곱 해 기간의 완료를 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너에게서 자유롭게’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 너에게 팔려 온 사람’으로도 옮길 수 있습니다. 히브리어 형태는 이 법적 문맥에서 피동 또는 재귀로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  english_pob_choice: At the end of seven years
  chosen_korean: 일곱 해가 끝나면
  alternatives_korean:
  - 일곱 해 후에
  - 일곱 해가 지난 뒤에
  lexicon: WLC; HALOT
  rationale: 완료 시점을 나타내는 표현이므로 ‘끝나면’이 ‘at the end of’의 시간 표지를 자연스럽게 살리며, 정확한 기간 완료의 뉘앙스를 유지합니다.
- source_word: אִישׁ ... אֶת אָחִיו הָעִבְרִי
  english_pob_choice: each of you ... his Hebrew brother
  chosen_korean: 너희는 각각 자기 히브리인 형제
  alternatives_korean:
  - 너희는 각각 자기 히브리 동족
  - 너희는 각각 자기 히브리인 형제
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각각’으로 살리고, אָחִיו의 혈연·언약적 호칭을 ‘형제’로 직역해 관계의 강도를 보존했습니다.
- source_word: אֲשֶׁר יִמָּכֵר לְךָ
  english_pob_choice: who has been sold to you
  chosen_korean: 너에게 팔려 와서
  alternatives_korean:
  - 너에게 팔린
  - 너에게 팔려 온
  lexicon: HALOT
  rationale: 피동형 매매 상태를 분명히 드러내면서 한국어에서 자연스러운 서술로 옮기기 위해 ‘팔려 와서’를 택했습니다.
- source_word: וַעֲבָדְךָ שֵׁשׁ שָׁנִים
  english_pob_choice: and has served you six years
  chosen_korean: 여섯 해 동안 너를 섬긴 사람
  alternatives_korean:
  - 여섯 해 동안 너를 섬겨 온 사람
  - 여섯 해 동안 너를 위해 일한 사람
  lexicon: HALOT
  rationale: עבד의 기본 의미를 따라 ‘섬기다’를 유지해 법문장의 서비스 의무를 살리고, 완료된 기간은 앞뒤 문맥으로 드러나게 했습니다.
- source_word: וְשִׁלַּחְתּוֹ חָפְשִׁי מֵעִמָּךְ
  english_pob_choice: you shall send him away free from you
  chosen_korean: 그를 너에게서 자유롭게 놓아주어야 합니다
  alternatives_korean:
  - 그를 너에게서 자유롭게 보내야 합니다
  - 그를 자유인으로 놓아주어야 합니다
  lexicon: HALOT
  rationale: ‘놓아주다’가 שלח의 해방·방출 의미를 잘 살리며, ‘자유롭게’로 חָפְשִׁי의 해방 상태를 분명하게 반영합니다.
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  english_pob_choice: or incline their ear
  chosen_korean: 귀를 기울이지도 않았습니다
  alternatives_korean:
  - 귀를 기울이지도 않았습니다
  - 귀를 굽히지도 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 확립된 대응 표현으로 옮겨, 문자 이미지를 지나치게 낯설게 하지 않으면서도 불순종의 태도를 보존했습니다.
theological_decisions:
- issue: 노예제/종살이 관련 법문에서 bonded-service의 성격을 어떻게 드러낼지
  chosen_reading: ‘팔려 와서’와 ‘섬긴’으로 법적 종속 상태를 드러내되, 본문이 말하는 6년 봉사의 틀을 유지했습니다.
  alternative_readings:
  - ‘스스로 팔려 와서’로 더 강하게 반사적 의미를 드러내는 번역
  - ‘일한’으로 완화하는 번역
  rationale: 본문은 매매와 봉사의 두 요소를 함께 제시하므로, 둘 중 하나를 지우지 않고 함께 살리는 것이 원문의 법적 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy 1, 5
- issue: ‘자유롭게’의 위치와 의미
  chosen_reading: ‘그를 너에게서 자유롭게 놓아주어야 합니다’
  alternative_readings:
  - ‘그를 놓아주어 너에게서 자유롭게 해야 합니다’
  - ‘그를 너에게서 자유롭게 보내야 합니다’
  rationale: 출보·해방의 결과를 분명히 하면서도, 자유 상태가 단순 이동이 아니라 종속 관계의 종료임을 드러내기 위해 이 구조를 택했습니다.
  doctrine_reference: Translation philosophy 1
