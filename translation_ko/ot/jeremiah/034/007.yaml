theological_decisions:
- issue: 예루살렘과 유다의 남은 성읍들 사이의 관계를 어떻게 드러낼지
  chosen_reading: ‘유다의 남은 모든 성읍을 치고 있을 때였는데’로 번역해, 포위·공격의 지속성과 남은 도시들의 부분적 범위를 함께 드러냈습니다.
  alternative_readings:
  - ‘유다의 남은 모든 성읍을 향해 싸우고 있을 때’
  - ‘유다의 남은 모든 성읍을 공격하고 있을 때’
  rationale: 히브리어 분사구는 현재 진행 중인 포위전을 배경으로 제시하므로, 서술의 흐름을 살리면서도 전투 상황의 긴박함을 유지하는 번역이 적절합니다.
  doctrine_reference: 본문 맥락 설명
