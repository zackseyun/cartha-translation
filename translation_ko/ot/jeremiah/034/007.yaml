translation:
  language: ko
  text: 바빌론 왕의 군대가 예루살렘과 유다의 남은 모든 성읍을 치고 있을 때였는데, 곧 라기스와 아세가를 말합니다. 이는 유다의 성읍들 가운데 요새 성읍으로 남아 있던 곳이 이 두 성읍뿐이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 라기스와 아세가를 앞의 ‘유다의 남은 모든 성읍’에 대한 구체적 예로 덧붙입니다.
    reason: source_note
