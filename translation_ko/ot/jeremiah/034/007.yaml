translation:
  language: ko
  text: 바빌론 왕의 군대가 예루살렘과 유다에 남아 있는 모든 성읍, 곧 라기스와 아세가를 공격하고 있을 때였습니다. 유다의 성읍들 가운데 요새화된 성읍으로 남아 있던 곳은 이 두 성읍뿐이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 라기스와 아세가를 유다에 남아 있던 성읍들로 특정하며, 이어서 이 두 성읍만 요새화된 성읍으로 남아 있었다고 설명합니다.
    reason: source_note
