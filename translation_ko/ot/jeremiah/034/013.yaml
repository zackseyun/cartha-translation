  source_fidelity: 현 초안은 ‘언약을 맺던 날’로 옮겨, 히브리어의 시간절(‘내가 그들을 이집트에서 이끌어 낸 날에’)을 언약 체결 행위에 부자연스럽게 결속시킵니다. 또한 독립 인칭대명사 אָנֹכִי의 강조를 ‘내가 친히’로 반영하는 것이 안전합니다. מִבֵּית עֲבָדִים는 이집트의 실제 노예 상태를 가리키므로 ‘종의 집’보다 현대어에서 의미가 분명한 ‘노예살이하던 집’으로 옮기되, 직역은 각주에 보존합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 예언자적 전언 형식을 유지하며, 다음 절에 이어지는 인용문의 미완결 구조를 쉼표로 자연스럽게 보존합니다. ‘곧’은 두 출처 표현의 설명적 병치를 자연스럽게 드러냅니다.
  terminology: יְהוָה는 프로젝트 방침과 영어 POB에 따라 ‘야훼’로 유지합니다. בְּרִית는 ‘언약’, כָּרַת בְּרִית는 자연스러운 한국어 관용어 ‘언약을 맺다’로 옮기고 직역을 각주에 둡니다. עֲבָדִים의 복수 및 노예 상태의 현실성은 본문 ‘노예살이하던’과 각주의 ‘노예들의 집’으로 반영합니다.
