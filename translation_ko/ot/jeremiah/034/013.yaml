translation:
  language: ko
  text: 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “내가 친히 너희 조상들과 언약을 맺었습니다[a]. 내가 그들을 이집트 땅, 곧 노예살이하던 집에서 이끌어 낸 날에, 이렇게 말하였습니다,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘언약을 자르다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘노예들의 집’입니다. ‘속박의 집’으로도 옮길 수 있습니다.
    reason: lexical_alternative
