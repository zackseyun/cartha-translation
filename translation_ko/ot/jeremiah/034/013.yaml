base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/013.yaml
  text: 'Thus says Yahweh, the God of Israel: I myself made a covenant with your fathers on the day I brought them out from the land of Egypt, from the house of slaves, saying,'
  footnotes:
  - marker: a
    text: Hebrew literally, 'cut a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the house of bondage.' The Hebrew is literally 'from the house of slaves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. "내가 너희 조상들과 언약을 맺던 날, 곧 내가 그들을 이집트 땅, 곧 종의 집에서 이끌어 낼 때,"[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '언약을 자르다'입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 '종들의 집'입니다. 전통적으로는 '속박의 집'으로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이렇게 말씀하셨습니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식으로서의 격식을 살리되, 현대 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 고유명 야훼를 사용하여 신적 이름의 직접성을 보존했습니다.
- source_word: כָּרַתִּי בְרִית
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺다
  alternatives_korean:
  - 언약을 세우다
  - 언약을 자르다
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역 의미는 '언약을 자르다'이지만, 본문 흐름에서는 한국어로 가장 분명한 '언약을 맺다'가 적절합니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 종의 집
  alternatives_korean:
  - 노예의 집
  - 종살이의 집
  - 속박의 집
  lexicon: HALOT
  rationale: 본문의 물질적·사회적 억압 상태를 살리면서도 한국어 문맥에서 자연스럽게 들리도록 '종의 집'으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문 고유명사 יְהוָה를 가리는 전통적 대치어보다, 프로젝트 원칙에 따라 신적 이름 자체를 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: '''종의 집''의 사회적 함의'
  chosen_reading: 이집트의 노예 상태를 가리키는 억압적 표현으로 유지
  alternative_readings:
  - 속박의 집
  - 예속의 집
  rationale: 출애굽 기억의 핵심은 실제 억압과 해방이므로, 이를 완화하지 않고 사회적 예속성을 분명히 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; slavery terminology policy
