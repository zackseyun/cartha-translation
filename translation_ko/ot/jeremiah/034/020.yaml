reference: Jeremiah 34:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אוֹתָ/ם֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/020.yaml
  text: And I will give them into the hand of their enemies and into the hand of those who seek their life[c][b][a], and their dead bodies will become food for the birds of the sky and for the beasts of the earth.
  footnotes:
  - marker: a
    text: Or 'those who seek their lives,' that is, those who seek to kill them.
    reason: lexical_alternative
  - marker: b
    text: Or 'their corpses' or 'their carcasses.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'birds of the sky'; some English versions have 'birds of the air.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 그들의 원수의 손과 그들의 목숨을 찾는 자들의 손에 넘겨줄 것입니다. 그들의 시체는 하늘의 새들과 땅의 짐승들의 먹이가 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목숨을 찾는 자들’은 ‘그들을 죽이려는 자들’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시체’ 또는 ‘주검’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하늘의 새들’은 히브리어의 직역입니다. 일부 번역은 ‘공중의 새들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי ... בְּיַד
  english_pob_choice: I will give ... into the hand of
  chosen_korean: 손에 넘겨줄 것입니다
  alternatives_korean:
  - 손에 줄 것입니다
  - 권세 아래 두겠습니다
  lexicon: HALOT
  rationale: בְיַד의 관용구적 의미를 살려 ‘손에 넘겨주다’로 옮기면, 단순한 ‘주다’보다 적대자의 통제 아래로 넘겨지는 뜻이 분명해집니다.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  english_pob_choice: those who seek their life
  chosen_korean: 그들의 목숨을 찾는 자들
  alternatives_korean:
  - 그들의 생명을 찾는 자들
  - 그들을 죽이려는 자들
  lexicon: HALOT
  rationale: ‘목숨을 찾다’는 히브리어 관용을 비교적 그대로 살리면서도 한국어에서 이해 가능한 표현입니다. ‘죽이려는 자들’은 뜻은 분명하지만 해석을 더 강하게 드러냅니다.
- source_word: נִבְלָתָם
  english_pob_choice: their dead bodies
  chosen_korean: 그들의 시체
  alternatives_korean:
  - 그들의 주검
  - 그들의 사체
  lexicon: HALOT
  rationale: 사람의 मृत체를 가리키는 נבלה의 의미를 자연스러운 현대 한국어로 옮겼습니다. ‘시체’가 문맥의 수치스러운 노출과 심판 이미지를 분명하게 드러냅니다.
- source_word: לְעוֹף הַשָּׁמַיִם ... וּלְבֶהֱמַת הָאָרֶץ
  english_pob_choice: for the birds of the sky ... for the beasts of the earth
  chosen_korean: 하늘의 새들과 땅의 짐승들
  alternatives_korean:
  - 하늘의 새들과 땅의 들짐승들
  - 공중의 새들과 땅의 짐승들
  lexicon: HALOT
  rationale: 히브리어의 병행 구조를 살리되, ‘하늘의 새들/땅의 짐승들’로 직역에 가까운 대칭을 유지했습니다. ‘공중의 새들’은 전통적이지만 본문 직유를 덜 직접적으로 드러냅니다.
theological_decisions:
- issue: 죽은 몸이 새와 짐승의 먹이가 되는 심판 이미지
  chosen_reading: 노출된 시체와 식물성/동물성 먹이로 전락하는 수치의 심판을 그대로 유지합니다.
  alternative_readings:
  - 단순히 원수에게 패배하여 죽는다는 뜻으로 완화
  - ‘먹이’ 이미지를 생략하고 일반적 죽음으로 처리
  rationale: 이 절은 언약 저주의 한 형태로서, 매장되지 못한 시체가 피조물의 먹이가 되는 치욕을 강조합니다. 이를 완화하면 본문의 심판 강도가 약해집니다.
  doctrine_reference: 언약 저주와 심판의 신학
