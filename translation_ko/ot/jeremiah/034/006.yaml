  yaml_path: translation/ot/jeremiah/034/006.yaml
  text: Then Jeremiah the prophet spoke all these words to Zedekiah king of Judah in Jerusalem.
translation:
  language: ko
  text: 그때 예레미야 예언자가 예루살렘에서 유다 왕 시드기야에게 이 모든 말을 전했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 전했습니다
  alternatives_korean:
  - 말했습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: 히브리어 waw-연속의 서술 전개를 자연스럽게 살리면서, 앞선 예언의 내용을 왕에게 전달하는 행위를 분명히 드러내기 위해 ‘전했습니다’를 택했습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언하는 사람
  lexicon: HALOT
  rationale: 직함을 생략하지 않고 옮기되, 현대 한국어에서 비교적 직접적이고 중립적인 ‘예언자’로 렌더링했습니다.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 말씀
  - 이 모든 일
  lexicon: HALOT
  rationale: 여기서는 앞선 예언의 발화 내용을 가리키므로 ‘words’의 말-성격을 살려 ‘말’로 옮겼습니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다의 임금
  lexicon: HALOT
  rationale: 히브리어 수식 관계를 한국어 자연어 순서로 옮기되, 왕의 지위를 간결하게 드러내는 ‘유다 왕’을 사용했습니다.
theological_decisions:
- issue: 예루살렘에서의 발표 장소 보존
  chosen_reading: 장소 부사구를 문장 끝에 유지해 왕 앞에서 예언이 공적으로 선포되었음을 드러냈습니다.
  alternative_readings:
  - 문두로 옮겨 ‘예루살렘에서 그때 예레미야가...’로 할 수 있음
  - 생략할 수 있음
  rationale: 장소는 단순 배경이 아니라 예언이 이루어진 공적 현장을 지정하므로, 본문이 말하는 역사적 상황을 유지하는 편이 낫습니다.
  doctrine_reference: source fidelity / narrative setting
