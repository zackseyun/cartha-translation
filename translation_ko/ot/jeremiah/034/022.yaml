  lexicon: HALOT
  rationale: 예언문에서 청자의 주의를 환기하는 감탄·호명 표현으로, 현대 합쇼체에서는 ‘보십시오’가 격식을 유지하면서도 자연스럽습니다.
- source_word: מְצַוֶּה
