  lexicon: HALOT
  rationale: 진행형의 즉시성은 살리되 한국어에서는 ‘명령합니다’가 예언적 선언으로 가장 자연스럽고 간결합니다.
- source_word: וַהֲשִׁבֹתִים
  english_pob_choice: I will bring them back
  chosen_korean: 내가 그들을 다시 돌아오게 하겠습니다
  alternatives_korean:
  - 내가 그들을 데려오겠습니다
  - 내가 그들을 이 성읍으로 돌려보내겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 반영해 단순한 ‘돌아오다’보다 ‘다시 돌아오게 하다’로 옮겼습니다. 문맥상 대상은 예루살렘을 치러 올 적군입니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐하게 하여
  alternatives_korean:
  - 황무지로
  - 폐허로
  lexicon: HALOT
  rationale: ‘desolation’은 결과 상태를 가리키므로, 한국어에서는 상태명사보다 결과를 드러내는 서술형이 더 직접적입니다.
- source_word: מֵאֵין יֹשֵׁב
  english_pob_choice: without inhabitant
  chosen_korean: 거주하는 사람이 없게
  alternatives_korean:
