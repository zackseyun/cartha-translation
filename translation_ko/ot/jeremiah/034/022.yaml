source:
  edition: WLC
  text: הִנְ/נִ֨י מְצַוֶּ֜ה נְאֻם יְהוָ֗ה וַ/הֲשִׁ֨בֹתִ֜י/ם אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/נִלְחֲמ֣וּ עָלֶ֔י/הָ וּ/לְכָד֖וּ/הָ וּ/שְׂרָפֻ֣/הָ בָ/אֵ֑שׁ וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מֵ/אֵ֥ין יֹשֵֽׁב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/022.yaml
  text: Behold[a], I am commanding, declares Yahweh, and I will bring them back to this city, and they will fight against it and capture it and burn it with fire. And I will make the cities of Judah a desolation[b], without inhabitant.
  footnotes:
  - marker: a
    text: Or 'I will return them to this city.' The Hebrew verb is causative ('cause to return/bring back'). In context it refers to the enemy forces being brought back to Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Or 'without anyone dwelling there.' The Hebrew idiom emphasizes complete desolation and depopulation.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 명령합니다 — 여호와의 말씀입니다. 내가 그들을 이 성읍으로 다시 돌아오게 하겠습니다. 그들은 이 성읍을 쳐서 점령하고 불로 태울 것입니다. 그리고 유다의 성읍들을 황폐하게 하여[b] 거주하는 사람이 없게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 이 성읍으로 되돌려 보낼 것이다.’ 히브리어 동사는 사역형으로, 문맥상 예루살렘을 치러 돌아오는 적군을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거주하는 사람이 없게.’ 히브리어 관용구는 완전한 황폐와 무주 상태를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언문에서 청자의 주의를 환기하는 감탄·호명 표현으로, 현대 합쇼체에서는 ‘보십시오’가 격식을 유지하면서도 자연스럽습니다.
- source_word: מְצַוֶּה
  english_pob_choice: I am commanding
  chosen_korean: 내가 명령합니다
  alternatives_korean:
  - 내가 명령하고 있습니다
  - 내가 명령하노라
  lexicon: HALOT
  rationale: 진행형의 즉시성은 살리되 한국어에서는 ‘명령합니다’가 예언적 선언으로 가장 자연스럽고 간결합니다.
- source_word: וַהֲשִׁבֹתִים
  english_pob_choice: I will bring them back
  chosen_korean: 내가 그들을 다시 돌아오게 하겠습니다
  alternatives_korean:
  - 내가 그들을 데려오겠습니다
  - 내가 그들을 이 성읍으로 돌려보내겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 반영해 단순한 ‘돌아오다’보다 ‘다시 돌아오게 하다’로 옮겼습니다. 문맥상 대상은 예루살렘을 치러 올 적군입니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐하게 하여
  alternatives_korean:
  - 황무지로
  - 폐허로
  lexicon: HALOT
  rationale: ‘desolation’은 결과 상태를 가리키므로, 한국어에서는 상태명사보다 결과를 드러내는 서술형이 더 직접적입니다.
- source_word: מֵאֵין יֹשֵׁב
  english_pob_choice: without inhabitant
  chosen_korean: 거주하는 사람이 없게
  alternatives_korean:
  - 주민이 없게
  - 사는 사람이 없게
  lexicon: HALOT
  rationale: 히브리어 관용구가 완전한 무거주 상태를 뜻하므로, 인격적·집합적 의미를 살려 ‘거주하는 사람이 없게’로 옮겼습니다.
theological_decisions:
- issue: 여호와(יְהוָה) 고유명 처리
  chosen_reading: 본문에는 ‘여호와’로 표기하고, 선언부는 한국어 예언문 관례에 맞게 ‘— 여호와의 말씀입니다’로 처리했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 구절의 핵심은 하나님의 발화 표지이며, 한국어 공개본에서는 독자의 식별성을 위해 전통적으로 널리 알려진 표기를 유지하는 편이 문맥 전달에 유리합니다. 다만 원어의 고유명 자체는 주석·대조 자료에서 추적 가능해야 합니다.
  doctrine_reference: POB Korean naming convention for Hebrew divine name in publication text
- issue: 적군을 ‘돌아오게 하다’의 사역 의미
  chosen_reading: 하나님이 바벨론 군을 예루살렘으로 다시 오게 하시는 적극적 심판 행위로 읽었습니다.
  alternative_readings:
  - 그들을 되돌려 보내다
  - 그들을 다시 데려오다
  rationale: 영어 POB의 각주가 밝히듯 동사는 단순 귀환이 아니라 사역적 ‘돌아오게 함’입니다. 본문은 포위군의 재집결을 통해 심판이 재개된다는 뜻을 유지해야 합니다.
  doctrine_reference: 예언적 심판 선언의 문맥 이해
