id: JER.34.11
reference: Jeremiah 34:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשׁ֨וּבוּ֙ אַחֲרֵי כֵ֔ן וַ/יָּשִׁ֗בוּ אֶת הָֽ/עֲבָדִים֙ וְ/אֶת הַ/שְּׁפָח֔וֹת אֲשֶׁ֥ר שִׁלְּח֖וּ חָפְשִׁ֑ים ו/יכבישו/ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/011.yaml
  text: But afterward they turned back and brought back the male slaves and the female slaves whom they had set free[a], and they forced them into slavery as male and female slaves.
  footnotes:
  - marker: a
    text: Or 'they enslaved them as male and female slaves.' The Hebrew verb can be rendered more compactly, but the main text makes explicit the coercive force in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 후에 그들은 돌아서서, 자기들이 자유롭게 놓아 보낸 남종들과 여종들을 다시 데려와, 남종들과 여종들로 삼아 그들을 강제로 종으로 삼았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시 데려와’는 히필 형태의 사역적 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ אַחֲרֵי כֵן
  english_pob_choice: they turned back afterward
  chosen_korean: 그 후에 그들은 돌아서서
  alternatives_korean:
  - 그 후에 그들은 돌아왔습니다
  - 그 후에 그들은 마음을 바꾸었습니다
  lexicon: HALOT
  rationale: שוב의 회귀·반전 의미를 살려 단순한 시간표시만이 아니라 이전 결정을 뒤집는 동작을 함께 드러냈습니다.
- source_word: וַיָּשִׁבוּ
  english_pob_choice: brought back
  chosen_korean: 다시 데려와
  alternatives_korean:
  - 가져와
  - 되돌려
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려, 스스로 돌아온 것이 아니라 다른 이들을 다시 끌어와 예전 상태로 돌린 행위를 표현했습니다.
- source_word: הָעֲבָדִים / הַשְּׁפָחוֹת
  english_pob_choice: the male slaves / the female slaves
  chosen_korean: 남종들 / 여종들
  alternatives_korean:
  - 노예들 / 노예 여종들
  - 종들 / 여종들
  lexicon: HALOT
  rationale: 이미 해방된 뒤 다시 예속된 사람들을 가리키므로 ‘종’보다 구속 상태가 분명한 ‘남종/여종’이 문맥에 더 가깝습니다.
- source_word: וְיכבישו/ם לַעֲבָדִים וְלִשְׁפָחוֹת
  english_pob_choice: forced them into slavery as male and female slaves
  chosen_korean: 강제로 종으로 삼았습니다
  alternatives_korean:
  - 강제로 예속시켰습니다
  - 다시 노예로 삼았습니다
  lexicon: HALOT
  rationale: כָּבַשׁ의 ‘억누르다/굴복시키다’ 의미를 문맥상 재예속의 폭력성으로 옮겼습니다. 마지막 ל-구문은 결과 상태를 나타내므로, ‘종으로 삼다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 재해방된 사람들을 다시 예속시키는 행위의 폭력성
  chosen_reading: 본문의 핵심을 ‘강제로 종으로 삼았습니다’로 드러내어, 단순한 반환이 아니라 언약 파기의 폭력적 재예속임을 분명히 했습니다.
  alternative_readings:
  - 그들을 종으로 돌려보냈습니다
  - 그들을 다시 종으로 삼았습니다
  rationale: 히브리어 동사의 강제성과 문맥의 윤리적 중대를 약화시키지 않기 위해, 결과와 폭력을 함께 보이는 표현을 택했습니다.
  doctrine_reference: 언약 신실성, 인간 존엄성, 약자 착취에 대한 성경의 비판
