id: JER.34.21
reference: Jeremiah 34:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/אֶת שָׂרָ֗י/ו אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וּ/בְ/יַד חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל הָ/עֹלִ֖ים מֵ/עֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/021.yaml
  text: And I will give Zedekiah king of Judah and his officials into the hand of their enemies[a], into the hand of those who seek their life, and into the hand of the army of the king of Babylon, which has withdrawn from you.
  footnotes:
  - marker: a
    text: Or 'which is withdrawing from you' / 'which has withdrawn from you.' The Hebrew literally says 'the ones going up from upon you,' an idiom for forces moving away from besieging the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 유다 왕 시드기야와 그의 관리들을 그들의 원수들의 손에, 그들의 생명을 찾는 자들의 손에, 바벨론 왕의 군대의 손에 넘기겠습니다. 그 군대는 너희에게서 물러나 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '너희 위에서 올라가는'이지만, 포위하던 군대가 물러나는 관용적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 제드기야
  lexicon: 고유명사 관례
  rationale: 이 인명은 한국어 성경에서 널리 정착된 시드기야를 따르는 것이 자연스럽고 식별성이 높습니다.
- source_word: שָׂרָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 방백들
  - 그의 지도자들
  - 그의 대신들
  lexicon: HALOT
  rationale: שַׂר는 문맥에 따라 지배층이나 관직자를 가리킬 수 있으므로, 왕정 정치 문맥에서 과도하게 군사화하지 않는 '관리들'이 가장 포괄적입니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 권세 아래
  - 권력 아래
  - 힘에
  lexicon: HALOT
  rationale: 반복되는 בְּיַד 관용구를 한국어에서도 직역에 가깝게 살려, 넘겨짐과 무력한 처지를 강조했습니다.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  english_pob_choice: those who seek their life
  chosen_korean: 그들의 생명을 찾는 자들
  alternatives_korean:
  - 그들을 죽이려는 자들
  - 그들의 생명을 노리는 자들
  lexicon: HALOT
  rationale: נפש를 '생명'으로 살리고, '찾다'의 동사를 유지해 원문의 위협적 관용구를 너무 풀어 쓰지 않았습니다.
- source_word: הָעֹלִים מֵעֲלֵיכֶם
  english_pob_choice: which has withdrawn from you
  chosen_korean: 너희에게서 물러나 있습니다
  alternatives_korean:
  - 너희에게서 올라가고 있습니다
  - 너희에게서 철수하고 있습니다
  - 너희에게서 물러났습니다
  lexicon: HALOT
  rationale: 직역상 '너희 위에서 올라가는' 표현이지만, 포위에서 물러나는 군대라는 관용적 뜻을 한국어에서 자연스럽게 드러내기 위해 현재진행형의 상태 묘사로 옮겼습니다.
theological_decisions:
- issue: 바벨론 군대의 이동을 나타내는 히브리어 관용구 처리
  chosen_reading: 문맥상 포위에서 잠시 물러나는 상태를 '너희에게서 물러나 있습니다'로 표현했습니다.
  alternative_readings:
  - '''너희에게서 올라가고 있습니다'''
  - '''너희에게서 철수하고 있습니다'''
  rationale: 원문의 '위에서 올라가다'를 그대로 옮기면 한국어에서 의미가 불명확해지므로, 문맥이 드러내는 군사적 철수의 뜻을 보존하면서도 자연스럽게 표현했습니다.
  doctrine_reference: 문맥 기반 관용구 번역
