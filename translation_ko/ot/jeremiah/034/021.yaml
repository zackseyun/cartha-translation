- from: 그리고 내가 유다 왕 시드기야와 그의 관리들을 그들의 원수들의 손에, 그들의 생명을 찾는 자들의 손에, 바벨론 왕의 군대의 손에 넘기겠습니다. 그 군대는 너희에게서 물러나 있습니다.[a]
  to: 그리고 내가 유다 왕 시드기야와 그의 관리들을 그들의 원수들의 손에, 그들의 목숨을 노리는 자들의 손에, 바벨론 왕의 군대의 손에 넘기겠습니다. 그 군대는 너희에게서 물러났습니다.[a]
  rationale: 살해 의도를 나타내는 히브리 관용구를 현대 한국어에서 명료한 ‘목숨을 노리는 자들’로 수정했습니다. 또한 각주의 직역을 히브리어 전치사 관계에 맞게 바로잡고, 본문의 군대 이동은 문맥과 영어 감사 기록의 선택에 따라 ‘물러났습니다’로 옮겼습니다.
