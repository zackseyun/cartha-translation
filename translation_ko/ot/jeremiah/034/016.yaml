  text: וַ/תָּשֻׁ֨בוּ֙ וַ/תְּחַלְּל֣וּ אֶת שְׁמִ֔/י וַ/תָּשִׁ֗בוּ אִ֤ישׁ אֶת עַבְדּ/וֹ֙ וְ/אִ֣ישׁ אֶת שִׁפְחָת֔/וֹ אֲשֶׁר שִׁלַּחְתֶּ֥ם חָפְשִׁ֖ים לְ/נַפְשָׁ֑/ם וַ/תִּכְבְּשׁ֣וּ אֹתָ֔/ם לִֽ/הְי֣וֹת לָ/כֶ֔ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/016.yaml
  text: But you turned back and profaned my name[a], and each man took back his male slave and each man his female slave, whom you had sent away free as they desired, and you forced them into subjection to be your male slaves and female slaves.
  footnotes:
  - marker: a
    text: Literally, 'free for themselves'; the phrase means they had been released to their own disposal or according to their own wish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 돌아서서 내 이름을 더럽혔으며, 각 사람이 자기 남종과 자기 여종을, 너희가 그들이 자기 뜻대로 살도록 자유롭게[a] 풀어 주었던 자들을, 다시 데려와 너희의 남종과 여종이 되게 하려고 억지로 굴복시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자 그대로 옮기면 ‘그들 자신을 위하여 자유롭게’입니다. 그들이 자기 처분대로 살도록 풀어 주었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  english_pob_choice: you turned back
  chosen_korean: 돌아서서
  alternatives_korean:
  - 되돌아가서
  - 다시 돌아서서
  lexicon: HALOT
  rationale: 서약을 저버리고 이전 행위로 회귀하는 뉘앙스를 한국어의 동작 동사로 간결하게 살렸습니다.
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  english_pob_choice: profaned my name
  chosen_korean: 내 이름을 더럽혔으며
  alternatives_korean:
  - 내 이름을 욕되게 하였으며
  - 내 이름을 속되게 하였으며
  lexicon: HALOT
  rationale: חלל은 거룩한 것을 속되게 만드는 뜻이므로, ‘더럽히다’가 예언서 문맥의 신학적 무게를 자연스럽게 전달합니다.
- source_word: עַבְדּוֹ / שִׁפְחָתוֹ
  english_pob_choice: his male slave / his female slave
  chosen_korean: 자기 남종 / 자기 여종
  alternatives_korean:
  - 자기 종 / 자기 여종
  - 자기 노예 / 자기 노예 여자
  lexicon: HALOT
  rationale: 문맥이 해방과 재예속을 분명히 다루므로, 종보다 신분의 구속성을 드러내는 ‘남종/여종’을 택했습니다.
- source_word: לְנַפְשָׁם
  english_pob_choice: as they desired
  chosen_korean: 자기 마음대로
  alternatives_korean:
  - 자기 뜻대로
  - 원하는 대로
  lexicon: HALOT
  rationale: 직역하면 ‘자기 자신을 위해’이지만, 이 관용구는 해방된 이들의 자기 처분권을 가리키므로 한국어 관용 표현으로 옮겼습니다.
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  english_pob_choice: you forced them into subjection
  chosen_korean: 다시 데려다가 … 되게 하였습니다
  alternatives_korean:
  - 억지로 굴복시켰습니다
  - 종속되게 만들었습니다
  lexicon: HALOT
  rationale: כבש의 강제적 예속화 의미를 살리되, 앞의 ‘다시 데려다가’와 결합해 재노예화의 결과를 한국어로 분명히 했습니다.
theological_decisions:
- issue: 예언자적 고발문에서의 신적 이름 훼손 표현
  chosen_reading: 내 이름을 더럽혔으며
  alternative_readings:
