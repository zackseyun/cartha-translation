  rationale: 본문은 단순한 평판 손상이 아니라 언약적 거룩의 훼손을 고발하므로, 예언서의 신학적 성격을 드러내는 표현을 유지했습니다.
  doctrine_reference: 예언서의 언약 위반 고발과 거룩성 언어
