source:
  edition: WLC
  text: שָׂרֵ֨י יְהוּדָ֜ה וְ/שָׂרֵ֣י יְרוּשָׁלִַ֗ם הַ/סָּֽרִסִים֙ וְ/הַ/כֹּ֣הֲנִ֔ים וְ/כֹ֖ל עַ֣ם הָ/אָ֑רֶץ הָ/עֹ֣בְרִ֔ים בֵּ֖ין בִּתְרֵ֥י הָ/עֵֽגֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/019.yaml
  text: the officials of Judah and the officials of Jerusalem[a], the court officials and the priests, and all the people of the land who passed between the pieces of the calf—
  footnotes:
  - marker: a
    text: Or 'eunuchs.' The Hebrew term can refer either to literal eunuchs or to court officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 지도자들과 예루살렘의 지도자들, 궁정 관원들, 제사장들, 그리고 그 땅의 모든 백성이 송아지 조각들 사이를 지나간 것입니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘환관들’. 히브리어 용어는 문자적 환관이나 궁정 관원을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  english_pob_choice: officials
  chosen_korean: 지도자들
  alternatives_korean:
  - 관원들
  - 관리들
  lexicon: HALOT
  rationale: שַׂר는 지위가 있는 통치자·고위 관원을 가리키므로, 문맥상 자연스럽고 격식 있는 현대 한국어로는 '지도자들'이 가장 무난합니다.
- source_word: הַסָּרִסִים
  english_pob_choice: court officials
  chosen_korean: 궁정 관원들
  alternatives_korean:
  - 환관들
  - 궁정 내시들
  lexicon: HALOT
  rationale: 히브리어 סָרִיס는 문자적으로 '환관'일 수 있지만 궁정 행정관을 뜻하기도 하므로, 본문 목록의 사회적 범주를 살려 '궁정 관원들'로 옮기고 문자적 가능성은 각주로 남깁니다.
- source_word: בֵּין בִּתְרֵי
  english_pob_choice: between the pieces of
  chosen_korean: 조각들 사이를
  alternatives_korean:
  - 토막들 사이를
  - 쪼갠 조각들 사이를
  lexicon: HALOT
  rationale: 언약 의식에서 잘린 짐승 조각 사이를 지나가는 장면이므로, '조각들 사이를'이 과도한 풀이 없이 본뜻을 직접 전달합니다.
- source_word: הָעֵגֶל
  english_pob_choice: the calf
  chosen_korean: 송아지
  alternatives_korean:
  - 어린 수소
  - 송아지 한 마리
  lexicon: HALOT
  rationale: עֵגֶל의 기본 뜻은 '송아지'이며, 바로 앞뒤 문맥의 제물 이미지와도 자연스럽게 맞습니다.
theological_decisions:
- issue: סָרִיסִים의 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 기능적 의미인 '궁정 관원들'을 두고, 문자적 가능성은 각주로 보존합니다.
  alternative_readings:
  - 환관들
  - 왕실 관리들
  rationale: 이 절은 언약 의식에 참여한 사회 집단들을 열거하므로, 인체적 상태를 단정하기보다 행정적 역할을 드러내는 번역이 문맥에 더 적합합니다. 동시에 히브리어의 양의성을 지우지 않기 위해 각주를 붙였습니다.
  doctrine_reference: 번역 원칙 §3 — 실제로 해소되지 않는 어휘적 긴장은 본문과 주석에서 함께 보존
