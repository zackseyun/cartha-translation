revisions:
- from: 평안히 죽을 것이요, 너보다 전에 있던 전왕들의 아버지들에게 향을 태우던 것 같이 너에게도 향을 태울 것이요, 그들이 너를 위하여 애도하여 말하기를 '슬프다, 주여!' 하리니, 이는 내가 말한 말씀이니라, 주 여호와의 말씀이니라.[a][b]
  to: 당신은 평안히 죽을 것입니다. 당신의 조상들, 곧 당신보다 앞서 있던 이전 왕들을 위하여 향료를 태웠던 것처럼, 당신을 위하여도 향료를 태울 것입니다.[a] 그들은 당신을 위하여 애도하며 ‘아, 임금이시여!’[b] 하고 말할 것입니다. 내가 이 말을 하였기 때문입니다. 야훼의 말씀입니다.
  rationale: 왕의 선대 조상이라는 동격 관계를 바로잡고, 왕의 장례 의례를 가리키는 불태움을 향료를 태우는 행위로 명확히 했습니다. 애도 호칭은 한국어의 일반적 신적 용법과 구별되도록 왕에게 적합한 표현으로 바꾸었으며, 야훼의 선언 공식과 각주 표지를 원문 및 각주의 실제 참조 대상에 맞게 정리했습니다.
  reviewer_model: gpt-5.6-terra
