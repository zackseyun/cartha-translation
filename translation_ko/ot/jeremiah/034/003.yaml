base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/003.yaml
  text: And you will not escape from his hand[a], for you will surely be captured and given into his hand. Your eyes will see the eyes of the king of Babylon, and his mouth will speak to your mouth, and you will go to Babylon.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'and he will speak with you directly.' The Hebrew reads literally, 'his mouth will speak with your mouth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 손에서 도망하지 못하실 것입니다. 반드시 붙잡히셔서 그의 손에 넘겨질 것입니다. 당신의 눈이 바벨론 왕의 눈을 볼 것이며, 그의 입이 당신의 입과 말할 것이고, 당신은 바벨론으로 가게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 입이 당신의 입과 말할 것이다’라고 하며, 직접 대면하여 말하는 뜻을 담고 있습니다.
    reason: source_note
lexical_decisions:
- source_word: לֹא תִמָּלֵט מִיָּדוֹ
  english_pob_choice: will not escape from his hand
  chosen_korean: 그의 손에서 도망하지 못하실 것입니다
  alternatives_korean:
  - 그의 손에서 벗어나지 못하실 것입니다
  - 그의 손에서 빠져나오지 못하실 것입니다
  lexicon: HALOT
  rationale: ‘손’은 권세와 통제의 신체적 은유를 살리고, ‘도망하다/벗어나다’로 escape의 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: כִּי תָּפֹשׂ תִּתָּפֵשׂ
  english_pob_choice: for you will surely be captured
  chosen_korean: 반드시 붙잡히셔서
  alternatives_korean:
  - 확실히 사로잡히셔서
  - 틀림없이 붙잡히셔서
  lexicon: HALOT
  rationale: 강조형 구조를 ‘반드시’로 반영했고, ‘붙잡히다’는 사로잡힘의 의미를 분명하게 전달합니다.
- source_word: וּבְיָדוֹ תִּנָּתֵן
  english_pob_choice: and given into his hand
  chosen_korean: 그의 손에 넘겨질 것입니다
  alternatives_korean:
  - 그의 손에 주어질 것입니다
  - 그의 권세에 넘겨질 것입니다
  lexicon: HALOT
  rationale: 동일한 ‘손’ 이미지를 반복해 앞뒤 절과 연결하고, 피동형 ‘넘겨지다’로 넘겨짐의 결과를 드러냈습니다.
- source_word: וּפִי/הוּ אֶת פִּי/ךָ יְדַבֵּר
  english_pob_choice: and his mouth will speak with your mouth
  chosen_korean: 그의 입이 당신의 입과 말할 것이고
  alternatives_korean:
  - 그의 입이 당신의 입에 말할 것이고
  - 그가 당신과 직접 말할 것이고
  lexicon: HALOT
  rationale: 히브리어의 직역적이고 구체적인 ‘입과 입’ 표현을 살리되, 한국어에서는 ‘~과 말하다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예레미야의 예언이 시드기야에게 직접 주어지는 2인칭 경고의 어조
  chosen_reading: 직접 경고의 미래형으로 번역하되, 왕에게 하는 예언적 선언의 긴박함을 유지했습니다.
  alternative_readings:
  - 완곡한 가능성 표현
  - 서술적 과거형
  rationale: 히브리어는 단정적 예언 선포이므로, 한국어에서도 확정적 미래로 옮겨 경고의 무게를 보존했습니다.
  doctrine_reference: 예언문체의 선언적 확정성
- issue: ‘당신의 입과 말할 것이고’의 직역성과 자연성
  chosen_reading: 직역의 낯섦을 완전히 풀지 않고, 한국어 어법 안에서 ‘입과 말하다’의 직접 대면 이미지를 살렸습니다.
  alternative_readings:
  - 그와 직접 말할 것입니다
  - 면전에서 말할 것입니다
  rationale: 본문의 육체적·대면적 이미지를 지우면 히브리어 수사효과가 약해지므로, 의미는 자연화하되 핵심 이미지는 유지했습니다.
  doctrine_reference: 원문 수사 보존 원칙
