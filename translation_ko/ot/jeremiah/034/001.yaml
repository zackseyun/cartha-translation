base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], when Nebuchadnezzar king of Babylon and all his army, and all the kingdoms of the earth under the dominion of his hand, and all the peoples, were fighting against Jerusalem and against all its cities, saying[b],
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; the more familiar English form is ''Nebuchadnezzar.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the kingdoms of the land under the dominion of his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼에게서 예레미야에게 임한 말씀이니, 바벨론의 왕 느부갓네살과 그의 온 군대와, 그의 손의 통치 아래 있는 땅의 모든 나라와 모든 백성이 예루살렘과 그 모든 성읍을 치고 있을 때에 하신 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘느부갓레살’에 더 가깝습니다. 널리 알려진 한국어 표기는 ‘느부갓네살’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 손의 통치 아래 있는 땅’은 ‘땅의 왕국들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: BDB/HALOT
  rationale: 예언 서문의 관용구로서 דָּבָר는 단순한 ‘말’보다 하나님의 계시 말씀을 가리키므로, 한국어에서도 ‘말씀’으로 옮겨 예언 공식성을 살렸습니다.
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  english_pob_choice: that came to Jeremiah
  chosen_korean: 예레미야에게 임한
  alternatives_korean:
  - 예레미야에게 온
  - 예레미야에게 이른
  lexicon: HALOT
  rationale: ‘오다/이르다’의 관용적 의미를 살려, 예언 말씀이 선지자에게 도달했다는 수동적·계시적 뉘앙스를 ‘임한’으로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 공개 번역 원칙에 따라 하나님의 이름은 전통적 대체어가 아니라 음역형 ‘야훼’로 직접 드러냈습니다.
- source_word: נִלְחָמִים עַל
  english_pob_choice: were fighting against
  chosen_korean: 치고 있을 때에
  alternatives_korean:
  - 맞서 싸우고 있을 때에
  - 전쟁을 벌이고 있을 때에
  lexicon: HALOT
  rationale: 전쟁 진행 상황을 나타내는 분사적 배경을 한국어 서술 흐름에 맞게 풀어, 예루살렘을 상대로 한 현재 진행 중의 공격 상황을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 야훼의 직접 표기
  chosen_reading: 본문의 신적 발화 출처를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님으로 완화하여 표기
  - 전통 교회 용례인 여호와 사용
  rationale: 원문이 יְהוָה를 직접 사용하므로, 고유한 언약 이름을 가리는 관습적 대체어보다 स्रोत-직접성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
