id: JER.34.15
reference: Jeremiah 34:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּשֻׁ֨בוּ אַתֶּ֜ם הַ/יּ֗וֹם וַ/תַּעֲשׂ֤וּ אֶת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י לִ/קְרֹ֥א דְר֖וֹר אִ֣ישׁ לְ/רֵעֵ֑/הוּ וַ/תִּכְרְת֤וּ בְרִית֙ לְ/פָנַ֔/י בַּ/בַּ֕יִת אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/015.yaml
  text: And you yourselves had turned back today and had done what was right in my eyes[a], by proclaiming liberty, each man to his neighbor[b]; and you had cut a covenant before me in the house that is called by my name.
  footnotes:
  - marker: a
    text: Or 'you had made a covenant before me.' Hebrew literally, 'cut a covenant.'
    reason: lexical_alternative
  - marker: b
    text: That is, the temple in Jerusalem.
    reason: cultural_note
translation:
  language: ko
  text: 너희는 오늘 돌이켜 내 눈에 옳은 일을 행하고, 각 사람이 자기 이웃에게 해방을 선포하였으며, 내 이름으로 불리는 그 집에서 내 앞에 언약을 맺었다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  english_pob_choice: had turned back
  chosen_korean: 너희 자신은 … 행하여
  alternatives_korean:
  - 돌아왔습니다
  - 되돌아섰습니다
  - 회개하였습니다
  lexicon: HALOT
  rationale: 문맥상 일시적으로 옳은 방향으로 돌아선 행동을 가리키므로, 내면적 회개를 단정하는 표현은 피하고 행위 중심으로 옮겼습니다.
- source_word: הַיָּשָׁר בְּעֵינַי
  english_pob_choice: what was right in my eyes
  chosen_korean: 내 눈에 옳은 일
  alternatives_korean:
  - 내 보기에 옳은 일
  - 내 앞에서 옳은 일
  lexicon: HALOT
  rationale: 하나님의 판단 기준을 드러내는 관용구를 한국어에서도 직역에 가깝게 살려, 신적 평가라는 느낌을 보존했습니다.
- source_word: לִקְרֹא דְרוֹר
  english_pob_choice: by proclaiming liberty
  chosen_korean: 자유를 선포하며
  alternatives_korean:
  - 해방을 선포하며
  - 석방을 선포하며
  lexicon: HALOT
  rationale: דְרוֹר는 속박에서의 해방·면제를 가리키므로, 현대어로는 ‘자유를 선포하다’가 가장 자연스럽지만 공적·법적 선언의 성격도 함께 살립니다.
- source_word: וַתִּכְרְתוּ בְרִית
  english_pob_choice: you had cut a covenant
  chosen_korean: 언약을 맺었는데
  alternatives_korean:
  - 언약을 끊었는데
  - 언약을 체결했는데
  - 언약을 맺었고
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자성은 중요하지만, 한국어 본문에서는 의미가 곧바로 전달되는 ‘언약을 맺다’를 택하고, ‘cut a covenant’의 직역적 긴장은 본문 흐름으로 보존했습니다.
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  english_pob_choice: in the house that is called by my name
  chosen_korean: 내 이름으로 불리는 그 집
  alternatives_korean:
  - 내 이름이 불리는 집
  - 내 이름이 불려진 그 집
  - 내 이름이 붙은 집
  lexicon: HALOT
  rationale: 성전이라는 의미를 주석 없이 본문에 풀어 쓰기보다, 히브리어의 소유·귀속 관용구를 살려 ‘내 이름으로 불리는’으로 옮겼습니다.
theological_decisions:
- issue: כרת ברית의 언약 체결 방식
  chosen_reading: ‘언약을 맺다’로 자연스럽게 읽되, 원문 관용구의 엄중함을 유지합니다.
  alternative_readings:
  - ‘언약을 자르다’로 직역
  - ‘언약을 체결하다’로 법률어화
  rationale: 한국어에서는 ‘맺다’가 가장 이해되기 쉬우면서도 언약의 공식성을 충분히 전달합니다. 직역의 낯섦은 본문 수용성을 떨어뜨릴 수 있어, 의미 전달을 우선했습니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency with documented exception)
