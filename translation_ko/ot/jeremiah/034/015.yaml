revisions:
- from: 그리고 오늘 너희 자신은 내 눈에 옳은 일을 행하여, 각 사람마다 자기의 이웃에게 자유를 선포하며, 내 앞에서 언약을 맺었는데, 내 이름으로 불리는 그 집에서 그리하였습니다.[a]
  to: 너희는 오늘 돌이켜 내 눈에 옳은 일을 행하고, 각 사람이 자기 이웃에게 해방을 선포하였으며, 내 이름으로 불리는 그 집에서 내 앞에 언약을 맺었다.
  rationale: 원문의 ‘오늘 돌이켜’와 동사들의 병렬성을 복원했습니다. ‘해방을 선포하다’는 드로르의 공적 해방 선언을 반영하며, 성전이라는 문화적 식별은 본문 표현 자체로 충분하므로 필수 주석으로 남기지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:17Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 וַתָּשֻׁבוּ(‘너희가 돌이켰다/돌아왔다’)를 본문에서 사실상 누락하여, 이전의 불순종에서 일시적으로 되돌아온 행위를 전달하지 못합니다. 또한 히브리어의 연속된 과거 서술을 ‘행하여 … 맺었는데’로 처리해 문장 관계가 다소 불분명해졌습니다. 수정문은 ‘돌이켜’와 병렬 과거 서술을 보완합니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. ‘각 사람이 자기 이웃에게 해방을 선포하였다’는 공적·법적 석방 선언이라는 문맥을 분명히 하면서도 원문의 분배 표현을 보존합니다.
  terminology: ‘언약을 맺었다’는 כרת ברית의 자연스러운 한국어 대응이며, ‘내 이름으로 불리는 그 집’은 성전을 본문에 과도하게 해설하지 않고 원문의 명명 관용구를 유지합니다. ‘해방’은 דְרוֹר의 노예 해방·석방 문맥을 ‘자유’보다 더 명료하게 드러냅니다.
  issues:
  - severity: high
    issue: וַתָּשֻׁבוּ의 의미 누락
    rationale: 초안의 ‘너희 자신은 내 눈에 옳은 일을 행하여’에는 ‘돌이키다/돌아오다’에 해당하는 표현이 없어, 본 절이 말하는 이전 행동의 전환이 빠졌습니다.
  - severity: medium
    issue: 서술 연결의 불명료성
    rationale: ‘행하여 … 맺었는데’는 히브리어의 세 병렬 동작(돌이킴, 옳은 일 행함, 해방 선포, 언약 체결)을 종속·대조 관계처럼 들리게 하므로, 병렬 과거 서술로 정리하는 편이 정확합니다.
  revised_text: 너희는 오늘 돌이켜 내 눈에 옳은 일을 행하고, 각 사람이 자기 이웃에게 해방을 선포하였으며, 내 이름으로 불리는 그 집에서 내 앞에 언약을 맺었다.
