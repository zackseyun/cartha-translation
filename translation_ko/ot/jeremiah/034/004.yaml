base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/004.yaml
  text: 'Yet hear the word of Yahweh, Zedekiah king of Judah: Thus says Yahweh concerning you, You shall not die by the sword.'
translation:
  language: ko
  text: 그러나 야훼의 말씀을 들으십시오, 유다 왕 시드기야여. 야훼께서 당신에 관하여 이렇게 말씀하십니다. “당신은 칼에 죽지 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 하나님의 이름 YHWH가 나오며, 여기서는 이를 ‘야훼’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 그렇지만
  - 하지만
  - 다만
  lexicon: HALOT
  rationale: 앞선 경고 뒤에 오는 제한적·대조적 전환을 자연스럽게 살리기 위해 ‘그러나’를 썼습니다.
- source_word: שְׁמַע דְּבַר יְהוָה
  english_pob_choice: hear the word of Yahweh
  chosen_korean: 야훼의 말씀을 들으십시오
  alternatives_korean:
  - 야훼의 말을 들으십시오
  - 야훼의 말씀을 들어라
  lexicon: HALOT
  rationale: 예언자적 관용구인 ‘말씀을 듣다’를 살리되, 합쇼체 명령형으로 시드기야에게 직접적인 호소를 유지했습니다.
- source_word: צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה
  english_pob_choice: Zedekiah king of Judah
  chosen_korean: 유다 왕 시드기야여
  alternatives_korean:
  - 유다의 왕 시드기야여
  - 시드기야 유다 왕이여
  lexicon: HALOT
  rationale: 히브리어의 호격적 부름을 한국어도 호격 ‘-여’로 옮기고, 왕호와 영토를 간결하게 배치했습니다.
- source_word: עָלֶיךָ
  english_pob_choice: concerning you
  chosen_korean: 당신에 관하여
  alternatives_korean:
  - 당신에게
  - 당신에 대해
  - 당신을 두고
  lexicon: HALOT
  rationale: 말씀의 대상이 시드기야의 운명에 대한 선포이므로, 공격적 의미를 띠지 않는 ‘관하여’가 가장 정확합니다.
- source_word: לֹא תָמוּת בֶּחָרֶב
  english_pob_choice: You shall not die by the sword
  chosen_korean: 당신은 칼에 죽지 않을 것입니다
  alternatives_korean:
  - 당신은 칼로 죽지 않을 것입니다
  - 당신은 칼에 의해 죽지 않을 것입니다
  lexicon: HALOT
  rationale: ‘칼에 죽다’는 히브리어 관용을 한국어에서도 유지해, 단순한 무기 언급을 넘어 폭력적 죽음의 양식을 드러냈습니다.
theological_decisions:
