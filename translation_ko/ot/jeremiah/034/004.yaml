  rationale: 이 번역 전통의 고정 원칙에 따라 신명 자체를 가리고 칭호로 대체하지 않고, 언약 이름을 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
