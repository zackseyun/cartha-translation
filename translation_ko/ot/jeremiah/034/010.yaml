reference: Jeremiah 34:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל הַ/שָּׂרִ֨ים וְ/כָל הָ/עָ֜ם אֲשֶׁר בָּ֣אוּ בַ/בְּרִ֗ית לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֤ישׁ אֶת שִׁפְחָת/וֹ֙ חָפְשִׁ֔ים לְ/בִלְתִּ֥י עֲבָד בָּ֖/ם ע֑וֹד וַֽ/יִּשְׁמְע֖וּ וַ/יְשַׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/010.yaml
  text: So all the officials and all the people who had entered into the covenant to send away[a], each man his male slave and each man his female slave, free, so as not to make them serve any longer[b], obeyed and sent them away.
  footnotes:
  - marker: a
    text: Or 'heard.' The Hebrew verb often means 'hear/listen,' but here it carries the sense of obeying, as shown by the following action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his slave and his female slave'; the translation makes the male/female distinction explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 모든 관리들과 언약에 들어간 모든 백성은 — 곧 각자 자기 남자 종과 자기 여자 종을 자유롭게 놓아, 그들로 더 이상 자기들을 섬기게 하지 않기로 한 이들인데 — 들었고, 그들을 풀어 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁמע는 여기서 단순히 ‘듣다’보다 ‘순종하다’의 뜻을 띱니다. 뒤이어 실제로 그들을 풀어 준 행위가 그 의미를 뒷받침합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘자기 종과 자기 여종’입니다. 남녀 구분을 분명히 하기 위해 본문에서는 이를 명시했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  english_pob_choice: obeyed
  chosen_korean: 들었고
  alternatives_korean:
  - 순종했고
  - 복종했고
  lexicon: HALOT
  rationale: 히브리어 שׁמע는 이 문맥에서 단순 청취가 아니라 이어지는 실행을 동반한 응답을 가리키므로, 본문 흐름을 따라 ‘들었고’로 두되 문맥상 순종의 의미를 드러냈습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: officials
  chosen_korean: 관리들
  alternatives_korean:
  - 관료들
  - 지도자들
  lexicon: HALOT
  rationale: שׂרים은 왕정·행정적 권위를 가진 자들을 가리키므로, 현대 한국어에서는 ‘관리들’이 ‘관리자’가 아닌 공적 권한자라는 뜻을 비교적 분명하게 전달합니다.
- source_word: עַבְדּוֹ / שִׁפְחָתוֹ
  english_pob_choice: his male slave / his female slave
  chosen_korean: 자기 남자 종 / 자기 여자 종
  alternatives_korean:
  - 자기 남자 노예 / 자기 여자 노예
  - 자기 종 / 자기 몸종
  lexicon: HALOT
  rationale: 이 절은 해방 조치의 대상이 되는 예속 상태를 분명히 하므로 ‘종’으로 번역해 종속성을 유지하되, 남녀 구분은 원문의 대구를 살려 ‘남자 종 / 여자 종’으로 나타냈습니다.
- source_word: לְבִלְתִּי עֲבָד בָּם עוֹד
  english_pob_choice: so as not to make them serve any longer
  chosen_korean: 그들로 더 이상 자기들을 섬기게 하지 않기로
  alternatives_korean:
  - 그들을 더 이상 노역시키지 않기로
  - 더 이상 그들을 종으로 삼지 않기로
  lexicon: HALOT
  rationale: עבד의 사역적·강제적 의미를 살리면서도 문장 전체의 법적 목적절 기능을 자연스럽게 드러내기 위해 ‘더 이상 자기들을 섬기게 하지 않기로’로 옮겼습니다.
- source_word: וַיְשַׁלֵּחוּ
  english_pob_choice: sent them away
  chosen_korean: 풀어 주었습니다
  alternatives_korean:
  - 내보냈습니다
  - 놓아 주었습니다
  lexicon: HALOT
  rationale: 앞의 ‘자유롭게’와 결합해 해방 행위가 강조되므로, 단순한 방출보다 manumission의 뉘앙스를 드러내는 ‘풀어 주었습니다’를 택했습니다.
theological_decisions:
- issue: 언약 준수의 결과를 나타내는 שׁמע의 의미
  chosen_reading: ‘들었고’로 옮기되, 바로 뒤의 실행과 함께 순종의 의미를 드러냈습니다.
  alternative_readings:
  - ‘순종했고’로 명시적으로 번역
  - ‘들어 따랐고’로 번역
  rationale: 이 절은 청취 자체보다 언약 이행을 강조하므로, 한국어 본문에서는 과도하게 해석적인 ‘순종했다’보다 본문 질서를 살린 표현을 택하되 의미는 문맥으로 보완했습니다.
  doctrine_reference: Jer 34 문맥의 언약 갱신/파기 서사; translation philosophy §1
- issue: 예속 해방을 가리키는 사회적 용어
  chosen_reading: ‘종’과 ‘풀어 주었습니다’를 사용해 해방과 예속의 긴장을 함께 유지했습니다.
  alternative_readings:
  - ‘노예’와 ‘해방했습니다’
  - ‘종’과 ‘놓아 주었습니다’
  rationale: 원문은 법적 해방 조치이지만, 본문이 전제하는 예속 관계를 흐리지 않는 것이 중요하므로 너무 완화된 표현보다 해방의 실질을 드러내는 동사를 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested terms guidance
