- from: 그래서 모든 관리들과 언약에 들어간 모든 백성은 — 곧 각자 자기 남자 종과 자기 여자 종을 자유롭게 놓아, 그들로 더 이상 자기들을 섬기게 하지 않기로 한 이들인데 — 들었고, 그들을 풀어 주었습니다.[a][b]
  to: 그리하여 각 사람이 자기 남종과 자기 여종[b]을 자유롭게 놓아 주고 더 이상 그들을 종으로 부리지 않기로 언약에 들어간 모든 관리와 모든 백성은 순종하여[a] 그들을 놓아주었습니다.
  rationale: 문맥상 순종의 의미를 본문에 명시하고, 목적절을 ‘더 이상 그들을 종으로 부리지 않기로’로 바로잡았습니다. 또한 수식 구조와 각주 위치를 한국어 문장 흐름에 맞게 조정하되, ‘각 사람’, 남종·여종의 구별, 언약 참여, 해방의 실행이라는 원문의 요소를 보존했습니다.
