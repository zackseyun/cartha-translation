  naturalness: 삽입 대시로 된 긴 동격 설명은 한국어 문장 흐름을 끊습니다. 관계절을 주어 앞에 자연스럽게 배열하고, 반복되는 대상은 ‘그들’로 받아 쓰는 것이 현대 표준 한국어 합쇼체에 적절합니다.
