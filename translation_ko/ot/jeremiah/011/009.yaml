  text: And Yahweh said to me[b][a], “A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem.”
  footnotes:
  - marker: a
    text: Or 'A plot has been uncovered' or 'A treasonous conspiracy has been found.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'among the men of Judah'; the singular 'man' functions collectively here.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. “유다 사람들 가운데[a]와 예루살렘 주민들 가운데에 음모가 드러났습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘유다 사람들 가운데’의 단수형 ‘사람’은 여기서 집합적으로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘음모가 발견되었습니다’로 옮길 수 있습니다. 문맥상 ‘반역 음모’라는 뉘앙스도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유신명사 יְהוָה는 POB의 원칙에 따라 ‘야훼’로 옮겨, 호칭인 ‘주님’과 구별하고 하나님의 언약적 이름을 드러냈습니다.
- source_word: נִמְצָא
  english_pob_choice: has been found
  chosen_korean: 드러났습니다
  alternatives_korean:
  - 발견되었습니다
  - 찾아졌습니다
  lexicon: HALOT
  rationale: ‘has been found’의 발견된 사실을 자연스러운 현대 한국어로 옮기되, 조사·수사적 맥락에서 드러난 상태를 살려 ‘드러났습니다’로 표현했습니다.
- source_word: קֶשֶׁר
  english_pob_choice: a conspiracy
  chosen_korean: 음모
  alternatives_korean:
  - 모의
  - 반역
  - 반역 음모
  lexicon: HALOT
  rationale: 예언서·정치적 문맥에서 קשר는 단순한 ‘계획’보다 불충한 결탁을 뜻하므로, 한국어에서 가장 직접적인 대응인 ‘음모’를 택했습니다.
- source_word: בְּאִישׁ יְהוּדָה וּבְיֹשְׁבֵי יְרוּשָׁלִָם
  english_pob_choice: among the men of Judah ... among the inhabitants of Jerusalem
  chosen_korean: 유다 사람들 가운데와 예루살렘 주민들 가운데
  alternatives_korean:
  - 유다의 남자들 가운데와 예루살렘에 사는 이들 가운데
  - 유다 사람 가운데와 예루살렘 주민 가운데
  lexicon: HALOT
  rationale: 히브리어 단수 איש은 집합적으로 쓰였으므로 ‘유다 사람들’로 풀어 집합성을 살렸고, יֹשְׁבֵי는 ‘주민들’로 자연스럽게 옮겨 병렬 구조를 보존했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
