  - severity: medium
    issue: b 각주의 문자적 설명이 문법적으로 부정확함
    rationale: וְלֹא תָמוּת는 ‘죽지 말라’가 아니라 문자적으로 ‘그리고/그러나 너는 죽지 않을 것이다’에 가까운 부정 직설문입니다. 문맥상 이는 금지에 붙은 살해 위협으로 이해됩니다.
