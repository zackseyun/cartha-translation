revisions:
- from: 그러므로 야훼께서 말씀하십니다. 아나돗 사람들, 곧 당신의 목숨을 노리며 말하기를 “야훼의 이름으로 예언하지 말아라. 그러면 우리 손에 죽을 것이다”라고 하는 자들에 관하여 말입니다.[a][b]
  to: 그러므로 야훼께서 당신의 목숨을 노리며 “야훼의 이름으로 예언하지 마라. 그렇지 않으면 네가 우리 손에 죽을 것이다”라고 말하는 아나돗 사람들에 대하여 이렇게 말씀하십니다.[a][b]
  rationale: 직접 발화 공식의 통사 구조를 바로잡아 원문과 현대 한국어의 흐름을 함께 살렸습니다. 살해 위협은 원문의 문법적 부정 표현을 각주에 보존하되, 본문에서는 문맥상 기능하는 조건적 협박으로 번역했습니다. 각주 b의 ‘죽지 말라’라는 부정확한 명령형 설명도 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:24Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 예언자적 선언 공식, 아나돗 사람들의 살해 의도, 그리고 예언 금지와 살해 위협의 인과관계는 대체로 반영되었습니다. 그러나 현행 본문은 ‘말씀하십니다’ 뒤에 이어지는 ‘…에 관하여 말입니다’가 원문의 직접 발화 공식(‘…에 대하여 이렇게 말씀하신다’)을 어색하게 분절합니다. 또한 b 각주는 부정문을 ‘죽지 말라’로 설명하는데, 원문의 형태는 명령형이 아니라 ‘너는 우리 손에 죽지 않을 것이다’라는 부정 직설문입니다.
  naturalness: ‘아나돗 사람들 …에 관하여 말입니다’는 현대 격식체 성경 문장으로 부자연스럽습니다. ‘…에 대하여 이렇게 말씀하십니다’로 고치면 문장 구조와 합쇼체가 자연스럽습니다. 인용문 안의 가해자들의 금지는 직접 발화이므로 ‘마라’가 적절하며, 위협은 ‘그렇지 않으면’으로 자연스럽게 드러낼 수 있습니다.
  terminology: ‘야훼’, ‘아나돗’, ‘예언하다’, ‘목숨을 노리다’는 적절합니다. אַנְשֵׁי의 남성 복수는 문맥상 마을의 남성 구성원을 가리키지만, 한국어 ‘아나돗 사람들’은 불필요한 성별 중립화 없이 자연스럽게 집단을 지시할 수 있습니다.
