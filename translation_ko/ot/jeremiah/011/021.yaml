reference: Jeremiah 11:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ עַל אַנְשֵׁ֣י עֲנָת֔וֹת הַֽ/מְבַקְשִׁ֥ים אֶֽת נַפְשְׁ/ךָ֖ לֵ/אמֹ֑ר לֹ֤א תִנָּבֵא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/לֹ֥א תָמ֖וּת בְּ/יָדֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/021.yaml
  text: Therefore[a], this is what Yahweh says concerning the men of Anathoth who are seeking your life, saying, “Do not prophesy in the name of Yahweh[c][b], lest you die by our hand.”
  footnotes:
  - marker: a
    text: Or, more formally, 'Thus says the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'who are seeking your life,' an idiom meaning they are trying to kill you.
    reason: lexical_alternative
  - marker: c
    text: Or, 'lest you die by our hand.' The Hebrew wording is literally negative, but in context it functions as a threat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 말씀하십니다. 아나돗 사람들, 곧 당신의 목숨을 노리며 말하기를 “야훼의 이름으로 예언하지 말아라. 그러면 우리 손에 죽을 것이다”라고 하는 자들에 관하여 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘당신의 목숨을 찾다’는 관용적으로 ‘해치려 하다’, 곧 죽이려 하다를 뜻합니다.
    reason: source_note
  - marker: b
    text: 히브리어의 부정문은 문자적으로는 ‘죽지 말라’에 가까우나, 문맥상 협박으로 기능합니다.
    reason: theological_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 따라서
  lexicon: HALOT
  rationale: 앞 문맥의 결론을 이끄는 접속부사로, 현대 한국어에서 자연스럽고 격식 있는 ‘그러므로’가 가장 잘 맞습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: this is what Yahweh says
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 이렇게 말씀하십니다
  - 주님께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 직접성을 살리면서도 합쇼체에 맞게 옮겼고, 본 프로젝트 기본값에 따라 신명은 ‘야훼’로 유지했습니다.
- source_word: אַנְשֵׁי עֲנָתוֹת
  english_pob_choice: the men of Anathoth
  chosen_korean: 아나돗 사람들
  alternatives_korean:
  - 아나돗의 남자들
  - 아나돗의 사람들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수 구조이지만 한국어에서 과도하게 성별을 드러내기보다 도시 출신 집단을 자연스럽게 지시하는 ‘아나돗 사람들’이 적절합니다.
- source_word: הַמְבַקְשִׁים אֶת נַפְשְׁךָ
  english_pob_choice: who are seeking your life
  chosen_korean: 당신의 목숨을 노리며
  alternatives_korean:
  - 당신의 생명을 찾으며
  - 당신의 목숨을 찾으며
  lexicon: HALOT
  rationale: 직역하면 ‘목숨을 찾는’이지만, 문맥상 살해 의도를 뜻하는 관용구이므로 한국어에서도 자연스러운 위협 표현인 ‘목숨을 노리다’로 살렸습니다.
- source_word: לֹא תִנָּבֵא בְּשֵׁם יְהוָה
  english_pob_choice: Do not prophesy in the name of Yahweh
  chosen_korean: 야훼의 이름으로 예언하지 말아라
  alternatives_korean:
  - 야훼의 이름으로 예언해서는 안 된다
  - 야훼 이름으로 예언하지 말아라
  lexicon: HALOT
  rationale: 명령/금지의 직접화를 유지했고, ‘예언하다’와 ‘야훼의 이름으로’는 문맥상 예언 행위를 신적 권위 아래서 말하는 것으로 분명히 드러냅니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 신명기를 직접 호명하는 예언 공식이므로 프로젝트 기본 원칙에 따라 신명은 한국 교회 전통어 ‘주님’보다 원형에 가까운 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 협박문의 뉘앙스
  chosen_reading: “그러면 우리 손에 죽을 것이다”
  alternative_readings:
  - “우리 손에 죽으리라”
  - “우리 손에 죽지 않게 될 것이다”
  rationale: 히브리어는 형식상 부정문이지만 문맥상 살해 협박으로 기능하므로, 한국어에서도 위협의 뜻이 분명히 드러나도록 옮겼습니다.
  doctrine_reference: English audit trail lexical decision on וְלֹא תָמוּת בְּיָדֵנוּ
