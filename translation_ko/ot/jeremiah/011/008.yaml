revisions:
- from: 그러나 그들은 듣지 않았고 귀를 기울이지도 않았습니다. 오히려 각 사람은 자기 악한 마음의 완고함 속에서 걸어갔습니다. 그래서 내가 이 언약의 모든 말씀을 그들 위에 가져왔는데, 내가 그것들을 행하라고 명령했지만 그들은 행하지 않았습니다.[a][b]
  to: 그러나 그들은 듣지 않았고[a] 귀를 기울이지도 않았습니다. 오히려 각 사람은 자기 악한 마음의 완고함을 따라 살았습니다. 그래서 나는 그들에게 이 언약의 모든 말씀을[b] 이루어지게 하였습니다. 내가 그것들을 행하라고 명령했지만, 그들은 행하지 않았습니다.
  rationale: 원문의 청종 거부, 각자의 악한 마음의 완고함에 따른 행실, 언약의 모든 말씀을 그들에게 실현하신 결과, 그리고 그들이 명령받은 것을 행하지 않은 사실을 보존했습니다. 직역투인 ‘그들 위에 가져왔습니다’는 문맥상 의미를 유지하는 자연스러운 한국어 사역 표현으로 고쳤고, 각주 표지를 해당 본문 어구 뒤로 옮겼습니다.
