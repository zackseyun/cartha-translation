id: JER.11.8
reference: Jeremiah 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹֽא הִטּ֣וּ אֶת אָזְנָ֔/ם וַ/יֵּ֣לְכ֔וּ אִ֕ישׁ בִּ/שְׁרִיר֖וּת לִבָּ֣/ם הָ/רָ֑ע וָ/אָבִ֨יא עֲלֵי/הֶ֜ם אֶֽת כָּל דִּבְרֵ֧י הַ/בְּרִית הַ/זֹּ֛את אֲשֶׁר צִוִּ֥יתִי לַ/עֲשׂ֖וֹת וְ/לֹ֥א עָשֽׂוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/008.yaml
  text: Yet they did not listen or incline their ear[a], but each one walked in the stubbornness of his evil heart; so I brought upon them all the words of this covenant, which I commanded them to do[b], but they did not do them.
  footnotes:
  - marker: a
    text: Or 'did not hear'; in context the phrase also carries the sense of refusing to obey.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the words of this covenant'; this may include the covenant's threatened judgments, not only its commands.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그들은 듣지 않았고 귀를 기울이지도 않았습니다. 오히려 각 사람은 자기 악한 마음의 완고함 속에서 걸어갔습니다. 그래서 내가 이 언약의 모든 말씀을 그들 위에 가져왔는데, 내가 그것들을 행하라고 명령했지만 그들은 행하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘듣지 않았다’; 문맥상 순종을 거부했다는 뜻도 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이 언약의 모든 말씀’입니다. 문맥상 언약의 명령뿐 아니라 위협된 심판도 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ
  english_pob_choice: did not listen
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 들리지 않았습니다
  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 문맥에 따라 ‘듣다/경청하다/순종하다’를 아우르므로, 여기서는 ‘귀를 기울이지도’와 짝을 이루는 점을 살려 우선 ‘듣지 않았습니다’로 옮겼습니다.
- source_word: הִטּוּ אֶת אָזְנָם
  english_pob_choice: incline their ear
  chosen_korean: 귀를 기울이지도 않았습니다
  alternatives_korean:
  - 귀를 돌리지도 않았습니다
  - 주의를 기울이지도 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 청종 이미지를 살리면서도 현대 한국어에서 자연스럽게 이해되도록 ‘귀를 기울이다’로 옮겼습니다.
- source_word: בִּשְׁרִירוּת לִבָּם הָרָע
  english_pob_choice: in the stubbornness of his evil heart
  chosen_korean: 자기 악한 마음의 완고함 속에서
  alternatives_korean:
  - 자기 악한 마음의 고집 속에서
  - 자기 악한 마음의 완악함 속에서
  lexicon: HALOT
  rationale: שׁרירות는 완고함, 고집스러운 자기 고집을 뜻하므로 ‘완고함’이 가장 직접적입니다. ‘악한 마음’은 히브리어의 도덕적 평가를 그대로 반영합니다.
- source_word: וָאָבִיא עֲלֵיהֶם
  english_pob_choice: so I brought upon them
  chosen_korean: 그래서 내가 ... 그들 위에 가져왔습니다
  alternatives_korean:
  - 그러므로 내가 ... 그들 위에 내렸습니다
  - 내가 ... 그들에게 가져왔습니다
  lexicon: HALOT
  rationale: 히브리어의 결과 연결을 살려 ‘그래서’로 옮겼고, אָבִיא의 ‘가져오다/가져오게 하다’ 구조를 유지했습니다. 한국어에서는 자연스럽게 ‘그들 위에 가져왔습니다’가 심판의 임박성을 드러냅니다.
- source_word: כָּל דִּבְרֵי הַבְּרִית הַזֹּאת
  english_pob_choice: all the words of this covenant
  chosen_korean: 이 언약의 모든 말씀
  alternatives_korean:
  - 이 언약의 모든 조항
  - 이 언약의 모든 규정
  lexicon: HALOT
  rationale: 직역하면 ‘말씀들’이지만, 언약 문맥에서 명령과 경고를 함께 가리킬 수 있어 ‘말씀’으로 보존했습니다. POB의 열린 처리처럼 해석을 지나치게 좁히지 않습니다.
theological_decisions:
- issue: ‘all the words of this covenant’의 범위
  chosen_reading: ‘이 언약의 모든 말씀’으로 직역해, 명령뿐 아니라 언약의 경고와 제재 가능성도 열어 둡니다.
  alternative_readings:
  - 이 언약의 모든 조항
  - 이 언약의 모든 저주
  rationale: 본문 자체는 ‘말씀들’이라고 말하므로, 문맥상 제재를 포함할 수 있어도 번역에서 미리 좁히지 않는 것이 source-grounded합니다.
  doctrine_reference: 번역 철학의 원문 우선 원칙
