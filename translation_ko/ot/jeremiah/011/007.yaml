id: JER.11.7
reference: Jeremiah 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ הָעֵ֨ד הַעִדֹ֜תִי בַּ/אֲבֽוֹתֵי/כֶ֗ם בְּ/יוֹם֩ הַעֲלוֹתִ֨/י אוֹתָ֜/ם מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַשְׁכֵּ֥ם וְ/הָעֵ֖ד לֵ/אמֹ֑ר שִׁמְע֖וּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/007.yaml
  text: For I solemnly warned your fathers in the day I brought them up from the land of Egypt[a], and to this day, rising early and warning them, saying, ‘Listen to my voice.’
  footnotes:
  - marker: a
    text: Or 'Obey my voice.' The Hebrew expression can carry the sense of listening with obedience, especially in covenant contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희 조상들을 이집트 땅에서 이끌어 올린 날부터 오늘에 이르기까지 그들에게 엄중히 경고하였고, 일찍 일어나 경고하며 말하였다. ‘내 목소리를 들으라.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 목소리에 순종하라.’ 히브리어 표현은 특히 언약 문맥에서 순종을 포함한 청취의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵד הַעִדֹתִי
  english_pob_choice: I solemnly warned
  chosen_korean: 엄숙히 경고하며
  alternatives_korean:
  - 간절히 경고하며
  - 엄중히 증언하며
  lexicon: HALOT
  rationale: עוּד의 강조형은 단순한 정보 전달이 아니라 언약적 경고의 누적된 강도를 나타내므로, 한국어에서는 ‘엄숙히 경고하다’로 그 무게를 살렸습니다.
- source_word: בַּאֲבֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 너희 조상들
  alternatives_korean:
  - 너희 아버지들
  - 너희 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘너희 아버지들’이지만, 문맥상 출애굽 세대를 가리키는 집단명칭이므로 한국어에서는 자연스럽게 ‘조상들’로 옮기되 혈통·언약의 연속성을 유지했습니다.
- source_word: הַשְׁכֵּם וְהָעֵד
  english_pob_choice: rising early and warning them
  chosen_korean: 부지런히 경고하여
  alternatives_korean:
  - 이른 아침마다 경고하여
  - 일찍 일어나 경고하여
  lexicon: HALOT
  rationale: ‘일찍 일어나’의 직역은 가능하지만 한국어에서는 반복적·지속적 행동을 나타내는 관용을 살려 ‘부지런히’로 옮겼습니다. 다만 본문의 반복성과 긴박함은 ‘경고하여’에 남겼습니다.
- source_word: שִׁמְעוּ בְּקוֹלִי
  english_pob_choice: Listen to my voice
  chosen_korean: 내 목소리를 들으라
  alternatives_korean:
  - 내 목소리에 귀 기울이라
  - 내 목소리에 순종하라
  lexicon: HALOT
  rationale: ‘듣다’와 ‘순종하다’의 긴장을 유지하기 위해 본문에는 청각적 의미를 살린 ‘들으라’를 두고, 순종의 뉘앙스는 해석으로 흡수하지 않았습니다.
theological_decisions:
- issue: שִׁמְעוּ בְּקוֹלִי의 언약적 순종 뉘앙스
  chosen_reading: ‘내 목소리를 들으라’로 유지하고, 순종 의미는 본문 밖에서 여지를 남김
  alternative_readings:
  - ‘내 목소리에 순종하라’
  - ‘내 말에 귀를 기울여 따르라’
  rationale: 본문의 문자적 구조는 ‘듣다’이므로, POB 원칙에 따라 순종 의미를 즉시 해소하지 않고 긴장을 보존했습니다. 이는 청취와 순종이 언약 안에서 겹칠 수 있다는 신학적 함의를 남깁니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
