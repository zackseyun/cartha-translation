revisions:
- from: 내가 너희 조상들을 이집트 땅에서 끌어올린 날부터 오늘에 이르기까지, 내가 그들에게 엄숙히 경고하며, 부지런히 경고하여 말하기를 ‘내 목소리를 들으라’ 하였으니[a]
  to: 내가 너희 조상들을 이집트 땅에서 이끌어 올린 날부터 오늘에 이르기까지 그들에게 엄중히 경고하였고, 일찍 일어나 경고하며 말하였다. ‘내 목소리를 들으라.’[a]
  rationale: ‘일찍 일어나 경고하며’로 הַשְׁכֵּם וְהָעֵד의 반복적이고 부지런한 경고라는 히브리어 관용을 보존했습니다. ‘엄중히 경고하였고’는 הָעֵד הַעִדֹתִי의 강조된 경고를 자연스럽게 반영합니다. 본문은 ‘들으라’를 유지하고, 순종의 함의는 각주에 남겨 원문의 의미 범위를 보존했습니다.
