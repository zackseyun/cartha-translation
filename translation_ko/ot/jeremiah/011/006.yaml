id: JER.11.6
reference: Jeremiah 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֨א אֶת כָּל הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֥וֹת יְרוּשָׁלִַ֖ם לֵ/אמֹ֑ר שִׁמְע֗וּ אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/006.yaml
  text: 'And Yahweh said to me[a], “Proclaim all these words in the cities of Judah and in the streets of Jerusalem[b], saying: Hear the words of this covenant and do them.”'
  footnotes:
  - marker: a
    text: Or 'in the squares of Jerusalem'; the Hebrew refers to public open places within the city.
    reason: lexical_alternative
  - marker: b
    text: '''Hear'' could also be rendered ''listen to.'' Some translations interpret it as ''obey,'' but the next clause already states the call to action explicitly: ''and do them.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. “유다의 성읍들과 예루살렘의 거리들[a]에서 이 모든 말씀을 선포하십시오. 이렇게 말하십시오. ‘이 언약의 말씀을 들으십시오[b]. 그리고 그 말씀을 행하십시오.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거리들’은 도시 안의 거리나 광장과 같은 공적 야외 공간을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들으십시오’는 ‘귀 기울이십시오’로도 옮길 수 있습니다. 일부 번역은 이를 ‘순종하십시오’로 해석하지만, 이어지는 ‘행하십시오’가 실천의 요청을 따로 분명히 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 도니언스/POB 용례
  rationale: POB의 원칙대로 여호와 대신 고유명 야훼를 써서 언약의 이름을 보존했습니다.
- source_word: קְרָא
  english_pob_choice: Proclaim
  chosen_korean: 선포하다
  alternatives_korean:
  - 외치다
  - 알리다
  - 선언하다
  lexicon: HALOT
  rationale: 공적인 장소에서 여러 사람에게 전달하는 명령이므로, 자연스럽고 공개적 선언의 힘을 살리는 ‘선포하다’가 적절합니다.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  english_pob_choice: in the cities of Judah ... in the streets of Jerusalem
  chosen_korean: 유다의 모든 성읍과 예루살렘의 거리들
  alternatives_korean:
  - 유다의 성읍들 ... 예루살렘의 광장들
  - 유다 전역의 마을들 ... 예루살렘의 열린 장소들
  lexicon: HALOT
  rationale: בְּעָרִים는 ‘성읍들’이 가장 직접적이고, חֻצוֹת는 도시의 공적 외부 공간을 가리키므로 문맥상 ‘거리들’로 옮겼습니다.
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으라
  alternatives_korean:
  - 귀를 기울이라
  - 들어 순종하라
  lexicon: HALOT
  rationale: 여기서는 듣는 행위와 행하는 행위를 구분하므로, 첫 동사는 ‘들으라’로 두고 순종의 의미를 뒤의 ‘행하여라’로 보존했습니다.
- source_word: וַעֲשִׂיתֶם אוֹתָם
  english_pob_choice: and do them
  chosen_korean: 그것들을 행하여라
  alternatives_korean:
  - 그것들을 지켜 행하여라
  - 그것들을 실행하여라
  lexicon: HALOT
  rationale: עשה는 여기서 언약의 말씀을 실제로 실천하라는 뜻이므로, 짧고 직설적인 ‘행하다’가 원문의 구체성을 잘 살립니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 본문은 언약의 이름이 직접 제시되는 자리이므로, 전통적 대체 호칭보다 고유한 신명 표기를 유지하는 것이 원문 의도를 더 분명히 드러냅니다.
  doctrine_reference: POB contested terms — YHWH → Yahweh
- issue: שִׁמְעוּ와 וַעֲשִׂיתֶם의 관계
  chosen_reading: “들으라. 그리고 그것들을 행하여라.”
  alternative_readings:
  - “순종하라. 그리고 그것들을 행하여라.”
  - “들어라. 곧 그것들을 행하여라.”
  rationale: 히브리어는 ‘듣다’와 ‘행하다’를 분리해 수사적으로 배열합니다. 첫 동사를 ‘순종하다’로 번역하면 두 번째 명령과의 구분이 약해지므로, 원문 구조를 유지했습니다.
  doctrine_reference: 'Translation philosophy #1, #3'
