revisions:
- from: 야훼께서 제게 말씀하셨습니다. “유다의 모든 성읍과 예루살렘의 거리들에서 이 모든 말을 선포하여라. 곧 이 언약의 말씀을 들으라. 그리고 그것들을 행하여라.”[a][b]
  to: 야훼께서 제게 말씀하셨습니다. “유다의 성읍들과 예루살렘의 거리들[a]에서 이 모든 말씀을 선포하십시오. 이렇게 말하십시오. ‘이 언약의 말씀을 들으십시오[b]. 그리고 그 말씀을 행하십시오.’”
  rationale: 수식 범위를 바로잡아 ‘이 모든 말씀’이 히브리어 כָּל הַדְּבָרִים הָאֵלֶּה를 충실히 반영하게 했습니다. 예레미야에게 주어진 선포 명령과 선포 내용 안에서 청중에게 주어진 명령의 구조를 유지하되, 전체를 현대 표준어 합쇼체로 통일했습니다. לֵאמֹר의 인용 도입 기능은 ‘이렇게 말하십시오’와 내부 인용으로 명확히 드러냈습니다.
  reviewer_model: gpt-5.6-terra
