  source_fidelity: 수정이 필요합니다. 히브리어의 כָּל(‘모든’)은 ‘유다의 성읍’이 아니라 ‘이 모든 말씀’을 수식합니다. 따라서 ‘유다의 모든 성읍’은 원문의 수식 범위를 바꿉니다. 또한 קְרָא는 예레미야에게 주는 단수 명령이고, 뒤의 ‘들으라/행하라’는 청중을 향한 복수 명령이므로 한국어 문장에서도 이를 자연스럽게 구별하는 편이 좋습니다.
  naturalness: 초안의 ‘선포하여라/들으라/행하여라’는 요청된 현대 표준어 합쇼체와 맞지 않습니다. ‘선포하십시오/들으십시오/행하십시오’가 현대의 공식적 문체에 적합합니다. ‘그것들을’은 ‘말씀’을 받는 대명사로 가능하나, ‘그 말씀을’이 더 자연스럽고 지시 대상도 분명합니다.
  terminology: ‘야훼’, ‘언약’, ‘성읍’, ‘선포’는 원문 및 POB 방침에 부합합니다. חֻצוֹת의 ‘거리들’은 가능한 번역이며, 공적 야외 공간이라는 대안적 뉘앙스는 각주에서 적절히 처리할 수 있습니다. 기존 b 각주의 ‘כאן’은 한국어 문장 안의 오류이므로 ‘여기서’로 고쳐야 합니다.
