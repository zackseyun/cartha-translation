source:
  edition: WLC
  text: כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָ֑ה וּ/מִסְפַּ֞ר חֻצ֣וֹת יְרוּשָׁלִַ֗ם שַׂמְתֶּ֤ם מִזְבְּחוֹת֙ לַ/בֹּ֔שֶׁת מִזְבְּח֖וֹת לְ/קַטֵּ֥ר לַ/בָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/013.yaml
  text: For your gods[a], O Judah, have become as numerous as your cities; and as numerous as the streets of Jerusalem, you have set up altars to Shame[b], altars to make offerings to Baal.
  footnotes:
  - marker: a
    text: Hebrew 'to Shame,' a contemptuous substitute for a pagan deity, likely referring to Baal.
    reason: lexical_alternative
  - marker: b
    text: Or 'to burn incense to Baal.' The Hebrew verb often refers specifically to making a smoke offering.
    reason: lexical_alternative
translation:
  language: ko
  text: “유다야, 너희 신들의 수는 너희 성읍들의 수만큼 많아졌습니다. 예루살렘의 거리 수만큼이나 너희는 ‘수치’에게 제단들을 세웠으니, 곧 바알에게 분향하려고 세운 제단들입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘수치’는 이교 신의 이름을 경멸하여 바꾸어 부른 표현이며, 문맥상 바알을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘향을 피우다’, 또는 연기를 올리는 제의를 행한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: HALOT
  rationale: 앞 문맥의 이유를 밝히는 קשר이므로, 현대 한국어에서 자연스러운 설명형 ‘이는 … 때문입니다’를 택했습니다.
- source_word: עָרֶיךָ / חֻצוֹת
  english_pob_choice: your cities / the streets
  chosen_korean: 너희의 도시들 / 예루살렘의 거리들
  alternatives_korean:
  - 너희의 성읍들 / 예루살렘의 길거리들
  - 너희의 도시들 / 예루살렘의 공공장소들
  lexicon: HALOT
  rationale: עִיר는 여기서 ‘도시들’이 현대 독자에게 가장 분명하고, חֻצוֹת는 도시의 통행로를 가리키므로 ‘거리들’이 무난합니다.
- source_word: לַבֹּשֶׁת
  english_pob_choice: to Shame
  chosen_korean: 부끄러움에게
  alternatives_korean:
  - 수치에게
  - 부끄러운 것에게
  lexicon: HALOT
  rationale: 히브리어의 조롱성 대체칭을 그대로 살리기 위해 ‘부끄러움’으로 옮겼고, 본문에서는 신적 대상처럼 받는 대격/전치 구조를 반영했습니다.
- source_word: לְקַטֵּר
  english_pob_choice: to make offerings
  chosen_korean: 제물 드리려고
  alternatives_korean:
  - 향을 피우려고
  - 분향하려고
  lexicon: HALOT
  rationale: 동사 자체는 연기 제사를 뜻하지만, 원문에서 목적물이 생략되어 있어 특정한 ‘분향’으로 좁히기보다 제의 행위를 포괄하는 ‘제물 드리려고’로 처리했습니다.
- source_word: בָּעַל
  english_pob_choice: Baal
  chosen_korean: 바알
  alternatives_korean:
  - 바알 신
  - 바알에게
  lexicon: HALOT
  rationale: 고유명사는 한국어 성서 관용형 ‘바알’을 유지해 독자가 즉시 우상 숭배 대상임을 알아보게 했습니다.
theological_decisions:
- issue: לַבֹּשֶׁת의 번역과 바알 암시 유지
  chosen_reading: 본문에는 조롱적 대체명칭인 ‘부끄러움’을 두고, 해석을 바알로 곧장 치환하지 않았습니다.
  alternative_readings:
  - 본문을 곧바로 ‘바알’로 옮김
  - ‘수치스러운 것’으로 완곡하게 처리
  rationale: 예언자적 폄하의 어조를 보존해야 하므로, 본문 표면은 ‘부끄러움’으로 유지하고 바알과의 관련성은 원문 수준에서 드러나게 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 예루살렘/유다를 향한 2인칭 단수·복수 혼용
  chosen_reading: ‘유다야’로 직접 호격을 살리고, 뒤의 ‘너희는’으로 공동체 전체를 향한 복수 대상을 유지했습니다.
  alternative_readings:
  - 전부 단수로 매끈하게 정리
  - 혼용을 드러내지 않고 평탄화
  rationale: 히브리어의 수적 전환을 매끈하게 지워버리면 원문의 수사적 긴장이 사라지므로, 공동체를 향한 직접 책망의 구조를 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
