revisions:
- from: “이는 너희의 신들이, 유다야, 너희의 도시들만큼이나 많아졌기 때문입니다. 그리고 예루살렘의 거리들만큼이나 많아졌으므로, 너희는 부끄러움에게 제단들을 세웠고, 바알에게 제물 드리려고 제단들을 세웠습니다.”[a][b]
  to: “유다야, 너희 신들의 수는 너희 성읍들의 수만큼 많아졌습니다. 예루살렘의 거리 수만큼이나 너희는 ‘수치’에게 제단들을 세웠으니, 곧 바알에게 분향하려고 세운 제단들입니다.”[a][b]
  rationale: 두 수량 표현을 각각 ‘신들의 수’와 ‘제단들의 수’에 연결하여 히브리어의 병렬 구조를 복원했습니다. ‘수치’는 본문에서 보존하되 인용부호와 각주로 조롱성 대체 명칭임을 밝혔습니다. 마지막의 반복된 ‘제단들’은 바알에게 분향하기 위한 제단이라는 동격 설명으로 옮겨, 원문의 반복과 관계를 보존하면서 한국어 문장을 자연스럽게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:26Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 유다를 단수 호격으로 부르고 뒤에서 복수 청자를 사용하는 원문의 전환을 대체로 보존합니다. 그러나 두 번째 수량 비교를 ‘많아졌으므로’라는 인과절로 처리하여, 예루살렘 거리의 수와 제단의 수가 대응한다는 원문의 병렬 구문을 인과관계로 바꾸었습니다. 또한 לְקַטֵּר는 문맥상 ‘분향하다/향을 피우다’로 옮기는 것이 가장 직접적입니다.
  naturalness: ‘부끄러움에게’는 일반 명사를 신격처럼 쓰는 표현으로 한국어에서 다소 부자연스럽습니다. 조롱성 명칭임을 드러내는 인용부호와 ‘수치’라는 명사를 사용하고, 두 번째 ‘제단들’을 앞의 제단들을 설명하는 동격으로 재구성하면 현대의 격식 있는 한국어로 더 자연스럽습니다.
  terminology: ‘바알’과 ‘제단’은 적절합니다. בֹּשֶׁת는 바알이라는 이름을 직접 쓰지 않는 조롱성 대체 표현이므로 본문에서는 ‘수치’로 보존하고 각주에서 가능한 지시 대상을 설명합니다. לְקַטֵּר는 ‘분향하려고’로 번역합니다.
  issues:
