    rationale: וּמִסְפַּר חֻצוֹת יְרוּשָׁלִַם은 ‘예루살렘의 거리 수만큼’이라는 비교·수량 표현이며, 뒤의 ‘너희는 제단들을 세웠다’를 수식합니다. 제단들이 많아진 것이 앞 문장의 결과라는 뜻이 아닙니다.
  - severity: medium
