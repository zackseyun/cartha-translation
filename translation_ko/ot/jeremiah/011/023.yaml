id: JER.11.23
reference: Jeremiah 11:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁאֵרִ֕ית לֹ֥א תִֽהְיֶ֖ה לָ/הֶ֑ם כִּֽי אָבִ֥יא רָעָ֛ה אֶל אַנְשֵׁ֥י עֲנָת֖וֹת שְׁנַ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/023.yaml
  text: And no remnant will remain for them[a], for I will bring disaster on the men of Anathoth in the year of their punishment.
  footnotes:
  - marker: a
    text: Or 'in the year of their visitation.' The Hebrew term can mean 'visitation' in a neutral sense, but here it refers to punitive visitation, hence 'punishment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들에게는 남은 자가 없을 것입니다. 내가 아나돗의 남자들에게 그들의 벌 받는 해에 재앙을 가져올 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 방문의 해에’로 옮길 수 있습니다. 히브리어는 중립적 의미의 ‘방문’을 뜻할 수 있지만, 여기서는 징벌적 방문을 가리키므로 ‘벌’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאֵרִית
  english_pob_choice: And no remnant will remain
  chosen_korean: 남은 자가 없을 것입니다
  alternatives_korean:
  - 그들에게는 남은 자가 없을 것입니다
  - 그들에게 남아 있을 자가 없을 것입니다
  lexicon: HALOT
  rationale: שְׁאֵרִית는 남아 있는 자/남은 몫을 가리키므로, 한국어에서도 ‘남은 자’로 핵심 이미지를 살렸습니다.
- source_word: לֹא תִהְיֶה לָהֶם
  english_pob_choice: will remain for them
  chosen_korean: 없을 것입니다
  alternatives_korean:
  - 남아 있을 것입니다
  - 그들에게 있을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘그들에게 있지 않을 것이다’는 자연스러운 한국어로 ‘없을 것입니다’로 옮기되, 앞의 ‘남은 자’와 결합해 의미를 보완했습니다.
- source_word: אֶל אַנְשֵׁי עֲנָתוֹת
  english_pob_choice: on the men of Anathoth
  chosen_korean: 아나돗의 남자들에게
  alternatives_korean:
  - 아나돗의 사람들에게
  - 아나돗의 주민들에게
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문자적으로 ‘남자들’이므로, 본문의 성별 표지를 유지해 ‘남자들’로 번역했습니다.
- source_word: שְׁנַת פְּקֻדָּתָם
  english_pob_choice: in the year of their punishment
  chosen_korean: 그들의 벌 받는 해에
  alternatives_korean:
  - 그들의 심판의 해에
  - 그들이 벌받는 해에
  lexicon: HALOT
  rationale: פְּקֻדָּה는 문맥상 징계/벌의 뜻이 분명하므로 ‘벌 받는 해’로 옮겨, ‘방문’의 중립적 의미를 오해하지 않게 했습니다.
theological_decisions:
- issue: רָעָה의 의미와 하나님이 주체일 때의 번역
  chosen_reading: ‘재앙’으로 번역했습니다.
  alternative_readings:
  - 악
  - 재난
  rationale: 문맥은 아나돗에 대한 심판 선언이므로, 하나님을 도덕적 악의 행위자로 읽히게 하는 ‘악’ 대신 해로운 재앙을 뜻하는 ‘재앙’을 택했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥이 요구하는 범위에서만 어휘를 결정합니다.
