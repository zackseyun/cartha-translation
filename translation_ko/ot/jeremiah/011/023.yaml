revisions:
- from: 그리고 그들에게는 남은 자가 없을 것입니다. 내가 아나돗의 남자들에게 그들의 벌 받는 해에 재앙을 가져올 것이기 때문입니다.[a]
  to: 그들에게는 남은 자가 없을 것입니다. 내가 아나돗의 남자들에게 그들이 징벌받는 해에 재앙을 내릴 것이기 때문입니다.[a]
  rationale: 수정은 어색한 ‘벌 받는 해’를 자연스러운 수동 표현인 ‘그들이 징벌받는 해’로 바로잡아 원문의 פְּקֻדָּה와 소유 접미사의 의미를 명료하게 합니다. 아나돗의 남성 복수 표지와 재앙이라는 심판 문맥은 유지했습니다. 각주는 ‘방문’이라는 부자연스러운 직역 대신, 어휘의 폭을 보존하면서도 문맥에 맞는 ‘찾아오심’으로 조정했습니다.
  reviewer_model: gpt-5.6-terra
