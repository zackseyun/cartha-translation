  source_fidelity: 원문의 ‘남은 자/남은 것’이 없다는 선언, 아나돗의 남자들, 그들에게 닥칠 재앙, 그리고 징벌의 시간이라는 요소는 초안에 대체로 반영되었습니다. 그러나 שְׁנַת פְּקֻדָּתָם은 ‘그들의 벌 받는 해’보다 ‘그들이 징벌받는 해’로 옮기는 편이 원문의 소유 관계와 수동적 징벌 의미를 더 정확히 드러냅니다.
  naturalness: ‘그들의 벌 받는 해’는 현대 표준 한국어에서 다소 비문적이고 어색합니다. ‘그들이 징벌받는 해’는 자연스럽고 합쇼체 문맥에도 적절합니다. 또한 각주에서 ‘방문’은 한국어에서 이 문맥의 פקדה를 충분히 전달하지 못하므로 ‘그들을 찾아오시는 해’와 설명을 사용하는 편이 낫습니다.
  terminology: ‘남은 자’, ‘아나돗의 남자들’, ‘재앙’은 적절합니다. פְּקֻדָּה의 문맥상 의미는 ‘징벌’로 유지하되, 각주에서는 어근의 더 넓은 ‘찾아오심/살피심’ 범위를 설명하여 대안을 보존합니다.
