source:
  edition: WLC
  text: וַ/אֲנִ֕י כְּ/כֶ֥בֶשׂ אַלּ֖וּף יוּבַ֣ל לִ/טְב֑וֹחַ וְ/לֹֽא יָדַ֜עְתִּי כִּֽי עָלַ֣/י חָשְׁב֣וּ מַחֲשָׁב֗וֹת נַשְׁחִ֨יתָה עֵ֤ץ בְּ/לַחְמ/וֹ֙ וְ/נִכְרְתֶ֨/נּוּ֙ מֵ/אֶ֣רֶץ חַיִּ֔ים וּ/שְׁמ֖/וֹ לֹֽא יִזָּכֵ֥ר עֽוֹד־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/019.yaml
  text: 'But I was like a gentle lamb led to the slaughter[a], and I did not know that they had devised plans against me: ‘Let us destroy the tree with its food, and let us cut him off from the land of the living[b], so that his name will be remembered no more.’'
  footnotes:
  - marker: a
    text: Or 'like a tame lamb' or 'like a lamb familiar with humans'; the Hebrew adjective is difficult.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew obscure: ''Let us destroy the tree with its bread/food.'' Many understand the sense as total destruction of the tree together with its produce.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 도살장으로 끌려가는 온순한 어린 양 같았고, 그들이 나를 해칠 계획을 꾸미고 있는 줄도 몰랐습니다. ‘나무와 그 먹을 것을 멸하자. 그를 살아 있는 자들의 땅에서 끊어 버리자. 그러면 그의 이름이 다시는 기억되지 않을 것이다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַלּוּף는 이곳에서 의미가 분명하지 않아, ‘온순한’, ‘길들여진’, ‘사람에게 익숙한’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘나무와 그 먹을 것’은 난해합니다. 많은 해석은 나무와 그 열매/산출물을 가리키는 것으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶבֶשׂ אַלּוּף
  english_pob_choice: like a gentle lamb
  chosen_korean: 온순한 어린 양 같았고
  alternatives_korean:
  - 길들여진 어린 양 같았고
  - 사람에게 익숙한 어린 양 같았고
  - 순한 어린 양 같았고
  lexicon: HALOT
  rationale: 알루프는 이 문맥에서 ‘우두머리’가 아니라 길들여지거나 사람에게 익숙한 양의 상태를 가리키는 난해한 형용사이므로, 위험을 의식하지 못한 무구함을 드러내는 ‘온순한’으로 옮겼습니다.
- source_word: יוּבַל לִטְבוֹחַ
  english_pob_choice: led to the slaughter
  chosen_korean: 도살장으로 끌려가는
  alternatives_korean:
  - 도살로 이끌려 가는
  - 잡혀 도살되러 가는
  - 도살되도록 끌려가는
  lexicon: HALOT
  rationale: יובל의 수동적 흐름과 טבח의 도살 이미지를 자연스럽게 살리기 위해, 한국어로는 ‘도살장으로 끌려가는’이라고 옮겨 살육의 직접성을 보존했습니다.
- source_word: חָשְׁבוּ מַחֲשָׁבוֹת
  english_pob_choice: they had devised plans
  chosen_korean: 해칠 계획을 꾸미고 있는
  alternatives_korean:
  - 계략을 꾸미고 있는
  - 생각들을 생각하고 있는
  - 음모를 꾸민
  lexicon: HALOT
  rationale: 동사-명사 어근 반복이 의도적 음모를 강조하므로, 한국어에서는 다소 중복을 피하면서도 적대적 의도를 분명히 드러내는 ‘해칠 계획을 꾸미다’로 옮겼습니다.
- source_word: עֵץ בְּלַחְמוֹ
  english_pob_choice: the tree with its food
  chosen_korean: 나무와 그 먹을 것을
  alternatives_korean:
  - 나무와 그 빵을
  - 나무와 그 열매를
  - 나무와 그 양식을
  lexicon: HALOT
  rationale: לֶחֶם의 기본 의미가 ‘빵/음식’이므로, 본문 자체의 난해함을 살리면서도 의미를 넓히지 않도록 ‘먹을 것’으로 옮겼습니다. ‘열매’는 해석을 더 강하게 반영하므로 본문에는 두지 않았습니다.
- source_word: וְנִכְרְתֶנּוּ
  english_pob_choice: and let us cut him off
  chosen_korean: 그를 ... 끊어 버리자
  alternatives_korean:
  - 그를 ... 잘라 버리자
  - 그를 ... 없애 버리자
  - 그를 ... 끊어 내자
  lexicon: HALOT
  rationale: כרת의 ‘끊다/베다’ 의미를 유지하되, 뒤의 ‘생명 있는 자들의 땅’과 ‘그의 이름’과 자연스럽게 연결되도록 한국어에서는 존재 자체의 단절을 나타내는 ‘끊어 버리자’로 옮겼습니다.
theological_decisions:
- issue: 화자의 자기 이해와 고난의 직설성
  chosen_reading: 예레미야 자신이 실제 암살 음모의 희생자처럼 묘사되므로, 본문을 상징화하거나 메시아적 예표로 본문 안에서 풀어내지 않았습니다.
  alternative_readings:
  - 메시아의 수난에 대한 주된 예표로 읽기
  rationale: 문맥상 핵심은 예레미야가 당한 살해 음모의 고발이므로, 번역은 본문이 말하는 직접적 역사 상황을 우선 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
