id: JER.11.10
reference: Jeremiah 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/010.yaml
  text: They have returned to the iniquities of their first fathers[a], who refused to hear my words, and they themselves have gone after other gods to serve them[c][b]. The house of Israel and the house of Judah have broken my covenant that I made with their fathers.
  footnotes:
  - marker: a
    text: Or 'their former fathers' or 'their forefathers.' The Hebrew literally says 'their first fathers,' referring to earlier generations.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to hear my words'; in context this can also carry the sense 'to listen/obey.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'cut' my covenant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 말을 듣기를 거절했던 그들의 옛 조상들의 죄악으로 되돌아갔습니다[a][b]. 그들 자신은 다른 신들을 따라가 그들을 섬겼습니다. 이스라엘 집과 유다 집은 내가 그들의 조상들과 맺은 내 언약을 깨뜨렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 처음/앞선 조상들’입니다. 여기서는 이전 세대의 조상들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 말을 듣다’는 문맥상 듣고 따르거나 순종한다는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘언약을 자르다’라고 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ עַל עֲוֺנֹת
  english_pob_choice: have returned to the iniquities
  chosen_korean: 죄악으로 돌아갔습니다
  alternatives_korean:
  - 죄악들로 되돌아갔습니다
  - 죄악 위로 돌아갔습니다
  - 죄에 돌아갔습니다
  lexicon: HALOT
  rationale: שׁוּב + עַל의 회귀 의미를 자연스럽게 살리되, עָוֹן의 무게를 '죄악'으로 반영했습니다.
- source_word: אֲבוֹתָם הָרִאשֹׁנִים
  english_pob_choice: their first fathers
  chosen_korean: 자기들의 첫 조상들
  alternatives_korean:
  - 그들의 옛 조상들
  - 그들의 선조들
  - 그들의 처음 조상들
  lexicon: HALOT
  rationale: 직역 성격을 유지하면서도 한국어에서 이해 가능한 표현으로 옮겨, 앞선 세대의 반복된 불순종을 드러냈습니다.
- source_word: מֵאֲנוּ לִשְׁמֹעַ אֶת דְּבָרַי
  english_pob_choice: refused to hear my words
  chosen_korean: 내 말을 들으려 하지 않았고
  alternatives_korean:
  - 내 말을 듣기를 거부했고
  - 내 말을 듣지 않았고
  - 내 말에 순종하기를 거부했고
  lexicon: HALOT
  rationale: שׁמע의 '듣다'와 문맥상의 응답/순종 뉘앙스를 함께 살리기 위해 '들으려 하지 않았다'로 옮겼습니다.
- source_word: הָלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים לְעָבְדָם
  english_pob_choice: have gone after other gods to serve them
  chosen_korean: 다른 신들을 따라가 그들을 섬겼습니다
  alternatives_korean:
  - 다른 신들을 따라 그들을 섬겼습니다
  - 다른 신들을 좇아 섬겼습니다
  - 다른 신들을 따라가 그들에게 예배했습니다
  lexicon: HALOT
  rationale: '''따라가다''로 הלך אחרי의 추종 의미를 살리고, עבד는 우상 숭배의 넓은 뜻을 포함하는 ''섬기다''로 유지했습니다.'
- source_word: הֵפֵרוּ בֵית יִשְׂרָאֵל וּבֵית יְהוּדָה
  english_pob_choice: The house of Israel and the house of Judah have broken
  chosen_korean: 이스라엘의 집과 유다의 집은 깨뜨렸습니다
  alternatives_korean:
  - 이스라엘 집과 유다 집은 깨뜨렸습니다
  - 이스라엘과 유다는 깨뜨렸습니다
  - 이스라엘의 집과 유다의 집은 어겼습니다
  lexicon: HALOT
  rationale: '''집''이라는 언약적 표지를 보존했고, ברית를 ''깨뜨리다''와 짝지어 계약 파기를 직접적으로 드러냈습니다.'
- source_word: בְּרִיתִי אֲשֶׁר כָּרַתִּי
  english_pob_choice: my covenant that I made
  chosen_korean: 내 언약을 … 맺은
  alternatives_korean:
  - 내 언약을 … 만든
  - 내 언약을 … 세운
  - 내 언약을 … 끊은
  lexicon: HALOT
  rationale: כרת의 문자적 '자르다'를 본문에서는 한국어 관용에 따라 '맺다'로 옮기되, 언약 행위의 엄중함을 유지했습니다.
theological_decisions:
- issue: '"첫 조상들"과 언약 파기의 세대 연속성'
  chosen_reading: 현재 세대가 단지 과거를 언급하는 것이 아니라, 앞선 조상들의 죄악을 되풀이하며 그들과 맺은 언약까지 깨뜨렸다는 구조를 살렸습니다.
  alternative_readings:
  - 단순히 역사적 선조 언급으로만 처리하는 읽기
  - 조상과 현재 세대의 연결을 약화시키는 읽기
  rationale: 본문은 이전 세대의 반역과 현재 세대의 불순종을 한 흐름으로 묶고 있으므로, 그 연속성을 한국어에서도 분명히 보여 주어야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 에미틱한 강조 표현 '그들 자신도'
  chosen_reading: וְהֵמָּה의 강조를 살려 '그들 자신도'로 옮겼습니다.
  alternative_readings:
  - 단순히 '그들도'로 완화하는 읽기
  - 강조를 제거하는 읽기
  rationale: 독립 대명사가 주는 강조를 없애면, 다른 신들을 적극적으로 좇은 책임감이 약화되므로 이를 보존했습니다.
  doctrine_reference: Hebrew discourse emphasis
