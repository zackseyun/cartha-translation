revisions:
- from: 그들은 자기들의 첫 조상들의 죄악으로 돌아갔습니다[a]. 그들은 내 말을 들으려 하지 않았고[b], 그들 자신도 다른 신들을 따라가 그들을 섬겼습니다. 이스라엘의 집과 유다의 집은 내가 그들의 조상들과 맺은 내 언약을 깨뜨렸습니다[c].
  to: 그들은 내 말을 듣기를 거절했던 그들의 옛 조상들의 죄악으로 되돌아갔습니다[a][b]. 그들 자신은 다른 신들을 따라가 그들을 섬겼습니다. 이스라엘 집과 유다 집은 내가 그들의 조상들과 맺은 내 언약을 깨뜨렸습니다[c].
  rationale: 관계절의 선행사를 바로잡아 조상들이 하나님의 말씀 듣기를 거절했고, 현재 세대가 그 조상들의 죄악으로 되돌아갔다는 원문의 구문을 회복했습니다. ‘옛 조상들’은 원문의 앞선 세대라는 의미를 자연스럽게 전달하며, ‘그들 자신은’은 독립대명사의 강조를 보존합니다. 각 주석 표지는 해당 어휘 또는 관용구에 맞게 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:31Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 מֵאֲנוּ(‘거절했던’)의 주어가 ‘그들의 옛 조상들’임을 문장 구조상 현재 세대인 ‘그들’에게 잘못 연결했습니다. 히브리어에서는 ‘내 말을 듣기를 거절했던 그들의 옛 조상들’이 관계절의 선행사입니다. 또한 הָרִאשֹׁנִים은 한국어 ‘첫 조상들’보다 ‘옛 조상들’이 앞선 세대를 가리키는 뜻을 더 자연스럽고 정확하게 전달합니다.
  naturalness: ‘자기들의 첫 조상들’은 현대 표준 한국어에서 부자연스럽고 ‘인류 최초의 조상’처럼 들릴 수 있습니다. ‘그들의 옛 조상들’ 및 ‘듣기를 거절했던’이 자연스러운 합쇼체 문맥을 이룹니다. וְהֵמָּה의 강조는 ‘그들 자신은’으로 보존하되, 한국어의 첨가적 의미가 강한 ‘도’는 피했습니다.
  terminology: ‘죄악’, ‘다른 신들’, ‘섬기다’, ‘이스라엘 집과 유다 집’, ‘언약’, ‘맺다’, ‘깨뜨리다’는 원문의 어휘와 언약 문맥을 적절히 보존합니다. ‘이스라엘 집과 유다 집’은 반복된 בֵּית를 유지합니다.
  issues:
  - severity: high
    issue: ‘내 말을 들으려 하지 않았고’의 주어가 현재 세대 ‘그들’로 처리되었습니다.
    rationale: 히브리어 אֲשֶׁר מֵאֲנוּ는 ‘그들의 옛 조상들’을 수식하는 관계절입니다. 현재 세대가 조상들의 죄악으로 돌아가고 다른 신들을 따른다는 구조를 유지해야 합니다.
  - severity: medium
    issue: ‘첫 조상들’은 הָרִאשֹׁנִים의 문맥적 뜻을 한국어에서 부정확하고 어색하게 전달합니다.
    rationale: 여기서 표현은 앞선/옛 세대의 조상들을 뜻하며, ‘첫 조상들’은 시간적으로 최초의 조상이라는 의미로 오해될 수 있습니다.
  - severity: low
    issue: ‘그들 자신도’의 ‘도’는 원문에 없는 첨가·병렬의 뉘앙스를 낼 수 있습니다.
    rationale: 독립대명사 וְהֵמָּה의 강조와 앞선 조상들과의 대비는 ‘그들 자신은’으로 더 직접적으로 드러납니다.
