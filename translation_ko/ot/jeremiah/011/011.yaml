id: JER.11.11
reference: Jeremiah 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֤יא אֲלֵי/הֶם֙ רָעָ֔ה אֲשֶׁ֥ר לֹֽא יוּכְל֖וּ לָ/צֵ֣את מִמֶּ֑/נָּה וְ/זָעֲק֣וּ אֵלַ֔/י וְ/לֹ֥א אֶשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/011.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am bringing on them a disaster from which they will not be able to escape; and they will cry out to me, but I will not listen to them.'
  footnotes:
  - marker: a
    text: Or 'calamity'; Hebrew רָעָה here refers to destructive judgment, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이처럼 말씀하십니다. 「보십시오, 내가 그들에게 재앙을 가져오는데, 그들은 그것을 피할 수 없을 것입니다. 그들이 내게 부르짖어도 나는 그들의 말을 듣지 않겠습니다。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’은 여기서 도덕적 ‘악’이 아니라 파괴적 심판을 뜻하는 רָעָה의 의미를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 고발과 심판 선언의 결과를 나타내는 연결어이므로, 현대 한국어에서 문맥적·논리적 인과를 자연스럽게 살리는 ‘그러므로’가 적절합니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 이처럼 말씀하십니다
  alternatives_korean:
  - 야훼께서 이렇게 말씀하십니다
  - 야훼의 말씀이 이러합니다
  lexicon: HALOT
  rationale: 예언자 공식의 격식을 유지하되 합쇼체로 자연스럽게 옮기기 위해 ‘이처럼 말씀하십니다’를 택했습니다. ‘말씀하십니다’는 하나님의 직접 발화를 공손한 보고체로 전달합니다.
- source_word: רָעָה
  english_pob_choice: a disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 화
  lexicon: HALOT
  rationale: 심판 문맥에서 רָעָה는 도덕적 ‘악’이 아니라 파괴적 징벌을 뜻하므로, 신학적 오해를 피하면서도 강한 심판성을 살리는 ‘재앙’이 적절합니다.
- source_word: לֹא יוּכְלוּ לָצֵאת מִמֶּנָּה
  english_pob_choice: from which they will not be able to escape
  chosen_korean: 그들은 그것을 피할 수 없을 것입니다
  alternatives_korean:
  - 그것에서 벗어날 수 없을 것입니다
  - 그것을 빠져나갈 수 없을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘그것에서 나갈 수 없다’는 뜻이지만, 한국어에서는 심판의 압박과 불가피성을 가장 자연스럽게 드러내는 ‘피할 수 없다’가 idiom을 잘 살립니다.
- source_word: וְזָעֲקוּ אֵלַי
  english_pob_choice: and they will cry out to me
  chosen_korean: 그들이 내게 부르짖어도
  alternatives_korean:
  - 그들이 내게 소리쳐도
  - 그들이 내게 외쳐도
  lexicon: HALOT
  rationale: זעק의 긴급한 도움 요청을 ‘부르짖다’로 옮겨 절박함을 유지했습니다. 앞뒤 대조를 살리기 위해 종속절 형태로 처리했습니다.
- source_word: וְלֹא אֶשְׁמַע אֲלֵיהֶם
  english_pob_choice: but I will not listen to them
  chosen_korean: 나는 그들의 말을 듣지 않겠습니다
  alternatives_korean:
  - 나는 그들에게 귀 기울이지 않겠습니다
  - 나는 그들을 듣지 않겠습니다
  lexicon: HALOT
  rationale: שמע는 단순 청취가 아니라 응답적 ‘들음’을 뜻하므로, 심판으로 인한 거절을 분명히 하는 ‘듣지 않겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 신명(יהוה)의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 히브리어 신명 יְהוָה를 보존하기 위해, 본문에는 ‘야훼’를 사용했습니다. 이는 단순 호칭이 아니라 언약적 고유명을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 심판어 רָעָה의 의미
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  rationale: 문맥상 하나님이 도덕적 악을 행하신다는 뜻이 아니라 심판으로서의 파괴적 재난을 선언하는 것이므로, 신학적 긴장을 해치지 않는 ‘재앙’을 선택했습니다.
  doctrine_reference: '원문 문맥: 예언자적 심판 선언'
