id: JER.11.20
reference: Jeremiah 11:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה צְבָאוֹת֙ שֹׁפֵ֣ט צֶ֔דֶק בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/020.yaml
  text: But you[a], O Yahweh of hosts, who judge righteously, who test the kidneys and the heart, let me see your vengeance on them[c][b], for to you I have revealed my case.
  footnotes:
  - marker: a
    text: Hebrew 'the kidneys and the heart,' a figure for the deepest thoughts and motives.
    reason: cultural_note
  - marker: b
    text: Or 'your avenging' or 'your vindication.'
    reason: lexical_alternative
  - marker: c
    text: Or 'my dispute' or 'my cause.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만군의 야훼여, 의롭게 심판하시며 콩팥과 마음을 살피시는 분이시여,[a] 제가 그들에게 행하시는 당신의 보복을 보게 하십시오.[b] 제가 제 송사를 당신께 밝혔기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘콩팥과 마음’은 가장 깊은 생각과 동기를 가리키는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘당신의 보복하심’ 또는 ‘당신의 신원하심’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제 분쟁’ 또는 ‘제 소송 사건’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  english_pob_choice: O Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: HALOT
  rationale: Tetragrammaton은 프로젝트 기본값대로 야훼로 옮기고, צְבָאוֹת은 하나님의 호칭인 ‘만군의’로 직역해 호칭 전체의 위엄과 투명성을 살렸습니다.
- source_word: שֹׁפֵ֣ט צֶ֔דֶק
  english_pob_choice: who judge righteously
  chosen_korean: 의롭게 심판하시고
  alternatives_korean:
  - 의로 심판하시는
  - 의로운 심판자이시고
  lexicon: HALOT
  rationale: 분사 구조의 지속적 성격을 살리되, 한국어에서는 서술적 관계절보다 존칭 동사형이 자연스러워 ‘의롭게 심판하시고’로 풀었습니다.
- source_word: בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵב
  english_pob_choice: who test the kidneys and the heart
  chosen_korean: 허리와 마음을 살피시는 분이여
  alternatives_korean:
  - 콩팥과 마음을 시험하시는 분이여
  - 내장과 마음을 살피시는 분이여
  lexicon: HALOT
  rationale: כְּלָיוֹת는 문자적으로 ‘콩팥/신장’이지만 한국어 성경 독자가 이해하기 어려우므로, 내면의 가장 깊은 동기라는 뜻을 드러내는 ‘허리’로 옮기되 원문 이미지의 생소함을 지나치게 완화하지 않았습니다.
- source_word: נִקְמָתְךָ
  english_pob_choice: your vengeance
  chosen_korean: 당신의 보복
  alternatives_korean:
  - 당신의 복수
  - 당신의 갚으심
  lexicon: HALOT
  rationale: נָקָם 계열은 단순한 감정적 복수보다 공의로운 응보의 뉘앙스가 있어, 본문 맥락에 맞게 ‘보복’으로 옮겼습니다.
- source_word: אֶת רִיבִי
  english_pob_choice: my case
  chosen_korean: 제 송사
  alternatives_korean:
  - 제 분쟁
  - 제 소송
  - 제 변론
  lexicon: HALOT
  rationale: רִיב은 법정적 ‘송사/분쟁’의 뜻을 가지므로, 예레미야가 자신의 억울함을 하나님께 맡기는 법정 언어를 살려 ‘송사’로 번역했습니다.
theological_decisions:
- issue: 하나님 호칭의 번역
  chosen_reading: 야훼를 본문에 사용해 직접 호칭의 긴장을 보존했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 예레미야의 직접 기도이므로, 고유명사적 호칭을 일반적인 ‘주’로 평준화하지 않고 프로젝트 기준에 따라 야훼로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: כְּלָיוֹת의 이미지 처리
  chosen_reading: ‘허리’로 옮기되 주석 없이도 내면을 가리키는 비유임을 한국어 독자가 짐작할 수 있게 했습니다.
  alternative_readings:
  - 콩팥과 마음
  - 내심과 마음
  rationale: 원문은 신체 기관을 통해 인간 내면을 드러내는 시적 표현이므로, 의미만 평평하게 만들지 않고 한국어 성경에서 통용 가능한 비유적 표현으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
