id: JER.11.3
reference: Jeremiah 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָר֣וּר הָ/אִ֔ישׁ אֲשֶׁר֙ לֹ֣א יִשְׁמַ֔ע אֶת דִּבְרֵ֖י הַ/בְּרִ֥ית הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/003.yaml
  text: 'And you shall say to them, ‘Thus says the LORD, the God of Israel: Cursed is the man who does not listen to the words of this covenant,’'
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. ‘야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 이 언약의 말씀들을 듣지 않는 사람은 저주를 받습니다.’[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘말씀을 듣지 않는’이며, 예언자 문맥에서는 말씀에 대한 거부와 불순종을 함께 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵי־הֶם
  english_pob_choice: And you shall say to them
  chosen_korean: 그들에게 이렇게 말하십시오
  alternatives_korean:
  - 그들에게 말해야 합니다
  - 그들에게 이렇게 말하시오
  lexicon: אָמַר
  rationale: 예언자에게 주어진 전달 명령을 현대 한국어 합쇼체 명령으로 자연스럽게 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the LORD, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 주님, 이스라엘의 하나님
  - 여호와, 이스라엘의 하나님
  lexicon: יהוה + אֱלֹהִים
  rationale: YHWH는 프로젝트 기본값에 따라 야훼로 옮기고, 동격 표현은 한국어에서 자연스럽게 쉼표로 연결했습니다.
- source_word: לֹא יִשְׁמַע אֶת דִּבְרֵי
  english_pob_choice: who does not listen to the words
  chosen_korean: 듣지 않는 사람은
  alternatives_korean:
  - 말씀을 순종하지 않는 사람은
  - 귀 기울이지 않는 사람은
  lexicon: שׁמע
  rationale: 영어 POB가 유지한 ‘listen’의 의미를 따라, כאן은 단순 청취가 아니라 언약의 말씀을 받아들이지 않는 태도를 드러내는 ‘듣지 않다’로 옮겼습니다.
- source_word: הַבְּרִית הַזֹּאת
  english_pob_choice: this covenant
  chosen_korean: 이 언약
  alternatives_korean:
  - 이 계약
  - 이 맹약
  lexicon: בְּרִית
  rationale: 예레미야서의 언약 문맥을 살려 표준적인 ‘언약’을 유지했습니다.
theological_decisions:
- issue: יָשַׁב/שׁמע 계열을 ‘obey’로 강하게 도덕화할지 여부
  chosen_reading: ‘듣지 않는’으로 두어 언약에 대한 불순종을 말하되, 문자적으로는 청취/수용의 거부를 드러냈습니다.
  alternative_readings:
  - ‘순종하지 않는’
  - ‘귀를 기울이지 않는’
  rationale: 본문의 동사는 ‘듣다’이지만, 예언자적 문맥에서 언약의 말씀을 거부하는 책임을 포함하므로 한국어는 직접적이되 과도하게 해석을 밀어붙이지 않는 표현을 택했습니다.
  doctrine_reference: 예언자적 언약 소송 문맥
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본값과 원문 대응성을 우선하여 본문에는 야훼를 사용했습니다.
  doctrine_reference: 사전 지정된 YHWH 표기 원칙
