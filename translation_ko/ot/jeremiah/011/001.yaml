  - 야훼의 말씀이 예레미야에게 이르렀다
  rationale: 본문은 단순한 정보 전달이 아니라 예언의 권위가 야훼께 있음을 선언하는 서문이므로, '임한 말씀'으로 하나님의 주도성과 출처를 함께 보존했습니다.
