lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 서문 공식에서 דָּבָר는 단순한 '말'보다 하나님이 전달하시는 권위 있는 '말씀'으로 읽는 것이 자연스럽고, 영어 POB의 'The word'와도 가장 가깝습니다.
- source_word: הָיָה אֶל
  english_pob_choice: came to
  chosen_korean: 임한
  alternatives_korean:
  - 왔던
  - 내려온
  lexicon: HALOT
  rationale: 예언자 수신 공식의 관용구를 한국어로는 '임하다'가 가장 압축적이며, 소식의 도착보다 하나님의 말씀의 도래라는 뉘앙스를 살립니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서
  alternatives_korean:
  - 야훼로부터
  - 여호와에게서
  lexicon: HALOT
  rationale: 하나님의 이름 יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮기며, מקור/출처를 나타내는 מֵאֵת는 한국어 조사 구조에서 '에게서'가 가장 자연스럽습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르시기를
  alternatives_korean:
  - 말하여
  - 말씀하시기를
  lexicon: HALOT
  rationale: 다음에 이어질 직접 인용을 여는 표지로서 '이르시기를'이 가장 문어적이고, 예언 본문의 화법 전환을 분명히 드러냅니다.
theological_decisions:
- issue: 예언 서문의 하나님의 말씀 출처 표지
  chosen_reading: 야훼에게서 예레미야에게 임한 말씀
  alternative_readings:
  - 야훼로부터 예레미야에게 온 말씀
  - 야훼의 말씀이 예레미야에게 이르렀다
  rationale: 본문은 단순한 정보 전달이 아니라 예언의 권위가 야훼께 있음을 선언하는 서문이므로, '임한 말씀'으로 하나님의 주도성과 출처를 함께 보존했습니다.
  doctrine_reference: 예언 말씀의 신적 기원과 계시 권위
