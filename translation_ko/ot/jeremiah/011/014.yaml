revisions:
- from: 그런데 너는 이 백성을 위해 기도하지 말고, 그들을 위하여 탄원이나 기도를 드리지 마십시오. 내가 그들이 재앙을 당하여 나에게 부르짖을 때는 듣지 않겠습니다.[a]
  to: 그러나 당신은 이 백성을 위하여 기도하지 말고, 그들을 위하여 부르짖거나 기도하지 마십시오. 그들이 재앙 때문에 내게 부르짖을 때에는 내가 듣지 않겠습니다.[a]
  rationale: 대조적인 직접 호칭을 ‘그러나 당신은’으로 살리면서 현대 표준 합쇼체를 일관되게 적용했습니다. רִנָּה와 תְּפִלָּה의 병렬은 ‘부르짖거나 기도하다’로 자연스럽고 구별되게 옮겼습니다. 마지막 절은 재앙이 부르짖음의 이유임을 명확히 했으며, 각주에서 רָעָה의 다른 가능한 의미를 보존했습니다.
