id: JER.11.14
reference: Jeremiah 11:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֗ה אַל תִּתְפַּלֵּל֙ בְּעַד הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַל תִּשָּׂ֥א בַעֲדָ֖/ם רִנָּ֣ה וּ/תְפִלָּ֑ה כִּ֣י אֵינֶ֣/נִּי שֹׁמֵ֗עַ בְּ/עֵ֛ת קָרְאָ֥/ם אֵלַ֖/י בְּעַ֥ד רָעָתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/014.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
  footnotes:
  - marker: a
    text: Or 'because of their calamity.' The Hebrew word can also mean 'evil' in other contexts, but here it refers to the disaster that has come upon them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 너는 이 백성을 위해 기도하지 말고, 그들을 위하여 탄원이나 기도를 드리지 마십시오. 내가 그들이 재앙을 당하여 나에게 부르짖을 때는 듣지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 רָעָה는 도덕적 ‘악’이 아니라 그들에게 닥친 ‘재앙/재난’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But as for you
  chosen_korean: 그런데 너는
  alternatives_korean:
  - 하지만 당신은
  - 그리고 너는
  lexicon: HALOT
  rationale: 강한 대조를 드러내는 두 번째인칭 강조를 자연스러운 한국어로 살리기 위해 앞의 전환어를 두었습니다.
- source_word: תִּתְפַּלֵּל / תִּשָּׂא
  english_pob_choice: do not pray / do not lift up
  chosen_korean: 기도하지 말고 / 탄원이나 기도를 드리지 마십시오
  alternatives_korean:
  - 기도하지 말고 / 기도를 올리지 마십시오
  - 중보하지 말고 / 부르지 마십시오
  lexicon: HALOT
  rationale: 두 금지 표현을 한국어 예배어로만 좁히지 않고, הראשון은 일반적 '기도', השני는 '탄원'을 더해 반복 금지의 병렬성을 살렸습니다.
- source_word: רִנָּה וּתְפִלָּה
  english_pob_choice: a cry or prayer
  chosen_korean: 탄원이나 기도
  alternatives_korean:
  - 부르짖음이나 기도
  - 외침이나 기도
  lexicon: HALOT
  rationale: רִנָּה의 울부짖는 뉘앙스를 '탄원'으로, תְּפִלָּה를 '기도'로 옮겨 소리높은 호소와 일반적 기도를 함께 드러냈습니다.
- source_word: בְּעֵת קָרְאָם אֵלַי
  english_pob_choice: at the time when they call to me
  chosen_korean: 그들이 ... 나에게 부르짖을 때는
  alternatives_korean:
  - 그들이 ... 나를 부를 때는
  - 그들이 ... 내게 호소할 때는
  lexicon: HALOT
  rationale: בְּעֵת의 시간 부사를 한국어 조건·시점 표현으로 자연스럽게 반영했고, קרא는 여기서 단순 호출보다 절박한 부르짖음이 적절합니다.
- source_word: בְּעַד רָעָתָם
  english_pob_choice: because of their disaster
  chosen_korean: 재앙을 당하여
  alternatives_korean:
  - 재난 때문에
  - 불행을 당하여
  lexicon: HALOT
  rationale: 문맥상 רָעָה는 도덕적 악보다 닥친 재난을 가리키므로, 그 결과 상태를 간결하게 드러내는 '재앙을 당하여'로 옮겼습니다.
theological_decisions:
- issue: 야훼가 중보 기도를 금지하시는 구절의 어조
  chosen_reading: 예레미야에게 향한 직접 명령으로, 제재를 분명하고 단호하게 전달했습니다.
  alternative_readings:
  - 완곡한 권고처럼 완화하기
  - 예언자적 경고로만 처리하기
  rationale: 본문은 단순 권유가 아니라 금지 명령이며, 하나님의 심판 선고가 이미 확정되었음을 드러냅니다.
  doctrine_reference: 예언자적 중보 제한과 심판 선언(렘 7:16; 14:11 참조)
