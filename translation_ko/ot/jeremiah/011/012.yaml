  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
  footnotes:
  - marker: a
    text: Or 'in the time of their calamity' or 'in the time of their disaster.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다의 성읍들과 예루살렘 주민들이 그들이 향을 피워 바치는 신들에게 가서 부르짖을 것이지만, 그 신들은 그들의 재앙의 때에[a] 결코 그들을 구원하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 재난의 때’, ‘그들의 고난의 때’로 옮길 수 있습니다.
    reason: lexical_alternative
