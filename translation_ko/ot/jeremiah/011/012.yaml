  text: וְ/הָֽלְכ֞וּ עָרֵ֣י יְהוּדָ֗ה וְ/יֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם וְ/זָֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֛ר הֵ֥ם מְקַטְּרִ֖ים לָ/הֶ֑ם וְ/הוֹשֵׁ֛עַ לֹֽא יוֹשִׁ֥יעוּ לָ/הֶ֖ם בְּ/עֵ֥ת רָעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
  footnotes:
  - marker: a
    text: Or 'in the time of their calamity' or 'in the time of their disaster.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다의 성읍들과 예루살렘 주민들이 그들이 향을 피워 바치는 신들에게 가서 부르짖을 것이지만, 그 신들은 그들의 재앙의 때에 결코 그들을 구원하지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 재난의 때’, ‘그들의 재앙의 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי יְהוּדָה
  english_pob_choice: the cities of Judah
  chosen_korean: 유다의 성읍들
  alternatives_korean:
  - 유다의 도시들
  - 유다의 도시들
  lexicon: HALOT
  rationale: 히브리어 소유격 결합을 자연스러운 현대 한국어로 옮기되, 지명 집합의 의미를 유지했습니다.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: and the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들
  alternatives_korean:
  - 예루살렘에 사는 사람들
  - 예루살렘 거주자들
  lexicon: HALOT
  rationale: 분사형은 단순 거주 집단을 가리키므로, 현대 문체에서 가장 자연스러운 집합 명사로 옮겼습니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: the gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님들
  - 신
  - 우상들
  lexicon: HALOT
  rationale: 문맥상 분향의 대상인 다신적/우상적 존재를 가리키므로 복수형 ‘신들’이 원문의 대상을 가장 직접적으로 드러냅니다.
- source_word: מְקַטְּרִים
  english_pob_choice: to whom they burn incense
  chosen_korean: 향을 피워 바치는
  alternatives_korean:
  - 분향하는
  - 향을 바치는
  lexicon: HALOT
  rationale: קטר의 제의적 행위를 한국어 성경문체에서도 분명하게 드러내기 위해 ‘향을 피워 바치다’로 옮겼습니다.
- source_word: וְהוֹשֵׁעַ לֹא יוֹשִׁיעוּ
  english_pob_choice: but they will certainly not save them
  chosen_korean: 그 신들은 … 결코 그들을 구원하지 못할 것입니다
  alternatives_korean:
  - 그 신들은 … 결코 그들을 구하지 못할 것입니다
  - 그 신들은 … 그들을 구원하지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조된 부정은 ‘결코’로 살렸고, 본문의 ‘구원’ 어휘를 유지해 종교적·구속사적 뉘앙스를 보존했습니다.
- source_word: בְּעֵת רָעָתָם
  english_pob_choice: in the time of their trouble
  chosen_korean: 그들의 재앙의 때
  alternatives_korean:
  - 그들의 고난의 때
  - 그들의 재난의 때
  - 그들의 환난의 때
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 닥친 재난·재앙의 의미이므로, 문맥상 가장 직접적인 ‘재앙’으로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 대상과 우상성
  chosen_reading: 유다와 예루살렘이 분향하던 거짓 신들/우상들
  alternative_readings:
  - 일반적인 ‘신들’
  - 단수의 ‘신’
  rationale: 바로 뒤의 ‘그들이 향을 피워 바치는’이 대상을 규정하므로, 문맥적 우상 비판을 흐리지 않도록 복수의 거짓 신들로 읽었습니다.
  doctrine_reference: 예레미야서의 우상숭배 비판 문맥
