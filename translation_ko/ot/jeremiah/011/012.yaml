  - 그 신들은 … 그들을 구원하지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조된 부정은 ‘결코’로 살렸고, 본문의 ‘구원’ 어휘를 유지해 종교적·구속사적 뉘앙스를 보존했습니다.
- source_word: בְּעֵת רָעָתָם
  english_pob_choice: in the time of their trouble
  chosen_korean: 그들의 재앙의 때
  alternatives_korean:
