  source_fidelity: 전반적으로 히브리어의 구성과 의미를 잘 반영합니다. 다만 강조된 부정 הוֹשֵׁעַ לֹא יוֹשִׁיעוּ는 그 신들이 구원할 능력이 없다는 뜻보다, 그들이 결코 구원하지 않을 것이라는 단호한 부정을 나타내므로 ‘구원하지 못할 것입니다’보다 ‘결코 구원하지 않을 것입니다’가 더 정확합니다.
  naturalness: 합쇼체 문체와 문장 흐름은 자연스럽습니다. ‘신들에게 가서 부르짖다’는 ‘가다’와 ‘부르짖다’의 연속 동작을 무리 없이 표현합니다. 각주에는 본문과 같은 ‘재앙의 때’가 대안으로 중복되어 있어 정리하는 편이 좋습니다.
  terminology: ‘유다의 성읍들’, ‘예루살렘 주민들’, ‘신들’, ‘향을 피워 바치는’, ‘재앙의 때’는 문맥과 현대 한국어 성경 문체에 적절합니다. ‘구원’은 ישׁע의 문맥상 적합하되, 부정문의 양태는 ‘못하다’가 아니라 ‘않다’로 옮겨야 합니다.
