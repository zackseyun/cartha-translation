id: JER.11.17
reference: Jeremiah 11:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ הַ/נּוֹטֵ֣עַ אוֹתָ֔/ךְ דִּבֶּ֥ר עָלַ֖יִ/ךְ רָעָ֑ה בִּ֠/גְלַל רָעַ֨ת בֵּֽית יִשְׂרָאֵ֜ל וּ/בֵ֣ית יְהוּדָ֗ה אֲשֶׁ֨ר עָשׂ֥וּ לָ/הֶ֛ם לְ/הַכְעִסֵ֖/נִי לְ/קַטֵּ֥ר לַ/בָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/017.yaml
  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
  footnotes:
  - marker: a
    text: Or 'by burning incense to Baal.' The Hebrew verb refers specifically to producing smoke in ritual offering, often incense.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 — 너를 심으신 이가 — 너를 향해 재앙을 말씀하셨습니다. 이는 이스라엘 집과 유다 집의 악 때문에, 곧 그들이 자기들을 향해 저지른 일로, 곧 바알에게 제사를 드리며 나를 노하게 한 일 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제사를 드리며’는 כאן의 제의적 행위를 포괄적으로 옮긴 것입니다. 히브리어 동사는 문자적으로는 연기를 올리거나 분향하는 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 주 만군
  lexicon: HALOT
  rationale: צְבָאוֹת은 군대/군세를 가리키는 호칭이므로, 관용적이면서도 직역성을 유지하는 ‘만군의’로 옮기고, 여호와 대신 학술 표기인 ‘야훼’를 따랐습니다.
- source_word: הַנּוֹטֵעַ אֹתָךְ
  english_pob_choice: who planted you
  chosen_korean: 너를 심으신 이
  alternatives_korean:
  - 너를 심은 분
  - 너를 심으신 분
  lexicon: HALOT
  rationale: ‘심다’는 식물/나무 이미지와 잘 맞고, 분사 구조를 자연스러운 한국어 관계절로 살리기 위해 ‘심으신 이’로 옮겼습니다.
- source_word: דִּבֶּר עָלַיִךְ רָעָה
  english_pob_choice: has spoken disaster against you
  chosen_korean: 너를 향해 재앙을 말씀하셨습니다
  alternatives_korean:
  - 너에게 재난을 선언하셨습니다
  - 너를 향해 환난을 말씀하셨습니다
  lexicon: HALOT
  rationale: רָעָה는 כאן 도덕적 ‘악’보다 심판으로서의 ‘재앙/재난’이므로, 말씀하심의 행위를 살리면서도 결과를 분명히 드러내는 ‘재앙을 말씀하셨습니다’로 옮겼습니다.
- source_word: לְקַטֵּר
  english_pob_choice: by making offerings to Baal
  chosen_korean: 바알에게 제사를 드리며
  alternatives_korean:
  - 바알에게 향을 피우며
  - 바알에게 분향하며
  lexicon: HALOT
  rationale: לְקַטֵּר는 제의적 연기를 올리는 행위로, 여기서는 우상숭배 행위를 포괄하는 한국어로 ‘제사를 드리며’가 본문 흐름에 가장 자연스럽습니다. 더 구체적인 ‘분향/향을 피움’은 문맥상 가능하나, 본문 의미를 좁히지 않기 위해 본문에서는 일반적 제의 표현을 택했습니다.
theological_decisions:
- issue: רָעָה / רָעַת의 이중 의미를 한국어에서 어떻게 구분할지
  chosen_reading: 앞의 רָעָה는 하나님이 선포하시는 ‘재앙’, 뒤의 רָעַת은 이스라엘과 유다의 ‘악’으로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘악’으로 통일
  - 둘 다 ‘재앙/재난’으로 통일
  rationale: 같은 어근이 심판과 도덕적 악을 동시에 가리키므로, 이를 구분해야 하나님이 도덕적 악을 행하신다는 오해를 피하면서도 원문의 수사적 대비를 보존할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; preserve theological tension without flattening lexical contrast'
