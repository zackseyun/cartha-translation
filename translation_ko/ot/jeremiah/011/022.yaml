  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י פֹקֵ֖ד עֲלֵי/הֶ֑ם הַ/בַּֽחוּרִים֙ יָמֻ֣תוּ בַ/חֶ֔רֶב בְּנֵי/הֶם֙ וּ/בְנ֣וֹתֵי/הֶ֔ם יָמֻ֖תוּ בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/022.yaml
  text: 'Therefore thus says Yahweh of hosts: Behold[a], I am about to punish them. The young men will die by the sword; their sons and their daughters will die by famine.'
  footnotes:
  - marker: a
    text: Or, 'I am bringing judgment on them.' The Hebrew literally says, 'I am visiting upon them,' using a verb that often denotes calling someone to account in judgment contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 야훼께서 이렇게 말씀하십니다. "보십시오, 내가 그들을 벌하려고 합니다. 젊은 남자들은 칼에 죽고, 그들의 아들딸은 기근에 죽을 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פקד는 문맥에 따라 ‘돌보다’보다 ‘벌하다/심판하다’의 뜻이 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: HALOT
  rationale: צְבָאוֹת은 통상적인 신적 칭호이므로 ‘만군의’로 옮기고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הִנְנִי פֹקֵד עֲלֵיהֶם
  english_pob_choice: Behold, I am about to punish them
  chosen_korean: 보십시오, 내가 그들을 벌하려고 합니다
  alternatives_korean:
  - 보십시오, 내가 그들을 심판하려고 합니다
  - 보십시오, 내가 그들에게 주의를 기울이려고 합니다
  lexicon: HALOT
  rationale: פקד + על은 심판 문맥에서 ‘벌하다/벌을 내리다’의 뜻이므로, 현대 한국어에서 명확한 ‘벌하려고 합니다’로 옮겨 출현하는 임박한 사법적 행위를 드러냈습니다.
- source_word: הַבַּחוּרִים
  english_pob_choice: The young men
  chosen_korean: 젊은 남자들
  alternatives_korean:
  - 젊은이들
  - 청년들
  lexicon: HALOT
  rationale: 전투 연령대의 남성들을 가리키는 뉘앙스가 있어, 성별을 드러내는 ‘젊은 남자들’이 문맥상 가장 분명합니다.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  english_pob_choice: their sons and their daughters
  chosen_korean: 그들의 아들딸
  alternatives_korean:
  - 그들의 아들과 딸
  - 그들의 자녀들
  lexicon: HALOT
  rationale: 히브리어가 남녀를 구분해 병렬하므로, 한국어에서는 자연스러우면서도 구분을 보존하는 ‘아들딸’을 택했습니다.
- source_word: יָמֻתוּ בָּרָעָב
  english_pob_choice: will die by famine
  chosen_korean: 기근에 죽을 것입니다
  alternatives_korean:
  - 기근으로 죽을 것입니다
  - 굶주림으로 죽을 것입니다
  lexicon: HALOT
  rationale: רָעָב은 개인적 ‘굶주림’보다 공동체적 재앙인 ‘기근’이 더 정확하며, ‘칼에 죽고 / 기근에 죽고’의 평행을 살렸습니다.
theological_decisions:
- issue: 여호와/야훼 전통 번역 선택
  chosen_reading: ‘야훼’로 직역하여 신적 고유명을 드러냈습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 יְהוָה를 직접 사용하므로, POB 기준에 따라 고유명 자체를 보존하는 쪽이 문맥과 감사 가능성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 심판 동사의 직접성
  chosen_reading: ‘벌하다’로 옮겨 임박한 언약적 심판을 분명히 했습니다.
  alternative_readings:
  - ‘심판하다’
  - ‘찾아가다’
  rationale: 히브리어 פקד는 중립적 ‘방문하다’보다 심판 문맥에서 책임 추궁과 처벌을 뜻하므로, 독자가 본문의 경고성을 즉시 이해하도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve source plain sense'
