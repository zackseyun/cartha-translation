id: JER.11.5
reference: Jeremiah 11:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְמַעַן֩ הָקִ֨ים אֶת הַ/שְּׁבוּעָ֜ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֽוֹתֵי/כֶ֗ם לָ/תֵ֤ת לָ/הֶם֙ אֶ֣רֶץ זָבַ֥ת חָלָ֛ב וּ/דְבַ֖שׁ כַּ/יּ֣וֹם הַ/זֶּ֑ה וָ/אַ֥עַן וָ/אֹמַ֖ר אָמֵ֥ן יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/005.yaml
  text: so that I may establish the oath that I swore to your fathers[a], to give them a land flowing with milk and honey, as it is this day.” And I answered and said, “Amen[b], Yahweh.”
  footnotes:
  - marker: a
    text: Or 'to your ancestors.' The Hebrew reads literally 'to your fathers.'
    reason: lexical_alternative
  - marker: b
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그렇게 하여 내가 당신들의 조상들에게 맹세한 그 맹세를 이루고, 그들에게 젖과 꿀이 흐르는 땅을 주려는 것입니다. 오늘날 그것이 그러합니다. 그러자 내가 대답하여 말했습니다. “아멘, 야훼님.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '당신들의 아버지들'입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 하나님의 이름 YHWH는 '야훼'로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  english_pob_choice: so that
  chosen_korean: 그렇게 하여
  alternatives_korean:
  - 그래서
  - 그 목적에서
  lexicon: HALOT
  rationale: 앞 절의 목적을 잇는 רצון/목적 용법을 자연스러운 한국어로 풀되, 인과를 지나치게 강화하지 않도록 했습니다.
- source_word: הָקִים אֶת הַשְּׁבוּעָה
  english_pob_choice: I may establish the oath
  chosen_korean: 그 맹세를 이루고
  alternatives_korean:
  - 그 맹세를 세우고
  - 그 맹세를 확정하고
  - 그 맹세를 성취하고
  lexicon: HALOT
  rationale: הקים는 맹세를 단순히 '세우다'보다 실제로 이루어 현실화한다는 뉘앙스가 있어, 한국어에서는 '이루다'가 가장 자연스럽고 의미를 잘 살립니다.
- source_word: לַאֲבוֹתֵיכֶם
  english_pob_choice: to your fathers
  chosen_korean: 당신들의 조상들에게
  alternatives_korean:
  - 당신들의 아버지들에게
  - 당신들의 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '아버지들'이지만, 한국어에서는 문맥상 족장-조상 지시를 분명히 하도록 '조상들'을 택했습니다.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 우유와 꿀이 흐르는 땅
  - 젖과 꿀이 넘치는 땅
  lexicon: HALOT
  rationale: 관용구를 그대로 살리면서도 한국어 성서어법에서 익숙한 '젖과 꿀이 흐르는 땅'을 유지했습니다.
- source_word: אָמֵן יְהוָה
  english_pob_choice: Amen, Yahweh
  chosen_korean: “아멘, 야훼님.”
  alternatives_korean:
  - “아멘, 야훼.”
  - “아멘, 주님.”
  lexicon: HALOT
  rationale: 본문의 반응은 직접 인용된 응답이므로 보존하고, 다바르의 호칭은 프로젝트 기본값에 따라 야훼를 유지했습니다. 한국어에서는 호격을 드러내기 위해 '야훼님'으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 직접 호격 처리
  chosen_reading: 야훼를 본문에 유지하고 '야훼님'으로 응답의 호격을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와님
  rationale: 문서의 기본 원칙에 따라 YHWH는 '야훼'로 옮기며, 예레미야의 응답이 단순 감탄이 아니라 인격적 호칭임을 한국어에서 분명히 하기 위해 호격을 살렸습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
