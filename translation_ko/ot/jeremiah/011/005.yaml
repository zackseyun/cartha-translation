  naturalness: '''그렇게 하여 … 것입니다''는 앞 절에 이어지는 하나님의 목적 진술로서는 다소 느슨하고, ''오늘날 그것이 그러합니다''도 한국어에서 지시 대상이 불명확합니다. 목적과 현재의 성취를 한 문장 안에 연결하면 더 자연스럽고 명료합니다.'
