source:
  edition: WLC
  text: שִׁמְע֕וּ אֶת דִּבְרֵ֖י הַ/בְּרִ֣ית הַ/זֹּ֑את וְ/דִבַּרְתָּ/ם֙ אֶל אִ֣ישׁ יְהוּדָ֔ה וְ/עַל יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/002.yaml
  text: Hear the words of this covenant[a], and speak them to the men of Judah and to the inhabitants of Jerusalem.
  footnotes:
  - marker: a
    text: Hebrew 'each man of Judah'; the phrase is a collective/distributive expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 언약의 말씀을 들으십시오. 그리고 그것을 유다 사람들과 예루살렘 주민들에게 전하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '유다 사람 한 사람 한 사람'이라는 집합적·분배적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
  - 들어라
  lexicon: HALOT
  rationale: 히브리어 복수 명령형 שׁמע를 한국어 공손 명령으로 옮기되, '순종하다'로까지 강하게 해석하지 않고 먼저 '듣다'의 의미를 살렸습니다.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  english_pob_choice: the words of this covenant
  chosen_korean: 이 언약의 말씀
  alternatives_korean:
  - 이 언약의 말들
  - 이 언약의 조항들
  lexicon: HALOT
  rationale: 구문상 '말씀들/말들'의 복수성을 살릴 수 있지만, 한국어에서는 '언약의 말씀'이 자연스럽고, 내용이 단순한 발화가 아니라 언약 선포임을 분명히 합니다.
- source_word: אִישׁ יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다 남자들
  - 유다의 각 사람들
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 남성 단수 집합/분배 용법을 그대로 '남자들'로만 밀기보다, 문맥상 집합적 대상인 유다 주민 전체를 가리키는 한국어 표현으로 옮겼습니다. 다만 본문의 남성형 표지는 한국어에서 자연스러운 범위 안에서만 반영했습니다.
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  english_pob_choice: the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들
  alternatives_korean:
  - 예루살렘에 사는 사람들
  - 예루살렘 거주자들
  lexicon: HALOT
  rationale: יכֹשְׁבֵי는 '거주하는 자들'의 명사적 용법이므로, 간결하고 현대적인 '주민들'로 옮겼습니다.
theological_decisions:
- issue: 언약 말씀을 '듣다'와 '전하다'의 명령형 톤
  chosen_reading: 예언자에게 주어진 명령을 한국어 공손 명령형으로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 강한 권위형 명령으로 직역
  rationale: 본문은 언약의 말씀을 청중에게 전달하라는 직접 명령이므로, 현대 한국어 합쇼체로 권위와 공적 선포의 성격을 함께 살리는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy
