source:
  edition: WLC
  text: מֶ֣ה לִֽ/ידִידִ֞/י בְּ/בֵיתִ֗/י עֲשׂוֹתָ֤/הּ הַֽ/מְזִמָּ֨תָ/ה֙ הָֽ/רַבִּ֔ים וּ/בְשַׂר קֹ֖דֶשׁ יַעַבְר֣וּ מֵֽ/עָלָ֑יִ/ךְ כִּ֥י רָעָתֵ֖/כִי אָ֥ז תַּעֲלֹֽזִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/015.yaml
  text: What right has my beloved in my house[c][b][a], when she has done her many wicked schemes? Can holy flesh remove your evil from you? Then you rejoice!
  footnotes:
  - marker: a
    text: Or 'What business has my beloved in my house...?'
    reason: lexical_alternative
  - marker: b
    text: '''Holy flesh'' likely refers to meat from sacrifices; the sense is that sacred ritual cannot take away their wickedness.'
    reason: cultural_note
  - marker: c
    text: Hebrew is difficult; literally, 'and holy flesh will pass from upon you, for your evil—then you rejoice.'
    reason: alternative_reading
translation:
  language: ko
  text: “내 사랑하는 이가 내 집에서 무슨 일이 있겠습니까?[a] 그녀가 많은 악한 계교를 꾸며 왔는데도 말입니다. 거룩한 제물의 고기가 당신에게서 당신의 악을 없앨 수 있겠습니까?[b][c] 그때 당신은 기뻐합니다!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 집에서 무슨 일이 있겠습니까?’는 מֶה לְ... בְּ...의 관용적 수사 표현입니다. ‘내 집에 무슨 권리가 있겠습니까?’ 또는 ‘내 집에서 무슨 상관이 있겠습니까?’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩한 제물의 고기’는 성별된 희생제물의 고기를 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 본문은 난해합니다. 문자적으로는 ‘그리고 거룩한 고기가 당신 위에서/당신에게서 지나갈 것이니, 당신의 רָעָה—그때 당신은 기뻐한다’에 가깝습니다. 여기서 רָעָה는 ‘악’ 또는 ‘재앙’으로 이해될 수 있으며, 본문 번역은 제의가 지속되는 악을 없애지 못한다는 해석을 따른 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶה לִידִידִי בְּבֵיתִי
  english_pob_choice: What right has my beloved in my house
  chosen_korean: “내 사랑하는 자가 내 집에서 무슨 권리가 있습니까?”
  alternatives_korean:
  - “내 사랑하는 자가 내 집에서 무슨 일이 있습니까?”
  - “내 사랑하는 자가 내 집에서 무슨 상관이 있습니까?”
  lexicon: HALOT
  rationale: מֶה לְ... בְּ...의 관용적 수사를 한국어로는 ‘무슨 권리가 있습니까?’로 옮겨, 단순 질문이 아니라 침범·무자격의 뉘앙스를 살렸습니다.
- source_word: לִידִידִי
  english_pob_choice: my beloved
  chosen_korean: 내 사랑하는 자
  alternatives_korean:
  - 내 사랑하는 이
  - 내 사랑받는 자
  lexicon: HALOT
  rationale: 직역형을 유지하되 한국어에서 자연스러운 관계 표현으로 옮겼습니다. 여기서는 언약적 친밀함이 아이러니하게 쓰이므로 지나치게 완화하지 않았습니다.
- source_word: עֲשׂוֹתָהּ הַמְזִמָּתָה הָרַבִּים
  english_pob_choice: when she has done her many wicked schemes
  chosen_korean: 그가 자기의 많은 악한 꾀를 행했는데
  alternatives_korean:
  - 그가 자기의 많은 계교를 행했는데
  - 그가 많은 악한 계획들을 행했는데
  lexicon: HALOT
  rationale: מְזִמָּה의 부정적 도덕성을 ‘악한 꾀’로 살렸고, ‘행하다’로 히브리어의 동사적 구조를 반영했습니다. 영어 POB처럼 여성형 표지가 가리키는 집단적 대상이 한국어에서는 문맥상 ‘그’로 수용됩니다.
- source_word: וּבְשַׂר קֹדֶשׁ
  english_pob_choice: holy flesh
  chosen_korean: 거룩한 고기
  alternatives_korean:
  - 성스러운 고기
  - 거룩한 살코기
  - 제물의 거룩한 고기
  lexicon: HALOT
  rationale: 제의적 희생제물의 고기라는 문화적 배경을 살리면서도 본문의 표면 이미지를 유지하기 위해 ‘거룩한 고기’로 옮겼습니다.
- source_word: יַעַבְרוּ מֵעָלַיִךְ כִּי רָעָתֵכִי
  english_pob_choice: Can holy flesh remove your evil from you?
  chosen_korean: 거룩한 고기가 당신에게서 당신의 악을 제거할 수 있겠습니까?
  alternatives_korean:
  - 거룩한 고기가 당신에게서 지나가 당신의 악을 없앨 수 있겠습니까?
  - 거룩한 고기가 당신의 악을 당신에게서 지나가게 할 수 있겠습니까?
  lexicon: HALOT
  rationale: 어려운 עבר 구문은 POB의 해석을 따라 ‘제거하다’로 풀어 주되, 뒤의 ‘당신의 악’을 분명히 드러내 제의가 죄를 씻어낼 수 없다는 논지를 전달했습니다.
theological_decisions:
- issue: ‘내 사랑하는 자’의 대상과 아이러니
  chosen_reading: 여기서는 여호와의 언약 백성인 유다/예루살렘을 가리키는 집합적 여성 대상이 아이러니하게 불립니다.
  alternative_readings:
  - 일반적인 개인 신자
  - 아이러니가 약화된 중립적 호칭
  rationale: 문법적 여성형과 문맥상 고발 어조를 반영해야 하므로, 친밀한 언약 호칭을 유지하되 비난의 아이러니가 드러나게 했습니다.
  doctrine_reference: 예레미야의 언약 고발 본문에 나타나는 예언자적 아이러니
- issue: 제의적 ‘거룩한 고기’의 기능
  chosen_reading: 거룩한 제의가 지속적인 악을 제거하지 못한다는 비판으로 읽었습니다.
  alternative_readings:
  - 단순히 성전 의식 일반에 대한 언급
  - 본문이 불확실하므로 의미를 약화시키는 읽기
  rationale: ‘거룩한 고기’와 ‘당신의 악’의 대비가 분명하므로, 의식 참여가 죄책을 없애지 못한다는 예언적 논지를 한국어에서도 분명히 보이게 했습니다.
  doctrine_reference: 외적 제의와 내적 악의 불일치에 대한 예언자적 비판
