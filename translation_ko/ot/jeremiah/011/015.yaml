  rationale: 수정문은 원문의 수사적 질문과 언약적 아이러니를 유지하고, 여성형 집합 대상을 ‘그녀’로 바로잡았습니다. 또한 ‘계교를 꾸미다’라는 자연스러운 한국어를 사용했습니다. 제의적 고기가 죄/악을 없앤다는 해석은 영어 POB의 감사( audit ) 결정을 따라 본문에 유지하되, 구문의 문법적 난해성과 ‘악/재앙’의 의미 범위를 각주에서 보존하여 번역 자체가 논쟁적 해석을 확정하지 않도록 했습니다.
  reviewer_model: gpt-5.6-terra
