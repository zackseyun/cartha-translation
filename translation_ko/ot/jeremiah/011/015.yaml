  source_fidelity: 수정이 필요합니다. 초안은 난해한 יַעַבְרוּ מֵעָלָיִךְ를 ‘악을 제거하다’로 해석할 수 있다는 점은 반영했지만, 히브리어에 직접 목적어가 없고 רָעָתֵכִי가 ‘악’ 또는 ‘재앙’으로 읽힐 수 있는 불확실성을 본문과 주석에서 충분히 보존하지 못합니다. 또한 여성 단수 표지가 가리키는 유다/예루살렘을 한국어에서 남성형 ‘그’로 지칭한 것은 부정확합니다.
  naturalness: ‘자기의 많은 악한 꾀를 행했는데’는 한국어 결합이 다소 부자연스럽습니다. ‘많은 악한 계교를 꾸며 왔는데도’가 자연스럽습니다. ‘내 사랑하는 이’와 ‘거룩한 제물의 고기’는 현대 한국어에서 존중된 성서 문체를 유지하면서도 의미를 전달합니다.
  terminology: ‘내 사랑하는 이’는 יְדִידִי의 언약적·아이러니한 호칭을 보존합니다. ‘거룩한 제물의 고기’는 בְשַׂר־קֹדֶשׁ의 제의적 의미를 드러내되, 그 효력에 관한 난해한 구문은 각주로 한정합니다. רָעָה를 본문에서는 영어 POB의 해석을 따라 ‘악’으로 두되, 각주에서 ‘재앙’ 가능성을 명시합니다.
  issues:
  - severity: medium
    issue: 여성형 지시 대상에 남성형 ‘그’를 사용함
    rationale: עֲשׂוֹתָהּ 및 뒤의 여성 단수 형태들은 여성 집합체인 유다/예루살렘을 가리킨다. 한국어 번역에서도 최소한 ‘그녀’로 문법적 표지를 보존하는 편이 정확하다.
  - severity: medium
    issue: 난해한 ‘거룩한 고기’ 구문을 확정적으로 ‘악을 제거하다’로 처리함
    rationale: יַעַבְרוּ מֵעָלָיִךְ는 문자상 ‘네 위에서/네게서 지나가다’이며, 목적어와 רָעָתֵכִי의 정확한 연결은 논쟁적이다. 영어 POB의 해석을 본문에 반영할 수는 있으나, 각주는 ‘악/재앙’ 및 문자적 어순의 불확실성을 정확히 밝혀야 한다.
  - severity: low
    issue: ‘악한 꾀를 행하다’가 자연스럽지 않음
    rationale: מְזִמָּה의 부정적 계획·계교의 뜻에는 ‘꾸미다’가 한국어에서 더 자연스럽다.
  - severity: low
    issue: 각주 c의 직역 설명이 히브리어 연결을 지나치게 단정함
    rationale: ‘이는 당신의 악 때문이다’는 כִּי의 기능과 רָעָתֵכִי의 뜻을 하나로 확정한다. 난해성을 보존하는 설명으로 바꾸어야 한다.
