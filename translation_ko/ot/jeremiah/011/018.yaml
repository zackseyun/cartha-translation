id: JER.11.18
reference: Jeremiah 11:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֥ה הֽוֹדִיעַ֖/נִי וָֽ/אֵדָ֑עָ/ה אָ֖ז הִרְאִיתַ֥/נִי מַעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/018.yaml
  text: And Yahweh made it known to me[a], and I knew; then you showed me their deeds.
  footnotes:
  - marker: a
    text: Hebrew shifts from third person ('the LORD') to second person ('you showed me'), likely reflecting direct address to the LORD; some translations smooth this to 'he showed me.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 그것을 내게 알려 주셨습니다[a]. 그래서 내가 알게 되었고, 그때 주께서 그들의 행위를 내게 보여 주셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞부분의 3인칭 호칭(‘야훼께서’)에서 뒷부분의 2인칭 직접 호칭(‘주께서 … 보여 주셨습니다’)으로 바뀝니다. 본 번역은 그 전환을 그대로 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: וַֽ/יהוָ֥ה
  english_pob_choice: And Yahweh / the LORD
  chosen_korean: 야훼께서
  alternatives_korean:
  - 주께서
  - 여호와께서
  lexicon: WLC + project glossary
  rationale: 원문은 여호와의 이름(יהוה)을 직접 사용하므로, 프로젝트 기본값에 따라 표제적 칭호가 아닌 고유 신명인 ‘야훼’로 옮겼습니다.
- source_word: הוֹדִיעַ֖/נִי
  english_pob_choice: made it known to me
  chosen_korean: 그것을 내게 알려 주셨습니다
  alternatives_korean:
  - 내게 알게 하셨습니다
  - 내게 알려 주셨습니다
  lexicon: HALOT
  rationale: 히필형 ידע는 ‘알게 하다/알려 주다’의 사역 의미를 가지므로, ‘알려 주셨습니다’로 자연스럽게 옮기되, 히브리어의 일반적 목적어를 한국어에서는 지시어 ‘그것’을 보완해 드러냈습니다.
- source_word: וָֽ/אֵדָ֑עָ/ה
  english_pob_choice: and I knew / so I knew
  chosen_korean: 그래서 내가 알게 되었고
  alternatives_korean:
  - 그리고 내가 알게 되었고
  - 그리하여 내가 알게 되었고
  lexicon: HALOT
  rationale: 결과를 이어 주는 접속과 완료적 흐름을 살려 ‘그래서’로 옮겼습니다. 동사의 결과 상태를 현대 한국어에서 자연스럽게 표현하는 방식입니다.
- source_word: הִרְאִיתַ֥/נִי
  english_pob_choice: you showed me
  chosen_korean: 주께서 ... 내게 보여 주셨습니다
  alternatives_korean:
  - 주께서 ... 내게 보이셨습니다
  - 주께서 ... 내게 보여 주셨습니다
  lexicon: HALOT
  rationale: 원문은 2인칭 남성 단수 히필형으로, 앞의 3인칭 명명과 달리 곧바로 하나님께 직접 말하는 화법 전환을 보입니다. 이를 살려 한국어도 주체를 다시 분명히 밝혔습니다.
- source_word: מַעַלְלֵי/הֶֽם
  english_pob_choice: their deeds
  chosen_korean: 그들의 행위를
  alternatives_korean:
  - 그들의 행실을
  - 그들의 행동을
  lexicon: HALOT
  rationale: מַעֲלָלֵי는 단순한 ‘행동’보다 행위/소행의 뉘앙스가 있어 ‘행위’로 옮겼습니다. 본문 자체에 평가어를 덧붙이지 않고 문맥이 드러내는 도덕적 함의를 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 신명(יהוה)이 직접 나오므로, 프로젝트 기본값에 따라 ‘야훼’를 유지해 명칭의 고유성과 언약적 함의를 드러냈습니다.
  doctrine_reference: 프로젝트 용어집 — יהוה / YHWH
