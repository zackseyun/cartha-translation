  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/004.yaml
  text: which I commanded your fathers on the day I brought them out from the land of Egypt[a], from the iron furnace, saying, ‘Listen to my voice and do them, according to all that I command you; and you shall be my people[c][b], and I will be your God,’
  footnotes:
  - marker: a
    text: Or 'your ancestors.' The Hebrew reads 'your fathers.'
    reason: lexical_alternative
  - marker: b
    text: '''Listen to my voice'' can also be rendered ''Obey my voice,'' since the Hebrew expression often includes the sense of obedient hearing.'
    reason: lexical_alternative
  - marker: c
    text: '''The iron furnace'' is a metaphor for Egypt as a place of harsh oppression and affliction.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 너희 조상들[a]에게, 곧 내가 그들을 이집트 땅에서, 쇠 용광로[b]에서 이끌어 내던 날에 명령한 언약은 이러합니다. “내 목소리를 들으십시오[c]. 내가 너희에게 명령하는 모든 것을 다 행하십시오. 너희는 내 백성이 되고, 나는 너희의 하나님이 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희 아버지들’이라고 합니다. 여기서는 이스라엘의 이전 세대를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쇠 용광로’는 이집트를 가혹한 압제와 고난의 장소로 묘사하는 비유입니다.
    reason: cultural_note
  - marker: c
    text: ‘내 목소리를 들으십시오’에 해당하는 히브리어 표현은 문맥에 따라 듣는 것과 순종하는 것을 함께 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֽוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 그들의 조상들
  alternatives_korean:
  - 그들의 아버지들
  - 그들의 선조들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 한국어에서는 계약 맥락의 선대 지칭으로 ‘조상들’이 가장 자연스럽고 오해를 덜 일으킵니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: out from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 땅으로부터
  lexicon: HALOT
  rationale: ‘땅/land’의 형식을 살리되 한국어에서는 ‘이집트 땅에서’가 가장 자연스럽고 본문의 출애굽 배경을 분명히 드러냅니다.
- source_word: מִכּוּר הַבַּרְזֶל
  english_pob_choice: from the iron furnace
  chosen_korean: 쇠 용광로
  alternatives_korean:
  - 철 용광로
  - 쇠로 된 풀무
  lexicon: HALOT
  rationale: ‘iron furnace’는 이집트를 압제의 장소로 비유하는 표현이어서, 본문 이미지가 살아 있으면서도 현대 한국어에서 비유성을 이해하기 쉬운 ‘쇠 용광로’를 선택했습니다.
- source_word: שִׁמְעוּ בְקוֹלִי
  english_pob_choice: Listen to my voice
  chosen_korean: 내 목소리를 들으십시오
  alternatives_korean:
  - 내 목소리에 순종하십시오
  - 내 음성을 들으십시오
  lexicon: HALOT
  rationale: 직역적인 ‘듣다’의 이미지를 유지하면서도 공손한 명령형으로 옮겼습니다. 본문의 순종 뉘앙스는 뒤의 ‘그대로 행하십시오’가 보완합니다.
- source_word: וַעֲשִׂיתֶם אֹתָם
  english_pob_choice: and do them
  chosen_korean: 그대로 행하십시오
  alternatives_korean:
  - 그것들을 행하십시오
  - 실행하십시오
  lexicon: HALOT
  rationale: 복수 대상을 한국어로 자연스럽게 받으면서, 단순 실행 이상의 언약적 이행 의미를 드러내기 위해 ‘그대로 행하십시오’로 옮겼습니다.
- source_word: וִהְיִיתֶם לִי לְעָם / וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  english_pob_choice: and you shall be my people / and I will be your God
  chosen_korean: 여러분은 내 백성이 되고, 나는 여러분의 하나님이 될 것입니다
  alternatives_korean:
  - 여러분은 내 백성이 되며, 나는 여러분의 하나님이 되겠습니다
  - 여러분은 내 백성이 되고 나는 여러분의 하나님이 되리라
  lexicon: HALOT
  rationale: 히브리어의 언약 공식 표현을 한국어의 가장 표준적인 관계 서술로 옮겼고, ‘백성/하나님’의 상호관계 구조를 유지했습니다.
theological_decisions:
- issue: 히브리어 명령어의 순종 뉘앙스
  chosen_reading: ‘내 목소리를 들으십시오’로 유지하고, 뒤의 ‘그대로 행하십시오’로 순종 의미를 분명히 했습니다.
  alternative_readings:
  - ‘내 목소리에 순종하십시오’로 직접 옮길 수 있습니다.
  - ‘내 말을 들으십시오’로 더 평이하게 옮길 수 있습니다.
  rationale: שׁמע בְּקוֹל은 듣기와 순종을 함께 품는 표현이지만, 본문 자체가 즉시 행위를 덧붙이므로 한국어 본문에서는 청취 이미지를 살리고 순종을 후행 절로 분명히 하는 편이 원문 구조를 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: ‘철 용광로’의 상징성
  chosen_reading: 이집트의 압제와 고통을 가리키는 비유로 이해되도록 ‘쇠 용광로’를 본문에 반영했습니다.
  alternative_readings:
  - ‘철로 된 용광로’
  - ‘철 제련용 풀무’
  rationale: 이 표현은 단순한 금속 용광로가 아니라 이집트를 고난의 장소로 묘사하는 은유이므로, 직설적이되 지나치게 기술적이지 않은 한국어로 비유성을 유지하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
