  verdict: revise
  source_fidelity: 개정이 필요합니다. עַד־מָתַי는 ‘어찌하여’가 아니라 기간을 묻는 ‘언제까지’이며, תִּתְחַמָּקִין은 여기서 단순한 내적 ‘흔들림’보다 이리저리 벗어나거나 방황하는 행동을 나타냅니다. 또한 번역 원칙상 יְהוָה는 ‘야훼’로 옮기는 것이 일관됩니다. 마지막 절은 해석이 논쟁적이므로 문자적 표현을 유지하고 주석으로 한정해야 합니다.
  naturalness: ‘언제까지 네가 방황하겠느냐, 배반하는 딸아?’는 현대 표준어 합쇼체의 문어적 성경 문맥에서 자연스럽습니다. ‘여자가 남자를 에워쌀 것이다’는 다소 낯선 이미지를 의도적으로 보존하지만 문법적으로는 자연스럽습니다.
  terminology: הַבַּת הַשּׁוֹבֵבָה는 언약적 불충성을 함축하는 ‘배반하는 딸’로 옮겼습니다. בָרָא는 ‘창조하셨으니’로, חֲדָשָׁה는 의미를 과도하게 특정하지 않는 ‘새로운 일을’로 번역했습니다. נְקֵבָה와 גָּבֶר는 각각 ‘여자’와 ‘남자’로 유지하되, 마지막 표현의 해석적 불확실성은 주석에 밝혔습니다.
  issues:
  - severity: high
    issue: ‘어찌하여’는 עַד מָתַי의 시간 의문을 잘못 옮깁니다.
    rationale: עַד מָתַי는 ‘얼마나 오래/언제까지’를 뜻하므로 원문의 질문 범위를 보존하려면 ‘언제까지’가 필요합니다.
  - severity: medium
    issue: ‘흔들리느냐’는 תִּתְחַמָּקִין의 의미를 지나치게 내면적·심리적으로 좁힙니다.
    rationale: 이 동사는 피하다, 빠져나가다, 이리저리 움직이다의 뉘앙스를 지니며, 본문에서는 언약적으로 방황하고 돌아서는 딸의 맥락입니다.
  - severity: medium
    issue: ‘여호와’는 제공된 POB의 신명 표기 원칙과 불일치합니다.
    rationale: 영어 감사 기록은 יְהוָה를 Yahweh로 옮기는 원칙을 명시하므로 한국어도 ‘야훼’로 통일하는 것이 적절합니다.
  - severity: medium
    issue: 난해한 마지막 절에 대한 주석이 없습니다.
    rationale: נְקֵבָה תְּסוֹבֵב גָּבֶר는 단어 차원에서는 명료하지만 전체 이미지의 뜻은 오래 논쟁되어 왔으므로, 본문은 문자적으로 두고 해석 가능성을 주석으로 제시해야 합니다.
  revised_text: 언제까지 네가 방황하겠느냐, 배반하는 딸아? 야훼께서 땅에 새로운 일을 창조하셨으니, 여자가 남자를 에워쌀 것이다.[a]
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘여자가 남자를 에워쌀 것이다’입니다. 이 마지막 절의 뜻은 논쟁적입니다. ‘여자가 남자에게 구애할 것이다’, ‘약한 이가 강한 이를 이길 것이다’, 또는 회복된 이스라엘을 비유적으로 가리킨다는 해석 등이 제시되어 왔습니다.
    reason: alternative_reading
  - marker: b
    text: ‘땅’은 ‘온 세상’으로도 옮길 수 있으나, 여기서는 문맥상 이스라엘의 땅을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: ‘배반하는 딸’은 ‘돌아선 딸’ 또는 ‘방황하는 딸’로도 옮길 수 있습니다. 히브리어는 언약 관계에서의 불충성과 이탈을 나타냅니다.
    reason: lexical_alternative
  revision_rationale: 시간 의문문을 바로잡고, 방황·회피의 동작을 나타내는 동사의 의미를 반영했습니다. 신명은 POB 표기 원칙에 따라 ‘야훼’로 통일했습니다. 예언적 완료형은 ‘창조하셨으니’로 보존했으며, 해석이 확정되지 않은 ‘여자가 남자를 에워쌀 것이다’는 문자적으로 유지하고 주석에서만 대안을 제시했습니다.
