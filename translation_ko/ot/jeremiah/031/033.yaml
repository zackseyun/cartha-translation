source:
  edition: WLC
  text: כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/033.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], declares Yahweh: I will put my law within them, and I will write it on their hearts. And I will be their God[c][b], and they shall be my people.'
  footnotes:
  - marker: a
    text: Or 'my instruction.' The Hebrew torah can mean 'law' or 'instruction'; here 'law' is used to preserve the covenantal sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'I will cut' a covenant.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb translated 'I will put' is formally perfect ('I have put'), but in this prophetic context it is understood with future force alongside the surrounding promises.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 이스라엘 집과 맺을 언약입니다. 그날들 후에—야훼의 말씀입니다—내가 내 율법을 그들 속에 두고 그들의 마음에 그것을 기록하겠습니다. 나는 그들의 하나님이 되고 그들은 내 백성이 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 토라(torah)는 '율법' 또는 '가르침'을 뜻할 수 있습니다. 여기서는 언약적 의미를 보존하기 위해 '율법'을 사용했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 '내가 언약을 자르겠다'입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사 형태는 문자적으로는 완료형이지만, 이 예언적 문맥에서는 주변의 미래 약속들과 함께 미래 의미로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית / הַבְּרִית
  english_pob_choice: the covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 동맹
  lexicon: HALOT
  rationale: 야훼와 이스라엘 사이의 관계를 가리키는 բְּרִית의 언약적 의미를 살리기 위해 표준 성경어인 '언약'을 사용했습니다.
- source_word: תּוֹרָתִי
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 가르침
  - 내 지시
  lexicon: HALOT
  rationale: 이 문맥은 새 언약의 내면화된 규범을 말하므로, תּוֹרָה의 넓은 뜻을 인정하되 본문의 언약적·규범적 울림을 위해 '율법'을 유지했습니다.
- source_word: בְּקִרְבָּם
  english_pob_choice: within them
  chosen_korean: 그들 속에
  alternatives_korean:
  - 그들 가운데
  - 그들 안에
  lexicon: HALOT
  rationale: 뒤의 '그들의 마음에'와 평행을 이루는 내면적 위치를 분명히 하면서도, 한국어로 자연스러운 '그들 속에'를 택했습니다.
- source_word: לֵב
  english_pob_choice: hearts
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속사람
  lexicon: HALOT
  rationale: 성경적 인간 이해에서 לֵב는 감정만이 아니라 사고와 의지의 중심을 가리키므로, 현대 한국어에서 그 기능을 가장 넓게 담는 '마음'으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 공식의 무게를 살리면서도, 본 프로젝트의 기본 용례에 따라 신적 이름은 '야훼'로 옮겼습니다.
theological_decisions:
- issue: וְהָיִיתִי / וְהֵמָּה יִהְיוּ의 약속형 미래
  chosen_reading: 미래 약속으로 읽어 '나는 ... 되고 그들은 ... 될 것입니다'로 옮겼습니다.
  alternative_readings:
  - 직역에 가깝게 '나는 ... 이었고 그들은 ... 이다'로 옮김
  - 현재적 상태 진술로 읽음
  rationale: 앞뒤가 모두 장차 이루어질 새 언약의 약속문맥이므로, 히브리어 형태의 시제보다 예언적 미래 기능을 따라 일관된 약속으로 번역했습니다.
  doctrine_reference: 예언적 완료/미래 기능을 문맥에 따라 반영하는 번역 원칙
- issue: יְהוָה의 표기
  chosen_reading: 본문에는 '야훼'를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 하나님의 고유명을 가려 부드럽게 바꾸지 않고, 성경 본문에서 드러난 언약적 이름을 직접 드러냈습니다.
  doctrine_reference: 본문의 신명기적·언약적 이름을 보존하는 번역 원칙
