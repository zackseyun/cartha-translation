  yaml_path: translation/ot/jeremiah/031/011.yaml
  text: For Yahweh has redeemed Jacob and ransomed him from the hand of one stronger than he[a].
  footnotes:
  - marker: a
    text: Or, 'and redeemed him.' The Hebrew verb here is גאל, a term often associated with acting as a redeemer on behalf of a relative or reclaiming someone from distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 야곱을 속량하시고 야곱보다 강한 자의 손에서 그를 구속하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 속량하셨습니다.’ 히브리어 동사 גאל은 친족을 위하여 구속자로 나서거나, 곤경에 처한 이를 되찾아 구해 내는 행위를 흔히 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 고유한 언약 이름인 יהוה를 титulation으로 바꾸지 않고, 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: פָדָה
  english_pob_choice: has redeemed
  chosen_korean: 구속하시고
  alternatives_korean:
  - 구원하시고
  - 속량하시고
  - 건져내시고
  lexicon: HALOT
  rationale: פדה의 핵심인 대가를 치르고 풀어 주는 구출 의미를 살려 ‘구속하시고’로 옮겼습니다.
- source_word: וּגְאָלוֹ
  english_pob_choice: and ransomed him
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구속하셨습니다
  - 되찾으셨습니다
  - 그를 속량하셨습니다
  lexicon: HALOT
  rationale: גאל의 친족-구속/되찾음 뉘앙스를 반영해 두 번째 동사는 ‘속량하다’로 구분하여 번역했습니다.
- source_word: מִיַּד חָזָק מִמֶּנּוּ
  english_pob_choice: from the hand of one stronger than he
  chosen_korean: 그보다 강한 자의 손에서
  alternatives_korean:
  - 그보다 더 강한 자의 손에서
  - 그를 이길 만큼 강한 자의 손에서
  - 그보다 강한 자의 권세에서
  lexicon: HALOT
  rationale: ‘손’의 히브리식 권세 은유를 살리되, 한국어에서는 자연스럽게 ‘손에서’로 옮겨 비교 의미를 분명히 했습니다.
theological_decisions:
- issue: פדה와 גאל의 병렬 번역
  chosen_reading: ‘구속하시고’와 ‘속량하셨습니다’로 서로 다른 한국어 동사를 사용해 병렬성을 살렸습니다.
  alternative_readings:
  - 둘 다 ‘구속하셨습니다’로 통일
  rationale: 히브리어는 유사한 구속 동사를 병렬로 사용하므로, 의미 영역은 겹치지만 동일어 반복은 피하여 본문의 수사적 결을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5 (consistency of key terms, or documented exception)'
