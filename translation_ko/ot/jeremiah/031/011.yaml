  to: 이는 야훼께서 야곱을 속량하시고 야곱보다 강한 자의 손에서 그를 구속하셨기 때문입니다.[a]
  rationale: 절두의 ‘이는 … 때문입니다’로 כִּי의 근거 제시 기능을 살렸습니다. פדה와 גאל은 각각 ‘속량하다’와 ‘구속하다’로 구별하되, 두 동사가 겹치는 구속·해방의 의미 영역에 속한다는 점은 각주에서 설명했습니다. 비교의 기준은 원문의 야곱을 분명히 하도록 ‘야곱보다’로 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:14Z'
