  source_fidelity: 히브리어 כִּי가 제시하는 근거나 이유의 연결이 본문에 반영되지 않았습니다. 또한 각 구속 동사의 의미 범위는 대체로 적절하나, 현 각주가 본문의 두 번째 동사와 같은 ‘속량’만을 대안으로 제시하여 대안 기능을 하지 못합니다.
  naturalness: ‘이는 … 때문입니다’는 앞 문맥의 약속 또는 선언에 대한 근거를 자연스러운 현대 한국어 합쇼체로 나타냅니다. ‘야곱보다 강한 자’는 ‘그보다’보다 비교 대상이 명확합니다.
  terminology: ‘야훼’는 원문의 신명을 충실히 반영합니다. פדה는 ‘속량하시고’, גאל은 ‘구속하셨습니다’로 달리 옮겨 병렬의 어휘적 결을 보존할 수 있습니다. 각주는 גאל에 대한 실제 대안인 ‘속량하셨습니다’를 제시하도록 고쳐야 합니다.
