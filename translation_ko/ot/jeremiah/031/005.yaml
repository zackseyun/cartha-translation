translation:
  language: ko
  text: 다시 너는 사마리아의 산들에 포도원을 심을 것이며, 심는 이들이 심고 그 소출을 누릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘일상적인 용도로 사용할 수 있게 하다’라는 뜻의 관용적 표현입니다. 여기서는 포도원을 심은 뒤 그 소출을 일반적으로 먹고 누리게 된다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
