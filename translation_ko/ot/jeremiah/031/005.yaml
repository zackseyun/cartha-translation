- from: 다시 사마리아 산들에 포도원을 심을 것이며, 심는 자들이 심고 그것들을 누릴 것입니다.[a]
  to: 다시 너는 사마리아의 산들에 포도원을 심을 것이며, 심는 이들이 심고 그 소출을 누릴 것입니다.[a]
  rationale: 한국어에서 자연스럽지 않은 ‘그것들을 누리다’를 농경 문맥이 함축하는 ‘그 소출을 누리다’로 명확히 했습니다. 이는 새 교리를 덧붙이는 것이 아니라 וְחִלֵּלוּ의 문맥상 관용적 의미를 한국어로 드러낸 것입니다. 원문의 직접 호칭과 미래 약속, 반복적 표현을 유지했으며, 각주 표지도 해당 동사 번역 뒤로 옮겼습니다.
