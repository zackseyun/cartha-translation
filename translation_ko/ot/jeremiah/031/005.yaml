  verdict: revise
  source_fidelity: 히브리어의 미래 회복 약속, 사마리아의 산들, 그리고 נָטְעוּ נֹטְעִים의 반복을 대체로 충실히 반영했습니다. 다만 וְחִלֵּלוּ는 포도원 자체를 단순히 ‘누리다’라기보다 포도원의 소출을 일상적 용도로 사용·향유하게 된다는 농경 관용 표현입니다. 한국어에서는 목적어를 ‘그것들’로 두면 포도원을 누린다는 뜻처럼 들려 자연스럽지 않고 의미도 다소 불분명합니다.
  naturalness: ‘사마리아 산들에’보다 ‘사마리아의 산들에’가 현대 표준 한국어에서 더 자연스럽습니다. 또한 ‘심는 자들이 심고 그것들을 누릴 것입니다’는 반복 자체는 원문의 강조를 보존하지만, ‘그것들’의 지시 대상과 ‘누리다’의 결합이 부자연스럽습니다.
  terminology: ‘포도원’, ‘사마리아’, ‘누리다’는 적절합니다. 다만 관용구의 실제 대상인 포도원의 소출을 본문에서 밝혀 주고, 각주도 ‘공통적으로’라는 모호한 표현 대신 일상적 사용 또는 향유라는 뜻을 명확히 해야 합니다.
