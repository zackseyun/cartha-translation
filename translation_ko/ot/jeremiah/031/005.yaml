  text: ע֚וֹד תִּטְּעִ֣י כְרָמִ֔ים בְּ/הָרֵ֖י שֹֽׁמְר֑וֹן נָטְע֥וּ נֹטְעִ֖ים וְ/חִלֵּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/005.yaml
  text: Again you will plant vineyards on the mountains of Samaria[a]; planters will plant and enjoy them.
  footnotes:
  - marker: a
    text: Or, more literally, 'and will make them common,' an idiom referring to using or enjoying the vineyard's produce in ordinary use.
    reason: lexical_alternative
translation:
  language: ko
  text: 다시 사마리아 산들에 포도원을 심을 것이며, 심는 자들이 심고 그것들을 누릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그것들을 공통적으로/일상적으로 사용하다’라는 뜻의 관용구로, 포도원의 소출을 실제로 누리거나 쓰게 된다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  english_pob_choice: Again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 거듭
  - 또다시
  lexicon: HALOT
  rationale: 회복 문맥에서 עת의 재개를 나타내므로, 간결하고 자연스러운 ‘다시’가 ‘Again’의 의미를 잘 살립니다.
- source_word: תִּטְּעִי
  english_pob_choice: you will plant
  chosen_korean: 심을 것입니다
  alternatives_korean:
  - 심으실 것입니다
  - 심으리라
  - 심으십시오
  lexicon: HALOT
  rationale: 2인칭 여성 단수의 미래형이지만 한국어는 성 구분을 드러내지 않으므로, 미래 의미를 평이하게 옮겼습니다.
- source_word: בְּהָרֵי שֹׁמְרוֹן
  english_pob_choice: on the mountains of Samaria
  chosen_korean: 사마리아 산들에
  alternatives_korean:
  - 사마리아의 산들에
  - 사마리아의 언덕들에
  - 사마리아 산지에
  lexicon: HALOT
  rationale: 히브리어의 ‘산들’을 보존해 지형 이미지를 살리되, 한국어 어순에 맞게 간결하게 표현했습니다.
- source_word: וְחִלֵּלוּ
  english_pob_choice: and enjoy them
  chosen_korean: 그것들을 누릴 것입니다
  alternatives_korean:
  - 그것들을 즐길 것입니다
  - 그것들을 사용할 것입니다
  - 그것들을 속되게 할 것입니다
  lexicon: HALOT
  rationale: 농경 문맥에서 ‘공적으로/일상적으로 사용하다’의 관용적 의미이므로, ‘누리다’가 ‘enjoy them’을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 사마리아 산들에서의 회복 약속
  chosen_reading: 이스라엘의 회복과 일상적 농경 생활의 재개를 예언하는 문장으로 읽었습니다.
  alternative_readings:
  - 지리적 사실 묘사로만 읽기
  - 포도원 소유권 회복의 정치적 선언으로 강조하기
  rationale: 문맥상 심판 뒤의 회복 약속이 핵심이므로, 포도원 재배와 향유의 정상화로 번역하는 것이 본문의 의도를 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §6
