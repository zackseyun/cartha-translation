id: JER.31.32
reference: Jeremiah 31:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א כַ/בְּרִ֗ית אֲשֶׁ֤ר כָּרַ֨תִּי֙ אֶת אֲבוֹתָ֔/ם בְּ/יוֹם֙ הֶחֱזִיקִ֣/י בְ/יָדָ֔/ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֖רֶץ מִצְרָ֑יִם אֲשֶׁר הֵ֜מָּה הֵפֵ֣רוּ אֶת בְּרִיתִ֗/י וְ/אָנֹכִ֛י בָּעַ֥לְתִּי בָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/032.yaml
  text: not like the covenant that I made with their fathers on the day I took them by the hand to bring them out of the land of Egypt[a], my covenant that they themselves broke, though I was their husband, declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'though I was lord over them' or 'though I ruled over them.' The Hebrew verb can carry either marital or dominion language; the Greek form quoted in Hebrews 8:9 reflects the latter sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 이집트 땅에서 그들을 데리고 나오기 위해 그들의 손을 붙들던 날에 내가 그들의 조상들과 맺은 언약과는 다릅니다. 그들이 깨뜨린 내 언약인데, 내가 그들의 남편이었습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들 위에 주인이었음에도’ 혹은 ‘내가 그들을 다스렸음에도’. 히브리어 동사는 혼인 관계와 지배 관계를 모두 가리킬 수 있으며, 히브리서 8:9의 인용 형태는 후자의 의미를 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כַבְּרִית
  english_pob_choice: not like the covenant
  chosen_korean: …와는 다릅니다
  alternatives_korean:
  - …과 같은 언약이 아닙니다
  - …에 따른 언약이 아닙니다
  lexicon: HALOT
  rationale: 비교 접두 כ의 대조를 살려 단순 부정이 아니라 ‘~와는 다르다’로 옮겼습니다.
- source_word: בְּיוֹם הֶחֱזִיקִי בְיָדָם
  english_pob_choice: on the day I took them by the hand
  chosen_korean: 그들을 데리고 나오기 위해 그들의 손을 붙들던 날
  alternatives_korean:
  - 그들의 손을 잡던 날
  - 그들을 손으로 붙들어 이끌던 날
  lexicon: HALOT
  rationale: 손을 ‘붙들다’로 옮겨 인도와 보호의 이미지를 살리고, 출애굽 목적을 ‘데리고 나오기 위해’로 자연스럽게 반영했습니다.
- source_word: בָּעַלְתִּי בָם
  english_pob_choice: though I was their husband
  chosen_korean: 내가 그들의 남편이었습니다
  alternatives_korean:
  - 내가 그들을 다스렸습니다
  - 내가 그들의 주인이었습니다
  lexicon: HALOT
  rationale: 문맥상 언약적 혼인 비유를 우선 반영해 ‘남편’으로 옮겼고, 지배 의미는 본문이 아니라 각주에서 보존하는 POB의 해석을 따랐습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 종결 공식을 한국어로 자연스럽게 옮기되, 신명기적 고유명사인 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: בָּעַלְתִּי בָם의 의미 범위
  chosen_reading: ‘내가 그들의 남편이었습니다’로 본문에 두고, 지배 의미는 본문 밖에서 처리하지 않았습니다.
  alternative_readings:
  - 내가 그들 위에 주인이었습니다
  - 내가 그들을 다스렸습니다
  rationale: 예레미야의 언약 비유 흐름에서는 혼인 관계가 핵심이며, 히브리서 8:9의 다른 반영을 본문에 끌어오지 않고 의미 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it); Contested terms table for יְהוָה
