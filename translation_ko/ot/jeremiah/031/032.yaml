  source_fidelity: 핵심 어휘와 언약·출애굽·혼인 비유는 대체로 충실합니다. 그러나 초안의 두 번째 문장(“그들이 깨뜨린 내 언약인데”)은 히브리어의 강조된 주어(‘그들 자신’)와 뒤따르는 역접(‘그러나/비록 내가…’)의 관계를 충분히 드러내지 못합니다.
  naturalness: ‘그들이 이집트 땅에서 그들을 데리고’는 동일 대명사의 연쇄로 부자연스럽고 지시 대상이 흐립니다. 또한 ‘…언약인데’는 문장 연결이 어색합니다. 출애굽의 목적절과 역접을 명시하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘언약’, ‘이집트 땅’, ‘야훼’, ‘남편’은 적절합니다. בָּעַלְתִּי בָם의 지배 의미 가능성은 각주에 보존해야 하며, 본문에서는 혼인 비유를 유지하는 것이 안전합니다.
