id: JER.31.21
reference: Jeremiah 31:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַצִּ֧יבִי לָ֣/ךְ צִיֻּנִ֗ים שִׂ֤מִי לָ/ךְ֙ תַּמְרוּרִ֔ים שִׁ֣תִי לִבֵּ֔/ךְ לַֽ/מְסִלָּ֖ה דֶּ֣רֶךְ הלכתי שׁ֚וּבִי בְּתוּלַ֣ת יִשְׂרָאֵ֔ל שֻׁ֖בִי אֶל עָרַ֥יִ/ךְ אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/021.yaml
  text: Set up road markers for yourself[a]; place guideposts for yourself. Set your heart toward the highway, the way you went. Return, virgin Israel[c][b]; return to these your cities.
  footnotes:
  - marker: a
    text: Or 'signposts' for 'road markers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'guide markers' for 'guideposts'; the Hebrew term is rare, but in context it likely refers to markers along the route.
    reason: lexical_alternative
  - marker: c
    text: '''Return'' can carry both the sense of coming back from exile and of turning back in covenant loyalty.'
    reason: alternative_reading
translation:
  language: ko
  text: 길표를 세우고[a] 표지들을 두십시오[b]. 마음을 큰길로 두십시오 — 곧 당신이 지나갔던 그 길입니다. 돌아오십시오, 이스라엘의 처녀여[c]. 돌아와서 이 당신의 성읍들로 오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길표’는 원문의 ‘road markers’에 해당하는 옮김입니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀어의 문맥상 의미를 반영해 ‘guideposts’보다 기능적으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘돌아오다’는 포로 귀환과 언약적 충성을 향한 전환을 함께 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיבִי
  english_pob_choice: Set up
  chosen_korean: 세우십시오
  alternatives_korean:
  - 설치하십시오
  - 세워 두십시오
  lexicon: HALOT
  rationale: 2인칭 여성 단수 명령형의 지시성을 살리면서, 도로 표지를 ‘세우다’라는 한국어가 가장 자연스럽습니다.
- source_word: צִיֻּנִים
  english_pob_choice: road markers
  chosen_korean: 길표
  alternatives_korean:
  - 이정표
  - 길목 표지
  - 표지판
  lexicon: HALOT
  rationale: 여기서는 실제 이동 경로에 놓는 표지를 가리키므로, ‘길표’로 간결하게 옮겨 길 안내의 기능을 드러냈습니다.
- source_word: תַּמְרוּרִים
  english_pob_choice: guideposts
  chosen_korean: 표지들
  alternatives_korean:
  - 안내표
  - 이정표들
  - 길잡이 표지들
  lexicon: HALOT
  rationale: 희귀어의 문맥상 의미가 길 안내 표지이므로, 반복을 피하면서도 기능을 보존하는 ‘표지들’을 택했습니다.
- source_word: שִׁתִי לִבֵּךְ לַמְסִלָּה דֶּרֶךְ הלכתי
  english_pob_choice: Set your heart toward the highway, the way you went
  chosen_korean: 마음을 큰길로 두십시오 — 곧 당신이 지나갔던 그 길입니다.
  alternatives_korean:
  - 마음을 큰길에 두십시오
  - 큰길, 곧 당신이 지나갔던 길을 향해 마음을 두십시오
  lexicon: HALOT
  rationale: ‘마음을 두다’는 히브리어 ‘마음을 놓다/두다’의 관용적 지시를 살리며, 뒤의 설명절을 삽입구로 풀어 ‘그 길’의 지시성을 분명히 했습니다.
- source_word: שׁוּבִי
  english_pob_choice: Return
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 돌아가십시오
  - 되돌아오십시오
  lexicon: HALOT
  rationale: 문맥상 바벨론 포로 귀환의 물리적 귀환을 강하게 지시하므로, 가장 직접적인 ‘돌아오십시오’를 사용했습니다.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  english_pob_choice: virgin Israel
  chosen_korean: 이스라엘의 처녀
  alternatives_korean:
  - 이스라엘의 동정녀
  - 이스라엘의 소녀
  lexicon: HALOT
  rationale: 예언적 인격화 표현을 그대로 살리되, 관용적으로 이해되는 ‘처녀’로 옮겨 명칭화하지 않았습니다.
theological_decisions:
- issue: 돌아오다(שׁוּב)의 의미 범위
  chosen_reading: 물리적 귀환을 기본으로 하되, 회복과 언약적 전향의 울림을 지우지 않는 ‘돌아오십시오’로 유지했습니다.
  alternative_readings:
  - 회개하십시오
  - 포로에서 돌아오십시오
  rationale: 길표, 표지, 성읍이라는 여행·귀환 이미지가 분명하므로 ‘회개하다’로 좁히지 않았습니다. 동시에 예언서의 회복 언어를 해치지 않도록 단순한 지리 이동으로도 환원하지 않았습니다.
  doctrine_reference: 포로 귀환과 언약적 회복의 긴장을 함께 보존
