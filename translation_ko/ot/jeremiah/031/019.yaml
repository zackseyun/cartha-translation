base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/019.yaml
  text: For after I turned back[a], I repented; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
  footnotes:
  - marker: a
    text: Or 'after I returned, I regretted'; the Hebrew distinguishes 'turning back' (שׁוּב) from 'repenting/regretting' (נחם).
    reason: lexical_alternative
  - marker: b
    text: '''I struck my thigh'' is a Hebrew gesture of grief, shock, or remorse.'
    reason: cultural_note
  - marker: c
    text: Or 'the reproach of my youth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 돌이킨 뒤에 회개하였고[a], 가르침을 받은 뒤에 내 허벅지를 쳤습니다[b]. 나는 부끄러워했고 또한 수치를 당했습니다. 이는 내가 젊은 날의 치욕을 짊어졌기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌아온 뒤에 뉘우쳤습니다.” 히브리어는 ‘돌이키다/돌아오다’(שׁוּב)와 ‘뉘우치다/회개하다’(נחם)를 구별합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘허벅지를 치다’는 슬픔, 놀람, 또는 뉘우침을 나타내는 히브리어의 몸짓입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “내 젊은 날의 모욕.”
    reason: lexical_alternative
