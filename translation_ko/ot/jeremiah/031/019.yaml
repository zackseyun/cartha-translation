  source_fidelity: 초안은 שׁוּב와 נחם을 구별하고 הִוָּדְעִי의 수동적 의미를 대체로 반영합니다. 그러나 יָרֵךְ는 '허리'가 아니라 '허벅지/넓적다리'이며, 이를 바로잡아야 합니다. 또한 סָפַקְתִּי, בֹּשְׁתִּי, נִכְלַמְתִּי, נָשָׂאתִי의 완료형 진술을 한국어에서도 명료하게 유지했습니다.
