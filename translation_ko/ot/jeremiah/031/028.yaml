source:
  edition: WLC
  text: וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/028.yaml
  text: And it shall be that[a], just as I watched over them to uproot and to tear down and to overthrow and to destroy and to bring harm, so I will watch over them to build and to plant, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'to bring disaster.' The Hebrew verb can denote causing calamity or harm in judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 될 것입니다. 내가 그들을 뽑아내고 허물고 무너뜨리고 멸하고 재앙을 내리려고 그들을 살폈던 것처럼, 그들을 세우고 심으려고 살필 것입니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해를 끼치려고’. 히브리어 동사는 심판으로 재앙을 내리다 또는 해를 끼치다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַּאֲשֶׁר
  english_pob_choice: And it shall be that, just as
  chosen_korean: 그들에게 행한 것을 보듯
  alternatives_korean:
  - 이와 같이 될 것입니다, 곧
  - 그리고 그때는, 마치
  lexicon: HALOT
  rationale: 예언적 비교 구조를 한국어에서 자연스럽게 풀되, 단순한 시간 연결보다 앞부분과 뒷부분의 대조를 드러내도록 했습니다.
- source_word: שָׁקַדְתִּי / אֶשְׁקֹד
  english_pob_choice: watched over / will watch over
  chosen_korean: 지켜본 것과 같이 / 지켜볼 것입니다
  alternatives_korean:
  - 감시한 것과 같이 / 감시할 것입니다
  - 유념한 것과 같이 / 유념할 것입니다
  lexicon: HALOT
  rationale: שׁקד는 단순 관찰이 아니라 적극적이고 주의 깊은 감독을 뜻하므로, 한국어에서는 ‘지켜보다’로 옮겨 동일한 반복을 살렸습니다.
- source_word: לִנְתוֹשׁ ... וְלַהֲרֹס ... וּלְהָרֵעַ
  english_pob_choice: to uproot ... to overthrow ... to bring harm
  chosen_korean: 뽑아내고 무너뜨리고 뒤엎고 멸하고 해를 끼치려고
  alternatives_korean:
  - 뽑고 허물고 전복하고 파괴하고 재앙을 주려고
  - 뿌리 뽑고 허물고 뒤엎고 멸하고 재앙을 주려고
  lexicon: HALOT
  rationale: 연속된 파괴 동사의 점층을 한국어에서도 가능한 한 구분해 살렸습니다. 마지막 הָרַע/הֵרַע는 도덕적 ‘악’이 아니라 심판으로 인한 해악이므로 ‘해를 끼치다’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어 관용에 맞게 처리하되, 본문에 나타난 신명 ‘야훼’를 보존했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: ‘יהוה’는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 직접 나타난 언약명 자체를 드러내는 것이 본문의 신학적 대비(심판과 회복의 주체)를 분명하게 하기 때문입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
