source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/זָרַעְתִּ֗י אֶת בֵּ֤ית יִשְׂרָאֵל֙ וְ/אֶת בֵּ֣ית יְהוּדָ֔ה זֶ֥רַע אָדָ֖ם וְ/זֶ֥רַע בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/027.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.
  footnotes:
  - marker: a
    text: Hebrew 'seed of man,' that is, human offspring or humankind; the phrase is paired with 'seed of beast' to describe repopulation with both people and livestock.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 야훼의 말씀이니라. 그날이 오면 내가 이스라엘 집과 유다 집에 사람의 씨와 짐승의 씨를 심겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사람의 씨’는 인간의 자손 또는 인류를 가리키며, ‘짐승의 씨’와 짝을 이루어 사람과 가축이 함께 다시 채워지는 회복을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 주의를 끄는 지시어이므로 단순한 서술로 풀지 않고, 합쇼체의 직접 주의 환기인 ‘보십시오’로 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언 구문의 고정 표현을 한국어 성경체에 맞게 옮기되, 신적 화자 표지를 분명히 하기 위해 ‘말씀이니라’를 사용했습니다.
- source_word: וְזָרַעְתִּי
  english_pob_choice: I will sow
  chosen_korean: 심겠습니다
  alternatives_korean:
  - 뿌리겠습니다
  - 파종하겠습니다
  lexicon: HALOT
  rationale: 직역하면 ‘뿌리다/파종하다’이지만, 사람과 짐승의 증식을 말하는 은유에서 한국어로는 ‘심다’가 농경적 이미지를 자연스럽게 유지하면서도 의미 전달이 가장 명료합니다.
- source_word: בֵּית יִשְׂרָאֵל ... בֵּית יְהוּדָה
  english_pob_choice: the house of Israel and the house of Judah
  chosen_korean: 이스라엘 집과 유다 집
  alternatives_korean:
  - 이스라엘의 집과 유다의 집
  - 이스라엘과 유다
  lexicon: HALOT
  rationale: ‘집’은 혈연·언약 공동체를 가리키는 מקור표현이므로, 한국어에서도 소유격으로 약화시키지 않고 그대로 유지했습니다.
- source_word: זֶרַע אָדָם
  english_pob_choice: the seed of man
  chosen_korean: 사람의 씨
  alternatives_korean:
  - 인간의 씨
  - 사람 자손
  lexicon: HALOT
  rationale: 영어 POB의 각주가 밝히듯 ‘אָדָם’은 여기서 인간 일반을 가리키므로, 현대 한국어에서 성별 오해를 줄이면서도 원문의 농경 은유를 살리는 ‘사람의 씨’로 옮겼습니다.
- source_word: וְזֶרַע בְּהֵמָה
  english_pob_choice: and the seed of beast
  chosen_korean: 짐승의 씨
  alternatives_korean:
  - 동물의 씨
  - 가축의 씨
  lexicon: HALOT
  rationale: 앞의 ‘사람의 씨’와 평행을 이루도록 ‘짐승의 씨’로 맞추어, 사람과 가축이 함께 번성하는 회복의 대비를 보존했습니다.
theological_decisions:
- issue: 예언적 회복 은유의 보존
  chosen_reading: 사람과 짐승의 번성을 단순한 인구 증가로 풀지 않고, ‘심겠습니다’라는 농경 은유를 유지했습니다.
  alternative_readings:
  - 이스라엘과 유다를 사람과 가축으로 다시 채우겠습니다
  - 이스라엘과 유다에 사람과 짐승의 후손을 늘리겠습니다
  rationale: 본문은 회복을 ‘씨를 뿌림’의 이미지로 말하므로, 이를 평이한 설명문으로 바꾸면 예언의 형상과 문학적 힘이 약해집니다. 한국어에서도 은유를 유지하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: אָדָם의 성별 비특정성
  chosen_reading: ‘사람의 씨’로 번역해 אָדָם의 일반적 인류 뜻을 드러냈습니다.
  alternative_readings:
  - 남자의 씨
  - 인간의 씨
  rationale: 본문의 אָדָם은 남성 개인이 아니라 인류 일반을 가리키므로, 성별 고정 해석을 피하면서도 원문의 대응 구조를 유지해야 합니다.
  doctrine_reference: Translation philosophy §4; Contested terms table for אָדָם
