  source_fidelity: 수정이 필요합니다. 초안의 ‘그날이 오면’은 히브리어 יָמִים בָּאִים(‘날들이 오고 있다/오고 있다’)의 복수형과 예언적 도래 공식을 단수의 조건절로 바꿉니다. 또한 נְאֻם יְהוָה는 본문에서 ‘날들이 오고 있다’ 뒤, ‘내가 뿌리겠다’ 앞에 놓입니다. בְּהֵמָה는 이 회복·재증식 문맥에서 특히 가축을 가리키므로 ‘짐승’보다 ‘가축’이 더 정확합니다.
  naturalness: ‘보십시오’와 ‘뿌리겠습니다’는 현대 표준 한국어 합쇼체에 자연스럽습니다. ‘날들이 오고 있습니다’는 히브리어의 예언적 도래 공식을 보존하면서도 자연스럽습니다. ‘야훼의 말씀입니다’는 문맥상 화자 표지를 분명히 하며 합쇼체와 일치합니다.
  terminology: 야훼, 이스라엘 집, 유다 집은 유지합니다. ‘사람의 씨’는 אָדָם의 일반적 인류 의미와 씨 뿌림 은유를 보존합니다. ‘가축의 씨’는 בְּהֵמָה의 문맥상 의미 및 사람과 가축의 재증식이라는 병행을 더 잘 나타냅니다.
