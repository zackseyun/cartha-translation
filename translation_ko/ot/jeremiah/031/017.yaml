translation:
  language: ko
  text: 당신의 앞날에는 희망이 있습니다[a]. 야훼의 말씀입니다. 당신의 자녀들이 자기 영토로 돌아올 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 후일에는 희망이 있습니다” 또는 “당신의 결말에는 희망이 있습니다”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “당신의 아들들이 자기 영토로 돌아올 것입니다.” 히브리어는 더 문자적으로 “아들들”과 “경계/영토”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוָה לְאַחֲרִיתֵךְ
  english_pob_choice: hope for your future
  chosen_korean: 당신의 앞날에는 희망이 있습니다
  alternatives_korean:
  - 당신의 미래에는 소망이 있습니다
  - 당신의 끝에는 희망이 있습니다
  - 당신의 후일에는 기대가 있습니다
  lexicon: HALOT
  rationale: אַחֲרִית는 문맥상 단순한 ‘끝’보다 앞으로 열릴 운명/미래를 가리키므로, 현대 한국어에서는 ‘앞날’이 자연스럽고 의미를 잘 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀입니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 주님의 말씀입니다
  - 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식의 선언체를 살리되, 본 프로젝트의 예외가 없는 한 YHWH는 기본값인 ‘야훼’보다 한국 교회 독자에게 더 널리 인식된 음역 ‘여호와’가 아니라는 점을 고려해도, 이 구절은 본문 전달의 단정한 종결을 위해 ‘말씀입니다’로 처리했습니다. 다만 본문 자체의 신명은 원문 기준으로 유지해야 하므로 직설적 선언 형식을 보존했습니다.
- source_word: וְשָׁבוּ
  english_pob_choice: will return
  chosen_korean: 돌아올 것입니다
  alternatives_korean:
  - 돌아오게 될 것입니다
  - 되돌아올 것입니다
  - 귀환할 것입니다
  lexicon: HALOT
  rationale: 예언적 완료의 미래 뜻을 자연스러운 한국어 미래형으로 옮겼습니다. ‘돌아오다’가 가장 직접적으로 회복과 귀환의 의미를 전달합니다.
- source_word: בָנִים
  english_pob_choice: your children
  chosen_korean: 당신의 자녀들
  alternatives_korean:
  - 당신의 아들들
  - 당신의 아들들이
  - 당신의 후손들
  lexicon: HALOT
  rationale: 문맥상 특정한 남성 자손만이 아니라 회복될 공동체의 후손 전체를 가리키므로, 성중립적으로 ‘자녀들’이 뜻을 더 정확히 반영합니다.
- source_word: לִגְבוּלָם
  english_pob_choice: to their own territory
  chosen_korean: 자기 영토로
  alternatives_korean:
  - 자기 경계로
  - 자기 땅으로
  - 자기 지역으로
  lexicon: HALOT
  rationale: גְּבוּל은 경계선 자체보다 ‘영역/영토’의 의미로 쓰일 수 있으므로, 귀환의 목적지를 분명하게 하는 ‘자기 영토’가 가장 적절합니다.
theological_decisions:
- issue: 예언적 위로 선언의 어조
  chosen_reading: “당신의 앞날에는 희망이 있습니다”로 시작해, 여호와의 권위 있는 선언과 자녀들의 귀환을 한 문장 흐름으로 연결했습니다.
  alternative_readings:
  - “당신의 미래에는 소망이 있습니다”
  - “당신의 끝에는 희망이 있습니다”
  rationale: 본문은 비탄의 대상에게 주어지는 회복 약속이므로, 한국어에서도 단순 정보가 아니라 위로와 보증의 선언으로 들리게 해야 합니다.
  doctrine_reference: Jeremiah 31:15-17 맥락의 위로/회복 약속
