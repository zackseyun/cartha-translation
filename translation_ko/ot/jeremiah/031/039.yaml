  text: 그리고 측량줄은 더 멀리, 곧 게랲 언덕 맞은편으로 나아가서, 그 뒤에는 고아 쪽으로 돌아갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더 멀리’는 עוֹד의 공간적 의미를 따른 번역입니다. 이 단어는 문맥에 따라 ‘다시’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘맞은편으로’는 נֶגְדּוֹ의 방향·대면 관계를 살린 번역입니다. 직역하면 ‘그 앞에/그 반대편에’가 될 수 있습니다.
    reason: lexical_alternative
