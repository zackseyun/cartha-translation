  text: 측량줄은 더[a] 뻗어 나가 그 맞은편으로[b] 게렙 언덕까지 이르고, 고아 쪽으로 돌아갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더’는 עוֹד의 공간적 의미를 따른 번역입니다. 이 단어는 문맥에 따라 ‘다시’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 맞은편으로’는 נֶגְדּוֹ의 방향·대면 관계를 살린 번역입니다. 직역하면 ‘그 앞에’ 또는 ‘그 반대편에’가 될 수 있습니다. 접미사 ‘그’가 가리키는 대상은 주변 경계 묘사에 비추어 추론됩니다.
    reason: lexical_alternative
