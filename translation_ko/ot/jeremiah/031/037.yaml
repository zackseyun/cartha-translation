base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/037.yaml
  text: 'Thus says Yahweh: If the heavens above can be measured[a], and the foundations of the earth below can be searched out, then I also will reject all the offspring of Israel for all that they have done, declares Yahweh.'
  footnotes:
  - marker: a
    text: Or 'cast off all the seed of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. "위의 하늘을 측량할 수 있고 아래의 땅의 기초를 탐지할 수 있다면, 나도 이스라엘의 모든 자손을 그들이 한 모든 일 때문에 버리겠습니다. 야훼의 말씀이니라."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘탐지할 수 있다’는 원문의 ‘searched out’의 의미를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식의 격식을 살리되, 한국어에서는 자연스러운 보고체인 ‘이렇게 말씀하십니다’를 택해 합쇼체 문맥에 맞췄습니다.
- source_word: יִמַּדּוּ ... וְיֵחָקְר֥וּ
  english_pob_choice: can be measured / can be searched out
  chosen_korean: 측량할 수 있고 ... 탐지할 수 있다면
  alternatives_korean:
  - 측정할 수 있고 ... 찾아낼 수 있다면
  - 재어 볼 수 있고 ... 조사해 낼 수 있다면
  lexicon: HALOT
  rationale: יָמַד/חָקַר의 수동 가능성을 한국어의 ‘-할 수 있다’로 옮겨, 불가능한 가정이라는 수사적 조건을 보존했습니다. ‘탐지하다’는 ‘search out’의 철저한 조사 의미를 비교적 간결하게 담습니다.
- source_word: מוֹסְדֵי אֶרֶץ לְמָטָּה
  english_pob_choice: the foundations of the earth below
  chosen_korean: 아래의 땅의 기초
  alternatives_korean:
  - 아래의 땅의 토대
  - 땅 아래의 기초
  lexicon: HALOT
  rationale: 우주론적 병행을 살리기 위해 ‘위의 하늘’과 대응되는 아래 방향 표현으로 옮겼고, ‘기초’는 earth's foundations의 문자적 이미지를 유지합니다.
- source_word: גַּם אֲנִי אֶמְאַ֨ס
  english_pob_choice: then I also will reject
  chosen_korean: 나도 ... 버리겠습니다
  alternatives_korean:
  - 나 역시 ... 거절하겠습니다
  - 나도 ... 내치겠습니다
  lexicon: HALOT
  rationale: מאס의 언약적 배척을 한국어의 ‘버리다’로 옮겨 관계 단절의 강도를 드러냈습니다. ‘reject’보다 더 차갑게 들릴 수 있으나, 문맥의 언약적 긴장을 유지합니다.
- source_word: בְּ/כָל זֶרַע יִשְׂרָאֵל
  english_pob_choice: all the offspring of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘의 모든 씨
  - 이스라엘의 모든 후손
  lexicon: HALOT
  rationale: זֶרַע의 집합적 의미를 한국어의 관용적 표현 ‘자손’으로 옮겨, 혈통·언약 공동체의 연속성을 함께 드러냈습니다.
theological_decisions:
- issue: 조건문의 수사적 성격
  chosen_reading: 본문은 실제 가능성이 아니라, 하늘과 땅의 질서가 무너지는 불가능한 가정을 통해 이스라엘 전체를 완전히 버리지는 않으실 것이라는 뜻을 강조합니다.
  alternative_readings:
  - 단순한 조건문으로만 읽는 해석
  rationale: 31:35–37의 문맥은 창조 질서의 불변성을 언약적 보증으로 사용합니다. 따라서 조건형을 유지하되, 한국어가 그 수사적 불가능성을 느끼도록 했습니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 해소하지 말고 문맥이 드러내게 할 것'
