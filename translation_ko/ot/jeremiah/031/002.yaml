translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 칼에서 살아남은 백성은 광야에서 호의를 얻었습니다. 이스라엘이 안식을 얻으려고 나아갈 때에.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 이스라엘에게 안식을 주려고 나아갈 때에.’ 히브리어의 마지막 절은 어렵고 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 하나님의 이름은 학문적 음역인 야훼로 옮겨, 언약적 고유성을 보존했습니다.
- source_word: מָצָא חֵן
  english_pob_choice: found favor
  chosen_korean: 은총을 얻었습니다
  alternatives_korean:
  - 호의를 얻었습니다
  - 은혜를 입었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘호의를 얻다/받다’이므로, 문맥에 맞는 자연스러운 현대 한국어로 옮기되 신학적 뉘앙스가 과도하게 확정되지 않도록 했습니다.
- source_word: עַם שְׂרִידֵי חָרֶב
  english_pob_choice: the people who survived the sword
  chosen_korean: 칼에서 살아남은 백성
  alternatives_korean:
  - 칼을 면한 백성
  - 칼의 생존자들
  lexicon: HALOT
  rationale: ‘칼’은 전쟁·심판의 이미지를 직접 살리고, ‘살아남은 백성’은 잔존자/생존자라는 의미를 현대어로 분명하게 전달합니다.
- source_word: הָלוֹךְ לְהַרְגִּיעוֹ יִשְׂרָאֵל
  english_pob_choice: Israel, when it went to find rest for him
  chosen_korean: 이스라엘은 — 그것이 안식을 찾으러 갈 때였습니다
  alternatives_korean:
  - 이스라엘이 안식을 주러 갔을 때였습니다
  - 이스라엘이 그에게 안식을 주러 갔을 때였습니다
  - 이스라엘이 안식을 찾으러 갔을 때였습니다
  lexicon: HALOT
  rationale: 마지막 절은 주어와 목적어, 동사의 지시 대상이 압축되어 있어 강하게 매끄럽게 만들기보다, 이동과 안식의 방향만 살려 해석 여지를 남겼습니다.
theological_decisions:
- issue: 마지막 절의 해석상 모호성
  chosen_reading: ‘이스라엘은 — 그것이 안식을 찾으러 갈 때였습니다’로 옮겨, 히브리어의 애매함을 보존했습니다.
  alternative_readings:
  - ‘이스라엘이 안식을 주러 갔을 때였습니다’
  - ‘그가 이스라엘에게 안식을 주러 갔을 때였습니다’
  rationale: 히브리어는 최종 절의 주체와 수혜자가 분명히 정리되지 않으므로, 본문이 허용하는 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, ‘Preserve theological tension rather than resolve it.’
