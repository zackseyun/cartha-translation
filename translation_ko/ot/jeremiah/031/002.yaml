revisions:
- from: 야훼께서 이렇게 말씀하십니다. 칼에서 살아남은 백성이 광야에서 은총을 얻었습니다. 이스라엘은 — 그것이 안식을 찾으러 갈 때였습니다.[a]
  to: 야훼께서 이렇게 말씀하십니다. 칼에서 살아남은 백성은 광야에서 호의를 얻었습니다. 이스라엘이 안식을 얻으려고 나아갈 때에.[a]
  rationale: 마지막 절은 난해한 원문의 주요 해석 가능성 가운데 하나를 자연스러운 한국어로 본문에 제시하고, 주어·목적어 및 사역 동사의 관계를 다르게 파악하는 주요 독법을 각주에 보존했습니다. 이렇게 하여 원문의 해석상 긴장을 유지하면서도 한국어 본문의 문법성과 문체를 회복했습니다.
