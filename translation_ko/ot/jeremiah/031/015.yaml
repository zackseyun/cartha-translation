id: JER.31.15
reference: Jeremiah 31:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה ק֣וֹל בְּ/רָמָ֤ה נִשְׁמָע֙ נְהִי֙ בְּכִ֣י תַמְרוּרִ֔ים רָחֵ֖ל מְבַכָּ֣ה עַל בָּנֶ֑י/הָ מֵאֲנָ֛ה לְ/הִנָּחֵ֥ם עַל בָּנֶ֖י/הָ כִּ֥י אֵינֶֽ/נּוּ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/015.yaml
  text: 'Thus says Yahweh: “A voice is heard in Ramah[a], lamentation and bitter weeping—Rachel weeping for her children. She refuses to be comforted for her children[b], because they are no more.”'
  footnotes:
  - marker: a
    text: Or 'because he is no more'; Hebrew has a singular form in this idiom, though the context speaks of Rachel's children collectively.
    reason: lexical_alternative
  - marker: b
    text: Ramah was a town associated with the territory of Benjamin; Rachel is poetically portrayed as the matriarch mourning her descendants.
    reason: cultural_note
translation:
  language: ko
  text: 여호와께서 이렇게 말씀하십니다. 「라마에서 소리가 들립니다. 애통함과 쓰라린 울음소리입니다. 라헬이 자기 자녀들을 두고 울고 있습니다. 그 자녀들을 위로받기를 거부합니다. 그들이 더 이상 없기 때문입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라마는 베냐민 지파 ტერიტორი와 연결된 성읍이며, 라헬은 그 후손들을 애도하는 족장적 어머니로 시적으로 그려집니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 여호와께서 이렇게 말씀하십니다
  alternatives_korean:
  - 이렇게 말씀하십니다
  - 여호와께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 사자공식 כֹּה אָמַר을 현대 합쇼체에서 가장 자연스럽게 살리면서, 여호와를 본문에 직접 드러냈습니다.
- source_word: קוֹל ... נִשְׁמָע
  english_pob_choice: A voice is heard
  chosen_korean: 소리가 들립니다
  alternatives_korean:
  - 한 목소리가 들립니다
  - 외침이 들립니다
  lexicon: HALOT
  rationale: קוֹל은 ‘목소리/소리’ 모두 가능하지만, 이어지는 통곡의 병행법을 살려 광의의 ‘소리’로 옮겼습니다.
- source_word: נְהִי בְּכִי תַמְרוּרִים
  english_pob_choice: lamentation and bitter weeping
  chosen_korean: 애통함과 쓰라린 울음소리입니다
  alternatives_korean:
  - 통곡과 쓰라린 울음입니다
  - 애곡과 쓰라린 눈물입니다
  lexicon: HALOT
  rationale: 명사적 병렬을 한국어에서도 두 겹의 애도 표현으로 살리되, ‘울음소리’로 청각적 장면성을 보존했습니다.
- source_word: בָּנֶיהָ / עַל בָּנֶיהָ
  english_pob_choice: her children
  chosen_korean: 자녀들을
  alternatives_korean:
  - 아이들을
  - 아들들을
  lexicon: HALOT
  rationale: 문맥상 후손 전체를 가리키는 집합적 의미이므로, 남성에 한정되지 않는 ‘자녀들’이 가장 자연스럽습니다.
- source_word: מֵאֲנָה לְהִנָּחֵם
  english_pob_choice: She refuses to be comforted
  chosen_korean: 위로받기를 거부합니다
  alternatives_korean:
  - 위로받는 것을 거부합니다
  - 위로를 받지 않으려 합니다
  lexicon: HALOT
  rationale: 니팔 부정사 לְהִנָּחֵם의 수동적 의미를 한국어에서 자연스러운 피동 표현으로 옮겼습니다.
- source_word: כִּי אֵינֶנּוּ
  english_pob_choice: because they are no more
  chosen_korean: 그들이 더 이상 없기 때문입니다
  alternatives_korean:
  - 그들이 이제 없기 때문입니다
  - 그들이 사라졌기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 단수형 관용을 쓰지만 앞선 집합 명사 ‘자녀들’을 따라 한국어에서는 복수로 옮겨 애가의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 라헬의 화자화와 상징적 인물성
  chosen_reading: 라헬을 실제 개인의 현재 행위가 아니라 자손을 애도하는 족장적 대표 인물로 살렸습니다.
  alternative_readings:
  - 역사적 라헬의 직접적 애곡으로 읽기
  - 단순한 시적 장치로만 약화시키기
  rationale: 본문의 문학적 의인화와 공동체적 비탄을 유지해야 하므로, 라헬의 대표성을 흐리지 않고 번역했습니다.
  doctrine_reference: 문학적-신학적 표상을 보존하는 번역 원칙
- issue: ‘그들이 더 이상 없기 때문입니다’의 수량 선택
  chosen_reading: 히브리어의 단수 관용을 한국어에서는 집합적 복수로 풀어 번역했습니다.
  alternative_readings:
  - 그가 더 이상 없기 때문입니다
  - 그들이 사라졌기 때문입니다
  rationale: 직역의 형식보다 문맥상 집합적 상실이 더 분명해야 하므로, 본문이 말하는 애도의 범위를 유지했습니다.
  doctrine_reference: 문법적 긴장 보존과 문맥 우선의 번역 원칙
