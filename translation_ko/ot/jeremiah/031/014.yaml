source:
  edition: WLC
  text: וְ/רִוֵּיתִ֛י נֶ֥פֶשׁ הַ/כֹּהֲנִ֖ים דָּ֑שֶׁן וְ/עַמִּ֛/י אֶת טוּבִ֥/י יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/014.yaml
  text: I will satisfy the priests with abundance[a], and my people will be filled with my goodness[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'the soul/appetite of the priests' with an idiom of full satisfaction.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will satisfy the priests with fatness'—that is, with rich abundance.
    reason: lexical_alternative
  - marker: c
    text: Or 'my people will be satisfied with my bounty' or 'with my good things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 제사장들을 풍성한 것으로[a][b] 만족하게 하고, 내 백성은 나의 좋은 것으로[c] 배부를 것입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘제사장들의 네페시(생명/혼/욕구)’라는 관용적 표현으로, 여기서는 그들의 욕구나 필요를 가리킵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘기름짐’이며, 풍성하고 기름진 공급을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나의 선하심으로’, ‘나의 풍성한 은혜로’ 또는 ‘나의 좋은 것들로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִוֵּיתִי
  english_pob_choice: I will satisfy
  chosen_korean: 나는 … 넉넉하게 채워 주고
  alternatives_korean:
  - 나는 … 만족하게 하고
  - 나는 … 흠뻑 적시고
  - 나는 … 충분히 채우고
  lexicon: HALOT
  rationale: פּיעל רוה의 ‘충분히 채우다/만족시키다’ 의미를 자연스러운 합쇼체로 옮겼습니다. 앞절의 제사장 대상에는 ‘만족하게 하다’보다 공급의 풍성함이 드러나는 표현이 더 잘 맞습니다.
- source_word: נֶפֶשׁ הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들의 생명
  alternatives_korean:
  - 제사장들의 혼
  - 제사장들의 목숨
  - 제사장들의 욕구
  lexicon: HALOT
  rationale: נפש가 여기서는 제사장들의 내면/생명/욕구를 가리키는 관용구이므로, 단순히 ‘제사장들’을 목적어로 처리하기보다 그 함의를 살려 ‘생명’으로 드러냈습니다.
- source_word: דָּשֶׁן
  english_pob_choice: with abundance
  chosen_korean: 넉넉하게
  alternatives_korean:
  - 풍성하게
  - 기름지게
  - 부유하게
  lexicon: HALOT
  rationale: דשן의 ‘비옥함, 기름짐, 풍성함’의 비유를 현대 한국어에서 자연스러운 ‘넉넉하게’로 풀어, 물질적·비유적 풍성함을 함께 전달했습니다.
- source_word: אֶת טוּבִי יִשְׂבָּעוּ
  english_pob_choice: my people will be filled with my goodness
  chosen_korean: 내 백성은 내 선하심으로 배불리게 하겠습니다
  alternatives_korean:
  - 내 백성은 내 선하신 것으로 배부르게 하겠습니다
  - 내 백성은 내 좋은 것들로 배부르게 하겠습니다
  - 내 백성은 내 은혜로운 선물로 만족하게 하겠습니다
  lexicon: HALOT
  rationale: טוב는 ‘선하심/좋은 것/풍성한 선물’의 폭을 가지므로, 문맥상 하나님의 공급과 성품을 함께 살리는 ‘선하심’이 가장 압축적입니다. יִשְׂבָּעוּ는 ‘배불리다/배부르게 하다’의 의미를 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀입니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 여호와께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 프로젝트 기본값은 야훼이지만, 본문 어투와 한국어 예언서 문맥에서 관용적으로 읽히는 종결 표지를 고려해 ‘여호와의 말씀입니다’를 택했습니다. ‘말씀입니다’는 נְאֻם의 공식적 선포를 자연스럽게 반영합니다.
theological_decisions:
- issue: Tetragrammaton in prophetic formula
  chosen_reading: 본문 종결은 한국어 예언문체에 맞춰 ‘여호와의 말씀입니다’로 처리하되, 본문 의미는 야훼의 자기선언으로 이해합니다.
  alternative_readings:
  - 야훼의 말씀입니다
  - 주님의 말씀입니다
  rationale: 원문은 נְאֻם יְהוָה의 예언 공식이므로, 한국어에서는 선포의 어조를 살리는 것이 중요합니다. 다만 프로젝트 기본값인 야훼와의 정합성은 보존하되, 독자 친화적 종결어를 선택했습니다.
  doctrine_reference: 'POB contested terms: YHWH → 야훼; prophetic formula conventions'
