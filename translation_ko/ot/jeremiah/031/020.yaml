revisions:
- from: 에브라임이 내게 귀한 아들이냐, 사랑스러운 자식이냐? 내가 그를 말할 때마다 나는 여전히 그를 꼭 기억한다. 그러므로 내 속이 그를 향해 뒤흔들리니, 나는 반드시 그에게 긍휼을 베풀겠다. — 야훼의 말씀이니라.[a][b]
  to: 에브라임은 내게 귀한 아들입니까, 사랑스러운 자식입니까? 내가 그에 대하여 말씀하실 때마다[a], 나는 여전히 그를 반드시 기억합니다. 그러므로 내 마음 깊은 곳이 그를 생각하여 요동합니다[b]. 나는 반드시 그에게 긍휼을 베풀겠습니다. 야훼의 말씀입니다.
  rationale: 원문의 모호한 전치사 בּוֹ는 ‘그에 대하여’로 옮기고 각주에서 가능한 문맥적 읽기를 제시하여 해석을 과도하게 확정하지 않았습니다. 내장 비유는 본문에서 자연스러운 정서 표현으로, 문자적 표현은 각주로 보존했습니다. 또한 전체를 현대 합쇼체로 통일하고 두 각주 표지를 해당 구절에 배치했습니다.
