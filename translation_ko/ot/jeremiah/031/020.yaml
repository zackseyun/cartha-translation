id: JER.31.20
reference: Jeremiah 31:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/בֵן֩ יַקִּ֨יר לִ֜/י אֶפְרַ֗יִם אִ֚ם יֶ֣לֶד שַׁעֲשֻׁעִ֔ים כִּֽי מִ/דֵּ֤י דַבְּרִ/י֙ בּ֔/וֹ זָכֹ֥ר אֶזְכְּרֶ֖/נּוּ ע֑וֹד עַל כֵּ֗ן הָמ֤וּ מֵעַ/י֙ ל֔/וֹ רַחֵ֥ם אֲֽרַחֲמֶ֖/נּוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/020.yaml
  text: Is Ephraim a precious son to me[a], a child of delight? For as often as I speak of him, I still surely remember him. Therefore my inward parts are stirred for him; I will surely have compassion on him[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'For whenever I speak of him.' The Hebrew preposition can be read more neutrally ('of/concerning him'), but in context 'against him' fits the contrast with God's continuing remembrance after words of judgment.
    reason: alternative_reading
  - marker: b
    text: Literally 'my inward parts are stirred for him,' a Hebrew idiom for deep compassion; compare 'my heart yearns for him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 에브라임은 내게 귀한 아들입니까, 사랑스러운 자식입니까? 내가 그에 대하여 말씀하실 때마다[a], 나는 여전히 그를 반드시 기억합니다. 그러므로 내 마음 깊은 곳이 그를 생각하여 요동합니다[b]. 나는 반드시 그에게 긍휼을 베풀겠습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בּוֹ는 ‘그에 대하여’로 읽을 수 있으며, 문맥에 따라 ‘그를 향하여’ 또는 ‘그를 거슬러’라는 뜻으로 이해되기도 합니다. 본문은 원문의 방향성을 단정하지 않았습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘내 내장이 그를 향하여 요동한다’는 뜻입니다. 이는 깊은 연민과 긍휼을 나타내는 히브리어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵן יַקִּיר
  english_pob_choice: a precious son
  chosen_korean: 귀한 아들
  alternatives_korean:
  - 소중한 아들
  - 귀염받는 아들
  lexicon: HALOT
  rationale: יַקִּיר의 핵심은 ‘귀하고 소중함’이므로, 문맥의 수사적 질문을 살리면서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אִם יֶלֶד שַׁעֲשֻׁעִים
  english_pob_choice: a child of delight
  chosen_korean: 사랑스러운 자식
  alternatives_korean:
  - 기쁨의 자식
  - 즐거움의 자식
  lexicon: HALOT
  rationale: 직역형인 ‘기쁨의 자식’도 가능하지만, 애정과 delight의 정서를 현재 한국어에서 더 직접적으로 드러내는 표현을 택했습니다.
- source_word: מִדֵּי דַבְּרִי בּוֹ
  english_pob_choice: For as often as I speak against him
  chosen_korean: 내가 그를 말할 때마다
  alternatives_korean:
  - 내가 그에 대해 말할 때마다
  - 내가 그를 언급할 때마다
  lexicon: HALOT
  rationale: 히브리어 전치사 בּוֹ는 ‘그에 대하여/그를’로 읽을 수 있어, 여기서는 판단을 과도하게 정하지 않고 반복 행위를 살리는 가장 중립적 표현으로 옮겼습니다.
- source_word: הָמוּ מֵעַי לוֹ
  english_pob_choice: my inward parts are stirred for him
  chosen_korean: 내 속이 그를 향해 뒤흔들리니
  alternatives_korean:
  - 내 창자가 그를 향해 뒤흔들리니
  - 내 마음이 그를 향해 요동치니
  lexicon: HALOT
  rationale: מֵעַי는 문자적으로 ‘내장/속’을 뜻하며, 깊은 정서적 동요와 긍휼의 관용구이므로, 직설적이되 현대어로도 자연스러운 표현을 선택했습니다.
- source_word: רַחֵם אֲרַחֲמֶנּוּ
  english_pob_choice: I will surely have compassion on him
  chosen_korean: 나는 반드시 그에게 긍휼을 베풀겠다
  alternatives_korean:
  - 나는 반드시 그를 불쌍히 여기겠다
  - 나는 반드시 그에게 자비를 베풀겠다
  lexicon: HALOT
  rationale: רחם의 핵심은 감정적 연민에 근거한 긍휼이므로, 교회어법에 지나치게 묶이지 않으면서도 예언적 선포의 무게를 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이라
  alternatives_korean:
  - 야훼의 선언이다
  - 야훼께서 말씀하신다
  lexicon: HALOT
  rationale: 예언문 수식어로서의 נְאֻם는 결론적 권위를 나타내므로, 본문 끝에서 선포 형식을 분명히 드러내는 방식으로 처리했습니다.
theological_decisions:
- issue: 에브라임의 지칭 범위
  chosen_reading: 에브라임을 북이스라엘 백성을 대표하는 인격화된 ‘아들/자식’으로 읽었습니다.
  alternative_readings:
  - 개별 조상 에브라임만 가리키는 읽기
  rationale: 문맥상 에브라임은 집단적 실재를 대표하는 인격화된 호칭이므로, 가족 은유와 하나님의 지속되는 긍휼을 함께 보존했습니다.
  doctrine_reference: 문맥의 인격화와 언약적 긴장을 유지합니다.
- issue: ‘말하다’의 방향성
  chosen_reading: 히브리어의 중립적 가능성을 따라 ‘그를 말할 때마다’로 두어, 심판의 말과 기억의 말 사이의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - 그를 대하여 말할 때마다
  - 그를 향해 말할 때마다
  - 그를 거슬러 말할 때마다
  rationale: 본문은 분명한 단일 방향으로만 고정하기보다, 하나님이 에브라임을 언급하실 때마다 이어지는 기억과 긍휼을 강조합니다.
  doctrine_reference: 원문이 가진 해석의 긴장을 해소하지 않고 보존합니다.
