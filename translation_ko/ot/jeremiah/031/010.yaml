id: JER.31.10
reference: Jeremiah 31:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְע֤וּ דְבַר יְהוָה֙ גּוֹיִ֔ם וְ/הַגִּ֥ידוּ בָ/אִיִּ֖ים מִ/מֶּרְחָ֑ק וְ/אִמְר֗וּ מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔/נּוּ וּ/שְׁמָר֖/וֹ כְּ/רֹעֶ֥ה עֶדְרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/010.yaml
  text: Hear the word of the LORD, O nations, and declare it in the coastlands far away; say, “He who scattered Israel will gather him and will keep him as a shepherd keeps his flock.”
translation:
  language: ko
  text: 여호와[a]의 말씀을 들으십시오, 민족들아. 먼 해안 지대[b]에 선포하고, 이렇게 말하십시오. “이스라엘을 흩으신 분께서 그를 모으시고, 목자가 자기 양 떼를 지키듯 그를 지키실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호와’는 히브리어 본문의 하나님의 고유신명 YHWH를 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 히브리어 אִיִּים는 문맥에 따라 섬들 또는 해안 지대를 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: YHWH
  rationale: English POB가 LORD로 돌렸지만, 본문 히브리어의 고유신명은 직접 드러내는 편이 더 원문-가깝고, 한국어 본문에서는 여호와를 관용적으로 읽을 수 있어 선택했습니다.
- source_word: גּוֹיִם
  english_pob_choice: O nations
  chosen_korean: 민족들아
  alternatives_korean:
  - 나라들아
  - 열방아
  lexicon: goyim
  rationale: 호격의 대상이 이방 민족 일반이므로, 문어체이면서도 현대 한국어에서 자연스러운 ‘민족들아’로 옮겼습니다.
- source_word: בָאִיִּים מִמֶּרְחָק
  english_pob_choice: in the coastlands far away
  chosen_korean: 멀리 있는 해안 지역들에
  alternatives_korean:
  - 먼 해안들에
  - 먼 섬들에
  lexicon: iyim + merachoq
  rationale: 해안/섬 지역을 가리키는 지리적 표현을 살리되, 한국어 독자가 이해하기 쉽게 ‘해안 지역들’로 풀었습니다.
- source_word: מְזָרֵה יִשְׂרָאֵל
  english_pob_choice: He who scattered Israel
  chosen_korean: 이스라엘을 흩으신 분이
  alternatives_korean:
  - 이스라엘을 흩어 버리신 분이
  - 이스라엘을 흩으시는 분이
  lexicon: mzarh + participle
  rationale: 과거의 흩으심을 나타내는 분사적 표현을 살려, 하나님의 주권적 행위를 드러내는 수동적 완료 뉘앙스로 번역했습니다.
theological_decisions:
- issue: 야훼의 심판과 회복의 동일 주체성
  chosen_reading: 이스라엘을 흩으신 분이 곧 그를 모으시고 지키시는 분으로 이어지게 했습니다.
  alternative_readings:
  - 흩으신 분과 모으시는 분을 분리하여 옮김
  - 회복 동사만 강조하여 주체성을 약화시킴
  rationale: 문맥은 흩으심과 모으심이 같은 주권자에게 속함을 강조하므로, 동일 주체를 분명히 드러내는 번역이 신학적으로도 본문에 충실합니다.
  doctrine_reference: 예레미야 31장의 포로 회복과 언약 회복 주제
- issue: 문장부사 ‘will keep’의 반복성
  chosen_reading: ‘지키실 것입니다’로 반복해 목자의 보호 이미지를 유지했습니다.
  alternative_readings:
  - ‘보호하실 것입니다’로 일반화
  - ‘간수하실 것입니다’로 과도하게 축약
  rationale: 히브리어의 שׁמר는 단순 보존보다 보호적 돌봄을 포함하므로, 목자 비유와 맞물리게 ‘지키다’로 옮겼습니다.
  doctrine_reference: 시편의 목자-보호 이미지 및 언약적 돌봄
