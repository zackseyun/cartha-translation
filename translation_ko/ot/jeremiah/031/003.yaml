  text: מֵ/רָח֕וֹק יְהוָ֖ה נִרְאָ֣ה לִ֑/י וְ/אַהֲבַ֤ת עוֹלָם֙ אֲהַבְתִּ֔י/ךְ עַל כֵּ֖ן מְשַׁכְתִּ֥י/ךְ חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/003.yaml
  text: 'From far away Yahweh appeared to me: “I have loved you with an everlasting love[b][a]; therefore I have drawn you with steadfast love.”'
  footnotes:
  - marker: a
    text: Or 'The LORD appeared to him from afar,' depending on whether 'from far away' is taken with 'appeared' and whether the pronominal reading is understood differently in context.
    reason: alternative_reading
  - marker: b
    text: '''Steadfast love'' translates Hebrew חֶסֶד, a term often associated with loyal, covenantal love; alternatively, ''covenant faithfulness'' or ''lovingkindness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 먼 곳에서 야훼께서 내게 나타나셨습니다. 「내가 너를 영원한 사랑으로 사랑하였으므로, 그러므로 내가 너를 한결같은 사랑으로 이끌었습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먼 곳에서’는 ‘나타나셨습니다’에 연결할 수도 있고, ‘내게’와 함께 ‘멀리서 내게 나타나셨습니다’로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד의 의미 범위를 옮긴 것으로, ‘신실한 사랑’ 또는 ‘언약적 사랑’으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרָחוֹק
  english_pob_choice: From far away
  chosen_korean: 먼 곳에서
  alternatives_korean:
  - 멀리서
  - 아득한 곳에서
  lexicon: HALOT
  rationale: מִן + רָחוֹק의 거리감을 자연스러운 현대 한국어로 살리되, ‘아득히’처럼 시적으로 과장된 표현은 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사를 보존하기 위해 전통적 대치어 ‘주’ 대신 하나님의 이름을 음역한 ‘야훼’를 사용했습니다.
- source_word: חָסֶד
  english_pob_choice: steadfast love
  chosen_korean: 한결같은 사랑
  alternatives_korean:
  - 인애
  - 신실한 사랑
  - 언약적 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실성과 사랑의 지속성을 함께 드러내면서도, 한국어에서 의미가 비교적 분명한 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘내가 너를 이끌었습니다’의 동사 뉘앙스
  chosen_reading: מְשַׁכְתִּיךְ를 직접적으로 ‘이끌었습니다’로 옮겨, 하나님의 주도적 끌어오심을 살렸습니다.
  alternative_readings:
  - 끌어당겼습니다
  - 당기셨습니다
  - 너를 내게로 끌어오셨습니다
  rationale: 문맥상 단순한 감정 표현이 아니라, 야훼의 지속적이고 유효한 은혜 행위를 말하므로 ‘이끌다’가 가장 오독을 줄입니다.
  doctrine_reference: Translation philosophy §§3, 5, 6
- issue: 직설화법 인용부의 평서형 유지
  chosen_reading: 하나님의 직접 인용은 한국어 합쇼체 평서문으로 유지했습니다.
  alternative_readings:
  - 반말형 인용
  - 기도체
  rationale: 예언적 선언의 권위를 보존하면서도 현대 표준어의 문체를 유지하기 위한 선택입니다.
  doctrine_reference: Korean target style guidelines
