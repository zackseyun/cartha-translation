id: JER.31.24
reference: Jeremiah 31:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָ֥שְׁבוּ בָ֛/הּ יְהוּדָ֥ה וְ/כָל עָרָ֖י/ו יַחְדָּ֑ו אִכָּרִ֕ים וְ/נָסְע֖וּ בַּ/עֵֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/024.yaml
  text: And Judah and all its cities will dwell there together[a], farmers and those who journey with the flock.
  footnotes:
  - marker: a
    text: Or 'and shepherds who travel with the flock.' The Hebrew says literally 'and they journey/move about with the flock,' likely referring to pastoralists.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다와 그 모든 성읍이 그곳에 함께 살며, 농부들과 양 떼와 함께 다니는 자들도 그러할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '양 떼와 함께 여행하는 목자들'로 옮길 수도 있습니다. 히브리어는 문자적으로 '그리고 그들은 양 떼와 함께 이동한다/다닌다'라고 하며, 아마도 목축 유목민을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  english_pob_choice: will dwell there
  chosen_korean: 그곳에 함께 살며
  alternatives_korean:
  - 그곳에 거하며
  - 그곳에 살며
  lexicon: HALOT
  rationale: יָשַׁב의 거주 의미를 살리되, 예언적 미래 문맥에 맞게 합쇼체로 자연스럽게 옮겼습니다. 영어 POB의 'there'는 3음절 지시를 유지하는 locative로 보고 '그곳에'로 반영했습니다.
- source_word: יְהוּדָה ... וְכָל עָרָיו
  english_pob_choice: Judah and all its cities
  chosen_korean: 유다와 그 모든 성읍
  alternatives_korean:
  - 유다와 그 모든 도시
  - 유다와 모든 성읍
  lexicon: HALOT
  rationale: 유다는 지역/백성의 집합명사로 보아 고유명사를 유지했고, עָרִים은 현대 독자에게 자연스러운 '성읍'으로 옮겼습니다. '그 모든'은 집합체에 속한 도시들을 가리키는 소유 관계를 살립니다.
- source_word: אִכָּרִים
  english_pob_choice: farmers
  chosen_korean: 농부들
  alternatives_korean:
  - 농사꾼들
  - 경작자들
  lexicon: HALOT
  rationale: אָכָּרִים은 토지를 일구는 농업 노동자를 가리키므로, 현대 한국어에서 가장 분명한 대응어인 '농부들'을 택했습니다.
- source_word: וְנָסְעוּ בָּעֵדֶר
  english_pob_choice: those who journey with the flock
  chosen_korean: 양 떼와 함께 다니는 자들
  alternatives_korean:
  - 양 떼와 함께 여행하는 자들
  - 무리와 함께 떠도는 자들
  lexicon: HALOT
  rationale: נָסַע는 단순한 '여행'보다 이동·유목적 이동의 뉘앙스가 강하므로, 목회자라는 해석을 고정하지 않고 '함께 다니는 자들'로 옮겨 이동성을 드러냈습니다. עֵדֶר는 문맥상 양 떼로 읽는 것이 가장 자연스럽습니다.
theological_decisions:
- issue: 목축적 이동을 어떤 직업명으로 고정할지
  chosen_reading: 직업명 '목자들'을 넣지 않고 '양 떼와 함께 다니는 자들'로 유지했습니다.
  alternative_readings:
  - 목자들
  - 양 떼와 함께 여행하는 사람들
  rationale: 히브리어 본문에는 '목자'가 명시되지 않으므로, 해석을 앞서지 않기 위해 이동 양상을 직접적으로 표현했습니다. 이는 영어 POB가 제시한 해석 가능성도 열어 둡니다.
  doctrine_reference: 본문 충실성 원칙
- issue: 지시어 בָהּ의 처리
  chosen_reading: '''그곳에''로 옮겨 장소 지시를 분명히 했습니다.'
  alternative_readings:
  - 그 안에
  - 거기
  rationale: 여성 단수 대명사는 앞선 회복의 장소를 가리키므로, 한국어에서는 문맥상 가장 자연스러운 '그곳에'가 본문 의미를 보존합니다.
  doctrine_reference: 문맥적 지시어 해석
