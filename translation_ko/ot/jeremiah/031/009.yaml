id: JER.31.9
reference: Jeremiah 31:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/009.yaml
  text: With weeping they will come[a], and with pleas for mercy I will lead them; I will guide them to streams of water, on a straight path on which they will not stumble, for I have become a father to Israel[b], and Ephraim is my firstborn.
  footnotes:
  - marker: a
    text: Or 'with supplications I will lead them.' The Hebrew term can be rendered 'supplications' or 'pleas for mercy.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for I am a father to Israel.' The Hebrew perfect may be understood as emphasizing a present covenant relationship.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 울면서 올 것이며, 자비를 구하며 내가 그들을 인도할 것입니다. 내가 그들을 물이 흐르는 시내들로, 넘어지지 않을 곧은 길로 이끌겠습니다. 이는 내가 이스라엘에게 아버지가 되었고, 에브라임은 내 맏아들이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자비를 구하며”라고 옮길 수 있습니다. 히브리어 תחנונים은 ‘간구’ 또는 ‘자비를 구하는 탄원’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이는 내가 이스라엘의 아버지입니다”라고 볼 수 있습니다. 히브리어 완료형은 현재의 언약 관계를 강조하는 것으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּבְכִי
  english_pob_choice: with weeping
  chosen_korean: 울면서
  alternatives_korean:
  - 눈물로
  - 울음과 함께
  lexicon: HALOT
  rationale: 동반·양태를 나타내는 ב를 자연스러운 한국어 부사절로 살렸습니다. 감정의 성격을 단정하지 않고 눈물의 이미지를 유지합니다.
- source_word: וּבְתַחֲנוּנִים
  english_pob_choice: with pleas for mercy
  chosen_korean: 자비를 구하며
  alternatives_korean:
  - 간구하며
  - 애원하며
  lexicon: HALOT
  rationale: תחנונים의 핵심은 간구/은혜 요청이므로, 예배용어로 굳어지지 않게 하면서도 관계적 간청의 뉘앙스를 살렸습니다.
- source_word: אֹבִילֵם / אֹלִיכֵם
  english_pob_choice: I will lead them / I will guide them
  chosen_korean: 내가 그들을 인도할 것입니다… 이끌겠습니다
  alternatives_korean:
  - 데려가겠습니다
  - 안내하겠습니다
  lexicon: HALOT
  rationale: 두 동사의 인도·이끌다 의미를 구별해 반복을 피하면서도, 하나님이 길을 열어 주시는 주도적 움직임을 보존했습니다.
- source_word: נַחֲלֵי מַיִם
  english_pob_choice: streams of water
  chosen_korean: 물이 흐르는 시내들
  alternatives_korean:
  - 물 시내들
  - 물줄기들
  lexicon: HALOT
  rationale: 생명을 주는 물의 이미지가 드러나도록 직역에 가깝게 옮겼습니다. '시내들'은 복수의 흐름과 풍성함을 담습니다.
- source_word: בְּדֶרֶךְ יָשָׁר
  english_pob_choice: on a straight path
  chosen_korean: 곧은 길로
  alternatives_korean:
  - 바른 길로
  - 평탄한 길로
  lexicon: HALOT
  rationale: דרך ישר의 안전하고 곧은 진로를 간결하게 표현했습니다. 한국어에서 '곧은 길'은 비유와 실제 길의 감각을 함께 살립니다.
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  english_pob_choice: on which they will not stumble / in which they will not stumble
  chosen_korean: 넘어지지 않을
  alternatives_korean:
  - 거기서 넘어지지 않을
  - 그 길에서 걸려 넘어지지 않을
  lexicon: HALOT
  rationale: 한국어에서는 관계절을 길게 늘이기보다 수식어로 압축하는 편이 자연스럽습니다. '넘어지다'는 כשל의 기본 이미지를 직접 전달합니다.
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  english_pob_choice: for I have become a father to Israel
  chosen_korean: 이는 내가 이스라엘에게 아버지가 되었고
  alternatives_korean:
  - 이는 내가 이스라엘의 아버지가 되었고
  - 이는 내가 이스라엘의 아버지이기 때문입니다
  lexicon: HALOT
  rationale: 완료형의 관계적·언약적 뉘앙스를 살려 단순 현재형보다 '되었고'를 택했습니다. 아버지 이미지를 약화하지 않으면서도 문맥의 회복 선언을 반영합니다.
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  english_pob_choice: and Ephraim is my firstborn
  chosen_korean: 에브라임은 내 맏아들이기 때문입니다
  alternatives_korean:
  - 에브라임은 내 첫째 아들이기 때문입니다
  - 에브라임은 내 첫아들이기 때문입니다
  lexicon: HALOT
  rationale: בכור는 단순한 출생 순서뿐 아니라 지위와 상속의 우선권을 가리키므로 '맏아들'이 가장 자연스럽고 성경적입니다.
theological_decisions:
- issue: 위로의 눈물과 간구의 성격
  chosen_reading: 눈물이 회개의 눈물인지, 슬픔의 눈물인지, 기쁨의 눈물인지 특정하지 않았습니다.
  alternative_readings:
  - 회개의 눈물
  - 귀환의 기쁨에 찬 눈물
  rationale: 히브리어는 그들이 어떻게 오는지만 말하고 감정의 원인을 명시하지 않습니다. 본문이 침묵하는 부분은 침묵으로 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy §3: theological tension을 해소하지 말고 보존한다.'
- issue: ‘아버지가 되었고’의 시제 의미
  chosen_reading: 완료형을 살려 언약적 관계가 성립된 사실을 나타냈습니다.
  alternative_readings:
  - 아버지입니다
  - 아버지였습니다
  rationale: 예언문맥의 완료형은 단순 현재보다 관계의 성립과 확정을 강조할 수 있습니다. 동시에 하나님과 이스라엘의 지속적 부성 관계를 부정하지 않습니다.
  doctrine_reference: Translation philosophy §1, §3
