revisions:
- from: 야훼께서 이렇게 말씀하십니다. “그가 낮에는 빛을 위해 해를 주시고, 밤에는 빛을 위해 달과 별들의 정해진 질서를 주시며, 바다를 뒤흔드셔서 그 파도가 울부짖게 하시는 분 — 만군의 야훼가 그의 이름입니다.”[a][b]
  to: 야훼께서 이렇게 말씀하십니다. “낮을 비추도록 해를 주시고, 밤을 비추도록 달과 별들의 정해진 질서를 세우시며[a], 바다를 뒤흔드셔서[b] 그 파도가 포효하게 하시는 분, 그의 이름은 만군의 야훼입니다.”
  rationale: 야훼를 수식하는 히브리어 분사구의 구조를 한국어 수식절로 일관되게 반영하고, 불분명한 대명사를 제거했습니다. 빛의 기능은 자연스러운 목적 표현으로, 파도의 소리는 한국어 관용에 맞는 ‘포효하다’로 조정했습니다. 각주 표지도 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:19Z'
