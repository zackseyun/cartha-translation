  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה נֹתֵ֥ן שֶׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם חֻקֹּ֛ת יָרֵ֥חַ וְ/כוֹכָבִ֖ים לְ/א֣וֹר לָ֑יְלָה רֹגַ֤ע הַ/יָּם֙ וַ/יֶּהֱמ֣וּ גַלָּ֔י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/035.yaml
  text: 'Thus says Yahweh[a], who gives the sun for light by day, the fixed order of the moon and stars for light by night[b], who stirs up the sea so that its waves roar—Yahweh of hosts is his name:'
  footnotes:
  - marker: a
    text: Or 'the ordinances of the moon and stars.' The Hebrew term can denote fixed statutes or established order; here it refers to the regular ordering of the heavenly bodies.
    reason: lexical_alternative
  - marker: b
    text: Or 'who calms the sea.' The Hebrew verb can carry that sense in other contexts, but here the following line, 'its waves roar,' favors 'stirs up.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “낮을 비추도록 해를 주시고, 밤을 비추도록 달과 별들의 정해진 질서를 세우시며[a], 바다를 뒤흔드셔서[b] 그 파도가 포효하게 하시는 분, 그의 이름은 만군의 야훼입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘달과 별들의 규례’. 히브리어는 고정된 법규나 확립된 질서를 가리킬 수 있으며, 여기서는 천체들의 규칙적 질서를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘바다를 잠잠하게 하시는’. 히브리어 동사는 다른 문맥에서는 그러한 뜻을 가질 수 있지만, 여기서는 바로 뒤의 ‘그 파도가 포효하게’라는 말이 ‘뒤흔드심’을 더 잘 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식의 현재형 선언성을 살리면서, 여호와 대신 야훼를 사용해 신명사 처리 원칙을 반영했습니다.
- source_word: חֻקֹּת יָרֵחַ וְכוֹכָבִים
  english_pob_choice: the fixed order of the moon and stars
  chosen_korean: 달과 별들의 정해진 질서
  alternatives_korean:
  - 달과 별들의 규례
  - 달과 별들의 율례
  lexicon: HALOT
  rationale: 우주 질서 문맥이므로 법규 의미의 ‘규례/율례’보다 반복적·정상적 배열을 나타내는 ‘정해진 질서’가 원뜻을 더 분명히 드러냅니다.
- source_word: רֹגַע הַיָּם
  english_pob_choice: who stirs up the sea
  chosen_korean: 바다를 뒤흔드셔서
  alternatives_korean:
  - 바다를 진정시키셔서
  - 바다를 잠잠하게 하셔서
  lexicon: HALOT
  rationale: 뒤따르는 ‘그 파도가 울부짖게’와의 결합을 따라, 바다를 잠재우는 뜻이 아니라 바다를 격동시키는 뜻을 살렸습니다.
- source_word: וַיֶּהֱמוּ גַלָּיו
  english_pob_choice: so that its waves roar
  chosen_korean: 그 파도가 울부짖게 하시는
  alternatives_korean:
  - 그 파도가 요동하게 하시는
  - 그 파도가 포효하게 하시는
  lexicon: HALOT
  rationale: המה의 강한 소리 이미지를 한국어에서 ‘울부짖다’로 옮겨, 단순한 움직임보다 소란스러운 청각적 효과를 보존했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명사를 직접 사용하므로, 전통적 치환어 대신 음역형을 써서 하나님의 고유 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 바다를 ‘다스림’이 아니라 ‘뒤흔드심’으로 옮김
  chosen_reading: 바다를 뒤흔드셔서 그 파도가 울부짖게 하시는 분
  alternative_readings:
  - 바다를 잠잠케 하시는 분
  - 바다를 다스리시는 분
  rationale: 문맥이 바다의 진정이 아니라 파도의 소리를 전제하므로, 창조주가 혼돈의 물을 다루시는 능력을 드러내는 방향으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
