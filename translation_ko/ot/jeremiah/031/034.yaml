base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/034.yaml
  text: And they will no longer teach[a], each man his neighbor and each man his brother, saying, ‘Know Yahweh,’ for they will all know me, from the least of them to the greatest of them, declares Yahweh. For I will forgive their iniquity[c][b], and I will remember their sin no more.
  footnotes:
  - marker: a
    text: 'Hebrew: ''each man his neighbor and each man his brother.'' The masculine singular form is used distributively for members of the covenant community.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the least of them to the greatest of them.'
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 다시는 각 사람이 자기 이웃에게, 또 각 사람이 자기 형제에게 “야훼를 알라”고 가르치지 않을 것입니다.[a] 이는 그들 모두가 그들 가운데 가장 작은 이부터 가장 큰 이까지[b] 나를 알 것이기 때문입니다. 야훼[c]의 말씀입니다. 내가 그들의 죄악을 용서할 것이며, 그들의 죄를 다시는 기억하지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수형을 분배적으로 사용하여 ‘각 사람’의 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들 가운데 가장 작은 이부터 가장 큰 이까지’는 전체를 가리키는 범위 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה는 하나님의 고유 이름이며, 여기서는 ‘야훼’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְלַמְּדוּ עוֹד
  english_pob_choice: they will no longer teach
  chosen_korean: 다시는 … 가르치지 않을 것입니다
  alternatives_korean:
  - 더 이상 … 가르치지 않을 것입니다
  - 다시 … 가르치지 않을 것입니다
  lexicon: HALOT
  rationale: 부정과 עוֹד의 결합은 이전의 지속적 행위가 중단됨을 뜻하므로, ‘다시는’이 자연스럽고 간결하게 그 뉘앙스를 살립니다.
- source_word: אִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת אָחִיו
  english_pob_choice: each man his neighbor and each man his brother
  chosen_korean: 각 사람이 자기 이웃과 각 사람이 자기 형제에게
  alternatives_korean:
  - 각 사람 이웃에게와 각 사람 형제에게
  - 사람마다 자기 이웃과 자기 형제에게
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 분배용법을 살려 ‘각 사람’을 두 번 반복해 공동체 구성원 전체를 가리키는 분배적 의미를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기는 고유 이름이므로, 관례적 대체어보다 직접 음역한 ‘야훼’를 사용했습니다.
- source_word: לְמִקְטַנָּם וְעַד גְּדוֹלָם
  english_pob_choice: from the least of them to the greatest of them
  chosen_korean: 가장 작은 자부터 가장 큰 자까지
  alternatives_korean:
  - 그들 중 가장 작은 자부터 가장 큰 자까지
  - 낮은 자부터 높은 자까지
  lexicon: HALOT
  rationale: 최소·최대의 범위를 나타내는 머리슴(merism)으로 이해하여, 한국어에서도 전체 집합을 자연스럽게 포괄하는 표현으로 옮겼습니다.
- source_word: אֶסְלַח לַעֲוֺנָם וּלְחַטָּאתָם
  english_pob_choice: I will forgive their iniquity ... and I will remember their sin no more
  chosen_korean: 그들의 죄악을 용서할 것이며, 그들의 죄를 다시는 기억하지 않을 것입니다
  alternatives_korean:
  - 그들의 죄악을 사할 것이며, 그들의 죄를 다시는 기억하지 않을 것입니다
  - 그들의 악을 용서할 것이며, 그들의 죄를 다시는 기억하지 않을 것입니다
  lexicon: HALOT
  rationale: עָוֹן은 단순한 ‘잘못’보다 무게 있는 ‘죄악/죄책’의 의미가 강하고, חטאת는 뒤따르는 죄를 가리키므로 ‘죄’로 구분해 병렬을 살렸습니다.
theological_decisions:
- issue: 지식(ידע)의 의미
  chosen_reading: ‘나를 알 것’은 단순한 정보 습득이 아니라 언약적·관계적 앎으로 보되, 본문 자체의 표현인 ‘알다’를 그대로 유지했습니다.
  alternative_readings:
  - 나를 인정할 것입니다
  - 나를 알아볼 것입니다
  - 나와 관계를 맺을 것입니다
  rationale: 예레미야 31:34의 ידע는 하나님을 향한 언약적 인식이지만, 이를 해설적으로 풀기보다 본문의 긴장을 보존하는 것이 더 직접적입니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘야훼’와 ‘야훼의 말씀입니다’
  chosen_reading: 본문과 맺음말 모두에 신명사 고유 이름을 드러냈습니다.
  alternative_readings:
  - 여호와의 말씀이니라
  - 주님의 말씀입니다
  rationale: 예언문 공식에서도 본문의 신명사 표기를 유지해, 동일한 고유 이름이 앞뒤 문맥에서 일관되게 보이도록 했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
