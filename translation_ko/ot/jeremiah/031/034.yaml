  source_fidelity: 전반적으로 히브리어의 구조와 의미를 충실히 따릅니다. 그러나 ‘각 사람이 자기 이웃과 각 사람이 자기 형제에게’는 첫 목적어에 필요한 여격 표지가 빠져 있어, 두 대상 모두에게 가르친다는 원문의 병렬 구조가 한국어에서 문법적으로 불완전하게 표현됩니다. 또한 לְמִקְטַנָּם וְעַד גְּדוֹלָם의 소유 접미사를 ‘그들 가운데’를 통해 드러내는 편이 더 가깝습니다.
  naturalness: 합쇼체는 일관되고 예언문 공식인 ‘야훼의 말씀입니다’도 자연스럽습니다. 다만 인용 뒤의 연결은 문어적 성경 한국어에서 ‘하고’보다 ‘고’가 더 자연스럽고, 병렬 여격을 보완해야 합니다.
  terminology: ‘야훼’, ‘알다’, ‘죄악’, ‘죄’를 유지한 것은 적절합니다. ‘알다’를 교리적으로 확장하지 않은 점도 원문의 여지를 보존합니다. 각주 표지는 해당 어구 가까이에 배치하는 것이 독해와 주석 연결에 적절합니다.
