revisions:
- from: 그리고 그들은 다시는 각 사람이 자기 이웃과 각 사람이 자기 형제에게 “야훼를 알라” 하고 가르치지 않을 것입니다. 이는 그들 모두가 가장 작은 자부터 가장 큰 자까지 나를 알 것이기 때문입니다. 야훼의 말씀입니다. 내가 그들의 죄악을 용서할 것이며, 그들의 죄를 다시는 기억하지 않을 것입니다.[a][b][c]
  to: 그리고 그들은 다시는 각 사람이 자기 이웃에게, 또 각 사람이 자기 형제에게 “야훼를 알라”고 가르치지 않을 것입니다.[a] 이는 그들 모두가 그들 가운데 가장 작은 이부터 가장 큰 이까지[b] 나를 알 것이기 때문입니다. 야훼[c]의 말씀입니다. 내가 그들의 죄악을 용서할 것이며, 그들의 죄를 다시는 기억하지 않을 것입니다.
  rationale: 원문의 두 병렬 수여 대상을 한국어 문법에 맞게 각각 ‘에게’로 표시하고, 범위 표현의 소유 접미사를 반영했습니다. 인용 연결을 자연스러운 문어체 ‘고’로 다듬었으며, 각주 표지를 해당 어구로 옮겼습니다. 신명, 언약적 ‘알다’, 죄악과 죄의 구별, 미래 시제는 유지했습니다.
  reviewer_model: gpt-5.6-terra
