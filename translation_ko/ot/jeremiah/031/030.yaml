source:
  edition: WLC
  text: כִּ֛י אִם אִ֥ישׁ בַּ/עֲוֺנ֖/וֹ יָמ֑וּת כָּל הָֽ/אָדָ֛ם הָ/אֹכֵ֥ל הַ/בֹּ֖סֶר תִּקְהֶ֥ינָה שִׁנָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/030.yaml
  text: But each man will die for his own iniquity; every person who eats the sour grapes[a], his teeth will be set on edge.
  footnotes:
  - marker: a
    text: Or 'unripe grapes.' The Hebrew בֹּסֶר refers to grapes not yet ripe, hence sour.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 각 사람은 자기의 죄악 때문에 죽을 것이며, 신 포도를 먹는 사람마다 이가 시릴 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘덜 익은 포도’. 히브리어 בֹּסֶר는 아직 익지 않은 포도를 가리키며, 그래서 신맛이 납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그렇지만
  - 오히려
  lexicon: HALOT
  rationale: 앞선 속담을 반박하는 대조적 전환이므로, 한국어에서는 자연스러운 역접인 ‘그러나’로 원문의 수정·대조 기능을 살렸습니다.
- source_word: בַּעֲוֺנוֹ
  english_pob_choice: for his own iniquity
  chosen_korean: 자기의 죄악 때문에
  alternatives_korean:
  - 자기의 죄악으로
  - 자기의 죄 때문에
  - 자기의 허물 때문에
  lexicon: HALOT
  rationale: עָוֹן은 여기서 개인의 책임 있는 죄악을 가리키며 죽음의 근거를 나타내므로, 원인·근거를 드러내는 ‘때문에’로 옮겼습니다.
- source_word: הַבֹּסֶר
  english_pob_choice: the sour grapes
  chosen_korean: 신 포도
  alternatives_korean:
  - 덜 익은 포도
  - 미숙한 포도
  - 신 포도알
  lexicon: HALOT
  rationale: 보속의 비유는 포도 자체의 맛과 미성숙을 함께 내포하므로, 관용적으로도 통하는 ‘신 포도’가 원문의 이미지를 가장 잘 살립니다.
- source_word: תִּקְהֶינָה שִׁנָּיו
  english_pob_choice: his teeth will be set on edge
  chosen_korean: 이가 시어질 것입니다
  alternatives_korean:
  - 이가 시릴 것입니다
  - 이가 무뎌질 것입니다
  - 이가 시큼해질 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 감각 표현으로 옮겨, 원문이 말하는 불쾌한 신맛의 결과를 직관적으로 전달했습니다.
theological_decisions:
- issue: 개인 책임과 속담 반박의 긴장
  chosen_reading: 이 절은 각 사람이 자기 죄악 때문에 죽는다는 개인 책임을 분명히 말하며, ‘신 포도를 먹는’ 속담의 세대 간 책임 전가를 여기서는 거부합니다.
  alternative_readings:
  - 단순히 속담을 반복하는 문학적 진술
  - 개인 책임보다 일반적 인과를 말하는 표현
  rationale: 문맥상 앞선 속담을 정정하는 선언이므로, 본문이 의도하는 윤리적 긴장을 흐리지 않도록 개인 책임을 분명히 드러냈습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고, 문맥이 말하는 범위 이상으로 확장하지 않습니다.
