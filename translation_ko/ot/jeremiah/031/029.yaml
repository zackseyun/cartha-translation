  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם לֹא יֹאמְר֣וּ ע֔וֹד אָב֖וֹת אָ֣כְלוּ בֹ֑סֶר וְ/שִׁנֵּ֥י בָנִ֖ים תִּקְהֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/029.yaml
  text: In those days they will no longer say[a], ‘The fathers have eaten sour grapes, and the sons’ teeth are set on edge.’
  footnotes:
  - marker: a
    text: Or 'The fathers ate unripe grapes, and the children's teeth are set on edge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날들에는 더 이상 이런 말을 하지 않을 것입니다. “아버지들이 신 포도를 먹었고, 아들들의 이가 시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아버지들이 덜 익은 포도를 먹었고, 아들들의 이가 시다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그 날들에는
  alternatives_korean:
  - 그때에는
  - 그 시기에는
  lexicon: WLC; HALOT
  rationale: 예언문맥의 관용적 시간 표현을 자연스러운 현대 한국어로 옮겼습니다. '그 날들에는'은 미래적·종말론적 뉘앙스를 살리면서도 직역에 가깝습니다.
- source_word: לֹא יֹאמְרוּ עוֹד
  english_pob_choice: they will no longer say
  chosen_korean: 더 이상 이런 말을 하지 않을 것입니다
  alternatives_korean:
  - 더 이상 말하지 않을 것입니다
  - 더 이상 그렇게 말하지 않을 것입니다
  lexicon: WLC; HALOT
  rationale: 주어가 불특정 복수인 점과 '더 이상'의 중지 의미를 살렸습니다. 한국어에서는 반복되는 속담적 발화를 자연스럽게 가리키기 위해 '이런 말'을 보탰습니다.
- source_word: אָבוֹת ... בָנִים
  english_pob_choice: the fathers ... the sons
  chosen_korean: 아버지들이 … 자식들의
  alternatives_korean:
  - 조상들이 … 아들들의
  - 부모들이 … 자녀들의
  lexicon: WLC; HALOT
  rationale: 히브리어의 남성형 친족어를 본문에서 유지했습니다. '자식들'은 한국어에서 속담의 후대 집단을 자연스럽게 지시하면서도 성중립화로 원문을 흐리지 않습니다.
- source_word: בֹסֶר
  english_pob_choice: sour grapes
  chosen_korean: 신 포도
  alternatives_korean:
  - 덜 익은 포도
  - 신 포도 열매
  lexicon: HALOT
  rationale: 이 표현은 관용구이지만, 한국어 성경문맥에서는 '신 포도'가 직관적이고 속담의 원형을 잘 전달합니다. '덜 익은 포도'는 더 직역적이지만 관용적 울림이 약합니다.
- source_word: תִּקְהֶינָה
  english_pob_choice: are set on edge
  chosen_korean: 이가 시다
  alternatives_korean:
  - 이가 시큼해진다
  - 이가 시큰하다
  lexicon: HALOT
  rationale: 히브리어의 치아가 자극을 받아 불편해지는 효과를 한국어 관용 표현으로 옮겼습니다. '이가 시다'는 한국어 속담·일상어에서 가장 자연스럽고 즉각적인 대응입니다.
theological_decisions:
- issue: 속담의 사회적 대상과 성별 표지
  chosen_reading: '''아버지들''과 ''자식들''의 구도를 유지하되, 한국어에서는 전체 세대를 가리키는 속담 표현으로 이해되도록 했습니다.'
  alternative_readings:
  - 부모들과 자녀들
  - 조상들과 후손들
  rationale: 원문은 남성형 친족어를 사용하지만, 예언의 요지는 세대 간 책임 전가의 중단입니다. 한국어 본문은 원문 표지를 유지하면서도 의미 전달을 위해 '자식들'로 자연화했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4
