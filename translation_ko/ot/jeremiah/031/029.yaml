  to: 그 날들에는 더 이상 이런 말을 하지 않을 것입니다. “아버지들이 신 포도를 먹었고, 아들들의 이가 시다.”[a]
  rationale: The revision removes an unsupported explicit causal connective and restores the masculine kinship term “sons” as “아들들.” It otherwise preserves the draft’s clear modern formal register, its rendering of the proverb, and the lexical-alternative footnote.
