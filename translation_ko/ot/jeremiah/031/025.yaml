id: JER.31.25
reference: Jeremiah 31:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֥י הִרְוֵ֖יתִי נֶ֣פֶשׁ עֲיֵפָ֑ה וְ/כָל נֶ֥פֶשׁ דָּאֲבָ֖ה מִלֵּֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/025.yaml
  text: For I have satisfied the weary soul[b][a], and every faint soul I have filled.
  footnotes:
  - marker: a
    text: Or 'refreshed' for 'satisfied'; the Hebrew verb literally carries the sense of giving drink in abundance.
    reason: lexical_alternative
  - marker: b
    text: Or 'every sorrowful soul' or 'every grieving soul' for 'every languishing soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 피곤한 영혼을 만족하게 하였고, 모든 쇠약한 영혼을 내가 채웠기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흠뻑 적셔 주었다’로도 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘많이 마시게 하다’는 뜻을 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 쇠잔한 영혼’ 혹은 ‘모든 슬픔에 잠긴 영혼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이므로
  lexicon: HALOT
  rationale: 문맥상 앞의 약속을 뒷받침하는 이유를 제시하므로, 합쇼체에서 자연스럽게 원인·근거를 밝히는 표현으로 옮겼습니다.
- source_word: הִרְוֵיתִי
  english_pob_choice: I have satisfied
  chosen_korean: 만족하게 하였고
  alternatives_korean:
  - 흠뻑 마시게 하였고
  - 충분히 적셔 주었고
  - 만족시켰고
  lexicon: HALOT
  rationale: 동사의 핵심은 ‘마시게 하다/흠뻑 적시다’의 풍성한 공급이므로, 그 은유를 살리면서도 한국어에서는 결과를 드러내는 ‘만족하게 하다’로 옮겼습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 혼
  - 생명
  - 사람
  - 자아
  lexicon: HALOT
  rationale: 시적·인간론적 무게를 살리기 위해 ‘영혼’으로 일관되게 옮겼습니다. 여기서는 기술적 교리어가 아니라 내적 존재를 가리키는 표현으로 읽는 것이 자연합니다.
- source_word: דָּאֲבָה
  english_pob_choice: faint / languishing
  chosen_korean: 쇠약한
  alternatives_korean:
  - 시들어 가는
  - 애처로운
  - 슬퍼하는
  - 기진한
  lexicon: HALOT
  rationale: 본동사는 기력 저하와 쇠잔함을 드러내므로, 감정어보다 상태 중심의 ‘쇠약한’이 병렬 구조와 의미 범위를 가장 잘 반영합니다.
- source_word: מִלֵּאתִי
  english_pob_choice: I have filled
  chosen_korean: 채웠습니다
  alternatives_korean:
  - 가득 채웠습니다
  - 만족시켰습니다
  - 충만하게 하였습니다
  lexicon: HALOT
  rationale: ‘채우다’는 מִלֵּאתִי의 기본 의미를 직접 살리며, 앞 절의 ‘만족하게 하다’와 병렬을 이루어 풍성한 공급의 이미지를 유지합니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역 범위
  chosen_reading: 두 번 모두 ‘영혼’으로 번역했습니다.
  alternative_readings:
  - 생명
  - 사람
  - 자기
  rationale: 이 구절은 여호와께서 지친 존재 전체를 회복하시는 시적 진술이므로, ‘영혼’이 본문의 정서와 인간 이해를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 히브리어 완료형의 시제 효과
  chosen_reading: 한국어에서는 과거 완료적 진술로 옮겼습니다.
  alternative_readings:
  - 현재형 미래 확정 표현
  - 단순 과거
  rationale: 예언문맥에서 완료형은 이미 이루어진 것처럼 확실하게 말하는 기능을 하므로, 합쇼체의 완료 과거로 옮겨 선언적 확실성을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
