revisions:
- from: 나는 분명히 들었습니다, 에브라임이 탄식하는 소리를. 「당신은 저를 징계하셨고, 저는 징계받았습니다. 훈련받지 않은 송아지처럼 말입니다. 저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다. 당신은 야훼, 제 하나님이시기 때문입니다。」[a][b]
  to: 나는 에브라임이 탄식하는 것을 분명히 들었습니다.[a] “당신은 저를 징계하셨고, 저는 훈련받지 않은 송아지처럼 징계를 받았습니다. 저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다.[b] 당신은 야훼이시며 제 하나님이시기 때문입니다.”
  rationale: 문장 배열과 비유의 연결을 현대 표준어에 맞게 다듬고, 종결부를 ‘야훼이시며 제 하나님이시기 때문입니다’로 고쳐 원문의 신명과 소유격 술어를 모두 분명히 보존했습니다. 각주 a에서는 원문이 허용하는 자기-애통의 가능성만 제시하고 ‘자기 연민’이라는 해석적 판단은 제거했습니다. 돌이킴의 사역적 표현과 귀환 동사의 반복은 유지하되, 특정 교리 체계의 결론을 번역문에 부과하지 않았습니다.
