reference: Jeremiah 31:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי אֶפְרַ֨יִם֙ מִתְנוֹדֵ֔ד יִסַּרְתַּ֨/נִי֙ וָֽ/אִוָּסֵ֔ר כְּ/עֵ֖גֶל לֹ֣א לֻמָּ֑ד הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה כִּ֥י אַתָּ֖ה יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
  footnotes:
  - marker: a
    text: Or 'bemoaning himself' for 'grieving'; the Hebrew participle can suggest audible self-lament.
    reason: lexical_alternative
  - marker: b
    text: Or 'Turn me back, and I will turn back.' The Hebrew repeats the verb 'return/turn back' in both clauses.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 분명히 들었습니다, 에브라임이 탄식하는 소리를. 「당신은 저를 징계하셨고, 저는 징계받았습니다. 훈련받지 않은 송아지처럼 말입니다. 저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다. 당신은 야훼, 제 하나님이시기 때문입니다。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘탄식하며 자기 연민에 빠져 있는’이라는 뜻일 수 있습니다. 히브리어 분사형은 들리는 자기탄식을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저를 돌아서게 하십시오, 그러면 제가 돌아서겠습니다.’ 히브리어는 두 절에서 ‘돌아가다/돌이키다’ 계열의 동사를 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי
  english_pob_choice: I have surely heard
  chosen_korean: 나는 분명히 들었습니다
  alternatives_korean:
  - 나는 확실히 들었습니다
  - 들어 또 들었습니다
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+완전동사는 강한 강조를 나타내므로, 한국어에서는 자연스럽게 ‘분명히’로 살렸습니다.
- source_word: מִתְנוֹדֵ֔ד
  english_pob_choice: grieving
  chosen_korean: 탄식하는
  alternatives_korean:
  - 슬퍼하는
  - 자기연민에 빠져 우는
  - 불안해하며 떠도는
  lexicon: HALOT
  rationale: 이 분사형은 자기연민적 중얼거림보다 들리는 탄식을 가리킬 수 있어, 문맥상 회개의 울부짖음을 드러내는 ‘탄식하는’이 가장 무난합니다.
- source_word: יִסַּרְתַּ֨/נִי֙ וָֽ/אִוָּסֵ֔ר
  english_pob_choice: You disciplined me, and I was disciplined
  chosen_korean: 당신은 저를 징계하셨고, 저는 징계받았습니다
  alternatives_korean:
  - 당신은 저를 징치하셨고, 저는 징치받았습니다
  - 당신은 저를 훈계하셨고, 저는 훈계받았습니다
  lexicon: HALOT
  rationale: יסר의 핵심은 교정적 징계이므로, 현대 한국어에서 자연스럽고 반복 어감도 살리는 ‘징계하다/징계받다’를 택했습니다.
- source_word: כְּ/עֵגֶל לֹ֣א לֻמָּד
  english_pob_choice: like an untrained calf
  chosen_korean: 훈련받지 않은 송아지처럼
  alternatives_korean:
  - 길들지 않은 송아지처럼
  - 배우지 못한 송아지처럼
  lexicon: HALOT
  rationale: ‘멍에에 익숙하지 않은 어린 짐승’의 이미지를 한국어로 간결하게 살리기 위해 ‘훈련받지 않은 송아지’로 옮겼습니다.
- source_word: הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה
  english_pob_choice: Restore me, and I will return
  chosen_korean: 저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다
  alternatives_korean:
  - 저를 돌아서게 해 주십시오. 그러면 제가 돌아가겠습니다
  - 저를 다시 돌아오게 하십시오. 그러면 제가 돌아오겠습니다
  lexicon: HALOT
  rationale: שוב의 사역형은 ‘돌이키다/돌아오게 하다’의 뜻이므로, 문맥상 회복과 회개를 함께 담는 ‘돌이켜 주십시오’가 자연스럽습니다.
- source_word: יְהוָ֥ה אֱלֹהָֽ/י
  english_pob_choice: Yahweh my God
  chosen_korean: 야훼, 제 하나님
  alternatives_korean:
  - 야훼, 나의 하나님
  - 야훼 내 하나님
  lexicon: HALOT
  rationale: 고유신명은 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 소유격은 현대 한국어의 공손한 고백형에 맞춰 ‘제 하나님’으로 처리했습니다.
theological_decisions:
- issue: 회개 요청의 방향을 나타내는 שוב의 표현
  chosen_reading: ‘저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다’로 번역해, 하나님이 회개의 방향을 먼저 여시는 구조를 드러냈습니다.
  alternative_readings:
  - ‘저를 다시 돌아오게 하십시오’
  - ‘저를 회복시켜 주십시오’
  rationale: 본문은 단순한 자기결단이 아니라, 하나님이 먼저 돌이키게 하셔야 돌아올 수 있다는 종속 구조를 담고 있습니다. 그래서 ‘회복’만으로 완화하지 않고 ‘돌이켜 주십시오’로 사역적 뉘앙스를 살렸습니다.
  doctrine_reference: 회개와 은혜의 선행성
