base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
  footnotes:
  - marker: a
    text: Or 'bemoaning himself' for 'grieving'; the Hebrew participle can suggest audible self-lament.
    reason: lexical_alternative
  - marker: b
    text: Or 'Turn me back, and I will turn back.' The Hebrew repeats the verb 'return/turn back' in both clauses.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 에브라임이 탄식하는 것을 분명히 들었습니다.[a] “당신은 저를 징계하셨고, 저는 훈련받지 않은 송아지처럼 징계를 받았습니다. 저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다.[b] 당신은 야훼이시며 제 하나님이시기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 두고 탄식하는’으로 옮길 수 있습니다. 히브리어 분사는 스스로 하는 애통을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘저를 돌아서게 하십시오, 그러면 제가 돌아서겠습니다.’ 히브리어는 두 절에서 ‘돌아가다/돌이키다’ 계열의 동사를 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמ֣וֹעַ שָׁמַ֗עְתִּי
