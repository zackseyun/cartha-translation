  alternatives_korean:
  - 당신은 저를 징치하셨고, 저는 징치받았습니다
  - 당신은 저를 훈계하셨고, 저는 훈계받았습니다
  lexicon: HALOT
  rationale: יסר의 핵심은 교정적 징계이므로, 현대 한국어에서 자연스럽고 반복 어감도 살리는 ‘징계하다/징계받다’를 택했습니다.
- source_word: כְּ/עֵגֶל לֹ֣א לֻמָּד
  english_pob_choice: like an untrained calf
  chosen_korean: 훈련받지 않은 송아지처럼
  alternatives_korean:
  - 길들지 않은 송아지처럼
  - 배우지 못한 송아지처럼
  lexicon: HALOT
  rationale: ‘멍에에 익숙하지 않은 어린 짐승’의 이미지를 한국어로 간결하게 살리기 위해 ‘훈련받지 않은 송아지’로 옮겼습니다.
- source_word: הֲשִׁיבֵ֣/נִי וְ/אָשׁ֔וּבָה
  english_pob_choice: Restore me, and I will return
  chosen_korean: 저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다
  alternatives_korean:
  - 저를 돌아서게 해 주십시오. 그러면 제가 돌아가겠습니다
  - 저를 다시 돌아오게 하십시오. 그러면 제가 돌아오겠습니다
  lexicon: HALOT
  rationale: שוב의 사역형은 ‘돌이키다/돌아오게 하다’의 뜻이므로, 문맥상 회복과 회개를 함께 담는 ‘돌이켜 주십시오’가 자연스럽습니다.
- source_word: יְהוָ֥ה אֱלֹהָֽ/י
  english_pob_choice: Yahweh my God
  chosen_korean: 야훼, 제 하나님
  alternatives_korean:
  - 야훼, 나의 하나님
  - 야훼 내 하나님
  lexicon: HALOT
  rationale: 고유신명은 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 소유격은 현대 한국어의 공손한 고백형에 맞춰 ‘제 하나님’으로 처리했습니다.
theological_decisions:
- issue: 회개 요청의 방향을 나타내는 שוב의 표현
  chosen_reading: ‘저를 돌이켜 주십시오. 그러면 제가 돌아오겠습니다’로 번역해, 하나님이 회개의 방향을 먼저 여시는 구조를 드러냈습니다.
  alternative_readings:
  - ‘저를 다시 돌아오게 하십시오’
  - ‘저를 회복시켜 주십시오’
  rationale: 본문은 단순한 자기결단이 아니라, 하나님이 먼저 돌이키게 하셔야 돌아올 수 있다는 종속 구조를 담고 있습니다. 그래서 ‘회복’만으로 완화하지 않고 ‘돌이켜 주십시오’로 사역적 뉘앙스를 살렸습니다.
  doctrine_reference: 회개와 은혜의 선행성
