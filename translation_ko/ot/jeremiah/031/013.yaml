  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
  footnotes:
  - marker: a
    text: Or 'the maiden' or 'the young woman.' The Hebrew singular likely functions representatively for the young women of the community.
    reason: lexical_alternative
  - marker: b
    text: Or 'elders,' if taken as a social role rather than an age contrast; here the parallel with 'young men' favors 'old men.'
    reason: lexical_alternative
  - marker: c
    text: Or 'into joy' for 'into gladness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 처녀가 춤추며 즐거워하고[a], 젊은 남자들과 나이 든 남자들도 함께 즐거워할 것입니다[b]. 내가 그들의 애통함을 기쁨으로 바꾸고[c], 그들을 위로하며, 그들의 슬픔 대신 기쁘게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젊은 여자’ 또는 ‘처녀인 젊은 여자’로 옮길 수 있습니다. 히브리어 단수형은 아마 공동체의 젊은 여성들을 대표하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘장로들’로 옮길 수 있으나, 여기서는 ‘젊은 남자들’과의 대조 때문에 ‘나이 든 남자들’이 더 적절합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘즐거움’으로 옮길 수 있습니다.
    reason: lexical_alternative
