id: JER.31.13
reference: Jeremiah 31:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז תִּשְׂמַ֤ח בְּתוּלָה֙ בְּ/מָח֔וֹל וּ/בַחֻרִ֥ים וּ/זְקֵנִ֖ים יַחְדָּ֑ו וְ/הָפַכְתִּ֨י אֶבְלָ֤/ם לְ/שָׂשׂוֹן֙ וְ/נִ֣חַמְתִּ֔י/ם וְ/שִׂמַּחְתִּ֖י/ם מִ/יגוֹנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
  footnotes:
  - marker: a
    text: Or 'the maiden' or 'the young woman.' The Hebrew singular likely functions representatively for the young women of the community.
    reason: lexical_alternative
  - marker: b
    text: Or 'elders,' if taken as a social role rather than an age contrast; here the parallel with 'young men' favors 'old men.'
    reason: lexical_alternative
  - marker: c
    text: Or 'into joy' for 'into gladness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 처녀가 춤추며[a] 즐거워하고, 젊은 남자들과 늙은 남자들이 함께할 것입니다[b]. 내가 그들의 애통함을 기쁨으로 바꾸고[c], 그들을 위로하며, 그들의 슬픔에서 그들을 즐겁게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젊은 여자’ 혹은 ‘처녀’로도 옮길 수 있습니다. 히브리어 단수는 아마 공동체의 젊은 여성들을 대표하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘장로들’로도 옮길 수 있으나, 여기서는 ‘젊은 남자들’과의 평행 때문에 ‘늙은 남자들’이 더 적절합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기쁨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוּלָה
  english_pob_choice: the virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 젊은 여자
  - 처녀 여자
  lexicon: HALOT
  rationale: 히브리어 단수형을 그대로 살리면서, 공동체의 젊은 여성들을 대표하는 표현이라는 뉘앙스를 한국어에서 가장 자연스럽게 반영했습니다.
- source_word: בְּמָחוֹל
  english_pob_choice: in the dance
  chosen_korean: 춤추며
  alternatives_korean:
  - 춤 가운데
  - 춤 속에서
  - 무도하며
  lexicon: HALOT
  rationale: ב 전치사의 구체적 이미지를 살리되 한국어에서는 ‘춤추며’가 가장 자연스럽고 장면성을 유지합니다.
- source_word: וּזְקֵנִים
  english_pob_choice: old men
  chosen_korean: 늙은 남자들
  alternatives_korean:
  - 장로들
  - 늙은이들
  - 나이 든 남자들
  lexicon: HALOT
  rationale: 젊은 남자들과의 병행이 연령 대비를 분명히 하므로, 제도적 직분인 ‘장로들’보다 나이 대비를 드러내는 표현을 택했습니다.
- source_word: וְהָפַכְתִּי אֶבְלָם לְשָׂשׂוֹן
  english_pob_choice: I will turn their mourning into gladness
  chosen_korean: 내가 그들의 애통함을 기쁨으로 바꾸고
  alternatives_korean:
  - 내가 그들의 슬픔을 기쁨으로 바꾸고
  - 내가 그들의 애곡을 즐거움으로 바꾸고
  lexicon: HALOT
  rationale: הפך의 전환 의미를 ‘바꾸다’로 살리고, אֵבֶל은 개인적 감정보다 공동체적 애통의 뉘앙스가 있어 ‘애통함’이 적절합니다.
- source_word: וְנִחַמְתִּים וְשִׂמַּחְתִּים מִיּגוֹנָם
  english_pob_choice: and I will comfort them and make them rejoice from their sorrow
  chosen_korean: 그들을 위로하며, 그들의 슬픔에서 그들을 즐겁게 하겠습니다
  alternatives_korean:
  - 그들을 위로하며, 그들의 슬픔을 벗어나 기쁘게 하겠습니다
  - 그들을 위로하며, 그들의 근심에서 기쁘게 하겠습니다
  lexicon: HALOT
  rationale: נחם은 ‘위로하다’가 직접적이고, שׂמח의 사역형은 하나님이 기쁨을 일으키신다는 뜻을 드러내기 위해 ‘즐겁게 하다’로 옮겼습니다. מִן은 분리/이탈의 폭이 있어 ‘~에서’로 열어 두었습니다.
theological_decisions:
- issue: 대표 단수 ‘처녀’의 유지
  chosen_reading: 단수형을 유지해 공동체를 대표하는 상징적 인물로 읽었습니다.
  alternative_readings:
  - 젊은 여자들
  - 처녀들
  rationale: 히브리어가 단수형을 사용하므로, 문맥상 공동체를 대표하는 이미지로 보되 형식을 보존하는 것이 원문에 더 가깝습니다.
  doctrine_reference: source-form fidelity and representative singular
- issue: ‘장로들’ 대신 연령 대비 표현 사용
  chosen_reading: 직분적 의미를 피하고 연령 대비를 살렸습니다.
  alternative_readings:
  - 장로들
  rationale: 문맥의 평행구조가 ‘젊은 남자들’과 ‘늙은 남자들’의 대비를 요구하므로, 제도적 교회 용어를 도입하지 않았습니다.
  doctrine_reference: contextual parallelism over ecclesial terminology
