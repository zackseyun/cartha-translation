source:
  edition: WLC
  text: כִּ֣י יֶשׁ י֔וֹם קָרְא֥וּ נֹצְרִ֖ים בְּ/הַ֣ר אֶפְרָ֑יִם ק֚וּמוּ וְ/נַעֲלֶ֣ה צִיּ֔וֹן אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/006.yaml
  text: For there will be a day when watchmen will call out on the hill country of Ephraim[a], ‘Rise up, and let us go up to Zion[b], to Yahweh our God.’
  footnotes:
  - marker: a
    text: Hebrew 'watchmen'; alternatively 'keepers' or 'guards.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD'; the divine name is YHWH, traditionally rendered 'the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 에브라임 산지에서 파수꾼들[a]이 외칠 날이 있을 것이기 때문입니다. “일어나십시오. 시온으로 올라가 우리 하나님 야훼께[b] 나아갑시다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘파수꾼들’에 해당합니다. 문맥에 따라 ‘지키는 자들’이나 ‘감시자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 하나님의 이름 YHWH입니다. 전통적으로는 ‘주’로 번역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי / יֶשׁ יֹום
  english_pob_choice: For there will be a day
  chosen_korean: 이는 … 날이 있기 때문입니다
  alternatives_korean:
  - 그날이 올 것입니다
  - 언젠가 날이 있을 것입니다
  lexicon: HALOT
  rationale: 원문의 כִּי는 앞 문맥의 이유를 잇는 접속사이고, יֶשׁ יֹום은 미래를 가리키는 예언적 표현이므로, 한국어에서는 이유를 밝히는 ‘…때문입니다’로 자연스럽게 살렸습니다.
- source_word: נֹצְרִים
  english_pob_choice: watchmen
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 감시자들
  - 지키는 자들
  lexicon: HALOT
  rationale: 이 어근은 지키고 감시하는 사람을 가리키며, 문맥상 공개적으로 부르는 소리를 내는 경계 인물을 뜻하므로, 한국어 성경어로 가장 직접적인 ‘파수꾼들’이 적절합니다.
- source_word: בְּהַר אֶפְרָיִם
  english_pob_choice: in the hill country of Ephraim
  chosen_korean: 에브라임의 산지에서
  alternatives_korean:
  - 에브라임의 산악지대에서
  - 에브라임 산지에서
  lexicon: HALOT
  rationale: 히브리어의 ‘산/산지’는 단일 봉우리보다 지역 전체를 가리키는 집합적 표현이므로, 한국어에서는 지리적 의미를 자연스럽게 전달하는 ‘산지’로 옮겼습니다.
- source_word: קוּמוּ / וְנַעֲלֶה
  english_pob_choice: Rise up, and let us go up
  chosen_korean: 일어나, … 올라가자
  alternatives_korean:
  - 일어나, … 가자
  - 일어나, … 올라가도록 하자
  lexicon: HALOT
  rationale: 명령형 복수와 권고적 공동의지형을 함께 살리기 위해 ‘일어나’와 ‘올라가자’를 사용했습니다. ‘올라가다’는 시온으로의 순례적 상승 이미지를 보존합니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 야훼, 우리 하나님
  lexicon: HALOT
  rationale: 본문의 신명은 יְהוָה이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, 뒤의 ‘우리 하나님’은 공동체적 언약 고백을 보존합니다.
theological_decisions:
- issue: YHWH의 음역과 예언적 초청의 어조
  chosen_reading: ‘야훼 우리 하나님’으로 직접 옮겨 언약 이름을 드러내고, 초청구는 공동 권유형 ‘올라가자’로 유지했습니다.
  alternative_readings:
  - ‘주 우리 하나님’
  - ‘여호와 우리 하나님’
  rationale: 원문은 야훼의 언약 이름을 직접 사용하므로, 이를 일반 명칭으로 완화하지 않았습니다. 또한 공동체적 순례 초청의 집합적 어조가 핵심이므로 권유형을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 시온으로의 상승 이미지
  chosen_reading: ‘올라가자’로 번역해 지리적 이동과 예배적 상승의 이중 의미를 함께 남겼습니다.
  alternative_readings:
  - ‘가자’
  - ‘나아가자’
  rationale: 시온은 단순 목적지가 아니라 예배 중심지이므로, ‘올라가다’는 히브리어의 상향 운동과 성소 지향성을 함께 반영합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #3, #5'
