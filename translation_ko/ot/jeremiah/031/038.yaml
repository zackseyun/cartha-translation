id: JER.31.38
reference: Jeremiah 31:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים נְאֻם יְהוָ֑ה וְ/נִבְנְתָ֤ה הָ/עִיר֙ לַֽ/יהוָ֔ה מִ/מִּגְדַּ֥ל חֲנַנְאֵ֖ל שַׁ֥עַר הַ/פִּנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/038.yaml
  text: Behold[a], days are coming, declares Yahweh, when the city will be rebuilt for Yahweh, from the Tower of Hananel to the Corner Gate.
  footnotes:
  - marker: a
    text: Or 'will be built'; the Hebrew passive can denote either building or rebuilding, though the restoration context favors 'rebuilt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 날들이 다가오고 있습니다. 야훼의 말씀입니다. 그 성읍이 야훼를 위하여 하난엘 망대에서 모퉁이 문까지 다시 세워질 것입니다.[¹]
  philosophy: optimal-equivalence
  footnotes:
  - marker: ¹
    text: 또는 ‘세워질 것입니다’. 히브리어의 수동형은 건축 또는 재건을 모두 가리킬 수 있으나, 회복 문맥은 ‘다시 세워질 것입니다’를 더 강하게 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라, 지금
  lexicon: HALOT
  rationale: 예언적 주의를 환기하는 감탄사로서 문맥의 장중함을 살리면서도 현대 한국어에서 자연스럽게 읽히는 직접적 호소형을 택했습니다.
- source_word: יָמִים
  english_pob_choice: days are coming
  chosen_korean: 그 날이 오고 있습니다
  alternatives_korean:
  - 날들이 오고 있습니다
  - 그때가 오고 있습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 미래 예고를 한국어에서 자연스러운 진행형으로 풀어, 단순한 시간 명칭보다 예언적 도래감을 살렸습니다.
- source_word: וְנִבְנְתָה
  english_pob_choice: will be rebuilt
  chosen_korean: 다시 세워질 것입니다
  alternatives_korean:
  - 재건될 것입니다
  - 세워질 것입니다
  lexicon: HALOT
  rationale: 문맥이 예루살렘의 회복을 가리키므로 단순한 건축보다 '다시 세워지다'가 회복의 뉘앙스를 더 잘 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위하여
  alternatives_korean:
  - 야훼에게
  - 야훼께 속하도록
  lexicon: HALOT
  rationale: ל의 헌납·귀속 의미를 한국어에서 가장 자연스럽게 전달하는 표현을 택해, 성읍이 야훼께 바쳐진다는 뜻을 유지했습니다.
- source_word: מִמִּגְדַּל חֲנַנְאֵל שַׁעַר הַפִּנָּה
  english_pob_choice: from the Tower of Hananel ... to the Corner Gate
  chosen_korean: 하난엘 망대부터 모퉁이 문까지
  alternatives_korean:
  - 하난엘 망대에서 모퉁이 문까지
  - 하난엘 망대에서부터 모퉁이 문까지
  lexicon: HALOT
  rationale: 범위의 시작점과 종점을 한국어 조사로 자연스럽게 처리했고, 고유명과 지명 요소는 직역하지 않고 음역·기능 번역을 병행했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 여호와 대체어가 아니라 신성한 고유명 יְהוָה가 직접 나오므로, 프로젝트 기준에 따라 '야훼'로 옮겨 언약 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 재건/건축의 구분
  chosen_reading: 다시 세워질 것입니다
  alternative_readings:
  - 세워질 것입니다
  - 재건될 것입니다
  rationale: 예루살렘 회복 문맥에서는 단순 신축보다 복원·회복의 신학적 함의가 중요하므로, 건립과 재건의 긴장을 해치지 않으면서 회복성을 드러냈습니다.
  doctrine_reference: 문맥적 회복 신학
