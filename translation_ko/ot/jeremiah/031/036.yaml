reference: Jeremiah 31:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם יָמֻ֜שׁוּ הַ/חֻקִּ֥ים הָ/אֵ֛לֶּה מִ/לְּ/פָנַ֖/י נְאֻם יְהוָ֑ה גַּם֩ זֶ֨רַע יִשְׂרָאֵ֜ל יִשְׁבְּת֗וּ מִֽ/הְי֥וֹת גּ֛וֹי לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/036.yaml
  text: If these fixed ordinances depart from before me[a], declares Yahweh[c][b], then the offspring of Israel also will cease from being a nation before me forever.
  footnotes:
  - marker: a
    text: Or 'these statutes' or 'these decrees'; the phrase refers in context to the fixed order established for creation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the seed of Israel,' a collective expression meaning Israel's offspring or descendants.
    reason: lexical_alternative
  - marker: c
    text: Or 'forever'; Hebrew 'all the days' is a literal idiom for enduring continuance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 고정된 규례들이 내 앞에서 사라지면, 야훼의 선언입니다. 그러면 이스라엘의 씨도 내 앞에서 민족으로 존재하기를 영원히 그치게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고정된 규례들’은 문맥상 창조 세계의 질서를 세운 정해진 질서를 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘이스라엘의 씨’로, 이스라엘의 후손을 가리키는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 ‘모든 날들’은 여기서 지속성을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים הָאֵלֶּה
  english_pob_choice: these fixed ordinances
  chosen_korean: 이 고정된 규례들
  alternatives_korean:
  - 이 규례들
  - 이 법도들
  - 이 규정들
  lexicon: HALOT
  rationale: 문맥이 창조 질서(해, 달, 바다의 질서)를 가리키므로, 인간 법규보다 ‘고정된 규례들’이 원문의 स्थ적·질서적 의미를 더 잘 살립니다.
- source_word: יָמֻשׁוּ / מִלְּפָנַי
  english_pob_choice: depart from before me
  chosen_korean: 내 앞에서 사라지면
  alternatives_korean:
  - 내 앞에서 떠나면
  - 내 앞에서 물러나면
  - 내 면전에서 제거되면
  lexicon: HALOT
  rationale: ‘depart from before me’의 관계적·공간적 이미지를 살리면서, 규례들이 자리를 이탈하는 비현실적 조건을 한국어로 자연스럽게 옮겼습니다.
- source_word: זֶרַע יִשְׂרָאֵל
  english_pob_choice: the offspring of Israel
  chosen_korean: 이스라엘의 씨
  alternatives_korean:
  - 이스라엘의 후손
  - 이스라엘의 자손
  - 이스라엘의 자손들
  lexicon: HALOT
  rationale: זֶרַע의 집합적 단수와 유전적 연속성을 유지하려고 ‘씨’를 택했습니다. 한국어로는 다소 직설적이지만, 원문의 집합명사를 보존하는 데 유리합니다.
- source_word: גּוֹי
  english_pob_choice: a nation
  chosen_korean: 민족
  alternatives_korean:
  - 나라
  - 국가
  - 백성
  lexicon: HALOT
  rationale: 여기서는 이스라엘의 공동체적 지속성을 말하므로 ‘민족’이 가장 자연스럽고, ‘국가’보다 덜 근대적이며 ‘백성’보다 גּוֹי의 집합적 공적 성격을 더 잘 드러냅니다.
theological_decisions:
- issue: כָּל הַיָּמִים의 종말론적 지속성
  chosen_reading: ‘영원히’로 옮겨 이 조건문의 지속 불가능성을 분명히 했습니다.
  alternative_readings:
  - ‘모든 날 동안’
  - ‘늘’
  rationale: 직역하면 ‘모든 날 동안’이지만, 문맥상 ‘이스라엘이 민족으로 존재하기를 멈춘다’는 불가능한 조건의 지속을 가리키므로 한국어에서는 자연스럽고 강한 지속성 표현인 ‘영원히’가 적절합니다.
  doctrine_reference: 문맥 우선의 관용적 완역; 의미를 약화시키지 않되 한국어 자연성을 확보
