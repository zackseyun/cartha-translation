id: JER.31.40
reference: Jeremiah 31:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הָ/עֵ֣מֶק הַ/פְּגָרִ֣ים וְ/הַ/דֶּ֡שֶׁן וְ/כָֽל ה/שרמות עַד נַ֨חַל קִדְר֜וֹן עַד פִּנַּ֨ת שַׁ֤עַר הַ/סּוּסִים֙ מִזְרָ֔חָ/ה קֹ֖דֶשׁ לַֽ/יהוָ֑ה לֹֽא יִנָּתֵ֧שׁ וְֽ/לֹא יֵהָרֵ֛ס ע֖וֹד לְ/עוֹלָֽם־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/040.yaml
  text: And the whole valley of the corpses and the ashes[a], and all the terraces as far as the Kidron Valley, as far as the corner of the Horse Gate toward the east, shall be holy to Yahweh[c][b]. It shall not be uprooted or overthrown again forever.
  footnotes:
  - marker: a
    text: Or 'fields' or 'slopes' for the difficult Hebrew term traditionally understood of the terraced areas around Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: '''Kidron Valley'' could also be rendered ''Kidron Brook,'' since the Hebrew term can refer to a wadi or seasonal watercourse as well as its valley.'
    reason: lexical_alternative
  - marker: c
    text: Or 'shall not be plucked up or torn down ever again.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 골짜기와 시체들과 재의 골짜기, 또 키드론 골짜기와 말 문 동쪽 모퉁이에 이르기까지의 모든 비탈은 야훼께 거룩한 곳이 될 것입니다. 다시는 뽑히지도, 허물어지지도 않을 것입니다, 영원히.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시체들과 재의’는 난해한 히브리어 표현을 반영한 것으로, 영어 POB처럼 ‘들판들’ 또는 ‘비탈들’로 이해할 가능성도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘키드론 골짜기’는 히브리어 נַחַל이 ‘골짜기’뿐 아니라 개울/와디를 가리킬 수 있어, ‘키드론 시내’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘다시는 … 허물어지지도 않을 것입니다’는 ‘다시는 뽑히지도, 무너뜨려지지도 않을 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הָעֵמֶק
  english_pob_choice: the whole valley
  chosen_korean: 모든 골짜기
  alternatives_korean:
  - 그 온 골짜기
  - 온 골짜기
  lexicon: HALOT
  rationale: עֵמֶק은 문맥상 지형적 ‘골짜기/계곡’이 자연스럽고, 여기서는 경계 설명의 첫 요소로서 ‘모든 골짜기’가 가장 직접적입니다.
- source_word: הַפְּגָרִים
  english_pob_choice: the corpses
  chosen_korean: 시체들
  alternatives_korean:
  - 송장들
  - 주검들
  lexicon: HALOT
  rationale: פֶּגֶר는 죽은 몸을 가리키므로, 한국어에서는 ‘시체들’이 가장 직설적이고 문맥의 혐오감을 잘 살립니다.
- source_word: הַדֶּשֶׁן
  english_pob_choice: the ashes
  chosen_korean: 재의
  alternatives_korean:
  - 재더미의
  - 재들
  lexicon: HALOT
  rationale: 이 난해한 항목은 영어 POB의 해설처럼 제의적 재더미를 가리키는 쪽이 문맥에 맞아, 한국어에서는 ‘재의’로 간명하게 옮겼습니다.
- source_word: הַשְׁרָמוֹת
  english_pob_choice: the terraces
  chosen_korean: 비탈
  alternatives_korean:
  - 테라스
  - 계단식 밭
  - 경사면
  lexicon: HALOT
  rationale: 어려운 히브리어 형태로, 예루살렘 주변의 경사진 구획들을 가리키는 뜻이 유력하므로 ‘비탈’로 넓게 옮겨 지형적 의미를 보존했습니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: holy to Yahweh
  chosen_korean: 야훼께 거룩한 곳
  alternatives_korean:
  - 야훼께 성별된 곳
  - 야훼께 성한 곳
  lexicon: HALOT
  rationale: קדש + לְ는 단순한 상태 묘사보다 ‘야훼께 속하여 거룩하게 됨’의 성별 의미를 가지므로, 한국어에서 자연스럽게 ‘거룩한 곳’으로 표현했습니다.
- source_word: לֹא יִנָּתֵשׁ וְלֹא יֵהָרֵס
  english_pob_choice: shall not be uprooted or overthrown
  chosen_korean: 다시는 뽑히지도, 허물어지지도 않을 것입니다
  alternatives_korean:
  - 다시는 뽑혀지지도, 무너뜨려지지도 않을 것입니다
  - 다시는 뽑히지도, 무너뜨려지지도 않을 것입니다
  lexicon: HALOT
  rationale: נתשׁ와 הרס는 예레미야의 회복/파괴 어휘쌍이므로, 각각 ‘뽑히다’와 ‘허물어지다’로 대응해 파괴의 두 측면을 살렸습니다.
- source_word: עוֹד לְעוֹלָם
  english_pob_choice: again forever
  chosen_korean: 다시는 … 영원히
  alternatives_korean:
  - 영원히 다시는
  - 영원히 다시
  lexicon: HALOT
  rationale: עוֹד와 לְעוֹלָם의 중첩된 부정을 한국어에서는 ‘다시는 … 영원히’로 풀어, 영구적 재파괴 불가라는 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: YHWH의 고유명사 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 언약적 신명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 직역해 고유성을 보존했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 거룩함의 범위
  chosen_reading: 열거된 전체 구역이 야훼께 거룩한 곳이 됨
  alternative_readings:
  - 오직 성전 구역만 거룩함
  - 단지 경계선상 표현일 뿐 거룩함은 제한됨
  rationale: 문장 구조상 열거된 모든 지형이 술어 ‘거룩한 곳’ 아래 놓이므로, 불쾌한 장소의 전면적 성별이라는 역전의 충격을 약화시키지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
