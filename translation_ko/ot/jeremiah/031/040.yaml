revisions:
- from: 그리고 모든 골짜기와 시체들과 재의 골짜기, 또 키드론 골짜기와 말 문 동쪽 모퉁이에 이르기까지의 모든 비탈은 야훼께 거룩한 곳이 될 것입니다. 다시는 뽑히지도, 허물어지지도 않을 것입니다, 영원히.[a][b][c]
  to: 시체와 재의 온 골짜기와 키드론 골짜기까지, 또 동쪽에 있는 말 문 모퉁이까지 이르는 모든 비탈[a][b]은 야훼께 거룩하게 될 것입니다. 그것은 영원히 다시는 뽑히거나 허물어지지 않을 것입니다.[c]
  rationale: 히브리어 원문을 우선하여 ‘시체와 재’가 ‘온 골짜기’를 수식하는 구조를 회복했습니다. 난해한 הַשְׁרָמוֹת의 불확실성은 본문에서 넓은 지형어 ‘비탈’로 유지하고 해당 위치에 각주를 붙였습니다. 두 번의 ‘~까지’가 표시하는 지리적 범위, 야훼께 드려진 거룩함, 그리고 ‘영원히 다시는’ 파괴되지 않는다는 선언을 보존했습니다.
  reviewer_model: gpt-5.6-terra
