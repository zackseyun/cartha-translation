translation:
  language: ko
  text: 보십시오[a], 내가 이스라엘 집 및 유다 집과 새 언약을 맺을 날들이 오고 있습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갱신된 언약’입니다. 히브리어 형용사는 가장 자연스럽게 ‘새’라는 뜻이지만, 일부 해석자들은 언약의 연속성을 강조해 ‘갱신된’으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
