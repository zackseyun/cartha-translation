source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/כָרַתִּ֗י אֶת בֵּ֧ית יִשְׂרָאֵ֛ל וְ/אֶת בֵּ֥ית יְהוּדָ֖ה בְּרִ֥ית חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/031.yaml
  text: Look[a], days are coming, declares Yahweh, when I will make a new covenant with the house of Israel and the house of Judah.
  footnotes:
  - marker: a
    text: Or 'a renewed covenant.' The Hebrew adjective most naturally means 'new,' but some interpreters stress covenant continuity and understand it as 'renewed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 날들이 오고 있습니다—야훼의 말씀입니다. 그때 내가 이스라엘 집과 유다 집과 새 언약을 맺겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갱신된 언약’입니다. 히브리어 형용사는 가장 자연스럽게 ‘새’라는 뜻이지만, 일부 해석자들은 언약의 연속성을 강조해 ‘갱신된’으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 주목을 끄는 예언적 도입 표현을 현대 한국어로 자연스럽게 살려, 다소 문어적인 ‘보라’보다 읽기 쉬운 ‘보십시오’를 택했습니다.
- source_word: יָמִים בָּאִים
  english_pob_choice: days are coming
  chosen_korean: 날들이 오고 있습니다
  alternatives_korean:
  - 날들이 다가오고 있습니다
  - 오는 날들이 있습니다
  lexicon: HALOT
  rationale: 미래를 알리는 관용구의 긴박성과 진행감을 살리되, 합쇼체 흐름에 맞게 현재진행형으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언서의 정형 표현을 한국어에서 가장 자연스러운 선포 공식으로 옮겼고, 본문이 지시하는 신적 발화임을 분명히 했습니다.
- source_word: בְּרִית חֲדָשָׁה
  english_pob_choice: a new covenant
  chosen_korean: 새 언약
  alternatives_korean:
  - 새로운 언약
  - 갱신된 언약
  lexicon: HALOT
  rationale: חֲדָשָׁה의 기본 의미를 따라 ‘새’로 옮겼으며, ‘갱신된’은 신학적 해석을 더한 대안이므로 본문에는 두지 않았습니다.
theological_decisions:
- issue: יהוה를 한국어에서 어떻게 표기할지
  chosen_reading: 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 판본의 원칙에 따라 고유명으로서의 신명사를 보존해, 제목어 ‘주’로 대체할 때 사라질 개인명을 드러냈습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: בְּרִית חֲדָשָׁה를 ‘새 언약’으로 둘지 ‘갱신된 언약’으로 풀지
  chosen_reading: ‘새 언약’으로 유지했습니다.
  alternative_readings:
  - 갱신된 언약
  rationale: 형용사 חֲדָשָׁה의 가장 직접적인 의미를 따랐고, 언약의 연속성 문제는 번역이 아니라 해석에서 다루도록 남겨 두었습니다.
  doctrine_reference: Translation philosophy and lexical note for covenant continuity
