  text: 다시 내가 너를 세울 것이며, 너는 세워질 것입니다[a], 처녀 이스라엘아[b]. 다시 네 탬버린으로 몸을 단장하고, 기뻐하는 이들과 함께 춤추며 나갈 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너는 다시 세워질 것이다.’ 히브리어는 같은 어근을 두 번 써서 ‘내가 너를 세우고, 너는 세워질 것이다’라는 반복을 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘젊은 이스라엘아.’ 회복된 젊음과 기쁨의 상태를 가리키는 비유적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기뻐하는 이들의 춤 가운데로 나갈 것이다.’
    reason: lexical_alternative
