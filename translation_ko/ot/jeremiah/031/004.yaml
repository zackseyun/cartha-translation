base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/004.yaml
  text: Again I will build you[a], and you will be built, O virgin Israel[c][b]; again you will adorn yourself with your tambourines and go out in the dance of those who celebrate.
  footnotes:
  - marker: a
    text: 'Or ''you will be rebuilt.'' The Hebrew uses the same root twice: ''I will build you, and you will be built.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'maiden Israel.' The phrase is a metaphorical address for Israel in restored youthful purity and joy.
    reason: lexical_alternative
  - marker: c
    text: Or 'go out in dancing with the merrymakers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다시 내가 너를 세울 것이며, 너는 세워질 것입니다, 오 처녀 이스라엘아. 다시 네 방울북을 차고 나가 기뻐하는 사람들의 춤 속으로 나아갈 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 다시 세워질 것이다.’ 히브리어는 같은 어근을 두 번 써서 ‘내가 너를 세우고, 너는 세워질 것이다’라는 반복을 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘처녀 이스라엘’의 호격으로 볼 수 있습니다. 회복된 젊음과 기쁨의 상태를 가리키는 비유적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기뻐하는 사람들과 함께 춤추며 나아갈 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  english_pob_choice: Again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 한번 더
  - 거듭
  lexicon: HALOT
  rationale: 회복 예언의 반복적 미래를 자연스럽게 드러내며, 두 절 모두의 반복감을 살립니다.
- source_word: אֶבְנֵךְ / וְנִבְנֵית
  english_pob_choice: I will build you / and you will be built
  chosen_korean: 내가 너를 세울 것이며, 너는 세워질 것입니다
  alternatives_korean:
  - 내가 너를 다시 지을 것이며, 너는 다시 지어질 것입니다
  - 내가 너를 건축할 것이며, 너는 건축될 것입니다
  lexicon: HALOT
  rationale: 동일 어근의 반복을 한국어에서도 ‘세우다 / 세워지다’로 살려 회복과 재건의 병렬을 보존했습니다.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  english_pob_choice: O virgin Israel
  chosen_korean: 오 처녀 이스라엘아
  alternatives_korean:
  - 오 동정녀 이스라엘아
  - 오 소녀 이스라엘아
  - 오 처녀 이스라엘
  lexicon: HALOT
  rationale: 직설적 은유를 유지하되, 한국어에서는 호격을 분명히 하기 위해 ‘-아’를 붙였습니다. 전통 교회어보다 원문의 호명성과 회복의 정서를 우선했습니다.
- source_word: תֻפַּיִךְ
  english_pob_choice: your tambourines
  chosen_korean: 네 방울북
  alternatives_korean:
  - 네 소고
  - 네 탬버린
  - 네 북
  lexicon: HALOT
  rationale: 고대 예배·축제용 타악기의 이미지를 현대 한국어에서 가장 자연스럽게 전달할 수 있는 말로 옮겼습니다. ‘탬버린’은 현대적이지만 상업적 뉘앙스가 있어 피했습니다.
- source_word: מְשַׂחֲקִים
  english_pob_choice: those who celebrate
  chosen_korean: 기뻐하는 사람들
  alternatives_korean:
  - 환호하는 사람들
  - 즐거워하는 사람들
  - 흥겨워하는 사람들
  lexicon: HALOT
  rationale: 활기찬 축제의 동작과 정서를 살리되, ‘놀다’의 오해를 피하고 문맥상 공동체적 기쁨을 분명히 했습니다.
theological_decisions:
- issue: 회복 예언에서의 ‘처녀 이스라엘’ 은유 보존
  chosen_reading: 은유를 풀지 않고 직접 유지했습니다.
  alternative_readings:
  - 오 이스라엘의 처녀여
  - 오 젊은 이스라엘아
  - 회복된 이스라엘아
  rationale: 문맥은 문자적 성적 상태가 아니라, 심판 후 회복된 순결·새 출발의 이미지를 담고 있으므로 원문의 긴장과 상징성을 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
