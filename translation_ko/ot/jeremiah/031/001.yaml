id: JER.31.1
reference: Jeremiah 31:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה אֶֽהְיֶה֙ לֵֽ/אלֹהִ֔ים לְ/כֹ֖ל מִשְׁפְּח֣וֹת יִשְׂרָאֵ֑ל וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/001.yaml
  text: At that time[a], declares Yahweh, I will be God to all the families of Israel, and they will be my people.
  footnotes:
  - marker: a
    text: Or 'clans' instead of 'families.' The Hebrew term can denote extended family groups within Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에[a] 야훼께서 말씀하십니다. “나는 이스라엘의 모든 가문에게 하나님이 되고, 그들은 내 백성이 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가문’은 כאן의 히브리어가 가리킬 수 있는 확대 가족 집단을 반영합니다. 번역 관행에 따라 ‘씨족’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그때
  lexicon: HALOT
  rationale: 미래적 예언 문맥의 시간 부사를 한국어로 자연스럽게 옮기되, 원문의 지시성을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: נְאֻם은 예언 공식이므로 ‘말씀하십니다’로 옮겨 현재적 선포감을 살렸고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 직역했습니다.
- source_word: לְכֹל מִשְׁפְּחֹת יִשְׂרָאֵל
  english_pob_choice: to all the families of Israel
  chosen_korean: 이스라엘의 모든 가문에게
  alternatives_korean:
  - 이스라엘의 모든 가족에게
  - 이스라엘의 모든 씨족에게
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 문맥상 확대된 가족 단위이므로 ‘가문’이 ‘families/clans’의 범위를 비교적 정확하게 담으면서도 한국어에서 자연스럽습니다.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  english_pob_choice: and they will be my people
  chosen_korean: 그들은 내 백성이 될 것입니다
  alternatives_korean:
  - 그들은 내 백성이 됩니다
  - 그들은 내 백성일 것입니다
  lexicon: HALOT
  rationale: 언약 공식의 상호 귀속 관계를 한국어의 통용 표현인 ‘내 백성’으로 보존했습니다.
theological_decisions:
- issue: 언약 공식의 관계적 표현
  chosen_reading: 나는 이스라엘의 모든 가문에게 하나님이 되고, 그들은 내 백성이 될 것입니다
  alternative_readings:
  - 나는 이스라엘의 모든 가문을 위한 하나님이 될 것입니다
  - 나는 이스라엘의 모든 가문에게 한 하나님이 되고 그들은 한 백성이 될 것입니다
  rationale: 히브리어의 언약적 상호구문(‘~의 하나님 / 내 백성’)을 평이하지만 신학적 힘이 살아 있는 형태로 유지했습니다.
  doctrine_reference: 창 17:7; 출 6:7과 같은 언약 공식
- issue: 직접 인용 내부의 문체
  chosen_reading: “나는 … 될 것입니다.”
  alternative_readings:
  - “나는 … 되겠습니다.”
  - “나는 … 되리라.”
  rationale: 예언적 신탁을 현대 표준어 합쇼체로 옮기되, 하나님의 직접 발화이므로 존대 어미를 사용했습니다.
  doctrine_reference: '번역 스타일 지침: 하나님께 직접 말할 때의 존대 표지'
