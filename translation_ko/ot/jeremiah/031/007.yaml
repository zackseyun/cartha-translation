source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה רָנּ֤וּ לְ/יַֽעֲקֹב֙ שִׂמְחָ֔ה וְ/צַהֲל֖וּ בְּ/רֹ֣אשׁ הַ/גּוֹיִ֑ם הַשְׁמִ֤יעוּ הַֽלְלוּ֙ וְ/אִמְר֔וּ הוֹשַׁ֤ע יְהוָה֙ אֶֽת עַמְּ/ךָ֔ אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/007.yaml
  text: 'For thus says Yahweh: Sing aloud with gladness for Jacob[a], and shout at the head of the nations; proclaim, praise, and say, “Save, Yahweh, your people, the remnant of Israel.”'
  footnotes:
  - marker: a
    text: Or “at the head of the nations” or “over the chief of the nations.” The Hebrew phrase is difficult and may emphasize Israel’s prominence among the nations or the public setting of the proclamation.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이처럼 말씀하십니다. 「야곱을 위하여, 기쁨으로 크게 노래하고, 민족들의 머리에서 환호하십시오. 선포하고, 찬양하며, ‘야훼여, 당신의 백성, 이스라엘의 남은 자를 구원해 주십시오’라고 말하십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “민족들의 머리에서”입니다. 이 구절은 이스라엘의 우위 또는 공적 선포의 자리라는 뜻을 둘 다 시사할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 그대로 드러내기 위해, POB의 영어 선택 Yahweh를 따라 한국어도 ‘야훼’로 옮겼습니다.
- source_word: רָנּוּ לְיַעֲקֹב שִׂמְחָה
  english_pob_choice: Sing aloud with gladness for Jacob
  chosen_korean: 야곱을 위하여, 기쁨으로 크게 노래하고
  alternatives_korean:
  - 야곱을 향하여 기쁘게 외치고
  - 야곱을 위해 즐겁게 외치고
  lexicon: HALOT
  rationale: רנן의 강한 환호성을 살려 ‘크게 노래하고’로 옮기고, ל의 관계를 POB의 ‘for Jacob’에 맞춰 ‘야곱을 위하여’로 처리했습니다.
- source_word: בְּרֹאשׁ הַגּוֹיִם
  english_pob_choice: at the head of the nations
  chosen_korean: 민족들의 머리에서
  alternatives_korean:
  - 민족들의 우두머리에서
  - 민족들의 머리에서
  - 민족들 가운데서
  lexicon: HALOT
  rationale: 히브리어가 압축적이라 위치와 우위의 뉘앙스를 함께 가질 수 있으므로, ‘머리’를 살려 직역 쪽을 유지하면서도 한국어로 자연스럽게 들리도록 했습니다.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  english_pob_choice: the remnant of Israel
  chosen_korean: 이스라엘의 남은 자
  alternatives_korean:
  - 이스라엘의 남은 무리
  - 이스라엘의 남은 자들
  lexicon: HALOT
  rationale: 예언서의 중요한 언약적 용어인 שְׁאֵרִית을 ‘남은 자’로 표준화해, 역사적 생존집단 이상의 신학적 뉘앙스를 보존했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 본문과 직접 대응하는 고유명사로 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 이름을 직접 사용하므로, 전통적 대체 호칭보다 이름 자체를 드러내는 번역이 원문의 언약적 호소를 더 분명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: “민족들의 머리”의 모호성
  chosen_reading: 지리적 위치보다 공개적 선포와 우위 가능성을 함께 남기는 표현으로 처리했습니다.
  alternative_readings:
  - 민족들의 맨 앞에서
  - 민족들 가운데서
  - 민족들의 우두머리 위에서
  rationale: 히브리어 표현이 문법적으로 압축되어 있어 단정적 해석을 피하고, 독자가 본문의 시적 긴장을 읽을 수 있도록 여지를 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
