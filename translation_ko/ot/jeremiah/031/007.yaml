  terminology: ‘야훼’, ‘야곱’, ‘이스라엘’, ‘남은 자’는 원문 및 POB의 용어 선택에 적절히 대응합니다. שְׁאֵרִית의 집합적 의미를 고려하여 ‘남은 자’는 단수형이지만 집단을 가리키는 예언서 용어로 유지할 수 있습니다.
