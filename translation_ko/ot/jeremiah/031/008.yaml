  rationale: 본문은 취약한 사람들을 회복 공동체의 실제 구성원으로 제시하여 하나님의 회복이 배제보다 포괄적임을 드러냅니다.
  doctrine_reference: 본문의 명시적 열거를 우선하고 신학적 긴장을 보존합니다.
