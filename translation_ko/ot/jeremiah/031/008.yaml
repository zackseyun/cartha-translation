base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
  footnotes:
  - marker: a
    text: Or 'from the farthest parts of the land'; Hebrew אֶרֶץ can mean either 'earth' or 'land' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 그들을 북쪽 땅에서 데려오고 땅 끝에서부터 모으겠습니다. 그들 가운데는 눈먼 사람과 다리 저는 사람, 임신한 여자와 해산하는 여자가 함께 있을 것입니다. 큰 회중이 여기로 돌아올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 가장 먼 곳에서부터’. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅’ 또는 ‘earth’의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기에
  lexicon: HALOT
  rationale: 예언적 주의를 환기하는 감탄사로서 문어체 합쇼체에 자연스러운 직접 호소를 살렸습니다.
- source_word: מֵבִיא
  english_pob_choice: I am bringing
  chosen_korean: 데려오고
  alternatives_korean:
  - 가져오고
  - 이끌어오고
  lexicon: HALOT
  rationale: 현재분사적 긴박감을 살리되, 포로 귀환 맥락에서 사람들을 ‘데려오다’가 가장 자연스럽고 직접적입니다.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  english_pob_choice: from the farthest parts of the earth
  chosen_korean: 땅 끝에서부터
  alternatives_korean:
  - 땅의 가장 먼 곳에서부터
  - 세상 끝에서부터
  lexicon: HALOT
  rationale: אֶרֶץ의 문맥상 넓은 지리적 범위를 살리면서도 한국어 관용으로 과장 없이 옮겼습니다.
- source_word: קָהָל גָּדוֹל
  english_pob_choice: a great assembly
  chosen_korean: 큰 회중
  alternatives_korean:
  - 큰 모임
  - 큰 집회
  lexicon: HALOT
  rationale: קהָל의 집합체 의미를 살리되, 교회 제도 용어로 고정되지 않도록 ‘회중’을 택했습니다.
theological_decisions:
- issue: 회복된 공동체에 포함되는 대상
  chosen_reading: 눈먼 사람, 다리 저는 사람, 임신한 여자, 해산하는 여자가 실제로 그 귀환 무리에 포함됩니다.
  alternative_readings:
  - 단지 많은 수를 강조하는 수사적 열거로 볼 수 있습니다.
  rationale: 본문은 취약한 사람들을 회복 공동체의 실제 구성원으로 제시하여 하나님의 회복이 배제보다 포괄적임을 드러냅니다.
  doctrine_reference: 본문의 명시적 열거를 우선하고 신학적 긴장을 보존합니다.
