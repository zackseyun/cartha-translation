base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
  footnotes:
  - marker: a
    text: Or 'from the farthest parts of the land'; Hebrew אֶרֶץ can mean either 'earth' or 'land' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 그들을 북쪽 땅에서 데려오고 땅의 가장 먼 곳들에서[a] 모으겠습니다. 그들 가운데에는 눈먼 사람과 다리 저는 사람, 임신한 여자와 해산 중인 여자가 있을 것이며, 이들이 함께 있을 것입니다. 큰 회중이 여기로 돌아올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 가장 먼 곳들에서’. 히브리어 אֶרֶץ는 문맥에 따라 ‘땅 전체’ 또는 ‘그 땅’을 뜻할 수 있습니다.
    reason: lexical_alternative
