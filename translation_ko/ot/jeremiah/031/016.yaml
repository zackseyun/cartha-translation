source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מִנְעִ֤י קוֹלֵ/ךְ֙ מִ/בֶּ֔כִי וְ/עֵינַ֖יִ/ךְ מִ/דִּמְעָ֑ה כִּי֩ יֵ֨שׁ שָׂכָ֤ר לִ/פְעֻלָּתֵ/ךְ֙ נְאֻם יְהוָ֔ה וְ/שָׁ֖בוּ מֵ/אֶ֥רֶץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/016.yaml
  text: 'Thus says Yahweh: Restrain your voice from weeping and your eyes from tears[a], for there is a reward for your work, declares Yahweh[b], and they will return from the land of the enemy.'
  footnotes:
  - marker: a
    text: Or 'Hold back your voice from crying.'
    reason: lexical_alternative
  - marker: b
    text: The implied subject of 'they will return' is Rachel's children, that is, the exiles spoken of in the surrounding context.
    reason: cross_reference
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「울음에서 네 목소리를 거두고, 눈물에서 네 눈을 거두십시오.[a] 네 수고에 보상이 있으니, 야훼의 말씀입니다.[b] 그들은 원수의 땅에서 돌아올 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우는 소리에서 네 목소리를 거두십시오.’
    reason: lexical_alternative
  - marker: b
    text: ‘그들은’의 암시된 주어는 라헬의 자녀들, 곧 주변 문맥에서 말하는 포로들입니다.
    reason: cross_reference
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 선포 공식으로서 자연스러운 현대 한국어로 옮기되, 여호와가 아니라 야훼를 유지하여 신명 직접 표기를 반영했습니다.
- source_word: מִנְעִי קוֹלֵךְ מִבֶּכִי וְעֵינַיִךְ מִדִּמְעָה
  english_pob_choice: Restrain your voice from weeping, and your eyes from tears
  chosen_korean: 울며 부르짖는 소리에서 네 목소리를, 눈물에서 네 눈을 거두어라
  alternatives_korean:
  - 울음소리에서 네 목소리를 멈추어라, 눈물에서 네 눈을 거두어라
  - 우는 소리에서 네 목소리를 막아라, 눈물에서 네 눈을 거두어라
  lexicon: HALOT
  rationale: 히브리어의 평행법과 신체 이미지(목소리/눈)를 살리면서, 단순히 ‘울음을 그치다’로 평준화하지 않고 금지·중단의 뉘앙스를 담았습니다.
- source_word: שָׂכָר לִפְעֻלָּתֵךְ
  english_pob_choice: a reward for your work
  chosen_korean: 네 수고에는 상이 있으니
  alternatives_korean:
  - 네 일에는 보상이 있으니
  - 네 노동에는 상급이 있으니
  lexicon: HALOT
  rationale: שָׂכָר의 보상/삯/상이라는 의미를 살리되, 한국어에서 예언적 위로로 자연스러운 ‘상이 있다’를 선택했습니다. פְעֻלָּה는 단순 노동보다 ‘수고’가 문맥상 적절합니다.
- source_word: וְשָׁבוּ מֵאֶרֶץ אוֹיֵב
  english_pob_choice: and they will return from the land of the enemy
  chosen_korean: 그들이 원수의 땅에서 돌아올 것이다
  alternatives_korean:
  - 그들이 적의 땅에서 돌아올 것이다
  - 그들이 원수의 땅으로부터 돌아올 것이다
  lexicon: HALOT
  rationale: 암시된 복수 주어를 그대로 ‘그들’로 두어 본문의 간결함을 유지했고, מֵאֶרֶץ אוֹיֵב는 한국어에서 자연스러운 ‘원수의 땅’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 발화의 인용부 및 마침표 처리
  chosen_reading: 직접 인용을 따옴표로 묶고, 화자 표지는 본문 안에 유지했습니다.
  alternative_readings:
  - 따옴표 없이 서술문으로만 처리
  - 화자 표지를 각주로 이동
  rationale: 원문은 야훼의 직접 발화가 분명하므로, 한국어 독자에게 예언 선포의 긴장감을 살리는 방식이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
- issue: 마지막 동사의 암시된 주어
  chosen_reading: ‘그들’로 처리했습니다.
  alternative_readings:
  - ‘네 자녀가’라고 명시
  - ‘포로들이’라고 명시
  rationale: 히브리어는 복수 주어를 생략하므로, 본문에는 최소한의 대명사만 두고 주변 문맥의 해석 가능성은 보존하는 편이 소스 충실도에 맞습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1'
