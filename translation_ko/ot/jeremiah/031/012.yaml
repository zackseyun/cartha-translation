reference: Jeremiah 31:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָאוּ֮ וְ/רִנְּנ֣וּ בִ/מְרוֹם צִיּוֹן֒ וְ/נָהֲר֞וּ אֶל ט֣וּב יְהוָ֗ה עַל דָּגָן֙ וְ/עַל תִּירֹ֣שׁ וְ/עַל יִצְהָ֔ר וְ/עַל בְּנֵי צֹ֖אן וּ/בָקָ֑ר וְ/הָיְתָ֤ה נַפְשָׁ/ם֙ כְּ/גַ֣ן רָוֶ֔ה וְ/לֹא יוֹסִ֥יפוּ לְ/דַאֲבָ֖ה עֽוֹד־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/012.yaml
  text: They will come and shout for joy on the height of Zion[a], and they will stream to the goodness of Yahweh, to the grain, the new wine, and the fresh oil, and to the young of the flock and the herd. Their life will be like a well-watered garden[d][c][b], and they will never again waste away.
  footnotes:
  - marker: a
    text: Or 'to the bounty of the LORD.' The Hebrew 'goodness' here includes the good things he provides, as the following list shows.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will flow to the goodness of the LORD.' The Hebrew verb can picture a flowing movement toward Zion's blessings.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'their soul.' Here it refers to their life or whole self, not only the immaterial aspect of a person.
    reason: lexical_alternative
  - marker: d
    text: Or 'they will sorrow no more' / 'they will no longer languish.' The Hebrew expression can denote grief that causes one to pine away.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 와서 시온의 높은 곳에서 기뻐 외칠 것이며, 야훼의 선하심, 곧 곡식과 새 포도주와 기름과 양 떼와 소 떼의 새끼에게로 흘러갈 것입니다. 그들의 생명은 물이 넉넉한 정원 같을 것이며, 다시는 쇠약해지지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 풍성함’입니다. 여기의 히브리어 ‘선하심’은 뒤따르는 목록이 보여 주듯, 그분이 주시는 좋은 것들까지 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 혼/생명’입니다. 여기서는 비물질적 영혼만이 아니라 사람의 삶 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다시는 애통하지 않을 것입니다’ / ‘다시는 쇠잔해지지 않을 것입니다’입니다. 이 표현은 슬픔 때문에 시들어 가는 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִנְּנוּ
  english_pob_choice: shout for joy
  chosen_korean: 기뻐 외칠 것이며
  alternatives_korean:
  - 환호할 것이며
  - 즐거이 노래할 것이며
  lexicon: HALOT
  rationale: רנן은 기쁨의 소리를 내는 뜻이므로, 현대 한국어에서 자연스럽고 강한 감정을 살리는 ‘기뻐 외치다’가 적절합니다.
- source_word: בִמְרוֹם צִיּוֹן
  english_pob_choice: on the height of Zion
  chosen_korean: 시온의 높은 곳에서
  alternatives_korean:
  - 시온의 높이에
  - 시온의 산당에서
  lexicon: HALOT
  rationale: מָרוֹם의 공간적 높이를 살려 ‘높은 곳’으로 옮겼고, ‘에서’로 위치를 자연스럽게 표현했습니다.
- source_word: אֶל טוּב יְהוָה
  english_pob_choice: to the goodness of the LORD
  chosen_korean: 야훼의 선하심
  alternatives_korean:
  - 야훼의 좋으심
  - 야훼의 풍성하심
  lexicon: HALOT
  rationale: טוּב는 단순한 도덕적 선함보다 베푸시는 선물의 풍성함까지 포함하므로, POB의 audit trail에 맞춰 ‘선하심’으로 옮겼습니다.
- source_word: וְהָיְתָה נַפְשָׁם
  english_pob_choice: Their life will be
  chosen_korean: 그들의 생명은
  alternatives_korean:
  - 그들의 혼은
  - 그들의 영혼은
  lexicon: HALOT
  rationale: נֶפֶשׁ는 כאן에서 비물질적 ‘영혼’보다 삶 전체를 가리키므로, 주해적 의미를 살려 ‘생명’으로 번역했습니다.
- source_word: וְלֹא יוֹסִיפוּ לְדַאֲבָה עוֹד
  english_pob_choice: and they will never again waste away
  chosen_korean: 다시는 쇠약해지지 않을 것입니다
  alternatives_korean:
  - 다시는 애통하지 않을 것입니다
  - 다시는 시들지 않을 것입니다
  lexicon: HALOT
  rationale: דָּאַב은 슬픔으로 인해 기운이 꺾이고 쇠약해지는 뉘앙스가 있어, 결과를 드러내는 ‘쇠약해지다’가 가장 가깝습니다.
theological_decisions:
- issue: 예언적 미래 표현과 주어의 집합적 의미
  chosen_reading: ‘그들은 와서…할 것이며’로 예언적 미래를 자연스럽게 살리고, 집합적 백성을 가리키는 복수 주어를 유지했습니다.
  alternative_readings:
  - ‘그들이 와서…합니다’
  - ‘그들은 와서…할 것입니다’
  rationale: 히브리어 완료형/연결형이 예언적 미래로 기능하므로, 한국어에서도 미래를 분명히 하되 문체는 합쇼체로 통일하는 것이 본문 흐름에 맞습니다.
  doctrine_reference: Jeremiah 31:12의 회복 약속과 예언적 미래 용법
