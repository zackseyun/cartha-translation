  rationale: אִיִּים은 ‘섬들/해안들’의 넓은 의미를 가지므로, POB의 지리적 뉘앙스를 따라 ‘해안들’로 옮기고 고유명은 음역했습니다.
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  english_pob_choice: consider carefully
  chosen_korean: 아주 자세히 살펴보아
  alternatives_korean:
  - 신중히 생각해 보아
  - 매우 자세히 살펴보아
  lexicon: HALOT
  rationale: 히트보넨은 단순 관찰보다 숙고와 주의 깊은 검토를 뜻하므로, 강세를 반영해 ‘아주 자세히 살펴보아’로 풀었습니다.
- source_word: הֵן הָיְתָה כָּזֹאת
  english_pob_choice: whether there has ever been anything like this
  chosen_korean: 이런 일이 한 번이라도 있었는지
  alternatives_korean:
  - 이런 일이 있었는지
  - 이와 같은 일이 있었는지
  lexicon: HALOT
  rationale: 수사적 질문의 놀라움과 비교성을 살리기 위해, 단순 과거 여부보다 ‘한 번이라도’로 강도를 드러냈습니다.
theological_decisions:
- issue: 서쪽-동쪽 대조의 전달
  chosen_reading: 깃딤의 해안들과 게달을 나란히 배치해, 멀리 떨어진 서쪽 해상 지역과 동쪽/남동쪽 아라비아 지역의 대비를 드러냈습니다.
  alternative_readings:
  - 지명만 나열해 중립적으로 옮김
  - 지역 설명을 본문 안에 자세히 삽입함
  rationale: 본문의 수사적 핵심은 양 극단의 지역을 불러 비교하게 하는 데 있으므로, 지명 배열 자체가 대비를 드러내도록 유지했습니다.
  doctrine_reference: 본문 수사 이해
