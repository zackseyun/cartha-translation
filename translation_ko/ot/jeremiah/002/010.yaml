source:
  edition: WLC
  text: כִּ֣י עִבְר֞וּ אִיֵּ֤י כִתִּיִּים֙ וּ/רְא֔וּ וְ/קֵדָ֛ר שִׁלְח֥וּ וְ/הִֽתְבּוֹנְנ֖וּ מְאֹ֑ד וּ/רְא֕וּ הֵ֥ן הָיְתָ֖ה כָּ/זֹֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
  footnotes:
  - marker: a
    text: Or 'the islands/coastlands of Kittim.' 'Kittim' likely refers to Cyprus or, more broadly, western maritime lands.
    reason: lexical_alternative
  - marker: b
    text: Kedar refers to Arabian tribes or territory to the east/southeast, forming a west-to-east comparison with Kittim.
    reason: cultural_note
translation:
  language: ko
  text: 깃딤의 섬 지역으로 건너가 보십시오[a]. 게달에 사람을 보내어[b] 아주 주의 깊이 살펴보십시오[c]. 이와 같은 일이 있었는지 보십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깃딤의 섬 지역’은 ‘깃딤의 섬들’ 또는 ‘깃딤의 해안 지역’으로도 옮길 수 있습니다. ‘깃딤’은 키프로스를 가리킬 수도 있고, 더 넓게는 서쪽의 해상 지역들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 문자적으로 ‘게달에 보내라’라고 하며 무엇을 보낼지는 밝히지 않습니다. 여기서는 한국어의 자연스러운 표현을 위해 ‘사람’을 보충했습니다. ‘게달’은 아라비아의 부족들 또는 그 지역을 가리키며, 깃딤과 함께 서쪽과 동쪽/남동쪽의 대비를 이룹니다.
    reason: cultural_note
  - marker: c
    text: ‘아주 주의 깊이 살펴보십시오’는 단순히 보는 것뿐 아니라 면밀히 관찰하고 숙고하라는 뜻입니다.
    reason: lexical_alternative
