id: JER.2.10
reference: Jeremiah 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י עִבְר֞וּ אִיֵּ֤י כִתִּיִּים֙ וּ/רְא֔וּ וְ/קֵדָ֛ר שִׁלְח֥וּ וְ/הִֽתְבּוֹנְנ֖וּ מְאֹ֑ד וּ/רְא֕וּ הֵ֥ן הָיְתָ֖ה כָּ/זֹֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
  footnotes:
  - marker: a
    text: Or 'the islands/coastlands of Kittim.' 'Kittim' likely refers to Cyprus or, more broadly, western maritime lands.
    reason: lexical_alternative
  - marker: b
    text: Kedar refers to Arabian tribes or territory to the east/southeast, forming a west-to-east comparison with Kittim.
    reason: cultural_note
translation:
  language: ko
  text: 이는 너희가 가서 깃딤의 해안들을 보고[a], 게달로 보내고[b], 아주 자세히 살펴보아[c] 이런 일이 한 번이라도 있었는지 보라는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깃딤’은 키프로스 또는 더 넓게는 서쪽 해상 지역을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘게달’은 아라비아의 부족들 또는 그 지역을 가리키며, 깃딤과 함께 서쪽-동쪽의 대비를 이룹니다.
    reason: cultural_note
  - marker: c
    text: 원문은 단순 관찰이 아니라 주의 깊은 숙고를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ
  english_pob_choice: cross over
  chosen_korean: 가서
  alternatives_korean:
  - 건너가서
  - 지나가서
  lexicon: HALOT
  rationale: 히브리어 명령형의 이동 감각을 살리되, 한국어에서는 자연스럽고 간결한 ‘가서’가 문맥상 가장 읽기 좋습니다.
- source_word: אִיֵּי כִתִּיִּים
  english_pob_choice: the coasts of Kittim
  chosen_korean: 깃딤의 해안들
  alternatives_korean:
  - 깃딤의 섬들
  - 깃딤의 해안지방
  lexicon: HALOT
  rationale: אִיִּים은 ‘섬들/해안들’의 넓은 의미를 가지므로, POB의 지리적 뉘앙스를 따라 ‘해안들’로 옮기고 고유명은 음역했습니다.
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  english_pob_choice: consider carefully
  chosen_korean: 아주 자세히 살펴보아
  alternatives_korean:
  - 신중히 생각해 보아
  - 매우 자세히 살펴보아
  lexicon: HALOT
  rationale: 히트보넨은 단순 관찰보다 숙고와 주의 깊은 검토를 뜻하므로, 강세를 반영해 ‘아주 자세히 살펴보아’로 풀었습니다.
- source_word: הֵן הָיְתָה כָּזֹאת
  english_pob_choice: whether there has ever been anything like this
  chosen_korean: 이런 일이 한 번이라도 있었는지
  alternatives_korean:
  - 이런 일이 있었는지
  - 이와 같은 일이 있었는지
  lexicon: HALOT
  rationale: 수사적 질문의 놀라움과 비교성을 살리기 위해, 단순 과거 여부보다 ‘한 번이라도’로 강도를 드러냈습니다.
theological_decisions:
- issue: 서쪽-동쪽 대조의 전달
  chosen_reading: 깃딤의 해안들과 게달을 나란히 배치해, 멀리 떨어진 서쪽 해상 지역과 동쪽/남동쪽 아라비아 지역의 대비를 드러냈습니다.
  alternative_readings:
  - 지명만 나열해 중립적으로 옮김
  - 지역 설명을 본문 안에 자세히 삽입함
  rationale: 본문의 수사적 핵심은 양 극단의 지역을 불러 비교하게 하는 데 있으므로, 지명 배열 자체가 대비를 드러내도록 유지했습니다.
  doctrine_reference: 본문 수사 이해
