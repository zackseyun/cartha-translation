  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מֵ/עוֹלָ֞ם שָׁבַ֣רְתִּי עֻלֵּ֗/ךְ נִתַּ֨קְתִּי֙ מוֹסְרֹתַ֔יִ/ךְ וַ/תֹּאמְרִ֖י לֹ֣א אעבד כִּ֣י עַֽל כָּל גִּבְעָ֞ה גְּבֹהָ֗ה וְ/תַ֨חַת֙ כָּל עֵ֣ץ רַעֲנָ֔ן אַ֖תְּ צֹעָ֥ה זֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/020.yaml
  text: For long ago I broke your yoke[a]; I tore off your bonds. But you said, “I will not serve.” Indeed, on every high hill and under every green tree[c][b], you sprawled out as a prostitute.
  footnotes:
  - marker: a
    text: Or 'from of old.' The Hebrew phrase can denote remote past; here it likely refers to Israel's earlier history of deliverance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'under every green tree,' a stock prophetic expression for places associated with idolatrous worship.
    reason: cultural_note
  - marker: c
    text: The Hebrew verb rendered 'sprawled out' is rare and difficult; alternatives include 'bent down' or similar expressions of sexual availability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데도 오래전부터 내가 네 멍에를 부러뜨리고 네 줄들을 끊어 주었는데, 너는 「나는 섬기지 않겠다」라고 말했습니다. 참으로 너는 모든 높은 언덕 위와 모든 푸른 나무 아래에서 몸을 굽혀 창녀처럼 행동했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebrew 'for long ago,' a temporal phrase that points back to Israel's earlier deliverance history rather than abstract eternity.
    reason: source_note
  - marker: b
    text: Hebrew 'under every green tree,' a stock prophetic expression for places associated with idolatrous worship.
    reason: cultural_note
  - marker: c
    text: The Hebrew verb here is rare and difficult; alternatives include 'bent down' or similar expressions of sexual availability.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  english_pob_choice: for long ago
  chosen_korean: 오래전부터
  alternatives_korean:
  - 옛적부터
  - 먼 옛날부터
  - 예로부터
  lexicon: HALOT
  rationale: 문맥상 영원한 과거가 아니라 해방의 오래된 시점을 가리키므로, 자연스러운 현대 한국어로 시간의 거리감을 살렸습니다.
- source_word: שָׁבַרְתִּי עֻלֵּךְ / נִתַּקְתִּי מוֹסְרֹתַיִךְ
  english_pob_choice: I broke your yoke / I tore off your bonds
  chosen_korean: 네 멍에를 부러뜨리고 네 줄들을 끊어 주었는데
  alternatives_korean:
  - 네 멍에를 깨뜨리고 네 속박을 끊어 주었는데
  - 네 멍에를 부수고 네 결박을 벗겨 주었는데
  lexicon: HALOT
  rationale: 두 동사는 해방의 구체적 이미지를 이루므로, 멍에는 '부러뜨리고', 결박줄은 '끊어' 대응시켜 원문의 중첩된 구출 이미지를 살렸습니다.
- source_word: לֹא אעבד
  english_pob_choice: I will not serve
  chosen_korean: 나는 섬기지 않겠다
  alternatives_korean:
  - 나는 종노릇하지 않겠다
  - 나는 섬기지 않겠습니다
  - 나는 복종하지 않겠다
  lexicon: HALOT
  rationale: עבד는 문맥상 종속 상태와 섬김을 함께 포괄하므로, 우상숭배 문맥으로 과도하게 좁히지 않으면서도 자연스러운 거절 표현으로 옮겼습니다.
- source_word: עַל כָּל גִּבְעָה גְּבֹהָה וְתַחַת כָּל עֵץ רַעֲנָן
  english_pob_choice: on every high hill and under every green tree
  chosen_korean: 모든 높은 언덕 위와 모든 푸른 나무 아래에서
  alternatives_korean:
  - 모든 높은 산 위와 모든 무성한 나무 아래에서
  - 모든 높은 언덕과 푸른 나무마다
  lexicon: HALOT
  rationale: 예언서에서 우상숭배 장소를 가리키는 관용구이므로, 직역에 가까운 '푸른 나무'를 유지해 상투적 표현의 뉘앙스를 보존했습니다.
- source_word: צֹעָה זֹנָה
  english_pob_choice: you sprawled out as a prostitute
  chosen_korean: 몸을 굽혀 창녀처럼 행동했습니다
  alternatives_korean:
  - 몸을 벌리고 창녀처럼 드러누웠습니다
  - 주저앉아 창녀처럼 행동했습니다
  - 몸을 굽혀 음녀처럼 행동했습니다
  lexicon: HALOT
  rationale: 희귀하고 난해한 동사의 구체적 자세를 단정하기보다, 예언적 성적 비유의 수치를 드러내는 방향으로 옮기되 과도한 노골화는 피했습니다.
theological_decisions:
- issue: 우상숭배를 묘사하는 성적 비유의 보존
  chosen_reading: '''창녀처럼 행동했습니다''로 직설적 이미지를 유지했습니다.'
  alternative_readings:
  - '''부정했습니다''로 완화함'
  - '''우상숭배를 했습니다''로 의미를 설명함'
  rationale: 예레미야는 언약 배반을 성적 불륜 이미지로 고발하므로, 의미를 완화하면 예언의 날카로움과 수치의 효과가 약해집니다.
  doctrine_reference: 원문 우선 번역 원칙; 비유의 긴장을 해소하지 않음
