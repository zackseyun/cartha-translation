id: JER.2.24
reference: Jeremiah 2:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֶּ֣רֶה לִמֻּ֣ד מִדְבָּ֗ר בְּ/אַוַּ֤ת נפש/ו שָׁאֲפָ֣ה ר֔וּחַ תַּאֲנָתָ֖/הּ מִ֣י יְשִׁיבֶ֑/נָּה כָּל מְבַקְשֶׁ֨י/הָ֙ לֹ֣א יִיעָ֔פוּ בְּ/חָדְשָׁ֖/הּ יִמְצָאֽוּ/נְהָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/024.yaml
  text: A wild donkey accustomed to the wilderness[a], in the craving of her appetite sniffs the wind; in her heat, who can turn her back? All who seek her will not weary themselves[c][b]; in her month they will find her.
  footnotes:
  - marker: a
    text: Or 'snuffs up the wind.' The Hebrew idiom pictures the animal eagerly scenting the air in restless desire.
    reason: lexical_alternative
  - marker: b
    text: Or 'in her rut' or 'in her lust.' The Hebrew refers to the season/state of sexual craving.
    reason: lexical_alternative
  - marker: c
    text: Literally 'in her month,' likely meaning the time of her heat or mating cycle.
    reason: cultural_note
translation:
  language: ko
  text: 광야에 익숙한 들나귀는 제 욕망이 시키는 대로 바람을 들이마십니다. 발정기에는 누가 그 몸을 돌려세울 수 있겠습니까? 그를 찾는 사람은 아무도 지치지 않을 것이며, 제 달에는 그를 찾게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바람을 들이마십니다’는 히브리어 관용구의 뜻을 옮긴 것입니다. 직역하면 ‘바람 냄새를 맡는다/킁킁거린다’는 뉘앙스가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘발정기’는 히브리어가 가리키는 성적 갈망의 상태를 풀어 옮긴 것입니다. 직역하면 ‘그의/그것의 열기’에 해당합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘제 달에’입니다. 여기서는 암나귀의 발정 주기, 곧 짝짓기 때를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּרֶה
  english_pob_choice: wild donkey
  chosen_korean: 들나귀
  alternatives_korean:
  - 야생 당나귀
  - 광야나귀
  lexicon: HALOT
  rationale: פֶּרֶה는 가축이 아닌 야생 나귀를 가리키므로, 현대 한국어에서 자연스럽고 이해하기 쉬운 ‘들나귀’로 옮겼습니다.
- source_word: לִמֻּד מִדְבָּר
  english_pob_choice: accustomed to the wilderness
  chosen_korean: 광야에 익숙한
  alternatives_korean:
  - 광야에 길든
  - 광야에 훈련된
  lexicon: HALOT
  rationale: ‘익숙한’이 지속적으로 광야 생활에 적응된 상태를 가장 자연스럽게 드러내며, ‘훈련된’보다 덜 기계적입니다.
- source_word: שָׁאֲפָה רוּחַ
  english_pob_choice: sniffs the wind
  chosen_korean: 바람을 들이마십니다
  alternatives_korean:
  - 바람 냄새를 맡습니다
  - 바람을 킁킁거립니다
  lexicon: HALOT
  rationale: 관용구가 초조하게 바람을 들이쉬며 냄새를 맡는 모습을 그리므로, 의미를 살리되 한국어에서 너무 구어적인 표현은 피했습니다.
- source_word: תַּאֲנָתָהּ
  english_pob_choice: in her heat
  chosen_korean: 발정기에는
  alternatives_korean:
  - 발정 상태에는
  - 교미철에는
  lexicon: HALOT
  rationale: 동물의 성적 흥분/교미 시기를 가리키는 말이어서, 현대 한국어에서 가장 직접적이고 분명한 ‘발정기’로 옮겼습니다.
- source_word: בְּחָדְשָׁהּ
  english_pob_choice: in her month
  chosen_korean: 제 달에는
  alternatives_korean:
  - 그 달에는
  - 발정철에는
  lexicon: HALOT
  rationale: 직역은 ‘그 달/제 달’이며, 본문이 암시하는 발정 주기를 지나치게 풀이하지 않고도 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 유다를 암나귀 이미지로 묘사하는 은유의 보존
  chosen_reading: 여성형 동물 은유를 한국어에서도 그대로 살려, 유다의 집요한 욕망과 추구됨의 이미지를 직접적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘짐승’이나 ‘나귀’ 일반으로 중화하는 읽기
  - 도덕적 의미만 남기고 동물적 성적 비유를 약화하는 읽기
  rationale: 이 절의 충격은 유다의 탐욕과 성적 은유를 함께 드러내는 데 있으므로, 본문의 정서적·신학적 강도를 약화하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §5 (source tension 보존)와 §6 (현대 한국어의 가독성)
