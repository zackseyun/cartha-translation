  yaml_path: translation/ot/jeremiah/002/032.yaml
  text: Does a virgin forget her jewelry[b][a], or a bride her ornaments? Yet my people have forgotten me for days without number.
  footnotes:
  - marker: a
    text: Or 'her adornment.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may refer more specifically to bridal bands, sashes, or tied ornaments.
    reason: lexical_alternative
translation:
  language: ko
  text: 처녀가 자기 장신구[a]를 잊겠습니까? 신부가 자기 장식[b]을 잊겠습니까? 그런데 내 백성은 셀 수 없이 많은 날 동안 나를 잊었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 장식’.
    reason: lexical_alternative
  - marker: b
    text: 이 히브리어는 더 구체적으로 신부용 띠, 장식끈, 또는 묶어 두는 장식을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוּלָה
  english_pob_choice: a virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 처녀 여자
  lexicon: HALOT
  rationale: 기본 의미를 가장 직접적으로 살리되, 현대 한국어에서 자연스럽고 문맥의 신부와의 대비도 분명하게 해 줍니다.
- source_word: עֶדְיָהּ
  english_pob_choice: her jewelry
  chosen_korean: 자기 장신구
  alternatives_korean:
  - 자기 장식
  - 자기 치장
  lexicon: HALOT
  rationale: 개인적 치장물이라는 핵심을 살리면서, '장신구'가 현대어에서 가장 무난하게 대응합니다.
- source_word: קִשֻּׁרֶיהָ
  english_pob_choice: her ornaments
  chosen_korean: 자기 장식
  alternatives_korean:
  - 자기 장신구
  - 신부 장식끈
  - 신부 띠
  lexicon: HALOT
  rationale: 구체 물건의 세부는 다소 불확실하므로, '장식'으로 넓게 옮겨 신부용 장식품이라는 의미 범위를 보존했습니다.
- source_word: יָמִים אֵין מִסְפָּר
  english_pob_choice: for days without number
  chosen_korean: 셀 수 없이 많은 날 동안
  alternatives_korean:
  - 날 수 없이
  - 끝없이 오랜 날 동안
  lexicon: HALOT
  rationale: 히브리어 관용구의 '셀 수 없음'을 자연스러운 현대 한국어로 풀어, 단순한 장구함이 아니라 헤아릴 수 없는 기간임을 드러냅니다.
theological_decisions:
- issue: 언약적 '잊음'의 보존
  chosen_reading: '''나를 잊었습니다''로 옮겨, 단순한 무관심보다 언약적 배신의 뉘앙스를 본문 자체의 비유로 유지했습니다.'
  alternative_readings:
  - '''나를 저버렸습니다'''
  - '''나를 버렸습니다'''
  rationale: 본문은 직접적으로 '잊음'을 말하므로, 더 강한 표현으로 바꾸면 저자의 비유적 고발을 약화시킬 수 있습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 방식과 긴장을 보존하고, 해석을 본문 밖에서 덧붙이지 않습니다.'
