- from: 도둑이 붙잡혔을 때 수치를 당하듯이, 이스라엘 집도 수치를 당했습니다—그들, 그들의 왕들, 그들의 지도자들, 그들의 제사장들, 그리고 그들의 예언자들입니다.[a][b]
  to: 도둑이 들켰을 때 부끄러워하듯이, 이스라엘 집도 수치를 당하였습니다. 바로 그들, 곧 그들의 왕들, 지도자들[b], 제사장들, 예언자들입니다.[a]
