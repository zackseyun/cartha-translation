source:
  edition: WLC
  text: כְּ/בֹ֤שֶׁת גַּנָּב֙ כִּ֣י יִמָּצֵ֔א כֵּ֥ן הֹבִ֖ישׁוּ בֵּ֣ית יִשְׂרָאֵ֑ל הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם וְ/כֹהֲנֵי/הֶ֖ם וּ/נְבִיאֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/026.yaml
  text: As a thief is ashamed when he is found[a], so the house of Israel has been put to shame—they, their kings, their officials, their priests[b], and their prophets.
  footnotes:
  - marker: a
    text: Or 'when he is discovered.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their princes' for 'their officials.'
    reason: lexical_alternative
translation:
  language: ko
  text: 도둑이 붙잡혔을 때 수치를 당하듯이, 이스라엘 집도 수치를 당했습니다—그들, 그들의 왕들, 그들의 지도자들, 그들의 제사장들, 그리고 그들의 예언자들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘발견되었을 때’입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 방백들’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבֹשֶׁת גַּנָּב
  english_pob_choice: As a thief is ashamed
  chosen_korean: 도둑이 붙잡혔을 때 수치를 당하듯이
  alternatives_korean:
  - 도둑이 부끄러워하듯이
  - 도둑이 발견되었을 때처럼 수치를 당하듯이
  lexicon: HALOT
  rationale: 비교 구문을 한국어답게 풀어, ‘수치’의 감정이 아니라 공개적 망신과 노출의 뉘앙스를 살렸습니다.
- source_word: כִּי יִמָּצֵא
  english_pob_choice: when he is found
  chosen_korean: 붙잡혔을 때
  alternatives_korean:
  - 발견되었을 때
  - 들켰을 때
  lexicon: HALOT
  rationale: 니팔 מצא의 ‘발각/노출’ 의미를 반영하되, 도둑의 상황에 맞는 자연스러운 한국어로 옮겼습니다.
- source_word: הֹבִישׁוּ
  english_pob_choice: has been put to shame
  chosen_korean: 수치를 당했습니다
  alternatives_korean:
  - 부끄러움을 당했습니다
  - 망신을 당했습니다
  lexicon: HALOT
  rationale: 히브리어의 결과 상태를 단순 내면 감정이 아니라 외적 수치의 상태로 드러내기 위해 ‘수치를 당하다’를 택했습니다.
- source_word: שָׂרֵיהֶם
  english_pob_choice: their officials
  chosen_korean: 그들의 지도자들
  alternatives_korean:
  - 그들의 관리들
  - 그들의 방백들
  lexicon: HALOT
  rationale: שָׂרִים는 ‘공직자/통치자’ 범주를 가리킬 수 있어, 현대 독자가 이해하기 쉬우면서도 계층적 책임을 드러내는 ‘지도자들’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 집과 열거된 지도층의 책임 범위
  chosen_reading: 본문은 이스라엘 집 전체를 수치의 주체로 말하면서, 왕들·지도자들·제사장들·예언자들을 대표적 책임층으로 함께 지목합니다.
  alternative_readings:
  - 책임이 지도층에만 집중된 것으로 읽을 수 있습니다.
  rationale: 문장 구조상 총칭 뒤에 강조 대명사와 직책 목록이 이어지므로, 공동체 전체의 수치와 지도층의 구체적 책임을 모두 보존했습니다.
  doctrine_reference: 언약 공동체의 집단적 책임과 지도자의 대표성
