  source_fidelity: 히브리어의 미완료형 יֶאְשָׁמוּ 및 תָּבֹא는 여기서 이스라엘을 삼키는 자들에게 닥칠 책임과 재앙을 예고합니다. 따라서 과거형 ‘유죄가 되었고/닥쳤습니다’보다 미래적 심판 선언으로 옮기는 것이 원문에 더 충실합니다. אֹכְלָיו는 분사형이므로 ‘그를 삼키는 모든 자’가 자연스럽고 비유의 폭력성도 보존합니다.
  naturalness: ‘거룩한 자’는 이스라엘을 한 개인으로 지칭하는 듯하고 한국어에서도 다소 부자연스럽습니다. 서술어 ‘야훼께 거룩하였으며’가 원문의 술어적 용법을 자연스럽게 반영합니다. 또한 합쇼체 기준상 ‘말씀이니라’는 문체가 맞지 않으므로 ‘선언하십니다’로 고쳤습니다.
  terminology: ‘야훼’, ‘첫 열매’, ‘유죄’, ‘재앙’은 원문의 신명, 제의적 비유, 법적 책임, 심판 의미를 적절히 전달합니다. ‘수확의 첫 열매’는 ‘추수의 첫 열매’보다 현대 한국어에서 더 자연스럽습니다.
