id: JER.2.3
reference: Jeremiah 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֹ֤דֶשׁ יִשְׂרָאֵל֙ לַ/יהוָ֔ה רֵאשִׁ֖ית תְּבוּאָתֹ֑/ה כָּל אֹכְלָ֣י/ו יֶאְשָׁ֔מוּ רָעָ֛ה תָּבֹ֥א אֲלֵי/הֶ֖ם נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/003.yaml
  text: Israel was holy to Yahweh[a], the firstfruits of his harvest; all who devoured him became guilty; disaster came upon them[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the firstfruits of his produce.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all who ate/devoured him'; the image is of nations consuming or plundering Israel.
    reason: cultural_note
  - marker: c
    text: Or 'incurred guilt' or 'were held guilty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 야훼께 거룩한 자였고, 그분의 추수의 첫 열매였습니다[a]. 그를 먹어 삼킨 모든 자는 유죄가 되었고[c][b], 재앙이 그들에게 닥쳤습니다. 야훼의 말씀이니라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 소산의 첫 열매’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그를 먹은/삼킨 모든 자’입니다. 여기서는 이스라엘을 삼켜 버리는 열국의 이미지를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘유죄가 되었다’ 혹은 ‘유죄 판정을 받았다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  english_pob_choice: holy
  chosen_korean: 거룩한 자
  alternatives_korean:
  - 거룩함
  - 성스러운 존재
  - 거룩한 것
  lexicon: HALOT
  rationale: 이스라엘을 추상명사보다 관계적·서술적으로 표현해야 하므로, ‘거룩한 자’로 옮겨 거룩하게 구별된 상태를 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 주님께
  - 야훼의
  lexicon: HALOT
  rationale: 출처 본문이 YHWH를 직접 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 유지하고 여격 조사로 소속·헌신의 관계를 드러냈습니다.
- source_word: רֵאשִׁית תְּבוּאָתוֹ
  english_pob_choice: the firstfruits of his harvest
  chosen_korean: 그분의 추수의 첫 열매
  alternatives_korean:
  - 그분의 소산의 첫 열매
  - 그분의 첫 열매
  - 그분의 수확 첫 부분
  lexicon: HALOT
  rationale: 첫 열매의 제의적 함의를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 ‘추수의 첫 열매’로 옮겼습니다.
- source_word: אֹכְלָיו
  english_pob_choice: who devoured him
  chosen_korean: 그를 먹어 삼킨 모든 자
  alternatives_korean:
  - 그를 삼킨 모든 자
  - 그를 먹은 모든 자
  - 그를 집어삼킨 모든 자
  lexicon: HALOT
  rationale: ‘먹다’의 비유적 폭력성을 유지하되 한국어에서 단순 섭식처럼 들리지 않도록 ‘먹어 삼키다’로 풀었습니다.
- source_word: יֶאְשָׁמוּ
  english_pob_choice: became guilty
  chosen_korean: 유죄가 되었고
  alternatives_korean:
  - 죄책을 지게 되었고
  - 죄를 짊어지게 되었고
  - 유죄 판정을 받았고
  lexicon: HALOT
  rationale: 문맥상 도덕적 선언보다 책임 부과의 결과를 나타내므로, 영어 POB의 ‘became guilty’를 법정적 뉘앙스가 드러나는 ‘유죄가 되다’로 옮겼습니다.
- source_word: רָעָה תָּבֹא אֲלֵיהֶם
  english_pob_choice: disaster came upon them
  chosen_korean: 재앙이 그들에게 닥쳤습니다
  alternatives_korean:
  - 재난이 그들에게 왔습니다
  - 화가 그들에게 임했습니다
  - 재앙이 그들에게 임했습니다
  lexicon: HALOT
  rationale: 예언 심판 문맥에서 רָעָה는 ‘악’보다 ‘재앙/재난’이 적절하므로, 현대 한국어에서 강하고 자연스러운 ‘닥쳤습니다’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식의 무게를 유지하면서 한국어 성경에서 널리 통용되는 종결 표현을 사용했습니다.
theological_decisions:
- issue: 이스라엘을 ‘첫 열매’로 비유하는 제의적 이미지
  chosen_reading: 이스라엘은 야훼께 거룩한 자이며 그분의 추수의 첫 열매라는 비유를 그대로 살렸습니다.
  alternative_readings:
  - 이스라엘은 야훼께 속한 첫 소산입니다
  - 이스라엘은 야훼께 바쳐진 첫 열매입니다
  rationale: 본문은 이스라엘의 특별한 헌신과 소유 관계를 제의적 이미지로 말하므로, 이를 약화하지 않고 그대로 드러내는 쪽이 원문의 힘에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 여호와/주님이 아니라 야훼로 표기
  chosen_reading: 본문의 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 있는 신명 자체를 직접 드러내어 언약적 명칭의 고유성을 보존하기 위한 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
