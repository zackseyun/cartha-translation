  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
  footnotes:
  - marker: a
    text: Or, 'I have not become unclean.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'I have not followed the Baals.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may depict a young she-camel crisscrossing or twisting along her tracks; the exact nuance of the verb is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 네가 말할 수 있겠습니까[a], “나는 더럽혀지지 않았다. 나는 바알들을 따라가지 않았다”라고? 골짜기에서 네 길을 보십시오. 네가 한 일을 아십시오. 너는 자기 길을 이리저리 꼬는 빠른 어린 암낙타와 같습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 부정하게 되지 않았다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 어린 암낙타가 자기 발자취를 이리저리 꼬거나 교차시키는 모습을 가리킬 수 있으며, 동사의 정확한 뉘앙스는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  english_pob_choice: I have not defiled myself
  chosen_korean: 나는 더럽혀지지 않았다
  alternatives_korean:
