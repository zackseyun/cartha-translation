  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
  footnotes:
  - marker: a
    text: Or, 'I have not become unclean.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'I have not followed the Baals.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term may depict a young she-camel crisscrossing or twisting along her tracks; the exact nuance of the verb is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 네가 말할 수 있겠느냐[a], 「나는 더럽혀지지 않았다. 나는 바알들을 따라가지 않았다」고? 골짜기에서 네 길을 보라. 네가 한 일을 알라— 빠른 어린 암낙타가 자기 길을 이리저리 꼬는 것처럼[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 부정하게 되지 않았다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 어린 암낙타가 자기 발자취를 이리저리 꼬거나 교차시키는 모습을 가리킬 수 있으며, 동사의 정확한 뉘앙스는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  english_pob_choice: I have not defiled myself
  chosen_korean: 나는 더럽혀지지 않았다
  alternatives_korean:
  - 나는 부정하게 되지 않았다
  - 나는 더럽혀지지 않았다
  lexicon: HALOT
  rationale: 히브리어 니팔은 ‘더럽혀지다/부정하게 되다’의 의미를 가지므로, 도덕·예배적 오염을 함께 드러내는 ‘더럽혀지지 않았다’가 적절합니다.
- source_word: אַחֲרֵי הַבְּעָלִים ... הָלַכְתִּי
  english_pob_choice: I have not gone after the Baals
  chosen_korean: 나는 바알들을 따라가지 않았다
  alternatives_korean:
  - 나는 바알들을 뒤따라가지 않았다
  - 나는 바알들을 따라가지 않았다
  lexicon: HALOT
  rationale: אַחֲרֵי + הלך의 관용적 표현을 자연스럽게 살리되, 복수형 ‘바알들’은 히브리어 복수형과 우상숭배의 다양한 형태를 반영합니다.
- source_word: בִּכְרָה קַלָּה מְשָׂרֶכֶת דְּרָכֶיהָ
  english_pob_choice: a swift young she-camel, twisting her ways
  chosen_korean: 빠른 어린 암낙타가 자기 길을 이리저리 꼬는 것처럼
  alternatives_korean:
  - 빠른 어린 암낙타가 자기 길을 이리저리 가는 것처럼
  - 빠른 어린 암낙타가 자기 길을 엇갈리게 가는 것처럼
  lexicon: HALOT
  rationale: בִּכְרָה는 어린 암낙타이며, מְשָׂרֶכֶת은 희귀하고 난해한 어근이어서 ‘이리저리 꼬는’으로 동작의 뒤틀림을 보존했습니다.
- source_word: גַּיְא
  english_pob_choice: in the valley
  chosen_korean: 골짜기에서
  alternatives_korean:
  - 골짜기 안에서
  - 골짜기에서
  lexicon: HALOT
  rationale: גַּיְא의 기본 의미를 따라 ‘골짜기’로 옮기되, 직역의 자연스러운 한국어 조사 결합을 택했습니다.
theological_decisions:
- issue: 바알ים 복수형과 우상숭배 고발의 강도
  chosen_reading: ‘바알들’로 복수형을 유지해, 특정한 한 이름이 아니라 반복적·다중적 우상숭배를 지적하는 원문 효과를 보존했습니다.
  alternative_readings:
  - 바알
  - 주들
  rationale: 히브리어 복수형을 평준화하면 예언자의 고발이 희석될 수 있으므로, 원문 형식을 살리는 것이 문맥상 더 충실합니다.
  doctrine_reference: 우상숭배에 대한 예언서의 언약 고발
