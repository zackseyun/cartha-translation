  source_fidelity: 히브리어의 수사 의문(לָמָּה), ריב의 폭넓은 다툼·논쟁의 의미, 강조된 집합적 호칭(כֻּלְּכֶם), 그리고 פּשע의 언약적 반역의 뜻을 충실히 옮겼습니다. ‘나와 다투느냐’는 אֵלַי와 함께 쓰인 ריב을 자연스럽게 반영하며, ‘나를 거슬러 반역하였습니다’도 בִּי의 대적 대상을 분명히 드러냅니다.
  naturalness: 문장은 현대 표준어 합쇼체로 자연스럽고, 예언적 책망의 어조도 적절합니다. ‘어찌하여’와 ‘야훼의 말씀입니다’는 지나치게 고풍스럽지 않으면서도 본문의 공적 선언 문체에 알맞습니다.
  terminology: ‘야훼’는 제시된 프로젝트 방침 및 영어 POB의 신명 표기와 일치합니다. ‘반역하였습니다’는 פּשע의 강한 충성 위반·반역의 뉘앙스를 잘 보존합니다. 각주들은 본문의 의미 범위와 적절히 연결되어 있습니다.
