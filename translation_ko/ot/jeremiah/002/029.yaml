id: JER.2.29
reference: Jeremiah 2:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֥/מָּה תָרִ֖יבוּ אֵלָ֑/י כֻּלְּ/כֶ֛ם פְּשַׁעְתֶּ֥ם בִּ֖/י נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/029.yaml
  text: Why do you contend with me? All of you have rebelled against me[b][a], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'Why do you dispute with me?' The Hebrew verb can carry the sense of contending, disputing, or bringing a case.
    reason: lexical_alternative
  - marker: b
    text: Or 'have transgressed against me.' The Hebrew verb often has the stronger sense of rebellion or revolt.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 너희는 나와 다투느냐? 너희 모두가 나를 거슬러 반역하였습니다[a][b]—야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나와 논쟁하느냐?’ ריב은 다투다, 논쟁하다, 소송을 제기하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 거슬러 범죄하였습니다.’ פּשע는 때로 단순한 범죄보다 더 강한 반역의 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 수사 의문을 자연스러운 표준어로 살리면서, 선지자적 책망의 어조를 조금 더 강하게 드러냅니다.
- source_word: תָרִיבוּ אֵלַי
  english_pob_choice: do you contend with me
  chosen_korean: 나와 다투느냐
  alternatives_korean:
  - 나와 논쟁하느냐
  - 나와 변론하느냐
  - 나와 시비하느냐
  lexicon: HALOT
  rationale: ריב은 다툼, 논쟁, 소송적 다툼을 아울러 가리킬 수 있으므로, 한국어에서는 너무 법정적이거나 지나치게 약한 표현을 피하고 ‘다투다’로 넓은 의미를 담았습니다.
- source_word: פְּשַׁעְתֶּם בִּי
  english_pob_choice: have rebelled against me
  chosen_korean: 나를 거슬러 반역하였습니다
  alternatives_korean:
  - 나에게 반역하였습니다
  - 나를 거슬러 범죄하였습니다
  - 나를 거슬러 패역하였습니다
  lexicon: HALOT
  rationale: פּשע는 단순한 잘못보다 언약적 배신과 반역의 뉘앙스가 강하므로, ‘반역하다’로 그 강도를 살렸습니다. ‘거슬러’는 대상이 하나님임을 자연스럽게 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  - 야훼께서 말씀하신다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם은 단순한 보고형 ‘말씀입니다’로도 공적 선포의 무게를 유지할 수 있으며, 본 프로젝트의 기본 규범에 따라 יהוה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제
  chosen_reading: 본문의 여호와 자리에 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 יְהוָה를 직접 사용하므로, 이름 자체를 드러내는 표기를 채택해 언약적 책망의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
