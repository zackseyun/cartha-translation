  to: 나는 헛되이 너희 아들들을 쳤습니다[a]. 그들은 징계를 받아들이지 않았습니다[b]. 너희의 칼이 멸망시키는 사자처럼 너희의 예언자들을 삼켰습니다[c].
  rationale: 수용을 나타내는 לָקַח의 능동적 의미를 ‘받아들이지 않았습니다’로 명시했습니다. 원문의 세 절 구조와 ‘너희의 칼’이라는 소유 표현, 칼이 삼킨다는 비유를 보존했으며, 각주 표지를 관련 어구에 배치했습니다.
