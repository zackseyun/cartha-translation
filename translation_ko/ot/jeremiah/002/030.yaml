reference: Jeremiah 2:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/שָּׁוְא֙ הִכֵּ֣יתִי אֶת בְּנֵי/כֶ֔ם מוּסָ֖ר לֹ֣א לָקָ֑חוּ אָכְלָ֧ה חַרְבְּ/כֶ֛ם נְבִֽיאֵי/כֶ֖ם כְּ/אַרְיֵ֥ה מַשְׁחִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/030.yaml
  text: In vain I struck your sons[a]; they accepted no correction[c][b]. Your sword devoured your prophets like a destroying lion.
  footnotes:
  - marker: a
    text: Or 'your children' for 'your sons'; the Hebrew is literally masculine plural 'your sons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'discipline' or 'instruction' for 'correction'; Hebrew musar can include both corrective discipline and moral instruction.
    reason: lexical_alternative
  - marker: c
    text: Or 'like a ravening lion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헛되이 내가 너희 아들들을 쳤으나 그들은 징계를 받지 않았습니다. 너희의 칼이 너희의 예언자들을 삼켰습니다 — 마치 멸망시키는 사자처럼.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 자녀들’. 히브리어는 문자적으로 ‘너희 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘교훈’, ‘훈계’. 히브리어 מוּסָר는 교정, 징계, 가르침의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘포악하게 덮치는 사자처럼’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשָּׁוְא
  english_pob_choice: In vain
  chosen_korean: 헛되이
  alternatives_korean:
  - 허사로
  - 헛된 일로
  lexicon: HALOT
  rationale: לַשָּׁוְא는 결과 없는 행위를 나타내므로, 현대 한국어에서 자연스럽고 간결한 ‘헛되이’가 원문의 무익함을 잘 살립니다.
- source_word: הִכֵּיתִי
  english_pob_choice: I struck
  chosen_korean: 내가 … 쳤으나
  alternatives_korean:
  - 내가 … 때렸으나
  - 내가 … 치셨으나
  lexicon: HALOT
  rationale: נכה의 히필은 ‘치다/때리다’의 직접적 행위를 가리키며, 예언적 문맥의 심판적 타격을 드러내기 위해 ‘쳤으나’로 옮겼습니다.
- source_word: מוּסָר
  english_pob_choice: correction
  chosen_korean: 징계
  alternatives_korean:
  - 교정
  - 훈계
  - 교훈
  lexicon: HALOT
  rationale: 문맥상 야훼의 타격에 대한 응답으로 주어진 교정적 처벌의 의미가 강하므로, 한국어로는 ‘징계’가 ‘correction’의 징벌-교정적 뉘앙스를 가장 잘 전달합니다.
- source_word: אָכְלָה חַרְבְּכֶם
  english_pob_choice: Your sword devoured
  chosen_korean: 너희의 칼이 … 삼켰습니다
  alternatives_korean:
  - 너희의 칼이 … 먹어 버렸습니다
  - 너희의 칼이 … 집어삼켰습니다
  lexicon: HALOT
  rationale: אָכַל이 칼의 비유적 ‘삼키다/먹어치우다’는 이미지를 갖기 때문에, 과장된 폭력성을 살리면서도 자연스러운 ‘삼켰습니다’로 옮겼습니다.
- source_word: כְּאַרְיֵה מַשְׁחִית
  english_pob_choice: like a destroying lion
  chosen_korean: 마치 멸망시키는 사자처럼
  alternatives_korean:
  - 마치 파괴하는 사자처럼
  - 마치 사납게 삼키는 사자처럼
  lexicon: HALOT
  rationale: מַשְׁחִית의 분사적 성격을 살려 ‘멸망시키는’으로 옮기면, 사자의 파괴적 성격을 원문에 가깝게 보존할 수 있습니다.
theological_decisions:
- issue: ‘너희 아들들’의 범위
  chosen_reading: 문자적으로는 ‘너희 아들들’로 두고, 공동체 전체를 대표하는 언약 백성의 자녀들에 대한 심판으로 읽습니다.
  alternative_readings:
  - ‘너희 자녀들’로 일반화
  - ‘너희 사람들’로 확장
  rationale: 히브리어는 남성 복수형 ‘아들들’을 사용하므로, 본문 어휘를 보존하는 쪽이 원문 대비에 유리합니다. 다만 예언서 문맥에서는 집단 대표 표현일 수 있습니다.
  doctrine_reference: 예언서의 집단 대표성 및 언약 심판의 언어
