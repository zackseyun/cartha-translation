id: JER.2.5
reference: Jeremiah 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מַה מָּצְא֨וּ אֲבוֹתֵי/כֶ֥ם בִּ/י֙ עָ֔וֶל כִּ֥י רָחֲק֖וּ מֵ/עָלָ֑/י וַ/יֵּֽלְכ֛וּ אַחֲרֵ֥י הַ/הֶ֖בֶל וַ/יֶּהְבָּֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/005.yaml
  text: 'Thus says Yahweh: What wrong did your fathers find in me[a], that they went far from me, and went after vanity[b], and became vain?'
  footnotes:
  - marker: a
    text: Hebrew 'vanity' and 'became vain' use the same root, highlighting that by going after what is empty, they themselves became empty or worthless.
    reason: lexical_alternative
  - marker: b
    text: Or 'What injustice did your fathers find in me...?'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “너희 조상들이 내게서 무슨 잘못[b]을 발견했기에, 나에게서 멀어져 허무를 따라가고 허무하게 되었느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘허무’를 추격한 결과 자신들까지 ‘허무’하게 되었다는 같은 어근의 말놀이를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잘못’은 여기서 ‘불의’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 이렇게 말씀하셨습니다
  lexicon: BHS/WLC
  rationale: 예언자적 선포 공식을 현재형 선언으로 살리고, दिव름 이름 יְהוָה는 POB의 개정된 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: מַה מָּצְאוּ ... בִּי עָוֶל
  english_pob_choice: What wrong did your fathers find in me
  chosen_korean: 너희 조상들이 내게서 무슨 잘못을 발견했기에
  alternatives_korean:
  - 너희 조상들이 내게서 무슨 불의를 발견했기에
  - 너희 조상들이 내게서 무엇이 잘못되었다고 보았기에
  lexicon: HALOT
  rationale: עָוֶל은 ‘불의’도 가능하지만, 이 수사적 고발 문맥에서는 현대 한국어로 ‘잘못’이 자연스럽고 직접적입니다.
- source_word: רָחֲקוּ מֵעָלַי
  english_pob_choice: that they went far from me
  chosen_korean: 나에게서 멀어져
  alternatives_korean:
  - 나를 떠나 멀리 가서
  - 내게서 멀어져
  lexicon: HALOT
  rationale: 히브리어의 거리감 은유를 살려 관계적 소원화를 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: הַהֶבֶל / וַיֶּהְבָּלוּ
  english_pob_choice: went after vanity, and became vain
  chosen_korean: 허무를 따라가며 스스로 허무하게 되었느냐
  alternatives_korean:
  - 헛된 것을 따라가며 헛되게 되었느냐
  - 허무를 좇아 허무해졌느냐
  lexicon: HALOT
  rationale: הֶבֶל과 같은 어근의 동사 놀이를 살리기 위해 ‘허무’와 ‘허무하게 되다’를 대응시켜, 비어 있음/무가치함의 반복을 한국어에서도 감지되게 했습니다.
theological_decisions:
- issue: 예언자 발화의 직접화법과 수사적 질문의 어조
  chosen_reading: 직접 인용부 안에서 하나님이 책망하시는 질문을 유지하고, 한국어는 합쇼체로 두되 고발의 날카로움은 약화하지 않았습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 더 설교체적인 평서문으로 재구성
  rationale: 본문은 회개의 촉구가 아니라 언약적 고발이므로, 질문의 형태와 대상을 그대로 드러내는 것이 의미 보존에 중요합니다.
  doctrine_reference: 예언서의 언약 고발 문맥
