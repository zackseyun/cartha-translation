    text: Or 'I will contend against you ... and against your children's children.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 여전히 너희와 다투며 — 야훼의 말씀이니라 — 너희 자손의 자손과도 내가 다투겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희에게 대하여 다투며 … 너희 자손의 자손에게 대하여’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 따라서
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언에 이어지는 논리적 결론을 나타내는 말로, 형식적이면서도 자연스러운 한국어 연결어인 ‘그러므로’가 적절합니다.
- source_word: עֹד אָרִיב
  english_pob_choice: I will still contend
  chosen_korean: 여전히 … 다투며
  alternatives_korean:
  - 계속 … 다투며
  - 다시 … 다투며
  lexicon: HALOT
  rationale: עוֹד는 단순한 반복보다 지속성을 나타내므로, 현재 진행형의 감각을 살려 ‘여전히’로 옮기고 ריב의 법정적 대립은 ‘다투다’로 표현했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언서의 정형구를 한국어 문어체로 옮기되, 본 프로젝트의 기본 원칙에 따라 하나님의 이름 יְהוָה는 ‘야훼’로 유지했습니다.
- source_word: בְּנֵי בְנֵיכֶם
  english_pob_choice: your children's children
  chosen_korean: 너희 자손의 자손
  alternatives_korean:
  - 너희 손자손녀
  - 너희 자녀의 자녀
  lexicon: HALOT
  rationale: 히브리어의 중첩 친족 표현을 문자적으로 살려, 더 자연스럽지만 덜 엄중한 ‘손자손녀’보다 ‘자손의 자손’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: ‘야훼’로 유지합니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 직접 신명사 표기를 사용하므로, 프로젝트 기본값에 따라 언약적 고유명을 가리는 대신 ‘야훼’로 드러내는 것이 원문 효과를 보존합니다.
  doctrine_reference: POB naming convention for YHWH / DOCTRINE.md
