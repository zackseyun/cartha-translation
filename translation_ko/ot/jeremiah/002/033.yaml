  text: מַה תֵּיטִ֥בִי דַּרְכֵּ֖/ךְ לְ/בַקֵּ֣שׁ אַהֲבָ֑ה לָ/כֵן֙ גַּ֣ם אֶת הָ/רָע֔וֹת למדתי אֶת דְּרָכָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/033.yaml
  text: How well you make your way to seek love! Therefore even evil women you have taught your ways.
  footnotes:
  - marker: a
    text: Or 'even evil things you have taught your ways,' taking the feminine plural more abstractly rather than as 'evil women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 그리 네 길을 사랑을 구하려고 잘 다듬느냐! 그러므로 네가 악한 여자들까지도 네 길들을 가르쳤다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 복수형은 문맥상 '악한 여자들'로 읽을 수 있지만, '악한 것들'로 보는 해석도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּיטִבִי
  english_pob_choice: How well you make your way
  chosen_korean: 어찌 그리 네 길을 잘 다듬느냐
  alternatives_korean:
  - 어찌 그리 네 길을 잘 만들느냐
  - 어찌 그리 네 길을 잘 꾸미느냐
  lexicon: HALOT
  rationale: 감탄형의 역설적 어조를 살리면서, תֵּיטִבִי의 '좋게 하다/다듬다' 뉘앙스를 한국어 동사구로 옮겼습니다. '잘 다듬다'는 길을 정비해 목적에 맞게 만드는 느낌을 보존합니다.
- source_word: דַּרְכֵּךְ
  english_pob_choice: your way
  chosen_korean: 네 길
  alternatives_korean:
  - 네 길잡이
  - 네 행실
  lexicon: HALOT
  rationale: 예언서에서 '길'은 삶의 방식과 행로를 함께 가리키므로, 은유를 유지하는 '네 길'이 가장 직접적입니다.
- source_word: לְבַקֵּשׁ אַהֲבָה
  english_pob_choice: to seek love
  chosen_korean: 사랑을 구하려고
  alternatives_korean:
  - 사랑을 찾으려고
  - 연인을 구하려고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '사랑'을 찾는 표현이므로, 영어 POB처럼 명시적 '연인들'로 풀지 않고 동사구로 자연스럽게 옮겼습니다.
- source_word: הָרָעוֹת
  english_pob_choice: evil women
  chosen_korean: 악한 여자들
  alternatives_korean:
  - 사악한 여자들
  - 악한 것들
  lexicon: HALOT
  rationale: 문맥의 성적 은유와 여성 복수형을 따라 인격적 대상인 '여자들'로 읽었습니다. 다만 히브리어상 추상적 해석 가능성은 남아 있어 여지를 보존했습니다.
theological_decisions:
- issue: הָרָעוֹת의 해석
  chosen_reading: '''악한 여자들''로 본 인격적·성적 은유 해석'
  alternative_readings:
  - '''악한 것들'' 또는 ''악함들''로 보는 추상적 해석'
  rationale: 앞뒤 문맥이 유다의 음란한 추구를 비판하는 비유이므로, 여성 복수형을 실제 인물로 읽는 것이 수사적 힘과 문맥 적합성을 가장 잘 보존합니다.
  doctrine_reference: 예레미야 2장의 언약 파기와 영적 간음 비유
