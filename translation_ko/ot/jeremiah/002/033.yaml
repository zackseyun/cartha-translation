  source_fidelity: 첫 절의 מַה תֵּיטִבִי는 역설적인 감탄/수사 의문으로, ‘어찌 그리 … 잘 다듬습니까’가 이를 충실히 반영합니다. לְבַקֵּשׁ אַהֲבָה도 ‘사랑을 구하려고’로 유지했습니다. 후반절은 הָרָעוֹת를 사람으로 읽을 때 한국어에서 수혜격을 밝혀 ‘악한 여자들에게’라고 해야 ‘그들에게 네 길들을 가르쳤다’는 원문의 관계가 분명해집니다. הָרָעוֹת의 추상적 대안은 각주로 보존했습니다.
