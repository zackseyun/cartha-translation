  source_fidelity: 현 초안의 첫 두 절은 원문의 금지·억제 명령을 반대로 옮겼습니다. מִנְעִי는 발이 맨발이 되는 것과 목이 갈증에 이르는 것을 막으라는 뜻인데, ‘벗어나지 않게’는 그 상태에서 벗어나지 못하게 한다는 반대 뜻이 됩니다. 나머지 핵심 어휘와 זָרִים의 중의성 보존은 대체로 적절합니다.
  naturalness: ‘네 발이 벌거벗음에서 벗어나지 않게’와 ‘네 목이 목마름에서 벗어나지 않게’는 현대 한국어로 부자연스럽고 의미도 불명확합니다. ‘발이 맨발이 되지 않게’, ‘목이 목마르지 않게’가 자연스럽습니다. ‘네가 말하기를 … 하였습니다’도 현대 합쇼체 문장으로 매끄럽지 않아 직접 인용을 이끄는 서술로 고쳤습니다.
  terminology: יָחֵף는 사람의 발이 신발을 신지 않은 상태이므로 ‘벌거벗음’보다 ‘맨발’이 정확합니다. גָּרוֹן은 갈증과 짝을 이루므로 ‘목’으로 충분합니다. זָרִים는 ‘낯선 자들’로 유지하고, 각주에서 ‘외국인들’ 및 문맥상의 은유적 가능성을 밝혀 특정 지시 대상으로 좁히지 않았습니다.
