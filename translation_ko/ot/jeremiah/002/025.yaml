  - 외국의 연인들
  - 외국 민족/동맹들
  rationale: 예레미야 2장의 혼인·우상숭배 이미지가 겹쳐 있으므로, 번역에서 특정 해석으로 조기 확정하지 않고 원문의 중의성을 유지하는 편이 본문 효과를 더 잘 전달합니다.
