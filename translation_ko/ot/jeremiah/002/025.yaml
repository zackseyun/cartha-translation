  lexicon: HALOT
  rationale: מנע의 금지/억제 의미를 한국어로 자연스럽게 풀어, ‘벌거벗음’(μ/יָּחֵף의 상태)을 발이 그 상태에 이르지 않도록 막는 표현으로 옮겼습니다.
- source_word: וְגֹרֹנֵךְ מִצִּמְאָה
  english_pob_choice: and your throat from thirst
  chosen_korean: 네 목이 목마름에서 벗어나지 않게 하라
  alternatives_korean:
  - 네 목이 목마르지 않게 하라
  - 네 목구멍이 갈증에서 벗어나지 않게 하라
  lexicon: HALOT
  rationale: גרון을 문맥상 ‘목’으로, צִמְאָה를 ‘목마름’으로 옮겨 육체적 갈증 이미지와 뒤의 추구/소모의 비유를 살렸습니다.
- source_word: נוֹאָשׁ לֹא כִּי
  english_pob_choice: It is hopeless! No,
  chosen_korean: “소망이 없다! 아니,
  alternatives_korean:
  - “절망이다! 아니,
  - “이제 끝이다! 아니,
  lexicon: HALOT
  rationale: נוֹאָשׁ의 체념·절망을 ‘소망이 없다’로, לֹא의 강한 부정을 ‘아니’로 옮겨 예언적 항변의 어조를 살렸습니다.
- source_word: אָהַבְתִּי זָרִים
  english_pob_choice: I have loved strangers
  chosen_korean: 나는 낯선 자들을 사랑하였고
  alternatives_korean:
  - 나는 외국인들을 사랑하였고
  - 나는 이방 자들을 사랑하였고
  lexicon: HALOT
  rationale: זָרִים를 너무 일찍 ‘외국의 신들’로 좁히지 않고, POB의 해석적 유보를 따라 ‘낯선 자들’로 유지해 예언서의 다층적 비유를 보존했습니다.
- source_word: וְאַחֲרֵיהֶם אֵלֵךְ
  english_pob_choice: and after them I will go
  chosen_korean: 그들을 따라가겠습니다
  alternatives_korean:
  - 그들 뒤를 따르겠습니다
  - 그들을 뒤따르겠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘뒤따르다’ 관용을 한국어로 자연스럽게 압축해, 결의적 미래형을 살리면서도 문장 흐름을 매끄럽게 했습니다.
theological_decisions:
- issue: זָרִים의 지시 대상
  chosen_reading: 본문에서는 ‘낯선 자들’로 두어 외국 신들, 외국 동맹, 혹은 외래의 연인에 대한 은유를 모두 열어 둡니다.
  alternative_readings:
  - 외국의 신들
  - 외국의 연인들
  - 외국 민족/동맹들
  rationale: 예레미야 2장의 혼인·우상숭배 이미지가 겹쳐 있으므로, 번역에서 특정 해석으로 조기 확정하지 않고 원문의 중의성을 유지하는 편이 본문 효과를 더 잘 전달합니다.
  doctrine_reference: 예언적 비유의 중의성 보존
