  text: 네 발이 맨발이 되지 않게 하고 네 목이 목마르지 않게 하십시오. 그러나 너는 말했습니다. “가망없습니다! 아닙니다. 나는 낯선 자들[a]을 사랑하였으니, 그들을 따라가겠습니다.”
