  yaml_path: translation/ot/jeremiah/002/025.yaml
  text: Keep your feet from going unshod and your throat from thirst. But you said[a], “It is hopeless! No, for I have loved strangers, and after them I will go.”
  footnotes:
  - marker: a
    text: Or “foreigners.” In context this may refer metaphorically to foreign gods, foreign lovers, or foreign nations/allies.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 발이 벌거벗음에서 벗어나지 않게 하고 네 목이 목마름에서 벗어나지 않게 하라. 그러나 네가 말하기를 “소망이 없다! 아니, 나는 낯선 자들을 사랑하였고 그들을 따라가겠습니다.” 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “외국인들.” 문맥상 이는 외국의 신들, 외국의 연인들, 혹은 외국의 민족/동맹을 은유적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְעִי רַגְלֵךְ מִיָּחֵף
  english_pob_choice: Keep your feet from going unshod
  chosen_korean: 네 발이 벌거벗음에서 벗어나지 않게 하고
  alternatives_korean:
