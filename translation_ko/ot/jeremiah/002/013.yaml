    issue: 각주 표지가 절 끝에 있어 ‘생수의 근원’에 관한 어휘 대안이라는 범위가 불분명합니다.
    rationale: 표지를 해당 표현 바로 뒤에 두고, 원문의 ‘living waters’에 대한 어휘적 대안만 제시하는 것이 적절합니다.
