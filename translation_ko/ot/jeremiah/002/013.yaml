revisions:
- from: 내 백성이 두 가지 악을 저질렀습니다. 곧 그들은 나를 버렸습니다. 나는 살아 있는 물의 샘인데도, 자기들을 위해 웅덩이들을 팠습니다 — 물을 담을 수 없는 깨진 웅덩이들입니다.[a]
