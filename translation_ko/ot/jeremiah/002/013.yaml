  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי שְׁתַּ֥יִם רָע֖וֹת עָשָׂ֣ה עַמִּ֑/י אֹתִ֨/י עָזְב֜וּ מְק֣וֹר מַ֣יִם חַיִּ֗ים לַ/חְצֹ֤ב לָ/הֶם֙ בֹּאר֔וֹת בֹּארֹת֙ נִשְׁבָּרִ֔ים אֲשֶׁ֥ר לֹא יָכִ֖לוּ הַ/מָּֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/013.yaml
  text: 'For my people have done two evils: they have forsaken me[a], the fountain of living waters, to dig for themselves cisterns—broken cisterns that cannot hold water.'
  footnotes:
  - marker: a
    text: Or 'spring of living water' or 'source of living waters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 백성이 두 가지 악을 저질렀기 때문입니다. 곧 그들은 생수의 근원인 나를 버리고,[a] 자기들을 위하여 저수조들을 파냈습니다—물을 담아 둘 수 없는 깨진 저수조들을 파냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흐르는 물의 샘’ 또는 ‘살아 있는 물의 근원’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתַּיִם רָעוֹת
  english_pob_choice: two evils
  chosen_korean: 두 가지 악
  alternatives_korean:
  - 두 악
  - 두 가지 잘못
  - 두 가지 악행
  lexicon: HALOT
  rationale: 숫자와 복수 명사구의 구조를 살리면서, 예언서 문맥의 도덕적 무게를 유지하는 표현으로 옮겼습니다.
- source_word: אֹתִי עָזְבוּ
  english_pob_choice: they have forsaken me
  chosen_korean: 나를 버렸습니다
  alternatives_korean:
  - 나를 떠났습니다
  - 나를 저버렸습니다
  - 나를 버려 두었습니다
  lexicon: HALOT
  rationale: ‘עזב’의 언약적·관계적 단절을 살리되, 현대 한국어에서 자연스럽고 분명한 표현으로 옮겼습니다.
- source_word: מְקוֹר מַיִם חַיִּים
  english_pob_choice: the fountain of living waters
  chosen_korean: 나는 살아 있는 물의 샘인데도
  alternatives_korean:
  - 나는 생수의 샘인데도
  - 나는 살아 있는 물의 근원인데도
  - 나는 생명의 샘인데도
  lexicon: HALOT
  rationale: ‘מְקוֹר’의 샘/근원 이미지를 살리면서, ‘מַיִם חַיִּים’의 생명력 있는 물을 직역에 가깝게 반영했습니다.
- source_word: לַחְצֹב ... בֹּארוֹת
  english_pob_choice: to dig for themselves cisterns
  chosen_korean: 자기들을 위해 웅덩이들을 팠습니다
  alternatives_korean:
  - 자기들을 위해 물저장고들을 팠습니다
  - 자기들을 위해 저수 웅덩이들을 팠습니다
  - 자기들을 위해 우물을 팠습니다
  lexicon: HALOT
  rationale: ‘בֹּארוֹת’는 인공적으로 판 물 저장 구덩이를 가리키므로, 문맥상 ‘웅덩이’가 한국어로 가장 직관적입니다. ‘우물’은 자연수원과의 대조를 흐릴 수 있습니다.
- source_word: בֹּארֹת נִשְׁבָּרִים
  english_pob_choice: broken cisterns
  chosen_korean: 깨진 웅덩이들
  alternatives_korean:
  - 금 간 웅덩이들
  - 부서진 웅덩이들
  - 갈라진 웅덩이들
  lexicon: HALOT
  rationale: ‘נִשְׁבָּרִים’의 손상·파손 상태를 자연스러운 한국어로 옮기되, 물을 담지 못하는 기능적 실패를 드러내도록 했습니다.
theological_decisions:
- issue: 하나님을 ‘생수의 샘’으로 부르는 은유를 어떻게 보존할 것인가
  chosen_reading: 은유를 풀어 설명하지 않고, ‘나는 살아 있는 물의 샘’으로 유지했습니다.
  alternative_readings:
  - 나는 생명의 원천입니다
  - 나는 생수를 주는 근원입니다
  - 나는 생수의 샘입니다
  rationale: 히브리어는 하나님을 생명 주는 물의 이미지로 제시할 뿐 해설하지 않으므로, 예언적 수사와 신학적 긴장을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
