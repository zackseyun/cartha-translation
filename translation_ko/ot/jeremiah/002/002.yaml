revisions:
- from: 가서 예루살렘의 귀에 대고 외치십시오. “야훼께서 이같이 말씀하십니다. 내가 너의 젊은 시절의 신실한 사랑, 네 약혼의 사랑을 기억한다. 곧 네가 광야에서, 뿌려지지 않은 땅에서 나를 따라갔던 때다.”[a][b]
  to: 가서 예루살렘이 듣도록 선포하십시오. “야훼께서 이같이 말씀하십니다. 나는 네 젊은 시절의 신실한 사랑[a], 네 약혼 시절의 사랑[b], 곧 네가 광야, 씨 뿌리지 않은 땅에서 나를 따라왔던 일을 기억한다.”
  rationale: 문체를 현대 표준 한국어 합쇼체로 유지하면서, 히브리어의 청취 관용구와 기억의 병렬 대상을 자연스럽게 재구성했습니다. ‘약혼 시절’은 כְּלוּלֹת의 혼인 관련 은유를 보존하되 그 정확한 결혼 단계를 단정하지 않도록 각주에 대안을 남겼습니다. 각주 표지는 해당 어구 직후에 배치하고, 각주 a의 대안 번역 설명 오류를 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:49Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 혼인 은유, 광야의 이미지는 대체로 보존되었습니다. 다만 ‘예루살렘의 귀에 대고’는 히브리어 관용구를 지나치게 직역하여 한국어로 부자연스럽고, 원문의 공적 전달 의미를 자연스럽게 드러내도록 다듬는 것이 좋습니다. 또한 원문의 병렬된 기억의 대상과 ‘나를 따라간’ 행위를 한 문장 안에서 분명히 연결할 필요가 있습니다.
  naturalness: 합쇼체는 유지되어 있으나 ‘네 약혼의 사랑’과 ‘곧 … 때다’는 현대 표준 한국어에서 다소 어색합니다. ‘약혼 시절의 사랑’ 및 ‘곧 … 일을 기억한다’로 고치면 자연스럽고 원문의 수식·병렬 관계도 더 명료해집니다.
  terminology: ‘야훼’, ‘신실한 사랑’, ‘광야’는 프로젝트의 선택 및 본문의 어휘 범위에 부합합니다. 각주 a는 현재 본문에 채택된 표현을 대안 번역처럼 설명하고 있으므로, 실제 대안 표현을 제시하도록 바로잡아야 합니다. 각주 b의 조사 결합도 수정이 필요합니다.
  issues:
  - severity: medium
    issue: ‘예루살렘의 귀에 대고’가 한국어 관용상 부자연스럽습니다.
    rationale: בְּאָזְנֵי יְרוּשָׁלִַם은 ‘예루살렘이 듣는 곳/듣도록’이라는 청취·공적 선포의 관용적 표현입니다. ‘예루살렘이 듣도록’은 도시를 유지하면서도 자연스럽게 이를 전달합니다.
  - severity: medium
    issue: 마지막 절의 ‘곧 … 때다’가 앞선 ‘기억한다’와 문법적으로 느슨하게 연결됩니다.
    rationale: לֶכְתֵּךְ אַחֲרַי는 앞의 기억 대상들과 병렬되는 ‘네가 나를 따라간 일’을 나타냅니다. 이를 ‘곧 … 일을 기억한다’로 연결하면 원문의 관계가 분명해집니다.
  - severity: low
    issue: 각주 a가 본문 채택어인 ‘신실한 사랑’을 대안 번역으로 잘못 설명합니다.
    rationale: 각주는 ‘신실한 사랑’의 대안으로 ‘변함없는 사랑’ 또는 ‘한결같은 사랑’을 제시해야 합니다.
  - severity: low
