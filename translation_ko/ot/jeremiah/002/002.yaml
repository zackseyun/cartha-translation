  edition: WLC
  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ בְ/אָזְנֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה זָכַ֤רְתִּי לָ/ךְ֙ חֶ֣סֶד נְעוּרַ֔יִ/ךְ אַהֲבַ֖ת כְּלוּלֹתָ֑יִ/ךְ לֶכְתֵּ֤/ךְ אַחֲרַ/י֙ בַּ/מִּדְבָּ֔ר בְּ/אֶ֖רֶץ לֹ֥א זְרוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/002.yaml
  text: 'Go and proclaim in the hearing of Jerusalem[a], saying, ‘Thus says Yahweh: I remember for you the faithful love of your youth, the love of your betrothal, when you went after me in the wilderness[b], in a land not sown.’'
  footnotes:
  - marker: a
    text: Or 'steadfast love' for 'faithful love' (חֶסֶד), emphasizing covenant loyalty.
    reason: lexical_alternative
  - marker: b
    text: Or 'the love of your bridal days' for 'the love of your betrothal.' The Hebrew likely refers to Israel's early bride-like devotion to the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 가서 예루살렘이 듣도록 선포하십시오. “야훼께서 이같이 말씀하십니다. 나는 네 젊은 시절의 신실한 사랑[a], 네 약혼 시절의 사랑[b], 곧 네가 광야, 씨 뿌리지 않은 땅에서 나를 따라왔던 일을 기억한다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신실한 사랑’은 חֶסֶד의 번역입니다. 언약적 충성과 애정을 강조하여 ‘변함없는 사랑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘약혼 시절의 사랑’은 ‘신부 시절의 사랑’으로도 옮길 수 있습니다. 히브리어는 이스라엘이 초기에 신부처럼 보인 헌신을 가리키는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  english_pob_choice: Go and proclaim
  chosen_korean: 가서 … 외치십시오
  alternatives_korean:
  - 가서 … 선포하십시오
  - 가서 … 외쳐 부르십시오
  lexicon: HALOT
  rationale: 강조된 명령형을 자연스러운 합쇼체로 옮기되, 예언자적 공적 선포의 성격을 살려 ‘외치십시오’를 택했습니다.
- source_word: בְּאָזְנֵי יְרוּשָׁלִַם
  english_pob_choice: in the hearing of Jerusalem
  chosen_korean: 예루살렘의 귀에 대고
  alternatives_korean:
  - 예루살렘이 듣는 데서
  - 예루살렘이 들을 때
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살려, 단순히 ‘예루살렘에게’로 평면화하지 않고 청각적 전달의 이미지를 보존했습니다.
- source_word: חֶסֶד
  english_pob_choice: faithful love
  chosen_korean: 신실한 사랑
  alternatives_korean:
  - 인자한 사랑
  - 변함없는 사랑
  - 언약적 신실함
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충성과 애정의 결을 함께 살리기 위해 ‘신실한 사랑’으로 옮겼습니다. 전통적 ‘인자’는 현대어에서 의미가 약해질 수 있습니다.
- source_word: כְּלוּלֹתַיִךְ
  english_pob_choice: the love of your betrothal
  chosen_korean: 네 약혼의 사랑
  alternatives_korean:
  - 네 신부의 사랑
  - 네 혼인 예식의 사랑
  - 네 결혼 약속의 사랑
  lexicon: HALOT
  rationale: כְּלוּלֹת이 가리키는 신랑신부적·약혼기 이미지를 한국어로 간결하게 살리기 위해 ‘약혼의 사랑’으로 옮겼습니다. 과도하게 특정한 결혼 단계로 좁히지는 않았습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 사막에서
  - 들판에서
  lexicon: HALOT
  rationale: 출애굽과 언약 여정을 환기하는 성경적 용례를 따라 ‘광야’로 번역했습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: יהוה를 ‘야훼’로 옮기고, 메시지 도입부의 주체를 고유명으로 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 표준에 따라 신적 고유명을 제목어 대체가 아닌 음역으로 보존하여, 예언자 발화에서의 인격적 자기계시를 드러냈습니다.
  doctrine_reference: Tetragrammaton rendering policy
- issue: 결혼 은유의 해석 범위
  chosen_reading: ‘약혼의 사랑’을 유지해 이스라엘과 야훼 사이의 언약-혼인 비유를 보존했습니다.
  alternative_readings:
  - 네 결혼의 사랑
  - 네 신부 시절의 사랑
  rationale: 본문은 초기 언약적 충성을 혼인 이미지로 말하므로, 한 단계로 단정하지 않고 은유의 긴장을 그대로 남겨 두었습니다.
  doctrine_reference: Preserve metaphorical tension in prophetic imagery
