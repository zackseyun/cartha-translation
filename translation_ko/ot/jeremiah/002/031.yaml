  naturalness: ‘오 세대여’와 명령형 ‘보아라’는 현대 표준 한국어의 합쇼체와 맞지 않습니다. ‘너희 세대여, 너희는 … 보십시오’ 및 의문형 ‘였습니까’로 고치면 예언자적 호격을 유지하면서도 현대의 격식 있는 문체가 됩니다. ‘당신께 나아가지 않겠습니다’는 직접 발화의 대상을 보존하며 문맥상 자연스럽습니다.
  terminology: YHWH를 ‘야훼’로 옮긴 것은 프로젝트 방침과 일치합니다. ‘광야’, ‘짙은 어둠의 땅’, ‘내 백성’도 적절합니다. רַדְנוּ에는 본문 내 단정적 해석을 줄이고, 각주에 ‘떠돌다/다스리다/속박에서 벗어나다’ 등의 선택지를 제시합니다.
