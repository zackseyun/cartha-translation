- from: “오 세대여[a], 너희 자신이 야훼의 말씀을 보아라. 내가 이스라엘에게 광야였느냐, 아니면 짙은 어둠의 땅이었느냐? 어찌하여 내 백성이 ‘우리는 스스로 주인 노릇을 합니다. 우리는 더는 당신에게 오지 않겠습니다’라고 말하였느냐?”
  to: “너희 세대여, 너희는 야훼의 말씀을 보십시오. 내가 이스라엘에게 광야였습니까, 또는 짙은 어둠의 땅이었습니까? 어찌하여 내 백성이 ‘우리는 주인입니다[a]. 더는 당신께 나아가지 않겠습니다’라고 말하였습니까?”
  rationale: 현대 합쇼체로 문체를 통일하고, 호격과 강조된 ‘너희’를 유지했습니다. רַדְנוּ는 영어 POB의 ‘We are lords’에 상응하게 ‘우리는 주인입니다’로 옮기되, 난해한 어휘의 대안들은 각주에 명시하여 특정 해석을 강요하지 않도록 했습니다. 나머지 수사적 비유와 직접 발화의 구조는 유지했습니다.
  reviewer_model: gpt-5.6-terra
