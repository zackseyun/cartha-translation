  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/דּ֗וֹר אַתֶּם֙ רְא֣וּ דְבַר יְהוָ֔ה הֲ/מִדְבָּ֤ר הָיִ֨יתִי֙ לְ/יִשְׂרָאֵ֔ל אִ֛ם אֶ֥רֶץ מַאְפֵּ֖לְיָ֑ה מַדּ֜וּעַ אָמְר֤וּ עַמִּ/י֙ רַ֔דְנוּ לֽוֹא נָב֥וֹא ע֖וֹד אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/031.yaml
  text: 'O generation[a], you yourselves, see the word of Yahweh: Have I been a wilderness to Israel, or a land of deep darkness? Why has my people said, ‘We are lords; we will come to you no more’?”'
  footnotes:
  - marker: a
    text: Or, 'We roam,' 'We rule,' or 'We have broken loose.' The Hebrew verb is difficult, but the sense in context is a claim of independence from the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: “너희 세대여, 너희는 야훼의 말씀을 보십시오. 내가 이스라엘에게 광야였습니까, 또는 짙은 어둠의 땅이었습니까? 어찌하여 내 백성이 ‘우리는 주인입니다[a]. 더는 당신께 나아가지 않겠습니다’라고 말하였습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘라드누’의 뜻은 불확실합니다. ‘우리는 자유롭게 떠돕니다’, ‘우리는 다스립니다’, 또는 ‘우리는 속박에서 벗어났습니다’로도 옮길 수 있습니다. 문맥에서는 야훼에게 더 이상 의존하지 않겠다는 선언을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוֹר
  english_pob_choice: O generation
  chosen_korean: 오 세대여
  alternatives_korean:
  - 이 세대여
  - 세대여
  lexicon: HALOT
  rationale: 예언자적 호격을 살리기 위해 감탄사적 호격 형태를 쓰되, 현대 한국어에서 자연스러운 ‘세대여’를 택했습니다.
- source_word: הֲמִדְבָּר הָיִיתִי לְיִשְׂרָאֵל
  english_pob_choice: Have I been a wilderness to Israel
  chosen_korean: 내가 이스라엘에게 광야였느냐
  alternatives_korean:
  - 내가 이스라엘에게 사막이었느냐
  - 내가 이스라엘에게 들판이었느냐
  lexicon: HALOT
  rationale: 광야는 성경적 이미지와 연결되면서도, 하나님이 돌보지 않는 황무함의 대비를 잘 드러냅니다.
- source_word: אֶרֶץ מַאְפֵּלְיָה
  english_pob_choice: a land of deep darkness
  chosen_korean: 짙은 어둠의 땅
  alternatives_korean:
  - 깊은 어둠의 땅
  - 짙은 흑암의 땅
  lexicon: HALOT
  rationale: 마어펠야의 강한 어둠을 한국어에서 자연스럽고도 농도 있게 표현했습니다.
- source_word: רַדְנוּ
  english_pob_choice: We are lords / We are free to roam
  chosen_korean: 우리는 스스로 주인 노릇을 합니다
  alternatives_korean:
  - 우리는 제멋대로 다닙니다
  - 우리는 풀려났습니다
  - 우리는 주인입니다
  lexicon: HALOT
  rationale: 히브리어 동사는 난해하므로, 문맥상 여호와에 대한 독립 선언이라는 핵심을 드러내는 쪽으로 옮겼습니다. ‘주인 노릇’은 지배·자율의 뉘앙스를 함께 담습니다.
- source_word: לֹא נָבוֹא עוֹד אֵלֶיךָ
  english_pob_choice: we will come to you no more
  chosen_korean: 우리는 더는 당신에게 오지 않겠습니다
  alternatives_korean:
  - 우리는 다시는 당신께 오지 않겠습니다
  - 우리는 더 이상 당신에게 오지 않을 것입니다
  lexicon: HALOT
  rationale: ‘더는 … 않겠습니다’는 지속적 중단을 자연스럽게 전달하며, 여기서 ‘당신’은 백성이 야훼께 하는 직접 발화의 긴장을 유지합니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 여호와 대신 고유명사 음역을 유지해, 언약적 이름 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 백성의 자기진술 רַדְנוּ의 의미
  chosen_reading: 우리는 스스로 주인 노릇을 합니다
  alternative_readings:
  - 우리는 자유롭게 떠돕니다
  - 우리는 풀려났습니다
  - 우리는 주인입니다
  rationale: 본문의 신학적 긴장은 단순한 이동이 아니라 야훼로부터의 독립 선언이므로, 자율·지배의 반항적 뉘앙스를 한국어로 분명히 했습니다.
  doctrine_reference: Translation philosophy §3, §5
