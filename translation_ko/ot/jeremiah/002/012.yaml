  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'Be astonished at this, O heavens; tremble, be very devastated.' The Hebrew verbs are vivid and somewhat overlapping, expressing shock, horror, and desolation.
