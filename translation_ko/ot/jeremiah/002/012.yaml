translation:
  language: ko
  text: 하늘아, 이 일을 보고 경악하라[a]. 몸서리쳐라. 몹시 황폐해져라. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘아, 이 일에 놀라라. 몸서리치고, 매우 황폐해져라.” 히브리어 동사들은 생생하며 일부 의미가 겹쳐, 충격과 공포와 극심한 황폐를 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
