id: JER.2.12
reference: Jeremiah 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֹׁ֥מּוּ שָׁמַ֖יִם עַל זֹ֑את וְ/שַׂעֲר֛וּ חָרְב֥וּ מְאֹ֖ד נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/012.yaml
  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'Be astonished at this, O heavens; tremble, be very devastated.' The Hebrew verbs are vivid and somewhat overlapping, expressing shock, horror, and desolation.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일로 말미암아 하늘아, 놀라라[a]. 떨며, 몹시 황폐해져라. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일로 말미암아 놀라라, 하늘아; 떨며, 매우 황폐해져라.” 히브리어 동사들은 생생하고 서로 일부 겹치며, 충격과 공포, 황폐함을 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמּוּ
  english_pob_choice: Be appalled
  chosen_korean: 놀라라
  alternatives_korean:
  - 경악하라
  - 소스라치라
  - 놀라지 않느냐
  lexicon: HALOT
  rationale: 놀람과 경악을 함께 담는 명령형으로, 선지자적 탄식에서의 충격을 자연스럽게 살립니다.
- source_word: שָׁמַיִם
  english_pob_choice: O heavens
  chosen_korean: 하늘아
  alternatives_korean:
  - 하늘들아
  - 오 하늘아
  lexicon: HALOT
  rationale: 하늘을 향한 직접 호격을 한국어에서 자연스럽게 살려, 창조 세계 전체를 증인으로 부르는 선지자적 호소를 유지합니다.
- source_word: וְשַׂעֲרוּ
  english_pob_choice: shudder
  chosen_korean: 떨며
  alternatives_korean:
  - 몸서리치며
  - 전율하며
  - 두려워하며
  lexicon: HALOT
  rationale: שער의 강한 떨림·전율의 뉘앙스를 한국어 현재형 명령으로 간결하게 옮겼습니다.
- source_word: חָרְב֥וּ מְאֹ֖ד
  english_pob_choice: be utterly desolate
  chosen_korean: 몹시 황폐해져라
  alternatives_korean:
  - 완전히 황폐해져라
  - 극도로 황폐해져라
  - 아주 메마르라
  lexicon: HALOT
  rationale: 문맥상 '마르다'보다 황폐·파괴의 이미지를 살리는 것이 더 적절하므로, 강한 정도 부사와 함께 멸망의 상태를 드러냈습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선포입니다
  - 야훼의 말씀이라고 하십니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה를 한국어 예언서 문체에 맞게 마감하되, 신적 이름은 프로젝트 기준에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 고유 신명 יְהוָה를 직접 사용하므로, 제목적 대체어가 아니라 고유명칭을 드러내는 번역을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 예언적 호격과 명령의 수사
  chosen_reading: 하늘을 증인으로 부르는 직접 호격과 연속 명령을 그대로 유지
  alternative_readings:
  - 진술문으로 완화
  - 감탄문으로 전환
  rationale: 본문은 충격과 심판을 하늘에 직접 호명하는 예언적 수사이므로, 한국어에서도 명령형의 날카로움을 약화하지 않았습니다.
  doctrine_reference: Prophetic discourse style
