  - 야훼의 말씀이라고 하십니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה를 한국어 예언서 문체에 맞게 마감하되, 신적 이름은 프로젝트 기준에 따라 야훼로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 고유 신명 יְהוָה를 직접 사용하므로, 제목적 대체어가 아니라 고유명칭을 드러내는 번역을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 예언적 호격과 명령의 수사
  chosen_reading: 하늘을 증인으로 부르는 직접 호격과 연속 명령을 그대로 유지
  alternative_readings:
  - 진술문으로 완화
  - 감탄문으로 전환
  rationale: 본문은 충격과 심판을 하늘에 직접 호명하는 예언적 수사이므로, 한국어에서도 명령형의 날카로움을 약화하지 않았습니다.
  doctrine_reference: Prophetic discourse style
