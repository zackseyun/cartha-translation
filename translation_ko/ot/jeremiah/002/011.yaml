source:
  edition: WLC
  text: הַ/הֵימִ֥יר גּוֹי֙ אֱלֹהִ֔ים וְ/הֵ֖מָּה לֹ֣א אֱלֹהִ֑ים וְ/עַמִּ֛/י הֵמִ֥יר כְּבוֹד֖/וֹ בְּ/ל֥וֹא יוֹעִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
  footnotes:
  - marker: a
    text: Or 'exchanged.' The Hebrew verb can mean 'change,' 'exchange,' or 'replace.'
    reason: lexical_alternative
  - marker: b
    text: '''Their Glory'' likely refers to the LORD, Israel''s true glory, expressed by a Hebrew title/metonymy rather than naming him directly.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for what is useless' or 'for that which does not help.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 그 신들이 신들이 아닐지라도, 어느 나라가 자기 신들을 바꾼 적이 있습니까? 그런데 내 백성은 자기의 영광[b]을 아무 유익도 없는 것[c]으로 바꾸었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바꾸었습니다’는 ‘교환했습니다’ 또는 ‘대신했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기의 영광’은 이스라엘의 참된 영광이신 여호와를 가리킬 수 있습니다. 그러나 이스라엘 자신의 영광이나 명예를 가리킨다고 이해할 여지도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘쓸모없는 것’ 또는 ‘도움이 되지 않는 것’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵימִיר
  english_pob_choice: changed
  chosen_korean: 바꾸었습니다
  alternatives_korean:
