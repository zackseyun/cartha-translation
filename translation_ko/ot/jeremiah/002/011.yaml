id: JER.2.11
reference: Jeremiah 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/הֵימִ֥יר גּוֹי֙ אֱלֹהִ֔ים וְ/הֵ֖מָּה לֹ֣א אֱלֹהִ֑ים וְ/עַמִּ֛/י הֵמִ֥יר כְּבוֹד֖/וֹ בְּ/ל֥וֹא יוֹעִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
  footnotes:
  - marker: a
    text: Or 'exchanged.' The Hebrew verb can mean 'change,' 'exchange,' or 'replace.'
    reason: lexical_alternative
  - marker: b
    text: '''Their Glory'' likely refers to the LORD, Israel''s true glory, expressed by a Hebrew title/metonymy rather than naming him directly.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for what is useless' or 'for that which does not help.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어느 나라가 자기들의 신들을 바꾸었습니까—그것들은 신이 아니면서도 말입니다? 그런데 내 백성은 자기의 영광을 아무 유익도 없는 것과 바꾸었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵימִיר
  english_pob_choice: changed
  chosen_korean: 바꾸었습니다
  alternatives_korean:
  - 바꾸어버렸습니다
  - 교환했습니다
  - 갈아치웠습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘바꾸다/교환하다/대신하다’의 폭을 가지므로, 문맥의 대조를 살리면서도 자연스러운 합쇼체로 ‘바꾸었습니다’를 택했습니다.
- source_word: גּוֹי
  english_pob_choice: nation
  chosen_korean: 어느 나라
  alternatives_korean:
  - 어느 민족
  - 어느 나라 백성
  lexicon: HALOT
  rationale: 수사적 질문에서 집단 단위를 가리키므로 ‘나라’가 가장 직접적입니다. 한국어에서는 관용적으로 자연스러운 질문형을 위해 ‘어느 나라’로 옮겼습니다.
- source_word: כְּבוֹדוֹ
  english_pob_choice: their Glory
  chosen_korean: 자기의 영광
  alternatives_korean:
  - 그들의 영광
  - 그들의 영광이신 분
  - 자기 영광
  lexicon: HALOT
  rationale: 여기서는 이스라엘이 여호와를 우회적으로 가리키는 메토님/칭호 가능성을 유지하되, 본문이 직접 밝히지 않은 참조를 과도하게 풀지 않기 위해 ‘자기의 영광’으로 보존했습니다.
- source_word: בְּלֹא יוֹעִיל
  english_pob_choice: what does not profit
  chosen_korean: 아무 유익도 없는 것
  alternatives_korean:
  - 도움이 되지 않는 것
  - 유익하지 않은 것
  - 쓸모없는 것
  lexicon: HALOT
  rationale: 히브리어는 ‘유익하다/이롭다’의 부정으로 무가치를 말하므로, ‘아무 유익도 없는 것’이 원문의 평가적 뉘앙스를 가장 잘 드러냅니다.
theological_decisions:
- issue: כְּבוֹדוֹ의 지시 대상
  chosen_reading: 이스라엘의 참된 영광이신 여호와를 우회적으로 가리키는 표현으로 유지합니다.
  alternative_readings:
  - 이스라엘 자신의 명예나 영광
  - 추상적 의미의 영광
  rationale: 예언자적 대조는 ‘신들’과 ‘영광’ 사이의 반전을 통해 우상숭배의 어리석음을 드러냅니다. 본문을 과도하게 명시화하지 않고, 히브리어의 우회적 표현을 한국어에서도 유지했습니다.
  doctrine_reference: 원문 우선 원칙과 우회적 신칭호 보존
- issue: ‘신들’과 ‘신이 아니면서도’의 대비
  chosen_reading: 문법상 복수 표현을 살려 우상들의 실재 부정을 강조합니다.
  alternative_readings:
  - 그것들은 신이 아닙니다
  - 그것들은 하나님이 아닙니다
  rationale: 히브리어 복수형 אֱלֹהִים의 형식을 보존해야 하므로, 단수 ‘하나님’으로 평준화하지 않고 ‘신들’/‘신이 아니면서도’로 대조를 유지했습니다.
  doctrine_reference: 히브리어 복수형 보존
