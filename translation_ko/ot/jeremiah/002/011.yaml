  lexicon: HALOT
  rationale: 히브리어 동사는 ‘바꾸다/교환하다/대신하다’의 폭을 가지므로, 문맥의 대조를 살리면서도 자연스러운 합쇼체로 ‘바꾸었습니다’를 택했습니다.
