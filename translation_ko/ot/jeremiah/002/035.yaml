language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּֽאמְרִי֙ כִּ֣י נִקֵּ֔יתִי אַ֛ךְ שָׁ֥ב אַפּ֖/וֹ מִמֶּ֑/נִּי הִנְ/נִי֙ נִשְׁפָּ֣ט אוֹתָ֔/ךְ עַל אָמְרֵ֖/ךְ לֹ֥א חָטָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/035.yaml
  text: Yet you said[a], “I am innocent; surely his anger has turned away from me.” Behold, I am entering into judgment with you because you say, “I have not sinned.”
  footnotes:
  - marker: a
    text: Or “I am entering into judgment with you”; the Hebrew uses courtroom language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 네가 말하기를 “나는 깨끗합니다. 분명히 그의 분노가 내게서 돌아섰습니다”라고 하였습니다. 보십시오, 내가 네게 대하여 심판에 들어가겠으니, 이는 네가 “나는 죄를 짓지 않았습니다”라고 말하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 네게 대하여 심판에 들어가겠으니”; 히브리어는 법정 언어를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמְרִי
  english_pob_choice: Yet you said
  chosen_korean: 그러나 네가 말하기를
  alternatives_korean:
  - 그리고 네가 말하기를
  - 그런데 네가 말하기를
  lexicon: HALOT
  rationale: 2인칭 여성 단수의 항의성 대화를 살려 앞 문맥과의 대조를 한국어 접속부사 ‘그러나’로 자연스럽게 옮겼습니다.
- source_word: נִקֵּיתִי
  english_pob_choice: I am innocent
  chosen_korean: 나는 깨끗합니다
  alternatives_korean:
  - 나는 무죄입니다
  - 나는 결백합니다
  - 나는 깨끗해졌습니다
  lexicon: HALOT
  rationale: נקה의 ‘죄가 없다/깨끗하다’는 법정·도덕적 무결함을 가리키므로, 현대 한국어에서 너무 해석적인 ‘무죄’보다 ‘깨끗합니다’가 원문의 직설을 더 잘 보존합니다.
- source_word: שָׁב אַפּוֹ מִמֶּנִּי
  english_pob_choice: his anger has turned away from me
  chosen_korean: 분명히 그의 분노가 내게서 돌아섰습니다
  alternatives_korean:
  - 그의 분노가 내게서 돌이켰습니다
  - 그의 진노가 내게서 물러났습니다
  lexicon: HALOT
  rationale: ‘אַף’의 감정적/심판적 분노를 ‘분노’로 옮기고, שׁוּב의 관용구를 ‘돌아섰습니다’로 처리해 ‘나에게서 멈추었다’는 오해를 피했습니다.
- source_word: נִשְׁפָּט אֹתָךְ
  english_pob_choice: I am entering into judgment with you
  chosen_korean: 내가 네게 대하여 심판에 들어가겠으니
  alternatives_korean:
  - 내가 너와 함께 심판하겠으니
  - 내가 너를 심판하겠으니
  - 내가 너와 논쟁하겠으니
  lexicon: HALOT
  rationale: פָּט/שׁפט의 법정적 뉘앙스를 살리기 위해 단순한 ‘심판하다’보다 ‘심판에 들어가다’로 옮겨, 소송/재판 절차의 시작을 드러냈습니다.
- source_word: לֹא חָטָאתִי
  english_pob_choice: I have not sinned
  chosen_korean: 나는 죄를 짓지 않았습니다
  alternatives_korean:
  - 나는 죄를 범하지 않았습니다
  - 나는 죄가 없습니다
  lexicon: HALOT
  rationale: חטא의 기본적 의미를 현대 한국어의 일반적 표현으로 옮겨, 인용된 자기변호의 직접성을 유지했습니다.
theological_decisions:
- issue: 하나님의 법정적 경고의 어조
  chosen_reading: ‘심판에 들어가겠으니’로 법정 소송의 시작을 드러냈습니다.
  alternative_readings:
  - ‘너를 심판하겠다’로 단순화할 수 있음
  - ‘너와 다투겠다’로 완화할 수 있음
  rationale: 히브리어는 단순한 처벌 선언보다 언약 소송의 법정 언어를 사용하므로, 한국어도 그 절차성과 긴장을 보존하는 쪽이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §6
