source:
  edition: WLC
  text: גַּם בְּנֵי נֹ֖ף ו/תחפנס יִרְע֖וּ/ךְ קָדְקֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/016.yaml
  text: Even the sons of Noph and Tahpanhes have grazed your crown.
  footnotes:
  - marker: a
    text: Or 'the people of Noph and Tahpanhes.' Hebrew 'sons of' can denote the inhabitants of a place.
    reason: lexical_alternative
  - marker: b
    text: Noph is commonly identified with Memphis in Egypt.
    reason: cultural_note
  - marker: c
    text: The Hebrew verb literally means 'have grazed' or 'have fed on'; some translations render the sense more interpretively as 'have broken' or 'have crushed.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the crown of your head' or 'your scalp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 심지어 놉[b]과 다바네스 사람들[a]도 네 정수리를 뜯어먹었습니다[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘놉과 다바네스의 아들들’입니다. 이와 같이 지명과 함께 쓰인 ‘아들들’은 그곳의 사람들 또는 주민들을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 놉은 흔히 이집트의 멤피스와 동일시됩니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 동사는 문자적으로 ‘풀을 뜯다’ 또는 ‘먹다’라는 뜻입니다. 일부 번역은 문맥상 그 뜻을 더 해석하여 ‘부수다’ 또는 ‘짓밟다’로 옮깁니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘네 머리의 정수리’나 ‘네 두피’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 심지어
  alternatives_korean:
  - 또한
  - 심지어도
  lexicon: HALOT
  rationale: 문맥상 강조를 살려 ‘심지어’로 옮기면, 기대와 반대되는 충격을 분명하게 드러낼 수 있습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 사람들
  - 거주민들
  lexicon: HALOT
  rationale: 지명 앞의 ‘sons of’는 그 지역의 사람들을 가리킬 수 있으므로, 직역의 어색함을 피하면서도 집단성을 살려 ‘자손들’로 옮겼습니다.
- source_word: יִרְעוּ
  english_pob_choice: have grazed
  chosen_korean: 뜯어먹었습니다
  alternatives_korean:
  - 풀을 뜯었습니다
  - 먹어 치웠습니다
  - 유린했습니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘먹이다/뜨다’ 계열의 목축 이미지를 유지하되, 이 본문의 폭력적·굴욕적 비유를 한국어에서 자연스럽게 드러내기 위해 ‘뜯어먹다’를 택했습니다.
- source_word: קָדְקֹד
  english_pob_choice: your crown
  chosen_korean: 정수리
  alternatives_korean:
  - 머리 꼭대기
  - 두상
  - 두피
  lexicon: HALOT
  rationale: 히브리어는 머리의 윗부분을 가리키므로, 지나치게 비유적인 ‘왕관’보다 신체 부위로서 분명한 ‘정수리’가 본문의 이미지를 더 직접적으로 전달합니다.
theological_decisions:
- issue: 폭력적 은유의 보존
  chosen_reading: ‘뜯어먹었습니다’로 옮겨, 단순한 ‘상처를 입혔다’는 식으로 완화하지 않았습니다.
  alternative_readings:
  - 상하게 했습니다
  - 부수었습니다
  - 면도했습니다
  rationale: 문맥의 수치와 침해를 드러내는 원문의 강한 이미지가 약화되지 않도록, 해석적 완곡어를 피했습니다.
  doctrine_reference: 예언서의 심판 비유를 있는 그대로 전달하는 번역 원칙
