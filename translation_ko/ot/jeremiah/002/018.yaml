id: JER.2.18
reference: Jeremiah 2:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ מִצְרַ֔יִם לִ/שְׁתּ֖וֹת מֵ֣י שִׁח֑וֹר וּ/מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ אַשּׁ֔וּר לִ/שְׁתּ֖וֹת מֵ֥י נָהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/018.yaml
  text: And now[a], what have you to do with the way to Egypt, to drink the waters of Shihor? And what have you to do with the way to Assyria[b], to drink the waters of the River?
  footnotes:
  - marker: a
    text: Shihor is likely a name for the Nile or one of its eastern branches.
    reason: lexical_alternative
  - marker: b
    text: That is, the Euphrates River.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 시홀의 물[a]을 마시려고 이집트로 가는 길이 너와 무슨 상관이 있습니까? 또 그 강의 물[b]을 마시려고 앗수르로 가는 길이 너와 무슨 상관이 있습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시홀은 나일강 또는 그 동쪽 지류를 가리키는 이름일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 유프라테스강입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 현재의 전환과 책망의 시작을 간결하게 살리되, 한국어에서 가장 자연스러운 접속부사로 처리했습니다.
- source_word: מַה לָּךְ / וּמַה לָּךְ
  english_pob_choice: what have you to do with
  chosen_korean: 무슨 상관이 있느냐
  alternatives_korean:
  - 너에게 무슨 일이 있느냐
  - 너와 무슨 관련이 있느냐
  - 너와 무슨 상관이 있느냐
  lexicon: HALOT
  rationale: 이 관용구는 단순한 정보 질문이 아니라 분리와 책망을 뜻하므로, 현대 한국어에서 그 뉘앙스를 직접 드러내는 표현으로 옮겼습니다.
- source_word: לְדֶרֶךְ
  english_pob_choice: with the way to
  chosen_korean: 가는 길
  alternatives_korean:
  - 길
  - 길로 가는 것
  lexicon: HALOT
  rationale: 문자적으로는 '길/way'이지만, 이 문맥에서는 외국 강대국으로 향하는 행로를 가리키므로 한국어에서는 자연스럽게 '가는 길'로 옮겼습니다.
- source_word: מֵי שִׁחוֹר
  english_pob_choice: the waters of Shihor
  chosen_korean: 시홀의 물
  alternatives_korean:
  - 시홀의 물줄기
  - 나일의 물
  lexicon: HALOT
  rationale: שִׁיחוֹר는 고유명으로 본문에서는 음역을 유지하고, 해석적 동일시인 '나일'은 본문이 아닌 각주에서 처리하는 편이 원문에 더 충실합니다.
- source_word: מֵי נָהָר
  english_pob_choice: the waters of the River
  chosen_korean: 강의 물
  alternatives_korean:
  - 그 강의 물
  - 유프라테스의 물
  lexicon: HALOT
  rationale: 본문의 정관사적 표현을 살려 '강'으로 두었고, 원문이 굳이 특정 강 이름을 밝히지 않는 긴장을 유지했습니다.
theological_decisions:
- issue: 이사야/예레미야류의 외세 의존 책망 이미지 유지
  chosen_reading: 외세에 기대려는 정치적 의존을 암시하는 이미지로서 '물'과 '길'의 비유를 본문에 그대로 유지했습니다.
  alternative_readings:
  - 이집트와 앗수르로 실제로 이동하는 길에 대한 단순 지리 묘사로 읽기
  - 의존 대상 자체를 풀어서 '도움을 구하려고'로 명시적으로 번역하기
  rationale: 예레미야의 문맥상 비유적 책망이 분명하지만, 본문 자체는 해석을 설명하지 않고 이미지를 제시하므로 과도한 풀이보다 원문의 수사성을 보존하는 것이 적절합니다.
  doctrine_reference: 예레미야 2장 문맥의 언약 신실성 및 우상/외세 의존 비판
