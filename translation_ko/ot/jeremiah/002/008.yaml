id: JER.2.8
reference: Jeremiah 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/כֹּהֲנִ֗ים לֹ֤א אָֽמְרוּ֙ אַיֵּ֣ה יְהוָ֔ה וְ/תֹפְשֵׂ֤י הַ/תּוֹרָה֙ לֹ֣א יְדָע֔וּ/נִי וְ/הָ/רֹעִ֖ים פָּ֣שְׁעוּ בִ֑/י וְ/הַ/נְּבִיאִים֙ נִבְּא֣וּ בַ/בַּ֔עַל וְ/אַחֲרֵ֥י לֹֽא יוֹעִ֖לוּ הָלָֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/008.yaml
  text: The priests did not say[a], ‘Where is Yahweh?’ Those who handle the law did not know me; the shepherds rebelled against me[c][b]; the prophets prophesied by Baal and went after things that do not profit.
  footnotes:
  - marker: a
    text: Or 'those who wield the law,' 'those who teach the law.' The Hebrew literally refers to those who 'handle' or 'grasp' the law.
    reason: lexical_alternative
  - marker: b
    text: Or 'the prophets prophesied in the name of Baal.'
    reason: alternative_reading
  - marker: c
    text: Or 'went after what is useless' or 'walked after things that do not profit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들은 “야훼께서 어디 계십니까?”라고 말하지 않았습니다. 율법을 다루는 자들[a]은 나를 알지 못했고, 목자들은 내게 반역했습니다. 예언자들은 바알의 이름으로 예언했으며[b], 유익을 주지 않는 것들을 따라갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법을 다루는 자들’은 문자적으로 ‘율법을 붙잡는 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예언자들은 바알을 힘입어 예언했다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘유익을 주지 않는 것들을 따라갔다’입니다. ‘쓸모없는 것을 따라갔다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들은
  alternatives_korean:
  - 제사장 계층은
  - 제사장들이
  lexicon: HALOT
  rationale: 복수의 제사장 집단을 가리키는 구체 명사로, 한국어에서는 주어 표지와 함께 자연스럽게 옮기는 것이 적절합니다.
- source_word: תֹפְשֵׂי הַתּוֹרָה
  english_pob_choice: Those who handle the law
  chosen_korean: 율법을 다루는 자들은
  alternatives_korean:
  - 율법을 붙드는 자들은
  - 율법을 가르치는 자들은
  lexicon: HALOT
  rationale: ‘붙들다/다루다’의 물리적 이미지와 직역성을 살리되, ‘가르치는 자들’처럼 역할을 미리 좁히지 않도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유한 언약명을 살리기 위해 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: פָּשְׁעוּ בִי
  english_pob_choice: rebelled against me
  chosen_korean: 내게 반역했습니다
  alternatives_korean:
  - 내게 반항했습니다
  - 내게 죄를 지었습니다
  lexicon: HALOT
  rationale: פּשע의 강한 정치·언약적 어감을 살려 단순한 도덕적 ‘죄’보다 ‘반역’으로 옮겼습니다.
- source_word: אַחֲרֵי לֹא יוֹעִלוּ הָלָכוּ
  english_pob_choice: went after things that do not profit
  chosen_korean: 아무 유익도 없는 것들을 따라갔습니다
  alternatives_korean:
  - 유익이 없는 것들을 따라갔습니다
  - 아무 소용도 없는 것들을 따라갔습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘~을 따라가다’ 관용을 살리면서, 암시된 대상의 비유익성을 자연스럽게 풀어냈습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼를 본문에 직접 표기합니다.
  alternative_readings:
  - 여호와를 본문에 표기
  - 주를 본문에 표기
  rationale: 본문이 직접 하나님의 고유명을 사용하므로, 프로젝트 방침에 따라 이를 가리지 않고 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘바알을 따라 예언했다’의 전치사 의미
  chosen_reading: 우상의 이름 아래서 예언했다는 뜻을 직접 드러내기보다, ‘바알을 따라 예언했다’로 유지했습니다.
  alternative_readings:
  - 바알의 이름으로 예언했다
  - 바알을 의지하여 예언했다
  rationale: 히브리어 전치사 ב의 범위를 좁히지 않고, 본문이 주는 배교의 충격을 간결하게 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 해석을 본문보다 앞세우지 않음
