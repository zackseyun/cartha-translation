id: JER.2.15
reference: Jeremiah 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָלָי/ו֙ יִשְׁאֲג֣וּ כְפִרִ֔ים נָתְנ֖וּ קוֹלָ֑/ם וַ/יָּשִׁ֤יתוּ אַרְצ/וֹ֙ לְ/שַׁמָּ֔ה עָרָ֥י/ו נצתה מִ/בְּלִ֥י יֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/015.yaml
  text: Young lions roar against him; they raise their voice. They make his land a desolation; his cities are burned[a], without inhabitant.
  footnotes:
  - marker: a
    text: Or 'his cities are laid waste, without inhabitant.' The Hebrew form נצתה is difficult and may be understood either as 'burned' or more generally as 'ruined/laid waste.'
    reason: lexical_alternative
translation:
  language: ko
  text: 젊은 사자들이 그를 향해 포효하며 소리를 높입니다. 그들은 그의 땅을 황폐하게 만들고, 그의 성읍들은 불타 버려 주민이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נצתה는 이 문맥에서 ‘불타다’로 이해하는 것이 가장 자연스럽지만, ‘황폐해지다’ 또는 ‘폐허가 되다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו / יִשְׁאֲגוּ
  english_pob_choice: against him / roar
  chosen_korean: 그들에게서 ... 포효하며
  alternatives_korean:
  - 그를 향해 포효하며
  - 그에게 대고 포효하며
  lexicon: HALOT
  rationale: 히브리어의 עַל은 적대적 방향성을 띠므로, 단순한 위치가 아니라 공격적 위협을 드러내는 표현으로 옮겼습니다. '포효하다'는 사자의 울음과 위압을 가장 직접적으로 살립니다.
- source_word: כְפִרִים
  english_pob_choice: young lions
  chosen_korean: 젊은 사자들
  alternatives_korean:
  - 사자 새끼들
  - 젊은 수사자들
  lexicon: HALOT
  rationale: כְפִרִים은 단순한 새끼가 아니라 기세 있는 어린 사자들을 가리키므로, '젊은 사자들'이 한국어로도 가장 자연스럽고 정확합니다.
- source_word: וַיָּשִׁיתוּ אַרְצ/וֹ לְשַׁמָּה
  english_pob_choice: They make his land a desolation
  chosen_korean: 그들은 그의 땅을 황폐하게 만들고
  alternatives_korean:
  - 그들은 그의 땅을 황무지로 만들고
  - 그들은 그의 땅을 폐허로 만들고
  lexicon: HALOT
  rationale: לְשַׁמָּה는 결과 상태를 나타내는 명사적 표현이므로, '황폐하게 만들다'로 옮겨 결과의 상태를 분명히 했습니다. '황무지'나 '폐허'보다 시적이면서도 본문의 파괴성을 유지합니다.
- source_word: נצתה מִבְּלִי יֹשֵׁב
  english_pob_choice: his cities are burned / without inhabitant
  chosen_korean: 그의 성읍들은 불타 버려 사람이 없습니다
  alternatives_korean:
  - 그의 성읍들은 불타 버렸고 거주자가 없습니다
  - 그의 성읍들은 불타 폐허가 되어 사람이 없습니다
  lexicon: HALOT
  rationale: נצתה는 문맥상 '불타다/불타 버리다'가 가장 가능성이 높아 이를 본문에 반영했습니다. מִבְּלִי יֹשֵׁב은 정착민 부재를 나타내므로 '사람이 없습니다'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 유다/이스라엘의 멸망을 사자 포효의 이미지로 묘사하는 방식
  chosen_reading: 본문의 파괴적이고 위협적인 이미지를 약화하지 않고, 사자들이 실제 공격 직전처럼 '포효하며' 땅과 성읍을 황폐하게 하는 장면으로 유지했습니다.
  alternative_readings:
  - 비유적으로 순화하여 단순한 '윽박지름'으로 옮김
  - 성읍 파괴를 일반적 재난으로 완화함
  rationale: 예레미야의 수사적 긴장과 심판 이미지를 보존해야 하므로, 동물 비유를 부드럽게 만들지 않고 그대로 드러냈습니다.
  doctrine_reference: 예레미야 2장의 언약 심판과 예언적 경고
