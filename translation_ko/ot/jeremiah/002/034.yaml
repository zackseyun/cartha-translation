id: JER.2.34
reference: Jeremiah 2:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֤ם בִּ/כְנָפַ֨יִ/ךְ֙ נִמְצְא֔וּ דַּ֛ם נַפְשׁ֥וֹת אֶבְיוֹנִ֖ים נְקִיִּ֑ים לֹֽא בַ/מַּחְתֶּ֥רֶת מְצָאתִ֖י/ם כִּ֥י עַל כָּל אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/034.yaml
  text: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
  footnotes:
  - marker: a
    text: Or 'on the hems of your garment'; literally 'in/on your wings.'
    reason: lexical_alternative
  - marker: b
    text: '''In a break-in'' translates a term for a burglary accomplished by digging through a wall; compare the legal background in Exodus 22:2.'
    reason: cross_reference
  - marker: c
    text: The Hebrew of the final clause is elliptical and difficult; alternatively, 'not because I found them breaking in, but for all these things.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 겉옷 자락에서도 죄 없는 가난한 사람들의 목숨의 피가 발견되었습니다[a]. 나는 그들이 도둑질하려고 들이판 곳에서 그들을 발견한 것이 아닙니다[b][c]. 오히려 이 모든 일 때문에 그렇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너의 날개/자락 안에’입니다. 옷의 가장자리나 겉옷 자락을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들이판 곳’은 벽을 파고 들어가 훔치는 침입, 곧 절도성 침입을 가리킵니다. 출애굽기 22:2의 법적 배경을 떠올리게 합니다.
    reason: cross_reference
  - marker: c
    text: 히브리어 마지막 절은 생략이 많아 해석이 어렵습니다. 다른 가능성으로는 ‘내가 그들이 들이침을 본 것이 아니라, 이 모든 일 때문에’라고 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּכְנָפַיִךְ
  english_pob_choice: on your skirts
  chosen_korean: 당신의 겉옷 자락에서도
  alternatives_korean:
  - 당신의 날개에서도
  - 당신의 옷단에서도
  lexicon: HALOT
  rationale: כָּנָף는 옷의 날개/자락/옷단을 뜻할 수 있는데, 여기서는 혈흔이 묻은 옷자락이라는 구체적 이미지가 더 분명하므로 ‘겉옷 자락’이 가장 자연스럽고 오해를 줄입니다.
- source_word: דַּם נַפְשׁוֹת אֶבְיוֹנִים נְקִיִּים
  english_pob_choice: the blood of the lives of innocent poor people
  chosen_korean: 죄 없는 가난한 사람들의 목숨의 피
  alternatives_korean:
  - 무죄한 궁핍한 자들의 생명의 피
  - 가난한 무죄자들의 피
  lexicon: HALOT
  rationale: נֶפֶשׁ을 ‘목숨’으로 옮겨 사람의 생명 자체가 유린된 점을 드러내고, אֶבְיוֹנִים נְקִיִּים는 ‘가난한/죄 없는’이라는 두 수식어를 모두 살리기 위해 이렇게 옮겼습니다.
- source_word: לֹא בַמַּחְתֶּרֶת
  english_pob_choice: in a break-in
  chosen_korean: 도둑질하려고 들이판 곳에서
  alternatives_korean:
  - 벽을 뚫고 침입한 곳에서
  - 밤중 침입 현장에서
  lexicon: HALOT
  rationale: מַחְתֶּרֶת는 벽을 파고 들어가는 절도 행위를 가리키지만, 현대 한국어에서는 그 법적·서사적 의미를 함께 전하는 표현이 필요하므로 ‘들이판’으로 침입 행위를 살렸습니다.
- source_word: מְצָאתִים
  english_pob_choice: I did not find them
  chosen_korean: 나는 그들을 발견한 것이 아닙니다
  alternatives_korean:
  - 나는 그들을 찾지 못했습니다
  - 나는 그들을 발견하지 않았습니다
  lexicon: HALOT
  rationale: MT의 1인칭 주어를 따라 주어는 야훼로 유지하고, ‘발견한 것이 아닙니다’로 바꿔 정당한 현행범 검거가 아니라는 법정적 부정을 한국어로 분명하게 전달했습니다.
- source_word: כִּי עַל כָּל אֵלֶּה
  english_pob_choice: but on account of all these things
  chosen_korean: 오히려 이 모든 일 때문에 그렇습니다
  alternatives_korean:
  - 그러나 이 모든 일 때문입니다
  - 이 모든 것들 때문입니다
  lexicon: HALOT
  rationale: 이 절은 생략이 많고 난해하므로, 앞절과의 대조를 살리면서 원인 개념(עַל)을 유지하는 쪽으로 ‘오히려 … 때문에’라고 옮겼습니다.
theological_decisions:
- issue: 화자와 법정적 무죄 주장
  chosen_reading: 야훼께서 1인칭으로 말씀하시며, ‘발견한 것이 아닙니다’는 살해된 가난한 자들이 정당방위의 절도범이 아니었다는 법정적 부정을 뜻합니다.
  alternative_readings:
  - ‘그들이 들이판 곳에서 그들을 발견하지 않았다’는 식의 완곡한 재구성
  - 피해 사실보다 일반적 죄책 증거로 읽는 해석
  rationale: 히브리어 동사형과 문맥이 야훼의 고발 화법을 지지하므로, 본문이 지닌 재판적 긴장을 약화시키지 않기 위해 직접적인 부정을 유지했습니다.
  doctrine_reference: 본문의 예언자적 고발과 언약적 심판 선언
