  verdict: revise
  source_fidelity: 히브리어의 1인칭 단수 화자와 3인칭 복수 목적어(‘나는 그들을 발견하지 않았다’)는 유지되어야 합니다. 초안의 ‘도둑질하려고 들이판 곳’은 מַחְתֶּרֶת가 가리키는 벽을 뚫고 들어가는 절도성 침입의 의미를 부정확하고 비표준적인 표현으로 재구성합니다. 또한 마지막의 난해하고 생략적인 절은 원인·대조를 보충하되, 본문보다 구체적인 설명을 덧붙이지 않는 편이 좋습니다.
  naturalness: ‘들이판 곳’은 현대 표준어로 자연스럽지 않으며, ‘그렇습니다’는 앞 문장의 피살 사실을 가리키는 지시어가 불명확합니다. ‘침입하는 현장’ 및 ‘이 모든 일 때문입니다’는 합쇼체를 유지하면서 더 자연스럽고 명료합니다. ‘목숨의 피’보다 ‘생명의 피’가 한국어에서 다소 더 자연스럽지만, 원문의 강조된 표현은 보존합니다.
  terminology: כָּנָף의 의복 의미에는 ‘옷자락’이 적절합니다. אֶבְיוֹנִים נְקִיִּים은 사회적으로 궁핍한 이들과 그들의 무죄를 모두 나타내므로 ‘무고한 가난한 이들’로 옮겼습니다. מַחְתֶּרֶת는 일반적인 ‘침입’만이 아니라 벽을 파거나 뚫어 들어가는 절도성 침입을 뜻하므로 각주에서 이를 밝혀야 합니다.
