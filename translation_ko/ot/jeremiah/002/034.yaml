  rationale: 수정문은 마소라 본문의 1인칭 화자와 ‘그들’이라는 목적어를 유지하고, 의복 자락에 묻은 무고한 빈곤층의 피라는 고발의 이미지를 보존합니다. 침입 관련 표현을 현대 표준어로 바로잡았으며, 난해한 종결절에는 원문의 인과·대조를 넘는 해석을 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:20:31Z'
