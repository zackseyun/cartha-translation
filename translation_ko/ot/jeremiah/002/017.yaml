id: JER.2.17
reference: Jeremiah 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לוֹא זֹ֖את תַּעֲשֶׂה לָּ֑/ךְ עָזְבֵ/ךְ֙ אֶת יְהוָ֣ה אֱלֹהַ֔יִ/ךְ בְּ/עֵ֖ת מוֹלִיכֵ֥/ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/017.yaml
  text: Has not this brought it upon you[b][a], because you have forsaken Yahweh your God when he was leading you in the way?
  footnotes:
  - marker: a
    text: Or 'Has not this done this to you?' The Hebrew is more literally 'Has not this done for/to you...?'
    reason: lexical_alternative
  - marker: b
    text: Or 'while he was leading you on the way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 너에게 이런 일을 가져오지 않았느냐? 네가 네 하나님 야훼를 버렸기 때문이다. 그가 너를 길에서 인도하실 때에.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 너에게 이런 일을 하지 않았느냐?’ 히브리어는 더 직역하면 ‘이것이 너를 위해/너에게 행하지 않았느냐?’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 너를 길에서 인도하시는 동안.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  english_pob_choice: Has not
  chosen_korean: 이것이 너에게 이런 일을 가져오지 않았느냐?
  alternatives_korean:
  - 그렇지 않으냐?
  - 이것이 너에게 닥치지 않았느냐?
  lexicon: HALOT
  rationale: 수사 의문문으로 꾸짖는 힘을 살리면서, 한국어에서는 결과를 묻는 형태로 자연스럽게 옮겼습니다.
- source_word: תַּעֲשֶׂה לָּךְ / זֹאת
  english_pob_choice: brought it upon you
  chosen_korean: 이런 일을 가져오지 않았느냐
  alternatives_korean:
  - 이것을 너에게 행하지 않았느냐
  - 이런 일을 너에게 행하지 않았느냐
  lexicon: HALOT
  rationale: 히브리어의 관용적 ‘너에게/너를 위해 행하다’는 문맥상 자초한 재앙을 가리키므로, ‘이런 일을 가져오다’로 결과성을 드러냈습니다.
- source_word: עָזְבֵךְ
  english_pob_choice: that you have forsaken
  chosen_korean: 네가 ... 버렸기 때문이다
  alternatives_korean:
  - 네가 ... 떠났기 때문이다
  - 네가 ... 저버렸기 때문이다
  lexicon: HALOT
  rationale: 사역적 원인 절을 한국어의 직접적인 이유 표현으로 옮겨, 앞의 재앙이 야훼를 버린 데서 비롯되었음을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 공개 원문주의 원칙에 따라 신명기적 언약 სახელ을 대체어가 아닌 음역으로 유지했습니다.
- source_word: בְּעֵת מוֹלִיכֵךְ בַּדָּרֶךְ
  english_pob_choice: when he was leading you in the way
  chosen_korean: 그가 너를 길에서 인도하실 때에
  alternatives_korean:
  - 그가 너를 길 가운데로 인도하고 계실 때에
  - 그가 너를 길로 인도하시던 때에
  lexicon: HALOT
  rationale: 분사적 진행성을 살리되, 한국어에서는 존대 주어 서술로 자연스럽게 ‘인도하실 때에’라고 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 야훼라는 고유 이름을 직접 사용하므로, 관습적 대체어를 쓰지 않고 고유명을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 원인절의 신학적 강조
  chosen_reading: 재앙의 원인을 ‘네가 ... 버렸기 때문이다’로 명시
  alternative_readings:
  - 단순한 시간절로 처리
  - ‘버렸으므로’로 더 축약
  rationale: 문맥상 예언자의 책망은 우연한 불행이 아니라 야훼를 버린 행위에 대한 응답이라는 점을 드러내므로, 원인 관계를 분명히 했습니다.
  doctrine_reference: Jeremiah 2 문맥의 언약 불성실 책망
