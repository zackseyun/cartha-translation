id: JER.2.28
reference: Jeremiah 2:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַיֵּ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ לָּ֔/ךְ יָק֕וּמוּ אִם יוֹשִׁיע֖וּ/ךָ בְּ/עֵ֣ת רָעָתֶ֑/ךָ כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/028.yaml
  text: But where are your gods that you made for yourself? Let them arise[a], if they can save you in the time of your trouble. For your gods, Judah[b], are as many as your cities.
  footnotes:
  - marker: a
    text: Or, 'For according to the number of your cities were your gods, Judah.'
    reason: lexical_alternative
  - marker: b
    text: '''Trouble'' here means calamity or disaster, not moral evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신이 자신을 위해 만든 신들은 어디에 있습니까? 그들이 일어나게 하십시오. 그들이 당신이 환난을 당할 때 당신을 구원할 수 있다면 말입니다. 유다여, 당신의 신들은 당신의 성읍 수만큼 많습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיֵּה
  english_pob_choice: But where are
  chosen_korean: 그러나 … 어디에 있느냐?
  alternatives_korean:
  - 그리고 … 어디에 있느냐?
  - 도대체 … 어디에 있느냐?
  lexicon: HALOT
  rationale: 예언자적 책망의 문맥에서 וְ를 단순 접속보다 반박적 전환으로 살려 ‘그러나’로 옮겼습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your gods
  chosen_korean: 네 신들
  alternatives_korean:
  - 너의 신들
  - 네 하나님들
  lexicon: HALOT
  rationale: 여기서는 유다가 만든 우상들을 가리키는 복수형이므로, 단수화하지 않고 ‘신들’로 분명히 했습니다.
- source_word: בְּעֵת רָעָתֶךָ
  english_pob_choice: in the time of your trouble
  chosen_korean: 네 환난 때에
  alternatives_korean:
  - 네 재난 때에
  - 네 재앙의 때에
  - 네 어려움 때에
  lexicon: HALOT
  rationale: רָעָה를 도덕적 ‘악’이 아니라 재난·재앙의 뜻으로 이해해, 한국어에서 자연스러운 ‘환난’으로 옮겼습니다.
- source_word: מִסְפַּר עָרֶיךָ הָיוּ אֱלֹהֶיךָ
  english_pob_choice: your gods, Judah, are as many as your cities
  chosen_korean: 네 신들은, 유다야, 네 성읍 수만큼이나 많다
  alternatives_korean:
  - 네 신들은, 유다야, 네 성읍의 수와 같다
  - 네 신들은, 유다야, 네 성읍의 수에 달한다
  lexicon: HALOT
  rationale: מִסְפַּר는 ‘수/개수’의 대응 관계를 나타내므로, 직역적이면서도 자연한 ‘수만큼이나 많다’로 처리했습니다.
theological_decisions:
- issue: 우상에 대한 조롱적 도전의 어조
  chosen_reading: ‘그들이 일어나게 하라’는 실제 요청이 아니라, 구원하지 못하는 우상들을 조롱하는 선지자적 도전으로 옮겼습니다.
  alternative_readings:
  - ‘일어나게 하라’의 단순 명령
  - ‘일어나게 해 보라’의 더 구어적인 조롱
  rationale: 히브리어 יָקוּמוּ와 뒤이은 조건절은 능력을 시험하는 비꼼을 형성하므로, 그 수사를 살리는 번역이 필요합니다.
  doctrine_reference: 우상 숭배 비판, 예레미야의 언약적 책망
