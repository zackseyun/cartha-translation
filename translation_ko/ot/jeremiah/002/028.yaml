  rationale: 문체를 일관되게 현대 합쇼체로 고쳤습니다. ‘자신을 위해 만든’으로 לָךְ의 재귀적/수익적 뉘앙스를 보존했고, ‘그들이 일어나게 하십시오’와 뒤따르는 조건절로 우상에 대한 수사적 도전을 유지했습니다. 혼동을 일으키는 각주 표지와 메타 각주는 삭제했습니다.
