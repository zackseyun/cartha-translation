  source_fidelity: 히브리어의 복수형 ‘신들’, 인간이 ‘자신을 위해 만든’ 신들, 수사적 청유/도전, 재난의 때, 그리고 성읍 수와 신들의 수가 같다는 진술을 모두 보존해야 합니다. 현 초안은 대체로 의미가 맞지만, ‘네가/있느냐/유다야/많다’가 목표인 현대 합쇼체와 맞지 않습니다.
