  terminology: אֱלֹהֶיךָ는 문맥상 우상을 가리키므로 ‘신들’로 유지했습니다. רָעָה는 도덕적 악이 아니라 재난적 곤경이므로 ‘환난’으로 옮겼습니다. ‘유다여’는 직접 호격을 보존합니다.
