id: JER.2.27
reference: Jeremiah 2:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹמְרִ֨ים לָ/עֵ֜ץ אָ֣בִ/י אַ֗תָּה וְ/לָ/אֶ֨בֶן֙ אַ֣תְּ ילדת/ני כִּֽי פָנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וּ/בְ/עֵ֤ת רָֽעָתָ/ם֙ יֹֽאמְר֔וּ ק֖וּמָ/ה וְ/הוֹשִׁיעֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/027.yaml
  text: They say to a tree[a], “You are my father,” and to a stone, “You gave birth to me.” For they have turned their back to me and not their face; but in the time of their trouble they say[c][b], “Rise up and save us!”
  footnotes:
  - marker: a
    text: Or “You bore me.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, “they have turned to me a back, and not a face,” an idiom for rejection.
    reason: lexical_alternative
  - marker: c
    text: Or “in the time of their calamity.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 나무에게 “당신은 내 아버지입니다”라고 하고, 돌에게는 “당신이 나를 낳았습니다”라고 합니다. 그들은 내게 등을 돌리고 얼굴은 돌리지 않았습니다. 그러나 그들이 환난을 당하는 때에는 “일어나 우리를 구원해 주십시오!”라고 말합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “나무”는 우상 재료를 가리키는 말입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 “내게 등을, 얼굴은 아니었다”는 뜻으로, 거절의 관용구입니다.
    reason: source_note
  - marker: c
    text: “환난”은 여기서 재앙이나 곤란의 때를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  english_pob_choice: They say
  chosen_korean: 라고 합니다
  alternatives_korean:
  - 라고 말합니다
  - 말합니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 지속적·서술적 성격을 한국어 현재 서술로 자연스럽게 살렸습니다.
- source_word: לָעֵץ / וְלָאֶבֶן
  english_pob_choice: to a tree / and to a stone
  chosen_korean: 나무에게 / 돌에게
  alternatives_korean:
  - 나무에 / 돌에
  - 목재에게 / 석재에게
  lexicon: HALOT
  rationale: 우상의 재료가 되는 구체적 사물을 그대로 살리되, 한국어에서는 호격적 방향어보다 여격이 더 자연스러워 “~에게”로 옮겼습니다.
- source_word: יְלַדְתִּנִי
  english_pob_choice: You gave birth to me
  chosen_korean: 나를 낳았습니다
  alternatives_korean:
  - 나를 낳아 주셨습니다
  - 나를 출산하셨습니다
  lexicon: HALOT
  rationale: 여성형 대상에게 ‘낳다’는 출생 행위를 직접 말하는 표현이 본문의 가족 은유와 가장 가깝습니다.
- source_word: פָּנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  english_pob_choice: they have turned their back to me and not their face
  chosen_korean: 내게 등을 돌리고 얼굴은 돌리지 않았습니다
  alternatives_korean:
  - 내게 등을 보였고 얼굴은 보이지 않았습니다
  - 내게 등을 향했고 얼굴은 향하지 않았습니다
  lexicon: HALOT
  rationale: 관용구의 의미인 거절·외면을 살리면서도 ‘등/얼굴’의 대조를 유지했습니다.
- source_word: וּבְעֵת רָעָתָם
  english_pob_choice: in the time of their trouble
  chosen_korean: 환난을 당하는 때에는
  alternatives_korean:
  - 재앙의 때에는
  - 재난을 당하는 때에는
  lexicon: HALOT
  rationale: רָעָה를 여기서는 도덕적 ‘악’보다 구원을 구하는 상황의 ‘환난/재난’으로 이해하는 편이 문맥에 맞습니다.
theological_decisions:
- issue: 우상에 대한 직접적 부자·출산 언어를 약화하지 않을지
  chosen_reading: 나무와 돌을 실제 아버지·출생의 근원처럼 부르는 우상숭배의 어리석음을 그대로 드러냈습니다.
  alternative_readings:
  - ‘우상을 섬긴다’로 의역
  - ‘나무와 돌을 신으로 여긴다’로 완화
  rationale: 본문은 단순한 종교 행위가 아니라 창조·출산의 언어를 우상에 돌리는 비난을 하고 있으므로, 그 충격을 보존해야 합니다.
  doctrine_reference: 예레미야 2장의 우상숭배 고발
- issue: ‘등을 돌리다/얼굴을 돌리지 않다’의 관용을 직역할지
  chosen_reading: 관용의 핵심 의미인 거절과 외면을 살리되, 본문 이미지인 등과 얼굴의 대조는 유지했습니다.
  alternative_readings:
  - 의미만 풀어 ‘나를 거절하고 외면했다’로 번역
  rationale: 히브리어의 표정/방향 대비가 예언적 책망의 힘을 이루므로, 완전한 평문화보다 이미지 보존이 낫습니다.
  doctrine_reference: 예언서 수사와 관용구 번역 원칙
