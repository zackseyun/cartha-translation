    rationale: 영어 POB의 a 각주는 יְלַדְתִּנִי의 대안 ‘You bore me’에 관한 것입니다. 현행 ‘나무는 우상 재료’라는 설명은 본문 번역에 필요하지 않은 해설이며, 대안 번역 각주로 교체하는 것이 주석 기능과 앵커를 더 정확히 맞춥니다.
