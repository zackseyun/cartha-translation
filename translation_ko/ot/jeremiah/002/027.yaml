revisions:
- from: 그들은 나무에게 “당신은 내 아버지입니다”라고 하고, 돌에게는 “당신이 나를 낳았습니다”라고 합니다. 그들은 내게 등을 돌리고 얼굴은 돌리지 않았습니다. 그러나 그들이 환난을 당하는 때에는 “일어나 우리를 구원해 주십시오!”라고 말합니다.[a][b][c]
  to: 그들은 나무에게 “당신은 내 아버지입니다”라고 하고, 돌에게는 “당신이 나를 낳았습니다”라고 합니다.[a] 그들은 내게는 등을 돌리고 얼굴은 향하지 않았습니다.[b] 그러나 그들이 환난을 당하는 때에는 “일어나 우리를 구원해 주십시오!”라고 말합니다.[c]
  rationale: 본문의 직접적인 부모·출산 언어와 우상에게 드리는 구원 요청은 유지했습니다. 다만 ‘등/얼굴’의 방향 대조를 현대 한국어에서 오해 없이 전달하도록 바로잡았고, 각주를 각각 ‘낳다’의 대안, 히브리어 관용구, רָעָה의 문맥상 대안에 맞추어 앵커와 내용을 정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:47Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘얼굴은 돌리지 않았습니다’는 한국어에서 ‘얼굴을 다른 쪽으로 돌리지 않았다’로도 읽혀, 히브리어의 ‘등은 내게 향하고 얼굴은 내게 향하지 않았다’라는 방향 대조를 충분히 드러내지 못합니다. ‘내게는 등을 돌리고 얼굴은 향하지 않았습니다’로 고치는 것이 안전합니다.
  naturalness: 나무와 돌을 향한 직접 화법 및 합쇼체는 자연스럽습니다. 다만 방향 대조 구절은 위와 같이 고치면 현대 한국어에서 더 명료하고 자연스럽습니다.
  terminology: ‘나무’, ‘돌’, ‘아버지’, ‘낳았습니다’, ‘구원해 주십시오’는 본문의 우상숭배 고발과 구원 요청의 어휘를 적절히 보존합니다. ‘환난’도 문맥상 가능한 표현입니다. 각주 a는 본문에 제시된 영어 감사 주석의 어휘 대안(‘나를 낳았다’)을 반영하지 않고 불필요한 해설을 더하므로, 해당 대안을 제시하도록 정정하는 편이 낫습니다.
  issues:
  - severity: medium
    issue: ‘얼굴은 돌리지 않았습니다’의 방향 관계가 불명확함
    rationale: 히브리어는 하나님께 등을 돌리고 얼굴은 돌리지 않았다는 대조입니다. 한국어 ‘얼굴을 돌리지 않다’는 얼굴의 회전 여부로 이해될 수 있으므로, ‘얼굴은 향하지 않았다’가 원문의 대조와 관용적 의미를 더 정확히 전달합니다.
  - severity: low
