id: JER.2.21
reference: Jeremiah 2:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ שֹׂרֵ֔ק כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת וְ/אֵיךְ֙ נֶהְפַּ֣כְתְּ לִ֔/י סוּרֵ֖י הַ/גֶּ֥פֶן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/021.yaml
  text: Yet I planted you as a choice vine[a], wholly of true seed[c][b]. How then have you turned for me into the degenerate shoots of a foreign vine?
  footnotes:
  - marker: a
    text: Or 'choice grapevine' for 'choice vine'; the Hebrew term denotes a select or noble vine.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of it genuine stock' for 'wholly of true seed.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew behind 'degenerate shoots' is difficult; alternatives include 'wild branches' or 'corrupt growth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 너를 좋은 포도나무, 곧 온전히 참된 종자로 심었습니다. 그런데 어찌하여 네가 내 앞에서 변하여 낯선 포도나무의 변질된 싹이 되었습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋은 포도나무’는 히브리어 שֹׂרֵק의 ‘선별된’ 또는 ‘귀한 포도나무’라는 뜻을 옮긴 것입니다. ‘선별된 포도나무’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온전히 참된 종자’는 ‘모두 진짜 종자’ 또는 ‘온통 순수한 종자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘변질된 싹’에 해당하는 히브리어 표현은 뜻이 어렵습니다. ‘야생 가지’, ‘벗어난 싹’, 또는 ‘타락한 새순’으로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ
  english_pob_choice: Yet I planted you
  chosen_korean: 그러나 나는 너를 심었습니다
  alternatives_korean:
  - 나는 너를 심었습니다
  - 그런데 나는 너를 심었습니다
  lexicon: HALOT
  rationale: 역접 וְ와 1인칭 완료형을 살려, 하나님의 행위와 뒤이은 책망의 대비를 분명히 드러냈습니다.
- source_word: שֹׂרֵ֔ק
  english_pob_choice: choice vine
  chosen_korean: 순한 포도나무
  alternatives_korean:
  - 좋은 포도나무
  - 선택된 포도나무
  - 귀한 포도나무
  lexicon: HALOT
  rationale: 선별된 귀한 포도나무라는 뜻을 살리되, 문맥상 자연스러운 한국어로 ‘순한’을 택해 품질과 선택성을 함께 드러냈습니다.
- source_word: כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת
  english_pob_choice: wholly of true seed
  chosen_korean: 온전히 참된 씨앗
  alternatives_korean:
  - 모두 참된 씨앗
  - 전부 진짜 씨앗
  - 온통 참된 종자
  lexicon: HALOT
  rationale: אֱמֶת을 도덕적 ‘진실함’보다 재배 재료의 ‘참됨/진짜 됨’으로 보고, 전체성은 ‘온전히’로 옮겼습니다.
- source_word: נֶהְפַּ֣כְתְּ לִ֔/י
  english_pob_choice: have you turned for me into
  chosen_korean: 내게 거슬러 변하여
  alternatives_korean:
  - 내게서 돌아서 변하여
  - 내게로부터 변하여
  - 내게 대하여 변하여
  lexicon: HALOT
  rationale: הפך의 변화/뒤바뀜을 ‘변하여’로 살리고, לִי의 관계적 뉘앙스는 ‘내게’로 유지하되 반항성은 문맥상 ‘거슬러’로 드러냈습니다.
- source_word: סוּרֵ֖י הַ/גֶּפֶ֥ן נָכְרִיָּֽה
  english_pob_choice: degenerate shoots of a foreign vine
  chosen_korean: 타국 포도나무의 일그러진 싹
  alternatives_korean:
  - 외국 포도나무의 타락한 싹
  - 낯선 포도나무의 삐뚤어진 가지
  - 이방 포도나무의 일그러진 새순
  lexicon: HALOT
  rationale: 난해한 סוּרֵי를 직설적으로 풀어 ‘일그러진 싹’으로 옮기고, נָכְרִיָּה는 소속의 이질성을 드러내는 ‘타국’으로 번역했습니다.
theological_decisions:
- issue: 포도나무 비유를 해석어로 풀지 않고 보존할지 여부
  chosen_reading: 심는 행위와 포도나무/싹 이미지를 그대로 유지해, 언약적 책망의 상징을 본문이 말하는 방식대로 드러냈습니다.
  alternative_readings:
  - 너를 순결한 백성으로 만들었다고 풀어 번역하기
  - 포도나무 이미지를 생략하고 도덕적 진술로 바꾸기
  rationale: 히브리어는 농업적 비유를 통해 하나님의 기대와 이스라엘의 변질을 대조하므로, 본문 이미지를 보존하는 편이 원문의 신학적 긴장을 더 정확히 전달합니다.
  doctrine_reference: 원문 우선, 비유 보존, 해석의 본문 내 제시
- issue: ‘내게 거슬러’의 반항성 강조
  chosen_reading: לִי를 단순한 방향 표시가 아니라 하나님과의 관계 속에서의 변질로 읽어, 반항성과 배반의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 단순히 ‘내게 변하여’로 중립화하기
  - ‘내 앞에서’로만 공간적으로 처리하기
  rationale: 문맥은 단순 변화가 아니라 심으신 분에 대한 배반을 질책하므로, 관계적 긴장을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 예언서의 언약적 고발 문맥
