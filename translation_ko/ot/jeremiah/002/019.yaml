id: JER.2.19
reference: Jeremiah 2:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּיַסְּרֵ֣/ךְ רָעָתֵ֗/ךְ וּ/מְשֻֽׁבוֹתַ֨יִ/ךְ֙ תּוֹכִחֻ֔/ךְ וּ/דְעִ֤י וּ/רְאִי֙ כִּי רַ֣ע וָ/מָ֔ר עָזְבֵ֖/ךְ אֶת יְהוָ֣ה אֱלֹהָ֑יִ/ךְ וְ/לֹ֤א פַחְדָּתִ/י֙ אֵלַ֔יִ/ךְ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/019.yaml
  text: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
  footnotes:
  - marker: a
    text: Or, 'your backslidings.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and there is no fear of me in you.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: cultural_note
translation:
  language: ko
  text: 당신의 악행이 당신을 징계할 것이며, 당신의 배교 행위들이[a] 당신을 꾸짖을 것입니다. 그러니 당신의 하나님 야훼[c]를 버리는 것이 악하고 쓰디쓴 일이며, 당신 안에 나를 경외함이 없다는 것을[b] 알고 깨달으십시오. 만군의 주 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 뒷걸음질들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신 안에 나에 대한 두려움이 없다는 것’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문에서 ‘야훼’로 옮긴 이름은 YHWH입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תְּיַסְּרֵךְ
  english_pob_choice: will discipline you
  chosen_korean: 징계할 것이며
  alternatives_korean:
  - 교정할 것이며
  - 훈계할 것이며
  - 벌할 것이며
  lexicon: HALOT
  rationale: יַסר의 교정·훈육적 뉘앙스를 살리되, 현대 한국어에서 책임성과 고통을 함께 담는 ‘징계하다’가 가장 균형 있습니다.
- source_word: מְשֻׁבוֹתַיִךְ
  english_pob_choice: your apostasies
  chosen_korean: 당신의 배교들이
  alternatives_korean:
  - 당신의 뒷걸음질들이
  - 당신의 돌아섬들이
  lexicon: HALOT
  rationale: 언약적 불신실함을 분명히 드러내기 위해 전통적 ‘backslidings’보다 신학적으로 직접적인 ‘배교’로 옮겼습니다.
- source_word: וְלֹא פַחְדָּתִי אֵלַיִךְ
  english_pob_choice: and that my fear is not in you
  chosen_korean: 그리고 당신 안에 나를 두려워함이 없다는 것을
  alternatives_korean:
  - 그리고 내 두려움이 당신 안에 없다는 것을
  - 그리고 당신 안에 나에 대한 경외가 없다는 것을
  lexicon: HALOT
  rationale: 히브리어의 명사구를 그대로 풀어 ‘나를 두려워함’으로 옮겨, 하나님에 대한 경외의 부재라는 본문 구조를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘my fear’의 구조를 직설적으로 살릴지, 더 관용적으로 풀지
  chosen_reading: ‘당신 안에 나를 두려워함이 없다는 것’으로 유지했습니다.
  alternative_readings:
  - ‘나를 두려워하지 않는다는 것’
  - ‘나에 대한 경외가 없다는 것’
  rationale: 원문은 동사보다 명사적 표현을 사용하므로, 관용화하더라도 경외의 부재가 하나님께 대한 관계적 진술임을 유지하는 편이 더 충실합니다.
  doctrine_reference: 원어 우선 원칙; 번역 전통보다 원문 구조 보존
- issue: ‘배교’의 신학적 강도를 유지할지
  chosen_reading: ‘배교들’로 유지했습니다.
  alternative_readings:
  - ‘뒷걸음질들’
  - ‘돌아섬들’
  rationale: 이 구절은 단순한 도덕적 흔들림이 아니라 야훼를 떠난 언약 파기를 고발하므로, 강한 표현이 문맥의 신학적 무게를 더 정확히 전달합니다.
  doctrine_reference: 언약 불성실성의 명시적 표지 보존
