revisions:
- from: 당신의 악이 당신을 징계할 것이며, 당신의 배교들이 당신을 꾸짖을 것입니다. 그러니 알고 보십시오. 야훼 당신의 하나님을 버리는 것이 당신에게 악하고 쓰디쓴 일임을, 그리고 당신 안에 나를 두려워함이 없다는 것을—주 만군의 하나님께서 말씀하십니다.[a][b][c]
  to: 당신의 악행이 당신을 징계할 것이며, 당신의 배교 행위들이[a] 당신을 꾸짖을 것입니다. 그러니 당신의 하나님 야훼[c]를 버리는 것이 악하고 쓰디쓴 일이며, 당신 안에 나를 경외함이 없다는 것을[b] 알고 깨달으십시오. 만군의 주 야훼께서 말씀하십니다.
  rationale: 원문의 병행 구조(악행/배교 행위, 징계/꾸짖음)를 유지하되 한국어의 자연스러운 명사 사용을 위해 ‘배교 행위들’로 조정했습니다. 두 명령형은 ‘알고 깨달으십시오’로 옮겼고, 하나님을 떠남의 악함·쓰라림 및 하나님 경외의 부재가 명령의 내용이 되도록 문장을 재구성했습니다. 결구는 ‘만군의 주 야훼’로 바로잡고, 신명 주석을 ‘야훼’에 앵커했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:53Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 결구의 אֲדֹנָי יְהוִה צְבָאוֹת는 ‘주 만군의 하나님’보다 ‘만군의 주 야훼’로 옮겨 아도나이, YHWH, צבאות의 구성을 보존하는 편이 적절합니다. 또한 YHWH 주석은 ‘the LORD’라는 영어 표기를 언급하지 말고 한국어 본문의 ‘야훼’에 직접 연결되어야 합니다.
  naturalness: ‘알고 보십시오’는 이 문맥에서 다소 부자연스럽고 ‘해 보다’의 뉘앙스를 낼 수 있습니다. ‘알고 깨달으십시오’가 두 명령형의 촉구를 자연스럽게 전달합니다. ‘배교들이’는 한국어에서 어색하므로 ‘배교 행위들이’로 다듬는 것이 안전합니다.
  terminology: ‘징계’, ‘배교’, ‘야훼’는 문맥과 프로젝트의 용어 선택에 부합합니다. פַּחְדָּתִי의 관계적 의미는 ‘나를 경외함’으로 자연스럽게 나타낼 수 있으며, 더 직역적인 대안은 주석으로 보존합니다.
  issues:
  - severity: medium
    issue: 신적 칭호의 구성과 신명 표기가 결구에서 불명확합니다.
    rationale: ‘주 만군의 하나님’은 אֲדֹנָי יְהוִה צְבָאוֹת의 구성 요소를 한국어에서 재배열하면서 YHWH의 고유명 번역 ‘야훼’를 드러내지 않습니다. ‘만군의 주 야훼’는 원문의 칭호와 프로젝트의 신명 정책을 함께 보존합니다.
