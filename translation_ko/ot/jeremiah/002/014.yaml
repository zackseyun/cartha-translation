translation:
  language: ko
  text: 이스라엘이 종입니까, 아니면 집안에서 태어난 종입니까? 그렇다면 어찌하여 그가 노략물이 되었습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘이 종입니까, 아니면 집안에서 태어난 사람입니까?’ 여기서 ‘집안에서 태어난 사람’은 주인의 집안에서 태어난 종을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그렇다면 어찌하여 그가 먹이가 되었습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֶבֶד
  english_pob_choice: a slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종입니다
  lexicon: HALOT
  rationale: 질문형 수사에서 신분의 종속성을 드러내는 말로서 ‘종’이 원문의 עֶבֶד를 직접적으로 옮기면서도 한국어 문맥에서 과도하게 현대적·법적 뉘앙스를 덧씌우지 않습니다. POB의 영어는 slave를 택했지만, 한국어에서는 본문 전체의 품격과 예언서 문체를 고려해 ‘종’으로 옮겼습니다.
- source_word: יְלִיד בַּיִת
  english_pob_choice: a homeborn servant
  chosen_korean: 집에서 난 사람
  alternatives_korean:
  - 집에서 난 종
  - 가문 안에서 난 사람
  - 가내 출생 종
  lexicon: HALOT
  rationale: 직역하면 ‘집/가문에서 태어난 사람’이라는 뜻이므로, 한국어에서는 뜻을 분명히 하면서도 자연스러운 ‘집에서 난 사람’으로 옮겼습니다. 여기서 핵심은 출생 배경이며, 종속 신분은 앞절의 עֶבֶד와의 병렬로 이미 드러납니다.
- source_word: מַדּוּעַ הָיָה לָבַז
  english_pob_choice: Why then has he become plunder?
  chosen_korean: 그런데 어찌하여 그가 노략물이 되었습니까?
  alternatives_korean:
  - 왜 그가 노략물이 되었습니까?
  - 그런데 어찌하여 그가 먹이가 되었습니까?
  lexicon: HALOT
  rationale: מַדּוּעַ는 단순한 ‘왜’보다 앞선 두 질문에서 이어지는 논리적 반전을 강조하므로 ‘그런데 어찌하여’로 풀었습니다. לָבַז는 약탈당한 상태를 가리키므로 ‘노략물’이 원문의 의미장에 가장 가깝습니다.
theological_decisions:
- issue: עֶבֶד의 사회적 긴장감 유지
  chosen_reading: 첫 절의 신분 표현을 ‘종’으로 옮겨, 이스라엘이 소유·예속 상태처럼 취급되는 수사적 충격을 살렸습니다.
  alternative_readings:
  - ‘시종’처럼 완화된 표현
  - ‘노예’로 더 강하게 옮김
  rationale: 예언자의 질문은 이스라엘의 굴욕적 전락을 고발하는 것이므로, 지나치게 완화된 표현은 본문의 압박감을 약화시킵니다. 반면 ‘노예’는 한국어에서 법적·근대적 연상을 강하게 불러와 예언서 문체에는 다소 과할 수 있어, 중간 강도의 ‘종’을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested bonded-status terminology by analogy
