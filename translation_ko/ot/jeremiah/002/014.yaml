revisions:
- from: 이스라엘이 종입니까, 아니면 집에서 난 사람입니까? 그런데 어찌하여 그가 노략물이 되었습니까?[a][b]
  to: 이스라엘이 종입니까, 아니면 집안에서 태어난 종입니까? 그렇다면 어찌하여 그가 노략물이 되었습니까?[a][b]
  rationale: ‘집에서 난 사람’을 ‘집안에서 태어난 종’으로 고쳐 יְלִיד בַּיִת가 지닌 주인 가정 내 출생과 예속 신분의 뜻을 본문에서 보존했습니다. 접속 표현은 앞선 수사 질문에서 따라 나오는 결론을 더 분명히 드러내도록 ‘그렇다면’으로 조정했습니다. 대안 번역 각주는 대안의 가능성을 유지하되, 그 사회적 의미를 설명하도록 보완했습니다.
