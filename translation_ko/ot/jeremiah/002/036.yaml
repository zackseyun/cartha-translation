id: JER.2.36
reference: Jeremiah 2:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה תֵּזְלִ֥י מְאֹ֖ד לְ/שַׁנּ֣וֹת אֶת דַּרְכֵּ֑/ךְ גַּ֤ם מִ/מִּצְרַ֨יִם֙ תֵּב֔וֹשִׁי כַּ/אֲשֶׁר בֹּ֖שְׁתְּ מֵ/אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/036.yaml
  text: Why do you go about so much[a], changing your way? You will also be put to shame by Egypt[b], as you were put to shame by Assyria.
  footnotes:
  - marker: a
    text: Or 'Why do you wander about so much to change your course?' The Hebrew expression may emphasize restless movement in pursuit of changing alliances.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will be ashamed of Egypt ... as you were ashamed of Assyria.' The verb can denote shame or disappointed reliance.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 그렇게도 분주히 다니며 네 길을 바꾸려 하느냐? 애굽 때문에도 수치를 당할 것이요—앗수르로 말미암아 수치를 당했던 것처럼.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그렇게도 분주히 다니며’는 히브리어의 반복적·불안정한 이동감을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수치를 당하다’는 히브리어 בושׁ의 결과적 굴욕과 실망을 함께 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 어찌하여
  - 무엇 때문에
  lexicon: HALOT
  rationale: 수사적 책망의 질문이므로 한국어에서도 가장 자연스러운 책망형 의문사인 ‘왜’를 썼습니다.
- source_word: תֵּזְלִי מְאֹד
  english_pob_choice: do you go about so much
  chosen_korean: 그렇게도 분주히 다니며
  alternatives_korean:
  - 그렇게도 떠돌며
  - 그렇게도 돌아다니며
  lexicon: HALOT
  rationale: 문맥의 불안정한 왕래와 동맹 추구를 살리되, 지나치게 직역적인 ‘wandering’보다 현대 한국어에서 같은 뉘앙스를 주는 ‘분주히 다니며’로 옮겼습니다.
- source_word: לְשַׁנּוֹת אֶת דַּרְכֵּךְ
  english_pob_choice: changing your way
  chosen_korean: 네 길을 바꾸려
  alternatives_korean:
  - 네 길을 고치려
  - 네 행로를 바꾸려
  lexicon: HALOT
  rationale: דרך의 폭넓은 의미를 살려 ‘길’로 두었고, 목적/변화를 나타내는 부정형을 한국어의 ‘-려’로 자연스럽게 표현했습니다.
- source_word: מִמִּצְרַיִם ... מֵאַשּׁוּר
  english_pob_choice: by Egypt ... as you were put to shame by Assyria
  chosen_korean: 애굽 때문에도 수치를 당할 것이요—앗수르로 말미암아 수치를 당했던 것처럼
  alternatives_korean:
  - 애굽으로도 수치를 당할 것이요—앗수르 때문에 수치를 당했던 것처럼
  - 애굽 때문에도 부끄러움을 당할 것이요—앗수르에게서 그랬던 것처럼
  lexicon: HALOT
  rationale: ב/מִן 계열 전치사는 여기서 원인·근거를 드러내므로 ‘때문에’와 ‘말미암아’를 문맥상 구분해 살렸습니다. ‘수치를 당하다’는 shame의 결과적·공적 굴욕을 보존합니다.
theological_decisions:
- issue: ‘your way’의 범위
  chosen_reading: ‘네 길’을 유지하여 정치적 동맹 추구와 삶의 방향이라는 두 층위를 함께 열어 둡니다.
  alternative_readings:
  - 네 정치 노선
  - 네 행실
  rationale: 예레미야 2장의 직접 문맥은 외교적 의존이지만, דרך는 그보다 넓게 삶의 방향과 행위를 포괄하므로 의미를 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
