  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여호와의 이름 יְהוָה를 사용합니다. 전통적으로는 영어에서 ‘the LORD’로 번역됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식인 ‘여호와의 말’보다 ‘말씀’이 한국어 성경에서 더 자연스럽고, 하나님의 계시가 담긴 권위 있는 발화를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 언약 이름 YHWH를 전통적 대체어가 아니라 음역 ‘야훼’로 옮겨, 원문의 고유한 신명 사용을 보존했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 앞에
  lexicon: HALOT
  rationale: 예언자에게 향한 직접 도달을 자연스럽게 나타내는 현대 한국어 표현으로 ‘내게’를 선택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하시며
  - 이르시며
  lexicon: HALOT
  rationale: 히브리어의 발화 도입 표지를 한국어에서 매끄럽게 살리기 위해, 뒤따를 직접인용을 예고하는 서술형으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: ‘야훼’로 직역하여 고유명을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 이 절은 예언 공식에서 신명 자체를 드러내므로, 표제어가 아닌 고유명으로 옮기는 것이 본문의 계시적·언약적 성격을 더 분명하게 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
