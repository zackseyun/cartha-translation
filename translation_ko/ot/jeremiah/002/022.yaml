source:
  edition: WLC
  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
  footnotes:
  - marker: a
    text: Or 'with lye' or 'with alkali'; 'natron' refers to a mineral cleansing agent.
    reason: lexical_alternative
  - marker: b
    text: Or 'use much alkali'; the Hebrew refers to an ancient washing substance, not necessarily modern soap.
    reason: lexical_alternative
  - marker: c
    text: Or 'your iniquity is marked before me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 네가 천연 소다[a]로 씻고 잿물[b]을 많이 써도, 네 죄악은 내 앞에 얼룩져 있습니다[c]—주 여호와의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천연 소다’는 고대의 세정 광물인 나트론(natron)을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잿물’은 본문의 bōrît, 곧 고대의 알칼리성 세정제를 풀어 옮긴 말이며 현대의 비누와 정확히 같지는 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네 죄악은 내 앞에 표시되어 있습니다.’
    reason: lexical_alternative
