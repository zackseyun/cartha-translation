id: JER.2.22
reference: Jeremiah 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
  footnotes:
  - marker: a
    text: Or 'with lye' or 'with alkali'; 'natron' refers to a mineral cleansing agent.
    reason: lexical_alternative
  - marker: b
    text: Or 'use much alkali'; the Hebrew refers to an ancient washing substance, not necessarily modern soap.
    reason: lexical_alternative
  - marker: c
    text: Or 'your iniquity is marked before me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 네가 질산나트륨으로 씻고 잿물[a]을 많이 써도, 네 죄악은 내 앞에 찍혀 있습니다[c][b]—주 여호와의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘질산나트륨’은 고대 세정 광물인 natron을 가리키는 설명적 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잿물’은 본문의 bōrît를 풀어 옮긴 것으로, 현대의 비누와는 정확히 같지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘찍혀 있습니다’는 ‘표시되어 있습니다/새겨져 있습니다’의 의미를 함께 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For though
  chosen_korean: 비록 … 해도
  alternatives_korean:
  - 설령 … 해도
  - 비록 … 할지라도
  lexicon: HALOT
  rationale: 가정적 세척 행위가 실제로 있더라도 결과가 달라지지 않는다는 역접·양보를 자연스럽게 살리기 위해 ‘비록 … 해도’를 택했습니다.
- source_word: תְּכַבְּסִי
  english_pob_choice: you wash
  chosen_korean: 씻고
  alternatives_korean:
  - 빨고
  - 정결하게 하고
  lexicon: HALOT
  rationale: 옷빨기보다 도덕적 정결을 향한 비유적 ‘씻기’가 핵심이므로, 과도하게 물건 중심으로 좁히지 않는 ‘씻다’를 썼습니다.
- source_word: בַּנֶּתֶר
  english_pob_choice: with natron
  chosen_korean: 질산나트륨으로
  alternatives_korean:
  - 나트륨 광물로
  - 천연 소다로
  lexicon: HALOT
  rationale: 원문이 가리키는 고대 세정 광물의 성격을 보존하되, 한국어에서 비교적 식별 가능한 전문어로 옮겼습니다.
- source_word: בֹּרִית
  english_pob_choice: use much lye
  chosen_korean: 잿물
  alternatives_korean:
  - 알칼리
  - 잿소다
  lexicon: HALOT
  rationale: 고대 세정제의 기능을 드러내는 한국어로 ‘잿물’이 가장 자연스럽고, ‘lye’의 강한 세정·부식성을 어느 정도 반영합니다.
- source_word: נִכְתָּם עֲוֺנֵךְ לְפָנַי
  english_pob_choice: your guilt is stained before me
  chosen_korean: 네 죄악은 내 앞에 찍혀 있습니다
  alternatives_korean:
  - 네 죄책은 내 앞에 새겨져 있습니다
  - 네 죄악은 내 앞에서 지워지지 않습니다
  lexicon: HALOT
  rationale: נִכְתָּם의 ‘찍히다/새겨지다’는 인장처럼 고정된 흔적의 뜻을 살리기 위해 ‘찍혀 있습니다’를 택했고, עָוֹן은 문맥상 행위보다 결과로 남는 ‘죄악’으로 옮겼습니다.
theological_decisions:
- issue: יהוה와 אֲדֹנָי יְהוִה의 호칭 처리
  chosen_reading: ‘주 여호와’로 표기하여 주권 호칭과 언약 이름을 함께 드러냈습니다.
  alternative_readings:
  - ‘주 야훼’
  - ‘주 하나님’
  rationale: 한국어 본문에서는 전통적 교회 용례와 직독성 사이의 균형을 고려해, 문맥상 주권 칭호인 ‘주’와 고유 신명 표지를 함께 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
