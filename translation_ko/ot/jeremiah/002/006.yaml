  edition: WLC
  text: וְ/לֹ֣א אָמְר֔וּ אַיֵּ֣ה יְהוָ֔ה הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַ/מּוֹלִ֨יךְ אֹתָ֜/נוּ בַּ/מִּדְבָּ֗ר בְּ/אֶ֨רֶץ עֲרָבָ֤ה וְ/שׁוּחָה֙ בְּ/אֶ֨רֶץ֙ צִיָּ֣ה וְ/צַלְמָ֔וֶת בְּ/אֶ֗רֶץ לֹֽא עָ֤בַר בָּ/הּ֙ אִ֔ישׁ וְ/לֹֽא יָשַׁ֥ב אָדָ֖ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/006.yaml
  text: They did not say[a], ‘Where is Yahweh, who brought us up from the land of Egypt, who led us through the wilderness, through a land of desert plain and pit, through a land of drought and deep darkness, through a land where no man passed through and no human dwelt?’
  footnotes:
  - marker: a
    text: Or 'shadow of death' for 'deep darkness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 「야훼께서 어디 계시냐? — 우리를 이집트 땅에서 올라오게 하시고, 광야를 지나 인도하시며, 사막 평지와 구덩이의 땅, 가뭄과 깊은 어둠의 땅, 사람이 지나간 적도 없고 사람이 거주한 적도 없는 땅을 통과하게 하신 분이 어디 계시냐?」라고 말하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사망의 그늘’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 영어 POB처럼 제목화하지 않고 음역해, 이스라엘에게 드러난 하나님의 개인적 이름을 보존했습니다.
- source_word: הַמַּעֲלֶה אֹתָנוּ מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: who brought us up from the land of Egypt
  chosen_korean: 우리를 이집트 땅에서 올라오게 하신
  alternatives_korean:
  - 우리를 이집트 땅에서 끌어올리신
  - 우리를 이집트 땅에서 나오게 하신
  lexicon: HALOT
  rationale: עלה의 사역형을 ‘올라오게 하다’로 옮겨 출애굽의 상승 이미지를 살리되, 한국어로 자연스럽게 들리도록 다듬었습니다.
- source_word: הַמּוֹלִיךְ אֹתָנוּ בַּמִּדְבָּר
  english_pob_choice: who led us through the wilderness
  chosen_korean: 광야를 지나 인도하시며
  alternatives_korean:
  - 광야를 통해 우리를 이끄시며
  - 광야에서 우리를 인도하시며
  lexicon: HALOT
  rationale: ‘인도하다’로 행위를 보존하고, 영어 POB의 ‘through’에 맞게 ‘지나’로 이동성과 통과의 뉘앙스를 살렸습니다.
- source_word: צַלְמָוֶת
  english_pob_choice: deep darkness
  chosen_korean: 깊은 어둠
  alternatives_korean:
  - 사망의 그늘
  - 죽음의 그늘
  - 짙은 어둠
  lexicon: HALOT
  rationale: 지형 묘사의 맥락상 죽음 이미지를 고정하기보다, 영어 POB와 같이 극심한 어둠을 뜻하는 표현으로 옮겼습니다. 전통적 ‘사망의 그늘’은 각주로 남길 수 있습니다.
theological_decisions:
- issue: 지명·지형 연쇄에서 원문의 위험한 광야 이미지 보존
  chosen_reading: 사막 평지와 구덩이의 땅, 가뭄과 깊은 어둠의 땅
  alternative_readings:
  - 아라바와 구덩이의 땅
  - 메마름과 깊은 어둠의 땅
  rationale: ערבה, שׁוּחָה, צִיָּה, צַלְמָוֶת의 연쇄는 단순한 풍경이 아니라 생존 불가능에 가까운 길을 강조합니다. 이를 완화하지 않고 한국어에서도 위험한 황무지의 감각이 드러나도록 했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
