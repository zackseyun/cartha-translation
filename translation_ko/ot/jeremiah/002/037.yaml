id: JER.2.37
reference: Jeremiah 2:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּ֣ם מֵ/אֵ֥ת זֶה֙ תֵּֽצְאִ֔י וְ/יָדַ֖יִ/ךְ עַל רֹאשֵׁ֑/ךְ כִּֽי מָאַ֤ס יְהֹוָה֙ בְּ/מִבְטַחַ֔יִ/ךְ וְ/לֹ֥א תַצְלִ֖יחִי לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
  footnotes:
  - marker: a
    text: Or 'from this'—the demonstrative likely refers to the foreign power just mentioned, namely Egypt.
    reason: alternative_reading
  - marker: b
    text: '''With your hands on your head'' is a gesture of grief, shame, or defeat.'
    reason: cultural_note
  - marker: c
    text: Or 'your trusted ones' or 'your objects of trust.' The Hebrew is literally 'your trusts/confidences.'
    reason: lexical_alternative
  - marker: d
    text: Or 'you will not succeed with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것에서도 나가게 될 것이며, 손을 머리 위에 얹게 될 것입니다[a]. 야훼께서 당신이 의지하는 것들을 거부하셨기 때문이며[c], 그것들로는 번영하지 못할 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 슬픔, 수치, 또는 패배를 나타내는 몸짓입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘당신의 신뢰들/의지들’이지만, 문맥상 당신이 의존하는 대상들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그것들로 말미암아 성공하지 못할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם מֵ/אֵת זֶה
  english_pob_choice: From this one too
  chosen_korean: 이것에서도
  alternatives_korean:
  - 이것으로부터도
  - 이것에서도 또한
  - 이것 하나에서도
  lexicon: HALOT
  rationale: גַּם의 ‘also/too’와 demonstrative זֶה의 지시성을 함께 살려, 바로 앞 맥락의 대상까지 포함되는 추가적·누적적 의미를 간결하게 옮겼습니다.
- source_word: וְיָדַיִךְ עַל רֹאשֵׁךְ
  english_pob_choice: with your hands on your head
  chosen_korean: 손을 머리 위에 얹게 될 것입니다
  alternatives_korean:
  - 손을 머리에 얹고 나가게 될 것입니다
  - 손을 머리 위에 둔 채 나가게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 몸짓 이미지를 유지하되, 한국어에서 자연스럽고 문어체로 읽히도록 정리했습니다.
- source_word: בְּמִבְטַחַיִךְ
  english_pob_choice: those in whom you trust
  chosen_korean: 당신이 의지하는 것들
  alternatives_korean:
  - 당신이 신뢰하는 것들
  - 당신의 의지처들
  - 당신이 믿는 대상들
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 신뢰들/의지들’이지만, 문맥상 정치적 동맹과 같은 의존 대상을 가리키므로 한국어에서는 대상성을 드러내는 표현을 택했습니다.
- source_word: תַצְלִיחִי לָהֶם
  english_pob_choice: you will not prosper through them
  chosen_korean: 그것들로는 번영하지 못할 것입니다
  alternatives_korean:
  - 그것들을 통해는 성공하지 못할 것입니다
  - 그것들로 말미암아 번성하지 못할 것입니다
  - 그것들로는 형통하지 못할 것입니다
  lexicon: HALOT
  rationale: הצליח의 ‘성공/번영’ 의미와, 전치사+대명사가 ‘그것들에 의해/그것들을 통해’라는 관계를 나타내는 점을 함께 반영했습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신명기는 고유한 신명으로 번역해 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 야훼가 무엇을 ‘거부하셨는가’의 대상
  chosen_reading: 당신이 의지하는 것들 자체를 야훼께서 거부하셨다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 당신이 의지하는 동맹국들을 야훼께서 거부하셨다는 뜻
  - 당신의 의지처들을 야훼께서 배척하셨다는 뜻
  rationale: 히브리어 복수형 מִבְטַחַיִךְ는 추상적 ‘신뢰’이면서도 실제 의존 대상들을 가리킬 수 있어, 문맥의 외교적 의미를 드러내되 해석을 과도하게 좁히지 않았습니다.
  doctrine_reference: 예레미야서의 우상적/정치적 의존 비판
- issue: ‘머리 위에 손’ 몸짓의 의미
  chosen_reading: 수치와 패배의 몸짓으로 이해되도록 살렸습니다.
  alternative_readings:
  - 슬픔의 몸짓
  - 포로/패배의 표지
  rationale: 영어 POB 주석이 지적하듯 이 관용구는 애도, 수치, 패배를 함께 포함하므로, 한국어에서도 의미를 하나로 고정하지 않고 몸짓 이미지 자체를 보존했습니다.
  doctrine_reference: 성경적 관용구의 문화적 번역
