  - 손을 머리 위에 둔 채 나가게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 몸짓 이미지를 유지하되, 한국어에서 자연스럽고 문어체로 읽히도록 정리했습니다.
- source_word: בְּמִבְטַחַיִךְ
  english_pob_choice: those in whom you trust
  chosen_korean: 당신이 의지하는 것들
  alternatives_korean:
