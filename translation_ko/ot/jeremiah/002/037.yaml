base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
  footnotes:
  - marker: a
    text: Or 'from this'—the demonstrative likely refers to the foreign power just mentioned, namely Egypt.
    reason: alternative_reading
  - marker: b
    text: '''With your hands on your head'' is a gesture of grief, shame, or defeat.'
    reason: cultural_note
  - marker: c
    text: Or 'your trusted ones' or 'your objects of trust.' The Hebrew is literally 'your trusts/confidences.'
    reason: lexical_alternative
  - marker: d
    text: Or 'you will not succeed with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것으로부터도 떠나게 될 것이며, 손을 머리에 얹은 채 떠나게 될 것입니다[a]. 야훼께서 당신이 의지하는 것들을 거부하셨기 때문이며[c], 당신은 그것들로는 성공하지 못할 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손을 머리에 얹은 채’는 슬픔, 수치, 또는 패배를 나타내는 몸짓입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘당신의 신뢰들/의지들’입니다. 문맥상 당신이 의존하는 대상들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그것들과 함께 성공하지 못할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם מֵ/אֵת זֶה
  english_pob_choice: From this one too
  chosen_korean: 이것에서도
  alternatives_korean:
