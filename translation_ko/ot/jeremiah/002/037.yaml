  lexicon: HALOT
  rationale: גַּם의 ‘also/too’와 demonstrative זֶה의 지시성을 함께 살려, 바로 앞 맥락의 대상까지 포함되는 추가적·누적적 의미를 간결하게 옮겼습니다.
