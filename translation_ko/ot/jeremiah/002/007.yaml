id: JER.2.7
reference: Jeremiah 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל אֶ֣רֶץ הַ/כַּרְמֶ֔ל לֶ/אֱכֹ֥ל פִּרְיָ֖/הּ וְ/טוּבָ֑/הּ וַ/תָּבֹ֨אוּ֙ וַ/תְּטַמְּא֣וּ אֶת אַרְצִ֔/י וְ/נַחֲלָתִ֥/י שַׂמְתֶּ֖ם לְ/תוֹעֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/007.yaml
  text: I brought you into a fertile land to eat its fruit and its goodness[a], but when you came in[b], you defiled my land and made my inheritance an abomination.
  footnotes:
  - marker: a
    text: Or 'a land of Carmel,' that is, a richly cultivated or fruitful land.
    reason: lexical_alternative
  - marker: b
    text: '''Its goodness'' may also be rendered ''its bounty'' or ''its good things.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 기름진 땅으로 데려가 그 열매와 그 좋은 것을 먹게 했습니다[a]. 그런데 너희가 들어와 내 땅을 더럽히고 내 기업을 역겨운 것으로 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈멜의 땅’, 곧 매우 잘 가꾸어진 비옥한 땅으로 번역할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאָבִיא
  english_pob_choice: I brought
  chosen_korean: 데려가
  alternatives_korean:
  - 데리고 왔습니다
  - 인도했습니다
  lexicon: HALOT
  rationale: 히필형의 ‘가져오다/데려오다’ 의미를 자연스럽게 살리되, 하나님의 주도적 행위를 분명히 드러내기 위해 ‘데려가’로 옮겼습니다.
- source_word: אֶרֶץ הַכַּרְמֶל
  english_pob_choice: a fertile land
  chosen_korean: 기름진 땅
  alternatives_korean:
  - 비옥한 땅
  - 풍요로운 땅
  - 가꾸어진 땅
  lexicon: HALOT
  rationale: 문맥상 고유명사 ‘갈멜’보다 ‘비옥한/기름진 땅’의 일반명사 뜻이 맞으므로, 한국어에서도 의미를 직접 드러내는 표현을 택했습니다.
- source_word: וְטוּבָהּ
  english_pob_choice: its goodness
  chosen_korean: 그 좋은 것
  alternatives_korean:
  - 그 풍성함
  - 그 복된 것
  - 그 선한 것
  lexicon: HALOT
  rationale: טוּב의 넓은 뜻을 한 단어로 고정하지 않고, POB의 ‘goodness’에 맞춰 한국어에서 ‘좋은 것’으로 옮겨 땅의 혜택과 풍성함을 함께 살렸습니다.
- source_word: וַתְּטַמְּאוּ
  english_pob_choice: you defiled
  chosen_korean: 더럽히고
  alternatives_korean:
  - 부정하게 하고
  - 속되게 하고
  - 오염시키고
  lexicon: HALOT
  rationale: טמא의 성소적·도덕적 무게를 유지하면서도 현대 한국어에서 자연스럽게 읽히는 동사로 옮겼습니다.
- source_word: נַחֲלָתִי
  english_pob_choice: my inheritance
  chosen_korean: 내 기업
  alternatives_korean:
  - 내 상속분
  - 내 소유
  - 내 유업
  lexicon: HALOT
  rationale: 성경 한국어에서 נחלה의 언약적 소유 의미를 가장 잘 드러내는 표현은 ‘기업’이므로, 하나님의 소유권과 상속적 뉘앙스를 함께 살렸습니다.
- source_word: שַׂמְתֶּם לְתוֹעֵבָה
  english_pob_choice: made ... an abomination
  chosen_korean: 역겨운 것으로 만들었습니다
  alternatives_korean:
  - 가증한 것으로 만들었습니다
  - 혐오스러운 것으로 만들었습니다
  - 가증스럽게 여겨지게 했습니다
  lexicon: HALOT
  rationale: תוֹעֵבָה의 강한 혐오·가증의 의미를 유지하되, 현대 독자가 의미를 즉시 파악할 수 있도록 ‘역겨운 것’으로 풀어 썼습니다.
theological_decisions:
- issue: אֶרֶץ הַכַּרְמֶל의 의미
  chosen_reading: 지리명 갈멜이 아니라 ‘기름진 땅’이라는 일반명사적 의미로 이해했습니다.
  alternative_readings:
  - ‘갈멜의 땅’
  - ‘갈멜 땅’
  rationale: 앞뒤 문맥이 열매와 좋은 것을 먹는 풍요의 묘사이므로, 지명보다 땅의 성격을 가리키는 해석이 더 분명합니다.
  doctrine_reference: 창조와 언약의 선물로서의 땅
- issue: טוּב의 범위
  chosen_reading: ‘좋은 것’으로 두어 단순한 농산물보다 더 넓은 선물성과 풍성함을 남겼습니다.
  alternative_readings:
  - ‘풍요’
  - ‘좋음’
  - ‘선한 것들’
  rationale: 히브리어 טוּב는 산물 이상의 넓은 의미를 가질 수 있으므로, 본문의 감사와 배반의 대조가 살아나도록 의미 폭을 보존했습니다.
  doctrine_reference: 하나님의 선한 공급과 인간의 배반
