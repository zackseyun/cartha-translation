  rationale: 히브리어 관용구인 ‘YHWH의 말씀’을 그대로 살려 ‘말씀’으로 옮기고, 신명기는 관례에 따라 ‘야훼’로 옮겨 개인적 언약 নাম을 보존했습니다.
- source_word: מִשְׁפְּחוֹת
  english_pob_choice: the clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 가족들
  - 지파들
  lexicon: HALOT
  rationale: 이 단어는 혈연 기반의 하위 집단을 가리키므로, 한국어에서 너무 좁은 ‘가족’보다 사회단위의 의미를 드러내는 ‘씨족’이 더 가깝습니다.
- source_word: בֵּית יַעֲקֹב / בֵּית יִשְׂרָאֵל
