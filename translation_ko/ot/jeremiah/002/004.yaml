  chosen_korean: 야곱의 집 / 이스라엘 집
  alternatives_korean:
  - 야곱 집안 / 이스라엘 집안
  - 야곱 족속 / 이스라엘 족속
  lexicon: HALOT
  rationale: 두 표현의 병렬성과 언약 공동체를 유지하기 위해 직역형인 ‘집’을 보존했습니다. ‘집’은 공동체 전체를 가리키는 성서적 용법을 한국어에서도 드러냅니다.
