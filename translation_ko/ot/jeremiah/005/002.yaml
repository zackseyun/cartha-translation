base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/002.yaml
  text: And if they say, “As the LORD lives,” even so they swear falsely.
translation:
  language: ko
  text: 그리고 그들이 “야훼께서 살아 계십니다”라고 말해도, 그들은 그래도 거짓으로 맹세합니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 לָכֵן은 여기서 단순한 ‘그러므로’보다 앞말과 어긋나는 실제 결과를 드러내는 역접적 뉘앙스가 강해 ‘그래도’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה / the LORD
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 히브리어 מקור이 하나님의 고유명사이므로, POB 기본 원칙에 따라 전통적 경칭 대신 학술적 음역인 ‘야훼’를 본문에 반영했습니다.
- source_word: לַשֶּׁקֶר
  english_pob_choice: falsely
  chosen_korean: 거짓으로
  alternatives_korean:
  - 헛되이
  - 속여서
  lexicon: שׁקר
  rationale: 부사적으로 ‘거짓으로 맹세하다’의 뜻을 살려, 맹세 행위의 진실성 결핍을 직접적으로 드러냈습니다.
- source_word: לָכֵן
  english_pob_choice: even so
  chosen_korean: 그래도
  alternatives_korean:
  - 그리하여
  - 그러므로
  lexicon: לכן
  rationale: 단순 인과가 아니라 앞의 말과 무관하게 실제 행위가 거짓임을 강조하는 역접적 뉘앙스를 살리기 위해 ‘그래도’를 택했습니다.
- source_word: יֹאמֵרוּ / יִשָּׁבֵעוּ
  english_pob_choice: say / swear
  chosen_korean: 말해도 / 맹세합니다
  alternatives_korean:
  - 말하더라도 / 서약합니다
  - 말한다고 해도 / 맹세합니다
  lexicon: אמר / שבע
  rationale: 선언과 맹세의 두 동사를 분명히 구분해, 겉말과 실제 행위의 불일치를 선명하게 보여 주었습니다.
theological_decisions:
- issue: 야훼의 살아 계심을 두고 하는 맹세의 도덕적 반전
  chosen_reading: ‘야훼께서 살아 계십니다’라는 진술 자체는 참된 경외의 공식이지만, 여기서는 악한 백성이 그 이름을 입에 올리면서도 거짓 맹세를 일삼는다는 점을 드러내는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 일반적 거짓말 진술로 약화하는 읽기
  - 맹세의 형식 자체를 중립적으로 처리하는 읽기
  rationale: 본문은 야훼의 이름을 부르는 종교적 언어가 실제 윤리와 단절될 수 있음을 고발하므로, 그 긴장을 흐리지 않도록 직역에 가깝게 유지했습니다.
  doctrine_reference: 언약적 신실함과 맹세의 거룩함
