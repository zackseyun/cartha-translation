base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/024.yaml
  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
  footnotes:
  - marker: a
    text: Or “the autumn rain and the spring rain.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 마음속으로 말하지 않았습니다. 「이제 야훼 우리 하나님을 경외하자. 그는 계절에 맞게 비를 주시며, 이른 비와 늦은 비를 주시고, 추수의 정해진 주간들을 우리를 위해 지키시는 분입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가을 비와 봄 비”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  english_pob_choice: They did not say
  chosen_korean: 그들은 ... 말하지 않았습니다
  alternatives_korean:
  - 그리고 그들은 ... 말하지 않았습니다
  - 그들은 ... 말하지 않았습니다
  lexicon: WLC; HALOT
  rationale: 부정과 동사의 단순 서술을 자연스러운 현대 한국어로 옮기되, 원문의 비난조를 유지했습니다.
- source_word: בִלְבָבָם
  english_pob_choice: in their heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 그들의 마음 안에
  - 마음에
  lexicon: HALOT
  rationale: 히브리어 단수 ‘마음’의 집합적 관용을 살리면서도 한국어에서 더 자연스러운 내면적 자문 표현으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 여호와 우리 하나님
  - 주 우리 하나님
  lexicon: DOCTRINE.md contested terms; WLC
  rationale: 본문의 신명기적 언약명은 프로젝트 기본값에 따라 야훼로 옮기고, 소유격 관계는 한국어 어순에 맞게 압축했습니다.
- source_word: הַנֹּתֵן גֶּשֶׁם בְּעִתּוֹ
  english_pob_choice: who gives rain in its season
  chosen_korean: 그는 계절에 맞게 비를 주시며
  alternatives_korean:
  - 때에 맞게 비를 주시며
  - 비를 제때 주시는 분
  lexicon: HALOT
  rationale: 분사 구조를 설명절로 풀어 주되, 'in its season'은 비를 수식하도록 배치하여 원문의 의미 관계를 보존했습니다.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  english_pob_choice: the early rain and the latter rain
  chosen_korean: 이른 비와 늦은 비
  alternatives_korean:
  - 초기 비와 후기 비
  - 가을 비와 봄 비
  lexicon: HALOT
  rationale: 농경 문맥의 표준적 대응을 따라 두 단계의 계절비를 대칭적으로 살렸습니다.
- source_word: שְׁבֻעוֹת חֻקּוֹת קָצִיר
  english_pob_choice: the appointed weeks of the harvest
  chosen_korean: 추수의 정해진 주간들
  alternatives_korean:
  - 추수의 정해진 주들
  - 수확을 위해 정해진 주간들
  lexicon: HALOT
  rationale: ‘주간들’은 주기적 단위를 드러내며, ‘정해진’은 חֻקּוֹת의 규정된 성격을 반영합니다.
- source_word: יִשְׁמָר לָנוּ
  english_pob_choice: who keeps for us
  chosen_korean: 우리를 위해 지키시는 분
  alternatives_korean:
  - 우리를 위해 보존하시는 분
  - 우리에게 지키시는 분
  lexicon: HALOT
  rationale: שׁמר의 보존·유지 의미를 살리면서, 앞의 설명절 전체를 가리키는 자연스러운 한국어로 처리했습니다.
