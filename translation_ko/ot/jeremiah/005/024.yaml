  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
  footnotes:
  - marker: a
    text: Or “the autumn rain and the spring rain.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 마음속으로 이렇게 말하지 않았습니다. “이제 우리 하나님 야훼를 경외합시다. 그분은 제철에 비, 곧 이른 비와 늦은 비[a]를 주시고, 추수를 위해 정해진 주간들을 우리를 위하여 지켜 주시는 분입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가을 비와 봄 비”로도 옮길 수 있습니다.
    reason: lexical_alternative
