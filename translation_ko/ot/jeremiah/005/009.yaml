id: JER.5.9
reference: Jeremiah 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לוֹא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה וְ/אִם֙ בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/009.yaml
  text: Shall I not punish for these things? declares Yahweh[a]. And on a nation such as this[b], shall I not avenge myself?
  footnotes:
  - marker: a
    text: Or, 'And if on a nation such as this, shall my soul not take vengeance?' The Hebrew conjunction can be rendered more literally as 'and if,' though here it introduces a second rhetorical question.
    reason: lexical_alternative
  - marker: b
    text: '''My soul'' is a Hebrew way of referring to the LORD himself in vivid, personal terms.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 이 일들 때문에 벌하지 않겠느냐? 야훼의 말씀입니다. 이와 같은 민족에게[a] 내가[b] 어찌 보복하지 않겠느냐?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 만일 이와 같은 민족에게, 내 혼이 보복하지 않겠느냐?” 히브리어 접속사는 더 문자적으로 “그리고 만일”로 옮길 수 있으나, 여기서는 두 번째 반문을 이끕니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘내 혼’은 여기서 야훼 자신을 가리키는 생생하고 인격적인 자기지시입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֶפְקֹד
  english_pob_choice: punish
  chosen_korean: 벌하지
  alternatives_korean:
  - 심판하지
  - 징계하지
  - 책임을 묻지
  lexicon: HALOT
  rationale: 판결·징벌의 문맥이므로 ‘벌하다’가 가장 직접적으로 심판의 뜻을 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼의 말씀이니라
  - 야훼께서 선언하십니다
  - 주께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 공식문을 현대 한국어로 자연스럽게 옮기면서, 신명은 프로젝트 기본값대로 ‘야훼’로 유지했습니다.
- source_word: תִתְנַקֵּם
  english_pob_choice: avenge myself
  chosen_korean: 보복하지
  alternatives_korean:
  - 원수 갚지
  - 원한을 풀지
  - 갚아 주지
  lexicon: HALOT
  rationale: 히트파엘의 자기-지시적 보복 의미를 살리되, 한국어에서는 ‘보복하다’가 가장 가까운 법정·징벌적 뉘앙스를 전달합니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내가
  alternatives_korean:
  - 내 혼이
  - 내 생명이
  - 내 자신이
  lexicon: HALOT
  rationale: 히브리어의 ‘내 혼/내 생명’은 하나님 자신을 가리키는 관용적 자기지시이므로, 본문에는 자연스러운 1인칭으로 옮기고 그 함의는 주석적 설명으로 보완하는 편이 한국어 독자에게 더 명료합니다.
theological_decisions:
- issue: נַפְשִׁי의 인격화된 자기지시를 어떻게 드러낼 것인가
  chosen_reading: 본문에서는 ‘내가’로 자연화하되, 신적 자기지시라는 원문 의미는 보존합니다.
  alternative_readings:
  - ‘내 혼이’로 직역
  - ‘내 자신이’로 해설적 번역
  rationale: 한국어 ‘혼’은 현대 독자에게 오해를 일으키기 쉬우므로, 합쇼체 본문은 문맥상 동일한 발화 주체를 분명히 드러내는 ‘내가’가 더 적절합니다. 다만 원문의 인격화 표현 자체는 주해상 중요하므로 별도 주석으로 보완합니다.
  doctrine_reference: 'Translation philosophy: source 의미 보존과 자연스러운 한국어의 균형'
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신명은 음역형 ‘야훼’로 유지하여 고유성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
