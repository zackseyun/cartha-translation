id: JER.5.16
reference: Jeremiah 5:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַשְׁפָּת֖/וֹ כְּ/קֶ֣בֶר פָּת֑וּחַ כֻּלָּ֖/ם גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/016.yaml
  text: Their quiver is like an open grave[b][a]; all of them are mighty men.
  footnotes:
  - marker: a
    text: Or 'his quiver,' taking the singular suffix more strictly; the Hebrew uses a singular suffix with a collective referent.
    reason: lexical_alternative
  - marker: b
    text: Or 'all of them are warriors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 화살통은 열린 무덤과 같습니다. 그들은 모두 용사들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 화살통’으로도 옮길 수 있습니다. 히브리어는 형태상 단수 소유 접미사를 사용하지만, 문맥상 집합적 의미로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘용사들’로 옮길 수 있습니다. 히브리어 גִּבּוֹרִים은 강한 전사들을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁפָּתוֹ
  english_pob_choice: their quiver
  chosen_korean: 그들의 화살통
  alternatives_korean:
  - 그의 화살통
  - 그들의 화살집
  lexicon: HALOT
  rationale: 히브리어 형태는 단수 소유 접미사처럼 보이지만, 문맥상 침입자 무리를 집합적으로 가리키므로 한국어에서는 복수 의미를 드러내는 ‘그들의’가 자연스럽습니다. ‘화살통’은 무기 용례를 가장 직접적으로 살립니다.
- source_word: כְּקֶבֶר פָּתוּחַ
  english_pob_choice: is like an open grave
  chosen_korean: 열린 무덤과 같습니다
  alternatives_korean:
  - 열린 묘지와 같습니다
  - 열려 있는 무덤과 같습니다
  lexicon: HALOT
  rationale: 비유 표지를 ‘-과 같습니다’로 살려 비교 구조를 분명히 했고, קבר는 문맥상 ‘무덤’이 가장 직관적입니다. פָּתוּחַ는 상태를 나타내므로 ‘열린’이 자연스럽습니다.
- source_word: גִּבּוֹרִים
  english_pob_choice: mighty men
  chosen_korean: 용사들
  alternatives_korean:
  - 전사들
  - 힘센 사람들
  lexicon: HALOT
  rationale: גִּבּוֹרִים은 전투 능력이 있는 강한 पुरुष/전사들을 가리키므로, 한국어에서는 성별을 보존하기보다 군사적 의미가 분명한 ‘용사들’이 가장 간결합니다. ‘전사들’도 가능하지만 다소 더 해설적입니다.
theological_decisions:
- issue: 전투적 멸망의 이미지 유지
  chosen_reading: 무덤과 같은 화살통과 전면적 전투력을 한 문장 안에 함께 살려, 포학한 침입의 위협을 강하게 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘위험한 무기’ 정도로 약화할 수 있음
  - ‘무덤’ 이미지를 ‘묘’로 순화할 수 있음
  rationale: 본문의 수사적 충격은 단순 정보 전달이 아니라 심판의 공포를 체감하게 하는 데 있으므로, 비유의 날카로움을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: Jeremiah 5:16의 심판 경고 수사
