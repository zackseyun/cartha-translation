id: JER.5.8
reference: Jeremiah 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סוּסִ֥ים מְיֻזָּנִ֖ים מַשְׁכִּ֣ים הָי֑וּ אִ֛ישׁ אֶל אֵ֥שֶׁת רֵעֵ֖/הוּ יִצְהָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/008.yaml
  text: They were well-fed[a], lusty stallions; each one neighing after his neighbor’s wife.
  footnotes:
  - marker: a
    text: Or possibly 'horses, well-fed and rising early'; the Hebrew term translated 'lusty' is difficult and may carry the sense of eager early roaming.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 잘 먹여져 욕정에 찬 수말들이었습니다[a]. 저마다 자기 이웃의 아내를 향해 울어댔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잘 먹여진 말들, 이른 아침에 돌아다니는 말들.’ ‘욕정에 찬’으로 옮긴 히브리어 표현은 해석하기 어려우며, 이른 아침에 일어나거나 돌아다닌다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּסִים
  english_pob_choice: stallions
  chosen_korean: 수말들
  alternatives_korean:
  - 말들
  - 거세마들
  lexicon: HALOT
  rationale: 문맥이 성적으로 비유된 장면이므로 단순한 ‘말들’보다 수컷 말의 이미지를 살리는 ‘수말들’이 원문과 영어 POB의 의도를 더 잘 드러냅니다.
- source_word: מְיֻזָּנִים
  english_pob_choice: well-fed
  chosen_korean: 살이 찐
  alternatives_korean:
  - 잘 먹인
  - 잘 먹은
  - 잘 자란
  lexicon: HALOT
  rationale: 동물의 기름지고 윤기 나는 상태를 나타내므로, 한국어에서는 ‘살이 찐’이 자연스럽고 시각적 대비도 잘 살립니다.
- source_word: מַשְׁכִּים
  english_pob_choice: lusty
  chosen_korean: 울어댔습니다
  alternatives_korean:
  - 이른 아침에 돌아다녔습니다
  - 일찍 일어났습니다
  - 갈망했습니다
  lexicon: HALOT
  rationale: 이 형태는 해석이 어려워 ‘이른 아침에’ 쪽 의미 가능성이 있으나, 본절의 전체 비유는 성적 탐닉의 격렬함을 말하므로 동물 울음의 표현을 앞세워 한국어로 강하게 옮겼습니다.
- source_word: יִצְהָלוּ
  english_pob_choice: neighing
  chosen_korean: 울어댔습니다
  alternatives_korean:
  - 히히댔습니다
  - 울었습니다
  - 히힝거렸습니다
  lexicon: HALOT
  rationale: 말의 울음소리를 한국어로는 ‘울어대다’가 가장 자연스럽고, 반복적·욕망적 뉘앙스도 유지됩니다.
theological_decisions:
- issue: 비유의 성적 긴장과 직설성 유지
  chosen_reading: 본문의 동물 비유를 완곡하게 줄이지 않고, ‘수말들’과 ‘이웃의 아내를 향해 울어댔습니다’로 성적 추구의 노골성을 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘말들’로 중화하는 번역
  - ‘갈망했습니다’처럼 추상화하는 번역
  rationale: 예레미야 5:8은 이스라엘의 음행을 폭로하는 예언적 조롱이므로, 비유의 불편한 힘을 약화시키지 않는 것이 원문 의도에 부합합니다.
  doctrine_reference: 예언서의 우상숭배/음행 고발 문맥
- issue: מַשְׁכִּים의 난해성 처리
  chosen_reading: 본문에는 동물의 울음과 추격 이미지를 살리고, 해석상 불확실한 ‘이른 일찍 일어남’ 가능성은 각주로 남겼습니다.
  alternative_readings:
  - ‘아침 일찍 돌아다니는’ 의미를 본문에 반영
  - 문장 전체를 ‘기름진 말들, 이른 아침에 떠도는…’으로 직역
  rationale: 히브리어 형태가 난해하여 단정적 번역은 위험하므로, 본문은 문맥상 분명한 성적 비유를 우선하고 대안은 각주로 투명하게 보존했습니다.
  doctrine_reference: 본문 비평/해석 투명성 원칙
