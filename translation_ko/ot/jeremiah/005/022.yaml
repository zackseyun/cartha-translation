source:
  edition: WLC
  text: הַ/אוֹתִ֨/י לֹא תִירָ֜אוּ נְאֻם יְהֹוָ֗ה אִ֤ם מִ/פָּנַ/י֙ לֹ֣א תָחִ֔ילוּ אֲשֶׁר שַׂ֤מְתִּי חוֹל֙ גְּב֣וּל לַ/יָּ֔ם חָק עוֹלָ֖ם וְ/לֹ֣א יַעַבְרֶ֑/נְהוּ וַ/יִּֽתְגָּעֲשׁוּ֙ וְ/לֹ֣א יוּכָ֔לוּ וְ/הָמ֥וּ גַלָּ֖י/ו וְ/לֹ֥א יַעַבְרֻֽ/נְהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/022.yaml
  text: Do you not fear me? declares Yahweh[a]. Do you not tremble before me, he who set the sand as a boundary for the sea, an everlasting decree that it cannot cross? Though its waves toss, they cannot prevail; though they roar[b], they cannot cross it.
  footnotes:
  - marker: a
    text: Or, 'I who set the sand as a boundary for the sea.' The Hebrew relative clause can be rendered more directly in the first person.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Though they rage, they cannot prevail.' The Hebrew verb can emphasize surging or raging.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 두려워하지 않겠느냐? 여호와의 말씀이니라. 내 앞에서 떨지 않겠느냐? 내가 바다의 경계를 위한 모래를 세우고, 그것이 넘지 못하게 한 영원한 규례를 정하였노라. 비록 그 물결이 요동해도 이기지 못하고, 비록 그것들이 소리쳐도 그것을 넘지 못하느니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내가 너를 두려워하지 않겠느냐?’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘소리치다’보다 ‘요동하다/거세게 일다’의 뜻을 더 강하게 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאוֹתִי / תִירָאוּ
  english_pob_choice: Do you not fear me?
  chosen_korean: 내가 너를 두려워하지 않겠느냐?
  alternatives_korean:
  - 너희가 나를 두려워하지 않겠느냐?
  - 나를 두려워하지 않겠느냐?
  lexicon: HALOT
  rationale: 수사 의문형의 책망을 자연스러운 한국어로 살리되, אָנ/אֹתִי의 직접 목적어가 드러나도록 ‘나를 두려워하다’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀이니라
  alternatives_korean:
  - 야훼의 말씀이다
  - 여호와께서 말씀하신다
  lexicon: HALOT
  rationale: 예레미야의 예언 공식을 한국어 성경에서 널리 쓰는 선언형으로 옮겼습니다. 본문에는 기존 교회 용례를 따르되, 아래 신학 결정을 통해 YHWH 표기 문제를 설명합니다.
- source_word: אִם מִפָּנַי לֹא תָחִילוּ
  english_pob_choice: Do you not tremble before me
  chosen_korean: 내 앞에서 떨지 않겠느냐?
  alternatives_korean:
  - 내 앞에서 몸서리치지 않겠느냐?
  - 내 앞에서 진동하지 않겠느냐?
  lexicon: HALOT
  rationale: חיל의 ‘떨다/몸서리치다’ 의미를 살리면서, 예언적 책망의 긴박한 톤에 맞는 간결한 표현으로 다듬었습니다.
- source_word: חָק עוֹלָם
  english_pob_choice: an everlasting decree
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영원한 법령
  - 영구한 규정
  lexicon: HALOT
  rationale: 자연물의 경계를 정하시는 하나님의 확정된 명령을 ‘규례’로 옮겨, 법적이면서도 성경적인 어감을 유지했습니다.
- source_word: וְלֹא יַעַבְרֶנְהוּ / וְלֹא יַעַבְרֻנְהוּ
  english_pob_choice: that it cannot cross / they cannot cross it
  chosen_korean: 그것이 넘지 못하게 / 그것을 넘지 못하느니라
  alternatives_korean:
  - 그것을 건너지 못하게 / 그것을 건너지 못하느니라
  - 그것을 지나지 못하게 / 그것을 지나지 못하느니라
  lexicon: HALOT
  rationale: 반복되는 עבר의 핵심 이미지를 ‘넘다’로 통일해, 경계선을 넘어서는 불가능성을 직관적으로 드러냈습니다.
theological_decisions:
- issue: YHWH의 한국어 표기와 인용문 내 어조
  chosen_reading: 본문은 전통적 한국어 예언문 어조를 따라 ‘여호와’로 두되, 직접 화자의 선언과 책망을 합쇼체로 유지했습니다.
  alternative_readings:
  - 야훼로 직역하여 개인명 강조
  - ‘주님’으로 일반화
  rationale: 이 절은 창조주가 바다를 제어하시는 권위를 강조하는 예언적 책망입니다. 한국어 출판 가독성과 POB의 기존 영문 감사자료를 함께 고려하면, 본문 어조는 합쇼체를 유지하면서 신명 표기는 전통 독자 친화적으로 처리하는 것이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
