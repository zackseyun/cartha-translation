id: JER.5.28
reference: Jeremiah 5:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמְנ֣וּ עָשְׁת֗וּ גַּ֚ם עָֽבְר֣וּ דִבְרֵי רָ֔ע דִּ֣ין לֹא דָ֔נוּ דִּ֥ין יָת֖וֹם וְ/יַצְלִ֑יחוּ וּ/מִשְׁפַּ֥ט אֶבְיוֹנִ֖ים לֹ֥א שָׁפָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/028.yaml
  text: They have grown fat[a]; they are sleek. They also have gone beyond evil words. They do not judge with justice the case of the fatherless, so that they might prosper[c][b], and they do not uphold the justice of the poor.
  footnotes:
  - marker: a
    text: Or 'They have even surpassed evil matters/deeds'; Hebrew literally, 'they have gone beyond words of evil.'
    reason: lexical_alternative
  - marker: b
    text: The clause 'so that they might prosper' is difficult. It may also be understood as 'yet they prosper' or 'though they prosper.'
    reason: alternative_reading
  - marker: c
    text: '''Fatherless'' may also be rendered ''orphan.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 살이 찌고 윤택해졌습니다. 그들은 악한 일을 하는 데 도를 넘었습니다. 그들은 고아의 송사를 판결하지 않으면서도 형통하며, 가난한 이들의 권리를 공정하게 판결하지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 악한 말들을 넘어섰다’로 직역할 수 있습니다. 히브리어 ‘악의 말들’은 여기서 악한 일이나 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형통하며’에 해당하는 구절은 난해합니다. ‘고아가 형통하도록’ 또는 ‘그런데도 그들은 형통한다’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘고아’는 문자적으로 ‘아버지 없는 자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְנוּ עָשְׁתוּ
  english_pob_choice: have grown fat; are sleek
  chosen_korean: 살이 쪘고, 번들거립니다
  alternatives_korean:
  - 살이 쪘고, 윤이 납니다
  - 살이 쪘고, 매끈합니다
  lexicon: HALOT
  rationale: 두 동사는 부유하고 자기만족적인 외양을 묘사하는 병렬 표현이므로, 구체적 이미지를 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: דִבְרֵי רָע
  english_pob_choice: evil words
  chosen_korean: 악한 말들
  alternatives_korean:
  - 악한 일들
  - 악한 것들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘악의 말들’이지만, POB의 본문 선택을 따라 ‘말들’의 형태를 유지하되 한국어에서는 복수성과 부정성을 드러내기 위해 ‘악한 말들’로 옮겼습니다.
- source_word: דִּין לֹא דָנוּ דִּין יָתוֹם
  english_pob_choice: they do not judge with justice the case of the fatherless
  chosen_korean: 아버지 없는 자의 소송을 정의롭게 판결하지
  alternatives_korean:
  - 고아의 소송을 정의롭게 판결하지
  - 아버지 없는 자의 사건을 바르게 판결하지
  lexicon: HALOT
  rationale: דין의 법정적 의미를 살려 ‘소송’과 ‘판결하다’로 옮겼고, יָתוֹם은 관용적으로 ‘아버지 없는 자’로 번역해 본문의 법적·사회적 긴장을 보존했습니다.
- source_word: וְיַצְלִיחוּ
  english_pob_choice: so that they might prosper
  chosen_korean: 그들이 형통하게 되며
  alternatives_korean:
  - 그들이 형통하려고
  - 그러나 그들은 형통합니다
  lexicon: HALOT
  rationale: 이 절의 קשה한 연결을 한국어에서도 풀어 쓰지 않고 결과·목적의 뉘앙스를 남기기 위해 연결어를 유지했습니다.
- source_word: וּמִשְׁפַּט אֶבְיוֹנִים
  english_pob_choice: the justice of the poor
  chosen_korean: 가난한 자들의 정의
  alternatives_korean:
  - 궁핍한 자들의 권리
  - 가난한 자들의 소송
  lexicon: HALOT
  rationale: משפט는 이 문맥에서 법적 판결과 사회적 정의를 함께 담으므로, ‘정의’로 옮기되 대상은 ‘가난한 자들’로 분명히 했습니다.
theological_decisions:
- issue: יָתוֹם의 번역
  chosen_reading: 아버지 없는 자
  alternative_readings:
  - 고아
  - 외로운 아이
  rationale: 히브리어가 가리키는 법적·사회적 약자성을 직접 드러내기 위해 전통적 교회어인 ‘고아’보다 직역형을 택했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 4, source transparency and gender-accurate rendering
- issue: וְיַצְלִיחוּ의 난해한 연결
  chosen_reading: 그들이 형통하게 되며
  alternative_readings:
  - 그들이 형통하고도
  - 그런데도 형통합니다
  rationale: 문법적으로 목적/결과의 여지가 남아 있으므로, 의미를 단정적으로 매끄럽게 정리하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3, preserve theological tension rather than resolve it
