revisions:
- from: 그들은 당신의 추수와 양식을 먹어 치우고[a], 당신의 아들과 딸들을 먹어 치우며, 당신의 양 떼와 소 떼를 먹어 치우고, 당신의 포도나무와 무화과나무를 먹어 치울 것이며, 당신이 의지하는 당신의 견고한 성읍들을 칼로 무너뜨릴 것입니다[b].
  to: 그가 네 수확물과 네 빵을 먹어 치우고[a], 그들이 네 아들들과 네 딸들을 먹어 치우며, 그가 네 양 떼와 네 소 떼를 먹어 치우고, 그가 네 포도나무와 네 무화과나무를 먹어 치울 것이며, 그가 칼로 네가 의지하는 네 견고한 성읍들을 무너뜨릴 것입니다[b].
  rationale: 원문의 단수·복수 동사 교차를 ‘그가/그들이’로 보존하고, 수확 행위가 아닌 산출물을 가리키는 קָצִיר를 ‘수확물’로 바로잡았습니다. לֶחֶם은 ‘빵’으로 유지하여 원문의 구체성을 살렸습니다. 각주 b도 실제 히브리어 분포와 수정된 본문에 맞추어 구체화했습니다.
