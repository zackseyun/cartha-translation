    rationale: 원문은 침략자를 단수와 복수로 교차하여 표현합니다. 이 변화는 영어 POB 각주 b도 명시하며, 한국어에서도 ‘그가/그들이’로 안전하게 보존할 수 있습니다.
  - severity: medium
    issue: קְצִירְךָ를 ‘추수’로 옮겼습니다.
    rationale: 여기서는 추수 행위나 시기보다 침략자가 소비하는 농업 산출물을 가리키므로 ‘수확물’이 더 정확합니다.
  - severity: low
