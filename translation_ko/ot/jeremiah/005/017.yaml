base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/017.yaml
  text: And they will consume your harvest and your bread[a]; they will consume your sons and your daughters; they will consume your flock and your herd; they will consume your vine and your fig tree; they will destroy your fortified cities, in which you trust[b], with the sword.
  footnotes:
  - marker: a
    text: Or 'devour' for the repeated verb 'eat/consume' throughout the verse.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts between singular and plural verbs for the invader(s), likely treating the attacking nation both as a collective whole and as its individual forces.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 네 수확물과 네 빵을 먹어 치우고[a], 그들이 네 아들들과 네 딸들을 먹어 치우며, 그가 네 양 떼와 네 소 떼를 먹어 치우고, 그가 네 포도나무와 네 무화과나무를 먹어 치울 것이며, 그가 칼로 네가 의지하는 네 견고한 성읍들을 무너뜨릴 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹다’. 히브리어 אָכַל은 이 절에서 반복되며, 문자적으로는 ‘먹다’이지만 여기서는 사람과 재산을 파괴적으로 소비하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 침략 세력을 가리키는 동사를 단수와 복수로 번갈아 사용합니다. 여기서는 첫째·셋째·넷째·다섯째 동사가 단수이고, 둘째 동사만 복수입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַל / יֹאכְלוּ / יֹאכַל
  english_pob_choice: will consume
  chosen_korean: 먹어 치우다
  alternatives_korean:
  - 먹다
  - 삼키다
  - 유린하다
  lexicon: HALOT
  rationale: אָכַל의 반복을 한국어에서도 살리면서, 곡식·사람·가축·나무까지 포괄하는 심판 문맥에 맞게 자연스럽고 강한 표현으로 옮겼습니다.
- source_word: קְצִירְךָ / לַחְמֶךָ
  english_pob_choice: your harvest / your bread
  chosen_korean: 당신의 추수 / 당신의 양식
  alternatives_korean:
  - 당신의 수확 / 당신의 빵
  - 당신의 곡식 / 당신의 음식
  lexicon: HALOT
  rationale: קָצִיר는 ‘추수/수확’의 의미가 가능하지만 문맥상 농산물 전체의 피해를 드러내기 위해 ‘추수’를 택했고, לֶחֶם은 문자적으로 ‘빵’이지만 한국어에서는 ‘양식’이 더 자연스럽게 व्यापक 의미를 전달합니다.
- source_word: עָרֵי מִבְצָרֶיךָ / בֹּטֵחַ
  english_pob_choice: your fortified cities / in which you trust
  chosen_korean: 당신의 견고한 성읍들 / 당신이 의지하는
  alternatives_korean:
  - 당신의 요새화된 도시들 / 당신이 신뢰하는
  - 당신의 성채 도시들 / 당신이 믿는
  lexicon: HALOT
  rationale: עָרֵי מִבְצָר는 ‘견고한 성읍들’로 옮겨 방어 시설의 강도를 살렸고, בָּטַח은 단순 정보가 아니라 의지·안전감의 뉘앙스가 있어 ‘의지하다’가 가장 적절합니다.
- source_word: בֶּחָרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼에 의해
  - 칼로써
  lexicon: HALOT
  rationale: 히브리어의 수단/도구 표현을 한국어에서 가장 자연스럽게 살리기 위해 ‘칼로’로 옮겼습니다.
theological_decisions:
- issue: 히브리어 동사의 수일치 변화(단수/복수)와 공격 주체의 집합성
  chosen_reading: 한국어에서는 주어를 ‘그들’로 두어 집합적 침략 세력을 한 덩어리로 드러내고, 동작의 반복성을 ‘먹어 치우다’의 반복으로 살렸습니다.
  alternative_readings:
  - 매번 ‘그’로 두어 단수적 주체를 유지할 수 있습니다.
  - 한국어 전체를 ‘그들은’으로 평탄화해도 됩니다.
  rationale: 이 절은 침략 세력을 집단으로 보면서도 개별 행위자들을 암시하는 긴장을 지니므로, 한국어에서는 과도한 문법적 구분보다 심판의 총체성을 유지하는 쪽이 본문 기능에 더 부합합니다.
  doctrine_reference: Translation philosophy §3, preserve tension rather than resolve it
