base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/010.yaml
  text: Go up through her vine-rows and destroy[a], but do not make a full end. Remove her branches[b], for they are not Yahweh’s.
  footnotes:
  - marker: a
    text: Or 'Go up upon her walls and destroy.' The Hebrew term in 'through her vine-rows' is difficult, and some understand the image architecturally rather than agriculturally.
    reason: alternative_reading
  - marker: b
    text: Or 'Remove her shoots/tendrils.' The Hebrew may continue the vineyard metaphor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 포도밭 사이로[a] 올라가서 파괴하십시오. 그러나 완전히 멸망시키지는 마십시오. 그 가지들을[b] 제거하십시오. 그것들은 야훼의 것이 아니기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 성벽 위로 올라가서 파괴하십시오.’ ‘그 포도밭 사이로’에 해당하는 히브리어는 해석하기 어렵기 때문에, 어떤 이들은 이 이미지를 농경이 아니라 건축물에 관한 것으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 새순들/덩굴손들을 제거하십시오.’ 히브리어는 계속해서 포도밭 비유를 이어 갈 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ בְשָׁרוֹתֶיהָ
  english_pob_choice: Go up through her vine-rows
  chosen_korean: 그의 포도밭 사이로 올라가서
  alternatives_korean:
  - 그의 담 위로 올라가서
  - 그의 포도밭 위를 올라가서
  lexicon: HALOT
  rationale: 어려운 히브리어 표현을 포도밭 이미지로 살려, 공격 이동의 의미를 유지하면서도 ‘사이로’로 ב의 공간적 감각을 드러냈습니다.
- source_word: וְשַׁחֵתוּ
  english_pob_choice: and destroy
  chosen_korean: 파괴하되
  alternatives_korean:
  - 멸망시키되
  - 훼손하되
  lexicon: HALOT
  rationale: 파멸을 명하는 강한 명령형이므로, 현대 한국어에서 직접적이고 힘 있는 ‘파괴하다’를 택했습니다.
- source_word: וְכָלָה אַל תַעֲשׂוּ
  english_pob_choice: but do not make a full end
  chosen_korean: 완전히 멸망시키지는 마십시오
  alternatives_korean:
  - 끝장내지는 마십시오
  - 전멸시키지는 마십시오
  lexicon: HALOT
  rationale: כלה + עשה의 관용구를 ‘완전히…시키다’로 풀어, 파괴 명령과 제한 명령의 긴장을 함께 보존했습니다.
- source_word: נְטִישׁוֹתֶיהָ
  english_pob_choice: her branches
  chosen_korean: 그의 가지들
  alternatives_korean:
  - 그의 새순들
  - 그의 덩굴손들
  lexicon: HALOT
  rationale: 포도밭 비유를 고려하되, 한국어 본문에서는 독해 가능성이 높은 일반어 ‘가지들’을 사용했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 직접 나온 고유 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 언약 이름의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
