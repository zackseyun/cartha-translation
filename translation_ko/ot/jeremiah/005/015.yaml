  - 주님
  rationale: 본문의 נְאֻם יְהוָה를 한국어 예언문 공식에 맞게 ‘여호와의 말씀입니다’로 옮겼습니다. 원문 이름 자체를 드러내는 ‘야훼’ 대신, 이 구절의 선포문 구조를 자연스럽게 살렸습니다.
  doctrine_reference: POB OT name rendering policy
