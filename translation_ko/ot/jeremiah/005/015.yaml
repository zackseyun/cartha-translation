source:
  edition: WLC
  text: הִנְ/נִ֣י מֵבִיא֩ עֲלֵי/כֶ֨ם גּ֧וֹי מִ/מֶּרְחָ֛ק בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהֹוָ֑ה גּ֣וֹי אֵיתָ֣ן ה֗וּא גּ֤וֹי מֵ/עוֹלָם֙ ה֔וּא גּ֚וֹי לֹא תֵדַ֣ע לְשֹׁנ֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע מַה יְדַבֵּֽר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
  footnotes:
  - marker: a
    text: Or 'a strong nation' or 'an enduring nation' for 'a mighty nation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a nation from of old' for 'an ancient nation.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'whose tongue you do not know, and you do not understand what it speaks.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 너희에게서 멀리 떨어진 나라를 끌어오고 있습니다, 이스라엘 집이여, 여호와의 말씀입니다. 그것은 강한 나라입니다[b]—옛날부터 있어 온 나라입니다. 너희가 그 언어를 알지 못하는 나라이고[c], 그들이 무슨 말을 하는지 너희가 알아듣지 못할 나라입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘견고한 나라’ 혹은 ‘오래 지속되는 나라’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그 혀를 알지 못하며, 그가 말하는 것을 너희가 이해하지 못한다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look, I
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 내가
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 지시 표현으로, 현대 합쇼체에서 가장 자연스러우면서도 엄숙한 어감을 살렸습니다.
- source_word: מֵבִיא עֲלֵיכֶם
  english_pob_choice: am bringing against you
  chosen_korean: 너희에게서 멀리 떨어진 나라를 끌어오고 있습니다
  alternatives_korean:
  - 너희에게 불러오고 있습니다
  - 너희 위에 가져오고 있습니다
  lexicon: HALOT
  rationale: 진행 중인 심판 행위를 드러내기 위해 현재진행형으로 옮기고, עַל의 적대적 방향성은 문맥상 ‘너희에게’로 받았습니다.
- source_word: גּוֹי אֵיתָן
  english_pob_choice: a mighty nation
  chosen_korean: 강한 나라
  alternatives_korean:
  - 힘센 나라
  - 막강한 나라
  - 튼튼한 나라
  lexicon: HALOT
  rationale: אֵיתָן의 ‘강함/견고함/지속성’ 가운데, 침공 맥락에 가장 직접적인 ‘강한’이 적합합니다.
- source_word: גּוֹי מֵעוֹלָם
  english_pob_choice: an ancient nation
  chosen_korean: 옛날부터 있어 온 나라
  alternatives_korean:
  - 오래된 나라
  - 예로부터 있는 나라
  lexicon: HALOT
  rationale: מֵעוֹלָם을 단순한 ‘영원’이 아니라 역사적으로 오래된 존재로 읽어, ‘옛날부터 있어 온’으로 풀었습니다.
- source_word: לֹא תֵדַע לְשֹׁנוֹ … וְלֹא תִשְׁמַע מַה יְדַבֵּר
  english_pob_choice: whose language you do not know, and whose speech you do not understand
  chosen_korean: 너희가 그 언어를 알지 못하는 나라이고, 그들이 무슨 말을 하는지 너희가 알아듣지 못할 나라입니다
  alternatives_korean:
  - 너희가 그 혀를 알지 못하는 나라이고, 그들이 무엇을 말하는지 너희가 듣고도 깨닫지 못할 나라입니다
  - 너희가 그 말을 알아듣지 못하는 나라입니다
  lexicon: HALOT
  rationale: ‘듣다’보다 ‘알아듣다’가 שׁמע의 ‘청취와 이해’ 둘을 함께 살리며, לְשׁוֹנוֹ는 문맥에 맞게 ‘언어’로 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 여호와
  alternative_readings:
