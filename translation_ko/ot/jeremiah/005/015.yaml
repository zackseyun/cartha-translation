  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
  footnotes:
  - marker: a
    text: Or 'a strong nation' or 'an enduring nation' for 'a mighty nation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a nation from of old' for 'an ancient nation.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'whose tongue you do not know, and you do not understand what it speaks.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 먼 곳에서 한 나라를 너희에게로 끌어오고 있습니다. 이스라엘 집이여, 야훼의 말씀입니다. 그 나라는 강한 나라이고[b], 예로부터 있는 나라입니다. 너희는 그 나라의 언어를 알지 못하고[c], 그 나라가 무슨 말을 하는지도 알아듣지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘견고한 나라’ 또는 ‘오래 지속되는 나라’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘너희는 그의 혀를 알지 못하고, 그가 무엇을 말하는지 듣지 못한다’입니다.
    reason: lexical_alternative
