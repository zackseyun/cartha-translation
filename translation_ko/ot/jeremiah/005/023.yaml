  text: But this people has had a stubborn and rebellious heart; they have turned aside and gone away.
translation:
  language: ko
  text: 그러나 이 백성은 완고하고 반역하는 마음을 지녔습니다. 그들은 돌아서서 떠나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעָם הַזֶּה / this people
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 민족
  lexicon: עָם
  rationale: 공동체 전체를 가리키는 집합적 표현이므로 ‘이 백성’이 가장 자연스럽고, 문맥상 언약 백성에 대한 책망을 잘 드러냅니다.
- source_word: לֵב סוֹרֵר וּמוֹרֶה / stubborn and rebellious heart
  english_pob_choice: stubborn and rebellious heart
  chosen_korean: 완고하고 반역하는 마음
  alternatives_korean:
  - 고집스럽고 반항하는 마음
  - 완강하고 거역하는 마음
  lexicon: לֵב, סוֹרֵר, מוֹרֶה
  rationale: ‘마음’은 히브리어 לֵב의 인격·의지 중심을 반영하고, סוֹרֵר/מוֹרֶה는 단순한 감정이 아니라 하나님께 대한 반항성과 불순종을 함께 담아 ‘완고하고 반역하는’으로 옮겼습니다.
- source_word: סָרוּ וַיֵּלְכוּ / they have turned aside and gone away
  english_pob_choice: they have turned aside and gone away
  chosen_korean: 그들은 돌아서서 떠나갔습니다
  alternatives_korean:
  - 그들은 빗나가 떠났습니다
  - 그들은 곁길로 가서 떠났습니다
  lexicon: סוּר, הָלַךְ
  rationale: ‘돌아서서’는 방향 전환과 이탈을, ‘떠나갔습니다’는 지속적 이탈을 자연스럽게 드러내어 영어 POB의 두 동작을 한국어로 분명히 반영합니다.
theological_decisions:
- issue: 언약 공동체에 대한 도덕·영적 평가의 강도
  chosen_reading: ‘완고하고 반역하는 마음’으로 번역해 단순한 성격 묘사가 아니라 하나님께 대한 지속적 저항을 드러냈습니다.
  alternative_readings:
  - ‘고집스럽고 반항하는 마음’으로 약화
  - ‘완강한 마음’처럼 반역성을 축소
  rationale: 문맥은 예레미야의 언약 고발이므로, 심리적 성향보다 신적 권위에 대한 반역을 분명히 살리는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 예레미야서의 언약 신실성/불신실성 주제
