- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 언약적 고유성을 유지했습니다.
- source_word: עָשָׂה ... אֶת כָּל אֵלֶּה
  english_pob_choice: done all these things
  chosen_korean: 이 모든 일을 행하셨습니까
  alternatives_korean:
