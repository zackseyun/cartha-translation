base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
  footnotes:
  - marker: a
    text: Or, 'served strangers' / 'served aliens'; the Hebrew זָרִים denotes foreign people here, in contrast to 'foreign gods' earlier in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 ‘어찌하여 야훼 우리 하나님께서 우리에게 이 모든 일을 행하셨습니까?’ 하고 말할 때, 너는 그들에게 이렇게 말하여라. ‘너희가 나를 버리고 너희 땅에서 이방 신들을 섬긴 것처럼, 너희도 너희 것이 아닌 땅에서 이방 사람들을 섬기게 될 것이다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 자들’. 히브리어 זָרִים은 앞의 ‘이방 신들’과 달리 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
