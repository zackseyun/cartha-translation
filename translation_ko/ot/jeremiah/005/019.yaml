  lexicon: HALOT
  rationale: 여기서는 대상이 신들이므로 ‘섬기다’와 ‘외국 신들’을 유지해 앞뒤 대구를 분명히 했습니다.
- source_word: תַּעַבְדוּ זָרִים
  english_pob_choice: you shall serve foreigners
  chosen_korean: 외국인들을 섬기게 될 것이다
  alternatives_korean:
  - 나그네들을 섬기게 될 것이다
  - 낯선 사람들을 섬기게 될 것이다
  lexicon: HALOT
  rationale: POB의 audit trail처럼 כאן의 זָרִים은 신이 아니라 사람들을 가리키므로, 앞의 ‘외국 신들’과 구별되게 번역했습니다.
theological_decisions:
- issue: 여호와/야훼의 대칭과 심판의 반전
  chosen_reading: 이스라엘이 자기 땅에서 외국 신들을 섬긴 것에 대한 대응으로, 이제 자기 것이 아닌 땅에서 외국인들을 섬기게 된다는 언약적 보응을 그대로 드러냈습니다.
  alternative_readings:
  - ‘낯선 자들’을 섬기게 된다는 일반화된 표현
  - 전통적으로 ‘이방인들’로 옮기는 방식
  rationale: 원문의 대구는 신들→사람들, 너희 땅→너희 것이 아닌 땅의 반전이 핵심이므로 이를 희석하지 않았습니다.
  doctrine_reference: 예레미야의 언약적 심판과 보응의 언어
