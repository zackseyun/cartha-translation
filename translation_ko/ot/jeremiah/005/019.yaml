  lexicon: HALOT
  rationale: 심판의 여러 행위를 가리키는 복수 지시를 살리기 위해 ‘이 모든 일’로 옮겼습니다.
- source_word: עֲזַבְתֶּם אוֹתִי
  english_pob_choice: you have forsaken me
  chosen_korean: 너희가 나를 버리고
  alternatives_korean:
