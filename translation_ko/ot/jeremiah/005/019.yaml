  lexicon: HALOT
  rationale: 언약적 배반의 무게를 살리면서도 한국어로 자연스러운 ‘버리다’를 택했습니다.
- source_word: וַתַּעַבְדוּ אֱלֹהֵי נֵכָר
  english_pob_choice: served foreign gods
  chosen_korean: 외국 신들을 섬겼던 것같이
  alternatives_korean:
