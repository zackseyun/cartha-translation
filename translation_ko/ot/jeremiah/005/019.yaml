base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
  footnotes:
  - marker: a
    text: Or, 'served strangers' / 'served aliens'; the Hebrew זָרִים denotes foreign people here, in contrast to 'foreign gods' earlier in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분이 말할 때, ‘어찌하여 야훼 우리 하나님께서 우리에게 이 모든 일을 행하셨습니까?’ 하거든, 당신은 그들에게 이렇게 말해야 합니다. ‘너희가 나를 버리고 너희 땅에서 외국 신들을 섬겼던 것같이, 너희는 너희 것이 아닌 땅에서 외국인들을 섬기게 될 것이다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인들’을 뜻할 수 있습니다. כאן의 זָרִים은 앞의 ‘외국 신들’과 달리 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그리고 여러분이 말할 때
  alternatives_korean:
  - 그리고 때가 되면
  - 그리고 여러분이 말하면
  lexicon: HALOT
  rationale: 미래의 조건적 상황을 자연스러운 한국어로 풀되, 이어지는 예언적 응답 구조가 드러나게 했습니다.
- source_word: תַּחַת מֶה
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 무슨 이유로
  - 왜
  lexicon: HALOT
  rationale: 원문의 원인 질문을 한국어의 자연스러운 질문형으로 옮겼습니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 언약적 고유성을 유지했습니다.
- source_word: עָשָׂה ... אֶת כָּל אֵלֶּה
  english_pob_choice: done all these things
  chosen_korean: 이 모든 일을 행하셨습니까
  alternatives_korean:
  - 이 모든 일을 하셨습니까
  - 이 모든 일을 하신 것입니까
  lexicon: HALOT
  rationale: 심판의 여러 행위를 가리키는 복수 지시를 살리기 위해 ‘이 모든 일’로 옮겼습니다.
- source_word: עֲזַבְתֶּם אוֹתִי
  english_pob_choice: you have forsaken me
  chosen_korean: 너희가 나를 버리고
  alternatives_korean:
  - 너희가 나를 떠나고
  - 너희가 나를 저버리고
  lexicon: HALOT
  rationale: 언약적 배반의 무게를 살리면서도 한국어로 자연스러운 ‘버리다’를 택했습니다.
- source_word: וַתַּעַבְדוּ אֱלֹהֵי נֵכָר
  english_pob_choice: served foreign gods
  chosen_korean: 외국 신들을 섬겼던 것같이
  alternatives_korean:
  - 이방 신들을 섬겼던 것같이
  - 낯선 신들을 섬겼던 것같이
  lexicon: HALOT
  rationale: 여기서는 대상이 신들이므로 ‘섬기다’와 ‘외국 신들’을 유지해 앞뒤 대구를 분명히 했습니다.
- source_word: תַּעַבְדוּ זָרִים
  english_pob_choice: you shall serve foreigners
  chosen_korean: 외국인들을 섬기게 될 것이다
  alternatives_korean:
  - 나그네들을 섬기게 될 것이다
  - 낯선 사람들을 섬기게 될 것이다
  lexicon: HALOT
  rationale: POB의 audit trail처럼 כאן의 זָרִים은 신이 아니라 사람들을 가리키므로, 앞의 ‘외국 신들’과 구별되게 번역했습니다.
theological_decisions:
- issue: 여호와/야훼의 대칭과 심판의 반전
  chosen_reading: 이스라엘이 자기 땅에서 외국 신들을 섬긴 것에 대한 대응으로, 이제 자기 것이 아닌 땅에서 외국인들을 섬기게 된다는 언약적 보응을 그대로 드러냈습니다.
  alternative_readings:
  - ‘낯선 자들’을 섬기게 된다는 일반화된 표현
  - 전통적으로 ‘이방인들’로 옮기는 방식
  rationale: 원문의 대구는 신들→사람들, 너희 땅→너희 것이 아닌 땅의 반전이 핵심이므로 이를 희석하지 않았습니다.
  doctrine_reference: 예레미야의 언약적 심판과 보응의 언어
