  verdict: revise
  source_fidelity: 핵심 대구—자기 땅에서 외래 신들을 섬긴 일과 자기 땅이 아닌 곳에서 외래 사람들을 섬기게 될 심판—는 잘 반영되어 있습니다. 다만 화자·청자의 인칭이 ‘여러분/당신/너희’로 혼재되어 원문의 단수 명령 대상(예레미야)과 복수 백성의 구별이 흐려집니다. זָרִים은 앞선 אֱלֹהֵי־נֵכָר와 대조되는 사람들을 가리키므로 ‘이방 사람들’로 분명히 하였습니다.
  naturalness: ‘여러분’과 ‘너희’의 혼용, 그리고 예언자에게 하는 명령으로서 부자연스러운 ‘당신은’은 현대 표준어 성서 문체에서 매끄럽지 않습니다. ‘너희가 … 하거든, 너는 그들에게 이렇게 말하여라’로 정리하면 원문의 인칭과 발화 구조가 자연스럽게 드러납니다.
  terminology: יַהְוֶה는 제공된 결정과 일치하게 ‘야훼’로 유지했습니다. אֱלֹהֵי נֵכָר는 ‘이방 신들’, זָרִים은 사람이라는 대조를 살린 ‘이방 사람들’로 옮겼습니다. 각주에는 한국어가 아닌 ‘כאן’이 들어가 있고, 본문과 같은 ‘외국인들’을 ‘또는’으로 제시하여 대안 기능을 하지 못하므로 바로잡아야 합니다.
