  text: אֵֽלֲכָה לִּ֤/י אֶל הַ/גְּדֹלִים֙ וַ/אֲדַבְּרָ֣ה אוֹתָ֔/ם כִּ֣י הֵ֗מָּה יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶ֑ם אַ֣ךְ הֵ֤מָּה יַחְדָּו֙ שָׁ֣בְרוּ עֹ֔ל נִתְּק֖וּ מוֹסֵרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
  footnotes:
  - marker: a
    text: Or 'the judgment of their God' or 'the ordinance of their God.' The Hebrew word can refer to justice, judgment, or legal requirement.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 큰 사람들에게 가서 그들에게 말하겠습니다. 그들은 야훼의 길과 자기들의 하나님의 의를 알기 때문입니다. 그러나 그들도 함께 멍에를 부러뜨리고 결박을 끊어 버렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֲכָה לִּי
  english_pob_choice: I will go
  chosen_korean: 나는 … 가서
  alternatives_korean:
  - 가겠습니다
  - 제가 가겠습니다
  - 가 보겠습니다
  lexicon: HALOT
  rationale: 1인칭 의지/결심의 cohortative를 한국어 합쇼체의 단순 의지 표현으로 옮겼고, לִּי의 뉘앙스는 자연스러운 문맥 속 이동으로 처리했습니다.
- source_word: הַגְּדֹלִים
  english_pob_choice: the great men
  chosen_korean: 큰 사람들
  alternatives_korean:
  - 유력한 사람들
  - 귀인들
  - 지도자들
  lexicon: HALOT
  rationale: 사회적으로 큰 영향력과 신분을 가진 사람들을 가리키므로, 원문의 구체성을 유지하면서도 한국어에서 자연스러운 사회 계층 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 주어진 용어표에 따라 신명기를 포함한 본문에서 יְהוָה는 고유명사로서 야훼를 사용했습니다.
- source_word: מִשְׁפַּט
  english_pob_choice: the justice of their God
  chosen_korean: 하나님의 의
  alternatives_korean:
  - 하나님의 정의
  - 하나님의 판단
  - 하나님의 법도
  lexicon: HALOT
  rationale: 문맥상 야훼의 길과 평행을 이루는 윤리적·언약적 규범을 가리키므로, 단순한 판결보다 넓은 규범적 의미를 살려 의로 옮겼습니다.
- source_word: יַחְדָּו
  english_pob_choice: together
  chosen_korean: 함께
  alternatives_korean:
  - 모두 함께
  - 일제히
  - 한데
  lexicon: HALOT
  rationale: 공동 행위를 강조하는 부사로, 한국어에서 가장 간결하고 자연스러운 함께를 선택했습니다.
- source_word: שָׁבְרוּ עֹל / נִתְּקוּ מוֹסֵרוֹת
  english_pob_choice: have broken the yoke; they have torn off the bonds
  chosen_korean: 멍에를 부러뜨리고 결박을 끊어 버렸습니다
  alternatives_korean:
  - 멍에를 꺾고 결박을 끊었습니다
  - 멍에를 깨뜨리고 사슬을 끊어 버렸습니다
  - 멍에를 부수고 속박을 끊어 버렸습니다
  lexicon: HALOT
  rationale: 원문의 두 가지 구체적 은유를 유지하되, 한국어에서 통용되는 대구 표현으로 옮겨 반항적·폭력적 거부의 이미지를 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 하나님의 고유명을 직접 사용하므로, 본문이 드러내는 언약적 이름을 보존하는 방향이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 의/판단/법도의 의미
  chosen_reading: 하나님의 의로 옮겨 윤리적·언약적 규범성을 살렸습니다.
  alternative_readings:
  - 하나님의 판단
  - 하나님의 법도
  - 하나님의 판결
  rationale: מִשְׁפַּט는 이 문맥에서 단일한 법정 판결이라기보다 야훼의 길과 짝을 이루는 공의의 기준을 가리키므로, 의미의 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
