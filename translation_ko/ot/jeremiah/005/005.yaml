source:
  edition: WLC
  text: אֵֽלֲכָה לִּ֤/י אֶל הַ/גְּדֹלִים֙ וַ/אֲדַבְּרָ֣ה אוֹתָ֔/ם כִּ֣י הֵ֗מָּה יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶ֑ם אַ֣ךְ הֵ֤מָּה יַחְדָּו֙ שָׁ֣בְרוּ עֹ֔ל נִתְּק֖וּ מוֹסֵרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
  footnotes:
  - marker: a
    text: Or 'the judgment of their God' or 'the ordinance of their God.' The Hebrew word can refer to justice, judgment, or legal requirement.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 유력한 사람들에게 가서 그들에게 말하겠습니다. 그들은 야훼의 길과 자기들의 하나님의 정의[a]를 알기 때문입니다. 그러나 그들도 모두 함께 멍에를 부러뜨리고 결박을 끊어 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기들의 하나님의 판단’ 또는 ‘자기들의 하나님의 법도’. 히브리어 미쉬파트는 정의, 판단, 또는 법적 요구·규례를 가리킬 수 있습니다.
    reason: מִשְׁפָּט의 법적·윤리적 의미 범위를 보존하고, 번역어 ‘정의’가 하나의 해석으로 고정되지 않도록 합니다.
