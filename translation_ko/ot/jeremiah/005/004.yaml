  text: וַ/אֲנִ֣י אָמַ֔רְתִּי אַךְ דַּלִּ֖ים הֵ֑ם נוֹאֲל֕וּ כִּ֣י לֹ֤א יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/004.yaml
  text: But I said[a], “Surely these are only the poor; they are foolish, for they do not know the way of Yahweh, the justice of their God.”
  footnotes:
  - marker: a
    text: Or “the judgment of their God” or “the ordinance of their God.” The Hebrew word can refer to justice, judgment, or a legal requirement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 말했습니다. “아마도 이들은 가난한 사람들일 뿐이겠지요. 그들은 어리석습니다. 야훼의 길과 자기 하나님의 의를 알지 못하기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 하나님의 판단” 또는 “자기 하나님의 규례”로도 옮길 수 있습니다. 히브리어 단어는 의, 판단, 또는 법적 요구를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 나로 말하면
  lexicon: HALOT
  rationale: 앞선 탐색과 대비되는 화자의 내적 판단을 나타내므로, 반전의 뉘앙스를 살린 ‘그러나’가 자연스럽습니다.
- source_word: אָמַרְתִּי
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 생각했습니다
  lexicon: HALOT
  rationale: 직접 인용을 이끄는 동사로서 ‘말했습니다’가 가장 자연스럽고, 문맥상 내부 독백이라도 ‘생각했습니다’로 바꿀 필요는 없습니다.
- source_word: דַּלִּים
  english_pob_choice: the poor
  chosen_korean: 가난한 사람들
  alternatives_korean:
  - 가난한 자들
  - 가난한 이들
  - 빈곤한 사람들
  lexicon: HALOT
  rationale: 사회적·경제적 취약성을 가리키는 말이므로, 현대 한국어에서는 ‘가난한 사람들’이 가장 무난하고 명료합니다.
- source_word: נוֹאֲלוּ
  english_pob_choice: they are foolish
  chosen_korean: 어리석습니다
  alternatives_korean:
  - 우매합니다
  - 무지합니다
  - 어리석은 자들입니다
  lexicon: HALOT
  rationale: 원문의 판단적 진술을 살리되, 한국어에서 인격적 비난보다 상태 진술로 들리도록 ‘어리석습니다’로 옮겼습니다.
- source_word: דֶּרֶךְ יְהוָה
  english_pob_choice: the way of Yahweh
  chosen_korean: 야훼의 길
  alternatives_korean:
  - 야훼의 길
  - 주님의 길
  - 야훼께서 가르치시는 길
  lexicon: HALOT
  rationale: 정관적 관용구를 직역하여, 야훼의 행하심·뜻·언약적 삶의 방식 전체를 가리키는 표현으로 유지했습니다.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  english_pob_choice: the justice of their God
  chosen_korean: 자기 하나님의 의
  alternatives_korean:
  - 자기 하나님의 공의
  - 자기 하나님의 판단
  - 자기 하나님의 규례
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 단순한 법령보다 하나님의 올바른 질서와 공정성을 가리키므로, ‘의’로 옮겨 앞의 ‘길’과 병렬을 이루게 했습니다.
theological_decisions:
