  source_fidelity: 본문의 기본 의미는 대체로 충실합니다. 다만 וָאַשְׂבִּעַ의 문맥상 주된 뜻은 ‘배불리 먹이다/만족시키다’이며, 각주에는 제기되어 온 ‘맹세하게 하다’의 다른 분석 가능성도 밝혀 두는 편이 원문의 논쟁적 여지를 보존합니다.
  naturalness: ‘배불리 채워 주다’보다 사람을 목적어로 하는 ‘배불리 먹이다’가 현대 한국어에서 더 자연스럽습니다. 또한 지정된 합쇼체에 맞추어 종결을 ‘-습니다/-습니까’로 통일하는 것이 적절합니다.
  terminology: ‘자녀들’, ‘신이 아닌 것들’, ‘간음하다’, ‘창녀의 집’은 원문의 집합적 지칭과 성적·비유적 긴장을 과도하게 해석하지 않고 잘 보존합니다. ‘창녀’는 예언서의 강한 비난 어조를 유지합니다.
  issues:
  - severity: medium
    issue: 각주 표지가 해당 어구에 붙어 있지 않고, 두 각주 모두 문장 끝에 함께 배치되어 있습니다.
    rationale: a는 וָאַשְׂבִּעַ(‘배불리 먹이다/만족시키다’)에, b는 יִתְגֹּדָדוּ(‘떼 지어 몰려들다’)에 연결되어야 독자가 각주의 대상 어구를 분명히 알 수 있습니다.
  - severity: medium
