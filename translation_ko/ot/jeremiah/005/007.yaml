id: JER.5.7
reference: Jeremiah 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֤י לָ/זֹאת֙ אסלוח לָ֔/ךְ בָּנַ֣יִ/ךְ עֲזָב֔וּ/נִי וַ/יִּשָּׁבְע֖וּ בְּ/לֹ֣א אֱלֹהִ֑ים וָ/אַשְׂבִּ֤עַ אוֹתָ/ם֙ וַ/יִּנְאָ֔פוּ וּ/בֵ֥ית זוֹנָ֖ה יִתְגֹּדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/007.yaml
  text: How can I forgive you for this? Your children have forsaken me and have sworn by those that are not gods[a]. When I had fed them to the full[b], they committed adultery and crowded into a prostitute’s house.
  footnotes:
  - marker: a
    text: Or 'I fed them to the full.' The Hebrew verb can denote causing to be full or satisfied; some have also connected it with oath language, but 'satisfied' best fits the context of divine provision followed by unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'they thronged to a prostitute’s house' / 'they gathered in bands at a prostitute’s house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 내가 이 일로 너를 용서하겠느냐? 네 자녀들이 나를 버리고 신이 아닌 것들로 맹세하였다. 내가 그들을 배불리 채워 주었는데도 그들은 간음하였고, 창녀의 집에 몰려들었다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 배불리 채워 주었는데도.’ 히브리어 동사는 ‘배부르게 하다/만족시키다’의 뜻을 가질 수 있으며, 문맥상 하나님의 공급 뒤에 이어진 불신실함을 잘 드러냅니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘창녀의 집으로 떼지어 모였다’ / ‘창녀의 집에 떼를 지어 들어갔다.’
    reason: alternative_reading
lexical_decisions:
- source_word: אֵי לָזֹאת
  english_pob_choice: How can I forgive you for this?
  chosen_korean: 어찌하여 내가 이 일로 너를 용서하겠느냐?
  alternatives_korean:
  - 왜 내가 이 일로 너를 용서하겠느냐?
  - 어찌 내가 너를 이 일로 용서할 수 있겠느냐?
  lexicon: HALOT
  rationale: 반어적 불가능성을 드러내기 위해 ‘어찌하여’와 수사적 질문을 살렸고, ‘이 일로’로 grounds를 자연스럽게 옮겼습니다.
- source_word: בָּנַיִךְ
  english_pob_choice: Your children
  chosen_korean: 네 자녀들이
  alternatives_korean:
  - 네 아들들이
  - 네 자식들이
  lexicon: HALOT
  rationale: 예루살렘/유다를 향한 집합적 지칭이므로 성별을 좁히지 않는 ‘자녀들’이 원문 기능을 가장 잘 반영합니다.
- source_word: בְּלֹא אֱלֹהִים
  english_pob_choice: those that are not gods
  chosen_korean: 신이 아닌 것들로
  alternatives_korean:
  - 신이 아닌 자들로
  - 하나님이 아닌 것들로
  lexicon: HALOT
  rationale: 부정신들의 실재를 폄하하는 표현을 살리되, 문맥상 우상 숭배의 대상을 드러내기 위해 ‘신이 아닌 것들로’라고 옮겼습니다.
- source_word: וָאַשְׂבִּעַ אוֹתָם
  english_pob_choice: When I had fed them to the full
  chosen_korean: 내가 그들을 배불리 채워 주었는데도
  alternatives_korean:
  - 내가 그들을 만족시켰는데도
  - 내가 그들을 충분히 먹였는데도
  lexicon: HALOT
  rationale: POB의 최신 회복 본문이 반영한 ‘만족/배불리 채움’의 뜻을 살려, 공급 이후의 배반이라는 대비를 자연스럽게 표현했습니다.
- source_word: וּבֵית זוֹנָה יִתְגֹּדָדוּ
  english_pob_choice: crowded into a prostitute’s house
  chosen_korean: 창녀의 집에 몰려들었다.
  alternatives_korean:
  - 창녀의 집으로 떼지어 모였다.
  - 창녀의 집에 떼를 지어 들어갔다.
  lexicon: HALOT
  rationale: יִתְגֹּדָדוּ의 집단적 몰림을 ‘몰려들었다’로 간명하게 살리고, זוֹנָה는 고대적 완곡어보다 직설적인 ‘창녀’가 원문의 강한 비난을 유지합니다.
theological_decisions:
- issue: ‘간음’의 문자적/비유적 긴장
  chosen_reading: ‘간음하였고’라고 직역해 문자적 음행과 우상숭배의 비유를 동시에 열어 두었습니다.
  alternative_readings:
  - ‘음행하였고’로 완화하기
  - ‘우상숭배를 저질렀고’로 명시하기
  rationale: 예레미야의 예언 문맥은 성적 비유와 언약 배반을 겹쳐 말하므로, 한쪽으로 해석을 고정하지 않는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
