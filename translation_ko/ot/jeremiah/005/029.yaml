  - severity: medium
    issue: נפשׁי를 ‘내 마음’으로 번역
    rationale: ‘마음’은 한국어에서 감정이나 의도를 뜻하기 쉬워 원문의 ‘나 자신/내 영혼’이라는 인칭적 강조를 흐릴 수 있습니다. 본문에서는 자연스럽게 ‘내가 친히’로 옮기고, 각주에서 문자적 표현을 설명합니다.
