id: JER.5.29
reference: Jeremiah 5:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לֹֽא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/029.yaml
  text: Shall I not punish for these things? declares Yahweh[b][a]. Shall my soul not avenge itself on a nation such as this?
  footnotes:
  - marker: a
    text: Or 'Shall I not call these things to account?' The Hebrew verb can mean 'visit' in the sense of judicial intervention or punishment.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Shall my soul not avenge itself...?' 'My soul' is a Hebrew idiom expressing the LORD's own personal resolve; some translations render more idiomatically, 'Shall I not avenge myself...?'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들 때문에 내가 벌하지 않겠느냐? — 야훼의 말씀이니라. 이런 민족 같은 자에게 내 마음이 복수하지 않겠느냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이런 일들을 내가 책임을 물어야 하지 않겠느냐?’ פקד는 법적 개입이나 징벌의 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘내 영혼이 복수하지 않겠느냐?’입니다. 여기서 ‘내 영혼’은 여호와의 व्यक्तिगत한 결단을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  english_pob_choice: Shall I not punish for these things?
  chosen_korean: 이런 일들 때문에 내가 벌하지 않겠느냐?
  alternatives_korean:
  - 이런 일들에 대해 내가 벌하지 않겠느냐?
  - 이런 일들을 내가 심판하지 않겠느냐?
  lexicon: WLC; HALOT
  rationale: 히브리어의 수사 의문문을 자연스러운 한국어로 옮기면서, פקד의 법정적/징계적 의미를 ‘벌하다’로 살렸습니다.
- source_word: אֶפְקֹד
  english_pob_choice: punish
  chosen_korean: 벌하다
  alternatives_korean:
  - 심판하다
  - 불러서 حساب하다
  - 찾아가다
  lexicon: HALOT
  rationale: פקד는 문맥상 징벌적 ‘방문/책임 추궁’의 뜻이므로, 현대 독자가 즉시 이해할 수 있는 ‘벌하다’를 택했습니다.
- source_word: נְאֻם יְהֹוָה
  english_pob_choice: declares Yahweh
  chosen_korean: — 야훼의 말씀이니라
  alternatives_korean:
  - — 야훼께서 말씀하십니다
  - — 야훼의 선언입니다
  lexicon: source formula; doctrinal name rendering
  rationale: 예언 공식은 직역보다 관용적으로 살리되, מקור의 여호와 이름은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: תִתְנַקֵּם נַפְשִׁי
  english_pob_choice: Shall my soul not avenge itself?
  chosen_korean: 내 마음이 복수하지 않겠느냐?
  alternatives_korean:
  - 내 영혼이 복수하지 않겠느냐?
  - 내가 친히 복수하지 않겠느냐?
  lexicon: HALOT
  rationale: נפש는 여기서 하나님의 내적 결단을 나타내는 관용구이므로, 한국어에서는 생경한 ‘영혼’보다 뜻이 드러나는 ‘내 마음’으로 옮겼습니다.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  english_pob_choice: on a nation such as this
  chosen_korean: 이런 민족 같은 자에게
  alternatives_korean:
  - 이런 나라에
  - 이런 민족에
  lexicon: HALOT
  rationale: בְּגוֹי는 단순한 국가명이 아니라 심판 대상 집단을 가리키므로, 맥락상 ‘민족’으로 옮기고, כָּזֶה의 강조를 ‘이런 … 같은’으로 살렸습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 고유명사 ‘야훼’를 본문에 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 יהוה가 직접 나오므로, 프로젝트 기본 규범에 따라 서술적 호칭이 아니라 이름 자체를 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: נפש의 관용적 의미
  chosen_reading: ‘내 마음’으로 옮겨 하나님의 व्यक्तिगत 결단을 드러냈습니다.
  alternative_readings:
  - 내 영혼
  - 내가 친히
  rationale: 문자적 ‘영혼’은 한국어에서 오해를 낳을 수 있어, 히브리어 관용구가 가리키는 인격적 의지와 결단을 자연스럽게 드러냈습니다.
  doctrine_reference: Hebrew idiom in POB audit trail
