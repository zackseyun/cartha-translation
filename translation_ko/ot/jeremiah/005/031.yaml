source:
  edition: WLC
  text: הַ/נְּבִיאִ֞ים נִבְּא֣וּ בַ/שֶּׁ֗קֶר וְ/הַ/כֹּהֲנִים֙ יִרְדּ֣וּ עַל יְדֵי/הֶ֔ם וְ/עַמִּ֖/י אָ֣הֲבוּ כֵ֑ן וּ/מַֽה תַּעֲשׂ֖וּ לְ/אַחֲרִיתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/031.yaml
  text: The prophets prophesy falsely[a], and the priests rule by their authority, and my people love it so[b]. But what will you do when its end comes?
  footnotes:
  - marker: a
    text: Or 'the priests rule at their direction' or 'the priests rule by their hands.' The Hebrew phrase is difficult.
    reason: alternative_reading
  - marker: b
    text: Or 'what will you do at her end?' The Hebrew suffix is feminine and may refer to the situation, the land, or the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 예언자들은 거짓으로 예언하고, 제사장들은 예언자들의 권세로 다스리며[a], 내 백성은 이를 좋아합니다. 그런데 그것의 끝이 닥치면[b], 너희는 어떻게 하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제사장들은 예언자들의 지시에 따라 다스린다’ 또는 ‘제사장들은 예언자들의 손에 의해 다스린다’로 옮길 수 있습니다. 히브리어 구문은 어렵습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그 끝에 너희는 어떻게 하겠습니까?’ 또는 ‘그녀의 끝에 너희는 어떻게 하겠습니까?’로 옮길 수 있습니다. 히브리어의 여성형 접미사는 상황, 땅, 또는 성읍을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְּאוּ בַשֶּׁקֶר
  english_pob_choice: prophesy falsely
  chosen_korean: 거짓으로 예언하고
  alternatives_korean:
  - 거짓 예언하고
  - 거짓말로 예언하고
  lexicon: WLC / HALOT
  rationale: 예언 동작과 ‘거짓/허위’의 결합을 살리면서, 한국어에서 자연스럽고 직접적인 비난을 유지하기 위해 ‘거짓으로 예언하다’를 택했습니다.
- source_word: יִרְדּוּ עַל יְדֵיהֶם
  english_pob_choice: rule by their authority
  chosen_korean: 그들의 손을 빌려 다스리며
  alternatives_korean:
  - 그들의 권위로 다스리며
  - 그들의 지시에 따라 다스리며
  - 그들의 손에 의해 다스리며
  lexicon: WLC / HALOT
  rationale: 히브리어 표현은 난해하며, 영어 POB의 주석처럼 매개된 통치 관계를 가리킵니다. ‘그들의 손을 빌려’는 문자적 이미지를 살리면서도 권력의 매개성을 드러냅니다.
- source_word: וְעַמִּי אָהֲבוּ כֵן
  english_pob_choice: my people love it so
  chosen_korean: 내 백성은 그것을 좋아합니다
  alternatives_korean:
  - 내 백성은 그렇게 하기를 좋아합니다
  - 내 백성은 이런 일을 좋아합니다
  lexicon: WLC / HALOT
  rationale: ‘כֵן’은 앞의 부패한 질서를 가리키는 승인 표현이므로, 한국어에서는 자연스럽게 ‘그것을 좋아합니다’로 옮겨 비난의 뉘앙스를 보존했습니다.
- source_word: לְאַחֲרִיתָהּ
  english_pob_choice: when its end comes
  chosen_korean: 그것의 끝이 오면
  alternatives_korean:
  - 그것의 마지막이 오면
  - 그 일의 끝이 오면
  - 그것의 종말이 오면
  lexicon: WLC / HALOT
  rationale: 여성형 접미사의 구체적 선행사는 불분명하므로, 영어 POB처럼 사태 전체를 가리키는 중립적 표현으로 처리해 경고의 초점을 유지했습니다.
theological_decisions:
- issue: ‘여성형 접미사’의 지시 대상
  chosen_reading: 접미사는 앞의 부패한 예언-제사장 질서 전체를 가리키는 것으로 보고, 한국어에는 중립적인 ‘그것’으로 반영했습니다.
  alternative_readings:
  - 땅/성읍의 ‘그녀의 끝’으로 옮김
  - 문법적 형식을 따라 더 직역적으로 처리
  rationale: 본문의 초점은 특정 여성 선행사보다 현재의 부패한 상태가 맞이할 결말에 있습니다. 중립적 대명사는 경고의 기능을 가장 분명하게 드러냅니다.
  doctrine_reference: 예언자적 심판 경고의 문맥 유지
- issue: ‘그들의 손을 빌려’의 의미
  chosen_reading: 제사장들의 통치가 예언자들과의 결탁 혹은 의존 관계 속에서 이루어진다는 뜻으로 읽었습니다.
  alternative_readings:
  - 예언자들의 지시 아래 다스림
  - 예언자들의 권위로 다스림
  - 그들의 손으로 직접 다스림
  rationale: 히브리어 관용구는 난해하지만, 본문의 고발은 종교 지도층의 공모와 왜곡된 권력 행사에 있습니다. 그래서 모호성을 지우지 않되 관계성을 드러내는 표현을 택했습니다.
  doctrine_reference: 예언자-제사장 부패에 대한 선지자적 책망
