  naturalness: ‘그들의 손을 빌려 다스리며’는 현대 한국어에서 어색하고 의미 관계가 불명확합니다. ‘예언자들의 권세로 다스립니다’는 영어 POB의 본문 선택을 자연스럽게 반영합니다. ‘그것의 끝’은 다소 딱딱하지만 선행사가 불명확한 원문의 수사적 모호성을 보존하는 안전한 표현입니다.
  terminology: ‘예언자’, ‘제사장’, ‘내 백성’, ‘다스리다’는 문맥과 현대 표준어 합쇼체에 적절합니다. ‘예언자들의 권세로’는 난해한 히브리어 구문의 한 해석임을 주석에서 명시하고, 다른 가능성을 보존해야 합니다.
