  rationale: 현재/최근 과거 양쪽이 가능한 분사의 모호성을 본문과 각주에서 일관되게 보존했습니다. 또한 하나님의 말씀=불, 이 백성=나무라는 원문의 병렬 은유와 단수 ‘네 입’ 대 복수 ‘너희’의 전환을 유지했습니다. 원문에 명시된 불의 소멸 작용은 한국어에서 자연스럽게 ‘그 불이’로 밝혔습니다.
