id: JER.5.14
reference: Jeremiah 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת יַ֚עַן דַּבֶּרְ/כֶ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה הִנְ/נִ֣י נֹתֵן֩ דְּבָרַ֨/י בְּ/פִ֜י/ךָ לְ/אֵ֗שׁ וְ/הָ/עָ֥ם הַ/זֶּ֛ה עֵצִ֖ים וַ/אֲכָלָֽתַ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/014.yaml
  text: 'Therefore thus says Yahweh[a], the God of hosts: Because you speak this word, behold, I am making my words in your mouth fire, and this people wood[c][b], and it will consume them.'
  footnotes:
  - marker: a
    text: Or 'Because you have spoken this word.' The Hebrew participle may be understood with present or recent-past force.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am giving my words in your mouth as fire.' The Hebrew verb is literally 'giving,' but the sense is that God causes Jeremiah's words to function like fire.
    reason: lexical_alternative
  - marker: c
    text: Or 'this people [as] wood' or 'firewood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 하나님 야훼께서 이렇게 말씀하십니다. “너희가 이 말을 하므로[a], 보라, 내가 내 말을 네 입에 불이 되게 하고[b] 이 백성을 나무가 되게 하겠습니다[c]. 그 불이 그들을 삼킬 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희가 이 말을 하므로’는 히브리어 분사를 옮긴 것입니다. 문맥에 따라 ‘너희가 이 말을 하였으므로’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘내 말들을 네 입에 불로 주겠다’입니다. 히브리어 ‘말’은 복수형이며, 하나님께서 예레미야의 입에 둔 말씀을 불처럼 작용하게 하신다는 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나무’는 불에 타는 목재를 가리킵니다. ‘장작’ 또는 ‘불쏘시개’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그러므로
  lexicon: HALOT
  rationale: 앞 문맥의 판단을 받아 결론을 여는 인과·추론 접속사로 자연스럽게 살렸습니다.
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת
  english_pob_choice: Yahweh, the God of hosts
  chosen_korean: 만군의 하나님 야훼
  alternatives_korean:
  - 하늘의 군대의 하나님 야훼
  - 군대의 하나님 야훼
  lexicon: HALOT
  rationale: YHWH는 프로젝트 기준대로 야훼로 옮기고, צְבָאוֹת은 군사·우주적 위력을 살려 만군의 하나님으로 옮겼습니다.
- source_word: יַעַן דַּבֶּרְכֶם אֶת הַדָּבָר הַזֶּה
  english_pob_choice: Because you speak this word
  chosen_korean: 너희가 이 말을 하였으므로
  alternatives_korean:
  - 너희가 이 말을 하고 있으므로
  - 너희가 이 말을 한 까닭에
  lexicon: HALOT
  rationale: 히브리어 분사는 현재적·최근 과거적 힘을 모두 가질 수 있어, 한국어에서는 문맥상 자연한 과거 완료식으로 처리했습니다.
- source_word: הִנְנִי נֹתֵן דְּבָרַי בְּפִיךָ לְאֵשׁ
  english_pob_choice: behold, I am making my words in your mouth fire
  chosen_korean: 보라, 내가 내 말을 네 입에 불이 되게 하고
  alternatives_korean:
  - 보라, 내가 내 말을 네 입에 불로 주고
  - 보라, 내가 내 말을 네 입에 불처럼 만들고
  lexicon: HALOT
  rationale: נֹתֵן의 직역인 ‘주다’보다, 문법적으로 요구되는 상태 변화를 드러내는 ‘불이 되게 하다’가 은유를 더 정확히 전달합니다.
- source_word: הָעָם הַזֶּה עֵצִים
  english_pob_choice: this people wood
  chosen_korean: 이 백성은 나무가 되게 하리니
  alternatives_korean:
  - 이 백성은 장작이 되게 하리니
  - 이 백성은 불쏘시개가 되게 하리니
  lexicon: HALOT
  rationale: עֵצִים의 기본 뜻인 목재·나무를 살리되, 시적 비유를 위해 한국어에서는 ‘나무’로 간결하게 옮겼습니다.
- source_word: וַאֲכָלָתַם
  english_pob_choice: and it will consume them
  chosen_korean: 그 불이 그들을 삼킬 것입니다
  alternatives_korean:
  - 그 불이 그들을 태워 없앨 것입니다
  - 그 불이 그들을 먹어 치울 것입니다
  lexicon: HALOT
  rationale: אכל의 ‘먹다/소멸시키다’ 의미를 화염의 이미지에 맞게 ‘삼키다’로 옮겨, 파괴적 소멸을 보존했습니다.
theological_decisions:
- issue: 여호와의 이름 YHWH와 ‘만군의 하나님’의 병렬 표현
  chosen_reading: 만군의 하나님 야훼
  alternative_readings:
  - 야훼, 만군의 하나님
  - 만군의 하나님, 야훼
  rationale: 히브리어의 호칭 결합을 자연스러운 한국어 어순으로 압축하되, 고유명사 야훼를 유지해 이름-칭호의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘너희’와 ‘네’의 인칭 전환
  chosen_reading: 앞부분은 복수 ‘너희’, ‘네 입’은 단수
  alternative_readings:
  - 전체를 복수로 통일
  - 전체를 단수로 통일
  rationale: 히브리어가 앞에서는 복수, 뒤에서는 단수로 전환하므로, 예레미야 개인에게 주어질 말씀의 도구성을 드러내기 위해 그 전환을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy #5'
