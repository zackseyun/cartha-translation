  source_fidelity: 개정이 필요합니다. 히브리어의 분사 דַּבֶּרְכֶם은 현재적 또는 최근 과거적 의미가 가능하므로, 본문의 과거형 ‘하였으므로’와 각주에서 말하는 ‘현재적 뉘앙스’가 서로 맞지 않습니다. 또한 נֹתֵן은 현재·임박한 선언의 분사인데, 초안의 ‘되게 하고 … 되게 하리니’는 시제와 병렬 관계를 다소 흐립니다. ‘그 불’은 문맥상 자연스럽게 말씀의 불을 가리키므로 유지할 수 있습니다.
  naturalness: ‘이 백성은 나무가 되게 하리니’보다 ‘이 백성을 나무가 되게 하겠다’가 앞의 ‘내가’에 걸리는 동작과 문장 병렬을 더 자연스럽고 분명하게 드러냅니다. 인용문 안에서는 현대 표준어 합쇼체의 예언 선언으로 ‘하겠습니다/것입니다’를 사용했습니다.
  terminology: ‘야훼’와 ‘만군의 하나님’은 원문의 이름과 칭호를 적절히 보존합니다. דְּבָרַי의 복수는 ‘내 말들’보다 한국어에서 자연스러운 집합적 표현인 ‘내 말’을 쓰되, 각주에서 원문의 복수형을 밝혔습니다. עֵצִים의 비유적 목재 의미는 ‘나무’ 및 각주로 보존했습니다.
