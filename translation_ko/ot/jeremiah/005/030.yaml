lexical_decisions:
- source_word: שַׁמָּה
  english_pob_choice: appalling thing
  chosen_korean: 끔찍한 일
  alternatives_korean:
  - 공포스러운 일
  - 경악스러운 일
  - 소름 끼치는 일
  lexicon: HALOT
  rationale: 문맥상 명사 שניים의 병렬이므로, 한국어에서도 추상명사보다 사건을 가리키는 ‘일’로 옮기고, ‘끔찍한’으로 충격성과 경악의 뉘앙스를 살렸습니다.
- source_word: וְשַׁעֲרוּרָה
  english_pob_choice: and horrible thing
  chosen_korean: 무서운
  alternatives_korean:
  - 소름 끼치는
  - 끔찍한
  - 섬뜩한
  lexicon: HALOT
  rationale: 앞의 표현과 함께 강도를 더하는 결합이므로, 중복되지 않게 ‘무서운’으로 옮겨 두 표현이 겹치며 증폭되는 효과를 살렸습니다.
- source_word: נִהְיְתָה
  english_pob_choice: has happened
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 생겼습니다
  - 벌어졌습니다
  - 발생했습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 결과 상태를 자연스러운 한국어 서술로 옮기되, 예언서 문맥의 충격적인 사건성을 유지하기 위해 ‘일어났습니다’를 선택했습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 그 땅에는
  alternatives_korean:
  - 땅에
  - 그 나라에는
  - 그 땅에서
  lexicon: HALOT
  rationale: 예언서의 관용적 표현인 ‘the land’를 한국어 성경 어법에 맞게 ‘그 땅’으로 옮기고, 문장 흐름을 위해 부사격 조사 ‘에는’을 덧붙였습니다.
theological_decisions:
- issue: 예언자적 탄식의 강도 보존
  chosen_reading: 두 부정적 명사를 자연스러운 한국어 감탄형으로 살려, 단순한 정보 전달이 아니라 도덕적 충격을 드러내게 했습니다.
  alternative_readings:
  - ‘끔찍한 일과 무서운 일’처럼 더 직역적으로 옮기는 방식
  - ‘경악스러운 사건’처럼 한 항목으로 압축하는 방식
  rationale: 히브리어의 병렬 강조를 약화시키지 않으면서도 현대 한국어 독자가 즉각 체감할 수 있는 표현이 필요합니다.
  doctrine_reference: 예언서의 심판 경고와 죄악 고발의 수사
