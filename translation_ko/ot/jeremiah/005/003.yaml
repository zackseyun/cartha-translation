id: JER.5.3
reference: Jeremiah 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהֹוָ֗ה עֵינֶי/ךָ֮ הֲ/ל֣וֹא לֶ/אֱמוּנָה֒ הִכִּ֤יתָה אֹתָ/ם֙ וְֽ/לֹא חָ֔לוּ כִּלִּיתָ֕/ם מֵאֲנ֖וּ קַ֣חַת מוּסָ֑ר חִזְּק֤וּ פְנֵי/הֶם֙ מִ/סֶּ֔לַע מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/003.yaml
  text: O Yahweh[a], are not your eyes on faithfulness? You struck them, but they did not feel pain; you consumed them, but they refused to accept discipline. They made their faces harder than rock[b]; they refused to return.
  footnotes:
  - marker: a
    text: Or 'they did not weaken,' 'they did not become sick,' or 'they did not feel pain.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they refused to repent.' The Hebrew literally says 'to return,' a common prophetic expression for turning back to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주의 눈이 신실함을 보지 않으십니까? 주께서 그들을 치셨으나 그들은 아프지 않았고, 주께서 그들을 멸하셨으나 그들은 훈계를 받기를 거부하였습니다. 그들은 자기 얼굴을 바위보다 더 굳게 하였고, 돌아오기를 거부하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아프지 않았다’는 히브리어의 ‘약해지지 않았다’, ‘병들지 않았다’, ‘고통을 느끼지 않았다’까지도 포함할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 곧 ‘회개하기를 거부하였다’는 뜻으로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘돌아오다’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהֹוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼여
  alternatives_korean:
  - 주님이여
  - 여호와여
  lexicon: HALOT
  rationale: 직접 호격으로 부르는 문맥을 살리되, 본 프로젝트 기본어인 야훼를 사용해 원문 표지를 유지하였습니다.
- source_word: עֵינֶיךָ הֲלוֹא לֶאֱמוּנָה
  english_pob_choice: are not your eyes on faithfulness?
  chosen_korean: 주의 눈이 신실함을 보지 않으십니까?
  alternatives_korean:
  - 주의 눈이 신실함을 향하지 않으십니까?
  - 주의 눈이 믿음을 보지 않으십니까?
  lexicon: HALOT
  rationale: ‘눈’의 구체적 이미지를 유지하면서, לֶאֱמוּנָה는 문맥상 ‘신실함’이 가장 자연스럽고 도덕적 함의를 잘 드러냅니다.
- source_word: וְלֹא חָלוּ
  english_pob_choice: they did not feel pain
  chosen_korean: 그들은 아프지 않았고
  alternatives_korean:
  - 그들은 고통을 느끼지 않았고
  - 그들은 몸살을 앓지 않았고
  lexicon: HALOT
  rationale: 문맥상 징계에 대한 반응 부재를 한국어로 자연스럽게 전달하면서, 육체적·감각적 고통의 결여를 간결하게 살렸습니다.
- source_word: חִזְּקוּ פְנֵיהֶם מִסֶּלַע
  english_pob_choice: They made their faces harder than rock
  chosen_korean: 그들은 자기 얼굴을 바위보다 더 굳게 하였고
  alternatives_korean:
  - 그들은 얼굴을 바위보다 더 단단하게 하였고
  - 그들은 얼굴을 돌보다 더 굳게 하였고
  lexicon: HALOT
  rationale: 관용적 표현을 직역하되 한국어에서 이해 가능한 비교 구조로 옮겨, 완고함의 이미지를 유지하였습니다.
- source_word: מֵאֲנ֖וּ לָשׁוּב
  english_pob_choice: they refused to return
  chosen_korean: 돌아오기를 거부하였습니다
  alternatives_korean:
  - 돌이키기를 거부하였습니다
  - 회개하기를 거부하였습니다
  lexicon: HALOT
  rationale: 본문의 기본 뜻인 ‘돌아오다’를 유지하여, 예언서에서 함의될 수 있는 회개 의미를 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: שׁוּב의 예언서적 회개 함의
  chosen_reading: 돌아오기를 거부하였습니다
  alternative_readings:
  - 회개하기를 거부하였습니다
  - 돌이키기를 거부하였습니다
  rationale: 히브리어의 문자적 동작 이미지인 ‘돌아오다’를 본문에 남겨, 야훼께로의 귀환이라는 언약적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3, theological tension should be preserved rather than prematurely resolved.
