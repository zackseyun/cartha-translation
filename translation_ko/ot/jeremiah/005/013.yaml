  text: וְ/הַ/נְּבִיאִים֙ יִֽהְי֣וּ לְ/ר֔וּחַ וְ/הַ/דִּבֵּ֖ר אֵ֣ין בָּ/הֶ֑ם כֹּ֥ה יֵעָשֶׂ֖ה לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/013.yaml
  text: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
  footnotes:
  - marker: a
    text: Or 'spirit' or 'breath' for 'wind.' The Hebrew word רוּחַ can carry any of these senses; here it likely means the prophets are empty or insubstantial.
    reason: lexical_alternative
translation:
  language: ko
  text: 예언자들은 바람이 될 것이며[a], 그들 안에는 말이 없습니다. 그러므로 그들에게 그렇게 행해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영’ 또는 ‘숨결’로도 옮길 수 있습니다. 히브리어 רוּחַ는 이러한 의미들을 가질 수 있으며, 여기서는 예언자들이 공허하고 실체가 없는 존재라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּבִיאִים
  english_pob_choice: And the prophets
  chosen_korean: 예언자들은
  alternatives_korean:
  - 그 예언자들은
  - 그리고 예언자들은
  lexicon: HALOT
  rationale: 문맥상 대상을 지시하는 정관성은 한국어에서 주격 조사로 자연스럽게 처리할 수 있어, 불필요한 접속사 없이 간결하게 옮겼습니다.
- source_word: יִהְיוּ לְרוּחַ
  english_pob_choice: will become wind
  chosen_korean: 바람이 될 것이며
  alternatives_korean:
  - 영이 될 것이며
  - 숨결이 될 것이며
  lexicon: HALOT
  rationale: רוּחַ의 다의성을 살리되, 이 문맥의 조롱과 공허함을 가장 직접적으로 드러내는 ‘바람’을 본문에 두었습니다.
- source_word: וְהַדִּבֵּר אֵין בָּהֶם
  english_pob_choice: and the word is not in them
  chosen_korean: 그들 안에는 말씀이 없습니다
  alternatives_korean:
  - 그들 안에 말이 없습니다
  - 그들 안에는 메시지가 없습니다
  lexicon: HALOT
  rationale: דִּבֵּר는 단순한 발화보다 ‘말씀/말’의 내용성을 띠므로, 짧고 대조적인 구조를 살리며 ‘말씀’으로 옮겼습니다.
- source_word: יֵעָשֶׂה לָהֶם
  english_pob_choice: it will be done to them
  chosen_korean: 그들에게 그렇게 될 것입니다
  alternatives_korean:
  - 그들에게 그렇게 행해질 것입니다
  - 그렇게 그들에게 이루어질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 비인칭 수동을 한국어에서 과도하게 행위자를 보충하지 않으면서, 경고의 어조를 유지하는 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: רוּחַ의 의미를 본문에서 어떻게 처리할지
  chosen_reading: ‘바람’으로 본문에 두고, 다의성은 각주에서 보존합니다.
  alternative_readings:
  - 영
  - 숨결
  rationale: 예언자들의 공허함을 공격하는 문맥이므로 ‘바람’이 주는 허무함과 비실체성을 살리는 것이 본문 의미에 가장 충실합니다. 동시에 히브리어의 의미 범위를 각주로 열어 둡니다.
  doctrine_reference: Translation philosophy §3, 의미의 긴장 보존
