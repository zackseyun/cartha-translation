    issue: ‘말씀’이 원문의 의미를 다소 특정합니다.
    rationale: וְהַדִּבֵּר는 ‘말/말하는 것/메시지’를 뜻하며, 이 절 자체는 그것을 명시적으로 하나님의 말씀으로 규정하지 않습니다. ‘말’로 옮겨 해석적 확정을 피하는 것이 좋습니다.
  - severity: medium
    issue: ‘그들에게 그렇게 될 것입니다’가 원문의 수동성을 약화합니다.
