id: JER.5.20
reference: Jeremiah 5:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַגִּ֥ידוּ זֹ֖את בְּ/בֵ֣ית יַעֲקֹ֑ב וְ/הַשְׁמִיע֥וּ/הָ בִ/יהוּדָ֖ה לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/020.yaml
  text: 'Declare this in the house of Jacob[a], and proclaim it in Judah, saying:'
  footnotes:
  - marker: a
    text: Or 'make it heard in Judah.' The Hebrew verb literally means 'cause it to be heard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 야곱의 집에 선언하고, 유다에서 그것을 선포하여 말하십시오:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선포하여’는 히브리어 동사의 ‘듣게 하다’라는 원뜻을 공적으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  english_pob_choice: Declare
  chosen_korean: 선언하고
  alternatives_korean:
  - 말하고
  - 알리고
  - 선포하고
  lexicon: HALOT
  rationale: 공적이고 권위 있는 발표의 뉘앙스를 살리기 위해, 단순한 전달보다 격식 있는 ‘선언하다’를 택했습니다.
- source_word: בְּבֵית יַעֲקֹב
  english_pob_choice: in the house of Jacob
  chosen_korean: 야곱의 집에
  alternatives_korean:
  - 야곱 집안에
  - 야곱의 집 안에
  - 야곱의 집 가운데
  lexicon: HALOT
  rationale: בית יעקב의 집합적·언약적 표현을 자연스러운 소유격 구조로 옮겨, 혈통 공동체를 가리키는 느낌을 유지했습니다.
- source_word: וְהַשְׁמִיעוּהָ
  english_pob_choice: and proclaim it
  chosen_korean: 그것을 선포하여
  alternatives_korean:
  - 그것을 들리게 하여
  - 그것을 알리게 하여
  - 그것을 외쳐
  lexicon: HALOT
  rationale: 히필의 ‘듣게 하다, 들리게 하다’라는 원뜻을 공적 전달의 한국어로 풀어, 단순히 말하는 것이 아니라 널리 알리게 하는 뜻을 살렸습니다.
- source_word: לֵאמֹר
  english_pob_choice: 'saying:'
  chosen_korean: '말하십시오:'
  alternatives_korean:
  - '이르기를:'
  - '이렇게 말하여:'
  - '말하라고:'
  lexicon: HALOT
  rationale: 인용 도입 공식으로서의 기능을 살리되, 현대 한국어에서 자연스러운 전환 표현으로 옮겼습니다.
theological_decisions:
- issue: 야곱의 집 / 유다의 병렬 구조
  chosen_reading: 이스라엘 전체를 가리키는 ‘야곱의 집’과 남유다를 가리키는 ‘유다’를 병렬로 보존했습니다.
  alternative_readings:
  - 두 표현을 모두 ‘이스라엘’로 통합
  - 의역하여 ‘이스라엘 백성’으로 정리
  rationale: 본문은 두 대상 영역을 구분해 공표 범위를 넓히므로, 그 병렬을 평탄화하지 않고 그대로 살리는 것이 문맥에 충실합니다.
  doctrine_reference: 예언자적 선포의 대상 범위와 언약 공동체의 역사적 분화
- issue: 히필 동사의 공시성
  chosen_reading: ‘선포하다’와 ‘들리게 하다’의 의미를 살려 공개적·공동체적 전달로 이해했습니다.
  alternative_readings:
  - 단순히 ‘말하다’로 축소
  - ‘외치다’로 감정적 강세를 부여
  rationale: 원문은 비밀 전달이 아니라 공개적 공표를 요구하므로, 공시적 성격이 드러나는 표현을 택했습니다.
  doctrine_reference: 예언 말씀의 공개 선포성과 공동체적 책임
