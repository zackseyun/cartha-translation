id: JER.5.6
reference: Jeremiah 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּן֩ הִכָּ֨/ם אַרְיֵ֜ה מִ/יַּ֗עַר זְאֵ֤ב עֲרָבוֹת֙ יְשָׁדְדֵ֔/ם נָמֵ֤ר שֹׁקֵד֙ עַל עָ֣רֵי/הֶ֔ם כָּל הַ/יּוֹצֵ֥א מֵ/הֵ֖נָּה יִטָּרֵ֑ף כִּ֤י רַבּוּ֙ פִּשְׁעֵי/הֶ֔ם עָצְמ֖וּ משבותי/הם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/006.yaml
  text: Therefore a lion from the forest strikes them down[a]; a wolf of the deserts devastates them; a leopard keeps watch over their cities. Everyone who goes out from them will be torn apart, because their transgressions are many[b]; their apostasies have grown strong.
  footnotes:
  - marker: a
    text: Or 'a wolf of the evenings.' The Hebrew phrase זְאֵב עֲרָבוֹת has also been understood in connection with evening-time predation, but here it is rendered 'a wolf of the deserts' following the more straightforward sense of the noun as desert plains/steppe regions.
    reason: lexical_alternative
  - marker: b
    text: Or 'their backslidings.' The Hebrew term refers to repeated turnings away from covenant faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 숲에서 나온 사자가 그들을 쳐서 쓰러뜨리고, 사막의 늑대가 그들을 황폐하게 하며, 표범이 그들의 도시들 곁에서 엿보고 있습니다. 그 도시들에서 나가는 사람은 누구나 찢길 것입니다. 이는 그들의 범죄[a]가 많고 그들의 배도[b]가 심해졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 반역’. 히브리어 פֶּשַׁע는 권위와 언약에 거스르는 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 거듭 돌아선 일들’. 히브리어 표현은 반복적으로 언약의 충실함에서 돌아서는 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּם / אַרְיֵה מִיַּעַר
  english_pob_choice: a lion from the forest strikes them down
  chosen_korean: 숲에서 나온 사자가 그들을 쳐서 쓰러뜨리고
  alternatives_korean:
  - 숲에서 나온 사자가 그들을 공격하고
  - 숲에서 나온 사자가 그들을 때려눕히고
  lexicon: HALOT
  rationale: 히트/타격의 강한 동사를 살리되, 짐승 이미지에 맞는 자연스러운 한국어로 옮겼습니다. '쳐서 쓰러뜨리고'는 lethal attack의 강도를 유지합니다.
- source_word: זְאֵב עֲרָבוֹת
  english_pob_choice: a wolf of the deserts
  chosen_korean: 사막의 늑대
  alternatives_korean:
  - 광야의 늑대
  - 들판의 늑대
  lexicon: HALOT
  rationale: עֲרָבוֹת을 'deserts/steppe'의 의미로 읽은 POB의 선택을 따라, 사막 이미지를 간결하게 살렸습니다. '사막의 늑대'는 본문이 주는 황폐한 포식자 이미지를 잘 드러냅니다.
- source_word: יְשָׁדְדֵם / יִטָּרֵף
  english_pob_choice: devastates them / will be torn apart
  chosen_korean: 그들을 황폐하게 하며 / 찢길 것입니다
  alternatives_korean:
  - 그들을 약탈하며 / 산산이 찢길 것입니다
  - 그들을 멸망시키며 / 뜯겨 찢길 것입니다
  lexicon: HALOT
  rationale: שׁדד는 단순한 약탈보다 더 넓은 파괴와 황폐화를 뜻하므로 '황폐하게 하며'로 옮겼습니다. יִטָּרֵף은 맹수에게 찢기는 뜻을 살려 '찢길 것입니다'로 번역했습니다.
- source_word: פִּשְׁעֵיהֶם / משבותיהם
  english_pob_choice: their transgressions ... their apostasies
  chosen_korean: 그들의 범죄 ... 그들의 배도
  alternatives_korean:
  - 그들의 허물 ... 그들의 돌아섬
  - 그들의 반역 ... 그들의 등짐
  lexicon: HALOT
  rationale: פֶּשַׁע는 단순한 실수보다 언약을 어기는 '범죄'나 '반역'의 뉘앙스가 강해 '범죄'를 택했습니다. ketiv/qere에 반영된 שוב 계열은 반복적 이탈을 뜻하므로 '배도'가 문맥상 가장 분명합니다.
theological_decisions:
- issue: 심판의 원인을 죄의 누적으로 제시하는 표현
  chosen_reading: 그들의 범죄가 많고, 그들의 배도가 강해졌기 때문입니다
  alternative_readings:
  - 그들의 범죄가 많고, 그들의 돌아섬이 커졌기 때문입니다
  - 그들의 반역이 많고, 그들의 이탈이 강해졌기 때문입니다
  rationale: 본문은 짐승의 포식 이미지 뒤에 언약 파기의 누적을 심판 근거로 제시합니다. '배도'는 단순한 도덕적 실패가 아니라 신앙적·언약적 이탈이라는 신학적 무게를 유지합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
