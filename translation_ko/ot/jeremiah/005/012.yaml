  text: כִּֽחֲשׁוּ֙ בַּ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֹא ה֑וּא וְ/לֹא תָב֤וֹא עָלֵ֨י/נוּ֙ רָעָ֔ה וְ/חֶ֥רֶב וְ/רָעָ֖ב ל֥וֹא נִרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/012.yaml
  text: They have denied Yahweh and said, “He is not there, and no disaster will come upon us; we will not see sword or famine.”
  footnotes:
  - marker: a
    text: Or, “He will do nothing,” or “It is not he.” The Hebrew is brief and elliptical.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 야훼를 부인하고 말합니다. 「그분은 계시지 않습니다」[a]라고 하며, 「우리에게 재앙이 닥치지 않을 것이며, 칼과 기근도 보지 않을 것입니다」라고 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분은 아무 일도 하지 않으십니다”, 또는 “그분은 아닙니다”. 히브리어는 짧고 생략적입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּֽחֲשׁוּ בַּ/יהוָ֔ה
  english_pob_choice: They have denied Yahweh
  chosen_korean: 야훼를 부인하며
  alternatives_korean:
  - 야훼를 부정하며
  - 야훼를 거짓되게 대하며
  - 야훼를 속이며
  lexicon: HALOT
  rationale: בְּ + יהוה 앞의 כחשׁ은 단순한 거짓말보다 야훼에 대한 부인·배반의 뜻이 강하므로, 본문 흐름에 맞게 ‘부인하다’로 옮겼습니다.
- source_word: לֹא הוּא
  english_pob_choice: He is not there
  chosen_korean: 그분은 계시지 않습니다
  alternatives_korean:
  - 그분은 아닙니다
  - 그분은 아무것도 아닙니다
  - 그분은 아무 일도 하지 않으십니다
  lexicon: HALOT
  rationale: 히브리어는 매우 간결하고 생략적이므로, 존재 부정의 핵심을 살려 ‘계시지 않습니다’로 옮기되, 의미를 과도하게 확장하지 않았습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 화
  - 악
  lexicon: HALOT
  rationale: 예언서의 심판 문맥에서 רָעָה는 도덕적 ‘악’보다 닥쳐오는 심판적 재난을 가리키므로, 현대 한국어에서 자연스러운 ‘재앙’을 택했습니다.
- source_word: חֶרֶב וְ/רָעָב
  english_pob_choice: sword or famine
  chosen_korean: 칼과 기근
  alternatives_korean:
  - 전쟁과 기근
  - 칼과 굶주림
  lexicon: HALOT
  rationale: כֶּרֶב/חֶרֶב은 심판의 상징으로서 문자적 ‘칼’을 살리는 것이 좋고, רָעָב은 일반적 배고픔이 아니라 공동체적 기근이므로 ‘기근’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 현존 부정인 לֹא הוּא의 해석
  chosen_reading: ‘그분은 계시지 않습니다’로 존재 부정의 뉘앙스를 살리되, 주석 없이 판단을 좁히지 않았습니다.
  alternative_readings:
  - 그분은 아닙니다
  - 그분은 아무 일도 하지 않으십니다
  - 그분은 아무것도 아닙니다
  rationale: 본문은 야훼의 존재·현존·행동 가능성에 대한 거부를 모두 열어 두는 짧은 표현이므로, 해석을 하나로 고정하기보다 긴장을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
