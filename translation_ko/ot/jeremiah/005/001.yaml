id: JER.5.1
reference: Jeremiah 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁוֹטְט֞וּ בְּ/חוּצ֣וֹת יְרוּשָׁלִַ֗ם וּ/רְאוּ נָ֤א וּ/דְעוּ֙ וּ/בַקְשׁ֣וּ בִ/רְחוֹבוֹתֶ֔י/הָ אִם תִּמְצְא֣וּ אִ֔ישׁ אִם יֵ֛שׁ עֹשֶׂ֥ה מִשְׁפָּ֖ט מְבַקֵּ֣שׁ אֱמוּנָ֑ה וְ/אֶסְלַ֖ח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/001.yaml
  text: Roam through the streets of Jerusalem[a], and please look and know, and search in her squares, whether you can find a man, whether there is one who does justice, who seeks faithfulness[b], and I will forgive her.
  footnotes:
  - marker: a
    text: Or 'truth' for 'faithfulness.' The Hebrew אֱמוּנָה can denote faithfulness, reliability, or truthfulness.
    reason: lexical_alternative
  - marker: b
    text: '''A man'' renders the singular masculine Hebrew אִישׁ; the sense is that even one such person could not be found.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘의 거리들을 두루 다니며, 보십시오. 그리고 아십시오. 또 그 광장들에서 찾아보십시오. 혹시 한 사람이라도 찾을 수 있는지, 곧 정의를 행하고 신실함을 찾는 사람이 있는지 말입니다. 그러면 내가 그 도시를 용서하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֱמוּנָה는 이 문맥에서 '신실함' 외에 '진리' 또는 '신뢰성'을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אִישׁ은 단수 남성형이지만, 여기서는 조건에 맞는 사람 한 명이라도 있는지 묻는 대표적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹטְטוּ
  english_pob_choice: Roam through
  chosen_korean: 두루 다니며
  alternatives_korean:
  - 이리저리 다니며
  - 두루 돌아다니며
  lexicon: HALOT
  rationale: 도시 전체를 샅샅이 움직이며 살피라는 명령이므로, 자연스러운 현대 한국어로 '두루 다니며'가 탐색적 이동의 뉘앙스를 잘 살립니다.
- source_word: בְּחוּצוֹת / בִּרְחוֹבוֹתֶיהָ
  english_pob_choice: through the streets / in her squares
  chosen_korean: 거리들 / 그 광장들
  alternatives_korean:
  - 길들 / 넓은 곳들
  - 거리들 / 넓은 광장들
  lexicon: HALOT
  rationale: חוצות와 רחובות은 도시 안의 공개된 거리·넓은 공간을 가리키므로, 문맥의 탐색 동선을 살려 각각 '거리들', '광장들'로 옮겼습니다. '그'는 예루살렘의 여성형 인칭을 반영합니다.
- source_word: אִם תִּמְצְאוּ אִישׁ
  english_pob_choice: whether you can find a man
  chosen_korean: 혹시 한 사람이라도 찾을 수 있는지
  alternatives_korean:
  - 한 남자를 찾을 수 있는지
  - 사람 한 명이라도 찾을 수 있는지
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 성별 표지를 그대로 살리면 '사람/남자' 사이에서 한국어가 어색해질 수 있어, 대표적 단수라는 검색 조건을 드러내는 '한 사람이라도'로 옮기되, 본문 주어의 단수·대표성을 보존했습니다.
- source_word: עֹשֶׂה מִשְׁפָּט מְבַקֵּשׁ אֱמוּנָה
  english_pob_choice: who does justice, who seeks faithfulness
  chosen_korean: 정의를 행하고 신실함을 찾는 사람
  alternatives_korean:
  - 의를 행하고 믿음직함을 찾는 사람
  - 공의를 행하고 신실함을 구하는 사람
  lexicon: HALOT
  rationale: מִשְׁפָּט은 여기서 행위로서의 정의이므로 '정의를 행하다'로, אֱמוּנָה는 언약적·윤리적 신실성을 살려 '신실함'으로 옮겼습니다. '찾는다'는 מקור의 동사를 따라 실제로 그러한 사람을 수색하는 문맥을 유지합니다.
- source_word: וְאֶסְלַח לָהּ
  english_pob_choice: and I will forgive her
  chosen_korean: 그러면 내가 그 도시를 용서하겠습니다
  alternatives_korean:
  - 그리고 내가 그녀를 용서하겠습니다
  - 그러면 내가 그것을 용서하겠습니다
  lexicon: HALOT
  rationale: 여성형 대명사 לָהּ는 예루살렘/도시를 가리키므로, 한국어에서는 문맥상 자연스러운 '그 도시'로 풀어 사람처럼 들리는 어색함을 피했습니다. '용서하겠습니다'는 פָּלַח이 아닌 סלח의 직접적 의미를 반영합니다.
theological_decisions:
- issue: 예루살렘의 여성형 인칭과 도시 의인화
  chosen_reading: 문맥상 예루살렘을 '그 도시'로 번역해 여성형 대명사의 지시 대상을 분명히 하되, 의인화는 유지합니다.
  alternative_readings:
  - 그녀를
  - 예루살렘을
  rationale: 히브리어는 도시를 여성형으로 다루지만 한국어에서는 인칭대명사 '그녀'가 지나치게 인격화될 수 있습니다. '그 도시'는 지시 대상의 명확성과 한국어 자연스러움을 함께 살립니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 2
