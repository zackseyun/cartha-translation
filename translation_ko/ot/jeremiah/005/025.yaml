id: JER.5.25
reference: Jeremiah 5:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲוֺנוֹתֵי/כֶ֖ם הִטּוּ אֵ֑לֶּה וְ/חַטֹּ֣אותֵי/כֶ֔ם מָנְע֥וּ הַ/טּ֖וֹב מִ/כֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/025.yaml
  text: Your iniquities have turned these away[b][a], and your sins have withheld the good from you.
  footnotes:
  - marker: a
    text: Or 'these things'; the referent is the blessings just mentioned in the preceding context.
    reason: lexical_alternative
  - marker: b
    text: Or 'good things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들의 죄악은 이것들을 물리쳤고, 당신들의 죄는 당신들에게서 좋은 것을 막아 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 앞서 언급된 복이나 좋은 상태를 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 הַטּוֹב는 ‘좋은 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנוֹתֵיכֶם
  english_pob_choice: your iniquities
  chosen_korean: 당신들의 죄악
  alternatives_korean:
  - 당신들의 불의
  - 당신들의 죄책
  - 당신들의 죄
  lexicon: HALOT
  rationale: עָוֹן은 단순한 ‘죄’보다 더 무겁게 ‘죄악/불의’와 그 책임을 포함하므로, 뒤의 חַטֹּאותֵיכֶם과 구별되도록 ‘죄악’으로 옮겼습니다.
- source_word: הִטּוּ
  english_pob_choice: have turned ... away
  chosen_korean: 물리쳤고
  alternatives_korean:
  - 돌려놓았고
  - 비켜가게 했고
  - 치워 버렸고
  lexicon: HALOT
  rationale: 문맥상 앞서 언급된 복이나 좋은 것들이 백성에게서 멀어지게 된 결과를 나타내므로, ‘돌려놓다’보다 자연스럽게 작용 결과를 드러내는 ‘물리치다’를 택했습니다.
- source_word: אֵלֶּה
  english_pob_choice: these
  chosen_korean: 이것들을
  alternatives_korean:
  - 이것들
  - 이러한 것들을
  lexicon: HALOT
  rationale: 히브리어 지시어의 지시 대상을 본문 밖으로 과도하게 확장하지 않고, 앞 문맥의 복들을 가리키는 연결감을 살리기 위해 ‘이것들’을 유지했습니다.
- source_word: וְחַטֹּאותֵיכֶם
  english_pob_choice: and your sins
  chosen_korean: 당신들의 죄는
  alternatives_korean:
  - 당신들의 죄과는
  - 당신들의 허물은
  lexicon: HALOT
  rationale: חַטָּאת는 표준적인 ‘죄’이므로, 앞의 עָוֹן과 중복되지 않도록 단순히 ‘죄’로 옮겼습니다.
- source_word: מָנְעוּ הַטּוֹב מִכֶּם
  english_pob_choice: have withheld the good from you
  chosen_korean: 당신들에게서 좋은 것을 막아 버렸습니다
  alternatives_korean:
  - 당신들에게서 선한 것을 거두었습니다
  - 당신들에게서 복을 빼앗았습니다
  lexicon: HALOT
  rationale: הַטּוֹב는 문맥상 일반적인 ‘좋은 것/좋은 상태’를 가리키므로, 추상화된 ‘선’보다 자연스러운 ‘좋은 것’을 택했고, מָנַע의 차단·박탈 의미를 살려 ‘막아 버리다’로 옮겼습니다.
theological_decisions:
- issue: אֵלֶּה의 지시 대상을 본문에서 명시할지 여부
  chosen_reading: 본문에서는 ‘이것들’로 두고, 지시 대상을 열어 둡니다.
  alternative_readings:
  - ‘이것들’을 ‘이 복들’로 구체화하기
  - ‘이것들’을 ‘이 비’ 또는 ‘이러한 재앙’으로 풀이하기
  rationale: 히브리어는 지시 대상을 명시하지 않으므로, 앞뒤 문맥이 밝히는 범위 안에서만 이해되도록 두는 편이 소스-정합적입니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; never paraphrase beyond what the source warrants.'
