  source_fidelity: 핵심 의미는 충실합니다. וְגַם의 강조·양보적 연결, ‘그 날들’, 야훼의 신탁 공식, 그리고 전면적 멸절을 하지 않겠다는 כָּלָה 관용구의 의미가 모두 반영되어 있습니다. 다만 ‘바로’는 히브리어의 강조를 한국어에서 ‘정확히 바로 그 날들’이라는 특정 강조로 다소 과도하게 한정할 수 있으므로 빼는 편이 안전합니다.
