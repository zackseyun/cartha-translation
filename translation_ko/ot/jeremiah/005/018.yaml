  terminology: ‘야훼’는 프로젝트의 신명 표기 원칙과 일치합니다. ‘완전히 멸망시키다’는 여기서 כָּלָה가 뜻하는 완전한 파괴/멸절을 적절히 전달하며, 심판은 있으나 전면적 종결은 아니라는 본문의 긴장을 보존합니다.
