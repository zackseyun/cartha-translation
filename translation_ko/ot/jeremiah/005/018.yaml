id: JER.5.18
reference: Jeremiah 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֛ם בַּ/יָּמִ֥ים הָ/הֵ֖מָּה נְאֻם יְהֹוָ֑ה לֹֽא אֶעֱשֶׂ֥ה אִתְּ/כֶ֖ם כָּלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/018.yaml
  text: Yet even in those days[a], declares Yahweh, I will not make a full end of you.
  footnotes:
  - marker: a
    text: Or, 'I will not completely destroy you.' The Hebrew says literally, 'I will not make a full end of you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그날들에도 — 야훼의 말씀입니다 — 나는 너희를 완전히 멸망시키지는 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘너희에게 완전한 끝을 내지 않겠다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  english_pob_choice: Yet even
  chosen_korean: 그러나 바로
  alternatives_korean:
  - 그리고 또한
  - 또 그때에도
  - 하지만 그때에도
  lexicon: HALOT
  rationale: 문맥상 앞선 심판 선언을 이어 받으면서도 제한을 두는 대비가 핵심이므로, 한국어에서는 전환과 반전을 함께 드러내는 '그러나 바로'로 옮겼습니다.
- source_word: בַּ/יָּמִ֥ים הָ/הֵ֖מָּה
  english_pob_choice: in those days
  chosen_korean: 그날들에도
  alternatives_korean:
  - 그때에도
  - 그 시기에도
  - 그런 날에도
  lexicon: HALOT
  rationale: 예언 문맥의 시간 표현을 자연스럽게 살리되, 이어지는 부정과 결합된 제한의 뉘앙스를 드러내기 위해 '그날들에도'로 옮겼습니다.
- source_word: נְאֻם יְהֹוָה
  english_pob_choice: declares Yahweh
  chosen_korean: — 야훼의 말씀입니다 —
  alternatives_korean:
  - — 야훼께서 말씀하십니다 —
  - — 야훼의 선언입니다 —
  - — 야훼께서 이르십니다 —
  lexicon: HALOT
  rationale: 예언서의 공적 선언 공식을 한국어에서 자연스럽고 엄정하게 드러내기 위해 '야훼의 말씀입니다'를 사용했습니다. 인용된 신탁 형식을 유지하기 위해 대시로 삽입했습니다.
- source_word: לֹֽא אֶעֱשֶׂ֥ה ... כָּלָֽה
  english_pob_choice: I will not make a full end
  chosen_korean: 나는 너희를 완전히 멸망시키지는 않겠습니다
  alternatives_korean:
  - 나는 너희를 완전히 끝내지는 않겠습니다
  - 나는 너희에게 전멸을 내리지는 않겠습니다
  - 나는 너희를 완전히 없애지는 않겠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 '완전한 끝을 내다'를 한국어에서 어색한 직역 대신 의미가 분명한 표현으로 옮기되, 부정어로 총체적 파괴의 거절을 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신적 고유명사를 '야훼'로 옮겨, 호칭 대체가 아닌 이름 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 심판 속 보존의 긴장
  chosen_reading: 완전히 멸망시키지는 않겠습니다
  alternative_readings:
  - 완전히 파괴하지는 않겠습니다
  - 전멸시키지는 않겠습니다
  rationale: 본문은 심판을 철회하지 않으면서도 전면적 멸절은 거부하는 긴장을 담고 있으므로, 그 긴장을 한국어에서도 그대로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
