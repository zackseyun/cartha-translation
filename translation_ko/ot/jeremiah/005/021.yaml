  source_fidelity: 히브리어의 명령, ‘이제’의 촉구, 집합적 ‘백성’, לֵב의 분별·이해 의미, 그리고 눈과 귀의 병렬 대조를 대체로 충실히 반영합니다. 다만 직접 부름인 ‘백성아’ 뒤에 3인칭 ‘그들에게는’을 쓰면 원문의 직접 호소가 약해지고 지시 대상이 불필요하게 전환됩니다.
  naturalness: ‘어리석고 깨닫지 못하는 백성아!’와 ‘그들에게는’의 결합은 현대 한국어에서 호칭과 서술 시점이 어색하게 섞입니다. 직접 호소를 유지하여 ‘너희에게는’으로 통일하고, ‘분별력이 없는’으로 옮기면 לֵב의 관용적 의미도 더 자연스럽고 명료하게 전달됩니다.
