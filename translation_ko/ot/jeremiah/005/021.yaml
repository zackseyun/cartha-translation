id: JER.5.21
reference: Jeremiah 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֔את עַ֥ם סָכָ֖ל וְ/אֵ֣ין לֵ֑ב עֵינַ֤יִם לָ/הֶם֙ וְ/לֹ֣א יִרְא֔וּ אָזְנַ֥יִם לָ/הֶ֖ם וְ/לֹ֥א יִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/021.yaml
  text: Hear this now[a], foolish people without understanding, who have eyes but do not see, who have ears but do not hear.
  footnotes:
  - marker: a
    text: Literally, 'a foolish people and without heart.' Here 'heart' refers to understanding or discernment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 이제 들으십시오. 어리석고 깨닫지 못하는 백성아! 그들에게는 눈이 있으나 보지 못하고, 귀가 있으나 듣지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘어리석고 마음이 없는 백성’입니다. 여기서 ‘마음’은 이해력이나 분별력을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  english_pob_choice: Hear this now
  chosen_korean: 이것을 이제 들으십시오
  alternatives_korean:
  - 이것을 이제 들으시오
  - 이것을 들으십시오
  lexicon: HALOT
  rationale: שׁמע의 명령형 복수는 예언자적 긴급 호소이므로 ‘들으십시오’로 살리고, נָא는 공손함보다 촉구의 뉘앙스가 강해 ‘이제’로 옮겼습니다.
- source_word: עַם סָכָל
  english_pob_choice: foolish people
  chosen_korean: 어리석은 백성
  alternatives_korean:
  - 어리석은 사람들
  - 미련한 백성
  lexicon: HALOT
  rationale: עַם은 집합적 호칭이므로 ‘백성’이 자연스럽고, סָכָל은 단순 지능 부족보다 도덕·영적 어리석음을 가리켜 ‘어리석은’이 적절합니다.
- source_word: וְאֵין לֵב
  english_pob_choice: without understanding
  chosen_korean: 깨닫지 못하는
  alternatives_korean:
  - 이해가 없는
  - 마음이 없는
  lexicon: HALOT
  rationale: לֵב는 여기서 감정보다 분별과 이해의 중심을 뜻하므로, 직역적 ‘마음이 없는’보다 ‘깨닫지 못하는’이 더 정확하게 관용 의미를 드러냅니다.
- source_word: עֵינַיִם לָהֶם וְלֹא יִרְאוּ / אָזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ
  english_pob_choice: who have eyes but do not see, who have ears but do not hear
  chosen_korean: 그들에게는 눈이 있으나 보지 못하고, 귀가 있으나 듣지 못합니다
  alternatives_korean:
  - 눈은 있지만 보지 못하고 귀는 있지만 듣지 못합니다
  - 눈이 있어도 보지 못하며 귀가 있어도 듣지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 병렬적 관용구를 한국어로 자연스럽게 옮기되, ‘보다/듣다’의 반복을 유지해 예언적 역설과 책망의 강도를 살렸습니다.
theological_decisions:
- issue: ‘heart’(לֵב)의 인간 이해 중심 의미
  chosen_reading: ‘마음’의 감정어보다 ‘깨닫다/분별하다’의 의미로 옮겼습니다.
  alternative_readings:
  - ‘마음이 없는’
  - ‘이해가 없는’
  rationale: 본문은 언약 백성의 영적·도덕적 무감각을 책망합니다. 한국어에서 ‘마음’은 정서 중심으로 들리기 쉬우므로, לֵב의 성경적 인지·분별 중심을 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 집합적 단수 ‘백성’(עַם)의 처리
  chosen_reading: ‘백성’으로 옮겨 유다 공동체 전체를 겨냥한 책망으로 드러냈습니다.
  alternative_readings:
  - ‘나라’
  - ‘사람들’
  rationale: 문맥상 정치적 국가보다 언약 공동체에 대한 예언적 호칭이 핵심이므로, ‘백성’이 가장 정확하고 자연스럽습니다.
  doctrine_reference: Translation philosophy §6
