id: JER.5.27
reference: Jeremiah 5:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ/כְלוּב֙ מָ֣לֵא ע֔וֹף כֵּ֥ן בָּתֵּי/הֶ֖ם מְלֵאִ֣ים מִרְמָ֑ה עַל כֵּ֥ן גָּדְל֖וּ וַֽ/יַּעֲשִֽׁירוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/027.yaml
  text: Like a cage full of birds[a], so their houses are full of deceit[b]; therefore they have become great and grown rich.
  footnotes:
  - marker: a
    text: Or 'basket' or 'coop' for the container imagery behind 'cage.'
    reason: lexical_alternative
  - marker: b
    text: '''Deceit'' can also be rendered ''treachery'' or ''fraud''; the Hebrew term covers dishonest and exploitative conduct broadly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 새장에 새들이 가득한 것처럼 그들의 집도 속임수로 가득합니다. 그러므로 그들은 크게 되고 부유해졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘새장’은 כאן의 용기 이미지를 따른 번역입니다. 문맥상 ‘바구니’나 ‘우리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속임수’는 ‘기만’, ‘배신’, ‘사기’ 등으로도 옮길 수 있으며, כאן의 어휘는 넓은 부정직과 착취를 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלוּב
  english_pob_choice: cage
  chosen_korean: 새장
  alternatives_korean:
  - 우리
  - 바구니
  - 닭장
  lexicon: HALOT
  rationale: 새들을 가두는 그릇이라는 이미지를 살리기 위해 ‘새장’을 택했습니다. 한국어에서도 가장 자연스럽게 감금된 새의 용기를 떠올리게 합니다.
- source_word: מָלֵא עוֹף
  english_pob_choice: full of birds
  chosen_korean: 새들이 가득한
  alternatives_korean:
  - 새들로 가득한
  - 날짐승이 가득한
  lexicon: HALOT
  rationale: עוֹף는 넓게는 날아다니는 생물을 가리키지만, 여기서는 문맥상 새들이라는 뜻이 가장 분명합니다.
- source_word: מִרְמָה
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 배신
  - 사기
  lexicon: HALOT
  rationale: מִרְמָה는 단순한 거짓말보다 넓게 속임수와 부정한 행위를 포괄하므로, ‘속임수’가 의미 범위를 비교적 넓고 자연스럽게 옮깁니다.
- source_word: גָּדְלוּ וַיַּעֲשִׁירוּ
  english_pob_choice: have become great and grown rich
  chosen_korean: 크게 되고 부유해졌습니다
  alternatives_korean:
  - 세력 있게 되고 부유해졌습니다
  - 크게 되어 부자가 되었습니다
  lexicon: HALOT
  rationale: 두 동사의 병렬을 한국어에서도 유지해 사회적 상승과 물질적 번영을 함께 드러냈습니다. ‘크게 되다’는 지위와 세력이 커졌다는 뉘앙스를 살립니다.
theological_decisions:
- issue: 비유적 비교 구조의 보존
  chosen_reading: ‘~처럼 …도 …합니다’라는 비교 구조를 유지해, 새가 가득한 새장과 속임수로 가득한 집의 대응을 분명히 드러냈습니다.
  alternative_readings:
  - 직접적으로 ‘그들은 속임수로 가득 찬 집을 지었습니다’처럼 풀어 쓰는 방식
  - 비유를 약화해 의미만 전달하는 방식
  rationale: 본문은 단순 정보 진술이 아니라 심판의 대상이 된 사회의 왜곡을 비유로 폭로하므로, 이미지와 논리적 대응을 그대로 살리는 것이 중요합니다.
  doctrine_reference: 예레미야 5장의 예언적 책망과 비유적 경고의 수사
