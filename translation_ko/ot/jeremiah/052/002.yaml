translation:
  language: ko
  text: 그는 야훼[a] 보시기에 여호야김이 행한 모든 것과 같이 악한 일을 행하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 관용적으로 ‘야훼의 눈에’라는 뜻으로, 표준적인 평가 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: And he did
  chosen_korean: 그는 … 행하였는데
  alternatives_korean:
  - 그는 … 하였는데
  - 그리고 그는 … 하였습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서술 진행을 살리되, 한국어에서는 앞 절과의 연결을 자연스럽게 하기 위해 ‘행하였는데’로 옮겼습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 악한 것
  lexicon: HALOT
  rationale: עשה הרע는 관용적으로 ‘악한 일을 행하다’로 자연스럽게 나타나므로, 추상명사보다 행위성을 드러내는 ‘악한 일’을 택했습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 보시기에
  alternatives_korean:
  - 눈에
  - 목전에
  lexicon: HALOT
  rationale: 평가를 나타내는 히브리어 관용구를 직역하되, 한국어에서는 하나님의 판단을 자연스럽게 드러내는 ‘보시기에’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사역 원칙에 따라 여호와 대신 하나님의 고유명사를 음역한 ‘야훼’를 유지했습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה יְהוֹיָקִים
  english_pob_choice: according to all that Jehoiakim had done
  chosen_korean: 그 모든 일은 여호야김이 행한 것과 같았습니다
  alternatives_korean:
  - 여호야김이 한 모든 것과 같았습니다
  - 여호야김이 행한 대로였습니다
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר는 전면적 일치의 비교를 나타내므로 ‘그 모든 일은 … 것과 같았습니다’로 옮겨 범위를 보존했습니다.
theological_decisions:
- issue: 다섯째 절의 도덕 평가를 드러내는 표현
  chosen_reading: ‘야훼 보시기에 악한 일’로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘여호와의 눈에 악한 일’
  - ‘주님이 보시기에 악한 일’
  rationale: 이 구절은 단순한 평가가 아니라 야훼의 관점과 인간 행위의 불일치를 드러내므로, 완화하지 않고 평가 관용구를 직접 살렸습니다.
  doctrine_reference: Jeremiah 52의 왕 평가 공식
