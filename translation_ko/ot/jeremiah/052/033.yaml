id: JER.52.33
reference: Jeremiah 52:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁנָּ֕ה אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם לְ/פָנָ֛י/ו תָּמִ֖יד כָּל יְמֵ֥י חַיָּֽ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/033.yaml
  text: And he changed out of his prison clothes and ate bread before him continually all the days of his life[a][b].
  footnotes:
  - marker: a
    text: Or, more formally, 'he changed the garments of his imprisonment.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'ate bread before him'; this likely refers to taking his meals in the king's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 감옥 옷을 갈아입고, 왕 앞에서 날마다 계속하여 음식을 먹었으며, 그의 생애의 모든 날 동안 그러했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 수감의 옷들’을 벗거나 바꾸었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그 앞에서 빵을 먹었다’고 하며, 보통 왕의 면전에서 식사했다는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּה אֵת בִּגְדֵי כִלְאוֹ
  english_pob_choice: changed out of his prison clothes
  chosen_korean: 감옥 옷을 갈아입고
  alternatives_korean:
  - 감옥 옷을 벗고
  - 감옥 복장을 갈아입고
  - 감옥의 옷을 갈아입고
  lexicon: WLC; HALOT
  rationale: 동사 שׁנה의 ‘바꾸다/갈아입다’ 의미를 살리고, בִּגְדֵי כִלְאוֹ는 수감 상태를 나타내는 옷으로 이해하여 한국어로 자연스럽게 압축했습니다.
- source_word: וְאָכַל לֶחֶם
  english_pob_choice: ate bread
  chosen_korean: 음식을 먹었으며
  alternatives_korean:
  - 떡을 먹었으며
  - 빵을 먹었으며
  - 식사를 했으며
  lexicon: WLC; HALOT
  rationale: 히브리어의 직역은 ‘빵을 먹다’이지만, 한국어에서는 식사 관용으로 너무 낯설 수 있어 의미를 보존하면서도 자연스러운 ‘음식을 먹다’로 옮겼습니다.
- source_word: לְפָנָיו תָּמִיד
  english_pob_choice: before him continually
  chosen_korean: 왕 앞에서 날마다 계속하여
  alternatives_korean:
  - 그 앞에서 끊임없이
  - 그 면전에서 계속하여
  - 왕의 앞에서 계속해서
  lexicon: WLC; HALOT
  rationale: לְפָנָיו는 단순한 공간적 ‘앞’보다 궁정적 ‘왕 앞’의 뉘앙스를 가지며, תָּמִיד는 지속성을 나타내므로 ‘날마다 계속하여’로 풀어 반복성과 지속성을 함께 드러냈습니다.
- source_word: כָּל יְמֵי חַיָּיו
  english_pob_choice: all the days of his life
  chosen_korean: 그의 생애의 모든 날 동안
  alternatives_korean:
  - 그의 평생 동안
  - 그가 사는 모든 날 동안
  - 그의 생애 동안
  lexicon: WLC; HALOT
  rationale: 히브리어의 상투적 표현을 그대로 살리되, 한국어에서 과도하게 번역투가 되지 않도록 ‘그의 생애의 모든 날 동안’으로 옮겼습니다.
theological_decisions:
- issue: 예레미야 52:33의 궁정 식사 장면을 어떻게 드러낼지
  chosen_reading: ‘왕 앞에서’로 옮겨, 단순히 개인적 식사가 아니라 왕의 면전에서 제공되는 궁정적 식사임을 드러냈습니다.
  alternative_readings:
  - ‘그 앞에서’
  - ‘그의 앞에서’
  - ‘그의 식탁에서’
  rationale: 히브리어 לְפָנָיו는 문맥상 왕의 면전이라는 공적·궁정적 관계를 가리키므로, 이를 한국어에서도 분명하게 표현하는 것이 본문의 역사적 의미를 보존합니다.
  doctrine_reference: 문맥적 역사 서술; 왕실 보좌/은혜의 상태를 나타내는 서술
- issue: ‘빵을 먹다’의 관용을 어떻게 처리할지
  chosen_reading: 직역을 완전히 고집하지 않고 ‘음식을 먹다’로 자연화했습니다.
  alternative_readings:
  - ‘떡을 먹다’
  - ‘빵을 먹다’
  - ‘식사하다’
  rationale: 히브리어 관용은 유지하되, 한국어 독자가 실제 의미를 즉시 이해하도록 하면서도 서술의 절제된 문체를 유지하는 편이 본문 목적에 더 부합합니다.
  doctrine_reference: 번역 방법론 및 문체 정합성
