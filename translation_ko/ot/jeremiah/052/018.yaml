  source_fidelity: 대체로 히브리어의 물목 순서와 ‘가져갔다’라는 약탈 서술을 충실히 반영합니다. 다만 אֲשֶׁר יְשָׁרְתוּ בָהֶם는 선행하는 청동 기구들을 수단으로 한 성전 봉사를 뜻하는데, ‘그들이 그것들로 섬기던’은 원문에 없는 인칭 주어를 도입하고 한국어로도 지시 관계가 다소 불분명합니다. ‘성전 봉사에 쓰던’이 이 수단적·제의적 의미를 자연스럽게 보존합니다.
  naturalness: ‘냄비들’도 가능하나 성전 기물 목록에서는 ‘솥들’이 더 자연스럽고 문체적으로 안정적입니다. הַמְזַמְּרוֹת는 도구의 정확한 형태가 확정되지 않으므로 ‘심지집게들’보다 ‘심지 손질 도구들’이 과도한 특정화를 피합니다. 각주 표지는 해당 낱말 또는 구절 바로 뒤에 두어야 합니다.
