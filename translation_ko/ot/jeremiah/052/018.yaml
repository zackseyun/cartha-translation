id: JER.52.18
reference: Jeremiah 52:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּרוֹת וְ/אֶת הַ/יָּעִ֨ים וְ/אֶת הַֽ/מְזַמְּר֜וֹת וְ/אֶת הַ/מִּזְרָקֹ֣ת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ם לָקָֽחוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/018.yaml
  text: They took away the pots[a], the shovels, the snuffers, the basins, the dishes[c][b], and all the bronze vessels with which they ministered.
  footnotes:
  - marker: a
    text: Or "the trimming knives" or "the wick trimmers" for "the snuffers."
    reason: lexical_alternative
  - marker: b
    text: Or "the bowls" for "the basins."
    reason: lexical_alternative
  - marker: c
    text: Or "with which they served." The Hebrew verb often refers to ministering in cultic service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 냄비들과 삽들과 심지집게들과 대접들과 그릇들과, 그들이 그것들로 섬기던 모든 청동 기구들을 가져갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심지집게들’은 히브리어가 가리키는 등불 심지 손질 도구를 풀어 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘대접들’은 히브리어 מִזְרָקוֹת의 보다 넓은 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘섬기다’는 이 동사가 성전 예배 봉사 문맥에서 갖는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּרוֹת
  english_pob_choice: the pots
  chosen_korean: 냄비들
  alternatives_korean:
  - 솥들
  - 항아리들
  lexicon: HALOT
  rationale: 성전 기물 목록에서 סִירוֹת는 조리·보관용 용기를 가리키므로, 자연스럽고 포괄적인 ‘냄비들’이 가장 무난합니다.
- source_word: הַיָּעִים
  english_pob_choice: the shovels
  chosen_korean: 삽들
  alternatives_korean:
  - 국자들
  - 퍼내는 도구들
  lexicon: HALOT
  rationale: 재나 숯을 퍼내는 도구를 가리키는 말이므로, 기능을 가장 분명하게 드러내는 ‘삽들’로 옮겼습니다.
- source_word: הַמְזַמְּרוֹת
  english_pob_choice: the snuffers
  chosen_korean: 심지집게들
  alternatives_korean:
  - 심지깎개들
  - 집게들
  lexicon: HALOT
  rationale: 등불의 심지를 다듬는 도구라는 문맥을 살려, 전통적 교회어보다 의미를 직접 드러내는 ‘심지집게들’을 선택했습니다.
- source_word: הַמִּזְרָקֹת / הַכַּפּוֹת
  english_pob_choice: the basins / the dishes
  chosen_korean: 대접들과 그릇들
  alternatives_korean:
  - 대야들과 접시들
  - 그릇들과 숟가락 모양의 기구들
  lexicon: HALOT
  rationale: 두 항목 모두 성전에서 쓰이던 그릇류이므로, 구체성을 과도하게 좁히지 않으면서도 한국어 독자가 이해하기 쉬운 ‘대접들’과 ‘그릇들’로 옮겼습니다.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  english_pob_choice: all the bronze vessels
  chosen_korean: 모든 청동 기구들
  alternatives_korean:
  - 모든 놋 기구들
  - 모든 청동 그릇들
  lexicon: HALOT
  rationale: נְחֹשֶׁת은 이 성전 목록에서 일반적으로 ‘청동’으로 옮기는 재료명이며, כְּלִים은 용기뿐 아니라 기구 전반을 포함하므로 ‘기구들’이 넓고 정확합니다.
theological_decisions:
- issue: אֲשֶׁר יְשָׁרְתוּ בָהֶם의 예배적/직무적 뉘앙스
  chosen_reading: 그들이 그것들로 섬기던
  alternative_readings:
  - 그들이 그것들로 봉사하던
  - 그들이 그것들을 사용하던
  rationale: שרת는 성전 맥락에서 단순한 사용보다 예배적 섬김의 의미를 띠므로, 한국어에서도 그 뉘앙스를 살린 ‘섬기다’를 유지했습니다.
  doctrine_reference: 성전 봉사/예배 용어
- issue: 목록형 서술의 간결성
  chosen_reading: 직역에 가까운 물목 나열을 유지했습니다.
  alternative_readings:
  - 의미를 묶어 간단히 재구성하는 방식
  - 자연스러운 설명형 문장으로 바꾸는 방식
  rationale: 이 절은 약탈된 성전 기물의 목록이 핵심이므로, 수사적 재구성보다 항목 나열의 구조를 보존하는 것이 원문 효과에 부합합니다.
  doctrine_reference: 본문 구조 보존
