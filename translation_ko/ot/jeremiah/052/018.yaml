  text: 그들은 솥들과 삽들과 심지 손질 도구들[a]과 대접들[b]과 그릇들과, 성전 봉사에 쓰던[c] 모든 청동 기구들을 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
