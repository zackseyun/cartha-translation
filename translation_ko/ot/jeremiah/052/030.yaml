source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שָׁלֹ֣שׁ וְ/עֶשְׂרִים֮ לִ/נְבֽוּכַדְרֶאצַּר֒ הֶגְלָ֗ה נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים יְהוּדִ֕ים נֶ֕פֶשׁ שְׁבַ֥ע מֵא֖וֹת אַרְבָּעִ֣ים וַ/חֲמִשָּׁ֑ה כָּל נֶ֕פֶשׁ אַרְבַּ֥עַת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/030.yaml
  text: In the twenty-third year of Nebuchadnezzar[a], Nebuzaradan the captain of the guard carried away 745 Judeans[c][b]. All the persons were 4,600.
  footnotes:
  - marker: a
    text: Or “took into exile” or “deported.” The Hebrew verb means to cause to go into exile.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “souls” (נֶפֶשׁ) in both counts; here it is an idiom for persons.
    reason: lexical_alternative
  - marker: c
    text: The total of 4,600 summarizes the deportees listed in verses 28–30.
    reason: cross_reference
translation:
  language: ko
  text: 느부갓네살의 제23년에 시위대장 느부사라단이 유다 사람 745명을 포로로 끌고 갔습니다.[a] 모두 합하여 4,600명[b]이었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘포로로 끌고 가다’, ‘유배시키다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘영혼’(נֶפֶשׁ)은 두 인원수 모두에서 여기서는 ‘사람’, ‘인원’이라는 관용적 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 4,600명은 28–30절에 열거된 포로 수를 합한 총계입니다.
    reason: cross_reference
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ וְעֶשְׂרִים
  english_pob_choice: In the twenty-third year
  chosen_korean: 스물셋째 해에
  alternatives_korean:
  - 제23년에
  - 스물세 해에
  lexicon: HALOT
  rationale: 히브리어 날짜 관용구를 자연스러운 현대 한국어 연대 표현으로 옮기되, 왕 재위 연호의 의미를 유지했습니다.
- source_word: הֶגְלָה
  english_pob_choice: carried away
  chosen_korean: 사로잡아 끌고 갔습니다
  alternatives_korean:
  - 포로로 끌고 갔습니다
  - 사로잡아 갔습니다
  - 유배시켰습니다
  lexicon: HALOT
  rationale: 히브리어 הִפְעִיל형이 ‘포로 상태로 옮기다/유배시키다’의 뜻이므로, 단순 이동보다 포로화의 결과를 드러내는 표현을 택했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 시위대의 장관
  alternatives_korean:
  - 호위대장의
  - 경호대장
  - 친위대 장관
  lexicon: HALOT
  rationale: 이 관직명은 문자적으로 ‘도살자들/형리들의 우두머리’ 계열이지만, 문맥상 바빌로니아 행정·군사 관직을 가리키므로 전통적이면서도 직함을 살린 한국어 관직명으로 옮겼습니다.
- source_word: יְהוּדִים
  english_pob_choice: Judeans
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: HALOT
  rationale: 포로기 역사 문맥에서는 종교 집단명보다 유다 지역 출신의 민족·지리적 지시가 우선하므로, ‘유다 사람들’로 옮겼습니다.
- source_word: נֶפֶשׁ
  english_pob_choice: persons
  chosen_korean: 명
  alternatives_korean:
  - 사람들
  - 영혼들
  lexicon: HALOT
  rationale: 계수 문맥에서 נֶפֶשׁ는 ‘사람/개체’를 뜻하는 셈말이므로, 한국어에서는 숫자와 함께 쓰기 자연스러운 ‘명’을 사용했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 계수 의미를 어떻게 드러낼지
  chosen_reading: ‘745명’, ‘4,600명’처럼 인원수로 번역해 인격적 영혼 개념을 배제했습니다.
  alternative_readings:
  - ‘745 사람들’
  - ‘745 영혼들’
  rationale: 본문은 인구 집계를 보고하는 역사 서술이므로, נֶפֶשׁ를 계수 단위로 처리하는 것이 원문의 의미와 POB의 주해를 가장 잘 반영합니다.
  doctrine_reference: 서사적 계수 용례
