revisions:
- from: 느부갓네살의 스물셋째 해에, 시위대의 장관 느부사라단이 유다 사람들 745명을 사로잡아 끌고 갔습니다. 모두 합하면 4,600명이었습니다.[a][b][c]
  to: 느부갓네살의 제23년에 시위대장 느부사라단이 유다 사람 745명을 포로로 끌고 갔습니다.[a] 모두 합하여 4,600명[b]이었습니다.[c]
  rationale: 포로 이송을 뜻하는 הֶגְלָה에 맞추어 불필요하게 구체적인 ‘사로잡아’를 삭제하고, 관직명을 자연스러운 현대 한국어로 다듬었습니다. 숫자와 총계는 유지했으며, 각주 표지를 설명 대상에 가깝게 배치했습니다.
