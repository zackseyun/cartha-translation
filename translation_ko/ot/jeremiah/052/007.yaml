id: JER.52.7
reference: Jeremiah 52:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֣י הַ/מִּלְחָמָ֡ה יִבְרְחוּ֩ וַ/יֵּצְא֨וּ מֵ/הָ/עִ֜יר לַ֗יְלָה דֶּ֜רֶךְ שַׁ֤עַר בֵּין הַ/חֹמֹתַ֨יִם֙ אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּלְכ֖וּ דֶּ֥רֶךְ הָ/עֲרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/007.yaml
  text: Then the city was breached[a], and all the men of war fled and went out of the city by night by way of the gate between the two walls, which was by the king’s garden, while the Chaldeans were all around the city[c][b]; and they went by way of the Arabah.
  footnotes:
  - marker: a
    text: Or 'through the gate between the walls.'
    reason: lexical_alternative
  - marker: b
    text: '''Arabah'' refers to the Jordan rift valley region; some translations render it ''the plain.'''
    reason: cultural_note
  - marker: c
    text: '''Chaldeans'' is the Hebrew ethnic term often used for the Babylonian forces.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 성읍이 뚫렸고, 전쟁에 나갔던 모든 군인들은 도망하여 밤에 성읍에서 나갔습니다. 곧 두 성벽 사이에 있는 문—왕의 정원 곁에 있는 문—을 통해서였으며, 갈대아 사람들은 성읍을 사방으로 에워싸고 있었습니다[a][b][c]. 그들은 아라바 길로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성벽 사이의 문’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아라바’는 요단 균열대 지대를 가리키며, 일부 번역은 ‘평원’으로 옮깁니다.
    reason: cultural_note
  - marker: c
    text: ‘갈대아 사람들’은 바빌로니아 군대를 가리키는 히브리어 민족명입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע / was breached
  english_pob_choice: was breached
  chosen_korean: 뚫렸고
  alternatives_korean:
  - 함락되었고
  - 파괴되었고
  - 무너졌고
  lexicon: WLC + HALOT
  rationale: 포위전 맥락에서 העיר가 방어선을 뚫린 상태가 되었음을 간결하게 드러내며, ‘함락’보다 원문의 상태 변화에 더 가깝습니다.
- source_word: אַנְשֵׁי הַמִּלְחָמָה / the men of war
  english_pob_choice: the men of war
  chosen_korean: 전쟁에 나갔던 모든 군인들
  alternatives_korean:
  - 전사들
  - 전투병들
  - 군사들
  lexicon: HALOT
  rationale: 직역된 ‘전쟁의 사람들’은 한국어에서 부자연스러워, 원문의 군사 집단을 분명히 하면서도 전투 상황을 유지하는 표현을 택했습니다.
- source_word: בֵּין הַחֹמֹתַיִם / between the two walls
  english_pob_choice: between the two walls
  chosen_korean: 두 성벽 사이에 있는 문
  alternatives_korean:
  - 두 성벽 사이의 문
  - 성벽들 사이의 문
  lexicon: HALOT
  rationale: 문 자체가 위치한 통로를 한국어로 자연스럽게 풀되, ‘두 성벽 사이’라는 이중 형식을 보존했습니다. 본문 뒤에 문을 다시 언급하는 구조는 원문의 ‘문’과 위치 관계를 함께 보여주기 위한 것입니다.
- source_word: וְכַשְׂדִּים עַל הָעִיר סָבִיב / while the Chaldeans were all around the city
  english_pob_choice: while the Chaldeans were all around the city
  chosen_korean: 갈대아 사람들은 성읍을 사방으로 에워싸고 있었습니다
  alternatives_korean:
  - 갈대아 사람들은 성읍을 둘러싸고 있었습니다
  - 갈대아 사람들이 성읍 주위에 있었습니다
  lexicon: HALOT
  rationale: English POB의 ‘Chaldeans’를 따라 ‘갈대아 사람들’을 유지하고, 사방으로 포위된 상황을 분명히 하기 위해 ‘에워싸다’를 택했습니다.
- source_word: הָעֲרָבָה / the Arabah
  english_pob_choice: the Arabah
  chosen_korean: 아라바 길
  alternatives_korean:
  - 아라바
  - 아라바 평원
  - 평원 길
  lexicon: HALOT
  rationale: 지리명 자체는 음역을 유지하되, כאן의 דֶּרֶךְ가 ‘길/경로’를 뜻하므로 한국어에서는 이동 경로임을 드러내기 위해 ‘길’을 덧붙였습니다.
theological_decisions:
- issue: 갈대아 사람들의 표기
  chosen_reading: 역사적·민족적 호칭인 ‘갈대아 사람들’을 유지했습니다.
  alternative_readings:
  - 바빌로니아 군대
  - 바빌론 사람들
  rationale: 원문과 POB가 사용하는 민족/역사 표지를 보존해, 단순한 현대 국가명으로 환원하지 않았습니다.
  doctrine_reference: 역사-문맥 보존 원칙
- issue: 야훼 대체 여부
  chosen_reading: 이 절에는 יהוה/YHWH가 없으므로 야훼를 쓰지 않았습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 없는 신명어를 보충하지 않고, 본문 자체의 서술에만 맞췄습니다.
  doctrine_reference: 원문 충실성 원칙
