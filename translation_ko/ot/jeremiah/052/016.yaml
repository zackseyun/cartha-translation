id: JER.52.16
reference: Jeremiah 52:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/דַּלּ֣וֹת הָ/אָ֔רֶץ הִשְׁאִ֕יר נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים לְ/כֹרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/016.yaml
  text: But some of the poorest of the land Nebuzaradan[a], the captain of the guard[b], left as vinedressers and farmers.
  footnotes:
  - marker: a
    text: Or 'the chief of the executioners'; the Hebrew title is literally 'chief of the slaughterers/butchers,' likely an official court or military title.
    reason: lexical_alternative
  - marker: b
    text: Or 'farmers' or 'field workers' for 'plowmen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 땅의 가장 가난한 사람들 가운데 일부는 느부사라단[a], 곧 호위대장[b]이 포도원을 돌보는 사람들과 농부들로 남겨 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처형자들의 우두머리’입니다. 히브리어 직함은 문자적으로는 ‘도살자/학살자들의 우두머리’이며, 아마도 궁정 또는 군사 행정직을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘농부들’이나 ‘밭일꾼들’로, 여기의 히브리어는 ‘쟁기질하는 사람들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלּוֹת
  english_pob_choice: But some of the poorest
  chosen_korean: 그러나 그 땅의 가장 가난한 사람들 가운데 일부
  alternatives_korean:
  - 그리고 그 땅의 가난한 사람들 가운데 일부
  - 그러나 그 땅의 가난한 이들 가운데 일부
  - 그리고 가장 가난한 사람들 가운데 일부
  lexicon: HALOT
  rationale: מן+명사구의 부분적 의미를 살려 ‘가운데 일부’로 처리하고, 문맥상 포로 이송/잔류의 대비를 드러내기 위해 ‘그러나’를 사용했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 호위대장
  alternatives_korean:
  - 처형자들의 우두머리
  - 도살자들의 우두머리
  - 경호대장
  lexicon: HALOT
  rationale: 직역 가능한 표현보다 본문의 관직적 기능을 드러내는 한국어 관용을 택해, 문맥상 바빌로니아 관리 직함을 자연스럽게 전달했습니다.
- source_word: לְכֹרְמִים
  english_pob_choice: as vinedressers
  chosen_korean: 포도원을 돌보는 사람들로
  alternatives_korean:
  - 포도 재배자들로
  - 포도원 일꾼들로
  - 포도원지기들로
  lexicon: HALOT
  rationale: לְ의 지정/배치 의미를 반영해 ‘~로 남겨 두다’와 연결했고, כֹרְמִים는 포도원 관리 노동을 드러내는 표현으로 옮겼습니다.
- source_word: וּלְיֹגְבִים
  english_pob_choice: and plowmen
  chosen_korean: 농부들로
  alternatives_korean:
  - 쟁기질하는 사람들로
  - 밭일꾼들로
  - 경작자들로
  lexicon: HALOT
  rationale: POB가 농업 종사자의 넓은 의미를 취한 점을 따라, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘농부들’로 옮겼습니다.
theological_decisions:
- issue: 느부사라단의 관직명 번역
  chosen_reading: 본문의 직함 רַב טַבָּחִים을 기능적으로 ‘호위대장’으로 옮겨, 독자가 인물의 직위를 즉시 이해하게 했습니다.
  alternative_readings:
  - ‘처형자들의 우두머리’처럼 직역하는 방식
  - ‘경호대장’으로 옮기는 방식
  rationale: 이 구절의 핵심은 역사적 행정 직함을 전달하는 것이므로, 문자적 잔혹함보다 제도적 기능을 드러내는 번역이 본문 의도에 더 부합합니다.
  doctrine_reference: 역사서술/행정직 번역 원칙
