  yaml_path: translation/ot/jeremiah/052/016.yaml
  text: But some of the poorest of the land Nebuzaradan[a], the captain of the guard[b], left as vinedressers and farmers.
  footnotes:
  - marker: a
    text: Or 'the chief of the executioners'; the Hebrew title is literally 'chief of the slaughterers/butchers,' likely an official court or military title.
    reason: lexical_alternative
  - marker: b
    text: Or 'farmers' or 'field workers' for 'plowmen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 느부사라단 곧 호위대장[a]은 그 땅의 가장 가난한 사람들 가운데 일부를 포도원 일꾼과 농부들[b]로 남겨 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처형자들의 우두머리’입니다. 히브리어 직함은 문자적으로 ‘도살자들의 우두머리’이며, 아마도 궁정이나 군사 행정의 직함을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쟁기질하는 사람들’ 또는 ‘밭일꾼들’입니다.
    reason: lexical_alternative
