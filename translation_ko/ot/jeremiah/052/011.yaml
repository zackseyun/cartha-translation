source:
  edition: WLC
  text: וְ/אֶת עֵינֵ֥י צִדְקִיָּ֖הוּ עִוֵּ֑ר וַ/יַּאַסְרֵ֣/הוּ בַֽ/נְחֻשְׁתַּ֗יִם וַ/יְבִאֵ֤/הוּ מֶֽלֶךְ בָּבֶל֙ בָּבֶ֔לָ/ה וַ/יִּתְּנֵ֥/הוּ ב/בית הַ/פְּקֻדֹּ֖ת עַד י֥וֹם מוֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/011.yaml
  text: Then he blinded Zedekiah’s eyes[a], bound him with bronze shackles, and the king of Babylon brought him to Babylon and put him in the house of custody until the day of his death.
  footnotes:
  - marker: a
    text: Or 'put him in prison.' The Hebrew reads more literally, 'put him in the house of custody.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고 나서 그는 시드기야의 눈을 멀게 하고, 그를 놋 쇠사슬로 묶은 뒤 바빌론 왕이 그를 바빌론으로 데려가 감옥에 가두어 두었으며, 그가 죽는 날까지 그렇게 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감옥에 가두다.’ 히브리어는 더 문자적으로는 ‘감시/구금의 집에 두다’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת עֵינֵי צִדְקִיָּהוּ עִוֵּר
  english_pob_choice: blinded Zedekiah’s eyes
  chosen_korean: 시드기야의 눈을 멀게 하고
  alternatives_korean:
  - 시드기야의 눈을 멀게 하였고
  - 시드기야의 눈을 뽑고
  lexicon: WLC / HALOT
  rationale: 히브리어는 ‘시드기야의 눈’을 직접 목적어로 두고 ‘멀게 하다’는 동사를 사용하므로, 눈의 잔혹한 손상을 구체적으로 살리되 한국어에서는 자연스럽게 ‘눈을 멀게 하다’로 옮겼습니다.
- source_word: וַיַּאַסְרֵהוּ בַנְחֻשְׁתַּיִם
  english_pob_choice: bound him with bronze shackles
  chosen_korean: 놋 쇠사슬로 묶은 뒤
  alternatives_korean:
  - 놋 족쇄로 묶은 뒤
  - 놋 사슬로 묶은 뒤
  - 놋 쇠사슬에 채운 뒤
  lexicon: WLC / HALOT
  rationale: אַסר는 ‘묶다’가 가장 პირდაპირ적이고, בַנְחֻשְׁתַּיִם은 금속 구속구를 가리키므로 ‘놋 쇠사슬’로 옮겨 재료와 구속의 물성을 함께 드러냈습니다.
- source_word: בֵּית הַפְּקֻדֹּת
  english_pob_choice: the house of custody
  chosen_korean: 감옥에 가두어 두었으며
  alternatives_korean:
  - 감시의 집에 두었으며
  - 구금의 집에 두었으며
  - 수금소에 두었으며
  lexicon: WLC / HALOT
  rationale: 직역하면 ‘감시/구금의 집’이지만, 한국어에서는 이 관용적 구문이 다소 불투명하므로 본문은 기능적으로 ‘감옥’으로 풀고, 원문의 특수한 표현은 각주로 보완했습니다.
- source_word: עַד יוֹם מוֹתוֹ
  english_pob_choice: until the day of his death
  chosen_korean: 그가 죽는 날까지 그렇게 있었습니다
  alternatives_korean:
  - 그가 죽는 날까지였습니다
  - 죽는 날까지 갇혀 있었습니다
  lexicon: WLC / HALOT
  rationale: 히브리어의 ‘죽음의 날’이라는 형식을 한국어에서 어색하지 않게 살리기 위해 결과 상태를 자연스럽게 풀되, 시간의 종결점은 분명히 유지했습니다.
