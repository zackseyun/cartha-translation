review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 지명 רִבְלָה는 ‘립라’인데 초안의 ‘립나’는 다른 지명으로 잘못 옮겼습니다. 또한 וַיַּכֵּה와 וַיְמִתֵם은 별개의 동사인데, ‘쳐서 죽였고 ... 죽였습니다’는 첫 동사에 ‘죽이다’를 덧붙여 두 동사의 구분을 흐립니다.
  naturalness: ‘그들을 쳤고 ... 그들을 죽였습니다’는 현대 표준어 합쇼체로 자연스러우며, 원문의 연속된 행위를 분명히 드러냅니다. ‘자기 땅에서 포로로 끌려갔습니다’는 강제 이주와 원문의 귀속 관계를 자연스럽게 전달합니다.
  terminology: ‘바벨론 왕’, ‘하맛 땅’, ‘립라’, ‘유다’, ‘포로로 끌려갔습니다’는 지명과 역사적·본문상 핵심 용어를 적절히 반영합니다. 각주 표지는 지명절이 아니라 대안 독법이 적용되는 유배절에 붙여야 합니다.
  issues:
  - severity: high
    issue: רִבְלָה를 ‘립나’로 표기함
    rationale: 립나는 רִבְנָה(Libnah)에 해당하는 별개의 지명입니다. 본문의 רִבְלָה(Riblah)는 한국어로 ‘립라’로 옮겨야 합니다.
  - severity: medium
    issue: 첫 동사 וַיַּכֵּה의 의미가 ‘쳐서 죽였고’로 확대되어 뒤의 וַיְמִתֵם과 중복됨
    rationale: 히브리어는 ‘그들을 쳤고’와 ‘그들을 죽였다’를 나란히 둡니다. 첫 동사에 ‘죽이다’를 포함시키지 않고 두 행위를 분리해야 합니다.
  - severity: medium
    issue: 각주 표지가 ‘하맛’에 붙어 있어 각주 내용과 연결되지 않음
    rationale: 각주는 מֵעַל אַדְמָתוֹ 및 유배 표현의 대안 번역을 설명합니다. 따라서 ‘포로로 끌려갔습니다’에 표지를 붙여야 합니다.
  - severity: low
    issue: 각주의 문자적 히브리어 설명이 불명확함
    rationale: ‘유다가 자기 땅 위에서/에서’는 מֵעַל의 ‘~로부터’ 의미와 접미사의 기능을 충분히 반영하지 못합니다. ‘유다는 그의 땅 위로부터’라고 설명하는 편이 원문 구조를 더 정확히 보입니다.
  revised_text: 바벨론 왕이 그들을 쳤고, 하맛 땅 립라에서 그들을 죽였습니다. 이렇게 유다는 자기 땅에서 포로로 끌려갔습니다[a].
