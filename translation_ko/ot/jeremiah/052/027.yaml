revisions:
- from: 바벨론 왕이 그들을 쳐서 죽였고, 하맛 땅 립나에서 죽였습니다[a]. 이렇게 유다는 자기 땅에서 포로로 끌려갔습니다.
  to: 바벨론 왕이 그들을 쳤고, 하맛 땅 립라에서 그들을 죽였습니다. 이렇게 유다는 자기 땅에서 포로로 끌려갔습니다[a].
  rationale: 지명 ‘립나’를 원문의 רִבְלָה에 맞는 ‘립라’로 바로잡았습니다. ‘치다’와 ‘죽이다’라는 두 동사를 분리하여 원문의 서술 순서와 의미 차이를 보존했습니다. 또한 각주 표지를 유배절로 옮기고, 각주 설명을 מֵעַל과 남성 단수 접미사의 문법에 맞게 명료화했습니다.
  reviewer_model: gpt-5.6-terra
