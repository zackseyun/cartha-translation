  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה אוֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/027.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[a]. So Judah was taken into exile from its land.
  footnotes:
  - marker: a
    text: Or 'was exiled from its land.' The Hebrew literally has 'Judah from upon his land,' with a masculine singular suffix matching the proper noun Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론 왕이 그들을 쳐서 죽였고, 하맛 땅 립나에서 죽였습니다[a]. 이렇게 유다는 자기 땅에서 포로로 끌려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅에서 유배되었다.’ 히브리어는 문자적으로 ‘유다가 자기 땅 위에서/에서’라고 하며, ‘유다’라는 고유명사와 맞는 남성 단수 접미사가 붙어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  english_pob_choice: struck them down
  chosen_korean: 그들을 쳐서 죽였고
  alternatives_korean:
  - 그들을 쳤고
  - 그들을 강타했고
  lexicon: HALOT
  rationale: 히필 נכה는 단순히 ‘치다’보다 폭력적 징벌 행위를 나타내므로, 뒤의 ‘죽였습니다’와 함께 한국어에서도 가해와 사형을 분리해 드러냈습니다.
- source_word: וַיְמִתֵם
  english_pob_choice: put them to death
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 사형에 처했습니다
  - 죽게 했습니다
  lexicon: HALOT
  rationale: מות의 사역형은 ‘죽게 하다’의 의미이므로, 직접적이고 현대적인 합쇼체로 옮기되 형벌적 결과를 유지했습니다.
- source_word: וַיִּגֶל יְהוּדָה
  english_pob_choice: Judah was taken into exile
  chosen_korean: 유다는 자기 땅에서 포로로 끌려갔습니다
  alternatives_korean:
  - 유다는 그 땅에서 유배되었습니다
  - 유다는 자기 땅에서 추방되었습니다
  lexicon: HALOT
  rationale: גלה는 강제 이주/포로 이동을 가리키므로, 능동적으로 ‘포로로 끌려가다’라고 풀어 강제성을 살렸습니다. ‘유다’는 집합적 실체를 유지했습니다.
- source_word: מֵעַל אַדְמָתֽוֹ
  english_pob_choice: from his land
  chosen_korean: 자기 땅에서
  alternatives_korean:
  - 그의 땅에서
  - 그 땅에서
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 접미사는 문법적으로 ‘유다’에 대응하지만, 한국어에서는 소유격을 자연스럽게 풀어 ‘자기 땅’으로 옮겨 원문의 귀속 관계를 살렸습니다.
theological_decisions:
- issue: 유다를 지칭하는 인칭 소유 표현의 처리
  chosen_reading: ‘자기 땅’으로 옮겨 문법적 소유 관계를 자연스럽게 보존했습니다.
  alternative_readings:
  - ‘그의 땅’
  - ‘그 땅’
  rationale: 이 구절의 접미사는 교리적 쟁점이 아니라 히브리어 문법 표지입니다. 한국어에서는 남성성보다 귀속 관계가 핵심이므로 자연스러운 현대어로 처리했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy
