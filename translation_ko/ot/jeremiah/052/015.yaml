  source_fidelity: 히브리어의 네 집단과 마지막 동사(הֶגְלָה)의 주어인 느부사라단의 어순을 대체로 충실히 반영했습니다. 다만 דַּלּוֹת는 ‘가장 가난한’이라는 최상급을 요구하지 않으며, הֶגְלָה에는 ‘사로잡아’보다 ‘포로로 끌고 가다/추방하다’가 더 직접적입니다. אָמוֹן의 뜻은 불확실하므로 본문에서 ‘장인들’을 택할 경우 대안을 그 자리의 주석으로 밝혀야 합니다.
  naturalness: 초안은 현대 한국어 합쇼체로 대체로 자연스럽습니다. ‘가난한 사람들 몇몇’은 다소 어색하므로 ‘가난한 사람들 일부’가 더 자연스럽고, 각 주석 표지는 해당 낱말 또는 구에 직접 붙이는 편이 독자에게 명확합니다.
  terminology: ‘느부사라단’은 통용 표기입니다. רַב־טַבָּחִים는 왕실 직함으로서 ‘경호대장’보다 ‘친위대장’이 더 적절합니다. 다만 이 직함의 문자적 의미와 실제 직무 범위는 주석에서 설명할 수 있습니다. אָמוֹן은 논쟁적인 낱말이므로 ‘장인들’이라는 해석을 유지하되 ‘무리/대중’의 가능성을 주석으로 보존합니다.
