source:
  edition: WLC
  text: וּ/מִ/דַּלּ֨וֹת הָ/עָ֜ם וְֽ/אֶת יֶ֥תֶר הָ/עָ֣ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָֽפְלוּ֙ אֶל מֶ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הָֽ/אָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/015.yaml
  text: And some of the poorest of the people[a], and the rest of the people who remained in the city, and the deserters who had defected to the king of Babylon, and the rest of the craftsmen—Nebuzaradan, the captain of the guard[c][b], carried into exile.
  footnotes:
  - marker: a
    text: Or 'the rest of the multitude.' The Hebrew term here is difficult; many understand it in this context to refer to craftsmen or artisans, especially in light of the parallel in 2 Kings 25:11.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the ones who fell ... to the king of Babylon,' an idiom for defecting or going over to him.
    reason: lexical_alternative
  - marker: c
    text: Compare 2 Kings 25:11, the parallel account of this deportation.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 백성 가운데 가난한 사람들 일부와, 성 안에 남아 있던 백성의 나머지와, 바빌론 왕에게로 넘어간 이들[b]과, 나머지 장인들[a]을 느부사라단 곧 친위대장[c]이 포로로 끌고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָמוֹן의 뜻은 불확실합니다. 문맥과 열왕기하 25:11의 병행 기록에 비추어 ‘장인들’ 또는 ‘기술자들’로 이해할 수 있으나, ‘무리’ 또는 ‘대중’으로 이해하는 견해도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바빌론 왕에게 떨어진 이들’입니다. 이는 적군의 왕에게 넘어가거나 투항했다는 뜻의 군사·정치적 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 직함은 문자적으로 ‘도살자들의 우두머리’입니다. 왕실의 친위·경비 및 처형 업무와 관련된 고위 관리를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָעָם
  english_pob_choice: some of the poorest of the people
  chosen_korean: 백성 가운데서 가장 가난한 사람들 몇몇
  alternatives_korean:
  - 백성 가운데서 가장 낮은 사람들 몇몇
  - 백성의 가난한 사람들 가운데서 몇몇
  lexicon: HALOT
  rationale: מִן의 분리·부분적 의미를 살려 ‘몇몇’으로 부분집합을 드러내고, דַּלּוֹת의 빈곤/비천함을 ‘가장 가난한 사람들’로 옮겼습니다.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ אֶל מֶלֶךְ בָּבֶל
  english_pob_choice: the deserters who had defected to the king of Babylon
  chosen_korean: 바빌론 왕에게로 넘어간 이들
  alternatives_korean:
  - 바빌론 왕에게 떨어진 이들
  - 바빌론 왕에게로 도망간 이들
  lexicon: HALOT
  rationale: 직역하면 ‘넘어간/떨어진’이지만 군사·정치적 관용구로서 ‘배반하여 가담함’의 뜻이므로, 자연스러운 현대어로 ‘넘어간 이들’이라 옮겼습니다.
- source_word: יֶתֶר הָאָמֹון
  english_pob_choice: the rest of the craftsmen
  chosen_korean: 나머지 장인들
  alternatives_korean:
  - 나머지 무리
  - 나머지 기술자들
  lexicon: HALOT
  rationale: 동일 구절의 병행 본문과 문맥상 אָמֹון은 단순 ‘무리’보다 장인/기술자 집단을 가리키는 뜻이 유력하므로, POB의 선택을 따라 ‘장인들’로 번역했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 근위대장
  - 호위대장
  - 경비대장
  lexicon: HALOT
  rationale: ‘slaughterers’의 직역보다 왕궁 직함으로 기능하는 의미가 분명하므로, 역할을 드러내는 관용적 표현인 ‘경호대장’을 선택했습니다.
theological_decisions:
- issue: 포로로 끌려감의 서술 방식
  chosen_reading: 히브리어 הֶגְלָה의 역사적 서술을 따라, 심판의 결과로서 ‘사로잡아 끌고 갔습니다’라고 직서했습니다.
  alternative_readings:
  - ‘포로로 끌고 갔습니다’
  - ‘유배시켰습니다’
  rationale: 예레미야의 역사 서술은 단순 이동이 아니라 강제적 추방과 포로화를 강조하므로, 그 폭력성과 종결성을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 예언서의 심판-유배 서술
