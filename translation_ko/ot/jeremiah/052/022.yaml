  source_fidelity: 전반적으로 기둥머리, 청동, 다섯 규빗, 둘레의 그물형 장식과 석류 장식, 둘째 기둥의 상응하는 장식을 충실히 반영합니다. 다만 현행 각주 a는 본문의 번역어와 동일한 표현을 ‘또는’으로 제시하여 영어 감사 기록의 어휘 대안을 반영하지 못합니다. 또한 원문의 마지막 ‘석류들’을 보존하도록 둘째 기둥의 석류를 명시하는 편이 좋습니다.
  naturalness: ‘그 한 기둥머리’와 ‘그물무늬와 석류 장식이 둘러져’는 다소 어색하거나 수식 관계가 덜 선명합니다. ‘한 기둥머리’, ‘둘레를 따라 그물 장식과 석류가’가 현대 표준어 문장으로 더 자연스럽습니다.
