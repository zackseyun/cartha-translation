reference: Jeremiah 52:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹתֶ֨רֶת עָלָ֜י/ו נְחֹ֗שֶׁת וְ/קוֹמַ֨ת הַ/כֹּתֶ֥רֶת הָ/אַחַת֮ חָמֵ֣שׁ אַמּוֹת֒ וּ/שְׂבָכָ֨ה וְ/רִמּוֹנִ֧ים עַֽל הַ/כּוֹתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י וְ/רִמּוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/022.yaml
  text: And on it was a bronze capital[a], and the height of the one capital was five cubits, with latticework and pomegranates on the capital all around, all of bronze. And the second pillar had the same[b], with pomegranates.
  footnotes:
  - marker: a
    text: Or 'network' for 'latticework.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'pomegranates'; likely pomegranate-shaped ornaments decorating the capital.
    reason: cultural_note
translation:
  language: ko
  text: 그 위에는 청동 기둥머리가 있었고, 한 기둥머리의 높이는 다섯 규빗이었습니다. 그 기둥머리에는 둘레를 따라 그물 장식[a]과 석류[b]가 있었는데, 모두 청동으로 되어 있었습니다. 둘째 기둥에도 이와 같은 것들과 석류가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물무늬’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘석류’는 여기서 기둥머리를 장식한 석류 모양 장식을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתֶרֶת
  english_pob_choice: capital
  chosen_korean: 기둥머리
  alternatives_korean:
  - 장식머리
  - 머리장식
  - 주두
  lexicon: HALOT
  rationale: 기둥의 상단 장식 구조를 가리키므로, 건축 용어로 자연스럽고 이해하기 쉬운 ‘기둥머리’가 적절합니다. ‘주두’는 가능하지만 현대 독자에게 덜 투명합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 청동
  alternatives_korean:
  - 놋
  - 구리
  lexicon: HALOT
  rationale: POB의 ‘bronze’를 한국어 표준어로 옮기면 ‘청동’이 가장 직접적이며, 성막·성전 기물 문맥에서도 재질을 명확히 드러냅니다. 전통적 ‘놋’은 익숙하지만 현대어 투명성이 떨어집니다.
- source_word: שְׂבָכָה
  english_pob_choice: latticework
  chosen_korean: 그물무늬
  alternatives_korean:
  - 격자무늬
  - 망상 장식
  - 그물장식
  lexicon: HALOT
  rationale: 나무/금속의 격자·망상 장식을 뜻하므로, 원문의 구조적 성격을 살리면서도 자연스러운 ‘그물무늬’로 옮겼습니다.
- source_word: רִמּוֹנִים
  english_pob_choice: pomegranates
  chosen_korean: 석류 장식
  alternatives_korean:
  - 석류들
  - 석류 모양 장식
  - 석류무늬
  lexicon: HALOT
  rationale: 문맥상 실제 과일이 아니라 기둥머리를 장식한 석류 형상의 장식물이므로, 문자적 의미를 유지하되 기능을 드러내는 ‘석류 장식’으로 처리했습니다.
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי
  english_pob_choice: the second pillar had the same
  chosen_korean: 둘째 기둥에도 그와 같은 것이 있었고
  alternatives_korean:
  - 둘째 기둥에도 같은 것이 있었고
  - 둘째 기둥도 그와 같았습니다
  lexicon: HALOT
  rationale: 히브리어는 생략이 있는 병렬 비교이므로, 한국어에서는 ‘있었고’로 문장을 완결해 첫 기둥과의 동일성을 분명히 했습니다.
