- from: 그리고 그 위에는 청동으로 된 기둥머리가 있었는데, 그 한 기둥머리의 높이는 다섯 규빗이었고, 그 기둥머리 둘레에는 그물무늬와 석류 장식이 둘러져 있었으며, 그 모든 것이 청동이었습니다. 둘째 기둥에도 그와 같은 것이 있었고, 석류 장식도 있었습니다.[a][b]
  to: 그 위에는 청동 기둥머리가 있었고, 한 기둥머리의 높이는 다섯 규빗이었습니다. 그 기둥머리에는 둘레를 따라 그물 장식[a]과 석류[b]가 있었는데, 모두 청동으로 되어 있었습니다. 둘째 기둥에도 이와 같은 것들과 석류가 있었습니다.
