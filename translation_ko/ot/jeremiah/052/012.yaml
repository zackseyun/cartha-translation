id: JER.52.12
reference: Jeremiah 52:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֗א נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים עָמַ֛ד לִ/פְנֵ֥י מֶֽלֶךְ בָּבֶ֖ל בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/012.yaml
  text: Now in the fifth month[a], on the tenth day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan the captain of the guard, who stood before the king of Babylon[c][b], came to Jerusalem.
  footnotes:
  - marker: a
    text: Or more literally, 'chief of the executioners' or 'chief butcher'; the title likely refers to a high royal official over the guard.
    reason: lexical_alternative
  - marker: b
    text: '''Stood before the king of Babylon'' is a court expression for serving in the king’s presence.'
    reason: cultural_note
  - marker: c
    text: Hebrew has 'in Jerusalem'; English idiom with 'came' normally uses 'to Jerusalem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다섯째 달[a] 곧 그 달의 열흘 날—바벨론 왕 느부갓네살의 제십구년이었는데—왕을 섬기던[b] 시위대장[c] 느부사라단이 예루살렘에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그리고 다섯째 달에’입니다.
    reason: source_note
  - marker: b
    text: ‘왕을 섬기다’는 히브리어의 ‘왕 앞에 서다’라는 궁정 관용구를 풀어 옮긴 것입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 직역은 ‘처형 집행관의 우두머리’에 가깝지만, 본문에서는 왕실 경호·집행을 맡은 고위 관직을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  english_pob_choice: Now in the fifth month
  chosen_korean: 다섯째 달
  alternatives_korean:
  - 그리고 다섯째 달에
  - 다섯째 달에
  lexicon: HALOT
  rationale: 히브리어 문두의 접속·전치사 결합은 연속 서술을 여는 시간표현이므로, 한국어에서는 자연스럽고 간결하게 ‘다섯째 달’로 옮겼습니다.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  english_pob_choice: on the tenth day of the month
  chosen_korean: 그 달의 열흘 날
  alternatives_korean:
  - 그 달의 열째 날
  - 그 달 열흘째 날
  lexicon: HALOT
  rationale: 날짜 공식의 의미를 그대로 살리되, 현대 한국어에서 자연스러운 서법으로 ‘열흘 날’이라고 표현했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 시위대장
  alternatives_korean:
  - 경호대장
  - 처형 집행관의 우두머리
  lexicon: HALOT
  rationale: 직역상 ‘도살자들의 우두머리’라는 뜻이지만, 바벨론 궁정 직책으로는 왕실 경호·집행 부대를 맡은 고위 관직을 가리키므로 한국어 독자에게 가장 자연스러운 관직명인 ‘시위대장’으로 옮겼습니다.
- source_word: עָמַד לִפְנֵי מֶלֶךְ בָּבֶל
  english_pob_choice: who stood before the king of Babylon
  chosen_korean: 왕을 섬기던
  alternatives_korean:
  - 바벨론 왕 앞에 서 있던
  - 바벨론 왕 앞에서 섬기던
  lexicon: HALOT
  rationale: ‘서다’는 궁정에서 왕 앞에 출입하여 시중드는 공식적 봉사를 뜻하므로, 문맥상의 관용을 살려 ‘왕을 섬기던’으로 자연스럽게 풀었습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘에 이르렀습니다
  alternatives_korean:
  - 예루살렘으로 왔습니다
  - 예루살렘에 왔습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘예루살렘에서/안에’ 형식이지만 동사 ‘왔다’와 결합한 한국어에서는 이동의 종착을 드러내는 ‘이르렀습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 궁정 관용구 ‘왕 앞에 서다’의 번역
  chosen_reading: 직역 어감을 완전히 보존하기보다, 궁정 봉사를 뜻하는 관용구로 이해해 ‘왕을 섬기던’으로 옮겼습니다.
  alternative_readings:
  - 바벨론 왕 앞에 서 있던
  - 왕 앞에 서 있던
  rationale: 이 표현은 신학적 쟁점보다는 고대 근동 궁정용어의 관용적 의미가 핵심이므로, 현대 한국어 독자가 직무를 정확히 이해하도록 의미를 드러냈습니다.
  doctrine_reference: 궁정 관용어 해석 / 역사서 서술 관습
