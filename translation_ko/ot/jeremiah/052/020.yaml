base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
  footnotes:
  - marker: a
    text: Or 'the twelve oxen of bronze'; 'bulls' is also possible for the animal term here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'there was no weight for their bronze,' that is, the bronze of all these vessels was not weighed or was beyond reckoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 기둥과 한 바다[a]와 받침대들 아래에 있던 열두 청동 황소, 곧 솔로몬 왕이 야훼의 집을 위하여 만든 이 모든 기구의 청동은 그 무게를 잴 수 없었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 바다’입니다. 여기서 ‘바다’는 성전의 큰 물통을 가리키는 전문 명칭입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 청동에 무게가 없었다’는 뜻입니다. 곧 이 모든 기구의 청동을 달지 않았거나, 그 무게가 헤아릴 수 없었다는 의미로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  english_pob_choice: the two pillars
  chosen_korean: 두 기둥
  alternatives_korean:
  - 두 받침기둥
