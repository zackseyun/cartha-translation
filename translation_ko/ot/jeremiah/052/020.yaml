  rationale: עַמּוּדִים는 성전 기구 문맥에서 구조물인 ‘기둥’을 가리키므로, 간결하게 ‘두 기둥’으로 옮겼습니다.
- source_word: הַיָּם אֶחָד
  english_pob_choice: the one Sea
  chosen_korean: 한 바다
  alternatives_korean:
  - 그 하나의 바다
  - 한 물두멍
  lexicon: HALOT
  rationale: 여기서 יָם은 성전의 큰 물통인 전문 명칭이지만, 원문 형식을 살려 직역적으로 ‘한 바다’로 두었습니다.
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  english_pob_choice: and the twelve bronze oxen
  chosen_korean: 열두 청동 황소
  alternatives_korean:
  - 열두 청동 소
  - 열두 놋쇠 황소
  lexicon: HALOT
  rationale: בָּקָר는 이 문맥에서 받침 형상으로 쓰인 동물을 가리키므로 ‘황소’가 자연스럽고, נְחֹשֶׁת는 현대 고고학·번역 관례에 따라 ‘청동’으로 옮겼습니다.
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֻשְׁתָּם
  english_pob_choice: there was no weighing the bronze
  chosen_korean: 그 무게를 달 수 없었습니다
  alternatives_korean:
  - 무게가 없었습니다
  - 그 청동의 무게는 달지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘무게가 없었다’이지만, 문맥상 ‘달지 못했다/달 수 없었다’는 관용적 의미가 자연스럽습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: for the house of Yahweh
  chosen_korean: 야훼의 집을 위해
  alternatives_korean:
  - 여호와의 집을 위해
  - 주님의 집을 위해
  lexicon: HALOT
  rationale: 정의된 프로젝트 기본어에 따라 יהוה는 ‘야훼’로 옮기고, לְ는 목적을 나타내므로 ‘~을 위해’로 처리했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
