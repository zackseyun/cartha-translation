source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם אֶחָד֙ וְ/הַ/בָּקָ֞ר שְׁנֵים עָשָׂ֤ר נְחֹ֨שֶׁת֙ אֲשֶׁר תַּ֣חַת הַ/מְּכֹנ֔וֹת אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֻשְׁתָּ֖/ם כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
  footnotes:
  - marker: a
    text: Or 'the twelve oxen of bronze'; 'bulls' is also possible for the animal term here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'there was no weight for their bronze,' that is, the bronze of all these vessels was not weighed or was beyond reckoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 기둥과 한 바다와, 기둥 받침들 아래에 있던 열두 청동 황소 곧 솔로몬 왕이 야훼의 집을 위해 만들었던 이 모든 기구의 청동은 그 무게를 달 수 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 바다’입니다. 여기서 ‘바다’는 성전의 큰 물통을 가리키는 전문 명칭입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 청동의 무게가 없었다’는 뜻으로, 곧 그 청동의 무게를 달지 않았거나 셀 수 없었다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  english_pob_choice: the two pillars
  chosen_korean: 두 기둥
  alternatives_korean:
  - 두 받침기둥
  - 두 ستون
  lexicon: HALOT
  rationale: עַמּוּדִים는 성전 기구 문맥에서 구조물인 ‘기둥’을 가리키므로, 간결하게 ‘두 기둥’으로 옮겼습니다.
- source_word: הַיָּם אֶחָד
  english_pob_choice: the one Sea
  chosen_korean: 한 바다
  alternatives_korean:
  - 그 하나의 바다
  - 한 물두멍
  lexicon: HALOT
  rationale: 여기서 יָם은 성전의 큰 물통인 전문 명칭이지만, 원문 형식을 살려 직역적으로 ‘한 바다’로 두었습니다.
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  english_pob_choice: and the twelve bronze oxen
  chosen_korean: 열두 청동 황소
  alternatives_korean:
  - 열두 청동 소
  - 열두 놋쇠 황소
  lexicon: HALOT
  rationale: בָּקָר는 이 문맥에서 받침 형상으로 쓰인 동물을 가리키므로 ‘황소’가 자연스럽고, נְחֹשֶׁת는 현대 고고학·번역 관례에 따라 ‘청동’으로 옮겼습니다.
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֻשְׁתָּם
  english_pob_choice: there was no weighing the bronze
  chosen_korean: 그 무게를 달 수 없었습니다
  alternatives_korean:
  - 무게가 없었습니다
  - 그 청동의 무게는 달지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘무게가 없었다’이지만, 문맥상 ‘달지 못했다/달 수 없었다’는 관용적 의미가 자연스럽습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: for the house of Yahweh
  chosen_korean: 야훼의 집을 위해
  alternatives_korean:
  - 여호와의 집을 위해
  - 주님의 집을 위해
  lexicon: HALOT
  rationale: 정의된 프로젝트 기본어에 따라 יהוה는 ‘야훼’로 옮기고, לְ는 목적을 나타내므로 ‘~을 위해’로 처리했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 직접 하나님의 이름을 사용하므로, 본문에서는 일반 호칭이 아니라 고유명 표기를 살려 ‘야훼’로 일관했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
