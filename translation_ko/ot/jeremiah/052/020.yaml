  to: 두 기둥과 한 바다[a]와 받침대들 아래에 있던 열두 청동 황소, 곧 솔로몬 왕이 야훼의 집을 위하여 만든 이 모든 기구의 청동은 그 무게를 잴 수 없었습니다.[b]
