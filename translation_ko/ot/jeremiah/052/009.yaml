  source_fidelity: 핵심 동사와 지명은 대체로 충실합니다. 그러나 ‘바벨론 왕에게 있는 하맛 땅 리블라’는 리블라가 바벨론 왕에게 속하거나 왕이 그에게 있다는 뜻으로 읽힐 수 있어, 히브리어의 수식 관계(하맛 땅에 있는 리블라)를 분명히 해야 합니다. 또한 משפטים의 법정적 관용구는 ‘판결을 내리다’로 적절히 전달됩니다.
  naturalness: ‘하맛 땅 리블라에 있는 바벨론 왕에게로’가 현대 표준 한국어에서 지리적 수식 관계와 이동의 목적지를 가장 자연스럽게 드러냅니다. 마지막 절은 대명사 반복을 피하고 주어를 밝혀 ‘바벨론 왕은 그에게’로 쓰는 편이 명료합니다.
  terminology: ‘사로잡아’, ‘바벨론 왕’, ‘하맛 땅’, ‘리블라’, ‘판결을 내렸습니다’는 문맥과 합쇼체에 적합합니다. משפטים의 복수형을 기계적으로 ‘판결들’이라 하지 않고 한국어 법률 관용구로 옮긴 것은 타당합니다.
