base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/009.yaml
  text: They captured the king and brought him up to the king of Babylon at Riblah in the land of Hamath[a], and he passed sentence on him.
  footnotes:
  - marker: a
    text: Or, 'and he passed sentence on him.' The Hebrew literally says, 'and he spoke judgments with/to him,' an idiom for issuing judicial decisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕을 사로잡아 하맛 땅 리블라에 있는 바벨론 왕에게로 끌고 올라갔고, 바벨론 왕은 그에게 판결을 내렸습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그와 판결들을 말하였다’입니다. 이는 법적 결정을 내리거나 형을 선고한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  english_pob_choice: They captured
  chosen_korean: 사로잡아
  alternatives_korean:
  - 붙잡아
  - 포로로 삼아
  lexicon: HALOT
  rationale: 군사적 맥락에서 תפשׂ는 단순한 ‘잡다’보다 포획의 의미가 분명하여, 현대 한국어에서 자연스럽고 강한 ‘사로잡다’로 옮겼습니다.
- source_word: וַיַּעֲלוּ אֹתוֹ אֶל
  english_pob_choice: and brought him up to
  chosen_korean: 끌고 올라갔고
  alternatives_korean:
  - 데리고 올라갔고
  - 끌어 올렸고
  lexicon: HALOT
  rationale: עלה의 방향 감각을 살리되, 한국어에서 부자연스럽지 않게 ‘끌고 올라가다’로 표현했습니다.
- source_word: מִשְׁפָּטִים
  english_pob_choice: and he passed sentence on him
  chosen_korean: 판결을 내렸습니다
  alternatives_korean:
  - 그에게 판결을 선고했습니다
  - 그에게 심판을 내렸습니다
  lexicon: HALOT
  rationale: 직역하면 ‘판결들’을 ‘그에게 말했다’는 구조지만, 문맥상 법정 선고를 뜻하므로 한국어 관용에 맞게 ‘판결을 내리다’로 옮겼습니다. 복수형의 뉘앙스는 공식적 판정 행위로 보존했습니다.
- source_word: רִבְלָתָה בְּאֶרֶץ חֲמָת
  english_pob_choice: at Riblah in the land of Hamath
  chosen_korean: 하맛 땅 리블라로
  alternatives_korean:
  - 하맛 지역의 리블라로
  - 하맛의 땅 리블라로
  lexicon: HALOT
  rationale: 지명은 음역을 유지하고, בְּאֶרֶץ는 통상적인 지리 표지로서 ‘하맛 땅’으로 옮겼습니다.
theological_decisions:
- issue: Judicial idiom מִשְׁפָּטִים의 전달
  chosen_reading: 단순한 ‘말하다’가 아니라 왕의 공식적 판결 행위로 이해하여 번역했습니다.
  alternative_readings:
  - 그에게 판결들을 말했다
  - 그에게 심판을 선언했다
  rationale: 히브리어 관용구를 한국어에서 이해 가능한 법정 표현으로 옮겨, 바벨론 왕의 권위적 처분이라는 장면의 힘을 보존했습니다.
  doctrine_reference: 본문 서술의 역사적-법정적 의미
