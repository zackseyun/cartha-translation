id: JER.52.26
reference: Jeremiah 52:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אוֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אוֹתָ֛/ם אֶל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/026.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
  footnotes:
  - marker: a
    text: Or 'led them to the king of Babylon at Riblah.' The Hebrew verb can be rendered 'brought' or 'led' in this context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'chief of the slaughterers.' In context this denotes the commander of the royal guard, and possibly includes execution duties.
    reason: lexical_alternative
translation:
  language: ko
  text: 느부사라단[a], 곧 친위대의 대장[b]이 그들을 사로잡아 바벨론 왕에게, 립나에 있는 왕에게로 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 립나에 있는 바벨론 왕에게로 데려갔다’로 옮길 수 있습니다. כאן의 동사는 ‘데려갔다’와 ‘인도했다’ 둘 다 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘도살자들의 우두머리’입니다. 여기서는 왕실 친위대의 지휘관을 가리키며, 문맥에 따라 처형 임무를 포함했을 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח / אוֹתָם
  english_pob_choice: took them
  chosen_korean: 그들을 사로잡아
  alternatives_korean:
  - 그들을 데리고
  - 그들을 잡아
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘데려감’보다 포로를 붙잡아 이동시킨 뜻이 분명하므로, ‘사로잡다’로 포착해 동작의 결과를 살렸습니다.
- source_word: נְבוּזַרְאֲדָן
  english_pob_choice: Nebuzaradan
  chosen_korean: 느부사라단
  alternatives_korean:
  - 네부사라단
  lexicon: 표준 음역 관례
  rationale: 성경 인명은 한국어 성경권에서 널리 쓰이는 음역을 따랐습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 친위대의 대장
  alternatives_korean:
  - 경호대의 대장
  - 처형 집행관의 우두머리
  lexicon: HALOT
  rationale: 직역하면 ‘도살자들의 우두머리’이지만 왕실 문맥에서는 왕의 친위·호위 책임자를 가리키므로, 본문의 기능을 드러내는 ‘친위대의 대장’으로 옮겼습니다.
- source_word: וַיֹּלֶךְ ... אֶל מֶלֶךְ בָּבֶל רִבְלָתָה
  english_pob_choice: brought them to the king of Babylon at Riblah
  chosen_korean: 바벨론 왕에게, 립나에 있는 왕에게로 데려갔습니다
  alternatives_korean:
  - 립나의 바벨론 왕에게 데려갔습니다
  - 바벨론 왕이 있는 립나로 데려갔습니다
  lexicon: HALOT
  rationale: אֶל은 기본적으로 ‘~에게/로’이므로 도착 방향을 살리고, ‘at Riblah’를 왕의 위치를 수식하는 말로 처리해 영어 POB의 해석을 반영했습니다.
theological_decisions:
- issue: רִבְלָתָה의 위치 표지와 ‘바벨론 왕’의 수식 관계
  chosen_reading: ‘바벨론 왕에게, 립나에 있는 왕에게로’로 두 번의 도착 지점을 분리해 읽었습니다.
  alternative_readings:
  - ‘립나에 있는 바벨론 왕에게’
  - ‘바벨론 왕을 립나로 데려갔다’
  rationale: 히브리어 본문은 ‘바벨론 왕’과 ‘립나’의 관계를 단정적으로 한 가지 방식으로만 묶지 않으므로, 왕의 위치를 덧붙이는 해석을 본문 흐름 안에서 투명하게 드러냈습니다.
  doctrine_reference: 본문 해석의 문맥 일치성
