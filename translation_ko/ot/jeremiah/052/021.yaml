base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/021.yaml
  text: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
  footnotes:
  - marker: a
    text: Or 'four fingerbreadths.' The Hebrew literally reads 'four fingers,' using a body-based unit of measure.
    reason: lexical_alternative
translation:
  language: ko
  text: 기둥들에 관해서는, 각 기둥의 높이는 열여덟 규빗이었고, 열두 규빗의 줄이 그것을 둘렀으며, 그 두께는 네 손가락이었고, 속이 비어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 손가락너비’. 히브리어는 문자적으로 ‘네 손가락’이라고 하며, 신체를 기준으로 한 길이 단위입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעַמּוּדִים
  english_pob_choice: As for the pillars
  chosen_korean: 기둥들에 관해서는
  alternatives_korean:
  - 그리고 기둥들은
  - 기둥들은
  lexicon: HALOT
  rationale: 목록형 설명의 도입부로서 단순한 ‘그리고’보다 주제를 꺼내는 표현이 자연스럽고, 복수형 ‘기둥들’로 두 기둥 전체를 가리키는 점을 살렸습니다.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קֹמָה הָעַמּוּד הָאֶחָד
  english_pob_choice: the height of each pillar was eighteen cubits
  chosen_korean: 각 기둥의 높이가 열여덟 규빗이었고
  alternatives_korean:
  - 한 기둥의 높이는 열여덟 규빗이었고
  - 각각의 기둥은 높이가 열여덟 규빗이었고
  lexicon: HALOT
  rationale: 히브리어의 ‘한 기둥’ 측정이 이 문맥에서 각각의 기둥에 적용됨을 드러내기 위해 ‘각 기둥’으로 옮겼습니다.
- source_word: חוּט שְׁתֵּים עֶשְׂרֵה אַמָּה יְסֻבֶּנּוּ
  english_pob_choice: a line of twelve cubits would go around it
  chosen_korean: 둘레에는 열두 규빗짜리 줄이 둘릴 수 있었으며
  alternatives_korean:
  - 열두 규빗의 줄이 그것을 둘렀으며
  - 열두 규빗짜리 줄이 그것을 둘러쌌으며
  lexicon: HALOT
  rationale: חוּט를 ‘줄’로, סבב의 둘러 감는 뜻을 ‘둘리다’로 풀어, 길이 측정과 둘레를 잰다는 이미지를 함께 살렸습니다.
- source_word: אַרְבַּע אַצְבָּעוֹת
  english_pob_choice: four fingers
  chosen_korean: 네 손가락
  alternatives_korean:
  - 네 손가락너비
  - 네 손가락폭
  lexicon: HALOT
  rationale: 원문이 문자적으로 ‘네 손가락’이므로 구체적인 신체 단위를 보존했습니다. 한국어에서는 ‘손가락’이 자연스러운 대응입니다.
- source_word: נָבוּב
  english_pob_choice: it was hollow
  chosen_korean: 속이 비어 있었습니다
  alternatives_korean:
  - 텅 비어 있었습니다
  - 속이 비었습니다
  lexicon: HALOT
  rationale: 기둥의 내부가 비어 있다는 상태를 자연스러운 현대어로 분명히 전달하되, ‘hollow’의 구조적 의미를 유지했습니다.
