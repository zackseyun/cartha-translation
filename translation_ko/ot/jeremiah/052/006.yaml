base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/006.yaml
  text: In the fourth month[a], on the ninth day of the month, the famine became severe in the city, and there was no bread for the people of the land.
  footnotes:
  - marker: a
    text: Or 'for the common people.' The Hebrew phrase 'people of the land' can, in some contexts, refer more specifically to the populace or common people.
    reason: lexical_alternative
translation:
  language: ko
  text: 넷째 달[a] 아홉째 날에 성읍 안에 기근이 더욱 심해졌고, 그 땅의 백성을 위해 빵이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평민들에게.’ 히브리어 구문 ‘그 땅의 백성’은 어떤 문맥에서는 더 구체적으로 일반 백성이나 평민을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרְבִיעִי
  english_pob_choice: In the fourth month
  chosen_korean: 넷째 달
  alternatives_korean:
  - 넷째 달에
  - 네 번째 달
  lexicon: HALOT
  rationale: 히브리어의 정해진 서수형 날짜 표현을 자연스러운 한국어 날짜 표지로 옮겼습니다. 영어처럼 ‘of the year’를 덧붙이지 않고 원문에 있는 정보만 반영했습니다.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  english_pob_choice: on the ninth day of the month
  chosen_korean: 아홉째 날에
  alternatives_korean:
  - 아홉째 날
  - 그 달의 아홉째 날에
  lexicon: HALOT
  rationale: 달력 날짜를 한국어로 간결하게 처리하되, 문맥상 앞의 ‘넷째 달’과 함께 읽히도록 했습니다. ‘날’은 영어 POB의 ‘day’를 반영한 것으로, 원문의 의미를 분명하게 합니다.
- source_word: וַיֶּחֱזַק הָרָעָב
  english_pob_choice: the famine became severe
  chosen_korean: 기근이 더욱 심해졌고
  alternatives_korean:
  - 기근이 강해졌고
  - 기근이 세졌고
  - 기근이 심해졌고
  lexicon: HALOT
  rationale: חזק의 문자적 ‘강해지다’보다, 주어가 기근인 문맥에서 ‘더욱 심해지다’가 실제 의미를 더 정확하고 자연스럽게 드러냅니다. 영어 POB의 ‘became severe’를 직접 반영했습니다.
- source_word: וְלֹא הָיָה לֶחֶם
  english_pob_choice: and there was no bread
  chosen_korean: 빵이 없었습니다
  alternatives_korean:
  - 떡이 없었습니다
  - 먹을 것이 없었습니다
  lexicon: HALOT
  rationale: לֶחֶם의 기본 뜻을 살려 ‘빵’으로 옮겼습니다. 한국어에서 ‘빵’은 현대 독자에게도 식량 부재의 긴박함을 분명하게 전달합니다.
- source_word: לְעַם הָאָרֶץ
  english_pob_choice: for the people of the land
  chosen_korean: 그 땅의 백성을 위해
  alternatives_korean:
  - 그 땅의 사람들에게
  - 그 땅의 사람들을 위해
  - 그 나라의 백성을 위해
  lexicon: HALOT
  rationale: ‘땅’(הָאָרֶץ)의 지시를 살리면서도, 이 구절에서는 사회적 뉘앙스를 과도하게 풀지 않고 영어 POB의 문구를 따라 최대한 직역했습니다. ‘백성’은 집단 전체를 가리키는 표현으로 자연스럽습니다.
