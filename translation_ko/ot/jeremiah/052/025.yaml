revisions:
- from: 그 성에서 한 내시를 붙잡았는데, 그는 전사들을 맡도록 임명된 자였고, 왕의 얼굴을 뵈던 자들 가운데 일곱 사람과 성 안에서 발견된 군대 지휘관의 서기관, 곧 그가 그 땅의 백성을 징집하던 자, 그리고 성 안에 있던 그 땅의 백성 육십 명도 붙잡았습니다.[a]
  to: 그 성에서 그는 전투 병사들을 맡도록 임명된 궁정 관리 한 사람과 왕의 얼굴을 뵙던 이들 가운데 성 안에서 발견된 일곱 사람[a]과, 그 땅의 백성을 징집하던 군대 지휘관의 서기관과, 성 안에서 발견된 그 땅의 백성 육십 명을 데려갔습니다.
  rationale: 원문의 행위(‘데려갔다’)와 סָרִיס의 의미 범위를 보존하고, 징집 행위의 주체를 군대 지휘관으로 명확히 하였습니다. 궁정 관용구는 본문에서 직역적으로 유지하되, 설명 각주를 해당 표현에 직접 연결했습니다.
