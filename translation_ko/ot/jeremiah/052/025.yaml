id: JER.52.25
reference: Jeremiah 52:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר הָיָ֥ה פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/שִׁבְעָ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת סֹפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בְּ/ת֥וֹךְ הָ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/025.yaml
  text: And from the city he took one court official who had been appointed over the men of war[a], and seven men from those who saw the king’s face, who were found in the city, and the scribe of the commander of the army, who mustered the people of the land, and sixty men from the people of the land who were found within the city.
  footnotes:
  - marker: a
    text: Or, 'from the king’s personal attendants,' since 'those who saw the king’s face' is a court idiom for those with direct access to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성에서 그는 전투 병사들을 맡도록 임명된 궁정 관리 한 사람과 왕의 얼굴을 뵙던 이들 가운데 성 안에서 발견된 일곱 사람[a]과, 그 땅의 백성을 징집하던 군대 지휘관의 서기관과, 성 안에서 발견된 그 땅의 백성 육십 명을 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕의 개인 시종들” — “왕의 얼굴을 뵙던 이들”은 왕에게 직접 나아갈 수 있는 사람들을 가리키는 궁정 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  english_pob_choice: court official
  chosen_korean: 내시
  alternatives_korean:
  - 궁정 관리
  - 시종
  lexicon: HALOT
  rationale: WLC의 סָרִיס는 문맥상 단순한 ‘관리’보다 궁정 소속의 신분을 가리킬 수 있어, 영어 POB가 의미 범위를 넓게 잡은 점을 고려하되 한국어에서는 가장 표지성이 큰 ‘내시’를 기본값으로 두었습니다.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: had been appointed over the men of war
  chosen_korean: 전사들을 맡도록 임명된
  alternatives_korean:
  - 군사들을 감독하도록 임명된
  - 전사들 위에 세워진
  lexicon: HALOT
  rationale: ‘פָקִיד’의 임명·위임된 관리 역할을 살려 직역적이되 자연스러운 ‘맡도록 임명된’으로 옮겼습니다.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  english_pob_choice: from those who saw the king’s face
  chosen_korean: 왕의 얼굴을 뵈던 자들 가운데
  alternatives_korean:
  - 왕 앞에 나아갈 수 있던 자들 가운데
  - 왕의 면전 출입이 허락된 자들 가운데
  lexicon: HALOT
  rationale: 영어 POB처럼 궁정 관용구를 보존하되, 한국어에서는 ‘뵈다’로 왕에게 직접 접근하는 특권적 지위를 드러냈습니다.
- source_word: סֹפֵר שַׂר הַצָּבָא הַמַּצְבִּא אֶת עַם הָאָרֶץ
  english_pob_choice: the scribe of the commander of the army, who mustered the people of the land
  chosen_korean: 군대 지휘관의 서기관, 곧 그가 그 땅의 백성을 징집하던 자
  alternatives_korean:
  - 군대 지휘관의 서기관, 곧 그가 그 땅의 백성을 모집하던 자
  - 군대 지휘관의 서기, 그가 그 땅의 백성을 징발하던 자
  lexicon: HALOT
  rationale: ‘서기관’은 문서·행정 직무를, ‘징집하던’은 הִפְעִיל 분사의 군사 행정 의미를 살리며, 관계절의 주체가 누구인지 분명히 하기 위해 ‘곧’으로 풀어 주었습니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 토지의 백성
  lexicon: HALOT
  rationale: 영어 POB의 관용구를 그대로 반영하되, 한국어에서는 문맥상 민중·지역 주민을 뜻하는 고정구로서 ‘그 땅의 백성’을 유지했습니다.
theological_decisions:
- issue: 왕의 얼굴을 ‘보는’ 궁정 관용구의 처리
  chosen_reading: 직역의 이미지를 살리되, 한국어에서는 ‘뵈던 자들’로 옮겨 왕에게의 직접 접근권을 나타냈습니다.
  alternative_readings:
  - ‘왕의 측근들’로 의미를 풀어 쓰는 방식
  - ‘왕의 개인 시종들’로 해설적으로 옮기는 방식
  rationale: 본문은 단순한 시각 행위가 아니라 궁정 접근권을 뜻하는 관용구이므로, 의미를 평탄화하지 않고 관용구의 힘을 유지하는 것이 source-direct합니다.
  doctrine_reference: 본문 의미 보존 원칙
- issue: סָרִיס의 신분 범위
  chosen_reading: ‘내시’를 기본 번역으로 택하되, 본문이 요구하는 이상으로 신체 상태를 단정하지는 않았습니다.
  alternative_readings:
  - ‘궁정 관리’로 완화하는 방식
  - ‘환관’으로 더 강하게 특정하는 방식
  rationale: 이 단어는 신체적 의미와 관직적 의미를 모두 가질 수 있으므로, 문맥이 행정·궁정 배경일 때에는 의미 범위를 지나치게 좁히지 않는 균형이 필요합니다.
  doctrine_reference: 어휘 범위 보존 원칙
