  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצ֑וֹר עַ֚ד עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ צִדְקִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/005.yaml
  text: So the city came under siege until the eleventh year of King Zedekiah.
translation:
  language: ko
  text: 그 성읍은 시드기야 왕의 열한째 해까지 포위를 당했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא ... בַּמָּצוֹר
  english_pob_choice: came under siege
  chosen_korean: 포위를 당했습니다
  alternatives_korean:
  - 포위되었습니다
  - 공성에 들어갔습니다
  - 포위 상태가 되었습니다
  lexicon: בוא + מצור
  rationale: 히브리어는 성읍이 ‘포위 상태로 들어감/오게 됨’을 말하므로, 영어 POB의 came under siege를 따라 결과 상태를 자연스럽게 한국어로 옮겼습니다. 다만 ‘당했습니다’는 수동성을 살리면서도 현대 문체에 맞습니다.
- source_word: הָעִיר
  english_pob_choice: the city
  chosen_korean: 그 성읍은
  alternatives_korean:
  - 그 도성은
  - 그 도시가
  - 성읍이
  lexicon: עִיר
  rationale: 본문의 עיר는 예루살렘을 가리키는 문맥상의 ‘성읍’이므로, 일반적 ‘도시’보다 성서 문체에 맞는 ‘성읍’을 택했습니다.
- source_word: עַד עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  english_pob_choice: until the eleventh year
  chosen_korean: 열한째 해까지
  alternatives_korean:
  - 열한 해까지
  - 열한 번째 해까지
  lexicon: עַשְׁתֵּי עֶשְׂרֵה
  rationale: 히브리어 서수 표현을 한국어 서수 ‘열한째’로 옮겨 연대기적 표현을 간결하게 살렸습니다.
- source_word: לַמֶּלֶךְ צִדְקִיָּהוּ
  english_pob_choice: King Zedekiah
  chosen_korean: 시드기야 왕의
  alternatives_korean:
  - 시드기야 왕의 통치 기간에
  - 시드기야 왕 때
  lexicon: צִדְקִיָּהוּ
  rationale: 소유격 구조를 자연스럽게 풀어 ‘시드기야 왕의’로 옮겼고, 고유명사는 통상적인 성서 표기인 시드기야를 유지했습니다.
theological_decisions:
- issue: 문장의 사건성 표현
  chosen_reading: 성읍이 단순히 ‘있었다’가 아니라 ‘포위를 당했다’는 진행/결과 상태를 드러냈습니다.
  alternative_readings:
  - 그 성읍은 포위되었습니다.
  - 그 성읍은 포위 상태에 있었습니다.
  rationale: 원문 וַתָּבֹא ... בַּמָּצוֹר는 포위가 성읍에 임한 사건을 서술하므로, 사건성과 결과 상태를 함께 드러내는 표현이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 서사 본문의 사건 서술 보존
