  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אִתּ֖/וֹ טֹב֑וֹת וַ/יִּתֵּן֙ אֶת כִּסְא֔/וֹ מִ/מַּ֗עַל לְ/כִסֵּ֧א מלכים אֲשֶׁ֥ר אִתּ֖/וֹ בְּ/בָבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/032.yaml
  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a].
  footnotes:
  - marker: a
    text: Or 'spoke good things to him,' that is, 'spoke favorably/kindly to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 친절하게 말하고, 바벨론에 있던 그와 함께한 왕들의 보좌보다 그의 보좌를 더 높이 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게 좋은 것들을 말했다’로, 곧 그에게 호의적이고 친절하게 말했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ
  english_pob_choice: He spoke to him
  chosen_korean: 그에게 친절하게 말하고
  alternatives_korean:
  - 그에게 말하고
  - 그에게 좋은 말을 하고
  lexicon: HALOT
  rationale: דבר עם/את는 단순 발화보다 ‘~에게 말하다’의 의미이고, 이어지는 טֹבוֹת를 함께 살려 ‘친절하게 말하다’로 자연스럽게 옮겼습니다.
- source_word: טֹבוֹת
  english_pob_choice: kindly
  chosen_korean: 친절하게
  alternatives_korean:
  - 좋은 것들을
  - 호의적으로
  lexicon: HALOT
  rationale: 문자적으로는 ‘좋은 것들’이지만, כאן에서는 לדבר과 결합해 호의적이고 우호적인 말하기를 뜻하므로 한국어 부사 ‘친절하게’가 가장 자연스럽습니다.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  english_pob_choice: set his throne
  chosen_korean: 그의 보좌를 더 높이 두었습니다
  alternatives_korean:
  - 그의 보좌를 세웠습니다
  - 그의 왕좌를 두었습니다
  lexicon: HALOT
  rationale: נתן את כסאו는 왕실 맥락에서 지위의 배치를 가리키므로, 단순히 ‘주다’보다 ‘더 높이 두다’로 위계의 상승을 드러냈습니다.
- source_word: כִּסֵּא
  english_pob_choice: throne
  chosen_korean: 보좌
  alternatives_korean:
  - 왕좌
  - 자리
  lexicon: HALOT
  rationale: 왕들의 위계와 관련된 כסא는 ‘자리’보다 ‘보좌’가 격식 있고 왕권의 의미를 잘 보존합니다.
theological_decisions:
- issue: 바벨론의 왕과 그와 함께한 다른 왕들 사이의 위계 표현
  chosen_reading: 느부갓네살이 다른 왕들보다 이 사람의 지위를 높여 준 왕실적 처우로 읽었습니다.
  alternative_readings:
  - 단순한 물리적 자리 배치로 볼 수 있습니다.
  - 상징적 예우로만 볼 수 있습니다.
  rationale: 문맥상 ‘보좌를 더 높이 두었습니다’는 실제 공간 배치이면서 동시에 지위 상승을 나타내므로, 두 층위를 함께 보존했습니다.
  doctrine_reference: 역사서의 왕실 어휘와 서술 문맥
- issue: ‘친절하게 말하다’의 윤리적 뉘앙스
  chosen_reading: 말의 내용 자체보다 우호적이고 호의적인 태도를 나타내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘좋은 말을 했다’로 직역할 수 있습니다.
  - ‘잘 대해 주었다’로 의역할 수 있습니다.
  rationale: 히브리어 טֹבוֹת가 단순한 정보 전달이 아니라 호의적 발화를 가리키므로, 문장 전체의 왕실적 호의를 살리는 방향이 적절합니다.
  doctrine_reference: 히브리어 어휘 의미론
