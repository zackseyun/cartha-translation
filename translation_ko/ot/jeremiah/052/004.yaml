theological_decisions:
- issue: 공성 서술의 동작 강도와 방향성
  chosen_reading: ‘예루살렘에 와서, 그 성을 향하여 진을 치고 주위에 공성벽을 쌓았습니다’로 옮겨, 단순 이동이 아니라 적대적 포위·공격 행위임을 드러냈습니다.
  alternative_readings:
  - 예루살렘에 진을 쳤습니다
  - 예루살렘을 포위했습니다
  rationale: 본문은 왕과 군대의 도착, 진치기, 공성시설 축조를 연속적으로 제시하므로, 각 동작을 분리해 포위전의 진행을 분명히 보여 주는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 역사서술의 서사적-군사적 맥락 보존
