base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/004.yaml
  text: And in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, Nebuchadnezzar king of Babylon came—he and all his army—against Jerusalem[b], and they encamped against it and built a siege wall around it.
  footnotes:
  - marker: a
    text: Hebrew דָּיֵק can also be rendered 'siegeworks' or 'rampart.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew spelling of the king's name here corresponds more closely to 'Nebuchadrezzar'; English tradition commonly uses 'Nebuchadnezzar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 통치 제구년, 곧 열째 달 열흘째 되는 날에 바빌론 왕 느부갓네살이 그와 그의 온 군대를 거느리고 예루살렘에 와서, 그 성을 향하여 진을 치고 주위에 공성벽을 쌓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּיֵק은 ‘공성벽’ 외에도 ‘포위망’ 또는 ‘토루’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 철자상 이 이름은 ‘느부갓레살’에 더 가깝습니다. 한국어 성경에서는 관용적으로 ‘느부갓네살’을 널리 씁니다.
    reason: lexical_alternative
