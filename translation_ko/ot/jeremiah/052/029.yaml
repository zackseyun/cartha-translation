theological_decisions:
- issue: 인구 집계에서 נֶפֶשׁ의 의미
  chosen_reading: ‘832명’으로 옮겨, 본문의 통계적·행정적 성격을 드러냈습니다.
  alternative_readings:
  - ‘832 영혼’
  - ‘832 사람들’
  rationale: 이 절은 포로 이송 명단의 집계이므로, נֶפֶשׁ를 신학적으로 확대하지 않고 인원수 표기로 처리하는 것이 본문 의도에 충실합니다.
  doctrine_reference: 본문의 역사 서술과 어휘 용법
