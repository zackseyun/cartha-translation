    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת
  english_pob_choice: In the ... year
  chosen_korean: '...째 해에'
  alternatives_korean:
  - '...년'
  - '...해에'
  lexicon: HALOT
  rationale: 히브리어 연대 표지로서 한국어에서는 자연스러운 연호 표현인 ‘열여덟째 해에’를 사용했습니다.
- source_word: לִנְבוּכַדְרֶאצַּר
