theological_decisions:
- issue: 반복 강조의 처리
  chosen_reading: 히브리어의 ‘gold, gold / silver, silver’ 반복을 한국어에서도 의미상 보존하되, 어색한 중복 낭독은 피하도록 ‘금이면 금, 은이면 은이었던 것들’로 옮겼습니다.
  alternative_readings:
  - 금, 금… 은, 은…처럼 직역
  - 금으로 된 것은 금, 은으로 된 것은 은
  rationale: 이 절의 핵심은 신학적 논쟁보다 성전 기물의 철저한 약탈과 항목 전수입니다. 반복 강조를 지우지 않으면서도 한국어 가독성을 유지하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 문맥상 성전 기물 약탈 묘사; 반복 수사 보존
