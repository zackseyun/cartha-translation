  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּפִּים וְ/אֶת הַ/מַּחְתּ֨וֹת וְ/אֶת הַ/מִּזְרָק֜וֹת וְ/אֶת הַ/סִּיר֣וֹת וְ/אֶת הַ/מְּנֹר֗וֹת וְ/אֶת הַ/כַּפּוֹת֙ וְ/אֶת הַ/מְּנַקִי֔וֹת אֲשֶׁ֤ר זָהָב֙ זָהָ֔ב וַ/אֲשֶׁר כֶּ֖סֶף כָּ֑סֶף לָקַ֖ח רַב טַבָּחִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/019.yaml
  text: And the bowls[a], the firepans, the basins, the pots, the lampstands, the cups, and the vessels for pouring—whatever was gold, gold, and whatever was silver[d][c][b], silver—the captain of the guard took.
  footnotes:
  - marker: a
    text: Or 'the cups' for 'the bowls' (הַסִּפִּים); the exact distinction among several temple vessel terms in this list is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'the censers' for 'the firepans.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew repeats ''gold, gold'' and ''silver, silver'' for emphasis: ''whatever was of gold, gold, and whatever was of silver, silver.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'the chief of the executioners' for 'the captain of the guard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 bowls[a], firepans[b], basins, pots, lampstands, cups, 그리고 pouring vessels는—금이면 금, 은이면 은이었던 것들을—경호대장이 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘bowls’는 ‘그릇들’이나 ‘대접들’로도 옮길 수 있습니다. 히브리어 הַסִּפִּים의 정확한 기물 구분은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘firepans’는 ‘향로들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים
  english_pob_choice: the bowls
  chosen_korean: bowls[a]
  alternatives_korean:
  - 그릇들
  - 잔들
  - 대접들
  lexicon: HALOT
  rationale: 이 목록에서는 앞뒤의 다른 기명과 구별되도록 일반적인 ‘그릇들/대접들’보다 형태를 그대로 두는 편이 항목 구분을 더 잘 보존합니다. 다만 의미 범위가 넓어 POB의 영어 선택을 따라 각주로 대안 가능성을 표시했습니다.
- source_word: הַמַּחְתּוֹת
  english_pob_choice: the firepans
  chosen_korean: firepans[b]
  alternatives_korean:
  - 향로들
  - 화로들
  lexicon: HALOT
  rationale: 성전 기물 목록의 구체성을 살리기 위해 일반적인 ‘향로’보다, 불과 숯을 옮기는 용기라는 물리적 감각이 드러나는 ‘firepans’를 반영했습니다. 한국어에서는 다소 낯설 수 있어 대안 의미를 각주로 남겼습니다.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  english_pob_choice: whatever was of gold, gold, and whatever was of silver, silver
  chosen_korean: 금이면 금, 은이면 은이었던 것들을
  alternatives_korean:
  - 금으로 된 것은 금, 은으로 된 것은 은
  - 금인 것은 금, 은인 것은 은
  lexicon: HALOT
  rationale: 히브리어의 반복적 강조를 한국어에서도 평이하게 살리기 위해 ‘…이면 …’ 구조로 옮겼습니다. ‘금, 금 / 은, 은’의 반복은 자연스러운 독서 흐름을 해치므로 의미는 유지하되 한국어 문장으로는 매끈하게 처리했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 시위대장
  - 처형 집행관의 우두머리
  lexicon: HALOT
  rationale: 직역의 ‘처형 집행관’은 현대 한국어 독자에게 과도하게 좁고 오해를 부를 수 있어, POB의 공문서적·군사행정적 뉘앙스를 살리는 ‘경호대장’을 선택했습니다.
theological_decisions:
- issue: 반복 강조의 처리
  chosen_reading: 히브리어의 ‘gold, gold / silver, silver’ 반복을 한국어에서도 의미상 보존하되, 어색한 중복 낭독은 피하도록 ‘금이면 금, 은이면 은이었던 것들’로 옮겼습니다.
  alternative_readings:
  - 금, 금… 은, 은…처럼 직역
  - 금으로 된 것은 금, 은으로 된 것은 은
  rationale: 이 절의 핵심은 신학적 논쟁보다 성전 기물의 철저한 약탈과 항목 전수입니다. 반복 강조를 지우지 않으면서도 한국어 가독성을 유지하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 문맥상 성전 기물 약탈 묘사; 반복 수사 보존
