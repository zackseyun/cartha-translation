source:
  edition: WLC
  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥יגוּ אֶת צִדְקִיָּ֖הוּ בְּ/עַֽרְבֹ֣ת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/008.yaml
  text: But the army of the Chaldeans pursued the king and overtook Zedekiah in the plains of Jericho[b][a], and all his army was scattered from him.
  footnotes:
  - marker: a
    text: Or “the steppes of Jericho.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “all his army were scattered from him”; English uses singular “army” as a collective noun.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 갈대아 군대가 왕을 추격하여 여리고 평원[a]에서 시드기야를 따라잡았고, 그의 모든 군대가 그에게서 흩어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여리고의 스텝 지대.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  english_pob_choice: the army of the Chaldeans
  chosen_korean: 갈대아 군대
  alternatives_korean:
  - 갈대아들의 군대
  - 바빌로니아 군대
  lexicon: HALOT
  rationale: חֵיל은 여기서 군사력/군대를 뜻하며, כַּשְׂדִּים은 본문의 역사적·민족적 명칭인 갈대아로 옮기는 것이 원문에 가장 가깝습니다.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי הַמֶּלֶךְ
  english_pob_choice: pursued the king
  chosen_korean: 왕을 뒤쫓아가
  alternatives_korean:
  - 왕을 추격하여
  - 왕을 쫓아가
  lexicon: HALOT
  rationale: רדף는 군사 서술에서 ‘추격하다’의 뜻이므로, 현대 한국어에서는 ‘뒤쫓아가’가 자연스럽고 긴박한 추격의 뉘앙스를 살립니다.
- source_word: בְּעַרְבֹת יְרֵחוֹ
  english_pob_choice: in the plains of Jericho
  chosen_korean: 여리고 평원
  alternatives_korean:
  - 여리고의 초원지대
  - 여리고의 스텝 지역
  lexicon: HALOT
  rationale: עֲרָבוֹת은 평원/스텝 지대를 가리키지만, 한국어로는 ‘평원’이 가장 분명하고 읽기 쉽습니다.
- source_word: וַיַּשִּׂיגוּ אֶת צִדְקִיָּהוּ
  english_pob_choice: overtook Zedekiah
  chosen_korean: 시드기야를 따라잡았고
  alternatives_korean:
  - 시드기야를 따라잡아
  - 시드기야에게 이르렀고
  lexicon: HALOT
  rationale: נשׂג는 추격하여 따라잡는 뜻이므로 ‘따라잡다’가 의미를 가장 정확히 전달합니다.
- source_word: וְכָל חֵילוֹ נָפֹצוּ מֵעָלָיו
  english_pob_choice: and all his army was scattered from him
  chosen_korean: 그의 모든 군대는 그에게서 흩어졌습니다
  alternatives_korean:
  - 그의 모든 군대가 그에게서 흩어졌습니다
  - 그의 모든 군대는 그에게서 흩어져 버렸습니다
  lexicon: HALOT
  rationale: 히브리어는 집합명사 ‘군대’를 주어로 하며 ‘그에게서’라는 분리 표현을 포함하므로, 한국어에서도 그 관계를 분명히 드러냈습니다.
theological_decisions:
- issue: 본문의 종결 서술이 왕의 추격·포획과 군대의 붕괴를 함께 제시하는 방식
  chosen_reading: 시드기야의 도주가 실패로 끝났고, 그의 군대도 왕에게서 이탈해 붕괴되었음을 직설적으로 드러내는 역사 서술로 옮겼습니다.
  alternative_readings:
  - 보다 완곡하게 ‘패배했다’로 묶어 표현할 수 있음
  - 군대의 흩어짐을 단순한 전술적 재배치로 완화해 읽을 수 있음
  rationale: 문맥은 예루살렘 함락 직전의 급박한 추격과 완전한 붕괴를 강조하므로, 서술의 강도를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 역사서의 심판·몰락 서술 원칙
