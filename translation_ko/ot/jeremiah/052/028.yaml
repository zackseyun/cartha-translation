id: JER.52.28
reference: Jeremiah 52:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֣ה הָ/עָ֔ם אֲשֶׁ֥ר הֶגְלָ֖ה נְבֽוּכַדְרֶאצַּ֑ר בִּ/שְׁנַת שֶׁ֕בַע יְהוּדִ֕ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/עֶשְׂרִ֥ים וּ/שְׁלֹשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/028.yaml
  text: 'These are the people whom Nebuchadnezzar carried away captive: in the seventh year[b][a], 3,023 Judeans.'
  footnotes:
  - marker: a
    text: Or 'exiled' or 'deported' for 'carried away captive.'
    reason: lexical_alternative
  - marker: b
    text: '''Judeans'' emphasizes people from the kingdom/province of Judah; traditionally ''Jews.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 느부갓네살이 사로잡아 끌고 간 사람들입니다. 일곱째 해에[a][b], 유다 사람 3,023명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유배시킨’ 혹은 ‘추방한’으로, ‘사로잡아 끌고 간’을 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유다 사람’은 전통적 ‘유대인’보다 유다 왕국/지역 출신 사람들을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הָעָם
  english_pob_choice: These are the people
  chosen_korean: 이들은 ... 사람들입니다
  alternatives_korean:
  - 이들은 ... 백성입니다
  - 이 사람들은 ... 입니다
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 명단을 여는 요약문이므로, 한국어에서는 복수 지시 표현으로 자연스럽게 풀어 주었습니다.
- source_word: הֶגְלָה
  english_pob_choice: carried away captive
  chosen_korean: 사로잡아 끌고 간
  alternatives_korean:
  - 유배시킨
  - 포로로 끌고 간
  - 끌어내어 유배시킨
  lexicon: HALOT
  rationale: 단순한 ‘떠나게 하다’보다 강제 이주의 구체성을 살리기 위해, 포로로 잡아 옮긴 의미를 드러내는 표현을 택했습니다.
- source_word: בִּשְׁנַת שֶׁבַע
  english_pob_choice: in the seventh year
  chosen_korean: 일곱째 해에
  alternatives_korean:
  - 제칠년에
  - 7년째에
  lexicon: HALOT
  rationale: 연대 표시는 한국어에서 서수 표현 ‘일곱째 해’가 가장 자연스럽습니다.
- source_word: יְהוּדִים
  english_pob_choice: Judeans
  chosen_korean: 유다 사람
  alternatives_korean:
  - 유대인
  - 유다 주민
  - 유다 사람들
  lexicon: HALOT
  rationale: 이 문맥은 종교집단보다 유다 왕국/지역 출신 사람들을 가리키므로, ‘유다 사람’이 POB의 ‘Judeans’를 가장 직접적으로 반영합니다.
theological_decisions:
- issue: 유다 사람(Judeans)과 유대인(Jews) 구분
  chosen_reading: ‘유다 사람’으로 번역해 역사적·지리적 소속을 드러냈습니다.
  alternative_readings:
  - 유대인
  - 유다 사람들
  rationale: 포로기 역사 기록에서는 후대의 종교적 집단명보다 유다 출신 사람이라는 의미가 더 분명하므로, 오해를 줄이기 위해 구분해 옮겼습니다.
  doctrine_reference: 역사-문맥적 의미 보존
