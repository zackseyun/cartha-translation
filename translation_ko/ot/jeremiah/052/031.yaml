source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ן מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מַלְכֻת֗/וֹ אֶת רֹאשׁ֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּצֵ֥א אוֹת֖/וֹ מִ/בֵּ֥ית ה/כליא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/031.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-fifth day of the month, that Evil-merodach king of Babylon, in the first year of his reign[b], lifted up the head of Jehoiachin king of Judah and brought him out from the prison.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'showed favor to Jehoiachin king of Judah'; literally, 'lifted up the head of.'
    reason: lexical_alternative
  - marker: b
    text: Evil-merodach is also known historically as Amel-Marduk.
    reason: alternative_reading
translation:
  language: ko
  text: 유다 왕 여호야긴이 포로로 잡혀간 지 삼십칠 년째 되는 해, 열두째 달 스물다섯째 날에, 바벨론 왕 에윌므로닥[a]이 왕위에 오른 첫해에 유다 왕 여호야긴의 머리를 들어 올리고[b] 그를 감옥에서 데리고 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에윌므로닥은 역사적으로 아멜-마르둑(Amel-Marduk)으로도 알려져 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 관용구 ‘그의 머리를 들어 올리다’를 살린 표현으로, 여기서는 여호야긴에게 호의를 보이거나 그의 지위를 높였다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: …에
  alternatives_korean:
  - 그리고 …에
  - 그때
  lexicon: HALOT
  rationale: 서사 도입 공식으로서 האירו를 직접 옮기기보다 한국어 문맥에서 자연스럽게 사건 시점을 여는 표현을 택했습니다.
- source_word: לְגָלוּת
  english_pob_choice: of the exile
  chosen_korean: 포로 생활
  alternatives_korean:
  - 포로기
  - 유배
  lexicon: HALOT
  rationale: 단순 상태보다 기간적 의미가 강하므로, 왕의 ‘포로 생활’로 옮겨 원문의 시간 표지를 드러냈습니다.
- source_word: נָשָׂא אֶת־רֹאשׁ
  english_pob_choice: lifted up the head of
  chosen_korean: 머리를 들어 올리고
  alternatives_korean:
  - 머리를 높이고
  - 은혜를 베풀고
  lexicon: HALOT
  rationale: 직역에 가까운 표현을 유지해 히브리어 관용구의 투명성을 살리되, 이어지는 석방 행위로 그 의미가 읽히도록 했습니다.
- source_word: מִבֵּית הַכְּלִיא
  english_pob_choice: from the prison
  chosen_korean: 감옥에서
  alternatives_korean:
  - 갇힌 곳에서
  - 구금소에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘구금의 집’이지만 현대 한국어에서 가장 자연스럽고 명료한 대응어는 ‘감옥’입니다.
theological_decisions:
- issue: 에빌므로닥의 연대 표기
  chosen_reading: 자기 통치 첫해로 옮겨, 본문이 제시하는 왕위 즉위 연대와 행위의 시점을 함께 드러냈습니다.
  alternative_readings:
  - 즉위년으로
  - 왕이 된 해에
  rationale: 열왕기하 병행 본문과 합치되는 연대 공식이며, 한국어에서는 ‘첫해’가 가장 분명합니다.
  doctrine_reference: 본문 내 역사 서술의 정확성 유지
