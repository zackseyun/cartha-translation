  source_fidelity: 히브리어의 날짜 공식, 여호야긴의 포로 생활 37년, 에윌므로닥의 즉위 첫해, ‘머리를 들다’ 관용구, 그리고 감옥에서 나오게 한 행위가 모두 반영되어야 합니다. 초안의 ‘끌어냈습니다’는 원문의 사역형 ‘나오게 하다/데리고 나오다’보다 강제성을 다소 더합니다.
  naturalness: ‘유다 왕 여호야긴의 포로 생활 삼십칠 년’은 현대 한국어에서 다소 압축되어 어색합니다. ‘여호야긴이 포로로 잡혀간 지 삼십칠 년째 되는 해’가 날짜 공식의 뜻을 더 자연스럽고 분명하게 전달합니다. 각주 표지는 해당 이름과 관용구 바로 뒤에 두는 것이 독해와 주석 연결에 적절합니다.
  terminology: 통용 한국어 성경식 인명 표기인 ‘에윌므로닥’을 사용했습니다. ‘머리를 들어 올리다’는 원문의 관용구를 보존하되 각주에서 ‘호의를 보이다/지위를 높이다’라는 의미를 설명합니다. ‘감옥에서 데리고 나왔습니다’는 석방을 과도하게 단정하거나 강제로 끌어낸다는 뉘앙스를 더하지 않습니다.
