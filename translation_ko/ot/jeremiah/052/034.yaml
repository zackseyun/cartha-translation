  source_fidelity: 히브리어는 여호야긴의 몫이 바빌론 왕에게서 그에게 지속적으로 주어졌으며, 날마다 그날의 정해진 몫으로 그의 죽는 날까지 계속되었음을 말합니다. 초안은 핵심 의미를 대체로 담았으나, 수여 대상인 ‘그에게’가 명시되지 않았고 ‘날마다 정해져’는 일일 지급 ‘몫’의 의미가 다소 약합니다.
  naturalness: 초안의 어순은 ‘바빌론 왕에게서’와 기간·빈도 표현이 한데 겹쳐 다소 불안정합니다. 수여 사실, 출처, 일일 몫, 기간을 분명히 배열하면 현대 한국어 합쇼체로 더 자연스럽습니다.
