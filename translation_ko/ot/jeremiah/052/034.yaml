base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/034.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king of Babylon, a daily portion day by day, until the day of his death, all the days of his life.
  footnotes:
  - marker: a
    text: Or 'ration,' 'provision,' or 'portion' for 'allowance' (Heb. אֲרֻחָה). The term here refers to the king's assigned maintenance for Jehoiachin.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 양식[a], 곧 계속 지급되는 양식이 바빌론 왕에게서 그에게 날마다 그날의 정해진 몫으로, 그가 죽는 날까지, 곧 평생 동안 주어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲרֻחָה는 여기서 단순한 ‘식사’가 아니라, 여호야긴에게 왕이 배정한 양식 또는 생계 유지용 지급분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  english_pob_choice: allowance
  chosen_korean: 양식
  alternatives_korean:
  - 식량
  - 배급
  - 공급분
  lexicon: HALOT
  rationale: 여기서는 왕이 정해 준 생계 유지용 지급분이라는 행정적 의미가 강하므로, 자연스러운 현대 한국어로는 ‘양식’이 가장 무난하며 문맥상 ‘급여’보다 중립적입니다.
- source_word: תָּמִיד
  english_pob_choice: continual
  chosen_korean: 계속되는
  alternatives_korean:
  - 지속적인
  - 끊이지 않는
  lexicon: HALOT
  rationale: 반복적으로 이어지는 지급의 성격을 살리기 위해 ‘계속되는’으로 옮겼습니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: a daily portion day by day
  chosen_korean: 날마다 정해져
  alternatives_korean:
  - 매일 조금씩
  - 날마다 배정되어
  lexicon: HALOT
  rationale: 직역하면 ‘날의 일, 그 날에’라는 관용구이므로, 매일 정해진 분량이 지급된다는 뜻을 드러내면서도 반복성을 유지했습니다.
- source_word: מֵאֵת מֶלֶךְ בָּבֶל
  english_pob_choice: from the king of Babylon
  chosen_korean: 바빌론 왕에게서
  alternatives_korean:
  - 바빌론 왕으로부터
  - 바빌론 왕이
  lexicon: HALOT
  rationale: 출처를 나타내는 전치사 구조를 살려 ‘에게서’로 옮겼습니다.
