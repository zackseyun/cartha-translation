base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/001.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem[b]. His mother’s name was Hamutal the daughter of Jeremiah of Libnah.
  footnotes:
  - marker: a
    text: Or “when he began to reign.”
    reason: lexical_alternative
  - marker: b
    text: Or “from Libnah.”
    reason: lexical_alternative
translation:
  language: ko
  text: 시드기야는 왕이 되었을 때 스물한 살이었고[a], 예루살렘에서 열한 해 동안 다스렸습니다. 그의 어머니의 이름은 립나 출신 예레미야의 딸 하무탈이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다스리기 시작했을 때.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “립나에서.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  english_pob_choice: was twenty-one years old
  chosen_korean: 스물한 살이었고
  alternatives_korean:
  - 한 살짜리 아들이었고
  - 스물한 해의 아들이었고
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 현대 한국어의 자연스러운 연령 표현으로 옮겼습니다.
- source_word: בְ/מָלְכ֔וֹ
  english_pob_choice: when he became king
  chosen_korean: 왕이 되었을 때
  alternatives_korean:
  - 다스리기 시작했을 때
  - 왕이 되었을 때에
  lexicon: HALOT
  rationale: 접속된 הזמן절은 즉위 시점을 가리키므로, '왕이 되었을 때'로 자연스럽게 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: he reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕으로 있었습니다
  lexicon: HALOT
  rationale: 단순한 직함이 아니라 실제 통치를 뜻하므로, 왕권 행사의 의미를 살려 옮겼습니다.
- source_word: מִ/לִּבְנָה
  english_pob_choice: from Libnah
  chosen_korean: 립나 출신
  alternatives_korean:
  - 립나에서 온
  - 립나 사람
  lexicon: HALOT
  rationale: מן 구문은 출신 또는 관련지를 표시하므로, 계보적 문맥에 맞는 '출신'으로 처리했습니다.
theological_decisions:
- issue: 즉위 시점과 재위 기간의 병렬 표현
  chosen_reading: '''왕이 되었을 때''와 ''예루살렘에서 열한 해를 다스렸습니다''를 분리해 즉위와 재위 기간을 모두 분명히 했습니다.'
  alternative_readings:
  - '''왕이 된 지''로 묶어 번역'
  - '''왕 노릇을 했습니다''처럼 완화'
  rationale: 본문은 즉위 시점과 재위 기간을 각각 기록하는 왕조 연대기 형식이므로, 둘을 구분해 전달하는 것이 본문 의도를 가장 잘 보존합니다.
  doctrine_reference: 역사 서술의 문자적-연대기적 의미 보존
