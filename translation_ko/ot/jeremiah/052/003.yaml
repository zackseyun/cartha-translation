  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָֽיְתָה֙ בִּ/ירוּשָׁלִַ֣ם וִֽ/יהוּדָ֔ה עַד הִשְׁלִיכ֥/וֹ אוֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/003.yaml
  text: For because of the anger of Yahweh it came to pass in Jerusalem and Judah[a], until he cast them out from before his face[b]; and Zedekiah rebelled against the king of Babylon.
  footnotes:
  - marker: a
    text: Or 'because of the wrath of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before his face'; that is, from his presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘과 유다에 이런 일이 일어난 것은 야훼의 분노[a] 때문이었습니다. 그가 그들을 그의 앞에서[b] 내쫓으실 때까지 그리하셨습니다. 시드기야는 바빌론 왕에게 반역했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 진노’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 얼굴 앞에서’. 곧 그의 임재에서.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אַף יְהוָה
  english_pob_choice: because of the anger of Yahweh
  chosen_korean: 야훼의 분노 때문에
  alternatives_korean:
  - 야훼의 노여움 때문에
  - 야훼의 진노 때문에
  lexicon: HALOT
  rationale: עַל אַף는 원인을 나타내는 관용구이므로, 한국어에서는 자연스럽게 ‘때문에’로 풀되 ‘분노’로 야훼의 심판 사유를 분명히 드러냈습니다.
- source_word: הָיְתָה
  english_pob_choice: it came to pass
  chosen_korean: 일어난 일이니
  alternatives_korean:
  - 있었습니다
  - 그렇게 되었습니다
  lexicon: HALOT
  rationale: 주어가 생략된 היה를 한국어에서 매끄럽게 살리되, 단순한 서술이 아니라 앞선 원인을 받아 결과를 맺는 문맥을 반영했습니다.
- source_word: מֵעַל פָּנָיו
  english_pob_choice: from before his face
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 그의 얼굴 앞에서
  - 그의 임재에서
  lexicon: HALOT
  rationale: 직역형 ‘얼굴’은 한국어에서 부자연스러워, 원문의 관용적 공간 이미지를 유지하면서도 뜻이 드러나는 ‘자기 앞에서’를 택했습니다.
- source_word: וַיִּמְרֹד
  english_pob_choice: rebelled
  chosen_korean: 반역했습니다
  alternatives_korean:
  - 반란을 일으켰습니다
  - 거역했습니다
  lexicon: HALOT
  rationale: 왕권에 대한 정치적·언약적 배신을 보여 주므로, 단순한 ‘거역’보다 강한 ‘반역’이 원문의 무게를 더 잘 전달합니다.
theological_decisions:
- issue: 야훼의 분노와 예루살렘·유다의 멸망 사이의 인과관계
  chosen_reading: 본문의 직접 진술대로, 이 사건들은 야훼의 분노 때문에 일어났다고 옮겼습니다.
  alternative_readings:
  - 역사적 사건 묘사로 완화하기
  - ‘노여움’처럼 더 순화된 표현으로 바꾸기
  rationale: 원문은 עַל אַף יְהוָה와 ‘그 앞에서 쫓아내다’라는 심판 언어로 분명한 신학적 인과를 제시하므로, 이를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
