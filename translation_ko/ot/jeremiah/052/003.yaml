  to: 예루살렘과 유다에 이런 일이 일어난 것은 야훼의 분노[a] 때문이었습니다. 그가 그들을 그의 앞에서[b] 내쫓으실 때까지 그리하셨습니다. 시드기야는 바빌론 왕에게 반역했습니다.
  rationale: 초안의 어색한 ‘때까지였습니다’ 구조를 원문의 인과관계와 ‘내쫓음’의 귀결을 유지하는 자연스러운 합쇼체 문장으로 고쳤습니다. ‘마침내’는 삭제했고, 대명사는 ‘그의’로 명확히 했습니다. 각주는 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
