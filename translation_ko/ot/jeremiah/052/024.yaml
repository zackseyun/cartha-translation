id: JER.52.24
reference: Jeremiah 52:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖ה כֹּהֵ֣ן הַ/מִּשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/024.yaml
  text: And the captain of the guard took Seraiah the chief priest[a], and Zephaniah the second priest[c][b], and the three keepers of the threshold.
  footnotes:
  - marker: a
    text: Or 'the high priest.' The Hebrew title is literally 'the chief/head priest.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the deputy priest' for 'the second priest.'
    reason: lexical_alternative
  - marker: c
    text: Or 'doorkeepers' for 'keepers of the threshold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 호위대장은 수석 제사장 사레야[a]와 둘째 제사장 스바냐[b]와 문턱을 지키는 세 사람[c]을 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대제사장’. 히브리어는 문자적으로 ‘우두머리/머리 제사장’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부제사장’ 또는 ‘차석 제사장’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘문지기들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים / captain of the guard
  english_pob_choice: captain of the guard
  chosen_korean: 호위대장
  alternatives_korean:
  - 경호대장
  - 시위대장
  lexicon: HALOT
  rationale: 바벨론 왕실 문맥에서 처형 집행자라는 직역보다 왕실 경호·호위 책임자를 가리키는 관직으로 이해하는 것이 자연스러워, 한국어에서는 기능을 드러내는 ‘호위대장’으로 옮겼습니다.
- source_word: כֹּהֵן הָרֹאשׁ / the chief priest
  english_pob_choice: the chief priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수제사장
  - 우두머리 제사장
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 ‘머리/우두머리 제사장’을 뜻하지만, 한국어 성경 전통에서 이 직함은 대체로 ‘대제사장’으로 이해되므로, 관직 기능을 분명히 하는 표현을 택했습니다.
- source_word: כֹּהֵן הַמִּשְׁנֶה / the second priest
  english_pob_choice: the second priest
  chosen_korean: 부제사장
  alternatives_korean:
  - 제이제사장
  - 차석 제사장
  lexicon: HALOT
  rationale: ‘둘째/차석’의 서열을 뜻하는 משנה를 한국어 관직명으로 자연스럽게 풀어, 직무상 보조·차석 지위를 드러내는 ‘부제사장’으로 옮겼습니다.
- source_word: שֹׁמְרֵי הַסַּף / keepers of the threshold
  english_pob_choice: keepers of the threshold
  chosen_korean: 문지기
  alternatives_korean:
  - 문턱을 지키는 자들
  - 현관 경비자들
  lexicon: HALOT
  rationale: ‘문지기들’은 본문의 제도적·기능적 의미를 한국어로 간결하게 전달하며, ‘threshold’의 구체 이미지는 주석 없이도 이해 가능한 범위로 보았습니다.
theological_decisions:
- issue: 직함의 전통적 한국어 대응과 원문 투명성
  chosen_reading: ‘대제사장’, ‘부제사장’은 한국어 교회 전통의 익숙한 직함을 사용하되, 다른 요소들은 원문의 관직 구조가 보이도록 직역성을 유지했습니다.
  alternative_readings:
  - ‘수제사장’, ‘둘째 제사장’
  - ‘우두머리 제사장’, ‘차석 제사장’
  rationale: 이 절은 서술 정보 전달이 핵심이므로, 널리 통용되는 직함을 채택해 가독성을 높이면서도, 본문의 위계 구조를 훼손하지 않도록 했습니다.
  doctrine_reference: 성경 번역의 관직명 일관성 및 원문 투명성
