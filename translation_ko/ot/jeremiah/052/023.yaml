  text: There were ninety-six pomegranates toward the outside[a]; all the pomegranates on the lattice all around were one hundred.
  footnotes:
  - marker: a
    text: Or 'toward the outside,' 'in one direction,' or possibly 'windward.' The Hebrew term is difficult; the sense is that ninety-six were counted from one side, while the total around the lattice was one hundred.
    reason: lexical_alternative
