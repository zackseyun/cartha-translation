  text: 아흔여섯 개의 석류가 바깥쪽에 있었고[a], 난간 둘레의 모든 석류는 백 개였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רוּחָה는 여기서 방향을 가리키는 난해한 표현입니다. 영어 POB는 “toward the outside”로 옮겼으며, 문맥상 한쪽에서 센 숫자와 전체 합계를 구분하는 의미로 이해할 수 있습니다.
    reason: lexical_alternative
