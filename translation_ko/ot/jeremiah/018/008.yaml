reference: Jeremiah 18:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁב֙ הַ/גּ֣וֹי הַ/ה֔וּא מֵ/רָ֣עָת֔/וֹ אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלָ֑י/ו וְ/נִֽחַמְתִּי֙ עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר חָשַׁ֖בְתִּי לַ/עֲשׂ֥וֹת לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/008.yaml
  text: And if that nation turns from its evil[a], against which I spoke[c][b], then I will relent concerning the disaster that I planned to do to it.
  footnotes:
  - marker: a
    text: Or 'turns back' or 'repents.' The Hebrew verb is literally 'turns/returns.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses the same word family for the nation's 'evil' and the 'disaster' God planned, but the sense shifts from moral evil to calamity.
    reason: lexical_alternative
  - marker: c
    text: Or 'change my mind'; Hebrew 'relent' language expresses God's responsive withdrawal of announced judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 「그 나라가 그 악에서 돌이키고, 내가 그것에 대하여 말한 재앙에 대해 내가 뜻을 돌이키겠습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌이키다’는 히브리어의 문자적 뜻인 ‘돌아오다/되돌아가다’를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 같은 어근 계열을 사용해, 앞의 ‘악’과 뒤의 ‘재앙’을 의도적으로 연결합니다.
    reason: lexical_alternative
  - marker: c
    text: 여기의 נִחַם은 하나님이 선포한 심판을 거두는 뜻으로, ‘회개하다’가 아니라 ‘뜻을 돌이키다/유보하다’의 뉘앙스입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁב
  english_pob_choice: and if ... turns
  chosen_korean: 돌이키고
  alternatives_korean:
  - 돌아가고
  - 회개하고
  - 돌아서고
  lexicon: HALOT
  rationale: שׁוּב의 기본 뜻인 ‘돌아오다/돌이키다’를 살리면서, 조건문의 흐름은 앞 절 문맥에 따라 자연스럽게 이어지도록 했습니다.
- source_word: הַגּוֹי הַהוּא
  english_pob_choice: that nation
  chosen_korean: 그 나라가
  alternatives_korean:
  - 그 민족이
  - 그 나라
  lexicon: HALOT
  rationale: גּוֹי는 여기서 집단적 주어로 ‘나라’가 자연스럽고, 지시사 הַהוּא는 ‘그’로 옮겨 직접적 대응을 유지했습니다.
- source_word: מֵרָעָתוֹ
  english_pob_choice: from its evil
  chosen_korean: 그 악에서
  alternatives_korean:
  - 그 악행에서
  - 그 악에서
  - 그 죄악에서
  lexicon: HALOT
  rationale: 여기의 רָעָה는 도덕적 악을 가리키므로 ‘악’으로 옮기고, 뒤의 הָרָעָה와의 어휘적 긴장을 유지했습니다.
- source_word: וְנִחַמְתִּי
  english_pob_choice: then I will relent
  chosen_korean: 내가 뜻을 돌이키겠습니다
  alternatives_korean:
  - 내가 유보하겠습니다
  - 내가 유감히 여기겠습니다
  - 내가 뉘우치겠습니다
  lexicon: HALOT
  rationale: נחם은 하나님이 선포한 심판을 거두시는 뜻이므로, 전통적 ‘회개하다’보다 ‘뜻을 돌이키다’가 오해를 줄이면서도 본문의 긴장을 보존합니다.
- source_word: עַל הָרָעָה
  english_pob_choice: concerning the disaster
  chosen_korean: 재앙에 대해
  alternatives_korean:
  - 재난에 대해
  - 화에 대해
  - 악에 대해
  lexicon: HALOT
  rationale: 여기서는 רָעָה가 도덕적 악이 아니라 내리는 재앙/재난의 뜻이므로 ‘재앙’으로 옮겨 앞의 ‘악’과 구별했습니다.
theological_decisions:
- issue: 하나님의 נִחַם 표현
  chosen_reading: ‘뜻을 돌이키겠습니다’로 옮겨, 하나님이 선포한 심판을 관계적·응답적으로 거두시는 뜻을 살렸습니다.
  alternative_readings:
  - 뉘우치겠습니다
  - 마음을 바꾸겠습니다
  - 유감이겠습니다
  rationale: 이 본문은 인간의 돌이킴에 대한 하나님의 응답을 말하므로, 도덕적 후회로 오해될 수 있는 표현은 피하고 본문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
