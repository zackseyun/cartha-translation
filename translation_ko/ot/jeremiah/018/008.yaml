  source_fidelity: 초안은 וְשָׁב의 조건적 의미와 두 רָעָה의 의미 구별을 대체로 살렸으나, אֲשֶׁר דִּבַּרְתִּי עָלָיו(‘내가 그 나라를 거슬러 말한’)를 ‘그것에 대하여 말한 재앙’으로 옮겨 관계와 의미가 달라졌습니다. 또한 하나님이 계획하신 재앙을 그 나라에 행하려 했다는 לַעֲשׂוֹת לוֹ의 내용을 명시해야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체에서 자연스럽고, 조건절과 하나님의 응답을 명료하게 연결합니다. ‘그 나라를 거슬러 말한’은 심판의 선언이라는 문맥을 과도하게 해석하지 않으면서 원문의 대적 방향을 보존합니다.
