revisions:
- from: 「그 나라가 그 악에서 돌이키고, 내가 그것에 대하여 말한 재앙에 대해 내가 뜻을 돌이키겠습니다.」[a][b][c]
  to: 「내가 그 나라를 거슬러 말한 그 나라가 그 악[a]에서 돌이키면, 내가 그 나라에 내리려고 계획했던 재앙[b]에 대하여 뜻을 돌이키겠습니다[c].」
  rationale: 원문의 관계절은 ‘내가 그 나라를 거슬러 말한’으로 옮겨 심판 선언의 방향을 보존했습니다. 이어지는 ‘재앙’에는 하나님이 그 나라에 내리려고 계획하셨다는 내용을 포함하여 חָשַׁבְתִּי לַעֲשׂוֹת לוֹ를 반영했습니다. ‘악’과 ‘재앙’의 어근상 연결 및 נִחַמְתִּי의 신학적 긴장은 본문과 각주에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:31Z'
