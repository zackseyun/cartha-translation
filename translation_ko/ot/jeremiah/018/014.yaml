id: JER.18.14
reference: Jeremiah 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יַעֲזֹ֥ב מִ/צּ֛וּר שָׂדַ֖י שֶׁ֣לֶג לְבָנ֑וֹן אִם יִנָּתְשׁ֗וּ מַ֛יִם זָרִ֥ים קָרִ֖ים נוֹזְלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/014.yaml
  text: Does the snow of Lebanon leave the rock of the open country? Or are cold[b][a], flowing foreign waters ever uprooted?
  footnotes:
  - marker: a
    text: Or 'the field rock,' 'the crag of the countryside,' or similar; the Hebrew phrase is difficult and likely evokes the rocky heights/open country associated with Lebanon's snow.
    reason: lexical_alternative
  - marker: b
    text: Or 'strange waters.' The phrase may refer to waters from a distant source rather than morally 'foreign' waters.
    reason: lexical_alternative
translation:
  language: ko
  text: 레바논의 눈이 들판의 바위를 떠나겠습니까? 아니면 차갑고 흐르며, 외부에서 온 물들이 ever 뽑히겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들판의 바위’, ‘시골의 바위’ 같은 뜻일 수 있습니다. 히브리어 구절은 어렵고, 레바논의 눈과 연결된 바위 많은 고지 또는 들판의 이미지를 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘낯선 물들’입니다. 이 표현은 도덕적으로 ‘이방적인’ 물보다 먼 곳에서 온 물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יַעֲזֹב
  english_pob_choice: Does ... leave
  chosen_korean: 떠나겠습니까?
  alternatives_korean:
  - 버리겠습니까?
  - 저버리겠습니까?
  lexicon: HALOT
  rationale: 반문 형식의 עזב를 한국어에서는 자연스러운 의문으로 옮기되, 자연물에 대한 표현이므로 관계적 뉘앙스가 강한 ‘저버리다’보다 ‘떠나다’가 더 적절합니다.
- source_word: מִ/צּוּר שָׂדַי
  english_pob_choice: the rock of the open country
  chosen_korean: 들판의 바위
  alternatives_korean:
  - 들판의 바위산
  - 들의 바위
  - 시골의 바위
  lexicon: HALOT
  rationale: 어려운 구절이지만, 영어 POB의 신중한 해석을 따라 ‘צוּר’의 구체성(바위)을 살리고 ‘שָׂדַי’의 들/들판 의미를 자연스럽게 연결했습니다.
- source_word: זָרִים
  english_pob_choice: foreign
  chosen_korean: 외부에서 온
  alternatives_korean:
  - 이방의
  - 낯선
  - 외국의
  lexicon: HALOT
  rationale: 이 형용사는 단순히 ‘외국의’라기보다 ‘멀리서 온/낯선 출처의’ 물을 가리킬 수 있으므로, POB 각주가 제시한 의미 범위를 반영해 ‘외부에서 온’으로 옮겼습니다.
- source_word: יִנָּתְשׁוּ
  english_pob_choice: are ... ever uprooted
  chosen_korean: 뽑히겠습니까?
  alternatives_korean:
  - 뿌리째 뽑히겠습니까?
  - 뽑혀 사라지겠습니까?
  - 뽑혀나가겠습니까?
  lexicon: HALOT
  rationale: 물이 ‘uprooted’된다는 것은 원문의 강한 비유이므로, 이를 완화해 ‘마르다’로 바꾸지 않고 ‘뽑히다’의 낯선 이미지를 보존했습니다.
theological_decisions:
- issue: 시적 반문과 의인화의 보존
  chosen_reading: 자연물에 대한 상징적 반문을 그대로 살려, 신학적 해석을 덧씌우지 않고 예언자의 수사적 충격을 유지했습니다.
  alternative_readings:
  - 평범한 서술문으로 순화하는 읽기
  - 의미를 풀어 설명하는 의역
  rationale: 본문은 논리적 설명보다 수사적 불가능성을 강조하므로, 독자가 원문의 비유적 충돌을 느끼도록 하는 것이 더 충실합니다.
  doctrine_reference: 예언서 수사와 문학적 이미지 보존
- issue: ‘foreign waters’의 의미 범위
  chosen_reading: ‘외부에서 온 물들’로 번역해, 도덕적 ‘이방성’보다 출처의 거리감을 우선했습니다.
  alternative_readings:
  - 이방의 물들
  - 낯선 물들
  - 외국의 물들
  rationale: POB 각주가 제시하듯 זָרִים은 반드시 도덕적 오염을 뜻하지 않으므로, 본문이 허용하는 범위 안에서 출처 중심의 표현을 택했습니다.
  doctrine_reference: 어휘 의미의 다의성 보존
