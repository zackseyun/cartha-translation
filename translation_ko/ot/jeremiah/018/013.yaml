source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַֽׁאֲלוּ נָא֙ בַּ/גּוֹיִ֔ם מִ֥י שָׁמַ֖ע כָּ/אֵ֑לֶּה שַֽׁעֲרֻרִת֙ עָשְׂתָ֣ה מְאֹ֔ד בְּתוּלַ֖ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/013.yaml
  text: 'Therefore thus says Yahweh: Ask now among the nations[b][a], who has heard such things? Virgin Israel has done a very horrible thing.'
  footnotes:
  - marker: a
    text: Or, 'who has heard such things?'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Virgin Israel has done an appalling thing' or 'a shocking thing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. 「이제 민족들 가운데에서 물어보아라. 이런 일을 들어본 자가 누구냐? 처녀 이스라엘이 매우 끔찍한 일을 저질렀다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이런 일을 들어본 자가 누구냐?’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘처녀 이스라엘이 매우 끔찍한 일을 저질렀다’ / ‘충격적인 일을 저질렀다’.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞 절들의 고발과 심판 맥락을 받아 결론을 이끄는 인과·추론 연결어이므로, 현대 문어체에서 가장 자연스러운 ‘그러므로’로 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 야훼께서 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식의 문체를 살리면서도 한국어 합쇼체로 자연스럽게 처리했습니다. יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: שַׁאֲלוּ נָא בַּגּוֹיִם
  english_pob_choice: Ask now among the nations
  chosen_korean: 이제 민족들 가운데에서 물어보아라
  alternatives_korean:
  - 이제 나라들 가운데에서 물어보아라
  - 부디 민족들 가운데에서 물어보아라
  lexicon: HALOT
  rationale: שַׁאֲלוּ는 복수 명령형이므로 복수 청유/명령의 직접성을 살렸고, נָא는 긴박한 요청의 뉘앙스로 보아 ‘이제’로 자연스럽게 반영했습니다.
- source_word: מִי שָׁמַע כָּאֵלֶּה
  english_pob_choice: who has heard such things?
  chosen_korean: 이런 일을 들어본 자가 누구냐?
  alternatives_korean:
  - 누가 이런 일을 들어본 적이 있느냐?
  - 누가 이런 것들을 들은 적이 있느냐?
  lexicon: HALOT
  rationale: כָּאֵלֶּה의 비교·총칭 뉘앙스를 한국어 질문에서 자연스럽게 풀어 ‘이런 일들/이런 일’을 옮겼습니다. 수사적 질문의 충격을 살리기 위해 직설적으로 처리했습니다.
- source_word: שַׁעֲרֻרִת עָשְׂתָה מְאֹד
  english_pob_choice: has done a very horrible thing
  chosen_korean: 매우 끔찍한 일을 저질렀다
  alternatives_korean:
  - 매우 끔찍한 일을 행했다
  - 참으로 끔찍한 일을 저질렀다
  lexicon: HALOT
  rationale: שַׁעֲרֻרִת은 단순한 ‘나쁜 일’보다 경악스러운, 혐오스러운 행위를 가리키므로 ‘끔찍한 일’로 옮겼습니다. עָשְׂתָה는 한국어에서 도덕적 비난을 강하게 담는 ‘저질렀다’가 문맥에 더 맞습니다.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  english_pob_choice: Virgin Israel
  chosen_korean: 처녀 이스라엘
  alternatives_korean:
  - 동정녀 이스라엘
  - 처녀 같은 이스라엘
  lexicon: HALOT
  rationale: 예언적 인격화 표현을 직역에 가깝게 살리되, 한국어에서 자연스러운 호칭형으로 ‘처녀 이스라엘’을 택했습니다. 이는 이스라엘의 순결/보호받던 상태를 배경으로 한 수사적 표지입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 기록된 언약명 자체를 보존하는 것이 본 절의 예언자적 선언을 더 직접적으로 드러낸다고 보아, 본문에는 ‘야훼’를 유지했습니다.
  doctrine_reference: PROJECT DEFAULT — יְהוָה / YHWH → 야훼
- issue: 인용문 내부 명령형의 문체
  chosen_reading: 합쇼체 바깥 화자 서술 + 인용 내부의 직접 명령형
  alternative_readings:
  - 전체를 평서문으로 완화
  - 인용 내부를 간접화
  rationale: 예언자적 선포의 긴박성과 청중을 향한 직접성을 보존하기 위해, 바깥 서술은 합쇼체로 두고 인용 안에서는 명령형을 유지했습니다.
  doctrine_reference: Korean register policy for prophetic speech
