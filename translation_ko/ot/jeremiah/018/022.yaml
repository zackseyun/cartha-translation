  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּשָּׁמַ֤ע זְעָקָה֙ מִ/בָּ֣תֵּי/הֶ֔ם כִּֽי תָבִ֧יא עֲלֵי/הֶ֛ם גְּד֖וּד פִּתְאֹ֑ם כִּֽי כָר֤וּ שיחה לְ/לָכְדֵ֔/נִי וּ/פַחִ֖ים טָמְנ֥וּ לְ/רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/022.yaml
  text: Let a cry be heard from their houses when you suddenly bring a raiding band upon them[b][a], for they have dug a pit to capture me and hidden traps for my feet.
  footnotes:
  - marker: a
    text: Or 'a troop' or 'a band of raiders' for 'a raiding band.'
    reason: lexical_alternative
  - marker: b
    text: Or 'snares for my feet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 집에서 부르짖는 소리가 들리게 하십시오. 주께서 갑자기 그들 위에 습격대를 데려오실 때, 그들은 제게 함정을 파고 제 발을 위해 덫을 숨겼기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘습격자들의 무리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘발을 위한 올무’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשָּׁמַע זְעָקָה
  english_pob_choice: Let a cry be heard
  chosen_korean: 부르짖는 소리가 들리게 하십시오
  alternatives_korean:
  - 비명 소리가 들리게 하십시오
  - 외침이 들리게 하십시오
  lexicon: HALOT
  rationale: נפעל형의 수동적 의미와 문맥의 간구적 어조를 살려, 단순 미래보다 청유형인 ‘들리게 하십시오’로 옮겼습니다.
- source_word: מִבָּתֵּיהֶם
  english_pob_choice: from their houses
  chosen_korean: 그들의 집에서
  alternatives_korean:
  - 그들의 집들에서
  - 그들 집에서
  lexicon: HALOT
  rationale: 소리가 흘러나오는 구체적 출처를 살리되, 현대 한국어에서 자연스러운 ‘집에서’로 다듬었습니다.
- source_word: גְּדוּד
  english_pob_choice: a raiding band
  chosen_korean: 습격대
  alternatives_korean:
  - 침략대
  - 약탈대
  - 무리
  lexicon: HALOT
  rationale: 군사적이면서도 약탈·습격의 뉘앙스를 함께 지닌 말로, 일반적인 ‘부대’보다 원문의 공격성을 더 잘 드러냅니다.
- source_word: כָרוּ שִׁיחָה
  english_pob_choice: they have dug a pit
  chosen_korean: 그들은 제게 함정을 파고
  alternatives_korean:
  - 그들은 구덩이를 파고
  - 그들은 웅덩이를 파고
  lexicon: HALOT
  rationale: שִׁיחָה의 기본 뜻은 ‘구덩이’이지만, 목적이 포획인 문맥이므로 한국어에서는 기능을 드러내는 ‘함정’이 더 직접적입니다.
- source_word: וּפַחִים טָמְנוּ
  english_pob_choice: hidden traps
  chosen_korean: 덫을 숨겼기 때문입니다
  alternatives_korean:
  - 덫을 감추었기 때문입니다
  - 올무를 숨겼기 때문입니다
  lexicon: HALOT
  rationale: פחים는 포획용 덫·올무를 가리키므로, 동사 טָמְנוּ와 함께 ‘덫을 숨겼다’로 묶어 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 원문의 탄원·저주적 청원 어조
  chosen_reading: 예레미야의 말을 예언적 진술로 완화하지 않고, 하나님께 직접 판단을 구하는 청원으로 유지했습니다.
  alternative_readings:
  - 사건을 단순 미래 서술로 처리하기
  rationale: 히브리어의 청원적 용법과 본문 전체의 항의 기도를 보존해야 원문의 수사적·신학적 긴장이 살아납니다.
  doctrine_reference: Translation philosophy §1, §3
