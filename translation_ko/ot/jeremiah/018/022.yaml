revisions:
- from: 그들의 집에서 부르짖는 소리가 들리게 하십시오. 주께서 갑자기 그들 위에 습격대를 데려오실 때, 그들은 제게 함정을 파고 제 발을 위해 덫을 숨겼기 때문입니다.[a][b]
  to: 주께서 갑자기 그들을 치려고 습격대[a]를 보내실 때, 그들의 집에서 부르짖는 소리가 들리게 하십시오. 그들이 저를 잡으려고 구덩이를 파고 제 발을 노리고 덫[b]을 숨겼기 때문입니다.
  rationale: 'The revision preserves the Hebrew jussive petition and its two כִּי clauses: a temporal ‘when’ clause for the sudden arrival of the raiding band, followed by a causal clause explaining the enemies’ plotting. It restores the concrete ‘pit,’ makes both hostile purposes explicit, and relocates footnote anchors to their proper lexical referents.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the imprecatory petition, the sudden bringing of a raiding force, and the hostile trap imagery. However, its Korean clause structure makes the final causal clause syntactically and logically awkward, and ‘함정’ for שִׁיחָה loses the concrete ‘pit’ image. The purpose clauses should explicitly express ‘to capture me’ and traps directed at the speaker’s feet.
  naturalness: '‘주께서 … 때, 그들은 … 때문입니다’ is not natural Korean: the subject and causal relation are misjoined. Reordering the temporal clause and following it with a separate causal sentence produces clear, modern formal-polite Korean. ‘제 발을 노리고’ is idiomatic while conveying that the traps were laid for the speaker’s feet.'
  terminology: ‘습격대’ is a suitable rendering of גְּדוּד. ‘구덩이’ should be used for שִׁיחָה, with the following purpose phrase supplying the trapping sense. ‘덫’ suitably renders פחים. Footnote anchors must be placed after their respective translated terms, rather than both at the end of the verse.
  issues:
  - severity: medium
    issue: The causal clause is syntactically ill-formed in Korean.
    rationale: In ‘주께서 … 때, 그들은 … 때문입니다,’ the main clause beginning ‘그들은’ cannot naturally function as the reason for the petition. The Hebrew second כִּי supplies a reason for the petition and should be rendered as an independent causal sentence.
  - severity: medium
    issue: ‘함정’ replaces the concrete pit image of שִׁיחָה.
    rationale: Although a pit is part of a trapping metaphor, ‘구덩이’ directly preserves the source noun; ‘저를 잡으려고’ then conveys the infinitive of purpose לְלָכְדֵנִי.
  - severity: low
    issue: Footnote anchors are not attached to the relevant words.
    rationale: The lexical alternatives concern ‘습격대’ and ‘덫/올무’ respectively, so each marker should immediately follow that term.
  revised_text: 주께서 갑자기 그들을 치려고 습격대[a]를 보내실 때, 그들의 집에서 부르짖는 소리가 들리게 하십시오. 그들이 저를 잡으려고 구덩이를 파고 제 발을 노리고 덫[b]을 숨겼기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘습격자들의 무리’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 발을 위한 올무’로 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Hebrew jussive petition and its two כִּי clauses: a temporal ‘when’ clause for the sudden arrival of the raiding band, followed by a causal clause explaining the enemies’ plotting. It restores the concrete ‘pit,’ makes both hostile purposes explicit, and relocates footnote anchors to their proper lexical referents.'
