id: JER.18.15
reference: Jeremiah 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי שְׁכֵחֻ֥/נִי עַמִּ֖/י לַ/שָּׁ֣וְא יְקַטֵּ֑רוּ וַ/יַּכְשִׁל֤וּ/ם בְּ/דַרְכֵי/הֶם֙ שְׁבִילֵ֣י עוֹלָ֔ם לָ/לֶ֣כֶת נְתִיב֔וֹת דֶּ֖רֶךְ לֹ֥א סְלוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/015.yaml
  text: For my people have forgotten me[a]; they burn incense to emptiness. They have stumbled in their ways, in the ancient paths, to walk on side roads[d][c][b], on a road not built up.
  footnotes:
  - marker: a
    text: Or 'to vanity,' 'to what is false,' or 'to idols.' The Hebrew says 'to emptiness/falsehood,' a term often used for worthless worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'they caused them to stumble in their ways, the ancient paths.' The Hebrew allows an active rendering, but the agent is not explicit in a way that is clear in English.
    reason: alternative_reading
  - marker: c
    text: '''Ancient paths'' echoes Jeremiah''s recurring imagery of the long-established way God had set before his people; compare Jeremiah 6:16.'
    reason: cross_reference
  - marker: d
    text: Or 'bypaths' or 'tracks' for 'side roads.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내 백성이 나를 잊고[b] 헛된 것에 향을 피우기 때문입니다. 그들이 그들의 길, 곧 옛길에서 그들을 걸려 넘어지게 하여, 닦아 놓지 않은 길인 샛길들로 걷게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘허무한 것에’, ‘거짓된 것에’, ‘우상에게’. 히브리어는 ‘헛됨/허무/거짓’을 뜻하는 말을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכֵחֻנִי
  english_pob_choice: have forgotten me
  chosen_korean: 나를 잊고
  alternatives_korean:
  - 나를 잊었습니다
  - 나를 잊어버리고
  lexicon: HALOT
  rationale: 단순한 과거 사실보다 언약적 관계를 저버린 상태를 간결하게 드러내기 위해 ‘나를 잊고’로 옮겼습니다.
- source_word: לַשָּׁוְא
  english_pob_choice: to emptiness
  chosen_korean: 헛된 것에
  alternatives_korean:
  - 헛됨에
  - 공허한 데에
  - 허무한 것에
  lexicon: HALOT
  rationale: לַשָּׁוְא의 ‘헛됨/허무/거짓’ 범위를 살리되, 우상이라는 해석을 본문에 앞서 단정하지 않기 위해 ‘헛된 것’으로 처리했습니다.
- source_word: יְקַטֵּרוּ
  english_pob_choice: they burn incense
  chosen_korean: 향을 피우며
  alternatives_korean:
  - 향을 태우며
  - 분향하며
  lexicon: HALOT
  rationale: 제의적 분향 행위를 현대 한국어로 자연스럽게 나타내기 위해 ‘향을 피우다’를 택했습니다.
- source_word: שְׁבִילֵי עוֹלָם
  english_pob_choice: the ancient paths
  chosen_korean: 옛 길
  alternatives_korean:
  - 오랜 길
  - 예로부터의 길
  - 옛적 길
  lexicon: HALOT
  rationale: 예레미야의 반복되는 ‘오래된/옛’ 길의 이미지를 살리면서 한국어에서 자연스러운 압축 표현으로 ‘옛 길’로 옮겼습니다.
- source_word: נְתִיבוֹת דֶּרֶךְ לֹא סְלוּלָה
  english_pob_choice: side roads ... a road not built up
  chosen_korean: 넓히지 않은 길에서, 오솔길로 가려 한 것입니다
  alternatives_korean:
  - 다져 놓지 않은 길로 가려 한 것입니다
  - 포장되지 않은 길로 가려 한 것입니다
  - 길이 닦이지 않은 오솔길로 가려 한 것입니다
  lexicon: HALOT
  rationale: סְלוּלָה의 ‘쌓아 올려 다진 길’ 이미지를 ‘넓히지 않은 길’로, נְתִיבוֹת은 주변적·갈라진 길의 뉘앙스를 살려 ‘오솔길’로 옮겼습니다.
theological_decisions:
- issue: לַשָּׁוְא의 직접 대상
  chosen_reading: ‘헛된 것’으로 두어 우상 자체를 명시하지 않았습니다.
  alternative_readings:
  - ‘우상에게’
  - ‘헛되이’
  - ‘거짓된 것에’
  rationale: 본문의 शब्द 자체는 ‘공허/허무/거짓’의 범주를 가리키므로, 우상 숭배의 함의는 살리되 본문에 없는 명사를 삽입하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: וַיַּכְשִׁלוּם의 처리
  chosen_reading: 한국어에서는 ‘걸려 넘어졌습니다’로 결과를 진술했습니다.
  alternative_readings:
  - ‘그들이 넘어뜨렸습니다’
  - ‘그들이 넘어지게 했습니다’
  rationale: 히브리어 동사는 원인적 뉘앙스를 지니지만, 영어 POB의 최종 정리처럼 여기서는 명시적 행위자를 과잉 보강하지 않고 결과 상태를 자연스럽게 드러냈습니다.
  doctrine_reference: Translation philosophy §3
