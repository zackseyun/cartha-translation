review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. וַיַּכְשִׁלוּם은 히브리어 피엘 형태로 ‘그들이 그들을 걸려 넘어지게 하였다’라는 사역적 의미와 3인칭 남성 복수 목적어를 지닙니다. 초안의 ‘걸려 넘어졌습니다’는 이 사역성과 목적어를 소실합니다. 또한 ‘샛길들/오솔길’이 ‘닦아 놓지 않은 길’을 수식·동격으로 받도록 어순을 바로잡아야 합니다.
  naturalness: 초안의 ‘넓히지 않은 길에서, 오솔길로’는 סלל의 ‘길을 돋우어 닦다/만들다’라는 뜻을 ‘넓히다’로 바꾸며, 장소와 방향의 연결도 부자연스럽습니다. 수정문은 히브리어의 압축적이고 다소 모호한 대명사 지시를 보존하면서 현대 표준 한국어 합쇼체로 읽히도록 정리했습니다.
  terminology: ‘헛된 것에 향을 피우다’는 לַשָּׁוְא와 יְקַטֵּרוּ를 적절히 반영합니다. שְׁבִילֵי עוֹלָם은 ‘옛길’로, נְתִיבוֹת는 문맥상 ‘샛길들’로 옮겼습니다. סְלוּלָה는 단순히 폭이 넓은 길이 아니라 돋우어 닦아 마련한 길이므로 ‘닦아 놓지 않은 길’로 수정했습니다.
  issues:
  - severity: high
    issue: וַיַּכְשִׁלוּם의 사역형과 목적어가 번역에서 빠졌습니다.
    rationale: ‘걸려 넘어졌습니다’는 자동적 사건으로 만들지만, 본문은 명시되지 않은 복수 주체가 복수 목적어를 넘어지게 했다고 말합니다. 주체의 선행사는 불분명하므로 해석적으로 특정하지 않되, ‘그들이 그들을 … 넘어지게 하여’로 문법적 관계를 보존해야 합니다.
  - severity: medium
    issue: ‘넓히지 않은 길’은 סְלוּלָה의 어휘 의미를 정확히 반영하지 못합니다.
    rationale: סלל은 길을 쌓아 올리거나 닦아 마련하는 것을 가리킵니다. ‘닦아 놓지 않은 길’이 물리적 길 이미지와 대조를 더 충실히 살립니다.
  - severity: medium
