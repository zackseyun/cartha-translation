  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/כַ/יּוֹצֵ֨ר הַ/זֶּ֜ה לֹא אוּכַ֨ל לַ/עֲשׂ֥וֹת לָ/כֶ֛ם בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הִנֵּ֤ה כַ/חֹ֨מֶר֙ בְּ/יַ֣ד הַ/יּוֹצֵ֔ר כֵּן אַתֶּ֥ם בְּ/יָדִ֖/י בֵּ֥ית יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/006.yaml
  text: Can I not do with you[a], house of Israel, as this potter does? declares Yahweh. Look, like clay in the hand of the potter, so are you in my hand, house of Israel.
  footnotes:
  - marker: a
    text: Or 'like this potter' / 'as this potter does.' The Hebrew comparison is concise and can be rendered slightly differently in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 집 이스라엘에게 이 토기장이가 하는 것처럼 할 수 없겠느냐? 야훼의 말씀이니라. 보라, 진흙이 토기장이의 손에 있듯이 너희도 이스라엘 집아, 내 손에 있느니라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 토기장이가 하는 것처럼’은 히브리어의 간결한 비교를 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/כַ/יּוֹצֵ֨ר הַ/זֶּ֜ה
  english_pob_choice: as this potter does
  chosen_korean: 이 토기장이가 하는 것처럼
  alternatives_korean:
  - 이 토기장이처럼
  - 이 토기장이가 하는 대로
  lexicon: HALOT
  rationale: 히브리어의 비교 표지 הֲ + כ는 단순한 명사 비교가 아니라 뒤의 ‘עשה’와 함께 ‘행하는 방식’을 묻는 구조이므로, 한국어에서는 ‘하는 것처럼’이 자연스럽고 원문의 동작성을 살립니다.
- source_word: לַ/עֲשׂ֥וֹת לָ/כֶ֛ם
  english_pob_choice: do with you
  chosen_korean: 할 수 없겠느냐
  alternatives_korean:
  - 너희에게 행할 수 없겠느냐
  - 너희를 다룰 수 없겠느냐
  lexicon: HALOT
  rationale: עָשָׂה + ל는 단순히 ‘대하다/행하다’의 넓은 의미를 가지므로, 한국어는 ‘너희에게’보다 더 직설적으로 신적 주권의 물음을 살린 ‘할 수 없겠느냐’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 선언하신다
  - 야훼의 선언이니라
  lexicon: HALOT
  rationale: 예언자적 진술 공식 נְאֻם은 한국어에서 ‘말씀이니라’가 가장 간결하게 대응하며, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: כַ/חֹ֨מֶר֙
  english_pob_choice: like clay
  chosen_korean: 진흙이
  alternatives_korean:
  - 점토가
  - 흙이
  lexicon: HALOT
  rationale: חֹמֶר는 도공-그릇 문맥에서 물질적 재료를 가리키므로, 현대 한국어에서는 독자가 즉시 이미지로 받아들이는 ‘진흙’이 가장 자연스럽습니다.
- source_word: בְּ/יַ֣ד הַ/יּוֹצֵ֔ר
  english_pob_choice: in the hand of the potter
  chosen_korean: 토기장이의 손에
  alternatives_korean:
  - 토기장이의 손 안에
  - 도공의 손에
  lexicon: HALOT
  rationale: ‘손에’는 히브리어의 지배·통제 이미지를 그대로 살리며, ‘토기장이’는 본문의 비유를 유지하는 표준적 대응입니다.
- source_word: כֵּן אַתֶּ֥ם בְּ/יָדִ֖/י
  english_pob_choice: so are you in my hand
  chosen_korean: 너희도 … 내 손에 있느니라
  alternatives_korean:
  - 너희가 내 손 안에 있느니라
  - 너희도 내 손에 있느니라
  lexicon: HALOT
  rationale: כֵּן은 앞의 비유와의 대응을 표시하므로 ‘너희도’로 연결했고, ‘내 손에 있느니라’는 소유·통제의 관계를 압축적으로 드러냅니다.
theological_decisions:
- issue: יוֹצֵר-חֹמֶר 비유의 신적 주권과 재형성 가능성
  chosen_reading: 도공-진흙 비유를 그대로 보존해, 야훼의 주권적 권리와 이스라엘의 종속성을 동시에 드러냈습니다.
  alternative_readings:
  - 도덕적 교훈으로만 약화시키는 해석
  - 예정론으로 과도하게 체계화하는 해석
  rationale: 본문은 야훼의 자유로운 처분 권한을 말하지만, 그 범위를 교리적으로 더 좁히거나 넓히지 않도록 비유 자체를 직설적으로 살렸습니다.
  doctrine_reference: 본문의 비유적 긴장을 그대로 보존한다.
