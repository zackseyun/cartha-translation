  rationale: 원문의 호격 ‘이스라엘 집’을 양쪽 절에 유지하고, עשה+ל의 의미를 ‘너희에게 행하다’로 보존했습니다. ‘보십시오’는 הִנֵּה의 주의 환기 기능을, ‘토기장이의 손에 있는 진흙처럼’은 כַחֹמֶר בְּיַד הַיּוֹצֵר의 비유를 재현합니다. 전체 종결을 현대 합쇼체로 통일했습니다.
