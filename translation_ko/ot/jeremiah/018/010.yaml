id: JER.18.10
reference: Jeremiah 18:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה ה/רעה בְּ/עֵינַ֔/י לְ/בִלְתִּ֖י שְׁמֹ֣עַ בְּ/קוֹלִ֑/י וְ/נִֽחַמְתִּי֙ עַל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר אָמַ֖רְתִּי לְ/הֵיטִ֥יב אוֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/010.yaml
  text: but if it does what is evil in my sight[a], not listening to my voice[b], then I will relent concerning the good that I said I would do to it.
  footnotes:
  - marker: a
    text: Or 'change my mind.' The Hebrew verb can express relenting from a stated course of action.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to do good to it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그 나라가 내 눈에 악을 행하고 내 말을 듣지 않으면, 내가 그 나라에게 선을 베풀겠다고 말한 그 선한 일에 대하여 뜻을 돌이키겠습니다.[a] [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음을 바꾸겠습니다’. 히브리어 동사는 선포된 행동 방침을 거두거나 유보하는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 나라에게 선을 행하기로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  english_pob_choice: but if it does
  chosen_korean: 그런데 그가
  alternatives_korean:
  - 그리고 그가
  - 만일 그가
  lexicon: HALOT
  rationale: 문맥상 앞선 조건문이 이어지므로 한국어에서는 ‘그런데’로 조건의 전환을 자연스럽게 살렸고, 3인칭 단수는 집합적 대상을 가리키는 문맥에 따라 ‘그가’로 옮겼습니다.
- source_word: הָרָעָה בְּעֵינַי
  english_pob_choice: what is evil in my sight
  chosen_korean: 내 눈에 악한 일을
  alternatives_korean:
  - 내 눈에 악한 것을
  - 내가 악하다고 보는 것을
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서는 ‘내 눈에’와 ‘악한 일’을 결합해 도덕적 평가를 분명히 했습니다.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלִי
  english_pob_choice: not listening to my voice
  chosen_korean: 내 목소리를 듣지 않으면
  alternatives_korean:
  - 내 목소리에 귀 기울이지 않으면
  - 내 목소리를 순종하지 않으면
  lexicon: HALOT
  rationale: ‘듣다’는 כאן의 ‘순종하다/귀담아듣다’의 기본 감각을 유지하면서도, POB의 직설적인 ‘not listening’과 맞물리도록 가장 간결하게 옮겼습니다.
- source_word: וְנִחַמְתִּי עַל הַטּוֹבָה
  english_pob_choice: then I will relent concerning the good
  chosen_korean: 내가 그에게 하기로 말한 그 선에 대하여 뜻을 돌이키겠습니다
  alternatives_korean:
  - 내가 그에게 하기로 한 선을 거두겠습니다
  - 내가 약속한 선에 대해 뜻을 바꾸겠습니다
  lexicon: HALOT
  rationale: נחם은 단순한 ‘마음 바꿈’보다 이미 선포한 행동을 철회/유보하는 뉘앙스가 있어, 하나님의 발화에 합당한 ‘뜻을 돌이키다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 נחם(뜻을 돌이키심) 표현
  chosen_reading: ‘뜻을 돌이키겠습니다’로 번역해 선포된 선이 조건에 따라 유보될 수 있다는 긴장을 보존했습니다.
  alternative_readings:
  - ‘마음을 바꾸겠습니다’
  - ‘후회하겠습니다’
  rationale: 이 구절은 하나님의 도덕적 변화를 말하는 것이 아니라, 선포된 행위의 방향 전환을 말하므로, 한국어에서도 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
