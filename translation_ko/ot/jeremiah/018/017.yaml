    issue: ‘그 재앙의 날’에 소유 관계가 불분명함
    rationale: 히브리어 אֵידָם의 3인칭 복수 접미사는 ‘그들의 재앙’을 뜻합니다. 한국어 본문에서도 이를 밝혀 주는 것이 안전합니다.
  - severity: medium
    issue: 각주의 대안 번역과 해설이 부정확하거나 부자연스러움
    rationale: ‘얼굴은 돌리지 않겠습니다’는 ‘얼굴을 보이지 않겠다’와 다르며, ‘돌보시는 존재를 철회’는 자연스러운 한국어도 아니고 본문의 관용적 의미를 명료하게 설명하지 못합니다.
  - severity: low
    issue: 시간구를 별도 문장과 ‘그렇게’로 처리함
    rationale: 원문의 시간 한정은 ‘등을 보이고 얼굴은 보이지 않겠다’는 선언을 수식합니다. 이를 해당 절에 직접 연결하면 더 충실하고 자연스럽습니다.
