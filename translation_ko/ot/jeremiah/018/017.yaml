  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/רֽוּחַ קָדִ֥ים אֲפִיצֵ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב עֹ֧רֶף וְ/לֹֽא פָנִ֛ים אֶרְאֵ֖/ם בְּ/י֥וֹם אֵידָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/017.yaml
  text: Like an east wind I will scatter them before the enemy[a]; I will show them the back and not the face in the day of their disaster.
  footnotes:
  - marker: a
    text: Or, 'I will turn my back to them and not my face.' The Hebrew idiom pictures the LORD withdrawing favor rather than giving attentive presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 동풍처럼 내가 그들을 적 앞에 흩어 버리겠습니다. 그들의 재앙의 날에 내가 그들에게 등을 보이고 얼굴은 보이지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 그들에게 등을 돌리고 얼굴을 보이지 않겠다.’ 히브리어 관용구는 주님께서 호의로운 얼굴을 보이지 않고 등을 보이심으로 그들에게서 돌아서심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּחַ קָדִים
  english_pob_choice: Like an east wind
  chosen_korean: 동풍처럼
  alternatives_korean:
  - 동쪽 바람처럼
  - 강한 동풍처럼
  lexicon: HALOT
  rationale: כְּ는 비교 표지이므로 '-처럼'으로 살렸고, קָדִים의 관용적 의미인 동풍을 자연스러운 한국어로 옮겼습니다.
- source_word: אֲפִיצֵם
  english_pob_choice: I will scatter them
  chosen_korean: 내가 그들을 흩어 버리겠습니다
  alternatives_korean:
  - 내가 그들을 흩겠습니다
  - 내가 그들을 분산시키겠습니다
  lexicon: HALOT
  rationale: 히필형 פוץ의 인과적 의미를 살려 '흩어 버리다'로 옮겨 심판의 강한 동작을 드러냈습니다.
- source_word: לִפְנֵי אוֹיֵב
  english_pob_choice: before the enemy
  chosen_korean: 적 앞에
  alternatives_korean:
  - 원수 앞에
  - 적의 앞에
  lexicon: HALOT
  rationale: 전치사적 구문을 간결하게 살려 '앞에'로 옮겼고, 문맥상 공격하는 대적을 '적'으로 자연스럽게 표현했습니다.
- source_word: עֹרֶף וְלֹא פָנִים / אֶרְאֵם
  english_pob_choice: I will show them my back and not my face
  chosen_korean: 내가 그들에게 등을 보이고 얼굴은 보이지 않겠습니다
  alternatives_korean:
  - 내가 그들에게 등을 돌리고 얼굴은 돌리지 않겠습니다
  - 내가 그들에게 등을 보이되 얼굴은 보이지 않겠습니다
  lexicon: HALOT
  rationale: 히브리어의 신체적 대비를 그대로 살려, 거절과 은총의 철회를 나타내는 구체적 이미지를 한국어 관용에 맞게 유지했습니다.
- source_word: בְּיוֹם אֵידָם
  english_pob_choice: in the day of their disaster
  chosen_korean: 그 재앙의 날에
  alternatives_korean:
  - 그들의 재난의 날에
  - 재앙이 닥치는 날에
  lexicon: HALOT
  rationale: אֵיד의 의미를 '재앙'으로 옮겨 예언적 심판 어휘를 유지했고, זמן 구문은 한국어 관용에 따라 종결 위치로 자연화했습니다.
theological_decisions:
- issue: 하나님의 얼굴/등 이미지의 해석
  chosen_reading: 직역된 신체 비유를 유지하여, 하나님이 그들에게 호의를 거두고 돌보시는 উপস্থিত를 거두시는 뜻을 드러냈습니다.
  alternative_readings:
  - '''내가 그들에게 등을 돌리고 얼굴을 돌리지 않겠습니다''로 의역'
  - '''내가 그들에게 은총을 거두겠습니다''로 의미화'
  rationale: 본문은 추상화보다 얼굴-등의 대조를 통해 심판의 관계적 단절을 말하므로, 그 긴장을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
