  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 נָא의 간청·촉구의 뉘앙스가 첫 명령(אֱמָר נָא)과 돌이키라는 명령(שׁוּבוּ נָא)에서 모두 명시적으로 드러나지 않았고, עֲלֵיכֶם의 적대적 방향성은 ‘여러분을 대항하여’보다 ‘여러분을 거슬러’가 더 정확하고 자연스럽습니다.
  naturalness: ‘여러분을 대항하여’는 현대 한국어에서 어색합니다. 또한 예언자에게 주는 명령은 ‘말하여’보다 합쇼체에 맞춘 ‘말하십시오’가 자연스럽습니다. 주석 표지는 해당 어구 바로 뒤에 두는 편이 독자의 이해와 주석 연결에 적절합니다.
  terminology: ‘여호와’, ‘재앙’, ‘빚다’, ‘돌이키다’, ‘길’, ‘행실’은 문맥과 예언서의 어휘를 잘 반영합니다. 하나님의 심판을 가리키는 רָעָה를 ‘재앙’으로 옮긴 것은 적절합니다.
  issues:
