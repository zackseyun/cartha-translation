id: JER.18.11
reference: Jeremiah 18:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אֱמָר נָ֣א אֶל אִישׁ יְהוּדָה֩ וְ/עַל יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤ר עֲלֵי/כֶם֙ רָעָ֔ה וְ/חֹשֵׁ֥ב עֲלֵי/כֶ֖ם מַֽחֲשָׁבָ֑ה שׁ֣וּבוּ נָ֗א אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וְ/הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַעַלְלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/011.yaml
  text: 'Now therefore[a], say to the men of Judah and to the inhabitants of Jerusalem, saying, ‘Thus says Yahweh: Behold, I am shaping disaster against you and devising a plan against you. Turn back, please, each man from his evil way[c][b], and make your ways and your deeds good.’'
  footnotes:
  - marker: a
    text: Or 'forming calamity against you.' The verb 'shaping' echoes the potter imagery in the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Return, please' or 'Repent, please.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'each man from his evil way'; the singular is distributive, addressing the community member by member.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 이제 유다 사람들과 예루살렘 주민들에게 말하여, 「여호와께서 이와 같이 말씀하셨습니다. 보십시오, 내가 여러분을 대항하여 재앙을 빚고 있으며 여러분을 대항하여 계획을 세우고 있습니다. 이제 각자 자기의 악한 길에서 돌이키고, 여러분의 길과 행위를 좋게 하십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빚다/형성하다’의 이미지가 앞의 토기장이 비유와 연결됩니다.
    reason: source_note
  - marker: b
    text: ‘돌이키다’는 여기서 단순한 이동이 아니라 삶의 방향을 바꾸라는 요구입니다.
    reason: theological_note
  - marker: c
    text: 히브리어는 공동체를 각 사람 단위로 다루는 분배적 단수를 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제 그러므로
  - 이제
  lexicon: HALOT
  rationale: 앞 문맥의 토기장이 비유에서 이어지는 결론·전환을 함께 살리기 위해 단순한 시간 부사보다 원인/결론을 함께 드러내는 표현을 택했습니다.
- source_word: אֱמָר נָא
  english_pob_choice: say
  chosen_korean: 말하여
  alternatives_korean:
  - 말씀하십시오
  - 말해 주십시오
  lexicon: HALOT
  rationale: 예레미야에게 주어진 명령이지만, 한국어에서는 본문 전체의 경고 발화를 매끄럽게 이어 주는 연결형이 자연스럽습니다. נָא의 뉘앙스는 뒤의 권면 명령에서 충분히 반영했습니다.
- source_word: אִישׁ יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다의 남자들
  - 유다 사람 각각
  lexicon: HALOT
  rationale: 히브리어 단수 אישׁ가 집합적으로 쓰인 점은 유지하되, 한국어에서는 성별을 과도하게 드러내는 ‘남자들’보다 자연스러운 집합 표현이 문맥상 적절합니다.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들
  alternatives_korean:
  - 예루살렘 거주자들
  - 예루살렘에 사는 사람들
  lexicon: HALOT
  rationale: 직접 수신자에 대한 호칭으로서 ‘주민들’이 가장 자연스럽고, 정주 공동체를 가리키는 히브리어 표현을 무난하게 옮깁니다.
- source_word: יוֹצֵר עֲלֵיכֶם רָעָה
  english_pob_choice: I am shaping disaster against you
  chosen_korean: 내가 여러분을 대항하여 재앙을 빚고 있으며
  alternatives_korean:
  - 내가 여러분에게 재앙을 형성하고 있으며
  - 내가 여러분을 향해 재난을 만들고 있으며
  lexicon: HALOT
  rationale: יוֹצֵר는 주변 토기장이 문맥과 맞물리는 ‘빚다/형성하다’의 이미지가 핵심이므로 이를 살렸고, רָעָה는 하나님의 اخلاق적 악이 아니라 심판의 해악이므로 ‘재앙’으로 옮겼습니다.
- source_word: וְחֹשֵׁב עֲלֵיכֶם מַחֲשָׁבָה
  english_pob_choice: and devising a plan
  chosen_korean: 여러분을 대항하여 계획을 세우고 있습니다
  alternatives_korean:
  - 여러분을 향해 생각을 생각하고 있습니다
  - 여러분을 대항하여 꾀를 꾸미고 있습니다
  lexicon: HALOT
  rationale: 어근 반복의 강조를 한국어 관용에 맞게 ‘계획을 세우다’로 풀어, 단순한 사고가 아니라 의도적 결정을 드러냈습니다.
- source_word: שׁוּבוּ נָא
  english_pob_choice: Turn back, please
  chosen_korean: 이제 각자 … 돌이키고
  alternatives_korean:
  - 부디 돌아오고
  - 회개하고
  lexicon: HALOT
  rationale: שׁוּב의 핵심은 방향 전환이므로 ‘돌이키다’를 택했고, נָא는 ‘이제’와 호소적 문맥으로 완화된 긴급성을 반영했습니다.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  english_pob_choice: each man from his evil way
  chosen_korean: 각자 자기의 악한 길에서
  alternatives_korean:
  - 각 사람마다 자기의 악한 길에서
  - 각 사람은 자기의 악한 길에서
  lexicon: HALOT
  rationale: 분배적 단수 אישׁ를 ‘각자’로 살려 공동체 안의 개별 책임을 드러냈고, ‘길’은 예언서의 삶의 방식 비유를 유지합니다.
- source_word: וְהֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  english_pob_choice: and make your ways and your deeds good
  chosen_korean: 여러분의 길과 행위를 좋게 하십시오
  alternatives_korean:
  - 여러분의 길과 행실을 선하게 하십시오
  - 여러분의 길과 행동을 고치십시오
  lexicon: HALOT
  rationale: 히필의 ‘좋게 하다’라는 원인을 살리면서, 한국어에서 ‘길과 행위’를 병렬로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 여호와의 행위로 말해지는 רָעָה의 의미
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  rationale: 본문은 언약적 심판 선언이므로 하나님에게 도덕적 악을 귀속시키지 않으면서도 경고의 강도를 유지하는 ‘재앙’이 가장 적절합니다.
  doctrine_reference: '번역 원칙: 문맥상 심판 의미가 분명할 때 רָעָה를 도덕적 ‘악’으로 옮기지 않음.'
- issue: 히브리어 단수 분배 표현의 재현
  chosen_reading: 각자 자기의 악한 길에서
  alternative_readings:
  - 각 사람은 자기의 악한 길에서
  - 모두 자기의 악한 길에서
  rationale: 공동체 전체를 향한 말씀 속에서도 개인 책임을 강조하는 히브리어의 분배적 단수를 유지하기 위해 ‘각자’를 사용했습니다.
  doctrine_reference: '번역 원칙: 성별·수적 표지를 문맥 허용 범위 안에서 보존함.'
