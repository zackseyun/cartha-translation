  text: הַקְשִׁ֥יבָ/ה יְהוָ֖ה אֵלָ֑/י וּ/שְׁמַ֖ע לְ/ק֥וֹל יְרִיבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
  footnotes:
  - marker: a
    text: 'Hebrew: ''hear the voice of my adversaries''; this may mean either hearing their accusations against Jeremiah or taking notice of their hostile plotting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 제게 귀를 기울이시고 제 반대자들의 소리를 들으소서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 적대자들의 소리’를 뜻합니다. 이는 그들의 고발을 들으시라는 뜻일 수도 있고, 적대적인 음모 자체를 살피시라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  english_pob_choice: Pay attention
  chosen_korean: 귀를 기울이시고
  alternatives_korean:
  - 주의를 기울이시고
  - 들으시고
  lexicon: HALOT
  rationale: קשׁב의 히필 명령형은 단순 청취보다 적극적이고 주의 깊은 경청을 뜻하므로, 현대 한국어에서 자연스러운 ‘귀를 기울이다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 여호와 대신 고유명사 표기인 ‘야훼’를 사용하여 하나님의 언약적 이름을 보존했습니다.
- source_word: יְרִיבַי
  english_pob_choice: my adversaries
  chosen_korean: 제 반대자들의
  alternatives_korean:
  - 제 적들의
  - 제 대적들의
  - 제 원고들의
  lexicon: HALOT
  rationale: ריב 계열은 다투거나 대항하는 자들을 가리키므로, 법정적 고발로 좁히지 않으면서도 대립성을 드러내는 ‘반대자들’이 적절합니다.
- source_word: לְקוֹל
  english_pob_choice: the voice of
  chosen_korean: 소리를
  alternatives_korean:
  - 목소리를
  - 말하는 것을
  lexicon: HALOT
  rationale: קוֹל은 ‘소리/목소리’이지만 이 문맥에서는 원수들의 공격적 발화와 그 배후의 움직임을 모두 포괄할 수 있어, 한국어에서는 자연스럽게 ‘소리’로 옮겼습니다.
theological_decisions:
- issue: 주어인 야훼에 대한 청원체 종결
  chosen_reading: ‘기울이시고 / 들으소서’로 기도체 명령을 살렸습니다.
  alternative_readings:
  - ‘기울여 주십시오 / 들어 주십시오’
  - ‘귀를 기울여 주세요 / 들어 주세요’
  rationale: 히브리어 명령형 두 개가 직접적인 간구를 이루므로, 하나님께 드리는 기도문 어조를 유지하되 현대 합쇼체 안에서 간구의 긴박성을 살렸습니다.
  doctrine_reference: 기도-청원 형식 보존
