  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
  footnotes:
  - marker: a
    text: 'Hebrew: ''hear the voice of my adversaries''; this may mean either hearing their accusations against Jeremiah or taking notice of their hostile plotting.'
