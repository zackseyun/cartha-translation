base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/007.yaml
  text: At one moment I may speak concerning a nation and concerning a kingdom[a], to uproot and to tear down and to destroy.
  footnotes:
  - marker: a
    text: Or 'against a nation and against a kingdom.' The preposition can be rendered more adversatively in light of the judgment verbs that follow.
    reason: lexical_alternative
translation:
  language: ko
  text: 한순간에 내가 한 나라와 한 왕국에 대하여 말하여 그것을 뽑아 버리고 무너뜨리고 멸하려 할 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 나라와 한 왕국을 상대로.’ 이 전치사는 뒤따르는 심판 동사들을 고려하면 더 적대적으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  english_pob_choice: At one moment
  chosen_korean: 한순간에
  alternatives_korean:
  - 한때
  - 순식간에
  - 어느 한 순간에
  lexicon: HALOT
  rationale: 시간의 한순간을 가리키는 표현으로, 하나님의 선언이 시작되는 시점의 즉시성을 자연스럽게 살립니다.
- source_word: אֲדַבֵּר
  english_pob_choice: I may speak
  chosen_korean: 내가 … 말하여 … 할 수 있습니다
  alternatives_korean:
  - 내가 … 말합니다
  - 내가 … 선언합니다
  - 내가 … 말할지라도
  lexicon: HALOT
  rationale: 히필/미완료형의 일반적·상황적 발화를 한국어에서 부드럽게 드러내기 위해 단정적 현재보다 가능·상황성을 살렸습니다.
- source_word: עַל גּוֹי וְעַל מַמְלָכָה
  english_pob_choice: concerning a nation and concerning a kingdom
  chosen_korean: 한 나라와 한 왕국에 대하여
  alternatives_korean:
  - 한 민족과 한 왕국에 대하여
  - 한 나라와 한 나라에 대하여
  - 한 민족과 한 국가에 대하여
  lexicon: HALOT
  rationale: 문맥상 정치적 실체를 가리키므로 ‘나라/왕국’으로 옮기되, 히브리어 전치사의 대상·주제를 기본값으로 살려 ‘대하여’를 사용했습니다.
- source_word: לִנְתוֹשׁ / לִנְתוֹץ / וּלְהַאֲבִיד
  english_pob_choice: to uproot and to tear down and to destroy
  chosen_korean: 뽑아 버리고 무너뜨리고 멸하려
  alternatives_korean:
  - 뽑고 허물고 멸하려
  - 뿌리째 뽑고 무너뜨리고 멸하려
  - 뽑아 버리고 헐어 버리고 멸하려
  lexicon: HALOT
  rationale: 예레미야의 심판 동사군을 순서대로 살리되, 식물적 은유의 ‘uproot’는 ‘뽑아 버리다’로, 구조물 파괴의 ‘tear down’은 ‘무너뜨리다’로, 최종 파멸은 ‘멸하다’로 옮겼습니다.
theological_decisions:
- issue: עַל의 의미를 ‘대하여’로 둘지 ‘against’의 적대적 뉘앙스로 둘지
  chosen_reading: 본문에는 기본적으로 ‘대하여’를 두고, 심판 동사들이 뒤따라 적대적 성격을 드러내게 했습니다.
  alternative_readings:
  - 한 나라와 한 왕국을 향하여
  - 한 나라와 한 왕국에 대하여(적대 뉘앙스)
  - 한 나라와 한 왕국을 상대로
  rationale: 히브리어 전치사 자체를 과도하게 적대형으로 고정하지 않고, 뒤따르는 파괴 동사들이 심판의 방향을 충분히 드러내도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
