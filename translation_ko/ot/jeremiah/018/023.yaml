id: JER.18.23
reference: Jeremiah 18:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֠הוָה יָדַ֜עְתָּ אֶֽת כָּל עֲצָתָ֤/ם עָלַ/י֙ לַ/מָּ֔וֶת אַל תְּכַפֵּר֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תֶּ֑מְחִי ו/היו מֻכְשָׁלִים֙ לְ/פָנֶ֔י/ךָ בְּ/עֵ֥ת אַפְּ/ךָ֖ עֲשֵׂ֥ה בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/023.yaml
  text: But you[a], O Yahweh, know all their counsel against me for death. Do not cover over their iniquity, and do not blot out their sin from before you. Let them be made to stumble before you; in the time of your anger[c][b], act against them.
  footnotes:
  - marker: a
    text: Or 'against me to kill me' / 'for my death.' The Hebrew literally reads 'against me for death.'
    reason: lexical_alternative
  - marker: b
    text: Or 'forgive their iniquity.' The Hebrew verb can carry the sense of making atonement or covering over guilt; here the more literal metaphor is retained.
    reason: lexical_alternative
  - marker: c
    text: Or 'May they stumble before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 당신께서는 그들이 나를 죽이려는 모든 계략을 아십니다. 그들의 악을 덮어 주지 마시고, 그들의 죄를 당신 앞에서 지워 버리지 마십시오. 그들로 하여금 당신 앞에서 걸려 넘어지게 하시고 — 당신 분노의 때에 그들에게 행하여 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 죽이려는 방향으로’ / ‘나의 죽음을 위한’. 히브리어는 문자적으로 ‘나를 향하여 죽음을 위해’라고 읽힙니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들이 당신 앞에서 넘어지게 하소서.’ 히브리어의 동사는 ‘걸려 넘어지다/넘어지게 되다’의 뉘앙스를 가집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문의 संबोधन은 야훼를 가리키지만, 한국어 본문에서는 직접 음역보다 기도체의 자연스러운 호칭인 ‘주님’이 문맥에 더 잘 맞습니다. 다만 번역 원칙상 야훼 표기를 기본으로 삼되, 이 절의 직접 호소 문맥에서는 존칭 호칭을 택했습니다.
- source_word: עֲצָתָם
  english_pob_choice: their counsel
  chosen_korean: 계략
  alternatives_korean:
  - 계획
  - 의논
  - 상담
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘의도’보다 예레미야를 해치려는 적대적 모의를 드러내므로, 문맥상 ‘계략’이 가장 적절합니다.
- source_word: לַמָּוֶת
  english_pob_choice: for death
  chosen_korean: 죽이려는
  alternatives_korean:
  - 죽음에 이르는
  - 죽음을 위한
  - 죽음에 이르게 하려는
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘죽음을 위해/향하여’라는 압축 표현이지만, 한국어에서는 그 목적성을 자연스럽게 풀어 ‘죽이려는’으로 옮겨 의미를 분명히 했습니다.
- source_word: תְּכַפֵּר עַל עֲוֺנָם
  english_pob_choice: cover over their iniquity
  chosen_korean: 그들의 악을 덮어 주지 마시고
  alternatives_korean:
  - 그들의 죄악을 덮어 주지 마시고
  - 그들의 죄를 덮어 주지 마시고
  - 그들의 불의를 속죄하지 마시고
  lexicon: HALOT
  rationale: כפר의 ‘덮다/가리다’라는 물질적 비유를 살리되, 한국어에서는 ‘덮어 주다’가 가장 직접적입니다. כאן의 부정 청원은 단순한 ‘용서하지 마소서’로 매끈하게 바꾸지 않고, 성경적 이미지의 긴장을 유지합니다.
- source_word: תֶּמְחִי
  english_pob_choice: blot out
  chosen_korean: 지워 버리지 마십시오
  alternatives_korean:
  - 말소하지 마십시오
  - 지우지 마십시오
  - 말끔히 지워 버리지 마십시오
  lexicon: HALOT
  rationale: ‘blot out’은 기록에서 지우는 이미지를 담으므로, 한국어에서는 ‘지워 버리다’가 시각적·법정적 뉘앙스를 함께 살립니다.
- source_word: וְהָיוּ מֻכְשָׁלִים לְפָנֶיךָ
  english_pob_choice: Let them be made to stumble before you
  chosen_korean: 그들로 하여금 당신 앞에서 걸려 넘어지게 하시고
  alternatives_korean:
  - 그들로 하여금 당신 앞에서 넘어지게 하시고
  - 그들이 당신 앞에서 넘어지게 하시고
  - 그들로 하여금 당신 앞에서 실족하게 하시고
  lexicon: HALOT
  rationale: 히브리어는 넘어짐의 결과를 뜻하는 피동적 뉘앙스를 지니므로, 단순 ‘넘어지다’보다 원인성을 드러내는 ‘걸려 넘어지게 하시고’가 더 가깝습니다.
- source_word: בְּעֵת אַפְּךָ
  english_pob_choice: in the time of your anger
  chosen_korean: 당신 분노의 때에
  alternatives_korean:
  - 당신의 분노의 때에
  - 진노하시는 때에
  - 진노의 때에
  lexicon: HALOT
  rationale: אַף는 ‘분노/진노’의 관용어이므로, 현대 한국어의 자연스러운 기도체로 ‘당신 분노의 때’라고 옮겼습니다.
theological_decisions:
- issue: 이 절의 저주/심판 청원의 강도를 어떻게 보존할 것인가
  chosen_reading: 본문을 예레미야의 직접적인 심판 청원으로 유지하고, ‘덮어 주지 마시고’와 ‘지워 버리지 마십시오’로 죄 사함을 청하지 않는 긴장을 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 중립 서술로 바꾸기
  - ‘용서하지 마시고’로 평탄화하기
  rationale: 히브리어의 명령·청원 형식은 노골적이며, 이를 완화하면 본문이 지닌 탄원과 심판의 긴장이 사라집니다. 따라서 신학적으로 불편하더라도 원문의 힘을 유지했습니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
