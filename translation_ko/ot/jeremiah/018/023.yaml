review_pass:
  verdict: revise
  source_fidelity: 원문의 신명 YHWH(יהוה)는 일반 호칭인 ‘주님’이 아니라 고유한 신명으로 옮기는 것이 적절합니다. 또한 마지막 ‘그들에게 행하여 주십시오’의 ‘주십시오’는 한국어에서 은혜·호의의 뉘앙스를 더할 수 있어, 대적자들을 향한 심판 청원인 원문과 맞지 않습니다. 나머지 청원문의 강도와 ‘덮다/지우다’의 비유는 대체로 잘 보존되었습니다.
  naturalness: 합쇼체 기도문으로 자연스럽게 다듬었습니다. ‘당신 분노의 때’는 ‘당신의 분노의 때’로, ‘그들로 하여금 … 걸려 넘어지게’는 불필요하게 구체적인 ‘걸려’를 피하여 ‘그들이 … 넘어지게’로 조정했습니다.
  terminology: יהוה는 한국어 성경의 통용 표기인 ‘여호와’로 일관되게 옮겼습니다. עון은 뒤따르는 חטאת(죄)와 구별되도록 ‘죄악’, חטאת은 ‘죄’로 옮겼습니다. כפר의 은유는 ‘덮어 주지 마시고’로 유지했습니다.
  issues:
  - severity: medium
    issue: יהוה를 ‘주님’으로 번역함
    rationale: ‘주님’은 한국어의 일반적인 존칭 호칭으로, 본문에 명시된 고유 신명 יהוה를 드러내지 못합니다. 이 문맥에서는 ‘여호와여’가 원문 표지와 한국어 성경 관습을 모두 더 잘 반영합니다.
  - severity: medium
    issue: ‘그들에게 행하여 주십시오’의 수혜적 보조동사
    rationale: ‘-하여 주십시오’는 대체로 상대에게 호의를 베푸는 뜻으로 들릴 수 있습니다. עֲשֵׂה בָהֶם은 분노의 때에 그들을 상대로 행동해 달라는 심판 청원이므로 ‘그들에게 행하소서’가 의미를 왜곡하지 않습니다.
  - severity: low
    issue: ‘걸려 넘어지게’가 원문에 없는 구체적 이미지를 더함
    rationale: מֻכְשָׁלִים은 넘어지게 됨/실족함을 나타내지만, ‘걸려’는 원문에 없는 장애물의 이미지를 덧붙입니다. ‘넘어지게 하시고’가 충분히 자연스럽고 안전합니다.
  revised_text: 그러나 여호와여, 주께서는 그들이 나를 죽이려는 모든 계략을 아십니다. 그들의 죄악을 덮어 주지 마시고, 그들의 죄를 주 앞에서 지워 버리지 마십시오. 그들이 주 앞에서 넘어지게 하시고, 주의 분노의 때에 그들에게 행하소서.[a][b]
