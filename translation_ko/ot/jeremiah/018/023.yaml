revisions:
- from: 그러나 주님, 당신께서는 그들이 나를 죽이려는 모든 계략을 아십니다. 그들의 악을 덮어 주지 마시고, 그들의 죄를 당신 앞에서 지워 버리지 마십시오. 그들로 하여금 당신 앞에서 걸려 넘어지게 하시고 — 당신 분노의 때에 그들에게 행하여 주십시오.[a][b]
  to: 그러나 여호와여, 주께서는 그들이 나를 죽이려는 모든 계략을 아십니다. 그들의 죄악을 덮어 주지 마시고, 그들의 죄를 주 앞에서 지워 버리지 마십시오. 그들이 주 앞에서 넘어지게 하시고, 주의 분노의 때에 그들에게 행하소서.[a][b]
  rationale: 신명을 보존하고, 심판 청원의 마지막 동사에서 의도치 않은 수혜 의미를 제거했습니다. 원문의 살해 목적을 지닌 계략, 죄악을 덮거나 죄를 지우지 말라는 청원, 넘어짐과 분노의 때에 행하라는 청원을 모두 유지했습니다.
  reviewer_model: gpt-5.6-terra
