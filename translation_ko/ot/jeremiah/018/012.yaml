id: JER.18.12
reference: Jeremiah 18:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמְר֖וּ נוֹאָ֑שׁ כִּֽי אַחֲרֵ֤י מַחְשְׁבוֹתֵ֨י/נוּ֙ נֵלֵ֔ךְ וְ/אִ֛ישׁ שְׁרִר֥וּת לִבּֽ/וֹ הָ/רָ֖ע נַעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/012.yaml
  text: But they will say[a], ‘It is hopeless, for we will follow our own plans, and each of us will act according to the stubbornness of his evil heart.’
  footnotes:
  - marker: a
    text: Or, “It is in vain” or “There is no hope.” The Hebrew expression can convey either despair or the dismissal of the prophet’s appeal as pointless.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 말할 것입니다[a]. ‘희망이 없습니다. 우리는 우리 계획을 따라가고, 각자 자기 악한 마음의 완고함을 따라 행하겠습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “소용없습니다” 또는 “헛된 일입니다.” 히브리어 표현은 절망을 나타낼 수도 있고, 예언자의 호소를 무익하다고 일축하는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹאָשׁ
  english_pob_choice: It is hopeless
  chosen_korean: 헛되다
  alternatives_korean:
  - 희망이 없다
  - 소용없다
  lexicon: HALOT
  rationale: 문맥상 예언자의 부름을 무익한 것으로 치부하는 거절의 뉘앙스를 살리기 위해, 현대 한국어에서 자연스럽고 압축적인 ‘헛되다’를 택했습니다.
- source_word: אַחֲרֵי מַחְשְׁבוֹתֵינוּ נֵלֵךְ
  english_pob_choice: we will follow our own plans
  chosen_korean: 우리는 우리 생각을 따라 가고
  alternatives_korean:
  - 우리는 우리 계획을 따라 가고
  - 우리는 우리 꾀를 따라 가고
  lexicon: HALOT
  rationale: ‘뒤를 따라 가다’의 관용적 뜻을 살리면서, מַחְשְׁבוֹת의 의미를 ‘생각/계획’ 가운데 보다 넓게 담아 ‘생각’을 선택했습니다.
- source_word: שְׁרִרוּת
  english_pob_choice: stubbornness
  chosen_korean: 완고함
  alternatives_korean:
  - 고집
  - 완악함
  - 고집불통
  lexicon: HALOT
  rationale: 이 명사는 언약적 반역에서의 자기고집을 가리키므로, 도덕적 뉘앙스를 유지하는 표준어 ‘완고함’이 가장 적절합니다.
- source_word: לִבּוֹ הָרָע
  english_pob_choice: his evil heart
  chosen_korean: 자기 악한 마음
  alternatives_korean:
  - 그의 악한 마음
  - 자기의 사악한 마음
  lexicon: HALOT
  rationale: 히브리어 לֵב는 내적 의지와 사고의 중심을 가리키므로 ‘마음’으로 옮기되, 이어지는 분배적 표현과 자연스럽게 연결되도록 ‘자기’로 처리했습니다.
theological_decisions:
- issue: נוֹאָשׁ의 의미를 절망과 무익함 가운데 어떻게 잡을지
  chosen_reading: ‘헛되다’로 옮겨, 예언의 요구를 무익한 것으로 거절하는 태도와 절망의 울림을 함께 남겼습니다.
  alternative_readings:
  - 희망이 없다
  - 소용없다
  rationale: 히브리어는 절망 진술과 예언의 권면을 ‘쓸모없다’고 치부하는 반응을 모두 담을 수 있으므로, 어느 한쪽으로 과도하게 제한하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (source의 긴장 보존)
- issue: ‘각 사람’의 분배적 의미와 성별 표지
  chosen_reading: ‘우리 각 사람’으로 옮겨 공동체 전체의 분배적 의미를 살리되, 한국어에서 불필요하게 남성 중심으로 읽히는 표현은 피했습니다.
  alternative_readings:
  - 각 남자
  - 각자
  rationale: וְאִישׁ은 집단을 대표하는 분배적 단수이므로, 의미를 보존하면서도 현대 한국어로는 더 자연스러운 집합 표현을 사용했습니다.
  doctrine_reference: Translation philosophy §2 (의미 우선, 과도한 문자주의 지양)
