revisions:
- from: 그러나 그들은 말합니다[a], ‘헛되다. 우리는 우리 생각을 따라 가고, 우리 각 사람은 자기 악한 마음의 완고함대로 행동하겠습니다.’
  to: 그러나 그들은 말할 것입니다[a]. ‘희망이 없습니다. 우리는 우리 계획을 따라가고, 각자 자기 악한 마음의 완고함을 따라 행하겠습니다.’
