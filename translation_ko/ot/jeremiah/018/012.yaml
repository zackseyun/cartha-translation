  source_fidelity: 히브리어의 미래형(‘그들이 말할 것이다’)과 분배적 단수(‘각자’)는 살려야 합니다. נוֹאָשׁ는 절망과 예언자 호소의 무익함을 일축하는 뜻 사이에 의미 범위가 있으므로, 본문과 각주에서 그 긴장을 보존하는 것이 적절합니다.
  naturalness: 초안의 ‘그들은 말합니다’는 문맥의 미래 진술과 맞지 않으며, 인용문 안의 ‘헛되다’는 합쇼체 문장으로는 미완성처럼 들립니다. ‘우리 생각을 따라 가고’도 ‘우리 계획을 따라가고’가 더 자연스럽고 문맥에 정확합니다.
  terminology: מַחְשְׁבוֹתֵינוּ는 여기서 단순한 내적 생각보다 의도적인 ‘계획’으로 옮기는 편이 적절합니다. שְׁרִרוּת은 ‘완고함’으로 유지할 수 있으며, לֵב는 ‘마음’으로 번역하는 것이 적절합니다.
