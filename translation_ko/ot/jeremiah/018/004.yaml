id: JER.18.4
reference: Jeremiah 18:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִשְׁחַ֣ת הַ/כְּלִ֗י אֲשֶׁ֨ר ה֥וּא עֹשֶׂ֛ה בַּ/חֹ֖מֶר בְּ/יַ֣ד הַ/יּוֹצֵ֑ר וְ/שָׁ֗ב וַֽ/יַּעֲשֵׂ֨/הוּ֙ כְּלִ֣י אַחֵ֔ר כַּ/אֲשֶׁ֥ר יָשַׁ֛ר בְּ/עֵינֵ֥י הַ/יּוֹצֵ֖ר לַ/עֲשֽׂוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/004.yaml
  text: And the vessel that he was making from the clay was spoiled in the potter’s hand[a], and he turned and made it into another vessel[b], as seemed right in the potter’s eyes to make.
  footnotes:
  - marker: a
    text: Or “was marred” or “was ruined.” The Hebrew verb indicates that the vessel became defective while being worked.
    reason: lexical_alternative
  - marker: b
    text: Literally “as was right in the eyes of the potter to make,” an idiom meaning “as the potter saw fit to make.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 진흙으로 만들고 있던 그 그릇은 토기장이의 손에서 망가졌고[a], 그는 돌이켜 그것을 다른 그릇으로 만들었습니다[b]. 토기장이가 만들기에 좋게 보이는 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “망가졌다”, “손상되었다.” 히브리어 동사는 작업 중 그릇이 결함 있게 된 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “토기장이의 눈에 만들기에 옳은 대로”입니다. 곧 “토기장이가 좋다고 여기는 대로”라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁחַת
  english_pob_choice: was spoiled
  chosen_korean: 망가졌고
  alternatives_korean:
  - 훼손되었고
  - 무너졌고
  - 망가졌습니다
  lexicon: HALOT
  rationale: 진행 중인 제작 과정에서 그릇이 결함 있게 된 상태를 자연스러운 현대 한국어로 옮겼습니다. '망가졌다'는 결과 상태를 잘 드러내면서도 과도하게 해석적이지 않습니다.
- source_word: בְּיַד הַיּוֹצֵר
  english_pob_choice: in the potter’s hand
  chosen_korean: 토기장이의 손에서
  alternatives_korean:
  - 토기장이의 손 안에서
  - 토기장이의 손에
  lexicon: HALOT
  rationale: 히브리어 관용구의 직접적 이미지를 살리되 한국어에서는 '손에서'가 작업 중 통제와 접촉을 가장 자연스럽게 나타냅니다.
- source_word: וְשָׁב וַיַּעֲשֵׂהוּ
  english_pob_choice: and he turned and made it into
  chosen_korean: 그는 돌이켜 그것을 … 만들었습니다
  alternatives_korean:
  - 그는 다시 그것을 … 만들었습니다
  - 그는 돌아서 그것을 … 만들었습니다
  lexicon: HALOT
  rationale: שׁוּב는 여기서 단순한 공간적 '돌아감'보다 다시 손대어 재형성하는 전환을 나타내므로, '돌이켜'로 작업의 재개를 표현했습니다.
- source_word: כְּלִי אַחֵר
  english_pob_choice: another vessel
  chosen_korean: 다른 그릇
  alternatives_korean:
  - 또 하나의 그릇
  - 다른 용기
  lexicon: HALOT
  rationale: כְּלִי는 문맥상 도자기 '그릇'이 가장 구체적이고 자연스럽습니다. '용기'는 현대어로는 다소 추상적입니다.
- source_word: כַּאֲשֶׁר יָשַׁר בְּעֵינֵי הַיּוֹצֵר לַעֲשׂוֹת
  english_pob_choice: as seemed right in the potter’s eyes to make
  chosen_korean: 토기장이가 만들기에 좋게 보이는 대로
  alternatives_korean:
  - 토기장이의 눈에 옳아 보이는 대로
  - 토기장이가 좋다고 여기는 대로
  lexicon: HALOT
  rationale: '''눈에 … 보이다''라는 히브리어 관용을 살리면서, יָשַׁר의 ''옳다/바르다''와 문맥의 ''적합하다''를 함께 전달하도록 ''좋게 보이는 대로''로 옮겼습니다.'
theological_decisions:
- issue: 토기장이-그릇의 직접적 이미지 유지
  chosen_reading: 구절 자체는 흙과 도공의 작업 장면을 그대로 유지하고, 하나님의 주권적 적용은 문맥에서 드러나도록 남겨 두었습니다.
  alternative_readings:
  - 하나님의 주권적 재형성으로 명시적으로 풀어쓰기
  - 비유적 의미를 주석적으로 본문에 삽입
  rationale: 이 절은 먼저 작업 장면을 제시하는 본문이므로, 해석을 앞당겨 비유를 평문화하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: '예레미야 18장 문맥 주해, 번역 원칙: 본문-주석 구분'
- issue: וְשָׁב의 방향성
  chosen_reading: '''돌이켜''를 사용해 단순 재시도가 아니라 재형성으로 방향을 바꾸는 동작을 나타냈습니다.'
  alternative_readings:
  - 다시
  - 되돌아가
  rationale: 히브리어 השׁוב는 여기서 행위의 재개와 방향 전환을 함께 암시하므로, 한국어로도 그 전환감을 살리는 것이 중요합니다.
  doctrine_reference: HALOT / WLC 용례
