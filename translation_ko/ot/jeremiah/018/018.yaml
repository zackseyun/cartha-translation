base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/018.yaml
  text: Then they said[a], “Come, let us devise plans against Jeremiah, for instruction will not perish from the priest, nor counsel from the wise man, nor word from the prophet. Come, let us strike him with the tongue, and let us not pay attention to any of his words.”
  footnotes:
  - marker: a
    text: Or 'let us attack him with our tongue,' that is, by slander or accusation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “자, 예레미야를 대적할 계략을 꾸밉시다. 제사장에게서 가르침이, 지혜자에게서 조언이, 예언자에게서 말이 없어지지 않을 것이기 때문입니다. 자, 혀로 그를 치고 그의 모든 말에 귀를 기울이지 맙시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말로 그를 공격합시다.” 문자적으로는 “혀로 그를 치다”입니다. 이는 비방이나 고발과 같은 언어적 공격을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  english_pob_choice: instruction
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  - 지시
  lexicon: HALOT
  rationale: 여기서는 제사장의 기능과 연결된 ‘토라’이므로 한국어 성경 전통과 본문 기능을 함께 살려 ‘율법’으로 옮겼습니다. 문맥상 제도적·규범적 가르침을 가리키므로 단순한 ‘교훈’보다 적절합니다.
- source_word: וְנַחְשְׁבָה ... מַחֲשָׁבוֹת
  english_pob_choice: let us devise plans
  chosen_korean: 계략을 꾸미자
  alternatives_korean:
  - 계획을 세우자
  - 생각을 생각하자
  - 음모를 꾸미자
  lexicon: HALOT
  rationale: 중복 어근이 의도적이고 적대적이므로 단순한 계획보다 ‘계략’이 본문의 적의를 더 잘 드러냅니다. 너무 현대적이거나 해설적인 ‘음모’보다 본문 어조를 유지할 수 있습니다.
- source_word: וְנַכֵּהוּ בַּלָּשׁוֹן
  english_pob_choice: let us strike him with the tongue
  chosen_korean: 그를 혀로 치고
  alternatives_korean:
  - 그를 말로 공격하고
  - 그를 혀로 치고서
  - 그를 말로 때리고
  lexicon: HALOT
  rationale: 히브리어 관용구의 폭력적 비유를 살리기 위해 직역에 가깝게 유지했습니다. 본문이 단순한 비난보다 언어를 통한 공격을 강조하므로, 이를 해설 없이도 드러내는 표현을 택했습니다.
- source_word: מִנָּבִיא
  english_pob_choice: from the prophet
  chosen_korean: 예언자에게서
  alternatives_korean:
  - 선지자에게서
  - 예언자에게서 나온
  - 예언자에게부터
  lexicon: HALOT
  rationale: 예언자 관련 본문에서 ‘נָבִיא’는 기능 명칭이므로 현대 표준어로 ‘예언자’가 가장 직접적입니다. 전통 교회어 ‘선지자’도 가능하지만, 본 프로젝트의 현대적 표준어 지향에 맞춰 선택했습니다.
theological_decisions:
- issue: 대상 호칭의 대표 단수 유지
  chosen_reading: ‘제사장’, ‘지혜로운 이’, ‘예언자’를 각각 단수 대표형으로 유지했습니다.
  alternative_readings:
  - 복수로 풀어 ‘제사장들’, ‘지혜자들’, ‘예언자들’로 옮기기
  - 중성화하여 ‘지혜로운 사람’으로 옮기기
  rationale: 히브리어는 대표 단수로 일반 범주를 말하고 있으므로, 한국어에서도 범주성을 유지하기 위해 단수형을 살렸습니다. 이를 복수화하면 원문의 형식이 흐려집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
