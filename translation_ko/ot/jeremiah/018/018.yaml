revisions:
- from: 그들이 말했습니다. 「오너라. 우리가 예레미야에 대하여 계략을 꾸미자. 제사장에게서 율법이, 지혜로운 이에게서 계책이, 예언자에게서 말이 사라지지 않을 것이니 말이다. 오너라. 우리가 그를 혀로 치고, 그의 어떤 말에도 귀 기울이지 말자」.[a]
  to: 그들이 말했습니다. “자, 예레미야를 대적할 계략을 꾸밉시다. 제사장에게서 가르침이, 지혜자에게서 조언이, 예언자에게서 말이 없어지지 않을 것이기 때문입니다. 자, 혀로 그를 치고 그의 모든 말에 귀를 기울이지 맙시다.”[a]
  rationale: 원문의 적대적인 공모와 세 직분의 병렬을 보존하면서, 제사장적 토라의 문맥상 의미를 ‘가르침’으로 조정했습니다. 공동 권유는 현대 합쇼체로 자연화했으며, ‘혀로 그를 치다’라는 비유는 본문에 남기고 가능한 의미를 각주에서 제시했습니다. 각주의 잘못된 소유 표현도 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:28Z'
review_pass:
  verdict: revise
  source_fidelity: ‘תּוֹרָה’는 여기서 성문화된 ‘율법’ 자체보다 제사장이 제공하는 가르침/교훈을 가리키므로 ‘가르침’이 문맥에 더 충실합니다. 또한 בַּלָּשׁוֹן은 ‘그의 혀로’가 아니라 ‘혀로’이며, 언어를 수단으로 한 공격이라는 비유를 유지해야 합니다.
  naturalness: 초안의 ‘오너라’는 현대 표준어의 합쇼체와 맞지 않고, 공동 권유인 לְכוּ의 기능에도 ‘자, …합시다’가 자연스럽습니다. ‘혀로 치고’는 의도적으로 비유를 보존하되 어순을 다듬어 읽기 쉽게 했습니다.
  terminology: ‘예레미야’, ‘제사장’, ‘지혜자’, ‘예언자’는 적절합니다. 제사장과 연결된 תּוֹרָה는 이 문맥에서 ‘가르침’으로, עֵצָה는 ‘조언’으로 구별했습니다. דָּבָר는 별도의 신적 계시 함의를 덧붙이지 않는 ‘말’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘율법’은 이 문맥의 תּוֹרָה를 지나치게 좁힐 수 있습니다.
    rationale: 제사장에게서 나오는 토라는 여기서 일반적으로 지속될 제사장적 가르침을 뜻하며, 영어 감사 기록도 ‘instruction’을 채택합니다.
  - severity: high
    issue: 각주가 원문의 관용구를 ‘그의 혀로 치다’로 잘못 인용합니다.
    rationale: 히브리어 בַּלָּשׁוֹן에는 ‘그의’에 해당하는 소유 접미사가 없습니다. ‘혀로 그를 치다’로 바로잡아야 합니다.
  - severity: medium
    issue: ‘오너라’는 현대 합쇼체의 공동 권유 표현으로 부자연스럽습니다.
    rationale: לְכוּ는 공모자들이 서로 행동을 권하는 복수 명령이므로 ‘자, …합시다’가 현대적이며 기능적으로 대응합니다.
