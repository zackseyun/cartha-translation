- from: 그러므로 그들의 자녀를 기근에 넘기시고[a], 그들을 칼의 권세에 맡기십시오. 그들의 아내들은 자식 잃은 여인들과 과부가 되게 하시고, 그들의 남자들은 죽임을 당하게 하시며[b], 그들의 젊은 남자들은 전쟁에서 칼에 맞아 쓰러지게 하십시오.
  to: 그러므로 그들의 자녀를 기근에 내어주시고, 그들을 칼의 권세에 넘겨 주십시오[a]. 그들의 아내들이 자식을 잃고 과부가 되게 하시며, 그들의 남자들이 죽음으로 죽임을 당하게 하시고[b], 그들의 젊은 남자들이 전쟁에서 칼에 맞아 쓰러지게 하십시오.
  rationale: 각주 a를 실제로 설명하는 ‘칼의 권세’에 붙여 앵커 오류를 해소했습니다. 아내들에 관한 병렬을 자연스러운 한국어로 바로잡았고, ‘죽음으로 죽임을 당하게’와 각주 b를 통해 난해한 히브리어 표현의 중첩과 강도를 보존했습니다. 이는 특정 해석을 덧붙이지 않으면서 원문의 청원형 어조를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:28Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 직접적인 심판 청원(명령형/청원형)과 기근·칼·사별·과부됨·죽음·전쟁이라는 병렬을 대체로 보존했습니다. 그러나 기존 각주 a는 ‘기근에 넘기시고’에 붙어 있으면서 칼의 관용구를 설명하여 앵커와 내용이 맞지 않습니다. 또한 הֲרֻגֵי מָוֶת의 난해한 중첩을 본문의 ‘죽임을 당하게’만으로는 충분히 드러내지 못합니다.
  naturalness: ‘그들의 아내들은 자식 잃은 여인들과 과부가 되게’는 ‘아내들’과 ‘여인들’을 병렬시키는 형태가 어색합니다. ‘아내들이 자식을 잃고 과부가 되게’가 현대 표준어 합쇼체에서 자연스럽습니다. 명령형도 ‘넘기시고 … 맡기십시오’보다 ‘내어주시고 … 넘겨 주십시오’로 통일하는 편이 매끄럽습니다.
  terminology: ‘칼의 권세’는 עַל־יְדֵי חֶרֶב의 비유적 힘을 자연스럽게 전달합니다. שַׁכֻּלוֹת는 자녀를 잃은 상태로 구체화하되, 아내들이라는 주어에 맞추어 표현해야 합니다. הֲרֻגֵי מָוֶת는 문자적으로 ‘죽음에 죽임을 당한 자들’에 가까운 난해한 표현이므로, 본문에서는 ‘죽음으로 죽임을 당하게’로 보존하고 각주에서 난해성을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: 각주 a의 앵커와 설명 대상이 불일치합니다.
    rationale: 각주 a는 ‘기근에 넘기시고’ 뒤에 붙어 있지만 ‘칼의 손들 위에’라는 다음 구절의 칼 관용구를 설명합니다. 앵커를 칼 구절로 옮기고 대안 번역을 제시해야 합니다.
  - severity: medium
    issue: ‘아내들은 자식 잃은 여인들과 과부가 되게’가 부자연스럽고 병렬 관계가 불분명합니다.
    rationale: 히브리어는 ‘그들의 아내들이 자식을 잃고 과부가 되게’라는 서술입니다. ‘여인들’은 불필요하게 주어를 중복·전환합니다.
  - severity: medium
    issue: הֲרֻגֵי מָוֶת의 ‘죽음’ 요소가 본문에서 탈락합니다.
    rationale: ‘죽임을 당하게’는 הרוג의 뜻만 반영합니다. 난해한 표현임을 각주로 설명하면서 본문에도 ‘죽음으로 죽임을 당하게’와 같이 중첩을 보존하는 것이 더 충실합니다.
