  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵן֩ תֵּ֨ן אֶת בְּנֵי/הֶ֜ם לָ/רָעָ֗ב וְ/הַגִּרֵ/ם֮ עַל יְדֵי חֶרֶב֒ וְ/תִֽהְיֶ֨נָה נְשֵׁי/הֶ֤ם שַׁכֻּלוֹת֙ וְ/אַלְמָנ֔וֹת וְ/אַ֨נְשֵׁי/הֶ֔ם יִֽהְי֖וּ הֲרֻ֣גֵי מָ֑וֶת בַּח֣וּרֵי/הֶ֔ם מֻכֵּי חֶ֖רֶב בַּ/מִּלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/021.yaml
  text: Therefore give their children over to famine[a], and hand them over to the power of the sword. Let their wives become bereaved and widowed, and let their men be slain by death[c][b], their young men struck down by the sword in battle.
  footnotes:
  - marker: a
    text: Or 'hand them over into the hands of the sword.' The Hebrew idiom is literally more concrete than the main text.
    reason: lexical_alternative
  - marker: b
    text: Or 'their sons' for 'their children'; the Hebrew can be read more narrowly, though it may also function collectively for offspring.
    reason: lexical_alternative
  - marker: c
    text: Literally 'killed of death,' a difficult Hebrew expression conveying fatal destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들의 자녀를 기근에 넘기시고[a], 그들을 칼의 권세에 맡기십시오. 그들의 아내들은 자식 잃은 여인들과 과부가 되게 하시고, 그들의 남자들은 죽임을 당하게 하시며[b], 그들의 젊은 남자들은 전쟁에서 칼에 맞아 쓰러지게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기근에 넘기시고’는 히브리어의 더 구체적인 관용구(‘칼의 손들 위에’와 함께 쓰인 문맥)를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽임을 당하게 하시며’는 히브리어의 난해한 표현을 풀어 옮긴 것으로, 문자적으로는 ‘죽음의 죽임을 당한 자들’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니
  lexicon: HALOT
  rationale: 앞 문맥의 간구에 대한 결과를 나타내는 접속부사로, 현대 한국어에서 가장 자연스럽고 격식 있는 대응은 ‘그러므로’입니다.
- source_word: תֵּן ... לָרָעָב
  english_pob_choice: give ... over to famine
  chosen_korean: 기근에 넘기시고
  alternatives_korean:
  - 기근에 내어주시고
  - 기근에게 주시고
  lexicon: HALOT
  rationale: נתן + ל는 ‘어떤 운명/권세에 넘기다’는 뜻이므로, ‘넘기시고’가 심판적 인도/위임의 뉘앙스를 잘 살립니다.
- source_word: עַל יְדֵי חֶרֶב
  english_pob_choice: to the power of the sword
  chosen_korean: 칼의 권세에 맡기십시오
  alternatives_korean:
  - 칼의 손에 넘기십시오
  - 칼의 손아귀에 맡기십시오
  lexicon: HALOT
  rationale: 직역하면 ‘칼의 손들 위에’이지만, 한국어에서는 ‘권세에 맡기다’가 그 비유적 힘과 심판의 주체성을 가장 자연스럽게 전달합니다.
- source_word: שַׁכֻּלוֹת וְאַלְמָנוֹת
  english_pob_choice: bereaved and widowed
  chosen_korean: 자식 잃은 여인들과 과부가 되게 하시고
  alternatives_korean:
  - 상실한 여인들과 과부가 되게 하시고
  - 아이를 잃고 과부가 되게 하시고
  lexicon: HALOT
  rationale: שַׁכֻּלוֹת는 일반적 상실보다 자녀 상실의 의미가 강하므로 ‘자식 잃은’으로 구체화했고, ‘과부’는 병렬 구조를 유지했습니다.
- source_word: הֲרֻגֵי מָוֶת
  english_pob_choice: be slain by death
  chosen_korean: 죽임을 당하게 하시며
  alternatives_korean:
  - 죽임당하게 하시며
  - 죽음으로 죽게 하시며
  lexicon: HALOT
  rationale: ‘죽임을 당하다’는 히브리어의 난해한 ‘죽음의 죽임’ 표현을 지나치게 해석하지 않으면서도, POB의 강한 파괴 뉘앙스를 한국어로 자연스럽게 옮깁니다.
theological_decisions:
- issue: 예언자적 저주 기도의 직접성
  chosen_reading: 심판을 구하는 직접 청원을 완화하지 않고 명령형/청유형으로 유지했습니다.
  alternative_readings:
  - 미래 예고문으로 바꾸기
  - 완곡한 재난 진술로 바꾸기
  rationale: 본문은 하나님께 드리는 직접 간구의 수사이므로, 그 긴장과 무게를 보존하는 것이 원문의 의도에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
