  text: וְ/רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/בְנֹ֖ת וְ/לִ/נְטֹֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/009.yaml
  text: And at another moment I may speak concerning a nation and concerning a kingdom[a], to build and to plant.
  footnotes:
  - marker: a
    text: Or, 'And in a moment I speak concerning a nation and concerning a kingdom, to build and to plant.' The Hebrew idiom uses 'moment' language to frame God's declarations in vv. 7–10.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 다른 때에는 내가 어떤 나라와 어떤 왕국을 세우고 심겠다고 말할 수도 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘한순간에 내가 어떤 나라와 어떤 왕국에 관하여 그것을 세우고 심을 것이라고 말합니다.’ 히브리어의 ‘순간’이라는 표현은 7–10절에서 하나님의 선언을 시간적으로 틀 지어 보여 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֶגַע
  english_pob_choice: And at another moment
  chosen_korean: 또 다른 순간에
  alternatives_korean:
  - 한순간에
  - 어느 순간에
  - 그리고 순간에
  lexicon: HALOT
  rationale: רֶגַע의 ‘순간/잠깐’ 이미지를 살리되, 앞선 절과의 시간 대비를 자연스럽게 드러내기 위해 ‘또 다른 순간에’로 옮겼습니다.
- source_word: אֲדַבֵּר
  english_pob_choice: I may speak
  chosen_korean: 나는 말하여
  alternatives_korean:
  - 나는 말할 수 있습니다
  - 나는 말씀하십니다
  - 내가 말합니다
  lexicon: HALOT
  rationale: 히브리어 미완료형의 조건적·진술적 힘을 살리면서도 한국어에서는 부자연스러운 ‘may’를 직접 옮기지 않고, 이어지는 목적절과 결합되는 서술형으로 처리했습니다.
- source_word: לִ/בְנֹ֖ת וְ/לִ/נְטֹֽעַ
  english_pob_choice: to build and to plant
  chosen_korean: 세우고 심으려 합니다
  alternatives_korean:
  - 건축하고 심으려 합니다
  - 건설하고 심으려 합니다
  - 세우고 심기 위하여
  lexicon: HALOT
  rationale: ‘build’와 ‘plant’의 농경적·건축적 대조를 유지하되, 한국어에서 자연스럽게 목적을 나타내는 표현으로 다듬었습니다. ‘세우다’는 히브리어의 건축 이미지를 완곡하게 살리고, ‘심다’는 문자적 이미지를 그대로 보존합니다.
- source_word: גּוֹי / מַמְלָכָה
  english_pob_choice: a nation and a kingdom
  chosen_korean: 한 나라와 한 왕국
  alternatives_korean:
  - 한 민족과 한 왕국
  - 한 나라와 한 나라
  - 한 국가와 한 왕국
  lexicon: HALOT
  rationale: גּוֹי는 정치·공동체 단위를 가리키는 ‘나라’로, מַמְלָכָה는 ‘왕국’으로 옮겨 병렬 구조를 살렸습니다. 한국어에서 ‘나라/왕국’의 대비가 가장 직관적입니다.
theological_decisions:
- issue: 예언적 조건부 진술의 뉘앙스
  chosen_reading: 하나님의 발화를 단정적 미래형으로 고정하지 않고, 문맥상 원리 진술에 가까운 열린 서술로 옮겼습니다.
  alternative_readings:
  - 나는 말할 것입니다
  - 나는 말합니다
  rationale: 문맥상 vv. 7–10은 하나님의 경고와 약속이 열방의 반응에 따라 어떻게 적용되는지를 보여 줍니다. 따라서 본문의 조건부·시나리오 설정 성격을 유지하는 것이 신학적 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
