  naturalness: 기존의 ‘말하여, 세우고 심으려 합니다’는 ‘말하다’와 목적 부정사의 관계가 한국어에서 부자연스럽고, 화자가 말한 뒤 스스로 세우고 심으려 한다는 순차적 의도로 읽힐 수 있습니다. 수정문은 현대 표준어 합쇼체로 자연스럽습니다.
