base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/003.yaml
  text: So I went down to the potter’s house[a], and there he was[b], doing work on the wheel.
  footnotes:
  - marker: a
    text: Or 'and behold, he was doing work on the wheels.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term refers to the potter’s wheel apparatus, literally a dual form, hence 'the wheels.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 나는 토기장이의 집으로 내려갔습니다. 보니[a], 그가 물레에서[b] 일을 하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 보라, 그가 물레에서 일을 하고 있었다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 토기장이의 물레 장치를 가리키며, 이중형으로 되어 있습니다. 따라서 문자적으로는 ‘두 바퀴’ 또는 ‘바퀴들’로 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֵרֵד
  english_pob_choice: So I went down
  chosen_korean: 그래서 나는 내려갔습니다
  alternatives_korean:
  - 그때 나는 내려갔습니다
  - 그리고 나는 내려갔습니다
  lexicon: HALOT
  rationale: 과거 서사 흐름을 이어 주는 wayyiqtol의 순차성을 살리되, 한국어에서는 자연스럽게 결과·전개를 잇는 ‘그래서’로 옮겼습니다.
- source_word: בֵּית הַיּוֹצֵר
  english_pob_choice: to the potter’s house
  chosen_korean: 토기장이의 집으로
  alternatives_korean:
  - 토기장이 집으로
  - 토기장이의 집에
  lexicon: HALOT
  rationale: 구문상 ‘집’에 속한 사람을 나타내는 소유 관계를 한국어 자연어로 유지하기 위해 ‘토기장이의 집’으로 옮겼습니다.
- source_word: וְהִנֵּהוּ
  english_pob_choice: and there he was
  chosen_korean: 보니 그는
  alternatives_korean:
  - 그리고 보니 그는
  - 바로 그는
  lexicon: HALOT
  rationale: 히브리어 הִנֵּה의 시각적·지시적 돌출을 한국어 서술 흐름 안에서 ‘보니’로 살렸습니다.
- source_word: עַל הָאָבְנָיִם
  english_pob_choice: on the wheels
  chosen_korean: 바퀴에서
  alternatives_korean:
  - 물레에서
  - 바퀴 위에서
  lexicon: HALOT
  rationale: אָבְנַיִם의 이중형이 가리키는 토기장이의 장치에 대해, 본문이 구체적 도구명보다 작동 위치를 강조하므로 ‘바퀴에서’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 토기장이 장면의 서술 톤
  chosen_reading: 예레미야가 실제로 관찰한 장면을 그대로 전달하는 관찰적 서술로 유지했습니다.
  alternative_readings:
  - 상징적 해설을 덧붙여 장면을 풀이하는 방식
  - 더 설명적인 표현으로 의미를 풀어 쓰는 방식
  rationale: 본문은 해석보다 시각적 관찰을 먼저 제시하므로, 상징은 다음 절들에서 드러나게 두고 여기서는 관찰의 생생함을 보존했습니다.
  doctrine_reference: 예레미야 18장의 문맥적 상징 해석 원칙
