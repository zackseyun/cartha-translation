  to: 그때 나는 토기장이의 집으로 내려갔습니다. 보니[a], 그가 물레에서[b] 일을 하고 있었습니다.
  rationale: 서사적 순서를 중립적으로 나타내도록 ‘그래서’를 ‘그때’로 바꾸고, 히브리어 הִנֵּה의 주목을 환기하는 기능은 ‘보니’로 유지했습니다. 토기 제작 장치에는 현대 표준어에서 자연스럽고 문맥상 정확한 ‘물레’를 사용했습니다. 각주 표지는 각각 대안 표현과 물레 장치의 이중형 설명이 가리키는 위치로 재배치했습니다.
