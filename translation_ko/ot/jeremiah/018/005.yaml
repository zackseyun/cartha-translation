lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 이르러
  - 그리하여 ... 이르러
  lexicon: HALOT
  rationale: 서술 전개를 나타내는 와우 연속의 흐름을 한국어에서 자연스럽게 옮기기 위해, 고어적 표현 대신 사건의 도래를 분명히 하는 ‘그때 ... 임하여’를 선택했습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언자적 공식에서 ‘the word’는 단순한 음성이 아니라 하나님의 발화 전체를 가리키므로, 한국어 성경 문맥에 맞는 ‘말씀’이 가장 정확합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 사본의 신명기호는 직역·음역 원칙에 따라 ‘야훼’로 옮겨, 고유한 언약 անուն을 제목화하지 않고 드러냈습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 인용 도입어를 한국어에서는 다음 절의 직접화법을 예고하는 매끄러운 서술로 처리하되, 하나님의 발화라는 점은 ‘말씀하셨습니다’로 보존했습니다.
theological_decisions:
- issue: 신명기호 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 고유명사를 직접 사용하므로, 전통적 대체어인 ‘주’보다 이름 자체를 드러내는 ‘야훼’가 원문의 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
