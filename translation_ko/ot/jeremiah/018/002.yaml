  - 내가 당신에게 내 말을 들려 드리겠습니다
  lexicon: HALOT
  rationale: הִפעיל형 שמע의 사역적 의미를 살리면서도, 현대 한국어에서 자연스럽고 직접적인 ‘들려주다’로 옮겼습니다. 복수형 ‘words’는 단수화하지 않고 ‘말씀들’보다 덜 과장된 ‘말’로 유지했습니다.
theological_decisions:
