  chosen_reading: 하나님이 예레미야에게 직접 말씀하시는 장면이므로, 본문 서술은 합쇼체로 유지하되 하나님의 미래 행위는 ‘들려주겠습니다’로 공손하게 표현했습니다.
  alternative_readings:
  - ‘들을 수 있게 하겠습니다’
  - ‘들려주리라’
  rationale: 예언자에게 주어지는 명령과 약속의 어조를 살리면서도 현대 한국어 독자가 자연스럽게 읽을 수 있게 하기 위함입니다.
  doctrine_reference: 예언서의 신적 발화와 계시 전달 방식
