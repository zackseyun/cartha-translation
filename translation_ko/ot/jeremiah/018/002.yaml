  rationale: 히브리어의 ‘~의 집’ 구조를 한국어 소유격으로 옮겨 이미지의 구체성을 보존했습니다.
- source_word: אַשְׁמִֽיעֲ/ךָ֥ אֶת דְּבָרָֽ/י
