id: JER.18.16
reference: Jeremiah 18:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/שׂ֥וּם אַרְצָ֛/ם לְ/שַׁמָּ֖ה שרוקת עוֹלָ֑ם כֹּ֚ל עוֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֖ם וְ/יָנִ֥יד בְּ/רֹאשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/016.yaml
  text: making their land a desolation[a], an object of perpetual hissing[b]; everyone who passes by it will be appalled and shake his head.
  footnotes:
  - marker: a
    text: Or 'an everlasting hissing' or 'a perpetual whistling.' The Hebrew image likely refers to the derisive sound made by onlookers at a ruined land.
    reason: lexical_alternative
  - marker: b
    text: '''Shake his head'' renders a Hebrew gesture expressing scorn, astonishment, or dismay at the devastation.'
    reason: cultural_note
translation:
  language: ko
  text: 그들의 땅을 황폐하게 만들어[a], 길이 비웃음거리가 되게 하며[b], 그리로 지나가는 모든 사람은 그 일에 놀라고 자기 머리를 흔들 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘황폐함/황무지’와 함께 조롱의 소리를 가리키는 표현을 붙여, 폐허가 된 땅을 향한 경멸의 이미지를 겹쳐 보여줍니다.
    reason: lexical_alternative
  - marker: b
    text: ‘머리를 흔들다’는 히브리어의 몸짓 관용구로, 놀람·경멸·탄식을 함께 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָשׂוּם
  english_pob_choice: making
  chosen_korean: 만들어
  alternatives_korean:
  - 하게 하여
  - 되게 하며
  lexicon: HALOT
  rationale: 앞 절의 목적/결과를 잇는 부정사 용법으로 이해하여, 한국어에서는 자연스러운 결과 연결형 ‘만들어’로 옮겼습니다.
- source_word: אַרְצָם
  english_pob_choice: their land
  chosen_korean: 그들의 땅
  alternatives_korean:
  - 그들의 나라
  - 그들의 토지
  lexicon: HALOT
  rationale: אַרֶץ는 여기서 심판받는 백성의 소유지를 가리키므로, 가장 직접적인 ‘땅’이 원문의 범위를 잘 살립니다.
- source_word: לְשַׁמָּה שרוקת עוֹלָם
  english_pob_choice: a desolation, an object of perpetual hissing
  chosen_korean: 황폐하게 만들어, 길이 비웃음거리가 되게 하며
  alternatives_korean:
  - 영원한 쉿소리의 대상이 되게 하며
  - 영구한 휘파람거리가 되게 하며
  lexicon: HALOT
  rationale: שַׁמָּה와 שרוקת은 멸망한 땅에 대한 조롱의 이미지이므로, 직역적 음향보다 뜻이 분명한 ‘비웃음거리’로 옮기되 ‘길이’로 עוֹלָם의 지속성을 반영했습니다.
- source_word: וְיָנִיד בְּרֹאשׁוֹ
  english_pob_choice: and shake his head
  chosen_korean: 자기 머리를 흔들 것입니다
  alternatives_korean:
  - 머리를 저을 것입니다
  - 고개를 흔들 것입니다
  lexicon: HALOT
  rationale: 이 관용구는 조롱·경악·탄식의 몸짓이므로, 현대 한국어에서 가장 자연스러운 관용 표현인 ‘머리를 흔들다’로 유지했습니다.
theological_decisions:
- issue: 멸망한 땅에 대한 조롱의 시각적/청각적 이미지
  chosen_reading: ‘비웃음거리’와 ‘머리를 흔들다’로, 폐허를 보는 관찰자의 경멸과 놀라움을 함께 드러냈습니다.
  alternative_readings:
  - ‘쉿소리의 대상’으로 더 음향 이미지를 살리는 번역
  - ‘수군거림의 대상’로 사회적 조롱을 강조하는 번역
  rationale: 히브리어는 단순한 상태 묘사보다 지나가는 이들의 경멸적 반응을 강조하므로, 그 정서를 한국어로 분명하게 전달하는 쪽이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 예레미야서의 심판 선포와 공적 수치를 드러내는 예언적 수사
