  source_fidelity: 히브리어의 핵심 구조인 ‘그들의 땅을 황폐하게 함—길이 조롱의 쉿소리/휘파람의 대상이 되게 함—지나가는 이들이 경악하며 머리를 흔듦’은 대체로 반영했습니다. 그러나 ‘그 일에’는 원문에 없는 대상을 보충하여, 지나가는 이들이 그 땅의 황폐를 보고 보이는 반응이라는 문맥을 흐립니다. 또한 שרוקת의 음향적·조롱적 이미지는 본문에서 ‘비웃음거리’로 다소 일반화되므로 각주에서 명시하는 것이 적절합니다.
