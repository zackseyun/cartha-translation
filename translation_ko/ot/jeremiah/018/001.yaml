lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 서문에서 דָּבָר는 단순한 ‘말’보다 하나님의 계시 내용을 가리키는 공식 표현이므로, 한국어에서는 ‘말씀’이 가장 자연스럽고 신학적 무게도 살립니다.
- source_word: הָיָה אֶל
  english_pob_choice: came to
  chosen_korean: 임한
  alternatives_korean:
  - 다가온
  - 전해진
  lexicon: HALOT
  rationale: ‘word that came to’의 계시 도착 의미를 살려, 단순 전달보다 예언적 임재·도래를 나타내는 ‘임한’을 선택했습니다.
- source_word: יִרְמְיָהוּ
  english_pob_choice: Yirmeyahu
  chosen_korean: 예레미야
  alternatives_korean:
  - 여미야후
  - 예레미야후
  lexicon: standard proper noun
  rationale: 한국어 성경에서 널리 확립된 인명 형태를 사용했습니다. 본문 주석에서는 히브리어 이름형을 따르는 영어 POB의 선택을 확인할 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 사역본의 원칙에 따라 여호와 대신 신명사 본연의 음역인 ‘야훼’를 유지해, 본문이 지닌 고유한 하나님의 이름을 보존했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 처리
  chosen_reading: ‘야훼’로 직접 옮겨, 제목 대체어 ‘주’로 완화하지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 예언의 출처를 명시하는 공식 서문이므로, 하나님의 인격적 이름을 드러내는 것이 문맥상 중요합니다. POB의 영어 본문도 Yahweh를 채택하고 있어 이를 한국어로 일관되게 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
