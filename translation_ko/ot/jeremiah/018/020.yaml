review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 첫 문장은 히브리어의 ‘선에 대하여 악으로 갚다’라는 보응 관계가 한국어에서 반대로 표현되어 있습니다. 또한 לְנַפְשִׁי는 ‘내 생명을 위해’가 아니라 화자의 생명을 겨냥한다는 뜻이므로, ‘내 목숨을 노려’로 옮겨야 합니다. 마지막 목적 표현들은 예레미야의 하나님 앞 중보 행위에 함께 연결되도록 다듬었습니다.
  naturalness: ‘선을 악으로 갚다’와 ‘내 목숨을 노려 구덩이를 팠다’는 현대 표준 한국어 합쇼체에서 자연스럽고 의미가 분명합니다. 하나님께 드리는 기도의 직접 호칭과 존대도 유지했습니다.
  terminology: חֲמָה는 ‘진노’로 유지했고, נֶפֶשׁ는 이 위협 문맥에 맞게 ‘목숨’으로 옮겼습니다. שׁוּחָה는 비유적 함정의 가능성을 과도하게 본문에 삽입하지 않고 ‘구덩이’로 번역했습니다.
  issues:
  - severity: high
    issue: ‘악을 선으로 갚아야 합니까?’는 보응의 대상과 수단을 뒤바꿉니다.
    rationale: 한국어 ‘X를 Y로 갚다’는 X를 Y로 보답한다는 뜻입니다. 따라서 현 초안은 ‘악을 선으로 갚다’가 되어 히브리어 תַּחַת טוֹבָה רָעָה(선에 대한 악)의 의미와 반대가 됩니다.
  - severity: high
    issue: ‘내 생명을 위해 웅덩이를 팠습니다’는 목적·수혜 의미로 읽힙니다.
    rationale: לְנַפְשִׁי는 이 문맥에서 화자의 생명을 노린다는 의미입니다. 한국어에서는 ‘내 목숨을 노려 구덩이를 팠습니다’가 자연스럽고 충실합니다.
  - severity: medium
    issue: 각주 a의 ‘내 목숨을 위해’도 본문의 위협 의미를 충분히 드러내지 못합니다.
    rationale: 대안도 ‘내 목숨을 해치려고’ 또는 ‘나를 해치려고’처럼 적대적 목적을 밝혀야 합니다.
  - severity: low
    issue: ‘그들에 대해 선을 말하며’는 중보를 나타내는 한국어 표현으로 다소 부자연스럽습니다.
    rationale: ‘그들을 위하여 선한 말씀을 드리며’는 하나님 앞에서 그들의 유익을 위해 말한 행위라는 문맥을 자연스럽게 전달합니다.
  revised_text: 선을 악으로 갚아야 합니까? 그들이 내 목숨을 노려[a] 구덩이를 팠습니다. 주님, 제가 그들을 위하여 선한 말씀을 드리고, 그들에게서 당신의 진노를 돌이키려 당신 앞에 서 있었던 것을 기억해 주십시오.
  revised_footnotes:
  - marker: a
    text: 또는 ‘내 생명을 해치려고’ 또는 ‘나를 해치려고’. 여기서 히브리어 נֶפֶשׁ는 위협받는 ‘생명’ 또는 ‘자기 자신’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 유익을 위해 말하며’ 또는 ‘그들에 관해 선하게 말하며’. 이는 예레미야가 하나님 앞에서 그들을 위해 중보한 것을 뜻합니다.
    reason: lexical_alternative
  revision_rationale: 첫 절의 ‘선’과 ‘악’의 문법적 관계를 바로잡고, 생명을 겨냥한 음모라는 לְנַפְשִׁי의 문맥적 의미를 한국어로 명확히 했습니다. 중보와 진노를 돌이키는 목적은 히브리어의 연속된 부정사구에 맞춰 ‘당신 앞에 서 있었던’ 예레미야의 행위로 연결했습니다. 각주 b는 원문의 대안적 표현과 중보 의미를 보존하므로 유지했습니다.
