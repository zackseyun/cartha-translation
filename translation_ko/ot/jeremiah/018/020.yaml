id: JER.18.20
reference: Jeremiah 18:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/יְשֻׁלַּ֤ם תַּֽחַת טוֹבָה֙ רָעָ֔ה כִּֽי כָר֥וּ שׁוּחָ֖ה לְ/נַפְשִׁ֑/י זְכֹ֣ר עָמְדִ֣/י לְ/פָנֶ֗י/ךָ לְ/דַבֵּ֤ר עֲלֵי/הֶם֙ טוֹבָ֔ה לְ/הָשִׁ֥יב אֶת חֲמָתְ/ךָ֖ מֵ/הֶֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/020.yaml
  text: Should evil be repaid for good? For they have dug a pit for my life[a]. Remember that I stood before you to speak good on their behalf[b], to turn your wrath away from them.
  footnotes:
  - marker: a
    text: Or 'for my soul.' Here the Hebrew word often means 'life' or 'self' in contexts of mortal danger.
    reason: lexical_alternative
  - marker: b
    text: Or 'to speak for their good' or 'to speak well concerning them.' The sense is Jeremiah's intercession on their behalf before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 악을 선으로 갚아야 합니까? 그들은 내 생명을 위해[a] 웅덩이를 팠습니다. 주님, 제가 그들에 대해 선을 말하며[b] 당신 앞에 서 있었던 것을 기억해 주십시오. 그들에게서 당신의 진노를 돌이키려 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 목숨을 위해’. 여기서 히브리어 נֶפֶשׁ는 종종 위기에 놓인 ‘생명’이나 ‘자기 자신’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 유익을 위해 말하며’ 혹은 ‘그들에 관해 선하게 말하며’. 뜻은 예레미야가 하나님 앞에서 그들을 위해 중보했다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְשֻׁלַּם ... תַּחַת טוֹבָה רָעָה
  english_pob_choice: Should evil be repaid for good?
  chosen_korean: 악을 선으로 갚아야 합니까?
  alternatives_korean:
  - 악이 선에 대해 갚아져야 합니까?
  - 선에 대해 악으로 갚아야 합니까?
  lexicon: HALOT
  rationale: 수동적 ‘갚다’로 보상의 역전을 살리되, 한국어에서는 자연스럽게 ‘악을 선으로 갚다’로 옮겨 히브리어의 보복 대칭을 드러냈습니다.
- source_word: כָּר֥וּ שׁוּחָ֖ה
  english_pob_choice: they have dug a pit
  chosen_korean: 웅덩이를 팠습니다
  alternatives_korean:
  - 구덩이를 팠습니다
  - 함정을 팠습니다
  lexicon: HALOT
  rationale: 문맥상 생명을 노린 함정의 뉘앙스가 있으나, 본문이 직접 말하는 것은 ‘pit’이므로 기본어를 살리되 한국어에서는 ‘웅덩이’보다 ‘구덩이’가 더 직접적이지만, 판본의 어조를 고려해 통상적인 ‘팠습니다’ 구조를 유지했습니다.
- source_word: לְנַפְשִׁי
  english_pob_choice: for my life
  chosen_korean: 내 생명을 위해
  alternatives_korean:
  - 내 영혼을 위해
  - 나를 해치려고
  lexicon: HALOT
  rationale: נֶפֶשׁ를 여기서 영혼으로 옮기면 비물질적 대비가 생기므로, 목숨이 위협받는 상황에 맞게 ‘생명’으로 옮겼습니다.
- source_word: לְדַבֵּר עֲלֵיהֶם טוֹבָה
  english_pob_choice: to speak good on their behalf
  chosen_korean: 제가 그들에 대해 선을 말하며
  alternatives_korean:
  - 그들을 위해 선한 말을 하며
  - 그들에게 유익하게 말하며
  lexicon: HALOT
  rationale: 직역하면 ‘그들 위에/대하여 선을 말하다’이므로, 중재적 의미를 살리면서도 한국어에서 어색하지 않게 ‘그들에 대해 선을 말하다’로 처리했습니다.
theological_decisions:
- issue: 하나님의 진노(חֲמָה)와 중보의 방향
  chosen_reading: ‘당신의 진노를 돌이키려 했습니다’로 하나님의 न्याय적 진노를 분명히 유지했습니다.
  alternative_readings:
  - ‘분노를 거두려 했습니다’
  - ‘진노를 멈추게 하려 했습니다’
  rationale: 본문은 예레미야의 중보가 하나님의 화를 백성에게서 돌이키려는 것이므로, ‘진노’가 감정 일반보다 사법적 성격을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §6
- issue: 직접 호칭의 높임말
  chosen_reading: 하나님께 드리는 간청은 ‘주님, ... 기억해 주십시오’로 높임말을 사용했습니다.
  alternative_readings:
  - ‘야훼, ... 기억하십시오’
  - ‘주님, ... 기억하소서’
  rationale: 본문의 기도문 어조를 현대 한국어 합쇼체로 살리되, 직접 호칭에서는 존대형을 유지해 기도체를 자연스럽게 반영했습니다.
  doctrine_reference: Korean target style
