  verdict: revise
  source_fidelity: 야훼 및 ‘만군의 하나님, 이스라엘의 하나님’의 호칭은 원문과 POB의 명명 원칙을 충실히 반영합니다. 다만 לָכֶם שְׁאֵרִית은 ‘너희에게 남은 자’로 옮겨야 자연스럽고, ‘너희에게서 남은 자’는 남은 자의 출처를 뜻하는 듯하여 원문의 ‘너희에게 남아 있을 남은 자’를 다소 흐립니다. 각주에 있는 ‘이 큰 악’의 ‘이’도 히브리어 본문에는 명시되어 있지 않습니다.
