  terminology: ‘야훼’, ‘만군의 하나님’, ‘남은 자’는 일관되고 적절합니다. רָעָה의 도덕적 악과 자기파괴적 해악이라는 중첩된 함의는 본문의 ‘큰 악’과 각주 설명으로 보존할 수 있습니다. עוֹלֵל은 단순한 ‘아이’보다 ‘어린아이’가 작은 아이의 뜻을 조금 더 잘 드러냅니다.
