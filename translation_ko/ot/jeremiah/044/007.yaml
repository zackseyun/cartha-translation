  text: וְ/עַתָּ֡ה כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָ/מָה֩ אַתֶּ֨ם עֹשִׂ֜ים רָעָ֤ה גְדוֹלָה֙ אֶל נַפְשֹׁ֣תֵ/כֶ֔ם לְ/הַכְרִ֨ית לָ/כֶ֧ם אִישׁ וְ/אִשָּׁ֛ה עוֹלֵ֥ל וְ/יוֹנֵ֖ק מִ/תּ֣וֹךְ יְהוּדָ֑ה לְ/בִלְתִּ֛י הוֹתִ֥יר לָ/כֶ֖ם שְׁאֵרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/007.yaml
  text: 'And now[a], thus says Yahweh, the God of hosts, the God of Israel: Why are you doing this great evil against yourselves, to cut off from among Judah man and woman, child and infant, leaving yourselves no remnant?'
  footnotes:
  - marker: a
    text: Or 'are you doing this great evil to yourselves?' The Hebrew רָעָה can mean either moral evil or harmful disaster; both ideas are closely related here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 야훼, 만군의 하나님, 이스라엘의 하나님께서 이렇게 말씀하십니다. “너희가 왜 너희 자신에게 큰 악을 행하여 유다 가운데에서 남자와 여자, 어린아이와 젖먹이를 끊어 버리고, 너희에게 남은 자가 없게 하느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희가 왜 너희 자신에게 큰 악을 행하느냐?’라고도 옮길 수 있습니다. 히브리어 רָעָה는 여기서 도덕적 악 또는 해악을 뜻할 수 있으며, 두 의미가 함께 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 제목이 아니라 고유명으로 처리해야 하므로, POB의 원칙에 따라 한국어에서도 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵי צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of hosts, the God of Israel
  chosen_korean: 만군의 하나님, 이스라엘의 하나님
  alternatives_korean:
  - 군대들의 하나님, 이스라엘의 하나님
  - 하늘 군대의 하나님, 이스라엘의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת는 통상 ‘만군’으로 옮겨 온 호칭의 격과 수사적 무게를 살리고, 이어지는 ‘이스라엘의 하나님’과 병렬 관계를 유지했습니다.
- source_word: רָעָה גְדוֹלָה אֶל נַפְשֹׁתֵיכֶם
  english_pob_choice: this great evil against yourselves
  chosen_korean: 스스로에게 큰 악을 행하여
  alternatives_korean:
  - 자기 자신들에게 큰 해를 끼쳐
  - 스스로에게 큰 재앙을 불러와
  lexicon: HALOT
  rationale: רָעָה는 문맥상 도덕적 악과 자해적 해악을 함께 띠므로, POB의 긴장을 살려 ‘큰 악’으로 두되 한국어에서는 ‘스스로에게’로 반사성을 분명히 했습니다.
- source_word: עוֹלֵל וְיוֹנֵק
  english_pob_choice: child and infant
  chosen_korean: 아이와 젖먹이
  alternatives_korean:
  - 어린아이와 젖먹는 아이
  - 어린이와 유아
  lexicon: HALOT
  rationale: 두 단계의 연령대를 자연스러운 현대 한국어로 전달하되, 유아보다 더 직접적인 ‘젖먹이’를 써 יוֹנֵק의 ‘젖먹는 자’라는 뜻을 반영했습니다.
- source_word: שְׁאֵרִית
  english_pob_choice: remnant
  chosen_korean: 남은 자
  alternatives_korean:
  - 남은 무리
  - 잔존자
  lexicon: HALOT
  rationale: 예언서의 신학적 울림을 위해서는 ‘남은 자’보다 ‘남은 자가 없게’라는 표현이 자연스럽고도 핵심 의미를 보존하므로, 여기서는 결과절 안에서 한국어로 풀어 옮겼습니다.
theological_decisions:
- issue: 재난과 죄책이 함께 걸린 רָעָה의 처리
  chosen_reading: ‘큰 악’으로 옮겨 행위의 죄책을 보존하면서, 반사 대명사로 자기파괴적 결과를 드러냈습니다.
  alternative_readings:
  - ‘큰 해악’으로 중립화
  - ‘큰 재앙’으로 결과 중심화
  rationale: 문맥은 단순한 불행 진술이 아니라 자기 자신에게 행하는 죄된 행위를 고발합니다. 따라서 도덕적 차원을 지우지 않되, 본문이 암시하는 자해적 결과도 함께 보이게 했습니다.
  doctrine_reference: Preserve lexical/theological tension rather than resolve it.
