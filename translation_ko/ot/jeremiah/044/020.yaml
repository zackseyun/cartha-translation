id: JER.44.20
reference: Jeremiah 44:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ אֶל כָּל הָ/עָ֑ם עַל הַ/גְּבָרִ֤ים וְ/עַל הַ/נָּשִׁים֙ וְ/עַל כָּל הָ/עָ֔ם הָ/עֹנִ֥ים אֹת֛/וֹ דָּבָ֖ר לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/020.yaml
  text: Then Jeremiah said to all the people—to the men[a], to the women, and to all the people who were answering him, saying,
  footnotes:
  - marker: a
    text: Or 'who answered him a word' / 'who responded to him.' The Hebrew is compact and may be rendered more idiomatically as 'who answered him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예레미야가 모든 백성에게 말했습니다. 곧 남자들에게, 여자들에게, 그리고 그에게 대답하고 있는 모든 백성에게 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 축약적으로 ‘그에게 한 말을 하며 응답하던 사람들’ 정도를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그리하여 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 자연스러운 순서 표현으로 살렸습니다.
- source_word: אֶל כָּל הָעָם
  english_pob_choice: to all the people
  chosen_korean: 모든 백성에게
  alternatives_korean:
  - 온 백성에게
  - 모든 사람들에게
  lexicon: HALOT
  rationale: עָם의 집합적 의미를 반영해 '백성'으로 옮기고, אֶל은 '-에게'로 직역했습니다.
- source_word: עַל הַגְּבָרִים וְעַל הַנָּשִׁים וְעַל כָּל הָעָם
  english_pob_choice: to the men, to the women, and to all the people
  chosen_korean: 곧 남자들에게, 여자들에게, 그리고 ... 모든 백성에게
  alternatives_korean:
  - 남자들에게, 여자들에게, 그리고 온 백성에게
  - 남성들에게, 여성들에게, 그리고 모든 백성에게
  lexicon: HALOT
  rationale: 히브리어의 반복 구조를 살리되, 한국어에서는 '곧'으로 풀어 열거를 자연스럽게 연결했습니다.
- source_word: הָעֹנִים אֹתוֹ דָּבָר
  english_pob_choice: who were answering him, saying
  chosen_korean: 그에게 대답하고 있는
  alternatives_korean:
  - 그에게 응답하고 있는
  - 그에게 한 마디 대답하고 있는
  lexicon: HALOT
  rationale: 분사 עֹנִים의 진행 중인 상태를 '대답하고 있는'으로 살렸고, דָּבָר는 한국어에서 따로 드러내지 않아도 관용적으로 전달됩니다.
theological_decisions:
- issue: 대상 열거의 반복(남자들/여자들/모든 백성)
  chosen_reading: 문자적 반복 구조를 유지해 예레미야의 발화 대상이 점층적으로 넓어지는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 대상만 간단히 '모든 백성에게'로 묶는 읽기
  - '''남녀를 포함한 모든 백성에게''로 통합하는 읽기'
  rationale: 본문은 같은 대상을 단순 중복이 아니라 수사적으로 강조합니다. 이를 평준화하면 히브리어의 압력을 약화시킬 수 있습니다.
  doctrine_reference: 본문 수사 구조 보존 원칙
- issue: וְעַל의 한국어 처리
  chosen_reading: '''곧''을 넣어 설명적 병렬을 자연스럽게 연결했습니다.'
  alternative_readings:
  - 모두 '-에게'로만 반복하는 읽기
  - '''대하여''로 번역하는 읽기'
  rationale: 이 절의 עַל은 '대하여/에 관하여'보다 청중 목록을 풀어주는 표지에 가깝기 때문에, 한국어 가독성을 위해 설명적 연결어를 사용했습니다.
  doctrine_reference: 문맥 기반 구문 처리
