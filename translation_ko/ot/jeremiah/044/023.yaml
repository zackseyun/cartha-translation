id: JER.44.23
reference: Jeremiah 44:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/פְּנֵי֩ אֲשֶׁ֨ר קִטַּרְתֶּ֜ם וַ/אֲשֶׁ֧ר חֲטָאתֶ֣ם לַ/יהוָ֗ה וְ/לֹ֤א שְׁמַעְתֶּם֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/בְ/תֹרָת֧/וֹ וּ/בְ/חֻקֹּתָ֛י/ו וּ/בְ/עֵדְוֺתָ֖י/ו לֹ֣א הֲלַכְתֶּ֑ם עַל כֵּ֞ן קָרָ֥את אֶתְ/כֶ֛ם הָ/רָעָ֥ה הַ/זֹּ֖את כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/023.yaml
  text: Because you burned incense and sinned against Yahweh[a], and did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies, therefore this disaster has come upon you[d][c][b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'you offered incense.' The Hebrew verb refers to making sacrificial smoke/incense offerings.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not obey the LORD.' Literally, 'did not listen to the voice of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: '''Law'' may also be rendered ''instruction'' (Hebrew torah).'
    reason: lexical_alternative
  - marker: d
    text: Or 'this calamity has befallen you.' The Hebrew word can mean 'evil' or, in contexts like this, 'disaster/calamity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 분향하고[a] 야훼께 죄를 지었으며, 야훼의 목소리를 듣지 않고[b] 그의 율법[c]과 규례와 증거를 따라 살지 않았으므로, 이 재앙[d]이 오늘과 같이 너희에게 임했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분향을 드리다’로 옮길 수 있습니다. 히브리어 동사는 제의적 향 연기, 곧 분향 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 목소리에 순종하지 않고’로 옮길 수 있습니다. 직역하면 ‘야훼의 목소리를 듣지 않고’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘율법’은 문맥에 따라 ‘가르침’으로도 옮길 수 있습니다(히브리어 torah).
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘이 재난이 너희에게 닥쳤습니다’로 옮길 수 있습니다. 히브리어 단어는 문맥상 도덕적 악이 아니라 ‘재앙’ 또는 ‘재난’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִטַּרְתֶּם
  english_pob_choice: you burned incense
  chosen_korean: 분향하고
  alternatives_korean:
  - 향을 피우고
  - 향을 바치고
  lexicon: HALOT
  rationale: 제의적 제사를 가리키는 동사로서, 본문의 우상 숭배 맥락에서는 ‘분향하다’가 가장 직접적이고 성경적 용례도 잘 살립니다.
- source_word: חֲטָאתֶם לַיהוָה
  english_pob_choice: sinned against Yahweh
  chosen_korean: 야훼께 죄를 지었으며
  alternatives_korean:
  - 야훼께 범죄했으며
  - 야훼를 거슬러 죄를 지었으며
  lexicon: HALOT
  rationale: לְ와 결합한 חטא의 관계를 한국어로 자연스럽게 옮기면서도, 고유명사 יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 유지했습니다.
- source_word: שְׁמַעְתֶּם בְּקוֹל יְהוָה
  english_pob_choice: did not listen to the voice of Yahweh
  chosen_korean: 야훼의 목소리를 듣지 않고
  alternatives_korean:
  - 야훼의 목소리에 귀 기울이지 않고
  - 야훼께 순종하지 않고
  lexicon: HALOT
  rationale: 히브리어 관용구를 따라 ‘목소리’를 보존했습니다. ‘순종하다’는 뜻은 가능하지만 해석을 덜어낸 직접 표현이 원문에 더 가깝습니다.
- source_word: וּבְתוֹרָתוֹ וּבְחֻקֹּתָיו וּבְעֵדְוֹתָיו
  english_pob_choice: his law, his statutes, and his testimonies
  chosen_korean: 그의 율법과 그의 규례들과 그의 증거들을
  alternatives_korean:
  - 그의 율법과 그의 법도들과 그의 증거들을
  - 그의 가르침과 그의 규례들과 그의 증언들을
  lexicon: HALOT
  rationale: תּוֹרָה는 본문의 언약적·법적 맥락에서 ‘율법’이 가장 압축적입니다. חֻקִּים과 עֵדוֹת은 서로 다른 어휘 구분을 살리기 위해 ‘규례들’, ‘증거들’로 나누었습니다.
- source_word: לֹא הֲלַכְתֶּם
  english_pob_choice: did not...walk in
  chosen_korean: 따라 걷지 않았기
  alternatives_korean:
  - 행하지 않았기
  - 그 길로 행하지 않았기
  lexicon: HALOT
  rationale: בְּ와 함께 쓰인 הלך의 비유적 표현을 살리되, 한국어에서는 ‘따라 걷다’가 가장 자연스럽게 관계적·윤리적 삶의 지속성을 드러냅니다.
- source_word: קָרָאת אֶתְכֶם הָרָעָה הַזֹּאת
  english_pob_choice: this disaster has come upon you
  chosen_korean: 이 재앙이 오늘과 같이 너희에게 임했습니다
  alternatives_korean:
  - 이 재난이 너희에게 닥쳤습니다
  - 이 재앙이 너희에게 내려왔습니다
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 ‘악’이 아니라 심판으로서의 재앙/재난을 뜻하므로 ‘재앙’으로 옮겼습니다. ‘임하다’는 동사의 사건성을 잘 살립니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 여호와/주님이 아닌 성호 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 마지막 절의 현재적 결과 표현
  chosen_reading: 오늘과 같이
  alternative_readings:
  - 이 날과 같이
  - 오늘까지
  rationale: כַּיּוֹם הַזֶּה는 단순한 시간표시가 아니라 심판의 결과가 현재 눈앞에 드러나 있음을 가리키므로, ‘오늘과 같이’로 현재성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source sense without importing doctrinal claims'
