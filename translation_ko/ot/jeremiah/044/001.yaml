reference: Jeremiah 44:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ אֶ֚ל כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הַ/יֹּשְׁבִ֤ים בְּ/מִגְדֹּל֙ וּ/בְ/תַחְפַּנְחֵ֣ס וּ/בְ/נֹ֔ף וּ/בְ/אֶ֥רֶץ פַּתְר֖וֹס לֵ/אמֹֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/001.yaml
  text: The word that came to Jeremiah concerning all the Judeans living in the land of Egypt[a], those living in Migdol and in Tahpanhes and in Noph and in the land of Pathros, saying,
  footnotes:
  - marker: a
    text: Noph is the Hebrew name for the Egyptian city more commonly known as Memphis.
    reason: cross_reference
translation:
  language: ko
  text: 이집트 땅에 사는 모든 유다 사람들, 곧 믹돌과 다합네스와 놉과 바드로스 땅에 사는 사람들에 관하여 예레미야에게 임한 말씀입니다. 말씀하시기를,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 놉은 히브리어 지명이며, 일반적으로 이집트의 도시 멤피스로 알려져 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언서 서두의 관용구로서 דבר는 단순한 ‘말’보다 계시적 성격의 ‘말씀’이 자연스럽고, 본문의 공식적 예언 도입문을 살립니다.
- source_word: הָיָה אֶל
  english_pob_choice: came to
  chosen_korean: 임한
  alternatives_korean:
  - 온
  - 전해진
  lexicon: HALOT
  rationale: ‘예언자에게 임한 말씀’은 히브리어의 הגיע/היה אל 관용을 한국어 예언체로 옮긴 것으로, 발화의 기원을 하나님 쪽에 두는 의미를 드러냅니다.
- source_word: הַיְּהוּדִים
  english_pob_choice: the Judeans
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: HALOT
  rationale: 예레미야 문맥에서 민족·지역적 출신을 가리키는 표현이므로, 후대 종교집단명처럼 들리는 ‘유대인들’보다 ‘유다 사람들’이 더 직접적입니다.
- source_word: נֹף
  english_pob_choice: Noph
  chosen_korean: 놉
  alternatives_korean:
  - 멤피스
  lexicon: HALOT
  rationale: 본문의 히브리어 지명 형태를 살리기 위해 음역을 유지했습니다. POB의 각주처럼 이곳은 일반적으로 멤피스로 알려진 도시입니다.
- source_word: אֶרֶץ פַּתְרוֹס
  english_pob_choice: the land of Pathros
  chosen_korean: 바드로스 땅
  alternatives_korean:
  - 파드로스 땅
  - 바드로스 지방
  lexicon: HALOT
  rationale: ‘땅’에 해당하는 אֶרֶץ를 살리면서, 고유지명은 한국어 음역으로 옮겼습니다. 지명 음역은 통일된 외래어 표기보다 성경 관용형을 우선했습니다.
theological_decisions:
- issue: 예언 서두의 수동적 표현이 누가 말씀을 보냈는지 드러내는 방식
  chosen_reading: ‘예레미야에게 임한 말씀’으로 옮겨, 말씀의 기원이 하나님께 있음을 암시했습니다.
  alternative_readings:
  - ‘예레미야에게 온 말’
  - ‘예레미야에게 주어진 말씀’
  rationale: 히브리어 예언 서두의 공식성은 단순 전달보다 신적 계시의 도래를 강조합니다. 합쇼체에서도 이 신학적 뉘앙스를 유지하는 것이 중요합니다.
  doctrine_reference: 예언/계시의 기원
- issue: לֵאמֹר의 처리
  chosen_reading: 본문 말미의 ‘내린 것이니라’는 다음 절로 이어지는 발화 도입을 한국어 문맥상 자연스럽게 붙였습니다.
  alternative_readings:
  - ‘말하여 이르시되’
  - ‘이르러 말씀하시기를’
  rationale: 히브리어의 לֵאמֹר는 다음 절의 직접화법 도입과 연결되므로, 한국어에서도 문장 종결을 완전히 닫기보다 다음 절로 이어질 준비를 보여 주는 방식이 적절합니다.
  doctrine_reference: 문장 경계/직접화법 처리
