id: JER.44.8
reference: Jeremiah 44:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/הַכְעִסֵ֨/נִי֙ בְּ/מַעֲשֵׂ֣י יְדֵי/כֶ֔ם לְ/קַטֵּ֞ר לֵ/אלֹהִ֤ים אֲחֵרִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם אֲשֶׁר אַתֶּ֥ם בָּאִ֖ים לָ/ג֣וּר שָׁ֑ם לְמַ֨עַן֙ הַכְרִ֣ית לָ/כֶ֔ם וּ/לְמַ֤עַן הֱיֽוֹתְ/כֶם֙ לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
  footnotes:
  - marker: a
    text: Or 'where you are going to sojourn'; the Hebrew verb can emphasize residing as a foreigner.
    reason: lexical_alternative
  - marker: b
    text: Or 'so that you may destroy yourselves' or, by implication in context, 'so that you may be cut off.'
    reason: alternative_reading
  - marker: c
    text: '''A curse'' may also mean ''an object of cursing,'' that is, a people invoked in curse formulas.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 손의 행위로 나를 격노하게 하며, 이집트 땅에서 다른 신들에게 향을 피우며, 너희가 거기에 거류하러 들어가고 있는 곳에서, 스스로를 끊어 버리게 하려고 하며, 너희가 온 땅의 모든 민족들 가운데서 저주와 치욕이 되게 하려고 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 거류하러 들어가고 있는 곳’; 히브리어 동사는 타지에서 머무는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저주’는 ‘저주받는 대상’, 곧 저주 공식에서 불리는 사람들을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘향을 피우다’는 제의적 ‘분향’의 자연스러운 현대어 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: לְהַכְעִסֵנִי
  english_pob_choice: provoking me to anger
  chosen_korean: 나를 격노하게 하며
  alternatives_korean:
  - 나를 화나게 하며
  - 나를 노하게 하며
  lexicon: HALOT
  rationale: 히필형의 원인적 강도를 살리면서, 문맥의 심판 선언에 어울리는 ‘격노하게 하다’로 옮겼습니다.
- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  english_pob_choice: by the works of your hands
  chosen_korean: 너희 손의 행위로
  alternatives_korean:
  - 너희 손으로 만든 것들로
  - 너희 손으로 한 일로
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리되, 우상 제작과 제의 행위를 모두 포괄할 수 있게 했습니다.
- source_word: לְקַטֵּר לֵאלֹהִים אֲחֵרִים
  english_pob_choice: by burning incense to other gods
  chosen_korean: 다른 신들에게 향을 피우며
  alternatives_korean:
  - 다른 신들에게 분향하며
  - 다른 신들에게 향을 올리며
  lexicon: HALOT
  rationale: 제의적 ‘분향’의 의미를 살리면서도 현대 한국어에서 이해가 쉬운 ‘향을 피우다’로 옮겼습니다.
- source_word: לְמַעַן הַכְרִית לָכֶם
  english_pob_choice: so that you may cut yourselves off
  chosen_korean: 스스로를 끊어 버리게 하려고 하며
  alternatives_korean:
  - 너희가 스스로 끊어지게 하려고 하며
  - 너희를 끊어 버리게 하려고 하며
  lexicon: HALOT
  rationale: 주어진 구조가 명시적으로 새 주어를 말하지 않으므로, POB의 반사적/결과적 독해를 따라 자책적 결과를 드러냈습니다.
- source_word: לִקְלָלָה וּלְחֶרְפָּה
  english_pob_choice: a curse and a reproach
  chosen_korean: 저주와 치욕
  alternatives_korean:
  - 저주와 수치
  - 저주와 모욕
  lexicon: HALOT
  rationale: ‘חרפה’의 공적 수치·수모 뉘앙스를 살리기 위해 ‘치욕’을 택했습니다.
theological_decisions:
- issue: לְמַעַן הַכְרִית לָכֶם의 행위 주체
  chosen_reading: 직접적인 새 주어를 보태지 않고, 그들의 행위가 불러오는 자기 파멸적 결과를 드러내는 반사적 표현으로 옮겼습니다.
  alternative_readings:
  - ‘하나님이 너희를 끊어 버리게 하려고’
  - ‘너희가 끊어지게 하려고’
  rationale: 히브리어는 이 절에서 새 주어를 명시하지 않으므로, 본문이 드러내는 책임과 결과를 가장 덜 개입적으로 반영했습니다.
  doctrine_reference: 문맥상 심판은 하나님께 속하지만, 이 구절의 문법적 초점은 그들의 행위가 낳는 결과입니다.
