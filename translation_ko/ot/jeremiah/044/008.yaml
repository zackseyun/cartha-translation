base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
  footnotes:
  - marker: a
    text: Or 'where you are going to sojourn'; the Hebrew verb can emphasize residing as a foreigner.
    reason: lexical_alternative
  - marker: b
    text: Or 'so that you may destroy yourselves' or, by implication in context, 'so that you may be cut off.'
    reason: alternative_reading
  - marker: c
    text: '''A curse'' may also mean ''an object of cursing,'' that is, a people invoked in curse formulas.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 그곳에 거류하려고 들어가는 이집트 땅에서 다른 신들에게 분향하여 너희 손으로 한 일들로 나를 격노하게 하고, 너희 자신을 끊어 버리며, 땅의 모든 민족 가운데 저주와 치욕거리가 되려고 하느냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에 타국인으로 머물려고’. 히브리어 동사는 타지에서 거주하는 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저주’는 ‘저주의 대상’, 곧 저주 공식에서 언급되는 대상을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַכְעִסֵנִי
  english_pob_choice: provoking me to anger
  chosen_korean: 나를 격노하게 하며
  alternatives_korean:
  - 나를 화나게 하며
  - 나를 노하게 하며
  lexicon: HALOT
  rationale: 히필형의 원인적 강도를 살리면서, 문맥의 심판 선언에 어울리는 ‘격노하게 하다’로 옮겼습니다.
- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  english_pob_choice: by the works of your hands
  chosen_korean: 너희 손의 행위로
  alternatives_korean:
  - 너희 손으로 만든 것들로
