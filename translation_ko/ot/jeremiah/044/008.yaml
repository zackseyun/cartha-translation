    rationale: 44:8의 부정사 연쇄는 앞 절의 ‘어찌하여’에 이어지는 수사 의문입니다. 단독 절의 종결을 위해 평서형 ‘합니다’보다 ‘하느냐?’가 원문 문맥에 충실합니다.
