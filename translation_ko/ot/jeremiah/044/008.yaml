revisions:
- from: 너희 손의 행위로 나를 격노하게 하며, 이집트 땅에서 다른 신들에게 향을 피우며, 너희가 거기에 거류하러 들어가고 있는 곳에서, 스스로를 끊어 버리게 하려고 하며, 너희가 온 땅의 모든 민족들 가운데서 저주와 치욕이 되게 하려고 합니다.[a][b][c]
  to: 너희가 그곳에 거류하려고 들어가는 이집트 땅에서 다른 신들에게 분향하여 너희 손으로 한 일들로 나를 격노하게 하고, 너희 자신을 끊어 버리며, 땅의 모든 민족 가운데 저주와 치욕거리가 되려고 하느냐?[a][b]
  rationale: 관계절을 ‘이집트 땅’에 자연스럽게 연결하고, 원문의 분향 행위와 ‘손으로 한 일들’을 유지했습니다. לְמַעַן הַכְרִית לָכֶם는 명시되지 않은 신적 주체를 보태지 않는 영어 POB의 반사적·결과적 독해를 따라 ‘너희 자신을 끊어 버리며’로 옮겼습니다. 본 절이 전절의 수사 의문에 종속되는 점을 한국어 종결형에 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:27:42Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 לָגוּר는 단순한 ‘들어가고 있다’보다 ‘거류하다/타국인으로 머물다’의 뜻을 지니며, לְמַעַן 이하의 목적·결과 구조도 한국어에서 분명히 드러날 필요가 있습니다. 현 초안의 ‘곳에서’는 관계절을 잘못 연결하고, ‘스스로를 끊어 버리게 하려고’는 주체와 문장 구조가 부자연스럽습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 재구성했습니다. ‘손의 행위’는 한국어 관용에 맞게 ‘손으로 한 일들’로, 제의 행위는 ‘분향하다’로 옮겼습니다. 본 절의 히브리어 부정사는 앞 절에서 이어지는 수사 의문의 일부이므로, 한국어에서도 의문형으로 처리하는 것이 자연스럽습니다.
  terminology: ‘다른 신들’, ‘분향하다’, ‘거류하다’, ‘저주와 치욕거리’는 원문의 제의적·심판적 어휘를 과도하게 해석하지 않으면서 자연스럽게 전달합니다. לִקְלָלָה는 ‘저주’와 ‘저주의 대상’ 양쪽 의미 가능성이 있으므로 각주로 보존했습니다.
  issues:
  - severity: high
    issue: 관계절과 장소 표현의 연결 오류
    rationale: ‘이집트 땅에서 ... 너희가 거기에 거류하러 들어가고 있는 곳에서’는 같은 장소를 중복하고 관계절이 문법적으로 부자연스럽습니다. אֲשֶׁר אַתֶּם בָּאִים לָגוּר שָׁם은 ‘너희가 그곳에 거류하려고 들어가는 이집트 땅에서’로 연결되어야 합니다.
  - severity: high
    issue: 목적·결과 구문의 부정확하고 어색한 번역
    rationale: ‘스스로를 끊어 버리게 하려고 하며’는 한국어에서 비문에 가깝고, 히브리어의 반사적/자기 파멸적 결과를 명료하게 전달하지 못합니다. ‘너희 자신을 끊어 버리고’로 문맥상 목적·결과를 자연스럽게 반영할 수 있습니다.
