base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
  footnotes:
  - marker: a
    text: Hebrew literally 'his wives'; the singular suffix likely functions collectively after 'the kings of Judah,' hence 'their wives.'
    reason: lexical_alternative
  - marker: b
    text: Or 'evils' / 'evil things'; the translation renders the term as 'evil deeds' because the verse speaks of acts 'which they did.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 조상들의 악행, 유다 왕들의 악행, 그들의 아내들[a]의 악행, 너희 자신의 악행, 너희 아내들의 악행[b], 곧 그들이 유다 땅과 예루살렘 거리에서 저지른 악행을 잊었습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 아내들’입니다. 그러나 앞의 ‘유다 왕들’을 따라 집합적 또는 분배적으로 이해하여 ‘그들의 아내들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악들’ 또는 ‘악한 일들’로도 옮길 수 있습니다. 그러나 뒤에서 그것들을 ‘저질렀다’고 하므로, 행위성을 드러내기 위해 ‘악행’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
