  lexicon: HALOT
  rationale: עשה의 기본 의미를 살리면서도 뒤의 지리적 장소 구절과 자연스럽게 이어지도록 '행한 일'로 옮겼습니다.
- source_word: בְּאֶרֶץ יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
