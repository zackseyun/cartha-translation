  text: הַֽ/שְׁכַחְתֶּם֩ אֶת רָע֨וֹת אֲבוֹתֵי/כֶ֜ם וְ/אֶת רָע֣וֹת מַלְכֵ֣י יְהוּדָ֗ה וְ/אֵת֙ רָע֣וֹת נָשָׁ֔י/ו וְ/אֵת֙ רָעֹ֣תֵ/כֶ֔ם וְ/אֵ֖ת רָעֹ֣ת נְשֵׁי/כֶ֑ם אֲשֶׁ֤ר עָשׂוּ֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
  footnotes:
  - marker: a
    text: Hebrew literally 'his wives'; the singular suffix likely functions collectively after 'the kings of Judah,' hence 'their wives.'
    reason: lexical_alternative
  - marker: b
    text: Or 'evils' / 'evil things'; the translation renders the term as 'evil deeds' because the verse speaks of acts 'which they did.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 너희 조상들의 악행과 유다 왕들의 악행과 그들의 아내들의 악행과 너희 자신의 악행과 너희 아내들의 악행을 잊었느냐? 그것은 그들이 유다 땅과 예루살렘 거리들에서 행한 일입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '그의 아내들'이지만, 앞의 '유다 왕들'에 따라 집합적으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: '''악들''로도 옮길 수 있으나, 여기서는 뒤의 ''행한''에 맞추어 행위성을 드러내는 ''악행''으로 옮겼습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכַחְתֶּם
  english_pob_choice: Have you forgotten
  chosen_korean: 너희가 ... 잊었느냐
  alternatives_korean:
  - 너희가 ... 잊었습니까
  - 너희는 ... 잊어버렸습니까
  lexicon: HALOT
  rationale: 수사적 책망의 질문으로서 과거를 지적하면서 현재의 도덕적 책임을 묻는 기능을 살리기 위해 과거완료형보다 단순 과거의 반문을 택했습니다.
- source_word: רָעוֹת
  english_pob_choice: evil deeds
  chosen_korean: 악행
  alternatives_korean:
  - 악한 일들
  - 악들
  - 악한 행동들
  lexicon: HALOT
  rationale: 문맥상 추상적 악이 아니라 실제로 저지른 행위들을 가리키므로, 행위성을 분명히 하는 '악행'이 가장 직접적입니다.
- source_word: נָשָׁיו / נְשֵׁיכֶם
  english_pob_choice: their wives / your wives
  chosen_korean: 그들의 아내들 / 너희 아내들
  alternatives_korean:
  - 그의 아내들 / 너희의 아내들
  lexicon: HALOT
  rationale: 영어 POB의 설명처럼 앞의 복수 주어에 따라 'their wives'로 이해되는 집합적 용법을 한국어에서도 자연스럽게 반영했습니다.
- source_word: אֲשֶׁר עָשׂוּ
  english_pob_choice: which they did
  chosen_korean: 그것은 ... 행한 일입니다
  alternatives_korean:
  - 그들이 ... 한 것입니다
  - 그들이 ... 저지른 것입니다
  lexicon: HALOT
  rationale: עשה의 기본 의미를 살리면서도 뒤의 지리적 장소 구절과 자연스럽게 이어지도록 '행한 일'로 옮겼습니다.
- source_word: בְּאֶרֶץ יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  english_pob_choice: in the land of Judah and in the streets of Jerusalem
  chosen_korean: 유다 땅과 예루살렘 거리들에서
  alternatives_korean:
  - 유다 땅과 예루살렘의 거리들에서
  - 유다 땅과 예루살렘의 거리에서
  lexicon: HALOT
  rationale: אֶרֶץ는 '땅'으로, חֻצוֹת는 도시의 공적 공간을 가리키므로 '거리들'로 옮겨 공개적이고 도시적인 범위를 드러냈습니다.
theological_decisions:
- issue: 형식상 수사 질문의 강도
  chosen_reading: 책망의 반문으로 종결해, 기억 상실이 단순한 망각이 아니라 책임 회피라는 뉘앙스를 유지했습니다.
  alternative_readings:
  - 평서문으로 완화
  - 부드러운 권고문으로 처리
  rationale: 예레미야 44장의 문맥은 우상숭배의 지속을 꾸짖는 선지자적 고발이므로, 질문형의 압박감을 약화하지 않는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 'Translation philosophy: source-directed rhetorical force'
