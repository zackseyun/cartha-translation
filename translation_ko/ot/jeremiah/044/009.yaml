    issue: 관계절을 독립문으로 분리함
    rationale: אֲשֶׁר עָשׂוּ는 열거된 ‘악행들’을 수식합니다. ‘그것은 … 일입니다’로 풀면 원문의 문장 결속이 흐려지고, 복수의 악행을 단수 ‘그것’으로 받게 됩니다.
  - severity: low
    issue: 관계절의 행위 대상이 불명확해짐
    rationale: ‘행한 일’은 무엇을 행했는지가 문법적으로 느슨합니다. ‘저지른 악행’으로 연결하면 원문의 ‘그들이 행한 악행’이라는 의미가 명료해집니다.
