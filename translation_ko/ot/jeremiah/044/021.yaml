base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
  footnotes:
  - marker: a
    text: 'Hebrew: ''and it came up upon his heart,'' an idiom expressing that the matter came before the LORD''s inner regard or remembrance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「너희와 너희 조상들, 너희 왕들과 너희 고관들과 그 땅의 백성이 유다의 성읍들과 예루살렘의 거리들에서 향을 피운 일을 야훼께서 기억하셨고, 그 일이 그분의 마음에 떠오른[a] 것이 아니겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “그것이 그의 마음에 올라갔다”입니다. 이는 그 일이 야훼의 기억과 주목에 이르렀음을 나타내는 관용적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Was it not
  chosen_korean: 아니겠느냐?
  alternatives_korean:
  - 아니냐?
  - ~이 아니었느냐?
  lexicon: HALOT
  rationale: 수사 의문문으로서 동의를 기대하는 뉘앙스를 살리면서 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: הַקִּטֵּר / קִטַּרְתֶּם
