  lexicon: HALOT
  rationale: 명사형과 동사형을 함께 살려서 단순한 향료가 아니라 제의적 분향 행위를 분명히 드러냈습니다.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  english_pob_choice: in the cities of Judah and in the streets of Jerusalem
  chosen_korean: 유다의 성읍들과 예루살렘의 거리들에서
  alternatives_korean:
