  to: 「너희와 너희 조상들, 너희 왕들과 너희 고관들과 그 땅의 백성이 유다의 성읍들과 예루살렘의 거리들에서 향을 피운 일을 야훼께서 기억하셨고, 그 일이 그분의 마음에 떠오른[a] 것이 아니겠습니까?」
  rationale: 원문의 수사 의문문을 하나의 합쇼체 의문문으로 재구성했습니다. ‘향을 피운 일’은 הַקִּטֵּר와 קִטַּרְתֶּם의 행위 및 향의 의미를 함께 반영합니다. 마지막 절은 원문의 인격적 은유를 보존하되 현대 한국어에서 이해 가능한 ‘마음에 떠오르다’로 옮기고, 직역과 관용적 의미는 해당 어구에 연결한 각주로 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:27:41Z'
