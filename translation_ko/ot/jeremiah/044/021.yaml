  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로도 가능한 한 남겨 두어, 단순한 '생각나다'로 평면화하지 않되 이해 가능하게 다듬었습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 신명기를 직접 가리키는 고유 이름을 사용하므로, 프로젝트 기본값에 따라 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: 마음에 올라가다라는 관용구의 보존
  chosen_reading: 그것이 그의 마음에 올라갔습니다
  alternative_readings:
  - 그것이 그의 생각에 떠올랐습니다
  - 그것이 그의 기억에 남았습니다
  rationale: 하나님의 기억/주의를 나타내는 인격적 표현을 평탄화하지 않고, 본문의 긴장과 은유를 그대로 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
