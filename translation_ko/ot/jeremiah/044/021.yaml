  naturalness: ‘분향이 아니겠느냐? 야훼께서 …’는 문장 연결이 다소 부자연스럽고, ‘그것이 그의 마음에 올라갔습니다’도 현대 표준어에서는 직역투로 들립니다. ‘… 떠오른 것은 … 아니겠습니까?’로 구성하면 합쇼체를 유지하면서도 원문의 논리와 관용적 의미를 자연스럽게 전달합니다.
