base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
  footnotes:
  - marker: a
    text: 'Hebrew: ''and it came up upon his heart,'' an idiom expressing that the matter came before the LORD''s inner regard or remembrance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「유다의 성읍들과 예루살렘의 거리들에서 너희와 너희 조상들, 너희 왕들과 너희 지도자들과 그 땅의 백성이 피운 그 분향이 아니겠느냐? 야훼께서 그것을 기억하셨고, 그것이 그의 마음에 올라갔습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “그것이 그의 마음에 올라갔다”입니다. 이는 야훼의 내적 기억이나 주목 안으로 들어왔다는 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Was it not
  chosen_korean: 아니겠느냐?
  alternatives_korean:
  - 아니냐?
  - ~이 아니었느냐?
  lexicon: HALOT
  rationale: 수사 의문문으로서 동의를 기대하는 뉘앙스를 살리면서 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: הַקִּטֵּר / קִטַּרְתֶּם
  english_pob_choice: the incense / you burned
  chosen_korean: 분향이 아니겠느냐? ... 피운
  alternatives_korean:
  - 그 향이 아니겠느냐? ... 태운
  - 그 향을 피운
  lexicon: HALOT
  rationale: 명사형과 동사형을 함께 살려서 단순한 향료가 아니라 제의적 분향 행위를 분명히 드러냈습니다.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  english_pob_choice: in the cities of Judah and in the streets of Jerusalem
  chosen_korean: 유다의 성읍들과 예루살렘의 거리들에서
  alternatives_korean:
  - 유다의 도시들과 예루살렘의 광장들에서
  - 유다의 성읍들과 예루살렘의 길거리들에서
  lexicon: HALOT
  rationale: 공적이고 눈에 보이는 장소라는 점을 살리되, 한국어에서는 '거리들'이 가장 무난하게 공공 공간의 의미를 전달합니다.
- source_word: זָכַר יְהוָה
  english_pob_choice: Yahweh remembered
  chosen_korean: 야훼께서 그것을 기억하셨고
