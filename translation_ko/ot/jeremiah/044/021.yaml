  - 주님께서 기억하셨고
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 '야훼'로 두었고, '기억하다'는 בעברית의 직접적 의미를 유지했습니다.
- source_word: וַתַּעֲלֶה עַל לִבּוֹ
  english_pob_choice: it came up upon his heart
  chosen_korean: 그것이 그의 마음에 올라갔습니다
