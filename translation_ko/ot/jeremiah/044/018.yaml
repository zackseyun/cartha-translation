    rationale: תָּמְנוּ는 끝남·파멸을 뜻하며, 사람들을 주어로 하는 한국어 문장에서는 ‘멸망하였습니다’가 자연스럽습니다. 대안 의미는 각주로 보존할 수 있습니다.
