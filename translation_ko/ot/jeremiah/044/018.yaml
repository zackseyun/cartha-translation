revisions:
- from: 그러나 우리가 하늘의 여왕에게 향을 피우고 그녀에게 붓는 전제주를 드리기를 그만둔 때부터, 우리는 모든 것이 부족했고[a][c], 칼과 기근으로 소멸되었습니다.[b]
