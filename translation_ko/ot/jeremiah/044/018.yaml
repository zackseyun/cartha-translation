id: JER.44.18
reference: Jeremiah 44:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן אָ֡ז חָדַ֜לְנוּ לְ/קַטֵּ֨ר לִ/מְלֶ֧כֶת הַ/שָּׁמַ֛יִם וְ/הַסֵּֽךְ לָ֥/הּ נְסָכִ֖ים חָסַ֣רְנוּ כֹ֑ל וּ/בַ/חֶ֥רֶב וּ/בָ/רָעָ֖ב תָּֽמְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/018.yaml
  text: But from the time we stopped burning incense to the Queen of Heaven and pouring out drink offerings to her[a], we have lacked everything[c][b], and we have been consumed by the sword and by famine.
  footnotes:
  - marker: a
    text: Or 'since we stopped.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Queen of Heaven,' a title for the goddess worshiped by the people here.
    reason: cultural_note
  - marker: c
    text: Or 'we have perished' / 'we have come to an end.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리가 하늘의 여왕에게 향을 피우고 그녀에게 붓는 전제주를 드리기를 그만둔 때부터, 우리는 모든 것이 부족했고[a][c], 칼과 기근으로 소멸되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 그만두었을 때부터.’
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘하늘의 여왕’은 여기서 사람들이 숭배한 여신의 칭호입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘우리는 모두 사라졌습니다’ / ‘우리는 끝장났습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן אָז
  english_pob_choice: But from the time
  chosen_korean: 그러나 …부터
  alternatives_korean:
  - 그리고 그때부터
  - 그러나 그 이후로
  lexicon: HALOT
  rationale: 접속사와 시간표지가 함께 있어 대조적 전개와 시작 시점을 모두 살리기 위해 ‘그러나 …부터’로 옮겼습니다.
- source_word: חָדַלְנוּ לְקַטֵּר
  english_pob_choice: we stopped burning incense
  chosen_korean: 향을 피우기를 그만둔
  alternatives_korean:
  - 향을 바치기를 멈춘
  - 분향하기를 중단한
  lexicon: HALOT
  rationale: 분향 의례를 자연스러운 현대 한국어로 풀되, 제의적 동작인 ‘burning incense’를 분명히 보이게 했습니다.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  english_pob_choice: Queen of Heaven
  chosen_korean: 하늘의 여왕
  alternatives_korean:
  - 하늘 여왕
  - 하늘나라의 여왕
  lexicon: HALOT
  rationale: 우상적 호칭을 직역해 고유한 제의적 명칭을 보존했습니다. 전통 교회어보다 원문 제목의 낯섦을 유지하는 것이 본문 의도에 더 가깝습니다.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  english_pob_choice: and pouring out drink offerings to her
  chosen_korean: 그녀에게 붓는 전제주를 드리기를
  alternatives_korean:
  - 그녀에게 전제를 붓기를
  - 그녀에게 붓는 관제주를 드리기를
  lexicon: HALOT
  rationale: נסכים는 포도주 전제를 가리키므로 ‘전제주’를 사용했습니다. ‘드리다’를 더해 제의적 헌물을 자연스럽게 드러냈습니다.
- source_word: חָסַרְנוּ כֹל
  english_pob_choice: we have lacked everything
  chosen_korean: 우리는 모든 것이 부족했고
  alternatives_korean:
  - 우리는 모든 것을 잃었고
  - 우리는 아무것도 부족함 없이 지내지 못했고
  lexicon: HALOT
  rationale: ‘모든 것’과 ‘부족하다’를 결합해 전면적 결핍을 살렸습니다. 한국어에서는 ‘everything lacked’보다 상태 진술이 더 자연스럽습니다.
- source_word: וּבַחֶרֶב וּבָרָעָב תָּמְנוּ
  english_pob_choice: and we have been consumed by the sword and by famine
  chosen_korean: 칼과 기근으로 소멸되었습니다
  alternatives_korean:
  - 칼과 기근으로 멸망하였습니다
  - 칼과 기근에 의해 끝장났습니다
  lexicon: HALOT
  rationale: תָּמַם의 ‘끝나다/소멸되다’ 의미를 살려 종결적 파멸을 표현했습니다. ‘소멸되었습니다’는 문어체로 자연스럽고, 전쟁·기근의 심판 문맥과도 맞습니다.
theological_decisions:
- issue: ‘Queen of Heaven’의 신학적 성격
  chosen_reading: 하늘의 여왕
  alternative_readings:
  - 하늘의 여왕(여신적 호칭)
  - 하늘 여왕
  rationale: 이 표현은 마리아나 기독교적 칭호가 아니라, 여기서 화자들이 숭배한 이교 신격의 호칭이므로 원문의 낯선 제의적 호칭을 그대로 드러냈습니다.
  doctrine_reference: 원문 우선 원칙; 본문 밖의 후대 교리적 연상을 주입하지 않음.
