revisions:
- from: 그리고 칼에서 살아남은 몇 사람이 이집트 땅에서 유다 땅으로 돌아올 것이며, 이집트 땅으로 가서 거기에서 나그네로 살았던 유다의 남은 모든 사람도, 내 말과 그들의 말 가운데 누구의 말이 서게 될지를 알게 될 것입니다.[a][b]
