  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 הַבָּאִים לְאֶרֶץ מִצְרַיִם לָגוּר שָׁם은 애굽에 가서 그곳에 거류하는 유다의 남은 자들을 가리키므로, ‘살았던’보다 현재의 상태를 나타내는 ‘살고 있는’이 문맥과 히브리어 분사에 더 적절합니다. 또한 דְּבַר מִי יָקוּם은 ‘말이 서다’라는 비유를 담지만, 현대 한국어에서는 ‘말이 이루어지다’가 자연스럽게 성취·입증의 뜻을 전달합니다.
  naturalness: 원문의 ‘누구의 말이 서게 될지’는 현대 표준어에서 다소 부자연스럽습니다. ‘내 말과 그들의 말 가운데 누구의 말’도 반복이 무거우므로 ‘내 말과 그들의 말 중 어느 쪽 말’로 정리하는 것이 자연스럽습니다. ‘칼을 피하여 살아남은’은 ‘칼에서 살아남은’보다 한국어 관용에 맞습니다.
  terminology: ‘유다의 남은 자’, ‘이집트 땅’, ‘유다 땅’, ‘나그네로 살다’는 적절합니다. ‘나그네로 살고 있는’은 גור의 타지 거류 뉘앙스를 유지하면서도 현대적이고 이해하기 쉽습니다.
