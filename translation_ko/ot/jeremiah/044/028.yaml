  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְלִיטֵ֨י חֶ֜רֶב יְשֻׁב֨וּ/ן מִן אֶ֧רֶץ מִצְרַ֛יִם אֶ֥רֶץ יְהוּדָ֖ה מְתֵ֣י מִסְפָּ֑ר וְֽ/יָדְע֞וּ כָּל שְׁאֵרִ֣ית יְהוּדָ֗ה הַ/בָּאִ֤ים לְ/אֶֽרֶץ מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם דְּבַר מִ֥י יָק֖וּם מִמֶּ֥/נִּי וּ/מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/028.yaml
  text: And a few survivors of the sword will return from the land of Egypt to the land of Judah[a], and all the remnant of Judah who came to the land of Egypt to sojourn there will know whose word will stand[b], mine or theirs.
  footnotes:
  - marker: a
    text: 'Hebrew: ''survivors of the sword ... few in number.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'whose word will come to pass, mine or theirs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 칼에서 살아남은 몇 사람이 이집트 땅에서 유다 땅으로 돌아올 것이며, 이집트 땅으로 가서 거기에서 나그네로 살았던 유다의 남은 모든 사람도, 내 말과 그들의 말 가운데 누구의 말이 서게 될지를 알게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘칼에서 살아남은’은 히브리어의 직설적 이미지를 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서게 될지’는 ‘이루어질지/확정될지’의 가능한 뜻을 살린 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּפְלִיטֵי חֶרֶב
  english_pob_choice: a few survivors of the sword
  chosen_korean: 칼에서 살아남은 몇 사람
  alternatives_korean:
  - 칼의 살아남은 자들
  - 칼을 피한 자들
  lexicon: HALOT
  rationale: פְלִיטֵי는 ‘살아남은 자들/탈출자들’의 뜻이고, חֶרֶב은 전쟁·심판의 관용적 표현인 ‘칼’이므로 그 이미지를 살렸습니다. מְתֵי מִסְפָּר의 ‘few’는 ‘몇’으로 자연스럽게 반영했습니다.
- source_word: מִן אֶרֶץ מִצְרַיִם אֶרֶץ יְהוּדָה
  english_pob_choice: from the land of Egypt to the land of Judah
  chosen_korean: 이집트 땅에서 유다 땅으로
  alternatives_korean:
  - 이집트에서 유다로
  - 이집트 땅에서 유다의 땅으로
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’ 반복을 살리되 한국어에서는 과도한 중복을 피해 자연스럽게 옮겼습니다.
- source_word: לָגוּר שָׁם
  english_pob_choice: to sojourn there
  chosen_korean: 거기에서 나그네로 살았던
  alternatives_korean:
  - 거기에서 거류하려고
  - 거기에서 머물러 살려고
  lexicon: HALOT
  rationale: גור는 단순 거주보다 ‘외국인으로 머무는’ 뉘앙스가 있어 ‘나그네로 살다’로 옮겼습니다. ‘살았던’은 בעבר의 도착·체류 사실을 반영합니다.
- source_word: דְּבַר מִי יָקוּם
  english_pob_choice: whose word will stand
  chosen_korean: 누구의 말이 서게 될지를
  alternatives_korean:
  - 누구의 말이 이루어질지를
  - 누구의 말이 확정될지를
  lexicon: HALOT
  rationale: יָקוּם의 ‘서다/일어서다’ 이미지를 살려 경쟁하는 예언의 진위를 드러냈습니다. 한국어에서는 ‘말’이 문맥상 자연스러워 ‘word’ 대신 사용했습니다.
- source_word: מִמֶּנִּי וּמֵהֶם
  english_pob_choice: mine or theirs
  chosen_korean: 내 말과 그들의 말
  alternatives_korean:
  - 내 것과 그들의 것
  - 내 말인지 그들의 말인지
  lexicon: HALOT
  rationale: 지시 대상이 앞의 ‘말’이므로 한국어에서 대조를 분명히 하기 위해 명시적으로 반복했습니다.
theological_decisions:
- issue: 야훼의 예언과 인간의 주장 사이의 대결 구도
  chosen_reading: 누구의 말이 서게 될지를 알게 될 것입니다
  alternative_readings:
  - 누구의 말이 이루어질지를 알게 될 것입니다
  - 누구의 말이 확정될지를 알게 될 것입니다
  rationale: 본문은 포로 귀환 여부를 둘러싼 예언의 सत्य성/성취를 대조합니다. ‘서다’는 히브리어 관용을 보존하면서도 예언의 입증이라는 법정적 긴장을 약화시키지 않습니다.
  doctrine_reference: 예언의 성취와 야훼 말씀의 확증
- issue: ‘나그네’의 사회적·언약적 뉘앙스
  chosen_reading: 거기에서 나그네로 살았던
  alternative_readings:
  - 거기에서 살았던
  - 거기에서 거류했던
  rationale: 단순 거주가 아니라 타지 체류자라는 גור의 뉘앙스를 보존해, 애굽으로 자발적으로 내려간 유다의 অবস্থাকে 드러냅니다.
  doctrine_reference: 언약 백성의 이주와 심판 맥락
