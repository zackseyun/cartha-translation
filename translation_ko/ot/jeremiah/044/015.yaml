id: JER.44.15
reference: Jeremiah 44:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲנ֣וּ אֶֽת יִרְמְיָ֗הוּ כָּל הָ/אֲנָשִׁ֤ים הַ/יֹּֽדְעִים֙ כִּֽי מְקַטְּר֤וֹת נְשֵׁי/הֶם֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וְ/כָל הַ/נָּשִׁ֥ים הָ/עֹמְד֖וֹת קָהָ֣ל גָּד֑וֹל וְ/כָל הָ/עָ֛ם הַ/יֹּשְׁבִ֥ים בְּ/אֶֽרֶץ מִצְרַ֖יִם בְּ/פַתְר֥וֹס לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/015.yaml
  text: Then all the men who knew that their wives were burning incense to other gods[a], and all the women who were standing by—a great assembly—and all the people who were living in the land of Egypt, in Pathros, answered Jeremiah, saying,
  footnotes:
  - marker: a
    text: Or 'standing there.' The Hebrew participle simply indicates the women were present and standing at the scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 자기들의 아내들이 다른 신들에게 향을 피우고 있다는 것을 알고 있던 모든 남자들과 — 그곳에 서 있던 모든 여자들, 곧 큰 집회와 — 이집트 땅, 파드로스에 사는 모든 백성이 예레미야에게 대답하여 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 여기서 여인들이 그 현장에 उपस्थित해 서 있었음을 가리킬 뿐, 지속적 자세를 강조하기보다는 단순한 현장 존재를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  english_pob_choice: answered
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 예레미야의 발화에 대한 반응을 여는 서술동사로서, ‘대답하다’가 가장 직접적이고 자연스럽습니다.
- source_word: מְקַטְּרוֹת
  english_pob_choice: were burning incense
  chosen_korean: 향을 피우고 있다는
  alternatives_korean:
  - 분향하고 있다는
  - 향을 사르고 있다는
  lexicon: HALOT
  rationale: פּעלת형 קטר는 예배 행위로서의 ‘향을 피우다’가 한국어에서 가장 자연스럽고, 우상숭배의 종교적 뉘앙스를 살립니다.
- source_word: הָעֹמְדוֹת
  english_pob_choice: standing by
  chosen_korean: 그곳에 서 있던
  alternatives_korean:
  - 곁에 서 있던
  - 서 있던
  lexicon: HALOT
  rationale: 참석한 여성들의 현장 존재를 가리키는 분사이므로, ‘곁에’보다 현장성을 분명히 하는 ‘그곳에 서 있던’이 더 정확합니다.
- source_word: קָהָל גָּדוֹל
  english_pob_choice: a great assembly
  chosen_korean: 큰 집회
  alternatives_korean:
  - 큰 모임
  - 큰 회중
  lexicon: HALOT
  rationale: קָהָל은 단순 군중보다 ‘집회’가 모인 상태를 더 잘 보존하며, 형용사 גָּדוֹל의 규모도 자연스럽게 드러냅니다.
- source_word: בְּפַתְרוֹס
  english_pob_choice: in Pathros
  chosen_korean: 파드로스
  alternatives_korean:
  - 팟로스
  - 파트로스
  lexicon: HALOT
  rationale: 고유지명은 현대 외래어 표기법에 따라 음역하되, 성서 지명으로서의 식별 가능성을 위해 ‘파드로스’를 택했습니다.
theological_decisions:
- issue: ‘다른 신들’과 향 피움의 우상숭배성 유지
  chosen_reading: ‘다른 신들에게 향을 피우고 있다는’으로 직역성 있게 살려, 본문의 우상숭배 고발을 완화하지 않았습니다.
  alternative_readings:
  - ‘다른 신들을 섬기고 있다는’
  - ‘다른 신들에게 제사를 드리고 있다는’
  rationale: 히브리어는 구체적으로 향을 피우는 행위를 말하므로, 일반화된 표현보다 행위 자체를 유지하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 예레미야 44장 문맥상 우상숭배 고발
- issue: ‘그곳에 서 있던 모든 여자들—큰 집회’의 삽입 구조
  chosen_reading: ‘— 그곳에 서 있던 모든 여자들, 곧 큰 집회와 —’로 괄호성 삽입을 살렸습니다.
  alternative_readings:
  - ‘그리고 모든 여자들, 큰 집회가’
  - ‘또 그곳에 서 있던 모든 여자들’
  rationale: 히브리어의 병렬 삽입 구조를 한국어에서도 중단 부호로 드러내어, 여성 집단의 현장성 및 집회의 규모를 함께 보이게 했습니다.
  doctrine_reference: 본문 수사 구조 보존
