id: JER.44.4
reference: Jeremiah 44:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הַשְׁכֵּ֥ים וְ/שָׁלֹ֖חַ לֵ/אמֹ֑ר אַל נָ֣א תַעֲשׂ֗וּ אֵ֛ת דְּבַֽר הַ/תֹּעֵבָ֥ה הַ/זֹּ֖את אֲשֶׁ֥ר שָׂנֵֽאתִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/004.yaml
  text: Yet I sent to you all my servants the prophets[a], rising early and sending them, saying[b], 'Please do not do this abominable thing that I hate.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'rising early and sending,' an idiom for persistent, earnest repetition.
    reason: cultural_note
  - marker: b
    text: Or 'this detestable thing' / 'this abomination.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 내 종들인 예언자들[a]을 너희에게 모두 보냈습니다. 일찍 일어나 보내며 말하기를[b], "제발 이 가증한 일을 행하지 마십시오. 내가 미워하는 그것입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘일찍 일어나 보내며’라는 관용구로, 거듭되고 간절한 파송을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘이 가증한 것’ / ‘이 혐오스러운 것’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח אֲלֵיכֶם
  english_pob_choice: Yet I sent to you
  chosen_korean: 그러나 내가 너희에게 보냈습니다
  alternatives_korean:
  - 그런데 내가 너희에게 보냈습니다
  - 그리고 내가 너희에게 보냈습니다
  lexicon: HALOT
  rationale: 문맥상 이전의 거듭된 경고에도 불구하고 다시 보낸다는 역접이 있어 ‘그러나’로 담고, 기본 동사는 단순한 ‘보내다’로 옮겼습니다.
- source_word: כָּל עֲבָדַי הַנְּבִיאִים
  english_pob_choice: all my servants the prophets
  chosen_korean: 내 종들인 예언자들
  alternatives_korean:
  - 내 종들인 예언자들 모두
  - 예언자들인 내 종들
  lexicon: HALOT
  rationale: ‘종’은 하나님의 위임을 받은 자라는 표지를 살리되, 이 구절에서는 노예적 뉘앙스보다 소명과 소속이 핵심이므로 POB의 ‘servants’를 따랐습니다.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  english_pob_choice: rising early and sending them
  chosen_korean: 일찍 일어나 보내며
  alternatives_korean:
  - 일찍 일어나 계속 보내며
  - 부지런히 거듭 보내며
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어에서 자연스럽게 들리도록 ‘일찍 일어나’와 현재분사형 ‘보내며’로 반복적·간절한 행동을 드러냈습니다.
- source_word: דְּבַר הַתֹּעֵבָה הַזֹּאת
  english_pob_choice: this abominable thing
  chosen_korean: 이 가증한 일
  alternatives_korean:
  - 이 혐오스러운 일
  - 이 가증한 것
  lexicon: HALOT
  rationale: דְּבַר는 여기서 ‘일/일이 된 것’의 뜻으로 자연스럽고, תּוֹעֵבָה는 우상숭배적·도덕적으로 몹시 혐오스러운 행위를 가리키므로 ‘가증한 일’이 가장 균형 있습니다.
- source_word: אֲשֶׁר שָׂנֵאתִי
  english_pob_choice: that I hate
  chosen_korean: 내가 미워하는 그것입니다
  alternatives_korean:
  - 내가 미워하는 것들입니다
  - 내가 미워한 것입니다
  lexicon: HALOT
  rationale: 하나님의 지속적이고 분명한 반감을 현재형으로 살려 ‘미워하는’으로 옮겼고, 지시대명사 ‘그것’으로 앞의 행위를 되받아 문맥 연결을 분명히 했습니다.
theological_decisions:
- issue: 예언자 파송의 반복성과 긴급성을 한국어에서 어떻게 드러낼지
  chosen_reading: 일찍 일어나 보내며
  alternative_readings:
  - 계속 보내며
  - 간절히 보내며
  rationale: 히브리어 관용구는 단순 시간표현이 아니라 반복적·성실한 경고의 지속을 뜻하므로, 의미를 살리되 본문 이미지를 보존하는 방향으로 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 하나님의 도덕적 혐오를 완화하지 않고 전달할지
  chosen_reading: 가증한 일
  alternative_readings:
  - 혐오스러운 일
  - 역겨운 일
  rationale: 본문은 행위에 대한 강한 신적 거부를 직접 말하므로, 현대어로도 그 긴장을 유지하는 ‘가증한’이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
