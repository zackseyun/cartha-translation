lexical_decisions:
- source_word: וַיֹּאמֶר יִרְמְיָהוּ
  english_pob_choice: Then Jeremiah said
  chosen_korean: 그때 예레미야가 말했습니다
  alternatives_korean:
  - 예레미야가 말했습니다
  - 그리고 예레미야가 말했습니다
  lexicon: WLC; HALOT
  rationale: 와우-연속의 서사 진행을 한국어 자연문맥에 맞게 ‘그때’로 살리고, 예언자 이름은 통용 표기인 예레미야로 옮겼습니다.
- source_word: אֶל כָּל הָעָם וְאֶל כָּל הַנָּשִׁים
  english_pob_choice: to all the people and to all the women
  chosen_korean: 모든 백성과 모든 여자에게
  alternatives_korean:
  - 모든 사람들과 모든 여자들에게
  - 모든 백성과 모든 여인에게
  lexicon: HALOT
  rationale: ‘עָם’은 집합적 ‘백성’이 자연스럽고, ‘הַנָּשִׁים’은 문맥상 ‘여자들’이 가장 직접적입니다.
- source_word: שִׁמְעוּ דְּבַר יְהוָה
  english_pob_choice: Hear the word of Yahweh
  chosen_korean: 야훼의 말씀을 들으십시오
  alternatives_korean:
  - 여호와의 말씀을 들으십시오
  - 야훼의 말을 들으십시오
  lexicon: HALOT
  rationale: 명령형 שִׁמְעוּ는 예언자적 소환 표현으로 ‘들으십시오’가 적절하고, דְּבַר יְהוָה는 관용구인 ‘야훼의 말씀’으로 옮겼습니다.
- source_word: כָּל יְהוּדָה אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: all Judah who are in the land of Egypt
  chosen_korean: 이집트 땅에 있는 온 유다여
  alternatives_korean:
  - 이집트 땅에 있는 모든 유다여
  - 이집트 땅에 있는 온 유대인들아
  lexicon: HALOT
  rationale: 전체 호칭을 자연스러운 한국어 호격으로 재구성하되, 집합 명칭 ‘유다’를 유지해 민족/공동체적 대상을 드러냈습니다.
theological_decisions:
- issue: יהוה의 번역
