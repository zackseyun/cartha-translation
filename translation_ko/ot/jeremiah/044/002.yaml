  text: כֹּה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַתֶּ֣ם רְאִיתֶ֗ם אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֖ל כָּל עָרֵ֣י יְהוּדָ֑ה וְ/הִנָּ֤/ם חָרְבָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וְ/אֵ֥ין בָּ/הֶ֖ם יוֹשֵֽׁב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: You yourselves have seen all the disaster that I brought on Jerusalem and on all the cities of Judah. And behold, they are a ruin this day[b], and there is no one living in them.'
  footnotes:
  - marker: a
    text: Or 'all the calamity'; Hebrew רָעָה here refers to destructive judgment, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'they are in ruins this day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 너희는 내가 예루살렘과 유다의 모든 성읍에 가져온 모든 재앙을 직접 보았습니다. 보십시오, 그것들은 오늘 이 날 황폐한 곳이 되었고, 그 가운데 사는 사람은 아무도 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 재난’. 히브리어 רָעָה는 여기서 도덕적 악이 아니라 파괴적 심판을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것들은 오늘 이 날 폐허가 되었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 이렇게 이르십니다
  lexicon: HALOT
  rationale: 예언자적 선포 서두를 현대 한국어의 공식적인 말투로 옮기되, 문어체의 무게를 유지했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 주
  lexicon: HALOT
  rationale: 여호와 대신 신명인 야훼를 유지하고, צְבָאוֹת는 관용적이고 넓은 뜻을 살려 ‘만군의’로 옮겼습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님이신 분
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 자연스러운 한국어로 직접 대응했습니다.
- source_word: כָּל הָרָעָה
  english_pob_choice: all the disaster
  chosen_korean: 모든 재앙
  alternatives_korean:
  - 모든 악
  - 모든 재난
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 심판으로 인한 파괴적 재난을 가리키므로, 그 긴장을 살리는 ‘재앙’을 택했습니다.
- source_word: הֵבֵאתִי עַל
  english_pob_choice: I brought on
  chosen_korean: 내가 … 가져온
  alternatives_korean:
  - 내가 … 가져다준
  - 내가 … 내린
  lexicon: HALOT
  rationale: עַל과 결합한 원인을 드러내기 위해 ‘가져온’으로 옮겨, 하나님이 직접 초래하신 심판이라는 의미를 보존했습니다.
- source_word: וְהִנָּם
  english_pob_choice: And behold, they
  chosen_korean: 보십시오, 그것들은
  alternatives_korean:
  - 보라, 그것들은
  - 그리고 보십시오, 그것들은
  lexicon: HALOT
  rationale: 주의 환기 기능을 살리기 위해 ‘보십시오’를 썼고, 복수 대상을 한국어에서 자연스럽게 받도록 했습니다.
- source_word: חָרְבָּה
  english_pob_choice: are a ruin
  chosen_korean: 황폐한 곳이 되었고
  alternatives_korean:
  - 폐허가 되었고
  - 황폐해졌고
  lexicon: HALOT
  rationale: 명사형 ‘폐허/황폐’의 상태를 살리면서도 복수 대상에 어색하지 않도록 상태 변화로 풀었습니다.
- source_word: וְאֵין בָּהֶם יוֹשֵׁב
  english_pob_choice: and there is no one living in them
  chosen_korean: 그 가운데 사는 사람은 아무도 없습니다
  alternatives_korean:
  - 그 안에 거주하는 사람이 아무도 없습니다
  - 그 안에 사는 자가 없습니다
  lexicon: HALOT
  rationale: יוֹשֵׁב의 거주 의미를 살리되, 현대 한국어에서 자연스러운 무인 상태 표현으로 옮겼습니다.
