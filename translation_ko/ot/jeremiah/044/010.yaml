id: JER.44.10
reference: Jeremiah 44:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/010.yaml
  text: They have not been humbled to this day[a], and they have not feared[b], and they have not walked in my law and in my statutes that I set before you and before your fathers.
  footnotes:
  - marker: a
    text: Or 'have not been crushed,' 'have not become contrite,' or interpretively, 'have not repented.'
    reason: lexical_alternative
  - marker: b
    text: '''Your fathers'' refers to the earlier generations to whom the same law and statutes were given; alternatively, ''your ancestors.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 오늘날까지도 겸손해지지 않았고, 두려워하지도 않았으며, 내가 그들 앞과 그들의 조상들 앞에 둔 내 율법과 내 규례대로도 행하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겸손해지지 않았다’는 여기서 ‘부서지지 않았다’, ‘통회하지 않았다’, 또는 해석적으로 ‘회개하지 않았다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들’은 같은 율법과 규례가 주어졌던 이전 세대들을 가리키며, 문맥상 ‘선조들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֻכְּאוּ
  english_pob_choice: have not been humbled
  chosen_korean: 겸손해지지 않았고
  alternatives_korean:
  - 부서지지 않았고
  - 낮아지지 않았고
  - 통회하지 않았고
  lexicon: HALOT
  rationale: דכא의 수동형은 ‘짓눌리다/부서지다’와 ‘낮아지다, 겸손해지다’의 뜻을 가질 수 있는데, 여기서는 회개로까지 직역하지 않고 영적 태도의 무반응을 드러내는 ‘겸손해지지 않았다’가 가장 자연스럽습니다.
- source_word: יָרְאוּ
  english_pob_choice: have not feared
  chosen_korean: 두려워하지도 않았으며
  alternatives_korean:
  - 경외하지도 않았으며
  - 무서워하지도 않았으며
  lexicon: HALOT
  rationale: 여기서는 언약적 ‘경외’의 의미가 핵심이지만, 한국어에서 동사형으로는 ‘두려워하다’가 가장 직접적으로 대응하며, 문맥상 하나님을 향한 마땅한 반응의 부재를 잘 살립니다.
- source_word: בְתֹורָתִי וּבְחֻקֹּתַי
  english_pob_choice: in my law and in my statutes
  chosen_korean: 내 율법과 내 규례대로
  alternatives_korean:
  - 내 율법과 내 규례 안에서
  - 내 가르침과 내 규례대로
  - 내 법과 내 규례대로
  lexicon: HALOT
  rationale: תורה와 חוקים의 결합은 언약적 법 언어이므로 ‘율법’과 ‘규례’를 살렸고, 한국어 문맥에서는 반복되는 ‘in’보다 ‘-대로’가 행위 규범을 더 자연스럽게 드러냅니다.
- source_word: לִפְנֵיכֶם / לִפְנֵי אֲבוֹתֵיכֶם
  english_pob_choice: that I set before you and before your fathers
  chosen_korean: 내가 그들 앞과 그들의 조상들 앞에 둔
  alternatives_korean:
  - 내가 너희 앞과 너희 조상들 앞에 둔
  - 내가 그들 앞과 그들의 아버지들 앞에 둔
  lexicon: HALOT
  rationale: 히브리어 2인칭 복수 어미가 분명하므로 청자를 직접 지칭하는 구조를 유지해야 합니다. 한국어에서는 문맥상의 지시 대상을 ‘그들’로 옮기되, 앞에 놓인 율법의 공적 제시를 ‘앞에 둔’으로 살렸습니다.
theological_decisions:
- issue: דֻכְּאוּ를 회개 언어로 명시할지 여부
  chosen_reading: ‘겸손해지지 않았고’로 번역해 회개의 결과를 암시하되, 본문이 직접 말하지 않는 ‘회개하다’는 넣지 않았습니다.
  alternative_readings:
  - 회개하지 않았고
  - 통회하지 않았고
  - 부서지지 않았고
  rationale: 본문은 심판에 대한 올바른 반응의 부재를 말하지만, 동사 자체는 회개라는 신학 용어를 직접 요구하지 않습니다. 따라서 원문의 긴장을 유지하면서도 의미를 자연스럽게 전달하는 쪽을 택했습니다.
  doctrine_reference: 원어 우선, 해석적 확대 자제
- issue: 2인칭 복수 어미의 지시 대상을 한국어에서 어떻게 처리할지
  chosen_reading: ‘그들 앞과 그들의 조상들 앞에’로 옮겨, 히브리어의 청자 지시를 문맥상 명시된 대상에게 자연스럽게 연결했습니다.
  alternative_readings:
  - 너희 앞과 너희 조상들 앞에
  - 그들 앞과 너희 조상들 앞에
  rationale: 히브리어는 2인칭 복수로 직접 호명하지만, 한국어에서는 바로 앞 절의 3인칭 대상과의 연결이 더 매끄럽습니다. 다만 ‘너희’ 대신 임의로 일반화하지 않고, 청자와 대상 관계가 드러나도록 구성했습니다.
  doctrine_reference: 문맥 일치와 형태 보존의 균형
