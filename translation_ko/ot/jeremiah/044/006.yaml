  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּתַּ֤ךְ חֲמָתִ/י֙ וְ/אַפִּ֔/י וַ/תִּבְעַר֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרֽוּשָׁלִָ֑ם וַ/תִּהְיֶ֛ינָה לְ/חָרְבָּ֥ה לִ/שְׁמָמָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/006.yaml
  text: So my wrath and my anger were poured out and burned in the cities of Judah and in the streets of Jerusalem[a], and they became a ruin and a desolation, as they are this day.
  footnotes:
  - marker: a
    text: Or 'squares' or 'open places' of Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내 분노와 내 진노가 쏟아져 유다의 성읍들과 예루살렘의 거리들[a]에 타올랐고, 그것들은 오늘과 같이 폐허가 되고 황폐가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광장들’이나 ‘열린 곳들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתַּךְ חֲמָתִי וְאַפִּי
  english_pob_choice: were poured out / my wrath and my anger
  chosen_korean: 내 분노와 내 진노가 쏟아져
  alternatives_korean:
  - 내 진노와 내 분노가 부어져
  - 내 노여움과 내 진노가 쏟아져
  lexicon: HALOT
  rationale: נתך의 ‘쏟아지다’ 이미지를 살리고, חֵמָה/אַף의 병행은 ‘분노/진노’로 옮겨 두 표현의 누적 강도를 유지했습니다.
- source_word: וַתִּבְעַר
  english_pob_choice: burned
  chosen_korean: 타올랐고
  alternatives_korean:
  - 불탔고
  - 번졌고
  lexicon: HALOT
  rationale: בער의 불붙어 타는 동사를 단순한 결과어보다 동적인 ‘타오르다’로 옮겨, 앞의 ‘쏟아져’와 결합된 심판의 폭발성을 살렸습니다.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  english_pob_choice: in the cities of Judah and in the streets of Jerusalem
  chosen_korean: 유다의 성읍들과 예루살렘의 거리들
  alternatives_korean:
  - 유다의 성읍들과 예루살렘의 광장들
  - 유다의 성읍들과 예루살렘의 열린 곳들
  lexicon: HALOT
  rationale: בְּ는 이 심판이 미친 장소를 가리키므로 ‘~에’가 아니라 ‘~의 …들’ 구조로 자연스럽게 처리했고, חֻצוֹת는 문맥상 일반적인 ‘거리들’이 가장 무난합니다.
- source_word: לְחָרְבָּה לִשְׁמָמָה
  english_pob_choice: a ruin and a desolation
  chosen_korean: 폐허가 되고 황폐가 되었습니다
  alternatives_korean:
  - 무너진 폐허가 되고 황무지가 되었습니다
  - 폐허와 황폐가 되었습니다
  lexicon: HALOT
  rationale: 두 명사는 결과 상태를 묘사하므로 한국어에서는 명사열거보다 상태변화 구문이 더 자연스럽고, ‘폐허/황폐’로 예언서의 심판 어휘를 유지했습니다.
theological_decisions:
- issue: 하나님의 감정적 심판 표상
  chosen_reading: ‘내 분노와 내 진노가 쏟아져… 타올랐고’로, 감정적·신체적 은유를 약화하지 않았습니다.
  alternative_readings:
  - ‘내 심판이 내렸고’처럼 추상화함
  - ‘노여움’ 하나로 중복을 완화함
  rationale: 본문은 하나님의 সক대적 심판을 구체적 은유로 드러내므로, 이를 추상적 법정 언어로 바꾸지 않는 것이 स्रोत의 신학적 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 최종 상태의 복수성
  chosen_reading: ‘그것들은 오늘과 같이’로 예루살렘의 거리들까지 포함한 복수 장소를 그대로 반영했습니다.
  alternative_readings:
  - ‘그것은 오늘처럼’처럼 단수화함
  rationale: 히브리어 복수형은 파괴된 장소들의 집합을 가리키므로, 한국어에서도 복수 지시를 유지하는 편이 원문 구조에 더 충실합니다.
  doctrine_reference: Translation philosophy §1
