- from: 그러므로 내 분노와 내 진노가 쏟아져 유다의 성읍들과 예루살렘의 거리들[a]에 타올랐고, 그것들은 오늘과 같이 폐허가 되고 황폐가 되었습니다.
  to: 그리하여 내 분노와 내 진노가 쏟아져 유다의 성읍들과 예루살렘의 거리들[a]에서 타올랐고, 그곳들은 오늘날과 같이 폐허가 되고 황폐해졌습니다.
  rationale: 수정은 원문의 의미를 바꾸지 않고, 불타는 분노가 미친 장소를 ‘~에서’로 분명히 하며, 두 결과 명사를 자연스러운 한국어 상태 변화 표현으로 옮긴 것입니다. ‘그곳들’은 여성 복수 동사가 가리키는 심판받은 장소들의 집합을 한국어에서 자연스럽게 나타냅니다.
