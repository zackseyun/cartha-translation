  text: וְ/כִֽי אֲנַ֤חְנוּ מְקַטְּרִים֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הֲ/מִֽ/בַּלְעֲדֵ֣י אֲנָשֵׁ֗י/נוּ עָשִׂ֨ינוּ לָ֤/הּ כַּוָּנִים֙ לְ/הַ֣עֲצִבָ֔/ה וְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/019.yaml
  text: And when we burned incense to the Queen of Heaven and poured out drink offerings to her[a], was it apart from our husbands that we made cakes for her, to depict her, and poured out drink offerings to her?
  footnotes:
  - marker: a
    text: Or 'to represent her' or 'to make her image.' The Hebrew likely refers to cakes shaped in the goddess's likeness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리가 하늘의 여왕에게 분향하고 그녀에게 전제물을 부을 때에, 우리가 우리 남편들의 관여 없이 그녀를 본뜬 과자를 만들어 그녀에게 전제물을 부은 것이었습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀를 나타내기 위해’ 또는 ‘그녀의 형상을 만들기 위해’라는 뜻일 수 있습니다. 히브리어는 아마도 여신의 모습을 닮게 만든 과자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And when
  chosen_korean: 그리고 … 때
  alternatives_korean:
  - 그리고 … 하였을 때
  - 그리고 … 할 때
  lexicon: HALOT
  rationale: 문맥상 이전 진술에 대한 항변을 이어 가는 시간·상황 도입이므로, 조건문처럼 들리지 않게 한국어에서는 ‘…했을 때’ 계열로 옮겼습니다.
- source_word: מְקַטְּרִים
  english_pob_choice: burned incense
  chosen_korean: 분향하고
  alternatives_korean:
  - 향을 피우고
  - 향을 사르고
  lexicon: HALOT
  rationale: 성소적·우상숭배적 제의 행위를 가리키는 표준적 표현을 살리기 위해 ‘분향하다’를 택했습니다.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  english_pob_choice: to the Queen of Heaven
  chosen_korean: 하늘의 여왕에게
  alternatives_korean:
  - 하늘의 여왕께
  - 하늘 여왕에게
  lexicon: HALOT
  rationale: 원문의 이교적 칭호를 그대로 드러내기 위해 ‘하늘의 여왕’으로 옮기고, 예배 대상이 아니라는 점은 문맥이 충분히 보여 줍니다.
- source_word: כַּוָּנִים לְהַעֲצִבָהּ
  english_pob_choice: that we made cakes for her, to depict her
  chosen_korean: 그녀에게 빵 과자들을 만들어 그녀를 본뜬 것이었습니까
  alternatives_korean:
  - 그녀에게 과자들을 만들어 그녀의 형상을 나타낸 것이었습니까
  - 그녀에게 빵 과자들을 만들어 그녀의 모습을 본뜬 것이었습니까
  lexicon: HALOT
  rationale: כַּוָּנִים은 제의적 모양의 떡/과자를 가리키므로 ‘빵 과자들’로 옮기고, לְהַעֲצִבָהּ의 목적 의미는 ‘본뜨다’로 압축해 우상 형상 제작의 뉘앙스를 살렸습니다.
- source_word: אֲנָשֵׁינוּ
  english_pob_choice: our husbands
  chosen_korean: 우리의 남편들
  alternatives_korean:
  - 우리 남자들
  - 우리 남편 없이
  lexicon: HALOT
  rationale: 말하는 이들이 여성들이므로 여기서는 일반적인 ‘남자들’보다 관계를 분명히 하는 ‘남편들’이 문맥상 더 정확합니다.
theological_decisions:
- issue: 하늘의 여왕 칭호의 처리
  chosen_reading: 이교적 호칭을 그대로 보존해 ‘하늘의 여왕’으로 옮겼습니다.
  alternative_readings:
  - ‘하늘의 여왕’ 대신 ‘하늘의 여신’으로 풀어씀
  - 의미를 완화해 ‘하늘의 왕후’로 번역
  rationale: 본문은 우상 숭배 변론의 직접 인용이므로, 후대적 완화 없이 원문의 제의적 호칭을 보존하는 것이 중요합니다.
  doctrine_reference: Jeremiah 7:18; 44:17-19의 우상숭배 비판 맥락
