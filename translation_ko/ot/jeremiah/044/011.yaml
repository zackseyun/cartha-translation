  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י שָׂ֥ם פָּנַ֛/י בָּ/כֶ֖ם לְ/רָעָ֑ה וּ/לְ/הַכְרִ֖ית אֶת כָּל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/011.yaml
  text: 'Therefore[a], this is what Yahweh of Armies, the God of Israel, says: Behold, I am setting my face against you for harm[b], to cut off all Judah.'
  footnotes:
  - marker: a
    text: Or 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: '''For harm'' refers to calamity or disaster in judgment, not to moral evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “보십시오, 내가 너희를 향해 내 얼굴을 해롭게 돌려 모든 유다를 끊어 버리겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해롭게’는 여기서 도덕적 악이 아니라 심판으로 인한 재앙이나 해악을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 책망과 심판 선언에 이어지는 결론을 나타내므로, 인과의 논리를 분명하게 보이는 ‘그러므로’가 적절합니다.
- source_word: יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh of Armies, the God of Israel
  chosen_korean: 만군의 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 야훼 만군의 하나님, 이스라엘의 하나님
  - 야훼 군대들의 하나님, 이스라엘의 하나님
  lexicon: HALOT
  rationale: 본문의 신명과 칭호를 구분해 야훼를 고유명으로, צְבָאוֹת을 ‘만군’으로 살렸습니다. ‘이스라엘의 하나님’은 언약적 식별을 그대로 유지합니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 이제 내가
  lexicon: HALOT
  rationale: 예언적·엄숙한 선포의 돌입을 살리면서도 현대 한국어에서 자연스러운 호소형인 ‘보십시오’를 택했습니다.
- source_word: שָׂם פָּנַי בָּכֶם לְרָעָה
  english_pob_choice: setting my face against you for harm
  chosen_korean: 내 얼굴을 해롭게 돌려
  alternatives_korean:
  - 내 얼굴을 너희에게 해를 끼치도록 돌려
  - 너희를 향해 내 얼굴을 악으로 돌려
  lexicon: HALOT
  rationale: ‘얼굴을 돌리다’는 심판의 의지를 드러내는 관용구이므로 그대로 유지하되, לְרָעָה는 도덕적 ‘악’보다 재앙·해악의 의미에 맞게 ‘해롭게’로 옮겼습니다.
- source_word: וּלְהַכְרִית אֶת כָּל יְהוּדָה
  english_pob_choice: to cut off all Judah
  chosen_korean: 모든 유다를 끊어 버리겠습니다
  alternatives_korean:
  - 모든 유다를 끊어 내겠습니다
  - 모든 유다를 멸하겠습니다
  lexicon: HALOT
  rationale: הכרית의 동사적 강도를 살리기 위해 ‘끊어 버리다’를 택해 ‘cut off’의 단절·심판 이미지를 보존했습니다.
theological_decisions:
- issue: 하나님의 심판 선언에서 לְרָעָה의 의미
  chosen_reading: ‘해롭게’는 하나님이 도덕적으로 악하시다는 뜻이 아니라, 심판으로서의 재앙과 해악을 가리킵니다.
  alternative_readings:
  - ‘악하게’
  - ‘재앙으로’
  rationale: 영어 POB의 주석처럼 문맥상 도덕적 악이 아니라 징계적 재난을 뜻하므로, 한국어도 오해를 막는 방향으로 옮겼습니다.
  doctrine_reference: 예레미야서의 심판 신탁 문맥; 하나님의 거룩성과 심판의 정당성
- issue: 만군의 야훼의 호칭
  chosen_reading: ‘만군의 야훼’로 옮겨 군사적·주권적 권위를 드러내고, ‘여호와’ 대신 야훼를 사용했습니다.
  alternative_readings:
  - ‘만군의 주님’
  - ‘만군의 여호와’
  rationale: 프로젝트 기준에 따라 יהוה는 고유명 야훼로 옮기고, צְבָאוֹת은 전통적 ‘만군’으로 처리해 본문의 권위와 통상적 예언자 문체를 함께 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; Contested terms table for יהוה'
