    rationale: כְּהַיּוֹם הַזֶּה는 ‘사람이 살지 않는’ 상태와 연결되어 ‘오늘날처럼’이라는 현 상태의 지속을 나타냅니다. 초안처럼 ‘오늘날처럼 황폐한 폐허’로 두면 원문의 배열과 범위가 약화됩니다.
