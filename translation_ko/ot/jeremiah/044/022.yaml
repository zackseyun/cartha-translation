  source_fidelity: 원문의 인과관계와 심판의 세 항목은 대체로 반영되었으나, ‘오늘날처럼’이 ‘황폐한 폐허’에 붙어 원문의 마지막 수식 범위(‘사람이 살지 않음, 오늘날까지’)가 흐려졌습니다. 또한 ‘황폐한 폐허’는 חָרְבָּה의 뜻을 중복합니다.
  naturalness: 합쇼체와 전반적 문체는 자연스럽습니다. 다만 ‘황폐한 폐허가 되고, 황량한 곳이 되고’는 의미가 겹치고 다소 어색하므로, 병렬 명사를 간결히 옮기는 편이 자연스럽습니다.
  terminology: ‘야훼’, ‘가증한 일들’, ‘저주’는 원문의 신명과 도덕적·언약적 어휘를 적절히 반영합니다. שַׁמָּה는 문맥상 ‘황폐한 곳’으로 옮기고 대안 의미는 각주로 보존할 수 있습니다.
