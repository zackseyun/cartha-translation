id: JER.44.22
reference: Jeremiah 44:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יוּכַל֩ יְהוָ֨ה ע֜וֹד לָ/שֵׂ֗את מִ/פְּנֵי֙ רֹ֣עַ מַעַלְלֵי/כֶ֔ם מִ/פְּנֵ֥י הַ/תּוֹעֵבֹ֖ת אֲשֶׁ֣ר עֲשִׂיתֶ֑ם וַ/תְּהִ֣י אַ֠רְצְ/כֶם לְ/חָרְבָּ֨ה וּ/לְ/שַׁמָּ֧ה וְ/לִ/קְלָלָ֛ה מֵ/אֵ֥ין יוֹשֵׁ֖ב כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/022.yaml
  text: And Yahweh could no longer bear it because of the evil of your deeds[a], because of the abominations that you committed. So your land became a ruin, a desolation, and a curse, without inhabitant[c][b], as it is this day.
  footnotes:
  - marker: a
    text: Or 'could no longer endure.' The Hebrew literally says 'could no longer bear,' expressing that the LORD's forbearance had reached its limit because of their evil deeds and abominations.
    reason: lexical_alternative
  - marker: b
    text: '''A desolation'' may also carry the sense of ''an object of horror/astonishment.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'an object of cursing,' that is, something invoked as a formula of curse.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 너희 행실의 악과 너희가 행한 가증한 일들 때문에 더 이상 견디실 수 없으셨습니다.[a] 그러므로 너희 땅은 폐허가 되고, 황폐한 곳이 되고,[b] 저주가 되어,[c] 오늘날처럼 사람이 살지 않게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더 이상 견디실 수 없으셨습니다’는 히브리어의 ‘더 이상 견디거나 지탱할 수 없다’는 관용을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘황폐한 곳’(שׁממה)은 ‘황폐’ 외에 ‘놀람’이나 ‘경악의 대상’이라는 뉘앙스를 지닐 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘저주가 되어’는 ‘저주의 대상’ 또는 저주를 선언할 때 쓰이는 표현이라는 뜻을 지닐 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신명사에 대한 프로젝트 기본값을 따라 야훼로 옮겨, 언약적 고유명을 드러내고 ‘주님’으로 일반화하지 않았습니다.
- source_word: יוּכַל ... לָשֵׂאת
  english_pob_choice: could no longer bear it
  chosen_korean: 더 이상 참으실 수 없었습니다
  alternatives_korean:
  - 더 이상 견디실 수 없었습니다
  - 더 이상 تحمل하실 수 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘더 이상 지탱/견디지 못하다’는 관용을 한국어에서 자연스럽고 무게 있게 ‘더 이상 참으실 수 없다’로 풀었습니다.
- source_word: רֹעַ מַעַלְלֵיכֶם / הַתּוֹעֵבוֹת
  english_pob_choice: the evil of your deeds / the abominations
  chosen_korean: 너희 행위의 악 / 너희가 저지른 가증한 것들
  alternatives_korean:
  - 너희 행실의 악 / 너희가 행한 혐오스러운 일들
  - 너희 악한 행위 / 너희의 가증한 행위들
  lexicon: HALOT
  rationale: ‘악’과 ‘가증한 것들’을 분리해, 원문의 도덕적 평가와 언약적 혐오감을 함께 살렸습니다.
- source_word: לְחָרְבָּה וּלְשַׁמָּה וְלִקְלָלָה
  english_pob_choice: a ruin, a desolation, and a curse
  chosen_korean: 황폐한 폐허가 되고, 황량한 곳이 되고, 저주가 되었으며
  alternatives_korean:
  - 폐허가 되고, 황무지가 되고, 저주가 되었으며
  - 폐허와 황량함과 저주가 되었으며
  lexicon: HALOT
  rationale: 세 명사의 누적을 한국어에서도 병렬로 유지하되, ‘שׁממה’의 황량함/폐허감을 ‘황량한 곳’으로 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼 번역과 심판 진술의 직접성
  chosen_reading: 야훼를 주어로 직접 제시하고, 하나님의 인내가 한계에 이르러 심판이 임한 것으로 옮겼습니다.
  alternative_readings:
  - ‘주님께서는’처럼 완화하여 표현
  - 인격적 주어를 생략하고 수동적으로 표현
  rationale: 본문은 하나님의 인내가 끝났음을 분명히 말하므로, 심판의 직접성과 언약적 책임을 흐리지 않도록 주어를 명시했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
