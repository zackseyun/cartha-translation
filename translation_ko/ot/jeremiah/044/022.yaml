revisions:
- from: 야훼께서는 너희 행위의 악과 너희가 저지른 가증한 것들 때문에 더 이상 참으실 수 없었습니다. 그래서 너희 땅은 오늘날처럼 황폐한 폐허가 되고, 황량한 곳이 되고, 저주가 되었으며, 주민이 없게 되었습니다.[a][b][c]
  to: 야훼께서는 너희 행실의 악과 너희가 행한 가증한 일들 때문에 더 이상 견디실 수 없으셨습니다.[a] 그러므로 너희 땅은 폐허가 되고, 황폐한 곳이 되고,[b] 저주가 되어,[c] 오늘날처럼 사람이 살지 않게 되었습니다.
  rationale: 원문의 ‘폐허, 황폐, 저주’라는 세 병렬 항목을 중복 없이 유지하고, ‘오늘날처럼’이 마지막의 무주민 상태를 수식하도록 어순을 바로잡았습니다. 신명 ‘야훼’와 심판 진술의 직접성은 유지했습니다.
  reviewer_model: gpt-5.6-terra
