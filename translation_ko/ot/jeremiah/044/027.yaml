id: JER.44.27
reference: Jeremiah 44:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/027.yaml
  text: Behold[a], I am watching over them for harm and not for good, and every man of Judah who is in the land of Egypt will come to an end by the sword and by famine[c][b], until they are consumed.
  footnotes:
  - marker: a
    text: Or 'for disaster' or 'for calamity'; the Hebrew term denotes harmful judgment, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'every man of Judah,' a masculine singular expression used distributively.
    reason: lexical_alternative
  - marker: c
    text: Or 'until they are consumed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 그들을 해치도록 지켜보고 있으나 복을 주려는 것은 아닙니다. 그리고 이집트 땅에 있는 유다의 모든 사람은 칼과 기근으로 끝장나고, 완전히 사라질 때까지 이르게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָעָה는 여기서 도덕적 ‘악’이 아니라 ‘해, 재난, 파멸’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유다의 모든 남자’이지만, 분배적으로 쓰인 남성 단수 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘완전히 소멸될 때까지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기에 내가 있다
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄을 살리면서도 현대 한국어에서 자연스럽고 격식을 유지하는 호소형으로 옮겼습니다.
- source_word: שֹׁקֵד עֲלֵיהֶם
  english_pob_choice: watching over them
  chosen_korean: 그들을 해치도록 지켜보고 있으나
  alternatives_korean:
  - 그들을 살피고 있으나
  - 그들을 감시하고 있으나
  lexicon: HALOT
  rationale: שׁקד의 지속적·의도적 감시를 반영하되, 본문이 단순 보호가 아니라 해악을 향한 경계임을 한국어에서 분명히 드러내기 위해 목적어적 뉘앙스를 살렸습니다.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  english_pob_choice: for harm and not for good
  chosen_korean: 복을 주려는 것은 아닙니다
  alternatives_korean:
  - 해를 주려는 것이지 좋게 하려는 것은 아닙니다
  - 재앙을 위한 것이지 복을 위한 것은 아닙니다
  lexicon: HALOT
  rationale: רָעָה/טוֹבָה의 대조를 한국어의 ‘복’과 ‘해’를 통해 자연스럽게 살리되, 하나님이 이들을 위해 선의의 계획을 갖고 있지 않다는 반어적 선언을 유지했습니다.
- source_word: וְתַמּוּ ... עַד כְּלוֹתָם
  english_pob_choice: will come to an end ... until they are consumed
  chosen_korean: 끝장나고, 완전히 사라질 때까지 이르게 될 것입니다
  alternatives_korean:
  - 끝나고, 소멸될 때까지 이르게 될 것입니다
  - 완전히 소진되고, 다 사라질 때까지 이르게 될 것입니다
  lexicon: HALOT
  rationale: תמם과 כלה의 누적적 종결감을 살려, 단순 종료보다 더 강한 파국을 드러내는 표현을 택했습니다. 마지막 절정은 ‘완전히 사라질 때까지’로 옮겨 최종 소진을 분명히 했습니다.
- source_word: כָל אִישׁ יְהוּדָה
  english_pob_choice: every man of Judah
  chosen_korean: 유다의 모든 사람
  alternatives_korean:
  - 유다의 모든 남자
  - 유다의 모든 남성
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 분배 표현을 한국어에서 굳이 성별화하지 않고, 문맥상 집단 전체를 가리키는 대표적 의미를 살려 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 재난 심판 어휘를 어떻게 드러낼 것인가
  chosen_reading: ‘해치도록 지켜보고 있으나 복을 주려는 것은 아닙니다’로 심판의 방향성을 직접 드러냄
  alternative_readings:
  - ‘재앙을 위한 것입니다’
  - ‘해를 위한 것입니다’
  rationale: 히브리어 רָעָה는 כאן에서 도덕적 악이 아니라 해악/재난을 뜻하므로, 한국어에서도 하나님의 심판이 가지는 실제적 파괴성을 숨기지 않되 도덕적 악의 함의는 피했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; divine judgment language should remain sharp without implying moral evil in God.'
- issue: ‘every man of Judah’의 성별 표지 처리
  chosen_reading: ‘유다의 모든 사람’으로 대표적 집단 의미를 유지함
  alternative_readings:
  - ‘유다의 모든 남자’
  - ‘유다의 모든 남성’
  rationale: 원문의 남성형 단수는 분배적 용법이므로 집단 전체를 지칭하는 대표 표현으로 이해해야 합니다. 한국어에서는 불필요한 성별화를 피하되, 문맥의 대상이 유다 공동체 전체임을 보존했습니다.
  doctrine_reference: 'Translation philosophy §4: gender-accurate where source form matters, but natural Korean may use representative collective wording when the gender marker is not the semantic focus.'
