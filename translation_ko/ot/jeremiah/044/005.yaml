base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/005.yaml
  text: But they did not listen or incline their ear to turn from their evil[a], so as not to make offerings to other gods.
  footnotes:
  - marker: a
    text: Or more literally, 'to stop burning incense to other gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 듣지 않았고, 귀를 기울이지도 않았습니다. 자기들의 악에서 돌아서서 다른 신들에게 분향하는 일을 그치게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다른 신들에게 분향하는 일을 그치게 하려는 것’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמְעוּ
  english_pob_choice: did not listen
  chosen_korean: 듣지 않았고
  alternatives_korean:
  - 귀 기울이지 않았고
  - 들으려 하지 않았고
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 ‘듣고 따르다’의 뉘앙스를 가질 수 있어, 문맥상 선지자의 경고를 외면한 뜻으로 ‘듣지 않았다’가 가장 자연스럽습니다.
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  english_pob_choice: incline their ear
  chosen_korean: 귀를 기울이지도 않았습니다
  alternatives_korean:
  - 귀를 굽히지도 않았습니다
  - 주의를 기울이지도 않았습니다
  lexicon: HALOT
  rationale: 관용구의 비유를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘귀를 기울이다’로 옮겼습니다.
- source_word: לָשׁוּב מֵרָעָתָם
  english_pob_choice: to turn from their evil
  chosen_korean: 자기들의 악에서 돌아서서
  alternatives_korean:
  - 자기들의 악에서 돌이켜
  - 자기들의 악을 버리고
  lexicon: HALOT
  rationale: שׁוב는 여기서 악에서 ‘돌아서다/돌이키다’의 의미이므로, 신학적 용어인 ‘회개하다’를 본문에 미리 들이지 않고 동작 자체를 드러냈습니다.
- source_word: לְבִלְתִּי קַטֵּר
  english_pob_choice: to stop making offerings
  chosen_korean: 분향하는 일을 그치게 하려는 것이었습니다
  alternatives_korean:
  - 향을 피우는 일을 멈추게 하려는 것이었습니다
  - 분향을 중단하게 하려는 것이었습니다
  lexicon: HALOT
  rationale: קטר는 문자적으로 ‘분향하다/연기를 올리다’이지만 우상 숭배 맥락의 제의 행위를 가리키므로, 본문 의미를 분명히 하되 ‘분향’은 유지했습니다.
- source_word: לֵאלֹהִים אֲחֵרִים
  english_pob_choice: to other gods
  chosen_korean: 다른 신들에게
  alternatives_korean:
  - 다른 신들에
  - 이방 신들에게
  lexicon: HALOT
  rationale: ל + 목적지는 우상 숭배의 대상 방향을 나타내며, 한국어에서는 ‘다른 신들에게’가 가장 직설적이고 오해가 적습니다.
theological_decisions:
- issue: קטר의 제의적 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘분향하는 일을 그치게 하려는 것’으로 옮겨, 우상 숭배의 제의 행위를 분명히 하되 지나친 해석은 피했습니다.
  alternative_readings:
  - ‘향을 피우는 일을 멈추게 하려는 것’
  - ‘제사를 드리는 일을 그치게 하려는 것’
  rationale: 본문은 단순한 일반 행동이 아니라 다른 신들에게 바치는 제의 행위를 말하므로, ‘분향’이 가장 직접적인 대응입니다. 동시에 목적절 구조를 살려 ‘하려는 것이었습니다’로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve cultic specificity without over-paraphrase.'
