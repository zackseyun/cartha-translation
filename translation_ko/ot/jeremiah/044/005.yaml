  - severity: medium
    issue: 각주가 본문과 실질적으로 중복됨
    rationale: 초안 본문이 이미 ‘분향’을 사용하므로, ‘직역하면 … 분향’이라는 각주는 별도의 어휘 대안이나 해설을 제공하지 않습니다.
  revised_text: 그러나 그들은 듣지도 않았고, 자기들의 악에서 돌이켜 다른 신들에게 분향하지 않도록 귀를 기울이지도 않았습니다.
