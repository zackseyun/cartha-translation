revisions:
- from: 그러나 그들은 듣지 않았고, 귀를 기울이지도 않았습니다. 자기들의 악에서 돌아서서 다른 신들에게 분향하는 일을 그치게 하려는 것이었습니다.[a]
  to: 그러나 그들은 듣지도 않았고, 자기들의 악에서 돌이켜 다른 신들에게 분향하지 않도록 귀를 기울이지도 않았습니다.
  rationale: 목적/결과를 나타내는 לְבִלְתִּי를 ‘…하지 않도록’으로 옮겨, 듣고 귀를 기울이는 일이 악에서 돌이키고 우상들에게 분향하지 않는 데 이르도록 하는 반응이었음을 보존했습니다. ‘분향하다’는 קטר의 제의적 구체성을 직접 반영하므로 중복 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
