  text: וּ/פָקַדְתִּ֗י עַ֤ל הַ/יּֽוֹשְׁבִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי עַל יְרֽוּשָׁלִָ֑ם בַּ/חֶ֥רֶב בָּ/רָעָ֖ב וּ/בַ/דָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/013.yaml
  text: And I will punish those who dwell in the land of Egypt[a], just as I punished Jerusalem, with the sword, with famine[b], and with pestilence.
  footnotes:
  - marker: a
    text: Or 'I will visit judgment on those who dwell in the land of Egypt ... as I visited Jerusalem.' The Hebrew verb פקד can mean 'attend to,' 'visit,' or, in judgment contexts like this one, 'punish.'
    reason: lexical_alternative
  - marker: b
    text: '''Pestilence'' may also be rendered ''plague.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 예루살렘을 칼과 기근과 전염병으로 벌했던 것처럼 이집트 땅에 사는 자들을 벌하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 이집트 땅에 사는 자들에게 심판을 내리겠다. 예루살렘에 심판을 내렸던 것처럼.’ 히브리어 פקד는 ‘살피다’, ‘방문하다’를 뜻할 수 있으며, 이처럼 심판의 문맥에서는 ‘벌하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘전염병’은 ‘역병’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  english_pob_choice: And I will punish
  chosen_korean: 벌을 내리겠고
  alternatives_korean:
  - 내가 처벌하겠고
  - 내가 살피겠고
  - 내가 징벌하겠고
  lexicon: HALOT
  rationale: פקד는 심판 문맥에서 ‘징벌하다/벌하다’의 의미가 분명하므로, 현대 한국어에서 바로 이해되는 ‘벌을 내리다’로 옮겼습니다.
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרַיִם
  english_pob_choice: those who dwell in the land of Egypt
  chosen_korean: 이집트 땅에 사는 자들
  alternatives_korean:
  - 이집트 땅에 거주하는 자들
  - 이집트 땅의 주민들
  lexicon: HALOT
  rationale: 현재분사의 거주 의미를 살리되, 한국어에서는 ‘사는 자들’이 가장 자연스럽고 문장 흐름도 매끄럽습니다.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  english_pob_choice: with the sword, with famine, and with pestilence
  chosen_korean: 칼과 기근과 전염병으로
  alternatives_korean:
  - 칼과 기근과 역병으로
  - 칼과 굶주림과 전염병으로
  lexicon: HALOT
  rationale: 히브리어의 세 가지 심판 도구를 병렬로 유지했습니다. ‘דבר’는 문맥상 ‘전염병/역병’이 가능하지만, 여기서는 판데믹적 재앙을 분명히 하는 ‘전염병’이 자연스럽습니다.
theological_decisions:
- issue: פקד의 심판적 의미를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘벌을 내리다’로 심판성을 직접 표기했습니다.
  alternative_readings:
  - ‘살피다’처럼 더 중립적으로 옮길 수 있습니다.
  - ‘징벌하다’로 더 법정적 어감을 줄 수도 있습니다.
  rationale: 문맥이 예루살렘에 대한 동일한 심판과 비교되는 명시적 재앙 목록이므로, 독자가 즉시 심판 선언으로 이해하도록 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source-language primacy over tradition.'
