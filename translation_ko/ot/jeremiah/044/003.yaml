  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
  footnotes:
  - marker: a
    text: Or 'to worship other gods.' The Hebrew verb can denote religious service or worship.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''whom neither they nor you nor your fathers had known.'' The Hebrew closes with an emphatic listing: ''they, you, and your fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 나를 노하게 하려고 가서 다른 신들에게 향을 피우고 그 신들을 섬김으로써 저지른 악행 때문입니다.[a] 그 신들은 그들과 너희와 너희 조상들이 알지 못하던 신들입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 신들을 예배하고’로 옮길 수 있습니다. 히브리어 ‘섬기다’는 신에게 드리는 종교적 섬김 또는 예배를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들, 너희, 그리고 너희의 아버지들’입니다. 히브리어는 이 세 집단을 문장 끝에 강조하여 나열합니다.
    reason: lexical_alternative
