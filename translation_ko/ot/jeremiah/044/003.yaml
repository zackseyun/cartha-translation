base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/003.yaml
  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
  footnotes:
  - marker: a
    text: Or 'to worship other gods.' The Hebrew verb can denote religious service or worship.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''whom neither they nor you nor your fathers had known.'' The Hebrew closes with an emphatic listing: ''they, you, and your fathers.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 악행 때문에—그들이 나를 노하게 하려고 행한 일 때문에—곧 다른 신들에게 향을 피우고 섬기러 간 일 때문입니다. 그 신들은 그들이, 너희가, 그리고 너희의 조상들이 알지 못하던 신들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 신들을 섬기려고’로도 옮길 수 있습니다. 히브리어 동사는 종교적 섬김이나 예배를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들, 너희, 그리고 너희의 조상들이 알지 못하던 신들’로도 옮길 수 있습니다. 히브리어는 끝부분에서 강조적 나열을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי רָעָתָם
  english_pob_choice: because of their evil
  chosen_korean: 그들의 악행 때문에
  alternatives_korean:
  - 그들의 악 때문에
  - 그들의 사악함 때문에
  lexicon: HALOT
  rationale: 문맥상 원인은 도덕적 악행이며, 한국어에서는 ‘악행’이 행위성과 악성 모두를 자연스럽게 드러냅니다.
- source_word: לְהַכְעִסֵנִי
  english_pob_choice: to provoke me to anger
  chosen_korean: 나를 노하게 하려고
  alternatives_korean:
