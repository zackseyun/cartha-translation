revisions:
- from: 그들의 악행 때문에—그들이 나를 노하게 하려고 행한 일 때문에—곧 다른 신들에게 향을 피우고 섬기러 간 일 때문입니다. 그 신들은 그들이, 너희가, 그리고 너희의 조상들이 알지 못하던 신들입니다.[a][b]
  to: 이는 그들이 나를 노하게 하려고 가서 다른 신들에게 향을 피우고 그 신들을 섬김으로써 저지른 악행 때문입니다.[a] 그 신들은 그들과 너희와 너희 조상들이 알지 못하던 신들입니다.[b]
  rationale: 개정문은 מִפְּנֵי를 ‘이는 … 때문입니다’로 자연스럽게 연결하고, ‘나를 노하게 하려고 가서 … 향을 피우고 … 섬김으로써’로 목적과 행위의 연속을 보존했습니다. 마지막의 הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם는 ‘그들과 너희와 너희 조상들’이라는 병렬로 옮겨, 원문의 강조적 나열을 유지했습니다. 주석 표지는 각각 해당 어휘와 마지막 나열에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:06Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 우상들에게 향을 피우고 섬기는 행위를 대체로 보존하지만, 첫 문장에서 원인의 표현을 반복하고 ‘섬기러 간 일’로 묶어 히브리어의 연속 부정사 구조를 다소 부자연스럽게 재구성합니다. 또한 וַאֲבֹתֵיכֶם은 ‘너희의 조상들’보다 ‘너희 조상들’ 또는 더 직접적으로 ‘너희의 아버지들’에 가깝습니다. 문맥상 자연스러운 한국어에서는 ‘너희 조상들’을 쓰되, 남성 복수인 원문의 지시 대상은 주석으로 명시할 수 있습니다.
  naturalness: ‘그 신들은 그들이, 너희가, 그리고 너희의 조상들이 알지 못하던 신들입니다’는 같은 명사를 반복하고 병렬 주어가 매끄럽지 않습니다. ‘그들과 너희와 너희 조상들이 알지 못하던 신들’로 고치면 강조적 나열과 현대 표준어의 자연스러움을 함께 살릴 수 있습니다.
  terminology: ‘악행’, ‘나를 노하게 하려고’, ‘향을 피우고’, ‘다른 신들’, ‘섬기다’는 적절합니다. לַעֲבֹד의 목적어는 한국어에서 ‘다른 신들을 섬기고’로 명시하는 편이 분명합니다. אֲבֹתֵיכֶם의 성별 특정성을 불필요하게 중화하지 않도록 ‘조상들’의 범위를 주석에서 밝혔습니다.
  issues:
  - severity: medium
    issue: 원인 구문의 중복 및 부자연스러운 재구성
    rationale: ‘그들의 악행 때문에—… 행한 일 때문에—… 간 일 때문입니다’는 מִפְּנֵי רָעָתָם과 관계절을 반복적으로 풀어 원문의 간결한 인과 구조를 흐립니다.
  - severity: medium
    issue: 마지막 관계절의 반복과 병렬성
    rationale: ‘그 신들은 … 알지 못하던 신들입니다’는 서술어 명사와 보어 명사가 중복되며, ‘그들이, 너희가’의 병렬도 한국어 문장 안에서 어색합니다.
  - severity: low
    issue: ‘조상들’에 대한 성별 특정성의 설명 부재
    rationale: 히브리어 אֲבֹתֵיכֶם은 문자적으로 ‘너희의 아버지들/선조들’입니다. 본문에서는 자연스러운 ‘너희 조상들’을 사용하되, 주석에서 원문의 남성 복수 표현을 밝혀 두는 것이 적절합니다.
