  - 나를 화나게 하려고
  lexicon: HALOT
  rationale: 히브리어의 원인적 뉘앙스를 살리면서, 하나님에 대한 반응을 합쇼체 문맥에 맞게 자연스럽게 옮겼습니다.
- source_word: לְקַטֵּר
  english_pob_choice: to burn incense
  chosen_korean: 향을 피우고
  alternatives_korean:
  - 분향하고
  - 향을 사르고
  lexicon: HALOT
  rationale: 우상 숭배 맥락의 ‘향을 피우다’가 가장 직관적이고 현대 한국어에서도 이해가 쉽습니다.
- source_word: לֵאלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들에게
  alternatives_korean:
  - 다른 신들을
  - 이방 신들에게
  lexicon: HALOT
  rationale: 히브리어의 복수 목적어와 대비를 살려 ‘다른 신들’로 직역성을 유지했습니다.
- source_word: אֲשֶׁר לֹא יְדָעוּם הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  english_pob_choice: whom they had not known—they, you, and your fathers.
  chosen_korean: 그 신들은 그들이, 너희가, 그리고 너희의 조상들이 알지 못하던 신들입니다.
  alternatives_korean:
  - 그들은 너희와 너희의 조상들이 알지 못하던 신들입니다.
  - 그 신들은 그들뿐 아니라 너희와 너희의 조상들도 알지 못하던 신들입니다.
  lexicon: HALOT
  rationale: 히브리어의 끝맺는 강조 목록을 한국어 문장 안에서 풀어 읽히도록 재구성했습니다. ‘조상들’은 남성형 ‘fathers’의 의미를 과도하게 중화하지 않으면서도 자연스럽습니다.
theological_decisions:
- issue: 마지막 절의 강조 구조 처리
  chosen_reading: 그 신들은 그들이, 너희가, 그리고 너희의 조상들이 알지 못하던 신들입니다.
  alternative_readings:
  - 그 신들은 그들뿐 아니라 너희와 너희의 조상들도 알지 못하던 신들입니다.
  - 그 신들은 너희와 너희 조상들이 알지 못하던 신들입니다.
  rationale: 본문의 수사적 강조는 단순한 정보 전달이 아니라, 그 우상들이 세대에 걸쳐 전혀 알려지지 않은 존재임을 누적적으로 드러냅니다. 이를 한국어에서도 분명히 보존했습니다.
  doctrine_reference: Translation philosophy §4 (source emphasis preservation)
