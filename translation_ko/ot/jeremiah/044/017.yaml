reference: Jeremiah 44:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת כָּל הַ/דָּבָ֣ר אֲשֶׁר יָצָ֣א מִ/פִּ֗י/נוּ לְ/קַטֵּ֞ר לִ/מְלֶ֣כֶת הַ/שָּׁמַיִם֮ וְ/הַסֵּֽיךְ לָ֣/הּ נְסָכִים֒ כַּ/אֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ וַ/אֲבֹתֵ֨י/נוּ֙ מְלָכֵ֣י/נוּ וְ/שָׂרֵ֔י/נוּ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָ֑ם וַ/נִּֽשְׂבַּֽע לֶ֨חֶם֙ וַ/נִּֽהְיֶ֣ה טוֹבִ֔ים וְ/רָעָ֖ה לֹ֥א רָאִֽינוּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/017.yaml
  text: 'But we will certainly do every word that has gone out from our mouth: to burn incense to the Queen of Heaven and to pour out drink offerings to her[a], just as we and our fathers, our kings and our officials, did in the cities of Judah and in the streets of Jerusalem; then we had plenty of bread, prospered[b], and saw no disaster.'
  footnotes:
  - marker: a
    text: Or 'we were satisfied with bread' (literally, 'we were filled with bread').
    reason: lexical_alternative
  - marker: b
    text: Or 'fared well' for 'prospered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리는 우리 입에서 나온 모든 말을 반드시 실행할 것입니다. 곧 하늘의 여왕에게 분향하고 그에게 전제물을 부어 드리겠습니다[a]. 우리가 우리 조상들과 우리 왕들과 우리 지도자들과 함께 유다 성읍들과 예루살렘 거리에서 했던 것처럼 말입니다. 그때는 우리가 빵을 넉넉히 먹었고[b], 잘 지냈으며, 재난을 보지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그에게 술제물을 부어 드리겠습니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 '빵으로 배부르며' 또는 '빵을 충분히 먹었고'.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשֹׂה נַעֲשֶׂה
  english_pob_choice: we will surely do
  chosen_korean: 반드시 실행할 것입니다
  alternatives_korean:
  - 꼭 하겠습니다
  - 정말 하겠습니다
  lexicon: HALOT
  rationale: תחביר의 강조용 부정사 절대형과 유한동사는 한국어에서 중복 표현보다 '반드시' 같은 강한 확언으로 옮기는 것이 자연스럽고, 반역적 결의를 분명히 드러냅니다.
- source_word: אֶת כָּל הַדָּבָר אֲשֶׁר יָצָא מִפִּינוּ
  english_pob_choice: every word that has gone out from our mouth
  chosen_korean: 우리 입에서 나온 모든 말
  alternatives_korean:
  - 우리 입에서 나온 모든 말씀
  - 우리 입에서 나온 모든 것
  lexicon: HALOT
  rationale: דָּבָר는 여기서 '말'로 읽는 것이 가장 직접적이며, '입에서 나온'이라는 히브리어 표현을 그대로 살려 그들이 스스로 맹세한 내용을 가리키게 했습니다.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  english_pob_choice: the Queen of Heaven
  chosen_korean: 하늘의 여왕
  alternatives_korean:
  - 하늘의 여왕신
  - 하늘 여왕
  lexicon: HALOT
  rationale: 우상 숭배의 칭호를 완화하지 않고 직역에 가깝게 옮겼으며, 한국어에서 통용되는 '하늘의 여왕'을 사용해 polemic의 강도를 유지했습니다.
- source_word: וְהַסֵּיךְ לָהּ נְסָכִים
  english_pob_choice: and to pour out drink offerings to her
  chosen_korean: 그에게 전제물을 부어 드리겠습니다
  alternatives_korean:
  - 그녀에게 전제물을 쏟아 붓겠습니다
  - 그에게 술제물을 부어 드리겠습니다
  lexicon: HALOT
  rationale: נְסָכִים은 제의적 '전제물'이 가장 정확하며, 이 문맥의 숭배 대상을 직접 가리키는 대명사는 한국어에서 문법 성별보다 대상 지칭을 우선해 처리했습니다.
- source_word: וַנִּשְׂבַּע לֶחֶם
  english_pob_choice: we had plenty of bread
  chosen_korean: 빵을 넉넉히 먹었고
  alternatives_korean:
  - 빵을 충분히 먹었고
  - 빵으로 배부르며
  lexicon: HALOT
  rationale: 직역의 '빵으로 배부르다'보다 의미상 풍족함을 자연스럽게 전달하는 표현을 택했지만, הלחם의 식량/풍요 이미지는 유지했습니다.
- source_word: וַנִּהְיֶה טוֹבִים
  english_pob_choice: were well
  chosen_korean: 잘 지냈으며
  alternatives_korean:
  - 형편이 좋았으며
  - 번영했으며
  lexicon: HALOT
  rationale: 히브리어의 직설적 '좋았다/잘되었다'를 한국어 관용 표현으로 옮겨, 물질적·사회적 형편의 안정이라는 맥락을 과장 없이 살렸습니다.
theological_decisions:
- issue: 우상 숭배 대상의 호칭을 한국어에서 어떻게 처리할지
  chosen_reading: 하늘의 여왕
  alternative_readings:
  - 하늘 여왕
  - 하늘의 여왕신
  rationale: 이 칭호는 본문 안에서 비판 없이 화자들의 숭배 대상을 가리키므로, 기존 교회 용어로 순화하지 않고 직설적으로 유지하는 것이 원문 의미와 수사적 긴장을 보존합니다.
  doctrine_reference: 우상 숭배 경고 본문에서 대상 명칭을 완화하지 않는 번역 원칙
- issue: 전제 동사의 대상 대명사 성별을 한국어에서 어떻게 처리할지
  chosen_reading: 그에게 전제물을 부어 드리겠습니다
  alternative_readings:
  - 그녀에게 전제물을 부어 드리겠습니다
  - 그것에게 전제물을 부어 드리겠습니다
  rationale: 히브리어는 여성형 대상이지만 한국어 대명사는 자연스럽게 대상의 칭호를 받지 못하므로, 문맥상 우상 숭배 대상을 지시하는 '그'로 처리해 제의 행위를 분명히 했습니다.
  doctrine_reference: 문법 성별이 없는 한국어에서 숭배 대상 지시의 자연스러운 처리
