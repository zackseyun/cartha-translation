    issue: ‘그에게 전제물을 부어 드리겠습니다’
    rationale: 원문 수혜 대명사 לָהּ는 여성형이며 선행 칭호도 ‘하늘의 여왕’입니다. 한국어에서 대명사를 생략하거나 칭호를 반복할 수 있는데, 남성 지시인 ‘그’는 이를 보존하지 못합니다. 또한 ‘드리다’는 객체 높임을 덧붙이므로 원문의 단순 제의 동사보다 한 단계 높은 존대 뉘앙스를 냅니다.
