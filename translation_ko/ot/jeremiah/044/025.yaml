  text: כֹּֽה אָמַ֣ר יְהוָֽה צְבָאוֹת֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אַתֶּ֨ם וּ/נְשֵׁי/כֶ֜ם וַ/תְּדַבֵּ֣רְנָה בְּ/פִי/כֶם֮ וּ/בִ/ידֵי/כֶ֣ם מִלֵּאתֶ֣ם לֵ/אמֹר֒ עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶת נְדָרֵ֗י/נוּ אֲשֶׁ֤ר נָדַ֨רְנוּ֙ לְ/קַטֵּר֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הָקֵ֤ים תָּקִ֨ימְנָה֙ אֶת נִדְרֵי/כֶ֔ם וְ/עָשֹׂ֥ה תַעֲשֶׂ֖ינָה אֶת נִדְרֵי/כֶֽם־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/025.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: You and your wives have spoken with your mouths and fulfilled it with your hands, saying, ‘We will surely carry out our vows that we have vowed, to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ Go ahead, confirm your vows and carry out your vows.'
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님이 이렇게 말씀하십니다. 너희와 너희 아내들이 입으로 말하고 손으로 실천하여 이르기를, ‘우리는 반드시 우리가 서원한 서원을 실행하여 하늘의 여왕에게 향을 피우고 그에게 전제물을 붓겠습니다.’ 그러니 너희의 서원을 확정하고 너희의 서원을 실행하십시오.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘만군의 야훼’는 히브리어 יְהוָה צְבָאוֹת의 직역입니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: יהוה / צְבָאוֹת
  rationale: 야훼를 기본 표기로 유지하고, צְבָאוֹת은 군대의 복수성을 살려 관용적으로 ‘만군의’로 옮겼습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 신
  - 이스라엘의 하나님이신 분
  lexicon: אֱלֹהִים
  rationale: 언약 호칭으로서의 Θεός/אֱלֹהִים 계열을 한국어 관용에 따라 ‘하나님’으로 옮겼습니다.
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  english_pob_choice: to pour out drink offerings to her
  chosen_korean: 그에게 전제물을 붓고
  alternatives_korean:
  - 그녀에게 전제를 따르고
  - 그에게 술을 부어 바치고
  lexicon: נֶסֶךְ
  rationale: ‘전제물’은 제의적 희생/관주 행위를 가리키는 표준적 한국어 성서 용어이므로, 동작은 ‘붓다’로 직역해 제의성을 보존했습니다.
- source_word: מִלֵּאתֶם לֵאמֹר / עָשֹׂה נַעֲשֶׂה
  english_pob_choice: fulfilled it with your hands, saying, ‘We will surely carry out...’
  chosen_korean: 입으로 말하고 손으로 실천하여 이르기를, ‘우리는 반드시 … 실행하겠습니다’
  alternatives_korean:
  - 손으로 이루어
  - 행동으로 옮겨
  lexicon: פֶּה / יָד + נדר
  rationale: ‘입/손’의 병렬을 살려 말과 행위의 일치를 드러내고, עשה의 강조형을 ‘반드시 … 실행하다’로 옮겨 서원의 결단성을 반영했습니다.
theological_decisions:
- issue: ‘Queen of Heaven’의 표기
  chosen_reading: ‘하늘의 여왕’으로 직역하여 우상 숭배 대상의 호칭을 그대로 드러냈습니다.
  alternative_readings:
  - 하늘 여신
  - 천상의 여왕
  rationale: 원문은 פולחן 대상의 직함을 직접 제시하므로, 익숙한 교회적 완곡어법보다 직역이 우상 숭배의 충돌을 더 분명히 드러냅니다.
  doctrine_reference: 본문의 우상 숭배 비판 맥락(예레미야 44장 전체)
