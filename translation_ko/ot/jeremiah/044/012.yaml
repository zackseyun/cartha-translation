review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘얼굴을 돌린’은 히브리어 שָׂמוּ פְנֵיהֶם(어떤 행동을 향해 얼굴을 두다, 곧 뜻을 굳히다)의 방향과 결의를 반대로 나타낼 수 있습니다. 또한 וְלָקַחְתִּי의 비교적 중립적인 ‘취하다/데려가다’보다 ‘붙잡다’는 포획의 뜻을 다소 과도하게 보탭니다. 가장 중요한 점으로, 두 번째 יִתַּמּוּ(‘끝나다/멸망하다’)가 본문에서 빠져 있어 반복되는 심판 선언이 축소되었습니다. אָלָה와 קְלָלָה도 본문에서 모두 ‘저주’로 평준화되어 원문의 구별이 사라졌고, 각주 표지가 해당 어휘가 아닌 첫 문장 끝에 놓여 있습니다.
  naturalness: 합쇼체와 전반적 문장은 적절하나, ‘이집트 땅에서 끝날 것입니다’는 현대 한국어에서 부자연스럽습니다. ‘멸망할 것입니다’를 두 차례 반복하면 히브리어의 반복을 유지하면서도 자연스럽습니다. ‘경악거리’와 ‘치욕거리’는 이 문맥의 공적 수치와 두려움의 대상이라는 뜻을 자연스럽게 전달합니다.
  terminology: ‘유다의 남은 자들’과 ‘거류하다’는 적절합니다. אָלָה는 뒤의 קְלָלָה와 구별하여 ‘저주의 맹세’로 옮기고 각주로 ‘저주 공식’ 또는 ‘저주의 본보기’ 가능성을 밝혀야 합니다. שַׁמָּה는 단순한 내적 감정인 ‘공포’보다 사람들이 보고 느끼는 ‘경악거리’가 문맥에 더 맞습니다.
  issues:
  - severity: high
    issue: ‘얼굴을 돌린’이 שָׂמוּ פְנֵיהֶם의 뜻을 왜곡할 수 있습니다.
    rationale: 이 관용구는 이집트로 가서 거류하기로 결심하고 그쪽을 향했다는 뜻입니다. 한국어 ‘얼굴을 돌리다’는 흔히 외면하거나 반대 방향으로 돌린다는 뜻입니다.
  - severity: high
    issue: 두 번째 ‘멸망하다/끝나다’ 선언(יִתַּמּוּ)이 누락되었습니다.
    rationale: 원문은 ‘모두 끝나다’와 ‘작은 자부터 큰 자까지 끝나다’를 반복한 뒤, 칼과 기근으로 죽는다고 다시 말합니다. 초안은 이 가운데 두 번째 반복을 생략했습니다.
  - severity: medium
    issue: אָלָה와 קְלָלָה가 모두 ‘저주’로 번역되어 어휘 구별이 사라졌습니다.
    rationale: 두 명사는 관련되지만 동일하지 않습니다. אָלָה의 맹세/저주 공식의 뉘앙스를 본문 또는 적절히 연결된 각주에서 보존해야 합니다.
  - severity: medium
    issue: 각주 표지가 ‘거류하려고’ 절 뒤에 놓였습니다.
    rationale: 제시된 각주는 אָלָה를 설명하므로, 본문 끝의 해당 번역어 바로 뒤에 표지를 두어야 합니다.
  - severity: low
    issue: ‘붙잡을 것입니다’는 וְלָקַחְתִּי보다 강한 포획의 뉘앙스를 줄 수 있습니다.
    rationale: 심판 문맥은 유지하되, 원문의 기본 뜻에 가까운 ‘데려갈 것입니다’가 더 안전합니다.
