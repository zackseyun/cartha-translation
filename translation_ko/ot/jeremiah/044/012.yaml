base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/012.yaml
  text: And I will take the remnant of Judah who have set their faces to enter the land of Egypt to sojourn there[a], and they will all come to an end in the land of Egypt. They will fall by the sword and by famine; from the least even to the greatest, they will come to an end. By the sword and by famine they will die, and they will become an oath, a horror, a curse, and a reproach.
  footnotes:
  - marker: a
    text: Or 'an oath of cursing' / 'a curse-formula.' The Hebrew אָלָה often refers to an oath that invokes a curse.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 유다의 남은 자들, 곧 이집트 땅에 들어가 거기에 거류하기로 뜻을 굳힌 자들을 데려갈 것입니다. 그들은 모두 이집트 땅에서 멸망할 것입니다. 그들은 칼과 기근으로 쓰러질 것이며, 작은 자부터 큰 자까지 멸망할 것입니다. 그들은 칼과 기근으로 죽을 것이며, 저주의 맹세[a]와 경악거리와 저주와 치욕거리가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주 공식’ 또는 ‘저주의 본보기’. 히브리어 אָלָה는 저주를 불러오는 맹세를 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  english_pob_choice: And I will take
  chosen_korean: 나는 … 붙잡을 것입니다
  alternatives_korean:
  - 나는 … 취할 것입니다
  - 나는 … 데려갈 것입니다
  lexicon: HALOT
  rationale: 심판 맥락에서 단순한 ‘가져감’보다 하나님의 주도적 개입과 포획의 뉘앙스를 살리기 위해 ‘붙잡다’를 택했습니다.
- source_word: שְׁאֵרִית יְהוּדָה
  english_pob_choice: the remnant of Judah
  chosen_korean: 유다의 남은 자
  alternatives_korean:
  - 유다의 나머지
  - 유다의 생존자들
  lexicon: HALOT
  rationale: שְׁאֵרִית의 예언서적 관용을 살려 ‘남은 자’로 옮겼습니다.
- source_word: שָׂמוּ פְנֵיהֶם
  english_pob_choice: who have set their faces
  chosen_korean: 얼굴을 돌린
  alternatives_korean:
  - 결심한
  - 향한
  lexicon: HALOT
  rationale: 직역적 이미지를 유지하되 한국어로 자연스럽게 읽히도록 ‘얼굴을 돌리다’로 옮겨 결의와 방향성을 함께 드러냈습니다.
- source_word: לָגוּר שָׁם
  english_pob_choice: to sojourn there
  chosen_korean: 그곳에 거류하려고
  alternatives_korean:
  - 그곳에 나그네로 살려고
  - 그곳에 머무르려고
  lexicon: HALOT
  rationale: גור의 ‘임시 거주/나그네 거주’ 의미를 살리기 위해 ‘거류하다’를 사용했습니다.
- source_word: וְתַמּוּ כֹל / יִתַּמּוּ
  english_pob_choice: they will all come to an end / they will come to an end
  chosen_korean: 그들은 모두 … 끝날 것입니다
  alternatives_korean:
  - 그들은 모두 … 소멸될 것입니다
  - 그들은 모두 … 멸망할 것입니다
  lexicon: HALOT
  rationale: 되풀이되는 תם의 반복을 한국어에서도 보이게 하려고 같은 어근감의 ‘끝나다’를 유지했습니다.
- source_word: וְהָיוּ לְאָלָה לְשַׁמָּה וְלִקְלָלָה וּלְחֶרְפָּה
  english_pob_choice: and they will become an oath, a horror, a curse, and a reproach
  chosen_korean: 그들은 저주, 공포, 저주, 그리고 치욕이 될 것입니다
  alternatives_korean:
  - 그들은 저주의 맹세, 공포, 저주, 그리고 치욕이 될 것입니다
  - 그들은 저주, 황망함, 저주, 그리고 수치가 될 것입니다
  lexicon: HALOT
  rationale: אָלָה와 קְלָלָה의 중첩된 관련성을 한국어에서 간결하게 드러내되, 후자의 뚜렷한 ‘저주’ 의미를 유지했습니다.
theological_decisions:
- issue: אָלָה와 קְלָלָה의 구별
  chosen_reading: 둘 다 ‘저주’ 계열로 옮기되, 전체 문맥의 반복적 심판 공식을 우선해 간결하게 제시했습니다.
  alternative_readings:
  - אָלָה를 ‘맹세-저주’로 풀어 쓰기
  - 두 단어를 모두 같은 말로 평준화하기
  rationale: 히브리어는 서로 관련된 두 용어를 연속해서 사용합니다. 한국어 본문에서는 과도한 설명을 피하면서도 심판의 낙인 효과를 보존하는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §5
