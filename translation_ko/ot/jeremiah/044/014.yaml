source:
  edition: WLC
  text: וְ/לֹ֨א יִהְיֶ֜ה פָּלִ֤יט וְ/שָׂרִיד֙ לִ/שְׁאֵרִ֣ית יְהוּדָ֔ה הַ/בָּאִ֥ים לָ/גֽוּר שָׁ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לָ/שׁ֣וּב אֶ֣רֶץ יְהוּדָ֗ה אֲשֶׁר הֵ֜מָּה מְנַשְּׂאִ֤ים אֶת נַפְשָׁ/ם֙ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת שָׁ֔ם כִּ֥י לֹֽא יָשׁ֖וּבוּ כִּ֥י אִם פְּלֵטִֽים־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/014.yaml
  text: So there will be no fugitive or survivor for the remnant of Judah who are coming to sojourn there in the land of Egypt and then to return to the land of Judah[a], to which they are lifting up their soul to return and dwell there; for they will not return, except for fugitives.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''lifting up their soul''—that is, longing or setting their desire to return.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하면 이집트 땅에 머물러 거주하러 왔고, 유다 땅으로 돌아가 그곳에 다시 살기를 자기 영혼을 들어 바라던 유다의 남은 자에게는 도망자도 생존자도 없을 것입니다. 그들은 돌아오지 못하고, 도망한 자들만 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘영혼을 들어 올리다’이며 여기서는 ‘간절히 바라다, 마음을 두다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּלִיט
  english_pob_choice: fugitive
  chosen_korean: 도망자
  alternatives_korean:
  - 달아난 자
  - 도피자
  lexicon: HALOT
  rationale: 재난 문맥에서 ‘도망자’는 탈출한 사람이라는 기본 뜻을 살리면서도 앞의 ‘생존자’와 자연스럽게 짝을 이룹니다.
- source_word: שָׂרִיד
  english_pob_choice: survivor
  chosen_korean: 생존자
  alternatives_korean:
  - 남은 자
  - 살아남은 자
  lexicon: HALOT
  rationale: ‘생존자’는 단순히 남아 있는 존재를 뜻해 심판 문맥의 대비를 분명하게 보여 줍니다.
- source_word: לִשְׁאֵרִית יְהוּדָה
  english_pob_choice: the remnant of Judah
  chosen_korean: 유다의 남은 자
  alternatives_korean:
  - 유다의 남은 무리
  - 유다의 남은 사람들
  lexicon: HALOT
  rationale: ‘남은 자’는 예언서에서 정착된 표현이며, 여기서는 구원론적 칭호보다 역사적으로 살아남은 무리를 가리키는 중립적 표현으로 유지했습니다.
- source_word: הַבָּאִים לָגוּר שָׁם
  english_pob_choice: who are coming to sojourn there
  chosen_korean: 머물러 거주하러 왔고
  alternatives_korean:
  - 거기에서 나그네로 살러 왔고
  - 거기에서 임시로 거주하러 왔고
  lexicon: HALOT
  rationale: ‘גור’의 나그네/거류 뉘앙스를 살리되 한국어에서는 ‘머물러 거주하다’로 자연스럽게 옮겼습니다.
- source_word: אֲשֶׁר הֵמָּה מְנַשְּׂאִים אֶת נַפְשָׁם
  english_pob_choice: to which they are lifting up their soul
  chosen_korean: 자기 영혼을 들어 바라던
  alternatives_korean:
  - 자기 영혼을 들어 올리며 원하는
  - 간절히 돌아가기를 바라는
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘영혼을 들어 올리다’를 완전히 풀지 않고, 본문의 정서적 강도를 드러내도록 ‘바라다’와 결합해 옮겼습니다.
- source_word: כִּי אִם פְּלֵטִים
  english_pob_choice: except for fugitives
  chosen_korean: 도망한 자들만 있을 것입니다
  alternatives_korean:
  - 도망자들만 있을 것입니다
  - 달아난 자들 외에는 없을 것입니다
  lexicon: HALOT
  rationale: 마지막 절의 예외 구문을 한국어로 자연스럽게 풀어, ‘오직 도망한 자들만’이라는 제한을 분명히 했습니다.
theological_decisions:
- issue: ‘남은 자’의 신학적 뉘앙스
  chosen_reading: 본문의 ‘남은 자’를 신실한 남은 자로 확장하지 않고, 심판 아래 남아 있는 유다 사람들을 가리키는 역사적 표현으로 유지했습니다.
  alternative_readings:
  - 신실한 남은 자
  - 언약적 남은 무리
  rationale: 문맥이 이집트로 내려간 유다인들에 대한 심판 선언이므로, 긍정적 신학 의미를 덧씌우지 않는 것이 स्रोत의 의도를 더 정확히 반영합니다.
  doctrine_reference: 'Translation philosophy: Never import doctrinal claims the text does not make.'
