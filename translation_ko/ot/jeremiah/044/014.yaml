revisions:
- from: 그리하면 이집트 땅에 머물러 거주하러 왔고, 유다 땅으로 돌아가 그곳에 다시 살기를 자기 영혼을 들어 바라던 유다의 남은 자에게는 도망자도 생존자도 없을 것입니다. 그들은 돌아오지 못하고, 도망한 자들만 있을 것입니다.[a]
  to: 이집트 땅에 거류하려고 들어온 유다의 남은 자들, 곧 유다 땅으로 돌아가 그곳에 살기를 간절히 바라는[a] 자들에게는 피한 자도 살아남은 자도 없을 것입니다. 피한 자들 외에는 아무도 돌아오지 못할 것입니다.
  rationale: 원문의 문장 구조와 예외 구문을 보존하도록 고쳤습니다. ‘유다 땅으로 돌아가 그곳에 살기를 간절히 바라는’은 ‘그 땅을 향해 자기 영혼을 들어 올려, 돌아가 그곳에 살고자 하는’이라는 히브리어 관용구와 두 부정사의 의미를 자연스러운 한국어로 전달합니다. 마지막 문장은 원문의 긴장, 곧 아무도 피하거나 살아남지 못한다는 심판 선언과 ‘피한 자들’이라는 제한적 예외를 그대로 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:40Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 심판의 대상, 이집트 거류, 유다 땅으로 돌아가 살고자 하는 열망을 대체로 반영합니다. 그러나 첫머리의 ‘그리하면’은 히브리어 접속사 וְלֹא의 단순한 연결·부정을 조건/결과처럼 바꾸며, 마지막 ‘도망한 자들만 있을 것입니다’는 ‘피한 자들 외에는 돌아오지 못할 것이다’라는 예외 구문의 의미를 정확히 옮기지 못합니다.
  naturalness: ‘머물러 거주하러 왔고’와 ‘자기 영혼을 들어 바라던’은 현대 표준어 합쇼체 성경 문장으로 다소 부자연스럽습니다. ‘거류하려고 들어온’, ‘간절히 바라는’으로 정리하면 자연스럽고, 각 절의 수식 관계도 명료해집니다.
  terminology: פָּלִיט/פְּלֵטִים은 재난 문맥에서 범죄자를 연상시킬 수 있는 ‘도망자’보다 ‘피한 자’가 더 중립적이고 정확합니다. שָׂרִיד는 ‘살아남은 자’로 옮겨 앞말과의 구별을 유지했습니다. ‘유다의 남은 자들’은 집합 명사인 원문의 뜻을 자연스럽게 드러내며, 긍정적 신학적 의미를 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ‘그리하면’이 원문의 단순 접속과 부정을 조건적 결과로 바꿉니다.
    rationale: וְלֹא는 ‘그러므로/그리하면’이 아니라 ‘그리고/그러나 … 아니다’의 연결입니다. 문맥상 한국어에서는 별도 접속 표현 없이 심판 선언을 시작하는 것이 정확합니다.
  - severity: high
    issue: 마지막 예외 절의 뜻이 바뀌었습니다.
    rationale: כִּי לֹא יָשׁוּבוּ כִּי אִם פְּלֵטִים은 ‘피한 자들 외에는 돌아오지 못할 것이다’라는 뜻입니다. 초안의 ‘도망한 자들만 있을 것입니다’는 ‘돌아오다’라는 핵심 동작을 빠뜨리고 존재 진술로 바꿉니다.
  - severity: medium
    issue: 관용구 각주의 앵커가 해당 표현이 아니라 문장 끝에 놓여 있습니다.
    rationale: 각주는 ‘간절히 바라는’으로 번역된 ‘영혼을 들어 올리다’ 관용구 바로 뒤에 두어야 참조 대상이 분명합니다.
  - severity: low
    issue: ‘도망자’는 재난에서 벗어난 사람이라는 문맥보다 범죄적 도주자를 연상시킬 수 있습니다.
    rationale: פָּלִיט의 재난·심판 문맥에는 ‘피한 자’가 더 중립적이며, 단수와 복수 모두 일관되게 처리할 수 있습니다.
