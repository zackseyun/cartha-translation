source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר דִּבַּ֥רְתָּ אֵלֵ֖י/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה אֵינֶ֥/נּוּ שֹׁמְעִ֖ים אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/016.yaml
  text: As for the word that you have spoken to us in the name of Yahweh[a], we will not listen to you.
  footnotes:
  - marker: a
    text: Or 'we will not obey you.' The Hebrew verb can imply both hearing and heeding; the main text keeps the more direct lexical sense, while the context clearly includes refusal to obey.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 야훼의 이름으로 우리에게 말한 그 말씀은, 우리는 당신의 말을 듣지 않겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘듣지 않겠습니다’이지만, 문맥상 ‘순종하지 않겠습니다’의 뜻이 분명히 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 그 말씀
  alternatives_korean:
  - 그 말
  - 그 일
  - 그 메시지
  lexicon: HALOT
  rationale: דָּבָר는 ‘말/말씀/일’로 넓게 쓰이지만, 여기서는 예언자가 이미 전한 발언을 가리키므로 ‘그 말씀’이 가장 자연스럽고 직접적입니다.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֵלֵינוּ
  english_pob_choice: that you have spoken to us
  chosen_korean: 당신이 우리에게 말한
  alternatives_korean:
  - 당신이 우리에게 말씀하신
  - 당신이 우리에게 전한
  lexicon: HALOT
  rationale: 완료된 발화 사실을 살리되 현대 한국어에서는 ‘말한’이 가장 직설적입니다. 예언자에게 주어지는 높임을 과도하게 넣지 않고 원문의 대치 구조를 유지했습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 이름 안에서
  - 야훼의 권위로
  lexicon: HALOT
  rationale: ‘이름으로’는 히브리어 관용구를 가장 직접적으로 옮기며, 본문이 야훼의 이름을 매개로 한 예언 발화를 말하므로 이 표현을 유지했습니다.
- source_word: אֵינֶנּוּ שֹׁמְעִים אֵלֶיךָ
  english_pob_choice: we will not listen to you
  chosen_korean: 우리는 당신의 말을 듣지 않겠습니다
  alternatives_korean:
  - 우리는 당신에게 순종하지 않겠습니다
  - 우리는 당신의 말을 듣지 않으렵니다
  lexicon: HALOT
  rationale: שׁמע는 여기서 단순 청취보다 ‘귀 기울여 받아들임’의 거절을 포함하지만, 본문 차원에서는 ‘듣지 않겠습니다’가 어휘와 거절의 의지를 함께 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기적 발화는 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 ‘야훼’로 옮겨 언약적 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: שׁמע의 거절 뉘앙스
  chosen_reading: 듣지 않겠습니다
  alternative_readings:
  - 순종하지 않겠습니다
  - 듣지 않으렵니다
  rationale: 이 문맥에는 불순종이 분명히 함축되지만, 본문 번역은 먼저 ‘듣다’의 어휘를 살리고 불순종의 함의를 독자가 문맥에서 읽도록 두는 편이 원문에 가깝습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
