  lexicon: HALOT
  rationale: 직접 명령형의 호소를 합쇼체로 옮기되, 예언자적 관용구인 '말씀'을 유지했습니다.
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם / who dwell in the land of Egypt
  english_pob_choice: who dwell in the land of Egypt
  chosen_korean: 이집트 땅에 거주하는
  alternatives_korean:
  - 이집트 땅에 사는
  - 이집트 땅에 머무는
  lexicon: HALOT
  rationale: '''거주하다''는 정착된 삶을 드러내는 참여형 표현을 비교적 직접적으로 반영합니다.'
- source_word: שְׁמִי נִקְרָא בְּפִי / my name shall no longer be called upon by the mouth of
  english_pob_choice: my name shall no longer be called upon by the mouth of
  chosen_korean: 내 이름이 다시는 불리지 않을 것입니다
  alternatives_korean:
  - 내 이름이 다시는 입에 오르지 않을 것입니다
  - 내 이름이 다시는 불려지지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 이름을 입으로 부르며 맹세에 끌어오는 행위이므로, 한국어에서는 자연스러운 피동 표현으로 옮기되 '다시는'으로 금지의 강도를 살렸습니다.
- source_word: חַי אֲדֹנָי יְהוִה / As the Lord GOD lives
  english_pob_choice: As the Lord GOD lives
  chosen_korean: “주 야훼께서 살아 계십니다”
  alternatives_korean:
