base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/026.yaml
  text: 'Therefore hear the word of Yahweh[a], all Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says Yahweh, that my name shall no longer be called upon by the mouth of any man of Judah in all the land of Egypt, saying, ‘As the Lord GOD lives.’'
  footnotes:
  - marker: a
    text: Or, 'my name shall no longer be on the lips of any man of Judah.' The Hebrew idiom literally speaks of God's name being 'called in the mouth' of someone, referring here to invoking it in an oath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이집트 땅에 거주하는 모든 유다 사람이여, 야훼의 말씀을 들으십시오. 보십시오, 야훼가 말씀하십니다. 나는 내 위대한 이름을 두고 맹세하였습니다. 이집트 온 땅에서 ‘주 야훼께서 살아 계십니다’라고 말하는 유다 사람 누구의 입에서도 내 이름이 다시는 불리지[a] 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 이름이 어떤 유다 사람의 입에서 불리다’라고 말합니다. 이는 여기서 하나님의 이름을 맹세 공식으로 입에 올려 부르는 것을 가리킵니다.
    reason: lexical_alternative
