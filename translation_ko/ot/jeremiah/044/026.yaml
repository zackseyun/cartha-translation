  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 이름을 입으로 부르며 맹세에 끌어오는 행위이므로, 한국어에서는 자연스러운 피동 표현으로 옮기되 '다시는'으로 금지의 강도를 살렸습니다.
