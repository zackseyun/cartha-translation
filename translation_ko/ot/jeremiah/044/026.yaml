  - “주 여호와께서 살아 계십니다”
  lexicon: HALOT
  rationale: 맹세 공식의 인용문이므로 한국어에서도 관용적 종결문을 살려 옮겼고, אֲדֹנָי יְהוִה는 주와 야훼로 구분해 반영했습니다.
