  - “내가 … 넘기고 있습니다”
  rationale: 히브리어 분사와 בהנני의 선포적 성격은 다가오는 행동의 확실성을 강조하므로, 한국어에서도 단순 미래로 풀어 확정성을 살렸습니다.
  doctrine_reference: 예언 문맥의 확정된 신적 행위 묘사
