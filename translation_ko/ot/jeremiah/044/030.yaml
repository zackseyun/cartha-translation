base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/030.yaml
  text: 'Thus says Yahweh: Behold[a], I am giving Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those seeking his life, just as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar king of Babylon, his enemy and the one seeking his life.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; conventionally rendered ''Nebuchadnezzar'' in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「보라, 내가 이집트 왕 바로 홉라를 그의 원수들의 손과 그의 목숨을 찾는 자들의 손에 넘겨주겠다. 내가 유다 왕 시드기야를 바벨론 왕 느부갓레살의 손과, 그의 원수이며 그의 목숨을 찾는 자의 손에 넘겨준 것과 같이 말이다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름형은 ‘느부갓레살’에 더 가깝지만, 영어 POB처럼 통용형 ‘느부갓네살’도 널리 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 선언성을 살리되, 한국어에서는 현대적 합쇼체로 자연스럽게 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 이제
  - 참으로
  lexicon: HALOT
  rationale: 히브리어의 주의 환기와 엄숙한 도입을 살리기 위해 직설적 호격형인 「보라」를 택했습니다.
- source_word: בְּיַד / וּבְיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에 넘겨주겠다
  alternatives_korean:
  - 손에
  - 권세 아래
  - 장악할
  lexicon: HALOT
  rationale: 관용구의 통제·지배 의미를 한국어에서 가장 자연스럽고 분명하게 드러내기 위해 동사화했습니다.
- source_word: מְבַקְשֵׁי נַפְשׁוֹ
  english_pob_choice: those seeking his life
  chosen_korean: 그의 목숨을 찾는 자들
  alternatives_korean:
  - 그를 죽이려는 자들
  - 그의 생명을 찾는 자들
  lexicon: HALOT
  rationale: 직역적인 이미지와 관용적 의미를 함께 보존하기 위해 「목숨을 찾는 자들」로 옮겼습니다.
- source_word: נְבוּכַדְרֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓레살
  alternatives_korean:
  - 느부갓네살
  lexicon: HALOT
  rationale: 히브리어 표기와 더 가까운 이름형을 살리기 위해 전통적 표기보다 소리값이 가까운 형태를 택했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 확정성
  chosen_reading: “내가 … 넘겨주겠다”로 미래적이지만 확정된 심판 선언을 유지했습니다.
  alternative_readings:
  - “내가 … 넘깁니다”
  - “내가 … 넘기고 있습니다”
  rationale: 히브리어 분사와 בהנני의 선포적 성격은 다가오는 행동의 확실성을 강조하므로, 한국어에서도 단순 미래로 풀어 확정성을 살렸습니다.
  doctrine_reference: 예언 문맥의 확정된 신적 행위 묘사
