  source_fidelity: 첫 번째 경우의 복수(‘그의 원수들’, ‘그의 목숨을 노리는 자들’)와 두 번째 경우의 단수는 구별되어야 합니다. 특히 마지막 단수 표현은 시드기야를 수식하여 느부갓레살이 ‘그의 원수이며 그의 목숨을 노리던 자’였음을 말합니다.
  naturalness: 초안의 ‘목숨을 찾는 자’는 한국어 관용상 다소 부자연스럽고 의미가 즉시 분명하지 않습니다. ‘목숨을 노리는 자’가 현대 표준어에서 자연스럽고 원문의 관용적 의미도 충실히 전달합니다. 또한 인용문 안에서는 합쇼체 종결을 사용했습니다.
