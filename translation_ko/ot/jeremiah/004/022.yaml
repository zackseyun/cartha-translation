id: JER.4.22
reference: Jeremiah 4:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אֱוִ֣יל עַמִּ֗/י אוֹתִ/י֙ לֹ֣א יָדָ֔עוּ בָּנִ֤ים סְכָלִים֙ הֵ֔מָּה וְ/לֹ֥א נְבוֹנִ֖ים הֵ֑מָּה חֲכָמִ֥ים הֵ֨מָּה֙ לְ/הָרַ֔ע וּ/לְ/הֵיטִ֖יב לֹ֥א יָדָֽעוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/022.yaml
  text: For my people are foolish; they do not know me. They are foolish children[a], and they have no understanding. They are wise to do evil, but they do not know how to do good.
  footnotes:
  - marker: a
    text: Or 'They are foolish sons.' The Hebrew literally says 'sons,' but here it functions as a collective for the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성은 어리석습니다. 그들은 나를 알지 못합니다. 그들은 어리석은 자녀들[a]이며, 깨닫지 못합니다. 그들은 악을 행하는 데는 지혜롭지만, 선을 행하는 법은 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '어리석은 아들들'. 히브리어는 문자적으로 '아들들'이지만, 여기서는 백성을 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 나의 백성
  - 내가 소유한 백성
  lexicon: HALOT
  rationale: 언약적 소속 관계를 드러내기 위해 소유격을 살리되, 한국어에서는 자연스러운 '내 백성'으로 옮겼습니다.
- source_word: אֱוִיל / סְכָלִים
  english_pob_choice: foolish / foolish children
  chosen_korean: 어리석습니다 / 어리석은 자녀들
  alternatives_korean:
  - 미련합니다 / 미련한 자녀들
  - 우둔합니다 / 우둔한 자녀들
  lexicon: HALOT
  rationale: 두 형용사는 반복되지만 뉘앙스와 강도가 같지 않으므로, 첫 절은 일반적 판단인 '어리석습니다'로, 뒤는 집단 전체를 가리키는 표현으로 '어리석은 자녀들'로 옮겨 병행을 살렸습니다.
- source_word: בָּנִים
  english_pob_choice: children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아들들
  - 아들
  lexicon: HALOT
  rationale: 히브리어 복수형은 여기서 성별을 특정하기보다 백성을 집합적으로 가리키므로, 영어 POB의 취지를 따라 '자녀들'로 번역했습니다.
- source_word: וְלֹא נְבוֹנִים
  english_pob_choice: they have no understanding
  chosen_korean: 깨닫지 못합니다
  alternatives_korean:
  - 이해가 없습니다
  - 분별하지 못합니다
  lexicon: HALOT
  rationale: נבון의 핵심은 분별력과 이해력입니다. 한국어에서는 간결하게 '깨닫지 못합니다'로 옮겨 앞뒤 대조를 자연스럽게 했습니다.
- source_word: חֲכָמִים הֵמָּה לְהָרַע וּלְהֵיטִיב לֹא יָדָעוּ
  english_pob_choice: They are wise to do evil, but they do not know how to do good
  chosen_korean: 그들은 악을 행하는 데는 지혜롭지만, 선을 행하는 법은 알지 못합니다
  alternatives_korean:
  - 그들은 악을 행하는 데 능숙하지만, 선을 행하는 법은 알지 못합니다
  - 그들은 악에는 지혜롭지만, 선은 알지 못합니다
  lexicon: HALOT
  rationale: 히브리어의 아이러니를 살리기 위해 '지혜롭지만'을 유지하고, לְהָרַע는 행위 방향을 분명히 하는 '악을 행하는 데는'으로 옮겼습니다. יָדַע와 부정형은 실제로 할 줄 모른다는 의미를 살려 '행하는 법은 알지 못합니다'로 표현했습니다.
theological_decisions:
- issue: 지식(know) 동사의 의미 범위
  chosen_reading: 하나님을 '아는 것'은 단순 정보가 아니라 언약적·관계적 인식을 뜻합니다.
  alternative_readings:
  - 단순한 인지
  - 종교적 지식
  rationale: 예레미야의 문맥에서 '나를 알지 못합니다'는 하나님에 대한 무지라기보다 언약 관계의 거부를 가리킵니다. 본문은 간단히 유지하되, 신학적 함의를 기록합니다.
  doctrine_reference: Translation philosophy §1, §3
