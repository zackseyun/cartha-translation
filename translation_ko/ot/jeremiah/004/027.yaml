reference: Jeremiah 4:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה שְׁמָמָ֥ה תִהְיֶ֖ה כָּל הָ/אָ֑רֶץ וְ/כָלָ֖ה לֹ֥א אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/027.yaml
  text: 'For thus says Yahweh: The whole land will be a desolation[b][a], yet I will not make a full end.'
  footnotes:
  - marker: a
    text: Or 'the whole earth.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'land' is preferred because the context centers on Judah under judgment, though the surrounding imagery may evoke wider, cosmic devastation.
    reason: alternative_reading
  - marker: b
    text: Or 'I will not make a complete end' / 'I will not completely destroy it.' The Hebrew preserves a tension between devastating judgment and the LORD's refusal to bring total annihilation.
    reason: lexical_alternative
translation:
  language: ko
  text: '야훼께서 이렇게 말씀하십니다: 온 땅[a]이 황폐지가 될 것이나, 내가 완전한 끝을 내지는 않겠습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 세상’. 히브리어 אֶרֶץ는 ‘땅’과 ‘세상’의 의미를 모두 가질 수 있으나, 여기서는 유다에 대한 심판 문맥이므로 ‘땅’으로 옮겼습니다. 다만 주변의 묘사는 더 넓고 우주적인 황폐의 이미지를 불러일으킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘완전한 멸망을 이루지는 않겠다’ 또는 ‘그것을 완전히 멸하지는 않겠다’. 히브리어는 심각한 심판과 전적인 멸절을 이루지 않겠다는 야훼의 절제를 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For thus says
  chosen_korean: 이는 … 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 그러므로 … 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 기능을 살리면서, 한국어에서는 문두의 연결을 자연스럽게 하기 위해 ‘이는’으로 시작했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사를 그대로 옮기는 프로젝트 기본값을 따랐고, 제목어 ‘주’로 대체하지 않았습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황폐하게
  alternatives_korean:
  - 황무지가 되게
  - 폐허가 되게
  - 황량하게
  lexicon: HALOT
  rationale: 명사적 뉘앙스가 있으나 한국어에서는 상태 결과를 나타내는 부사적 표현이 더 자연스러워, 땅의 완전한 황폐 상태를 압축해 드러냈습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: The whole land
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 땅 전체
  - 그 땅 전체
  - 온 הארץ
  lexicon: HALOT
  rationale: 문맥상 유다의 심판을 가리키므로 ‘땅’으로 옮겼고, ‘온’으로 כָּל의 총체성을 살렸습니다.
- source_word: וְכָלָה לֹא אֶעֱשֶׂה
  english_pob_choice: yet I will not make a full end
  chosen_korean: 나는 완전히 끝내지는 않겠습니다
  alternatives_korean:
  - 나는 완전한 끝을 내지는 않겠습니다
  - 나는 완전히 멸하지는 않겠습니다
  - 나는 끝장을 내지는 않겠습니다
  lexicon: HALOT
  rationale: ‘완전한 끝’이라는 관용구를 한국어에서 자연스럽게 풀되, 심판의 강도와 전면적 멸망을 막는 신적 절제를 함께 보이도록 했습니다.
theological_decisions:
- issue: 심판의 범위와 절제의 긴장
  chosen_reading: 온 땅이 황폐하게 될 것이나, 나는 완전히 끝내지는 않겠습니다
  alternative_readings:
  - 온 땅이 황폐해질 것이나, 나는 완전한 끝을 내지는 않겠습니다
  - 온 땅이 황무지가 될 것이나, 나는 완전히 멸하지는 않겠습니다
  rationale: 본문은 전면적 파괴를 선언하면서도 ‘완전히 끝내지는 않겠다’는 제한을 함께 말하므로, 두 절을 모두 약화하지 않고 병치했습니다.
  doctrine_reference: Translation philosophy §3, §6
