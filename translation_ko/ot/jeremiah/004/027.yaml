  source_fidelity: ‘이는 야훼께서 말씀하십니다’는 כֹה אָמַר의 전령 공식을 충분히 드러내지 못하고 한국어로도 부자연스럽습니다. 또한 שְׁמָמָה는 결과 상태의 명사이므로 ‘황폐하게’보다 ‘황폐지가 되다’가 원문의 명사성을 더 잘 보존합니다. וְכָלָה לֹא אֶעֱשֶׂה는 완전한 종결을 행하지 않겠다는 뜻이므로 ‘완전한 끝을 내다’로 직역적 긴장을 유지할 수 있습니다.
  naturalness: 현대 표준어 합쇼체에서 ‘야훼께서 이렇게 말씀하십니다:’는 예언자적 선언에 자연스럽고 격식 있는 표현입니다. ‘온 땅이 황폐지가 될 것이나’도 의미가 분명합니다. 각주 표지는 해당 낱말·구절 바로 뒤에 배치했습니다.
  terminology: 신명은 프로젝트 방침과 원문에 따라 ‘야훼’로 유지했습니다. 본문의 ‘땅’은 유다 심판 문맥에 맞게 유지하되, אֶרֶץ의 ‘세상/땅’ 가능성은 각주에서 보존했습니다. 각주 b의 ‘여호와’는 본문 용어와 일치하도록 ‘야훼’로 바로잡았습니다.
