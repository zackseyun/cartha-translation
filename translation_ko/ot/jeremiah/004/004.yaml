id: JER.4.4
reference: Jeremiah 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִמֹּ֣לוּ לַ/יהֹוָ֗ה וְ/הָסִ֨רוּ֙ עָרְל֣וֹת לְבַבְ/כֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/004.yaml
  text: Circumcise yourselves to Yahweh[a], and remove the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my wrath go out like fire and burn, with no one to quench it[b], because of the evil of your deeds.
  footnotes:
  - marker: a
    text: Hebrew literally, 'remove the foreskins of your heart'—a metaphor for inward covenant loyalty and repentance.
    reason: cultural_note
  - marker: b
    text: Or 'my fury break out like fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 사람들과 예루살렘 주민들아, 야훼를 위하여 할례를 받고 너희 마음의 포피를 제거하십시오.[a] 그렇지 않으면 너희 악한 행위 때문에 내 분노가 불처럼 나와 타오르고, 그것을 끌 사람이 없을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희 마음의 포피를 제거하라’는 뜻으로, 내적 언약 충성과 회개를 가리키는 은유입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘내 분노가 불처럼 터져 나올 것이다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִמֹּלוּ
  english_pob_choice: Circumcise yourselves
  chosen_korean: 너희 자신을 할례하고
  alternatives_korean:
  - 너희는 할례를 받으십시오
  - 너희 몸의 표지를 베어 내십시오
  lexicon: HALOT
  rationale: 니팔 명령형의 반사적 의미를 살리되, 예언적 권면으로 자연스럽게 읽히도록 ‘너희 자신을 할례하고’로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께로
  alternatives_korean:
  - 여호와께로
  - 주님께로
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 프로젝트 기본값에 따라 ‘야훼’로 직접 옮기고, 방향/헌신의 뉘앙스를 살려 ‘-께로’로 표현했습니다.
- source_word: עָרְלוֹת לְבַבְכֶם
  english_pob_choice: the foreskins of your hearts
  chosen_korean: 너희 마음의 포피를
  alternatives_korean:
  - 너희 마음의 무할례를
  - 너희 굳은 마음을
  lexicon: HALOT
  rationale: 몸의 은유를 완화하지 않고 그대로 유지해야 회개의 내적 요구가 선명해지므로, 관용적 풀이보다 ‘포피’를 살렸습니다.
- source_word: תֵּצֵא כָאֵשׁ חֲמָתִי וּבָעֲרָה
  english_pob_choice: my wrath go out like fire ... and burn
  chosen_korean: 내 분노가 불처럼 나와 타올라
  alternatives_korean:
  - 내 진노가 불같이 터져 나와 타며
  - 내 분노가 불처럼 나와 불붙어
  lexicon: HALOT
  rationale: ‘나와’로 יצא의 움직임을 살리고, 이어지는 불 이미지는 ‘타올라’로 자연스럽게 연결했습니다.
- source_word: וְאֵין מְכַבֶּה
  english_pob_choice: with no one to quench it
  chosen_korean: 꺼 주는 사람이 없을 것입니다
  alternatives_korean:
  - 꺼 줄 자가 없을 것입니다
  - 그것을 끌 자가 없을 것입니다
  lexicon: HALOT
  rationale: ‘퀀치하다’의 직역보다 한국어에서 즉각 이해되는 ‘꺼 주다’를 택해, 소멸 불가능한 심판의 이미지를 분명하게 했습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 본문의 יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 하나님의 언약 이름을 가리고 일반 호칭으로 대체하지 않았습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH'
- issue: 마음의 포피라는 은유 보존
  chosen_reading: ‘너희 마음의 포피’라는 직설적 은유를 유지했습니다.
  alternative_readings:
  - 마음을 정결하게 하십시오
  - 마음을 할례하십시오
  rationale: 본문의 신학적 긴장은 외적 표징이 아니라 내적 언약 충성의 요구에 있으므로, 의미를 풀어쓰기보다 이미지를 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
