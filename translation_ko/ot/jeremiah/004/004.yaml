- from: 야훼께로 너희 자신을 할례하고, 너희 마음의 포피를 제거하십시오. 유다 사람들과 예루살렘 주민들아. 그렇지 않으면 내 분노가 불처럼 나와 타올라, 꺼 주는 사람이 없을 것입니다. 이는 너희 행위의 악함 때문입니다.[a][b]
  to: 유다 사람들과 예루살렘 주민들아, 야훼를 위하여 할례를 받고 너희 마음의 포피를 제거하십시오.[a] 그렇지 않으면 너희 악한 행위 때문에 내 분노가 불처럼 나와 타오르고, 그것을 끌 사람이 없을 것입니다.[b]
  rationale: 원문의 명령형과 호격의 관계를 한국어 문장 안에서 회복하고, 비관용적인 ‘자신을 할례하다’를 자연스러운 수동·재귀 표현으로 바꾸었습니다. 마음의 포피라는 은유와 불처럼 나오는 분노의 이미지는 유지했으며, 각주 표지를 해당 본문 표현에 붙였습니다.
