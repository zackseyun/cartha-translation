id: JER.4.2
reference: Jeremiah 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִשְׁבַּ֨עְתָּ֙ חַי יְהוָ֔ה בֶּ/אֱמֶ֖ת בְּ/מִשְׁפָּ֣ט וּ/בִ/צְדָקָ֑ה וְ/הִתְבָּ֥רְכוּ ב֛/וֹ גּוֹיִ֖ם וּ/ב֥/וֹ יִתְהַלָּֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/002.yaml
  text: and if you swear[a], ‘As Yahweh lives,’ in truth, in justice, and in righteousness, then nations will bless themselves in him[c][b], and in him they will boast.
  footnotes:
  - marker: a
    text: Or, 'then nations will be blessed in him.' The Hebrew verb can be understood reflexively ('bless themselves') or, less likely here, as a passive-like sense.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'him' is ambiguous in context; it may refer to restored Israel/Judah, though some understand it as referring to the LORD.
    reason: alternative_reading
  - marker: c
    text: 'Hebrew oath formula: ''As the LORD lives.'''
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너희가 ‘야훼께서 살아 계십니다’라고 진실과 정의와 의로 맹세하면, 민족들이 그 안에서 자신들에게 복을 빌며, 그 안에서 자랑할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 맹세 공식: ‘야훼께서 살아 계십니다.’'
    reason: cultural_note
  - marker: b
    text: 대명사 ‘그’는 문맥상 회복된 이스라엘/유다를 가리킬 수도 있고, 어떤 해석에서는 야훼를 가리키는 것으로 이해하기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘민족들이 그 안에서 복을 받게 될 것입니다.’ 히브리어 동사는 반사적 의미(‘자신들에게 복을 빌다’)로도, 덜 가능하지만 수동적 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁבַּ֨עְתָּ֙
  english_pob_choice: and if you swear
  chosen_korean: 그리고 너희가 … 맹세하면
  alternatives_korean:
  - 그리고 네가 맹세하면
  - 그리고 너희가 맹세한다면
  lexicon: HALOT
  rationale: 조건절로 이어지는 맥락을 살려 합쇼체의 자연스러운 조건 표현으로 옮겼습니다. 문맥상 예언적 호소이므로 단순 서술보다 ‘맹세하면’이 적절합니다.
- source_word: חַי יְהוָ֔ה
  english_pob_choice: ‘As Yahweh lives,’
  chosen_korean: ‘야훼께서 살아 계십니다’
  alternatives_korean:
  - ‘야훼의 살아 계심을 두고’
  - ‘주님은 살아 계십니다’
  lexicon: HALOT
  rationale: 히브리어의 전형적 맹세 공식을 한국어로 직접 드러내되, 신명은 본문 원어를 따라 ‘야훼’로 옮겼습니다. ‘살아 계십니다’는 한국어에서 맹세 구문의 관용성을 유지합니다.
- source_word: בֶּאֱמֶת בְּמִשְׁפָּט וּבִצְדָקָה
  english_pob_choice: in truth, in justice, and in righteousness
  chosen_korean: 진실과 정의와 의로
  alternatives_korean:
  - 진실과 공의와 의로
  - 진리와 정의와 의로
  lexicon: HALOT
  rationale: 세 개의 전치사구를 한국어 조사 나열로 자연스럽게 압축하되, אֱמֶת은 ‘진실’, מִשְׁפָּט은 ‘정의’, צְדָקָה는 ‘의’로 각각의 뉘앙스를 구분했습니다.
- source_word: וְהִתְבָּרְכוּ בּוֹ גּוֹיִם
  english_pob_choice: then nations will bless themselves in him
  chosen_korean: 민족들이 그 안에서 자신들에게 복을 빌며
  alternatives_korean:
  - 민족들이 그 안에서 복을 받으며
  - 민족들이 그를 통해 복을 받으며
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살려 ‘자신들에게 복을 빌다’로 옮겼습니다. POB의 주석처럼 수동적 의미도 가능하지만, 형태론적으로는 반사형이 더 직접적입니다.
- source_word: וּב֥וֹ יִתְהַלָּֽלוּ
  english_pob_choice: and in him they will boast
  chosen_korean: 그 안에서 자랑할 것입니다
  alternatives_korean:
  - 그 안에서 뽐낼 것입니다
  - 그로 말미암아 자랑할 것입니다
  lexicon: HALOT
  rationale: 히트파엘 הלל의 ‘자랑하다/자부하다’ 의미를 현대 한국어의 ‘자랑하다’로 옮겨, 문맥의 평행과 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘그 안에서’의 지시 대상
  chosen_reading: 지시 대상을 본문에서 특정하지 않고 ‘그 안에서’로 유지했습니다.
  alternative_readings:
  - 여호와 안에서
  - 이스라엘/유다 안에서
  rationale: 히브리어는 남성 단수 대명사만 제시하므로, 문맥상 가능한 해석을 본문에서 강제로 확정하지 않았습니다. 이는 POB의 본문-수준 모호성 보존 원칙을 따릅니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
