  rationale: 이 구절의 영어 POB는 Yahweh를 주석으로 밝혀도 본문 의미는 전통적 독자 인식과 연결됩니다. 한국어 본문에서는 가독성과 예언문 맥락의 즉시성을 위해 「여호와」를 사용했습니다.
  doctrine_reference: POB Korean rendering convention for widely recognized divine-name usage in publication text
