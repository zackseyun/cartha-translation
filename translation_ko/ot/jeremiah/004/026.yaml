  source_fidelity: 전반적인 의미는 원문에 충실합니다. 다만 יְהוָה는 영어 POB의 ‘Yahweh’ 및 직접적인 신명 표기 원칙에 맞추어 「야훼」로 통일하는 것이 적절합니다. 또한 מִפְּנֵי의 반복은 본문에서 자연스럽게 반복해 보존하고, 각주에서는 ‘앞에서’와 인과적 의미의 가능성을 함께 밝혀야 합니다.
  naturalness: 「여호와 앞과 그의 맹렬한 진노 앞에서」는 조사 결합이 부자연스럽습니다. 「야훼 앞에서, 그의 맹렬한 진노 앞에서」로 반복하면 히브리어의 강조를 살리면서 현대 한국어로도 자연스럽습니다. 「허물어져 있었습니다」는 환시에서 목격한 황폐 상태를 잘 드러냅니다.
  terminology: הַכַּרְמֶל은 이 문맥에서 「비옥한 땅」으로 옮기는 것이 적절하며, 지명 가능성은 각주로 남겨야 합니다. יְהוָה는 「야훼」로 표기합니다. חֲרוֹן אַפּוֹ는 「맹렬한 진노」로 자연스럽고 충분히 충실하게 옮겼습니다.
