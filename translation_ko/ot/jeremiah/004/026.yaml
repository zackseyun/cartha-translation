  lexicon: HALOT
  rationale: 예언적 환시의 도입부로서 단순한 시각 보고보다 장면을 목격하는 뉘앙스를 살려 「내가 보니」로 옮겼습니다.
- source_word: הַכַּרְמֶל
  english_pob_choice: the fruitful land
  chosen_korean: 그 비옥한 땅
  alternatives_korean:
  - 그 갈멜
  - 그 기름진 땅
  - 그 과수원 같은 땅
  lexicon: HALOT
  rationale: 문맥상 특정 지명보다 황폐해진 비옥한 땅이라는 일반 명사적 뜻이 더 적절하므로, 대조를 분명히 하는 「비옥한 땅」으로 옮겼습니다.
- source_word: נִתְּצוּ
  english_pob_choice: were torn down
  chosen_korean: 무너졌습니다
  alternatives_korean:
  - 헐렸습니다
  - 허물어졌습니다
  - 파괴되었습니다
  lexicon: HALOT
  rationale: 성읍과 건물의 붕괴를 자연스럽게 드러내는 한국어로 「무너졌습니다」를 택해 심판의 결과를 생생하게 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 POB 본문은 기존 영어 본문 관례를 따라 LORD를 사용하고 있어, 한국어 본문에서는 한국어 성경 독자에게 즉시 식별되는 표기를 택하되, 원문 이름의 직접 대응이라는 점은 보존했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
