base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/026.yaml
  text: I looked[a], and behold, the fruitful land was a wilderness, and all its cities were torn down before Yahweh[b], before his fierce anger.
  footnotes:
  - marker: a
    text: Hebrew Carmel; here likely used in the broader sense of fertile or cultivated land rather than the specific region Mount Carmel.
    reason: lexical_alternative
  - marker: b
    text: Or 'because of the LORD, because of his burning anger.' The Hebrew phrase literally repeats 'from/before the face of.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 보니, 보라, 그 비옥한 땅이 광야가 되었고, 그 성읍들은 모두 여호와 앞과 그의 맹렬한 진노 앞에서 무너졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּרְמֶל은 갈멜 산지의 지명일 수도 있지만, 여기서는 비옥한 땅을 가리키는 일반 명사로 이해하는 것이 문맥상 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 「여호와의 얼굴 앞에서, 그의 맹렬한 분노의 얼굴 앞에서」입니다. 여기서는 심판의 원인/근거를 나타내는 표현으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 보았습니다
