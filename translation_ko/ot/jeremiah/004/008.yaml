translation:
  language: ko
  text: 이 일 때문에 너희는 베옷을 두르고 애곡하며 통곡하십시오. 이는 야훼의 타오르는 분노가 우리에게서 돌이키지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
