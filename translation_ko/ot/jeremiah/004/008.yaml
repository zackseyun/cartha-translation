    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 맹렬한 분노가 우리에게서 돌아서지 않았기 때문입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  english_pob_choice: Because of this
  chosen_korean: 이 일 때문에
  alternatives_korean:
  - 이 까닭에
  - 이 때문에
  lexicon: HALOT
  rationale: 원문의 원인·계기 용법을 현대 한국어에서 자연스럽게 드러내면서, 뒤의 명령문들을 이끄는 이유를 분명히 했습니다.
- source_word: חִגְרוּ שַׂקִּים
  english_pob_choice: put on sackcloth
  chosen_korean: 베옷을 두르십시오
