  rationale: חגר의 문자적 ‘허리에 두르다’ 이미지를 살리되, 예언서의 애곡 문맥에 맞는 표준적인 ‘베옷을 두르다’를 택했습니다.
- source_word: סִפְדוּ וְהֵילִילוּ
  english_pob_choice: mourn and wail
  chosen_korean: 애곡하며 통곡하십시오
  alternatives_korean:
  - 슬퍼하며 부르짖으십시오
  - 애도하며 울부짖으십시오
  lexicon: HALOT
  rationale: 두 동사의 중첩된 슬픔 표현을 한국어에서 어색하지 않게 병렬로 살려, 장례·재난의 절규 뉘앙스를 유지했습니다.
- source_word: חֲרוֹן אַף יְהֹוָה
  english_pob_choice: the burning anger of Yahweh
  chosen_korean: 야훼의 타오르는 분노
  alternatives_korean:
  - 야훼의 불타는 진노
  - 야훼의 맹렬한 분노
  lexicon: HALOT
  rationale: 하나님의 이름은 프로젝트 기본값에 따라 야훼로 옮기고, חֲרוֹן אַף의 불·열 이미지가 드러나도록 ‘타오르는 분노’로 번역했습니다.
