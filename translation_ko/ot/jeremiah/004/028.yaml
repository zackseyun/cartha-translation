  to: 이 때문에 땅[a]이 애통하고, 위의 하늘이 어두워질 것입니다. 내가 말했고 뜻을 세웠으며[b], 뜻을 바꾸지 않았고[c], 그 뜻에서 돌아서지도 않을 것이기 때문입니다.
  rationale: 원문의 인과 관계와 동사 연쇄를 유지하되, נחם과 שׁוב의 의미를 각각 ‘뜻을 바꾸지 않다’와 ‘그 뜻에서 돌아서지 않다’로 구별했습니다. 이는 하나님의 선언된 심판을 철회하지 않으신다는 문맥을 자연스럽게 드러내며, 특정 교리적 해석을 덧붙이지 않습니다.
