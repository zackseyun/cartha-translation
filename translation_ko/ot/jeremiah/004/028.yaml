source:
  edition: WLC
  text: עַל זֹאת֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/קָדְר֥וּ הַ/שָּׁמַ֖יִם מִ/מָּ֑עַל עַ֤ל כִּי דִבַּ֨רְתִּי֙ זַמֹּ֔תִי וְ/לֹ֥א נִחַ֖מְתִּי וְ/לֹא אָשׁ֥וּב מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/028.yaml
  text: Because of this the earth will mourn[a], and the heavens above will grow dark, because I have spoken, I have purposed, and I have not relented[c][b], nor will I turn back from it.
  footnotes:
  - marker: a
    text: Or 'the land will mourn.' Hebrew אֶרֶץ can mean either 'earth' or 'land'; here the parallel with 'the heavens above' favors the broader rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'I have planned' / 'I have resolved.'
    reason: lexical_alternative
  - marker: c
    text: Or 'I have not changed my mind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 땅[a]이 애통하고, 위의 하늘이 어두워질 것입니다. 내가 말했고 뜻을 세웠으며[b], 뜻을 바꾸지 않았고[c], 그 뜻에서 돌아서지도 않을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘나라’를 뜻할 수 있습니다. 여기서는 ‘위의 하늘’과 병행되므로 더 넓은 우주적 범위의 뜻이 두드러집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 זַמֹּתִי는 ‘내가 계획했다’ 또는 ‘내가 작정했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 נִחַמְתִּי는 여기서 ‘후회했다’보다 ‘뜻을 바꾸었다’, ‘마음을 돌이켰다’, 또는 ‘철회했다’라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  english_pob_choice: Because of this
  chosen_korean: 이 일 때문에
  alternatives_korean:
  - 이로 인해
  - 이것 때문에
  - 이 일로 말미암아
  lexicon: HALOT
  rationale: 원문의 인과 관계를 자연스럽게 살리면서, 바로 뒤의 심판 맥락을 가리키는 지시성을 유지하는 표현입니다.
- source_word: תֶּאֱבַל
  english_pob_choice: will mourn
  chosen_korean: 애통하고
  alternatives_korean:
  - 슬퍼하고
  - 애도하고
  - 탄식하고
  lexicon: HALOT
  rationale: 땅을 의인화한 '애통하다'는 표현이 히브리어의 애도/통곡 의미를 잘 담고, 문어적 예언체에도 맞습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅/땅 위
  - 지구
  - 세상
  lexicon: HALOT
  rationale: 이 절은 '하늘들'과의 병행으로 우주적 이미지를 띠지만, 한국어에서는 '땅'이 가장 자연스럽고 본문의 심판 대상과의 연결도 유지합니다.
- source_word: נִחַמְתִּי
  english_pob_choice: I have not relented
  chosen_korean: 후회하지도 않았고
  alternatives_korean:
  - 뜻을 바꾸지도 않았고
  - 철회하지도 않았고
  - 마음을 돌리지도 않았고
  lexicon: HALOT
  rationale: 여기서 נחם은 하나님의 도덕적 '회개'가 아니라 선언하신 심판을 거두지 않으시는 뜻이므로, 한국어에서는 '후회하다'를 부정형으로 써서 그 긴장을 살리되 오해를 줄였습니다.
- source_word: וְלֹא אָשׁוּב מִמֶּנָּה
  english_pob_choice: nor will I turn back from it
  chosen_korean: 그것을 거두어들이지도 않을 것이기 때문입니다
  alternatives_korean:
  - 그것에서 돌이키지도 않을 것이기 때문입니다
  - 그것을 철회하지도 않을 것이기 때문입니다
  - 그것에서 돌아서지도 않을 것이기 때문입니다
  lexicon: HALOT
  rationale: 문맥상 이미 선포된 심판 조치를 가리키므로, '돌이키다'보다 '거두어들이다'가 한국어에서 더 분명하게 실행 철회 의미를 전달합니다.
theological_decisions:
- issue: 하나님의 '후회' 표현 처리
  chosen_reading: '''후회하지도 않았다''로 옮겨, 하나님께 도덕적 오류가 있다는 뜻이 아니라 선포된 심판을 철회하지 않으심을 드러냈습니다.'
  alternative_readings:
  - '''뜻을 바꾸지 않았다'''
  - '''마음을 돌리지 않았다'''
  - '''유감으로 여기지 않았다'''
  rationale: 원문 נחם은 여기서 감정적 후회가 아니라 작정한 심판을 완수하지 않으시는 뜻의 부정입니다. 한국어에서는 가장 직접적인 표현을 쓰되, 이어지는 구절로 의미를 제한해 오해를 줄였습니다.
  doctrine_reference: Translation philosophy §1, §3
