  text: עָלָ֤ה אַרְיֵה֙ מִֽ/סֻּבְּכ֔/וֹ וּ/מַשְׁחִ֣ית גּוֹיִ֔ם נָסַ֖ע יָצָ֣א מִ/מְּקֹמ֑/וֹ לָ/שׂ֤וּם אַרְצֵ/ךְ֙ לְ/שַׁמָּ֔ה עָרַ֥יִ/ךְ תִּצֶּ֖ינָה מֵ/אֵ֥ין יוֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/007.yaml
  text: A lion has come up from his thicket[a], and a destroyer of nations has set out; he has gone out from his place to make your land a desolation. Your cities will be laid waste[b], without inhabitant.
  footnotes:
  - marker: a
    text: Or 'from his lair.' The Hebrew term refers to dense cover or tangled brush from which a lion emerges.
    reason: lexical_alternative
  - marker: b
    text: Or 'Your cities will be laid waste, with no one dwelling in them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사자가 자기 굴에서 올라오고, 민족들을 멸망시키는 자가 출발하였으며 — 네 땅을 황폐하게 하려고, 그의 자리에서 나왔습니다. 네 성읍들은 폐허가 되어, 거주하는 자가 없게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굴’은 Hebrew thicket의 시각적 이미지를 한국어로 압축한 번역입니다. 직역하면 ‘수풀/덤불’이지만, 사자가 나오는 은밀한 은신처라는 기능을 함께 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘폐허가 되어’는 도시가 단지 비어 있는 상태가 아니라 파괴되어 버린 상태를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה אַרְיֵה מִסֻּבְּכוֹ
  english_pob_choice: A lion has come up from his thicket
  chosen_korean: 사자가 자기 굴에서 올라오고
  alternatives_korean:
  - 사자가 자기 수풀에서 올라오고
  - 사자가 자기 은신처에서 올라오고
  lexicon: HALOT
  rationale: אַרְיֵה의 핵심 이미지를 살리되, מִסֻּבְּכוֹ는 ‘thicket’에 맞춰 덤불의 뭉친 숨는 곳을 가리키므로 자연스러운 한국어로는 ‘굴’이 가장 압축적으로 포착합니다.
- source_word: מַשְׁחִית גּוֹיִם
  english_pob_choice: a destroyer of nations
  chosen_korean: 민족들을 멸망시키는 자
  alternatives_korean:
  - 열국을 멸망시키는 자
  - 나라들을 파괴하는 자
  lexicon: HALOT
  rationale: 분사구문이 사자에 대한 동격 설명이므로 직함처럼 붙여 읽기보다 ‘…하는 자’로 풀어, 열방을 무너뜨리는 침략자의 성격을 그대로 드러냈습니다.
- source_word: נָסַע
  english_pob_choice: has set out
  chosen_korean: 출발하였으며
  alternatives_korean:
  - 길을 떠났으며
  - 진군하였으며
  - 떠나왔으며
  lexicon: HALOT
  rationale: 원어는 진영을 걷고 이동을 시작하는 동작을 뜻할 수 있어, 군사적 전진의 맥락을 유지하면서도 현대 한국어에서 자연스러운 ‘출발하다’를 택했습니다.
- source_word: לָשׂוּם אַרְצֵךְ לְשַׁמָּה
  english_pob_choice: to make your land a desolation
  chosen_korean: 네 땅을 황폐하게 하려고
  alternatives_korean:
  - 네 땅을 황무지로 만들려고
  - 네 땅을 황폐한 상태로 만들려고
  lexicon: HALOT
  rationale: שַׁמָּה의 예언적 황폐화 의미를 ‘황폐하게 하다’로 살렸고, 목적을 나타내는 לָשׂוּם을 한국어 부사절로 처리했습니다.
- source_word: עָרַיִךְ תִּצֶּינָה מֵאֵין יוֹשֵׁב
  english_pob_choice: Your cities will be laid waste, without inhabitant
  chosen_korean: 네 성읍들은 폐허가 되어, 거주하는 자가 없게 될 것입니다.
  alternatives_korean:
  - 네 성읍들은 황폐해져, 거주자가 없을 것입니다.
  - 네 성읍들은 버려져, 사는 사람이 없을 것입니다.
  lexicon: HALOT
  rationale: תִּצֶּינָה의 결과 상태를 ‘폐허가 되어’로 옮겨 도시의 파괴 상태를 분명히 했고, מֵאֵין יוֹשֵׁב은 단순한 무거주가 아니라 ‘거주하는 자가 없음’으로 풀어 의미를 드러냈습니다.
theological_decisions:
- issue: 침략자를 ‘사자’로 유지할지, 의미를 풀어 ‘적군/원수’로 바꿀지
  chosen_reading: 사자 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 적군이
  - 원수가
  - 침략자가
  rationale: 문맥에서 사자는 침략 세력을 비유하는 핵심 은유이므로, 의미를 평평하게 풀기보다 이미지 자체를 보존해야 본문의 위협성과 예언적 생생함이 유지됩니다.
  doctrine_reference: 예언적 상징의 보존과 문자-은유 균형
