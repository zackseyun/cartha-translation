  naturalness: ‘이 모든 일을 너희에게 가져왔습니다’는 한국어에서 다소 직역투입니다. ‘이 일들을 네게 초래했습니다’가 심판의 결과를 초래했다는 문맥과 현대 표준어 합쇼체에 더 자연스럽게 맞습니다. ‘마음에까지 닿았습니다’는 원문의 은유를 보존하면서도 자연스럽습니다.
