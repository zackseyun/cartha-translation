id: JER.4.18
reference: Jeremiah 4:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּרְכֵּ/ךְ֙ וּ/מַ֣עֲלָלַ֔יִ/ךְ עָשׂ֥וֹ אֵ֖לֶּה לָ֑/ךְ זֹ֤את רָעָתֵ/ךְ֙ כִּ֣י מָ֔ר כִּ֥י נָגַ֖ע עַד לִבֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/018.yaml
  text: Your way and your deeds have brought these things upon you. This is your evil[a]—how bitter it is! For it has reached your heart.
  footnotes:
  - marker: a
    text: Or, 'This is your calamity' or 'This is your disaster.' The Hebrew word can denote either moral evil or the resulting disaster; here the main text preserves the accusatory force of the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 길과 너희의 행위가 이 모든 일을 너희에게 가져왔습니다. 이것이 너희의 악입니다[a]—그것이 얼마나 쓰라린지요! 그것이 너희의 심장에까지 닿았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 너희의 재앙입니다’ 혹은 ‘이것이 너희의 불행입니다.’ 히브리어 단어는 도덕적 악이나 그에 따른 재난을 모두 가리킬 수 있으며, 여기서는 본문이 지닌 고발성을 본문에 남겨 둡니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵּךְ
  english_pob_choice: your way
  chosen_korean: 너희의 길
  alternatives_korean:
  - 너희의 방식
  - 너희의 행실
  lexicon: HALOT
  rationale: דֶּרֶךְ는 문자적인 길뿐 아니라 삶의 방식과 행로를 뜻하므로, POB의 'your way'에 맞춰 '길'로 살렸습니다.
- source_word: וּמַעֲלָלַיִךְ
  english_pob_choice: and your deeds
  chosen_korean: 그리고 너희의 행위
  alternatives_korean:
  - 그리고 너희의 행동
  - 그리고 너희의 일들
  lexicon: HALOT
  rationale: מַעֲלָלִים은 행위·소행을 가리키며 예언서 문맥에서 도덕적 평가가 담기므로 '행위'가 간결하고 적합합니다.
- source_word: עָשׂוּ אֵלֶּה לָךְ
  english_pob_choice: have brought these things upon you
  chosen_korean: 이 모든 일을 너희에게 가져왔습니다
  alternatives_korean:
  - 이 모든 일을 너희에게 행했습니다
  - 이 모든 일을 너희에게 일으켰습니다
  lexicon: HALOT
  rationale: 직역하면 '이것들을 너희에게 행했다'이지만, 심판 문맥에서는 결과를 초래했다는 뜻이 분명하므로 '가져왔습니다'로 자연스럽게 옮겼습니다.
- source_word: זֹאת רָעָתֵךְ
  english_pob_choice: This is your evil
  chosen_korean: 이것이 너희의 악입니다
  alternatives_korean:
  - 이것이 너희의 재앙입니다
  - 이것이 너희의 불행입니다
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악과 그로 인한 재앙의 긴장을 함께 지니므로, 본문이 가진 고발성을 살리기 위해 '악'을 유지했습니다.
- source_word: כִּי מָר
  english_pob_choice: how bitter it is
  chosen_korean: 그것이 얼마나 쓰라린지요
  alternatives_korean:
  - 그것이 쓰라르기 때문입니다
  - 그것이 쓰라립니다
  lexicon: HALOT
  rationale: מָר는 '쓰라리다'는 뜻이므로, POB의 감탄적 처리를 따라 심판의 체감되는 고통을 드러내는 표현으로 옮겼습니다.
- source_word: כִּי נָגַע עַד לִבֵּךְ
  english_pob_choice: For it has reached your heart
  chosen_korean: 그것이 너희의 심장에까지 닿았습니다
  alternatives_korean:
  - 그것이 너희의 마음에까지 닿았습니다
  - 그것이 너희의 심장까지 이르렀습니다
  lexicon: HALOT
  rationale: נגע + עַד לֵב은 내면 깊숙이 미쳤다는 뜻이므로, '닿았습니다'로 접촉·침투의 이미지를 살렸습니다. '심장'은 '마음'보다 원문의 신체적 은유를 더 직접적으로 보존합니다.
theological_decisions:
- issue: רָעָה의 의미를 '재앙/불행'으로 완화할지, '악'으로 유지할지
  chosen_reading: '''악''으로 유지해 Judah의 책임성과 고발성을 드러내고, 뒤의 쓰라림과 도달은 그 악의 심판적 결과로 읽게 합니다.'
  alternative_readings:
  - 재앙
  - 불행
  rationale: 문맥은 백성의 행위와 길을 직접 책망하므로, 결과만 부각하는 번역은 본문의 도덕적 판단을 약화시킬 수 있습니다. POB의 긴장을 유지하기 위해 '악'을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
