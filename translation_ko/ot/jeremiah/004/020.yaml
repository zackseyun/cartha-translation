id: JER.4.20
reference: Jeremiah 4:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֶׁ֤בֶר עַל שֶׁ֨בֶר֙ נִקְרָ֔א כִּ֥י שֻׁדְּדָ֖ה כָּל הָ/אָ֑רֶץ פִּתְאֹם֙ שֻׁדְּד֣וּ אֹהָלַ֔/י רֶ֖גַע יְרִיעֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/020.yaml
  text: Disaster upon disaster is proclaimed[a], for the whole land is devastated. Suddenly my tents are devastated[b], my curtains in a moment.
  footnotes:
  - marker: a
    text: Or 'the whole earth.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here the context favors the land under judgment.
    reason: alternative_reading
  - marker: b
    text: '''My curtains'' refers to tent-curtains; the line uses the imagery of a dwelling suddenly destroyed.'
    reason: cultural_note
translation:
  language: ko
  text: 재앙이 재앙 위에 선포됩니다. 이는 온 땅이 황폐해졌기 때문입니다. 갑자기 내 천막들이 황폐해지고, 내 휘장은 순식간에 무너졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온 땅’은 여기서 지구 전체라기보다 문맥상 심판 아래 놓인 땅, 곧 유다의 땅을 가리킬 수 있습니다.
    reason: cross_reference
  - marker: b
    text: ‘휘장’은 천막의 휘장을 뜻하는 표현으로, 갑작스런 거주지 붕괴의 이미지를 전합니다.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר עַל שֶׁבֶר
  english_pob_choice: Disaster upon disaster
  chosen_korean: 재앙이 재앙 위에
  alternatives_korean:
  - 파괴가 파괴 위에
  - 멸망이 멸망 위에
  - 붕괴가 붕괴 위에
  lexicon: HALOT
  rationale: 겹쳐 오는 재난의 반복성을 살리기 위해 ‘재앙이 재앙 위에’로 옮겼습니다. ‘파괴’나 ‘붕괴’도 가능하지만, 예언문맥의 경고성과 자연스러운 현대어 전달을 함께 고려하면 ‘재앙’이 가장 직접적입니다.
- source_word: נִקְרָא
  english_pob_choice: is proclaimed
  chosen_korean: 선포됩니다
  alternatives_korean:
  - 외쳐집니다
  - 알려집니다
  - 선언됩니다
  lexicon: HALOT
  rationale: 수동적 공표 의미를 살려 ‘선포됩니다’로 옮겼습니다. 단순한 ‘외쳐집니다’보다 공적·예언적 선언의 뉘앙스를 더 잘 드러냅니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: the whole land
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 땅 전체
  - 모든 땅
  - 온 הארץ
  lexicon: HALOT
  rationale: 예레미야 4장의 문맥상 특정 지역의 심판이므로 ‘온 땅’으로 옮겼습니다. 여기서 ‘땅’은 지구 전체보다 심판 아래 놓인 땅을 가리키는 표현입니다.
- source_word: שֻׁדְּדָה / שֻׁדְּדוּ
  english_pob_choice: is devastated / are devastated
  chosen_korean: 황폐해졌습니다
  alternatives_korean:
  - 유린당했습니다
  - 무너졌습니다
  - 폐허가 되었습니다
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서도 일관되게 살리기 위해 ‘황폐해졌습니다’를 택했습니다. ‘유린당했습니다’는 약탈 뉘앙스가 강하고, ‘무너졌습니다’는 건축물 중심으로 좁아질 수 있습니다.
- source_word: יְרִיעֹתַי
  english_pob_choice: my curtains
  chosen_korean: 내 휘장은
  alternatives_korean:
  - 내 천막 휘장은
  - 내 장막 휘장은
  - 내 막들은
  lexicon: HALOT
  rationale: 주석의 설명처럼 천막-휘장 이미지이므로 ‘휘장’을 유지했습니다. 앞의 ‘천막들’과 함께 읽힐 때 거주지의 붕괴 이미지를 자연스럽게 전달합니다.
theological_decisions:
- issue: “온 땅”의 범위
  chosen_reading: 유다 땅을 가리키는 심판의 범위로 읽었습니다.
  alternative_readings:
  - 문자적으로 온 세상 전체
  - 수사적으로 과장된 보편 심판 표현
  rationale: 예레미야 4장의 직접 문맥이 유다와 예루살렘의 재앙이므로, 본문은 우주적 전체성보다 언약 백성의 땅에 임한 심판을 우선 가리킵니다.
  doctrine_reference: 예레미야 4장 문맥과 예언적 심판 언어
- issue: ‘휘장’의 이미지
  chosen_reading: 천막 생활의 파괴를 드러내는 거주지 이미지로 유지했습니다.
  alternative_readings:
  - 단순한 천의 장식
  - 성소 휘장과의 연관을 암시
  rationale: 원문은 가정/거처의 붕괴를 천막 이미지로 묘사하므로, 성소적 의미로 과도하게 확장하지 않고 생활 공간의 파괴로 읽는 것이 타당합니다.
  doctrine_reference: 시적 은유와 문맥 우선 원리
