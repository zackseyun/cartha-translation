source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהֹוָ֗ה לְ/אִ֤ישׁ יְהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/אַֽל תִּזְרְע֖וּ אֶל קוֹצִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/003.yaml
  text: 'For thus says Yahweh to the men of Judah and to Jerusalem: Break up for yourselves unplowed ground[a], and do not sow among thorns.'
  footnotes:
  - marker: a
    text: Or 'fallow ground.' The Hebrew refers to land needing to be broken up before sowing.
    reason: lexical_alternative
translation:
  language: ko
  text: 「야훼께서 유다 사람들과 예루살렘에 이렇게 말씀하십니다. 너희를 위해 묵은 땅을 일구고, 가시덤불 가운데에 뿌리지 마십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 아직 갈아엎지 않은 땅, 곧 파종 전에 준비가 필요한 땅을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 고유명사/신명 표기
  rationale: 영어 POB가 YHWH를 Yahweh로 옮긴 점을 따라, 한국어 본문에서도 프로젝트 기본값인 야훼를 사용해 원문 신명 표기를 직접 보존했습니다.
- source_word: לְאִישׁ יְהוּדָה
  english_pob_choice: to the men of Judah
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다의 남자들에게
  - 유다 백성에게
  lexicon: HALOT
  rationale: אִישׁ의 문자적 남성 단수 감각은 있으나 여기서는 유다와 예루살렘을 함께 향한 집합적 호칭이므로, 한국어에서는 어색한 성별 강조를 피하면서도 대상 전체를 자연스럽게 드러내는 ‘유다 사람들’을 택했습니다.
- source_word: נִירוּ / נִיר
  english_pob_choice: Break up / unplowed ground
  chosen_korean: 묵은 땅을 일구고
  alternatives_korean:
  - 갈아엎고
  - 경작하지 않은 땅을 일구고
  - 묵은 밭을 갈고
  lexicon: HALOT
  rationale: 동사 ניר는 땅을 갈아엎어 준비하게 하는 뜻이므로 ‘일구다’가 명령형의 힘과 농경 이미지를 함께 살립니다. 명사 נִיר는 ‘묵은 땅’으로 옮겨, 아직 파종에 적합하지 않은 땅이라는 뜻을 간결하게 드러냈습니다.
- source_word: אֶל קוֹצִים
  english_pob_choice: among thorns
  chosen_korean: 가시덤불 가운데에
  alternatives_korean:
  - 가시 가운데에
  - 가시덤불 속에
  - 가시덤불 사이에
  lexicon: HALOT
  rationale: 파종 동작과 함께 쓰인 אֶל은 여기서 ‘~가운데에/속에’의 관용적 뜻이 자연스럽습니다. ‘가시덤불 가운데에’는 파종 금지의 이미지를 분명하고 현대적으로 전달합니다.
theological_decisions:
- issue: 농경 명령의 비유성 유지
  chosen_reading: 본문의 농경 이미지를 그대로 유지하고, 회개나 심령 준비를 본문 안에 직접 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘마음을 준비하라’처럼 비유를 명시화하는 번역
  rationale: 원문은 해석을 설명하기보다 이미지 자체를 명령합니다. 한국어 본문에서도 비유를 유지해야 독자가 선지자의 경고를 원문 강도로 읽을 수 있습니다.
  doctrine_reference: 번역 원칙 1, 3
