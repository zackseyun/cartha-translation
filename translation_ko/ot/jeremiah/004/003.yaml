review_pass:
  verdict: revise
  source_fidelity: 첫 명령의 לָכֶם은 수익/재귀의 뉘앙스를 지니는데, 초안의 ‘너희를 위해’는 한국어에서 다소 부자연스럽고 땅이 별도의 수혜자를 위한 것처럼 들릴 수 있습니다. ‘너희의 묵은 땅’은 이 명령의 대상과 소유·관련성을 자연스럽게 드러냅니다. 또한 ‘묵은 땅’은 נִיר의 ‘묵혀 두어 파종 전에 갈아야 하는 땅’이라는 의미를 잘 보존합니다.
  naturalness: ‘유다 사람들과 예루살렘에’는 ‘예루살렘에서’라는 장소 의미로도 읽힐 수 있습니다. ‘유다 사람들과 예루살렘을 향해’는 도시명을 원문처럼 직접 유지하면서 발화의 대상을 현대 한국어로 분명히 합니다. ‘너희의 묵은 땅을 갈아엎고’는 명령의 농경 이미지를 더 자연스럽고 선명하게 전달합니다.
  terminology: ‘야훼’, ‘유다’, ‘예루살렘’, ‘가시덤불’, ‘뿌리다’는 적절합니다. 비유를 회개 등의 해석으로 본문에 풀어 넣지 않은 점도 원문 충실성에 부합합니다.
  issues:
