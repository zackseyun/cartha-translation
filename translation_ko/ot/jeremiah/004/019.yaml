  source_fidelity: 수정이 필요합니다. שָׁמַעְתִּי는 1인칭 단수 완료형이므로 ‘나의 영혼이 … 들었다’로 영혼을 문법적 주어로 삼은 현 번역은 히브리어 문법에 맞지 않습니다. נַפְשִׁי는 ‘내 영혼아’라는 호격으로 이해하는 것이 자연스럽습니다. 또한 קִירוֹת는 ‘담’보다 ‘벽들’이 직접적인 대응입니다.
