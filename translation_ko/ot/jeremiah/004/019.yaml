id: JER.4.19
reference: Jeremiah 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵעַ֣/י מֵעַ֨/י אחולה קִיר֥וֹת לִבִּ֛/י הֹֽמֶה לִּ֥/י לִבִּ֖/י לֹ֣א אַחֲרִ֑ישׁ כִּ֣י ק֤וֹל שׁוֹפָר֙ שמעתי נַפְשִׁ֔/י תְּרוּעַ֖ת מִלְחָמָֽה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/019.yaml
  text: My inward parts[a], my inward parts! I writhe in pain! O walls of my heart! My heart pounds within me; I cannot keep silent, for you, my soul, have heard the sound of the trumpet[c][b], the battle cry.
  footnotes:
  - marker: a
    text: Or 'my soul has heard'; the Hebrew may be read either as direct self-address ('you, my soul') or as an emphatic subject ('my soul').
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the walls of my heart,' a vivid bodily metaphor for inner anguish; some render more interpretively as 'the chambers of my heart.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the alarm of war' or 'the shout of battle' for 'the battle cry.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 창자여, 내 창자여! 내가 고통으로 몸부림칩니다! 내 마음의 벽들이여! 내 마음이 내 속에서 요동치니, 내가 잠잠할 수 없습니다. 내 영혼아, 내가 나팔 소리와 전쟁의 함성을 들었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 창자’는 히브리어로 문자적으로 내장·창자를 뜻하며, 시적 문맥에서는 깊은 내면의 격통을 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘내 마음의 벽들’은 히브리어의 문자적 표현을 살린 신체 은유입니다. ‘내 마음의 방들’로 이해하기도 합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘전쟁의 함성’은 ‘전쟁의 경보’ 또는 ‘전투의 외침’으로도 옮길 수 있습니다. 또한 히브리어 ‘내 영혼아’는 화자가 자기 자신에게 거는 호격으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  english_pob_choice: my inward parts
  chosen_korean: 내 창자여
  alternatives_korean:
  - 내 내장아
  - 내 속사람아
  - 내 심장아
  lexicon: HALOT
  rationale: 히브리어 מֵעַי는 문자적으로 내장/창자이지만 시적 문맥에서는 깊은 내면의 격통을 드러내므로, 신체 이미지를 살리면서도 현대 한국어에서 자연스러운 ‘내 창자여’를 택했습니다.
- source_word: אחולה
  english_pob_choice: I writhe in pain
  chosen_korean: 내가 고통으로 몸부림칩니다
  alternatives_korean:
  - 내가 괴로워합니다
  - 내가 심한 고통에 사로잡힙니다
  - 내가 몸서리칩니다
  lexicon: HALOT
  rationale: חול/חיל 계열의 몸부림치듯 아파하는 의미를 살려, 단순한 감정보다 육체적·정서적 격통을 함께 드러내는 표현으로 옮겼습니다.
- source_word: קירות לבי
  english_pob_choice: the walls of my heart
  chosen_korean: 내 마음의 담들아
  alternatives_korean:
  - 내 마음의 벽들아
  - 내 심장의 벽들아
  - 내 마음의 방들아
  lexicon: HALOT
  rationale: ‘벽들’의 직유적 기이함을 유지하되, 한국어에서는 ‘담’이 내면의 둘레를 가리키는 비유로 더 생생하게 들려 ‘마음의 담들’로 옮겼습니다.
- source_word: שמעתי נפשי
  english_pob_choice: my soul has heard / you, my soul, have heard
  chosen_korean: 나의 영혼이 나팔 소리와 전쟁의 함성을 들었기 때문입니다
  alternatives_korean:
  - 내 영혼이 들었기 때문입니다
  - 나의 영혼아, 너는 나팔 소리와 전쟁의 함성을 들었습니다
  - 내가 영혼으로 들었기 때문입니다
  lexicon: HALOT
  rationale: 본문의 문법적 모호성은 유지하되, 한국어 본문에서는 자연스러운 절로 처리하고 ‘영혼’으로 옮겨 내적 청각의 주체를 살렸습니다.
- source_word: תרועת מלחמה
  english_pob_choice: the battle cry
  chosen_korean: 전쟁의 함성
  alternatives_korean:
  - 전쟁의 외침
  - 전투의 함성
  - 전쟁의 나팔 소리
  lexicon: HALOT
  rationale: תְּרוּעָה는 경보·환성·함성을 포함할 수 있어, מלחמה와 결합한 전쟁 상황을 드러내는 포괄적 표현으로 ‘전쟁의 함성’을 택했습니다.
theological_decisions:
- issue: 히브리 시의 강한 신체-정서 은유 보존
  chosen_reading: 추상화하지 않고 ‘창자’, ‘담들’, ‘몸부림’ 같은 물리적 이미지를 살려 공포와 격통의 내부 파열을 드러냈습니다.
  alternative_readings:
  - ‘내 속이 뒤틀립니다’처럼 완화한 표현
  - ‘마음이 아픕니다’처럼 정서화한 표현
  rationale: 예레미야의 탄식은 단순한 감정 묘사가 아니라 임박한 전쟁에 대한 전인적 공포를 말하므로, 원문의 육체적 충격을 약화하지 않는 쪽이 문맥에 더 충실합니다.
  doctrine_reference: 예언서의 탄식과 심판 경고의 수사 보존
- issue: שמעתי נפשי의 호격/주어 모호성 처리
  chosen_reading: 한국어 본문에서는 ‘나의 영혼이 … 들었기 때문입니다’로 자연화하되, 문법적 긴장은 본문 흐름 속에 남겨 두었습니다.
  alternative_readings:
  - ‘나의 영혼아, 너는 들었습니다’로 직접 호격화
  - ‘내 영혼이 들었습니다’로 단순 주어화
  rationale: 히브리어는 자아 내부에 대한 직접 호출과 주어 진술 사이의 긴장을 갖는데, 본문에서는 과도한 해설 없이 의미를 보존하는 것이 가장 균형적입니다.
  doctrine_reference: 시적 화자 내부 독백의 문법적 모호성
