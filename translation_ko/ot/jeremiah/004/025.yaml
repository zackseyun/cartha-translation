base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/025.yaml
  text: I looked[a], and behold, there was no man, and all the birds of the heavens had fled.
  footnotes:
  - marker: a
    text: Or 'there was no humankind' / 'there was no humanity.' The Hebrew singular 'man' here has a generic representative sense.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 보았더니, 사람[a]이 하나도 없었고 하늘의 모든 새는 날아가 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 단수 ‘사람’은 여기서 남성 개인만이 아니라 인간 일반을 대표하는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I looked
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 보았습니다
  - 내가 보니
  lexicon: HALOT
  rationale: 예언적 시야를 따라 장면을 관찰하는 뉘앙스를 살려, 단순 사실 진술의 ‘보았습니다’보다 서술 흐름에 맞는 ‘내가 보니’를 택했습니다.
- source_word: אֵין הָאָדָם
  english_pob_choice: there was no man
  chosen_korean: 사람은 없었고
  alternatives_korean:
  - 남자는 없었고
  - 인류는 없었고
  - 사람은 없었고
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם의 대표적 일반 의미를 살려 ‘사람’으로 옮겼고, 자연스러운 한국어 부정 진술을 위해 뒤 절과 연결되는 대구형 표현을 사용했습니다.
- source_word: וְכָל עוֹף הַשָּׁמַיִם
  english_pob_choice: and all the birds of the heavens
  chosen_korean: 하늘의 모든 새들은
  alternatives_korean:
  - 하늘의 모든 새들은
  - 하늘의 모든 날짐승들은
  lexicon: HALOT
  rationale: 이 결합구는 관용적으로 ‘하늘의 새들’을 뜻하므로, 현대 한국어에서는 가장 분명한 ‘하늘의 모든 새들’로 옮겼습니다.
- source_word: נָדָדוּ
  english_pob_choice: had fled
  chosen_korean: 날아가 버렸습니다
  alternatives_korean:
  - 날아가 버렸습니다
  - 달아나 버렸습니다
  - 날아가 버렸습니다
  lexicon: HALOT
  rationale: 새가 사라지는 장면에서 נדד의 이탈·도주 의미를 한국어의 ‘날아가 버리다’로 자연스럽게 재현했습니다. 단순한 ‘사라졌다’보다 원문의 움직임이 더 분명합니다.
theological_decisions:
- issue: Generic singular אָדָם의 한국어 처리
  chosen_reading: 사람
  alternative_readings:
  - 인류
  - 인간
  rationale: 문맥상 남성 개인이 아니라 대표적 일반인을 가리키므로, 성별 배제적이기보다 원문 대표성을 유지하는 ‘사람’이 가장 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: אָדָם 일반 용례, gender-accurate principle'
