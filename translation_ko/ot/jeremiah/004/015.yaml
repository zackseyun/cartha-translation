source:
  edition: WLC
  text: כִּ֛י ק֥וֹל מַגִּ֖יד מִ/דָּ֑ן וּ/מַשְׁמִ֥יעַ אָ֖וֶן מֵ/הַ֥ר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/015.yaml
  text: For a voice is declaring from Dan[b][a], and proclaiming disaster from the hill country of Ephraim.
  footnotes:
  - marker: a
    text: Or 'calamity' or 'trouble'; the Hebrew word can also mean 'wickedness' in other contexts.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from Mount Ephraim'; the expression likely refers to the hill country region of Ephraim.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 한 소리가 단에서부터 전하고, 에브라임 산지에서 재앙을 선포하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로 ‘에브라임 산’이지만, 문맥상 에브라임의 산지/구릉지대를 가리키는 지역 표현으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אָוֶן은 문맥에 따라 ‘재앙’, ‘환난’, ‘악’ 등을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞뒤 문맥을 잇는 이유 표지로서, 한국어에서는 설명적 인과를 자연스럽게 드러내는 ‘이는 … 때문입니다’가 가장 안정적입니다.
- source_word: קוֹל מַגִּיד
  english_pob_choice: a voice is declaring
  chosen_korean: 한 소리가 … 전하고
  alternatives_korean:
  - 소리가 … 선언하고
  - 목소리가 … 알리고
  lexicon: HALOT
  rationale: קוֹל은 단순한 ‘음성’보다 들려오는 ‘소리’가 자연스럽고, מַגִּיד의 지속적 선포성을 ‘전하고’로 옮겨 예언적 경고의 현장감을 살렸습니다.
- source_word: אָוֶן
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 환난
  - 악
  lexicon: HALOT
  rationale: 이 문맥은 윤리적 ‘악’보다 임박한 심판적 파국을 가리키므로, POB의 ‘disaster’에 맞춰 ‘재앙’이 가장 적절합니다.
- source_word: מֵהַר אֶפְרָיִם
  english_pob_choice: from the hill country of Ephraim
  chosen_korean: 에브라임 산지에서
  alternatives_korean:
  - 에브라임 산에서
  - 에브라임 산악지대에서
  lexicon: HALOT
  rationale: 지리적 관용구로서 단수 ‘산’보다 지역 전체를 뜻하는 ‘산지’가 더 정확하며, POB의 해석을 따라 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예언적 현재 시제의 표현
  chosen_reading: ‘전하고, … 선포합니다’처럼 현재 진행의 생동감을 살려 예언의 즉시성을 드러냈습니다.
  alternative_readings:
  - ‘전합니다, … 선포합니다’
  - ‘전하고 있습니다, … 선포하고 있습니다’
  rationale: 히브리어 분사 מַגִּיד / מַשְׁמִיעַ의 지속적·현장적 뉘앙스를 보존하는 쪽이 본문의 경고성을 더 잘 전달합니다.
  doctrine_reference: 예언 문체의 현재성 보존
