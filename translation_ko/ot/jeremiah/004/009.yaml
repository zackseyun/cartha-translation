  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה יֹאבַ֥ד לֵב הַ/מֶּ֖לֶךְ וְ/לֵ֣ב הַ/שָּׂרִ֑ים וְ/נָשַׁ֨מּוּ֙ הַ/כֹּ֣הֲנִ֔ים וְ/הַ/נְּבִיאִ֖ים יִתְמָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/009.yaml
  text: And it will happen on that day[a], declares Yahweh, that the heart of the king and the heart of the officials will perish, and the priests will be appalled, and the prophets will be astonished.
  footnotes:
  - marker: a
    text: Or 'the courage of the king and the officials will fail.' The Hebrew says literally, 'the heart of the king and the heart of the officials will perish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에—야훼의 말씀입니다—왕의 마음과 관리들의 마음이 사라질 것이며, 제사장들은 놀라워하고, 예언자들은 경악할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “왕의 마음과 관리들의 마음이 사라질 것이다”라고 합니다. 여기서는 마음의 상실이 곧 용기와 결단의 붕괴를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그때
  lexicon: HALOT
  rationale: 예언 문맥의 시간 표지를 자연스럽게 살리면서도, 히브리어의 특정성(‘그’ 날)을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언 공식의 선언적 힘을 살리되, 현대 한국어에서 너무 경직된 관용어보다 출처가 분명한 서술형을 택했습니다.
- source_word: יֹאבַד לֵב הַמֶּלֶךְ וְלֵב הַשָּׂרִים
  english_pob_choice: the heart of the king and the heart of the officials will perish
  chosen_korean: 왕의 마음과 관리들의 마음이 사라질 것이며
  alternatives_korean:
  - 왕의 용기와 관리들의 용기가 사라질 것이며
  - 왕의 마음과 관리들의 심장이 사라질 것이며
  lexicon: HALOT
  rationale: לֵב의 문자적 이미지인 ‘마음’을 유지했고, אבד는 ‘사라지다’로 옮겨 한국어에서 마음/정신의 붕괴를 자연스럽게 드러냈습니다.
- source_word: וְנָשַׁמּוּ
  english_pob_choice: will be appalled
  chosen_korean: 놀라워하고
  alternatives_korean:
  - 경악하고
  - 황망해하고
  - 충격을 받을 것이며
  lexicon: HALOT
  rationale: 제사장들의 반응은 심리적 충격과 경악의 뉘앙스를 가지므로, 뒤의 예언자들과의 평행을 유지하면서도 과도하게 해석적이지 않은 표현을 선택했습니다.
- source_word: יִתְמָהוּ
  english_pob_choice: will be astonished
  chosen_korean: 경악할 것입니다
  alternatives_korean:
  - 놀랄 것입니다
  - 놀라워할 것입니다
  - 당황할 것입니다
  lexicon: HALOT
  rationale: תמה의 ‘놀람/경이/당혹’ 중 문맥상 강한 충격을 드러내는 방향으로 옮겨, 앞절의 ‘놀라워하고’와 함께 반응의 강도를 분명히 했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼로 옮기지 않고, 본문 내에서는 ‘야훼’만 사용하며 예언 공식 전체를 ‘야훼의 말씀입니다’로 처리했습니다.
  alternative_readings:
  - 야훼께서 말씀하십니다
  - 주님께서 말씀하십니다
  rationale: 프로젝트 기본 용례에 맞추어 신성한 이름을 가리되, 예언 공식의 담화 기능이 드러나도록 한국어 문장을 간결하게 구성했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: ‘heart’의 의미 범위
  chosen_reading: 문자적 ‘마음’을 유지하되, 여기서는 결단과 용기가 무너지는 의미를 함께 함축하도록 번역했습니다.
  alternative_readings:
  - 용기가 사라질 것
  - 정신이 무너질 것
  rationale: 히브리어 לֵב는 심리적 중심과 의지의 자리를 함께 가리킬 수 있으므로, 문자적 이미지를 보존하면서 문맥상 함의를 해치지 않도록 했습니다.
  doctrine_reference: 'Source semantics: לֵב as inner self/courage/intellect'
