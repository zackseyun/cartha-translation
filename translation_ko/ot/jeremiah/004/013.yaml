base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/013.yaml
  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
  footnotes:
  - marker: a
    text: Or 'than vultures'; the Hebrew נְשָׁרִים can refer more broadly to large carrion birds or raptors, though 'eagles' is the traditional rendering here.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그것이 구름처럼 올라오고, 그의 병거들은 회오리바람 같으며, 그의 말들은 독수리들보다 더 빨리 달립니다. 화가 우리에게 있도다 — 우리가 황폐하게 되었습니다![a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘독수리들’은 히브리어 נְשָׁרִים의 전통적 번역이며, 보다 넓게는 큰 사나운 새나 썩은 고기를 먹는 맹금류를 가리킬 수 있습니다.
    reason: lexical_alternative
