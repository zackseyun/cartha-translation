lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I looked
  chosen_korean: 내가 … 보니
  alternatives_korean:
  - 내가 보았습니다
  - 내가 바라보았습니다
  lexicon: HALOT
  rationale: 예언 환시의 진행감을 살리기 위해 단순 과거보다 관찰의 순간성을 드러내는 표현을 택했습니다.
- source_word: הֶהָרִים
  english_pob_choice: the mountains
  chosen_korean: 산들
  alternatives_korean:
  - 산
  - 산악들
  lexicon: HALOT
  rationale: heharim은 큰 산들을 가리키므로, 뒤의 ‘언덕들’과의 대비를 살리기 위해 복수형 ‘산들’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보니
  - 보십시오
  lexicon: HALOT
  rationale: 히브리어 הִנֵּה의 주의 환기 기능을 한국어 예언문체에 자연스러운 ‘보라’로 옮겼습니다.
- source_word: הִתְקַלְקָלוּ
  english_pob_choice: were shaken
  chosen_korean: 흔들리고 있었습니다
  alternatives_korean:
  - 떨리고 있었습니다
  - 무너져 가고 있었습니다
  - 요동치고 있었습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 수동보다 격렬한 불안정 상태를 나타내므로, ‘흔들리고 있었습니다’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 시적·환시적 화자의 시점 표현
  chosen_reading: ‘내가 … 보니’와 ‘보라’를 함께 써서, 단순 정보 전달이 아니라 예언적 환시의 급작스러운 시각 장면을 살렸습니다.
  alternative_readings:
  - ‘내가 보았습니다’로 평서적으로 옮김
  - ‘그리고 보라’로 직접적인 감탄형을 사용함
  rationale: 문맥은 예레미야의 환시적 관찰을 묘사하므로, 독자가 장면 전환과 긴박감을 바로 느끼도록 하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언서의 환시 서술 관습
