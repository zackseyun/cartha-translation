id: JER.4.17
reference: Jeremiah 4:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּ/שֹׁמְרֵ֣י שָׂדַ֔י הָי֥וּ עָלֶ֖י/הָ מִ/סָּבִ֑יב כִּי אֹתִ֥/י מָרָ֖תָה נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/017.yaml
  text: Like watchmen of a field[a], they are against her all around, because she has rebelled against me, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'Like guards of the open country' or 'Like keepers of a field.' The image is of watchers surrounding and guarding a field, here applied to enemies encircling the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 마치 밭을 지키는 파수꾼들처럼, 그들이 사방에서 그를 에워싸고 있습니다. 이는 그가 나를 거역했기 때문입니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들판을 지키는 자들처럼’, ‘시골을 지키는 자들처럼’으로도 옮길 수 있습니다. 이 이미지는 밭을 둘러 지키는 파수꾼들을 가리키며, 여기서는 도시를 포위한 적군에 적용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֹׁמְרֵי
  english_pob_choice: Like watchmen
  chosen_korean: 마치 … 파수꾼들처럼
  alternatives_korean:
  - 마치 … 지키는 자들처럼
  - 마치 … 경계하는 사람들처럼
  lexicon: HALOT
  rationale: כ의 비교 의미를 살려 ‘-처럼’으로 옮기고, שׁמר의 감시·보호 뉘앙스를 현대 한국어에서 자연스러운 ‘파수꾼’으로 반영했습니다.
- source_word: שָׂדַי
  english_pob_choice: of a field
  chosen_korean: 밭을
  alternatives_korean:
  - 들판을
  - 시골을
  lexicon: HALOT
  rationale: 기본 의미인 ‘field’를 유지하되, 경계하는 이미지가 살아나는 ‘밭’으로 옮겨 원문의 농경적 비유를 살렸습니다.
- source_word: עָלֶיהָ מִסָּבִיב
  english_pob_choice: against her all around
  chosen_korean: 사방에서 그를 에워싸고 있습니다
  alternatives_korean:
  - 사방에서 그에게 달려들고 있습니다
  - 그 둘레를 빙 둘러싸고 있습니다
  lexicon: HALOT
  rationale: על과 מסביב의 결합이 만드는 포위·적대의 장면을 한국어 동사구 ‘에워싸다’로 압축해 전달했습니다.
- source_word: מָרָתָה
  english_pob_choice: has rebelled
  chosen_korean: 거역했기 때문입니다
  alternatives_korean:
  - 반역했기 때문입니다
  - 배반했기 때문입니다
  lexicon: HALOT
  rationale: מרה의 핵심은 권위에 대한 반항·불복종이므로, 관계적이고 법정적인 ‘거역하다’로 옮겨 언약적 불순종의 무게를 보존했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה를 한국어에서 예언 선포를 드러내는 표지로 옮겼고, 관례적 대체어 대신 신명인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 여성 단수 대명사 עָלֶיהָ의 지시 대상
  chosen_reading: 본문의 여성형을 그대로 살려 ‘그’로 두되, 도시/공동체를 특정하지 않았습니다.
  alternative_readings:
  - 예루살렘
  - 시온의 딸
  - 유다
  rationale: 히브리어는 지시 대상을 암시적으로 남겨 두므로, 주어의 여성성만 보존하는 편이 본문의 이미지와 긴장을 가장 잘 유지합니다.
  doctrine_reference: 지시 대상을 과도하게 해석하지 않고 본문이 허용하는 범위 안에서 유지합니다.
