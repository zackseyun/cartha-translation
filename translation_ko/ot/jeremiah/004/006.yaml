id: JER.4.6
reference: Jeremiah 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂאוּ נֵ֣ס צִיּ֔וֹנָ/ה הָעִ֖יזוּ אַֽל תַּעֲמֹ֑דוּ כִּ֣י רָעָ֗ה אָנֹכִ֛י מֵבִ֥יא מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/006.yaml
  text: Raise a signal toward Zion[a]. Take refuge; do not stand still, for I am bringing disaster from the north[c][b], and great destruction.
  footnotes:
  - marker: a
    text: Or 'Raise a banner toward Zion.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Take refuge; do not stop.'
    reason: lexical_alternative
  - marker: c
    text: '''Disaster'' here refers to calamity or judgment, not moral evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「시온을 향해 신호를 올리십시오[a]. 피신하십시오[b]. 멈춰 서 있지 마십시오. 내가 북쪽에서 재앙[c]과 큰 파멸을 가져오고 있기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온을 향해 깃발을 올리십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘도피하십시오; 멈추지 마십시오.’
    reason: lexical_alternative
  - marker: c
    text: ‘재앙’은 도덕적 악이 아니라 재난이나 심판을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: שְׂאוּ נֵס
  english_pob_choice: Raise a signal
  chosen_korean: 신호를 올리십시오
  alternatives_korean:
  - 깃발을 올리십시오
  - 깃발을 세우십시오
  - 신호기를 세우십시오
  lexicon: HALOT
  rationale: נֵס는 문맥상 전쟁 경보나 집결을 위한 표지이므로, 기능을 드러내는 ‘신호’를 택했습니다. ‘올리십시오’는 שְׂאוּ의 높이 들어 올리는 동작을 자연스럽게 반영합니다.
- source_word: צִיּוֹנָה
  english_pob_choice: toward Zion
  chosen_korean: 시온을 향해
  alternatives_korean:
  - 시온으로
  - 시온 쪽으로
  lexicon: HALOT
  rationale: 방향을 나타내는 -ָה를 살려 ‘향해’로 옮겼습니다. 지명 자체를 단순 목적어처럼 처리하지 않도록 했습니다.
- source_word: הָעִיזוּ
  english_pob_choice: Take refuge
  chosen_korean: 피신하십시오
  alternatives_korean:
  - 피하십시오
  - 도망가십시오
  - 안전한 곳으로 가십시오
  lexicon: HALOT
  rationale: 이 명령은 지체하지 말고 급히 몸을 피하라는 긴급 경고이므로, 보호를 구하는 의미와 즉시성을 함께 담는 ‘피신하십시오’를 선택했습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 참화
  - 화
  lexicon: HALOT
  rationale: 예언서의 심판 문맥에서 רָעָה는 도덕적 ‘악’이 아니라 닥쳐오는 재난을 뜻하므로, 신학적 오해를 줄이는 ‘재앙’으로 옮겼습니다.
- source_word: שֶׁבֶר גָּדוֹל
  english_pob_choice: great destruction
  chosen_korean: 큰 파멸
  alternatives_korean:
  - 큰 멸망
  - 엄청난 파괴
  - 큰 붕괴
  lexicon: HALOT
  rationale: שֶׁבֶר는 ‘부서짐, 파괴, 멸망’의 폭을 가지며, 뒤의 병렬 구조와 어울리도록 간결한 ‘큰 파멸’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 ‘재앙’을 가져오신다고 말하는 표현의 처리
  chosen_reading: ‘재앙’으로 옮겨 하나님이 심판을 집행하신다는 뜻은 살리되, 도덕적 ‘악’을 뜻하는 것으로 오해되지 않게 했습니다.
  alternative_readings:
  - 악
  - 불행
  - 재난
  rationale: 문맥은 야훼의 주권적 심판 선포이므로, 본문의 긴장—하나님이 심판을 가져오신다는 점—을 약화시키지 않으면서도 하나님이 도덕적 악의 창시자라는 뉘앙스는 피해야 합니다.
  doctrine_reference: 예언서의 심판 언어와 하나님의 거룩성
