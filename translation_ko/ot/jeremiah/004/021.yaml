  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד מָתַ֖י אֶרְאֶה נֵּ֑ס אֶשְׁמְעָ֖ה ק֥וֹל שׁוֹפָֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/021.yaml
  text: How long must I see the signal flag and hear the sound of the trumpet?[a][b]
  footnotes:
  - marker: a
    text: Or 'banner,' 'standard,' or simply 'signal.' The Hebrew נֵס denotes an elevated sign or military signal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew שׁוֹפָר refers to a horn, often a ram's horn, used for warning or assembly.
    reason: cultural_note
translation:
  language: ko
  text: 언제까지 내가 깃발을 보며 나팔 소리를 들어야 합니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 언제까지
  alternatives_korean:
  - 얼마나 더
  - 언제까지나
  lexicon: HALOT
  rationale: 히브리어의 탄식형 시간 질문을 자연스러운 한국어 관용구로 옮기면 ‘언제까지’가 가장 직접적으로 대응합니다.
- source_word: אֶרְאֶה
  english_pob_choice: must I see
  chosen_korean: 내가 ... 보며
  alternatives_korean:
  - 내가 ... 보아야 합니까
  - 내가 ... 보게 됩니까
  lexicon: HALOT
  rationale: 문맥상 단순한 미래가 아니라 지속적으로 겪는 고통스러운 경험을 나타내므로, ‘보아야 합니까’보다 현재 진행적 상황을 살린 표현을 택했습니다.
- source_word: נֵּס
  english_pob_choice: signal flag
  chosen_korean: 깃발
  alternatives_korean:
  - 신호 깃발
  - 기
  - 표지
  lexicon: HALOT
  rationale: נֵס의 기능은 높이 세운 군사 신호이므로, 현대 한국어에서 그 기능을 가장 무리 없이 드러내는 ‘깃발’을 기본으로 삼았습니다.
- source_word: שׁוֹפָר
  english_pob_choice: trumpet
  chosen_korean: 나팔
  alternatives_korean:
  - 뿔나팔
  - 트럼펫
  lexicon: HALOT
  rationale: 히브리어 שׁוֹפָר은 경고나 소집에 쓰는 뿔나팔이지만, 한국어 성경 문맥에서는 관용적으로 ‘나팔’이 가장 널리 이해됩니다.
