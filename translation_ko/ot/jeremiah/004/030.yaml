id: JER.4.30
reference: Jeremiah 4:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/אתי שָׁד֜וּד מַֽה תַּעֲשִׂ֗י כִּֽי תִלְבְּשִׁ֨י שָׁנִ֜י כִּי תַעְדִּ֣י עֲדִי זָהָ֗ב כִּֽי תִקְרְעִ֤י בַ/פּוּךְ֙ עֵינַ֔יִ/ךְ לַ/שָּׁ֖וְא תִּתְיַפִּ֑י מָאֲסוּ בָ֥/ךְ עֹגְבִ֖ים נַפְשֵׁ֥/ךְ יְבַקֵּֽשׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
  footnotes:
  - marker: a
    text: Or 'plundered one' or 'destroyed one.' The Hebrew addresses a feminine singular figure, likely Jerusalem/Zion personified.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'though you tear your eyes with pukh.' 'Pukh' refers to dark eye cosmetic, often rendered 'kohl' or 'antimony.'
    reason: cultural_note
translation:
  language: ko
  text: 너, 황폐한 자여, 어떻게 하겠습니까? 비록 주홍빛 옷을 입고, 금장식으로 몸을 꾸미고, 눈을 화장품으로 크게 해도, 헛되이 자신을 아름답게 할 뿐입니다. 당신의 연인들은 당신을 멸시하며, 당신의 생명을 찾습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성 단수로 예루살렘/시온을 가리키는 것으로 이해될 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘푸크’는 눈둘레에 쓰는 짙은 화장 재료로, 콜(kohl)이나 안티몬으로도 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁדוּד
  english_pob_choice: devastated one
  chosen_korean: 황폐한 자
  alternatives_korean:
  - 약탈당한 자
  - 파괴된 자
  - 황폐한 여인
  lexicon: HALOT
  rationale: 피동적 상태를 나타내는 형용사적 표현으로, 원문의 폐허 상태를 자연스럽게 살리기 위해 '황폐한 자'로 옮겼습니다. 여성 단수 대상이라는 점은 문맥과 주소법으로 충분히 드러납니다.
- source_word: תִקְרְעִי בַפּוּךְ עֵינַיִךְ
  english_pob_choice: you enlarge your eyes with paint
  chosen_korean: 눈을 화장품으로 크게 해도
  alternatives_korean:
  - 눈에 콜을 칠해도
  - 안료로 눈을 강조해도
  - 눈을 검은 화장품으로 찢어 꾸며도
  lexicon: HALOT
  rationale: 직역하면 '푸크로 눈을 찢다/긋다'이지만, 현대 독자에게는 외양을 확장·강조하는 화장 관용구로 이해되는 점을 살려 자연스럽게 옮겼습니다. '화장품'은 구체 문화어를 노트 없이도 이해 가능하게 하는 최소한의 일반화입니다.
- source_word: לַשָּׁוְא תִּתְיַפִּי
  english_pob_choice: you beautify yourself in vain
  chosen_korean: 헛되이 자신을 아름답게 할 뿐입니다
  alternatives_korean:
  - 헛되이 스스로를 꾸며도 소용없습니다
  - 헛되이 미를 더해도 소용없습니다
  lexicon: HALOT
  rationale: 히트파엘의 반사적 뉘앙스를 살려 '자신을 아름답게 하다'로 옮기되, 판결적·경고적 어조를 분명히 하기 위해 '할 뿐입니다'를 사용했습니다.
- source_word: מָאֲסוּ בָךְ עֹגְבִים
  english_pob_choice: Your lovers despise you
  chosen_korean: 당신의 연인들은 당신을 멸시하며
  alternatives_korean:
  - 당신의 정욕적 연인들은 당신을 업신여기며
  - 당신의 애인들은 당신을 미워하며
  lexicon: HALOT
  rationale: עֹגְבִים은 예언서의 음란한 관계 은유 안에서 '사랑하는 자들/연인들'로 읽히므로, 직접적이면서도 한국어로 자연스러운 '연인들'을 택했습니다. 동사의 경멸 의미는 '멸시하다'로 분명히 했습니다.
- source_word: נַפְשֵׁךְ יְבַקֵּשׁוּ
  english_pob_choice: they seek your life
  chosen_korean: 당신의 생명을 찾습니다
  alternatives_korean:
  - 당신의 목숨을 찾습니다
  - 당신의 영혼을 찾습니다
  - 당신을 죽이려 합니다
  lexicon: HALOT
  rationale: נפש + בקש의 관용구는 '생명을 찾다' 곧 목숨을 노리다의 뜻이므로, 표현을 보존하면서도 한국어에서 자연스럽게 들리도록 옮겼습니다.
theological_decisions:
- issue: 예루살렘/시온의 여성 단수 의인화
  chosen_reading: 본문에 지시명을 덧붙이지 않고 2인칭 단수 직접 호칭만 유지했습니다.
  alternative_readings:
  - '''예루살렘아''를 본문에 명시하기'
  - '''딸 시온''으로 풀어 쓰기'
  rationale: 히브리어는 여성 단수로 예루살렘을 의인화해 꾸짖고 있으나, 이 절 자체의 문구는 그 이름을 직접 말하지 않습니다. 따라서 본문은 원문의 수사적 긴장을 유지하고, 식별은 문맥에 맡깁니다.
  doctrine_reference: Translation philosophy §1, §3, §6
