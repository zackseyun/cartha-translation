review_pass:
  verdict: revise
  source_fidelity: 전반적인 의미는 원문과 영어 감사 번역을 따르지만, ‘눈을 화장품으로 크게 하다’는 한국어로 부자연스럽고 푸크를 사용해 눈을 강조하는 관용적 표현을 충분히 전달하지 못합니다. 또한 נֶפֶשׁ+בקש는 여기서 단순히 생명을 ‘찾는다’가 아니라 목숨을 노린다는 뜻이므로 이를 분명히 하는 편이 충실합니다.
  naturalness: 초안은 ‘너’와 ‘당신’을 한 절 안에서 혼용하고, ‘눈을 화장품으로 크게 해도’ 및 ‘생명을 찾습니다’가 현대 표준 한국어에서 어색합니다. 합쇼체 직접 호칭을 일관되게 유지하고, 자연스러운 관용 표현으로 다듬었습니다.
  terminology: ‘황폐한 자’는 שָׁדוּד의 폭넓은 파괴·황폐 상태를 무리 없이 보존합니다. ‘연인들’은 עֹגְבִים의 은유를 과도하게 해석하지 않으며, ‘목숨을 노립니다’는 נַפְשֵׁךְ יְבַקֵּשׁוּ의 문맥상 의미를 자연스럽게 나타냅니다. 푸크의 구체적 의미와 직역은 해당 본문 위치의 각주에서 보완했습니다.
  issues:
