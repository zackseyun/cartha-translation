revisions:
- from: 너, 황폐한 자여, 어떻게 하겠습니까? 비록 주홍빛 옷을 입고, 금장식으로 몸을 꾸미고, 눈을 화장품으로 크게 해도, 헛되이 자신을 아름답게 할 뿐입니다. 당신의 연인들은 당신을 멸시하며, 당신의 생명을 찾습니다.[a][b]
  to: 황폐한 자여[a], 당신은 어떻게 하겠습니까? 비록 주홍색을 입고 금 장신구로 자신을 꾸미며, 눈가에 짙은 화장을 하여 눈을 크게 보이게 해도[b], 헛되이 자신을 아름답게 꾸밀 뿐입니다. 당신의 연인들은 당신을 멸시하고 당신의 목숨을 노립니다.
  rationale: 원문의 수사적 직접 호칭과 여성 단수 의인화는 본문에 특정 지명을 보태지 않고 유지했습니다. 푸크를 통한 눈 화장은 본문에서 이해 가능한 관용적 표현으로 옮기고, 직역 및 문화적 세부 사항은 해당 위치의 각주로 보완했습니다. 마지막 절은 ‘생명을 찾다’라는 직역투를 피하면서도 원문의 살해 의도를 보존하도록 ‘목숨을 노립니다’로 수정했습니다.
  reviewer_model: gpt-5.6-terra
