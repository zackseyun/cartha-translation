  - severity: medium
    issue: ‘당신의 생명을 찾습니다’
    rationale: 한국어에서는 의도가 불명확하게 들립니다. 원문의 관용구는 목숨을 빼앗으려 한다는 뜻이므로 ‘목숨을 노립니다’가 적절합니다.
