    issue: 2인칭 호칭 혼용 및 각주 표지 위치
    rationale: ‘너’와 ‘당신’을 함께 쓰면 문체가 흔들립니다. 또한 각주는 관련 어구 뒤에 두어 각주의 적용 범위를 명확히 하는 것이 좋습니다.
