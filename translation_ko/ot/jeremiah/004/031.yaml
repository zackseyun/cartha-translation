id: JER.4.31
reference: Jeremiah 4:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ ק֨וֹל כְּ/חוֹלָ֜ה שָׁמַ֗עְתִּי צָרָה֙ כְּ/מַבְכִּירָ֔ה ק֧וֹל בַּת צִיּ֛וֹן תִּתְיַפֵּ֖חַ תְּפָרֵ֣שׂ כַּפֶּ֑י/הָ אֽוֹי נָ֣א לִ֔/י כִּֽי עָיְפָ֥ה נַפְשִׁ֖/י לְ/הֹרְגִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/031.yaml
  text: 'For I have heard a sound like a woman in labor[a], distress like one giving birth to her first child— the sound of Daughter Zion gasping for breath, spreading out her hands: “Woe is me[c][b], for my life is faint before killers.”'
  footnotes:
  - marker: a
    text: Or “voice” or “cry” for the repeated Hebrew קול (“sound/voice”).
    reason: lexical_alternative
  - marker: b
    text: Hebrew “like one giving birth for the first time,” an image of especially intense labor pain.
    reason: cultural_note
  - marker: c
    text: Or “my soul is weary before murderers.” Hebrew nephesh can mean “soul,” “self,” or “life.”
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여자 해산하는 자의 소리와, 첫아이를 낳는 자의 고통 같은 곤란을 들었습니다. 시온의 딸이 숨을 헐떡이며 두 손을 벌리는 소리입니다. 「아, 내게 화가 있도다. 살인자들 앞에서 내 생명이 쇠약해집니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘소리/목소리/울음’에 해당하는 כּוֹל을 반복적으로 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘처음으로 낳는 여자’라는 뜻으로, 특히 강한 산통의 이미지를 담습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 נֶפֶשׁ은 여기서 ‘생명’, ‘목숨’, ‘영혼’, ‘자기’까지 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קּוֹל
  english_pob_choice: sound
  chosen_korean: 소리
  alternatives_korean:
  - 목소리
  - 울부짖음
  lexicon: HALOT
  rationale: קול은 ‘소리/목소리/울음’의 폭이 있지만, 첫째는 청각적 인상을 먼저 제시하고 둘째는 반복을 살려 주므로 ‘소리’가 가장 무난합니다.
- source_word: כְּחוֹלָה
  english_pob_choice: like a woman in labor
  chosen_korean: 여자 해산하는 자
  alternatives_korean:
  - 해산하는 여자 같은
  - 진통하는 여자 같은
  lexicon: HALOT
  rationale: 예언서 문맥에서 노동의 고통 이미지를 살려 ‘해산하는 여자’로 옮겼습니다. 현대 한국어에서는 다소 직역처럼 들리지만, 본문의 비유를 분명히 드러냅니다.
- source_word: כְּמַבְכִּירָה
  english_pob_choice: like one giving birth to her first child
  chosen_korean: 첫아이를 낳는 자
  alternatives_korean:
  - 첫 출산을 하는 여자
  - 첫아이를 해산하는 여자
  lexicon: HALOT
  rationale: ‘처음 낳는’이라는 강한 산통의 이미지를 보존하려고 ‘첫아이를 낳는’으로 옮겼습니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: Daughter Zion
  chosen_korean: 시온의 딸
  alternatives_korean:
  - 딸 시온
  - 시온 딸
  lexicon: HALOT
  rationale: 히브리 시적 인격화 표현을 한국어 관용에 맞게 풀어 ‘시온의 딸’로 옮겼습니다. 제목처럼 굳힌 음역보다 의미가 더 분명합니다.
- source_word: תִּתְיַפֵּחַ
  english_pob_choice: gasping for breath
  chosen_korean: 숨을 헐떡이며
  alternatives_korean:
  - 헐떡이며
  - 숨이 차서
  lexicon: HALOT
  rationale: 숨이 거칠고 끊기는 몸짓을 나타내므로 ‘숨을 헐떡이며’가 가장 자연스럽고 구체적입니다.
- source_word: עָיְפָה נַפְשִׁי
  english_pob_choice: my life is faint
  chosen_korean: 내 생명이 쇠약해집니다
  alternatives_korean:
  - 내 영혼이 지쳐갑니다
  - 내 목숨이 다해갑니다
  lexicon: HALOT
  rationale: נפש는 여기서 ‘생명/목숨/자기’의 의미를 가질 수 있으므로, 죽음의 위협 앞에서 가장 직접적인 ‘생명’으로 옮겼습니다. ‘쇠약해집니다’는 히브리어의 약해짐을 반영합니다.
- source_word: לְהֹרְגִים
  english_pob_choice: before killers
  chosen_korean: 살인자들 앞에서
  alternatives_korean:
  - 살해자들 앞에서
  - 죽이는 자들 앞에서
  lexicon: HALOT
  rationale: 분사형은 단순한 행위자가 아니라 실제로 죽이는 자들을 가리키므로, 의미를 분명히 하는 ‘살인자들’로 옮겼습니다. ל의 관계는 ‘앞에서’로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: נפש의 한국어 대응
  chosen_reading: ‘내 생명’은 이 구절에서 인간 내부의 영혼 분화보다 실제 생명의 쇠약을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 내 영혼
  - 내 목숨
  rationale: 문맥이 살해 위협에 직면한 비탄이므로, 독자에게 후대의 인류학적 구분을 불필요하게 불러오지 않도록 ‘생명’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 시온의 딸의 의인화
  chosen_reading: 시온/예루살렘을 울부짖는 여성으로 의인화한 시적 표현으로 유지했습니다.
  alternative_readings:
  - 시온의 주민들
  - 예루살렘
  rationale: 본문의 탄식 구조와 여성적 산통 이미지를 살리기 위해 인격화된 표현을 그대로 보존하는 것이 가장 충실합니다.
  doctrine_reference: Poetic personification in prophetic literature
