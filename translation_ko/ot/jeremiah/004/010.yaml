id: JER.4.10
reference: Jeremiah 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה אָכֵן֩ הַשֵּׁ֨א הִשֵּׁ֜אתָ לָ/עָ֤ם הַ/זֶּה֙ וְ/לִ/ירוּשָׁלִַ֣ם לֵ/אמֹ֔ר שָׁל֖וֹם יִהְיֶ֣ה לָ/כֶ֑ם וְ/נָגְעָ֥ה חֶ֖רֶב עַד הַ/נָּֽפֶשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/010.yaml
  text: Then I said[a], “Ah, Lord Yahweh, surely you have greatly deceived this people and Jerusalem, saying[b], ‘You will have peace,’ while the sword has reached to the soul.”
  footnotes:
  - marker: a
    text: Or 'have utterly deceived' or 'have badly misled.' The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the life' or 'to the throat.' Hebrew nephesh here likely refers to life itself, expressing that the sword has reached to the point of death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 말했습니다. “아, 주 야훼여, 주께서 이 백성과 예루살렘을 참으로 크게 속이셨습니다. ‘너희에게 평강이 있을 것이다’라고 하셨지만, 칼이 목숨에까지 닿았습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전히 속이셨다’, ‘몹시 미혹하셨다’. 히브리어는 부정사 절대형과 완료형을 함께 써서 강세를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목숨까지’, ‘목구멍까지’. 여기서 네페쉬는 생명 자체를 가리켜, 칼이 죽음의 경계까지 이르렀다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 아이고
  - 아하
  lexicon: HALOT
  rationale: 탄식과 당혹을 나타내는 감탄사로, 현대 한국어에서 짧고 직접적인 ‘아’가 원문의 돌출된 감정을 가장 자연스럽게 살립니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 합성 신칭을 분해하지 않고 그대로 살리기 위해 ‘주’와 YHWH의 학술 음역 ‘야훼’를 대응시켰습니다. 교회 전통어 ‘여호와’보다 원문 투명성이 높습니다.
- source_word: הַשֵּׁא הִשֵּׁאתָ
  english_pob_choice: have greatly deceived
  chosen_korean: 참으로 크게 속이셨습니다
  alternatives_korean:
  - 완전히 속이셨습니다
  - 몹시 속이셨습니다
  - 크게 미혹하셨습니다
  lexicon: HALOT
  rationale: 반복 구조의 강조를 한국어 부사 ‘참으로 크게’로 옮겨 강세를 살렸고, 예레미야의 항변적 어조를 유지하기 위해 ‘속이다’를 택했습니다.
- source_word: עַד הַנָּפֶשׁ
  english_pob_choice: to the soul
  chosen_korean: 목숨에까지
  alternatives_korean:
  - 영혼에까지
  - 생명에까지
  - 목구멍까지
  lexicon: HALOT
  rationale: נֶפֶשׁ의 문맥상 의미가 죽음에 이르는 생명 자체이므로, 한국어에서는 관용적으로 이해되는 ‘목숨’으로 풀어 원문의 생명 위협을 선명하게 했습니다.
theological_decisions:
- issue: 하나님이 ‘속이셨다’는 예레미야의 직접적 고발을 어떻게 처리할지
  chosen_reading: 본문의 직설을 유지해 ‘참으로 크게 속이셨습니다’로 번역했습니다.
  alternative_readings:
  - 완전히 미혹하셨습니다
  - 사람들이 속게 하셨습니다
  rationale: 히브리어의 강조형은 실제로 강한 책임 귀속을 담고 있으므로, 번역자가 이를 완화해 해소하지 않고 예레미야의 탄식 자체를 드러내는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
