id: JER.4.16
reference: Jeremiah 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַזְכִּ֣ירוּ לַ/גּוֹיִ֗ם הִנֵּה֙ הַשְׁמִ֣יעוּ עַל יְרוּשָׁלִַ֔ם נֹצְרִ֥ים בָּאִ֖ים מֵ/אֶ֣רֶץ הַ/מֶּרְחָ֑ק וַֽ/יִּתְּנ֛וּ עַל עָרֵ֥י יְהוּדָ֖ה קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/016.yaml
  text: 'Declare it to the nations: ‘Look[a], proclaim it concerning Jerusalem: Watchers are coming from a distant land, and they raise their voice against the cities of Judah.’'
  footnotes:
  - marker: a
    text: Or 'besiegers' for 'watchers'; the Hebrew term literally denotes those who watch or keep guard, but in context it may refer to hostile forces surrounding a city.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 민족들 가운데서 선포하십시오. 「보십시오, 예루살렘에 관해 선포하십시오. 지키는 자들이 먼 땅에서 오고 있으며, 유다의 성읍들을 향해 그들의 소리를 높이고 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포위자들’. 히브리어는 문자적으로는 ‘지키는 자들/감시하는 자들’을 뜻하지만, 문맥상 성읍을 둘러싼 적대 세력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּ֣ירוּ לַ/גּוֹיִ֗ם
  english_pob_choice: Declare it to the nations
  chosen_korean: 너희는 민족들 가운데서 선포하십시오
  alternatives_korean:
  - 민족들에게 알리십시오
  - 열방에 선언하십시오
  - 민족들 가운데서 알려 주십시오
  lexicon: HALOT
  rationale: לַגּוֹיִם은 ‘민족들/열방’의 뜻이므로 ‘민족들’로 옮기고, 공적 경고의 명령문 성격은 ‘선포하십시오’로 살렸습니다. ‘to the nations’의 직접성보다 한국어 자연성을 위해 조사와 어순을 조정했습니다.
- source_word: הִנֵּה֙
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 자
  lexicon: HALOT
  rationale: 주의를 끄는 감탄사이므로 현대적이면서도 공적 경고에 어울리는 공손한 명령형 ‘보십시오’로 처리했습니다. POB의 ‘Look’이 지닌 즉각적 주목의 힘을 유지합니다.
- source_word: נֹצְרִ֥ים
  english_pob_choice: Watchers
  chosen_korean: 지키는 자들
  alternatives_korean:
  - 감시자들
  - 파수꾼들
  - 포위자들
  lexicon: HALOT
  rationale: 어근상 ‘지키다/감시하다’의 의미를 살려 문자적으로는 ‘지키는 자들’로 옮겼습니다. 문맥의 적대성은 다음 절의 동작과 대상에서 드러나므로, 이 낱말 자체를 ‘포위자들’로 과도하게 해석하지 않았습니다.
- source_word: בָּאִים מֵ/אֶ֣רֶץ הַ/מֶּרְחָ֑ק
  english_pob_choice: are coming from a distant land
  chosen_korean: 먼 땅에서 오고 있으며
  alternatives_korean:
  - 먼 나라에서 오고 있으며
  - 먼 곳에서 오고 있으며
  - 먼 땅에서 오고 있습니다
  lexicon: HALOT
  rationale: ‘먼 땅’은 지리적 거리의 표현을 직접 살리고, 현재 진행형은 임박한 접근을 나타내기 위해 ‘오고 있으며’로 옮겼습니다.
- source_word: וַֽ/יִּתְּנ֛וּ ... קוֹלָם
  english_pob_choice: they raise their voice
  chosen_korean: 그들의 소리를 높이고 있습니다
  alternatives_korean:
  - 그들의 목소리를 높이고 있습니다
  - 목소리를 높여 외치고 있습니다
  - 소리를 지르고 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘목소리를 내다/주다’의 의미를 한국어 관용에 맞게 ‘소리를 높이다’로 풀었습니다. 군사적 위협의 긴박함을 유지하면서도 직역의 어색함은 피했습니다.
theological_decisions:
- issue: הַשְׁמִיעוּ עַל יְרוּשָׁלִַם의 방향성과 적대성
  chosen_reading: 예루살렘에 관해 선포하십시오
  alternative_readings:
  - 예루살렘 위에 선포하십시오
  - 예루살렘을 향해 선포하십시오
  - 예루살렘에 대해 알리십시오
  rationale: עַל + 지명은 이곳에서 단순한 ‘~에 대해’와 적대적 뉘앙스 사이를 오가므로, 한국어 본문에서는 중립적이되 다음 절의 적대적 내용이 자연히 이어지도록 ‘관해’로 옮겼습니다.
  doctrine_reference: 문맥상 예언 경고의 공적 선포
- issue: נֹצְרִים을 ‘지키는 자들’로 둘지 ‘포위자들’로 둘지
  chosen_reading: 문자적 어휘를 살려 ‘지키는 자들’로 두고, 적대성은 문맥에서 드러나게 함
  alternative_readings:
  - 포위자들로 의역
  - 파수꾼들로 번역
  rationale: POB의 auditable 원칙에 따라, 어휘가 본래 가진 ‘지키다/감시하다’ 의미를 지키고 문맥적 침략성은 다음 구절과 병치로 전달했습니다. 이렇게 해야 본문의 이미지와 해석상의 긴장을 지우지 않습니다.
  doctrine_reference: 예언서의 이미지 언어 보존
