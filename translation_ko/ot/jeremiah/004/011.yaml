  - 광야로부터
  lexicon: מִדְבָּר
  rationale: 원문의 전치사적 수식을 한국어 관형어로 자연스럽게 풀어 앞 문구 전체를 한 덩어리의 출처 표지로 유지했습니다.
- source_word: לִזְרוֹת / for winnowing
  english_pob_choice: for winnowing
  chosen_korean: 까부르기 위한 것도
  alternatives_korean:
