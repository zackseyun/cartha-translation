  lexicon: רוּחַ, צַח, שְׁפָיִים
  rationale: רוּחַ는 ‘바람’, צַח는 POB의 ‘scorching’을 반영해 ‘뜨거운’으로, שְׁפָיִים은 지형의 노출성과 황량함을 살려 ‘민둥한 높은 곳’으로 옮겼습니다.
- source_word: בַּמִּדְבָּר / in the wilderness
  english_pob_choice: in the wilderness
  chosen_korean: 광야의
  alternatives_korean:
