base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: ko
  text: 그때에 이 백성과 예루살렘에 이렇게 말할 것입니다. “광야의 민둥한 산등성이에서 불어오는 뜨거운 바람이 내 백성의 딸을 향해 옵니다. 까부르기 위한 것도 아니고 깨끗하게 하기 위한 것도 아닙니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민둥한 산등성이’는 히브리어 שְׁפָיִים, 곧 나무나 초목이 드문 노출된 높은 지대를 옮긴 말입니다.
    reason: source_note
  - marker: b
    text: ‘까부르기’는 곡식을 바람에 날려 쭉정이 등을 가르는 키질을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘깨끗하게 하기’는 히브리어 לְהָבַר를 옮긴 말로, 여기서는 앞의 ‘까부르기’와 함께 곡식을 처리하는 유익한 목적을 부정하는 표현입니다.
    reason: lexical_alternative
