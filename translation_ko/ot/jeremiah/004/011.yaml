  - 정화하기 위한 것도
  lexicon: הָבַר
  rationale: 문맥상 곡식 처리 비유를 유지하면서도 한국어에서 ‘cleansing’의 결과를 가장 분명히 드러내는 ‘정결하게 하다’를 택했습니다.
