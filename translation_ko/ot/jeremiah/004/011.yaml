base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: ko
  text: 그때에는 이 백성과 예루살렘에 이렇게 말할 것입니다. “광야의 민둥한 높은 곳에서 불어오는 뜨거운 바람이 내 백성의 딸을 향해 옵니다 — 까부르기 위한 것도 아니고 정결하게 하기 위한 것도 아닙니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광야의 민둥한 높은 곳’은 히브리어 שְׁפָיִים의 지형·시각적 이미지를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘까부르기’는 곡식의 껍질과 알곡을 분리하는 뜻으로, 영어 POB의 winnowing을 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘정결하게 하기’는 곡식 정련의 비유를 한국어 독자가 바로 이해하도록 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא / At that time
  english_pob_choice: At that time
  chosen_korean: 그때에는
  alternatives_korean:
  - 그 시각에는
  - 그때에
  lexicon: 시간표현
  rationale: 예언 문맥의 전환 표지로 자연스럽고 간결한 표준어 표현을 사용했습니다.
- source_word: רוּחַ צַח שְׁפָיִים / A scorching wind from the bare heights
  english_pob_choice: A scorching wind from the bare heights
  chosen_korean: 광야의 민둥한 높은 곳에서 불어오는 뜨거운 바람
  alternatives_korean:
  - 광야의 메마른 높은 곳에서 불어오는 뜨거운 바람
  - 광야의 벌거벗은 언덕들에서 불어오는 타는 듯한 바람
  lexicon: רוּחַ, צַח, שְׁפָיִים
  rationale: רוּחַ는 ‘바람’, צַח는 POB의 ‘scorching’을 반영해 ‘뜨거운’으로, שְׁפָיִים은 지형의 노출성과 황량함을 살려 ‘민둥한 높은 곳’으로 옮겼습니다.
- source_word: בַּמִּדְבָּר / in the wilderness
  english_pob_choice: in the wilderness
  chosen_korean: 광야의
  alternatives_korean:
  - 광야에서
  - 광야로부터
  lexicon: מִדְבָּר
  rationale: 원문의 전치사적 수식을 한국어 관형어로 자연스럽게 풀어 앞 문구 전체를 한 덩어리의 출처 표지로 유지했습니다.
- source_word: לִזְרוֹת / for winnowing
  english_pob_choice: for winnowing
  chosen_korean: 까부르기 위한 것도
  alternatives_korean:
  - 키질하기 위한 것도
  - 곡식을 까부르기 위한 것도
  lexicon: זָרָה
  rationale: POB가 분리 행위의 이미지를 유지하므로 농사 용어인 ‘까부르다’로 옮겨 의미와 이미지 모두를 살렸습니다.
- source_word: לְהָבַר / for cleansing
  english_pob_choice: for cleansing
  chosen_korean: 정결하게 하기 위한 것도
  alternatives_korean:
  - 깨끗하게 하기 위한 것도
  - 정화하기 위한 것도
  lexicon: הָבַר
  rationale: 문맥상 곡식 처리 비유를 유지하면서도 한국어에서 ‘cleansing’의 결과를 가장 분명히 드러내는 ‘정결하게 하다’를 택했습니다.
theological_decisions:
- issue: 부정 병렬의 보존
  chosen_reading: “까부르기 위한 것도 아니고 정결하게 하기 위한 것도 아닙니다”로 두 목적부정을 모두 살렸습니다.
  alternative_readings:
  - “까부르기 위한 것도 아니며 정결하게 하기 위한 것도 아닙니다”
  - “까부르기 위한 것도 아니고 깨끗하게 하기 위한 것도 아닙니다”
  rationale: 영어 POB의 문장 리듬과 히브리어의 이중 부정 구조를 유지해야 예언의 파괴성과 무용성이 선명하게 드러납니다.
  doctrine_reference: 예언적 심판의 이미지 보존
