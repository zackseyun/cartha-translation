  - 곡식을 까부르기 위한 것도
  lexicon: זָרָה
  rationale: POB가 분리 행위의 이미지를 유지하므로 농사 용어인 ‘까부르다’로 옮겨 의미와 이미지 모두를 살렸습니다.
- source_word: לְהָבַר / for cleansing
  english_pob_choice: for cleansing
  chosen_korean: 정결하게 하기 위한 것도
  alternatives_korean:
