id: JER.4.29
reference: Jeremiah 4:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/קּ֨וֹל פָּרָ֜שׁ וְ/רֹ֣מֵה קֶ֗שֶׁת בֹּרַ֨חַת֙ כָּל הָ/עִ֔יר בָּ֚אוּ בֶּ/עָבִ֔ים וּ/בַ/כֵּפִ֖ים עָל֑וּ כָּל הָ/עִ֣יר עֲזוּבָ֔ה וְ/אֵין יוֹשֵׁ֥ב בָּ/הֵ֖ן אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/029.yaml
  text: At the sound of the horseman and the archer[a], every city flees; they go into the thickets and climb up among the rocks. Every city is abandoned[d][c][b], and no man dwells in them.
  footnotes:
  - marker: a
    text: Or 'Because of the sound of the horseman and the archer.' The Hebrew preposition can express either occasion or cause.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'every city flees' may also be understood collectively as 'the whole city flees.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term rendered 'thickets' is uncertain; some take it as 'clouds,' but the context of hiding places favors dense cover.
    reason: lexical_alternative
  - marker: d
    text: Or 'no one dwells in them.' Hebrew literally says 'no man dwells in them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기마병과 활을 쏘는 자의 소리에[ㄱ] 모든 성읍이 달아납니다.[ㄴ] 그들은 덤불[ㄷ] 속으로 들어가고 바위들 사이로 올라갑니다. 모든 성읍은 버려져, 그 안에 사는 사람은 아무도 없습니다.[ㄹ]
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 ‘기마병과 활을 쏘는 자의 소리 때문에’. 히브리어 전치사는 소리가 들린 계기 또는 그 소리로 말미암은 원인을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: ㄴ
    text: 히브리어의 단수 ‘성읍’은 ‘온 성읍’으로 집합적으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: ㄷ
    text: 히브리어 낱말의 뜻은 확실하지 않습니다. ‘구름’으로 이해하는 견해도 있으나, 숨을 곳이라는 문맥에서는 빽빽한 수풀이나 덤불로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: ㄹ
    text: 히브리어는 직역하면 ‘그들 안에 사는 남자가 없다’라고 말합니다. 여기서는 남성 단수가 일반적으로 사람을 가리키며, 성읍들이 완전히 비었음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל פָּרָשׁ וְרֹמֵה קֶשֶׁת
  english_pob_choice: At the sound of the horseman and the archer
  chosen_korean: 말 타는 자와 활 쏘는 자의 소리 때문에
  alternatives_korean:
  - 말 탄 군사의 소리 때문에
  - 기마병과 궁사의 소리 때문에
  - 그 소리를 들은 순간
  lexicon: HALOT
  rationale: מִן + קוֹל은 원인과 계기를 모두 가질 수 있어, 공포가 촉발되는 상황을 살리되 원인 쪽 뉘앙스를 반영하는 ‘…소리 때문에’로 옮겼습니다. פָּרָשׁ과 רֹמֵה קֶשֶׁת은 군사적 공격자를 가리키므로 자연스러운 현대 한국어로 풀었습니다.
- source_word: בֹּרַחַת כָּל הָעִיר
  english_pob_choice: every city flees
  chosen_korean: 모든 성읍이 달아납니다
  alternatives_korean:
  - 온 성읍이 달아납니다
  - 각 성읍이 달아납니다
  - 온 도시가 달아납니다
  lexicon: HALOT
  rationale: 히브리어는 단수 ‘성읍’이지만 집합적으로 각 성읍이 비는 장면이므로, 한국어에서는 자연스럽게 ‘모든 성읍’으로 옮겨 분배적 의미를 살렸습니다.
- source_word: בֶּעָבִים וּבַכֵּפִים
  english_pob_choice: into the thickets ... among the rocks
  chosen_korean: 덤불 속으로 들어가고 바위들 사이로 올라갑니다
  alternatives_korean:
  - 수풀 속으로 들어가고 바위들 사이로 올라갑니다
  - 덤불 속으로 들어가고 암벽 사이로 올라갑니다
  - 구름 속으로 들어가고 바위들 사이로 올라갑니다
  lexicon: HALOT
  rationale: עָבִים은 문맥상 숨을 곳인 빽빽한 식생을 가리키므로 ‘덤불 속’이 적절합니다. כֵּפִים은 바위/바위틈을 뜻하므로, 피난처를 찾는 동작을 살려 ‘바위들 사이로 올라갑니다’로 옮겼습니다.
- source_word: עֲזוּבָה וְאֵין יוֹשֵׁב בָּהֵן אִישׁ
  english_pob_choice: is abandoned ... and no man dwells in them
  chosen_korean: 버려지고, 그 안에 사는 사람은 아무도 없습니다
  alternatives_korean:
  - 황폐해지고, 그 안에 사는 사람은 아무도 없습니다
  - 버려지고, 그 안에 사는 자는 없습니다
  - 버려지고, 그 안에는 사람이 살지 않습니다
  lexicon: HALOT
  rationale: עֲזוּבָה의 결과 상태를 ‘버려지고’로 간결하게 살렸습니다. אִישׁ를 직역하면 ‘사람’보다 ‘남자’가 되지만, 여기서는 성별 표지보다 완전한 무주 상태가 핵심이므로 문맥상 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 성읍의 집단적 붕괴를 어떻게 드러낼지
  chosen_reading: ‘모든 성읍이 달아납니다’와 ‘그 안에 사는 사람은 아무도 없습니다’로 도시 공동체의 공포와 철수를 분명히 드러냈습니다.
  alternative_readings:
  - ‘온 성읍이 달아납니다’
  - ‘그 안에 사는 자는 없습니다’
  rationale: 예언 본문은 단순한 개인 도주가 아니라 도시 전체의 붕괴와 공백을 강조하므로, 집합성과 공허함을 모두 보이도록 옮겼습니다.
  doctrine_reference: 예언 심판의 전면성
