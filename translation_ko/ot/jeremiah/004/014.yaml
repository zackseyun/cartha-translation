lexical_decisions:
- source_word: כַּבְּסִי
  english_pob_choice: Wash your heart clean
  chosen_korean: 네 마음에서 악을 씻어 내라
  alternatives_korean:
  - 네 마음을 씻어라
  - 네 마음을 깨끗하게 하라
  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로 ‘씻다/빨다’의 구체적 이미지를 가지므로, 한국어에서도 ‘씻어 내라’로 정결의 행동성을 살리되 ‘깨끗하게’ 같은 결과 표현은 덧붙이지 않았습니다.
- source_word: מֵרָעָה
  english_pob_choice: from evil
  chosen_korean: 악을
  alternatives_korean:
  - 악에서
  - 악으로부터
  - 악한 것에서
  lexicon: HALOT
  rationale: 전치사 מִן의 분리 의미를 살려 ‘악을 씻어 내라’로 옮기면, 도덕적 악을 씻어 버린다는 뜻이 자연스럽게 드러납니다.
- source_word: תִּוָּשֵׁעִי
  english_pob_choice: you may be saved
  chosen_korean: 네가 구원을 받을 것이다
  alternatives_korean:
  - 네가 구원을 받게 될 것이다
  - 네가 구원되겠다
  - 네가 구원을 얻을 것이다
  lexicon: HALOT
  rationale: נִפעל형의 רחב한 의미를 좁히지 않고, 선지서의 경고와 회복 가능성을 함께 살리기 위해 ‘구원을 받다’로 옮겼습니다.
- source_word: תָּלִין
  english_pob_choice: will ... lodge
  chosen_korean: 머물겠느냐
  alternatives_korean:
  - 묵겠느냐
  - 밤을 보내겠느냐
  - 들어앉아 있겠느냐
  lexicon: HALOT
  rationale: 원뜻은 ‘묵다/숙박하다’이지만, 생각이 마음속에 계속 자리 잡는다는 비유를 한국어에서 자연스럽게 드러내기 위해 ‘머물다’를 선택했습니다.
- source_word: מַחְשְׁבוֹת אוֹנֵךְ
  english_pob_choice: wicked thoughts
  chosen_korean: 악한 생각들
  alternatives_korean:
  - 악한 계획들
  - 네 악한 생각들
  - 불의한 생각들
  lexicon: HALOT
  rationale: מַחְשְׁבוֹת는 생각/계획/꾀를 포괄하지만, 여기서는 내면의 도덕적 부패를 가리키므로 ‘악한 생각들’이 가장 간결하고 본문 흐름에도 맞습니다.
theological_decisions:
- issue: תִּוָּשֵׁעִי의 구원/해방 범위
  chosen_reading: ‘구원을 받을 것이다’로 옮겨 즉각적 재난에서의 건짐과 더 넓은 구원 의미를 둘 다 열어 두었습니다.
  alternative_readings:
  - 구원을 받게 될 것이다
  - 구출될 것이다
  rationale: 예레미야의 문맥은 임박한 심판과 회개를 통한 회복 가능성을 함께 담고 있으므로, 의미를 한쪽으로만 좁히지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장을 해소하지 말고 보존)
- issue: 명령문의 대상을 향한 직접 호칭과 수사적 질문
  chosen_reading: 예루살렘을 여성 단수의 인격화된 대상로 직접 부르고, 뒤의 질문도 선지자적 책망의 어조를 유지했습니다.
  alternative_readings:
  - 예루살렘이여
  - 예루살렘아
  rationale: 히브리어의 직접 호칭과 탄식적 책망을 살리기 위해 고전적 종결형보다 현대 한국어의 직설적 호명을 택했습니다.
  doctrine_reference: Source rhetoric preservation
