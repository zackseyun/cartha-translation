id: JER.4.1
reference: Jeremiah 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם תָּשׁ֨וּב יִשְׂרָאֵ֧ל נְאֻם יְהוָ֛ה אֵלַ֖/י תָּשׁ֑וּב וְ/אִם תָּסִ֧יר שִׁקּוּצֶ֛י/ךָ מִ/פָּנַ֖/י וְ/לֹ֥א תָנֽוּד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/001.yaml
  text: If you return[a], O Israel, declares Yahweh, to me you should return; if you remove your detestable things from before me and do not wander about[c][b],
  footnotes:
  - marker: a
    text: Or, 'If you return, O Israel ... you will return to me,' preserving the repeated Hebrew verb more formally.
    reason: alternative_reading
  - marker: b
    text: '''Detestable things'' refers especially to abhorrent idolatrous objects; alternatively, ''your abominations'' or more interpretively ''your idols.'''
    reason: lexical_alternative
  - marker: c
    text: Or, 'and do not waver' or 'and do not stray'; the Hebrew verb can suggest wandering, instability, or wavering.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘아, 네가 돌아오면—야훼의 말씀이니라—내게로 돌아오라. 네가 내 앞에서 네 가증한 것들을 치우고, 또 떠돌아다니지 않으면[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘가증한 것들’은 특히 혐오스러운 우상적 물건을 가리키며, 문맥상 ‘네 우상들’로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘흔들리지 않으면’, ‘방황하지 않으면’으로도 옮길 수 있습니다. 히브리어 동사는 떠돎, 불안정, 흔들림의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תָּשׁוּב יִשְׂרָאֵל
  english_pob_choice: If you return, O Israel
  chosen_korean: 이스라엘아, 네가 돌아오면
  alternatives_korean:
  - 이스라엘아, 네가 돌아서면
  - 이스라엘아, 네가 회개하면
  lexicon: HALOT
  rationale: שׁוּב의 기본 뜻인 ‘돌아오다’를 살리되, 예언자적 호소의 직접 호명 구조를 한국어 자연어로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼의 선언이니라
  - 야훼께서 말씀하신다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה를 간결한 선포형으로 옮기면서, 본문 표준에 따라 신명사 יְהוָה는 ‘야훼’로 렌더링했습니다.
- source_word: תָּשׁוּב אֵלַי
  english_pob_choice: to me you should return
  chosen_korean: 내게로 돌아오라
  alternatives_korean:
  - 내게로 너는 돌아와야 한다
  - 내게로 돌아올지어다
  lexicon: HALOT
  rationale: 반복되는 שוב의 수사적 강조를 한국어에서는 명령/촉구형으로 자연스럽게 드러내어, 단순 조건문으로 약화되지 않게 했습니다.
- source_word: שִׁקּוּצֶיךָ
  english_pob_choice: your detestable things
  chosen_korean: 네 가증한 것들
  alternatives_korean:
  - 네 혐오스러운 것들
  - 네 우상들
  lexicon: HALOT
  rationale: שִׁקּוּץ의 혐오·가증의 감각을 살리면서도, 문맥상 우상 숭배 물건으로 지나치게 좁히지 않는 표현을 택했습니다.
- source_word: וְלֹא תָנוּד
  english_pob_choice: and do not wander about
  chosen_korean: 떠돌아다니지 않으면
  alternatives_korean:
  - 흔들리지 않으면
  - 방황하지 않으면
  lexicon: HALOT
  rationale: נוד의 의미 범위인 떠돎/방황/흔들림을 고려해, 예언적 경고의 불안정성을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 여호와 신명 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유신명 ‘야훼’를 유지해 언약적 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 반복되는 שוב의 수사적 힘
  chosen_reading: '조건-촉구 구조로 유지: ‘네가 돌아오면 … 내게로 돌아오라’'
  alternative_readings:
  - ‘네가 돌아오면 … 네가 내게로 돌아올 것이다’
  - ‘네가 돌아오면 … 내게로 돌아와야 한다’
  rationale: 히브리어의 반복을 하나의 의미로 평평하게 만들지 않고, 회복 요청의 긴박함과 언약적 귀환의 강조를 함께 드러냈습니다.
  doctrine_reference: 'Translation philosophy: preserve source-text sense over translation tradition; document significant variance'
