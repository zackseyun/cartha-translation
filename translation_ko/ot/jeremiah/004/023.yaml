  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת הָ/אָ֔רֶץ וְ/הִנֵּה תֹ֖הוּ וָ/בֹ֑הוּ וְ/אֶל הַ/שָּׁמַ֖יִם וְ/אֵ֥ין אוֹרָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/023.yaml
  text: I looked at the earth[a], and behold, it was formless and empty; and at the heavens, and they had no light.
  footnotes:
  - marker: a
    text: Hebrew tohu vabohu, traditionally 'without form and void' or 'waste and void'; the phrase echoes Genesis 1:2.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 땅을 바라보니[a], 보아라, 그것은 혼돈과 공허였습니다. 하늘을 바라보니, 그곳에는 빛이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 tohu vabohu는 전통적으로 ‘without form and void’ 또는 ‘waste and void’로 옮겨졌으며, 창세기 1:2를 메아리합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  english_pob_choice: I looked
  chosen_korean: 내가 ... 바라보니
  alternatives_korean:
  - 내가 보니
  - 내가 보았습니다
  lexicon: HALOT
  rationale: 예언적 환상 장면의 관찰적·시각적 진입을 살리기 위해 단순한 ‘보다’보다 ‘바라보니’를 택했습니다. 영어 POB의 ‘I looked’에 대응하면서 문맥의 현장감을 유지합니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅 위
  - 세상
  - 지구
  lexicon: HALOT
  rationale: 여기서는 ‘하늘’과의 대조 속에서 전 우주적 장면을 이루지만, 한국어 성경 문맥에서는 ‘땅’이 가장 자연스럽게 ‘earth’를 담습니다. ‘지구’는 현대적이지만 본문 톤을 과도하게 좁힙니다.
- source_word: תֹהוּ וָבֹהוּ
  english_pob_choice: formless and empty
  chosen_korean: 혼돈과 공허
  alternatives_korean:
  - 형체 없고 공허한
  - 공허하고 텅 빈
  - 무형무실
  lexicon: HALOT
  rationale: 창세기 1:2를 강하게 울리는 관용구이므로, 전통적 직역보다 의미-상응적으로 ‘혼돈과 공허’를 택해 무질서와 황폐의 감각을 살렸습니다. 한국어에서 ‘혼돈과 공허’는 이 이중어구의 문학적 긴장도 잘 전달합니다.
- source_word: הַשָּׁמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘나라
  - 하늘들
  lexicon: HALOT
  rationale: ‘땅’과 평행을 이루는 우주적 범주이면서도 한국어에서는 ‘하늘’이 가장 자연스럽고 넓게 들립니다. 여기서는 종교적 용례의 ‘하늘나라’가 아니라 물리적/우주적 의미를 유지해야 합니다.
theological_decisions:
- issue: 창세기 1:2를 떠올리게 하는 ‘tohu vabohu’의 재창조/역창조 이미지
  chosen_reading: ‘혼돈과 공허’로 옮겨 창조의 반전이라는 문학적·신학적 이미지를 유지했습니다.
  alternative_readings:
  - ‘형체 없고 공허한’으로 더 직역하는 방식
  - ‘황무하고 텅 빈’으로 재난 이미지를 강조하는 방식
  rationale: 본문은 심판 예언이면서 동시에 창세기 1:2의 어휘를 불러와 ‘창조의 되돌림’처럼 묘사합니다. 번역에서 그 긴장을 풀어버리지 않고 유지하는 것이 중요합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
