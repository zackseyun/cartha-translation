id: JER.4.5
reference: Jeremiah 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַגִּ֣ידוּ בִֽ/יהוּדָ֗ה וּ/בִ/ירוּשָׁלִַ֨ם֙ הַשְׁמִ֔יעוּ וְ/אִמְר֕וּ ו/תקעו שׁוֹפָ֖ר בָּ/אָ֑רֶץ קִרְא֤וּ מַלְאוּ֙ וְ/אִמְר֔וּ הֵאָסְפ֥וּ וְ/נָב֖וֹאָה אֶל עָרֵ֥י הַ/מִּבְצָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/005.yaml
  text: 'Declare it in Judah[a], and proclaim it in Jerusalem, and say: Blow the trumpet in the land. Cry aloud, fill the air, and say: Gather yourselves[d][c][b], and let us go into the fortified cities.'
  footnotes:
  - marker: a
    text: Or 'make it heard in Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Sound the horn in the land'; 'shofar' refers to a ram's horn or trumpet used as an alarm signal.
    reason: cultural_note
  - marker: c
    text: The Hebrew behind 'fill the air' is terse and idiomatic; it may mean 'raise a full cry' or 'fill the land with the alarm.'
    reason: lexical_alternative
  - marker: d
    text: Or 'to the fortified cities.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다에서 선포하십시오. 예루살렘에서 널리 알리십시오. 이렇게 말하십시오. 「뿔나팔을 땅에서 불어라. 크게 외치며 말하라. 스스로 모여, 견고한 성읍들로 들어가자.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다에서 선포하십시오’는 ‘유다에서 그것을 알리십시오’라는 뜻으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘뿔나팔’은 경보 신호에 사용된 숫양 뿔 나팔을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 매우 압축되어 있어, 여기서는 ‘크게 외치다’ 또는 ‘경보를 크게 울리다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘견고한 성읍들로’는 ‘견고한 성읍들에게/성읍들로 향하여’의 뜻으로도 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּידוּ / הַשְׁמִיעוּ
  english_pob_choice: Declare it / proclaim it
  chosen_korean: 선포하십시오 / 널리 알리십시오
  alternatives_korean:
  - 말하십시오
  - 알리십시오
  - 전하십시오
  lexicon: HALOT
  rationale: 두 명령형은 공개 경고의 강한 선포를 요구하므로, 단순한 '말하다'보다 공적·호소적 뉘앙스가 있는 '선포하다', '널리 알리다'가 원문에 가깝습니다.
- source_word: שׁוֹפָר
  english_pob_choice: Blow the trumpet
  chosen_korean: 뿔나팔
  alternatives_korean:
  - 나팔
  - 소라
  - 경적
  lexicon: HALOT
  rationale: שׁוֹפָר는 단순한 악기보다 경보용 숫양 뿔 나팔을 가리키므로, 의미를 분명히 드러내는 '뿔나팔'이 적절합니다.
- source_word: מַלְאוּ
  english_pob_choice: fill the air
  chosen_korean: 크게 외치며
  alternatives_korean:
  - 온 땅에 울리며
  - 공기를 채우며
  - 소리 가득하게
  lexicon: HALOT
  rationale: 히브리어는 압축된 관용구로, 문맥상 경보를 크게 울리라는 뜻이므로 한국어에서는 자연스럽게 '크게 외치며'로 옮겨 과도한 직역의 어색함을 피했습니다.
- source_word: הֵאָסְפוּ
  english_pob_choice: Gather yourselves
  chosen_korean: 스스로 모여
  alternatives_korean:
  - 모이십시오
  - 함께 모여
  - 집결하십시오
  lexicon: HALOT
  rationale: 니팔형의 재귀적 뉘앙스를 살리기 위해 단순 명령보다 '스스로 모여'를 택했습니다.
- source_word: אֶל עָרֵי הַמִּבְצָר
  english_pob_choice: into the fortified cities
  chosen_korean: 견고한 성읍들로
  alternatives_korean:
  - 요새화된 성읍들로
  - 견고한 성으로
  - 요새 성읍들로
  lexicon: HALOT
  rationale: 문맥상 피난처가 되는 성읍들을 가리키므로, '성읍들로'는 방향성을, '견고한'은 방비된 성격을 살립니다.
theological_decisions:
- issue: 경보 선포의 수사와 반복 명령의 긴박감
  chosen_reading: 한국어에서도 명령형을 연속 배치해 다급한 경보 상황을 유지했습니다.
  alternative_readings:
  - 완만한 설명체로 완화
  - 한 번의 명령으로 통합
  rationale: 본문은 연속된 명령으로 위기 경보를 만들어 내므로, 이를 평이하게 완화하면 원문 효과가 약해집니다.
  doctrine_reference: 예언서의 경고 담화 방식
