id: JER.4.12
reference: Jeremiah 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ר֧וּחַ מָלֵ֛א מֵ/אֵ֖לֶּה יָ֣בוֹא לִ֑/י עַתָּ֕ה גַּם אֲנִ֛י אֲדַבֵּ֥ר מִשְׁפָּטִ֖ים אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/012.yaml
  text: A wind too full for these will come for me[b][a]; now I myself will also speak judgments against them.
  footnotes:
  - marker: a
    text: Or 'A full wind from these will come to me'; the Hebrew phrase is compact and may express comparison, source, or purpose.
    reason: lexical_alternative
  - marker: b
    text: Or 'I too will pronounce sentence on them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 바람은 이들에게는 너무 강하여 나에게로 올 것입니다[a]. 이제 나도 그들에게 판결들을 말하겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이들로부터 나에게 오는 가득 찬 바람’; 히브리어 표현이 압축적이어서 비교, 기원, 목적의 의미가 모두 가능하다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나도 그들에게 선고를 내리겠습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחַ
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 영
  - 숨
  lexicon: HALOT
  rationale: 문맥이 예레미야 4장의 폭풍·심판 이미지이므로, 영적 의미의 ‘영’보다 물리적 현상을 드러내는 ‘바람’이 소스에 더 가깝습니다.
- source_word: מָלֵא מֵאֵלֶּה
  english_pob_choice: too full for these
  chosen_korean: 이들에게는 너무 강하여
  alternatives_korean:
  - 이것들보다 더 가득하여
  - 이들로부터 온
  lexicon: HALOT
  rationale: 히브리어 표현은 압축적이라 비교·기원·목적이 모두 가능하지만, 여기서는 앞절과 이어지는 ‘쓸 만한 바람이 아님’의 대비를 살려 ‘너무 강하여’로 옮겼습니다.
- source_word: יָבוֹא לִי
  english_pob_choice: will come for me
  chosen_korean: 나에게로 올 것입니다
  alternatives_korean:
  - 내게로 올 것입니다
  - 나를 위해 올 것입니다
  lexicon: HALOT
  rationale: ‘לִי’는 직역하면 ‘내게/나를 위해’이지만, 한국어에서는 먼저 방향성을 살린 뒤 문맥상 하나님의 처분 아래 있음을 자연스럽게 드러내는 것이 적절합니다.
- source_word: מִשְׁפָּטִים
  english_pob_choice: judgments
  chosen_korean: 판결들을
  alternatives_korean:
  - 심판들을
  - 재판들을
  lexicon: HALOT
  rationale: 복수형은 추상적 ‘의’가 아니라 여러 건의 사법적 선고를 가리키므로, 예언적 법정 언어를 직접 드러내는 ‘판결들’이 가장 적합합니다.
theological_decisions:
- issue: 첫째 인칭의 주체와 심판 발화
  chosen_reading: 이 절의 화자는 야훼이며, 바람이 그의 처분 아래 오고 그가 직접 판결을 선포하십니다.
  alternative_readings:
  - 예언자가 1인칭을 빌려 말하는 것으로 볼 수 있음
  - ‘나에게로’는 단순한 방향 표현일 수 있음
  rationale: 문맥 전체가 신적 심판 연설이므로, 1인칭을 야훼의 직접 발화로 읽는 것이 가장 자연스럽습니다. 다만 히브리어의 압축성을 보존해 문장 내부에서 과도하게 풀어 쓰지는 않았습니다.
  doctrine_reference: 예언서의 신적 화자 이해
- issue: מִשְׁפָּטִים의 번역
  chosen_reading: ‘판결들’은 단순한 법률 용어가 아니라 죄에 대한 심판 선언입니다.
  alternative_readings:
  - ‘심판들’
  - ‘재판들’
  rationale: 한국어에서 ‘판결’은 법정의 최종 선고를 떠올리게 하므로, 본문의 공적·사법적 심판 뉘앙스를 강하게 전달합니다.
  doctrine_reference: 예언적 심판 선포
