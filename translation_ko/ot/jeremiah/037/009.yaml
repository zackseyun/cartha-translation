reference: Jeremiah 37:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תַּשִּׁ֤אוּ נַפְשֹֽׁתֵי/כֶם֙ לֵ/אמֹ֔ר הָלֹ֛ךְ יֵלְכ֥וּ מֵ/עָלֵ֖י/נוּ הַ/כַּשְׂדִּ֑ים כִּי לֹ֖א יֵלֵֽכוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/009.yaml
  text: 'Thus says Yahweh: Do not deceive yourselves[a], saying[c][b], ‘The Chaldeans will surely go away from us,’ for they will not go away.'
  footnotes:
  - marker: a
    text: Or, 'Do not delude yourselves.' The Hebrew idiom literally involves 'your souls,' but here it warns against self-deception or false confidence.
    reason: lexical_alternative
  - marker: b
    text: Or, 'The Chaldeans will certainly depart from us.' The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: c
    text: '''Chaldeans'' refers to the Babylonian forces.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “갈대아인들[c]이 반드시 우리에게서 떠나갈 것이라고 말하면서 너희 자신을 속이지 마십시오[a][b]. 그들은 떠나가지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 스스로를 기만하지 마십시오.’ 히브리어 관용구는 문자적으로 ‘너희 생명들’을 포함하지만, 여기서는 자기기만이나 헛된 확신을 경고합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘갈대아인들이 우리에게서 반드시 떠날 것입니다.’ 히브리어는 부정사 절대형과 동사를 함께 써 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘갈대아인들’은 바빌로니아 군대를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: WLC / prophetic messenger formula
  rationale: 예언자 수식어는 표준적으로 ‘이렇게 말씀하십니다’로 옮기되, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 직접 표기했습니다.
- source_word: אַל תַּשִּׁיאוּ נַפְשֹׁתֵיכֶם
  english_pob_choice: Do not deceive yourselves
  chosen_korean: 너희 자신을 속이지 말라
  alternatives_korean:
  - 너희 영혼을 속이지 말라
  - 스스로를 속이지 말라
  lexicon: HALOT
  rationale: ‘영혼/목숨’을 문자적으로 살리면 한국어에서 오해를 낳기 쉬워, 문맥상 자가 기만을 뜻하는 관용을 자연스럽게 풀어 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: by saying
  chosen_korean: ‘…라고 말하지 말라’
  alternatives_korean:
  - ‘…라고 하며’
  - ‘…라고 말하면서’
  lexicon: HALOT
  rationale: 금지문의 내용 절을 자연스러운 직접화법으로 연결해, 자기기만의 구체적 발화를 드러내도록 했습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대인들
  alternatives_korean:
  - 바빌로니아인들
  lexicon: HALOT
  rationale: 히브리어의 민족/정치 명칭을 그대로 살려, POB의 ‘Chaldeans’ 선택과 대응시켰습니다.
- source_word: הָלֹךְ יֵלְכ֥וּ ... כִּי לֹ֖א יֵלֵֽכוּ
  english_pob_choice: will surely go away ... for they will not go away
  chosen_korean: 반드시 떠나갈 것이다 ... 그들은 떠나가지 않을 것이다
  alternatives_korean:
  - 꼭 떠날 것이다 ... 그들은 떠나지 않을 것이다
  - 정말로 물러갈 것이다 ... 그들은 물러가지 않을 것이다
  lexicon: HALOT
  rationale: 부정사 절대형+미완료형의 강조를 ‘반드시’로 살리고, 앞뒤 반복을 유지해 대조를 분명히 했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주’로 대체 표기
  - ‘여호와’로 음역
  rationale: 프로젝트 기본 규범이 하나님의 이름을 음역해 보존하는 것이므로, 전통적 대명사 대체를 피했습니다.
  doctrine_reference: POB project glossary / Tetragrammaton default
