source:
  edition: WLC
  text: וַ/יֵּצֵ֤א יִרְמְיָ֨הוּ֙ מִ/יר֣וּשָׁלִַ֔ם לָ/לֶ֖כֶת אֶ֣רֶץ בִּנְיָמִ֑ן לַ/חֲלִ֥ק מִ/שָּׁ֖ם בְּ/ת֥וֹךְ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/012.yaml
  text: Jeremiah went out from Jerusalem to go to the land of Benjamin[a], to receive his portion there among the people.
  footnotes:
  - marker: a
    text: Or 'to claim a share there among the people.' The Hebrew infinitive לַחֲלִק is difficult, and interpreters differ whether it means receiving an allotted portion, dividing property, or claiming a share.
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야는 예루살렘에서 나가 베냐민 땅으로 가서, 그곳에서 백성 가운데 자기 몫을 받으려고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לַחֲלִק은 의미가 어려운 표현입니다. 문맥상 ‘자기 몫을 받다’로 볼 수 있지만, ‘몫을 차지하다’ 또는 ‘분배하다’로 이해하는 견해도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가
  alternatives_korean:
  - 떠났습니다
  - 나왔습니다
  lexicon: HALOT
  rationale: יצא의 기본 의미인 ‘나가다’를 살려 예루살렘에서의 출발을 자연스럽게 나타냈습니다.
- source_word: אֶרֶץ בִּנְיָמִן
  english_pob_choice: the land of Benjamin
  chosen_korean: 베냐민 땅
  alternatives_korean:
  - 베냐민 지역
  - 베냐민의 땅
  lexicon: HALOT
  rationale: אֶרֶץ를 지파/지역의 관용적 표현으로 받아, 한국어에서는 ‘베냐민 땅’이 가장 간결하고 직역에 가깝습니다.
- source_word: לַחֲלִק
  english_pob_choice: to receive his portion
  chosen_korean: 자기 몫을 받으려
  alternatives_korean:
  - 자기 몫을 차지하려
  - 거기서 몫을 받으려
  - 자기 몫을 얻으려
  lexicon: HALOT
  rationale: חלק의 난해한 용례를 과도하게 해석하지 않고, 문맥상 ‘몫/분깃을 받다’라는 최소 의미를 살려 번역했습니다.
- source_word: בְּתוֹךְ הָעָם
  english_pob_choice: among the people
  chosen_korean: 백성 가운데
  alternatives_korean:
  - 사람들 가운데
  - 백성 한가운데
  lexicon: HALOT
  rationale: 직역의 ‘~가운데’ 구조를 유지하면서도 한국어 문장 흐름에 맞게 자연스럽게 옮겼습니다.
theological_decisions:
- issue: לַחֲלִק의 난해한 의미 처리
  chosen_reading: ‘자기 몫을 받으려’로 최소 의미만 드러내고, 분깃의 성격은 단정하지 않았습니다.
  alternative_readings:
  - ‘거기서 자기 몫을 나누려’
  - ‘거기서 자기 몫을 차지하려’
  rationale: 본문 자체가 이 동사의 정확한 의미를 단정하기 어려우므로, 후속 서술에 불필요한 해석을 미리 끼워 넣지 않도록 절제했습니다.
  doctrine_reference: 본문 해석의 절제 원칙
