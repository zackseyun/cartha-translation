  source_fidelity: 초안은 핵심 내용과 인명·장소·구금 맥락을 대체로 보존하지만, שְׁמַע־נָא(‘부디 들으십시오’)가 번역문에서 누락되었습니다. 또한 마지막 וְלֹא אָמוּת שָׁם은 ‘그러면 … 죽을 것입니다’보다 요청의 목적/우려를 나타내는 ‘그곳에서 죽지 않게’로 옮기는 편이 원문에 더 가깝습니다.
  naturalness: ‘제 청을 당신 앞에 떨어지게 하시고’는 히브리어 은유를 지나치게 직역하여 현대 표준 한국어에서 부자연스럽습니다. 왕에게 ‘당신’이라고 하는 것도 호칭과 경어의 흐름에 맞지 않습니다. ‘제 간청이 왕 앞에 이르게 해 주십시오’는 공적 청원의 격식을 유지하면서 자연스럽습니다.
  terminology: אֲדֹנִי הַמֶּלֶךְ의 소유적·신분적 호칭은 ‘내 주 왕이시여’가 ‘내 왕이시여’보다 충실합니다. יְהוֹנָתָן은 ‘여호나단’, הַסֹּפֵר는 ‘서기관’으로 유지하는 것이 적절합니다.
