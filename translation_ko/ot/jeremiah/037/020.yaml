id: JER.37.20
reference: Jeremiah 37:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה שְֽׁמַֽע נָ֖א אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ תִּפָּל נָ֤א תְחִנָּתִ/י֙ לְ/פָנֶ֔י/ךָ וְ/אַל תְּשִׁבֵ֗/נִי בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר וְ/לֹ֥א אָמ֖וּת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/020.yaml
  text: So now[a], please hear, my lord the king; please let my plea fall before you, and do not send me back to the house of Jehonathan the scribe, lest I die there.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'please let my petition come before you.' The Hebrew literally says 'let my plea fall before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제, 부디 내 왕이시여, 제 청을 당신 앞에 떨어지게 하시고, 저를 서기관 여호나단의 집으로 돌려보내지 마십시오. 그러면 제가 거기서 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 청을 당신 앞에 떨어지게 하시고’는 히브리어의 문자적 은유를 따른 번역이며, 더 자연스럽게는 ‘제 청이 당신 앞에 이르게 하시고’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러니 이제
  lexicon: HALOT
  rationale: 급박한 청원을 여는 담화 표지로서 인과·전환의 힘을 살리기 위해 ‘그러므로 이제’로 옮겼습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: 내 왕이시여
  alternatives_korean:
  - 주인이신 왕이시여
  - 나의 군왕이시여
  lexicon: HALOT
  rationale: 왕에게 드리는 정중한 호칭이므로 존칭을 살리되, 한국어에서 자연스러운 직접 호칭으로 압축했습니다.
- source_word: תִּפָּל נָא תְחִנָּתִי לְפָנֶיךָ
  english_pob_choice: please let my plea fall before you
  chosen_korean: 제 청을 당신 앞에 떨어지게 하시고
  alternatives_korean:
  - 제 간청이 당신 앞에 이르게 하시고
  - 제 탄원이 당신 앞에 올라가게 하시고
  lexicon: HALOT
  rationale: ‘떨어지다’의 이미지를 보존해 히브리어의 은유를 살렸고, ‘청’은 현대 한국어에서 격식 있는 간청을 무리 없이 전달합니다.
- source_word: וְאַל תְּשִׁבֵנִי
  english_pob_choice: and do not send me back
  chosen_korean: 저를 … 돌려보내지 마십시오
  alternatives_korean:
  - 저를 … 보내지 마십시오
  - 저를 … 되돌려 보내지 마십시오
  lexicon: HALOT
  rationale: שוב의 사역적 의미를 자연스럽게 반영하는 한국어로 ‘돌려보내다’를 선택했습니다.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  english_pob_choice: the house of Jehonathan the scribe
  chosen_korean: 서기관 여호나단의 집
  alternatives_korean:
  - 서기관 요나단의 집
  - 서기관 여호나단의 관저
  lexicon: HALOT
  rationale: 인명은 히브리어형 יְהוֹנָתָן을 따라 ‘여호나단’으로 옮기고, 직분을 나타내는 ‘서기관’을 앞에 두어 식별성을 높였습니다.
- source_word: וְלֹא אָמוּת שָׁם
  english_pob_choice: lest I die there
  chosen_korean: 그러면 제가 거기서 죽을 것입니다
  alternatives_korean:
  - 거기서 죽지 않게 하십시오
  - 거기서 죽을까 두렵습니다
  lexicon: HALOT
  rationale: 히브리어의 결과·두려움 뉘앙스를 한국어에서는 자연스러운 결과절로 풀어, 요청의 절박함을 분명히 했습니다.
theological_decisions:
- issue: 왕에게 드리는 직접 청원의 높임말 처리
  chosen_reading: 직접 호칭은 높임을 유지하되 문장 전체는 현대 합쇼체로 통일했습니다.
  alternative_readings:
  - 고전적 경어체로 더 격상
  - 평서형으로 완화
  rationale: 예레미야의 절박한 정치적 청원을 현대 독자가 즉시 이해하도록 하면서도, 왕 앞에서의 예의와 긴박함을 함께 보존하기 위함입니다.
  doctrine_reference: 성경 문체의 담화 적합성
