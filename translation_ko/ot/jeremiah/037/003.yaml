base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/003.yaml
  text: Then King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah the priest to Jeremiah the prophet[a], saying, “Please pray to Yahweh our God for us.”
  footnotes:
  - marker: a
    text: Hebrew Jehucal; some English versions use the shortened form 'Jucal' in related contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시드기야 왕은 셀레먀의 아들 여후갈[a]과 마아세야의 아들인 제사장 스바냐를 예언자 예레미야에게 보내어 이렇게 말했습니다. “부디 우리를 위하여 우리 하나님 야훼께 기도해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여후갈’은 히브리어 יְהוּכַל에 따른 음역입니다. 관련 본문에서는 줄인 형태인 ‘유갈’(Jucal)이 쓰이기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 보내며
  alternatives_korean:
  - 보냈습니다
  - 그리고 ... 보냈습니다
  lexicon: HALOT
  rationale: wayyiqtol 서술 진행을 한국어에서는 자연스러운 서사 연결인 ‘보내며’로 살려 사건의 연속성을 유지했습니다.
- source_word: יְהוּכַל
  english_pob_choice: Jehucal
  chosen_korean: 여후갈
  alternatives_korean:
  - 예후갈
  - 여후칼
  lexicon: HALOT
  rationale: 히브리어 יְהוּכַל의 현대 음역을 따랐고, 영어 POB의 Jehu- 계열 표기를 한국어 음가에 맞게 옮겼습니다.
- source_word: צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  english_pob_choice: Zephaniah son of Maaseiah, the priest
  chosen_korean: 마아세야의 아들 제바냐 제사장
  alternatives_korean:
  - 마아세야의 아들 제바냐, 제사장
  - 제사장 마아세야의 아들 제바냐
  lexicon: HALOT
  rationale: הַכֹּהֵן은 제바냐를 수식하는 말로 읽는 것이 문맥과 영어 POB의 판정에 가장 잘 맞아, 직역하되 한국어 어순에 맞게 뒤에 붙였습니다.
- source_word: הִתְפַּלֶּל נָא בַעֲדֵנוּ
  english_pob_choice: Please pray for us
  chosen_korean: 부디 우리를 위하여 ... 기도해 주십시오
  alternatives_korean:
  - 부디 우리를 위해 기도해 주십시오
  - 간청하오니 우리를 위하여 기도해 주십시오
  lexicon: HALOT
  rationale: נָא의 간청 뉘앙스는 ‘부디’로, בַעֲדֵנוּ는 중보의 뜻을 드러내는 ‘우리를 위하여’로 옮겼고, 존대 요청 표현은 합쇼체로 유지했습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 야훼 하나님
  - 여호와 우리 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본어 ‘야훼’를 따르고, אֱלֹהֵינוּ는 관계성을 살려 ‘우리 하나님’으로 직역했습니다.
theological_decisions:
- issue: 기도 요청 화자의 사회적 위계와 존대 수준
  chosen_reading: 왕과 사제들이 예레미야에게 공손하게 요청하는 장면이므로, 직접 화법은 합쇼체 요청문으로 유지했습니다.
  alternative_readings:
  - 반말형 명령문
  - 보다 문어적인 청원체
  rationale: 히브리어 נָא와 전체 서술이 요청/청원의 공손한 분위기를 띠므로, 한국어에서도 과도한 격하 없이 정중한 요청으로 표현하는 것이 적절합니다.
  doctrine_reference: 서술 화행의 문체 재현 원칙
