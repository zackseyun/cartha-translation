id: JER.37.18
reference: Jeremiah 37:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יִרְמְיָ֔הוּ אֶל הַ/מֶּ֖לֶךְ צִדְקִיָּ֑הוּ מֶה֩ חָטָ֨אתִֽי לְ/ךָ֤ וְ/לַ/עֲבָדֶ֨י/ךָ֙ וְ/לָ/עָ֣ם הַ/זֶּ֔ה כִּֽי נְתַתֶּ֥ם אוֹתִ֖/י אֶל בֵּ֥ית הַ/כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/018.yaml
  text: Then Jeremiah said to King Zedekiah, “What have I sinned against you, against your servants, and against this people, that you have put me into the prison?”
translation:
  language: ko
  text: 그때 예레미야가 시드기야 왕에게 말했습니다. “내가 당신과 당신의 신하들과 이 백성에게 무슨 죄를 지었기에, 당신들이 나를 감옥에 넣었습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה חָטָאתִי לְךָ
  english_pob_choice: What have I sinned against you
  chosen_korean: 내가 당신에게 무슨 죄를 지었기에
  alternatives_korean:
  - 내가 당신께 무엇을 죄지었기에
  - 내가 당신을 상대로 무슨 죄를 지었기에
  lexicon: חטא
  rationale: 히브리어 חטא는 단순한 실수보다 ‘죄를 짓다’의 도덕·관계적 위반을 뜻하므로, 질문형으로 자연스럽게 ‘무슨 죄를 지었기에’라고 옮겼습니다.
- source_word: וְלַעֲבָדֶיךָ
  english_pob_choice: against your servants
  chosen_korean: 그리고 당신의 신하들에게
  alternatives_korean:
  - 그리고 당신의 종들에게
  - 그리고 당신의 종자들에게
  lexicon: עבד
  rationale: 문맥상 왕의 ‘servants’는 궁정 신하들을 가리키므로, 현대 한국어에서 더 자연스러운 ‘신하들’로 옮기되 왕을 향한 사회적 관계를 유지했습니다.
- source_word: וְלָעָם הַזֶּה
  english_pob_choice: and against this people
  chosen_korean: 그리고 이 백성에게
  alternatives_korean:
  - 그리고 이 ժողովուրդ에게
  - 그리고 이 사람들에게
  lexicon: עם
  rationale: העם הַזֶּה는 특정한 공동체로서의 ‘이 백성’이 가장 직접적이며, 예레미야서의 예언자-언약적 문맥을 잘 보존합니다.
- source_word: בֵּית הַכֶּלֶא
  english_pob_choice: the prison
  chosen_korean: 감옥
  alternatives_korean:
  - 옥
  - 수감소
  - 감옥집
  lexicon: בית + כלא
  rationale: 영 POB가 최종적으로 ‘the prison’으로 정리한 점을 따라, 히브리어 직역형 ‘감옥집’보다 현대 독자가 즉시 이해하는 ‘감옥’을 채택했습니다.
theological_decisions:
- issue: 예레미야의 항변 어조
  chosen_reading: 직접적 항의가 아니라, 자신이 왜 처벌받는지 묻는 결백 주장으로 읽고 한국어도 그 긴장을 살렸습니다.
  alternative_readings:
  - 완곡한 항변
  - 법정적 변론
  rationale: 히브리어 질문은 자신의 죄책을 부정하며 처벌의 근거를 묻는 표현이므로, 지나치게 부드럽게 만들지 않고 ‘무슨 죄를 지었기에’로 긴장을 유지했습니다.
  doctrine_reference: 예언자적 고난과 무죄 호소의 문맥
- issue: 시드기야 왕에 대한 호칭
  chosen_reading: ‘왕’은 유지하고 인명은 현대 음역 ‘시드기야’로 표기했습니다.
  alternative_readings:
  - 시드기야야
  - 시드기아
  rationale: 본문의 왕권 호칭을 보존하면서도 한국어 성경 관행에 맞는 인명 표기를 택했습니다.
  doctrine_reference: 역사서술의 고유명사 표기 원칙
