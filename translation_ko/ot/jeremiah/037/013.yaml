  text: וַ/יְהִי ה֞וּא בְּ/שַׁ֣עַר בִּנְיָמִ֗ן וְ/שָׁם֙ בַּ֣עַל פְּקִדֻ֔ת וּ/שְׁמ/וֹ֙ יִרְאִיָּ֔יה בֶּן שֶֽׁלֶמְיָ֖ה בֶּן חֲנַנְיָ֑ה וַ/יִּתְפֹּ֞שׂ אֶֽת יִרְמְיָ֤הוּ הַ/נָּבִיא֙ לֵ/אמֹ֔ר אֶל הַ/כַּשְׂדִּ֖ים אַתָּ֥ה נֹפֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/013.yaml
  text: And when he was at the Benjamin Gate[a], there was a captain of the guard there whose name was Irijah son of Shelemiah, son of Hananiah, and he seized Jeremiah the prophet, saying, “You are deserting to the Chaldeans!”
  footnotes:
  - marker: a
    text: Or “You are defecting to the Chaldeans” or “You are going over to the Chaldeans.” The Hebrew idiom literally says “falling to the Chaldeans.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 베냐민 문에 이르렀을 때, այնտեղ 경비대장이 한 명 있었는데, 그의 이름은 셀레미야의 아들이며 하나냐의 손자인 이리야였습니다. 그가 예레미야 선지자를 붙잡고 말했습니다. “당신은 갈대아 사람들에게로 넘어가고 있습니다!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신은 갈대아 사람들에게로 투항하고 있습니다” 또는 “당신은 갈대아 편으로 넘어가고 있습니다”로 옮길 수 있습니다. 히브리어 관용구를 문자적으로 옮기면 “갈대아 사람들에게로 떨어지고 있습니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁעַר בִּנְיָמִן
  english_pob_choice: at the Benjamin Gate
  chosen_korean: 베냐민 문
  alternatives_korean:
  - 베냐민 성문
  - 베냐민 관문
  - 베냐민문
  lexicon: HALOT
  rationale: שַׁעַר는 도시의 문/성문을 뜻하므로, 현대 한국어에서는 자연스러운 지명형 표현인 ‘베냐민 문’으로 옮겨 위치를 살렸습니다.
- source_word: בַּעַל פְּקִדֻת
  english_pob_choice: captain of the guard
  chosen_korean: 경비대장
  alternatives_korean:
  - 경비 책임자
  - 보초대장
  - 경비대 지휘관
  lexicon: HALOT
  rationale: 직역적 ‘감독자’보다 이 문맥의 공적 경비 직책을 드러내는 말이 필요하여, POB의 군사·치안적 뉘앙스를 살려 ‘경비대장’으로 옮겼습니다.
- source_word: וַיִּתְפֹּשׂ
  english_pob_choice: seized
  chosen_korean: 붙잡아
  alternatives_korean:
  - 체포하여
  - 움켜잡아
  - 사로잡아
  lexicon: HALOT
  rationale: 동사의 강제적 접촉과 적대적 행동을 살리되, 법적 체포보다 넓은 원의를 반영하기 위해 ‘붙잡아’를 택했습니다.
- source_word: אֶל הַכַּשְׂדִּים אַתָּה נֹפֵל
  english_pob_choice: You are deserting to the Chaldeans
  chosen_korean: 당신은 갈대아 사람들에게로 넘어가고 있습니다
  alternatives_korean:
  - 당신은 갈대아 사람들에게로 탈주하고 있습니다
  - 당신은 갈대아 사람들에게로 배반하고 있습니다
  - 당신은 갈대아 사람들에게로 가고 있습니다
  lexicon: HALOT
  rationale: נפל + אֶל은 적대 진영으로 ‘넘어가다/투항하다’는 뜻이므로, 현대 한국어에서 혐의의 뉘앙스를 살리는 ‘넘어가고 있습니다’로 옮겼습니다. ‘갈대아 사람들’은 본문의 민족·정치적 호칭을 보존합니다.
theological_decisions:
- issue: 예언자에 대한 체포·혐의 진술의 어조
  chosen_reading: 직접 화법의 고발문을 따옴표로 살리고, 동사의 현재형 어감을 유지해 즉각적인 혐의 제기로 읽히게 했습니다.
  alternative_readings:
  - 과거형 서술로 완화하기
  - 정중한 신고문처럼 바꾸기
  rationale: 본문은 사건의 급박함과 적대적 비난을 드러내므로, 한국어에서도 고발의 긴장을 약화시키지 않는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 예레미야서 내 예언자 박해 서술의 서사적 긴장
- issue: 본문 내 화자 지시와 존칭
  chosen_reading: 예레미야를 가리키는 서술은 평서체로 두고, 직접 인용은 군중이 아닌 고발자의 발언으로 처리했습니다.
  alternative_readings:
  - 예레미야에게 존칭을 과도하게 부여하기
  - 인용부를 간접화하기
  rationale: 히브리어 서술은 인물 간 관계를 평평하게 두므로, 한국어도 예언자라는 직함 외에 불필요한 높임을 추가하지 않았습니다.
  doctrine_reference: 서사 문체 일관성과 원문 거리감 보존
