  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כֹּ֤ה תֹֽאמְרוּ֙ אֶל מֶ֣לֶךְ יְהוּדָ֔ה הַ/שֹּׁלֵ֧חַ אֶתְ/כֶ֛ם אֵלַ֖/י לְ/דָרְשֵׁ֑/נִי הִנֵּ֣ה חֵ֣יל פַּרְעֹ֗ה הַ/יֹּצֵ֤א לָ/כֶם֙ לְ/עֶזְרָ֔ה שָׁ֥ב לְ/אַרְצ֖/וֹ מִצְרָֽיִם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/007.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Thus you shall say to the king of Judah, who sent you to me to inquire of me, ‘Behold, Pharaoh’s army, which came out to help you, has returned to its own land[c][b], Egypt.’'
  footnotes:
  - marker: a
    text: Or “to seek me” / “to consult me.” The Hebrew verb can denote seeking or inquiring, and here refers to asking for a divine answer through Jeremiah.
    reason: lexical_alternative
  - marker: b
    text: Or “which is coming out to help you.” The Hebrew uses a participle; English renders it as past in light of the narrative situation.
    reason: lexical_alternative
  - marker: c
    text: Or “has turned back to the land of Egypt.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘의 하나님이 이렇게 말씀하십니다. “유다 왕에게 이렇게 말하십시오. 그가 너희를 내게 보내어 나를 찾게 하였으나, 보라, 너희를 도우려고 나왔던 바로의 군대가 자기 땅, 곧 이집트로 돌아갔습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 דָּרַשׁ는 여기서 단순한 ‘찾다’보다 예언 응답을 구하는 ‘문의하다/신탁을 구하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 분사형은 직역하면 ‘도우려고 나오는’이지만, 문맥상 이미 출정한 군대를 가리켜 과거로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기 땅’은 히브리어 소유격을 반영한 표현이며, ‘이집트’는 그 땅의 정체를 덧붙인 동격입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원문명 보존 원칙에 따라 신성호칭을 ‘야훼’로 옮기고, 일반 호칭인 ‘주님’으로 대체하지 않았습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하느님
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 살려 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: לְדָרְשֵׁנִי
  english_pob_choice: to inquire of me
  chosen_korean: 나를 찾게
  alternatives_korean:
  - 내게 물으려고
  - 내게 문의하게
  - 나를 구하게
  lexicon: HALOT
  rationale: 여기서는 예언자에게 신탁을 구하는 의미가 핵심이므로, 문맥상 ‘찾다/구하다’ 계열을 살리되 지나치게 설명적으로 확장하지 않았습니다.
- source_word: חֵיל פַּרְעֹה
  english_pob_choice: Pharaoh’s army
  chosen_korean: 바로의 군대
  alternatives_korean:
  - 파라오의 군대
  - 바로의 군사력
  lexicon: HALOT
  rationale: חֵיל은 여기서 군사 집단을 가리키므로 ‘군대’가 가장 직접적입니다. ‘바로’는 한국어 성경에서 널리 쓰이는 고유명 표기를 따랐습니다.
- source_word: שָׁב לְאַרְצוֹ מִצְרַיִם
  english_pob_choice: has returned to its own land, Egypt
  chosen_korean: 자기 땅, 곧 이집트로 돌아갔습니다
  alternatives_korean:
  - 자기 땅, 곧 이집트로 되돌아갔습니다
  - 이집트 땅으로 돌아갔습니다
  lexicon: HALOT
  rationale: ‘자기 땅’의 소유격을 살리고, 뒤의 ‘이집트’를 동격 설명으로 처리해 원문의 중첩된 표현을 보존했습니다.
theological_decisions:
- issue: 예언적 직접화법의 인용 안에서 보고형 문체 유지
  chosen_reading: 예언자적 선포는 평서형 공적 선언으로, 직접 인용은 그 자체의 명령·보고 어조를 유지했습니다.
  alternative_readings:
  - 더 부드러운 서술형으로 풀어쓰기
  - 인용부 전체를 간접화법으로 전환
  rationale: 본문은 야훼의 공식 발화와 명령이 겹친 예언문이므로, 한국어에서도 선언성과 권위를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 예언자적 계시와 하나님의 주권적 발화의 문체 보존
