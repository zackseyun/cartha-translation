translation:
  language: ko
  text: 이는 예레미야가 구덩이 감옥과 그 감방들[a] 안으로 들어가서 거기에서 여러 날을 지냈기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아치형 방들’ 또는 ‘칸막이된 구획들’로 옮길 수 있습니다. 이 히브리어 용어는 드물게 쓰이며, 감옥 안의 닫힌 구획들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그리고
  lexicon: HALOT
  rationale: 앞 문장의 사정을 설명하는 연결이므로 원인·설명의 뉘앙스를 살려 ‘이는’으로 옮겼습니다.
- source_word: בֵּית הַבּוֹר
  english_pob_choice: the dungeon house
  chosen_korean: 감옥 집
  alternatives_korean:
  - 지하 감옥
  - 구덩이 집
  - 감옥
  lexicon: HALOT
  rationale: 직역하면 ‘구덩이/물웅덩이의 집’이지만, 여기서는 수감 장소를 가리키는 구체성이 중요하므로 POB의 의미를 따라 감옥의 이미지를 살린 ‘감옥 집’으로 옮겼습니다.
- source_word: הַחֲנֻיוֹת
  english_pob_choice: the cells
  chosen_korean: 그 칸들
  alternatives_korean:
  - 감방들
  - 볼트형 방들
  - 칸막이 방들
  lexicon: HALOT
  rationale: 희귀어로서 정확한 건축적 세부는 불확실하므로, 폐쇄된 구획을 가리키는 중립적 표현인 ‘칸들’을 택해 POB의 각주 취지를 반영했습니다.
- source_word: וַיֵּשֶׁב שָׁם
  english_pob_choice: remained there
  chosen_korean: 거기에서 여러 날을 지냈습니다
  alternatives_korean:
  - 거기에서 머물렀습니다
  - 거기에서 앉아 있었습니다
  lexicon: HALOT
  rationale: ישב는 여기서 자세보다 지속적 체류를 뜻하므로, 감옥에 갇힌 상태의 지속을 자연스럽게 나타내는 ‘지냈습니다’로 옮겼습니다.
theological_decisions:
- issue: 예레미야의 구금 상태를 표현하는 방식
  chosen_reading: ‘감옥 집’과 ‘그 칸들’이라는 비교적 직설적인 표현을 유지해, 단순한 감금이 아니라 밀폐된 구금 공간이라는 장면을 드러냈습니다.
  alternative_readings:
  - ‘감옥’만으로 단순화
  - ‘지하실’로 완화
  rationale: 히브리어의 구체적 공간성을 희석하지 않으면서 한국어 독자가 이해할 수 있도록 옮기는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 서사 본문의 공간 이미지 보존
