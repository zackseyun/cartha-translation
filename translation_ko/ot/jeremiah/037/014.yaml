revisions:
- from: 그러자 예레미야가 말했습니다. “그것은 거짓입니다. 나는 갈대아 사람들에게 넘어가고 있는 것이 아닙니다.” 그러나 그는 예레미야의 말을 듣지 않았고, 이리야가 예레미야를 붙잡아 관리들에게 데려갔습니다.[a][b]
  to: 그러자 예레미야가 말했습니다. “거짓입니다. 저는 갈대아 사람들[a] 편으로 넘어가는 것이 아닙니다.” 그러나 이리야는 그의 말을 듣지 않았고, 예레미야를 붙잡아 관리들[b]에게 데려갔습니다.
  rationale: 번역의 기본 의미와 용어 선택은 유지했습니다. 다만 갈대아인들에게 ‘넘어간다’는 표현을 ‘갈대아 사람들 편으로 넘어간다’로 다듬어 적군 편으로의 전향이라는 문맥상 의미를 보존했고, 이리야를 주어로 명시했으며, 각주 표지를 해당 어휘에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:20Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘넘어가고 있는 것’은 한국어에서 실제로 진행 중인 행동을 부인하는 뜻으로 다소 좁게 들릴 수 있으므로, 적군 편으로 전향·귀순한다는 고발을 나타내는 ‘갈대아 사람들 편으로 넘어가는 것’이 더 정확합니다. 또한 듣지 않은 주체를 이리야로 명시하는 것이 히브리어의 지시 관계를 분명히 합니다.
  naturalness: 합쇼체는 일관되지만, ‘그는 예레미야의 말을 듣지 않았고’는 뒤의 고유명사와 함께 읽을 때 지시 대상이 잠시 불분명할 수 있습니다. ‘이리야는 그의 말을 듣지 않았고’가 더 자연스럽고 명료합니다.
  terminology: ‘갈대아 사람들’과 ‘관리들’은 적절합니다. 각주도 유익하나, 현재 두 각주는 문장 끝에 함께 붙어 있어 해당 어휘에 직접 연결되도록 옮기는 것이 바람직합니다.
  issues:
  - severity: medium
    issue: ‘넘어가고 있는 것’의 진행상 표현
    rationale: 히브리어의 참여형은 이 문맥에서 갈대아 편으로 넘어가거나 귀순한다는 혐의를 뜻합니다. 한국어의 ‘-고 있는’은 실제 진행 중인 행위를 부인하는 의미로 제한될 수 있으므로, ‘편으로 넘어가는 것’으로 전향의 방향과 정치·군사적 의미를 분명히 하는 편이 낫습니다.
  - severity: low
    issue: ‘그는’의 선행사 불명확성
    rationale: 히브리어는 앞 절의 이리야가 듣지 않고 이어서 예레미야를 붙잡는 주체임을 보여 줍니다. 한국어에서는 이리야를 재명시하면 의미 관계가 더 분명해집니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 문화 주석과 어휘 주석은 각각 ‘갈대아 사람들’ 및 ‘관리들’에 직접 붙여야 독자가 주석의 적용 대상을 즉시 알 수 있습니다.
