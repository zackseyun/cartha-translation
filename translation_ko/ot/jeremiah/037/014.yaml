  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִרְמְיָ֜הוּ שֶׁ֗קֶר אֵינֶ֤/נִּי נֹפֵל֙ עַל הַ/כַּשְׂדִּ֔ים וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑י/ו וַ/יִּתְפֹּ֤שׂ יִרְאִיָּיה֙ בְּ/יִרְמְיָ֔הוּ וַ/יְבִאֵ֖/הוּ אֶל הַ/שָּׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/014.yaml
  text: But Jeremiah said[a], “That is a lie; I am not defecting to the Chaldeans.” But he would not listen to him[c][b], and Irijah seized Jeremiah and brought him to the officials.
  footnotes:
  - marker: a
    text: Or “I am not going over to the Chaldeans” or “I am not defecting to the Chaldeans.”
    reason: lexical_alternative
  - marker: b
    text: “Chaldeans” refers to the Babylonian forces.
    reason: cultural_note
  - marker: c
    text: Or “the princes”; the Hebrew term can denote high-ranking rulers or officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예레미야가 말했습니다. “그것은 거짓입니다. 나는 갈대아 사람들에게 넘어가고 있는 것이 아닙니다.” 그러나 그는 예레미야의 말을 듣지 않았고, 이리야가 예레미야를 붙잡아 관리들에게 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 사람들’은 바빌로니아 세력을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어의 ‘관리들’은 고위 통치자나 관료들을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  english_pob_choice: That is a lie
  chosen_korean: 그것은 거짓입니다
  alternatives_korean:
  - 거짓말입니다
  - 그건 거짓입니다
  lexicon: HALOT
  rationale: 예레미야의 즉각적인 반박이라는 기능을 살리면서, 현대 한국어에서 자연스럽고 단정적인 부정으로 옮겼습니다.
- source_word: אֵינֶנִּי נֹפֵל עַל הַכַּשְׂדִּים
  english_pob_choice: I am not defecting to the Chaldeans
  chosen_korean: 나는 갈대아 사람들에게 넘어가고 있는 것이 아닙니다
  alternatives_korean:
  - 나는 갈대아 사람들에게 투항하고 있는 것이 아닙니다
  - 나는 갈대아 사람들에게 이탈하고 있는 것이 아닙니다
  lexicon: HALOT
  rationale: נֹפֵל עַל은 문자적 ‘떨어지다’가 아니라 적진 쪽으로 ‘넘어가다/배반하다’의 군사·정치적 용법이므로, 현재 진행형의 오해를 피하면서도 항복·전향의 뉘앙스를 살렸습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 갈대아인들
  - 바빌로니아 사람들
  lexicon: HALOT
  rationale: 히브리어의 민족·정치 집단명을 그대로 살리되, 한국어에서는 자연스러운 집합명사로 옮겼습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 관료들
  - 지도자들
  - 고관들
  lexicon: HALOT
  rationale: 예레미야서 문맥에서 הַשָּׂרִים는 단순한 귀족 호칭보다 행정·통치 책임자들을 가리키므로, 현대 독자가 이해하기 쉬운 ‘관리들’로 옮겼습니다.
theological_decisions:
- issue: 예레미야의 부인 표현의 강도
  chosen_reading: ‘나는 … 넘어가고 있는 것이 아닙니다’로 옮겨, 단순한 이동이 아니라 배반·전향의 혐의를 부정하는 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘나는 갈대아 사람들에게 가지 않습니다’
  - ‘나는 갈대아 사람들에게 투항하지 않습니다’
  rationale: 본문은 포로·전향을 둘러싼 정치적 고발 상황이므로, 평범한 이동보다 배신 혐의를 부정하는 의미가 중심입니다.
  doctrine_reference: 문맥 해석(예레미야 37장 내 정치적 심문 장면)
