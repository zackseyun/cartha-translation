  rationale: עלה의 기본 의미를 살리되, 포위하던 군대가 예루살렘에서 물러난 문맥을 반영해 ‘떠나’와 ‘올라갔을 때’를 함께 써서 이동과 철수의 뉘앙스를 모두 담았습니다.
- source_word: חֵיל הַכַּשְׂדִּים
  english_pob_choice: the army of the Chaldeans
  chosen_korean: 갈대아 사람들의 군대
  alternatives_korean:
