  lexicon: HALOT
  rationale: מִפְּנֵי의 원인 표지를 현대 한국어의 인과 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예루살렘을 포위하던 갈대아 군대의 이동 방향 표현
  chosen_reading: ‘예루살렘에서 떠나 올라갔을 때’로 옮겨, 단순한 상행 이동이 아니라 포위를 풀고 물러나는 상황을 드러냈습니다.
  alternative_readings:
  - ‘예루살렘에서 올라갔을 때’
  - ‘예루살렘에서 철수했을 때’
  rationale: 문맥상 ‘עלה’는 지리적 상승만이 아니라 군사적 철수/포위 해제를 가리킵니다. 본문 의미를 보존하면서도 현대 독자가 상황을 이해하도록 했습니다.
  doctrine_reference: 문맥적 서술 정확성
