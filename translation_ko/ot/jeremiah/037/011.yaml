  lexicon: HALOT
  rationale: 히브리어 민족명 ‘갈대아 사람들’을 직접 살리고, 그들의 조직된 군사력을 ‘군대’로 옮겼습니다.
- source_word: מִפְּנֵי חֵיל פַּרְעֹה
