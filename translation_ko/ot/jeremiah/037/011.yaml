  yaml_path: translation/ot/jeremiah/037/011.yaml
  text: Now when the army of the Chaldeans had gone up from Jerusalem because of Pharaoh’s army,[a]
  footnotes:
  - marker: a
    text: Or 'when the army of the Chaldeans went up from Jerusalem'; in context this refers to their lifting the siege and withdrawing because of Pharaoh’s army.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 갈대아 사람들의 군대가 파라오의 군대 때문에 예루살렘에서 떠나 올라갔을 때[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대아 사람들의 군대가 예루살렘에서 올라갔을 때’로도 옮길 수 있습니다. 문맥상 이는 포위를 풀고 물러난 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: Now ...
  chosen_korean: 이제
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: HALOT
  rationale: 서사 전환을 알리는 접속 표현으로, 현대 한국어에서는 ‘이제’가 자연스럽게 새로운 국면의 시작을 보여 줍니다.
- source_word: בְּהֵעָלוֹת
  english_pob_choice: when ... had gone up
  chosen_korean: 떠나 올라갔을 때
  alternatives_korean:
  - 올라갔을 때
  - 떠났을 때
  lexicon: HALOT
  rationale: עלה의 기본 의미를 살리되, 포위하던 군대가 예루살렘에서 물러난 문맥을 반영해 ‘떠나’와 ‘올라갔을 때’를 함께 써서 이동과 철수의 뉘앙스를 모두 담았습니다.
- source_word: חֵיל הַכַּשְׂדִּים
  english_pob_choice: the army of the Chaldeans
  chosen_korean: 갈대아 사람들의 군대
  alternatives_korean:
  - 갈대아 군대
  - 갈대아인들의 군대
  lexicon: HALOT
  rationale: 히브리어 민족명 ‘갈대아 사람들’을 직접 살리고, 그들의 조직된 군사력을 ‘군대’로 옮겼습니다.
- source_word: מִפְּנֵי חֵיל פַּרְעֹה
  english_pob_choice: because of Pharaoh’s army
  chosen_korean: 파라오의 군대 때문에
  alternatives_korean:
  - 파라오의 군대 때문에
  - 파라오의 군대로 말미암아
  lexicon: HALOT
  rationale: מִפְּנֵי의 원인 표지를 현대 한국어의 인과 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예루살렘을 포위하던 갈대아 군대의 이동 방향 표현
  chosen_reading: ‘예루살렘에서 떠나 올라갔을 때’로 옮겨, 단순한 상행 이동이 아니라 포위를 풀고 물러나는 상황을 드러냈습니다.
  alternative_readings:
  - ‘예루살렘에서 올라갔을 때’
  - ‘예루살렘에서 철수했을 때’
  rationale: 문맥상 ‘עלה’는 지리적 상승만이 아니라 군사적 철수/포위 해제를 가리킵니다. 본문 의미를 보존하면서도 현대 독자가 상황을 이해하도록 했습니다.
  doctrine_reference: 문맥적 서술 정확성
