  rationale: חֵיל은 전쟁 문맥에서 ‘군대’가 가장 자연스럽고, פַּרְעֹה는 한국어 성경 관용에 맞춰 ‘파라오’로 옮겼습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 바빌론군
  alternatives_korean:
