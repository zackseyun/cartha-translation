id: JER.37.5
reference: Jeremiah 37:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חֵ֥יל פַּרְעֹ֖ה יָצָ֣א מִ/מִּצְרָ֑יִם וַ/יִּשְׁמְע֨וּ הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עַל יְרוּשָׁלִַ֨ם֙ אֶת שִׁמְעָ֔/ם וַ/יֵּ֣עָל֔וּ מֵ/עַ֖ל יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/005.yaml
  text: Now Pharaoh’s army had come out from Egypt[a], and when the Chaldeans who were besieging Jerusalem heard the report about them[c][b], they withdrew from Jerusalem.
  footnotes:
  - marker: a
    text: Or “the Babylonians” for “the Chaldeans.”
    reason: lexical_alternative
  - marker: b
    text: Literally “heard their report”; that is, they heard the news concerning Pharaoh’s army.
    reason: lexical_alternative
  - marker: c
    text: Literally “went up from upon Jerusalem,” an idiom here meaning they pulled back from the siege.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 파라오의 군대가 이집트에서 나왔고[a], 바빌론군[b]—예루살렘을 포위하고 있던 자들—이 그들에 관한 소문을 듣자[c], 예루살렘에서 물러갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대아인들’로, 곧 ‘바빌론 사람들’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 ‘갈대아인들’은 예레미야 문맥에서 바빌론 세력을 가리키는 역사적 명칭입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘그들의 소식을 들었다’이며, 곧 파라오의 군대에 관한 소식을 들었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל פַּרְעֹה
  english_pob_choice: Pharaoh’s army
  chosen_korean: 파라오의 군대
  alternatives_korean:
  - 파라오의 군사
  - 바로의 군대
  lexicon: HALOT
  rationale: חֵיל은 전쟁 문맥에서 ‘군대’가 가장 자연스럽고, פַּרְעֹה는 한국어 성경 관용에 맞춰 ‘파라오’로 옮겼습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 바빌론군
  alternatives_korean:
  - 갈대아인들
  - 갈대아 군대
  lexicon: HALOT
  rationale: POB 각주가 밝히듯 ‘Chaldeans’는 문맥상 ‘Babylonians’와 대응될 수 있어, 본문에는 독자가 즉시 이해할 수 있는 ‘바빌론군’을 택하고, 어휘 대안을 각주로 남겼습니다.
- source_word: הַצָּרִים עַל יְרוּשָׁלִַם
  english_pob_choice: who were besieging Jerusalem
  chosen_korean: 예루살렘을 포위하고 있던 자들
  alternatives_korean:
  - 예루살렘을 포위하던 자들
  - 예루살렘을 공격하던 자들
  lexicon: HALOT
  rationale: צור의 군사적 용례와 עַל의 결합은 단순한 공격보다 ‘포위하다/포위하고 있다’는 의미가 정확합니다.
- source_word: אֶת שִׁמְעָם
  english_pob_choice: the report about them
  chosen_korean: 그들에 관한 소문을
  alternatives_korean:
  - 그들에 대한 소식을
  - 그들에 관한 보고를
  lexicon: HALOT
  rationale: שֵׁמַע는 ‘소문, 소식, 보고’의 범위를 가지며, 여기서는 파라오 군대에 대한 전달된 소식을 자연스럽게 반영하는 ‘소문’을 택했습니다.
- source_word: וַיֵּעָלּוּ מֵעַל יְרוּשָׁלִָם
  english_pob_choice: they withdrew from Jerusalem
  chosen_korean: 예루살렘에서 물러갔습니다
  alternatives_korean:
  - 예루살렘에서 철수했습니다
  - 예루살렘 위에서 올라갔습니다
  lexicon: HALOT
  rationale: 직역하면 ‘예루살렘 위에서 올라가다’이지만, 포위군이 물러나는 관용적 의미를 살려 ‘물러갔습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘Chaldeans’의 역사적-정치적 지칭을 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘바빌론군’으로 옮겨 의미를 즉시 드러내고, 원문 어휘의 대안은 각주로 보존했습니다.
  alternative_readings:
  - 갈대아인들
  - 바빌로니아 사람들
  rationale: 예레미야의 정황에서는 ‘갈대아인들’이 바빌론 세력을 가리키는 역사적 명칭이므로, 독자 이해를 돕되 원문 의미의 긴장은 각주로 유지했습니다.
  doctrine_reference: 역사적 배경 해석 및 원문-수용 언어 간 등가성
