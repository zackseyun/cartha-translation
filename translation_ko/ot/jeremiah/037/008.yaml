  text: Then the Chaldeans will return and fight against this city[a], and they will capture it and burn it with fire.
  footnotes:
  - marker: a
    text: Or 'the Babylonians.' The Hebrew reads 'the Chaldeans,' the historical designation used throughout this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 갈대아 사람들은 돌아와 이 성읍과 싸워서 그것을 점령하고 불로 태울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 사람들’은 영어 POB의 설명처럼 이 문맥에서 사용된 역사적 명칭입니다. 본문에는 ‘바빌로니아 사람들’이라는 의미 확장이 가능하지만, 히브리어 표현을 우선해 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  english_pob_choice: Then ... will return
  chosen_korean: 그러면 ... 돌아와
  alternatives_korean:
  - 그리고 ... 돌아와
  - 그때 ... 돌아와
  lexicon: HALOT
  rationale: 문맥상 예언의 진행을 표시하는 연결이므로 ‘그러면’으로 자연스럽게 옮기되, 동사 ‘돌아와’로 שׁוּב의 기본 의미를 살렸습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들은
  alternatives_korean:
  - 바빌로니아 사람들은
  - 갈대아인들은
  lexicon: HALOT
  rationale: 히브리어의 역사적·민족적 명칭을 그대로 반영해 ‘갈대아 사람들’로 옮겼습니다.
- source_word: וְנִלְחֲמוּ עַל
  english_pob_choice: and fight against
  chosen_korean: 싸워서
  alternatives_korean:
  - 대항하여 싸워
  - 맞서 싸워
  lexicon: HALOT
  rationale: עַל을 동반한 נלחם은 ‘~을/를 대항하여 싸우다’의 뜻이므로, 현대 한국어에서 자연스러운 ‘싸워서’로 연결했습니다.
- source_word: וּלְכָדֻהָ
  english_pob_choice: and they will capture it
  chosen_korean: 점령하고
  alternatives_korean:
  - 붙잡고
  - 사로잡고
  lexicon: HALOT
  rationale: 도시를 취하는 군사적 맥락이므로 ‘점령하다’가 ‘capture’의 의미를 가장 분명하게 드러냅니다.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  english_pob_choice: and burn it with fire
  chosen_korean: 불로 태울 것입니다
  alternatives_korean:
  - 불에 태울 것입니다
  - 불로 불살라 버릴 것입니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 직역하되, 심판 예언의 어조를 살려 ‘불로 태울 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 미래 시제의 처리
  chosen_reading: 한국어 미래형 ‘~할 것입니다’로 옮겨 선언적 예언의 확정성을 살렸습니다.
  alternative_readings:
  - 현재형으로 평탄화하여 옮김
  - ‘~합니다’로 서술적 처리
  rationale: 원문은 예언적 완료가 아니라 미래에 일어날 공격과 파괴를 예고하므로, 단정적인 미래형이 문맥과 잘 맞습니다.
  doctrine_reference: 예언 문체의 문법적-담화적 재현
