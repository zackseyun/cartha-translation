  source_fidelity: 히브리어의 순서와 핵심 의미(갈대아인들의 귀환, 이 성읍에 대한 전투, 점령, 방화)는 대체로 충실히 반영했습니다. 다만 נלחם על의 대상을 ‘이 성읍과 싸워서’로 옮기면 성읍이 상호 전투의 상대인 듯 들릴 수 있으므로, 공격 대상이라는 원문의 군사적 방향을 더 분명히 해야 합니다.
