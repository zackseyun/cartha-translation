  source_fidelity: 본문은 주어의 병렬(그, 그의 신하들, 그 땅의 백성), 부정, 야훼의 말씀, 예레미야를 통한 예언 전달을 충실히 반영합니다. 다만 ‘말씀하신 말씀’은 원문의 ‘말씀들을 말씀하셨다’라는 어근 반복을 한국어에서 불필요하게 중복시키므로, 자연스러운 동사 ‘하신’으로 다듬는 것이 적절합니다.
  naturalness: ‘야훼께서 예언자 예레미야를 통해 하신 말씀’은 현대 표준 한국어 합쇼체 문장에서 자연스럽고, 말씀의 발화와 예레미야의 매개 관계를 명확히 유지합니다.
