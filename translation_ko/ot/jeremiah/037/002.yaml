id: JER.37.2
reference: Jeremiah 37:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֥א שָׁמַ֛ע ה֥וּא וַ/עֲבָדָ֖י/ו וְ/עַ֣ם הָ/אָ֑רֶץ אֶל דִּבְרֵ֣י יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/002.yaml
  text: But he and his servants and the people of the land did not listen to the words of Yahweh that he spoke through Jeremiah the prophet[a][b][c].
  footnotes:
  - marker: a
    text: Or 'did not obey the words of the LORD.' The Hebrew verb can mean 'hear,' 'listen to,' or, by implication, 'obey.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the people of the land,' an expression that can refer broadly to the populace or common people.
    reason: cultural_note
  - marker: c
    text: Literally 'by the hand of Jeremiah the prophet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그와 그의 신하들과 그 땅의 백성은 야훼께서 예언자 예레미야를 통해 하신 말씀을 듣지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘듣다’는 문맥에 따라 ‘듣고 따르다’, 곧 ‘순종하다’의 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 땅의 백성’은 히브리어 표현으로, 넓게는 그 땅의 주민 또는 일반 백성을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘예언자 예레미야의 손으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹ֥א שָׁמַ֛ע
  english_pob_choice: did not listen to
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 듣지 않았습니다
  - 귀를 기울이지 않았습니다
  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 ‘듣다/귀 기울이다/순종하다’의 범위를 가지므로, 본문에서는 청종 실패를 드러내되 주석적 강도를 본문에 직접 넣지 않는 ‘듣지 않았습니다’가 가장 균형적입니다.
- source_word: וַ/עֲבָדָ֖י/ו
  english_pob_choice: and his servants
  chosen_korean: 그의 신하들과
  alternatives_korean:
  - 그의 종들과
  - 그의 신하들과
  - 그의 관리들과
  lexicon: HALOT
  rationale: 왕실 문맥의 עֲבָדִים은 단순한 ‘종’보다 왕을 섬기는 궁정 인물들을 가리킬 수 있어, 문맥상 ‘신하들’이 자연스럽고 과도한 해석을 줄입니다.
- source_word: וְ/עַ֣ם הָ/אָ֑רֶץ
  english_pob_choice: and the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 백성
  - 그 땅의 사람들
  - 토지의 백성
  lexicon: HALOT
  rationale: 히브리어 표현을 직역하면 ‘그 땅의 백성’이며, 본문에 각주를 통해 관용구임을 설명하는 것이 원문 투명성을 가장 잘 보존합니다.
- source_word: יְהוָ֔ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יהוה는 신적 호칭 대체어가 아니라 고유명사로서 ‘야훼’로 옮겨, 원문의 인칭적 언약 이름을 드러냅니다.
- source_word: בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא
  english_pob_choice: through Jeremiah the prophet
  chosen_korean: 예언자 예레미야를 통해
  alternatives_korean:
  - 예언자 예레미야를 통해
  - 예언자 예레미야의 손을 통해
  - 예언자 예레미야로 말미암아
  lexicon: HALOT
  rationale: ‘by the hand of’는 예언 전달의 매개를 뜻하므로, 현대 한국어에서는 ‘~를 통해’가 가장 자연스럽게 중개성을 보존합니다.
theological_decisions:
- issue: 예언 전달의 매개 표현
  chosen_reading: 예언자 예레미야를 통해
  alternative_readings:
  - 예언자 예레미야의 손을 통해
  - 예언자 예레미야로 말미암아
  rationale: 히브리어 관용구를 문자적으로만 옮기면 한국어가 부자연스러워질 수 있어, 예언자적 매개를 분명히 하면서도 원문의 의미 범위를 유지하는 표현을 택했습니다.
  doctrine_reference: Prophetic mediation in the Hebrew Bible
