  rationale: 갈대아 사람들의 복수형을 바로잡고, ‘각자 자기 장막에 있는’이 찔린 사람들을 수식하도록 문장 구조를 조정했습니다. כִּי אִם의 설명적·강조적 가정의 힘은 ‘이는 설령 … 하더라도 … 것이기 때문입니다’로 보존했습니다. ‘찔린 사람들’은 원문의 ‘꿰뚫린/찌른 상처를 입은 사람들’이라는 구체성을 유지합니다.
