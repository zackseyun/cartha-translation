id: JER.37.10
reference: Jeremiah 37:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י אִם הִכִּיתֶ֞ם כָּל חֵ֤יל כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים אִתְּ/כֶ֔ם וְ/נִ֨שְׁאֲרוּ בָ֔/ם אֲנָשִׁ֖ים מְדֻקָּרִ֑ים אִ֤ישׁ בְּ/אָהֳל/וֹ֙ יָק֔וּמוּ וְ/שָֽׂרְפ֛וּ אֶת הָ/עִ֥יר הַ/זֹּ֖את בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/010.yaml
  text: For even if you were to strike down the whole army of the Chaldeans who are fighting against you[a], and only wounded men remained among them, each in his tent[b], they would rise up and burn this city with fire.
  footnotes:
  - marker: a
    text: Or 'the Babylonians.' The Hebrew reads 'the Chaldeans,' the ethnic term commonly used for Babylonian forces in Jeremiah.
    reason: lexical_alternative
  - marker: b
    text: Literally 'men pierced' or 'men run through.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 비록 너희가 너희와 싸우는 갈대아 사람[a]의 온 군대를 쳐서 넘어뜨리고, 그들 가운데 다만 찔린 사람들[b]만 남더라도, 각기 자기 장막에서 일어나 이 성을 불에 태울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘갈대아 사람들’이라고 읽습니다. 예레미야에서는 바빌로니아 군대를 가리키는 민족명으로 자주 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘찔린 사람들’ 또는 ‘꿰뚫린 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For even if
  chosen_korean: 그런데 비록
  alternatives_korean:
  - 만일
  - 설령
  lexicon: HALOT
  rationale: 강한 양보적 가정과 앞선 진술과의 대조를 함께 살려, 현대 한국어에서 자연스러운 ‘그런데 비록’으로 옮겼습니다.
- source_word: כָּל חֵיל כַּשְׂדִּים
  english_pob_choice: the whole army of the Chaldeans
  chosen_korean: 갈대아 사람의 온 군대
  alternatives_korean:
  - 갈대아의 모든 군대
  - 갈대아 사람들의 전체 군대
  lexicon: HALOT
  rationale: חֵיל의 군사적 의미를 ‘군대’로 살리고, כַּשְׂדִּים은 POB의 원문 우선 원칙에 따라 ‘갈대아 사람’으로 옮겼습니다.
- source_word: אֲנָשִׁים מְדֻקָּרִים
  english_pob_choice: wounded men
  chosen_korean: 찔린 사람들
  alternatives_korean:
  - 상처 입은 사람들
  - 꿰뚫린 사람들
  lexicon: HALOT
  rationale: 직역상 ‘꿰뚫린/찔린 사람들’이지만, 한국어에서 이해가 쉽도록 하면서도 원문의 상처 입은 상태를 유지하는 표현으로 잡았습니다.
- source_word: אִישׁ בְּאָהֳלוֹ
  english_pob_choice: each in his tent
  chosen_korean: 각기 자기 장막에서
  alternatives_korean:
  - 각 사람은 자기 장막에서
  - 사람마다 자기 장막에서
  lexicon: HALOT
  rationale: 분배적 단수의 의미를 ‘각기’로 살리고, בְּאָהֳלוֹ는 군사적 유랑·진영 맥락을 반영해 ‘장막’으로 유지했습니다.
- source_word: וְשָׂרְפוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ
  english_pob_choice: and burn this city with fire
  chosen_korean: 이 성을 불에 태울 것입니다
  alternatives_korean:
  - 이 성에 불을 지를 것입니다
  - 이 성을 불로 태울 것입니다
  lexicon: HALOT
  rationale: ‘불에 태우다’는 בָּאֵשׁ의 수단/도구성을 자연스럽게 드러내며, 예언적 결과진술의 미래형으로 매끈하게 전달합니다.
theological_decisions:
- issue: 예레미야의 예언적 조건문이 실제로는 불가능한 가정이라는 점
  chosen_reading: ‘비록 … 하더라도’로 옮겨, 성공 불가능한 가정임을 한국어에서도 분명히 드러냈습니다.
  alternative_readings:
  - ‘만일 … 한다면’
  - ‘설령 … 해도’
  rationale: 본문은 단순 조건이 아니라 절대 성립하지 않을 가정을 전제로 한 강한 양보 구조이므로, 예언의 수사적 힘을 약화시키지 않도록 처리했습니다.
  doctrine_reference: 예언 수사와 조건문의 문맥적 해석
