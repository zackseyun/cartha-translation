- from: 그 관리들은 예레미야에게 격분하여 그를 때리고 감옥에 넣었습니다. 곧 서기관 여호나단의 집에 있는 감옥 집이었습니다. 그들이 거기를 감옥으로 만들어 놓았기 때문입니다.[a][b]
  to: 그 관리들은[a] 예레미야에게 격분하여 그를 때리고, 서기관 여호나단의 집[b]에 가두었습니다. 그 집은 그들이 감옥으로 만들어 놓은 곳이었습니다.
  rationale: 여호나단의 집 자체가 감옥으로 전용되었다는 원문의 설명 관계를 분명히 하고, 비자연스러운 ‘감옥 집’을 현대적이면서도 의미를 보존하는 문장으로 고쳤습니다. 또한 각주 표지를 해당 번역어에 배치했습니다.
