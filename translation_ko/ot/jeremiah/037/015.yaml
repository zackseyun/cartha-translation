id: JER.37.15
reference: Jeremiah 37:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְצְפ֧וּ הַ/שָּׂרִ֛ים עַֽל יִרְמְיָ֖הוּ וְ/הִכּ֣וּ אֹת֑/וֹ וְ/נָתְנ֨וּ אוֹת֜/וֹ בֵּ֣ית הָ/אֵס֗וּר בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר כִּֽי אֹת֥/וֹ עָשׂ֖וּ לְ/בֵ֥ית הַ/כֶּֽלֶא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/015.yaml
  text: And the officials were enraged at Jeremiah[a], and they beat him and put him in the prison house, in the house of Jehonathan the scribe[b], for they had made it a prison.
  footnotes:
  - marker: a
    text: Or 'the princes were angry with Jeremiah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of confinement'; that is, a prison building in the house of Jehonathan the scribe.
    reason: cultural_note
translation:
  language: ko
  text: 그 관리들은 예레미야에게 격분하여 그를 때리고 감옥에 넣었습니다. 곧 서기관 여호나단의 집에 있는 감옥 집이었습니다. 그들이 거기를 감옥으로 만들어 놓았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 방백들은 예레미야에게 화를 냈다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘감금의 집’이라는 뜻입니다. 곧 서기관 여호나단의 집 안에 있는 감옥 건물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְצְפוּ
  english_pob_choice: were enraged
  chosen_korean: 격분하여
  alternatives_korean:
  - 분노하여
  - 격노하여
  - 화를 내어
  lexicon: HALOT
  rationale: קצף는 단순한 화남보다 강한 격한 분노를 나타내므로, 정서 강도를 살린 ‘격분하여’가 가장 가깝습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 그 관리들
  alternatives_korean:
  - 그 방백들
  - 그 지도자들
  - 그 귀족들
  lexicon: HALOT
  rationale: 문맥이 왕실 정치 상황이므로 ‘관리들’이 신분 추정이 과도한 ‘방백들’보다 자연스럽고, POB의 ‘officials’와도 맞습니다.
- source_word: בֵּית הָאֵסוּר / בֵּית הַכֶּלֶא
  english_pob_choice: the prison house / they had made it a prison
  chosen_korean: 감옥 집 / 감옥으로 만들어 놓았기
  alternatives_korean:
  - 감옥 집 / 감옥으로 삼았기
  - 구금 집 / 감옥이 되었기
  - 감옥 / 감옥이 되게 했기
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘집’ 표현을 살리기 위해 첫째는 ‘감옥 집’으로, 끝의 원인절은 POB의 설명을 따라 ‘감옥으로 만들어 놓았기’로 옮겼습니다.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  english_pob_choice: in the house of Jehonathan the scribe
  chosen_korean: 서기관 여호나단의 집에 있는
  alternatives_korean:
  - 서기관 요나단의 집에 있는
  - 서기관 여호나단의 집 안에 있는
  - 서기관 여호나단의 집
  lexicon: HALOT
  rationale: יְהוֹנָתָן은 히브리어형을 따라 ‘여호나단’으로 옮기고, סֹפֵר는 관직적 뉘앙스를 포함하지만 기본값인 ‘서기관’을 유지했습니다.
