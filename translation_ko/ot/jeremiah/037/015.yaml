  source_fidelity: 히브리어의 핵심 의미(관리들의 격분, 구타, 여호나단의 집에 감금, 그 집을 감옥으로 만든 사실)는 대체로 반영되었습니다. 그러나 초안의 ‘서기관 여호나단의 집에 있는 감옥 집’은 감옥이 여호나단의 집 내부에 별도로 있었다는 인상을 주어, 여호나단의 집 자체가 감옥으로 전용되었다는 원문의 관계를 흐립니다.
  naturalness: ‘감옥 집’은 현대 표준 한국어에서 매우 부자연스럽고, 두 번째 문장 ‘곧 … 감옥 집이었습니다’도 앞 문장과의 연결이 매끄럽지 않습니다. 두 문장으로 관계를 분명히 하면 자연스럽습니다.
  terminology: ‘관리들’, ‘격분하여’, ‘서기관’, ‘여호나단’은 문맥과 용례에 적절합니다. 대안 주석 a는 ‘관리들’에, 문화 주석 b는 ‘여호나단의 집’에 붙이는 것이 해당 어휘와 내용에 맞습니다.
