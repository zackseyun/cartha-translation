  text: וְ/יִרְמְיָ֕הוּ בָּ֥א וְ/יֹצֵ֖א בְּ/ת֣וֹךְ הָ/עָ֑ם וְ/לֹֽא נָתְנ֥וּ אֹת֖/וֹ בֵּ֥ית ה/כליא־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/004.yaml
  text: Now Jeremiah was coming and going among the people[a], for they had not yet put him in the prison house.
  footnotes:
  - marker: a
    text: Or simply, 'and they had not put him in prison.' The Hebrew reads literally, 'in the house of confinement.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야는 백성들 가운데서 드나들고 있었습니다. 그들은 그를 감옥[a]에 가두지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘구금의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא וְיֹצֵא
  english_pob_choice: was coming and going
  chosen_korean: 드나들고 있었습니다
  alternatives_korean:
  - 왔다 갔다 하고 있었습니다
  - 자유롭게 오가고 있었습니다
  lexicon: HALOT
  rationale: 연결된 동사구가 자유로운 왕래를 뜻하는 관용법이므로, 현대 한국어의 자연스러운 관용인 ‘드나들다’로 그 의미와 움직임의 지속성을 살렸습니다.
- source_word: בְּתוֹךְ הָעָם
  english_pob_choice: among the people
  chosen_korean: 백성들 가운데서
  alternatives_korean:
  - 사람들 가운데서
  - 백성들 한가운데서
  lexicon: HALOT
  rationale: 직역하면 ‘한가운데’이지만, 문맥상 예레미야가 공동체 안에서 공개적으로 이동하고 있음을 보이므로 ‘백성들 가운데서’가 가장 자연스럽습니다.
- source_word: וְלֹא נָתְנוּ אֹתוֹ
  english_pob_choice: for they had not yet put him
  chosen_korean: 아직 그를 감옥에 가두지 않았기 때문입니다
  alternatives_korean:
  - 그를 아직 가두지 않았기 때문입니다
  - 아직 그를 옥에 넣지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘두다’이지만 문맥상 구금의 결과를 가리키므로, 한국어에서는 원인절로 풀어 ‘아직 … 않았기 때문입니다’라고 했습니다.
- source_word: בֵּית הַכְּלִיא
  english_pob_choice: in the prison house
  chosen_korean: 감옥
  alternatives_korean:
  - 구금의 집
  - 감금소
  lexicon: HALOT
  rationale: 직역의 ‘집’ 구조는 히브리어 배경을 드러내지만 한국어에서는 다소 어색하므로, 의미를 분명하게 전달하는 ‘감옥’으로 옮겼습니다.
