  text: וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ וַ/יִּקָּחֵ֗/הוּ וַ/יִּשְׁאָלֵ֨/הוּ הַ/מֶּ֤לֶךְ בְּ/בֵית/וֹ֙ בַּ/סֵּ֔תֶר וַ/יֹּ֕אמֶר הֲ/יֵ֥שׁ דָּבָ֖ר מֵ/אֵ֣ת יְהוָ֑ה וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ יֵ֔שׁ וַ/יֹּ֕אמֶר בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל תִּנָּתֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/017.yaml
  text: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
  footnotes:
  - marker: a
    text: Or “in secret.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: “into the hand of,” that is, into the power of.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그때 시드기야 왕이 사람을 보내어 그를 데려오게 했습니다. 왕은 자기 집에서 은밀히 그에게 물었습니다[a]. “야훼에게서 온 말씀이 있습니까?” 예레미야가 말했습니다. “있습니다.” 그러자 왕이 말했습니다: “당신은 바벨론 왕의 손에[b] 넘겨질 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “비밀리에.”
    reason: lexical_alternative
  - marker: b
    text: '히브리어 관용구: “손에”는 곧 “권세 아래에”라는 뜻입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח / וַיִּקָּחֵהוּ
  english_pob_choice: sent / had him brought
  chosen_korean: 사람을 보내어 그를 데려오게 하고
  alternatives_korean:
  - 사람을 보내어 불러오게 하고
  - 보내어 그를 불러오게 하고
  - 그를 데려오게 하고
  lexicon: HALOT
  rationale: שלח의 ‘보내다’와 이어지는 לקחת의 ‘데려오게 하다’의 흐름을 살려, 왕이 직접 끌고 가는 것이 아니라 소환한 의미를 자연스럽게 드러냈습니다.
- source_word: וַיִּשְׁאָלֵהוּ
  english_pob_choice: questioned him
  chosen_korean: 심문하며
  alternatives_korean:
  - 질문하며
  - 묻고
  - 캐묻고
  lexicon: HALOT
  rationale: 왕이 예레미야를 사적으로 불러 사실을 캐묻는 문맥이므로, 단순한 ‘묻다’보다 강한 ‘심문하다’가 상황을 더 정확히 반영합니다.
- source_word: בַּסֵּתֶר
  english_pob_choice: privately / in secret
  chosen_korean: 은밀히
  alternatives_korean:
  - 비밀리에
  - 사적으로
  - 몰래
  lexicon: HALOT
  rationale: POB의 본문은 ‘privately’를 채택했지만 각주로 ‘in secret’ 가능성을 남기므로, 한국어도 공식적이되 은밀한 뉘앙스를 함께 살리는 ‘은밀히’로 옮겼습니다.
- source_word: הֲיֵשׁ דָּבָר מֵאֵת יְהוָה
  english_pob_choice: Is there any word from Yahweh?
  chosen_korean: 야훼께로부터 온 말씀이 있습니까?
  alternatives_korean:
  - 야훼께로부터 온 말이 있습니까?
  - 야훼께서 하신 말씀이 있습니까?
  - 야훼로부터 온 말씀이 있습니까?
  lexicon: HALOT
  rationale: דָּבָר를 예언 맥락의 ‘말씀’으로 살리고, מֵאֵת의 출처성을 ‘-께로부터 온’으로 표현해 원문의 질문 형식을 유지했습니다.
- source_word: תִּנָּתֵן
  english_pob_choice: you will be given
  chosen_korean: 넘겨질 것입니다
  alternatives_korean:
  - 주어질 것입니다
  - 전달될 것입니다
  - 손에 넘겨질 것입니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 결과와 재앙적 맥락을 반영해, 단순한 ‘주어지다’보다 권력 아래로 이전되는 의미가 분명한 ‘넘겨지다’를 택했습니다.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  english_pob_choice: into the hand of the king of Babylon
  chosen_korean: 바벨론 왕의 손에
  alternatives_korean:
  - 바벨론 왕의 손안에
  - 바벨론 왕의 권세 아래
  - 바벨론 왕에게
  lexicon: HALOT
  rationale: 관용구 ‘into the hand of’를 직역해 원문의 강한 지배/통제의 이미지를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 주어진 프로젝트 기본값에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용해 고유신명성을 유지했습니다.
theological_decisions:
- issue: 예레미야의 응답이 단절적으로 짧게 제시됨
  chosen_reading: 예레미야가 말했습니다. "있습니다."
  alternative_readings:
  - 예레미야가 말했습니다. "있습니다, 있습니다."
  - 예레미야가 대답했습니다. "있습니다."
  rationale: 히브리어의 간결한 응답 יֵשׁ를 과장하지 않고 유지해, 왕 앞에서의 짧고 긴장된 대답을 보존했습니다.
  doctrine_reference: Source-text transparency and discourse force
- issue: ‘여호와’ 대신 ‘야훼’ 사용
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 신명 번역 원칙에 따라, 예언자 문맥의 יְהוָה를 고유명사로 드러내어 출처성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
