  rationale: 서술 전환을 나타내는 וַיְהִי의 사건 진행 기능을 살려, 현대 한국어에서 자연스럽고 예언서 문맥에 맞는 ‘그때 … 임하여’로 옮겼습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀
  - 야훼의 말
  lexicon: HALOT
  rationale: 예언 공식 דְּבַר יְהוָה는 하나님의 계시를 가리키는 표준 표현이므로 ‘말씀’을 유지했고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언하는 자
  lexicon: HALOT
  rationale: 표준어 현대 문체에서 נָבִיא의 직접 대응으로 ‘예언자’가 가장 투명하며, 기존 교회적 관용어 ‘선지자’보다 원뜻을 더 분명히 드러냅니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여
  lexicon: HALOT
  rationale: לֵאמֹר는 다음에 이어질 직접 인용을 여는 표지이므로, 한국어에서는 군더더기 없이 선행 동사와 결합해 자연스럽게 마무리했습니다.
theological_decisions:
