  text: וַ/יְצַוֶּ֞ה הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יַּפְקִ֣דוּ אֶֽת יִרְמְיָהוּ֮ בַּ/חֲצַ֣ר הַ/מַּטָּרָה֒ וְ/נָתֹן֩ ל֨/וֹ כִכַּר לֶ֤חֶם לַ/יּוֹם֙ מִ/ח֣וּץ הָ/אֹפִ֔ים עַד תֹּ֥ם כָּל הַ/לֶּ֖חֶם מִן הָ/עִ֑יר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/021.yaml
  text: So King Zedekiah gave orders[a], and they committed Jeremiah to the court of the guard, and gave him a loaf of bread daily from the bakers’ street, until all the bread from the city was gone. So Jeremiah remained in the court of the guard.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the outside/street of the bakers'; likely a street or quarter where bakers worked and sold bread.
    reason: cultural_note
translation:
  language: ko
  text: 그래서 시드기야 왕이 명령을 내렸고, 그들은 예레미야를 경비대 뜰에 두었으며, 성 안의 빵이 모두 떨어질 때까지 제빵사들의 거리[a]에서 날마다 그에게 빵 한 덩이를 주었습니다. 예레미야는 경비대 뜰에 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘제빵사들의 바깥/거리’입니다. 아마도 제빵사들이 일하고 빵을 팔던 거리나 구역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַוֶּה
  english_pob_choice: gave orders
  chosen_korean: 명령을 내렸고
  alternatives_korean:
  - 명령했고
  - 지시했고
  lexicon: HALOT
  rationale: 왕의 행위를 현대 한국어로 자연스럽게 살리되, 단순한 말이 아니라 공식적 지시임을 분명히 했습니다.
- source_word: וַיַּפְקִדוּ אֶת יִרְמְיָהוּ
  english_pob_choice: they committed Jeremiah
  chosen_korean: 그들은 예레미야를 … 맡겼으며
  alternatives_korean:
  - 그들은 예레미야를 … 두었으며
  - 그들은 예레미야를 … 넘겼으며
  lexicon: HALOT
  rationale: פקד는 여기서 예레미야를 특정 감시 구역에 공식적으로 배치·인계하는 뜻이므로, 구금의 공식성을 살리는 ‘맡기다’를 택했습니다.
- source_word: בַּחֲצַר הַמַּטָּרָה
  english_pob_choice: the court of the guard
  chosen_korean: 감옥 경비병 뜰
  alternatives_korean:
  - 경비병 뜰
  - 수비대 뜰
  - 경비대 뜰
  lexicon: HALOT
  rationale: 이 표현은 단순한 마당이 아니라 억류가 이루어지는 감시 구역이므로, 문맥의 구금 성격을 드러내는 한국어로 옮겼습니다.
- source_word: מִחוּץ הָאֹפִים
  english_pob_choice: from the Bakers’ Street
  chosen_korean: 빵 굽는 집들 거리
  alternatives_korean:
  - 제빵사들의 거리
  - 빵 굽는 이들의 거리
  - 제빵소 거리
  lexicon: HALOT
  rationale: 직역하면 ‘빵 굽는 이들의 바깥/거리’이므로, 지명적·도시적 뉘앙스를 살리면서도 자연스럽게 읽히는 표현을 택했습니다.
- source_word: כִכַּר לֶחֶם
  english_pob_choice: a loaf of bread
  chosen_korean: 빵 한 덩이
  alternatives_korean:
  - 빵 한 덩어리
  - 한 덩이의 빵
  - 빵 한 개
  lexicon: HALOT
  rationale: ככר는 둥근 빵 한 덩이/덩어리를 가리키므로, 형태를 과도하게 특정하지 않는 ‘한 덩이’로 옮겼습니다.
theological_decisions:
- issue: 예레미야의 상태를 어떻게 표현할지
  chosen_reading: ‘감옥 경비병 뜰에 맡겼다’와 ‘머물렀습니다’로, 억류 상태를 직접적으로 드러내되 과장된 형벌 용어는 피했습니다.
  alternative_readings:
  - ‘감옥에 가두었다’
  - ‘경비병 뜰에 두었다’
  rationale: 히브리어는 특정 감시 구역에 배치된 상황을 말하며, 본문은 감옥 전체보다 경비 구역의 억류를 강조합니다. 따라서 문맥에 맞는 제한된 구금으로 표현했습니다.
  doctrine_reference: 본문 문맥과 서술 어휘의 범위
- issue: ‘빵 굽는 집들 거리’의 지명성
  chosen_reading: 지명처럼 굳어진 표현이지만, 본문 자체는 상징적 의미보다 도시의 실제 위치를 가리키는 것으로 보았습니다.
  alternative_readings:
  - 고유명사처럼 음역
  - ‘제빵사 거리’로 일반화
  rationale: 영어 POB의 주석처럼 문자적으로는 ‘제빵사들의 바깥/거리’이므로, 실제 도시 공간을 나타내는 지시어로 처리했습니다.
  doctrine_reference: 본문 역사적 지리 이해
