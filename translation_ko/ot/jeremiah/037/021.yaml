revisions:
- from: 그래서 시드기야 왕이 명령을 내렸고, 그들은 예레미야를 감옥 경비병 뜰에 맡겼으며, 빵 굽는 집들 거리에서 날마다 빵 한 덩이를 주었습니다. 도시의 모든 빵이 다 떨어질 때까지 그랬습니다. 예레미야는 경비병 뜰에 머물렀습니다.[a]
  to: 그래서 시드기야 왕이 명령을 내렸고, 그들은 예레미야를 경비대 뜰에 두었으며, 성 안의 빵이 모두 떨어질 때까지 제빵사들의 거리[a]에서 날마다 그에게 빵 한 덩이를 주었습니다. 예레미야는 경비대 뜰에 머물렀습니다.
  rationale: 원문이 명시하지 않는 ‘감옥’을 제거하고, 경비·억류의 맥락은 ‘경비대 뜰에 두었으며’로 절제하여 나타냈습니다. 도시 공간을 가리키는 표현은 자연스러운 ‘제빵사들의 거리’로 고치고, 이에 관한 주석의 표지를 해당 어구에 연결했습니다. 일용할 빵의 지급과 성내 빵 공급의 고갈이라는 시간 관계도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:18Z'
