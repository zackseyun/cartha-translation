  verdict: revise
  source_fidelity: ‘감옥 경비병 뜰’은 히브리어 חֲצַר הַמַּטָּרָה(‘경비대/경비병의 뜰’)에 없는 ‘감옥’을 덧붙여 범위를 좁힙니다. 또한 ‘도시의 모든 빵’보다 ‘성 안의 빵이 모두’가 מִן־הָעִיר의 문맥상 성내 식량 공급이 고갈됨을 자연스럽게 나타냅니다. 왕의 명령 뒤에 사람들이 예레미야를 그곳에 두고 일용할 빵을 지급한 순서도 보존했습니다.
  naturalness: ‘감옥 경비병 뜰’과 ‘빵 굽는 집들 거리’는 현대 한국어로 어색합니다. ‘경비대 뜰’, ‘제빵사들의 거리’가 자연스럽고 의미도 더 직접적으로 전달합니다. 주석 표지는 해당 표현 바로 뒤에 배치했습니다.
  terminology: 인명 ‘시드기야’, ‘예레미야’는 표준 성경식 표기를 유지했습니다. חֲצַר הַמַּטָּרָה는 교파적으로 특정된 ‘감옥’으로 단정하지 않고 ‘경비대 뜰’로 옮겼습니다. מִחוּץ הָאֹפִים의 공간 지시 및 해석상 불확실성은 주석에서 보존했습니다.
