source:
  edition: WLC
  text: ו/אי/ו נְבִ֣יאֵי/כֶ֔ם אֲשֶׁר נִבְּא֥וּ לָ/כֶ֖ם לֵ/אמֹ֑ר לֹֽא יָבֹ֤א מֶֽלֶךְ בָּבֶל֙ עֲלֵי/כֶ֔ם וְ/עַ֖ל הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/019.yaml
  text: And where are your prophets who prophesied to you[a], saying, ‘The king of Babylon will not come against you or against this land’?”
  footnotes:
  - marker: a
    text: Or 'upon you and upon this land.' The Hebrew preposition can be rendered more literally as 'upon,' but here it likely carries the sense of hostile advance, hence 'against.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「너희의 예언자들은 어디 있느냐? 그들이 너희에게 예언하여 말하기를 ‘바빌론 왕이 너희와 이 땅을 치러 오지 않을 것이다’ 하지 않았느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עַל은 문자적으로는 ‘위에/위로’이지만, 여기서는 적대적 진격의 뜻으로 ‘치러’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיּוֹ / And where are
  english_pob_choice: And where are
  chosen_korean: 어디 있느냐?
  alternatives_korean:
  - 어디에 있느냐?
  - 지금 어디 있느냐?
  lexicon: HALOT
  rationale: 반문으로 던지는 질문의 압박감을 살리기 위해 직역보다 자연스러운 위치 질문 형태로 옮겼습니다.
- source_word: נְבִיאֵיכֶם
  english_pob_choice: your prophets
  chosen_korean: 너희의 예언자들
  alternatives_korean:
  - 너희 예언자들
  - 너희 선지자들
  lexicon: HALOT
  rationale: 히브리어 복수 소유격을 직접 반영했고, POB의 문체에 맞춰 ‘예언자들’을 사용했습니다.
- source_word: לֹא יָבֹא מֶלֶךְ בָּבֶל עֲלֵיכֶם וְעַל הָאָרֶץ הַזֹּאת
  english_pob_choice: The king of Babylon will not come against you or against this land
  chosen_korean: 바빌론 왕이 너희와 이 땅을 치러 오지 않을 것이다
  alternatives_korean:
  - 바빌론 왕이 너희와 이 땅 위로 오지 않을 것이다
  - 바빌론 왕이 너희에게나 이 땅에 오지 않을 것이다
  lexicon: HALOT
  rationale: עַל의 적대적 뉘앙스를 살려 ‘치러 오다’로 옮겼습니다. 이렇게 하면 단순한 위치 이동이 아니라 공격의 의미가 분명해집니다.
theological_decisions:
- issue: עַל 전치사의 의미를 어떻게 살릴지
  chosen_reading: ‘너희와 이 땅을 치러 오지 않을 것이다’로 번역해 적대적 침공의 뜻을 드러냈습니다.
  alternative_readings:
  - ‘너희 위에 오지 않을 것이다’
  - ‘너희에게 오지 않을 것이다’
  rationale: 문맥상 바빌론 왕의 군사적 위협을 말하므로, 한국어에서도 공격성을 분명히 해야 본문의 논지가 살아납니다.
  doctrine_reference: 예레미야 37장의 역사적 심판 경고 문맥
