  to: 그런데 너희에게 ‘바빌론 왕이 너희와 이 땅을 치러[a] 오지 않을 것이다’라고 예언하던 너희 예언자들은 어디 있습니까?
  rationale: 원문의 주절과 관계절 구조를 유지하여, 예레미야가 거짓 예언자들의 현재 행방을 묻는 하나의 수사 의문문으로 번역했습니다. ‘치러 오다’는 문맥상 עַל의 적대적 의미를 보존하며, 각주는 그 번역어에 직접 연결했습니다.
