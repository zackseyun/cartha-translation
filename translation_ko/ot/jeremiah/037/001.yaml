  yaml_path: translation/ot/jeremiah/037/001.yaml
  text: And King Zedekiah son of Josiah reigned in place of Coniah son of Jehoiakim[b][a], whom Nebuchadnezzar king of Babylon had made king in the land of Judah.
  footnotes:
  - marker: a
    text: Hebrew Coniah; also known elsewhere as Jeconiah.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew spelling: Nebuchadrezzar; English versions often use Nebuchadnezzar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시드기야 왕이 요시야의 아들인 코니야의 뒤를 이어 유다 땅에서 바빌론 왕 느부갓네살이 세운 왕이 되어 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלָךְ
  english_pob_choice: reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 왕이 되었습니다
  - 통치했습니다
  lexicon: HALOT
  rationale: 즉위와 통치를 함께 내포하는 역사 서술로 읽어, 한국어에서는 자연스럽고 문맥에 맞는 ‘다스렸습니다’로 옮겼습니다.
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: 뒤를 이어
  alternatives_korean:
  - 대신하여
  - 자리에 들어
  lexicon: HALOT
  rationale: 왕위 승계의 대체 관계를 드러내면서도 한국어 역사 문장에 자연스러운 표현을 택했습니다.
- source_word: כָּנְיָהוּ
  english_pob_choice: Coniah
  chosen_korean: 코니야
  alternatives_korean:
  - 여고냐
  - 여고니야
  lexicon: HALOT
  rationale: 히브리어 본문의 קצר형 이름을 우선하여 음역했고, 전통적으로 더 익숙한 형태로 평탄화하지 않았습니다.
- source_word: הִמְלִיךְ
  english_pob_choice: had made king
  chosen_korean: 세운
  alternatives_korean:
  - 왕으로 삼은
  - 즉위시킨
  lexicon: HALOT
  rationale: 사역형의 ‘왕이 되게 하다’라는 뜻을 간결하게 살려, 느부갓네살이 왕위에 올려 세웠다는 의미를 반영했습니다.
- source_word: נְבוּכַדְרֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓드레살
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 통용되는 표기를 따르되, 히브리어 철자 차이는 본문 차원의 별도 처리 없이 그대로 반영했습니다.
