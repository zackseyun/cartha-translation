source:
  edition: WLC
  text: כִּ֣י אִם בְּ/זֹ֞את יִתְהַלֵּ֣ל הַ/מִּתְהַלֵּ֗ל הַשְׂכֵּל֮ וְ/יָדֹ֣עַ אוֹתִ/י֒ כִּ֚י אֲנִ֣י יְהוָ֔ה עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ כִּֽי בְ/אֵ֥לֶּה חָפַ֖צְתִּי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/023.yaml
  text: 'But let the one who boasts boast in this: that he understands and knows me[a], that I am Yahweh, who practices steadfast love, justice, and righteousness in the earth; for in these I delight[b], declares Yahweh.'
  footnotes:
  - marker: a
    text: Or "in the land." The Hebrew אֶרֶץ can refer either to the earth generally or to a particular land; the broader sense fits the verse's universal statement about the LORD's character.
    reason: lexical_alternative
  - marker: b
    text: '"Steadfast love" translates Hebrew חֶסֶד, a covenant-rich term that can also be rendered "lovingkindness," "mercy," or "covenant faithfulness" depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 자랑하는 사람은 이것으로 자랑해야 합니다. 곧 내가 땅에서[a] 한결같은 사랑[b]과 정의와 의를 행하는 야훼임을 깨닫고 나를 아는 것으로 자랑해야 합니다. 내가 이것들을 기뻐하기 때문입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅에서’는 히브리어 אֶרֶץ를 옮긴 것입니다. 이 말은 ‘온 땅’ 또는 특정한 ‘땅/지역’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד를 옮긴 것입니다. 문맥에 따라 ‘인자’, ‘자비’, ‘신실한 사랑’으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם / בְּזֹאת
  english_pob_choice: 'But let the one who boasts boast in this:'
  chosen_korean: 그러나 자랑하는 사람은 이것으로 자랑해야 합니다.
  alternatives_korean:
  - 오직 이것으로 자랑해야 합니다.
  - 그런데 자랑하는 사람은 이것으로 자랑해야 합니다.
  lexicon: HALOT
  rationale: כִּי אִם의 대조적 전환을 ‘그러나’로 살리고, בְּזֹאת은 ‘이것으로’로 간결하게 옮겨 자랑의 근거를 앞당깁니다.
- source_word: הַשְׂכֵּל / וְיָדֹעַ אֹתִי
  english_pob_choice: that he understands and knows me
  chosen_korean: 곧 나를 깨닫고 나를 아는 것
  alternatives_korean:
  - 곧 나를 이해하고 나를 아는 것
  - 곧 나를 분별하고 나를 아는 것
  lexicon: HALOT
  rationale: הַשְׂכֵּל은 단순 지식보다 분별과 통찰의 성격이 있어 ‘깨닫고’로 살렸고, וְיָדֹעַ אֹתִי의 관계적 앎은 ‘나를 아는 것’으로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 관습적 대체어가 아니라 직접 표기 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: חֶסֶד מִשְׁפָּט וּצְדָקָה
  english_pob_choice: steadfast love, justice, and righteousness
  chosen_korean: 인자와 정의와 의
  alternatives_korean:
  - 언약적 사랑과 정의와 의
  - 인애와 공의와 의
  lexicon: HALOT
  rationale: חֶסֶד은 문맥상 언약적 인자/자비의 결을 가지지만, 한국어에서는 문어적·성경적 울림이 있는 ‘인자’로 두어 삼중 병행을 보존했고, מִשְׁפָּט은 사회·법정적 ‘정의’, צְדָקָה는 구별을 위해 ‘의’로 옮겼습니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the earth
  chosen_korean: 세상에서
  alternatives_korean:
  - 땅에서
  - 땅 위에
  lexicon: HALOT
  rationale: 땅/땅 위보다 더 넓은 범위를 드러내기 위해, POB의 ‘in the earth’ 취지를 살려 ‘세상에서’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다.
  alternatives_korean:
  - 야훼의 말씀입니다.
  - 야훼께서 말씀하십니다.
  lexicon: HALOT
  rationale: 예언자적 공식을 현대 한국어로 자연스럽게 살리되, 직접 신적 발화의 엄중함을 유지하도록 ‘말씀이십니다’로 정리했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 고유명사 신명을 직접 사용하므로, 독자가 계시된 언약 이름을 인지하도록 대체 тит틀 대신 ‘야훼’를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד / מִשְׁפָּט / צְדָקָה의 삼중 병렬
  chosen_reading: 인자와 정의와 의
  alternative_readings:
  - 언약적 사랑과 정의와 의
  - 인애와 공의와 의
  rationale: 세 단어는 서로 겹치지만 동일하지 않으므로, 한국어에서도 각각의 결을 구별해 병렬의 힘을 유지했습니다.
  doctrine_reference: 문맥상 하나님의 성품을 나열하는 예언적 병렬 구조
