    rationale: 원문은 시체가 추수꾼 뒤에 놓인 곡식 단처럼 버려져 아무도 거두지 않는다는 비유입니다. 수정문은 ‘뒤에 놓인 곡식 단’과 ‘아무도 거두지 않을 것’의 연결을 분명히 합니다.
