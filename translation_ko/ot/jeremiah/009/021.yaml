  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
  footnotes:
  - marker: a
    text: Or 'the corpse of humanity' / 'the human corpse.' The Hebrew has singular אָדָם, which can function generically.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하십시오. “야훼께서 이렇게 말씀하십니다. 사람[a]의 시체가 들판 위에 거름처럼 쓰러질 것이며, 추수꾼 뒤에 놓인 곡식 단처럼 아무도 거두지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류의 시체’ 또는 ‘사람의 시체’. 히브리어는 단수 אָדָם을 사용하며, 일반적으로 사람들 또는 인류를 가리킬 수 있습니다.
    reason: lexical_alternative
