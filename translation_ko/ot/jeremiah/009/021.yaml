revisions:
- from: 말하라. 「야훼께서 이렇게 말씀하십니다. 사람의 시체가 들판의 겉면에 분뇨처럼 떨어지고, 추수꾼 뒤의 한 단처럼 되리니, 거두는 자가 없을 것입니다」.
  to: 말하십시오. “야훼께서 이렇게 말씀하십니다. 사람[a]의 시체가 들판 위에 거름처럼 쓰러질 것이며, 추수꾼 뒤에 놓인 곡식 단처럼 아무도 거두지 않을 것입니다.”
  rationale: 원문의 의미와 시적 병렬을 보존하면서, 부자연스러운 ‘겉면’을 ‘들판 위’로 고치고 방치된 곡식 단의 이미지를 명확히 했습니다. ‘거름’은 농경적 비유와 수치의 어조를 유지하되 현대 한국어에서 ‘분뇨’보다 자연스럽습니다. אָדָם의 단수·일반성은 번역문과 각주를 함께 통해 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:10Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 명령, 야훼의 신탁 공식, 단수 일반명사 אָדָם, 들판에 방치된 시체와 추수꾼 뒤의 곡식 단이라는 두 비유, 그리고 ‘거두는 이가 없음’을 대체로 충실히 반영합니다. 다만 ‘추수꾼 뒤의 한 단처럼 되리니’는 한국어에서 수식 관계와 시체의 방치 이미지가 다소 불분명합니다.
  naturalness: ‘들판의 겉면’은 현대 한국어에서 부자연스럽고, ‘분뇨’는 이 문맥의 דֹּמֶן에 비해 지나치게 기술적·완곡하게 들릴 수 있습니다. ‘들판 위’, ‘거름’이 자연스럽고 원문의 농경적·모욕적 어조를 유지합니다. 또한 표준 현대 합쇼체에 맞추어 도입 명령을 ‘말하십시오’로 조정하는 것이 안전합니다.
  terminology: ‘야훼’, ‘시체’, ‘추수꾼’, ‘곡식 단’은 적절합니다. אָדָם은 단수이면서 일반적으로 쓰일 수 있으므로 ‘사람’으로 옮기고, 이 가능성은 각주로 밝혀야 합니다.
