base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
  footnotes:
  - marker: a
    text: Or 'the corpse of humanity' / 'the human corpse.' The Hebrew has singular אָדָם, which can function generically.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하라. 「야훼께서 이렇게 말씀하십니다. 사람의 시체가 들판의 겉면에 분뇨처럼 떨어지고, 추수꾼 뒤의 한 단처럼 되리니, 거두는 자가 없을 것입니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하라
  alternatives_korean:
  - 말씀하십시오
  - 선포하라
  lexicon: HALOT
  rationale: 예언 도입부의 2인칭 남성 단수 명령형을 한국어 명령형으로 옮기되, 문맥상 선포 명령의 힘을 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 공식의 נְאֻם을 현대 한국어의 직접 인용 표지로 자연스럽게 풀어, 신탁의 권위를 분명히 했습니다.
- source_word: נִבְלַת הָאָדָם
  english_pob_choice: the corpse of man
  chosen_korean: 사람의 시체
  alternatives_korean:
  - 인간의 시체
  - 사람의 주검
  lexicon: HALOT
  rationale: 히브리어의 단수 אָדָם을 일반적·대표적으로 이해하되, 영어 주석의 긴장을 살려 지나치게 추상화하지 않고 직설적인 표현을 택했습니다.
- source_word: כְּדֹמֶן
  english_pob_choice: like dung
  chosen_korean: 분뇨처럼
  alternatives_korean:
  - 똥처럼
  - 거름처럼
  lexicon: HALOT
  rationale: 원문의 모욕적이고 농경적인 비유를 약화시키지 않도록 거칠고 구체적인 표현을 유지했습니다.
- source_word: וּכְעָמִיר מֵאַחֲרֵי הַקֹּצֵר
  english_pob_choice: and like a sheaf behind the reaper
  chosen_korean: 추수꾼 뒤의 한 단처럼
  alternatives_korean:
  - 거두는 자 뒤의 한 단처럼
  - 베는 사람 뒤의 한 다발처럼
  lexicon: HALOT
  rationale: עָמִיר를 수확 묶음인 ‘한 단’으로 옮겨 농경 이미지를 보존하고, 뒤에 남겨진 방치의 모습을 살렸습니다.
