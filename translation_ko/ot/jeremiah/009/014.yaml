  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 자연스러운 한국어 관용으로 풀어, 언약적 관계를 분명히 드러냈습니다.
- source_word: לַעֲנָה
  english_pob_choice: wormwood
  chosen_korean: 쑥
  alternatives_korean:
  - 쓴풀
  - 웜우드
  lexicon: HALOT
  rationale: 문맥상 심판의 쓴 식물 이미지를 가리키므로, 한국어에서 의미가 즉각 전달되는 쑥을 택했습니다. 쓴맛의 함의는 본문 이미지로 보존됩니다.
- source_word: מֵי רֹאשׁ
  english_pob_choice: poisonous water
  chosen_korean: 독한 물
  alternatives_korean:
  - 독물
  - 독이 든 물
  - 쓴 물
  lexicon: HALOT
  rationale: רֹאשׁ은 여기서 '머리'가 아니라 독성/쓴맛의 물을 뜻하므로, 현대 한국어에서 자연스럽고 경고성이 살아 있는 독한 물로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보라, 내가
  alternatives_korean:
  - 보십시오, 내가
  - 보라, 내가 지금
  lexicon: HALOT
  rationale: 예언 선언문의 강조 표지를 한국어 감탄·지시 표현으로 살려, 곧바로 이어지는 신적 결의의 긴박감을 유지했습니다.
