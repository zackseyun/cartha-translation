id: JER.9.14
reference: Jeremiah 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מַאֲכִילָ֛/ם אֶת הָ/עָ֥ם הַ/זֶּ֖ה לַֽעֲנָ֑ה וְ/הִשְׁקִיתִ֖י/ם מֵי רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/014.yaml
  text: 'Therefore thus says Yahweh of Armies[a], the God of Israel: Behold, I am feeding this people wormwood[b], and I will make them drink poisoned water.'
  footnotes:
  - marker: a
    text: Or 'bitterness'; the Hebrew names a bitter plant, wormwood, often used as an image of judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'water of poison' or traditionally 'gall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 「보라, 내가 이 백성에게 쑥을 먹이고, 독한 물을 마시게 하겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쓴맛’; 히브리어는 쓰디쓴 식물을 가리키며, 심판의 이미지로 자주 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘독의 물’, 전통적으로는 ‘쓸개즙’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로 옮기고, צְבָאוֹת은 군대/군세의 구체성을 살려 만군으로 렌더링했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하느님
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 자연스러운 한국어 관용으로 풀어, 언약적 관계를 분명히 드러냈습니다.
- source_word: לַעֲנָה
  english_pob_choice: wormwood
  chosen_korean: 쑥
  alternatives_korean:
  - 쓴풀
  - 웜우드
  lexicon: HALOT
  rationale: 문맥상 심판의 쓴 식물 이미지를 가리키므로, 한국어에서 의미가 즉각 전달되는 쑥을 택했습니다. 쓴맛의 함의는 본문 이미지로 보존됩니다.
- source_word: מֵי רֹאשׁ
  english_pob_choice: poisonous water
  chosen_korean: 독한 물
  alternatives_korean:
  - 독물
  - 독이 든 물
  - 쓴 물
  lexicon: HALOT
  rationale: רֹאשׁ은 여기서 '머리'가 아니라 독성/쓴맛의 물을 뜻하므로, 현대 한국어에서 자연스럽고 경고성이 살아 있는 독한 물로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보라, 내가
  alternatives_korean:
  - 보십시오, 내가
  - 보라, 내가 지금
  lexicon: HALOT
  rationale: 예언 선언문의 강조 표지를 한국어 감탄·지시 표현으로 살려, 곧바로 이어지는 신적 결의의 긴박감을 유지했습니다.
theological_decisions:
- issue: 야훼의 직설적 표기
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트의 정경적·원문 투명성 원칙에 따라 여호와 대신 야훼를 사용해 언약 이름을 가렸던 전통적 치환을 따르지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
