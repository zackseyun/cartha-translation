revisions:
- from: 아, 내가 광야에 여행자들의 숙소 하나만이라도 있으면 좋겠습니다. 그러면 내가 내 백성을 떠나 그들 곁을 떠나가겠는데, 이는 그들 모두가 간음하는 자들이요, 배반자들의 한 무리이기 때문입니다.[a][b][c][d]
  to: 아, 광야에 길손들이 머물 숙소가 내게 있다면 좋겠습니다.[a][d] 그러면 나는 내 백성을 떠나 그들에게서 멀리 가고 싶습니다. 이는 그들 모두가 간음하는 자들[c]이며, 배반자들의 무리[b]이기 때문입니다.
  rationale: 문장을 현대 표준어 합쇼체로 다듬되, 소원 관용구와 두 연속된 의지 표현을 보존했습니다. ‘간음’의 문자적 의미를 본문에 유지하고 그 비유적 가능성은 각주에만 밝혔습니다. 또한 각주 앵커와 대안 번역을 해당 히브리어 표현에 맞게 재배치·정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:24Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 소원 관용구(מִי יִתְּנֵנִי), 광야의 길손 숙소, 두 개의 의지적 동사, 그리고 ‘간음하는 자들/배반자들의 집단’이라는 병렬적 고발을 대체로 반영했습니다. 다만 초안의 ‘떠나 그들 곁을 떠나가겠는데’는 두 동사의 관계를 부자연스럽게 중복시키며, 원문의 소원·의지의 어조도 약간 흐립니다.
  naturalness: ‘광야에 여행자들의 숙소 하나만이라도 있으면 좋겠습니다’는 이해되지만, ‘내게 ... 있다면’ 및 ‘길손들이 머물 숙소’가 현대 표준어 문장으로 더 자연스럽습니다. 또한 ‘간음하는 자들이요’보다 서술 병렬인 ‘간음하는 자들이며’가 뒤의 명사구와 더 매끄럽게 연결됩니다.
  terminology: ‘광야’, ‘내 백성’, ‘간음하는 자들’, ‘배반자들’은 적절합니다. ‘간음하는 자들’을 영적 의미로 한정하지 않은 점도 원문의 긴장을 보존합니다. 각주 b와 c는 현재 본문의 해당 표현 및 영어 감사 기록의 대안과 일치하지 않으므로 내용과 앵커를 바로잡아야 합니다.
