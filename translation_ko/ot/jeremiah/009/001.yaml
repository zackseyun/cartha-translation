id: JER.9.1
reference: Jeremiah 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי יִתְּנֵ֣/נִי בַ/מִּדְבָּ֗ר מְלוֹן֙ אֹֽרְחִ֔ים וְ/אֶֽעֶזְבָה֙ אֶת עַמִּ֔/י וְ/אֵלְכָ֖ה מֵֽ/אִתָּ֑/ם כִּ֤י כֻלָּ/ם֙ מְנָ֣אֲפִ֔ים עֲצֶ֖רֶת בֹּגְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/001.yaml
  text: Oh[a], that I had a travelers' lodging place in the wilderness, so that I might leave my people and go away from them! For all of them are adulterers[d][c][b], an assembly of traitors.
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''Who will give me in the wilderness a lodging place of travelers?''—an idiom expressing a wish: ''Oh, that I had...'''
    reason: lexical_alternative
  - marker: b
    text: Or 'adulterous ones'; in prophetic context this may also evoke covenant unfaithfulness, not only literal adultery.
    reason: alternative_reading
  - marker: c
    text: Or 'a band/company of traitors.'
    reason: lexical_alternative
  - marker: d
    text: Or "Oh, that I had in the wilderness a travelers' lodging place".
    reason: previous_rendering
translation:
  language: ko
  text: 아, 내가 광야에 여행자들의 숙소 하나만이라도 있으면 좋겠습니다. 그러면 내가 내 백성을 떠나 그들 곁을 떠나가겠는데, 이는 그들 모두가 간음하는 자들이요, 배반자들의 한 무리이기 때문입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘광야에서 여행자들의 숙소를 누가 내게 줄까?’라는 식의 말이지만, 여기서는 소망을 나타내는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘배반자들의 회중’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘배신자들의 무리’.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘아, 내가 광야에 여행자들의 숙소 하나만이라도 있으면’이라는 어순으로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  english_pob_choice: Oh, that I had
  chosen_korean: 아, 내가 … 있으면 좋겠습니다
  alternatives_korean:
  - 누가 내게 주겠습니까
  - 내가 … 있으면 좋겠습니다
  lexicon: HALOT
  rationale: 히브리어의 직설형 질문이지만 실제 기능은 소망/탄식이므로, 한국어에서는 자연스러운 소원 표현으로 옮겨 optative force를 살렸습니다.
- source_word: בַמִּדְבָּר מְלוֹן אֹרְחִים
  english_pob_choice: a travelers' lodging place in the wilderness
  chosen_korean: 광야에 여행자들의 숙소 하나
  alternatives_korean:
  - 광야에 나그네들의 숙소 하나
  - 광야에 길손들의 숙소 하나
  lexicon: HALOT
  rationale: מְלוֹן과 אֹרְחִים의 이미지를 현대 한국어에서 가장 분명하게 전달하는 표현으로 '여행자들의 숙소'를 택했고, '광야'는 단순한 사막보다 더 넓은 황무지/비거주 지역의 뉘앙스를 살립니다.
- source_word: מְנָאֲפִים
  english_pob_choice: adulterers
  chosen_korean: 간음하는 자들
  alternatives_korean:
  - 간음한 자들
  - 음행하는 자들
  - 영적으로 간음하는 자들
  lexicon: HALOT
  rationale: 예언서의 언약적 함의는 보존하되, 본문 어휘 자체는 구체적으로 '간음하는 자들'로 유지하여 POB의 concrete wording을 따랐습니다.
- source_word: עֲצֶרֶת בֹּגְדִים
  english_pob_choice: an assembly of traitors
  chosen_korean: 배반자들의 한 무리
  alternatives_korean:
  - 배반자들의 집회
  - 배신자들의 모임
  - 배반자들의 회중
  lexicon: HALOT
  rationale: עֲצֶרֶת의 집합성은 살리되, 한국어에서는 '한 무리'가 가장 자연스럽고 날카롭게 집단적 성격을 드러냅니다. בֹּגְדִים는 언약적 불성실을 포함하는 '배반자들'로 옮겼습니다.
theological_decisions:
- issue: '''adulterers''를 곧바로 영적 불성실로만 완화할지 여부'
  chosen_reading: 본문의 직접적 의미는 '간음하는 자들'로 유지하고, 예언서적 맥락이 주는 언약적 배반의 울림은 본문 자체가 담당하도록 두었습니다.
  alternative_readings:
  - 영적으로 간음하는 자들
  - 언약에 불성실한 자들
  rationale: 예언 문맥에서 문자적·비유적 의미가 겹치지만, 본문 어휘를 추상화하면 날카로운 고발이 약해지므로 POB의 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
