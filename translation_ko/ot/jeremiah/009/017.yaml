reference: Jeremiah 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/תְמַהֵ֕רְנָה וְ/תִשֶּׂ֥נָה עָלֵ֖י/נוּ נֶ֑הִי וְ/תֵרַ֤דְנָה עֵינֵ֨י/נוּ֙ דִּמְעָ֔ה וְ/עַפְעַפֵּ֖י/נוּ יִזְּלוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/017.yaml
  text: Let them hurry and raise a lament over us[a], so that our eyes may run down with tears and our eyelids flow with water.
  footnotes:
  - marker: a
    text: Hebrew 'water,' a poetic parallel to 'tears.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 서둘러 우리를 두고 애가를 부르게 하십시오. 그러면 우리 눈에서는 눈물이 흘러내리고, 우리 눈꺼풀에서는 물이 흘러내릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘물’은 앞의 ‘눈물’과 평행을 이루는 시적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וּתְמַהֵרְנָה
  english_pob_choice: Let them hurry
  chosen_korean: 서둘러
  alternatives_korean:
  - 빨리
  - 급히
  lexicon: HALOT
  rationale: 3인칭 여성 복수의 촉구/명령적 뉘앙스를 한국어에서는 자연스럽게 ‘서둘러’로 살렸습니다.
- source_word: וְתִשֶּׂנָה עָלֵי/נוּ נֶהִי
  english_pob_choice: and raise a lament over us
  chosen_korean: 우리 위에 애가를 불러오게 하십시오
  alternatives_korean:
  - 우리 위에 탄식을 올리게 하십시오
  - 우리 위에 곡을 들게 하십시오
  lexicon: HALOT
  rationale: נשא + נהי는 단순히 ‘들다’보다 ‘애가를 불러오다/올리다’가 문맥상 더 자연스럽고, 장례적 lament의 형식을 살립니다.
- source_word: נֶהִי
  english_pob_choice: a lament
  chosen_korean: 애가
  alternatives_korean:
  - 탄식
  - 곡
  lexicon: HALOT
  rationale: 예언서의 장례·애곡 어휘를 살리기 위해 ‘애가’를 택했고, 지나치게 구어적인 ‘울부짖음’은 피했습니다.
- source_word: וְתֵרַדְנָה עֵינֵינוּ דִמְעָה
  english_pob_choice: so that our eyes may run down with tears
  chosen_korean: 그러면 우리의 눈에서 눈물이 흘러내리고
  alternatives_korean:
  - 그러면 우리의 눈에서 눈물이 줄줄 흐르고
  - 그러면 우리의 눈에서 눈물이 내려오고
  lexicon: HALOT
  rationale: ‘눈이 내려가다’라는 원문 이미지보다 한국어에서는 눈물의 흐름을 자연스럽게 드러내는 표현이 적절합니다.
- source_word: וְעַפְעַפֵּינוּ יִזְּלוּ מָיִם
  english_pob_choice: and our eyelids flow with water
  chosen_korean: 우리의 눈꺼풀에서 물이 흘러내릴 것입니다
  alternatives_korean:
  - 우리의 눈꺼풀에서 물이 흐를 것입니다
  - 우리의 눈꺼풀에서 물줄기가 흐를 것입니다
  lexicon: HALOT
  rationale: ‘눈꺼풀’과 ‘물’의 병행을 유지해 원문의 시적 평행법을 살렸고, ‘물’을 ‘눈물’로 곧장 바꾸지 않아 원문 이미지를 보존했습니다.
theological_decisions:
- issue: 애곡을 요청하는 명령형/촉구형의 화자 태도
  chosen_reading: 예언적 수사로서 공동체에 애가를 불러오라고 촉구하는 형식으로 번역했습니다.
  alternative_readings:
  - 직설적 서술로 완화하기
  - 부드러운 권유로 바꾸기
  rationale: 원문은 감정의 강도를 낮추지 않고 애곡의 긴급성을 드러내므로, 한국어도 촉구형을 유지하는 것이 좋습니다.
  doctrine_reference: 예언서 수사와 공동체적 탄식의 표현
- issue: ‘물’과 ‘눈물’의 평행
  chosen_reading: 본문에는 ‘물’이 직접 나오므로 본문은 ‘물’을 유지하고, ‘눈물’은 앞 행의 대응어로만 나타나게 했습니다.
  alternative_readings:
  - 둘 다 눈물로 통일하기
  - 둘 다 물로 통일하기
  rationale: 히브리어의 시적 병행과 표현의 긴장을 보존하기 위해, POB 영어처럼 해석을 과도하게 평탄화하지 않았습니다.
  doctrine_reference: 시적 평행법과 원문 이미지 보존
