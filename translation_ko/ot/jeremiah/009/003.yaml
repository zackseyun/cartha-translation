id: JER.9.3
reference: Jeremiah 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֤ישׁ מֵ/רֵעֵ֨/הוּ֙ הִשָּׁמֵ֔רוּ וְ/עַל כָּל אָ֖ח אַל תִּבְטָ֑חוּ כִּ֤י כָל אָח֙ עָק֣וֹב יַעְקֹ֔ב וְ/כָל רֵ֖עַ רָכִ֥יל יַהֲלֹֽךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/003.yaml
  text: Each man[a], beware of his neighbor, and do not trust any brother; for every brother surely deceives[c][b], and every neighbor goes about as a slanderer.
  footnotes:
  - marker: a
    text: Or 'every brother is utterly deceitful' or 'every brother supplants.' The Hebrew intensifies the root עקב, which can carry the sense of deceitful overreaching.
    reason: lexical_alternative
  - marker: b
    text: '''Brother'' may refer either to a literal brother or more broadly to a fellow member of the community.'
    reason: lexical_alternative
  - marker: c
    text: Or 'every neighbor goes about gossiping' or 'as a talebearer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 각 사람은 자기 이웃을 경계하십시오. 어떤 형제도 믿지 마십시오.[가] 모든 형제는 철저히 속이고,[나] 모든 이웃은 중상하며 돌아다닙니다.[다]
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: ‘형제’는 친형제를 가리킬 수도 있고, 공동체의 동료 구성원을 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: 나
    text: 또는 ‘모든 형제는 완전히 기만합니다’ 또는 ‘계속해서 넘어뜨립니다.’ 히브리어는 ‘속이다/넘어뜨리다’와 관련된 어근을 반복하여 강조합니다.
    reason: lexical_alternative
  - marker: 다
    text: 또는 ‘험담하며 돌아다닙니다’ 또는 ‘비방하는 자로 돌아다닙니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: Each man
  chosen_korean: 사람마다
  alternatives_korean:
  - 각 사람
  - 남자마다
  lexicon: HALOT
  rationale: 분배적 의미를 살리면서도 현대 한국어에서 자연스럽고 성중립적으로 읽히게 했습니다. 문맥상 각 개인에게 주는 경고이므로 ‘사람마다’가 적절합니다.
- source_word: מֵרֵעֵהוּ
  english_pob_choice: of his neighbor
  chosen_korean: 자기 이웃을
  alternatives_korean:
  - 자기 친구를
  - 자기 동료를
  lexicon: HALOT
  rationale: רֵעַ는 친구·동료도 될 수 있지만, 여기서는 서로를 경계하라는 사회적 경고이므로 ‘이웃’이 관계의 폭을 넓게 유지하면서도 한국어로 자연스럽습니다.
- source_word: עָקוֹב יַעְקֹב
  english_pob_choice: surely deceives
  chosen_korean: 분명히 속이고
  alternatives_korean:
  - 철저히 속이고
  - 기어이 속이고
  lexicon: HALOT
  rationale: 히브리어는 어근 עקב의 강조를 통해 기만성과 얽힘을 강하게 드러냅니다. 본문이 허용하는 범위 안에서 ‘분명히 속이고’로 반복적·강조적 뉘앙스를 살렸습니다.
- source_word: רָכִיל
  english_pob_choice: a slanderer
  chosen_korean: 중상하는 자
  alternatives_korean:
  - 헐뜯는 자
  - 남을 험담하는 자
  - 험담꾼
  lexicon: HALOT
  rationale: רָכִיל은 단순한 수다보다 공동체를 해치는 비방·중상 행위를 가리키므로, 품위를 유지하면서도 의미를 분명히 하는 ‘중상하는 자’를 택했습니다.
theological_decisions:
- issue: 형제와 이웃의 관계 범위
  chosen_reading: ‘형제’와 ‘이웃’을 문자적 혈연에만 한정하지 않고 공동체 내부의 사람들까지 포함하는 넓은 사회적 호칭으로 번역했습니다.
  alternative_readings:
  - 혈연 형제만 가리키는 번역
  - 모두를 중립적으로 ‘사람’으로 통일하는 번역
  rationale: 문맥은 유다 공동체 안의 상호 불신을 경고하므로, 혈연과 공동체적 관계를 함께 열어 두는 번역이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 예레미야 9장의 언약 공동체 비판
