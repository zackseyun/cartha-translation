- source_word: וְתִקַּח אָזְנְכֶם
  english_pob_choice: let your ear receive
  chosen_korean: 여러분의 귀를 그의 입의 말씀에 기울이십시오
  alternatives_korean:
  - 여러분의 귀가 받게 하십시오
  - 귀로 받아들이십시오
  lexicon: HALOT
  rationale: 직역보다 한국어에서 자연스러운 관용을 우선하되, ‘귀를 기울이다’로 히브리어 관용구의 적극적 경청을 살렸습니다.
- source_word: נֶהִי / קִינָה
  english_pob_choice: lament / dirge
  chosen_korean: 애가 / 곡조
  alternatives_korean:
  - 애도 / 진혼곡
  - 통곡 / 애가
  lexicon: HALOT
  rationale: 두 관련된 장례·애곡 용어의 구분을 유지하려고 서로 가깝지만 동일하지 않은 한국어 표현을 사용했습니다.
theological_decisions:
- issue: 여성 직접 호명과 명령형의 문체
  chosen_reading: “여인들아”로 직접 호명하고, 뒤는 합쇼체 명령으로 이어 갑니다.
  alternative_readings:
  - 여인들이여
  - 여인들
  rationale: 히브리어 여성 복수 명령과 호격을 드러내기 위해 직접 호명을 유지하되, 한국어 독자에게는 합쇼체 명령이 가장 자연스럽고 공적인 예언 전달을 잘 반영합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: ‘각 여인 her neighbor’의 분배적 구조
  chosen_reading: ‘각 여인은 이웃에게 곡조를 가르치십시오’
  alternative_readings:
  - 각 여인은 이웃 여성에게
  - 각 여인은 그 친구에게
  rationale: 원문의 분배적, 상호적 구조를 살리면서도 과도한 해석을 피하기 위해 중립적인 ‘이웃’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Source-clarity and lexical restraint'
