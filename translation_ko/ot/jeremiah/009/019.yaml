revisions:
- from: 여인들아, 야훼의 말씀을 들으십시오. 여러분의 귀를 그의 입의 말씀에 기울이십시오. 여러분의 딸들에게 애가를 가르치고, 각 여인은 이웃에게 곡조를 가르치십시오.[a][b]
  to: 여인들이여, 야훼의 말씀을 들으십시오. 귀를 기울여[a] 그분의 입에서 나오는 말씀을 들으십시오. 여러분의 딸들에게 애곡을 가르치고, 여인마다 자기 이웃에게 애가를 가르치십시오.[b]
  rationale: ‘곡조’를 애도 노래를 뜻하는 ‘애가’로 바로잡고, 앞선 נְהִי는 ‘애곡’으로 옮겨 관련되지만 구별되는 두 용어를 보존했습니다. 히브리어의 ‘귀가 받게 하라’는 관용구는 자연스러운 한국어 ‘귀를 기울여’로 옮기고, 그 지점에 설명 각주를 배치했습니다. ‘그분의 입에서 나오는 말씀’은 직역적인 ‘그의 입의 말씀’의 반복과 구체적 이미지를 한국어로 자연스럽게 살린 것입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:10Z'
