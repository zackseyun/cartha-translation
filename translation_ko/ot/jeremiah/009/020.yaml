id: JER.9.20
reference: Jeremiah 9:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי עָ֤לָה מָ֨וֶת֙ בְּ/חַלּוֹנֵ֔י/נוּ בָּ֖א בְּ/אַרְמְנוֹתֵ֑י/נוּ לְ/הַכְרִ֤ית עוֹלָל֙ מִ/ח֔וּץ בַּחוּרִ֖ים מֵ/רְחֹבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/020.yaml
  text: For death has climbed in through our windows[a]; it has entered our palaces, to cut off the child from outside[b], the young men from the streets.
  footnotes:
  - marker: a
    text: Or 'the infant' for 'the child.' The Hebrew עוֹלָל can denote a very young child.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the squares' for 'from the streets.' The Hebrew term can refer to broad public places within a city.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 죽음이 우리의 창문들[a]로 올라왔기 때문입니다. 그것은 우리의 궁전들에 들어와서, 밖에 있는 아이를[b] 끊어 버리고, 거리의 젊은이들을 끊어 버리려 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 창문들에로’로도 옮길 수 있습니다. 히브리어는 들어가는 경로를 생생하게 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘어린아이를’로도 옮길 수 있습니다. 히브리어 עוֹלָל은 매우 어린 아이를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - 그러므로 …
  lexicon: HALOT
  rationale: 앞 절의 이유를 설명하는 כִּי의 인과·설명 기능을 한국어에서 자연스럽게 살리기 위해 ‘이는 … 때문입니다’로 옮겼습니다.
- source_word: עָלָה מָוֶת
  english_pob_choice: death has climbed in
  chosen_korean: 죽음이 … 올라왔기
  alternatives_korean:
  - 죽음이 … 들어왔기
  - 죽음이 … 올라와 들어왔기
  lexicon: HALOT
  rationale: ‘올라오다’는 המקרא적 ‘올라가다/오르다’의 동작성과 창문을 통한 침입 이미지를 함께 보존합니다.
- source_word: בְּחַלּוֹנֵינוּ
  english_pob_choice: through our windows
  chosen_korean: 우리의 창문들로
  alternatives_korean:
  - 우리의 창문들을 통해
  - 우리의 창문 안으로
  lexicon: HALOT
  rationale: 전치사 בְּ의 통로/경유 의미를 살리면서도 한국어에서 ‘~로 올라오다’의 결합이 자연스러워 ‘창문들로’로 처리했습니다.
- source_word: לְהַכְרִית עוֹלָל
  english_pob_choice: to cut off the child
  chosen_korean: 밖에 있는 아이를 끊어 버리고
  alternatives_korean:
  - 밖에 있는 아이를 도려내고
  - 밖에 있는 아이를 없애고
  lexicon: HALOT
  rationale: הכרית의 강한 ‘끊다/도려내다’의 힘을 살리되, 문맥상 파괴적 결과를 분명히 드러내기 위해 ‘끊어 버리다’로 옮겼습니다. עוֹלָל은 어린 아이를 가리켜 ‘아이’가 무난합니다.
- source_word: מֵרְחֹבוֹת
  english_pob_choice: from the streets
  chosen_korean: 거리의 젊은이들을
  alternatives_korean:
  - 광장의 젊은이들을
  - 넓은 거리들의 젊은이들을
  lexicon: HALOT
  rationale: רְחֹבוֹת은 광장/넓은 공공장소까지 가리킬 수 있지만, 현대 한국어에서는 ‘거리’가 가장 자연스럽고 공적 공간의 뉘앙스를 충분히 전달합니다.
theological_decisions:
- issue: 죽음의 의인화와 침입 이미지
  chosen_reading: 죽음을 사람처럼 움직이는 침입자로 그대로 표현했습니다.
  alternative_readings:
  - 죽음이 찾아왔기
  - 죽음이 덮쳤기
  rationale: 히브리어는 죽음이 창문으로 ‘올라와’ 궁전에 ‘들어오는’ 장면을 매우 구체적으로 그리므로, 의인화를 완화하지 않고 직역에 가까운 이미지로 유지했습니다.
  doctrine_reference: 예언 문학의 수사적 의인화 보존
