  source_fidelity: 히브리어의 완료형 동사들(‘올라왔다’, ‘들어왔다’)과 목적을 나타내는 부정사(‘끊어 버리려고’)를 반영해야 합니다. 초안의 ‘끊어 버리려 합니다’는 현재/미래의 진행 의도를 나타내어, 이미 침입한 죽음이라는 원문의 묘사와 시제가 어긋납니다. 또한 ‘거리의 젊은이들’은 젊은이들이 거리의 소유물인 것처럼 들릴 수 있으므로, ‘거리에서’를 유지하는 편이 정확합니다.
  naturalness: ‘우리의 창문들’, ‘우리의 궁전들’보다 ‘우리 창문’, ‘우리 궁궐’이 현대 한국어에서 자연스럽습니다. ‘창문으로 올라와 궁궐에 들어왔다’는 죽음의 의인화와 침입 이미지를 자연스럽게 보존합니다.
  terminology: מָוֶת는 ‘죽음’, עוֹלָל은 ‘어린아이’, בַּחוּרִים는 ‘젊은이들’, אַרְמְנוֹת는 문맥상 ‘궁궐’로 옮겼습니다. לְהַכְרִית의 강한 파괴 의미는 ‘끊어 버리다’로 유지했습니다. 각주 b는 본문에서 ‘아이’에 잘못 연결되어 있으므로 רְחֹבוֹת(거리/광장)에 연결해야 합니다.
