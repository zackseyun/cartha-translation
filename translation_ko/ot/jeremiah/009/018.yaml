id: JER.9.18
reference: Jeremiah 9:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י ק֥וֹל נְהִ֛י נִשְׁמַ֥ע מִ/צִּיּ֖וֹן אֵ֣יךְ שֻׁדָּ֑דְנוּ בֹּ֤שְׁנֽוּ מְאֹד֙ כִּֽי עָזַ֣בְנוּ אָ֔רֶץ כִּ֥י הִשְׁלִ֖יכוּ מִשְׁכְּנוֹתֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/018.yaml
  text: 'For the sound of wailing is heard from Zion: “How we are devastated! We are utterly ashamed[a], because we have left the land[c][b], because they have cast down our dwellings.”'
  footnotes:
  - marker: a
    text: Or “we have been plundered” for “we have been devastated.” The Hebrew verb can emphasize either ruin in general or despoiling by an enemy.
    reason: lexical_alternative
  - marker: b
    text: Or “because we have abandoned the land.” The Hebrew may describe either forced departure or forsaking the land; the context of lament favors departure under judgment.
    reason: lexical_alternative
  - marker: c
    text: Or “our homes” or “our habitations” for “our dwellings.”
    reason: lexical_alternative
translation:
  language: ko
  text: 시온에서 통곡하는 소리가 들립니다. “우리가 철저히 망했구나! 우리가 크게 부끄러워졌으니, 우리가 이 땅을 떠났고, 그들이 우리의 거처들을 무너뜨렸기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘철저히 망했구나’는 히브리어 동사의 파괴·황폐·약탈 가능성을 폭넓게 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 땅을 떠났고’는 강제 이주와 자발적 버림의 가능성을 모두 열어 두는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘거처들’은 ‘집들’ 또는 ‘거주처들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל נְהִ֛י
  english_pob_choice: the sound of wailing
  chosen_korean: 통곡하는 소리
  alternatives_korean:
  - 애곡하는 소리
  - 슬퍼 우는 소리
  lexicon: HALOT
  rationale: קוֹל은 ‘소리’, נְהִי는 애곡/통곡의 의미이므로, 청각적 강조를 살린 ‘통곡하는 소리’가 자연스럽고 직접적입니다.
- source_word: שֻׁדָּדְנוּ
  english_pob_choice: we have been devastated
  chosen_korean: 우리가 철저히 망했구나
  alternatives_korean:
  - 우리가 완전히 황폐해졌구나
  - 우리가 약탈당했구나
  lexicon: HALOT
  rationale: שׁדד는 파괴·황폐·약탈의 뜻을 모두 띨 수 있어, 문맥의 집단적 참상을 살리면서도 약탈로 좁히지 않는 ‘철저히 망했구나’가 적절합니다.
- source_word: בֹּשְׁנוּ מְאֹד
  english_pob_choice: We are utterly ashamed
  chosen_korean: 우리가 크게 부끄러워졌으니
  alternatives_korean:
  - 우리가 몹시 부끄러워졌으니
  - 우리가 심히 수치를 당했으니
  lexicon: HALOT
  rationale: בושׁ은 수치/부끄러움/굴욕을 나타내므로, 현대 한국어에서 예언적 탄식의 정서를 살리는 ‘크게 부끄러워졌으니’로 옮겼습니다.
- source_word: מִשְׁכְּנוֹתֵינוּ
  english_pob_choice: our dwellings
  chosen_korean: 우리의 거처들
  alternatives_korean:
  - 우리의 집들
  - 우리의 거주처들
  - 우리의 처소들
  lexicon: HALOT
  rationale: מִשְׁכָּן 계열은 주거지·거처를 뜻하므로, 공동체적이고 다소 문학적인 ‘거처들’이 본문에 맞습니다.
theological_decisions:
- issue: 시온에서 들리는 통곡의 화자와 어조
  chosen_reading: 예언자는 시온에서 들려오는 공동체의 탄식 소리를 인용하며, 직접 인용부 안에서는 탄식의 1인칭 복수와 감탄조를 그대로 살렸습니다.
  alternative_readings:
  - 직접적인 예언자 해설문으로 풀어 쓰는 방식
  - 더 평서적인 진술로 완화하는 방식
  rationale: 히브리어 본문은 애가적 직접화법을 사용하므로, 한국어에서도 탄식의 급박함과 공동체적 자기고백을 유지하는 것이 본문 효과를 더 잘 드러냅니다.
  doctrine_reference: 예언서의 탄식/심판 맥락 유지
