id: JER.9.10
reference: Jeremiah 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
  footnotes:
  - marker: a
    text: Or 'ruin-heaps.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew tannim; traditionally also rendered 'dragons,' but in this desolation context most likely 'jackals.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with no one dwelling there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 예루살렘을 폐허 더미들[a], 자칼들의 소굴[b]로 만들고, 유다의 성읍들을 사람이 살지 않는 황폐한 곳[c]으로 만들겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 복수형으로, ‘폐허 더미들’ 또는 ‘돌무더기들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תַּנִּים. 전통적으로 ‘용들’로도 번역되었으나, 이 황폐의 문맥에서는 대체로 ‘자칼들’로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘황폐함’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 … 만들고
  alternatives_korean:
