id: JER.9.10
reference: Jeremiah 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
  footnotes:
  - marker: a
    text: Or 'ruin-heaps.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew tannim; traditionally also rendered 'dragons,' but in this desolation context most likely 'jackals.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with no one dwelling there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 예루살렘을 돌무더기들[a]과 승냥이들의 거처[b]로 만들고, 유다의 성읍들을 황무지로[c] 만들어, 거기에 사는 사람이 없게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 복수형으로, ‘돌무더기들’ 또는 ‘폐허 더미들’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תַּנִּים은 이 심판 문맥에서 전통적으로도 ‘승냥이/자칼’로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘황폐함’, ‘황무지 상태’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 … 만들고
  alternatives_korean:
  - 내가 … 주고
  - 내가 … 두고
  - 내가 … 버리고
  lexicon: HALOT
  rationale: 직역의 ‘주다/두다’보다, 심판 결과를 드러내는 ‘만들다’가 히브리어의 사역적 결과 의미를 한국어로 자연스럽게 살립니다.
- source_word: לְגַלִּים
  english_pob_choice: a heap of ruins
  chosen_korean: 돌무더기들
  alternatives_korean:
  - 폐허 더미
  - 무너진 돌무더기
  - 폐허의 무더기
  lexicon: HALOT
  rationale: 복수형 ‘heaps’의 이미지를 살리면서, 도시가 무너져 남은 잔해라는 뜻을 현대 한국어로 분명하게 전달합니다.
- source_word: תַּנִּים
  english_pob_choice: jackals
  chosen_korean: 승냥이들의 거처
  alternatives_korean:
  - 자칼들의 거처
  - 들개들의 거처
  - 용들의 거처
  lexicon: HALOT
  rationale: 파괴된 땅의 문맥에서 신화적 ‘용’보다 사나운 들짐승을 가리키는 의미가 우세하므로, 문맥상 자연스러운 한국어 동물 이미지로 옮겼습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황무지
  alternatives_korean:
  - 황폐
  - 폐허
  - 적막한 황무지
  lexicon: HALOT
  rationale: 명사형 ‘desolation’의 상태를 간결하게 드러내는 표현으로, 뒤의 ‘사람이 없게’와 함께 심판의 황폐함을 분명히 합니다.
theological_decisions:
- issue: 심판 선언에서 하나님의 행위 주체성과 결과를 어떻게 드러낼지
  chosen_reading: ‘내가 … 만들고’로 번역해, 하나님이 예루살렘과 유다의 성읍들을 파괴 상태로 ‘되게 하시는’ 사역적 의미를 분명히 했습니다.
  alternative_readings:
  - ‘내가 … 주고’로 직역
  - ‘내가 … 두고’로 완화
  rationale: 히브리어 נתן의 반복은 단순한 소유 이전이 아니라 심판을 통해 상태를 바꾸는 행위를 뜻하므로, 한국어에서도 결과를 직접 드러내는 표현이 본문의 신학적 강도를 더 잘 보존합니다.
  doctrine_reference: 예언서의 심판 신탁과 하나님의 주권적 행위
