  terminology: 예루살렘, 유다, 성읍들은 통용되는 성서 용례입니다. ‘자칼’은 동물 지시어의 정확성을 높이며, 각주에서 תנים의 전통적 번역 및 어휘상 불확실성을 밝혀 해석의 여지를 보존합니다.
