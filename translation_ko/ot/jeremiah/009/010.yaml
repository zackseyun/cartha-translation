  lexicon: HALOT
  rationale: 직역의 ‘주다/두다’보다, 심판 결과를 드러내는 ‘만들다’가 히브리어의 사역적 결과 의미를 한국어로 자연스럽게 살립니다.
- source_word: לְגַלִּים
