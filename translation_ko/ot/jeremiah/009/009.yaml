id: JER.9.9
reference: Jeremiah 9:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל הֶ֨/הָרִ֜ים אֶשָּׂ֧א בְכִ֣י וָ/נֶ֗הִי וְ/עַל נְא֤וֹת מִדְבָּר֙ קִינָ֔ה כִּ֤י נִצְּתוּ֙ מִ/בְּלִי אִ֣ישׁ עֹבֵ֔ר וְ/לֹ֥א שָׁמְע֖וּ ק֣וֹל מִקְנֶ֑ה מֵ/ע֤וֹף הַ/שָּׁמַ֨יִם֙ וְ/עַד בְּהֵמָ֔ה נָדְד֖וּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/009.yaml
  text: Over the mountains I will lift up weeping and wailing[a], and over the pastures of the wilderness a lament, because they are laid waste so that no man passes through, and they do not hear the sound of livestock. From the birds of the heavens to the beasts, they have fled[c][b]; they are gone.
  footnotes:
  - marker: a
    text: Or 'they are laid waste' for 'they are burned up.' The Hebrew passive verb can denote devastation more generally, though the imagery of burning is likely present.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'no man passes through,' with 'man' used generically for any person.
    reason: lexical_alternative
  - marker: c
    text: Or 'birds of the sky.' Hebrew 'heavens' is a common way to refer to the sky.
    reason: lexical_alternative
translation:
  language: ko
  text: 산들 위에 나는 울음과 통곡을, 광야의 풀밭 위에 애곡을 올리겠습니다. 그것들은 사람이 지나가지 않아 황폐해졌고, 가축의 소리도 들리지 않습니다. 하늘의 새들로부터 짐승들에 이르기까지, 그들은 달아났습니다. 그들은 사라졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘불타버리다’의 이미지를 가질 수 있으나, 문맥상 더 넓게 ‘황폐해지다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’은 히브리어 אִישׁ의 일반적 용법을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하늘’은 히브리어의 일반적인 우주론적 표현으로, ‘하늘의 새들’은 곧 ‘공중의 새들’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא בְכִי וָנֶהִי
  english_pob_choice: I will lift up weeping and wailing
  chosen_korean: 나는 울음과 통곡을 올리겠습니다
  alternatives_korean:
  - 나는 울부짖음과 애도를 드리겠습니다
  - 나는 울음과 슬픔을 들어 올리겠습니다
  lexicon: HALOT
  rationale: נשא의 ‘들어 올리다/올리다’ 이미지를 살리면서, בְכִי와 נֶהִי의 장례·애곡 뉘앙스를 자연스러운 현대어인 ‘울음과 통곡’으로 옮겼습니다.
- source_word: נְאוֹת מִדְבָּר
  english_pob_choice: the pastures of the wilderness
  chosen_korean: 광야의 풀밭
  alternatives_korean:
  - 광야의 목초지
  - 광야의 목양지
  lexicon: HALOT
  rationale: 문맥상 가축의 소리가 사라진 황폐한 목초지를 가리키므로, ‘풀밭’으로 풀어 현대 한국어에서 바로 뜻이 잡히게 했습니다.
- source_word: נִצְּתוּ
  english_pob_choice: they are laid waste
  chosen_korean: 황폐해졌고
  alternatives_korean:
  - 불타버렸고
  - 불에 타 황폐해졌고
  lexicon: HALOT
  rationale: 어근에는 ‘불붙다/타다’의 이미지가 있으나 의미 범위가 더 넓어, POB의 주석 취지에 맞게 과도한 특정화 없이 ‘황폐해졌다’로 옮겼습니다.
- source_word: מִבְּלִי אִישׁ עֹבֵר
  english_pob_choice: so that no man passes through
  chosen_korean: 사람이 지나가지 않아
  alternatives_korean:
  - 아무도 지나가지 않아
  - 지나는 사람이 없어
  lexicon: HALOT
  rationale: אִישׁ를 관용적 남성 단수로 보아, 한국어에서는 성별을 드러내지 않는 일반명사 ‘사람’으로 자연스럽게 옮겼습니다.
- source_word: מֵע֤וֹף הַשָּׁמַ֨יִם֙
  english_pob_choice: From the birds of the heavens
  chosen_korean: 하늘의 새들로부터
  alternatives_korean:
  - 하늘의 새들에서부터
  - 공중의 새들로부터
  lexicon: HALOT
  rationale: ‘하늘’의 우주적 표현을 보존하되 한국어 어순에 맞게 정리했습니다. ‘새들로부터’는 범위를 나타내는 표현입니다.
theological_decisions:
- issue: 예언자의 1인칭 선언과 미래시제
  chosen_reading: ‘나는 … 올리겠습니다’로 직접적인 예언 선언을 살렸습니다.
  alternative_readings:
  - ‘나는 … 올립니다’
  - ‘나는 … 올릴 것입니다’
  rationale: 히브리어의 예언적 1인칭 미래를 한국어에서 선명하게 드러내기 위해 하겠체 미래형을 사용했습니다.
  doctrine_reference: 예언 담화의 문법적 직역성과 현대 가독성의 균형
