  source_fidelity: 초안은 애가의 대상, 황폐한 목초지, 새와 짐승의 떠남을 대체로 충실히 전달합니다. 그러나 ‘사람이 지나가지 않아 황폐해졌고’는 히브리어의 배열과 의미 관계를 뒤집어, 사람의 부재가 황폐의 원인인 것처럼 만듭니다. 본문은 목초지가 불타거나 황폐해진 결과 사람이 지나가지 않는다는 뜻입니다. נִצְּתוּ의 불타는 어휘적 이미지는 본문에 반영하되, 주석에서 더 넓은 의미 가능성을 밝혔습니다.
