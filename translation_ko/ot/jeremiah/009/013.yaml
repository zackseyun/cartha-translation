base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/013.yaml
  text: They went after the stubbornness of their heart and after the Baals[a], which their fathers taught them.
  footnotes:
  - marker: a
    text: Or 'their ancestors.' The Hebrew is literally 'their fathers,' referring to previous generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 마음의 완고함을 따랐으며, 그들의 아버지들이 그들에게 가르친 바알들을 따랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 아버지들’은 문맥상 이전 세대의 조상들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵי
  english_pob_choice: They went after
  chosen_korean: 따라가며
  alternatives_korean:
  - 뒤따랐습니다
  - 따랐습니다
  lexicon: HALOT
  rationale: הלך + אַחֲרֵי의 관용구는 단순한 이동보다 충성·추종의 뜻을 띠므로, 한국어에서는 반복된 종속 관계를 자연스럽게 드러내는 ‘따라가다’로 옮겼습니다.
- source_word: שְׁרִר֣וּת לִבָּם
  english_pob_choice: the stubbornness of their heart
  chosen_korean: 자기 마음의 완고함
  alternatives_korean:
  - 그들의 마음의 완고함
  - 그 마음의 완고함
  lexicon: HALOT
  rationale: שְׁרִרוּת는 완고함/고집스러움을 뜻하고, 히브리어 단수 ‘마음’은 각 사람의 내적 성향을 집합적으로 가리키므로 ‘자기 마음의 완고함’이 원문의 뉘앙스를 살립니다.
- source_word: הַבְּעָלִים
  english_pob_choice: the Baals
  chosen_korean: 바알들을
  alternatives_korean:
  - 바알 신들을
  - 바알들
  lexicon: HALOT
  rationale: 복수형 הַבְּעָלִים은 가나안 신 바알의 지역적·복수적 형태들을 가리키므로, 단수화하지 않고 복수 목적격 ‘바알들을’로 옮겼습니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들이
  alternatives_korean:
  - 그들의 아버지들이
  - 그들의 선조들이
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그들의 아버지들’이지만, 문맥상 이전 세대를 가리키므로 한국어에서는 자연스럽고 의미를 드러내는 ‘조상들’로 옮기되, 성별-정확성보다 세대적 의미를 살렸습니다.
theological_decisions:
- issue: 우상 숭배의 대상 표현
  chosen_reading: ‘바알들’이라는 복수 표현을 유지해 지역 우상 숭배의 분산성과 지속성을 드러냈습니다.
  alternative_readings:
  - ‘바알 신들’로 일반화
  - 단수 ‘바알’로 평준화
  rationale: 예레미야의 고발은 단일 우상이 아니라 여러 지역 바알 숭배를 가리키므로, 복수형을 유지하는 편이 본문이 말하는 우상 숭배의 역사적 실상을 더 정확히 전달합니다.
  doctrine_reference: 본문 문맥의 우상 숭배 비판과 우상 복수형 표지
