id: JER.9.4
reference: Jeremiah 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֤ישׁ בְּ/רֵעֵ֨/הוּ֙ יְהָתֵ֔לּוּ וֶ/אֱמֶ֖ת לֹ֣א יְדַבֵּ֑רוּ לִמְּד֧וּ לְשׁוֹנָ֛/ם דַּבֶּר שֶׁ֖קֶר הַעֲוֵ֥ה נִלְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/004.yaml
  text: And each man deceives his neighbor[a], and they do not speak truth; they have taught their tongue to speak falsehood[b]; they weary themselves committing iniquity.
  footnotes:
  - marker: a
    text: Or 'mocks his neighbor' or 'deals deceitfully with his neighbor' for 'deceives his neighbor.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they exhaust themselves doing wrong.'
    reason: lexical_alternative
translation:
  language: ko
  text: 각 사람은 자기 이웃을 속이고, 진실을 말하지 않으며, 자기 혀를 훈련시켜 거짓을 말하게 합니다. 그들은 죄악을 행하느라 스스로 지쳐 버립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 이웃을 조롱한다’ 또는 ‘자기 이웃에게 속임수를 쓴다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 잘못을 행하느라 스스로 지친다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각 남자
  - 사람마다
  - 모든 사람
  lexicon: HALOT
  rationale: 분배적 단수의 뜻을 한국어에서 자연스럽게 살리면서도 현대 독자에게 성별 중심으로 들리지 않도록 '각 사람'으로 옮겼습니다.
- source_word: בְּרֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 자기 친구
  - 자기 동료
  - 그의 이웃
  lexicon: HALOT
  rationale: 관계의 친밀함보다 윤리적·사회적 대상성을 드러내는 표현이어서 '이웃'이 적절합니다.
- source_word: לִמְּדוּ לְשׁוֹנָם דַּבֶּר שֶׁקֶר
  english_pob_choice: they have taught their tongue to speak falsehood
  chosen_korean: 자기 혀를 훈련시켜 거짓을 말하게 합니다
  alternatives_korean:
  - 자기 혀를 가르쳐 거짓을 말하게 합니다
  - 자기 혀를 익히게 하여 거짓말하게 합니다
  lexicon: HALOT
  rationale: 혀를 ‘가르치다/훈련시키다’는 의인화된 표현을 살리되, 한국어에서는 목적어와 서술을 자연스럽게 연결해 현재적 상태로 읽히도록 했습니다.
- source_word: הַעֲוֵה נִלְאוּ־
  english_pob_choice: they weary themselves committing iniquity
  chosen_korean: 죄악을 행하느라 스스로 지쳐 버립니다
  alternatives_korean:
  - 죄악을 행하느라 스스로 피곤해집니다
  - 불의를 행하느라 스스로 지쳐 갑니다
  lexicon: HALOT
  rationale: '''wear themselves out''의 반사적 뉘앙스를 살리면서, ''죄악/행하다''로 예언서의 도덕적 무게를 유지했습니다.'
theological_decisions:
- issue: ‘진실’과 ‘거짓’의 병렬을 한국어에서 어떻게 보존할지
  chosen_reading: ‘진실을 말하지 않으며… 거짓을 말하게 합니다’로 대응시켜, אמת와 שקר의 도덕적 대조를 직접 드러냈습니다.
  alternative_readings:
  - ‘사실을 말하지 않으며… 거짓말을 하게 합니다’
  - ‘진리를 말하지 않으며… 거짓을 말하게 합니다’
  rationale: 본문의 핵심은 단순 정보 오류가 아니라 언어의 윤리적 붕괴이므로, ‘진실/거짓’의 대조를 선명하게 유지하는 것이 좋습니다.
  doctrine_reference: 예레미야의 언어 윤리와 언약 공동체의 진실성
