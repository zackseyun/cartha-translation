  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
  footnotes:
  - marker: a
    text: Or 'the wailing women' or 'the professional mourners.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the wise women'; here likely women skilled in leading lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “잘 생각해 보십시오. 곡하는 여자들[a]을 부르십시오. 그들이 오게 하십시오. 또 능숙한 여자들[b]에게 사람을 보내십시오. 그들도 오게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘애곡하는 여자들’, ‘전문 애곡꾼들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜로운 여자들’. 여기서는 애가를 이끄는 데 능숙한 여자들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
