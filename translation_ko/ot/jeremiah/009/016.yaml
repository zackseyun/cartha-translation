  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִתְבּֽוֹנְנ֛וּ וְ/קִרְא֥וּ לַ/מְקוֹנְנ֖וֹת וּ/תְבוֹאֶ֑ינָה וְ/אֶל הַ/חֲכָמ֥וֹת שִׁלְח֖וּ וְ/תָבֽוֹאנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/016.yaml
  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
  footnotes:
  - marker: a
    text: Or 'the wailing women' or 'the professional mourners.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the wise women'; here likely women skilled in leading lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이같이 말씀하십니다. 「생각해 보라. 그리고 곡하는 여자들을 불러오게 하여, 그들이 오게 하라. 또 슬기로운 여자들에게 사람을 보내어, 그들도 오게 하라.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡하는 여자들’, ‘전문 곡자들’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜로운 여자들’; 여기서는 애가를 이끄는 데 익숙한 여자들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 야훼로 옮기고, צְבָאוֹת은 예언문에서 통용되는 관용 표현인 만군으로 처리해 신적 칭호의 장중함을 살렸습니다.
- source_word: הִתְבּוֹנְנוּ
  english_pob_choice: Consider
  chosen_korean: 생각해 보라
  alternatives_korean:
  - 숙고하라
  - 주의하라
  lexicon: HALOT
  rationale: 히트폴엘 명령은 단순 인지가 아니라 주의 깊은 숙고를 요구하므로, 현대 한국어에서 자연스럽고 직접적인 권고인 ‘생각해 보라’로 옮겼습니다.
- source_word: לַמְקוֹנְנוֹת
  english_pob_choice: the mourning women
  chosen_korean: 곡하는 여자들
  alternatives_korean:
  - 애곡하는 여자들
  - 상주하는 여자들
  - 전문 곡자들
  lexicon: HALOT
  rationale: 단순한 슬픔의 상태보다 lament를 수행하는 여성들을 가리키므로, 본문의 기능을 드러내는 ‘곡하는 여자들’로 옮겼습니다.
- source_word: הַחֲכָמוֹת
  english_pob_choice: the skillful women
  chosen_korean: 슬기로운 여자들
  alternatives_korean:
  - 지혜로운 여자들
  - 능숙한 여자들
  lexicon: HALOT
  rationale: 문맥상 일반적 지혜라기보다 애가를 이끄는 데 익숙한 여성들이므로, POB의 ‘skillful’에 맞춰 기능적 숙련을 넌지시 드러내는 ‘슬기로운’으로 옮겼습니다.
theological_decisions:
- issue: 예언적 소환 명령의 반복된 목적절 처리
  chosen_reading: 그들이 오게 하라 / 그들도 오게 하라
  alternative_readings:
  - 오라
  - 오게 하라
  rationale: 히브리어의 명령 연쇄와 결과/목적 뉘앙스를 살리기 위해 직접 명령보다 소환의 목적을 드러내는 구조를 유지했습니다.
  doctrine_reference: 예언문 화행의 직역-의미 균형
