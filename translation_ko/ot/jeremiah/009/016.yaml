  rationale: יהוה는 프로젝트 기본값대로 야훼로 옮기고, צְבָאוֹת은 예언문에서 통용되는 관용 표현인 만군으로 처리해 신적 칭호의 장중함을 살렸습니다.
- source_word: הִתְבּוֹנְנוּ
  english_pob_choice: Consider
  chosen_korean: 생각해 보라
  alternatives_korean:
