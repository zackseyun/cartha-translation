id: JER.9.15
reference: Jeremiah 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲפִֽצוֹתִי/ם֙ בַּ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יָֽדְע֔וּ הֵ֖מָּה וַֽ/אֲבוֹתָ֑/ם וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/015.yaml
  text: And I will scatter them among the nations that neither they nor their fathers have known[c][b][a], and I will send the sword after them until I have consumed them.
  footnotes:
  - marker: a
    text: Or 'their ancestors.' The Hebrew reads 'their fathers.'
    reason: lexical_alternative
  - marker: b
    text: '''The sword'' is a common biblical image for warfare or deadly judgment.'
    reason: cultural_note
  - marker: c
    text: Or 'until I have made an end of them' or 'until I have destroyed them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들도 그들의 아버지들도 알지 못한 민족들 가운데로 그들을 흩어 버리고, 내가 그들을 멸할 때까지 그들 뒤로 칼을 보내겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 조상들’. 히브리어는 문자적으로 ‘그들의 아버지들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘칼’은 전쟁이나 치명적인 심판을 가리키는 성경의 흔한 이미지입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘내가 그들을 끝낼 때까지’ 또는 ‘내가 그들을 다 없앨 때까지’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִיצֹתִים
  english_pob_choice: And I will scatter them
  chosen_korean: 내가 그들을 ... 흩어 버리고
  alternatives_korean:
  - 내가 그들을 흩고
  - 내가 그들을 흩어 놓고
  lexicon: HALOT
  rationale: הפיץ의 사역형 의미를 따라 ‘흩어 버리다’로 옮겨 심판의 분산 이미지를 살렸습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among nations
  chosen_korean: 민족들 가운데에
  alternatives_korean:
  - 나라들 가운데에
  - 여러 민족들 가운데에
  lexicon: HALOT
  rationale: גּוֹיִם은 여기서 이방 ‘민족들/나라들’을 뜻하므로, 후대적 대조를 덜 불러오는 ‘민족들 가운데에’로 옮겼습니다.
- source_word: הֵמָּה וַאֲבוֹתָם
  english_pob_choice: neither they nor their fathers
  chosen_korean: 그들이나 그들의 조상도
  alternatives_korean:
  - 그들이나 그들의 아버지도
  - 그들이나 그들의 선조도
  lexicon: HALOT
  rationale: 히브리어의 부정 범위를 살리면서 한국어로 자연스럽게 ‘그들이나 ...도 알지 못한’ 구조로 풀었습니다. 'fathers'는 직역하면 ‘아버지들’이지만, 한국어 문맥에서는 ‘조상’이 의미를 더 분명히 전달합니다.
- source_word: הַחֶרֶב
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 칼(전쟁의 상징)
  - 전쟁
  lexicon: HALOT
  rationale: ‘칼’은 히브리어의 전쟁·심판 메타포를 직접 담는 구체적 이미지이므로, 추상화하지 않고 유지했습니다.
- source_word: כַּלּוֹתִי אוֹתָם
  english_pob_choice: until I have consumed them
  chosen_korean: 내가 그들을 끝장낼 것입니다
  alternatives_korean:
  - 내가 그들을 멸할 것입니다
  - 내가 그들을 소멸할 것입니다
  - 내가 그들을 다 없앨 것입니다
  lexicon: HALOT
  rationale: כלה의 ‘끝내다/완료하다’와 심판 문맥을 함께 살려, 단순한 ‘destroy’보다 강한 종결 의미를 지닌 ‘끝장내다’로 옮겼습니다.
theological_decisions:
- issue: ‘칼’의 직역과 심판 이미지
  chosen_reading: 칼을 보내어
  alternative_readings:
  - 전쟁을 보내어
  - 무력으로 심판하여
  rationale: 본문의 구체적 이미지를 유지하는 것이 중요하므로, 메타포를 해석어로 바꾸지 않고 ‘칼’을 남겼습니다. 이는 예언서의 상징적 심판 언어를 보존합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
