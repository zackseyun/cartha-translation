revisions:
- from: 내가 그들을 그들이나 그들의 조상도 알지 못한 민족들 가운데에 흩어 버리고, 그 뒤로 칼을 보내어 내가 그들을 끝장낼 것입니다.[a][b][c]
  to: 내가 그들도 그들의 아버지들도 알지 못한 민족들 가운데로 그들을 흩어 버리고, 내가 그들을 멸할 때까지 그들 뒤로 칼을 보내겠습니다.[a][b][c]
  rationale: ‘아버지들’을 본문에 유지하여 אָבוֹתָם의 직접적 의미를 보존하고, ‘멸할 때까지’로 עַד כַּלּוֹתִי의 시간적·종결적 의미를 반영했습니다. ‘칼’의 비유적 이미지는 해석어로 바꾸지 않았습니다. 각주 표지는 실제 해당 어구 뒤에 배치되어야 합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:25Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 핵심 구조(낯선 민족들 가운데로 흩음, 그들 뒤로 칼을 보냄, 그들을 멸할 때까지)는 대체로 반영되었습니다. 그러나 ‘끝장낼 것입니다’는 עַד כַּלּוֹתִי의 ‘~할 때까지’라는 시간적 범위를 문장상 충분히 반영하지 못하며, ‘조상’은 אָבוֹתָם(그들의 아버지들)의 직접적 표현을 약화합니다.
  naturalness: ‘끝장내다’는 현대 한국어에서 구어적이고 거친 어감이 강하여 현대 정중한 합쇼체 성경 문체에 알맞지 않습니다. ‘그들을 멸할 때까지’는 문맥과 시간 범위를 자연스럽게 살립니다.
  terminology: אָבוֹתָם은 본문에서 ‘그들의 아버지들’로 옮기고, ‘조상’은 각주 대안으로 제시하는 것이 원문 충실성과 자연스러움을 함께 만족합니다. הַחֶרֶב의 구체적 이미지인 ‘칼’은 유지해야 합니다.
  issues:
  - severity: medium
    issue: ‘끝장낼 것입니다’가 עַד כַּלּוֹתִי의 시간적 범위를 충분히 반영하지 않음
    rationale: 원문은 ‘내가 그들을 끝낼/멸할 때까지 칼을 보낼 것이다’라는 구조입니다. ‘그들을 멸할 때까지’로 옮겨 ‘עד’의 범위를 명시해야 합니다.
  - severity: medium
    issue: ‘끝장내다’의 문체 수준
    rationale: 심판의 심각성은 전달하지만 구어적·관용적 표현이므로 현대 정중한 성경 번역의 문체에 덜 적합합니다.
  - severity: low
    issue: 본문의 ‘조상’과 각주 설명의 불필요한 불일치
    rationale: אָבוֹתָם의 직접적 표현은 ‘그들의 아버지들’입니다. 본문에는 이를 두고, ‘조상’을 자연스러운 대안으로 각주에 제시하는 편이 낫습니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 일괄 배치됨
    rationale: 각주는 각각 ‘아버지들’, ‘칼’, ‘멸할 때까지’에 붙여 해당 설명의 범위를 분명히 해야 합니다.
