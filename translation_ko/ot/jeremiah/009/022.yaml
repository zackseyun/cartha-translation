base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/022.yaml
  text: 'Thus says Yahweh: Let not the wise man boast in his wisdom[a], and let not the mighty man boast in his might; let not the rich man boast in his riches.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. "지혜로운 사람은 자기 지혜를 자랑하지 말고, 용사는 자기 용맹을 자랑하지 말며, 부자는 자기 재물을 자랑하지 마십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה(야훼)를 가리킵니다. 전통적으로는 ‘주님’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언 선포 공식을 한국어로 자연스럽게 옮기되, 원문의 직접 화법과 권위 있는 선언성을 살려 ‘이렇게 말씀하십니다’로 처리했습니다. יְהוָה는 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: אַל יִתְהַלֵּל
  english_pob_choice: Let not ... boast
  chosen_korean: 자랑하지 말고
  alternatives_korean:
  - 뽐내지 말고
  - 자기 영광을 구하지 말고
  lexicon: HALOT
  rationale: 히트파엘의 자기 과시/자랑 의미를 반영해, 현대 한국어에서 가장 직결되는 ‘자랑하다’로 옮겼습니다. 문맥상 금지 명령이므로 연결형 ‘-말고’가 자연스럽습니다.
- source_word: חָכָם / גִּבּוֹר / עָשִׁיר
  english_pob_choice: the wise man / the mighty man / the rich man
  chosen_korean: 지혜로운 사람 / 용사 / 부자
  alternatives_korean:
  - 지혜로운 자 / 힘센 사람 / 부유한 사람
  - 현명한 사람 / 강한 사람 / 부자
  lexicon: HALOT
  rationale: 세 평행 구조를 살리면서 한국어에서 과도하게 문자적인 남성형 표현을 피했습니다. גִּבּוֹר는 이 절에서 단순 신체적 강함보다 자랑의 근거가 되는 ‘용맹한 사람’의 뉘앙스가 강해 ‘용사’로 옮겼습니다.
- source_word: בְּחָכְמָתוֹ / בִּגְבוּרָתוֹ / בְּעָשְׁרוֹ
  english_pob_choice: in his wisdom / in his might / in his riches
  chosen_korean: 자기 지혜 / 자기 용맹 / 자기 재물
  alternatives_korean:
  - 그의 지혜 / 그의 힘 / 그의 재물
  - 그 지혜 / 그 힘 / 그 부
  lexicon: HALOT
  rationale: בְּ는 자랑의 근거 또는 영역을 나타내므로 ‘~를 자랑하다’로 자연히 풀었습니다. 소유격을 한국어에서 더 분명히 드러내기 위해 ‘자기’를 넣어 각 항목의 자기 과시라는 의미를 살렸습니다.
theological_decisions:
- issue: 문장 종결과 예언적 명령의 존대 수준
  chosen_reading: 직접 인용 안에서는 청중에게 주어지는 금지 명령을 합쇼체로 유지하되, 선포 도입부는 신적 발화의 권위를 살려 ‘말씀하십니다’로 처리했습니다.
  alternative_readings:
  - 인용문 전체를 평서형으로 처리
  - 명령문을 모두 해라체로 처리
  rationale: 예언자적 선언과 그 안의 경고를 현대 한국어 성경 문체에 맞게 구분하기 위한 선택입니다. 신성한 발화는 존대 종결을 유지하면서도, 인용문 내부는 직접 금지 명령의 힘을 유지합니다.
  doctrine_reference: Korean POB style guideline on divine direct speech and register shift
