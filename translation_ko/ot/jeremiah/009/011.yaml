id: JER.9.11
reference: Jeremiah 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִֽי הָ/אִ֤ישׁ הֶֽ/חָכָם֙ וְ/יָבֵ֣ן אֶת זֹ֔את וַ/אֲשֶׁ֨ר דִּבֶּ֧ר פִּֽי יְהוָ֛ה אֵלָ֖י/ו וְ/יַגִּדָ֑/הּ עַל מָה֙ אָבְדָ֣ה הָ/אָ֔רֶץ נִצְּתָ֥ה כַ/מִּדְבָּ֖ר מִ/בְּלִ֖י עֹבֵֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/011.yaml
  text: Who is the wise man who can understand this? To whom has the mouth of Yahweh spoken[a], that he may declare it? Why has the land perished, laid waste like the wilderness[c][b], with no one passing through?
  footnotes:
  - marker: a
    text: 'Hebrew: ''the mouth of the LORD,'' a prophetic idiom for the LORD''s direct speech.'
    reason: cultural_note
  - marker: b
    text: Or 'has the land been ruined' for 'has the land perished.'
    reason: lexical_alternative
  - marker: c
    text: Or 'without anyone passing through.'
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 사람이 누구입니까? 이 일을 깨달을 수 있는 사람이 누구입니까? 야훼의 입이 그에게 말씀하셨으니 그가 이것을 선포할 수 있습니까? 어찌하여 땅이 멸망하여 광야처럼 황폐하게 되었으며, 지나가는 사람도 없습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야훼의 입’이며, 예언자에게 주어진 직접적인 신적 발화를 가리키는 관용구입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘땅이 멸망하였다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아무도 지나가지 않도록’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ הֶחָכָם
  english_pob_choice: Who is the wise man
  chosen_korean: 지혜로운 사람이 누구입니까?
  alternatives_korean:
  - 지혜로운 남자가 누구입니까?
  - 지혜로운 사람은 누구입니까?
  lexicon: HALOT
  rationale: 히브리어는 남성 단수 표현이지만, 한국어에서는 대표적 남성형을 과도하게 드러내지 않으면서도 질문 형식을 자연스럽게 살리기 위해 ‘지혜로운 사람’을 택했습니다.
- source_word: וְיָבֵן אֶת זֹאת
  english_pob_choice: who can understand this
  chosen_korean: 이 일을 깨달을 수 있는
  alternatives_korean:
  - 이것을 이해하는
  - 이것을 알아차릴 수 있는
  lexicon: HALOT
  rationale: yiqtol의 능력/가능성 뉘앙스를 살려 ‘깨달을 수 있는’으로 옮겼습니다. 단순 현재형보다 원문의 ‘할 수 있는가’라는 물음을 더 잘 반영합니다.
- source_word: פִּי יְהוָה אֵלָיו
  english_pob_choice: the mouth of Yahweh spoken
  chosen_korean: 야훼의 입이 그에게 말씀하셨으니
  alternatives_korean:
  - 야훼께서 그에게 말씀하셨으니
  - 야훼의 입이 그에게 말하셨으니
  lexicon: HALOT
  rationale: ‘야훼의 입’이라는 예언적 관용구를 그대로 살려 직접적인 신적 발화를 드러냈습니다. 한국어에서는 ‘말씀하셨으니’로 자연스럽게 연결했습니다.
- source_word: וְיַגִּדָהּ
  english_pob_choice: that he may declare it
  chosen_korean: 그가 이것을 선포할 수 있습니까?
  alternatives_korean:
  - 그가 그것을 선포하게 하십시오
  - 그가 그것을 말하게 하십시오
  lexicon: HALOT
  rationale: 동사의 공적·예언적 의미를 따라 ‘선포하다’를 택했습니다. 이어지는 문맥의 수사적 질문을 살려 가능성 질문형으로 옮겼습니다.
- source_word: נִצְּתָה
  english_pob_choice: laid waste
  chosen_korean: 황폐하게 되었으며
  alternatives_korean:
  - 유린되었으며
  - 폐허가 되었으며
  lexicon: HALOT
  rationale: 전면적 파괴보다 ‘황폐’의 결과 상태를 드러내는 표현으로, 영어 POB의 ‘laid waste’와 히브리어의 피동적 황폐화 의미를 함께 반영했습니다.
- source_word: כַמִּדְבָּר
  english_pob_choice: like the wilderness
  chosen_korean: 광야처럼
  alternatives_korean:
  - 들판처럼
  - 사막처럼
  lexicon: HALOT
  rationale: מִדְבָּר의 성서적 울림을 살려 ‘광야’로 옮겼습니다. 단순 지리적 ‘사막’보다 원문의 비교 효과가 분명합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기준에 따라 고유명사 ‘야훼’로 옮겨 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘야훼의 입’ 관용구 유지
  chosen_reading: 본문에 그대로 유지
  alternative_readings:
  - 야훼께서 말씀하셨으니
  rationale: 예언자적 직접계시를 강조하는 히브리어 관용구이므로, 이를 평이하게 풀어버리기보다 본문의 이미지와 신학적 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
