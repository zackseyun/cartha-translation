    rationale: 원문은 지혜로운 사람 및 야훼의 말씀을 받아 그 일을 알릴 수 있는 사람을 찾는 병렬 질문입니다. ‘말씀하셨으니’와 ‘선포할 수 있습니까?’는 각각 원문에 없는 인과관계와 별도 질문을 만듭니다.
