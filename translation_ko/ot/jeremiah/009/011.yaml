  to: 이 일을 깨달을 수 있는 지혜로운 사람이 누구이며, 야훼의 입이 그에게 말씀하시어 그가 그것을 알릴 수 있는 사람이 누구입니까?[a] 어찌하여 땅이 멸망하고[b] 광야처럼 황폐해져 지나가는 이가 없게 되었습니까?[c]
  rationale: 원문의 두 병렬 관계절을 ‘누구이며 … 누구입니까?’로 유지하고, 야훼의 말씀을 받은 사람이 ‘그것을 알릴 수’ 있다는 목적/결과적 연결을 복원했습니다. 마지막 질문은 땅의 멸망, 광야 같은 황폐, 통행인의 부재라는 세 요소를 한 의문문 안에 보존했습니다. 각주 표지도 해당 어구 바로 뒤로 옮겼습니다.
