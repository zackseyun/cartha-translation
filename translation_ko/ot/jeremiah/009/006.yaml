    rationale: 본문의 ‘단련하고 시험하고 있습니다’는 이미 הִנְנִי와 관련 동사들의 진행적 선언을 적절히 반영합니다. 영어 POB의 b 각주는 כִּי אֵיךְ אֶעֱשֶׂה의 ‘달리 할 수 없음’이라는 수사적 표현에 관한 대안이므로, 한국어 각주도 그 지점에 연결되어야 합니다.
