  source_fidelity: ‘딸 같은 내 백성’은 בַּת עַמִּי의 비유를 한 단계 해석하여 옮긴 것으로, 원문의 표현과 그 모호성을 충분히 보존하지 못합니다. 또한 현행 b 각주는 본문의 진행형 동사와 실질적인 대안을 이루지 못하며, 영어 POB의 b 각주가 다루는 수사 의문문의 대안을 반영하지 못합니다.
  naturalness: ‘만군의 야훼’, ‘보십시오’, ‘단련하고 시험하고 있습니다’, ‘내가 달리 어떻게 하겠습니까?’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘내 백성의 딸’은 일상 한국어로는 낯설지만, 예언서의 관용적 표현을 보존하는 번역으로서 적절하며 각주가 이를 돕습니다.
  terminology: 야훼와 만군은 영어 POB의 명명 및 호칭 선택과 일치합니다. צורף의 금속 정련 은유는 ‘단련하다’로, בחן은 ‘시험하다’로 유지했습니다. בַּת עַמִּי는 해석적 ‘딸 같은’ 대신 직역적 ‘내 백성의 딸’로 보존해야 합니다.
