id: JER.9.6
reference: Jeremiah 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י צוֹרְפָ֖/ם וּ/בְחַנְתִּ֑י/ם כִּֽי אֵ֣יךְ אֶעֱשֶׂ֔ה מִ/פְּנֵ֖י בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/006.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Behold, I am refining them and testing them[b], for how else can I act because of the daughter of my people?'
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'my people' or 'my dear people.' The Hebrew literally reads 'the daughter of my people,' a prophetic expression of tenderness and covenant relationship.
    reason: lexical_alternative
  - marker: b
    text: Or, 'for how can I do otherwise?'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 만군의 야훼께서 이렇게 말씀하십니다. 「보십시오, 나는 그들을 단련하고 시험하고 있습니다[b]. 딸 같은 내 백성 때문에 내가 어찌 달리 행할 수 있겠습니까[a]?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 백성의 딸’입니다. 예언서에서 쓰이는 친밀하고 언약적인 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘단련하며 시험하며’처럼 동사형을 직역할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: HALOT
  rationale: 이 호칭은 하나님의 고유명 야훼와 군대/천상의 무리를 가리키는 צְבָאוֹת의 결합이므로, POB의 ‘Yahweh of hosts’를 따라 ‘만군의 야훼’로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 나는
  alternatives_korean:
  - 보라, 나는
  - 내가 바로
  lexicon: HALOT
  rationale: 선지서의 선언적·강조적 용법을 살리기 위해 지시적 감탄을 유지하되, 현대 한국어에서는 ‘보십시오’가 가장 자연스럽고 정중한 호소로 들립니다.
- source_word: צוֹרְפָם וּבְחַנְתִּים
  english_pob_choice: refining them and testing them
  chosen_korean: 그들을 단련하고 시험하고 있습니다
  alternatives_korean:
  - 그들을 정련하고 검증하고 있습니다
  - 그들을 제련하고 살피고 있습니다
  lexicon: HALOT
  rationale: 금속 정련의 은유를 한국어에서 너무 좁히지 않으면서도, 선지적 심판/정화의 동시적 의미를 살리기 위해 ‘단련하다’와 ‘시험하다’를 병렬로 두었습니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 딸 같은 내 백성
  alternatives_korean:
  - 내 백성의 딸
  - 내 사랑하는 백성
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘내 백성의 딸’은 한국어에서 어색하므로, POB의 각주 취지를 반영해 친밀함과 언약적 애정을 드러내는 ‘딸 같은 내 백성’으로 옮겼습니다.
- source_word: מִפְּנֵי
  english_pob_choice: because of
  chosen_korean: 때문에
  alternatives_korean:
  - 으로 말미암아
  - 인하여
  lexicon: HALOT
  rationale: 원인·계기의 의미를 가장 간결하게 전달하는 현대 문어 표현으로 처리했습니다.
theological_decisions:
- issue: 예언적 심판의 동사 시제와 진행성
  chosen_reading: ‘나는 … 하고 있습니다’로 현재 진행형을 사용해, 하나님이 지금 그들을 단련하고 시험하시는 장면성을 살렸습니다.
  alternative_readings:
  - ‘나는 … 하겠습니다’로 미래형 처리
  - ‘나는 … 하리라’로 예언적 미래 처리
  rationale: 히브리어 הִנְנִי + 분사 구조와 POB의 최신 판단은 선언적 현재성을 지시하므로, 이를 약화시키지 않기 위해 진행형을 채택했습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: ‘딸 같은 내 백성’의 비유적 친밀성
  chosen_reading: 직역 대신 의미를 드러내는 비유적 번역을 택해, 심판 속 애정과 언약적 긴장을 함께 보존했습니다.
  alternative_readings:
  - ‘내 백성의 딸’
  - ‘내 사랑하는 백성’
  rationale: 선지자적 관용구를 평평하게 풀어버리면 정서적 밀도가 사라지므로, 비유성을 유지하면서도 한국어 독자가 이해할 수 있도록 조정했습니다.
  doctrine_reference: Translation philosophy §§1, 6
