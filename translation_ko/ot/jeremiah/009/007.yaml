review_pass:
  verdict: revise
  source_fidelity: 핵심 은유와 대조는 보존되어 있으나, ‘자기의 매복을 마련합니다’는 히브리어 יָשִׂים אָרְבוֹ(그의 매복을 놓다/두다)의 행위를 한국어에서 다소 부자연스럽게 표현합니다. 또한 ‘입으로는’은 각 사람의 행위라는 주어와 더 직접적으로 연결하는 편이 좋습니다.
  naturalness: ‘평화를 말하다’는 원문의 관용을 비교적 가깝게 보존하지만 현대 한국어에서는 다소 직역투입니다. 다만 각주가 그 관용을 설명하므로 유지할 수 있습니다. ‘매복을 준비합니다’가 ‘자기의 매복을 마련합니다’보다 자연스럽고, 내면에서 해를 계획하는 문맥에도 잘 맞습니다.
  terminology: ‘살상하는 화살’은 שׁוֹחֵט의 치명적·살상적 의미를 보존하면서 ‘죽이는 화살’보다 문어적 예언서 문맥에 더 적절합니다. ‘속임수’, ‘평화’, ‘이웃’, ‘매복’은 적절합니다.
  issues:
  - severity: medium
    issue: ‘자기의 매복을 마련합니다’의 어색한 결합
    rationale: 한국어에서 ‘매복을 마련하다’는 자연스러운 결합이 아니며, 히브리어의 ‘매복을 두다/설치하다’라는 위해의 준비를 충분히 자연스럽게 전달하지 못합니다.
  - severity: low
    issue: ‘입으로는’의 주어 연결
    rationale: 원문은 ‘그의 입으로 각 사람이’라는 구조입니다. ‘각 사람은 입으로’로 배열하면 각 개인의 겉말과 속마음의 대조가 한국어에서 더 분명해집니다.
  revised_text: 그들의 혀는 살상하는 화살입니다. 그것은 속임수를 말합니다. 각 사람은 입으로 자기 이웃에게 평화를 말하지만, 속으로는 매복을 준비합니다.
  revised_footnotes:
  - marker: a
    text: ‘살상하는 화살’은 히브리어 분사 שוחט의 살상 의도를 살린 번역입니다. ‘날카로운 화살’보다 치명적인 해악을 더 직접적으로 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 이웃에게 평화를 말한다’는 관용적 표현을 씁니다. 즉, 친절하거나 화평한 말투로 말하지만 실제 의도는 다르다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘매복’을 두는 대상이 직접 드러나지 않습니다. 따라서 본문은 그 대상을 밝히지 않고 ‘매복을 준비합니다’로 옮겨 모호성을 보존했습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 치명적인 화살 은유와 겉으로 하는 평화의 말 및 내면의 매복이라는 대조를 유지했습니다. 다만 ‘매복을 마련하다’라는 부자연스러운 결합을 ‘매복을 준비하다’로 고쳐 현대 표준 한국어의 자연스러움을 높였고, 각주도 수정된 본문과 정확히 일치하게 했습니다.
