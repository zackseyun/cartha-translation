id: JER.9.7
reference: Jeremiah 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֵ֥ץ שוחט לְשׁוֹנָ֖/ם מִרְמָ֣ה דִבֵּ֑ר בְּ/פִ֗י/ו שָׁל֤וֹם אֶת רֵעֵ֨/הוּ֙ יְדַבֵּ֔ר וּ/בְ/קִרְבּ֖/וֹ יָשִׂ֥ים אָרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/007.yaml
  text: Their tongue is a slaughtering arrow[a]; it speaks deceit. With his mouth each man speaks peace to his neighbor[c][b], but within himself he sets his ambush.
  footnotes:
  - marker: a
    text: Or 'a deadly arrow' or 'a sharpened arrow.' The Hebrew participle from 'slaughter' emphasizes lethal intent, not merely sharpness.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'speaks peace to his neighbor'—that is, he speaks in a friendly or peaceable way while planning harm inwardly.
    reason: cultural_note
  - marker: c
    text: Or 'within him he sets an ambush' or 'inwardly he lays a snare.' The Hebrew leaves the target of the ambush implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 혀는 죽이는 화살[a]입니다. 그것은 속임수를 말합니다. 입으로는 각 사람이 자기 이웃에게 평화를 말하지만[b], 속으로는 자기의 매복을 마련합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽이는 화살’은 히브리어 분사 שוחט의 살상 의도를 살린 번역입니다. ‘날카로운 화살’보다 더 직접적으로 해악을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 이웃에게 평화를 말한다’는 관용적 표현을 씁니다. 즉, 친절하거나 화평한 말투로 말하지만 실제 의도는 다르다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘매복’을 두는 대상이 직접 드러나지 않습니다. 그래서 본문에는 ‘자기의 매복’으로만 두어 모호성을 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵץ שוחט
  english_pob_choice: a slaughtering arrow
  chosen_korean: 죽이는 화살
  alternatives_korean:
  - 살육하는 화살
  - 학살하는 화살
  - 죽음의 화살
  lexicon: HALOT
  rationale: שוחט의 핵심은 단순한 예리함보다 살상 의도에 있으므로, 혀를 ‘죽이는 화살’로 옮겨 폭력성을 분명히 드러냈습니다.
- source_word: לשונם
  english_pob_choice: their tongue
  chosen_korean: 그들의 혀
  alternatives_korean:
  - 그 혀
  - 그들의 입술
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수 이미지를 자연스럽게 살려 공동체 전체의 혀를 가리키는 표현으로 번역했습니다.
- source_word: מרמה דבר
  english_pob_choice: it speaks deceit
  chosen_korean: 속임수를 말합니다
  alternatives_korean:
  - 거짓을 말합니다
  - 기만을 말합니다
  - 속이는 말을 합니다
  lexicon: HALOT
  rationale: 명사 מרמה는 행위와 발화의 기만성을 가리키므로, 간결하고 현대적인 ‘속임수’로 옮겼습니다.
- source_word: בפי/ו שלום את רעהו ידבר
  english_pob_choice: With his mouth each man speaks peace to his neighbor
  chosen_korean: 입으로는 각 사람이 자기 이웃에게 평화를 말하지만
  alternatives_korean:
  - 입으로는 각 사람이 자기 이웃에게 평안이라 말하지만
  - 입으로는 각 사람이 자기 이웃에게 화평을 말하지만
  lexicon: HALOT
  rationale: בפיו의 대비를 살려 ‘입으로는’으로 시작하고, שלום은 기본어휘인 ‘평화’로 옮겨 외적 친화의 뉘앙스를 유지했습니다.
- source_word: ובקרבו ישים ארבו
  english_pob_choice: but within himself he sets his ambush
  chosen_korean: 속으로는 자기의 매복을 마련합니다
  alternatives_korean:
  - 속으로는 자기의 함정을 놓습니다
  - 속으로는 매복을 준비합니다
  - 내면에서는 그의 매복을 둡니다
  lexicon: HALOT
  rationale: בקרבו는 외면과 대비되는 내면을 뜻하므로 ‘속으로는’으로 풀었고, ארב는 ‘매복’으로 유지해 의도적 위해의 이미지를 살렸습니다.
theological_decisions:
- issue: 시편적/예언적 비난의 직설성 보존
  chosen_reading: 혀를 단순히 ‘거짓말’이 아니라 ‘죽이는 화살’로, 내면의 악의를 ‘매복’으로 옮겨 외식과 폭력성을 그대로 드러냈습니다.
  alternative_readings:
  - 도덕적으로 완화된 표현
  - ‘심한 말’ 정도로 약화된 표현
  rationale: 문맥은 사회적 불화의 일반론이 아니라 의도적 해악과 위장된 평화를 고발하므로, 원문의 강한 이미지와 고발성을 유지하는 것이 필요합니다.
  doctrine_reference: 예레미야 9장의 언약 공동체 비판과 잠언적 악인 묘사
