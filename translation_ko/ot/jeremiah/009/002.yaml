  source_fidelity: 개정이 필요합니다. 초안은 활과 혀의 비유, 거짓과 신실함의 대조, 악의 진행, 야훼를 알지 못함을 대체로 보존합니다. 그러나 בָאָרֶץ(‘이 땅에서’)는 ‘신실함을 위하여 강해지지 않았다’는 절에 속하는데, 초안은 이를 ‘악에서 악으로 나아가며’에 연결하여 원문의 절 구조를 바꾸었습니다.
  naturalness: ‘이 땅에서는 신실함을 위하여 강해지지 않았습니다’라고 배치하면 현대 표준 한국어 합쇼체로 자연스럽고 원문의 대조도 분명해집니다. ‘악에서 악으로 나아갑니다’는 문맥상 지속적 진행을 자연스럽게 드러냅니다.
  terminology: ‘야훼’, ‘신실함’, ‘나를 알지 못합니다’는 프로젝트의 용어 선택 및 원문의 언약적 함의를 적절히 보존합니다. נְאֻם יְהוָה는 ‘야훼의 말씀입니다’로 자연스럽게 옮길 수 있습니다.
  issues:
  - severity: medium
