id: JER.9.2
reference: Jeremiah 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּדְרְכ֤וּ אֶת לְשׁוֹנָ/ם֙ קַשְׁתָּ֣/ם שֶׁ֔קֶר וְ/לֹ֥א לֶ/אֱמוּנָ֖ה גָּבְר֣וּ בָ/אָ֑רֶץ כִּי֩ מֵ/רָעָ֨ה אֶל רָעָ֧ה יָצָ֛אוּ וְ/אֹתִ֥/י לֹֽא יָדָ֖עוּ נְאֻם יְהוָֽה־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/002.yaml
  text: They bend their tongue[a] like their bow for falsehood, and not for faithfulness have they grown strong in the land; for from evil to evil they go out, and they do not know me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or "from one evil to another."
    reason: lexical_alternative
  - marker: b
    text: '"Know me" can also carry the sense of acknowledging the LORD relationally and covenantally.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 거짓을 위하여 자기 혀를 활처럼 당기고, 이 땅에서는 신실함을 위하여 강해지지 않았습니다. 그들은 악에서 악으로[a] 나아가고, 나를 알지 못합니다[b]. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 악에서 다른 악으로’.
    reason: lexical_alternative
  - marker: b
    text: ‘나를 알다’는 단순한 지식보다 하나님을 언약적으로 인정하고 관계적으로 아는 뜻을 포함할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיַּדְרְכוּ אֶת לְשׁוֹנָם קַשְׁתָּם
  english_pob_choice: They bend their tongue like their bow
  chosen_korean: 그들은 거짓을 위해 자기 혀를 활처럼 당기고
  alternatives_korean:
  - 그들은 자기 혀를 활처럼 구부리고
  - 그들은 자기 혀를 활처럼 겨누고
  lexicon: HALOT
  rationale: דרך의 활 이미지는 한국어에서 ‘활처럼 당기다’가 가장 자연스럽게 공격적 비유를 살리며, שׁקר/שׁקר의 목적어는 ‘거짓을 위해’로 간결하게 옮길 수 있습니다.
- source_word: לֶאֱמוּנָה
  english_pob_choice: for faithfulness
  chosen_korean: 신실함을 위해서는
  alternatives_korean:
  - 믿음을 위해서는
  - 진실함을 위해서는
  lexicon: HALOT
  rationale: אֱמוּנָה는 단순한 사실 진술보다 신실성·신뢰성을 가리키므로, 한국어에서도 ‘신실함’이 대조를 가장 잘 드러냅니다.
- source_word: מֵרָעָה אֶל רָעָה יָצָאוּ
  english_pob_choice: from evil to evil they go out
  chosen_korean: 그들은 이 땅에서 악에서 악으로 나아가며
  alternatives_korean:
  - 그들은 이 땅에서 악에서 악으로 나가며
  - 그들은 이 땅에서 한 악에서 다른 악으로 나아가며
  lexicon: HALOT
  rationale: יאָצָאוּ를 단순 ‘나가다’로 두기보다 문맥상 진행성을 살려 ‘나아가다’로 옮기되, 반복적 악의 진행은 ‘악에서 악으로’로 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 주어진 프로젝트 기본어휘에 따라 여호와가 아닌 야훼를 사용해 고유명으로 보존했습니다.
theological_decisions:
- issue: ידע의 관계적·언약적 의미
  chosen_reading: 나를 알지 못합니다
  alternative_readings:
  - 나를 인정하지 않습니다
  - 나를 알아보지 않습니다
  rationale: ידע는 단순 인지보다 언약적·관계적 앎을 포함할 수 있으므로, 본문은 의미를 좁히지 않고 표준적인 ‘알다’로 두었습니다.
  doctrine_reference: 의도된 신학적 긴장을 유지합니다.
- issue: 예언 공식의 공적 선언성
  chosen_reading: 야훼의 말씀입니다
  alternative_readings:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  rationale: נְאֻם יְהוָה의 예언자적 종결 공식을 현대 한국어에서 자연스럽고 격식 있게 전달하면서도, 단순 인용보다 공적 선언의 느낌을 유지합니다.
  doctrine_reference: 예언 발화 형식 보존
