source:
  edition: WLC
  text: עַל מִצְרַ֣יִם וְ/עַל יְהוּדָ֗ה וְ/עַל אֱד֞וֹם וְ/עַל בְּנֵ֤י עַמּוֹן֙ וְ/עַל מוֹאָ֔ב וְ/עַל֙ כָּל קְצוּצֵ֣י פֵאָ֔ה הַ/יֹּשְׁבִ֖ים בַּ/מִּדְבָּ֑ר כִּ֤י כָל הַ/גּוֹיִם֙ עֲרֵלִ֔ים וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל עַרְלֵי לֵֽב־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/025.yaml
  text: against Egypt[a], and against Judah, and against Edom, and against the sons of Ammon, and against Moab, and against all those with the corners of their hair cut off, who dwell in the wilderness; for all the nations are uncircumcised, and all the house of Israel are uncircumcised in heart.
  footnotes:
  - marker: a
    text: Or, “all who clip the corners of their hair”; the Hebrew likely refers to a distinctive hairstyle of desert peoples.
    reason: lexical_alternative
translation:
  language: ko
  text: 애굽과 유다와 에돔과 암몬 자손과 모압과, 광야에 사는 머리 가장자리를 깎은 모든 이들[a]에게 임할 것이니, 이는 모든 민족이 할례를 받지 못하였고 이스라엘 온 집이 마음에 할례를 받지 못하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “머리 가장자리를 잘라 낸 모든 이들.” 히브리어 표현은 광야에 사는 민족들의 독특한 머리 모양을 가리키는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  english_pob_choice: against
  chosen_korean: ~에게 임하리니
  alternatives_korean:
  - ~에 대하여
  - ~을 향하여
  lexicon: HALOT
  rationale: 예언적 심판 맥락에서 대상을 향한 임박한 재앙을 자연스럽게 드러내기 위해, 한국어는 직역형 전치사보다 ‘임하다’ 구문으로 호소력 있게 옮겼습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the sons of Ammon
  chosen_korean: 암몬의 아들들
  alternatives_korean:
  - 암몬 사람들
  - 암몬 자손
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’ 구조를 유지해 원문 투명성을 살렸고, 집단명으로도 자연스럽게 읽히도록 했습니다.
- source_word: כָּל קְצוּצֵי פֵאָה
  english_pob_choice: all those with the corners of their hair cut off
  chosen_korean: 머리 가장자리를 깎는 모든 이들
  alternatives_korean:
  - 머리 끝을 깎은 모든 이들
  - 관자놀이를 깎는 모든 이들
  lexicon: HALOT
  rationale: 머리의 ‘가장자리/모서리’를 뜻하는 구체적 이미지를 살리면서, 특정 민족 관습을 단정하지 않도록 과도한 해석을 피했습니다.
- source_word: עֲרֵלִים / עַרְלֵי לֵב
  english_pob_choice: uncircumcised / uncircumcised in heart
  chosen_korean: 할례받지 못하였고 / 마음에 할례받지 못하였기 때문입니다
  alternatives_korean:
  - 무할례자이고 / 마음이 무할례이기 때문입니다
  - 마음이 완고하고 / 마음이 완고하기 때문입니다
  lexicon: HALOT
  rationale: 언약 표지인 할례를 심장/내면에까지 확장한 원문의 대조를 유지하기 위해, 통상적 도덕어인 ‘완고하다’로 풀지 않고 같은 이미지를 반복해 번역했습니다.
theological_decisions:
- issue: ‘할례받지 못하였음’의 비유적 의미 보존
  chosen_reading: 외적 언약 표지의 부재를 내적 상태로 확장하는 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘영적으로 할례받지 못했다’로 의역함
  - ‘완고하다’로 의미를 설명함
  rationale: 본문은 민족적·언약적 정체성을 ‘할례’ 이미지로 고발합니다. 이를 설명문으로 풀면 선지서의 날카로운 수사와 집단 전체에 대한 심판 선언의 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 심판 대상 열거의 어조
  chosen_reading: ‘~에게 임하리니’로 정리해 열거 뒤에 심판이 닥치는 구조를 드러냈습니다.
  alternative_readings:
  - ‘~을 향하여’로 직역함
  - ‘~에 대하여’로 직역함
  rationale: 히브리어 전치사 עַל의 대립·심판 뉘앙스를 한국어 합쇼체에서 자연스럽게 전달하기 위한 선택입니다.
  doctrine_reference: Translation philosophy §2, §5
