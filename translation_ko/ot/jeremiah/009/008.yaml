source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה לֹֽא אֶפְקָד בָּ֖/ם נְאֻם יְהוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/008.yaml
  text: Shall I not punish them for these things? declares Yahweh[a]. Shall my soul not avenge itself on a nation such as this?
  footnotes:
  - marker: a
    text: Hebrew 'my soul,' an anthropopathic expression; alternatively, 'I myself' or 'my being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들 때문에 내가 그들을 벌하지 않겠느냐? 야훼의 말씀이니라. 이런 백성 같은 나라에 내 영혼이 스스로 보복하지 않겠느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내 영혼’은 하나님을 인간적으로 묘사한 표현입니다. 또는 ‘나 자신’이나 ‘내 존재’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקָד
  english_pob_choice: Shall I not punish them for these things?
  chosen_korean: 이런 일들 때문에 내가 그들을 벌하지 않겠느냐?
  alternatives_korean:
  - 이런 일들에 대해 내가 그들을 징벌하지 않겠느냐?
  - 이런 일들로 내가 그들을 처벌하지 않겠느냐?
  lexicon: HALOT
  rationale: 질문형 수사법과 פקד의 사법적 의미를 살리되, 현대 한국어에서는 ‘벌하다’가 심판 맥락을 자연스럽게 전달합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언이니라
  lexicon: HALOT
  rationale: 예언자적 공식은 한국어에서 ‘말씀이니라’로 압축해 전달하되, 신명은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: תִתְנַקֵּם נַפְשִׁי
  english_pob_choice: Shall my soul not avenge itself
  chosen_korean: 내 영혼이 스스로 보복하지 않겠느냐
  alternatives_korean:
  - 내 영혼이 스스로 복수하지 않겠느냐
  - 내가 스스로 보복하지 않겠느냐
  lexicon: HALOT
  rationale: נפש의 문자적 이미지를 살려 ‘내 영혼’을 유지했고, Hitpael의 반사적 뉘앙스는 ‘스스로’로 드러냈습니다. ‘보복하다’는 נקם의 강한 응보 의미를 가장 직접적으로 담습니다.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  english_pob_choice: on a nation such as this
  chosen_korean: 이런 백성 같은 나라
  alternatives_korean:
  - 이런 나라 같은 민족
  - 이와 같은 나라
  lexicon: HALOT
  rationale: גוֹי의 공동체적·민족적 뉘앙스를 살리면서도, 문맥의 대상이 되는 집단을 한국어로 자연스럽게 보이도록 ‘백성 같은 나라’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 자기지시를 나타내는 נַפְשִׁי의 보존
  chosen_reading: 내 영혼이 스스로 보복하지 않겠느냐
  alternative_readings:
  - 내가 스스로 보복하지 않겠느냐
  - 내 존재가 스스로 보복하지 않겠느냐
  rationale: 인간적 감정어를 하나님께 적용하는 성서적 수사(인간화)를 평탄화하지 않기 위해 ‘내 영혼’을 유지했습니다. 이는 원문의 긴장과 표현력을 보존합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
