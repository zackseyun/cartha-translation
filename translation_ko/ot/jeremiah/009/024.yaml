  rationale: 본문은 외적 할례만을 지닌 상태를 심판하는 날을 선포하므로, 해석을 너무 풀지 않고 역설 자체를 드러내는 표현을 택했습니다.
  doctrine_reference: 원문 우선, 본문이 유지하는 언약적 긴장 보존
