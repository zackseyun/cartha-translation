id: JER.9.12
reference: Jeremiah 9:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/012.yaml
  text: And Yahweh said[a], "Because they have forsaken my law that I set before them[b], and have not obeyed my voice or walked in it,"
  footnotes:
  - marker: a
    text: Or "my instruction." The Hebrew torah can denote instruction broadly, though here it carries covenantal force.
    reason: lexical_alternative
  - marker: b
    text: Or "have not obeyed my voice." The Hebrew idiom "listen to my voice" often includes the sense of obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다. “그들이 내가 그들 앞에 둔 나의 율법[a]을 버리고, 내 음성을 듣지 않았으며[b], 그에 따라 살지 않았기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나의 가르침.” 히브리어 ‘토라’는 폭넓게 가르침을 뜻할 수 있지만, 여기서는 언약적 의미가 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내 음성에 순종하지 않았으며.” 히브리어 ‘내 음성을 듣다’는 종종 순종의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 언약명은 학술적 음역인 ‘야훼’로 옮겨, 본문의 신적 주체를 분명히 드러냈습니다.
- source_word: תּוֹרָתִי
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 교훈
  - 내 가르침
  lexicon: HALOT
  rationale: 예레미야 문맥에서 תּוֹרָה는 단순한 지시보다 언약적 규범의 힘이 강하므로, ‘율법’이 그 무게를 더 잘 보존합니다.
- source_word: שָׁמְעוּ בְקוֹלִי
  english_pob_choice: have not listened to my voice
  chosen_korean: 내 음성을 듣지 않았으며
  alternatives_korean:
  - 내 음성에 순종하지 않았으며
  - 내 음성을 듣지 않았고
  lexicon: HALOT
  rationale: 히브리어는 ‘듣다’와 ‘순종하다’의 의미장을 함께 가질 수 있으므로, 본문은 해석을 과도하게 좁히지 않고 ‘내 음성을 듣지’로 옮겼습니다.
- source_word: וְלֹא הָלְכוּ בָהּ
  english_pob_choice: or walked in it
  chosen_korean: 그 안에서 걷지 않았으며
  alternatives_korean:
  - 그것을 따르지 않았으며
  - 그 길로 행하지 않았으며
  lexicon: HALOT
  rationale: הלך ב의 비유적 표현을 살려, 율법을 따라 사는 지속적 행위를 ‘그 안에서 걷다’로 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 하나님의 언약적 발화를 전하므로, 고유한 언약명 자체를 드러내는 번역이 신학적 식별을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (consistent key terms with documented exceptions)
- issue: שׁמע의 의미 범위
  chosen_reading: 내 음성을 듣지 않았으며
  alternative_readings:
  - 내 음성에 순종하지 않았으며
  rationale: 이 표현은 문맥상 불순종을 함축하지만, मुख्य 번역에서는 그 함의를 곧바로 풀어쓰기보다 히브리어의 ‘듣다’ 이미지를 남겨 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
