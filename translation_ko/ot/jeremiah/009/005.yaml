id: JER.9.5
reference: Jeremiah 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁבְתְּ/ךָ֖ בְּ/ת֣וֹךְ מִרְמָ֑ה בְּ/מִרְמָ֛ה מֵאֲנ֥וּ דַֽעַת אוֹתִ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/005.yaml
  text: Your dwelling is in the midst of deceit[a]; through deceit they refuse to know me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Hebrew shifts from singular ('your dwelling') to plural ('they refuse'), likely addressing the people or city as a whole and then its inhabitants.
    reason: lexical_alternative
  - marker: b
    text: Or 'by deceit they have refused to know me.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신의 거처는 속임수의 한가운데에 있습니다[a]. 그들은 속임수로 나를 알기를 거부합니다[b] — 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞절에서 단수로 ‘당신의 거처’를 말하다가, 여기서는 복수 동사로 ‘그들은’이라고 말합니다. 이는 백성 전체를 집합적으로 부르다가 그 거민들을 가리키는 전형적인 예언문 전환일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 속임수로 나를 알기를 거절합니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְתְּךָ
  english_pob_choice: Your dwelling
  chosen_korean: 당신의 거처
  alternatives_korean:
  - 당신의 dwelling
  - 당신의 주거
  - 당신의 거주지
  lexicon: HALOT
  rationale: ישׁב 계열의 명사형을 자연스러운 현대 한국어로 옮기되, 단순한 ‘앉음’이 아니라 공동체의 상징적 거주지를 가리키는 뜻을 살려 ‘거처’로 렌더링했습니다.
- source_word: בְּתוֹךְ מִרְמָה
  english_pob_choice: in the midst of deceit
  chosen_korean: 속임수의 한가운데에
  alternatives_korean:
  - 속임수 가운데에
  - 속임수 안에
  - 속임수 속에
  lexicon: HALOT
  rationale: בְּתוֹךְ는 단순한 위치보다 둘러싸인 상태를 강조하므로, ‘한가운데에’로 밀도를 살렸습니다.
- source_word: מִרְמָה
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 거짓
  - 속임
  lexicon: HALOT
  rationale: מִרְמָה의 도덕적·관계적 뉘앙스를 한국어에서 가장 자연스럽게 전달하는 기본어로 ‘속임수’를 선택했습니다.
- source_word: מֵאֲנ֥וּ דַעַת אוֹתִי
  english_pob_choice: they refuse to know me
  chosen_korean: 그들은 ... 나를 알기를 거부합니다
  alternatives_korean:
  - 그들은 ... 나를 알기를 마다합니다
  - 그들은 ... 나를 알기 싫어합니다
  - 그들은 ... 나를 아는 것을 거부합니다
  lexicon: HALOT
  rationale: מֵאֲנוּ는 단순한 무지보다 의지적 거부를 뜻하므로 ‘거부합니다’로 옮겼고, דַעַת는 관계적 ‘알다’의 직접성을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: 예언문 종결 공식 נְאֻם יְהוָה를 현대 한국어의 예언적 종결 표현으로 옮기되, 본 프로젝트 기준에 따라 신적 이름은 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 문장 내 수의 전환(단수 주소 → 복수 서술)
  chosen_reading: 단수형 ‘당신의 거처’와 복수형 ‘그들은 ... 거부합니다’의 전환을 유지했습니다.
  alternative_readings:
  - 전부 단수로 평탄화
  - 전부 복수로 평탄화
  rationale: 히브리어의 집합적 주소와 복수 서술의 긴장을 그대로 드러내는 편이 예언문 특유의 수사와 대상 지칭을 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
- issue: 직접 인용 없는 예언 공식의 종결 방식
  chosen_reading: ‘야훼의 말씀입니다’로 종결했습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 선언입니다’
  rationale: נְאֻם formula의 선포적 어조를 한국어 공용문체로 전달하면서도, 본문의 엄숙함을 유지하는 표현입니다.
  doctrine_reference: POB style on prophetic speech formulas
