    text: 히브리어는 ‘네 거처’라는 단수 표현에서 ‘그들은’이라는 복수 동사로 전환합니다. 이는 백성 전체 또는 도시를 집합적으로 부른 뒤 그 거민들을 가리키는 예언문 특유의 전환일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 속임수 가운데서 나를 알기를 거부합니다.’
    reason: alternative_reading
