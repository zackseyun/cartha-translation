id: JER.32.43
reference: Jeremiah 32:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִקְנָ֥ה הַ/שָּׂדֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים שְׁמָמָ֥ה הִיא֙ מֵ/אֵ֤ין אָדָם֙ וּ/בְהֵמָ֔ה נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/043.yaml
  text: Fields will be bought in this land of which you say[a], ‘It is a desolation, without man or beast[b]; it has been given into the hand of the Chaldeans.’
  footnotes:
  - marker: a
    text: Or 'without human or animal.' The Hebrew idiom literally reads 'without man or beast.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''the Babylonians.'' Hebrew: ''the Chaldeans.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이 땅에서 밭이 다시 사들여질 것입니다. 여러분이 말하기를 “그것은 황폐한 곳이요, 사람도 짐승도 없으며[a], 갈대아 사람들의 손에 넘겨졌습니다”라고 하는 바로 그 땅입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람도 짐승도 없는’이라는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아 사람들’은 히브리어 원문의 표현이며, 다른 번역 전통에서는 ‘바빌로니아 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְנָה
  english_pob_choice: will be bought
  chosen_korean: 다시 사들여질 것입니다
  alternatives_korean:
  - 사들여질 것입니다
  - 구매될 것입니다
  lexicon: HALOT
  rationale: נִקְנָה의 수동적 완료/미래적 의미를 살리되, 본문 전후가 포로기 이후 회복과 토지 거래의 재개를 말하므로 한국어에서는 ‘다시’로 그 문맥적 함의를 반영했습니다.
- source_word: הַשָּׂדֶה
  english_pob_choice: Fields
  chosen_korean: 밭이
  alternatives_korean:
  - 들판이
  - 토지가
  lexicon: HALOT
  rationale: 히브리어 단수 정관사 형태이지만 집합적으로 쓰인 토지 표현으로 보이므로, 문맥에 맞는 구체적 단위인 ‘밭’으로 옮겼습니다.
- source_word: מֵאֵין אָדָם וּבְהֵמָה
  english_pob_choice: without man or beast
  chosen_korean: 사람도 짐승도 없으며
  alternatives_korean:
  - 사람도 가축도 없으며
  - 인간도 동물도 없으며
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻을 자연스러운 한국어로 풀되, ‘אָדָם’를 단순 중성화하지 않고 원문의 병렬 감각을 살렸습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들의 손에 넘겨졌습니다
  alternatives_korean:
  - 갈대아 사람들의 손에 주어졌습니다
  - 바빌로니아 사람들의 손에 넘겨졌습니다
  lexicon: HALOT
  rationale: 원문 어휘를 따라 ‘갈대아 사람들’을 유지했고, בְּיַד는 관용적으로 ‘손에’로 옮겨 지배/점유의 의미를 드러냈습니다.
theological_decisions:
- issue: 관용구 מֵאֵין אָדָם וּבְהֵמָה의 번역에서 ‘אָדָם’의 처리
  chosen_reading: 사람도 짐승도 없으며
  alternative_readings:
  - 인간도 동물도 없으며
  - 아무도 없고 짐승도 없으며
  rationale: 이 표현은 심판/황폐의 정형구이므로, 성중립적 재구성보다 원문의 관용성과 대조 구조를 보존하는 쪽이 더 source-direct합니다.
  doctrine_reference: 'POB 번역 원칙: source-direct, 관용구 보존, gender-accurate over gender-neutral'
- issue: ‘다시’의 처리
  chosen_reading: 다시 사들여질 것입니다
  alternative_readings:
  - 사들여질 것입니다
  - 또 사들여질 것입니다
  rationale: 히브리어 단어 자체에는 ‘다시’가 없지만, 앞뒤 문맥(vv. 42–44)이 회복과 재거래를 분명히 전제하므로 문맥적 의미를 한국어로 명시했습니다.
  doctrine_reference: '문맥적 추론 허용 범위: English POB audit trail의 discourse implication 반영'
