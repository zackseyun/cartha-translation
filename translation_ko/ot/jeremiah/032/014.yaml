  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָק֣וֹחַ אֶת הַ/סְּפָרִ֣ים הָ/אֵ֡לֶּה אֵ֣ת סֵפֶר֩ הַ/מִּקְנָ֨ה הַ/זֶּ֜ה וְ/אֵ֣ת הֶ/חָת֗וּם וְ/אֵ֨ת סֵ֤פֶר הַ/גָּלוּי֙ הַ/זֶּ֔ה וּ/נְתַתָּ֖/ם בִּ/כְלִי חָ֑רֶשׂ לְמַ֥עַן יַעַמְד֖וּ יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/014.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Take these documents, this deed of purchase, both the sealed copy and this open copy, and put them in an earthenware vessel[b], so that they may last for many days.'
  footnotes:
  - marker: a
    text: Or 'these scrolls.' The Hebrew term can refer broadly to written documents; in this context they are legal transaction records.
    reason: lexical_alternative
  - marker: b
    text: Or 'this unsealed document' for 'this open copy.' The Hebrew contrasts an open document with the sealed one.
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “이 문서들을, 곧 이 매매 증서, 곧 봉인된 것과 이 열린 것을 가져다가, 질그릇 그릇에 넣어 두어라. 그러면 여러 날 동안 보존될 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 두루마리들’. 히브리어는 넓게는 문서들을 가리킬 수 있으나, 여기서는 법률 거래 기록입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘봉인되지 않은 문서’. 히브리어는 봉인된 문서와 열린 문서를 대조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh of hosts, the God of Israel
  chosen_korean: 만군의 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 만군의 주님, 이스라엘의 하나님
  - 만군의 여호와, 이스라엘의 하나님
  lexicon: WLC + project default
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로, צְבָאוֹת은 하나님의 군대/권세를 나타내는 관용구로서 만군의로 옮겼습니다.
- source_word: הַסְּפָרִים הָאֵלֶּה
  english_pob_choice: these documents
  chosen_korean: 이 문서들을
  alternatives_korean:
  - 이 두루마리들을
  - 이 서류들을
  lexicon: HALOT
  rationale: סְפָרִים는 문서 일반을 가리킬 수 있으므로, 법적 거래 기록이라는 문맥을 살려 문서들을로 번역했습니다.
- source_word: סֵפֶר הַמִּקְנָה
  english_pob_choice: this deed of purchase
  chosen_korean: 이 매매 증서
  alternatives_korean:
  - 이 구입 증서
  - 이 매입 문서
  lexicon: HALOT
  rationale: 소유권 이전을 담은 법률 문서이므로, 현대 한국어 법률 감각에 맞는 매매 증서로 옮겼습니다.
- source_word: הֶחָתוּם / סֵפֶר הַגָּלוּי
  english_pob_choice: the sealed copy / this open copy
  chosen_korean: 봉인된 것과 이 열린 것
  alternatives_korean:
  - 봉인된 사본과 이 열린 사본
  - 봉인된 문서와 이 공개된 문서
  lexicon: HALOT
  rationale: 히브리어는 앞의 문서를 가리키며 봉인된 것과 열린 것을 대조하므로, ‘사본’을 덧붙이기보다 지시성을 살렸습니다.
- source_word: בִּכְלִי חָרֶשׂ
  english_pob_choice: in an earthenware vessel
  chosen_korean: 질그릇 그릇에
  alternatives_korean:
  - 질그릇에
  - 토기 그릇에
  lexicon: HALOT
  rationale: חרשׂ는 구운 점토 용기를 뜻하므로 질그릇으로 옮겼고, כלי는 용기의 뜻을 드러내기 위해 그릇을 덧붙였습니다.
- source_word: יַעַמְדוּ יָמִים רַבִּים
  english_pob_choice: they may last for many days
  chosen_korean: 여러 날 동안 보존될 것이다
  alternatives_korean:
  - 오랫동안 남아 있을 것이다
  - 오랜 날들을 견딜 것이다
  lexicon: HALOT
  rationale: 직역의 ‘서다’보다 문서 보관의 결과를 드러내는 보존되다를 사용해 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 야훼 명칭의 표기
  chosen_reading: 본문의 יְהוָה는 야훼로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트의 기본 용례를 따라 언약 이름을 보존했고, 한국어 교회 전통의 대체 표기를 피했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 명령문과 직접 인용의 문체
  chosen_reading: 직접 화법 안에서는 명령형을 유지하되, 본문 서술은 합쇼체로 처리했습니다.
  alternative_readings:
  - 전체를 평서형으로 통일
  - 직접 화법까지 전부 높임말로 처리
  rationale: 히브리어 원문은 직접 명령을 포함하므로, 화자의 권위를 살리면서도 한국어 독자에게 자연스럽게 들리도록 구분했습니다.
  doctrine_reference: Source discourse structure
