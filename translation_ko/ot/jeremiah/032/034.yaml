id: JER.32.34
reference: Jeremiah 32:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשִׂ֣ימוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/034.yaml
  text: They put their detestable things in the house that is called by my name[b][a], to defile it.
  footnotes:
  - marker: a
    text: Or 'in the temple.' The Hebrew reads 'in the house,' referring here to the house called by God's name.
    reason: lexical_alternative
  - marker: b
    text: Or 'their abominations.' The Hebrew term often refers to detestable, especially idolatrous, objects or practices.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 이름으로 불리는 그 집에 자기들의 혐오스러운 것들을 두어 그것을 더럽혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '성전에.' 히브리어는 문자적으로 '집에'라고 하며, 여기서는 하나님의 이름으로 불리는 그 집을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '그들의 가증한 것들.' 히브리어 용어는 흔히 특히 우상숭배와 관련된 혐오스러운 대상이나 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  english_pob_choice: They put
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 두었습니다
  lexicon: HALOT
  rationale: 서술형 과거를 자연스럽게 살리면서, העמד/שים의 구체적 행위를 한국어로 평이하게 전달합니다.
- source_word: שִׁקּוּצֵיהֶם
  english_pob_choice: their detestable things
  chosen_korean: 자기들의 혐오스러운 것들
  alternatives_korean:
  - 자기들의 가증한 것들
  - 그들의 혐오스러운 것들
  - 그들의 우상들
  lexicon: HALOT
  rationale: 직역하면 '가증한 것들'도 가능하지만, 현대 한국어에서 의미가 덜 투명하므로 부정적·우상숭배적 뉘앙스를 유지하는 '혐오스러운 것들'을 택했습니다.
- source_word: בַּבַּיִת
  english_pob_choice: in the house
  chosen_korean: 그 집에
  alternatives_korean:
  - 그 집 안에
  - 성전에
  lexicon: HALOT
  rationale: 본문의 문자적 표현인 '집'을 유지하되, 문맥상 성전을 가리키는 점은 뒤의 '내 이름으로 불리는' 구문이 드러내게 했습니다.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  english_pob_choice: that is called by my name
  chosen_korean: 내 이름으로 불리는
  alternatives_korean:
  - 내 이름이 불린
  - 내 이름이 그 위에 있는
  - 내 이름이 붙은
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기면서, 소유·거룩하게 구별됨의 뉘앙스를 유지했습니다.
- source_word: לְטַמְּאֹו
  english_pob_choice: to defile it
  chosen_korean: 그것을 더럽혔습니다
  alternatives_korean:
  - 그것을 부정하게 하려고
  - 그것을 더럽히려고
  lexicon: HALOT
  rationale: 목적 부정사를 문맥상 결과를 포함한 서술로 옮겨, 성소 오염의 무게를 현대어로 분명하게 드러냈습니다.
theological_decisions:
- issue: בַּבַּיִת를 '집'으로 보존할지 '성전'으로 풀어쓸지
  chosen_reading: '''집''을 유지하되 문맥으로 성전임을 드러내는 방식'
  alternative_readings:
  - 성전
  - 성전집
  rationale: 히브리어의 문자적 표현을 보존하면서도, '내 이름으로 불리는' 구문이 성전 맥락임을 충분히 밝혀 주므로 본문 과잉해석을 피했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 문맥 기반 함축 보존
