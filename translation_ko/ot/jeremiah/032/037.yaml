revisions:
- from: 보십시오. 내가 그들을 내가 분노하며, 진노하며, 큰 격분으로 쫓아냈던 모든 땅에서 모아 이곳으로 다시 데려오고, 안전하게 살게 하겠습니다.[a]
  to: 보십시오. 내가 내 분노와 내 진노와 큰 노여움으로 그들을 쫓아냈던 모든 땅에서 그들을 모으겠습니다.[a] 내가 그들을 이곳으로 다시 데려와 안전하게 살게 하겠습니다.
  rationale: 히브리어의 강조 선언 הִנְנִי를 ‘보십시오’로 유지하고, 뒤따르는 분사는 한국어의 자연스러운 예언적 미래인 ‘모으겠습니다’로 옮겼습니다. 추방의 세 심판 표현은 원문의 전치사구를 따라 명사구로 유지했으며, 귀환과 안전한 거주의 사역적 약속도 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:18Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 추방·귀환·안전한 거주의 기본 의미를 전반적으로 담고 있습니다. 그러나 ‘모아’는 히브리어의 분사 자체를 적절히 나타내기보다 뒤 절에 종속시키며, 주석의 설명도 이를 정확히 뒷받침하지 못합니다. 또한 ‘분노하며, 진노하며’는 원문의 전치사구(‘내 분노와 내 진노로’)보다 동시 행위로 읽힐 수 있습니다.
  naturalness: ‘큰 격분으로’와 ‘모아 이곳으로 다시 데려오고’는 다소 부자연스럽습니다. ‘큰 노여움으로’ 및 미래 약속을 명시한 병렬 표현이 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: 원문의 세 겹 심판 어휘는 ‘내 분노와 내 진노와 큰 노여움’으로 구별하여 보존할 수 있습니다. ‘안전하게 살게 하겠습니다’는 וְהוֹשַׁבְתִּים לָבֶטַח의 사역적 의미와 안전의 의미를 적절히 전달합니다.
  issues:
  - severity: medium
    issue: ‘모아’와 관련 각주
    rationale: ‘모아’는 한국어 연결형으로서 히브리어 הִנְנִי + 분사의 임박하거나 확정적인 미래 용법을 직접 나타내지 못합니다. 현 각주도 ‘모아’가 그 뉘앙스를 반영한다고 하나, 문법적으로 부정확합니다.
  - severity: medium
    issue: 심판 전치사구의 동사화
    rationale: ‘내가 분노하며, 진노하며’는 하나님이 분노한 상태에서 행위하는 모습은 전달하지만, בְּאַפִּי וּבַחֲמָתִי의 ‘내 분노와 내 진노로’라는 수단·원인의 표현을 약화합니다.
  - severity: low
    issue: ‘큰 격분’의 어감
    rationale: ‘격분’은 현대 한국어에서 다소 어색하고 개인적 감정 폭발의 뉘앙스가 강합니다. ‘큰 노여움’이 קֶצֶף의 뜻과 본문의 엄숙한 문체에 더 잘 맞습니다.
  revised_text: 보십시오. 내가 내 분노와 내 진노와 큰 노여움으로 그들을 쫓아냈던 모든 땅에서 그들을 모으겠습니다.[a] 내가 그들을 이곳으로 다시 데려와 안전하게 살게 하겠습니다.
