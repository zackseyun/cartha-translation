id: JER.32.37
reference: Jeremiah 32:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֤י מְקַבְּצָ/ם֙ מִ/כָּל הָ֣/אֲרָצ֔וֹת אֲשֶׁ֨ר הִדַּחְתִּ֥י/ם שָׁ֛ם בְּ/אַפִּ֥/י וּ/בַ/חֲמָתִ֖/י וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/הֲשִֽׁבֹתִי/ם֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הֹשַׁבְתִּ֖י/ם לָ/בֶֽטַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/037.yaml
  text: Behold[a], I am gathering them from all the lands where I drove them in my anger and in my wrath and in great indignation[b], and I will bring them back to this place and make them dwell in safety.
  footnotes:
  - marker: a
    text: Or, 'Behold, I will gather them.' The Hebrew construction can express imminent or certain future action.
    reason: lexical_alternative
  - marker: b
    text: '''Great indignation'' renders a third Hebrew term for divine anger, preserving the verse''s piling up of judgment language.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 내가 내 분노와 내 진노와 큰 노여움으로 그들을 쫓아냈던 모든 땅에서 그들을 모으겠습니다.[a] 내가 그들을 이곳으로 다시 데려와 안전하게 살게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 모으고 있다.’ 히브리어의 서두 강조구문과 분사는 임박한 미래 또는 확정된 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언 선언의 즉시성과 강조를 살리면서도 현대 합쇼체에서 자연스럽게 들리는 호격적 주의를 전달합니다.
- source_word: מְקַבְּצָם
  english_pob_choice: I am gathering them
  chosen_korean: 내가 그들을 모아
  alternatives_korean:
  - 내가 그들을 모으고
  - 내가 그들을 모으겠습니다
  lexicon: HALOT
  rationale: 진행형의 뉘앙스를 한국어에서 어색하지 않게 살리기 위해 ‘모아’로 연결하되, 뒤의 동사들까지 포함하는 예언적 현재의 긴박함을 유지했습니다.
- source_word: וּבְקֶצֶף גָּדוֹל
  english_pob_choice: and in great indignation
  chosen_korean: 큰 격분으로
  alternatives_korean:
  - 큰 진노로
  - 큰 분노로
  lexicon: HALOT
  rationale: 앞의 ‘분노’와 ‘진노’와 구별되는 세 번째 심판 어휘를 살리기 위해 감정의 강도를 나타내는 ‘격분’으로 옮겼습니다.
theological_decisions:
- issue: עמיד하게 쌓인 하나님의 심판 언어를 한국어에서 어떻게 구분할지
  chosen_reading: ‘분노하며, 진노하며, 큰 격분으로’처럼 세 단계를 분리해 누적된 심판의 어조를 보존했습니다.
  alternative_readings:
  - ‘분노와 진노와 큰 노여움으로’로 평준화
  - ‘크게 노하여’로 통합
  rationale: 히브리어는 거의 동의어를 겹쳐 사용해 추방의 엄중함을 강조합니다. 한국어에서도 의미를 하나로 눌러 버리지 않고 단계적 강도를 드러내는 것이 본문 의도를 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: הִנְנִי + 분사 구조의 시간감
  chosen_reading: ‘보십시오. 내가 그들을 … 모아’로 옮겨, 확정적이고 임박한 행위를 드러냈습니다.
  alternative_readings:
  - ‘보십시오. 내가 그들을 모을 것입니다’
  - ‘보십시오. 내가 그들을 모으고 있습니다’
  rationale: 히브리어 구조는 임박한 미래 또는 확실한 행위를 나타낼 수 있습니다. 한국어에서는 단정적 예언으로 읽히는 현재적 표현을 택하되, 문맥의 확실성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
