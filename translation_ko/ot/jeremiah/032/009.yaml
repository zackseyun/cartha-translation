id: JER.32.9
reference: Jeremiah 32:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָֽ/אֶקְנֶה֙ אֶת הַ/שָּׂדֶ֔ה מֵ/אֵ֛ת חֲנַמְאֵ֥ל בֶּן דֹּדִ֖/י אֲשֶׁ֣ר בַּ/עֲנָת֑וֹת וָֽ/אֶשְׁקֲלָ/ה לּ/וֹ֙ אֶת הַ/כֶּ֔סֶף שִׁבְעָ֥ה שְׁקָלִ֖ים וַ/עֲשָׂרָ֥ה הַ/כָּֽסֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/009.yaml
  text: 'So I bought the field from Hanamel the son of my uncle[a], who was at Anathoth[b], and I weighed out the silver to him: seventeen shekels of silver.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'seven shekels and ten silver.' This is commonly understood as 'seventeen shekels of silver.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from Hanamel, my cousin, who was in Anathoth.' The Hebrew more literally says 'Hanamel the son of my uncle, who was in Anathoth.'
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 내가 하남엘—내 숙부의 아들인데, 아나돗에 있는—에게서 그 밭을 사고, 그에게 은 열일곱 세겔을 달아 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘일곱 세겔과 열 은’이라고 되어 있습니다. 통상 ‘은 열일곱 세겔’로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하남엘, 내 사촌, 아나돗에 있는 자에게서’로도 옮길 수 있습니다. 히브리어는 더 문자적으로 ‘내 숙부의 아들, 아나돗에 있는 하남엘’이라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְנֶה
  english_pob_choice: So I bought
  chosen_korean: 그래서 내가 ... 샀습니다
  alternatives_korean:
  - 그리고 내가 ... 샀습니다
  - 그리하여 내가 ... 샀습니다
  lexicon: HALOT
  rationale: קנה의 서술적 완료를 자연스러운 과거 서술로 옮기되, 앞선 문맥의 흐름을 살려 ‘그래서’로 연결했습니다.
- source_word: בֶּן דֹּדִי
  english_pob_choice: the son of my uncle
  chosen_korean: 내 숙부의 아들
  alternatives_korean:
  - 내 삼촌의 아들
  - 내 사촌
  lexicon: HALOT
  rationale: 히브리어의 친족 관계를 직역해 ‘사촌’으로 완화하지 않고, 관계의 구체성을 보존했습니다.
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  english_pob_choice: who was at Anathoth
  chosen_korean: 아나돗에 있는
  alternatives_korean:
  - 아나돗에 있던
  - 아나돗에 거주하던
  lexicon: HALOT
  rationale: 부동산 거래 맥락에서 위치 표지가 중요하므로, ‘아나돗에 있는’으로 간결하게 처리했습니다.
- source_word: וָאֶשְׁקֲלָה לוֹ אֶת הַכֶּסֶף
  english_pob_choice: and I weighed out the silver to him
  chosen_korean: 그에게 은 ... 을 달아 주었습니다
  alternatives_korean:
  - 그에게 은을 지불했습니다
  - 그에게 돈을 달아 주었습니다
  lexicon: HALOT
  rationale: שקל의 구체적 상거래 관용을 살려 단순한 ‘지불하다’보다 ‘달아 주다’로 옮겼고, כסף의 물질성을 ‘은’으로 보존했습니다.
- source_word: שִׁבְעָה שְׁקָלִים וַעֲשָׂרָה
  english_pob_choice: seventeen shekels of silver
  chosen_korean: 은 열일곱 세겔
  alternatives_korean:
  - 일곱 세겔과 열 세겔의 은
  - 열일곱 세겔의 은
  lexicon: HALOT
  rationale: 히브리어의 관용적 수량 표현을 한국어에서 통용되는 자연스러운 액수로 풀되, 단위는 ‘세겔’로 유지했습니다.
theological_decisions:
- issue: 토지 매입과 금전 지불의 서술 방식
  chosen_reading: 예레미야의 행위가 실제 거래로 제시되도록, 추상화하지 않고 ‘샀습니다’와 ‘달아 주었습니다’로 구체적 상행위성을 드러냈습니다.
  alternative_readings:
  - ‘구입했습니다’
  - ‘돈을 지급했습니다’
  rationale: 본문은 상징적 행위이지만 그 상징은 실제 거래 행위를 통해 구현되므로, 행위의 역사성과 물질성을 약화시키지 않는 번역이 적절합니다.
  doctrine_reference: 예레미야 32장의 표징 행위 맥락
- issue: 친족 호칭의 직역
  chosen_reading: ‘내 숙부의 아들’로 옮겨, 관계를 일반화한 ‘사촌’ 대신 원문이 말하는 친족 구조를 유지했습니다.
  alternative_readings:
  - ‘사촌’
  - ‘삼촌의 아들’
  rationale: 예언적 기록에서 법적·가족적 관계는 의미를 형성하므로, 현대어의 편의보다 원문의 명시성을 우선했습니다.
  doctrine_reference: 본문의 서사적·법적 정확성
