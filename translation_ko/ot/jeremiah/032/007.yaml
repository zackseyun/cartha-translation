revisions:
- from: 보십시오, 사밈의 아들 하나멜, 곧 당신의 숙부가 당신에게 와서 이렇게 말할 것입니다. “내 밭, 곧 아나돗에 있는 그 밭을 사십시오. 그것을 사는 구속의 권리가 당신에게 있기 때문입니다.”[a]
  to: 보십시오, 당신의 삼촌 살룸의 아들 하나멜이 당신에게 와서 이렇게 말할 것입니다. “아나돗에 있는 내 밭을 사십시오. 그 밭을 살 구속권[a]이 당신에게 있기 때문입니다.”
  rationale: 살룸의 이름과 하나멜의 친족 관계를 히브리어 문장 구조에 맞게 바로잡았습니다. ‘삼촌’은 דּוֹד의 일반적인 ‘uncle’ 의미를 보존하면서 특정한 부계 관계를 불필요하게 확정하지 않습니다. ‘구속권’은 토지의 친족-법적 되찾음이라는 גְּאֻלָּה의 의미를 유지하며, 각주가 그 의미를 분명히 합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft substantially represents the announcement and the land-redemption right, but it misidentifies Hanamel as the son of ''사밈'' rather than Shallum (살룸), and reverses the source relationship: Hanamel is Jeremiah''s uncle, not Jeremiah''s uncle''s son. The participle ''is coming'' is appropriately conveyed as an imminent future in Korean.'
  naturalness: The revised wording uses natural modern formal-polite Korean. '삼촌' avoids specifying a paternal uncle, which the Hebrew term does not require, while retaining the kinship sense required by the context.
  terminology: '''구속권'' retains the established legal-kinship force of גאולה without spiritualizing it. The footnote explicitly identifies this as the right of a relative to redeem family land. ''살룸,'' ''하나멜,'' and ''아나돗'' are standard, recognizable Korean biblical name forms.'
  issues:
  - severity: high
    issue: The personal name '사밈' does not represent שַלּוּם (Shallum).
    rationale: The Hebrew identifies Hanamel as 'the son of Shallum'; the name should be rendered 살룸.
  - severity: high
    issue: The kinship syntax is reversed in '사밈의 아들 하나멜, 곧 당신의 숙부'.
    rationale: The Hebrew apposition identifies Hanamel himself as 'your uncle.' It does not identify Shallum as Jeremiah's uncle. Korean must make Hanamel the uncle while retaining Shallum as his father.
  - severity: low
    issue: The footnote anchor is placed after the whole quotation rather than at the legal term it explains.
    rationale: Placing the marker directly after '구속권' gives a clear anchor for the lexical note.
  revised_text: 보십시오, 당신의 삼촌 살룸의 아들 하나멜이 당신에게 와서 이렇게 말할 것입니다. “아나돗에 있는 내 밭을 사십시오. 그 밭을 살 구속권[a]이 당신에게 있기 때문입니다.”
  revised_footnotes:
