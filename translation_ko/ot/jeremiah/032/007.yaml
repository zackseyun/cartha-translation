  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֣ה חֲנַמְאֵ֗ל בֶּן שַׁלֻּם֙ דֹּֽדְ/ךָ֔ בָּ֥א אֵלֶ֖י/ךָ לֵ/אמֹ֑ר קְנֵ֣ה לְ/ךָ֗ אֶת שָׂדִ/י֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת כִּ֥י לְ/ךָ֛ מִשְׁפַּ֥ט הַ/גְּאֻלָּ֖ה לִ/קְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/007.yaml
  text: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
  footnotes:
  - marker: a
    text: Or 'the legal right of redemption' or 'the right of repurchase.' The Hebrew refers to the kinship-based right to redeem family property.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 사밈의 아들 하나멜, 곧 당신의 숙부가 당신에게 와서 이렇게 말할 것입니다. “내 밭, 곧 아나돗에 있는 그 밭을 사십시오. 그것을 사는 구속의 권리가 당신에게 있기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구속의 권리’는 가족 토지를 되찾는 친족법상의 권리를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 발화의 즉시성과 주의를 환기하는 감탄사로서 현대 합쇼체에 가장 자연스럽고, 명령형의 직접성을 유지합니다.
- source_word: דֹּדְךָ
  english_pob_choice: your uncle
  chosen_korean: 당신의 숙부
  alternatives_korean:
  - 당신의 삼촌
  - 당신의 사랑하는 사람
  lexicon: HALOT
  rationale: 문맥이 친족 토지 구속 규정이므로 '사랑하는 사람'이 아니라 친족 관계인 '숙부'로 옮겨 의미를 분명히 했습니다.
- source_word: מִשְׁפַּט הַגְּאֻלָּה
  english_pob_choice: the right of redemption
  chosen_korean: 구속의 권리
  alternatives_korean:
  - 구속권
  - 되살 권리
  - 법적 구속권
  lexicon: HALOT
  rationale: 미쉬파트의 법적 성격과 게울라의 친족-토지 환원 개념을 함께 살리기 위해, 간결한 법률 표현인 '구속의 권리'를 택했습니다.
- source_word: לִקְנוֹת־־
  english_pob_choice: to buy it
  chosen_korean: 그것을 사는
  alternatives_korean:
  - 그것을 구입하는
  - 그것을 사기 위한
  lexicon: HALOT
  rationale: 히브리어 부정사구가 앞의 '권리'를 설명하므로 한국어에서는 자연스럽게 관형절로 풀어 '그것을 사는'으로 옮겼습니다.
theological_decisions:
- issue: 토지 구속(גְּאֻלָּה)의 의미를 어떻게 유지할 것인가
  chosen_reading: 이를 영적 '구원'으로 일반화하지 않고, 친족이 가족 토지를 되찾는 법적·언약적 권리로 옮겼습니다.
  alternative_readings:
  - 구원
  - 되찾음
  - 매입권
  rationale: 본문은 예레미야의 밭 매입을 둘러싼 친족 구속 규정에 관한 것이므로, 후대의 영적 의미를 덧씌우지 않으면서도 법적 의미를 드러내야 합니다.
  doctrine_reference: 레위기 25장 친족 구속 규정; 예레미야 32장 문맥
