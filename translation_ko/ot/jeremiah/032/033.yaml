  lexicon: HALOT
  rationale: עֹרֶף/פָנִים의 대조를 한국어로 자연스럽게 옮기되, 관계적 거부의 뉘앙스를 살려 ‘등을 돌리다’로 표현했습니다.
- source_word: וְלַמֵּד אֹתָם הַשְׁכֵּם וְלַמֵּד
  english_pob_choice: though I taught them, rising early and teaching
  chosen_korean: 내가 그들을 가르쳤으나, 일찍 일어나 가르치면서도
  alternatives_korean:
  - 내가 그들을 가르쳤으나, 부지런히 가르치면서도
  - 내가 그들을 가르쳤으나, 새벽에 일어나 가르치면서도
  lexicon: HALOT
  rationale: 예레미야서의 관용구를 따라 ‘일찍 일어나 가르치다’의 직역성을 유지하되, 앞절에 대한 양보 관계를 한국어 어순으로 드러냈습니다.
- source_word: וְאֵינָם שֹׁמְעִים
  english_pob_choice: they would not listen
  chosen_korean: 그들은 듣지 않아서
  alternatives_korean:
  - 그들은 들으려 하지 않아서
  - 그들은 듣지 않았습니다
  lexicon: HALOT
  rationale: 단순 과거의 불청취보다 지속적 거부를 드러내기 위해 ‘듣지 않아서’로 옮겼습니다.
- source_word: לָקַחַת מוּסָר
  english_pob_choice: to receive correction
  chosen_korean: 교훈을 받지 않았습니다
  alternatives_korean:
  - 교정을 받지 않았습니다
  - 훈계를 받아들이지 않았습니다
  lexicon: HALOT
  rationale: מוּסָר의 교정/훈계/징계 범위를 고려해, 예언적 책망의 맥락을 살리면서도 한국어에서 자연스러운 ‘교훈’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 반복적으로 가르치셨다는 점과 백성의 완강한 거부
  chosen_reading: ‘일찍 일어나 가르치면서도’로 하나님의 지속적이고 인내로운 경고를 드러내고, 뒤이어 ‘듣지 않아서’로 책임 있는 거부를 유지했습니다.
  alternative_readings:
  - ‘부지런히 가르치면서도’처럼 관용구를 풀어 쓸 수 있음
  - ‘새벽에 일어나 가르치면서도’로 더 직역할 수 있음
  rationale: 본문의 예언자적 비난은 단순 정보 전달이 아니라 반복된 경고를 거부한 언약 백성의 책임을 강조하므로, 관용구를 보존하되 의미를 분명히 했습니다.
  doctrine_reference: 언약적 책임, 예언자적 경고의 반복성
