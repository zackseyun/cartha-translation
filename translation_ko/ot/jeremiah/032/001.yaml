base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/001.yaml
  text: The word that came to Jeremiah from Yahweh in the tenth year of Zedekiah king of Judah[a], which was the eighteenth year of Nebuchadnezzar.
  footnotes:
  - marker: a
    text: Or 'from Yahweh.' The main text follows the project’s default rendering of the divine name as 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 유다 왕 시드기야 제십 년, 곧 느부갓네살 제십팔 년에 야훼께로부터 예레미야에게 말씀이 임하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר / The word
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 일
  lexicon: HALOT
  rationale: 예언서 서두의 정형구에서 דָּבָר는 단순한 ‘말’보다 하나님의 계시를 가리키는 ‘말씀’이 더 자연스럽고, 예언적 문맥의 공적·계시적 성격을 살립니다.
- source_word: מֵאֵת יְהוָה / from Yahweh
  english_pob_choice: from Yahweh
  chosen_korean: 여호와께로부터
  alternatives_korean:
  - 야훼께로부터
  - 주께로부터
  lexicon: HALOT
  rationale: 원문은 기원의 전치사구로 예언의 출처를 밝히며, 한국어 본문에서는 프로젝트 기본값에 맞춰 ‘여호와’로 옮겨 원천적 발화를 분명히 했습니다.
- source_word: ב/שנת הָעֲשִׂרִית / in the tenth year
  english_pob_choice: in the tenth year
  chosen_korean: 열째 해
  alternatives_korean:
  - 열 번째 해
  - 제10년
  lexicon: HALOT
  rationale: 히브리어 연대 공식의 자연스러운 한국어 표현은 ‘열째 해’이며, 왕 연대 문맥을 과도하게 풀지 않고 그대로 살립니다.
- source_word: לְ/צִדְקִיָּהוּ מֶלֶךְ יְהוּדָה / of Zedekiah king of Judah
  english_pob_choice: of Zedekiah king of Judah
  chosen_korean: 유다 왕 시드기야
  alternatives_korean:
  - 유다의 왕 시드기야
  - 시드기야 유다 왕
  lexicon: HALOT
  rationale: 히브리어의 왕호-이름 배열을 한국어에서는 ‘유다 왕 시드기야’로 자연스럽게 정리해, 칭호와 소속을 함께 분명히 했습니다.
- source_word: לִ/נְבוּכַדְרֶאצַּר / of Nebuchadnezzar
  english_pob_choice: of Nebuchadnezzar
  chosen_korean: 느부갓네살의
  alternatives_korean:
  - 느부갓네살의 통치 기간의
  - 느부갓네살의 치세의
  lexicon: HALOT
  rationale: ל- 접두는 여기서 느부갓네살의 재위 연도를 가리키므로 한국어에서는 속격으로 처리해 연대 기준을 분명히 했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 기본 프로젝트 설정과 영어 POB의 본문-주석 구분을 따라 본문에는 ‘여호와’를 두고, 이를 하나님의 고유명칭으로 읽도록 했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH'
