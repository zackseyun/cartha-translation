revisions:
- from: 여호와께로부터 예레미야에게 임한 말씀은 유다 왕 시드기야의 열째 해였는데, 곧 느부갓네살의 열여덟째 해였습니다.[a]
  to: 유다 왕 시드기야 제십 년, 곧 느부갓네살 제십팔 년에 야훼께로부터 예레미야에게 말씀이 임하였습니다.
  rationale: 연대 부사를 문두에 배치하고 ‘말씀이 임하였습니다’라는 예언서의 자연스러운 정형 표현을 사용했습니다. 두 연대가 동일한 해임을 나타내는 ‘곧’을 유지했습니다. 최신 제공 원칙에 따라 신명을 ‘야훼’로 통일했으며, 본문과 중복되고 정책 설명도 불일치하는 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:15Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 예언서 정형구(‘야훼에게서 예레미야에게 임한 말씀’)와 두 왕의 재위 연대 대조를 충실히 반영해야 합니다. 초안의 기본 의미는 맞지만, 신명 표기와 주석이 제공된 최신 원칙 및 본문과 일치하지 않습니다.
  naturalness: ‘…말씀은 … 해였습니다’도 이해되지만, 한국어 예언서 문체에서는 연대를 앞에 두고 ‘말씀이 임하였습니다’라고 하는 편이 더 자연스럽고 문장 관계가 분명합니다.
  terminology: יְהוָה는 제공된 신학적 결정에 따라 ‘야훼’로 옮겼습니다. 예레미야, 시드기야, 느부갓네살은 한국어 성서에서 널리 쓰이는 이름 형태로 유지했습니다.
  issues:
  - severity: medium
    issue: 본문의 신명 표기가 ‘여호와’로 되어 있습니다.
    rationale: 제공된 최신 신학적 결정은 יְהוָה를 ‘야훼’로 표기하도록 명시합니다.
  - severity: high
    issue: 각주가 본문과 맞지 않고, 영어 감사 기록의 신명 정책도 잘못 설명합니다.
    rationale: 각주는 ‘또는 여호와께로부터’라고 하나 본문도 이미 ‘여호와께로부터’이며, ‘기본값에 따라 여호와’라는 설명은 제공된 결정(야훼)과 충돌합니다. 원문에 이 절의 번역 선택을 뒷받침할 별도 이문도 제시되지 않았으므로 삭제하는 것이 안전합니다.
