source:
  edition: WLC
  text: הִנֵּה֙ אֲנִ֣י יְהוָ֔ה אֱלֹהֵ֖י כָּל בָּשָׂ֑ר הֲֽ/מִמֶּ֔/נִּי יִפָּלֵ֖א כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/027.yaml
  text: Behold[a], I am Yahweh, the God of all flesh. Is anything too difficult for me?
  footnotes:
  - marker: a
    text: Or, more literally, 'Will any thing be too wonderful for me?' The Hebrew verb can carry the sense of being extraordinary or beyond one's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 나는 야훼, 모든 육체의 하나님입니다. 내게 너무 어려운 일이 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, “어떤 일이 내게 너무 놀랍겠습니까?” 히브리어 동사 פלא는 ‘비범하다, 놀랍다’ 또는 문맥상 ‘능력으로 감당하기 어렵다’라는 뜻을 낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 하나님의 자기 선언을 여는 주의 환기 표현으로, 고어적이기보다 공적·엄숙한 합쇼체 명령형을 택해 원문의 긴박한 주의를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 규범에 따라 신적 이름은 ‘야훼’로 옮겨 언약적 고유성을 드러냈습니다.
- source_word: אֱלֹהֵי כָּל בָּשָׂר
  english_pob_choice: the God of all flesh
  chosen_korean: 모든 육체의 하나님
  alternatives_korean:
  - 모든 사람의 하나님
  - 모든 인류의 하나님
  lexicon: HALOT
  rationale: ‘all flesh’의 관용구를 좁히지 않고 그대로 살리되, 한국어에서는 ‘육체’가 다소 생소하므로 문맥을 해치지 않는 선에서 직역성을 유지했습니다.
- source_word: יִפָּלֵא
  english_pob_choice: too difficult
  chosen_korean: 너무 어려운
  alternatives_korean:
  - 너무 놀라운
  - 불가능한
  - 내 힘을 벗어난
  lexicon: HALOT
  rationale: 원문 פלא의 ‘놀랍다/감당하기 어렵다/능력을 넘는다’는 범위를 반영해, 본문 문맥상 하나님의 능력을 묻는 질문으로 자연스러운 ‘너무 어려운’으로 옮겼습니다.
theological_decisions:
- issue: ‘all flesh’의 범위
  chosen_reading: ‘모든 육체’로 유지하여 인간만으로 좁히지 않았습니다.
  alternative_readings:
  - 모든 사람
  - 모든 생명체
  rationale: 히브리어 표현의 폭을 보존해 여호와가 모든 연약한 피조성 전체 위에 주권자이심을 드러내려는 선택입니다.
  doctrine_reference: Translation philosophy §1, §5
