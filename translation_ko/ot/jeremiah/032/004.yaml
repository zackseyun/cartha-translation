  text: וְ/צִדְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹ֥א יִמָּלֵ֖ט מִ/יַּ֣ד הַ/כַּשְׂדִּ֑ים כִּ֣י הִנָּתֹ֤ן יִנָּתֵן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/דִבֶּר פִּ֣י/ו עִם פִּ֔י/ו וְ/עֵינָ֖י/ו אֶת עינ/ו תִּרְאֶֽינָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'he will speak with him mouth to mouth,' that is, in direct personal encounter.
    reason: lexical_alternative
  - marker: b
    text: Or more idiomatically, 'his eyes will see his eyes,' that is, he will see him directly, eye to eye.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 시드기야는 칼데아 사람들의 손에서 벗어나지 못할 것입니다. 그는 반드시 바벨론 왕의 손에 넘겨질 것이며, 그와 입을 마주 대고 말할 것이고, 그의 눈은 그의 눈을 볼 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '입에서 입으로'로, 곧 직접 얼굴을 맞대는 개인적 대면을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '그의 눈이 그의 눈을 볼 것입니다'로, 곧 눈과 눈을 마주 보는 직접적 대면을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִמָּלֵט מִיַּד הַכַּשְׂדִים
  english_pob_choice: will not escape from the hand of the Chaldeans
  chosen_korean: 칼데아 사람들의 손에서 벗어나지 못할 것입니다
  alternatives_korean:
  - 칼데아 사람들의 손에서 도망하지 못할 것입니다
  - 칼데아 사람들의 권세에서 벗어나지 못할 것입니다
  lexicon: HALOT
  rationale: יִמָּלֵט의 핵심은 '도망하여 빠져나감'이므로, 현대 한국어에서는 자연스럽고 직접적인 '벗어나지 못하다'로 옮기되 '손'의 구체적 지배 이미지는 유지했습니다.
- source_word: הִנָּתֹן יִנָּתֵן
  english_pob_choice: will surely be given
  chosen_korean: 반드시 ... 넘겨질 것이며
  alternatives_korean:
  - 반드시 ... 주어질 것이며
  - 틀림없이 ... 넘겨질 것이며
  lexicon: HALOT
  rationale: 부정사 절대형과 동사형의 강조를 한국어 부사 '반드시'로 살리고, 수동의 의미를 살려 '넘겨지다'를 선택했습니다.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  english_pob_choice: into the hand of the king of Babylon
  chosen_korean: 바벨론 왕의 손에
  alternatives_korean:
  - 바벨론 왕의 권세에
  - 바벨론 왕에게
  lexicon: HALOT
  rationale: '''손에''는 지배·처분의 관용구를 가장 직접적으로 보존하므로 그대로 살렸습니다.'
- source_word: וְדִבֶּר פִּיו עִם פִּיו
  english_pob_choice: he will speak mouth to mouth with him
  chosen_korean: 그와 입을 마주 대고 말할 것이고
  alternatives_korean:
  - 그와 입에서 입으로 말할 것이고
  - 그와 직접 만나 말할 것이고
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지가 매우 구체적이므로 뜻은 드러내되, 한국어에서는 자연스러운 관용 표현으로 직접 대면의 의미를 살렸습니다.
- source_word: וְעֵינָיו אֶת עֵינוֹ תִּרְאֶינָה
  english_pob_choice: and his eyes will see his eyes
  chosen_korean: 그의 눈은 그의 눈을 볼 것입니다
  alternatives_korean:
  - 그의 눈은 그의 눈을 마주 볼 것입니다
  - 그는 그를 눈과 눈으로 볼 것입니다
  lexicon: HALOT
  rationale: 원문의 대칭적이고 구체적인 이미지를 유지하기 위해 직역에 가깝게 옮겼습니다. '눈과 눈'보다 원문 구조를 더 분명히 드러냅니다.
- source_word: צִדְקִיָּהוּ
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 세드기야
  lexicon: 표준 외래어 표기 관행
  rationale: 성경 인명은 한국어에서 확립된 표기 '시드기야'를 따랐습니다.
theological_decisions:
- issue: 바벨론 왕과의 대면을 나타내는 신체 관용구의 처리
  chosen_reading: 직접 대면을 뜻하는 히브리어의 신체적 표현을 유지하되, 한국어에서는 '입을 마주 대고'로 자연화했습니다.
  alternative_readings:
  - face to face로 완전히 해석하여 '마주 대하여'로 옮김
  - '''입에서 입으로''를 더 문자적으로 옮김'
  rationale: 본문은 단순한 회담이 아니라 포로 왕이 패배자의 눈앞에 서는 직접적 만남을 강조하므로, 과도한 완화 없이 그 긴장을 보존했습니다.
  doctrine_reference: 예언 성취와 왕권 심판의 역사적 구체성
