  lexicon: HALOT
  rationale: יִמָּלֵט의 핵심은 '도망하여 빠져나감'이므로, 현대 한국어에서는 자연스럽고 직접적인 '벗어나지 못하다'로 옮기되 '손'의 구체적 지배 이미지는 유지했습니다.
