base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'he will speak with him mouth to mouth,' that is, in direct personal encounter.
    reason: lexical_alternative
  - marker: b
    text: Or more idiomatically, 'his eyes will see his eyes,' that is, he will see him directly, eye to eye.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 시드기야는 칼데아 사람들의 손에서 벗어나지 못할 것입니다. 그는 반드시 바벨론 왕의 손에 넘겨질 것이며, 그와 직접 마주하여 말할 것이고[a], 시드기야의 눈은 바벨론 왕의 눈을 볼 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 입이 그의 입과 말할 것이며’입니다. ‘입과 입으로’라는 표현은 그와 직접 대면하여 말함을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 눈들이 그의 눈을 볼 것입니다’입니다. 시드기야가 바벨론 왕을 직접 보게 됨을 나타냅니다.
    reason: lexical_alternative
