- from: 그때 내가 그 매매 증서[a]를 네리야의 아들 바룩, 마흐세야의 아들에게 주었습니다. 그것은 내 숙부 한나멜[b] 앞에서, 그리고 그 매매 증서에 기록한 증인들 앞에서, 또 보초 뜰에 앉아 있던 모든 유다 사람들 앞에서였습니다.
  to: 그때 나는 그 매매 증서를 네리야의 아들 바룩, 곧 마흐세야의 아들에게 주었습니다. 나는 나의 숙부 한나멜[b] 앞에서, 그 매매 증서에 기록을 한 증인들 앞에서, 또 경비대 뜰에 앉아 있던 모든 유다 사람들 앞에서[a] 그것을 주었습니다.
  rationale: 수여 행위와 세 차례의 ‘앞에서’ 열거를 한 문장 안에 유지하여 원문의 법적·공개적 구조를 보존했습니다. 증인들이 증서에 기록 행위를 했다는 수식 관계를 명확히 했고, 공간 명칭과 각주 앵커·문구를 현대 표준 한국어에 맞게 다듬었습니다.
