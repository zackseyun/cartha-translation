id: JER.32.12
reference: Jeremiah 32:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶתֵּ֞ן אֶת הַ/סֵּ֣פֶר הַ/מִּקְנָ֗ה אֶל בָּר֣וּךְ בֶּן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ לְ/עֵינֵי֙ חֲנַמְאֵ֣ל דֹּדִ֔/י וּ/לְ/עֵינֵי֙ הָֽ/עֵדִ֔ים הַ/כֹּתְבִ֖ים בְּ/סֵ֣פֶר הַ/מִּקְנָ֑ה לְ/עֵינֵי֙ כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בַּ/חֲצַ֥ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/012.yaml
  text: Then I gave the deed of purchase to Baruch son of Neriah[a], son of Mahseiah, in the sight of Hanamel my uncle, and in the sight of the witnesses who had written in the deed of purchase[e][d][c][b], in the sight of all the Judeans who were sitting in the court of the guard.
  footnotes:
  - marker: a
    text: Or 'before' or 'in the presence of' for the repeated phrase 'in the sight of.'
    reason: lexical_alternative
  - marker: b
    text: '''Hanamel my uncle'' follows the immediate Hebrew wording; elsewhere in the chapter Hanamel is identified as Jeremiah''s cousin (the son of his uncle).'
    reason: cross_reference
  - marker: c
    text: Or 'who wrote in the deed of purchase'; the Hebrew literally says 'the witnesses, the ones writing in the deed of purchase.'
    reason: lexical_alternative
  - marker: d
    text: Or 'all the Jews'; 'Judeans' reflects the historical setting of the kingdom/province of Judah.
    reason: lexical_alternative
  - marker: e
    text: Or 'courtyard of the guard' or possibly 'court of the prison.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 그 매매 증서[a]를 네리야의 아들 바룩, 마흐세야의 아들에게 주었습니다. 그것은 내 숙부 한나멜[b] 앞에서, 그리고 그 매매 증서에 기록한 증인들 앞에서, 또 보초 뜰에 앉아 있던 모든 유다 사람들 앞에서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앞에’, ‘존재 앞에서’로 볼 수 있습니다. 반복되는 לְעֵינֵי의 직역적 뉘앙스를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 숙부 한나멜’은 바로 앞 히브리어 표현을 따른 것입니다. 이 장의 다른 구절에서는 한나멜이 예레미야의 사촌으로 더 구체화됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶתֵּן
  english_pob_choice: Then I gave
  chosen_korean: 그때 내가 …를 주었습니다
  alternatives_korean:
  - 그리고 내가 …를 주었습니다
  - 그리하여 내가 …를 주었습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 한국어의 과거 서술로 자연스럽게 옮기되, 법적 행위의 순차성을 살렸습니다.
- source_word: סֵפֶר הַמִּקְנָה
  english_pob_choice: the deed of purchase
  chosen_korean: 매매 증서
  alternatives_korean:
  - 구매 증서
  - 매입 문서
  lexicon: HALOT
  rationale: 이 문맥의 סֵפֶר는 단순한 책이 아니라 법적 문서이며, מִקְנָה는 취득/매매를 가리키므로 ‘매매 증서’가 가장 직접적입니다.
- source_word: לְעֵינֵי
  english_pob_choice: in the sight of
  chosen_korean: … 앞에서
  alternatives_korean:
  - … 보는 앞에서
  - …의 눈앞에서
  lexicon: HALOT
  rationale: 반복되는 공개·증언 공식이므로, 한국어에서는 법적 행위의 공개성을 자연스럽게 드러내는 ‘앞에서’로 옮겼습니다.
- source_word: הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה
  english_pob_choice: the witnesses who had written in the deed of purchase
  chosen_korean: 그 매매 증서에 기록한 증인들
  alternatives_korean:
  - 그 매매 증서에 쓴 증인들
  - 그 매매 증서에 서명한 증인들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그 증서에 쓰고 있는/기록하는 증인들’이므로, 서명이라고 단정하지 않고 기록 행위를 보존했습니다.
- source_word: כָּל הַיְּהוּדִים
  english_pob_choice: all the Judeans
  chosen_korean: 모든 유다 사람들
  alternatives_korean:
  - 모든 유대인들
  - 모든 유다인들
  lexicon: HALOT
  rationale: 역사적 배경상 유다 왕국/유다 지방의 사람들을 가리키므로, 후대의 종교-민족적 의미를 덜 띠는 ‘유다 사람들’이 적절합니다.
theological_decisions:
- issue: חֲצַר הַמַּטָּרָה의 공간 명칭
  chosen_reading: 보초 뜰
  alternative_readings:
  - 경비 뜰
  - 경비대 뜰
  - 감옥 뜰
  rationale: 마טָּרָה는 단순 감옥보다 경비·감시가 있는 장소를 가리키며, 문맥상 예레미야가 갇힌 보초 구역을 의미하므로 ‘보초 뜰’로 옮겼습니다.
  doctrine_reference: 역사적·문맥적 번역 원칙
- issue: חֲנַמְאֵל דֹּדִי의 친족 호칭
  chosen_reading: 내 숙부 한나멜
  alternative_readings:
  - 내 삼촌 한나멜
  - 내 외삼촌 한나멜
  - 내 사촌 한나멜
  rationale: 히브리어 דּוֹד는 직접적으로는 ‘숙부/삼촌’ 계열을 뜻하므로, 본문 표면 의미를 보존했습니다. 장절 전체의 친족 설명은 별도 문맥으로 이해할 수 있습니다.
  doctrine_reference: 문맥 우선·어휘 보존 원칙
