id: JER.32.44
reference: Jeremiah 32:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂד֞וֹת בַּ/כֶּ֣סֶף יִקְנ֗וּ וְ/כָת֨וֹב בַּ/סֵּ֥פֶר וְ/חָתוֹם֮ וְ/הָעֵ֣ד עֵדִים֒ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן וּ/בִ/סְבִיבֵ֣י יְרוּשָׁלִַ֗ם וּ/בְ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/עָרֵ֣י הָ/הָ֔ר וּ/בְ/עָרֵ֥י הַ/שְּׁפֵלָ֖ה וּ/בְ/עָרֵ֣י הַ/נֶּ֑גֶב כִּֽי אָשִׁ֥יב אֶת שְׁבוּתָ֖/ם נְאֻם יְהוָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/044.yaml
  text: Fields will be bought with silver[a], and deeds will be written in a scroll and sealed and witnessed by witnesses in the land of Benjamin, around Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb; for I will restore their fortunes[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'attested by witnesses.' The Hebrew reads literally 'and witness witnesses,' a legal formula for formal attestation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Shephelah,' the lowland region of Judah.
    reason: cultural_note
  - marker: c
    text: Or 'I will bring back their exiles' / 'I will restore their captivity.' The Hebrew idiom can denote reversal of exile and broader restoration.
    reason: alternative_reading
translation:
  language: ko
  text: 밭은 은으로 사들이고, 문서에는 적고 봉인하고 증인들을 세울 것입니다. 베냐민 땅과 예루살렘 사방, 유다의 성읍들, 산지의 성읍들, 저지대의 성읍들, 네겝의 성읍들에서 그러할 것입니다. 내가 그들의 포로된 상태를 돌이킬 것이기 때문입니다. 야훼의 말씀입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증인들을 세울 것입니다’는 히브리어의 법정적 표현을 한국어로 옮긴 것입니다. 직역하면 ‘증인들을 증언하게 하다/입증하게 하다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저지대’는 히브리어의 ‘스펠라(Shphelah)’에 해당하는 유다의 지역 명칭입니다.
    reason: cultural_note
  - marker: c
    text: ‘포로된 상태를 돌이키다’는 히브리어 관용구로, ‘포로 귀환’과 ‘회복’을 함께 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂדוֹת
  english_pob_choice: Fields will be bought
  chosen_korean: 밭은 사들이고
  alternatives_korean:
  - 필지들은 사들이고
  - 토지들은 사들이고
  lexicon: HALOT
  rationale: 복수 명사 שָׂדוֹת는 이 문맥에서 매매되는 농경지 단위를 가리키므로, 자연스러운 현대 한국어로는 ‘밭’이 가장 구체적입니다.
- source_word: בַּכֶּסֶף
  english_pob_choice: with silver
  chosen_korean: 은으로
  alternatives_korean:
  - 돈으로
  - 은돈으로
  lexicon: HALOT
  rationale: 문맥상 화폐 지불을 가리키지만, 히브리어의 구체성을 살려 ‘은으로’로 옮겼습니다.
- source_word: וְכָתוֹב בַּסֵּפֶר
  english_pob_choice: deeds will be written in a scroll
  chosen_korean: 문서에는 적고
  alternatives_korean:
  - 두루마리에는 적고
  - 기록문에는 적고
  lexicon: HALOT
  rationale: סֵפֶר는 여기서 문학적 ‘책’이 아니라 법적 매매 문서이므로, 한국어로는 ‘문서’가 가장 분명합니다. 동사는 반복되는 수동 연쇄를 자연스럽게 풀어 ‘적고’로 처리했습니다.
- source_word: וְהָעֵד עֵדִים
  english_pob_choice: witnessed by witnesses
  chosen_korean: 증인들을 세울 것입니다
  alternatives_korean:
  - 증인들이 증언할 것입니다
  - 증인들로 증언하게 할 것입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘증인들을 증언하게 하다/증언으로 입증하다’라는 법정 공식 표현이므로, 한국어에서는 거래 절차를 드러내는 ‘증인들을 세우다’가 가장 근접합니다.
- source_word: כִּֽי אָשִׁ֥יב אֶת שְׁבוּתָ֖ם
  english_pob_choice: for I will restore their fortunes
  chosen_korean: 내가 그들의 포로된 상태를 돌이킬 것이기 때문입니다
  alternatives_korean:
  - 내가 그들의 포로 생활을 되돌릴 것이기 때문입니다
  - 내가 그들의 운명을 회복시킬 것이기 때문입니다
  lexicon: HALOT
  rationale: שְׁבוּת는 단순한 ‘포로 귀환’보다 포로 상태의 전환과 회복을 포함하는 관용구이므로, 본문이 가진 포로-회복의 긴장을 살려 직역 성분을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה는 단순한 화자 표지가 아니라 종결 선언이므로, 현대 한국어 예언 문맥에서 ‘말씀입니다’가 가장 안정적입니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 언약 이름을 ‘야훼’로 옮겨 מקור의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שְׁבוּת의 의미 범위
  chosen_reading: 포로된 상태를 돌이키다
  alternative_readings:
  - 포로들을 돌아오게 하다
  - 포로 생활을 회복하다
  rationale: 이 관용구는 단순한 귀환만이 아니라 포로 상태의 반전과 회복을 함께 가리킬 수 있으므로, 번역에서도 그 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
