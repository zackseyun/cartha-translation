revisions:
- from: 밭은 은으로 사들이고, 문서에는 적고 봉인하고 증인들을 세울 것입니다. 베냐민 땅과 예루살렘 사방, 유다의 성읍들, 산지의 성읍들, 저지대의 성읍들, 네겝의 성읍들에서 그러할 것입니다. 내가 그들의 포로된 상태를 돌이킬 것이기 때문입니다. 야훼의 말씀입니다.[a][b][c]
  to: 밭들을 은으로 사고, 매매 문서를 작성하여 봉인하고, 증인들을 세울 것입니다[a]. 베냐민 땅과 예루살렘 주변, 유다의 성읍들, 산지의 성읍들, 저지대[b]의 성읍들, 네겝의 성읍들에서 그렇게 할 것입니다. 내가 그들의 처지를 회복시킬 것이기 때문입니다[c]. 야훼의 말씀입니다.
  rationale: 원문의 법률 행위 연쇄를 자연스러운 합쇼체 미래형으로 정돈하고, 지명 열거가 그 행위 전체에 적용됨을 ‘그렇게 할 것입니다’로 명확히 했습니다. 회복 관용구는 특정 해석으로 좁히지 않고 포괄적인 ‘처지의 회복’으로 번역했으며, 가능한 포로 귀환 의미는 주석에 보존했습니다. 각주 표지도 해당 어구에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:23Z'
