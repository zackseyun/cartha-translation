  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל ע֣וֹד יִקָּנ֥וּ בָתִּ֛ים וְ/שָׂד֥וֹת וּ/כְרָמִ֖ים בָּ/אָ֥רֶץ הַ/זֹּֽאת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/015.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Houses and fields and vineyards will again be bought in this land.'
  footnotes:
  - marker: a
    text: Or, 'will again buy houses and fields and vineyards in this land.' The Hebrew verb is Niphal and may be taken less strictly as a middle or passive-like form, but 'will be bought' best preserves the form here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하시기 때문입니다. “이 땅에서 집과 밭과 포도밭이 다시 사들여질 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 땅에서 다시 집과 밭과 포도밭을 살 것입니다.” 히브리어 동사는 니팔형으로, 수동으로 이해할 수도 있고 중간태적 의미로 이해할 수도 있습니다. 여기서는 형태를 살려 “사들여질 것입니다”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주 야훼
  lexicon: HALOT
  rationale: פְּרֹפֶטִי המְלֶאָךְ formula를 살리면서, יְהוָה는 프로젝트 기본값인 ‘야훼’로, צְבָאוֹת는 관용적으로 ‘만군의’로 옮겨 신적 칭호의 위엄을 유지합니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님이신 분
  - 이스라엘의 하나님
  lexicon: HALOT
  rationale: 히브리어 소유·규정 관계를 자연스러운 관형 구조로 옮겨 언약적 정체성을 분명히 드러냅니다.
- source_word: יִקָּנוּ
  english_pob_choice: will be bought
  chosen_korean: 다시 사질 것입니다
  alternatives_korean:
  - 다시 팔릴 것입니다
  - 다시 사게 될 것입니다
  lexicon: HALOT
  rationale: Niphal의 수동성을 한국어에서도 살려 ‘사다’의 피동형 ‘사지다’를 사용했고, ‘다시’로 עוֹד의 회복·재개 뉘앙스를 반영했습니다.
- source_word: בָתִּים וְשָׂדוֹת וּכְרָמִים
  english_pob_choice: Houses and fields and vineyards
  chosen_korean: 집과 밭과 포도밭
  alternatives_korean:
  - 집들과 밭들과 포도원들
  - 가옥과 밭과 포도밭
  lexicon: HALOT
  rationale: 열거의 단순성과 재산 거래 맥락을 살려 가장 직접적인 어휘를 선택했습니다.
- source_word: בָּאָרֶץ הַזֹּאת
  english_pob_choice: in this land
  chosen_korean: 이 땅에서
  alternatives_korean:
  - 이 나라에서
  - 이 땅 안에서
  lexicon: HALOT
  rationale: 예레미야의 언약-토지 맥락에서 ‘땅’이 가장 자연스럽고 신학적 울림도 보존합니다.
theological_decisions:
- issue: 예언자 전언 공식의 시제와 어조
  chosen_reading: ‘…라고 말씀하십니다’로 현재형 선포를 사용했습니다.
  alternative_readings:
  - ‘…라고 말씀하셨습니다’
  - ‘…라고 말합니다’
  rationale: 히브리어 perfect의 예언자적 선포 관용을 한국어에서 현재형 직설로 살려, 단순 과거 사건이 아니라 지금 주어지는 하나님의 선언으로 들리게 했습니다.
  doctrine_reference: Translation philosophy §1, §5
