    issue: 동사 ‘받았습니다’
    rationale: 히브리어 וָאֶקַּח은 기본적으로 ‘내가 취하였다/가져갔다’입니다. 문맥상 수령을 함의할 수 있으나, 번역문은 행위의 직접성을 더 잘 반영해야 합니다.
  - severity: medium
    issue: ‘열린 사본’의 어색함
    rationale: 한국어에서 문서가 ‘열렸다’는 표현은 의미가 불분명할 수 있습니다. 봉인된 사본과의 법적·물리적 대조를 위해 ‘개봉된 사본’이 자연스럽고 명확합니다.
  - severity: medium
    issue: 각주 a의 내용과 표지 위치
    rationale: 현 각주 a는 본문을 반복할 뿐 영어 감사 기록의 대안적 히브리어 구문을 전달하지 못합니다. 매매 증서 뒤에 표지를 두고, ‘명령과 규례’라는 직역 가능성을 제시해야 합니다.
