id: JER.32.11
reference: Jeremiah 32:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶקַּ֖ח אֶת סֵ֣פֶר הַ/מִּקְנָ֑ה אֶת הֶֽ/חָת֛וּם הַ/מִּצְוָ֥ה וְ/הַ/חֻקִּ֖ים וְ/אֶת הַ/גָּלֽוּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/011.yaml
  text: Then I took the deed of purchase[a], the sealed copy, containing the terms and conditions[b], and the open copy.
  footnotes:
  - marker: a
    text: Or 'the sealed document, the command and the statutes'; the Hebrew legal terms likely refer to the deed's stipulations and provisions.
    reason: lexical_alternative
  - marker: b
    text: That is, the unsealed or publicly accessible copy, in contrast to the sealed copy.
    reason: cultural_note
translation:
  language: ko
  text: 그때 내가 매매증서와 봉인된 사본, 곧 그 조건들과 규정이 적힌 것, 그리고 열린 사본을 받았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 봉인된 사본, 즉 그 조건들과 규정이 적힌 봉인본입니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 봉인되지 않은, 공개적으로 열람할 수 있는 사본입니다.
    reason: cultural_note
lexical_decisions:
- source_word: סֵפֶר הַמִּקְנָה
  english_pob_choice: the deed of purchase
  chosen_korean: 매매증서
  alternatives_korean:
  - 구매 증서
  - 매입 문서
  - 매매 문서
  lexicon: HALOT
  rationale: סֵפֶר은 문서/기록을, מִקְנָה는 매입·취득을 가리키므로, 법적 거래 문서라는 의미를 자연스러운 한국어 법률어로 옮겼습니다.
- source_word: הֶחָתוּם
  english_pob_choice: the sealed copy
  chosen_korean: 봉인된 사본
  alternatives_korean:
  - 봉인된 문서
  - 봉인된 것
  - 봉인본
  lexicon: HALOT
  rationale: 봉인된 상태를 나타내는 분사이며, 뒤의 열린 사본과 대조되므로 ‘사본’으로 분명히 하여 문서의 두 판본임을 드러냈습니다.
- source_word: הַמִּצְוָה וְהַחֻקִּים
  english_pob_choice: the terms and conditions
  chosen_korean: 그 조건들과 규정
  alternatives_korean:
  - 명령과 규례
  - 조항들과 조건
  - 규정과 법규
  lexicon: HALOT
  rationale: 문맥상 일반 명령이 아니라 매매증서의 법적 조항들을 가리키므로, 전통적 종교어보다 계약 문서의 조항을 나타내는 표현을 택했습니다.
- source_word: הַגָּלוּי
  english_pob_choice: the open copy
  chosen_korean: 열린 사본
  alternatives_korean:
  - 개봉된 사본
  - 공개된 사본
  - 봉인되지 않은 사본
  lexicon: HALOT
  rationale: ‘열린/드러난’의 뜻을 반영하되, 봉인된 사본과의 대조를 살려 간결하게 옮겼습니다.
theological_decisions:
- issue: 예레미야의 서류 수령 장면에서 משפט/계약 문서의 실질을 어떻게 드러낼지
  chosen_reading: 종교적 용어로 완화하지 않고, 실제 매매 계약의 봉인본과 공개본이라는 법적 문서 구조를 그대로 드러냈습니다.
  alternative_readings:
  - ‘계명’이나 ‘율례’처럼 종교적 조항으로 일반화하는 번역
  - ‘증서’만 남기고 봉인/개방의 대비를 약화시키는 번역
  rationale: 히브리어는 문서의 봉인본과 열린 사본을 대조하므로, 본문이 말하는 거래의 법적 실재를 유지하는 것이 독자 이해에 가장 충실합니다.
  doctrine_reference: 본문 문맥 보존 및 법적-서사적 의미 충실 번역
