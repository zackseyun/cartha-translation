translation:
  language: ko
  text: '그리고 나는 그들이 보는 앞에서[b] 바룩에게 이렇게 명령했습니다[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지시했습니다”로도 옮길 수 있습니다.
