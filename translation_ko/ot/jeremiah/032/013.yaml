  - marker: b
    text: 히브리어 관용구로, 곧 “증인들이 보는 공개적인 자리에서”라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַוֶּה
  english_pob_choice: And I charged
  chosen_korean: 그리고 나는 …에게 명령하여
  alternatives_korean:
  - 그리고 나는 …에게 지시하여
  - 그리고 나는 …에게 명령했습니다
  lexicon: HALOT
  rationale: צוה는 문맥상 공적이고 공식적인 지시를 가리키므로, 여기서는 법적·공적 상황을 살려 ‘명령하여’로 옮겼습니다. 합쇼체 서술을 위해 동사형을 자연스럽게 구성했습니다.
- source_word: לְעֵינֵיהֶם
  english_pob_choice: before their eyes
  chosen_korean: 그들의 눈앞에서
  alternatives_korean:
  - 그들 앞에서
  - 그들이 보는 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘공개적으로, 증인들이 보는 자리에서’라는 뜻을 살리기 위해 직역에 가까운 ‘눈앞에서’를 선택했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여
  - 이르기를
  lexicon: HALOT
  rationale: 직접 화법을 여는 표지이므로 한국어에서는 자연스러운 서술동사 ‘말했습니다’로 처리했습니다.
- source_word: בָּרוּךְ
  english_pob_choice: Baruch
  chosen_korean: 바룩
  alternatives_korean:
  - 바루크
  lexicon: standard transliteration
  rationale: 예레미야서의 통용되는 인명 표기 관행에 따라 바룩으로 옮겼습니다.
theological_decisions:
- issue: 공적 증언 상황의 표현 유지
  chosen_reading: ‘그들의 눈앞에서’로 옮겨 공개적·증인 앞의 상황을 분명히 드러냈습니다.
  alternative_readings:
  - 그들 앞에서
  - 공개적으로
  rationale: 본문은 사적인 지시가 아니라 증인들이 보는 자리에서 이루어진 행위를 강조하므로, 관용구의 공적 성격을 약화시키지 않도록 했습니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
