  source_fidelity: 히브리어의 언약 체결, 언약의 지속성, 하나님께서 백성에게서 돌아서지 않고 선을 행하심, 그리고 하나님을 향한 두려움이 백성의 마음에 주어져 그들이 하나님에게서 떠나지 않게 됨이라는 핵심 구조는 대체로 반영했습니다. 그러나 초안의 ‘그것은 … 것입니다’와 ‘하려는 것입니다’는 관계절 및 목적절을 설명문으로 바꾸어 예언적 직접 발화의 구조와 힘을 약화합니다. ‘내 두려움’은 한국어에서 하나님의 감정으로 읽힐 수 있어, 본문의 방향성을 본문과 주석에서 분명히 해야 합니다.
  naturalness: 초안은 ‘맺을 것인데, 그것은 … 것입니다’ 및 ‘주리니, … 하려는 것입니다’처럼 시제와 문체가 혼합되어 현대 합쇼체의 직접 발화로 자연스럽지 않습니다. 미래 약속의 종결을 ‘맺겠습니다/주겠습니다/하겠습니다’로 통일하고, 목적을 ‘하도록’으로 연결하면 자연스럽습니다.
