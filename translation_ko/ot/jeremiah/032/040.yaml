id: JER.32.40
reference: Jeremiah 32:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית עוֹלָ֔ם אֲשֶׁ֤ר לֹֽא אָשׁוּב֙ מֵ/אַ֣חֲרֵי/הֶ֔ם לְ/הֵיטִיבִ֖/י אוֹתָ֑/ם וְ/אֶת יִרְאָתִ/י֙ אֶתֵּ֣ן בִּ/לְבָבָ֔/ם לְ/בִלְתִּ֖י ס֥וּר מֵ/עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/040.yaml
  text: I will make with them an everlasting covenant[a], that I will not turn away from them, to do them good. And I will put the fear of me in their hearts[b], so that they will not turn away from me.
  footnotes:
  - marker: a
    text: Or 'eternal covenant' or 'perpetual covenant.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my fear'; that is, fear directed toward me.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들과 영원한 언약[a]을 맺겠습니다. 내가 그들에게 등을 돌리지 않고 그들에게 선을 행하겠습니다. 또 내가 나를 두려워하는 마음[b]을 그들의 마음에 주어, 그들이 나를 떠나지 않도록 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영속적인 언약’, ‘영구한 언약’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 두려움’; 곧 나를 향한 두려움입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי / בְּרִית
  english_pob_choice: I will make ... a covenant
  chosen_korean: 언약을 맺을 것인데
  alternatives_korean:
  - 언약을 세울 것인데
  - 언약을 맺겠습니다
  lexicon: HALOT
  rationale: 히브리어의 문자적인 ‘자르다’ 관용구를 한국어에서는 자연스럽게 ‘언약을 맺다’로 옮기는 것이 가장 직접적이며, 예언체 서술의 미래도 유지합니다.
- source_word: בְּרִית עוֹלָם
  english_pob_choice: an everlasting covenant
  chosen_korean: 영원한 언약
  alternatives_korean:
  - 영속적인 언약
  - 영구한 언약
  lexicon: HALOT
  rationale: עוֹלָם의 지속성을 한국어 성경 문맥에서 가장 자연스럽게 드러내는 표현은 ‘영원한’이며, 관계의 지속을 분명히 합니다.
- source_word: יִרְאָתִי
  english_pob_choice: the fear of me
  chosen_korean: 내 두려움
  alternatives_korean:
  - 나를 향한 두려움
  - 나에 대한 경외
  lexicon: HALOT
  rationale: 직역에 가까운 ‘내 두려움’을 택해, 하나님께로 향한 두려움/경외라는 소유격 구조를 살렸습니다. ‘경외’는 의미는 좋지만 어감상 해석을 다소 앞당길 수 있습니다.
- source_word: לְבִלְתִּי סוּר מֵעָלָי
  english_pob_choice: so that they will not turn away from me
  chosen_korean: 그들이 나에게서 돌아서지 않게 하려는 것입니다
  alternatives_korean:
  - 그들이 나를 떠나지 않게 하려는 것입니다
  - 그들이 나에게서 물러서지 않게 하려는 것입니다
  lexicon: HALOT
  rationale: 반복되는 ‘돌아서다’의 동작상을 살리면서, ‘나에게서’로 원문의 이격 관계를 유지했습니다.
theological_decisions:
- issue: 여호와의 언약 지속성
  chosen_reading: 영원한 언약
  alternative_readings:
  - 영속적인 언약
  - 영구한 언약
  rationale: 본문은 언약의 지속성을 선언할 뿐 그 기간을 체계적으로 재규정하지 않으므로, 신학적 긴장을 남기는 ‘영원한’이 가장 충실합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: ‘두려움’의 의미
  chosen_reading: 내 두려움
  alternative_readings:
  - 나를 향한 두려움
  - 나에 대한 경외
  rationale: 이 표현은 하나님 자신의 두려움이 아니라 하나님을 향한 경외를 뜻하므로, 번역은 그 방향성을 유지하되 과도한 교리적 설명은 피합니다.
  doctrine_reference: Affirmations; Translation philosophy §1 and §3
