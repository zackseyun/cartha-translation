revisions:
- from: 내가 그들과 영원한 언약을 맺을 것인데, 그것은 내가 그들에게서 돌아서지 않고 그들에게 선을 행하려는 것입니다. 또 내가 내 두려움을 그들의 마음에 넣어 주리니, 그들이 나에게서 돌아서지 않게 하려는 것입니다.[a][b]
  to: 내가 그들과 영원한 언약[a]을 맺겠습니다. 내가 그들에게 등을 돌리지 않고 그들에게 선을 행하겠습니다. 또 내가 나를 두려워하는 마음[b]을 그들의 마음에 주어, 그들이 나를 떠나지 않도록 하겠습니다.
  rationale: 문장을 하나님의 미래 약속에 맞는 현대 합쇼체로 통일했습니다. אֲשֶׁר 이하의 내용을 독립된 약속 문장으로 자연스럽게 풀어내되, 하나님께서 등을 돌리지 않으시고 선을 행하신다는 결속을 유지했습니다. יִרְאָתִי는 한국어의 모호성을 피하고 원문의 방향성을 드러내기 위해 ‘나를 두려워하는 마음’으로 옮겼으며, 직역적 표현과 뜻은 각주로 보존했습니다. ‘떠나지 않도록’은 לְבִלְתִּי סוּר מֵעָלָי의 목적/예방 의미를 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
