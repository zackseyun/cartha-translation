id: JER.32.31
reference: Jeremiah 32:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֧י עַל אַפִּ֣/י וְ/עַל חֲמָתִ֗/י הָ֤יְתָה לִּ/י֙ הָ/עִ֣יר הַ/זֹּ֔את לְ/מִן הַ/יּוֹם֙ אֲשֶׁ֣ר בָּנ֣וּ אוֹתָ֔/הּ וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה לַ/הֲסִירָ֖/הּ מֵ/עַ֥ל פָּנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/031.yaml
  text: For this city has been to me a cause of my anger and my wrath from the day they built it even to this day[b][a], so that I should remove it from before my face.
  footnotes:
  - marker: a
    text: Hebrew literally, 'upon my anger and upon my wrath,' an idiom meaning that the city has provoked or occasioned God's anger.
    reason: lexical_alternative
  - marker: b
    text: Or 'from my presence' for 'from before my face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 성읍은 처음부터 오늘에 이르기까지 내 분노와 내 진노의 원인이 되었으니, 내가 그것을 내 얼굴 앞에서 제거하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 분노 위에, 내 진노 위에’라는 관용구로, 성읍이 하나님의 분노를 불러일으킨다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 얼굴 앞에서’는 곧 ‘내 임재에서’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אַפִּי וְעַל חֲמָתִי
  english_pob_choice: a cause of my anger and my wrath
  chosen_korean: 내 분노와 내 진노의 원인
  alternatives_korean:
  - 내 분노와 내 진노 위에
  - 내 분노와 내 진노에
  - 내 분노와 내 진노를 일으킨 것
  lexicon: HALOT
  rationale: 히브리어의 עַל + 감정명사 관용구는 직역보다 원인·유발의 뜻으로 옮겨야 하므로, 성읍이 하나님의 분노와 진노를 촉발한 ‘원인’임을 드러냈습니다.
- source_word: הָיְתָה לִּי
  english_pob_choice: has been to me
  chosen_korean: 되었으니
  alternatives_korean:
  - 되어 왔으니
  - 되어 있습니다
  - 였습니다
  lexicon: HALOT
  rationale: 과거부터 현재까지 지속된 상태를 한국어에서 자연스럽게 나타내기 위해, 누적된 결과를 보이는 ‘되었으니’를 택했습니다.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּנוּ אוֹתָהּ וְעַד הַיּוֹם הַזֶּה
  english_pob_choice: from the day they built it even to this day
  chosen_korean: 처음부터 오늘에 이르기까지
  alternatives_korean:
  - 그들이 그것을 세운 날부터 오늘까지
  - 그것을 지은 날부터 오늘에 이르기까지
  lexicon: HALOT
  rationale: 기점에서 현재까지의 지속을 간결하게 보이면서도, 3인칭 복수의 주체를 문맥상 과도하게 특정하지 않도록 ‘처음부터’와 ‘오늘에 이르기까지’로 옮겼습니다.
- source_word: מֵעַל פָּנַי
  english_pob_choice: from before my face
  chosen_korean: 내 얼굴 앞에서 제거하려는 것입니다
  alternatives_korean:
  - 내 앞에서 제거하려는 것입니다
  - 내 임재 앞에서 치워 버리려는 것입니다
  lexicon: HALOT
  rationale: ‘얼굴’은 하나님의 임재를 가리키는 구체적 표현이므로, 관용적 의미를 살리면서도 직유를 유지해 ‘내 얼굴 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 분노와 진노를 인간 감정의 약화된 표현으로 바꾸지 않을지
  chosen_reading: ‘분노’와 ‘진노’를 그대로 유지하고, 성읍이 그것들을 ‘원인’이 되었다는 구조를 살렸습니다.
  alternative_readings:
  - 하나님을 노하게 한 원인
  - 하나님의 마음을 상하게 한 것
  rationale: 원문은 하나님께 대한 지속적 도발과 심판의 정당성을 강하게 말하므로, 이를 추상화하거나 완화하지 않고 그대로 드러내는 편이 본문에 충실합니다.
  doctrine_reference: 번역 원칙 §3, §6
- issue: ‘얼굴’의 신학적 표현을 ‘임재’로만 풀어 쓸지 여부
  chosen_reading: ‘내 얼굴 앞에서’라는 직역적 이미지를 유지하되, 의미는 제거·배제의 방향으로 이해되도록 번역했습니다.
  alternative_readings:
  - 내 임재에서
  - 내 앞에서
  rationale: 히브리어의 신체적 표현은 하나님과 성읍 사이의 관계 단절을 생생하게 드러내므로, 본문의 긴장과 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §3, §6
