  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲהָהּ֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֣ה אַתָּ֣ה עָשִׂ֗יתָ אֶת הַ/שָּׁמַ֨יִם֙ וְ/אֶת הָ/אָ֔רֶץ בְּ/כֹֽחֲ/ךָ֙ הַ/גָּד֔וֹל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה לֹֽא יִפָּלֵ֥א מִמְּ/ךָ֖ כָּל דָּבָֽר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/017.yaml
  text: Ah, Lord GOD! Look, you yourself made the heavens and the earth by your great power and by your outstretched arm. Nothing is too difficult for you.
translation:
  language: ko
  text: 아, 주 하나님! 보십시오, 주께서는 큰 능력과 펴신 팔로 하늘과 땅을 지으셨습니다. 어떤 일도 주께 너무 어려운 일은 없습니다.
  philosophy: formal
lexical_decisions:
- source_word: יְהוִה / אֲדֹנָי
  english_pob_choice: Lord GOD
  chosen_korean: 주 하나님
  alternatives_korean:
  - 야훼 하나님
  - 주 여호와
  lexicon: Title + divine name
  rationale: 본문의 호격은 하나님의 주권을 직접 부르는 형태이므로, 합쇼체 문맥에서 가장 자연스러운 경어 호칭인 ‘주 하나님’으로 옮겼습니다. POB의 야훼 기본값은 여기서도 고려되지만, 감탄문 호칭의 유창성을 위해 ‘주 하나님’이 본문 적합성이 높습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: discourse particle
  rationale: POB의 ‘Look’은 단순 지시가 아니라 화자가 하나님께 사실을 환기하며 강조하는 담화 표지이므로, 현대 합쇼체에서 자연스럽고 직접적인 ‘보십시오’로 대응했습니다.
- source_word: בְּכֹחֲךָ הַגָּדוֹל וּבִזְרֹעֲךָ הַנְּטוּיָה
  english_pob_choice: by your great power and by your outstretched arm
  chosen_korean: 큰 능력과 펴신 팔로
  alternatives_korean:
  - 큰 권능과 펴신 팔로
  - 큰 힘과 뻗으신 팔로
  lexicon: idiom
  rationale: ‘능력’은 히브리어 כֹחַ의 표준적 의미를 살리면서도 POB의 ‘great power’를 반영합니다. ‘펴신 팔’은 출애굽 전승을 연상시키는 비유를 과장하지 않고 한국어로 자연스럽게 전달합니다.
- source_word: לֹא יִפָּלֵא מִמְּךָ כָּל דָּבָר
  english_pob_choice: Nothing is too difficult for you
  chosen_korean: 어떤 일도 주께 너무 어려운 일은 없습니다
  alternatives_korean:
  - 주께 불가능한 일은 없습니다
  - 주께는 아무 일도 어려운 것이 없습니다
  lexicon: idiom
  rationale: 문자적으로는 ‘주께서 해내지 못할 일이 하나도 없다’는 뜻이므로, POB의 의미를 유지하면서도 한국어에서 더 자연스러운 ‘너무 어려운 일은 없습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 호칭을 ‘야훼’로 직접 표기할지 여부
  chosen_reading: 호격 전체를 ‘주 하나님’으로 처리해 기도문 체감과 문맥의 자연스러움을 우선했습니다.
  alternative_readings:
  - 아, 야훼 하나님!
  - 아, 주 야훼 하나님!
  rationale: 이 절은 예레미야의 기도 도입부로, 호칭의 경외감과 한국어 기도문 관용을 함께 살려야 합니다. 본문 의미를 훼손하지 않는 범위에서 ‘주 하나님’이 가장 안정적입니다.
  doctrine_reference: 기도문 호칭과 신명 표기 관례
- issue: ‘Nothing is too difficult for you’를 능력의 한계 부재로 볼지, 불가능 부재로 볼지
  chosen_reading: 하나님께는 어떤 일도 지나치게 어려운 일이 없다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 주께는 불가능한 일이 없습니다
  - 주께 불가능한 것은 아무것도 없습니다
  rationale: 히브리어 לֹא יִפָּלֵא는 단순한 ‘불가능’보다 ‘너무 어렵다/벅차다’의 뉘앙스를 포함하므로, 하나님 능력의 전능성과 동시에 서술의 절박함을 살리는 표현을 택했습니다.
  doctrine_reference: 하나님의 전능성과 예언자적 탄원
