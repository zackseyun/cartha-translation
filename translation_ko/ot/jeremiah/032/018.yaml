id: JER.32.18
reference: Jeremiah 32:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֹ֤שֶׂה חֶ֨סֶד֙ לַֽ/אֲלָפִ֔ים וּ/מְשַׁלֵּם֙ עֲוֺ֣ן אָב֔וֹת אֶל חֵ֥יק בְּנֵי/הֶ֖ם אַחֲרֵי/הֶ֑ם הָ/אֵ֤ל הַ/גָּדוֹל֙ הַ/גִּבּ֔וֹר יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/018.yaml
  text: showing steadfast love to thousands[a], and repaying the iniquity of fathers into the lap of their children after them—the great, mighty God, Yahweh of Armies[b], is his name.
  footnotes:
  - marker: a
    text: Or 'to thousands of generations' in light of similar covenant language elsewhere; the Hebrew here reads simply 'to thousands.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 천대까지 인자하심을 베푸시며, 아버지들의 죄악을 그 뒤의 그 자녀들의 품속에 갚으시는—크고 능하신 하나님, 만군의 야훼이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천대까지’는 히브리어의 간결한 표현을 한국어 관용으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만군’은 צְבָאוֹת의 전통적 한국어 대응으로, 문자적 의미는 ‘군대들/군대의 하나님’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 한결같은 사랑
  - 은혜로운 사랑
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실성과 자비를 함께 살리기 위해, 한국어 성경에서 익숙하면서도 단순한 ‘인자하심’을 택했습니다.
- source_word: לַאֲלָפִים
  english_pob_choice: to thousands
  chosen_korean: 천대까지
  alternatives_korean:
  - 수천에게
  - 수천 세대까지
  - 천 명에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘수천’이지만, 이 구절의 관용적 언약 표현을 한국어로 자연스럽게 드러내기 위해 ‘천대까지’로 옮겼습니다.
- source_word: אֶל חֵיק בְּנֵי־הֶם אַחֲרֵי־הֶם
  english_pob_choice: into the lap of their children after them
  chosen_korean: 그 뒤의 그 자녀들의 품속에
  alternatives_korean:
  - 그 뒤의 그 자손들의 품에
  - 그 자녀들의 품에
  - 그 뒤의 자식들의 품속에
  lexicon: HALOT
  rationale: ‘품속’은 히브리어 관용구가 가리키는 직접적이고 가시적인 ‘전가/되돌림’의 이미지를 살리며, ‘그 뒤의’로 세대적 연속을 반영했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼이십니다
  alternatives_korean:
  - 만군의 여호와이십니다
  - 만군의 주님이십니다
  - 만군의 하나님이십니다
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, צְבָאוֹת는 ‘of Armies’의 직역 취지를 따라 전통적 ‘만군’ 표현을 유지했습니다.
theological_decisions:
- issue: 세대 간 보응의 진술
  chosen_reading: 아버지들의 죄악을 자녀들의 품속에 갚으신다는 진술을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 사회적 결과만을 뜻하는 것으로 해석하기
  - 무고한 자녀에 대한 직접 처벌로만 읽기
  rationale: 본문은 언약적 보응의 세대적 차원을 실제로 진술하므로, 다른 본문과의 긴장을 해소하지 않고 그대로 드러내는 것이 원문 충실성에 부합합니다.
  doctrine_reference: '번역 철학: 신학적 긴장을 보존하고 본문이 말하는 바를 우선 드러냄'
