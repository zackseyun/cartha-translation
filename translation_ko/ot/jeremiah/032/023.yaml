  to: 그들은 들어와 그 땅을 차지했지만, 당신의 음성을 듣지 않았고 당신의 율법을 따라 살지도 않았습니다.[a] 당신께서 그들에게 행하라고 명령하신 모든 일을 행하지 않았으며, 당신께서는 그들에게 이 모든 재앙을 내리셨습니다.[b]
