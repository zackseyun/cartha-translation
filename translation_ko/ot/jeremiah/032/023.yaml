reference: Jeremiah 32:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ וַ/יִּֽרְשׁ֣וּ אֹתָ֗/הּ וְ/לֹֽא שָׁמְע֤וּ בְ/קוֹלֶ֨/ךָ֙ ו/ב/תרות/ך לֹא הָלָ֔כוּ אֵת֩ כָּל אֲשֶׁ֨ר צִוִּ֧יתָה לָ/הֶ֛ם לַ/עֲשׂ֖וֹת לֹ֣א עָשׂ֑וּ וַ/תַּקְרֵ֣א אֹתָ֔/ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/023.yaml
  text: They came in and took possession of it[a], but they did not listen to your voice, and they did not walk in your law. They did not do all that you commanded them to do[b], and you brought upon them all this disaster.
  footnotes:
  - marker: a
    text: Or, 'they did not walk in your instruction.' The Hebrew torah can mean 'law' or 'instruction'; here it refers to God's covenantal teaching.
    reason: lexical_alternative
  - marker: b
    text: Or, 'you brought upon them all this calamity.' The Hebrew literally says 'you called to them all this disaster,' an idiom for bringing judgment upon them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 들어와 그 땅을 차지했지만, 당신의 음성을 듣지 않았고 당신의 율법을 따라 살지도 않았습니다.[a] 당신께서 그들에게 행하라고 명령하신 모든 일을 행하지 않았으며, 당신께서는 그들에게 이 모든 재앙을 내리셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 교훈을 따라 살지 않았다.’ 히브리어 토라(תּוֹרָה)는 ‘율법’ 또는 ‘가르침’을 뜻할 수 있으며, 여기서는 하나님의 언약적 가르침을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신께서 그들에게 이 모든 재앙을 불러오셨습니다.’ 히브리어는 문자적으로 ‘당신께서 그들에게 이 모든 재앙을 부르셨다’라고 하며, 심판이 그들에게 임하게 하셨다는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: They came in
  chosen_korean: 들어와
  alternatives_korean:
  - 들어왔고
  - 들어갔고
  - 들어왔습니다
  lexicon: HALOT
  rationale: 땅으로의 진입을 나타내는 동사로, 단순한 ‘오다’보다 ‘들어오다/들어가다’가 문맥을 더 분명히 드러냅니다.
- source_word: וַיִּרְשׁוּ אֹתָהּ
  english_pob_choice: took possession of it
  chosen_korean: 그것을 차지했지만
  alternatives_korean:
  - 그것을 소유했지만
  - 그것을 차지하였지만
  - 그것을 물려받았지만
  lexicon: HALOT
  rationale: 땅 문맥의 ירשׁ은 단순 소유가 아니라 실제 점유와 장악을 포함하므로, ‘차지하다’가 자연스럽게 그 의미를 살립니다.
- source_word: בְּקוֹלֶךָ
  english_pob_choice: your voice
  chosen_korean: 당신의 음성
  alternatives_korean:
  - 당신의 소리
  - 당신의 목소리
  - 당신의 말
  lexicon: HALOT
  rationale: 직역하면 ‘음성’이지만, 한국어에서는 단순 청취가 아니라 하나님의 말씀을 듣는 관계적 뉘앙스를 살리기 위해 ‘음성’으로 옮겼습니다.
- source_word: וּבְתוֹרֹתֶךָ
  english_pob_choice: your law
  chosen_korean: 당신의 율법 안에서
  alternatives_korean:
  - 당신의 율법에서
  - 당신의 가르침 안에서
  - 당신의 교훈 안에서
  lexicon: HALOT
  rationale: POB의 ‘law’를 따르되, 히브리어 תורה의 언약적 삶의 방식이라는 점을 반영하기 위해 ‘안에서 걷다’라는 관용을 살렸습니다.
- source_word: וַתַּקְרֵא אֹתָם אֵת כָּל הָרָעָה הַזֹּאת
  english_pob_choice: you brought upon them all this disaster
  chosen_korean: 당신은 그들 위에 이 모든 재앙을 내리셨습니다
  alternatives_korean:
  - 당신은 그들 위에 이 모든 재난을 가져오셨습니다
  - 당신은 그들에게 이 모든 재앙을 부르셨습니다
  - 당신은 그들에게 이 모든 재앙을 일으키셨습니다
  lexicon: HALOT
  rationale: קרא의 목적어 구성은 재앙을 사람에게 ‘불러오다/내리다’는 관용으로 이해되며, ‘내리셨습니다’가 한국어에서 가장 자연스럽게 심판의 도래를 표현합니다.
theological_decisions:
- issue: תורה의 번역
  chosen_reading: 율법
  alternative_readings:
  - 교훈
  - 가르침
  - 지침
  rationale: 예레미야 32장의 언약적 문맥에서는 תורה를 ‘율법’으로 옮기는 것이 하나님의 계약적 요구와 불순종의 대비를 가장 분명히 드러냅니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
- issue: הָרָעָה의 의미
  chosen_reading: 재앙
  alternative_readings:
  - 재난
  - 화
  - 악
  rationale: 이 문맥의 רָעָה는 도덕적 악이 아니라 심판으로 임한 재난을 가리키므로, 하나님이 도덕적 악을 행하신다는 오해를 피하면서도 강한 심판성을 살렸습니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean, not archaic or academic)
