source:
  edition: WLC
  text: וְ/עַתָּ֕ה לָ/כֵ֛ן כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אֶל הָ/עִ֨יר הַ/זֹּ֜את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִתְּנָה֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל בַּ/חֶ֖רֶב וּ/בָ/רָעָ֥ב וּ/בַ/דָּֽבֶר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/036.yaml
  text: 'Now therefore[a], thus says Yahweh, the God of Israel, concerning this city of which you say, ‘It has been given into the hand of the king of Babylon by the sword, by famine[b], and by pestilence’:'
  footnotes:
  - marker: a
    text: Or 'It is given into the hand of the king of Babylon.' The Hebrew form may be rendered as a simple passive rather than a progressive passive.
    reason: lexical_alternative
  - marker: b
    text: '''Pestilence'' may also be translated ''plague.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. ‘당신들이 “바빌론 왕의 손에, 칼과 기근과 전염병으로 넘겨졌다”라고 말하는 이 성에 관하여’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 성은 바빌론 왕의 손에 넘겨졌다’는 식의 단순 과거/완료로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘전염병’은 ‘역병’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제 그러므로
  - 그러므로 지금
  lexicon: HALOT
  rationale: 전환 표지와 귀결 표지를 함께 살리되, 한국어 문맥에서는 ‘그러므로 이제’가 가장 자연스럽고 예언 서두의 긴박함도 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 하나님의 고유명사 ‘야훼’를 사용해 히브리어 신명 자체를 드러냅니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하느님
  - 이스라엘의 주
  lexicon: HALOT
  rationale: עק점식 소유·정체성 구문으로서 자연스럽게 ‘이스라엘의 하나님’으로 옮기되, 언약적 호칭을 유지합니다.
- source_word: נִתְּנָה בְּיַד
  english_pob_choice: It has been given into the hand of
  chosen_korean: 손에 넘겨졌다
  alternatives_korean:
  - 손에 주어졌다
  - 권세 아래 넘겨졌다
  lexicon: HALOT
  rationale: ‘손에’는 통제권/지배권의 관용구이므로 ‘넘겨졌다’로 옮겨 정복과 이양의 뉘앙스를 살렸습니다.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  english_pob_choice: by the sword, by famine, and by pestilence
  chosen_korean: 칼과 기근과 전염병으로
  alternatives_korean:
  - 칼과 굶주림과 역병으로
  - 칼과 굶주림과 전염병으로
  lexicon: HALOT
  rationale: 예언적 심판의 삼중 공식은 한국어에서도 병렬적으로 유지하되, ‘דָּבֶר’은 POB의 ‘pestilence’에 맞춰 ‘전염병’으로 옮겼습니다.
theological_decisions:
- issue: 예언자 공식과 인용부의 종결 처리
  chosen_reading: “야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다”로 예언자 공식의 권위를 살리고, 뒤의 직접 인용은 원문이 절 끝에서 다음 구절로 이어지므로 닫지 않았습니다.
  alternative_readings:
  - 인용부를 닫아 완결된 문장으로 만들기
  - ‘말씀하십니다’ 대신 ‘말씀하셨습니다’로 과거화하기
  rationale: 히브리어는 다음 절과 연결되는 도입부이므로, 한국어도 미완결 인용 구조를 유지해야 본문 흐름과 수사적 긴장이 보존됩니다.
  doctrine_reference: 예언문 도입 공식의 문맥 보존
