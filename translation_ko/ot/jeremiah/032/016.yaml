lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  english_pob_choice: I prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도했습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: 히트파엘 פלל의 기본 뜻인 ‘기도하다’를 자연스럽게 옮기되, 뒤따르는 직접 화법을 받도록 동사 연결형으로 처리했습니다.
- source_word: סֵפֶר הַמִּקְנָה
  english_pob_choice: the deed of purchase
  chosen_korean: 매매 증서
  alternatives_korean:
  - 구매 증서
  - 매입 문서
  - 매매 문서
  lexicon: HALOT
  rationale: סֵפֶר은 여기서 일반 ‘책’이 아니라 법적 문서이고, הַמִּקְנָה는 매매/구입 행위를 가리키므로 한국어 법률 문맥에 자연스러운 ‘매매 증서’가 가장 가깝습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: project glossary
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮기고, 전통 교회식 완곡어 ‘주님’은 피했습니다.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  english_pob_choice: Baruch son of Neriah
  chosen_korean: 바룩, 네리야의 아들
  alternatives_korean:
  - 바룩 네리야의 아들
  - 바룩, 네리야의 아들
  lexicon: project transliteration policy
  rationale: 고유명사는 현대 음역을 따르고, הבן 관계는 한국어 성경에서 익숙한 ‘~의 아들’로 보존했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 직접 나타난 신명은 번역 전통의 완곡 처리보다 원문 식별성을 우선해야 하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'project glossary: יהוה / YHWH → 야훼'
