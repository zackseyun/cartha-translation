source:
  edition: WLC
  text: וַ/תִּתֵּ֤ן לָ/הֶם֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבוֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/022.yaml
  text: And you gave them this land[a], which you swore to their fathers to give them, a land flowing with milk and honey.
  footnotes:
  - marker: a
    text: Or 'their ancestors.' The Hebrew says 'their fathers,' referring to Israel's forefathers/patriarchs.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 이 땅을 그들에게 주셨습니다[a]. 곧 주님께서 그들의 조상들에게 주시기로 맹세하신, 젖과 꿀이 흐르는 땅입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 조상들'입니다. 히브리어는 '그들의 아버지들'이라고 되어 있으며, 이스라엘의 조상들, 곧 족장들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן / And you gave
  english_pob_choice: And you gave
  chosen_korean: 주님께서 이 땅을 그들에게 주셨습니다
  alternatives_korean:
  - 그들에게 이 땅을 주셨습니다
  - 그 땅을 그들에게 베푸셨습니다
  lexicon: HALOT
  rationale: 주신다/주셨다로 נתן의 기본 의미를 직접 살리고, 기도문맥의 하나님 직접 호칭을 자연스럽게 반영했습니다.
- source_word: הָאָרֶץ הַזֹּאת / this land
  english_pob_choice: this land
  chosen_korean: 이 땅
  alternatives_korean:
  - 이 나라
  - 이 지역
  lexicon: HALOT
  rationale: 언약과 약속의 문맥에서 אֶרֶץ는 '땅'이 가장 정확하며, '이'로 지시성을 보존했습니다.
- source_word: לַאֲבוֹתָם / to their fathers
  english_pob_choice: to their fathers
  chosen_korean: 그들의 조상들에게
  alternatives_korean:
  - 그들의 아버지들에게
  - 그들의 선조들에게
  lexicon: HALOT
  rationale: 히브리어의 문자적 '아버지들'을 한국어에서는 족장들을 가리키는 관용적 표현인 '조상들'로 옮기되, 남성형 집합 명칭의 계보적 뜻을 유지했습니다.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ / a land flowing with milk and honey
  english_pob_choice: a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 젖과 꿀이 흐르는 땅
  - 젖과 꿀이 흐르는 땅이다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어 성경 문체로 자연스럽게 살리면서도, 풍요와 언약 복의 이미지를 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 직접적인 하나님 호칭의 문체
  chosen_reading: 주님께서 … 주셨습니다
  alternative_readings:
  - 당신께서 … 주셨습니다
  - 하나님께서 … 주셨습니다
  rationale: 예레미야의 기도에서 하나님께 직접 말하는 형식을 한국어 합쇼체로 유지하면서, 지나치게 설명적인 번역을 피했습니다.
  doctrine_reference: 'POB translation philosophy: source-direct prayer address'
