source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵ֠לַ/י חֲנַמְאֵ֨ל בֶּן דֹּדִ֜/י כִּ/דְבַ֣ר יְהוָה֮ אֶל חֲצַ֣ר הַ/מַּטָּרָה֒ וַ/יֹּ֣אמֶר אֵלַ֡/י קְנֵ֣ה נָ֠א אֶת שָׂדִ֨/י אֲשֶׁר בַּ/עֲנָת֜וֹת אֲשֶׁ֣ר בְּ/אֶ֣רֶץ בִּנְיָמִ֗ין כִּֽי לְ/ךָ֞ מִשְׁפַּ֧ט הַ/יְרֻשָּׁ֛ה וּ/לְ/ךָ֥ הַ/גְּאֻלָּ֖ה קְנֵה לָ֑/ךְ וָ/אֵדַ֕ע כִּ֥י דְבַר יְהוָ֖ה הֽוּא־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/008.yaml
  text: Then Hanamel the son of my uncle came to me in the court of the guard[a], according to the word of Yahweh, and he said to me, “Please buy my field that is at Anathoth, in the land of Benjamin, for the right of inheritance is yours and the redemption is yours. Buy it for yourself.” Then I knew that this was the word of Yahweh.
  footnotes:
  - marker: a
    text: Or, more explicitly, “the right of redemption is yours.” The Hebrew says literally, “the redemption is yours,” referring to the kinship-based legal right or duty to redeem family property.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내 숙부의 아들 하나멜이 감옥 뜰[a]에 야훼의 말씀대로 내게 와서 말했습니다. “제발 내 아나돗에 있는 밭, 곧 베냐민 땅에 있는 그 밭을 사 주십시오. 상속권은 당신에게 있고 속량할 권리도 당신에게 있습니다. 당신을 위해 사십시오.” 그때 나는 이것이 야훼의 말씀인 줄 알았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “감옥 뜰”은 히브리어 חֲצַר הַמַּטָּרָה의 직역에 가까우며, POB의 ‘court of the guard’와 같은 구금·감시 공간을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֲצַר הַמַּטָּרָה
  english_pob_choice: the court of the guard
  chosen_korean: 감옥 뜰
  alternatives_korean:
  - 경비 뜰
  - 보초 뜰
  - 감옥 안뜰
  lexicon: HALOT
  rationale: 구금된 장소라는 핵심을 살리되, ‘court’의 뜰/마당 이미지와 ‘guard’의 억류 맥락을 함께 드러내는 간결한 표현으로 옮겼습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼께서 말씀하신 대로
  lexicon: HALOT
  rationale: כְּ + דָּבָר의 ‘~대로/~에 따라’라는 합치 관계를 자연스럽게 살렸고, POB의 야훼를 한국어 본문에서도 일관되게 반영했습니다.
- source_word: מִשְׁפַּט הַיְרֻשָּׁה
  english_pob_choice: the right of inheritance
  chosen_korean: 상속권
  alternatives_korean:
  - 상속의 권리
  - 유산 권리
  - 상속할 권리
  lexicon: HALOT
  rationale: 미쉬파트의 법적 권리/청구권 의미를 살려, 한국어 법률 감각에도 자연스러운 ‘상속권’으로 압축했습니다.
- source_word: הַגְּאֻלָּה
  english_pob_choice: the redemption
  chosen_korean: 속량할 권리
  alternatives_korean:
  - 속량권
  - 구속의 권리
  - 구속 책임
  lexicon: HALOT
  rationale: 단순 ‘구속’보다 친족 재산을 되찾는 법적 권리·의무를 드러내기 위해 기능적 표현을 택했습니다. POB 각주가 지적한 법적 뉘앙스를 본문에 반영했습니다.
- source_word: קְנֵה לָךְ
  english_pob_choice: Buy it for yourself
  chosen_korean: 당신을 위해 사십시오
  alternatives_korean:
  - 스스로 사십시오
  - 당신의 것으로 사십시오
  - 당신 자신을 위해 사십시오
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 대화체 요청의 정중함을 유지했습니다. 목적어 ‘it’은 앞의 밭을 가리키는 것으로 문맥상 충분히 회복됩니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 원칙에 따라 고유한 언약 이름을 제목어로 대체하지 않고 음역해, 본문이 지닌 인격적·언약적 호칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나멜의 요청문체
  chosen_reading: 직접화법의 청유를 ‘제발 … 사 주십시오’로 옮겨 정중한 요청으로 유지했습니다.
  alternative_readings:
  - 부디 … 사십시오
  - 간청합니다, … 사십시오
  rationale: נָא의 완곡 요청을 한국어 합쇼체로 반영해, 화자의 태도와 장면의 긴급성을 함께 살렸습니다.
  doctrine_reference: 'Korean style guideline: modern formal-polite with honorifics in direct address'
