review_pass:
  verdict: revise
  source_fidelity: ‘내 아나돗에 있는 밭’은 히브리어의 소유 관계를 잘못 연결합니다. שָׂדִי는 ‘내 밭’이고, 아나돗은 그 밭의 소재지입니다. 또한 חֲצַר הַמַּטָּרָה는 감옥 자체라고 단정하기보다 경비·감시 아래 있는 뜰로 옮기는 편이 원문과 영어 POB의 절제된 표현에 더 충실합니다.
  naturalness: ‘당신을 위해 사십시오’는 한국어에서 다소 부자연스럽고 무엇을 사는지도 흐립니다. ‘당신의 것으로 사십시오’가 לָךְ의 뜻과 앞선 밭을 자연스럽게 드러냅니다. 첫 요청의 ‘사 주십시오’는 하나멜을 위한 행위라는 뉘앙스를 더할 수 있으므로 ‘사십시오’가 적절합니다.
  terminology: 야훼, 하나멜, 아나돗, 베냐민은 적절합니다. ‘상속권’과 ‘속량권’은 각각 מִשְׁפַּט הַיְרֻשָּׁה와 הַגְּאֻלָּה의 법적 의미를 간결하게 전달합니다. 속량권의 친족 재산 회복 관련 의미는 각주로 보완합니다.
  issues:
  - severity: high
    issue: ‘내 아나돗에 있는 밭’
    rationale: 원문은 ‘아나돗에 있는 내 밭’입니다. 현재 표현은 아나돗을 화자의 소유물처럼 읽히게 하며, 밭의 소유·위치를 부정확하게 연결합니다.
  - severity: medium
    issue: ‘감옥 뜰’
    rationale: חֲצַר הַמַּטָּרָה는 경비·감시의 뜰을 가리키며, ‘감옥’은 장소의 성격을 다소 과도하게 특정합니다. ‘경비대 뜰’이 영어 POB의 court of the guard 및 원문의 표현에 가깝습니다.
  - severity: medium
    issue: ‘사 주십시오’ 및 ‘당신을 위해 사십시오’
    rationale: 첫 표현은 한국어의 수혜 의미를 불필요하게 더하고, 둘째 표현은 목적어가 불분명하며 어색합니다. 원문의 두 명령은 각각 정중한 요청과 ‘당신 자신의 것으로’라는 뜻입니다.
  revised_text: 그때 내 숙부의 아들 하나멜이 야훼의 말씀대로 경비대 뜰[a]에 있는 내게 와서 말했습니다. “제발 베냐민 땅 아나돗에 있는 내 밭을 사십시오. 상속권은 당신에게 있고 속량권도 당신에게 있습니다. 당신의 것으로 사십시오.” 그때 나는 이것이 야훼의 말씀인 줄 알았습니다.
  revised_footnotes:
  - marker: a
    text: ‘경비대 뜰’은 히브리어 חֲצַר הַמַּטָּרָה를 옮긴 말로, 예레미야가 감시 아래 있었던 경비 구역의 뜰을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘속량권’은 친족의 재산을 되찾기 위해 매입할 수 있는 친족 관계상의 법적 권리 또는 책임을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 아나돗과 밭의 관계를 원문대로 바로잡고, 구금 장소를 과도하게 특정하지 않도록 ‘경비대 뜰’로 조정했습니다. 직접화법에서는 נָא의 완곡한 요청을 ‘제발’로 살리되, ‘사 주십시오’의 수혜 뉘앙스를 제거했습니다. הַגְּאֻלָּה의 법적 의미는 본문의 ‘속량권’과 보충 각주로 보존했습니다.
