id: JER.32.3
reference: Jeremiah 32:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֣ר כְּלָא֔/וֹ צִדְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹ֑ר מַדּוּעַ֩ אַתָּ֨ה נִבָּ֜א לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֥יר הַ/זֹּ֛את בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/003.yaml
  text: 'because Zedekiah king of Judah had confined him[a], saying, “Why do you prophesy, saying, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will capture it’?”'
  footnotes:
  - marker: a
    text: Or, 'had shut him up' or 'had imprisoned him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 시드기야가 그를 가두었기 때문입니다[a]. 시드기야가 말하였습니다. “왜 네가 ‘야훼께서 이렇게 말씀하십니다. 보라, 내가 이 성을 바벨론 왕의 손에 넘기겠다. 그가 이 성을 점령할 것이다’라고 말하며 예언하느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 가두어 두었기’ 또는 ‘그를 투옥하였기’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 왜냐하면
  - -한 까닭입니다
  lexicon: HALOT
  rationale: 문맥상 앞절과 연결되는 원인 절이므로, 한국어에서는 자연스러운 원인 표지인 ‘때문입니다’로 옮겨 인과 관계를 분명히 했습니다.
- source_word: כְּלָאוֹ
  english_pob_choice: had confined him
  chosen_korean: 그를 가두었기
  alternatives_korean:
  - 그를 가두었기
  - 그를 가두어 두었기
  - 그를 옥에 가두었기
  lexicon: HALOT
  rationale: כלא의 핵심은 ‘가두다/구금하다’이므로, POB의 ‘had confined him’에 맞춰 간결하게 ‘그를 가두었기’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙대로 신명기적 고유명사로서 יְהוָה를 ‘야훼’로 음역해, 본문의 언약적 신명 사용을 유지했습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에 넘기겠으니
  alternatives_korean:
  - 손에 주겠으니
  - 권세 아래 넘기겠으니
  - 손에 맡기겠으니
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 살리되, ‘넘기다’로 결과를 자연스럽게 드러내어 ‘into the hand of’의 통치·처분 뉘앙스를 보존했습니다.
- source_word: וּלְכָדָהּ
  english_pob_choice: and he will capture it
  chosen_korean: 그가 이 성을 점령할 것입니다
  alternatives_korean:
  - 그가 이 성을 사로잡을 것입니다
  - 그가 이 성을 함락할 것입니다
  - 그가 이 성을 점령하겠습니다
  lexicon: HALOT
  rationale: לכד는 성읍을 군사적으로 ‘점령/함락’하는 뜻이므로, 현대 문체에서 가장 자연스럽고 정확한 ‘점령할 것입니다’를 선택했습니다.
theological_decisions:
- issue: 예언 인용 안의 신명 호칭과 문체
  chosen_reading: 인용문 안에서는 ‘야훼께서 이렇게 말씀하십니다’로 옮기고, 이어지는 직접 인용도 현재형 선언문으로 유지했습니다.
  alternative_readings:
  - ‘여호와께서 이같이 말씀하시되’
  - ‘주께서 말씀하십니다’
  rationale: 예언 공식의 고유성을 유지하면서도 합쇼체 문체를 지켜, 왕의 항의 속에 들어 있는 야훼의 선언이 현재적·권위적으로 들리게 했습니다.
  doctrine_reference: POB rendering policy for YHWH and prophetic formulae
