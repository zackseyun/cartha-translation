    rationale: 히브리어 ‘내가 이 성을 바벨론 왕의 손에 넘긴다, 그리고 그가 그것을 점령할 것이다’는 두 선언을 וְ로 연결합니다. ‘-겠으니’는 뒤 절을 앞 절의 귀결처럼 만들 수 있으므로, 마침표로 분리하여 병렬성을 보존하는 것이 안전합니다.
