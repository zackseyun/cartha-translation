  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וּלְכָדָהּ의 접속은 단순한 병렬·결과 진술인데, 초안의 ‘넘기겠으니’는 이유·귀결의 뉘앙스를 더합니다. 이를 두 독립된 미래 선언으로 옮기는 편이 원문에 더 가깝습니다.
  naturalness: ‘그가 말하였습니다’는 선행 주어를 가리키지만, 절이 분리된 한국어 문장에서는 ‘시드기야가’라고 밝혀 주는 편이 자연스럽고 명료합니다. 또한 인용 안에서 ‘왜 네가 예언하면서 …라고 하느냐?’는 현대 표준어로 자연스럽습니다.
  terminology: ‘야훼’, ‘유다 왕 시드기야’, ‘바벨론 왕’, ‘성’, ‘점령하다’는 적절합니다. 예언 공식은 합쇼체에 맞게 ‘야훼께서 이렇게 말씀하십니다’로 유지할 수 있습니다.
