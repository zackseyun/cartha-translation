  rationale: 원문의 원인절과 시드기야의 직접 발화를 유지하되, 문장 분리로 생길 수 있는 화자 모호성을 해소했습니다. 또한 바벨론 왕에게 성을 넘기는 선언과 그 왕이 성을 점령하는 선언을 병렬 미래문으로 옮겨 히브리어 접속의 의미를 보존했습니다.
