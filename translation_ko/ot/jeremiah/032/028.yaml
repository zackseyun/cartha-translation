  source_fidelity: 본문의 인과 접속, 예언자적 선언, ‘손에 넘기다’ 관용구, 갈대아 사람들과 바빌론 왕의 병렬, 그리고 마지막 단수 동사의 의미를 충실히 옮겼습니다. 다만 마지막의 ‘그것’은 선행하는 여성 단수 ‘이 성읍’을 가리키지만 한국어에서는 지시 대상이 불필요하게 약해지므로 ‘그 성읍’으로 명시하는 것이 자연스럽고 의미도 정확히 보존합니다.
  naturalness: 전반적으로 현대 표준어 합쇼체의 격식 있는 예언서 문체에 잘 맞습니다. ‘그가 그것을 점령할 것입니다’는 문법상 가능하나 도시를 가리키는 한국어 표현으로는 다소 부자연스럽습니다. 또한 이름 이형에 관한 각주는 해당 이름 바로 뒤에 두는 것이 독자의 이해와 각주 앵커의 기능에 맞습니다.
