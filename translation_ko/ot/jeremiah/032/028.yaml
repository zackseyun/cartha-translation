id: JER.32.28
reference: Jeremiah 32:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֣י נֹתֵן֩ אֶת הָ/עִ֨יר הַ/זֹּ֜את בְּ/יַ֣ד הַ/כַּשְׂדִּ֗ים וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/028.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am giving this city into the hand of the Chaldeans and into the hand of Nebuchadnezzar king of Babylon, and he will capture it.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; traditionally rendered ''Nebuchadnezzar'' in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 이 성읍을 갈대아 사람들의 손과 바빌론 왕 느부갓네살의 손에 넘겨주겠고, 그가 그것을 점령할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 ‘느부갓레살’에 더 가깝지만, 한국어에서 널리 익숙한 관용형 ‘느부갓네살’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: HALOT
  rationale: 앞선 내용에 대한 결과와 결론을 잇는 표지이므로, 문어체 합쇼체에서 가장 자연스러우면서도 논리 연결을 살리는 ‘그러므로’로 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 이렇게 말씀하십니다
  - 야훼께서 말씀하시기를 이러합니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어로 자연스럽게 살리되, 하나님의 이름은 본문 원어에 따라 ‘야훼’로 유지했습니다. ‘이렇게 말씀하십니다’는 합쇼체에서 선포문체를 유지합니다.
- source_word: הִנְנִי נֹתֵן
  english_pob_choice: Behold, I am giving
  chosen_korean: 보십시오, 내가 … 넘겨주겠고
  alternatives_korean:
  - 보라, 내가 … 주고 있다
  - 보십시오, 내가 … 주겠습니다
  lexicon: HALOT
  rationale: ‘הִנְנִי’의 지시적·강조적 기능은 ‘보십시오’로, 진행/임박의 현재 분사는 결과적 약속을 살리는 ‘넘겨주겠고’로 옮겼습니다. 한국어에서 단순 ‘주다’보다 ‘넘겨주다’가 뒤의 ‘손에’라는 관용구와 더 잘 맞습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 권세 아래
  - 지배 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 과도하게 풀지 않고 ‘손에’로 유지하여 원문의 비유적 통치·지배 감각을 보존했습니다.
- source_word: וּלְכָדָהּ
  english_pob_choice: and he will capture it
  chosen_korean: 그가 그것을 점령할 것입니다
  alternatives_korean:
  - 그가 그것을 포로로 잡을 것입니다
  - 그가 그것을 함락시킬 것입니다
  lexicon: HALOT
  rationale: 성읍을 대상으로 한 לָכַד는 단순 ‘잡다’보다 군사적 함락/점령의 뜻이 분명하므로, 문맥에 맞게 ‘점령하다’로 옮겼습니다. 이는 도시의 함락을 예고하는 본문의 힘을 분명하게 드러냅니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 판본의 기준 용례에 따라 하나님의 고유명은 일반 호칭으로 완화하지 않고 원문 대응성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘그가 그것을 점령할 것입니다’의 주어 처리
  chosen_reading: 느부갓네살을 앞선 가장 가까운 단수 선행사로 받아 단수 주어 ‘그가’를 유지했습니다.
  alternative_readings:
  - 갈대아 사람들을 집단 주어로 이해하여 ‘그들이’
  - 피동적으로 ‘그 성읍이 점령될 것입니다’
  rationale: 히브리어 동사의 단수형과 직전의 ‘바빌론 왕 느부갓네살’이라는 단수 명칭을 따라, 원문의 문법적 단수를 한국어에서도 유지했습니다.
  doctrine_reference: 문법-의미 정합성
