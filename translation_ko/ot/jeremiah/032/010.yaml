id: JER.32.10
reference: Jeremiah 32:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶכְתֹּ֤ב בַּ/סֵּ֨פֶר֙ וָֽ/אֶחְתֹּ֔ם וָ/אָעֵ֖ד עֵדִ֑ים וָ/אֶשְׁקֹ֥ל הַ/כֶּ֖סֶף בְּ/מֹאזְנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/010.yaml
  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
  footnotes:
  - marker: a
    text: Or 'in the scroll' or 'in the document'; the Hebrew סֵפֶר is a general term for a written document, here likely the purchase deed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제가 그것을 문서에 적고, 봉인하고, 증인들을 불러 세우고, 저울에 은을 달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סֵפֶר는 여기서 일반적으로 ‘문서’이지만, 문맥상 매매 증서의 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְתֹּב
  english_pob_choice: So I wrote
  chosen_korean: 그래서 제가 적고
  alternatives_korean:
  - 그리고 제가 적고
  - 그다음 제가 적고
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 순차 서술을 자연스러운 한국어로 옮기되, 예레미야의 1인칭 행위를 분명히 드러내기 위해 ‘제가’로 처리했습니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: in the deed
  chosen_korean: 문서에
  alternatives_korean:
  - 증서에
  - 두루마리에
  - 책에
  lexicon: HALOT
  rationale: סֵפֶר는 넓게는 기록문서이지만, 여기서는 토지 매매 맥락의 법적 문서이므로 ‘문서’가 가장 무난하게 원문의 기능을 살립니다.
- source_word: וָאָעֵד עֵדִים
  english_pob_choice: called witnesses
  chosen_korean: 증인들을 불러 세우고
  alternatives_korean:
  - 증인들을 불러
  - 증인들을 세우고
  lexicon: HALOT
  rationale: עוּד + עֵדִים의 법정적 뜻을 살려 단순한 목격이 아니라 거래를 확인하도록 증인들을 소집하는 행위를 드러냈습니다.
- source_word: הַכֶּסֶף בְּמֹאזְנָיִם
  english_pob_choice: the silver on the scales
  chosen_korean: 저울에 은을 달았습니다
  alternatives_korean:
  - 저울에서 은을 달았습니다
  - 저울 위에 은을 달았습니다
  lexicon: HALOT
  rationale: כֶּסֶף를 ‘은’으로, מֹאזְנַיִם을 ‘저울’로 옮겨 실제 거래에서 무게로 지불하는 구체성을 보존했습니다.
theological_decisions:
- issue: 법적 절차의 누적 동사열을 어떻게 한국어로 살릴지
  chosen_reading: ‘적고, 봉인하고, 증인들을 불러 세우고, 저울에 은을 달았습니다’처럼 동사열을 순차적으로 유지했습니다.
  alternative_readings:
  - 문서에 기록하고 봉인한 뒤 증인을 세우고 은을 달았습니다.
  - 문서에 적어 봉인하고 증인들을 세우며 은을 달았습니다.
  rationale: 본문은 거래의 공식 절차를 단계적으로 나열하므로, 한국어에서도 절차의 차례와 공적 성격이 흐려지지 않도록 병렬 구조를 유지했습니다.
  doctrine_reference: 본문의 서술 구조 보존 원칙
