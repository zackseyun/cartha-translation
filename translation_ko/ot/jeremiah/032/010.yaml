  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
  footnotes:
  - marker: a
    text: Or 'in the scroll' or 'in the document'; the Hebrew סֵפֶר is a general term for a written document, here likely the purchase deed.
