    rationale: וְהָעִיר은 단순 접속도 가능하지만 이 문맥에서는 앞 명령에 대한 예레미야의 난점을 제시합니다. 영어 POB도 ‘though’로 처리합니다. ‘그런데도 성읍은 … 넘겨졌는데’로 연결하면 해석을 과도하게 확정하지 않으면서 문맥적 대조를 보존합니다.
