id: JER.32.25
reference: Jeremiah 32:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ אֵלַ/י֙ אֲדֹנָ֣/י יְהוִ֔ה קְנֵֽה לְ/ךָ֧ הַ/שָּׂדֶ֛ה בַּ/כֶּ֖סֶף וְ/הָעֵ֣ד עֵדִ֑ים וְ/הָ/עִ֥יר נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/025.yaml
  text: Yet you yourself said to me[a], Lord Yahweh[b], ‘Buy the field for yourself with silver and call witnesses,’ though the city has been given into the hand of the Chaldeans.
  footnotes:
  - marker: a
    text: Or, 'while the city has been given into the hand of the Chaldeans.' The Hebrew conjunction can be read more simply as 'and/while'; the main text brings out the concessive force in Jeremiah's complaint.
    reason: alternative_reading
  - marker: b
    text: '''Chaldeans'' refers to the Babylonian power.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 주 야훼여, 당신께서는 저에게 “너를 위하여 은으로 밭을 사고 증인들을 세우라”고 말씀하셨습니다. 그런데도 성읍은 갈대아 사람들의 손에 넘겨졌는데 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 사람들’은 바빌로니아 세력을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: Yet you yourself
  chosen_korean: 그러나 당신께서는
  alternatives_korean:
  - 그리고 당신께서는
  - 그런데 당신께서는
  lexicon: HALOT
  rationale: 대조를 이루는 접속과 강조 대명사의 힘을 살리기 위해 역접을 분명히 하되, 한국어에서는 자연스럽게 ‘당신께서는’으로 강조를 표현했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 본문의 직접적인 신명 יְהוִה를 프로젝트 기본값대로 ‘야훼’로 옮기고, 아도나이와 결합된 호칭은 ‘주’로 처리했습니다.
- source_word: קְנֵה לְךָ הַשָּׂדֶה בַּכֶּסֶף
  english_pob_choice: Buy the field for yourself with silver
  chosen_korean: 은으로 밭을 사서
  alternatives_korean:
  - 자기에게 밭을 사서
  - 돈으로 밭을 사서
  lexicon: HALOT
  rationale: 명령문의 핵심 행위는 ‘밭을 사라’이므로 자연스러운 한국어로 옮기되, לְךָ의 개인적 관련성은 문맥상 ‘당신께서는’과 동사의 직결 구조로 충분히 드러난다고 보았습니다.
- source_word: וְהָעֵד עֵדִים
  english_pob_choice: and call witnesses
  chosen_korean: 증인들을 세우라
  alternatives_korean:
  - 증인들을 부르라
  - 증인들을 세워두라
  lexicon: HALOT
  rationale: 법정적 맥락에서 히필 ‘증인들을 확보하다/세우다’의 의미를 살려, 단순 호명보다 공적 증거를 마련하는 뉘앙스를 살렸습니다.
- source_word: וְהָעִיר נִתְּנָה בְּיַד הַכַּשְׂדִּים
  english_pob_choice: though the city has been given into the hand of the Chaldeans
  chosen_korean: 그런데 성읍은 이미 갈대아 사람들의 손에 넘겨졌습니다
  alternatives_korean:
  - 그런데 성읍은 갈대아 사람들의 손에 주어졌습니다
  - 성읍은 갈대아 사람들의 손에 넘어갔습니다
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용구를 유지하고, נִתְּנָה를 ‘넘겨졌습니다’로 옮겨 현재 결과를 드러냈습니다. ‘갈대아 사람들’은 본문의 민족명 자체를 반영합니다.
theological_decisions:
- issue: 아도나이+신명 결합 호칭의 한국어 표기
  chosen_reading: 주 야훼
  alternative_readings:
  - 주 하나님
  - 주 여호와
  rationale: 본문의 신명은 직접 옮기고, 아도나이의 경칭은 ‘주’로 유지해 두 요소를 구분했습니다. 이는 전통적 ‘주 하나님’보다 원문 대응성이 높습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for יְהוָה; translation philosophy #1, #6'
