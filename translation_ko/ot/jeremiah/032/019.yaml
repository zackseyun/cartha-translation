id: JER.32.19
reference: Jeremiah 32:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גְּדֹל֙ הָֽ/עֵצָ֔ה וְ/רַ֖ב הָ/עֲלִֽילִיָּ֑ה אֲשֶׁר עֵינֶ֣י/ךָ פְקֻח֗וֹת עַל כָּל דַּרְכֵי֙ בְּנֵ֣י אָדָ֔ם לָ/תֵ֤ת לְ/אִישׁ֙ כִּ/דְרָכָ֔י/ו וְ/כִ/פְרִ֖י מַעֲלָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/019.yaml
  text: great in counsel and mighty in deed[a], whose eyes are open upon all the ways of the sons of man, to give to each man according to his ways and according to the fruit of his deeds.
  footnotes:
  - marker: a
    text: Or 'all the ways of humankind.' The Hebrew 'sons of man' is a collective expression for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 계획이 크시고 행하심에 능하시며, 주님의 눈은 모든 사람의 모든 길[a]을 향해 열려 있어 각 사람에게 그의 길대로, 그의 행위의 열매대로 주십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사람의 아들들’은 모든 인간을 가리키는 집합 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדֹל הָעֵצָה
  english_pob_choice: great in counsel
  chosen_korean: 계획에 있어 크시다
  alternatives_korean:
  - 모략에 크시다
  - 권고에 크시다
  - 지략에 크시다
  lexicon: HALOT
  rationale: עֵצָה는 조언, 계획, 의도까지 아우르므로 ‘계획’으로 옮겨 하나님의 지혜와 의도를 자연스럽게 드러냈습니다.
- source_word: רַב הָעֲלִילִיָּה
  english_pob_choice: mighty in deed
  chosen_korean: 행하심에 능하시다
  alternatives_korean:
  - 행동에 크시다
  - 일하심이 많으시다
  - 행위가 크시다
  lexicon: HALOT
  rationale: עֲלִילִיָּה는 행위, 이루심, 업적의 뜻이 있어 ‘행하심에 능하시다’로 옮겨 앞부분과 대구를 이루게 했습니다.
- source_word: עֵינֶיךָ פְקֻחוֹת
  english_pob_choice: whose eyes are open
  chosen_korean: 주님의 눈은 … 열려 있어
  alternatives_korean:
  - 주님의 눈은 … 감겨 있지 않아
  - 주님의 눈은 … 보고 있어
  lexicon: HALOT
  rationale: 하나님의 전지와 감찰을 나타내는 신체적 표현을 추상화하지 않고, ‘눈이 열려 있다’는 구체적 이미지를 살렸습니다.
- source_word: בְּנֵי אָדָם / אִישׁ
  english_pob_choice: sons of man / each man
  chosen_korean: 사람 / 각 사람
  alternatives_korean:
  - 인간 / 각자
  - 인류 / 각 사람
  lexicon: HALOT
  rationale: 히브리어의 남성형 대표 표현을 한국어에서는 자연스러운 일반 명사 ‘사람’으로 옮겨, 집합적 의미를 보존하면서도 현대 독자가 읽기 쉽게 했습니다.
- source_word: כִּדְרָכָיו / וְכִפְרִי מַעֲלָלָיו
  english_pob_choice: according to his ways / and according to the fruit of his deeds
  chosen_korean: 그의 길대로, 그의 행위의 열매대로
  alternatives_korean:
  - 그의 행실대로, 그의 행위의 결과대로
  - 그의 길에 따라, 그의 행실의 열매에 따라
  lexicon: HALOT
  rationale: ‘길’과 ‘열매’의 반복된 비유를 유지해 행위에 따른 보응이라는 히브리어의 도덕적 대응 구조를 드러냈습니다.
theological_decisions:
- issue: 하나님의 감찰을 나타내는 신체적 언어
  chosen_reading: ‘주님의 눈은 사람의 모든 길에 열려 있어’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 주님은 모든 사람의 길을 다 아십니다
  - 주님은 사람의 모든 길을 지켜보십니다
  rationale: 본문은 하나님의 전지성을 추상 진술이 아니라 생생한 이미지로 표현하므로, 그 문학적 힘을 보존하는 쪽이 본문 의미에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 보응의 기준을 나타내는 남성형 대표 표현
  chosen_reading: ‘각 사람’으로 옮겨 히브리어 단수 대표성을 보존했습니다.
  alternative_readings:
  - 각자에게
  - 각 사람에게
  rationale: 히브리어는 보편적 인간을 가리키는 대표적 단수 표현을 사용하므로, 한국어에서도 의미를 일반화하되 본문의 응답 구조는 유지했습니다.
  doctrine_reference: 'Translation philosophy §4; Contested terms: אָדָם'
