  verdict: revise
  source_fidelity: 히브리어의 대구(‘계획에 크시고/행하심에 능하시며’), 하나님의 눈이 모든 인간의 길에 열려 있다는 신체적 심상, 그리고 각 사람의 길과 행위의 열매에 따른 부여라는 구조를 대체로 충실히 반영했습니다. 다만 ‘사람의 모든 길’은 집합적 ‘사람들’과 각자의 다양한 삶의 길이라는 범위를 충분히 드러내지 못할 수 있어 ‘모든 사람의 모든 길’로 명확히 했습니다.
