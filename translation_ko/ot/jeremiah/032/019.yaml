  terminology: ‘계획’, ‘행하심’, ‘길’, ‘행위의 열매’는 원문의 의도·행위·삶의 방식·결과라는 비유를 무리 없이 보존합니다. ‘주님’과 합쇼체 높임말도 본문 전체에서 일관됩니다. 각 사람을 가리키는 히브리어의 대표적 단수는 ‘각 사람’ 및 ‘그의’로 유지했습니다.
