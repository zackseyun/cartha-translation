base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/002.yaml
  text: At that time the army of the king of Babylon was besieging Jerusalem[a], and Jeremiah the prophet was confined in the court of the guard[b], which was in the house of the king of Judah.
  footnotes:
  - marker: a
    text: Or 'was laying siege to Jerusalem.'
    reason: lexical_alternative
  - marker: b
    text: '''House of the king of Judah'' refers to the royal palace complex.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 바벨 왕의 군대가 예루살렘을 포위하고 있었고, 예언자 예레미야는 유다 왕의 집에 있는 경호대 뜰에 갇혀 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포위하고 있었습니다’는 직역적 표현이고, ‘공성하고 있었습니다’도 가능한 번역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘경호대 뜰’은 ‘경비대 뜰’ 또는 ‘경비 뜰’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘유다 왕의 집’은 왕궁 전체를 가리키는 말입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אָז
  english_pob_choice: At that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 무렵
  - 그 시각
  lexicon: HALOT
  rationale: 시간 전환을 알리는 담화 표지이므로, 서술 흐름을 자연스럽게 여는 ‘그때’로 옮겼습니다.
- source_word: צָרִים עַל
  english_pob_choice: was besieging
  chosen_korean: 포위하고 있었고
  alternatives_korean:
  - 공성하고 있었고
  - 포위 중이었고
  lexicon: HALOT
  rationale: 군사적 압박 상태를 한국어로 자연스럽게 살리기 위해 ‘포위하고 있었다’로 풀어, 진행 중인 포위 상황을 드러냈습니다.
- source_word: הָיָה כָלוּא
  english_pob_choice: was confined
  chosen_korean: 갇혀 있었습니다
  alternatives_korean:
  - 구금되어 있었습니다
  - 감금되어 있었습니다
  lexicon: HALOT
  rationale: 단순한 투옥보다 현재의 구속 상태를 강조하는 표현으로, 뒤의 위치 구문과 함께 감시 아래 묶여 있던 상태를 반영합니다.
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  english_pob_choice: in the court of the guard
  chosen_korean: 경호대 뜰
  alternatives_korean:
  - 경비대 뜰
  - 경비 뜰
  lexicon: HALOT
  rationale: ‘court of the guard’의 제도적·공간적 의미를 살려, 너무 현대적이거나 군영화된 표현보다 ‘경호대 뜰’로 옮겼습니다.
theological_decisions:
- issue: 예언자 예레미야의 신분 표지
  chosen_reading: ‘예언자 예레미야’로 직역하여 직함을 분명히 드러냈습니다.
  alternative_readings:
  - ‘선지자 예레미야’
  - 직함 없이 ‘예레미야’
  rationale: 히브리어의 명시적 호칭 הַנָּבִיא를 그대로 반영해 예레미야의 공적 역할을 문맥 속에서 분명히 보여 주는 편이 더 source-direct합니다.
  doctrine_reference: prophetic office / narrative identification
