translation:
  language: ko
  text: 그때 바벨론 왕의 군대가 예루살렘을 포위하고 있었으며[a], 예언자 예레미야는 유다 왕의 궁정[c]에 있는 경비대 뜰[b]에 갇혀 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예루살렘을 포위하고 있었다’는 ‘예루살렘을 포위 공격하고 있었다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경비대 뜰’은 경비와 감시 아래 있던 뜰 또는 구금 구역을 가리킵니다. ‘경비의 뜰’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘유다 왕의 궁정’은 왕의 거처와 행정 시설을 포함한 왕궁 복합체를 가리킵니다.
    reason: cultural_note
