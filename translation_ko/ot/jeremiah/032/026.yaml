lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 … 임하여
  alternatives_korean:
  - 그리고 … 일어났습니다
  - 그리고 … 왔습니다
  - 그때 … 이르렀습니다
  lexicon: HALOT
  rationale: 서사 전환을 여는 와우 연속의 흐름을 한국어에서는 '그때'와 '임하여'로 자연스럽게 살리되, 예언 공식의 격식을 유지했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언자적 정형구인 'the word'를 '말씀'으로 옮기고, YHWH는 본 항목의 원칙에 따라 '야훼'로 직역해 신적 고유명을 보존했습니다.
- source_word: אֶל יִרְמְיָהוּ
  english_pob_choice: to Jeremiah
  chosen_korean: 예레미야에게
  alternatives_korean:
  - 예레미야에게로
  - 예레미야한테
  lexicon: HALOT
  rationale: אֶל의 방향성을 한국어 여격 조사 '-에게'로 간명하게 표현했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하여 이르시기를
  lexicon: HALOT
  rationale: 직접화법 도입어를 한국어 예언 문체에 맞게 동사로 풀어, 뒤따를 신적 발화를 자연스럽게 열었습니다.
theological_decisions:
- issue: 예언 공식에서 하나님의 말씀과 발화 주체를 어떻게 드러낼지
  chosen_reading: '"야훼의 말씀이 예레미야에게 임하여 말씀하셨습니다"로 옮겨, 말씀이 오고 곧바로 하나님이 말씀하시는 구조를 유지했습니다.'
  alternative_readings:
  - '"야훼의 말씀이 예레미야에게 임하여 이르셨습니다"'
  - '"야훼의 말씀이 예레미야에게 임했습니다"'
  rationale: 히브리어의 정형 예언 도입구는 단순한 정보 전달이 아니라 신적 계시의 도래를 강조하므로, '임하여'와 존대 발화를 함께 써 그 긴장을 보존했습니다.
  doctrine_reference: 예언적 계시의 정형 공식
