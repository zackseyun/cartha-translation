review_pass:
  verdict: revise
  source_fidelity: 히브리어의 직접 호칭, ‘당신의 백성 이스라엘’이라는 동격, 출애굽의 수단을 나타내는 전치사구 연쇄는 대체로 반영되었습니다. 다만 ‘이집트에 대한 심판적’이라는 해설은 본절 자체가 명시하는 내용을 넘어가며, ‘큰 두려움’은 영어 감사 기록의 ‘great terror’ 및 מוֹרָא의 공포스러운 뉘앙스를 다소 약화합니다.
  naturalness: ‘이스라엘인 당신의 백성’은 현대 한국어에서 동격 관계가 어색하고, 하나님께 드리는 기도 문맥에서 ‘당신’보다 ‘주님의’이 자연스럽고 일관됩니다. 수단을 열거하는 구절도 조사 반복을 줄여 자연스럽게 다듬을 수 있습니다.
  terminology: ‘표징과 이적’은 אותות ומופתים의 짝을 현대 표준어로 간결하게 보존합니다. ‘큰 공포’는 본문의 객관적이고 두려움을 일으키는 성격을 더 직접적으로 반영하되, 각주의 ‘경외’ 가능성은 유지합니다.
  issues:
  - severity: medium
    issue: ‘이스라엘인 당신의 백성’이라는 동격 표현
    rationale: עַמְּךָ אֶת־יִשְׂרָאֵל은 ‘당신의 백성 이스라엘’이라는 동격입니다. 현 번역의 ‘이스라엘인’은 사람들의 민족 정체성을 수식하는 듯하며 문장도 부자연스럽습니다.
  - severity: low
    issue: ‘큰 두려움’의 강도
    rationale: מוֹרָא는 넓게 두려움·공포·경외를 나타낼 수 있으나, 이 문맥과 영어 감사 기록의 선택은 두려움을 불러일으키는 강한 성격을 강조합니다. ‘큰 공포’가 이를 더 분명히 전달하며, 대안은 각주로 보존할 수 있습니다.
  - severity: low
    issue: 신학 해설이 본문을 넘어섬
    rationale: ‘이집트에 대한 심판적’이라는 설명은 출애굽 전승 전체와는 조화될 수 있지만, 이 절의 문구가 직접 특정하는 대상은 아닙니다. 번역 판단의 근거는 공포/경외의 어휘 범위와 문맥에 한정하는 편이 안전합니다.
  revised_text: 주께서 표징과 이적, 강한 손과 뻗은 팔, 큰 공포로 주님의 백성 이스라엘을 이집트 땅에서 이끌어 내셨습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “큰 경외로.” 히브리어 이 표현은 두려움, 공포 또는 경외를 나타낼 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 동격을 ‘주님의 백성 이스라엘’로 바로잡아 원문의 구조와 한국어 자연스러움을 함께 살렸습니다. 출애굽 표준 어휘쌍은 ‘표징과 이적’으로, 마지막 표현은 원문의 공포스러운 무게와 영어 감사 기록을 따라 ‘큰 공포’로 옮겼습니다. 각주는 가능한 ‘경외’의 의미를 보존합니다.
