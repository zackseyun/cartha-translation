  text: וַ/תֹּצֵ֛א אֶת עַמְּ/ךָ֥ אֶת יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בְּ/אֹת֣וֹת וּ/בְ/מוֹפְתִ֗ים וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בְ/אֶזְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָ֖א גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/021.yaml
  text: And you brought your people Israel out of the land of Egypt with signs and wonders[a], with a strong hand and an outstretched arm, and with great terror.
  footnotes:
  - marker: a
    text: Or "with great awe." The Hebrew phrase can denote fear, terror, or awe.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 이스라엘인 당신의 백성을 이집트 땅에서 징조들과 기이한 일들[a], 강한 손과 뻗은 팔과 큰 두려움을 가지고 이끌어 내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “큰 경외로.” 히브리어 이 표현은 두려움, 공포, 또는 경외를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּצֵא
  english_pob_choice: you brought ... out
  chosen_korean: 이끌어 내셨습니다
  alternatives_korean:
  - 데리고 나오셨습니다
  - 끌어내셨습니다
  lexicon: HALOT
  rationale: 출애굽 서술의 관용적 의미를 살리면서도, 히필형의 사역적 뉘앙스를 자연스럽게 반영하기 위해 ‘이끌어 내셨습니다’를 택했습니다.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  english_pob_choice: your people Israel
  chosen_korean: 이스라엘인 당신의 백성을
  alternatives_korean:
  - 당신의 백성 이스라엘을
  - 이스라엘, 당신의 백성을
  lexicon: HALOT
  rationale: ‘당신의 백성’의 언약적 소유 관계를 앞에 두고, ‘이스라엘’을 설명적 동격으로 자연스럽게 붙였습니다.
- source_word: בְּאֹתוֹת וּבְמוֹפְתִים
  english_pob_choice: with signs and wonders
  chosen_korean: 징조들과 기이한 일들
  alternatives_korean:
  - 표징들과 기사들
  - 표적들과 기적들
  lexicon: HALOT
  rationale: POB의 ‘signs and wonders’에 대응하되, 전통 교회어인 ‘표적/기사’보다 원문 짝의 반복성을 살리는 중립적 표현을 택했습니다.
- source_word: וּבְיָד חֲזָקָה וּבְאֶזְרוֹעַ נְטוּיָה
  english_pob_choice: with a strong hand ... an outstretched arm
  chosen_korean: 강한 손과 뻗은 팔
  alternatives_korean:
  - 능한 손과 펴신 팔
  - 강한 손과 펼친 팔
  lexicon: HALOT
  rationale: 출애굽의 고정 표현을 그대로 살리되, 현대 한국어에서 자연스러운 ‘뻗은 팔’로 옮겨 이미지의 직관성을 유지했습니다.
- source_word: וּבְמוֹרָא גָּדוֹל
  english_pob_choice: with great terror
  chosen_korean: 큰 두려움
  alternatives_korean:
  - 큰 경외
  - 큰 공포
  lexicon: HALOT
  rationale: 히브리어 모라가 두려움·공포·경외를 모두 포괄하므로, POB의 해석적 선택을 따라 ‘큰 두려움’으로 옮겨 의미 긴장을 보존했습니다.
theological_decisions:
- issue: וּבְמוֹרָא גָּדוֹל의 정서적 범위
  chosen_reading: 하나님의 구원 행위가 이집트에 불러온 두려움이라는 객관적 측면을 드러내는 ‘큰 두려움’으로 번역했습니다.
  alternative_readings:
  - ‘큰 경외’로 읽어 주체의 경건 반응을 강조하는 번역
  rationale: 문맥상 이 표현은 이스라엘의 내적 경건보다 이집트에 대한 심판적, 압도적 현상을 가리키므로 공포/두려움 쪽을 유지하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 출애굽 전승의 심판과 구원의 동시성 보존
