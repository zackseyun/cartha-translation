source:
  edition: WLC
  text: וּ/בָ֣אוּ הַ/כַּשְׂדִּ֗ים הַ/נִּלְחָמִים֙ עַל הָ/עִ֣יר הַ/זֹּ֔את וְ/הִצִּ֜יתוּ אֶת הָ/עִ֥יר הַ/זֹּ֛את בָּ/אֵ֖שׁ וּ/שְׂרָפ֑וּ/הָ וְ/אֵ֣ת הַ/בָּתִּ֡ים אֲשֶׁר֩ קִטְּר֨וּ עַל גַּגּֽוֹתֵי/הֶ֜ם לַ/בַּ֗עַל וְ/הִסִּ֤כוּ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/029.yaml
  text: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
  footnotes:
  - marker: a
    text: Or, 'the Babylonians.' The Hebrew says 'the Chaldeans,' a term often used for the Neo-Babylonian forces.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 성읍을 치고 싸우는 갈대아 사람들[a]이 와서 이 성읍에 불을 지르고 불태울 것입니다. 또 그 지붕 위에서 바알에게 분향하고 다른 신들에게 전제를 부어 나를 격노하게 한 집들도 불태울 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 사람들’은 히브리어 ‘כשדים’의 직접적인 번역입니다. 문맥상 신바빌로니아 제국의 군대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대사람들
  alternatives_korean:
  - 갈대인들
  - 바빌로니아 사람들
  lexicon: HALOT
  rationale: כשדים의 직접 대응으로 ‘갈대사람들’을 쓰되, POB의 ‘Chaldeans’와 같은 역사적 집단명을 유지했습니다. 문맥상 바빌로니아 군대이지만, 본문이 쓰는 민족명/정치명칭을 그대로 살렸습니다.
- source_word: וְהִצִּיתוּ ... בָּאֵשׁ
  english_pob_choice: set ... on fire
  chosen_korean: 불을 지르고
  alternatives_korean:
  - 불로 지르고
  - 불을 놓아
  lexicon: HALOT
  rationale: יצת의 관용적 의미를 한국어의 자연스러운 동사구로 옮겨, 도시를 실제로 방화하는 장면을 분명하게 드러냈습니다.
- source_word: וּשְׂרָפוּהָ
  english_pob_choice: and burn it
  chosen_korean: 불사르며
  alternatives_korean:
  - 태우며
  - 그것을 불태우며
  lexicon: HALOT
  rationale: 뒤에 이어지는 집들까지 포함하는 열거 구조 속에서, 첫 번째 ‘성읍’의 파괴를 자연스럽게 이어 주도록 분사형으로 처리했습니다. ‘불사르다’는 도시 파괴의 강한 화재 이미지를 보존합니다.
- source_word: אֲשֶׁר קִטְּרוּ עַל גַּגּוֹתֵיהֶם לַבַּעַל
  english_pob_choice: on whose rooftops they burned incense to Baal
  chosen_korean: 바알에게 분향하려고 그 지붕들 위에서 분향하고
  alternatives_korean:
  - 그 지붕 위에서 바알에게 향을 피우고
  - 지붕 위에서 바알께 분향하고
  lexicon: HALOT
  rationale: קטר는 제의적 ‘분향’으로 옮기는 것이 가장 직접적이며, 지붕 위의 우상숭배 장소라는 이미지를 살렸습니다. ‘바알께’보다 ‘바알에게’가 본문의 비인격적 우상 대상 표현에 더 가깝습니다.
- source_word: וְהִסִּכוּ נְסָכִים לֵאלֹהִים אֲחֵרִים
  english_pob_choice: and poured out drink offerings to other gods
  chosen_korean: 다른 신들에게 전제물을 부어 드린
  alternatives_korean:
  - 다른 신들에게 술제로를 부은
  - 다른 신들에게 전제를 올린
  lexicon: HALOT
  rationale: נסכים은 제의적 ‘전제물’로 옮기되, 현대 한국어에서 이해가 쉬운 ‘부어 드리다’를 써서 제사 행위를 분명하게 했습니다. ‘다른 신들’은 אחרים의 직역으로, ‘이방 신들’보다 덜 해석적입니다.
theological_decisions:
- issue: 하나님의 감정/심판 반응을 어떻게 옮길지
  chosen_reading: 나를 격노하게 하려는 것입니다.
  alternative_readings:
  - 나를 화나게 하려는 것입니다
  - 나에게 분노를 일으키려는 것입니다
  rationale: 히브리어는 우상숭배 행위가 여호와를 실제로 격노하게 한다고 말하므로, 이를 약화하지 않고 인격적·심판적 반응으로 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 지붕 위 우상 제의의 문화적 낯섦을 유지할지
  chosen_reading: 그 지붕들 위에서 분향하고
  alternative_readings:
  - 그들의 지붕 위에서 분향하고
  - 옥상에서 분향하고
  rationale: 고대 근동의 가정 옥상 제의라는 구체성을 유지해야 본문의 우상숭배 고발이 살아납니다. 현대식 ‘옥상’은 의미상 가능하지만, 본문의 복수형과 장소감은 ‘지붕들 위’가 더 직접적입니다.
  doctrine_reference: Translation philosophy §1
