revisions:
- from: 그리고 이 성읍을 치고 싸우는 갈대사람들이 와서 이 성읍에 불을 지르고, 이 성읍과, 바알에게 분향하려고 그 지붕들 위에서 분향하고 다른 신들에게 전제물을 부어 드린 집들을 불사르며, 나를 격노하게 하려는 것입니다.[a]
  to: 이 성읍을 치고 싸우는 갈대아 사람들[a]이 와서 이 성읍에 불을 지르고 불태울 것입니다. 또 그 지붕 위에서 바알에게 분향하고 다른 신들에게 전제를 부어 나를 격노하게 한 집들도 불태울 것입니다.
  rationale: 민족명을 표준 역사 명칭으로 바로잡고, 바알에게 드리는 분향과 다른 신들에게 드리는 전제를 각각 정확히 연결했습니다. 도시와 문제의 집들을 불태우는 두 목적어를 독립된 미래 절로 제시하여 히브리어의 예언적 동사 연쇄와 한국어 문법을 함께 살렸습니다. ‘나를 격노하게 한’은 לְמַעַן הַכְעִסֵנִי의 목적·결과 뉘앙스를 문맥상 자연스럽게 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:18Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 미래 동사 연쇄(‘올 것이며 … 불을 지르고 … 불태울 것이다’)와 집들에 대한 추가 목적어 구조를 분명히 옮겨야 합니다. 현 초안은 ‘갈대사람들’이 민족명 ‘갈대아 사람들’을 잘못 옮겼고, ‘분향하려고 그 지붕들 위에서 분향하고’는 바알에게 드리는 분향의 수혜자와 목적을 혼동합니다.
  naturalness: 현 문장은 ‘이 성읍과, … 집들을 불사르며’라는 연결이 부자연스럽고, 끝의 ‘것입니다’와 결합한 ‘불사르며’가 문법적으로도 매끄럽지 않습니다. 두 미래 절로 나누면 현대 표준어 합쇼체로 명료합니다.
  terminology: כַּשְׂדִּים은 ‘갈대사람들’이 아니라 통상 ‘갈대아 사람들’ 또는 ‘갈대아인’입니다. נסכים은 여기서 ‘전제물’보다 제의 행위를 나타내는 ‘전제’를 써서 ‘전제를 부은’이라고 하는 것이 자연스럽고 정확합니다. 바알, 다른 신들, 분향은 유지할 수 있습니다.
