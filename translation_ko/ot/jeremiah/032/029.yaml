    issue: ‘갈대사람들’이라는 민족명 번역
    rationale: 이는 כַּשְׂדִּים(Chaldeans)를 한국어 ‘갈대’(reeds)와 혼동한 표현입니다. 역사적 민족명인 ‘갈대아 사람들’로 고쳐야 합니다.
