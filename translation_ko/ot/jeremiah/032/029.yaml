  - severity: medium
    issue: 도시와 집들을 태우는 문장 구조 및 시제
    rationale: 원문은 도시를 불태우고, 이어 그러한 집들도 불태운다는 병렬 구조입니다. 초안의 ‘불사르며 … 것입니다’는 어색하며 미래 예언의 종결도 불분명합니다.
  - severity: low
