base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/042.yaml
  text: 'For thus says Yahweh: Just as I brought on this people all this great disaster[b][a], so I will bring on them all the good that I am speaking concerning them.'
  footnotes:
  - marker: a
    text: Or 'all this great calamity'; Hebrew 'evil/disaster.' In this context the word refers to judgmental catastrophe, not moral evil in God.
    reason: lexical_alternative
  - marker: b
    text: Or 'that I am promising them.' The Hebrew more literally reads 'that I am speaking concerning them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “내가 이 백성에게 이 모든 큰 재앙을 가져온 것처럼[a], 나도 그들에게 내가 그들에 관하여 말하고 있는 모든 좋은 것을 가져오겠습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’은 여기서 히브리어 רָעָה가 도덕적 악이 아니라 심판으로 인한 참화를 가리키는 경우를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내가 그들에 관하여 말하고 있는’은 히브리어의 문자적 표현을 살린 것으로, 문맥상 ‘내가 그들에게 약속하고 있는’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB 기본 원칙에 따라 언약명은 야훼로 옮겨 신적 고유명을 드러냈습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 이렇게 말씀하셨습니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식은 현재형으로 옮겨 권위와 직접성을 살리되, 한국어 문체에 맞게 ‘말씀하십니다’로 자연화했습니다.
- source_word: כַּאֲשֶׁר ... כֵּן
  english_pob_choice: Just as ... so
  chosen_korean: 내가 ... 가져온 것처럼, 이제 ... 가져오겠습니다
  alternatives_korean:
  - 내가 ... 가져온 대로, ... 가져오겠습니다
  - 내가 ... 가져온 것같이, ... 가져오겠습니다
  lexicon: HALOT
  rationale: 과거 심판과 미래 회복의 명시적 대응 구조를 한국어의 ‘...것처럼, ...’로 보존했습니다.
- source_word: הָרָעָה הַגְּדוֹלָה
  english_pob_choice: all this great disaster
  chosen_korean: 이 모든 큰 재앙
  alternatives_korean:
  - 이 모든 큰 악
  - 이 모든 큰 재난
  lexicon: HALOT
  rationale: 예언서의 רָעָה는 여기서 도덕적 악이 아니라 심판적 참화를 뜻하므로, 하나님의 اخلاق적 악행으로 오해되지 않도록 ‘재앙’으로 옮겼습니다.
theological_decisions:
- issue: רָעָה를 하나님의 행위에 적용할 때의 신학적 뉘앙스
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  rationale: 본문은 과거의 심판과 장차의 선을 대조하므로, ‘재앙’은 언약적 심판의 엄중함을 살리면서도 하나님께 도덕적 악을 돌리는 인상을 피합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문이 요구하지 않는 신학적 완화나 해소를 피함'
- issue: אֲשֶׁר אָנֹכִי דֹּבֵר עֲלֵיהֶם의 시제·의미
  chosen_reading: 내가 그들에 관하여 말하고 있는
  alternative_readings:
  - 내가 그들에게 약속하고 있는
  - 내가 그들에 대해 말씀하고 있는
  rationale: 동사 ‘말하다’와 전치사 ‘관하여’를 그대로 살려, 암시된 약속의 의미는 문맥에서 듣게 하되 본문의 표면 표현을 유지했습니다.
  doctrine_reference: 원문 표층 의미 보존 및 문맥적 함의 유지
