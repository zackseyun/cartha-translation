  text: וַ/יִּבְנוּ֩ אֶת בָּמ֨וֹת הַ/בַּ֜עַל אֲשֶׁ֣ר בְּ/גֵ֣יא בֶן הִנֹּ֗ם לְ֠/הַעֲבִיר אֶת בְּנֵי/הֶ֣ם וְ/אֶת בְּנוֹתֵי/הֶם֮ לַ/מֹּלֶךְ֒ אֲשֶׁ֣ר לֹֽא צִוִּיתִ֗י/ם וְ/לֹ֤א עָֽלְתָה֙ עַל לִבִּ֔/י לַ/עֲשׂ֖וֹת הַ/תּוֹעֵבָ֣ה הַ/זֹּ֑את לְמַ֖עַן החטי אֶת יְהוּדָֽה־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/035.yaml
  text: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
  footnotes:
  - marker: a
    text: Or 'in the valley of the son of Hinnom.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to make their sons and their daughters pass through'; this idiom refers to child sacrifice, here associated with fire and Molech worship.
    reason: cultural_note
  - marker: c
    text: Or 'nor did it arise in my mind.' Hebrew 'nor did it come up upon my heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 힌놈의 골짜기[a]에 있는 바알의 산당을 세워, 자기들의 아들과 딸들을 몰렉에게 바치려고 불 가운데로 지나가게 했습니다[b]. 이는 내가 그들에게 명령한 적이 없는 일이며, 내가 마음에 떠올린 적도 없는[c] 이 가증한 일을 행하여 유다를 죄짓게 하려 한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘힌놈의 아들의 골짜기’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘자기들의 아들과 딸들을 지나가게 하다’는 관용구는 자녀 희생을 가리키며, 여기서는 불과 몰렉 숭배와 연결됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘내 마음에 떠오르지 않았다’. 히브리어는 ‘내 마음 위로 올라오지 않았다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּמ֨וֹת
  english_pob_choice: high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 제단
  lexicon: HALOT
  rationale: בָּמָה의 제의적 용례는 한국어 성경 전통에서 보통 ‘산당’으로 옮기며, 여기서는 바알 숭배의 제의 장소라는 점을 분명히 드러냅니다.
- source_word: בְּגֵיא בֶן הִנֹּם
  english_pob_choice: in the Valley of Ben-hinnom
  chosen_korean: 힌놈의 골짜기
  alternatives_korean:
  - 벤힌놈 골짜기
  - 힌놈 아들의 골짜기
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역에 맞춰 ‘힌놈의 골짜기’로 처리해 가독성을 확보하되, 히브리어 소유격 구조는 각주로 보완합니다.
- source_word: לְהַעֲבִיר ... לַמֹּלֶךְ
  english_pob_choice: to make ... pass through the fire to Molech
  chosen_korean: 몰렉에게 바치려고 불 가운데로 지나가게 했습니다
  alternatives_korean:
  - 몰렉에게 넘기려고 불로 지나가게 했습니다
  - 몰렉에게 바치기 위해 불 가운데로 통과시켰습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로 ‘지나가게 하다’이지만, 문맥상 자녀 희생을 가리키므로 POB의 의미를 살려 ‘바치려고 불 가운데로 지나가게 했습니다’로 옮겼습니다.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  english_pob_choice: this abomination
  chosen_korean: 이 가증한 일
  alternatives_korean:
  - 이 혐오스러운 일
  - 이 역겨운 일
  lexicon: HALOT
  rationale: תּוֹעֵבָה는 우상숭배·윤리적 타락의 맥락에서 강한 혐오와 언약적 반역을 뜻하므로, 한국어 성경에서 통용되는 ‘가증한 일’을 사용했습니다.
theological_decisions:
- issue: 자녀를 몰렉에게 바치는 표현의 해석
  chosen_reading: 직접적으로 ‘불 가운데로 지나가게 했습니다’라고 두되, 본문 전체의 의미가 자녀 희생임을 유지했습니다.
  alternative_readings:
  - 자기들의 아들과 딸들을 몰렉에게 희생으로 드렸습니다
  - 자녀들을 불살라 몰렉에게 바쳤습니다
  rationale: 히브리어 관용구를 완전히 평문화하면 원문 표현력이 약해지므로, POB의 출발점을 따라 관용구와 문맥적 의미를 함께 살렸습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text idiom while making the cultic sense intelligible.'
- issue: 하나님의 의도 부정과 인칭적 표현
  chosen_reading: ‘내가 마음에 떠올린 적도 없는’으로 옮겨, 하나님의 거절과 수사적 긴장을 유지했습니다.
  alternative_readings:
  - 내 마음에 든 적도 없는
  - 내가 생각해 본 적도 없는
  rationale: 히브리어의 신인동형적 표현을 완화하지 않고 살려, 그런 행위가 하나님의 뜻과 전적으로 어긋난다는 점을 드러냅니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
