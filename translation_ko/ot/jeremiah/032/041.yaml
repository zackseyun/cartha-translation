  text: וְ/שַׂשְׂתִּ֥י עֲלֵי/הֶ֖ם לְ/הֵטִ֣יב אוֹתָ֑/ם וּ/נְטַעְתִּ֞י/ם בָּ/אָ֤רֶץ הַ/זֹּאת֙ בֶּ/אֱמֶ֔ת בְּ/כָל לִבִּ֖/י וּ/בְ/כָל נַפְשִֽׁ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/041.yaml
  text: I will rejoice over them to do them good[a], and I will plant them in this land in faithfulness, with all my heart and with all my soul.
  footnotes:
  - marker: a
    text: 'Or: “in truth” or “truly.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들 위에 기뻐하며 그들에게 복을 주고, 이 땅에 그들을 진실함으로 심겠습니다. 온 마음과 온 영혼을 다하여 그리하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “진리로” 혹은 “참으로.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂשְׂתִּי עֲלֵיהֶם
  english_pob_choice: I will rejoice over them
  chosen_korean: 내가 그들 위에 기뻐하며
  alternatives_korean:
  - 그들을 두고 기뻐하며
  - 그들로 인해 기뻐하며
  lexicon: HALOT
  rationale: שׂשׂ의 강한 기쁨을 살리면서, עַל의 대상 표지를 한국어로 자연스럽게 드러내기 위해 ‘그들 위에’와 ‘기뻐하며’를 함께 썼습니다.
- source_word: לְהֵיטִיב אוֹתָם
  english_pob_choice: to do them good
  chosen_korean: 그들에게 복을 주고
  alternatives_korean:
  - 그들에게 선을 행하고
  - 그들에게 좋은 일을 하고
  lexicon: HALOT
  rationale: 직역인 ‘그들에게 선을 행하고’도 가능하지만, 언약적 선행을 자연스럽게 드러내는 한국어로는 ‘복을 주고’가 본문의 적극적 선의 의미를 잘 전달합니다.
- source_word: וּנְטַעְתִּים
  english_pob_choice: I will plant them
  chosen_korean: 심겠습니다
  alternatives_korean:
  - 심어 두겠습니다
  - 심겠습니다 — 그들을 정착시키겠습니다
  lexicon: HALOT
  rationale: ‘심다’가 נטע의 농경 이미지를 가장 직접적으로 반영합니다. 문맥상 정착의 뉘앙스가 있지만, 본문의 핵심 은유를 보존하기 위해 기본 동사를 유지했습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in faithfulness
  chosen_korean: 진실함으로
  alternatives_korean:
  - 신실하게
  - 참되게
  lexicon: HALOT
  rationale: אֱמֶת의 의미 범위(진실, 신실함, 참됨)를 고려해, 하나님의 신뢰할 만한 언약적 태도를 드러내는 ‘진실함으로’를 선택했습니다. POB의 ‘in truth’ 대안도 이 범주에 속합니다.
theological_decisions:
- issue: 하나님에게 적용된 전인적 정서 표현
  chosen_reading: ‘온 마음과 온 영혼을 다하여’라는 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘온 존재로’
  - ‘전심전력으로’
  rationale: 본문은 하나님께 인간에게 쓰는 전인적 헌신의 관용구를 직접 적용합니다. 이를 완화하지 않고 유지해야 언약적 확언의 강도가 살아납니다.
  doctrine_reference: 번역 철학 §1, §3, §6
- issue: בֶּאֱמֶת의 번역
  chosen_reading: 본문에는 ‘진실함으로’를 두고, 언어적 중첩을 피했습니다.
  alternative_readings:
  - ‘진리로’
  - ‘참으로’
  rationale: 여기서는 단순 사실 진술보다 하나님의 신실한 실행을 강조하므로, 한국어에서도 신뢰성과 성실성을 함께 느끼게 하는 표현이 적절합니다.
  doctrine_reference: 번역 철학 §3, §5
