revisions:
- from: 이는 이스라엘의 아들들과 유다의 아들들이 자기들의 젊은 시절부터[a] 내 눈에 악한 일만 행해 왔기 때문입니다. 이스라엘의 아들들은 그들의 손이 만든 것[b]으로 나를 계속 분노하게만 했습니다. 야훼의 선언입니다.
  to: 이는 이스라엘 자손과 유다 자손이 그들의 젊은 시절부터[a] 내 눈에 악한 일만 해 왔고, 이스라엘 자손이 그들의 손으로 한 일로[b] 나를 계속 격노하게 해 왔기 때문입니다. 야훼의 말씀입니다.
