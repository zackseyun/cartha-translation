  lexicon: HALOT
  rationale: 단순한 ‘젊음’보다 지속성과 기원을 드러내는 시간 부사구로 옮겼습니다.
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  english_pob_choice: by the work of their hands
  chosen_korean: 그들의 손이 만든 것
