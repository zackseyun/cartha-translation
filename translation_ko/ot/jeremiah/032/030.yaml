  rationale: 우상 제작을 암시할 수 있는 관용구를 한국어에서 더 분명하게 살리되, 본문이 허용하는 범위를 넘지 않도록 ‘만든 것’으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: 예언문 종결 공식을 현대 한국어에서 간결하게 재현했습니다. 본 프로젝트 기본값에 따라 여호와 대신 야훼를 사용했습니다.
theological_decisions:
- issue: ‘내 눈에 악한 일’의 평가적 표현
  chosen_reading: ‘내 눈에 악한 일만 행해 왔습니다’로 옮겨, 행위에 대한 하나님의 판단이라는 관점적 표현을 유지했습니다.
  alternative_readings:
  - ‘내가 보기에 악했습니다’
  - ‘내 눈앞에서 악했습니다’
  rationale: 히브리어 관용구를 도덕적 평가로 평탄화하지 않고, 하나님의 시각에서 규정된 악이라는 긴장을 보존합니다.
  doctrine_reference: 하나님의 도덕적 판단과 언약적 책망
