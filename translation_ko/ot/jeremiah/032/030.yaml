source:
  edition: WLC
  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the people of Israel' and 'the people of Judah.' The Hebrew reads literally 'the sons of Israel' and 'the sons of Judah.'
    reason: lexical_alternative
  - marker: b
    text: '''By the work of their hands'' can also refer specifically to idols they made.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 이스라엘 자손과 유다 자손이 그들의 젊은 시절부터[a] 내 눈에 악한 일만 해 왔고, 이스라엘 자손이 그들의 손으로 한 일로[b] 나를 계속 격노하게 해 왔기 때문입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ / ‘유다 사람들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’과 ‘유다의 아들들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 손으로 한 일’은 그들이 만든 우상을 구체적으로 가리킬 수도 있습니다.
    reason: cultural_note
