id: JER.32.30
reference: Jeremiah 32:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the people of Israel' and 'the people of Judah.' The Hebrew reads literally 'the sons of Israel' and 'the sons of Judah.'
    reason: lexical_alternative
  - marker: b
    text: '''By the work of their hands'' can also refer specifically to idols they made.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 이스라엘의 아들들과 유다의 아들들이 자기들의 젊은 시절부터[a] 내 눈에 악한 일만 행해 왔기 때문입니다. 이스라엘의 아들들은 그들의 손이 만든 것[b]으로 나를 계속 분노하게만 했습니다. 야훼의 선언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ / ‘유다 사람들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’과 ‘유다의 아들들’이라고 되어 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들의 손이 만든 것’은 그들이 만든 우상을 구체적으로 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역 성격과 유다의 아들들과의 병렬 구조를 살리기 위해 ‘아들들’을 유지했습니다.
- source_word: וּבְנֵי יְהוּדָה
  english_pob_choice: and the sons of Judah
  chosen_korean: 유다의 아들들
  alternatives_korean:
  - 유다 사람들
  - 유다 백성
  lexicon: HALOT
  rationale: 첫 구와 같은 형식을 유지해 북왕국/남왕국의 대칭을 보존했습니다.
- source_word: מִנְּעֻרֹתֵיהֶם
  english_pob_choice: from their youth
  chosen_korean: 자기들의 젊은 시절부터
  alternatives_korean:
  - 그들의 젊은 시절부터
  - 어려서부터
  lexicon: HALOT
  rationale: 단순한 ‘젊음’보다 지속성과 기원을 드러내는 시간 부사구로 옮겼습니다.
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  english_pob_choice: by the work of their hands
  chosen_korean: 그들의 손이 만든 것
  alternatives_korean:
  - 그들의 손의 일
  - 그 손으로 만든 것
  lexicon: HALOT
  rationale: 우상 제작을 암시할 수 있는 관용구를 한국어에서 더 분명하게 살리되, 본문이 허용하는 범위를 넘지 않도록 ‘만든 것’으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: 예언문 종결 공식을 현대 한국어에서 간결하게 재현했습니다. 본 프로젝트 기본값에 따라 여호와 대신 야훼를 사용했습니다.
theological_decisions:
- issue: ‘내 눈에 악한 일’의 평가적 표현
  chosen_reading: ‘내 눈에 악한 일만 행해 왔습니다’로 옮겨, 행위에 대한 하나님의 판단이라는 관점적 표현을 유지했습니다.
  alternative_readings:
  - ‘내가 보기에 악했습니다’
  - ‘내 눈앞에서 악했습니다’
  rationale: 히브리어 관용구를 도덕적 평가로 평탄화하지 않고, 하나님의 시각에서 규정된 악이라는 긴장을 보존합니다.
  doctrine_reference: 하나님의 도덕적 판단과 언약적 책망
