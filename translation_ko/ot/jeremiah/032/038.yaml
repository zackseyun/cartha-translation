lexical_decisions:
- source_word: וְהָיוּ / וַאֲנִי אֶהְיֶה
  english_pob_choice: And they will be / and I will be
  chosen_korean: 그들은 … 될 것이며, 나는 … 될 것입니다
  alternatives_korean:
  - 그들은 … 되며, 나는 … 되겠습니다
  - 그들은 … 되리니, 나는 … 되겠습니다
  lexicon: WLC
  rationale: 히브리어 היה의 미래적 언약 약속을 한국어 미래형으로 옮기되, 두 절의 평행 구조를 살리기 위해 동일한 ‘될 것입니다’ 구문을 사용했습니다.
- source_word: לִי לְעָם
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 나를 위한 한 백성
  - 내가 소유한 백성
  lexicon: HALOT
  rationale: ל + 인칭대명사와 עם의 언약 관용구는 관계적 소속을 뜻하므로, 직역보다 ‘내 백성’이 원문의 뜻을 가장 자연스럽고 분명하게 드러냅니다.
- source_word: לָהֶם לֵאלֹהִים
  english_pob_choice: their God
  chosen_korean: 그들의 하나님
  alternatives_korean:
  - 그들에게 하나님
  - 그들을 위한 하나님
  lexicon: HALOT
  rationale: ל + 명사구는 여기서 소속·관계의 언약 표현이므로, 한국어에서는 관용적으로 ‘그들의 하나님’으로 옮겨 상호적 언약 관계를 보존했습니다.
theological_decisions:
- issue: 언약 공식의 상호성
  chosen_reading: ‘그들은 내 백성이 될 것이며, 나는 그들의 하나님이 될 것입니다’로 옮겨 상호적 언약 관계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘그들은 나의 백성이 되고 나는 그들의 하나님이 될 것입니다’
  - ‘그들은 내게 백성이 되고 나는 그들에게 하나님이 될 것입니다’
  rationale: 이 구절은 성경 전반에 반복되는 언약 공식이므로, 한국어에서도 소유와 관계의 상호성을 약화하지 않도록 직역과 관용을 균형 있게 유지했습니다.
  doctrine_reference: '언약 신학; 번역 원리: optimal equivalence'
