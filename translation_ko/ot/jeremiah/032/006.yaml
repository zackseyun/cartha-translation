source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר יִרְמְיָ֑הוּ הָיָ֥ה דְּבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/006.yaml
  text: And Jeremiah said[a], "The word of Yahweh came to me, saying,"
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 예레미야가 말했습니다[a]. "야훼의 말씀이 내게 임하여 이르셨습니다,"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 신명사 יהוה를 사용합니다. 본 역본은 이를 ‘야훼’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 살리되, 히브리어의 서사적 연결을 과장하지 않도록 평서형 과거로 옮겼습니다.
- source_word: הָיָה דְבַר־יְהוָה אֵלַי
  english_pob_choice: The word of Yahweh came to me
  chosen_korean: 야훼의 말씀이 내게 임하여
  alternatives_korean:
  - 야훼의 말씀이 내게 왔습니다
  - 야훼의 말씀이 내게 있었습니다
  lexicon: HALOT
  rationale: 예언자적 계시 공식의 관용적 뜻을 살리기 위해 '임하여'를 택해, 단순한 존재 서술보다 신적 전달의 도착을 분명히 했습니다.
- source_word: דְבַר
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 문맥에서 דָּבָר는 하나님의 선포를 가리키므로, 한국어 성경어에서 널리 쓰이면서도 원문의 공식성을 유지하는 '말씀'이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 신학적 제목이 아닌 고유명으로 드러내기 위해, 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 예언자적 계시 공식의 동사 처리
  chosen_reading: '''내게 임하여''로 옮겨, 하나님의 말씀이 단순히 ''있었다''는 의미가 아니라 예레미야에게 도달한 계시임을 드러냈습니다.'
  alternative_readings:
  - 내게 있었습니다
  - 내게 왔습니다
  rationale: 히브리어 הָיָה דְבַר־יְהוָה אֵלַי는 표준 예언 공식이므로, 문법적 직역보다 계시 전달의 의미가 분명한 한국어 표현이 본문 기능을 더 잘 전달합니다.
  doctrine_reference: 예언자적 계시의 공식 표현
- issue: 직접화법 표지의 한국어 처리
  chosen_reading: 인용문은 다음 절로 이어지는 말 시작 표지로 처리해, 현재 절 안에서 계시 도입만 제시했습니다.
  alternative_readings:
  - '"... 이르셨습니다"를 완결된 문장으로 처리'
  - 다음 절과 분리해 더 강하게 끊기
  rationale: 히브리어 לֵאמֹר는 뒤따르는 신탁 내용을 여는 기능이므로, 한국어에서도 다음 절로 이어지는 열린 구조를 유지하는 것이 자연합니다.
  doctrine_reference: 문맥-기능 대응 원칙
