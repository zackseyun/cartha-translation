id: JER.32.24
reference: Jeremiah 32:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֣ה הַ/סֹּלְל֗וֹת בָּ֣אוּ הָ/עִיר֮ לְ/לָכְדָ/הּ֒ וְ/הָ/עִ֣יר נִתְּנָ֗ה בְּ/יַ֤ד הַ/כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים עָלֶ֔י/הָ מִ/פְּנֵ֛י הַ/חֶ֥רֶב וְ/הָ/רָעָ֖ב וְ/הַ/דָּ֑בֶר וַ/אֲשֶׁ֥ר דִּבַּ֛רְתָּ הָיָ֖ה וְ/הִנְּ/ךָ֥ רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/024.yaml
  text: Look[a], the siege ramps have come up against the city to capture it, and the city has been given into the hand of the Chaldeans who are fighting against it, because of the sword and the famine and the plague. What you spoke has happened, and look[c][b], you see it.
  footnotes:
  - marker: a
    text: Or 'the siegeworks' or 'the mounds.' The Hebrew refers to earthworks built up in a siege to assault a city.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Babylonians.' The Hebrew says 'the Chaldeans,' the people identified with the Neo-Babylonian power.
    reason: lexical_alternative
  - marker: c
    text: Or 'pestilence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 공성 토루들이 성에 올라와 그것을 함락하려 하며, 성은 칼데아 사람들의 손에 넘겨졌습니다. 그들은 그것을 향해 싸우고 있습니다. 칼과 기근과 전염병 때문입니다. 당신이 말씀하신 일이 일어났습니다. 보십시오, 당신은 그것을 보고 계십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공성 토루들’은 히브리어의 성 공격용 토축/공성 시설을 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘칼데아 사람들’은 문맥상 신바빌로니아 세력을 가리키며, 영어 주석의 ‘Babylonians’에 해당하는 대안 표현입니다.
    reason: cross_reference
  - marker: c
    text: ‘전염병’은 히브리어 דָּבֶר의 가능한 번역으로, ‘역병’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 지시적 감탄사를 현대 합쇼체로 옮겨 즉각성을 살리되, 예언적 경고 문맥에 맞게 자연스럽고 공손한 명령형을 사용했습니다.
- source_word: הַסֹּלְלוֹת
  english_pob_choice: the siege ramps
  chosen_korean: 공성 토루들
  alternatives_korean:
  - 포위 공사들
  - 공성 망루들
  lexicon: HALOT
  rationale: 성 공격용 흙둑/토축이라는 구체성을 살리기 위해 ‘토루들’을 택했고, 한국어로도 군사 공성 장치를 비교적 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 칼데아 사람들
  alternatives_korean:
  - 갈대아 사람들
  - 바빌로니아 사람들
  lexicon: HALOT
  rationale: 본문의 민족명/정치명칭을 직접 반영하여 ‘칼데아 사람들’로 옮겼고, 전통 교회어인 ‘바빌로니아 사람들’은 문맥적 대안이지만 원어 대응을 우선했습니다.
- source_word: הַחֶרֶב וְהָרָעָב וְהַדָּבֶר
  english_pob_choice: the sword and the famine and the plague
  chosen_korean: 칼과 기근과 전염병
  alternatives_korean:
  - 칼과 기근과 역병
  - 칼, 기근, 그리고 전염병
  lexicon: HALOT
  rationale: 세 가지 심판 항목의 병렬을 유지하면서, ‘דָּבֶר’를 현대 독자가 이해하기 쉬운 ‘전염병’으로 옮겼습니다.
- source_word: וַאֲשֶׁר דִּבַּרְתָּ הָיָה
  english_pob_choice: What you spoke has happened
  chosen_korean: 당신이 말씀하신 일이 일어났습니다
  alternatives_korean:
  - 당신이 말씀하신 것이 이루어졌습니다
  - 당신이 말하신 일이 이루어졌습니다
  lexicon: HALOT
  rationale: 예언 성취를 자연스럽게 표현하되, ‘말씀하신’으로 하나님의 말씀 행위를 드러내고 ‘일어났습니다’로 성취의 현실성을 살렸습니다.
theological_decisions:
- issue: 예레미야가 하나님께 직접 말하는 장면의 높임말 처리
  chosen_reading: 본문 전체를 예레미야의 직접 화법으로 유지하되, 하나님께 대한 호칭/동사에는 합쇼체를 적용했습니다.
  alternative_readings:
  - 전체를 평서형으로 평준화
  - 하나님께 대한 높임을 생략
  rationale: 청자에게는 예언자의 기도/탄원 맥락이 분명하므로, 한국어에서도 하나님을 향한 공손한 높임을 유지하는 것이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 기도 및 직접 대화에서의 한국어 존대 관행
- issue: ‘보십시오’의 반복 처리
  chosen_reading: 서두와 종결부 모두 ‘보십시오’로 옮겨 원문의 지시적 반복을 살렸습니다.
  alternative_readings:
  - 첫 번째만 옮기고 마지막은 생략
  - ‘보라’로 통일
  rationale: 히브리어 הִנֵּה의 반복은 시각적 확증과 긴박감을 강조하므로, 한국어에서도 반복을 유지해 말씀 성취의 현장성을 살렸습니다.
  doctrine_reference: 본문 수사와 강조의 보존
