revisions:
- from: 이스라엘 자손과 유다 자손이 저지른 온갖 악 때문입니다. 곧 그들이 나를 분노하게 하려고 한 일들 때문입니다—그들 곧 그들의 왕들, 그들의 고관들, 그들의 제사장들, 그들의 예언자들, 또 유다 사람들과 예루살렘 주민들 때문입니다.[a][b][c]
  to: 이는 이스라엘 자손과 유다 자손이[a] 나를 분노하게 하려고[b] 저지른 온갖 악 때문입니다. 곧 그들, 그들의 왕들, 그들의 고관들, 그들의 제사장들, 그들의 예언자들, 그리고 유다 사람들과[c] 예루살렘 주민들 때문입니다.
  rationale: 관계절을 ‘저지른 온갖 악’에 직접 연결하여 לְהַכְעִסֵנִי의 목적 관계와 אֲשֶׁר עָשׂוּ의 수식을 보존했습니다. 이어지는 הֵמָּה는 ‘곧 그들’로 재개하여 책임 주체를 강조하되, 한국어에서는 쉼표 열거로 자연스럽게 처리했습니다. 자손 및 유다 사람들의 집합적 표현은 유지하고 관련 대안은 각주에 제시했습니다.
