base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/032.yaml
  text: because of all the evil of the sons of Israel and the sons of Judah that they did to provoke me to anger—they[a], their kings, their officials, their priests, and their prophets[c][b], and the men of Judah and the inhabitants of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the people of Israel and the people of Judah.' The Hebrew reads literally 'the sons of Israel and the sons of Judah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to anger me.'
    reason: lexical_alternative
  - marker: c
    text: Or 'each man of Judah'; the Hebrew is singular 'man' used collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손과 유다 자손이 저지른 온갖 악 때문입니다. 곧 그들이 나를 분노하게 하려고 한 일들 때문입니다—그들 곧 그들의 왕들, 그들의 고관들, 그들의 제사장들, 그들의 예언자들, 또 유다 사람들과 예루살렘 주민들 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘 자손과 유다 자손’입니다.
    reason: source_note
  - marker: b
    text: ‘나를 분노하게 하려고’는 히필 동사의 사역적 의미를 반영한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘유다 사람들’은 히브리어 단수 ‘사람’의 집합적 용법을 반영한 번역입니다.
    reason: lexical_alternative
