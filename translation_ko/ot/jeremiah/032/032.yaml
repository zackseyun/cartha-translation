theological_decisions:
- issue: 책임 주체의 누적과 강조
  chosen_reading: ‘그들 곧 …’으로 시작해 왕, 고관, 제사장, 예언자, 유다 사람들, 예루살렘 주민들까지 책임 주체를 누적해 드러냈습니다.
  alternative_readings:
  - 단순 나열로 처리
  - ‘그들’ 없이 바로 나열
  rationale: 본문의 הֵמָּה는 강조적 재개 기능을 하므로, 이를 약화시키지 않도록 한국어에서도 반복적 지시를 유지했습니다.
  doctrine_reference: 예레미야 32:32 문맥의 언약적 심판 진술
