  - 내 말을 듣고 따르시면
  rationale: 본문은 문자적으로 '듣다'를 쓰면서도 언약적 순종을 함축하므로, मुख्य 동사는 '듣다'로 두고 조건문의 요구를 한국어로 자연스럽게 표현했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
