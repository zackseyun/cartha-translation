source:
  edition: WLC
  text: וְ֠/הָיָה אִם שָׁמֹ֨עַ תִּשְׁמְע֤וּ/ן אֵלַ/י֙ נְאֻם יְהוָ֔ה לְ/בִלְתִּ֣י הָבִ֣יא מַשָּׂ֗א בְּ/שַׁעֲרֵ֛י הָ/עִ֥יר הַ/זֹּ֖את בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וּ/לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת לְ/בִלְתִּ֥י עֲשֽׂוֹת ב/ה כָּל מְלָאכָֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/024.yaml
  text: And it shall be[a], if you truly listen to me, declares Yahweh, by not bringing a load through the gates of this city on the Sabbath day, and by keeping the Sabbath day holy, by not doing any work on it[b],
  footnotes:
  - marker: a
    text: Or 'if you diligently obey me.' The Hebrew idiom literally repeats 'listen' for emphasis and can carry the sense of obedient hearing.
    reason: lexical_alternative
  - marker: b
    text: Or 'a burden.' The Hebrew term can mean a carried load; here it refers to loads brought through the city gates on the Sabbath.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리되리라. 너희가 참으로 내 말을 들으면—여호와의 말씀이니라—이 성의 성문들을 통해 안식일에 짐을 가져오지 않고, 안식일을 거룩하게 지키며, 그 날에 어떤 일도 하지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나에게 부지런히 순종하면.' 히브리어는 강조를 위해 '듣다'를 반복하며, 순종의 의미를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '짐'. 여기서는 안식일에 성문으로 들여오는 운반물이나 적재물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그리되리라
  alternatives_korean:
  - 그리고 그것이 될 것입니다
  - 그리될 것입니다
  lexicon: HALOT
  rationale: 예언적 조건문을 여는 공식적 결과 표현으로, 현대 한국어에서 자연스럽고 엄중한 서술을 살렸습니다.
- source_word: אִם שָׁמֹעַ תִּשְׁמְעוּן אֵלַי
  english_pob_choice: if you truly listen to me
  chosen_korean: 너희가 참으로 내 말을 들으면
  alternatives_korean:
  - 너희가 정말 나에게 귀를 기울이면
  - 너희가 내게 순종하며 들으면
  lexicon: HALOT
  rationale: שמוע의 반복 강조를 '참으로'로 살리고, 직접 목적어 'to me'는 '내 말을'로 풀어 한국어에서 의미가 분명하게 드러나도록 했습니다.
- source_word: מַשָּׂא
  english_pob_choice: a load
  chosen_korean: 짐
  alternatives_korean:
  - 무거운 짐
  - 부담
  lexicon: HALOT
  rationale: 성문을 통해 운반되는 실제 운송물의 의미이므로, 현대어에서 자연스러운 '짐'으로 옮겼습니다.
- source_word: וּלְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  english_pob_choice: and by keeping the Sabbath day holy
  chosen_korean: 안식일을 거룩하게 지키며
  alternatives_korean:
  - 안식일을 성별하며
  - 안식일을 거룩히 여기며
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 '거룩하게 구별하다'이므로, 교회적 관용구를 무리하게 쓰지 않고 의미를 직접 드러냈습니다.
- source_word: כָּל מְלָאכָה
  english_pob_choice: any work
  chosen_korean: 어떤 일도
  alternatives_korean:
  - 어떠한 일도
  - 아무 노동도
  lexicon: HALOT
  rationale: 안식일 금지의 범위를 포괄적으로 살리되, '노동'보다 문맥상 넓은 '일'이 더 자연스럽습니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה의 표기
  chosen_reading: 여호와의 말씀
  alternative_readings:
  - 야훼의 말씀
  - 주님의 말씀
  rationale: 이 프로젝트의 한국어 기본 용례를 따르되, 예언자적 화행 공식인 '말씀이니라'와 결합해 본문 기능을 분명하게 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH 표기 원칙'
- issue: שׁמע의 의미 범위
  chosen_reading: 참으로 내 말을 들으면
  alternative_readings:
  - 참으로 내게 순종하면
  - 내 말을 듣고 따르시면
  rationale: 본문은 문자적으로 '듣다'를 쓰면서도 언약적 순종을 함축하므로, मुख्य 동사는 '듣다'로 두고 조건문의 요구를 한국어로 자연스럽게 표현했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
