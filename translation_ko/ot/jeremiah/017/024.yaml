revisions:
- from: 그리되리라. 너희가 참으로 내 말을 들으면—여호와의 말씀이니라—이 성의 성문들을 통해 안식일에 짐을 가져오지 않고, 안식일을 거룩하게 지키며, 그 날에 어떤 일도 하지 않을 것입니다.[a][b]
  to: 여호와의 말씀입니다. 만일 너희가 참으로 내 말을 듣고[a] 안식일에 이 성의 성문들을 통하여 짐을[b] 들여오지 않으며, 안식일을 거룩하게 지키고 그날에는 아무 일도 하지 않는다면,
  rationale: 본문을 다음 절의 결과절로 이어지는 조건절로 바로잡았습니다. 이에 따라 앞선 '그리되리라'와 종결형 미래 표현을 제거하고, 세 부정·성별 요구를 병렬 조건으로 정리했습니다. 각주 표지 b도 해당 어휘인 '짐'에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:32Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 안식일에 짐을 반입하지 않고 일을 하지 말라는 요구와 안식일을 거룩하게 지키라는 내용을 대체로 충실히 옮겼습니다. 그러나 '그리되리라'와 절 끝의 '하지 않을 것입니다'가 결합되면서, 히브리어의 조건절(뒤 절에서 이어지는 결과를 기다림)을 독립된 미래 진술로 바꾸고 문장 구조를 흐립니다. וְהָיָה אִם의 조건 도입은 한국어에서는 자연스럽게 '만일 ... 한다면,'으로 처리하여 다음 절과 이어지게 하는 것이 안전합니다.
  naturalness: '''내 말을 들으면''은 자연스럽지만, 조건절 내부의 세 요구는 ''-지 않고, -하며, -하지 않는다면''으로 병렬해야 합니다. ''이 성의 성문들을 통해''보다 짐의 반입 방향을 분명히 하는 ''이 성의 성문들을 통하여 ... 들여오지 않고''가 문맥에 더 알맞습니다. ''그날''은 띄어 쓰는 현대 표기가 적절합니다.'
  terminology: '''여호와''와 ''안식일''은 현 프로젝트의 한국어 용례 안에서 일관됩니다. נְאֻם יְהוָה는 현대 합쇼체에 맞추어 ''여호와의 말씀입니다''로 옮길 수 있습니다. שׁמע의 반복 강조는 ''참으로 ... 듣고''로 유지하되, 대안 각주는 순종의 함의를 알리는 방식이 적절합니다. מַשָּׂא의 각주 표지는 ''짐'' 바로 뒤에 두어야 합니다.'
  issues:
  - severity: high
    issue: 조건절이 미래 서술문으로 바뀌어 있음
    rationale: '''그리되리라''와 ''하지 않을 것입니다''는 본절의 미완결 조건구문을 독립적인 미래 예언처럼 보이게 합니다. 히브리어의 조건은 다음 절의 결과절로 이어지므로 한국어도 ''-다면,''으로 열어 두어야 합니다.'
  - severity: medium
