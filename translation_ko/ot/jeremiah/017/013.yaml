source:
  edition: WLC
  text: מִקְוֵ֤ה יִשְׂרָאֵל֙ יְהוָ֔ה כָּל עֹזְבֶ֖י/ךָ יֵבֹ֑שׁוּ יסור/י בָּ/אָ֣רֶץ יִכָּתֵ֔בוּ כִּ֥י עָזְב֛וּ מְק֥וֹר מַֽיִם חַיִּ֖ים אֶת יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/013.yaml
  text: O Yahweh[a], the hope of Israel, all who forsake you will be put to shame; those who turn away from you will be written in the earth, because they have forsaken Yahweh[c][b], the fountain of living waters.
  footnotes:
  - marker: a
    text: Or 'those who turn away from you.' The Hebrew here is textually difficult; the main text follows the Masoretic first-person reading.
    reason: textual_variant
  - marker: b
    text: Or 'written in the land.' The phrase may suggest a fleeting inscription in the soil, in contrast to enduring remembrance.
    reason: lexical_alternative
  - marker: c
    text: '''Living water'' refers to fresh, flowing water from a spring, not stagnant water.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼여[a], 이스라엘의 소망이시여, 주를 버리는 모든 자는 수치를 당할 것이며, 내게서 돌아서는 자들은 땅에 기록될 것입니다[b]. 그들이 생수의 샘인 야훼를 버렸기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주를 버리는 자들’. 이 히브리어는 본문상 난해하며, 본문은 마소라 본문의 첫인칭 읽기를 따릅니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘땅에 기록될 것입니다’. 이 표현은 땅에 덧없이 새겨지는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘생수’는 고인 물이 아닌 샘에서 흘러나오는 신선한 물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִקְוֵה
  english_pob_choice: hope
  chosen_korean: 소망
  alternatives_korean:
