- source_word: עֹזְבֶיךָ
  english_pob_choice: those who forsake you
  chosen_korean: 주를 버리는 모든 자
  alternatives_korean:
  - 주를 떠나는 자들
  - 주를 버하는 자들
  - 주를 저버리는 자들
  lexicon: HALOT
  rationale: 지속적·관행적 행위를 나타내는 분사성을 살려 현재진행형적 표현으로 옮겼고, 언약적 뉘앙스를 위해 ‘버리다’를 택했습니다.
- source_word: יֵבֹשׁוּ
  english_pob_choice: will be put to shame
  chosen_korean: 수치를 당할 것이며
  alternatives_korean:
  - 부끄러움을 당할 것이며
  - 수치를 입을 것이며
  - 망신당할 것이며
  lexicon: HALOT
  rationale: 단순한 감정이 아니라 심판의 결과로 드러나는 ‘수치’의 상태를 한국어 관용으로 표현했습니다.
- source_word: מְקוֹר מַיִם חַיִּים
  english_pob_choice: the fountain of living waters
  chosen_korean: 생수의 샘
  alternatives_korean:
  - 살아 있는 물의 샘
  - 살아 있는 물의 샘물
  - 생수의 근원
  lexicon: HALOT
  rationale: ‘샘/근원’의 이미지와 ‘living water’의 생명성을 자연스럽게 살리되, 한국어에서 익숙한 ‘생수의 샘’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘내게서’와 앞절의 직접 호칭 사이의 인칭 긴장
  chosen_reading: 원문이 가진 인칭 긴장을 그대로 유지하여 ‘내게서 돌아서는 자들’을 본문에 남겼습니다.
  alternative_readings:
  - 주께로부터 돌아서는 자들
  - 주를 떠나는 자들
  rationale: 히브리어 본문과 POB 주석이 지적하듯 이 구절은 인칭이 단순하게 정리되지 않으며, 이를 매끈하게 통일하면 본문의 텍스트적 어려움이 사라집니다. 따라서 긴장을 보존했습니다.
  doctrine_reference: 텍스트 비평상 난점을 해소하지 않고 보존하는 번역 원칙
