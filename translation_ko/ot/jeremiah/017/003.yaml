id: JER.17.3
reference: Jeremiah 17:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲרָרִ/י֙ בַּ/שָּׂדֶ֔ה חֵילְ/ךָ֥ כָל אוֹצְרוֹתֶ֖י/ךָ לָ/בַ֣ז אֶתֵּ֑ן בָּמֹתֶ֕י/ךָ בְּ/חַטָּ֖את בְּ/כָל גְּבוּלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/003.yaml
  text: My mountain in the field—your wealth[a], all your treasures[c][b], and your high places because of sin throughout all your territory—I will give as plunder.
  footnotes:
  - marker: a
    text: Or 'O my mountain in the field'; the Hebrew phrase is difficult and may refer to Zion/Jerusalem as the LORD's mountain.
    reason: alternative_reading
  - marker: b
    text: '''Your wealth'' could also be rendered ''your strength'' or, less likely here, ''your army.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'for sin throughout all your territory' or 'in sin throughout all your territory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들판에 있는 내 산[a]과 너의 재물[b]과 네 모든 보물, 그리고 네 온 영토에 걸친 죄 때문에 네 산당들을[c] 내가 약탈물로 넘겨주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오, 들판에 있는 내 산아’. 이 히브리어 구절은 난해하며, 야훼의 산인 시온/예루살렘을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘네 힘’, 덜 가능하게는 ‘네 군대’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네 온 영토에서 저지른 죄로 말미암아’ 또는 ‘네 온 영토에서 죄 가운데’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָרִי
  english_pob_choice: My mountain
  chosen_korean: 내 산
  alternatives_korean:
  - 오, 내 산
  - 내 산지
  lexicon: HALOT
  rationale: 소유격이 붙은 산의 이미지를 그대로 살려 ‘내 산’으로 옮겼습니다. 이 표현은 야훼의 산, 곧 시온/예루살렘을 가리킬 가능성을 열어 두면서도 원문의 난해함을 과도하게 풀어 쓰지 않습니다.
- source_word: בַּ/שָּׂדֶ֔ה
  english_pob_choice: in the field
  chosen_korean: 들판에 있듯이
  alternatives_korean:
  - 들에서
  - 시골에
  lexicon: HALOT
  rationale: 직역상 ‘들에/들판에’이므로 이미지와 모호성을 보존했습니다. 문장 흐름상 앞 구를 받는 위치 관계를 자연스럽게 보이도록 ‘있듯이’를 보탰습니다.
- source_word: חֵילְ/ךָ֥
  english_pob_choice: your wealth
  chosen_korean: 너의 재물
  alternatives_korean:
  - 너의 힘
  - 너의 군대
  - 너의 자원
  lexicon: HALOT
  rationale: 문맥이 보물과 약탈의 대상이라는 점에서 경제적 의미가 가장 자연스럽습니다. ‘재물’은 힘/군사력의 뜻 가능성을 남기면서도 여기서는 소유물을 가리키는 흐름을 잘 드러냅니다.
- source_word: בָּמֹתֶ֕י/ךָ
  english_pob_choice: your high places
  chosen_korean: 네 산당들
  alternatives_korean:
  - 네 높은 곳들
  - 네 제의 산당들
  lexicon: HALOT
  rationale: הבמות는 예언서에서 우상숭배적 제의 장소를 가리키는 경우가 많아, 한국어 성서 전통에서 널리 쓰이는 ‘산당’을 택했습니다. 단순 지형이 아니라 예배 대상의 문제라는 뉘앙스를 살릴 수 있습니다.
- source_word: לָ/בַ֣ז אֶתֵּ֑ן
  english_pob_choice: I will give as plunder
  chosen_korean: 내가 약탈물로 주겠습니다
  alternatives_korean:
  - 내가 노략거리로 넘기겠습니다
  - 내가 노략물로 주겠습니다
  lexicon: HALOT
  rationale: 예언적 심판 공식에 맞는 ‘주다’ 구조를 유지하면서, 결과 상태를 분명히 하기 위해 ‘약탈물로’라고 옮겼습니다. ‘약탈물/노략물’은 본문의 심판적 어조를 강하게 보존합니다.
theological_decisions:
- issue: ‘내 산이 들판에’의 난해한 구절 처리
  chosen_reading: 문자적 이미지를 유지하되, 시온/예루살렘을 가리킬 수 있는 야훼의 산이라는 해석 여지를 남겼습니다.
  alternative_readings:
  - ‘오, 내 산이여, 들판에 있는’이라는 호격
  - 이스라엘의 산지 전반을 가리키는 표현
  rationale: 히브리어는 해석이 어려우므로 본문이 가진 긴장을 풀어 쓰지 않았습니다. 원문의 애매성을 보존하는 것이 오히려 독자에게 저자의 의도를 더 정확히 전달합니다.
  doctrine_reference: 예언서의 시온 신학 및 심판 선언
