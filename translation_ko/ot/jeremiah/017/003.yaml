revisions:
- from: 내 산이 들판에 있듯이—너의 재물과 네 모든 보물, 그리고 네 모든 지역의 죄 때문에 너의 산당들을—내가 약탈물로 주겠습니다.[a][b][c]
  to: 들판에 있는 내 산[a]과 너의 재물[b]과 네 모든 보물, 그리고 네 온 영토에 걸친 죄 때문에 네 산당들을[c] 내가 약탈물로 넘겨주겠습니다.
  rationale: 비교 표현 ‘있듯이’를 제거하여 장소 표현의 의미를 보존했습니다. ‘내 산’부터 ‘산당들’까지를 심판으로 넘겨지는 병렬 목록으로 명시하고, 원문의 난해성 및 בְּחַטָּאת의 가능한 의미 범위는 각주에서 보존했습니다. 의미를 바꾸지 않으면서 표지 위치와 한국어 표현을 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:30Z'
review_pass:
  verdict: revise
  source_fidelity: ‘들판에 있듯이’는 히브리어 בַּשָּׂדֶה(‘들판에/들에 있는’)에 없는 비교 표현을 더하므로 수정이 필요합니다. ‘내 산’은 원문의 난해한 통사적 지위를 해소하지 않고 보존하되, 본문에서는 영어 POB의 선택을 따라 심판의 대상 목록에 포함시켰습니다. ‘약탈물로 넘겨주겠습니다’는 אֶתֵּן לָבַז의 심판 표현을 자연스럽고 충실하게 옮깁니다.
  naturalness: 수정문은 병렬되는 목적어들을 ‘과’로 명확히 연결하고, ‘네 모든 지역의 죄’보다 자연스러운 ‘네 온 영토에 걸친 죄’를 사용했습니다. 합쇼체의 예언 선언으로 자연스럽습니다.
  terminology: ‘산당’은 בָּמוֹת의 제의적 의미를 적절히 보존하며, ‘재물’, ‘보물’, ‘약탈물’도 문맥과 어휘 범위에 부합합니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
