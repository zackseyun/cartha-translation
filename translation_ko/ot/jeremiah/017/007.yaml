source:
  edition: WLC
  text: בָּר֣וּךְ הַ/גֶּ֔בֶר אֲשֶׁ֥ר יִבְטַ֖ח בַּֽ/יהוָ֑ה וְ/הָיָ֥ה יְהוָ֖ה מִבְטַחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/007.yaml
  text: Blessed is the man who trusts in Yahweh[b][a], and whose trust is Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Blessed is the man who trusts in Yahweh, and Yahweh is his trust.'' The divine name is rendered ''the LORD'' in the main text by project convention.'
    reason: alternative_reading
  - marker: b
    text: Or 'whose confidence is the LORD.' The Hebrew noun can denote that in which one places confidence.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼를 신뢰하는 사람은 복되며, 그의 신뢰는 야훼이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “야훼를 신뢰하는 사람은 복되며, 야훼가 그의 신뢰입니다”라는 동격 구조를 가집니다.
    reason: source_note
  - marker: b
    text: מִבְטַח은 ‘신뢰’뿐 아니라 ‘신뢰의 대상/의지하는 근거’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Blessed
  chosen_korean: 복되며
  alternatives_korean:
  - 행복하며
  - 복을 받은
  lexicon: HALOT
  rationale: 예언·지혜 문맥의 선언적 복을 살리기 위해 ‘복되다’를 썼습니다. ‘행복하다’보다 언약적·신학적 무게가 더 잘 드러납니다.
- source_word: הַגֶּבֶר
  english_pob_choice: the man
  chosen_korean: 사람은
  alternatives_korean:
  - 그 남자는
  - 그 사람은
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만 여기서는 일반적 진술이므로 한국어에서는 자연스러운 대표적 표현인 ‘사람’을 택했습니다. 다만 특정 개인이 아니라 원형적 인물을 가리키는 점은 유지했습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼를 신뢰하는
  alternatives_korean:
  - 야훼 안에서 신뢰하는
  - 야훼께 의지하는
  lexicon: HALOT
  rationale: בטח עם 전치사는 한국어로 보통 ‘~을 신뢰하다/의지하다’로 옮기는 것이 자연스럽습니다. 본문은 믿음의 대상이 야훼임을 분명히 하므로 직역형을 유지했습니다.
- source_word: מִבְטַחוֹ
  english_pob_choice: his trust
  chosen_korean: 그의 신뢰는
  alternatives_korean:
  - 그의 믿음은
  - 그가 의지하는 바는
  - 그의 의지는
  lexicon: HALOT
  rationale: 명사 מִבְטַח은 ‘신뢰, 의지하는 대상/근거’의 뜻을 가질 수 있어, 앞의 동사 ‘신뢰하다’와 어근 연결을 살리면서도 한국어에서는 ‘그의 신뢰’로 간결하게 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신성명이 본문에 직접 나타날 때는 ‘야훼’를 유지하여 언약적 고유성을 드러냈습니다.
  doctrine_reference: Project default for יהוה / YHWH
- issue: הָיָה יְהוָה מִבְטַחוֹ의 관계 표현
  chosen_reading: 그의 신뢰는 야훼이십니다
  alternative_readings:
  - 야훼께서 그의 신뢰이십니다
  - 그의 신뢰는 야훼입니다
  rationale: 히브리어는 단순한 동격 진술로, 야훼가 ‘신뢰의 대상’이자 ‘신뢰의 근거’라는 중첩 의미를 갖습니다. 한국어에서는 주어-서술어 구조로 자연스럽게 옮기되, 대상성과 동일시를 함께 살리기 위해 ‘이십니다’를 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
