source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/עֵ֣ץ שָׁת֣וּל עַל מַ֗יִם וְ/עַל יוּבַל֙ יְשַׁלַּ֣ח שָֽׁרָשָׁ֔י/ו וְ/לֹ֤א ירא כִּֽי יָבֹ֣א חֹ֔ם וְ/הָיָ֥ה עָלֵ֖/הוּ רַֽעֲנָ֑ן וּ/בִ/שְׁנַ֤ת בַּצֹּ֨רֶת֙ לֹ֣א יִדְאָ֔ג וְ/לֹ֥א יָמִ֖ישׁ מֵ/עֲשׂ֥וֹת פֶּֽרִי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/008.yaml
  text: He will be like a tree planted by water[a], that sends out its roots by a stream; it does not fear when heat comes, and its leaf remains green. In a year of drought it is not anxious[b], and it does not cease from bearing fruit.
  footnotes:
  - marker: a
    text: Or 'by a watercourse' or 'by a canal' for 'by a stream.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its leaf is fresh/luxuriant'; the Hebrew adjective includes the sense of freshness as well as greenness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 물가에 심긴 나무와 같아서, 시냇가로 뿌리를 뻗습니다.[a] 더위가 와도 두려워하지 않으며, 그 잎은 푸릅니다.[b] 가뭄의 해에도 걱정하지 않고, 열매 맺기를 그치지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물줄기’ 또는 ‘수로’로 옮길 수 있습니다. 히브리어 יוּבַל은 흐르는 물길을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘잎이 푸르고 싱싱하다’로 옮길 수 있습니다. 히브리어 רַעֲנָן에는 신선함과 생기로운 상태가 함께 담깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵץ שָׁתוּל
  english_pob_choice: like a tree planted
  chosen_korean: 물가에 심긴 나무 같아서
  alternatives_korean:
  - 나무처럼 심겨서
  - 심겨진 나무 같아서
  lexicon: HALOT
  rationale: 비유의 핵심은 ‘의도적으로 심겨진 나무’의 안정성입니다. ‘물가에 심긴 나무’가 현대 한국어에서 가장 자연스럽고, 뒤의 물줄기 이미지와도 잘 이어집니다.
- source_word: יוּבַל
  english_pob_choice: a stream
  chosen_korean: 시내
  alternatives_korean:
  - 물줄기
  - 개울
  - 수로
  lexicon: HALOT
  rationale: יוּבַל은 흐르는 물길을 가리키므로 ‘시내’가 읽기 쉽고, 본문이 의도한 흐름의 이미지를 살립니다. 필요하면 각주로 ‘물줄기/수로’ 대안을 제시할 수 있습니다.
- source_word: רַעֲנָן
  english_pob_choice: its leaf remains green
  chosen_korean: 그 잎은 푸릅니다
  alternatives_korean:
  - 그 잎은 싱싱합니다
  - 그 잎은 생기롭습니다
  - 그 잎은 푸르고 싱싱합니다
  lexicon: HALOT
  rationale: רַעֲנָן은 단순한 색상뿐 아니라 생기와 싱그러움을 포함합니다. 한국어에서는 ‘푸릅니다’가 가장 간결하면서도 상태 지속을 무리 없이 전달합니다.
- source_word: לֹא יִדְאָג
  english_pob_choice: it is not anxious
  chosen_korean: 걱정하지 않고
  alternatives_korean:
  - 불안해하지 않고
  - 근심하지 않고
  lexicon: HALOT
  rationale: 이 동사는 내면의 불안과 염려를 가리키므로 ‘걱정하지 않고’가 한국어 독자에게 가장 자연스럽습니다. 앞의 ‘두려워하지 않으며’와 함께 감정의 점층을 유지합니다.
- source_word: לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  english_pob_choice: it does not cease from bearing fruit
  chosen_korean: 열매를 맺는 일을 그치지 않습니다
  alternatives_korean:
  - 열매 맺기를 멈추지 않습니다
  - 열매를 맺는 데서 떠나지 않습니다
  lexicon: HALOT
  rationale: ‘מֵ…’ 구문은 활동에서 벗어나지 않음을 뜻하므로, 결과를 직역하기보다 ‘그치지 않습니다’로 옮겨 지속성을 살렸습니다.
theological_decisions:
- issue: 의로운 사람을 나무로 비유하는 시적-예언적 이미지의 유지
  chosen_reading: 본문의 비유를 설명적으로 풀지 않고, 물가에 심긴 나무의 안정성과 생명력을 그대로 살렸습니다.
  alternative_readings:
  - 의인의 번영을 직접 진술하는 방식
  - 교훈적으로 ‘복된 사람’으로 바꾸는 방식
  rationale: 예언문학의 이미지를 약화시키지 않기 위해, 상징을 해석으로 대체하지 않았습니다. 청중이 원문처럼 ‘열과 가뭄 속에서도 지속되는 생명’으로 이해하도록 두는 것이 본문 충실도에 유리합니다.
  doctrine_reference: 예레미야 17:5–8 문맥의 복과 저주 대조
- issue: ‘열(חֹם)’과 ‘가뭄(בַּצֹּרֶת)’의 이중 압박 표현
  chosen_reading: 두 위협을 각각 ‘열’과 ‘가뭄의 해’로 구분해 번역했습니다.
  alternative_readings:
  - 모두 일반적 어려움으로 묶어 ‘환난’으로 처리하는 방식
  - 기후 이미지 대신 영적 어려움으로만 옮기는 방식
  rationale: 히브리어 원문은 자연 조건의 압박을 구체적으로 제시합니다. 이를 추상화하면 농경적 비유의 힘이 약해지므로, 물질적 이미지 자체를 유지했습니다.
  doctrine_reference: 창조 세계를 통한 지혜·예언적 교훈의 전달
