  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ כְּ/עַרְעָ֣ר בָּֽ/עֲרָבָ֔ה וְ/לֹ֥א יִרְאֶ֖ה כִּי יָב֣וֹא ט֑וֹב וְ/שָׁכַ֤ן חֲרֵרִים֙ בַּ/מִּדְבָּ֔ר אֶ֥רֶץ מְלֵחָ֖ה וְ/לֹ֥א תֵשֵֽׁב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/006.yaml
  text: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
  footnotes:
  - marker: a
    text: Or 'like a juniper,' 'like a tamarisk,' or 'like a barren bush'; the exact plant named by the Hebrew is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will not perceive when prosperity comes.' The Hebrew says literally, 'he will not see when good comes.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the Arabah' if taken as the specific geographic region rather than desert land generally.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 광야[a]의 관목[c]처럼 될 것이며, 좋은 것이 올 때에도 보지 못할 것입니다.[b] 그는 광야의 메마른 곳들, 사람이 살지 않는 소금 땅에서 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아라바’로, 특정 지리 지역을 가리키는 것으로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘좋은 것이 오는 것을 알아차리지 못할 것입니다.’ 히브리어는 문자적으로 ‘좋은 것이 올 때 보지 못할 것이다’라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘향나무처럼’, ‘타마리스크처럼’, ‘메마른 덤불처럼’으로 옮길 수 있으며, 히브리어가 가리키는 식물의 정확한 종류는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַרְעָר
  english_pob_choice: like a shrub
  chosen_korean: 관목처럼
  alternatives_korean:
  - 향나무처럼
  - 타마리스크처럼
  - 메마른 덤불처럼
  lexicon: HALOT
  rationale: עַרְעָר는 정확한 식별이 불확실한 사막 식물을 가리키므로, 특정 수종을 단정하지 않는 ‘관목’이 이미지를 살리면서도 과도한 특정화를 피합니다.
- source_word: בָּעֲרָבָה
  english_pob_choice: in the desert
  chosen_korean: 광야
  alternatives_korean:
  - 아라바에
  - 사막에
  - 황무지에
  lexicon: HALOT
  rationale: עֲרָבָה는 지리적 ‘아라바’일 수도 있지만, 이 비유문맥에서는 건조한 황야라는 환경적 뜻이 더 자연스러워 ‘광야’로 옮겼습니다.
- source_word: חֲרֵרִים בַּמִּדְבָּר
  english_pob_choice: in parched places in the wilderness
  chosen_korean: 사막의 마른 곳들
  alternatives_korean:
  - 광야의 메마른 곳들
  - 황폐한 광야
  - 불에 그을린 곳들
  lexicon: HALOT
  rationale: חֲרֵרִים는 마르고 그을린 황폐지를 가리키므로, ‘마른 곳들’로 옮겨 건조하고 생명 없는 느낌을 살렸습니다.
- source_word: וְלֹא תֵשֵׁב
  english_pob_choice: that is not inhabited
  chosen_korean: 사람이 살지 않는
  alternatives_korean:
  - 거주되지 않는
  - 아무도 살지 않는
  - 사람이 거주하지 않는
  lexicon: HALOT
  rationale: 여성형 단수 동사가 ‘땅’과 호응하므로, 한국어에서는 뒤의 ‘소금 땅’을 꾸미는 관계절로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘좋은 것’의 의미를 좁히지 않음
  chosen_reading: ‘좋은 것이 올 때’로 직역에 가깝게 유지해, 문맥상 번영을 포함할 수 있지만 그 의미를 미리 단정하지 않았습니다.
  alternative_readings:
  - ‘번영이 올 때’
  - ‘좋은 일이 생길 때’
  rationale: 히브리어는 문자적으로 ‘좋음’이 오는 것을 말하며, POB도 ‘good’로 유지합니다. 문맥상 번영의 함의는 가능하지만 본문 자체의 폭을 보존했습니다.
  doctrine_reference: 잠 28:20의 일반적 보응 표현과 예언서의 시적 경고 문맥
