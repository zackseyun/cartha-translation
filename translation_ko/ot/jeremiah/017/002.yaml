    text: 또는 ‘그들의 아세라 기둥들’ 혹은 ‘그들의 성스러운 기둥들’로 옮길 수 있습니다. 이 히브리어는 아세라와 관련된 숭배 물건을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision restores the dependent 'as/just as' force of כִּי, makes both locative phrases modify the altars and Asherah-associated objects, and avoids identifying the אֲשֵׁרִים specifically as carved images. The trailing comma intentionally reflects the Hebrew clause's syntactic continuation from the preceding verse.
