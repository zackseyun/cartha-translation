revisions:
- from: 그들의 자녀가 그들의 제단과 그들의 아세라 목상들[a]을, 푸른 나무마다, 높은 언덕들 위에서 기억합니다.
  to: 그들의 자녀들이 푸른 나무마다 곁에, 높은 언덕들 위에 있는 그들의 제단들과 아세라 상징물들[a]을 기억하듯이,
  rationale: The revision restores the dependent 'as/just as' force of כִּי, makes both locative phrases modify the altars and Asherah-associated objects, and avoids identifying the אֲשֵׁרִים specifically as carved images. The trailing comma intentionally reflects the Hebrew clause's syntactic continuation from the preceding verse.
