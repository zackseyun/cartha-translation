  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ/זְכֹּ֤ר בְּנֵי/הֶם֙ מִזְבְּחוֹתָ֔/ם וַ/אֲשֵׁרֵי/הֶ֖ם עַל עֵ֣ץ רַֽעֲנָ֑ן עַ֖ל גְּבָע֥וֹת הַ/גְּבֹהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/002.yaml
  text: As their children remember their altars and their Asherim beside every green tree[a], on the high hills,
  footnotes:
  - marker: a
    text: Or 'their Asherah poles' or 'their sacred poles.' The Hebrew term refers to cult objects associated with Asherah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 자녀가 그들의 제단과 그들의 아세라 목상들[a]을, 푸른 나무마다, 높은 언덕들 위에서 기억합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 아세라 기둥들’ 혹은 ‘그들의 성목들’로도 옮길 수 있습니다. 이 히브리어는 아세라와 관련된 숭배 물건을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם / זְכֹּר
  english_pob_choice: their children remember
  chosen_korean: 그들의 자녀가 … 기억합니다
  alternatives_korean:
  - 그들의 아들들이 … 기억합니다
  - 그들의 자손이 … 기억합니다
  lexicon: HALOT
  rationale: בנים은 문맥상 남성 자녀로 좁히기보다 후손 전체를 가리킬 수 있어 ‘자녀’가 더 안전하며, זכר는 단순한 회상이므로 ‘기억합니다’가 가장 직접적입니다.
- source_word: מִזְבְּחוֹתָם
  english_pob_choice: their altars
  chosen_korean: 그들의 제단
  alternatives_korean:
  - 그들의 제단들
  - 그들의 제단들을
  lexicon: HALOT
  rationale: מִזְבֵּחַ는 우상 숭배 문맥의 제단을 가리키므로 ‘제단’이 자연스럽고, 소유격을 그대로 살렸습니다.
- source_word: וַאֲשֵׁרֵיהֶם
  english_pob_choice: their Asherim
  chosen_korean: 그들의 아세라 목상들
  alternatives_korean:
  - 그들의 아세라들
  - 그들의 아세라 기둥들
  - 그들의 성목들
  lexicon: HALOT
  rationale: 히브리어 용어의 대상이 아세라 관련 숭배 물건인지, 목상인지가 문맥상 완전히 고정되지 않아 본문에는 ‘아세라’를 유지하되 한국어 독자에게는 기능을 드러내는 ‘목상들’을 붙였습니다.
- source_word: עֵץ רַעֲנָן
  english_pob_choice: every green tree
  chosen_korean: 푸른 나무마다
  alternatives_korean:
  - 푸른 나무 아래마다
  - 무성한 나무마다
  - 푸른 나무마다
  lexicon: HALOT
  rationale: 관용적이고 반복되는 우상 숭배 장소 표현으로서, ‘every’의 분배성을 살리면서도 한국어에서는 ‘푸른 나무마다’가 가장 압축적입니다.
- source_word: עַל גְּבָעוֹת הַגְּבֹהוֹת
  english_pob_choice: on the high hills
  chosen_korean: 높은 언덕들 위에서
  alternatives_korean:
  - 높은 산들 위에서
  - 높은 언덕들에
  - 높은 산언덕들 위에서
  lexicon: HALOT
  rationale: 산당적 장소를 가리키는 관용구이므로, ‘언덕들 위에서’가 지형적 이미지와 우상 숭배의 장소성을 함께 보존합니다.
theological_decisions:
- issue: אֲשֵׁרִים의 번역 범위
  chosen_reading: ‘아세라 목상들’로 본문에 두고, 숭배 물건이라는 기능을 드러냅니다.
  alternative_readings:
  - ‘아세라들’로 음역만 유지
  - ‘아세라 기둥들’로 구체화
  - ‘성목들’로 일반화
  rationale: 이 용어는 여신 아세라와 연관된 숭배 대상일 수 있으나, 본문 자체는 구체적 형태를 단정하지 않습니다. 따라서 히브리어 고유성은 ‘아세라’로 보존하고, 한국어로는 우상 숭배 대상임을 명시합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
