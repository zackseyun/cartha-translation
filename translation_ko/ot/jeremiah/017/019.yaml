  language: ko
  text: 야훼께서 내게 이렇게 말씀하셨습니다. “가서 백성의 문[a]에 서라. 유다 왕들이 그 문으로 들어가고 그 문으로 나간다. 또 예루살렘의 모든 문에도 서라.”
  philosophy: optimal-equivalence
  footnotes:
