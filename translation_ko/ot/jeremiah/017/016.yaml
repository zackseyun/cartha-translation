id: JER.17.16
reference: Jeremiah 17:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֞י לֹא אַ֣צְתִּי מֵ/רֹעֶ֣ה אַחֲרֶ֗י/ךָ וְ/י֥וֹם אָנ֛וּשׁ לֹ֥א הִתְאַוֵּ֖יתִי אַתָּ֣ה יָדָ֑עְתָּ מוֹצָ֣א שְׂפָתַ֔/י נֹ֥כַח פָּנֶ֖י/ךָ הָיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/016.yaml
  text: But as for me[a], I did not hurry away from being a shepherd after you, and I did not desire the day of disaster; you know. What came from my lips was before your face.
  footnotes:
  - marker: a
    text: Or 'the day of calamity' or 'the woeful day.' The Hebrew expression literally refers to a grievous or sick day, likely meaning the day of disaster/judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 저는 주를 따라 목자가 되기를 서둘러 떠나지 않았고, 재앙의 날을 바라지도 않았습니다. 주님, 당신은 아십니다. 제 입술에서 나온 것은 당신의 얼굴 앞에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘병약한 날’에 가깝지만, 문맥상 재앙과 심판의 날을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַצְתִּי מֵרֹעֶה אַחֲרֶיךָ
  english_pob_choice: did not hurry away from being a shepherd after you
  chosen_korean: 주를 따라 목자가 되기를 서둘러 떠나지 않았고
  alternatives_korean:
  - 주를 따라 목자로서 서둘러 나아가지 않았고
  - 주를 따라 목자가 되기를 서두르지 않았고
  lexicon: HALOT
  rationale: אוץ의 ‘서두르다/재촉하다’와 מִן + 분사 구조를 반영해, 단순한 이동이 아니라 사역에서 물러나지 않았다는 뜻을 살렸습니다. רֹעֶה는 ‘목자’의 이미지를 유지했습니다.
- source_word: יוֹם אָנּוּשׁ
  english_pob_choice: the day of disaster
  chosen_korean: 재앙의 날
  alternatives_korean:
  - 병약한 날
  - 고통의 날
  - 환난의 날
  lexicon: HALOT
  rationale: 직역하면 ‘병약한/몹시 아픈 날’이지만 문맥상 심판과 재앙의 날을 가리키므로, 한국어에서는 의미를 분명하게 ‘재앙의 날’로 옮겼습니다.
- source_word: הִתְאַוֵּיתִי
  english_pob_choice: did not desire
  chosen_korean: 바라지도 않았습니다
  alternatives_korean:
  - 원하지도 않았습니다
  - 갈망하지도 않았습니다
  lexicon: HALOT
  rationale: 히트파엘형의 ‘간절히 바라다/욕망하다’를 자연스러운 현대 한국어로 옮겼습니다. 부정 맥락이므로 ‘바라다’가 무난합니다.
- source_word: מוֹצָא שְׂפָתַי נֹכַח פָּנֶיךָ
  english_pob_choice: What came from my lips was before your face
  chosen_korean: 제 입술에서 나온 것은 당신의 얼굴 앞에 있었습니다
  alternatives_korean:
  - 제 입술에서 나온 것은 당신 앞에 있었습니다
  - 제 입술의 말은 당신의 면전 앞에 있었습니다
  lexicon: HALOT
  rationale: מוֹצָא를 ‘나온 것’으로, נֹכַח פָּנֶיךָ를 ‘얼굴 앞에’로 옮겨 히브리어의 구체적 이미지를 보존했습니다. ‘입술에서 나온 것’은 발화 자체를 가리키는 표현입니다.
theological_decisions:
- issue: ‘여호와’ 대신 텍스트 기반의 신명 표기
  chosen_reading: 본문의 직접 호칭이 없는 이 절에서는 일반 표기 ‘주’와 직접 호칭 ‘주님’을 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 하나님의 이름 YHWH가 직접 나타나지 않고 2인칭 호칭으로 진행되므로, 본문상 직접 대응하는 ‘주/주님’이 자연스럽습니다.
  doctrine_reference: 원문 우선 원칙과 한국어 경어 체계
- issue: ‘before your face’의 직역 유지
  chosen_reading: ‘당신의 얼굴 앞에 있었습니다’로 다소 직역에 가까운 표현을 유지했습니다.
  alternative_readings:
  - 당신 앞에 있었습니다
  - 당신의 면전 앞에 있었습니다
  rationale: נֹכַח פָּנֶיךָ의 구체적 신체-공간 이미지를 살리기 위해, 자연스러움보다 원문 투명성을 우선했습니다.
  doctrine_reference: 원어 이미지 보존 원칙
