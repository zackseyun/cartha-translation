review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Sabbath prohibition, the prohibition of all work, and the command to sanctify the Sabbath. However, ‘짐을 내어 나가지 말며’ can naturally mean ‘do not go out carrying a load,’ rather than the Hebrew causative sense of taking a load out from the houses. The final comparative clause is also clearer when it directly modifies the command to sanctify the Sabbath.
  naturalness: ‘집 밖으로 내가지 말며’ clearly and naturally expresses taking a load out. Placing ‘내가 여러분의 조상들에게 명령한 대로’ with the Sabbath-sanctification command avoids the somewhat indirect wording ‘이는 … 것과 같습니다.’
  terminology: ‘안식일을 거룩하게 하십시오’ is an appropriate modern formal-polite rendering of וְקִדַּשְׁתֶּם. ‘조상들’ is a natural Korean collective rendering in this historical context, while the footnote explains the referent. ‘어떤 일도’ adequately renders ‘any/all work.’
  issues:
  - severity: medium
    issue: ‘짐을 내어 나가지 말며’ is syntactically ambiguous.
    rationale: It may describe the people going out while carrying a load, whereas תוֹצִיאוּ מַשָּׂא means to cause a load to go out—take it out—from their houses.
  - severity: low
    issue: The comparison with the prior command is expressed indirectly.
    rationale: ‘이는 내가 … 명령한 것과 같습니다’ is understandable, but ‘내가 … 명령한 대로 안식일을 거룩하게 하십시오’ more directly reflects כַּאֲשֶׁר צִוִּיתִי.
  - severity: low
    issue: Footnote anchors are both placed at the end of the verse rather than at their respective referents.
    rationale: Placing each anchor immediately after its relevant expression improves clarity without affecting meaning.
  revised_text: 안식일에는 여러분의 집에서 짐을 집 밖으로 내가지 말며[a], 어떤 일도 하지 말고, 내가 여러분의 조상들에게 명령한 대로 안식일을 거룩하게 하십시오.[b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘여러분의 집에서 짐을 가지고 나가다.’
    reason: lexical_alternative
  - marker: b
    text: ‘여러분의 조상들’은 하나님께서 이 명령을 주신 이전 세대의 이스라엘을 가리킵니다.
    reason: cultural_note
  revision_rationale: The revision makes the causative ‘take a load out’ explicit, joins the ‘just as I commanded’ clause directly to the command to sanctify the Sabbath, and moves footnote anchors to their corresponding words. It preserves the source’s commands, scope, and formal-polite register.
