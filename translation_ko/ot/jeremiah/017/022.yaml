id: JER.17.22
reference: Jeremiah 17:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא תוֹצִ֨יאוּ מַשָּׂ֤א מִ/בָּֽתֵּי/כֶם֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וְ/כָל מְלָאכָ֖ה לֹ֣א תַֽעֲשׂ֑וּ וְ/קִדַּשְׁתֶּם֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת כַּ/אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/022.yaml
  text: Do not carry a load out of your houses on the Sabbath day[a], and do not do any work, but sanctify the Sabbath day[b], just as I commanded your fathers.
  footnotes:
  - marker: a
    text: Or 'bring a burden out of your houses.'
    reason: lexical_alternative
  - marker: b
    text: '''Your fathers'' refers to the earlier generations of Israel to whom God gave this command.'
    reason: cultural_note
translation:
  language: ko
  text: 안식일에 여러분의 집에서 짐을 내어 나가지 말며, 어떤 일도 하지 말고, 안식일을 거룩하게 하십시오. 이는 내가 여러분의 조상들에게 명령한 것과 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 집에서 짐을 가지고 나가다.’
    reason: lexical_alternative
  - marker: b
    text: ‘여러분의 조상들’은 하나님께서 이 명령을 주신 이전 세대의 이스라엘을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹצִיאוּ מַשָּׂא
  english_pob_choice: carry a load out
  chosen_korean: 짐을 내어 나가다
  alternatives_korean:
  - 짐을 가지고 나가다
  - 짐을 꺼내다
  lexicon: HALOT
  rationale: 히필 동사와 ‘짐/무거운 물건’의 결합은 단순한 이동보다 ‘밖으로 내보내는’ 행위를 뜻하므로, 자연스럽고 구체적인 한국어로 옮겼습니다.
- source_word: מִבָּתֵּיכֶם
  english_pob_choice: out of your houses
  chosen_korean: 여러분의 집에서
  alternatives_korean:
  - 집에서
  - 여러분의 집 안에서
  lexicon: HALOT
  rationale: מן의 출처 의미를 살리되, 앞의 동작과 함께 자연스럽게 읽히도록 ‘집에서’로 옮겼습니다.
- source_word: וְקִדַּשְׁתֶּם
  english_pob_choice: sanctify
  chosen_korean: 거룩하게 하십시오
  alternatives_korean:
  - 성별하십시오
  - 거룩하게 하라
  lexicon: HALOT
  rationale: קדש의 핵심은 ‘거룩하게 구별하다’이므로, 예배적·법적 의미를 함께 담는 표준적 표현을 사용했습니다.
- source_word: אֲבוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 여러분의 조상들에게
  alternatives_korean:
  - 여러분의 아버지들에게
  - 여러분의 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 남성 복수형이지만, 여기서는 특정 개인 아버지보다 이전 세대 전체를 가리키므로 한국어에서는 의미를 드러내는 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: 안식일 준수 명령의 표현 방식
  chosen_reading: ‘안식일을 거룩하게 하십시오’로 직역보다 약간 자연화하되, 거룩하게 구별하라는 명령성을 유지했습니다.
  alternative_readings:
  - 안식일을 성별하십시오
  - 안식일을 거룩하게 지키십시오
  rationale: 본문은 단순한 종교적 태도가 아니라, 야훼께서 명하신 안식일의 적극적 구별을 요구하므로 명령의 강도를 살렸습니다.
  doctrine_reference: Translation philosophy §§5-6
- issue: ‘여러분의 조상들’의 지시 대상
  chosen_reading: 이 표현은 출애굽 이후의 이스라엘 이전 세대들을 가리키는 집단적 표현으로 이해했습니다.
  alternative_readings:
  - 문자적으로 여러분의 아버지들
  - 일반적 조상
  rationale: 본문의 수신자는 개인 아버지들이 아니라 공동체적 선조들이므로, 역사적·언약적 연속성을 드러내는 해석이 적절합니다.
  doctrine_reference: Translation philosophy §4
