revisions:
- from: 안식일에 여러분의 집에서 짐을 내어 나가지 말며, 어떤 일도 하지 말고, 안식일을 거룩하게 하십시오. 이는 내가 여러분의 조상들에게 명령한 것과 같습니다.[a][b]
  to: 안식일에는 여러분의 집에서 짐을 집 밖으로 내가지 말며[a], 어떤 일도 하지 말고, 내가 여러분의 조상들에게 명령한 대로 안식일을 거룩하게 하십시오.[b]
  rationale: The revision makes the causative ‘take a load out’ explicit, joins the ‘just as I commanded’ clause directly to the command to sanctify the Sabbath, and moves footnote anchors to their corresponding words. It preserves the source’s commands, scope, and formal-polite register.
