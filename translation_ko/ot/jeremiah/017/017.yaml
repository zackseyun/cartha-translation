id: JER.17.17
reference: Jeremiah 17:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּֽהְיֵה לִ֖/י לִ/מְחִתָּ֑ה מַֽחֲסִ/י אַ֖תָּה בְּ/י֥וֹם רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/017.yaml
  text: Do not be a terror to me[b][a]; you are my refuge in the day of disaster.
  footnotes:
  - marker: a
    text: Or 'a cause of dismay,' 'a ruin,' or 'an object of dread.'
    reason: lexical_alternative
  - marker: b
    text: '''Disaster'' here means calamity or trouble, not moral evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나에게 두려움이 되지 마소서[a][b]. 주께서는 재난의 날에 나의 피난처이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려움’은 כאן의 מְחִתָּה가 지닌 공포·무너짐·파멸의 뉘앙스를 포괄하는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재난’은 כאן의 רָעָה가 뜻하는 환난·재앙의 상황을 가리키며, 도덕적 악을 뜻하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֵה לִי לִמְחִתָּה
  english_pob_choice: Do not be a terror to me
  chosen_korean: 나에게 두려움이 되지 마소서
  alternatives_korean:
  - 나에게 공포가 되지 마소서
  - 나에게 절망의 원인이 되지 마소서
  - 나에게 파멸이 되지 마소서
  lexicon: HALOT
  rationale: לִמְחִתָּה는 두려움, 공포, 무너짐의 뉘앙스를 함께 지니므로, 간결하면서도 예배적 탄원의 어조를 살린 ‘두려움’으로 옮겼습니다.
- source_word: מַחֲסִי
  english_pob_choice: my refuge
  chosen_korean: 나의 피난처
  alternatives_korean:
  - 나의 피신처
  - 나의 보호처
  - 나의 피난
  lexicon: HALOT
  rationale: מַחֲסֶה 계열은 위기 속 피할 곳을 가리키므로, 시편·예언서 맥락에 익숙하면서도 현대 한국어에서 자연스러운 ‘피난처’를 선택했습니다.
- source_word: בְּיוֹם רָעָה
  english_pob_choice: in the day of disaster
  chosen_korean: 재난의 날에
  alternatives_korean:
  - 환난의 날에
  - 재앙의 날에
  - 재해의 날에
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 재난·환난의 상황을 뜻하므로, POB의 ‘disaster’를 반영해 ‘재난’으로 옮겼습니다.
- source_word: אַתָּה
  english_pob_choice: you are
  chosen_korean: 주께서는 … 이십니다
  alternatives_korean:
  - 주님은 … 이십니다
  - 주께서는 … 입니다
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 한국어에서는 주어를 앞세운 선언형으로 살리되, 하나님께 직접 아뢰는 문맥에 맞게 ‘주께서는’으로 공손하게 처리했습니다.
theological_decisions:
- issue: רָעָה의 의미를 도덕적 악으로 볼지, 재난/환난으로 볼지
  chosen_reading: 재난의 날
  alternative_readings:
  - 악의 날
  - 악한 날
  - 환난의 날
  rationale: 문맥상 예레미야는 야훼께서 자신이 피해야 할 재난 속에서 피난처가 되시기를 구하고 있으므로, 도덕적 악이 아닌 역경·재난의 뜻을 분명히 해야 합니다.
  doctrine_reference: 원문 우선 번역; 야훼의 성품을 오해하게 하는 도덕적 오역 방지
- issue: 탄원문에서 직접 청유형을 어떻게 살릴지
  chosen_reading: 나에게 두려움이 되지 마소서
  alternative_readings:
  - 나에게 두려움이 되지 마십시오
  - 나를 두렵게 하지 마소서
  rationale: 히브리어의 부정 탄원과 직접 호소를 살리기 위해 청유형을 사용했으며, ‘두렵게 하지 마소서’보다 원문상 ‘~이 되다’의 관계를 더 정확히 반영합니다.
  doctrine_reference: 기도문/탄원문에서의 직접 호소 존중
