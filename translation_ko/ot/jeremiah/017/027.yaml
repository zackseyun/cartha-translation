revisions:
- from: 그러나 만일 너희가 나에게 듣지 않아 안식일을 거룩하게 지키지 않고, 안식일에 짐을 지고 예루살렘 성문으로 들여오지 않으면, 내가 그 성문들에 불을 지르리니 그것이 예루살렘의 궁전들을 삼킬 것이며, 꺼지지 않을 것입니다.[a][b]
  to: 그러나 너희가 안식일을 거룩하게 지키고 안식일에 짐을 지고 예루살렘 성문으로 들어오는 일을 하지 말라는 내 말을 듣지 않으면[a], 내가 예루살렘의 성문들에[b] 불을 지르겠습니다. 그 불은 예루살렘의 궁전들을 삼키고 꺼지지 않을 것입니다.
  rationale: The revision corrects the reversed prohibition by expressing the entire commanded conduct as the content of what the people refuse to heed. It retains the source's conditional judgment sequence, identifies Jerusalem as the referent of the gates without altering meaning, corrects the feminine grammatical note, and relocates anchors to their relevant expressions.
