source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִשְׁמְע֜וּ אֵלַ֗/י לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת וּ/לְ/בִלְתִּ֣י שְׂאֵ֣ת מַשָּׂ֗א וּ/בֹ֛א בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/הִצַּ֧תִּי אֵ֣שׁ בִּ/שְׁעָרֶ֗י/הָ וְ/אָֽכְלָ֛ה אַרְמְנ֥וֹת יְרוּשָׁלִַ֖ם וְ/לֹ֥א תִכְבֶּֽה־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/027.yaml
  text: But if you do not listen to me[a], to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem on the Sabbath day, then I will kindle a fire in its gates, and it will consume the palaces of Jerusalem[b], and it will not be quenched.
  footnotes:
  - marker: a
    text: Or 'carry a burden.' The Hebrew expression literally refers to lifting or bearing a load.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in her gates'; the city Jerusalem is grammatically feminine.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 너희가 나에게 듣지 않아 안식일을 거룩하게 지키지 않고, 안식일에 짐을 지고 예루살렘 성문으로 들여오지 않으면, 내가 그 성문들에 불을 지르리니 그것이 예루살렘의 궁전들을 삼킬 것이며, 꺼지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 문자적으로는 짐을 '들어 올리다/메다'는 뜻으로, 운반하는 짐이나 적재물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 예루살렘은 히브리어 문법상 여성형이므로, 원문은 문자적으로는 '그의 성문들'에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  english_pob_choice: listen to me
  chosen_korean: 나에게 듣지 않아
  alternatives_korean:
  - 나의 말을 듣지 않아
  - 내 말을 듣고 순종하지 않아
  lexicon: HALOT
  rationale: שׁמע + אל은 단순 청취를 넘는 '듣고 따름'의 뉘앙스를 가지지만, 본문 흐름을 과도하게 풀이하지 않도록 '듣지 않아'로 옮기고 문맥상 불순종의 의미를 유지했습니다.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  english_pob_choice: to keep the Sabbath day holy
  chosen_korean: 안식일을 거룩하게 지키지
  alternatives_korean:
  - 안식일을 성별하지
  - 안식일을 거룩하게 하도록
  lexicon: HALOT
  rationale: קדש의 목적구는 '거룩하게 하다/성별하다'의 뜻이지만, 현대 한국어에서는 '거룩하게 지키다'가 자연스럽고 안식일 준수의 의미를 잘 드러냅니다.
- source_word: וּלְבִלְתִּי שְׂאֵת מַשָּׂא
  english_pob_choice: and not to carry a load
  chosen_korean: 짐을 지고
  alternatives_korean:
  - 짐을 나르고
  - 부담을 메고
  lexicon: HALOT
  rationale: מַשָּׂא는 실어 나르는 짐/적재물을 가리키므로, '짐을 지고'로 옮겨 물건 운반 금지라는 실제적 의미를 살렸습니다.
- source_word: וְהִצַּתִּי אֵשׁ
  english_pob_choice: then I will kindle a fire
  chosen_korean: 내가 그 성문들에 불을 지르리니
  alternatives_korean:
  - 내가 불을 붙이리니
  - 내가 성문들에 불을 일으키리니
  lexicon: HALOT
  rationale: יצת의 사역형은 불을 붙여 번지게 하는 뜻이므로, 심판 경고의 강도를 살려 '불을 지르다'로 옮겼습니다.
- source_word: בִּשְׁעָרֶיהָ
  english_pob_choice: in its gates
  chosen_korean: 그 성문들에
  alternatives_korean:
  - 그 문들에
  - 그의 성문들에
  lexicon: HALOT
  rationale: 히브리어는 예루살렘을 여성형으로 가리키지만, 한국어는 도시를 보통 '그'로 받기보다 '그 성문들에'로 자연스럽게 처리해 성문 자체를 강조했습니다.
theological_decisions:
- issue: 안식일 표현의 직역성과 현대 한국어 자연성
  chosen_reading: 안식일을 거룩하게 지키다
  alternative_readings:
  - 안식일을 성별하다
  - 안식일을 거룩한 날로 지키다
  rationale: קדש의 성격을 유지하면서도 현대 독자가 즉시 이해할 수 있는 교회용어가 아닌 서술형 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
- issue: 심판 선언의 종결 형식
  chosen_reading: 꺼지지 않을 것입니다
  alternative_readings:
  - 꺼지지 않을 것입니다
  - 불이 꺼지지 않을 것입니다
  rationale: 히브리어의 부정 완료/미완성적 종결을 한국어 미래 부정으로 옮겨, 불이 끝내 진압되지 않는다는 예언적 확정을 드러냈습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
