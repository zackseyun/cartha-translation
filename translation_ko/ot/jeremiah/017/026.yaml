revisions:
- from: 그리고 그들은 유다의 여러 성읍과 예루살렘의 주변 지역[a], 베냐민 땅과 평지와 산지와 네겝[b]에서 와서, 번제와 희생 제물과 곡식 제물과 유향[c]을 드리며, 여호와의 집으로 감사 제물을 가져올 것입니다.
  to: 그리고 그들은 유다의 여러 성읍과 예루살렘 주변 지역에서, 베냐민 땅과 평지[a]와 산지와 네겝[b]에서 와서, 번제와 희생제와 곡식제물과 유향을 가져오며, 감사제를 야훼의 집[c]으로 가져올 것입니다.
  rationale: 각주 표지를 실제 대상 어휘에 재배치하고, 신명을 POB의 Yahweh 방침에 따라 ‘야훼’로 통일했습니다. 또한 히브리어의 두 차례 ‘가져오다’ 표현을 유지하면서 제물 목록의 제의적 의미를 자연스러운 한국어로 보존했습니다.
