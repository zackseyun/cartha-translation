id: JER.17.26
reference: Jeremiah 17:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֣אוּ מֵ/עָרֵֽי יְ֠הוּדָה וּ/מִ/סְּבִיב֨וֹת יְרוּשָׁלִַ֜ם וּ/מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מִן הַ/שְּׁפֵלָ֤ה וּ/מִן הָ/הָר֙ וּ/מִן הַ/נֶּ֔גֶב מְבִאִ֛ים עוֹלָ֥ה וְ/זֶ֖בַח וּ/מִנְחָ֣ה וּ/לְבוֹנָ֑ה וּ/מְבִאֵ֥י תוֹדָ֖ה בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/026.yaml
  text: And they will come from the cities of Judah and from the areas around Jerusalem[a], and from the land of Benjamin, and from the lowland, and from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, grain offerings and frankincense[c][b], and bringing thank offerings to the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the Shephelah,' the Judean foothill region.
    reason: lexical_alternative
  - marker: b
    text: Or 'the south'; 'Negeb' is the name of the southern region of Judah.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'house of the LORD,' that is, the temple.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그들은 유다의 여러 성읍과 예루살렘의 주변 지역[a], 베냐민 땅과 평지와 산지와 네겝[b]에서 와서, 번제와 희생 제물과 곡식 제물과 유향[c]을 드리며, 여호와의 집으로 감사 제물을 가져올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉐펠라’, 곧 유다의 구릉지 저지대입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘남쪽’; ‘네겝’은 유다 남부 지역의 이름입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘여호와의 집’, 곧 성전입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאוּ
  english_pob_choice: And they will come
  chosen_korean: 그들은 ... 와서
  alternatives_korean:
  - 그리고 그들은 올 것입니다
  - 그들은 올 것입니다
  lexicon: HALOT
  rationale: 예언적 미래 뉘앙스를 살리되 한국어에서는 이어지는 ‘와서’ 구조가 자연스러워, 앞 절의 연속 동작을 매끄럽게 표현했습니다.
- source_word: הַשְּׁפֵלָה / הָהָר / הַנֶּגֶב
  english_pob_choice: the lowland / the hill country / the Negeb
  chosen_korean: 평지와 산지와 네겝
  alternatives_korean:
  - 쉐펠라와 산지와 남쪽
  - 평야와 산지와 네게브
  lexicon: HALOT
  rationale: 지리명은 의미와 고유성을 함께 살려야 하므로, 하단 지역은 ‘평지’, 중앙 산지권은 ‘산지’, 남방 지역명은 ‘네겝’으로 옮겼습니다.
- source_word: מְבִאִים ... וּמְבִאֵי
  english_pob_choice: bringing ... and bringing
  chosen_korean: '... 드리며, ... 가져올 것입니다'
  alternatives_korean:
  - '... 바치며, ... 가져올 것입니다'
  - '... 드리며, ... 드리는'
  lexicon: HALOT
  rationale: 제사 목록의 동작을 한국어로는 ‘드리다’가 가장 자연스럽지만, 뒤의 ‘감사 제물’은 ‘가져오다’로 보완해 제물 운반과 제의 행위를 함께 드러냈습니다.
- source_word: לְבוֹנָה
  english_pob_choice: frankincense
  chosen_korean: 유향
  alternatives_korean:
  - 향
  - 프랑킨센스
  lexicon: HALOT
  rationale: לְבוֹנָה는 일반적인 ‘향’이 아니라 특정 수지인 유향을 가리키므로, 의미를 좁혀 정확하게 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와의 집
  alternative_readings:
  - 야훼의 집
  - 주님의 집
  rationale: 본문의 제의적 관용구인 ‘여호와의 집’을 유지해 한국어 성서 독자에게 즉시 식별되도록 했습니다. 본 절은 성전 지시가 핵심이므로 ‘집’을 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
