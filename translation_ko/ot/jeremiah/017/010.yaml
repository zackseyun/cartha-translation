  rationale: 원문의 병행 구조(‘마음을 살피고 / 콩팥을 시험하며’)와 ‘그의 길에 따라 / 그의 행위의 열매에 따라’라는 반복을 보존했습니다. ‘콩팥’은 낯선 히브리어 인체 은유이므로 본문에 유지하고 각주로 설명했습니다. ‘준다’는 원문의 동사를 과도하게 해석하지 않으면서, 행위에 따른 수여라는 문맥을 충분히 드러냅니다.
