  source_fidelity: ‘내장’은 히브리어 כְּלָיוֹת(직역 ‘콩팥’)의 구체적 신체 은유를 충분히 보존하지 못합니다. 또한 וְלָתֵת는 기본적으로 ‘주다’이며, ‘갚아 주다’는 보응이라는 해석을 본문 동사에 추가합니다. 수정문은 ‘콩팥’을 유지하고 ‘주다’로 옮겨 원문의 표현과 범위를 보존합니다.
  naturalness: 원문의 ‘갚아 주는 이다’는 현대 표준 한국어 합쇼체 문장으로 비문입니다. 두 문장으로 나누고 현재의 일반적·지속적 진술인 ‘준다’를 사용하여 자연스럽게 다듬었습니다.
  terminology: 신명은 기존 원칙에 따라 ‘야훼’로 유지했습니다. לֵב는 ‘마음’, כְּלָיוֹת는 ‘콩팥’으로 옮겼습니다. ‘각 사람’은 대표적 남성 단수의 문맥상 분배 의미를 자연스럽게 반영합니다.
