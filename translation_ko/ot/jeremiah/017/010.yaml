id: JER.17.10
reference: Jeremiah 17:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲנִ֧י יְהוָ֛ה חֹקֵ֥ר לֵ֖ב בֹּחֵ֣ן כְּלָי֑וֹת וְ/לָ/תֵ֤ת לְ/אִישׁ֙ כ/דרכ/ו כִּ/פְרִ֖י מַעֲלָלָֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/010.yaml
  text: I[a], Yahweh, search the heart[b], testing the kidneys, to give to each man according to his way, according to the fruit of his deeds.
  footnotes:
  - marker: a
    text: Hebrew 'kidneys,' an idiom for the innermost thoughts and affections.
    reason: cultural_note
  - marker: b
    text: Or 'to each person'; Hebrew 'to each man' uses a masculine singular form with representative force.
    reason: lexical_alternative
translation:
  language: ko
  text: 나, 야훼는 마음을 살피고 내장을 시험하여, 각 사람에게 그의 길과 그의 행위의 열매에 따라 갚아 주는 이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘내장’은 가장 깊은 내면과 감정의 중심을 가리키는 관용어입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 남성 단수형을 쓰지만, 대표적 의미로 ‘각 사람’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/POB audit trail
  rationale: 언약적 하나님의 고유 이름을 제목어로 바꾸지 않고 음역하여 보존했습니다. 한국어 교회 전통의 ‘여호와’보다 원문 투명성이 높습니다.
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 생각
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב는 사고·의지·욕망을 포괄하는 내면을 가리키므로, 한국어 성경에서 자연스럽고 포괄적인 ‘마음’으로 옮겼습니다.
- source_word: כְּלָיוֹת
  english_pob_choice: kidneys
  chosen_korean: 내장
  alternatives_korean:
  - 콩팥
  - 신장
  - 속마음
  lexicon: HALOT
  rationale: 직역하면 ‘콩팥’이지만, 한국어 독자에게는 비유 기능이 즉시 전달되지 않으므로 내면의 가장 깊은 곳을 드러내는 표상으로서 ‘내장’을 택했습니다. 본문 의미는 문맥상 내부의 감정·충동까지 포함합니다.
- source_word: לְאִישׁ
  english_pob_choice: to each man
  chosen_korean: 각 사람에게
  alternatives_korean:
  - 각 남자에게
  - 각자에게
  - 각 사람마다
  lexicon: HALOT
  rationale: 히브리어 남성 단수는 대표적 용법이지만, 한국어에서는 그 대표성을 자연스럽게 살리면서도 성별을 불필요하게 제한하지 않는 ‘각 사람에게’가 적절합니다.
- source_word: כִּפְרִי מַעֲלָלָיו
  english_pob_choice: according to the fruit of his deeds
  chosen_korean: 그 행위의 열매에 따라
  alternatives_korean:
  - 그 행실의 열매에 따라
  - 그 행동의 결과에 따라
  - 그가 한 일의 열매에 따라
  lexicon: HALOT
  rationale: ‘열매’ 이미지는 보존하되, 한국어 문장에서는 뒤의 ‘갚아 주는’과 함께 자연스럽게 읽히도록 정리했습니다. מַעֲלָלָיו의 도덕적 행위성을 ‘행위’로 옮겼습니다.
theological_decisions:
- issue: 신체 비유의 처리
  chosen_reading: ‘마음’과 ‘내장’을 직설적으로 살려, 야훼의 전면적 내면 통찰을 이미지로 드러냈습니다.
  alternative_readings:
  - ‘마음’과 ‘속사람’
  - ‘생각’과 ‘감정’
  - 두 표현을 모두 비유적으로 완화
  rationale: 본문은 하나님이 인간 내면의 가장 깊은 곳까지 살피고 평가하신다는 히브리적 인류학을 사용합니다. 비유를 풀어버리면 문장의 힘과 원문 추적성이 약해집니다.
  doctrine_reference: 원문 우선 번역 원칙; 히브리어 인체 은유 보존
- issue: 보응의 표현
  chosen_reading: ‘갚아 주는’으로 번역해 심판/보상의 행위를 직접 드러냈습니다.
  alternative_readings:
  - ‘주는’
  - ‘보상하는’
  - ‘따라 주는’
  rationale: וְלָתֵת는 단순 제공이 아니라 야훼의 평가에 따른 분배를 가리키므로, 한국어에서도 보응적 성격이 드러나야 합니다. 문맥상 중립적 ‘주다’보다 ‘갚아 주다’가 의미를 더 정확히 전달합니다.
  doctrine_reference: 예레미야의 언약적 심판 언어; 행위에 따른 하나님의 न्याय/보응
