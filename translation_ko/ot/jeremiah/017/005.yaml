  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אָר֤וּר הַ/גֶּ֨בֶר֙ אֲשֶׁ֣ר יִבְטַ֣ח בָּֽ/אָדָ֔ם וְ/שָׂ֥ם בָּשָׂ֖ר זְרֹע֑/וֹ וּ/מִן יְהוָ֖ה יָס֥וּר לִבּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/005.yaml
  text: 'Thus says Yahweh: Cursed is the man who trusts in man and makes flesh his strength[b][a], whose heart turns away from Yahweh.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'makes flesh his arm.' 'Arm' here is an idiom for strength or power.
    reason: lexical_alternative
  - marker: b
    text: '''The man'' and ''man'' render Hebrew masculine singular forms used here in a representative sense.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “사람을 신뢰하며 육체를 자기의 힘으로 삼고, 그의 마음이 야훼에게서 떠나는 그 사람은 저주를 받습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 팔’입니다. 여기서는 ‘팔’이 힘이나 능력을 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 사람’과 ‘사람’은 이 구절의 히브리어 남성 단수형을 대표적 의미로 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 격식을 살리되, יְהוָה는 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: הַגֶּבֶר
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람들
  lexicon: HALOT
  rationale: 히브리어 남성 단수는 대표적 일반인칭이므로, 한국어에서는 자연스러운 대표 표현인 ‘그 사람’으로 옮겼습니다.
- source_word: וְשָׂם בָּשָׂר זְרֹעוֹ
  english_pob_choice: and makes flesh his strength
  chosen_korean: 육체를 자기의 힘으로 삼고
  alternatives_korean:
  - 육체를 자기의 팔로 삼고
  - 육체를 힘으로 여기고
  lexicon: HALOT
  rationale: זְרֹעוֹ의 문자적 ‘팔’ 이미지는 한국어에서 어색하므로, 관용적 의미인 힘/능력의 뉘앙스를 살려 ‘힘으로 삼고’로 풀었습니다. ‘육체’는 בָּשָׂר의 연약한 인간성을 보존합니다.
- source_word: וּמִן יְהוָה יָסוּר לִבּוֹ
  english_pob_choice: whose heart turns away from Yahweh
  chosen_korean: 그의 마음이 야훼에게서 떠나는
  alternatives_korean:
  - 그의 마음이 야훼를 떠나는
  - 그의 마음이 야훼에게서 돌아서는
  lexicon: HALOT
  rationale: סוּר의 기본 뜻을 자연스럽게 살려 ‘떠나는’으로 옮겼고, לֵב/לִבּוֹ는 성경적 인간 이해를 따라 ‘마음’으로 보존했습니다.
theological_decisions:
- issue: 대표적 남성 단수의 일반성
  chosen_reading: 그 사람
  alternative_readings:
  - 사람
  - 인간
  rationale: 히브리어의 남성 단수는 여기서 대표적 일반성을 띠므로, 한국어에서도 의미를 흐리지 않는 범위에서 성별 특수성을 과도하게 지우지 않았습니다.
  doctrine_reference: 'Translation philosophy: gender-accurate rendering'
- issue: זְרֹעוֹ의 이미지와 의미
  chosen_reading: 육체를 자기의 힘으로 삼고
  alternative_readings:
  - 육체를 자기의 팔로 삼고
  - 육체를 자기의 능력으로 삼고
  rationale: 본문은 ‘팔’의 신체 이미지를 쓰지만, 예언적 대비는 인간 의지의 허약함과 잘못된 의존에 있습니다. 따라서 이미지의 핵심인 ‘힘/능력’을 드러내되, ‘육체’와의 대비는 유지했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
