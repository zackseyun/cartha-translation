  naturalness: 합쇼체와 예언자적 격식은 적절합니다. ‘사람을 의지하며 … 마음이 야훼에게서 떠나는 사람’이라는 구조가 한국어에서 더 자연스럽고, ‘의지하다’는 이 문맥의 잘못된 의존을 ‘신뢰하다’보다 직접적으로 나타냅니다.
