- source_word: נָבָל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 우매한 자
  - 미련한 자
  lexicon: HALOT
  rationale: נָבָל의 도덕적·영적 어리석음을 나타내기 위해, 단순 지능 부족보다 품격과 책임의 붕괴를 드러내는 ‘어리석은 자’를 선택했습니다.
theological_decisions:
- issue: 부정한 수익의 지속 불가능성이라는 비유의 핵심
  chosen_reading: 원문의 새 비유를 살려, 정당하지 않게 모은 부는 결국 남지 않는다는 점을 중심 의미로 유지했습니다.
  alternative_readings:
  - 불의한 재물의 몰수나 손실을 더 직접적으로 표현하는 읽기
  - 새의 번식 행동을 특정 생물학적으로 단정하는 읽기
  rationale: 히브리어의 정확한 조류 행동은 불확실하지만, 본문의 신학적 요지는 ‘자기에게 속하지 않은 것은 오래 가지 못한다’는 경고이므로 이를 과도하게 구체화하지 않았습니다.
  doctrine_reference: 잠언적 교훈; 재물과 의에 대한 예언자적 윤리
