- from: 자고새가 낳지 않은 새끼를 모으는 것 같으니, 불의하게 부를 모으는 사람도 그렇습니다. 그의 한가운데 날에 그것이 그를 떠나고, 그의 마지막에는 그는 어리석은 자가 될 것입니다.[a]
  to: 자기가 부화하지 않은 새끼를 모으는 자고새와 같습니다.[a] 불의하게 부를 모으는 사람도 그러합니다. 그의 생애가 한창일 때에 그 재물이 그를 떠나고, 그의 마지막에는 어리석은 자가 될 것입니다.
  rationale: 첫 비유의 불확실한 자연사적 배경을 본문에서 단정하지 않고, 영어 POB의 선택을 따라 ‘부화하지 않은 새끼를 모으는’으로 옮겼습니다. 시간 표현은 현대 한국어로 자연화하였고, 떠나는 대상이 부임을 명시하여 히브리어 단수 대명사의 가장 자연스러운 선행사를 드러냈습니다. 각주는 대안적 ‘알을 품는’ 독법을 문법적으로 명료하게 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:27Z'
