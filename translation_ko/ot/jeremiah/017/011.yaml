source:
  edition: WLC
  text: קֹרֵ֤א דָגַר֙ וְ/לֹ֣א יָלָ֔ד עֹ֥שֶׂה עֹ֖שֶׁר וְ/לֹ֣א בְ/מִשְׁפָּ֑ט בַּ/חֲצִ֤י ימ/ו יַעַזְבֶ֔/נּוּ וּ/בְ/אַחֲרִית֖/וֹ יִהְיֶ֥ה נָבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/011.yaml
  text: 'Like a partridge that gathers a brood it did not hatch[a], so is one who makes wealth unjustly: in the middle of his days it will leave him, and in his end he will be a fool.'
  footnotes:
  - marker: a
    text: Or 'Like a partridge that sits on eggs it did not lay.' The exact bird behavior behind the proverb is uncertain, but the sense is that what is not rightfully one's own will not remain.
    reason: lexical_alternative
translation:
  language: ko
  text: 자고새가 낳지 않은 새끼를 모으는 것 같으니, 불의하게 부를 모으는 사람도 그렇습니다. 그의 한가운데 날에 그것이 그를 떠나고, 그의 마지막에는 그는 어리석은 자가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기가 낳지 않은 알 위에 앉는 자고새.’ 새의 실제 행동은 분명하지 않지만, 뜻은 자기 것이 아닌 것은 오래 남지 않는다는 데 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קֹרֵא
  english_pob_choice: partridge
  chosen_korean: 자고새
  alternatives_korean:
  - 메추라기
  - 산닭
  lexicon: HALOT
  rationale: 문맥의 새 이미지와 전통적 식별을 따라 한국어에서 가장 자연스럽고 통용되는 새 이름인 자고새로 옮겼습니다.
- source_word: דָגַר וְלֹא יָלָד
  english_pob_choice: gathers a brood it did not hatch
  chosen_korean: 낳지 않은 새끼를 모으는
  alternatives_korean:
  - 알을 품었으나 낳지 않은
  - 부화하지 않은 알을 품는
  lexicon: HALOT
  rationale: 직역보다 한국어 속담형 비유가 살도록 ‘낳지 않은 새끼를 모으는’으로 옮겨, 원문의 ‘자기 것이 아닌 것을 거두는’ 의미를 보존했습니다.
- source_word: עֹשֶׂה עֹשֶׁר וְלֹא בְמִשְׁפָּט
  english_pob_choice: one who makes wealth unjustly
  chosen_korean: 불의하게 부를 모으는 사람
  alternatives_korean:
  - 정의 없이 부를 만드는 사람
  - 부정하게 재물을 모으는 사람
  lexicon: HALOT
  rationale: מִשְׁפָּט의 ‘옳고 바름/정의’ 의미를 살려 단순한 불법성보다 도덕적·법적 부당성을 드러내는 ‘불의하게’로 옮겼습니다.
- source_word: בַּחֲצִי יָמָיו
  english_pob_choice: in the middle of his days
  chosen_korean: 그의 한가운데 날에
  alternatives_korean:
  - 그의 날들의 한복판에
  - 그의 중간쯤 되는 날에
  lexicon: HALOT
  rationale: 원문의 ‘날들’이라는 시간적 이미지와 ‘중간’의 비유를 최대한 가깝게 보존하되, 한국어에서 어색하지 않도록 ‘그의 한가운데 날에’로 옮겼습니다.
- source_word: נָבָל
  english_pob_choice: a fool
  chosen_korean: 어리석은 자
  alternatives_korean:
  - 우매한 자
  - 미련한 자
  lexicon: HALOT
  rationale: נָבָל의 도덕적·영적 어리석음을 나타내기 위해, 단순 지능 부족보다 품격과 책임의 붕괴를 드러내는 ‘어리석은 자’를 선택했습니다.
theological_decisions:
- issue: 부정한 수익의 지속 불가능성이라는 비유의 핵심
  chosen_reading: 원문의 새 비유를 살려, 정당하지 않게 모은 부는 결국 남지 않는다는 점을 중심 의미로 유지했습니다.
  alternative_readings:
  - 불의한 재물의 몰수나 손실을 더 직접적으로 표현하는 읽기
  - 새의 번식 행동을 특정 생물학적으로 단정하는 읽기
  rationale: 히브리어의 정확한 조류 행동은 불확실하지만, 본문의 신학적 요지는 ‘자기에게 속하지 않은 것은 오래 가지 못한다’는 경고이므로 이를 과도하게 구체화하지 않았습니다.
  doctrine_reference: 잠언적 교훈; 재물과 의에 대한 예언자적 윤리
