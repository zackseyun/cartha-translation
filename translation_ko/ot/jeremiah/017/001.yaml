id: JER.17.1
reference: Jeremiah 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַטַּ֣את יְהוּדָ֗ה כְּתוּבָ֛ה בְּ/עֵ֥ט בַּרְזֶ֖ל בְּ/צִפֹּ֣רֶן שָׁמִ֑יר חֲרוּשָׁה֙ עַל ל֣וּחַ לִבָּ֔/ם וּ/לְ/קַרְנ֖וֹת מִזְבְּחוֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/001.yaml
  text: The sin of Judah is written with an iron stylus[a]; with a diamond point it is engraved on the tablet of their heart and on the horns of your altars.
  footnotes:
  - marker: a
    text: Or 'with an adamant point'; the exact identity of שָׁמִיר is uncertain, referring generally to an extremely hard substance used for engraving.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 죄는 철필로, 다이아몬드 촉으로 기록되어 있으며, 그들의 마음의 판과 너희 제단들의 뿔들에 새겨져 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다이아몬드’로 옮긴 히브리어 שָׁמִיר은 새김에 쓰이는 매우 단단한 물질을 가리키지만, 정확히 어떤 물질인지는 확정되지 않습니다. ‘아다만트’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 죄악
  - 죄의식
  - 속죄제
  lexicon: HALOT
  rationale: 예언자적 고발 문맥에서 제의적 속죄제가 아니라 도덕적·언약적 죄를 가리키므로, 자연스러운 표준어로 ‘죄’를 택했습니다.
- source_word: עֵט בַּרְזֶל
  english_pob_choice: iron stylus
  chosen_korean: 쇠로 된 서필
  alternatives_korean:
  - 쇠펜
  - 철 قلم
  - 철제 필기구
  lexicon: HALOT
  rationale: 문맥이 쓰는 도구가 아니라 새기고 기록하는 도구이므로, ‘서필’이 ‘stylus’의 기능을 더 정확히 살리고 ‘쇠로 된’이 재질을 드러냅니다.
- source_word: צִפֹּרֶן שָׁמִיר
  english_pob_choice: diamond point
  chosen_korean: 다이아몬드 끝
  alternatives_korean:
  - 다이아몬드 촉
  - 부싯돌 끝
  - 아다만트 끝
  lexicon: HALOT
  rationale: 정확한 광물 식별은 불확실하지만 매우 단단한 새김 끝이라는 기능이 핵심이므로, 본문 뜻을 가장 분명하게 드러내는 표현을 택했습니다.
- source_word: ל֣וּחַ לִבָּ֔ם
  english_pob_choice: the tablet of their heart
  chosen_korean: 그들의 마음 판
  alternatives_korean:
  - 그들의 마음의 판
  - 그들 마음의 판
  - 그들의 심판
  lexicon: HALOT
  rationale: ‘판’은 새김의 비유를 유지하고, ‘마음’은 히브리어 관용구를 한국어로 자연스럽게 풀어 주면서도 내적 중심을 보존합니다.
- source_word: מִזְבְּחוֹתֵיכֶם
  english_pob_choice: your altars
  chosen_korean: 너희의 제단 뿔
  alternatives_korean:
  - 당신들의 제단 뿔
  - 너희 제단의 뿔
  - 그대들의 제단 뿔
  lexicon: HALOT
  rationale: 마지막 절은 화자의 직접 호칭으로 전환되므로 2인칭 복수를 유지했고, ‘제단 뿔’은 מִזְבְּחוֹתֵיכֶם과 이어지는 קַרְנוֹת의 대상부를 살렸습니다.
theological_decisions:
- issue: ‘마음 판’과 ‘제단 뿔’에 새겨졌다는 이중 이미지
  chosen_reading: 죄가 단지 기억되는 정도가 아니라 내면과 예배의 중심에 지워지지 않게 박혀 있다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순히 오래 지속되는 죄의 흔적으로만 이해
  - 비유성을 약화시켜 윤리적 진술로만 평탄화
  rationale: 히브리어는 내적 중심(마음)과 제의적 중심(제단 뿔)을 함께 거론하여 죄의 고착성과 공적·종교적 가시성을 극대화합니다. 그 긴장을 살려야 본문의 예언적 압박이 유지됩니다.
  doctrine_reference: 예레미야의 언약 고발 문맥
