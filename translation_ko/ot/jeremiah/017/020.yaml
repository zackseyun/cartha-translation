review_pass:
  verdict: revise
  source_fidelity: ‘말하여야 합니다’는 앞 문맥을 이어 가는 예언자에게 주어진 명령형(‘그리고/그들에게 말하십시오’)보다 의무·당위의 뜻이 강하여 수정이 필요합니다. 또한 הַבָּאִים은 ‘예루살렘의 모든 주민’에 붙는 수식어이므로, 이를 별도의 호명 집단처럼 분리하지 않는 편이 원문 구조를 더 정확히 반영합니다. ‘성문’은 이 문맥의 שְׁעָרִים을 자연스럽게 드러내는 안전한 번역입니다.
  naturalness: 현대 공적 합쇼체로 ‘그들에게 이렇게 말하십시오’와 ‘…주민들아’가 자연스럽습니다. 호명 대상들을 먼저 제시하고 명령을 뒤에 두는 어순도 한국어 예언 선포문에 무리가 없습니다.
  terminology: יְהוָה는 프로젝트 방침에 맞추어 ‘야훼’로 유지합니다. דְבַר יְהוָה는 정착된 예언자적 표현인 ‘야훼의 말씀’이 적절합니다. 각주는 한국어 독자를 위해 전통적 영어 관례인 ‘the LORD’를 ‘주(the LORD)’로 밝혀 뜻을 분명히 하고, 표지는 ‘야훼’ 바로 뒤에 둡니다.
  issues:
