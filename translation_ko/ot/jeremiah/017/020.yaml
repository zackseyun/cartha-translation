  text: וְ/אָמַרְתָּ֣ אֲ֠לֵי/הֶם שִׁמְע֨וּ דְבַר יְהוָ֜ה מַלְכֵ֤י יְהוּדָה֙ וְ/כָל יְהוּדָ֔ה וְ/כֹ֖ל יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/020.yaml
  text: And say to them[a], “Hear the word of Yahweh, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem who enter through these gates.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들에게 말하여야 합니다. “유다의 왕들아, 그리고 온 유다와 예루살렘의 모든 주민들아, 이 문들을 통해 들어오는 자들아, 야훼의 말씀을 들으십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH’; 전통적으로는 ‘the LORD’로 옮깁니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתָּ
  english_pob_choice: And say
  chosen_korean: 말하여야 합니다
  alternatives_korean:
  - 말하십시오
  - 그리고 말하십시오
  lexicon: HALOT
  rationale: 예언적 지시문맥의 연속 명령으로 이해하여, 한국어에서는 자연스럽고 구어적이지 않은 “말하여야 합니다”로 옮겨 다음 절과의 연계를 살렸습니다.
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들으세요
  lexicon: HALOT
  rationale: 복수 명령의 직접 권면을 현대 합쇼체로 반영하여, 예언적 호소의 강도를 유지하면서도 공적인 어조를 살렸습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀
  lexicon: HALOT
  rationale: 예언문구의 고정 표현인 דְבַר는 단순한 “말”보다 계시적·공적 무게가 있는 “말씀”이 더 적절합니다.
- source_word: מַלְכֵי יְהוּדָה
  english_pob_choice: you kings of Judah
  chosen_korean: 유다의 왕들아
  alternatives_korean:
  - 유다의 왕들
  - 유다의 임금들아
  lexicon: HALOT
  rationale: 히브리어 호격을 한국어 호격 조사 “-아”로 처리해 직접 호소를 분명히 했고, “왕들”을 기본으로 하여 통치 집단 전체를 포괄했습니다.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  english_pob_choice: who enter through these gates
  chosen_korean: 이 문들을 통해 들어오는 자들아
  alternatives_korean:
  - 이 문들로 들어오는 자들아
  - 이 성문들을 통해 들어오는 자들아
  lexicon: HALOT
  rationale: 문맥상 성문을 가리키지만, 히브리어의 “문/문들” 이미지가 살아 있어 “문들”로 옮겼고, 현재분사적 수식은 호격에 맞춰 독립 호명으로 자연화했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 제목이 아니라 고유한 언약 이름이므로, 프로젝트 기본 방침에 따라 음역형 “야훼”를 본문에 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
