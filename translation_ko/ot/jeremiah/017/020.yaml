  - severity: medium
    issue: ‘이 문들을 통해 들어오는 자들아’를 독립 호명으로 처리함
    rationale: הַבָּאִים은 ‘예루살렘의 모든 주민들’을 수식합니다. 한국어에서도 ‘이 성문들로 들어오는 예루살렘의 모든 주민들아’로 결속시키는 것이 수식 관계를 보존합니다.
  - severity: low
    issue: 각주 표지 위치 및 각주 언어
    rationale: 신명 표지는 해당어 ‘야훼’에 직접 붙이는 것이 앵커를 명확히 합니다. 한국어 각주에서는 전통적 치환어를 ‘주(the LORD)’로 제시하는 편이 자연스럽고 정보도 보존합니다.
