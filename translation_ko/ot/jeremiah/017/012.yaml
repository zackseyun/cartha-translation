  yaml_path: translation/ot/jeremiah/017/012.yaml
  text: A glorious throne[a], exalted from the beginning, is the place of our sanctuary.
  footnotes:
  - marker: a
    text: Or, 'A glorious throne on high from the beginning is the place of our sanctuary,' or possibly, 'O throne of glory, exalted from the beginning, place of our sanctuary.' The Hebrew is highly compressed and allows more than one syntactical construal.
    reason: alternative_reading
translation:
  language: ko
  text: 처음부터 높은 곳에 있는 영광의 보좌[a]는 우리 성소가 있는 곳입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축되어 있어 구문 관계를 여러 방식으로 이해할 수 있습니다. 직역하면 ‘처음부터 높은 곳에 있는 영광의 보좌는 우리 성소가 있는 곳이다’이며, ‘처음부터 높은 곳에 있는 영광의 보좌가 우리 성소의 자리이다’ 또는 ‘영광의 보좌여, 처음부터 높은 곳에 계신 이여, 우리 성소의 자리여’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסֵּא
  english_pob_choice: throne
  chosen_korean: 보좌
  alternatives_korean:
  - 왕좌
  - 의자
  lexicon: HALOT
  rationale: 왕권과 통치를 함의하는 이미지이므로 일반적인 ‘의자’보다 ‘보좌’가 더 적절하며, 예언서의 장중한 문맥도 살립니다.
- source_word: כָבוֹד
  english_pob_choice: of glory / glorious
  chosen_korean: 영광의
  alternatives_korean:
  - 영광스러운
  - 존귀한
  lexicon: HALOT
  rationale: 히브리어의 명사 수식을 살려 ‘영광의 보좌’로 옮기면, 단순한 형용사화보다 원문의 응축된 표현이 더 잘 드러납니다.
- source_word: מָרוֹם
  english_pob_choice: exalted
  chosen_korean: 높이 계신
  alternatives_korean:
  - 높은
  - 높임받은
  lexicon: HALOT
  rationale: 문장 안에서 보좌를 높임과 위엄으로 규정하는 말이므로, 현대 한국어에서는 상태를 나타내는 ‘높이 계신’이 자연스럽고 힘 있습니다.
- source_word: מֵרִאשׁוֹן
  english_pob_choice: from the beginning
  chosen_korean: 태초부터
  alternatives_korean:
  - 처음부터
  - 옛적부터
  lexicon: HALOT
  rationale: 시간적 원초성을 나타내므로, 성경적 어감도 살리고 현대 독자에게도 분명한 ‘태초부터’를 택했습니다.
- source_word: מִקְדָּשֵׁנוּ
  english_pob_choice: our sanctuary
  chosen_korean: 우리 성소
  alternatives_korean:
  - 우리의 성소
  - 우리 성전
  lexicon: HALOT
  rationale: ‘성전’보다 더 넓게 거룩한 처소를 가리키는 ‘성소’가 원어의 일반적 의미를 더 직접적으로 반영합니다.
theological_decisions:
- issue: 히브리어의 압축된 무동사 구조와 문장 관계
  chosen_reading: ‘영광의 보좌, 곧 태초부터 높이 계신 그 보좌는 우리 성소의 자리입니다’처럼 동일시 구조로 옮겨, 보좌와 성소의 연관을 보존했습니다.
  alternative_readings:
  - ‘영광의 보좌가 태초부터 높이 계신 곳이며 우리 성소의 자리입니다’
  - ‘영광의 보좌여, 태초부터 높이 계신 이여, 우리 성소의 자리여’
  rationale: 원문은 매우 압축되어 있어 여러 해석이 가능하지만, 문맥이 제시하는 신학적 긴장을 풀어버리지 않도록 동일시적 독해를 채택했습니다.
  doctrine_reference: preserve theological tension rather than resolve it
