    issue: ‘그 보좌’와 ‘높이 계신’이 원문보다 해석을 덧붙입니다.
    rationale: 원문에는 지시사나 인격적 주어가 없으며, מָרוֹם은 우선적으로 ‘높은 곳에/높이’라는 표현입니다. ‘계신’은 보좌 자체를 인격적 존재와 직접 동일시하는 한국어 표현이 될 수 있습니다.
  - severity: medium
    issue: ‘태초부터’가 מֵרִאשׁוֹן의 시간 범위를 과도하게 특정할 수 있습니다.
    rationale: 이 표현은 ‘처음부터’, ‘옛적부터’ 등으로도 이해될 수 있습니다. ‘처음부터’는 영어 POB의 ‘from the beginning’과도 맞으며 불필요한 창조론적 특정화를 피합니다.
  - severity: low
    issue: ‘우리 성소의 자리’의 자연스러움이 부족합니다.
    rationale: ‘우리 성소가 있는 곳’이 מְקוֹם의 기본 뜻을 자연스러운 현대 한국어로 전달합니다.
