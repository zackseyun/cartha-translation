- source_word: לְבִלְתִּי שֹׁמֵעַ וּלְבִלְתִּי קַחַת מוּסָר
  english_pob_choice: so as not to hear and not to accept discipline
  chosen_korean: 듣지 않으려 했고 징계를 받아들이지 않으려 했습니다
  alternatives_korean:
