id: JER.17.23
reference: Jeremiah 17:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֣א שָֽׁמְע֔וּ וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֣י שומע וּ/לְ/בִלְתִּ֖י קַ֥חַת מוּסָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/023.yaml
  text: But they did not listen[a], and they did not incline their ear[c][b], but stiffened their neck so as not to hear and not to accept discipline.
  footnotes:
  - marker: a
    text: Or 'did not hear.' The Hebrew verb can mean hear, listen, or obey depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'stiffened their neck,' an idiom for stubborn resistance.
    reason: cultural_note
  - marker: c
    text: Or 'receive instruction' or 'take correction' for 'accept discipline.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 듣지 않았고, 귀를 기울이지 않았으며, 목을 굳게 하여 듣지 않으려 했고 징계를 받아들이지 않으려 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣다’는 문맥에 따라 ‘듣다, 귀담아듣다, 순종하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘목을 굳게 하다’라는 관용구로, 완고한 저항을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: ‘징계’는 단순한 정보 전달이 아니라 책망과 교정의 뜻을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמְעוּ
  english_pob_choice: did not listen
  chosen_korean: 듣지 않았고
  alternatives_korean:
  - 귀를 기울이지 않았고
  - 듣지 않고
  lexicon: HALOT
  rationale: שׁמע는 문맥에 따라 듣다/주의 깊게 듣다/순종하다의 범위를 가지므로, 여기서는 뒤의 귀 기울임과 징계 거부와 연결되는 기본 의미를 살려 ‘듣다’로 옮겼습니다.
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  english_pob_choice: did not incline their ear
  chosen_korean: 귀를 기울이지 않았으며
  alternatives_korean:
  - 귀를 기울이지 않았고
  - 귀를 돌리지 않았으며
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 표현으로 살리면서도, 문자적 이미지를 과도하게 풀지 않기 위해 ‘귀를 기울이다’를 사용했습니다.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  english_pob_choice: stiffened their neck
  chosen_korean: 목을 굳게 하여
  alternatives_korean:
  - 목을 뻣뻣하게 하여
  - 목을 굳혀
  lexicon: HALOT
  rationale: ‘목을 굳게 하다’는 반항적 완고함을 드러내는 히브리어 관용구를 비교적 직접적으로 살리면서, 현대 한국어에서도 이해 가능한 표현입니다.
- source_word: לְבִלְתִּי שֹׁמֵעַ וּלְבִלְתִּי קַחַת מוּסָר
  english_pob_choice: so as not to hear and not to accept discipline
  chosen_korean: 듣지 않으려 했고 징계를 받아들이지 않으려 했습니다
  alternatives_korean:
  - 듣지 않으려 했고 훈계를 받아들이지 않으려 했습니다
  - 듣지 않으려 했고 교훈을 받지 않으려 했습니다
  lexicon: HALOT
  rationale: לְבִלְתִּי는 목적/결과를 나타내므로 ‘~하지 않으려 했다’로 옮겼고, מוּסָר는 예언적 책망의 맥락에서 단순한 교육보다 ‘징계’가 더 무게를 잘 드러냅니다.
theological_decisions:
- issue: 반항과 책임의 강조를 위한 관용구 보존
  chosen_reading: ‘목을 굳게 하다’라는 신체적 은유를 유지했습니다.
  alternative_readings:
  - 완고해졌다
  - 고집을 부렸다
  rationale: 예언서의 언약적 반역 맥락에서 이 관용구는 단순한 성격 묘사보다 더 강한 신학적 경고를 담으므로, 해석어로 완화하지 않았습니다.
  doctrine_reference: 예레미야서의 언약 불순종과 완고함의 심판 주제
