  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִשָּׁמְר֖וּ בְּ/נַפְשֽׁוֹתֵי/כֶ֑ם וְ/אַל תִּשְׂא֤וּ מַשָּׂא֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וַ/הֲבֵאתֶ֖ם בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/021.yaml
  text: 'Thus says Yahweh: Take care for yourselves[b][a], and do not carry a load on the Sabbath day or bring it in through the gates of Jerusalem.'
  footnotes:
  - marker: a
    text: Or 'Take care for your lives' / 'Take heed to yourselves.' The Hebrew idiom literally involves 'your souls/lives' and expresses careful self-watchfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'burden' instead of 'load.' Here the sense is likely a physical item being transported on the Sabbath.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 「너희 자신을 조심하고, 안식일에 짐을 지고 다니지 말며 예루살렘의 문들로 그것을 들여오지 마십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 생명을 위해 조심하라’ / ‘너희 자신을 살피라’. 히브리어 관용구는 문자적으로는 ‘너희 영혼들/생명들’을 포함하며, 신중한 자기 경계를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부담’. 여기서는 안식일에 실제로 운반하는 물건을 가리키는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
