  - 예루살렘 성문들을 통해
  lexicon: HALOT
  rationale: 복수형 ‘문들’을 살리면서, 동사 ‘들여오다’와 결합해 성 안으로 들어오는 방향성을 한국어로 분명하게 표현했습니다.
theological_decisions:
