  lexicon: HALOT
  rationale: 예언자적 선포 공식을 현대 한국어로 자연스럽게 살리면서, 프로젝트 기준에 따라 하나님의 이름 יְהוָה를 ‘야훼’로 옮겼습니다.
- source_word: הִשָּׁמְרוּ בְּנַפְשׁוֹתֵיכֶם
