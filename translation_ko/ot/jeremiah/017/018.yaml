id: JER.17.18
reference: Jeremiah 17:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵבֹ֤שׁוּ רֹדְפַ/י֙ וְ/אַל אֵבֹ֣שָׁה אָ֔נִי יֵחַ֣תּוּ הֵ֔מָּה וְ/אַל אֵחַ֖תָּה אָ֑נִי הָבִ֤יא עֲלֵי/הֶם֙ י֣וֹם רָעָ֔ה וּ/מִשְׁנֶ֥ה שִׁבָּר֖וֹן שָׁבְרֵֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/018.yaml
  text: Let my pursuers be put to shame[a], but let me not be put to shame; let them be dismayed, but let me not be dismayed. Bring upon them a day of disaster[c][b], and shatter them with double destruction.
  footnotes:
  - marker: a
    text: Or 'my persecutors.' The Hebrew literally means 'those who pursue me.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a day of calamity.' The phrase refers to a day of judgment or ruin, not moral evil.
    reason: lexical_alternative
  - marker: c
    text: Literally 'break them with a double breaking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 쫓는 자들이 부끄러움을 당하게 하시되, 나는 부끄러움을 당하지 않게 하소서. 그들이 두려움에 떨게 하시되, 나는 두려움에 떨지 않게 하소서. 그들에게 재앙의 날을 가져오시고, 두 배의 파멸로 그들을 무너뜨리소서.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 쫓는 자들’은 문자적으로 ‘나를 뒤쫓는 자들’이라는 뜻입니다.
    reason: source_note
  - marker: b
    text: ‘재앙’은 도덕적 악이 아니라 심판이나 파멸의 날을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘두 배의 깨짐’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ / אֵבֹשָׁה
  english_pob_choice: be put to shame
  chosen_korean: 부끄러움을 당하다
  alternatives_korean:
  - 수치를 당하다
  - 부끄럽게 되다
  lexicon: HALOT
  rationale: בושׁ은 내적 감정보다 공개적 수치와 굴욕을 포함할 수 있어, 원문의 수동적 뉘앙스를 살린 ‘부끄러움을 당하다’가 적절합니다.
- source_word: רֹדְפַי
  english_pob_choice: my pursuers
  chosen_korean: 나를 쫓는 자들
  alternatives_korean:
  - 나를 박해하는 자들
  - 나의 추적자들
  lexicon: HALOT
  rationale: רדף의 기본 뜻인 ‘뒤쫓다’를 살려 구체적 이미지를 보존했고, 종교적 해석이 덧붙은 ‘박해하는 자들’은 여기서 과도하게 해석될 수 있습니다.
- source_word: יֵחַתּוּ / אֵחַתָּה
  english_pob_choice: be dismayed
  chosen_korean: 두려움에 떨다
  alternatives_korean:
  - 낙담하다
  - 당황하다
  - 무너지다
  lexicon: HALOT
  rationale: חתת의 의미군은 ‘무너지다/두려워하다/당황하다’를 포함하므로, 심리적 붕괴와 공포를 함께 드러내는 표현으로 옮겼습니다.
- source_word: יוֹם רָעָה
  english_pob_choice: a day of disaster
  chosen_korean: 재앙의 날
  alternatives_korean:
  - 재난의 날
  - 환난의 날
  - 악의 날
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 심판으로 인한 재앙을 가리키므로, 한국어로는 ‘재앙의 날’이 가장 자연스럽습니다.
- source_word: מִשְׁנֶה שִׁבָּרוֹן
  english_pob_choice: double destruction
  chosen_korean: 두 배의 파멸
  alternatives_korean:
  - 두 겹의 파괴
  - 이중의 붕괴
  - 두 배의 멸망
  lexicon: HALOT
  rationale: מִשְׁנֶה는 ‘두 배/배가된’의 뜻이고, שִׁבָּרוֹן은 ‘깨짐·파멸·붕괴’를 뜻하므로, 직역성과 자연스러움을 함께 고려해 ‘두 배의 파멸’로 옮겼습니다.
theological_decisions:
- issue: 원수에 대한 저주적 간구의 강도
  chosen_reading: 예레미야의 직접적인 심판 간구로 살려, 그 강도를 약화하지 않았습니다.
  alternative_readings:
  - 일반적인 공의의 요청으로 완화하기
  - 개인 감정의 표출로만 처리하기
  rationale: 히브리어는 하나님께 직접 드리는 명령형·청유형 기도를 사용하므로, 예언자적 탄원과 심판 요청의 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3 (theological tension 보존)
