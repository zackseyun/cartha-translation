  source_fidelity: 원문의 עָקֹב는 ‘속이다’라는 타동사보다 ‘간교한/기만적인’이라는 성질을 나타냅니다. וְאָנֻשׁ는 심각한 병듦의 은유이며, ‘몹시 병들어 있습니다’가 원문의 병리적 비유와 영어 감사본의 ‘desperately sick’를 충실히 보존합니다. 수사 의문문도 유지했습니다.
  naturalness: 초안의 ‘모든 것보다 더 속이고’는 목적어 없는 타동사처럼 들려 현대 한국어에서 다소 어색합니다. ‘모든 것보다 더 간교하고’는 자연스럽고 원문의 형용사 병렬을 잘 드러냅니다. 각주 표지는 해당 단어에 직접 붙이는 편이 명확합니다.
  terminology: ‘마음’은 לֵב의 넓은 내면적 의미를 보존하는 적절한 표준 성경 용어입니다. ‘간교하고’는 도덕적 기만성과 교활함을 나타내면서 ‘사악하다’ 같은 과도한 해석을 피합니다. ‘몹시 병들어 있습니다’는 불치라는 해석을 본문에 단정적으로 삽입하지 않습니다.
