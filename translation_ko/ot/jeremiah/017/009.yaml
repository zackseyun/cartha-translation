id: JER.17.9
reference: Jeremiah 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָקֹ֥ב הַ/לֵּ֛ב מִ/כֹּ֖ל וְ/אָנֻ֣שׁ ה֑וּא מִ֖י יֵדָעֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/009.yaml
  text: The heart is more deceitful than anything else[c][b][a], and desperately sick—who can know it?
  footnotes:
  - marker: a
    text: Or 'The heart is deceitful above all things.'
    reason: lexical_alternative
  - marker: b
    text: Or 'incurable.' The Hebrew term describes something grievously sick or beyond remedy.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'heart' refers to the inner person, including thought, will, and desire, not merely emotions.
    reason: cultural_note
translation:
  language: ko
  text: 마음은 모든 것보다 더 속이고, 치유될 수 없을 만큼 병들었습니다. 누가 그것을 알 수 있습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음은 만물보다 더 속입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘치유될 수 없습니다.’ 히브리어 표현은 심하게 병들었거나 고칠 수 없는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘마음’은 감정만이 아니라 생각, 의지, 욕망을 포함하는 내적 인격을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: עָקֹב
  english_pob_choice: deceitful
  chosen_korean: 속이고
  alternatives_korean:
  - 간교하고
  - 비뚤어지고
  - 속임수 같은
  lexicon: HALOT
  rationale: עָקֹב의 핵심은 단순한 복잡성이 아니라 기만성과 굽어짐이므로, 문맥상 동사를 써서 ‘속이다’로 풀어 자연스럽게 옮겼습니다.
- source_word: הַלֵּב
  english_pob_choice: the heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 생각
  - 속사람
  lexicon: HALOT
  rationale: 히브리어 לֵב은 감정만이 아니라 생각과 의지까지 포함하는 내적 인격을 가리키므로, 한국어에서는 문자적 ‘심장’보다 성경적 의미를 담는 ‘마음’이 적절합니다.
- source_word: מִכֹּל
  english_pob_choice: more deceitful than anything else
  chosen_korean: 모든 것보다 더
  alternatives_korean:
  - 무엇보다
  - 아무것보다도
  - 모든 것 위에
  lexicon: HALOT
  rationale: מן + כֹּל의 비교를 한국어로 자연스럽게 드러내기 위해 ‘모든 것보다 더’로 옮겨, 전통적이지만 덜 투명한 ‘만물보다’ 같은 표현은 피했습니다.
- source_word: וְאָנֻשׁ
  english_pob_choice: desperately sick
  chosen_korean: 치유될 수 없을 만큼 병들었습니다
  alternatives_korean:
  - 절망적으로 병들었습니다
  - 불치입니다
  - 심하게 병들었습니다
  lexicon: HALOT
  rationale: אָנֻשׁ의 병리적·비가역적 뉘앙스를 살리기 위해 ‘불치’의 의미를 포함하되, 한국어 문장으로는 ‘치유될 수 없을 만큼 병들었습니다’가 가장 자연스럽고 힘이 있습니다.
- source_word: מִי יֵדָעֶנּוּ
  english_pob_choice: who can know it?
  chosen_korean: 누가 그것을 알 수 있습니까?
  alternatives_korean:
  - 누가 그것을 헤아릴 수 있습니까?
  - 누가 그것을 알겠습니까?
  - 누가 그것을 알 수 있단 말입니까?
  lexicon: HALOT
  rationale: ידע의 기본 의미를 따라 ‘알다’로 옮기되, 수사 의문문의 압박을 살려 현대적 합쇼체 의문형으로 처리했습니다.
theological_decisions:
- issue: 히브리어 ‘마음’의 범위
  chosen_reading: ‘마음’을 내면 전체의 자리로 유지하고, 감정만을 뜻하는 말로 좁히지 않았습니다.
  alternative_readings:
  - 생각
  - 속사람
  rationale: 이 구절은 인간 내면의 중심이 얼마나 왜곡되었는지를 말하므로, ‘마음’이 히브리 인간론을 가장 직접적으로 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: אָנֻשׁ의 성격
  chosen_reading: 도덕적 평가어 ‘악하다/사악하다’로 바꾸지 않고 질병 은유를 유지했습니다.
  alternative_readings:
  - 사악하고 절망적입니다
  - 불치의 악입니다
  rationale: 원문은 먼저 병리적 은유로 인간 내면의 상태를 묘사하므로, ‘병들었습니다’로 옮겨 원문의 긴장과 충격을 보존했습니다.
  doctrine_reference: Translation philosophy §3
