id: JER.17.25
reference: Jeremiah 17:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הָ/עִ֣יר הַ/זֹּ֡את מְלָכִ֣ים וְ/שָׂרִ֡ים יֹשְׁבִים֩ עַל כִּסֵּ֨א דָוִ֜ד רֹכְבִ֣ים בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֗ים הֵ֚מָּה וְ/שָׂ֣רֵי/הֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/יָשְׁבָ֥ה הָֽ/עִיר הַ/זֹּ֖את לְ/עוֹלָֽם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/025.yaml
  text: then kings and officials will enter through the gates of this city[a], sitting on the throne of David, riding in chariots and on horses—they and their officials, the men of Judah and the inhabitants of Jerusalem—and this city will be inhabited forever.
  footnotes:
  - marker: a
    text: Or 'the people of Judah.' The Hebrew is literally 'man of Judah,' used collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 다윗의 보좌에 앉아 병거와 말들을 타는 왕들과 관원들, 그들과 그들의 관원들, 유다 사람들[a]과 예루살렘 주민들이 이 성읍의 문들을 지나 들어올 것이며, 이 성읍에는 영원히 사람이 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘유다의 남자’이며, 여기서는 집합적으로 쓰인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ בְשַׁעֲרֵי הָעִיר הַזֹּאת
  english_pob_choice: then kings and officials will enter through the gates of this city
  chosen_korean: 이 성읍의 문들을 통해 들어올 것입니다
  alternatives_korean:
  - 이 성읍의 문으로 들어올 것입니다
  - 이 성읍의 문들에 들어올 것입니다
  lexicon: HALOT
  rationale: בוא + בְּ는 단순한 도착보다 ‘문을 통과해 들어옴’의 이미지를 담으므로, 한국어에서는 ‘문들을 통해’로 옮겨 출입 장면을 살렸습니다.
- source_word: מְלָכִים וְשָׂרִים
  english_pob_choice: kings and officials
  chosen_korean: 왕들과 관원들이
  alternatives_korean:
  - 왕들과 지도자들이
  - 왕들과 방백들이
  lexicon: HALOT
  rationale: שָׂרִים는 혈통적 귀족보다 행정·궁정의 ‘관원’에 가깝기 때문에, 전통적 ‘방백’보다 현대어 ‘관원들’이 문맥을 더 분명하게 전달합니다.
- source_word: יֹשְׁבִים עַל כִּסֵּא דָוִד
  english_pob_choice: sitting on the throne of David
  chosen_korean: 다윗의 보좌에 앉아
  alternatives_korean:
  - 다윗의 왕좌에 앉아
  - 다윗의 보좌에 앉아 있는
  lexicon: HALOT
  rationale: 다윗 언약의 왕권 이미지를 그대로 드러내기 위해 ‘보좌’를 유지했고, 분사구는 한국어에서 자연스러운 진행형 보충 없이 ‘앉아’로 처리했습니다.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  english_pob_choice: riding in chariots and on horses
  chosen_korean: 병거와 말들을 타고
  alternatives_korean:
  - 병거와 말에 타고
  - 병거들에 타고 말들을 타고
  lexicon: HALOT
  rationale: 히브리어의 수단 표지는 한국어에서 ‘~을/를 타고’로 자연스럽게 옮기되, 병거와 말을 병렬로 유지해 군사적 위세를 살렸습니다.
- source_word: אִישׁ יְהוּדָה
  english_pob_choice: the men of Judah
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다의 남자들
  - 유다의 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘유다의 한 남자’이지만 집합적으로 쓰인 표현이므로, 성별을 과도하게 강조하지 않으면서도 공동체 전체를 가리키는 한국어로 처리했습니다.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלָ͏ִם
  english_pob_choice: and the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들이
  alternatives_korean:
  - 예루살렘 거주자들이
  - 예루살렘에 사는 이들이
  lexicon: HALOT
  rationale: 도시 거주민을 뜻하는 표준 집합 표현이므로 ‘주민들’이 가장 자연스럽고, 문맥상 병렬 구조도 매끄럽게 유지합니다.
- source_word: וְיָשְׁבָה הָעִיר הַזֹּאת לְעוֹלָם
  english_pob_choice: and this city will be inhabited forever
  chosen_korean: 이 성읍은 영원히 거주될 것입니다
  alternatives_korean:
  - 이 성읍은 영원히 사람이 살 것입니다
  - 이 성읍은 영원히 주민이 있을 것입니다
  lexicon: HALOT
  rationale: ישב이 성읍을 주어로 취할 때는 ‘살다’보다 수동적 상태인 ‘거주되다/거주될 것이다’가 원문의 상태 진술을 더 정확히 반영합니다.
theological_decisions:
- issue: 다윗의 보좌라는 왕권 언어 보존
  chosen_reading: ‘다윗의 보좌’라는 표현을 그대로 유지해, 이 약속의 다윗 왕조적 성격을 희석하지 않았습니다.
  alternative_readings:
  - 다윗의 왕좌
  - 다윗 왕조의 보좌
  rationale: 예레미야의 문맥에서 이 표현은 단순한 통치 일반이 아니라 언약적·왕조적 약속을 가리키므로, 해석을 덜어내지 않고 투명하게 남겨 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 히브리어 집합적 남성형 אִישׁ יְהוּדָה의 처리
  chosen_reading: 주본문에서는 ‘유다 사람들’로 옮겨 집합적 의미를 살리되, 성별을 불필요하게 강조하지 않았습니다.
  alternative_readings:
  - 유다 남자들
  - 유다 백성
  rationale: 문법적으로는 남성 단수지만 의미상 공동체 전체를 가리키므로, 한국어 독자가 자연스럽게 이해할 수 있는 집합 표현을 택했습니다.
  doctrine_reference: Translation philosophy §4
