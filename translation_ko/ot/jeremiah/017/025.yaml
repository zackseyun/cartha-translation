revisions:
- from: 그러면 이 성읍의 문들을 통해 왕들과 관원들이 들어올 것입니다. 그들은 다윗의 보좌에 앉아 병거와 말들을 타고 올 것이며 — 그들과 그들의 관원들, 유다 사람들과 예루살렘 주민들이 — 이 성읍은 영원히 거주될 것입니다.[a]
  to: 그러면 다윗의 보좌에 앉아 병거와 말들을 타는 왕들과 관원들, 그들과 그들의 관원들, 유다 사람들[a]과 예루살렘 주민들이 이 성읍의 문들을 지나 들어올 것이며, 이 성읍에는 영원히 사람이 살 것입니다.
  rationale: 원문의 한 문장 구조를 한국어에서도 유지하여 모든 열거 대상이 ‘들어올 것이다’에 연결되게 했습니다. 분사구는 왕들과 관원들을 수식하도록 앞에 배치했으며, 문을 통한 공식적 प्रवेश의 이미지는 ‘문들을 지나 들어올’로 살렸습니다. 도시가 계속 사람이 사는 상태라는 표현은 자연스러운 한국어로 고쳤고, 집합적 남성 단수에 관한 각주는 해당 본문 어구에 직접 연결했습니다.
