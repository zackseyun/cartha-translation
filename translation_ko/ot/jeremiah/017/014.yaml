id: JER.17.14
reference: Jeremiah 17:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְפָאֵ֤/נִי יְהוָה֙ וְ/אֵ֣רָפֵ֔א הוֹשִׁיעֵ֖/נִי וְ/אִוָּשֵׁ֑עָה כִּ֥י תְהִלָּתִ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/014.yaml
  text: Heal me[a], O Yahweh, and I will be healed; save me, and I will be saved[b], for you are my praise.
  footnotes:
  - marker: a
    text: Or 'deliver me ... and I will be delivered.' The Hebrew verb can denote rescue or deliverance as well as salvation in a broader sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'for you are the one I praise.' The Hebrew literally reads 'for you are my praise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 저를 고치소서. 그러면 제가 나을 것입니다. 저를 구원하소서. 그러면 제가 구원을 받을 것입니다.[a] 이는 야훼께서 나의 찬양이시기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저를 구출하소서 … 제가 구출될 것입니다.’ 히브리어 동사는 더 넓게는 구출이나 건짐의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이는 야훼께서 제가 찬양하는 분이시기 때문입니다.’ 히브리어는 문자적으로 ‘이는 야훼께서 나의 찬양이시기 때문입니다’라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאֵנִי
  english_pob_choice: Heal me
  chosen_korean: 저를 고치소서
  alternatives_korean:
  - 저를 치료하소서
  - 저를 회복시키소서
  lexicon: HALOT
  rationale: רפא의 기본 의미를 살리면서, 시적 기도문에서 자연스럽고 간결한 합쇼체 명령으로 옮겼습니다. '고치소서'는 치유와 회복의 폭을 함께 담습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 관용적 대체어가 아니라 고유 신명으로 처리해야 하므로, 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: הוֹשִׁיעֵנִי / וְאִוָּשֵׁעָה
  english_pob_choice: save me / and I will be saved
  chosen_korean: 저를 구원하소서. 그러면 제가 구원을 얻을 것입니다.
  alternatives_korean:
  - 저를 구해 주십시오. 그러면 제가 구해질 것입니다
  - 저를 건져 주소서. 그러면 제가 건짐을 받을 것입니다
  lexicon: HALOT
  rationale: ישׁע 계열은 구출과 구원을 모두 포함할 수 있으므로, 본문의 넓은 신학적 범위를 유지하는 '구원하다/구원을 얻다'로 번역했습니다. 수동적 결과를 한국어로 자연스럽게 풀어 옮겼습니다.
- source_word: תְהִלָּתִי אָתָּה
  english_pob_choice: for you are my praise
  chosen_korean: 이는 주님께서 저의 찬양이시기 때문입니다
  alternatives_korean:
  - 이는 주님께서 제가 찬양하는 분이시기 때문입니다
  - 이는 주님께서 저의 자랑이시기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 직역인 '나의 찬양'을 그대로 두기보다, 문맥상 하나님이 찬양의 대상이심을 드러내는 한국어 표현으로 옮겼습니다. 다만 '찬양'이라는 핵심 명사는 유지해 원문 압축성을 살렸습니다.
theological_decisions:
- issue: 히브리어 완전평행구의 결과/응답 구조
  chosen_reading: 명령-응답의 평행을 한국어로도 분명히 드러내기 위해 '…하소서. 그러면 …할 것입니다' 구조를 사용했습니다.
  alternative_readings:
  - 직역적으로 '고치소서, 그러면 나을 것입니다'
  - 소망형으로 '고쳐 주십시오, 그리하면 나을 것입니다'
  rationale: 두 개의 청원 동사와 그에 상응하는 수동 결과를 대조시키는 시적 구조이므로, 한국어에서도 인과적 응답을 분명히 보여 주는 것이 원문의 힘을 가장 잘 보존합니다.
  doctrine_reference: 시편/예레미야식 탄원 기도의 평행법 보존 원칙
- issue: תְהִלָּתִי의 신학적 함의
  chosen_reading: '''주님께서 저의 찬양이시기 때문입니다''로 두어, 하나님이 찬양의 대상이심을 직접적으로 드러냈습니다.'
  alternative_readings:
  - '''주님은 제가 찬양하는 분이시기 때문입니다'''
  - '''주님은 저의 자랑이시기 때문입니다'''
  rationale: 원문은 '내가 찬양하는 분'보다 더 압축된 소유격 표현을 사용하지만, 한국어에서는 그 함의를 풀어 주어야 의미가 분명해집니다. '찬양'을 유지해 예배적 의미를 보존했습니다.
  doctrine_reference: 시적 히브리어의 축약 표현 해석
