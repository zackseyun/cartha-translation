id: JER.17.4
reference: Jeremiah 17:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁמַטְתָּ֗ה וּ/בְ/ךָ֙ מִ/נַּחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וְ/הַעֲבַדְתִּ֨י/ךָ֙ אֶת אֹ֣יְבֶ֔י/ךָ בָּ/אָ֖רֶץ אֲשֶׁ֣ר לֹֽא יָדָ֑עְתָּ כִּֽי אֵ֛שׁ קְדַחְתֶּ֥ם בְּ/אַפִּ֖/י עַד עוֹלָ֥ם תּוּקָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/004.yaml
  text: And you[a] yourself will let go of your inheritance that I gave you, and I will make you serve your enemies in a land that you have not known; for you have kindled a fire in my anger[d][c][b]—it will burn forever.
  footnotes:
  - marker: a
    text: Or 'you will release/let drop your inheritance'; the Hebrew verb carries the image of letting go or relinquishing.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from singular ('you') to plural ('you all') in 'you have kindled,' likely moving from Judah personified to the people collectively.
    reason: alternative_reading
  - marker: c
    text: Or 'in my wrath.' Literally, 'in my nose/nostril,' a Hebrew idiom for anger.
    reason: lexical_alternative
  - marker: d
    text: Or 'for an age' / 'perpetually'; the Hebrew עוֹלָם can denote enduring or indefinite duration depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 스스로[a] 내가 네게 준 네 유업을 놓아버리게 될 것이며, 내가 너를 네가 알지 못하는 땅에서 네 원수들을 섬기게 할 것입니다. 너희가[b] 내 분노에[c] 불을 지폈으니, 그 불은 영원히[d] 타오를 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로’는 히브리어의 강조적이고 다소 어려운 표현을 반영합니다. ‘너 자신이’ 또는 ‘너도’로 이해할 수도 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 앞부분의 단수 ‘너’에서 여기의 복수 ‘너희’로 전환합니다. 유다를 인격화하여 부르던 말이 백성 전체를 고발하는 말로 옮겨 갑니다.
    reason: alternative_reading
  - marker: c
    text: ‘내 분노’는 문자적으로 ‘내 코/콧구멍’이라는 히브리어 관용구이며, 분노를 뜻합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 עוֹלָם은 문맥에 따라 ‘영원히’ 외에 ‘오랜 기간’ 또는 ‘영속적으로’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַטְתָּה וּבְךָ
  english_pob_choice: you yourself will let go
  chosen_korean: 너는 자신도 … 떠나게 될 것이며
  alternatives_korean:
  - 너는 스스로 … 놓게 될 것이며
  - 너는 네 유업을 내려놓게 될 것이며
  lexicon: HALOT
  rationale: שׁמט의 ‘놓다/놓아버리다’ 이미지를 살리되, 예언적 심판 문맥에서 자연스러운 한국어인 ‘떠나게 되다’로 풀어 과도한 의역을 피했습니다. וּבְךָ의 강조는 ‘자신도’로 반영했습니다.
- source_word: מִנַּחֲלָתְךָ אֲשֶׁר נָתַתִּי לָךְ
  english_pob_choice: of your inheritance that I gave you
  chosen_korean: 네가 받은 유업
  alternatives_korean:
  - 네 상속분
  - 내가 네게 준 유업
  lexicon: HALOT
  rationale: נחלה는 언약적·토지적 ‘유업’의 뜻이 강하므로 ‘유업’으로 옮겼습니다. יחס절은 한국어에서 간결하게 처리해 수사적 흐름을 살렸습니다.
- source_word: וְהַעֲבַדְתִּיךָ אֶת אֹיְבֶיָך
  english_pob_choice: I will make you serve your enemies
  chosen_korean: 네 원수들을 섬기게 할 것이다
  alternatives_korean:
  - 네 원수들을 섬기도록 만들 것이다
  - 네 원수들에게 종노릇하게 할 것이다
  lexicon: HALOT
  rationale: עבד의 사역형은 ‘~하게 하다’의 강제성을 지니므로 ‘섬기게 할 것이다’로 옮겼습니다. ‘종노릇하다’는 뉘앙스가 강해 여기서는 본문의 일반적 심판 선언을 과도하게 확대하지 않도록 절제했습니다.
- source_word: בְּאַפִּי
  english_pob_choice: in my anger
  chosen_korean: 내 분노에
  alternatives_korean:
  - 내 노에
  - 내 진노 가운데
  lexicon: HALOT
  rationale: אַף의 관용적 의미를 한국어의 자연스러운 감정 표현인 ‘분노’로 옮겼습니다. 직역적 신체 은유는 본문 의미를 해치지 않도록 반영 수준만 유지했습니다.
- source_word: עַד עוֹלָם תּוּקָד
  english_pob_choice: it will burn forever
  chosen_korean: 그 불은 영원히 타오를 것이다
  alternatives_korean:
  - 그 불은 영원히 탈 것이다
  - 그 불은 끝없이 타오를 것이다
  lexicon: HALOT
  rationale: עוֹלָם과 יקד의 지속적 심판 이미지를 살려 ‘영원히 타오를 것이다’로 옮겼습니다. ‘타오르다’는 불의 지속성과 강도를 함께 전달합니다.
theological_decisions:
- issue: 1인칭 단수에서 복수로의 전환
  chosen_reading: 첫 절반은 개인에게 하는 직접책망으로, 후반의 ‘너희가’는 공동체 전체를 향한 복수로 유지했습니다.
  alternative_readings:
  - 전부 단수로 맞춤
  - 복수 표지를 평탄화함
  rationale: 히브리어의 수적 전환은 유다를 인격화한 단수 호칭에서 백성 전체를 향한 복수 고발로 자연스럽게 읽히므로, 이를 평탄화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 예언 수사와 본문 긴장 보존
- issue: עַד עוֹלָם의 종말론적 강도
  chosen_reading: 주본문에는 ‘영원히’를 사용했습니다.
  alternative_readings:
  - 오랜 동안
  - 영속적으로
  rationale: 심판 선언의 압박감을 살리기 위해 한국어에서도 가장 직접적인 ‘영원히’를 택했습니다. 어휘의 탄력성은 번역 본문이 아니라 주석적 결정에서 보존합니다.
  doctrine_reference: 지속 기간 표현의 문맥적 탄력성
