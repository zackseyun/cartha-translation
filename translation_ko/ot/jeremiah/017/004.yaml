  to: 너는 스스로[a] 내가 네게 준 네 유업을 놓아버리게 될 것이며, 내가 너를 네가 알지 못하는 땅에서 네 원수들을 섬기게 할 것입니다. 너희가[b] 내 분노에[c] 불을 지폈으니, 그 불은 영원히[d] 타오를 것입니다.
  rationale: 수정문은 유업을 하나님이 주신 대상으로, 알지 못하는 땅을 강제 노역의 장소로 각각 정확히 연결합니다. ‘스스로’와 각주로 וּבְךָ의 난해한 강조를 과도하게 단정하지 않고 보존했으며, 단수에서 복수로의 전환, 분노의 신체 관용구, עוֹלָם의 의미 폭도 원문에 맞게 유지했습니다.
