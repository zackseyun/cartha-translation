review_pass:
  verdict: revise
  source_fidelity: 현 초안은 핵심 통사 관계를 바꾸었습니다. 히브리어에서 ‘내가 너에게 준’ 것은 ‘유업’(נחלה)이며, ‘알지 못하는 땅’은 원수들을 섬기게 되는 장소입니다. 그러나 초안은 ‘내가 너에게 준 그 땅에서’로 옮겨 두 관계를 뒤바꾸었습니다. 또한 접속사 וְ를 근거 없이 ‘그러므로’로 강화했고, שׁמט의 ‘놓다/내버려 두다’의 이미지를 ‘떠나게 되다’로 바꾸었습니다.
  naturalness: ‘너는 스스로 … 놓아버리게 될 것이며’는 강조와 심판 문맥을 비교적 자연스럽게 살립니다. ‘내 분노에 불을 지폈으니’는 히브리어의 불 은유를 보존하는 다소 의도적인 표현이며, 주석으로 관용구를 설명하면 충분합니다. 요청된 현대 합쇼체에 맞추어 종결을 ‘-습니다’로 정리했습니다.
  terminology: נחלה는 토지적·언약적 함의를 지닌 ‘유업’으로 유지했습니다. הִעֲבַדְתִּיךָ는 강제 사역을 나타내므로 ‘섬기게 할 것입니다’가 적절합니다. 단수 ‘너’에서 복수 ‘너희’로의 전환과 עוֹלָם의 열린 지속성은 각각 각주와 ‘영원히’로 유지했습니다.
  issues:
  - severity: high
    issue: ‘내가 너에게 준 그 땅에서’라는 구문
    rationale: 원문 ‘네 유업, 내가 네게 준 것’과 ‘네가 알지 못한 땅에서’를 결합 관계에 맞지 않게 재배치합니다. 하나님이 준 대상은 유업이고, 낯선 땅은 원수들을 섬길 장소입니다.
  - severity: medium
    issue: ‘그러므로’의 첨가
    rationale: 절두 וְ는 여기서 단순한 접속이며, 원문에 없는 명시적 논리적 귀결을 부가하지 않는 편이 안전합니다.
  - severity: medium
    issue: ‘떠나게 될 것이다’
    rationale: שׁמט는 놓다, 내버려 두다, 포기하다의 이미지를 지닙니다. ‘떠나다’는 유업 자체가 떠나는 것처럼 들리거나 행위의 구체성을 약화할 수 있습니다.
  - severity: low
