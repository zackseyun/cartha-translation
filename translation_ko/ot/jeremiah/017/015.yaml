source:
  edition: WLC
  text: הִנֵּה הֵ֕מָּה אֹמְרִ֖ים אֵלָ֑/י אַיֵּ֥ה דְבַר יְהוָ֖ה יָ֥בוֹא נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/015.yaml
  text: Look[a], they are saying to me, “Where is the word of Yahweh? Let it come now!”
  footnotes:
  - marker: a
    text: Or “the message of the LORD.” The Hebrew phrase is the standard prophetic expression for a divine word or oracle.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그들이 저에게 말합니다. 「야훼의 말씀이 어디 있느냐? 이제 오게 하라!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「야훼의 메시지」. 히브리어 표현은 신적 말씀이나 신탁을 가리키는 예언 공식어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 주의를 끌어 상황을 지시하는 감탄사로 보며, 현대 한국어에서는 공손하고도 자연스러운 「보십시오」가 문맥의 즉시성을 잘 살립니다.
- source_word: אֹמְרִים
  english_pob_choice: are saying
  chosen_korean: 말합니다
  alternatives_korean:
  - 계속 말합니다
  - 말하고 있습니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 진행·반복성을 한국어에서 과도하게 부풀리지 않고, 담화 상황을 자연스럽게 드러내는 현재형으로 옮겼습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 여호와의 말씀
  lexicon: HALOT
  rationale: 예언 공식구의 דְבַר는 단순한 정보가 아니라 신적 선포를 가리키므로 「말씀」이 적절하며, יְהוָה는 본 프로젝트 기준에 따라 「야훼」로 옮겼습니다.
- source_word: יָבוֹא נָא
  english_pob_choice: Let it come now
  chosen_korean: 이제 오게 하라
  alternatives_korean:
  - 지금 오라
  - 이제 오십시오
  lexicon: HALOT
  rationale: 도전적·조롱적 요청을 나타내는 용법이므로, 명령적 뉘앙스를 살리되 현대 한국어에서 자연스러운 「오게 하라」로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적·예언적 발화의 고유명사 יְהוָה를 직접 사용하므로, 대체 칭호인 「주」보다 고유신명 표기가 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
