source:
  edition: WLC
  text: כִּ֗י בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה מַסִּ֥ית אֹתְ/ךָ֖ בָּ֑/נוּ לְמַעַן֩ תֵּ֨ת אֹתָ֤/נוּ בְ/יַֽד הַ/כַּשְׂדִּים֙ לְ/הָמִ֣ית אֹתָ֔/נוּ וּ/לְ/הַגְל֥וֹת אֹתָ֖/נוּ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
  footnotes:
  - marker: a
    text: Or 'is stirring you up against us' / 'is instigating you against us.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''into the hand of the Chaldeans,'' an idiom for being delivered into their power.'
    reason: cultural_note
  - marker: c
    text: Or 'to exile us to Babylon' or 'to deport us to Babylon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바룩 네리야의 아들이 당신을 우리에게 대항하도록 선동하는 것은, 우리를 갈대아 사람들의 손에 넘겨 죽이고 바벨론으로 끌고 가서 포로로 삼으려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַסִּית
  english_pob_choice: is inciting
  chosen_korean: 선동하는 것은
  alternatives_korean:
  - 부추기는 것은
  - 부추겨서 반대하게 하는 것은
  - 유혹하는 것은
  lexicon: HALOT
  rationale: 히필 분사의 적대적·조종적 뉘앙스를 살리기 위해, 중립적인 ‘설득’보다 ‘선동하다’를 택했습니다.
- source_word: אֹתְךָ בָּנוּ
  english_pob_choice: you against us
  chosen_korean: 당신을 우리에게 대항하도록
  alternatives_korean:
  - 당신을 우리를 향해
  - 당신을 우리에 맞서
  - 당신을 우리에 반대하게
  lexicon: HALOT
  rationale: 히브리어의 방향성과 적대성을 드러내기 위해 단순한 목적어 관계보다 ‘우리에게 대항하도록’으로 옮겼습니다.
- source_word: בְיַד הַכַּשְׂדִּים
  english_pob_choice: into the hand of the Chaldeans
  chosen_korean: 갈대아 사람들의 손에 넘겨
  alternatives_korean:
  - 갈대아 사람들의 권력 아래
  - 갈대아 사람들에게
  - 갈대아 사람들의 힘에
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구를 보존하는 핵심 요소이므로 유지했고, 동사로는 자연스럽게 ‘넘겨’라고 하여 관용구의 힘을 살렸습니다.
- source_word: וּלְהַגְלוֹת אֹתָנוּ בָּבֶל
  english_pob_choice: to carry us away into exile to Babylon
  chosen_korean: 바벨론으로 끌고 가서 포로로 삼으려는 것입니다
  alternatives_korean:
  - 바벨론으로 끌고 가서 유배시키려는 것입니다
  - 바벨론으로 데려가 포로가 되게 하려는 것입니다
  - 바벨론으로 옮겨 유배시키려는 것입니다
  lexicon: HALOT
  rationale: גלה의 강제 이송·포로화 의미를 반영해, 단순한 ‘유배하다’보다 결과를 분명히 드러내는 표현을 택했습니다.
