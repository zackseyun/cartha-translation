base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
  footnotes:
  - marker: a
    text: Or 'is stirring you up against us' / 'is instigating you against us.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''into the hand of the Chaldeans,'' an idiom for being delivered into their power.'
    reason: cultural_note
  - marker: c
    text: Or 'to exile us to Babylon' or 'to deport us to Babylon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네리야의 아들 바룩이 당신을 우리에게 맞서도록 부추겨[a], 당신이 우리를 갈대아 사람들의 손에 넘기고[b] 우리가 죽임을 당하며 바벨론으로 끌려가 유배되게 하려는 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 우리에게 맞서도록 선동하여’ 또는 ‘당신을 우리에게 맞서도록 충동질하여’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘갈대아 사람들의 손에’. 이는 그들의 권세나 지배 아래 넘겨진다는 뜻의 히브리어 관용 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘바벨론으로 끌려가 포로가 되게 하려는 것입니다’ 또는 ‘바벨론으로 이송되게 하려는 것입니다’.
    reason: lexical_alternative
