id: JER.43.9
reference: Jeremiah 43:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַ֣ח בְּ/יָדְ/ךָ֞ אֲבָנִ֣ים גְּדֹל֗וֹת וּ/טְמַנְתָּ֤/ם בַּ/מֶּ֨לֶט֙ בַּ/מַּלְבֵּ֔ן אֲשֶׁ֛ר בְּ/פֶ֥תַח בֵּית פַּרְעֹ֖ה בְּ/תַחְפַּנְחֵ֑ס לְ/עֵינֵ֖י אֲנָשִׁ֥ים יְהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/009.yaml
  text: Take large stones in your hand and hide them in the mortar[a], in the brick pavement that is at the entrance of Pharaoh’s house in Tahpanhes[c][b], before the eyes of the Jewish men.
  footnotes:
  - marker: a
    text: Or 'bury them' for 'hide them'; the Hebrew verb can denote concealing by placing something in the ground or structure.
    reason: lexical_alternative
  - marker: b
    text: Or 'brickwork,' 'brick terrace,' or possibly 'brick kiln' for 'brick pavement'; the Hebrew term is rare and its precise architectural sense is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'Judean men.' The Hebrew adjective can refer either to Jews/Judahites ethnically or to people of Judah more specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 큰 돌들을 네 손에 들고, 그것들을 모르타르 안, 곧 바벨벽돌 포장 안에 숨기십시오. 그곳은 다바네스에 있는 바로의 집 어귀입니다. 유다 사람들 앞에서 그렇게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨기다’가 아니라 ‘묻다’로도 옮길 수 있습니다. 히브리어 동사는 땅이나 구조물 속에 감추는 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벽돌 공사’, ‘벽돌 단’, ‘벽돌 가마’일 수 있습니다. 히브리어 용어가 희귀하여 정확한 건축물의 성격은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘유다인들’. 히브리어 형용사는 민족적 의미의 유대인/유다 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בְּיָדְךָ
  english_pob_choice: Take ... in your hand
  chosen_korean: 네 손에 들고
  alternatives_korean:
  - 손에 잡고
  - 네 손으로 가져다가
  lexicon: HALOT
  rationale: 히브리어 명령문과 단수형 ‘손’을 자연스럽게 살리면서, 한국어에서는 소유격 직역보다 동작 중심의 ‘들고’가 더 자연스럽습니다.
- source_word: אֲבָנִים גְּדֹלוֹת
  english_pob_choice: large stones
  chosen_korean: 큰 돌들
  alternatives_korean:
  - 큰 바위들
  - 거대한 돌들
  lexicon: HALOT
  rationale: ‘큰’이 크기 강조를 충분히 전달하며, ‘돌들’이 문자 그대로의 복수를 유지합니다.
- source_word: בַּמֶּלֶט
  english_pob_choice: in the mortar
  chosen_korean: 모르타르 안
  alternatives_korean:
  - 회반죽 속
  - 몰탈 속
  lexicon: HALOT
  rationale: 건축 재료를 가리키는 말로서 ‘모르타르’가 본문 맥락을 가장 직접적으로 살립니다.
- source_word: בַּמַּלְבֵּן
  english_pob_choice: in the brick pavement
  chosen_korean: 바벨벽돌 포장 안
  alternatives_korean:
  - 벽돌 포장 안
  - 벽돌 깔린 곳 안
  - 벽돌 공사장 안
  lexicon: HALOT
  rationale: 이 희귀어는 정확한 건축적 지시가 불확실하므로, POB의 ‘brick pavement’에 맞춰 기능적으로 옮기되 문맥상 ‘포장’으로 처리했습니다. ‘바벨’은 앞의 모르타르와 구별되는 ‘벽돌’ 재료를 드러내려 넣었습니다.
- source_word: לְעֵינֵי
  english_pob_choice: before the eyes of
  chosen_korean: '... 앞에서'
  alternatives_korean:
  - '... 보는 앞에서'
  - '...의 눈앞에서'
  lexicon: HALOT
  rationale: 공개적으로 목격되는 행위를 나타내는 관용구를 한국어의 자연스러운 ‘~앞에서’로 살렸습니다.
- source_word: אֲנָשִׁים יְהוּדִים
  english_pob_choice: the Jewish men
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유다 사람들 앞에서
  - 유대인 남자들
  - 유다 사람 남자들
  lexicon: HALOT
  rationale: 문맥상 예루살렘/유다 공동체를 가리키므로 ‘유다 사람들’이 가장 자연스럽고, 성별 표시가 필요한 히브리어 אֲנָשִׁים는 문맥상 집단 호칭으로 처리했습니다.
theological_decisions:
- issue: 공개 행위의 표지
  chosen_reading: 예레미야가 표징 행위를 ‘유다 사람들 앞에서’ 하도록 명령받는 것으로 옮겼습니다.
  alternative_readings:
  - 그들에게 보이도록
  - 그들의 눈앞에서
  rationale: 본문의 의도는 은밀한 행위가 아니라 증언적·표징적 행위의 공개성에 있으므로, 시각적 노출을 분명히 드러냈습니다.
  doctrine_reference: 예언적 표징 행위와 공적 증언
