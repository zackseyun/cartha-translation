source:
  edition: WLC
  text: אֶֽת הַ֠/גְּבָרִים וְ/אֶת הַ/נָּשִׁ֣ים וְ/אֶת הַ/טַּף֮ וְ/אֶת בְּנ֣וֹת הַ/מֶּלֶךְ֒ וְ/אֵ֣ת כָּל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר הִנִּ֨יחַ֙ נְבוּזַרְאֲדָ֣ן רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֑ן וְ/אֵת֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא וְ/אֶת בָּר֖וּךְ בֶּן נֵרִיָּֽהוּ־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/006.yaml
  text: the men[a], the women, the little children, the king’s daughters, and every person whom Nebuzaradan the captain of the guard had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet[c][b], and Baruch son of Neriah—
  footnotes:
  - marker: a
    text: Or 'the children'; Hebrew טַף can denote little ones or dependent children more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'every soul.' Here 'soul' is a Hebrew way of referring to a person.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'chief of the slaughterers/executioners,' a title commonly rendered 'captain of the guard.'
    reason: cultural_note
translation:
  language: ko
  text: 남자들과 여자들, 어린아이들, 왕의 딸들, 그리고 느부사라단 경호대장이 남겨 둔 모든 사람, 곧 사반의 손자 아히감의 아들 그다랴와 예언자 예레미야와 네리야의 아들 바룩을 포함하여, 그들을 데려갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어린아이들’은 히브리어 טַף의 가능한 뜻을 반영합니다. 이 말은 어린 자녀들뿐 아니라 부양가족을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 사람’은 문자적으로는 ‘모든 영혼’에 해당하지만, 여기서는 사람 한 사람 한 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘경호대장’으로 옮긴 히브리어 רַב טַבָּחִים은 문자적으로 ‘살육자들/처형자들의 우두머리’이며, 신바빌로니아의 궁정·군사 직함으로 널리 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַגְּבָרִים / הַנָּשִׁים / הַטַּף
  english_pob_choice: the men / the women / the little children
  chosen_korean: 남자들, 여자들, 어린아이들
  alternatives_korean:
  - 남자들, 여자들, 아이들
  - 남자들, 여자들, 어린 자녀들
  lexicon: HALOT
  rationale: 성별과 연령의 사회적 범주를 자연스럽게 살리되, טַף의 ‘어린아이들/의존하는 자들’이라는 폭넓은 뜻은 문맥상 ‘어린아이들’로 충분히 전달됩니다.
- source_word: בְּנוֹת הַמֶּלֶךְ
  english_pob_choice: the king’s daughters
  chosen_korean: 왕의 딸들
  alternatives_korean:
  - 공주들
  - 왕녀들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지해 ‘왕의 딸들’로 옮겼습니다. ‘공주들’은 가능하지만 한국어 관용이 너무 앞서 나가며, 원문의 친족 관계 표현을 약화시킬 수 있습니다.
- source_word: כָּל הַנֶּפֶשׁ
  english_pob_choice: every person
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 영혼
  - 모든 생명
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 비물질적 ‘영혼’이 아니라 사람 전체를 가리키므로, POB의 취지를 따라 한국어로는 자연스럽고 오해가 적은 ‘모든 사람’으로 옮겼습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 친위대장
  - 시위대장
  lexicon: HALOT
  rationale: POB의 문화적 설명을 반영하되, 현대 한국어에서 ‘guard’의 직함을 가장 무리 없이 전달하는 표현으로 ‘경호대장’을 택했습니다. ‘경호대장’은 기능을 보여 주면서도 과도한 해설을 줄입니다.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  english_pob_choice: Jeremiah the prophet
  chosen_korean: 예언자 예레미야
  alternatives_korean:
  - 예레미야 선지자
  - 예언자 예레미야
  lexicon: HALOT
  rationale: ‘נָבִיא’는 전통적 교회어인 ‘선지자’보다 중립적이고 현대적인 ‘예언자’가 원문 기능을 더 직접적으로 드러냅니다.
- source_word: בָּרוּךְ בֶּן נֵרִיָּהוּ
  english_pob_choice: Baruch son of Neriah
  chosen_korean: 네리야의 아들 바룩
  alternatives_korean:
  - 바룩 네리야의 아들
  - 바룩, 네리야의 아들
  lexicon: HALOT
  rationale: 히브리어의 부자 관계 표지를 한국어 소유격으로 자연스럽게 풀어 ‘네리야의 아들 바룩’으로 옮겼습니다.
