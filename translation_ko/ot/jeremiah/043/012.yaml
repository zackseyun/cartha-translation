source:
  edition: WLC
  text: וְ/הִצַּ֣תִּי אֵ֗שׁ בְּ/בָתֵּי֙ אֱלֹהֵ֣י מִצְרַ֔יִם וּ/שְׂרָפָ֖/ם וְ/שָׁבָ֑/ם וְ/עָטָה֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם כַּ/אֲשֶׁר יַעְטֶ֤ה הָֽ/רֹעֶה֙ אֶת בִּגְד֔/וֹ וְ/יָצָ֥א מִ/שָּׁ֖ם בְּ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/012.yaml
  text: And he will set fire to the temples of the gods of Egypt[a], and he will burn them and carry them away. He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment[b], and he will go out from there in peace.
  footnotes:
  - marker: a
    text: 'Hebrew: ''And I will set fire to the temples of the gods of Egypt.'' The main text follows the surrounding context, where the king of Babylon is the acting subject.'
    reason: alternative_reading
  - marker: b
    text: Or 'take them captive.' The Hebrew may refer to carrying off the gods, their images, or temple treasures.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 이집트 신들의 신전들에 불을 지르고[a], 그것들을 태우고 가져갈 것입니다[b]. 그는 목자가 자기 옷을 몸에 두르듯 이집트 땅을 몸에 두르고, 거기에서 평안히 떠날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘그리고 내가 이집트 신들의 신전들에 불을 지를 것이다.’ 본문은 앞뒤 문맥에서 바빌론 왕이 행위 주체가 되는 흐름을 따랐습니다.'
    reason: alternative_reading
  - marker: b
    text: 또는 ‘사로잡아 갈 것입니다.’ 히브리어는 신들, 그 형상, 또는 신전의 보물들을 옮겨 가는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  english_pob_choice: And he will set fire
  chosen_korean: 불을 지르며
  alternatives_korean:
  - 불을 붙이며
  - 불을 놓으며
  lexicon: HALOT
  rationale: 히브리어의 사역적 ‘불붙이다/점화하다’ 의미를 자연스러운 현대 한국어 동사구로 옮겼습니다. 문맥상 주어가 바빌론 왕으로 이어지므로 3인칭으로 풀어 썼습니다.
- source_word: בְּבָתֵּי אֱלֹהֵי מִצְרַיִם
  english_pob_choice: to the temples of the gods of Egypt
  chosen_korean: 이집트의 신들의 신전들
  alternatives_korean:
  - 이집트 신들의 집들
  - 이집트의 신전들
  lexicon: HALOT
  rationale: 직역하면 ‘집들’이지만, 신에 대한 ‘집’은 문맥상 신전/성소를 가리키므로 그 참조 대상을 분명히 했습니다.
- source_word: וְשָׁבָם
  english_pob_choice: and carry them away
  chosen_korean: 빼앗아 갈 것입니다
  alternatives_korean:
  - 사로잡아 갈 것입니다
  - 가져갈 것입니다
  lexicon: HALOT
  rationale: שׁבה는 포로로 ‘끌고 가다/빼앗아 가다’의 뜻을 가질 수 있어, 신상·보물·제의 물품까지 포괄하는 영어 audit trail의 불확정성을 살려 옮겼습니다.
- source_word: וְעָטָה אֶת אֶרֶץ מִצְרַיִם כַּאֲשֶׁר יַעְטֶה הָרֹעֶה אֶת בִּגְדוֹ
  english_pob_choice: He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment
  chosen_korean: 그는 목자가 자기 겉옷을 몸에 두르듯 이집트 땅을 몸에 두르고
  alternatives_korean:
  - 그는 목자가 자기 겉옷을 두르듯 이집트 땅을 두르고
  - 그는 목자가 자기 옷을 입듯 이집트 땅을 몸에 두르고
  lexicon: HALOT
  rationale: 땅을 옷처럼 두르는 비유를 보존하기 위해 ‘몸에 두르다’를 사용했습니다. ‘겉옷’은 בגד의 일반적 옷가지 감각을 살리면서 비유를 자연스럽게 합니다.
theological_decisions:
- issue: 문두 첫 동사의 인칭(‘내가’/‘그가’)
  chosen_reading: 본문은 ‘그가’로 옮기되, 각주에 ‘내가’라는 히브리어 표면형 가능성을 남겼습니다.
  alternative_readings:
  - 그리고 내가 이집트의 신들의 신전들에 불을 지르며…
  rationale: 열거되는 동사들이 곧바로 3인칭으로 이어져 바빌론 왕이 실행 주체로 읽히므로 본문은 문맥 주어를 따랐습니다. 다만 마소라 본문의 1인칭 형태는 본문 각주로 투명하게 기록했습니다.
  doctrine_reference: 'Translation philosophy #1, #3, #5'
