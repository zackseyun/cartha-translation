    rationale: שבה는 사로잡거나 끌고 가는 뜻을 낼 수 있으나, 여기서는 목적어가 신들·신상·보물 가운데 무엇인지 불명확합니다. ‘가져갈 것입니다’가 영어 POB의 ‘carry them away’와 원문의 불확정성을 더 잘 유지합니다.
  - severity: low
