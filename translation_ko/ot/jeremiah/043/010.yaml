  to: 그들에게 이렇게 말하십시오. “만군의 야훼, 이스라엘의 하나님이 이렇게 말씀하십니다. ‘보십시오, 내가 사람을 보내어 바빌론 왕 느부갓네살, 곧 나의 종을 데려오겠습니다. 내가 그의 왕좌를 내가 숨겨 둔 이 돌들 위에 세우겠고, 그는 그 위에 자기 휘장[a]을 펼칠 것입니다.’”
