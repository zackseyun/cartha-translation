id: JER.43.10
reference: Jeremiah 43:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י שֹׁלֵ֨חַ֙ וְ֠/לָקַחְתִּי אֶת נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עַבְדִּ֔/י וְ/שַׂמְתִּ֣י כִסְא֔/וֹ מִ/מַּ֛עַל לָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה אֲשֶׁ֣ר טָמָ֑נְתִּי וְ/נָטָ֥ה אֶת שפרור/ו עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/010.yaml
  text: 'And say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am sending and will take Nebuchadnezzar king of Babylon, my servant, and I will set his throne above these stones that I have hidden, and he will spread his canopy over them.’'
  footnotes:
  - marker: a
    text: Or "his pavilion," "his royal tent," or possibly another term for a covering spread by a king."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. “만군의 야훼, 이스라엘의 하나님이 이렇게 말씀하십니다. 보아라, 내가 바빌론 왕 느부갓네살 곧 나의 종을 보내며, 내가 그가 앉을 왕좌를 내가 숨겨 둔 이 돌들 위에 두겠습니다. 그러면 그가 그 위에 자기 휘장을 펴게 될 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 정자,” “그의 왕실 천막,” 혹은 왕이 펴는 덮개를 가리키는 다른 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주
  lexicon: HALOT
  rationale: יהוה는 본문 표준에 따라 ‘야훼’로 옮기고, צְבָאוֹת은 신학적 호칭의 관용을 살려 ‘만군의’로 처리해 “Yahweh of hosts”의 호칭성을 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보아라
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 긴박함을 살리면서도 현대 한국어에서 자연스럽게 들리는 지시어로 옮겼습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 나의 종
  alternatives_korean:
  - 나의 노예
  - 나의 일꾼
  lexicon: HALOT
  rationale: 여기서는 느부갓네살이 하나님의 판단 도구로 쓰인다는 의미가 중심이므로, 본문이 드러내는 신학적 긴장을 유지하는 ‘종’을 택했습니다.
- source_word: כִסְאוֹ
  english_pob_choice: his throne
  chosen_korean: 왕좌
  alternatives_korean:
  - 보좌
  - 자리
  lexicon: HALOT
  rationale: 왕권 맥락에서 단순한 ‘자리’보다 ‘왕좌’가 원문의 지위를 더 분명하게 드러냅니다.
- source_word: שפרורו / וְנָטָה
  english_pob_choice: he will spread his canopy
  chosen_korean: 자기 휘장을 펴게 될 것입니다
  alternatives_korean:
  - 자기 장막을 펴게 될 것입니다
  - 자기 천막을 펼칠 것입니다
  - 자기 휘장을 펼칠 것입니다
  lexicon: HALOT
  rationale: 희귀한 שפרורו는 덮개/휘장류의 의미가 가장 유력하므로, 본문 이미지를 자연스럽게 살리는 ‘휘장’을 택하고 ‘펴다’로 동작을 옮겼습니다.
theological_decisions:
- issue: 느부갓네살을 ‘나의 종’으로 부르는 표현
  chosen_reading: 하나님이 이방 왕을 주권적으로 도구 삼으시는 표현으로 읽되, 그를 도덕적으로 승인하거나 언약적 신실함을 부여하는 뜻으로는 읽지 않았습니다.
  alternative_readings:
  - ‘나의 노예’로 더 강하게 종속성을 드러내기
  - 해석적으로 ‘내가 쓰는 대리자’로 바꾸기
  rationale: 본문은 하나님의 주권과 심판 도구로서의 사용을 말할 뿐이므로, ‘종’이 가장 잘 이 긴장을 보존합니다.
  doctrine_reference: 하나님의 주권과 성경 본문의 의도 보존
- issue: 희귀어 שפרורו의 처리
  chosen_reading: ‘휘장’으로 옮기고 동작은 ‘펼치다/펴다’로 표현해 왕의 덮개를 가리키는 이미지를 유지했습니다.
  alternative_readings:
  - ‘정자’
  - ‘장막’
  - ‘왕의 천막’
  rationale: 문맥상 왕의 위엄을 드러내는 덮개/천개 이미지가 핵심이므로, 한국어 독자가 즉시 이해할 수 있는 표현을 택하되 불확실성은 번역 자체를 과도하게 단정하지 않도록 했습니다.
  doctrine_reference: 어휘 불확실성의 보존
