id: JER.43.13
reference: Jeremiah 43:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁבַּ֗ר אֶֽת מַצְּבוֹת֙ בֵּ֣ית שֶׁ֔מֶשׁ אֲשֶׁ֖ר בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֶת בָּתֵּ֥י אֱלֹהֵֽי מִצְרַ֖יִם יִשְׂרֹ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/013.yaml
  text: He will shatter the pillars of Beth-shemesh that is in the land of Egypt[b][a], and he will burn the temples of the gods of Egypt with fire.
  footnotes:
  - marker: a
    text: Or 'sacred pillars' or 'standing stones.' The Hebrew term refers to cultic stone pillars.
    reason: lexical_alternative
  - marker: b
    text: Beth-shemesh means 'House of the Sun' and likely refers to the Egyptian city known in Greek as Heliopolis.
    reason: cultural_note
translation:
  language: ko
  text: 그는 이집트 땅에 있는 벧세메스의 기둥들을 부수고, 이집트의 신들의 집들을 불로 태울 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַצְּבוֹת는 제의적 ‘세운 돌’ 또는 ‘기둥’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 벧세메스는 문자적으로 ‘태양의 집’이라는 뜻이며, 이집트의 헬리오폴리스로 알려진 도시를 가리키는 것으로 여겨집니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁבַּר
  english_pob_choice: he will shatter
  chosen_korean: 부수고
  alternatives_korean:
  - 산산이 부수고
  - 깨뜨리고
  lexicon: HALOT
  rationale: 예언적 심판의 강한 파괴를 자연스러운 현대 한국어로 옮기되, 미래 서술의 흐름에 맞게 연결했습니다.
- source_word: מַצְּבוֹת
  english_pob_choice: pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 돌기둥들
  - 세운 돌들
  lexicon: HALOT
  rationale: 문맥상 우상 숭배와 관련된 기둥이지만, 본문 자체의 기본 의미를 살려 ‘기둥들’로 옮기고 세부적인 제의적 성격은 본문 맥락이 드러내게 했습니다.
- source_word: בֵּית שֶׁמֶשׁ
  english_pob_choice: Beth-shemesh
  chosen_korean: 벧세메스
  alternatives_korean:
  - 벧세메쉬
  - 태양의 집
  lexicon: HALOT
  rationale: 지명은 통용되는 음역을 따랐습니다. 의미 번역인 ‘태양의 집’은 본문이 요구하지 않으므로 본문에는 넣지 않았습니다.
- source_word: בָּתֵּי אֱלֹהֵי מִצְרַיִם
  english_pob_choice: the temples of the gods of Egypt
  chosen_korean: 이집트의 신들의 집들
  alternatives_korean:
  - 이집트 신들의 신전들
  - 이집트 신들의 성소들
  lexicon: HALOT
  rationale: 히브리어의 ‘집들’을 그대로 살리면서도 우상 제의 장소를 가리킨다는 점을 유지했습니다. 영어 POB의 ‘temples’보다 덜 해석적이지만 원문에 더 밀착합니다.
- source_word: יִשְׂרֹף בָּאֵשׁ
  english_pob_choice: he will burn ... with fire
  chosen_korean: 불로 태울 것입니다
  alternatives_korean:
  - 불에 태울 것입니다
  - 불을 놓아 태울 것입니다
  lexicon: HALOT
  rationale: 히브리어는 ‘불로’라는 수단 표지와 ‘태우다’의 중복 표현을 사용하므로, 한국어에서도 ‘불로 태울 것입니다’로 그 강조를 살렸습니다.
theological_decisions:
- issue: 예언적 미래 시제의 표현
  chosen_reading: 이 구절은 심판 선언을 미래형으로 옮겨, 야훼의 행위가 확정된 장래 사건으로 들리게 했습니다.
  alternative_readings:
  - 현재형으로 ‘부숩니다/태웁니다’라고 옮길 수 있습니다.
  - 명령형처럼 강하게 옮길 수 있습니다.
  rationale: 히브리어 연속 미래형의 예언적 기능을 한국어에서 자연스러운 미래 서술로 재현하는 것이 본문 기능을 가장 잘 드러냅니다.
  doctrine_reference: 예언서의 선포적 미래
- issue: ‘신들의 집들’의 제의적 의미
  chosen_reading: ‘집들’이라는 원어의 표현을 유지해, 우상 숭배 체계의 거처/성소를 직접 가리키는 느낌을 살렸습니다.
  alternative_readings:
  - ‘신전들’로 풀어 제의 장소를 명시할 수 있습니다.
  - ‘성소들’로 완화할 수 있습니다.
  rationale: 원문은 단순한 건축물보다 이집트 신들의 거주·예배 장소를 가리키며, 그 파괴는 우상 숭배에 대한 야훼의 심판을 강조합니다.
  doctrine_reference: 우상 파괴와 야훼의 심판
