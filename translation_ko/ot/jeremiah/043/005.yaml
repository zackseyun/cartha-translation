  text: Then Johanan son of Kareah[a], and all the commanders of the forces, took all the remnant of Judah who had returned from all the nations where they had been driven away[b], to sojourn in the land of Judah—
  footnotes:
  - marker: a
    text: Or 'where they had been scattered.' The Hebrew verb can denote being driven away, banished, or dispersed.
    reason: lexical_alternative
  - marker: b
    text: Or 'to sojourn in the land of Judah.' The Hebrew verb often carries the nuance of residing as a temporary or dependent resident.
    reason: lexical_alternative
