  text: וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ מִצְרַ֔יִם כִּ֛י לֹ֥א שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה וַ/יָּבֹ֖אוּ עַד תַּחְפַּנְחֵֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
  footnotes:
  - marker: a
    text: Or 'did not obey the voice of the LORD.' The Hebrew idiom 'did not listen to the voice of' can carry the sense of refusing obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼의 말씀에 듣지 않았으므로 이집트 땅에 들어갔고, 다가 다까지 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 말씀에 순종하지 않았으므로.’ 히브리어 관용구 ‘~의 목소리에 듣지 않다’는 순종 거부의 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: entered
  chosen_korean: 들어갔고
  alternatives_korean:
  - 갔고
  - 도착했고
  lexicon: HALOT
  rationale: 목적어가 ‘이집트 땅’이므로 단순 이동보다 경계 안으로 들어감을 드러내는 ‘들어가다’가 원문의 방향성을 잘 살립니다.
- source_word: אֶרֶץ מִצְרַיִם
  english_pob_choice: the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 애굽 땅
  - 이집트
  - 이집트의 땅
  lexicon: HALOT
  rationale: ‘땅’이 분명히 있어 지역·영토 의미를 살려야 하므로 ‘이집트’만 두지 않고 직역에 가깝게 옮겼습니다.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  english_pob_choice: did not listen to the voice of Yahweh
  chosen_korean: 야훼의 말씀에 듣지 않았으므로
  alternatives_korean:
  - 야훼의 음성에 듣지 않았으므로
  - 야훼의 말씀을 듣지 않았으므로
  - 야훼의 음성을 듣지 않았으므로
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 목소리에 듣다’는 순종 거부를 뜻할 수 있어, 한국어에서는 자연스럽게 ‘말씀에 듣지 않다’로 옮겨 그 함의를 살렸습니다.
- source_word: וַיָּבֹאוּ עַד תַּחְפַּנְחֵס
  english_pob_choice: they came as far as Tahpanhes
  chosen_korean: 다가 다까지 이르렀습니다
  alternatives_korean:
  - 다판헤스까지 이르렀습니다
  - 다판헤스에 이르렀습니다
  - 타하판헤스까지 이르렀습니다
  lexicon: HALOT
  rationale: 지명은 음역이 필요하지만, 본문 데이터에 표기 충돌이 있어 현재 주어진 형태를 그대로 따라가되 ‘까지 이르렀다’로 도착 한계를 보존했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
