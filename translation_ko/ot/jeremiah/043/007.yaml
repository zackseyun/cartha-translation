  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
  footnotes:
  - marker: a
    text: Or 'did not obey the voice of the LORD.' The Hebrew idiom 'did not listen to the voice of' can carry the sense of refusing obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼의 음성에 귀 기울이지 않았으므로 이집트 땅에 들어갔고, 다합느헤스까지 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 음성에 순종하지 않았으므로.’ 히브리어 관용구 ‘~의 음성에 듣다’는 순종한다는 뜻을 지닐 수 있으므로, 부정형은 순종하지 않음을 뜻할 수 있습니다.
    reason: lexical_alternative
