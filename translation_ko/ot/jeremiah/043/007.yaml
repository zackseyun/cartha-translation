  terminology: יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 유지합니다. תַּחְפַּנְחֵס는 한국어 성서 지명 표기 관례에 맞춰 ‘다합느헤스’로 음역합니다. ‘이집트 땅’은 אֶרֶץ מִצְרַיִם을 충실하게 반영합니다.
