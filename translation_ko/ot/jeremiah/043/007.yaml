  - 주
  rationale: 본문이 신명기적 권위의 고유명사를 사용하므로, 통상 번역어 ‘주’로 대체하지 않고 프로젝트 기본값인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
