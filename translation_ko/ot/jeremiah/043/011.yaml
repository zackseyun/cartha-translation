  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/בא/ה וְ/הִכָּ֖ה אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֧ר לַ/מָּ֣וֶת לַ/מָּ֗וֶת וַ/אֲשֶׁ֤ר לַ/שְּׁבִי֙ לַ/שֶּׁ֔בִי וַ/אֲשֶׁ֥ר לַ/חֶ֖רֶב לֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/011.yaml
  text: 'He will come and strike the land of Egypt: those for death[a], to death; those for captivity, to captivity; and those for the sword, to the sword.'
  footnotes:
  - marker: a
    text: Or 'whoever is for death, to death; whoever is for captivity, to captivity; and whoever is for the sword, to the sword.' The Hebrew uses a terse repeated judgment formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 와서 이집트 땅을 칠 것입니다. 죽을 자는 죽음으로, 사로잡힐 자는 사로잡힘으로, 칼의 몫인 자는 칼로 갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘누구든지 죽음에 속한 자는 죽음으로’와 같은 매우 간결한 반복 판결식을 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וּבָאָה
  english_pob_choice: He will come
  chosen_korean: 그가 와서
  alternatives_korean:
  - 그가 올 것이며
  - 그리고 그가 와서
  lexicon: HALOT
  rationale: 예언적 미래를 한국어 자연문으로 풀어 합쇼체 미래를 사용했고, 첫 접속사 ‘ו’는 한국어에서 어색한 중복을 피하기 위해 따로 옮기지 않았습니다.
- source_word: וְהִכָּה
  english_pob_choice: and strike
  chosen_korean: 이집트 땅을 칠 것입니다
  alternatives_korean:
  - 이집트 땅을 공격할 것입니다
  - 이집트 땅을 치고 들어갈 것입니다
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/치르다’의 폭을 살려, 단순한 공격보다 심판의 타격감을 드러내는 ‘치다’를 택했습니다.
- source_word: אֶת־אֶרֶץ מִצְרַיִם
  english_pob_choice: the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 이집트의 땅
  - 이집트
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅/영토’ 의미를 살려 침공·심판의 대상이 되는 영역임을 보존했습니다.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת ... לַשְּׁבִי לַשֶּׁבִי ... לַחֶרֶב לֶחָרֶב
  english_pob_choice: those for death, to death; those for captivity, to captivity; and those for the sword, to the sword
  chosen_korean: 죽을 자는 죽음으로, 사로잡힐 자는 사로잡힘으로, 칼의 몫인 자는 칼로 갈 것입니다
  alternatives_korean:
  - 죽음에 속한 자는 죽음으로, 포로가 될 자는 포로됨으로, 칼에 속한 자는 칼로 갈 것입니다
  - 죽을 자는 죽음으로, 포로 될 자는 포로로, 칼의 자는 칼로 갈 것입니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 반복 심판 공식을 한국어에서 어색하지 않게 살리면서, ‘사로잡힘’과 ‘칼’의 반복 구조를 유지했습니다. 마지막 절의 ‘갈 것입니다’는 מדף 반복처럼 끝을 맞춰 주는 동작성을 전달합니다.
theological_decisions:
- issue: 반복되는 심판 공식의 표현 방식
  chosen_reading: ‘죽을 자는 죽음으로…’처럼 대상과 결과를 맞대는 반복 구조를 유지했습니다.
  alternative_readings:
  - ‘정해진 자는 그렇게 된다’처럼 완화된 문장
  - 세 항목을 하나의 일반 진술로 압축하는 방식
  rationale: 히브리어는 의도적으로 건조하고 판결문 같은 반복을 사용하므로, 이를 한국어에서도 드러내어 심판의 확정성과 엄중함을 보존했습니다.
  doctrine_reference: 예언서의 재판 선고 형식과 성경적 심판 언어
