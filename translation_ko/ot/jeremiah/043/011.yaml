  to: 그가 와서 이집트 땅을 칠 것입니다. 죽을 자는 죽음으로, 포로가 될 자는 포로로, 칼에 쓰러질 자는 칼로 될 것입니다.[a]
  rationale: 원문의 세 겹 반복과 심판의 확정성을 유지하되, 한국어에서 자연스럽지 않은 ‘사로잡힘’ 및 ‘칼의 몫’을 ‘포로가 될 자’와 ‘칼에 쓰러질 자’로 바로잡았습니다. 마지막의 ‘될 것입니다’는 세 항목 전체를 받도록 배치하여 한국어 문장을 완결하면서도 원문의 압축성을 최대한 보존했습니다. 각주는 대안적 직역과 반복 공식의 범위를 세 항목 전체에 대해 밝혔습니다.
