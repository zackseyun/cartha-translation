id: JER.46.27
reference: Jeremiah 46:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/אַתָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲק֛וֹב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/027.yaml
  text: But as for you[a], do not fear, my servant Jacob, and do not be dismayed, Israel; for behold, I will save you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
  footnotes:
  - marker: a
    text: Or 'I will save you.' The Hebrew uses a participle ('I am saving you'), which can emphasize imminent or certain action.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the land where they are captives.'
    reason: lexical_alternative
  - marker: c
    text: '''Jacob'' and ''Israel'' here personify the covenant people.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 너는 두려워하지 마십시오, 내 종 야곱아. 이스라엘아, 낙심하지 마십시오[c]. 보십시오, 내가 너를 먼 곳에서, 네 자손을 그들이 포로로 잡혀 있는 땅에서 구원하겠습니다[a][b]. 야곱은 돌아와 평온하고 안전하게 지내며, 그를 두렵게 할 자가 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보십시오’와 함께 현재분사를 사용합니다. 이는 하나님의 구원이 확실한 약속으로 제시됨을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 포로가 된 땅에서.’
    reason: lexical_alternative
  - marker: c
    text: ‘야곱’과 ‘이스라엘’은 여기서 포로에서 회복될 언약 백성을 인격적으로 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But as for you
  chosen_korean: 그러나 너는
  alternatives_korean:
  - 그리고 너는
  - 하지만 너는
  lexicon: HALOT
  rationale: 문맥상 심판 선언과 대비되는 전환을 살려 ‘그러나’로 옮겼습니다. 독립 대명사 אַתָּה의 대조적 강조는 자연스러운 한국어 어순으로 처리했습니다.
- source_word: עַבְדִּי יַעֲקֹב
  english_pob_choice: my servant Jacob
  chosen_korean: 내 종 야곱
  alternatives_korean:
  - 내 종인 야곱
  - 야곱 내 종
  lexicon: HALOT
  rationale: עַבְדִּי의 소유격을 살려 ‘내 종’으로 옮겼고, 예언적 호칭의 인격화된 이름을 그대로 유지했습니다. 여기서는 언약적 칭호이므로 ‘노예’가 아니라 ‘종’이 적절합니다.
- source_word: וְאַל תֵּחַת
  english_pob_choice: and do not be dismayed
  chosen_korean: 낙심하지 마라
  alternatives_korean:
  - 두려워하지 마라
  - 주저하지 마라
  lexicon: HALOT
  rationale: חתת의 ‘기운이 꺾이다/두려움에 무너지다’는 뜻을 한국어의 자연스러운 권면으로 풀어 ‘낙심하다’로 옮겼습니다. 앞의 ‘두려워하지 마라’와 평행을 이루도록 했습니다.
- source_word: מֵאֶרֶץ שִׁבְיָם
  english_pob_choice: from the land of their captivity
  chosen_korean: 그들의 포로의 땅에서
  alternatives_korean:
  - 그들이 포로로 있는 땅에서
  - 그들의 포로 상태의 땅에서
  lexicon: HALOT
  rationale: שִׁבְיָם의 소유격을 살리되, 한국어에서는 ‘포로의 땅’이 가장 간결하고 직역성이 있습니다. 포로 상태의 장소라는 의미를 유지하면서도 문맥에 맞게 자연스럽게 처리했습니다.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  english_pob_choice: and be quiet and at ease
  chosen_korean: 평안하고 안온하며
  alternatives_korean:
  - 고요하고 안온하며
  - 평온하고 안전하며
  lexicon: HALOT
  rationale: שָׁקַט과 שַׁאֲנַן의 중첩된 안정·평정 의미를 한국어의 짝구로 옮겼습니다. ‘평안’은 내적·관계적 안정, ‘안온’은 외적 안전과 편안함을 함께 드러냅니다.
theological_decisions:
- issue: 야곱/이스라엘의 지시 대상
  chosen_reading: 개인 야곱이 아니라 언약 백성을 대표하는 인격화된 호칭으로 보았습니다.
  alternative_readings:
  - 족장 야곱 개인에 대한 직접 호칭
  - 이스라엘 민족을 해석적으로 풀어쓴 표현
  rationale: 평행 구조에서 ‘야곱’과 ‘이스라엘’은 포로에서 회복될 언약 공동체를 대표하는 이름으로 쓰입니다. 그래서 이름 자체를 유지해 예언적 인격화와 언약적 울림을 보존했습니다.
  doctrine_reference: 예언서의 언약 백성 호칭과 집단적 인격화
