  alternative_readings:
  - 보다 완곡하게 ‘패배했습니다’로 정리하는 방식
  - 전투적 이미지를 줄여 ‘무너졌습니다’로 옮기는 방식
  rationale: 히브리어는 군사적 충돌과 집단적 추락을 병렬로 강조하므로, 그 긴장을 완화하지 않는 쪽이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 예언서의 심판 선언과 시적 병행법
