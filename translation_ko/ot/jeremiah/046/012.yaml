base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/012.yaml
  text: The nations have heard of your shame[a], and your cry has filled the earth; for warrior has stumbled against warrior; together both of them have fallen.
  footnotes:
  - marker: a
    text: Or 'has filled the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land'; 'earth' is preferred here because the previous clause speaks of 'the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러 나라가 네 수치를 들었고 네 부르짖음이 땅에 가득 찼습니다. 이는 용사가 용사에게 넘어져, 둘이 함께 쓰러졌기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “땅”은 여기서 “온 땅/세계”를 뜻할 수 있습니다. 앞절의 “여러 나라”와 어울리게, 넓은 범위를 살린 표현을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גוֹיִם
  english_pob_choice: the nations
  chosen_korean: 여러 나라가
  alternatives_korean:
  - 나라들이
  - 민족들이
  lexicon: HALOT
  rationale: 복수 집합명사로서 공개적으로 퍼진 소식을 가리키므로, 문맥상 자연스러운 ‘여러 나라’로 옮겼습니다.
- source_word: קְלוֹנֵךְ
  english_pob_choice: your shame
  chosen_korean: 네 수치
  alternatives_korean:
  - 네 부끄러움
  - 네 치욕
  lexicon: HALOT
  rationale: 클론은 सार्वजनिक한 수치와 모욕을 뜻하므로, 예언 문맥에서 가장 직접적인 ‘수치’를 택했습니다.
- source_word: וְצִוְחָתֵךְ
  english_pob_choice: and your cry
  chosen_korean: 네 부르짖음
  alternatives_korean:
  - 네 울부짖음
  - 네 외침
  lexicon: HALOT
  rationale: צווחה는 고통의 외침을 가리키므로, 단순한 소리보다 절박함이 드러나는 ‘부르짖음’이 적합합니다.
- source_word: מָלְאָה הָאָרֶץ
  english_pob_choice: has filled the earth
  chosen_korean: 땅에 가득 찼습니다
  alternatives_korean:
  - 온 땅에 퍼졌습니다
  - 땅을 가득 채웠습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘땅/온 땅’ 의미를 살리되, 바로 앞의 ‘여러 나라’와 이어지도록 현대 한국어 어순으로 자연화했습니다.
- source_word: גִבּוֹר בְּגִבּוֹר
  english_pob_choice: warrior against warrior
  chosen_korean: 용사가 용사에게
  alternatives_korean:
  - 용사가 용사와
  - 장사가 장사에게
  lexicon: HALOT
  rationale: 군사적 충돌을 나타내는 병렬 표현이므로 ‘용사’로 옮기고, ב의 대치·충돌 뉘앙스를 ‘에게’로 담았습니다.
- source_word: כָּשָׁלוּ / נָפְלוּ
  english_pob_choice: has stumbled / have fallen
  chosen_korean: 넘어져, 둘이 함께 쓰러졌기 때문입니다
  alternatives_korean:
  - 비틀려 쓰러져
  - 넘어져 함께 떨어졌기 때문입니다
  lexicon: HALOT
  rationale: כשל와 נפל의 구분을 살려 앞은 ‘넘어져’, 뒤는 ‘쓰러졌기’로 구별했고, יַחְדָּיו와 שְׁנֵיהֶם의 중복 강조를 ‘둘이 함께’로 압축했습니다.
theological_decisions:
- issue: 예언적 종결문의 전쟁 이미지와 평행법 처리
