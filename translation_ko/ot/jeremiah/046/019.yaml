  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כְּלֵ֤י גוֹלָה֙ עֲשִׂ֣י לָ֔/ךְ יוֹשֶׁ֖בֶת בַּת מִצְרָ֑יִם כִּֽי נֹף֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה וְ/נִצְּתָ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/019.yaml
  text: Prepare your baggage for exile[a], O daughter dwelling in Egypt, for Noph will become a desolation, laid waste[c][b], without inhabitant.
  footnotes:
  - marker: a
    text: Noph is the Hebrew name for the Egyptian city later known as Memphis.
    reason: cross_reference
  - marker: b
    text: Or 'articles of exile' or 'gear for captivity'; the Hebrew image is of preparing belongings for deportation.
    reason: lexical_alternative
  - marker: c
    text: Or 'burned down' if the verb is taken with stronger fire imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 포로의 짐을 준비하라[a], 이집트에 거주하는 딸아. 이는 놉이 황폐한 곳이 되고, 파괴되어[b][c], 주민이 없게 될 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로의 짐’은 히브리어의 ‘유배/포로를 위한 물건들’이라는 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문 동사는 불에 타는 뉘앙스를 포함할 수 있지만, 여기서는 보다 일반적인 ‘파괴되다/폐허가 되다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 놉은 이집트의 도시로, 후대에 멤피스와 동일시됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  english_pob_choice: baggage for exile
  chosen_korean: 포로의 짐
  alternatives_korean:
  - 포로 생활의 짐
  - 유배의 세간
  - 포로를 위한 짐꾸러미
  lexicon: HALOT
  rationale: כְּלֵי גוֹלָה는 문자적으로는 '유배의 그릇/도구'이지만, 강제 이주를 앞두고 짐을 꾸리라는 관용적 이미지이므로 한국어에서는 자연스럽게 '포로의 짐'으로 옮겼습니다.
- source_word: יוֹשֶׁבֶת בַּת מִצְרַיִם
  english_pob_choice: O daughter dwelling in Egypt
  chosen_korean: 이집트에 거주하는 딸아
  alternatives_korean:
  - 이집트에 사는 딸아
  - 이집트의 딸아
  - 이집트에 머무는 딸아
  lexicon: HALOT
  rationale: 여성 단수 분사와 호격을 살려, 이집트를 의인화한 대상에게 직접 부르는 표현을 유지했습니다.
- source_word: נֹף
  english_pob_choice: Noph
  chosen_korean: 놉
  alternatives_korean:
  - 멤피스
  lexicon: HALOT
  rationale: 지명은 본문에서 음역을 유지하고, 역사적 동일시는 주석으로 처리하는 원칙에 따라 '놉'을 택했습니다.
- source_word: לְשַׁמָּה תִהְיֶה
  english_pob_choice: will become a desolation
  chosen_korean: 황폐한 곳이 되고
  alternatives_korean:
  - 황폐가 되고
  - 황무지가 되고
  - 황량한 곳이 되고
  lexicon: HALOT
  rationale: שַׁמָּה의 핵심 뜻인 황폐/폐허를 살리되, 한국어에서 자연스러운 명사구로 옮겼습니다.
- source_word: וְנִצְּתָה
  english_pob_choice: laid waste
  chosen_korean: 파괴되어
  alternatives_korean:
  - 황폐되어
  - 불타 폐허가 되어
  - 무너져 버려
  lexicon: HALOT
  rationale: 동사의 결과를 간결하게 살리면서도, 본문이 불 이미지까지 명시적으로 요구하지 않으므로 과도한 화재 표현은 피했습니다.
theological_decisions:
- issue: 예언적 경고의 직접성
  chosen_reading: 명령형과 이유절을 살려, 포로의 짐을 지금 준비하라는 긴박한 심판 경고로 읽었습니다.
  alternative_readings:
  - 단순한 미래 예고로만 완화하는 읽기
  - 비유적 권고로 약화하는 읽기
  rationale: 히브리어 명령형 עֲשִׂי와 이유 접속 כִּי를 함께 반영해야 심판 선언의 즉각성이 드러납니다.
  doctrine_reference: 예언서의 심판 선포와 회개 촉구
