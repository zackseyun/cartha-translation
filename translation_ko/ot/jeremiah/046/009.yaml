id: JER.46.9
reference: Jeremiah 46:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲל֤וּ הַ/סּוּסִים֙ וְ/הִתְהֹלְל֣וּ הָ/רֶ֔כֶב וְ/יֵצְא֖וּ הַ/גִּבּוֹרִ֑ים כּ֤וּשׁ וּ/פוּט֙ תֹּפְשֵׂ֣י מָגֵ֔ן וְ/לוּדִ֕ים תֹּפְשֵׂ֖י דֹּ֥רְכֵי קָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/009.yaml
  text: Go up, O horses, and rage, O chariots; let the warriors go out—Cush and Put, who grasp the shield, and the Ludim, who grasp and bend the bow.
translation:
  language: ko
  text: 말들아, 올라가라. 병거들아, 광분하라. 용사들이 나가게 하라 — 구스와 풋은 방패를 잡는 자들이요, 룻은 활을 잡아 당기는 자들이다.
  philosophy: formal
lexical_decisions:
- source_word: עֲלוּ / הִתְהֹלְלוּ
  english_pob_choice: Go up / rage
  chosen_korean: 올라가라 / 광분하라
  alternatives_korean:
  - 올라가라 / 미쳐 날뛰어라
  - 전진하라 / 날뛰어라
  lexicon: עָלָה, הִתְהוֹלֵל
  rationale: הִתְהֹלְלוּ를 단순한 '나아가다'보다 전투적 격동을 드러내는 '광분하라'로 옮겨 영어 POB의 'rage'를 반영했습니다.
- source_word: הָרֶכֶב
  english_pob_choice: chariots
  chosen_korean: 병거들
  alternatives_korean:
  - 전차들
  - 병거
  lexicon: רֶכֶב
  rationale: 군사적 전투 수단인 병거를 가리키므로 교회적 어휘보다 직접적인 역사적 용례인 '병거'를 택했습니다.
- source_word: כּוּשׁ וּפוּט ... וְלוּדִים
  english_pob_choice: Cush and Put ... the Ludim
  chosen_korean: 구스와 풋 ... 룻
  alternatives_korean:
  - 구스와 풋 ... 리비아인들
  - 구시와 붓 ... 루딤
  lexicon: כּוּשׁ, פּוּט, לוּדִים
  rationale: 고유명사는 현대 한국어 성경에서 널리 통용되는 음역을 따르되, לוּדִים은 어근 표기보다 본문 상의 민족명으로서 '룻'보다 덜 익숙한 대안도 가능함을 남겼습니다.
- source_word: תֹּפְשֵׂי מָגֵן / תֹּפְשֵׂי דֹּרְכֵי קָשֶׁת
  english_pob_choice: who grasp the shield / who grasp and bend the bow
  chosen_korean: 방패를 잡는 자들이요 / 활을 잡아 당기는 자들이다
  alternatives_korean:
  - 방패를 드는 자들이요 / 활을 당겨 쏘는 자들이다
  - 방패를 쥔 자들이요 / 활을 당겨 잡는 자들이다
  lexicon: תָּפַשׂ, מָגֵן, קֶשֶׁת
  rationale: תֹּפְשֵׂי를 단순 소지보다 전투 준비의 동작으로 살려 '잡는 자들'로 옮겼고, דֹּרְכֵי קָשֶׁת은 활시위를 당기는 행위를 드러내기 위해 '활을 잡아 당기는'으로 풀었습니다.
theological_decisions:
- issue: 전투 명령문의 직접적 명령형과 의인화된 병거/말의 호격 처리
  chosen_reading: 명령형을 그대로 살리고 말과 병거를 호격으로 처리하여, 예언적 조롱과 전투 소용돌이의 생생함을 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하여 '말들이 올라가고 병거들이 광분합니다'라고 옮길 수 있음
  - 호격을 줄이고 일반 진술처럼 처리할 수 있음
  rationale: 히브리어는 연속 명령형으로 적군의 총동원과 격동을 극적으로 그리므로, 한국어도 이를 완화하지 않는 편이 본문의 수사와 예언의 위력을 보존합니다.
  doctrine_reference: 예언문 수사와 심판 선포의 장르 보존
