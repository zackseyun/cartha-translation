id: JER.46.18
reference: Jeremiah 46:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חַי אָ֨נִי֙ נְאֻם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ כִּ֚י כְּ/תָב֣וֹר בֶּֽ/הָרִ֔ים וּ/כְ/כַרְמֶ֖ל בַּ/יָּ֥ם יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/018.yaml
  text: As I live[a], declares the King, whose name is Yahweh of Armies, surely as Tabor among the mountains and as Carmel by the sea[b], so he will come.
  footnotes:
  - marker: a
    text: Or, 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: The implied subject of 'will come' is not stated in Hebrew; context points to the coming conqueror announced in the surrounding verses.
    reason: cross_reference
translation:
  language: ko
  text: 나는 살아 있노라[a] — 만군의 야훼[b]의 이름을 가진 왕의 말씀이다. 참으로 산들 가운데의 다볼처럼, 바닷가의 갈멜처럼 한 이가 올 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “내가 살아 있는 한”.
    reason: lexical_alternative
  - marker: b
    text: 또는, “만군의 여호와”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֨נִי֙
  english_pob_choice: As I live
  chosen_korean: 나는 살아 있노라
  alternatives_korean:
  - 내가 살아 있는 한
  - 나는 살아 있습니다
  lexicon: HALOT
  rationale: 자기 맹세를 여는 관용적 서약 공식이므로, 현대 한국어에서 자연스럽고 장중한 “나는 살아 있노라”로 옮겨 그 강한 확언을 살렸습니다.
- source_word: נְאֻם
  english_pob_choice: declares
  chosen_korean: 말씀이다
  alternatives_korean:
  - 선언하신다
  - 말하신다
  lexicon: HALOT
  rationale: 예언적 발화 표지이므로 단순 보고형보다 말씀 선포의 기능이 드러나는 “말씀이다”를 택했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 군대들의 야훼
  lexicon: HALOT
  rationale: 여호와 대체형을 따르지 않고, 본문 표제의 신명은 프로젝트 기본값에 따라 야훼로, צְבָאוֹת은 전통어보다 군사 이미지를 살린 만군으로 옮겼습니다.
- source_word: כְּתָבוֹר ... וּכְכַרְמֶל
  english_pob_choice: like Tabor ... like Carmel
  chosen_korean: 산들 가운데의 다볼처럼, 바닷가의 갈멜처럼
  alternatives_korean:
  - 다볼처럼 ... 갈멜처럼
  - 산들 가운데 다볼처럼 ... 바다 곁 갈멜처럼
  lexicon: HALOT
  rationale: כְ는 비교 접사이므로 “처럼”으로 살리고, 두 지명은 음역하되 지형 대비를 분명히 하기 위해 “산들 가운데의”와 “바닷가의”를 덧붙였습니다.
- source_word: יָבֹוא
  english_pob_choice: one will come
  chosen_korean: 한 이가 올 것이다
  alternatives_korean:
  - 그가 올 것이다
  - 올 자가 있을 것이다
  lexicon: HALOT
  rationale: 히브리어의 주어 미표시는 문맥상 침입자/정복자를 가리키지만 본문에는 명시되지 않으므로, 영어 POB의 불특정성을 반영해 “한 이가”로 처리했습니다.
theological_decisions:
- issue: 야훼(יְהוָה)의 표기
  chosen_reading: 본문에서는 '야훼'를 사용하고, 주석 a에서 대체 전통역을 제시합니다.
  alternative_readings:
  - 여호와
  - LORD
  rationale: 프로젝트 기본 규범에 따라 신명은 음역형 야훼를 유지해 원문 고유성을 드러내고, 전통 교회어는 주석으로만 안내했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: חַי אָ֨נִי֙의 서약문 어조
  chosen_reading: 직접적인 자기 맹세를 살려 “나는 살아 있노라”로 옮겼습니다.
  alternative_readings:
  - 내가 살아 있는 한
  - 반드시
  rationale: 이 표현은 단순 진술이 아니라 엄숙한 신적 서약이므로, 한국어에서도 구어화나 완화 없이 장중한 선언문체를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
