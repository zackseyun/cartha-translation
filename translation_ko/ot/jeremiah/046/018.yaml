review_pass:
  verdict: revise
  source_fidelity: 히브리어의 자기 맹세(חַי אָנִי), 왕이라는 신적 칭호, ‘그의 이름은 만군의 야훼’라는 동격적 명명, 그리고 명시되지 않은 3인칭 남성 단수 주어를 보존해야 합니다. 초안의 ‘한 이’는 주어의 불특정성을 잘 살리지만, 비교절은 한국어에서 ‘…처럼 … 올 것이다’보다 ‘… 있는 것처럼’으로 풀어야 원문의 비유 구조가 자연스럽게 전달됩니다.
  naturalness: 초안의 ‘나는 살아 있노라’와 ‘말씀이다’는 현대 표준어 합쇼체 요구와 맞지 않고 문체가 섞여 있습니다. ‘내가 살아 있음을 두고 맹세합니다’와 ‘말씀입니다’가 현대적이면서도 엄숙한 예언문 어조를 유지합니다.
  terminology: ‘만군의 야훼’는 제시된 프로젝트 신명 및 צבאות 방침에 부합합니다. ‘왕’은 원문의 정관사 칭호를 보존합니다. 야훼 대체 표기는 해당 본문 표지에 유지하고, 원문에 없는 주어의 문맥적 식별은 별도 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: 합쇼체와 맞지 않는 종결 표현
    rationale: ‘살아 있노라’와 ‘말씀이다’는 각각 고어적 해라체/평서체이며, 요청된 현대 formal-polite 합쇼체와 일관되지 않습니다.
  - severity: medium
    issue: 비교 구조가 한국어에서 부자연스럽고 의미 관계가 불명확함
    rationale: ‘산들 가운데의 다볼처럼, 바닷가의 갈멜처럼 한 이가 올 것이다’는 두 지명구가 ‘한 이’를 직접 수식하는 듯 보입니다. ‘… 있는 것처럼’으로 비교의 기준을 명시하면 히브리어의 생략적 비유를 과도한 해석 없이 전달합니다.
  - severity: low
    issue: 암시된 주어에 관한 각주가 없음
    rationale: יָבֹוא의 주어는 본절에 명시되지 않습니다. ‘한 사람이’라는 보충을 쓰는 경우, 문맥상 정복자를 가리킨다는 점을 각주에서 밝혀 투명성을 확보해야 합니다.
  revised_text: “내가 살아 있음을 두고 맹세합니다.” 만군의 야훼라 불리는 왕의 말씀입니다. 다볼이 산들 가운데 있고 갈멜이 바닷가에 있는 것처럼, 반드시 한 사람이 올 것입니다.[c]
  revised_footnotes:
  - marker: a
    text: 또는, “내가 살아 있는 한”.
    reason: lexical_alternative
  - marker: b
    text: 또는, “만군의 여호와”.
    reason: lexical_alternative
  - marker: c
    text: ‘올 것입니다’의 주어는 히브리어 본문에 명시되어 있지 않습니다. 문맥상 앞절들에서 예고된 정복자를 가리킵니다.
    reason: cross_reference
  revision_rationale: 현대 합쇼체로 문체를 통일하고, 신적 자기 맹세의 엄숙성을 ‘내가 살아 있음을 두고 맹세합니다’로 재현했습니다. ‘그의 이름은’이라는 원문의 명명 구문은 한국어의 자연스러운 관계 표현인 ‘만군의 야훼라 불리는’으로 옮겼습니다. 비교절은 원문이 생략하는 비유의 연결을 한국어 문법상 필요한 최소한의 ‘있는 것처럼’으로 드러냈으며, 주어는 본문 내에서 특정하지 않고 ‘한 사람’으로 남긴 뒤 각주에서 문맥적 지시 대상을 설명했습니다.
