  text: Harness the horses[a]; mount up, you horsemen; take your stand with helmets on. Polish the spears[b]; put on the armor.
  footnotes:
  - marker: a
    text: Or 'burnish the spears.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'siryonot' refers to body armor, possibly coats of mail or breastplates.
    reason: lexical_alternative
translation:
  language: ko
  text: 말에 마구를 채우십시오. 기병들아, 말에 오르십시오. 투구를 쓰고 대열을 갖추십시오. 창을 닦아 윤을 내십시오.[a] 갑옷을 입으십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘미르쿠’는 ‘닦다, 윤을 내다, 빛나게 하다’라는 뜻입니다. 따라서 ‘창을 갈다’가 아니라 창을 닦아 빛나게 하라는 명령입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 ‘시르요놋’은 몸을 보호하는 갑옷을 가리키며, 사슬갑옷이나 흉갑과 같은 특정 형태를 뜻할 수도 있습니다.
    reason: lexical_alternative
