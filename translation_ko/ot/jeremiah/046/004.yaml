  text: אִסְר֣וּ הַ/סּוּסִ֗ים וַֽ/עֲלוּ֙ הַ/פָּ֣רָשִׁ֔ים וְ/הִֽתְיַצְּב֖וּ בְּ/כ֥וֹבָעִ֑ים מִרְקוּ֙ הָֽ/רְמָחִ֔ים לִבְשׁ֖וּ הַ/סִּרְיֹנֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/004.yaml
  text: Harness the horses[a]; mount up, you horsemen; take your stand with helmets on. Polish the spears[b]; put on the armor.
  footnotes:
  - marker: a
    text: Or 'burnish the spears.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'siryonot' refers to body armor, possibly coats of mail or breastplates.
    reason: lexical_alternative
translation:
  language: ko
  text: 말들을 묶으십시오. 기병들아, 올라타십시오. 투구를 쓰고 자리를 지키십시오. 창을 갈고, 갑옷을 입으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘미르쿠’는 ‘닦다, 윤내다, 빛나게 하다’의 뜻이어서, 전투 맥락에서는 ‘창을 갈다/윤내다’처럼 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시리요놋’은 몸을 보호하는 갑옷류를 가리키며, 투구와 달리 상반신 보호구를 넓게 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְרוּ הַסּוּסִים
  english_pob_choice: Harness the horses
  chosen_korean: 말들을 묶으십시오
  alternatives_korean:
  - 말에 멍에를 메우십시오
  - 말을 준비시키십시오
  lexicon: HALOT
  rationale: 전투 준비 명령이라는 점은 살리되, 한국어에서는 말에 전투용 장비를 갖추게 하는 직접적 명령이므로 ‘묶으십시오’로 간결하게 옮겼습니다.
- source_word: וַעֲלוּ הַפָּרָשִׁים
  english_pob_choice: mount up, you horsemen
  chosen_korean: 기병들아, 올라타십시오
  alternatives_korean:
  - 기병들아, 타십시오
  - 기병들아, 말에 오르십시오
  lexicon: HALOT
  rationale: ‘올라가다’의 전쟁 맥락상 관용적 의미를 살려 ‘올라타십시오’로 옮기고, 호격을 분명히 하기 위해 ‘기병들아’로 처리했습니다.
- source_word: בְּכֹובָעִים
  english_pob_choice: with helmets on
  chosen_korean: 투구를 쓰고
  alternatives_korean:
  - 투구를 쓴 채
  - 투구를 착용하고
  lexicon: HALOT
  rationale: 무장 상태를 자연스럽게 드러내기 위해 ‘with helmets on’을 한국어 동작 표현인 ‘투구를 쓰고’로 옮겼습니다.
- source_word: מִרְקוּ הָרְמָחִים
  english_pob_choice: Polish the spears
  chosen_korean: 창을 갈고
  alternatives_korean:
  - 창을 닦고
  - 창을 윤내고
  lexicon: HALOT
  rationale: ‘미르쿠’의 ‘빛나게 하다/닦다’는 뜻을 살리면서도 무기 손질의 긴박감을 주는 ‘갈고’가 한국어로 가장 자연스럽습니다.
- source_word: הַסִּרְיֹנֹת
  english_pob_choice: the armor
  chosen_korean: 갑옷을 입으십시오
  alternatives_korean:
  - 갑옷을 갖추십시오
  - 방어구를 입으십시오
  lexicon: HALOT
  rationale: ‘시리요놋’은 몸을 보호하는 무장 전체를 가리키므로, POB의 ‘armor’를 한국어에서 가장 익숙한 군사어인 ‘갑옷’으로 구체화했습니다.
theological_decisions:
- issue: 전투 명령의 직설적 호격과 연속 명령문
  chosen_reading: 명령형들을 한국어 합쇼체로 연속 배치하되, ‘기병들아’처럼 원문의 호격·긴박감을 살렸습니다.
  alternative_readings:
  - 모두 명령형을 평서형으로 완화하는 방식
  - 호격을 생략하고 일반 지시문으로 만드는 방식
  rationale: 본문은 전쟁 준비를 촉구하는 급박한 군사적 호령이므로, 완곡하게 풀기보다 원문의 긴장감을 유지하는 것이 더 충실합니다.
  doctrine_reference: 문맥상 예언적 전쟁 선포; 교리 쟁점 없음
