  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קוֹלָ֖/הּ כַּ/נָּחָ֣שׁ יֵלֵ֑ךְ כִּֽי בְ/חַ֣יִל יֵלֵ֔כוּ וּ/בְ/קַרְדֻּמּוֹת֙ בָּ֣אוּ לָ֔/הּ כְּ/חֹטְבֵ֖י עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/022.yaml
  text: Her sound goes like a serpent[a], for they go with an army and come against her with axes[c][b], like woodcutters.
  footnotes:
  - marker: a
    text: Or 'Her voice goes like a serpent'; the Hebrew noun can mean 'voice,' 'sound,' or 'noise.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for they go in force'; the Hebrew חַיִל can denote military force, strength, or an army.
    reason: lexical_alternative
  - marker: c
    text: 'Literally ''come to her''; in context the sense is hostile: ''come against her.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 소리는 뱀처럼 움직입니다[a]. 그들은 군대와 함께 나아가고, 나무꾼들처럼 도끼를 들고 그녀를 향해 옵니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 목소리는 뱀처럼 움직입니다.’ 히브리어 קוֹל은 ‘목소리’, ‘소리’, ‘울림’을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘군세와 함께’; 히브리어 חַיִל은 ‘군대’, ‘군세’, ‘힘’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로는 ‘그녀에게 온다’이지만, 문맥상 적대적으로 ‘그녀를 향해/그녀를 치러 온다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלָהּ
  english_pob_choice: her sound
  chosen_korean: 그 소리는
  alternatives_korean:
  - 그녀의 목소리는
  - 그녀의 소리는
  - 그녀의 소리들은
  lexicon: HALOT
  rationale: קוֹל은 ‘목소리’보다 넓게 ‘소리/음성/울림’을 가리킬 수 있어, 여기서는 인격화된 대상의 들리는 징후를 살려 ‘그 소리’로 옮겼습니다.
- source_word: כַּנָּחָשׁ יֵלֵךְ
  english_pob_choice: goes like a serpent
  chosen_korean: 뱀처럼 움직입니다
  alternatives_korean:
  - 뱀처럼 갑니다
  - 뱀처럼 나아갑니다
  - 뱀처럼 흘러갑니다
  lexicon: HALOT
  rationale: יֵלֵךְ의 기본값인 ‘가다’보다, 소리의 비유적 움직임을 한국어에서 자연스럽게 드러내는 ‘움직입니다’가 원문의 이미지와 더 잘 맞습니다.
- source_word: בְחַיִל
  english_pob_choice: with an army
  chosen_korean: 군대와 함께
  alternatives_korean:
  - 군세로
  - 무력을 갖추고
  - 군대 안에서
  lexicon: HALOT
  rationale: חַיִל은 ‘군대/군세/힘’을 뜻할 수 있는데, 이 문맥에서는 공격하는 무리의 군사적 집결을 가리키므로 ‘군대와 함께’로 옮겼습니다.
- source_word: בָּאוּ לָהּ
  english_pob_choice: come against her
  chosen_korean: 그녀에게
  alternatives_korean:
  - 그녀에게로
  - 그녀를 향해
  - 그녀를 치러
  lexicon: HALOT
  rationale: בוא + ל은 문자적으로는 ‘~에게 오다’이지만, 문맥상 적대적 접근이 분명하므로 본문에는 직역을 유지하고 적대성은 전체 문맥에서 드러나게 했습니다.
- source_word: כְּחֹטְבֵי עֵצִים
  english_pob_choice: like woodcutters
  chosen_korean: 나무꾼들처럼
  alternatives_korean:
  - 장작패는 사람들처럼
  - 나무를 베는 사람들처럼
  - 벌목꾼들처럼
  lexicon: HALOT
  rationale: 문자적으로는 ‘나무를 베는 자들’이지만, 현대 한국어에서 가장 자연스럽고 이미지가 살아 있는 표현은 ‘나무꾼들’입니다.
