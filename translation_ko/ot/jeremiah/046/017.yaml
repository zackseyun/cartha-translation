  yaml_path: translation/ot/jeremiah/046/017.yaml
  text: There they cry[a], ‘Pharaoh king of Egypt is only a noise; he has let the appointed time pass by.’
  footnotes:
  - marker: a
    text: Or “Pharaoh king of Egypt is a noise; he has missed the appointed moment.” The Hebrew is terse and taunting, and שָׁאוֹן may also be understood as “tumult” or “empty bluster.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그곳에서 외칩니다. “애굽 왕 바로는 한낱 소란일 뿐입니다[a]. 그는 정해진 때를 지나가게 했습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁאוֹן은 ‘소란’, ‘요란함’, ‘소음’을 뜻하며, 이 문맥에서는 바로를 ‘빈소리’라고 조롱하는 뉘앙스로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֶעֱבִיר הַמּוֹעֵד는 문자적으로 ‘정해진 때를 지나가게 하다’라는 뜻이며, 문맥상 ‘기회를 놓치다’로도 이해할 수 있습니다.
    reason: lexical_alternative
