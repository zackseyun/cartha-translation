source:
  edition: WLC
  text: קָרְא֖וּ שָׁ֑ם פַּרְעֹ֤ה מֶֽלֶךְ מִצְרַ֨יִם֙ שָׁא֔וֹן הֶעֱבִ֖יר הַ/מּוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/017.yaml
  text: There they cry[a], ‘Pharaoh king of Egypt is only a noise; he has let the appointed time pass by.’
  footnotes:
  - marker: a
    text: Or “Pharaoh king of Egypt is a noise; he has missed the appointed moment.” The Hebrew is terse and taunting, and שָׁאוֹן may also be understood as “tumult” or “empty bluster.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 그들이 외칩니다. ‘애굽 왕 바로는 그저 소란일 뿐입니다. 그가 정해진 때를 지나가게 했습니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁאוֹן은 ‘소란’, ‘요란함’, ‘소음’의 뜻이 있으며, 이 문맥에서는 바로를 ‘빈소리’로 조롱하는 뉘앙스도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הֶעֱבִיר הַמּוֹעֵד는 문자적으로는 ‘정해진 때를 지나가게 하다’이며, 문맥상 ‘기회를 놓치다’는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  english_pob_choice: they cry
  chosen_korean: 그들이 외칩니다
  alternatives_korean:
  - 그들이 부릅니다
  - 그들이 외칩니다
  lexicon: HALOT
  rationale: 완료형이지만 예언적 조롱의 생동감을 살리기 위해 단순 과거보다 현재형의 외침으로 옮겼습니다.
- source_word: שָׁאוֹן
  english_pob_choice: only a noise
  chosen_korean: 그저 소란일 뿐입니다
  alternatives_korean:
  - 그저 소음일 뿐입니다
  - 그저 요란함일 뿐입니다
  - 그저 빈소리일 뿐입니다
  lexicon: HALOT
  rationale: 소란/요란함/소음의 범위를 살리되, 조롱의 뉘앙스를 드러내기 위해 ‘그저 …일 뿐입니다’로 번역했습니다.
- source_word: הֶעֱבִיר הַמּוֹעֵד
  english_pob_choice: has let the appointed time pass by
  chosen_korean: 그가 정해진 때를 지나가게 했습니다
  alternatives_korean:
  - 그가 정해진 때를 놓쳤습니다
  - 그가 정해진 때를 지나가게 했습니다
  - 그가 정해진 때를 흘려보냈습니다
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려 단순히 ‘놓쳤다’보다 ‘지나가게 했다’로 옮겼고, מוֹעֵד는 문맥상 절기보다 결정적 시점인 ‘정해진 때’가 적절합니다.
theological_decisions:
- issue: 예언적 조롱문의 어조
  chosen_reading: 직설적 비웃음의 톤을 살려 ‘그저 소란일 뿐입니다’로 번역했습니다.
  alternative_readings:
  - 완곡하게 ‘아무것도 아닙니다’로 완화하는 번역
  - 중립적으로 ‘소리일 뿐입니다’로 낮추는 번역
  rationale: 본문은 바로의 실체를 조롱하는 짧고 날선 비아냥이므로, 그 공격성을 약화시키지 않는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언서의 심판 선포와 조롱 어조
- issue: 문장 시제 처리
  chosen_reading: 히브리어 완료형을 한국어 현재형으로 옮겨 현재의 선포처럼 들리게 했습니다.
  alternative_readings:
  - 과거형 ‘외쳤습니다’로 직역
  - 미래형/명령형으로 재구성
  rationale: 예언적 진술에서 완료형은 종종 확정된 선언의 힘을 가지므로, 한국어 현재형이 문맥상 자연스럽고 선포적입니다.
  doctrine_reference: 예언적 확정성
