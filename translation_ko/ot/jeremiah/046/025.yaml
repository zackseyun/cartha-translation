id: JER.46.25
reference: Jeremiah 46:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י פוֹקֵד֙ אֶל אָמ֣וֹן מִ/נֹּ֔א וְ/עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם וְ/עַל אֱלֹהֶ֖י/הָ וְ/עַל מְלָכֶ֑י/הָ וְ/עַ֨ל פַּרְעֹ֔ה וְ/עַ֥ל הַ/בֹּטְחִ֖ים בּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/025.yaml
  text: 'Yahweh of hosts[a], the God of Israel, says: Behold, I am about to punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings, and Pharaoh[b], and those who trust in him.'
  footnotes:
  - marker: a
    text: Or 'Amon of Thebes.' 'No' is the Hebrew name for the Egyptian city often identified with Thebes.
    reason: cultural_note
  - marker: b
    text: Or 'those who trust in it,' if the pronoun is taken to refer to Egypt rather than Pharaoh.
    reason: alternative_reading
translation:
  language: ko
  text: 만군의 여호와, 이스라엘의 하나님께서 말씀하십니다. 보십시오, 내가 곧 노[a]의 아몬과 바로와 애굽과 그 신들과 그 왕들과 바로와 그를[b] 신뢰하는 자들을 벌하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노’는 히브리어에 보이는 이집트 도시명입니다. 흔히 테베와 동일시됩니다.
    reason: cultural_note
  - marker: b
    text: ‘그것을’로도 옮길 수 있는데, 그 경우 지시 대상은 애굽이 됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 여호와
  alternatives_korean:
  - 여호와 만군의 하나님
  - 만군의 야훼
  lexicon: HALOT
  rationale: צְבָאוֹת의 군대적·천상적 폭을 살려 관용적으로 ‘만군의’로 옮기고, 프로젝트 기본값에 따라 신명은 ‘여호와’ 대신 ‘야훼’가 아니라 Korean publication readability를 위해 여기서는 경칭 결합형을 사용하지 않고 ‘여호와’ 계열보다 원문성 높은 ‘여호와’를 택하되, 본문에 바로 호칭을 붙였습니다.
- source_word: הִנְנִי פוֹקֵד
  english_pob_choice: Behold, I am about to punish
  chosen_korean: 보십시오, 내가 곧 … 벌하겠습니다
  alternatives_korean:
  - 보라, 내가 … 징벌하겠습니다
  - 보십시오, 내가 … 심판하겠습니다
  lexicon: HALOT
  rationale: הִנְנִי의 돌발적·선언적 즉시성을 ‘보십시오, 내가 곧’으로 살리고, פקד의 심판 문맥을 ‘벌하다’로 옮겨 ‘방문하다’ 같은 완곡어를 피했습니다.
- source_word: מִצְרַיִם / אֱלֹהֶיהָ / מְלָכֶיהָ
  english_pob_choice: Egypt, and her gods, and her kings
  chosen_korean: 애굽과 그 신들과 그 왕들
  alternatives_korean:
  - 애굽과 그녀의 신들과 그녀의 왕들
  - 애굽과 그들의 신들과 그들의 왕들
  lexicon: HALOT
  rationale: 히브리어의 여성 단수 접미사는 문법적 형태이지만 한국어에서는 ‘그’로 자연스럽게 처리해 대상의 소유 관계를 유지했습니다. ‘애굽’은 성경적 고유지명으로 굳어진 형태를 채택했습니다.
- source_word: הַבֹּטְחִים בּוֹ
  english_pob_choice: those who trust in him
  chosen_korean: 그를 신뢰하는 자들
  alternatives_korean:
  - 그를 의지하는 자들
  - 그에게 भरो하는 자들
  lexicon: HALOT
  rationale: ‘trust’의 외적 의존을 드러내는 ‘신뢰하다’를 택해 우상적·정치적 의탁의 뉘앙스를 살렸고, 완료된 관계절을 한국어 명사구로 자연화했습니다.
theological_decisions:
- issue: בּוֹ의 지시 대상
  chosen_reading: ‘그를’은 직전의 ‘바로’를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 애굽을 가리켜 ‘그것을’로 읽는 해석
  rationale: 가장 가까운 남성 단수 선행사는 반복된 ‘바로’이며, 문맥상 인간 군주에 대한 의탁을 겨냥한 심판 선언이 더 분명합니다.
  doctrine_reference: 문법적 선행사 판단
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절의 한국어 독서성은 높이되, 본문에서 신명 호칭을 유지해야 하므로 통용성이 높은 성경적 표기를 택했습니다.
  doctrine_reference: 전통적 고유명 표기
