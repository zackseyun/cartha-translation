translation:
  language: ko
  text: 이집트의 딸은 부끄러움을 당했습니다[a]. 그 여인은 북쪽의 한 백성의 손에 넘겨졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘손에’는 ‘권세 아래에’라는 관용적 의미를 가집니다.
