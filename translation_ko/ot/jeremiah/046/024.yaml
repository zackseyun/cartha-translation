  - 딸 이집트
  - 이집트
  lexicon: HALOT
  rationale: 나라를 의인화한 표현을 유지해야 하므로 단순히 ‘이집트’로 풀지 않고, ‘이집트의 딸’의 비유를 그대로 살렸습니다.
- source_word: נִתְּנָה
  english_pob_choice: she is given
  chosen_korean: 넘겨졌습니다
  alternatives_korean:
  - 주어졌습니다
  - 건네졌습니다
