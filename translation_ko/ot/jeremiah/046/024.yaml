lexical_decisions:
- source_word: הֹבִישָׁה
  english_pob_choice: is put to shame
  chosen_korean: 부끄러움을 당했습니다
  alternatives_korean:
  - 수치를 당했습니다
  - 창피를 당했습니다
  - 수치스럽게 되었습니다
  lexicon: HALOT
  rationale: 히필형 בוש의 수동적 결과를 한국어에서 자연스럽게 드러내기 위해 ‘부끄러움을 당하다’를 선택했습니다. 예언적 심판 맥락도 함께 살릴 수 있습니다.
- source_word: בַּת מִצְרַיִם
  english_pob_choice: the daughter of Egypt
  chosen_korean: 이집트의 딸
  alternatives_korean:
  - 이집트의 딸
  - 딸 이집트
  - 이집트
  lexicon: HALOT
  rationale: 나라를 의인화한 표현을 유지해야 하므로 단순히 ‘이집트’로 풀지 않고, ‘이집트의 딸’의 비유를 그대로 살렸습니다.
- source_word: נִתְּנָה
  english_pob_choice: she is given
  chosen_korean: 넘겨졌습니다
  alternatives_korean:
  - 주어졌습니다
  - 건네졌습니다
  - 넘겨졌습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘주다’보다, 적대자의 지배 아래로 이동되는 뉘앙스를 살리는 ‘넘겨지다’가 더 적절합니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 손 안에
  - 권세 아래
  - 힘에
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 반영하되 한국어에서도 이해 가능하도록 ‘손에’를 유지했습니다. 이는 권세 아래로 들어감을 뜻합니다.
- source_word: עַם צָפוֹן
  english_pob_choice: a people from the north
  chosen_korean: 북쪽의 한 백성
  alternatives_korean:
  - 북쪽에서 온 한 백성
  - 북쪽의 백성
  - 북쪽의 한 민족
  lexicon: HALOT
  rationale: 원문은 구체적 정체를 밝히지 않으므로, 역사적 해석을 본문에 덧붙이지 않고 집합적 표현 ‘한 백성’으로 남겼습니다.
theological_decisions:
- issue: 북쪽 백성의 역사적 정체를 본문에 드러낼지 여부
  chosen_reading: 본문은 그대로 ‘북쪽의 한 백성’으로 유지합니다.
  alternative_readings:
  - 바벨론으로 명시하기
  - 북방 군대로 풀어 번역하기
  rationale: 히브리어는 여기서 단지 ‘북쪽의 한 백성’이라고만 말하므로, 번역에서 역사적 식별을 앞서 해석하지 않고 예언적 표현을 보존합니다.
  doctrine_reference: Original-language primacy; preserve prophetic ambiguity
