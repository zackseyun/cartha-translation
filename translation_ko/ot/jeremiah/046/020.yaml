  yaml_path: translation/ot/jeremiah/046/020.yaml
  text: Egypt is a beautiful heifer; destruction from the north has come[a], it has come.
  footnotes:
  - marker: a
    text: Or 'a gadfly from the north'; the Hebrew noun is rare and some take it more broadly as 'destruction from the north.'
    reason: alternative_reading
translation:
  language: ko
  text: 이집트는 아름다운 어린 암소입니다. 북쪽에서 파리떼가 와서, 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '북쪽에서 온 파리떼'; 히브리어 명사는 희귀하며, 어떤 이들은 더 넓게 '북쪽에서 온 파멸'로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶגְלָה
  english_pob_choice: heifer
  chosen_korean: 어린 암소
  alternatives_korean:
  - 암송아지
  - 송아지
  - 암소
  lexicon: HALOT
  rationale: 여성형 어린 소 bovine 이미지를 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: יְפֵה פִיָּה
  english_pob_choice: beautiful
  chosen_korean: 아름다운
  alternatives_korean:
  - 아름답고 고운
  - 아름다운 모습의
  - 아리따운
  lexicon: HALOT
  rationale: 중첩된 형용사의 강한 미적 인상을 한국어의 간결한 형용사로 전달했습니다.
- source_word: קֶרֶץ
  english_pob_choice: biting fly
  chosen_korean: 파리떼
  alternatives_korean:
  - 독파리
  - 쇠파리
  - 해충
  lexicon: HALOT
  rationale: 어휘가 희귀하고 의미가 불확실하므로, POB의 주된 해석인 곤충 이미지를 살리되 한국어 독자가 즉시 이해할 수 있는 일반명으로 처리했습니다.
- source_word: בָּא בָא
  english_pob_choice: has come, it has come
  chosen_korean: 와서, 왔습니다
  alternatives_korean:
  - 왔고, 또 왔습니다
  - 옵니다, 옵니다
  - 오고 있습니다, 오고 있습니다
  lexicon: HALOT
  rationale: 반복을 유지해 히브리어의 강조를 살렸고, 예언적 완료의 확실성을 자연스럽게 표현했습니다.
theological_decisions:
- issue: קֶרֶץ의 의미가 '곤충'인지 '파멸'인지
  chosen_reading: 본문의 비유를 따라 곤충 이미지로 읽었습니다.
  alternative_readings:
  - 북쪽에서 온 파멸
  - 북쪽에서 온 재앙
  rationale: 시적 경고 문맥에서 구체적 이미지가 암소 비유와 더 잘 맞으며, 추상화하면 수사적 힘이 약해집니다.
  doctrine_reference: 예레미야의 심판 예언 수사
