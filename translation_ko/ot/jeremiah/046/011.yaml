source:
  edition: WLC
  text: עֲלִ֤י גִלְעָד֙ וּ/קְחִ֣י צֳרִ֔י בְּתוּלַ֖ת בַּת מִצְרָ֑יִם לַ/שָּׁוְא֙ הרביתי רְפֻא֔וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/011.yaml
  text: Go up to Gilead and get balm[a], virgin daughter of Egypt. In vain you have multiplied remedies[b]; there is no healing for you.
  footnotes:
  - marker: a
    text: 'Or ''To no avail you have used many remedies.'' The Hebrew verb form in ''you have multiplied'' is textually and morphologically difficult in the consonantal text, but the sense in context is clear: Egypt''s many treatments are futile.'
    reason: textual_variant
  - marker: b
    text: Gilead was known for its medicinal balm; the command is ironic, since even the best-known remedy will not heal Egypt.
    reason: cultural_note
translation:
  language: ko
  text: 길르앗으로 올라가서 향유를 가져오너라, 처녀 딸 이집트여. 네가 치료약을 많이 썼으나 헛되이 썼으니, 네게는 치유가 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘올라가서’는 원문의 지리적 상승 명령을 반영합니다.
    reason: source_note
  - marker: b
    text: ‘향유’는 길르앗의 약재적 발삼을 가리키는 말로, 본문은 그 유명한 치료 자원조차 이집트를 낫게 하지 못한다는 반어를 담고 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  english_pob_choice: Go up
  chosen_korean: 올라가서
  alternatives_korean:
  - 가서
  - 올라가라
  lexicon: HALOT
  rationale: 2인칭 여성 단수 명령형 עלה의 방향성을 살려 '올라가서'로 옮기면, 길르앗으로 향하는 지리적 이동과 명령의 힘을 함께 유지할 수 있습니다.
- source_word: צֳרִי
  english_pob_choice: balm
  chosen_korean: 향유
  alternatives_korean:
  - 유향
  - 발삼
  lexicon: HALOT
  rationale: 길르앗의 치료용 수지/발삼을 가리키는 말이므로, 한국어 성경에서 널리 통하는 약재 이미지인 '향유'로 옮겨 본문의 의학적·상징적 기능을 살렸습니다.
- source_word: בְּתוּלַת בַּת מִצְרַיִם
  english_pob_choice: virgin daughter of Egypt
  chosen_korean: 처녀 딸 이집트여
  alternatives_korean:
  - 이집트의 처녀 딸이여
  - 처녀 같은 이집트 딸이여
  lexicon: HALOT
  rationale: 예언적 의인화 호칭을 살리기 위해 호격으로 처리했고, '처녀 딸'의 수식 관계를 유지해 이집트에 대한 풍자적 호칭이라는 점을 드러냈습니다.
- source_word: רְפֻאוֹת / תְּעָלָה
  english_pob_choice: remedies / healing
  chosen_korean: 치료약 / 치유
  alternatives_korean:
  - 의약품 / 회복
  - 약들 / 낫는 것
  lexicon: HALOT
  rationale: 앞의 복수형 'remedies'는 시도된 치료 수단들을 가리키므로 '치료약'으로, 뒤의 결과 상태는 '치유'로 구분해 반복된 치유 시도와 최종 실패를 분명히 했습니다.
theological_decisions:
- issue: 예언적 조롱과 절망의 어조
  chosen_reading: 본문의 명령문을 실제 처방 권고가 아니라 조롱 섞인 예언적 반어로 유지했습니다.
  alternative_readings:
  - 중립적 권고문처럼 완화
  - 단순한 위로의 표현으로 조정
  rationale: 문맥상 이 명령은 이집트의 의술을 비웃는 반어이므로, 한국어에서도 명령형과 '헛되이'를 함께 살려 심판 선언의 성격을 흐리지 않았습니다.
  doctrine_reference: 예언서 수사와 심판 신탁
