reference: Jeremiah 46:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַדּ֖וּעַ נִסְחַ֣ף אַבִּירֶ֑י/ךָ לֹ֣א עָמַ֔ד כִּ֥י יְהוָ֖ה הֲדָפֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/015.yaml
  text: Why has your mighty one been swept away? He did not stand[a], for Yahweh drove him away.
  footnotes:
  - marker: a
    text: Or 'your mighty ones'; the Hebrew form may also be understood as 'your bull,' possibly referring to Apis, Egypt's sacred bull.
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 당신의 강한 자가 휩쓸려 갔습니까? 그는 버티지 못했습니다. 이는 야훼께서 그를 몰아내셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 강한 이들’ 또는 ‘당신의 황소’로도 이해할 수 있습니다. 히브리어 형태는 힘센 존재를 가리키며, 이집트의 성스러운 황소 아피스(ap̄is)를 암시할 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 이유로
  lexicon: HALOT
  rationale: 수사적 질문의 어조를 살리면서도 합쇼체 문맥에 자연스럽게 맞는 표현입니다.
- source_word: נִסְחַף
  english_pob_choice: has ... been swept away
  chosen_korean: 휩쓸려 갔습니다
  alternatives_korean:
  - 쓸려 갔습니다
  - 휩쓸렸습니다
  - 끌려갔습니다
  lexicon: HALOT
  rationale: ‘물결에 휩쓸리다’의 이미지와 패배로 무너져 가는 뉘앙스를 함께 살리기 위해 선택했습니다.
- source_word: אַבִּירֶיךָ
  english_pob_choice: your mighty one
  chosen_korean: 당신의 강한 자
  alternatives_korean:
  - 당신의 용사
  - 당신의 강한 이들
  - 당신의 황소
  lexicon: HALOT
  rationale: 문맥상 단수처럼 읽히는 점을 반영하되, 원어의 ‘강함/힘’을 드러내기 위해 ‘강한 자’로 옮겼습니다. 축자적으로 ‘황소’로 못 박지 않고 의미 범위를 유지했습니다.
- source_word: לֹא עָמַד
  english_pob_choice: He did not stand
  chosen_korean: 그는 버티지 못했습니다
  alternatives_korean:
  - 그는 서지 못했습니다
  - 그는 견디지 못했습니다
  - 그는 굳게 서지 못했습니다
  lexicon: HALOT
  rationale: 전투 맥락의 ‘서다/버티다’ 관용을 한국어로 자연스럽게 풀어, 무너져 패배하는 뜻을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 그대로의 고유명을 보존하는 프로젝트 기본 원칙에 따라 야훼를 사용했습니다.
- source_word: הֲדָפוֹ
  english_pob_choice: drove him away
  chosen_korean: 그를 몰아내셨기 때문입니다
  alternatives_korean:
  - 그를 밀어내셨기 때문입니다
  - 그를 쫓아내셨기 때문입니다
  - 그를 내쫓으셨기 때문입니다
  lexicon: HALOT
  rationale: 원어의 밀어내고 몰아붙이는 동작을 살리면서, 심판 문맥에 맞는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: אַבִּירֶיךָ의 단수/복수 및 ‘황소’ 가능성
  chosen_reading: 본문에는 ‘당신의 강한 자’로 두어 단수처럼 읽히는 문맥을 따르되, 암시적 동물 상징은 본문에 직접 넣지 않았습니다.
  alternative_readings:
  - 당신의 강한 이들
  - 당신의 황소
  rationale: 히브리어 형태는 복수/단수 해석과 상징적 의미 가능성을 모두 열어 두지만, 뒤의 단수 동사들이 단수적 이해를 강하게 지지하므로 본문은 절제된 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
