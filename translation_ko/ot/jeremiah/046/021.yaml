  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם שְׂכִרֶ֤י/הָ בְ/קִרְבָּ/הּ֙ כְּ/עֶגְלֵ֣י מַרְבֵּ֔ק כִּֽי גַם הֵ֧מָּה הִפְנ֛וּ נָ֥סוּ יַחְדָּ֖יו לֹ֣א עָמָ֑דוּ כִּ֣י י֥וֹם אֵידָ֛/ם בָּ֥א עֲלֵי/הֶ֖ם עֵ֥ת פְּקֻדָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/021.yaml
  text: Even her hired soldiers in her midst are like fattened calves; for even they have turned and fled together; they did not stand[a], for the day of their disaster has come upon them, the time of their punishment.
  footnotes:
  - marker: a
    text: Or 'the time of their visitation' or 'the time of their reckoning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 나라 안에 있는 고용된 병사들마저 우리에서 살찌운 송아지들 같습니다. 그들마저 돌아서 함께 달아났고, 버티지 못했습니다. 그들의 재앙의 날, 곧 그들이 벌을 받을 때가 그들에게 닥쳤기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 찾아오실 때’ 또는 ‘그들을 결산하실 때’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂכִרֶיהָ
  english_pob_choice: her hired soldiers
  chosen_korean: 품삯받은 병사들
  alternatives_korean:
  - 용병들
  - 고용된 병사들
  lexicon: HALOT
  rationale: שָׂכִיר는 ‘품삯받은 사람’이라는 기본 뜻이지만, 전쟁 맥락에서는 병력을 가리키므로 ‘병사들’로 구체화했습니다. ‘용병들’도 가능하지만, 본문이 강조하는 것은 고용 상태이지 현대적 뉘앙스의 민간 군사기업 용병이 아니므로 더 중립적인 표현을 택했습니다.
- source_word: בְקִרְבָּהּ
  english_pob_choice: in her midst
  chosen_korean: 그녀의 가운데 있는
  alternatives_korean:
  - 그녀의 한가운데 있는
  - 그녀 안에 있는
  lexicon: HALOT
  rationale: 직역하면 ‘그녀 가운데/한가운데’이므로 공간적 배치를 살려 ‘그녀의 가운데 있는’으로 옮겼습니다.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  english_pob_choice: like fattened calves
  chosen_korean: 살진 송아지들처럼
  alternatives_korean:
  - 우리에서 살찌운 송아지들처럼
  - 살이 오른 송아지들처럼
  lexicon: HALOT
  rationale: 마르베크는 살찌우기 위해 가둬 기른 송아지의 이미지이므로, 현대 한국어에서 가장 자연스럽고 의미를 드러내는 ‘살진 송아지들’로 옮겼습니다.
- source_word: עֵת פְּקֻדָּתָם
  english_pob_choice: the time of their punishment
  chosen_korean: 그들의 벌의 때
  alternatives_korean:
  - 그들의 심판의 때
  - 그들의 방문의 때
  - 그들의 결산의 때
  lexicon: HALOT
  rationale: 문맥상 פְּקֻדָּה는 중립적 ‘방문’보다 징벌적 의미가 앞서므로 ‘벌’로 옮겼습니다. 다만 원어가 포괄할 수 있는 ‘방문/결산’의 여지를 footnote로 남겼습니다.
theological_decisions:
- issue: פְּקֻדָּה의 판단적 의미를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘벌의 때’로 옮겨 예언적 심판의 강도를 분명히 드러냈습니다.
  alternative_readings:
  - ‘방문의 때’
  - ‘결산의 때’
  rationale: 이 절은 멸망의 날과 평행을 이루는 심판 선언이므로, 한국어 본문에서도 완곡한 표현보다 징벌성을 직접 드러내는 것이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 예언서의 심판 언어
