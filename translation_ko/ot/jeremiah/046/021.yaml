revisions:
- from: 그녀의 가운데 있는 품삯받은 병사들까지도 살진 송아지들처럼 되었으니, 그들조차도 돌아서 함께 달아났고 — 그들은 버티지 못했습니다. 그들의 재앙의 날이 그들에게 닥쳤고, 그들의 벌의 때가 이르렀기 때문입니다.[a]
  to: 그 나라 안에 있는 고용된 병사들마저 우리에서 살찌운 송아지들 같습니다. 그들마저 돌아서 함께 달아났고, 버티지 못했습니다. 그들의 재앙의 날, 곧 그들이 벌을 받을 때가 그들에게 닥쳤기 때문입니다.[a]
  rationale: 비교 표현에 덧붙은 ‘되다’를 제거하고, 마르베크의 우리 사육·비육 이미지를 반영했습니다. 이집트를 가리키는 대명사는 한국어에서 자연스러운 ‘그 나라’로 조정했습니다. פְּקֻדָּה는 본문에서 징벌적 문맥을 따라 ‘벌을 받을 때’로 번역하고, 의미 범위의 대안은 해당 어구에 연결된 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:27:44Z'
