  source_fidelity: 원문의 군사적 맥락에서 שְׂכִרֶיהָ를 ‘고용된 병사들’로 구체화한 것은 적절합니다. 다만 ‘살진 송아지들처럼 되었으니’는 원문의 비교 서술에 없는 변화 의미를 보태므로 수정이 필요합니다. 또한 פְּקֻדָּתָם은 문맥상 징벌적 의미가 우세하되, 한국어에서는 ‘그들이 벌을 받을 때’가 소유격과 사건적 의미를 자연스럽게 전달합니다.
  naturalness: ‘그녀의 가운데’와 ‘품삯받은 병사들’은 현대 표준 한국어 성경 문체로 다소 어색합니다. ‘그 나라 안에 있는 고용된 병사들’, ‘우리에서 살찌운 송아지들’은 지시 대상과 마르베크의 사육 이미지를 더 자연스럽고 정확하게 드러냅니다. ‘버티지 못했습니다’는 לֹא עָמָדוּ의 군사적 함의를 자연스럽게 보존합니다.
  terminology: ‘고용된 병사들’은 현대적 민간 군사기업 등의 뉘앙스를 수반할 수 있는 ‘용병’보다 중립적입니다. פְּקֻדָּה의 본문 번역은 ‘벌을 받을 때’로 하되, 대안적 ‘찾아오심’과 ‘결산’은 각주에서 보존합니다.
