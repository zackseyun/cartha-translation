  naturalness: ‘걸려 넘어지는 자를 많이 늘리셨습니다’와 ‘자기 동무에게 넘어집니다’는 현대 한국어에서 다소 부자연스럽고 의미가 흐립니다. 또한 인용문 안의 ‘압제자의 칼을 피해’가 독립된 문장 파편처럼 처리되어 있으므로, 목적·이유를 나타내는 연결 표현으로 인용문 안에 결합해야 합니다.
