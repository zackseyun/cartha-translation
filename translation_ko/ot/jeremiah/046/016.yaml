revisions:
- from: 그는 걸려 넘어지는 자를 많이 늘리셨습니다. 실제로 각 사람은 자기 동무에게 넘어집니다. 그리고 그들은 말합니다. “일어나자. 우리 백성과 우리 출생의 땅으로 돌아가자. 압제자의 칼을 피해.”[a]
  to: 그는 많은 사람이 비틀거리게 하셨습니다. 참으로 사람마다 서로에게 넘어집니다. 그들이 말합니다. “일어나서 우리 백성에게, 우리 고향 땅으로 돌아가자. 압제자의 칼을 피해서.”[a]
  rationale: 사역형 동사의 결과를 자연스러운 한국어로 드러내고, 전투 중 상호 충돌하여 넘어지는 모습을 정확히 표현했습니다. 귀향 권유와 칼을 피하려는 이유를 하나의 온전한 직접화법으로 연결했습니다. 논쟁 가능한 הַיּוֹנָה의 문자적 독법은 각주에 그대로 보존했습니다.
