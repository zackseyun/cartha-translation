source:
  edition: WLC
  text: הִרְבָּ֖ה כּוֹשֵׁ֑ל גַּם נָפַ֞ל אִ֣ישׁ אֶל רֵעֵ֗/הוּ וַ/יֹּֽאמְרוּ֙ ק֣וּמָ/ה וְ/נָשֻׁ֣בָה אֶל עַמֵּ֗/נוּ וְ/אֶל אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/נוּ מִ/פְּנֵ֖י חֶ֥רֶב הַ/יּוֹנָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/016.yaml
  text: He has multiplied the stumbling; indeed[a], each man falls against his companion, and they say, “Come, and let us return to our people and to the land of our birth, away from the sword of the oppressor.”
  footnotes:
  - marker: a
    text: Or “the sword of the dove.” The Hebrew word can be read this way literally, but in context it is commonly understood to mean “the oppressor” or “the violent one.”
    reason: alternative_reading
translation:
  language: ko
  text: 그는 많은 사람이 비틀거리게 하셨습니다. 참으로 사람마다 서로에게 넘어집니다. 그들이 말합니다. “일어나서 우리 백성에게, 우리 고향 땅으로 돌아가자. 압제자의 칼을 피해서.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “비둘기의 칼”로도 읽을 수 있습니다. 그러나 문맥에서는 일반적으로 “압제자의 칼” 또는 “폭력적인 자의 칼”로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְבָּה
  english_pob_choice: He has multiplied
  chosen_korean: 많이 늘리셨습니다
  alternatives_korean:
  - 증가시키셨습니다
  - 늘리셨습니다
  lexicon: HALOT
  rationale: 히필형 רבה의 사역적 의미를 살려 ‘많이 늘리다’로 옮기고, 문맥상 하나님이 암시되는 수동형 영어보다 한국어에서는 주어를 드러내지 않은 채 높임 종결로 처리했습니다.
- source_word: כּוֹשֵׁל
  english_pob_choice: the stumbling
  chosen_korean: 걸려 넘어지는 자
  alternatives_korean:
  - 넘어지는 자
  - 넘어짐
  lexicon: HALOT
  rationale: 분사형의 압축된 표현을 한국어에서 사람을 가리키는 말로 풀어, 단순 상태명사보다 행위 주체가 보이도록 했습니다.
- source_word: נָפַל אִישׁ אֶל רֵעֵהוּ
  english_pob_choice: each man falls against his companion
  chosen_korean: 각 사람은 자기 동무에게 넘어집니다
  alternatives_korean:
  - 사람마다 자기 이웃에게 넘어집니다
  - 각 사람은 동무에게 쓰러집니다
  lexicon: HALOT
  rationale: אישׁ의 분배적 의미를 ‘각 사람’으로 살리고, אֶל רֵעֵהוּ를 전투적 혼란 속에서 서로 부딪혀 넘어지는 장면으로 자연스럽게 옮겼습니다.
- source_word: מִפְּנֵי חֶרֶב הַיּוֹנָה
  english_pob_choice: away from the sword of the oppressor
  chosen_korean: 압제자의 칼을 피해
  alternatives_korean:
  - 압제자의 칼 앞에서
  - 비둘기의 칼을 피해
  lexicon: HALOT
  rationale: 문맥상 הַיּוֹנָה를 ‘압제자’로 이해한 영어 POB를 따라, 도피의 방향성을 한국어 조사 ‘-을 피해’로 분명히 했습니다.
theological_decisions:
- issue: 히브리어 הַיּוֹנָה의 의미를 어떻게 처리할지
  chosen_reading: 문맥에 따라 ‘압제자’로 번역했습니다.
  alternative_readings:
  - ‘비둘기’로 직역함
  - ‘포악한 자’로 옮김
  rationale: 전쟁과 후퇴의 문맥에서 ‘비둘기의 칼’은 한국어 독자에게도 난해하므로, 본문이 의도하는 위협의 의미를 드러내는 해석을 본문에 반영하고 대안은 각주로 남기는 편이 더 충실합니다.
  doctrine_reference: 해석학적 분기; 교리 쟁점 아님
