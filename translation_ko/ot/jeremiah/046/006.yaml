revisions:
- from: 빠른 사람도 도망치지 못하고, 용사도 벗어나지 못합니다. 북쪽, 곧 유프라테스 강가에서 그들은 넘어져 쓰러졌습니다.
  to: 날랜 자도 도망치지 못할 것이며, 용사도 벗어나지 못할 것입니다. 북쪽 유프라테스 강가에서 그들은 비틀거리다가 쓰러졌습니다.
  rationale: 'The revision restores the prospective prohibitive/jussive effect in idiomatic Korean, removes the unsupported "곧," and differentiates the two final defeat verbs. No footnote is required: "북쪽" is a defensible contextual rendering of the directional form, and "강가에서" adequately communicates the Hebrew idiom in the main text.'
  reviewer_model: gpt-5.6-terra
