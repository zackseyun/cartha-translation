review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the military setting and the Euphrates location, but its first two clauses convert the Hebrew third-person prohibitions/jussives (אַל + imperfect) into present statements of inability. The added explicative "곧" is not represented in the source. The paired perfect verbs are better differentiated as stumbling/faltering and falling rather than the somewhat tautological "넘어져 쓰러졌습니다."
  naturalness: The proposed revision uses natural contemporary formal Korean while retaining a restrained prophetic register. "날랜 자" and "용사" suit the poetic-military context, and "비틀거리다가 쓰러졌습니다" clearly conveys the sequential defeat image.
  terminology: '"용사" is an appropriate contextual rendering of גִּבּוֹר. "유프라테스 강가" naturally renders the geographical idiom עַל־יַד נְהַר־פְּרָת. No theological terminology is at issue.'
  issues:
  - severity: medium
    issue: The prohibitive/jussive force is rendered as simple inability.
    rationale: '"도망치지 못하고 ... 벗어나지 못합니다" reads primarily as a present factual declaration, whereas אַל יָנוּס ... וְאַל יִמָּלֵט expresses a third-person prohibition in the prophetic pronouncement. Korean "-지 못할 것입니다" preserves the outcome-oriented force without supplying an unexpressed addressee.'
  - severity: low
    issue: '"곧" adds an explanatory relation absent from the Hebrew.'
    rationale: צָפוֹנָה and the Euphrates phrase stand in apposition as location specifications; simply placing them together preserves the source without added interpretation.
  - severity: low
    issue: The final paired verbs are unnecessarily overlapping in Korean.
    rationale: כָּשְׁלוּ and נָפָלוּ portray stumbling/faltering and falling. Distinguishing the actions more closely reflects the Hebrew sequence.
  revised_text: 날랜 자도 도망치지 못할 것이며, 용사도 벗어나지 못할 것입니다. 북쪽 유프라테스 강가에서 그들은 비틀거리다가 쓰러졌습니다.
  revised_footnotes: []
  revision_rationale: 'The revision restores the prospective prohibitive/jussive effect in idiomatic Korean, removes the unsupported "곧," and differentiates the two final defeat verbs. No footnote is required: "북쪽" is a defensible contextual rendering of the directional form, and "강가에서" adequately communicates the Hebrew idiom in the main text.'
