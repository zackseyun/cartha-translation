id: JER.46.6
reference: Jeremiah 46:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל יָנ֣וּס הַ/קַּ֔ל וְ/אַל יִמָּלֵ֖ט הַ/גִּבּ֑וֹר צָפ֨וֹנָ/ה֙ עַל יַ֣ד נְהַר פְּרָ֔ת כָּשְׁל֖וּ וְ/נָפָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/006.yaml
  text: Let not the swift flee[a], and let not the mighty man escape; in the north, by the bank of the Euphrates River[c][b], they have stumbled and fallen.
  footnotes:
  - marker: a
    text: Or 'northward' or 'to the north.' The Hebrew form צָפוֹנָה can be understood directionally as well as locationally.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by the hand of the Euphrates River,' a Hebrew idiom meaning 'beside' or 'along the side of' the river.
    reason: lexical_alternative
  - marker: c
    text: Or 'the warrior' for 'the mighty man.' The Hebrew גִּבּוֹר often refers to a strong or valiant fighter.
    reason: lexical_alternative
translation:
  language: ko
  text: 날랜 자도 도망치지 못할 것이며, 용사도 벗어나지 못할 것입니다. 북쪽 유프라테스 강가에서 그들은 비틀거리다가 쓰러졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יָנוּס הַקַּל
  english_pob_choice: Let not the swift flee
  chosen_korean: 빠른 사람도 도망치지 못하고
  alternatives_korean:
  - 빠른 자도 도망하지 못하고
  - 날랜 자도 도망치지 못하고
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지문을 한국어에서는 자연스러운 부정 종결로 옮겼고, הַקַּל은 전투 문맥에서 ‘빠른 사람/날랜 자’로 이해할 수 있어 간결하게 처리했습니다.
- source_word: וְאַל יִמָּלֵט הַגִּבּוֹר
  english_pob_choice: and let not the mighty man escape
  chosen_korean: 용사도 벗어나지 못합니다
  alternatives_korean:
  - 용사도 피하지 못합니다
  - 강한 사람도 빠져나가지 못합니다
  lexicon: HALOT
  rationale: גִּבּוֹר는 단순한 ‘힘센 사람’보다 전투적 뉘앙스가 강해 ‘용사’가 문맥을 잘 살리며, יִמָּלֵט은 ‘벗어나다/빠져나가다’로 자연스럽게 옮길 수 있습니다.
- source_word: צָפוֹנָה
  english_pob_choice: in the north / northward
  chosen_korean: 북쪽
  alternatives_korean:
  - 북쪽으로
  - 북쪽에서
  lexicon: HALOT
  rationale: צָפוֹנָה는 방향과 위치를 모두 가리킬 수 있으나, 뒤의 지리 표지와 함께 한국어에서는 ‘북쪽’이 가장 간결하고 자연스럽습니다.
- source_word: עַל יַד נְהַר פְּרָת
  english_pob_choice: by the bank of the Euphrates River
  chosen_korean: 유프라테스 강가에서
  alternatives_korean:
  - 유프라테스 강변에서
  - 유프라테스 강가 곁에서
  lexicon: HALOT
  rationale: עַל יַד의 관용적 의미를 한국어의 지리 표현으로 풀어 ‘강가에서’로 옮겼고, נְהַר פְּרָת은 ‘유프라테스 강’으로 자연스럽게 처리했습니다.
- source_word: כָּשְׁלוּ וְנָפָלוּ
  english_pob_choice: they have stumbled and fallen
  chosen_korean: 그들은 넘어져 쓰러졌습니다
  alternatives_korean:
  - 그들은 비틀거려 넘어졌습니다
  - 그들은 걸려 넘어져 엎어졌습니다
  lexicon: HALOT
  rationale: 두 동사는 연속적인 패배의 이미지를 압축적으로 나타내므로, 한국어에서도 ‘넘어져 쓰러졌습니다’로 겹침을 살려 속도감 있게 옮겼습니다.
theological_decisions:
- issue: 예언적 금지문의 한국어 어조
  chosen_reading: 직설적인 명령형보다 ‘-지 못합니다’로 옮겨, 패배의 불가피성을 선언하는 예언 어조를 살렸습니다.
  alternative_readings:
  - ‘도망치지 마라’
  - ‘도망칠 수 없습니다’
  rationale: 이 절은 단순 권고가 아니라 전투 패배를 선포하는 예언적 선언이므로, 한국어에서는 금지와 불능의 의미를 함께 드러내는 표현이 가장 적합합니다.
  doctrine_reference: 예레미야서의 심판 예언과 하나님의 주권적 선언
- issue: ‘용사’의 전투적 뉘앙스
  chosen_reading: גִּבּוֹר를 ‘용사’로 번역해, 단순한 체력보다 전쟁에서의 강함과 용맹을 드러냈습니다.
  alternative_readings:
  - 강한 사람
  - 힘센 사람
  - 전사
  rationale: 문맥상 일반적 신체 강인함이 아니라 전투력 있는 병사를 가리키므로, ‘용사’가 독자의 이해에 가장 직접적입니다.
  doctrine_reference: 히브리어 גִּבּוֹר의 군사적 용례
