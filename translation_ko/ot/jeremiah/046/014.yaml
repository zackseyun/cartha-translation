revisions:
- from: 이집트에서 선포하고, 믹돌에서 전파하며, 놉과 다르하네스에서 전파하십시오. 말하기를, ‘자리를 잡고 준비하라. 칼이 네 주위의 모든 것을 삼켰다.’[a]
  to: 이집트에 알리십시오. 믹돌에서 알리십시오. 놉[a]과 다브네스에서 알리십시오. 말하십시오. ‘자리를 잡고 준비하십시오. 칼이 네 주위에 있는 이들을 삼켜 버렸습니다.’
  rationale: 복수 명령으로 여러 이집트 지역에 알리라는 도입부와, 인용문 안에서 이집트를 인격화하여 단수로 부르는 전환을 보존했습니다. 히브리어 완료형 אָכְלָה의 재난이 이미 닥친 듯한 힘은 ‘삼켜 버렸습니다’로 살렸습니다. 지명 각주의 위치와 합쇼체 문체를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
