id: JER.46.14
reference: Jeremiah 46:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַגִּ֤ידוּ בְ/מִצְרַ֨יִם֙ וְ/הַשְׁמִ֣יעוּ בְ/מִגְדּ֔וֹל וְ/הַשְׁמִ֥יעוּ בְ/נֹ֖ף וּ/בְ/תַחְפַּנְחֵ֑ס אִמְר֗וּ הִתְיַצֵּב֙ וְ/הָכֵ֣ן לָ֔/ךְ כִּֽי אָכְלָ֥ה חֶ֖רֶב סְבִיבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/014.yaml
  text: Declare it in Egypt[a], and proclaim it in Migdol; proclaim it in Noph and in Tahpanhes. Say, ‘Take your stand and prepare yourself, for the sword has devoured those around you.’
  footnotes:
  - marker: a
    text: Noph is the Hebrew name for Memphis.
    reason: alternative_reading
translation:
  language: ko
  text: 이집트에서 선포하고, 믹돌에서 전파하며, 놉과 다르하네스에서 전파하십시오. 말하기를, ‘자리를 잡고 준비하라. 칼이 네 주위의 모든 것을 삼켰다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 놉은 히브리어 지명으로, 멤피스에 해당합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּידוּ
  english_pob_choice: Declare it
  chosen_korean: 선포하고
  alternatives_korean:
  - 알리고
  - 선언하고
  lexicon: HALOT
  rationale: 공적인 외침을 요구하는 히필 명령형이므로, 단순한 ‘알리다’보다 공식적이고 선포적 뉘앙스가 있는 ‘선포하다’가 더 적절합니다.
- source_word: וְהַשְׁמִיעוּ
  english_pob_choice: proclaim
  chosen_korean: 전파하며
  alternatives_korean:
  - 외치며
  - 알리며
  lexicon: HALOT
  rationale: ‘듣게 하다’의 공적 공표 의미를 살리기 위해 ‘전파하다’를 택했고, 앞의 ‘선포하다’와 구별되면서도 반복된 명령의 병렬성을 유지했습니다.
- source_word: הִתְיַצֵּב
  english_pob_choice: Take your stand
  chosen_korean: 자리를 잡고
  alternatives_korean:
  - 굳게 서고
  - 맞서고
  lexicon: HALOT
  rationale: 히트파엘 명령형의 자기-준비/자기-위치 취하는 뜻을 살리되, 한국어에서 자연스럽고 군사적 긴박감을 담는 표현으로 옮겼습니다.
- source_word: וְהָכֵן לָךְ
  english_pob_choice: prepare yourself
  chosen_korean: 준비하라
  alternatives_korean:
  - 스스로 준비하라
  - 몸을 갖추어라
  lexicon: HALOT
  rationale: לָךְ가 반사적 뉘앙스를 주지만, 한국어에서는 명령형만으로도 충분히 자기준비의 의미가 전달되므로 간결하게 처리했습니다.
- source_word: סְבִיבֶיךָ
  english_pob_choice: all around you
  chosen_korean: 네 주위의 모든 것을
  alternatives_korean:
  - 네 주위의 것들을
  - 네 주변을
  lexicon: HALOT
  rationale: 구문상 ‘네 주위에 있는 것들/사람들’보다 둘러싼 파괴의 범위를 포괄하는 표현이 필요하므로, POB의 최종 의도에 맞춰 포위된 상태의 전면성을 드러냈습니다.
theological_decisions:
- issue: 2인칭 단수 대명사의 유지
  chosen_reading: 명령과 귀결을 모두 단수 2인칭으로 유지하여, 이집트를 인격화한 직접 호소로 읽히게 했습니다.
  alternative_readings:
  - 이집트 내부의 복수 대상에게 맞추어 복수로 완화하기
  - 한국어에서 비인칭화하여 주어를 흐리게 하기
  rationale: 히브리어가 도시들을 향한 공포의 선포 뒤에 이집트를 단수로 호명하는 수사적 전환을 보이므로, 이를 평탄화하지 않고 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, points 3 and 4
